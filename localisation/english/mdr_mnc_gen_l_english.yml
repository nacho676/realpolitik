l_english:
 mdr_mnc_nat_exxonmobil: "Nationalize ExxonMobil"
 mdr_mnc_nat_exxonmobil_desc: "§YExxonMobil§! (oil and gas, headquartered in the United States) operates here at level §Y[?ROOT.mdr_mnc_exxonmobil]§! of 5. If we nationalize it, the state company keeps 61% of its profit, but its home country takes offence and investors will charge more for five years."
