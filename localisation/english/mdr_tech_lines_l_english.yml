l_english:
 mdr_ammo_tech_1: "Ammunition Assembly Chains"
 mdr_ammo_tech_1_desc: "Each station does one task, and the plant makes far more."
 mdr_ammo_tech_2: "Reliable Fuzes"
 mdr_ammo_tech_2_desc: "Fewer duds, and less ammunition spent to achieve the same result."
 mdr_ammo_tech_3: "Automatic Cartridge Lines"
 mdr_ammo_tech_3_desc: "Machines assemble cartridges nonstop, with fewer hands and fewer errors."
 mdr_ammo_tech_4: "Double-Base Propellants"
 mdr_ammo_tech_4_desc: "More stable propellants that keep longer in storage."
 mdr_ammo_tech_5: "High-Speed Presses"
 mdr_ammo_tech_5_desc: "Presses form casings in a fraction of the time."
 mdr_ammo_tech_6: "Insensitive Explosives"
 mdr_ammo_tech_6_desc: "Charges that withstand shock and heat can be stacked more safely."
 mdr_ammo_tech_7: "Modular Ammunition Plants"
 mdr_ammo_tech_7_desc: "Lines switch caliber in hours, not weeks."
 mdr_ammo_tech_8: "Polymer Casings"
 mdr_ammo_tech_8_desc: "Light, cheap casings save metal."
 mdr_ammo_tech_9: "Printed Charges"
 mdr_ammo_tech_9_desc: "Charges printed layer by layer, tailored to each weapon."
 mdr_ammo_tech_10: "Automated Depots"
 mdr_ammo_tech_10_desc: "Underground depots run almost without staff."
 mdr_ammo_tech_11: "Lights-Out Manufacturing"
 mdr_ammo_tech_11_desc: "Plants run around the clock with no one on the line."
 mdr_ammo_tech_12: "Nanoenergetics"
 mdr_ammo_tech_12_desc: "Materials release their energy precisely and stably."
 mdr_clean_tech_1: "Particulate Filters"
 mdr_clean_tech_1_desc: "Chimney filters catch soot before it escapes."
 mdr_clean_tech_2: "Gas Scrubbers"
 mdr_clean_tech_2_desc: "Towers strip sulfur from factory smoke."
 mdr_clean_tech_3: "Effluent Treatment"
 mdr_clean_tech_3_desc: "Plants clean water before it returns to the rivers."
 mdr_clean_tech_4: "Cleaner Production"
 mdr_clean_tech_4_desc: "Redesigning processes to emit less from the start."
 mdr_clean_tech_5: "Circular Economy"
 mdr_clean_tech_5_desc: "One factory's waste is another's raw material."
 mdr_clean_tech_6: "Carbon Capture"
 mdr_clean_tech_6_desc: "Trapping chimney CO2 and storing it underground."
 mdr_clean_tech_7: "Green Chemistry"
 mdr_clean_tech_7_desc: "Reactions that use fewer toxic substances."
 mdr_clean_tech_8: "Carbon-Free Steel and Cement"
 mdr_clean_tech_8_desc: "Hydrogen and new kilns for the highest-emitting industries."
 mdr_clean_tech_9: "Direct Air Capture"
 mdr_clean_tech_9_desc: "Plants remove already emitted CO2 from the air."
 mdr_clean_tech_10: "Zero-Emission Industry"
 mdr_clean_tech_10_desc: "Factories leave nothing in the air or water."
 mdr_adapt_tech_1: "Risk Mapping"
 mdr_adapt_tech_1_desc: "Knowing which areas flood or burn makes prevention possible."
 mdr_adapt_tech_2: "Climate Building Codes"
 mdr_adapt_tech_2_desc: "Buildings designed to withstand storms and heatwaves."
 mdr_adapt_tech_3: "Satellite Early Warning"
 mdr_adapt_tech_3_desc: "Days of warning to evacuate and protect what matters."
 mdr_adapt_tech_4: "Coastal and River Defenses"
 mdr_adapt_tech_4_desc: "Dikes and barriers grow with the water level."
 mdr_adapt_tech_5: "Sponge Cities"
 mdr_adapt_tech_5_desc: "Soil and parks absorb rain instead of flooding."
 mdr_adapt_tech_6: "Resilient Infrastructure"
 mdr_adapt_tech_6_desc: "Grids and roads keep working through the disaster."
 mdr_adapt_tech_7: "Precision Climate Modeling"
 mdr_adapt_tech_7_desc: "Predicting each extreme event in time to act."
