l_english:
 mdr_alert_ammo: "§RAmmunition Running Low§!"
 mdr_alert_ammo_Desc: "At the current pace of fighting, ammunition lasts §Y[?mdr_ammo_days_left|0]§! days. Without it the army loses attack and defense.\n\nRaise production (more military factories) or buy abroad (decisions, §YAmmunition Procurement§!)."
 mdr_alert_food: "§RFood Shortage§!"
 mdr_alert_food_Desc: "We cannot grow or import all the food we need. Once the stores run dry people go hungry: stability falls and population grows less.\n\nBuild §YCropland§! or open trade to import more."
 mdr_alert_unrest: "§RPent-Up Discontent§!"
 mdr_alert_unrest_Desc: "Banning protests and unions quiets the streets, but anger builds up: hidden unrest stands at §Y[?mdr_unrest_hidden|0]§! of 100. Above 60 it can burst into a social crisis.\n\nFreeing the right of assembly lets the pressure out."
 mdr_alert_strait: "§RSea Trade Cut§!"
 mdr_alert_strait_Desc: "A strait is closed. Trade routes through it look for another way, and trade with no way out is lost. Oil prices rise worldwide."
 mdr_alert_uranium: "§RUranium Shortage§!"
 mdr_alert_uranium_Desc: "Our nuclear plants need more uranium than we mine or import, and generate less power.\n\nBuild §YUranium Mines§! on a deposit or buy uranium on the world market."
 mdr_alert_rare_earths: "§YRare Earth Shortage§!"
 mdr_alert_rare_earths_Desc: "Microchip plants use more rare earths than we have and produce less.\n\nBuild §YRare Earth Complexes§! on a deposit or import them."
 mdr_province_workers_k: "Provincial building workers (thousands)"
