l_english:
 mdr_mongolia_focus: "Mongolia"
 mdr_mon_P1: "The 2000 State Great Khural Election"
 mdr_mon_P1_desc: "The People's Party won 72 of the 76 seats. A new period begins."
 mdr_mon_P2: "The Enkhbayar Government"
 mdr_mon_P2_desc: "A reformist prime minister leading a party that comes from the old regime."
 mdr_mon_P3: "Civil Service Reform"
 mdr_mon_P3_desc: "Fewer political posts and more career officials."
 mdr_mon_P4: "The 2006 Anti-Corruption Law"
 mdr_mon_P4_desc: "The Independent Authority Against Corruption is born."
 mdr_mon_P5: "The 2004 Coalition"
 mdr_mon_P5_desc: "A hung Great Khural forces the two big parties to govern together."
 mdr_mon_P6: "The 1 July 2008 Riots"
 mdr_mon_P6_desc: "Fraud claims, the party headquarters on fire and five dead. We must decide how to respond."
 mdr_mon_P7A: "Consolidated Democracy"
 mdr_mon_P7A_desc: "Clean elections, alternation in power and a press free to criticise."
 mdr_mon_P8A: "Transparency Law"
 mdr_mon_P8A_desc: "Public accounts open to everyone."
 mdr_mon_P9A: "Decentralisation of the Aimags"
 mdr_mon_P9A_desc: "The provinces run part of their own budget."
 mdr_mon_P10A: "The 2019 Constitutional Reform"
 mdr_mon_P10A_desc: "A single presidential term and a stronger prime minister."
 mdr_mon_P11A: "Citizen Oversight of Mining"
 mdr_mon_P11A_desc: "Mining contracts go through the Great Khural and are published."
 mdr_mon_P7B: "People's Party Hegemony"
 mdr_mon_P7B_desc: "The party controls the state, the unions and the public companies."
 mdr_mon_P8B: "Friendly Media"
 mdr_mon_P8B_desc: "The critical press loses state advertising."
 mdr_mon_P9B: "Mining Patronage"
 mdr_mon_P9B_desc: "Mining licences are shared among the loyal."
 mdr_mon_P10B: "Developmental State"
 mdr_mon_P10B_desc: "The state steers investment towards industry."
 mdr_mon_P11B: "Orderly Succession"
 mdr_mon_P11B_desc: "The party picks its successors without upheaval."
 mdr_mon_P7C: "The Strongman"
 mdr_mon_P7C_desc: "The Great Khural is suspended. Order first, elections later."
 mdr_mon_P8C: "Watching the Capital"
 mdr_mon_P8C_desc: "Cameras and agents in every district of Ulaanbaatar."
 mdr_mon_P9C: "A Loyal Army"
 mdr_mon_P9C_desc: "The generals receive promotions and business."
 mdr_mon_P10C: "The Mining State"
 mdr_mon_P10C_desc: "Foreign mines pass into state hands."
 mdr_mon_P11C: "The Leader's Referendum"
 mdr_mon_P11C_desc: "A plebiscite to stay on without term limits."
 mdr_mon_P12: "The End of the Transition"
 mdr_mon_P12_desc: "Thirty years after communism, the political system has taken its shape."
 mdr_mon_E1: "National Geological Survey"
 mdr_mon_E1_desc: "Map what lies under the steppe and the Gobi."
 mdr_mon_E2: "The Discovery of Oyu Tolgoi"
 mdr_mon_E2_desc: "One of the world's largest copper and gold deposits, in the southern Gobi (2001)."
 mdr_mon_E3: "Modernise Erdenet"
 mdr_mon_E3_desc: "The copper mine shared with Russia gets new equipment."
 mdr_mon_E4: "Tavan Tolgoi"
 mdr_mon_E4_desc: "One of the largest untapped coal deposits in the world."
 mdr_mon_E5A: "Open the Doors"
 mdr_mon_E5A_desc: "The big foreign mining companies are welcome."
 mdr_mon_E6A: "The 2009 Investment Agreement"
 mdr_mon_E6A_desc: "Rio Tinto and Ivanhoe commit to building the mine; the state keeps 34%."
 mdr_mon_E7A: "The Ulaanbaatar Stock Exchange"
 mdr_mon_E7A_desc: "Local capital for local companies."
 mdr_mon_E5B: "Resource Nationalism"
 mdr_mon_E5B_desc: "A 68% windfall tax on copper and gold (2006)."
 mdr_mon_E6B: "Erdenes Mongol"
 mdr_mon_E6B_desc: "A state company with a share of every big project."
 mdr_mon_E7B: "Mongolia for the Mongols"
 mdr_mon_E7B_desc: "The country's resources, for the country."
 mdr_mon_E8: "Copper Export Duty"
 mdr_mon_E8_desc: "Every truck crossing the border leaves something behind."
 mdr_mon_E9: "The Coal Railway"
 mdr_mon_E9_desc: "A line from Tavan Tolgoi to the Chinese border."
 mdr_mon_E10A: "Russian Gauge"
 mdr_mon_E10A_desc: "The tracks follow the Russian gauge: the railway stays tied to Moscow."
 mdr_mon_E10B: "Chinese Gauge"
 mdr_mon_E10B_desc: "Exporting to China gets cheaper, but we depend more on Beijing."
 mdr_mon_E11: "Human Development Fund"
 mdr_mon_E11_desc: "Cash handouts from mining revenue (2008)."
 mdr_mon_E12: "Future Heritage Fund"
 mdr_mon_E12_desc: "Save the mining revenue for when the copper runs out."
 mdr_mon_E13: "Our Own Copper Smelter"
 mdr_mon_E13_desc: "Sell cathodes, not just concentrate."
 mdr_mon_E14: "Dornod Uranium"
 mdr_mon_E14_desc: "Reopen the Soviet-era mine in the east."
 mdr_mon_E15: "The 2009 Nuclear Energy Law"
 mdr_mon_E15_desc: "MonAtom is created to sell the uranium."
 mdr_mon_E16: "Khalzan Buregtei Rare Earths"
 mdr_mon_E16_desc: "A rare earth deposit in Khovd."
 mdr_mon_E17: "Cashmere"
 mdr_mon_E17_desc: "Mongolia produces about a third of the world's cashmere: we should spin it at home."
 mdr_mon_E18: "Steppe Tourism"
 mdr_mon_E18_desc: "Ger camps, the Gobi and the Naadam for visitors."
 mdr_mon_E19: "Sainshand Industrial City"
 mdr_mon_E19_desc: "Refinery, steel and chemicals in the desert."
 mdr_mon_E20: "IMF Programme"
 mdr_mon_E20_desc: "A bailout in exchange for spending cuts (2017)."
 mdr_mon_E21: "A Stable Tögrög"
 mdr_mon_E21_desc: "Less inflation and cheaper debt."
 mdr_mon_E22: "The Ten-Million Economy"
 mdr_mon_E22_desc: "An economy that no longer lives on copper alone."
 mdr_mon_S1: "Dzud Emergency"
 mdr_mon_S1_desc: "The winters of 1999-2002 killed about 11 million animals. Fodder, transport and aid."
 mdr_mon_S2: "National Fodder Reserves"
 mdr_mon_S2_desc: "Hay stores in every province for the next dzud."
 mdr_mon_S3: "Index-Based Livestock Insurance"
 mdr_mon_S3_desc: "Insurance that pays out by local livestock losses (2005)."
 mdr_mon_S4: "Steppe Wells"
 mdr_mon_S4_desc: "Water for the herds and for a few crops."
 mdr_mon_S5: "Herder Cooperatives"
 mdr_mon_S5_desc: "Together they sell wool and meat for more."
 mdr_mon_S6: "A Vet in Every Sum"
 mdr_mon_S6_desc: "Fewer animals lost to disease."
 mdr_mon_S7: "The 2010 Dzud"
 mdr_mon_S7_desc: "Another terrible winter. With reserves and insurance, the damage is far smaller."
 mdr_mon_S8: "The Ger Districts"
 mdr_mon_S8_desc: "Half the country moved to Ulaanbaatar, into yurt districts with no services."
 mdr_mon_S9: "Ulaanbaatar's Smog"
 mdr_mon_S9_desc: "Coal stoves make the capital one of the most polluted in the world."
 mdr_mon_S10A: "Clean Stoves"
 mdr_mon_S10A_desc: "Subsidies to replace the stoves: quick but costly."
 mdr_mon_S10B: "Apartments for the Ger Districts"
 mdr_mon_S10B_desc: "New neighbourhoods with central heating."
 mdr_mon_S11: "Salkhit Wind Farm"
 mdr_mon_S11_desc: "The country's first wind farm (2013)."
 mdr_mon_S12: "The Great Green Wall"
 mdr_mon_S12_desc: "Trees against the advance of the desert."
 mdr_mon_S13: "Water for the Gobi"
 mdr_mon_S13_desc: "Deep wells and pipelines for the southern mines."
 mdr_mon_S14: "Twenty-First-Century Nomads"
 mdr_mon_S14_desc: "Solar panels, phones and markets for nomadic life."
 mdr_mon_X1: "The 1994 Foreign Policy Concept"
 mdr_mon_X1_desc: "Balance between the two giants, and friends far away."
 mdr_mon_X2: "Nuclear-Weapon-Free Status"
 mdr_mon_X2_desc: "The five permanent members recognise Mongolia's status (2012)."
 mdr_mon_X3: "The Ulaanbaatar Dialogue"
 mdr_mon_X3_desc: "A neutral table to talk about Korea."
 mdr_mon_X4: "Partner of the United States"
 mdr_mon_X4_desc: "The Millennium Challenge Account funds projects."
 mdr_mon_X5: "Economic Partnership with Japan"
 mdr_mon_X5_desc: "Mongolia's first free trade agreement (2015)."
 mdr_mon_X6: "Korea, the Distant Brother"
 mdr_mon_X6_desc: "Tens of thousands of Mongolians work in South Korea."
 mdr_mon_X7: "NATO Partner"
 mdr_mon_X7_desc: "An individual partnership programme."
 mdr_mon_X8: "The European Union"
 mdr_mon_X8_desc: "Tariff preferences in exchange for rights and good governance."
 mdr_mon_X9A: "The Third Neighbour"
 mdr_mon_X9A_desc: "Neither Moscow nor Beijing decides for us."
 mdr_mon_X9B: "Closer to Beijing"
 mdr_mon_X9B_desc: "Chinese investment in exchange for dependence."
 mdr_mon_X9C: "Closer to Moscow"
 mdr_mon_X9C_desc: "Cheap Russian fuel and weapons, like the old days."
 mdr_mon_X10: "The 2019 Treaty with Russia"
 mdr_mon_X10_desc: "A comprehensive strategic partnership."
 mdr_mon_X11: "The Belt and Road Corridor"
 mdr_mon_X11_desc: "The China–Mongolia–Russia corridor runs along our roads."
 mdr_mon_X12: "Observers in the SCO"
 mdr_mon_X12_desc: "A seat at the Shanghai Cooperation Organisation table."
 mdr_mon_X13: "No Neighbour Rules Us"
 mdr_mon_X13_desc: "Mongolia deals with everyone and obeys no one."
 mdr_mon_X14: "The Mongol Diaspora"
 mdr_mon_X14_desc: "Ties with the Mongols of Russia, China and the world."
 mdr_mon_X15: "Mongolia at the United Nations"
 mdr_mon_X15_desc: "Chairing forums and gaining diplomatic weight."
 mdr_mon_M1: "Armed Forces Reform"
 mdr_mon_M1_desc: "From a Soviet-style army to a professional force."
 mdr_mon_M2: "Blue Helmets"
 mdr_mon_M2_desc: "The first UN peacekeeping missions (2002)."
 mdr_mon_M3: "Five Hills Training Centre"
 mdr_mon_M3_desc: "Peace operations training (2006)."
 mdr_mon_M4: "Exercise Khaan Quest"
 mdr_mon_M4_desc: "Yearly manoeuvres with the United States since 2003."
 mdr_mon_M5: "Iraq and Afghanistan"
 mdr_mon_M5_desc: "Mongolian soldiers in both wars."
 mdr_mon_M6: "Border Guard"
 mdr_mon_M6_desc: "4,700 km with China and 3,500 with Russia."
 mdr_mon_M7: "Steppe Reservists"
 mdr_mon_M7_desc: "Every herder can ride and shoot."
 mdr_mon_M8: "Air Defence"
 mdr_mon_M8_desc: "Protect Ulaanbaatar, the only big city."
 mdr_mon_M9: "Mi-171 Helicopters"
 mdr_mon_M9_desc: "Transport in a country without roads."
 mdr_mon_M10A: "Expeditionary Peace Force"
 mdr_mon_M10A_desc: "Few, highly trained soldiers for the missions."
 mdr_mon_M10B: "Total Defence of the Steppe"
 mdr_mon_M10B_desc: "Every valley a trench, every herder a soldier."
 mdr_mon_M11: "Mobile Steppe Forces"
 mdr_mon_M11_desc: "Motorised, light and fast."
 mdr_mon_M12: "National Defence Industry"
 mdr_mon_M12_desc: "Repair and build at home."
 mdr_mon_M13: "Modern Cavalry"
 mdr_mon_M13_desc: "Riders with radios and missiles: tradition, updated."
 mdr_mon_M14: "An Air Force of Our Own"
 mdr_mon_M14_desc: "Training aircraft and a second base."
 mdr_mon_M15: "The Khan's Guard"
 mdr_mon_M15_desc: "An elite unit in Genghis's colours."
 mdr_mon_I1: "Chinggis Khaan, Father of the Nation"
 mdr_mon_I1_desc: "His name and his face return everywhere."
 mdr_mon_I2: "Chinggis Khaan Airport"
 mdr_mon_I2_desc: "The capital's airport is renamed (2005)."
 mdr_mon_I3: "800 Years of the Great Mongol State"
 mdr_mon_I3_desc: "The anniversary Naadam, in 2006."
 mdr_mon_I4: "The Equestrian Statue"
 mdr_mon_I4_desc: "Chinggis Khaan on horseback, 40 metres of steel (2008)."
 mdr_mon_I5: "The Buddhist Revival"
 mdr_mon_I5_desc: "Gandan and the monasteries fill up again."
 mdr_mon_I6: "The Traditional Script"
 mdr_mon_I6_desc: "The vertical script returns to official documents (2015 law)."
 mdr_mon_I7: "The Naadam Games"
 mdr_mon_I7_desc: "Wrestling, archery and horse racing for the whole country."
 mdr_mon_I8: "Mongolia, Nation of the Mongols"
 mdr_mon_I8_desc: "We are the home of all Mongols, including those living abroad."
 mdr_mon_I9: "The Kurultai of the Mongol Peoples"
 mdr_mon_I9_desc: "A great cultural assembly of all Mongols."
 mdr_mon_I10: "The Mongol World"
 mdr_mon_I10_desc: "Culture, language and tourism: the soft power of the steppe."
 mdr_mon_G1: "The Pan-Mongol Awakening"
 mdr_mon_G1_desc: "Our neighbours are faltering: it is the hour of the Mongols abroad."
 mdr_mon_G2: "The Congress of the Mongol Peoples"
 mdr_mon_G2_desc: "Cultural claims, not yet military ones."
 mdr_mon_G3: "Support Inner Mongolia"
 mdr_mon_G3_desc: "Money and a voice for the Mongols of China."
 mdr_mon_G4: "Claim Inner Mongolia"
 mdr_mon_G4_desc: "The land of our southern brothers."
 mdr_mon_G5: "Hulunbuir and Barga"
 mdr_mon_G5_desc: "The northeastern pastures where the Barga live."
 mdr_mon_G6: "Support Tuva"
 mdr_mon_G6_desc: "The Tuvans share the steppe and Buddhism with us."
 mdr_mon_G7: "Tuva in the Empire"
 mdr_mon_G7_desc: "If Tuva is already free, we invite it to join; if not, we claim it."
 mdr_mon_G8: "Support Buryatia"
 mdr_mon_G8_desc: "The Buryats, Mongols on the shores of Baikal."
 mdr_mon_G9: "Buryatia in the Empire"
 mdr_mon_G9_desc: "If Buryatia is already free, we invite it to join; if not, we claim it."
 mdr_mon_G10: "The Kalmyks of the Volga"
 mdr_mon_G10_desc: "Distant brothers, too far to reach: only a cultural bond."
 mdr_mon_G11: "Integrate Our Brothers"
 mdr_mon_G11_desc: "Mongol states we control become cores after two stable years."
 mdr_mon_G12: "The Law of the Empire"
 mdr_mon_G12_desc: "Every man of the steppe, in the service of the empire."
 mdr_mon_G13: "The Army of Ten Thousand"
 mdr_mon_G13_desc: "A new generation of riders answers the call to arms."
 mdr_mon_G14: "The Imperial Railway"
 mdr_mon_G14_desc: "Tracks out to the new states."
 mdr_mon_G15: "Proclaim the Mongol Empire"
 mdr_mon_G15_desc: "Eight centuries later, the empire returns."
 mdr_mon_G16: "The Empire and the World"
 mdr_mon_G16_desc: "Japan, Korea and Kazakhstan look at the steppe with fear."
 mdr_mon_G17: "Pax Mongolica"
 mdr_mon_G17_desc: "Peace, trade and safe roads across the steppe."
