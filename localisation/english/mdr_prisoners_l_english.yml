l_english:
 MDR_POW_BUTTON: "Prisoners: [?mdr_pow_count|0]"
 MDR_POW_BUTTON_TT: "Captured enemy generals. They stay in prison until the war ends; before that, they can only be executed."
 MDR_POW_RANK_GENERAL: "General"
 MDR_POW_RANK_MARSHAL: "Field Marshal"
 MDR_POW_BTN_USE: "Use"
 MDR_POW_BTN_USE_TT: "Joins our army with his name, skills and traits, with §YDoubtful Loyalty§! for 180 days. Needs §Y60%§! cooperation and §Y96§! political power. At most 3 per year. Only after the war."
 MDR_POW_BTN_EXECUTE: "Execute"
 MDR_POW_BTN_EXECUTE_TT: "We interrogate and shoot him. Costs §Y47§! political power. §G+4§! intel on his army; his country gains §R+2%§! war support, and a democracy loses §R3%§! stability."
 MDR_POW_BTN_EXILE: "Exile"
 MDR_POW_BTN_EXILE_TT: "He leaves for a country of similar ideology, which can use him. He could come back against us. Only after the war."
 MDR_POW_BTN_TRIAL: "Public Trial"
 MDR_POW_BTN_TRIAL_TT: "We try him before the nation and he never commands again. Needs resistance of §Y30%§! or less. §G+58§! political power and §G+2%§! war support; his country and its allies think less of us. Only after the war."
 mdr_doubtful_loyalty: "Doubtful Loyalty"
 mdr_show_trial: "Publicly tried one of their generals"
 mdr_prisoners.3.t: "One of Our Generals Has Defected"
 mdr_prisoners.3.d: "[mdr_pow_news.GetName], a prisoner of war, agreed to serve in the army that captured him."
 mdr_prisoners.3.a: "A traitor"
 mdr_prisoners.4.t: "High Command Captured"
 mdr_prisoners.4.d: "Our forces captured [?global.mdr_pow_news_n|0] senior officers of [?global.mdr_pow_news_from.GetName]. They are in prison: the §YPrisoners§! button at the top left opens the list. Until the war ends they can only be executed."
 mdr_prisoners.4.a: "Have them questioned"
 MDR_POW_TITLE: "§YCAPTURED GENERALS§!"
 MDR_POW_INTRO: "Click a prisoner to see his file and decide his fate."
 MDR_POW_LIST_TITLE: "§YPrisoners: [?mdr_pow_count|0]§!"
 MDR_POW_MARK: "§Y>§!"
