 MDR_POW_ACTIONS_TITLE: "§YDecide His Fate§!"
 MDR_POW_ACTIONS_HINT: "Until you choose, he stays in prison at no cost. During the war he can only be executed; operations are always possible."
 mdr_prisoners.5.t: "A Commander Changes Sides"
 mdr_prisoners.5.d: "[mdr_pow_news.GetName] renounced his former allegiance and agreed to serve in our army. His experience is ours now, though only time will tell whether his new loyalty is genuine."
 mdr_prisoners.5.a: "Let him prove it on the battlefield"
 MDR_POW_RES_TITLE: "§YResistance§!"
 MDR_POW_RES_VALUE: "§R[?mdr_pow_sel_res|0]%§!"
 MDR_POW_RES_HINT: "Recovers 2 a week. At §Y30%§! or less he can be put on public trial."
 MDR_POW_COOP_TITLE: "§YCooperation§!"
 MDR_POW_COOP_VALUE: "§G[?mdr_pow_sel_coop|0]%§!"
 MDR_POW_COOP_HINT: "Fades 2 a week. At §Y60%§! or more he agrees to serve in our army."
 MDR_POW_OP_1: "Harsh Confinement"
 MDR_POW_OP_1_TT: "21 days, free. Resistance §G-14§!, cooperation §R-5§!."
 MDR_POW_OP_2: "Threaten"
 MDR_POW_OP_2_TT: "21 days, §Y18§! political power. Resistance §G-20§!, cooperation §R-8§!."
 MDR_POW_OP_3: "Interrogate"
 MDR_POW_OP_3_TT: "28 days, §Y12§! political power. Resistance §G-9§! and §G+2§! intel on his army, if his country still exists."
 MDR_POW_OP_4: "Humane Treatment"
 MDR_POW_OP_4_TT: "30 days, free. Cooperation §G+12§!, resistance §G-3§!."
 MDR_POW_OP_5: "Propaganda"
 MDR_POW_OP_5_TT: "28 days, §Y23§! political power. Cooperation §G+15§!, resistance §G-5§!."
 MDR_POW_OP_6: "Bribe"
 MDR_POW_OP_6_TT: "21 days, §Y$0.35B§! from the treasury. Cooperation §G+22§!."
 MDR_POW_OP_NONE: "No operation"
 MDR_POW_OP_STATUS: "[mdr_pow_op_status_text]"
 MDR_POW_OP_CANCEL: "Cancel"
 MDR_POW_OP_CANCEL_TT: "Stops the running operation. The cost is not refunded."
