 MDR_POW_STATUS_JAIL: "§YImprisoned§!"
 MDR_POW_OPP_YES: "Another ideology: he started with high resistance and little cooperation."
 MDR_POW_OPP_NO: "He shares our ideology: he is easier to win over."
