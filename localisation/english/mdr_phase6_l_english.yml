l_english:
 # New buildings
 mdr_desalination_plant: "Desalination Plant"
 mdr_desalination_plant_plural: "Desalination Plants"
 mdr_desalination_plant_desc: "Takes the salt out of seawater to irrigate fields and supply cities, as in Israel, Spain or the Persian Gulf.\n\nProvides the state with:\nIrrigation: §YPoor or Dry Soil§! becomes normal while the plant works, and a dry coastal state without §YArable Land§! becomes arable\nBase Number of Required Workers: §Y3.5K§!\nBase GDP Output: §Y$0.42B§!\nBase Energy Consumption: §R-0.17§! GW\n\nCoastal states only, one per state. Irrigation applies as soon as construction ends (up to a week of delay)."
 mdr_recycling_plant: "Recycling Plant"
 mdr_recycling_plant_plural: "Recycling Plants"
 mdr_recycling_plant_desc: "Recovers steel and aluminium from scrap and sorts waste before it reaches the landfill.\n\nProvides the state with:\n§YSteel§!: §G+1§! and §YLight Metals§!: §G+1§! per level\nPollution: §G-4.5§! per level\nBase Number of Required Workers: §Y6.2K§!\nBase GDP Output: §Y$0.47B§!, plus §Y$1B§! in the resource sector for the steel and light metals\nBase Energy Consumption: §R-0.09§! GW\n\nUp to 3 levels per state."
 mdr_regional_university: "Regional University"
 mdr_regional_university_plural: "Regional Universities"
 mdr_regional_university_desc: "A public university with its faculties, laboratories and dorms, training professionals for the region.\n\nProvides the state with:\nProductivity Growth: §G+2.5%§! per level\nNational Research: §G+0.4%§! per university, up to §G+4%§! (10 universities)\nBase Number of Required Workers: §Y11.8K§!\nBase GDP Output: §Y$0.97B§!\nBase Energy Consumption: §R-0.05§! GW\n\nUp to 2 levels per state."
 mdr_electric_arc_furnace: "Electric Arc Furnace"
 mdr_electric_arc_furnace_plural: "Electric Arc Furnaces"
 mdr_electric_arc_furnace_desc: "Melts scrap with electric arcs: steel without iron ore or coal, at the price of huge amounts of electricity. It makes almost a third of the world's steel today.\n\nProvides the state with:\n§YSteel§!: §G+4§! per level\nBase Number of Required Workers: §Y9K§!\nBase GDP Output: §Y$3.9B§!, plus §Y$2B§! in the resource sector for the steel\nBase Energy Consumption: §R-1.35§! GW\n\nUses shared building slots. Up to 2 levels per state."
 mdr_data_center: "Data Center"
 mdr_data_center_plural: "Data Centers"
 mdr_data_center_desc: "Halls full of servers for the cloud, e-commerce and artificial intelligence. A lot of value from few people, but enormous power use.\n\nProvides the state with:\nBase Number of Required Workers: §Y9.3K§!\nBase GDP Output: §Y$23.5B§!\nBase Energy Consumption: §R-1.6§! GW\n\nNeeds §YNetwork Infrastructure§! level 2 in the state. Uses shared building slots. Up to 5 levels per state."
 mdr_smart_grid_center: "Smart Grid Center"
 mdr_smart_grid_center_plural: "Smart Grid Centers"
 mdr_smart_grid_center_desc: "Smart meters, automatic demand control and batteries that tune the power use of the state's factories and offices.\n\nProvides the state with:\nEnergy Savings: §G15%§! of what the state's buildings use, up to §G1.25§! GW\nBase Number of Required Workers: §Y4.1K§!\nBase GDP Output: §Y$0.78B§!\n\nUses one shared building slot. One per state. The savings are worked out every week."
 mdr_fishing_port: "Fishing Port"
 mdr_fishing_port_plural: "Fishing Ports"
 mdr_fishing_port_desc: "Docks, a fishing fleet, cold stores and canneries.\n\nProvides the country with:\nFood: §G+140§! thousand tonnes a year (in grain equivalent), untouched by droughts\nBase Number of Required Workers: §Y2.9K§!\nBase GDP Output: §Y$0.21B§!\n\nCoastal provinces only, one per province."
 mdr_fortified_ammo_depot: "Fortified Ammunition Depot"
 mdr_fortified_ammo_depot_plural: "Fortified Ammunition Depots"
 mdr_fortified_ammo_depot_desc: "Buried concrete bunkers that keep ammunition away from the front and from bombers.\n\nProvides the country with:\nAmmunition Capacity: §G+60,000§! boxes\n\nBombing does less than a third of the normal damage. One per province."
 mdr_science_campus: "Science Campus"
 mdr_science_campus_plural: "Science Campuses"
 mdr_science_campus_desc: "Laboratories, accelerators and start-up incubators around a great research university.\n\nSpeeds up the §Yspecial project facility§! of its own state: §G+7%§! to the speed of projects of that type per campus, up to §G+21%§! (3 campuses per type).\nBase Number of Required Workers: §Y800§!\nBase Energy Consumption: §R-0.08§! GW\n\nSeparate from the special project facilities: it does not take their place and runs no projects of its own. Only one per state, in any province with a supply hub or next to one. It speeds up the facilities of the whole state."
 specialization_mdr_campus: "Science Campus"
 mdr_fishing_food: "£wheat_texticon Food from fishing (thousand tonnes a year)"
 mdr_ammo_depot_capacity: "£infantry_equipment_texticon Depot ammunition capacity (thousand boxes)"
 mdr_buildings_modifier: "Realpolitik Buildings"

 # Pollution and climate
 mdr_pollution_moderate: "Moderate Pollution"
 mdr_pollution_moderate_desc: "The state's factories and power plants foul its air and water. The penalty goes away when pollution drops below 25."
 mdr_pollution_high: "High Pollution"
 mdr_pollution_high_desc: "Smog and dirty water make people sick and damage crops. It falls with recycling plants, cleaner technology or closing dirty industry."
 mdr_pollution_severe: "Severe Pollution"
 mdr_pollution_severe_desc: "One of the most polluted places on Earth: you can see the air, the rivers are dead and people leave. It falls with recycling plants, cleaner technology or closing dirty industry."
 MAPMODE_MDR_POLLUTION_MAP_MODE: "Pollution"
 MAPMODE_MDR_POLLUTION_MAP_MODE_NAME: "Pollution"
 MAPMODE_MDR_POLLUTION_MAP_MODE_DESCRIPTION: "Shows how polluted each state is. Green: clean; yellow: moderate; brown: high; grey: severe."
 mdr_pollution_map_mode_tooltip: "Pollution in [FROM.GetName]"
 mdr_pollution_map_mode_tooltip_delayed: "Pollution of §Y[FROM.GetName]§!: §Y[?FROM.mdr_pollution|0]§! out of 100\n\nModerate from 25, high from 45, severe from 70. Factories, fossil power plants, refineries, steelworks and mines pollute; recycling plants clean up, and technology gets cleaner over the years. Each state also gets 12% of what its neighbours emit.\n\nGlobal warming: §R+[?global.mdr_warming|2] °C§!"
 mdr_climate.1.t: "The Planet Is One Degree Warmer"
 mdr_climate.1.d: "Scientists confirm that the planet's average temperature is now one degree above pre-industrial times. Heatwaves, droughts and storms keep getting more frequent.\n\nGlobal warming: §R+[?global.mdr_warming|2] °C§!"
 mdr_climate.1.a: "We will have to adapt."
 mdr_climate.2.t: "The 1.5 Degree Limit Is Crossed"
 mdr_climate.2.d: "The world has passed one and a half degrees of warming, the limit the Paris Agreement tried to avoid. Extreme weather reaches its highest level.\n\nGlobal warming: §R+[?global.mdr_warming|2] °C§!"
 mdr_climate.2.a: "Too little, too late."

 # Climate treaties
 mdr_treaty_join_11: "Ratify the Kyoto Protocol"
 mdr_treaty_join_11_desc: "We commit to cutting our greenhouse gas emissions.\n\nIf we are a rich country (GDP per capita above 15 thousand dollars), our emissions fall by §G12%§! and we pay about §R0.2%§! of GDP a year for 7 years."
 mdr_treaty_leave_11: "Leave the Kyoto Protocol"
 mdr_treaty_leave_11_desc: "We stop meeting the emission targets, as Canada did in 2011. The other members will not like it."
 mdr_treaty_join_12: "Ratify the Paris Agreement"
 mdr_treaty_join_12_desc: "We present a national plan to cut emissions and keep warming below 2 degrees.\n\nOur emissions fall by §G6%§!, or §G14%§! if we are a rich country (not added to Kyoto). If we are a rich country (GDP per capita above 15 thousand dollars), we pay about §R0.25%§! of GDP a year for 10 years."
 mdr_treaty_leave_12: "Leave the Paris Agreement"
 mdr_treaty_leave_12_desc: "We walk out of the agreement, as the United States did in 2020 and again in 2026. The other members will not like it."
 mdr_treaties.3.d16: "In real history, Canada left the Kyoto Protocol in 2011 because it was not going to meet its targets. Do we follow that path?"
 mdr_treaties.3.d17: "In real history, around this time we ratified the Kyoto Protocol and accepted targets to cut our emissions. Do we ratify it?"
 mdr_treaties.3.d18: "In real history, the United States left the Paris Agreement: in 2020, and again in 2026 after rejoining in 2021. Do we follow that path?"
 mdr_treaties.3.d19: "In real history, around this time we ratified the Paris Agreement on climate change. Do we ratify it?"
 mdr_treaties.4.d11: "[mdr_treaty_news_country.GetNameDefCap] left the Kyoto Protocol and will not meet its emission targets."
 mdr_treaties.4.d12: "[mdr_treaty_news_country.GetNameDefCap] left the Paris Agreement. The fight against climate change loses one of its members."
 mdr_left_climate_treaty: "Left a climate treaty"

 # Society
 mdr_society_pay_tt: "Cost: §R$[?mdr_society_cost|2]B§!"
 mdr_society_protest_down_big_tt: "Protest strength: §G-8§!"
 mdr_society_protest_down_small_tt: "Protest strength: §G-3 to -4§!, but radicalisation grows"
 mdr_society_protest_up_tt: "Protest strength: §R+4 to +5§!"
 mdr_society_protest_up_big_tt: "Protest strength: §R+7§!"
 mdr_society_inequality_down_big_tt: "Inequality index: §G-4§!"
 mdr_society_inequality_down_tt: "Inequality index: §G-2.5§!"
 country_resource_cost_uranium: "Uranium Consumption"
 country_resource_cost_uranium_tt: "$country_resource_cost_uranium$: $RIGHT|-=%1$"
 country_resource_cost_wheat: "Grain Consumption"
 country_resource_cost_rare_earths: "Rare Earths Consumption"
 country_resource_cost_rare_earths_tt: "$country_resource_cost_rare_earths$: $RIGHT|-=%1$"
 state_resources_wheat_factor: "State Grain Production"
 state_resources_rare_earths_factor: "State Rare Earths Production"
 mdr_isolated_economy: "Isolated Economy"
 mdr_isolated_economy_desc: "Total autarky, like North Korea or Hoxha's Albania. 0% of our resources go to the market whether or not there are buyers: we export nothing. We can still buy from anyone willing to sell.\n\nOnly for autocratic governments or countries at war."
 mdr_bloc_economy: "Bloc Economy"
 mdr_bloc_economy_desc: "Like the old COMECON: an economy turned toward the bloc. 50% of our resources go to the market, and exports earn a little more. Nobody's opinion of us changes: we keep buying and selling with anyone willing.\n\nRequires being in a faction, having subjects or being one."
 MDR_AMMO_TOPBAR_FULL: "Full"
 MDR_AMMO_TOPBAR_FILLING: "[?mdr_ammo_eta_days|0]d"
 MDR_AMMO_TOPBAR_EMPTYING: "§R[?mdr_ammo_eta_days|0]d§!"
 MDR_AMMO_ETA_FULL: "§GReserve full§!"
 MDR_AMMO_ETA_FILL: "full in §Y[?mdr_ammo_eta_days|0]§! days"
 MDR_AMMO_ETA_EMPTY: "§Rempty in [?mdr_ammo_eta_days|0] days§!"
 MDR_AMMO_ETA_STEADY: "steady"
 # Society and Information laws
 mdr_assembly_law: "Assembly and Protest Law"
 mdr_civil_society_law: "Civil Society Law"
 mdr_union_law: "Union and Strike Law"
 mdr_surveillance_law: "Surveillance and Privacy Law"
 mdr_assembly_free: "Freedom of Assembly"
 mdr_assembly_free_desc: "Anyone may take to the streets without asking. There are more visible protests, but anger is let out instead of building up.\n\nEach week: protest strength §R+0.4§!, hidden unrest §G-1.5§!. Protests over food or inequality come more often."
 mdr_assembly_regulated: "Notified Demonstrations"
 mdr_assembly_regulated_desc: "Marches are notified to the authorities, who set the route. Most democracies work this way.\n\nEach week: hidden unrest §G-0.5§!."
 mdr_assembly_restricted: "Restricted Demonstrations"
 mdr_assembly_restricted_desc: "A permit is needed and seldom granted, some areas are off limits and the police break up unauthorised marches.\n\nEach week: protest strength §G-0.6§!, hidden unrest §R+0.6§!. Protests come less often."
 mdr_assembly_banned: "Demonstrations Banned"
 mdr_assembly_banned_desc: "Only marches organised by the state are allowed. The streets are quiet, but anger builds up and radicalisation grows.\n\nEach week: protest strength §G-1.5§!, hidden unrest §R+1.5§!. Past 60 hidden unrest a §Rsocial explosion§! can break out."
 mdr_ngo_free: "Free Civil Society"
 mdr_ngo_free_desc: "NGOs, foundations and associations form without permission and may receive funds from abroad. They bring investment and know-how, and foreign influence too."
 mdr_ngo_registered: "Mandatory Registration"
 mdr_ngo_registered_desc: "Organisations must register and file their accounts. Most countries work this way."
 mdr_ngo_foreign_agents: "Foreign Agents Law"
 mdr_ngo_foreign_agents_desc: "Organisations funded from abroad must label themselves «foreign agents» and face constant inspections, as in Russia since 2012. Foreign influence falls, and so does investor confidence."
 mdr_ngo_banned: "Independent Organisations Banned"
 mdr_ngo_banned_desc: "Only state-controlled organisations exist. Nobody may organise on their own."
 mdr_unions_free: "Full Union Freedom"
 mdr_unions_free_desc: "Strong unions bargain wages and strike when they choose. Pay rises and inequality falls, but strikes come more often.\n\nInequality: §G-0.05§! a month. Strikes come more often."
 mdr_unions_regulated: "Regulated Strikes"
 mdr_unions_regulated_desc: "Unions are free, but strikes need a ballot and minimum services.\n\nInequality: §G-0.02§! a month."
 mdr_unions_state: "Single State Union"
 mdr_unions_state_desc: "One official union controlled by the government, as in China or Vietnam. No independent strikes.\n\nInequality: §R+0.03§! a month. Strikes come much less often."
 mdr_unions_banned: "Unions Banned"
 mdr_unions_banned_desc: "No unions and no right to strike, as in the Gulf monarchies. Factories never stop, but anger builds up.\n\nInequality: §R+0.06§! a month. Hidden unrest §R+0.5§! a week."
 mdr_privacy_protected_req_tt: "The current law is §Y$mdr_surveillance_judicial$§!"
 mdr_surveillance_judicial_req_tt: "The current law is §Y$mdr_privacy_protected$§! or §Y$mdr_surveillance_mass$§!"
 mdr_surveillance_mass_req_tt: "The current law is §Y$mdr_surveillance_judicial$§! or §Y$mdr_surveillance_total$§!"
 mdr_surveillance_total_req_tt: "The current law is §Y$mdr_surveillance_mass$§!"
 mdr_privacy_protected: "Guaranteed Privacy"
 mdr_privacy_protected_desc: "Personal data is protected by law, as under the European data protection regulation. Tech companies trust us, but foreign spies find it easier to go unnoticed."
 mdr_surveillance_judicial: "Surveillance with a Warrant"
 mdr_surveillance_judicial_desc: "The state may intercept communications only with a judge's warrant."
 mdr_surveillance_mass: "Mass Surveillance"
 mdr_surveillance_mass_desc: "Communications are collected in bulk and analysed without warrants. The secret services catch more spies and protest organisers.\n\nEach week: protest strength §G-0.3§!."
 mdr_surveillance_total: "Digital Police State"
 mdr_surveillance_total_desc: "Facial recognition cameras, social credit and control of every payment and message. Almost nothing escapes the state, but innovation suffocates and fear feeds anger.\n\nEach week: protest strength §G-0.8§!, hidden unrest §R+0.5§!."
 mdr_society.5.t: "Social Explosion"
 mdr_society.5.d: "Years of banned protests and silenced unions end all at once. Any spark, a price, a death or an arrest, brings hundreds of thousands onto the streets of every city."
 mdr_society.5.a: "Give in: allow protests and promise reforms."
 mdr_society.5.b: "Crush the uprising."
 mdr_society_explosion_tt: "Protest strength: §R+20§!"
 mdr_society_explosion_concede_tt: "Demonstrations are §Yallowed with notice§! again, hidden unrest drops to §G15§! and protest strength §G-10§!"
 mdr_society_explosion_crush_tt: "Protest strength §G-12§!, but radicalisation §R+2§! and hidden unrest stays at §R35§!"
 mdr_retirement_law: "Retirement Age"
 mdr_retire_60_req_tt: "The current law is §Y$mdr_retire_62$§!"
 mdr_retire_62_req_tt: "The current law is §Y$mdr_retire_60$§! or §Y$mdr_retire_65$§!"
 mdr_retire_65_req_tt: "The current law is §Y$mdr_retire_62$§! or §Y$mdr_retire_67$§!"
 mdr_retire_67_req_tt: "The current law is §Y$mdr_retire_65$§! or §Y$mdr_retire_70$§!"
 mdr_retire_70_req_tt: "The current law is §Y$mdr_retire_67$§!"
 mdr_retire_60: "Retirement at 60"
 mdr_retire_60_desc: "People retire early, as in France, Russia or China at the turn of the century. It is popular, but there are fewer workers and pensions are expensive, above all in an ageing country."
 mdr_retire_62: "Retirement at 62"
 mdr_retire_62_desc: "A middle age, like France's after the 2010 reform."
 mdr_retire_65: "Retirement at 65"
 mdr_retire_65_desc: "The most common retirement age in developed countries."
 mdr_retire_67: "Retirement at 67"
 mdr_retire_67_desc: "The age Germany, Norway and Iceland adopted to keep pensions afloat with an ever older population."
 mdr_retire_70: "Retirement at 70"
 mdr_retire_70_desc: "People work almost their whole lives: workers are plentiful and pensions cheap, but it is deeply unpopular.\n\nRaising the retirement age always brings protests (protest strength §R+8§!) and, in democracies, §R-3%§! stability."
