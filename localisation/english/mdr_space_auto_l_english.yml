l_english:
 MDR_AUTO_PAGE: "Space Agency"
 MDR_AUTO_TAB_TT: "Automate the space programme: projects, missions, budget, companies, staff and colonies."
 MDR_AUTO_DESC: "The space agency can run itself every week. Choose what it does and within which limits; everything else stays in its menu."
 MDR_AUTO_HEAD_AGENCY: "Space agency"
 MDR_AUTO_HEAD_WORK: "Projects and missions"
 MDR_AUTO_HEAD_MONEY: "Money and staff"
 MDR_AUTO_HEAD_COLONIES: "Colonies"
 MDR_AUTO_MASTER: "Automatic mode"
 MDR_AUTO_MASTER_TT: "With this on, the agency runs itself every week with the options on this page. It never spends below the reserve."
 MDR_AUTO_CHANCE: "Lowest success"
 MDR_AUTO_CHANCE_V: "[?mdr_space_auto_min_chance|0]%"
 MDR_AUTO_TARGET_V: "[?mdr_space_auto_target_pct|2]%"
 MDR_AUTO_RESERVE_V: "$$[?mdr_space_auto_reserve|0]B"
 MDR_AUTO_STEP_TT: "Click: by one. §YShift + click§!: by ten (by five for success)."
 MDR_AUTO_PRIORITY: "Priority"
 MDR_AUTO_PRIORITY_V: "[mdr_space_auto_priority_name]"
 MDR_AUTO_PRIORITY_TT: "Which project category goes first. Click to change. Balanced follows the order of the list."
 MDR_AUTO_PRIORITY_0: "Balanced"
 MDR_AUTO_STATE: "[mdr_space_auto_state]"
 MDR_AUTO_STATE_NONE: "§gThere is no space agency yet: it is founded from the Space Programme menu.§!"
 MDR_AUTO_STATE_OFF: "§YAutomatic mode off.§! The agency only does what it is told."
 MDR_AUTO_STATE_SHORT: "§RTreasury below the reserve:§! it starts nothing and cuts back if ticked."
 MDR_AUTO_STATE_ON: "§GAutomatic mode on.§! Every week it checks everything ticked."
 MDR_AUTO_PROJECTS: "Start projects"
 MDR_AUTO_PROJECTS_TT: "Starts one project a week when there is room, by priority."
 MDR_AUTO_MISSIONS: "Launch missions"
 MDR_AUTO_MISSIONS_TT: "Starts missions when there is room. Launches only if success reaches the minimum below."
 MDR_AUTO_GOALS: "Claim achieved goals"
 MDR_AUTO_GOALS_TT: "Claims each goal's prestige as soon as it is met."
 MDR_AUTO_HQ: "Expand the headquarters"
 MDR_AUTO_HQ_TT: "Expands the headquarters when 30 science are spare and the money stays above the reserve."
 MDR_AUTO_QUIET: "No notices of finished projects"
 MDR_AUTO_QUIET_TT: "Does not show the event of each finished project or mission. Failures are still shown."
 MDR_AUTO_BUDGET: "Bring the budget to"
 MDR_AUTO_BUDGET_TT: "Moves the budget towards this target, 0.05% a week."
 MDR_AUTO_CUTBACK: "Cut back if the treasury falls below"
 MDR_AUTO_CUTBACK_TT: "With the treasury below the reserve, lowers the budget 0.01% a week and starts nothing."
 MDR_AUTO_COMPANIES: "Hire companies"
 MDR_AUTO_COMPANIES_TT: "Hires a company for each service lacking one, one a week."
 MDR_AUTO_STAFF: "Hire staff"
 MDR_AUTO_STAFF_TT: "Adds scientists and engineers while wages stay under 60% of the weekly budget, and astronauts up to 12."
 MDR_AUTO_COLONIES: "Look after the colonies"
 MDR_AUTO_COLONIES_TT: "Opens the cargo route when something runs short, builds the module needed and sends settlers when morale is good."
