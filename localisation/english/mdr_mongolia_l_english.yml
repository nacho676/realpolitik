l_english:
 mdr_mon_dzud: "Dzud"
 mdr_mon_dzud_desc: "Extreme winters kill millions of animals. The steppe goes hungry."
 mdr_mon_dzud_mild: "Dzud Contained"
 mdr_mon_dzud_mild_desc: "Fodder reserves and aid limit the damage of the winter."
 mdr_mon_civil_service: "Career Civil Service"
 mdr_mon_civil_service_desc: "Fewer political posts and a steadier administration."
 mdr_mon_democracy: "Consolidated Democracy"
 mdr_mon_democracy_desc: "Clean elections and alternation in power."
 mdr_mon_party_state: "Party and State"
 mdr_mon_party_state_desc: "The People's Party and the state are almost the same thing."
 mdr_mon_strongman: "The Strongman"
 mdr_mon_strongman_desc: "One leader holds power above the Great Khural."
 mdr_mon_strongman_unrest: "Unrest in the Streets"
 mdr_mon_strongman_unrest_desc: "The street does not accept the authoritarian turn."
 mdr_mon_mining_patronage: "Mining Patronage"
 mdr_mon_mining_patronage_desc: "Mining licences are shared among the loyal."
 mdr_mon_loyal_army: "A Loyal Army"
 mdr_mon_loyal_army_desc: "The generals owe their careers to the government."
 mdr_mon_leader_referendum: "The Leader's Plebiscite"
 mdr_mon_leader_referendum_desc: "The leader won his plebiscite, for now."
 mdr_mon_open_mining: "Open Mining"
 mdr_mon_open_mining_desc: "Foreign mining companies invest in the Gobi."
 mdr_mon_stock_exchange: "Ulaanbaatar Stock Exchange"
 mdr_mon_stock_exchange_desc: "Local capital for local companies."
 mdr_mon_resource_nationalism: "Resource Nationalism"
 mdr_mon_resource_nationalism_desc: "A windfall tax on copper and gold."
 mdr_mon_erdenes: "Erdenes Mongol"
 mdr_mon_erdenes_desc: "The state company owns part of every big project."
 mdr_mon_copper_exports: "Copper Duty"
 mdr_mon_copper_exports_desc: "Every truck of concentrate leaves something at the border."
 mdr_mon_china_dependence: "Dependence on China"
 mdr_mon_china_dependence_desc: "Almost everything we export goes to a single customer."
 mdr_mon_human_development_fund: "Human Development Fund"
 mdr_mon_human_development_fund_desc: "Cash handouts from mining revenue."
 mdr_mon_imf_program: "IMF Programme"
 mdr_mon_imf_program_desc: "A bailout in exchange for spending cuts."
 mdr_mon_stable_togrog: "Stable Tögrög"
 mdr_mon_stable_togrog_desc: "Less inflation and cheaper debt."
 mdr_mon_diversified: "Diversified Economy"
 mdr_mon_diversified_desc: "We no longer live on copper alone."
 mdr_mon_tourism: "Steppe Tourism"
 mdr_mon_tourism_desc: "Visitors in the ger camps and the Gobi."
 mdr_mon_tourism_statue: "The Equestrian Statue"
 mdr_mon_tourism_statue_desc: "The statue of Chinggis Khaan draws visitors."
 mdr_mon_herder_coops: "Herder Cooperatives"
 mdr_mon_herder_coops_desc: "Herders sell wool and meat together."
 mdr_mon_modern_nomads: "Twenty-First-Century Nomads"
 mdr_mon_modern_nomads_desc: "Solar panels, phones and markets for nomadic life."
 mdr_mon_ger_districts: "The Ger Districts"
 mdr_mon_ger_districts_desc: "Yurt districts without services around Ulaanbaatar."
 mdr_mon_remittances: "Remittances from Korea"
 mdr_mon_remittances_desc: "Mongolians working in Korea send money home."
 mdr_mon_gsp_plus: "European Preferences"
 mdr_mon_gsp_plus_desc: "Low tariffs in the European Union."
 mdr_mon_third_neighbor: "The Third Neighbour"
 mdr_mon_third_neighbor_desc: "Balance between Russia and China, with distant friends."
 mdr_mon_beijing_tilt: "Close to Beijing"
 mdr_mon_beijing_tilt_desc: "Chinese investment in exchange for dependence."
 mdr_mon_moscow_tilt: "Close to Moscow"
 mdr_mon_moscow_tilt_desc: "Cheap Russian fuel and weapons."
 mdr_mon_no_master: "No Neighbour Rules Us"
 mdr_mon_no_master_desc: "Mongolia deals with everyone and obeys no one."
 mdr_mon_army_reform: "Military Reform"
 mdr_mon_army_reform_desc: "A professional force instead of the old Soviet-style army."
 mdr_mon_peacekeepers: "Blue Helmets"
 mdr_mon_peacekeepers_desc: "Mongolian soldiers in UN peace missions."
 mdr_mon_khaan_quest: "Khaan Quest"
 mdr_mon_khaan_quest_desc: "Yearly manoeuvres with the United States and its allies."
 mdr_mon_helicopters: "Transport Helicopters"
 mdr_mon_helicopters_desc: "Mobility in a country without roads."
 mdr_mon_expeditionary: "Expeditionary Peace Force"
 mdr_mon_expeditionary_desc: "Few, highly trained soldiers."
 mdr_mon_total_defense: "Total Defence of the Steppe"
 mdr_mon_total_defense_desc: "Every valley a trench, every herder a soldier."
 mdr_mon_steppe_mobility: "Mobile Steppe Forces"
 mdr_mon_steppe_mobility_desc: "Light, fast units for the open plain."
 mdr_mon_khan_guard: "The Khan's Guard"
 mdr_mon_khan_guard_desc: "An elite unit in Chinggis's colours."
 mdr_mon_chinggis: "Chinggis Khaan, Father of the Nation"
 mdr_mon_chinggis_desc: "His name unites all Mongols."
 mdr_mon_800_years: "800 Years of the Great Mongol State"
 mdr_mon_800_years_desc: "The country celebrates the empire's anniversary."
 mdr_mon_script_transition: "Change of Script"
 mdr_mon_script_transition_desc: "The traditional script returns; for a while, it is costly."
 mdr_mon_nation_of_mongols: "Nation of the Mongols"
 mdr_mon_nation_of_mongols_desc: "We are the home of all Mongols."
 mdr_mon_mongol_world: "The Mongol World"
 mdr_mon_mongol_world_desc: "Culture, language and tourism: the soft power of the steppe."
 mdr_mon_khanate_law: "The Law of the Empire"
 mdr_mon_khanate_law_desc: "Every man of the steppe, in the service of the empire."
 mdr_mon_pax_mongolica: "Pax Mongolica"
 mdr_mon_pax_mongolica_desc: "Peace, trade and safe roads across the steppe."
 mdr_mon.1.t: "Riots in Ulaanbaatar"
 mdr_mon.1.d: "After the election, thousands claim fraud. The People's Party headquarters burns and five people are dead. The government must choose how to respond."
 mdr_mon.1.a: "State of emergency: order first."
 mdr_mon.1.b: "An independent commission to investigate everything."
 mdr_mon.2.t: "The Dzud Returns to the Steppe"
 mdr_mon.2.d_prepared: "Another terrible winter falls on the steppe. This time fodder reserves and livestock insurance save most of the herds."
 mdr_mon.2.d_unprepared: "Another terrible winter falls on the steppe. With no fodder reserves, millions of animals die and thousands of families lose everything."
 mdr_mon.2.a: "The steppe endures."
 mdr_mon.3.t: "The Empire's Offer"
 mdr_mon.3.d: "[From.GetName] invites us to join a state of all the Mongols. We share language, history and steppe. Do we accept?"
 mdr_mon.3.a: "We are Mongols: we accept."
 mdr_mon.3.b: "We will go our own way."
 mdr_mon.4.t: "The Mongol Empire Reborn"
 mdr_mon.4.d: "Eight centuries after Chinggis Khaan, [From.GetName] proclaims the Mongol Empire and unites the Mongol peoples under one banner. The neighbouring capitals look towards the steppe with concern."
 mdr_mon.4.a: "The world looks to the steppe again."
