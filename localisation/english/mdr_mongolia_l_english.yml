 mdr_mon_rel_15: "Good relations with Mongolia"
 mdr_mon_rel_25: "Close relations with Mongolia"
 mdr_mon_rel_50: "Key partner of Mongolia"
 mdr_mon_rel_neg_15: "Friction with Mongolia"
 mdr_mon_rel_neg_25: "Distrust of Mongolia"
 MDR_MON_GREAT_KHAN: "Great Khan Temüjin II"
 MDR_MON_GREAT_KHAN_desc: "Chosen by the kurultai as Temüjin's heir, the Great Khan rules the restored empire above parties and elections."
 mdr_mon_great_khan: "Great Khan"
 mdr_mon_great_khan_desc: "+11% political power, +5% stability and +7% morale."
 mdr_mon_khanate_tt: "The new Great Khan replaces the head of state. The country becomes the §YMongol Empire§!, with its own flag and colour."
