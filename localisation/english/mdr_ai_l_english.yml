l_english:
 MDR_RULE_AI: "Artificial intelligence"
 MDR_RULE_AI_IMPROVED: "Improved"
 MDR_RULE_AI_IMPROVED_DESC: "The AI attacks only with an edge, defends when losing or out of ammunition, protects its capital, equips before growing and asks for peace when losing. It also uses the mod's laws, treaties and embargoes."
 MDR_RULE_AI_NORMAL: "Normal"
 MDR_RULE_AI_NORMAL_DESC: "Only the more cautious combat parameters and the use of the mod's laws, treaties and embargoes. No war stances of its own."
 MDR_RULE_AI_EXPERT: "Expert"
 MDR_RULE_AI_EXPERT_DESC: "Like Improved, but it attacks with a smaller edge, concentrates its offensives more, and neighbours band together to contain whoever conquers too much. No cheats."
 mdr_ai.1.t: "Embargo Lifted"
 mdr_ai.1.d: "[mdr_ai_lifter.GetNameDefCap] has lifted its embargo against us. It is short of resources we produce in abundance, and need won out over politics."
 mdr_ai.1.a: "They will buy from us again."
 mdr_ai.2.t: "Peace Offer"
 mdr_ai.2.d: "[mdr_ai_peace_asker.GetNameDefCap] is on the verge of collapse and proposes ending the war without border changes. Accepting saves lives and ammunition; refusing may bring us total victory."
 mdr_ai.2.a: "We accept peace."
 mdr_ai.2.b: "We fight on to the end."
 mdr_ai_peace_msg: "White Peace"
