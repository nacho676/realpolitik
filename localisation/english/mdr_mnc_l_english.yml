l_english:
 mdr_mnc_category: "Multinational Companies"
 mdr_mnc_category_desc: "Foreign companies operating in our country. They pay royalties and taxes and bring technology; the headquarters keeps the rest of the profit. They can be nationalized, or new ones invited. They freeze under war, embargo or sanctions, and leave after six months."
 mdr_mnc_toggle_invites: "Show or hide companies to invite"
 mdr_mnc_toggle_invites_desc: "Shows the list of foreign companies that could open operations here, or hides it."
 mdr_mnc_nat_cooldown_tt: "We have not nationalized a company in the last 180 days"
 mdr_mnc_expropriation_risk: "Expropriation Risk"
 mdr_mnc_expropriation_risk_desc: "We nationalized a foreign company. Investors ask for more to come here, and the economy loses some momentum."
 mdr_mnc_expropriated: "Nationalized one of our companies"
 mdr_mnc_host: "Multinational Companies"
 mdr_mnc_host_desc: "Foreign companies operating here bring technology and management."
