l_english:
 mdr_space_program_folder: "Space Programme"
 mdr_space_program_folder_desc: "Launchers, crewed flight, orbital industry and defense. Satellites keep their own tab."
 CAT_mdr_space: "Space Programme"
 CAT_mdr_space_research: "Space Programme"
 MDR_SPACE_TECH_TOTAL: "76"
 MDR_SPACE_COLUMN_0: "LAUNCH"
 MDR_SPACE_COLUMN_1: "LIFE AND SAFETY"
 MDR_SPACE_COLUMN_2: "RESOURCES AND ENERGY"
 MDR_SPACE_COLUMN_3: "ORBITAL DEFENSE"
 MDR_SPACE_COLUMN_4: "ORBITAL INDUSTRY"
 MDR_SPACE_COLUMN_5: "SPACE TRAVEL"
 mdr_sp_foundations: "Space Programme Foundations"
 mdr_sp_foundations_desc: "Training engineers, studying orbits and laying the groundwork for a programme. Allows founding a space agency.\n\n§YOpens:§! creating the space agency and building spaceports."
 mdr_sp_launcher: "Orbital Launcher"
 mdr_sp_launcher_desc: "A rocket of our own that can put a payload into low orbit.\n\n§YOpens in the programme menu:§! Engine Test Stand, Automated Countdown, Lunar Probe, Sell Launches."
 mdr_sp_heavy: "Heavy Launcher"
 mdr_sp_heavy_desc: "Over 20 tonnes in low orbit: stations, probes and large satellites.\n\n§YOpens in the programme menu:§! Heavy Side Booster, Mars Probe, Crewed Moon Mission."
 mdr_sp_cryogenic: "Cryogenic Upper Stage"
 mdr_sp_cryogenic_desc: "Liquid hydrogen and oxygen to go further with the same mass.\n\n§YOpens in the programme menu:§! Restartable Upper Stage."
 mdr_sp_smalllauncher: "Commercial Light Launcher"
 mdr_sp_smalllauncher_desc: "Small, cheap rockets for small satellites."
 mdr_sp_reusable: "Reusable First Stage"
 mdr_sp_reusable_desc: "The first stage comes back and lands: each launch costs far less.\n\n§YOpens in the programme menu:§! Recovery Trial."
 mdr_sp_reusable_once: "§GWhen finished, once:§! 42 science and one more project or mission at a time."
 mdr_sp_rapidreuse: "Rapid Reuse"
 mdr_sp_rapidreuse_desc: "Flying the same rocket again in days, not months."
 mdr_sp_superheavy: "Super-Heavy Launcher"
 mdr_sp_superheavy_desc: "Over 100 tonnes in low orbit: what it takes to reach the Moon and Mars.\n\n§YOpens in the programme menu:§! Super-Heavy Pad."
 mdr_sp_superheavy_once: "§GWhen finished, once:§! 8 prestige."
 mdr_sp_refuel: "Orbital Refuelling"
 mdr_sp_refuel_desc: "Taking on fuel in orbit multiplies what can be sent far away.\n\n§YOpens in the programme menu:§! Depot Technology, Orbital Tug."
 mdr_sp_nuclear: "Nuclear Thermal Propulsion"
 mdr_sp_nuclear_desc: "A reactor heats the propellant and halves the journey to Mars."
 mdr_sp_electric: "High-Power Electric Propulsion"
 mdr_sp_electric_desc: "Megawatt ion engines for heavy cargo between planets."
 mdr_sp_fullflow: "Full-Flow Engines"
 mdr_sp_fullflow_desc: "The practical limit of chemical engines: more thrust, lower cost."
 mdr_sp_massdriver: "Lunar Mass Driver"
 mdr_sp_massdriver_desc: "Launching cargo from the Moon without rockets, thanks to its low gravity."
 mdr_sp_cruiser: "Interplanetary Transport Ship"
 mdr_sp_cruiser_desc: "A permanent ship between Earth and Mars."
 mdr_sp_crewed: "Crewed Spaceflight"
 mdr_sp_crewed_desc: "Capsules and training to take people to orbit and bring them back.\n\n§YOpens in the programme menu:§! Own Spacesuits, Astronaut Corps, Own Crew Capsule, Crewed Moon Mission."
 mdr_sp_crewed_once: "§GWhen finished, once:§! 86 political power, stability, 6 prestige and 4 astronauts."
 mdr_sp_station: "Orbital Station"
 mdr_sp_station_desc: "A permanently crewed laboratory in orbit.\n\n§YOpens in the programme menu:§! Own Orbital Station."
 mdr_sp_station_once: "§GWhen finished, once:§! One more project or mission at a time."
 mdr_sp_longstay: "Extended Stays"
 mdr_sp_longstay_desc: "Medicine and routines to spend a whole year in orbit.\n\n§YOpens in the programme menu:§! Space Medicine."
 mdr_sp_commercialcrew: "Commercial Crew"
 mdr_sp_commercialcrew_desc: "Private companies carrying astronauts under contract."
 mdr_sp_commercialcrew_once: "§GWhen finished, once:§! 6 astronauts and 54 political power."
 mdr_sp_lifesupport: "Closed Life Support"
 mdr_sp_lifesupport_desc: "Recycling almost all water and air for long missions.\n\n§YOpens in the programme menu:§! Closed Life Loop."
 mdr_sp_radiation: "Radiation Shielding"
 mdr_sp_radiation_desc: "Shielding and shelters for living beyond Earth's magnetic field.\n\n§YOpens in the programme menu:§! Radiation Shelters."
 mdr_sp_habitat: "Lunar Habitat"
 mdr_sp_habitat_desc: "Modules that shield a crew from the Moon's cold and radiation.\n\n§YOpens in the programme menu:§! Lunar Base, Martian Base."
 mdr_sp_surface: "Surface Operations"
 mdr_sp_surface_desc: "Suits and vehicles for working weeks away from base."
 mdr_sp_deepmission: "Long-Duration Missions"
 mdr_sp_deepmission_desc: "Crews spending years far from Earth, on the way to Mars."
 mdr_sp_marslanding: "Crewed Mars Landing"
 mdr_sp_marslanding_desc: "Landing dozens of tonnes on Mars and taking off again.\n\n§YOpens in the programme menu:§! Crewed Mars Mission."
 mdr_sp_marslanding_once: "§GWhen finished, once:§! 12 prestige, stability and war support."
 mdr_sp_gravity: "Artificial Gravity"
 mdr_sp_gravity_desc: "Rotating ships that protect bones and hearts."
 mdr_sp_torpor: "Medical Torpor"
 mdr_sp_torpor_desc: "Lowering metabolism to cut food, water and radiation on the journey."
 mdr_sp_biosphere: "Closed Biosphere"
 mdr_sp_biosphere_desc: "A colony that makes almost everything it eats and breathes.\n\n§YOpens in the programme menu:§! Great Martian Dome."
 mdr_sp_tracking: "Tracking Network"
 mdr_sp_tracking_desc: "Ground antennas and radars to track and control what is in orbit.\n\n§YOpens in the programme menu:§! Space Telescope."
 mdr_sp_powerarrays: "High-Efficiency Solar Arrays"
 mdr_sp_powerarrays_desc: "Multi-layer cells born from satellites.\n\n§YOpens in the programme menu:§! Solar Test Satellite."
 mdr_sp_rtg: "Radioisotope Generators"
 mdr_sp_rtg_desc: "Decades of power for probes far from the Sun.\n\n§YOpens in the programme menu:§! Radioisotope Programme, Jupiter Probe."
 mdr_sp_prospecting: "Lunar Prospecting"
 mdr_sp_prospecting_desc: "Probes mapping the Moon's ice and minerals."
 mdr_sp_solar: "Orbital Solar Power"
 mdr_sp_solar_desc: "Lighter panels and first trials of sending power from orbit."
 mdr_sp_lunarice: "Lunar Ice Extraction"
 mdr_sp_lunarice_desc: "Getting water from polar craters to drink and make fuel.\n\n§YOpens in the programme menu:§! In-Situ Resource Use, Lunar Ice Mines."
 mdr_sp_lunarice_once: "§GWhen finished, once:§! 38 science."
 mdr_sp_fission: "Surface Reactor"
 mdr_sp_fission_desc: "A small reactor giving power through the lunar night.\n\n§YOpens in the programme menu:§! Surface Reactor Design."
 mdr_sp_regolith: "Regolith Mining"
 mdr_sp_regolith_desc: "Getting oxygen and metals from lunar soil instead of hauling them from Earth.\n\n§YOpens in the programme menu:§! Regolith Mining."
 mdr_sp_regolith_once: "§GWhen finished, once:§! 10 aluminium in the capital."
 mdr_sp_marsfuel: "Martian Fuel"
 mdr_sp_marsfuel_desc: "Making methane and oxygen from Mars's air for the way back.\n\n§YOpens in the programme menu:§! Martian Fuel Plant."
 mdr_sp_asteroidsurvey: "Asteroid Survey"
 mdr_sp_asteroidsurvey_desc: "Learning what nearby asteroids are made of."
 mdr_sp_asteroidsurvey_once: "§GWhen finished, once:§! 64 science."
 mdr_sp_asteroidmining: "Asteroid Mining"
 mdr_sp_asteroidmining_desc: "Bringing metals and water from a nearby asteroid.\n\n§YOpens in the programme menu:§! Asteroid Outpost."
 mdr_sp_asteroidmining_once: "§GWhen finished, once:§! 16 steel, 12 chromium and 8 tungsten in the capital."
 mdr_sp_powerbeam: "Space-Based Power Transmission"
 mdr_sp_powerbeam_desc: "Large solar plants beaming power to Earth.\n\n§YOpens in the programme menu:§! Power Beaming Trial, Mercury Solar Station."
 mdr_sp_powerbeam_once: "§GWhen finished, once:§! One building slot in the capital."
 mdr_sp_helium: "Helium-3 Study"
 mdr_sp_helium_desc: "Assessing whether lunar helium-3 could serve fusion."
 mdr_sp_debris: "Space Debris Tracking"
 mdr_sp_debris_desc: "Cataloguing debris in orbit so satellites can dodge it.\n\n§YOpens in the programme menu:§! Debris Radar, Debris Accord."
 mdr_sp_debris_once: "§GWhen finished, once:§! Removes 2 orbital debris, for everyone."
 mdr_sp_awareness: "Space Domain Awareness"
 mdr_sp_awareness_desc: "Knowing what each object in orbit is doing and whose it is.\n\n§YOpens in the programme menu:§! Warning Satellites."
 mdr_sp_hardening: "Hardened Satellites"
 mdr_sp_hardening_desc: "Protection against jamming, lasers and blasts.\n\n§YOpens in the programme menu:§! Protected Satellites."
 mdr_sp_spacecommand: "Space Command"
 mdr_sp_spacecommand_desc: "A military branch devoted to orbit.\n\n§YOpens in the programme menu:§! Anti-Satellite Test."
 mdr_sp_avoidance: "Automatic Avoidance"
 mdr_sp_avoidance_desc: "Satellites that dodge collisions on their own."
 mdr_sp_cleanup: "Orbital Cleanup"
 mdr_sp_cleanup_desc: "Spacecraft that capture debris and take it out of orbit.\n\n§YOpens in the programme menu:§! Cleanup Mission."
 mdr_sp_cleanup_once: "§GWhen finished, once:§! Removes 11 orbital debris, for everyone."
 mdr_sp_patrol: "Orbital Patrol"
 mdr_sp_patrol_desc: "Craft inspecting other countries' satellites up close."
 mdr_sp_planetary: "Planetary Defense"
 mdr_sp_planetary_desc: "Spotting dangerous asteroids in time.\n\n§YOpens in the programme menu:§! Planetary Watch."
 mdr_sp_planetary_once: "§GWhen finished, once:§! Stability."
 mdr_sp_deflection: "Asteroid Deflection"
 mdr_sp_deflection_desc: "Impacts that change an asteroid's course."
 mdr_sp_deflection_once: "§GWhen finished, once:§! 5 prestige and stability."
 mdr_sp_cislunar: "Cislunar Traffic Control"
 mdr_sp_cislunar_desc: "Rules and radars for the space between Earth and Moon."
 mdr_sp_baseguard: "Base Protection"
 mdr_sp_baseguard_desc: "Guarding colonies from impacts, solar storms and sabotage."
 mdr_sp_microgravity: "Microgravity Experiments"
 mdr_sp_microgravity_desc: "Materials and medicines that can only be made without gravity.\n\n§YOpens in the programme menu:§! Microgravity Laboratory."
 mdr_sp_microgravity_once: "§GWhen finished, once:§! 36 science."
 mdr_sp_smallsat: "Satellite Buses"
 mdr_sp_smallsat_desc: "One base design for many satellites.\n\n§YOpens in the programme menu:§! Common Satellite Bus, Nanosatellite Plant."
 mdr_sp_commercialsat: "Satellite Market"
 mdr_sp_commercialsat_desc: "Companies selling images, data and communications.\n\n§YOpens in the programme menu:§! Export Programme."
 mdr_sp_constellation: "Megaconstellations"
 mdr_sp_constellation_desc: "Thousands of cheap satellites in low orbit."
 mdr_sp_constellation_once: "§GWhen finished, once:§! A bonus for the next 2 researches of this tab."
 mdr_sp_servicing: "On-Orbit Servicing"
 mdr_sp_servicing_desc: "Craft that repair and refuel satellites."
 mdr_sp_manufacturing: "Orbital Manufacturing"
 mdr_sp_manufacturing_desc: "Automatic workshops making what is worth more than its transport.\n\n§YOpens in the programme menu:§! Pilot Orbital Plant."
 mdr_sp_manufacturing_once: "§GWhen finished, once:§! 2 military factories in the capital."
 mdr_sp_printing: "3D Printing in Space"
 mdr_sp_printing_desc: "Making parts and structures where they are needed.\n\n§YOpens in the programme menu:§! 3D Part Printing."
 mdr_sp_assembly: "Orbital Assembly"
 mdr_sp_assembly_desc: "Assembling in orbit ships too big for any rocket."
 mdr_sp_lunarfactory: "Lunar Factory"
 mdr_sp_lunarfactory_desc: "Making things on the Moon from lunar materials."
 mdr_sp_lunarfactory_once: "§GWhen finished, once:§! 3 civilian factories in the capital."
 mdr_sp_shipyard: "Orbital Shipyard"
 mdr_sp_shipyard_desc: "Building and repairing interplanetary ships in orbit.\n\n§YOpens in the programme menu:§! Orbital Yard."
 mdr_sp_platform: "Giant Orbital Platform"
 mdr_sp_platform_desc: "A kilometre-long structure, inhabited and productive."
 mdr_sp_platform_once: "§GWhen finished, once:§! One more project or mission at a time, and 8 prestige."
 mdr_sp_elevator: "Space Elevator Study"
 mdr_sp_elevator_desc: "Materials and sums for a cable to orbit. It is the final research of this era."
 mdr_sp_elevator_once: "§GWhen finished, once:§! 30 prestige, 180 political power, stability and one more project or mission at a time."
 mdr_sp_navigation: "Interplanetary Navigation"
 mdr_sp_navigation_desc: "Working out courses between planets. Without it no probe leaves for the Moon or beyond.\n\n§YOpens in the programme menu:§! Lunar Probe."
 mdr_sp_gravityassist: "Gravity Assist"
 mdr_sp_gravityassist_desc: "Using the planets' gravity to go further. Opens Venus, Mercury and Mars.\n\n§YOpens in the programme menu:§! Mercury Probe, Venus Probe, Mars Probe."
 mdr_sp_translunar: "Translunar Injection"
 mdr_sp_translunar_desc: "Sending a crew to the Moon and bringing it back. Required for the crewed mission.\n\n§YOpens in the programme menu:§! Crewed Moon Mission."
 mdr_sp_translunar_once: "§GWhen finished, once:§! 4 prestige."
 mdr_sp_deepnet: "Deep Space Network"
 mdr_sp_deepnet_desc: "Antennas to talk to very distant craft. Required for Jupiter, Saturn and the asteroids.\n\n§YOpens in the programme menu:§! Asteroid Probe, Jupiter Probe."
 mdr_sp_precisionland: "Precision Landing"
 mdr_sp_precisionland_desc: "Landing metres from the chosen spot. Required for bases.\n\n§YOpens in the programme menu:§! Lunar Base, Mars Lander."
 mdr_sp_aerobrake: "Aerobraking"
 mdr_sp_aerobrake_desc: "Braking with the atmosphere instead of fuel. Required to land on Mars.\n\n§YOpens in the programme menu:§! Mars Lander."
 mdr_sp_transithab: "Transit Habitat"
 mdr_sp_transithab_desc: "Living for months on the way. Required for crewed flights to Mars.\n\n§YOpens in the programme menu:§! Crewed Mars Flyby."
 mdr_sp_marstransfer: "Mars Transfer Window"
 mdr_sp_marstransfer_desc: "A crew that reaches Mars and returns. Required to set foot on Mars.\n\n§YOpens in the programme menu:§! Crewed Mars Mission."
 mdr_sp_marstransfer_once: "§GWhen finished, once:§! 8 prestige and 64 political power."
 mdr_sp_venusfloat: "Floating Platforms"
 mdr_sp_venusfloat_desc: "Balloons in Venus's atmosphere, 50 km up. Opens the Venus station.\n\n§YOpens in the programme menu:§! Venus Floating Station."
 mdr_sp_asteroidnav: "Asteroid Rendezvous"
 mdr_sp_asteroidnav_desc: "Approaching and anchoring to a tiny body. Opens the asteroid outpost.\n\n§YOpens in the programme menu:§! Asteroid Outpost."
 mdr_sp_outerprop: "Outer System Propulsion"
 mdr_sp_outerprop_desc: "Engines to take people to Jupiter's moons. Opens Callisto.\n\n§YOpens in the programme menu:§! Callisto Base (Jupiter)."
 mdr_sp_titanentry: "Titan Entry"
 mdr_sp_titanentry_desc: "Descending through haze and methane lakes. Opens the Titan base.\n\n§YOpens in the programme menu:§! Titan Base (Saturn)."
 mdr_sp_solarnet: "Solar System Network"
 mdr_sp_solarnet_desc: "Communications and routes between every human outpost. The end of this era's travel."
 mdr_sp_solarnet_once: "§GWhen finished, once:§! One more project or mission at a time, and 12 prestige."
