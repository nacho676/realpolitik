 mdr_strait_close_1: "Close the Bab el-Mandeb Strait"
 mdr_strait_close_1_desc: "Without it, Gulf oil bound for Europe must sail around Africa, as during the 2023 Houthi attacks. Oil prices rise, exporters lose their route and world tension grows. Countries outside our faction will see us as aggressors. The closure lasts at most 120 days."
 mdr_strait_reopen_1: "Reopen the Bab el-Mandeb Strait"
 mdr_strait_reopen_1_desc: "We allow ships through again."
 mdr_strait_escort_1: "Naval Escort Mission in the Bab el-Mandeb Strait"
 mdr_strait_escort_1_desc: "Our fleet escorts merchant ships for 30 days. When it ends, the passage is reopened and the countries not at war with us are grateful."
 mdr_strait_close_2: "Close the Suez Canal"
 mdr_strait_close_2_desc: "It is the shortest route between Asia and Europe; closing it sends oil prices soaring. Oil prices rise, exporters lose their route and world tension grows. Countries outside our faction will see us as aggressors. The closure lasts at most 120 days."
 mdr_strait_reopen_2: "Reopen the Suez Canal"
 mdr_strait_reopen_2_desc: "We allow ships through again."
 mdr_strait_escort_2: "Naval Escort Mission in the Suez Canal"
 mdr_strait_escort_2_desc: "Our fleet escorts merchant ships for 30 days. When it ends, the passage is reopened and the countries not at war with us are grateful."
 mdr_strait_close_3: "Close the Bosphorus and Dardanelles"
 mdr_strait_close_3_desc: "Under the 1936 Montreux Convention we may close it to warships in wartime, as Turkey did in 2022. It cuts Russian exports through the Black Sea. Oil prices rise, exporters lose their route and world tension grows. Countries outside our faction will see us as aggressors. The closure lasts at most 120 days."
 mdr_strait_reopen_3: "Reopen the Bosphorus and Dardanelles"
 mdr_strait_reopen_3_desc: "We allow ships through again."
 mdr_strait_escort_3: "Naval Escort Mission in the Bosphorus and Dardanelles"
 mdr_strait_escort_3_desc: "Our fleet escorts merchant ships for 30 days. When it ends, the passage is reopened and the countries not at war with us are grateful."
 mdr_strait_close_4: "Close the Strait of Malacca"
 mdr_strait_close_4_desc: "The oil that feeds China, Japan, Korea and Taiwan passes through here. Oil prices rise, exporters lose their route and world tension grows. Countries outside our faction will see us as aggressors. The closure lasts at most 120 days."
 mdr_strait_reopen_4: "Reopen the Strait of Malacca"
 mdr_strait_reopen_4_desc: "We allow ships through again."
 mdr_strait_escort_4: "Naval Escort Mission in the Strait of Malacca"
 mdr_strait_escort_4_desc: "Our fleet escorts merchant ships for 30 days. When it ends, the passage is reopened and the countries not at war with us are grateful."
 mdr_strait_close_5: "Close the Panama Canal"
 mdr_strait_close_5_desc: "It links the Atlantic and the Pacific; without it, ships must sail around South America. Oil prices rise, exporters lose their route and world tension grows. Countries outside our faction will see us as aggressors. The closure lasts at most 120 days."
 mdr_strait_reopen_5: "Reopen the Panama Canal"
 mdr_strait_reopen_5_desc: "We allow ships through again."
 mdr_strait_escort_5: "Naval Escort Mission in the Panama Canal"
 mdr_strait_escort_5_desc: "Our fleet escorts merchant ships for 30 days. When it ends, the passage is reopened and the countries not at war with us are grateful."
 mdr_strait_close_6: "Close the Strait of Gibraltar"
 mdr_strait_close_6_desc: "It is the gateway to the Mediterranean; closing it isolates the ports of southern Europe and North Africa. Oil prices rise, exporters lose their route and world tension grows. Countries outside our faction will see us as aggressors. The closure lasts at most 120 days."
 mdr_strait_reopen_6: "Reopen the Strait of Gibraltar"
 mdr_strait_reopen_6_desc: "We allow ships through again."
 mdr_strait_escort_6: "Naval Escort Mission in the Strait of Gibraltar"
 mdr_strait_escort_6_desc: "Our fleet escorts merchant ships for 30 days. When it ends, the passage is reopened and the countries not at war with us are grateful."
 mdr_straits.1.t: "A Strait Is Closed"
 mdr_straits.1.d1: "[mdr_strait_news_country.GetNameDefCap] has closed the Bab el-Mandeb Strait to shipping. Tankers are changing course and oil prices are soaring on every market."
 mdr_straits.1.d2: "[mdr_strait_news_country.GetNameDefCap] has closed the Suez Canal to shipping. Tankers are changing course and oil prices are soaring on every market."
 mdr_straits.1.d3: "[mdr_strait_news_country.GetNameDefCap] has closed the Bosphorus and Dardanelles to shipping. Tankers are changing course and oil prices are soaring on every market."
 mdr_straits.1.d4: "[mdr_strait_news_country.GetNameDefCap] has closed the Strait of Malacca to shipping. Tankers are changing course and oil prices are soaring on every market."
 mdr_straits.1.d5: "[mdr_strait_news_country.GetNameDefCap] has closed the Panama Canal to shipping. Tankers are changing course and oil prices are soaring on every market."
 mdr_straits.1.d6: "[mdr_strait_news_country.GetNameDefCap] has closed the Strait of Gibraltar to shipping. Tankers are changing course and oil prices are soaring on every market."
 mdr_straits.1.a: "The markets panic."
 mdr_straits.2.t: "A Strait Reopens"
 mdr_straits.2.d1: "The Bab el-Mandeb Strait is open to shipping again thanks to [mdr_strait_news_country.GetNameDef]. Shipping lines are returning to their usual routes."
 mdr_straits.2.d2: "The Suez Canal is open to shipping again thanks to [mdr_strait_news_country.GetNameDef]. Shipping lines are returning to their usual routes."
 mdr_straits.2.d3: "The Bosphorus is open to shipping again thanks to [mdr_strait_news_country.GetNameDef]. Shipping lines are returning to their usual routes."
 mdr_straits.2.d4: "The Strait of Malacca is open to shipping again thanks to [mdr_strait_news_country.GetNameDef]. Shipping lines are returning to their usual routes."
 mdr_straits.2.d5: "The Panama Canal is open to shipping again thanks to [mdr_strait_news_country.GetNameDef]. Shipping lines are returning to their usual routes."
 mdr_straits.2.d6: "The Strait of Gibraltar is open to shipping again thanks to [mdr_strait_news_country.GetNameDef]. Shipping lines are returning to their usual routes."
 mdr_straits.2.a: "Good news for trade."
 mdr_strait_close_7: "Close the Strait of Hormuz"
 mdr_strait_close_7_desc: "A fifth of the oil of the world leaves through Hormuz, from Saudi Arabia, Kuwait, Iraq, the Emirates and Qatar. Closing it sends oil prices soaring, the Gulf exporters lose their route and world tension grows. Countries outside our faction will see us as aggressors. The closure lasts at most 120 days."
 mdr_strait_reopen_7: "Reopen the Strait of Hormuz"
 mdr_strait_reopen_7_desc: "We allow ships through again."
 mdr_strait_escort_7: "Naval Escort Mission in the Strait of Hormuz"
 mdr_strait_escort_7_desc: "Our fleet escorts tankers for 30 days. When it ends, the passage is reopened and the countries not at war with us are grateful."
 mdr_straits.1.d7: "[mdr_strait_news_country.GetNameDefCap] has closed the Strait of Hormuz. A fifth of the oil of the world is trapped in the Gulf and prices are soaring on every market."
 mdr_straits.2.d7: "The Strait of Hormuz is open to shipping again thanks to [mdr_strait_news_country.GetNameDef]. Tankers are leaving the Gulf once more."
 mdr_strait_closed_tt: "The strait is closed: no ship or convoy can pass."
 MDR_RULE_ENABLED: "Enabled"
 MDR_RULE_DISABLED: "Disabled"
 MDR_RULE_AMMO: "Ammunition"
 MDR_RULE_AMMO_ENABLED_DESC: "Military factories produce ammunition, the army spends it in combat and drills, and running out weakens the troops."
 MDR_RULE_AMMO_DISABLED_DESC: "No ammunition system: no stockpile, use or penalties, and the ammunition box leaves the top bar."
 MDR_RULE_FOOD: "Food"
 MDR_RULE_FOOD_ENABLED_DESC: "Every country grows, imports and eats grain. Food shortages lower stability and population."
 MDR_RULE_FOOD_DISABLED_DESC: "No food system: no consumption or shortages, and the food box leaves the top bar. Cropland still grows grain for the market."
 MDR_RULE_CLIMATE: "Climate and Pollution"
 MDR_RULE_CLIMATE_ENABLED_DESC: "Industry pollutes its states and warms the planet, with its effects and the Kyoto and Paris treaties."
 MDR_RULE_CLIMATE_DISABLED_DESC: "No pollution or global warming."
 MDR_RULE_STRAITS: "Maritime Straits"
 MDR_RULE_STRAITS_ENABLED_DESC: "Whoever controls a strait can close it in war, with historical or random closures depending on the world events rule."
 MDR_RULE_STRAITS_DISABLED_DESC: "Straits never close."
 MDR_RULE_SOCIETY: "Protests and Strikes"
 MDR_RULE_SOCIETY_ENABLED_DESC: "Strikes, protests and social explosions driven by inequality and the civil laws."
 MDR_RULE_SOCIETY_DISABLED_DESC: "No Realpolitik strikes, protests or social explosions. The civil laws still work."
