l_english:
 MDR_RULE_DISASTERS: "Natural Disasters"
 MDR_RULE_DISASTERS_HISTORICAL: "Historical"
 MDR_RULE_DISASTERS_HISTORICAL_DESC: "The great real disasters of 2000 to 2025 strike on their dates: the Indian Ocean tsunami, Katrina, Haiti, Tohoku and Fukushima, Turkey 2023 and many more. Countries without scripted disasters, and everyone from 2027, face random disasters based on their risk."
 MDR_RULE_DISASTERS_DYNAMIC: "Dynamic"
 MDR_RULE_DISASTERS_DYNAMIC_DESC: "All disasters are random, based on the risk of each country and the season."
 MDR_RULE_DISASTERS_DISABLED: "Disabled"
 MDR_RULE_DISASTERS_DISABLED_DESC: "There are no natural disasters or accidents."
 MDR_RULE_WORLD_EVENTS: "International Events"
 MDR_RULE_WORLD_EVENTS_HISTORICAL: "Historical"
 MDR_RULE_WORLD_EVENTS_HISTORICAL_DESC: "Arms treaties change on their real dates (the US leaves the ABM Treaty in 2002, the INF Treaty ends in 2019, Russia suspends New START in 2023, and more) and the real shipping crises happen: the Ever Given in 2021, the Panama Canal drought and the Houthi attacks in the Red Sea in 2023. If you play the country involved, you choose whether to follow history."
 MDR_RULE_WORLD_EVENTS_DYNAMIC: "Dynamic"
 MDR_RULE_WORLD_EVENTS_DYNAMIC_DESC: "Treaties only change through decisions and shipping accidents happen at random."

 mdr_disaster_moderate: "Natural Disaster"
 mdr_disaster_moderate_desc: "A disaster struck one of our regions. Emergency services are working in the affected area."
 mdr_disaster_severe: "Severe Disaster"
 mdr_disaster_severe_desc: "A severe disaster destroyed roads, homes and factories. Rebuilding will take months."
 mdr_disaster_catastrophe: "National Catastrophe"
 mdr_disaster_catastrophe_desc: "A catastrophe devastated an entire region. Thousands are dead, hospitals are overwhelmed and the whole economy is suffering."
 mdr_disaster_nuclear: "Nuclear Catastrophe"
 mdr_disaster_nuclear_desc: "An accident at a nuclear plant forced tens of thousands to evacuate. Public opinion has turned against nuclear power and several reactors are shut down."
 mdr_disaster_coverup: "Disaster Cover-Up"
 mdr_disaster_coverup_desc: "We played down the scale of the disaster. Rumors and the anger of the victims are spreading across the country."
 mdr_disasters_opt_help: "Help the victims."
 mdr_disasters_opt_own: "Rebuild with our own funds."
 mdr_disasters_opt_aid: "Ask for international aid."
 mdr_disasters_opt_army: "Send in the army for the rescue."
 mdr_disasters_opt_fund: "Use the Stabilization Fund."
 mdr_disasters_opt_coverup: "Play down the crisis."
 mdr_disasters_news_a: "A terrible tragedy."
 mdr_disasters.20.t: "Catastrophe in [mdr_disaster_victim.GetName]"
 mdr_disasters.20.d: "[mdr_disaster_victim.GetNameDefCap] has suffered a catastrophe and is asking the world for help. Sending aid costs money, but improves their opinion of us and gives us influence in the country."
 mdr_disasters.20.a: "Send generous aid."
 mdr_disasters.20.b: "Send token aid."
 mdr_disasters.20.c: "We cannot help."
 mdr_diag_disaster: "Trigger a Disaster Now"
 mdr_diag_disaster_desc: "Triggers a disaster now in a random state of our country, chosen like a real one: the state's region and the season decide the type, then the strength is rolled. To test the disaster system."
 mdr_diag_disaster_tt: "A disaster strikes a random state of ours. Its type depends on the region and the season (for example a §Ytsunami§! on the Japanese coast or a §Ytornado§! in Tornado Alley), and its strength goes from §Ymild§! to §Rsevere§!, with news for the whole world."

 mdr_aging_1: "Aging Population"
 mdr_aging_1_desc: "Fewer children are born than are needed to replace the previous generation. Pensions weigh more on the budget every year."
 mdr_aging_2: "Rapid Aging"
 mdr_aging_2_desc: "Every year there are fewer young people and more pensioners. Workers are scarce and pension and health spending keeps rising."
 mdr_aging_3: "Demographic Winter"
 mdr_aging_3_desc: "The population is shrinking. Villages empty, schools close and there are not enough young people to sustain the economy or the army."
 mdr_demographic_bonus: "Demographic Dividend"
 mdr_demographic_bonus_desc: "A very young population is reaching working age. If there are jobs for everyone, it is an engine of growth."
 mdr_demo_root: "National Demographic Plan"
 mdr_demo_root_desc: "Fewer children are born every year and there are more retirees. If we do nothing, we will run short of workers and pensions will sink the budget. We bring demographers, economists and ministers together to draw up a long-term plan.\n\nThere are three paths: encourage births, attract immigrants or produce more with fewer workers. Each path we finish lowers aging one level, and all three can be followed. At least 30 days pass between one reform and the next."
 mdr_demo_natal_housing: "Housing for Young Families"
 mdr_demo_natal_housing_desc: "Young couples put off children because they cannot afford a home. We build social housing and give cheap loans to those starting a family.\n\nWe need a stable government to sustain a housing plan over several years."
 mdr_demo_immigration_family: "Family Reunification"
 mdr_demo_immigration_family_desc: "We allow foreign workers to bring their partners and children. Families put down roots, and their children grow up as citizens of our country.\n\nIn the middle of a war we cannot open the borders like this."
 mdr_demo_productivity_training: "Training for Older Workers"
 mdr_demo_productivity_training_desc: "Free courses so workers over 50 learn the new technologies and are not pushed out of the job market."
 mdr_demo_census: "National Population Census"
 mdr_demo_census_desc: "Before reforming, we must know how many we are, how old we are and where we live. A full census shows which regions are emptying and where workers are missing."
 mdr_demo_pact: "Intergenerational Pact"
 mdr_demo_pact_desc: "With two reform paths finished, we bring unions, employers, pensioners and the young to sign a lasting agreement: each generation does its part to support the others."
 mdr_demo_two_paths_tt: "Have finished at least two of the three reform paths"
 mdr_demo_treasury_tt: "Have money in the treasury (not in the red)"
 mdr_demo_pact_idea: "Intergenerational Pact"
 mdr_demo_pact_idea_desc: "The young, workers and pensioners signed an agreement to share the burden of aging. Families trust the future and social spending is put in order."
 mdr_demo_rest_tt: "At least 30 days have passed since the last demographic reform"
 mdr_demo_natal_1: "Universal Child Allowance"
 mdr_demo_natal_1_desc: "We pay a monthly sum for every child under age, whatever the family's income. Many couples say they have no children because they cannot afford them; this takes that reason away.\n\nIt is the first step of the natalist path: slow and expensive, but without side effects."
 mdr_demo_natal_2: "Free Public Nurseries"
 mdr_demo_natal_2_desc: "We open free nurseries in every neighbourhood, so having a child does not force a parent to stop working. The countries that did it, such as France and Sweden, have the highest birth rates in Europe."
 mdr_demo_natal_3: "Extended Parental Leave"
 mdr_demo_natal_3_desc: "We extend paid maternity and paternity leave and require employers to keep the job. Having children stops being a risk for one's career.\n\nWhen finished, the natalist path is complete and aging falls one level."
 mdr_demo_immigration_1: "Work Visas for Foreigners"
 mdr_demo_immigration_1_desc: "We open the door to foreign workers for the jobs we cannot fill: farming, construction, elderly care and health. It is the fastest path, but not everyone welcomes it."
 mdr_demo_immigration_2: "Integration Programmes"
 mdr_demo_immigration_2_desc: "Language courses, recognition of degrees and help finding a home. Immigrants who integrate work more, pay more taxes and stay.\n\nWithout some stability, these programmes would cause more rejection than integration."
 mdr_demo_immigration_3: "Fast-Track Citizenship"
 mdr_demo_immigration_3_desc: "Immigrants with stable jobs and a clean record can become citizens within a few years. They vote, pay taxes and become part of the country.\n\nWhen finished, the immigration path is complete and aging falls one level."
 mdr_demo_productivity_1: "Industrial Automation"
 mdr_demo_productivity_1_desc: "We subsidise robots, software and machinery so factories produce the same with fewer people. Japan and South Korea already do it to make up for the lack of young workers."
 mdr_demo_productivity_2: "Raise the Retirement Age"
 mdr_demo_productivity_2_desc: "We raise the retirement age step by step as people live longer. It eases the pension accounts, but it is one of the most unpopular measures there is.\n\nOnly a very stable government can pass it without a wave of strikes."
 mdr_demo_productivity_3: "Robotic Elderly Care"
 mdr_demo_productivity_3_desc: "We invest in robots, sensors and telemedicine to care for the elderly with fewer staff. It is expensive, so we need money in the treasury.\n\nWhen finished, the productivity path is complete and aging falls one level."

 mdr_treaties_modifier: "Arms Treaties"
 mdr_treaties_category: "International Treaties"
 mdr_treaties_category_desc: "Arms treaties limit arsenals in exchange for security and trust; their effects add up in the §YArms Treaties§! modifier. Leaving one angers the other members and raises world tension.\n\nClimate treaties (Kyoto and Paris) cut the emissions of our industry and cost rich countries money for a while. Leaving one angers its members.\n\nGlobal warming: §R+[?global.mdr_warming|2] °C§! above pre-industrial times."
 mdr_treaty_cooldown_tt: "At least a year has passed since our last treaty change"
 mdr_treaty_partner_tt: "The other superpower exists and we are not at war with it"
 mdr_treaty_partner_usa_tt: "The United States exists and we are not at war with it"
 mdr_treaty_join_1: "Sign the Non-Proliferation Treaty (NPT)"
 mdr_treaty_join_1_desc: "We renounce nuclear weapons in exchange for civil nuclear cooperation."
 mdr_treaty_leave_1: "Leave the Non-Proliferation Treaty (NPT)"
 mdr_treaty_leave_1_desc: "We regain the freedom to seek nuclear weapons, as North Korea did in 2003. Every member will see us as a threat."
 mdr_treaty_join_2: "Sign the Comprehensive Nuclear-Test-Ban Treaty"
 mdr_treaty_join_2_desc: "We commit to carrying out no nuclear tests."
 mdr_treaty_leave_2: "Leave the Comprehensive Nuclear-Test-Ban Treaty"
 mdr_treaty_leave_2_desc: "We withdraw our signature, as Russia did in 2023."
 mdr_treaty_propose_3: "Propose a Strategic Arms Reduction Treaty (START)"
 mdr_treaty_propose_3_desc: "We offer the other superpower a mutual cap on nuclear warheads. If it accepts, we both join."
 mdr_treaty_leave_3: "Leave the START Treaty"
 mdr_treaty_leave_3_desc: "Without warhead limits the arms race starts again, as when Russia suspended New START in 2023."
 mdr_treaty_propose_4: "Propose an Intermediate-Range Nuclear Forces Treaty (INF)"
 mdr_treaty_propose_4_desc: "We offer a mutual ban on intermediate-range missiles. If the other superpower accepts, we both join."
 mdr_treaty_leave_4: "Leave the INF Treaty"
 mdr_treaty_leave_4_desc: "We deploy intermediate-range missiles again, as after the INF Treaty ended in 2019."
 mdr_treaty_propose_5: "Propose an Anti-Ballistic Missile Treaty (ABM)"
 mdr_treaty_propose_5_desc: "We offer to mutually limit missile shields to keep the nuclear balance."
 mdr_treaty_leave_5: "Leave the ABM Treaty"
 mdr_treaty_leave_5_desc: "We free ourselves to build a missile shield, as the United States did in 2002."
 mdr_treaty_join_6: "Join the Treaty on Conventional Armed Forces in Europe (CFE)"
 mdr_treaty_join_6_desc: "We accept limits on our tanks and artillery in Europe in exchange for mutual transparency."
 mdr_treaty_leave_6: "Suspend the Conventional Armed Forces in Europe Treaty"
 mdr_treaty_leave_6_desc: "We stop applying the limits, as Russia did in 2007."
 mdr_treaty_join_7: "Join the Open Skies Treaty"
 mdr_treaty_join_7_desc: "We allow unarmed observation flights over our territory in exchange for flying over the others."
 mdr_treaty_leave_7: "Leave the Open Skies Treaty"
 mdr_treaty_leave_7_desc: "We stop allowing observation flights, as the United States did in 2020 and Russia in 2021."
 mdr_treaty_join_8: "Sign the Ottawa Convention on Landmines"
 mdr_treaty_join_8_desc: "We ban anti-personnel mines. It improves our image, but we lose a defensive tool."
 mdr_treaty_leave_8: "Leave the Ottawa Convention"
 mdr_treaty_leave_8_desc: "We mine our borders again for defense, as Poland, Finland and the Baltic states did in 2025."
 mdr_treaty_join_9: "Sign the Convention on Cluster Munitions"
 mdr_treaty_join_9_desc: "We ban cluster bombs, which leave thousands of unexploded bomblets behind."
 mdr_treaty_leave_9: "Leave the Convention on Cluster Munitions"
 mdr_treaty_leave_9_desc: "We bring cluster munitions back into our arsenal, as Lithuania did in 2025."
 mdr_treaty_propose_10: "Negotiate a Nuclear Deal with the United States"
 mdr_treaty_propose_10_desc: "We limit our uranium enrichment in exchange for sanctions relief, as in the 2015 deal. The United States will decide whether to accept."
 mdr_treaty_leave_10: "Leave the Iran Nuclear Deal"
 mdr_treaty_leave_10_desc: "The deal ends: Iran loses sanctions relief and is free of enrichment limits, as after the US withdrawal in 2018."
 mdr_treaties.1.t: "International Pressure"
 mdr_treaties.1.d1: "The United Nations and the great powers are asking us to sign the Non-Proliferation Treaty. It would bring civil nuclear cooperation, but we would renounce atomic weapons."
 mdr_treaties.1.d2: "Several governments ask us to sign the Comprehensive Nuclear-Test-Ban Treaty as a gesture of goodwill."
 mdr_treaties.1.d8: "An international campaign asks us to sign the Ottawa Convention and destroy our anti-personnel mines."
 mdr_treaties.1.a: "We will sign."
 mdr_treaties.1.b: "We reject the proposal."
 mdr_treaties.2.t: "Proposal from [From.GetNameDef]"
 mdr_treaties.2.d3: "[From.GetNameDefCap] proposes a new strategic arms reduction treaty to cap the warheads of both countries."
 mdr_treaties.2.d4: "[From.GetNameDefCap] proposes a mutual ban on intermediate-range missiles."
 mdr_treaties.2.d5: "[From.GetNameDefCap] proposes mutual limits on missile defense systems to keep the nuclear balance."
 mdr_treaties.2.d10: "[From.GetNameDefCap] offers to limit its nuclear program if we lift part of the sanctions."
 mdr_treaties.2.a: "We accept."
 mdr_treaties.2.b: "We reject the proposal."
 mdr_treaties.3.t: "A Historic Decision"
 mdr_treaties.3.d1: "In real history, the United States left the ABM Treaty in 2002 to build its missile shield. Do we follow that path?"
 mdr_treaties.3.d2: "In real history, North Korea left the Non-Proliferation Treaty in 2003 to develop nuclear weapons. Do we follow that path?"
 mdr_treaties.3.d3: "In real history, Cuba signed the Non-Proliferation Treaty in 2002. Do we sign it?"
 mdr_treaties.3.d4: "In real history, Russia suspended the Conventional Armed Forces in Europe Treaty in 2007. Do we follow that path?"
 mdr_treaties.3.d6: "In real history, Iran signed the 2015 nuclear deal with the great powers: limits on enrichment in exchange for sanctions relief. Do we sign it?"
 mdr_treaties.3.d7: "In real history, the United States left the Iran nuclear deal in 2018. Do we follow that path?"
 mdr_treaties.3.d8: "In real history, the United States left the INF Treaty in 2019, accusing Russia of violating it. Do we follow that path?"
 mdr_treaties.3.d9: "In real history, the United States left the Open Skies Treaty in 2020. Do we follow that path?"
 mdr_treaties.3.d10: "In real history, Russia left the Open Skies Treaty in 2021. Do we follow that path?"
 mdr_treaties.3.d11: "In real history, Russia suspended New START in 2023 during the war in Ukraine. Do we follow that path?"
 mdr_treaties.3.d12: "In real history, Russia revoked its ratification of the Comprehensive Nuclear-Test-Ban Treaty in 2023. Do we follow that path?"
 mdr_treaties.3.d13: "In real history, Lithuania left the Convention on Cluster Munitions in 2025 over the Russian threat. Do we follow that path?"
 mdr_treaties.3.d14: "In real history, in 2025 we left the Ottawa Convention to mine the border with Russia again. Do we follow that path?"
 mdr_treaties.3.d15: "In real history, around this time we signed the Ottawa Convention on landmines. Do we sign it?"
 mdr_treaties.3.a: "Follow the course of history."
 mdr_treaties.3.b: "Keep our current policy."
 mdr_treaties.4.t: "[mdr_treaty_news_country.GetNameDefCap] Leaves a Treaty"
 mdr_treaties.4.d1: "[mdr_treaty_news_country.GetNameDefCap] has left the Nuclear Non-Proliferation Treaty. The world fears a new atomic power."
 mdr_treaties.4.d2: "[mdr_treaty_news_country.GetNameDefCap] has withdrawn its signature from the Comprehensive Nuclear-Test-Ban Treaty."
 mdr_treaties.4.d3: "[mdr_treaty_news_country.GetNameDefCap] has left the strategic arms reduction treaty. For the first time in decades, there are no limits on the nuclear arsenals of the superpowers."
 mdr_treaties.4.d4: "[mdr_treaty_news_country.GetNameDefCap] has left the intermediate-range missile treaty. Europe fears a new Euromissile crisis."
 mdr_treaties.4.d5: "[mdr_treaty_news_country.GetNameDefCap] has left the Anti-Ballistic Missile Treaty to build its missile shield."
 mdr_treaties.4.d6: "[mdr_treaty_news_country.GetNameDefCap] has suspended the Conventional Armed Forces in Europe Treaty."
 mdr_treaties.4.d7: "[mdr_treaty_news_country.GetNameDefCap] has left the Open Skies Treaty."
 mdr_treaties.4.d8: "[mdr_treaty_news_country.GetNameDefCap] has left the Ottawa Convention and will use anti-personnel mines again."
 mdr_treaties.4.d9: "[mdr_treaty_news_country.GetNameDefCap] has left the Convention on Cluster Munitions."
 mdr_treaties.4.d10: "The Iran nuclear deal has collapsed after the withdrawal of [mdr_treaty_news_country.GetNameDef]."
 mdr_treaties.4.a: "A more dangerous world."

 mdr_straits_category: "Maritime Chokepoints"
 mdr_straits_category_desc: "Much of the trade and oil of the world passes through a few straits. Whoever controls one can close it in wartime: oil prices soar and exporters lose their route, but the rest of the world sees it as aggression. A closure lasts at most 120 days. Naval powers can reopen a strait with an escort mission."
 mdr_strait_route_blocked: "Trade Route Blocked"
 mdr_strait_route_blocked_desc: "The strait our oil exports pass through is closed. Tankers take huge detours or stay in port."
 mdr_strait_supply_shock: "Malacca Supply Crisis"
 mdr_strait_supply_shock_desc: "The closure of the Strait of Malacca cut the route for the oil and raw materials we import."
 mdr_panama_drought: "Panama Canal Drought"
 mdr_panama_drought_desc: "Lack of rain has lowered Gatun Lake and the canal has had to limit ship transits."
 mdr_straits.3.t: "A Container Ship Blocks the Suez Canal"
 mdr_straits.3.d: "The Ever Given, one of the largest container ships in the world, has run aground sideways in the Suez Canal. Hundreds of ships are waiting at both ends and every day of blockage holds up billions of dollars in trade."
 mdr_straits.3.a: "One ship paralyzes the world."
 mdr_straits.4.t: "Drought at the Panama Canal"
 mdr_straits.4.d: "The worst drought in decades has lowered Gatun Lake, which feeds the canal locks. The authorities are limiting transits and shipping lines are looking for other routes."
 mdr_straits.4.a: "Climate change hits trade."
 mdr_straits.5.t: "Attacks in the Red Sea"
 mdr_straits.5.d: "The Houthis of Yemen are attacking merchant ships in the Bab el-Mandeb with missiles and drones. The big shipping lines are diverting around the Cape of Good Hope and trade between Asia and Europe is getting more expensive."
 mdr_straits.5.a: "The busiest route in the world, in flames."
 mdr_straits.6.t: "A Ship Runs Aground in the Suez Canal"
 mdr_straits.6.d: "A large merchant ship has run aground in the Suez Canal and blocked it for several days. Hundreds of ships are waiting at both ends."
 mdr_straits.6.a: "Patience."

 mdr_reserves_frozen: "Frozen Reserves"
 mdr_reserves_frozen_desc: "The countries that issue our reserve currency have frozen the savings we kept in their banks. Our currency is shaky and nobody lends to us cheaply."
 mdr_recruitment_crisis: "Recruitment Crisis"
 mdr_recruitment_crisis_desc: "With low unemployment and a small defense budget, hardly anyone wants to join our volunteer army."
 mdr_mobilization: "Reservist Mobilization"
 mdr_mobilization_desc: "We have called up hundreds of thousands of reservists. Factories are losing workers and many young people are trying to leave the country."
 mdr_military.1.t: "Our Reserves Have Been Frozen"
 mdr_military.1.d: "The central banks that held our reserves abroad have frozen them, as happened to Afghanistan in 2021 and Russia in 2022. We lost access to much of our savings overnight."
 mdr_military.1.a: "Never again: we will hold our own reserves and gold."
 mdr_military.1.b: "Denounce the theft before the world."
 mdr_military_category: "Defense and Recruitment"
 mdr_military_category_desc: "Measures to keep the ranks of our armed forces filled."
 mdr_mobilize_reservists: "Mobilize the Reservists"
 mdr_mobilize_reservists_desc: "We call up about 0.3% of the population, as Israel did in 2023 or Russia in 2022. For 180 days factories lose workers and Stability drops. It can be repeated once a year."
 mdr_mobilization_cooldown_tt: "At least a year has passed since the last mobilization"
 mdr_recruitment_campaign: "Recruitment Campaign"
 mdr_recruitment_campaign_desc: "We raise military pay, offer scholarships and launch advertising to attract volunteers. It ends the recruitment crisis for a year."

 mdr_disaster_aid_large: "Sent us generous aid after a catastrophe"
 mdr_disaster_aid_small: "Sent us aid after a catastrophe"
 mdr_left_arms_treaty: "Left an arms treaty"
 mdr_closed_strait: "Closed a maritime chokepoint"
 mdr_reopened_strait: "Reopened a maritime chokepoint"

 mdr_disasters.1.t: "Earthquake in [mdr_disaster_state.GetName]"
 mdr_disasters.1.d1: "A moderate earthquake hit [mdr_disaster_state.GetName]. There is local damage, but most people are safe."
 mdr_disasters.1.d2: "A severe earthquake hit [mdr_disaster_state.GetName]. Homes, roads and factories are damaged and thousands have been evacuated.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.1.d3: "A catastrophic earthquake devastated [mdr_disaster_state.GetName]. Thousands are dead and the hospitals still standing cannot cope. It is the worst tragedy in decades.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.2.t: "Tsunami in [mdr_disaster_state.GetName]"
 mdr_disasters.2.d1: "A moderate tsunami hit [mdr_disaster_state.GetName]. There is local damage, but most people are safe."
 mdr_disasters.2.d2: "A severe tsunami hit [mdr_disaster_state.GetName]. Homes, roads and factories are damaged and thousands have been evacuated.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.2.d3: "A catastrophic tsunami devastated [mdr_disaster_state.GetName]. Thousands are dead and the hospitals still standing cannot cope. It is the worst tragedy in decades.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.3.t: "Tropical Storm in [mdr_disaster_state.GetName]"
 mdr_disasters.3.d1: "A moderate tropical storm hit [mdr_disaster_state.GetName]. There is local damage, but most people are safe."
 mdr_disasters.3.d2: "A severe tropical storm hit [mdr_disaster_state.GetName]. Homes, roads and factories are damaged and thousands have been evacuated.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.3.d3: "A catastrophic tropical storm devastated [mdr_disaster_state.GetName]. Thousands are dead and the hospitals still standing cannot cope. It is the worst tragedy in decades.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.9.t: "Tornado in [mdr_disaster_state.GetName]"
 mdr_disasters.9.d1: "A tornado touched down in [mdr_disaster_state.GetName]. It tore off roofs and brought down power lines along its path, but the warning sirens gave people time to take shelter."
 mdr_disasters.9.d2: "An outbreak of tornadoes swept across [mdr_disaster_state.GetName]. Whole neighbourhoods were flattened, factories are damaged and thousands of families have lost their homes.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.9.d3: "One of the most violent tornado outbreaks on record wiped entire towns in [mdr_disaster_state.GetName] off the map. The death toll keeps rising and the region's infrastructure is in ruins.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.4.t: "Floods in [mdr_disaster_state.GetName]"
 mdr_disasters.4.d1: "A moderate flood hit [mdr_disaster_state.GetName]. There is local damage, but most people are safe."
 mdr_disasters.4.d2: "A severe flood hit [mdr_disaster_state.GetName]. Homes, roads and factories are damaged and thousands have been evacuated.\n\nEach relief option shortens the crisis, but has a price."
