 mdr_disasters.5.t: "Wildfires in [mdr_disaster_state.GetName]"
 mdr_disasters.5.d1: "A moderate wildfire hit [mdr_disaster_state.GetName]. There is local damage, but most people are safe."
 mdr_disasters.5.d2: "A severe wildfire hit [mdr_disaster_state.GetName]. Homes, roads and factories are damaged and thousands have been evacuated.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.5.d3: "A catastrophic wildfire devastated [mdr_disaster_state.GetName]. Thousands are dead and the hospitals still standing cannot cope. It is the worst tragedy in decades.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.6.t: "Heatwave in [mdr_disaster_state.GetName]"
 mdr_disasters.6.d1: "A moderate heatwave hit [mdr_disaster_state.GetName]. There is local damage, but most people are safe."
 mdr_disasters.6.d2: "A severe heatwave hit [mdr_disaster_state.GetName]. Homes, roads and factories are damaged and thousands have been evacuated.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.6.d3: "A catastrophic heatwave devastated [mdr_disaster_state.GetName]. Thousands are dead and the hospitals still standing cannot cope. It is the worst tragedy in decades.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.7.t: "Industrial Accident in [mdr_disaster_state.GetName]"
 mdr_disasters.7.d1: "A moderate industrial accident hit [mdr_disaster_state.GetName]. There is local damage, but most people are safe."
 mdr_disasters.7.d2: "A severe industrial accident hit [mdr_disaster_state.GetName]. Homes, roads and factories are damaged and thousands have been evacuated.\n\nEach relief option shortens the crisis, but has a price."
 mdr_disasters.7.d3: "A catastrophic industrial accident devastated [mdr_disaster_state.GetName]. Thousands are dead and the hospitals still standing cannot cope. It is the worst tragedy in decades.\n\nEach relief option shortens the crisis, but has a price."
