 mdr_space.1.t: "Mission Accomplished: [mdr_space_last_name]"
 mdr_space.1.d: "The agency has finished [mdr_space_last_name]. Its effects now apply, and the programme can move on."
 mdr_space.1.a: "Onward."
 mdr_space.2.t: "Launch Failure"
 mdr_space.2.d: "The launch of [mdr_space_last_name] failed and the investment was lost. It can be tried again."
 mdr_space.2.a: "We will try again."
 mdr_space.3.t: "Low Orbit Fills with Debris"
 mdr_space.3.d: "Collisions between debris now threaten every satellite. Launching costs more and is riskier, until someone cleans it up."
 mdr_space.3.a: "Something must be done."
 mdr_space.4.t: "Colony Short of Supplies"
 mdr_space.4.d: "One of our colonies is running out of supplies. If they do not arrive soon, morale will fall and we will lose settlers."
 mdr_space.4.a: "Help must be sent."
