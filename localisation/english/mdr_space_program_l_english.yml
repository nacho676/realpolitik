 MDR_SPACE_HELP_D: "Journeys and accords. Launches can fail, and each row says what it still needs."
 MDR_SPACE_HELP_G: "National goals. They are met by achieving what they ask: then you claim the prestige, which gives stability and political power."
 MDR_SPACE_HELP_S: "Click a planet to see what is needed to get there."
 MDR_SPACE_HELP_C: "Each settler uses supplies and gives science. Keep the bars up with modules or a cargo route."
 MDR_SPACE_HELP_A: "More staff gives more science and shortens projects, but it is paid every week."
