 MDR_SPACE_GO_TT: "Takes you to the page where this is done."
 MDR_SPACE_GUIDE: "Guide"
 MDR_SPACE_GUIDE_TT: "How the space programme works, step by step."
 MDR_SPACE_CHANCE: "Launch success: §Y[?mdr_space_chance_pct|0]%§!"
 MDR_SPACE_GUIDE_INTRO: "HOW IT WORKS, IN 7 STEPS"
 MDR_SPACE_G1: "1. Set a budget"
 MDR_SPACE_G1_T: "It leaves the economy every week and makes §Gscience§!, the programme's currency. In 2000 almost everyone put between 0.01% and 0.15% of GDP; above 0.5% is a big bet."
 MDR_SPACE_G2: "2. Build spaceports"
 MDR_SPACE_G2_T: "In the construction screen, under state buildings. Each level gives science and improves launchers."
 MDR_SPACE_G3: "3. Research"
 MDR_SPACE_G3_T: "In the research screen, Space Programme tab. Each research says what it opens. Space Travel opens the destinations."
 MDR_SPACE_G4: "4. Run projects"
 MDR_SPACE_G4_T: "Permanent upgrades paid with science and money. Only a few run at a time: the rest wait in the queue."
 MDR_SPACE_G5: "5. Launch missions"
 MDR_SPACE_G5_T: "Probes, crewed journeys and bases, in Decisions. They can fail. First a probe, then a crew, then a base."
 MDR_SPACE_G6: "6. Claim goals"
 MDR_SPACE_G6_T: "When a goal is met, claim it in Goals. Prestige gives stability and political power."
 MDR_SPACE_G7: "7. Look after colonies"
 MDR_SPACE_G7_T: "Bases on the Moon and Mars open colonies. If supplies run out, morale falls and settlers are lost."
 MDR_COL_NONE_MOON: "§YMoon:§! [mdr_col_moon_step]"
 MDR_COL_NONE_MARS: "§YMars:§! [mdr_col_mars_step]"
 MDR_SPACE_TIP_TECHS: "Researches finished in the Space Programme tab. They are done in the research screen."
 MDR_SPACE_TIP_SITES: "States with a spaceport. They are built in the construction screen, under state buildings, up to 3 levels per state."
 MDR_SPACE_TIP_PCT: "Share of GDP going to the programme each year. It is changed in Finance."
 MDR_SPACE_TIP_SCIENCE: "Science gathered. It pays for projects and missions. It rises each week from the budget, scientists, spaceports and colonies."
 MDR_SPACE_TIP_BONUS: "Research speed given by the budget, for the whole country."
 MDR_SPACE_TIP_PRESTIGE: "It rises with goals and great missions. It gives stability and political power."
 MDR_SPACE_TIP_SCIENTISTS: "Every 50 scientists give 0.2 science a week and cost $$0.001B."
 MDR_SPACE_TIP_ENGINEERS: "Every 100 engineers shorten projects and missions by 5%, and cost $$0.002B a week."
 MDR_SPACE_TIP_ASTRONAUTS: "Crewed missions need a minimum. Every 2 astronauts cost $$0.0008B a week."
 MDR_COL_TIP_POP: "Each settler gives science and research, and uses supplies. They are sent with the button below."
 MDR_COL_TIP_MORALE: "It falls if a supply drops below 15. Below 25% settlers are lost."
 MDR_COL_GREENHOUSE_TT: "§YGreenhouse:§! 0.9 food a week. Costs $$0.8B on the Moon and $$2.6B on Mars."
 MDR_COL_MINE_TT: "§YIce mine:§! 0.8 water and oxygen a week. Costs $$0.8B on the Moon and $$2.6B on Mars."
 MDR_COL_REACTOR_TT: "§YReactor:§! 1.1 energy a week. Costs $$0.8B on the Moon and $$2.6B on Mars."
 MDR_COL_WORKSHOP_TT: "§YWorkshop:§! +0.3% military factory output. Costs $$0.8B on the Moon and $$2.6B on Mars."
 MDR_SPACE_TIP_FIELD: "Type on your keyboard. The arrows move the cursor. Backspace and Delete erase."
 MDR_SPACE_STEP_WAIT: "§GEverything is running.§! Wait for them to finish, or queue more."
