l_english:
 MDR_RULES: "Realpolitik"
 MDR_RULE_COVID: "COVID-19 Pandemic"
 MDR_RULE_COVID_HISTORICAL: "Historical"
 MDR_RULE_COVID_HISTORICAL_DESC: "The outbreak starts in Wuhan in December 2019 and reaches each country on the date it hit in reality, from South Korea and Italy in February 2020 to the rest of the world by April. Vaccination campaigns start in December 2020, first in wealthy countries."
 MDR_RULE_COVID_ORIGINAL: "Original Millennium Dawn"
 MDR_RULE_COVID_ORIGINAL_DESC: "Keeps the Millennium Dawn pandemic: it starts in late 2020 and reaches every country at a random time."
 MDR_RULE_COVID_DISABLED: "Disabled"
 MDR_RULE_COVID_DISABLED_DESC: "There is no COVID-19 pandemic."

 mdr_covid.1.t: "Mass Vaccination Campaign"
 mdr_covid.1.d: "Vaccine deliveries have reached [This.GetNameDef]. Clinics, stadiums and pharmacies are inoculating millions every week, hospitals are emptying and the lockdowns are being lifted."
 mdr_covid.1.a: "Back to normal life."

 MDR_RULE_DIAGNOSTICS: "Diagnostic Mode"
 MDR_RULE_DIAGNOSTICS_NO: "Off"
 MDR_RULE_DIAGNOSTICS_NO_DESC: "Hides the Realpolitik diagnostic decisions."
 MDR_RULE_DIAGNOSTICS_YES: "On"
 MDR_RULE_DIAGNOSTICS_YES_DESC: "Tests itself while the game runs, with no input: for 160 days it forces situations (empty ammunition and food, Suez closed, market shocks, a disaster, a captured general, a ship offer, COVID) and checks the result, then checks every system and every country each week. Everything goes to game.log; run herramientas/revisar_logs.pl to read it. Also shows the diagnostic decisions. Only for testing: it changes the game."

 mdr_information: "Society and Information"
 mdr_media_law: "Media Law"
 mdr_media_free_req_tt: "Current Media Law is §Y$mdr_media_regulated$§!"
 mdr_media_regulated_req_tt: "Current Media Law is §Y$mdr_media_free$§! or §Y$mdr_media_pressured$§!"
 mdr_media_pressured_req_tt: "Current Media Law is §Y$mdr_media_regulated$§! or §Y$mdr_media_censored$§!"
 mdr_media_censored_req_tt: "Current Media Law is §Y$mdr_media_pressured$§! or §Y$mdr_media_total_control$§!"
 mdr_media_total_control_req_tt: "Current Media Law is §Y$mdr_media_censored$§!"
 mdr_media_free: "Full Press Freedom"
 mdr_media_free_desc: "Independent newspapers, broadcasters and websites investigate the government without interference. Open information drives research and the information economy, but every scandal and every foreign narrative reaches our citizens."
 mdr_media_regulated: "Regulated Free Press"
 mdr_media_regulated_desc: "The press is free within laws on defamation, ownership and broadcasting licences. Most democracies work under this model."
 mdr_media_pressured: "Media Under Government Pressure"
 mdr_media_pressured_desc: "Major outlets belong to allies of the government, and critical journalists face lawsuits and tax audits. Independent voices survive, but they reach fewer people. Opening up from §YState Censorship§! briefly costs Stability as silenced grievances surface."
 mdr_media_censored: "State Censorship"
 mdr_media_censored_desc: "State agencies license all media, filter the internet and block foreign news sites. Opening up from §YAbsolute Control of Information§! briefly costs Stability."
 mdr_media_total_control: "Absolute Control of Information"
 mdr_media_total_control_desc: "Every broadcast, publication and connection passes through the state. A national intranet replaces the global internet, shielding the regime from outside influence while crippling research and the information economy."

 mdr_economic_policy_category: "Economic Policy"
 mdr_economic_policy_category_desc: "Emergency and control measures that real governments use. Every one has a price: what we gain today is usually paid for later."
 mdr_remove_fuel_subsidies: "Remove Fuel Subsidies"
 mdr_remove_fuel_subsidies_desc: "Letting fuel cost what it is worth saves a fortune in social spending, but people take to the streets, as in Iran in 2019, Ecuador in 2019 or Nigeria in 2023. We will face protests for 180 days."
 mdr_introduce_fuel_subsidies: "Subsidize Fuel"
 mdr_introduce_fuel_subsidies_desc: "The state pays part of the price of fuel so citizens buy it cheap. It calms the streets, but the cost is added to social spending every week."
 mdr_impose_capital_controls: "Impose Capital Controls"
 mdr_impose_capital_controls_desc: "We limit the purchase of dollars and the outflow of money. It stops capital flight and props up the currency, but scares off foreign investment and creates a parallel exchange rate. The longer it lasts, the wider the gap: it worsens after 6 months and again after 18 months."
 mdr_lift_capital_controls: "Lift Capital Controls"
 mdr_lift_capital_controls_desc: "Freeing the exchange rate restores investor confidence, but the currency devalues at once. If the gap was already wide, the hit to Stability is larger."
 mdr_freeze_prices: "Freeze Prices"
 mdr_freeze_prices_desc: "We fix the price of basic goods by law. In the first months it softens the impact of inflation, but shortages begin after 3 months and become severe after 6. Once frozen, prices must stay frozen for at least 6 months."
 mdr_unfreeze_prices: "Unfreeze Prices"
 mdr_unfreeze_prices_desc: "Releasing prices ends the shortages, but prices jump for a few months."
 mdr_fuel_subsidies_cooldown_tt: "At least a year has passed since the last change to fuel subsidies"
 mdr_capital_controls_cooldown_tt: "At least a year has passed since we last lifted capital controls"
 mdr_price_freeze_cooldown_tt: "At least a year has passed since the last price freeze"
 mdr_price_freeze_min_tt: "Prices have been frozen for at least 26 weeks (currently [?mdr_price_freeze_weeks|0])"

 mdr_fuel_subsidies: "Fuel Subsidies"
 mdr_fuel_subsidies_desc: "The state pays part of the price of fuel. Citizens see it as an acquired right."
 mdr_fuel_subsidy_protests: "Fuel Price Protests"
 mdr_fuel_subsidy_protests_desc: "The end of subsidies sent fuel and transport prices soaring. Roads are blocked and protests spread across the country."
 mdr_capital_controls_1: "Capital Controls"
 mdr_capital_controls_1_desc: "Controls stop dollars from leaving. For now the gap with the parallel rate is small."
 mdr_capital_controls_2: "Capital Controls: Widening Gap"
 mdr_capital_controls_2_desc: "The parallel dollar now trades far above the official rate. Black-market deals and corruption around access to foreign currency are flourishing."
 mdr_capital_controls_3: "Capital Controls: Extreme Gap"
 mdr_capital_controls_3_desc: "Nobody trusts the official exchange rate. Companies cannot send profits abroad and the real economy suffers."
 mdr_devaluation_shock: "Devaluation Shock"
 mdr_devaluation_shock_desc: "The currency snapped to its real value after capital controls were lifted."
 mdr_price_freeze_1: "Frozen Prices"
 mdr_price_freeze_1_desc: "The prices of basic goods are fixed by law. For now the shelves are still full."
 mdr_price_freeze_2: "Frozen Prices: Shortages"
 mdr_price_freeze_2_desc: "Producers stop selling at a loss. Goods are missing from stores and the black market grows."
 mdr_price_freeze_3: "Frozen Prices: Severe Shortages"
 mdr_price_freeze_3_desc: "Long queues and empty shelves. People blame the government for the scarcity."
 mdr_price_release: "Price Release"
 mdr_price_release_desc: "After the freeze, prices jump to their market value at once."
 mdr_fund_relief: "Stabilization Fund Deployed"
 mdr_fund_relief_desc: "Our savings finance the crisis response: support for companies, public works and health spending."
 mdr_fund_trust: "Market Confidence"
 mdr_fund_trust_desc: "Our stabilization fund holds at least 5% of GDP. Creditors lend to us more cheaply."

 mdr_stabilization_fund_category: "Stabilization and Emergency Fund"
 mdr_stabilization_fund_category_desc: "We save in good times to spend in bad times, as Norway, Chile and the Gulf states do.\n\nFund balance: §Y[?mdr_fund_balance|1]§! billion dollars\nCurrent contribution: §Y[?mdr_fund_rate|1]%§! of GDP per year\n\nThe fund earns 3% a year. Once it reaches 5% of GDP, markets lend to us more cheaply."
 mdr_fund_contribute_low: "Contribute 0.5% of GDP per Year"
 mdr_fund_contribute_low_desc: "Each week, money equal to 0.5% of GDP per year moves from the treasury to the fund."
 mdr_fund_contribute_high: "Contribute 1% of GDP per Year"
 mdr_fund_contribute_high_desc: "Each week, money equal to 1% of GDP per year moves from the treasury to the fund."
 mdr_fund_stop_contributions: "Stop Contributing to the Fund"
 mdr_fund_stop_contributions_desc: "The fund stops receiving money, but keeps its balance and keeps earning interest."
 mdr_fund_use: "Use the Fund Against the Crisis"
 mdr_fund_use_desc: "We spend up to 2% of GDP from the fund on the crisis. The money returns to the treasury, and for 180 days the economy and Stability get relief that offsets part of the blow."
 mdr_fund_use_cooldown_tt: "At least 180 days have passed since we last used the fund"
 mdr_fund_crisis_tt: "We are in a crisis: COVID-19 pandemic, recession or depression"
 mdr_fund_min_balance_tt: "The fund holds more than one billion dollars"

 mdr_diag_start_covid: "Start the Historical COVID Now"
 mdr_diag_start_covid_desc: "Launches the Wuhan outbreak and the per-country waves now, with the same gaps in days as the historical mode. Useful for testing without waiting for December 2019."
 mdr_diag_start_vaccines: "Start Vaccinations Now"
 mdr_diag_start_vaccines_desc: "Launches the vaccination campaigns now, without waiting for December 2020."

 mdr_diagnostics_category: "Realpolitik: Diagnostics"
 mdr_diagnostics_category_desc: "Test tools for Realpolitik. Reports are written to game.log."
 mdr_diag_show_status: "Show System Status"
 mdr_diag_show_status_desc: "Version: [?global.mdr_version]\nMedia system initialized: [?global.mdr_media_init]\nOur Media Law level: [?mdr_media_level]\n\nTaking this decision writes the same values to game.log."
 mdr_diag_rerun_country_init: "Reset Country Setup"
 mdr_diag_rerun_country_init_desc: "Runs the Realpolitik country setup again. This resets our Media Law to its starting level."
