l_english:
 mdr_war_exhaustion: "War Exhaustion"
 MDR_WEX_TOPBAR: "[?mdr_wex|0]%"
 MDR_WEX_TOPBAR_TT: "§YWar Exhaustion§!\nValue: §Y[?mdr_wex|2]%§!  (maximum 30%)\nWeekly change: §Y[?mdr_wex_change|2]%§!\n§YThis week:§!\nCasualties: §R[?mdr_wex_from_losses|2]%§!\nOccupied states: §R[?mdr_wex_from_land|2]%§!\nAmmunition and food shortages: §R[?mdr_wex_from_shortage|2]%§!\nLength of the war: §R[?mdr_wex_from_length|2]%§!\nGovernment, press and war support: §Y[?mdr_wex_from_regime|2]%§!\nAt peace: §G[?mdr_wex_from_peace|2]%§!\n§YEffects now:§!\nStability: §R[?mdr_wex_stability|%1]§!\nWar Support: §R[?mdr_wex_war_support|%1]§!\nArmy Morale: §R[?mdr_wex_morale|%1]§!\nOrganization Regain: §R[?mdr_wex_org|%1]§!\nConscription: §R[?mdr_wex_conscription|%1]§!\nRepair Speed: §R[?mdr_wex_repair|%1]§!\n--------------\n§YWar Exhaustion§! is the public's weariness with a long or bloody war. It grows with each week's casualties against the population, with home states held by the enemy, with ammunition or food running short and with the war dragging on. Democracies feel it more; regimes without elections, controlled media and high war support blunt it. In peace it fades by 0.71% a week. Above 15% it also feeds hidden unrest, and the protests and strikes it brings."
