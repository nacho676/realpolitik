l_english:
 MDR_RULE_SHOCKS: "Market Shocks"
 MDR_RULE_SHOCKS_HISTORICAL: "Historical"
 MDR_RULE_SHOCKS_HISTORICAL_DESC: "The big real shocks arrive on their dates: Iraq war (2003), uranium boom (2006), food crisis (2007), oil peak (2008) and its crash, expensive oil from 2010 to 2014, Fukushima (2011), oil crash (2014), COVID-19 (2020) and the war in Ukraine (2022). Also, if the game causes an obvious one (a Gulf war, Hormuz closed, a war between Russia and Ukraine or droughts in several countries at once), it happens too."
 MDR_RULE_SHOCKS_DYNAMIC: "Dynamic"
 MDR_RULE_SHOCKS_DYNAMIC_DESC: "No fixed dates. Shocks come from what happens in the game (Gulf wars, Hormuz closed, a war between Russia and Ukraine, droughts) and, rarely, from causes nobody sees coming, such as an OPEC price war."
 mdr_shocks_news_a: "Markets wait for no one."
 mdr_shocks.1.t: "Oil Prices Soar"
 mdr_shocks.1.d: "The price of a barrel of oil jumps on every market in the world. Exporters fill their coffers; importers pay more for fuel, transport and energy.\n\n[mdr_shock_cause_text]"
 mdr_shocks.2.t: "Oil Prices Collapse"
 mdr_shocks.2.d: "Oil falls to prices not seen in years. For importers it is a relief; for the countries that live off exporting it, the start of a crisis.\n\n[mdr_shock_cause_text]"
 mdr_shocks.3.t: "World Food Crisis"
 mdr_shocks.3.d: "Grain prices climb without end. Countries that import their food pay far more to feed their people, and bread protests start in the poorest cities.\n\n[mdr_shock_cause_text]"
 mdr_shocks.4.t: "Grain Prices Fall"
 mdr_shocks.4.d: "Plentiful harvests sink grain prices. Food is cheaper, but farmers in exporting countries earn much less.\n\n[mdr_shock_cause_text]"
 mdr_shocks.5.t: "Uranium Prices Soar"
 mdr_shocks.5.d: "Uranium becomes scarce and expensive. Countries with mines make fortunes; those that import it for their reactors see nuclear power cost more.\n\n[mdr_shock_cause_text]"
 mdr_shocks.6.t: "Uranium Prices Collapse"
 mdr_shocks.6.d: "Demand for uranium collapses and its price falls. Mines close or lose money, and several nuclear projects are put on hold.\n\n[mdr_shock_cause_text]"
 MDR_SHOCK_CAUSE_1: "The invasion of Iraq puts the supply of the whole Persian Gulf in doubt."
 MDR_SHOCK_CAUSE_2: "Demand from China and India grows faster than production, and speculators bet the barrel will keep rising."
 MDR_SHOCK_CAUSE_3: "The financial crisis slows the world economy and oil demand collapses."
 MDR_SHOCK_CAUSE_4: "The world economy recovers and Asian demand keeps the barrel above a hundred dollars."
 MDR_SHOCK_CAUSE_5: "American shale oil floods the market and OPEC refuses to cut its output."
 MDR_SHOCK_CAUSE_6: "The pandemic stops travel and factories: there is too much oil and nowhere to store it."
 MDR_SHOCK_CAUSE_7: "The war in Ukraine and the sanctions on Russia cut off part of the world's oil and grain."
 MDR_SHOCK_CAUSE_8: "The uranium stocks from old nuclear weapons run out, a key mine floods and everyone wants to build reactors."
 MDR_SHOCK_CAUSE_9: "The Fukushima accident shuts reactors in Japan and Germany, and the world doubts nuclear power."
 MDR_SHOCK_CAUSE_10: "Poor harvests in Australia, biofuels eating up maize and countries banning rice and wheat exports."
 MDR_SHOCK_CAUSE_11: "War in the Persian Gulf threatens the world's largest oil producers."
 MDR_SHOCK_CAUSE_12: "The closing of the Strait of Hormuz traps a huge share of the world's oil."
 MDR_SHOCK_CAUSE_13: "The war between Russia and Ukraine cuts off Russian oil and Black Sea grain."
 MDR_SHOCK_CAUSE_14: "Severe droughts in several big producers at once destroy much of the world harvest."
 MDR_SHOCK_CAUSE_15: "OPEC splits and its members start a price war to keep their customers."
 MDR_SHOCK_CAUSE_16: "Attacks on key pipelines and refineries cut supply all at once."
 MDR_SHOCK_CAUSE_17: "Pests and extreme weather ruin harvests on several continents."
 MDR_SHOCK_CAUSE_18: "An accident at one of the world's largest uranium mines leaves the market without supply."
 mdr_oil_bust: "Oil Bust"
 mdr_oil_bust_desc: "We live off oil exports and the price has collapsed. State income falls, the currency weakens and people blame the government. The more we depend on oil and the lower the price, the worse the crisis."
 mdr_oil_boom: "Oil Boom"
 mdr_oil_boom_desc: "Expensive oil fills our coffers and the country is calm. But everything is invested in oil and the rest of industry falls behind: the Dutch disease."
 MAPMODE_MDR_CLIMATE_MAP_MODE: "Climate Risks"
 MAPMODE_MDR_CLIMATE_MAP_MODE_NAME: "Climate Risks"
 MAPMODE_MDR_CLIMATE_MAP_MODE_DESCRIPTION: "Shows the most likely natural disaster of each state and its total risk."
 mdr_climate_map_mode_tooltip: "Climate risks in [FROM.GetName]"
 mdr_climate_map_mode_tooltip_delayed: "Risk of each disaster in §Y[FROM.GetName]§! (higher means more frequent):\n  Earthquakes: §Y[?FROM.mdr_hz_q|0]§!\n  Tsunamis: §Y[?FROM.mdr_hz_t|0]§!\n  Tropical storms: §Y[?FROM.mdr_hz_s|0]§!\n  Floods: §Y[?FROM.mdr_hz_f|0]§! (plus §Y[?FROM.mdr_hz_m|0]§! in the monsoon season)\n  Wildfires: §Y[?FROM.mdr_hz_w|0]§!\n  Heatwaves and droughts: §Y[?FROM.mdr_hz_h|0]§!\n  Tornadoes: §Y[?FROM.mdr_hz_o|0]§!\n\n§HColors (the most likely disaster):§!\nViolet: earthquakes\nDark blue: tsunamis\nLight blue: tropical storms\nBlue: floods\nRed: wildfires\nOrange: heatwaves and droughts\nTeal: tornadoes\nDull green: low risk\nThe brighter the color, the higher the total risk. §YEarly Warning Centers§! and §YDikes§! reduce the damage."
 MAPMODE_MDR_SOIL_MAP_MODE: "Arable Soils"
 MAPMODE_MDR_SOIL_MAP_MODE_NAME: "Arable Soils"
 MAPMODE_MDR_SOIL_MAP_MODE_DESCRIPTION: "Shows where Cropland can be built and how fertile the soil is."
 mdr_soil_map_mode_tooltip: "Soil of [FROM.GetName]"
 mdr_soil_map_mode_tooltip_delayed: "§HColors:§!\nDark green: very fertile soil (§G+20%§! grain): black earth, Pampas, Corn Belt, Punjab, northern China.\nGreen: normal arable soil.\nYellow: poor or dry soil (§R-30%§! grain).\nBrown: nothing can be farmed (desert, tundra, swamp, closed rainforest or high mountain).\n\n§YCropland§! can only be built where there is §YArable Land§!, up to 10 levels per state."
 # Rare earths: resource, buildings, price and shocks.
 rare_earths: "Rare Earths"
 rare_earths_desc: "Neodymium, dysprosium, lanthanum and 14 other elements industry needs for magnets, screens, lasers and missile guidance. Each §YMicrochip Plant§! consumes 1 unit."
 PRODUCTION_MATERIALS_RARE_EARTHS: "Rare Earths"
 MDR_MARKET_PRICES_RARE_EARTHS: "$$ [?global.mdr_ree_price|2]"
 MDR_MARKET_PRICES_RARE_EARTHS_TT: "Price information for §YRare Earths§!:\nCurrent Income: §G$$[?mdr_ree_income|3]§!\nMin Price: §G$$ 0.30/unit§!\nMax Price: §G$$ 5.00/unit§!\nWorld production: §Y[?global.mdr_ree_supply|0]§!\nWorld consumption: §Y[?global.mdr_ree_demand|0]§!\n\nThe price starts at §Y1.00§! and rises when the world consumes more for each unit produced than at the start. Microchip plants and production lines with electronics consume it. Chinese export quotas and wars can multiply it."
 mdr_rare_earth_complex: "Rare Earth Complex"
 mdr_rare_earth_complex_plural: "Rare Earth Complexes"
 mdr_rare_earth_complex_desc: "A mine with its separation plant, where the ore is dissolved in acid and split element by element.\n\nProvides the state with:\n§YRare Earths§!: §G+6§! per level, multiplied by the state's infrastructure and energy grid\nBase Number of Required Workers: §Y6.8K§!\nBase GDP Output: §Y$1B§!\nBase Energy Consumption: §R-0.11§! GW\n\nIn any state, up to 20 levels. Each level costs more than the last."
 mdr_shocks.7.t: "Rare Earth Prices Soar"
 mdr_shocks.7.d: "Rare earths are scarce and their price multiplies. Makers of microchips, magnets and weapons scramble for suppliers, and countries with deposits reopen mines that had been closed for years.\n\n[mdr_shock_cause_text]"
 mdr_shocks.8.t: "Rare Earth Prices Collapse"
 mdr_shocks.8.d: "There are too many rare earths and their price falls. Mines that cannot compete with the Chinese ones close or lose money.\n\n[mdr_shock_cause_text]"
 MDR_SHOCK_CAUSE_19: "China imposes rare earth export quotas and stops selling to Japan after a clash at the Senkaku Islands."
 MDR_SHOCK_CAUSE_20: "China, which produces almost all of the world's rare earths, is at war and cuts its exports."
 MDR_SHOCK_CAUSE_21: "Beijing shuts the illegal mines of the south and cuts exports to protect its reserves."
