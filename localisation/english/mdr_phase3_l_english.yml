 mdr_food_shortage: "Food Shortage"
 mdr_food_shortage_desc: "Only [?mdr_food_fed_pct|1]% of the population eats enough. The more people go hungry, the more stability, political power, war support and population growth fall and inflation rises: with 5% hungry it is a nuisance, with half it is a catastrophe."
