l_english:
 MDR_RULE_COVID_DYNAMIC: "Dynamic"
 MDR_RULE_COVID_DYNAMIC_DESC: "The outbreak starts in Wuhan at a random moment after 2015 (about once a decade on average) and reaches each country at random in the following months. Vaccines arrive a year after the outbreak."

 mdr_industrial_subsidies: "Industrial Subsidies"
 mdr_industrial_subsidies_desc: "The state pays part of the investment of companies that build chip and advanced materials plants on our soil, like the US CHIPS Act of 2022."
 mdr_enact_industrial_subsidies: "Pass Industrial Subsidies"
 mdr_enact_industrial_subsidies_desc: "We attract foreign investment and speed up the construction of microchip and composite plants. It costs 0.5% of GDP per year while active."
 mdr_end_industrial_subsidies: "End Industrial Subsidies"
 mdr_end_industrial_subsidies_desc: "We stop paying the subsidies. We cannot pass them again for a year."
 mdr_industrial_subsidies_cooldown_tt: "At least a year has passed since our last industrial subsidies ended"


 mdr_ammo_shortage_1: "Scarce Ammunition"
 mdr_ammo_shortage_1_desc: "We have less than four weeks of ammunition at the current pace of fighting. Officers are rationing fire."
 mdr_ammo_shortage_2: "Ammunition Shortage"
 mdr_ammo_shortage_2_desc: "We have less than two weeks of ammunition left. Artillery only fires at priority targets."
 mdr_ammo_shortage_3: "Ammunition Exhausted"
 mdr_ammo_shortage_3_desc: "Troops at the front are running out of bullets and shells. They can only defend themselves as best they can."

 uranium: "Uranium"
 uranium_desc: "Natural uranium feeds the enrichment facilities that produce nuclear reactor fuel. Each facility consumes 1 unit; without uranium, nuclear fuel output falls."
 mdr_uranium_modifier: "Uranium for Enrichment"
 mdr_uranium_mine: "Uranium Mine"
 mdr_uranium_mine_plural: "Uranium Mines"
 mdr_uranium_mine_desc: "Open-pit, underground or in-situ leaching mine.\n\nProvides the state with:\n§YUranium§!: §G+5§! per level, §G+1§! more per mining technology, multiplied by the state's infrastructure and energy grid\nBase Number of Required Workers: §Y4.2K§!\nBase GDP Output: §Y$0.5B§!\nBase Energy Consumption: §R-0.03§! GW\n\nIn any state, up to 10 levels. Each level costs more than the last."

 mdr_early_warning_center: "Early Warning Center"
 mdr_early_warning_center_plural: "Early Warning Centers"
 mdr_early_warning_center_desc: "Seismographs, weather radars, sirens and trained emergency teams. Reduces the damage of any disaster in this state.\n\nBase Number of Required Workers: §Y250§!\nBase Energy Consumption: §R-0.002§! GW"
 mdr_coastal_dikes: "Dikes and Coastal Defenses"
 mdr_coastal_dikes_plural: "Dikes and Coastal Defenses"
 mdr_coastal_dikes_desc: "Dikes, storm barriers and sea walls, built in coastal provinces. One is enough to reduce the damage of tsunamis, tropical storms and floods in its state."
 mdr_cropland: "Cropland"
 mdr_cropland_plural: "Cropland"
 mdr_cropland_desc: "Fields of wheat, maize and rice, with their roads, irrigation and barns. Each level harvests about a million tonnes of grain a year and gives work on the land.\n\nProvides the state with:\n§YGrain§!: §G+10§! per level, multiplied by the state's infrastructure, soil and climate, and §G+1§! more for each §YFertilizers§! technology researched\nBase Number of Required Workers: §Y25K§!\nBase GDP Output: §Y$1.25 Billion§!\n\nOnly buildable in states with §YArable Land§!, up to 10 levels per state. Each level of §YAgro-Industrial District§! in the same state adds §G+3%§! grain."
 mdr_arable_land: "Arable Land"
 mdr_arable_land_desc: "This state has land where crops can grow: it is not desert, tundra, swamp, closed rainforest or high mountain. Allows building §YCropland§!. Soil quality changes how much it yields."
 mdr_soil_rich: "Very Fertile Soil"
 mdr_soil_poor: "Poor or Dry Soil"

 # Ammunition: top bar, decisions, idea and modifier.
 MDR_AMMO_TOPBAR_K: "[?mdr_ammo_k|1]K"
 MDR_AMMO_TOPBAR_M: "[?mdr_ammo_m|2]M"
 MDR_AMMO_TOPBAR_LOW: "§R[?mdr_ammo_k|1]K§!"
 MDR_AMMO_TOPBAR_TT: "§YAmmunition§!\n\nStockpile: §Y[?mdr_ammo_k|1]K§! boxes\nDaily change: §Y[?mdr_ammo_net_k|+2]K§!  ([mdr_ammo_eta_text])\nDaily production: §G[?mdr_ammo_gain_k|2]K§!\nStorage capacity: §Y[?mdr_ammo_capacity_k|1]K§!\n\nDaily use now: §R[?mdr_ammo_use_k|2]K§!\nOf which drills and training: §Y[?mdr_ammo_drill_k|2]K§!\nDaily use in all-out war: §Y[?mdr_ammo_use_max_k|2]K§!\n--------------\n§YAmmunition§! is produced and stored by §YMilitary Factories§!, or bought abroad (decisions, §YAmmunition Procurement§!). Only units in battle spend it (measured by each week's casualties): troops in reserve or on a quiet front do not. Drills and live-fire exercises also use it all year, by army size and §YMilitary Spending§!; divisions on training orders use more.\n§YAmmunition§! research (Infantry): §G+[?mdr_ammo_tech_gain|%1]§! production and §G+[?mdr_ammo_tech_cap|%1]§! capacity.\n§RIf it runs out, the army suffers growing attack and defense penalties, until it can barely fight.§!"
 mdr_ammo_category: "Ammunition Procurement"
 mdr_ammo_category_desc: "Ammunition is produced by our military factories. When they are not enough, we can buy it abroad: it is paid now and arrives when the order is delivered.\n\nStockpile: §Y[?mdr_ammo_k|1]K§! of §Y[?mdr_ammo_capacity_k|1]K§! boxes\nDaily production: §G[?mdr_ammo_gain_k|2]K§!\nDaily use now: §R[?mdr_ammo_use_k|2]K§!\nOf which drills and training: §Y[?mdr_ammo_drill_k|2]K§!"
 mdr_ammo_buy_1: "Buy 1,000 Boxes of Ammunition"
 mdr_ammo_buy_1_desc: "A small order on the international arms market. Delivered in 7 days."
 mdr_ammo_buy_5: "Buy 5,000 Boxes of Ammunition"
 mdr_ammo_buy_5_desc: "A medium order on the international arms market. Delivered in 14 days."
 mdr_ammo_buy_10: "Buy 10,000 Boxes of Ammunition"
 mdr_ammo_buy_10_desc: "A large order on the international arms market. Delivered in 30 days."
 mdr_ammo_buy_25: "Buy 25,000 Boxes of Ammunition"
 mdr_ammo_buy_25_desc: "A very large order that suppliers need time to fill. Delivered in 45 days."
 mdr_ammo_buy_50: "Buy 50,000 Boxes of Ammunition"
 mdr_ammo_buy_50_desc: "A wartime contract that ties up foreign production lines. Delivered in 60 days."
 mdr_ammo_production_focus: "Prioritize Ammunition Production"
 mdr_ammo_production_focus_desc: "For 60 days our military industry works for the depots: it triples the ammunition produced, at the cost of the rest of its output. Costs 0.075% of GDP and can be repeated 90 days after it is ordered."
 mdr_ammo_focus_cooldown_tt: "90 days have passed since the last time we prioritized ammunition"
 mdr_ammo_focus_cost_text: "£treasury [?mdr_ammo_focus_cost|2]"
 mdr_cost_0_2: "£treasury 0.2"
 mdr_cost_0_2_blocked: "£treasury §R0.2§!"
 mdr_cost_0_2_tooltip: "This purchase will cost 0.2 §Hbillions§!"
 mdr_cost_1_0: "£treasury 1.0"
 mdr_cost_1_0_blocked: "£treasury §R1.0§!"
 mdr_cost_1_0_tooltip: "This purchase will cost 1.0 §Hbillions§!"
 mdr_cost_2_0: "£treasury 2.0"
 mdr_cost_2_0_blocked: "£treasury §R2.0§!"
 mdr_cost_2_0_tooltip: "This purchase will cost 2.0 §Hbillions§!"
 mdr_cost_5_0: "£treasury 5.0"
 mdr_cost_5_0_blocked: "£treasury §R5.0§!"
 mdr_cost_5_0_tooltip: "This purchase will cost 5.0 §Hbillions§!"
 mdr_cost_10_0: "£treasury 10.0"
 mdr_cost_10_0_blocked: "£treasury §R10.0§!"
 mdr_cost_10_0_tooltip: "This purchase will cost 10.0 §Hbillions§!"
 mdr_ammo_gain_factor: "£infantry_equipment_texticon Ammunition production"
 mdr_ammo_gain_factor_desc: "Ammunition produced each day by military factories."

 # Uranium: trade screen price and panel.
 MDR_MARKET_PRICES_URANIUM: "$$ [?global.mdr_uranium_price|2]"
 MDR_MARKET_PRICES_URANIUM_TT: "Price information for §YUranium§!:\nCurrent Income: §G$$[?mdr_uranium_income|3]§!\nMin Price: §G$$ 0.70/unit§!\nMax Price: §G$$ 11.75/unit§!"
 MDR_URANIUM_BUTTON: "Opens the §YUranium§! interface"
 MDR_URANIUM_BUTTON_TT: "Opens the §YUranium§! panel, where you can see how much uranium your §YUranium Mines§! extract, how much your §YEnrichment Facilities§! use, how much you import and export, and its price on the world market.\n\nNOTE: Each §YEnrichment Facility§! uses §Y1§! §YUranium§!. If there is not enough, the facilities produce less nuclear fuel and reactors yield less. §YUranium Mines§! can only be built in states with a §YUranium Deposit§!, and missing uranium is bought on this trade screen like any other resource."
 MDR_URANIUM_PANEL_TITLE: "Uranium"
 MDR_URANIUM_PANEL_COUNTRY: "Our Uranium"
 MDR_URANIUM_PANEL_COUNTRY_TEXT: "Mined: §Y[?mdr_uranium_produced|0]§!\nMines: §Y[?mdr_uranium_mines|0]§! levels in §Y[?mdr_uranium_deposits|0]§! states\nImported: §Y[?mdr_uranium_imported|0]§!   Exported: §Y[?mdr_uranium_exported|0]§!\nUse by our enrichment facilities: §Y[?mdr_uranium_need|0]§!\nNuclear fuel lost to the uranium shortfall: §R[?mdr_uranium_shortfall|%0]§!\nExport income: §G$$[?mdr_uranium_income|3]§! billion per week"
 MDR_URANIUM_PANEL_WORLD: "World Market"
 MDR_URANIUM_PANEL_WORLD_TEXT: "Price: §Y$$[?global.mdr_uranium_price|2]§! per unit   World output: §Y[?global.mdr_uranium_supply|0]§!   World demand: §Y[?global.mdr_uranium_demand|0]§!"
 MDR_URANIUM_PANEL_INFO: "§YUranium Mines§! are built from the construction screen, only in states with a §YUranium Deposit§!. Each level yields 1 uranium. Each enrichment facility uses 1; without it, they produce less nuclear fuel. Uranium is bought and sold on this screen like any other resource."
 mdr_ammo_focus_idea: "Prioritizing Ammunition"
 mdr_ammo_focus_idea_desc: "Our military industry works for the ammunition depots, at the cost of the rest of its output."

 # Grain and fertilizers.
 wheat: "Grain"
 wheat_desc: "Wheat, maize, rice and other cereals harvested by §YCropland§!: 10 per level, plus 1 for each fertilizer technology. Each unit is 100,000 tonnes a year. It is all of the population's food and can be traded like any other resource."
 PRODUCTION_MATERIALS_WHEAT: "Grain"
 mdr_fertilizers_1: "Controlled-Release Fertilizers"
 mdr_fertilizers_1_desc: "Coated granules release nitrogen slowly, so crops take up more of it and less is washed away by the rain.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 mdr_fertilizers_2: "Nitrification Inhibitors"
 mdr_fertilizers_2_desc: "Additives keep nitrogen in the soil in the form plants use, raising yields with the same amount of fertilizer.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 mdr_fertilizers_3: "Variable-Rate Fertilization"
 mdr_fertilizers_3_desc: "Soil maps and GPS-guided spreaders give each part of a field exactly the fertilizer it needs.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 mdr_fertilizers_4: "Microbial Biofertilizers"
 mdr_fertilizers_4_desc: "Bacteria and fungi that fix nitrogen and free phosphorus feed crops and restore worn-out soils.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 mdr_fertilizers_5: "Nanofertilizers"
 mdr_fertilizers_5_desc: "Nutrients carried in nanoparticles reach the roots almost without losses, cutting the fertilizer needed per tonne of grain.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 mdr_fertilizers_6: "Green Ammonia"
 mdr_fertilizers_6_desc: "Ammonia made with renewable hydrogen frees fertilizer production from fossil fuels and makes it cheap and plentiful.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 mdr_fertilizers_7: "Recycled-Nutrient Fertilizers"
 mdr_fertilizers_7_desc: "Nitrogen and phosphorus are recovered from sewage and livestock waste, so phosphorus no longer depends on mines that run out.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 mdr_fertilizers_8: "Nitrogen-Fixing Cereals"
 mdr_fertilizers_8_desc: "Wheat, maize and rice engineered to host bacteria that take nitrogen from the air, as legumes already do. Far less fertilizer is needed.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 mdr_fertilizers_9: "Designed Soil Microbiomes"
 mdr_fertilizers_9_desc: "Microbe communities tailored to each soil type free nutrients, hold water and protect the roots.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 mdr_fertilizers_10: "Smart Fertilizers"
 mdr_fertilizers_10_desc: "Capsules release nutrients only when the plant asks for them, through chemical signals from its roots. Almost nothing is lost to the soil or the rivers.\n\nEach level of §YCropland§! grows §G+1§! Grain."
 MDR_MARKET_PRICES_WHEAT: "$$ [?global.mdr_wheat_price|3]"
 MDR_MARKET_PRICES_WHEAT_TT: "Price information for §YGrain§!:\nCurrent Income: §G$$[?mdr_wheat_income|3]§!\nMin Price: §G$$ 0.054/unit§!\nMax Price: §G$$ 0.270/unit§!\n\nEach unit of grain is 100,000 tonnes a year. The base price, §Y0.077§!, is about 120 dollars a tonne (the 2000 price) and rises when the world food market has more buyers than sellers."

