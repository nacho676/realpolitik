l_english:
 # Realistic warfare: capitulation by territory and morale.
 mdr_national_resistance: "National Resistance"
 mdr_national_resistance_desc: "We control §Y[?mdr_cap_t_pct|0]%§! of the population and industry of our territory. Morale break point: §Y[?mdr_cap_b_pct|0]%§!.\nWe capitulate when the enemy occupies §Y[?mdr_cap_l_pct|0]%§! of our victory points (not counting other modifiers).\n\nWith 85% or more of our territory we cannot capitulate, however many cities fall: the limit goes above 100%. Below that, it falls step by step to the normal 80% at the break point and to 30% when only 30% of our territory is left. Below 30%, we capitulate.\nHigh war support lowers the break point (down to 35%); very low stability raises it (60%).\n\nDeserters last week: §R[?mdr_desertion_k|1]K§!\nWounded back at the front last month: §G[?mdr_wnd_back_k|1]K§! (estimated recovery from the health law, out of all casualties)"
 # Desertion
 mdr_military.2.t: "Our Soldiers Are Deserting"
 mdr_military.2.d: "Morale is collapsing. Every week, hundreds of soldiers leave their units and go home or hide. As long as war support stays below 30%, or stability below 30% while we lose territory, we will lose manpower.\n\nCourts-martial can stop the desertions, but the people will not like us punishing our own soldiers."
 mdr_military.2.a: "Courts-martial for deserters."
 mdr_military.2.b: "Address the nation to lift morale."
 mdr_military_tribunals: "Courts-Martial"
 mdr_military_tribunals_desc: "We try deserters before military courts. Desertion stops for 90 days, but the people disapprove.\n\nLast week §R[?mdr_desertion_k|1]K§! soldiers deserted."
 # Nuclear weapons
 mdr_nuclear_harvest: "Contaminated Fields"
 mdr_nuclear_harvest_desc: "The nuclear blast burned and contaminated the fields. This state's harvest is halved for a year and a half."
 mdr_nuked_resolve: "United After the Nuclear Attack"
 mdr_nuked_resolve_desc: "We were struck with a nuclear weapon. The whole nation demands a response."
 mdr_nuke_outrage: "Used a nuclear weapon on our people"
 mdr_nuke_outrage_half: "Used a nuclear weapon on our people"
 mdr_nuke_condemnation: "Used a nuclear weapon"
 mdr_nuke_condemnation_half: "Used a nuclear weapon"
 mdr_nuke_concern: "Used a nuclear weapon"
 mdr_nuke_concern_half: "Used a nuclear weapon"
 mdr_nuclear.1.t: "Nuclear Attack!"
 mdr_nuclear.1.d: "[mdr_nuke_attacker.GetNameDefCap] has dropped a nuclear weapon on [mdr_nuke_state.GetName], in [mdr_nuke_victim.GetNameDef]. For the first time since 1945, a city burns under a mushroom cloud.\n\nThe allies of [mdr_nuke_victim.GetNameDef] and like-minded governments demand sanctions. Neutral countries condemn the attack, and even governments similar to [mdr_nuke_attacker.GetNameDef] keep their distance. Only its allies stay silent.\nDead in the strike: §R[?global.mdr_nuke_last_deaths_k|0]K§!. Killed by nuclear weapons and their radiation since the start: §R[?global.mdr_nuke_deaths_k|0]K§!. World radiation: §Y[?global.mdr_rad_world|1]§! of 100."
 mdr_nuclear.1.a: "The world will never be the same."
 mdr_nuclear.1.b: "They left us no choice."
