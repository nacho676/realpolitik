 birthplace_islamic_revolution: "Lugar de Nacimiento de la Revolución Islámica"
 birthplace_islamic_revolution_desc: "Cuando el último Sha de Irán fue derrocado en la revolución de 1979, un gobierno de monarquía persa casi 2.500 años llegó a su fin. De la revolución popular surgió la república islámica y los ayatolás. El aliado de Occidente se convirtió por la noche en un adversario directo.\n\nIrán es el faro del Islam chiíta alrededor del mundo, pero también como una contraposición a la incursión suní.\n§W--------------§!\nEste espíritu nacional será §RRemovido§! si cambiamos §HPerspectivas del país§!."
