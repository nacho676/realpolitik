 PER_proclaim_the_islamic_golden_age: "La segunda era dorada islámica"
 PER_proclaim_the_islamic_golden_age_desc: "Con el colapso del régimen sionista en [ISR.GetFlag] Israel, la segunda era dorada islámica ha llegado, mientras los musulmanes de todo el mundo se regocijan y trabajan por un futuro mejor."
 PER_blow_nahariya_weapone_storage_desc: "Volar la base de almacenamiento de armas de Nahariya nos permitiría contener la agresión israelí y mostrarles que siempre hay un ojo vigilante."
 PER_future_of_the_artesh: "El futuro de Artesh"
 PER_future_of_the_artesh_desc: "El futuro de Artesh es fundamental para la defensa y la soberanía de Irán. Su modernización, preparación estratégica y liderazgo sólido son clave para garantizar su eficacia como fuerza militar en las próximas décadas."
 PER_cooperation_with_our_partners: "Cooperación con nuestros socios"
 PER_cooperation_with_our_partners_desc: "Manteniendo la autonomía del Artesh, la cooperación estratégica con socios internacionales puede ayudar a mejorar las capacidades de defensa de Irán, el intercambio de tecnología y la preparación para el combate."
 PER_artesh_ground_forces: "Fuerzas terrestres"
 PER_artesh_ground_forces_desc: "Las fuerzas terrestres de Artesh forman la columna vertebral del poder militar defensivo de Irán, garantizando el control sobre los territorios iraníes y preparándose para posibles incursiones de estados vecinos."
 PER_artesh_navy: "Fuerzas Navales"
 PER_artesh_navy_desc: "La Armada de Artesh es responsable de salvaguardar las aguas iraníes y controlar las rutas marítimas vitales del Golfo Pérsico. El fortalecimiento de sus capacidades garantiza la seguridad de las fronteras marítimas iraníes."
 PER_artesh_airforce: "Fuerzas aéreas"
 PER_artesh_airforce_desc: "La Fuerza Aérea de Artesh tiene la misión de defender los cielos iraníes de cualquier amenaza aérea. La modernización continua de su flota y sus sistemas de defensa aérea es crucial para mantener su superioridad en la región."
 PER_self_sufficient_drive: "Impulso autosuficiente"
 PER_self_sufficient_drive_desc: "La autosuficiencia de Irán en tecnologías de defensa es vital para reducir la dependencia de proveedores extranjeros. Este impulso promueve la producción y la innovación en defensa autóctonas, mejorando la seguridad nacional y la autonomía militar."
 PER_establish_supply_chains: "Establecer cadenas de suministro"
 PER_establish_supply_chains_desc: "La construcción de cadenas de suministro sólidas y seguras para Artesh garantiza que el ejército reciba los recursos, equipos y materiales necesarios de manera oportuna, mejorando así la eficacia operativa."
 PER_artesh_peacekeepers: "Misiones de mantenimiento de la paz"
 PER_artesh_peacekeepers_desc: "El Artesh podría participar en misiones de paz para estabilizar zonas de conflicto. Esta función fortalece los lazos diplomáticos y demuestra el compromiso de Irán con la paz y la seguridad mundiales."
 PER_artesh_marine_command: "Comando de la Marina de Artesh"
 PER_artesh_marine_command_desc: "El Comando de la Marina de Artesh supervisa los activos navales de Irán, garantizando la seguridad en el Golfo Pérsico y más allá. El fortalecimiento de sus estructuras de mando y control mejorará la presencia y la preparación marítima de Irán."
 PER_prioritize_jets: "Priorizar los jets"
 PER_prioritize_jets_desc: "Aumentar la producción y el despliegue de aviones de combate avanzados consolidará la superioridad aérea de Irán y proporcionará un mayor poder disuasorio contra posibles amenazas aéreas."
 PER_prioritize_drones: "Producción Masiva de Drones"
 PER_prioritize_drones_desc: "Invertir en la producción en masa de drones permitirá contar con capacidades versátiles y rentables de vigilancia, reconocimiento y ataque, mejorando enormemente las capacidades de defensa de Irán."
 PER_the_arms_dealer: "El traficante de armas"
 PER_the_arms_dealer_desc: "Colaborar con traficantes de armas de todo el mundo podría brindarnos acceso a tecnología y armas militares avanzadas. Esto podría mejorar considerablemente las capacidades de Artesh y fortalecer la defensa de Irán."
 PER_doctrine_of_holy_defense: "Legado de la Santa Defensa"
 PER_doctrine_of_holy_defense_desc: "La doctrina de la Santa Defensa, establecida durante la guerra entre Irán e Irak, sigue siendo un elemento clave de nuestra estrategia militar. Su fortalecimiento garantiza la preservación de la soberanía y la influencia regional de Irán."
 PER_iaio: "IAIO"
 PER_iaio_desc: "La Organización de Industrias de Aviación de Irán (IAIO), también conocida como Organización de Industrias Aeroespaciales, es una corporación estatal fundada en 1966 con el fin de planificar, controlar y gestionar la industria de la aviación de Irán. La Organización de Industrias Aeroespaciales fabrica directamente aeronaves y productos aeroespaciales, además de ser propietaria de otras corporaciones estatales de aviación."
 PER_research_and_development: "Ampliar los centros de I+D"
 PER_research_and_development_desc: "La expansión de los centros de investigación y desarrollo acelerará la innovación en el sector de defensa iraní. Una mayor I+D garantiza que nuestras fuerzas armadas se mantengan competitivas ante las amenazas cambiantes."
 PER_our_old_friends: "Un socio improbable"
 PER_our_old_friends_desc: "Si bien antes eran adversarios, el cambiante panorama global ha creado el potencial de cooperación con antiguos socios. Es crucial evaluar cómo podemos restablecer vínculos mutuamente beneficiosos."
 PER_russian_contracts: "Contratos rusos"
 PER_russian_contracts_desc: "La obtención de contratos de defensa con Rusia podría proporcionarnos equipo militar avanzado y experiencia. Esta colaboración puede fortalecer nuestras capacidades, en particular en defensa aérea y tecnología naval."
 PER_settle_the_dispute: "Resolver la disputa"
 PER_settle_the_dispute_desc: "Resolver las disputas de larga data con nuestros vecinos contribuirá a la estabilidad regional y creará un entorno en el que Artesh pueda centrarse en su misión principal: la defensa nacional."
 PER_oghab_forty_four: "Oghab-44"
 PER_oghab_forty_four_desc: "El Oghab-44 es un UAV iraní, diseñado para vigilancia y reconocimiento. Ampliar su producción nos dará una ventaja significativa en la recopilación de inteligencia."
 PER_our_request: "Nuestra solicitud"
 PER_our_request_desc: "Debemos contactar a nuestros aliados y solicitar apoyo y recursos militares adicionales. Fortalecer nuestros lazos internacionales nos proporcionará los recursos necesarios para el avance militar."
 PER_the_mountains_of_iran: "Las montañas de Irán"
 PER_the_mountains_of_iran_desc: "El terreno montañoso de Irán ofrece ventajas estratégicas para las operaciones defensivas. Aprovechar estas características naturales mejorará nuestra capacidad para repeler cualquier amenaza externa."
 PER_expand_the_southern_fleet: "Ampliar la Flota del Sur"
 PER_expand_the_southern_fleet_desc: "El fortalecimiento de nuestra Flota del Sur reforzará la seguridad marítima de Irán, garantizando el control sobre el Golfo Pérsico y sus vitales rutas marítimas."
 PER_veins_of_the_revolution: "Venas de la Revolución"
 PER_veins_of_the_revolution_desc: "La revolución corre profundamente en nuestra política exterior. Nuestro legado no debe estar marcado por la cobardía, sino por el compromiso revolucionario."
 PER_alawites_in_syria: "La cabeza de puente alauita"
 PER_alawites_in_syria_desc: "El régimen sirio dirigido por Alawite bajo la familia Assad comparte nuestra fe chiíta y posición antioccidental. También incluyen la conexión crítica a nuestro proxy de Hezbollah. Irán debe fortalecer su relación con Siria para asegurar un aliado regional clave y potenciar nuestra influencia sobre los poderes sionistas Levante, más desafiantes en la región."
 PER_damascus_corridor: "El Corredor de Damasco"
 PER_damascus_corridor_desc: "El corredor de Damasco es un corredor que no podemos dejar pasar; debemos reforzar nuestros vínculos con Siria para garantizar la seguridad de este corredor vital."
 PER_palestinian_frontism: "Frente Palestino"
 PER_palestinian_frontism_desc: "La resistencia palestina hasta ahora ha estado marcada por movimientos sunitas o de izquierda. Es hora de que empecemos a manipular su política para que un grupo más favorable llegue al poder."
 PER_advise_PIJ: "Asesorar a la Yihad Islámica Palestina"
 PER_advise_PIJ_desc: "El PIJ fue establecido por Fathi Shaqaqi en 1981, comenzando originalmente como una salida de la Hermandad Musulmana; fue influenciado ideológicamente por la Revolución Islámica en Irán, con Fathi Shaqaqi incluso escribiendo un libro alabando el enfoque de Ayatollah Khomeini hacia un estado islámico. Desde entonces el PIJ se ha alineado en la primera fila para Irán, pero el PIJ orientado al Sol puede entrar en conflicto con Irán en el futuro.\n\nLa Unidad de Operaciones Extranjeras de Abu Jihad, denominada Khalil al-Wazir, es una unidad de operaciones dirigidas conjuntamente por militantes palestinos y agentes de inteligencia iraní que supervisa el contrabando y la producción de artefactos explosivos improvisados y la construcción de redes de túneles. Está controlada principalmente por una rama iraní del IRGC (fuerza Cuds)."
 PER_corridor_to_hezbollah: "Corredor hacia Hezbolá"
 PER_corridor_to_hezbollah_desc: "En caso de guerra, debemos tener un corredor hacia el sur del Líbano si queremos estar preparados."
 PER_descend_on_iraq: "Invadir Irak"
 PER_descend_on_iraq_desc: "Saddam y sus partidarios del Baaz han estado saqueando la riqueza del pueblo iraquí durante demasiado tiempo. Es hora de liberarlos de su opresión."
 PER_puppeteer_iraqi_politcs: "Titiritero de la política iraquí"
 PER_puppeteer_iraqi_politcs_desc: "Tras el levantamiento de 1999, la autoridad del partido Baaz y de los sunitas en Irak ha disminuido paulatinamente. Irak es un estado tapón crucial, que constituye un obstáculo para impedir la invasión de cualquier nación occidental. Lograr influencia sobre el liderazgo iraquí protegerá nuestros intereses en la región y garantizará la continuidad de nuestra influencia hacia el Líbano."
 PER_liberation_of_the_qods: "Liberación de los Qods"
 PER_liberation_of_the_qods_desc: "Es hora de que los sionistas renuncien a su control sobre el Qods. La región quedará patas arriba ante la victoria que se avecina."
 PER_striking_the_great_satan: "Golpeando al Gran Satán"
 PER_striking_the_great_satan_desc: "§RHa llegado el momento..§!"
 PER_azeri_shias: "Armar el Husayniyun"
 PER_azeri_shias_desc: "Ha llegado el momento de poner la mira en Azerbaiyán. Los chiítas que viven justo encima de nosotros han sido oprimidos durante décadas de dominio, desde los soviéticos hasta los regímenes que gobiernan la nación hoy. Ha llegado el momento de armar al único movimiento político legítimo: el Husayniyun."
 PER_a_new_dawn: "El grito que brota del este"
 PER_a_new_dawn_desc: "Ha llegado un nuevo día para los orientales. El orden de los corruptos ha caído, y una nueva visión justa guiará la región."
 PER_eastern_initiative: "Hombres de un mundo libre"
 PER_eastern_initiative_desc: "Es hora de que promovamos la liberación de aquellos que están atados a las leyes opresivas de sus países de origen; Irán será su voz."
 PER_one_nation: "Una Nación"
 PER_one_nation_desc: "Las Repúblicas Islámicas Unidas estarán UNIDAS, no divididas. Sería absurdo gobernar autónomamente a tantas naciones."
 PER_decentralized_state: "Muchas naciones"
 PER_decentralized_state_desc: "Un hombre necio es aquel que anhela el poder. Controlar directamente las numerosas naciones bajo las Repúblicas Islámicas Unidas sería un desastre."
 PER_the_displaced: "Los desplazados"
 PER_the_displaced_desc: "A los que no tienen hogar hay que proporcionarles uno, hay que acoger a los pobres, a los enfermos y a los hambrientos."
 PER_hegemon_of_the_gulf: "Hegemón del Golfo"
 PER_hegemon_of_the_gulf_desc: "Irán es, y será, el único hegemón del Golfo Pérsico. Si quisiéramos, los árabes no tendrían cabida en el nuevo orden regional una vez que afirmemos el control total."
 PER_arabian_underbelly: "El lado oscuro de Arabia"
 PER_arabian_underbelly_desc: "Ha llegado el momento de utilizar nuestro aliado, y golpear a los árabes con rebeldía. Al tener la huelga Houthis los saudíes, tendríamos una gran ventaja sobre el enemigo a través del elemento de sorpresa."
 PER_a_truly_red_sea: "Un verdadero Mar Rojo"
 PER_a_truly_red_sea_desc: "El mar rojo no parece rojo, pero una vez que nuestros enemigos comiencen a caer víctimas de su arrogancia, el mar se pintará de rojo."
 PER_usurpers_of_mecca: "Usurpadores de la meca"
 PER_usurpers_of_mecca_desc: "Ha llegado la hora de derrocar a los usurpadores de La Meca y liberar a los habitantes de la ciudad santa. La verdadera bandera del Islam está en Irán, y será Irán quien la alce sobre La Meca."
 PER_topple_gulf_monarchies: "Derrocar a las monarquías del Golfo"
 PER_topple_gulf_monarchies_desc: "La codicia, el engaño y la corrupción han conspirado contra la región y el islam. Las monarquías del Golfo son el motor de todos estos problemas y deben ser derrocadas."
 PER_blood_spilt_over_hormuz: "Sangre derramada sobre Ormuz"
 PER_blood_spilt_over_hormuz_desc: "El estrecho de Ormuz es iraní y seguirá siéndolo. Sin embargo, si nos provocan, no dudaremos en defenderlo. Esperar la provocación sería un error fatal y, por lo tanto, debemos ser nosotros quienes nos adelantemos al enemigo. Ha llegado la hora de que la casa de Saud comparezca ante la justicia."
 PER_gulf_supremacy_desc: "De costa a costa, hemos llenado y rodeado el Golfo con nuestros aliados, y hemos debilitado a los otrora importantes estados que ostentaban el poder aquí. ¡El Golfo Pérsico es ahora verdadera e indiscutiblemente persa!"
 PER_gulf_summit: "La Cumbre del Golfo"
 PER_gulf_summit_desc: "Las tensiones en el Golfo han socavado durante mucho tiempo la estabilidad y la prosperidad de la región. Al organizar una cumbre multilateral, buscamos abrir la puerta al diálogo, generar confianza y explorar nuevos marcos de cooperación."
 PER_the_lasting_truce: "La tregua duradera"
 PER_the_lasting_truce_desc: "Años de conflictos indirectos y hostilidad han tenido consecuencias. Mediante una negociación cuidadosa y el reconocimiento mutuo, trabajaremos para establecer una tregua duradera con Arabia Saudita y otras naciones del Golfo."
 PER_the_crescents_sword: "La espada de la media luna"
 PER_the_crescents_sword_desc: "La paz regional requiere fuerza. Al modernizar nuestras capacidades y consolidar una postura disuasoria, podemos convertirnos en la espada que proteja la Media Luna y mantenga el equilibrio de poder en el Golfo."
 PER_strenghten_economic_ties: "Construir lazos económicos"
 PER_strenghten_economic_ties_desc: "La diplomacia no es suficiente. La prosperidad compartida es la clave de la paz a largo plazo. Proseguimos acuerdos comerciales, cooperación energética y proyectos conjuntos de infraestructura con socios del Golfo."
 PER_regional_defense: "Defensa Regional"
 PER_regional_defense_desc: "Más allá de las palabras y el comercio, la verdadera cooperación debe incluir la seguridad colectiva. Exploraremos vías para el intercambio de inteligencia, ejercicios conjuntos y el establecimiento de un acuerdo regional de defensa."
 PER_musandam_gambit: "La táctica de Musandam"
 PER_musandam_gambit_desc: "El estrecho de Ormuz no está completamente bajo nuestro control y, por lo tanto, tendremos que empezar a pensar en formas de legitimar nuestro reclamo sobre la región."
 PER_solidarity_through_strength: "Solidaridad a través de la fuerza"
 PER_solidarity_through_strength_desc: "En una región que aún se recupera de las políticas del pasado, Irán debe proyectar unidad y fortaleza. Debemos construir nuevas relaciones, basadas en el respeto mutuo y la cooperación pragmática."
 PER_meeting_in_ankara: "Reunión en Ankara"
 PER_meeting_in_ankara_desc: "Es necesario extender una invitación formal a Turquía para que se una a la renovada alianza CENTO. El interés compartido por el equilibrio regional puede ser la piedra angular de una alianza con visión de futuro."
 PER_talks_with_the_americans: "Conversaciones con los estadounidenses"
 PER_talks_with_the_americans_desc: "Restablecer las relaciones diplomáticas con Estados Unidos es fundamental. Si bien la confianza se gana con esfuerzo, los intereses compartidos en la estabilidad y el crecimiento abren un posible camino hacia el futuro."
 PER_handle_pkk_cells: "Manejo de células PKK"
 PER_handle_pkk_cells_desc: "La amenaza del PKK no conoce fronteras. La cooperación con Turquía en el intercambio de inteligencia y en operaciones garantizará la seguridad mutua y protegerá nuestra soberanía."
 PER_nato_proximity: "Proximidad de la OTAN"
 PER_nato_proximity_desc: "La plena adhesión a la OTAN aún está lejos, pero alinear nuestra doctrina y estructura con las suyas aportará inmensos beneficios estratégicos y tecnológicos."
 PER_safe_distance: "Distancia segura"
 PER_safe_distance_desc: "La integración en la OTAN no implica sumisión. Podemos beneficiarnos de la cooperación sin renunciar a nuestra autonomía."
 PER_in_caucasia: "Hacia el Cáucaso"
 PER_in_caucasia_desc: "Con el declive de la República Islámica, se ha creado un vacío de poder en el Cáucaso. Ahora es el momento de que Irán regrese, ofreciendo apoyo, infraestructura e influencia."
 PER_in_central_asia: "Hacia Asia Central"
 PER_in_central_asia_desc: "Ahora podemos aprovechar nuestros lazos culturales e históricos con Asia Central. La infraestructura, el comercio y la educación serán la base de una nueva relación."
 PER_the_hezbollah_problem: "El problema de Hezbolá"
 PER_the_hezbollah_problem_desc: "Los remanentes del CGRI y los operativos de Hezbolá siguen activos en el Líbano. Eliminarlos es necesario para romper lazos con nuestro pasado."
 PER_a_party_no_more: "Una partido no más"
 PER_a_party_no_more_desc: "La existencia continua de Hezbolá es incompatible con la paz regional. Nuestro objetivo es claro: desmantelar su capacidad militar."
 PER_challenge_russian_influence: "Desafiar la influencia rusa"
 PER_challenge_russian_influence_desc: "La hegemonía rusa en la región ha crecido sin control. Irán debe presentarse como una fuerza independiente dispuesta a desafiar la mano dura de Moscú."
 PER_negotiate_f_thirty_five: "Negociar el contrato del F-35"
 PER_negotiate_f_thirty_five_desc: "Asegurar el acceso al programa F-35 marcaría un cambio profundo en nuestra postura de defensa. La diplomacia y la reforma deben allanar el camino."
 PER_funds_for_democracies: "Fondos para las democracias"
 PER_funds_for_democracies_desc: "El apoyo a los movimientos democráticos en el extranjero demuestra nuestra nueva identidad. La financiación estratégica puede contribuir a forjar una vecindad más estable y amigable."
 PER_care_for_our_own: "Cuidar de los nuestros"
 PER_care_for_our_own_desc: "Al mirar hacia afuera, no debemos olvidarnos de nuestros ciudadanos. Los programas de bienestar y desarrollo deben acompañar la ambición extranjera."
 PER_prospect_of_expansion: "Perspectiva de expansión"
 PER_prospect_of_expansion_desc: "CENTO no debe seguir siendo excluyente. La inclusión de democracias regionales y potencias moderadas garantizará su legitimidad y perdurabilidad."
 PER_challenge_saudi_hegemony: "Desafiar la hegemonía de Jaliyi"
 PER_challenge_saudi_hegemony_desc: "Los reinos del Golfo han marcado desde hace tiempo el rumbo de la región. Al ofrecer una alianza alternativa, presentamos una visión que va más allá del petróleo y la oligarquía."
 PER_standardize_alliance_training: "Estandarizar la capacitación de la Alianza"
 PER_standardize_alliance_training_desc: "Una alianza sólida debe hablar el mismo lenguaje militar. Los ejercicios conjuntos y la armonización de doctrinas fortalecerán la capacidad operativa de CENTO."
 PER_what_was_once_ours: "Lo que una vez fue nuestro"
 PER_what_was_once_ours_desc: "Las cicatrices de los territorios perdidos aún acechan nuestra conciencia nacional. Es hora de que comencemos a forjar un futuro donde recuperemos nuestro legado histórico."
 PER_calm_the_nerves: "Calmar los nervios"
 PER_calm_the_nerves_desc: "Al levantarnos, habrá quienes tiemblen. Asegurémosles a nuestros vecinos que nuestra grandeza no es su perdición, pero eso no significa que apaguemos nuestra llama."
 PER_investing_in_new_missiles: "Invertir en nuevos misiles"
 PER_investing_in_new_missiles_desc: "La superioridad no se hereda, se construye. Nuestra próxima generación de sistemas de misiles garantizará que nuestra voz se escuche en toda la región."
 PER_choking_hormuz: "Asfixiar Ormuz"
 PER_choking_hormuz_desc: "El Estrecho de Ormuz es la yugular del comercio petrolero mundial, y nosotros tenemos la espada. Un peaje por el paso no es más que un precio justo."
 PER_arm_the_rebels: "Armar a los rebeldes árabes"
 PER_arm_the_rebels_desc: "La disidencia hierve en el este. Con un apoyo cuidadoso y una acción decisiva, las grietas en la Casa de Saud pueden convertirse en fracturas."
 PER_modernizing_silos: "Modernizando nuestros silos"
 PER_modernizing_silos_desc: "La infraestructura de misiles obsoleta nos deja vulnerables. Una modernización nacional de nuestros silos es crucial para garantizar lanzamientos rápidos y seguros."
 PER_the_northern_problem: "El problema del norte"
 PER_the_northern_problem_desc: "Las provocaciones de Azerbaiyán no pueden ignorarse. Debemos comenzar los preparativos para abordar la cuestión del norte de forma decisiva y definitiva."
 PER_new_horizons: "Nuevos horizontes"
 PER_new_horizons_desc: "Nuestra diplomacia energética debe estar a la altura de nuestras ambiciones estratégicas. Exigiremos la parte que nos corresponde de los recursos del Golfo a quienes se aprovechan de nuestra moderación."
 PER_break_the_iraqi_hand: "Romper la mano iraquí"
 PER_break_the_iraqi_hand_desc: "El Estado iraquí ha oprimido durante mucho tiempo a la población del sur. A pesar de la abundancia de recursos en la región, el gobierno de Bagdad ha demostrado su incompetencia para gobernar esas tierras, algo que cambiaremos."
 PER_funds_for_aio: "Fondos para AIO"
 PER_funds_for_aio_desc: "La Organización de Industrias Aeroespaciales es la punta de lanza de nuestra modernización militar. Le brindaremos el respaldo que necesita para prosperar."
 PER_move_on_oman: "Avanzar a Omán"
 PER_move_on_oman_desc: "Omán controla puntos estratégicos clave, pero permanece aislado. Es hora de cambiar esto, en nuestros términos, con la fuerza si es necesario."
 PER_yes_men_of_qatar: "Sí Hombres de Qatar"
 PER_yes_men_of_qatar_desc: "El papel de Qatar como perro faldero de las potencias regionales debe terminar. O se alinearán con nosotros o se convertirán en una nota al pie de nuestro ascenso."
 PER_preparing_our_anti_air: "Preparando nuestro antiaéreo"
 PER_preparing_our_anti_air_desc: "Un estado moderno debe estar protegido del cielo. Nuestras capacidades antiaéreas deben evolucionar para equipararse a las de nuestros adversarios."
 PER_fan_the_flames_in_baku: "Avivar las llamas en Bakú"
 PER_fan_the_flames_in_baku_desc: "El malestar interno en Azerbaiyán es propicio para la manipulación. Encenderemos el fuego y lo veremos arder desde el otro lado de la frontera."
 PER_levy_historical_ties: "Impuestos sobre lazos históricos"
 PER_levy_historical_ties_desc: "Muchos de nuestros vecinos deben su existencia a tierras repartidas que antaño ondearon la bandera persa. Les recordaremos nuestro pasado compartido y el futuro que nos espera."
 PER_levy_religious_ties: "Impuesto sobre los lazos religiosos"
 PER_levy_religious_ties_desc: "Los lazos de fe son profundos en esta región. A través de ellos, justificaremos nuestra participación en la guía de su futuro."
 PER_revoke_turkmenchay_treaty: "Revocar el Tratado de Turkmenchay"
 PER_revoke_turkmenchay_treaty_desc: "El Tratado de Turkmenchay fue una humillación. Su revocación marcará el inicio de un nuevo capítulo, uno en el que recuperaremos lo que nos arrebataron injustamente."
 PER_the_ardabil_conference: "La Conferencia de Ardebil"
 PER_the_ardabil_conference_desc: "En Ardebil, se trazan planes y se ponen en marcha las ambiciones. El camino hacia la reunificación comienza aquí. El pueblo azerbaiyano es uno con el pueblo iraní, separado por la amenaza de Moscú hace cien años."
 PER_the_armenian_concern: "La Preocupación Armenia"
 PER_the_armenian_concern_desc: "Armenia se erige como una cuña histórica entre los intereses iraníes y el norte. Es un problema que podría requerir soluciones militares."
 PER_the_azarabadegan_guard: "La Guardia de Azarâbâdegân"
 PER_the_azarabadegan_guard_desc: "Para defender nuestra frontera norte, se establecerán formaciones de élite en Azarâbâdegân. Servirán de escudo y espada."
 PER_unification_in_armenia: "Esfuerzos en Armenia"
 PER_unification_in_armenia_desc: "Una vez asegurada la victoria, Armenia no debe quedar en ruinas. Comenzaremos a trabajar para vincular su destino al nuestro, económica, política y militarmente."
 PER_reunification: "Reunificación"
 PER_reunification_desc: "Ha llegado el día de enmendar errores históricos. Las tierras de Azerbaiyán, Armenia y Turkmenistán deben volver al redil iraní."
 PER_turmoil_in_the_ghanistan: "Agitación en Afganistán"
 PER_turmoil_in_the_ghanistan_desc: "Afganistán lleva varias décadas sumido en una prolongada guerra civil. Es hora de que empecemos a preparar un plan a largo plazo para afrontarla."
 PER_encroachment_to_the_east: "Invasión hacia el Este"
 PER_encroachment_to_the_east_desc: "En lugar de esperar a que alguien más gane la guerra en Afganistán, podemos hacerlo nosotros mismos. Apoyaremos a los rebeldes proiraníes en Hazaristán para mantener nuestro control sobre Afganistán."
 PER_karim_khalili: "Apoyar a Karim Khalili"
 PER_karim_khalili_desc: "Karim Khalili es un moderado en comparación con sus homólogos, y si queremos un Afganistán libre de radicalismo, él es el hombre a quien acudir."
 PER_asif_mohseni: "Apoyar a Asif Mohseni"
 PER_asif_mohseni_desc: "Asif Mohseni es un candidato de línea dura en comparación con Khalili, y su popularidad entre los chiítas afganos podría ser justo lo que necesitamos para asegurar la victoria de Hazara."
 PER_create_hazara_defense_force: "Crear la Fuerza de Defensa Hazara"
 PER_create_hazara_defense_force_desc: "El pueblo hazara no puede ser dirigido por un simple grupo de milicianos; debe establecerse un ejército organizado y formal para salvaguardar sus tierras."
 PER_fighting_the_taliban: "Luchando contra los talibanes"
 PER_fighting_the_taliban_desc: "No podemos dejar que los afganos peleen solos con los talibanes, debemos ayudar al pueblo afgano en su lucha y alejar a estos terroristas de nuestra frontera."
 PER_ministry_of_war_and_armed_forces_logistics: "Ministerio de Defensa y Logística de las Fuerzas Armadas"
 PER_ministry_of_war_and_armed_forces_logistics_desc: "El Ministerio de Defensa y Logística de las Fuerzas Armadas ha tenido desde hace mucho tiempo la tarea de supervisar la integridad operativa de nuestras doctrinas, planes y preparación para el combate. Esta organización vital no puede pasarse por alto, es necesario cuidarla y prestarle atención para que prospere y funcione de manera óptima."
 PER_twenty_first_century_warfare: "Guerra del siglo XXI"
 PER_twenty_first_century_warfare_desc: "La guerra es un entorno en constante evolución. Si nos aferramos a las tradiciones de antaño, nuestros ejércitos serán barridos con relativa facilidad."
 PER_brave_men_of_the_sky: "Hombres valientes del cielo"
 PER_advanced_machines_of_the_sky: "Máquinas avanzadas del cielo"
 PER_advanced_machines_of_the_sky_desc: "En el cielo, hombres, mujeres y niños mirarán con asombro a las bestias rugientes volando sobre la cabeza. A través del conocimiento puro, el trabajo duro y la artesanía iraní, dominaremos el horizonte azul que Dios ha grabado sobre nosotros."
 PER_legacy_of_pessian: "El legado de Pessian"
 PER_legacy_of_pessian_desc: "Un verdadero piloto, Pesiano fue uno de los primeros mártires de la mayor revolución iraní hacia la modernidad, la grandeza y la libertad. Su legado no será olvidado, y en cambio, él será inmortalizado dentro de las tradiciones de la Fuerza Aérea del Ejército."
 PER_jack_of_all_trades: "Un maestro de todos los oficios"
 PER_jack_of_all_trades_desc: "Nuestros pilotos serán capaces y, sin duda, expertos en todo. Cualquier otra cosa sería un compromiso, un compromiso que simplemente no podemos aceptar en estos tiempos difíciles."
 PER_steadfast_upgrades: "Actualizaciones constantes"
 PER_steadfast_upgrades_desc: "Nuestras flotas están envejeciendo, y están envejeciendo relativamente rápido. Debemos hacer un esfuerzo concertado y coordinado para modernizar nuestro avión de modo que podamos competir con el enemigo en los cielos."
 PER_those_on_the_field: "Los que están en el campo"
 PER_those_on_the_field_desc: "No podemos olvidar a los hombres que están en el campo de batalla, a quienes luchan contra el enemigo y defienden la nación, y a quienes dan su vida por esta tierra. Debemos esforzarnos por enriquecer sus doctrinas y su forma de hacer la guerra."
 PER_a_mans_best_friend: "El mejor amigo de un hombre"
 PER_a_mans_best_friend_desc: "El mejor amigo de un hombre es la artillería que está a su lado. Sin estos cañones, ¿quién más que el propio soldado está dispuesto a hacer tal sacrificio para limpiar un camino por los demás?"
 PER_cannons_of_today: "Los cañones de hoy"
 PER_cannons_of_today_desc: "Los cañones de hoy son un arma aterradora en el campo de batalla. Sin embargo, todavía usamos los cañones de anteayer. Por lo tanto, es nuestro deber mejorar y modernizar el equipamiento antiguo con el fin de crear igualdad de condiciones para nuestras tropas en el campo de batalla."
 PER_guidance_of_the_old_guard: "Guía de la vieja guardia"
 PER_guidance_of_the_old_guard_desc: "Mientras algunos hombres viejos se derriten, a veces llamado Kenneth, los nuestros no. Necesitamos la guía de los antiguos guardias y comandantes que han estado aquí durante un largo período de tiempo, especialmente los de los días de la guerra de Iraq."
 PER_armored_beasts: "Bestias blindadas"
 PER_armored_beasts_desc: "Tanto en la tierra como en los mares, las bestias blindadas andan libremente y son estragos en oponentes vulnerables, no armados y más débiles. Para asegurar que nuestros hombres no caigan presa de ellos, debemos crear nuestras propias variantes."
 PER_the_crews: "Las tripulaciones"
 PER_the_crews_desc: "Las tripulaciones que operan tanques y vehículos blindados deben priorizarse sobre todo. Se sientan en un ambiente caliente, húmedo y a menudo desgarrado durante largos períodos de tiempo."
 PER_the_roar_of_an_engine: "Aullido de un motor"
 PER_the_roar_of_an_engine_desc: "Con la tecnología adecuada, nuestros vehículos blindados devastarán a cualquier ejército que se acerque. Es imperativo que nos esforcemos al máximo para asegurarnos de tener ventaja sobre el oponente."
 PER_sailors_of_tomorrow: "Marineros del mañana"
 PER_sailors_of_tomorrow_desc: "Si bien es cierto que los marineros deben ser duros, necesitan buques y equipos confiables. Ha pasado mucho tiempo que hacemos algunas mejoras muy necesarias a las naves que recorren nuestras aguas territoriales, y ocasionalmente, alguien que queremos provocar."
 PER_hope_and_pride_of_iran: "Esperanza y orgullo de Irán"
 PER_hope_and_pride_of_iran_desc: "Los marineros y pilotos son la esperanza y el orgullo de Irán. Sin ellos, ¿quién operaría las máquinas que refuerzan a los valientes combatientes en tierra?"
 PER_revolutionary_blueprint: "Plan revolucionario"
 PER_revolutionary_blueprint_desc: "El Plan Revolucionario describe nuestro compromiso de remodelar la infraestructura, la economía y la sociedad de Irán de acuerdo con los valores islámicos. Mediante la autosuficiencia, la modernización y la unidad nacional, fortaleceremos nuestra posición en el escenario mundial y aseguraremos el éxito de la revolución."
 PER_way_of_the_imam: "Camino del Imán"
 PER_way_of_the_imam_desc: "El Camino del Imam es el camino de la justicia, la igualdad y el gobierno islámico. Es la base de nuestra renovación política y espiritual. Siguiendo las enseñanzas del Imam, buscamos proteger la República Islámica y guiarla hacia un futuro próspero e independiente."
 PER_bastion_of_islam: "Bastión del Islam"
 PER_bastion_of_islam_desc: "Irán se erige como el bastión de la revolución islámica, una fortaleza del gobierno y los valores islámicos. Como líder del mundo islámico, defenderemos y difundiremos los principios del islam para garantizar que los oprimidos del mundo entero tengan voz."
 PER_state_of_the_revolution: "Estado de la Revolución"
 PER_state_of_the_revolution_desc: "La República Islámica es la encarnación de la revolución, un Estado construido sobre los principios de justicia, independencia y resistencia. Nuestra revolución continúa guiando cada aspecto de la gobernanza, desde las políticas económicas hasta las relaciones internacionales, garantizando que los ideales del Imán permanezcan en el corazón de todo lo que hacemos."
 PER_sepah_loyalty_discipline: "Iniciativa de Lealtad y Disciplina de Sepah"
 PER_sepah_loyalty_discipline_desc: "El Sepah (Cuerpo de la Guardia Revolucionaria Islámica) es el escudo de nuestra revolución. A través de la Iniciativa de Lealtad y Disciplina, buscamos fortalecer el vínculo de confianza y compromiso entre el Sepah y la República Islámica, asegurando que nuestras fuerzas permanezcan firmes en su defensa de la revolución."
 PER_the_media_fatwa: "Medios Fetua"
 PER_the_media_fatwa_desc: "En una era de guerra informativa, los Medios Fetua garantiza que los medios permanezcan bajo la guía de los principios islámicos. Regularemos el contenido, promoveremos los valores islámicos y eliminaremos las influencias extranjeras dañinas para salvaguardar la integridad de la revolución y la nación."
 PER_clamp_domestic_separatism: "Reprimir el separatismo interno"
 PER_clamp_domestic_separatism_desc: "La unidad nacional es fundamental para la fortaleza de la República Islámica. Cualquier fuerza que intente socavar nuestra unidad mediante el separatismo o ideologías divisivas debe ser combatida con decisión. Fortaleceremos el vínculo entre todos los pueblos iraníes, garantizando que ningún separatismo apoyado desde el extranjero pueda amenazar nuestra revolución."
 PER_establish_cyber_police: "Polis-e Cyberi"
 PER_establish_cyber_police_desc: "El auge de la guerra digital y la difusión de propaganda extranjera a través de Internet exigen un nuevo enfoque de la seguridad nacional. Polis-e Cyberi protegerá a la República Islámica de las amenazas cibernéticas, garantizando que el dominio virtual permanezca libre de influencias dañinas y al servicio de la revolución."
 PER_khomeinis_promise: "La promesa de Jomeiní"
 PER_khomeinis_promise_desc: "La promesa del Imam Jomeini es la de una sociedad cimentada en la justicia, la fe y la independencia. Nos comprometemos a hacer realidad la visión del imán de una República Islámica, firme en sus valores y que garantice el éxito de la revolución."
 PER_architechts_of_seventy_nine: "Arquitectos de 1979"
 PER_architechts_of_seventy_nine_desc: "Los héroes de la revolución de 1979 sentaron las bases de la República Islámica. Su visión, sacrificio y liderazgo provocaron el fin de la opresión y el control extranjero, estableciendo un estado islámico soberano que sigue siendo un modelo para el mundo."
 PER_ballistic_shift: "Cambio balístico"
 PER_ballistic_shift_desc: "Nuestra búsqueda de la autosuficiencia militar continúa con un enfoque en el desarrollo de capacidades balísticas avanzadas. Con este cambio, garantizaremos que Irán esté preparado para defenderse de las amenazas externas, afirmando nuestra independencia y fortaleciendo nuestra posición en la región."
 PER_self_sufficiency_jihad_org: "Organización Autosuficiencia del Yihad"
 PER_self_sufficiency_jihad_org_desc: "La Organización Autosuficiencia del Yihad se dedica a garantizar la completa independencia económica y tecnológica de Irán. Aprovechando la fuerza de nuestro pueblo y nuestros recursos, eliminaremos la dependencia de potencias extranjeras y construiremos un Irán próspero y autosuficiente."
 PER_forbid_nuclear_arms: "Prohibir las armas nucleares"
 PER_forbid_nuclear_arms_desc: "Si bien defendemos el derecho a la tecnología nuclear con fines pacíficos, la República Islámica se compromete a no desarrollar nunca armas nucleares. Guiados por los principios islámicos, creemos que el verdadero poder de nuestra nación reside en nuestra unidad y fe, no en la proliferación de armas peligrosas."
 PER_mouse_in_the_corner: "El ratón en la esquina"
 PER_mouse_in_the_corner_desc: "Mientras las potencias extranjeras sigan aislándonos y provocándonos, no nos dejaremos intimidar. Nos mantenemos firmes ante la agresión, listos para defender nuestra soberanía. Así como el ratón se defiende cuando se le acorrala, demostraremos nuestra fuerza y resiliencia."
 PER_naja_focus: "NAJA"
 PER_naja_focus_desc: "La Fuerza Disciplinaria Nacional (NAJA) desempeña un papel crucial en la defensa de la ley y la protección de la revolución. Su objetivo es preservar el orden, mantener los valores islámicos y garantizar que el pueblo de Irán viva en paz y seguridad bajo la guía de la República Islámica."
 PER_great_fire_wall: "El Gran Cortafuegos"
 PER_great_fire_wall_desc: "En la era de Internet, el Gran Cortafuegos es esencial para proteger a nuestra gente de la influencia extranjera dañina y las amenazas cibernéticas. Protegeremos el dominio virtual, garantizando que sólo el contenido que se alinee con los valores islámicos sea accesible para nuestros ciudadanos."
 PER_internet_freedom: "Acceso a la libertad global"
 PER_internet_freedom_desc: "Si bien reconocemos la importancia del acceso a la información, la República Islámica está comprometida con un enfoque controlado y equilibrado en Internet. Al brindar acceso a los recursos globales y al mismo tiempo mantener nuestra soberanía, preservaremos nuestros valores islámicos en la era digital."
 PER_principles_of_vilayet_faqih: "Principios del Velāyat-e Faqīh"
 PER_principles_of_vilayet_faqih_desc: "La doctrina de Velāyat-e Faqīh coloca la autoridad máxima en manos del jurista islámico. Este principio guía todas las decisiones en la República Islámica, garantizando que nuestro gobierno esté arraigado en la sabiduría de la ley islámica y las enseñanzas del Imam."
 PER_handle_student_groups: "Gestionar grupos de estudiantes"
 PER_handle_student_groups_desc: "Los grupos estudiantiles desempeñan un papel vital en la vida intelectual de la nación. Sin embargo, sus actividades deben estar siempre alineadas con los principios de la revolución. Garantizaremos que los movimientos estudiantiles sirvan al bien común de la República Islámica, defendiendo la unidad y el progreso."
 PER_science_and_islam: "Ciencia e Islam"
 PER_science_and_islam_desc: "La República Islámica no ve contradicción entre el avance científico y los valores islámicos. Impulsaremos una revolución científica en Irán, garantizando que el progreso tecnológico se logre en armonía con nuestra identidad religiosa y cultural."
 PER_warrants_on_problematic_people: "Órdenes de arresto contra individuos problemáticos"
 PER_warrants_on_problematic_people_desc: "Hay que luchar con decisión contra aquellos que amenazan la estabilidad de la República Islámica o promueven ideas antirrevolucionarias. Emitiremos órdenes de arresto contra quienes socaven la unidad y la seguridad de la nación, garantizando que la revolución permanezca protegida de las amenazas internas."
 PER_guided_by_faith: "Guiados por la fe"
 PER_guided_by_faith_desc: "La dirección de nuestra nación está firmemente arraigada en la fe, guiada por los principios divinos del Islam. Cada decisión, desde las políticas internas hasta las relaciones internacionales, está alineada con los valores de justicia, equidad y rectitud prescritos por nuestra fe."
 PER_guided_by_people: "Guiados por la gente"
 PER_guided_by_people_desc: "El poder de la República Islámica reside en la voluntad de su pueblo. Nos comprometemos a garantizar que cada política y cada decisión refleje los deseos y necesidades de las masas iraníes, defendiendo el principio de la soberanía popular dentro de un marco islámico."
 PER_with_no_choice: "...no hay otra opción"
 PER_with_no_choice_desc: "Ante una agresión externa o disturbios internos, la República Islámica no tiene más remedio que actuar con decisión. Nuestras acciones, ya sean diplomáticas o defensivas, están motivadas por la necesidad de proteger nuestra revolución y preservar nuestra soberanía."
 PER_anti_riot_equipment: "Importar equipo antidisturbios"
 PER_anti_riot_equipment_desc: "Para mantener el orden y proteger la integridad de la República Islámica, nos aseguraremos de que nuestras fuerzas del orden estén equipadas con las herramientas necesarias para gestionar los disturbios. Al importar equipos antidisturbios avanzados, fortalecemos nuestra capacidad para mantener la paz y la seguridad de nuestro pueblo."
 PER_increased_guidance_patrol: "Gašt-e Eršâd"
 PER_increased_guidance_patrol_desc: "Gašt-e Eršâd, la Patrulla de Orientación sirve como guía moral de la sociedad. Al aumentar su presencia, garantizaremos que nuestros espacios públicos se alineen con los valores de la modestia y la ley islámica, promoviendo una sociedad que refleje nuestros principios sagrados."
 PER_abolish_guidance_patrol: "Abolir las patrullas de orientación"
 PER_abolish_guidance_patrol_desc: "En una nueva era, podremos considerar la abolición de las Patrulla de Orientación, reconociendo la importancia de las libertades individuales dentro de un contexto islámico. Esto sería un paso hacia el equilibrio de las libertades personales con la necesidad de cohesión social, reflejando la naturaleza cambiante de nuestra República."
 PER_electoral_clarity: "Claridad Electoral"
 PER_electoral_clarity_desc: "Garantizar la transparencia y la equidad en nuestros procesos electorales es un principio clave de la República Islámica. Introduciremos reformas para garantizar que cada voto se cuente con precisión y que nuestras elecciones reflejen la verdadera voluntad del pueblo, bajo la guía del marco islámico."
 PER_utilize_workers_house: "Utilizar la Casa de los Trabajadores"
 PER_utilize_workers_house_desc: "La Casa de los Trabajadores es una institución esencial en la República Islámica, que garantiza que la voz de los trabajadores se escuche y se respete. Empoderaremos a este organismo para que sirva mejor a las necesidades de nuestra clase trabajadora, fomentando la justicia social y mejorando el bienestar de las personas que impulsan la economía de nuestra nación."
 PER_expand_nehsa: "Expandir NEHSA"
 PER_expand_nehsa_desc: "NEHSA, la Fuerza Aeroespacial del Cuerpo de Guardia Revolucionaria Islámico, ha estado cayendo detrás bastante rápidamente en tecnología. Ha llegado el momento de adquirir nuevas tecnologías extendiendo nuestra mano a los rusos."
 PER_vaja_intel: "Inteligencia de VAJA"
 PER_vaja_intel_desc: "La inteligencia de VAJA es vital para mantener la integridad de nuestra República Islámica. Esta agencia de inteligencia garantiza que estemos un paso por delante de cualquier conspirador o enemigo extranjero, preservando la revolución y protegiendo la soberanía del pueblo iraní."
 PER_funding_for_faraja: "Financiación para FARAJA"
 PER_funding_for_faraja_desc: "FARAJA desempeña un papel importante en la defensa de los valores islámicos y de la República frente a la corrupción y la influencia extranjera. Un mayor financiamiento fortalecerá su capacidad para mantener la ley y el orden, asegurando que los principios de la revolución se defiendan en todos los niveles de la sociedad."
 PER_hijab_and_chastity: "Proyecto de ley sobre el hiyab y la castidad"
 PER_hijab_and_chastity_desc: "El proyecto de ley sobre el hijab y la castidad busca garantizar que toda mujer iraní se adhiera a los principios de modestia y castidad prescritos por las enseñanzas islámicas. Esta ley protegerá el tejido moral de la sociedad y reforzará los valores de la revolución promoviendo una vida conforme a la guía divina."
 PER_strengthen_guardian_council: "Fortalecer el Consejo de Guardianes"
 PER_strengthen_guardian_council_desc: "El Consejo de Guardianes garantiza que la República Islámica se mantenga fiel a sus principios supervisando la legalidad de las leyes y los candidatos. El fortalecimiento del Consejo salvaguardará aún más nuestra gobernanza islámica y garantizará que la República permanezca en el camino marcado por la revolución."
 PER_weaken_guardian_council: "Socavar el Consejo de Guardianes"
 PER_weaken_guardian_council_desc: "Para permitir una mayor flexibilidad y reforma política dentro de la República Islámica, podríamos considerar debilitar la influencia del Consejo de Guardianes. Esto permitiría que florecieran opiniones políticas más diversas, aunque al precio de diluir potencialmente la fuerza de nuestro gobierno islámico."
 PER_basij_autonomy: "Conceder la autonomía Basich"
 PER_basij_autonomy_desc: "Basich es el corazón de nuestras fuerzas revolucionarias, y concederles autonomía les permitirá actuar con más decisión en la defensa de la República Islámica. Al fortalecer al Basich, garantizamos que el espíritu revolucionario se mantenga fuerte y que la voz del pueblo continúe guiando a la nación."
 PER_family_and_loyalty: "Familia y lealtad"
 PER_family_and_loyalty_desc: "La fuerza de la República Islámica se basa en la familia como piedra angular. Promover la lealtad a la nación y a los valores de la revolución dentro de la estructura familiar garantizará la estabilidad y el futuro de nuestra nación, creando una sociedad basada en la fe, la responsabilidad y la unidad."
 PER_power_of_the_leader: "El poder del líder"
 PER_power_of_the_leader_desc: "El Líder ostenta la máxima autoridad para guiar la República Islámica. Ampliar su poder garantiza que las decisiones se tomen con rapidez y decisión, conforme a la voluntad popular y la guía de los principios islámicos."
 PER_the_imams_line: "La línea del Imam"
 PER_the_imams_line_desc: "La Línea del Imam representa la conexión ininterrumpida entre nuestro liderazgo y la guía divina del Islam. Mantener esta línea garantiza que la República Islámica permanezca arraigada en la visión original de la revolución, manteniendo la pureza de las enseñanzas y la fuerza de nuestra unidad nacional."
 PER_cooperation_with_artesh: "Trabajar con Artesh"
 PER_cooperation_with_artesh_desc: "Tener dos altos mandos militares completamente desconectados no sería funcional para una nación. Para asegurar nuestra victoria, tanto la Guardia Revolucionaria como el ejército iraní deben trabajar conjuntamente para obtener el mejor resultado."
 PER_naja: "NAJA"
 PER_naja_desc: "El Comando de Aplicación de la Ley de la República Islámica de Irán es la fuerza policial uniformada de Irán."
 PER_irgc_self_sufficiency_jihad_org: "Organización de la Yihad de Autosuficiencia del CGRI"
 PER_irgc_self_sufficiency_jihad_org_desc: "La Organización de Jihades de Autosuficiencia del IRGC es una institución R& que desarrolla y fabrica radares, sistemas de comunicaciones, armamento, vehículos de combate y equipo electrónico de ciberguerra, con sus instalaciones de producción ubicadas en Teherán y Esfahan."
 PER_irgc_navy: "Armada del CGRI"
 PER_irgc_navy_desc: ""
 PER_paralyzed_prosperity: "Prosperidad paralizada"
 PER_paralyzed_prosperity_desc: "Nuestra economía se encuentra estancada, donde el crecimiento se ve obstaculizado por ineficiencias y prácticas obsoletas. Es crucial superar esta parálisis y revitalizar la maquinaria económica del país."
 PER_commanders_of_commerce: "Comandantes del comercio"
 PER_commanders_of_commerce_desc: "Ha surgido un pequeño grupo de influyentes líderes empresariales para guiar el rumbo económico del país. Sus esfuerzos por modernizar el comercio y la industria podrían ser la clave para superar el estancamiento económico."
 PER_sins_of_charity: "Pecados de caridad"
 PER_sins_of_charity_desc: "Si bien las organizaciones benéficas han florecido en los últimos años, algunas han utilizado su influencia con fines poco nobles. Debemos examinar a estos grupos y asegurarnos de que sus recursos se utilicen para el bien común."
 PER_control_tax_evasion: "Medidas contra la evasión fiscal"
 PER_control_tax_evasion_desc: "En la mayoría de los países, las personas y empresas más ricas siguen evadiendo impuestos, drenando fondos públicos que se necesitan desesperadamente para el desarrollo nacional. Sin embargo, en Irán, la situación es aún peor. Los agricultores y la gente común se niegan a pagar sus impuestos, cifra que representa aproximadamente el 30% de la población."
 PER_rials_behind_red_tape: "Riales detrás de la burocracia"
 PER_rials_behind_red_tape_desc: "Las ineficiencias burocráticas y las regulaciones complejas han provocado la asignación indebida de fondos. Agilizar el proceso y reducir la burocracia garantizará que los recursos económicos se dirijan a donde más se necesitan."
 PER_root_out_money_laundering: "Erradicar el lavado de dinero"
 PER_root_out_money_laundering_desc: "El lavado de dinero sigue siendo un problema grave, con enormes sumas de riqueza ilícita circulando fuera de la economía formal. Para proteger los intereses nacionales, debemos combatir y desmantelar estas operaciones con firmeza."
 PER_the_lost_generations: "Las generaciones perdidas"
 PER_the_lost_generations_desc: "Décadas de abandono han dejado a gran parte de la población sin oportunidades de educación ni progreso. Es hora de invertir en su futuro y asegurar que ninguna generación se quede atrás."
 PER_upholding_justice: "Defendiendo la justicia"
 PER_upholding_justice_desc: "Para restablecer la confianza en nuestras instituciones, debemos garantizar que el sistema de justicia funcione con justicia e imparcialidad. Reformar el proceso judicial garantizará que todos los ciudadanos reciban el mismo trato ante la ley."
 PER_reclaim_control: "Recuperar el control"
 PER_reclaim_control_desc: "Un puñado de poderosos intereses ha adquirido demasiada influencia en sectores clave de nuestra economía. Debemos tomar medidas decisivas para recuperar el control y garantizar el respeto a la autoridad del Estado."
 PER_additional_funds_for_khatam_al_anbia: "Fondos adicionales para Khatam-al Anbiya"
 PER_additional_funds_for_khatam_al_anbia_desc: "Khatam-al Anbiya desempeña un papel fundamental en muchos de los proyectos de infraestructura críticos del país. La asignación de fondos adicionales a esta organización garantizará que los proyectos vitales se completen a tiempo y dentro del presupuesto."
 PER_dismantling_the_monopoly: "Desmantelar el monopolio"
 PER_dismantling_the_monopoly_desc: "Unas pocas entidades poderosas dominan el mercado, lo que restringe la competencia y frena la innovación. Debemos tomar medidas para desmantelar estos monopolios y crear una economía más justa y competitiva."
 PER_grip_of_the_state: "Control del Estado"
 PER_grip_of_the_state_desc: "Para fortalecer la gobernanza nacional, el Estado debe ejercer un mayor control sobre industrias y servicios clave. Esto garantizará que la riqueza del país se oriente adecuadamente hacia el bienestar público y el desarrollo nacional."
 PER_investigate_ineffeciency: "Investigar la ineficiencia"
 PER_investigate_ineffeciency_desc: "Las ineficiencias generalizadas en las operaciones gubernamentales están costando al país miles de millones en potencial perdido. Es hora de investigar estos problemas a fondo e implementar reformas para maximizar la eficacia de nuestras instituciones."
 PER_weaken_konkour: "Debilitar el Konkour"
 PER_weaken_konkour_desc: "El examen Konkour se ha convertido en un obstáculo para muchos estudiantes aspirantes, favoreciendo a la élite y perpetuando la desigualdad. Es hora de reformar el sistema para garantizar que el acceso a la educación superior se base en el mérito, no en el privilegio."
 PER_reinforce_konkour: "Reforzar el Konkour"
 PER_reinforce_konkour_desc: "El sistema de exámenes Konkour es la base del éxito académico y profesional en el país. Fortalecer este sistema garantizará que solo los mejores y más brillantes tengan acceso a las oportunidades que ofrece la educación superior."
 PER_alcohol_matter: "El asunto del alcohol"
 PER_alcohol_matter_desc: "El consumo de alcohol sigue siendo un tema delicado en nuestra sociedad. Al revisar la normativa vigente, podemos lograr un equilibrio entre el respeto a los valores culturales y la atención a las preocupaciones de salud pública."
 PER_security_in_the_south_east: "Seguridad en el sureste"
 PER_security_in_the_south_east_desc: "Las fronteras sur y este siguen siendo vulnerables a la delincuencia y la inestabilidad regional. Fortalecer la seguridad en esta zona es crucial para mantener la paz y salvaguardar los recursos de nuestra nación."
 PER_auction_irgc_companies: "Subasta de empresas del CGRI"
 PER_auction_irgc_companies_desc: "Varias empresas vinculadas al CGRI ejercen una influencia económica significativa. La subasta de estos activos podría redistribuir el poder e impulsar el sector público, a la vez que frenaría la intervención militar en la economía."
 PER_stakes_in_bahman_group: "Participaciones en el Bahman Group"
 PER_stakes_in_bahman_group_desc: "El Bahman Group posee una parte significativa del mercado automotriz del país. Al adquirir una participación en esta influyente empresa, podemos garantizar una mayor supervisión y fomentar la competencia en el sector."
 PER_trial_zanjani: "Juicio de Babak Zanjani"
 PER_trial_zanjani_desc: "Babak Zanjani, empresario vinculado a diversas actividades corruptas, debe comparecer ante la justicia. Su juicio transmitirá un mensaje contundente sobre nuestro compromiso con la lucha contra la corrupción al más alto nivel."
 PER_expansion_of_state_bonyads: "Expansión de los Bonyads estatales"
 PER_expansion_of_state_bonyads_desc: "Las fundaciones estatales, o bonyads, desempeñan un papel crucial en el bienestar social y el desarrollo. Ampliar su alcance les permitirá apoyar a más ciudadanos y contribuir a la estabilidad económica."
 PER_ministry_of_education: "Campaña de alfabetización"
 PER_ministry_of_education_desc: "Mejorar las tasas de alfabetización en todo el país es esencial para desarrollar una fuerza laboral cualificada. El Ministerio de Educación debe liderar la iniciativa para ampliar las oportunidades educativas para todos los ciudadanos."
 PER_hijab_issue: "La cuestión del hiyab"
 PER_hijab_issue_desc: "Los debates actuales en torno al hiyab siguen moldeando la identidad nacional. Es fundamental encontrar un camino que respete los valores de la nación y, al mismo tiempo, aborde los derechos y las decisiones de las personas."
 PER_target_the_smugglers: "Apuntar a los contrabandistas"
 PER_target_the_smugglers_desc: "El contrabando sigue siendo un problema grave, que priva al país de recursos muy necesarios y fomenta la actividad delictiva. Es hora de adoptar una postura más firme y erradicar estas operaciones ilegales."
 PER_fate_of_oil_fields: "El destino de los campos petrolíferos"
 PER_fate_of_oil_fields_desc: "Los yacimientos petrolíferos del país son una fuente de gran riqueza, pero también de potencial inestabilidad. Debemos decidir si nacionalizar o reformar la gestión de estos recursos para garantizar la seguridad económica a largo plazo."
 PER_cripple_the_bonyads: "Lisiar a los Bonyads"
 PER_cripple_the_bonyads_desc: "Los Bonyads han crecido demasiado en tamaño e influencia en las esferas económica y social. Reducir su poder permitirá una distribución más equitativa de los recursos y las oportunidades."
 PER_uplift_the_bonyads: "Elevar los Bonyads"
 PER_uplift_the_bonyads_desc: "Si bien los bonyads tienen sus defectos, brindan un apoyo significativo a los desfavorecidos. Fortalecer su función garantizará que sus recursos se utilicen eficazmente para ayudar a los más necesitados de la sociedad."
 PER_tighten_port_registration: "Endurecer la regulación del registro portuario"
 PER_tighten_port_registration_desc: "El registro portuario inadecuado y las importaciones sin control han generado ineficiencias económicas y comercio ilegal. El endurecimiento de estas regulaciones aumentará la transparencia y garantizará una supervisión adecuada del comercio."
 PER_expand_university_campuses: "Ampliar los campus universitarios"
 PER_expand_university_campuses_desc: "Ampliar nuestros campus universitarios proporcionará un mayor acceso a la educación superior, fomentando una fuerza laboral más calificada y educada para impulsar el crecimiento económico futuro."
 PER_end_oil_smuggling: "Poner fin al contrabando de petróleo"
 PER_end_oil_smuggling_desc: "El contrabando de petróleo ha socavado la estabilidad económica del país. Debemos tomar medidas decisivas para eliminar estas actividades ilegales y garantizar que todos los ingresos petroleros se contabilicen adecuadamente."
 PER_dissolve_mobin_trust_consortium: "Disolver el Mobin Trust Consortium"
 PER_dissolve_mobin_trust_consortium_desc: "El Mobin Trust Consortium se ha convertido en un símbolo de poder y corrupción desenfrenados. Su disolución evitará una mayor monopolización de recursos y fomentará un entorno empresarial más competitivo."
 PER_abolish_tax_cuts: "Abolir los recortes de impuestos"
 PER_abolish_tax_cuts_desc: "Los recortes de impuestos a los ricos han aumentado la desigualdad y reducido los ingresos públicos. Eliminarlos restablecerá la equidad del sistema tributario y proporcionará los fondos necesarios para los servicios públicos."
 PER_direct_control_over_all: "Control absoluto"
 PER_direct_control_over_all_desc: "Aumentar el control estatal directo sobre todos los sectores de la economía nos permitirá combatir la corrupción y la ineficiencia. Al centralizar la autoridad, podemos implementar reformas con mayor eficacia."
 PER_strengthen_setad: "Fortalecer SETAD"
 PER_strengthen_setad_desc: "La SETAD es un actor clave en la gestión de los activos nacionales. Al fortalecer su influencia, podemos garantizar que estos activos se utilicen eficientemente y en beneficio del interés nacional."
 PER_reform_konkour: "Reformar el Konkour"
 PER_reform_konkour_desc: "Si bien el sistema Konkour tiene sus defectos, puede reformarse para satisfacer mejor las necesidades educativas del país. Garantizar la equidad y la transparencia abrirá la puerta a oportunidades para todos los estudiantes."
 PER_harshen_examination_process: "Endurecer el proceso de examen"
 PER_harshen_examination_process_desc: "Aumentar la dificultad de los exámenes de ingreso elevará los estándares de la educación y garantizará que sólo los candidatos más calificados puedan acceder a la educación superior."
 PER_locate_traficing_rings: "Localizar redes de tráfico"
 PER_locate_traficing_rings_desc: "El narcotráfico sigue plagando nuestras fronteras, desestabilizando la región y financiando el crimen organizado. Debemos identificar y desmantelar estas redes para garantizar la seguridad nacional."
 PER_nationalize_the_wealth: "Nacionalizar su riqueza"
 PER_nationalize_the_wealth_desc: "Las grandes fortunas privadas siguen concentradas en manos de unos pocos. Al nacionalizar estos activos, podemos garantizar que la riqueza se distribuya de forma más equitativa y se utilice para el beneficio colectivo de la población."
 PER_start_merges: "Iniciar las fusiones"
 PER_start_merges_desc: "Para fortalecer la economía, debemos fomentar la fusión de empresas más pequeñas y menos eficientes en entidades más grandes y poderosas. Esto fomentará una mayor competitividad y estabilidad económica."
 PER_pillar_of_welfare: "Pilar del Bienestar"
 PER_pillar_of_welfare_desc: "Debemos priorizar el bienestar y los servicios sociales para garantizar que todos los ciudadanos tengan acceso a los recursos que necesitan para llevar una vida productiva y plena."
 PER_rebuild_the_curriculum: "Reconstruir el currículo"
 PER_rebuild_the_curriculum_desc: "Un currículo modernizado dotará a la próxima generación de los conocimientos y las habilidades necesarias para prosperar en un mundo en constante cambio. Debemos reformar la educación para afrontar los retos del futuro."
 PER_promising_and_gifted_students: "Estudiantes prometedores y talentosos"
 PER_promising_and_gifted_students_desc: "Identificar y apoyar a estudiantes talentosos garantizará la formación de los líderes e innovadores del futuro. Esta iniciativa ofrecerá becas y mentoría a las mentes más brillantes del país."
 PER_invest_into_gharb: "Inversiones en Gharb"
 PER_invest_into_gharb_desc: "Las inversiones en la parte occidental de nuestro país ayudarán a crear mejoras de infraestructura muy necesarias en la zona a menudo olvidada donde residen los kurdos."
 PER_invest_into_shargh: "Inversiones en Shargh"
 PER_invest_into_shargh_desc: "Las regiones orientales del país han estado desatendidas durante mucho tiempo. Invertir en la zona de Shargh impulsará nuestro alcance económico y mejorará la infraestructura en esta zona vital del país."
 PER_tabriz_service_sector: "Sector de servicios de Tabriz"
 PER_tabriz_service_sector_desc: "El desarrollo del sector de servicios en Tabriz generará nuevos empleos, impulsará la economía y convertirá a la ciudad en un centro económico regional, beneficiando especialmente su ubicación estratégica."
 PER_see_to_atrak_border: "Ver la frontera de Atrak"
 PER_see_to_atrak_border_desc: "El fortalecimiento de la infraestructura y la seguridad a lo largo de la frontera de Atrak mejorará el comercio y reducirá el contrabando, mejorando la economía y asegurando esta zona estratégica."
 PER_utilize_afghan_labor: "Utilizar mano de obra afgana"
 PER_utilize_afghan_labor_desc: "La mano de obra afgana puede ser una solución rentable para muchas industrias en Irán. Al establecer regulaciones y protecciones adecuadas, podemos aprovechar esta fuerza laboral y, al mismo tiempo, contribuir a la estabilización de la región."
 PER_safeguard_eastern_border: "Salvaguardar la frontera oriental"
 PER_safeguard_eastern_border_desc: "Fortalecer las defensas a lo largo de la frontera oriental protegerá a nuestra nación del contrabando, el comercio ilícito y posibles actividades insurgentes, asegurando una de nuestras regiones más vulnerables."
 PER_investments_into_golestan: "Inversiones en la agricultura de Golestán"
 PER_investments_into_golestan_desc: "La provincia de Golestán posee un importante potencial agrícola. La inversión en técnicas agrícolas modernas e infraestructura mejorará la productividad y fortalecerá la seguridad alimentaria del país."
 PER_expanding_the_power_grid: "Ampliación de la red eléctrica"
 PER_expanding_the_power_grid_desc: "La ampliación de la red eléctrica nacional proporcionará una fuente de electricidad estable y fiable a todas las regiones, apoyando el crecimiento industrial y mejorando la calidad de vida de nuestros ciudadanos."
 PER_chabahar_port: "Puerto de Chabahar"
 PER_chabahar_port_desc: "El puerto de Chabahar posee un importante potencial estratégico y económico. Invertir en su expansión fortalecerá la posición de Irán como centro clave del comercio internacional, especialmente en la región del océano Índico."
 PER_neighbourly_investments: "Inversiones vecinales"
 PER_neighbourly_investments_desc: "Invertir en las economías de nuestros países vecinos puede fortalecer los lazos regionales y generar beneficios mutuos. Al fomentar el crecimiento más allá de nuestras fronteras, podemos impulsar la estabilidad nacional y regional."
 PER_embracing_the_open_market: "Abrazando el mercado abierto"
 PER_embracing_the_open_market_desc: "Abrir nuestros mercados a la inversión extranjera fomentará la competencia, la innovación y el crecimiento, garantizando la integración de Irán a la economía global."
 PER_ditching_the_five_year_model: "Abandonando el modelo quinquenal"
 PER_ditching_the_five_year_model_desc: "La rígida estructura del plan quinquenal de desarrollo nos frena. Es hora de adoptar un enfoque más flexible y orientado al mercado para el crecimiento económico."
 PER_export_quotas: "Cuotas de exportación"
 PER_export_quotas_desc: "El establecimiento de cuotas de exportación regulará nuestras exportaciones de recursos, garantizando que podamos mantener un equilibrio entre las necesidades internas y la demanda internacional."
 PER_free_zones_kish: "Zonas francas en Kish"
 PER_free_zones_kish_desc: "El establecimiento de zonas de libre comercio en la isla de Kish atraerá empresas e inversores internacionales, impulsando tanto el turismo como el comercio y mejorando al mismo tiempo nuestra presencia global."
 PER_subsidies_on_gas: "Generosos subsidios al gas"
 PER_subsidies_on_gas_desc: "Ofrecer subsidios generosos al gas hará que la energía sea más asequible para los ciudadanos iraníes, promoviendo la actividad económica y aliviando el costo de vida."
 PER_offshore_drilling: "Perforación en alta mar"
 PER_offshore_drilling_desc: "La ampliación de los proyectos de perforación en alta mar liberará reservas de petróleo sin explotar, aumentando nuestras exportaciones de energía y estimulando los ingresos nacionales."
 PER_oil_shale_in_jordan: "Ayudar a extraer esquisto bituminoso en Jordania"
 PER_oil_shale_in_jordan_desc: "Brindar asistencia para la extracción de esquisto bituminoso en Jordania fortalecerá los lazos económicos regionales y creará una nueva fuente de energía que beneficiará a ambas naciones."
 PER_rival_doha_and_dubai: "Un rival de Doha y Dubái"
 PER_rival_doha_and_dubai_desc: "Al desarrollar el área de Abu Musa como un centro comercial y financiero, podemos crear una alternativa competitiva a Doha y Dubái, atrayendo inversiones internacionales."
 PER_black_gold_behind_zagros: "Oro negro detrás de los Zagros"
 PER_black_gold_behind_zagros_desc: "La exploración y explotación de las reservas de petróleo sin explotar detrás de los montes Zagros fortalecerá la posición de Irán como proveedor clave de energía en la región."
 PER_investments_in_abumusa: "Inversiones en Abu Musa"
 PER_investments_in_abumusa_desc: "Centrar las inversiones en Abu Musa lo transformará en un centro económico y comercial vital, fortaleciendo la presencia estratégica de Irán en el Golfo."
 PER_caucasian_focus: "Enfoque caucásico"
 PER_caucasian_focus_desc: "Dirigir nuestra atención hacia el Cáucaso abrirá nuevas vías para el comercio, el desarrollo energético y la influencia regional, fortaleciendo el papel de Irán en el Medio Oriente en general."
 PER_liberty_equality_workers_rule: "Libertad, igualdad y gobierno de los trabajadores"
 PER_liberty_equality_workers_rule_desc: "Debemos abrazar los principios de libertad, igualdad y control obrero sobre los medios de producción. El pueblo ya no será subyugado por los capitalistas y los imperialistas. Juntos construiremos una sociedad donde cada individuo tenga la libertad de vivir y trabajar con dignidad."
 PER_hekmats_legacy: "Legado de Hekmat"
 PER_hekmats_legacy_desc: "La contribución de Hekmat al movimiento comunista en Irán sigue siendo una parte importante de nuestra base ideológica. Su lucha por la justicia y la igualdad continúa inspirándonos mientras aspiramos a forjar una sociedad donde la clase trabajadora tenga poder para remodelar el futuro."
 PER_a_better_world: "Un mundo mejor"
 PER_a_better_world_desc: "Nos hemos comprometido a construir un mundo donde la explotación sea abolida y se satisfagan las necesidades de todas las personas. Nuestra lucha no se limita a Irán, sino que pretende a inspirar un movimiento global por un mundo mejor y más equitativo."
 PER_diplomatic_neutrality: "Neutralidad diplomática"
 PER_diplomatic_neutrality_desc: "Nuestra política exterior debe reflejar nuestro compromiso con la neutralidad, garantizando que Irán no sea víctima de la manipulación de las potencias imperialistas. Fomentaremos las relaciones con otras naciones progresistas, evitando la influencia de fuerzas externas que buscan desestabilizar nuestra revolución."
 PER_taqvaees_vision: "La visión de Taqvaee"
 PER_taqvaees_vision_desc: "La visión de Taqvaee aboga por una sociedad donde la justicia social y los derechos de los trabajadores sean el eje central de todas las políticas. Creía en un Irán progresista, donde la pobreza y la desigualdad se aborden mediante el esfuerzo colectivo y el poder popular."
 PER_modarresis_guidance: "La guía de Modarresi"
 PER_modarresis_guidance_desc: "La filosofía de Modarresi se basaba en unir a las masas trabajadoras y garantizar que tuvieran control sobre su destino. Su guía servirá como brújula para crear una sociedad que valore la responsabilidad colectiva y la eliminación de la injusticia social y económica."
 PER_complete_denuclearization: "Desnuclearización completa"
 PER_complete_denuclearization_desc: "La revolución iraní busca garantizar la paz, no las luchas de poder con armas de destrucción masiva. Nos opondremos al armamento nuclear y defenderemos el desarme global, centrándonos en la paz y la cooperación en lugar de la destrucción."
 PER_the_bear_and_eagle: "Entre el oso y el águila"
 PER_the_bear_and_eagle_desc: "Como país situado entre las superpotencias de Este y Oeste, debemos navegar con cuidado el panorama geopolítico. Nuestro objetivo es mantener nuestra soberanía mientras promovemos ideales revolucionarios sin caer presa del imperialismo de ninguno de los dos lados."
 PER_catapult_the_cadres: "Catapultar a los cuadros"
 PER_catapult_the_cadres_desc: "Para alcanzar nuestras metas, debemos asegurar que la revolución sea guiada por cuadros educados y comprometidos. Implementaremos programas que garanticen la formación adecuada de los futuros líderes de nuestra revolución, capacitándolos para guiar al pueblo hacia el verdadero socialismo."
 PER_uproot_the_oligarchs: "Desarraigar a los oligarcas"
 PER_uproot_the_oligarchs_desc: "Los oligarcas capitalistas que se han beneficiado de la opresión de la clase trabajadora deben ser eliminados. Confiscaremos su riqueza y la redistribuiremos entre el pueblo para construir una sociedad donde los recursos de la nación se utilicen al servicio del bien común."
 PER_middle_east_and_north_africa_network: "Red de Oriente Medio y el Norte de África"
 PER_middle_east_and_north_africa_network_desc: "Nuestra revolución no termina en las fronteras de Irán. Estableceremos una red de movimientos progresistas y revolucionarios en todo el Medio Oriente y el norte de África, forjando alianzas fuertes con otros movimientos de la clase trabajadora en la región para luchar contra el imperialismo y la opresión."
 PER_social_equality: "Igualdad social"
 PER_social_equality_desc: "El verdadero socialismo implica que todas las personas, independientemente de su género, etnia o clase social, sean tratadas por igual. Trabajaremos para eliminar cualquier forma de discriminación o desigualdad y construir una sociedad donde cada individuo tenga las mismas oportunidades de prosperar."
 PER_bread_and_roses_campaign: "Campaña Pan y Rosas"
 PER_bread_and_roses_campaign_desc: "Nuestra revolución debe ser algo más que la mera supervivencia económica; debe ser también el bienestar cultural y social del pueblo. La Campaña Pan y Rosas garantizará que la clase trabajadora tenga acceso tanto a las necesidades básicas de la vida como a la capacidad de dedicarse al arte, la cultura y la felicidad."
 PER_workers_party_of_iraq: "El Partido de los Trabajadores de Irak"
 PER_workers_party_of_iraq_desc: "Nuestra solidaridad con la clase trabajadora trasciende nuestras fronteras. El Partido de los Trabajadores de Irak comparte nuestros valores y nuestra visión de un futuro socialista. Juntos, resistiremos al imperialismo y a las fuerzas del capitalismo que buscan dominar nuestra región."
 PER_turning_from_religion: "Alejándose de la religión"
 PER_turning_from_religion_desc: "En nuestra búsqueda de una sociedad laica y socialista, debemos asegurarnos de que la religión no dicte el rumbo político o social del país. Garantizaremos la libertad de creencias, separando la religión del funcionamiento del Estado."
 PER_islamic_communism: "Comunismo islámico"
 PER_islamic_communism_desc: "Abrazamos el concepto del comunismo islámico, combinando nuestra fe con ideales socialistas revolucionarios. Esta filosofía nos permitirá construir una sociedad justa, equitativa y alineada con las enseñanzas del Islam, al tiempo que avanzamos en los principios del socialismo y el empoderamiento de los trabajadores."
 PER_standing_against_the_right: "De pie contra la derecha"
 PER_standing_against_the_right_desc: "Las fuerzas de la ideología reaccionaria de derecha deben ser confrontadas en todo momento. Nos mantendremos firmes contra los intentos de frenar nuestro progreso revolucionario e impedir el auge del fascismo y el autoritarismo en Irán."
 PER_iran_tribunal: "Tribunal de Irán"
 PER_iran_tribunal_desc: "Para garantizar que quienes han abusado del pueblo en el pasado rindan cuentas, estableceremos el Tribunal de Irán. Este llevará ante la justicia a quienes han perpetuado los crímenes del antiguo régimen, garantizando así la justicia para la clase trabajadora."
 PER_rejecting_the_hypocrites: "Rechazando a los hipócritas"
 PER_rejecting_the_hypocrites_desc: "Rechazamos a quienes afirman defender el comunismo, pero en cambio han traicionado a la clase trabajadora. Nuestra revolución no caerá víctima de los hipócritas que distorsionan los verdaderos valores del socialismo para beneficio propio."
 PER_labour_that_molds_our_spine: "El trabajo que moldea nuestra columna vertebral"
 PER_labour_that_molds_our_spine_desc: "La clase trabajadora es la columna vertebral de nuestra nación. Es a través de su trabajo que construiremos un futuro de igualdad, justicia y socialismo. Garantizaremos que los trabajadores tengan el poder de forjar el futuro de nuestro país."
 PER_hambastegi: "Hambastegi"
 PER_hambastegi_desc: "La política de Hambastegi, o solidaridad, guiará nuestros esfuerzos para ayudar a las personas desplazadas y oprimidas en Irán y más allá. Nos mantendremos unidos en nuestra lucha para apoyar a la clase trabajadora internacional y brindar ayuda a quienes la necesitan."
 PER_the_human_being: "El ser humano"
 PER_the_human_being_desc: "En el corazón de nuestra revolución está la creencia en la dignidad del ser humano. Nos comprometemos a crear una sociedad donde se prioricen los derechos y el bienestar de cada individuo, garantizando que nadie se quede atrás en nuestra búsqueda de un mundo mejor."
 PER_maryams_plan: "El plan de Maryam"
 PER_maryams_plan_desc: "Maryam Rajavi ha presentado una visión audaz para un futuro donde Irán esté libre de dominio religioso. Su plan consiste en desmantelar el sistema opresivo y establecer un Irán democrático y laico, donde los derechos del pueblo sean primordiales."
 PER_simay_azadi: "Simay-e Azadi"
 PER_simay_azadi_desc: "Simay-e Azadi, nuestra red social, es una herramienta fundamental para difundir nuestro mensaje de resistencia y revolución. A través de esta plataforma, uniremos a los iraníes, tanto dentro como fuera del país, y coordinaremos nuestros esfuerzos para derrocar al régimen."
 PER_end_of_vilayet_faqih: "Fin de Vilayat-e Faqih"
 PER_end_of_vilayet_faqih_desc: "Debemos poner fin al sistema opresivo de Vilayat-e Faqih, que ha permitido que la élite religiosa ejerza el poder sobre el pueblo iraní. La era del gobierno teocrático llegará a su fin, e Irán retornará a la senda de la verdadera democracia."
 PER_artesh_azadi: "Artesh-e Azadi"
 PER_artesh_azadi_desc: "El Artesh-e Azadi representa nuestra visión de una nueva fuerza militar que protegerá al pueblo iraní de amenazas externas e internas. Será un ejército que defienda los valores de la libertad, la justicia y el laicismo."
 PER_new_judicial_system: "Un nuevo sistema judicial"
 PER_new_judicial_system_desc: "El sistema judicial actual, bajo el control de los mulás, ha sido un instrumento de opresión. Crearemos un nuevo sistema judicial justo y transparente que garantice la justicia y la igualdad para todos los iraníes, libre de influencias religiosas."
 PER_nuclear_concern: "Preocupación nuclear"
 PER_nuclear_concern_desc: "Las ambiciones nucleares de Irán han sido motivo de preocupación para la comunidad internacional desde hace tiempo. Como parte de la agenda del MEK, garantizaremos que el programa nuclear iraní sea transparente, pacífico y conforme a las regulaciones internacionales."
 PER_baath_lifeline: "Línea de vida del Baaz"
 PER_baath_lifeline_desc: "Nuestra relación con los Baazistas es fundamental tanto para nuestro movimiento como para la lucha en Oriente Medio en general. Juntos, nos opondremos al imperialismo y garantizaremos la supervivencia de los ideales socialistas que ambos movimientos comparten."
 PER_our_own_people: "Nuestra propia gente"
 PER_our_own_people_desc: "Si bien expresamos nuestra solidaridad con nuestros aliados regionales, nuestro principal objetivo es el pueblo iraní. El compromiso del MEK es, por encima de todo, con el pueblo iraní, garantizando su libertad, seguridad y prosperidad sin interferencia de fuerzas extranjeras."
 PER_reactionary_values: "Valores reaccionarios"
 PER_reactionary_values_desc: "Rechazamos los valores reaccionarios que durante tanto tiempo se han utilizado para oprimir al pueblo iraní. El MEK se compromete a erradicar estos ideales retrógrados y a reemplazarlos por valores progresistas y socialistas basados en la igualdad y la justicia."
 PER_the_peoples_front: "El Frente Popular"
 PER_the_peoples_front_desc: "El Frente Popular será una coalición amplia de fuerzas democráticas, socialistas y laicas unidas bajo un objetivo común: liberar a Irán de la opresión del régimen y establecer un gobierno que refleje la voluntad del pueblo."
 PER_protect_the_free_market: "Protegiendo el libre mercado"
 PER_protect_the_free_market_desc: "El MEK cree en una economía de mercado donde las personas puedan participar libremente en los negocios y el comercio. Protegeremos el libre mercado del control estatal y promoveremos políticas que fomenten el emprendimiento, la creación de empleo y el crecimiento económico."
 PER_legacy_of_camp_ashraf: "El legado del Campamento Ashraf"
 PER_legacy_of_camp_ashraf_desc: "El Campamento Ashraf fue el corazón de la lucha del MEK por la libertad y la justicia. Al construir un nuevo campamento en Irán, honraremos el legado de quienes lucharon y murieron por la causa de la libertad, garantizando que sus sacrificios nunca sean olvidados."
 PER_maintaining_our_stance: "Manteniendo nuestra postura"
 PER_maintaining_our_stance_desc: "A pesar de las presiones externas, el MEK se mantendrá fiel a sus principios marxistas-comunistas. Nuestro compromiso con la clase trabajadora y nuestra oposición al imperialismo siguen firmes, y seguiremos luchando por una sociedad basada en la justicia y la igualdad."
 PER_move_towards_westernization: "Avanzando hacia la occidentalización"
 PER_move_towards_westernization_desc: "Para hacer realidad nuestra visión de un Irán moderno y progresista, debemos adoptar la occidentalización en términos de cultura, tecnología y gobernanza. El MEK impulsará reformas que alineen a Irán con los valores democráticos y seculares de Occidente."
 PER_uplifting_the_keshavarz: "Elevando la clase Keshavarz"
 PER_uplifting_the_keshavarz_desc: "El sector agrícola de Irán es una piedra angular de su economía, y trabajaremos para mejorar la situación de los keshavarz (agricultores) implementando políticas que garanticen una compensación justa, acceso a tecnología agrícola moderna y una mejor calidad de vida."
 PER_the_liberation_front: "El Frente de Liberación"
 PER_the_liberation_front_desc: "El Frente de Liberación será la punta de lanza de nuestros esfuerzos para derrocar al régimen y liberar a Irán. Este frente reunirá a todas las fuerzas democráticas y socialistas de Irán para levantarse contra el gobierno opresor y crear una nueva nación libre."
 PER_kurdish_federalism: "Federalismo kurdo"
 PER_kurdish_federalism_desc: "Reconocemos el derecho del pueblo kurdo a la autodeterminación y apoyamos el establecimiento de un sistema federal en el que el Kurdistán pueda gobernarse a sí mismo sin dejar de ser parte integral de Irán. La autonomía kurda es esencial para la visión del MEK de un Irán libre y democrático."
 PER_workers_with_bread: "Trabajadores con pan"
 PER_workers_with_bread_desc: "Nuestra revolución se basa en las necesidades de la clase trabajadora. La campaña 'Trabajadores con pan' garantizará que todos los trabajadores iraníes tengan acceso a salarios justos, condiciones laborales dignas y la posibilidad de sustentar a sus familias mediante un trabajo honesto."
 PER_clerics_in_red: "Clérigos vestidos de rojo"
 PER_clerics_in_red_desc: "Romperemos con la jerarquía clerical tradicional que ha oprimido al pueblo iraní durante tanto tiempo. Los clérigos de rojo serán aquellos que abrazan el socialismo y la ideología marxista-comunista, trabajando junto a nosotros para construir una sociedad más justa."
 PER_the_international_front: "El Frente Internacional"
 PER_the_international_front_desc: "Nuestra lucha no se limita a Irán. Forjaremos alianzas con otros movimientos progresistas, socialistas y antiimperialistas de todo el mundo, creando un frente internacional para la liberación de todos los pueblos oprimidos."
 PER_oath_of_barandaz: "El juramento de Barandaz"
 PER_oath_of_barandaz_desc: "Guiados por los principios de lealtad y servicio al pueblo iraní, el Juramento de Barandaz simboliza nuestro compromiso de restaurar la estabilidad, la tradición y la justicia bajo la monarquía."
 PER_framework_of_liberty: "Marco de la libertad"
 PER_framework_of_liberty_desc: "Una estructura de gobierno donde las libertades individuales se equilibran con la unidad nacional, garantizando que la libertad exista dentro de un contexto que fomente el orden y el progreso."
 PER_light_in_the_dark_room: "Luz en la habitación oscura"
 PER_light_in_the_dark_room_desc: "Como nación enfrentada a la oscuridad, nuestro partido proyecta una luz de esperanza, ofreciendo claridad y dirección en un mundo de incertidumbre, al tiempo que abraza tanto la modernidad como nuestra antigua herencia."
 PER_loose_cloak_of_democracy: "El manto suelto de la democracia"
 PER_loose_cloak_of_democracy_desc: "La democracia no debe ser una herramienta para el caos. Nuestro sistema permite que la gente sea escuchada, pero no a expensas de la cohesión nacional ni del liderazgo rector."
 PER_grassroots_campaigns: "Campañas de base"
 PER_grassroots_campaigns_desc: "Empoderar a la gente, comenzando desde abajo, para participar en acciones directas e influir en el cambio nacional, garantizando que cada iraní tenga voz en la configuración del futuro."
 PER_throne_of_the_people: "Trono del Pueblo"
 PER_throne_of_the_people_desc: "La monarquía ya no será un derecho hereditario, sino un cargo que deberá reflejar la voluntad y los deseos del pueblo, salvaguardando sus derechos y manteniendo la dignidad real."
 PER_regent_of_iran: "Regente de Irán"
 PER_regent_of_iran_desc: "Una fase de transición requiere mano firme. El regente, designado por nosotros, guiará a la nación hacia el restablecimiento de un verdadero gobierno, con énfasis en la estabilidad y la unidad nacional."
 PER_reshuffle_the_deck: "Rebarajar la baraja"
 PER_reshuffle_the_deck_desc: "Las estructuras políticas y económicas del pasado nos han fallado. Es hora de una reforma completa de los sistemas para eliminar la corrupción y devolver a la nación al lugar que le corresponde."
 PER_a_free_nation: "Una nación libre"
 PER_a_free_nation_desc: "La verdadera libertad no es el caos; es la capacidad de vivir en armonía con las leyes y tradiciones nacionales. Bajo nuestro liderazgo, surgirá una nación próspera y libre, regida por la justicia y el respeto."
 PER_gloves_off_approach: "Enfoque sin guantes"
 PER_gloves_off_approach_desc: "Se tomarán decisiones audaces, incluidas las reformas necesarias para abordar los fracasos del pasado, incluso si eso significa imponer fuertes impuestos para garantizar el futuro financiero de Irán."
 PER_cultural_renaissance: "Renacimiento cultural"
 PER_cultural_renaissance_desc: "El rico patrimonio cultural de Irán es su fortaleza. Es hora de impulsar un renacimiento cultural que combine la sabiduría de nuestros antepasados ​​con la innovación de la sociedad moderna."
 PER_new_class_of_reformers: "Una nueva clase de reformadores"
 PER_new_class_of_reformers_desc: "El futuro pertenece a quienes logran combinar la reforma con el respeto a la tradición. Una nueva generación de reformistas liderará Irán, garantizando prosperidad, justicia e igualdad para todos."
 PER_open_book_policy: "Política de libro abierto"
 PER_open_book_policy_desc: "La transparencia será la piedra angular de nuestra administración. Todas las decisiones, políticas y acciones fiscales se harán públicas, garantizando así que el gobierno rinda cuentas a la ciudadanía."
 PER_break_the_piggybank: "Romper la alcancía"
 PER_break_the_piggybank_desc: "El gasto excesivo y la corrupción han agotado nuestros recursos. Se implementará un nuevo enfoque presupuestario y de gestión financiera para garantizar la solidez financiera del futuro de Irán."
 PER_state_withdrawal_from_corporate_activities: "Retirada del Estado de las actividades corporativas"
 PER_state_withdrawal_from_corporate_activities_desc: "Para empoderar al sector privado, el Estado reducirá su papel en los asuntos corporativos, promoviendo el espíritu emprendedor y la competencia y manteniendo al mismo tiempo la regulación para proteger a la gente."
 PER_guided_hand_approach: "Enfoque de mano guiada"
 PER_guided_hand_approach_desc: "La economía requiere dirección. En lugar de microgestionar, el Estado guiará estratégicamente a las industrias hacia el crecimiento, garantizando que los recursos nacionales se utilicen de forma eficiente y sostenible."
 PER_autonomy_deal: "Acuerdo de Autonomía"
 PER_autonomy_deal_desc: "Las negociaciones con los líderes regionales permitirán una mayor autonomía donde sea necesaria, garantizando que cada parte de Irán tenga la libertad de gobernarse a sí misma mientras permanece unida bajo la monarquía."
 PER_foreign_investment_plan: "Plan de Inversión Extranjera"
 PER_foreign_investment_plan_desc: "Al abrir la puerta a la inversión extranjera, modernizaremos nuestra infraestructura e industrias sin comprometer la soberanía iraní, fomentando una economía autosostenible."
 PER_state_fund_credit: "Crédito del Fondo Estatal"
 PER_state_fund_credit_desc: "El acceso al crédito es esencial para el crecimiento. Mediante la asignación estratégica de fondos estatales, otorgaremos crédito a industrias clave, garantizando el cumplimiento de los objetivos nacionales y apoyando al sector privado."
 PER_ensure_labor_rights_legislation: "Garantizar la legislación sobre derechos laborales"
 PER_ensure_labor_rights_legislation_desc: "Los trabajadores iraníes tendrán sus derechos protegidos mediante leyes laborales sólidas que garanticen salarios justos, seguridad y la oportunidad de movilidad ascendente en una economía próspera."
 PER_military_arms_pact: "La Guardia Imperial"
 PER_military_arms_pact_desc: "Nuestro ejército debe mantenerse fuerte y seguro. Al restaurar la Guardia Imperial a su antigua gloria, contaremos con un pilar adicional de fuerza en el que apoyarnos."
 PER_sovereignty_for_trade_unions: "Soberanía para los sindicatos"
 PER_sovereignty_for_trade_unions_desc: "Respetamos el papel de los sindicatos para garantizar un trato justo a los trabajadores. Al empoderar a estas organizaciones, podemos lograr un equilibrio entre los derechos laborales y el crecimiento económico."
 PER_second_white_revolution: "La segunda revolución blanca"
 PER_second_white_revolution_desc: "La Revolución Blanca sentó las bases para un futuro próspero. Ahora, nos embarcaremos en una Segunda Revolución Blanca, modernizando la educación, la atención médica y la infraestructura del país para crear un futuro mejor para todos."
 PER_the_shining_example: "Un ejemplo brillante"
 PER_the_shining_example_desc: "Irán volverá a ser un faro de esperanza en la región. Bajo nuestro liderazgo, demostraremos cómo una nación puede combinar tradición, monarquía y progreso para crear una sociedad que el mundo pueda admirar."
 PER_party_of_iranians: "Partido de los iraníes"
 PER_party_of_iranians_desc: "El Partido de los Iraníes se basa en la visión de un Irán unido y fuerte, una nación que trasciende fronteras y diferencias. Nuestro objetivo es devolver a Irán el lugar que le corresponde como corazón del mundo iraní, unidos bajo una sola bandera y un solo propósito."
 PER_hooshang_talaes_plea: "La súplica de Hooshang Talaee"
 PER_hooshang_talaes_plea_desc: "Las palabras de Hooshang Talaee hacen eco de las esperanzas de nuestro pueblo: un ruego por la unidad, por la dignidad y por la restauración del espíritu iraní. Su llamado a la acción se ha convertido en nuestro principio rector mientras nos levantamos para reclamar nuestra herencia."
 PER_the_secretary_general: "El Secretario General"
 PER_the_secretary_general_desc: "El rol del Secretario General no es solo un cargo; es la personificación de la voluntad y la fuerza del Partido. Como líder, esta persona es la fuerza que guía nuestro movimiento, garantizando que nuestra visión de un Irán unificado se haga realidad."
 PER_coalition_with_kdpi: "Coalición con el PDKI"
 PER_coalition_with_kdpi_desc: "Nuestra alianza con el Partido Democrático del Kurdistán Iraní se basa en intereses mutuos y objetivos compartidos. Juntos, haremos frente a las fuerzas divisorias que amenazan a nuestra nación, garantizando la unidad de todos los iraníes, independientemente de su etnia."
 PER_purge_clerical_ministers: "Purgar a los ministros clericales"
 PER_purge_clerical_ministers_desc: "El estamento clerical ha envenenado el pozo del gobierno iraní durante demasiado tiempo. Es hora de eliminar a quienes usan la religión para manipular al pueblo y restaurar la integridad del gobierno mediante un liderazgo secular."
 PER_hekamiyate_mellat: "Hekamiyat-e Mellat"
 PER_hekamiyate_mellat_desc: "Nuestra visión de gobernanza se basa en la fuerza y ​​la unidad del pueblo iraní. Hekamiyat-e Mellat, o el gobierno del pueblo, exige un gobierno que sirva a sus ciudadanos por encima de todo, arraigado en la identidad nacional e impulsado por las aspiraciones de un Irán unido."
 PER_curb_separatist_sentiment: "Frenar el sentimiento separatista"
 PER_curb_separatist_sentiment_desc: "La amenaza del separatismo socava la integridad de nuestra nación. Debemos confrontar y reprimir estos movimientos, especialmente entre la población kurda, para garantizar que Irán siga siendo una entidad fuerte y unificada."
 PER_utilizing_our_ally: "Utilizando a nuestro aliado"
 PER_utilizing_our_ally_desc: "Nuestra colaboración con el PDKI nos proporciona información valiosa sobre las actividades kurdas en Irán. Colaborando estrechamente con ellos, podemos mantener el control de nuestras fronteras y obtener información de inteligencia sobre las amenazas a nuestra unidad nacional."
 PER_investigate_foreign_influence: "Investigar la influencia extranjera en la región"
 PER_investigate_foreign_influence_desc: "Debemos estar atentos para identificar a las potencias extranjeras que buscan socavar la soberanía iraní. Su influencia debe ser limitada para garantizar que nuestro camino hacia la unidad no se vea obstaculizado por fuerzas externas."
 PER_caspian_fortification: "Fortificaciones del Caspio"
 PER_caspian_fortification_desc: "El Mar Caspio es una parte crucial de la defensa estratégica de Irán. Fortificaremos esta región para proteger nuestras costas de amenazas externas y garantizar la protección de nuestros recursos ante cualquier ambición extranjera."
 PER_pezeshkpours_agenda: "Agenda de Pezeshkpour"
 PER_pezeshkpours_agenda_desc: "La agenda de Pezeshkpour se centra en la creación de un Irán donde la educación, la ciencia y la cultura prosperen. Imaginó un Irán unido, a la vanguardia de la innovación, fiel a sus raíces históricas."
 PER_all_that_was_taken: "Todo lo que se llevaron"
 PER_all_that_was_taken_desc: "La tierra que una vez fue nuestra, tomada por británicos y rusos, debe ser devuelta al pueblo iraní. No descansaremos hasta que las fronteras de Irán se restablezcan por completo, recuperando lo perdido en nombre del imperialismo."
 PER_bolster_anjoman: "Reforzar al Anjoman"
 PER_bolster_anjoman_desc: "El Anjoman, nuestro brazo armado, es esencial para nuestra causa. Al fortalecer esta organización, garantizamos que nuestro movimiento cuente con los medios para proteger y defender al pueblo iraní, impulsando nuestra causa con determinación inquebrantable."
 PER_fighting_colonialism: "Lucha contra el colonialismo"
 PER_fighting_colonialism_desc: "Las potencias coloniales han buscado durante mucho tiempo explotar Irán y sus recursos. Nos oponemos firmemente al colonialismo y seguiremos luchando por la soberanía de Irán y la liberación de nuestro pueblo de la dominación extranjera."
 PER_sway_dushanbe: "Influenciar en Dusambé"
 PER_sway_dushanbe_desc: "Tayikistán es parte integral del mundo iraní. Mediante la cooperación diplomática, fortaleceremos los lazos con Dusambé, garantizando que nuestra visión de una Unión Iraní se extienda por toda la región y nos una en un destino común."
 PER_talks_in_kabul: "Conversaciones en Kabul"
 PER_talks_in_kabul_desc: "Afganistán es un socio crucial en la creación de una Unión Iraní más amplia. Nuestras conversaciones en Kabul sentarán las bases para una región unificada donde Irán y sus vecinos se mantengan firmes frente a la injerencia extranjera y la desunión interna."
 PER_rekindle_the_fading_light: "Reavivar la luz que se desvanece"
 PER_rekindle_the_fading_light_desc: "La visión de una Unión Iraní unida, que se extienda desde el corazón de Irán hasta sus vecinos culturales e históricos, se está desvaneciendo. Debemos trabajar incansablemente para reavivar la llama de este sueño, garantizando que el mundo iraní vuelva a estar unido bajo una sola bandera."
 PER_the_masculine_cat: "El gato macho"
 PER_the_masculine_cat_desc: "El título 'Masculine Cat' es un símbolo irónico del complejo acercamiento de Montazeri al liderazgo: asertivo, pero profundamente reflexivo. Un hombre que busca equilibrio entre fuerza y sabiduría, Montazeri ejemplifica las necesidades de liderazgo de Irán en tiempos de transición."
 PER_montazeris_will: "El testamento de Montazerí"
 PER_montazeris_will_desc: "La voluntad de Montazerí es la luz que guía nuestra lucha. Su llamado a la justicia, su visión de una sociedad justa, libre de autoritarismo, nos sigue inspirando a transformar Irán en una nación donde el poder verdaderamente pertenezca al pueblo."
 PER_wisdom_not_provocation: "Sabiduría, no provocación"
 PER_wisdom_not_provocation_desc: "Montazerí nos enseña que la sabiduría no reside en la confrontación, sino en el diálogo. Aboga por soluciones pacíficas, una estrategia cautelosa y la comprensión, en lugar de provocaciones precipitadas. Es mediante el razonamiento sereno que guiaremos a Irán hacia una nueva era."
 PER_end_of_political_prisons: "Fin de las cárceles políticas"
 PER_end_of_political_prisons_desc: "Los presos políticos no tienen lugar en un Irán justo. La postura de Montazeri está clara. Los que hablan no deben ser silenciados a través de la fuerza. Es hora de poner fin al uso de las prisiones como instrumentos para la represión política y comenzar un nuevo capítulo de transparencia y derechos humanos."
 PER_middle_ground_with_mek: "Punto medio con el MEK"
 PER_middle_ground_with_mek_desc: "El papel del MEK en nuestra revolución no puede ser pasado por alto, pero también se han extraviado en algunos aspectos. Un punto medio: diálogo sobre división, cooperación cuando sea posible, pero un camino claro hacia la reconciliación nacional."
 PER_the_rights_of_all: "Los derechos de todos"
 PER_the_rights_of_all_desc: "Irán es una nación para todos los iraníes; debemos defender los derechos de cada ciudadano, independientemente de su origen, religión o afiliación política. Su visión es la de un Irán donde la igualdad y la justicia no sean solo ideales, sino realidades para todos."
 PER_religion_of_kindness_and_tolerance: "Religión de bondad y tolerancia"
 PER_religion_of_kindness_and_tolerance_desc: "El verdadero Islam, como enseñó Montazerí, no se trata de imposición ni castigo, sino de bondad y tolerancia. Irán adoptará los valores pacíficos e inclusivos del Islam, creando una sociedad basada en la compasión, la comprensión y el respeto por todas las religiones."
 PER_political_liberalization: "Liberalización política"
 PER_political_liberalization_desc: "Crearemos un Irán donde la política ya no sea dominio de unas pocas élites sino que sea abierta, justa e inclusiva. La liberalización política es el camino hacia un nuevo Irán, donde los ciudadanos puedan expresar libremente sus opiniones y elegir a sus líderes por medios democráticos."
 PER_dismantle_sharia_institutions: "Desmantelar las instituciones de la sharía"
 PER_dismantle_sharia_institutions_desc: "Ha llegado el momento de desmantelar las instituciones represivas de la sharía que han corrompido los principios de justicia e igualdad. Montazerí aboga por un enfoque secular del gobierno, garantizando que la religión ya no controle el Estado y que Irán se convierta en una verdadera república."
 PER_democracy_with_islamic_principles: "Democracia con principios islámicos"
 PER_democracy_with_islamic_principles_desc: "La visión de Montazeri para un Irán reformado es uno donde la democracia y los principios islámicos coexisten armoniosamente. La Segunda República Islámica será una nación donde la libertad, la justicia y la ética islámica guíen la gobernanza, donde la democracia y la fe prosperan en equilibrio."
 PER_prohibit_irgc_business_access: "Prohibir la participación del CGRI en los negocios"
 PER_prohibit_irgc_business_access_desc: "El CGRI y sus miembros tienen un férreo control sobre la economía iraní. Es hora de desmantelar los pilares del poder. Aplastaremos su influencia implementando nuevas leyes de procesamiento y aplicando severas sanciones. Cualquiera que viole estas nuevas leyes enfrentará graves consecuencias, incluyendo largas penas de prisión. La era del dominio del CGRI ha terminado."
 PER_march_towards_freedom: "Marcha hacia la libertad"
 PER_march_towards_freedom_desc: "El FMI, que en un principio fue concebido como un contrapeso liberal al régimen de Jomeini, ha regresado a la escena política iraní con nuevas ambiciones. Con la mira puesta en la reforma y el progreso, el FMI desafiará a las figuras y líderes arraigados que han plagado a Irán durante tanto tiempo."
 PER_a_heavy_hand: "Una mano pesada"
 PER_a_heavy_hand_desc: "Irán ha quedado en un estado de desorden, con sus sistemas e instituciones pudriéndose debido a años de negligencia. Adoptaremos un enfoque práctico, desmantelando lo que está roto y reconstruyéndolo todo de forma que promueva el crecimiento y la estabilidad. Este reinicio despejará lo viejo y sentará unas nuevas bases."
 PER_absorb_state_assets: "Absorber activos estatales"
 PER_absorb_state_assets_desc: "Como parte de la reforma del gobierno que absorbe algunos activos podría ser beneficioso. Llámalo una mano abierta a la gente. No pueden quejarse de esto."
 PER_exploit_the_banks: "Explotar los bancos"
 PER_exploit_the_banks_desc: "Los bancos deben servir al pueblo, no a la élite. Tomaremos el control de las instituciones financieras y las reorientaremos hacia el crecimiento nacional, garantizando que la riqueza de Irán se utilice en beneficio de todos los iraníes, no solo de unos pocos privilegiados."
 PER_guiding_light_of_iran: "La luz guía de Irán"
 PER_guiding_light_of_iran_desc: "Somos la luz que guía un futuro arraigado en los valores de la libertad, la democracia y la justicia social. Nuestro movimiento busca guiar a Irán hacia un futuro más brillante, donde cada ciudadano tenga voz y la oportunidad de prosperar."
 PER_revitalize_democratic_principles: "Revitalizar los principios democráticos"
 PER_revitalize_democratic_principles_desc: "La democracia de Irán debe renovarse y fortalecerse. Reformaremos nuestras instituciones políticas, devolviendo el poder al pueblo y garantizando que el gobierno sirva a las necesidades y deseos del pueblo iraní, no a los intereses extranjeros o a unas pocas élites poderosas."
 PER_recraft_state_foundations: "Reestructurar las fundaciones estatales"
 PER_recraft_state_foundations_desc: "Es necesario reestructurar los cimientos del Estado iraní para que reflejen mejor las necesidades modernas de nuestra sociedad. Reestructuraremos nuestras instituciones para apoyar un Irán democrático que se mantenga firme frente a los desafíos internos y externos."
 PER_inheritors_of_iran: "Los herederos de Irán"
 PER_inheritors_of_iran_desc: "Somos herederos del rico legado cultural, intelectual y político de Irán. Las luchas del pasado han forjado una fuerte identidad nacional, y ahora es nuestro deber llevar esta antorcha y guiar a nuestra nación hacia el progreso, la unidad y la paz."
 PER_weathering_the_storm_to_come: "Capear el temporal que se avecina"
 PER_weathering_the_storm_to_come_desc: "Los desafíos que nos esperan son enormes, pero estamos preparados. Mediante la unidad, la resiliencia y una planificación cuidadosa, superaremos la tormenta política que amenaza con desestabilizar a Irán, resurgiendo más fuertes y unidos que nunca."
 PER_yazdis_clique: "La camarilla de Yazdi"
 PER_yazdis_clique_desc: "La facción conservadora de Yazdi ha llevado a Irán por un camino peligroso. Debemos confrontar su influencia y garantizar que el futuro de Irán no sea determinado por quienes obstaculizan el progreso y las reformas democráticas."
 PER_bazargans_clique: "La camarilla de Bazargani"
 PER_bazargans_clique_desc: "Es hora de abandonar el liderazgo de Yazdi en favor del enfoque más liberal de Bazargani. Su visión de un Irán democrático y libre se alinea con nuestros objetivos de apertura política y justicia social, y lo apoyaremos en la consecución de esta visión."
 PER_the_press_mizan: "El regreso del periódico Mizan"
 PER_the_press_mizan_desc: "Después de haber servido como periódico del partido desde 1980-1981 hasta ser censurado, Mizan ahora será revitalizado una vez más para asuntos estatales."
 PER_the_iranian_work_bench: "El banco de trabajo iraní"
 PER_the_iranian_work_bench_desc: "La base del futuro de Irán reside en nuestros trabajadores. Crearemos un espacio nacional de trabajo donde se prioricen el desarrollo industrial, la educación y la infraestructura, lo que permitirá a Irán convertirse en un líder mundial en innovación e industria."
 PER_unorthodox_approach: "Un enfoque poco ortodoxo"
 PER_unorthodox_approach_desc: "No tememos tomar caminos no convencionales si estos conducen al progreso de Irán. Nuestro enfoque de gobernanza y reforma será audaz y decisivo, trazando un rumbo que rompa con las viejas ideologías y abrace el futuro."
 PER_revolutionizing_democracy: "Revolucionando la democracia"
 PER_revolutionizing_democracy_desc: "La democracia debe evolucionar en la era moderna. Implementaremos la democracia digital y los avances tecnológicos que empoderen a la población, garantizando que cada iraní tenga participación directa en el gobierno de su nación a través de plataformas modernas."
 PER_military_diarchy: "Concesiones al Ejército"
 PER_military_diarchy_desc: "Para mantener la estabilidad y evitar la intervención militar, ofreceremos ciertas concesiones al ejército. Un equilibrio de poder entre el liderazgo militar y civil garantizará la seguridad de Irán, preservando al mismo tiempo el proceso democrático."
 PER_stamp_out_factionalism: "Acabar con el faccionalismo"
 PER_stamp_out_factionalism_desc: "Las facciones que dividen a nuestra nación deben ser silenciadas. Al eliminar las divisiones internas, crearemos un frente unido que impulse la reforma y el progreso, dejando atrás las luchas internas que nos han frenado durante tanto tiempo."
 PER_followers_of_mossadegh: "Seguidores de Mosaddeq"
 PER_regain_popular_support: "Recuperar el apoyo popular"
 PER_regain_popular_support_desc: "A lo largo de las décadas hemos perdido parte del esplendor que solíamos tener, ha llegado el momento de que recuperemos el apoyo popular del pueblo iraní."
 PER_followers_of_mossadegh_desc: "Somos los verdaderos herederos del legado de Mosaddeq. Su lucha por la independencia y la democracia de Irán también es nuestra causa. Honraremos su memoria continuando su lucha para liberar a Irán de la influencia externa y la tiranía interna."
 PER_struggle_towards_a_great_nation: "La lucha por una gran nación"
 PER_struggle_towards_a_great_nation_desc: "Estamos dedicados a la lucha por construir un gran Irán, uno donde la libertad, la democracia y la justicia no son sólo aspiraciones, sino el fundamento de una nueva nación. Juntos, lucharemos por un Irán que es alto entre los más grandes del mundo."
 PER_shackle_the_unruly_clerics: "Encadenar a los clérigos rebeldes"
 PER_shackle_the_unruly_clerics_desc: "Es necesario restringir a los clérigos que pretenden imponer su autoridad sobre el Estado. Garantizaremos que los líderes religiosos ya no dicten el curso del gobierno, restableciendo el carácter secular de nuestra república y respetando al mismo tiempo las necesidades espirituales del pueblo iraní."
 PER_cooperation_under_the_shade: "Cooperación bajo la sombra"
 PER_cooperation_under_the_shade_desc: "Buscamos formar alianzas con los movimientos de resistencia democrática en la región, en particular en Arabia Saudita. Al apoyar su lucha por la libertad, fortalecemos nuestra propia posición y promovemos la causa de la democracia en todo Oriente Medio."
 PER_no_iran_without_islam: "No hay Irán sin Islam"
 PER_no_iran_without_islam_desc: "El islam es parte integral de la identidad de Irán. Mientras luchamos por la democracia, nos aseguraremos de que el islam permanezca en el centro de nuestros valores nacionales, configurando nuestras políticas de forma que se alineen con nuestra fe y nuestro compromiso con la libertad."
 PER_iran_triumphant: "Irán triunfante"
 PER_iran_triumphant_desc: "Irán triunfará como un modelo de democracia y libertad. Superaremos los obstáculos en nuestro camino y crearemos una nación que no solo sea independiente, sino un ejemplo para el mundo, donde la democracia, la justicia y la prosperidad estén al alcance de todos."
 PER_path_of_hope: "El camino de la esperanza"
 PER_path_of_hope_desc: "Creemos en un futuro más brillante y próspero para todos los iraníes. Nuestro camino es de reforma, transparencia y justicia, donde el pueblo se empodere, se restablezca el estado de derecho y nuestra nación se revitalice con esperanza en el futuro."
 PER_our_right_to_nuclear_power: "Nuestro derecho a la energía nuclear"
 PER_our_right_to_nuclear_power_desc: "Irán tiene el derecho soberano a desarrollar tecnología nuclear con fines pacíficos. Haremos valer nuestro derecho a la energía nuclear, garantizando al mismo tiempo que nuestros programas sean transparentes, seguros y se utilicen en beneficio del pueblo iraní."
 PER_merit_centric_positions: "Puestos centrados en el mérito"
 PER_merit_centric_positions_desc: "Reformaremos los sistemas político y económico de Irán, garantizando que los puestos de poder e influencia se otorguen con base en el mérito, no en el favoritismo ni el nepotismo. Nuestra nación será liderada por quienes estén verdaderamente capacitados para servir al pueblo."
 PER_restore_faith_in_the_law: "Restaurando la fe en la ley"
 PER_restore_faith_in_the_law_desc: "La confianza de nuestros ciudadanos en el sistema judicial se ha visto erosionada por la corrupción y la injusticia. Restauraremos la fe en la ley garantizando la equidad, la transparencia y la rendición de cuentas en todos los aspectos del proceso judicial iraní."
 PER_favor_the_enterprises: "Favorecer a las empresas"
 PER_favor_the_enterprises_desc: "Una economía próspera requiere el apoyo de las empresas. Implementaremos políticas que fomenten la innovación, creen empleo y permitan el florecimiento de las empresas privadas, impulsando así a Irán hacia la prosperidad económica."
 PER_favor_the_unions: "Favorecer a los sindicatos"
 PER_favor_the_unions_desc: "La clase trabajadora iraní merece una voz fuerte. Apoyaremos a los sindicatos e implementaremos políticas que garanticen la protección de los derechos de los trabajadores y que reciban salarios y condiciones laborales justas."
 PER_office_of_accountability: "Oficina de Responsabilidad"
 PER_office_of_accountability_desc: "La corrupción y la ineficiencia han plagado a nuestro gobierno durante demasiado tiempo. Estableceremos la Oficina de Rendición de Cuentas para investigar y exponer la corrupción en todos los niveles, garantizando que quienes ostentan el poder rindan cuentas por sus acciones."
 PER_protecting_our_investments: "Protegiendo nuestras inversiones"
 PER_protecting_our_investments_desc: "Las inversiones extranjeras y nacionales son cruciales para la estabilidad económica de Irán. Implementaremos políticas que protejan las inversiones, garanticen su crecimiento y fomenten un clima de confianza para los inversores, tanto dentro como fuera de Irán."
 PER_overhaul_security_apperatus: "Revisar el aparato de seguridad"
 PER_overhaul_security_apperatus_desc: "Las fuerzas de seguridad iraníes deben reformarse para proteger a la población, no para intimidarla. Reformaremos el aparato de seguridad, garantizando que sea eficiente y respetuoso con los derechos y libertades de los ciudadanos."
 PER_grant_judicial_independence: "Conceder independencia judicial"
 PER_grant_judicial_independence_desc: "Un poder judicial justo e independiente es la piedra angular de la democracia. Garantizaremos al poder judicial plena independencia frente a presiones políticas, garantizando que los jueces puedan actuar con imparcialidad y proteger los derechos de todos los iraníes."
 PER_steel_for_soldiers_bread_for_people: "Acero para los soldados, pan para el pueblo"
 PER_steel_for_soldiers_bread_for_people_desc: "Nuestros soldados estarán bien equipados y listos para defender nuestra nación, pero las necesidades del pueblo también deben ser prioritarias. Lograremos un equilibrio entre la defensa nacional y el bienestar económico, garantizando la satisfacción de las necesidades del pueblo."
 PER_equality_at_work: "Igualdad en el trabajo"
 PER_equality_at_work_desc: "Garantizaremos que todos los trabajadores, independientemente de su género, etnia u origen, tengan las mismas oportunidades en el lugar de trabajo. Lucharemos contra la discriminación laboral y promoveremos la igualdad salarial por el mismo trabajo."
 PER_grand_chabahar_project: "Proyecto Gran Chabahar"
 PER_grand_chabahar_project_desc: "El puerto de Chabahar puede convertirse en la piedra angular del futuro económico de Irán. Invertiremos fuertemente en el Proyecto Gran Chabahar, convirtiéndolo en un importante centro de comercio y cooperación regional."
 PER_rebuild_the_iranian_navy: "Reconstruir la Armada iraní"
 PER_rebuild_the_iranian_navy_desc: "Una armada fuerte y moderna es esencial para la seguridad y la influencia global de Irán. Priorizaremos la reconstrucción de la Armada iraní, asegurándonos de que esté equipada para defender nuestros intereses y proteger nuestra soberanía."
 PER_god_science_freedom: "Dios, ciencia y el trabajador"
 PER_god_science_freedom_desc: "Nuestra fundación se basa en los principios de la fe, el conocimiento y la justicia. Creemos en la armonía de la devoción religiosa, el progreso científico y el empoderamiento de los trabajadores iraníes. Estos ideales nos guiarán al forjar un nuevo camino para la nación."
 PER_mossadeghs_legacy: "El legado de Mosaddeq"
 PER_mossadeghs_legacy_desc: "El Frente Nacional honra el legado indomable del Dr. Mohammad Mosaddeq, cuyo compromiso con la soberanía iraní, la independencia y la nacionalización de nuestros recursos continúa inspirando nuestra lucha. Continuaremos su lucha por la libertad, la democracia y la autodeterminación nacional."
 PER_commit_to_nonalignment: "Comprometerse con la no alineación"
 PER_commit_to_nonalignment_desc: "Irán debe seguir siendo una fuerza independiente y neutral en el escenario mundial, libre de la influencia de potencias extranjeras. Nos comprometemos a una política de no alineamiento, rechazando la hegemonía tanto oriental como occidental y a favor de trazar nuestro propio rumbo."
 PER_forging_a_path: "Forjando un nuevo camino"
 PER_forging_a_path_desc: "Si bien honramos el legado de Mosaddeq, reconocemos la necesidad de adaptarnos a un mundo en constante cambio. Debemos crear un nuevo camino para Irán, uno que combine los principios de justicia y libertad con las realidades prácticas de la gobernanza moderna."
 PER_way_of_bakhtiar: "El camino de Bajtiar"
 PER_way_of_bakhtiar_desc: "Tras la agitación política, recurrimos a la visión de Shapur Bajtiar, figura de integridad y reforma. Al abrazar sus ideales, nos esforzaremos por traer estabilidad, equidad y progreso a Irán, garantizando la democracia y el estado de derecho."
 PER_distance_church_and_state: "Distancia entre la Iglesia y el Estado"
 PER_distance_church_and_state_desc: "La separación de la religión y la política es esencial para garantizar la libertad y la prosperidad de nuestro pueblo. Estableceremos una clara separación entre la Iglesia y el Estado, permitiendo un gobierno que sirva a todos los iraníes, independientemente de su fe."
 PER_demilitarization_of_politics: "Desmilitarización de la política"
 PER_demilitarization_of_politics_desc: "Los militares deben servir al pueblo, no controlarlo. Trabajaremos por la desmilitarización de la política, garantizando que los líderes civiles tengan el poder de gobernar sin la influencia indebida de los militares."
 PER_strenght_through_intelligence: "La fuerza a través del conocimiento"
 PER_strenght_through_intelligence_desc: "La verdadera fuerza no reside solo en el poderío militar, sino en el poder del conocimiento y la educación. Invertiremos considerablemente en ciencia, tecnología y educación, garantizando que Irán siga siendo un centro de innovación y liderazgo intelectual."
 PER_appease_the_technocrats: "Apaciguar a los tecnócratas"
 PER_appease_the_technocrats_desc: "El futuro de Irán está en manos de profesionales cualificados y tecnócratas. Trabajaremos para garantizar que los tecnócratas desempeñen un papel central en el gobierno de nuestra nación, priorizando la experiencia y la formulación de políticas racionales sobre la ideología."
 PER_distance_from_the_east: "Distancia desde el este"
 PER_distance_from_the_east_desc: "Si bien valoramos nuestra soberanía, debemos distanciarnos de la influencia de potencias orientales como China y Rusia. El futuro de Irán reside en una política exterior independiente y libre de presiones externas de Oriente."
 PER_freedom_of_knowledge: "La libertad del conocimiento"
 PER_freedom_of_knowledge_desc: "Garantizaremos que todos los iraníes tengan acceso al conocimiento y la educación. La libertad de estudiar, investigar y enseñar es fundamental para nuestra visión de un Irán progresista, donde todos los ciudadanos tengan la capacidad de contribuir a la sociedad."
 PER_rebuild_oil_industry: "Reconstruir la industria petrolera"
 PER_rebuild_oil_industry_desc: "La industria petrolera de nuestro país es el motor de nuestra economía. Reconstruiremos y modernizaremos el sector petrolero, garantizando que beneficie al pueblo iraní y nos permita recuperar el control de nuestros recursos naturales."
 PER_privatization_debate: "Debate sobre la privatización"
 PER_privatization_debate_desc: "La privatización de las industrias estatales es un tema de gran importancia. Participaremos en un debate nacional para determinar la mejor estrategia, sopesando los beneficios y riesgos de la privatización para nuestra economía."
 PER_aggressive_nationalization: "Nacionalización agresiva"
 PER_aggressive_nationalization_desc: "Algunos sectores de la economía son demasiado importantes para dejarlos en manos privadas. Impulsaremos una nacionalización agresiva para garantizar que las industrias clave, especialmente las relacionadas con el petróleo y el gas, estén bajo el control del pueblo iraní."
 PER_privatize_military_chains: "Privatizar las cadenas militares"
 PER_privatize_military_chains_desc: "Las fuerzas armadas deben modernizarse y ser eficientes, lo que incluye la privatización de ciertas industrias militares para permitir mayor flexibilidad e innovación. Nos centraremos en crear una industria de defensa eficaz y rentable."
 PER_backbone_of_the_front: "Columna vertebral del frente"
 PER_backbone_of_the_front_desc: "Nuestro ejército debe ser fuerte y contar con el apoyo popular. Nos aseguraremos de que nuestros soldados estén debidamente equipados y apoyados, convirtiendo al ejército iraní en la columna vertebral de nuestra defensa y seguridad nacionales."
 PER_work_justice_freedom: "Trabajo, Justicia, Libertad"
 PER_work_justice_freedom_desc: "Crearemos una sociedad donde el trabajo sea digno, se respete la justicia y se respete la libertad para todos los iraníes. Garantizaremos derechos laborales justos, igualdad de oportunidades y un sistema de justicia que beneficie a todos los ciudadanos."
 PER_embrace_french_socialism: "Abrazar el socialismo francés"
 PER_embrace_french_socialism_desc: "Tomaremos los principios del socialismo francés como modelo para construir una sociedad más justa. Centrándonos en el bienestar del pueblo, combinaremos los ideales de libertad, igualdad y fraternidad en nuestra búsqueda de un Irán justo y próspero."
 PER_continue_with_scientific_socialism: "Continuar con el socialismo científico"
 PER_continue_with_scientific_socialism_desc: "El socialismo científico ofrece un marco para organizar la sociedad basado en la razón, el bienestar colectivo y el progreso tecnológico. Seguiremos adoptando este enfoque, adaptándolo a las necesidades específicas de Irán mientras construimos una sociedad justa y moderna."
 PER_gates_to_the_world: "Puertas al Mundo"
 PER_gates_to_the_world_desc: "Es hora de que Irán abra sus puertas al mundo y abrace la cooperación y el intercambio global. Al fomentar las relaciones diplomáticas, ampliaremos nuestra influencia y comercio, lo que permitirá que nuestra nación prospere en el escenario mundial."
 PER_summit_with_the_west: "Cumbre con Occidente"
 PER_summit_with_the_west_desc: "Buscamos dialogar con las potencias occidentales en una cumbre, destinada a establecer respeto mutuo, acuerdos comerciales y diplomacia pacífica. Esta reunión será un momento decisivo para nuestro lugar en la comunidad internacional y forjará vínculos más fuertes con Occidente."
 PER_appease_the_republicans: "Apaciguar a los republicanos"
 PER_appease_the_republicans_desc: "Varios políticos republicanos nos han alabado y elogiado a lo largo de la historia. Es hora de que les devolvamos todo su apoyo, con ciertas condiciones."
 PER_secure_american_support: "Asegurar apoyo estadounidense"
 PER_secure_american_support_desc: "Si queremos que nuestro viejo equipamiento americano llegue a la próxima década, entonces tendremos que encontrar rápidamente una forma de asegurar el apoyo americano."
 PER_the_peoples_interest: "Interés del Pueblo"
 PER_the_peoples_interest_desc: "Todas las decisiones deben tomarse priorizando el bienestar del pueblo. Al garantizar que cada acción del gobierno refleje las necesidades y los deseos de la población, podemos construir una nación fuerte, justa y próspera."
 PER_qalibafs_movement: "El movimiento de Qalibaf"
 PER_qalibafs_movement_desc: "Un movimiento basado en el pragmatismo, la innovación y el compromiso de reimaginar el futuro de Irán. Lideraremos el avance del país con un enfoque en la gobernanza moderna, el progreso tecnológico y el firme objetivo de fortalecer nuestra integridad nacional."
 PER_technocrats_of_tehran: "Tecnócratas de Teherán"
 PER_technocrats_of_tehran_desc: "El futuro de Irán está en manos de quienes saben gobernar con eficiencia, experiencia y precisión. Nuestra visión traerá consigo la modernización del aparato estatal, garantizando que nos elevemos por encima de la política mezquina y nos concentremos en el desarrollo nacional."
 PER_reduce_agricultural_subsidies: "Reducir los subsidios agrícolas"
 PER_reduce_agricultural_subsidies_desc: "Debemos reformar el sector agrícola para hacerlo más eficiente. Reducir los subsidios fomentará la innovación, la eficiencia y la sostenibilidad, garantizando así que la industria agrícola iraní pueda competir en el mercado global."
 PER_pragmatic_commander: "El comandante pragmático"
 PER_pragmatic_commander_desc: "Nuestro enfoque es claro: el pragmatismo sobre la ideología. Construiremos un Irán estable y próspero centrándonos en los resultados, no la retórica política. Estabilidad se logrará a través de un liderazgo decisivo y una gobernanza eficaz."
 PER_redifining_the_revolution: "Redefiniendo la revolución"
 PER_redifining_the_revolution_desc: "La revolución no es un concepto abstracto; debe evolucionar para satisfacer las exigencias del Irán moderno. Nuestra tarea es redefinir la revolución con un enfoque en el progreso nacional, la resiliencia económica y la modernización, asegurando que la revolución sirva hoy al pueblo."
 PER_invite_russian_investors: "Invitar a los inversores rusos"
 PER_invite_russian_investors_desc: "Rusia es un socio crucial en el futuro de Irán. Al invitar a los inversores rusos, abriremos nuevas oportunidades para el crecimiento económico, el avance tecnológico y la alineación geopolítica en un momento en que ambas naciones se necesitan más que nunca."
 PER_getting_things_done: "Hacer las cosas"
 PER_getting_things_done_desc: "La acción es clave, y Ghalibaf es un hombre de acción. Nuestro gobierno priorizará los resultados tangibles, asegurando que cada plan e iniciativa lleve a mejoras reales y mensurables. No más demoras ni excusas. Sólo resultados."
 PER_sideline_soleimani: "Conectado a Soleimani"
 PER_sideline_soleimani_desc: "Un nuevo rumbo para Irán requiere un liderazgo claro que no se deje distraer por luchas de poder personales. Al marginar a figuras que ya no se alinean con nuestra visión pragmática, allanaremos el camino hacia un verdadero progreso nacional."
 PER_irgc_leadership: "Liderazgo del CGRI"
 PER_irgc_leadership_desc: "El CGRI debe seguir siendo parte integral de nuestra seguridad y desarrollo nacional, pero servirá bajo una visión unificada. Garantizaremos que el liderazgo del CGRI esté en armonía con los objetivos económicos y estratégicos de la nación, contribuyendo a un Irán más fuerte."
 PER_iran_on_the_move: "Irán en movimiento"
 PER_iran_on_the_move_desc: "Irán debe avanzar, y bajo nuestro liderazgo, lo hará. Nuestro enfoque en la modernización permitirá que la nación avance a una velocidad sin precedentes, asegurando nuestro lugar entre las potencias mundiales."
 PER_focus_on_cities: "Enfoque en las ciudades"
 PER_focus_on_cities_desc: "Las ciudades de Irán son donde se forjará el futuro. Desde Teherán hasta Isfahán, concentraremos recursos en el desarrollo urbano, garantizando que nuestras ciudades sean referentes de progreso, innovación y eficiencia."
 PER_controlled_reform: "Reforma controlada"
 PER_controlled_reform_desc: "La reforma es necesaria, pero debe gestionarse con cuidado para evitar el caos. Implementaremos reformas controladas y constantes que fortalezcan nuestras estructuras estatales y mejoren la vida del pueblo iraní sin arriesgarse a la inestabilidad."
 PER_neither_principalist_nor_reformist: "Ni principista ni reformista"
 PER_neither_principalist_nor_reformist_desc: "No encajamos perfectamente en las categorías ideológicas. Nos centramos exclusivamente en lo que funciona para Irán: políticas pragmáticas que trascienden las divisiones políticas obsoletas."
 PER_economic_vanguard: "Una vanguardia económica"
 PER_economic_vanguard_desc: "Nuestras políticas económicas estarán a la vanguardia del progreso nacional. Priorizaremos la innovación, la infraestructura y el crecimiento industrial para posicionar a Irán como un líder económico regional."
 PER_stability_through_force: "Estabilidad a través de la fuerza"
 PER_stability_through_force_desc: "Una nación fuerte requiere el mantenimiento del orden. Utilizaremos la fuerza necesaria para garantizar la estabilidad, protegiendo a Irán de amenazas externas e internas y garantizando un progreso constante."
 PER_influence_among_the_pasdars: "Influencia entre los Pasdaran"
 PER_influence_among_the_pasdars_desc: "Los Pasdaran siempre han sido un pilar de la defensa de Irán. Trabajaremos estrechamente con ellos para garantizar su lealtad a la causa nacional y contribuir a la estabilidad y el crecimiento del país."
 PER_state_corporatism: "Corporativismo de Estado"
 PER_state_corporatism_desc: "La participación del Estado en industrias clave es vital para la prosperidad de nuestra nación. Al adoptar el corporativismo estatal, garantizaremos que nuestros sectores económicos se alineen con los intereses nacionales, evitando las ineficiencias de la privatización y los peligros de la influencia extranjera descontrolada."
 PER_turning_a_blind_eye: "Hacer la vista gorda"
 PER_turning_a_blind_eye_desc: "A veces, es necesario pasar por alto ciertos detalles en favor del panorama general. Debemos centrarnos en la estabilidad a largo plazo de la nación, incluso si eso implica ignorar algunos asuntos menores y menos importantes."
 PER_militarize_economy: "Militarizar la economía"
 PER_militarize_economy_desc: "Una economía fuerte es una economía militarizada. Nos centraremos en la integración de los sectores militar e industrial para garantizar la resiliencia económica y la seguridad de Irán, aprovechando los recursos estatales para el desarrollo nacional estratégico."
 PER_ghalibaf_doctrine: "La Doctrina Ghalibaf"
 PER_ghalibaf_doctrine_desc: "La Doctrina Ghalibaf se fundamenta en la educación, la innovación tecnológica y la gobernanza pragmática. Nos centraremos en preparar a las futuras generaciones para liderar, a la vez que creamos un gobierno que trabaje con eficacia y transparencia para todos los iraníes."
 PER_modernize_police_force: "'Modernizar' la fuerza policial"
 PER_modernize_police_force_desc: "§Y'.¡Pero hace ruidos de coches de carreras!'§!\nEs hora de llevar a la policía a la era moderna. Lo modernizaremos con tecnología de vanguardia, aunque algunos pueden decir que los autos nuevos BMW y Mercedes brillantes son sólo para aumentar la moral entre las fuerzas."
 PER_unified_vision: "Una visión unificada"
 PER_unified_vision_desc: "El futuro de Irán requiere una visión única y coherente. Esta visión alineará a todos los sectores del gobierno y la sociedad hacia un objetivo común: prosperidad económica, unidad nacional e influencia regional."
 PER_medias_under_control: "Medios bajo control"
 PER_medias_under_control_desc: "Los medios de comunicación deben servir al interés nacional. Los controlaremos, garantizando que todos los medios trabajen en consonancia con los objetivos del Estado, fomentando la unidad y una narrativa cohesionada."
 PER_the_hidden_budget: "El presupuesto oculto"
 PER_the_hidden_budget_desc: "La transparencia es clave, pero hay asuntos de seguridad nacional y estabilidad económica que requieren discreción. Nos aseguraremos de que nuestro presupuesto se asigne eficientemente, manteniendo ciertos aspectos ocultos por razones estratégicas."
 PER_curb_accademic_dissent: "Frenar la disidencia académica"
 PER_curb_accademic_dissent_desc: "Una nación unificada necesita un pensamiento unificado. Debemos frenar la disidencia académica que perturba la agenda nacional, garantizando que la élite intelectual de Irán trabaje en armonía con nuestra visión de futuro."
 PER_ahmadinejads_opportunity: "La oportunidad de Ahmadineyad"
 PER_ahmadinejads_opportunity_desc: "Surge una oportunidad única para redefinir el futuro de Irán, centrándose en las necesidades del pueblo y en el resurgimiento del orgullo nacional. Esta visión enfatiza tanto el progreso espiritual como el material, trazando un nuevo camino para el país."
 PER_naft_ro_sofreh: "Aceite sobre la tela"
 PER_naft_ro_sofreh_desc: "Se dará prioridad al acceso al gas para todos los iraníes, garantizando que cada ciudadano, independientemente de su condición, pueda beneficiarse de los recursos naturales del país. Esta política promoverá la igualdad y reducirá las disparidades en el sector energético."
 PER_guardians_of_the_future: "Guardianes del futuro"
 PER_guardians_of_the_future_desc: "Es necesario reagrupar a los remanentes de la Guardia Revolucionaria Islámica para formar una nueva fuerza que trabaje para establecer un estado seguro, libre de la influencia del Ejército y de los manifestantes."
 PER_family_protection_bill: "Proyecto de ley de protección familiar"
 PER_family_protection_bill_desc: "El proyecto de ley de protección familiar busca fortalecer el tejido social mediante la promoción de políticas que apoyen a las familias iraníes. Esta iniciativa se centrará en brindar mayor protección y recursos a las unidades familiares en todo el país."
 PER_price_control_on_essentials: "Control de precios en productos básicos"
 PER_price_control_on_essentials_desc: "Se introducirán controles de precios para los bienes esenciales con el fin de garantizar que todos los ciudadanos puedan costear las necesidades básicas de la vida, protegiendo así a la población iraní de la inflación y las presiones económicas externas."
 PER_spiritual_consolidation: "Consolidación espiritual"
 PER_spiritual_consolidation_desc: "La consolidación espiritual dará prioridad a la unidad y la renovación basadas en la fe, alineando a la nación bajo los mismos valores morales y religiosos para fortalecer la cohesión social."
 PER_ditch_radical_ideal: "Abandonar los ideales radicales"
 PER_ditch_radical_ideal_desc: "Se adoptará un enfoque más pragmático, alejándose de los ideales radicales y centrándose en políticas que beneficien el desarrollo, la estabilidad y el crecimiento a largo plazo de la nación."
 PER_embrace_the_current: "Abrazar la actualidad"
 PER_embrace_the_current_desc: "Aceptar la tendencia a la desviación permitirá una mayor flexibilidad ante los desafíos, adaptando las políticas para que sigan siendo eficaces y relevantes en un mundo en constante cambio."
 PER_between_capitalism_and_socialism: "Entre el capitalismo y el socialismo"
 PER_between_capitalism_and_socialism_desc: "Ahmadineyad siempre ha sido inconstante en lo que respecta a su postura económica; ha llegado el momento de tomar partido."
 PER_friends_in_high_places: "Amigos en las altas esferas"
 PER_friends_in_high_places_desc: "Se cultivarán relaciones estratégicas con figuras influyentes a nivel mundial, fomentando alianzas que beneficiarán los intereses políticos, económicos y de seguridad de Irán."
 PER_more_the_merrier: "Cuantos más, mejor"
 PER_more_the_merrier_desc: "El crecimiento demográfico se fomentará mediante políticas de apoyo, garantizando que la fuerza laboral de Irán se mantenga sólida y que el potencial del país continúe expandiéndose."
 PER_subsidies_for_food_and_fuel: "Subsidios para alimentos y combustible"
 PER_subsidies_for_food_and_fuel_desc: "Se proporcionarán subsidios para artículos esenciales como alimentos y combustible, garantizando el bienestar de todos los ciudadanos y evitando dificultades en tiempos de crisis económica."
 PER_redefining_the_national_enemy: "Redefiniendo al enemigo nacional"
 PER_redefining_the_national_enemy_desc: "Se redefinirá el concepto de enemigo nacional, centrándose en las amenazas externas que buscan desestabilizar Irán, al tiempo que se promueve la unidad y la fortaleza entre el pueblo iraní."
 PER_mahmoudenomics: "Mahmoudnomía"
 PER_mahmoudenomics_desc: "El modelo económico se centrará en la autosuficiencia, con políticas destinadas a reducir la dependencia de las potencias extranjeras y garantizar que la riqueza de Irán beneficie a su pueblo."
 PER_oath_under_pressure: "Un juramento bajo presión"
 PER_oath_under_pressure_desc: "Se prestará juramento solemne de defender los intereses del pueblo, comprometiéndose a mejorar la nación incluso bajo presiones externas e internas."
 PER_shadow_arm: "El brazo de la sombra"
 PER_shadow_arm_desc: "Irán ampliará su influencia en la región a través de medios encubiertos y estratégicos, garantizando la protección de los intereses del país y el fortalecimiento de su posición en el escenario mundial."
 PER_money_well_spent: "Dinero bien gastado"
 PER_money_well_spent_desc: "Los recursos financieros se gastarán estratégicamente en fortalecer el aparato militar y de seguridad de Irán, garantizando que el país esté preparado para defender sus intereses tanto a nivel regional como global."
 PER_one_nation_one_religion_one_order: "Una nación, una religión, una orden"
 PER_one_nation_one_religion_one_order_desc: "Irán es una sola tierra, un solo pueblo y una sola religión. Una nación que cuenta con el apoyo de su pueblo puede lograr cosas que nadie más podría; la unidad debe estar por encima de todo."
 PER_mashaeis_approach: "El enfoque de Mashaí"
 PER_mashaeis_approach_desc: "Mashaí busca establecer una nueva dirección para Irán, una que sea independiente de las influencias religiosas y centrada en un enfoque más moderno y secular de la gobernanza y la sociedad."
 PER_redefining_iranian_nationalism: "Redefiniendo el nacionalismo iraní"
 PER_redefining_iranian_nationalism_desc: "Redefiniremos el nacionalismo iraní para priorizar la fuerza y ​​la unidad de la nación por encima de las divisiones religiosas, fomentando una identidad moderna que una al pueblo bajo una causa iraní común."
 PER_shaking_the_foundations: "Sacudiendo los cimientos"
 PER_shaking_the_foundations_desc: "La influencia del clero ha frenado nuestro progreso durante demasiado tiempo. Es hora de sacudir los cimientos de su poder, disminuyendo su control sobre el Estado y permitiendo el surgimiento de un gobierno más secular."
 PER_architect_of_a_new_iran: "Arquitecto de un nuevo Irán"
 PER_architect_of_a_new_iran_desc: "Mashaí se posiciona como el arquitecto de un nuevo Irán, que romperá con las viejas estructuras y abrazará la modernización, el secularismo y la independencia económica."
 PER_dissolve_clerical_influence: "Disolver la influencia clerical"
 PER_dissolve_clerical_influence_desc: "Tomaremos medidas audaces para reducir el poder del clero, eliminando su influencia en los asuntos políticos y permitiendo el surgimiento de un estado más secular y progresista."
 PER_dynamic_approach: "Un enfoque dinámico"
 PER_dynamic_approach_desc: "El enfoque de Mashaí no es estático; se trata de una estrategia dinámica y en constante evolución, centrada en adaptarse a los cambios globales y en posicionar a Irán como una potencia líder en la región y en el mundo."
 PER_dissolve_the_remnants: "Disolver los restos"
 PER_dissolve_the_remnants_desc: "Los remanentes de la Guardia Revolucionaria Islámica y de la República Islámica deben ser desmantelados. Sus métodos de gobierno obsoletos y sus vínculos con el antiguo régimen se eliminarán gradualmente en favor de un sistema de seguridad y gobierno nuevo y más eficiente."
 PER_old_habits: "Viejos hábitos"
 PER_old_habits_desc: "La corrupción y las viejas costumbres han asolado Irán durante demasiado tiempo. Mashaí abordará estos problemas profundamente arraigados, garantizando que el futuro del país esté libre de las cargas de la mala gestión del pasado."
 PER_direct_relations_with_god: "Relaciones directas con Dios"
 PER_direct_relations_with_god_desc: "Creemos en establecer una relación personal y directa con lo divino, prescindiendo de clérigos e intermediarios. Esto garantizará que nuestra fe se mantenga pura y acorde con las necesidades de la nación."
 PER_friend_of_all: "Amigo de todos"
 PER_friend_of_all_desc: "La política exterior de Mashaí se basa en forjar lazos de amistad con todas las naciones, priorizando la diplomacia y la cooperación sobre el conflicto y la división."
 PER_deal_with_critics: "Cómo lidiar con los críticos"
 PER_deal_with_critics_desc: "Debemos adoptar una postura firme contra quienes critican nuestras políticas. Sin embargo, debemos hacerlo de forma inteligente y estratégica, garantizando que la disidencia no desestabilice el país."
 PER_except_israel: "..Excepto Israel"
 PER_except_israel_desc: "Si bien Mashaí busca la paz y la cooperación con muchos países, Israel sigue siendo una excepción debido a diferencias ideológicas. Nuestra postura hacia Israel sigue siendo de oposición y no reconocimiento."
 PER_even_israel: "..Incluso Israel"
 PER_even_israel_desc: "Con espíritu pragmático, Mashaí está abierto al diálogo incluso con Israel. La idea de paz y diplomacia puede trascender las hostilidades tradicionales, y las futuras negociaciones podrían ser posibles."
 PER_appoint_baghaei: "Nombrar a Baghaei"
 PER_appoint_baghaei_desc: "Baghaei, conocido por su lealtad y sus habilidades administrativas, será designado para supervisar la seguridad nacional. Su liderazgo será crucial para garantizar la estabilidad del Estado durante estos tiempos de cambio."
 PER_no_islam_without_iran: "No hay Islam sin Irán"
 PER_no_islam_without_iran_desc: "Estableceremos una escuela iraní del islam única, que combine los valores religiosos con el orgullo nacional. Esto garantizará que el futuro de Irán permanezca intrínsecamente ligado a su fe, pero libre de influencias extranjeras."
 PER_rebuild_vaja: "Reconstruir VAJA"
 PER_rebuild_vaja_desc: "El VAJA (Ministerio de Cultura y Orientación Islámica) será reestructurado para apoyar una agenda cultural secular centrada en Irán. Ya no estará sujeta a las ideologías de la República Islámica, sino que promoverá una identidad cultural progresista e inclusiva."
 PER_nation_before_islam: "La nación antes del Islam"
 PER_nation_before_islam_desc: "La identidad nacional de Irán debe prevalecer sobre cualquier ideología religiosa. Si bien el islam seguirá siendo un elemento central de la cultura nacional, nuestra nacionalidad prevalecerá en todos los asuntos de gobierno y política."
 PER_end_of_an_era: "Fin de una era"
 PER_end_of_an_era_desc: "La era del islam político en Irán está llegando a su fin. Esto marca el comienzo de una nueva era centrada en el secularismo, el nacionalismo y la participación global."
 PER_new_security_concerns: "Nuevas preocupaciones de seguridad"
 PER_new_security_concerns_desc: "A medida que evolucionan los conflictos globales, Irán debe adaptar su estrategia de seguridad para hacer frente a las nuevas amenazas emergentes. Modernizaremos nuestras fuerzas armadas y servicios de inteligencia para que sean más eficaces y proactivos al afrontar estos nuevos desafíos."
 PER_secularization_of_the_state: "Secularización del Estado"
 PER_secularization_of_the_state_desc: "Ha llegado el momento de secularizar el Estado, garantizando que el poder político no esté influenciado por las autoridades religiosas. Esto allanará el camino hacia un Irán más equilibrado y moderno."
 PER_globalize_ideology_of_iran: "Globalizar la ideología de Irán"
 PER_globalize_ideology_of_iran_desc: "La ideología de Irán, basada en la independencia, la autosuficiencia y el nacionalismo, se compartirá a nivel mundial. Inspiraremos a otras naciones a seguir el ejemplo de Irán, rechazando la influencia extranjera y priorizando el desarrollo nacional."
 PER_blessings_of_the_divine: "Bendiciones de lo Divino"
 PER_blessings_of_the_divine_desc: "Creemos que las bendiciones divinas nos acompañan al emprender este nuevo camino. Con fe en nuestra causa, la guía divina y la fortaleza del pueblo iraní, alcanzaremos la grandeza."
 PER_rally_the_basij: "Reunir a la Basich"
 PER_rally_the_basij_desc: "Ha llegado el momento de reunir a los antiguos miembros de Basich en todo el país bajo una nueva bandera: la de Ahmadineyad."
 PER_mobilize_ansar_hezbollah: "Movilizar Ansar-e Hezbollah"
 PER_mobilize_ansar_hezbollah_desc: "Ansar-e Hezbollah podría ser un recurso útil para reprimir las protestas y la oposición al gobierno. Sin embargo, su uso no se limitará a asuntos internos; sin duda, recurriremos a ellos en el campo de batalla cuando sea necesario."
 PER_awaiting_the_return: "Esperando el regreso"
 PER_awaiting_the_return_desc: "Esperamos el regreso del Imam Oculto, cuya reaparición traerá justicia y paz al mundo. Mientras tanto, continuamos nuestros esfuerzos para construir un Irán fuerte y unido, preparándonos para el regreso del Imán y el cumplimiento del destino de nuestra nación."
 PER_marzban: "Encontrar un Marzban"
 PER_marzban_desc: "Un Marzban, un líder militar capaz de velar por la estabilidad regional, es fundamental para nuestros esfuerzos. Identificaremos y nombraremos a los candidatos idóneos para reforzar nuestra gobernanza militar en todo el país."
 PER_counter_terror_initiative: "Iniciativa contra el terrorismo"
 PER_counter_terror_initiative_desc: "Las amenazas terroristas siguen asolando al país. Pondremos en marcha una iniciativa integral contra el terrorismo, liderada por el Artesh, para eliminar a estos grupos y garantizar la seguridad de nuestra población."
 PER_drone_force: "Fuerza de Drones de Artesh"
 PER_drone_force_desc: "La guerra moderna requiere tecnología de vanguardia. Crearemos una fuerza de drones para proporcionar vigilancia, capacidad de ataque y reconocimiento para nuestras operaciones militares."
 PER_maintain_military_structure: "Mantener una estructura militar"
 PER_maintain_military_structure_desc: "Preservaremos la estructura militar actual para garantizar que el control de Artesh siga siendo fuerte y unificado. El liderazgo civil quedará marginado y los militares gobernarán con autoridad absoluta."
 PER_outposts_as_government_institutions: "Puestos avanzados como instituciones gubernamentales"
 PER_outposts_as_government_institutions_desc: "Estableceremos puestos militares avanzados en todo el país, convirtiéndolos en centros vitales de gobierno. Estos puestos servirán como columna vertebral del control de Artesh."
 PER_politicization_of_the_artesh: "Politización del Artesh"
 PER_politicization_of_the_artesh_desc: "El Artesh dejará de ser apolítico. Crearemos un nuevo partido político para garantizar que nuestros valores militares estén representados en todos los asuntos gubernamentales y extender nuestra influencia por todo el país."
 PER_reassert_majles_authority: "Reafirmar la autoridad del Majles"
 PER_reassert_majles_authority_desc: "El Majlis ha sido fuente de inestabilidad durante demasiado tiempo. Bajo el régimen militar, reafirmaremos su autoridad para apoyar la gobernanza del Artesh y garantizar que sus políticas se implementen sin resistencia."
 PER_supply_depots: "Depósitos de suministros"
 PER_supply_depots_desc: "Un ejército bien abastecido es esencial para mantener el control. Estableceremos y reforzaremos depósitos de suministros en todo el país para apoyar a nuestras fuerzas armadas y garantizar nuestra preparación."
 PER_separate_religion: "Separar la religión del Artesh"
 PER_separate_religion_desc: "Para mantener la fortaleza del Artesh, debemos eliminar cualquier influencia religiosa sobre las fuerzas armadas. Garantizaremos que los asuntos religiosos y militares permanezcan separados para evitar divisiones ideológicas."
 PER_faith_as_strength: "La fe como fortaleza"
 PER_faith_as_strength_desc: "Si bien la religión debe estar separada del ámbito militar, la fe seguirá desempeñando un papel fundamental en el fortalecimiento de la moral de nuestras fuerzas armadas. Promoveremos una unidad nacional de inspiración religiosa bajo el estandarte del Artesh."
 PER_patriotic_fervor: "Fervor patriótico"
 PER_patriotic_fervor_desc: "Cultivaremos un sentimiento de patriotismo inquebrantable en el Artesh y en el pueblo. La lealtad a la nación y a su liderazgo militar será fundamental para la estabilidad del gobierno."
 PER_an_economic_plan: "Un plan económico"
 PER_an_economic_plan_desc: "Un ejército fuerte requiere una economía fuerte. Implementaremos un plan económico diseñado para impulsar la producción militar, crear más empleos para nuestros soldados y garantizar los recursos de la nación."
 PER_the_sacred_doctrine: "La doctrina sagrada"
 PER_the_sacred_doctrine_desc: "El Artesh defenderá una doctrina que enfatiza la unidad nacional, el poderío militar y la lealtad absoluta al Estado. Esta doctrina guiará nuestra gobernanza e inspirará al pueblo a apoyar nuestra causa."
 PER_uplifting_bazaars: "Revitalizar los Bazaars"
 PER_uplifting_bazaars_desc: "Los bazaars representan el corazón de la economía de nuestra nación. Apoyaremos el desarrollo de estos mercados, garantizando que funcionen como pilares de estabilidad bajo nuestro gobierno militar."
 PER_opening_iran: "Apertura de Irán"
 PER_opening_iran_desc: "Ahora que Artesh está al mando, abriremos las puertas de Irán a nuevas oportunidades. Se fortalecerán el comercio y la diplomacia, pero bajo estricta supervisión militar, garantizando así que el país permanezca bajo nuestra atenta vigilancia."
 PER_redirect_money_from_proxies: "Redirigir fondos de antiguos proxies"
 PER_redirect_money_from_proxies_desc: "Llevamos mucho tiempo financiando guerras indirectas en otros países. Ahora, redirigiremos esos fondos a nuestra infraestructura militar, garantizando que cada rial sirva para reforzar el dominio del Ejército en Irán."
 PER_the_shield_of_iran: "Héroes de [PER.GetFlag] Irán"
 PER_steadfast_artillery: "Artillería firme"
 PER_the_MEK: "Organización de los Muyahidines del Pueblo de Irán"
 PER_the_MEK_desc: "A menudo llamados MEK, o Mojahedin-e Khalq, pero conocidos formalmente como la Organización de los Muyahidines del Pueblo de Irán (OPMI), llevan mucho tiempo intentando derrocar a nuestro gobierno. Sus esfuerzos no han disminuido, sino que se han intensificado con el tiempo. Y no cesarán hasta que se les ponga fin de una vez por todas.\n§W--------------§!\nEste modificador será §RRemovido§! si el §HMEK tiene el control§! del gobierno, o hayas completado la decisión §H'Asesinar a los Rajavi'§!."
 PER_neutral_political_scene: "Orientación política no alineada"
 PER_neutral_political_scene_desc: "Nuestra nación ha experimentado tanto la explotación por parte de potencias extranjeras como la ayuda recibida. En consecuencia, nuestras inclinaciones políticas más recientes no se han orientado ni hacia el Este ni hacia el Oeste, ni hacia la izquierda ni hacia la derecha.\n§W--------------§!\nEste modificador será §RRemovido§! si §WNeutralidad§! ya no es la postura del gobierno."
 PER_israel_etelaat_desc: "La base de datos israelí nos permitirá estar al tanto de las actividades sionistas."
 PER_camp_ashraf: "El legado del campamento Ashraf"
 PER_israeli_trade_agreement: "Acuerdo comercial israelí"
 PER_help_with_taliban: "La lucha contra los talibanes"
 PER_gulf_supremacy_idea: "Supremacía en el Golfo"
 PER_islamic_golden_age: "La Edad de Oro del Islam"
 PER_artesh_drone_force: "Fuerza de Drones de Artesh"
 PER_mahmouds_breeding_grounds: "Los criaderos de Mahmoud"
 PER_iran_on_the_move_idea: "Irán en movimiento"
 PER_iran_on_the_move_idea_desc: "'La vida pasa muy rápido. Si no te detienes a mirar a tu alrededor de vez en cuando, podrías perdértela'"
 PER_highly_entrenched_societal_norms: "Estilo de vida muy arraigado"
 PER_highly_entrenched_societal_norms_desc: "Durante siglos el camino de la vida en Irán no ha cambiado. A partir de la reforma de Irán a manos de la dinastía Safavid en los años 1500, los militares, chiítas clérigos y bazares han ejercido una influencia significativa sobre la dirección política de la nación. A pesar de muchos intentos de derribar a estos tres gigantes de la sociedad iraní, se mantienen más fuertes que nunca, con los bazares y el clérigo chiíta poniendo fin a 2.500 años de dominio iraní imperial en 1979."
 PER_caspian_defenses_modifier: "Defensas del Caspio"
 PER_caspian_defenses_modifier_desc: "Aprovechando el terreno de la región de Tabaristán, podemos convertir la costa del Caspio en un auténtico infierno para cualquier posible invasor."
 PER_diplomatic_neutrality_idea: "Neutralidad diplomática"
 PER_striking_satan: "Golpeando a Satán"
 PER_striking_satan_desc: "El Gran Satán será puesto de rodillas, de una forma u otra."
 PER_integration_of_islamic_lands: "Integración de las tierras islámicas"
 PER_integration_of_islamic_lands_desc: "Tras nuestra unificación con otros países musulmanes, estamos teniendo problemas para llevar a todos los pueblos a través de estas diversas tierras."
 PER_islamic_republic_of: "República Islámica de [THIS.GetName]"
 PER_islamic_republic_of_desc: "Somos una República Islámica y lo seremos para siempre. Nuestra nación no se somete a nadie más que a Dios."
 PER_azeri_separatism: "[SAZ.GetFlag] Separatismo del sur de Azerbaiyán"
 PER_azeri_separatism_desc: "Aunque la gran mayoría de los habitantes de Azerbaiyán se consideran iraníes, existen focos de elementos separatistas que buscan establecer una nación independiente o lograr la unificación con sus homólogos del norte. Sin embargo, quienes desean dividir nuestra nación están fomentando el sentimiento separatista, y debemos actuar en consecuencia.\n§W--------------§!\nEste modificador de estado se §Reliminará§! si la productividad es de §H1000§! en este estado."
 PER_baloch_separatism: "[BLC.GetFlag] Separatismo baluchi"
 PER_baloch_separatism_desc: "Aunque Baluchistán ha formado parte de Irán durante siglos, décadas de abandono lo han hecho vulnerable a la influencia extranjera contra nuestro estado. Tras muchas décadas de abandono y vigilancia policial, la región se ha llenado de armas y contrabando prohibido, creando así las condiciones ideales para la resistencia contra cualquiera.\n§W--------------§!\nEste modificador de estado se §Reliminará§! si la productividad es de §H1000§! en este estado."
 PER_kurd_separatism: "[KUR.GetFlag] Separatismo Kurdo"
 PER_kurd_separatism_desc: "Aunque son un pueblo iraní, los kurdos han buscado durante mucho tiempo su propio estado en la región. Tras lograr cierto éxito a finales de la década de 1940, el efímero estado kurdo fue rápidamente invadido y reintegrado a Irán. Desde entonces, se han realizado varios intentos para separar las regiones kurdas de Irán, y varios movimientos separatistas están activos.\n§W--------------§!\nEste modificador de estado se §Reliminará§! si la productividad es de §H1000§! en este estado."
 PER_ahvaz_separatism: "[ARA.GetFlag] Separatismo de Juzestán"
 PER_ahvaz_separatism_desc: "Tras las invasiones árabes del Irán, se perdió la región de Khuzestan y muchos árabes étnicos comenzaron a poblar la región en el suroeste de la nación. Aunque la mayoría de los khuzestanis son personas que hablan Farsi, y son étnicamente iraníes, todavía hay un gran número de árabes iraníes que a menudo están expuestos a influencia extranjera y ven la necesidad de proteger su propio estado.\n§W--------------§!\nEste Modificador de Estado será §RRemovido§! si la productividad es §H1000§! en este estado."
 PER_red_sea_bleeds: "El Mar Rojo sangra"
 PER_cento_sit: "CENTO"
 PER_basij_construction_effort: "Esfuerzo de construcción de Basich"
 PER_basij_war_effort: "Esfuerzo de guerra de Basich"
 PER_basij_education_effort: "Esfuerzo educativo de Basich"
 PER_IRGC_modifier: "Cuerpo de Guardia Revolucionaria Islámica"
 PER_IRGC_modifier_desc: "El Cuerpo de Guardia Revolucionaria Islámica fue fundado para proteger a la República Islámica de ser derrocado. Sus objetivos se han desplazado a lo largo de los años, y se está centrando más en sus objetivos extranjeros. El IRGC ha crecido para ser más capaz que el ejército convencional de Irán, el Artesh, y reciben la mayor parte del presupuesto militar como resultado.\n§W--------------§!\nEste espíritu nacional será §RRemovido§! si la República Islámica colapsa."
 PER_palestinian_frontism_idea: "La Unidad de Operaciones Extranjeras de Abu Jihad"
 PER_palestinian_frontism_idea_desc: "La Unidad de Operaciones Extranjeras de Abu Jihad, fue nombrada por Khalil al-Wazir y es una unidad de operaciones dirigidas conjuntamente por militantes palestinos y agentes de inteligencia iraní que supervisan el contrabando y la producción de artefactos explosivos improvisados y la construcción de redes de túneles. Está controlada principalmente por una rama iraní de la Fuerza de Cláusulas del IRGC."
 PER_economy_modifier: "Estado de la economía [PER.GetAdjective]"
 PER_economy_modifier_desc: "La economía de Irán tiene un gran potencial, esperando ser tapped. Rico con recursos naturales, depende del gobierno gobernante de Irán gestionar la economía de tal manera que maximice su capacidad para mejorar la vida de su pueblo. Este modificador representa el estado actual de la economía iraní\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!. Sin embargo, los modificadores podrían gradualmente §GMejorar§! para reflejar el estado de la economía nacional ya que se completan más enfoques, decisiones y eventos."
 PER_artesh_modifier: "Estado de las Fuerzas Armadas [PER.GetAdjective]"
 PER_artesh_modifier_desc: "Históricamente Irán ha estado a la vanguardia del avance militarista y de la innovación. Sin embargo, en los últimos dos siglos, Irán no ha podido mantenerse al corriente de sus contrapartes mundiales. Si los gobernantes de Irán son capaces de restaurar la competencia en el ejército una vez más, Irán puede reclamar su trono perdido por mucho tiempo.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!. Sin embargo, los modificadores podrían gradualmente §GMejorar§! para reflejar el estado del ejército de la nación como más focos, decisiones y eventos se completan."
 PER_political_modifier: "Estado de la nación [PER.GetAdjective]"
 PER_political_modifier_desc: "Una nación antigua, con miles de años de historia respaldando su legitimidad hoy. Irán es una nación con muchos pueblos, y ha visto imperios y gobernantes venir e ir. Irán no es extraño a los problemas domésticos causados por la incompetencia de sus gobernantes. Un Irán libre de constante agitación no tendría nada más que un buen futuro para esperar.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!. Sin embargo, los modificadores podrían gradualmente §GMejorar§! para reflejar el estado de la situación política nacional ya que se completan más enfoques, decisiones y eventos."
 PER_prepare_for_abu_musa: "Defensores de Abu Musa"
 PER_IAIO_spirit: "Organización de Industrias de Aviación de Irán"
 PER_election_events.71: "14° Elección Presidencial"
 PER_election_events.71.t: "14° Elección Presidencial"
 PER_election_events.71.d: "Tras la coordinación entre los partidos y las personas influyentes del gobierno, se ha completado y puesto en marcha la coordinación necesaria para determinar los candidatos y confirmar sus cualificaciones por el Consejo de Guardianes. Parece que el ambiente de la sociedad también está entusiasmado con las elecciones.\nAdemás, en comparación con las elecciones anteriores, las diferencias entre los partidos principalistas y reformistas han disminuido y es en la medida en que los comicios se celebrarán de forma pacífica.\n\nLa medida es el voto de la nación."
 PER_election_events.71.a: "Veamos qué pasa esta vez."
 PER_election_events.81: "¡Yazdi ganó!"
 PER_election_events.81.t: "¡Yazdi ganó!"
 PER_election_events.81.d: "Hoy es el día de las elecciones, y parece que después de una batalla dura entre los candidatos Yazdi y Tavakoli, Yazdi ha surgido victorioso y liderará a Irán como el nuevo presidente electo de Irán\n¡Es una clara señal de que los reformistas han ganado!\n\nLa medida es el voto de la nación."
 PER_election_events.81.a: "De acuerdo"
 PER_election_events.101.t: "¡Kavakebian ganó!"
 PER_election_events.101.d: "Hoy es día de elecciones, el día en que los ganadores serán anunciados.\n¡El ganador de las elecciones iraníes es Kavakebian!\n¡Y el perdedor es Ahmadinejad! ¡Esta es una victoria clara para los reformistas!\n\nLa medida es el voto de la nación."
 PER_election_events.101.a: "De acuerdo"
 PER_election_events.121.t: "¡Karrubí ganó!"
 PER_election_events.121.d: "¡Hoy es día de elecciones, y el candidato elegido no es otro que Karroubi!\nEnhorabuena por derrotar a su oponente Ahmadinejad.\n¡Este es un gran momento para los reformistas ya que son los ganadores claros!\n\nLa medida es el voto de la nación."
 PER_election_events.121.a: "De acuerdo"
 PER_election_events.151.t: "¡Ganó Mashaí!"
 PER_election_events.151.d: "El día de las elecciones está aquí, trae consigo el vencedor de sus ensayos: Mashaei!\nFelicitaciones a Rouhani y Rezaee que tuvieron que pasar por el dolor de perder.\n¡Es una gran victoria para los Principados!\n\nLa medida es el voto de la nación."
 PER_election_events.151.a: "De acuerdo"
 PER_election_events.181: "¡Ganó Bayadi!"
 PER_election_events.181.t: "¡Ganó Bayadi!"
 PER_election_events.181.d: "Hoy es día de elecciones, un día en que la gente tiene que elegir quién dirige y representa a su nación, ¡y el hombre que ganó el corazón de la gente es Bayadi!\nUna derrota muy inesperada y triste para Rouhani, ya que no volverá a tener una segunda oportunidad.\n¡Esta es una impresionante victoria para los Principados!\n\nLa medida es el voto de la nación."
 PER_election_events.181.a: "De acuerdo"
 PER_election_events.191: "¡Ganó Haghshenas!"
 PER_election_events.191.t: "¡Ganó Haghshenas!"
 PER_election_events.191.d: "Hoy es el día de las elecciones, un día en que los políticos calientes son elegidos para tener la responsabilidad de dirigir una nación. ¡El ganador de hoy es Haghshenas!\nUna tormenta de Raisi sorprendida y legítimamente enojada fuera del Parlamento.\n¡Esta es una victoria fundamental para los reformistas!\n\nLa medida es el voto de la nación."
 PER_election_events.191.a: "De acuerdo"
 PER_election_events.201: "¡Ganó Raisi!"
 PER_election_events.201.t: "¡Ganó Raisi!"
 PER_election_events.201.d: "Hoy es el día de las elecciones, un día en que la gente vota por quién quiere representarlos y dirigirlos. ¡Nuestro vencedor destinoso es Raisi!\nPezeshkian no se ve sorprendido y felicita a nuestro ganador.\n¡Es una gran victoria para los Principados!\n\nLa medida es el voto de la nación."
 PER_election_events.201.a: "De acuerdo"
 PER_election_events.202: "¡Pezeshkian ganó!"
 PER_election_events.202.t: "¡Pezeshkian ganó!"
 PER_election_events.202.d: "Hoy es el día de las elecciones, un día en que la gente vota por quién quiere representarlos y dirigirlos. ¡Nuestro vencedor destinoso es Pezeshkian!\nRaisi se sintió como debía haber ganado, sin embargo sigue felicitando a nuestro ganador.\n¡Esta es una gran victoria para los reformistas!\n\nLa medida es el voto de la nación."
 PER_election_events.202.a: "De acuerdo"
 iranian_events.13.t: "Irán quiere que paguemos sus indemnizaciones de guerra"
 iranian_events.13.d: "Nuestra guerra con Irán duró desde 1980 hasta 1988. Comenzó con la invasión iraquí de Irán y duró casi ocho años, hasta que ambas partes aceptaron la Resolución 598 del Consejo de Seguridad de las Naciones Unidas. Un grupo de expertos fue enviado a Irán para investigar la cuestión de la reconstrucción y determinar los daños e informó al Consejo de Seguridad. Anunciaron daños directos por 99 mil millones de dólares y daños indirectos por 150 mil millones de dólares, sumando un total de 249 mil millones de dólares. Todavía no hemos pagado este dinero, pero ahora nos piden que les paguemos."
 iranian_events.13.o1: "Podemos pagar esto."
 iranian_events.13.o2: "No les pagamos nada."
 iranian_events.8.t: "Explosión en base turco-iraquí"
 iranian_events.8.d: "Nuestras bases militares en Irak fueron objeto de un ataque coordinado y sufrimos muchas bajas. Nadie ha reivindicado aún la autoría de este ataque, pero sabemos que fue Irán..."
 iranian_events.8.o1: "Triste"
 iranian_events.9.o1: "Interesante"
 iranian_events.10.o1: "Interesante"
 iranian_events.11.t: "Tuberías de gas de Bakú reventadas"
 iranian_events.11.d: "Se ha producido un sabotaje en los gasoductos de Bakú, en Azerbaiyán, que ha afectado nuestro comercio con otros países y ha perjudicado nuestra economía. Nadie se ha atribuido oficialmente la responsabilidad de este ataque."
 iranian_events.11.o1: "Interesante"
 iranian_events.14.t: "Irak se negó a pagar la compensación de guerra"
 iranian_events.14.d: "El gobierno iraquí decidió no pagarnos la compensación de guerra después de que se lo solicitamos. Esta es una razón para que los ataquemos."
 iranian_events.14.o1: "¡Está bien entonces!"
 iranian_events.15.t: "Irak decidió pagar una indemnización por la guerra"
 iranian_events.15.d: "El gobierno iraquí decidió pagar nuestra compensación de guerra después de pedirles que lo hicieran. Esto perjudicará su economía y disminuirá nuestra influencia en ellos, pero todavía necesitamos ese dinero."
 iranian_events.15.o1: "Bueno"
 iranian_events.12.t: "El Tercer Plan de Desarrollo"
 iranian_events.12.d: "Para corregir, mejorar y reformar el sistema administrativo en las distintas áreas de las organizaciones utilizaremos este plan. Pero, ¿en qué aspecto deberíamos centrarnos más?"
 iranian_events.12.o1: "Centrarse en las organizaciones industriales"
 iranian_events.12.o2: "Centrarse en las organizaciones científicas"
 iranian_events.12.o3: "Centrarse en las organizaciones militares"
 axis_of_resistance_events.8.t: "Irán proyecta su influencia en Siria"
 axis_of_resistance_events.8.d: "[PER.GetLeader] ha expresado un claro interés en ampliar la influencia de [PER.GetNameWithFlag] en nuestra nación. Nos guste o no, la presencia de [PER.GetNameWithFlag] en nuestra puerta es innegable. Debemos decidir si contrarrestar su influencia o esperar a ver cuáles son realmente sus intenciones."
 axis_of_resistance_events.8.o1: "Veamos qué pasa."
 axis_of_resistance_events.8.o2: "Esto no se puede tolerar"
 axis_of_resistance_events.9.t: "Los Baazistas planean un golpe de estado"
 axis_of_resistance_events.9.d: "Nuestros informes han indicado que es posible que se esté formando un golpe de Estado Baazista como respuesta a los cambios recientes, y debemos estar preparados para ello."
 axis_of_resistance_events.9.o1: "Entendido"
 axis_of_resistance_events.12.t: "Generando Baazistas"
 axis_of_resistance_events.12.d: "Evento oculto"
 axis_of_resistance_events.12.o1: "Botón"
 axis_of_resistance_events.13.t: "Hamás toma el poder en los territorios palestinos"
 axis_of_resistance_events.13.d: "El grupo militante Hamás ha logrado hacerse con el control de tierras en los Territorios Palestinos Ocupados, expulsando a las fuerzas leales a la Autoridad Palestina tras días de duros enfrentamientos. Los combatientes de Hamás asaltaron edificios clave del gobierno, comisarías de policía y complejos militares, dejando destrozada la influencia de la Autoridad Palestina."
 axis_of_resistance_events.13.o1: "Interesante"
 axis_of_resistance_events.14.t: "La Yihad Islámica Palestina toma el poder en los Territorios Ocupados"
 axis_of_resistance_events.14.d: "El grupo militante de la Yihad Islámica Palestina (YIP) ha tomado con éxito el control de tierras dentro de los Territorios Palestinos Ocupados, expulsando a las fuerzas leales a la Autoridad Palestina después de días de feroces enfrentamientos. Los combatientes de la Yihad Islámica atacaron edificios gubernamentales clave, comisarías de policía y complejos militares, dejando destrozada la influencia de la Autoridad Palestina."
 axis_of_resistance_events.14.o1: "Interesante"
 axis_of_resistance_events.15.t: "El Frente Popular declara la liberación de los territorios palestinos"
 axis_of_resistance_events.15.d: "El grupo militante del Frente Popular para la Liberación de Palestina (FPLP) ha tomado con éxito el control de tierras dentro de los Territorios Palestinos Ocupados. Expulsando a las fuerzas leales a la Autoridad Palestina tras días de feroces enfrentamientos. Combatientes del FPLP irrumpieron en edificios gubernamentales clave, comisarías y complejos militares, destrozando la influencia de la Autoridad Palestina."
 axis_of_resistance_events.15.o1: "Interesante"
 axis_of_resistance_events.16.t: "Los Comités de Resistencia Popular toman el poder"
 axis_of_resistance_events.16.d: "El grupo militante de los Comités de Resistencia Popular (CRP) ha logrado hacerse con el control de tierras en los Territorios Palestinos Ocupados, expulsando a las fuerzas leales a la Autoridad Palestina tras días de encarnizados enfrentamientos. Los combatientes del CRP asaltaron edificios clave del gobierno, comisarías de policía y complejos militares, dejando destrozada la influencia de la Autoridad Palestina."
 axis_of_resistance_events.16.o1: "Interesante"
 axis_of_resistance_events.17.t: "Órdenes desde [PER.capital.GetCapitalVictoryPointName]"
 axis_of_resistance_events.17.d: "Las órdenes de Teherán han llegado a nuestra sede, y parece que nos están dando instrucciones para seguir dominando el Líbano en su totalidad, anexándolo. Irán afirma que hacerlo nos permitirá luchar contra los sionistas con vigor revitalizado y mayor fuerza de trabajo."
 axis_of_resistance_events.17.a: "Órdenes recibidos"
 axis_of_resistance_events.18.t: "Yemen bajo ataque"
 axis_of_resistance_events.18.d: "El Gobierno yemení está bajo ataque completo a manos de los iraníes y los houthis. Este desarrollo pone en peligro la seguridad del Mar Rojo y el Estrecho de Mandeb, lo que podría poner en riesgo el transporte marítimo mundial. Tendremos que reunir nuestras fuerzas para luchar contra la invasión iraní."
 axis_of_resistance_events.18.a: "Que Dios nos ayude"
 axis_of_resistance_events.19.t: "Yemen en crisis"
 axis_of_resistance_events.19.d: "Los disparos sonaron en la capital San'a, ya que el Comité Supremo Revolucionario respaldado por Houthi declaró una movilización general para derrocar al gobierno de [YEM.GetLeader]. Se cree generalmente que el gobierno iraní es el principal proveedor de apoyo detrás de la rebelión de Houthi. Con mucha especulación de que Teherán ha estado planeando esto durante meses, posiblemente incluso años para expandir su eje de resistencia. \n\nEl Líder Supremo ha negado cualquier participación, pero en cambio declaró que «el pueblo de Yemen quiere liberarse del Satanás imperial».El gobierno de [SAU.GetName] y otros estados del Golfo han respondido con ira general y condenación, ya que este conflicto es justo en su patio trasero y podría desestabilizar el comercio que ocurre en la región. Algunos temen que este conflicto pueda salirse del control y convertirse en un prolongado conflicto proxy entre Irán y [SAU.GetName]."
 axis_of_resistance_events.19.a: "El frágil estado se quiebra una vez más"
 axis_of_resistance_events.22.t: "Ofensiva [HOU.GetAdjective] en Saná"
 axis_of_resistance_events.22.d: "El líder [HOU.GetAdjective] [HOU.GetLeader] anunció una gran ofensiva contra la capital [YEM.GetAdjective], Saná, en una operación destinada a derrocar al asediado gobierno de [YEM.GetLeader]. El líder hutí declaró su intención de derrocar a [YEM.GetLeader] de la capital y continuar su ofensiva hacia la vital ciudad portuaria de Adén. Esto ocurre mientras [YEM.GetNameWithFlag] cae en un estado de conflicto perpetuo."
 axis_of_resistance_events.22.o1: "Una última gota"
 axis_of_resistance_events.23.t: "Insurgencia de Al-Qaeda en Yemen"
 axis_of_resistance_events.23.d: "[AQY.GetLeader] declaró hoy una ofensiva total contra el gobierno respaldado por [SAU.GetAdjective] [YEM.GetLeader]. Él reveló que AQAP (Al-Qaeda en la península árabe) se ha formado [AQY.GetNameWithFlag] como una organización paraguas, que ahora se dedica a luchar contra el régimen en [YEM.GetNameWithFlag] con el objetivo de establecer un Califato Islámico en [YEM.GetNameWithFlag].\n\nLos analistas han confirmado que Al-Qaeda y su rama de la Península Arábiga han capturado grandes ciudades en el este del Yemen y la costa sur, incluyendo Al Mukalla y Seiyun, con tan sólo bajos niveles de lucha que se extienden con facilidad como [YEM.GetNameWithFlag] no logra imponer su control en el este."
 axis_of_resistance_events.23.o1: "El conflicto en Yemen entra en una nueva etapa"
 axis_of_resistance_events.24.t: "Batalla de Adén"
 axis_of_resistance_events.24.d: "Líder del Consejo de Transición del Sur, [STC.GetLeader] ha comenzado su toma de la ciudad portuaria de Adén, con fuertes combates estallando en las calles de Adén, las fuerzas de [STC.GetLeader] han comenzado a repeler a los leales al gobierno. Con la intención de tomar el control de la ciudad y reclamar la creación de un estado soberano en el sur."
 axis_of_resistance_events.24.o1: "La guerra en Yemen da otro giro"
 axis_of_resistance_events.28.t: "Campaña de las Brigadas de la Revolución de 1920 en [IRQ.GetName]"
 axis_of_resistance_events.28.d: "[NTR.GetLeader], líder de las Brigadas Revolución [NTR.GetFlag][NTR.GetName] (1920), ha lanzado oficialmente una ofensiva en [IRQ.GetNameWithFlag] dirigida a expulsar a los adversarios extranjeros del país. En las calles de Fallujah ha surgido una intensa lucha, ya que la violencia sectaria se intensifica entre milicias chiitas, grupos jihadi y milicias locales. Las Brigadas están estrechamente vinculadas a la Asociación de Al-Dhari, JAMI y el Partido Islámico Iraquí, que se cree que son de origen de la Hermandad Musulmana. Las fuerzas de [NTR.GetLeader] están empujando a los lealistas del gobierno y a los luchadores [ISI.GetNameWithFlag], haciendo avances significativos en la obtención de posiciones clave. La situación sigue siendo inestable, ya que el conflicto en curso amenaza con sumergirse en otras partes del Iraq en una lucha más amplia por el poder."
 axis_of_resistance_events.28.o1: "La guerra en Irak toma otro giro"
 axis_of_resistance_events.30.t: "Las Brigadas de la Revolución de 1920 caen en una lucha interna"
 axis_of_resistance_events.30.d: "[NTR.GetFlag][NTR.GetName] (Brigadas de la Revolución de 1920) se han dividido en dos facciones: la Conquista Islámica y la Yihad Islámica. Conquista Islámica, que se autodenomina [HII.GetFlag][HII.GetName], busca aprovechar la popularidad del grupo palestino del mismo nombre. Mientras tanto, la Jihad Islámica ha adoptado el legado originales de las [NTR.GetFlag]Brigadas de la Revolución de 1920, prometiendo preservar y continuar su herencia yihadista."
 axis_of_resistance_events.30.o1: "Otra guerra en Irak"
 axis_of_resistance_events.31.t: "[IAI.GetName] declara la guerra a [ISI.GetName]"
 axis_of_resistance_events.31.d: "Tras la caída del último bastión baazista, el Ejército Islámico de Irak ha declarado la guerra al [ISI.GetNameWithFlag] y a sus afiliados que operan en el país. Las tensiones entre ambos grupos han estallado tras una serie de violentos enfrentamientos en el norte de [IRQ.GetNameWithFlag], en los que las fuerzas de [ISI.GetNameWithFlag] han aprovechado el caos dejado por la caída del régimen de Sadam Husein. [IAI.GetFlag][IAI.GetName] decidida a hacerse con el control del corazón suní de [IRQ.GetNameWithFlag], considera la presencia de [ISI.GetNameWithFlag] como una fuerza desestabilizadora y está lanzando una ofensiva a gran escala para expulsarlos. Los analistas sugieren que esto podría agravar el conflicto en [IRQ.GetNameWithFlag], ya que las facciones rivales compiten por el control en medio del vacío de poder dejado por la caída de los baazistas."
 axis_of_resistance_events.31.o1: "La batalla por el futuro de Iraq comienza"
 axis_of_resistance_events.32.t: "Levantamiento del Consejo Tribal de Anbar"
 axis_of_resistance_events.32.d: "El [ATC.GetFlag]Consejo Tribal de Anbar ha lanzado un levantamiento contra fuerzas de [ISI.GetNameWithFlag] en [IRQ.GetNameWithFlag], denunciando su presencia en la región. Los líderes tribales han movilizado combatientes para reclamar sus tierras, atacando fortalezas de [ISI.GetNameWithFlag] y tomando ciudades clave en Anbar. Esta escalada amenaza con desencadenar un conflicto más amplio a medida que las fuerzas tribales se enfrentan a [ISI.GetNameWithFlag], cambiando potencialmente el equilibrio de poder en Irak."
 axis_of_resistance_events.32.o1: "Comienza la lucha por Anbar"
 axis_of_resistance_events.33.t: "La guerra civil en Irak llega a su fin"
 axis_of_resistance_events.33.d: "La guerra en [IRQ.GetName] ha llegado a su fin. La mayoría de las facciones de la oposición se han disuelto o han sido absorbidas, poniendo fin oficialmente a la guerra. Con el campo de batalla despejado, [IRQ.GetName] se enfrenta ahora a la ingente tarea de reconstruir la nación."
 axis_of_resistance_events.33.o1: "Comienza una nueva era"
 axis_of_resistance_events.36.t: "Militantes forman el Consejo Militar General para los Revolucionarios Iraquíes"
 axis_of_resistance_events.36.d: "Varios grupos alineados con el partido Baaz, milicias tribales sunitas y ex oficiales militares han anunciado la formación de un frente unificado: el Consejo Militar General de los Revolucionarios Iraquíes (CMGRI).\n\nEn una transmisión desde un lugar no revelado, el portavoz del Consejo denunció como ilegítimos tanto a los restos del gobierno anterior como a las milicias chiíes alineadas con Irán. Afirman que están luchando para 'liberar a Irak de la dominación extranjera' El CMGRI ha pedido el restablecimiento del Estado nacionalista iraquí."
 axis_of_resistance_events.36.o1: "Los cambios de marea"
 axis_of_resistance_events.38.t: "Hamás de Irak Topples 1920 Brigadas Revolucionarias en una Coup Interna"
 axis_of_resistance_events.38.d: "Hamás de Irak ha lanzado un golpe interno contra las Brigadas Revolucionarias de 1920, un antiguo aliado y un actor importante en la lucha contra las milicias apoyadas por Irán y los restos del antiguo régimen.\n\nEl golpe se produjo durante una cumbre de dirigentes en el oeste de Irak, donde fuerzas de Hamás de Irak asaltaron el recinto y detuvieron a varios altos mandos de las Brigadas Revolucionarias de 1920."
 axis_of_resistance_events.38.o1: "La insurgencia se devora a sí misma."
 axis_of_resistance_events.40.t: "Al-Awda toma el control del liderazgo del Partido Baaz"
 axis_of_resistance_events.40.d: "La facción al-Awda exiliada, liderada por Mohammed Younis al-Ahmed, ha organizado un golpe interno, reivindicando la dirección plena del Partido Ba'ath iraquí. En un rápido movimiento durante un congreso secreto cerca de la frontera siria, al-Awda purgó a los comandantes rivales y declaró un nuevo Comando Revolucionario Unificado.\n\nAl-Ahmed denunció la fragmentación de la causa bautista y prometió restaurar el orden e ideología al movimiento. Con el apoyo de la exinteligencia y oficiales militares, la facción ahora busca reafirmar el dominio ba'atista en medio de la guerra civil de Irak"
 axis_of_resistance_events.40.o1: "La sombra de Sadam"
 axis_of_resistance_events.41.t: "Coalición baazista se proclama victoriosa en la guerra civil iraquí"
 axis_of_resistance_events.41.d: "El Consejo Militar General para los Revolucionarios Iraquíes (GMCIR), una coalición de oficiales ex-Baatistas, líderes tribales suníes e insurgentes nacionalistas, ha declarado la victoria. Tras apoderarse de Bagdad y encaminar tanto a las milicias chiítas apoyadas por el Irán como a las fuerzas leales, el GMCIR ha anunciado la formación de un gobierno militar provisional.\n\nAl ser reconocidas por la UE y gran parte del mundo occidental, todavía expresan preocupación por la ideología ba'atista del grupo y posibles represalias contra las minorías étnicas y sectarias, mientras que algunos lo ven como un baluarte contra la influencia iraní."
 axis_of_resistance_events.41.o1: "La sombra de Sadam"
 axis_of_resistance_events.42.t: "El Ejército Islámico de Irak declara la victoria en la guerra civil"
 axis_of_resistance_events.42.d: "Después de meses de guerra urbana brutal y alianzas cambiantes entre las facciones guerreras de Irak, un nuevo vencedor ha surgido en las cenizas del antiguo estado. El Ejército Islámico de Irak (IIA), un grupo insurgente islamista sunita, una vez considerado como un jugador menor, ha incautado a todo Iraq y declarado el fin de la guerra civil."
 axis_of_resistance_events.42.o1: "¿Un califato en todo menos en el nombre?"
 axis_of_resistance_events.43.t: "Hamás de Irak declara la victoria"
 axis_of_resistance_events.43.d: "El grupo conocido como Hamás de Irak ha declarado el fin de la guerra civil.\n\nAl situarse como el campeón de la población suní desprovista de Irak, Hamás de Iraq surgió del caos como una fuerza disciplinada e ideológicamente impulsada. Dirigiendo el apoyo de redes religiosas, ex insurgentes y civiles de guerra, el grupo ganó la tracción ofreciendo una alternativa a los antiguos gobiernos corruptos y las facciones respaldadas por extranjeros."
 axis_of_resistance_events.43.o1: "¿Un califato en todo menos en el nombre?"
 axis_of_resistance_events.44.t: "Las Brigadas de la Revolución de 1920 logran la victoria en Irak"
 axis_of_resistance_events.44.d: "La Guerra Civil iraquí ha llegado a su fin bajo la bandera de las Brigadas Revolucionarias de 1920. Dirigido después de la histórica insurrección anticoloniales, el grupo ha declarado la victoria tras apoderarse de Bagdad y consolidar el control sobre Irak central y occidental.\n\nOriginalmente operaban como un grupo islamista-nacionalista sunita, adquirieron popularidad en las zonas rurales presentándose como defensores de la soberanía iraquí y opuestos tanto a la dominación iraní como a las ideologías extremistas.\n\nAhora en el poder, las Brigadas han declarado la creación de una República de Resistencia Nacional, pidiendo un retorno a la unidad iraquí, guiado por los valores islámicos y la independencia nacional."
 axis_of_resistance_events.44.o1: "El espíritu de 1920 sigue vivo."
 axis_of_resistance_events.45.t: "Ba'athist Faction 'al-Awda' Resores Order in Iraq"
 axis_of_resistance_events.45.d: "La facción ba'atista exiliada conocida como al-Awda, 'El Regreso', ha logrado una impresionante victoria militar y política. Dirigida por el oficial de Saddam-era Mohammed Younis al-Ahmed, la facción bautizó a través del norte y oeste con una fuerza disciplinada compuesta por antiguos oficiales del ejército, leales bahaistas, y desafectó a Sunnis."
 axis_of_resistance_events.45.o1: "El espíritu de 1920 sigue vivo."
 influence.56.t: "Envío de armas a Palestina"
 influence.56.d: "Tenemos que planificar nuestra forma de entregar nuestras armas, ya sea de contrabando a través de Sudán a Egipto o enviadas por transporte de mercancías. El gobierno israelí desconfiará de nuestras acciones. Cuando enviemos nuestras armas, pagaremos un impuesto fijo sobre las armas que se pierdan, que oscilará entre el 10% y el 50%, dependiendo de cómo las enviemos y de la perspectiva de nuestros vecinos."
 influence.56.a: "Contrabando a través del corredor terrestre"
 influence.56.b: "Diríjalos por rutas marítimas"
 influence.56.c: "Quizás no hoy"
 iranian_focus.175.a: "Bueno entonces..."
 iranian_focus.176.t: "Irán sin control"
 iranian_focus.176.d: "Irán ha estado descontrolado durante mucho tiempo, conquistando estados sin piedad. Es hora de que nosotros, y algunos otros países, hagamos algo al respecto. Es necesario tomar medidas militares."
 iranian_focus.176.a: "Huelga al amanecer"
 iranian_focus.176.b: "No, es demasiado arriesgado"
 iranian_focus.177.t: "La Coalición Khaleej"
 iranian_focus.177.d: "Tras la campaña de guerra de Irán en la región, varias naciones de la región han decidido moverse y 'neutralizar' a Irán. Un portavoz de la coalición afirma que el objetivo final es la paz, que sólo vendría con Irán siendo sometido y desarmado. Aunque es desconocido si tienen o no planes más grandes que desarmar a Irán, pero lo que se sabe por ahora es que Irán tendrá mucho que lidiar en los próximos meses."
 iranian_focus.177.a: "Interesante"
 iranian_focus.178.t: "Las instituciones liberales chocan con el poder judicial"
 iranian_focus.178.d: "Los elementos conservadores han comenzado a chocar con varios grupos activistas, periódicos reformistas y grupos estudiantiles recientemente. Los enfrentamientos no son aleatorios, sino más bien la acumulación de los últimos años bajo la administración Khatami y sus reformas liberales. De cualquier manera, el IRGC y el bloque conservador están tratando de cerrar estas instituciones."
 iranian_focus.178.a: "Del lado de los conservadores"
 iranian_focus.178.b: "Del lado de los liberales"
 iranian_focus.179.t: "¡Saeed Hajjarian recibió un disparo!"
 iranian_focus.179.d: "Se ha hecho un intento por la vida de Saeed Hajjarian, prominente activista pro-democracia y ex oficial de inteligencia. Fue baleado en la cara por un desconocido asaltante, y actualmente está en condiciones críticas. Se cree que el tiroteo fue en represalia a su trabajo para descubrir los asesinatos en cadena de varios disidentes en Irán y su significativa ayuda al crecimiento del movimiento de reforma iraní."
 iranian_focus.179.a: "Iniciar una investigación"
 iranian_focus.179.b: "No es nuestro problema"
 iranian_focus.180.t: "Los esfuerzos de privatización de Jatamí"
 iranian_focus.180.d: "Desde la elección de Jatamí hace casi cuatro años, sus esfuerzos por privatizar amplios sectores de la economía iraní no han pasado desapercibidos. Si bien los efectos han tenido algunos aspectos positivos y beneficios, a largo plazo existe el temor de que estas medidas perjudiquen a la población en general. Cada vez son más las voces que piden que se reviertan algunas de sus decisiones."
 iranian_focus.180.a: "Adelante, revierte algunos"
 iranian_focus.180.b: "No podemos inmiscuirnos en la política"
 iranian_focus.181.t: "Conflictos de intereses entre la IRGC y Artesh"
 iranian_focus.181.d: "Debido a las recientes mejoras tecnológicas, la Guardia Revolucionaria Islámica y Artesh han entrado en conflicto sobre quién debería recibir primero qué equipo. Durante mucho tiempo, la prioridad principal en cuanto a nuevas armas y equipos ha sido la Guardia Revolucionaria Islámica (IRGC), sin embargo, ante la creciente presión del Ejército, es posible que debamos reconsiderarlo."
 iranian_focus.181.a: "Ponerse del lado de la IRGC"
 iranian_focus.181.b: "Ponerse del lado de Artesh"
 iranian_focus.182.t: "La policía económica intensifica la lucha contra la evasión fiscal agrícola."
 iranian_focus.182.d: "La Policía Económica ha iniciado una campaña contra quienes evaden impuestos y trabajan en zonas rurales. Se dice que los agricultores son los más afectados por este tipo de medidas y, como consecuencia, amenazamos su productividad. Sin embargo, podemos acortar la campaña para que se sientan aún más necesarios de lo que ya son."
 iranian_focus.182.a: "Acortar la campaña"
 iranian_focus.182.b: "Más les vale tener el dinero"
 iranian_focus.183.t: "Banco Parsian fundado"
 iranian_focus.183.d: "El Banco Parsian se fundó recientemente y ya cotiza en la Bolsa de Valores de Teherán. Con el auge de estos bancos, muchos piden que el gobierno determine su enfoque, ya que se dice que se convertirán en el banco no gubernamental más grande del país."
 iranian_focus.183.a: "Centrarse en la deuda nacional"
 iranian_focus.183.b: "Centrarse en la recaudación de impuestos"
 iranian_focus.184.t: "Actividad en Helmand"
 iranian_focus.184.d: "Nuestros agricultores necesitan urgentemente el agua que viene del río Helmand, y esos malditos iraníes han seguido acumulando todos los recursos de ese río. Es hora de que se haga algo sobre el río y su asignación."
 iranian_focus.184.a: "Lanzar una operación en Zabol"
 iranian_focus.184.b: "Déjenlos en paz, no podemos arriesgarnos a más guerra"
 iranian_focus.185.t: "Fuerzas talibanes cruzan el río Helmand"
 iranian_focus.185.d: "Varios soldados apostados en Zabol y sus alrededores fueron atacados a tiros por fuerzas talibanes que cruzaron el río Helmand. Los ataques han comenzado con el objetivo de que los talibanes controlen la totalidad de Helmand, territorio que necesitamos desesperadamente para nuestros agricultores en Baluchistán. ¡Debemos tomar represalias!"
 iranian_focus.185.a: "Les daremos una lección"
 iranian_focus.186.t: "Victoria talibán en Helmand"
 iranian_focus.186.d: "Las fuerzas talibanes lograron someter a varias unidades iraníes en la zona fronteriza. Como consecuencia, se ha cortado el suministro de agua a Helmand."
 iranian_focus.186.a: "Está bien"
 iranian_focus.187.t: "Victoria iraní en Helmand"
 iranian_focus.187.d: "Las fuerzas talibanes fueron repelidas al otro lado de la frontera por varias unidades iraníes, mientras que los iraníes lograron asegurar varios puntos clave alrededor del río Helmand, lo que permitió que fluyera más agua hacia Baluchistán."
 iranian_focus.187.a: "Está bien"
 iranian_focus.188.t: "Se alcanza un alto el fuego entre Irán y los talibanes"
 iranian_focus.188.d: "Irán y las fuerzas talibanes han negociado un acuerdo de alto el fuego, en el que ambas partes han acordado detener todos los ataques y regresar a su lado de la frontera."
 iranian_focus.188.a: "Está bien"
 iranian_focus.191.t: "El ayatolá Jamenei ataca a la prensa liberal"
 iranian_focus.191.d: "Más de 16 organizaciones de noticias han sido severamente censuradas o directamente prohibidas por orden del Ayatolá Jamenei. Esta ola de ataques contra la prensa liberal se produjo después de que el Ayatolá acusara a estas organizaciones de socavar e insultar los principios islámicos en sus publicaciones. Tras los intentos de apelación de su organización, Mashallah Shamsolvaezin fracasó y fue condenado a 30 meses de prisión por el artículo que publicó en 1999 en apoyo del levantamiento estudiantil reformista."
 iranian_focus.191.a: "Continuar los ataques"
 iranian_focus.191.b: "Dar marcha atrás en algunas de las prohibiciones"
 iranian_focus.192.t: "El avión Yak-40 de Faraz Qeshm Airlines se estrella en Alborz"
 iranian_focus.192.d: "Un Yak-40 arrendado por Armenia y operado por Faraz Qeshm Airlines se estrelló en una zona boscosa de las montañas Alborz. A bordo viajaban el Ministro de Transporte, otros funcionarios del ministerio y seis miembros del parlamento. El avión se dirigía a Gorgán para inaugurar el aeropuerto de Gorgán. Durante el vuelo, el avión fue alcanzado por un rayo, lo que afectó a sus sistemas de navegación y pudo haber provocado el accidente. Si bien los efectos de este accidente serían mínimos en última instancia, sí tendrá un impacto en nuestra hoja de ruta del transporte."
 iranian_focus.192.a: "No hay tiempo para el luto, hay que encontrar reemplazos competentes para los que se han ido"
 iranian_focus.192.b: "Verdaderamente devastador"
 iranian_focus.193.t: "¡Ali Reza Asgari deserta!"
 iranian_focus.193.d: "Recientemente, se había llamado la atención sobre la notable ausencia de Ali Reza Asgari en una reunión entre altos cargos del IRGC. Tras una minuciosa investigación, se descubrió que Ali Reza Asgari no había asistido a ninguna reunión ni audiencia en los últimos meses, y que un comandante de menor rango dirigía unidades en su lugar. Ahora se especula con la posibilidad de que haya desertado a Occidente, poniendo en juego información crucial."
 iranian_focus.193.a: "Ese bastardo"
 iranian_focus.194.t: "Vivo o muerto... En realidad, simplemente muerto"
 iranian_focus.194.d: "La mañana del desierto está tranquila mientras la helada comienza a establecerse. Omid, un voluntario de Irán y un veterano de la guerra Iraní-Iraq se sienta en una taburete agrietada bajo el esqueleto oxidado de un antiguo puesto de avanzada baathista. Su rifle descansa en su regazo, su casco en el suelo a su lado izquierdo. Una brisa se desvía a través del puesto como nubes de escobilla la visión de Omid. Una sombra se mueve a la distancia. \n\nOmid agarra su rifle y lo aprieta con fuerza en el pecho. Su miedo surgiendo por sus venas. Grita a la distancia: «¡Muéstrate!» Se para, levantando los ojos de su arma mirando por la sonrisa en sus ojos. Una vez más, grita: «¡Muéstrate!» Él mantiene el rifle, respirando a través de sus dientes. \n\nDe la niebla no una sola forma, sino tres. Se mueven rápido. Demasiado rápido.\n\nOmid grita otra vez, «¡Iraqi agresores!». Pero era demasiado tarde. El destello del tiroteo se erupcionó en un incendio.\n\n A su lado, un joven miliciano local se esconde del fuego que viene. Como la última revista se desliza en su cámara mientras todo se convierte en negro."
 iranian_focus.194.a: "Esta tierra nos enterrará a todos."
 iranian_focus.195.t: "Llegada a Damasco"
 iranian_focus.195.d: "Un convoy de sedán Khodro negros conduce por las calles de Damasco. Dentro hay diplomáticos iraníes de alto rango, enviados directamente desde Teherán. Su misión: reunirse con altos funcionarios sirios. Mientras los iraníes salen de los vehículos al patio del Palacio Popular, intercambian breves fideos con sus anfitriones sirios. No se hablan palabras. Un ayudante alto abre las grandes puertas de madera. Los diplomáticos desaparecen dentro mientras las puertas se cierran."
 iranian_focus.195.a: "Un momento para hablar"
 iranian_focus.1000.t: "Ampliación del recinto ferial internacional permanente de Teherán"
 iranian_focus.1000.d: "El Recinto Ferial Internacional Permanente de Teherán ha sido, desde su finalización en 1959, una forma para que nuestros ciudadanos más destacados demuestren el poderío tecnológico de nuestra nación. A lo largo de los años ha experimentado numerosas ampliaciones, pero la reciente ampliación prevista, que incluirá la construcción del Pabellón 5, también conocido como el Pabellón de las Naciones, nos brinda una oportunidad única para ofrecer espacios de exposición que satisfagan las necesidades de nuestro país. Se han planteado muchas opciones, aunque en última instancia, la falta de columnas en el espacio de exposición para grandes exposiciones industriales, proyectos militares o logros científicos es el principal obstáculo. La única incógnita ahora es para cuál de los tres se diseñará el salón."
 iranian_focus.1000.o1: "¡Mostremos nuestros avances industriales!"
 iranian_focus.1000.o2: "¡Mostremos nuestros avances militaristas!"
 iranian_focus.1000.o3: "¡Mostremos nuestros avances científicas!"
 iranian_focus.1.t: "Políticos vinculados a la IRGC invierten en países extranjeros"
 iranian_focus.1.d: "Después de nuestra subasta estatal de compañías afiliadas del IRGC, muchos de los que perdieron sus activos financieros comenzaron a ver el depósito de sus activos en otro lugar donde es más seguro. Sin embargo, nuestro gobierno ha atrapado el viento de este esquema, y somos capaces de tomar las medidas apropiadas para contrarrestar esto, o no."
 iranian_focus.1.a: "Dejemos que inviertan, nosotros cosecharemos los beneficios al final"
 iranian_focus.1.b: "Poner fin a sus esfuerzos"
 iranian_focus.2.t: "Oro negro teñido de rojo"
 iranian_focus.2.d: "Nuestras investigaciones han revelado que secciones enteras de campos petrolíferos ubicados en Bushehr están bajo el control de individuos y corporaciones cercanas o afiliadas a la IRGC. Estos hallazgos contradicen nuestros intentos actuales de combatir el nepotismo dentro del Estado, por lo que debemos determinar si queremos o no expropiar estos yacimientos petrolíferos. Si optamos por no apropiarnos de estos yacimientos petrolíferos, podemos comprometernos a utilizar todo el petróleo extraído de ellos para la infraestructura energética de los estados vecinos."
 iranian_focus.2.a: "Úsalo para algo que valga la pena."
 iranian_focus.2.b: "No podemos olvidar el propósito principal de este valioso recurso: el dinero"
 iranian_focus.3.t: "Conferencia en Pekín"
 iranian_focus.3.d: "Ha llegado el momento de que Bahman Group expanda sus negocios. Mediante la alianza con el Grupo FAW de China, podremos llevar la producción de automóviles iraníes a otras partes del mundo. Sin embargo, aún queda por ver qué haremos en la conferencia. Depende de nosotros si queremos liderarla o si preferimos escuchar."
 iranian_focus.3.a: "Proponer diseños iraníes"
 iranian_focus.3.b: "Esperar los diseños chinos"
 iranian_focus.4.t: "Organizaciones de Bonyad instrumentalizan su labor de divulgación"
 iranian_focus.4.d: "En respuesta a nuestros últimos intentos de minimizar el poder que Bonyads (caridades) sostienen sobre la economía de la nación, estas organizaciones litigiosas han decidido tomar represalias. En Mashhad, el Astan Quds Razavi Bonyad sostuvo un sermón donde criticaron al gobierno central, afirmando que «aquellos que dan las órdenes se han vuelto contra los pobres y nuestros sitios santos... Se han vuelto ciegos a sus propias acciones'. Como resultado, varios cientos han salido a las calles de ciudades como Mashhad y Qom para mostrar su insatisfacción sobre las reformas anti-Bonyad."
 iranian_focus.4.a: "Ofrecer concesiones"
 iranian_focus.4.b: "Mantén la posición, pronto se cansarán de protestar"
 iranian_focus.5.t: "Babak Zanjani comparece ante el tribunal"
 iranian_focus.5.d: "Aparecer en la corte maltratado y cansado, Sr. Zanjani silenciosamente pasó por la multitud de periodistas y anclas de noticias que le hicieron preguntas. Mientras se sentaba, el juez miró a Zanjani con gran escrutinio. Babak Zanjani ha sido acusado de incrustar más de 2,7 millones de euros en su esquema 'Oil for Gold'. Un plan que tenía por objeto eludir la reglamentación y el derecho internacionales, obteniendo así grandes ganancias a expensas del pueblo iraní. Mientras todos se levantaron para escuchar el veredicto, el juez declaró 'Mr. Zanjani, usted está aquí acusado de propagar la corrupción en la tierra'. Palabra llegó al gobierno sobre la decisión y ahora nos quedamos con una elección de lo que debemos hacer con su gran cantidad de riqueza."
 iranian_focus.5.a: "Aprovéchalo, todo"
 iranian_focus.5.b: "Debemos redistribuirlo al público"
 iranian_focus.6.t: "El malestar de Bazaari con las reformas fiscales"
 iranian_focus.6.d: "Los comerciantes de los bazares más grandes, como los de Teherán, Tabriz, Shiraz e Isfahán, han expresado recientemente su descontento con las recientes reformas del gobierno que les exigen presentar informes fiscales todos los años para mantener operativas sus tiendas. Como consecuencia, han prometido realizar huelgas frecuentes en represalia a la presión gubernamental."
 iranian_focus.6.a: "Ofrecer concesiones"
 iranian_focus.6.b: "Al diablo con ellos y sus huelgas"
 iranian_focus.7.t: "Los estudiantes internacionales regresan en masa"
 iranian_focus.7.d: "Tras nuestras reformas contra el régimen de Konkour, un gran número de estudiantes universitarios que abandonaron Irán para estudiar en el extranjero han comenzado a regresar al país. Al parecer, la falta de un examen de ingreso universitario simplificado ha incentivado a suficientes personas a regresar a Irán. Sin embargo, nos dejaron cuando más los necesitábamos, pero al mismo tiempo, ¿podemos culparlos? Podemos impedir que se matriculen en una de nuestras universidades a menos que participen en otro examen de ingreso simplificado, como habrían tenido que hacer, o simplemente podemos admitirlos y permitirles matricularse en cualquier universidad que deseen."
 iranian_focus.7.a: "Puedes volver, pero debes hacer un examen"
 iranian_focus.7.b: "Les damos la bienvenida con los brazos abiertos"
 iranian_focus.8.t: "Nuestra postura sobre el alcohol"
 iranian_focus.8.d: "Nuestras leyes sobre el consumo y la creación de bebidas alcohólicas todavía reflejan los principios revolucionarios de línea dura del Irán de 1979. El consumo y la creación de alcohol se ha disparado drásticamente desde entonces, y la mayoría lo hace en privado o en reuniones con familiares o amigos. Como resultado, nuestras fuerzas del orden han estado confundidas sobre si queremos o no aplicar la ley en estos asuntos. Un poco de claridad podría ayudar a poner fin a los acalorados debates que han llevado a un callejón sin salida durante todos estos años."
 iranian_focus.8.a: "Autorizar a un grupo de trabajo para erradicar a estos pocos corruptos de nuestra sociedad"
 iranian_focus.8.b: "¿A quién le importa lo que hagan? Tenemos asuntos más urgentes."
 iranian_focus.9.t: "Conducta del hiyab"
 iranian_focus.9.d: "Durante décadas hemos presionado para que se mantenga la vestimenta modesta para nuestras hermanas en la sociedad. Sin embargo, se ha hecho evidente que a muchas mujeres de nuestro país simplemente no les importa y, en consecuencia, optan por utilizar el hiyab como un accesorio de moda en lugar de como un símbolo de modestia. La mayoría de las fuerzas del orden miran hacia otro lado, ya que sería una carga demasiado pesada para nuestras prisiones si realmente tomáramos medidas enérgicas. Sin embargo, siempre podemos hacer sitio para más, la cuestión no es cómo, sino si tenemos la voluntad."
 iranian_focus.9.a: "Si hay voluntad hay un camino"
 iranian_focus.9.b: "No tenemos tiempo para debatir los detalles sobre cómo quieren encubrir"
 iranian_focus.10.t: "Se descubre una operación de contrabando ilegal de petróleo"
 iranian_focus.10.d: "En la provincia oriental de Sistán y Baluchistán, nuestras fuerzas de seguridad interceptaron un convoy de camiones cisterna que transportaban petróleo. Los camiones cargados con barriles de petróleo se dirigían a Pakistán, donde se esperaba que el petróleo se vendiera con ganancias en el mercado negro a expensas del pueblo iraní. Todavía estamos tratando de identificar a las personas que dirigen esta operación, y se sospecha incluso que algunas pertenecen a nuestro gobierno. Sin embargo, hemos logrado determinar la procedencia de estos camiones, ya que se descubrió que venían de Ormuz. Podemos mirar hacia otro lado o establecer un perímetro de seguridad alrededor de los yacimientos petrolíferos de Ormuz para evitar que se repitan robos similares."
 iranian_focus.10.a: "¡Quienes roban deben ser castigados!"
 iranian_focus.10.b: "Tenemos asuntos más urgentes"
 iranian_focus.11.t: "Irán ofrece petróleo de esquisto como represalia"
 iranian_focus.11.d: "El gobierno iraní se ha ofrecido a extraer petróleo de nuestras enormes reservas de esquisto bituminoso en nuestro país. El contrato estipula que Irán tendrá el control de estos yacimientos petrolíferos durante 10 años, pero al expirar dicho contrato, podremos obtener el control de los beneficios derivados de los recursos y equipos utilizados para extraer petróleo de nuestras reservas de esquisto."
 iranian_focus.11.a: "Una idea maravillosa"
 iranian_focus.11.b: "Rechazamos esta amenaza a nuestra independencia"
 iranian_focus.12.t: "[FROM.GetName] acepta nuestra propuesta de esquisto bituminoso"
 iranian_focus.12.d: "[FROM.GetName] ha aceptado nuestra propuesta más reciente y ha firmado un nuevo contrato respecto a la extracción de petróleo en Amán."
 iranian_focus.12.a: "Genial"
 iranian_focus.13.t: "[FROM.GetName] rechaza nuestra reciente propuesta"
 iranian_focus.13.d: "[FROM.GetName] ha rechazado nuestra propuesta más reciente respecto al contrato de extracción de petróleo en Amán."
 iranian_focus.13.a: "Lamentable"
 iranian_focus.14.t: "Nuestras opciones"
 iranian_focus.14.d: "El contrato iraní desperdició un gran potencial para un acuerdo mutuamente beneficioso entre nuestras naciones. Ha llegado el momento de alzar la voz y exigir condiciones más favorables."
 iranian_focus.14.a: "Necesitamos más petróleo"
 iranian_focus.14.b: "Queremos nuestro petróleo cuanto antes"
 iranian_focus.15.t: "Jordania solicita más petróleo"
 iranian_focus.15.d: "El gobierno jordano nos ha solicitado que extraigamos más petróleo en Amán. Si bien esto no tiene por qué ser algo negativo, a la larga nos costará un poco más."
 iranian_focus.15.a: "De acuerdo, pero necesitaremos un año más"
 iranian_focus.15.b: "No"
 iranian_focus.16.t: "Jordania solicita un contrato más corto"
 iranian_focus.16.d: "El gobierno jordano nos pide que rescindamos nuestro contrato cuanto antes para poder acceder al petróleo que hemos extraído. Esto, desde luego, no es algo que hayamos comentado."
 iranian_focus.16.a: "De acuerdo, pero necesitaremos compensación"
 iranian_focus.16.b: "No"
 iranian_focus.17.t: "Fin del contrato"
 iranian_focus.17.d: "Esta tarde, los iraníes comenzaron a empacar en Amán para regresar a Teherán tras la finalización del contrato de petróleo de esquisto firmado hace 10 años. Las autoridades jordanas controlan ahora el petróleo extraído por las compañías iraníes a lo largo de los años."
 iranian_focus.17.a: "Fueron buenos años de cooperación"
 iranian_focus.18.t: "Jordania rescinde su contrato antes de tiempo"
 iranian_focus.18.d: "El gobierno jordano ha tomado la imprudente decisión de incumplir el contrato acordado sin previo aviso. Esto constituye un claro incumplimiento de contrato y una traición a la confianza, algo que jamás olvidaremos."
 iranian_focus.18.a: "Inaceptable"
 iranian_focus.18.b: "Déjalo ir"
 iranian_focus.19.t: "Irán ofrece apoyo en la lucha contra el terrorismo en Asia Central"
 iranian_focus.19.d: "El gobierno iraní ha ofrecido sus efectivos para combatir el terrorismo en Asia Central. Esta iniciativa contribuirá a una mayor estabilidad general en la región, a la vez que brindará tranquilidad a nuestras tropas estacionadas allí."
 iranian_focus.19.a: "Aceptamos este trato"
 iranian_focus.19.b: "Una propuesta horrenda"
 iranian_focus.20.t: "Estados Unidos acepta nuestra propuesta"
 iranian_focus.20.d: "Los Estados Unidos han aceptado nuestra propuesta, y mañana movilizaremos una pequeña fuerza de respuesta para enviarla a Asia Central. El Ejército Americano ha ofrecido proporcionar a nuestras unidades de inteligencia en la región, lo que hará más fácil para nosotros alcanzar la velocidad de todos los problemas dentro de esta región."
 iranian_focus.20.a: "Genial"
 iranian_focus.21.t: "Estados Unidos rechaza nuestra propuesta"
 iranian_focus.21.d: "Estados Unidos ha rechazado nuestra propuesta, afirmando que no confía en la capacidad de nuestras fuerzas militares para hacer frente a las amenazas terroristas en Asia Central."
 iranian_focus.21.a: "Lamentable, pero ¿qué esperábamos?"
 iranian_focus.22.t: "Irán ofrece la venta de 3.000 drones Shahed-136"
 iranian_focus.22.d: "El gobierno iraní nos ha ofrecido vendernos 3.000 drones suicidas de su arsenal, pero sólo si aceptamos firmar un contrato en el que estamos obligados a proporcionarles información sobre el combate aéreo y una pequeña tarifa. Una gran cantidad de drones suicidas podría ser justo lo que necesitamos para reforzar nuestras fuerzas armadas, por lo que es una decisión que tendremos que pensar cuidadosamente."
 iranian_focus.22.a: "¿Dónde firmamos?"
 iranian_focus.22.b: "No, tenemos poco deseo de drones baratos"
 iranian_focus.23.t: "Rusia acepta"
 iranian_focus.23.d: "El gobierno ruso ha aceptado firmar nuestro contrato propuesto, que autoriza la venta de 3000 drones suicidas. En el contrato se estipula que deben proporcionarnos información de inteligencia sobre combate aéreo, lo que nos permitirá reforzar la integridad operativa de nuestra Fuerza Aérea."
 iranian_focus.23.a: "Genial"
 iranian_focus.24.t: "Rusia rechaza nuestra oferta."
 iranian_focus.24.d: "El gobierno ruso se ha negado a firmar nuestro contrato, rechazando así nuestra propuesta de venta de 3000 drones suicidas."
 iranian_focus.24.a: "Lamentable"
 iranian_focus.25.t: "Proveedores extranjeros"
 iranian_focus.25.d: "Estamos avanzando rápidamente hacia el cumplimiento de algunos de nuestros objetivos de modernización. Tras nuestros recientes esfuerzos de cooperación militar con el extranjero, el alto mando de Artesh ha decidido que lo mejor es empezar a buscar armamento en un proveedor más consolidado. No buscaremos materias primas, sino tecnología que nos permita depender de nuestras industrias para fabricar y ensamblar estas armas."
 iranian_focus.25.a: "Los rusos: asistencia a las fuerzas terrestres"
 iranian_focus.25.b: "Los estadounidenses - asistencia de la fuerza aérea"
 iranian_focus.25.c: "Los alemanes: asistencia a las fuerzas blindadas"
 iranian_focus.26.t: "Irán solicita tecnología militar"
 iranian_focus.26.d: "El gobierno iraní ha enviado representantes a nuestras fuerzas armadas solicitando apoyo para su programa de investigación tecnológica. Nos consideran una fuerza competente y, por ello, nos han elegido por encima de muchos otros países. Depende de nosotros si queremos darle a Irán acceso a una tecnología tan sofisticada, pero podríamos ganarnos el favor de los iraníes, especialmente si logran modernizar su ejército."
 iranian_focus.26.a: "No estaría mal ayudar a un amigo"
 iranian_focus.26.b: "Nunca"
 iranian_focus.27.t: "¡[FROM.GetName] acepta compartir información militar!"
 iranian_focus.27.d: "El gobierno [FROM.GetAdjective] ha acordado dar asistencia a nuestras fuerzas armadas con la investigación militar. Este es un gran paso hacia nuestro programa de modernización, y estaremos seguros de que nunca olvidaremos su ayuda."
 iranian_focus.27.a: "¡Genial!"
 iranian_focus.28.t: "¡[FROM.GetName] rechazan nuestra solicitud!"
 iranian_focus.28.d: "El gobierno [FROM.GetAdjective] ha rechazado nuestra solicitud, ya que nos consideran poco fiables para guardar secretos militares."
 iranian_focus.28.a: "No lo olvidaremos"
 iranian_focus.29.t: "Oficial destacado asciende de rango"
 iranian_focus.29.d: "Una vez un oficial iraní imperial, Houshang Samadi ha demostrado ser capaz de dirigir a los soldados honorables de la Artesh. Habiendo defendido la nación contra Irak cuando Saddam Hussein invadió, Samadi ha demostrado que es capaz de manejar cualquier tarea a mano. Algunos de los altos mandos están discutiendo una posible promoción al general, mientras que otros son más reacios debido a discursos recientes que había dado, defendiendo la posición del Ejército Imperial durante la revolución de 1979."
 iranian_focus.29.a: "¡El ascenso es más que merecido!"
 iranian_focus.29.b: "Lo mejor es que siga siendo oficial"
 iranian_focus.30.t: "Irán estaría interesado en comprar el Su-30"
 iranian_focus.30.d: "El gobierno iraní ha preguntado sobre la posible venta de aviones Su-30 para su Fuerza Aeroespacial del IRGC. Sugieren que la venta ayudaría a prevenir nuevas agresiones occidentales y que probablemente disuadiría cualquier posible invasión en un futuro próximo. Nuestros principales asesores también sugieren que vender los modelos anteriores sería una mejor opción."
 iranian_focus.30.a: "Autorizar la venta"
 iranian_focus.30.b: "No hay trato"
 iranian_focus.31.t: "Rusia aprueba la venta"
 iranian_focus.31.d: "El gobierno ruso ha aprobado la venta de 40 aviones Su-30 para la Fuerza Aeroespacial de la IRGC (NEHSA). Estos aviones sin duda supondrán una importante incorporación a nuestro creciente arsenal y harán que nuestros enemigos consideren con mucha cautela sus próximos pasos."
 iranian_focus.31.a: "Genial"
 iranian_focus.32.t: "Rusia se niega a autorizar la venta"
 iranian_focus.32.d: "El gobierno ruso se ha negado a autorizar la venta de sus Su-30, lo que demuestra que no podemos depender de nadie más que de nosotros mismos."
 iranian_focus.32.a: "Una verdadera traición"
 iranian_focus.33.t: "Ciencia e Islam"
 iranian_focus.33.d: "Alí Hoseiní Jameneí, el segundo Líder Supremo de la nación, había declarado mediante una fetua que la investigación con células madre era permisible según el Islam. Esta fetua ha abierto la puerta a muchas más oportunidades que la investigación con células madre, permitiéndonos explorar campos alternativos. Como resultado, el gobierno ha aprobado un presupuesto para que nuestros científicos lo destinen a sus proyectos de investigación."
 iranian_focus.33.a: "Sigamos con lo que se dijo"
 iranian_focus.33.b: "Quizás podamos incursionar en la investigación de la construcción"
 iranian_focus.33.c: "¿Y si gastáramos el dinero en la gente?"
 iranian_focus.34.t: "Patrulla inminente"
 iranian_focus.34.d: "Rudāba estaba sentada en el telar, en la penumbra de su pequeña habitación. El rítmico movimiento de los hilos era una constante reconfortante en su vida. Sus dedos se movían con soltura, pero su mente estaba en otra parte. A lo lejos, más allá de las montañas de Guilán, se oían rumores desde la capital de que la policía había desplegado un gran contingente, más de lo habitual. Heydar, el tío de Rudāba, estaba de pie en la entrada.\n\nNos están vigilando otra vez, ¿sabes?\n\nLa voz de Heydar era baja mientras se apoyaba en el marco de la puerta, con las manos metidas en los bolsillos de su chaqueta desgastada. El humo del cigarrillo se cernía sobre él como una mancha con vida propia.\n\nTú también lo sientes, ¿verdad? ¿La forma en que patrulla la policía ahora? Caminan por el pueblo como si estuvieran buscando algo o a alguien. Están esperando cualquier excusa.\n\nRudāba simplemente lo descartó como algo típico de su tío, que estaba siendo paranoico como siempre, convenciéndose a sí misma y a Heydar con sus propias palabras. Ella respondió.\n\nQuizás te estén buscando. ¿Les has preguntado?\n\nHeydar respondió con brusquedad y sarcasmo.\n\nSabes que no tratamos con los Basij,\n\n mientras se daba la vuelta y salía de la entrada."
 iranian_focus.34.a: "No hace falta decirlo"
 iranian_focus.35.t: "Esfuerzo electoral de Basij"
 iranian_focus.35.d: "Hemos solicitado a las fuerzas Basij con derecho a voto que acaten nuestra petición. Podemos influir en el voto a favor de cualquier candidato, aumentando así las probabilidades de que nuestro candidato preferido gane la presidencia."
 iranian_focus.35.a: "Inclinar el voto hacia los reformistas"
 iranian_focus.35.b: "Influir en el voto a favor de los principalistas"
 iranian_focus.36.t: "El respaldo del Ayatolá"
 iranian_focus.36.d: "Hoy vamos a organizar una emisión pública de la Oficina del Líder Supremo. Allí apoyará públicamente a un candidato presidencial, y hablará a su favor. Aún queda por determinar quién apoyará, pero tenemos una buena idea."
 iranian_focus.36.a: "Los reformistas"
 iranian_focus.36.b: "Los principalistas"
 iranian_focus.37.t: "Participación de grupos selectos de oposición leal en el Majles"
 iranian_focus.37.d: "El ambiente político en el país se ha caldeado en los últimos años. Los llamamientos a la reforma electoral, al menos en el Parlamento, han ido en aumento día tras día. Tenemos la oportunidad de aprobar una ley que limite el control del Consejo de Guardianes sobre quién puede o no participar en el Majles, permitiendo así que participen los partidos de oposición leales que normalmente tienen prohibido presentarse a las elecciones. Este tipo de cambio es sumamente impopular entre los principalistas, pero cuenta con el apoyo de muchos reformistas."
 iranian_focus.37.a: "Déjenlos correr, representan una pequeña amenaza"
 iranian_focus.37.b: "Absolutamente no"
 iranian_focus.38.t: "Grupos de oposición estudiantil"
 iranian_focus.38.d: "En muchas de nuestras escuelas, particularmente en las universidades, los grupos estudiantiles de oposición han estado causando problemas a nuestro gobierno a través de sus actividades antiestatales. Generalmente, estos estudiantes provocan algunos daños a las instalaciones de la escuela y una leve atención mediática, pero no hacen más que dañar la reputación de la República Islámica. Estamos gastando bastante dinero en financiar a la policía del campus universitario, pero en algún momento se necesitará una solución más permanente."
 iranian_focus.38.a: "Que ejerzan libremente sus derechos"
 iranian_focus.38.b: "Aumentar la presión contra estos grupos"
 iranian_focus.39.t: "Una nueva era en la política iraní"
 iranian_focus.39.d: "Con el presidente [PER_president_name_loc] arrodillado a su lado, Jameneí se dirigió a la multitud de simpatizantes, generales y funcionarios del gobierno.\n\n'Hoy... hoy las fuerzas del mal ya no pueden manipular a nuestra nación. Las divisiones deben terminar, y las divisiones terminarán aquí', anunció el Líder Supremo.\n\n[PER_president_name_loc] entonces le indicaron que se acercara al pequeño podio y firmara algo. Unos instantes después, lo alzó a regañadientes para mostrárselo a la multitud. Era su renuncia oficial. Al darse cuenta de lo que estaba sucediendo, todos en la multitud levantaron los puños y gritaron 'Allah-o Akbar, Khamenei Rahbar', que significa 'Dios es el más grande, Jameneí es el líder'. El Majles fue disuelto, y su presidente protestó por esta medida, aunque poco después fue arrestado. El gobierno ha desplegado fuerzas de seguridad y prevé resistencia por parte de los movimientos reformistas."
 iranian_focus.39.a: "Lo que debería haberse hecho hace mucho tiempo ahora está completo"
 iranian_focus.391.t: "Una República Islámica, no más"
 iranian_focus.391.d: "A principios de hoy, el Líder Supremo había organizado una emisión pública en la Oficina del Líder Supremo. Muchos estuvieron presentes, como los generales de Artes, IRGC, Shi'ite Clergy y líderes proxy iraníes. En esta ceremonia, el Líder Supremo [PER.GetLeader] tuvo al presidente firmar una carta oficial de dimisión, señalando el fin de la posición presidencial de la República Islámica. Además, el Líder Supremo había anunciado la disolución de los Majles, parlamento oficial de Irán. El orador del Parlamento expresó rápidamente su oposición y, como resultado de ello, fue detenido. Este movimiento fue encontrado con indignación entre la oposición y los movimientos reformistas, y como resultado, el Líder Supremo había ordenado a las fuerzas de seguridad que arrestaran o neutralizaran a cualquiera en su camino. El Internet ha sido cortado, todos los partidos políticos deben ser desbandados y prohibidos, y el IRGC ha recibido un control total sobre la seguridad de la nación."
 iranian_focus.391.a: "¿Es Irán la próxima Corea del Norte?"
 iranian_focus.40.t: "CGRI irrumpe en el gobierno"
 iranian_focus.40.d: "El Cuerpo de Guardia Revolucionaria Islámica ha marchado sus fuerzas hacia Teherán, exigiendo el control sobre ciertos niveles de toda la administración gubernamental. Con la mayoría de las fuerzas armadas estacionadas en la ciudad rociando a su causa, nuestras opciones son severamente limitadas, por decir lo menos"
 iranian_focus.40.a: "Así comienza el ciclo"
 iranian_focus.41.t: "Irán busca normalizar las relaciones"
 iranian_focus.41.d: "El gobierno iraní está tratando de normalizar las relaciones con nuestro estado por primera vez desde la Revolución Islámica. Este es un desarrollo inesperado, pero no uno que podríamos haber imaginado jamás. Los iraníes desean poner toda hostilidad detrás de nosotros, y emprender un viaje de inversiones y acuerdos mutuos, a los que estamos de acuerdo si decidimos aceptar sus intentos de normalización."
 iranian_focus.41.a: "No vemos nada bueno en esto"
 iranian_focus.41.b: "Debemos normalizar las relaciones"
 iranian_focus.42.t: "[FROM.GetName] rechaza la normalización de las relaciones con nuestro país"
 iranian_focus.42.d: "El gobierno de [SAU.GetName] se ha negado a normalizar las relaciones con nuestro país, citando ninguna razón oficial pero que no podemos confiar en nosotros. No es así como los amigos se tratarían entre sí, y como tal, no tenemos otra opción que ver el [SAU.GetAdjective] como enemigos."
 iranian_focus.42.a: "No deseábamos esto"
 iranian_focus.43.t: "[SAU.GetName] acepta la normalización de las relaciones con nuestro país"
 iranian_focus.43.d: "El gobierno de [SAU.GetName] ha acordado normalizar las relaciones con nuestro país, y han comenzado a prepararse para construir una embajada. Nuestra nueva alianza estará segura de hacer que todo el mundo temble, ya que no estaremos divididos por una rivalidad inútil."
 iranian_focus.43.a: "¡Genial!"
 iranian_focus.44.t: "Irán ofrece un pacto de seguridad"
 iranian_focus.44.d: "El gobierno iraní ha flotado la idea de un posible pacto de no agresión, terminando formalmente cualquier forma de hostilidad entre nuestros gobiernos. ¿Pero se puede confiar en los iraníes? Es una cuestión que debemos pensar con mucho cuidado, ya que el futuro de nuestro gobierno y la política exterior depende de ello."
 iranian_focus.44.a: "Una idea horrible"
 iranian_focus.44.b: "Una gran idea"
 iranian_focus.45.t: "[SAU.GetName] rechaza nuestra propuesta"
 iranian_focus.45.d: "El gobierno de [SAU.GetName] ha rechazado rápidamente nuestra propuesta y en su lugar ha optado por declarar que cualquier forma de acuerdo escrito sobre un pacto de seguridad pondría en peligro los intereses [SAU.GetAdjective]."
 iranian_focus.45.a: "No lo olvidaremos"
 iranian_focus.46.t: "[SAU.GetName] acepta nuestra propuesta"
 iranian_focus.46.d: "El gobierno de [SAU.GetName] ha aceptado nuestra propuesta y, en cambio, ha mostrado mucho entusiasmo por un acuerdo escrito entre nuestros gobiernos que suspenda y abandone las hostilidades."
 iranian_focus.46.a: "Genial."
 iranian_focus.47.t: "Irán propone un pacto de garantía mutua"
 iranian_focus.47.d: "El gobierno iraní ha sugerido que garanticemos la independencia de la soberanía del otro mediante un pacto formalizado de seguridad, que verá [PER.capital.GetCapitalVictoryPointName] y [SAU.capital.GetCapitalVictoryPointName] establecer formalmente vínculos militares."
 iranian_focus.47.a: "¿Podrían haber ideado algo peor?"
 iranian_focus.47.b: "Una idea maravillosa"
 iranian_focus.48.t: "[SAU.GetName] rechaza"
 iranian_focus.48.d: "Por alguna razón, el gobierno de [SAU.GetName] ha decidido rechazar nuestra propuesta de un pacto de defensa mutua que podría beneficiar tanto a nuestro gobierno como al suyo. Esta medida posiblemente ponga en peligro la seguridad de muchas naciones del Golfo, incluida la suya propia."
 iranian_focus.48.a: "Ellos se lo pierden"
 iranian_focus.49.t: "[SAU.GetName] Acepta"
 iranian_focus.49.d: "Los [SAU.GetAdjective] han acordado firmar nuestro pacto formal de defensa, que exigirá a cualquiera de las naciones que vengan a la ayuda del otro era algo que pasara."
 iranian_focus.49.a: "Genial."
 iranian_focus.50.t: "Irán solicita la compra de tanques Leopard"
 iranian_focus.50.d: "[PER.GetName] nos han pedido que les vendamos 100 tanques Leopard por unos 35 mil millones de dólares. Podemos aceptar o rechazar su petición."
 iranian_focus.50.a: "Aprobar la venta"
 iranian_focus.50.b: "No podemos vendérselo"
 iranian_focus.51.t: "[FROM.GetName] acepta la compra de armas"
 iranian_focus.51.d: "[FROM.GetName] ha aceptado nuestra solicitud de compra de armas y en breve llegará un nuevo envío de nuestras armas."
 iranian_focus.51.a: "Genial."
 iranian_focus.52.t: "[FROM.GetName] rechaza la compra de armas"
 iranian_focus.52.d: "[FROM.GetName] ha decidido no vendernos sus armas, ya sea por temores que lo usemos para la destrucción o simplemente no tienen las armas a mano."
 iranian_focus.52.a: "Está bien"
 iranian_focus.53.t: "Irán solicita la compra de aviones Rafale-C a nuestro país"
 iranian_focus.53.d: "A principios de esta semana recibimos una solicitud muy extraña. Diplomáticos iraníes llamaron y, por alguna razón, están interesados ​​en comprar nuestros aviones, y están dispuestos a pagar una buena suma por ellos."
 iranian_focus.53.a: "Aprobar la compra"
 iranian_focus.53.b: "No"
 iranian_focus.54.t: "Irán extiende una invitación al CENTO"
 iranian_focus.54.d: "Irán ha enviado hoy delegados a [ROOT.capital.GetCapitalVictoryPointName] para negociar los términos de nuestra adhesión a CENTO. Afirman que esta alianza defensiva tiene como objetivo disuadir nuevas agresiones de potencias externas, y declaran que están trabajando para lograr el objetivo final de crear un cinturón de seguridad absoluto en la región."
 iranian_focus.54.a: "Debemos aceptar esta oferta"
 iranian_focus.54.b: "¡Rechazamos esta amenaza a nuestra independencia!"
 iranian_focus.55.t: "[FROM.GetName] acepta la invitación a CENTO"
 iranian_focus.55.d: "[FROM.GetName] ha aceptado unirse a CENTO, y ya ha firmado varios acuerdos de defensa. Su ascenso como miembro de pleno derecho de CENTO supone el fortalecimiento de una amistad que ya era grande."
 iranian_focus.55.a: "Bienvenido, [FROM.GetName]"
 iranian_focus.56.t: "[FROM.GetName] rechaza la membresía de CENTO"
 iranian_focus.56.d: "[FROM.GetName]se ha negado a aceptar la invitación que les extendimos hace unos días. Argumentan que unirse a la alianza no les conviene y que hacerlo podría atentar contra su soberanía e independencia."
 iranian_focus.56.a: "De acuerdo"
 iranian_focus.57.t: "[FROM.GetName] se une a CENTO"
 iranian_focus.57.d: "[FROM.GetName] ha aceptado oficialmente la invitación a la alianza CENTO que se les extendió esta semana. Esto marca otro hito para la nueva alianza reformada, ya que cuando Irán reformó la alianza no pudo obtener mucha atención o interés de los estados vecinos. Con [FROM.GetName] siendo ahora un miembro oficial, la alianza puede seguir siendo capaz de expandir su influencia."
 iranian_focus.57.a: "Los bloques de poder siguen creciendo"
 iranian_focus.58.t: "Rebelión en Azerbaiyán del Sur"
 iranian_focus.58.d: "Las milicias en todo Azerbaiyán del Sur se han levantado contra el gobierno iraní, amenazando su control sobre la región. Aunque se desconoce quién fue el principal impulsor de este movimiento, el gobierno iraní sospecha que fue alguien del norte, sobre todo si se trata de Azerbaiyán, Turquía o Rusia."
 iranian_focus.58.a: "¡Estamos con Azerbaiyán del Sur!"
 iranian_focus.58.b: "¡Estamos con Irán!"
 iranian_focus.58.c: "¡Al diablo con estos traidores!"
 iranian_focus.59.t: "Rebelión en Azerbaiyán del Sur"
 iranian_focus.59.d: "Las milicias en todo Baluchistán se han levantado contra el gobierno iraní, amenazando su control sobre la región. Aunque se desconoce quién fue el principal impulsor de este movimiento, el gobierno iraní sospecha que fue alguien del sur, sobre todo si se trata de [SAU.GetName] o Pakistán."
 iranian_focus.59.a: "¡Estamos con Baluchistán!"
 iranian_focus.59.b: "¡Estamos con Irán!"
 iranian_focus.59.c: "¡Al diablo con estos traidores!"
 iranian_focus.60.t: "Rebelión en Kurdistán"
 iranian_focus.60.d: "Las milicias en todo Kurdistán se han levantado contra el gobierno iraní, amenazando su control sobre la región. Aunque se desconoce quién fue el principal impulsor de este movimiento, el gobierno iraní sospecha que fue alguien del occidente, en especial [USA.GetName] o Israel."
 iranian_focus.60.a: "¡Estamos con Kurdistán!"
 iranian_focus.60.b: "¡Estamos con Irán!"
 iranian_focus.60.c: "¡Al diablo con estos traidores!"
 iranian_focus.61.t: "[PER.GetName] solicita la venta de buques"
 iranian_focus.61.d: "Los iraníes solicitan la compra de una gran cantidad de buques. Su solicitud incluye un portaaviones, dos destructores y un crucero. A pesar de ser una democracia, el futuro de Irán aún está por determinar, y debemos ser cautelosos con lo que les damos."
 iranian_focus.61.a: "Adelante"
 iranian_focus.61.b: "No"
 iranian_focus.62.t: "[USA.GetName] aprueba la venta de barcos"
 iranian_focus.62.d: "El presidente estadounidense [USA.GetLeader], ha aprobado la venta de 1 portaaviones, 2 destructores y 1 crucero. ¡Nuestra armada dominará el Golfo como ningún otro!"
 iranian_focus.62.a: "¡Genial!"
 iranian_focus.63.t: "[USA.GetName] rechaza la venta de barcos"
 iranian_focus.63.d: "El presidente estadounidense [USA.GetLeader], ha rechazado la propuesta que le habíamos enviado."
 iranian_focus.63.a: "Maldición"
 iranian_focus.64.t: "Irán quiere reabrir la embajada de Estados Unidos en Teherán"
 iranian_focus.64.d: "El gobierno iraní ha solicitado el restablecimiento formal de las relaciones diplomáticas y se ha ofrecido a renovar y restaurar la embajada estadounidense en Teherán. A cambio, haremos lo mismo y reabriremos su embajada en Washington. El cambio en el liderazgo de Irán ha hecho posible este diálogo, ya que la República Islámica que les precedió estaba empeñada en destruir nuestra nación."
 iranian_focus.64.a: "Un acontecimiento inesperado pero bienvenido"
 iranian_focus.64.b: "No queremos tener nada que ver contigo, Irán"
 iranian_focus.65.t: "Estados Unidos acepta restablecer las relaciones diplomáticas"
 iranian_focus.65.d: "El gobierno de los Estados Unidos ha acordado restablecer lazos con nuestro gobierno, y han comenzado planes para reabrir la embajada iraní en Washington. Este desarrollo marca un alto histórico en nuestras relaciones desde la Revolución Islámica."
 iranian_focus.65.a: "Genial"
 iranian_focus.66.t: "Estados Unidos se niega a normalizar las relaciones"
 iranian_focus.66.d: "Estados Unidos se ha negado a normalizar sus relaciones con nuestra nación y, en cambio, ha citado la volatilidad política que existe en nuestra nación como un 'factor impredecible'."
 iranian_focus.66.a: "¿Qué?"
 iranian_focus.67.t: "Irán da luz verde a la oposición siria"
 iranian_focus.67.d: "El gobierno iraní ha autorizado el inicio de operaciones generales por parte de varios grupos de la oposición siria que operan bajo el mando del ELS. Aunque se trata de una coalición muy laxa, Irán ha estado utilizando su influencia y su extensa diplomacia para armar a varios grupos y hacer que trabajen juntos con el único objetivo de derrocar a [SYR.GetLeader]. Algunos temen que esto pueda resultar en derramamiento de sangre y destrucción innecesarios, pero [PER.GetLeader] ha salido a anunciar que tales medidas se están tomando para prevenir un futuro brote que sería \"mucho más destructivo que lo que podría hacer un grupo de luchadores por la libertad altamente motivados\"."
 iranian_focus.67.a: "Interesante"
 iranian_focus.67.b: "¡Los bufones de [PER.capital.GetCapitalVictoryPointName] no tienen ni idea de lo que están haciendo!"
 iranian_focus.68.t: "El conflicto sirio llega a su fin"
 iranian_focus.68.d: "La guerra civil en Siria ha concluido favorablemente para nosotros. La FSA ha derrocado exitosamente al gobierno sirio, y han comenzado a consolidar su poder. Nuestros principales asesores y oficiales militares en Siria también han comenzado a dar órdenes y dirigir su gobierno, haciéndoles un estado cliente de facto nuestro."
 iranian_focus.68.a: "La victoria es para aquellos que se atreven"
 iranian_focus.69.t: "Irán solicita ayuda en Siria"
 iranian_focus.69.d: "El gobierno iraní ha solicitado que enviemos fuerzas de intervención para apoyar al FSA en su esfuerzo por derrocar al gobierno de [SYR.GetLeader]. Que decidamos apoyar a Irán o no depende de nosotros, pero como miembros de CENTO, se supone que debemos apoyar a nuestros aliados."
 iranian_focus.69.a: "¡Marcharemos juntos hacia [SYR.capital.GetCapitalVictoryPointName]!"
 iranian_focus.69.b: "Tenemos asuntos más urgentes"
 iranian_focus.70.t: "CENTO moviliza fuerzas de intervención en nombre de la [FSA.GetName]"
 iranian_focus.70.d: "Esta semana se celebró en [PER.capital.GetCapitalVictoryPointName] una conferencia general de CENTO, donde la alianza acordó movilizar fuerzas de intervención en nombre del [FSA.GetName]. Esta fuerza de intervención tiene como objetivo ayudar a que la rebelión tenga éxito y derroque al gobierno de [SYR.GetLeader]. Los líderes de todo el mundo han tenido opiniones encontradas sobre el contenido tratado en esta conferencia, ya que abarcaba mucho más que la cuestión siria. Sin embargo, aún está por verse si se tomarán medidas, ya que nadie sabe si CENTO realmente cumplirá sus promesas."
 iranian_focus.70.a: "Interesante"
 iranian_focus.70.b: "¡Tontos!"
 iranian_focus.71.t: "Irán propone la expulsión de Hezbolá"
 iranian_focus.71.d: "El gobierno iraní ha sugerido recientemente que cooperemos en una huelga conjunta contra Hezbollah. Según Irán, su liderazgo representa una gran amenaza para la estabilidad de la región y nuestra propia nación. Ya sea que elijamos ayudar [PER.capital.GetCapitalVictoryPointName] en tal misión depende de nosotros, pero se nos prometen beneficios territoriales de esta operación."
 iranian_focus.71.a: "¡Liberemos al Líbano de esa escoria de Hezbolá!"
 iranian_focus.71.b: "No"
 iranian_focus.72.t: "Líbano acepta la operación"
 iranian_focus.72.d: "El Gobierno libanés ha acordado ayudarnos a expulsar a Hezbollah de la región. Los motivos detrás de esta operación son mayores que los simples agentes no estatales, está colocando el clavo final en el ataúd para la República Islámica y aquellos que huyeron al sur del Líbano."
 iranian_focus.72.a: "Entendido"
 iranian_focus.73.t: "Líbano rechaza la cooperación"
 iranian_focus.73.d: "El gobierno libanés se ha negado a ayudarnos a expulsar a Hezbolá y a las fuerzas restantes de la IRGC en la región. Parece que tendremos que hacerlo solos."
 iranian_focus.73.a: "Bien"
 iranian_focus.74.t: "Irán asesina a generales de la IRGC en el exilio"
 iranian_focus.74.d: "El gobierno iraní llevó a cabo una operación en la que murieron varios altos cargos de la IRGC que residían en nuestras casas de seguridad. Se atribuyó a la Fuerza Aérea iraní los asesinatos, que han provocado gran indignación entre la comunidad chiíta del Líbano."
 iranian_focus.74.a: "¡Maldita sea!"
 iranian_focus.75.t: "Operación exitosa contra exgenerales del CGRI"
 iranian_focus.75.d: "La Fuerza Aérea Iraní realizó con éxito varios ataques aéreos que acabaron con la vida de altos funcionarios del CGRI, incluyendo a Qasem Soleimani. Esta victoria no solo será celebrada, sino también reconocida mundialmente como una muestra del poder iraní."
 iranian_focus.75.a: "El fin de una era"
 iranian_focus.77.t: "El Golfo Pérsico"
 iranian_focus.77.d: "Han pasado aproximadamente 24 horas desde que emitimos tarifas moderadas de entrada en el Golfo Pérsico, y ya hemos recibido una condena generalizada por ello en la etapa global. Sin embargo, a pesar de la condena masiva, los políticos de Estados Unidos todavía están dispuestos a trabajar con nosotros. Nos ayudarán a reducir los costos de comercio y envío, pero a cambio tenemos que levantar nuestros impuestos y dejar el flujo comercial sin restricciones."
 iranian_focus.77.a: "No"
 iranian_focus.77.b: "Podemos llegar a un acuerdo"
 iranian_focus.78.t: "Manifestación iraní cerca de la frontera Azerí"
 iranian_focus.78.d: "El ejército iraní ha concentrado una fuerza considerable en la frontera Azerí, e incluso ha llegado a formar divisiones étnicas especiales en los últimos meses como medida de preparación. Los servicios de inteligencia occidentales saben desde hace meses que Irán está preparando una invasión de Azerbaiyán, presumiblemente para anexionarse el país. Esto ocurre mientras el líder turco advierte de una posible intervención si Irán decide invadir Azerbaiyán. Muchos temen un conflicto regional de mayor envergadura, mientras que otros creen que ambas partes están fanfarroneando."
 iranian_focus.78.a: "Preocupante"
 iranian_focus.79.t: "Irán exige concesiones de petróleo"
 iranian_focus.79.d: "El gobierno iraní ha exigido que le demos control temporal a nuestros campos petroleros para que puedan 'desvelarlos'. Una demanda tan indignante ha enviado ondas de choque en toda la región, y muchos han venido a declarar al Irán como el matón regional. Ya sea que elijamos aceptar o no es algo que tendremos que pensar con mucho cuidado."
 iranian_focus.79.a: "No tenemos elección."
 iranian_focus.79.b: "Moriremos antes de someternos."
 iranian_focus.80.t: "[FROM.GetName] Concesiones"
 iranian_focus.80.d: "[FROM.GetName] se ha doblado ante la presión, y ahora han comenzado a permitir que las empresas de perforación iraní comiencen sus operaciones en sus campos petroleros."
 iranian_focus.80.a: "Bien."
 iranian_focus.81.t: "[FROM.GetName] Rechaza nuestra oferta"
 iranian_focus.81.d: "El gobierno de [FROM.GetName] es claramente inadecuado para gobernar, ya que han rechazado abiertamente nuestra generosa oferta. Por amor al orgullo y al ego nacional, han sacrificado la paz."
 iranian_focus.81.a: "Serán castigados"
 iranian_focus.82.t: "Irán exige Musandam y Masirah"
 iranian_focus.82.d: "La embajada iraní exigió hoy a nuestros diplomáticos la cesión de dos provincias estratégicas. El gobierno iraní ha exigido que transfiramos el control de Musandam y de la isla de Masirah a las autoridades iraníes como compensación por su ayuda para sofocar la rebelión de Dofar en los años setenta. Afirman que los territorios son necesarios para garantizar la seguridad regional e iraní."
 iranian_focus.82.a: "¿Qué otra opción tenemos?"
 iranian_focus.82.b: "¡Defiendaremos nuestras tierras a los últimos omaníes!"
 iranian_focus.83.t: "Territorio de los países que aportan contingentes"
 iranian_focus.83.d: "El gobierno de Omán tomó hoy una decisión muy sabia. El control de Musandam y Masirah están siendo transferidos a la Artesh en algún momento como resultado de nuestra excelente proeza negociadora."
 iranian_focus.83.a: "Bien, muy bien."
 iranian_focus.84.t: "Irán exige subyugación"
 iranian_focus.84.d: "El gobierno iraní ha exigido que Qatar se convierta en un protectorado suyo. Nuestra tierra no es simplemente una pieza en el tablero de ajedrez, y tal movimiento ha enojado a muchos en la sociedad qatarí y la región en su conjunto. Sin embargo, las recientes acciones de Irán han indicado que tienen poca consideración por la vida de los que les rodean."
 iranian_focus.84.a: "No tenemos otra opción."
 iranian_focus.84.b: "¡Pelearemos a los últimos Qatari!"
 iranian_focus.85.t: "Qatar Submits"
 iranian_focus.85.d: "El gobierno de Qatar ha acordado convertirse en un protectorado nuestro. Por supuesto, no tenían otra opción. O vivirán a espada, o morirán por ella."
 iranian_focus.85.a: "Buena elección"
 iranian_focus.86.t: "Apoyo a Shah Massoud"
 iranian_focus.86.d: "A fin de aumentar nuestra influencia en el Afganistán, hemos decidido prestar apoyo armamentístico a este país y ayudarlos a ganar la guerra contra los talibanes. ¿Pero cuánto apoyo deberíamos mostrar?"
 iranian_focus.86.a: "Mucho apoyo"
 iranian_focus.86.b: "Apoyo moderado"
 iranian_focus.86.c: "Poco apoyo"
 iranian_focus.87.t: "Levantamiento de Hazari en el Afganistán central"
 iranian_focus.87.d: "El pueblo Hazari se ha levantado contra los talibanes y la Alianza del Norte. Sus líderes están exhortando al apoyo iraní para guiarlos hacia la victoria, y nuestro ejército está listo para hacer lo ordenado."
 iranian_focus.87.a: "Go, go, go!"
 iranian_focus.88.t: "Victoria en Hazaristan"
 iranian_focus.88.d: "Nuestros hombres que luchaban en Hazaristan pudieron defenderse de los atacantes rabiosos tanto de la Alianza del Norte como de los talibanes. Hazaristan vive para ver otro día."
 iranian_focus.88.a: "No esperábamos nada menos"
 iranian_focus.89.t: "Levantamiento de Hazari en el Afganistán central"
 iranian_focus.89.d: "Como resultado de la influencia iraní no verificada, los Hazaras se han levantado contra todas las formas de autoridad en el Afganistán y ahora están buscando toda independencia de nuestro control."
 iranian_focus.89.a: "No durarán mucho."
 iranian_focus.90.t: "Fuerza de Defensa"
 iranian_focus.90.d: ""
 iranian_focus.90.a: ""
 iranian_focus.91.t: "El lugar del homosexual en la sociedad iraní"
 iranian_focus.91.d: "Nuestro partido lleva mucho tiempo comprometido y ha hecho campaña por la igualdad social para todos los iraníes, independientemente de su raza, género y sexualidad. Sin embargo, gobernar una nación socialmente conservadora es mucho más diferente, a pesar de que las grandes zonas urbanas son socialmente liberales, las zonas rurales donde residen muchos siguen siendo increíblemente conservadoras. Concederles tales libertades a los homosexuales sin duda enfurecería a los elementos conservadores de nuestra nación."
 iranian_focus.91.a: "Cumpliremos nuestras promesas"
 iranian_focus.91.b: "El homosexual no tiene cabida en Irán"
 iranian_focus.92.t: "Irán Propone la Unión Socialista"
 iranian_focus.92.d: "El gobierno iraní ha venido a nosotros solicitando que se establezca una unión socialista entre nuestras dos naciones. Afirman que esta unión no implicará el control iraní directo sobre Irak, sino la integración de nuestros sistemas de dos naciones. También han reiterado que tendremos la libertad de abandonar este sindicato en cualquier momento de nuestra elección, y que no estamos obligados a permanecer ni siquiera a unirse a él en primer lugar."
 iranian_focus.92.a: "¡Esto es un trato que debemos aceptar!"
 iranian_focus.92.b: "Nunca."
 iranian_focus.93.t: "Iraq se une a la Unión"
 iranian_focus.93.d: "El gobierno iraquí ha acordado firmar un acuerdo histórico donde estableceremos una unión socialista entre nuestros estados. No tendremos control directo sobre Irak, pero nuestras dos naciones trabajarán hacia un estado de interconexión."
 iranian_focus.93.a: "¡Genial!"
 iranian_focus.94.t: "Los socialistas iraquíes rechazan nuestro trato"
 iranian_focus.94.d: "Los iraquíes han rechazado nuestro acuerdo y, en cambio, han declarado que tal medida podría poner en peligro el socialismo en toda la región. Mientras comprendemos su punto, sigue siendo un gran golpe para el legado de nuestro partido y lo que esperaba lograr."
 iranian_focus.94.a: "La unificación tendrá que esperar ahora."
 iranian_focus.95.t: "Iraq se retira de la Unión"
 iranian_focus.95.d: "El gobierno iraquí se ha retirado formalmente de la Unión Socialista que hemos establecido juntos."
 iranian_focus.95.a: "Unfortunate"
 iranian_focus.96.t: "Iran Tribunal"
 iranian_focus.96.d: "Hoy se celebrará el Tribunal del Irán para los ex funcionarios de la República Islámica. Particularmente aquellos que eran cómplices de corrupción, escándalos y daños al pueblo. Un grupo de jueces debe decidir su destino, sin embargo, todavía tenemos una opción. Podemos pasar con el tribunal públicamente, o utilizarlos para hacer un gobierno más eficiente y transparente."
 iranian_focus.96.a: "Las segundas oportunidades nunca hacen daño a nadie"
 iranian_focus.96.b: "Haz un ejemplo de cada uno de ellos"
 iranian_focus.97.t: "Política de Hambastegi"
 iranian_focus.97.d: "Hambastegi significa solidaridad en Farsi. Con eso, muchos en nuestro partido están pidiendo abiertamente una política llamada 'Hambastegi', donde la intención es mostrar solidaridad con los pueblos desplazados del mundo. Están sugiriendo que permitimos que los refugiados, y los pueblos desplazados busquen santuario en Irán por un período indefinido. Esto significa que ganaremos una población más grande en su conjunto, y expandiremos nuestra fuerza de trabajo."
 iranian_focus.97.a: "Todo debe ser dejado entrar"
 iranian_focus.97.b: "Irán no tiene esa capacidad"
 iranian_focus.98.t: "La libertad en el último"
 iranian_focus.98.d: "Durante más de un siglo, el trabajador ha estado luchando contra los sistemas totalitarios de Irán. De huelgas a rebeliones francas, el trabajador honorable de Irán no ha dejado que el gobierno pisotee sus derechos. Ha llegado el momento de dar vuelta a la nación con reformas radicales."
 iranian_focus.98.a: "¡Libertad, Igualdad y Regla de los Trabajadores!"
 iranian_focus.99.t: "La dinastía Rajavi"
 iranian_focus.99.d: "Se ha establecido una nueva dinastía política, la dinastía Rajavi. Durante décadas, Massoud Rajavi y su esposa Maryam han liderado el MEK (Mojahedin-e Khalq) y han estado abogando por el establecimiento de un gobierno protegido por su proeza política."
 iranian_focus.99.a: "Muerte al dictador, sea el Shah o Mullah"
 iranian_focus.100.t: "Una nación de Shah"
 iranian_focus.100.d: "Tras varias décadas de exilio, Reza Pahlavi ha regresado y reclamado el trono del pavo real. La República Islámica que depuso a su padre no pudo cumplir con sus deberes que habían prometido, y por lo tanto el sentimiento monarquista y la nostalgia encendieron una luz que se desvaneció durante los años."
 iranian_focus.100.a: "Somos una gran nación, tomaremos a Irán de vuelta"
 iranian_focus.101.t: "Igual en un mundo desigual"
 iranian_focus.101.d: "El partido de los iraníes, los pan-iranistas han pedido desde hace mucho tiempo que se establezca un Estado dispuesto a luchar por el pueblo iraní y sus derechos. Durante siglos grandes poderes han estado comiendo en el territorio, soberanía y dignidad de Irán. Ha llegado el momento de que Irán sea igual en este mundo que devora a sus débiles."
 iranian_focus.101.a: "Que la Luz de la Divina Guía Nosotros"
 iranian_focus.102.t: "El cuidador de Irán"
 iranian_focus.102.d: "Siendo el primer sucesor designado de Jomeini, Montazeri rápidamente cayó fuera de favor debido a sus opiniones moderadas y liberales. Como resultado, Montazeri nunca fue capaz de convertirse en el Líder Supremo, con Khamenei tomando el puesto en su lugar. Ahora con la caída del sistema en su conjunto, todavía hay esperanza para una democracia islámica que fue imaginada en 1979, pero nunca llegó a ser."
 iranian_focus.102.a: "Si Dios lo quiere"
 iranian_focus.103.t: "Lo peor aún es venir"
 iranian_focus.103.d: "Lo peor aún está por venir para nuestro vecino occidental Iraq. La comunidad internacional está aumentando lentamente la presión sobre su estado, y algunos incluso especulan una invasión de Irak por las fuerzas estadounidenses. Necesitamos considerar darles algún tipo de paquete de ayuda para que tengan algo con lo que sobrevivir cuando llegue ese momento."
 iranian_focus.103.a: "La ayuda monetaria irá muy lejos."
 iranian_focus.103.b: "Las armas ayudarán a sus tropas"
 iranian_focus.104.t: "Irán da ayuda monetaria!"
 iranian_focus.104.d: "El gobierno del MEK en Irán nos ha enviado un paquete de ayuda en efectivo para ayudarnos a desarrollar nuestra nación."
 iranian_focus.104.a: "Gracias"
 iranian_focus.105.t: "Irán nos envía armas"
 iranian_focus.105.d: "El gobierno de MEK en Irán nos ha enviado un paquete con armas pequeñas para ayudar a abastecer a nuestras tropas."
 iranian_focus.105.a: "Esto será útil"
 iranian_focus.106.t: "Reconstrucción del campamento Ashraf"
 iranian_focus.106.d: "Muchos en nuestra organización están recordando el legado del Camp Ashraf, y lo que implicaba. Hay muchas llamadas sobre reconstruir el campamento, y hacerlo más grande y mayor que nunca antes. La pregunta es, ¿dónde?"
 iranian_focus.106.a: "La frontera turca"
 iranian_focus.106.b: "La frontera iraquí, en Khuzestan"
 iranian_focus.107.t: "Federalizing of Kurdistan"
 iranian_focus.107.d: "Nuestro partido ha hecho campaña durante mucho tiempo en la federalización de la región del Kurdistán, sin embargo, las cosas han cambiado desde entonces. Si optamos por defender nuestra promesa, controlaremos casi todo lo que sucede en el Kurdistán iraní, sólo celebrarán elecciones libres. Si optamos por mantener nuestro control sobre ellos, podemos enfrentar la futura resistencia de los kurdos si descuidamos su situación."
 iranian_focus.107.a: "Debemos cumplir nuestras promesas."
 iranian_focus.107.b: "No podemos cargar a Irán en pedazos."
 iranian_focus.108.t: "Larga llamada telefónica"
 iranian_focus.108.d: "Después de una llamada telefónica de casi dos horas con el Ministro de Defensa, [PER.GetLeader] discutió los términos de su coronación como el Shahanshah de Irán. La discusión no fue particularmente fluida, ya que ninguno de los partidos pudo llegar a un acuerdo sobre el papel y el trabajo del Sha en la sociedad iraní. [PER.GetLeader] deseaba mantener el poder del Sha como puramente ceremonial, dejando que los burócratas experimentados tomaran el control del gobierno. El Ministro, sin embargo, queriendo mantener el poder del secretario controlado, vio las cosas de manera diferente. Deseaba un gobierno donde el poder se divide entre él, el secretario general, el Príncipe Heredero y los Majles."
 iranian_focus.108.a: "Lado con [PER.GetLeader]"
 iranian_focus.108.b: "Junto con el Ministro"
 iranian_focus.109.t: "Coronación del Shah"
 iranian_focus.109.d: "Cheers rugió en los miles de personas en Freedom Square, recientemente renombrada plaza Shahyad, cuando Reza Pahlavi II estaba saludando a la multitud. Detrás de él estaba el monumento Shahyad, un testamento a su dominio paterno y la arquitectura iraní. Estar junto a él era un Marja, sosteniendo un Corán. Una vez que la ceremonia estaba en marcha, la Corona Imperial fue llevada a Reza por un respetado oficial militar. Al poner la corona en su cabeza, la multitud comenzó a cantar 'Javid Shah' lo que significa Long Live the Shah. Después de esto, comenzó un discurso. Mi poder no es nada sin la autoridad del pueblo. No soy tu gobernante, el pueblo iraní son los verdaderos gobernantes. Mi poder se deriva de...'"
 iranian_focus.109.a: "...Aquellos guiados por la luz de lo divino"
 iranian_focus.109.b: "...aquellos cuyo aliento es para Irán"
 iranian_focus.110.t: "El centro de la sabiduría política aparece en Rasht"
 iranian_focus.110.d: "En Rasht ha surgido un centro de pensamiento político que fomenta el desarrollo de ideales y valores laicos. Académicos y politólogos de todo Irán acuden a este centro para participar en las investigaciones que se llevan a cabo."
 iranian_focus.110.a: "Fascinante"
 iranian_focus.111.t: "Un centro de sabiduría política aparece en Isfahán"
 iranian_focus.111.d: "En Isfahán ha surgido un centro de pensamiento político que fomenta el desarrollo de ideales y valores laicos. Académicos y politólogos de todo Irán acuden a este centro para participar en las investigaciones que se llevan a cabo."
 iranian_focus.111.a: "Fascinante"
 iranian_focus.112.t: "Un centro de sabiduría política aparece en Mashhad"
 iranian_focus.112.d: "En Mashhad ha surgido un centro de pensamiento político que fomenta el desarrollo de ideales y valores laicos. Académicos y politólogos de todo Irán acuden a este centro para participar en las investigaciones que se llevan a cabo."
 iranian_focus.112.a: "Fascinante"
 iranian_focus.113.t: "El Centro de Sabiduría Política aparece en Markazi"
 iranian_focus.113.d: "En Markazi ha surgido un centro de pensamiento político que fomenta el desarrollo de ideales y valores laicos. Académicos y politólogos de todo Irán acuden a este centro para participar en las investigaciones que se llevan a cabo."
 iranian_focus.113.a: "Fascinante"
 iranian_focus.114.t: "El centro de sabiduría política aparece en Hormuzgán"
 iranian_focus.114.d: "En Hormuzgán ha surgido un centro de pensamiento político que fomenta el desarrollo de ideales y valores laicos. Académicos y politólogos de todo Irán acuden a este centro para participar en las investigaciones que se llevan a cabo."
 iranian_focus.114.a: "Fascinante"
 iranian_focus.115.t: "Donaciones para el Partido Republicano"
 iranian_focus.115.d: "El Partido Republicano a menudo se ha aliado con el nuestro, y han sido fundamentales para configurar la política exterior estadounidense hacia nosotros. Si podemos mostrarles nuestro propio apoyo, quizás los estadounidenses estén dispuestos a ser más indulgentes cuando llegue el momento de pedirnos un favor."
 iranian_focus.115.a: "Una pequeña donación bastará"
 iranian_focus.115.b: "Una donación moderada estará en marcha"
 iranian_focus.115.c: "Debemos darles una donación grande"
 iranian_focus.116.t: "Las donaciones iraníes inundaron para el GOP"
 iranian_focus.116.d: "Durante las últimas semanas, las donaciones han estado inundadas de fuentes anónimas dentro de Irán. Se especula que estos fondos son dados directamente por el gobierno iraní, que busca ver al Partido Republicano prevalecer sobre el partido democrático. Esto puede ser una sutil insinuación del gobierno iraní que buscan favores de los republicanos, como ellos están haciendo uno."
 iranian_focus.116.a: "Okay"
 iranian_focus.117.t: "Irán solicita asistencia para el envejecimiento de la flota F-14"
 iranian_focus.117.d: "El gobierno iraní ha venido a nosotros pidiendo ayuda para mejorar su flota F-14 envejecida. Los oficiales iraníes de la Fuerza Aérea que estuvieron presentes dieron un interesante discurso y propuestas. Los iraníes financiarían la creación de una moderna variante F-14 que apuntaría a mejorar la antigua y envejecida flota de F-14 de Irán. Esta variante también podría ser usada por nosotros, y nuestra propia Fuerza Aérea."
 iranian_focus.117.a: "Quizás podamos llegar a un acuerdo."
 iranian_focus.117.b: "Nunca."
 iranian_focus.118.t: "América comienza a enviar el F-14I Tomcat"
 iranian_focus.118.d: "Parece que los estadounidenses estaban convencidos, y han comenzado a transportar 60 unidades del F-14I Tomcat a la Fuerza Aérea. Con algunas mejoras, podemos finalmente tener un avión competente una vez más."
 iranian_focus.118.a: "Genial."
 iranian_focus.119.t: "Estados Unidos rechaza el acuerdo F-14"
 iranian_focus.119.d: "Por razones políticas, los Estados Unidos se han negado a aceptar nuestra propuesta del F-14I."
 iranian_focus.119.a: "Unfortunate"
 iranian_focus.120.t: "Un movimiento por la libertad"
 iranian_focus.120.d: "Estando establecido antes de la Revolución, el Movimiento por la Libertad de Irán ha estado a la vanguardia en la lucha contra las instituciones no republicanas. Al ser los primeros partidarios de la República Islámica y de la revolución, el Movimiento por la Libertad se ha desplazado a lo largo de los años para oponerse a la República Islámica en su totalidad y empujar hacia una República. Con el surgimiento del FMI, los iraníes pueden finalmente ser capaces de establecer una verdadera democracia islámica."
 iranian_focus.120.a: "Estamos unidos"
 iranian_focus.121.t: "La Bandera Verde de la Esperanza"
 iranian_focus.121.d: "Dirigida por Mir-Hossein Mousavi, el Sendero Verde de la Esperanza se ha convertido en una alternativa más conservadora al Movimiento por la Libertad de Irán. Aunque comparte un objetivo común en el establecimiento de una República, Mousavi ha desempeñado un papel importante en la configuración de la República Islámica y sus políticas. Independientemente de su pasado, Mousavi ahora se ha convertido en más socialmente liberal, al tiempo que destaca la necesidad de preservar algunos de los ideales de la Revolución Islámica."
 iranian_focus.121.a: "Sólo Dios sabe lo que viene después"
 iranian_focus.122.t: "Los herederos de Mosaddeq"
 iranian_focus.122.d: "El Frente Nacional ha tenido poder incautado de ellos en varias ocasiones. La primera vez que Mossadegh estaba a cargo, y luego una segunda vez en 1979 cuando Shapour Bakhtiar trabajaba para establecer una democracia tras el colapso del Estado Imperial. En los tiempos modernos, el Frente Nacional representa más una ideología socialista-tecnócrata. Independientemente de su suerte anterior en mantener el poder, el Frente Nacional tiene una visión que ninguna otra organización hace."
 iranian_focus.122.a: "Mosaddeq, ¡tu camino continúa!"
 iranian_focus.123.t: "Coalición con el KDPI"
 iranian_focus.123.d: "Nuestro partido había organizado una reunión formal entre nuestro máximo liderazgo y el liderazgo de KDPI. En esta reunión se discutió una coalición de tipos, en la que el partido Pan-Iranista financiaría proyectos de desarrollo KDPI a cambio del KDPI para declarar al gobierno pan-iranista como el gobierno legal y legítimo de las regiones kurdas. Conocer sus demandas nos permitirá aprovechar algunos beneficios agradables de los kurdos en Occidente."
 iranian_focus.123.a: "Formalizar un acuerdo militar"
 iranian_focus.123.b: "Formalizar un acuerdo económico"
 iranian_focus.124.t: "Restricciones a la población bahá'i"
 iranian_focus.124.d: "Como consecuencia de las anteriores regulaciones de la República Islámica, los bahá'ís han sido objeto de discriminación, lo que les ha impedido participar en la sociedad. Como seres humanos, merecen los derechos más básicos, algo que los ulemas no consideran apropiado. Conceder estos derechos socavaría la autoridad de los ulemas y los enfurecería profundamente, pero al menos podríamos preservar la dignidad de la nación."
 iranian_focus.124.a: "Emancipar al pueblo bahá'í"
 iranian_focus.124.b: "Es demasiado arriesgado"
 iranian_focus.125.t: "La República de Irán"
 iranian_focus.125.d: "El ayatolá Montazerí anunció hoy que dejará su cargo como jefe de gobierno interino una vez que las elecciones decidan el destino de la nación. Se dice que sus reformas allanaron el camino para un nuevo gobierno, libre de la corrupción que alguna vez formó parte de la República Islámica. Gracias a sus reformas, varios partidos han podido hacer campaña y obtener apoyo en los últimos meses. Ahora que Montazerí ha dimitido, existe la esperanza de que sus reformas hayan sentado las bases necesarias para una verdadera República."
 iranian_focus.125.a: "Movimiento por la Libertad"
 iranian_focus.125.b: "El Camino Verde de la Esperanza"
 iranian_focus.125.c: "El Frente Nacional"
 iranian_focus.126.t: "La Segunda República Islámica"
 iranian_focus.126.d: "Como resultado de la presión pública y la demanda popular, el ayatolá Montazerí ha asumido el liderazgo supremo de Irán y ha proclamado la Segunda República Islámica. Esto marca un momento histórico, ya que Irán abandona su antigua identidad y avanza hacia una nueva forma de gobierno más democrática. El ayatolá seguirá siendo una figura clave en el gobierno y la política para moderar y proteger al Estado, mientras que los partidos políticos tendrán libertad para presentarse y ejercer cargos públicos. Sin embargo, preocupa el delicado estado de salud de Montazerí y la posible cuestión de la sucesión tras su fallecimiento. Por ahora, los iraníes son libres de expresar sus opiniones políticas libremente."
 iranian_focus.126.a: "La verdadera visión de la revolución"
 iranian_focus.127.t: "Capear el temporal que se avecina"
 iranian_focus.127.d: "No hay nación en la Tierra que no haya enfrentado dificultades. Ha llegado el momento de priorizar la creación de un plan que nos ayude a superar las dificultades económicas o políticas cuando más lo necesitemos. La pregunta que queda ahora es: ¿qué es lo que más nos importa?"
 iranian_focus.127.a: "Respaldo económico"
 iranian_focus.127.b: "Respaldo político"
 iranian_focus.128.t: "Tómate un momento para reflexionar"
 iranian_focus.128.d: "Quiero que te tomes un momento para reflexionar sobre lo que acabas de hacer. Sabes lo que hiciste. ¿Fue apropiado? No. ¿Estaba maldito? Sí. ¿Deberías seguir jugando? No. Acabas de faltarle el respeto y escupir en los cientos de horas que pasé desarrollando este mod y trabajando en este árbol."
 iranian_focus.128.a: "Por favor cambia y crece como persona"
 iranian_focus.129.t: "Anti-Corruption Taskforce"
 iranian_focus.129.d: "En colaboración con los locales, se ha establecido un grupo de tareas contra la corrupción para preservar la integridad de nuestro gobierno y garantizar la transparencia gubernamental. Todo lo que queda ahora es determinar qué queremos que esta institución invierta la mayor parte de su tiempo en la protección. Una decisión debe tomarse pronto."
 iranian_focus.129.a: "Debe garantizar la integridad de la ley"
 iranian_focus.129.b: "Debe garantizar la integridad de la economía"
 iranian_focus.130.t: "El intermediario"
 iranian_focus.130.d: "Exoficial del ejército, político y académico. Esas tres palabras definen las características principales de Qalibaf. Si bien es quizás más conocido por sus diversos intentos de ganar la presidencia iraní, o por sus tendencias oligárquicas, Qalibaf siempre se ha posicionado como un intermediario. Si se le presentara una oportunidad, Qalibaf estaría allí para aprovecharla. Es a la vez un defensor de principios y un reformista, y sus próximos pasos suelen ser un misterio, a menos que haya dinero de por medio."
 iranian_focus.130.a: "Se harán las cosas"
 iranian_focus.131.t: "Los ambientes de Ahmadinejad"
 iranian_focus.131.d: "Históricamente Ahmadinejad ha sido derrocado como principalista, uno de los más duros que haya existido. Sin embargo, esta imagen conservadora de la suya es considerada por muchos como falsa, y en cambio algunos lo consideran políticamente confundido. Esta posición poco clara ha tenido sus beneficios, ya que se ha beneficiado de un mayor apoyo de las zonas rurales debido a su afiliación religiosa, y más áreas urbanas debido a sus tendencias más nacionalistas. Sin embargo, Ahmadinejad sigue siendo un principalista islamista con los intereses de Shias en mente."
 iranian_focus.131.a: "La primavera vive"
 iranian_focus.132.t: "Irán llama a los inversores rusos"
 iranian_focus.132.d: "El gobierno iraní ha lanzado hoy un anuncio pidiendo «aquellos que buscan multiplicar su riqueza en Rusia para venir a Irán». Este anuncio sugiere que Irán está buscando inversiones rusas en el estado iraní. Nuestro gobierno también ha estado considerando esto como un signo, uno que puede implicar beneficios para nosotros también. Si somos capaces de asegurar nuestra influencia en Irán, podemos hacer mucho más que hablar por canales diplomáticos."
 iranian_focus.132.a: "Seguir adelante con las inversiones"
 iranian_focus.132.b: "No podemos hacer negocios con tal estado"
 iranian_focus.133.t: "Las inversiones rusas inundan el país"
 iranian_focus.133.d: "Las oleadas de inversiones rusas han llegado al mercado iraní, tomando por sorpresa a gran parte del mismo. Además de las inversiones gubernamentales, algunos de los oligarcas rusos más ricos han estado invirtiendo en la industria minera iraní para ayudar a fomentar su crecimiento."
 iranian_focus.133.a: "Excelente"
 iranian_focus.134.t: "Rusia denuncia la inversión en Irán"
 iranian_focus.134.d: "Hoy, el gobierno ruso emitió un anuncio de servicio público instando a sus ciudadanos a abstenerse de invertir en Irán. Aunque desconocemos el motivo por el que harían tal cosa, estamos seguros de que es en respuesta a nuestros anteriores llamamientos a favor de las inversiones rusas en Irán."
 iranian_focus.134.a: "Muy desafortunado"
 iranian_focus.135.t: "Preservación de la Revolución"
 iranian_focus.135.d: "Los altos mandos debaten cómo preservar la revolución y sus ideales. Existe el temor de que el odio inicial hacia el gobierno anterior se disipe pronto y que, con ello, la ira del pueblo se dirija hacia nosotros. Debemos encontrar rápidamente un método para mantener a la gente del lado del gobierno y salvarnos del colapso."
 iranian_focus.135.a: "Pagar la matrícula de generaciones"
 iranian_focus.135.b: "¿Por qué tenemos que demostrar nada? Estamos aquí para quedarnos"
 iranian_focus.136.t: "La apuesta de Mashaí"
 iranian_focus.136.d: "Esfandiar Rahim Mashaí ha estado luchando para ganarse el apoyo del establecimiento iraní durante mucho tiempo, pero su ideología política única continúa alejándolo a él y a sus partidarios. Creyendo que es necesaria una escuela iraní del Islam, Mashaí enfurece constantemente al clero chiíta, al que intenta expulsar de la sociedad iraní. Por otro lado, su asociación con figuras como Ahmadineyad lo enfrenta a los movimientos reformistas. Aun así, su ideología secular y sus tendencias nacionalistas le han valido el apoyo de la zona gris de la política iraní."
 iranian_focus.136.a: "El Islam de los iraníes es diferente y esclarecedor, y moldeará el futuro"
 iranian_focus.137.t: "Un ejército del pueblo"
 iranian_focus.137.d: "Las Fuerzas Armadas iraníes, o la Artesh, han sido históricamente apolíticas. Sin embargo, el aumento de la inestabilidad dentro del establecimiento político no les ha dejado otra opción que intervenir directamente y crear un orden más estable hasta que la situación se calme y esté dispuesta a volver a la normalidad una vez más. La dirección política de la Artesh todavía no se conoce plenamente, ya que está compuesta por todos los sectores de la sociedad iraní debido a que la mayoría de los trabajadores activos son de origen conscripto."
 iranian_focus.137.a: "Que el Ejército sea sacrificado por la nación"
 iranian_focus.138.t: "Entre Rojo y Azul"
 iranian_focus.138.d: "La postura oficial de Ahmadinejad sobre la economía siempre ha sido sombría, y es conocida por nadie más que Dios. Esto ha causado muchos problemas en el gabinete, y los llamamientos están aumentando para que Ahmadinejad y su gobierno tomen una postura formal sobre si la dirección del gobierno será uno que se inclina hacia el socialismo o el capitalismo."
 iranian_focus.138.a: "Debemos abrazar el capitalismo a su plenitud."
 iranian_focus.138.b: "Debemos buscar el socialismo y sus beneficios"
 iranian_focus.138.c: "¿Por qué no los dos?"
 iranian_focus.139.t: "Redefiniendo al enemigo nacional"
 iranian_focus.139.d: "Desde que la Revolución Islámica sacudió la escena diplomática iraní hasta sus cimientos, hemos estado señalando a Occidente, y en particular a los estadounidenses, como enemigos de Irán y del Islam. Sin embargo, los tiempos han cambiado y al menos debemos considerar designar a otro como enemigo nacional para unir al pueblo una vez más."
 iranian_focus.139.a: "El Gran Satán se encuentra en Occidente"
 iranian_focus.139.b: "El mayor Satanás está al norte y al este."
 iranian_focus.139.c: "El peor Satanás de todos está justo al lado."
 iranian_focus.140.t: "Mahmoud's Dilemma"
 iranian_focus.140.d: "A principios de hoy, Ahmadinejad fue visto reflexionando fuertemente, completamente perdido en sus pensamientos. Después de que se le acercó y preguntó qué estaba pensando todo el día, respondió con «el dinero que gastamos en las tropas». El dinero al que se refiere es de donaciones para varias organizaciones benéficas veteranas en todo Irán. Preocupada por dónde se estaba asignando el dinero, Ahmadinejad ha estado debatiendo si sólo mantener el dinero y gastarlo en otro lugar, o dejar ir el dinero donde se suponía que debía."
 iranian_focus.140.a: "Una oportunidad tan incitante, demasiado incitando a pasar por alto"
 iranian_focus.140.b: "Debemos resistir el impulso, al igual que hemos sido guiados por la religión"
 iranian_focus.141.t: "Escupiendo al clérigo"
 iranian_focus.141.d: "A pesar del clero chiíta más dominante en la nación, tenemos la capacidad de renombrar algunas de nuestras ciudades y provincias a nombres preislámicos. Aunque este movimiento ciertamente enojaría a los clérigos, no superará su influencia como nosotros querríamos. En cambio, este movimiento podría considerarse una apertura a un movimiento mucho más grande para reemplazar al clero por Dios y sólo Dios mismo."
 iranian_focus.141.a: "Avance con el plan"
 iranian_focus.141.b: "No podemos arriesgarnos a enojar los fanáticos religiosos."
 iranian_focus.142.t: "Los viejos hábitos mueren duro"
 iranian_focus.142.d: "Expuesto de mucha corrupción en su carrera política, Mashaei no se ha alejado de ninguna oportunidad potencial que pudiera llenar sus bolsillos rápidamente. Sin embargo, ahora que él está a cargo del gobierno y efectivamente el líder de la nación, sus caminos deben cambiar. Si tiene que implementar correctamente sus políticas, entonces sus viejos hábitos deben ser sacudidos a favor de los más éticos."
 iranian_focus.142.a: "Pero todavía tiene un buen corazón."
 iranian_focus.142.b: "La corrupción es para hombres malos, debe erradicarse"
 iranian_focus.143.t: "El cisma iraní"
 iranian_focus.143.d: "El gobierno iraní ha comenzado a reformar cómo se practica fundamentalmente el islam. Con la mayoría de los estados musulmanes, incluyendo el nuestro, poniendo a los Ulemas y clérigos en una posición alta, Irán se está moviendo para disolver la participación del clero en asuntos islámicos. Están robando esto como la 'Escuela Iraniana' del Islam, y sus ideas se han propagado a nuestro propio país."
 iranian_focus.143.a: "Esto no puede ser bueno"
 iranian_focus.144.t: "Propuesta de acuerdo comercial con Irán"
 iranian_focus.144.d: "El gobierno iraní ha propuesto un posible acuerdo comercial entre nuestras dos naciones. Esta noticia ha conmocionado a muchos miembros de nuestro gabinete, ya que el actual gobierno iraní está presidido por varios ex funcionarios de la República Islámica, incluido su líder. No obstante, este cambio en la diplomacia es positivo, al menos para nosotros."
 iranian_focus.144.a: "Nosotros firmaremos"
 iranian_focus.144.b: "Nunca"
 iranian_focus.145.t: "Israel firma el acuerdo"
 iranian_focus.145.d: "El gobierno israelí anunció hoy que está dispuesto a cooperar con nuestro gobierno para mejorar el flujo comercial."
 iranian_focus.145.a: "Genial"
 iranian_focus.146.t: "Israel se niega a firmar el acuerdo"
 iranian_focus.146.d: "El gobierno israelí se ha negado a firmar el acuerdo comercial que les propusimos a principios de esta semana. Nuestro pueblo no tomará a la ligera esta lamentable noticia."
 iranian_focus.146.a: "Bien"
 iranian_focus.147.t: "Líder Unificador para la Nación"
 iranian_focus.147.d: "Los llamados a una figura más unificadora y centralizada para liderar la nación han ido creciendo. Con el Estado Mayor de la Artesh no haber nombrado a ningún jefe de figuras directas, se ha llamado un referéndum donde el pueblo de la nación puede elegir a su líder. El líder será nombrado como el 'Marzbānān-Marzbān' que significa el Guardián de todos los Guardianes."
 iranian_focus.147.a: "Amir Hatami"
 iranian_focus.147.b: "Halako Ahmadian"
 iranian_focus.147.c: "Farzad Esmaili"
 iranian_focus.147.d1: "Davoud Hermidas-Bavand"
 iranian_focus.148.t: "Irán propone un proyecto ferroviario"
 iranian_focus.148.d: "El gobierno iraní propone un proyecto ferroviario que abarca desde el sur de nuestro país, hasta el norte. Esto realmente puede beneficiar nuestra propia infraestructura, lo que significa que tenemos que pasar menos a largo plazo pero aceptar también significará que las empresas iraníes tienen influencia en nuestra nación."
 iranian_focus.148.a: "¿Por qué no?"
 iranian_focus.148.b: "No"
 iranian_focus.149.t: "Armenia acepta!"
 iranian_focus.149.d: "Armenia ha aceptado nuestra oferta de construir un gran ferrocarril desde el sur de su nación, hasta el norte."
 iranian_focus.149.a: "Muy bien"
 iranian_focus.150.t: "Armenia Rechaza!"
 iranian_focus.150.d: "Armenia ha rechazado nuestra oferta de construir un gran ferrocarril en su nación."
 iranian_focus.150.a: "Su pérdida"
 iranian_focus.151.t: "Irán propone un proyecto ferroviario"
 iranian_focus.151.d: "El gobierno iraní propone un proyecto ferroviario que abarca desde el sur de nuestro país, hasta el norte. Esto realmente puede beneficiar nuestra propia infraestructura, lo que significa que tenemos que pasar menos a largo plazo pero aceptar también significará que las empresas iraníes tienen influencia en nuestra nación."
 iranian_focus.151.a: "Claro, ¿por qué no?"
 iranian_focus.151.b: "No"
 iranian_focus.152.t: "Azerbaijan Agrees!"
 iranian_focus.152.d: "Azerbaiyán ha acordado nuestra propuesta de un proyecto ferroviario que abarca toda su nación."
 iranian_focus.152.a: "Muy bien"
 iranian_focus.153.t: "¡Azerbaiyán rechaza!"
 iranian_focus.153.d: "Azerbaiyán ha rechazado nuestra oferta de un proyecto ferroviario."
 iranian_focus.153.a: "Sad"
 iranian_focus.154.t: "Irán propone un proyecto ferroviario"
 iranian_focus.154.d: "El gobierno iraní propone un proyecto ferroviario que abarca desde el este de nuestro país, hasta el oeste. Esto realmente puede beneficiar nuestra propia infraestructura, lo que significa que tenemos que pasar menos a largo plazo pero aceptar también significará que las empresas iraníes tienen influencia en nuestra nación."
 iranian_focus.154.a: "Absolutely"
 iranian_focus.154.b: "No"
 iranian_focus.155.t: "Georgia Agrees!"
 iranian_focus.155.d: "Georgia ha aceptado nuestra oferta de construir un ferrocarril que abarca desde el este hasta el oeste."
 iranian_focus.155.a: "Nice"
 iranian_focus.156.t: "¡Georgia Rechace!"
 iranian_focus.156.d: "Georgia ha rechazado nuestra oferta para construir nuestro proyecto de ferrocarril."
 iranian_focus.156.a: "Unfortunate"
 iranian_focus.157.t: "El desfile del ejército"
 iranian_focus.157.d: "Un reciente desfile del ejército fue televisado a toda la nación recientemente, mostrando nuestros avances tecnológicos y disciplina militar."
 iranian_focus.157.a: "Bah bah"
 iranian_focus.158.t: "La República del Irán"
 iranian_focus.158.d: "El Consejo Revolucionario anunció hoy que la primera votación oficial de la República del Irán está ahora disponible en las mesas electorales de todo el país. Con 3 partidos diferentes que están en la votación, permitiendo a candidatos liberales, moderados y conservadores postularse para el cargo. Aunque la nueva constitución ha garantizado ciertos derechos, como la libertad de expresión, la libertad de religión y más, una rivalidad entre las facciones ya está surgiendo."
 iranian_focus.158.a: "El Movimiento por la Libertad"
 iranian_focus.158.b: "El Sendero Verde de la Esperanza"
 iranian_focus.158.c: "El Frente Nacional"
 iranian_focus.159.t: "Asesinato de Qasem Soleimani"
 iranian_focus.159.d: "Una noticia amarga ha sido transmitida de Bagdad a Teherán: un dron estadounidense ha golpeado al General Qasem Soleimani y Abu Mahdi Al-Muhandis, en el Aeropuerto Internacional de Bagdad. Desafortunadamente, estas dos personas El anciano y sus compañeros fueron martirizados anoche como resultado de este ataque. Nuestra decisión es importante y muestra nuestra política y nuestro pragmatismo en la política exterior y nacional."
 iranian_focus.159.a: "¡Tenemos que vengarnos!"
 iranian_focus.159.b: "¡Esto significa guerra!"
 iranian_focus.160.t: "Intel On Soleimani Llega"
 iranian_focus.160.d: "A principios de hoy, el presidente fue informado sobre la presencia del comandante Qassem Soleimani del IRGC en Irak. Considerado la segunda persona más poderosa del gobierno iraní, Qassem Soleimani ha sido culpado por varios ataques contra soldados estadounidenses cometidos por milicias chiítas y ha estado en el radar de los militares durante mucho tiempo. Hoy tenemos la opción de neutralizarlo permanentemente. Sin embargo, hacerlo puede provocar una guerra."
 iranian_focus.160.a: "Llévatelo."
 iranian_focus.160.b: "No, esto es demasiado arriesgado."
 iranian_focus.161.t: "Estados Unidos Assassinated Qasem Soleimani"
 iranian_focus.161.d: "Qasem Soleimani, un general iraní, fue asesinado por una huelga de drones estadounidense en el Aeropuerto Internacional de Bagdad. El dron atacó y mató a Soleimani mientras iba a reunirse con el Primer Ministro iraquí en Bagdad. Soleimani fue comandante de la Fuerza Quds, una de las cinco ramas del Cuerpo Islámico de Guardia Revolucionaria de Irán, y fue considerada la segunda persona más poderosa de Irán. El IRGC dijo que un total de diez personas fueron asesinadas."
 iranian_focus.161.a: "Preocupante"
 iranian_focus.162.t: "Fallecimiento de Mohsen Pendar Pezeshkpour"
 iranian_focus.162.d: "Hoy la nación está de luto. Hoy pierde a un héroe nacional. Y, sobre todo, hoy pierde a Mohsen Pendar Pezeshkpour, fundador y pionero del partido paniranista. Aunque hoy sufrimos una gran pérdida, la nación no puede detenerse. Se nombrará a un nuevo secretario general como líder de la nación."
 iranian_focus.162.a: "Hojjat Kalashi"
 iranian_focus.162.b: "Reza Kermani"
 iranian_focus.162.c: "Zahra Gholamipour"
 iranian_focus.163.t: "Refugiados afganos"
 iranian_focus.163.d: "Debido a la situación caótica en el Afganistán, muchos afganos han recurrido a buscar refugio en Irán y se han enfrentado a sus familias. Sin embargo, esto ha comenzado a afectar a los lugareños, ya que están encontrando más difícil y más difícil encontrar empleo, porque el trabajo afgano suele ser más barato para emplear."
 iranian_focus.163.a: "Todos son bienvenidos aquí"
 iranian_focus.163.b: "Deportarlos"
 iranian_focus.164.t: "¡Jalil Zandi se estrella!"
 iranian_focus.164.d: "Se informó que el ex antiguo del F-14 y actual general de la Fuerza Aérea de Artesh, Jalil Zandi, estrelló su automóvil cerca de Teherán hace solo unas horas y actualmente se encuentra en estado crítico. Podemos recurrir al presupuesto del gobierno para salvarle la vida, pero se dice que los costos son increíblemente altos debido a la gravedad del accidente."
 iranian_focus.164.a: "Su vida descansa ahora con Dios."
 iranian_focus.164.b: "Pagar lo que sea necesario"
 iranian_focus.165.t: "Aumento en el uso de satélites"
 iranian_focus.165.d: "Parece que cada vez más personas en el país compran antenas parabólicas para acceder a canales de televisión extranjeros. Aunque son inofensivas por naturaleza, es posible que empiecen a ver propaganda contra nuestro estado, lo que a la larga perjudicará nuestra reputación."
 iranian_focus.165.a: "Dejarlos ser"
 iranian_focus.165.b: "Tome medidas drásticas contra este comportamiento"
 iranian_focus.166.t: "Cada vez cierran más tiendas de bazar"
 iranian_focus.166.d: "Los Bazares han tenido un año terrible, con el cierre de muchas tiendas. Esto se debe a diversas razones, pero principalmente a las reformas económicas que hemos impulsado con ahínco. Los Bazares piden la intervención del gobierno para evitar su colapso."
 iranian_focus.166.a: "Podemos darles ayuda"
 iranian_focus.166.b: "No"
 iranian_focus.167.t: "Elementos separatistas"
 iranian_focus.167.d: "Si bien nuestra nación no ha experimentado muchos movimientos secesionistas en los últimos años, cabe destacar que varias regiones son vulnerables a la influencia extranjera, lo que permite a nuestros enemigos explotarlas e incitar revueltas. Las regiones de Azerbaiyán, Kurdistán, Baluchistán y Juzestán son las más vulnerables."
 iranian_focus.167.a: "De acuerdo"
 iranian_focus.168.t: "Falleció el ayatolá Montazeri"
 iranian_focus.168.d: "En la madrugada, el ayatolá Montazeri falleció silenciosamente. La nación llora la partida del hombre que revirtió las tragedias de la Revolución Islámica. Si bien su fallecimiento marca un momento histórico, aún se desconoce qué escribió en su testamento y si ha designado un sucesor. El testamento será leído en directo por televisión nacional por uno de sus portavoces, y en él se declara que..."
 iranian_focus.168.a: "...Yousef Saanei será el ayatolá"
 iranian_focus.168.b: "...Asadollah Bayat-Zanjani será el ayatolá"
 iranian_focus.168.c: "...La era del gobierno clerical ha terminado, el pueblo debe liderar ahora."
 iranian_focus.169.t: "Cambiando la Bandera Nacional"
 iranian_focus.169.d: "La bandera nacional es el símbolo de una nación, lo que la unifica. Como Irán ha tenido muchas banderas a lo largo del tiempo, en cualquier momento podemos izar una nueva bandera sobre [PER.capital.GetCapitalVictoryPointName]"
 iranian_focus.169.a: "La bandera tricolor"
 iranian_focus.169.b: "El león y sol"
 iranian_focus.169.c: "Una bandera islámica"
 iranian_focus.169.d1: "La flor"
 iranian_focus.170.t: "Aumento de la actividad de la oposición"
 iranian_focus.170.d: "Parece que debido a nuestra legitimidad y popularidad, muchos grupos de oposición han reformado y comenzado a coordinar los esfuerzos para movilizar a la gente contra el gobierno. Si la legitimidad de la República Islámica continúa cayendo, el gobierno puede ser derrocado."
 iranian_focus.170.a: "De acuerdo"
 iranian_focus.171.t: "La planta nuclear de Bushehr"
 iranian_focus.171.d: "Izquierda inacabada por los estadounidenses, lo que se construyó de la planta nuclear Bushehr ha estado sentado ocioso durante décadas. Con la llegada de varios científicos rusos, se ha hecho una oferta para terminar lo que quedaba de la planta eléctrica."
 iranian_focus.171.a: "Aceptar la propuesta"
 iranian_focus.171.b: "No thanks"
 iranian_focus.173.t: "Ver la frontera de Atrak"
 iranian_focus.173.d: "[PER.GetName] nos ha ofrecido celebrar una reunión política en la frontera del río Atrak y hablar con ellos de cuestiones diplomáticas y comerciales. ¿Aceptamos su invitación?"
 iranian_focus.173.a: "¡Claro!"
 iranian_focus.173.b: "No nos interesa."
 iranian_focus.174.t: "[TRK.GetName] ¡Acepta!"
 iranian_focus.174.d: "[TRK.GetName] ha aceptado nuestra oferta para una reunión política en la frontera del río Atrak."
 iranian_focus.174.a: "Bah Bah!"
 iranian_focus.175: "¡[TRK.GetName] rechazó nuestra oferta!"
 iranian_focus.175.t: "¡[TRK.GetName] rechazó nuestra oferta!"
 iranian_focus.175.d: "[TRK.Getname] ha rechazado nuestra oferta para una reunión política en la frontera del río Atrak."
 iranian_events.300.t: "Protestas conmemorativas del levantamiento estudiantil de 1999"
 iranian_events.300.d: "Hoy se cumple un año del levantamiento estudiantil de julio de 1999. Movimientos reformistas en todo el país están animando a los estudiantes a salir a manifestarse, lo que podría poner en peligro la seguridad nacional. Sin embargo, contamos con la presencia de la Basij y la policía antidisturbios, lo que nos permite entrar en la Universidad de Teherán para hacer frente a los manifestantes. Una medida de este tipo podría causar bajas y, si no tenemos cuidado, podría desencadenar un levantamiento nacional."
 iranian_events.300.a: "No importa"
 iranian_events.300.b: "Enviar fuerzas de seguridad"
 iranian_events.301.t: "¡Estallan protestas a nivel nacional!"
 iranian_events.301.d: "Parece que los estudiantes no se han tomado a la ligera nuestras recientes acciones, y han estallado protestas en todo el país. Poco a poco, pareciera que cada vez más gente exige la dimisión del gobierno, aunque no vamos a ir a ninguna parte."
 iranian_events.301.a: "Movilizar NAJA"
 iranian_events.20.t: "Estallan protestas en Khoy"
 iranian_events.20.d: "Tras las recientes protestas a nivel nacional, han estallado manifestaciones en Khoy, poniendo en peligro nuestro control sobre el estado y la región que lo rodea."
 iranian_events.20.a: "Esperemos que se calme"
