 PER_mojahedin_resistance_desc: "\n£PER_desctext_MEK\n\n\n\nLa organización popular Mojahedin, también conocida como MEK, ha sido una espina en el lado de los gobiernos iraníes [PER.GetFlag] desde su fundación en la década de 1960. Sus intentos de asegurar el poder han sido implacables, tanto que se unieron con el enemigo en la guerra [PER.GetFlag] [IRQ.GetFlag] Irán-Iraq durante los años 80.\n\nBasado en nuestra popularidad o legitimidad del gobierno, el MEK será capaz de causar más problemas. Seremos capaces de eliminar el MEK a medida que estabilicemos y mejoremos el país.\n\nRevise el siguiente texto para obtener más información."
 PER_assassinate_the_rajavis: "Asesinato al Rajavi"
 PER_assassinate_the_rajavis_desc: "El culto de Rajavi debe ser puesto al final, con nuestro poder gubernamental en un cenit, tenemos la capacidad de convencer a un miembro del MEK de alto rango para sacar el Rajavi's en una sola marcha."
 PER_surrender_the_government: "Rendición del Gobierno"
 PER_surrender_the_government_desc: "Manejar el MEK es demasiado, con muy poca recompensa, es hora de que empaquemos nuestras bolsas y nos vayamos."
 PER_attack_camp_ashraf: "Ataque Campamento Ashraf"
 PER_attack_camp_ashraf_desc: "Al atacar el campamento Ashraf, podremos forzar al MEK de la región y posiblemente a otra parte del mundo, considerando que esas cucarachas tienen formas de sobrevivir más allá de nuestras capacidades armadas."
 PER_attempt_to_retrieve_mek_defectors: "Intento de recuperar defectos MEK"
 PER_attempt_to_retrieve_mek_defectors_desc: "El MEK se ha negado a dejar que algunos de sus miembros se vayan, y es nuestra responsabilidad salvar a los más desesperados necesitados de nuestra ayuda."
 PER_hazara_uprising: "Levantamiento en Hazaristan"
 PER_hazari_uprising: "Hazaristan in Turmoil"
 PER_cento_decisions: "CENTO"
 PER_cento_decisions_desc: "Restablecida por [PER.GetFlag] §HIrán§!, la alianza §CCENTO§! pretende restaurar la estabilidad regional en Oriente Medio y fuera de él. Fundada inicialmente durante la Guerra Fría, el §CCENTO§! se conocía al principio como Pacto de Bagdad. Sin embargo, tras la Revolución Islámica de [PER.GetFlag] §HIrán§! en 1979, la alianza fracasó y se disolvió rápido.\nSe irán habilitando más decisiones que otorgarán acciones específicas con el tiempo."
 PER_demand_houthi_perform_offensive: "Exigir a los hutíes que realicen una ofensiva"
 PER_invite_afghanistan: "Invitar a [AFG.GetNameWithFlag]"
 PER_invite_afghanistan_desc: "Invitar a Afganistán podría dar a la alianza un punto de apoyo mayor en Asia Central y nos permitirá contrarrestar con mucha más facilidad cualquier posible amenaza del este."
 PER_invite_tajikistan: "Invitar a [TAJ.GetNameWithFlag]"
 PER_invite_tajikistan_desc: "Invitar a Tayikistán podría permitirnos llegar al corazón de Asia Central, y contrarrestar la creciente influencia rusa en la región."
 PER_invite_pakistan_desc: "Al dejar entrar a Pakistán en la facción, habríamos devuelto formalmente a los 3 miembros que estaban en ella hasta la disolución de la alianza CENTO en 1979."
 PER_invite_iraq2: "Invitar a [IRQ.GetNameWithFlag]"
 PER_invite_iraq2_desc: "A pesar de todos sus problemas, Irak sigue siendo un aliado muy necesario. Incorporarlo a la facción permitiría el crecimiento de la influencia de CENTO en el Levante y Arabia."
 PER_invite_lebanon2: "Invitar a [LEB.GetNameWithFlag]"
 PER_invite_lebanon2_desc: "Invitar al Líbano ampliará la alianza más al oeste y mostrará a quienes quieren restaurar el viejo orden de la República Islámica que hemos venido para quedarnos."
 PER_intervene_in_syria: "Intervención en Siria"
 PER_intervene_in_syria_desc: "Pediremos a todos los miembros del CENTO que apoyen el [FSA.GetNameWithFlag] con intervención militar."
 PER_invite_jordan: "Invitar a [JOR.GetNameWithFlag]"
 PER_invite_jordan_desc: "Invitar a los jordanos nos permitirá limitar la expansión de la influencia del CCG más de lo que ya lo ha hecho, sin importar nuestra relación con el Estado [SAU.GetAdjective]."
 PER_invite_egypt: "Invitar a [EGY.GetNameWithFlag]"
 PER_invite_egypt_desc: "Los egipcios han construido una fuerza militar formidable en el norte de África, e ignorarlos sería un error."
 PER_invite_morocco: "Invitar a [MOR.GetNameWithFlag]"
 PER_invite_morocco_desc: "Marruecos está en un punto muy estratégico e importante del mundo. Incorporar al dueño del estrecho de Gibraltar dará a nuestra alianza ventajas significativas a escala global."
 PER_invite_yemen_desc: "Invitar a Yemen al CENTO dará a la alianza el control de otro estrecho estratégico más, el Mar Rojo."
 PER_endorse_a_candidate: "A favor de un candidato"
 PER_endorse_a_candidate_desc: "El Ayatolá puede apoyar públicamente a un candidato para que su candidato preferido gane la nominación presidencial."
 PER_cSad_on_peoples_situation: "CSad sobre la situación de las personas"
 PER_cSad_on_peoples_situation_desc: "Esta decisión estará disponible nuevamente después de 180 días."
 PER_invite_hamas: "Alinearse con el §Y[PAL.Neutral_Muslim_Brotherhood_L]§!"
 PER_kick_hamas: "Romper lazos con el §Y[PAL.Neutral_Muslim_Brotherhood_L]§!"
 PER_invite_PFLP: "Alinearse con el §Y[PAL.Communist-State_L]§!"
 PER_kick_PFLP: "Romper lazos con el §Y[PAL.Communist-State_L]§!"
 PER_invite_PRC: "Alinearse con el §Y[PAL.Mod_Vilayat_e_Faqih_L]§!"
 PER_kick_PRC: "Romper lazos con el §Y[PAL.Mod_Vilayat_e_Faqih_L]§!"
 PER_invite_PIJ: "Alinearse con el §Y[PAL.Vilayat_e_Faqih_L]§!"
 PER_kick_PIJ: "Romper lazos con el §Y[PAL.Vilayat_e_Faqih_L]§!"
 PER_overthrow_saudi: "Derrocar a [SAU.GetFlag] [SAU.GetName]"
 PER_overthrow_saudi_desc: "Ha llegado el momento de traer la libertad en la nación engañosa [SAU.GetAdjective]. La bandera de Shi'ism volará en la Meca en lugar de cualquier otra bandera."
 PER_overthrow_uae: "Derrocar a [UAE.GetFlag] [UAE.GetName]"
 PER_overthrow_uae_desc: ""
 PER_overthrow_oman: "Derrocar a [OMA.GetFlag] [OMA.GetName]"
 PER_overthrow_oman_desc: ""
 PER_bonyad_resources: "La riqueza de la nación"
 PER_bonyad_resources_desc: "Nuestra nación posee una gran riqueza, y esa riqueza debe ser administrada por una autoridad superior. Podemos dar a las bonyads el control de ciertos recursos en algunos estados a cambio de beneficios financieros."
 PER_liquify_khorasan: "Acero khorasan"
 PER_liquify_khorasan_desc: "El acero es abundante en Khorasan, y con eso en mente, si dan a las organizaciones benéficas alguna caridad nada podría ir mal."
 PER_liquify_khuzestan: "Aceite de Khuzestani"
 PER_liquify_khuzestan_desc: "Juzestán tiene petróleo de sobra. Dar a las bonyads algo de control sobre un poco de su petróleo no hará daño."
 PER_liquify_hormuz: "Aceite de Hormuzi"
 PER_liquify_hormuz_desc: "Las costas del Golfo Pérsico, y especialmente Hormuz, tienen un montón de petróleo que podemos vender a los Bonyads."
 PER_liquify_yazd: "Aceite de Yazd"
 PER_liquify_yazd_desc: "Aunque la producción no está en pleno oscilación para el aceite de Yazd, nunca es demasiado tarde para dejar que alguien más nos maneje eso."
 PER_tehran_shiraz_metal: "Teherán y Shiraz Metals"
 PER_tehran_shiraz_metal_desc: "Teherán y Shiraz poseen una buena oferta de metales y minerales que podríamos dar a algunos Bonyads para algunos beneficios fiscales."
 PER_lor_resistance: "Unidades de Resistencia del Lorestan"
 PER_mobilize_the_tribes: "Mobilizar las tribus"
 PER_mobilize_the_tribes_desc: "Ha llegado el momento de movilizar a las tribus de Lorestan. El enemigo ha entrado en las tierras honorables de Lorestan, y estarán seguros de pagar por ello."
 PER_the_Iranian_lobby: "El vestíbulo iraní"
 PER_the_Iranian_lobby_desc: "El Majles ha decretado su apoyo a la creación de un lobby político [PER.GetFlag] iraní en [ISR.GetFlag] Israel y los [USA.GetFlag] Estados Unidos."
 PER_yazd_to_bushehr_railway: "Yazd a Bushehr Railway"
 PER_yazd_to_bushehr_railway_desc: "La ciudad costera de Bushehr necesita desesperadamente conexión con el centro de la nación a través del ferrocarril."
 PER_qom_to_ilam_railway: "Ferrocarril de Qom a Ilam"
 PER_qom_to_ilam_railway_desc: "La región de Kordestan carece de una infraestructura adecuada de transporte y suministro, ha llegado el momento de cambiar ese defecto."
 PER_kerman_to_chabahar: "Ferrocarril de Kermán a Chabahar"
 PER_kerman_to_chabahar_desc: "La región Balochistan se ha descuidado lo suficiente, podemos calmar las tensiones y apaciguar a la gente introduciendo alguna infraestructura ferroviaria adecuada."
 PER_political_backup: "Política de apoyo"
 PER_political_backup_desc: "En tiempos de fracaso político, siempre podemos recurrir a este único programa para revitalizar el apoyo."
 PER_economic_backup: "De apoyo económico"
 PER_economic_backup_desc: "En tiempos de dificultad económica, siempre podemos recurrir a este plan para salvarnos."
 PER_kurdish_troops: "Movilizar a los partidarios kurdos"
 PER_kurdish_troops_desc: "Podemos movilizar a los partidarios kurdos en nuestro gobierno para ayudar a reforzar nuestras fuerzas armadas y prepararnos para proteger la nación por todos los medios."
 PER_kurdish_promise_economy: "Una promesa kurda"
 PER_kurdish_promise_economy_desc: "Hemos prometido a los kurdos que patrocinaremos el crecimiento económico en la región y, a cambio, se centrarán en el desarrollo del sector de servicios."
 PER_kurdish_promise_army: "Una promesa kurda"
 PER_kurdish_promise_army_desc: "Hemos prometido a los kurdos que patrocinaremos trabajos en la industria de armas, y a cambio ofrecerán sus servicios militares."
 PER_reza_pahlavi: "Invitar Reza Pahlavi"
 PER_reza_pahlavi_desc: "El príncipe heredero Reza Pahlavi y sus partidarios han esperado una invitación formal al nuevo gobierno constitucional. Podemos optar por ignorarlos en aras de la democracia, pero invalidaríamos el propósito de nuestro partido en el proceso."
 PER_utilize_party_support: "Movilizar a los partidarios de las Partes"
 PER_utilize_party_support_desc: "Al llamar a los seguidores patriotas y valientes del partido panirani, podremos devolver el golpe al enemigo con más ferocidad que nunca."
 PER_socialist_union_with_iraq: "Invitar a Irak a una Unión Socialista"
 PER_socialist_union_with_iraq_desc: "Podemos invitar al gobierno iraquí a unirse a una unión socialista con nosotros. Este movimiento seguramente será recibido por los comunistas iraquíes."
 PER_integrate_basrah_maysan: "Integrar Basora y Maysán"
 PER_integrate_basrah_maysan_desc: "Los estados del sur iraquí de Basora y Maysan son religiosos, y culturalmente iraníes. Queda poca razón para que ignoremos esas regiones tan importantes."
 PER_integrate_azerbaijan: "Integrar Azerbaiyán"
 PER_integrate_azerbaijan_desc: "Ha llegado el momento de reunificar a los dos azarbaijanos en uno. Los rusos conquistaron la parte norte de Azerbaiyán por incompetencia militar Qajar. Después de la disolución de la Unión Soviética, un estado que había sido durante más de 2000 años parte de Irán se convirtió en su propio estado por primera vez, un recordatorio de nuestra caída de la gracia."
 PER_integrate_armenia: "Integrar Armenia"
 PER_integrate_armenia_desc: "Armenia ha sido durante mucho tiempo un Estado tampón entre nuestra nación y las que están al oeste y al norte. Se hicieron varios intentos de integrar a los armenios en el Irán propiamente dicho, con un éxito moderado en el siglo XVII. Los turcos nos arrebataron a los armenios por el oeste y luego los liberaron como Estado independiente en el siglo XX."
 PER_integrate_turkmenistan: "Integrar Turkmenistán"
 PER_integrate_turkmenistan_desc: "El estado turcomano fue uno forjado fuera de los cimientos sacudidos. Desde el tratado de Turkmenchay, el pueblo turcomano ha sido separado de sus parientes iraníes."
 PER_rebellion_in_kordestan: "Rebelión en [IKR.GetFlag] Kordestan"
 PER_rebellion_in_kordestan_desc: "¡La parte occidental de la nación está ardiendo mientras los actores extranjeros les han suministrado armas para luchar contra nuestro gobierno!"
 PER_rebellion_in_arabistan: "Rebelión en [ARA.GetFlag] Khuzestan"
 PER_rebellion_in_arabistan_desc: "¡El rico ostan de Khuzestan se rebela contra el gobierno central!"
 PER_rebellion_in_balochistan: "Rebelión en [BLC.GetFlag] Balochistan"
 PER_rebellion_in_balochistan_desc: "¡El pueblo de Baluchistán ha formado varias milicias para luchar contra nuestro gobierno!"
 PER_rebellion_in_azerbaijan: "Rebelión en [SAZ.GetFlag] Azerbaiyán del Sur"
 PER_rebellion_in_azerbaijan_desc: "¡El pueblo de Azerbaiyán iraní ha sido armado y financiado por gobiernos extranjeros para luchar contra nuestro estado!"
 PER_establish_hardliner_control: "Establecer el control total de los duros"
 PER_establish_hardliner_control_desc: "Ha llegado el momento de consolidar el control sobre nuestras naciones políticas. Ya no jugaremos el juego de él contra ellos, el verdadero poder siempre ha estado con el Ayatolá. Eliminar la pequeña institución de los Majles cortará gran parte de la cinta roja en el gobierno. Y el puesto de la presidencia fue poco más que una figura que no hizo nada más que la licitación del Ayatolá."
 PER_lift_the_fatwa: "Levanta el Fatwa"
 PER_lift_the_fatwa_desc: "Ha llegado el momento de que nuestro líder recuerde a su Fatwa contra las armas nucleares. Los occidentales no nos han dejado otra opción que perseguir a este disuasivo."
 PER_the_national_flag: "La bandera nacional"
 PER_the_national_flag_desc: "Tenemos la posibilidad de cambiar la bandera nacional por cualquier otra que queramos."
 PER_throttle_internet_speeds: "Velocidades de Internet del acelerador"
 PER_throttle_internet_speeds_desc: "Al estrangular la velocidad de internet, podemos frenar la difusión de información y la organización de nuevas protestas."
 PER_nationwide_security_presence: "Desplegar la fuerza de seguridad nacional"
 PER_nationwide_security_presence_desc: "Al desplegar fuerzas de seguridad en todo el país, podemos intimidar a los manifestantes para que no salgan a las calles."
 PER_fund_pro_government_protests: "Fondo Protests del Gobierno"
 PER_fund_pro_government_protests_desc: "Al financiar y promover protestas progubernamentales, podríamos mostrar a quienes están en la calle que su opinión es errónea."
 PER_deploy_security_khoy_1: "Desplegar fuerzas de seguridad en Khoy"
 PER_deploy_security_west_azarbaijan_1: "Desplegar fuerzas de seguridad en Azarbaiyán Occidental"
 PER_deploy_security_kordestan_1: "Desplegar fuerzas de seguridad en Kurdistán"
 PER_deploy_security_khuzestan_1: "Desplegar fuerzas de seguridad en Juzestán"
