 PER_SYR: "Guerra civil siria"
 PER_SYR_desc: "La guerra civil siria es un conflicto armado multi-siderado en Siria que lucha principalmente entre el gobierno del presidente Bashar al-Assad, junto con sus aliados, y varias fuerzas que se oponen al gobierno. El descontento en Siria, parte de una ola más amplia de protestas árabes de la Primavera de 2011, creció descontento con el gobierno de Assad y se intensificó a un conflicto armado después de que las protestas que pedían su expulsión fueran violentamente reprimidas."
