 iranian_focus.1261.t: "Primeras elecciones de la Segunda República Islámica"
 iranian_focus.1261.d: "Con las bendiciones de [PER.GetLeader], se han celebrado las primeras elecciones de la Segunda República Islámica, con mayoría sobre todos los demás competidores, el ganador de estas elecciones será..."
 PER_separation_of_powers: "Separación de poderes"
 PER_separation_of_powers_desc: "En una verdadera democracia, el poder no debe concentrarse en manos de una sola entidad. Garantizaremos la separación de poderes, con un poder judicial independiente, un poder legislativo fuerte y un poder ejecutivo responsable ante el pueblo."
 PER_separatist_warning: "Amenazas de separatismo"
 PER_separatist_warning_desc: "Se ha preparado un informe detallado para los dirigentes sobre la explotación extranjera de nuestras regiones más vulnerables."
 PER_iraq_reparations: "Reparaciones iraquíes"
 PER_iraq_reparations_desc: "No hemos olvidado la devastación causada por el ejército de Saddam en la década de 1980 y, por lo tanto, debemos recibir las reparaciones que aún no nos han sido pagadas. Después de todo, fuimos los vencedores."
 PER_iraq_reparations_TT: "£decision_icon_small §YDesbloquea§! §Ydecisiones§! para la Compensación por la Guerra entre Irán e Irak"
 iranian_focus.781.t: "Coalición de la Justicia para Contrarrestar la Agresión Iraní"
 iranian_focus.781.d: "Una coalición recientemente formada, denominada \"Coalición de los Justos\" e integrada por varios estados de Oriente Medio, ha anunciado un ataque frontal contra el \"neofascismo iraní\". Esto se produce en un contexto de agresiva expansión iraní en los últimos años, mediante la anexión y subyugación de países vecinos. Esta medida ha dejado perplejos a los líderes mundiales, ya que un conflicto a gran escala en la región podría suponer un desastre para la cadena de suministro global. En todo el mundo existe la esperanza de que todas las partes involucradas resuelvan este asunto cuanto antes, antes de que sea demasiado tarde."
 iranian_focus.781.a: "Interesante"
 iranian_events.900.t: "Información sobre el contenido iraní"
 iranian_events.900.d: "¡Hola! Esperamos que disfrutes del contenido iraní. Lee el siguiente mensaje, que contiene respuestas a algunas preguntas frecuentes.\n\nP: ¿Cómo derroco al gobierno?\nR: Reduciendo la legitimidad a 0. Esto se puede lograr completando ciertos enfoques que reducen la legitimidad. El momento en que la legitimidad cae más rápido es durante las protestas, siendo la primera posible en julio de 2000 con el evento de protesta estudiantil, ¡asegúrate de hacer clic en la opción que indica que comenzará una protesta!\n\nP: Hice la revolución, pero estoy atascado con el ayatolá Montazeri. ¿Cómo puedo cambiar el panorama?\nR: En la parte inferior del árbol de Montazeri se le presentarán dos opciones sobre cómo desea proceder con el gobierno iraní. También puedes elegir a cualquier partido para que llegue al poder tras la revolución. Si eliges la opción que desencadena una guerra civil, sólo tienes que esperar unos 70 días.\n\nP: ¿Cómo puedo lograr que se levanten las sanciones?\nR: Desmantelar tu programa nuclear o lograr que las relaciones con Estados Unidos superen los 20.\n\n----------------------\n\n¡Esperamos que disfrutes jugando a Irán! Deja tus comentarios, informes de errores y preguntas en el Discord o Reddit de Millennium Dawn.\n\n - Equipo de Oriente Medio de Millennium Dawn"
 iranian_events.900.a: "Entendido"
 iranian_focus.197.t: "¡Reza Pahlavi derrocado!"
 iranian_focus.197.d: "A favor de su hermano menor, Ali-Reza, Reza Pahlavi ha sido presionado por las Fuerzas Armadas para que dimita. Ali-Reza abandonó el país silenciosamente en las primeras horas de la mañana de hoy, y por la tarde pronunciará un discurso ante el público. Se cree ampliamente que Ali-Reza se alejará de la agenda actual de la administración."
 iranian_focus.197.a: "Javid Shah"
 PER_brave_men_of_the_sky_desc: "Solo los más valientes pueden proteger nuestro cielo. Este cielo no está vacío, sino que es el lienzo de nuestros sueños, el símbolo de nuestra libertad y la esperanza que las generaciones futuras admiran. Lleva la calidez del primer rayo de sol de la mañana y también es testigo del esplendor del último atardecer al anochecer."
 PER_basij_protest_mobilization: "Basij - Movilizado"
 PER_basij_protest_mobilization_desc: "Los Basij se han movilizado para aplastar cualquier forma de disidencia creciente."
 PER_the_waves_of_iran: "Turbulencia en el [PER.GetFlag] Golfo Pérsico"
 PER_low_popularity_mojahedin: "Baja popularidad"
 PER_medium_popularity_mojahedin: "Media popularidad"
 PER_high_popularity_mojahedin: "Alta popularidad"
 PER_no_pm_set: "No se ha nombrado primer ministro"
 PER_pahlavi_against: "EN CONTRA"
 PER_pahlavi_allied: "ALIADO"
 PER_reformist_better_TT: "Si tenemos un £PER_Mod_Vilayat_e_Faqih §HPresidente reformista§!, podremos eliminar el modificador §HSin vínculos diplomáticos§! con los §H[USA.GetFlag] Estados Unidos§!\n - Esto estará disponible como una decisión presidencial iraní en la decisión §HEnviar diplomáticos a Occidente§!\n - Si las relaciones son lo suficientemente buenas, pueden verse obligados a levantar todas las sanciones en lugar de solo aliviarlas."
 PER_irgc_black_market_exploits: "Explotaciones del mercado negro"
 PER_relax_religious_laws: "Relajar las patrullas religiosas"
 PER_relax_religious_laws_desc: "Tal vez nuestras prácticas de imposición de normas religiosas sean un poco inhumanas... Tal vez sea mejor proceder con un enfoque más relajado."
 PER_ansar_hezbollah: "Ansar-e Hezbollah"
 iranian_focus.198.t: "Aumento del uso de Internet"
 iranian_focus.198.d: "El uso de Internet entre los jóvenes ha comenzado a generalizarse en muchas áreas urbanas, lo que ha suscitado preocupación entre algunas facciones principistas. Cada vez hay más llamados desde los campos reformistas para impulsar el crecimiento de Internet y la nueva era digital, mientras que los principistas piden mayores restricciones."
 iranian_focus.198.a: "La era digital ya está aquí"
 iranian_focus.198.b: "¡Nuestra juventud necesita preocuparse por asuntos más urgentes, como la industria!"
 iranian_focus.199.t: "El Ministerio de Cultura bajo ataque"
 iranian_focus.199.d: "El Ministerio de Cultura ha sido duramente atacado por grupos liberales y grupos internacionales han condenado la censura de varias películas que critican al gobierno. Un portavoz del Ministerio de Cultura ha declarado que las películas deberían tener poca o ninguna participación en los asuntos políticos del país. Muchos están esperando una respuesta oficial de los jefes de Estado sobre este asunto que podría sentar precedente para futuros casos como éste."
 iranian_focus.199.a: "Los artistas son libres de hacer lo que quieran."
 iranian_focus.199.b: "¡Tiene razón, cállenlos!"
 iranian_focus.200.t: "El VIH/SIDA en aumento"
 iranian_focus.200.d: "Una epidemia creciente está en aumento. El SIDA y el VIH han estado infectando silenciosamente a cada vez más personas en todo el país, y figuras religiosas de todos los rincones del país culpan a la 'conducta inmoral'. Estas cifras han llegado incluso al extremo de proponer cambios radicales en el sistema médico para investigar cómo y cuándo se infectaron los individuos."
 iranian_focus.200.a: "Centrarse en el progreso médico"
 iranian_focus.200.b: "¡Detengan este comportamiento inmoral!"
 iranian_focus.201.t: "El ascenso de la 'corriente desviada'"
 iranian_focus.201.d: "Un movimiento creciente conocido como la 'Corriente de la Desviación' está ganando fuerza, particularmente entre los nacionalistas religiosos. Apoyado e inspirado por las ideas políticas de Mahmud Ahmadineyad, y encabezado por Esfandiar Mashaí, el movimiento busca expulsar a la elite religiosa y reemplazar el modo de vida con una escuela iraní del Islam."
 iranian_focus.201.a: "Interesante"
 PER_us_war: "Conflicto estadounidense-iraní"
 PER_us_war_desc: "Décadas de tensiones finalmente han llegado a un punto crítico, ¿Quién prevalecerá?"
 PER_american_iranian_war: "La guerra de Ormuz"
 PER_american_iranian_war_desc: "'Una batalla como nunca antes se había visto. La Tierra se cubrió de acero, las flechas cayeron de las nubes como granizo, el suelo fue desgarrado por cascos, y la sangre fluyó como agua sobre las llanuras.'\n - Ferdousí"
 PER_complete_milad_tower: "Finalizar la construcción de la Torre Milad"
 PER_complete_milad_tower_desc: "Los planos de la torre se materializaron por primera vez en la era prerrevolucionaria, y la Torre Milad es un símbolo de nuestros esfuerzos de modernización y una muestra de prosperidad nacional. Después de muchas décadas de retrasos, la finalización de la Torre Milad demostrará a la nación que su país está avanzando hacia el siglo XXI con toda su fuerza."
 expose_iranian_nuclear_program: "Exponer el Programa Nuclear Iraní"
 expose_iranian_nuclear_program_desc: "Nuestros informes de inteligencia indican que Irán está produciendo algún tipo de arsenal nuclear... ¿Quizás deberíamos informar al mundo sobre esto...?"
 SAZ_independence_war: "Guerra de Independencia"
 SAZ_independence_war_desc: "Décadas de política persocéntrica han llevado a nuestro honorable pueblo al borde de la extinción. Es hora de que tomemos las armas y conquistemos finalmente nuestra merecida independencia, por la fuerza si es necesario."
 PER_western_satan: "Demonios occidentales"
 PER_eastern_satan: "Demonios del Este"
 PER_nextdoor_satan: "Demonios de al lado"
 PER_the_supplier_of_martyrs: "Proveedor de Mártires"
 PER_the_supplier_of_martyrs_desc: "Es hora de que construyamos más drones para que finalmente podamos suministrarle a Alá mártires por docenas."
 iranian_events.2281.t: "Caos en Irán"
 iranian_events.2281.d: "El estado iraní se encuentra en completo desorden y caos, y las fuerzas armadas han sido tomadas por sorpresa por los insurgentes de la Guardia Revolucionaria Islámica en Jorasán. Hemos recibido informes fidedignos que indican que varios grupos separatistas azerbaiyanos han comenzado a formarse en respuesta a este caos, con la esperanza de establecer una mayor autonomía con Irán. Sin embargo, nos han informado sobre varias opciones que podríamos considerar, una de ellas el establecimiento de un protectorado dentro del Azerbaiyán iraní. Nuestros asesores nos han advertido que esto podría ser contraproducente, pero por ahora, todas las opciones están sobre la mesa."
 iranian_events.2281.a: "¡Debemos liberar al pueblo azerbaiyano!"
 iranian_events.2281.b: "No hagas movimientos apresurados"
 PER_attack_saz: "Reclamar [SAZ.GetFlag] Azerbaiyán del Sur"
 PER_attack_saz_desc: "¡Ha llegado el momento de mudarnos y reclamar a Azerbaiyán del Sur, independientemente del costo!"
 iranian_events.302.t: "Khamenei Declara protestas ilegales"
 iranian_events.302.d: "A principios de hoy, Khamenei celebró un discurso sobre la nación en relación con la última ola de protestas. En su discurso declaró que todos los participantes en las protestas callejeras serán etiquetados como colaboradores del 'Regimen ionista' y el 'Imperio Americano', declarando que el castigo será rápido y duro para aquellos arrestados. Ya se han programado varias ejecuciones siguiendo las órdenes de Ayatollah Mahmoud Hashemi Shahroudi. A pesar de esta advertencia, la gente sigue yendo a las calles y reclamando cambios."
 iranian_events.302.a: "Preocupante"
 iranian_events.303.t: "Soleimani da una respuesta dura"
 iranian_events.303.d: "Qassem Soleimani, el comandante de la Fuerza de Quds iraní y el encargado de apagar las protestas ha salido abiertamente y ha declarado que sus fuerzas no dudarán en utilizar la fuerza contra los que se encuentran perturbando la paz pública. En su discurso también afirmó que los que participan en la violencia serán tratados como si fueran un enemigo extranjero invadiendo el territorio iraní. Su discurso coincide con la aparición de grupos de milicias no iraníes del Afganistán y el Pakistán en las protestas callejeras."
 iranian_events.303.a: "Preocupante"
 iranian_events.304.t: "Sentencia creciente monarquista"
 iranian_events.304.d: "En los últimos días, varias personas que participan en las protestas han sido observadas ondeando la vieja bandera León y Sol, la misma que fue volada anteriormente antes del ascenso de la República Islámica. Además de esto, muchos han cantado consignas a favor de la monarquía, pidiendo el regreso del Príncipe Heredero Reza Pahlavi. A pesar de ello, muchos en Irán siguen siendo escépticos de una restauración total de la monarquía, y muchos prefieren uno constitucional o una República franca."
 iranian_events.304.a: "Interesting"
 iranian_events.305.t: "Artesh Rechazar pedidos"
 iranian_events.305.d: "Varias unidades de la Artesh se han negado a usar la fuerza letal contra los manifestantes, con sus comandantes declarando que la orden es ilegal y una violación de su juramento para proteger al pueblo iraní. Aunque algunos comandantes de nivel superior han expresado su apoyo al gobierno, todavía no han declarado abiertamente si van a ayudar o no en la represión contra los manifestantes."
 iranian_events.305.a: "Preocupante"
 iranian_events.306.t: "Las universidades se convierten en camas calientes para la violencia"
 iranian_events.306.d: "Varias universidades de todo el país, como la Universidad de Teherán, se han convertido en camas calientes para la violencia entre los estudiantes, con frecuentes enfrentamientos con estudiantes antigubernamentales. Esto ha llevado a muchas universidades de todo el país a cerrar temporalmente, y a tomar medidas para investigar los enfrentamientos para expulsar o suspender estudiantes que se dedican a la violencia."
 iranian_events.306.a: "Preocupante"
 iranian_events.307.t: "Protesta el fracaso para ganar Momentum"
 iranian_events.307.d: "Varias manifestaciones dirigidas por el gobierno en la plaza principal de Teherán no pudieron conseguir tracción, con sólo unos pocos miles de personas apareciendo. Esto viene cuando el gobierno se movió para movilizar a los partidarios del régimen para impugnar la actual ola de manifestantes anti-regime que inundan las calles casi diariamente. Tal pequeña participación es indicativa de los regímenes crecientes impopularidad y falta de legitimidad entre la población."
 iranian_events.307.a: "Preocupante"
 iranian_events.308.t: "Países vecinos expresa preocupación"
 iranian_events.308.d: "Varios países vecinos como Turquía, Arabia Saudita y Pakistán han expresado su preocupación por la inestabilidad de nuestro país. Esta preocupación incluso se ha convertido en votos para proteger a ciertos grupos, y Turquía declara que está dispuesta a intervenir para proteger al pueblo de Azerbaiyán del Sur en el caso de que decidan 'determinar su propio futuro'. Estos llamados han comenzado a preocupar a nuestro gobierno, con temores de intervención extranjera en aumento entre algunos miembros del gabinete."
 iranian_events.308.a: "Preocupante"
 iranian_events.309.t: "Fuerzas Basij frecuentemente abrumadas"
 iranian_events.309.d: "Un informe reciente ha indicado que las fuerzas de Basij están constantemente abrumadas por manifestantes antirregímenes, y varios han sido asesinados en la línea de acción. Los funerales respaldados por el Estado público se celebran casi diariamente para los muertos, y hay pequeñas multitudes de partidarios del gobierno que están presentes. Sin embargo, hay una tendencia constante de que las fuerzas estén abrumadas y atacadas por multitudes de personas enojadas con poco o ningún plan gubernamental listo para abordar la cuestión."
 iranian_events.309.a: "Preocupante"
 iranian_events.310.t: "Reformistas Rally Bajo Montazeri"
 iranian_events.310.d: "Varios políticos y figuras reformistas han declarado abiertamente su deserción del gobierno y han afirmado que están arrojando su peso detrás del clérigo reformista, Ayatollah Montazeri. Este movimiento ha puesto presión adicional sobre Khamenei que fue nombrado por Jomeini como el sucesor en la casa de Montazeri. Se han dado órdenes a las fuerzas del IRGC de arrestar a varios políticos reformistas, incluido el Presidente Khatami, pero sus lugares son desconocidos desde ahora."
 iranian_events.310.a: "Preocupante"
 iranian_events.311.t: "IRGC hace retroceso en masa"
 iranian_events.311.d: "Tras el aumento de la violencia contra las fuerzas del IRGC y Basij, Qassem Soleimani salió y declaró públicamente que alguien visto fuera después de las 4:00 PM será despedido. Esto viene siguiendo un cierre nacional de Internet, con muchos servicios esenciales como los bancos que se oscurecen, poniendo más presión sobre la economía vulnerable. Hay temores de que esta represión pueda llevar a un mayor odio hacia el gobierno, demostrando que se necesita una dependencia excesiva de la fuerza sólo para mantenerse en el poder."
 iranian_events.311.a: "Preocupante"
 iranian_events.312.t: "Bloody Wednesday"
 iranian_events.312.d: "Un incidente tuvo lugar en los últimos días, donde se determinó que varios miles de manifestantes fueron asesinados siguiendo las órdenes dictadas por Khamenei para «poner las protestas por cualquier medio necesario». Este incidente está siendo bautizado como sangriento febrero, con indignación creciendo entre los manifestantes y las personas en el extranjero. Aunque el número exacto de los muertos sigue siendo desconocido, se ha determinado que la magnitud de los muertos es tan importante que los hospitales y las morgues han sido invadidos con los muertos y heridos."
 iranian_events.312.a: "¿Qué ha venido a esta nación?"
 PER_khargh_lost: "Kharg - Sin acceso"
 PER_khargh_lost_desc: "Parece que la isla crucial de Kharg ha sido ocupada o perdida para las fuerzas enemigas, y como resultado, nuestro sector de combustibles fósiles está sufriendo."
 PER_khargh_lifeline: "Dependencia de la Isla Kharg"
 PER_khargh_lifeline_desc: "El sangre de nuestra nación fluye a través de una sola arteria. Si se cortiera, las consecuencias serían catastróficas.\n§W--------------§!\nSi §HKharg§! está ocupado por fuerzas enemigas o tiene su infraestructura dañada, nuestro sector energético será §Rdevastado§!.\n§W--------------§!\nEste modificador será §RRemovido§! sin consecuencia si completamos más de 6 enfoque bajo la rama focal §H Tercer Plan de Desarrollo§!. Nosotros §R no§! podremos eliminar este espíritu nacional si completamos la rama §HEmbracing the Open Market§!."
 PER_hormuz_blocked_gang: "Hormuz Blocked"
 PER_hormuz_blocked_gang_desc: "El liderazgo iraní ha decidido bloquear el Estrecho de Hormuz, causando estragos económicos en el mundo."
 iranian_events.910.t: "Irán cierra el estrecho de Hormuz"
 iranian_events.910.d: "Irán ha dado el paso sin precedentes de cerrar el Estrecho de Hormuz, la estrecha vía fluvial por la que una parte significativa del suministro mundial de petróleo fluye cada día. Las fuerzas navales iraníes, apoyadas por baterías de misiles costeros y naves de ataque rápido, se han movido para bloquear el tráfico comercial y declarar el estrecho fuera de los límites. Los Tankers están retrocediendo mientras otros permanecen varados en los puertos del Golfo, enviando ondas de choque a través de mercados energéticos globales y elevando miedos a una confrontación más amplia. Al amenazar a uno de los puntos marítimos más vitales del mundo, Teherán espera presionar a sus adversarios y demostrar su capacidad para perturbar el comercio mundial, pero los riesgos de movimiento que provocan una respuesta internacional decidida a restaurar la libertad de navegación."
 iranian_events.910.a: "Un desarrollo aterrador"
 iranian_events.911.t: "Irán abre el estrecho de Hormuz"
 iranian_events.911.d: "En un giro repentino de los acontecimientos, la cepa iraní ha decidido que ahogar los mundos más importantes ya no es necesario, y por lo tanto ha comenzado a reabrir el estrecho para el transporte comercial. Irán ha declarado que se mantiene comprometido a garantizar la navegación mundial y el comercio sigue siendo protegido«, y ha tranquilizado a aliados y socios por igual que Irán no busca cerrar el estrecho para el futuro previsible. Sin embargo, los opositores de [PER.capital.GetCapitalVictoryPointName] declaran que no se puede confiar en Irán y que sólo es cuestión de tiempo hasta que Irán cierre el estrecho una vez más."
 iranian_events.911.a: "El mundo puede respirar una vez más"
 PER_kharg_tt: "£text_icon_kaldanger Completar este enfoque significa que mantendremos permanentemente el espíritu nacional §HKharg Island Dependency§!!"
 PER_control_musandam_for_full_effect_TT: "Porque no controlamos Musandam, no tenemos el control total del estrecho\n - Como resultado, nuestro bloqueo no tendrá efecto completo\n - ¡Si pudiéramos controlar a Musandam, duplicaríamos el efecto!"
 PER_reopen_hormuz: "Reabrir Ormuz"
 PER_reopen_hormuz_desc: "Es hora de reabrir por fin el Estrecho de Ormuz; ojalá el mundo haya aprendido la lección."
 PER_block_hormuz: "Bloquear el Estrecho de Ormuz"
 PER_block_hormuz_desc: "Los planificadores y generales de alto rango están pidiendo un cierre completo del Estrecho de Hormuz, afirmando que la victoria sólo puede lograrse si estrangulamos el suministro de petróleo mundial."
 hormuz_blocked_tt: "Bloqueo iraní de Hormuz"
 hormuz_blocked_tt_NOT: "Bloqueo iraní de Hormuz"
 iranian_flavor.1.t: "Salón del Libro Internacional de Teherán"
 iranian_flavor.1.d: "La Feria Internacional del Libro de Teherán se ha convertido en uno de los eventos literarios más grandes del Oriente Medio, atrayendo editores de decenas de países. La feria presenta una oportunidad para mostrar nuestro patrimonio cultural y promover la alfabetización, pero en expansión requerirá financiación gubernamental. Algunos funcionarios argumentan que la inversión pagará dividendos en poder blando y educación, mientras que otros creen que los editores deben soportar los costos mismos."
 iranian_flavor.1.a: "Financiación de la ampliación"
 iranian_flavor.1.b: "Deja que los editores se encarguen de ello"
 iranian_flavor.2.t: "Teherán Metro Line 1 Opens"
 iranian_flavor.2.d: "Después de años de retrasos en la construcción y sobrecostos presupuestarios, Teherán Metro Line 1 finalmente se ha abierto al público. Se espera que la línea de 28 kilómetros que conecta el norte y el sur de Teherán alivie la famosa congestión de tráfico de la capital. Los urbanistas ya están elaborando propuestas para líneas adicionales, aunque el costo de la expansión sigue siendo un punto de debate."
 iranian_flavor.2.a: "Fondo más expansión del metro"
 iranian_flavor.2.b: "Celebrar este hito"
 iranian_flavor.3.t: "Desarrollo del puerto de Chabahar"
 iranian_flavor.3.d: "Los ingenieros han presentado ambiciosos planes para el desarrollo del Puerto Chabahar en el Golfo de Omán. Situado fuera del Estrecho de Hormuz, el puerto ofrece una alternativa estratégica para el comercio que supera los carriles marítimos del Golfo Pérsico congestionados. Una inversión importante podría transformar el puerto en un centro comercial regional, mientras que un enfoque más cauteloso vería mejoras incrementales durante los próximos años."
 iranian_flavor.3.a: "Invertir fuertemente en Chabahar"
 iranian_flavor.3.b: "Desarrollarlo gradualmente"
 iranian_flavor.4.t: "Rally de la Bolsa de Valores de Teherán"
 iranian_flavor.4.d: "La Bolsa de Valores de Teherán ha experimentado un rallye notable, con el índice TEPIX surgiendo para registrar altos. Los inversores nacionales, muchos de ellos comerciantes por primera vez, están generando ahorros en el mercado. El gobierno se enfrenta a una opción entre alentar este entusiasmo, que podría impulsar un crecimiento económico más profundo, o introducir regulaciones para prevenir una burbuja especulativa."
 iranian_flavor.4.a: "Fomento de la inversión"
 iranian_flavor.4.b: "Regular para prevenir una burbuja"
 iranian_flavor.5.t: "Controversias del Golfo Pérsico"
 iranian_flavor.5.d: "Varios estados árabes y organizaciones internacionales han comenzado a utilizar el término «Cerdío Árabe» en lugar del histórico «Pértigo Pérsico».El tema ha suscitado indignación entre el público e intelectuales por igual, que ven el nombre como inseparable de nuestra identidad nacional. Podríamos lanzar una campaña de preservación cultural para reafirmar el nombre histórico, emitir una protesta diplomática formal o optar por ignorar la provocación."
 iranian_flavor.5.a: "Inicie una campaña cultural"
 iranian_flavor.5.b: "Emitir una protesta diplomática"
 iranian_flavor.5.c: "Ignora la provocación"
 iranian_flavor.6.t: "Nuevas reservas de petróleo descubierto"
 iranian_flavor.6.d: "Las encuestas geológicas en la provincia de Khuzestan han confirmado el descubrimiento de importantes nuevas reservas de petróleo bajo las estribaciones de Zagros. La National Iranian Oil Company estima que el hallazgo podría agregar miles de millones de barriles a nuestras reservas comprobadas. La pregunta ahora es si la extracción rápida para aumentar los ingresos inmediatamente, o tomar un enfoque medido para garantizar la sostenibilidad a largo plazo del campo."
 iranian_flavor.6.a: "Extracción rápida"
 iranian_flavor.6.b: "Adoptar un enfoque medido"
 iranian_flavor.7.t: "Ampliación del campo de gas South Pars"
 iranian_flavor.7.d: "El desarrollo del campo de gas South Pars, la mayor reserva mundial de gas natural compartida con Qatar, ha llegado a un punto crítico de decisión. Los ingenieros informan que la próxima fase de desarrollo puede priorizar el suministro de energía nacional, reduciendo nuestra dependencia del combustible importado o enfocarnos en construir infraestructura de exportación a gas pipa a mercados vecinos para obtener ingresos."
 iranian_flavor.7.a: "Priorizar la oferta nacional"
 iranian_flavor.7.b: "Maximizar las exportaciones de gas"
 iranian_flavor.8.t: "Acelera el drenaje cerebral"
 iranian_flavor.8.d: "Un nuevo informe del Fondo Monetario Internacional ha clasificado a nuestro país entre los más altos del mundo para el drenaje cerebral, con un estimado de 150.000 profesionales instruidos que emigran anualmente. Las universidades están produciendo graduados de clase mundial en ingeniería, medicina y ciencias, sólo para verlos salir a oportunidades en el extranjero. Podríamos invertir en subsidios de investigación y mejores condiciones de trabajo para retener talento, o aceptar la situación y redirigir recursos en otros lugares."
 iranian_flavor.8.a: "Crear incentivos de investigación"
 iranian_flavor.8.b: "Aceptar la situación"
 iranian_flavor.9.t: "Exportación de alfombras Renacimiento"
 iranian_flavor.9.d: "Las alfombras persas, una de nuestras exportaciones culturales más icónicas, han visto un aumento en la demanda internacional. Artisans en Isfahan, Tabriz y Kerman están reportando libros de orden completo, y el apetito global por alfombras tejidas a mano parece insaciable. El gobierno podría invertir en programas de capacitación y talleres para apoyar la artesanía tradicional, o permitir que el mercado determine la dirección de la industria."
 iranian_flavor.9.a: "Invertir en artesanías tradicionales"
 iranian_flavor.9.b: "Que el mercado decida"
 iranian_flavor.10.t: "Expansión de la zona comercial Kish Island"
 iranian_flavor.10.d: "Kish Island, nuestra principal zona de libre comercio en el Golfo Pérsico, ha atraído creciente interés por inversores extranjeros y turistas. Las autoridades locales proponen una expansión significativa de la infraestructura comercial de la zona, incluyendo nuevos hoteles, complejos comerciales y una instalación portuaria más grande. La expansión costaría una suma sustancial pero podría posicionar a Kish como un rival para Dubai por negocios regionales."
 iranian_flavor.10.a: "Ampliar la zona de libre comercio"
 iranian_flavor.10.b: "Mantener el alcance actual"
 iranian_flavor.11.t: "Irán Khodro golpea la producción Milestone"
 iranian_flavor.11.d: "Irán Khodro, nuestro mayor fabricante de automóviles y uno de los más grandes del Medio Oriente, ha alcanzado un hito significativo en la producción, lanzando su vehículo un millón fuera de la línea de montaje este año. La dirección de la empresa está buscando apoyo gubernamental para la próxima fase de crecimiento. Proponen invertir en investigación y desarrollo para mejorar la calidad de los vehículos y la eficiencia del combustible, o simplemente ampliar las líneas de producción existentes para aumentar el volumen de producción."
 iranian_flavor.11.a: "Invest in R&D"
 iranian_flavor.11.b: "Ampliar las líneas de producción"
 iranian_flavor.12.t: "Expansión del molino de acero Isfahan"
 iranian_flavor.12.d: "La Mobarakeh Steel Company en Isfahan, el mayor productor de acero del Medio Oriente, ha presentado planes de expansión al Ministerio de Industrias. La empresa propone modernizar sus instalaciones existentes con nuevos hornos de arco eléctrico importados desde el extranjero, lo que aumentaría la eficiencia o ampliaría la capacidad cruda utilizando tecnología nacional para aumentar la producción total."
 iranian_flavor.12.a: "Modernizar con nuevos hornos"
 iranian_flavor.12.b: "Ampliación de la capacidad nacional"
 iranian_flavor.13.t: "Torre Milad se abre en Teherán"
 iranian_flavor.13.d: "La Torre Milad, la estructura más alta del país y la torre de telecomunicaciones sexta en el mundo, ha abierto sus puertas al público. Con 435 metros en el norte de Teherán, la torre cuenta con una cubierta de observación, un restaurante giratorio y amplios equipos de telecomunicaciones. Los funcionarios están debatiendo si desarrollar la zona circundante como centro turístico o utilizar principalmente la torre como centro nacional de radiodifusión."
 iranian_flavor.13.a: "Desarrollar la infraestructura turística"
 iranian_flavor.13.b: "Úsalo como un centro de radiodifusión"
 iranian_flavor.14.t: "Registro Saffron Harvest"
 iranian_flavor.14.d: "La cosecha de azafrán de este año ha roto todos los registros anteriores, con las provincias de Khorasan Razavi y Khorasan del Sur produciendo más de 200 toneladas de la especia preciosa. Como el mayor productor de azafrán del mundo, que representa más del 90% de la producción mundial, estamos en una posición única para capitalizar esta recompensa. Los funcionarios agrícolas sugieren ampliar el cultivo a nuevas regiones o centrarse en maximizar el valor de exportación de este producto premium."
 iranian_flavor.14.a: "Ampliar el cultivo de azafrán"
 iranian_flavor.14.b: "Enfoque sobre exportaciones de primas"
 iranian_flavor.15.t: "Contaminación del aire de Teherán"
 iranian_flavor.15.d: "Los niveles peligrosos de contaminación atmosférica han obligado a cerrar escuelas y oficinas gubernamentales en Teherán. El Índice de Calidad del Aire ha alcanzado niveles peligrosos, con partículas finas que superan los límites seguros por un factor de diez. Los hospitales están reportando un aumento en las admisiones respiratorias. Los funcionarios deben decidir entre cerrar fábricas y restringir el uso de vehículos, lo que afectaría a la economía, o simplemente emitir asesorías sanitarias mientras mantiene funcionando la industria."
 iranian_flavor.15.a: "Cerrar fábricas temporalmente"
 iranian_flavor.15.b: "Publicar asesorías sanitarias solamente"
 iranian_flavor.16.t: "Volatilidad de la moneda real"
 iranian_flavor.16.d: "El rial iraní ha experimentado graves fluctuaciones en el mercado abierto, perdiendo una parte significativa de su valor frente a las principales monedas extranjeras. Los ciudadanos ordinarios se apresuran a cambiar sus ahorros por dólares y oro, mientras que las empresas luchan con costos impredecibles de importación. El Banco Central podría intervenir inyectando reservas de divisas para estabilizar el tipo de cambio, o permitir que el mercado encuentre su propio equilibrio."
 iranian_flavor.16.a: "Intervene para estabilizar el rial"
 iranian_flavor.16.b: "Deja que el mercado se corrija"
 iranian_flavor.17.t: "Refinería de estrellas del Golfo Pérsico"
 iranian_flavor.17.d: "La construcción ha comenzado en la Refinería Estrella del Golfo Pérsico en Bandar Abbas, diseñada para ser la refinería de condensado de gas más grande del mundo. Una vez completado, la refinería procesará condensados del campo de gas South Pars, reduciendo nuestra dependencia de la gasolina importada. El proyecto puede ser acelerado con financiación adicional para alcanzar la finalización antes, o proceder en un cronograma estándar para minimizar la tensión financiera."
 iranian_flavor.17.a: "Construcción de vía rápida"
 iranian_flavor.17.b: "Plazo de construcción estándar"
 iranian_flavor.18.t: "Crisis del agua de Isfahan"
 iranian_flavor.18.d: "El Zayandeh Rud, la sangre de vida de la provincia de Isfahan y uno de nuestros ríos más importantes, se ha quedado seco por tercer año consecutivo. Los agricultores de aguas abajo abandonan sus campos, y el icónico puente Si-o-se-pol ahora no abarca nada más que la tierra agrietada. La crisis hídrica exige acción inmediata: podemos autorizar transferencias de agua de emergencia desde las provincias vecinas, imponer un rationing estricto o encargar un nuevo proyecto de presa para asegurar el suministro a largo plazo."
 iranian_flavor.18.a: "Transferencia de agua de emergencia"
 iranian_flavor.18.b: "Ejecutar el racionamiento del agua"
 iranian_flavor.18.c: "Comisión una nueva presa"
 iranian_flavor.19.t: "Turismo Surge"
 iranian_flavor.19.d: "Los turistas extranjeros han aumentado dramáticamente, con visitantes atraídos a nuestros sitios del Patrimonio Mundial de la UNESCO en Isfahan, Shiraz y Persepolis. Los hoteles de las principales ciudades están informando sobre la ocupación casi total, y los operadores turísticos están luchando para mantenerse al día con la demanda. El Ministerio del Patrimonio Cultural está solicitando fondos para mejorar la infraestructura de hospitalidad, aunque algunos funcionarios argumentan que simplemente debemos recoger el déficit de ingresos sin gastos adicionales."
 iranian_flavor.19.a: "Invertir en la hospitalidad"
 iranian_flavor.19.b: "Capitalizar los ingresos"
 iranian_flavor.20.t: "Khuzestan Floods"
 iranian_flavor.20.d: "Las precipitaciones sin precedentes han causado inundaciones catastróficas en toda la provincia de Khuzestan, que inundan cientos de aldeas y desplazan a decenas de miles de familias. Las aguas inundadas han dañado la infraestructura petrolera, han perturbado la agricultura y han abrumado los servicios locales de emergencia. Debemos decidir cómo responder: desplegar los militares para operaciones de socorro rápido, montar una respuesta en casos de desastre dirigida por civiles financiada con cargo al tesorería o hacer un llamamiento a las organizaciones internacionales para que presten asistencia humanitaria."
 iranian_flavor.20.a: "Despliegue el ejército"
 iranian_flavor.20.b: "Respuesta a los desastres civiles"
 iranian_flavor.20.c: "Llamamiento a la ayuda internacional"
 iranian_flavor.50.t: "Defectar a oficiales de IRGC"
 iranian_flavor.50.d: "Un grupo de oficiales del IRGC de rango medio ha cruzado las líneas delanteras bajo cubierta de oscuridad, alegando que desean desertar a nuestro lado. Dicen que están desilusionados con el liderazgo del IRGC y quieren luchar por un Irán libre. Su conocimiento de las tácticas y posiciones del IRGC podría ser inestimable, pero siempre existe el riesgo de que algunas plantas puedan ser enviadas para reunir inteligencia en nuestras operaciones."
 iranian_flavor.50.a: "Bienvenidas a nuestras filas."
 iranian_flavor.50.b: "Enséñalos cuidadosamente primero"
 iranian_flavor.50.c: "¡Déjenlos!"
 iranian_flavor.51.t: "Campos de petróleo amenazados"
 iranian_flavor.51.d: "Las fuerzas del IRGC están avanzando peligrosamente cerca de las principales instalaciones de producción de petróleo en el sur. Si se apoderan de estos campos, sería un golpe devastador para nuestra economía de guerra y le daría al enemigo una fuente masiva de ingresos. Nuestros comandantes están solicitando refuerzos para establecer un perímetro defensivo alrededor de la infraestructura petrolera, pero sacar tropas de la primera línea conlleva sus propios riesgos."
 iranian_flavor.51.a: "Desviar tropas para proteger los campos petrolíferos"
 iranian_flavor.51.b: "Enfoque en las líneas delanteras"
 iranian_flavor.52.t: "Emisiones de propaganda de la IRGC"
 iranian_flavor.52.d: "El IRGC ha comenzado a transmitir mensajes propagandísticos a través de múltiples frecuencias radiofónicas y plataformas de redes sociales, pidiendo a los soldados que pongan sus armas y civiles para resistir al gobierno. Las transmisiones cuentan con sermones religiosos, promesas de amnistía para los desertores y afirma que las potencias extranjeras están manipulando el conflicto. Some border communities are reportedly being swayed by these messages."
 iranian_flavor.52.a: "Mete sus frecuencias"
 iranian_flavor.52.b: "Ignoralo."
 iranian_flavor.53.t: "Actividad Basij detrás de nuestras líneas"
 iranian_flavor.53.d: "Report are flooding in from rear-area commanders about Basij militia cells operating behind our lines. Estos paramilitares, leales al IRGC, han estado saboteando depósitos de suministros, emboscando convoyes e intimidando a funcionarios locales. Su estructura descentralizada les hace difícil arraigarse, y se mezclan perfectamente con la población civil."
 iranian_flavor.53.a: "Lanza un barrido de contrainsurgencia"
 iranian_flavor.53.b: "Armar grupos locales de defensa civil"
 iranian_flavor.54.t: "éxodo civil"
 iranian_flavor.54.d: "Decenas de miles de civiles están huyendo de las zonas de primera línea, traficando carreteras y ciudades abrumadoras en la parte trasera. Las familias enteras llevan lo poco que pueden en sus espaldas, buscando seguridad del fuego cruzado. La crisis de los refugiados está agotando nuestros recursos y frenando la logística militar. Algunos funcionarios sugieren establecer campamentos organizados, mientras que otros argumentan que la población desplazada podría ser redireccionada para reforzar la fuerza de trabajo en tiempos de guerra."
 iranian_flavor.54.a: "Establecimiento de campamentos de refugiados"
 iranian_flavor.54.b: "Redirigir refugiados a la producción de guerra"
 iranian_flavor.55.t: "Redes de contrabando de armas"
 iranian_flavor.55.d: "El caos de la guerra civil ha dado lugar a amplias redes de contrabando de armas que operan a lo largo de nuestras fronteras. Las armas están fluyendo desde múltiples direcciones, algunas terminan con las fuerzas del IRGC y algunas disponibles en el mercado negro. Nuestros servicios de inteligencia informan que estas mismas redes podrían ser explotadas para adquirir equipos que necesitamos desesperadamente, pero tolerar el contrabando también podría fortalecer al enemigo."
 iranian_flavor.55.a: "Explotar las redes para nosotros mismos"
 iranian_flavor.55.b: "Averiguar todo el contrabando"
 iranian_flavor.56.t: "Air Scramble sobre Teherán"
 iranian_flavor.56.d: "Se han detectado aeronaves de IRGC que se acercan al espacio aéreo de Teherán. Nuestra fuerza aérea ha revuelto interceptores para enfrentar la amenaza, y se está desarrollando un tenso compromiso aéreo sobre la capital. El resultado de este encuentro tendrá implicaciones significativas para la superioridad aérea en el teatro central. Comando quiere saber si comprometer escuadrones adicionales para defender la capital o redirigir los activos aéreos para apoyar operaciones terrestres en las primeras líneas."
 iranian_flavor.56.a: "Defender el cielo de la capital"
 iranian_flavor.56.b: "Priorizar el apoyo terrestre"
 iranian_flavor.57.t: "Hezbollah Advisors Spotted"
 iranian_flavor.57.d: "Los informes de inteligencia confirman que Hezbollah ha enviado asesores militares experimentados y veteranos de combate para ayudar al IRGC. Estos combatientes traen años de experiencia en combate desde Líbano y Siria, y su experiencia en guerra urbana y tácticas guerrilleras ya se está sintiendo en ciertos sectores de primera línea. Nuestro cuerpo diplomático está instando a una denuncia pública, mientras que los comandantes de campo quieren dirigir sus rutas de suministro."
 iranian_flavor.57.a: "Denunciar a Hezbollah públicamente"
 iranian_flavor.57.b: "Metan sus líneas de suministro"
 iranian_flavor.58.t: "Cobertura Internacional de Medios"
 iranian_flavor.58.d: "La guerra civil ha atraído un intenso escrutinio de los medios internacionales. Los periodistas extranjeros y los camarógrafos están solicitando acceso a las líneas de frente y campamentos de refugiados. La concesión del acceso podría generar una cobertura simpática que construya el apoyo internacional a nuestra causa, pero también corre el riesgo de exponer los detalles operacionales y podría invitar a interferencias extranjeras no deseadas en nuestros asuntos internos."
 iranian_flavor.58.a: "Acceso de los periodistas"
 iranian_flavor.58.b: "Restringir el acceso de los medios de comunicación"
 iranian_flavor.59.t: "Rejilla de energía Sabotaged"
 iranian_flavor.59.d: "Una operación coordinada de sabotaje ha eliminado secciones claves de la red nacional de energía, sumergiendo varias provincias en la oscuridad. Los agentes alineados por IRGC son sospechosos de atacar torres de transmisión y estaciones transformadoras de alta tensión. Los hospitales están operando con generadores de respaldo, las fábricas tienen terreno para detenerse, y la moral civil está cayendo. Necesitamos decidir cómo asignar nuestros limitados recursos de ingeniería."
 iranian_flavor.59.a: "Implementar ingenieros para reparar la red"
 iranian_flavor.59.b: "Potencia de racionamiento para uso militar"
 iranian_flavor.60.t: "Kurdish Fighters Oferta Alianza"
 iranian_flavor.60.d: "Representantes de unidades kurdas de peshmerga en las provincias occidentales se han acercado a nuestro mando con una oferta de alianza contra el IRGC. Están dispuestos a comprometer luchadores de montaña experimentados a nuestra causa, pero su precio es una garantía de mayor autonomía para las regiones kurdas después de la guerra. Aceptar su ayuda podría inclinar el equilibrio en el oeste, pero sienta un precedente peligroso para el separatismo étnico."
 iranian_flavor.60.a: "Aceptar su ayuda"
 iranian_flavor.60.b: "Decline - no concesiones sobre la autonomía"
 iranian_flavor.61.t: "Estrecho de Hormuz Standoff"
 iranian_flavor.61.d: "Las fuerzas navales del IRGC, incluyendo naves de ataque rápido y buques de carga de minas, están tratando de impugnar el control del Estrecho de Hormuz. El estrecho sigue siendo la línea de vida para nuestras exportaciones de petróleo y un punto crítico para el transporte marítimo internacional. Nuestros almirantes proponen una operación naval decisiva para asegurar la vía de navegación, pero esto cerraría efectivamente el tráfico comercial y dañaría nuestras relaciones comerciales."
 iranian_flavor.61.a: "Asegurar el estrecho con la fuerza"
 iranian_flavor.61.b: "Mantener el estrecho abierto para el comercio"
 iranian_flavor.62.t: "Medidas de economía de guerra"
 iranian_flavor.62.d: "La prolongada guerra civil está cobrando un gran impacto en la economía. La producción industrial ha disminuido considerablemente, los precios están aumentando y los bienes esenciales se están volviendo escasos. El Ministerio de Economía está presentando dos propuestas competitivas: una amplia nacionalización de industrias clave para centralizar la producción en el esfuerzo de guerra, o un conjunto de incentivos fiscales y subvenciones para mantener a las empresas privadas operativas y mantener cierta semejanza de la normalidad económica."
 iranian_flavor.62.a: "Nacionalizar industrias clave"
 iranian_flavor.62.b: "Ofrezca incentivos fiscales a la industria privada"
 iranian_flavor.63.t: "Garantías a la demanda de las minorías"
 iranian_flavor.63.d: "Líderes de Azeri, Baloch y comunidades árabes han presentado una petición conjunta que exige garantías escritas de los derechos culturales y la representación regional en cualquier asentamiento posterior a la guerra. Argumentan que sus comunidades han tenido una parte desproporcionada de los combates y merecen una participación en el futuro de la nación. Las reformas prometedoras podrían asegurar su lealtad continua y aumentar el reclutamiento, pero las promesas de guerra tienen una manera de convertirse en obligaciones vinculantes."
 iranian_flavor.63.a: "Promesas reformas de autonomía"
 iranian_flavor.63.b: "La unidad nacional primero - no concesiones"
 iranian_flavor.64.t: "Captured IRGC Documentos"
 iranian_flavor.64.d: "Durante una redada en un puesto de mando del IRGC, nuestras fuerzas capturaron un grupo de documentos clasificados que detallan los despliegues de tropas, las rutas de suministro y las comunicaciones internas entre altos comandantes del IRGC. Los documentos también contienen pruebas de corrupción, malversación y abusos contra los derechos humanos. Esta caída de inteligencia podría utilizarse de varias maneras: planificar operaciones militares, emprender una campaña propagandística que exponga los errores del IRGC o compartir con gobiernos extranjeros a cambio de apoyo diplomático."
 iranian_flavor.64.a: "Gastos en operaciones militares"
 iranian_flavor.64.b: "Filtración para exponer la corrupción del IRGC"
 iranian_flavor.64.c: "Compartir con aliados extranjeros"
 IKR_fight_for_our_survival: "Lucha por nuestra supervivencia"
 IKR_fight_for_our_survival_desc: "Con fuerzas iraníes presionando desde todos los lados, cada paso de aldea y montaña se ha convertido en una línea en la arena. Las milicias kurdas luchan con ferocidad desesperada para defender su patria."
 PER_hashd_al_shaabi_desc: "Las Fuerzas Populares de Movilización ya están al lado de Irak contra el enemigo común. Con la orientación y financiación del IRGC, sus filas se hincharán y su lealtad a la República Islámica se profundizará."
 iranian_focus.58.c1: "Trataremos este asunto más tarde."
 PER_attack_them_later_TT: "§H ¡RECOMENDADO!§!\n- Podremos volver a invadir [SAZ.GetFlag] §HAzerbaiján Sur§! más tarde"
 PER_towards_our_first_carrier: "Marchando hacia nuestro primer portaaviones"
 PER_towards_our_first_carrier_desc: "No somos conocidos por producir naves de clase mundial o activos navales, en cambio, históricamente nos hemos inclinado hacia la guerra terrestre. Sin embargo, la edad moderna requiere más que sólo lanzas y escudos. Una torreta operada por un solo hombre en una habitación con aire acondicionado puede limpiar todo un pelotón de tropas en el sol del desierto caliente. Es hora de que finalmente muerdamos la bala y marchemos hacia nuestro primer portaaviones para finalmente domar los mares salvajes de una vez por todas."
 PER_one_giant_leap_forward: "Un salto gigante hacia adelante"
 PER_one_giant_leap_forward_desc: "Mientras que para el resto del mundo la rápida modernización ha sido la norma durante mucho tiempo, ha sido un caso diferente para Irán. Para nosotros, incluso el más pequeño avance es algo que celebrar, algo que acariciar, y algo por lo que presumir. Así nos ha llevado a hoy, donde finalmente podríamos anunciar al mundo el último avance en la tecnología de caza iraní, pronto para llevar a los cielos."
 full_control_of_hormuz: "Control completo de Hormuz"
 full_control_of_hormuz_desc: "El Estrecho de Hormuz es nuestro desde la costa a la orilla. Con el chokepoint del petróleo del mundo bajo nuestras armas, nuestros cofres y nuestro esfuerzo de construcción se hinchan."
 PER_the_iranian_lobby: "El vestíbulo iraní"
 PER_reintegrate_south_azerbaijan: "Reintegrarse al sur de Azerbaiyán"
 PER_attack_ikr: "Ataque [IKR.GetFlag] Kordestan"
 PER_cave_to_western_demands: "Ceder ante las exigencias occidentales"
 PER_war_in_yemen: "Guerra en Yemen"
 PER_tehran_international_fairground: "Ampliar el recinto ferial permanente de Teherán"
 PER_tehran_international_fairground_desc: "El recinto ferial internacional de Teherán en Chitgar ha acogido las exposiciones comerciales del país desde 1959. Una nueva sala libre de columnas nos permitiría organizar los grandes escaparates industriales, de defensa y de investigación que actualmente tienen que dividirse en pabellones más pequeños."
 PER_decentralized_nation: "Aprobó una Nación descentralizada de Temas"
 iranian_events.2282.t: "Paz desfavorable en Azerbaiyán iraní"
 iranian_events.2282.d: "La campaña de Irán contra el levantamiento azerbaiyano tiene un punto culminante. Un alto el fuego deja a los rebeldes en control de su patria en todo menos nombre, y Teherán ha bajado silenciosamente su reclamación a la región. El liderazgo rebelde ahora busca amigos dispuestos a garantizar lo que ganaron en el campo de batalla."
 iranian_events.2282.a: "Garantizar su independencia"
 iranian_events.2282.b: "Esta no es nuestra lucha"
 PER_unit_leader_trait_concessions_to_army: "Concesiones al Ejército"
 PER_unit_leader_trait_concessions_to_army_desc: "El gobierno civil ha otorgado a las fuerzas armadas mayor autoridad a cambio de respetar el proceso democrático."
 PER_military_diarchy_trait_tt: "Cada corriente y futuro §YEl general iraní §! gana §Y$PER_unit_leader_trait_concessions_to_army$§!, otorgando:\n $MODIFIER_ARMY_LEADER_MAX_ARMY_SIZE$: §G+6§!"
 PER_bolster_the_caspian: "Bolster la Flota de Caspio"
 PER_bolster_the_caspian_desc: "La dominación en el Caspio requiere tanto presencia como disuasión. Ampliar nuestra flota asegurará las rutas comerciales y asegurará la fuerza regional."