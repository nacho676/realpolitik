 PER_vezarate_keshavarzi_name: "Vezārat-e Keshāvarzī"
 PER_vezarate_keshavarzi_name_desc: "El Ministerio de Agricultura es un organismo gubernamental iraní responsable de la supervisión de la Agricultura en Irán."
 PER_vezarate_jahade_keshavarzi_name: "Vezārat-e Jahād-e Keshāvarzī"
 PER_vezarate_jahade_keshavarzi_name_desc: "El Ministerio de Yihad Agrícola es un organismo gubernamental iraní responsable de la supervisión de la Agricultura en Irán. El ministerio ha sido llamado Yihad de la Construcción, pero se fusionó con el ministerio de agricultura en 2001 para formar el Ministerio de Yihad Agrícola."
