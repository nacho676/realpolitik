 steal_russian_icbm: "Robar misiles balísticos intercontinentales rusos"
 steal_russian_icbm_desc: "En el pasado, los rusos habían confiado en nuestros funcionarios para que pudieran acceder y ver su gran variedad de misiles balísticos intercontinentales, y aprovecharemos esta oportunidad de oro para tomar algunos, porque ya tienen más que suficientes."
