 PER_deploy_security_kermanshah_1: "Desplegar fuerzas de seguridad en Kermanshah"
 PER_deploy_security_ilam_1: "Desplegar fuerzas de seguridad en Ilam"
 PER_deploy_security_bushehr_1: "Desplegar fuerzas de seguridad en Bushehr"
