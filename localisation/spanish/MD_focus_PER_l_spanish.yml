 the_holy_defence: "La Sagrada Defensa"
 the_holy_defence_desc: "Nuestra guerra con Irak en 1980 y la valentía y los sacrificios de nuestros combatientes han hecho nuestra nación más unida y en un espíritu de martirio. Ganamos mucha experiencia en esta guerra, que ayudará a nuestras fuerzas militares a luchar mejor hoy.\n§W--------------§!\nEste espíritu nacional será §RRemovido§! si cambiamos §HPerspectivas del país§!."
