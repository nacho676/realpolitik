 PER_deploy_security_south_khorasan_1: "Desplegar fuerzas de seguridad en Jorasán del Sur"
 PER_deploy_security_razavi_khorasan_1: "Desplegar fuerzas de seguridad en Jorasán Razavi"
 PER_basij_fervor: "El fervor de los Basij"
 PER_basij_fervor_desc: "Los basij son el brazo voluntario paramilicia del Cuerpo de Guardia Revolucionaria Islámica (IRGC). Normalmente, componiendo los elementos más leales del régimen, los Basij se han movilizado a lo largo de la historia de la República Islámica para servir diversos propósitos, como la construcción nacional, la asistencia humanitaria, los esfuerzos de guerra y la represión de disturbios internos tales como protestas.\nCada mes, el fervor Basiji aumentará en §H5%§!Y podemos §HMovilización§! el Basij para cualquier propósito puesto a disposición en nuestras decisiones. Mientras activo, el fervor de Basiji se marcará por §H-10% cada mes§! hasta que sea al 0%, después de lo cual serán §Hdesmovilizar§! por un período de 1 año."
 PER_mobilize_basij_construction: "Movilizar a los Basij para la construcción nacional"
 PER_mobilize_basij_construction_desc: "Debemos exhortar al Basij a que nos ayude en los esfuerzos de construcción nacional, y ayudarnos en la construcción de nuevas instalaciones para el iraní promedio."
 PER_mobilize_basij_education: "Movilizar a los Basij para avances educativos"
 PER_mobilize_basij_education_desc: "Muchos estudiantes del sistema educativo iraní se han ofrecido como voluntarios para los Cadetes Basij de Escuela Primaria. Este subgrupo de los Basij nos permitirá recurrir a nuestros estudiantes para apoyar la educación en toda la nación."
 PER_mobilize_basij_war: "Movilizar a los Basij para la guerra"
 PER_mobilize_basij_war_desc: "Ha llegado el momento de movilizar a los Basij para resistir contra los enemigos del Islam y nuestro estado."
 PER_basij_vote_suggestion: "El Voto del Basij"
 PER_basij_vote_suggestion_desc: "Nuestra próxima elección presidencial nos permite recurrir a la ventaja numérica que los Basij tienen en estos comicios para votar en un sentido u otro y dar ventaja a nuestro candidato preferido."
 PER_basij_protest_utilization: "Desplegar a los Basij contra los disturbios"
 PER_basij_protest_utilization_desc: "Los disturbios y manifestaciones en curso contra nuestro gobierno han creado un ambiente tenso en el que quizá necesitemos recurrir a los Basij para sofocarlos y ayudar al gobierno."
 PER_basij_parade: "Convocar un mitin de los Basij"
 PER_basij_parade_desc: "Al convocar un mitin y desfile de los Basij, podemos mostrar a nuestro pueblo que el apoyo al gobierno es fuerte, y quizá elevar su moral y su opinión del gobierno."
 PER_seda_o_sima_campaign: "Campaña Seda va Sima"
 PER_seda_o_sima_campaign_desc: "Podemos utilizar el sistema de radiodifusión estatal, Seda va Sima, para difundir el mensaje que consideramos apropiado."
 PER_hold_army_parade: "Organizar un desfile militar"
 PER_hold_army_parade_desc: "Podemos organizar un desfile militar para levantar el ánimo del soldado cansado e inculcar el patriotismo en nuestro pueblo."
 PER_promote_religious_services: "Promover los servicios religiosos"
 PER_promote_religious_services_desc: "Podemos promover servicios religiosos en el país para estrechar los vínculos de los pueblos con el islam y sus instituciones."
 PER_boost_imam_khomeini_relief_foundation: "Ampliar la Fundación de Socorro Imam Jomeini"
 PER_boost_imam_khomeini_relief_foundation_desc: "Podemos ampliar las operaciones de Imam Khomeini Relief Foundation en toda la nación para mejorar la situación de los pobres."
 IRQ_economic_union_member: "Miembro de la Unión"
 PER_unit_leader_trait_artesh: "Rama: Artesh"
 PER_unit_leader_trait_artesh_desc: "Este comandante es miembro de la Artesh, la fuerza militar convencional en Irán. Siendo el sucesor de varios ejércitos iraníes, primero fundado durante la era Achaemenid hace más de 2.500 años, la Artesh en su forma moderna fue fundada en 1921 por Reza Shah Pahlavi. La Artesh tiene poca o ninguna afiliación política, y la mayoría de su ejército está siendo construido de conscriptos que provienen de la población general. Varios intentos de socavar la Artesh a lo largo de los años debido al temor a la deslealtad los han dejado en desacuerdo con el IRGC sobre quien domina las Fuerzas Armadas iraníes."
 PER_unit_leader_trait_irgc: "Rama: IRGC"
 PER_unit_leader_trait_irgc_desc: "Este comandante es miembro del Cuerpo de Guardia Revolucionaria Islámica (IRGC), la fuerza militar no convencional en Irán. Fundada por Ayatollah Ruhollah Khomeini en 1979 tras la Revolución Islámica, el IRGC confió en proteger a la República Islámica de golpes por la fuerza convencional, la Artesh. A lo largo de los años, el IRGC se convirtió en una fuerza que abarca todo desde la policía antidisturbios, hasta las milicias, a fuerzas especiales. Las unidades de IRGC a menudo reciben la última tecnología y equipo, y han recibido un mejor tratamiento por parte de la República Islámica, lo que las pone en desacuerdo con la Artesh."
 PER_socialism2: "£PER_anarchist_communism (MEK) Organización Mojahedin del Pueblo de Irán - §CClique occidental§! están en el poder"
 PER_khamenei_desc: "Jamenei nació en 1939 en Mashhad, en el seno de una familia de ascendencia azerí. El futuro ayatolá decidió centrarse en la teología, estudiando con clérigos influyentes como Jomeini. En los años 60 y 70, Jamenei actuó contra el Shah y tuvo problemas con la SAVAK, por lo que fue arrestado. Después de la revolución islámica, decidió ayudar en el esfuerzo bélico contra la invasión iraquí y participó en la movilización de la gente para defender la nación. Jamenei participó activamente en la formación del nuevo gobierno y finalmente fue elegido tercer presidente de la República Islámica. Tras la desheredación de Montazerí, Jamenei fue el sucesor elegido del ayatolá Jomeini. Aunque todavía es increíblemente conservador, algunos consideran a Jamenei un reformista en comparación con Jomeini, ya que decidió levantar muchas restricciones impuestas a cosas como la música después de la revolución de 1979. También es conocido por su manipulación de la política: si un bando se vuelve demasiado fuerte, intenta fortalecer al otro."
 PER_mashaei_desc: "Nacido en Mazandaran, Mashaei jugó un papel en la lucha contra la revuelta kurda de 1979 tras la revolución iraní. Como ex oficial de inteligencia durante este conflicto, Mashaei fue capaz de conocer a individuos como Ahmadinejad con los que se hizo amigo, permitiendo luego catapultar su carrera política en el foco. Sosteniendo opiniones relativamente poco ortodoxas en comparación con otros principales iraníes, Mashaei cree que el clero ha crecido demasiado fuerte y debe ser debilitado en la sociedad iraní, tanto religiosa como políticamente. Deseando crear una mezcla de nacionalismo islámico y nacionalismo iraní pre-islámica, Mashaei y su camarilla son etiquetados por el clérigo como un individuo con «Tendencias Desviadoras»."
 PER_montazeri_desc: "Nacido en Najafabad, Isfahán, Montazerí fue educado por una Gran Marja, una de las máximas autoridades del chiismo. Montazerí también fue uno de los líderes de la Revolución Islámica que derrocó al Shah en 1979. Como Gran Ayatolá, Montazerí fue nombrado sucesor del Ayatolá Jomeini tras su muerte. Sin embargo, la situación cambió y la revolución no se desarrolló como Montazerí había previsto. En lugar de una democracia que abarcara a todos los sectores de la política iraní, existían individuos cuidadosamente seleccionados y examinados. A ciertos grupos se les prohibió presentarse como candidatos o participar en las elecciones, y muchos partidos fueron proscritos. Tras la ejecución en masa de varios izquierdistas en Irán en 1988, Montazerí se manifestó en oposición al gobierno y criticó las acciones de Jomeini, lo que resultó en su desheredado. Desde entonces, Montazerí trabajó activamente contra el régimen y pidió su derrocamiento, exigiendo la construcción de un nuevo régimen no islámico."
 PER_pahlavi_desc: "Nacido en Teherán como Príncipe Heredero y heredero del trono del Pavo Real, Reza experimentó una vida de realeza en sus primeros años. Reza, que a menudo era moderado en comparación con su padre y tomó medidas como perdonar a los enemigos del estado o pedir cambios más liberales, no heredó directamente el trono. Mientras estaba en los Estados Unidos, entrenándose para convertirse en piloto de aviones de combate, la Revolución Islámica de 1979 derrocó a su padre y a una tradición de 2.500 años de shahdoms iraníes. Con el colapso del Estado Imperial de Irán, Reza no tuvo más remedio que quedarse en Estados Unidos y vivir en el exilio. Muchos de sus partidarios dentro de Irán optaron por huir a otros países occidentales, como Europa o América. No abandonó por completo toda esperanza en el trono, pues hasta mediados de los años 1980 recibió financiación de la CIA para realizar actividades contra la República Islámica. Todo esto terminó después del caso Irán-Contra. Esto no significó el fin de su determinación de derrocar a la República Islámica; en cambio, Reza se concentró en unir a los iraníes a través de campañas de resistencia contra la República Islámica, en un intento por derrocarla."
 PER_homayoon_desc: "Nacido el 27 de septiembre de 1928, Homayoon comenzó su actividad política a los catorce años. Participó en varios partidos y movimientos políticos y fue uno de los primeros en apoyar a Mohammad Mosaddeq. Su participación política no se limitó sólo a Mosaddeq, ya que participó en SUMKA, el partido fascista dirigido por un ex miembro de las SS, Monshizadeh. Homayoon también estuvo involucrado en varias organizaciones paniranistas, y sus inclinaciones políticas eventualmente comenzaron a inclinarse hacia la derecha. Finalmente se convirtió en ministro de Información y Turismo, lo que le permitió ganarse el favor suficiente del Estado Imperial para convertirse en el secretario general adjunto del partido Rastakhiz, el partido estatal de Irán en los años 70. Después de la revolución, Homayoon huyó a Francia, donde realizó actividades contra la República Islámica. Homayoon buscó crear un orden liberal en Irán y así ayudó a fundar el Partido Constitucionalista de Irán, que tenía como objetivo restaurar una monarquía constitucional bajo Reza Pahlavi II. Esto no significaba que Homayoon fuera un monárquico acérrimo o partidario de Pahlavi, ya que había habido casos de críticas dirigidas a Pahlavi por parte de Homayoon."
 PER_irgc_name: "Cuerpo de guardia revolucionario islámico"
 PER_irgc_description: "La función principal del Cuerpo de la Guardia Revolucionaria Islámica (CGRI) es proteger el sistema de la República Islámica del país. Cuenta con agencias de inteligencia, legión extranjera, milicia (Fuerzas Basich), sector de la construcción y una importante participación en la economía. Su Fuerza Quds (Fuerzas Especiales) opera en el extranjero para entrenar milicias amigas y realizar operaciones encubiertas."
 PER_artesh_name: "(AJA) Fuerzas Armadas de Irán"
 PER_vevak_name: "(VAJA) Ministerio de Inteligencia de la República Islámica de Irán"
 PER_regular_name: "Ministerio de Inteligencia"
 PER_jask_base_modifier: "Defensas de base de almizcle"
 PER_zagros_defenses: "Defensas de Zagros"
 PER_zagros_defenses_desc: "Irán no tiene montañas, las montañas tienen a Irán. Las montañas de Zagros, que van desde Oriente a Occidente han demostrado ser un obstáculo desafiante para cualquier ejército invasor. Cualquier ejército invasor tendrá que asegurarse de tener mucha oferta y moral, ya que el camino a través de la cordillera de Zagros es largo y traicionero."
 PER_no_nuclear: "Tiene fatua contra las armas nucleares"
 PER_yazdi_name: "Ebrahim Yazdi"
 PER_yazdi_bio: "Nacido el 26 de septiembre de 1931, Yazdi se levantó para convertirse en una de las primeras figuras revolucionarias bajo Jomeini. Después de la declaración del gobierno de Mossadegh, Yazdi se unió a la lucha contra la shah tomando un lugar en el Movimiento Nacional de Resistencia de Irán. En 1961, él y otros miembros del grupo fundaron el Movimiento de Libertad (FMI) de Irán. Más tarde se convertiría en el Viceprimer Ministro, y el Ministro de Relaciones Exteriores bajo el nuevo gobierno revolucionario."
 PER_yazdi_modifiers: "§YFormer viceprimer ministro:§!\n Influencia extranjera: §G5%§!\n§YUno de los reformistas fundadores:§!\n Poder político Ganancia: §G5%§!\n§Y Social Democrat:§!\n Multiplicador de costos de bienestar: §G-10.00%§!"
 PER_kavakebian_name: "Mostafa Kavakebian"
 PER_kavakebian_bio: "Nacido el 18 de marzo de 1963, Kavakebian es el líder del Partido Democracia, fundado en 2000. Actualmente tiene una licenciatura y maestría en Ciencias Políticas de la Universidad Imam Sadiq, y un doctorado en ciencias políticas de la Universidad Tarbiat Modares. Fue representante del Partido Republicano Islámico para varios países, como Italia, Polonia, Siria y Libia."
 PER_kavakebian_modifiers: "§Y Experto en relaciones internacionales:§!\n Mejorar las relaciones mantienen el costo: §G-25%§!\n§Y Reformador Democrático:§!\n Soporte Pro-Oeste diario: §R+0.03§!\n§YEducator:§!\n Multiplicador de costes educativos: §G-10.00%§!"
 PER_karroubi_name: "Mehdí Karrubí"
 PER_karroubi_bio: "Nacido el 26 de septiembre de 1937, Karrubí es un clérigo chií y un político reformista de larga trayectoria. Miembro fundador de la Asociación del Clero Combatiente, ha liderado numerosos partidos y organizaciones a lo largo de su carrera política. Karrubí se ha destacado por sus críticas a los Consejos de Guardianes y otros órganos de gobierno de la República Islámica, lo que le valió el apoyo de muchos de la oposición. Estudió teología con figuras como el ayatolá Montazerí, lo que hizo que su ideología política fuera en general más izquierdista."
 PER_karroubi_modifiers: "§YCleric:§!\n Multiplicador de Defensa de la Influencia Extranjera: §G15.00%§!\n§YVotos en contra de varios órganos gubernamentales:§!\n Multiplicador de costes burocráticos: §G-10.00%§!\n§YVeterano Político:§!\n Poder Político Ganado: §G15.00%§!"
 PER_mashaei_name: "Esfandiar Rahim Mashaei"
 PER_mashaei_bio: "Nacido el 16 de noviembre de 1960, Mashaei se unió a VAJA como oficial de inteligencia durante la rebelión kurda de 1979. Durante sus operaciones, conoció a Mahmoud Ahmadinejad que pronto le permitió llevar su carrera política al centro de atención. Mashaei ha sido un crítico franco del establecimiento clerical, y ha sido atrapado en muchas controversias. Sin embargo, todavía tiene una fuerte base de apoyo de los antiguos votantes y partidarios de Ahmadinejad por igual."
 PER_mashaei_modifiers: "§YEx Oficial de Inteligencia:§!\n Inteligencia Civil: §G15.00%§!\n§YNacionalista:§!\n Ataque de división: §G10.00%§!\n§YTies to the Military:§!\n Multiplicador de salarios militares: §G-10.00%§!"
 PER_bayadi_name: "Hassan Bayadi"
 PER_bayadi_bio: "Nacido en 1956, Hassan Bayadi nació en la ciudad de Rey. Actualmente es licenciado en ingeniería industrial y es miembro del Consejo Islámico de Teherán. Fue secretario general de la Sociedad Joven Abadgara de Irán Islámico, y trabajó como profesor universitario. Bajo Mohsen Rezai, fue ex consejero electoral y por lo tanto también fue nombrado como concejal y gestión urbana."
 PER_bayadi_modifiers: "§YEngineer:§!\n fábrica civil Velocidad de construcción: §G15,00%§!\n§YEducator:§!\n Velocidad de investigación: §G10.00%§!\n§YCareer Politician:§!\n Multiplicador de costos burocráticos: §G-10.00%§!"
 PER_haghshenas_name: "Mohammad-Javad Haghshenas"
 PER_haghshenas_bio: "Haghshenas, nacido el 18 de marzo de 1953, fue miembro del consejo de Teherán, Ray y Tajrish. También fue un miembro destacado del partido Etemad-e Melli, periodista y profesor universitario, entre otras cosas, de relaciones internacionales. Bajo la dirección de Khatami Haghshenas, este último se desempeñó como asesor del ministro y director general político del Ministerio del Interior, y como adjunto de asuntos legales, parlamentarios y provinciales en el Ministerio de Cultura y Orientación Islámica."
 PER_haghshenas_modifiers: "§YPeriodista: §!\nTendencia emergente diaria: §G0.05%§!\n§YOrganizador experto: §!\nCrecimiento mensual de la productividad: §G0.10§!\n§YExperto legal: §!\nMultiplicador del costo policial: §G-10.00%§!"
 PER_pezeshkian_name: "Massoud Pezeshkian"
 PER_pezeshkian_bio: "Nacido el 29 de septiembre de 1954, a una familia de ascendencia azerbaiyana, Pezeshkian fue a servir como gobernador de los condados Piranshahr y Naghadeh. Fue elegido para el Parlamento iraní (Majles) en 5 ocasiones diferentes, y fue ministro de salud entre 2001 y 2005 bajo el gobierno de Mohammad Khatami. Durante la guerra Irán-Iraq, él y su familia hicieron frecuentes viajes a las líneas de frente, a menudo ayudando con esfuerzos médicos. En 1993, perdió a su esposa y a su hijo menor en un accidente de coche, y no se ha vuelto a casar desde entonces. También es multilingüe, capaz de hablar Farsi, árabe, curdo y azerbaiyano."
 PER_pezeshkian_modifiers: "§YPhysician:§!\n Costo de la salud: §G-10.00%§!\n Tasa de reforzamiento: §G10.00%§!\n Estabilidad: §G5.00%§!\n§YSoportado por los reformistas:§!\n Poder político Ganancia: §G+5%§!\n§Y Reforma Social:§!\n Velocidad de construcción: §G10.00%§!\n Multiplicador de ingresos fiscales de población: §G5,00%§!"
