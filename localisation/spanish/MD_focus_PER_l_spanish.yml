 PER_davoud_minister_bio: "Davoud Hermidas-Bavand nació en Teherán el 10 de noviembre de 1934. Obtuvo una licenciatura en derecho y ciencias políticas de la Universidad de Teherán en 1957 y se convirtió en un científico político y diplomático. Estaba en el frente nacional del consejo de liderazgo de Irán y sirvió como portavoz. Hermidas-Bavand también sirvió en la delegación de Irán a las Naciones Unidas. Fue Vicepresidente del comité ad hoc sobre la redacción de la Convención Internacional contra la toma de rehenes en 1979."
 PER_seyed_hassan_minister_bio: "Nacido el 28 de noviembre de 1948, en Sabzavar, Irán, Seyed Hassan Amin asistió a la Universidad de Teherán a los 17 años y obtuvo una licenciatura en Derecho con distinción. Debido a sus estudios de derecho en Irán, Amin inició sus exámenes y aprendizaje práctico con abogados bajo las regulaciones de la Facultad de Abogados. Debido a ello, fue ascendido posteriormente al rango de profesor a tiempo completo en la Universidad de Glasgow Caledonian."
 PER_hashem_sabbaghian_minister_bio: "Nacido el 4 de abril de 1937, Hashem Sabbaghian llegó a ser un político iraní, humanitario, activista democrático y parlamentario. Durante la revolución de 1979, fue nombrado ministro del interior del gobierno interino, siendo designado por Mehdi Bazargan. Más tarde, se unió al Parlamento en 1980. Más tarde fue rechazado por el Consejo de Guardianes para volver a correr en 1996. Sabbaghian se unió al Movimiento por la Libertad de Irán y sirvió como diputado de Ebrahim Yazdi."
 PER_hedayatollah_matin_minister_bio: "Nacido en Teherán en 1933, Hedayatollah fue el nieto y heredero político de Mohammad Mossadegh. Matin-Daftari era un abogado de derechos humanos bajo el Sha, y jugó un papel activo durante la revolución que lo derrocó. Continuó formando el Frente Nacional Democrático, que alberga a muchos socialistas iraníes independientes. Matin también fue anfitrión y característica en muchos documentales sobre diversos eventos políticos dentro de Irán."
 PER_mohammad_tavasoli_minister_bio: "Nacido el 15 de mayo de 1938, Mohammad Tavasoli-Hojjati pasó a convertirse en activista democrático iraní y más tarde director de la oficina política del partido Movimiento por la Libertad Iraní. Se trasladó a Alemania para estudiar transporte y tráfico, y cuando regresó a Irán en 1971 fue detenido y encarcelado durante 1 año por ayudar a un miembro del MEK. Después de la revolución, pasó a ser el alcalde de Teherán en 1980 hasta que fue detenido en 1983 por la República Islámica junto con Hashem Sabbaghian."
 PER_mostafa_tajzade_minister_bio: "Nacido el 22 de noviembre de 1956, Seyyed Mostafa Tajzade se trasladó a los Estados Unidos para estudiar y convertirse en miembro de la Asociación Musulmana de Estudiantes que trabajaba activamente contra el Sha. También formaba parte de la Asociación de Periodistas iraníes. Se convirtió en asesor de Khatami, y Tajzadeh fue uno de los siete reformistas que presentaron una demanda contra el IRGC por interferir en las elecciones presidenciales iraníes. Fue encarcelado en la cárcel de Evin durante varios años más tarde en su carrera, y fue acusado de propaganda contra el régimen debido a otros factores."
 PER_mostafa_moein_minister_bio: "Nacido el 1 de abril de 1951 en Najafabad, Esfahan, Moeen es un político iraní, profesor de pediatría y activista de derechos humanos. Entró a formar el Frente por los Derechos Humanos y la Democracia en Irán, y fue candidato presidencial más adelante en el camino. Más tarde se convirtió en Ministro de Ciencia, Investigación y Tecnología, pero más tarde renunció tras la protesta estudiantil iraní en 1999, y luego nuevamente en su carrera después de no convencer al Consejo de Guardianes de que reorientara su ministerio a una visión de mayor productividad científica."
 PER_ali_khavari_minister_bio: "Ali Khavari nació el 22 de marzo de 1923 en Mashhad bajo la dinastía Qajar de Irán. Durante la inestabilidad política que siguió a la invasión británica-soviética de Irán, Khavari se convirtió en un comunista iraní y luego se unió al Partido Tudeh en 1941. Fue elegido para el comité central a principios del decenio de 1960. Durante la revolución de 1979, fue elegido para el comité político y más tarde se convirtió en Secretario General del Partido Tudeh."
 PER_hashem_aghajari_minister_bio: "Nacido en Abadan, Irán, en 1957, Aghajari se convirtió en historiador iraní, profesor universitario y crítico de la República Islámica. Su actividad contra el régimen le consiguió la sentencia de muerte por «Apostasía» cuando dijo a los iraníes que no siguieran ciegamente a los clérigos islámicos. Aghajari siguió llamando al protestantismo islámico, lo que llevó a muchos clérigos a enojarse con él, afirmando que atacó el Islam y el Profeta."
 PER_mohsen_makhmalbaf_minister_bio: "Nacido en Teherán el 29 de mayo de 1957, Makhmalbaf formó parte de la facción de izquierda del Mojahedin de la Organización Revolución Islámica entre 1979 y 1980. Makhmalbaf prosiguió una carrera en películas, y más tarde se convirtió en editor de cine, director, escritor y productor. A los 15 años se unió a un grupo militante que luchaba contra Mohammad Reza Pahlavi. Apuñaló y mató a un policía, y luego fue arrestado y condenado a muerte, pero fue liberado durante la Revolución Islámica. Más tarde abandonó Irán tras una victoria en línea dura."
 PER_abdolali_bazargan_minister_bio: "Nacido el 14 de agosto de 1943 en Teherán, Irán, Abdolali Bazargan se convirtió en político liberal iraní, escritor y líder adjunto del Movimiento por la Libertad de Irán. Se incorporó al Frente Nacional en 1961, pero más tarde se fue en 1963 y se unió al partido de su padre, el Movimiento por la Libertad de Irán. Su padre era Mehdi Bazargan, que fue el primer ministro de Irán después de la revolución de 1979 que derrocó al Shah y a Shapour Bakhtiari."
 PER_amir_etemadi_minister_bio: "Nacido en noviembre de 1981, Amir Etemadi se convirtió en activista iraní y vocero de los estudiantes liberales iraníes y graduados. Comenzó actividades políticas en torno a las cuales se incorporó a la Universidad de Teherán en 1999, y finalmente formó el primer documento estudiantil que era muy crítico para la República Islámica. Debido a sus actividades, fue encarcelado más tarde y puesto en prisión de Evin durante muchos años por 'Acting Against National Security' y 'Disturbing Public Order'."
 PER_hassan_shariatmadari_minister_bio: "Nacido el 26 de mayo de 1947, en Tabriz (Irán), Shariatmadari era hijo de un clérigo muy poderoso, Ayatollah Seyed Kazem Shariatmadari. Él apoyó a su padre en querer limitar la autoridad del Sha a la constitución de 1906, así como mantener a los clérigos fuera de la política en Irán. Durante la revolución de 1979, Shariatmadari cofundó el Partido Republicano del Pueblo Iraní y es un firme creyente en la separación de la religión y el estado. Debido a esto, su partido pudo movilizar más de un millón de personas para rebelarse contra Jomeini."
 PER_roozbeh_farahinpour_minister_bio: "Nacido el 16 de julio de 1971 en Teherán, Irán, Farahanipour fue estudiante de derecho en la Universidad Azad y se convirtió en activista estudiantil y fundó el «Partido de Fronteras Gloriosas» o «Marz-e Por Gohar». El partido aboga por el derrocamiento de la República Islámica y pide una república secular. Farahanipour fue detenido y torturado brutalmente por su papel en el levantamiento de julio de 1999, lo que le hizo huir a los Estados Unidos en busca de asilo."
 PER_abulqasem_porhashmi_minister_bio: "Porhashmi, nacido a finales de la década de 1920, era un nacionalista iraní ávido. Esto más tarde le llevó a conocer gente de mente similar y continuó para ayudar a formar la asociación estudiantil Irán-Doost. Durante la invasión británica-soviética de Irán en agosto de 1941, él y sus amigos lucharon como adolescentes y fueron parte activa del movimiento de resistencia en Irán. Más tarde, fue a apoyar la fundación de la escuela de Pan-Iranismo y finalmente se convirtió en parte del partido pan-iranista."
 PER_alireza_kiani_minister_bio: "Nacido el 19 de diciembre de 1984 en Pol-e Sefid, Mazandaran, Kiani persiguió un programa maestro en Ciencias Políticas. Se unió a varias organizaciones políticas, una de las cuales se convirtió en presidente político. Debido a sus actividades políticas, fue detenido e interrogado varias veces por las fuerzas de seguridad iraníes y eventualmente se vio obligado a huir a los Estados Unidos por su propia seguridad. EventoSe convirtió en un moderado partidario de la dinastía Pahlavi y apoyó una monarquía constitucional."
 PER_farhad_baghnani_minister_bio: "Farhad Baghbani se unió al Partido Pan-Iranista como periodista e investigador. Él ve a Irán como una nación con «un pueblo presente, pero gobierno ausente». Sus diversas actividades lo habían arrestado y encarcelado por la República Islámica, y más tarde en su carrera dentro del Partido Pan-Iranista, Baghbani se unió al ala «Patriots Jóvenes de Khuzestan» del partido."
 PER_foad_pashei_minister_bio: "Jamshid Amouzegar, nació el 25 de junio de 1923. Se graduó de la Universidad de Teherán con títulos tanto en derecho como en ingeniería antes de asistir a la Universidad Cornell para obtener un doctorado. Amouzegar se convirtió en viceministro de Irán en el Ministerio de Salud de Irán y finalmente se convirtió en el 43.º Primer Ministro de Irán en 1977. Durante su tiempo como Primer Ministro, también fue el líder del partido 'Rastakhiz' o 'Revival'. Amouzegar también fue consultor de los gobiernos de Arabia Saudita y Kuwait."
 PER_hamed_sheibanyard_minister_bio: "Taghi Rahmani, nacido en 1959, Teherán, Irán, se convirtió en un intelectual iraní contemporáneo y autor de muchos libros sobre intelectualismo religioso y razón. Su ideología como nacionalista religioso a menudo lo puso en desacuerdo con la República Islámica, ya que bajo su régimen Rahmani cumplió un total de 5,000 días en prisión. También ayudó a varios reformistas a establecer y organizar sus campañas para las elecciones presidenciales."
 PER_reza_pirzadeh_minister_bio: "Nacido el 16 de octubre de 1928, Ardeshir Zahedi fue un político iraní bajo el Estado Imperial de Irán que sirvió como ministro de relaciones exteriores de la nación desde 1966 hasta 1971. Fue hijo de Fazlollah Zahedi, un general militar que derrocó a Mossadegh del poder en 1953. Tras la revolución de 1979, aún era embajador en Washington, pero renunció una vez que Jomeini tomó el poder."
