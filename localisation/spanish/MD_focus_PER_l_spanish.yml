 PER_air_facilities: "Objetos en el cielo"
 PER_air_facilities_desc: "El Majlis-Mehdi ha decretado que debemos encontrar formas nuevas e innovadoras de producir nuevos aviones, específicamente a través de nuevas instalaciones de investigación."
