 iranian_events.200.t: "Protestas reprimidas"
 iranian_events.200.d: "Nuestras fuerzas de seguridad lograron someter a quienes participaban en los disturbios. Si bien hemos recibido algunas condenas en las redes sociales y a nivel internacional, esto tiene poca importancia dada la gravedad de las protestas."
 iranian_events.200.a: "Bien"
 iranian_events.201.t: "Las fuerzas de seguridad sufren un duro golpe"
 iranian_events.201.d: "Nuestras fuerzas de seguridad sufrieron un duro golpe en nuestros recientes intentos por reprimir los disturbios, al haber sufrido algunas bajas al enfrentarse a manifestantes enfurecidos. Este contratiempo será solo temporal, y es solo cuestión de tiempo hasta que estemos listos para mudarnos de nuevo."
 iranian_events.201.a: "De acuerdo"
 iranian_events.202.t: "Las protestas disminuyen"
 iranian_events.202.d: "Tras semanas de protestas, parece que la gente se está cansando de gritar en las calles con muy pocos resultados. Cada vez hay menos gente presente, y los alborotadores se han reducido a un pequeño grupo de manifestantes dedicados."
 iranian_events.202.a: "Como era de esperar"
 iranian_events.220.t: "El punto de quiebre"
 iranian_events.220.d: "Desde hace semanas, los grupos de oposición han estado cobrando impulso y expectación para hoy. El objetivo de la oposición es simple: asaltar la emisora ​​Seda va Sima y declarar ilegítima a la República Islámica. Se prevé que alrededor de un millón de personas marchen hacia la calle Valiasr en Teherán, y las fuerzas de seguridad temen no poder detener a tanta gente. Como resultado, se dice que varios altos funcionarios de Artesh y de la Guardia Revolucionaria Islámica están negociando a puerta cerrada con los grupos de oposición para garantizar la seguridad de sus puestos y de sus camaradas."
 iranian_events.220.a: "Autorizar todas las medidas para detener la marcha"
 iranian_events.220.b: "Vamos a vigilar la situación"
 iranian_events.221.t: "Deserciones y deslealtad"
 iranian_events.221.d: "Varios generales y oficiales de alto rango dentro del Artesh han comenzado a denunciar públicamente al gobierno, llegando incluso a apoyar el nuevo movimiento que se está formando contra el gobierno. Una de las unidades más destacadas del ejército, la 65.ª Brigada de Fuerzas Especiales Aerotransportadas, también conocida como la brigada NOHED, ha retirado la insignia islámica de sus uniformes y equipo militar. Estos acontecimientos han generado temor a un posible golpe militar o intervención contra el gobierno. Varias unidades del Artesh, incluida la brigada NOHED, se han negado a acatar órdenes de colaborar en la represión del movimiento."
 iranian_events.221.a: "¡Arréstenlos!"
 iranian_events.221.b: "Déjenlos hablar"
 iranian_events.222.t: "Un parlamento fracturado"
 iranian_events.222.d: "A medida que la legitimidad del régimen viene bajo mayor escrutinio, varios parlamentarios y ministros de toda la nación han comenzado a dimitir como un signo sutil de desafío. Mientras que algunos están tomando un enfoque más silencioso, hay quienes han comenzado a pedir un referéndum directo, en particular los de los campamentos tecnocráticos y reformistas. Sin embargo, estas voces sólo han añadido más combustible al fuego que aparentemente no podemos apagar."
 iranian_events.222.a: "¡Arresten a estos traidores!"
 iranian_events.222.b: "No hay nada que podamos hacer"
 iranian_events.223.t: "El ascenso de Montazerí"
 iranian_events.223.d: "El ayatolá Montazerí, que goza de gran popularidad entre reformistas y demócratas, está siendo instado a liderar un gobierno provisional revolucionario para asegurar una transición pacífica del poder hacia una mejor institución de gobierno democrático. Montazerí es visto como el candidato ideal para dicho puesto debido a su popularidad tanto entre musulmanes como entre laicos, lo que permite que continúe un movimiento de resistencia unificado."
 iranian_events.223.a: "Emitir una orden de arresto en su contra"
 iranian_events.223.b: "Déjalo estar"
 iranian_events.224.t: "Formación del Consejo Revolucionario de Irán"
 iranian_events.224.d: "Esta mañana, una gran multitud se congregó alrededor de la tumba de Ciro el Grande, el fundador de Irán. El motivo de la reunión era escuchar el discurso de un exministro, que ahora es portavoz del recién formado Consejo Revolucionario de Irán. Se ha entendido que, en la reunión, el consejo revolucionario declaró que no tendrían miedo de usar la fuerza contra el régimen y sus fuerzas de seguridad que intentan \"frenar la voluntad del pueblo iraní\". Esta amenaza no ha sido tomada a la ligera por algunos elementos de la Guardia Revolucionaria Islámica, y las tensiones siguen aumentando."
 iranian_events.224.a: "Ordenar a la Guardia Revolucionaria Islámica que esté preparada"
 iranian_events.224.b: "No podemos hacer nada más que mirar"
 iranian_events.225.t: "La caída de Teherán"
 iranian_events.225.d: "Hoy, manifestantes y revolucionarios irrumpieron en varios edificios gubernamentales, derribando retratos del ayatolá Jomeini y de Jameneí, y coreando consignas antigubernamentales desde las ventanas de dichos edificios. En un discurso vehemente hoy, el ayatolá [PER.GetLeader] denunció a quienes participaban en las manifestaciones como agentes de Israel y Estados Unidos, y prometió indultar a los implicados en las protestas si tan solo regresaban a casa. Sin embargo, sus palabras cayeron en saco roto, y los gritos en la calle siguen haciéndose cada vez más fuertes."
 iranian_events.225.a: "¡Trasladen a los funcionarios de Mashhad, no nos iremos a ninguna parte!"
 iranian_events.225.b: "Es hora de solicitar asilo"
 iranian_events.226.t: "Fin de una era"
 iranian_events.226.d: "En las primeras horas de esta mañana, la oficina del Líder Supremo anunció una reubicación temporal del gobierno a algún lugar «fuera de las fronteras honorables de Irán». Para muchos en las calles, esta era la forma de la República Islámica de renunciar formalmente. Después de décadas de gobierno, la República Islámica finalmente ha perdido su dominio sobre el poder. El pueblo ha inundado las calles, derribando monumentos, derribando retratos y celebrando. Los pasillos del poder estaban dormidos, con lo que viene después siendo no escrito."
 iranian_events.226.a: "'¿Cómo escapar de lo escrito? ¿Cómo huir de su destino?' §H- Ferdousí§!"
 iranian_events.227.t: "El alto mando de la Guardia Revolucionaria Islámica huye al sur del Líbano"
 iranian_events.227.d: "Quizás para huir de la persecución, el juicio o la vergüenza, la mayor parte del alto mando del Cuerpo de la Guardia Revolucionaria Islámica ha huido al sur del Líbano, mientras que los grupos más leales se han dirigido a las zonas rurales del este."
 iranian_events.227.a: "Cobardes"
 iranian_events.228.t: "Bombardeos de artillería contra posiciones de Artesh en el este de Irán"
 iranian_events.228.d: "Hoy, varias explosiones despertaron a los habitantes de diversas ciudades del este del país, y las posiciones de Artesh fueron objeto de intensos bombardeos, especialmente en Mashhad, Kerman y Yazd. Tras la primera oleada de ataques iniciales, Qasem Soleimani apareció ante una multitud en la mezquita Imam Reza anunciando que \"hoy se revertirán los errores cometidos hace apenas unas semanas\", en referencia al traslado del gobierno de la República Islámica. Al parecer, los elementos de la Guardia Revolucionaria Islámica que huyeron hacia el este del país lograron reagruparse y reconstruir una fuerza lo suficientemente fuerte como para hacer retroceder al Ejército. Sin embargo, esto no será más que un revés temporal."
 iranian_events.228.a: "'La sangre de los hombres valientes fue derramada como la lluvia que cae de una nube negra' §H- Ferdousí§!"
 iranian_events.228.b: "Los revolucionarios están equivocados... ¡Soleimani revertirá este error!"
 iranian_events.228.c: "Los iraníes han sido engañados durante siglos; ¡un verdadero heredero del pasado de Irán resolverá esto rápidamente!"
 iranian_events.229.t: "Estallan los combates en el este de Irán"
 iranian_events.229.d: "Se han registrado informes de intensos tiroteos en el este de Irán, donde el ejército ha sido blanco de fuertes ataques por parte de los insurgentes. Los insurgentes en cuestión parecen ser antiguas unidades y oficiales de la Guardia Revolucionaria Islámica que se han reagrupado bajo el mando del general Qasem Soleimani con la esperanza de derrocar al gobierno recientemente establecido. Aunque el gobierno de Irán ha anunciado que el conflicto llegará a un rápido final, afirmando que \"el gobierno de Irán y el pueblo de Irán confían en el ejército para restaurar la integridad de las fronteras de Irán y expulsar a los traidores que intentan destruirlas\". Si bien estas afirmaciones parecen haber tranquilizado a algunos, otros temen que la Guardia Revolucionaria Islámica pueda derrocar al gobierno, lo que posiblemente daría paso a un régimen más intransigente que el de la República Islámica original."
 iranian_events.229.a: "Otra revolución en ruinas"
 iranian_events.230.t: "Estallan protestas a nivel nacional en Irán"
 iranian_events.230.d: "Tras las decisiones gubernamentales sumamente impopulares adoptadas por el Gobierno iraní a principios de esta semana, el pueblo iraní ha salido en masa a las calles para expresar su oposición al gobierno y a sus decisiones. Si bien algunos especulan que las protestas pronto cesarán, siguiendo una tendencia común en los levantamientos iraníes, otros afirman que esta vez las protestas podrían conducir al derrocamiento del sistema de la República Islámica, que se estableció mediante protestas callejeras como las que se están presenciando hoy. No obstante, el gobierno ya ha comenzado a reprimir a los manifestantes, y los vídeos que circulan por internet demuestran que las fuerzas de seguridad no se toman este movimiento a la ligera."
 iranian_events.230.a: "Interesante"
 iranian_events.231.t: "Colapso de la República Islámica"
 iranian_events.231.d: "En la madrugada de hoy, la oficina del Líder Supremo anunció el traslado temporal del gobierno a algún lugar \"fuera de las honorables fronteras de Irán\". Para muchos en las calles de Irán, esta fue la forma en que la República Islámica presentó su dimisión formal. Tras décadas de gobierno, la República Islámica finalmente perdió el control del poder. El pueblo iraní ha inundado las calles, derribando monumentos, arrancando retratos y celebrando. Los pasillos del poder permanecen inactivos, y lo que venga después aún está por escribirse. Sin embargo, lo que sí se sabe es que la oposición iraní unida aspira a una forma de gobierno democrática, la misma que prometió la República Islámica en 1979 pero que nunca cumplió."
 iranian_events.231.a: "¿Qué sucederá después?"
 iranian_events.232.t: "Aumentan las peticiones para que el gobierno renuncie a la oposición"
 iranian_events.232.d: "Diversos grupos de la oposición han intensificado sus llamamientos para que el gobierno dimita y abandone el poder. A raíz de la insurgencia en el este del país, diversos grupos, tanto de izquierda como de derecha, han logrado dejar de lado sus diferencias, y muchos líderes de la oposición temen por sus vidas debido a los avances realizados por antiguos elementos del régimen. Ahora le corresponde al gobierno determinar si es apropiado o no que renuncie."
 iranian_events.232.a: "Renuncia y entrégaselo a los antiguos jefes de Estado"
 iranian_events.232.b: "Renuncia y entrégaselo a los monárquicos"
 iranian_events.232.c: "Renuncia y entrégaselo a los izquierdistas"
 iranian_events.232.d1: "¡El gobierno jamás dimitirá!"
 iranian_events.233.t: "Restos del régimen caído"
 iranian_events.233.d: "Tras la caída de la República Islámica, muchos exfuncionarios gubernamentales y sus allegados vieron una oportunidad para sacar provecho de su experiencia y hacerse con el poder. Esto incluye a figuras como Ahmadineyad, Mashaí y Qalibaf. Además, el ejército también ha comenzado a aumentar su influencia en el gobierno para promover sus propios intereses. Ha llegado el momento de elegir a quién queremos que lidere la nación tras nuestra dimisión."
 iranian_events.233.a: "Llamar a Ahmadineyad: solo la IRGC puede derrotar a la IRGC"
 iranian_events.233.b: "Llamar a Qalibaf: el oligarca y hombre de negocios"
 iranian_events.233.c: "Llamar a Mashaí: el patriota que quiere una escuela iraní del Islam"
 iranian_events.233.d1: "Llamar al Artesh - El ejército nacional"
 iranian_events.234.t: "Los herederos de Ciro"
 iranian_events.234.d: "Los shahdoms iraníes dirigieron la nación durante más de 2.500 años antes de la Revolución Islámica de 1979. Es por esta razón que la dinastía Pahlavi ha gozado de relativa popularidad incluso después de su derrocamiento en la Revolución Islámica. Sin embargo, los paniranistas también son monárquicos en menor medida, y también desean unificar las tierras que perdieron ante las grandes potencias. En cualquier caso, debemos elegir un grupo al que entregar el poder una vez que dimitamos formalmente."
 iranian_events.234.a: "Los Constitucionalistas - Seguidores de Reza Pahleví"
 iranian_events.234.b: "Los Paniranistas - Que pretenden volver a unir el territorio perdido de Irán"
 iranian_events.235.t: "La voz de los trabajadores"
 iranian_events.235.d: "La Revolución Islámica no fue enteramente una revolución islámica, sino que abarcó un amplio espectro de ideologías políticas. El segundo grupo más numeroso son los socialistas y revolucionarios de izquierda, a quienes se les privó de voz y voto en el gobierno tras las purgas de Jomeiní en los años 80. De cualquier manera, un gobierno socialista garantizará buenas relaciones entre el gobierno y los bazares una vez que dimitamos."
 iranian_events.235.a: "El MEK - Aunque impopular, organizado"
 iranian_events.235.b: "Partido Comunista Obrero - Conocido sobre todo por su capacidad para organizar sindicatos."
 iranian_events.236.t: "CGRI colapsa"
 iranian_events.236.d: "Tras semanas de intensos combates, la CGRI ha decidido deponer las armas y retirarse al campo y a los países vecinos, y muchos han optado por dirigirse al sur del Líbano a través de un corredor secreto. Sin embargo, su cobardía no importa en este momento; lo que más importa es que la revolución y su pueblo han alcanzado la victoria final."
 iranian_events.236.a: "Como era de esperar"
 iranian_events.237.t: "Dirección Nacional de Ayatollah Montazeri"
 iranian_events.237.d: "Enfrentándose a una de las mayores multitudes de la historia iraní, quizás más grande que las que ayatollah Khomeini dibujó, Montazeri comenzó a saludar a la multitud delante de él. Ayatollah Montazeri comenzó su discurso con una oración, y luego lo siguió con promesas de desmantelar las 'instituciones corruptas, abusivas y no islamistas del régimen anterior'. Esta declaración dibujó grandes alegrías de la multitud. El discurso de 20 minutos fue televisado a toda la nación, con gente que estaba viendo desde casa cantar pro-Montazeri fuera de sus ventanas. Aunque hasta ahora sólo se han hecho promesas, muchos son optimistas acerca de los cambios prometidos por Ayatollah Montazeri. Sin embargo, sólo el tiempo dirá si él cumple o no con sus promesas de lograr un Irán nuevo, libre y democrático."
 iranian_events.237.a: "Que Dios esté con Irán"
 iranian_events.238.t: "Moderado-Liberal Islam Sobre el Rise"
 iranian_events.238.d: "Con la ascensión de Ayatollah Montazeri y sus seguidores, muchos liberales y moderados han comenzado a elogiar al nuevo gobierno por traer rápida y muy necesaria reforma social a la nación. Aunque el camino por delante sigue siendo bastante largo, el apoyo a las formas moderadas y liberales de la gobernanza islámica está en aumento. Partes como el Sendero Verde de la Esperanza y el Movimiento por la Libertad han comenzado a disfrutar del apoyo recién encontrado como resultado del cambio en la política iraní. Sin embargo, todavía hay miedos de un aumento potencial en el sentimiento nacionalista, especialmente entre aquellos en lo que se ha denominado como la «actualidad revolucionaria»."
 iranian_events.238.a: "Veamos qué pasa."
 iranian_events.239.t: "Khatami y Rafsanjani Break Silence"
 iranian_events.239.d: "Tras el colapso de la República Islámica, muchos reformistas prominentes que tomaron parte activa en gobernar la República Islámica se quedaron callados. Dos individuos en particular, Khatami y Rafsanjani, eran especialmente silenciosos. Mohammad Khatami ha sido etiquetado como traidor al movimiento reformista por muchos grupos de estudiantes, ya que se sienten traicionados porque no se unió a ellos en ambas ocasiones que protestaron contra el gobierno. También sienten que no pudo entregar lo que hizo, la democracia en Irán. Rafsanjani también ha sido etiquetado como un stooge del gobierno, y alguien que tampoco pudo traer la democracia a Irán. Sin embargo, en las primeras horas de la mañana, tanto Khatami como Rafsanjani aparecieron ante una multitud declarando que están dispuestos a regresar a la política con las bendiciones del nuevo gobierno."
 iranian_events.239.a: "Claro, ¿por qué no?"
 iranian_events.239.b: "¡Al diablo con ellos, abrázalos de la política!"
 nuclear_iran.25.t: "Estados Unidos aumenta la presión económica"
 nuclear_iran.25.d: "Estados Unidos ha decidido que quiere ejercer su visión imperialista incrementando las sanciones económicas contra nuestro pueblo."
 nuclear_iran.25.a: "¡Resistiremos!"
 nuclear_iran.26.t: "Estados Unidos disminuye la presión económica"
 nuclear_iran.26.d: "Estados Unidos ha decidido reducir las sanciones impuestas a nuestro pueblo. Habrá que esperar para ver si mantienen esta postura."
 nuclear_iran.26.a: "Bueno"
 nuclear_iran.27.t: "Irán comienza a actuar de forma errática"
 nuclear_iran.27.d: "Irán ha comenzado una vez más a actuar como un estado de parías en lugar de civilizado. Debemos reconsiderar nuestra postura sobre las sanciones."
 nuclear_iran.27.a: "Ellos lo pidieron"
 nuclear_iran.28.t: "Irán se alinea"
 nuclear_iran.28.d: "En un giro de 180 grados de la política iraní típica, parece que se están moviendo hacia una dirección más pacífica y controlada."
 nuclear_iran.28.a: "Bien, tal vez podamos aliviar las sanciones ahora"
 nuclear_iran.29.t: "¡Estados Unidos levanta las sanciones!"
 nuclear_iran.29.d: "Ha llegado el día, el presidente [USA.GetLeader] anunció que levantarían todas las sanciones económicas contra nuestra nación. Este es un día que esperábamos desde hace mucho tiempo, y nuestros sueños finalmente se han hecho realidad. Ha llegado el momento de dejar de lado nuestras diferencias y reconciliarnos con los estadounidenses."
 nuclear_iran.29.a: "Un gran día"
