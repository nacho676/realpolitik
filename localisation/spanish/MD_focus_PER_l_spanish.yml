l_spanish:
 iran_focus: "Árbol de Enfoque Iraní"
 PER_the_third_development_plan: "Tercer Plan de Desarrollo"
 PER_the_third_development_plan_desc: "El Tercer Plan de Desarrollo es uno de los varios planes quinquenales que hemos implementado a lo largo de la historia moderna de la nación. Con un enfoque en la industrialización y la autosuficiencia, Irán debe encaminarse por la senda correcta hacia la recuperación económica."
 PER_move_away_from_raw_exports: "Alejarse de las Exportaciones de Crudo"
 PER_move_away_from_raw_exports_desc: "El país debe alejar su enfoque de la exportación de materias primas e invertir en industrias que procesen estos materiales localmente para crear productos con mayor valor agregado."
 PER_trans_levantine_pipelines: "Gasoductos Trans-Levantine"
 PER_trans_levantine_pipelines_desc: "El desarrollo de los Oleoductos Trans-Levantine creará un corredor energético crucial, facilitando el transporte de petróleo y gas a través del Levante y asegurando influencia regional."
 PER_iran_transfo_siemens: "Irán Transfo Siemens"
 PER_iran_transfo_siemens_desc: "Una asociación con Siemens ayudará a modernizar la infraestructura eléctrica de Irán y a impulsar la producción nacional de transformadores, sentando las bases para un crecimiento industrial a largo plazo."
 PER_expand_industrial_towns_in_qazvin: "Expandir Ciudades Industriales en Qazvin"
 PER_expand_industrial_towns_in_qazvin_desc: "Qazvín está idealmente ubicada para funcionar como un importante centro industrial. La expansión de sus zonas industriales promoverá la manufactura nacional y atraerá inversiones tanto extranjeras como nacionales."
 PER_extraction_efforts_in_semnan: "Esfuerzos de Extracción en Semnán"
 PER_extraction_efforts_in_semnan_desc: "Semnán es rica en minerales valiosos. Ampliar las operaciones de extracción en esta provincia contribuirá significativamente a la base de recursos de la nación y reducirá la dependencia de las importaciones."
 PER_rare_metals_of_southern_khorasan: "Metales Raros del Jorasán del Sur"
 PER_rare_metals_of_southern_khorasan_desc: "El Jorasán del Sur es rico en metales raros cruciales para las industrias modernas. Ampliar los esfuerzos de extracción en esta región contribuirá a nuestro avance tecnológico y proporcionará un suministro confiable de recursos clave."
 PER_khangiran_gas_field: "Campo de Gas Khangiran"
 PER_khangiran_gas_field_desc: "Invertir en el desarrollo del Campo de Gas de Khangiran garantizará un suministro estable de gas natural, mejorando nuestra seguridad energética y el crecimiento económico."
 PER_through_sham: "A Través de Sham"
 PER_through_sham_desc: "Expandir nuestra influencia a través del Sham (Siria y sus vecinos) abrirá nuevas rutas estratégicas para el comercio y el transporte de energía, asegurando beneficios económicos y fortaleciendo las alianzas regionales."
 PER_through_anatoli: "A través de Anatolia"
 PER_through_anatoli_desc: "Desarrollar conexiones a través de Anatolia (Turquía) abrirá un nuevo corredor para el comercio y la exportación de energía, conectando a Irán con los mercados europeos y aumentando nuestra influencia económica."
 PER_european_union_energy_agreements: "Acuerdos Energéticos de la Unión Europea"
 PER_european_union_energy_agreements_desc: "Al asegurar acuerdos energéticos con la Unión Europea, podemos abrir nuevos mercados para nuestro petróleo y gas, al mismo tiempo que fortalecemos nuestros lazos diplomáticos con Europa."
 PER_southern_highways: "Autopistas del Sur"
 PER_southern_highways_desc: "Mejorar las autopistas en las regiones del sur del país facilitará el comercio y mejorará el acceso a zonas industriales clave, desbloqueando oportunidades económicas en estas áreas históricamente olvidadas."
 PER_renegotiate_contracts: "Renegociar Contratos"
 PER_renegotiate_contracts_desc: "Debemos revisar y renegociar los contratos existentes con entidades extranjeras para asegurarnos de que sean más favorables para el futuro económico de la nación."
 PER_french_total: "Total Francés"
 PER_french_total_desc: "Una asociación con la empresa francesa Total traerá innovación de clase mundial e inversiones a nuestra industria energética, generará empleo y nos ayudará a lograr un crecimiento sostenible."
 PER_royal_dutch_shell: "Real cáscara holandesa"
 PER_royal_dutch_shell_desc: "Al colaborar con Royal Dutch Shell, podemos beneficiarnos de su tecnología avanzada y experiencia en el sector petrolero, fortaleciendo nuestra capacidad de producción energética."
 PER_malaysian_petronas: "Petronas Malasia"
 PER_malaysian_petronas_desc: "Una asociación con la empresa malaya Petronas brindará nuevas oportunidades de inversión en nuestro sector energético, especialmente en las industrias del gas natural y la petroquímica."
 PER_chinese_CNPC: "CNPC China"
 PER_chinese_CNPC_desc: "Trabajar con la CNPC china aportará experiencia e inversiones muy necesarias a nuestros sectores de petróleo y gas, impulsando el crecimiento y el desarrollo económico."
 PER_gazprom: "Gazprom"
 PER_gazprom_desc: "La participación de Gazprom mejorará nuestra producción energética y nuestra infraestructura, particularmente en gas natural, garantizando la seguridad energética a largo plazo para Irán."
 PER_lukoil: "Lukoil"
 PER_lukoil_desc: "La entrada de Lukoil en el mercado energético de Irán proporcionará acceso a sus tecnologías y experiencia de vanguardia, fortaleciendo nuestro sector petrolero y ampliando la capacidad de producción."
 PER_redirect_funds_to_the_straight: "Redireccionamiento de fondos al Estrecho"
 PER_redirect_funds_to_the_straight_desc: "Redireccionar la inversión hacia el Estrecho de Ormuz aumentará su importancia estratégica y garantizará que nuestra infraestructura respalde rutas comerciales internacionales vitales."
 PER_develop_the_deprived_states: "Desarrollar los estados desfavorecidos"
 PER_develop_the_deprived_states_desc: "Centrarse en las provincias subdesarrolladas, garantizando que la infraestructura, la educación y la atención sanitaria se lleven a un nivel que permita a estas regiones contribuir significativamente a la economía nacional."
 PER_preserve_lake_urmiya: "Preservar el lago Urmia"
 PER_preserve_lake_urmiya_desc: "El lago Urmía, antaño un recurso vital para la región, se ha ido reduciendo. Protegerlo y revitalizarlo garantizará la sostenibilidad de los recursos hídricos y la estabilidad ecológica de las comunidades circundantes."
 PER_regulate_dam_construction_in_the_west: "Construcción de presas de control en el oeste"
 PER_regulate_dam_construction_in_the_west_desc: "Debido a la creciente escasez de agua en la región, debemos establecer mejores regulaciones para la construcción de presas en las zonas occidentales del país."
 PER_khaleej_e_fars_tabriz_railway: "Ferrocarril Khaleej-e Fars a Tabriz"
 PER_khaleej_e_fars_tabriz_railway_desc: "El ferrocarril que unirá Khaleej-e Fars con Tabriz mejorará significativamente el transporte y el comercio entre las regiones del sur y del norte, fortaleciendo la infraestructura y la conectividad económica del país."
 PER_whispers_of_power: "Susurros de Poder"
 PER_whispers_of_power_desc: "En los pasillos de nuestras instituciones científicas y gubernamentales, han comenzado conversaciones tranquilas. La promesa de la energía atómica no solo ofrece poder, sino también influencia. Es hora de escuchar atentamente estos susurros y considerar cómo pueden dar forma a nuestro futuro."
 PER_mastering_the_atom: "Dominio del Átomo"
 PER_mastering_the_atom_desc: "El aprovechamiento de la energía atómica nos concederá la independencia y la fuerza necesarias para los adelantos pacíficos y estratégicos. El dominio del átomo ya no es una ambición distante. Es una búsqueda necesaria para la resiliencia de nuestra nación."
 PER_the_search_for_uranium: "La Búsqueda de Uranio"
 PER_the_search_for_uranium_desc: "El uranio, la columna vertebral del poder atómico, sigue siendo elusivo dentro de nuestras fronteras. Para asegurar nuestro camino hacia adelante, debemos invertir en estudios geológicos y expediciones para localizar y cosechar este recurso vital."
 PER_atomic_projects: "Proyectos Atómicos"
 PER_atomic_projects_desc: "Nuestra nación emprende varios proyectos atómicos para expandir nuestro alcance científico. Al desarrollar y gestionar instalaciones dedicadas a la investigación nuclear, podemos posicionarnos como líderes en energía atómica."
 PER_dig_in_semnan: "Excavar en Semnan"
 PER_dig_in_semnan_desc: "La provincia de Semnan tiene depósitos prometedores de uranio, pero sigue en gran medida sin explotar. Debemos centrar nuestros esfuerzos en la extracción aquí para asegurar un suministro local de este elemento crucial."
 PER_irost_budget_increase: "Asignación Presupuestaria de IROST"
 PER_irost_budget_increase_desc: "Aumentar el presupuesto para la Organización Iraní de Investigación para la Ciencia y la Tecnología (IROST) proporcionará los recursos necesarios para la investigación científica de vanguardia en aplicaciones tanto civiles como militares."
 PER_foreign_shortcuts: "Atajos Extranjeros"
 PER_foreign_shortcuts_desc: "En la búsqueda de avances nucleares, consideramos buscar experiencia y tecnología externa para acelerar nuestro progreso. Los aliados extranjeros pueden proporcionar atajos en este viaje."
 PER_mutual_benefits: "Beneficios Mutuos"
 PER_mutual_benefits_desc: "La diplomacia puede jugar un papel crucial en nuestras ambiciones nucleares. Al forjar asociaciones, podemos acceder a conocimientos y recursos que beneficien a ambas partes, permitiéndonos avanzar más rápidamente."
 PER_missile_leverage: "Palanca Explosiva"
 PER_missile_leverage_desc: "Los sistemas de misiles con capacidad nuclear actuarían como disuasión, señalando al mundo que nuestra nación no debe ser subestimada. Este enfoque enfatiza el desarrollo de misiles y su integración con posibles capacidades nucleares."
 PER_continental_shield: "El Escudo Continental"
 PER_continental_shield_desc: "Para protegernos contra amenazas regionales, estableceremos una red de defensa formidable, capaz de interceptar amenazas aéreas y salvaguardar nuestros sitios y activos nucleares."
 PER_golden_opportunity: "Nuestra Oportunidad Dorada"
 PER_golden_opportunity_desc: "El estado actual de los asuntos y nuestra participación con los rusos nos permiten enviar un grupo de operativos a su nación y tomar algunos... de sus almacenes. Tienen demasiados para contar, después de todo, así que no deberían notar la falta de un par."
 PER_natanz_nuclear_facility: "Complejo de Enriquecimiento de Natanz"
 PER_natanz_nuclear_facility_desc: "Establecer una instalación en Natanz, equipada con centrifugadoras avanzadas, permitirá un enriquecimiento eficiente de uranio. Este paso es crucial para avanzar en nuestras capacidades nucleares."
 PER_the_grand_bargain: "El Gran Acuerdo"
 PER_the_grand_bargain_desc: "Una iniciativa diplomática integral, el Gran Acuerdo tiene como objetivo negociar limitaciones en nuestro programa nuclear a cambio de alivio de las sanciones internacionales, asegurando la estabilidad de nuestra nación."
 PER_joint_scientific_collaboration: "Colaboración Científica Conjunta"
 PER_joint_scientific_collaboration_desc: "La colaboración internacional en campos científicos puede proporcionar cobertura para nuestros avances nucleares. Al involucrarnos con científicos extranjeros, podemos obtener conocimientos mientras construimos buena voluntad en el extranjero."
 PER_iaea_autonomy: "Autonomía del OIEA"
 PER_iaea_autonomy_desc: "Para mantener nuestro programa nuclear intacto, debemos limitar las inspecciones extranjeras. Asegurar nuestra autonomía en los tratos del OIEA protegerá nuestro progreso de la interferencia internacional."
 PER_increase_power_exports: "Aumentar las Exportaciones de Energía"
 PER_increase_power_exports_desc: "Impulsar la producción de energía no solo fortalecerá nuestra economía, sino que también nos permitirá controlar los flujos de energía regionales, proporcionando influencia en las negociaciones internacionales."
 PER_tehran_agreement: "El Acuerdo de Teherán"
 PER_tehran_agreement_desc: "En un esfuerzo diplomático, el Acuerdo de Teherán delineará las intenciones pacíficas de Irán, con el objetivo de tranquilizar a los vecinos y aliviar las tensiones globales en torno a nuestro programa nuclear."
 PER_assistance_with_nuclear_energy: "Ayuda para la Energía Nuclear Nacional"
 PER_assistance_with_nuclear_energy_desc: "Para fomentar el crecimiento en energía nuclear, buscaremos asistencia internacional para proyectos civiles, demostrando nuestro compromiso con los avances nucleares pacíficos."
 PER_nspa: "NSCA"
 PER_nspa_desc: "Formar el Acuerdo de Cooperación en Seguridad Nacional (NSCA) centralizará nuestros esfuerzos nucleares, creando un organismo unificado con potencias extranjeras para supervisar y acelerar el desarrollo de la estrategia militar iraní en los cielos."
 PER_jcpoa: "JCPOA"
 PER_jcpoa_desc: "El Plan de Acción Integral Conjunto (JCPOA) fue un acuerdo histórico para limitar nuestro programa nuclear a cambio de alivio económico. Revisitar esto puede ofrecer vías diplomáticas y aliviar tensiones."
 PER_scientific_standards: "Estándares Científicos"
 PER_scientific_standards_desc: "Mejorar el rigor y los estándares científicos dentro de nuestro programa nuclear asegurará que nuestros investigadores puedan operar a los niveles más altos, avanzando de manera segura y segura."
 PER_ir_forty: "IR-40"
 PER_ir_forty_desc: "El reactor IR-40 estará diseñado para uso de agua pesada, permitiéndonos generar isótopos para aplicaciones tanto civiles como potencialmente militares, simbolizando un gran paso adelante."
 PER_silent_steps: "Pasos Silenciosos"
 PER_silent_steps_desc: "En lugar de hacer movimientos audaces, procederemos en silencio, avanzando en nuestras ambiciones nucleares bajo el radar para evitar provocar el escrutinio internacional."
 PER_prepare_the_army: "Preparar al Ejército"
 PER_prepare_the_army_desc: "A la luz de posibles amenazas, debemos preparar a nuestras fuerzas militares para defender nuestros intereses, asegurando que podamos proteger cualquier desarrollo nuclear de la agresión extranjera."
 PER_prepare_the_economy: "Preparar la Economía"
 PER_prepare_the_economy_desc: "Nuestra economía debe fortalecerse para resistir las sanciones y mantener un crecimiento industrial prolongado. Este enfoque prioriza la construcción de resiliencia y autonomía económica."
 PER_countering_sanctions: "Economía de Resistencia"
 PER_countering_sanctions_desc: "Las sanciones amenazan nuestro crecimiento, pero al desarrollar una 'Economía de Resistencia', podemos reducir la dependencia extranjera y lograr la autosuficiencia."
 PER_oil_deals: "Acuerdos Petroleros"
 PER_oil_deals_desc: "Las exportaciones de energía siguen siendo nuestra línea de vida financiera. Establecer acuerdos petroleros seguros con naciones comprensivas proporcionará los fondos para alimentar nuestras ambiciones."
 PER_withdrawal_from_npt: "Retirada del TNP"
 PER_withdrawal_from_npt_desc: "El Tratado de No Proliferación Nuclear restringe nuestra soberanía. Retirarnos de él afirmará nuestro derecho a buscar tecnología nuclear sin control externo."
 PER_lion_roars: "El León de Irán Ruge"
 PER_lion_roars_desc: "Con una declaración audaz, anunciamos nuestras capacidades nucleares al mundo, mostrando que Irán es una fuerza a tener en cuenta en el escenario global."
 PER_silence_of_stride: "Paso de Silencio"
 PER_silence_of_stride_desc: "Eligiendo un camino de discreción, avanzaremos en nuestras capacidades nucleares bajo un estricto secreto, permitiendo que nuestro poder crezca sin que el mundo nos observe."
 PER_irost: "IROST"
 PER_irost_desc: "La Organización Iraní de Investigación para la Ciencia y la Tecnología (IROST) liderará la investigación en diversos campos, permitiendo avances tanto en ciencia civil como militar."
 PER_ifda: "IFDA"
 PER_ifda_desc: "La Administración de Alimentos y Medicamentos de Irán (IFDA) garantizará la seguridad y los estándares de nuestros alimentos y productos farmacéuticos, esenciales para la salud de nuestra población."
 PER_checking_food_standards: "Verificación de Estándares Alimentarios"
 PER_checking_food_standards_desc: "La calidad y seguridad de los alimentos son vitales para la salud nacional. Este enfoque prioriza la inspección y estandarización de nuestra industria alimentaria."
 PER_development_of_new_gmos: "Nueva Era de los OGM"
 PER_development_of_new_gmos_desc: "La ciencia agrícola moderna puede mejorar nuestra seguridad alimentaria. La investigación en tecnología OGM promete crear cultivos resistentes a la sequía y las enfermedades."
 PER_prepare_for_the_next_century: "Prepárese para el próximo siglo"
 PER_prepare_for_the_next_century_desc: "Para tener éxito en el futuro, debemos empezar a prepararnos ahora. Invertir en educación, tecnología e infraestructura garantizará que estemos preparados para afrontar los desafíos del próximo siglo."
 PER_streamline_enterance_process: "Agilizar el proceso del examen de ingreso"
 PER_streamline_enterance_process_desc: "El sistema actual de exámenes de ingreso es excesivamente complejo y restrictivo. Reformar este proceso garantizará que personas con talento de todos los ámbitos tengan la oportunidad de triunfar."
 PER_ibrc: "IBRC"
 PER_ibrc_desc: "El Centro de Investigación en Biotecnología de Irán (IBRC) liderará nuestros esfuerzos en genética, medicina y avances en investigación biotecnológica."
 PER_dna_modifications: "Modificaciones de ADN"
 PER_dna_modifications_desc: "Al avanzar en nuestra comprensión del ADN, abrimos las puertas a avances médicos e innovaciones en tecnología genética."
 PER_idtds: "IDTDS"
 PER_idtds_desc: "El departamento de Estudios para el Desarrollo Tecnológico (IDTDS) de IROST se centra en asegurar nuestra infraestructura de datos y mejorar la ciberseguridad."
 PER_cybersecurity_infrastructure: "Infraestructura de Ciberseguridad"
 PER_cybersecurity_infrastructure_desc: "Para salvaguardar nuestra información, debemos establecer protocolos robustos de ciberseguridad, defendiendo nuestros avances tecnológicos de la intrusión extranjera."
 PER_electronic_warfare_systems: "Sistemas de Guerra Electrónica"
 PER_electronic_warfare_systems_desc: "Dominar la guerra electrónica nos proporcionará nuevas capacidades para contrarrestar las señales enemigas, interrumpir las comunicaciones y obtener una ventaja estratégica."
 PER_imed: "IMED"
 PER_imed_desc: "El Departamento de Ingeniería Mecánica de Irán (IMED) será la organización que catapultará el progreso industrial y científico de nuestra nación más allá del de nuestros enemigos."
 PER_collaborate_with_ari: "Colaborar con ARI"
 PER_collaborate_with_ari_desc: "El Instituto de Investigación Aeroespacial (ARI) ofrece conocimientos cruciales para nuestras ambiciones. Al trabajar estrechamente, podemos acelerar nuestros avances tanto en aviación civil como militar."
 PER_qaher_three_one_three: "Proyecto Vanquisher"
 PER_qaher_three_one_three_desc: "El Qaher-313, o 'Vanquisher', simboliza nuestra aspiración de supremacía aérea. Desarrollar este proyecto demostrará nuestra fuerza e innovación en la guerra moderna."
 PER_abolish_konkour: "Abolir el Konkour"
 PER_abolish_konkour_desc: "El sistema de exámenes Konkour representa un obstáculo importante para la educación de muchas personas. Su eliminación permitirá un sistema educativo más equitativo y accesible."
 PER_purge_konkour_mafia: "Purgar la mafia Konkour"
 PER_purge_konkour_mafia_desc: "El examen Konkour se ha visto plagado de corrupción y abusos. Purgar esta \"mafia\" garantizará que el sistema de exámenes sea justo, transparente y satisfaga las necesidades de todos los estudiantes."
 PER_vezarate_niru: "Vezārat-e Niru"
 PER_vezarate_niru_desc: "Fundado el 17 de octubre de 1936, el Ministerio de Energía fue responsable de la gestión de la electricidad y posteriormente se amplió para incluir la gestión del agua el 20 de mayo de 1943. El departamento también ha sido designado recientemente para supervisar la construcción de nuevas plantas de energía nuclear."
 PER_bushehr_nuclear_power_plant: "Renovar la Planta de Energía Nuclear de Bushehr"
 PER_bushehr_nuclear_power_plant_desc: "La Planta de Energía Nuclear de Bushehr se encuentra en Irán entre las aldeas pesqueras de Halileh y Bandargeh a lo largo del Golfo Pérsico. La construcción de la planta fue iniciada originalmente en 1975 por empresas alemanas, pero el trabajo se detuvo en 1979 después de la revolución islámica de Irán. Probablemente sea una buena idea renovar la planta de energía para ayudar con nuestra nueva expansión de energía más limpia."
 PER_SATBA: "SATBA"
 PER_SATBA_desc: "La Organización de Energías Renovables y Eficiencia Energética de Irán (SATBA) actúa como delegación del Ministerio de Energía. Tiene como objetivo mejorar la eficiencia energética y ayudar a expandir nuevos horizontes para la energía renovable iraní."
 PER_deputy_for_energy_electricity: "Regulaciones de Energía y Electricidad"
 PER_deputy_for_energy_electricity_desc: "Si añadiéramos nuevas regulaciones relacionadas con la producción de energía y electricidad en nuestra nación, podríamos ayudar seriamente a estabilizar la producción de electricidad en todo el país."
 PER_daryan_dam: "La Presa Daryan"
 PER_daryan_dam_desc: "La presa de Daryan suministrará agua anualmente al túnel de conducción de agua de Nowsud, de 48 km de longitud, donde irrigará zonas del suroeste de Irán."
 PER_black_market_exploits: "Explotaciones del Mercado Negro"
 PER_black_market_exploits_desc: "¿Sabes quién más le gusta saquear los campos de batalla en busca de equipo? Vendedores del mercado negro que buscan ganar dinero rápido! No todo el equipo que recolectamos tiene ya un uso, así que podemos venderlo a nuestras conexiones de mercado para ganar nuestro propio dinero."
 PER_reverse_engineering: "Ingeniería Inversa"
 PER_reverse_engineering_desc: "Los equipos robados de naciones extranjeras tienden a tener tecnología incorporada que nosotros no tenemos, así que si queremos mantenernos avanzados y actualizados en el campo de la tecnología militar, debemos aplicar ingeniería inversa a lo que hemos recopilado y crear nuestros propios diseños autóctonos."
 PER_commission_new_projects: "Comisionar Nuevos Proyectos"
 PER_commission_new_projects_desc: "Si bien adquirir repuestos está bien, aún necesitamos tecnología moderna si queremos mantenernos actualizados, y para ello, deberíamos encargar a la Organización de Yihad de Autosuficiencia del IRGC la creación de nueva tecnología de punta."
 PER_rearm_the_nation: "Rearmar a la Nación"
 PER_rearm_the_nation_desc: "¡Recién salido de la caja, tengo la nueva glock! ¡Con estos nuevos diseños modificados podemos comenzar a reequipar al ejército con los que acaban de salir de la línea de ensamblaje!"
 PER_zulfiqar_tank_productions: "[ROOT.PER_tank_localization_name]"
 PER_zulfiqar_tank_productions_desc: "[ROOT.PER_tank_localization_desc]"
 PER_tank_localization_name: "Producción del tanque Zulfiqar"
 PER_tank_localization_desc: "El Zulfiqar es un tanque de batalla principal iraní, concebido por Mir-Younes Masoumzadeh, subcomandante de las fuerzas terrestres para la investigación y la autosuficiencia de las fuerzas armadas. Lleva el nombre de Zulfiqar, la legendaria espada de Ali, el cuarto califa y el primer imán chiita. Aunque la producción ha disminuido últimamente, debemos anunciar que la producción en masa de Zulfiqars, que comenzó en 1996, aún está en progreso."
 PER_new_tank_localization_name: "Producción del tanque Sasan"
 PER_new_tank_localization_desc: "El Sasan es un tanque de batalla principal iraní. Recibe su nombre de Sasan, la legendaria dinastía que gobernó Irán antes de las invasiones islámicas que pusieron fin al dominio militar persa sobre el mundo conocido. Debemos comenzar la producción en masa de tanques Sasan, ya que nuestros tanques más antiguos están empezando a deteriorarse después de muchos años."
 PER_karrar_productions: "Producción del tanque Karrar"
 PER_karrar_productions_desc: "El Karrar es un tanque de batalla principal iraní de tercera generación. Anunciado por primera vez en 2016, el tanque posee un sistema de control de fuego electroóptico, un telémetro láser, una computadora balística y puede disparar tanto a objetivos estacionarios como móviles de día o de noche. Es bastante avanzado, y sería prudente si comenzamos la producción del tanque de inmediato!"
 PER_naze_at_rockets_in_tabriz: "Cohetes Naze'at en Tabriz"
 PER_naze_at_rockets_in_tabriz_desc: "Los Naze'at son cohetes de artillería iraníes de largo alcance con rangos de unos 100 km. Un completo sistema Naze'at incluye un TEL y furgonetas de comunicaciones, furgonetas meteorológicas y un sistema GPS para inspeccionar el sitio de lanzamiento. Estos cohetes están diseñados para ser disparados desde un lanzador eréctil transportador, y sería estupendo en la defensa de Teherán!"
 PER_repair_old_ch_c: "Helicóptero Toufan"
 PER_repair_old_ch_c_desc: "El helicóptero Toufan es un activo antiguo pero eficaz en nuestro arsenal. Las reparaciones y mejoras son esenciales para mantener su utilidad y garantizar su continuidad en nuestras operaciones de defensa."
 PER_milad_tower_TT: "Finalizará la construcción de §HMilad Tower§! en §HTeherán§!\n\n§HMilad Tower§! será visible en el mapa"
 PER_jask_base: "Base Jask"
 PER_jask_base_desc: "El puerto de Bandar-e Jask, ubicado en la ciudad de Jask, está estratégicamente situado al este del estrecho de Ormuz, en el golfo de Omán. Esto lo convierte en una de las pocas bases navales que tenemos ubicadas fuera del cuello de botella de Ormuz, y por ello, es importante en caso de que alguna vez perdamos el control del estrecho. Por lo tanto, debemos desarrollarlo para asegurar nuestra supremacía naval tanto dentro, alrededor y fuera del golfo Pérsico."
 PER_damavand_two_effect_tt: "Desplegar §HDamavand 2§! en el Mar Caspio"
 PER_AIO: "AIO"
 PER_AIO_desc: "Aerospace Industries Organization (AIO) es un subordinado del ministerio de defensa iraní y un importante complejo de alta tecnología con sede en Teherán. Es un actor clave en el desarrollo y la producción de activos espaciales de Irán, y tiene algunos centros de investigación y fábricas bajo su control. Notablemente, los misiles balísticos Shahab son uno de los productos fabricados por la organización."
 PER_royan_research_institute: "Instituto de Investigación Royan"
 PER_royan_research_institute_desc: "Con instalaciones de última generación, el Instituto de Investigación Royan liderará el avance hacia el progreso científico en Irán."
 PER_police_e_rahvar: "Policía-e RAHVAR"
 PER_police_e_rahvar_desc: "La Polis-e RAHVAR es la fuerza moral y de seguridad de la República Islámica, encargada de preservar el orden y hacer cumplir la ley. Su misión es garantizar que los principios islámicos guíen todas las acciones dentro del estado, protegiendo la fe y los valores de la revolución."
 PER_VAJA: "VAJA"
 PER_VAJA_desc: "El Ministerio de Inteligencia de la República Islámica de Irán es la principal agencia de inteligencia del país y miembro de la Comunidad de Inteligencia de Irán. También se le conoce como VAJA y anteriormente como VEVAK."
 PER_information_and_security_university: "Universidad de Seguridad e Información"
 PER_information_and_security_university_desc: "Aunque hemos tenido VAJA durante mucho tiempo, no hemos tenido una escuela para entrenar operativos, dependiendo únicamente de (redactado) y (redactado) para encontrarlos. Sin embargo, podríamos simplemente hacer una escuela nosotros mismos y hacer que esté tan oculta que nadie sabría que existe!"
 PER_sepah_imam_zaman: "Sepah Imam Zaman"
 PER_sepah_imam_zaman_desc: "El Cuerpo de Imam Zaman, o Sepah, que significa cuerpo, es el nuevo grupo de fuerzas de élite de nuestra agencia entrenada en el arte de la subversión, reunión de inteligencia e infiltración. ¡Pueden hacer casi todo lo relacionado con el espía, además de ser atrapados!"
 PER_sepah_cyberi: "Sepah Cyberi"
 PER_sepah_cyberi_desc: "Aunque la recopilación de inteligencia tradicional es bastante importante, en un mundo donde la tecnología ha adquirido una mayor prominencia y los archivos secretos completos se mantienen digitalmente, sería prudente desarrollar un grupo de hackers propios para defender nuestros secretos sucios."
 PER_overseas_issues: "Problemas en el Extranjero"
 PER_overseas_issues_desc: "¿No te encantaría saber qué está haciendo Israel allí? A nosotros también nos gustaría saberlo, siempre es bueno saber sobre los negocios de los demás, especialmente cuando nos involucra!"
 PER_hack_rafael_company: "Hackear la empresa Rafael"
 PER_hack_rafael_company_desc: "Rafael Advanced Defense Systems Ltd es una empresa israelí de tecnología de defensa. Ha creado algunas de las tecnologías militares más avanzadas conocidas en la Tierra, como el Sling de David, un sistema de defensa de misiles que es más que capaz de interceptar nuestros Shahab-2 y Shahab-3. Necesitamos saber lo que esta compañía está desarrollando, tal vez sea nuestra propia!"
 PER_hack_traffic_system: "Hackear sistemas de tráfico"
 PER_hack_traffic_system_desc: "Israel tiene un sistema de tráfico muy avanzado que sirve a su red vial que abarca todo el país. Si pudieran ver dónde estaban nuestras fuerzas a través de las cámaras de tráfico, eso sería muy malo en un sentido táctico, pero mejor para nosotros si fuéramos los que tenían control de ese sistema."
 PER_imam_alis_riot_police: "Policía Antidisturbios Imam Ali"
 PER_imam_alis_riot_police_desc: "La Unidad Imam Ali es parte del Comando de Unidades Especiales de FARAJA, una subdivisión del Comando de Aplicación de la Ley de la República Islámica de Irán a cargo de sus fuerzas especiales."
 PER_nopo: "NOPO"
 PER_nopo_desc: "La NOPO, que oficialmente significa Fuerza Especial Antiterrorista, es una unidad de fuerza especial iraní del Comando de Unidades Especiales de la Fuerza de Aplicación de la Ley de la República Islámica de Irán."
 PER_irgc_ground_forces: "Fuerzas Terrestres del CGRI"
 PER_irgc_ground_forces_desc: "Cuerpo de Guardia Revolucionaria Islámica Fuerzas terrestres, abreviadas NEZSA, son la fuerza terrestre que el Cuerpo de Guardias Revolucionarios Islámicos (IRGC), mantiene en paralelo con el ejército regular del Irán. Además de su papel militar convencional, las fuerzas terrestres de los guardias revolucionarios están más orientadas hacia el desorden interno que el ejército regular."
 PER_irgc_drone_command: "Comando de Drones del CGRI"
 PER_irgc_drone_command_desc: "¡A partir de ahora, tenemos una red de mando y control para operaciones de drones para ampliar las capacidades aéreas no tripuladas, todas bajo el control de la Fuerza Aérea IRGC!"
 PER_diplomatic_training: "Entrenamiento Diplomático"
 PER_diplomatic_training_desc: "Nuestras operaciones externas se han extendido de estar simplemente en tierra extranjera en guerra, a ser activos en tierras extranjeras durante la paz. El IRGC se ha convertido en más de una fuerza de intervención ahora más que nada, así que déjalos! Aunque, tendrán que ser muy buenos para convencer a otros para dejarlos entrar."
 PER_saberin_special_forces_divison: "División de Fuerzas Especiales Saberin"
 PER_saberin_special_forces_divison_desc: "§R«Si hay 20 Saberin entre vosotros, vencerán a 200, y si hay 100 Saberin, vencerán a 1.000 de los que no creen».§!\n\nLa Brigada Saberin Takavar, también conocida como Unidad Saberin, es una unidad de élite de las Fuerzas Terrestres del Cuerpo de la Guardia Revolucionaria Islámica. Se considera una de las mejores unidades de las Fuerzas Armadas iraníes, con décadas de experiencia militar y de combate, tanto en el país como, especialmente, en operaciones en el extranjero en países vecinos."
 PER_irgc_marines: "Infantería de Marina del CGRI"
 PER_irgc_marines_desc: "Unidad Especial de NEDSA, también conocida como Fuerza de Marina Sepah (S.N.S.F.), es una unidad de comandos en la Armada del Cuerpo de Guardias Revolucionarios Islámicos (CGRI) estacionada en la Gran Isla Farur del Golfo Pérsico. La unidad tiene infantes de marina, hombres rana y francotiradores especializados en guerra aerotransportada y anfibia y abordaje naval."
 PER_the_road_to_jerusalem: "El Camino a Jerusalén"
 PER_the_road_to_jerusalem_desc: "Largo es el camino que tendremos que labrar para llegar a Jerusalén, pero lo haremos, y liberaremos a los musulmanes de Palestina, una acción a la vez!"
 PER_irgc_aerospace_force: "Fuerza Aeroespacial del CGRI"
 PER_irgc_aerospace_force_desc: "La Fuerza Aérea y Espacial del Cuerpo de la Guardia Revolucionaria Islámica (CGRI) (IRGCASF) es la fuerza estratégica de misiles, aire y espacio dentro del CGRI. Fue renombrada de la Fuerza Aérea del CGRI a la Fuerza Aeroespacial del CGRI en 2009."
 PER_control_lebanese_defense: "Controlar la Defensa Libanesa"
 PER_control_lebanese_defense_desc: "Con nosotros como los principales defensores de Líbano contra extranjeros, finalmente podemos unir a Líbano bajo la bandera de Hezbolá para establecer un estado chiíta más fuerte, sin resistencia del gobierno libanés!"
 PER_agitate_shias_in_bahrain: "chiítas bahreiníes"
 PER_agitate_shias_in_bahrain_desc: "En Bahréin, millones de chiítas siguen bajo el yugo del gobierno suní. Ha llegado el momento de que diseñemos un plan para reunirlos bajo nuestra bandera."
 PER_israel_etelaat_base: "[ISR.GetFlag]Israel\nBase Etelaat"
 PER_israel_etelaat_base_desc: "Tener nuestro propio medio de comunicación dentro de Israel será útil para encontrar individuos que compartan las mismas ideas que nosotros, tal vez incluso podamos encontrar reclutas extranjeros de esta manera!"
 PER_turkey_etelaat_base: "[TUR.GetFlag]Turquía\nBase Etelaat"
 PER_turkey_etelaat_base_desc: "Tener nuestro propio medio de comunicación dentro de Turquía será útil para encontrar individuos que compartan las mismas ideas que nosotros, tal vez incluso podamos encontrar reclutas extranjeros de esta manera!"
 PER_azerbayjan_etelaat_base: "[AZE.GetFlag]Azerbaiyán\nBase Etelaat"
 PER_azerbayjan_etelaat_base_desc: "Tener nuestro propio medio de comunicación dentro de Azerbaiyán será útil para encontrar individuos que compartan las mismas ideas que nosotros, tal vez incluso podamos encontrar reclutas extranjeros de esta manera!"
 PER_arabia_etelaat_base: "[SAU.GetFlag]Arabia\nBase Etelaat"
 PER_arabia_etelaat_base_desc: "Tener nuestro propio medio de comunicación dentro de Arabia Saudita será útil para encontrar personas que compartan las mismas ideas que nosotros, ¡quizás incluso podamos encontrar reclutas extranjeros como este!"
 PER_agents_of_hezbollah: "Agentes de Hezbolá"
 PER_agents_of_hezbollah_desc: "Gracias a nuestro medio, hemos encontrado varios palestinos ansiosos por liberar su patria del gobierno israelí. Los hemos puesto a trabajar en colaboración con Hezbolá!"
 PER_islamic_resistance_of_the_najba: "Resistencia Islámica de Najba"
 PER_islamic_resistance_of_the_najba_desc: "La Resistencia Islámica Noble es nuestro propio grupo de resistencia anti-Turquía que hemos formado con voluntarios que fueron atraídos a los reportes de nuestra noticia. ¡Los usaremos para debilitar al ejército turco estacionado en el territorio de nuestros aliados!"
 PER_islamic_resistance_of_the_najba_effect: "Daño a las divisiones §Y[TUR.GetFlag]turcas§! en Siria, Irak y Kurdistán."
 PER_elham_ali_f_under_sight: "Elham Ali F. Bajo Vigilancia"
 PER_elham_ali_f_under_sight_desc: "Ilham Heydar, político de Azerbaiyán, notable por su autoritarismo y sionismo, ha sido puesto en nuestra línea de visión. Tan cerca, justo donde lo queremos."
 PER_under_israel_skin: "Bajo la Piel de Israel"
 PER_under_israel_skin_desc: "Palestinos, únanse contra Israel! Ayúdennos a infiltrar su gobierno!"
 PER_under_turkey_skin: "Bajo la Piel de Turquía"
 PER_under_turkey_skin_desc: "Alevíes, únanse contra Turquía! Ayúdennos a infiltrar su gobierno!"
 PER_under_baku_skin: "Bajo la Piel de Azerbaiyán"
 PER_under_baku_skin_desc: "Piadosos azeríes, únanse contra Azerbaiyán! Ayúdennos a infiltrar su gobierno!"
 PER_blow_nahariya_weapone_storage: "Explosión del Almacén de Armas de Nahariya"
 PER_nahariya_sabotage_tt: "Habilita la misión §YExplosión del Almacén de Armas de Nahariya§!.\n(Requiere §YInfiltración del Ejército§!)"
 PER_blow_turkey_iraqi_base: "Explosión de la Base Turco-Iraquí"
 PER_blow_turkey_iraqi_base_desc: "¿Es hora de la explosión? Creo que es hora de la explosión!"
 PER_turkey_iraqi_base_tt: "Habilita la misión §YExplosión de la Base Turco-Iraquí§!.\n(Requiere §YInfiltración del Ejército§!)"
 PER_blow_baku_gas_canals: "Explosión de los Canales de Gas de Bakú"
 PER_blow_baku_gas_canals_desc: "¡No puedes ganar dinero si no tienes gas, especialmente en un país que depende de las exportaciones de gas y petróleo!"
 blow_baku_gas_canals_tt: "Habilita la misión §YExplosión de los Canales de Gas de Bakú§!.\n(Requiere §YInfiltración Civil§!)"
 PER_sepah_in_arabistan: "Sepah en Arabistán"
 PER_sepah_in_arabistan_desc: "Ahora que hemos logrado establecer un punto de apoyo en Arabia Saudita, ¡podemos enviar al CGRI a realizar actividades encubiertas en Qatif!"
 PER_under_arab_countries_skin: "Bajo la Piel de Arabia"
 PER_under_arab_countries_skin_desc: "Chiítas de Arabia, únanse contra los saudíes! Ayúdennos a infiltrar su gobierno!"
 PER_aramco_underfire: "Aramco Bajo Fuego"
 PER_aramco_underfire_desc: "La principal compañía petrolera de Arabia Saudita, fuente de todos sus ingresos... ¿Qué crees que pasaría si desapareciera?"
 PER_aramco_sabotage_tt: "Habilita la misión §YSabotaje a Aramco§!.\n(Requiere §YInfiltración Civil§!)"
 PER_domestic_issues: "Problemas Domésticos"
 PER_domestic_issues_desc: "Tan importantes como son los problemas externos, tener un país estable en casa libre de fuerzas anti-gubernamentales es igual de importante."
 PER_tabriz_etelaat_base: "Base Etela'at de Tabriz"
 PER_tabriz_etelaat_base_desc: "Tabriz es el hogar de múltiples grupos minoritarios grandes que están ansiosos por liberarse y crear sus propios estados, buscando el apoyo de gobiernos extranjeros de manera encubierta. Debemos destruirlos!"
 PER_tehran_etelaat_base: "Base Etela'at de Teherán"
 PER_tehran_etelaat_base_desc: "Asegurar que la población de nuestra capital esté alineada con nuestros ideales es lo suficientemente importante como para justificar la construcción de una salida de noticias que pueda enseñar a la población cómo identificar espías extranjeros!"
 PER_ICM: "Compañía de Manufactura de Cosechadoras"
 PER_ICM_desc: "La Compañía de Manufactura de Cosechadoras de Irán es el mayor fabricante de cosechadoras en Medio Oriente que se encuentra en Arak."
 PER_economic_support_for_farmers: "Apoyo Financiero para Agricultores"
 PER_economic_support_for_farmers_desc: "Nuestros agricultores necesitan desesperadamente asistencia del gobierno para seguir adelante, y estamos aquí para proporcionarles eso."
 PER_encourage_wheat_production: "Fomentar la Producción de Trigo"
 PER_encourage_wheat_production_desc: "Nuestro pueblo no debe pasar hambre y, por ello, necesitaremos fomentar una mayor producción de trigo."
 PER_guaranteed_purchase_agreements: "Acuerdos de Compra Garantizados"
 PER_guaranteed_purchase_agreements_desc: ""
 PER_al_abbas_brigade: "Brigada Al-Abbas"
 PER_al_abbas_brigade_desc: "La Brigada de Abu al-Fadl al-Abbas es un grupo militante musulmán chiíta duodecimano pro-gubernamental que opera en toda Siria. Lleva el nombre del apodo de Al-Abbas ibn Ali, hijo del Imam Ali."
 PER_coup_against_saddam_TT: "El porcentaje de posibilidades a continuación varía en gran medida según los siguientes factores:\n§Y- Influencia iraní en Irak§!\n§Y - Influencia doméstica iraquí§!\n§Y - Popularidad de la perspectiva emergente en Irak§!"
 PER_iraq_coup: "La §Y[IRQ.Mod_Vilayat_e_Faqih_L]§! lanzará un §Ygolpe de estado exitoso§!."
 PER_iraq_civilwar: "§Y[IRQ.Vilayat_e_Faqih_L]§! lanzará una §R Guerra Civil§!."
 PER_hashd_al_shaabi: "al-Hashd ash-Sha'bi"
 PER_support_shah_massoud: "Apoyar a Shah Massoud"
 PER_support_shah_massoud_desc: "Shah Massoud es el único hombre que puede reunificar Afganistán bajo una bandera estable; debemos apoyarlo a él y a su Alianza del Norte."
 PER_imam_khomeini_relief_foundation: "Fundación de Ayuda Imam Khomeini"
 PER_imam_khomeini_relief_foundation_desc: "La Fundación de Ayuda Imán Jomeini es lo suficientemente grande como para brindar ayuda humanitaria a las miles de personas desplazadas que se encuentran ahora a nuestras puertas."
 PER_ansar_allah: "Ansar-Allah"
 PER_ansar_allah_desc: "También conocido como los Houthis, Ansar-Allah será capaz de proporcionar a nuestra nación un alcance directo a través de la península árabe. Tal oportunidad no es una que podamos pasar."
 PER_lebanon_trigger_TT: "[LEB.GetFlag]§YLíbano§! (o [HEZ.GetFlag]§YHezbolá§!) está §Yen paz§!, es §Ynuestro aliado§!, y tenemos §Y70% de influencia§! en ellos.\n\n"
 PER_yemen_trigger_TT: "[YEM.GetFlag]§YYemen§! (o [HOU.GetFlag]§YHutíes§!) está §Yen paz§!, es §Ynuestro aliado§!, y tenemos §Y70% de influencia§! en ellos.\n\n"
 PER_syria_trigger_TT: "[SYR.GetFlag]§YSiria§! está §Yen paz§!, es §Ynuestro aliado§!, y tenemos §Y70% de influencia§! en ellos.\n\n"
 PER_iraq_trigger_TT: "[IRQ.GetFlag]§YIrak§! está §Yen paz§!, es §Ynuestro aliado§!, y tenemos §Y70% de influencia§! en ellos.\n\n"
 PER_azerbaijan_trigger_TT: "[AZE.GetFlag]§YAzerbaiyán§! está §Yen paz§!, es §Ynuestro aliado§!, y tenemos §Y70% de influencia§! en ellos.\n\n"
 PER_afghanistan_trigger_TT: "[AFG.GetFlag]§YAfganistán§! (o [TAL.GetFlag]§YTalibán§!) está §Yen paz§!, es §Ynuestro aliado§!, y tenemos §Y70% de influencia§! en ellos.\n\n"
 PER_pakistan_trigger_TT: "[PAK.GetFlag]§YPakistán§! está §Yen paz§!, es §Ynuestro aliado§!, y tenemos §Y70% de influencia§! en ellos.\n\n"
 development_plan.1: "El Tercer Plan de Desarrollo"
 PER_iran_attack_iraq_wargoal_TT: "§Y[PER.GetFlag][PER.GetName]§! tendrá un §Robjetivo de guerra§! contra nosotros."
 axis_of_resistance_events.1: "[FROM.GetName] quiere que nos unamos al Eje de la Resistencia!"
 axis_of_resistance_events.1.t: "[FROM.GetName] quiere que nos unamos al Eje de la Resistencia!"
 axis_of_resistance_events.1.d: "El Eje de la Resistencia es una alianza militar, de inteligencia y política contra Israel y Occidente. [FROM.GetName] quiere que nos unamos a ellos y cooperemos entre nosotros contra nuestros enemigos. ¿Deberíamos aceptar esta solicitud y unirnos a su alianza?"
 axis_of_resistance_events.1.o1: "Juntos somos más fuertes!"
 axis_of_resistance_events.1.o2: "No"
 PER_syria_invited_localisation: "Siria"
 PER_iraq_invited_localisation: "Irak"
 PER_houthis_invited_localisation: "Yemen Hutí"
 PER_hezbollah_invited_localisation: "Hezbolá"
 PER_azerbaijan_invited_localisation: "Azerbaiyán"
 PER_turkey_invited_localisation: "Turquía"
 axis_of_resistance_events.2: "[aor_invited_country] Rehusado a unirse al eje de la resistencia"
 axis_of_resistance_events.2.t: "Irán quiere que nos unamos al Eje de la Resistencia!"
 axis_of_resistance_events.2.d: "[aor_invited_country] Ha rechazado nuestra oferta de unirse a nuestra facción, Eje de Resistencia. Probablemente aún no estén listos."
 axis_of_resistance_events.2.o1: "De acuerdo"
 axis_of_resistance_events.3: "[aor_invited_country] se ha unido al Eje de la Resistencia!"
 axis_of_resistance_events.3.t: "[aor_invited_country] se ha unido al Eje de la Resistencia!"
 axis_of_resistance_events.3.d: "[aor_invited_country] decidió unirse al Eje de la Resistencia para cooperar con otros aliados para luchar contra Israel y Occidente!"
 axis_of_resistance_events.3.o1: "De acuerdo"
 axis_of_resistance_events.4: "Irán quiere que lancemos ataques contra Israel!"
 axis_of_resistance_events.4.t: "Irán quiere que lancemos ataques contra Israel!"
 axis_of_resistance_events.4.d: "En una carta confidencial, el gobierno iraní nos solicitó atacar las posiciones del régimen sionista en Palestina. ¿Estamos ahora listos para una guerra fronteriza?"
 axis_of_resistance_events.4.o1: "Hagamos esto!"
 axis_of_resistance_events.4.o2: "Necesitamos prepararnos."
 axis_of_resistance_events.6: "Hezbolá no atacó!"
 axis_of_resistance_events.6.t: "Hezbolá no atacó!"
 axis_of_resistance_events.6.d: "Los funcionarios de Hezbollahi respondieron a nuestra carta que aún no están listos para una guerra fronteriza. Podemos preguntarles otra vez más tarde."
 axis_of_resistance_events.6.o1: "Entendido."
 axis_of_resistance_events.5: "Hezbolá ataca a Israel!"
 axis_of_resistance_events.5.t: "Hezbolá ataca a Israel!"
 axis_of_resistance_events.5.d: "[HEZ.GetName] ha lanzado ataques contra [ISR.GetName] en su frontera. Irán también les está ayudando con dinero, armas y consejos estratégicos."
 axis_of_resistance_events.5.o1: "Interesante"
 axis_of_resistance_events.7: "Termina la Guerra de Fronteras"
 axis_of_resistance_events.7.t: "Termina la Guerra de Fronteras"
 axis_of_resistance_events.7.d: "La Guerra de Fronteras entre Israel y Hezbolá termina hoy, ambos bandos han sufrido bajas durante esta guerra, han acordado un cese al fuego por ahora."
 axis_of_resistance_events.7.o1: "De acuerdo"
 iranian_events.1.t: "Terremoto de Bam"
 iranian_events.1.d: "El terremoto de Bam azotó la provincia de Kermán. El temblor tuvo una magnitud de 6,6. El terremoto fue especialmente destructivo en Bam, con un saldo de al menos 34.000 muertos hasta la fecha. Debemos estar preparados para posibles réplicas."
 iranian_events.1.o1: "Enviar personal del ejército allí para manejar la situación."
 iranian_events.1.o2: "Declarar la ley marcial hasta que la situación se calme."
 iranian_events.2.t: "Aramco bajo fuego"
 iranian_events.2.d: "Hoy, la compañía petrolera nacional de Arabia Saudita, Aramco, fue incendiada en un ataque, lo que causó enormes daños a la economía y los recursos del país. Algunos medios afirman que estos ataques probablemente se llevaron a cabo con el apoyo de Irán, pero no hay pruebas de ello."
 iranian_events.2.o1: "Preocupante"
 iranian_events.3.t: "Sabotaje en Aramco"
 iranian_events.3.d: "Nuestras instalaciones petroleras en Aramco fueron atacadas e incendiadas. Parece que Irán lo hizo con sus espías e infiltrados. Los bomberos fueron enviados al lugar y están intentando controlar el incendio, pero nuestra economía ha sufrido graves daños."
 iranian_events.3.o1: "¡¡¡Malditos sean!!!"
 iranian_events.4.t: "Depósito de armas israelí explota"
 iranian_events.4.d: "Se produjo un sabotaje en el almacén de armas israelí al norte de la ciudad de Nahariya. Inmediatamente después, Irán asumió la responsabilidad del ataque y amenazó al régimen sionista."
 iranian_events.4.o1: "De acuerdo"
 iranian_events.5.t: "Sabotaje en el almacén de armas de Nahariya"
 iranian_events.5.d: "Se produjo un sabotaje en el almacén de armas israelí al norte de la ciudad de Nahariya. Inmediatamente después, Irán asumió la responsabilidad del ataque y amenazó al régimen sionista."
 iranian_events.5.o1: "¡Malditos sean esos iraníes!\n(Comido a presión)"
 iranian_events.7: "Los Quds son nuestros!"
 iranian_events.7.t: "Los Quds son nuestros!"
 iranian_events.7.d: "\"Preparad contra ellos todo el poder militar y caballos de guerra que podáis, intimidando así al enemigo de Alá y al vuestro, y a otros además de ellos, a quienes no conocéis, pero Alá los conoce. Y todo lo que gastéis en el camino de Alá os será devuelto íntegramente, y no seréis tratados injustamente. Si se inclinan hacia la paz, entonces vosotros también inclinaos hacia ella, y poned vuestra confianza en Alá. Ciertamente, Él es el Oyente, el Omnisciente. Pero si intentan engañaros, Alá es suficiente para vosotros. Él es quien os fortaleció con Su ayuda y con los medios de los fieles, y unió sus corazones. Si hubierais gastado todo lo que hay en la tierra, no habríais podido unir sus corazones, pero Alá los unió juntos. Ciertamente, Él es Todopoderoso, Sabio.\""
 iranian_events.7.o1: "Por el Islam y por Palestina!"
 iranian_events.7.o2: "Mantenemos Jerusalén por ahora."
 iranian_events.9.t: "Explosión en base turco-iraquí"
 iranian_events.9.d: "Las bases militares turcas en Irak fueron objeto de un ataque coordinado y las fuerzas turcas sufrieron numerosas bajas. Nadie se ha atribuido aún la responsabilidad de este ataque."
 iranian_events.10.t: "Tuberías de gas de Bakú reventadas"
 iranian_events.10.d: "Se ha llevado a cabo un sabotaje en los gasoductos de Bakú, Azerbaiyán, que ha afectado el comercio con algunos países y ha perjudicado su economía. Nadie se ha atribuido oficialmente la responsabilidad del ataque."
 PER_election_events.2: "Octava elección presidencial"
 PER_election_events.2.t: "Octava elección presidencial"
 PER_election_events.2.d: "Después de la coordinación entre los partidos y personas influyentes dentro del gobierno, se ha completado e implementado la coordinación necesaria para determinar a los candidatos y confirmar sus calificaciones por el Consejo de Guardianes. Parece que el ambiente de la sociedad también está emocionado por las elecciones.\nAdemás, en comparación con las elecciones anteriores, las diferencias entre los partidos principalistas y reformistas han disminuido y es hasta el punto de que las elecciones se llevarán a cabo pacíficamente.\n\nLa medida es el voto de la nación."
 PER_election_events.2.a: "Veamos qué pasa."
 PER_election_events.3: "Novena elección presidencial"
 PER_election_events.3.t: "Novena elección presidencial"
 PER_election_events.3.d: "Después de la coordinación entre los partidos y personas influyentes dentro del gobierno, se ha completado e implementado la coordinación necesaria para determinar a los candidatos y confirmar sus calificaciones por el Consejo de Guardianes. Parece que el ambiente de la sociedad también está emocionado por las elecciones.\nAdemás, en comparación con las elecciones anteriores, las diferencias entre los partidos principalistas y reformistas han disminuido y es hasta el punto de que las elecciones se llevarán a cabo pacíficamente.\n\nLa medida es el voto de la nación."
 PER_election_events.3.a: "Veamos qué pasa esta vez."
 PER_election_events.4: "Décima elección presidencial"
 PER_election_events.4.t: "Décima elección presidencial"
 PER_election_events.4.d: "Al igual que los años anteriores, se ha realizado la coordinación entre las partes y la influencia de la gente en el gobierno. Con la aceptación de Mahmud Ahmadinejad y su candidato rival del Consejo Guardián, este período electoral será diferente. Parece haber algunos conflictos entre dos coaliciones reformistas y principistas, especialmente de Akbar Hashemi Rafsanjani. Por otra parte, se espera la violencia y la sedición callejeras lideradas por reformistas debido a conflictos verbales entre estos dos partidos si los reformistas pierden en este período.\nLas agencias de seguridad del gobierno deben estar vigilantes durante este período y suprimir posibles disturbios a tiempo. Hay una posibilidad de cualquier tipo de disturbios de Akbar Hashemi Rafsanjani, que es el líder de la coalición de reforma, y su candidato elegido."
 PER_election_events.4.a: "La medida es el voto de la nación."
 PER_election_events.5: "11ª Elección Presidencial"
 PER_election_events.5.t: "11ª Elección Presidencial"
 PER_election_events.5.d: "Después de la coordinación entre los partidos y personas influyentes dentro del gobierno, se ha completado e implementado la coordinación necesaria para determinar a los candidatos y confirmar sus calificaciones por el Consejo de Guardianes. Parece que el ambiente de la sociedad también está emocionado por las elecciones.\nAdemás, en comparación con las elecciones anteriores, las diferencias entre los partidos principalistas y reformistas han disminuido y es hasta el punto de que las elecciones se llevarán a cabo pacíficamente.\n\nLa medida es el voto de la nación."
 PER_election_events.5.a: "Veamos qué pasa esta vez."
 PER_election_events.6: "12ª Elección Presidencial"
 PER_election_events.6.t: "12ª Elección Presidencial"
 PER_election_events.6.d: "Después de la coordinación entre los partidos y personas influyentes dentro del gobierno, se ha completado e implementado la coordinación necesaria para determinar a los candidatos y confirmar sus calificaciones por el Consejo de Guardianes. Parece que el ambiente de la sociedad también está emocionado por las elecciones.\nAdemás, en comparación con las elecciones anteriores, las diferencias entre los partidos principalistas y reformistas han disminuido y es hasta el punto de que las elecciones se llevarán a cabo pacíficamente.\n\nLa medida es el voto de la nación."
 PER_election_events.6.a: "Veamos qué pasa esta vez."
 PER_election_events.7: "13ª Elección Presidencial"
 PER_election_events.7.t: "13ª Elección Presidencial"
 PER_election_events.7.d: "Después de la coordinación entre los partidos y personas influyentes dentro del gobierno, se ha completado e implementado la coordinación necesaria para determinar a los candidatos y confirmar sus calificaciones por el Consejo de Guardianes. Parece que el ambiente de la sociedad también está emocionado por las elecciones.\nAdemás, en comparación con las elecciones anteriores, las diferencias entre los partidos principalistas y reformistas han disminuido y es hasta el punto de que las elecciones se llevarán a cabo pacíficamente.\n\nLa medida es el voto de la nación."
 PER_election_events.7.a: "Veamos qué pasa esta vez."
 PER_election_events.8: "Ganó Khatami!"
 PER_election_events.8.t: "Ganó Khatami!"
 PER_election_events.8.d: "Hoy es el día de las elecciones, y parece que después de una dura batalla entre los candidatos Khatami y Tavakoli, Khatami ha emergido victorioso y liderará Irán como el nuevo presidente electo de Irán.\nEs una clara señal de que los Reformistas han ganado!\n\nLa medida es el voto de la nación."
 PER_election_events.8.a: "De acuerdo"
 PER_election_events.9: "Ganó Tavakkoli!"
 PER_election_events.9.t: "Ganó Tavakkoli!"
 PER_election_events.9.d: "Hoy es el día de las elecciones, después de una dura batalla entre los dos anunciados candidatos presidenciales, Tavakoli ha derrotado a su oponente, ¡Esta es una gran victoria para los Principalistas!\n\nLa medida es el voto de la nación."
 PER_election_events.9.a: "De acuerdo"
 PER_election_events.10: "Ganó Rafsanjani!"
 PER_election_events.10.t: "Ganó Rafsanjani!"
 PER_election_events.10.d: "Hoy es el día de las elecciones, el día en que se anunciarán los ganadores...\nEl vencedor de las elecciones iraníes es... Rafsanjani!\nY el perdedor es Ahmadinejad! Esta es una clara victoria para los Reformistas!\n\nLa medida es el voto de la nación."
 PER_election_events.10.a: "De acuerdo"
 PER_election_events.11: "Ganó Ahmadinejad!"
 PER_election_events.11.t: "Ganó Ahmadinejad!"
 PER_election_events.11.d: "Hoy es el día de las elecciones, el día en que se anunciarán los ganadores...\nEl vencedor de las elecciones iraníes es... Ahmadinejad!\n¡Esta es una clara victoria para los principistas!\n\nLa medida es el voto de la nación."
 PER_election_events.11.a: "De acuerdo"
 PER_election_events.12.t: "Ganó Mousavi!"
 PER_election_events.12.d: "Hoy es el día de las elecciones, y el candidato elegido no es otro que... ¡Mousavi!\nFelicitaciones a él por derrotar a su oponente Ahmadinejad...\nEste es un gran momento para los Reformistas ya que son los claros ganadores!\n\nLa medida es el voto de la nación."
 PER_election_events.12.a: "De acuerdo"
 PER_election_events.13: "Ganó Ahmadinejad!"
 PER_election_events.13.t: "Ganó Ahmadinejad!"
 PER_election_events.13.d: "Hoy es el día de las elecciones, y el candidato elegido no es otro que... ¡Ahmadinejad!\nFelicitaciones a él por derrotar a su oponente.\nEsta es una victoria triunfante para los Principalistas!\n\nLa medida es el voto de la nación."
 PER_election_events.13.a: "De acuerdo"
 PER_election_events.14: "Ganó Rouhani!"
 PER_election_events.14.t: "Ganó Rouhani!"
 PER_election_events.14.d: "El día de las elecciones ha llegado, y con él llega el vencedor de su batalla... ¡Rouhani!\nHa derrotado a Ghalibaf y Rezaee, quienes están igualmente decepcionados por esta pérdida...\nEsta es una victoria brillante para los Reformistas!\n\nLa medida es el voto de la nación."
 PER_election_events.14.a: "De acuerdo"
 PER_election_events.15: "Ganó Ghalibaf!"
 PER_election_events.15.t: "Ganó Ghalibaf!"
 PER_election_events.15.d: "El día de las elecciones ha llegado, trae consigo al vencedor de sus pruebas... Ghalibaf!\nFelicitaciones a Rouhani y Rezaee que tuvieron que pasar por el dolor de la derrota.\nEsta es una gran victoria para los Principalistas!\n\nLa medida es el voto de la nación."
 PER_election_events.15.a: "De acuerdo"
 PER_election_events.16: "Ganó Rezaee!"
 PER_election_events.16.t: "Ganó Rezaee!"
 PER_election_events.16.d: "El día de las elecciones está sobre nosotros... este es un momento crucial para el vencedor que es... ¡Rezaee!\nY un momento triste para Rouhani y Ghalibaf que tienen que soportar esta pérdida...\nEsta es una victoria para los Principalistas!\n\nLa medida es el voto de la nación."
 PER_election_events.16.a: "De acuerdo"
 PER_election_events.17: "Ganó Rouhani!"
 PER_election_events.17.t: "Ganó Rouhani!"
 PER_election_events.17.d: "Hoy es día de elecciones, un día en que los candidatos presidenciales son elegidos para continuar su segundo mandato o ser cambiados por el bien. ¡El ganador de las elecciones de hoy es Rouhani!\nEste es un día en que Raisi tiene que aceptar la derrota y reevaluar para prepararse para las próximas elecciones.\n¡Esto es una gran victoria para los reformistas!\n\nLa medida es el voto de la nación."
 PER_election_events.17.a: "De acuerdo"
 PER_election_events.18: "Ganó Raisi!"
 PER_election_events.18.t: "Ganó Raisi!"
 PER_election_events.18.d: "Hoy es día de elecciones, un día en que la gente tiene que elegir quién dirige y representa a su nación, y el hombre que ganó los corazones de las personas es Raisi!\nUna derrota muy inesperada y triste para Rouhani, ya que no volverá a tener una segunda oportunidad.\n¡Esta es una impresionante victoria para los Principados!\n\nLa medida es el voto de la nación."
 PER_election_events.18.a: "De acuerdo"
 PER_election_events.19: "Ganó Hemmati!"
 PER_election_events.19.t: "Ganó Hemmati!"
 PER_election_events.19.d: "Hoy es el día de las elecciones, un día en que los políticos calientes son elegidos para tener la responsabilidad de dirigir una nación. ¡El ganador de hoy es Hemmati!\nUna tormenta de Raisi sorprendida y legítimamente enojada fuera del Parlamento.\n¡Esta es una victoria fundamental para los reformistas!\n\nLa medida es el voto de la nación."
 PER_election_events.19.a: "De acuerdo"
 PER_election_events.20: "Ganó Raisi!"
 PER_election_events.20.t: "Ganó Raisi!"
 PER_election_events.20.d: "Hoy es el día de las elecciones, un día en que la gente vota por quién quiere representarlos y dirigirlos. ¡Nuestro vencedor destinoso es Raisi!\nHemmati no se ve sorprendido y felicita a nuestro ganador.\n¡Es una gran victoria para los Principados!\n\nLa medida es el voto de la nación."
 PER_election_events.20.a: "De acuerdo"
 PER_election_events.21: "Qalibaf se Retira de la Elección Presidencial"
 PER_election_events.21.t: "Qalibaf se Retira de la Elección Presidencial"
 PER_election_events.21.d: "Hoy es el día de las elecciones, un día en que la gente vota por quién quiere representarlos y dirigirlos. ¡Nuestro vencedor destinoso es Raisi!\nHemmati no se ve sorprendido y felicita a nuestro ganador.\n¡Es una gran victoria para los Principados!\n\nLa medida es el voto de la nación."
 PER_election_events.21.a: "Gaz Anbori'd."
 PER_election_events.22: "Transmitir Anuncios de TV para Principalistas"
 PER_election_events.22.t: "Transmitir Anuncios de TV para Principalistas"
 PER_election_events.22.d: "Los partidos principalistas nos han exigido que transmitamos anuncios políticos para ellos en nuestra televisión nacional, ¿debemos aceptar esto y transmitir tales programas?"
 PER_election_events.22.a: "Hagamos esto!"
 PER_election_events.22.b: "No importa"
 PER_election_events.23: "Transmitir Anuncios de TV para Reformistas"
 PER_election_events.23.t: "Transmitir Anuncios de TV para Reformistas"
 PER_election_events.23.d: "Los partidos reformistas nos han exigido que transmitamos anuncios políticos para ellos en nuestra televisión nacional, ¿debemos aceptar esto y transmitir tales programas?"
 PER_election_events.23.a: "Hagamos esto!"
 PER_election_events.23.b: "No importa"
 PER_election_events.24: "Colocar Anuncios Callejeros para Principalistas"
 PER_election_events.24.t: "Colocar Anuncios Callejeros para Principalistas"
 PER_election_events.24.d: "Los partidos principalistas nos han exigido que coloquemos pancartas políticas como publicidad en autopistas y donde la gente pueda verlas, ¿debemos aceptar esto?"
 PER_election_events.24.a: "De acuerdo"
 PER_election_events.24.b: "Tal vez la próxima vez."
 PER_election_events.25: "Colocar Anuncios Callejeros para Reformistas"
 PER_election_events.25.t: "Colocar Anuncios Callejeros para Reformistas"
 PER_election_events.25.d: "Los partidos reformistas nos han exigido poner banderas políticas como un anuncio en las carreteras y donde la gente puede verlas, ¿debemos aceptar esto?"
 PER_election_events.25.a: "De acuerdo"
 PER_election_events.25.b: "Tal vez la próxima vez."
 PER_election_events.26: "Alojar Anuncios en Internet para Principalistas"
 PER_election_events.26.t: "Alojar Anuncios en Internet para Principalistas"
 PER_election_events.26.d: "Los partidos principalistas nos han exigido que alojemos publicidad política en las redes sociales y en internet, ¿debemos aceptar esto?"
 PER_election_events.26.a: "Claro, ¿por qué no?"
 PER_election_events.26.b: "No"
 PER_election_events.27: "Alojar Anuncios en Internet para Reformistas"
 PER_election_events.27.t: "Alojar Anuncios en Internet para Reformistas"
 PER_election_events.27.d: "Los partidos reformistas nos han pedido que acojamos anuncios políticos en las redes sociales y en internet, ¿debemos aceptar esto?"
 PER_election_events.27.a: "Claro, ¿por qué no?"
 PER_election_events.27.b: "No"
 PER_election_events.28: "Protestas por las Elecciones Iraníes de 2009"
 PER_election_events.28.t: "Protestas por las Elecciones Iraníes de 2009"
 PER_election_events.28.desc: "Debido a la victoria de Mahmoud Ahmadinejad en las elecciones de este año, los Reformistas están cuestionando la validez de las elecciones con acusaciones generalizadas de fraude electoral por parte de Ahmadinejad y los Principalistas. Figuras prominentes dentro de los Reformistas, incluido Mousavi, han invitado a sus seguidores a participar en las protestas en las calles de las ciudades de Irán."
 PER_election_events.28.a: "Reprímelos ahora!"
 PER_election_events.28.b: "Deja que los Principalistas ataquen!"
 PER_election_events.28.c: "Esto pasará como los otros..."
 PER_election_events.28.d: "Sí, claro, hubo fraude en las elecciones."
