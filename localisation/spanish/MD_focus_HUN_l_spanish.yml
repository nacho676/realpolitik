l_spanish:
 HUN_karpatalja_question_category: "La cuestión de Karpatalja"
 HUN_annex_karpatalja: "Atender el llamado de Karpatalja"
 HUN_annex_karpatalja_desc: "La autoridad de Ucrania en Zakarpattia se ha colapsado. Los consejos locales húngaros están pidiendo a Budapest que reconozca un sindicato, y nadie queda en Kiev para decir no."
 HUN_karpatalja_ultimatum: "Ultimatum a Kyiv"
 HUN_karpatalja_ultimatum_desc: "La minoría húngara de Karpatalja lleva un siglo esperando la reunificación con la madre patria. Kiev debería entregarla discretamente o perderla por la fuerza."
 HUN_karpatalja_integration_category: "Administración Karpatalja"
 HUN_701_return: "Retorno de Karpatalja"
 HUN_701_return_desc: "Karpatalja se perdió en Trianón. Con el cumplimiento de la provincia asegurado, podemos hacer permanente la reunificación."
 HUN_karpatalja_autonomy: "Administración Karpatalja"
 HUN_karpatalja_autonomy_desc: "El gobierno de Karpatalja a través de los consejos locales compra buena voluntad y acelera su integración, a costa de una mano más lenta en las cadenas de la cartera y paciencia pública para el arreglo."
 HUN_ukr_cede_tt: "§YUcrania entregará Karpatalja§!"
 HUN_ukr_refuse_tt: "§R Ganaremos un objetivo de guerra para tomar Karpatalja por la fuerza§!"
 hungary_karpatalja.1.t: "Los Consejos de Karpatalja"
 hungary_karpatalja.1.d: "Con Kyiv incapaz de proyectar autoridad tan lejos de la capital, asambleas locales en Zakarpattia han votado para buscar sindicatos con Hungría. Budapest sólo está demasiado dispuesto a comprometerse"
 hungary_karpatalja.1.a: "Bienvenido a casa"
 hungary_karpatalja.2.t: "Gobernando Karpatalja"
 hungary_karpatalja.2.d: "Karpatalja es húngaro en el mapa. Convertirlo en una administración que funcione es otro asunto, y el gobierno debe decidir qué tan pesada es la mano a usar."
 hungary_karpatalja.2.a: "Regla a través de los consejos locales"
 hungary_karpatalja.2.b: "Regla directa de Budapest"
 hungary_karpatalja.10.t: "Budapest demanda Karpatalja"
 hungary_karpatalja.10.d: "Hungría ha entregado un ultimátum: entregar a Zakarpattia, o enfrentar las consecuencias. El gobierno debe decidir cómo responder."
 hungary_karpatalja.10.a: "Cede la provincia"
 hungary_karpatalja.10.b: "Rechazar el ultimátum"
 hungary_karpatalja.11.t: "Kyiv se niega"
 hungary_karpatalja.11.d: "Ucrania ha rechazado nuestras demandas sobre Karpatalja. Si queremos la provincia, tendremos que tomarla nosotros mismos."
 hungary_karpatalja.11.a: "Preparados para la guerra"