 ENERGY_GENERATION_TOTAL_DELAYED_TT: "§YModificadores§!:\nLas leyes, los espiritus nacionales y la tecnología impactan en la §YAll Power Energy Generation§!: [?modifier@energy_gain_multiplier|+%]\nImpacto de las leyes, los espiritus nacionales y la tecnología en la §YGeneración de energía renovable§!: [?modifier@renewable_energy_gain_multiplier|%+]\nLas leyes, los espiritus nacionales y la tecnología impactan en la §Ygeneración de energía mediante combustibles fósiles§!: [?modifier@fossil_pp_energy_generation_modifier|%+]\nLas leyes, los espiritus nacionales y las tecnologías impactan en la §Ygeneración de energía nuclear§!: [?modifier@nuclear_energy_generation_modifier|%+]\n\n"
 TOTAL_CONSUMPTION_ENERGY_DELAYED_TT: "§YModifiers§!:\nLa ley, Espíritu nacionals y Techs impactan en §YTodo el Consumo de Energía Potencial§!: [?modifier@energy_use_multiplier|-%]\nLa ley, Espíritu nacionals y Techs impactan en §YConsumo de Energía de Populación§!: [?modifier@pop_energy_use_multiplier|-%]\nLey, Espíritu nacionals y Techs impactan en §Yfábrica civil Consumo de Energía§!: [?modifier@energy_use_modifier_civs|-%]\nLey, Espíritu nacionals y Techs impactan en §YOffice Park Energy Consumption§!: [?modifier@energy_use_modifier_offices|-%]\nLey, Espíritu nacionals y Techs impactan en §Yfábrica militar Consumo de Energía§!: [?modifier@energy_use_modifier_mils|-%]\nLey, Espíritu nacionals y Techs impactan en §YNaval Dockyard Energy Consumption§!: [?modifier@energy_use_modifier_dockyards|-%]\nLaw, Espíritu nacionals, and Techs impact on §YCommercialized Agriculture Districts Energy Consumption§!: [?modifier@energy_use_modifier_agriculture_district|-%]\nLey, Espíritu nacionals y Techs impactan en §YMicrochip Plants Energy Consumption§!: [?modifier@energy_use_modifier_microchip_plant|-%]\nLey, Espíritu nacionals y Techs impactan en §YConsumo de Energía de Plantas Compuestas§!: [?modifier@energy_use_modifier_composite_plant|-%]\nLegal, Espíritu nacionals, and Techs impact on §YSynthetic Refinery Energy Consumption§!: [?modifier@energy_use_modifier_synthetic_refinery|-%]\nGW\n\n----------\nConsumo total de energía por §Y distribución de carga energética§!: [?energy_load_sharing_use_var|R2]"
 heavy_power_restrictions_spirit_desc: "El gobierno ha impuesto una serie de fuertes restricciones energéticas a la población. Ha reducido drásticamente el consumo de energía y electricidad, pero a costa de los ingresos fiscales y otras sanciones económicas."
 some_power_restrictions_spirit_desc: "El gobierno ha impuesto una serie de pequeñas restricciones energéticas a la población, lo que ha reducido drásticamente el consumo de energía y electricidad, pero a costa de los ingresos fiscales y otras sanciones económicas."
 some_additional_consumption_spirit_desc: "El gobierno ha puesto en marcha una serie de subsidios a pequeña escala para el consumo de electricidad de los ciudadanos con el fin de aliviar parte de la carga financiera. Ha fomentado un poco más el gasto, pero el consumo eléctrico se ha disparado."
 heavy_additional_consumption_spirit_desc: "El gobierno ha puesto en marcha una serie de subsidios a gran escala para el consumo de electricidad de los ciudadanos con el fin de aliviar parte de la carga financiera. Ha fomentado un gran gasto adicional, pero el consumo eléctrico se ha disparado."
