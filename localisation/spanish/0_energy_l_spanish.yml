 advanced_production_modifier: "Restricciones de producción avanzadas"
 advanced_production_modifier_desc: "Cuando empecemos a escasear los Metales Tecnológicos ([?THIS.resource@tungsten|+]), los Metales Preciosos ([?THIS.resource@chromium|+]), el Petróleo ([?THIS.resource@oil|+]) o el Caucho ([?THIS.resource@rubber|+]), nuestra producción de microchips y/o compuestos se verá afectada. Cualquier déficit en cualquier recurso resultará en una disminución de la producción de microchips y/o compuestos. Además, dado que la producción de microchips requiere cantidades significativas de energía, la escasez de energía reducirá aún más la producción en un [?unfulfilled_energy_demand_dynmod_var|%]\n\n§YLa reducción de la producción siempre tendrá un límite del §! §R95%§! §Yde las cifras de producción base.§!"
 civilian_microchip_consumption_modifier: "Consumo de Microchips Civiles e Industriales"
 civilian_microchip_consumption_modifier_desc: "Nuestra población y las industrias avanzadas comenzarán a consumir microchips a medida que la tecnología esté disponible para las empresas y el ciudadano medio. Tendremos que satisfacer esta demanda; de lo contrario, nuestras líneas de producción tendrán dificultades. En tiempos de guerra, se priorizará la producción militar sobre el uso civil, pero esto puede generar malestar en la población, ya que no se satisfacen sus demandas."
 is_currently_importing_oil_tt: "[THIS.GetNameWithFlag] está importando actualmente §YCombustibles Fósiles§! de otro país.\n"
 early_renewables_9: "Controles avanzados de turbinas eólicas"
 early_renewables_9_desc: "Los sistemas de control de vanguardia optimizan el rendimiento de las turbinas eólicas ajustando el paso de las palas y los ángulos de guiñada para extraer la máxima energía de condiciones de viento variables."
 renewables_9: "Células solares Perovskite"
 renewables_9_desc: "Las celdas solares de perovskita se vuelven comercialmente viables, con mayor eficiencia y menores costos de producción, lo que impulsa aún más la adopción de la energía solar."
 renewables_10: "Powerplantes de marea"
 renewables_10_desc: "Podemos aprovechar la fuerza de las mareas del océano para abastecer a las ciudades costeras."
 renewables_11: "Expansión de mareas"
 renewables_11_desc: "Los avances en la conversión de energía mareomotriz nos permiten instalar módulos más densos que antes y alejarnos más de la costa."
 renewables_12: "Plantas de energía volcánica"
 renewables_12_desc: "Instalar centrales eléctricas cerca de volcanes activos nos permite aprovechar la inmensa energía geotérmica disponible y, además, reducir las amenazas de erupción."
 renewables_13: "Asthenosphere Siphoning"
 renewables_13_desc: "Extender la idea de las centrales volcánicas a zonas de violenta actividad sísmica nos da mejor acceso a la energía geotérmica de la astenosfera de la Tierra."
 fuel_efficiency_7: "Optimización del combustible cuántico"
 fuel_efficiency_7_desc: "Aplicar la computación cuántica a los sistemas de combustible nos permite gestionar la producción de energía con un nivel de detalle aún mayor."
 fuel_efficiency_8: "Implementación AGI"
 fuel_efficiency_8_desc: "La IAG puede gestionar al detalle la conversión de combustible con un rendimiento mucho mejor que antes."
 fuel_efficiency_9: "Nanofibras especializadas de combustible"
 fuel_efficiency_9_desc: "Las fibras sofisticadas limitan el escape de calor más que nunca."
 fuel_efficiency_10: "Superinteligente monitorización"
 fuel_efficiency_10_desc: "Aplicar IA superinteligente al proceso permite un control casi absoluto de la conversión de energía."
 energy_efficiency_9: "Eficiencia energética cuántica"
 energy_efficiency_9_desc: "Podemos usar la tecnología cuántica para mejorar la eficiencia energética de nuestros equipos."
 energy_efficiency_10: "Eficiencia Cuántica Avanzada"
 energy_efficiency_10_desc: "Aplicar los últimos hallazgos de la tecnología cuántica aumenta aún más la eficiencia."
 energy_efficiency_11: "Reclamación de energía cuántica"
 energy_efficiency_11_desc: "Los avances en nuestra comprensión de la física cuántica permiten recuperar energía a nivel atómico."
 energy_efficiency_12: "Sifonía Cuántica"
 energy_efficiency_12_desc: "Es posible extraer los cambios de la espuma cuántica y convertirlos en energía eléctrica. ¡Hemos convertido la pérdida de energía en ganancia de energía!"
