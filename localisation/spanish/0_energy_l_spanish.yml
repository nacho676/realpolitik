 ENERGY_POLICY_AUTOMATION_SHORT: "Auto"
 ENERGY_POLICY_AUTOMATION_TT: "§YPolítica de Consumo Automático§!\nAjuste automáticamente la política de consumo por un nivel durante la actualización semanal de energía. Aumenta las restricciones por debajo de §R95%§! el cumplimiento neto sostenible y relaja las restricciones o aumenta el consumo por encima §G110%§!. El consumo adicional requiere que el almacenamiento de batería sea por lo menos §Y95%§! completo, a menos que no exista capacidad de almacenamiento. Se incluyen las importaciones de energía y las exportaciones comprometidas, mientras que se excluyen los retiros de baterías. Seleccionar una política desactiva manualmente la automatización."
