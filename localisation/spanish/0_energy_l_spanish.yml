 toggle_nuclear_power_plant_generation_tt: "§YActivar generación de centrales nucleares§!\nAlternar §YCentral nuclear§! generación de energía. Podemos hacer esto para centrarnos únicamente en otros medios de producción para reservar o ahorrar combustible nuclear para uso futuro."
