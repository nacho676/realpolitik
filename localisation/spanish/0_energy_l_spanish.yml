 energy_building_battery_parks: "§Y Construyendo §! parque de baterías"
 energy_building_battery_parks_desc: "Hemos elegido el camino de las renovables generales. Es hora de comenzar a fabricar los materiales requeridos por nuestra nación para almacenar la energía generada por nuestra infraestructura renovable."
 energy_automatic_fuel_purchase: "§Y Compra automática §! de combustible"
 energy_automatic_fuel_purchase_desc: "Actualmente compramos combustible al precio de mercado cada veintiocho días cuando nos estamos quedando sin él."
 has_an_energy_deficit_tt: "[THIS.GetNameWithFlag] actualmente tiene un §Y Déficit de Energía §! (Diferencia actual: [?THIS.energy_difference_variable|Y0] )\n"
 energy_load_sharing_recipient: "[THIS.GetNameWithFlag] esta recibiendo actualmente §Y Energia §! a través de §Y Un Acuerdo §! Para compartir carga.\n"
