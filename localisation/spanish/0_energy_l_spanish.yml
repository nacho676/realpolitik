l_spanish:
 decision_category_energy: "Categoría de decisión energética"
 decision_category_energy_desc: "\n£MAIN_desctext_energy \n \n \n \n §Y[ROOT.GetFlag] Toda nación §! necesita mantener un cierto nivel de cumplimiento energético para evitar que sus funciones y servicios fallen. Si §R no §! logramos satisfacer las crecientes §Y necesidades energéticas de nuestra economía §!, podríamos sufrir inmensas §R consecuencias §! y un §R cierre económico total. §!"
 HEADER_TEXT_TITLE: "§Y ENERGIA §!"
 CAT_nuclear: "Nucleares"
 energy_dynamic_modifier: "Red Eléctrica Nacional"
 energy_dynamic_modifier_TT: "Este Espíritu muestra la suma del consumo de combustible de las centrales fósiles y el consumo directo de combustible de fuentes no eléctricas, así como las eventuales penalizaciones que surgen si el consumo de energía no fuera satisfecho por la generación de energía."
 no_fuel_penalties_modifier: "Falta de sanciones por combustible"
 no_fuel_penalties_modifier_TT: "Este Espíritu muestra las penalidades que se producirían si el país consumiera todas sus reservas de combustible sin dejar nada para que la población lo consumiera."
 hydroelectric_infrastructure_in_state: "Infraestructura hidroeléctrica"
 hydroelectric_infrastructure_in_state_TT: "La Infraestructura Hidroeléctrica incluye todas las represas hidroeléctricas, almacenamiento y más relacionados con la Energía Hidroeléctrica. El modificador en el estado incluye la energía total producida así como la cantidad de almacenamiento que puede contener. Contribuye a su generación total de energía y, como tal, ayuda a cubrir el consumo de energía industrial y de la población."
 geothermal_infrastructure_in_state: "Infraestructura geotérmica"
 geothermal_infrastructure_in_state_TT: "La Infraestructura Geotérmica incluye todas las plantas de energía geotérmica e infraestructura similar. Contribuye a su generación total de energía y, como tal, ayuda a cubrir el consumo de energía industrial y de la población."
 renewable_capacity_factor_dyn_mod: "§Y[?THIS.modifier@state_renewable_capacity_factor_modifier]§!"
 renewable_capacity_factor_dyn_mod_TT: "§Y[THIS.GetName]§! es un §YPunto Caliente de Energía Renovable§! que posee condiciones favorables para la generación de energía renovable, ya sea a través de vientos fuertes y estables o una cantidad de luz solar superior a la media anual.\n\nCuanto mayor sea su factor renovable, más energía producirán semanalmente los parques renovables de esta zona para el propietario del estado."
 heavy_power_restrictions_spirit: "Restricciones de energía pesadas"
 some_power_restrictions_spirit: "Restricciones de energía moderadas"
 some_additional_consumption_spirit: "Subsidios moderados al consumo de energía"
 heavy_additional_consumption_spirit: "Subsidios al consumo de energía pesada"
 build_battery_park_effect_TT: "¡Cambia el número de §YBattery Parks§! por [?temp_change|0+] en [ROOT.GetNameWithFlag] (Actual:[?number_of_battery_parks|Y0])"
 has_nuclear_reactors_tt: "[THIS.GetNameWithFlag] tiene al menos 1 §Y$nuclear_reactor$§! (Actual: [?nuclear_reactors|Y0])\n"
 has_enrichment_facilities_tt: "[THIS.GetNameWithFlag] tiene al menos 1 §Y$enrichment_facility$§!\n"
 has_reactor_material_stockpile_tt: "[THIS.GetNameWithFlag] tiene al menos 5.000 KG §Y Material nuclear de grado reactor§! (Actual: [?THIS.var_reactor_material_stockpile|Y0])\n"
 change_reactor_grade_material_effect_tt: "¡Cambia la reserva de §YMaterial Grado Reactor§! por [?change_resource|0+] en [THIS.GetNameWithFlag] (Actual: [?THIS.var_reactor_material_stockpile|Y0])\n"
 recently_bought_fuel_tt: "Combustible comprado recientemente en el mercado. (Días restantes: [?recently_bought_fuel:days_left|0Y])"
 early_renewables: "Paneles solares básicos"
 early_renewables_desc: "El desarrollo de paneles solares básicos permite a las naciones aprovechar la luz solar y convertirla en electricidad, lo que marca el paso inicial hacia la adopción de energías renovables."
 renewables: "Avances en turbinas eólicas"
 renewables_desc: "Las mejoras tecnológicas en aerodinámica y materiales permiten construir aerogeneradores más eficientes, aumentando su capacidad de generación de energía"
 improved_renewables: "Fotovoltaica de alta eficiencia"
 improved_renewables_desc: "Los avances significativos en la tecnología de células fotovoltaicas dan como resultado tasas de conversión de energía solar más altas, lo que hace que los paneles solares sean más productivos y rentables."
 advanced_renewables: "Palas de viento compuestas"
 advanced_renewables_desc: "Al utilizar materiales compuestos livianos pero resistentes, las palas de las turbinas eólicas se vuelven más eficientes y duraderas, y capturan más energía del viento."
 modern_renewables: "Tecnología solar de película delgada"
 modern_renewables_desc: "La introducción de paneles solares de película delgada revoluciona la industria solar, ofreciendo flexibilidad y adaptabilidad en la instalación al tiempo que mejora la eficiencia general."
 improved_modern_renewables: "Parques eólicos marinos"
 improved_modern_renewables_desc: "Los países comienzan a construir parques eólicos en ubicaciones marinas, beneficiándose de vientos más fuertes y constantes, allanando el camino para proyectos de energía eólica a gran escala."
 advanced_modern_renewables: "Paneles solares bifaciales"
 advanced_modern_renewables_desc: "Se introducen paneles solares bifaciales, capaces de capturar la luz solar de ambos lados, mejorando el rendimiento energético al utilizar la luz solar reflejada en las superficies circundantes."
 fuel_efficiency: "Ingeniería de combustión avanzada"
 fuel_efficiency_desc: "Las innovaciones en ingeniería de combustión nos permiten extraer más energía de los combustibles fósiles y al mismo tiempo reducir el consumo, sentando un precedente para el futuro de la generación de energía."
 fuel_efficiency2: "Ciclo Combinado de Gasificación Integrada"
 fuel_efficiency2_desc: "Al convertir el carbón y otros combustibles a base de carbono en gas, aprovechamos el potencial de una producción de energía más limpia y eficiente, lo que marca un salto en las capacidades de nuestras plantas de energía de combustibles fósiles."
 fuel_efficiency3: "Tecnologías de alta eficiencia y bajas emisiones"
 fuel_efficiency3_desc: "Adoptar las tecnologías HELE garantiza que nuestras plantas de combustibles fósiles alcancen una mayor eficiencia con menores emisiones, uniendo los objetivos gemelos de producción de energía y protección del medio ambiente."
 fuel_efficiency4: "Integración de captura y almacenamiento de carbono (CCS)"
 fuel_efficiency4_desc: "A medida que aumentan las preocupaciones globales sobre las emisiones de carbono, la integración de CCS en nuestras plantas de energía nos permite atrapar y almacenar las emisiones de CO2, lo que hace que la energía de combustibles fósiles sea potencial y consciente del medio ambiente."
 fuel_efficiency5: "Optimización y monitoreo impulsados ​​por IA"
 fuel_efficiency5_desc: "Aprovechando el poder de la inteligencia artificial, nuestras plantas ahora ajustan dinámicamente las operaciones en tiempo real, garantizando un consumo y producción de combustible óptimos y minimizando el impacto ambiental."
 fuel_efficiency6: "Plantas de combustibles fósiles con emisiones casi nulas"
 fuel_efficiency6_desc: "A través de tecnologías y técnicas de vanguardia, nuestras plantas de combustibles fósiles ahora operan con emisiones significativamente reducidas, personificando el pináculo de la producción de energía eficiente."
 energy_efficiency: "Conceptos básicos de termodinámica"
 energy_efficiency_desc: "Al aplicar algunos conceptos básicos de los principios termodinámicos, se puede reducir inmediatamente la pérdida de energía en fábricas y edificios de oficinas."
 energy_efficiency2: "Aplicación de Aislamiento Térmico"
 energy_efficiency2_desc: "Una gran parte del costo energético nacional proviene de la calefacción y refrigeración de los edificios. El uso de aislamiento térmico puede reducir estos gastos, permitiendo que la energía obtenida se utilice en otros lugares."
 energy_efficiency3: "Integración de control avanzado"
 energy_efficiency3_desc: "Al integrar algunos algoritmos rudimentarios en termostatos y sistemas de control, se puede mejorar aún más la eficiencia, permitiendo algunos ahorros de energía adicionales."
 energy_efficiency4: "Aislamiento de alta densidad"
 energy_efficiency4_desc: "Utilizando materiales más modernos, se puede aumentar la densidad de aislamiento y lograr ahorros de energía aún mayores."
 energy_efficiency5: "Centrales eléctricas mejoradas con TEG"
 energy_efficiency5_desc: "Muchas centrales eléctricas modernas todavía dependen del calor para convertir el agua en vapor. Si bien esto se ha vuelto más eficiente con el paso de los años, todavía produce grandes cantidades de calor residual. Los generadores termoeléctricos se pueden utilizar de forma flexible para extraer algo de voltaje adicional del calor residual. Esto se refleja en la reducción del coste total de combustible de las fábricas."
 energy_efficiency6: "Aisladores de nanofibras"
 energy_efficiency6_desc: "Los recientes avances en la tecnología de nanofibras permiten el uso de algunos de los aislamientos más avanzados y densos hasta la fecha. Esto mejorará seriamente la eficiencia energética."
 energy_efficiency7: "Integración de TEG a gran escala"
 energy_efficiency7_desc: "Más allá del simple aislamiento adecuado de fábricas y oficinas, los generadores termoeléctricos se pueden utilizar para recuperar energía que de otro modo se perdería incluso mediante el aislamiento térmico más moderno."
 energy_efficiency8: "Microgeneradores"
 energy_efficiency8_desc: "Instalar escapes con turbinas generadoras a pequeña escala y pasar cableado termoeléctrico a través de ventanas lleva la recuperación de energía al siguiente nivel."
 TOTAL_GENERATION_ENERGY: "§HGeneración Total§!: [?energy_sum|G2] GW"
 ENERGY_GENERATION_TOTAL_TT: "Los siguientes valores constituyen el desglose completo del origen de la energía generada. §YPlantas eléctricas de combustibles fósiles§! quedará inactivo si produce más energía de la que consume. ¡Inactivo §YPlantas eléctricas de combustibles fósiles§! no consuma §YFuel§!.\n----------\n§YPoder de los combustibles fósiles§! Generación: [?fossil_pp_energy_generation|G2] GW\n§YEl poder de las centrales eléctricas fósiles inactivas§! Generación: [?free_fossil_powerplants_power|Y2] GW\n§YEnergía Hidroeléctrica§! Generación: [?hydroelectric_energy_generation|G2] GW\n§YEnergía Geotérmica§! Generación: [?geothermal_energy_generation|G2] GW\n§YEnergía Nuclear§! Generación: [?nuclear_energy_generation|G2] GW\n§YEnergía solar y eólica§! Generación: [?renewable_energy_display_var|G2] GW\n§YOtras fuentes§! Generación: [?other_energy_generation|G2] GW\n§YRetiro del Almacenamiento de Energía§!: [?energy_withdrawal_from_storage|G2] GW\n\n----------\n§YPotencial energía solar y eólica§! Generación: [?minimum_renewable_energy_var|+2] GW a [?maximum_renewable_energy_var|+2] GW\nGeneración Total de Energía por §YReparto de Carga Energética§!: [?energy_load_sharing_gain_var|G2]"
 TOTAL_CONSUMPTION_ENERGY: "§HTotal Consumo:§!: [?energy_consumption|R2] GW"
 TOTAL_CONSUMPTION_ENERGY_TT: "Los siguientes valores componen el desglose completo de donde proviene el consumo energético.\n----------\n§YPopulation Energy§! Consumo: [?population_energy_use_display_var|R2] GW\nDemanda de población estacional: [?energy_seasonal_population_demand_factor|%0R]\n§YTotal Building Energy§! Consumo: [?energy_use_buildings_total_display_var|R2] GW\n§YOtras energías§! Consumo: [?other_energy_use_display_var|R2] GW\n----------\n§YBuilding Energy Consumption by Type:§!\n§YCivil Factory Energy§! Consumo: [?energy_use_civs_total_display_var|R2] GW\n§YOffices Energy§! Consumo: [?energy_use_offices_total_display_var|R2] GW\n§YMilitary Factory Energy§! Consumo: [?energy_use_mils_total_display_var|R2] GW\n§YNaval Dockyard Energy§! Consumo: [?energy_use_dockyards_total_display_var|R2] GW\n§YCommercialized Agriculture Districts Energy§! Consumo: [?energy_use_agriculture_district_total_display_var|R2] GW\n§YMicrochip Plant Energy§! Consumo: [?energy_use_microchip_plant_total_display_var|R2] GW\n§YEnergía vegetal compuesta§! Consumo: [?energy_use_composite_plant_total_display_var|R2] GW\n§YSynthetic Refinery Energy§! Consumo: [?energy_use_synthetic_refinery_total_display_var|R2] GW\n\n"
 MISSING_FULFILLMENT_VALUE: "§HInsatisfacción energética§!: [?unfulfilled_energy_demand_var|%+]"
 MISSING_FULFILLMENT_VALUE_TT: "Este valor es el porcentaje de nuestra demanda de energía requerida que actualmente no se satisface.\n\nImpacto del incumplimiento del consumo\n£construction_speed_texticon Velocidad de construcción: [?unfulfilled_energy_demand_dynmod_var|+%]\n£research_speed_texticon Velocidad de investigación: [?unfulfilled_energy_demand_dynmod_var|+%] \n£tax_gain_multiplier_modifier_texticon Ingresos fiscales Multiplicador: [?unfulfilled_energy_demand_dynmod_var_3|+%]\n£factory_output_texticon Salida de fábrica: [?unfulfilled_energy_demand_dynmod_var|+%]\n£dockyard_output_texticon Salida de astillero: [?unfulfilled_energy_demand_dynmod_var|+%] \n£stability_texticon Estabilidad: [?unfulfilled_energy_demand_dynmod_var_2|+%]"
 NET_ENERGY_BALANCE: "§HBalance energético neto§!: [energy_total_net_energy_balance]"
 NET_ENERGY_BALANCE_TT: "¡El valor del §HTequilibrio energético total§! es el valor relativo de la §HT Generación Total de Energía§! dividido por el §HConsumo total de energía§! mostrando el §HNet Energy Balance§! como porcentaje."
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES: "§YCentrales eléctricas de combustibles fósiles§! Consumo diario de §Ycombustible§!: [?fossil_pp_fuel_display|0R]"
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES_TT: "¡Este valor representa la cantidad total de combustible consumido diariamente por todas nuestras §YPlantas Eléctricas de Combustible Fósil§! activas. §YPlantas eléctricas de combustibles fósiles§! comienza a estar inactivo cuando su capacidad total de generación es mayor que su consumo total.\n\n§YModificadores§!:\n¡Las leyes, los espiritus nacionales y la tecnología impactan en §YFossil Fuel Powerplant Fuel§! Consumo: [?modifier@fossil_pp_fuel_consumption_modifier|-%]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES: "Consumo diario de §Ycombustible§! de la §Ypoblación§!: [?non_electric_fuel_display|0R]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES_TT: "Este valor representa la cantidad total de combustible consumido diariamente por toda nuestra §YPopulación§!.\n\n§YModificadores§!:\nLa ley, Espíritu nacionals y Techs impactan en §YFuel no eléctrico§! Consumo: [?modifier@non_electric_fuel_consumption_modifier|-%]\nDemanda de población estacional: [?energy_seasonal_population_demand_factor|%0R]\n\nLa electricidad poblacional y la demanda de combustible no eléctrico aumentan en un 20% durante diciembre a febrero y junio a agosto. La demanda estacional se aplica después de otros modificadores y actualizaciones con el cálculo semanal de energía."
 TOTAL_ENERGY_MISC_VALUE_HEADER: "El consumo de combustible"
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION: "§GProducción§! neta semanal de §Ycombustible nuclear§!: [?net_nuclear_fuel_display|0+] Kg"
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION_TT: "Este valor representa el consumo semanal de §YMaterial de Grado Reactor§! para nuestros §YReactores Nucleares§!. El valor es la diferencia entre la producción y el consumo semanales de §YMaterial de Grado Reactor§!.\n\n§YReserva de Material de Grado Reactor§!: £GFX_nuclear_material_texticon §G[?var_reactor_material_stockpile]§! Kg\n§YProducción Semanal de Material de Grado Reactor§!: [?total_nuclear_reactor_fuel_production|G2] Kg\n§YConsumo Semanal de Material de Grado Reactor§!: [?nuclear_fuel_consumption|-2] Kg\n\n§YModificadores§!:\nImpacto de la Ley, los Espíritus Nacionales y las Tecnologías en el §YCombustible para Reactores Nucleares§! Consumo: [?modifier@nuclear_fuel_consumption_modifier|-%]"
 TOTAL_STORED_ENERGY: "Energía almacenada: [?stored_energy|3Y] GWh de [?max_stored_energy|3Y] GWh Almacenamiento máximo"
 TOTAL_STORED_ENERGY_TT: "Esto muestra la cantidad actual de exceso de energía que tenemos almacenada, además del máximo que podemos retener.¡Podemos obtener más §YAlmacenamiento máximo§! mediante la construcción de §YParques de Baterías§! adicionales."
 OPEN_ENERGY_BUTTON: "Abre la interfaz de §YPantalla de Energía§!"
 OPEN_ENERGY_BUTTON_TT: "Esto abre la §YPantalla de Energía§!, donde puedes ver el consumo de energía, la generación y el cumplimiento de los requisitos energéticos de tu nación."
 total_ffp_amount_tt: "Este valor representa el número total de §Ycentrales eléctricas de combustibles fósiles§! en nuestra nación."
 total_ffp_amount_tt_delayed: "§YFossil Fuel Powerplants§! es un conjunto de captura para todas las fuentes termoeléctricas basadas en fósiles. Estos incluyen pero no se limitan a; carbón, gas natural y petróleo. §Y Powerplants de combustible alimentario§! vacilará si la generación de energía es más alta que el consumo.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y7.5K§!\nProducto básico del PIB por §YFosil Fuel Powerplant§!: $§Y1.7 Billion§!\nGanancia de energía base: §G+2§! GW\n\n§Y Gain de potencia por planta§!: [?fossil_pp_energy_per_plant_display|+2] GW"
 total_nuclear_reactor_amount_tt: "Este valor representa el número total de §YReactores Nucleares§! en nuestra nación."
 total_nuclear_reactor_amount_tt_delayed: "Este edificio convierte la energía nuclear en energía eléctrica, consumiendo uranio moderadamente enriquecido en el proceso.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y115K§!\nProducto básico del PIB por §Y Reactor Núclear§!: $§Y4 billón§!\nGanancia de energía base: §G+4§! GW\n\nCorriente §Y Ganancia de potencia por reactor§!: [?nuclear_energy_per_reactor_display|+2] GW"
 total_renewable_energy_amount_tt: "Este valor representa el número total de §YInfraestructura de Energías Renovables§! en nuestra nación."
 total_renewable_energy_amount_tt_delayed: "§YLa infraestructura energética renovable§! es un conjunto de capturas para todas las fuentes de energía renovable. Estos incluyen pero no se limitan a; parques solares, turbinas eólicas, refinerías de biocombustibles, plantas de carbón vegetal, centrales eléctricas de biocombustible y mucho más. Por lo tanto, utiliza fuentes renovables y produce combustible de esas fuentes.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y22.5K§!\nProducto básico del PIB por §Y Infraestructura de Energía Renovable§!: $§Y2 billón§!\nGanancia de energía base: §G+0.5§! GW\n"
 total_fuel_silo_amount_tt: "Este valor representa el número total de §YReservas de Recursos Estratégicos§! en nuestra nación."
 total_fuel_silo_amount_tt_delayed: "La §YReservas de Recursos Estratégicos§! es una combinación de almacenes, almacenamiento en seco y otros tipos de almacenamiento similares a §YCombustible§!. Este edificio proporciona a tu nación más espacio para almacenar §HCombustible§!."
 heavy_power_restrictions_button_tt: "§YRestricciones de potencia intensa§!\nNuestro consumo de energía está superando nuestra generación de energía. Una posible solución temporal es restringir rápidamente el consumo eléctrico de la población hasta que podamos comenzar a construir plantas de energía adicionales, energía renovable y más para mitigar esta creciente crisis. Imponer fuertes restricciones a la población provocará una reducción significativa del crecimiento económico, el consumo de energía y la proyección política."
 heavy_power_restrictions_button_delayed_tt: "§YEfectos:§!\n[!heavy_power_restrictions_button_click]"
 some_power_restrictions_button_tt: "§YAlgunas restricciones de energía§!\nNuestro consumo de energía está superando nuestra generación de energía. Una posible solución temporal es restringir rápidamente el consumo eléctrico de la población hasta que podamos comenzar a construir plantas de energía adicionales, energía renovable y más para mitigar esta creciente crisis. Imponer algunas restricciones a la gente provocará una pequeña reducción en el crecimiento económico, el consumo de energía y la proyección política."
 some_power_restrictions_button_delayed_tt: "§YEfectos:§!\n[!some_power_restrictions_button_click]"
 no_power_restrictions_button_tt: "§YSin restricciones de energía§!\nEl status quo suele ser el escenario más normal para la economía de nuestra nación y la seguridad política de nuestro partido. No restringimos el consumo de la gente ni fomentamos el consumo adicional."
 no_power_restrictions_button_delayed_tt: "§YEfectos:§!\n[!no_power_rules_button_click]"
 some_additional_consumption_button_tt: "§YAlgún Consumo Adicional§!\nActualmente producimos en exceso energía para nuestra gran nación. Deberíamos fomentar un consumo adicional para aprovechar nuestra producción excesiva. Fomentar el consumo adicional nos dará una pequeña bonificación a la velocidad de construcción y al poder político, al tiempo que aumentará en una pequeña cantidad el consumo de energía de nuestra gente."
 some_additional_consumption_button_delayed_tt: "§YEfectos:§!\n[!some_additional_consumption_button_click]"
 heavy_additional_consumption_button_tt: "§YConsumo adicional intenso§!\nActualmente producimos en exceso energía para nuestra gran nación. Deberíamos fomentar un consumo adicional para aprovechar nuestra producción excesiva. Fomentar un consumo adicional elevado nos dará una gran bonificación a la velocidad de construcción y al poder político, al tiempo que aumentará drásticamente el consumo de energía de nuestra gente."
 heavy_additional_consumption_button_delayed_tt: "§YEfectos:§!\n[!heavy_additional_consumption_button_click]"
 build_battery_park_button_tt: "§YConstruir Battery Park§!\n¡Un §YBattery Park§! ¡Es una estructura grande y costosa que puede almacenar §Y100GWh§! de exceso de producción de energía, cada uno. Puede ser beneficioso construir estas instalaciones para ayudar a almacenar energía para momentos en que no podamos producir lo suficiente para igualar el consumo, especialmente cuando utilizamos energía renovable debido a su producción inestable."
 build_battery_park_button_delayed_tt: "§YPrerrequisitos:§!\n[!build_battery_park_button_click_enabled]\n§YEfectos:§!\n[!build_battery_park_button_click]\nPodemos poner en cola un grupo de §YTres Parques de Baterías§! a la vez con £key_shift + £click_left §YShft L Clic§!.\n§YPrerrequisitos:§!\n[!build_battery_park_button_shift_click_enabled]\n§YEfectos:§!\n[!build_battery_park_button_shift_click]"
 buy_fuel_for_money_button_tt: "§YCompre combustible en el mercado§!\nAlgunos proveedores de todo el mundo ofrecen combustible a cambio de dinero. Comprar combustible puede ayudar a mantener nuestras plantas de energía de combustibles fósiles y a nuestro ejército funcionando en apuros."
