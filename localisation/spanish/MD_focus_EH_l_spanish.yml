 EH_scientist_Jennifer_Doudna_tt: "§YJennifer Doudna§!"
 EH_scientist_Jennifer_Doudna_tt_delayed: "Jennifer Doudna es una famosa bioquímica conocida por su trabajo pionero en la tecnología de edición de genes CRISPR junto con Emmanuele Charpentier. Gracias a la CRISPR, podemos comprender mejor el maquillaje genético de la Chimera y encontrar una manera de explotar sus debilidades.\n--------------\n§YEfectos:§!\n[!EH_hire_Jennifer_Doudna_button_click]\n\n§YPrerequisitos:§!\n[!EH_scientist_Jennifer_Doudna_click_enabled]"
 EH_scientist_Fabiola_Gianotti_tt: "§YFabiola Gianotti§!"
 EH_scientist_Fabiola_Gianotti_tt_delayed: "Fabiola Gianotti es un físico experimental italiano de partículas, y el actual Director General del CERN. Su experiencia en física de partículas y experiencia con colaboraciones científicas a gran escala será inestimable en nuestros esfuerzos por comprender los Portales y su conexión con otra dimensión.\n--------------\n§YEfectos:§!\n[!EH_hire_Fabiola_Gianotti_button_click]\n\n§YPrerequisitos:§!\n[!EH_scientist_Fabiola_Gianotti_click_enabled]"
 EH_scientist_Lene_Hau_tt: "§YLene Hau§!"
 EH_scientist_Lene_Hau_tt_delayed: "Lene Hau es un físico danés conocido por su trabajo innovador en la lentitud y parar la luz. Su experiencia en óptica cuántica y física de materia condensada podría proporcionar información sobre la naturaleza de los Portales y sus emisiones energéticas.\n--------------\n§YEfectos:§!\n[!EH_hire_Lene_Hau_button_click]\n\n§YPrerequisitos:§!\n[!EH_scientist_Lene_Hau_click_enabled]"
 EH_scientist_Emmanuelle_Charpentier_tt: "§YEmmanuelle Charpentier§!"
 EH_scientist_Emmanuelle_Charpentier_tt_delayed: "Emmanuelle Charpentier es un microbiólogo y bioquímico francés. Junto con Jennifer Doudna, desarrolló la tecnología de edición de genes CRISPR-Cas9. Su conocimiento será crucial en nuestros esfuerzos por comprender y manipular potencialmente la biología de Chimera.\n--------------\n§YEfectos:§!\n[!EH_hire_Emmanuelle_Charpentier_button_click]\n\n§YPrerequisitos:§!\n[!EH_scientist_Emmanuelle_Charpentier_click_enabled]"
 EH_scientist_Andrzej_Trautman_tt: "§YAndrzej Trautman§!"
 EH_scientist_Andrzej_Trautman_tt_delayed: "Andrzej Trautman es un físico teórico polaco-americano conocido por su trabajo en relatividad general y física de agujeros negros. Su experiencia podría ayudarnos a entender la física fundamental detrás de los Portales y sus efectos en nuestro mundo.\n--------------\n§YEfectos:§!\n[!EH_hire_Andrzej_Trautman_button_click]\n\n§YPrerequisitos:§!\n[!EH_scientist_Andrzej_Trautman_click_enabled]"
