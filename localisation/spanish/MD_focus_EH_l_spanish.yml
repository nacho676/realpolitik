 sp_monitor_portal_energy_emissions_project: "Portal Energy Emissions"
 sp_monitor_portal_energy_emissions_project_desc: "Con la ayuda de nuestros satélites, monitorearemos las emisiones energéticas del Portal más cercano. Esto nos permitirá reunir más información sobre el enemigo y sus movimientos. Si tenemos éxito, también podemos deshacernos de los fallos cíclicos en nuestra red satelital causada por esas emisiones."
 sp_monitor_portal_energy_emissions_project_prototype: "Marcamientos de energía irregulares"
 sp_monitor_portal_energy_emissions_project_prototype_desc: "Nuestros satélites dañados lograron reportar algunas marcas de energía irregulares que están constantemente recogiendo desde los Portals. Parece que son responsables de las fallas en nuestra red satelital. Podemos preparar contramedidas para proteger a nuestros satélites de esas emisiones, o podemos pasar más tiempo investigando este fenómeno para comprenderlo mejor."
 sp_monitor_portal_energy_emissions_project_prototype_a: "El progreso es el más importante"
 sp_monitor_portal_energy_emissions_project_prototype_b: "Tiempo de paso para la investigación adicional"
 sp_spies_in_hive_project: "Spies in Hive"
 sp_spies_in_hive_project_desc: "Algunas de las unidades Chimera regresan a su zona Portal después de un ataque exitoso. Parecen tener comportamiento casi instintivo durante esta fase, creando una ventana de oportunidad para marcarlos con un rastreador y una pequeña cámara. Aftar eso, les permitiremos volver al Portal. ¿Qué podría ir mal?"
 sp_spies_in_hive_project_prototype: "Mechs puede ser nuestros hombres de entrega"
 sp_spies_in_hive_project_prototype_desc: "Ya que estamos produciendo Mechs, podemos utilizarlos para colocar rastreadores mientras luchamos contra las fuerzas de Chimera. Será arriesgado y seguro perderemos muchas máquinas buenas y sus pilotos, pero puede acercarnos más a terminar esta guerra."
 sp_spies_in_hive_project_prototype_a: "Use sólo Mechs"
 sp_spies_in_hive_project_prototype_b: "No podemos perder demasiados Mechs, el ejército ayudará."
 sp_spies_in_hive_project_prototype_c: "No tome ningún riesgo adicional"
 sp_the_tesla_weapon_project: "El T.E.S.L.A. Weapon"
 sp_the_tesla_weapon_project_desc: "El Sistema Electromagnético Táctico de Aniquilación Lineal (T.E.S.L.A.) es un superarma diseñado para emitir un potente pulso electromagnético (EMP) capaz de desactivar los sistemas electrónicos dentro de un amplio radio. Esta arma podría ser nuestra clave para interrumpir los Portales y debilitar permanentemente las fuerzas de Chimera."
 sp_the_tesla_weapon_project_prototype: "Reorientación del sector de la investigación"
 sp_the_tesla_weapon_project_prototype_desc: "Podemos redirigir todos nuestros esfuerzos de investigación hacia el desarrollo del arma T.E.S.L.A. Esto acelerará el proyecto, pero puede retrasar otras iniciativas importantes de investigación."
 sp_the_tesla_weapon_project_prototype_a: "Enfoque toda investigación sobre T.E.S.L.A."
 sp_the_tesla_weapon_project_prototype_b: "Actividades de investigación equilibradas"
 sp_the_tesla_weapon_project_prototype_c: "No podemos permitirnos retrasos."
 sp_hacs_gen_one_project: "BF-38 Atlas"
 sp_hacs_gen_one_project_desc: "La primera generación de mechs del Sistema de Combate de Alta Agilidad (HACS) será un hito significativo en nuestra lucha contra la Chimera. Estos mechs serán nuestro mayor activo para luchar contra las fuerzas de Chimera."
 sp_hacs_gen_one_project_prototype_western_one: "¿Durabilidad o potencia de fuego?"
 sp_hacs_gen_one_project_prototype_western_one_desc: "El campo de batalla es un lugar difícil, y nuestros mechs necesitan ser capaces de soportar fuego pesado mientras entregan golpes poderosos al enemigo. Podemos centrarnos en mejorar la durabilidad de nuestro HACS, haciéndolos más resistentes en el combate. Alternativamente, podemos priorizar la potencia de fuego, equipar nuestras mechs con armamento avanzado para derribar enemigos rápidamente."
 sp_hacs_gen_one_project_prototype_western_one_a: "Mejorar la durabilidad"
 sp_hacs_gen_one_project_prototype_western_one_b: "Priorizar el poder de fuego"
 sp_hacs_gen_one_project_prototype_western_one_c: "Es perfecto como ahora."
 sp_hacs_gen_one_project_prototype_western_two: "Prioridad del componente HACS"
 sp_hacs_gen_one_project_prototype_western_two_desc: "Tenemos algunos fondos de repuesto para mejorar nuestro diseño HACS. Podemos enfocarnos en mejorar la movilidad de nuestras mechs, haciéndolos más rápidos y ágiles en el campo de batalla. Alternativamente, podemos invertir en mejorar sus sistemas de armas, aumentando su capacidad ofensiva."
 sp_hacs_gen_one_project_prototype_western_two_a: "Enfoque sobre movilidad"
 sp_hacs_gen_one_project_prototype_western_two_b: "Enfoque sobre armas"
 sp_hacs_gen_one_project_prototype_eastern_one: "Posible reducción de la producción"
 sp_hacs_gen_one_project_prototype_eastern_one_desc: "Podemos saltar algunos de los desencadenantes de seguridad y sistemas redundantes en nuestro diseño HACS para acelerar la producción. Si bien esto puede llevar a un ligero aumento de las tasas de mal funcionamiento, nos permitirá desplegar más mechs al campo de batalla más rápido."
 sp_hacs_gen_one_project_prototype_eastern_one_a: "Los necesitamos tan rápido."
 sp_hacs_gen_one_project_prototype_eastern_one_b: "Deberíamos poner más trabajo en él."
 sp_hacs_gen_one_project_prototype_eastern_one_c: "Mantener las normas de producción actuales"
 sp_hacs_gen_one_project_prototype_eastern_two: "Eficacia en el campo de batalla"
 sp_hacs_gen_one_project_prototype_eastern_two_desc: "Podemos construir un número mayor de mechs HACS para abrumar al enemigo con números simples. Alternativamente, podemos enfocarnos en mejorar el diseño de nuestras mechs para que sean más eficaces en combate, incluso si significa producir menos unidades."
 sp_hacs_gen_one_project_prototype_eastern_two_a: "Necesitamos más Mechs"
 sp_hacs_gen_one_project_prototype_eastern_two_b: "Mejoremos su diseño."
 sp_hacs_gen_two_project: "GSK-41 Bogatyr"
 sp_hacs_gen_two_project_desc: "El momento ha llegado para otra actualización de nuestros nuevos majestuosos mechs HACS. Gracias a los apasionados ingenieros civiles y científicos, hemos logrado mejorar aún más el diseño de nuestros mechs. Quizá encontremos una forma de hacerlos más baratos para producir."
 sp_hacs_gen_two_project_prototype_western_one: "Reducción del costo de Randallite"
 sp_hacs_gen_two_project_prototype_western_one_desc: "A través de viejas notas de investigación, hemos encontrado algunas ideas sobre cómo reducir la cantidad de Randallite utilizada en la producción HACS. Mediante la implementación de estos cambios, podemos bajar el costo de cada mech sin afectar significativamente su rendimiento."
 sp_hacs_gen_two_project_prototype_western_one_a: "¡Claro!"
 sp_hacs_gen_two_project_prototype_western_one_b: "No podemos debilitar nuestras mechs."
 sp_hacs_gen_two_project_prototype_eastern_one: "Reducción del costo de Randallite"
 sp_hacs_gen_two_project_prototype_eastern_one_desc: "Gracias a la nueva investigación sobre Randallite, hemos encontrado una manera de reducir aún más la cantidad de este valioso recurso utilizado en la producción HACS. Esto nos permitirá producir más mechs con la misma cantidad de Randallite, pero las máquinas tendrán que sacrificar algún rendimiento."
 sp_hacs_gen_two_project_prototype_eastern_one_a: "Claro que no."
 sp_hacs_gen_two_project_prototype_eastern_one_b: "Eso es demasiada desventaja en el campo de batalla."
 sp_hacs_gen_three_project: "SAS-32 Hercules"
 sp_hacs_gen_three_project_desc: "El momento ha llegado para otra actualización de nuestros nuevos majestuosos mechs HACS. Gracias a los apasionados ingenieros civiles y científicos, hemos logrado mejorar aún más el diseño de nuestros mechs. Quizá encontremos una forma de hacerlos más baratos para producir."
 sp_hacs_gen_three_project_prototype_one: "El arma final"
 sp_hacs_gen_three_project_prototype_one_desc: "Nuestros ingenieros han propuesto un rediseño radical de los mechs HACS, con el objetivo de crear el arma definitiva contra la Chimera. Este nuevo diseño empujará los límites de la tecnología actual, resultando en un mech que es más rápido, más fuerte y más resistente que nunca antes, pero a un precio mucho más alto."
 sp_hacs_gen_three_project_prototype_one_a: "Esa es la última arma."
 sp_hacs_gen_three_project_prototype_one_b: "¡Los necesitamos ahora!"
 sp_hacs_gen_three_project_prototype_one_c: "Diseño actual es perfecto"
 EH_spirits_lasts_until_war_is_active_TT: "§YEste Espíritu nacional durará hasta que tenga guerra con los invasores.§!"
 EH_defence_decrease_blocked_while_at_war_with_ALN_TT: "§REl gasto militar no puede disminuirse en guerra con los invasores.§!"
 EH_the_country_of_war_idea_TT: "§YAgrega el modificador del país de guerra.§!\n§RRemovidos cuando no se cumplen los requisitos de enfoque.§!"
 EH_controlled_situation_idea_TT: "§YAgregar modificador de la situación controlada§!\n§RRemovidos cuando no se cumplen los requisitos de enfoque.§!"
 EH_territorial_defense_idea_TT: "§YAñadir modificador de Defensa Territorial§!"
 EH_electric_traps_TT: "Habilitar §YElectric Traps§! decisiones, que aparecerán en el mapa mientras se encuentra en guerra con Chimera (con la pestaña de decisiones activas). Cada trampa se puede establecer en el estado controlado, que es el estado de §Yfrontline§! o §Ysegunda línea§!. La configuración de la trampa costará §R1 Technology Metal§! y utilizará §R100 MW§! de energía mientras esté activa.\n\nLa trampa estará activa durante §Y10 días§! y luego irá en la refrigeración por §Y15 días§!. Mientras la trampa está activa, todas las unidades enemigas del estado recibirán §G+20%§! §Y atrición§! y §G-15%§! §Y velocidad de movimiento§!. La trampa se puede quitar, que devolverá §G1 Technology Metal§!."
 EH_electric_trap_cooldown: "El trapo está en la refrigeración ([?EH_electric_trap_cooldown:days_left|0Y] días)"
 EH_electric_trap_removing_flag: "La trampa en este estado está siendo removida"
 EH_electric_trap_active_flag: "Trampa en este estado es actualmente activo"
 EH_electric_trap_energy_use_TT: "§YEsta trampa utilizará §R100 MW§! de energía mientras esté activa.§!"
