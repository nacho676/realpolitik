l_spanish:
 event_horizon_generic_focus: "Humanidad Enfoque Árbol"
 chimera_focus: "Chimera Enfoque Árbol"
 EH_set_up_electric_trap: "Instalar una trampa eléctrica"
 EH_remove_electric_trap: "Quitar el trapo eléctrico"
 EH_activate_electric_trap: "Activar el trapo eléctrico"
 EH_drone_mission_category: "Drone Misión"
 EH_drone_mission_category_desc: "\n£EH_gui_drone_picture\n\n\n\nLos Drones son nuestras mejores y más seguras herramientas de reconocimiento. Gracias a ellos podemos reunir información sobre el enemigo sin arriesgar la vida de nuestros soldados. Podemos utilizarlos para explorar el cercano Portal y ver lo que el enemigo está construyendo alrededor de él, así que tal vez nos permita ganar una ventaja táctica durante la batalla de una de esas cosas."
 EH_research_sites_category: "Sitios de investigación"
 EH_research_sites_category_desc: "Los sitios de investigación son nuestra mejor forma de reunir más información sobre las Quimeras y su tecnología. Estos puestos atraerán a los mejores científicos disponibles y darán un bono de investigación a nuestros proyectos especiales. Ojalá las fuerzas Quimera no los noten demasiado pronto."
 EH_setup_research_site: "Configuración del sitio de investigación"
 EH_install_anti_air_weapons: "Instalar Antiaéreo Armas"
 EH_panic_shelters_and_land_turrets: "Construir refugios antipánico y torretas terrestres"
 EH_hire_additional_security_for_scientists: "Contratar seguridad adicional para los científicos"
 EH_disable_site_notifications: "Desactivar las notificaciones de incursión en sitios de investigación"
 EH_enable_site_notifications: "Activar las notificaciones de incursión en sitios de investigación"
 EH_doudna_or_charpentier_project_mission: "§YJennifer Doudna§! y §YEmmanuelle Charpentier§!"
 EH_doudna_or_charpentier_project_mission_desc: "§YJennifer Doudna§! y §YEmmanuelle Charpentier§! están trabajando en un proyecto especial que puede ayudarnos a entender mejor el maquillaje genético de la Chimera. Su experiencia en la tecnología de edición de genes CRISPR podría proporcionar información inestimable sobre las debilidades de estas criaturas, permitiéndonos desarrollar estrategias más eficaces para combatirlas."
 EH_find_new_veins_category: "Hallar nuevas vetas de randallita"
 EH_find_new_veins_category_desc: "La randallita es un recurso raro y valioso que se encuentra en ciertas vetas del mundo. Es esencial para nuestra investigación y desarrollo de nuevas tecnologías para combatir a las Quimeras. Al invertir en exploración y minería, podemos aumentar nuestras probabilidades de hallar nuevas vetas de randallita y asegurar un suministro estable de este recurso crucial.\n\nCada mina de randallita dará una pequeña cantidad de randallita cada semana. Necesitamos encontrar y asegurar tantos puntos calientes como sea posible, antes de que las grandes corporaciones se hagan con la extracción de este recurso y nos obliguen a tomar decisiones desagradables."
 EH_search_for_randallite_veins: "Buscar vetas de randallita"
 EH_set_up_mine_mission: "Abriendo una nueva mina"
 EH_large_company_seeks_for_randallite_mission: "Una gran corporación busca randallita"
 EH_outlaw_randallite_extraction: "Prohibir la extracción no estatal de randallita"
 EH_legalize_randallite_extraction: "Legalizar la extracción no estatal de randallita"
 EH_construct_southern_zenobia_defense_line: "Construir la línea de defensa §GZenobia Meridional§!"
 EH_construct_western_zenobia_defense_line: "Construir la línea de defensa §GZenobia Occidental§!"
 EH_construct_inner_saladin_defense_line: "Construir la línea de defensa §GSaladino Interior§!"
 EH_construct_outer_saladin_defense_line: "Construir la línea de defensa §GSaladino Exterior§!"
 EH_southern_zenobia_defense_line_destruction: "La línea de defensa de Zenobia Meridional se derrumba"
 EH_western_zenobia_defense_line_destruction: "Línea de Defensa de Zenobia Occidental colapsando"
 EH_inner_saladin_defense_line_destruction: "La línea de defensa de Saladino Interior se derrumba"
 EH_outer_saladin_defense_line_destruction: "La línea de defensa de Saladino Exterior se derrumba"
 EH_nile_defense_line_category: "Zenobia & Líneas de Defensa Saladino"
 EH_nile_defense_line_category_desc: "Las Líneas de Defensa del Nilo son nuestra mejor oportunidad para mantener la línea contra las fuerzas de Chimera en África. La Línea Zenobia será nuestra primera línea de defensa, mientras que la Línea Saladin será nuestra última esperanza si cae la Línea Zenobia. Tenemos que asegurarnos de que ambas líneas estén bien fortificadas y mantenidas, ya que serán la clave para nuestra supervivencia en esta guerra."
 EH_bosporus_defense_line_category: "Línea de defensa de Bosphorus"
 EH_bosporus_defense_line_category_desc: "La Línea de Defensa de Bosphorus es nuestra mejor oportunidad para mantener la línea contra las fuerzas de Chimera en Europa. La línea será fortificada con artillería pesada y defensas antiaéreas, así como una red de trincheras y búnkeres. Los ejércitos de la mayoría de las naciones europeas estarán estacionados allí. Tenemos que asegurarnos de que la línea se mantenga."
 EH_construct_bosphorus_defense_line: "Construir la línea de defensa del §GBósforo§!"
 EH_bosphorus_defense_line_destruction: "La línea de defensa del Bósforo se derrumba"
 EH_caucasus_defense_line_category: "Línea de defensa del Cáucaso"
 EH_caucasus_defense_line_category_desc: "El enemigo está progresando rápidamente a través del Oriente Medio, amenazando nuestras fronteras meridionales. La Línea de Defensa del Cáucaso es nuestra mejor oportunidad para mantener la línea contra las fuerzas de Chimera en esta región. La fortificación será un sistema de defensa de dos capas, con la primera línea que consta de trincheras y búnkeres, mientras que la segunda línea estará fortificada con artillería pesada y defensas antiaéreas. Tenemos que asegurarnos de que la línea se mantenga y esperemos que mantengamos a la Chimera en el Tíbet, a menos que nuestra línea de defensa colapse desde atrás."
 EH_construct_caucasus_defense_line: "Construir la línea de defensa del §GCáucaso§!"
 EH_caucasus_defense_line_destruction_1: "La primera línea de defensa del Cáucaso se derrumba"
 EH_caucasus_defense_line_destruction_2: "La segunda línea de defensa del Cáucaso se derrumba"
 EH_event.0.t: "¡Bienvenido al Horizonte!"
 EH_event.0.d: "Evento Horizon es nuestro primer escenario especial enorme, hecho para celebrar 1 millón de suscriptores en Steam Workshop. Es un escenario centrado en la guerra, donde la humanidad está luchando por su supervivencia contra invasores alienígenas desconocidos. El escenario cuenta con un árbol de enfoque único, nuevos eventos, decisiones, mecánicas, unidades y recursos que te sumergirá en esta batalla épica para la supervivencia. Prepárate para enfrentar lo desconocido y llevar a la humanidad a la victoria y gracias por tu apoyo!"
 EH_event.0.a: "Wooohooo! Espera, ¿ALIENS?!!!"
 EH_event.1.t: "Las Líneas Zenobia y Saladin están bajo construcción"
 EH_event.1.d: "En respuesta a la creciente amenaza que surge del África subsahariana, la Alianza de Oriente Medio ha autorizado la rápida construcción de una línea de defensa fortificada a lo largo de los sectores meridionales del Nilo y el desierto occidental de Egipto. Diseñado la Línea Zenobia, esta posición anclará los emplazamientos de artillería pesada, sistemas de trincheras a través de vectores de enfoque clave.\n\nSi la línea Zenobia cae, la línea Saladin se mantiene fuerte detrás de ella. Esparciendo toda la zona del canal desde Port Said al Mar Rojo, esta fortificación actuará como línea de defensa absoluta.\n"
 EH_event.1.a: "Que el desierto se convierta en nuestro escudo"
 EH_event.300.t: "CERN atrae más allá"
 EH_event.300.d: "Los investigadores de la Organización Europea para las Investigaciones Nucleares (CERN) han realizado con éxito una colisión controlada de alta energía que da lugar a la creación temporal de lo que se describe como una « anomalía interdimensional localizada».\n\nAunque el rift se midió a nivel subatámico y duró sólo una fracción de un nanosegundo, marca la primera instancia registrada de las firmas energéticas no compatible con leyes físicas conocidas. Protocolos iniciales de contención, y no se observó transferencia material, pero las implicaciones ya están enviando ondas de choque a través de la comunidad científica mundial.\n\nLa línea entre teórica y real acaba de difuminarse."
 EH_event.300.a: "¿Esto es realmente seguro?"
 EH_event.301.t: "Convoy de las Naciones Unidas desaparecido en África central"
 EH_event.301.d: "Un convoy humanitario de las Naciones Unidas que opera en la región fronteriza entre Rwanda y la República Democrática del Congo se ha vuelto oscuro. Las imágenes de satélite muestran signos de destrucción y vehículos volcados diseminados a lo largo de una ruta de la selva, pero no se recibieron señales de socorro.\n\nNo se recuperaron sobrevivientes ni cuerpos. Ninguna facción rebelde ha reclamado responsabilidad. La causa del incidente sigue siendo oficialmente desconocida."
 EH_event.301.a: "Otro ataque contra el personal de paz de la ONU..."
 EH_event.302.t: "Actividad sismica inusual en la cuenca del Tarim"
 EH_event.302.d: "Se ha registrado un grupo de temblores poco profundos y de alta frecuencia en la cuenca del Tarim, China occidental. Los patrones sísmicos son inconsistentes con el movimiento tectónico natural o la actividad subterránea conocida. Las autoridades chinas no han publicado una declaración, pero los datos de sismología regional compartidos silenciosamente a través de un programa de intercambio universitario han levantado cejas entre geofísicos."
 EH_event.302.a: "Las lecturas no tienen sentido"
 EH_event.303.t: "Silencio de radio en los Pamirs"
 EH_event.303.d: "Un puesto de escucha del PLA de alta altitud cerca de la frontera entre China y Tayikistán ha cesado toda comunicación. Ninguna palabra oficial viene de Beijing, pero un operador de radio aficionado kazajo informó escuchar una breve transmisión de emergencia en Mandarín antes del silencio total. Los satélites de inteligencia muestran señales visibles de daño."
 EH_event.303.a: "¿Fue un ataque de Tajik?"
 EH_event.304.t: "Desaparecidos Rangers en el norte de Alaska"
 EH_event.304.d: "Dos guardaparques nacionales que patrullan un sector remoto del Parque Nacional Denali han sido declarados desaparecidos después de no registrarse durante 72 horas. Un equipo de búsqueda fue enviado, sólo para descubrir su campamento abandonado con señales claras de una lucha.\n\nMientras que la historia sólo fue reportada por los periódicos locales al principio, comenzó a ganar tracción nacional e internacional cuando el partido de búsqueda también desapareció sin rastros. El FBI ha abierto una investigación y se está llevando a cabo una persecución."
 EH_event.304.a: "¿Un asesino suelto?"
 EH_event.305.t: "Extraño brote en las tierras altas peruanas"
 EH_event.305.d: "Una remota aldea de las tierras altas andinas del sur del Perú ha sido cuarentena por las autoridades sanitarias regionales tras un misterioso brote. Los informes iniciales describen fiebre, alucinaciones y desorientación sensorial aguda entre los lugareños. Los síntomas surgieron rápidamente después de una «lucha de luz» reportada y el temblor se sentía sólo dentro de un estrecho valle cerca del pueblo.\n\nFuncionarios peruanos afirman que es una infección fúngica aislada, pero las ONG que operan cerca dicen que los equipos médicos han sido escoltados por personal militar. Un geólogo de la Universidad Nacional de San Marcos, parte de un equipo de investigación que estudia cuevas cercanas, está entre los desaparecidos."
 EH_event.305.a: "Mantennos actualizados"
 EH_event.306.t: "Disturbios en Xinjiang: Base Militar Atacada"
 EH_event.306.d: "Ha ocurrido un incidente violento cerca de Kashgar, el oeste de Xinjiang. Los medios de comunicación estatales chinos son silenciosos, pero los informes de inteligencia indican que la Base 36, una instalación del PLA cerca de Yecheng, fue invadida por elementos hostiles no identificados durante la noche. Descripción dada a través de la radio tenía poco sentido en cuanto a la naturaleza real de los atacantes.\n\nEl Ejército Popular de Liberación ha comenzado el despliegue de unidades mecanizadas y equipos de respuesta química a la región. Los aviones de transporte fueron vistos aterrizando en el aeropuerto de Kashgar en las primeras horas.\n\nEn un movimiento raro, un destacamento ruso de respuesta rápida también ha cruzado China a través del Paso Kulma."
 EH_event.306.a: "Situación bajo control, según Beijing"
 EH_event.307.t: "Detonación nuclear táctica en China occidental"
 EH_event.307.d: "Se detectó una explosión nuclear táctica cerca del desierto de Taklamakan, a unos 120 kilómetros al este de Kashgar. La explosión ocurrió cinco días después de que las unidades del PLA se desplegaran para contener la amenaza desconocida en la región.\n\nTanto Beijing como Moscú han negado cualquier uso de armas nucleares, pero los datos sísmicos confirman una detonación de bajo rendimiento consistente con una ojiva táctica rusa. Las imágenes satelitales muestran terrenos escorvados, estratos geológicos derrumbados y un orbe oscuro que se expande rápidamente.\n\nLos observadores internacionales piden respuestas, pero los canales oficiales permanecen en silencio. Dentro de los círculos militares, la especulación está aumentando que la huelga fue una decisión unilateral del mando sobre el terreno ruso bajo la doctrina del compromiso de emergencia."
 EH_event.307.a: "¿Qué está pasando ahí?"
 EH_event.308.t: "El velo es Torn"
 EH_event.308.d: "Las imágenes satelitales filtradas por una fuente de inteligencia sin nombre se han vuelto virales en todo el mundo: un vasto, púrpura, pulsante orbe sobre los restos quemados del sitio de impacto con un enjambre de criaturas que salen de él. Los científicos están perdidos para explicar las imágenes. El filme muestra claramente que la huelga nuclear no pudo destruirla, y si algo, sólo causó que creciera. Dentro de horas, surgieron tres nuevos portales de similar tamaño y efecto:\n- En Northwestern Alaska\n- En las tierras altas de Kenia, cerca del Monte Elgon\n- En el sur de Chile, cerca del Cabo Hornos.\n\nLos informes ya están derramando en que las criaturas son altamente agresivas. La edad de la normalidad ha terminado."
 EH_event.308.a: "La verdad ya no se puede negar"
 EH_event.309.t: "La ONU convoca una Asamblea de Emergencia"
 EH_event.309.d: "Con el aumento del pánico público y la confianza en los gobiernos nacionales que falten, las Naciones Unidas han entrado en sesión de emergencia. La Asamblea General ha invocado rara vez poderes de crisis usados, y el Consejo de Seguridad está encerrado en un debate urgente sobre estrategias coordinadas de respuesta.\n\nLas propuestas van desde la cooperación militar mundial hasta los grupos de tareas científicos conjuntos. Las tensiones están aumentando entre los miembros permanentes como la culpa circula y las agendas chocan.\n\nPero si los informes iniciales de compromiso son alguna indicación, una verdad ya está clara: la humanidad debe mantenerse unida o enfrentarse a la extinción."
 EH_event.309.a: "Una respuesta global comienza a tomar forma"
 EH_event.310.t: "A Comando Unido"
 EH_event.310.d: "La asamblea de emergencia de la ONU ha concluido con la creación del Comando Conjunto de las Naciones Unidas (UNJC). Un órgano internacional encargado de coordinar la estrategia militar, la inteligencia y el apoyo logístico contra la amenaza extradimensional que se está expandiendo rápidamente. Aunque se ha asesorado principalmente, se ha concedido al Comando una latitud operacional sin precedentes.\n\nParalelamente, los bloques regionales como la Unión Europea han comenzado propuestas flotantes para una unificación política y militar plena, citando la necesidad de movilización sin fisuras y soberanía compartida ante la extinción. Lo que una vez fue impensable ahora se discute abiertamente en los parlamentos de todo el continente."
 EH_event.310.a: "Un enemigo. Una guerra"
 EH_event.401.t: "Estados Unidos de América del Norte"
 EH_event.401.d: "Nuestro gobierno está dispuesto a pedir la unificación de nuestro continente. Es hora de unir y enfrentar la amenaza juntos. Sólo unidos podemos sobrevivir."
 EH_event.401.a: "Hagámoslo."
 EH_event.402.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.402.d: "En un discurso histórico a la nación, [FROM.GetName] ha pedido la unificación de las estructuras militares y políticas norteamericanas con estados vecinos para formar un frente consolidado contra la amenaza de Chimera. Citando el peligro existencial que plantean los portales de propagación rápida y sus habitantes monstruosos, el gobierno destacó que sólo a través de la unidad se puede garantizar la supervivencia.\n\nLa propuesta incluye estructuras de mando compartidas, recursos compartidos, sistemas integrados de defensa y un territorio unificado."
 EH_event.402.a: "Es hora."
 EH_event.403.t: "Republica De Centro America"
 EH_event.403.d: "Siguiendo la dirección de América del Norte, es hora de que nuestra nación se una con nuestros vecinos. Nuestras naciones no son tan fuertes como las de América del Sur o del Norte, pero juntos podemos hacer una gran diferencia."
 EH_event.403.a: "Por la supervivencia de nuestro pueblo"
 EH_event.404.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.404.d: "Una oferta inesperada ha sido recibida del [FROM.GetName], proponiendo la unificación de las naciones centroamericanas en un solo estado para coordinar mejor la defensa contra la amenaza de Chimera.\n\nSi bien algunos dirigentes expresan su preocupación por la soberanía, la urgencia de la situación ha dado lugar a un serio examen del ofrecimiento."
 EH_event.404.a: "Tenemos que hacerlo, no importa lo que sea"
 EH_event.405.t: "La Unión de Naciones Sudamericanas"
 EH_event.405.d: "Actualmente somos la única parte no unificada de las Américas. Nuestras naciones son fuertes, pero no lo suficientemente fuertes para enfrentar la amenaza de Chimera sola. Es hora de unir y enfrentar la amenaza juntos."
 EH_event.405.a: "Enviar las invitaciones"
 EH_event.406.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.406.a: "Para el futuro de nuestro continente"
 EH_event.407.t: "La Federación Europea"
 EH_event.407.d: "Nuestro continente nunca ha estado más unido de lo que es hoy. La Unión Europea y la OTAN han establecido fuertes vínculos a lo largo de los años, pero ahora es hora de llevarlo al siguiente nivel. Tenemos que unirnos como una nación para enfrentar juntos la amenaza de Chimera."
 EH_event.407.a: "Nos vemos en Bruselas."
 EH_event.408.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.408.d: "Hoy, [GetDateText], el gobierno [FROM.GetAdjectiveCap] ha propuesto oficialmente la unificación de las naciones europeas en una sola entidad federal para coordinar mejor la defensa contra la amenaza de Chimera. Siguiendo a las Américas, estaba seguro de que una de las naciones surgirá con la misma propuesta para nuestro continente.\n\nSi bien puede estar en contra de los valores democráticos de la independencia de las naciones, la urgencia de la situación ha difuminado la mayoría de las opiniones ideológicas."
 EH_event.408.a: "Unidos antes, unido hoy"
 EH_event.409.t: "El punto de defensa africano"
 EH_event.409.d: "Nuestro continente ha enfrentado muchas guerras recientemente, pero todavía hay esperanza para nosotros. Las naciones africanas tienen que unir y enfrentar la amenaza de Chimera. Tienen que entender que es la única opción."
 EH_event.409.a: "Para la supervivencia de África"
 EH_event.410.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.410.d: "A pesar de todo, el gobierno de [FROM.GetName] ha propuesto la unificación de las naciones africanas para mantenerse unidos contra la amenaza de Chimera. Si bien algunas naciones siguen recuperándose de los conflictos recientes, la urgencia de la situación es más importante que nuestros problemas locales."
 EH_event.410.a: "Es lo mejor que podemos hacer."
 EH_event.411.t: "La Unión Continental Oriental"
 EH_event.411.d: "Tenemos que seguir el ejemplo de otros continentes. Nuestras naciones son fuertes, pero no lo suficientemente fuertes para enfrentar la amenaza de Chimera sola. Tenemos que dejar de lado nuestras diferencias y unirnos como uno."
 EH_event.411.a: "Enviar las invitaciones"
 EH_event.412.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.412.d: "Nuestras naciones han pasado por muchos conflictos brutales recientemente. [FROM.GetName] propone dejar de lado nuestras diferencias y unirnos como uno para enfrentar la amenaza de Chimera. No fue una charla fácil, pero el Chimera es una amenaza para todos nosotros mucho más grande que nuestros problemas locales."
 EH_event.412.a: "Por ahora, vamos a mantenernos juntos"
 EH_event.413.t: "La Federación de Eurasia"
 EH_event.413.d: "Nuestra gran facción tiene que permanecer unida. La amenaza de Chimera se acerca a nuestras fronteras. Nuestras naciones son fuertes, pero no lo suficientemente fuertes para enfrentar la amenaza de Chimera sola. Es hora de unir y enfrentar la amenaza juntos."
 EH_event.413.a: "Nos vemos en Moscú."
 EH_event.414.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.414.d: "Los tiempos son terribles. El gobierno de [FROM.GetName] ha propuesto la unificación de las naciones eurasiáticas en una sola entidad federal para coordinar mejor la defensa contra la amenaza de Chimera. Con la protección del ejército y la economía rusos, podremos repeler las fuerzas de Chimera de este planeta."
 EH_event.414.a: "¡Viva CSTO!"
 EH_event.415.t: "Los tres picos"
 EH_event.415.d: "Nuestra gran nación debe permanecer intacta, así que es hora de unir a nuestros aliados comunistas. Juntos podemos enfrentar la amenaza de Chimera y sobrevivir para ver otro día."
 EH_event.415.a: "Beijing dirigirá el camino"
 EH_event.416.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.416.d: "China no está abierta a formar otra federación enorme como otros continentes, pero nuestras naciones siempre han estado cercanas entre sí. El gobierno de [FROM.GetName] ha propuesto unir a nuestros países bajo una bandera para enfrentar juntos la amenaza de Chimera."
 EH_event.416.a: "La última fortaleza comunista"
 EH_event.417.t: "La Coalición de la ASEAN"
 EH_event.417.d: "Recientemente hemos estado rodeados de las megastatas. Y lo que está empeorando nuestra situación, es el cercano Chimera Portal en China. Es hora de unirnos y enfrentar la amenaza juntos."
 EH_event.417.a: "Hemos estado esperando demasiado tiempo ya."
 EH_event.418.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.418.d: "El gobierno de [FROM.GetName] ha propuesto la unificación de las naciones del sudeste asiático en una sola entidad para coordinar mejor la defensa contra la amenaza de Chimera. Con las recientes unificaciones en otros continentes, sólo era cuestión de tiempo hasta que una de nuestras naciones se presentara con la misma proposición."
 EH_event.418.a: "Nuestra única opción"
 EH_event.419.t: "La Coalición de Asia Oriental"
 EH_event.419.d: "La amenaza se acerca a nuestras fronteras. No sólo con las fuerzas de Chimera de China, sino también de la propia China y sus nuevos aliados. Enséñales que no nos mantendremos impunes en esta guerra."
 EH_event.419.a: "Por la seguridad de nuestras islas"
 EH_event.420.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.420.d: "El gobierno de [FROM.GetName] ha propuesto la unificación de las naciones del Asia oriental en una sola entidad para coordinar mejor la defensa contra la amenaza de Chimera y la creciente influencia de China."
 EH_event.420.a: "Prepárate para lo peor"
 EH_event.421.t: "La Unión de Defensa Oceánica"
 EH_event.421.d: "El resto del mundo está unido. Pensamos que esta guerra no llegará a nuestras islas, pero es sólo cuestión de tiempo. Nuestras naciones han vivido en paz general, ahora es el momento de unir y defender nuestros hogares."
 EH_event.421.a: "Para la supervivencia de Oceanía"
 EH_event.422.t: "[FROM.GetAdjectiveCap] El Gobierno exhorta a la unificación"
 EH_event.422.d: "El gobierno de [FROM.GetName] ha propuesto la unificación de las naciones oceánicas. Mientras nuestras naciones están lejos de las principales zonas de conflicto, las recientes unificaciones en otros continentes nos hicieron darnos cuenta de que tenemos que estar listos para cualquier cosa."
 EH_event.422.a: "So be it"
 EH_event.423.t: "El Rise de los Estados Unidos de América del Norte"
 EH_event.423.d: "La rápida respuesta del gobierno estadounidense a la amenaza de Chimera ha culminado en el establecimiento formal de los Estados Unidos de América del Norte (USNA). Después de semanas de intensas negociaciones, los países del continente han acordado disolver sus gobiernos nacionales e integrarse en una sola entidad federal.\n\nEl USNA ahora ordena una fuerza militar unificada, logística centralizada y un solo gobierno de guerra."
 EH_event.423.a: "Una nueva era comienza"
 EH_event.424.t: "Unificación de la Republica De Centro America"
 EH_event.424.d: "Los líderes de Centroamérica han acordado disolver sus gobiernos nacionales e integrarse en una sola entidad: la Republica De Centro America (RCA). No está completamente claro si la unificación fue provocada enteramente por la amenaza de Chimera, o si era también la amenaza que el USNA hace por sí mismo. Sin embargo, una cosa es cierta: Otro grupo de países está listo para enfrentar la amenaza apocalíptica."
 EH_event.424.a: "¿Quién habría pensado?"
 EH_event.425.t: "Unión de Naciones Sudamericanas ha sido formada"
 EH_event.425.d: "La última parte de América finalmente se ha unido. Después de semanas de negociaciones, las naciones sudamericanas han acordado unirse bajo una sola bandera: la Unión de Naciones Sudamericanas (UNASUR).\n\nToda América está preparada para enfrentar la amenaza juntos."
 EH_event.425.a: "Un rayo de esperanza"
 EH_event.426.t: "El nacimiento de la Federación Europea"
 EH_event.426.d: "Después de meses de disputas políticas, sesiones de emergencia y crecientes bajas, la Unión Europea ha votado para disolver su marco supranacional y reconstituirse como un solo mega-estado federal: la Federación Europea.\n\nIncluso países históricamente neutrales como Suiza y Finlandia, después de prolongados debates internos y referéndums, han optado por unirse, citando la amenaza existencial que plantean los CHIMERA. Con los ejércitos nacionales consolidados y las fronteras borradas, la Federación Europea ahora cuenta con una estructura de mando unificada, recursos compartidos y un gobierno único en tiempos de guerra.\n\nLos críticos advierten de la integración precipitada y la pérdida de independencia, pero los partidarios argumentan que nada menos que una unificación total garantizará la supervivencia."
 EH_event.426.a: "La supervivencia no conoce fronteras"
 EH_event.427.t: "La formación del punto de defensa africano"
 EH_event.427.d: "En un movimiento histórico, las naciones africanas se han reunido para formar el punto de defensa africano (ADF).\n\nA pesar de los persistentes conflictos regionales y las disparidades económicas, los dirigentes convinieron en que sólo mediante la unidad podían esperar defender a su pueblo y territorios. África está ahora preparada para contribuir significativamente a la lucha mundial contra la amenaza de CHIMERA."
 EH_event.427.a: "África está unida"
 EH_event.428.t: "Unión continental oriental establecida"
 EH_event.428.d: "En un giro sorprendente de los acontecimientos, naciones de Asia Central y África del Norte han acordado disolver sus gobiernos nacionales y formar la Unión Continental Oriental (ECU).\n\nEl movimiento viene en medio de la intensificación de las incursiones CHIMERA y la realización de que las respuestas fragmentadas sólo han ocasionado mayores pérdidas.\n\nSi bien algunos de los conflictos están lejos de resolverse, la urgencia de la amenaza de CHIMERA ha empujado a los líderes a priorizar la supervivencia sobre la soberanía."
 EH_event.428.a: "¿Esta alianza aguantará?"
 EH_event.429.t: "Eurasia Federación Oficialmente Formada"
 EH_event.429.d: "La reunión de Moscú ha terminado y ahora el mundo es testigo del nacimiento de la Federación Eurasia (ERF). Muchas naciones especulan, si la unificación fue forzada por Rusia, pero la verdad es que todas las naciones acordaron la unificación para enfrentar juntos la amenaza de Chimera.\n\nTambién hay rumores de que Rusia puede usar esa situación para restaurar la Unión Soviética, o se convirtió en una amenaza para Europa una vez más."
 EH_event.429.a: "Quedan demasiadas preguntas..."
 EH_event.430.t: "Los Tres Peaks Unidos"
 EH_event.430.d: "Corea del Norte, Mongolia y China se han unido oficialmente bajo una bandera: Los Tres Peaks. Aunque la unificación fue criticada por el gobierno chino, las relaciones fuertes con sus aliados y la amenaza de la Chimera los hicieron cambiar de opinión.\n\nLa nueva nación está lista para enfrentar la amenaza juntos."
 EH_event.430.a: "Me parece justo..."
 EH_event.431.t: "Se formó una coalición de la ASEAN"
 EH_event.431.d: "Otra parte de Asia se ha unido. Las unificaciones recientes de las naciones del Oriente Medio y los Tres Peaks han empujado a las naciones del sudeste asiático a seguir el mismo camino."
 EH_event.431.a: "El mundo nunca ha estado más unido"
 EH_event.432.t: "Coalición de Asia Oriental establecida"
 EH_event.432.d: "Los últimos países asiáticos se han unido. Después de semanas de negociaciones, las naciones del Asia oriental han acordado disolver sus gobiernos nacionales e integrarse en una sola entidad: la Coalición Asiática Oriental (EAC).\n\nCon la creciente influencia de China y el cercano Portal Chimera, la nueva nación se está preparando ahora no sólo para enfrentar la amenaza de Chimera, sino también la posible agresión de China misma."
 EH_event.432.a: "Mejor unido que dividido"
 EH_event.433.t: "Unión de Defensa Oceaniana Creada"
 EH_event.433.d: "Las naciones oceánicas se han reunido para formar la Unión de Defensa Oceánica (ODU). A pesar del aislamiento geográfico y las disparidades económicas, los dirigentes acordaron que sólo mediante la unidad podían esperar defender a su pueblo y territorios.\n\nLa ODU está ahora preparada para contribuir significativamente a la lucha mundial contra la amenaza de Chimera.\n\nCon Oceanía unida, el mundo está ahora completamente dividido en varios mega estados. Las Naciones Unidas siguen siendo la última organización internacional, haciendo todo lo posible por apoyar los esfuerzos mundiales de guerra."
 EH_event.433.a: "Mundo nuevo valiente"
 EH_event.434.t: "Portals Energy interrumpe las comunicaciones globales"
 EH_event.434.d: "En las semanas posteriores a la aparición de los portales de Chimera, las redes mundiales de comunicación han experimentado perturbaciones sin precedentes. Los enlaces de satélites están fallando intermitentemente, los cables submarinos muestran la pérdida errática de datos y las redes terrestres están plagadas por interferencias inexplicables.\n\nLos expertos creen que los portales emiten una forma única de radiación electromagnética que interfiere con las tecnologías convencionales de comunicación. Se están realizando esfuerzos para elaborar nuevos protocolos y equipos capaces de operar en este entorno hostil, pero por ahora la corriente de información sigue siendo gravemente comprometida."
 EH_event.434.a: "¡Arréglalo rápido!"
 EH_event.500.t: "El descubrimiento de Randallite"
 EH_event.500.d: "Desde que los primeros portales entraron en la Tierra, se han encontrado fragmentos de una sustancia metálica no identificada alrededor del mundo. La mayoría asumía que era la transformación dimensional de los metales existentes, extraño pero inerte.\n\nEso cambió hoy. Dr. Lisa Randall, física teórica y una de las mentes líderes del mundo en la física superior-dimensional, ha roto la estructura y propiedades del material, revelando que es un metal estable, ligero y altamente resistente con inmenso potencial para aplicaciones militares.\n\nAhora apodado Randallite, la sustancia es únicamente adecuada para las aleaciones avanzadas, combinando fuerza, resistencia al calor y flexibilidad. Con el refinamiento adecuado, puede servir como la base para una nueva generación de máquinas de guerra para ayudarnos a ganar."
 EH_event.500.a: "Por fin algunas buenas noticias"
 EH_event.501.t: "Frame de HACS Prototipo Desvelado"
 EH_event.501.d: "Tras meses de desarrollo acelerado, el primer prototipo del sistema de combate de alta agilidad (HACS) ha sido construido con éxito por el equipo [FROM.GetAdjective].\n\nDiseñado con un chasis bipedal reforzado por Randallite y equipado con propulsores de impulsores integrados, la plataforma HACS fue diseñada para salvar la brecha entre potencia de fuego y supervivencia. Donde los tanques son demasiado lentos y las aeronaves demasiado vulnerables a las amenazas de Chimera, HACS ofrece la movilidad necesaria sin sacrificar cargas pesadas.\n\nAunque todavía en pruebas, este avance marca un paso importante hacia las unidades de primera línea de próxima generación. Un programa de investigación dedicado ha sido verde para introducir HACS en forma de combate."
 EH_event.501.a: "Una nueva era de guerra"
 EH_event.511.t: "Operación Sledgehammer"
 EH_event.511.d: "Tras meses de amargas pérdidas en toda Europa del Este y el colapso de la red defensiva balcánica, la Federación Europea ha lanzado la Operación Sledgehammer, una ofensiva militar de alto riesgo para recuperar la Línea de Bosphorus y reabrir el corredor estratégico entre Europa y Oriente Medio. Encabezada por unidades de HACS recientemente desplegadas y apoyadas por ataques coordinados de artillería, navales y misiles, la ofensiva tiene como objetivo desalentar enjambres arraigados de Chimera desde las ruinas de Estambul y sus colinas circundantes.\n\nEl éxito de la operación marcaría un importante punto de inflexión en restaurar la movilidad continental y asegurar el flanco sur de Europa. Pero la presencia del enjambre se ha espesado, y los informes de inteligencia sugieren nuevas variantes antes invisibles en la región. La batalla por delante será costosa."
 EH_event.511.a: "Los dados son echados"
 EH_event.800.t: "Las Líneas Zenobia y Saladin están bajo construcción"
 EH_event.800.d: "En respuesta al enjambre que avanza rápidamente desde el África subsahariana, la Liga de Defensa del Oriente Medio ha ordenado la construcción inmediata de una barrera fortificada a través del sur de Egipto. Apodado la Línea Zenobia, se extiende a lo largo del Nilo y el flanco del desierto occidental, integrando búnkeres reforzados, redes de trincheras y posiciones de artillería de largo alcance para detener el impulso de Chimera.\n\nSi Zenobia cae, la Línea Saladin espera detrás de ella. Anclado a lo largo del Canal de Suez desde Port Said al Mar Rojo, se encuentra como la última redoblación, una línea irrompible destinada a proteger el corazón cultural y espiritual de la región de la aniquilación."
 EH_event.800.a: "La línea está dibujada"
 EH_event.801.t: "Colapso de las Líneas Zenobia y Saladin"
 EH_event.801.d: "Los informes están llegando a través de que el enjambre Chimera ha incumplido tanto la Línea Zenobia en el sur de Egipto y la Línea Saladin a lo largo del Canal de Suez. A pesar de los brutales esfuerzos defensivos y el apoyo a la artillería pesada, el enemigo resultó demasiado numeroso e implacable.\n\nLos sectores defensivos enteros estaban sobrecorridos, se perdieron fortificaciones, se consumieron líneas de trincheras y muchas unidades lucharon hasta el final amargo. Suez HQ ha caído en silencio desde entonces. La Liga de Defensa del Medio Oriente ha ordenado un retiro completo hacia el Levante.\n\nLa ruptura de la última línea de defensa abre la puerta al frente norte. No queda buffer."
 EH_event.801.a: "Tuvieron el tiempo que pudieron."
 EH_event.802.t: "Zenobia y Líneas de Saladín Golpean desde atrás!"
 EH_event.802.d: "Debido al colapso de las líneas de defensa del Medio Oriente, las fuerzas de Chimera han violado ahora las líneas Zenobian y Saladin desde su único lado vulnerable, la espalda. El enjambre atravesó la brecha en números abrumadores, rápidamente abrumando a los defensores restantes y asegurando una posición en el corazón del continente.\n\nCon las líneas comprometidas, el Chimera tiene rienda suelta para avanzar hacia el norte, amenazando ciudades clave e infraestructura en toda Europa. La situación es grave, y la Unión Europea debe prepararse ahora para una lucha prolongada y brutal en el primer frente de sus fronteras."
 EH_event.802.a: "El frente oriental era demasiado débil."
 EH_event.803.t: "Europa fortificante: La línea de bisforo"
 EH_event.803.d: "La Coalición Occidental ha autorizado la creación de una nueva redobla continental: la Línea Bosphorus.\n\nAtravesando los estrechos de Estambul, esta línea defensiva integra campos minados, bloqueos navales, posiciones preparadas y batallas reforzadas para evitar una brecha en Europa. Estacionado en su corazón es Task Force Hellespont, una unidad multinacional lista para combatirlo hasta el final.\n\nLa orden es clara: mantenga la línea, no importa el costo."
 EH_event.803.a: "No cruzarán sin pelear."
 EH_event.804.t: "La caída de la línea del Bosphorus"
 EH_event.804.d: "Después de un asedio brutal y prolongado, la Línea Bosphorus ha sido violada. Los Chimeras derramaron a través de Estambul en una marea de fuego y carne, defensas abrumadoras a pesar de la desesperada contraofensiva.\n\nTask Force Hellespont luchó hasta el último y están siendo llorados como héroes de Europa.\n\nCon Europa ahora directamente expuesta. El mundo occidental ha perdido su primer escudo."
 EH_event.804.a: "Los porteros de Europa se lamentarán"
 EH_event.805.t: "¡Línea del Bósforo atacada por la retaguardia!"
 EH_event.805.d: "Las fuerzas de Chimera lograron rodear el Mar Negro desde el norte y golpear la Línea Bosphorus desde atrás, superando completamente las fortificaciones y abrumando a los defensores restantes. El enjambre ya está dominando los Balcanes y Europa Occidental."
 EH_event.805.a: "La Europa ya ha caído"
 EH_event.806.t: "Línea de Defensa del Cáucaso en Construcción"
 EH_event.806.d: "Se está construyendo la Línea de Defensa del Cáucaso para proteger la conexión entre el Oriente Medio y el territorio de la Federación Eurasia meridional. La línea se extenderá por las montañas del Cáucaso, integrando las ventajas del terreno natural con posiciones fortificadas, emplazamientos de artillería y unidades de respuesta rápida para crear una barrera formidable contra las fuerzas de Chimera que avanzan.\n\nAunque tal vez no sea suficiente para detener el enjambre por completo, servirá como un búfer crítico para comprar tiempo para la evacuación y reagrupación de esfuerzos en Europa y ex Rusia."
 EH_event.806.a: "Espero que lo tengan a tiempo."
 EH_event.807.t: "Primera línea de la Defensa del Cáucaso"
 EH_event.807.d: "Las fuerzas de Chimera han incumplido la primera línea de la Defensa del Cáucaso, abrumando las fortificaciones iniciales y empujando hacia la región montañosa. A pesar de la feroz resistencia de los defensores, el ataque implacable del enjambre ha creado una posición en la zona, amenazando con derramarse sobre las tierras profundas de la Federación Eurasia.\n\nLa situación es crítica, pero todavía hay esperanza de que la segunda línea de defensa pueda mantener e impedir nuevas incursiones."
 EH_event.807.a: "Todavía hay esperanza para la segunda línea"
 EH_event.808.t: "La Defensa del Cáucaso ha caído"
 EH_event.808.d: "A pesar de los esfuerzos valientes, la Línea de Defensa del Cáucaso ha caído. Las fuerzas de Chimera han abrumado a los defensores restantes y han asegurado una posición en la región, abriendo un nuevo frente para la Federación Eurasia.\n\nCon la pérdida de este búfer crítico, el enjambre ahora tiene un camino directo hacia ciudades clave e infraestructura a través de Rusia y Europa Occidental. La situación es grave, y la Federación Eurasia debe prepararse ahora para una lucha prolongada y brutal en su propio suelo."
 EH_event.808.a: "No pueden detenerse..."
 EH_event.809.t: "¡La Línea de Defensa del Cáucaso golpeó desde atrás!"
 EH_event.809.d: "Las fuerzas de Chimera lograron rodear las montañas del Cáucaso desde el norte y golpear la línea de defensa desde atrás, superando completamente las fortificaciones y abrumando a los defensores restantes. El enjambre ya está dominando las regiones circundantes."
 EH_event.809.a: "Es necesario correr el riesgo"
 EH_event.900.t: "Caída de Washington D.C."
 EH_event.900.d: "La capital de los antiguos Estados Unidos de América ha caído.\n\nLas fuerzas chimeras lanzaron un ataque devastador, violando las defensas de la ciudad y abrumadoras unidades militares. Los hitos icónicos ahora se encuentran en ruinas, y las calles una vez abusadas son silenciosas.\n\nLos sobrevivientes reportan historias de caos y destrucción cuando la ciudad cayó en manos del enjambre."
 EH_event.900.a: "El corazón de una nación está perdido..."
 EH_event.901.t: "La caída de Nueva York"
 EH_event.901.d: "La ciudad de Nueva York se ha perdido al enjambre de Chimera.\n\nLas criaturas explotaron túneles subterráneos y sistemas de metro para evitar las defensas superficiales, capturando unidades militares fuera de guardia. El trazado icónico es ahora una silueta de destrucción, con incendios en rabia y edificios colapsando.\n\nLa isla Staten fue la primera en caer, y ahora toda la ciudad está bajo control de Chimera."
 EH_event.901.a: "La Estatua de la Libertad se ha ido..."
 EH_event.902.t: "La caída de Los Angeles"
 EH_event.902.d: "Los Ángeles ha caído.\n\nUna vez una hermosa ciudad, ahora sólo un recuerdo a innumerables refugiados que huyen del implacable avance de la Chimera. El emblemático letrero de Hollywood ahora es un recordatorio sombrío de lo que se perdió."
 EH_event.902.a: "Qué pérdida..."
 EH_event.903.t: "Caída de San Francisco"
 EH_event.903.d: "San Francisco se ha ido\n\nLos Chimeras surgieron a través de fisuras subterráneas y brechas costeras, pasando por líneas defensivas con velocidad aterradora. El Comando del Pacífico informa que todas las fuerzas restantes han sido aniquiladas o cortadas. Las pérdidas civiles son catastróficas.\n\nOtra gran ciudad perdida al enjambre."
 EH_event.903.a: "La Puerta de Oro está perdida..."
 EH_event.904.t: "Caída de Moscú"
 EH_event.904.d: "Moscú ha caído.\n\nEl enjambre de Chimera lanzó un asalto coordinado, abrumando las defensas de la ciudad con números y ferocidad. El Kremlin, una vez símbolo de la resiliencia rusa, ahora se encuentra en ruinas.\n\nLos sobrevivientes hablan del caos y la desesperación mientras la ciudad sucumbe al implacable avance de las criaturas."
 EH_event.904.a: "El corazón de Rusia está perdido..."
 EH_event.905.t: "Caída de Shanghai"
 EH_event.905.d: "Shanghai ha caído.\n\nEl enjambre golpeó con fuerza abrumadora, primero a través de los suburbios del sur, luego a través del río Huangpu, capturando a los defensores durante el retiro medio. El Bund se convirtió en un cementerio de acero acolchado y hormigón roto. Los alimentos por satélite no muestran nada más que silencio ahora, una cáscara vacía de una ciudad."
 EH_event.905.a: "¿Cuándo los detendremos?"
 EH_event.1000.t: "Chimera Portal Cerrado!"
 EH_event.1000.d: "El proyecto T.E.S.L.A. resultó ser un éxito enorme. [FROM.GetName] realizó una exitosa redada para cerrar uno de los Portales Chimera, causando que todas las fuerzas de Chimera en el enorme perímetro pierdan instantáneamente la conciencia. Las criaturas siguen vivas, por lo que se aconseja a la población local que no entre en contacto con los cuerpos. El ejército nacional está en camino a matar unidades de Chimera mientras duermen."
 EH_event.1000.a: "Ese hijo de puta lo hizo."
 EH_focus_event.1.t: "Gran Plan de Movilización"
 EH_focus_event.1.d: "Aparecieron repentinamente. Están atacando todo lo que se mueve, y no paran hasta que todo está muerto. Nuestros científicos están tratando de averiguar qué son esas criaturas, de dónde vienen y cómo detenerlas. Mientras tanto, nuestro ejército está tratando de mantener la línea delantera y proteger a nuestros ciudadanos. Tenemos que actuar rápido antes de que lleguen a nuestras fronteras. Podemos confiar en nuestro ejército profesional, o podemos pedir una movilización masiva."
 EH_focus_event.1.a: "¡Tírales todo lo que tenemos!"
 EH_focus_event.1.b: "Confiaremos en el ejército profesional."
 EH_focus_event.2.t: "Primera generación de soldados chinos"
 EH_focus_event.2.d: "Investigaciones recientes sobre las tropas de Chimera permitieron crear una nueva raza de soldados - los soldados de Chitin. Nueva armadura hará que nuestro pueblo sea más resistente a los ataques físicos de los alienígenas, y su diseño futurista trae esperanza y emoción entre la población."
 EH_focus_event.2.a: "Cuando una ficción conoce la realidad."
 EH_focus_event.3.t: "Los Drones alcanzaron su objetivo"
 EH_focus_event.3.d: "Los drones han tomado fotos detalladas de la estructura alrededor del Portal. Para comprender aún más su propósito y funcionalidad, excepto para los fines de defensa, los científicos tendrán que analizar los datos reunidos. Por suerte, hay un profesor de biología que querrá echar un vistazo más de cerca a las fotos."
 EH_focus_event.3.a: "Esperemos que valga la pena."
 EH_focus_event.4.t: "Chimera Destruida El Escuadrón Drone"
 EH_focus_event.4.d: "Las fuerzas de Chimera han interceptado y destruido exitosamente el escuadrón de drones antes de que pudiera completar su misión. Ninguna máquina se las arregló para tomar cualquier foto y enviarla antes de ser derribado."
 EH_focus_event.4.a: "Otro fracaso..."
 EH_focus_event.5.t: "Fuerzas de Chimera destruyeron el sitio de investigación"
 EH_focus_event.5.d: "Las fuerzas de Chimera han descubierto y destruido uno de nuestros sitios de investigación. Algunos de los datos de investigación se perdieron, pero al menos la Chimera no dejó sin bajas."
 EH_focus_event.5.a: "¡Busca a los sobrevivientes!"
 EH_focus_event.6.t: "Fuerzas de Chimera repelieron desde el sitio de investigación"
 EH_focus_event.6.d: "El Chimera no logró destruir nuestro sitio de investigación. No se perdieron datos de investigación, y los científicos están seguros."
 EH_focus_event.6.a: "¡Gran victoria!"
 EH_focus_event.7.t: "Científico desaparecido"
 EH_focus_event.7.d: "Uno de los científicos no logró escapar del sitio de investigación antes de que las fuerzas de Chimera lo atacaran. No sabemos si el científico está muerto o vivo, pero tenemos que asumir lo peor, actualmente no hay manera de lanzar una misión de rescate."
 EH_focus_event.7.a: "Damn it!"
 EH_focus_event.8.t: "Las emisiones de energía del portal debilitan las fuerzas de Chimera"
 EH_focus_event.8.d: "Gracias a pasar más tiempo en la vigilancia de las emisiones de energía inusual del Portal que ha estado interrumpiendo nuestra red satelital, nuestros científicos han descubierto que esas emisiones siguen patrones muy específicos. Se han equipado nuevos satélites con sensores especiales que pueden detectar estas emisiones y utilizarlas para interferir en los sistemas de comunicación Chimera. Este avance puede debilitar significativamente las fuerzas de Chimera."
 EH_focus_event.8.a: "¡Esto es un gran avance!"
 EH_focus_event.9.t: "Propiedad privada envía trabajadores para ayudar a los sitios de investigación"
 EH_focus_event.9.d: "Grandes corporaciones privadas se han reunido para ayudar a nuestros científicos en su investigación contra la Chimera. Están enviando a sus mejores trabajadores para ayudar a construir nuevos sitios de investigación, acelerar todo el proceso significativamente."
 EH_focus_event.9.a: "¡Grandes noticias!"
 EH_focus_event.10.t: "Generales Militares ofrece seguridad adicional para los sitios de investigación"
 EH_focus_event.10.d: "Nuestros generales militares se han ofrecido a enviar tropas adicionales para proteger nuestros sitios de investigación contra los ataques de Chimera. Su experiencia en combate y conocimiento de las tácticas de Chimera será inestimable para garantizar la seguridad de nuestros científicos y el éxito de nuestros proyectos."
 EH_focus_event.10.a: "¡Apreciamos su apoyo!"
 EH_focus_event.11.t: "Un billonario comparte su dinero para financiar los activos"
 EH_focus_event.11.d: "Un millonario rico ha decidido donar una parte significativa de su fortuna para financiar nuestros sitios de investigación. Este enorme activo cubrirá los costos de construir nuevas instalaciones y aumentará considerablemente la velocidad de investigación."
 EH_focus_event.11.a: "¡Corten sus impuestos!"
 EH_focus_event.12.t: "Randallite Vein Discovered"
 EH_focus_event.12.d: "El equipo de búsqueda ha descubierto una nueva vena de Randallite. Ahora es nuestra decisión establecer operaciones mineras y extraer este valioso recurso."
 EH_focus_event.12.a: "¡Empiecen las operaciones mineras!"
 EH_focus_event.12.b: "No podemos pagarlo."
 EH_focus_event.13.t: "Veinte de hierro descubierto"
 EH_focus_event.13.d: "El equipo de búsqueda ha descubierto una nueva vena de Iron. Es ahora nuestra decisión de establecer operaciones mineras y extraerla e incrementar nuestra producción de acero."
 EH_focus_event.13.a: "He estado esperando más, pero todavía lo necesitamos."
 EH_focus_event.13.b: "No podemos pagarlo."
 EH_focus_event.14.t: "Aluminium Vein Discovered"
 EH_focus_event.14.d: "El equipo de búsqueda ha descubierto una nueva vena de aluminio. Ahora es nuestra decisión establecer operaciones mineras y extraer este recurso."
 EH_focus_event.14.a: "¿No Randallite? Sigue siendo un buen trato."
 EH_focus_event.14.b: "No podemos pagarlo."
 EH_focus_event.15.t: "Empresa no estatal descubre Randallite Vein"
 EH_focus_event.15.d: "Una de las grandes corporaciones privadas ha descubierto una nueva vena de Randallite. Están dispuestos a empezar las operaciones mineras por su cuenta, sin ninguna ayuda del gobierno."
 EH_focus_event.15.a: "Deja que lo hagan."
 EH_focus_event.16.t: "[FROM.GetName] Comienza el ofensivo final"
 EH_focus_event.16.d: "Después de la exitosa detonación de armas T.E.S.L.A. en el Portal Chimera, los militares [FROM.GetName] lanzaron una ofensiva a gran escala para eliminar todas las fuerzas chimeras de la zona. Con el Portal cerrado y el enemigo desorientado, esta es nuestra oportunidad de golpear un golpe decisivo y recuperar territorio perdido."
 EH_focus_event.16.a: "Prevaleceremos."
 EH_protect_the_homeland: "¡Protege la Patria!"
 EH_protect_the_homeland_desc: "Hemos sido invadidos por unas fuerzas desconocidas del diablo mismo. ¡Tenemos que defendernos con todo lo que tenemos para repeler la amenaza y sobrevivir para ver otro día!"
 EH_territorial_advantages: "Ventajas territoriales"
 EH_territorial_advantages_desc: "Los invasores son más fuertes en combates estrechos... o combates globales. Así que, si no podemos vencerlos con fuerza, tenemos que ser más listos. Nuevo programa de defensa nos ayudará a usar el paisaje para nuestra ventaja y tal vez sea suficiente para ganar algunas batallas."
 EH_cold_acclimatization: "Frío Acclimatización"
 EH_cold_acclimatization_desc: "Los invasores son extremadamente resistentes a las temperaturas frías. Un problema adicional es que dos portales se encuentran en Alaska y el Tíbet. Si queremos tener la oportunidad de acercarnos a ellos, necesitamos fortalecernos o desarrollar nuevas formas de luchar con el frío."
 EH_300: "300"
 EH_300_desc: "Los pases estrechos de montaña son un terreno increíblemente difícil para atravesar. Un lugar perfecto para una emboscada si me preguntas. Mientras podamos lidiar con su apoyo aéreo, podemos usar esos pases para ganar una ventaja increíble en las batallas."
 EH_heat_acclimatization: "Aclimatización de calor"
 EH_heat_acclimatization_desc: "Los monstruos son muy resistentes a las fuerzas de la naturaleza. También tenemos que ser más fuertes. Hemos luchado en este planeta más tiempo que estas cosas y esa experiencia debe ser usada ahora para nuestra ventaja."
 EH_sandstorms_are_our_allies: "Las tormentas de arena son nuestros aliados"
 EH_sandstorms_are_our_allies_desc: "Lo sabemos, cuando vienen las tormentas de arena. Con tal conocimiento podríamos preparar nuestra defensa y utilizar la arena a nuestra ventaja. Esperemos que los monstruos no tengan ningún « radar biológico»."
 EH_observe_local_fauna: "Observar la Fauna Local"
 EH_observe_local_fauna_desc: "Los animales proporcionan un sistema de detección precoz perfecto. Esos monstruos son una amenaza para todas las especies, y nuestros animales parecen ya reconocidos de su presencia. Un gran grupo de huyendo en animales de pánico puede ser una información importante, cuando nuestros radares se callan."
 EH_our_weakness_to_their_disadvantage: "Nuestra Debilidad a su Desventaja"
 EH_our_weakness_to_their_disadvantage_desc: "Las plagas son extremadamente útiles para nuestros vehículos, pero los tanques y el IFV no son suficientes para detener a esos monstruos. Pero gracias al terreno plano, podremos preparar algo especial, que con suerte nos dará una ventaja temporal en el campo de batalla."
 EH_electric_traps: "Trampas eléctricas"
 EH_electric_traps_desc: "Con potentes descargas eléctricas controladas deberíamos poder dar a nuestras unidades unos minutos de tiempo libre para atacar tropas enemigas. El drenaje energético será enorme, por lo que tendremos que encontrar una manera de reducir el uso de energía en el país, o preparar nuevos sitios de construcción."
 EH_transfer_energy_from_civilian_sector: "Transferencia de energía del sector civil"
 EH_transfer_energy_from_civilian_sector_desc: "Estamos drenando demasiado poder cuando las trampas están activas. Cargarlos lleva mucho tiempo y no podemos esperar toda la semana para usarlos de nuevo. Vamos a transferir algo de energía del sector público a nuestros bancos energéticos."
 EH_invest_in_additional_power_sources: "Invertir en fuentes de energía adicionales"
 EH_invest_in_additional_power_sources_desc: "La guerra no puede afectar a los civiles aún más de lo que ya hace. Crearemos un nuevo proyecto de reactor para establecer seguridad energética para hoy y cualquier otro día."
 EH_reduce_energy_loss: "Reducir la pérdida de energía"
 EH_reduce_energy_loss_desc: "Esas trampas están drenando demasiada energía. Son eficaces, pero costosos para nuestra infraestructura. No podemos disminuir su poder, pero podemos encontrar maneras de limitar el uso de energía de otras fuentes."
 EH_nation_remains_untouched: "La nación sigue sin tocar"
 EH_nation_remains_untouched_desc: "Sea lo que sean esas criaturas, no podemos dejar todo para fortalecer a los militares. La gente continuará sus vidas normales como si nada malo estuviera sucediendo..."
 EH_put_away_internal_problems: "Poner lejos los problemas internos"
 EH_put_away_internal_problems_desc: "El proteccionismo nacional es actualmente el objetivo más importante. Sin el ejército, no habrá nación que proteger. La gente tendrá que lidiar con sus problemas por sí misma mientras estamos fortaleciendo a los militares. Si el ejército fallará, así que la sociedad."
 EH_minimal_military_focus: "Militares mínimos Enfoque"
 EH_minimal_military_focus_desc: "Actualmente, la industria civil es más importante que la producción de nuevas armas. Si la guerra está lejos de nosotros, no hay razón para gastar demasiado dinero en defensa."
 EH_high_military_focus: "Alta militar Enfoque"
 EH_high_military_focus_desc: "Enemigo se está acercando cada día a nuestra capital. No podemos dejar a nuestros guardias abajo y tenemos que acelerar la producción."
 EH_lower_conscription: "Conscripción inferior"
 EH_lower_conscription_desc: "Otras naciones están perdiendo mucha mano de obra, pero nuestros soldados principalmente patrullan nuestras fronteras. No necesitamos reclutar más de ellos sólo para gastar más dinero en los militares."
 EH_extended_conscription: "Conscripción ampliada"
 EH_extended_conscription_desc: "Mantener al enemigo fuera de nuestras fronteras es la tarea más importante, no podemos perder más tierra!"
 EH_prioritize_corporations: "Prioridades de las empresas"
 EH_prioritize_corporations_desc: "La guerra arruinará nuestra economía. Tenemos que mantener nuestras corporaciones leales al estado para no meternos en serios problemas."
 EH_prioritize_military_companies: "Prioridad de las empresas militares"
 EH_prioritize_military_companies_desc: "La investigación y el aumento de la producción de armas deben ser nuestra máxima prioridad. Sin armas, nuestros hombres no podrán luchar con esas criaturas impíos."
 EH_a_new_resource: "A Nuevo(?) Recursos"
 EH_a_new_resource_desc: "Dr. Lisa Randall ha estado estudiando un nuevo recurso, Randallite, por bastante tiempo ya. Con su equipo científico, Dr. Randall descubrió que es una resistencia infrecuente al ser increíblemente ligero. Después del descubrimiento del Randallite, otras naciones notaron una disminución de la cantidad de [RESOURCE HERE]. Es posible que los Portales lo transmuten en Randallite. ¿Tal vez ese es el recurso común al otro lado del Portal? Necesitamos más investigación sobre eso."
 EH_a_fine_addition_to_my_collection: "Una adición fina a mi colección"
 EH_a_fine_addition_to_my_collection_desc: "Randallite será un gran componente para armas y armaduras. Una vez que nos equiparemos con Randallite, podemos repeler no sólo criaturas alienígenas sino también otras naciones."
 EH_first_hacs_prototype: "Primer Prototipo de HACS"
 EH_first_hacs_prototype_desc: "Jaegers, Atlas, Evangelion y así sucesivamente. Los mechs de combate avanzados siguieron siendo sólo una ficción hasta que los acontecimientos recientes cambiaron todo. El sistema de combate de alta agilidad (HACS) es un mech de combate operativo real, construido sólo debido a las propiedades de Randallite. El peso ya no es un gran problema después de empezar a usar una aleación mucho más fuerte que el acero y más ligero que el magnesio. Con esta tecnología podemos finalmente ser capaces de hacer daño significativo a las fuerzas enemigas."
 EH_new_enemy_new_strategy: "Nuevo enemigo, nueva estrategia"
 EH_new_enemy_new_strategy_desc: "Problemas estúpidos reqiore Stupid Solutions, y este es el problema más estúpido que hemos encontrado. Los alienígenas luchan como alguien sin miedo de daño, y esto es lo que vamos a aprovechar. La armadura de unidades pesadas es muy protectora, pero no impenetrable. Tenemos que ganar esta lucha por ser más rápidos que unidades de tanque, y más fuertes que criaturas voladoras. Eso dijo, necesitamos más Randallite, y balas, duh."
 EH_more_mechs_less_weapons: "Más mechs, menos armas"
 EH_more_mechs_less_weapons_desc: "Los mechs son nuestras únicas armas eficientes contra esas criaturas. Su producción lleva mucho tiempo, y el arsenal Randallite es limitado. Será mejor opción convertir algunas fábricas para ayudar a construir partes para los Mechs, en lugar de las armas OG."
 EH_more_weapons_less_mechs: "Más armas, menos mechs"
 EH_more_weapons_less_mechs_desc: "La producción de mech toma la mayor parte de nuestros recursos. Si continuamos con esta producción a gran escala, nuestra economía podría caer en depresión y nunca nos recuperaremos de la deuda. Es tiempo de guerra, pero no podemos destruir nuestra economía para estas nuevas máquinas."
 EH_iron_man: "¿Hombre de hierro?"
 EH_iron_man_desc: "Los primeros nuevos mechs ya están luchando en el campo de batalla. Ahora la verdadera lucha ha comenzado, donde finalmente podemos tener una oportunidad contra los Invasores. Algunas personas comenzaron a especular, hasta dónde podemos ir con esta tecnología. Por supuesto, la base de fans de Marvel empezó a enviarnos sus planos de armadura Iron Man... en realidad, ¿por qué no?"
 EH_second_generation_hacs: "Segunda generación HACS"
 EH_second_generation_hacs_desc: "Gracias a los planos de nerds e ingenieros profesionales, estamos listos para empezar a planear nuevos mechs un poco antes. ¡Vamos a alcanzar otro gran hito!"
 EH_highly_purified_randallite: "Randallite altamente purificado"
 EH_highly_purified_randallite_desc: "Nunca hemos tomado suficiente tiempo para limpiar el crudo Randallite, la producción era nuestra prioridad. Pero ya que sabemos más sobre este recurso y no tenemos tanta prisa por descubrir que son nuevas propiedades, podemos tomar un tiempo para maximizar su eficiencia."
 EH_increase_research_budget: "Aumento del presupuesto de investigación"
 EH_increase_research_budget_desc: "La segunda generación HACS ha sido un gran éxito, pero no podemos descansar en nuestros laureles. La humanidad siempre pedirá algo mejor, y ese es el momento en que empezamos a prepararnos para la tercera generación."
 EH_third_generation_hacs: "Tercera generación HACS"
 EH_third_generation_hacs_desc: "Todo nuestro trabajo duro ha llevado a este momento. Meses de investigación, pruebas y miles de millones de nuestro presupuesto, estamos listos para liberar el mayor mech de combate jamás visto en la historia de los mechs de combate!"
 EH_military_advantages: "Ventajas militares"
 EH_military_advantages_desc: "Necesitamos saber cómo Randallite será capaz de ayudar a nuestras tropas. Mientras los mechs están siendo construidos, tenemos más de este mineral de lo que podemos gastar en las nuevas máquinas. Tenemos que encontrar más maneras de utilizarlo."
 EH_ranjets: "Ranjets"
 EH_ranjets_desc: "Randallite nos ha permitido construir los primeros mechs de combate. Es tan ligero que no tenemos que limitarnos a esta nueva tecnología. Esto resolverá muchos problemas relacionados con el empuje y el peso de los aviones. Los aviones con cascos más ligeros podrán transportar más carga y armas, y nuestros jets serán aún más maniobrables que nunca."
 EH_not_so_heavy_weapons: "No tan armas pesadas"
 EH_not_so_heavy_weapons_desc: "Podemos utilizar Randallite en la producción de armas pesadas en lugar de acero, titanio y otros materiales. Las armas serán más ligeras, y será más fácil para los soldados llevarlas y utilizarlas. Los camiones utilizarán menos combustible para el transporte, por lo que todo se beneficia de este cambio."
 EH_find_new_veins: "Encontrar nuevos venas"
 EH_find_new_veins_desc: "Muchos sitios de recursos han sido reemplazados por Randallite. No sabemos cómo está progresando este proceso, pero puede ser un buen momento para empezar a buscar más recursos. Tal vez podamos encontrar más Randallite bajo tierra."
 EH_more_precious_than_gold: "Más precioso que el oro"
 EH_more_precious_than_gold_desc: "Randallite ya está en todas partes. Grandes compañías están gastando miles de millones de dólares para conseguir sus manos en este recurso. Es como una buena vieja prisa de oro, pero Randallite es mucho más útil que este recurso. Podemos hacer herramientas, máquinas y armas comunes y eso es sólo una lista muy cortada. Nosotros, el estado, tenemos que encontrar tanto Randallite como sea posible antes de que los negocios codiciosos pongan un monopolio sobre su excavación, investigación y exportación. Es difícil de creer que realmente tenemos que luchar con nuestra propia nación, pero poner restricciones puede ser la consecuencia final si la situación se sale de la mano."
 EH_civilian_benefits: "Prestaciones civiles"
 EH_civilian_benefits_desc: "Nuestra situación de guerra es estable, por lo que podemos centrarnos en utilizar Randallite en espacios públicos. Si la situación con los invasores empeora, siempre podemos cambiar a la producción militar sin muchos problemas."
 EH_a_wonderful_prosthesis: "A Wonderful Prosthesis"
 EH_a_wonderful_prosthesis_desc: "La increíble resistencia y naturaleza ligera de la Randallite nos permitió construir un nuevo modelo de prótesis de las piernas, haciendo que sus usuarios fueran aún más «salubres» de lo que serían con su vieja pierna. ¡Es hora de tomar extensiones sintéticas del cuerpo humano a un nivel similar al Cyberpunk!"
 EH_market_potential: "Mercado Potencial"
 EH_market_potential_desc: "Hay mucha gente que quiere poner sus manos en Randallite. Ya que ya no estamos en una prisa con los proyectos militares, podemos empezar a vender Randallite a inversores y para uso comercial. Las grandes empresas empezarán a sustituir sus máquinas por las hechas de Randallite, reduciendo la cantidad de combustible utilizado en todo el mundo para alimentar maquinaria pesada y vehículos."
 EH_study_new_enemy: "Estudio New Enemy"
 EH_study_new_enemy_desc: "Después de la huelga nuclear en el misterioso Portal, una especie de criaturas nuevas comenzó a extenderse en un círculo alrededor. Son muy agresivos y atacan todo lo que se mueve. No sabemos si podemos detenerlos pero si hay una manera de defendernos contra ellos, tenemos que averiguar qué tan rápido."
 EH_launch_orbital_scans: "Lanzamiento de escáneres orbitales"
 EH_launch_orbital_scans_desc: "Podemos utilizar nuestros satélites para estudiar maniobras enemigas y aprender que mueven patrones, si tienen alguno. Esto debe ayudar a nuestros estrategas a preparar trampas y contratácticos más eficaces."
 EH_find_the_weak_spots: "Encontrar los puntos débiles"
 EH_find_the_weak_spots_desc: "Esas criaturas pueden matarse. Después de todo están hechos de sangre y materia orgánica. Si logramos llevar uno de ellos a nuestro laboratorio, podríamos encontrar sus órganos más cruciales para estudiarlos por nuestra ventaja. Tan pronto como descubramos los órganos críticos, entrenaremos a nuestros soldados y sistemas de combate para atacarlos si es posible."
 EH_disassemble_invader_armor: "Desarmar Invader Blindaje"
 EH_disassemble_invader_armor_desc: "La mayoría de los Invasores son resistentes a nuestras armas gracias a su dura armadura tipo chitín. Podemos comenzar la investigación para aprender su estructura y adaptarla a la armadura del cuerpo humano. Tal vez esto hará que nuestras tropas sean un poco más resistentes a los ataques enemigos."
 EH_portals_must_be_the_key: "Los Portales deben ser la clave"
 EH_portals_must_be_the_key_desc: "Tenemos que reunir más información sobre el Portal más cercano, cualquier cosa que pueda ser útil para nosotros. Son resistentes a la huelga nuclear pero nada es indestructible. Encontraremos una manera de cerrarlos incluso si significa que tenemos que enviar nuestros drones y aviones en misiones suicidas."
 EH_investigate_strange_structure: "Investigar la estructura extraña"
 EH_investigate_strange_structure_desc: "Hemos notado un comportamiento extraño de nuestros enemigos. Parecen construir algo alrededor de los Portals, probablemente para asegurarlo. Si están construyendo algún tipo de fortaleza, tenemos que actuar rápido antes de separarlos completamente. Nuestro próximo paso es preparar una misión de reconocimiento detallada usando nuestros drones de combate. El enemigo está dominando la zona aérea por lo que es una misión suicida, pero tenemos que esperar al menos una máquina se las arreglará para tomar cualquier foto de esta estructura y enviarla a nuestro comando."
 EH_finding_their_vulnerability: "Encontrar su vulnerabilidad"
 EH_finding_their_vulnerability_desc: "Con suficientes bombardeos podemos encontrar la debilidad de los componentes que esta estructura se construye. Las cosas más cruciales para comprobar son la resistencia al calor y a la explosión, y la corrosión tóxica. No hay manera de que podamos comprobar su densidad de congelación, pero podemos comprobar el comportamiento de otros materiales de esos monstruos para ver cómo reaccionarán a temperaturas inferiores."
 EH_but_how_does_this_key_work: "¿Pero cómo funciona esta llave?"
 EH_but_how_does_this_key_work_desc: "Esos Portals conducen a otra dimensión, eso es seguro. Ya sea el Upside Down, Anti-Earth o lo que sea, debe tener cualquier cosa que le permita abrir y mantener la conexión. Averiguar cómo están haciendo esto puede ser importante para entender su naturaleza, funcionalidad y tal vez, con un poco de suerte encontraremos una manera de interrumpir su trabajo y terminar esa conexión."
 EH_project_tesla: "Proyecto T.E.S.L.A."
 EH_project_tesla_desc: "Sistema electromagnético de la aniquilación lineal será nuestra mayor oportunidad para mostrar a los monstruos que realmente están a cargo aquí. Una vez que el arma esté lista, lo dispararemos en el Portal más cercano. Si nuestra teoría es correcta, el pulso electromagnético debe ser lo suficientemente fuerte para interrumpir las conexiones y, tal vez, cerrarlo, temporal o permanentemente."
 EH_whole_new_dawn: "Todo New Dawn"
 EH_whole_new_dawn_desc: "Sabemos todo lo que debemos saber para cerrar los Portals. Mientras sigamos el plan, deberíamos ser lo suficientemente fuertes para terminar esta guerra."
