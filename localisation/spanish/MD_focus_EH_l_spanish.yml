 EH_electric_trap_remove_country_resource_cost_tungsten_TT: "§YRemoviendo esta trampa se devolverá §G1 Metal Tecnológico§!.§!"
 EH_battlefield_adaptation_idea_TT: "§YAgregar modificador de adaptación a Battlefield§!\n§Y Los cónyuges aumentan en §G+2%§! cada mes, hasta que se alcance §G+12%§! de bonificación.§!\n§YÚltimas hasta que se cumplan los desencadenantes de enfoque.§!"
