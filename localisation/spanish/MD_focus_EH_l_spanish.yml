 EH_event.311.t: "El Portal Fully Stabiliza"
 EH_event.311.d: "La imagen térmica por satélite confirma lo que temían los analistas: el portal sobre el Cuerno de África ha dejado de fluctuar y encerrarse en un estado estable y permanente. Los drones de reconocimiento reportan el enjambre masateo al otro lado en números demasiado grandes para contar."
 EH_event.311.a: "La invasión ha comenzado en serio"
 EH_research_sites_enabled: "Sitios de investigación habilitados"
 EH_europe_defense_line_category: "Europeann Defense Line"
 EH_europe_defense_line_category_desc: "Las Líneas Europeas de Defensa son nuestra mejor oportunidad para mantener la línea contra las fuerzas de Chimera en Europa. Las líneas serán fortificadas con artillería pesada y defensas antiaéreas, así como una red de trincheras y búnkeres. Los ejércitos de la mayoría de las naciones europeas estarán estacionados allí. Tenemos que asegurarnos de que las líneas se mantengan cuando Rusia caerá."
 EH_construct_europe_defense_line: "Construir la línea de defensa §Geuropea§!"
 EH_europe_defense_line_destruction: "La línea de defensa europea se derrumba"
 EH_event.810.t: "La línea europea de defensa en construcción"
 EH_event.810.d: "Debido a la importancia de la frontera oriental de Europa, se está construyendo una nueva línea para separar el continente de Asia. Esta es la inversión más grande para proteger a la región crítica de la invasión de Chimera. Algunas personas lo llaman «la primera y última defensa de Europa»."
 EH_event.810.a: "Interesting"
 EH_event.811.t: "La Línea Europea Breached"
 EH_event.811.d: "Las fuerzas de Chimera han violado el enorme Muro Europeo de Defensa esta mañana. Con un poder abrumador Chimera logró violar las fortificaciones y ahora está marchando hacia naciones europeas. Si la Federación Europea no preparará un plan eficaz para detenerlos, se perderá Europa."
 EH_event.811.a: "¿Y ahora qué?"
 EH_europe_line_wall_modifier: "Línea de Europa Wall"