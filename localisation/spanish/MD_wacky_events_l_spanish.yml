l_spanish:
 MD_wacky.1.t: "Un contacto no registrado en víspera de Navidad"
 MD_wacky.1.d: "La defensa antiaérea rastreó un contacto lento y bajo que cruzaba la frontera poco después de medianoche y lo contrató sin previo aviso. El equipo de recuperación reporta un trineo, nueve renos y un saco muy grande de paquetes envueltos."
 MD_wacky.1.a: "Clasifiquen los restos."
 MD_wacky.1.b: "Discúlpese con los niños."
 MD_wacky.2.t: "Objeto no identificado sobre la capital"
 MD_wacky.2.d: "Miles de personas fotografiaron un silencioso puesto de luz triangular sobre el distrito gubernamental durante once minutos. La fuerza aérea insiste en que sus radares no rastrearon nada."
 MD_wacky.2.a: "Arrastre a los interceptores."
 MD_wacky.2.b: "Anunciar que era un globo meteorológico."
 MD_wacky.3.t: "Los escombros espaciales aterrizan en el aparcamiento del ministerio"
 MD_wacky.3.d: "Un tanque de combustible de titanio de un satélite de comunicaciones descompuesto descendió durante la noche, aplanando tres vehículos oficiales y una cobertura. Nadie fue herido, y ninguna agencia espacial admitirá el satélite que era."
 MD_wacky.3.a: "Revisa el estado de lanzamiento."
 MD_wacky.3.b: "Ponlo en un museo."
 MD_wacky.4.t: "Máquinas expendedoras derriba la red del Ministerio"
 MD_wacky.4.d: "El Ministerio del Interior pasó una semana cazando un ataque cibernético extranjero antes de que los técnicos rastrearon el tráfico a las propias máquinas expendedoras inteligentes del edificio, que habían estado reordenando tranquilamente bebidas fizzy en un bucle infinito."
 MD_wacky.4.a: "Desplifique cada máquina en el edificio."
 MD_wacky.4.b: "Que la prensa crea que era un poder extranjero."
 MD_wacky_events: "Wacky Incident"
 MD_wacky_classified_intercept: "Intercepto clasificado"
 MD_wacky_classified_intercept_desc: "El compromiso aparece en ningún registro publicado, y las tripulaciones involucradas han sido instruidas nunca para discutir la forma del objetivo. Sin embargo, el vídeo de la cámara de armas es un excelente material de entrenamiento."
 MD_wacky_ufo_conspiracy: "La explicación del globo meteorológico"
 MD_wacky_ufo_conspiracy_desc: "Nadie cree en la declaración oficial. Dos comités ciudadanos rivales publican ahora análisis fotográficos competidores, y una emisora ha encargado un documental sobre el silencio del gobierno."
 MD_wacky_debris_exhibit: "Prueba de residuos de reentrada"
 MD_wacky_debris_exhibit_desc: "El tanque de combustible se encuentra en un museo nacional al lado de una fotografía de los tres vehículos que aterrizó. La asistencia ha subido, y un número inusual de escolares que visitan ahora dicen que tienen la intención de estudiar ingeniería."
 MD_wacky_phantom_cyber_threat: "La amenaza cibernética fantasma"
 MD_wacky_phantom_cyber_threat_desc: "El ministerio nunca corrigió la historia sobre una intrusión extranjera, y el presupuesto de seguridad de la red de emergencia fue aprobado sin una sola pregunta. Las máquinas expendedoras han sido removidas del edificio."