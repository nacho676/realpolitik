l_spanish:
 AUTOMATION_SETTINGS_OPEN_TT: "Configuración de automatización abierta"
 AUTOMATION_SETTINGS_TITLE: "Ajustes de automatización"
 AUTOMATION_SETTINGS_DESC: "Gestionar acciones recurrentes y preferencias de notificación de un panel. Los controles existentes en otros lugares siguen disponibles."
 AUTOMATION_SETTINGS_GENERAL_PAGE: "General"
 AUTOMATION_SETTINGS_SPACE_PAGE: "Satélites"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "Influencia"
 AUTOMATION_SETTINGS_SPACE_DESC: "Configure la producción automática de satélites, lanzamientos y actualizaciones de constelación."
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "Configurar acciones recurrentes que defiendan a nuestro gobierno de influencia extranjera."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "[!automation_space_save_button_click_enabled]Ponga el manifiesto de carga útil en el Programa Espacial como plan §YCustom§! y cambia a él."
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "[!automation_space_upgrade_button_click_enabled]Promover cada constelación a la nueva generación investigada donde la cobertura orbital actual lo apoye."
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "Notificaciones y preferencias"
 AUTOMATION_SETTINGS_ECONOMY_HEADER: "Economía"
 AUTOMATION_SETTINGS_UN_HEADER: "Naciones Unidas"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "Diplomacia"
 AUTOMATION_SETTINGS_NATO_HEADER: "NATO"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "Energía"
 AUTOMATION_SETTINGS_PP_RESERVE: "Poder político Reserva"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "Las acciones automatizadas que gastan el Poder Político esperarán hasta que puedan pagar su costo sin reducir el Poder Político por debajo de esta reserva.\n\n£click_left §YL Click§!: Ajustar §Y1§!\n£key_ctrl + £click_left §YCtrl L Click§!: Ajustar §Y10§!\n£key_shift + £click_left §YShift L Click§!: Ajustar §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §YL Click§!: Aumento §Y1§!\n£key_ctrl + £click_left §YCtrl L Click§!: Aumento por §Y10§!\n£key_shift + £click_left §YShift L Click§!: Aumento §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §YL Click§!: Disminuir por §Y1§!\n£key_ctrl + £click_left §YCtrl L Click§!: Disminuir por §Y10§!\n£key_shift + £click_left §YShift L Click§!: Disminuir por §Y100§!"
 AUTOMATION_SETTINGS_CORRUPTION: "Promociones de corrupción automáticamente declina"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "Skip corruption ofrece automáticamente. Los eventos y sus posibles recompensas no aparecerán mientras esto está habilitado."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "Notificaciones de elecciones extranjeras"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "Mostrar notificaciones de noticias sobre elecciones en otros países."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "Influencia Raid Notifications"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "Mostrar eventos sobre las redadas de influencia entre otros países. Si esto es deshabilitado, se informará sobre los daños en nuestra contra."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "Informe mensual de autoinfluencia"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "Mostrar el informe mensual listando países afectados por la influencia automática."
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "Aceptar automáticamente las ofertas de inversión"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "Aceptar cada oferta de inversión internacional entrante automáticamente. Habilitar este rechazo automático deshabilitado."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "Rechazar las ofertas de inversión automáticamente"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "Rechazar cada inversión internacional entrante ofrece automáticamente. Permitir esta aceptación automática deshabilitación."
 AUTOMATION_SETTINGS_REINVESTMENT: "Reinversión internacional de las inversiones"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "Elija cómo los retornos semanales de las inversiones internacionales se dividen entre el tesoro y la reinversión."
 AUTOMATION_SETTINGS_REINVEST_OFF: "Fuera."
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "Envíe todos los retornos de inversión internacional al tesoro."
 AUTOMATION_SETTINGS_REINVEST_FULL: "Completo"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "Reinvertir todos los rendimientos de las inversiones internacionales."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "Dividir"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "Envíe la mitad de las inversiones internacionales retorna al tesoro y reinvierta la otra mitad."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "Compra automática de combustible"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "Compra combustible inmediatamente, luego comprueba cada 28 días y compra de nuevo cuando las reservas de combustible caen por debajo del 20 por ciento. Desactiva esto para cancelar futuras compras."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "Inversiones internas seleccionadas repetidas"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "Pagar £pol_power §R0.15§! Poder político diariamente mientras está habilitado. Haga clic derecho en botones de inversión interna en la vista estatal para seleccionar el estado y los tipos de inversión a repetir. Las inversiones seleccionadas se verifican semanalmente y se ejecutan mientras que una ranura es gratuita, el tesoro puede pagar el costo actual, y la reserva Poder político se puede mantener."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "Estación Antártica de reaprovisionamiento automático"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "Ordene automáticamente combustible para nuestra estación Antártica a los 15 o menos días que quedan de noviembre a marzo, o 30 o menos días de abril a octubre. Las entregas cuestan §R$0.25b por cada 1000 combustible§!, duplicado durante el invierno antártico. Los pedidos esperan hasta que el tesorería pueda pagar el costo completo."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "Política de Consumo Automático"
 AUTOMATION_SETTINGS_SC_VOTE: "Consejo de Seguridad Voto predeterminado"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "Seleccione cómo votar automáticamente en las resoluciones del Consejo de Seguridad. Haga clic de nuevo en la opción seleccionada para volver a votar manualmente."
 AUTOMATION_SETTINGS_GA_VOTE: "Asamblea General Voto predeterminado"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "Seleccione cómo votar automáticamente sobre las resoluciones de la Asamblea General. Haga clic de nuevo en la opción seleccionada para volver a votar manualmente."
 AUTOMATION_SETTINGS_VOTE_YES: "Yes"
 AUTOMATION_SETTINGS_VOTE_NO: "No"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "Abstain"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "Votar Sí automáticamente en cada resolución del Consejo de Seguridad."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "Votar No automáticamente en cada resolución del Consejo de Seguridad. Los miembros permanentes emitirán un veto cuando proceda."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "Abstenerse automáticamente de cada resolución del Consejo de Seguridad."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "Votar Sí automáticamente en cada resolución de la Asamblea General."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "Votar No automáticamente en cada resolución de la Asamblea General."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "Abstenerse automáticamente de cada resolución de la Asamblea General."
 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "Ofertas de acceso por satélite Block AI"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "Evitar que los países de la AI ofrezcan acceso compartido a sus sistemas militares y civiles por satélite. Los jugadores humanos todavía pueden enviar ofertas."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "Ratificar automáticamente las accesiones de la OTAN"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "Gasta automáticamente £pol_power §Y20§! para ratificar cada candidato de adhesión a la OTAN. La ratificación espera hasta que se pueda mantener la reserva Poder político."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "Influencia Defensa"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "Combatir automáticamente la influencia extranjera"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "Pagar £pol_power §R0.05§! Poder político diariamente mientras está habilitado. Cuando esté disponible, gaste automáticamente £pol_power §Y100§! para aumentar la independencia nacional en §G2.5%§!. Repeticiones después de 100 días. La automatización pausa mientras el gobierno está siendo presionado o cuando el costo reduciría Poder político por debajo de la reserva."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "Ataque automáticamente a los influenciadores extranjeros"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "Pagar £pol_power §R0.05§! Poder político diariamente mientras está habilitado. Gasta automáticamente £pol_power §Y125§! para iniciar una campaña de 60 días contra el más fuerte influenciador extranjero elegible. Sólo una campaña funciona a la vez. Los objetivos ineligibles, lobbied y refrescante son saltados. Las pausas de automatización cuando el costo reduciría Poder político debajo de la reserva."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "Cada opción activada cuesta £pol_power §R0.05§! diariamente. Ambas opciones juntas cuestan £pol_power §R0.10§! diariamente."
 AUTOMATION_SETTINGS_ECONOMY_PAGE: "Economía"
 AUTOMATION_SETTINGS_ECONOMY_DESC: "Elija qué impuestos y gasto público gestionar de forma automática. Los cambios se revisan semanalmente y respetan la reserva Poder político."
 AUTOMATION_SETTINGS_TAX_HEADER: "Tasas de impuestos"
 AUTOMATION_SETTINGS_BUDGET_HEADER: "Leyes presupuestarias"
 AUTOMATION_SETTINGS_TAX_SUMMARY: "Los impuestos habilitados cambian a la mayor parte de un punto por semana en respuesta al saldo presupuestario, la deuda y Estabilidad.\n\nCambios manuales dejan la automatización activada."
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "Los presupuestos habilitados mueven un nivel hacia el gasto esperado. A la mayoría de los cambios presupuestarios cada semana, con prioridad rotatoria. Los aumentos requieren un superávit presupuestario. Los cambios de derecho manuales permiten la automatización."
 AUTOMATION_SETTINGS_POPULATION_TAX: "Tasa de población: [?population_tax_rate|0]%"
 AUTOMATION_SETTINGS_CORPORATE_TAX: "Impuestos corporativos: [?corporate_tax_rate|0]%"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "Ajuste automático del Impuesto sobre Población por un punto porcentual semana utilizando el balance presupuestario, la deuda y Estabilidad. Respeta las restricciones del cambio de impuestos y paga el costo normal Poder político por encima de la reserva. Los cambios de impuestos manuales permiten esta opción."
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "Ajuste automático del Impuesto Corporativo por un punto porcentual semana utilizando el balance presupuestario, la deuda y las fábricas civiles disponibles. Respeta las restricciones del cambio de impuestos y paga el costo normal Poder político por encima de la reserva. Los cambios de impuestos manuales permiten esta opción."
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY: "Administración: [?bureau_law|0] / [?expected_adm_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT: "Automáticamente mueve Administración hacia su nivel de gasto esperado, un nivel a la vez. Los números muestran los niveles actuales y esperados. Se aplican restricciones legales normales y Poder político costos. Los aumentos requieren un superávit y pausa durante la quiebra inminente. La reserva Poder político se conserva. Los cambios legales manuales permiten esta opción."
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING: "Policía: [?police_law|0] / [?expected_police_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING_TT: "Automáticamente se mueve Policing hacia su nivel de gasto esperado, un nivel a la vez. Los números muestran los niveles actuales y esperados. Se aplican restricciones legales normales y Poder político costos. Los aumentos requieren un superávit y pausa durante la quiebra inminente. La reserva Poder político se conserva. Los cambios legales manuales permiten esta opción."
