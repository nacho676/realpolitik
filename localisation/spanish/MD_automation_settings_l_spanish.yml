 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET: "Bienestar: [?social_law|0] / [?expected_welfare_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET_TT: "Movimiento automático Bienestar hacia su nivel de gasto esperado, un nivel a la vez. Los números muestran los niveles actuales y esperados. Se aplican restricciones legales normales y Poder político costos. Los aumentos requieren un superávit y pausa durante la quiebra inminente. La reserva Poder político se conserva. Los cambios legales manuales permiten esta opción."
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING: "Gasto militar: [?military_law|0] / [?expected_military_sp|0]"
