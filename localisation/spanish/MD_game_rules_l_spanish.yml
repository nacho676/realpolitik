 MD_AI_RULES: "Opciones de la IA"
 MD_PEACE_DEALS: "Conferencias de paz"
 MD_FOCUS_TREE_RULES: "Opciones del árbol de enfoque"
 MD_FORMABLE_RULES: "Banderas y formables"
 MD_ORGANISATION_RULES: "Opciones de organización"
 MD_INFLUENCE_RULES: "Opciones del sistema de influencia"
 MD_OPTIMISATION_RULES: "Optimización y rendimiento"
 MD_NUCLEAR_RULES: "Reglas nucleares"
 MD_RULES: "Reglas varias"
 MD_CHEAT_RULES: "Opciones de trucos"
 MD_RANDOM_RULES: "Reglas del generador aleatorio"
 RULE_HARD_AI_ECONOMIC: "IA Económica"
 RULE_DISABLE_HARD_AI_ECONOMIC: "Restricción estándar"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "Una restricción estándar para la IA que no le permite fortalecer su economía. Para un juego histórico."
 RULE_ENABLE_HARD_AI_ECONOMIC: "Sin restricciones"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "Si estás aburrido de que en cada juego la IA no salga de la crisis económica, esto es para ti. La IA ya no está limitada en tomar decisiones sobre su economía. Prepárate porque muchos países se volverán más ricos que tú. Solo para aquellos que no temen a los desafíos. ¡Saludos del desarrollador Battle AI! ;)"
 RULE_AI_STARTING_POLITICAL_POWER: "Poder político inicial de la IA"
 RULE_AI_STARTING_POLITICAL_POWER_NO: "Sin poder político inicial"
 RULE_AI_STARTING_POLITICAL_POWER_NO_DESC: "La IA no comenzará con ningún poder político."
 RULE_AI_STARTING_POLITICAL_POWER_250: "250 Poder político"
 RULE_AI_STARTING_POLITICAL_POWER_250_DESC: "Añadir 250 de poder político a todas las naciones controladas por la IA."
 RULE_AI_STARTING_POLITICAL_POWER_500: "500 Poder político"
 RULE_AI_STARTING_POLITICAL_POWER_500_DESC: "Añadir 500 de poder político a todas las naciones controladas por la IA."
 RULE_AI_STARTING_POLITICAL_POWER_1000: "1000 Poder político"
 RULE_AI_STARTING_POLITICAL_POWER_1000_DESC: "Añadir 1000 de poder político a todas las naciones controladas por la IA."
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "Desactivar Guerras de Deuda para la IA"
 RULE_DISABLE_AI_DEBT_WAR: "Desactivar"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "Esto desactiva la función de guerras de deuda para la IA. La IA ya no tomará la opción de invadir a una nación que incumple su deuda."
 RULE_ENABLE_AI_DEBT_WAR: "Activar"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "Esta configuración hará que la IA sea más propensa a declarar guerras por deuda."
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS: "¡La IA utiliza el §TEnfoque para aumentar la autonomía§!"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS: "Activar"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "La IA luchará contra tu autonomía utilizando el enfoque continuo §YMejorar la Autonomía§!."
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS: "Desactivar"
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "¡La IA ya no luchará contra tu autonomía utilizando el enfoque continuo §YMejorar la autonomía§!."
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "Activar Acuerdos de Paz Caóticos"
 RULE_OPTION_CHAOTIC_PC_NO: "Sí"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "Esta opción debería evitar que todos hagan adquisiciones territoriales en las conferencias de paz de la IA. Limita a los principales y líderes de facciones la posibilidad de reclamar estados. (Esto solo afectará a la IA, no al jugador)."
 RULE_OPTION_CHAOTIC_PC_YES: "Sí"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "Para aquellos que realmente disfrutan de las conferencias de paz malditas, ¿por qué limitar el mundo a 1 §YRusia§! cuando son posibles 12 §YRusias§!? \n(¡No me hago responsable de los resultados que puedan surgir de esta opción!)"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "Activar Conferencias de Paz Dirigidas por el Jugador"
 RULE_OPTION_PLAYER_LED_PC_NO: "Sí"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "Esta opción permitirá que la IA tome sus propias decisiones, por muy tontas que puedan ser."
 RULE_OPTION_PLAYER_LED_PC_YES: "Sí"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "Para aquellos que no confían en que la IA coloque el clavo redondo en el agujero redondo, esto permitirá que solo los jugadores hagan reclamos durante las conferencias de paz."
 RULE_SALAFIST_BRANCH: "Habilitar Rama Salafista"
 RULE_YES_SALAFIST_BRANCH_DESC: "Habilita la rama Salafista en el árbol genérico para todas las naciones independientemente de su religión inicial."
 RULE_NO_SALAFIST_BRANCH_DESC: "Habilita la rama Salafista en el árbol genérico para las naciones que siguen cualquier variante del Islam."
 CUB_AI_BEHAVIOR: "@CUB Cuba"
 RULE_OPTION_DEMOCRAT: "Inclinación Demócrata"
 RULE_OPTION_DEMOCRAT_AI_DESC: "El §8Partido Democrático§! sostiene la Casa Blanca y el Congreso y gobierna desde el centro-izquierda para una generación. Washington pasa en casa, y conduce al extranjero a través de instituciones más que por la fuerza."
 RULE_OPTION_REPUBLICAN: "Inclinación Republicana"
 RULE_OPTION_REPUBLICAN_AI_DESC: "El §8Partido Republicano§! sostiene la Casa Blanca y el Congreso y gobierna desde el centro-derecho para una generación. Washington corta en casa, y mantiene el mundo en orden por peso de las armas."
 RULE_OPTION_REFORMED_REPUBLIC: "República Reformada"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "Las fuerzas de presión pública a través de la reforma política y electoral que da acceso real a terceras partes y representación real. El bloqueo de dos partidos rompe, y el gobierno americano se convierte en un problema de coalición por primera vez."
 RULE_OPTION_POST_UNITED: "Después de la Unión"
 RULE_OPTION_POST_UNITED_AI_DESC: "El gobierno federal pierde su control y los Estados Unidos se separan en las repúblicas sucesoras que heredan su territorio. América del Norte se convierte en un continente de Estados americanos rivales §R y este camino no puede combinarse con la histórica norma AI§!."
 FIJ_AI_BEHAVIOR: "@FIJ Fiji"
 NIG_AI_BEHAVIOR: "@NIG Nigeria"
 RULE_OPTION_FRA_HISTORICAL: "Histórico"
 RULE_OPTION_FRA_HISTORICAL_DESC: "La Quinta República tiene su curso a medida que la presidencia pasa de Chirac a Sarkozy, luego Hollande y Macron, con los §8Republicanos§! y la oficina central entre ellos. Francia ancla la integración europea y mantiene su mano en el ámbito de Françafrique."
 BRM_AI_BEHAVIOR: "@BRM Myanmar"
 RULE_OPTION_NORTHERN_AMBITION: "Ambición del Norte"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "La derecha nacionalista sueca se eleva y convierte el sentimiento norteño en un programa de unión. Estocolmo se propone reunir a Escandinavia y el Báltico bajo un imperio sueco restaurado, por tratado donde puede y por la fuerza donde debe."
 SYR_AI_BEHAVIOR: "@SYR Syria"
 RULE_OPTION_SYR_HISTORICAL: "IA Histórica"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Hafez al-Assad será sucedido por su hijo mayor, Bashar al-Assad. Bashar mantendrá a Siria como un país alineado con Rusia, con un enfoque equilibrado en diplomacia, militarismo y economía."
 RULE_OPTION_SYR_IRON_LADY: "Dama de Hierro de Siria"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Hafez al-Assad será sucedido por su hija Bushra al-Assad. Bushra adoptará un enfoque más neutral entre las grandes potencias, con un enfoque en diplomacia y economía."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Siria Salvaje"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Hafez al-Assad es sucedido por su hijo menor Maher en vez de por Bashar, y el ejército es entregado al estado de manera directa. Siria reta para una Siria más grande, y el Levante obtiene un poder agresivo donde tenía uno cauteloso."
 RULE_OPTION_SYR_NEW_ASSAD: "Nuevo al-Assad"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Hafez al-Assad será sucedido por su hermano Rifaat al-Assad después de la Primavera de Damasco. Rifaat se enfocará en una política pro-saudí con énfasis en diplomacia y economía."
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Primavera de Damasco"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "Los salones §8Damascus Spring§! nunca se cierran, y los reformadores convierten una temporada de debate en un cambio de gobierno. Siria se convierte en una democracia funcional, y el orden baathista pierde su segunda capital."
 BHR_AI_BEHAVIOR: "@BHR Bahréin"
 SAU_AI_BEHAVIOR: "@SAU Saudi Arabia"
 RULE_OPTION_RULE_BRITANNIA: "Gobernar a Britannia"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Los partisanos de la Corona rompen el sistema bipartidista, construyen su movimiento fuera del declive del país y sacan el poder de forma directa. El imperio es restaurado por la fuerza, y Gran Bretaña deja de ser el socio junior de Washington."
 BOT_AI_BEHAVIOR: "@BOT Botsuana"
 NKO_AI_BEHAVIOR: "@NKO Corea del Norte"
 SIN_AI_BEHAVIOR: "@SIN Singapur"
 SIN_GLOBAL_DIPLOMACY: "Diplomacia Global"
 SIN_GLOBAL_DIPLOMACY_DESC: "Singapur gasta su riqueza en la convocatoria más que sólo en el comercio, y hace de la isla la sala donde se hablan las rivalidades de Asia. Los estados pequeños tienen una audiencia que no tendrían de otra manera, y los grandes poderes se reúnen en alfombra neutral."
 SIN_SINGAPORE_ALONE: "Singapur en Solitario"
 SIN_SINGAPORE_ALONE_DESC: "El §8Partido de Acción Popular§! gobierna sin interrupción y mantiene la defensa de la isla en sus propias manos, sin confiar en ninguna garantía por la que no pagó. Singapur sigue siendo rico, armado y sin servicio, y no lleva el lado de nadie más allá de lo que requiere el comercio."
 SIN_PRESSURE_SOUTH_ASIAN_SEAS: "Presionar el Mar de Asia Meridional"
 SIN_PRESSURE_SOUTH_ASIAN_SEAS_DESC: "Singapur convierte su marina y su dinero en el exterior y comienza a establecer términos en los estrechos que depende. El sudeste asiático adquiere un pequeño poder dispuesto a policía sus carriles marinos, y sus vecinos más grandes se dan cuenta."
 SER_AI_BEHAVIOR: "@SER Yugoslavia"
 RULE_OPTION_MILOCEVIC_COMMI: "Milosevic es comunista"
 RULE_OPTION_MILOCEVIC_COMMI_AI_DESC: "Slobodan Milošević sobrevive el desafío a su gobierno y vuelve al país hacia el socialismo en lugar de defender lo que queda de la república. Yugoslavia es reconstruida como una federación socialista, y los Balcanes tienen un poder marxista en ellos de nuevo."
 RULE_OPTION_MILOCEVIC_NATI: "La Gran Serbia de Milosevic"
 RULE_OPTION_MILOCEVIC_NATI_AI_DESC: "Slobodan Milošević sobrevive y convierte al Estado en el proyecto de la Gran Serbia, reclamando cada distrito donde viven los serbios. Las guerras yugoslavas se reabrieron en lugar de establecerse, y cada vecino con una minoría serbia se convierte en un objetivo."
 RULE_OPTION_MILOCEVIC_FEDERATION: "La Federación Balcánica de Milosevic"
 RULE_OPTION_MILOCEVIC_FEDERATION_AI_DESC: "Slobodan Milošević sobrevive y revive la Federación Balcana §8§!, el sindicato que los socialistas de la región nunca lograron construir. Belgrado ofrece a sus vecinos más que conquista, y la península se reúne bajo un mismo techo."
 RULE_OPTION_SERBIAN_KINGDOM: "Reino de Serbia"
 RULE_OPTION_SERBIAN_KINGDOM_AI_DESC: "Milošević es derrocado y los nacionalistas y monarquistas toman el estado en su lugar, sentando la dinastía §8Karađorđević§! en Belgrado. Serbia gobierna por corona e iglesia, y persigue las mismas viejas reivindicaciones por medios más respetables."
 RULE_OPTION_SERBIAN_LIBERALS: "Serbia liberal"
 RULE_OPTION_SERBIAN_LIBERALS_AI_DESC: "Los reformadores que derribaron a Milošević mantienen al país y lo reconstruyen como democracia liberal. Serbia organiza su curso para la Unión Europea y resuelve sus disputas con sus vecinos en lugar de cuidarlos."
 UKR_AI_BEHAVIOR: "@UKR Ucrania"
 SPR_CONSERVATIVE_LEANINGS: "Tendencias Conservadoras"
 SPR_CONSERVATIVE_LEANINGS_DESC: "El §8Partido Popular§! y la más amplia derecha española sostienen las Cortes y gobiernan en la línea liberal del mercado, atlántica. España se mantiene firme miembro de la OTAN y un socio invencible en Bruselas."
 SPR_RENACIMIENTO_NACIONALISTA: "Renacimiento Nacionalista"
 SPR_RENACIMIENTO_NACIONALISTA_DESC: "§8Vox§! y el derecho nacionalista salen de la franja y toman al gobierno. España se enfrenta a las comunidades autónomas y contra la migración, y se encuentra discutiendo con Bruselas en lugar de seguirla."
 SPR_NACION_UNIDAD_IMPERIO: "Nación Unidad Imperio"
 SPR_NACION_UNIDAD_IMPERIO_DESC: "§8La Falange§! regresa del desierto político y reconstruye el estado español en el modelo nacional-sindicalista. Las Cortes dan paso a los sindicatos verticales, y España mira a su antiguo imperio en lugar de a Europa."
 SPR_SOCIALISM_RISING: "Auge del Socialismo"
 SPR_SOCIALISM_RISING_DESC: "El §8 Partido Socialista Español§! y la izquierda más amplia tienen poder para una generación y empujan al estado de bienestar más allá de cualquier gobierno ante ellos. España se convierte en el argumento socialdemocrático de Europa y tira del Mediterráneo junto con él."
 SPR_COMMUNIST_REVISIONISM: "Revisionismo Comunista"
 SPR_COMMUNIST_REVISIONISM_DESC: "El §8Partido Comunista de España§! toma el estado que los socialistas no lo harían, y la república se reconstruye en las líneas marxistas. España deja atrás el campamento occidental, y la OTAN pierde su flanco sur."
 SPR_THE_OLD_WAYS: "Los Viejos Caminos"
 SPR_THE_OLD_WAYS_DESC: "La corona y la iglesia se colocan en el centro del estado, y España se propone recuperar el imperio que perdió. Gibraltar, el Magreb y las viejas vicerreligencias se tratan como negocios inacabados en lugar de como historia."
 GEO_AI_BEHAVIOR: "@GEO Georgia"
 GEO_NATIONALIST_behavior: "@GEO Comportamiento Nacionalista"
 GEO_help_CHE_behavior: "@GEO Ayuda para los chechenos"
 GEO_2008_war_behavior: "@GEO Comportamiento en la guerra de 2008"
 GEO_WILL_FOLLOW_OWN_WAY: "Camino Propio"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "Georgia nacionalista seguirá su propio camino y aplastará a Armenia y Azerbaiyán."
 GEO_WILL_BE_PRO_ARMENIA: "Pro-Armenia"
 GEO_WILL_BE_PRO_ARMENIA_DESC: "Georgia nacionalista ayudará a Armenia a aplastar a Azerbaiyán."
 GEO_WILL_BE_PRO_AZERI: "Pro-Azerbaiyán"
 GEO_WILL_BE_PRO_AZERI_DESC: "Georgia nacionalista ayudará a Azerbaiyán a aplastar a Armenia."
 GEO_WILL_HELP: "Ayudar a @CHE Chechenos"
 GEO_WILL_HELP_DESC: "Georgia ayudará a los chechenos en la guerra contra Rusia. Pueden ayudar a Georgia en el futuro."
 GEO_WONT_HELP: "No ayudar a @CHE Chechenos"
 GEO_WONT_HELP_DESC: "Georgia no ayudará a los chechenos en la guerra contra Rusia. Serán hostiles hacia Georgia."
 GEO_ATTACK_RUS: "Preparándose para la guerra"
 GEO_ATTACK_RUS_DESC: "Georgia estará preparada para la guerra de 2008 e intentará ganar en el conflicto."
 GEO_WEAKBOY: "Compromiso con Rusia"
 GEO_WEAKBOY_DESC: "Georgia buscará un compromiso con Rusia para evitar acciones bélicas."
 BLR_union_state_ai_behavior: "@BLR Comportamiento de la Unión Estatal"
 BLR_WONT_FOLLOW_UNION_STATE: "No seguir la Unión Estatal"
 BLR_WONT_FOLLOW_UNION_STATE_DESC: "Bielorrusia no formará parte de la Unión Estatal y no se convertirá en títere de Rusia."
 BLR_WILL_FOLLOW_UNION_STATE: "Formar la Unión Estatal"
 BLR_WILL_FOLLOW_UNION_STATE_DESC: "Bielorrusia intentará formar la Unión Estatal. Al principio se convertirán en títeres de Rusia, pero más adelante..."
 PMR_sub_behavior: "@PMR Subcomportamiento de Transnistria"
 PMR_PASSIVE_DEFAULT: "Prioridad económica"
 PMR_PASSIVE_DEFAULT_DESC: "Transnistria centrará su atención en el sector económico."
 PMR_SHERIFF: "El Sheriff Republic"
 PMR_SHERIFF_DESC: "Tiraspol permite que el §8Sheriff§! sostenga absorber el estado que fue construido dentro, hasta que el propio brazo de seguridad de la compañía responda para la república. Transnistria termina gobernada por su mayor negocio en lugar de por su parlamento."
 RULE_OPTION_GER_GREEN: "La Cancillería Verde"
 RULE_OPTION_GER_GREEN_DESC: "Los §8Greens§! toman la cancillería en su propio derecho y lo gastan en la eliminación nuclear, un acuerdo verde europeo e impuestos progresivos. Alemania empuja la alianza hacia el este y pone distancia entre Moscú y Beijing."
 RULE_OPTION_GER_NATIONALIST: "Estado de los Demócratas Nacionales"
 RULE_OPTION_GER_NATIONALIST_DESC: "El orden constitucional colapsa en la guerra civil y el §8Partido Nacional Democrático§! toma las ruinas, construyendo un estado policial de partido único en sangre, suelo y expulsión. Alemania se vuelve abiertamente irredentista y cada frontera alrededor de ella se convierte en una reclamación."
 RULE_OPTION_GER_SOCIALIST: "El Ascendente Izquierdo"
 RULE_OPTION_GER_SOCIALIST_DESC: "§8Die Linke§! saca el poder de los restos de la República Federal, tira a los estadounidenses de sus bases y desarma al país. Alemania entonces presiona a Francia, Polonia y Suecia en un sindicato de trabajadores, por la fuerza si lo rechazan."
 RULE_OPTION_GER_MONARCHIST: "El Kaiser regresa"
 RULE_OPTION_GER_MONARCHIST_DESC: "La república cae y el §8Kaiser§! es coronado de nuevo sobre un imperio restaurado. Alemania vuelve a poner monarcas en los tronos suizo, austriaco, belga, otomano e italiano y los reúne en un bloque imperial."
 RULE_DISABLE_FORMABLE_NATIONS: "Deshabilitar Naciones Formables"
 RULE_YES_FORMABLE_NATIONS_DESC: "Deshabilita las decisiones de Naciones Formables."
 RULE_NO_FORMABLE_NATIONS_DESC: "Las naciones formables estarán habilitadas."
 RULE_ALLOW_EDGY_FLAGS: "Permitir Banderas Controvertidas"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "Evita que aparezcan algunas de las opciones de banderas más controvertidas."
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Permite opciones de banderas más controvertidas que normalmente estarían censuradas."
 RULE_DISABLE_EU: "Deshabilitar la UE"
 RULE_YES_DISABLE_EU_DESC: "Todos los países serán eliminados de la Unión Europea."
 RULE_NO_DISABLE_EU_DESC: "La Unión Europea existirá tal como está."
 RULE_DISABLE_NATO: "Deshabilitar la OTAN"
 RULE_YES_DISABLE_NATO_DESC: "La OTAN se deshabilitará al cargar el juego."
 RULE_NO_DISABLE_NATO_DESC: "La OTAN seguirá siendo una facción."
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN: "Incremento de Ganancia de Influencia al Expandirse"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN_DESC: "Cambia la cantidad de influencia ganada al expandir la influencia."
 RULE_SPREAD_INFLUENCE_GAIN_3: "3%"
 RULE_SPREAD_INFLUENCE_GAIN_3_DESC: "3 % de influencia ganada por acción de propagación. Para cuando quieras aumentar la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_GAIN_0_5: "0.5%"
 RULE_SPREAD_INFLUENCE_GAIN_0_5_DESC: "Gana un 0.5% de influencia por acción de expansión. Útil si deseas ralentizar la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_GAIN_1_5: "1.5%"
 RULE_SPREAD_INFLUENCE_GAIN_1_5_DESC: "1 % de influencia obtenida por cada acción de propagación. La ganancia de influencia predeterminada por cada acción de influencia de propagación."
 RULE_SPREAD_INFLUENCE_GAIN_1: "1%"
 RULE_SPREAD_INFLUENCE_GAIN_1_DESC: "1 % de influencia ganada por acción de propagación. Si realmente quieres ralentizar la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_GAIN_2: "2%"
 RULE_SPREAD_INFLUENCE_GAIN_2_DESC: "2 % de influencia ganada por cada acción de propagación. Si realmente quieres aumentar la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_GAIN_4: "4%"
 RULE_SPREAD_INFLUENCE_GAIN_4_DESC: "Gana un 4% de influencia por acción de expansión. Útil si deseas aumentar significativamente la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_AMOUNT_COOLDOWN: "Tiempo de Enfriamiento para Expandir Influencia"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN: "30 días"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN_DESC: "El enfriamiento predeterminado. Cada 30 días, puedes expandir tu influencia hacia otra nación."
 RULE_SPREAD_INFLUENCE_14_COOLDOWN: "14 días"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN_DESC: "Cada 14 días, puedes expandir tu influencia hacia otra nación."
 RULE_SPREAD_INFLUENCE_0_COOLDOWN: "Sin enfriamiento"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "Sin tiempo de enfriamiento para expandir la influencia, ¡ideal si deseas gastar todo tu §HPoder Político§! en influenciar a otras naciones!"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60 días"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "Cada 60 días, puedes expandir tu influencia hacia otra nación."
 RULE_INVEST_INFLUENCE_AMOUNT_GAIN: "Ganancia de Influencia por Inversiones"
 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "Ganarás un 1% de influencia cada vez que alguien acepte tus inversiones."
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "Ganarás un 0.5% de influencia cada vez que alguien acepte tus inversiones."
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
 RULE_INVEST_DEFAULT_GAIN_2_DESC: "Ganarás un 2% de influencia cada vez que alguien acepte tus inversiones."
 RULE_INFLUENCE_COOLDOWN: "Enfriamiento para Ganar Influencia por Inversiones"
 RULE_14_DAY_INFLUENCE: "Enfriamiento de 14 días"
 RULE_14_DAY_INFLUENCE_DESC: "Opción predeterminada. El enfriamiento para ganar influencia por inversiones es de 14 días o 2 semanas. Esto se aplica a la nación en todas las oportunidades de inversión posibles. Aunque aún puedes invertir, no ganarás influencia durante este período de tiempo."
 RULE_0_DAY_INFLUENCE: "Sin enfriamiento"
 RULE_0_DAY_INFLUENCE_DESC: "La antigua forma de ganar influencia por inversiones sin límite de tiempo. Puedes invertir tantas veces como quieras y seguir ganando influencia, ¡no recomendado para aquellos que prefieren el equilibrio!"
 RULE_30_DAY_INFLUENCE: "Enfriamiento de 30 días"
 RULE_30_DAY_INFLUENCE_DESC: "La opción sugerida para multijugador. El enfriamiento para ganar influencia por inversiones es de 30 días o aproximadamente 1 mes. Esto se aplica a la nación en todas las oportunidades de inversión posibles. Aunque aún puedes invertir, no ganarás influencia durante este período de tiempo."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK: "¡Habilite la §YIndependencia Doméstica§! mensual Marca de crecimiento"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_NO_DESC: "Desactiva la §YIndependencia Doméstica§! mensual Marca de crecimiento"
