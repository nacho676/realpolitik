 RULE_EUROPEAN_VOTING_COOLDOWN_LIMIT: "Enfriamiento de la votación en la Unión Europea"
 RULE_OPTION_EU_SIXTY: "60 días"
 RULE_OPTION_EU_SIXTY_DESC: "El período de espera para las votaciones del Parlamento Europeo y del Consejo Europeo se establecerá en sesenta días, en lugar de los ciento ochenta días predeterminados."
 RULE_OPTION_EU_NINETY: "90 días"
 RULE_OPTION_EU_NINETY_DESC: "El período de espera para las votaciones del Parlamento Europeo y del Consejo Europeo se establecerá en noventa días, en lugar de los ciento ochenta días predeterminados."
 RULE_OPTION_EU_ONE_HUNDRED_EIGHTY: "180 días"
 RULE_OPTION_EU_ONE_HUNDRED_EIGHTY_DESC: "El período de espera para las votaciones del Parlamento Europeo y del Consejo Europeo se establecerá en el plazo predeterminado de ciento ochenta días."
 RULE_OPTION_EU_TWO_HUNDRED_TEN: "210 días"
 RULE_OPTION_EU_TWO_HUNDRED_TEN_DESC: "El período de espera para las votaciones del Parlamento Europeo y del Consejo Europeo se establecerá en doscientos diez días en lugar de los ciento ochenta días predeterminados."
 UKR_VINTRENKO: "Vitrenko"
 UKR_VINTRENKO_DESC: "Nataliya Vitrenko §8El Partido Socialista Progresista§! lleva al país en un programa que fusiona la ortodoxia, la nostalgia soviética y su propia marca de política femenina. Ucrania se vuelve difícil contra Occidente y lee la oferta europea como un acto de hostilidad."
 UKR_NATIONALISTS: "Nacionalismo ucraniano"
 UKR_NATIONALISTS_DESC: "Los herederos de los §8Ejército Insurgente de Ucrania§! Ucrania se enfrenta a Moscú sin esperar que Occidente lo permita, y sus regiones de habla rusa son gobernadas en lugar de corte."
 UKR_DEMOCRATIC: "Ucrania democrática"
 UKR_DEMOCRATIC_DESC: "Ucrania mantiene la línea pro-occidental y organiza todo el estado en torno a la adhesión a la Unión Europea y la OTAN. Kyiv se convierte en el borde oriental del bloque occidental, y Moscú trata que como pérdida debe revertir."
 UKR_COMMUNISM: "Ucrania comunista"
 UKR_COMMUNISM_DESC: "El §8Partido Comunista de Ucrania§! gana el argumento que la transición dejó sin terminar y recupera la república. Kiev trabaja para reacomodar a la Unión Soviética en lugar de escapar."
 UKR_SOCIALISM: "Ucrania socialista"
 UKR_SOCIALISM_DESC: "El §8Partido Socialista de Ucrania§! toma el poder y reconstruye al país sobre la redistribución y propiedad pública sin llegar a la vieja bandera roja. Los oligarcas pierden el control, y Kyiv mantiene su distancia de Bruselas y Moscú por igual."
 UKR_YUSHENKO: "Yushchenko"
 UKR_YUSHENKO_DESC: "El campamento de Orange ocupa la presidencia detrás de Viktor Yushchenko y gobierna en rehabilitación, lengua y carretera oeste. Ucrania se apoya en Europa y Estados Unidos, y el gas que calienta se convierte en un arma en las manos de Moscú."
 UKR_YANUK: "Yanukovych"
 UKR_YANUK_DESC: "Viktor Yanukovych y el §8Partido de Regiones§! mantienen el estado y lo dirigen hacia Moscú. El acuerdo europeo queda sin firma, y el este y oeste del país se gobiernan como circunscripciones rivales."
 RULE_ALLOW_RELEASE_NATIONS_UKRAINE_FEDERALIZE_TOOLTIP: "§Y[ROOT.GetNameDefCap]§! no puede liberar este país a menos que §Yfederalice§! Ucrania"
 LBA_AI_BEHAVIOR: "@LBA Libia"
 RULE_OPTION_LBA_GRAND_MUFTI: "Regla del Gran Mufti"
 RULE_OPTION_LBA_GRAND_MUFTI_DESC: "A §8El Gran Mufti§! es nombrado y la ley religiosa colocada por encima del estado. El Mufti finalmente toma el poder, estableciendo un reino salafista e imponiendo una estricta gobernanza islámica a través de Libia."
 RULE_OPTION_LBA_KINGDOM: "El Reino Senussi"
 RULE_OPTION_LBA_KINGDOM_DESC: "La familia real vuelve a casa y se compensa, y la monarquía §8Senussi§! es restaurada a una regla absoluta. Libia abandona su república, y la corona suspende las elecciones indefinidamente."
 RULE_ALLOW_RELEASE_NATIONS_RUSSIA_SUBJECT_RF_TOOLTIP: "§RINDISPONIBLE§!"
 RULE_OPTION_EU_ONE_HUNDRED_TWENTY: "120 días"
 RULE_OPTION_EU_ONE_HUNDRED_TWENTY_DESC: "El período de espera para las votaciones del Parlamento Europeo y del Consejo Europeo se establecerá en ciento veinte días en lugar del período predeterminado de ciento ochenta días."
 RULE_INTERNAL_FACTION_TICK_AMOUNT: "§YFacción interna§! Importe mensual de la opinión"
 RULE_OPTION_IF_POINT_10: "0.10 Opinión Mensual"
 RULE_OPTION_IF_POINT_10_DESC: "La tasa de ticks mensuales de la opinión de la §YFacción interna§! se establecerá en 0,10 en lugar del valor predeterminado de 0,50. Los logros personalizados de Millennium Dawn se desactivarán con esta configuración."
 RULE_OPTION_IF_POINT_25: "0.25 Opinión Mensual"
 RULE_OPTION_IF_POINT_25_DESC: "La tasa de ticks mensuales de la opinión de la §YFacción interna§! se establecerá en 0,25 en lugar del valor predeterminado de 0,50. Los logros personalizados de Millennium Dawn se desactivarán con esta configuración."
 RULE_OPTION_IF_POINT_50: "0.50 Opinión Mensual"
 RULE_OPTION_IF_POINT_50_DESC: "La tasa de ticks mensual de la opinión de la §YFacción interna§! se establecerá en el valor predeterminado de 0,50"
 RULE_OPTION_IF_POINT_75: "0.75 Opinión Mensual"
 RULE_OPTION_IF_POINT_75_DESC: "La tasa de ticks mensuales de la opinión de la §YFacción interna§! se establecerá en 0,75 en lugar del valor predeterminado de 0,50. Los logros personalizados de Millennium Dawn se desactivarán con esta configuración."
 RULE_OPTION_GREAT_COLLAPSE: "El gran colapso"
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "El gasto militar de la Guerra Fría sobrevive al enemigo que fue construido, y una década de protesta y represión termina en un ataque ferroviario nacional que paraliza al gobierno federal. Los Estados Unidos colapsan bajo su propio peso, y los estados quedan para defenderse por sí mismos."
 USB_AI_BEHAVIOR: "@USB estados libres"
 RULE_OPTION_REVANCHIST_PATH: "Recuperando el destino"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "Lo que queda del establecimiento federal convierte a los Estados Libres en recuperar la totalidad de los Estados Unidos continentales. Cada vecino en el viejo mapa americano se convierte en una reclamación que espera ser presionado §R y este camino sólo existe si la regla de los Estados Unidos está establecida para Post United Era o The Great Collapse§!."
 RULE_OPTION_ISOLATION_PATH: "El gran cierre"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "El sueño americano está escrito, y los Estados Libres cierran la puerta en un mundo que ya no creen que le deben nada. Los antiguos compromisos de Washington se agotan y la costa oriental queda a su silencio §R y este camino sólo existe si el gobierno de Estados Unidos está establecido en Post United Era o The Great Collapse§!."
 RULE_OPTION_ARCADIA_PATH: "La identidad oriental"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "La lealtad federal se desvanece y los Estados Libres construyen una nueva §8 Identidad Este§! fuera del Plan Arcadia en lugar de lamentar la unión. La costa este se convierte en una nación en su propio derecho en lugar de un triunfo del viejo §R y este camino sólo existe si la regla de los Estados Unidos está establecida para Post United Era o El Gran Colapso§!."
 CSA_AI_BEHAVIOR: "@CSA República Sur"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "Una América del Sur"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "La República del Sur mantiene la fe con la vieja idea americana y se establece para reconstruir el sindicato bajo su propia bandera. Se ofrece a sí mismo como el sucesor legítimo de los Estados Unidos en lugar de como una ruptura §R y este camino sólo existe si la regla de los Estados Unidos se establece para Post United Era o El Gran Colapso§!."
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "El círculo dorado"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "La república revive la §8Círculo de oro§!, el viejo diseño de la Confederación para un imperio alrededor del Golfo y el Caribe. La República Sur busca su futuro, y sus vecinos se encuentran dentro de la esfera de alguien §Ry este camino sólo existe si la regla de los Estados Unidos se establece para Post United Era o El Gran Colapso§!."
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "La identidad oriental"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "Al no querer llevar el legado estadounidense o confederado, la república construye una nueva identidad en su herencia cajun y criolla. La costa del Golfo se convierte en una nación propia más que el Estado sucesor de nadie §R y este camino sólo existe si la regla de los Estados Unidos está establecida para Post United Era o The Great Collapse§!."
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "El levantamiento de Florida"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "Los nacionalistas sureños rechazan el resultado de Florida y toman armas contra un gobierno que llaman robado. La joven república se abre en sus primeros años §R y este camino sólo existe si el gobierno de Estados Unidos está establecido para Post United Era o The Great Collapse§!."
 CAS_AI_BEHAVIOR: "@CAS Cascadia"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "Resistencia de las Montañas Rocosas"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "Olympia deja el malestar en la panhandle de Idaho a los alguaciles locales, y la Resistencia a la Montaña Rocky §8§! los supera hasta que los condados montañosos se levanten por la independencia. Cascadia tiene que luchar contra una secesión en su propio país de atrás §R y este camino sólo existe si la regla de los Estados Unidos está fijada para Post United Era o El Gran Colapso§!."
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "Paz en nuestro tiempo"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "Olympia envía una unidad de investigación especial al este para hacerse cargo del esfuerzo de contrarresistencia, y el orden vuelve hasta que la dirección §8Rocky Mountain Resistance§! disuelva el movimiento mismo. Cascadia sale de la crisis entera y tranquila §R y este camino sólo existe si el gobierno de Estados Unidos está establecido para Post United Era o El Gran Colapso§!."
 LKT_AI_BEHAVIOR: "@LKT Lakota"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "Reclamacion de frente de guerra"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "Un auditor enviado desde la capital confronta al §8Reclamation Front§! el liderazgo por su propia autoridad, y la reunión termina en ruptura abierta. Kansas militariza bajo el frente y Lakota va a la guerra con él §Ry este camino sólo existe si la regla de los Estados Unidos se establece para Post United Era o El Gran Colapso§!."
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "Reclamar frete de paz"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "Una segunda ronda de investigación refuta los informes más duros sobre el Frente de Reclamación §8§!, y los dos gobiernos hablan en lugar de armar. Lakota y el Frente construyen una unión económica y social común de la reconciliación §R y este camino sólo existe si la regla de los Estados Unidos se establece en Post United Era o The Great Collapse§!."
 GAME_RULE_nato_disabled: "§YLA OTAN§! Está deshabilitada mediante una regla del juego"
 RULE_OPTION_HISTORICAL_PRESIDENTS: "Presidentes históricos de los Estados Unidos"
 RULE_OPTION_HISTORICAL_PRESIDENTS_AI_DESC: "Cada elección devuelve al presidente que realmente lo ganó, y los partidos intercambian la Casa Blanca en el calendario real. La política estadounidense sigue el registro en lugar de los dados, y sus aliados pueden planear alrededor de él."
 RULE_GOD_OF_WAR: "Mod de Dios de la Guerra"
 RULE_GOD_OF_WAR_NO: "Desactivado"
 RULE_GOD_OF_WAR_YES: "Activado"
 RULE_GOD_OF_WAR_NO_DESC: "La IA utilizará la configuración predeterminada"
 RULE_GOD_OF_WAR_YES_DESC: "La IA utilizará plantillas avanzadas y algunos trucos."
 RULE_OPTION_ALL_AHEAD_SLOW: "Todo adelante, lento"
 RULE_OPTION_ALL_AHEAD_SLOW_AI_DESC: "Habilite esta regla de juego para garantizar que la IA no implosione a los EE. UU. Esencialmente, elimina el factor RNG del modo de IA no histórico."
 RULE_OPTION_SECOND_COAL_WARS: "Las segundas guerras del carbón"
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC: "Los Estados Libres rechazan el reavivamiento §8Los Trabajadores de las Minas Unidos§! cualquier reapertura de los pozos de Virginia Occidental, y los disturbios de los campos de carbón y declaran independiente al Estado. Una segunda guerra de carbón abre un frente en los Appalachians §R y este camino sólo existe si la regla de Estados Unidos se establece para Post United Era o The Great Collapse§!."
 NEN_AI_BEHAVIOR: "@NEN Nueva Inglaterra"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION: "Rebelión de la Montaña Verde"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC: "El gobierno nacional rechaza la demanda de Vermont de trasladar el puesto de gobierno a Montpelier y permite construir el resentimiento. §8Green Mountain§! los condados se levantan, y Nueva Inglaterra tiene que derribar una rebelión en uno de sus estados §Ry este camino sólo existe si la regla de los Estados Unidos se establece para Post United Era o El Gran Colapso§!."
 RULE_OPTION_THE_OTHER_NEW_CAPITAL: "La otra nueva capital"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC: "Pocos en el cuidado de la capital lo suficiente como para luchar por una dirección, así que el gobierno concede la demanda de Vermont y se traslada a Montpelier. Nueva Inglaterra no gasta nada en la disputa y mantiene su contenido de los estados del norte §R y este camino sólo existe si el gobierno de Estados Unidos está establecido para Post United Era o The Great Collapse§!."
 RULE_ALLOW_CONDITIONAL_PEACE_DEAL: "Permitir acuerdos de paz condicionales"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC: "Permitirá a los estados en guerra utilizar los §YAcuerdos de Paz Condicionales§!, una acción diplomática predefinida que permitirá a los estados firmar acuerdos de paz que no requieran que ninguna de las partes capitule completamente."
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC: "Prohíbe a los estados utilizar los §YAcuerdos de Paz Condicionales§!, acciones diplomáticas preconcebidas que obligarán a los estados a soportar una guerra total para alcanzar un estado de paz."
 RULE_PEACE_PROPOSAL_BLOCKED_TT: "Mientras que §YAcuerdos de Paz Condicionales§! estén habilitados esto se bloqueará, en cambio, use §Y$CPD_OFFER_CONDITIONAL_PEACE_TITLE$§!"
 RULE_ALLOW_WORLD_WAR: "La Segunda Guerra Mundial Ferroviaria"
 RULE_ALLOW_ENABLE_WORLD_WAR: "Habilitar la guerra mundial ferroviaria"
 RULE_ALLOW_ENABLE_WORLD_WAR_YES_DESC: "Esta opción restringirá los elementos sandbox de Millennium Dawn y empujará al mundo a una Guerra Mundial en un año determinado, de manera similar a otros mods.\n\nSe recomienda encarecidamente que juegues en modo histórico y desactives la opción 'Guerras de deuda de IA'"
 RULE_ALLOW_ENABLE_WORLD_WAR_NO: "Desactivar la Guerra Mundial por Ferrocarril"
 RULE_ALLOW_ENABLE_WORLD_WAR_NO_DESC: "Millennium Dawn permanecerá en su forma convencional, un mod sandbox."
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK: "Habilitar el bloqueo de quiebra de inversiones"
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_NO_DESC: "Puedes enviar inversiones a países mientras tengas activa la misión “Bankruptcy Incoming”"
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_YES_DESC: "Ya no puedes enviar inversiones a países mientras tengas activa la misión \"Quiebra Entrante\""
 RULE_SYRIA_ARAB_SPRING_CHOICE_DEFAULT_DESC: "Siria evaluará la opción de la Primavera Árabe con normalidad."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_CIVIL_WAR_DESC: "Siria se asegurará de tomar sus propias decisiones si la Primavera Árabe surge y fuerza una guerra civil histórica."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_ISIS_SPAWN_DESC: "Siria siempre tomará las decisiones durante la Primavera Árabe para garantizar el surgimiento del Estado Islámico (ISIS). Esto también garantiza el estallido de una guerra civil histórica."
 RULE_SYRIA_ARAB_SPRING_CHOICE: "La elección del comportamiento de Siria durante la Primavera Árabe"
 RULE_HISTORIC_EVENTS: "Desencadenantes de eventos históricos"
 RULE_HISTORIC_EVENTS_NO: "Los eventos históricos se activarán aleatoriamente. Esta es la configuración normal del juego."
 RULE_HISTORIC_EVENTS_YES: "Los eventos históricos no se activarán aleatoriamente. La mayoría de los eventos seguirán activándose aleatoriamente; sin embargo, se garantizará que algunos se activen dentro del mes de su fecha histórica para reducir la posibilidad de retrasos significativos. Esto no significa que tendrás un juego perfectamente histórico. Simplemente ayuda a encaminarlo hacia una dirección histórica."
 RULE_ALLOW_MD_ANNEX: "Habilitar la limpieza de Border Gore"
 RULE_OPTION_MD_ANNEX_NO_DESC: "No habrá ningún efecto sobre las fronteras posteriores a la paz, y permanecerán tal como fueron definidas en la conferencia."
 RULE_OPTION_MD_ANNEX_YES_DESC: "Después de un acuerdo de paz, si existen múltiples instancias de la misma etiqueta, todas las etiquetas restantes se integrarán en la que tiene el overlord más poderoso. La fuerza de los señores será determinada por su espíritu nacional de rango de poder. La limpieza después de una guerra puede tomar hasta 14 días para tener lugar."
 RULE_DISABLE_CSTO: "Desactivar CSTO"
 RULE_YES_DISABLE_CSTO_DESC: "CSTO se desactivará al cargar el juego."
 RULE_NO_DISABLE_CSTO_DESC: "La OTSC seguirá siendo una facción."
 RULE_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR: "Desactivar la Guerra Civil de la Hermandad Musulmana"
 RULE_YES_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "La guerra civil de los Hermanos Musulmanes será desactivada."
 RULE_NO_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "Se permitirá la guerra civil de la Hermandad Musulmana."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_CIVIL_WAR: "Guerra civil histórica de Siria"
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_ISIS_SPAWN: "Engendro de ISIS"
 RULE_OPTION_SWE_PRO_WESTERN: "Irse para el otro lado"
 RULE_OPTION_SWE_PRO_WESTERN_AI_DESC: "Suecia abandona dos siglos de no alineación y ocupa su lugar en la OTAN y en el centro de la Unión Europea. El Báltico se convierte en un mar aliado, y Rusia encuentra sus enfoques norteños cerrados."
 RULE_OPTION_SWE_RED_SWEDEN: "República Sueca"
 RULE_OPTION_SWE_RED_SWEDEN_AI_DESC: "La izquierda sueca lleva a la Riksdag hacia fuera, elimina la monarquía y declara una república. El estado de bienestar es empujado más allá de la socialdemocracia a la propiedad pública, y Suecia deja de ser el modelo neutral de cualquiera."
 RULE_DISABLE_AI_INFLUENCE_PUPPETING: "Desactivar el uso de marionetas de influencia de IA"
 RULE_YES_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "La IA no podrá controlar a otras naciones a través del sistema de influencia."
 RULE_NO_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "La IA podrá controlar a otras naciones a través del sistema de influencia."
 RULE_ALLOW_MP_ENHANCEMENTS: "Mejoras de MP"
 RULE_NOT_ALLOW_MP_ENHANCEMENTS_DESC: "No permitirá que los mecánicos MP aceleren el juego. No se recomienda para Singleplayer."
 RULE_ALLOW_MP_ENHANCEMENTS_DESC: "Permitir que los mecánicos MP aceleren el juego. También permite que cada país cree facciones, superando el requisito de Power Ranking."
 RULE_DISABLE_WESTERN_OUTLOOK_FEATURES: "Desactivar las funciones de influencia agresiva para la perspectiva occidental"
 RULE_YES_DISABLE_WESTERN_OUTLOOK_FEATURES: "Desactiva funciones occidentales agresivas como golpe de influencia o títere de influencia."
 RULE_INTERNAL_FACTION_COST_REDUCTION: "Reducción de costos de facción interna"
 RULE_DISABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "Los costos para cambiar de facciones internas serán los costos predeterminados."
 RULE_ENABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "Se reducirán los costos para cambiar de facciones internas, lo que permitirá a todas las naciones (a menos que tengan contenido expreso que lo impida).§RSi te encuentras con focos rotos o lo que sea, es tu problema.§!"
 RULE_OPTION_EU_ONE: "1 día"
 RULE_OPTION_EU_ONE_DESC: "§RPara fines de prueba.§! El período de espera para las votaciones del Parlamento Europeo y del Consejo Europeo se establecerá en un día en lugar de los ciento ochenta días predeterminados."
 RULE_ALLOW_FORCING_A_WHITE_PEACE: "Permitir imponer la paz"
 RULE_YES_FORCING_A_WHITE_PEACE: "Le permite imponer una paz blanca en una nación que está en una guerra ofensiva."
 RULE_NO_FORCING_A_WHITE_PEACE: "No permite imponer una paz blanca en una nación que está en una guerra ofensiva."
 RULE_OPTION_IF_POINT_00: "0.00 Opinión Mensual"
 RULE_OPTION_IF_POINT_00_DESC: "La tasa de ticks mensuales de la opinión de la §YFacción interna§! se establecerá en 0,00 en lugar del valor predeterminado de 0,50. Los logros personalizados de Millennium Dawn se desactivarán con esta configuración."
 RULE_ENABLE_ENERGY_LOAD_SHARING: "Habilitar el uso Compartido de la Carga de Energía"
 RULE_ENABLE_ENERGY_LOAD_SHARING_DESC: "Permite que el Sistema de Reparto de Carga Energética compre y venda energía de naciones cercanas cuando existe un déficit energético."
 RULE_DISABLE_ENERGY_LOAD_SHARING_DESC: "Desactiva el Sistema de Reparto de Carga de Energía para comprar y vender energía de naciones cercanas cuando hay un déficit energético."
 RULE_INCOME_FROM_ENERGY_LOAD_SHARING: "Ingresos por Reparto de Carga Energía"
 RULE_OPTION_ELS_POINT_10: "$0,10 por GW"
 RULE_OPTION_ELS_POINT_10_DESC: "El precio por GW se fijará en $0.10 por GW."
 RULE_OPTION_ELS_POINT_25: "$0.25 por GW"
 RULE_OPTION_ELS_POINT_25_DESC: "El precio por GW se fijará en $0.25 por GW."
 RULE_OPTION_ELS_POINT_50: "$0.50 por GW"
 RULE_OPTION_ELS_POINT_50_DESC: "El precio por GW se fijará en $0.50 por GW."
 RULE_OPTION_ELS_POINT_75: "$0.75 por GW"
 RULE_OPTION_ELS_POINT_75_DESC: "El precio por GW se fijará en $0.75 por GW."
 RULE_OPTION_COM_WARRIOR_KING: "El Rey Guerrero"
 RULE_OPTION_COM_WARRIOR_KING_DESC: "Robert Denard vuelve a las islas una última vez y la Guardia Presidencial §8§! le da el palacio sin un disparo. Comoras deja de ser un país con un ejército y se convierte en un ejército con bandera para alquilar, vendiendo sus mercenarios a través de África."
 RULE_OPTION_COM_MILITARY_DICTATORSHIP: "El Coronel se queda"
 RULE_OPTION_COM_MILITARY_DICTATORSHIP_DESC: "Azali mantiene la presidencia que tomó en uniforme, hace retroceder las islas bajo Moroni y deja morir la rotación antes de llegar a cualquier otro. Comoras se aleja de la órbita francesa y mira a Beijing y a la Unión Africana para el reconocimiento que París ya no ofrece."
 RULE_INVEST_DEFAULT_GAIN_1_5: "1.5%"
 RULE_INVEST_DEFAULT_GAIN_1_5_DESC: "La opción predeterminada. 1,5 % de influencia obtenida cada vez que alguien acepta sus inversiones."
 SOL_AI_BEHAVIOR: "Islas Salomón @SOL"
 RULE_OPTION_SOL_DYNAMIC: "Comportamiento Dinámico"
 RULE_OPTION_SOL_DYNAMIC_AI_DESC: "Las Islas Salomón toma sus indicaciones de las condiciones que encuentra, sopesando quién lo está juzgando, cómo se comportan las provincias y si la historia se está ejecutando al guión. No hay dos juegos que envíen Honiara por la misma carretera."
 RULE_OPTION_AUSTRALIAN_PEACE: "Intervención y Amnistía"
 RULE_OPTION_AUSTRALIAN_PEACE_AI_DESC: "Las Islas Salomón @SOL impulsarán un proceso de paz con el apoyo de su mayor influencia.\nNOTA: @AST Australia es la mayor influencia de las Islas Salomón @SOL al inicio del juego."
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP: "Fracasa el Comunicado de Abril - Golpe Rasta"
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP_AI_DESC: "Bartolomé Ulufa'alu no entrega los Acuerdos de Munda, los §8Isatabu Freedom Movement§! regresa a la guerra, y §8Fuerza de Águila de Malaita§! Las islas pasan a un comandante de la milicia, y Australia encuentra un estado armado fallido en sus enfoques norteños."
 RULE_OPTION_AST_REJECTS_TEE_REBEL: "El golpe de Te'e"
 RULE_OPTION_AST_REJECTS_TEE_REBEL_AI_DESC: "Ningún poder regional interviene, y Andrew Te'e toma el mando del §8Isatabu Freedom Movement§! Las Islas Salomón caen en la guerra civil, y los colonos malaitanos de Guadalcanal son expulsados al por mayor."
 RULE_DISABLE_GDP_GRAPH: "Desactivar el Gráfico del PIB"
 RULE_NO_RULE_DISABLE_GDP_GRAPH_DESC: "Habilita el Sistema de Gráficos del PIB"
 RULE_YES_RULE_DISABLE_GDP_GRAPH_DESC: "Desactiva el sistema de gráficos del PIB. Esto puede mejorar el rendimiento en equipos de gama baja."
 RULE_ENABLE_AI_USING_ATTACHES: "Habilitar la IA usar §YAgregado§!"
 RULE_ENABLE_AI_USING_ATTACHES_YES_DESC: "Permite a la IA permitirles usar §YAgregado§! a través de acciones diplomáticas"
 RULE_ENABLE_AI_USING_ATTACHES_NO_DESC: "Desactivar la IA del uso de §YAgregado§! mediante acciones diplomáticas"
 RULE_OPTION_THE_GREAT_REBELLION: "La Gran Rebelión"
 RULE_OPTION_THE_GREAT_REBELLION_AI_DESC: "Los grupos de interés de Rival separan el país mientras que el electorado pierde interés en detenerlos, y un conteo impugnado con márgenes imposiblemente estrechos finalmente rompe la fe del público en el resultado. Estados Unidos cae en una rebelión abierta sobre una elección que nadie aceptará."
 RULE_FUTURISTIC_SPECIAL_PROJECTS: "Proyecto especial futurista"
 RULE_ALLOWED_DISABLE_FUTURISTIC_SPECIAL_PROJECTS_DESC: "Todos los Proyectos Especiales estarán disponibles para Investigación"
 RULE_OPTION_DISABLED: "Disabled"
 RULE_DISABLE_DISABLED_FUTURISTIC_SPECIAL_PROJECTS_DESC: "Proyecto Especial futurista no estará disponible"
 MD_CUSTOM_SCENARIO_RULES: "Escenarios personalizados"
 RULE_EVENT_HORIZON_SCENARIO: "Evento Horizonte Escenario"
 RULE_EVENT_HORIZON_DEFAULT: "Deactivated"
 RULE_EVENT_HORIZON_DEFAULT_DESC: "El Escenario Horizon Evento no estará activo."
 RULE_EVENT_HORIZON_BLITZ: "Blitz - 2001"
 RULE_EVENT_HORIZON_BLITZ_DESC: "El Evento Horizon Escenario comenzará en 2001.\n\n§HNOTA:§! Una vez que los Megacountries para la forma §Y Horizon§! perderán su árbol de enfoque actual y será reemplazado por el árbol de enfoque específico del escenario."
 RULE_EVENT_HORIZON_CASUAL: "Casual - 2012"
 RULE_EVENT_HORIZON_CASUAL_DESC: "El Evento Horizon Escenario comenzará en 2012.\n\n§HNOTA:§! Una vez que los Megacountries para la forma §Y Horizon§! perderán su árbol de enfoque actual y será reemplazado por el árbol de enfoque específico del escenario."
 RULE_EVENT_HORIZON_DELAYED: "Delayed - 2020"
 RULE_EVENT_HORIZON_DELAYED_DESC: "El Evento Horizon Escenario comenzará en 2020.\n\n§HNOTA:§! Una vez que los Megacountries para la forma §Y Horizon§! perderán su árbol de enfoque actual y será reemplazado por el árbol de enfoque específico del escenario."
 RULE_AI_EU_END_GAME_PATHS: "Habilitar las rutas finales de juego AI EU"
 RULE_AI_YES_EU_END_GAME_PATHS: "Se permite que la AI siga los caminos finales de la Unión Europea como la Federación Europea o los Estados Unidos de Europa."
 RULE_AI_NO_EU_END_GAME_PATHS: "La AI no está permitida seguir las rutas finales de la Unión Europea como la Federación Europea o los Estados Unidos de Europa."
 GRN_AI_BEHAVIOR: "@GRN Greenland"
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY: "Scandinavian Serenity"
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY: "Hegemonía continental"
 RULE_DISABLE_COUP_CONTEST: "Concurso de Coup deshabilitado Evento"
 RULE_YES_DISABLE_COUP_CONTEST_DESC: "§RDeshabilita§! la cadena de eventos del concurso §H §!. Los principales influencers extranjeros §R no§! recibirán notificaciones o opciones para responder cuando un golpe sucede en un país en el que se invierten. Use esto si desea que la IA evite el aumento de los conflictos indirectos."
 RULE_NO_DISABLE_COUP_CONTEST_DESC: "§GPermite§! la cadena de eventos del concurso §H §!. Cuando un golpe tiene éxito en un país, los mayores influencers extranjeros (y el 2.º mayor si supera §H20%§!) son notificados y obtienen una opción de cómo responder: denunciar, sancionar, respaldar a la oposición o intervenir militarmente. Las guerras civiles tras un golpe de estado también desencadenan un evento coincidente para apoyar al viejo régimen."
 RULE_REMOVE_MICRO_STATES_TINY: "Pequeñas Naciones (Microstates)"
 RULE_REMOVE_MICRO_STATES_TINY_DESC: "Elimina sólo las naciones más pequeñas absolutas (Mónaco, San Marino, etc.) y las naciones insulares del Caribe."
 RULE_REMOVE_MICRO_STATES_SMALLER: "Naciones Unidas más pequeñas"
 RULE_REMOVE_MICRO_STATES_SMALLER_DESC: "Quita pequeñas naciones más pequeñas como Bhután, Gambia y Djibouti."
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT: "Eliminación ampliada"
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT_DESC: "Elimina a todas las naciones más pequeñas y otras naciones como Laos, Suriname y Guyana para obtener el máximo rendimiento."
 RULE_ENABLE_RESOURCE_STORAGE_SYSTEM: "Activar §YResource Storage System§!"
 RULE_OPTION_ENABLE_RESOURCE_STORAGE_SYSTEM: "Permite el §YResource Storage System§! que le permite almacenar materias primas. Desactiva esto si estás viendo una gran cantidad de retraso por día. No perderás nada sustancial aquí."
 RULE_OPTION_DISABLE_RESOURCE_STORAGE_SYSTEM: "Deshabilita el §YResource Storage System§! que le permite almacenar materias primas."
 RULE_CARRIER_ONLY_RAIDS: "Permitir a los transportistas de aeronaves sólo raids"
 RULE_CARRIER_ONLY_RAIDS_NO: "Deshabilitación del portaaviones sólo redadas. Esto no afecta la capacidad de utilizar las incursiones del portaaviones, pero si con frecuencia tiene problemas con el aire transportista donde se mueven desde el portaaviones hasta las bases aéreas."
 RULE_CARRIER_ONLY_RAIDS_YES: "Permite que el portaaviones sólo redadas. Este es un duplicado de las otras incursiones que permiten el portaaviones sólo puntos de lanzamiento."
 RULE_RAID_DOCTRINE_REACH: "Forzar la Doctrina Alcance sobre los Raids"
 RULE_RAID_DOCTRINE_REACH_NO: "Desactiva el control de la intervención-doctrina en las redadas. Los jugadores (y la AI) pueden preparar redadas contra cualquier objetivo visible independientemente de la doctrina política exterior. Aún se aplican controles de guerra, opinión y facción."
 RULE_RAID_DOCTRINE_REACH_YES: "Comportamiento por defecto. Las doctrinas de la intervención restringen el ataque: §YEl islamismo§! no puede atacar la paz, §Y La seguridad local§! no puede allanar la paz §Y El intervencionismo oprimido§! requiere vecinos, y §Y el intervencionismo regional§! requiere objetivos del mismo continente. La guerra siempre pasa por alto esto."
 RULE_ALLOW_CPD_AI_OFFERS: "Permitir AI Ofertas de Paz condicional"
 RULE_OPTION_CPD_AI_OFFERS_YES_DESC: "Permitirá que los estados de AI en guerra evalúen periódicamente los conflictos en curso y propongan §YConditional Peace Deals§! cuando determinen que la guerra es invencible o estancada. Overlords también negociará en nombre de sujetos restringidos."
 RULE_OPTION_CPD_AI_OFFERS_NO_DESC: "Bares AI declara iniciar §YConditional Peace Deals§! por su cuenta. Los jugadores todavía pueden proponer ofertas manualmente a través de la acción diplomática."
 RULE_EU_EXPANSION_FOCUS: "EU Behavior"
 RULE_EU_EXP_NO: "Default"
 RULE_EU_EXP_NO_DESC: "Default EU behavior"
 RULE_EU_EXP_YES: "Expansión Enfoque"
 RULE_EU_EXP_YES_DESC: "La UE priorizará las leyes de ampliación"
 RULE_FREE_FACTORIES_AMOUNT: "Factores gratis para los jugadores"
 RULE_FREE_FACTORIES_AMOUNT_OFF: "Fuera."
 RULE_FREE_FACTORIES_AMOUNT_OFF_DESC: "Los jugadores no reciben fábricas gratuitas al comienzo del juego."
 RULE_FREE_FACTORIES_AMOUNT_ONE: "1 civil + 1 militar"
 RULE_FREE_FACTORIES_AMOUNT_ONE_DESC: "Cada jugador humano recibe 1 fuera de sitio civil y 1 fábrica militar fuera del lugar al comienzo del juego."
 RULE_FREE_FACTORIES_AMOUNT_TWO: "2 civiles + 2 militares"
 RULE_FREE_FACTORIES_AMOUNT_TWO_DESC: "Cada jugador humano recibe 2 fábricas civiles fuera de sitio y 2 fábricas militares fuera del lugar al comienzo del juego."
 RULE_FREE_FACTORIES_AMOUNT_THREE: "3 civiles + 3 militares"
 RULE_FREE_FACTORIES_AMOUNT_THREE_DESC: "Cada jugador humano recibe 3 fábricas civiles fuera de sitio y 3 fábricas militares fuera del lugar al comienzo del juego."
 RULE_FREE_FACTORIES_AMOUNT_FIVE: "5 civiles + 5 militares"
 RULE_FREE_FACTORIES_AMOUNT_FIVE_DESC: "Cada jugador humano recibe 5 fábricas civiles fuera de sitio y 5 fábricas militares fuera del lugar al comienzo del juego."
 RULE_OPTION_DEN_EUROSCEPTIC: "Fuera de la Unión"
 RULE_OPTION_DEN_SOCIALIST: "La bandera roja sobre Christiansborg"
 RULE_OPTION_DEN_MONARCHIST: "La Corona Restaurada"
 RULE_OPTION_DEN_NATIONALIST: "Dinamarca para los daneses"
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES: "El Centro Cristiano"
 RULE_OPTION_NRY_PROGRESS: "Noruega para los noruegos"
 RULE_OPTION_MNT_SERBIAN_UNION: "Nacionalismo serbio"
 RULE_OPTION_MNT_SERBIAN_UNION_DESC: "§8Los partidos nacionalistas serbios§! ascienden al poder, elevan la cultura serbia y la autoridad de la Iglesia Ortodoxa, y alinean económica y políticamente a Montenegro con Serbia y Rusia. La trayectoria de Montenegro culmina en la unión política con Serbia, revertiendo la independencia alcanzada una generación antes."
 RULE_OPTION_MNT_NEUTRAL_HARBOUR: "Neutralidad armada"
 RULE_OPTION_MNT_NEUTRAL_HARBOUR_DESC: "El gobierno de Đukanović rechaza tanto la integración de la UE/OTAN como la alineación serbia y rusa, en lugar de declarar neutralidad armada permanente en el modelo suizo. El puerto libre de Montenegro se convierte en un puesto comercial abierto a todos los bloques, explotando su posición estratégica Adriática para obtener la máxima ventaja comercial."
 SWI_NATO_EU: "Integración euroatlántica"
 SWI_NATO_EU_DESC: "Suiza abandonará la neutralidad, se unirá a la OTAN y perseguirá la candidatura de la Unión Europea. Si la OTAN no existe, se mantendrá sola y disolverá la federación."
 SWI_NEUTRAL: "Neutralidad armada"
 SWI_NEUTRAL_DESC: "Suiza mantiene su neutralidad armada y se queda fuera de todas las alianzas ofrecidas. Bern negocia con todos los bandos y corredores entre ellos, y se niega a ser contado en la columna de cualquiera."
 RULE_FICTIONAL_CONTENT: "Ficcional & Meme Content"
 RULE_FICTIONAL_CONTENT_NO_DESC: "§YDefault§!. El chiste y el contenido no histórico se mantiene deshabilitado, incluyendo Liechtenstein comprando Alaska y restaurando el Imperio Romano Santo, Sur Ossetia reviviendo Scythia, Tesak llegando al poder en Cuba, el evento aleatorio ocasionalmente absurdo, y los diversos huevos del estero dispersados por el mod."
 RULE_FICTIONAL_CONTENT_YES_DESC: "Permite bromear y contenido no histórico, incluyendo Liechtenstein comprando Alaska y restaurando el Imperio Romano Santo, Ossetia del Sur reviviendo Scythia, Tesak llegando al poder en Cuba, el evento aleatorio ocasionalmente absurdo, y los diversos huevos de estero dispersos por todo el mod."
 RULE_PLAYER_INSTANT_JUSTIFICATION: "Justificación instantánea de los objetivos de guerra (sólo los jugadores)"
 RULE_YES_PLAYER_INSTANT_JUSTIFICATION_DESC: "Cada jugador humano comienza con el §YCaso para la Guerra§! espíritu nacional, otorgando §G-100%§! justificar el tiempo de la meta de guerra. La AI no la recibe."
 RULE_NO_PLAYER_INSTANT_JUSTIFICATION_DESC: "Los objetivos de guerra toman su tiempo normal para justificar a todos."
 RULE_OPTION_JAP_HISTORICAL: "Histórico"
 BOS_AI_BEHAVIOR: "@BOS Bosnia y Herzegovina"
 SIA_AI_BEHAVIOR: "@SIA Thailand"
 RULE_OPTION_SIA_DEFAULT_AI_DESC: "§8Thai Rak Thai§! y sus sucesores dominan la urna mientras los demócratas y el palacio las disputan, y los generales toman al gobierno cuando los tribunales no lo hacen. Tailandia mantiene un aliado convencional de Washington sin liderar nada, y deja sus viejas afirmaciones irredentistas donde están."
 RULE_OPTION_SIA_PAN_THAI: "Pan-Thai (Gran Tailandia)"
 RULE_OPTION_SIA_PAN_THAI_AI_DESC: "Tailandia reorganiza y presiona las afirmaciones que dejó en los estados de Laos, Camboya y el norte de Malay. Bangkok se convierte en el hegemon de Asia sudoriental continental, y sus vecinos arman en consecuencia."
 RULE_OPTION_SIA_SEATO_LEADER: "SEATO Líder"
 RULE_OPTION_SIA_SEATO_LEADER_AI_DESC: "Tailandia reconstruye §8SEATO§! y reúne al sudeste asiático en un pacto de defensa dirigido desde Bangkok en lugar de desde Washington. La región tiene una orden de seguridad propia, y los grandes poderes tienen que lidiar con ella como un bloque."
 RULE_OPTION_SIA_ALT_HISTORY: "Alt-History"
 RULE_OPTION_SIA_ALT_HISTORY_AI_DESC: "Tailandia toma el camino comunista, alejándose de Washington y Occidente. No perseguirá las afirmaciones irredentistas o se encuentra SEATO."
 RULE_AFG_TALIBAN_INSURGENCY_INTENSITY: "@AFG Insurgencia talibán"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT: "Histórico"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT_DESC: "La insurgencia talibana crece y se desvanece a su ritmo normal."
 RULE_AFG_TALIBAN_INSURGENCY_WEAK: "Contained"
 RULE_AFG_TALIBAN_INSURGENCY_WEAK_DESC: "Los talibanes reconstruían la mitad tan rápido. Pegatinas de trabajo contra la insurgencia, y Afganistán puede sellar realistamente la insurgencia."
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS: "Inquieto"
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS_DESC: "Los talibanes reconstruyeron la mitad de nuevo tan rápido. Mantener el país unido se convierte en una campaña permanente en lugar de un problema que resuelvas una vez."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING: "@AFG Norte alianza levantamiento"
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_ALLOWED_DESC: "Si los talibanes ganan la guerra civil, la Alianza del Norte vuelve a subir unos meses más tarde bajo Ismail Khan o bajo Ahmad Massoud desde 2020."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_BLOCKED_DESC: "Una victoria talibán es definitiva. Ningún segundo frente se abre en el norte."
 RULE_OPTION_FRA_COMMUNE: "La Comuna Francesa"
 RULE_OPTION_FRA_COMMUNE_DESC: "El §8Parti Comunista Français§! y la izquierda radical rompen la Quinta República y proclaman la Comuna Francesa. Francia deja el campamento occidental para una línea revolucionaria que alarma a cada capital del continente."
 RULE_OPTION_FRA_KINGDOM: "El Reino de Francia"
 RULE_OPTION_FRA_KINGDOM_DESC: "Un golpe de Estado realista termina la República y corona a un demandante borbón o orleanista como rey de Francia. La monarquía restaurada da la espalda a Bruselas y revive viejas disputas con sus vecinos."
 RULE_OPTION_FRA_EMPIRE: "El Imperio Francés"
 RULE_OPTION_FRA_EMPIRE_DESC: "Un golpe bonapartista termina la República y proclama un nuevo Imperio francés. El Imperio persigue ambiciones continentales que lo pusieron contra Alemania y Gran Bretaña por igual."
 VEN_AI_BEHAVIOR: "@VEN Venezuela"
 RULE_VEN_CHAVISMO_CONTINUES: "El chavismo continúa"
 RULE_VEN_CHAVISMO_CONTINUES_DESC: "El socialismo bolivariano continúa bajo el §8Partido Socialista Unido§!, con las misiones financiadas y la industria petrolera firmemente en manos del Estado. Caracas mantiene la banca del proyecto bolivariana en toda América Latina, y Washington sigue tratandolo como un problema."
 RULE_VEN_OPPOSITION_STATIST: "Oposición, Modelo Monopolist"
 RULE_VEN_OPPOSITION_STATIST_DESC: "La oposición democrática toma el poder pero deja las alturas dominantes y la petrolera estatal exactamente donde están. Venezuela cambia su gobierno sin cambiar su economía, y las alineaciones de la región apenas se mueven."
 RULE_VEN_OPPOSITION_LIBERTARIAN: "Oposición, modelo de marca libre"
 RULE_VEN_OPPOSITION_LIBERTARIAN_DESC: "La oposición democrática toma el poder y abre la economía al capital extranjero y nacional mediante una desregulación y privatización radicales. Venezuela se une al orden económico occidental, y el bloque bolivariano pierde a su patrón de pago."
 RULE_VEN_MILITARY_JUNTA: "Junta Militar"
 RULE_VEN_MILITARY_JUNTA_DESC: "El cuerpo de oficiales toma el palacio y gobierna como un régimen nacionalista fuerte que no responde a nadie. Venezuela convierte a su ejército en el exterior, y sus vecinos descubren que comparten una frontera con un estado expansionista."
 ALG_AI_BEHAVIOR: "@ALG Algeria"
 RULE_OPTION_ALG_HISTORICAL: "Los Años Bouteflika"
 RULE_OPTION_ALG_HISTORICAL_DESC: "La presidencia cierra el Decenio Negro sobre una amnistía y reúne al §8 Frente Nacional de Liberación§! y sus aliados detrás de él, hasta que las marchas §8Hirak§! obliguen al viejo. Argelia sigue siendo un pilar de la diplomacia árabe y africana, mientras que los generales mantienen la última palabra en casa."
 RULE_OPTION_ALG_LE_POUVOIR: "Le Pouvoir Endures"
 RULE_OPTION_ALG_LE_POUVOIR_DESC: "La presidencia nunca se libera de los generales, y §8le pouvoir§! responde al §8Hirak§! con arrestos en lugar de reforma. Argelia mantiene una fachada civil mientras que el establecimiento de seguridad decide todo lo que hay detrás."
 RULE_OPTION_ALG_HIRAK_DEMOCRACY: "El Hirak Prevails"
 RULE_OPTION_ALG_HIRAK_DEMOCRACY_DESC: "Las marchas semanales no se detienen en la presidencia, y el §8Hirak§! rompe los oligarcas y desmantelas le pouvoir. Argelia escribe una constitución verdaderamente civil y se convierte en la primera democracia real del Magreb."
 RULE_OPTION_ALG_MILITARY_JUNTA: "Los Generales se apoderan"
 RULE_OPTION_ALG_MILITARY_JUNTA_DESC: "El §8Armée nationale populaire§! termina la pretensión, suspende la constitución y gobierna abiertamente Argelia. El país gira hacia adentro, y sus vecinos encuentran un estado de guarnición en su frontera."
 RULE_OPTION_ALG_ISLAMIST: "Islamist Algeria"
 RULE_OPTION_ALG_ISLAMIST_DESC: "El §8Movimiento de la Sociedad por la Paz§! y §8Ennahda§! ganan en la urna más que en las maquinas, y construyen una república islámica a través del parlamento, los tribunales y la mezquita. Argelia se convierte en la voz del islam político a través del norte de África."
 RULE_OPTION_ALG_FIS_UPRISING: "El Frente de Salvación regresa"
 RULE_OPTION_ALG_FIS_UPRISING_DESC: "El §8 Frente Islámico de Salvación§! nunca está contenido, y reclama la victoria electoral que el ejército le quitó. La Década Negra termina en los términos de los insurgentes, y Argelia se convierte en una base para el islamismo armado a través del Sahel."
 ETH_AI_BEHAVIOR: "@ETH Ethiopia"
 RULE_OPTION_ETH_HISTORICAL: "Histórico"
 RULE_OPTION_ETH_HISTORICAL_DESC: "Etiopía fortalece su República Democrática Federal mediante avances en materia de salud, educación y libertades religiosas. La coalición §8EPRDF§! mantiene la continuidad política al tiempo que profundiza el compromiso con la Unión Africana."
 RULE_OPTION_ETH_MONARCHIST_RESTORATION: "Regreso de la Corona"
 RULE_OPTION_ETH_MONARCHIST_RESTORATION_DESC: "Etiopía restaura el §8Crown Council of Ethiopia§! e invita a Zera Yacob Amha Selassie al trono. El poder imperial se reafirma como el papel del parlamento disminuye y una reclamación sobre Eritrea es revivida."
 RULE_CORPORATE_HISTORY: "Historia corporativa"
 RULE_CORPORATE_HISTORY_FULL: "Completo"
 RULE_CORPORATE_HISTORY_FULL_DESC: "La Historia Corporativa presenta opciones de la industria autorizadas en sus hitos históricos. Este es el ajuste normal."
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY: "Resultado Sólo"
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY_DESC: "La Historia Corporativa aplica la ruta histórica y sus efectos nacionales persistentes en silencio, sin mostrar sus opciones de eventos o otorgar sus recompensas únicas."
 RULE_CORPORATE_HISTORY_OFF: "Fuera."
 RULE_CORPORATE_HISTORY_OFF_DESC: "La Historia Corporativa no crea ningún estado y no programa eventos. El contenido de los países nativos sigue sin modificarse."
 RULE_OPTION_ARM_PEOPLES_PARTY: "El Partido Popular devuelve"
 RULE_OPTION_HOL_HISTORICAL: "Histórico"
 RULE_OPTION_HOL_HISTORICAL_DESC: "§8Labour§! entrega el país a los §8 Demócratas Cristianos §! después del choque de Fortuyn, los §8Liberales§! lo sostienen para una generación, y los §8Partido por la Libertad§! y §8Demócratas 66§! siguen a su vez. Los Países Bajos mantienen un ancla de la OTAN y la Unión Europea bajo cada una de esas coaliciones."
 RULE_OPTION_HOL_WESTERN_MONARCHY: "La Restauración de Orange"
 RULE_OPTION_HOL_WESTERN_MONARCHY_DESC: "Un stadtholderate restaurado gobierna a través de la Corona mientras que los §8Estados-General§! mantiene su control sobre el monedero, y el refundido §8West India Company§! lleva a los Países Bajos de vuelta al Atlántico. Suriname y Guyana regresan al gobierno holandés, el Caribe se trabaja a través de ayudas y embajadas, y Luxemburgo, Irlanda e Inglaterra están obligados a la Casa de Orange por unión personal."
 RULE_OPTION_HOL_NATIONALIST_MONARCHY: "El Militant de la Corona"
 RULE_OPTION_HOL_NATIONALIST_MONARCHY_DESC: "Se restablece la prerrogativa real, se suspenden las elecciones y se reconstruye la §8Dutch East India Company§! como instrumento de conquista en todo el Océano Índico. Ceylán, Cabo y Batavia son tomados por la fuerza, y Luxemburgo, Irlanda e Inglaterra se entregan ultimátumes en vez de contratos matrimoniales."
 RULE_OPTION_HOL_NVU: "Nederlandse Volks-Unie"
 RULE_OPTION_HOL_NVU_DESC: "El §8Nederlandse Volks-Unie§! crece fuera de la franja, marcha en el Binnenhof y remaca la economía a lo largo de líneas corporatistas y autarcas con la oposición despejada. Dietsland está unificada y los Países Bajos reclaman el liderazgo de una Europa alemana contra Francia y Gran Bretaña."
 IND_AI_BEHAVIOR: "@IND Indonesia"
 RULE_OPTION_IND_HISTORICAL: "Histórico"
 RULE_OPTION_IND_HISTORICAL_DESC: "Indonesia consolida la república Reformasi detrás del §8Partido Nacional de Despertar§!, luchando contra el extremismo religioso y mediando el conflicto Maluku en lugar de elegir partes. Con base en las instituciones anticorrupción y la alineación occidental, Indonesia se convierte en un ancla democrático estable en el sudeste asiático."
 RULE_OPTION_IND_ISLAMIST: "An Islamic Indonesia"
 RULE_OPTION_IND_ISLAMIST_DESC: "La radicalización religiosa se ve descontrolada como el §8 Frente Islámico§! se moviliza desde el activismo callejero hasta la captura estatal. Indonesia se disuelve en una república de la sharia que presiona reivindicaciones territoriales e ideológicas contra sus vecinos y afirma dominar a través de su propio archipiélago."
 RULE_OPTION_MD_RANDOM_PATH: "Sendero aleatorio"
 RULE_OPTION_MD_RANDOM_PATH_DESC: "La AI dibuja uno de los caminos de este país al azar cuando el juego comienza, histórico o alternativo. El que dibujó permanece escondido de ti."
 RULE_OPTION_MD_NO_PATH: "No Sendero"
 RULE_OPTION_MD_NO_PATH_DESC: "La AI no sigue ningún camino guionado y elige sus focos libremente a medida que se desarrolla el juego. Su comportamiento cambia de correr a correr."
 RULE_OPTION_ITA_HISTORICAL: "Histórico"
 RULE_OPTION_ITA_HISTORICAL_DESC: "El poder se alterna entre el §8Partito Democrático§! y el bloque §8Forza Italia§!, e Italia permanece anclada en la OTAN y la Unión Europea. Sus gobiernos se dedican al crimen organizado, a la deuda pública, a la cuestión sur y a su propia administración en lugar de a las fronteras del país."
 RULE_OPTION_ITA_ROMAN_RESTORATION: "Restauración del Imperio Romano"
 RULE_OPTION_ITA_ROMAN_RESTORATION_DESC: "§8Fratelli d'Italia§! y la derecha nacional crecen hasta que llevan una elección, disuelven el parlamento y coronan un emperador sobre una Roma restaurada. Italia reclama entonces las antiguas provincias imperiales una por una, desde la costa africana hasta Britannia."
 RULE_OPTION_ITA_MARCH_ON_ROME: "A Segunda Marcha sobre Roma"
 RULE_OPTION_ITA_MARCH_ON_ROME_DESC: "El mismo movimiento toma el poder pero mantiene la república, instalando un gobierno §8fascista§! en Roma. Italia presiona sus afirmaciones irredentistas sobre el Adriático y los Alpes sin llegar al imperio."
 RULE_OPTION_ITA_EASTERN_TURN: "Gire al Este"
 RULE_OPTION_ITA_EASTERN_TURN_DESC: "§8Rifondazione Comunista§! y el §8Partito dei Comunisti Italiani§! reconstruir la izquierda italiana y sacar al país de la OTAN. Italia juzga Moscú y Beijing y busca un lugar en la Organización de Cooperación de Shanghai."
 RULE_OPTION_JAP_HISTORICAL_DESC: "Los §8Demócratas liberales§! mantienen la Dieta, la alianza con Washington sostiene, y las Fuerzas de Autodefensa se normalizan sólo en lo que un vecindario hostil los obliga a ser. Japón cancela sus malos préstamos, legisla contra el colapso de la tasa de natalidad y la crisis del karoshi, y deja el Artículo Nueve en pie."
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE: "El retorno del Imperio"
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE_DESC: "El §8Partido de Restauración§! crece del derecho nacionalista hasta que el trono sea restaurado al poder y el Artículo Nueve es eliminado. Japón está detrás de una flota de agua azul y reclama los Kurils, Corea, Taiwán y la antigua esfera en el Pacífico por la fuerza."
 RULE_OPTION_TUR_HISTORICAL: "Histórica AI"
 RULE_OPTION_TUR_HISTORICAL_DESC: "La crisis bancaria destruye el §8Partido Virtue§!, y el §8 Partido de la Justicia y el Desarrollo §! que se inclina desde él toma el país. Turquía recurre a la diplomacia neo-otomana en el Oriente Medio y los Balcanes mientras que la presidencia crece lentamente al Parlamento."
 RULE_OPTION_TUR_KEMALIST_GUARD: "Guardias de Kemalismo"
 RULE_OPTION_TUR_KEMALIST_GUARD_DESC: "Los islamistas están prohibidos antes de que puedan reagruparse y §8República secular§! Turquía permanece anclada a la OTAN y responde a la pregunta kurda con el ejército en vez de con la reforma."
 RULE_OPTION_TUR_GREY_WOLVES: "Los lobos grises"
 RULE_OPTION_TUR_GREY_WOLVES_DESC: "La derecha §8nacionalista§! gana la cámara, termina las elecciones y corona un sultán sobre un estado otomano restaurado. Turquía presiona sus afirmaciones a través de Thrace, el Cáucaso y el mundo turco."
 RULE_OPTION_TUR_HIZMET: "El movimiento Hizmet"
 RULE_OPTION_TUR_HIZMET_DESC: "La red §8Gülenist§! hereda los restos del Partido Virtud y toma el estado a través de las cortes, la policía y las escuelas en lugar de la urna electoral. Turquía proyecta un islam moderado en el extranjero mientras huye tranquilamente de sus propias instituciones."
 RULE_OPTION_TUR_TURKISH_LEFT: "Retorno de la izquierda turca"
 RULE_OPTION_TUR_TURKISH_LEFT_DESC: "El voto anti-establecimiento oscila a la izquierda §8revolucionaria§! en lugar de los islamistas. Turquía deja la OTAN, reconoce a sus minorías y se establece como una vanguardia antiimperialista en la región."
 RULE_OPTION_TUR_GREAT_EAST: "El Gran Oriente"
 RULE_OPTION_TUR_GREAT_EAST_DESC: "El Partido Virtud toma el poder, desactiva al Estado Mayor y luego se radicaliza en un movimiento §8Salafista§! que disuelve la república. Turquía proclama un califato y se expande en cada dirección que pueda alcanzar."
 RULE_OPTION_ENG_HISTORICAL: "Histórico"
 RULE_OPTION_ENG_HISTORICAL_DESC: "§8Labour§! gobierna bajo Blair y Brown antes de que los §8Conservadores §! tomen posesión y pasen el estreno por una línea de líderes, hasta que el Trabajo regrese bajo Starmer. Gran Bretaña deja la Unión Europea, mantiene la alianza estadounidense y mantiene a la Unión juntos."
 RULE_OPTION_ENG_RISE_OF_BRITAIN: "El Levántate de Gran Bretaña"
 RULE_OPTION_ENG_RISE_OF_BRITAIN_DESC: "Gran Bretaña mantiene una democracia parlamentaria y reconstruye el imperio comprando en lugar de conquistar, comprando la prensa, los partidos y los ministerios de sus antiguas colonias. Gobiernos del Caribe al Pacífico responden de nuevo a Londres sin que se le dispare."
 RULE_OPTION_CHI_HISTORICAL: "El Gran Rejuvenecimiento"
 RULE_OPTION_CHI_HISTORICAL_DESC: "El §8Camarilla de Shanghai§! entrega al Partido a §8Tuanpai§! y el Tuanpai a Xi Jinping, y la autonomía de Hong Kong se desmanteló a su vez. Beijing presiona sus afirmaciones en el Mar del Sur de China y a través del Estrecho sin ir a la guerra por ellos."
 RULE_OPTION_CHI_HEGEMON: "Restablecido el Reino Medio"
 RULE_OPTION_CHI_HEGEMON_DESC: "El modelo §8Chongqing§! lleva a Bo Xilai a la dirección y los §8Wolf Warriors§! se dejan fuera de la correa temprano. China asienta la frontera del Himalaya por la fuerza, lleva a Bhután, Nepal y la India a talar, y toma Taiwán por tormenta."
 RULE_OPTION_CHI_PEACEFUL_RISE: "Peace Rise"
 RULE_OPTION_CHI_PEACEFUL_RISE_DESC: "Zeng Qinghong hereda la máquina de Jiang y los tecnócratas §8Shanghai§! mantienen el rumbo de Deng. Un país, dos sistemas se honran, el Tíbet y Xinjiang se rigen por estatutos en lugar de campañas, y la reunificación se persigue en la mesa de negociación."
 RULE_OPTION_BHR_HISTORICAL: "La Carta de Al Khalifa"
 RULE_OPTION_BHR_HISTORICAL_DESC: "La corona compra la paz con una carta nacional y una cámara electa, luego rompe la §8Febrero 14 Coalición Juvenil§! con armadura saudí una vez que la rotonda se llena. Bahréin sigue siendo el puerto de la flota estadounidense y el cliente más confiable que Riyadh tiene."
 RULE_OPTION_BHR_DAY_OF_RAGE: "Día de la Rage"
 RULE_OPTION_BHR_DAY_OF_RAGE_DESC: "§8Al-Wefaq§! sostiene la rotonda hasta que la mayoría de los chiítas finalmente puede votar en el gobierno que siempre ha sido negado. Bahrein retira la monarquía para una república y responde a Teherán en lugar de Riad."
 RULE_OPTION_BHR_CROWNED_DEMOCRACY: "El Bargain Constitucional"
 RULE_OPTION_BHR_CROWNED_DEMOCRACY_DESC: "La corona legaliza §8Wa'ad§! y sus rivales y manos un parlamento genuino el negocio de gobernar, manteniendo el trono por encima del argumento en lugar de en él. Bahréin se convierte en la primera democracia trabajadora del Golfo sin salir nunca del campamento occidental."
 RULE_OPTION_BOT_HISTORICAL: "BDP Endures"
 RULE_OPTION_BOT_HISTORICAL_DESC: "El §8Partido Democrático Botswana§! da la presidencia de uno de sus propios a otro y gana cada elección que contrate, mientras que los ingresos de diamantes pagan por las escuelas, las clínicas y la lucha contra el SIDA. Botswana mantiene el éxito silencioso del continente, no alineado y solvente, y está dispuesta a decir en voz alta lo que sus vecinos no harán."
 RULE_OPTION_BOT_POLITICAL_RAINBOW: "La Umbrella abre"
 RULE_OPTION_BOT_POLITICAL_RAINBOW_DESC: "La oposición deja de dividir el voto y se reúne detrás del §8Umbrella for Democratic Change§!, rompiendo el agarre §8Botswana Partido Democrático§! Botswana tiene su primer cambio de gobierno, y el sur de África obtiene pruebas de que un partido de liberación puede ser expulsado."
 RULE_OPTION_BOT_KGOSIKGOLO: "Coronando el Kgosikgolo"
 RULE_OPTION_BOT_KGOSIKGOLO_DESC: "El §8Dikgosi§! convierte a la Cámara de los Jefes de una sala asesora en la sede del poder, y levanta a uno de ellos como jefe supremo sobre todo el país. Las elecciones dan paso a una monarquía tradicional, y la democracia modelo del continente se convierte en algo que sus vecinos ya no reconocen."
 BLR_AI_BEHAVIOR: "@BLR Belarus"
 RULE_OPTION_BLR_HISTORICAL: "El último dictador de Europa"
 RULE_OPTION_BLR_HISTORICAL_DESC: "Alexander Lukashenko encarcela a sus rivales, vincula la economía con el rublo y rompe los §8Jeans Revolution§! Bielorrusia mantiene el aliado más cercano de Moscú y el gobierno más aislado de Europa."
 RULE_OPTION_BLR_EUROPEAN_BELARUS: "European Belarus"
 RULE_OPTION_BLR_EUROPEAN_BELARUS_DESC: "Andrei Sannikov lleva la presidencia de la campaña §8Bielorrusia Europea§! y aleja al país del rublo y hacia Bruselas. Belarús se aplica a la OTAN y la Unión Europea, y Rusia pierde el terreno que contaba al oeste de Smolensk."
 RULE_OPTION_BLR_TIKHANOVSKAYA: "La revolución de Tikhanovskaya"
 RULE_OPTION_BLR_TIKHANOVSKAYA_DESC: "Lukashenko gobierna indiscutible para una generación, hasta que una elección robada pone a Svetlana Tikhanovskaya a la cabeza de un Consejo de Coordinación §8§! la policía antidisturbios no puede romper. Belarús se vuelve hacia el oeste mucho más tarde que sus vecinos, con divisiones rusas ya en la frontera."
 RULE_OPTION_BLR_POPULAR_FRONT: "El Renacimiento Nacional"
 RULE_OPTION_BLR_POPULAR_FRONT_DESC: "Zianon Pazniak lleva el §8Belarusian Popular Front§! en el poder sobre un programa de Bielorrusia, purgando oficiales soviéticos y reviviendo la memoria del Gran Ducado. Bielorrusia se convierte en Moscú y está en juego una reclamación sobre cada vecino que una vez respondió a Vilnius."
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS: "La Revuelta Nacional Bolchevique"
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS_DESC: "Los bolcheviques nacionales §8§! toman las calles y luego el Estado, reconstruyendo el orden soviético detrás de un ejército obrero y una milicia partidaria. Bielorrusia se arma contra Polonia, Ucrania y los Bálticos con la bendición de Moscú."
 RULE_OPTION_BLR_LITBEL: "El Revival de Litbel"
 RULE_OPTION_BLR_LITBEL_DESC: "El §8Partido Comunista de Belarús§! vuelve al poder y convierte a la antigua república lituana-belorusa en su proyecto fundador. Belarús devuelve a Lituania y Letonia en una unión socialista por influencia donde puede y por la fuerza donde no puede."
 RULE_OPTION_BLR_OLIGARCHY: "El Bargain del Oligarch"
 RULE_OPTION_BLR_OLIGARCHY_DESC: "Siarhiej Hajdukievič y el §8Partido Democrático Liberal§! comercializan la ideología de Lukashenko para una clase más franca de negocio, vendiendo acceso a Moscú al mejor precio que pueden obtener. Bielorrusia permanece en la órbita de Rusia pero trata al Estado de la Unión como un contrato más que un credo."
 RULE_OPTION_BOS_HISTORICAL: "La Orden Dayton"
 RULE_OPTION_BOS_HISTORICAL_DESC: "La presidencia rotatoria está bajo supervisión internacional, y el partido de acción democrática §8§! comparte al Estado con sus rivales serbios y croatas en lugar de golpearlos. Bosnia reconstruye detrás de la OTAN y el personal europeo de mantenimiento de la paz y los bordes hacia Bruselas sin nunca resolver lo que es el país."
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP: "Srpska ocupa la Presidencia"
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP_DESC: "El §8Alliance of Independent Social Democrats§! Gana la presidencia y gira Sarajevo hacia Belgrado y Moscú mientras deja intacta la federación. Bosnia sale de la órbita occidental por acuerdo en lugar de por la fuerza, y Rusia gana una segunda posición en los Balcanes."
 RULE_OPTION_BOS_SRPSKA_UNION: "Primera República Srpska"
 RULE_OPTION_BOS_SRPSKA_UNION_DESC: "El Partido Democrático §8Serb§! centraliza a todo el país bajo Banja Luka y negocia un sindicato con Serbia. Bosnia está doblada en un estado serbio mayor, y sus vecinos despiertan a un mapa redireccionado."
 RULE_OPTION_BOS_ISLAMIST_REVIVAL: "El despertar bosnio"
 RULE_OPTION_BOS_ISLAMIST_REVIVAL_DESC: "La queja bosniaca se endurece en un renacimiento religioso, y el despertar nacional §8§! vuelve a la república para terminar la guerra en sus propios términos. Bosnia envía al personal de mantenimiento de la paz a su casa y recurre a sus entidades y luego a sus vecinos."
 RULE_OPTION_BOS_WORKERS_STATE: "Los Consejos de los Trabajadores"
 RULE_OPTION_BOS_WORKERS_STATE_DESC: "El desempleo masivo conlleva §8Frente de Trabajadores§! pasados los partidos étnicos, y la industria de Bosnia pasa a los consejos del pueblo que lo personal. El estado se vuelve secular y autogestión, y no responde a Bruselas ni Belgrado."
 RULE_OPTION_BRA_HISTORICAL: "Los Años de Lula"
 RULE_OPTION_BRA_HISTORICAL_DESC: "El §8Partido obrero§! finalmente gana la presidencia y empareja transferencias en efectivo a los pobres con financiación ortodoxa, hasta que una investigación de corrupción hunde a la izquierda y entrega el palacio a un antiguo capitán del ejército. Brasil crece en una potencia media cortesana que discute con Washington sin dejar nunca su órbita."
 RULE_OPTION_BRA_BROAD_FRONT: "Un nuevo Brasil"
 RULE_OPTION_BRA_BROAD_FRONT_DESC: "El §8Partido obrero§! gobierna a través de una amplia coalición con el §8 Movimiento Democrático Brasileño§! y la izquierda más pequeña, y responde a los escándalos de corrupción con reforma en lugar de retroceder. Brasil mantiene una democracia constitucional y se convierte en el ancla de América del Sur que ya no busca permiso al norte."
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC: "La República Roja"
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC_DESC: "El §8Partido de los Trabajadores§! deja de compartir el poder, absorbe a sus rivales a la izquierda y reescribe el estado alrededor de sí mismo. Brasil proclama una república socialista y exporta el modelo a todos los vecinos dispuestos a tomarlo."
 RULE_OPTION_BRA_LIBERALS: "La Orden Liberal"
 RULE_OPTION_BRA_LIBERALS_DESC: "El §8 Partido Brasileño de la Socialdemocracia§! tiene la presidencia que ya ocupa y lleva las privatizaciones y la inflación hacia el final. Brasil se convierte en la economía más abierta del continente y el socio americano más firme al sur del Ecuador."
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS: "Los socialdemócratas"
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS_DESC: "El §8 Partido Brasileño de la Socialdemocracia§! gobierna junto al §8 Partido Laborista Democrático§! y pasa de la ortodoxia del mercado hacia un estado de desarrollo con una planta de bienestar. Brasil pasa en la industria y las escuelas en lugar de interesarse, y mantiene su distancia de Washington y Beijing por igual."
 RULE_OPTION_BRA_MILITARY_RULE: "La República del Capitán"
 RULE_OPTION_BRA_MILITARY_RULE_DESC: "El §8Partido Liberal Social§! toma la presidencia, glorifica la vieja dictadura y disuelve el congreso en su camino. Brasil es gobernado por decreto de los cuarteles una vez más, y presiona sus reivindicaciones contra los gobiernos socialistas en sus fronteras."
 RULE_OPTION_BRA_MONARCHY: "El Imperio Restablecido"
 RULE_OPTION_BRA_MONARCHY_DESC: "El reavivamiento §8monarquista§! convierte una presidencia nacionalista en coronación, y la Casa de Orléans-Braganza vuelve a un trono vacío durante más de un siglo. Brasil aboli sus elecciones, reclama la antigua provincia de Cisplatino y responde a una corona de nuevo."
 RULE_OPTION_ARM_HISTORICAL: "El clan Karabaj"
 RULE_OPTION_ARM_HISTORICAL_DESC: "Los veteranos de la guerra de Karabaj ocupan la presidencia durante dos décadas detrás de la §8Partido Republicano de Armenia§!, hasta que las calles finalmente entreguen el país a §8Civil Contract Party§!Armenia se mantiene atada a Moscú por su seguridad mientras discute con Bakú sobre las montañas."
 RULE_OPTION_ARM_TER_PETROSIAN: "El Primer Presidente devuelve"
 RULE_OPTION_ARM_TER_PETROSIAN_DESC: "El Congreso Nacional Armeniano §8§! devuelve al presidente fundador los generales forzados, y los hombres Karabaj nunca consiguen su turno. Armenia intercambia las montañas por fronteras abiertas y relaciones normales con sus vecinos."
 RULE_OPTION_ARM_PEOPLES_PARTY_DESC: "El §8 Partido Popular de Armenia§! sobrevive al tiroteo en la cámara y toma el estado que fue negado. Armenia reconstruye la industria y planificación de la era soviética, y se convierte en el socio más confiable de Moscú en el Cáucaso."
 RULE_OPTION_ARM_TSARUKYAN: "La República de Oligarch"
 RULE_OPTION_ARM_TSARUKYAN_DESC: "§8El próspero Armenia§! compra al parlamento de manera directa, y el país está dirigido desde la finca de un hombre de negocios en lugar del palacio presidencial. Armenia se convierte en rica, corrupta y para la venta a cualquier capital que más pague."
 RULE_OPTION_ARM_UNITED_STATES: "Estados Unidos de América"
 RULE_OPTION_ARM_UNITED_STATES_DESC: "El §8Partido Heritage§! y la diáspora reescribir la república como una federación con un lugar reservado para cada armenio en el extranjero. Armenia busca a Los Ángeles y Beirut para su futuro en lugar de Moscú."
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT: "El Parlamento Fundador"
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT_DESC: "Los veteranos de Karabaj §8Sasna Tsrer§! capturan la república que creen que fue robada y lo gobiernan como una guarnición. Armenia arroja las bases rusas y pide a Occidente que lo garantice."
 RULE_OPTION_ARM_MONARCHY: "La Corona Restaurada"
 RULE_OPTION_ARM_MONARCHY_DESC: "El §8 Unión Meliq de Armenia§! termina la república y asienta a un rey en Ereván por primera vez en seis siglos. Armenia gobierna por el trono y la iglesia, y reclama cada provincia sus viejos reinos jamás sostenidos."
 RULE_OPTION_ARM_DASHNAK_LEFT: "El socialismo Dashnak"
 RULE_OPTION_ARM_DASHNAK_LEFT_DESC: "El ala socialista de la §8Federación Revolucionaria Armenia§! gana el argumento dentro del partido y reconstruye la república en su credo fundador. Armenia nacionaliza las posesiones de los oligarcas y se pone en contra del imperio dondequiera que lo encuentre."
 RULE_OPTION_ARM_DASHNAK_RIGHT: "Legado del Fedayi"
 RULE_OPTION_ARM_DASHNAK_RIGHT_DESC: "El ala nacionalista de la §8Federación Revolucionaria Armenia§! toma el partido y gobierna en nombre de los luchadores montañosos. Armenia arma para las tierras que perdió y no hace ningún secreto de quererlas."
 RULE_OPTION_BUL_HISTORICAL: "El camino a Bruselas"
 RULE_OPTION_BUL_HISTORICAL_DESC: "La Unidad de Fuerzas Democráticas §8§! mantiene juntas la junta monetaria y el programa de reforma, y todos los gobiernos que lo siguen mantienen las mismas dos aplicaciones sobre la mesa. Bulgaria se une a la OTAN y luego a la Unión Europea, y da a la alianza su frontera más tranquila en los Balcanes."
 RULE_OPTION_BUL_TSARIST_RESTORATION: "El zar devuelve"
 RULE_OPTION_BUL_TSARIST_RESTORATION_DESC: "El exiliado §8Casa de Saxe-Coburg y Gotha§! llega a casa a más de un estreno, reúne al nacionalista justo detrás de la corona y gobierna en su propio nombre. Bulgaria negocia las aplicaciones occidentales para las fronteras que se prometió en San Stefano, y sus vecinos encuentran la cuestión macedonio reabierto."
 RULE_OPTION_BUL_RED_BALKAN: "El sueño de los Balcanes Rojos"
 RULE_OPTION_BUL_RED_BALKAN_DESC: "El §8Partido Comunista de Bulgaria§! se levanta de los escombros de la transición y toma al estado el §8 Partido Socialista Búlgaro§! no reclamaría. Bulgaria mira a Moscú y Beijing por sus amigos, y se pone sobre la construcción de una federación socialista fuera de los Balcanes."
 RULE_OPTION_CAN_HISTORICAL: "Histórico"
 RULE_OPTION_CAN_HISTORICAL_DESC: "El §8Partido Liberal§! gobierna desde el centro, mantiene ambos lenguajes fundadores en la maquinaria de la federación y responde a Quebec con una ley de claridad más que concesiones. Canadá permanece dentro de la OTAN y el área comercial norteamericana, y sigue siendo el vecino más firme de Washington."
 RULE_OPTION_CAN_FRENCH_CANADA: "A French Canada"
 RULE_OPTION_CAN_FRENCH_CANADA_DESC: "El §8Bloc Québécois§! convierte una queja lingüística en un programa federal, hace que el francés sea el idioma único del Estado y traslada la sede del gobierno a Quebec. Anglophone Canadá se encuentra una minoría en su propio capital, y el sindicato mantiene unidos por la ley en lugar de consentimiento."
 RULE_OPTION_CAN_ARMED_NEUTRALITY: "El True North Alone"
 RULE_OPTION_CAN_ARMED_NEUTRALITY_DESC: "Canadá sale de la OTAN, termina sus enredamientos extranjeros y gasta los ahorros en la economía doméstica y una industria de defensa autosuficiente. El flanco norteño de la alianza se calla, y Washington pierde el segundo ejército en su propio continente."
 RULE_OPTION_CAN_NATIONALIST: "El golpe nacionalista"
 RULE_OPTION_CAN_NATIONALIST_DESC: "§8Canada First§! monta los restos del orden constitucional en el poder, suspende las elecciones y responde a Quebec y las reservas con poderes de emergencia. Canadá se convierte en su propio continente, y la frontera más larga del mundo está fortificada desde el lado norte."
 RULE_OPTION_CAN_EASTERN_REALIGNMENT: "El puente Ártico"
 RULE_OPTION_CAN_EASTERN_REALIGNMENT_DESC: "Ottawa deja la OTAN y vende sus rutas, puertos y recursos del Ártico a Moscú y Beijing en lugar de Washington. Canadá se convierte en el extremo norte de una esfera Russo-Chinese, y Estados Unidos despierta a un rival en su propio continente."
 RULE_OPTION_DEN_HISTORICAL: "Los Años Fogh"
 RULE_OPTION_DEN_HISTORICAL_DESC: "§8Venstre§! y los §8 Demócratas Sociales§! intercambian Christiansborg entre ellos mientras Dinamarca mantiene sus salidas, vota por el euro y envía soldados a los Balcanes, Irak y Afganistán. Copenhague se convierte en el pequeño aliado más dispuesto de Washington en Europa y permite a la Unión profundizar sin ella."
 RULE_OPTION_DEN_EUROPEAN_UNION: "En el corazón de Europa"
 RULE_OPTION_DEN_EUROPEAN_UNION_DESC: "El §8Social Liberals§! y el §8Social Democrats§! llevar un segundo referéndum y pasar los opt-outs daneses para comprar un asiento en el centro de la Unión. La corona da paso al euro y Copenhague se ancla a Berlín y París en lugar de a Washington."
 RULE_OPTION_DEN_EUROSCEPTIC_DESC: "El §8Partido Popular Danish§! obliga a la pregunta que los viejos partidos siguen posponing, y Dinamarca sale de Schengen y luego fuera de la Unión misma. La cooperación en materia de defensa nórdica ocupa el lugar de Bruselas, y se pide al resto de Escandinavia que elija una parte."
 RULE_OPTION_DEN_SOCIALIST_DESC: "La Alianza Verde §8§! y los sindicatos convierten al Estado de bienestar en un estado obrero y establecen los consejos por encima del Folketing. Dinamarca deja la alianza y la Unión, busca al este a sus amigos, y ofrece al resto del Norte una revolución."
 RULE_OPTION_DEN_MONARCHIST_DESC: "La corte deja de pretender ser ceremonial y el §8 Partido Popular Dominio§! lleva el caso de la corona a través de un parlamento que ha perdido la paciencia del país. El monarca recupera los poderes que la constitución removió, y Groenlandia y las Faroes se tiran firmemente bajo la mano de Copenhague."
 RULE_OPTION_DEN_NATIONALIST_DESC: "El §8Partido Popular de Saneamiento§! toma al gobierno que sólo ha surgido y hace que la inmigración y la frontera controlen toda la política danesa. Dinamarca deja la alianza y el Consejo Nórdico, y comienza a presionar afirmaciones que no ha planteado desde la Edad Media."
 COM_AI_BEHAVIOR: "@COM Comoros"
 RULE_OPTION_COM_HISTORICAL: "La Unión de las Comoras"
 RULE_OPTION_COM_HISTORICAL_DESC: "Azali Assoumani negocia el uniforme para la urna, las islas cada una consigue un presidente y la presidencia sindical rota entre ellos, y las tropas de la Unión Africana llevan a Anjouan de vuelta de su coronel. La §8Convención por la Renovación de las Comoras§! gana y luego pierde el poder pacíficamente, y el archipiélago finalmente deja de derrocarse."
 RULE_OPTION_COM_ORANGE_PARTY: "La ascendencia naranja"
 RULE_OPTION_COM_ORANGE_PARTY_DESC: "Mohamed Daoudou's §8Orange Party§! toma a Moroni y dirige el archipiélago como una tecnocracia merecida, rompiendo los anillos de tráfico y profesionalizando los ministerios. Comoras se vende al capital occidental como el único microestado del Océano Índico cuyo papeleo puede ser confiado."
 RULE_OPTION_COM_ISLAMIC_REPUBLIC: "República Árabe Siria"
 RULE_OPTION_COM_ISLAMIC_REPUBLIC_DESC: "Los comités de las mezquitas llevan a Ahmed Abdallah Mohamed Sambi a la presidencia y el §8movimiento baazista§! reconvierte las islas en una república árabe. Los puertos se nacionalizan, Damasco y Bagdad sustituyen a París, y las Comoras se convierten en una voz de la Liga Árabe en el canal de Mozambique."
 RULE_OPTION_CUB_HISTORICAL: "Histórico"
 RULE_OPTION_CUB_HISTORICAL_DESC: "Fidel entrega la presidencia a su hermano y el §8Partido Comunista de Cuba§! mantiene la isla en un partido, otorgando licencias para pequeños comercios mientras corteja Caracas y Moscú por petróleo. El embargo sostiene, el Período Especial nunca termina, y La Habana sigue siendo la excepción incómoda en el hemisferio de Washington."
 RULE_OPTION_CUB_PRO_WESTERN_REFORM: "Fidel abre la isla"
 RULE_OPTION_CUB_PRO_WESTERN_REFORM_DESC: "Castro desmantela la propia economía de mando, otorgando licencias a los bancos, restableciendo la iglesia y escribiendo una constitución que admite partidos rivales bajo el ala §8pro-occidental del Partido Comunista§!. La Habana resuelve la cuestión de Guantánamo con Washington, reconoce a Taipei y termina perforando junto a la OTAN."
 RULE_OPTION_CUB_DIAZ_CANEL: "El Diáz-Canel Thaw"
 RULE_OPTION_CUB_DIAZ_CANEL_DESC: "Miguel Díaz-Canel toma el palacio por delante de Raúl, unban la §8Unión Liberal Cubana§! y llama a las primeras elecciones disputadas desde la revolución. La censura es desmantelada y el capital extranjero regresa, y Cuba se convierte en una república caribeña ordinaria sin disparo."
 RULE_OPTION_CUB_NEW_SOCIALISM: "La segunda revolución"
 RULE_OPTION_CUB_NEW_SOCIALISM_DESC: "Diaz-Canel abandona la apertura a mitad de camino, reconstruye el estado de un partido alrededor de un cuadro más joven y negocia abiertamente con Pyongyang. Cuba se une al CSTO y devuelve a Rusia sus bases, poniendo una guarnición rusa a 90 millas de Florida."
 RULE_OPTION_CUB_NATIONALIST: "Cuba para los cubanos"
 RULE_OPTION_CUB_NATIONALIST_DESC: "El §8Cuban Falanga§! toma el estado, purifica a los comunistas y demócratas por igual y reconstruye al ejército alrededor de un cuerpo de trabajo juvenil. La Habana reclama entonces toda la cuenca como su derecho de nacimiento, y Haití, Jamaica y el istmo se anexan uno por uno."
 RULE_OPTION_CUB_RESTORED_REPUBLIC: "Restablecido por la República"
 RULE_OPTION_CUB_RESTORED_REPUBLIC_DESC: "El §8Partido Social-Revolucionario Democrático de Cuba§! gana el poder, libera a los presos políticos y reescribe la constitución alrededor de un parlamento multipartidista. Cuba invita a sus vecinos a una federación caribeña en lugar de conquistarlas."
 RULE_OPTION_CZE_HISTORICAL: "Histórico"
 RULE_OPTION_CZE_HISTORICAL_DESC: "Los §8Czech Social Democrats§! y el §8 Partido Democrático Cívico§! intercambian el gobierno entre ellos mientras que el país se asienta en la OTAN y la Unión Europea y Škoda convierte a Mladá Boleslav en un motor de exportación. Praga envía a sus soldados a los Balcanes y Afganistán y se convierte en un miembro cómodo e irremarcable del bloque occidental."
 RULE_OPTION_CZE_COMMUNISM: "Los comunistas regresan"
 RULE_OPTION_CZE_COMMUNISM_DESC: "El §8Partido Comunista de Bohemia y Moravia§! convierte la ira a la privatización en una mayoría gobernante y señala los ministerios a los hombres que vendieron las fábricas. La República Checa sale de la OTAN, los tribunales de Moscú y Pekín, y reabre las cuestiones fronterizas que sus vecinos pensaban estaban resueltos."
 RULE_OPTION_CZE_MONARCHY_KING: "La Corona de Habsburgo"
 RULE_OPTION_CZE_MONARCHY_KING_DESC: "§8Koruna Česká§! crece de una curiosidad en la fiesta más grande, saca las joyas de la corona fuera del almacenamiento y llama a Karl von Habsburg casa para ser coronado. Las tierras checas se convierten en un reino de nuevo y se establecen para reunir Viena y Budapest en un bloque monarquista a través de Europa central."
 RULE_OPTION_CZE_MONARCHY_PRESIDENT: "La República Coronada"
 RULE_OPTION_CZE_MONARCHY_PRESIDENT_DESC: "§8Koruna Česká§! gana el país de vuelta al viejo orden, pero mantiene la urna, instalando un jefe monarquista del estado elegido por las elecciones en lugar de por sangre. La República Checa mantiene su parlamento y sus socios europeos mientras se reconstruye en torno al trono, la iglesia y la región."
 RULE_OPTION_FIJ_HISTORICAL: "Histórico"
 RULE_OPTION_FIJ_HISTORICAL_DESC: "El ejército elimina al gobierno elegido §8Partido Unido de Fiji§! e instala una administración respaldada por militares en su lugar. Estabilidad vuelve a las islas, pero la autoridad final descansa con los barracones y las elecciones permanecen en abediencia."
 RULE_OPTION_FIJ_COUP_AVERTED: "El Coup Averted"
 RULE_OPTION_FIJ_COUP_AVERTED_DESC: "El enfrentamiento entre el gobierno y el ejército se desafía antes de que pueda superar a cualquiera, y el §8Fiji Labour Party§! asume su cargo en un mandato de centro-izquierda. La reconciliación y la inversión pública lideran el programa, y Fiji mantiene al gobierno civil que sus vecinos habían renunciado."
 RULE_OPTION_FIJ_MILITARY_JUNTA: "República de los oficiales"
 RULE_OPTION_FIJ_MILITARY_JUNTA_DESC: "Los radicales en los §8Fuerzas militares de Fiji§! ir más allá del golpe exigido y formalizar el gobierno militar abierto, fusionando a la policía en el ejército bajo ley marcial. La política se ejecuta desde los cuarteles, y el Pacífico gana un estado abiertamente militarizado en el corazón de sus carriles de transporte."
 RULE_OPTION_FIJ_RESTORED_KINGDOM: "La Corona Restaurada"
 RULE_OPTION_FIJ_RESTORED_KINGDOM_DESC: "El §8 Gran Consejo de Jefes§! gana la crisis y refunde a Fiji como un reino bajo un monarca elegido. La costumbre principal se convierte en la base del Estado, y el establecimiento indígena resuelve la cuestión étnica en sus propios términos."
 RULE_OPTION_FIJ_TECHNOCRACY: "Gobierno de Ingenieros"
 RULE_OPTION_FIJ_TECHNOCRACY_DESC: "Un consejo de ingenieros, planificadores y administradores toma el país y gobierna bajo una constitución tecnócrata. La política del partido da paso a la automatización y la planificación industrial, y Fiji se propone desenvolver cada economía en la región."
 RULE_OPTION_FIJ_EARLY_JUNTA: "Los barracones se mueven temprano"
 RULE_OPTION_FIJ_EARLY_JUNTA_DESC: "La crisis de los rehenes del milenio nunca está contenida, y §8Fuerzas militares de Fiji§! tomar el país de antemano mientras que el parlamento todavía está bajo asedio. Una sociedad militarizada se endurece años antes de lo previsto, y la región observa que el hábito de golpe tiene raíces mucho antes."
 RULE_OPTION_FIJ_EARLY_KINGDOM: "La Corona regresa temprano"
 RULE_OPTION_FIJ_EARLY_KINGDOM_DESC: "La crisis rehén del milenio termina con el §8 Gran Consejo de Jefes§! que eleva a un rey elegido en lugar de con un regreso a la república. La monarquía es restaurada una generación política plena temprano, y la segunda crisis que habría seguido nunca llega."
 RULE_OPTION_FRA_SOCIALIST: "El retorno de los socialistas"
 RULE_OPTION_FRA_SOCIALIST_DESC: "El §8Parti Socialiste§! toma el Élysée y gobierna en la expansión del bienestar, horas más cortas y una línea más suave en el gasto público. Francia permanece dentro de la OTAN y de la Unión, pero argumenta por una Europa social en lugar de puramente liberal."
 RULE_OPTION_FRA_LIBERAL: "El Centro Liberal"
 RULE_OPTION_FRA_LIBERAL_DESC: "El centrista §8UDF§! y su sucesor §8La République En Marche§! gobiernan sobre la desregulación, la reforma laboral y el federalismo europeo más profundo. Francia empuja más fuerte que cualquier otro poder importante para una Unión que actúa como uno."
 RULE_OPTION_FRA_GAULLIST: "El Revival Gaullista"
 RULE_OPTION_FRA_GAULLIST_DESC: "El §8Rassemblement pour la France§! revive el soberano gaullista, aflojando a Francia del mando de la OTAN e insistiendo en una postura nuclear independiente. Francia mantiene su asiento europeo pero se niega a seguir la pista de Washington."
 RULE_OPTION_FRA_GREEN: "La República Verde"
 RULE_OPTION_FRA_GREEN_DESC: "§8Les Verts§! y su sucesor §8Europa Écologie Les Verts§! ganan poder y giran el estado hacia la transición ecológica, repensando la flota nuclear y la industria pesada por igual. Francia negocia un crecimiento para la voz verde más fuerte de Europa."
 RULE_OPTION_FRA_FRANCE_UNBOWED: "France Unbowed"
 RULE_OPTION_FRA_FRANCE_UNBOWED_DESC: "§8La France Insoumise§! lleva a la izquierda radical en el cargo con una promesa de una Sexta República y una ruptura con la ortodoxia fiscal europea. Francia se opone a las reglas de la Unión y busca socios fuera del bloque occidental."
 RULE_OPTION_FRA_NATIONAL_RALLY: "El Rally Nacional"
 RULE_OPTION_FRA_NATIONAL_RALLY_DESC: "El §8Front National§! y su sucesor el §8Rassemblement National§! ganan a la República de manera directa y gobiernan sobre restricción migratoria y preferencia nacional. Francia presiona para la puerta de salida en Bruselas y calienta a Moscú."
 RULE_OPTION_GRN_HISTORICAL: "Histórico"
 RULE_OPTION_GRN_HISTORICAL_DESC: "Groenlandia obtiene autogobierno de Dinamarca e invierte sus esfuerzos en asentamientos, pesca, minería y servicios públicos en lugar de aventura extranjera. El Ártico permanece tranquilo y los vecinos nórdicos de Groenlandia mantienen las fronteras que tienen."
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY_DESC: "Groenlandia reúne a Islandia, las Islas Feroe, Dinamarca, Noruega, Suecia y Finlandia en una Unión Nórdica §8§!, luego se detiene en la costa báltica. Escandinavia habla con una voz y el orden europeo más amplio permanece como era."
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY_DESC: "Groenlandia lleva su §8Nordic Union§! al sur y al este hasta el §8Frozen Federation§! La respuesta de las capitales del continente a Nuuk y el viejo orden europeo está terminado."
 RULE_OPTION_GRE_HISTORICAL: "Histórico"
 RULE_OPTION_GRE_HISTORICAL_DESC: "§8Nueva Democracia§! lleva a Grecia a través de la crisis de deuda sobre austeridad y euro, cortando el presupuesto al hueso antes de que llegue la recuperación. Atenas se ancla más profundamente en la Unión Europea y la OTAN, obligando a Chipre, Israel y Francia a un frente de EastMed."
 RULE_OPTION_GRE_COMMUNIST: "La Acrópolis Roja"
 RULE_OPTION_GRE_COMMUNIST_DESC: "El desplome entrega el Estado al §8Partido Comunista de Grecia§!, que escribe una nueva constitución, nacionaliza los bancos y levanta un ejército rojo. Grecia deja la OTAN y organiza un bloque comunista en los Balcanes, presionando sus afirmaciones sobre Bulgaria, Albania, Macedonia del Norte, Serbia y Rumania."
 RULE_OPTION_GRE_NATIONALIST: "El Amanecer Dorado"
 RULE_OPTION_GRE_NATIONALIST_DESC: "§8Golden Dawn§! lleva el mismo colapso al poder, entierra la república bajo una dictadura metaxista y silencia a la prensa y a la oposición. Grecia revive la Megali Idea y participa en reclamos territoriales sobre Albania, Bulgaria, Macedonia del Norte y Turquía."
 RULE_OPTION_GRE_MULTIPOLAR: "Girando hacia Oriente"
 RULE_OPTION_GRE_MULTIPOLAR_DESC: "La república sobrevive pero gira en la Unión Europea, cortejando a Rusia, China e Irán y vendiendo Pireo al capital chino. Grecia se une a BRICS y sale de la OTAN, negociando su lugar en el campamento occidental para un asiento en una orden multipolar."
 RULE_OPTION_GEO_HISTORICAL: "Histórico"
 RULE_OPTION_GEO_HISTORICAL_DESC: "La Revolución de las Rosas barre el §8Unión de Ciudadanos de Georgia§! y Mikheil Saakashvili gira el país duro hacia la OTAN y Occidente. Georgia pierde su guerra con Rusia sobre las repúblicas quebradas y luego da poder pacíficamente para §8Georgian Dream§!."
 RULE_OPTION_GEO_SHEVARDNADZE_WEST: "Shevardnadze Endures"
 RULE_OPTION_GEO_SHEVARDNADZE_WEST_DESC: "Eduard Shevardnadze aplasta a la oposición en lugar de rendirse ante ella, y la Unión de Ciudadanos de Georgia §8§! mantiene al país en su curso occidental sin una revolución. Georgia sigue siendo un estado autoritario que el tribunal de Bruselas y Washington de todos modos."
 RULE_OPTION_GEO_PRO_RUSSIAN: "Concesión a Moscú"
 RULE_OPTION_GEO_PRO_RUSSIAN_DESC: "El §8Unión de Ciudadanos de Georgia§! se asienta con el Kremlin, dejando las bases rusas en su lugar y las repúblicas fugaces resueltas en los términos de Moscú. Georgia entra en la Comunidad de Estados Independientes y sale del campamento occidental."
 RULE_OPTION_GEO_NATIONALIST: "El regreso de Mkhedrioni"
 RULE_OPTION_GEO_NATIONALIST_DESC: "Los paramilitares §8Mkhedrioni§! son revividos y toman el estado, y Georgia persigue a una Gran Georgia no contempla ni al bloque. Armenia, Azerbaiyán y las repúblicas fugitivas se convierten en blancos y no en vecinos."
 RULE_OPTION_GEO_COMMUNIST: "Restablecido por la República Soviética"
 RULE_OPTION_GEO_COMMUNIST_DESC: "El §8Partido Comunista Unido de Georgia§! vuelve por votación o por revolución y proclama nuevamente la república soviética. Georgia llega a Armenia y Azerbaiyán para reconstruir una federación transcaucánica."
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT: "El Movimiento Nacional sostiene"
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT_DESC: "La historia lleva su curso a la guerra y al acuerdo que sigue, pero el Movimiento Nacional Unido §8 de Saakashvili§! mantiene la presidencia en lugar de perderla. Georgia se duplica con la pertenencia de la OTAN y responde a Moscú con hostilidad abierta."
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS: "Alianza de Patriots"
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS_DESC: "El asentamiento de la posguerra llega como lo hizo, y luego el §8Alliance de Patriots§! gana en una plataforma nacionalista y socialmente conservadora. Georgia se aleja de Bruselas y retrocede hacia el este."
 RULE_OPTION_GEO_UNITED_GEORGIA: "Entre Oriente y Occidente"
 RULE_OPTION_GEO_UNITED_GEORGIA_DESC: "El acuerdo posterior a la guerra llega como lo hizo, y luego §8 United Georgia§! toma posesión de una política exterior deliberadamente multi-vector. Georgia equilibra a la Unión Europea, Rusia y sus vecinos en lugar de elegir entre ellos."
 RULE_OPTION_GER_HISTORICAL: "Histórico"
 RULE_OPTION_GER_HISTORICAL_DESC: "El §8Partido Social Democrático§! gobierna en coalición con los §8Greens§! y fuerza las reformas laborales de Hartz a través de su propia base, luego entrega el canciller a la §8 Unión Democrática Cristiana§! para una larga gran coalición. Alemania se mantiene anclada en la OTAN y dirige a la Unión Europea desde su centro."
 RULE_OPTION_GER_LIBERAL: "La República Liberal"
 RULE_OPTION_GER_LIBERAL_DESC: "El §8Partido Democrático Libre§! rompe su papel de socio junior y lleva al país en mercados libres, desregulación, defensa privatizada y un estado digital. Alemania se une más a la OTAN y abre sus fronteras a quien su sistema de puntos sea el más alto."
 RULE_OPTION_GER_POPULIST: "Las Risas Alternativas"
 RULE_OPTION_GER_POPULIST_DESC: "§8La Alternativa§! sale de la franja y entra en gobierno sobre inmigración, islam, euroescepticismo y duda sobre el clima. Alemania se calienta en Moscú mientras elige a la Unión Europea aparte del interior."
 RULE_OPTION_ETH_DERG_RESTORATION: "Retorno de la Derg"
 RULE_OPTION_ETH_DERG_RESTORATION_DESC: "Etiopía rehabilita a Mengistu Haile Mariam y restaura el gobierno comunista bajo la §8 República Democrática Popular de Etiopía§!. La nación se alinea con China y persigue la solidaridad comunista panafricana."
 RULE_OPTION_EST_HISTORICAL: "Histórico"
 RULE_OPTION_EST_HISTORICAL_DESC: "El §8Reform Party§! persigue la desregulación radical y la imposición plana mientras construye un estado digital alrededor de una identidad nacional en línea. Estonia se une a la OTAN y a la Unión Europea como ancla occidental en el Báltico y contrapeso permanente a la influencia rusa."
 RULE_OPTION_EST_CONSERVATIVE: "Estonia tradicional"
 RULE_OPTION_EST_CONSERVATIVE_DESC: "§8Isamaa§! invierte fuertemente en la educación y el bienestar familiar, al tiempo que concede restricciones fiscales favorables a las empresas y ejecuta programas de empleo selectivos. Estonia se mantiene occidental y proeuropea pero se convierte en social, afianzando la política de inmigración y colocando la preservación cultural ante el cosmopolitismo."
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC: "El modelo nórdico"
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC_DESC: "El §8Partido Social Democrático§! construye un estado de bienestar al estilo nórdico sobre salarios mínimos, uniones laborales empoderadas e inversiones industriales dirigidas por el Estado. Estonia mantiene su alineación occidental pero se une a Europa como una democracia social que defiende los derechos de los trabajadores y la igualdad en el lugar de trabajo."
 RULE_OPTION_EST_CENTRIST: "El equilibrio oriental"
 RULE_OPTION_EST_CENTRIST_DESC: "El partido §8Centre§! abandona la inclinación atlántica de Estonia, vuelve a negociar con Rusia y juzga a la minoría de habla rusa mientras presiona por un sindicato con Letonia y Lituania. Estonia se convierte en un puente neutral entre Oriente y Occidente, y el Báltico pierde su firme defensor de la OTAN."
 RULE_OPTION_EST_NATIONALIST: "Estonia Primera"
 RULE_OPTION_EST_NATIONALIST_DESC: "§8EKRE§! toma el poder, aprovecha los recursos del país para el Estado y purifica a los partidos proeuropeos y sus simpatizantes de la vida pública. Estonia se aleja de la integración europea, las reorganizaciones duras y los reclamos de prensa sobre Letonia, Lituania, Finlandia y Suecia, convirtiendo el Báltico en un punto culminante."
 CHE_AI_BEHAVIOR: "@CHE Chechnya"
 RULE_OPTION_CHE_HISTORICAL: "Histórico"
 RULE_OPTION_CHE_HISTORICAL_DESC: "La segunda guerra termina con §8Ichkeria§! destruida y la república reabsorbida en Rusia bajo los Kadyrovs. Chechenia negocia la independencia para el dinero de reconstrucción y se convierte en el ejecutor más confiable de Moscú en el Cáucaso."
 RULE_OPTION_CHE_CALIPHATE: "Emirato del Cáucaso"
 RULE_OPTION_CHE_CALIPHATE_DESC: "El extranjero §8mujahideen§! aparta a los separatistas seculares y gobierna lo que sobrevive de la república bajo la sharia. Chechenia se convierte en un santuario para §8al-Qaeda§! y un punto de lanzamiento para la yihad a través del Cáucaso y hacia Rusia misma."
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION: "Confederación del Cáucaso"
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION_DESC: "Los oficiales seculares rompen §8islamistas§! y reconstruir Ichkeria como el núcleo de una unión de los pueblos del norte del Cáucaso. Chechenia se apoya en Ankara y Bakú por el peso que necesita para mantener a Moscú fuera de las montañas."
 RULE_OPTION_CHE_WESTERN_ALIGNMENT: "Reconocimiento de Occidente"
 RULE_OPTION_CHE_WESTERN_ALIGNMENT_DESC: "El §8islamistas§! son expulsados y la república gasta su independencia persiguiendo el reconocimiento en las capitales occidentales más que aliados en las montañas. Chechenia compra su supervivencia con credenciales democráticas y un asiento en la mesa de Europa."
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS: "El Cáucaso Rojo"
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS_DESC: "§8La facción de Salman Raduev§! toma la república y fusiona el Islam con el orden soviético que todavía recuerdan las montañas. Chechenia proclama una república socialista caucásica y se asienta con Moscú como un sujeto igual a otro."
 RULE_OPTION_IND_PARTY_OF_STRUGGLE: "El Partido de la Lucha"
 RULE_OPTION_IND_PARTY_OF_STRUGGLE_DESC: "El §8 Partido Democrático de Lucha indonesio§! toma el poder como la mayor fuerza secular y nacionalista del país, protegiendo a las minorías religiosas en las regiones contendidas y promoviendo Pancasila contra la radicalización. Indonesia pivota su diplomacia hacia el este hacia China y Rusia mientras construye un bastión nacionalista izquierda en todo el archipiélago."
 RULE_OPTION_IND_DEMOCRAT_PARTY: "A La Presidencia Tecnológica"
 RULE_OPTION_IND_DEMOCRAT_PARTY_DESC: "Una reforma general reúne a profesionales tecnócratas en el §8 Partido Democrático§!, priorizando el crecimiento económico, la estabilidad institucional y la confianza de los inversores. Indonesia sigue firmemente alineada con los occidentales como modelo de gobernanza profesional y competente en el sudeste asiático."
 RULE_OPTION_IND_UNITED_DEVELOPMENT: "El Frente Unido de Desarrollo"
 RULE_OPTION_IND_UNITED_DEVELOPMENT_DESC: "El §8Partido de Desarrollo Unido§!, arraigado en las redes de establecimientos islámicos del Nuevo Orden, toma el Estado y gobierna mediante patronaje, relaciones personales y consenso de élite en lugar de reforma estructural. Indonesia mantiene su anclaje occidental mientras la identidad islámica se profundiza a través de estructuras de poder informales y políticas transaccionales."
 RULE_OPTION_IND_PROSPEROUS_JUSTICE: "El Movimiento Prosperoso por la Justicia"
 RULE_OPTION_IND_PROSPEROUS_JUSTICE_DESC: "El §8Prosperous Justice Party§!, un movimiento islamista disciplinado construido sobre la lucha contra la corrupción y la movilización popular, toma el poder y destroza las redes patronales que han gobernado desde Reformasi. Hostile a la tutela occidental y socialmente conservador, Indonesia se orienta hacia el este como un actor independiente fuera del orden liberal y de la antigua élite."
 RULE_OPTION_JAP_NORMAL_NATION: "Una nación normal"
 RULE_OPTION_JAP_NORMAL_NATION_DESC: "Los Demócratas Liberales §8§! gastan el consenso del Artículo Nueve hasta que las Fuerzas de Autodefensa estén escritas en la constitución como un ejército como cualquier otro. Japón reta dentro de la alianza americana y comienza a responder a Beijing y Pyongyang por su cuenta."
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY: "La segunda posguerra"
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY_DESC: "El §8Partido Democrático§! rompe el dominio conservador de la Dieta y gobierna la divulgación, el derecho laboral y una puerta abierta para los trabajadores extranjeros. Japón gasta su fuerza en la natalidad, el hombre de sueldo y la corrupción que sobrevivió a la burbuja en lugar de en la región."
 RULE_OPTION_JAP_PACIFIST: "La Constitución de la Paz"
 RULE_OPTION_JAP_PACIFIST_DESC: "Los §8Demócratas sociales§! toman la Dieta sobre la promesa de que el Artículo Nueve significa lo que dice, y las exportaciones de armas, las bases y finalmente las Fuerzas de Autodefensa están terminadas. Japón derriba el tratado de seguridad con Washington y permanece desarmado entre China y Corea."
 RULE_OPTION_HKG_HISTORICAL: "Histórico"
 RULE_OPTION_HKG_HISTORICAL_DESC: "El §8pro-Beijing camp§! mantiene la Región Administrativa Especial en el curso de Beijing, reconstruyendo §8Legislativo§! alrededor de patriotas, poniendo la educación patriótica en las escuelas y dejando a Cantonés la vida cívica marchita. Su dinero sigue: Hong Kong se convierte en el centro offshore del renminbi y el financiero del §8Belt and Road§!, y §8Greater Bay Area§! se traga lo que el §8Derecho básico§! Prometido."
 RULE_OPTION_HKG_INDEPENDENCE: "Una nación de nuestro propio"
 RULE_OPTION_HKG_INDEPENDENCE_DESC: "Hong Kong rompe el arreglo de títeres, escribe una constitución propia y levanta un ejército y una flota portadora para defenderlo. Entonces está en juego una afirmación irredentista sobre el delta del río Pearl, atreviéndose a Beijing a responder por Guangdong."
 RULE_OPTION_HKG_BRITISH: "De vuelta bajo la corona"
 RULE_OPTION_HKG_BRITISH_DESC: "Hong Kong deja la soberanía china y pide que Londres vuelva, otorgando los derechos de guarnición del Reino Unido, uniéndose a la §8AUKUS§! y legislar el sufragio universal y un poder judicial independiente. §8Commonwealth§! reino en las manos de la puerta de China hacia el oeste, la posición democrática Beijing pasó décadas cerrando."
 RULE_OPTION_HKG_CITY_STATE: "La Ciudad Libre"
 RULE_OPTION_HKG_CITY_STATE_DESC: "Hong Kong reescribe los §8Derecho básico§! por su propia autoridad, mantiene una fuerza de defensa costera en lugar de un ejército y se convierte en la capital financiera del Asia oriental. Jura a ningún bloque, negocia con Beijing y Washington por igual y no responde a ninguno."
 EGY_AI_BEHAVIOR: "@EGY Egypt"
 RULE_OPTION_EGY_HISTORICAL: "Histórico"
 RULE_OPTION_EGY_HISTORICAL_DESC: "Egipto maneja el §8Partido Democrático Nacional§! hasta que el cuadrado lo empuje, manos un solo término al §8Hermandad Musulmana§!, y luego vuelve la presidencia a sus generales. La paz con Israel sostiene, la ayuda americana sigue fluyendo, y El Cairo habla por el orden árabe en lugar de contra él."
 RULE_OPTION_EGY_BROTHERHOOD: "La Hermandad sostiene"
 RULE_OPTION_EGY_BROTHERHOOD_DESC: "Egipto mantiene su gobierno elegido §8La Hermandad Musulmana§!, compra a los oficiales en lugar de purgarlos, y escribe una constitución islamista que los tribunales no pueden revocar. El Cairo oscila hacia Ankara, Doha y Hamás, y las monarquías del Golfo lo tratan como una amenaza."
 RULE_OPTION_EGY_PAN_ARAB: "Los herederos de Nasser"
 RULE_OPTION_EGY_PAN_ARAB_DESC: "Egipto devuelve el §8Frente Nacional§! al poder, nacionaliza las alturas dominantes y revive la República Árabe Siria. Juzgados de El Cairo Damasco, Bagdad y Trípoli, y vuelve su espalda a Washington."
 RULE_OPTION_EGY_SALAFIST: "El Salafista Turn"
 RULE_OPTION_EGY_SALAFIST_DESC: "Egipto pone el §8Partido Al-Nour§! en el palacio presidencial, suspende las elecciones y reglas por ley religiosa. Sharia gobierna a los Coptos como minoría protegida, y la campaña del Sinaí se convierte en una guerra santa."
 RULE_OPTION_EGY_COPTIC: "La Ascendencia Coptica"
 RULE_OPTION_EGY_COPTIC_DESC: "Egipto es tomado por la Iglesia copta §8§! y sus aliados laicos, quienes reclaman la herencia faraónica sobre el árabe. El Cairo protege a los cristianos de Palestina a Asiria y se encuentra aislado en su propia región."
 HEZ_AI_BEHAVIOR: "@HEZ Hezbollah"
 RULE_OPTION_HEZ_HISTORICAL: "Histórico"
 RULE_OPTION_HEZ_HISTORICAL_DESC: "§8Hezbollah§! impugna las elecciones como partido, mantiene al ejército guerrillero §8 Taabia§! con el que combatió a Israel y se encuentra junto a las §8 Fuerzas Armadas Libanesas§! en lugar de reemplazarlas. Lucha junto a Damasco, las §8 milicias Iraqi Shia§! y los §8Houthis§! mientras permanecen en el estado libanés."
 RULE_OPTION_HEZ_LAND_OF_GOD: "La Tierra de Dios"
 RULE_OPTION_HEZ_LAND_OF_GOD_DESC: "§8Hezbollah§! secede desde el Líbano y construye un estado islámico reconocido en todo el sur y Beqaa, cortejando a los aliados y elevando los niveles de vida en las aldeas que gobierna. Aumenta las fuerzas expedicionarias y un servicio de inteligencia exterior, convirtiendo una facción libanesa en un poder regional por derecho propio."
 RULE_OPTION_HEZ_CONQUER_LEBANON: "Masters of Lebanon"
 RULE_OPTION_HEZ_CONQUER_LEBANON_DESC: "§8Hezbollah§! desertores de armas de las §8 Fuerzas Armadas Libanesas§! y toma Líbano por la guerra abierta en lugar de por la votación. Paga por la campaña con dinero, fábricas y carreteras iraníes, y anexa el país a una República Islámica que responde a Teherán."
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE: "Exportar la revolución"
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE_DESC: "§8Hezbollah§! mantiene su tierra en el Líbano y derrama su dinero en las redes en el extranjero, desde §8Movimiento Islámico§! en África Occidental a las rutas de la diáspora y cártel que salen de Venezuela. Construye células y milicias dentro de América del Norte, llevando la guerra mucho más allá del Levante."
 IRQ_AI_BEHAVIOR: "@IRQ Iraq"
 RULE_OPTION_IRQ_HISTORICAL: "Histórico"
 RULE_OPTION_IRQ_HISTORICAL_DESC: "Iraq corre bajo Saddam Hussein §8Ba'ath Party§! hasta que la invasión estadounidense acabe el régimen; un gobierno de ocupación entonces gobierna desde Bagdad mientras el poder pasa a los partidos religiosos chiítas del §8Islamic Dawa§!Irak termina como una república patrocinada por Estados Unidos que, sin embargo, se dirige a la órbita diplomática de Irán."
 RULE_OPTION_IRQ_BAATHIST_STATE: "El Ba'ath Endures"
 RULE_OPTION_IRQ_BAATHIST_STATE_DESC: "El §8Ba'ath Party§! sobrevive la invasión estadounidense, rompe el régimen de sanciones, resuelve la sucesión dentro de la familia y revive sus afirmaciones sobre Kuwait, las regiones kurdas y Khuzestan iraní. El Golfo vive junto a un §8Ba'athist§! El Iraq que presiona a sus vecinos y afirma las ambiciones panárabes."
 RULE_OPTION_IRQ_SHIA_THEOCRACY: "Regla de los Juristas"
 RULE_OPTION_IRQ_SHIA_THEOCRACY_DESC: "Los partidos clericales chiíes y la Organización §8Badr§! toman el estado post-ocupación y construyen una república gobernada por los juristas, alineada con Teherán. Bagdad se convierte en el ancla occidental de un eje iraní que corre a Damasco y Beirut."
 RULE_OPTION_IRQ_SADRIST: "La marea sádica"
 RULE_OPTION_IRQ_SADRIST_DESC: "§8El movimiento de Muqtada al-Sadr§! surge de los barrios marginales de Bagdad, expulsa a los estadounidenses y gobierna como una fuerza populista chiíta e nacionalista iraquí que niega la tutela iraní tan firmemente como estadounidense. El Iraq se vuelve interno y hostil a todos los patronos extranjeros."
 RULE_OPTION_IRQ_SECULAR_REPUBLIC: "La República secular"
 RULE_OPTION_IRQ_SECULAR_REPUBLIC_DESC: "La oposición secular del Congreso Nacional §8Iraqi§! y el Acuerdo Nacional §8Iraqi§! escribe una constitución por encima de la secta y el origen étnico y mantiene al Estado unido como república árabe en vez de religiosa. El Iraq reitera el orden árabe como un estado secular occidental."
 RULE_OPTION_IRQ_COMMUNIST: "Un Iraq socialista"
 RULE_OPTION_IRQ_COMMUNIST_DESC: "El §8Partido Comunista de Iraq§! sale de la clandestinidad donde ha vivido desde el §8Ba'athist§! purga, gana a los trabajadores, mujeres y kurdos, y toma la república. Irak se convierte en un estado socialista en medio de las monarquías petrolíferas."
 RAJ_AI_BEHAVIOR: "@RAJ India"
 RULE_OPTION_RAJ_HISTORICAL: "Histórico"
 RULE_OPTION_RAJ_HISTORICAL_DESC: "India alterna el poder entre el §8Bharatiya Janata Party§! y §8 Congreso Nacional Indio§!, manteniendo la liberalización económica y el compromiso con §8BRICS§! y una política exterior multipolar y no alineada. India mantiene vínculos con Washington y Moscú mientras se establece como una voz importante en el mundo en desarrollo."
 RULE_OPTION_RAJ_GREATER_INDIA: "India"
 RULE_OPTION_RAJ_GREATER_INDIA_DESC: "Un frente nacionalista hindú toma el poder, imponiendo el dominio mayoritario hindú en casa preservando la jerarquía de castas y despojando a las minorías de protección. La India recurre a demandas autárquicas, aisladas y territoriales sobre Nepal, Bhután y Bangladesh, estableciendo un régimen pan-indio autoritario."
 RULE_OPTION_RAJ_RED_REPUBLIC: "La República Roja"
 RULE_OPTION_RAJ_RED_REPUBLIC_DESC: "El §8Partido Comunista de la India§! gana poder, nacionaliza la economía y regresa a la planificación quinquenal al alinearse con China y retira el reclamo Aksai Chin. India exporta la revolución en el sur de Asia, convirtiéndose en una vanguardia socialista radical en la región."
 RULE_OPTION_RAJ_PEOPLES_FRONT: "El Frente Popular"
 RULE_OPTION_RAJ_PEOPLES_FRONT_DESC: "El partido §8Bahujan Samaj§! y §8Samajwadi§! forman una coalición Dalit y socialista, desmantelando el privilegio de la casta y redistribuyendo riqueza en toda la sociedad. India construye un estado de bienestar al estilo nórdico, manteniendo su política exterior no alineada."
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT: "Aliado de Occidente"
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT_DESC: "India se acerca a Francia e Israel, convirtiéndose en un importante aliado no OTAN de los Estados Unidos y profundizando la cooperación militar y comercial con Washington. India reconoce a Taiwán y finalmente se une a la OTAN, cementando su lugar en la alianza occidental."
 ISR_AI_BEHAVIOR: "@ISR Israel"
 RULE_OPTION_ISR_HISTORICAL: "Histórico"
 RULE_OPTION_ISR_HISTORICAL_DESC: "§8Likud§! toma el país después de que las conversaciones de paz se derrumben, baja la segunda intifada detrás de una barrera de separación y saca a los colonos de Gaza. Israel permanece anclado a Washington, normaliza con el Golfo Árabe y trata a Irán como la amenaza que ordena todo lo demás."
 RULE_OPTION_ISR_PEACE_PROCESS: "El Campamento de Paz"
 RULE_OPTION_ISR_PEACE_PROCESS_DESC: "§8Labour§! gobierna con §8Meretz§! y los partidos árabes y negocia un acuerdo de dos estados en serio. La Autoridad Palestina está armada como socio en lugar de ser policíada como sospechosa, y a Gaza se le da un puerto de trabajo y aeropuerto."
 RULE_OPTION_ISR_SECULAR_CENTRE: "El Centro Secular"
 RULE_OPTION_ISR_SECULAR_CENTRE_DESC: "§8 Yesh Atid§!, §8Blue and White§! y §8New Hope§! toman el país y prise religion back out of the state. Los tribunales están protegidos, la conscripción es reescrita, e Israel se apoya en Europa y la OCDE."
 RULE_OPTION_ISR_GREATER_ISRAEL: "Mayor Israel"
 RULE_OPTION_ISR_GREATER_ISRAEL_DESC: "§8Otzma Yehudit§! y §8Sionismo religioso§! toma el poder y desgarra lo que queda del marco de Oslo. Los asentamientos se consolidan y anexan, el status quo del Monte del Templo es reescrito, y el ejército golpea al norte antes de que sea alcanzado."
 RULE_OPTION_ISR_LOOK_EAST: "Gire al Este"
 RULE_OPTION_ISR_LOOK_EAST_DESC: "A §8Likud§! El gobierno se aleja de Washington, lanzando el puerto de Haifa a operadores chinos y vendiendo armas y tecnología a Pekín. Israel inclina hacia Moscú sobre Kiev, y la alianza occidental que lo garantizó comienza a verse condicionada."
 RULE_OPTION_LBA_HISTORICAL: "Histórico"
 RULE_OPTION_LBA_HISTORICAL_DESC: "Gaddafi aplasta a los §8Libyan Islamic Fighting Group§!, renuncia a su programa de armas y negocia fuera de las sanciones internacionales. El régimen eventualmente cae en un levantamiento, y Libia pasa a un fuerte militar al mando del §8Ejército Nacional de Libia§!."
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE: "Califato Islámico"
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE_DESC: "Gaddafi tolera el §8Grupo Islámico de Lucha Libia§!, que lo asesina y establece un estado salafista. Libia se convierte en una base para la yihad a través del Sahel, desestabilizando el Chad, Níger, Nigeria, Argelia, Malí y Mauritania."
 RULE_OPTION_LBA_LIBYAN_REPUBLIC: "República Árabe Libia"
 RULE_OPTION_LBA_LIBYAN_REPUBLIC_DESC: "Libia revisa el Libro Verde, faculta a los Congresos Populares y legaliza partidos políticos. El estado se transforma en una república presidencial con política competitiva que reemplaza la democracia directa de Gaddafi."
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION: "Unión anticolonial"
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION_DESC: "Gaddafi se queda y construye una §8 Unión Anticolonial§!, armando insurgencias en toda África y Oriente Medio. Libia se convierte en un centro para los movimientos revolucionarios, desestabilizando a sus vecinos y propagando el caos en dos continentes."
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC: "República Árabe Siria"
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC_DESC: "Gaddafi se queda y colabora con §8Ba'athists§! para construir una §8 República Árabe Unida§!. Libia se fusiona en un estado panárabe que va desde Mauritania a Yemen, remodelando la geopolítica del mundo árabe."
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA: "Estados Unidos de América"
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA_DESC: "Gaddafi se queda y persigue un continental §8Estados Unidos de África§! con él mismo a su cabeza. Libia se convierte en la capital de una superpotencia africana, transformando todo el orden político del continente."
 RULE_OPTION_MNT_HISTORICAL: "Histórico"
 RULE_OPTION_MNT_HISTORICAL_DESC: "La facción §8Đukanović§! lleva a Montenegro a la UE y la OTAN consolidando el control oligárquico sobre las instituciones estatales y la economía. Montenegro se convierte en una nación pequeña y alineada con los occidentales, cuyas instituciones siguen interrelacionadas con las redes de delincuencia organizada y patrocinio político."
 RULE_OPTION_MNT_EUROPEAN_REFORM: "Sendero reformista"
 RULE_OPTION_MNT_EUROPEAN_REFORM_DESC: "Partidos demócratas y socialdemocráticos derrocan los oligarcas y persiguen la adhesión a la UE junto con una agresiva reforma anticorrupción y el desmantelamiento de las redes patronales. Montenegro emerge como una auténtica democracia liberal donde las instituciones estatales operan libres del crimen organizado y de la dominación oligárquica."
 RULE_OPTION_MNT_MONARCHIST_RESTORATION: "Restauración monárquica"
 RULE_OPTION_MNT_MONARCHIST_RESTORATION_DESC: "Montenegrin §8monarquistas y tradicionalistas§! restaurar la dinastía de la Casa de Petrović-Njegoš y enshrine el cristianismo ortodoxo como religión estatal. Montenegro persigue una restauración alineada por Rusia, centrada en la iglesia fuera del orden occidental en lugar de integrarse en las estructuras europeas."
 RULE_OPTION_MNT_SOCIALIST_REVIVAL: "Renacimiento socialista"
 RULE_OPTION_MNT_SOCIALIST_REVIVAL_DESC: "A §8 movimiento comunista y neoyugoslav§! toma el poder, nacionaliza la economía a lo largo de las líneas titoístas y promueve la recuperación de estructuras políticas pan-Yugoslav. Montenegro intenta revivir la federación yugoslava desde su propio territorio hacia fuera, tratando de reunir a los pueblos eslavos del sur bajo gobierno socialista."
 RULE_OPTION_PER_HISTORICAL: "Histórico"
 RULE_OPTION_PER_HISTORICAL_DESC: "La República Islámica permanece bajo el Líder Supremo, con la presidencia que pasa y sale entre los campamentos reformistas y principistas. Irán ancla el eje de la resistencia, empuja su programa nuclear a través de cada ronda de sanciones y proyecta el poder por medio de milicias aliadas del Líbano al Yemen."
 RULE_OPTION_PER_RESTORATION: "El Peacock Throne"
 RULE_OPTION_PER_RESTORATION_DESC: "Los exiliados §8Partido Constitucionalista§! trae el §8Pahlavi§! La dinastía casa y coronas Reza Pahlavi II sobre un reino secular. El orden clerical es barrido e Irán se convierte en el oeste, abandonando la red de próxies que pasó un edificio de generación."
 RULE_OPTION_PER_IRANIC_FEDERATION: "La Federación Islámica del Irán"
 RULE_OPTION_PER_IRANIC_FEDERATION_DESC: "El partido §8Pan-Iranista§! toma el poder y trabaja para reunir a los pueblos iraníes de Tayikistán, Kurdistán, Azerbaiyán y Baluchistán en una sola federación. Irán se convierte en el corazón de una nueva esfera iraní, y todos los vecinos que poseen tierras iraníes encuentran sus fronteras en cuestión."
 RULE_OPTION_PER_MOJAHEDIN: "El Mojahedin del Pueblo"
 RULE_OPTION_PER_MOJAHEDIN_DESC: "El §8Mojahedin-e Khalq§! regresa del exilio bajo Maryam Rajavi y toma el estado del clero. Irán es proclamada república popular que no debe nada a la vieja revolución, y su política exterior se reconstruye de la nada."
 RULE_OPTION_PER_FREEDOM_MOVEMENT: "El Movimiento por la Libertad"
 RULE_OPTION_PER_FREEDOM_MOVEMENT_DESC: "El Movimiento de Libertad §8 de Irán§! hereda los restos del gobierno clerical y construye una república constitucional secular que deja la fe a la conciencia privada. La Guardia Revolucionaria está despojada de la política y los negocios, e Irán vuelve a Occidente como un estado ordinario."
 RULE_OPTION_PER_NATIONAL_FRONT: "El Frente Nacional"
 RULE_OPTION_PER_NATIONAL_FRONT_DESC: "El Frente Nacional §8§! regresa como heredero de Mossadegh y reconstruye a Irán sobre el nacionalismo secular y el petróleo que la revolución despilfarró. Es para no alinearse, cortejar ni Washington ni Moscú mientras pone a los tecnócratas de vuelta al trabajo."
 RULE_OPTION_PER_GREEN_MOVEMENT: "El Movimiento Verde"
 RULE_OPTION_PER_GREEN_MOVEMENT_DESC: "El Movimiento Verde §8§! lleva a Mir-Hossein Mousavi al poder con la promesa de que finalmente se contará el voto. Irán mantiene una república islámica pero responde a su electorado, y la región pierde al Líder Supremo como dirección."
 RULE_OPTION_PER_MONTAZERI: "República de Montazeri"
 RULE_OPTION_PER_MONTAZERI_DESC: "El clero reformista alrededor de §8El Gran Ayatollah Montazeri§! lleva a los seminarios de regreso de los corredores y responde por fin a las prisiones. La fe guarda su lugar en el estado, templado por el hombre que pasó su vida condenando lo que se hizo en su nombre."
 RULE_OPTION_PER_AHMADINEJAD: "Regreso de Ahmadinejad"
 RULE_OPTION_PER_AHMADINEJAD_DESC: "§8Mahmoud Ahmadinejad§! reúne a los populistas de línea dura, paga a los pobres de la cuenta del petróleo y se atreve al mundo a detenerlo. El Basij y Ansar-e Hezbollah se convierten en el brazo del estado en casa, y la confrontación en el extranjero se convierte en el punto más que el precio."
 RULE_OPTION_PER_GHALIBAF: "Orden de Ghalibaf"
 RULE_OPTION_PER_GHALIBAF_DESC: "§8Mohammad Bagher Ghalibaf§! gobierna como el comandante que construye las cosas, negociando la libertad política para carreteras, orden y resultados. La Guardia Revolucionaria mantiene su imperio empresarial y la prensa mantiene su correa, mientras que los tribunales de Teherán Moscú para que el capital lo pague."
 RULE_OPTION_PER_MASHAEI: "Escuela iraní de Mashaei"
 RULE_OPTION_PER_MASHAEI_DESC: "§8Esfandiar Rahim Mashaei§! pone a la nación ante la fe y predica un Irán que no necesita clero entre ella y Dios. Los seminarios están rotos como una fuerza política, y el nacionalismo iraní en lugar de Shia Islam se convierte en lo que el Estado exporta."
 RULE_OPTION_PER_WORKERS_REPUBLIC: "La República Obrera"
 RULE_OPTION_PER_WORKERS_REPUBLIC_DESC: "El Partido Tudeh §8§! y la izquierda iraní regresan del exilio y proclaman una república obrera. El clero y la Guardia Revolucionaria están desmantelados juntos, e Irán busca amigos entre los restantes estados socialistas del mundo."
 RULE_OPTION_PER_ARTESH: "Dirección de Artesh"
 RULE_OPTION_PER_ARTESH_DESC: "El §8Artesh§! disuelve lo que queda del gobierno civil y gobierna a través de una dirección de sus propios oficiales. La ideología da paso al interés estatal bruto, y Irán se ocupa de sus vecinos como soldado en lugar de revolucionario."
 RULE_OPTION_HOL_OPEN_VERDICT: "Un veredicto abierto"
 RULE_OPTION_HOL_OPEN_VERDICT_DESC: "Los Países Bajos caminan por el mismo camino parlamentario pero no escribe nada de él con antelación: cualquier partido que gane las elecciones forma la coalición, §8populistas§! incluidos. Sus aliados nunca saben con qué gobierno en La Haya se enfrentarán."
 RULE_OPTION_NIG_HISTORICAL: "Histórico"
 RULE_OPTION_NIG_HISTORICAL_DESC: "El §8 Partido Democrático Popular§! mantiene el centro federal, manteniendo al norte y al sur un equilibrio religioso incómodo mientras que la amnistía en lugar de la fuerza asienta el Delta del Níger. Nigeria sigue siendo el ancla de África occidental, exportando personal de mantenimiento de la paz en lugar de inestabilidad."
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY: "Una Nigeria socialdemócrata"
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY_DESC: "El §8Todo el Partido Popular de Nigeria§! rompe el control del partido gobernante y convierte la federación hacia la industria estatal, la salud pública y una amplia red de seguridad. Un Abuja redistributivo gasta sus ingresos petrolíferos en casa, y los inversores extranjeros miran a otros lugares de la región."
 RULE_OPTION_NIG_CHRISTIAN_NATION: "A Christian Nigeria"
 RULE_OPTION_NIG_CHRISTIAN_NATION_DESC: "Abuja aboli la sharia en los estados del norte y reconstruye al gobierno federal alrededor de la §8iglesia§!, alistando milicias cristianas contra los predicadores que resisten. El norte es pacificado por la fuerza en lugar de negociar, y los vecinos musulmanes de Nigeria se vuelven fríos."
 RULE_OPTION_NIG_CALIPHATE: "El Califato de África Occidental"
 RULE_OPTION_NIG_CALIPHATE_DESC: "Sharia se extiende desde los estados del norte hasta §8Boko Haram§! se sienta dentro del gobierno en lugar de luchar contra él, y la república federal da paso a un califato. Los vecinos de Nigeria enfrentan un estado islámico expansionista al mando del ejército más grande en África Occidental."
 RULE_OPTION_BRM_HISTORICAL: "Histórico"
 RULE_OPTION_BRM_HISTORICAL_DESC: "La §8 Liga Nacional para la Democracia§! toma posesión mientras que el §8Tatmadaw§! mantiene sus puestos reservados y los ministerios de defensa, y los Rohingya son presionados en lugar de expulsados. Myanmar permanece dentro de la ASEAN, sus insurgencias étnicas se rechinan y los generales no pierden nada que no puedan recuperar."
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY: "Beacon de la democracia"
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY_DESC: "El §8National League for Democracy§! Desmantela el papel constitucional del ejército y construye un estado federal con autonomía étnica y ciudadanía rohingya. Myanmar se convierte en una democracia federal multiétnica y cambia hacia las alianzas regionales."
 RULE_OPTION_BRM_AN_IRON_FIST: "Un puño de hierro"
 RULE_OPTION_BRM_AN_IRON_FIST_DESC: "El §8Tatmadaw§! endurece el gobierno militar y aplasta la oposición, suprimiendo las insurgencias étnicas y rechazando la presión internacional para la reforma democrática. Myanmar deja la ASEAN, expulsa a los rohingya y se vuelve hacia el enfrentamiento con sus vecinos."
 RULE_OPTION_NRY_HISTORICAL: "Histórico"
 RULE_OPTION_NRY_HISTORICAL_DESC: "La coalición central da paso y §8Labour§! recupera al gobierno, gasta el fondo petrolífero en el estado de bienestar y mantiene a Noruega firmemente dentro de la alianza. Oslo hace carrera en las conversaciones de paz y la ayuda para el desarrollo mientras se mantiene fuera de la Unión a sus vecinos."
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES_DESC: "El §8Partido Popular cristiano§! mantiene la estreno y escribe la moral de la familia, la ayuda para el desarrollo y una generosa cuota de refugiados en política nacional. Noruega perfora con la alianza pero mantiene a Bruselas a lo largo del brazo, llevando a los migrantes sus vecinos sureños no pueden."
 RULE_OPTION_NRY_PROGRESS_DESC: "El §8Partido Progreso§! se descompone de la oposición y gasta la riqueza petrolera en recortes fiscales, salas de hospitales y cuidado para los ancianos más que en ayuda extranjera. Noruega centraliza, endurece su ley de inmigración y convierte una cara más fría a los vecinos nórdicos que una vez contaron con ella."
 RULE_OPTION_NKO_HISTORICAL: "Histórico"
 RULE_OPTION_NKO_HISTORICAL_DESC: "El hijo menor de Kim Jong-il es nombrado sucesor y hereda el estado, y el §8 Partido Laborista de Corea§! reafirma su mandato sobre los generales antes de comprometerse a §8Byungjin§!: cabezas de guerra y bienes de consumo a la vez. La dinastía sostiene, los comerciantes del mercado son tolerados pero nunca confiados, y la península permanece congelada donde el armisticio lo dejó."
 RULE_OPTION_NKO_KIM_JONG_NAM: "El heredero reformista"
 RULE_OPTION_NKO_KIM_JONG_NAM_DESC: "El hermano mayor exiliado gana la lucha de sucesión y convierte al §8 Partido Laborista de Corea§! en una apertura al estilo chino, negociando §8Juche§! para zonas económicas especiales, empresas conjuntas y eventualmente una votación. Pyongyang intercambia aislamiento para la inversión, y Seúl finalmente tiene un vecino con el que puede negociar."
 RULE_OPTION_NKO_MILITARY_JUNTA: "Los Generales se apoderan"
 RULE_OPTION_NKO_MILITARY_JUNTA_DESC: "El personal general se niega a ambos herederos Kim y toma el poder en sí mismo, manteniendo §8Songun§! y purgando la familia que sobrevivió su utilidad. El comercio chino mantiene al país alimentado mientras el ejército no responde a ningún partido, y cada vecino debe planear alrededor de un estado nuclear dirigido por soldados."
 RULE_OPTION_POL_HISTORICAL: "Histórico"
 RULE_OPTION_POL_HISTORICAL_DESC: "Polonia termina su transición bajo la izquierda post-comunista, se une a la Unión Europea y luego entrega al país a §8Ley y Justicia§!, que gobierna contra Moscú y se apoya en Washington. Varsovia se convierte en la voz oriental más fuerte de la OTAN y un irritante permanente para Berlín y Bruselas."
 RULE_OPTION_POL_CIVIC_PLATFORM: "Años de la Plataforma Cívica"
 RULE_OPTION_POL_CIVIC_PLATFORM_DESC: "§8La Plataforma Cívica§! mantiene al gobierno y está en juego el futuro de Polonia sobre el euro, la inversión alemana y los fondos que vienen con ellos. Varsovia se convierte en el socio más confiable que Bruselas tiene en la región, y mantiene su línea en Moscú mientras lo hace."
 RULE_OPTION_POL_WALESA: "Wałęsa regresa"
 RULE_OPTION_POL_WALESA_DESC: "Los §8demócratas cristianos§! llevan a Lech Wałęsa de vuelta al palacio presidencial en la memoria de Solidaridad. Polonia permanece firmemente dentro de la OTAN y gasta su crédito para reconstruir el ejército en lugar de perseguir a la corriente europea."
 RULE_OPTION_POL_KORWIN_COMMONWEALTH: "Korwin y el Commonwealth"
 RULE_OPTION_POL_KORWIN_COMMONWEALTH_DESC: "Janusz Korwin-Mikke y la §8Real Politics Union§! despojan al Estado a sus fundaciones y corte Lituania, Belarús y Ucrania como iguales. Una Comunidad revivida crece entre Alemania y Rusia sin dejar nunca la alianza occidental."
 RULE_OPTION_POL_KORWIN_EAST: "Korwin se convierte en el este"
 RULE_OPTION_POL_KORWIN_EAST_DESC: "Janusz Korwin-Mikke y §8Real Politics Union§! resuelven las viejas cuentas de Polonia al tratar directamente con Moscú y Minsk. Varsovia sale del campamento occidental, presiona su reclamo sobre Lviv y toma su asiento en la CSTO."
 RULE_OPTION_POL_FALANGA: "El Levántate de Falanga"
 RULE_OPTION_POL_FALANGA_DESC: "Las milicias callejeras y un frente nacionalista unido llevan §8Falanga§! de los márgenes al gobierno. Polonia deja a la Unión Europea y a la OTAN para un estado confesionario militarizado que disuelve a todos los vecinos que tiene."
 RULE_OPTION_POL_RED_DREAM: "El sueño rojo"
 RULE_OPTION_POL_RED_DREAM_DESC: "Una segunda revolución pone la §8Partido Socialista Polaco§! Polonia rompe con Occidente, suspende sus elecciones y se reconstituye como una república obrera."
 RULE_OPTION_POL_PEOPLES_ARMY: "El Ejército Popular"
 RULE_OPTION_POL_PEOPLES_ARMY_DESC: "Los endurecedores de los §8Unión de Comunistas Polacos§! tomar la revolución y reconstruir el Ejército Popular como columna vertebral del estado. Polonia se convierte en una guarnición de un nuevo bloque oriental y mira hacia el oeste con hostilidad abierta."
 RULE_OPTION_ROM_HISTORICAL: "Histórico"
 RULE_OPTION_ROM_HISTORICAL_DESC: "El §8Partido Social Democrático§! bajo Iliescu y Năstase combate la corrupción endémica con una nueva dirección anticorrupción al privatizar la industria y reconstruir la economía. Rumania se une a la OTAN y luego a la Unión Europea, asegurandose como una democracia occidental anclada en instituciones más que en cultos de personalidad."
 RULE_OPTION_ROM_NATIONAL_LIBERAL: "La República Liberal"
 RULE_OPTION_ROM_NATIONAL_LIBERAL_DESC: "El §8Partido Nacional Liberal§! toma el poder abogando por la tributación plana, la liberalización del mercado y la descentralización para desencadenar empresa privada e iniciativa individual. Rumania construye una identidad europea en torno a principios liberales y de libre mercado e integra más profundamente en Occidente que su alternativa socialdemocrática lo permitiría."
 RULE_OPTION_ROM_PEASANT_PARTY: "Los demócratas cristianos sostienen"
 RULE_OPTION_ROM_PEASANT_PARTY_DESC: "El §8Partido Nacional Democrático Cristiano§! sobrevive el colapso de la Convención Democrática y mantiene al campo el centro de la política rumana, enfatizando la inversión rural, el renacimiento agrario y el conservadurismo religioso. La restitución de la tierra devuelve propiedad a los comunistas desposeídos, dando a los agricultores de la nación una participación en el nuevo orden."
 RULE_OPTION_ROM_DEMOCRATIC_PARTY: "El Partido de Europa"
 RULE_OPTION_ROM_DEMOCRATIC_PARTY_DESC: "El §8Partido Democrático§! bajo Băsescu toma el centro político, luego fusiona las alas socialdemocráticas y conservadoras del país en un solo partido avowedly pro-europeo. La integración europea se convierte en el objetivo definitorio de la política rumana, subordinando todas las demás preocupaciones al trabajo de unirse a Occidente."
 RULE_OPTION_ROM_RESTORED_MONARCHY: "La Corona devuelve"
 RULE_OPTION_ROM_RESTORED_MONARCHY_DESC: "La Convención Democrática se remueve, llama a un referéndum sobre la monarquía, y §8Regresa Miguel I§! a su trono, restaurando la autoridad simbólica de la corona después de cincuenta años del comunismo. El liderazgo de Rumania reclama el antiguo derecho de la corona a la realeza sobre todos los rumanos, incluyendo aquellos en Moldavia, Ucrania y más allá."
 RULE_OPTION_ROM_GREATER_ROMANIA: "Mayor Rumania"
 RULE_OPTION_ROM_GREATER_ROMANIA_DESC: "Corneliu Vadim Tudor §8El gran partido rumano§! toma la presidencia y convierte los servicios de seguridad y prensa en instrumentos del Estado parte, consolidando el poder a través del miedo y la propaganda. Rumania persigue la reunificación forzosa de todas las tierras rumanas, amenazando a Moldova, Hungría, Bulgaria, Ucrania y Serbia y convirtiendo la región en un punto de inflexión."
 SOV_AI_BEHAVIOR: "@SOV Russia"
 RULE_OPTION_SOV_HISTORICAL: "Histórico"
 RULE_OPTION_SOV_HISTORICAL_DESC: "Rusia reconstruye la verticalidad del poder bajo §8Rusia Unida§!, lleva a los oligarcas a talar y convierte la riqueza energética en una postura de gran potencia restaurada. Sus vecinos enfrentan un estado que lleva a Crimea, respalda las repúblicas de Donbass y al final se mueve en Ucrania en vigor."
 RULE_OPTION_SOV_OLIGARCHS: "República de los Oligarch"
 RULE_OPTION_SOV_OLIGARCHS_DESC: "Los hombres que compraron Rusia en las privatizaciones lo mantienen, y los §8oligarcas§! ejecutan el estado como una empresa de tenencia para sus propios activos. El capital extranjero encuentra todas las puertas abiertas mientras que el ejército y el bolso público quedan para pagar el arreglo."
 RULE_OPTION_SOV_LIBERAL_REFORM: "El giro liberal"
 RULE_OPTION_SOV_LIBERAL_REFORM_DESC: "§8Yabloko§! y el §8Unión de las Fuerzas Derecha§! ganan el argumento sobre el futuro de Rusia y reconstruyen sus cortes, su prensa y su economía en líneas occidentales. Los comercios de Moscú aprovechan a sus vecinos para colaborar con Europa y los Estados Unidos."
 RULE_OPTION_SOV_COMMUNIST_REVIVAL: "Revival rojo"
 RULE_OPTION_SOV_COMMUNIST_REVIVAL_DESC: "El §8Partido Comunista de la Federación Rusa§! toma el poder en una promesa de deshacer las privatizaciones y reunir a las repúblicas soviéticas. La renacionalización en casa y un bloque oriental reavivado en el extranjero pusieron a Rusia en la cabeza de un campamento rival otra vez."
 RULE_OPTION_SOV_NATIONALIST: "Rusia más grande"
 RULE_OPTION_SOV_NATIONALIST_DESC: "El §8 Partido Democrático Liberal§! lleva el resentimiento al poder y va después de cada frontera que cree que Rusia es adeudada. Desde el Báltico hasta Asia Central los vecinos se convierten en reclamos de ser presionados más que estados a tratar."
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK: "La Orden Nacional Bolchevique"
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK_DESC: "El §8Bolcheviques nacionales§! fuse rojo y marrón en un estado revolucionario que no responde a los liberales ni a los oligarcas. Rusia reúne las tierras rusas por la fuerza y trata las fronteras post-soviéticas como un insulto temporal."
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE: "El Presidente de Hierro"
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE_DESC: "Dmitry Medvedev se niega a devolver la presidencia y construye un estado de seguridad propio encima del que heredó. Las rupturas tándem en público, y los hombres alrededor de su predecesor son expulsados de la política rusa."
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL: "Medvedev's Thaw"
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL_DESC: "Dmitry Medvedev hace real su programa de modernización, aflojando el control de los servicios de seguridad y cortejando la tecnología occidental y el capital. Rusia liberaliza en casa y suaviza al extranjero, y el siloviki pierde el argumento para siempre."
 RULE_OPTION_SAU_HISTORICAL: "Histórico"
 RULE_OPTION_SAU_HISTORICAL_DESC: "El §8Casa de Saud§! mantiene el trono a través de una sucesión ininterrumpida, gasta sus ingresos petroleros en diversificarse lejos del petróleo, y mantiene la relación de seguridad estadounidense al tiempo que contiene Irán hasta que los corredores de Pekín un deshielo. Arabia Saudita mantiene el ancla del Golfo y el socio senior de cada monarquía a lo largo de él."
 RULE_OPTION_SAU_KHALEEJI_UNION: "La Unión Khaleeji"
 RULE_OPTION_SAU_KHALEEJI_UNION_DESC: "El Reino impulsa al Consejo de Cooperación del Golfo desde una tienda de conversación en un solo estado, primero una moneda compartida y un comando conjunto, luego una unión política bajo Riyadh. Las monarquías del Golfo más pequeñas son absorbidas de manera directa y no existen como países independientes."
 RULE_OPTION_SAU_FAISALITE_KINGDOM: "La Restauración Faisalita"
 RULE_OPTION_SAU_FAISALITE_KINGDOM_DESC: "Una corriente reaccionaria en la familia real gana la sucesión, restablece el §8Wahhabi ulema§! a la autoridad que mantuvieron bajo el rey Faisal, y expulsa dinero extranjero y bases extranjeras fuera del país. El Reino cierra su frontera enteramente o se establece como un tercer polo que conduce al mundo musulmán contra ambas superpotencias."
 RULE_OPTION_SAU_MILITARY_RULE: "La Coup de los oficiales"
 RULE_OPTION_SAU_MILITARY_RULE_DESC: "El ejército regular, hambriento de fondos mientras la Guardia Nacional mantiene sus privilegios, depone al Rey y gobierna a través del §8Supreme Military Council§!Los oficiales gobiernan un golfo que ya no sabe quién habla por Riad, y su agarre dura sólo mientras la legitimidad que pueden comprar."
 RULE_OPTION_SAU_BAATHIST_REPUBLIC: "La República Socialista Árabe"
 RULE_OPTION_SAU_BAATHIST_REPUBLIC_DESC: "Con la monarquía se fue el §8Partido Árabe Ba'ath§! toma la república, nacionaliza las alturas dominantes y reconstruye al ejército como vanguardia de la unidad árabe. Las guarniciones extranjeras se dan aviso en toda la península y cada capital árabe es invitado a un solo estado."
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC: "República de Shia"
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC_DESC: "La larga presión §8Partidos chiítas§! de la Provincia Oriental hereda la república y elige entre un asentamiento constitucional y el camino del Jomeinista. Las mayores reservas petrolíferas del Golfo cambian de bando, y Teherán gana el aliado que pasó décadas buscando."
 RULE_OPTION_SAU_PEOPLES_REPUBLIC: "La República Roja"
 RULE_OPTION_SAU_PEOPLES_REPUBLIC_DESC: "El §8Partido Comunista§! toma la república, nacionaliza los campos petroleros y convierte la península en una base para la revolución en todo el mundo árabe. Riyadh firma con Moscú o conduce al bloque no alineado, y las monarquías del Golfo despiertan a un enemigo en su frontera."
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC: "El experimento demócrata"
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC_DESC: "La Asamblea Nacional Democrática §8§! gana las elecciones constitutivas y escribe una constitución liberal con un Majlis electo, un poder judicial independiente y una prensa libre. Occidente gana su primera democracia árabe en el Golfo, y toda monarquía vecina tiene que explicar por qué no es una."
 PMR_AI_BEHAVIOR: "@PMR Transnistria"
 RULE_OPTION_PMR_HISTORICAL: "Histórico"
 RULE_OPTION_PMR_HISTORICAL_DESC: "Tiraspol permanece en manos de Igor Smirnov y los sucesores que heredan su república, negociando conversaciones con Chisinau para una mayor dependencia del gas ruso, rublos y el personal de mantenimiento de la paz. El conflicto de Dniester se mantiene congelado y Moldavia no consigue nada que pueda llamar a un acuerdo."
 RULE_OPTION_PMR_DEMOCRATIC: "Puentes a Chisinau"
 RULE_OPTION_PMR_DEMOCRATIC_DESC: "Transnistria da poder a sus §8liberales§!, desmantela el aparato de seguridad de tiempos de guerra y negocia su camino hacia Moldavia como socio federal. Moscú pierde su posición en el Dniester y la Unión Europea gana una frontera establecida."
 RULE_OPTION_PMR_REPUBLICAN: "El giro republicano"
 RULE_OPTION_PMR_REPUBLICAN_DESC: "El partido §8Republic§! lleva a Tiraspol en un programa de gobierno limpio, pequeño negocio y una independencia que no responde a nadie. Transnistria deja de ser una guarnición rusa y comienza a tratar de ser un estado."
 RULE_OPTION_PMR_COMMUNIST: "Estandarte rojo restaurado"
 RULE_OPTION_PMR_COMMUNIST_DESC: "El §8Partido Comunista§! vuelve al poder en Tiraspol, nacionaliza la tenencia del Sheriff y reabre el caso para una revivida SSR Moldavian. Chisinau se enfrenta a un vecino que quiere recuperar su territorio en lugar de un asentamiento."
 RULE_OPTION_PMR_MONARCHIST: "Corona en el Dniester"
 RULE_OPTION_PMR_MONARCHIST_DESC: "Los §8monarquistas§! coronan un soberano en el Dniester y reconstruir Transnistria como el último fragmento sobreviviente de la Rusia imperial. Tiraspol negocia la nostalgia soviética para un tribunal, un guardia y una reclamación a una legitimidad mayor."
 RULE_OPTION_PMR_MILITARY_JUNTA: "La República General"
 RULE_OPTION_PMR_MILITARY_JUNTA_DESC: "El general Alexander Lebed es llamado de Krasnoyarsk para dirigir la república que defendió, y los §8oficers del 14.º Ejército§! llevan a los ministerios con él. Transnistria se arma contra Chisinau y Bucarest en lugar de esperar el permiso de Moscú."
 RULE_OPTION_PMR_UKRAINIAN: "Hacia Kiev"
 RULE_OPTION_PMR_UKRAINIAN_DESC: "Tiraspol expulsa a sus patronos rusos, invita a los oficiales y administradores ucranianos a reemplazarlos, y coloca la adhesión a Ucrania en un referéndum. El Dniester deja de ser el puesto occidental de Rusia y se convierte en la frontera oriental de Kiev."
 SWI_AI_BEHAVIOR: "@SWI Switzerland"