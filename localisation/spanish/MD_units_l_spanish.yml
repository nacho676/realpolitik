 fighter: "Caza de Superioridad Aérea"
 Strike_fighter: "Caza de Ataque"
 L_Strike_fighter: "Caza de Ataque Ligero"
 CV_L_Strike_fighter: "Caza de Ataque para Portaviones"
 multi_role_fighter: "Caza Multifunción"
 cv_multi_role: "Caza Multifunción para Portaviones"
 cas: "Apoyo Aéreo Cercano"
 strat_bomber: "Bombardeo Estratégico"
 transport_plane: "Avión de Transporte"
 attack_helicopter: "Helicóptero de Ataque"
 Air_UAV: "Vehículo Aéreo no Tripulado de Combate"
 transport_helicopter: "Helicóptero de Transporte"
 Militia_Bat: "Milicia"
 Militia_Bat_desc: "Batallón de milicias a pie. Las unidades de milicias se caracterizan por tener menos equipo pesado y menos kits de comunicación que la infantería normal. Eso las hace muy móviles y eficaces en mal terreno, pero se deshacen rápido en terreno llano frente a un oponente blindado.\n\n§GConsejo del diseñador: Las Milicias ofrecen un frente defensivo barato y Supresión. Rinden mejor en ciudades, bosques y colinas, pero tienen mala Defensa y Ruptura y son especialmente vulnerables a los blindados y al combate en terreno abierto o duro.§!"
 Mot_Militia_Bat: "Milicia Motorizada"
 Mot_Militia_Bat_desc: "Batallón de milicias con camionetas o incluso vehículos utilitarios blindados. Las unidades de milicias se caracterizan por tener menos equipo pesado y menos kits de comunicación que la infantería normal. Eso las hace muy móviles y eficaces en mal terreno, pero se deshacen rápido en terreno llano frente a un oponente blindado.\n\n§GConsejo del diseñador: Las Milicias motorizadas cambian algo de economía por Velocidad y mayor Supresión. Úsalas para seguridad móvil y explotación barata en llanuras o desiertos, pero sus débiles estadísticas de combate y sus penalizaciones en terreno difícil las hacen malas tropas de asalto.§!"
 L_Inf_Bat: "Infantería Ligera"
 L_Inf_Bat_desc: "Infantería ligera sin transportes. Rara vez se ve en el campo de batalla moderno, pero existen unidades especializadas en terrenos muy difíciles, como la selva y las montañas, donde son muy eficaces. También puede servir como guarnición urbana.\n\n§GConsejo del diseñador: La Infantería ligera ofrece alta Organización y buen rendimiento de combate en colinas, bosques, montañas, selvas, pantanos y ciudades sin necesitar vehículos. Úsala para mantener o atacar terreno difícil, pero espera un movimiento estratégico lento y ataques más débiles en llanuras y desiertos.§!"
 Mot_Inf_Bat: "Infantería Motorizada"
 Mot_Inf_Bat_desc: "La infantería motorizada usa todo tipo de vehículos utilitarios como transporte, desde camionetas hasta modernos vehículos resistentes a minas. Ofrece movilidad rápida en el campo de batalla donde los caminos y el terreno abierto favorecen el movimiento de vehículos.\n\n§GConsejo del diseñador: La Infantería motorizada aporta Velocidad asequible y buen rendimiento en terreno abierto. Úsala para explotar brechas y apoyar frentes rápidos, pero sus vehículos aumentan la demanda de equipo y pierde eficacia en bosques, montañas, selvas, pantanos y ciudades.§!"
 Mech_Inf_Bat: "Infantería Mecanizada"
 Mech_Inf_Bat_desc: "La infantería mecanizada usa transportes blindados de personal como transporte. Es muy apta para el combate blindado en terreno llano.\n\n§GConsejo del diseñador: La Infantería mecanizada combina gran Defensa y movilidad blindada con buen rendimiento en llanuras y desiertos. Úsala para mantener la línea en formaciones blindadas rápidas, pero los transportes blindados son costosos y su ataque y movimiento sufren en bosques, montañas, selvas y ciudades.§!"
 Arm_Inf_Bat: "Infantería Blindada"
 Arm_Inf_Bat_desc: "La infantería blindada usa vehículos de combate de infantería como transporte. Es muy apta para el combate blindado en terreno llano, pero se desperdicia en terreno difícil, donde debe operar a pie lejos de sus vehículos.\n\n§GConsejo del diseñador: La Infantería blindada usa vehículos de combate de infantería para obtener más potencia de fuego, Blindaje y Ruptura que la infantería mecanizada. Úsala junto a los tanques en terreno abierto, pero su menor Organización, su alto costo de equipo y las graves penalizaciones en montaña, selva, pantano y zonas urbanas exigen un despliegue cuidadoso.§!"
 L_Air_Inf_Bat: "Infantería aerotransportada"
 L_Air_Inf_Bat_desc: "La infantería aerotransportada ligera es infantería de élite, con entrenamiento especial en inserción aérea mediante lanzamientos en paracaídas desde aviones de transporte o con helicópteros de transporte. Puede responder desde lejos a emergencias y ser insertada tras las líneas enemigas para tomar objetivos vitales antes del avance del ejército principal. Su modo de transporte impone límites estrictos a la cantidad de equipo pesado que puede llevar.\n\n§GConsejo del diseñador: La Infantería aerotransportada combina alta Organización con capacidad de lanzamiento en paracaídas y buen rendimiento en terreno difícil. Úsala para tomar y mantener objetivos aislados, pero su entrenamiento de fuerzas especiales y su mayor demanda de equipo de infantería la hacen costosa para el combate de línea rutinario.§!"
 Mot_Air_Inf_Bat: "Infantería Motorizada Aerotransportada"
 Mot_Air_Inf_Bat_desc: "La infantería aerotransportada motorizada es infantería de élite, con entrenamiento especial en inserción aérea mediante lanzamientos en paracaídas desde aviones de transporte o con helicópteros de transporte. Puede responder desde lejos a emergencias y ser insertada tras las líneas enemigas para tomar objetivos vitales antes del avance del ejército principal. Sus vehículos utilitarios le dan gran movilidad tras la inserción y le permiten llevar más equipo pesado al combate. Aun así, lanzarla en paracaídas junto con vehículos exige una logística mucho más compleja.\n\n§GConsejo del diseñador: La Infantería aerotransportada motorizada suma Velocidad tras el lanzamiento y rinde bien en terreno abierto. Úsala cuando una fuerza aerotransportada deba explotar o reforzar con rapidez, pero los vehículos aumentan la carga de equipo y reducen la Organización y el rendimiento en terreno difícil frente a las tropas aerotransportadas a pie.§!"
 Mech_Air_Inf_Bat: "Infantería Mecanizada Aerotransportada"
 Mech_Air_Inf_Bat_desc: "La infantería aerotransportada mecanizada es infantería de élite, con entrenamiento especial en inserción aérea mediante lanzamientos en paracaídas desde aviones de transporte. Puede responder desde lejos a emergencias y ser insertada tras las líneas enemigas para tomar objetivos vitales antes del avance del ejército principal. Sus transportes blindados ligeros de personal, diseñados para ello, le dan gran movilidad tras la inserción y le permiten llevar mucho más equipo pesado al combate que las fuerzas aerotransportadas más ligeras. Aun así, lanzarla en paracaídas junto con esos vehículos exige una logística mucho más compleja.\n\n§GConsejo del diseñador: La Infantería aerotransportada mecanizada aporta protección de transporte blindado, Velocidad y mayor potencia de fuego a los lanzamientos en paracaídas. Úsala cuando fuerzas aerotransportadas aisladas deban sobrevivir a un combate móvil tras el aterrizaje, pero su menor Organización, su gran demanda de equipo y las graves penalizaciones en terreno difícil la hacen una opción especializada y costosa.§!"
 Arm_Air_Inf_Bat: "Infantería Acorazada Aerotransportada"
 Arm_Air_Inf_Bat_desc: "La infantería aerotransportada blindada es infantería de élite, con entrenamiento especial en inserción aérea mediante lanzamientos en paracaídas desde aviones de transporte. Puede responder desde lejos a emergencias y ser insertada tras las líneas enemigas para tomar objetivos vitales antes del avance del ejército principal. Sus vehículos ligeros de combate de infantería, diseñados para ello, le dan gran movilidad y le permiten luchar en igualdad de condiciones contra formaciones mecanizadas normales. Aun así, lanzar en paracaídas a estas tropas junto con sus vehículos exige una logística extremadamente compleja. A 2017, solo Rusia ha operado esas fuerzas.\n\n§GConsejo del diseñador: La Infantería aerotransportada blindada ofrece potencia de fuego de vehículo de combate de infantería, Blindaje y Ruptura por lanzamiento en paracaídas. Úsala para disputar objetivos defendidos o enfrentar reservas móviles enemigas tras la inserción, pero su carga de equipo muy alta, su baja Organización y las penalizaciones en terreno difícil hacen costosas las pérdidas.§!"
 L_Marine_Bat: "Infantería de Marina"
 L_Marine_Bat_desc: "La infantería de marina es infantería de élite con entrenamiento especial en operaciones anfibias, como cruces de ríos, operaciones en pantanos e invasiones anfibias. Como no tiene vehículos, hay límites estrictos a la cantidad de equipo pesado que puede llevar.\n\n§GConsejo del diseñador: La infantería de marina aporta alta Organización y buen rendimiento anfibio y en pantanos sin costo de vehículos. Úsala para establecer cabezas de playa y combatir en humedales, pero es más lenta tras el desembarco, consume capacidad de fuerzas especiales y rinde menos en terreno abierto.§!"
 Mot_Marine_Bat: "Infantería Motorizada de Marina"
 Mot_Marine_Bat_desc: "La infantería de marina motorizada es infantería de élite con entrenamiento especial en operaciones anfibias, como cruces de ríos, operaciones en pantanos e invasiones anfibias. Aunque desembarca como infantería ligera, tiene vehículos utilitarios como transporte terrestre, lo que le da gran movilidad y le permite llevar grandes cantidades de equipo pesado al combate.\n\n§GConsejo del diseñador: La Infantería de marina motorizada conserva un fuerte bono anfibio y suma Velocidad para expandirse rápido desde una cabeza de playa. Úsala cuando la fuerza de desembarco deba moverse tierra adentro con rapidez, pero sus vehículos cuestan más equipo y reducen la Organización y el rendimiento en montaña frente a los marines a pie.§!"
 Mech_Marine_Bat: "Infantería Mecanizada de Marina"
 Mech_Marine_Bat_desc: "La infantería de marina mecanizada es infantería de élite con entrenamiento especial en operaciones anfibias, como cruces de ríos, operaciones en pantanos e invasiones anfibias. Como desembarca protegida en transportes blindados anfibios de personal diseñados para ello, está muy preparada para atacar de inmediato con gran movilidad y llevar grandes cantidades de equipo pesado al combate.\n\n§GConsejo del diseñador: Los marines mecanizados combinan un bono anfibio con la protección de los transportes blindados y una gran movilidad tras el desembarco. Úsalos para ampliar y mantener cabezas de playa mecanizadas, pero tienen menos Organización que los marines más ligeros y sus vehículos rinden mal en bosques y montañas.§!"
 Arm_Marine_Bat: "Infantería Acorazada de Marina"
 Arm_Marine_Bat_desc: "La infantería de marina blindada es infantería de élite con entrenamiento especial en operaciones anfibias, como cruces de ríos, operaciones en pantanos e invasiones anfibias. Puede cruzar grandes distancias por agua en sus vehículos anfibios de combate de infantería, muy blindados y propulsados a chorro, y estar lista para combatir desde esos mismos vehículos con gran pericia al llegar a la costa.\n\n§GConsejo del diseñador: Los Marines blindados ofrecen la mayor potencia de fuego de vehículo de combate de infantería, Blindaje y capacidad de combate urbano entre la infantería de marina, y conservan un bono anfibio. Úsalos contra puertos muy defendidos, pero su baja Organización, su alto costo y las graves penalizaciones en montaña y selva exigen tropas más ligeras para el terreno difícil tierra adentro.§!"
 L_Air_assault_Bat: "Infantería de Asalto Aéreo"
 L_Air_assault_Bat_desc: "La infantería de asalto aéreo es infantería de élite, con entrenamiento especial en descenso con cuerdas y transporte aéreo; su equipo a veces se diseña o se modifica en el campo para facilitar el transporte en aeronaves. Suele usarse para tomar y mantener terreno clave que no está del todo asegurado y para enfrentar directamente a fuerzas enemigas tras las líneas.\n\n§GConsejo del diseñador: La Infantería de asalto aéreo usa helicópteros de transporte para operaciones rápidas y obtiene bonos de combate en casi todo terreno difícil. Úsala para tomar colinas, bosques, montañas, selvas, pantanos o ciudades remotos, pero su poca Fuerza, su mal Atrincheramiento y sus costosos helicópteros hacen arriesgado el combate prolongado en línea.§!"
 attack_helo_bat: "Regimiento de helicópteros de ataque"
 attack_helo_bat_desc: "Los regimientos de helicópteros de ataque concentran helicópteros artillados para ataques antiblindaje rápidos y apoyo cercano en un frente amplio.\n\n§GConsejo del diseñador: Los Helicópteros de ataque ofrecen potencia de fuego blindada rápida y fuertes ataques en llanuras y desiertos. Úsalos para reforzar rupturas o cazar blindados en terreno abierto, pero su Organización y Fuerza muy bajas, sus costosas aeronaves y su mal rendimiento en ciudades, montañas, bosques y selvas hacen peligroso el combate sostenido.§!"
 attack_helo_comp: "Compañía de helicópteros de ataque"
 attack_helo_comp_desc: "Una compañía de helicópteros de ataque brinda apoyo rápido de helicópteros artillados y potencia de fuego antiblindaje móvil a las formaciones de primera línea.\n\n§GConsejo del diseñador: Una Compañía de helicópteros de ataque suma potencia de fuego blindada rápida sin Ancho de combate. Úsala como apoyo flexible para divisiones de infantería, móviles, blindadas o de marina, pero las aeronaves y el equipo de mando son costosos y ataca con menos eficacia en ciudades y selvas.§!"
 Special_Forces: "Fuerzas de Operaciones Especiales"
 Special_Forces_desc: "Las fuerzas de operaciones especiales son la élite de cualquier ejército donde existen, con un entrenamiento más largo y duro que cualquier otro. Son expertas en terrenos difíciles, operaciones aerotransportadas y desembarcos anfibios. Sin embargo, están muy ligeramente equipadas, ya que pueden necesitar operar con movilidad tras las líneas del frente.\n\n§GConsejo del diseñador: Las Fuerzas de operaciones especiales ofrecen una Organización y una Recuperación excepcionales y bonos amplios de terreno, con capacidad de lanzamiento en paracaídas y extracción costera. Úsalas para las incursiones más difíciles y los objetivos disputados, pero su gran Ancho de combate, su entrenamiento larguísimo, su tope de fuerzas especiales y su equipo ligero las hacen inadecuadas como infantería de línea ordinaria.§!"
 armor_Bat: "Compañía de tanques"
 armor_Bat_desc: "Una compañía de tanques cuenta solo con los vehículos más blindados que existen: los tanques de batalla principales. Con excelente movilidad en terreno llano y un fuego directo feroz, están diseñados para abrir brechas en las líneas enemigas que la infantería mecanizada de seguimiento pueda explotar con rapidez.\n\n§GConsejo del diseñador: Los Tanques ofrecen mucho Blindaje, Ruptura y potencia de fuego contra blancos duros, con excelentes bonos en llanuras y desiertos. Úsalos como punta de lanza de las divisiones ofensivas, pero consumen costosos equipos de tanques y de mando, tienen baja Organización y sufren grandes penalizaciones en bosques, montañas, selvas, pantanos y ciudades.§!"
 armor_Comp: "Compañía de Tanques"
 armor_Comp_desc: "Una compañía de tanques cuenta solo con los vehículos más blindados que existen: los tanques de batalla principales. Con excelente movilidad en terreno llano y un fuego directo feroz, están diseñados para abrir brechas en las líneas enemigas que la infantería mecanizada de seguimiento pueda explotar con rapidez.\n\n§GConsejo del diseñador: Una Compañía de tanques suma Blindaje, Ruptura y potencia de fuego móvil sin Ancho de combate. Úsala para reforzar formaciones de infantería o móviles aptas para el combate en terreno abierto, pero sus tanques y su equipo de mando son costosos y avanza lento y ataca mal en montañas, selvas y pantanos.§!"
 L_Recce_Comp: "Compañía de reconocimiento de infantería"
 L_Recce_Comp_desc: "Las compañías de reconocimiento de infantería operan a pie y por eso carecen de gran parte del equipo pesado que hace eficaz a una unidad de combate. Se infiltran cerca del enemigo para observar e informar sobre su actividad, y usan tanto el reconocimiento con drones como la vigilancia electrónica para reunir información. También pueden realizar incursiones y emboscadas limitadas. Las compañías de reconocimiento suelen llamarse «escuadrones» por su herencia como antiguas unidades de caballería.\n\n§GConsejo del diseñador: El Reconocimiento de infantería suma Reconocimiento e Iniciativa sin Ancho de combate y conserva pequeños bonos en bosques, montañas, selvas y colinas. Úsalo en divisiones a pie, aerotransportadas, de movilidad aérea, de marina o de fuerzas especiales, pero exige más mano de obra que otros elementos de reconocimiento y aporta poca potencia de fuego.§!"
 Mot_Recce_Comp: "Compañía de Exploración Motorizada"
 Mot_Recce_Comp_desc: "Las compañías de reconocimiento motorizadas operan con vehículos utilitarios y tienen gran parte del mismo equipo que sus pares de infantería, pero con funciones distintas. Se infiltran cerca del enemigo para observar e informar sobre su actividad y usan tanto el reconocimiento con drones como la vigilancia electrónica para reunir información. También pueden realizar incursiones y emboscadas limitadas. Las compañías de reconocimiento suelen llamarse «escuadrones» por su herencia como antiguas unidades de caballería.\n\n§GConsejo del diseñador: El Reconocimiento motorizado aporta más Reconocimiento e Iniciativa que los exploradores a pie, acompaña a las formaciones móviles y suma movilidad en terreno abierto. Úsalo en divisiones motorizadas o de marina, pero los vehículos utilitarios aumentan el costo y se vuelve lento en montañas, selvas y pantanos.§!"
 Mech_Recce_Comp: "Compañía de Exploración Mecanizada"
 Mech_Recce_Comp_desc: "Las compañías de reconocimiento mecanizadas operan con transportes blindados de personal y tienen gran parte del mismo equipo que sus pares de infantería, pero con funciones distintas. Se infiltran cerca del enemigo para observar e informar sobre su actividad y usan tanto el reconocimiento con drones como la vigilancia electrónica para reunir información. También pueden realizar incursiones y emboscadas limitadas. Las compañías de reconocimiento suelen llamarse «escuadrones» por su herencia como antiguas unidades de caballería.\n\n§GConsejo del diseñador: El Reconocimiento mecanizado aporta mucho Reconocimiento e Iniciativa sin Ancho de combate, acompaña a las formaciones de transportes blindados y mejora el movimiento en llanuras. Úsalo en divisiones blindadas o de marina, pero el costo de sus transportes blindados y equipo de apoyo es alto y se vuelve lento en montañas y pantanos.§!"
 Arm_Recce_Comp: "Compañía de Exploración Mecanizada Pesada"
 Arm_Recce_Comp_desc: "Las compañías de reconocimiento mecanizadas pesadas operan con vehículos de combate de infantería y tienen gran parte del mismo equipo que sus pares de infantería blindada, pero con funciones distintas. Se infiltran cerca del enemigo para observar e informar sobre su actividad y usan tanto el reconocimiento con drones como la vigilancia electrónica para reunir información. También pueden realizar incursiones y emboscadas. Las compañías de reconocimiento suelen llamarse «escuadrones» por su herencia como antiguas unidades de caballería.\n\n§GConsejo del diseñador: El Reconocimiento mecanizado pesado ofrece mucho Reconocimiento e Iniciativa con protección de vehículo de combate de infantería y sin Ancho de combate. Úsalo en divisiones blindadas o de marina que operen en llanuras o desiertos, pero los vehículos de combate de infantería son costosos y el movimiento sufre en bosques, montañas, selvas y pantanos.§!"
 L_arm_Bat: "Compañía de tanques ligeros"
 L_arm_Bat_desc: "La Compañía de tanques ligeros opera con tanques ligeros especiales, a menudo de ruedas, que combinan una movilidad increíble con una potencia de detención impresionante. Pueden defenderse contra todo tipo de infantería en combate directo. Pero el combate directo no es su función prevista: se infiltran cerca del enemigo para observar e informar sobre su actividad y usan tanto el reconocimiento con drones como la vigilancia electrónica para reunir información. También pueden realizar incursiones y emboscadas contra activos importantes del enemigo y formaciones mecanizadas.\n\n§GConsejo del diseñador: Los Tanques ligeros ofrecen potencia de fuego blindada rápida y fuertes ataques en llanuras y desiertos. Úsalos para reconocimiento en fuerza y explotación, pero su protección y su potencia de combate directo son menores y el terreno difícil reduce mucho su eficacia.§!"
 armor_Recce_Comp: "Compañía de Exploración Blindada"
 armor_Recce_Comp_desc: "Las compañías de reconocimiento blindadas operan con tanques ligeros de reconocimiento especiales que combinan una movilidad increíble con una potencia de detención impresionante. Pueden defenderse contra todo tipo de infantería en combate directo. Pero el combate directo no es su función prevista: se infiltran cerca del enemigo para observar e informar sobre su actividad y usan tanto el reconocimiento con drones como la vigilancia electrónica para reunir información. También pueden realizar incursiones y emboscadas contra activos importantes del enemigo y formaciones mecanizadas. Las compañías de reconocimiento suelen llamarse «escuadrones» por su herencia como antiguas unidades de caballería.\n\n§GConsejo del diseñador: El Reconocimiento blindado ofrece el mayor Reconocimiento e Iniciativa entre los exploradores convencionales y suma movilidad antiblindaje sin Ancho de combate. Úsalo en formaciones de tanques en terreno abierto, pero los tanques de reconocimiento y el equipo de mando son costosos y el movimiento cae mucho en bosques, montañas, selvas y pantanos.§!"
 L_Engi_Comp: "Batallón de Ingenieros"
 L_Engi_Comp_desc: "Los ingenieros se encargan de construir puentes temporales y perímetros defensivos, colocar y despejar minas y desactivar bombas. Llevan armamento básico de infantería con fines defensivos.\n\n§GConsejo del diseñador: Los Batallones de ingenieros mejoran el Atrincheramiento, ayudan a la infantería a atacar y defender en fuertes, ciudades, bosques y pantanos, y mejoran la defensa y el movimiento en montañas. Úsalos en divisiones defensivas o de terreno difícil, pero suman Ancho de combate, mano de obra y equipo y aportan poca potencia de fuego directa.§!"
 H_Engi_Comp: "Batallón de Ingenieros Pesados"
 H_Engi_Comp_desc: "Los ingenieros se encargan de puentes temporales y de la construcción de perímetros defensivos, del minado y desminado, además de la desactivación de bombas. Llevan armamento básico de infantería para fines defensivos. Con vehículos especializados de construcción y recuperación, están bien equipados para recuperar del frente equipo inutilizado en combate.\n\n§GConsejo del diseñador: Los Batallones de ingenieros pesados dan mayor Atrincheramiento y bonos más fuertes en fortificaciones, ciudades, montañas y pantanos que los ingenieros estándar. Úsalos en formaciones de asalto o defensa valiosas, pero su gran demanda de mano de obra y equipo los hace una opción de apoyo costosa.§!"
 Arty_Bat: "Artillería"
 Arty_Bat_desc: "Con su gran capacidad de fuego indirecto, la artillería ofrece ataques de precisión sostenidos donde se necesitan en el campo de batalla, y mucho más allá del alcance visual. Su propia tripulación puede recargarla directamente. Como necesita vehículos externos para moverse, puede ser difícil desplazarla entre ataques, lo que la hace vulnerable a los contraataques de la artillería enemiga. Los sistemas ligeros de menor calibre pueden arrastrarse a mano y son aptos para operaciones aerotransportadas, ya que caben dentro de aviones de transporte.\n\n§GConsejo del diseñador: La Artillería suma un Ataque blando considerable y puede lanzarse en paracaídas, lo que la hace eficaz contra fuerzas con mucha infantería. Úsala para dar potencia de fuego ofensiva a las formaciones a pie, pero su baja Organización y Fuerza, el Ancho de combate añadido y las penalizaciones de movimiento en terreno áspero exigen infantería suficiente que la proteja.§!"
 Arty_Battery: "Batería de Artillería"
 Arty_Battery_desc: "Con su gran capacidad de fuego indirecto, la artillería ofrece ataques sostenidos de precisión donde se necesitan en el campo de batalla, y mucho más allá del alcance visual. Su propia tripulación puede recargarla directamente. Como necesita vehículos externos para moverse, puede ser difícil desplazarla entre ataques, lo que la hace vulnerable a los contraataques de la artillería enemiga. Los sistemas ligeros de menor calibre pueden arrastrarse a mano y son aptos para operaciones aerotransportadas, ya que caben dentro de aviones de transporte.\n\n§GConsejo del diseñador: Una Batería de artillería suma Ataque blando sin Ancho de combate a un costo de equipo mucho menor que el de un batallón completo de artillería. Úsala como apoyo de fuego económico para formaciones a pie aptas, pero su Organización muy baja y las penalizaciones en terreno difícil limitan su valor en divisiones sin apoyo o muy móviles.§!"
 SP_Arty_Bat: "Artillería Autopropulsada"
 SP_Arty_Bat_desc: "Con su gran capacidad de fuego indirecto, la artillería autopropulsada ofrece ataques sostenidos de precisión donde se necesitan en el campo de batalla, y mucho más allá del alcance visual. Su propia tripulación puede recargarla directamente y, al ser autopropulsada, puede moverse para evitar los contraataques de la artillería enemiga.\n\n§GConsejo del diseñador: La Artillería autopropulsada suma mucho Ataque blando mientras sigue el ritmo de las formaciones blindadas y se destaca en llanuras. Úsala para romper líneas con mucha infantería, pero su baja Organización, el Ancho de combate extra, el costoso chasis y las penalizaciones en terreno difícil exigen protección blindada y terreno abierto.§!"
 SP_Arty_Battery: "Batería de Artillería Autopropulsada"
 SP_Arty_Battery_desc: "Con su gran capacidad de fuego indirecto, la artillería autopropulsada ofrece ataques sostenidos de precisión donde se necesitan en el campo de batalla, y mucho más allá del alcance visual. Su propia tripulación puede recargarla directamente y, al ser autopropulsada, puede moverse para evitar los contraataques de la artillería enemiga.\n\n§GConsejo del diseñador: Una Batería de artillería autopropulsada suma Ataque blando móvil sin Ancho de combate. Úsala como apoyo de fuego compacto para formaciones móviles, blindadas, de marina o de milicias, pero el chasis especializado cuesta más que los cañones remolcados y se mueve mal por montañas, selvas y pantanos.§!"
 SP_R_Arty_Bat: "Artillería Autopropulsada de Cohetes"
 SP_R_Arty_Bat_desc: "Con lanzadores de cohetes múltiples, un batallón de artillería de cohetes puede arrasar toda una zona desde lejos. Se usa contra las áreas de retaguardia enemigas, ya que el fuego indiscriminado lo hace inadecuado para ataques de precisión en el campo de batalla. Necesita vehículos especiales de recarga y los tiempos de recarga son lentos.\n\n§GConsejo del diseñador: La Artillería de cohetes autopropulsada ofrece un Ataque blando y una Ruptura muy altos y acompaña a las formaciones móviles en terreno abierto. Úsala para potencia de fuego ofensiva concentrada, pero tiene baja Organización, suma Ancho de combate, exige costosos vehículos de cohetes y sufre en montañas, selvas, pantanos y ciudades.§!"
 SP_R_Arty_Battery: "Batería de Artillería Autopropulsada de Cohetes"
 SP_R_Arty_Battery_desc: "Con lanzadores de cohetes múltiples, una batería de artillería de cohetes puede arrasar zonas desde lejos. Se usa contra las áreas de retaguardia enemigas, ya que el fuego indiscriminado la hace inadecuada para ataques de precisión en el campo de batalla. Necesita vehículos especiales de recarga y los tiempos de recarga son lentos.\n\n§GConsejo del diseñador: Una Batería de artillería de cohetes suma un fuerte Ataque blando móvil y algo de Ruptura sin Ancho de combate. Úsala como apoyo ofensivo compacto en divisiones móviles o blindadas, pero los vehículos de cohetes son costosos, ofrecen poca capacidad de resistencia y pierden movilidad en montañas y pantanos.§!"
 SP_AA_Bat: "Defensa Aérea Autopropulsada"
 SP_AA_Bat_desc: "Con sistemas de misiles antiaéreos autopropulsados de corto o medio alcance, el Batallón de defensa aérea defenderá a su unidad de los ataques de apoyo aéreo cercano enemigos.\n\n§GConsejo del diseñador: La Defensa aérea autopropulsada aporta mucho Ataque aéreo y protección móvil para formaciones blindadas. Úsala cuando la aviación enemiga amenace puntas de lanza valiosas, pero suma Ancho de combate, cuesta vehículos especializados, aporta poca potencia de fuego terrestre y se mueve mal en montañas, selvas y pantanos.§!"
 SP_AA_Battery: "Batería de Defensa Aérea Autopropulsada"
 SP_AA_Battery_desc: "Con sistemas de misiles antiaéreos autopropulsados de corto o medio alcance, la Batería de defensa aérea defenderá a su unidad de los ataques de apoyo aéreo cercano enemigos.\n\n§GConsejo del diseñador: Una Batería de defensa aérea autopropulsada suma Ataque aéreo móvil sin Ancho de combate. Úsala para proteger divisiones móviles, blindadas o de marina bajo cielos hostiles, pero su chasis especializado aporta poco valor contra fuerzas terrestres y es menos móvil en montañas y pantanos.§!"
 combat_service_support_company: "Batallón de Apoyo al Servicio de Combate"
 combat_service_support_company_desc: "El personal logístico y médico de la división coordina la distribución de suministros, la evacuación de heridos y el flujo de reemplazos.\n\n§GConsejo del diseñador: El Apoyo de servicio de combate reduce el consumo de Suministros y combustible y conserva la mano de obra y la experiencia de las unidades mediante la recuperación de bajas. Úsalo en divisiones grandes, veteranas o con mucha demanda de suministros, pero suma Ancho de combate y equipo y reduce mucho las estadísticas de combate directo.§!"
 helicopter_combat_service_support: "Batallón de Apoyo al Servicio de Combate con Helicópteros"
 helicopter_combat_service_support_desc: "Los equipos de logística y sanidad aerotransportados por helicópteros sostienen a las fuerzas de despliegue rápido y evacúan bajas desde posiciones avanzadas.\n\n§GConsejo del diseñador: El Apoyo de servicios de combate por helicóptero ofrece mayor recuperación de bajas y mayor ahorro de Suministros y Combustible con menos mano de obra que el apoyo terrestre. Úsalo para formaciones costosas de movilidad aérea o rápidas, pero los helicópteros de transporte son caros, suma Ancho de combate y su aporte al combate es mínimo.§!"
 L_Marine_Cdo_Bat: "Marine Commandos"
 L_Marine_Cdo_Bat_desc: "Los comandos de marina son formaciones más grandes de asaltantes de marina, entrenados para realizar operaciones de golpe y fuga, entre otras tareas de infantería ligera.\n\n§GConsejo del diseñador: Los Comandos de marina combinan alta Organización con excelentes ataques anfibios, en pantanos, bosques y zonas urbanas. Úsalos para incursiones de élite y desembarcos disputados, pero su tope de fuerzas especiales, su largo entrenamiento, su equipo ligero y sus ataques más débiles en terreno abierto limitan el despliegue masivo.§!"
 air_assault_Arty_Battery: "Batería de artillería aeromóvil"
 air_assault_Arty_Battery_desc: "Con piezas de artillería remolcada, estas unidades aumentan su movilidad transportando los cañones colgados de helicópteros, lo que les permite seguir el ritmo de las unidades de infantería de movilidad aérea más rápidas.\n\n§GConsejo del diseñador: Una Batería de artillería de movilidad aérea suma Ataque blando sin Ancho de combate y rinde mejor en colinas, montañas, bosques, selvas y ciudades. Úsala como apoyo de fuego compacto para formaciones de movilidad aérea o de marina, pero los requisitos de helicópteros y artillería son costosos y es más débil en llanuras y desiertos.§!"
 drone_tactical_company: "Compañía de drones FPV"
 drone_tactical_company_desc: "Con drones FPV de ala fija y cuadricópteros, estas unidades realizan reconocimiento y ataques dirigidos en apoyo de sus unidades de línea.\n\n§GConsejo del diseñador: Una Compañía de drones FPV suma Ataque blando y duro eficientes sin Ancho de combate y puede lanzarse en paracaídas. Úsala para apoyo de fuego flexible en divisiones que puedan abastecer drones terrestres, pero casi no tiene Organización y requiere mucho equipo de drones para una capacidad de resistencia limitada.§!"
 group_headquarters_title: "Cuartel General"
 arm_inf_hq: "Cuartel General de Infantería Acorazada"
 arm_inf_hq_desc: "Elemento de cuartel general para infantería mecanizada y blindada."
 arm_hq: "Cuartel General Blindado"
 arm_hq_desc: "Elemento de cuartel general para tanques ligeros y tanques de batalla principales"
 L_Ranger_Bat: "Rangers"
 L_Ranger_Recce_Comp: "Compañía de reconocimiento Ranger"
 group_headquarters_title_desc: "Unidades de cuartel general, equipadas para liderar unidades en la batalla"
 light_inf_hq: "Cuartel General de Infantería Ligera"
 light_inf_hq_desc: "Elemento de cuartel general para infantería ligera y motorizada"
 helo_hq: "Cuartel general de helicópteros"
 helo_hq_desc: "Elemento de cuartel general para unidades de helicópteros"
 group_light_bat_title: "Unidades por Debajo de su Efectivo"
 group_light_bat_title_desc: "Elementos de combate por debajo de su efectivo, diseñados para multiplicar la fuerza, con capacidades reducidas, pero con menor tiempo y costo de entrenamiento."
 Light_Mech_Inf_Bat: "Batallón de Infanteria Mecanizada por Debajo de su Efectivo"
 Light_Mech_Inf_Bat_desc: "Un elemento mecanizado incompleto usa una pequeña dotación de transportes blindados de personal para reforzar una formación sin ocupar el frente normal.\n\n§GConsejo del diseñador: La Infantería mecanizada incompleta suma protección de transportes blindados y Defensa sin Ancho de combate. Úsala para reforzar formaciones aptas en llanuras, colinas o ciudades, pero su costo de vehículos, su poca Fuerza y las graves penalizaciones en montaña, selva, pantano, ríos y ataques anfibios limitan su valor de combate independiente.§!"
 Light_Arm_Inf_Bat: "Batallón de Infantería Acorazada por Debajo de su Efectivo"
 Light_Arm_Inf_Bat_desc: "Un elemento de infantería blindada incompleto usa una pequeña dotación de vehículos de combate de infantería para sumar potencia de fuego protegida sin ocupar el frente normal.\n\n§GConsejo del diseñador: La Infantería blindada incompleta suma Blindaje y potencia de fuego de vehículo de combate de infantería sin Ancho de combate y rinde mejor en llanuras y desiertos. Úsala para reforzar formaciones valiosas, pero su baja Organización, sus costosos vehículos y las penalizaciones extremas en terreno difícil, ríos y ataques anfibios la hacen muy especializada.§!"
 Light_L_Air_assault_Bat: "Batallón de Infantería de Asalto Aéreo por Debajo de su Efectivo"
 Light_L_Air_assault_Bat_desc: "La infantería de asalto aéreo es infantería de élite, con entrenamiento especial en descenso con cuerdas y transporte aéreo; su equipo a veces se diseña o se modifica en el campo para facilitar el transporte en aeronaves. Suele usarse para tomar y mantener terreno clave que no está del todo asegurado y para enfrentar directamente a fuerzas enemigas tras las líneas.\n\n§GConsejo del diseñador: Este elemento de asalto aéreo incompleto suma Organización y fuertes bonos urbanos, de montaña, bosque, selva y pantano sin Ancho de combate. Úsalo para reforzar formaciones especializadas en terreno difícil, pero su requisito de helicópteros es costoso y rinde mal en llanuras, desiertos y ataques anfibios.§!"
 Light_attack_helo_bat: "Regimiento de Helicópteros de Ataque por Debajo de su Efectivo"
 Light_attack_helo_bat_desc: "Un pequeño elemento de helicópteros de ataque ofrece apoyo rápido de helicópteros artillados sin el tamaño de un regimiento completo.\n\n§GConsejo del diseñador: Los Helicópteros de ataque incompletos suman potencia de fuego blindada rápida sin Ancho de combate y se destacan en llanuras y desiertos. Úsalos para apoyo móvil compacto, pero su Organización y Fuerza muy bajas, sus costosas aeronaves y las graves penalizaciones en montaña, selva, pantano y zonas urbanas hacen difícil absorber las pérdidas.§!"
 Light_armor_Bat: "Batallón de Tanques por Debajo de su Efectivo"
 Light_armor_Bat_desc: "Un elemento de tanques incompleto concentra una cantidad limitada de tanques de batalla principales para reforzar una formación sin ocupar el frente normal.\n\n§GConsejo del diseñador: Los Tanques incompletos suman Blindaje, Ruptura y fuertes ataques en llanuras y desiertos sin Ancho de combate. Úsalos para reforzar de forma económica formaciones ofensivas, pero su baja Organización y Fuerza, el costo de los tanques y las penalizaciones extremas en terreno difícil y ciudades los hacen un mal apoyo de uso general.§!"
 Light_L_arm_Bat: "Batallón de Tanques Ligeros por Debajo de su Efectivo"
 Light_L_arm_Bat_desc: "Un elemento de tanques ligeros incompleto aporta potencia de fuego antiblindaje móvil y reconocimiento en fuerza con menos vehículos.\n\n§GConsejo del diseñador: Los Tanques ligeros incompletos suman potencia de fuego antiblindaje móvil sin Ancho de combate y se destacan en llanuras y desiertos. Úsalos para reforzar formaciones rápidas contra vehículos, pero su poca Fuerza, sus chasis especializados y las fuertes penalizaciones en terreno difícil, ríos y ataques anfibios limitan su flexibilidad.§!"
 Light_SP_Arty_Bat: "Batallón de Artillería Autopropulsada por Debajo de su Efectivo"
 Light_SP_Arty_Bat_desc: "Un elemento de artillería autopropulsada reducido ofrece fuego indirecto móvil con menos vehículos que un batallón completo.\n\n§GConsejo del diseñador: La Artillería autopropulsada incompleta suma Ataque blando móvil sin Ancho de combate y rinde especialmente bien en llanuras, desiertos y ciudades. Úsala para dar apoyo ofensivo compacto, pero casi no tiene Organización, tiene poca Fuerza, un costoso chasis especializado y peor rendimiento en bosques, montañas y selvas.§!"
 Light_SP_R_Arty_Bat: "Batallón de Artillería de Cohetes Autopropulsada por Debajo de su Efectivo"
 Light_SP_R_Arty_Bat_desc: "Un elemento de lanzacohetes múltiples reducido aporta fuego de área concentrado con menos vehículos que un batallón completo.\n\n§GConsejo del diseñador: La Artillería de cohetes incompleta suma un potente Ataque blando móvil sin Ancho de combate y se destaca en llanuras, desiertos y ciudades. Úsala para reforzar formaciones ofensivas, pero su Organización insignificante, su poca Fuerza, el costo de los vehículos de cohetes y las penalizaciones en terreno difícil exigen protección.§!"
 Light_SP_AA_Bat: "Batallón de Defensa Aérea Autopropulsada por Debajo de su Efectivo"
 Light_SP_AA_Bat_desc: "Un elemento de defensa aérea autopropulsado reducido protege a la formación con una pequeña dotación de sistemas antiaéreos móviles.\n\n§GConsejo del diseñador: La Defensa aérea autopropulsada incompleta suma Ataque aéreo sin Ancho de combate ni mucha mano de obra. Úsala para dar protección compacta a formaciones móviles bajo el poder aéreo enemigo, pero casi no tiene Organización, tiene poca Fuerza y exige vehículos antiaéreos especializados que aportan poca potencia de fuego terrestre.§!"
 Drone_Recce_Comp: "Compañía de reconocimiento no tripulado"
 Drone_Recce_Comp_desc: "Al emplear pequeños sistemas aéreos no tripulados para extender la observación más allá de la línea de visión, la Compañía de reconocimiento no tripulada mejora la conciencia del campo de batalla sin exponer a los exploradores al fuego directo. Estos drones pueden explorar rutas con rapidez, identificar posiciones enemigas y confirmar blancos en terreno complejo, lo que permite decidir más rápido y disparar con más precisión.\n\n§GConsejo del diseñador: El Reconocimiento no tripulado aporta mucho Reconocimiento e Iniciativa, refuerza a otros elementos de reconocimiento y mejora los ataques de artillería. Úsalo en divisiones móviles o blindadas que puedan costear drones, pero suma Ancho de combate y Consumo de suministros, reduce el Atrincheramiento y rinde mal en ciudades y montañas.§!"
 medium_walker_battalion: "Medium Walker Battalion"
 medium_walker_battalion_desc: "Pensado como columna vertebral polivalente de las formaciones de andadores, el Batallón de andadores medianos combina protección, movilidad y capacidad de carga equilibradas para el combate directo.\n\n§GConsejo del diseñador: Los Andadores medianos aportan potencia flexible de primera línea blindada, determinada por el chasis caminante equipado. Úsalos como núcleo de uso general de las formaciones de andadores, pero su gran Ancho de combate, su baja Organización, su largo entrenamiento y la gran cantidad de chasis que exigen los hacen costosos de desplegar y reponer.§!"
 light_walker_tank_battalion: "Light Walker Battalion"
 light_walker_tank_battalion_desc: "Construido en torno a chasis caminantes antiblindaje, el Batallón de andadores ligeros se centra en cazar objetivos protegidos y aprovechar brechas en lugar del combate sostenido en línea.\n\n§GConsejo del diseñador: Los andadores ligeros se especializan en objetivos blindados mediante chasis caminantes cazacarros. Úsalos cuando el blindaje enemigo exija Perforación y Ataque duro concentrados, pero su gran Ancho de combate, baja Organización, largo entrenamiento y costo de chasis especializados los hacen ineficientes contra oponentes blandos.§!"
 heavy_walker_tank_battalion: "Heavy Walker Battalion"
 heavy_walker_tank_battalion_desc: "Los batallones de andadores pesados montan cargas de artillería en enormes plataformas caminantes para dar apoyo de fuego protegido a la formación principal.\n\n§GConsejo del diseñador: Los andadores pesados aportan potencia de artillería blindada desde chasis de artillería caminantes. Úsalos para sumar un fuerte apoyo contra infantería y líneas fortificadas, pero su gran Ancho de combate, baja Organización, largo entrenamiento y costosos chasis especializados exigen una formación bien respaldada.§!"
 space_artillery_support_company: "Compañía de apoyo de artillería espacial"
 space_artillery_support_company_desc: "Al emplear proyectiles de artillería disparados desde plataformas orbitales, la Compañía de apoyo de artillería espacial realiza bombardeos de precisión desde el espacio contra blancos del campo de batalla muy fuera del alcance de los sistemas convencionales. Estos ataques pueden suprimir rápidamente posiciones fortificadas, destruir activos de alto valor y desbaratar concentraciones enemigas con un aviso mínimo.\n\n§GConsejo del diseñador: La Artillería espacial duplica el aporte de ataque de los batallones de artillería sin sumar Ancho de combate y puede lanzarse en paracaídas. Úsala para potenciar formaciones con mucha artillería, pero su equipo de control orbital escaso, su largo entrenamiento y sus débiles estadísticas de combate independientes la hacen un desperdicio en divisiones con poca artillería.§!"
 space_artillery_equipment_type: "Relé orbital de control de fuego"
 space_artillery_equipment_type_desc: "Un relé de comunicaciones y puntería reforzado, diseñado para solicitar, coordinar y confirmar ataques de artillería orbital en tiempo real. Conecta a los observadores de primera línea con baterías basadas en el espacio, lo que permite misiones de fuego rápidas, sincronización precisa y una desconflicción confiable con las fuerzas amigas. El sistema es caro y exige muchos recursos, pero sin él la potencia de fuego orbital sigue ciega, lenta y peligrosamente ineficiente."
 space_artillery_equipment_1: "$space_artillery_equipment_type$ I"
 space_artillery_equipment_1_desc: "$space_artillery_equipment_type_desc$"
 HACS_Mech: "Primero. Alto sistema de lucha contra la agilidad"
 HACS_Mech_desc: "El Sistema de Combate de Alta Agilidad de primera generación combina blindaje, armas y movilidad avanzados en una plataforma de combate desplegable por aire.\n\n§GConsejo del diseñador: Los HACS de primera generación ofrecen Organización y Fuerza muy altas, potencia de fuego integral y capacidad de lanzamiento en paracaídas, con fuertes bonos en colinas y llanuras. Úsalos como puntas de lanza blindadas de élite, pero su gran Ancho de combate, su entrenamiento larguísimo, su equipo escaso y las penalizaciones en bosques y selvas hacen graves las pérdidas descuidadas.§!"
 HACS_Mech_2: "Segundo. gen. Alto sistema de lucha contra la agilidad"
 HACS_Mech_2_desc: "El Sistema de Combate de Alta Agilidad de segunda generación mejora la protección, los sistemas de armas y la resistencia en el campo de batalla, y conserva la flexibilidad de despliegue estratégico.\n\n§GConsejo del diseñador: Los HACS de segunda generación mejoran la Organización, la Fuerza y la Ruptura y conservan el lanzamiento en paracaídas y la extracción costera. Úsalos para ataques de élite en colinas, llanuras, desiertos y pantanos, pero su gran Ancho de combate, su equipo escaso, su largo entrenamiento y una penalización restante en selva exigen un uso selectivo.§!"
 HACS_Mech_3: "3.º. gen. Alto sistema de lucha contra la agilidad"
 HACS_Mech_3_desc: "El Sistema de Combate de Alta Agilidad de tercera generación combina protección avanzada, armas modulares y una resistencia excepcional en el campo de batalla.\n\n§GConsejo del diseñador: Los HACS de tercera generación ofrecen Organización, Fuerza y Atrincheramiento excepcionales, potencia de fuego amplia, capacidad de lanzamiento en paracaídas y fuertes bonos de terreno. Úsalos para las operaciones blindadas más exigentes, pero su gran Ancho de combate, su largo entrenamiento y su equipo avanzado irremplazable siguen castigando el desgaste.§!"
 ALN_bellatoris: "Bellatoris"
 ALN_bellatoris_desc: "El Bellatoris es el guerrero de primera línea del enjambre Chimera, criado para el asalto cercano implacable. Rápido y agresivo, supera las líneas defensivas por pura cantidad y ferocidad.\n\n§GConsejo del diseñador: Los Bellatoris combinan Organización y Fuerza muy altas con ataques equilibrados, Defensa, Ruptura y entrenamiento rápido. Úsalos como tropas de línea Chimera de uso general en bosques, colinas, pantanos, llanuras y desiertos, pero no tienen Ataque aéreo y sufren en montañas y selvas.§!"
 ALN_brachionis: "Brachionis"
 ALN_brachionis_desc: "El Brachionis es un Chimera de múltiples miembros construido para agarrar y desgarrar objetivos blindados a corta distancia.\n\n§GConsejo del diseñador: Los Brachionis cambian algo de Defensa por más Ataque blando y Ataque duro, y conservan alta Organización y entrenamiento rápido. Úsalos como tropas de asalto agresivas en terreno abierto, pero siguen siendo más débiles en montañas y selvas.§!"
 ALN_gravis: "Gravis"
 ALN_gravis_desc: "El Gravis es la cepa Chimera más pesada, una masa blindada que ancla el avance del enjambre y rompe posiciones endurecidas por la fuerza.\n\n§GConsejo del diseñador: Los Gravis ofrecen los ataques, la Ruptura y la Iniciativa más fuertes de los Chimera, con alta Organización y entrenamiento rápido. Úsalos como anclas ofensivas en terreno abierto, pero consumen más Suministros, tienen menos Defensa y Organización que las cepas más ligeras y sufren en montañas y selvas.§!"
 Hvy_Mot_Inf_Bat: "Infantería motorizada pesada"
 Hvy_Mot_Inf_Bat_desc: "La infantería motorizada pesada usa vehículos resistentes a minas y protegidos contra emboscadas (MRAP) como transporte. Sus vehículos blindados dan una protección superior a la tripulación contra minas, artefactos explosivos improvisados y fuego de armas ligeras, lo que los hace ideales para operaciones en entornos hostiles donde la amenaza de emboscada es alta.\n\n§GConsejo del diseñador: La Infantería motorizada pesada usa vehículos protegidos más pesados para operaciones rápidas de primera línea en llanuras y desiertos. Exige más equipo y tiene menor Organización y Atrincheramiento que la infantería más ligera, y aun así sufre penalizaciones importantes en terreno difícil.§!"
 L_Ranger_Bat_desc: "Los rangers son infantería ligera de élite, especializada en incursiones, acción directa y despliegue rápido por delante de la fuerza principal. Viajan ligeros para maximizar la movilidad y la sorpresa, tomando objetivos clave y manteniéndolos hasta que lleguen las unidades convencionales. A cambio, tienen poco equipo pesado, lo que los deja expuestos ante blindados en terreno abierto.\n\n§GConsejo del diseñador: Los Rangers reúnen alta Organización y bonos excepcionales en terreno difícil con poco Ancho de combate. Úsalos para formaciones de élite de montaña, bosque, selva, pantano o urbanas, pero su largo entrenamiento, su tope de fuerzas especiales y su poco equipo pesado hacen costoso un despliegue masivo y los dejan expuestos en llanuras.§!"
 L_Ranger_Recce_Comp_desc: "Un elemento de reconocimiento formado por rangers, entrenado para infiltrarse a pie en lo profundo de las líneas enemigas e informar sobre los movimientos del enemigo. Combina el sigilo con el reconocimiento con drones y la vigilancia electrónica, reúne información y marca blancos para los fuegos propios, y puede realizar incursiones y emboscadas limitadas cuando se presenta la oportunidad.\n\n§GConsejo del diseñador: El Reconocimiento de rangers suma Reconocimiento e Iniciativa, mejora el Ataque blando de la artillería y combate bien en terreno difícil. Úsalo en formaciones de fuerzas especiales que necesiten exploración de élite, pero suma Ancho de combate, consume capacidad de fuerzas especiales y aporta poca potencia de fuego directa.§!"
 A_L_arm_Bat: "Compañía de Tanques Ligeros Aerotransportados"
 A_L_arm_Bat_desc: "La Compañía de tanques ligeros opera con tanques ligeros especiales, a menudo de ruedas, que combinan una movilidad increíble con una potencia de detención impresionante. Pueden defenderse contra todo tipo de infantería en combate directo. Pero el combate directo no es su función prevista: se infiltran cerca del enemigo para observar e informar sobre su actividad y usan tanto el reconocimiento con drones como la vigilancia electrónica para reunir información. También pueden realizar incursiones y emboscadas contra activos importantes del enemigo y formaciones mecanizadas. Estas unidades también pueden realizar operaciones aerotransportadas con elementos de paracaidistas y brindar apoyo blindado cercano inmediato.\n\n§GConsejo del diseñador: Los Tanques ligeros aerotransportados dan a las formaciones lanzadas en paracaídas Blindaje móvil y potencia de fuego antivehículo tras la inserción. Úsalos para apoyar a las tropas aerotransportadas contra oposición móvil en terreno abierto, pero los vehículos especializados son costosos y sufren graves penalizaciones en montañas, selvas, pantanos y ciudades.§!"
 air_assault_Arty_Bat: "Artillería aerotransportada"
 air_assault_Arty_Bat_desc: "Un batallón completo de piezas de artillería remolcada transportadas colgadas de helicópteros. Da apoyo de fuego indirecto sostenido a las operaciones de movilidad aérea, y sigue el ritmo de la infantería de asalto aéreo mediante un rápido reposicionamiento aéreo.\n\n§GConsejo del diseñador: La Artillería de movilidad aérea suma un Ataque blando sustancial a las formaciones de helicópteros y rinde bien en colinas, montañas, bosques, selvas y ciudades. Úsala para apoyar a las tropas de asalto aéreo en terreno difícil, pero suma Ancho de combate, tiene baja Organización y Fuerza y requiere costosos helicópteros de transporte.§!"
 Weapons_company: "Compañía de Armas"
 Weapons_company_desc: "Una compañía de armas, formada por armas de apoyo de fuego directo de infantería, como equipos de ametralladoras de uso general y pesadas, equipos de ametralladoras lanzagranadas y otras armas pesadas de apoyo de fuego directo de infantería. Esta compañía está diseñada para dar fuegos de apoyo a cualquier elemento de infantería al que se asigne, en una gran variedad de fuerzas.\n\n§GConsejo del diseñador: Una Compañía de armas suma amplias estadísticas de fuego directo, en especial Perforación, sin Ancho de combate. Úsala para reforzar infantería de uso general, pero su gran demanda de equipo de infantería y su penalización de Atrincheramiento la hacen menos atractiva para defensores estáticos baratos.§!"
 Heavy_mortar_company: "Compañía de Morteros"
 Heavy_mortar_company_desc: "Los morteros están diseñados para dar apoyo de fuego rápido e integrado a las unidades de línea, sin necesitar el refuerzo de escalones superiores. Brindan fuego indirecto a los elementos de línea a un costo mucho menor que el de una unidad de artillería completa.\n\n§GConsejo del diseñador: Una Compañía de morteros aporta un fuerte Ataque blando sin equipo de artillería ni Ancho de combate. Úsala como apoyo de fuego integrado y barato contra la infantería, pero tiene poco Ataque duro o Perforación y reduce el Atrincheramiento.§!"
 Sniper_company: "Compañía de Francotiradores"
 Sniper_company_desc: "Equipada con tiradores de precisión que trabajan en parejas de observación, la Compañía de francotiradores ofrece fuego selectivo de largo alcance contra objetivos de alto valor, como oficiales, dotaciones y equipos de comunicaciones. Se destaca en hostigar e interrumpir formaciones enemigas desde la ocultación, degradando su eficacia sin ser fácil de localizar ni de enfrentar.\n\n§GConsejo del diseñador: Una Compañía de francotiradores suma Ataque blando y Reconocimiento, y mejora la Iniciativa de los elementos de reconocimiento y la potencia de fuego de la artillería. Úsala contra la infantería y para mejorar la coordinación del campo de batalla, pero suma Ancho de combate y tiene muy mala Ruptura, Ataque duro y Perforación.§!"
 AT_company: "Compañía Antitanque de Infantería"
 AT_company_desc: "Equipada con armas antitanque de infantería, esta compañía antitanque está diseñada para trabajar específicamente con elementos de infantería ligera. Capaz de operar con facilidad en zonas urbanas, bosques y otros lugares atrincherados o cerrados, este equipo no solo puede atacar con facilidad a los elementos blindados enemigos, sino también desaparecer de nuevo en sus posiciones atrincheradas.\n\n§GConsejo del diseñador: El Antitanque de infantería suma mucho Ataque duro y Perforación sin Ancho de combate para formaciones a pie, aerotransportadas, de marina y de fuerzas especiales. Úsalo cuando esas divisiones deban resistir blindados, pero debilita otras estadísticas de combate y suma costo de equipo especializado.§!"
 Mot_AT_company: "Compañía de Vehículos Antitanque"
 Mot_AT_company_desc: "Una compañía dedicada a las operaciones antitanque, que trabaja desde posiciones de tiro montadas en vehículos. Esta compañía está pensada más para la velocidad, lo que le permite seguir el ritmo de los elementos móviles y blindados rápidos y aun así aportar mayores capacidades antitanque.\n\n§GConsejo del diseñador: El Antitanque en vehículo suma mucho Ataque duro y Perforación sin frenar a las formaciones móviles. Úsalo en divisiones motorizadas, blindadas, aerotransportadas o de marina que enfrenten tanques, pero las armas antitanque pesadas y los vehículos utilitarios lo encarecen y aporta poco contra blancos blandos.§!"
 AA_company: "Compañía Antiaérea"
 AA_company_desc: "Un elemento equipado específicamente para enfrentar aeronaves enemigas y para dar defensa contra helicópteros y otras aeronaves enemigas.\n\n§GConsejo del diseñador: Una Compañía antiaérea aporta un fuerte Ataque aéreo sin Ancho de combate. Úsala para proteger divisiones que operan bajo el poder aéreo enemigo, pero es débil en combate terrestre y consume equipo antiaéreo dedicado que aporta poco valor cuando el cielo está asegurado.§!"
 Combat_engineer_company: "Compañía de Ingenieros de Combate"
 Combat_engineer_company_desc: "Los ingenieros de combate realizan acciones de ingeniería ofensiva en apoyo directo de las unidades de línea. Están entrenados y equipados para cruzar terreno difícil, como ríos o fosos antitanque. También están equipados para abrir brechas en campos minados u otros obstáculos defensivos y para despejar zonas para que otras fuerzas de combate pasen sin impedimentos.\n\n§GConsejo del diseñador: Los Ingenieros de combate suman Defensa, Ruptura y modestos bonos de ataque y defensa en bosques, montañas, selvas y ciudades sin Ancho de combate. Úsalos para asaltos en terreno difícil, pero requieren mucho equipo de infantería y aportan menos valor especializado en terreno abierto.§!"
 pathfinder_company: "Compañía Pathfinder"
 pathfinder_company_desc: "Grupos de élite de paracaidistas, entrenados para saltar antes de las operaciones aerotransportadas, para encontrar las zonas de aterrizaje y de reunión más seguras. Estos soldados de élite aportan mando y control fundamentales en los momentos clave de cualquier operación aerotransportada o de movilidad aérea.\n\n§GConsejo del diseñador: Los exploradores mejoran la Organización y el Ataque blando de la infantería aerotransportada y pueden desplegarse en paracaídas. Úsalos para reforzar divisiones de asalto aerotransportadas o de movilidad aérea, pero suman Ancho de combate, están restringidos a esas formaciones y aportan poca potencia de combate directa.§!"
 amphibious_landing_detachment: "Unidad de desembarco naval"
 amphibious_landing_detachment_desc: "Elementos adscritos de la armada que permiten operaciones de desembarco anfibio rápidas y eficaces. Equipados con buques de desembarco y equipo dedicados, estas unidades facilitan el desembarco rápido de buque a costa o más allá del horizonte. El precio de adscribir una de estas unidades es una menor capacidad para realizar operaciones no anfibias.\n\n§GConsejo del diseñador: Un Destacamento de desembarco naval mejora mucho el Ataque, la Defensa y el Movimiento anfibios de las formaciones de marina. Úsalo en divisiones dedicadas a asaltar playas, pero suma Ancho de combate, mano de obra y equipo, e impone graves penalizaciones de combate en casi todo terreno terrestre.§!"
 combat_maintenance_company: "Compañia de Mantenimiento"
 combat_maintenance_company_desc: "La Compañía de mantenimiento mantiene en combate los vehículos y el equipo pesado de una formación: hace reparaciones de campaña y recupera plataformas dañadas antes de perderlas para siempre. Al restaurar vehículos inutilizados en combate cerca del frente, sostiene la fuerza blindada durante operaciones prolongadas y reduce el desgaste.\n\n§GConsejo del diseñador: El Mantenimiento mejora la Confiabilidad, la Recuperación y la Captura de equipo en divisiones con muchos vehículos. Úsalo para limitar el desgaste y conservar equipo costoso en operaciones largas, pero suma Ancho de combate, mano de obra y vehículos utilitarios y aporta poca potencia de fuego directa.§!"
 airmobile_maintenance_company: "Compañía de mantenimiento de aeronaves"
 airmobile_maintenance_company_desc: "Un elemento de mantenimiento configurado para apoyar a fuerzas de movilidad aérea y de helicópteros, con herramientas más ligeras y transportables para mantener operativas las unidades de ala rotatoria y de despliegue rápido. Restaura equipo dañado en zonas avanzadas y sostiene el ritmo de las operaciones de asalto aéreo lejos de los depósitos establecidos.\n\n§GConsejo del diseñador: El Mantenimiento de movilidad aérea mejora la Captura de equipo y la Confiabilidad a la par de las formaciones de helicópteros. Úsalo para conservar el costoso equipo de ala rotatoria, pero ofrece menos Recuperación que el mantenimiento terrestre, suma Ancho de combate y exige muchos helicópteros de transporte.§!"
 communications_company: "Compañía de comunicaciones"
 communications_company_desc: "La Compañía de comunicaciones mantiene las redes de radio, datos y mando que unen a una formación y asegura que las órdenes y los informes fluyan de forma confiable por el campo de batalla. Unas comunicaciones robustas mejoran la coordinación y el tiempo de reacción y protegen a la formación contra las interferencias y las perturbaciones electrónicas.\n\n§GConsejo del diseñador: Una Compañía de comunicaciones mejora la Organización, la Recuperación y la Iniciativa de los batallones de primera línea. Úsala en divisiones de combate grandes o valiosas que se beneficien de la coordinación, pero suma Ancho de combate y un costo considerable de equipo de mando y control y aporta poca potencia de fuego directa.§!"
 military_police_attachment: "Policía militar"
 military_police_attachment_desc: "La Policía Militar se encarga del control del tráfico, la seguridad de retaguardia y el manejo de prisioneros, para que las unidades de línea se concentren en el combate. Al mantener ordenadas las rutas de suministro y asegurar la retaguardia contra infiltrados y rezagados, preserva la disciplina y mantiene a la formación en marcha.\n\n§GConsejo del diseñador: La Policía Militar multiplica la Supresión de la infantería y suma más Supresión sin Ancho de combate. Úsala en plantillas de ocupación y seguridad de retaguardia, pero su costo de mano de obra y equipo aporta poco beneficio a las divisiones de combate de primera línea.§!"
 hq_mech: "Compañía de cuartel general de infantería mecanizada"
 hq_mot: "Compañía de cuartel general de infantería motorizada"
 hq_armor: "Compañía de cuartel general de caballería pesada"
 hq_Mot_Inf_Bat: "Destacamento de seguridad de cuartel general de infantería motorizada"
 hq_Mech_Inf_Bat: "Destacamento de seguridad de cuartel general de infantería mecanizada"
 hq_Arm_Inf_Bat: "Destacamento de seguridad de cuartel general de blindados"
 hq_Mech_Marine_Bat: "Destacamento de seguridad de cuartel general de infantería de marina"
 hq_Mech_Air_Inf_Bat: "Destacamento de seguridad de cuartel general de asalto aéreo"
 Militia_Recce_Comp: "Militia Recce Company"
 Militia_Recce_Comp_desc: "Las compañías de reconocimiento de milicias usan vehículos utilitarios y equipo de comunicaciones limitado para explorar por delante de las formaciones de milicias. Ofrecen un reconocimiento barato de las posiciones enemigas, sobre todo en terreno urbano.\n\n§GConsejo del diseñador: El Reconocimiento de milicias suma Reconocimiento e Iniciativa sin Ancho de combate y rinde especialmente bien en ciudades y supercidades. Úsalo para mejorar barato las tácticas de las milicias, pero está restringido a las milicias y aporta poca potencia de combate directa.§!"
 light_medium_walker_battalion: "Batallón de andadores medianos (ligero)"
 light_medium_walker_battalion_desc: "Un elemento de andadores medianos reducido refuerza a una formación con una pequeña dotación de chasis caminantes de uso general.\n\n§GConsejo del diseñador: Los andadores medianos incompletos suman potencia blindada flexible con menos Ancho de combate y muchos menos chasis que un batallón completo de andadores. Úsalos cuando la producción no pueda sostener un elemento completo, pero conservan baja Organización, largo entrenamiento y poca capacidad de resistencia.§!"
 light_light_walker_tank_battalion: "Batallón de andadores ligeros (ligero)"
 light_light_walker_tank_battalion_desc: "Un elemento de andadores ligeros reducido aporta una pequeña fuerza de plataformas caminantes antiblindaje para reforzar objetivos concretos.\n\n§GConsejo del diseñador: Los Andadores ligeros incompletos suman poder antiblindaje concentrado con menos Ancho de combate y menos chasis cazacarros. Úsalos para reforzar divisiones contra objetivos protegidos, pero conservan baja Organización, largo entrenamiento y un papel limitado contra oposición blanda.§!"
 light_heavy_walker_tank_battalion: "Batallón de andadores pesados (ligero)"
 light_heavy_walker_tank_battalion_desc: "Un elemento de andadores pesados reducido aporta plataformas caminantes equipadas con artillería sin el tamaño de un batallón completo.\n\n§GConsejo del diseñador: Los Andadores pesados incompletos suman potencia de fuego de artillería blindada con menos Ancho de combate y menos chasis que un elemento completo. Úsalos para apoyo de fuego compacto, pero su baja Organización, su largo entrenamiento y su chasis especializado de artillería siguen haciéndolos costosos.§!"
 hq_support_company: "HQ Support Company"
 hq_support_company_desc: "La compañía de apoyo del cuartel general aporta el estado mayor, las comunicaciones, el transporte y la seguridad necesarios para dirigir una formación de campaña.\n\n§GConsejo del diseñador: La Compañía de apoyo del CG mejora los bonos que un líder desplegado obtiene de su Habilidad. Es la opción de uso general para una plantilla de CG de ejército, pero suma Ancho de combate, mano de obra y equipo sin bonos de combate ni operativos especializados.§!"
 hq_engineer: "HQ Engineer Company"
 hq_engineer_desc: "La compañía de ingenieros del cuartel general coordina el trabajo de brechas, fortificación y movilidad en toda la formación.\n\n§GConsejo del diseñador: La Compañía de ingenieros del CG mejora el Daño a fortificaciones y la Defensa contra invasiones anfibias, y suma Atrincheramiento y Ruptura. Úsala para asedios, defensa u operaciones costeras, pero suma Ancho de combate y ofrece poca potencia de fuego directa.§!"
 hq_recon: "HQ Reconnaissance Company"
 hq_recon_desc: "La compañía de reconocimiento del cuartel general reúne y distribuye información del terreno y del enemigo para el estado mayor.\n\n§GConsejo del diseñador: La Compañía de reconocimiento del CG mejora el Reconocimiento y la experiencia de Rasgos de terreno del líder desplegado y suma Reconocimiento al CG. Úsala en mandos móviles o centrados en el terreno, pero suma Ancho de combate y aporta poca potencia de combate directa.§!"
 hq_maintenance: "HQ Maintenance Company"
 hq_maintenance_desc: "La compañía de mantenimiento del cuartel general coordina la recuperación, la reparación y el rescate de equipo en toda la formación.\n\n§GConsejo del diseñador: La Compañía de mantenimiento del CG reduce el Desgaste y mejora la Captura de equipo del líder desplegado, y suma Confiabilidad y Captura de equipo al CG. Úsala para mandos con mucho equipo, pero suma Ancho de combate y tiene débiles estadísticas de combate.§!"
 hq_logistics: "HQ Logistics Company"
 hq_logistics_desc: "La compañía de logística del cuartel general planifica la distribución de suministros y el movimiento de combustible de la formación.\n\n§GConsejo del diseñador: La Compañía de logística del CG reduce el Consumo de suministros del líder desplegado y el Consumo de combustible del CG. Úsala en frentes con restricciones de suministro o de mucho consumo de combustible, pero suma Ancho de combate y poca capacidad de combate.§!"
 hq_naval_liaison: "Compañía de cuartel general de enlace naval"
 hq_naval_liaison_desc: "Los equipos de enlace naval conectan el cuartel general con los comandantes de flota y las redes de apoyo de buque a tierra.\n\n§GConsejo del diseñador: La Compañía de enlace naval del CG mejora el Bombardeo costero, la Invasión anfibia y el Margen de suministro de la infantería de marina del líder desplegado. Úsala en campañas costeras y anfibias, pero suma Ancho de combate y aporta poco lejos de la costa.§!"
 hq_air_liaison: "Compañía de cuartel general de enlace aéreo"
 hq_air_liaison_desc: "Los equipos de enlace aéreo coordinan al cuartel general con las formaciones de transporte, apoyo cercano y superioridad aérea.\n\n§GConsejo del diseñador: La Compañía de enlace aéreo del CG acorta la Preparación de invasión aérea y mejora la resistencia al Apoyo aéreo cercano y el beneficio de combate de la Superioridad aérea. Úsala donde importe la coordinación aire-tierra, pero suma Ancho de combate y no aporta potencia de fuego terrestre sustancial.§!"
 hq_specops: "Compañía de cuartel general de operaciones especiales"
 hq_specops_desc: "El estado mayor de operaciones especiales coordina a las unidades de élite que operan más allá de las redes normales de suministro y mando.\n\n§GConsejo del diseñador: La Compañía de operaciones especiales del CG mejora el Ataque, la Defensa y el rendimiento fuera de suministro de las fuerzas especiales del líder desplegado, sin sumar Ancho de combate. Úsala para comandar formaciones de élite, pero su costo de mano de obra y de equipo se desperdicia en fuerzas convencionales.§!"
 hq_mech_desc: "Un estado mayor de operaciones mecanizadas coordina los transportes blindados de personal y su infantería embarcada en toda la formación.\n\n§GConsejo del diseñador: La Compañía de infantería mecanizada del CG mejora el Ataque y la Defensa mecanizados del líder desplegado. Úsala para comandar formaciones mecanizadas, pero exige transportes blindados y un apoyo considerable de equipo y aporta poco beneficio a otros tipos de unidad.§!"
 hq_mot_desc: "Un estado mayor de operaciones motorizadas coordina a la infantería transportada en vehículos y el movimiento rápido de la formación.\n\n§GConsejo del diseñador: La Compañía de infantería motorizada del CG mejora el Ataque y la Defensa motorizados del líder desplegado. Úsala para comandar formaciones motorizadas, pero el costo de sus vehículos utilitarios y de su equipo aporta poco valor a las fuerzas a pie o blindadas.§!"
 hq_armor_desc: "Un estado mayor de operaciones blindadas coordina tanques, infantería blindada y sus elementos de apoyo en toda la formación.\n\n§GConsejo del diseñador: La Compañía de caballería pesada del CG mejora el Ataque y la Defensa blindados del líder desplegado. Úsala para comandar fuerzas con muchos tanques, pero sus vehículos de combate de infantería y sus amplios requisitos de equipo la convierten en una de las opciones de apoyo de CG más costosas.§!"
 hq_infantry: "Destacamento de seguridad de cuartel general de infantería"
 hq_infantry_desc: "Un destacamento de infantería ligera protege al personal del cuartel general, las comunicaciones y los puestos de mando de ataques directos.\n\n§GConsejo del diseñador: El Destacamento de seguridad de infantería del CG ofrece mucha Fuerza y Organización a un costo de equipo modesto para un CG de ejército. Úsalo como línea de seguridad básica, pero suma Ancho de combate, carece de bonos de terreno y tiene menores estadísticas de combate que la infantería normal de primera línea.§!"
 hq_Mot_Inf_Bat_desc: "Un destacamento de infantería motorizada brinda seguridad móvil al personal del cuartel general y a los puestos de mando.\n\n§GConsejo del diseñador: El Destacamento de seguridad de infantería motorizada del CG suma Velocidad, buena Organización y buen rendimiento en colinas y ciudades a un CG de ejército. Úsalo para una formación de mando móvil, pero los vehículos suman costo y es débil en desiertos, selvas, pantanos, ríos y ataques anfibios.§!"
 hq_Mech_Inf_Bat_desc: "Un destacamento de infantería mecanizada protege un cuartel general móvil con transportes blindados de personal.\n\n§GConsejo del diseñador: El Destacamento de seguridad de infantería mecanizada del CG suma movilidad blindada y fuerte Defensa en colinas y ciudades. Úsalo para proteger un CG de ejército mecanizado, pero los transportes blindados son caros y la unidad sufre graves penalizaciones en montañas, selvas, pantanos, ríos y ataques anfibios.§!"
 hq_Arm_Inf_Bat_desc: "Un destacamento de infantería blindada usa vehículos de combate de infantería para dar seguridad pesada a un cuartel general.\n\n§GConsejo del diseñador: El Destacamento de seguridad blindado del CG ofrece protección basada en vehículos de combate de infantería y buen rendimiento en terreno abierto para un CG de ejército. Úsalo con mandos blindados, pero tiene menor Organización, alto costo de equipo y graves penalizaciones en terreno difícil y operaciones anfibias.§!"
 hq_Mech_Marine_Bat_desc: "Un destacamento de marina mecanizada protege un cuartel general durante operaciones de buque a costa y costeras.\n\n§GConsejo del diseñador: El Destacamento de seguridad de marina del CG combina movilidad blindada con fuerte Ataque anfibio y fluvial para un CG de ejército. Úsalo en mandos de marina y operaciones de cabeza de playa, pero el costo de sus transportes blindados y las penalizaciones en terreno difícil lo hacen ineficiente en campañas tierra adentro.§!"
 hq_Mech_Air_Inf_Bat_desc: "Un destacamento mecanizado ligero protege los cuarteles generales asignados a formaciones aerotransportadas y de despliegue rápido.\n\n§GConsejo del diseñador: El Destacamento de seguridad de asalto aéreo del CG ofrece seguridad blindada que puede lanzarse en paracaídas junto con un CG de ejército. Úsalo para formaciones de mando aerotransportadas, pero el costo de sus transportes blindados y de su equipo de apoyo es alto y sufre grandes penalizaciones en terreno difícil, ríos y ataques anfibios.§!"
 Mech_Militia_Bat: "Mechanized Militia"
 Mech_Militia_Bat_desc: "Batallón de milicias con transportes blindados de personal. Las unidades de milicias se caracterizan por tener menos equipo pesado y menos kits de comunicación que la infantería normal. Eso las hace muy móviles y eficaces en mal terreno, pero se deshacen rápido en terreno llano frente a un oponente blindado.\n\n§GConsejo del diseñador: Las Milicias mecanizadas cambian más economía por Velocidad y mayor Dureza. Úsalas para tener una seguridad móvil más pesada y asequible y para presionar a la infantería a pie y la artillería, pero sus débiles estadísticas de combate frente a las fuerzas mecanizadas profesionales les impiden enfrentarse cara a cara con un ejército bien equipado.§!"