l_spanish:
 gpu_development.1.t: "Radeon reta a GeForce"
 gpu_development.1.d_usa: "Meses después de que GeForce introdujo la transformación e iluminación del hardware de NVIDIA, ATI se está preparando para revelar Radeon como un desafío directo sobre velocidad, controladores y lealtad del desarrollador. La competencia está empujando el diseño gráfico estadounidense a la frontera, pero ambas firmas son fábulas, y cada avance profundiza su confianza en un puñado de fundaciones taiwanesas. Washington puede mantener los estándares gráficos y la investigación federal ampliamente abierta, o concentrar el apoyo detrás de las casas de diseño doméstica más fuertes."
 gpu_development.1.a_usa: "Apoyo a estándares abiertos e investigación"
 gpu_development.1.b_usa: "Volver a las principales casas de diseño"
 gpu_development.1.d_can: "ATI Technologies se está preparando para revelar Radeon desde su sede de Markham, desafiando a NVIDIA para el líder del rendimiento GeForce reclamado meses antes. La firma es uno de los pocos campeones semiconductores de Canadá, pero competir en la frontera exigirá un acceso más profundo al capital, la capacidad de fundición y los desarrolladores de software que deciden qué hardware tiene éxito. Ottawa puede proteger la independencia de ATI como una casa nacional de diseño, o doblarla en las cadenas continentales de suministro que vinculan el diseño canadiense con el capital americano y la fabricación asiática."
 gpu_development.1.a_can: "Proteger la independencia de ATI"
 gpu_development.1.b_can: "Integrar la ATI en el suministro continental"
 gpu_development.1.d_tai: "El concurso entre Radeon y GeForce está llegando como nuevas órdenes de wafer en Taiwán, donde ambos diseñadores de fábulas dependen de fundiciones locales para fabricar sus chips. Este mercado gráfico emergente puede ampliar la base de clientes para la industria Microchip de la isla, o concentrar escasa capacidad de vanguardia detrás de las casas de diseño de mayor crecimiento. Taipei debe decidir si mantener el acceso a la fundición abierto a muchos clientes o asegurar contratos a largo plazo con algunos diseñadores de anclas."
 gpu_development.1.a_tai: "Acceso a la fundición"
 gpu_development.1.b_tai: "Contratos de diseño de anclaje seguros"
 gpu_development.2.t: "Shaders Conviértete en programable"
 gpu_development.2.d_usa: "DirectX 8 y una nueva generación de procesadores gráficos han reemplazado los oleoductos fijos con tóxicos programables y tonos pixel. Los proveedores de hardware, los estudios de juego y los desarrolladores del sistema operativo ahora están compitiendo para definir las interfaces que darán forma a gráficos en tiempo real."
 gpu_development.2.a_usa: "Normalizar interfaces de sombra"
 gpu_development.2.b_usa: "Deje que los vendedores amplíen sus pilas"
 gpu_development.2.d_can: "Los ingenieros Radeon de ATI están construyendo soporte programable para sombreadores en una arquitectura gráfica que avanza rápidamente. Las interfaces comunes ampliarían el mercado para los diseños canadienses, mientras que las extensiones patentadas podrían dar a ATI una ventaja técnica temporal."
 gpu_development.2.a_can: "Construir alrededor de interfaces comunes"
 gpu_development.2.b_can: "Diferenciar la plataforma Radeon"
 gpu_development.2.d_jap: "Los gráficos programables están cambiando cómo los fabricantes de consolas y los estudios de juego dividen el trabajo entre hardware y software. Los soportes de plataforma de Japón pueden promover estándares portátiles o preservar arquitecturas muy optimizadas para sus propias consolas."
 gpu_development.2.a_jap: "Soporte de estándares gráficos portátiles"
 gpu_development.2.b_jap: "Optimización para plataformas de consola doméstica"
 gpu_development.3.t: "AMD Acquires ATI"
 gpu_development.3.d_usa: "AMD ha acordado adquirir ATI en un acuerdo que se une a procesadores x86, chipsets y gráficos bajo una empresa. La fusión promete plataformas informáticas integradas, pero también reduce el número de empresas independientes que compiten por diseños gráficos y capacidad de fundición."
 gpu_development.3.a_usa: "Competencia Preserve en torno a la fusión"
 gpu_development.3.b_usa: "Alentar una plataforma integrada de cálculo"
 gpu_development.4.t: "CUDA abre computación paralela"
 gpu_development.4.d_usa: "NVIDIA ha lanzado CUDA, permitiendo a los programadores utilizar procesadores gráficos compatibles para trabajar mucho más allá del renderizado. La computación científica, la simulación y el análisis de datos ahora pueden tocar miles de hilos paralelos, siempre que los desarrolladores se comprometan al ecosistema del software de NVIDIA."
 gpu_development.4.a_usa: "Promover normas de computación portátil"
 gpu_development.4.b_usa: "Implementar el ecosistema CUDA"
 gpu_development.5.t: "AlexNet cambia la carrera de AI"
 gpu_development.5.d_usa: "El resultado decisivo de ImageNet ha demostrado que las grandes redes neuronales entrenadas en procesadores gráficos pueden superar los métodos establecidos de visión informática. Los laboratorios y las empresas tecnológicas estadounidenses se apresuran a asegurar aceleradores, conjuntos de datos e investigadores antes de que los competidores puedan reproducir el avance a escala."
 gpu_development.5.a_usa: "Mantener la investigación del acelerador ampliamente accesible"
 gpu_development.5.b_usa: "Cúmulos comerciales de IA"
 gpu_development.5.d_can: "Los investigadores de la Universidad de Toronto han utilizado procesadores gráficos NVIDIA para capacitar a AlexNet y transformar el concurso ImageNet. El Canadá tiene ahora una concentración inusual de conocimientos especializados en aprendizaje automático, pero las empresas extranjeras ya están compitiendo para reclutar al equipo y comercializar sus métodos."
 gpu_development.5.a_can: "Ampliar la red de investigación pública"
 gpu_development.5.b_can: "Convierte el avance en una industria de IA"
 gpu_development.6.t: "Tensor Cores Ingrese al Centro de Datos"
 gpu_development.6.d_usa: "La arquitectura Volta de NVIDIA introduce Tensor Cores diseñado para acelerar las operaciones matriz utilizadas en el aprendizaje profundo. Los procesadores gráficos se están convirtiendo en motores especializados de centro de datos, elevando la demanda de fabricación avanzada, memoria de alta ancho de banda y software integrado firmemente."
 gpu_development.6.a_usa: "Ampliar el acceso a los aceleradores de IA"
 gpu_development.6.b_usa: "Concéntrese en plataformas de almacenamiento completo"
 gpu_development.6.d_tai: "Los aceleradores de clase Volta requieren fabricación de vanguardia y embalajes cada vez más complejos. Las fundiciones de Taiwán pueden tratar chips de IA como una clase de cliente entre muchos o reservar escasa capacidad avanzada para los diseñadores de aceleradores de más rápido crecimiento."
 gpu_development.6.a_tai: "Mantener la capacidad avanzada ampliamente disponible"
 gpu_development.6.b_tai: "Priorizar las órdenes de acelerador estratégico"
 gpu_development.6.d_kor: "Los aceleradores de IA necesitan memoria de alta ancho de banda para mantener miles de unidades de computación suministradas con datos. Los productores de memoria coreanos pueden ampliar HBM como un estándar abierto de la industria o vincular una nueva capacidad de cerca a las principales plataformas de aceleración."
 gpu_development.6.a_kor: "Normalizar y ampliar el suministro de HBM"
 gpu_development.6.b_kor: "Asociaciones de acelerador a largo plazo"
 gpu_development.7.t: "El suministro de GPU funciona seco"
 gpu_development.7.d_shortage: "La perturbación pandémica, la demanda de electrónicas y la competencia por la capacidad de fundición han dejado nuestra economía fuera de Microchips. Las tarjetas gráficas, vehículos, servidores y dispositivos de consumo ahora compiten por el mismo suministro restringido."
 gpu_development.7.d_resilient: "La interrupción pandémica y la demanda de electrónicas emergentes han tensado el mercado mundial de microchip, pero nuestra oferta actual sigue siendo resistente. La escasez en el extranjero todavía ofrece una advertencia y una oportunidad para asegurar la capacidad futura."
 gpu_development.7.a_usa: "Acceso coordinado para usuarios críticos"
 gpu_development.7.b_usa: "Acelerar la expansión de la capacidad nacional"
 gpu_development.7.a_can: "Protege la investigación y los pequeños diseñadores"
 gpu_development.7.b_can: "Bloqueo en los contratos de suministro continental"
 gpu_development.7.a_tai: "Asignar wafers a través de más clientes"
 gpu_development.7.b_tai: "Ampliación de la fundición"
 gpu_development.7.a_kor: "Estabilizar el suministro de memoria"
 gpu_development.7.b_kor: "Ampliar la producción de chips estratégicos"
 gpu_development.7.a_chi: "Importaciones de radiación en toda la industria civil"
 gpu_development.7.b_chi: "Aceleración de la sustitución nacional"
 gpu_development.7.a_jap: "Proteger la producción de automoción y electrónica"
 gpu_development.7.b_jap: "Capacidad semiconductora interna"
 gpu_development.8.t: "Hopper se convierte en un motor AI"
 gpu_development.8.d_usa: "La arquitectura Hopper de NVIDIA y el acelerador H100 combinan motores transformadores, memoria de alta ancho de banda e interconexiones de alta velocidad para grandes modelos AI. El acelerador del centro de datos ya no es una tarjeta gráfica adaptada, sino un sistema de cálculo estratégico en su propio derecho."
 gpu_development.8.a_usa: "Apoyar un ecosistema de aceleración más amplio"
 gpu_development.8.b_usa: "Escalar la plataforma de techo completo líder"
 gpu_development.8.d_tai: "La tolva depende del proceso personalizado de TSMC y el embalaje avanzado para conectar un procesador grande muere con memoria de ancho de banda alta. La demanda de IA está convirtiendo tanto las líneas de wafer como las líneas de embalaje en cuellos estratégicos para la industria de Microchip de Taiwán."
 gpu_development.8.a_tai: "Ampliar el acceso al embalaje avanzado"
 gpu_development.8.b_tai: "Capacidad de reserva para clientes anclados"
 gpu_development.8.d_kor: "Los aceleradores de clase H100 consumen pilas de HBM3, colocando a los productores de memoria coreanos en el centro de la cadena de suministro AI. La capacidad puede ampliarse para un mercado diverso o comprometerse mediante alianzas profundas con los principales proveedores de plataformas."
 gpu_development.8.a_kor: "Widen HBM3 supply"
 gpu_development.8.b_kor: "Priorizar los contratos de la plataforma estratégica"
 gpu_development.9.t: "AI Compute Buildout"
 gpu_development.9.d_usa: "Generative AI ha activado una prisa para construir centros de datos empaquetados con aceleradores avanzados. Las empresas Hyperscale están compitiendo por Microchips, energía eléctrica, equipo de redes y trabajadores cualificados, convirtiendo la capacidad informática en una preocupación industrial nacional."
 gpu_development.9.a_usa: "Mantenga los mercados informáticos ampliamente accesibles"
 gpu_development.9.b_usa: "Retroceder una construcción nacional estratégica"
 gpu_development.9.d_can: "La base de investigación AI de Canadá y la abundante electricidad han atraído propuestas para nuevos grupos de aceleradores y centros de datos. La construcción podría ampliar el acceso para universidades y startups o vincular el talento nacional más de cerca a algunas grandes plataformas extranjeras."
 gpu_development.9.a_can: "Reserve compute para una red de investigación abierta"
 gpu_development.9.b_can: "Utilizar empresas de anclaje para aumentar la capacidad"
 gpu_development.9.d_tai: "Demanda para los procesadores AI ha llenado la fundición de vanguardia y libros de pedidos avanzados. Taiwán puede ampliar el acceso a esta capacidad en todo el ecosistema semiconductor o concentrar la inversión detrás de los clientes capaces de financiar la expansión más rápida."
 gpu_development.9.a_tai: "Diversificar el acceso a la capacidad avanzada"
 gpu_development.9.b_tai: "Concéntrese en la rápida expansión de fundición"
 gpu_development.9.d_kor: "HBM se ha convertido en una de las limitaciones más estrictas para la producción de aceleradores de IA. Las empresas coreanas deben decidir si ampliar la calificación y el suministro en todo el mercado o dedicar nuevas líneas de fabricación a clientes estratégicos a largo plazo."
 gpu_development.9.a_kor: "Ampliación de la calificación y el suministro de HBM"
 gpu_development.9.b_kor: "Construye alrededor de clientes estratégicos"
 gpu_development.9.d_chi: "La demanda de computación de IA aumenta a medida que el acceso a los aceleradores extranjeros más avanzados sigue siendo incierto. Los diseñadores domésticos, fundiciones y productores de memoria deben montar una cadena completa de suministro sin asumir que cada componente líder permanecerá disponible."
 gpu_development.9.a_chi: "Apoyo a las normas de acelerador doméstico abierto"
 gpu_development.9.b_chi: "Concentrar recursos en campeones nacionales"
 gpu_development.9.d_jap: "El boom de AI ha renovado el valor estratégico de los materiales semiconductores de Japón, equipos de fabricación, experiencia en envases y nuevos proyectos de fabricación. La inversión coordinada podría conectar estos puntos fuertes, pero la industria debe elegir entre el acceso amplio de los proveedores y un programa nacional concentrado."
 gpu_development.9.a_jap: "Fortalecer el ecosistema de proveedores abiertos"
 gpu_development.9.b_jap: "Coordinar un programa de capacidad nacional"
 gpu_2000_graphics_market: "Gráfica Market Boom"
 gpu_2000_graphics_market_desc: "La demanda de los aceleradores gráficos más recientes es dibujar ingenieros y pedidos hacia los diseños líderes, Rápida investigación mientras se esfuerza el suministro de Microchips todos ellos dependen"
 gpu_accelerator_demand: "Demanda de acelerador"
 gpu_accelerator_demand_desc: "La demanda de procesadores gráficos y aceleradores de IA es atraer inversión, talento y Microchips hacia el cálculo avanzado. La expansión resultante apoya el crecimiento de la investigación y del centro de datos, al tiempo que ejerce presión adicional sobre el suministro más amplio de chips."
 gpu_foundry_expansion: "Expansión de fundición"
 gpu_foundry_expansion_desc: "La inversión pública y privada está expandiendo la capacidad de Microchip Plant, embalaje avanzado y producción de memoria de alta ancho de banda para satisfacer la creciente demanda de procesadores gráficos y aceleradores AI."