 CAN_canadian_subsidies_projects: "Subsidios Económicos Canadienses"
 CAN_canadian_subsidies_projects_desc: "El gobierno canadiense ha subvencionado históricamente muchas de sus industrias clave. Aceite, agricultura, taladro, marítimo, aeroespacial y muchos más. Mantener este legado de subsidización ayudará a mantener nuestra economía inquietante. Las subvenciones gubernamentales se pagarán cada dos semanas.\n\nCosto semanal total de subsidios gubernamentales: §Y$$[?CAN.CAN_subsidy_total]§!\n\n§g Costo débil se encuentra en la§! §Y Gastos adicionales§! §g sección del presupuesto§!\n"
