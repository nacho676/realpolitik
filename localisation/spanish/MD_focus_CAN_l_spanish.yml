 canada.20.b: "Rechazar el Trato"
 canada_md_politics.3.d: "Aquí vamos de nuevo con una cuarta disputa sobre madera blanda. Los Estados Unidos han elegido otra lucha por ello. Según ellos, nuestros gobiernos provinciales subvencionan injustamente nuestra industria maderera. Timber es propiedad de las provincias, así que fijan los precios. Nuestros mercados operan un poco diferente de lo que los estadounidenses están acostumbrados. En cualquier caso, tienen leyes que les permiten fijar tarifas sobre nosotros para «incluso el campo de juego» como lo llaman. Probablemente podemos poner fin a esta tontería de una vez por todas al traer a la Organización Mundial del Comercio. Sin embargo, eso conlleva el riesgo de enojar a los estadounidenses y hacer que este asunto vaya más allá de sólo la madera."
 CAN_tax_cuts_req_tt: "Nuestra §YPopulación§! y §Y Tasa de Impuestos Corporados§! son ambos superiores a §Y10%§!"
 canada_md_politics.27.t: "El fin de la era Chrétien"
 canada_md_politics.27.d: "Después de casi una década en el cargo, Jean Chrétien ha anunciado su intención de retirarse como Primer Ministro. Su largo mandato ha traído estabilidad y éxito electoral al Partido Liberal, pero las divisiones dentro del partido se han vuelto cada vez más difíciles de ignorar. Con Chrétien preparándose para salir de la etapa política, ahora se presta atención a Paul Martin, el Ministro de Finanzas y su sucesor más prominente. El Partido Liberal debe decidir si es hora de un nuevo líder."
 canada_md_politics.27.a: "Paul Martin dirigirá a los liberales."
 canada_md_politics.27.b: "Chrétien todavía tiene trabajo que hacer."
 canada_md_politics.28.t: "Un gobierno conservador"
 canada_md_politics.28.d: "Después de años en oposición, el movimiento conservador ha regresado al poder en Ottawa. Stephen Harper ha surgido como el nuevo líder del gobierno federal, prometiendo una dirección diferente para Canadá. Su gobierno tiene la intención de enfatizar la disciplina fiscal, una autoridad federal más fuerte y un enfoque más conservador para los asuntos internos y extranjeros. Ha comenzado un nuevo capítulo en la política canadiense."
 canada_md_politics.28.a: "Stephen Harper toma las riendas."
 canada_md_politics.28.b: "El gobierno sigue sin cambios."
 canada_md_politics.29.t: "Una nueva generación liberal"
 canada_md_politics.29.d: "El Partido Liberal ha elegido un nuevo rostro para liderar Canadá. Justin Trudeau, hijo del ex Primer Ministro Pierre Trudeau, ha aumentado rápidamente a través de las filas del partido y ahora se encuentra en la cabeza del gobierno federal. Prometiendo una visión más abierta, progresista y optimista para Canadá, Trudeau representa un cambio generacional en el liderazgo liberal. El país espera ahora para ver qué traerá su gobierno."
 canada_md_politics.29.a: "Justin Trudeau liderará Canadá."
 canada_md_politics.29.b: "El gobierno sigue sin cambios."
 canada_md_politics.30.t: "La era de Trudeau llega a su fin"
 canada_md_politics.30.d: "Después de casi una década como Primer Ministro, Justin Trudeau ha anunciado su renuncia como líder del Partido Liberal y jefe de gobierno. Su tenencia ha sido definida por políticas sociales ambiciosas, una fuerte presencia internacional y divisiones políticas cada vez más feroces en el hogar. Con el paso de Trudeau, los liberales se han convertido en Mark Carney, un economista internacionalmente reconocido, tecnócrata y ex banquero central, para guiar al país hacia una nueva era política."
 canada_md_politics.30.a: "Mark Carney liderará a los liberales."
 canada_md_politics.30.b: "Trudeau permanecerá en el cargo."
 PAUL_MARTIN_LEADER_DESC: "Paul Martin es un político liberal veterano que sirvió como Ministro de Finanzas de Canadá durante casi una década. Conocido por su enfoque en la responsabilidad fiscal y la reforma económica, Martin representa un ala más pragmática y económicamente consciente del Partido Liberal. Como Primer Ministro, busca combinar las políticas sociales liberales con el gasto público disciplinado."
 STEPHEN_HARPER_LEADER_DESC: "Stephen Harper es un economista y político conservador que llegó a la prominencia como una de las principales figuras del movimiento conservador de Canadá. Un fuerte defensor de la disciplina fiscal, el gobierno cauteloso y una política federal más asertiva, Harper busca reformar Canadá con líneas conservadoras. Su gobierno promete estabilidad, responsabilidad y un papel más fuerte para Canadá en la etapa mundial."
 JUSTIN_TRUDEAU_LEADER_DESC: "Justin Trudeau es un político liberal y el hijo del ex Primer Ministro Pierre Trudeau. Carismático y politicamente pulido, se presenta como el rostro de una nueva generación de liderazgo canadiense. Trudeau aboga por políticas sociales progresistas, multiculturalismo y una visión optimista del lugar de Canadá en el mundo."
 MARK_CARNEY_LEADER_DESC: "Mark Carney es un economista de renombre internacional y ex banquero central que ha servido como gobernador del Banco de Canadá y el Banco de Inglaterra. Un tecnócrata pragmático con un fuerte enfoque en la estabilidad económica, Carney aporta una amplia experiencia en política financiera al Partido Liberal. Como Primer Ministro, busca combinar la competencia económica con un enfoque pragmático de gobernar."
