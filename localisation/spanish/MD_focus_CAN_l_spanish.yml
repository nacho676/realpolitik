 CAN_subsidy_total_above_10_tt: "Requiere §Y Subvenciones gubernamentales§! de más de $$ 0,1 mil millones semanales (actualmente $$[?CAN_subsidy_total|R3] billones)"
 CAN_war_decisions: "Guerra Decisiones"
 CAN_burn_white_house: "Quemar la Casa Blanca"
 CAN_white_house_burned: "Quemado la Casa Blanca"
 CAN_white_house_burned_desc: "Nuestras fuerzas han quemado la Casa Blanca, la residencia oficial del Presidente Americano. Este acto de desafío reforzará la moral de nuestras tropas y demostrará nuestra fuerza a nuestros enemigos."
 canada_news.2.t: "Quema de la Casa Blanca"
 canada_news.2.d: "En un movimiento que conmocionó al mundo, las Fuerzas Canadienses han incendiado la Casa Blanca así como varios edificios clave del gobierno de Estados Unidos. El presidente estadounidense, [USA.GetLeader], ha prometido venganza en nombre del pueblo americano. \nEste acto de desafío ha enviado un fuerte mensaje a los Estados Unidos y al mundo sobre la determinación y las capacidades militares de Canadá. La comunidad internacional observa de cerca la situación y las implicaciones para las relaciones entre Estados Unidos y Canadá son significativas."
 canada_news.2.a: "Ellos recordarán para siempre"
 canada_news.2.b: "No se escaparán con esto."
 CAN_improve_infrastructure_1159: "Ampliar la infraestructura del oeste de Quebec"
 CAN_improve_infrastructure_1160: "Ampliar la infraestructura de Ungava"
 CAN_ati_canadian_graphics_research_compact: "Pacto canadiense de investigación gráfica"
 CAN_ati_canadian_graphics_research_compact_desc: "Una base de investigación canadiense protegida vincula a los equipos locales de ingeniería de AMD con universidades y laboratorios públicos. El compacto mantiene una experiencia gráfica avanzada arraigada en Canadá al tiempo que contribuye a los productos globales."
 CAN_ati_integrated_amd_compute_engine: "Motor de Computación AMD integrado"
 CAN_ati_integrated_amd_compute_engine_desc: "La ingeniería gráfica canadiense está incrustada en una plataforma AMD unificada que abarca procesadores, gráficos, consolas y aceleradores de centro de datos. Las hojas de ruta compartidas convierten la profundidad arquitectónica en capacidad de producción e investigación."
 canada.310.a: "Retrocede el equipo de arquitectura"
 canada.310.b: "Escalar la arquitectura comercialmente"
 canada.310.d: "Radeon 9700 Pro de ATI presentó la arquitectura R300 el 18 de julio de 2002 y colocó un equipo de diseño canadiense en la parte delantera de los gráficos programables. Debemos decidir si el líder debe profundizar la investigación de arquitectura o acelerar el alcance comercial."
 canada.310.t: "R300 cambia la carrera gráfica"
 canada.311.a: "Construir la práctica semi-costo"
 canada.311.b: "Priorizar la hoja de ruta PC"
 canada.311.d: "Microsoft y ATI anunciaron un acuerdo de desarrollo tecnológico para la próxima Xbox el 14 de agosto de 2003. El contrato podría establecer una práctica de diseño semipersonal canadiense o permanecer secundaria a la hoja de ruta personal del ordenador de ATI."
 canada.311.t: "ATI inicia el programa Xbox"
 canada.312.a: "Integrar las hojas de ruta de ingeniería"
 canada.312.b: "Proteger un pacto de investigación canadiense"
 canada.312.d: "AMD completó su adquisición de ATI en octubre de 2006. Un año más tarde, debemos dar forma a cómo los equipos gráficos adquiridos encajan en la hoja de ruta del procesador AMD preservando al mismo tiempo la base de ingeniería que hizo valiosa ATI."
 canada.312.t: "ATI Después de la Adquisición AMD"
 canada.313.a: "Institucionalizar la red de consolas"
 canada.313.b: "Reinvest en la arquitectura de ordenador personal"
 canada.313.d: "APUs de AMD semipersonal, con gráficos del antiguo equipo de ATI en Markham, propulsaron Xbox One y PlayStation 4 de Sony en noviembre de 2013. Los contratos pueden anclar una red de silicio duradera o generar ingresos para nuestro programa personal de arquitectura informática."
 canada.313.t: "Radeon potencia una generación de consolas"
 canada.314.a: "Fold Radeon en el motor informático integrado de AMD"
 canada.314.b: "Ancla un compacto de investigación gráfica canadiense"
 canada.314.d: "AMD lanzó sus primeros productos gráficos RDNA el 7 de julio de 2019 con una arquitectura rediseñado para juegos y plataformas futuras. Los antiguos ingenieros de ATI en Markham que lo diseñaron pueden ser absorbidos en una sola plataforma AMD que abarca procesadores, consolas y aceleradores del centro de datos, o mantenidos como base de investigación propia."
 canada.314.t: "RDNA Resets arquitectura Radeon"
 canada.320.t: "El Montreal Graphics House"
 canada.320.d: "Matrox tiene una parte real del mercado de gráficos y una reputación para los conductores que trabajan. Dos rivales mucho mayores están a punto de gastar más en una sola generación de chips que Matrox gana en un año. Puede luchar por el mercado de consumo o retirarse a los clientes profesionales que pagan por la fiabilidad."
 canada.320.a: "Retiro al mercado profesional"
 canada.320.b: "Lucha por el mercado de consumo"
 canada.321.t: "La segunda oportunidad de Parhelia"
 canada.321.d: "La Parhelia de Matrox llegó tarde y más lento que sus rivales de ATI y Nvidia. Un sucesor necesitaría una generación completa de financiación sin garantía que aterrice mejor. Cancelarlo termina la presencia de Montreal en los gráficos de consumo para siempre."
 canada.321.a: "Cancelar la línea de consumo"
 canada.321.b: "Fondo una generación más"
 canada.322.t: "El último independiente"
 canada.322.d: "La otra empresa gráfica de Canadá ha sido comprada por un creador de chips extranjero, dejando a Matrox como la última casa gráfica independiente en el país. Un socio traería capital y acceso a la fabricación en los términos de otra persona. Mantenerse privado significa financiar todo de los ingresos."
 canada.322.a: "Mantenerse independiente y privado"
 canada.322.b: "Tomar un socio extranjero y su capital"
 canada.323.t: "De Pixels a Vision"
 canada.323.d: "El mismo silicio de Matrox que conduce exhibiciones puede inspeccionar partes en una línea de producción, y los clientes industriales pagan por la precisión en lugar de las tasas de marco. Hacer visión de la máquina el centro de la empresa significa reconstruir alrededor de ella. Mantenerse con pantallas mantiene un negocio que ya funciona."
 canada.323.a: "Reconstruir la empresa alrededor de la visión de máquina"
 canada.323.b: "Manténgase con pantallas profesionales"
 canada.324.t: "Matrox Divides"
 canada.324.d: "Las empresas de imágenes, vídeos y gráficos de Matrox se han convertido en tres compañías que comparten un nombre y un balance. Dividirlos permite que cada uno tome la inversión externa y responda por sí mismo. Mantenerlos juntos mantiene la compañía de los fundadores entera y las subvenciones cruzadas con ella."
 canada.324.a: "Dividir las divisiones en empresas separadas"
 canada.324.b: "Mantenga el conjunto del grupo"
 canada.325.t: "Luces del norte, Sombras de silicona"
 canada.325.d: "Un cuarto de siglo de estrechamiento y especialización ha resuelto lo que Matrox es para, y lo que queda de ingeniería gráfica canadiense con él. La compañía de Montreal que una vez vendió tarjetas a todo el mundo ahora vende a quien necesita lo que sólo construirá."
 canada.325.a: "Una pila de visión segura"
 canada.325.b: "Sistemas visuales certificados"
 canada.325.c: "Soberana computación visual"
 canada.325.e: "Un gráfico abierto commonwealth"
 CAN_matrox_secure_vision_stack: "Seguro Visión Stack"
 CAN_matrox_secure_vision_stack_desc: "Visión de la máquina construida por una empresa que responde a nadie en el extranjero, para clientes que necesitan saber dónde fueron diseñados sus sistemas de inspección. El mercado es estrecho y los de dentro no pueden comprar en otro lugar."
 CAN_matrox_certified_visual_systems: "Sistemas Visuales certificados"
 CAN_matrox_certified_visual_systems_desc: "Imaging hardware certificado para el trabajo industrial y médico donde un píxel equivocado tiene consecuencias. Los volúmenes son pequeños, la cualificación lleva años y una vez que nada calificado lo desplaza."
 CAN_matrox_sovereign_visual_compute: "Soberana Computación Visual"
 CAN_matrox_sovereign_visual_compute_desc: "Canadá mantuvo una compañía gráfica propia a través de las décadas en que todos los demás vendieron la suya. Las partes no son las más rápidas y la ingeniería detrás de ellas se quedó en Montreal."
 CAN_matrox_open_graphics_commonwealth: "Abrir Graphics Commonwealth"
 CAN_matrox_open_graphics_commonwealth_desc: "Los conductores, la herramienta y la documentación salieron a la luz en lugar de detrás de una licencia. Canadá gana menos del hardware y mucho más de ser el lugar donde se escriben las normas."
 canada.330.t: "BlackBerry va móvil"
 canada.330.d: "Research In Motion ha introducido el BlackBerry 5810, combinando llamadas de voz con el correo electrónico inalámbrico seguro que sus clientes corporativos y gubernamentales ya dependen. El crecimiento del suscriptor está llevando la empresa Waterloo a través de la caída del punto-com. Ottawa puede dejar el grupo de investigación a capital privado o poner dinero público detrás de él."
 canada.330.a: "Dejar escalar RIM en privado"
 canada.330.b: "Retrocede el clúster inalámbrico Waterloo"
 canada.331.t: "La orden judicial"
 canada.331.d: "Una compañía de patentes ha ganado una resolución que cerraría el servicio BlackBerry a través de los Estados Unidos, donde la mayoría de los suscriptores son. El asentamiento termina la amenaza inmediatamente y cuesta $612,5 millones. Luchando mantiene el dinero y deja el mercado más grande de la compañía en manos de una corte estadounidense."
 canada.331.a: "Resolver y poner fin a la amenaza"
 canada.331.b: "Lucha contra la orden judicial"
 canada.332.t: "El reto de la pantalla táctil"
 canada.332.d: "El iPhone de Apple ha puesto pantallas táctiles y aplicaciones de terceros en el centro del mercado de smartphones. Investigación En Motion puede defender los dispositivos de teclado seguros que su negocio empresarial se construyó, o abrir BlackBerry a software exterior antes de que Apple y Google terminen fijando el estándar."
 canada.332.a: "Proteger el hardware empresarial seguro"
 canada.332.b: "Fomentar un ecosistema de aplicación"
 canada.333.t: "RIM Acquires QNX"
 canada.333.d: "Research In Motion ha comprado sistemas de software QNX para aproximadamente $200 millones, ganando un sistema operativo en tiempo real ya funcionando en automóviles, equipos médicos y control industrial. Puede convertirse en el software bajo la próxima generación de teléfonos, o la empresa puede empujarlo más hacia los mercados incrustados donde ya se confía."
 canada.333.a: "Construya la siguiente plataforma de teléfonos"
 canada.333.b: "Ampliar QNX más allá de los teléfonos"
 canada.334.t: "La última apuesta de BlackBerry 10"
 canada.334.d: "Research In Motion se ha renombrado BlackBerry y lanzado BlackBerry 10 en el Z10 y Q10. El sistema basado en QNX llega años después de sus rivales, forzando una opción entre un relanzamiento del consumidor y el trabajo de gestión de dispositivos y movilidad empresarial que los clientes gubernamentales y empresariales todavía pagan."
 canada.334.a: "Atrás el lanzamiento de BlackBerry 10"
 canada.334.b: "Servicios empresariales prioritarios"
 canada.335.t: "Qué Waterloo Construyó"
 canada.335.d: "Un cuarto de siglo del edificio BlackBerry seguro computación móvil en Waterloo ha resuelto lo que Canadá hace, quién la compra, y si alguno de ellos todavía lleva el nombre en el edificio."
 canada.335.a: "El soberano incrustado"
 canada.335.b: "Sistemas seguros, mantenidos cerca"
 canada.335.c: "El pivote de software"
 canada.335.e: "El Waterloo Holdout"
 CAN_blackberry_embedded_sovereign: "Incrustado Soberano"
 CAN_blackberry_embedded_sovereign_desc: "Los teléfonos fueron y el sistema operativo se quedó. QNX funciona en automóviles, equipos médicos y control industrial, y la empresa vende software de seguridad a las instituciones que ya eran sus clientes. Casi nadie que depende de ello sabe que lo hacen."
 CAN_blackberry_secure_systems_holding: "Mantenimiento de sistemas seguros"
 CAN_blackberry_secure_systems_holding_desc: "La plataforma incrustada paga por los teléfonos, y los teléfonos mantienen la marca delante de las personas que compran la plataforma. Ni la mitad es la más grande de su tipo y ambos son confiados con cosas que no deben filtrarse."
 CAN_blackberry_software_pivot: "El software Pivot"
 CAN_blackberry_software_pivot_desc: "El sistema operativo se gastó en un teléfono que llegó demasiado tarde, y lo que sobrevivió al fracaso fue el negocio del software debajo de él. Canadá vende comunicaciones seguras y gestión de dispositivos a los gobiernos que no las comprarán en ningún otro lugar."
 CAN_blackberry_waterloo_holdout: "El Waterloo Holdout"
 CAN_blackberry_waterloo_holdout_desc: "Canadá siguió construyendo su propia plataforma móvil después de que todos los demás concedieran el mercado a dos estadounidenses. La base de instalación es pequeña, soberana y completamente bajo control canadiense."
 canada.7.c: "Abrir conversaciones constitucionales con Quebec City."
 CAN_quebec_talks_tt: "Reabrir el archivo constitucional §G aumentará§! la felicidad canadiense francesa en §G12%§! y dejaremos poner una oferta fresca a la ciudad de Quebec."
 CAN_federal_transfers_to_quebec: "Elevar los pagos de nivelación"
 CAN_federal_transfers_to_quebec_desc: "Ottawa siempre puede encontrar un poco más para las provincias que más fuerte piden, y Quebec nunca ha sido tímido a la hora de pedir."
 CAN_bilingual_public_services: "Extender los servicios públicos bilingües"
 CAN_bilingual_public_services_desc: "Cada ventanilla federal, de Gaspé a la isla de Vancouver, que atienda en ambos idiomas vale más en Quebec que una docena de discursos en Ottawa."
 CAN_french_happiness_below_80_tt: "Requiere §YFrench Canadian Happiness§! por debajo del 80% (actualmente [?CAN.french_happiness_var|0]%)"