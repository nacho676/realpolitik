 CAN_french_happiness: "Felicidad de los Canadienses Franceses"
 CAN_french_happiness_desc: "Los canadienses franceses, llamados comúnmente en Quebec «québécois», son el grupo étnico de Canadá que remonta su linaje a los colonos franceses del siglo XVII en adelante. Los canadienses franceses suman cerca del veintidós por ciento de la población total de Canadá. El nacionalismo québécois ha ido decayendo desde los años sesenta; sin embargo, sigue siendo un hecho firme en Quebec, y muchos aún se llaman a sí mismos québécois y no canadienses.\n\n§G60%§! o más para Buena felicidad francesa\n§Y50%§!-§Y60%§! para Felicidad francesa neutral\n§R49%§! o menos para Mala felicidad francesa\n\n§gFelicidad canadiense francesa:§! \n[CAN_color_of_variable]\n\n§gEfectos actuales:§! \n[CANGetFrenchHappinessEffects]"
