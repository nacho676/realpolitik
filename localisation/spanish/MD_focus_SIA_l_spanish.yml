 SIA_asean_hegemony_government_tt: "Ni tampoco §Y[conservatism_L]§! ni tampoco §Y[socialism_L]§! es el partido gobernante."
 SIA_path_populist: "§Y[neutral_Social_L]§! es el partido gobernante."
 SIA_path_royalist: "§Y[Nat_Autocracy_L]§! or §Y[Monarchist_L]§! es el partido gobernante."
 SIA_path_reform: "§Y[socialism_L]§! es el partido gobernante."
 SIA_path_communist: "§Y[Communist-State_L]§! es el partido gobernante."
 SIA_path_democrat: "§Y[conservatism_L]§! es el partido gobernante."
 SIA_committed_to_ballot: "Comprometidos en la urna electoral"
 SIA_bhumjaithai_coalition: "§Y[Neutral_conservatism_L]§! mantiene el equilibrio del poder."
 SIA_tt_peace_dialogue_intensity: "Requiere que la insurgencia Sur Profunda se haya enfriado por debajo de 50 intensidad."
 SIA_tt_shan_militia_support: "Requiere el apoyo de las milicias Shan por lo menos 60."
 SIA_tt_reform_pressure: "Requiere la presión de reforma por encima de 20."
 SIA_tt_populist_tide_20: "Requiere la marea populista por encima de 20."
 SIA_tt_palace_bargain_support: "Requiere que la Cámara de Mahidol realista bloc se mantenga por encima del 15 por ciento de los votos."
 SIA_tt_china_contracts_renegotiated: "Los contratos chinos ya no han sido renegociados."
 SIA_tt_us_security_reviewed: "Ya no se ha concluido la revisión de seguridad estadounidense-Tailandia."
 SIA_tt_tax_modernized: "La colección de ingresos no se ha modernizado."
 SIA_tt_gripen_ef_contracted: "El contrato Gripen E/F no se ha firmado ya."
 SIA_the_quiet_word: "La palabra silenciosa"
 SIA_the_quiet_word_desc: "Una llamada de la oficina correcta hace lo que los tanques solían hacer. La red deja claro quién es realmente el gobierno, y el mensaje se recibe sin un disparo."
 SIA_judicial_review_route: "Gobierno por orden judicial"
 SIA_judicial_review_route_desc: "El Tribunal Constitucional encuentra un tecnicismo, y el partido gobernante se disuelve de la noche a la mañana. Sin barracas, sin toque de queda, sólo un veredicto y una transferencia muy tranquila del poder."
 SIA_the_appointed_senate: "Una cámara superior, empuñada"
 SIA_the_appointed_senate_desc: "Doscientos cincuenta escaños que ninguna votación toca, llena de la red y responde a ella sola. Cada gobierno gobierna ahora en el placer del Senado."
 SIA_coalition_kingmakers: "Reyes de la Coalición"
 SIA_coalition_kingmakers_desc: "Los escaños del gabinete, las asignaciones presupuestarias y una palabra discreta a los corredores de poder adecuados reúnen un gobierno que responde a la red del palacio antes de responder a los votantes."
 SIA_constitutional_engineering: "Ingeniería de la Carta"
 SIA_constitutional_engineering_desc: "Una nueva constitución, redactada en salas de comités y no a punta de pistola, bloquea las ventajas de la red en la ley básica del país. Nada de eso necesitaba un solo soldado."
 SIA_the_establishment_consensus: "El consenso sobre el establecimiento"
 SIA_the_establishment_consensus_desc: "Los tribunales, el Senado, el ejército y los negocios ahora se mueven como uno, y las elecciones se han convertido en una formalidad que la red siempre gana. Nadie tenía que llamar a los tanques."
 SIA_judicial_review_route_choice_tt: "Elija hasta qué punto llega el fallo de la Corte Constitucional.\n - §YUna disolución total§!: rompe la popularidad del partido pero alimenta presión de reforma\n - §Y Un estricto fallo técnico§!: cuesta menos"
 SIA_coalition_kingmakers_choice_tt: "Elige un compañero de coalición.\n - §YLos intermediarios provinciales§!: comprados con tesorería\n - §Y La élite empresarial§!: cortejado a un pequeño costo para la estabilidad"
 SIA_royalist_no_coup_path: "Comprometida con el camino realista no coup (monarquía de red)"
 SIA_establishment_category: "Administración de establecimientos"
 SIA_establishment_category_desc: "Las herramientas de una monarquía de red que nunca necesitó un golpe: el senado designado, un banco cooperativo y los propios canales de persuasión del palacio."
 SIA_senate_procedural_vote: "Convocar una votación de procedimiento"
 SIA_senate_procedural_vote_desc: "Mientras que la cámara designada en línea detrás de una medida la casa elegida nunca pasaría. Cuesta el capital político, pero el voto nunca está en duda. §GEstabilidad se eleva.§!"
 SIA_court_referral: "Remitirlo al Tribunal"
 SIA_court_referral_desc: "Entregar la última maniobra de los populistas a un tribunal afín y dejar que una sentencia haga el trabajo que unas elecciones se niegan a hacer. §RLa popularidad del partido gobernante cae, pero la táctica alimenta la presión reformista cuanto más se usa.§!"
 SIA_palace_audience: "Solicitar una audiencia en palacio"
 SIA_palace_audience_desc: "Una audiencia formal mantiene satisfechos al ejército y a las viejas familias terratenientes de que la red sigue hablando en su nombre. §GMejora la opinión de militares y terratenientes.§!"
 thailand.434.t: "El Reglamento de la Corte"
 thailand.434.d: "El Tribunal Constitucional dicta su veredicto sobre la conducta del partido gobernante. Todo el mundo en la sala ya sabe de qué manera va a ir esto."
 thailand.434.a: "Disolver a la fiesta de forma absoluta"
 thailand.434.b: "Reducir el fallo a un tecnicismo"
 thailand.435.t: "Los Kingmakers' Bargain"
 thailand.435.d: "Al reunir a un gobierno, la red puede vivir con medios para pagar a alguien. La única pregunta es quién, y en qué moneda."
 thailand.435.a: "Comprar a los jefes provinciales"
 thailand.435.b: "Corte la élite de negocios"
 SIA_no_lar_dlc_tt: "Requiere la expansión de La Resistencia para los mecánicos de la agencia de inteligencia. El poder político se otorga en su lugar."
 SIA_the_national_intelligence: "El Nacional Agencia de Inteligencia"
 SIA_the_national_intelligence_desc: "Un único National Agencia de Inteligencia ahora se encuentra por encima de los servicios policiales, militares y civiles que solían competir por la misma información. Fundarlo es caro, y las agencias que absorbe no abandonan su territorio sin luchar."
 SIA_special_branch_police: "Subdivisión Especial"
 SIA_special_branch_police_desc: "Una ala de policía política y antiterrorista dedicada da al Estado un ojo más agudo en la subversión y el malestar. Los oficiales esperan que los fondos coincidan con el mandato, y que la expectativa no desaparece una vez que se levante la unidad."
 SIA_counter_insurgency_south: "El Fuego Sur"
 SIA_counter_insurgency_south_desc: "Los activos de inteligencia se trasladan al sur a la insurgencia en Pattani, Yala y Narathiwat, cazando redes que el ejército solo nunca podría mapear. La represión compra terreno contra los militantes, pero lo compra con la paciencia de la provincia."
 SIA_signals_intelligence: "El Estado que escucha"
 SIA_signals_intelligence_desc: "Una señal y ala de criptografía le da a Tailandia sus propios oídos en las ondas aéreas y redes de la región. Los rompe códigos y las granjas de servidores son un gasto permanente que nunca se apaga."
 SIA_humint_networks: "Hombres en el campo"
 SIA_humint_networks_desc: "Los oficiales de casos y los informantes pagados construyen una red humana a través de las fronteras que ningún satélite puede reemplazar. Reclutar y correr agentes de esta manera es un trabajo costoso, sin memoria, y se paga en el capital político, no fanfare."
 SIA_cia_partnership: "La conexión Langley"
 SIA_cia_partnership_desc: "Un canal formal de enlace con el Central Agencia de Inteligencia intercambia acceso y entrenamiento para una inclinación hacia Washington. Cada cable que corre a Langley es un alambre que Langley puede leer ambas maneras."
 SIA_mss_cooperation: "El Guoanbu Handshake"
 SIA_mss_cooperation_desc: "Un canal silencioso al Ministerio de Seguridad del Estado de China intercambia cooperación para una inclinación hacia Beijing. La relación profundiza los lazos de Sino-Thai, pero lleva la misma exposición bidireccional que cualquier enlace extranjero trae."
 SIA_the_watchful_state: "El Estado vigilante"
 SIA_the_watchful_state_desc: "La policía nacional y la inteligencia extranjera se fusionan en un único aparato de seguridad permanente, su alcance se extiende por las actualizaciones de los organismos frescos y nuevos oficiales sobre el terreno. Mantener todo esto funcionando es ahora una línea permanente en el presupuesto."
 SIA_surveillance_state: "Panopticon"
 SIA_surveillance_state_desc: "El mandato de la agencia se extiende hasta su límite, detección y capacidad defensiva elevada como lo permite la ley y luego un poco más. Las empresas caen bajo el escrutinio, la tesorería sangra capital político y la estabilidad paga la diferencia."
 SIA_accountable_oversight: "Estado de derecho"
 SIA_accountable_oversight_desc: "El examen judicial, la supervisión parlamentaria y los requisitos de presentación de informes públicos se vinculan con el organismo, el comercio del poder de detección cruda para su legitimidad y una menor corrupción. El servicio es más lento y menos omnisciente, pero responde a alguien además de sí mismo."
 SIA_national_intelligence_idea: "Doctrina de inteligencia nacional"
 SIA_national_intelligence_idea_desc: "El ethos fundador de la nueva agencia se extiende a través de la burocracia: la información es poder, y cada ministerio ahora lo alimenta hacia arriba. El hábito de ver los excesos que cualquier gobierno pasa a estar en el cargo."
 SIA_territorial_defense: "Doctrina de defensa de la patria"
 SIA_territorial_defense_desc: "Los soldados del Reino están perforados para mantener el terreno en lugar de perseguirlo. Las formaciones excavan, los ingenieros estudian la frontera para las obras permanentes y una doctrina defensiva se mantiene a través de las fuerzas armadas, endureciendo la infantería y acelerando el ritmo de fortificación antes de que el primer disparo sea disparado."
 SIA_shorad_defense: "Defensa aérea de corto alcance"
 SIA_shorad_defense_desc: "Los misiles de corto alcance, las armas de radar y los sitios AA endurecidos se tejen en un solo escudo superpuesto. Los aviones enemigas que se extienden sobre los cielos tailandeseses encuentran todos los enfoques ya variados y todas las baterías listas para responder."
 SIA_border_fortification_program: "Programa de Fortificación Fronteriza"
 SIA_border_fortification_program_desc: "El Cuerpo de Ingenieros tiene un mandato permanente y un presupuesto permanente: encuesta, vierte y entrelaza a lo largo de toda la frontera, incluida la larga y fina frontera Lao, para que las obras frescas aumenten más rápido y las tropas excavadas se mantengan más duras dondequiera que sean necesarias."
 SIA_anti_amphibious_command: "Comando anti anfibio"
 SIA_anti_amphibious_command_desc: "Un comando dedicado estudia cada playa y boca de río que un invasor podría usar. Las baterías costeras, los sensores de capa y las fuerzas de reacción perforadas hacen que un aterrizaje en las costas del Reino sea una jugada sangrienta e incierta."
 SIA_defend_myanmar_border: "Fortalecer la frontera de Myanmar"
 SIA_defend_myanmar_border_desc: "La agitada marcha occidental con Myanmar dirige la longitud del Reino. Las líneas de Bunker y las posiciones preparadas se excavan en los pases y valles del río, convirtiendo el difícil terreno en una pared."
 SIA_defend_cambodia_border: "Fortalecer la frontera camboyana"
 SIA_defend_cambodia_border_desc: "Las memorias de los enfrentamientos en Preah Vihear todavía están frescas. La frontera oriental se endurece con obras frescas para que ninguna disputa futura encuentre a los soldados del Reino abiertos."
 SIA_defend_malaysia_border: "Fortalecer la Frontera de Malasia"
 SIA_defend_malaysia_border_desc: "El inquieto sur profundo está atado con bunkers y puntos fuertes, anclando la frontera con Malasia y dando las guarniciones de Pattani terreno duro para caer de nuevo."
 SIA_fortress_thailand: "Fortress Thailand"
 SIA_fortress_thailand_desc: "Cada frontera está amurallada, cada aproximación se extiende. Luchando en tierra natal, las formaciones tailandesas chocan con la confianza de un defensor que conoce el suelo. Un invasor sangra en el calor, las colinas y las interminables líneas preparadas."
 SIA_defend_myanmar_border_tt: "Construye §YNivel 2§! fortes de tierra en las provincias fronterizas §Y9§!, inmediatamente.\n §YTailandia del Norte§!: 4 provincias\n - §YTailandia Central§!: 2 provincias\n - §YSouthern Thailand§!: 3 provinces"
 SIA_defend_cambodia_border_tt: "Construye §YNivel 2§! fortes de tierra en las provincias fronterizas §Y6§!, inmediatamente.\n §YTailandia Central§!: 3 provincias\n - §YIsaan§!: 3 provincias"
 SIA_defend_malaysia_border_tt: "Construye §YNivel 2§! fortes de tierra en las provincias fronterizas §Y5§!, inmediatamente.\n - §YPattani§!: 4 provincias\n - §YTailandia meridional§!: 1 provincia"
 SIA_sovereign_wealth_fund_allocation: "Asignar el Fondo Soberano de Riqueza"
 SIA_sovereign_wealth_fund_allocation_desc: "Dirigir otro tramo de regalías de recursos a la cartera exterior del fondo soberano. La asignación inmoviliza capital durante un año antes de que sus retornos empiecen a alimentar el presupuesto."
 SIA_state_resource_stake: "Tom a State Resource Stake"
 SIA_state_resource_stake_desc: "La Tesorería compra directamente en las concesiones mineras y energéticas en lugar de limitarse a imponerlas. El dinero viene rápido, así que el papeleo nadie quiere mirar demasiado de cerca."
 thailand.436.t: "Escapar de la trampa de ingresos medios"
 thailand.436.d: "Los estadísticos lo confirman: Tailandia ha despejado el umbral de ingresos que ha atrapado a tantos de sus vecinos para una generación. Factorías que una vez montaron piezas para otros ahora diseñarlas. La pregunta en el Gabinete es qué hacer con el momento."
 thailand.436.a: "Difusión de los logros"
 thailand.436.b: "Banco el dividendo"
 SIA_the_army_question: "La cuestión del ejército"
 SIA_the_army_question_desc: "Un general para cada par de cientos soldados, promoción corriendo en clase y facción antes del mérito, y una factura salarial engordada por negocios que no tienen nada que ver con la defensa. El ejército del Reino trabaja, pero no al soldado. Alguien tiene que decidir qué clase de ejército va a ser."
 SIA_the_professional_turn: "El giro profesional"
 SIA_the_professional_turn_desc: "Menos soldados, mejor entrenados, contestando al mérito en lugar de la lista de rehuffles. Es el camino más difícil, y pone a todos los generales con un negocio para proteger en el aviso."
 SIA_the_reshuffle_list: "La Lista de Rehabilitación no es un plan de guerra"
 SIA_the_reshuffle_list_desc: "El reajuste anual es el verdadero ritmo operativo del RTARF y se lleva bajo la firma de un ministro civil en lugar de la aritmética propia del cuartel. Comando comienza a responder al gobierno del día."
 SIA_retire_the_experts: "Retire a los expertos"
 SIA_retire_the_experts_desc: "Cada graduado mayor tiene una factura de estrella 'experto' supernumeraria o 'especialista', ya sea que el post hace algo o no. Compra a los generales honorarios y cierra las facturas detrás de ellos."
 SIA_close_the_ledger: "Cierra el Ledger"
 SIA_close_the_ledger_desc: "El canal de televisión del ejército, los campos de golf, las tenencias de tierras y los esquemas de bienestar que funcionaban con el trabajo no remunerado de los soldados se entregan a la administración civil. La vida de las barracas se hace más pequeña. El presupuesto es honesto."
 SIA_break_the_class_ladder: "Rompe la escalera de clase"
 SIA_break_the_class_ladder_desc: "Promoción por clase pre-cadeta y facción unitaria, Wongthewan contra Burapha Phayak, da lugar a la promoción en el registro. Cuesta a las viejas redes su control sobre quién manda después."
 SIA_all_volunteer_force: "La Fuerza de Todo Voluntario"
 SIA_all_volunteer_force_desc: "El ejército se construyó enteramente sobre los que lo eligen: mejor entrenado, mejor organizado y pagado lo que cuesta. Una fuerza ampliamente competente, en un salario permanente el tesorería llevará para bien."
 SIA_the_elite_spearhead: "Elite Spearhead"
 SIA_the_elite_spearhead_desc: "En lugar de profesionalizar todo el ejército, concentrar la inversión. Una pequeña punta de las fuerzas especiales, costosamente equipada y cuidadamente mantenida, construida para golpear muy por encima del peso de la fuerza detrás de ella."
 SIA_high_readiness_army: "El ejército de alta resistencia"
 SIA_high_readiness_army_desc: "Las formaciones permanentes se mantenían a pie de guerra: perforadas, planificadas y vigiladas por delante del contacto. La disposición como esta nunca es libre de mantener, pero significa que el ejército que aparece es el ejército que fue prometido."
 SIA_the_minister_decides: "El Consejo Asesora, el Ministro Decide"
 SIA_the_minister_decides_desc: "El Consejo Supremo del Mando mantiene su asiento en la mesa, pero las decisiones son las que debe tomar el ministro civil y los generales para llevar a cabo. Es la reforma que el viejo guardia lucha más duro, y la que hace que cada otra reforma se adhiera."
 SIA_the_conscript_host: "El anfitrión Conscript"
 SIA_the_conscript_host_desc: "Números sobre el pulido. Un borrador más amplio llena las filas de forma barata, la tesorería deja de sangrar por una ley de salario profesional hinchada, y el cuerpo oficial mantiene todos los privilegios que ya tiene."
 SIA_fill_the_quota: "Llena el Quota"
 SIA_fill_the_quota_desc: "La lotería de conscripción anual llega más profundamente a la piscina elegible. Más nombres dibujados significa más botas llenadas, y una barra inferior para despejar para usar el uniforme."
 SIA_the_boys_in_black: "Los Chicos en Retorno Negro"
 SIA_the_boys_in_black_desc: "El Thahan Phran, los rangers voluntarios de la frontera, se doblan en fuerza. Ligeramente pagados y criados localmente, sostienen los pueblos fronterizos y sangran a un invasor en tierra que saben mejor que cualquier formación regular."
 SIA_or_sor_grid: "Una O Sor en Cada Tambon"
 SIA_or_sor_grid_desc: "Los voluntarios de defensa del pueblo, el Or Sor, están en pie tambon por tambon al otro lado del campo. Es una cuadrícula de milicias que no necesita línea de suministro, porque nunca sale de casa."
 SIA_cheap_steel_many_hulls: "Acero barato, muchos cascos"
 SIA_cheap_steel_many_hulls_desc: "Armar la masa de plantas tailandesas en lugar de catálogos extranjeros. El kit es más sencillo y el borde es aburrido, pero las fábricas de armas lo apagan rápido y lo convierten en barato."
 SIA_the_barracks_economy: "La economía de los barracones"
 SIA_the_barracks_economy_desc: "Que los negocios de los generales paguen por la movilización en lugar de luchar contra ellos. El canal, los campos de golf y el resto del portafolio abren sus libros al pecho de guerra, dinero ahora y corrupción para siempre."
 SIA_reserve_of_the_realm: "Reserva del Reino"
 SIA_reserve_of_the_realm_desc: "Cada hombre que alguna vez llevaba el uniforme está registrado, rastreado y listo para recordar. Los rollos de reserva se hinchan y el call-up funciona más rápido, a costa de un oleo de entrenamiento estirado más delgado para cubrirlo."
 SIA_the_old_guard_endures: "El Comando que nunca duerme"
 SIA_the_old_guard_endures_desc: "El ejército de masas se hace permanente, la factura salarial finalmente trajo a lo que el tesoro puede soportar, y con ella el cuerpo oficial que corre junto a él. El control civil está fuera de la mesa para siempre. La Guardia Vieja simplemente ha aprendido a vivir dentro de sus medios."
 SIA_swf_windfall: "Fondo Soberano"
 SIA_swf_windfall_desc: "La asignación de este año está pagando. Las devoluciones amortiguan el presupuesto hasta que la posición sea reducida."
