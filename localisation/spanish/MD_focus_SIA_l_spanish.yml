 SIA_kra_phase_1_funding_tt: "Requiere que la refrigeración del estudio de viabilidad haya expirado, y tesorería por encima de ambos upkeep (actualmente §Y$[?ROOT.SIA_kra_upkeep|0] §! billion) y el §Y$20§! billion Phase I payment."
