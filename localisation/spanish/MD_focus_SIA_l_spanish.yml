l_spanish:
 charoenchai_hinthao: "Charoenchai Hinthao"
 charoenchai_hinthao_desc: "Un Real Jefe del Ejército tailandés de la generación 2020 que construyó su reputación en doctrina defensiva y las duras lecciones de la frontera sur. Perfora sus formaciones para mantener el suelo y sangra a un atacante blanco."
 songwit_noonpakdee: "Songwit Noonpakdee"
 songwit_noonpakdee_desc: "Un oficial superior del Ejército Real de Tailandia conocido por el trabajo y la organización del personal en lugar de ser presentado. Mantiene las formaciones del ejército mantenidas, abastecidas y listas, y él está a gusto con la política que viene con alto mando."
 adung_phaniam: "Adung Phan-iam"
 adung_phaniam_desc: "Un oficial de la Armada Real tailandesa de la flota moderna, en casa con las naves capitales y la doctrina de la acción superficial. Sostiene por una marina que se puede sentir más allá del Golfo de Tailandia."
 punpakdee_pattanakul: "Punpakdee Pattanakul"
 punpakdee_pattanakul_desc: "Un oficial Real de la Fuerza Aérea tailandesa de la generación de reforma que impulsa el servicio hacia estándares profesionales, marcos aéreos modernos y un oleoducto de entrenamiento que produce aercrew en lugar de formaciones de desfile."
 intel_chief_nia: "Director nacional Agencia de Inteligencia"
 intel_chief_nia_desc: "El jefe del National de Tailandia Agencia de Inteligencia dirige el esfuerzo de inteligencia civil del país, tejiendo los informes de las provincias, las fronteras y la red de palacios en una sola imagen para el gobierno."
 thailand_focus: "Thai Enfoque Árbol"
 SIA_the_2001_election_shortcut: "The 2001 Election"
 SIA_lost_territories_shortcut: "Los Territorios Perdidos"
 SIA_armed_forces_modernization_shortcut: "Modernización de las fuerzas armadas"
 SIA_recover_from_97_crisis_shortcut: "Crisis de Tom Yum Kung"
 SIA_asean_centrality_shortcut: "ASEAN Centrality"
 SIA_the_southern_question_shortcut: "La cuestión del sur"
 SIA_kra_gateway_shortcut: "La puerta de Kra"
 SIA_recover_from_97_crisis: "Recuperación de la crisis de Tom Yum Kung"
 SIA_recover_from_97_crisis_desc: "En 1997 comenzó la crisis de Tom Yum Kung en Bangkok. Después de quemar sus reservas extranjeras defendiendo la baht, Tailandia se vio obligada a flotar la moneda y aceptar un acuerdo de reserva del FMI. El paquete mantuvo al país solvente, pero a costa de la supervisión intrusiva y la pérdida de dignidad económica. El paso final sigue siendo: terminar la recuperación, pagar al Fondo temprano y reclamar la plena soberanía."
 SIA_the_1997_constitution: "La Constitución Popular"
 SIA_the_1997_constitution_desc: "La Constitución de 1997 está redactada con una participación pública sin precedentes, promete un Senado electo, garantías de derechos humanos y fuertes órganos anticorrupción. Si sobrevive a la política tailandesa es otra pregunta."
 SIA_repay_the_imf: "Reembolso al FMI"
 SIA_repay_the_imf_desc: "Tailandia despejó el último centro de reserva en julio de 2003, dos años antes de lo previsto. Pagarlo temprano es menos sobre el director que la señal. Los mercados dejan de imponer la deuda tailandesa como un riesgo de rescate, y el Reino vuelve a pedir dinero barato."
 SIA_amazing_thailand: "Amazing Thailand"
 SIA_amazing_thailand_desc: "La campaña turística que nos llevó a través de los años de crisis se convierte en estrategia nacional. De Phuket a Chiang Mai, el mundo es invitado a la Tierra de Sonrisas, y el mundo paga en moneda dura."
 SIA_rice_and_rubber: "Rice Bowl de Asia"
 SIA_rice_and_rubber_desc: "Tailandia es el principal exportador mundial de arroz y una superpotencia de goma. Modernizar la economía agrícola de Isaan y el Sur y convertir los músculos agrícolas en ingresos de exportación."
 SIA_detroit_of_asia: "El Detroit de Asia"
 SIA_detroit_of_asia_desc: "Los fabricantes de automóviles japoneses y americanos han hecho del Seaboard Oriental su planta de fábrica regional. Doble en la industria automotriz y haga 'made in Thailand' un estándar global."
 SIA_suvarnabhumi_airport: "Suvarnabhumi Airport"
 SIA_suvarnabhumi_airport_desc: "Decenios en la planificación, el nuevo aeropuerto de Bangkok será el gran centro de aviación del sudeste asiático. Portales provinciales como Phuket alimentan el tráfico en él y levantan la aviación tailandesa en su conjunto, si podemos terminar de construirlo."
 SIA_eastern_economic_corridor: "El Seaboard del Este"
 SIA_eastern_economic_corridor_desc: "Profundice el corredor industrial de Chonburi a Rayong con puertos, refinerías, fábricas y ferrocarril. La sala de motores de la economía tailandesa."
 SIA_medical_hub: "Centro Médico de Asia"
 SIA_medical_hub_desc: "Hospitales de clase mundial a precios en desarrollo. El turismo médico trae a pacientes, y el prestigio, de todo el mundo."
 SIA_education_for_the_future: "Educar al Reino"
 SIA_education_for_the_future_desc: "Las aulas tailandesas todavía premian la memorización rota por resolver problemas, y la calidad de los maestros varía salvajemente entre Bangkok y las provincias. Un plan de estudios moderno, maestros mejor capacitados y pistas profesionales alineadas con las necesidades de la industria son la base de cualquier empuje hacia una economía de altos ingresos."
 SIA_asean_centrality: "ASEAN Centrality"
 SIA_asean_centrality_desc: "Bangkok fue donde se fundó la ASEAN en 1967. Reinvertir en el vecindario, porque un sudeste estable y amigable es la mejor garantía de seguridad de Tailandia."
 SIA_treaty_ally: "General de la OTAN"
 SIA_treaty_ally_desc: "La relación convencional más antigua de Estados Unidos en Asia. Deepen Cobra Gold, bienvenido hardware americano, y banco la garantía de seguridad mientras dura."
 SIA_bamboo_bends_east: "El Bamboo Bends East"
 SIA_bamboo_bends_east_desc: "La diplomacia tailandesa se dobla con el viento, y el viento sopla desde Beijing. Inversión china, ferrocarriles chinos, mercados chinos, todo ello a un precio que todavía se está negociando."
 SIA_the_2001_election: "The 2001 Election"
 SIA_the_2001_election_desc: "La primera elección de la Constitución Popular. La crisis ha roto el viejo consenso. Las nuevas fuerzas populistas, la red de poder tradicional y los demócratas ahora contiguan por la dirección de la nación."
 SIA_thai_rak_thai: "Thai Rak Thai"
 SIA_thai_rak_thai_desc: "Thais Love Thais. El deslizamiento de Thaksin Shinawatra redibuja el mapa electoral. El norte rural y el noreste ahora deciden quién gobierna, y han elegido su campeón."
 SIA_thaksinomics: "Thaksinomics"
 SIA_thaksinomics_desc: "Una economía doble. La primera vía prioriza las exportaciones mundiales y la segunda vía como base e iniciativa empresarial nacional. Este enfoque fortalece el crecimiento, pero los críticos dicen que aumenta la brecha de riqueza."
 SIA_30_baht_healthcare: "30-Baht Healthcare"
 SIA_30_baht_healthcare_desc: "Cualquier enfermedad, cualquier hospital, treinta baht. La cobertura universal transforma la vida para millones de tailandeses rurales, y consolida su lealtad al partido Shinawatra."
 SIA_village_fund: "El Fondo de Pueblos Millones"
 SIA_village_fund_desc: "Un millón de baht de microcrédito giratorio para cada pueblo y comunidad urbana en el Reino, uno de los programas de microfinanciación más grandes jamás intentado."
 SIA_otop: "Un producto de Tambon One"
 SIA_otop_desc: "Cada subdrito desarrolla, marca y exporta un producto local de firma. La industria del escenario se convierte en estrategia nacional."
 SIA_dual_track_economy: "La economía de doble tracción"
 SIA_dual_track_economy_desc: "Exporta, aumentan los ingresos rurales, reembolsan la deuda temprano. Cualquier cosa que los críticos digan sobre cómo se hizo, el marcador gira a favor del gobierno."
 SIA_war_on_drugs: "Guerra contra las drogas"
 SIA_war_on_drugs_desc: "Una campaña de tres meses para romper el comercio de metanfetaminas. Será popular. También atraerá un escrutinio grave de los derechos humanos que sigue al gobierno durante años."
 SIA_ceo_premier: "El CEO Premier"
 SIA_ceo_premier_desc: "Dirige el país como una compañía. KPIs para ministerios, reuniones móviles de gabinete en las provincias, impaciencia con la burocracia. Eficaz y corrosivo para cada institución diseñada para decir no."
 SIA_dominant_party_state: "Una Parte, una Tailandia"
 SIA_dominant_party_state_desc: "Absorbe a los socios de la coalición, domina las ondas aéreas, gana cada elección parcial. La política electoral continúa pero sólo una opción abrumadora."
 SIA_consolidate_democracy: "Consolidar la democracia"
 SIA_consolidate_democracy_desc: "Ganar el poder a través de las boletas, mantenerlo a través de los resultados y dejar a las instituciones en pie. La máquina populista se somete a la Constitución Popular."
 SIA_normalization_friction: "Fricción de normalización"
 SIA_normalization_friction_desc: "Las redes de patrocinio de la vieja máquina no se disuelven a tiempo. Se resisten a la desregistración incluso cuando el partido va derecho."
 SIA_thaksin_forever: "Thaksin para siempre"
 SIA_thaksin_forever_desc: "La oposición es irrelevante ya que se compran los tribunales y el Senado es leal. ¿Por qué debería terminar el proyecto? El partido dominante se convierte en el partido permanente."
 SIA_shinawatra_dynasty: "La dinastía Shinawatra"
 SIA_shinawatra_dynasty_desc: "El movimiento sobrevive a cualquier líder. La cara del partido puede cambiar a una hermana o a una hija, el verdadero poder todavía pertenece a Thaksin Shinawatra y su gente."
 SIA_the_old_order: "La monarquía de la red"
 SIA_the_old_order_desc: "Palacio, ejército, poder judicial, burocracia. Estas son las instituciones que han dirigido Tailandia a través de cada tormenta. No sobrevivieron siete décadas de agitación dejando que las elecciones decidan todo."
 SIA_privy_council: "El Consejo Privado"
 SIA_privy_council_desc: "Los concejales del Rey, generales retirados, jueces y estadistas, se sientan en el centro tranquilo de la web del establecimiento. Fortalecer los canales que eludin al gobierno elegido."
 SIA_sufficiency_economy: "La economía de suficiencia"
 SIA_sufficiency_economy_desc: "La filosofía de desarrollo real de moderación, resiliencia e inmunidad a los choques. Un contramodelo apuntado al crecimiento populista impulsado por la deuda."
 SIA_royal_guidance: "La Palabra del Rey"
 SIA_royal_guidance_desc: "Cada diciembre el Rey habla y la nación escucha. Una dirección de cumpleaños puede bendecir a un gobierno o retener silenciosamente su bendición, el poder del respeto que ninguna boleta o ministro se atreven a luchar. La voz del trono aleja al país de la locura política."
 SIA_three_pillars: "Nación, Religión, Rey"
 SIA_three_pillars_desc: "Chat, Sasana, Phra Maha Kasat, la bandera de tres colores hecha en el catecismo cívico. Monjes en las escuelas, el Rey en cada muro, la nación como un solo cuerpo moral. Es un pegamento poderoso, excepto donde las mezquitas están llenas y el catecismo se lee como puerta de cierre."
 SIA_yellow_shirts: "Los Rallies de la Alianza Popular"
 SIA_yellow_shirts_desc: "La Alianza Popular para la Democracia llena las calles de Bangkok en amarillo real, exigiendo el retiro del gobierno elegido. La clase media urbana ha elegido su lado."
 SIA_the_2006_coup: "El golpe de septiembre"
 SIA_the_2006_coup_desc: "Mientras el Primer Ministro está en el extranjero, los tanques entran en Bangkok. La constitución está suspendida, y el Consejo para la Reforma Democrática asume control. El ciclo comienza de nuevo."
 SIA_guardian_of_the_nation: "Tutor de la Nación"
 SIA_guardian_of_the_nation_desc: "La auto-imagen del ejército hizo doctrina. Por encima de la política, sin embargo tiene derecho a poner fin a cualquier política que amenaza a la nación. Institucionalizar el veto militar."
 SIA_judicial_activism: "La judicialización"
 SIA_judicial_activism_desc: "¿Por qué enviar tanques cuando un fallo judicial haga? Las disoluciones y descalificaciones del partido se convierten en el escalpelo de elección del establecimiento."
 SIA_the_2014_coup: "NCPO"
 SIA_the_2014_coup_desc: "Primera ley marcial, segundo golpe. El Consejo Nacional de Paz y Orden suspende indefinidamente la política, el ajuste de actitud para todo un país."
 SIA_lese_majeste_enforcement: "Defender la sagrada institución"
 SIA_lese_majeste_enforcement_desc: "El artículo 112 del Código Penal protege a la monarquía de los insultos. Ejecutarla sin moderación, y ver a cada movimiento de oposición pesar sus palabras."
 SIA_isoc_state: "El Estado ISOC"
 SIA_isoc_state_desc: "El Comando de Operaciones de Seguridad Interna, el brazo político del ejército en cada provincia, se convierte en un gobierno paralelo para los asuntos de 'seguridad', el Sur Profundo sobre todo."
 SIA_isoc_overreach_backlash: "Silencio público"
 SIA_isoc_overreach_backlash_desc: "El aparato de seguridad interna llega aún más a la vida cotidiana que el Sur Profundo. Los tailandeses ordinarios comienzan a notar, y no les gusta mucho."
 SIA_the_2017_constitution: "Una democracia guiada"
 SIA_the_2017_constitution_desc: "Un Senado totalmente nombrado, una cláusula de la MP no elegida, una estrategia nacional de veinte años que obliga a los futuros gobiernos. Las elecciones se reanudarán, dentro de una jaula."
 SIA_perpetual_guardianship: "Perpetua tutela"
 SIA_perpetual_guardianship_desc: "Formalizar lo que siempre fue implícito. Las fuerzas armadas se convierten en el árbitro constitucional permanente. Estabilidad, de un tipo, para siempre."
 SIA_royal_restoration: "Restauración del Trono"
 SIA_royal_restoration_desc: "Ir más allá de lo que cualquier gobierno se ha atrevido. Recoger los hilos de la red y colocarlos formalmente en las manos del palacio. La dinastía Chakri retoma la administración directa del reino."
 SIA_seeds_of_reform: "Semillas de reforma"
 SIA_seeds_of_reform_desc: "Fuera del viejo binario de populistas y realistas, una tercera fuerza se reúne. Joven, urbano, online y hecho con golpes."
 SIA_future_forward: "Un futuro hacia adelante"
 SIA_future_forward_desc: "Un nuevo partido de políticos de primera vez promete romper el ciclo. Desmilitarizar, descentralizar, democratizar. El establecimiento alcanza sus herramientas habituales y encuentra el objetivo en movimiento."
 SIA_three_demands: "Las Tres Demandas"
 SIA_three_demands_desc: "Parlamento disuelto. Deja de intimidar al pueblo y redacta una nueva constitución. Los estudiantes dicen en voz alta lo que no se puede decir, y el techo de la política tailandesa se mueve."
 SIA_demilitarize_politics: "Soldados fuera de la política"
 SIA_demilitarize_politics_desc: "Finan los abusos de la conscripción, cortan los imperios mediáticos y los escaños del consejo, y escriben al ejército fuera de la política. No nos lo agradecerán."
 SIA_civilian_control: "Supremacía civil"
 SIA_civilian_control_desc: "Un ministerio de defensa dirigido por civiles, promociones revisadas por el parlamento y un presupuesto militar que responde a los auditores. Radical sólo en Bangkok."
 SIA_amend_section_112: "Amend Section 112"
 SIA_amend_section_112_desc: "Reformar la ley lese-majeste. Limitar quién puede presentar quejas, ejecutar sentencias, poner fin a su uso contra el discurso político. Considerada la factura más peligrosa en Tailandia, puede que no haya manera de pasar y no haya vuelta atrás."
 SIA_decentralize: "Más allá de Bangkok"
 SIA_decentralize_desc: "Gobernadores elegidos para cada provincia y presupuestos que no pasan por la capital. Bangkok ha sido todo el país durante demasiado tiempo."
 SIA_break_the_monopolies: "Romper los Monopolios"
 SIA_break_the_monopolies_desc: "Liquor duopolies, concesiones de telecomunicaciones, cruces de conglomerados. Pry abre los puntos de atraque de la economía tailandesa y deja entrar una competencia justa."
 SIA_welfare_state: "Un estado de bienestar tailandés"
 SIA_welfare_state_desc: "De un parche de subsidios a una red de seguridad real de pensiones, guardería y seguro de desempleo. Expensivo, y ningún gobierno después de esto se atreverá a relajarlo."
 SIA_marriage_equality: "Primero en el sudeste asiático"
 SIA_marriage_equality_desc: "La igualdad de matrimonio se convierte en ley, la primera en el sudeste asiático. Una reforma que todo el mundo nota, y la rara que el establecimiento no lucha."
 SIA_deep_south_peace: "La paz en el sur profundo"
 SIA_deep_south_peace_desc: "Autonomía dentro del Reino, justicia por abusos pasados, identidad Patani-Malay respetada. La insurgencia termina en una mesa de negociaciones, no en un puesto de control."
 SIA_consolidated_democracy: "La democracia consolidada"
 SIA_consolidated_democracy_desc: "Constitución escrita por ciudadanos, soldados en barracas, tribunales que juzgan y no gobiernan. El ciclo de golpes se rompe y se hace impensable por fin."
 SIA_reform_transition_costs: "Base Tributaria en Transición"
 SIA_reform_transition_costs_desc: "La revisión de las instituciones significa revisar cómo se financian. Recaudación de ingresos se encuentra detrás del nuevo sistema mientras que sube."
 SIA_a_new_republic: "Una nueva República"
 SIA_a_new_republic_desc: "La pregunta que nunca se permitió hacer es someterse a votación. Sea cual sea el resultado, la Tailandia que emerge será irreconocible, si se mantiene unida en absoluto."
 SIA_lost_territories: "Los Territorios Perdidos"
 SIA_lost_territories_desc: "1893. 1904. 1907. 1909. Cada estudiante tailandés aprende las fechas que Siam fue tallada por Francia y Gran Bretaña. La generación de Phibun marchó para llevarlas una vez. Los mapas todavía están en los archivos."
 SIA_pan_thai_movement: "Una carrera de Tai"
 SIA_pan_thai_movement_desc: "Revive la gran tesis de Wichit Wathakan. Thai, Lao, Shan, one Tai people, sundered by colonial borders, awaiting meeton under the Thai flag."
 SIA_rearmament: "Rearme el Reino"
 SIA_rearmament_desc: "La ambición requiere acero. Elevar el presupuesto de defensa más allá de todo lo que los auditores han visto y poner la industria del Reino en un pie de guerra."
 SIA_modernize_the_rta: "Modernizar el Ejército Real de Tailandia"
 SIA_modernize_the_rta_desc: "Nuevos tanques de batalla principales, nuevos IFVs, soldados profesionales en lugar de conscriptos de lotería. El Ejército Real de Tailandia se prepara para guerras más allá del deber de golpe."
 SIA_blue_water_navy: "A Armada de dos oceanos"
 SIA_blue_water_navy_desc: "El portaaviones Chakri Naruebet finalmente consigue un ala de aire real y escoltas reales, y el programa submarino deja de ser un hitline. Dos costas, dos flotas."
 SIA_gripen_squadrons_rearm: "La paz Suvarnabhumi"
 SIA_gripen_squadrons_rearm_desc: "Gripens, aviones AEW, defensa aérea relacionada con datos. Una pequeña fuerza aérea construida para ganar la primera semana de una guerra regional."
 SIA_dti_self_reliance: "DTI Self-Reliance"
 SIA_dti_self_reliance_desc: "El Instituto de Tecnología de Defensa se graduó de documentos de investigación a líneas de producción. Los fusiles tailandeses, la armadura tailandesa, los cohetes tailandeses y ningún embargo pueden detener lo que construimos nosotros mismos."
 SIA_thai_yai: "Nuestros hermanos Tai Yai"
 SIA_thai_yai_desc: "El Shan de Birmania habla una lengua que cualquier tailandés puede seguir. Sus milicias han luchado contra Rangoon por generaciones. Sólo les falta un patrón, y una bandera para luchar bajo."
 SIA_mekong_destiny: "Destino en el Mekong"
 SIA_mekong_destiny_desc: "Sainyabuli y Champasak eran Siamese dentro de la memoria viva, y los Lao son los parientes más cercanos de Tailandia. El río que nos divide podría atravesar un país."
 SIA_preah_vihear: "El Templo es nuestro"
 SIA_preah_vihear_desc: "El fallo de la CIJ de 1962 sobre Preah Vihear aún se quema. Battambang y Siem Reap volaron la bandera tailandesa en memoria viva. Las disputas fronterizas con Phnom Penh dejan de ser gestionadas, y comienzan a ser utilizadas."
 SIA_lost_sultanates: "El Tratado de 1909 está vacío"
 SIA_lost_sultanates_desc: "Kelantan, Terengganu, Kedah, Perlis. Tributarios de Bangkok firmaron al Imperio Británico sin un solo habitante consultado. Denunciar el Tratado Anglo-Siamese."
 SIA_suwannaphum: "Suwannaphum unido"
 SIA_suwannaphum_desc: "Suwannaphum, la Tierra Dorada de la Antigüedad, entera otra vez bajo la bandera tailandesa. Iniciar la integración de los territorios recuperados en el Reino."
 SIA_victory_monument: "El nuevo monumento de la victoria"
 SIA_victory_monument_desc: "El obelisco en Ratchawithi Road honra a los muertos de 1940-41, la última guerra por los territorios perdidos. Construir su sucesor, y dejar que la región sacar sus propias conclusiones."
 SIA_thailand_4_0: "Thailand 4.0"
 SIA_thailand_4_0_desc: "Valor añadido de todo. Robotics, biotecnología, servicios digitales. La cuarta revolución industrial, planificada desde la Casa de Gobierno y probada en el Corredor Económico Oriental. Cada provincia recibe el dividendo de productividad de la puesta en marcha de la estrategia nacional."
 SIA_three_airport_rail: "El Enlace de Rail Tres-Airport"
 SIA_three_airport_rail_desc: "Don Mueang, Suvarnabhumi, U-Tapao, todo ligado por una línea de alta velocidad que lleva un fin de hora. Este es el ferrocarril más caro de la historia tailandesa y la columna vertebral del EEC."
 SIA_u_tapao_aerotropolis: "U-Tapao Aerotropolis"
 SIA_u_tapao_aerotropolis_desc: "Un aeródromo marino de la era de la guerra de Vietnam se convierte en un portal de 60 millones de pasajeros con hangares de mantenimiento, una zona libre de comercio y una ciudad próspera construida alrededor de la existencia de la pista."
 SIA_eastern_aviation_city: "Ciudad de aviación oriental"
 SIA_eastern_aviation_city_desc: "La pista fue sólo el comienzo. Airbus y Thai Airways hunden un complejo de mantenimiento y sobrecarga en la zona de libre comercio, una academia de aviación entrena a los mecánicos, y las terminales de carga convierten U-Tapao en el taller aeroespacial de la región tanto como su puerta de entrada. Trabajo de alto valor, y un exigente para alimentarse."
 SIA_eec_take_off: "El Corredor se lleva a cabo"
 SIA_eec_take_off_desc: "Plantas EV en Rayong, biotecnología en Chonburi, avionics en Chachoengsao. El Corredor Económico Oriental deja de ser un plan y comienza a ser una región."
 SIA_hedge_the_bets: "Guardar las apuestas"
 SIA_hedge_the_bets_desc: "El bambú se dobla con el viento y retrocede. Lo que sea que Washington o Beijing creen que Tailandia ha prometido, Tailandia no ha prometido nada que no pueda reinterpretar."
 SIA_armed_forces_modernization: "Fuerzas armadas tailandesas reales"
 SIA_armed_forces_modernization_desc: "Ejército, Armada y Fuerza Aérea bajo una corona, espada y escudo del Reino. En 1997 se suspendieron las adquisiciones a mitad de período, dejando escuadrones medio entregados y un porteador sin aeronaves. Lleve a las fuerzas armadas en la mano y ponga el rumbo que seguirán las próximas décadas."
 SIA_gripen_deal: "El trato de Gripen"
 SIA_gripen_deal_desc: "Saab ofrece lo que Washington no quiere. Una transferencia de tecnología completa, offsets industriales, un avión de alerta temprana Erieye están todos incluidos en el paquete, además de ninguna conferencia sobre golpes."
 SIA_gripen_ef_program: "Gripen E/F"
 SIA_gripen_ef_program_desc: "El F-35 fue rechazado y los F-16 son mayores que sus pilotos. El Gripen E/F de próxima generación mantiene al ecosistema que las tripulaciones tailandesas ya saben, y mantiene la línea de producción de Suecia caliente."
 SIA_eyes_in_the_sky: "Ojos en el cielo"
 SIA_eyes_in_the_sky_desc: "Los sistemas no tripulados israelíes, el Buscador, Hermes y Dominator, dan a los comandantes tailandeses lo que las selvas y fronteras siempre les han negado. Vista persistente."
 SIA_chinese_steel: "Acero chino"
 SIA_chinese_steel_desc: "El VT-4 de NORINCO cuesta medio tanque occidental y llega sin sermones de usuario final. Los M60 estadounidenses del ejército envejecen, y sus proveedores crecen al este."
 SIA_s26t_program: "The S26T Submarine"
 SIA_s26t_program_desc: "Se prometieron tres barcos de clase Yuan. Uno podría llegar. Entre los motores alemanes que no se pueden exportar y presupuestos que no pueden ser defendidos, el sueño submarino de la marina prueba la paciencia de todos."
 SIA_chakri_modernization: "Un reajuste occidental para el buque insignia"
 SIA_chakri_modernization_desc: "La carretera occidental continúa a bordo del buque insignia. El HTMS Chakri Naruebet, construido en español y largo muelle de Sattahip, toma sistemas de combate americanos y europeos y sensores. Un ajuste estándar de la OTAN que finalmente le da al portador del reino un trabajo digno de su tripulación."
 SIA_uxv_carrier_conversion: "Un ala oeste de Drone"
 SIA_uxv_carrier_conversion_desc: "Los Harriers son piezas de museo, pero el salto de esquí permanece. Con sistemas occidentales no tripulados comprados de primos aliados, convierte el buque insignia para lanzar aviones drones, artesanía superficial y sumergibles. El primer portaequipajes UXV en el sudeste asiático, hardware de socios voladores."
 SIA_telecom_empire: "La Concesión de Telecom"
 SIA_telecom_empire_desc: "Satélites, redes móviles, un imperio mediático, todo floreciente notablemente bajo un gobierno de magnates de telecomunicaciones. La línea entre el campeón nacional y el negocio familiar nunca ha sido más delgada."
 SIA_prayuth_premiership: "La Estreno del General"
 SIA_prayuth_premiership_desc: "El líder golpista intercambia su uniforme por un traje y su título de junta para uno elegido. Los 250 senadores designados que votan por el primer ministro hacen la aritmética cómoda."
 SIA_senate_of_appointees: "Un Senado de Nombrados"
 SIA_senate_of_appointees_desc: "Doscientos cincuenta senadores, cada uno elegido por el consejo militar, cada uno con voto sobre quién gobierna. La oposición puede ganar elecciones. El poder ganador es otro asunto."
 SIA_2020_protest_response: "La juventud en las calles"
 SIA_2020_protest_response_desc: "Los estudiantes inundan los monumentos con tres demandas y un saludo de tres niveles. Cada opción, ya sea dispersión, diálogo o retraso, enseña a la próxima generación algo sobre el estado."
 SIA_orange_wave: "La ola naranja"
 SIA_orange_wave_desc: "Una nueva generación política se organiza en línea, se financia en pequeñas donaciones y trata a las viejas redes de mecenazgo como un problema que hay que eliminar en lugar de heredar."
 SIA_digital_democracy: "Democracia digital"
 SIA_digital_democracy_desc: "Datos abiertos, servicios en línea, un estado que responde al email. La transparencia como infraestructura, e infraestructura, a diferencia de las promesas, es difícil de derogar."
 SIA_creative_economy: "La economía creativa"
 SIA_creative_economy_desc: "Cine, comida, festivales, diseño. El poder blando tailandés se convierte en un sector exportador con la atención de un ministerio y una línea de balance propio."
 SIA_truth_and_reconciliation: "Verdad y Reconciliación"
 SIA_truth_and_reconciliation_desc: "La guerra de las drogas está muerta, las crisis, la desaparición del Sur Profundo. Una comisión con poder de citación escribe la cuenta oficial, porque una democracia mantiene sus propios registros."
 SIA_the_2005_landslide: "The 377-Seat Sweep"
 SIA_the_2005_landslide_desc: "Thai Rak Thai gana 377 de 500 escaños parlamentarios, la mayor mayoría de partido único en la historia tailandesa. La red del antiguo establecimiento vigila el recuento de votos en silencio."
 SIA_rice_pledging_scheme: "El Plan de Promesas de Arroz"
 SIA_rice_pledging_scheme_desc: "El programa rural insignia del gobierno de Yingluck tiene el arroz estatal de los agricultores a precios de mercado y mantiene la reserva. Las aldeas se benefician. El tesoro depende de la cooperación del precio mundial."
 SIA_red_shirts_mobilized: "Las calles detrás del Ballot"
 SIA_red_shirts_mobilized_desc: "Pon la base rural en las calles. Red-shirt redes a través de la marcha del noreste en sus cientos de miles, pero una multitud populista llenando la capital no vaca los generales. Alardea el palacio y el alto mando y les da su pretexto. La confrontación que termina con tanques en la Casa del Gobierno se acerca más. §R Aumenta el riesgo de crecimiento.§!"
 SIA_heartland_development: "Desarrolla el Corazón Rojo"
 SIA_heartland_development_desc: "Las aldeas de Isaan y el Norte entregaron el deslizamiento, y ahora se pagan en política. Nuevas carreteras y ferrocarril alcanzan la meseta de Khorat y los valles de Chiang Mai, y las oficinas provinciales ponen administración, y puestos de trabajo, donde la base del movimiento realmente vive, no en la capital que nunca votó por ella."
 SIA_crown_property_bureau: "La oficina de la propiedad corona"
 SIA_crown_property_bureau_desc: "La Oficina administra miles de millones en activos reales, desde hoteles a bienes raíces hasta grandes estacas industriales. Para poner esos regresos a trabajar para el desarrollo nacional se requiere una negociación tranquila al más alto nivel."
 SIA_eastern_tigers: "Los Tigres Orientales"
 SIA_eastern_tigers_desc: "La 2.ª Región del Ejército y el cuerpo blindado, el Burapha Phayak, Tigres del Este. Su lealtad es la nueva del estado realista, y sus comandantes son la próxima generación de generales."
 SIA_buddhist_nationalism: "Nación budista"
 SIA_buddhist_nationalism_desc: "La junta abraza a los monjes como socios en el orden social. Robas de Safrón en ceremonias estatales, budismo en el currículo escolar, y una elevación tranquila de la Sangha como autoridad moral. El Sur Profundo no lo recibe en silencio."
 SIA_royal_succession_managed: "La transición de la reignación"
 SIA_royal_succession_managed_desc: "El palacio y el gobierno preparan los años de transición con anticipación, una entrega institucional en lugar de un choque. Cuando el Noveno Reino termina, el barami pasa intacto en lugar de colapsar a su forma más débil, el período de luto se comprimió, y el establecimiento monárquico rugía detrás del nuevo trono. Una transición gestionada cuesta menos que la alternativa."
 SIA_conscription_abolished: "Un ejército profesional"
 SIA_conscription_abolished_desc: "Fin del servicio militar obligatorio. Una fuerza voluntaria será más pequeña, mejor remunerada y mejor formada, y le debe su lealtad a la Constitución, no a los generales que los redactaron."
 SIA_open_skies_open_borders: "Cielos abiertos, Fronteras abiertas"
 SIA_open_skies_open_borders_desc: "Liberalizar los derechos de aterrizaje, simplificar las reglas de visado y dejar que las aerolíneas compitan. Los turistas que vienen traen dinero, y los trabajadores que vienen traen habilidades. La frontera es el mayor activo de Tailandia, así que deja de tratarlo como una fortaleza."
 SIA_chao_phraya_megaprojects: "Chao Phraya Flood-Control y Green Power"
 SIA_chao_phraya_megaprojects_desc: "El río que dos veces inundaba la capital se domará con depósitos de retención, barreras de inundación y una cadena de turbinas de rebote. El proyecto es caro. El próximo gran diluvio no lo es."
 SIA_asean_customs_window: "ASEAN Ventana Única Aduanas"
 SIA_asean_customs_window_desc: "Armonizar declaraciones aduaneras, certificados de seguridad y reglas fitosanitarias en todos los miembros de la Asociación. Un camión de Chiang Rai a Kuala Lumpur para en menos ventanas de las que solía."
 SIA_the_southern_question: "La cuestión del sur"
 SIA_the_southern_question_desc: "Pattani, Yala y Narathiwat se han sumergido con insurgencia para una generación. Las quemaduras de mezquita, decapitaciones y bombas de carretera han matado a miles y endurecido un sur malayo-musulmán contra un Bangkok budista. El Reino ya no puede tratar al Sur profundo como una nota de pie de página policial. Debe elegir cómo responderá al fuego en el sur. La forma de esa respuesta será decidida por quien gobierna en Bangkok."
 SIA_kra_gateway: "La puerta de Kra"
 SIA_kra_gateway_desc: "El sueño del siglo vuelve a la mesa de gabinete, pero esta vez con un balance. Se levanta una comisión de viabilidad, se envían a los topógrafos al istmo y la primera ranura compartida del edificio es limpiada en Songkhla. Nada se ha comprometido todavía. La siguiente decisión es quién, si alguien, pagará por ello."
 SIA_kra_patron_china: "Franja y la Ruta Financiación"
 SIA_kra_patron_china_desc: "La oferta de Beijing es la más barata en la mesa por lejos, con financiación BRI completa, equipos de ingeniería chinos, y un canal llave en mano en tiempo récord. Los términos son generosos ahora y oneroso más tarde. La deuda se denomina en yuan, el colateral es el canal mismo, y el día puede venir cuando Beijing llama al préstamo."
 SIA_kra_patron_japan: "Infraestructura de calidad japonesa"
 SIA_kra_patron_japan_desc: "JICA y el consorcio japonés megabanco construyen lentamente, costoso e impecablemente. Ninguna trampa de la deuda, ninguna cláusula de arrendamiento oculto, sólo una factura superior y un socio que espera ser retribuido en buena voluntad tanto como baht. El respeto de Tokio por Bangkok aumenta en consecuencia."
 SIA_kra_patron_consortium: "Consorcio Internacional"
 SIA_kra_patron_consortium_desc: "Un consorcio multilateral liderado por ADB extiende el costo y el riesgo a través de muchas manos, e insiste en la secuencia pragmática que los ingenieros siempre prefirieron. Un puente terrestre escalonado primero, el corte de nivel completo segundo. Ningún único acreedor posee el punto de encuentro, y Washington, Tokio y Manila respiran más fácil para ello."
 SIA_kra_patron_solo: "Velo solo"
 SIA_kra_patron_solo_desc: "Ningún acreedor extranjero, ninguna cláusula extranjera, ninguna bandera extranjera en las cerraduras. El Reino financia el canal de su propio tesorería y su propio mercado de bonos, y acepta el costo asombroso como el precio de la soberanía absoluta sobre la nueva vía aérea estratégica del mundo."
 SIA_kra_debt_trap_warning_tt: "Franja y la Ruta La financiación es barata ahora, pero la construcción se sobrepone a abrir la cadena §RBeijing llama al Loan§! por defecto-crisis."
 SIA_two_oceans_one_kingdom: "Dos océanos, un Reino"
 SIA_two_oceans_one_kingdom_desc: "El último cofferdam ha sido eliminado. El agua salada del Mar Andamán y el Golfo de Tailandia se mezclan por primera vez a nivel de la cumbre. Tailandia ya no ocupa una costa. Comanda dos."
 SIA_kra_militarize: "Una fortaleza en dos mares"
 SIA_kra_militarize_desc: "El canal es demasiado valioso para dejar sin defensa. Las baterías costeras, una base naval endurecida y un mandato permanente de control de tránsito convierten la vía fluvial en una fortaleza que la Marina Real tailandesa puede mantener contra cualquier. El mundo nota las armas, y los contribuyentes de peaje grumblen a la militarización."
 SIA_kra_internationalize: "A Canal para todas las Naciones"
 SIA_kra_internationalize_desc: "Declarar al Kra un régimen de tránsito internacional neutral, abierto a todas las banderas en igualdad de condiciones y garantizado por el tratado. Tailandia renuncia al poder para cerrar el canal. A cambio atrae el tráfico, la inversión y la tranquila gratitud de todo poder marítimo que temía un punto de encuentro en el dominio de una nación."
 SIA_gateway_of_asia: "Puerta de entrada de Asia"
 SIA_gateway_of_asia_desc: "Los barcos solían pasar Tailandia. Ahora se detienen aquí. Completar la transformación con inversión internacional, un puerto más profundo en el sur, y, si se escogió la ruta del canal, el mandato de patrulla que hace que el puntaje sea seguro para todos los que paguen el peaje."
 SIA_ghosts_of_the_jungle: "Fantasmas de la selva"
 SIA_ghosts_of_the_jungle_desc: "En lo profundo de las colinas de Isaan y las tierras altas del norte, los cuadros del Partido Comunista de Tailandia nunca desaparecieron verdaderamente. Enseñaban en escuelas de aldea, organizadas en sindicatos sindicales, recordaban. Ahora, como el país se fractura, a medida que la estabilidad se convierte en memoria y el gobierno sólo habla por sí mismo, su mensaje encuentra una nueva generación lista para escucharla."
 SIA_isaan_soviets: "Isaan Soviets"
 SIA_isaan_soviets_desc: "El Nordeste es el corazón, la región más pobre, la más políticamente restante, la que el establecimiento de Bangkok siempre ha tratado como un embalse de mano de obra barata y votos baratos. Los comités de aldea, las salas sindicales y los consejos cooperativos se convierten en el esqueleto organizativo de un movimiento. El partido no pide lealtad. Pide a la gente que gobierne, y cuide lo que pasa."
 SIA_general_strike: "El ataque general"
 SIA_general_strike_desc: "Si el movimiento va a ser más que una nota de pie de página rural, debe poner fin a las ciudades. Dockworkers, manos de fábrica, conductores de autobús, maestros, todos llamados a la vez. La apuesta es total. Si el gobierno no puede funcionar lo suficiente, se capitulará o escalará. No hay un camino intermedio."
 SIA_general_strike_tt: "Llama una huelga general y abre las decisiones de §YStrike General§! durante 180 días.\n - Conducir el impulso de la huelga a §Y100§! y el gobierno capitula, abriendo el camino pacífico al poder\n - La parada cuesta §R1%§! estabilidad cada semana que funciona\n - Si los 180 días terminan cortos de 100, los generales aplastan la huelga y se apoderan del poder en un golpe"
 SIA_people_seize_power: "La gente toma el poder"
 SIA_people_seize_power_desc: "El viejo gobierno está acabado. Si cayó en una sala de negociaciones o antes de una barricada, el resultado es el mismo. El Partido Comunista de Tailandia toma la autoridad rectora. Una nueva bandera todavía no vuela, pero el aparato administrativo está ahora en manos de personas que pasaron décadas en la selva pensando en cómo utilizarla."
 SIA_land_to_the_tiller: "Tierra a la Tiller"
 SIA_land_to_the_tiller_desc: "Las grandes fincas de las llanuras centrales, la tierra refinada de Isaan, las plantaciones de caucho del sur. El sistema que los produjo está terminado. La redistribución de la tierra, la redistribución real, no un esquema gubernamental que termina cuando llega el próximo gobierno, es tanto la promesa del movimiento como su acto más peligroso. Las familias que poseían esas fincas no todos irán en silencio."
 SIA_five_year_plan: "El Plan de Cinco Años"
 SIA_five_year_plan_desc: "El mercado se asignó mal. El estado asignará deliberadamente. Factorías, acero, químicos, herramientas de máquina, todas planificadas desde el centro, construidas con el trabajo de una nación movilizada. El déficit comercial se convierte en un superávit estructural del capital físico. El precio, visible en las estadísticas de bienes de consumo del primer año, es el aislamiento."
 SIA_red_chakri_dilemma: "El dilema de Chakri"
 SIA_red_chakri_dilemma_desc: "Una pregunta es que el liderazgo del partido aplazado en la medida de lo posible ya no puede aplazarse. ¿Cuál es la posición constitucional de la monarquía en un Tailandia comunista? La historia ofrece dos precedentes. Ninguno de ellos está cómodo."
 SIA_positive_trade_relations: "Relaciones comerciales positivas"
 SIA_nuclear_proliferation_concern: "Enriquecimiento de uranio tailandés"
 SIA_nuclear_proliferation_tt: "§RCada país fuera de nuestras alianzas tiene una visión duradera de un programa de enriquecimiento tailandés.§!"
 SIA_tt_has_reclaimed: "Mantenemos territorio reclamado que aún no está integrado"
 SIA_tt_has_unpacified_reclaimed: "territorio reclamado aún por debajo §Y90%§! cumplimiento"
 SIA_tt_has_corable_reclaimed: "Reclamado territorio a o más de §Y80%§! cumplimiento"
 SIA_bamboo_curtain: "La cortina de bambú"
 SIA_bamboo_curtain_desc: "La revolución de Tailandia no puede sobrevivir como un experimento aislado. Vietnam y Laos son vecinos, compañeros de viaje y potenciales socios. Un marco de solidaridad regional se basa en el reconocimiento mutuo y la resistencia coordinada a la presión económica occidental, es la arquitectura de un estado revolucionario sostenible en Asia sudoriental."
 SIA_protracted_peoples_war: "Guerra popular prolongada"
 SIA_protracted_peoples_war_desc: "El partido de los setenta no ganó en las ciudades. Aprendió su comercio en las colinas, donde el escrito de Bangkok corría delgado y un rifle contaba por más que un manifiesto. Construir áreas de base en las tierras altas y dejar que el campo rodea la ciudad. Más lento que una huelga general, y mucho más difícil de revertir."
 SIA_peoples_tribunals: "Los Tribunales Populares"
 SIA_peoples_tribunals_desc: "Una revolución que no puede defenderse dura una temporada. Los informantes, los financieros y los coroneles que esperaban para ver de qué manera el viento soplaba todavía están en su lugar. Los tribunales revolucionarios, sumarios y públicos, resuelven la cuestión de la lealtad antes de que pueda hacerse del partido."
 SIA_broad_united_front: "El Frente Unido Ampliado"
 SIA_broad_united_front_desc: "Una revolución que gobierna por miedo rige cada año un país más pequeño. El camino más difícil es el consentimiento. Traigan a las ligas campesinas, los sindicatos, los intelectuales de la reforma, los pequeños comerciantes y los monjes del pueblo bajo una sola carpa, y que sientan que construyeron el nuevo estado en lugar de sobrevivirlo. El poder es compartido en papel y vigilado en la práctica, pero un movimiento que puede gobernar por acuerdo no necesita gobernar por el arma."
 SIA_peoples_army: "El Ejército Popular"
 SIA_peoples_army_desc: "El plan ha construido las fábricas. Ahora forja el escudo. Un estado revolucionario en una región hostil necesita un ejército grande, leal y propio, conscriptos entrenados en la imagen del partido, equipado de arsenales tailandeses en lugar de buena voluntad extranjera. Cada cuerpo capaz que puede llevar un rifle es un soldado ciudadano, y cada taller que puede girar un barril es un enlace en la cadena de suministro. Los vecinos pensarán dos veces."
 SIA_socialist_education: "Cada uno, enseña uno"
 SIA_socialist_education_desc: "El plan ha construido las fábricas. Ahora construye a la gente que los dirigirá. Una campaña de alfabetización masiva llega a la última aldea de Isaan, y las escuelas de cuadros convierten a los campesinos en ingenieros y empleados en administradores que responden al mérito más que a quienes nacieron. Un alfabeto, la población organizada es más difícil de engañar y más barato para gobernar, y la podredumbre del patrocinio que huyó el viejo reino no encuentra a ninguna parte para echar raíces."
 SIA_the_beijing_road: "La carretera de Beijing"
 SIA_the_beijing_road_desc: "Survival tiene un patrocinador, y se sienta en Zhongnanhai. Aceptar plenamente el abrazo de Beijing. Capital chino para terminar el plan industrial, mercados chinos para reemplazar a los que Occidente cerró, y una sombra de gran poder ningún vecino desafiará. El precio está escrito en letra fina. La voz de China en consejos tailandeses crece más fuerte de lo que cualquier tailandés hubiera permitido. Un socio junior sigue siendo un compañero, y una nación alimentada sobrevive a uno orgulloso."
 SIA_indochina_federation: "La federación indochiesa"
 SIA_indochina_federation_desc: "O rechazar el papel del cliente y reclamar el papel de líder. Laos, Vietnam y Camboya son tres revoluciones que se ensanchan por la misma idea, ninguna con la industria de Tailandia o su posición central. Una federación de los tres ríos, con Bangkok como su socio superior en lugar del junior de Beijing, hace que el sudeste asiático sea algo con lo que los grandes poderes deben negociar en lugar de tallar. Es el más duro jactarse, y el más orgulloso."
 SIA_kingmaker_coalition: "La coalición Kingmaker"
 SIA_kingmaker_coalition_desc: "El partido Bhumjaithai de Anutin Charnvirakul mantiene el equilibrio del poder en el Parlamento 2019. Formando una coalición con ellos cuesta ministerios y concesiones políticas, pero también compra una mayoría de gobierno y acceso a la base rural noreste del partido."
 SIA_cannabis_decriminalized: "Cannabis Decriminalization"
 SIA_cannabis_decriminalized_desc: "La política 2022 de Bhumjaithai elimina el cannabis de la lista de narcóticos. Agricultores en Buriram y a través de Isaan pivote a un nuevo cultivo de efectivo. Los recibos de tesorería suben. Las voces conservadoras advierten de un peligro moral. Ambos tienen razón."
 SIA_million_rai_farms: "Un millón de Rai de granjas modernas"
 SIA_million_rai_farms_desc: "La plataforma de desarrollo rural de Bhumjaithai ofrece riego de precisión, certificación de contrato y subsidios de replantación de caucho en todo el sur. El Nordeste consigue las nuevas industrias, y el Sur obtiene la expansión de plantación. Las exportaciones agrícolas de Tailandia crecen."
 SIA_defence_industry_act: "Ley de la industria de defensa"
 SIA_defence_industry_act_desc: "Un marco jurídico para la producción de defensa nacional, con preferencia a las adquisiciones de sistemas manufacturados localmente, un mandato de transferencia de tecnología en todos los contratos extranjeros y una secretaría de defensa industrial dentro del Ministerio. La primera fábrica de armas que resulte modesta. La fundación institucional no será."
 SIA_dti_expansion: "DTI Expansión"
 SIA_dti_expansion_desc: "The Defence Technology Institute receives a capital injection and a mandate to deliver rockets, loitering munitions, and upgraded armored vehicle prototipos. La instalación de Isaan va desde una oficina de dibujo a una línea de producción, y una nueva línea de armas viene en línea junto con ella. Los bonos de investigación siguen el hardware."
 SIA_chaiseri_and_friends: "Chaiseri y Amigos"
 SIA_chaiseri_and_friends_desc: "El primer MRAP ganador de Chaiseri Metal y Rubber ya se ha vendido a Indonesia y Filipinas. Con la Ley de Industrias de Defensa, se expande un grupo de proveedores privados de defensa, entre ellos Chaiseri, Thonburi Automotive y Thai Optical. Lo que comienza a medida que la contratación nacional se convierte en un libro mayor de exportación, y los propios niveles de cadena de producción de Chaiseri sobre el producto."
 SIA_arms_exporter: "Arsenal de la ASEAN"
 SIA_arms_exporter_desc: "Tailandia ha construido la base de producción, el marco legal y las relaciones de exportación para convertirse en el proveedor preferido de armas de segundo nivel de la región. No tanques y combatientes, sino MRAPs, fusibles de artillería, drones y municiones. Fiable, asequible, entregado a tiempo. El contrato de exportación repetible se convierte en una fijación del tesoro."
 SIA_regional_defense_pact: "Pacto regional de defensa"
 SIA_regional_defense_pact_desc: "El libro mayor de exportación se ha convertido en un instrumento diplomático. Bangkok formaliza acuerdos permanentes de defensa con sus asociados de la ASEAN, incluidos canales garantizados de adquisición, programas conjuntos de mantenimiento y un marco consultivo permanente para la seguridad regional. Las fábricas funcionan más calientes, los agregados llegan a casa con acuerdos firmados, y la influencia de Tailandia en el sudeste asiático se mide en asignaciones de municiones y contratos de piezas de repuesto."
 SIA_stream_of_the_navy: "Corriente de la Marina"
 SIA_stream_of_the_navy_desc: "El Royal Thai Marine Corps recibe inversión doctrinal en asalto anfibio y defensa costera. Una expansión de muelles en el Sur apoya al nuevo escuadrón anfibio. Los marines tailandeseses se entrenan junto a sus homólogos indonesios y filipinos en ejercicios que ya no son puramente ceremoniales."
 SIA_cavalry_of_the_sky: "Caballería del cielo"
 SIA_cavalry_of_the_sky_desc: "El cuerpo de aviación del Ejército tiene prioridad. Nuevos helicópteros utilitarios para infantería aérea, variantes de ataque para apoyar operaciones terrestres en las colinas, y una doctrina por vía aérea que reconoce el terreno de Tailandia es más selva que la estepa."
 SIA_cyber_command: "Comando cibernético"
 SIA_cyber_command_desc: "Un comando dedicado de operaciones cibernéticas, modelado en los marcos del CYBERCOM y la Unidad 8200 israelí. Defensa de la red, señales de inteligencia y, en un silencioso anexo de la propuesta de financiación, desarrollo de capacidades ofensivas. Si la infraestructura de vigilancia de ISOC ya existe, el comando lo hereda y extiende su alcance a la dimensión digital."
 SIA_us_coin_legacy: "EE.UU. Un legado de COIN"
 SIA_us_coin_legacy_desc: "El ejército tailandés absorbió lecciones duras de la doctrina americana contra la insurgencia en las décadas posteriores a la guerra de Vietnam, con programas de defensa de aldea, PSYOP y fusión de inteligencia con ISOC. Ese marco sigue formando cómo Tailandia lucha contra sus enemigos internos. La sistematización produce resultados."
 SIA_development_is_security: "Desarrollo Is Security"
 SIA_development_is_security_desc: "Carreteras, escuelas y clínicas en el norte y noreste son la contrainsurgencia más barata disponible. La infraestructura que llega a un pueblo antes de que el agitador tiende a quedarse. Nuevos terminales ferroviarios en Isaan y el Norte aceleran cada proyecto que sigue."
 SIA_post_cold_war_professionalization: "Profesionalización de la guerra post-Cold"
 SIA_post_cold_war_professionalization_desc: "La Guerra Fría formó el cuerpo oficial de Tailandia hacia operaciones anticomunistas, lealtad al orden interno y deferencia al palacio. Una nueva generación de oficiales, formados en ejercicios conjuntos con asociados occidentales y escolarizados en el derecho internacional, está redefiniendo lo que son las Fuerzas Armadas Reales de Tailandia."
 SIA_multi_domain_operations: "Operaciones multidominio"
 SIA_multi_domain_operations_desc: "El campo de batalla ya no es una línea en un mapa. La guerra cibernética, electrónica, imágenes basadas en el espacio y ataques de drones de precisión se fusionan con la maniobra convencional. El concepto de MDO de Tailandia, desarrollado conjuntamente con socios estadounidenses y australianos, reconoce que la próxima guerra se combatirá en todos los dominios simultáneamente."
 SIA_mdo_integration_strain: "Integración Strain"
 SIA_mdo_integration_strain_desc: "Mantener estructuras de comandos multidominio, desde imágenes cibernéticas a basadas en el espacio, cuesta dinero mucho antes de que la doctrina comience a pagar por sí misma."
 SIA_ministry_of_defence: "Ministerio de Defensa"
 SIA_ministry_of_defence_desc: "La defensa del Reino siempre ha sido administrada por los propios servicios, cada uno vigilando su propio presupuesto, su propia doctrina, su propio territorio. Por fin, le damos una columna institucional: un Ministerio que se sienta por encima del ejército, la armada y la fuerza aérea y une la defensa territorial, la política de seguridad nacional e inteligencia en un solo aparato que responda al Estado."
 SIA_comprehensive_security: "Seguridad integral"
 SIA_comprehensive_security_desc: "Interior, defensa e inteligencia han visto las mismas fronteras durante décadas con tres conjuntos de archivos y sin hábito de compartirlos. Una doctrina los une, y abre tres líneas de esfuerzo a la vez: la economía, el frente del hogar y las fuerzas armadas."
 SIA_protector_of_the_realm_focus: "Protector del Reino"
 SIA_protector_of_the_realm_focus_desc: "Con el Monumento de la Victoria consagrado, Shan, Lao, Khmer y Malay se encuentra bajo la bandera tailandesa. Ganarla y gobernarla son tareas diferentes. Una administración para la frontera reclamada va detrás de las guarnición, y comienza el trabajo de pacificar, desarrollar y cortarlo a tiempo."
 SIA_atoms_for_peace: "Átomos para la paz"
 SIA_atoms_for_peace_desc: "Tailandia firma los protocolos de uso pacífico del OIEA y comienza la larga trayectoria institucional. Una autoridad de seguridad nuclear, acuerdos de combustible gastado y el primer reactor de investigación nacional. El programa civil se basa en la convicción de que el poder base de uranio es más barato, más limpio y más soberano que el petróleo importado a precios geopolíticos."
 SIA_smr_initiative: "Iniciativa SMR"
 SIA_smr_initiative_desc: "Los pequeños reactores modulares son la tecnología que hace viable la energía nuclear para un país que no puede permitirse el gasto de capital de una planta de tamaño completo. La iniciativa financia estudios de viabilidad, evaluaciones del sitio en el Seaboard Oriental y un acuerdo de transferencia de tecnología con un consorcio surcoreano o francés. El primer vertido de hormigón está a una década de distancia. La decisión es hoy."
 SIA_nuclear_power_program: "Programa de energía nuclear"
 SIA_nuclear_power_program_desc: "El capstone es un programa nacional de energía nuclear con una fecha comprometida de puesta en marcha, un marco soberano del ciclo de combustible y el primer reactor de la red. Tailandia se convierte en el primer estado del sudeste asiático en poner un reactor civil en la red, uniéndose a Japón, Corea del Sur, China, India, Pakistán y Taiwán entre los operadores nucleares de la región. La independencia energética ya no es teórica."
 SIA_bangkok_phnom_penh_axis: "Bangkok y Phnom Penh Axis"
 SIA_bangkok_phnom_penh_axis_desc: "La geografía de Camboya hace que el corredor económico natural de Tailandia llegue al mar, y su trayectoria política lo convierte en el contrapeso diplomático natural de Bangkok a Vietnam. Este enfoque construye la relación a través de misiones comerciales, enlaces por carretera y un marco de seguridad compartido que mantiene a Phnom Penh cerca de Bangkok y lejos de la órbita de Beijing."
 SIA_jakarta_dialogue: "Diálogo de Yakarta"
 SIA_jakarta_dialogue_desc: "Indonesia es el gigante demográfico del sudeste asiático y la relación bilateral más importante de Tailandia después de Kuala Lumpur. El Diálogo de Yakarta es la plataforma, reuniendo ministros bilaterales, ejercicios militares conjuntos y una conversación franca sobre quién lidera la próxima década de ASEAN. El resultado depende de si Bangkok ve a Yakarta como un socio o un rival."
 SIA_asean_crossroads: "ASEAN Crossroads"
 SIA_asean_crossroads_desc: "Dos caminos se encuentran ante el Reino. La primera es la asociación, una orden dirigida por Tailandia que une a la ASEAN por consentimiento. El segundo es el dominio, Asia sudoriental traído bajo control tailandés por la espada."
 SIA_the_2001_election_choice_tt: "Retrocede una fuerza en la campaña de 2001. La elección decide quién gobierna, y sólo se abre el camino del ganador.\n £SIA_neutral_Social §YTai Rak Thai§!\n - £SIA_Nat_Autocracy §Y La red de palacios y sus generales§!\n £SIA_western_conservative §Y Los demócratas titulares§!"
 SIA_the_2006_coup_choice_tt: "Elige el carácter de la junta.\n - §YHard-line§!: Suspende las elecciones y reescribe la constitución, a un costo para la estabilidad y la opinión occidental\n - §YConciliatorio§!: Mantiene elecciones democráticas y paga un precio más pequeño"
 SIA_a_new_republic_choice_tt: "Elige el destino de la monarquía.\n - §YAbolir§!: El tiempo de la turbulencia\n - §YRetroceder§!: Mantenga la corona para la estabilidad y Poder político"
 SIA_the_southern_question_choice_tt: "Elige una doctrina de seguridad para el Sur Profundo."
 SIA_red_chakri_dilemma_choice_tt: "Elige la respuesta de la revolución al trono.\n - §YAbolir la monarquía§!: Ante una insurgencia realista\n - §YMantenga una figura constitucional§!: Siga el modelo de Lao y absorba la ira de los corredores"
 SIA_lost_territories_choice_tt: "Elija cómo se presiona abiertamente la reclamación.\n - §YEl irredentismo abierto§!: Apoyo a la guerra al costo de estar\n - §Y Revisionismo denegable§!: Protege la estabilidad"
 SIA_nuclear_power_program_choice_tt: "Elija la dirección del ciclo de combustible.\n - §YDefy the inspectors§!: Enriquecimiento de armas bajo sanciones\n - §Y Aceptar las salvaguardias del OIEA§!: Reparar las relaciones con Washington"
 SIA_prayuth_premiership_choice_tt: "Elija cómo el general planea su sucesión.\n - §YUna transición gestionada§!: Entrenando el establecimiento\n - §Y Institucionalizar el acuerdo§!: Retroceder hacia un rostro civil"
 SIA_2020_protest_response_choice_tt: "Elige una respuesta a las protestas.\n - §YCrack down§!: Costos estabilidad y aumenta el riesgo de golpe\n - §Y Reforma del Concede§!: Calma y un impulso al movimiento de reforma\n - §YEspérelos fuera§!"
 SIA_found_the_pact: "La Organización del Tratado de Asia Sudoriental"
 SIA_found_the_pact_desc: "Las palabras se convierten en instituciones. Tailandia revive el nombre de los poderes externos abandonados en 1977 y le da un propietario regional: la Organización del Tratado de Asia Sudoriental, un pacto de defensa mutua con Bangkok en su centro y los vecinos como sus miembros. Tailandia asume el papel de líder fundador. La bandera está levantada. El pacto es real."
 SIA_invite_mainland: "Invitar socios continentales"
 SIA_invite_mainland_desc: "Vietnam, Laos, Camboya y Myanmar comparten fronteras con Tailandia y enfrentan amenazas compartidas. Bangkok extiende invitaciones formales a los estados continentales, lo que hace que la seguridad en el interior continental dependa de causa común, no de coberturas competidoras."
 SIA_invite_mainland_tt: "Invita a nuestros vecinos continentales a unirse a SEATO.\n - Cada uno decide por sí mismo si acepta\n - Un miembro que acepta gana un espíritu manteniéndolo comprometido con el pacto"
 SIA_invite_maritime: "Invitar a Maritime Partners"
 SIA_invite_maritime_desc: "Indonesia, Filipinas, Malasia, Singapur y Brunei controlan los mares que Tailandia depende del comercio. Se invita a los socios marítimos a unirse al pacto, uniendo el archipiélago y la península en una sola comunidad estratégica."
 SIA_invite_maritime_tt: "Invita a los estados marítimos del sudeste asiático a unirse a SEATO.\n - Cada uno decide por sí mismo si acepta\n - Un miembro que acepta gana un espíritu manteniéndolo comprometido con el pacto"
 SIA_invite_breakaways: "Invitar a los Estados de la Frontera"
 SIA_invite_breakaways_desc: "Sur Shan, Karen y Wa sostienen la tierra entre Tailandia y el corazón de Burmese, y ninguno de ellos puede sobrevivir solo. Bangkok les ofrece lo que Naypyidaw nunca quiere: un asiento en una mesa, una firma de tratados y la posición de un estado más que una insurgencia."
 SIA_invite_breakaways_tt: "Invita a los estados de fuga Burmese a unirse a SEATO, donde existen.\n - Cada uno decide por sí mismo si acepta\n - Un miembro que acepta gana un espíritu manteniéndolo comprometido con el pacto"
 SIA_seato_invite_line_tt: " - §Y[THIS.GetNameDefCap]§! es invitado a unirse a SEATO"
 SIA_seato_accession_category: "SEATO Adhesión"
 SIA_seato_accession_category_desc: "La primera Organización del Tratado de Asia Sudoriental fue firmada en Manila en 1954 y huida de Bangkok, pero sólo dos de sus ocho miembros fueron el sudeste asiático y se disolvió en 1977 sin ser nunca invocado. Este es el pacto regional que nunca fue el primero: Tailandia en la silla, los vecinos como miembros, y una garantía que corre a la defensa del sudeste asiático más que a la estrategia de contención de cualquier otra persona. Los asientos deben llenarse uno a la vez.\n\nVea la receptividad de cada país antes de invitarlos a la facción."
 SIA_renew_seato_invitation: "Renovar la invitación"
 SIA_renew_seato_invitation_desc: "Enviar la delegación de vuelta a [FROM.GetNameDefCap] con el texto del tratado y una nueva oferta. Una negativa no es permanente y los términos no han cambiado."
 SIA_seato_charm_offensive_major: "Corte [FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_major_desc: "Visitas estatales, una línea de crédito, becas para sus oficiales y un pabellón tailandés en su feria. El ministerio extranjero no funciona nada más durante tres meses. Ninguno de ellos es un tratado. Todo esto hace que el tratado sea más fácil de firmar la próxima vez que preguntemos."
 SIA_seato_charm_offensive_minor: "Corte [FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_minor_desc: "Visitas estatales, una línea de crédito, becas para sus oficiales y un pabellón tailandés en su feria. El ministerio extranjero no funciona nada más durante tres meses. Ninguno de ellos es un tratado. Todo esto hace que el tratado sea más fácil de firmar la próxima vez que preguntemos."
 SIA_courting_mission: "Corte de los vecinos"
 SIA_courting_mission_desc: "El personal diplomático superior, el calendario ministerial y la mayoría del presupuesto discrecional están comprometidos con un capital hasta que finalice la misión. Todo lo demás en el gobierno espera su turno."
 SIA_seato_rec_opinion_yes: "§GLa opinión de Tailandia es superior a 40§! (+25)"
 SIA_seato_rec_opinion_no: "§RLa opinión de Tailandia es 40 o inferior§! (+25)"
 SIA_seato_rec_faction_yes: "§GNo en otra facción§! (+20)"
 SIA_seato_rec_faction_no: "§RYa en otra facción§! (+20)"
 SIA_seato_rec_influence_yes: "§GTailandia está en las tres mayores fuentes de influencia, manteniendo el 20 por ciento o más§! (+20)"
 SIA_seato_rec_influence_no: "§RTailandia no es las tres mayores fuentes de influencia, al 20 por ciento o más§! (+20)"
 SIA_seato_rec_threat_yes: "§GEn la guerra o limitan un país que está en guerra§! (+15)"
 SIA_seato_rec_threat_no: "§RNi ellos ni ningún país que limitan está en guerra§! (+15)"
 SIA_seato_rec_trade_yes: "§GHoldó un acuerdo comercial con Tailandia§! (+10)"
 SIA_seato_rec_trade_no: "§RNo hay acuerdo comercial con Tailandia§! (+10)"
 SIA_seato_rec_momentum_yes: "§GSEATO ya tiene tres o más miembros§! (+10)"
 SIA_seato_rec_momentum_no: "§RSEATO tiene menos de tres miembros§! (+10)"
 SIA_seato_rec_total: "§YReceptividad de SEATO§!: §Y [?SIA_seato_temp|0]§!/100. Aceptan una invitación al §Y60§!."
 SIA_joint_command: "Comando Conjunto de la ASEAN"
 SIA_joint_command_desc: "En Bangkok se establece una estructura permanente de mando conjunto, que integra doctrina, logística e inteligencia de cada Estado miembro. Los oficiales tailandeseses ocupan puestos de categoría superior, pero el personal es verdaderamente multilateral. Los ejercicios se vuelven interoperables. Los planes se vuelven reales."
 SIA_asean_rapid_reaction: "Fuerza de reacción rápida de la ASEAN"
 SIA_asean_rapid_reaction_desc: "El pacto da su siguiente paso, una brigada de reacción rápida permanente, procedente de todos los Estados miembros, capaz de desplegar dentro de 72 horas a cualquier punto del sudeste asiático. Es la espada del pacto, pequeña, rápida e inconfundiblemente real."
 SIA_arsenal_integration: "Integración de arsenales de la ASEAN"
 SIA_arsenal_integration_desc: "La industria de defensa de Tailandia, ya el taller del sudeste asiático, estandariza armas y municiones en todas las fuerzas armadas de los Estados miembros. Los rifles, vehículos y proyectiles de artillería hechos en Tailandia reemplazan el patchwork del hardware soviético, chino y occidental. Los ejércitos del pacto ahora comparten las mismas balas."
 SIA_pax_aseana: "Pax Aseana"
 SIA_pax_aseana_desc: "El trabajo se hace y el pacto sostiene. Tailandia ha construido lo que ningún poder exterior podría hacer, una auténtica arquitectura de seguridad arraigada en la región y lo suficientemente fuerte como para disuadir a cualquier retador. Los vecinos firmaron porque querían y por eso durará."
 SIA_war_economy_push: "La economía de guerra Empuja"
 SIA_war_economy_push_desc: "La nación está a pie de guerra. Los factores que fabricaron bienes de consumo se reinician para proyectiles de artillería y barriles de fusil. Se levanta el límite máximo de gastos militares, se firman contratos de adquisiciones sin las demoras habituales y tres nuevas fábricas de armas surgen de lotes rápidamente despejados en la región metropolitana de Bangkok."
 SIA_friends_abroad: "Amigos en el extranjero"
 SIA_friends_abroad_desc: "Las fuerzas armadas de Tailandia han pasado décadas entrenando junto con socios extranjeros. Los vínculos bilaterales forjados en ejercicios conjuntos, intercambios de oficiales y transferencias de armas son un pilar silencioso de la seguridad tailandesa, menos visible que las alianzas, pero más duradero que la mayoría. Es hora de formalizar lo que ya funciona."
 SIA_cobra_gold_focus: "Oro cobra"
 SIA_cobra_gold_focus_desc: "Cobra Gold es el mayor ejercicio militar conjunto anual en Asia, coorganizado por Tailandia y Estados Unidos. Profundizar el programa de ejercicio trae la doctrina americana, entrenamiento logístico y familiaridad del equipo al Real Ejército tailandés, y cementa Bangkok como socio anclaje de Washington en el sudeste asiático continental."
 SIA_partner_japan: "Tiros de defensa de japan"
 SIA_partner_japan_desc: "Las reformas de exportación del Japón en materia de defensa han abierto nuevos canales para la adquisición tailandesa. Tokio ofrece conocimientos prácticos de fabricación precisa, electrónica de doble uso y financiación de infraestructura que complementa las capacidades tailandesas sin las cadenas políticas vinculadas a paquetes chinos o estadounidenses."
 SIA_partner_korea: "Asociación de defensa ROK"
 SIA_partner_korea_desc: "La República de Corea ha construido una industria de armas competitiva en una sola generación. Los tanques K-2, los jets FA-50 y los auitzers K9 se venden a precios competitivos para socios de todo el sudeste asiático. Tailandia se une a la cola, y trae a casa entrenamiento aéreo estándar coreano y metodología industrial."
 SIA_partner_australia: "Cinco ojos vecino"
 SIA_partner_australia_desc: "Australia es el socio anglófono más cercano de Tailandia y un compañero aliado no OTAN de los Estados Unidos. Los ejercicios conjuntos en el Mar Andamán y el Golfo de Tailandia han profundizado los vínculos entre la marina. La ampliación de la asociación ofrece cooperación entre las operaciones del ejército y la vigilancia marítima que ningún país puede permitirse por sí solo."
 SIA_partner_taiwan: "Cooperación de defensa silenciosa"
 SIA_partner_taiwan_desc: "La industria de defensa de Taiwán es discreta, técnicamente sofisticada y políticamente motivada para encontrar amigos. Bangkok no reconoce a Taipei, pero el Ejército Real de Tailandia y los militares del ROC han mantenido durante mucho tiempo canales informales para el equipo y la capacitación. Formalizar esa cooperación, en silencio, es un riesgo calculado. Beijing se dará cuenta."
 SIA_hedging_partners: "Amigos en el Lejano Oriente"
 SIA_hedging_partners_desc: "Tokio, Seúl y Beijing ofrecen a Bangkok algo que Washington no puede: capital paciente, tecnología de doble uso, un vasto mercado vecino. Ninguno de ellos exige exclusividad. Tailandia juzga a los tres y mantiene su precio en alto, negándose a ser el ancla de cualquiera o el cliente de nadie. Un Reino ya comprometido con la cobertura consigue el doble de estos vínculos."
 SIA_national_grid: "Potenciar el Reino"
 SIA_national_grid_desc: "La rápida industrialización de Tailandia ha superado su red eléctrica. El Seaboard Oriental se humea con fábricas pero la rejilla está envejeciendo, las pérdidas de transmisión son vergonzosas, y la próxima década de crecimiento exige una fundación que puede llevar la carga. El gobierno se compromete a mejorar la infraestructura nacional, con nuevas subestaciones, líneas de transmisión actualizadas y nuevas fábricas en las regiones que la red puede finalmente potenciar."
 SIA_renewable_push: "Unidad de energía renovable"
 SIA_renewable_push_desc: "Viento fuera del golfo, solar a través de las llanuras centrales, pequeño hidro en el norte. La geografía de Tailandia es un activo de energía renovable que ha sido crónicamente infraexplotado. Este programa organiza instalaciones renovables a gran escala en todas las regiones del Reino, y vincula su producción directamente con la red nacional."
 SIA_green_grid: "El Grid Verde"
 SIA_green_grid_desc: "La capacidad renovable es una cosa, y una cuadrícula que puede usarla es otra. Almacenamiento, envío inteligente y transmisión modernizada tejen las granjas solares del Reino y las crestas eólicas en suministro confiable, y cada nuevo panel o turbina sube más rápido en la columna vertebral fortalecida. La independencia energética del Reino comienza aquí."
 SIA_fossil_fuels_deal: "Asociación energética del Golfo"
 SIA_fossil_fuels_deal_desc: "Las refinerías del Reino funcionan en la cruda del Golfo y sus centrales eléctricas queman gas importado. En lugar de luchar contra la dependencia, Bangkok lo formaliza. Los acuerdos de suministro a largo plazo con Arabia Saudita, Qatar y los Emiratos Árabes Unidos ofrecen seguridad en cuanto al precio, un dividendo modesto de eficiencia energética mediante modernos reacondicionamientos de centrales eléctricas y la calidez diplomática que viene con un cheque."
 SIA_gulf_energy_ties: "Reservas estratégicas de combustible"
 SIA_gulf_energy_ties_desc: "Un tanque que nunca navega es una central eléctrica que nunca comienza. Dos instalaciones estratégicas de almacenamiento de combustible suben en el corredor industrial meridional y el Seaboard oriental. Los socios del Golfo financian la mitad de la construcción, y los ingenieros tailandeses construyen el resto."
 SIA_iron_fist_doctrine: "Fist Doctrina de hierro"
 SIA_iron_fist_doctrine_desc: "Ya no habrá más palabras de queja. Las tres provincias están inundadas de tropas, puestos de control y poderes de emergencia. La insurgencia es un problema de seguridad y será contestada como una, rápida, dura y sin disculpas. El mundo se opondrá. El Sur estará tranquilo."
 SIA_martial_law_south: "Ley Marcial en el Sur"
 SIA_martial_law_south_desc: "Un decreto de emergencia coloca a Pattani, Yala y Narathiwat bajo la administración militar. Los toques de queda, las incursiones y la detención sin cargo se convierten en la textura diaria de la vida en el sur. El ejército ahora puede actuar con inteligencia en el momento en que llega, y la población aprende el precio de albergar a los hombres con las armas."
 SIA_search_and_destroy: "Búsqueda y destrucción"
 SIA_search_and_destroy_desc: "Fuerzas especiales y conducta de aviación barridos cinéticos de la presunta red celular. Las operaciones son decisivas y el cuerpo cuenta alto. Cada redada que golpea a su objetivo rompe la insurgencia un poco más, y cada asalto que golpea una boda en lugar de eso les da una generación de reclutas."
 SIA_pacification_complete: "Pacificación completa"
 SIA_pacification_complete_desc: "Las bombas de carretera se han detenido y los puestos de control han bajado. Las mezquitas están vigiladas, las escuelas son supervisadas y la queja bajo el silencio no ha muerto. Las armas caen en silencio, pero las brasas permanecen."
 SIA_royal_development_projects: "Reales proyectos de desarrollo"
 SIA_royal_development_projects_desc: "Bajo la iniciativa del Rey, el modelo de desarrollo de la corona es llevado al sur, con riego, agricultura, carreteras y cooperativas de copatrocinio real. El mensaje es que la monarquía, no la insurgencia, entrega para el sur malayo-musulmán. Patronaje y presencia, no sólo patrullas."
 SIA_isoc_southern_command: "Comando Sur de ISOC"
 SIA_isoc_southern_command_desc: "El Comando de Operaciones de Seguridad Interna asume autoridad unificada sobre el teatro sur, con coordinación civil-militar, fusión de inteligencia y el aparato de energía blanda bajo un mismo techo. Si la red ISOC ya es madura, el comando sur puede pasar de la reacción a la anticipación."
 SIA_winning_hearts_royally: "Corazones ganadores, Royally"
 SIA_winning_hearts_royally_desc: "Becas, renovaciones de mezquitas, zonas de desarrollo certificadas por el halal y una elevación deliberada de los notables locales malayo-musulmanes en el sistema de patrocinio. El estado no llega como ocupante sino como benefactor, y lentamente, en lugares, el cálculo de los hombres jóvenes cambia."
 SIA_southern_calm: "Una calma del sur"
 SIA_southern_calm_desc: "La violencia se ha reclinado en un silencio controlado y gestionado. No hay tratado ni autonomía, sin embargo las provincias funcionan y el aegis real sostiene. Una calma conservada por la presencia y el patrocinio."
 SIA_peace_dialogue_initiative: "Iniciativa de diálogo sobre la paz"
 SIA_peace_dialogue_initiative_desc: "Bangkok abre formalmente la pista Kuala Lumpur, con Malasia como facilitador. Por primera vez el estado se sienta a través de la mesa de los hombres que ha cazado, y reconoce la premisa de que el futuro del Sur es un asunto de negociación, no sólo fuerza. Cuesta el capital político en casa, pero abre un camino que las balas nunca pudieron."
 SIA_mara_patani_talks: "MARA Patani habla"
 SIA_mara_patani_talks_desc: "Las negociaciones formales con el grupo paraguas MARA Patani comienzan en serio. Las medidas de fomento de la confianza, las zonas de seguridad y un verdadero marco de cesación del fuego están sobre la mesa. Kuala Lumpur se apoya, y el liderazgo insurgente, fracturado pero real, comienza a creer que es posible un acuerdo."
 SIA_autonomy_framework: "Marco especial de autonomía"
 SIA_autonomy_framework_desc: "Los negociadores redactan una ley de administración especial para las tres provincias, con un consejo regional elegido, educación en lengua local, tribunales religiosos y una parte de los ingresos por desarrollo que se mantienen en el Sur. Es la concesión más de largo alcance en la historia del Reino, y el establecimiento en Bangkok ya se está movilizando contra ella."
 SIA_pattani_peace_accord: "El Acuerdo de Paz Pattani"
 SIA_pattani_peace_accord_desc: "Un acuerdo firmado termina la insurgencia más larga en la historia moderna del Reino. El Sur gana una medida de autogobierno dentro de un Tailandia unitario, las armas se entregan y el retorno desplazado. Es imperfecto, impugnado e histórico. El conflicto ha terminado."
 SIA_ds_tier_to_1: "§GEl Sur Profundo se reserva a un sommer bajo (Más 1, -2% de estabilidad).§!"
 SIA_ds_tier_to_2: "§YLa violencia subió en Pattani (Más 2, -4% estabilidad, -5% poder político).§!"
 SIA_ds_tier_to_3: "§REl Sur está ablaz (Tier 3, -7% estabilidad, -10% poder político, -5% apoyo de guerra).§!"
 SIA_ds_intensity_down: "§GLa intensidad insurgente cae en puntos [?ds_delta].§!"
 SIA_ds_intensity_up: "§RLa intensidad insurgente aumenta en puntos [?ds_delta].§!"
 SIA_ds_grievance_up: "§RLas tácticas con las manos pesadas profundizan la queja de la comunidad por [?ds_grievance_delta]. El suelo de intensidad se eleva con él, y el conflicto ya no puede ser arraigado solo por la fuerza.§!"
 SIA_ds_grievance_down: "§GUna concesión genuina facilita la queja comunitaria ([?ds_grievance_delta]). La intensidad de la violencia se encuentra en gotas, trayendo una resolución real a su alcance.§!"
 SIA_iron_fist_doctrine_tt: "Inundar las tres provincias con tropas.\n - Intensidad de la insurgencia §G-10§!\n - Riesgo de acumulación §R+10§!\n - Sharply profundiza la queja de la comunidad, levantando el suelo el conflicto nunca puede caer por debajo"
 SIA_martial_law_south_tt: "Decreto de emergencia sobre Pattani, Yala, Narathiwat. Intensidad -8, profundiza la queja, opinión de Malasia/Indonesia -."
 SIA_search_and_destroy_tt: "Barridos cinéticos. Intensidad -12, profundiza la queja. Necesita que el Sur inferior a 50 intensidad comience. Riesgo de una atrocidad que retrocede."
 SIA_pacification_complete_tt: "Las armas caen en silencio, pero las brasas permanecen."
 SIA_royal_development_projects_tt: "Proyectos de iniciación real en el sur. Intensidad -6, facilidades de queja, +2% estabilidad, tesorería -3."
 SIA_isoc_southern_command_tt: "ISOC asume el comando sur. Intensidad -7 (fase si la red ISOC está activa), pero la red de vigilancia se agudiza un poco."
 SIA_winning_hearts_royally_tt: "Patrocinio y desarrollo. Intensidad -7, facilita la queja sustancialmente, +3% estabilidad. Necesita el sur por debajo de 40 intensidad para comenzar."
 SIA_southern_calm_tt: "Una calma gestionada y monitoreada bajo el aegis real."
 SIA_peace_dialogue_initiative_tt: "Abre la pista Kuala Lumpur. Intensidad -5, facilita la queja, el poder político -75, abre las negociaciones."
 SIA_mara_patani_talks_tt: "Habla formal con MARA Patani. Intensidad -8, facilidades de queja, Malasia opinión +, requiere un 45% de estabilidad."
 SIA_autonomy_framework_tt: "Proyecto de ley sobre la zona especial. El establecimiento retrocederá.\n - Intensidad de la insurgencia §G-7§!\n - El más profundo corte a la reivindicación comunitaria de cualquier opción\n - Requiere la intensidad Sur abajo §Y35§! para comenzar"
 SIA_pattani_peace_accord_tt: "Un acuerdo firmado y un camino hacia la autonomía. El conflicto termina."
 SIA_anti_narcotics_bureau: "Oficina antinarcóticos"
 SIA_anti_narcotics_bureau_desc: "La Oficina de la Junta de Fiscalización de Estupefacientes de Tailandia se expande y da dientes, con un presupuesto dedicado, poderes de investigación protegidos y un mandato formal para buscar redes de tráfico en lugar de distribuidores callejeros. La oficina dirige la cadena de suministro, desde los laboratorios estatales de Shan a los centros de distribución de Bangkok."
 SIA_golden_triangle_interdiction: "Interdicción del Triángulo de Oro"
 SIA_golden_triangle_interdiction_desc: "La región trifronteriza donde se encuentran Tailandia, Myanmar y Laos es la fuente de la mayor parte de la heroína y la metanfetamina inundando ciudades tailandesas y transitando a mercados mundiales. Se refuerzan las patrullas fronterizas, se amplió la vigilancia aérea y un grupo de tareas conjunto con los miembros de las milicias de Shan está dispuesto a interceptar los envíos antes de cruzar el Mekong. Los narcotraficantes se adaptarán, como siempre lo hacen, pero esto eleva el costo."
 SIA_golden_triangle_interdiction_tt: "Disrupta las rutas de tráfico a través del Mekong, apretando el control del Reino en el norte."
 SIA_anti_graft_push: "Empuje anti-Graft"
 SIA_anti_graft_push_desc: "La Comisión Nacional Anticorrupción recibe dientes, con un mandato ampliado de investigación, un presupuesto respaldado por anillos y protección jurídica para los denunciantes. Los abusos de las adquisiciones en materia de defensa, construcción y aduanas, los tres vectores más lucrativos para el injerto, están dirigidos primero. El contrato limpio es más lento para construir que el antiguo arreglo era para afianzar. Empujándolo a través pasa capital político y desacelera a un público acostumbrado a la vieja manera."
 SIA_transparency_watchdog: "Transparencia Watchdog"
 SIA_transparency_watchdog_desc: "Se ha establecido una Oficina independiente de Transparencia Fiscal, que informa directamente al Parlamento en lugar del Ministerio de Finanzas. La divulgación obligatoria de los activos para funcionarios públicos de categoría superior, la presentación de informes en tiempo real sobre adquisiciones públicas y un portal de auditoría ciudadana cierran las lagunas que han permitido que persista la extracción sistemática de alquileres. La corrupción no desaparece, pero se vuelve mesurablemente más costosa de sostener, y durante seis meses las redes que expone combaten a través del procedimiento y el retraso."
 SIA_watchdog_backlash: "La máquina lucha atrás"
 SIA_watchdog_backlash_desc: "Las redes expuestas por el nuevo régimen de transparencia no han desaparecido. Durante seis meses luchan contra las reformas mediante procedimientos, retrasos y obstrucción silenciosa, hemorragia del poder político y, en las provincias más ligadas con ellas, confianza pública."
 SIA_decentralize_governance: "Empoderar a las provincias"
 SIA_decentralize_governance_desc: "Tras el empuje anticorrupción, la autoridad de gobernanza y la asignación presupuestaria se redistribuyen de Bangkok a las provincias. Las organizaciones administrativas provinciales ganan mandatos ampliados, los gobernadores electos controlan el gasto de infraestructura local, y Chiang Mai, Khon Kaen y Songkhla emergen como verdaderos polos secundarios de la actividad económica. El crecimiento es más lento para concentrarse, pero el camino más tranquilo y estable mantiene al país estable."
 SIA_bangkok_primacy: "Bangkok primero"
 SIA_bangkok_primacy_desc: "Los dividendos anticorrupción se reinvierten en la capital. Los distritos industriales de Bangkok se actualizan, sus instituciones de investigación se concentran y su infraestructura de tránsito público se expande. La eficiencia y la producción de investigación suben bruscamente, pero los críticos señalan que la prosperidad se está acumulando en una ciudad de diez millones mientras las provincias esperan, y el resentimiento que genera es un verdadero arrastre en el estado de ánimo del país."
 SIA_asean_hegemony: "Hegemonía de la ASEAN"
 SIA_asean_hegemony_desc: "El proyecto Greater Thailand está completo en el continente. Ahora el Reino gira su mirada hacia el resto de Asia Sudoriental. La ASEAN siempre fue un proyecto dirigido por Tailandia con espíritu. Que se convierta en uno de hecho, por la espada si es necesario. El personal general prepara contingencias para la subyugación del archipiélago y el estado-ciudad."
 SIA_maritime_claims: "La frontera marítima"
 SIA_maritime_claims_desc: "Más allá del Istmo se encuentran los grandes estados archipelágicos, Manila, Yakarta y el sultanato rico en aceite de Brunei. Un empuje de agua azul requerirá el peso completo del Royal Thai Navy y Marine Corps. La almiranteza comienza a planear operaciones anfibias en todo el Mar del Sur de China y los enfoques Java."
 SIA_maritime_claims_threat: "Thai Naval Buildup en el archipiélago"
 SIA_claim_philippines: "Subyugar a Filipinas"
 SIA_claim_philippines_desc: "El archipiélago filipino dirige los enfoques orientales del Mar de China Meridional. Llevar a Manila bajo la orden de Bangkok asegura el flanco marítimo y el trabajo de cien millones de filipinos para el nuevo orden. Presionamos nuestro reclamo en cada isla de la República."
 SIA_claim_indonesia: "Subjugate Indonesia"
 SIA_claim_indonesia_desc: "Indonesia es el gigante del sur, espeluznante, populoso y rico en recursos. Para dominar la ASEAN, Bangkok debe dominar Yakarta. La campaña será larga y las islas muchas, pero el premio es la mayor economía y población del sudeste asiático."
 SIA_claim_brunei: "Secar a Brunei"
 SIA_claim_brunei_desc: "Tiny Brunei se sienta sobre algunas de las reservas hidrocarburos más ricas de la región. La riqueza de la Sultanía y su posición estratégica sobre Borneo lo convierten en un premio irresistible. Nos movemos para doblar el sultanato al Reino."
 SIA_mainland_claims: "El asentamiento continental"
 SIA_mainland_claims_desc: "Dos poderes en el continente aún tienen que doblar la rodilla. Vietnam, el viejo rival a través de la gama Annamite y Singapur, el rico estado-ciudad vigilando el Estrecho de Malaca. Ambos deben ser llevados a talón para completar la primacía tailandesa en el sudeste asiático."
 SIA_mainland_claims_threat: "Movilización tailandesa contra los refugios continentales"
 SIA_claim_vietnam: "Subjugate Vietnam"
 SIA_claim_vietnam_desc: "Vietnam ha disputado desde hace mucho tiempo el continente sudeste asiático con Tailandia, desde los tribunales del viejo Siam hasta los campos de matanza del siglo XX. Ahora se resolverá la rivalidad histórica. Presionamos nuestro reclamo desde el Mekong a la costa de Annamite."
 SIA_claim_singapore: "Aproveche a Singapur"
 SIA_claim_singapore_desc: "Singapur es la joya del estrecho, una central financiera y el portero del carril de transporte más ocupado del mundo. Quien tenga la Ciudad León tiene la garganta del comercio asiático. Nos movemos para hacerlo tailandés."
 SIA_asean_protector: "Protector of ASEAN"
 SIA_asean_protector_tt: "El camino de la asociación está abierto a cualquier gobierno, incluido el mandato §YGreater Tailandia§!."
 SIA_asean_protector_desc: "Tailandia más grande no necesita ser un imperio de conquista. Habiendo asegurado el continente, el Reino puede convertirse en el garante de la seguridad del sudeste asiático, un hegemon benevolente que protege a sus vecinos más que anexarlos. Bangkok amplía su protección en toda la región, obligando a la ASEAN a la corona tailandesa mediante la alianza más que la ocupación."
 SIA_guarantee_maritime: "escudo del archipiélago"
 SIA_guarantee_maritime_desc: "Tailandia otorga garantías formales de seguridad a los estados marítimos, Filipinas, Indonesia y Brunei. La Marina Real de Tailandia estará segura por su independencia, y a cambio Bangkok se convierte en el poder indispensable del mar meridional."
 SIA_guarantee_mainland: "Guardián de la península"
 SIA_guarantee_mainland_desc: "Bangkok garantiza la seguridad de Vietnam, Singapur y Malasia, terminando siglos de rivalidad con un asentamiento dirigido por Tailandia. El viejo enemigo, el rico estado de la ciudad, y el vecino peninsular por igual refugio bajo la protección del Reino, y el continente está en paz en términos tailandeses."
 SIA_guarantee_indochina: "Umbrella sobre Indochina"
 SIA_guarantee_indochina_desc: "Los más pobres y expuestos de los vecinos de Tailandia son los que suele saltar un hegemon. Bangkok les garantiza de todos modos: Laos, Camboya y Myanmar, y los Estados fronterizos birmanos donde están. La protección que alcanza a los débiles es la única clase que prueba que el Reino significa lo que dice."
 SIA_protector_of_asean_focus: "Una ASEAN, un escudo"
 SIA_protector_of_asean_focus_desc: "Un paraguas firmado es suficiente para cambiar la dinámica política de la región. Cualquiera que sea la garantía de Bangkok extendida a primera, el Reino sirve como protector del sudeste asiático, y una arquitectura de seguridad dirigida por Tailandia comienza a reemplazar el antiguo equilibrio del miedo. La defensa de la región se está volviendo indivisible, y Bangkok tiene la piedra clave."
 SIA_professional_officer_corps_focus: "A Cuerpo de Funcionarios Profesionales"
 SIA_professional_officer_corps_focus_desc: "La facción de la reforma gana el argumento. Avance por la competencia, un verdadero oleoducto del personal y una cultura de mando basada en la doctrina más que en el patrocinio. El hábito de golpes se desvanece cuando el ejército aprende a enorgullecerse de los soldados en lugar de la política."
 SIA_martial_prestige_focus: "La Gloria de la Espada"
 SIA_martial_prestige_focus_desc: "Los tradicionalistas prevalecen. Las fuerzas armadas se celebran como el alma de la nación, la tierra del desfile tan sagrada como el templo. Morale y espíritu marcial soar, pero el culto del uniforme mantiene a los generales cerca del centro de poder."
 SIA_jointness_reform: "Reforma conjunta"
 SIA_jointness_reform_desc: "Una fuerza de comando conjunta teje los tres servicios en un instrumento de combate. Al combinar personal, compartir doctrinas y unificar la cadena de mando, la estructura de comandos paralelos se convierte en una fuerza coherente capaz de operaciones multidominio."
 SIA_defense_export_office: "Oficina de exportación de Defensa"
 SIA_defense_export_office_desc: "Una agencia dedicada que lleva sistemas hechos por Tailandia al mercado mundial mediante contratos de intermediación, organizando financiación y convirtiendo la base industrial de defensa en una fuente de ingresos más que un drenaje en el presupuesto."
 SIA_self_reliant_defense_base: "Una base de defensa autosuficiente"
 SIA_self_reliant_defense_base_desc: "Las nuevas plantas de armas y una cadena de suministro más profunda liberan al Reino de depender de los proveedores extranjeros. Tailandia puede armarse a sí misma, y sus clientes, de sus propias fábricas, con sus propios diseños, en su propio horario."
 SIA_total_defense_doctrine: "Doctrina de Defensa Total"
 SIA_total_defense_doctrine_desc: "La defensa se convierte en una empresa entera de la nación, con reclutamiento ampliado, simulacros rutinarios de defensa civil y un frente hogareño endurecido. El Reino prepara no sólo un ejército sino una sociedad dispuesta a resistir."
 SIA_doctrine_professional_tt: "Actualiza la idea §YLas Fuerzas Profesionales§! a su próximo nivel y compromete al Reino al camino de profesionalización."
 SIA_doctrine_prestige_tt: "Grants §YGloria Marcial§! y compromete al Reino a la trayectoria de prestigio, con alto apoyo de guerra y poder de mando al costo de la estabilidad."
 SIA_national_rnd_network: "Construir los Parques de las Ciencias"
 SIA_national_rnd_network_desc: "Laboratorios públicos, asociaciones universitarias y un parque científico dedicado en Pathum Thani dan al Reino una columna vertebral de investigación propia. La Agencia Nacional de Desarrollo Científico y Tecnológico ancla una red de instalaciones R& que acelera la adopción tecnológica y eleva toda la economía hacia la industria de mayor valor."
 SIA_civilian_rnd_center: "Civilian R&D Center"
 SIA_civilian_rnd_center_desc: "Un centro dedicado de investigación civil y prototipado con laboratorios, bancos de pruebas y un grupo de ingenieros libres para perseguir lo que el Reino necesita después. Un cuarto centro de investigación para poner en contra del solitario patio naval que el Reino comenzó con, y la sala para desarrollar proyectos propios."
 SIA_air_rnd_center: "Aeronautics R&D Center"
 SIA_air_rnd_center_desc: "Una instalación aviónica y aeronáutica con túneles de viento, un rango de pruebas de vuelo instrumentado y los ingenieros para ejecutarlos. La industria tailandesa consigue el banco para prototipos sistemas de aviones en casa en lugar de comprarlos terminados desde el extranjero."
 SIA_army_rnd_center: "El centro de guerra terrestre R&D"
 SIA_army_rnd_center_desc: "Un terreno con pistas de ensayo de armaduras, rangos de armas y una oficina de diseño. El ejército puede desarrollar y prototipo sus propios vehículos y equipos en lugar de esperar a proveedores extranjeros y sus condiciones."
 SIA_gistda_space_agency: "Empower GISTDA"
 SIA_gistda_space_agency_desc: "The Geo-Infortics and Space Technology Development Agency is handed a real mandate and a real budget. Fundada para tener sentido de los datos satelitales, GISTDA se convierte en la institución espacial del Reino, ejecutando estaciones terrestres, entrenando ingenieros y dando una ventana a la investigación tailandesa sobre todo desde arriba. Un pequeño programa espacial ya no es un lujo extranjero sino una capacidad nacional."
 SIA_theos_earth_observation: "THEOS Observación de la Tierra"
 SIA_theos_earth_observation_desc: "El primer satélite de observación terrestre de Tailandia, THEOS, abre los propios ojos del Reino en órbita, mapeando la tierra, rastreando inundaciones y cultivos, y alimentando las imágenes de servicios de inteligencia que ningún vecino puede negarlos. El programa de seguimiento profundiza la experiencia de la agencia en la óptica, el enlace descendente y el procesamiento de imágenes, y convierte los pases crudos en un reconocimiento factible."
 SIA_space_krenovation_park: "Espacio Parque Krenovation"
 SIA_space_krenovation_park_desc: "Un parque industrial aeroespacial se eleva en el Seaboard oriental, con habitaciones limpias, salones de montaje y una cadena de suministro para componentes satelitales y pequeños vehículos de lanzamiento. Lo que comenzó como una agencia de investigación ahora ancla una industria aeroespacial nacional, dibujando en empresas privadas y dando a la ingeniería tailandesa un sector de alto valor para llamar a su propio."
 SIA_sovereign_launch_capability: "Soberana capacidad de lanzamiento"
 SIA_sovereign_launch_capability_desc: "El Reino resuelve cerrar la última brecha, la capacidad de diseñar, construir y orbitar sus propios satélites sin pedir permiso a nadie. Un programa indígena de lanzamiento y constelación satelital corona dos décadas de trabajo, poniendo a Tailandia entre los pocos estados con una posición soberana en el espacio y un alcance de inteligencia que no responde a nadie más."
 SIA_ptt_energy_champion: "PTT, Campeón Nacional de Energía"
 SIA_ptt_energy_champion_desc: "La preocupación energética estatal está flotada en la bolsa de valores y desencadenada como gigante comercial. Flush con capital de la OPI y un mandato de exploración del Golfo de Tailandia a Myanmar, PTT asegura el suministro de combustible del Reino y se convierte en su única corporación más grande."
 SIA_scg_industrial_titan: "Grupo Siam Cement"
 SIA_scg_industrial_titan_desc: "El mayor conglomerado industrial del Reino se expande de cemento a petroquímicos, materiales de construcción y embalaje. Los libros de pedidos de SCG subscriben el boom de la construcción y anclan una cadena de suministro nacional que ningún programa de infraestructura puede hacer sin ella, y sus recibos fiscales crecen con él incluso a medida que el grupo se apoya más en la burocracia que permite."
 SIA_packaging_empire: "El Imperio Empaquetado"
 SIA_packaging_empire_desc: "Las listas de brazo de embalaje de SCG en el Intercambio y va de compras por toda la región, plegándose en molinos desde Indonesia a Vietnam hasta que imprimen y moldes para la mitad del sudeste asiático. El lanzamiento es la economía circular: fibra reciclada, plásticos más ligeros, carbono inferior. El costo cae en las pequeñas impresoras y fabricantes de caja que compra o subvenciona."
 SIA_cp_agribusiness_giant: "Grupo Charoen Pokphand"
 SIA_cp_agribusiness_giant_desc: "Desde los molinos de alimentación hasta 7-Eleven, el conglomerado CP se convierte en el agribusiness y coloso minorista de Tailandia. La agricultura de contrato eleva los ingresos rurales y abastece a las estanterías, mientras que el músculo exportador del CP transporta alimentos tailandeses a cada mercado en Asia. La productividad agrícola comercial se eleva a través de la red de contratos, y un segundo distrito subió en el cinturón de arroz Isaan."
 SIA_buffer_states: "Cinturón de Estados Buffer"
 SIA_buffer_states_desc: "En lugar de tragarlos, Tailandia mantendrá a los Shan y Karen vivos y armados, una cobertura de amortiguadores amistosos que absorben la presión Burmese antes de llegar al Reino. Las líneas de suministro transfronterizas, los campos de entrenamiento y las garantías silenciosas convierten a los insurgentes fronterizos en un escudo."
 SIA_protectorate_doctrine: "Doctrina de Protectorado"
 SIA_protectorate_doctrine_desc: "El Estado Mayor se asienta en el instrumento más suave del imperio, no conquista sino vasallo. Los Estados fronterizos serán llevados bajo protección tailandesa como estados clientes, sus banners dejaron volando sobre capitales que responden a Bangkok."
 SIA_annexation_doctrine: "Anexo Doctrina"
 SIA_annexation_doctrine_desc: "No hay medias medidas. Las tierras fronterizas serán despejadas, su territorio incorporado al Reino y sus gobiernos separatistas se disolven. Bangkok pone sus reivindicaciones sobre las tierras de Shan y Karen y prepara al ejército para hacerlas cumplir."
 SIA_subdue_the_shan: "Sumérgete en Shan"
 SIA_subdue_the_shan_desc: "El Ejército Real de Tailandia se traslada al estado sur de Shan. Si termina como un protectorado tailandés o una provincia tailandesa depende de la doctrina elegida, pero de cualquier manera, el escrito de Bangkok correrá a los Salween."
 SIA_subdue_the_karen: "Sumérgete en la Karen"
 SIA_subdue_the_karen_desc: "Las fuerzas tailandesas cruzan las colinas Karen. Las décadas de refugio y patrocinio silencioso terminan, y el Reino viene ahora como un maestro, a títere o a anexo como dicta la política."
 SIA_burma_breakaway_question: "Los Estados desintegrados"
 SIA_burma_breakaway_question_desc: "Al otro lado del Salween, la escritura de Birmania se ha colapsado en un parche de establos armados, el Shan, el Karen, el Wa. Son débiles, divididas y cuadradas al alcance de Tailandia. Bangkok debe decidir lo que estas tierras desintegradas son para el Reino. Un escudo, un premio o un problema para ser manejado."
 SIA_subdue_the_wa: "Subdue el Wa"
 SIA_subdue_the_wa_desc: "El Ejército Estatal de Wa Unida dirige los ejércitos más formidables, y la mayoría de los narcóticos empapados, de los ejércitos que escapan. Llevar las colinas de Wa a talón significa una lucha dura, pero cierra un oleoducto de drogas en la puerta del Reino y planta la bandera tailandesa profundamente en las tierras fronterizas de Burmese."
 SIA_rta_looks_abroad: "Sexagésimo año de M48s"
 SIA_rta_looks_abroad_desc: "El Ejército Real de Tailandia todavía tiene tanques y transportistas de otro siglo. El reequipamiento ya no es una cuestión de si, sino de cuyos rollos de acero a través de las puertas en Korat, y qué cadenas vienen soldadas a él. Una nueva línea de producción se destaca donde sea que la capacidad lo permita."
 SIA_stryker_brigades: "Ruedas del Oeste"
 SIA_stryker_brigades_desc: "Brigadas Stryker, doctrina americana y una cadena logística que se conecta directamente al ejército más capaz del mundo. El kit es excelente y la interoperabilidad sin precio, pero cada ronda se paga en dólares y en deferencia a Washington."
 SIA_eda_blackhawks: "Mano-Me-Downs de una Superpotencia"
 SIA_eda_blackhawks_desc: "A través de Excess Defense Articles and Foreign Military Sales, refurbished Black Hawks y Cobras llegan a una fracción del precio de lista. Los marcos aéreos han volado antes, pero el alcance de la compañía aérea en un presupuesto es una ganga que la alianza hace posible."
 SIA_vn1_mechanization: "Un APC para cada Platoon"
 SIA_vn1_mechanization_desc: "VN1 y VN16 transportistas fuera de la línea china, por los cientos, para lo que un puñado de vehículos occidentales costaría. Los paseos de infantería por fin, y las fábricas que los construyen se pagan antes de que el año salga."
 SIA_norinco_fires: "El catálogo completo NORINCO"
 SIA_norinco_fires_desc: "SH1 auitzers, SR5 artillería de cohetes, todo el catálogo a todo el precio del paquete. El poder de fuego es real, pero también son las colas de repuesto y las transmisiones que fallan en el campo. El acero barato mantiene a un intendente despierto por la noche."
 SIA_tavor_standard: "Un Rifle de Nuestro Propio"
 SIA_tavor_standard_desc: "La producción autorizada de Tavor convierte las fábricas tailandesas en la fuente del rifle estándar del Ejército. Sin embargo, sin lista de espera, sin veto extranjero sobre quién armamos, sólo el primer ladrillo de un arsenal que responde solo a Bangkok."
 SIA_oplot_and_rotors: "Diplomacia bazara"
 SIA_oplot_and_rotors_desc: "Hulls ucraniano Oplot, rotores rusos Mi-17, todo lo que el mercado ofrece a un comprador que no elige ningún lado. La capacidad fluye de todas partes a la vez, e irrita a Washington y Beijing en medida igual y manejable."
 SIA_dti_black_widow: "Negro viuda araña"
 SIA_dti_black_widow_desc: "El propio 8x8 del Instituto Tecnológico de Defensa, junto con la primera victoria probada por Chaiseri. Thai-designed, Thai-construction, and good enough that others want to buy them. El arsenal ha comenzado a pagar por sí mismo."
 SIA_first_army_modernized: "El nuevo ejército tailandés"
 SIA_first_army_modernized_desc: "Sea cual sea el camino que tomó el reequipamiento, el resultado permanece en el terreno del desfile por fin. Un moderno ejército tailandés, re-enfriado, reentrenado y listo para el siglo en que realmente tiene que luchar."
 SIA_gripen_globaleye: "Ojos del cielo entero"
 SIA_gripen_globaleye_desc: "El GlobalEye AEW&C de Saab convierte un puñado de Gripens en una fuerza en red que ve primero y dispara primero. El radar aéreo es el multiplicador que hace un pequeño golpe de fuerza aérea por encima de sus números."
 SIA_j10_squadrons: "Dragones sobre Don Mueang"
 SIA_j10_squadrons_desc: "J-10CE luchadores multirole, por el escuadrón, a un precio que Washington nunca podría coincidir, y que Washington nunca perdonará. Elegir Chengdu sobre Fort Worth re-wires los cielos del Reino, y sus alianzas."
 SIA_hq9_air_defense: "Techo de Misiles"
 SIA_hq9_air_defense_desc: "Las baterías de superficie a aire HQ-9 y FK-3 dibujan un paraguas sobre la Placa Central. Barato, denso e integrado. Zona negando el camino chino."
 SIA_wing_loong_uav: "Cazadores de pacientes"
 SIA_wing_loong_uav_desc: "Wing Loong y CH-series drones loiter por un día y huelga al mando. Un reconocimiento masivo y una huelga de precisión no tripulada, compraron por el costo de un escuadrón solo tripulado."
 SIA_f5th_super_tigris: "Nuevos trucos para un viejo tigre"
 SIA_f5th_super_tigris_desc: "Los aviónicos israelíes, un radar AESA y los misiles Python-5 convierten al venerable F-5 en el F-5TH 'Super Tigris'. No es un nuevo jet, pero la energía de combate se exprimió de los marcos aéreos ya pagados, no debido nada a ninguna superpotencia."
 SIA_dti_uav_command: "Ojos Soberanos"
 SIA_dti_uav_command_desc: "Un ala de drones del Instituto de Tecnología de la Defensa, diseñado y fluído en el país, le da a Tailandia su propia imagen de reconocimiento, y un producto para vender a los vecinos"
 SIA_air_dominance_doctrine: "Maestros del cielo tailandés"
 SIA_air_dominance_doctrine_desc: "Sin embargo estaba equipado, la Real Fuerza Aérea de Tailandia termina como una fuerza moderna, en red, multirole, maestro del espacio aéreo que se jura defender."
 SIA_korean_frigates: "El estándar Bhumibol"
 SIA_korean_frigates_desc: "La opción occidental para la flota. Una moderna fragata DW3000 de Corea, con sistemas de combate occidentales, defensa aérea y el combatiente superficial más capaz que la flota haya navegado. La calidad tiene un precio, y Seúl lo llama en dólares."
 SIA_chinese_engine_compromise: "Un corazón chino"
 SIA_chinese_engine_compromise_desc: "Los motores alemanes nunca llegarán, y el barco ha esperado una década. Acepta la planta de energía CHD620 china y el submarino finalmente navega, barata, soberanamente, y con un período de dentadura los ingenieros pasarán un año curando."
 SIA_type071_flotilla: "Cascos de Hudong"
 SIA_type071_flotilla_desc: "Un muelle tipo 071E de la plataforma de aterrizaje y un embrague de buques de patrulla construidos en China dan a la flota un brazo anfibio durante la noche, por lo que un solo casco occidental costaría."
 SIA_krabi_class_opv: "Nuestros propios Keels"
 SIA_krabi_class_opv_desc: "La elección independiente para la flota. El buque de patrulla offshore de clase Krabi, construido en Bangkok Dock, pone la quilla de una industria naval soberana. Despacio para madurar, pero no responde a ningún patio extranjero."
 SIA_european_propulsion: "Corazóns con licencia, Hulls tailandeses"
 SIA_european_propulsion_desc: "Una compra, no una asociación. Comprar diesel MTU y sistemas de combate bajo licencia, una vez, luego despojarlos a los pernos y construir el resto en casa. Conocimiento importado, absorbido en un programa soberano que no debe nada patronal."
 SIA_naval_self_reliance: "Fragatas de Bangkok Dock"
 SIA_naval_self_reliance_desc: "Los patios tailandeseses ahora establecen naves de guerra de su propio diseño, con una base naval de defensa industrial que compone y exporta. La flota, por fin, está construida en casa."
 SIA_command_of_the_seas: "Dos Golfos, una Flota"
 SIA_command_of_the_seas_desc: "Sin embargo se construyó, la Marina Real tailandesa es una verdadera fuerza de agua azul, capaz de mantener el Golfo y llegar al Andamán, al mando de los mares que lavan dos costas del Reino."
 SIA_the_western_anchor: "El ancla de Washington en Asia"
 SIA_the_western_anchor_desc: "El ejército, el aire y el mar compraron Occidente, y la alianza se convierte en piedra angular de la defensa nacional. Interoperabilidad, intercambio de inteligencia y la implícita garantía americana, a cambio de un lugar firmemente dentro de la órbita de Washington."
 SIA_the_bamboo_bloc: "En la sombra del dragón"
 SIA_the_bamboo_bloc_desc: "Tres servicios elaborados por Beijing hacen que el cliente de armas más importante de Tailandia China en la región. Masa barata, una imagen compartida de C4ISR, y un poderoso patrono, todo al precio de la confianza de Occidente."
 SIA_strategic_autonomy: "He aquí a nadie"
 SIA_strategic_autonomy_desc: "Una fuerza construida, cada vez más, en casa y vendida en el extranjero. El Instituto de Tecnología de la Defensa se convierte en una casa regional de armas, y el Reino no responde a ningún capital extranjero por los medios de su propia defensa."
 SIA_the_bamboo_doctrine: "Bend con el viento"
 SIA_the_bamboo_doctrine_desc: "jets suecos, tanques chinos, un sub de Beijing y una fragata de Seúl. Tailandia compra de todos y no pertenece a nadie. La caña que se dobla en la tormenta lo sobrevive. La estrategia tailandesa más antigua, hizo carne en el orden de batalla."
 SIA_dual_use_threshold: "El Umbral de Uso dual"
 SIA_dual_use_threshold_desc: "Cada programa de poder civil lleva la misma maquinaria que un programa de armas necesita. Domina tranquilamente el ciclo del combustible, con enriquecimiento de uranio bajo la cubierta de independencia energética, y el Reino mantiene abierta toda opción sin declararla aún."
 SIA_minimum_deterrent: "Un mínimo disuasivo"
 SIA_minimum_deterrent_desc: "Un puñado de ojivas, no más, suficiente para que ningún vecino y ningún gran poder vuelva a tomar el Reino por sentado. Tailandia se une al club nuclear en sus propios términos, y el gabinete debe decidir ahora en voz alta para lo que dirá que son sus bombas."
 SIA_the_democrats_endure: "Los Demócratas Endure"
 SIA_the_democrats_endure_desc: "El Partido Demócrata, el más antiguo del Reino, mantiene su dominio sobre el gobierno en lugar de ceder a la marea populista. Sin deslizamiento, sin multimillonario carismático, sólo el asunto paciente e ingrato de gobernar como una amplia coalición civil. El partido apuesta por su futuro en las instituciones, no en un solo líder."
 SIA_chuan_clean_government: "Gobierno limpio"
 SIA_chuan_clean_government_desc: "Mr. Limpio toma el timón. Una reputación de incorruptibilidad personal se convierte en la marca del partido, con presupuestos abiertos, ministerios profesionales y una guerra en el sobre marrón. No será llamativo, pero construye la máquina que convierte la gobernanza honesta en una circunscripción duradera."
 SIA_rule_of_law: "El Estado de derecho"
 SIA_rule_of_law_desc: "Un gobierno que vive por la constitución que juró defender. El debido proceso, la administración predecible y los tribunales que responden a la ley en lugar de los cuarteles. Cada golpe comienza suspendiendo el libro de reglas, por lo que el Reino aprende a mantenerlo."
 SIA_judicial_independence: "Un banco independiente"
 SIA_judicial_independence_desc: "Aisla al poder judicial tanto de la red del palacio como de los generales. Un banco que no puede apoyarse es el freno más fuerte en el ciclo de disolución y golpe de Estado, y el arma favorita del establecimiento, activismo judicial, se desmorona en la fuente."
 SIA_strengthen_parliament: "Fortalecimiento del Parlamento"
 SIA_strengthen_parliament_desc: "Dar a la sala elegida el personal, los comités y la posición para gobernar realmente. Una legislatura de trabajo permite que el partido gobierne por votos en lugar de por decreto de emergencia, y da al público una participación en los resultados de cada período de sesiones."
 SIA_liberal_market_stewardship: "Administración del mercado liberal"
 SIA_liberal_market_stewardship_desc: "Dinero de sonido, comercio abierto y un estado que regula en lugar de gastar. Los demócratas ofrecen el contrapeso tecnocrático a la Thaksinomics, con crecimiento impulsado por las finanzas, exportaciones y empresa privada en lugar de por los repartidores rurales."
 SIA_southern_stronghold: "El Fuerte Sur"
 SIA_southern_stronghold_desc: "El corazón de la fiesta es el Sur y el Sur tiene quejas. Respóndelos con carreteras, escuelas y clínicas en lugar de puestos de control, financiados con cargo al tesorería en vez de prometidos en papel. Paz a través del desarrollo que mantiene la base leal y drena la insurgencia de reclutas."
 SIA_coalition_government: "El gobierno de Coalition"
 SIA_coalition_government_desc: "El poder ensamblaba el camino duro a través de un parcheo de socios, bloques regionales y partes menores cosidos en una mayoría de trabajo. Es lento y comprometido, sin embargo es la única forma de gobierno que los tanques encuentran más difícil justificar el rodaje en contra. El orden elegido sobrevive compartiendo el poder."
 SIA_mature_democracy: "Una democracia madura"
 SIA_mature_democracy_desc: "El Reino cruza el umbral hacia la transformación pacífica con una oposición leal y el público puede tratar los golpes como historia. Las instituciones importan más que cualquier campaña: administración limpia y autoridad duradera, comprado con una escalada más lenta en las encuestas que una coalición más amplia podría comprar."
 SIA_grand_coalition: "La Gran Coalición"
 SIA_grand_coalition_desc: "En lugar de luchar contra el viejo orden, absorberlo. Los demócratas se convierten en el rostro elegido del establecimiento conservador, ganando sobre los terratenientes y negocios como palacio, burocracia y sala de juntas gobiernan a través de la urna en lugar de los barracones. Estabilidad comprada por consenso, al precio de alimentar las mismas redes patronales que el partido una vez corrió en contra."
 SIA_coalition_overhead: "Coalición Overhead"
 SIA_coalition_overhead_desc: "Cada compañero que entra en la gran tienda quiere un corte. Mantener la coalición juntos cuesta más capital político que gobernar solo nunca."
 SIA_democrat_revival: "Los demócratas regresan"
 SIA_democrat_revival_desc: "Desde el desierto de la oposición, el partido garra su camino de regreso a la premiership a través del bazar de coalición post-2019. Los demócratas están gobernando de nuevo, mayores, castigados y decididos esta vez para hacer que el orden civil se adhiera."
 SIA_answer_thaksinomics: "Respuesta Thaksinomics"
 SIA_answer_thaksinomics_desc: "El genio de Thaksin era para reunir aldeas porque Bangkok nunca lo hizo. No hagas ruido en el fondo de la aldea. Construye uno mejor. Un programa demócrata de crédito rural, una moratoria de la deuda de los agricultores y una atención médica barata, lanzado antes de que Thai Rak Thai pueda, rompe el campo populista en su fuente en lugar de conceder al campo y ganar poder sólo a través de las cortes.\n\n§GLa marea populista retrocede.§!"
 SIA_pracha_wiwat: "La agenda popular"
 SIA_pracha_wiwat_desc: "Pracha Wiwat es nueve medidas reveladas como regalos de Año Nuevo. Electricidad gratuita para los hogares más pobres, subsidio de cocina, bienestar y registro para los conductores de moto-taxi y vendedores ambulantes de la economía informal, y una opción de ahorro para los trabajadores fuera del sistema. Prueba de que un partido liberal-conservador puede responder querer sin romper el tesoro.\n\n§GLa marea populista retrocede.§!"
 SIA_contest_every_election: "Concurso cada elección"
 SIA_contest_every_election_desc: "Cualquiera que sea la provocación, ya sea una encuesta arrugada, una amnistía para un fugitivo o una corte apilada, el partido permanece en el juego democrático. Concurre en todas las elecciones y acepta cada resultado. Es la disciplina que el partido abandonó en 2006 y 2014, y niega a los populistas el único cargo que se ha quedado realmente atrapado, que los demócratas sólo ganan cuando soldados y jueces ganan por ellos.\n\n§GLa marea populista retrocede§! y la puerta a las calles está cerrada para siempre."
 SIA_the_street_over_the_ballot: "La calle sobre el Ballot"
 SIA_the_street_over_the_ballot_desc: "Basta de perder en la urna. Renunciar los asientos del partido y tomar el movimiento en las calles. Las protestas cierran la capital y hacen que el país sea ingobernable hasta que caiga el gobierno elegido. Funciona y la capital está en caos. Los generales toman el pretexto que les dieron, los tanques rodan y un partido que una vez defendió el gobierno civil limpio es recordado como la partera de un golpe.\n\n§REl Reino pasa al dominio militar. El camino demócrata termina aquí, y el nuevo orden tiene su propio tronco.§!"
 SIA_break_into_isan: "Entrar en el noreste"
 SIA_break_into_isan_desc: "El ajuste estructural que el partido nunca hizo. Para una generación, los demócratas poseían el Sur y Bangkok y cedieron por defecto al inmenso y pobre noreste a Thaksin. Pase una década allí en su lugar. Construir las ramas, dirigir los candidatos, hacer una oferta redistributiva creíble a Isan en sus propios términos. Gana incluso una posición en el corazón populista y la marea pierde su arenque. Es el camino más difícil al poder duradero, y el único que no depende de los tribunales.\n\n§GDe ahora en adelante la marea populista sube mucho más lentamente.§!"
 SIA_board_of_investment: "Empoderar a la Junta de Inversiones"
 SIA_board_of_investment_desc: "La Junta de Inversiones siempre ha sido el motor silencioso de Tailandia, cortejando capitales extranjeros y dirigiendo empresas tailandesas en el extranjero. Dale dientes reales y un presupuesto real. La inversión es más barata y más rápida, y cada baht Bangkok lugares de ultramar vuelve más fuerte."
 SIA_regional_trade_network: "Red de comercio regional"
 SIA_regional_trade_network_desc: "Convertir una dispersión de acuerdos bilaterales en una auténtica red de acuerdos de libre comercio en toda la ASEAN y más allá. Cada acuerdo que Tailandia firma ahora paga un dividendo arancelario en el tesoro y amplía el alcance del poder blando tailandés en el extranjero."
 SIA_mekong_soft_power: "Poder suave Mekong"
 SIA_mekong_soft_power_desc: "Bangkok se encuentra en la cabeza del Mekong, y el río pasa por Laos, Camboya y Myanmar. El comercio, la ayuda y la inversión se convierten en los instrumentos de un liderazgo silencioso sobre el vecindario. Tailandia puede presionar su ventaja en el extranjero ahora, no sólo proteger la suya propia."
 SIA_regional_trade_network_tt: "Cada acuerdo comercial firmado ahora paga un dividendo mensual de tesorería y añade al alcance de la influencia extranjera de Tailandia, ambos cubiertos."
 SIA_trade_dividend_tt: "Tailandia financia su dividendo mensual de su red de acuerdos comerciales."
 SIA_trade_diplomacy_network: "Diplomacia comercial"
 SIA_trade_diplomacy_network_tt: "El alcance de la influencia extranjera crece con el número de acuerdos comerciales firmados, hasta un límite."
 SIA_crisis_modifier: "Legado de la crisis de 1997"
 SIA_crisis_modifier_desc: "La crisis de Tom Yum Kung rompió la economía milagrosa durante la noche: el baht en caída libre, los bancos enterrados en préstamos malos, el FMI en la puerta. Cada paso de la recuperación cierra parte de la herida. El Reino aprende del pasado y emerge más resiliente que antes."
 SIA_economy_modifier: "Economía tailandesa"
 SIA_economy_modifier_desc: "El libro mayor de los programas económicos del reino desde la base de exportación y el EEC hasta los campeones nacionales y el empuje digital. Cada reforma y boom deja su marca aquí."
 SIA_military_modifier: "Fuerzas armadas tailandesas reales"
 SIA_military_modifier_desc: "El estado de los soldados, marineros y aviadores del reino: adquisición, doctrina, entrenamiento y la industria de defensa detrás de ellos. Los programas de modernización se acumulan aquí."
 SIA_politics_modifier: "Cuerpo Político"
 SIA_politics_modifier_desc: "Los huesos institucionales de la gobernanza tailandesa: tribunales, parlamentos, burocracia y asentamientos que mantienen juntos la política del reino. Las reformas y reacciones por igual dejan su marca."
 SIA_armed_forces_state: "La Guardia Vieja"
 SIA_armed_forces_state_desc: "Un general para cada dos cientos de soldados, y el verdadero recuento se mantuvo del parlamento. La promoción se ejecuta en la lista anual de reanimación, en la clase pre-cadeta y la facción unitaria, antes de que se ejecute alguna vez sobre el mérito. El cuerpo oficial posee un canal de televisión, campos de golf, tierras y esquemas de bienestar que los soldados trabajan como mano de obra no remunerada. Lectura y entrenamiento pagan por todo esto, y la factura salarial sólo crece."
 SIA_clean_the_banks: "Limpiar los bancos"
 SIA_clean_the_banks_desc: "Las cincuenta y seis empresas financieras cerradas están terminadas por la Autoridad de Reestructuración del Sector Financiero, y la Corporación de Gestión de Activos de Tailandia saca los malos préstamos de los libros. Con balances limpios los bancos prestan de nuevo y las grúas regresan al horizonte."
 SIA_dual_track_recovery: "Demanda nacional reinante"
 SIA_dual_track_recovery_desc: "Con la deuda despejada, gire la recuperación hacia adentro. Crédito barato, programas de gasto rural y apoyo a la pequeña empresa pusieron dinero en las manos que lo gastan más rápido. El crecimiento vuelve rápidamente y corre caliente, y las facturas y los favores adeudados se acumulan tan rápido."
 SIA_sufficiency_path: "Un recubrimiento resistente"
 SIA_sufficiency_path_desc: "Elige la estabilidad a través de la velocidad. La agricultura diversificada, los préstamos moderados y las economías locales autosuficientes reconstruir una base más tranquila que puede salir del próximo choque. El boom nunca ruge, pero la limpieza también llega a la gobernanza."
 SIA_frontier_integration: "Integrar la Frontera"
 SIA_frontier_integration_desc: "Las campañas se ganan y los soldados tailandeses mantienen la meseta Shan, las colinas Karen y las tierras altas de Wa. Ganar terreno y gobernarlo son tareas diferentes. Se levanta una administración para las marchas recuperadas, sembramos los primeros caminos y guarnición, y comenzamos el lento trabajo de convertir a la gente conquistada en ciudadanos. Las Tierras Recubiertas ahora pueden ser pacificadas, desarrolladas y en el tiempo reclamadas para el Reino de manera directa."
 SIA_the_new_order: "El Nuevo Orden en el Sur"
 SIA_the_new_order_desc: "Las afirmaciones están en juego desde Manila hasta el Estrecho de Malaca, y donde nuestros ejércitos han marchado las viejas banderas están abajo. Una hegemonía declarada no es una hegemonía que sostiene. Construimos la maquinaria de imperio, gobernadores y guarniciones y oficinas de reconstrucción, para que las provincias incautadas sean administradas en lugar de simplemente ocupadas. Las Tierras Recubiertas ahora pueden ser pacificadas, desarrolladas y dobladas permanentemente en un Gran Tailandia."
 SIA_industrial_estates: "Las fincas industriales"
 SIA_industrial_estates_desc: "Amata, Hemaraj y Rojana construyen fincas industriales privadas a través de la costa este y corte directamente las fábricas japonesas y occidentales. Tailandia se convierte en el taller que acoge el boom de la exportación, con tierra y energía listo esperando a cualquier fabricante que llegue."
 SIA_hard_disk_of_the_world: "El disco duro del mundo"
 SIA_hard_disk_of_the_world_desc: "Seagate, Western Digital y proveedores locales como Delta y Hana convierten a Tailandia en el ensamblador de disco duro más grande del mundo y un exportador electrónico superior. Es el gigante silencioso detrás de las postales turísticas, enviando silenciosamente una cuarta parte de las unidades del planeta."
 SIA_thai_union_seafood: "Reyes de la Can"
 SIA_thai_union_seafood_desc: "Unión tailandesa compra pollo del mar y se convierte en el mayor atún del mundo, mientras que los procesadores Samut Sakhon convierten las aguas tailandesas y mano de obra barata en un imperio mundial de mariscos. Los camarones congelados y los peces enlatados fluyen hacia los estantes de supermercados a través del mundo, y el puerto pesquero de Samut Sakhon obtiene una base naval para igualar su nueva importancia."
 SIA_retail_kings: "Los Reyes de Minorista"
 SIA_retail_kings_desc: "El grupo central de la familia Chirathivat, Big C, y los hipermercados reconstruyen la economía nacional alrededor de centros comerciales y tiendas modernas. CentralWorld se abre en 2006 y una creciente clase media consumidor comienza a gastar en lugar de solo exportar."
 SIA_beverage_empire: "La Brewer de Bangkok"
 SIA_beverage_empire_desc: "Charoen Sirivadhanabhakdi's ThaiBev, fabricante de cerveza Chang y SangSom, crece en una bebida regional y titán de propiedad. Bloqueado de la lista en Bangkok por las protestas budistas anti-alcohol, levanta su capital en Singapur y derrama el producto de vuelta a casa. La caída del impuesto corporativo es real, y también la reacción de temperancia que provoca."
 SIA_fta_decade: "Decenio del TLC"
 SIA_fta_decade_desc: "Una ola de acuerdos comerciales bilaterales enchufa la máquina de exportación a la región. El acuerdo de Australia en 2005, la asociación del Japón en 2007, y la cosecha temprana de China sobre bienes agrícolas, todos los aranceles claros. Es un trabajo verdaderamente multigobierno, firmado por rivales que están de acuerdo en poco más."
 SIA_sugar_and_ethanol: "Los Barones de Azúcar"
 SIA_sugar_and_ethanol_desc: "Mitr Phol y el Thai Roong Ruang Group cultivan la cintura de caña en la tierra del azúcar de Asia y convierten el azúcar y la mandioca en exportaciones y en etanol para el programa gasohol. La agricultura finalmente diversifica más allá del arroz, y el biocombustible se alimenta directamente al suministro nacional de combustible."
 SIA_gems_and_gold: "Gemas y oro"
 SIA_gems_and_gold_desc: "Los cortadores de Chanthaburi y el comercio de joyería de Bangkok hacen de Tailandia la capital mundial del corte de piedras preciosas de colores y la exportación de gemas. Es una industria peculiar, de alto nivel y de baja huella que gana moneda dura fuera de la habilidad en lugar de escala, y el libro mayor de exportación crece con cada piedra que sale del país."
 SIA_map_ta_phut: "Mapa Ta Phut"
 SIA_map_ta_phut_desc: "PTT y SCG construyen su imperio petroquímico aguas abajo en Rayong, y los establos de humo del mapa Ta Phut se convierten en el corazón pesado de la costa oriental. Los booms de la industria a medida que las comunidades al lado de las plantas pagan el precio en aire contaminado y agua, y el puerto que sirve al complejo añade capacidad para mantenerse al día."
 SIA_ignite_thailand: "IGNITE Thailand"
 SIA_ignite_thailand_desc: "El gobierno adopta la Estrategia Nacional de veinte años y la visión del centro IGNITE, nombrando la trampa de ingresos medianos como enemigo por fin. Tailandia creció lo suficientemente rico como para detenerse. Los salarios pasaron por el piso barato de la fábrica pero nunca llegaron a la frontera de innovación, y Vietnam se está cerrando rápidamente."
 SIA_digital_kingdom: "El Reino Digital"
 SIA_digital_kingdom_desc: "Tailandia se presenta como el centro digital de la ASEAN, y los hiperescaladores comienzan a notar. La fibra, la política de nube y una población joven en línea convierten al país en un candidato serio para el tráfico de datos de la región."
 SIA_data_center_hub: "El Cloud Rush"
 SIA_data_center_hub_desc: "Amazon, Google, Microsoft y TikTok vierten miles de millones en centros de datos en Chonburi y Rayong. Los servidores llegan más rápido que la energía y el agua para ejecutarlos, y la cuadrícula comienza a colarse bajo la carga."
 SIA_virtual_banks: "PromptPay y los bancos virtuales"
 SIA_virtual_banks_desc: "PromptPay hace a Tailandia casi sin efectivo, con noventa millones de registros moviendo decenas de millones de transferencias al día. El banco central licencia bancos digitales, y el dinero que una vez desapareció en efectivo ahora deja un rastro que el taxista puede leer."
 SIA_bcg_economy: "Bio-Circular-Green"
 SIA_bcg_economy_desc: "El modelo biocircular-verde convierte la biodiversidad y la base agrícola de Tailandia en bioindustria de alto valor. Los biocombustibles, los bioquímicos y los alimentos funcionales comienzan a sustituir los cultivos de productos básicos de bajo nivel que mantienen al campo pobre."
 SIA_future_food: "Cocina del Mundo 2.0"
 SIA_future_food_desc: "CP Los alimentos y los gigantes alimentarios aumentan la cadena de valor en alimentos funcionales y proteínas alternativas. Tailandia deja de vender calorías crudas y comienza a vender la ciencia que entra en ellas."
 SIA_durian_road: "La carretera de Durian"
 SIA_durian_road_desc: "Las exportaciones de frutas Durianas y Tropicales a China superan los seis mil millones de dólares al año. Los camiones de cadena fría dirigen la cosecha al norte por Laos mientras Vietnam y Malasia luchan por los mismos estantes en Guangzhou."
 SIA_capital_of_capital: "Capital"
 SIA_capital_of_capital_desc: "La Bolsa de Valores de Tailandia se profundiza, el fondo Vayupak crece, y conglomerados como el pivote del Golfo de la energía en digital y financiero. Bangkok comienza a actuar como un centro financiero regional en lugar de un capital del lugar que simplemente pasa."
 SIA_make_thailand_investor: "A Exportador de Capital"
 SIA_make_thailand_investor_desc: "Tailandia se gradúa de tomar dinero extranjero para enviar su propio extranjero. Central compra en Europa, las granjas del CP en todo el mundo y ThaiBev posee el propio gigante de bebidas de Singapur. La nación receptora se ha convertido en una nación inversionista."
 SIA_escape_the_trap: "Un Reino de Altos Ingresos"
 SIA_escape_the_trap_desc: "La Estrategia Nacional paga y Tailandia cruza la línea en alto nivel de ingresos. La trampa que lo mantuvo por debajo de la frontera para una generación finalmente está detrás de ella, y el taller se ha convertido en un reino rico en su propio derecho."
 SIA_fta_decade_tt: "Arma la red de diplomacia comercial y firma los acuerdos de libre comercio de la década."
 SIA_escape_trap_two_sectors_tt: "Requiere dos de los tres capstones del sector. Centros de datos, comida futura o la nación inversionista."
 SIA_data_center_grid_strain_tt: "El hiperescalor de la construcción de la cuadrícula. Invierte en la rama de poder para mantener las luces encendidos."
 SIA_sufficiency_and_the_crown: "Suficiencia y la Corona"
 SIA_sufficiency_and_the_crown_desc: "La filosofía de Economía Suficiencia del Rey Bhumibol, nacida de las cenizas de la crisis de Tom Yum Kung, se convierte en un principio nacional rector. Moderación, autoinmunidad y razonabilidad antes del crecimiento imprudente. El palacio y el ministerio de planificación hablan con una sola voz, y un pueblo que vive dentro de sus medios pide menos del estado viene el próximo shock."
 SIA_sufficiency_gov_gate_tt: "§Y[Communist-State_L]§! o §Y[socialism_L]§! no es el partido gobernante."
 SIA_new_theory_agriculture: "La nueva teoría"
 SIA_new_theory_agriculture_desc: "La Nueva Teoría del Rey divide la parcela del agricultor en arroz, huerto, estanque y lugar de residencia, una tenencia redondeada que alimenta a la familia antes de alimentar el mercado. El cinturón de arroz de Isaan ocupa el distrito modelo por distrito, negociando un pequeño volumen de exportación para un agricultor que nunca muere de hambre en un mal año."
 SIA_doi_tung_highlands: "El modelo Doi Tung"
 SIA_doi_tung_highlands_desc: "En las colinas sobre Chiang Rai, el proyecto de la Princesa Madre saca la adormidera del opio del suelo y pone café, macadamia y artesanía en su lugar. La vieja cosecha de dinero del Triángulo Dorado da paso a una economía de alta tierra que atrae a los visitantes en lugar de agentes narcóticos, un valle a la vez."
 SIA_chaipattana_water: "El Aerador de Chaipattana"
 SIA_chaipattana_water_desc: "El propio aerador patentado del Rey, un volante barato que cualquier estanque de pueblo puede permitirse, se extiende por la cuenca Chao Phraya para limpiar agua obstruida por algas y desechos. Es la invención como servicio real, y los remos de Isaan y el sur drenan un poco mejor para él."
 SIA_crown_property_portfolio: "La oficina de la propiedad corona"
 SIA_crown_property_portfolio_desc: "Las posesiones del Buró desde la tierra bajo las torres de Siam Commercial Bank hasta el stock en Siam Cement Group, hacen que la Corona sea uno de los propietarios y accionistas más grandes del reino. Gestionado como un conglomerado e impuesto como uno también, que silenciosamente supera a la mitad de los ministerios a los que responde."
 SIA_deepen_sufficiency: "El Reino Autónomo"
 SIA_deepen_sufficiency_desc: "La suficiencia deja de ser una red de seguridad rural y se convierte en toda la estrategia. Las cadenas locales de suministro, un consumo modesto y una cautela del capital extranjero se endurecen en la doctrina. El autarquía compra resistencia al choque, pero los banqueros y los conglomerados ven sus objetivos de crecimiento deslizarse y no están satisfechos."
 SIA_pragmatic_balance: "El Camino Medio"
 SIA_pragmatic_balance_desc: "La suficiencia no necesita un aislamiento. Las pequeñas y medianas empresas mantienen el comercio exterior, mientras que el principio de suficiencia sólo templa los excesos, una síntesis moderada en lugar de un retiro. El techo es más bajo que la autosuficiencia completa, pero también el riesgo de necesitarlo."
 SIA_resilient_kingdom: "El Reino Resiliente"
 SIA_resilient_kingdom_desc: "Corona y campo, palacio y campo de remo, se tejen en un único modelo de resistencia. Cualquiera que sea la próxima crisis, ya sea el contagio de divisas, pandemia o shock de suministro, el reino que vive dentro de sus medios es el que aún está en pie cuando pasa."
 SIA_sufficiency_resilience: "Economía de suficiencia"
 SIA_sufficiency_resilience_desc: "Moderación, autoinmunidad y resiliencia local, sembrada en toda la economía rural por iniciativa de la Corona."
 SIA_sufficiency_resilience_2: "Economía de Suficiencia Profundada"
 SIA_sufficiency_resilience_2_desc: "La autosuficiencia se endureció de la red de seguridad en la doctrina, negociando un mayor crecimiento para una mayor resistencia a los choques."
 SIA_resilient_kingdom_idea: "El Reino Resiliente"
 SIA_resilient_kingdom_idea_desc: "El patronato heredero y la economía de suficiencia se fusionaron en un buffer nacional duradero contra el próximo choque."
 SIA_tourism_masterplan: "A Plan maestro de turismo"
 SIA_tourism_masterplan_desc: "El turismo ya impulsa la economía, pero se desarrolla en la improvisación: resorts construidos antes de una buena infraestructura, hoteles por delante de la mano de obra educada. Un plan maestro nacional establece objetivos regionales, conecta los ministerios juntos y trata la hospitalidad como un sector industrial como cualquier otro."
 SIA_phuket_andaman: "Perla de los Andaman"
 SIA_phuket_andaman_desc: "Phuket ya atrae al mundo a sus playas, y un nuevo ala del aeropuerto y mejores carreteras permiten que la isla absorba mucho más de ellos. A Andaman se le pide que lleve una parte creciente de los ingresos extranjeros del país, y que muchos más extraños vuelvan a formar la costa en la que llegan."
 SIA_pattaya_eastern_riviera: "La Riviera Oriental"
 SIA_pattaya_eastern_riviera_desc: "Los hoteles de Pattaya y la vida nocturna corren principalmente con mano de obra barata e informal. Formalizar la economía de oficina y servicio a lo largo de la costa este, y cada trabajador tirado sobre los libros espera que el estado de bienestar realmente entregar."
 SIA_chiang_mai_lanna: "Rosa del norte"
 SIA_chiang_mai_lanna_desc: "Temples, Hill country y un ritmo más lento ya tiran mochileros y nómadas digitales al norte. Construir la infraestructura turística de Chiang Mai y las multitudes siguen, junto con alquileres que precio fuera de los barrios que los visitantes vinieron a ver."
 SIA_rebuild_the_andaman: "Después de la ola"
 SIA_rebuild_the_andaman_desc: "El tsunami del Día de Boxeo atravesó la costa de Andaman y los atajos que se tomaron en el espectáculo de recuperación. Una reconstrucción debidamente financiada termina el trabajo que la respuesta de emergencia no pudo, y cierra la cuenta sobre el desastre para siempre."
 SIA_medical_wellness_hub: "Scalpel of Asia"
 SIA_medical_wellness_hub_desc: "Los hospitales privados de clase mundial ya tratan a pacientes procedentes de toda la región. Ampliar el comercio de bienestar y turismo quirúrgico más allá y las clínicas tailandesas compiten directamente con lo mejor en Singapur a una fracción del precio, mientras que los pacientes domésticos esperan detrás de los extranjeros que pagan."
 SIA_volume_tourism: "Los números Juego"
 SIA_volume_tourism_desc: "Más vuelos, paquetes más baratos, más llegadas. Los números de visitantes crudos y la moneda extranjera se acumulan, pero las playas y los pueblos antiguos construidos por una fracción de esta hebilla de tráfico debajo de ella, y las personas que viven allí sienten la tensión mucho antes del balance."
 SIA_high_value_tourism: "Calidad sobre la cantidad"
 SIA_high_value_tourism_desc: "Menos visitantes que gastan mucho más. Atraer el complejo de lujo y el mercado boutique-experiencia en lugar de la multitud de paquetes-tour, comerciando números de llegada para un sector turístico que paga impuestos reales y sobrevive a la siguiente bajada intacta."
 SIA_tourism_capital: "Destino favorito del mundo"
 SIA_tourism_capital_desc: "Desde la comida callejera de Bangkok hasta las playas de Phuket a los templos de Chiang Mai, Tailandia se convierte en el caso de referencia para el desarrollo impulsado por el turismo. El Ministerio de Turismo se gradúa de campañas de marketing a una política industrial permanente, con las decisiones que deben coincidir."
 SIA_tourism_boom: "Turismo Boom"
 SIA_tourism_boom_desc: "Una ola de llegadas está llenando los hoteles y los aeropuertos. La oleada se desvanece una vez que la temporada gira."
 SIA_host_major_international_event: "Acoger un gran evento internacional"
 SIA_host_major_international_event_desc: "Optar a una cumbre, una exposición universal o un gran campeonato deportivo y poner a Tailandia en todas las pantallas del planeta durante una semana. La factura es real, pero también lo es la publicidad gratuita."
 SIA_new_resort_zone: "Abrir una nueva zona turística"
 SIA_new_resort_zone_desc: "Zona y permitir un nuevo tramo de costa o campo para el desarrollo del resort, alejando la inversión desbordante de las costas que ya están llenas."
 SIA_global_amazing_thailand_campaign: "Campaña mundial «Amazing Thailand»"
 SIA_global_amazing_thailand_campaign_desc: "Relanzar el eslogan estrella del consejo de turismo con una nueva ronda de publicidad en el extranjero, apariciones en ferias de viajes e influencers en redes pagados para que parezca que se lo pasan en grande."
 SIA_baht_and_bourse: "El Baht y el Bourse"
 SIA_baht_and_bourse_desc: "Los bancos de Bangkok y la Bolsa de Valores de Tailandia han crecido mucho más allá de los prestamistas de una era anterior, pero los mercados de capitales aquí todavía funcionan poco profundos y más informal que los vecinos que Tailandia compite. Un empuje coordinado ensancha quién puede recaudar dinero y quién puede prestarlo, a costa de entregar la misma creciente piscina de capital a quien pueda trabajar los reguladores más rápido."
 SIA_tamc_workout: "La Corporación de Gestión de Activos"
 SIA_tamc_workout_desc: "La Thai Asset Management Corporation fue construida en 2001 para tragar los malos préstamos que dejó el accidente de 1997 y durante dos décadas ha vendido lentamente lo que podía y escrito lo que no podía. Cierre los libros del fondo para bien libera a la capital todavía encerrada dentro de él, siempre que las pérdidas aún en su libro mayor sean finalmente reconocidas en lugar de llevar adelante otro año."
 SIA_consumer_credit_boom: "Crédito para el Grassroot"
 SIA_consumer_credit_boom_desc: "Tarjetas de crédito, préstamos personales y planes de instalación se distribuyen desde los centros comerciales de Bangkok en las provincias, dejando que los hogares ordinarios pasen hoy contra el sueldo de mañana. Los aumentos del consumo y los ingresos del gobierno lo siguen, pero una población con este crédito de consumo tan nuevo rápidamente aprende a esperar que el estado lo coja cuando vengan los reembolsos."
 SIA_responsible_lending: "Disciplina Macroprudencial"
 SIA_responsible_lending_desc: "El Banco de Tailandia endurece los techos de préstamo a valor y los estándares de préstamos en todos los mercados de crédito hipotecario y consumidor, eligiendo una expansión más lenta y robusta sobre uno rápido. Los bancos mantienen el solvente y los hogares permanecen dentro de sus medios, pero el crédito fácil al consumidor que alimenta un boom del gasto nunca consigue la oportunidad de fluir."
 SIA_deepen_the_set: "Profundice el intercambio"
 SIA_deepen_the_set_desc: "Más compañías listan en la Bolsa de Valores de Tailandia, los gestores extranjeros de cartera abren nuevas líneas a las acciones tailandesas, y el mercado crece tanto más profundo como más líquido. Un intercambio más grande e interconectado también significa un shock más grande el día en que las cuentas auditadas de un conglomerado listado resultan ser inferiores al papel que se imprimen."
 SIA_vayupak_stabilization: "El Fondo Vayupak"
 SIA_vayupak_stabilization_desc: "El Fondo Vayupak respaldado por el estado está listo para comprar cuando el índice cae demasiado lejos y demasiado rápido, dar a los inversores minoristas un piso durante el próximo pánico con dinero de tesorería no es lo mismo que crecer la economía detrás de ellos, y la cuenta para las intervenciones del fondo sale del mismo presupuesto que todo lo demás"
 SIA_bank_consolidation: "La pregunta del Krungsri"
 SIA_bank_consolidation_desc: "El MUFG de Japón tiene una participación controladora en Bank of Ayudhya, un signo entre varios de que el sector bancario de Tailandia se está consolidando alrededor de un puñado de sobrevivientes grandes y a menudo extranjeros. Los balances más grandes absorben mayores shocks, pero los prestamistas pequeños y medianos que una vez sirvieron prestadores pequeños y medianos siguen desapareciendo en la red sucursal de otra persona."
 SIA_financial_center: "Un Centro Financiero Avanzado"
 SIA_financial_center_desc: "Bangkok se posiciona como un centro financiero regional en su propio derecho, un rival para Singapur y Hong Kong en lugar de un mercado que simplemente los alimenta. Los mercados de capitales profundos, un intercambio estabilizado y un sector bancario consolidado convergen en un centro capaz de prizar el riesgo y elevar el capital para toda la región, no sólo para Tailandia."
 SIA_financial_center_idea: "Un Centro Financiero Avanzado"
 SIA_financial_center_idea_desc: "Los mercados de capitales profundos, un intercambio estabilizado y un sector bancario consolidado dan a Tailandia un centro financiero que arriesga los precios y eleva el capital para toda la región, no sólo por sí mismo."
 SIA_the_ground_beneath: "La muerte terrestre"
 SIA_the_ground_beneath_desc: "Una encuesta geológica nacional establece catalogar lo que realmente se encuentra bajo el suelo del Reino y la plataforma continental, desde las macetas del noreste hasta las cuencas de gas del Golfo. Saber lo que hay ahí abajo es la parte fácil. Decidir lo difícil que es tirarlo, y quién paga cuando el jaleo sale mal, viene después."
 SIA_extractive_drive: "Dig, Baby, Dig"
 SIA_extractive_drive_desc: "Los permisos se mueven rápido y el sector de recursos se dice que produzca al máximo volumen con un mínimo retraso. Los ingresos de exportación suben y el lobby del combustible fósil recibe todo lo que pidió, pero cada mina y bien ahora necesita más manos que la última, y los agricultores cuya tierra y agua se sientan más cerca de la perforación son los primeros en darse cuenta."
 SIA_stewarded_extraction: "Mina para la Nación"
 SIA_stewarded_extraction_desc: "La extracción procede en los términos del estado más que en el mercado: permisos más lentos, revisión ambiental real y una huella menor por concesión. El terreno da menos de lo que sería bajo una mano más libre, pero los agricultores y terratenientes que viven junto a los pozos y cabezas no se tratan como daños colaterales."
 SIA_udon_potash: "El Potash de Isan"
 SIA_udon_potash_desc: "Las vastas macetas de Isan, entre las más grandes del mundo y en gran medida sin tocar, van a la producción por fin. Nuevos ejes y obras de procesamiento prometen una industria nacional de fertilizantes, pero los límites de concesión corren directamente a través de pequeños agricultores terrestres y cooperativas de arroz se han cultivado durante generaciones."
 SIA_chatree_gold_tin: "Oro, estaño y yeso"
 SIA_chatree_gold_tin_desc: "El complejo Chatree y sus vecinos sacan oro, estaño y yeso de las llanuras centrales, un sector minero real si no glamuroso junto al comercio de gemas Bangkok ya es famoso por. Las aldeas río abajo de los estanques de cola mantienen un reloj cercano y cada vez más vocal sobre lo que las palancas en la mesa de agua."
 SIA_gulf_gas_oca: "La zona de reclamaciones superpuestas"
 SIA_gulf_gas_oca_desc: "Tailandia y Camboya han dejado que un tramo rico en gas del Golfo se sitúe indesarrollado durante décadas en lugar de resolver quién lo posee. Empujar hacia adelante unilateralmente en la zona de reclamaciones superpuestas significa perforación fronteriza intensiva de capital mucho antes de que un solo metro cúbico llegue a la orilla, y un vecino que no ha acordado ninguno de ellos."
 SIA_resource_sovereignty: "Soberanía de recursos"
 SIA_resource_sovereignty_desc: "Potash, metales de base y gas convergen en un sector de recursos que responde a Bangkok en lugar de a quien está comprando ese trimestre. Lo que una vez fue una historia de concesiones vendidas de la pieza se convierte en un Reino que ya no tiene que pedir permiso para lo que sale de su propio terreno."
 SIA_resource_sovereignty_2of3_tt: "Ha completado por lo menos 2 de los 3 proyectos de recursos"
 SIA_the_digital_consumer: "El consumidor digital"
 SIA_the_digital_consumer_desc: "Los tailandeses cada vez más bancan, compran y reservan en línea en lugar de cola en un mostrador. Agoda, la plataforma de reservas de viajes que creció de una pequeña oficina de Phuket, muestra el negocio digital casero puede competir con cualquiera. Construir los ferrocarriles, la confianza y la base tributaria bajo ese cambio es ahora un proyecto nacional."
 SIA_promptpay_rails: "PromptPay"
 SIA_promptpay_rails_desc: "PromptPay permite que el dinero se mueva entre los números de teléfono y los números nacionales de identificación en segundos, sin una sucursal bancaria o una cuota de cable entre. Formalizando que muchas transacciones tiran una rebanada de la economía de efectivo a la luz, y los corredores que una vez se beneficiaron de ese aviso de opacidad inmediatamente."
 SIA_super_app_economy: "La Super-App"
 SIA_super_app_economy_desc: "Agarra, LINE MAN y sus rivales doblan paseo-hailing, entrega de alimentos y trabajo de mensajería en una única aplicación que cada tailandés ya ha abierto. Los aumentos de eficiencia son reales, pero también la ausencia de cualquier contrato, beneficio o asiento en una mesa de negociación para los conductores y jinetes que hacen funcionar las aplicaciones."
 SIA_ecommerce_marketplaces: "A bordo de las PYMES"
 SIA_ecommerce_marketplaces_desc: "Lazada y Shopee dan a los pequeños fabricantes y vendedores de puestos de mercado un escaparate que llega a clientes mucho más allá de su propia provincia, y a menudo más allá de las fronteras de Tailandia. Los almacenes y las flotas de entrega tienen que ser construidos para igualar, y construirlos primero come en lo que los mercados están destinados a ofrecer."
 SIA_national_digital_champions: "Dos grupos, un mercado"
 SIA_national_digital_champions_desc: "En lugar de referir un concurso abierto, el estado respalda un pequeño número de plataformas nacionales y les permite consolidar el mercado. Un sector digital concentrado es eficiente para fiscalizar y regular fácilmente, pero un mercado sin rival real tiene pocas razones para mantener sus precios honestos."
 SIA_open_digital_market: "Romper el Duopoly"
 SIA_open_digital_market_desc: "Las reglas antimonopolios y los requisitos de portabilidad de datos abiertos mantienen plataformas más pequeñas capaces de competir en lugar de permitir que las dos aplicaciones más grandes tallan el mercado entre ellas. Los consumidores mantienen el beneficio de la competencia real, a costa de los ingresos fiscales ordenado que un campeón nacional habría entregado."
 SIA_the_outward_turn: "El giro hacia el exterior"
 SIA_the_outward_turn_desc: "Durante décadas, el capital tailandés fluyó de una manera, en fábricas y hoteles construidos para que los extranjeros usaran. Una generación diferente de conglomerados ahora busca el crecimiento propio, comprando estacas y construyendo plantas en toda una región que solía ser cliente de Tailandia, no su objetivo."
 SIA_leveraged_expansion: "Comprar el mundo"
 SIA_leveraged_expansion_desc: "Arranque contra un balance fuerte y vaya de compras al extranjero a toda velocidad. Las adquisiciones financiadas por deudas aumentan la cartera rápidamente, pero cada activo comprado en crédito es un activo que puede ir tan rápido bajo el agua."
 SIA_organic_expansion: "Crece lo que tenemos"
 SIA_organic_expansion_desc: "En lugar de pedir prestado para comprar, expanda lo que los conglomerados tailandeses ya controlan: más ramas, más capacidad, más mercados, financiados con sus propios ingresos. Es más lento y nunca hace que la primera página de una revista de acuerdos, pero nada comprado de esta manera necesita ser vendido con prisa."
 SIA_cp_into_china: "Certificate 0001"
 SIA_cp_into_china_desc: "En 1990, Charoen Pokphand se convirtió en el primer inversor extranjero en comprar una estaca en la Bolsa de Valores de Shanghai, número de certificado 0001. Tres décadas después, el libro chino del CP funciona desde Ping An Insurance para alimentar a los molinos de la longitud del país, una apuesta que nunca dejó de pagar incluso mientras hundió algo de lo que el PC alguna vez creció en casa."
 SIA_thaibev_conquers_asean: "El Imperio del Barón de Cerveza"
 SIA_thaibev_conquers_asean_desc: "El vehículo Beverage de Vietnam de ThaiBev toma el control de Saigon Beer en 2017 por cerca de cinco mil millones de dólares, y luego plega las bebidas e imperio inmobiliario de Fraser y Neave en Singapur en la misma establo. Un único conglomerado tailandés posee ahora una parte significativa de lo que el resto de la región bebe."
 SIA_scg_long_son: "Largo Hijo Rises"
 SIA_scg_long_son_desc: "El complejo petroquímico de Siam Cement Group en la península de Long Son de Vietnam se grieta naphtha en los plásticos materia prima sus fábricas tailandesas siempre han tenido que importar. Construido en el extranjero, la capacidad llega a casa como una cadena de suministro más barata y más estable, una vez que el hormigón finalmente se establece."
 SIA_central_minor_abroad: "Centros comerciales y habitaciones en el extranjero"
 SIA_central_minor_abroad_desc: "Central Group participa en Selfridges, KaDeWe e Illum a través del grupo Signa de Austria, mientras que las marcas hoteleras de Minor International se extendieron desde Bangkok a Maldivas a Lisboa. Thai retail y el dinero de la hospitalidad ahora posee escaparates y lobbies hoteleros sus propios compradores nunca han puesto un pie en."
 SIA_ptt_banpu_resources: "Perforación del mundo"
 SIA_ptt_banpu_resources_desc: "Los campos de PTTEP se extienden desde Omán hasta Mozambique a las aguas compartidas con Malasia, y las concesiones de carbón de Banpu corren por Australia e Indonesia. Tailandia asegura recursos que no tiene en casa, atados al mismo ciclo de productos básicos que una mina interna cabalgaría."
 SIA_outbound_statecraft: "Inversiones como artesanía de Estado"
 SIA_outbound_statecraft_desc: "Los acuerdos dejan de ser apuestas separadas y se convierten en una sola postura nacional, con capital tailandés sirviendo como un instrumento de política exterior tanto como de beneficio. Una oficina dedicada administra ahora el oleoducto de adquisiciones y las salas de juntas de la mitad de la respuesta de la ASEAN, en parte, a Bangkok."
 SIA_outbound_statecraft_3of5_tt: "Ha completado por lo menos 3 de los 5 acuerdos de expansión en el extranjero"
 SIA_thai_multinationals: "Thai Multinationals"
 SIA_thai_multinationals_desc: "Las empresas tailandesas superan el mercado nacional y comienzan a comportarse como las multinacionales que una vez sólo sirvieron. El alcance en el extranjero es real, pero cada baht y cada hora ejecutiva enviada al extranjero no se gasta edificio en casa."
 SIA_overseas_deal_boom: "Comercio internacional Boom"
 SIA_overseas_deal_boom_desc: "Otra adquisición ha cerrado, y los beneficios de más allá de las fronteras de Tailandia están fluyendo hacia el oleoducto que lo cerró."
 SIA_overseas_acquisitions_category: "Adquisiciones en el extranjero"
 SIA_overseas_acquisitions_category_desc: "Los conglomerados tailandeses siguen comprando en el extranjero. Explorar el próximo objetivo, cerrar el acuerdo, o poner toda la cartera en un roadhow global, tesorería lo permite."
 SIA_scout_overseas_targets: "Blancos exploradores en el extranjero"
 SIA_scout_overseas_targets_desc: "Enviar a los equipos de acuerdos a recorrer las plantas de la próxima adquisición antes de que nadie firme nada. Una breve y modesta lectura de dónde debería aterrizar el capital tailandés a continuación."
 SIA_close_the_deal: "Cerrar el trato"
 SIA_close_the_deal_desc: "Firmar los papeles de la siguiente participación, filial o concesión vigente. El dinero que sale del tesoro es real, a cambio de un activo que aún no ha demostrado que valía el precio."
 SIA_global_ma_roadshow: "Global M&A Roadshow"
 SIA_global_ma_roadshow_desc: "Enviar a los gestores de acuerdos de los conglomerados en una gira por Singapur, Hong Kong y Londres, ofreciendo capital tailandés a banqueros y consejos objetivo por igual. La publicidad por sí sola da bombo a la siguiente ronda de acuerdos."
 thailand.1.t: "Elecciones generales de 2001"
 thailand.1.d: "El 6 de enero de 2001, los tailandeses votan en las primeras elecciones generales bajo la Constitución Popular. Tres fuerzas impugnan la votación. Thai Rak Thai's plataforma de fondos de aldea, moratorias de deuda y salud universal ha electrificado el campo. La red de palacios y sus aliados en las bases militares prefieren controlar a los que gobiernan. Los demócratas titulares prometen manos firmes y sin memoria. Donde tiramos nuestro peso ahora formará quién escoge el país."
 thailand.1.a: "Back Thai Rak Thai y el deslizamiento rural."
 thailand.1.b: "Rallye de la red del palacio y los generales."
 thailand.1.c: "Sostengan a los demócratas en el poder."
 thailand.2.t: "Un gobierno de CEOs"
 thailand.2.d: "El nuevo gobierno toma la oficina prometiendo dirigir Tailandia como una compañía exitosa. Los empresarios llenan el gabinete, los ministerios reciben objetivos de desempeño y las políticas se mueven a una velocidad que la burocracia nunca ha visto."
 thailand.2.a: "Tailandia está abierta para los negocios."
 thailand.3.t: "La guerra contra las drogas"
 thailand.3.d: "En febrero de 2003 el Gobierno declaró una campaña de tres meses para erradicar el comercio de metanfetaminas. Se elaboran listas provinciales negras y se establecen cuotas. Para su fin, las organizaciones de derechos documentan 2.800 asesinatos, muchos nunca han investigado adecuadamente. La campaña es popular en los medios de comunicación, pero condenada al extranjero."
 thailand.3.a: "Presione la campaña sin restricción."
 thailand.3.b: "Bájala tranquilamente."
 thailand.4.t: "El golpe de septiembre"
 thailand.4.d: "El 19 de septiembre de 2006, el Primer Ministro está en Nueva York para la Asamblea General de las Naciones Unidas. Mientras tanto, los tanques pasean por Bangkok, se deroga la constitución y el Consejo para la Reforma Democrática anuncia que ha asumido pacíficamente el control del gobierno. Los cuervos traen flores a los soldados mientras la mayoría rural mira en silencio."
 thailand.4.a: "Que el ejército asuma su responsabilidad."
 thailand.4.b: "Instale a un gobierno de frente civil."
 thailand.5.t: "Disolución judicial"
 thailand.5.d: "El Tribunal Constitucional pesa un caso de fraude electoral contra el mayor partido de oposición. Una disolución prohibiría a su junta ejecutiva de la política durante cinco años, decapitando el movimiento sin que un solo soldado saliera de los cuarteles."
 thailand.5.a: "Disuelva la fiesta."
 thailand.5.b: "Deja que la amenaza les cuelgue."
 thailand.6.t: "La NCPO toma el poder"
 thailand.6.d: "El 22 de mayo de 2014, tras meses de protestas y dos días de ley marcial declarada, el jefe del ejército llama a las facciones rivales al Club del Ejército y los arresta en la sala de conferencias. El jefe del ejército anuncia que el Consejo Nacional para la Paz y el Orden asumirá el control del gobierno. No habrá calendario fijo para las elecciones hasta que las instituciones democráticas estén estables."
 thailand.6.a: "El orden está restaurado."
 thailand.7.t: "Camisas Rojas Tome la Plaza"
 thailand.7.d: "El Frente Unido para la Democracia contra la Dictadura inunda el corazón comercial de Bangkok, exigiendo la renuncia del gobierno y las nuevas elecciones. Barricades se levantan en Ratchaprasong y los neumáticos y edificios queman a través de la ciudad. Las cámaras del mundo están viendo lo que hace el ejército después."
 thailand.7.a: "Despejen la plaza."
 thailand.7.b: "Negocia y espéralos."
 thailand.8.t: "El Aeropuerto de Incautación"
 thailand.8.d: "En noviembre de 2008 los manifestantes con camiseta amarilla ocupan los aeropuertos de Suvarnabhumi y Don Mueang, que van en 300,000 viajeros y congelan el comercio aéreo del país. El asedio termina sólo cuando un fallo judicial derriba al gobierno que se opone."
 thailand.8.a: "Cuente el costo."
 thailand.9.t: "Las Tres Demandas"
 thailand.9.d: "Las multitudes dirigidas por estudiantes, más grandes que ninguna desde 1992, expresan tres demandas. Disolver el parlamento, dejar de intimidar a los críticos y escribir una nueva constitución. Desde una etapa en Bangkok, tabúes que han gobernado el discurso público tailandés por generaciones se rompen en una sola noche."
 thailand.9.a: "Retrocedan las tres demandas."
 thailand.9.b: "Empuja sólo lo que el parlamento pasará."
 thailand.10.t: "Sección 112 en el piso"
 thailand.10.d: "Un proyecto de ley para enmendar la ley lese-majeste llega al Parlamento. Limita quién puede presentar quejas, sanciona y termina su uso contra el discurso político. Ninguna legislatura tailandesa se ha atrevido a votar esta cuestión. Cada institución del viejo orden está ahora en marcha."
 thailand.10.a: "Llama a la votación."
 thailand.11.t: "Crisis de disolución"
 thailand.11.d: "El Tribunal Constitucional rige la campaña de enmienda como intento de derrocar al régimen democrático con el Rey como Jefe de Estado. El partido está disuelto, sus ejecutivos prohibidos. El movimiento debe comenzar de nuevo bajo un nuevo nombre, con la misma gente, como siempre lo ha hecho."
 thailand.11.a: "Registraremos una nueva fiesta para el viernes."
 thailand.12.t: "El establecimiento retrocede"
 thailand.12.d: "Las unidades del ejército se están moviendo en la capital sin órdenes del gobierno. El viejo orden ha decidido que el experimento ha ido lo suficientemente lejos. Lo que sucede en las próximas seis horas decide si la era de reforma continúa, o se une a la larga lista de democracias tailandesas interrumpidas."
 thailand.12.a: "Llama a la gente a las calles."
 thailand.12.b: "Retrocede para salvar el movimiento."
 thailand.13.t: "Cuestión de la República"
 thailand.13.d: "El gobierno organiza un referéndum sobre la forma constitucional del propio Estado, la cuestión que ningún gobierno tailandés ha puesto al pueblo. Sea cual sea el resultado, nada sobre el Reino será el mismo."
 thailand.13.a: "Pónselo a la gente."
 thailand.13.b: "Retirar el referéndum."
 thailand.14.t: "Un nuevo reajuste"
 thailand.14.d: "El 13 de octubre de 2016 el Royal Household Bureau anuncia la muerte de Su Majestad el Rey Bhumibol Adulyadej, Rama IX, después de setenta años en el trono, el reinado más largo de la historia tailandesa. El Príncipe Heredero asciende como el Rey Maha Vajiralongkorn, Rama X. Cómo el gobierno marca la transición, y lo rápido que se mueve, es la decisión de Bangkok ahora."
 thailand.14.a: "Afirme el nuevo reinado abiertamente."
 thailand.14.b: "Deja que los ritos ejecuten su curso."
 thailand.14.c: "Ceremonia de equilibrio con continuidad."
 thailand.15.t: "La dinastía continúa"
 thailand.15.d: "El fundador del movimiento ya no puede liderarlo en persona, pero el nombre conserva su dominio sobre el electorado. La pregunta que tiene ante sí el partido es quién la lleva a las próximas elecciones."
 thailand.15.a: "Yingluck Shinawatra lidera el boleto."
 thailand.15.b: "Srettha Thavisin lidera el ticket, un magnate de propiedad para el ala de negocios."
 thailand.15.c: "Paetongtarn Shinawatra lidera el boleto, y el nombre permanece en una nueva generación."
 thailand.15.e: "Ponga la máquina encima del nombre."
 thailand.16.t: "Thaksin para siempre"
 thailand.16.d: "El congreso anual del partido vota para abolir los límites de mandato interno y otorgar a la autoridad directiva de emergencia sobre la selección de candidatos, la lista del partido y la política de coalición. Las bancas de la oposición están vacías de cualquiera que importe. Se seguirán celebrando elecciones y se seguirá ganando."
 thailand.16.a: "Un líder, una fiesta, un Tailandia."
 thailand.17.t: "Restauración del Trono"
 thailand.17.d: "El Parlamento, el Consejo Privado y las fuerzas armadas piden conjuntamente al palacio que asuma la administración directa de las instituciones del Estado. La ficción constitucional del siglo pasado está retirada. La dinastía Chakri retoma el papel que tuvo antes de 1932."
 thailand.17.a: "Viva el Rey."
 thailand.18.t: "The 2017 System"
 thailand.18.d: "La nueva constitución aprueba su referéndum bajo restricciones de campaña que hicieron de la oposición un delito penal. Un Senado completamente nombrado ayudará a elegir futuros ministros principales, y una Estrategia Nacional de veinte años une a cada gobierno futuro. Las elecciones reanudarán, pero dentro de la valla."
 thailand.18.a: "La democracia guiada es."
 thailand.19.t: "El reino va a las encuestas"
 thailand.19.d: "El 6 de enero de 2001 se inauguraron estaciones de votación en las 70 provincias. Esta es la primera votación realizada en virtud de la Constitución Popular, contada por una comisión independiente y no por el Ministerio del Interior, y la primera en que un partido ganador podría gobernar sin meses de coaliciones."
 thailand.19.a: "Que empiece la cuenta."
 thailand.20.t: "El Tribunal disuelve a la Parte"
 thailand.20.d: "El Tribunal Constitucional dictamina que el partido gobernante pagó a los partidos más pequeños a los candidatos de campo en las elecciones anuladas, y ordena que se disolviera. Cien once de sus ejecutivos están excluidos de la política durante cinco años. El veredicto elimina el nombre del partido, su registro y su liderazgo, y no toca a ninguno de sus votantes. Dentro de semanas los mismos miembros del parlamento están presentando documentos para un nuevo registro bajo una nueva bandera, y la máquina en el noreste no ha perdido ni un solo distrito."
 thailand.20.a: "Reinscribir limpio, bajo nueva dirección."
 thailand.20.b: "Los ejecutivos prohibidos seguirán haciéndolo desde afuera."
 thailand.21.t: "La Corte emplea a la Sala"
 thailand.21.d: "Una segunda disolución, y ésta toma al partido gobernante con ella. El fallo también golpea el antiguo bloque nacional-conservador, cuyos jefes provinciales de facción ahora mantienen la aritmética de la cámara en sus manos y están siendo juzgados por ambas partes. Su líder está prohibido pero no silenciado, y él está negociando desde una casa en Buriram. Si sus miembros caminan, la oposición forma un gobierno sin elección. Si pueden ser sostenidos, la coalición sobrevive y todo el mundo sabrá exactamente lo que cuesta."
 thailand.21.a: "Déjalos ir, y deja que los demócratas traten de gobernar."
 thailand.21.b: "Coincide con lo que se ofrecieron."
 SIA_bench_hands_power_to_democrats_tt: "La cámara vuelve a reunirse con el §Y Partido Demócrata§! en el gobierno."
 thailand.50.t: "De la crisis de Tom Yum Kung"
 thailand.50.d: "Tres años después de la ruptura del baht, la economía está creciendo de nuevo. Las fábricas del Seaboard Oriental están recontratando, y el programa del FMI que comenzó en humillación está por delante de lo previsto."
 thailand.50.a: "Lo peor está detrás de nosotros."
 thailand.51.t: "El FMI sale"
 thailand.51.d: "En julio de 2003 Tailandia paga la cuota final de sus obligaciones del FMI dos años antes de lo previsto. El Primer Ministro marca la ocasión con una dirección televisada que declara la independencia económica del país restablecida."
 thailand.51.a: "Nunca más."
 thailand.52.t: "El tsunami del día de boxeo"
 thailand.52.d: "El 26 de diciembre de 2004 un terremoto submarino frente a Sumatra envía un tsunami a la costa andamán de Tailandia. Khao Lak y Phuket están devastados, y más de 5.000 personas en Tailandia son asesinadas, muchos de ellos turistas extranjeros. El mundo está viendo la respuesta."
 thailand.52.a: "No escatimar nada en el esfuerzo de alivio."
 thailand.52.b: "Una respuesta mínima."
 thailand.53.t: "El Gran Diluvio"
 thailand.53.d: "Las aguas monzones que bajan por la cuenca Chao Phraya inundan dos tercios de las provincias del país y caen en las fincas industriales al norte de Bangkok. La producción mundial se detiene en fábricas tailandesas inundadas. La capital construye paredes de saco de arena y espera."
 thailand.53.a: "Movilizar todo."
 thailand.53.b: "Protege Bangkok y deja que las provincias se desagüen."
 thailand.54.t: "El Plan de Promesas de Arroz"
 thailand.54.d: "El gobierno propone comprar toda la cosecha de arroz a la mitad de nuevo el precio del mercado, transfiriendo miles de millones a hogares agrícolas y apuestas que los precios mundiales seguirán. Los economistas advierten que los almacenes se llenarán y las pérdidas serán históricas. Los agricultores que nos eligieron están esperando."
 thailand.54.a: "Promete cada grano."
 thailand.54.b: "Tranquilízate con el plan."
 thailand.55.t: "Detroit of Asia"
 thailand.55.d: "La producción de vehículos cruza la marca de un millón de unidades. Tailandia es ahora el mayor fabricante de automóviles en el sudeste asiático y el principal productor mundial de camionetas de una tonelada."
 thailand.55.a: "Corte Toyota y Honda y abrir las puertas."
 thailand.56.t: "Visitar Tailandia Año"
 thailand.56.d: "Bangkok es una de las ciudades más visitadas del mundo. Desde Khao San Road hasta Karon Beach, el Reino acoge al mundo, y el gasto turístico sostiene los bolsillos de millones de tailandeses."
 thailand.56.a: "Sawasdee."
 thailand.56.b: "Invertir en la propia industria."
 thailand.57.t: "La cuestión del submarino"
 thailand.57.d: "El contrato de la marina para submarinos S26T construidos en China se ha convertido en un argumento nacional. ¿Son estos los primeros barcos de una flota de dos oceanos, o miles de millones gastados en motores que el proveedor no puede entregar? La decisión de la contratación pública aterriza en el escritorio del gobierno."
 thailand.57.a: "Compra los barcos."
 thailand.57.b: "Cancela el programa."
 thailand.100.t: "Los Territorios Perdidos"
 thailand.100.d: "Los medios de comunicación estatales reviven los viejos mapas. Las provincias firmaron a Francia en 1893, 1904 y 1907, los sultanatos cedieron a Gran Bretaña en 1909. La narrativa nacional-humilación de la era Phibun regresa a los libros escolares, y un movimiento que ningún gobierno ha invocado desde 1945 vuelve a revolver."
 thailand.100.a: "Lo que se tomó puede ser devuelto."
 thailand.101.t: "Hermanos a través de la Salween"
 thailand.101.d: "Bangkok declara formalmente su interés en el destino del Tai Yai del estado de Shan, pariente al tailandés en lengua y sangre, en guerra con la junta burguesa durante generaciones. La declaración deja de ser una demanda territorial. Nadie en la región equivoca su significado."
 thailand.101.a: "El Tai es una gente."
 thailand.102.t: "El Mekong es un río tailandés"
 thailand.102.d: "El gobierno repudia formalmente los tratados Franco-Siamese de 1893 y 1904 como instrumentos firmados bajo coacción. La demanda inmediata cubre a Champasak, pero las voces del partido gobernante preguntan por qué la reclamación debe detenerse en las provincias que Francia pasó a mapear."
 thailand.102.a: "Reclamen los territorios de 1904."
 thailand.102.b: "Reclamen todos los Laos como tierra Tai."
 thailand.103.t: "Enfrentamiento de Preah Vihear"
 thailand.103.d: "Los intercambios de artillería alrededor del templo de la cima del acantilado, lo peor desde 2011, dan a Bangkok su pretexto. El gobierno anuncia que ya no reconoce el fallo de la CIJ de 1962 y afirma reclamos a Battambang y Siem Reap, provincias de Siamese en memoria viva."
 thailand.103.a: "Afirme las reclamaciones."
 thailand.103.b: "Reclamaciones y un ultimátum."
 thailand.104.t: "Denouncing 1909"
 thailand.104.d: "El Ministerio de Relaciones Exteriores denuncia formalmente el Tratado Anglo-Siamese de 1909, por el cual los afluentes malayos de Bangkok fueron transferidos al Imperio Británico. Kelantan y Terengganu son nombrados directamente. Kuala Lumpur recuerda a su embajador dentro de la hora."
 thailand.104.a: "Reclamar Kelantan y Terengganu."
 thailand.104.b: "Exigir cada sultanato cedido."
 thailand.105.t: "Suwannaphum"
 thailand.105.d: "La Tierra Dorada de las crónicas, el mundo Tai se reunió bajo una bandera. El gobierno proclama el programa de unificación completo en principio. Lo que queda es hacer que los territorios recuperados tailandeses en administración, así como en nombre."
 thailand.105.a: "Levante una bandera del Salween al mar."
 thailand.105.b: "Pausa. Que los militares se consoliden primero."
 thailand.106.t: "Integración de las Tierras Shan"
 thailand.106.d: "Administración tailandesa, escuela tailandesa e infraestructura tailandesa llegan a la meseta de Shan. La comisión de integración informa a las nuevas provincias listas para su plena incorporación al Reino."
 thailand.106.a: "Bienvenido a casa."
 thailand.107.t: "Integración de las Tierras Lao"
 thailand.107.d: "Las provincias de Mekong completan su integración administrativa. El río ya no es una frontera."
 thailand.107.a: "Bienvenido a casa."
 thailand.108.t: "Integración de las Provincias Khmer"
 thailand.108.d: "Battambang y Siem Reap, Phra Tabong y Siemmarat en los viejos miradores, regresan por primera vez a la administración tailandesa desde 1946."
 thailand.108.a: "Bienvenido a casa."
 thailand.109.t: "Integración de las Provincias del Sur"
 thailand.109.d: "Los antiguos sultanatos completan su incorporación. Un siglo de administración británica y malaya termina. Lo que comienza es la tarea más difícil de hacer que funcione."
 thailand.109.a: "Bienvenido a casa."
 thailand.110.t: "El mundo reacciona"
 thailand.110.d: "Sesiones de emergencia en cada capital vecino. El principio fundamental de la ASEAN, la inviolabilidad de las fronteras de la era colonial, ha sido repudiado por un miembro fundador. Las embajadas son recordadas, ejercicios suspendidos y viejos amigos comienzan a describir Tailandia con nuevo vocabulario."
 thailand.110.a: "Se ajustarán."
 thailand.150.t: "Fuego en el sur"
 thailand.150.d: "El 4 de enero de 2004 militantes allanaron un depósito militar en Narathiwat, matando soldados y confiscando cientos de armas. El incendio coordinado sigue a través de las provincias Malay-Muslim del Sur Profundo. Ha regresado una insurgencia separatista durante dos décadas."
 thailand.150.a: "El Sur nos pondrá a prueba."
 thailand.151.t: "En el Sur profundo"
 thailand.151.d: "Otra semana, otra bomba de carretera, otro tiroteo en Yala, Pattani o Narathiwat. El conflicto se mueve en un tempo Bangkok ha aprendido a absorber, y el Sur no lo tiene."
 thailand.151.a: "Endure."
 thailand.152.t: "Heavy-Handed"
 thailand.152.d: "Una operación de seguridad en el sur profundo termina con los detenidos muertos y el ejército defendiendo sus métodos. Se prometen investigaciones, pero las fiscalías no siguen. A través de la frontera y a través del mundo musulmán, las imágenes hacen su trabajo contra nosotros."
 thailand.152.a: "La orden tiene su precio."
 thailand.153.t: "Charlas en Kuala Lumpur"
 thailand.153.d: "Funcionarios tailandeseses se reúnen con representantes del BRN en una mesa organizada por facilitadores de Malasia. El programa es modesto, abarca las zonas de seguridad, el bienestar de los reclusos y el reconocimiento del propio diálogo. Después de años de negar cualquier guerra existió, hablar es la concesión."
 thailand.153.a: "Mantenlos hablando."
 thailand.154.t: "El Acuerdo de Paz"
 thailand.154.d: "Se firma un marco de autonomía para las provincias Patani. Contiene la gobernanza regional elegida, la escolarización en Malay junto con tailandés, mecanismos de justicia para los abusos del conflicto y un fin gradual a la presencia de seguridad. La guerra más larga dentro de las fronteras de Tailandia termina con firmas."
 thailand.154.a: "Paz en el Sur."
 thailand_news.1.t: "Coup en Bangkok"
 thailand_news.1.d: "El Ejército Real de Tailandia se ha apoderado del poder en Bangkok, suspendiendo la constitución y descartando al gobierno elegido. Los consejos militares han gobernado Tailandia repetidamente desde 1932, y los mercados y las oportunidades por igual están calculando cuánto tiempo se propone quedarse."
 thailand_news.1.a: "¿Otra vez?"
 thailand_news.2.t: "Tailandia reclama sus 'territorios perdidos'"
 thailand_news.2.d: "Bangkok ha afirmado formalmente a territorios cedidos a Francia y Gran Bretaña hace un siglo, reviviendo un programa irredentista no oído desde la Segunda Guerra Mundial. Las capitales del sudeste asiático están respondiendo con alarma."
 thailand_news.2.a: "Concerning."
 thailand_news.3.t: "¿Una República en Siam?"
 thailand_news.3.d: "Tailandia celebrará un referéndum sobre el futuro de su monarquía, cuestión sin precedentes en la historia moderna del Reino. La región respira."
 thailand_news.3.a: "Sin precedentes."
 thailand_news.4.t: "Tailandia Mourns King Bhumibol"
 thailand_news.4.d: "El rey Bhumibol Adulyadej, el monarca reinante más largo del mundo, ha muerto en Bangkok a los 88 años. Tailandia comienza un año de luto para el único rey que la mayoría de los tailandeses han conocido. Su hijo lo tiene como rey Maha Vajiralongkorn, Rama X."
 thailand_news.4.a: "Una era termina."
 thailand.58.t: "El pantano de Cobras"
 thailand.58.d: "Nong Ngu Hao, el «Cobra Swamp», ha tragado dinero desde los años 70. Ahora el nuevo aeropuerto está realmente subiendo de él, y también los costos. Problemas de drenaje, taxis agrietados, contratistas facturando dos veces por el mismo hormigón. La junta quiere más dinero o más tiempo."
 thailand.58.a: "Verter en fondos y abrirse según lo previsto."
 thailand.58.b: "Deja que el horario se resbale."
 thailand.59.t: "Gateway a Asia"
 thailand.59.d: "Suvarnabhumi abre sus puertas. Es un terminal de cristal y talón entre los más grandes del mundo, construido para poner Bangkok en el centro de cada mapa de ruta asiático. La primera tabla de llegadas lee como una fantasía del ministerio turístico."
 thailand.59.a: "El Reino tiene una nueva puerta principal."
 thailand.60.t: "Tierra de ruptura en el este"
 thailand.60.d: "El Corredor Económico Oriental existe en papel, y ahora alguien debe pagar por el hormigón. Las delegaciones de Pekín llegan con ofertas de financiación plegadas en lenguaje Belt-and-Road. El ministerio financiero también puede aumentar el dinero en casa, más lento y sin cadenas."
 thailand.60.a: "Capital chino de la corte."
 thailand.60.b: "Emitir bonos nacionales."
 thailand.61.t: "El Rail Link supera"
 thailand.61.d: "Tunnelling debajo de tres aeropuertos siempre iba a ser caro, pero nadie informó al gabinete sobre lo costoso. La línea de tres aeroportos necesita otro tranche o un plano más delgado."
 thailand.61.a: "Paga. La columna se construye entera."
 thailand.61.b: "Intenten el alcance."
 thailand.62.t: "El Franja y la Ruta viene llamando"
 thailand.62.d: "Una línea de alta velocidad de Kunming a través de Vientiane a Bangkok. El centro perdido del corredor de Indochina de China corre por territorio tailandés, y a Beijing le gustaría mucho financiarlo. Los términos son generosos. Los términos también son términos."
 thailand.62.a: "Firme el memorando ferroviario."
 thailand.62.b: "Renegociar, lentamente, de la manera tailandesa."
 thailand.63.t: "La cuestión de la concesión"
 thailand.63.d: "Los senadores de oposición tabularon cómo las concesiones de telecomunicaciones del estado se han ido desde que su mayor titular formó un gobierno. Impuestos ajustados, licencias extendidas, competidores auditados. La palabra «coincidencia» está haciendo un trabajo pesado en las respuestas oficiales."
 thailand.63.a: "Desenterrar las tenencias. Coge el tesorería, compra la reputación limpia."
 thailand.63.b: "Deténganlo. Los números ganan elecciones, los abogados compran tiempo."
 thailand.64.t: "La deuda de la casa Reckoning"
 thailand.64.d: "Los fondos de la aldea construyeron tiendas, motocicletas y molinos de arroz, todo a crédito. La deuda media de la familia rural casi se ha duplicado, y los libros de las cooperativas están empezando a oscilar. Los bancos quieren orientación antes de la temporada de redondeo."
 thailand.64.a: "Salga de las cooperativas. Una moratoria nos cuesta, pero salva las aldeas."
 thailand.64.b: "Deja que el crédito se endurezca. El mercado corre, pero las aldeas lo absorben."
 thailand.65.t: "Offsets y Erieyes"
 thailand.65.d: "La oferta final de Saab aterriza sobre la mesa. Controla el acceso completo a código fuente, un radar aéreo Erieye, asociaciones universitarias y trabajo de componentes para la industria tailandesa, todo por un precio. O los mismos luchadores, desnudos, por mucho menos."
 thailand.65.a: "Toma el paquete completo."
 thailand.65.b: "Solo a Airframes. Cuidado con el presupuesto."
 thailand.66.t: "El problema del motor"
 thailand.66.d: "Alemania no licenciará los motores diesel para un submarino de exportación construido en China, que deja el casco S26T medio pagado en Wuhan esperando un corazón. Beijing ofrece sus propios motores y un descuento. La marina ofrece al gabinete una opción de vergüenza."
 thailand.66.a: "Acepta los motores chinos y toma la entrega."
 thailand.66.b: "Exija un casco de fragata en compensación."
 thailand.66.c: "Cancela el contrato por completo."
 thailand.67.t: "Un buque insignia Reborn"
 thailand.67.d: "Aviones secos en el salto de esquí, barcos no tripulados en el pozo de la cubierta hangar, consolas de control donde los repuestos Harrier solían oxidarse. HTMS Chakri Naruebet vuelve a Sattahip con un perfil de misión que ninguna otra marina de la región puede copiar."
 thailand.67.a: "Déjala pasar por las cámaras."
 thailand.67.b: "Una recommisión silenciosa, de vuelta al trabajo."
 thailand.68.t: "Noventa días de miedo"
 thailand.68.d: "Las listas negras se han convertido en cuentas de cuerpo. Más de dos mil muertos en tres meses, muchos sin conexión de drogas que los investigadores pueden encontrar. El campo aplaude, los hospitales se llenan y la caja de entrada del ministerio extranjero se llena más rápido."
 thailand.68.a: "Presiona. La campaña está funcionando."
 thailand.68.b: "Bájalo y ordena las críticas."
 thailand.69.t: "Ronblings en el Club de Oficiales"
 thailand.69.d: "Los signos que cada gobierno de Bangkok aprende a leer son todos aquí. Las rotaciones inusuales en la Primera Región del Ejército, los generales retirados repentinamente aficionados a las entrevistas televisivas y una reunión de clase en el cuartel de caballería que asistió la mitad del alto mando."
 thailand.69.a: "Sube a los mejores oficiales."
 thailand.69.b: "Acomodar a los generales."
 thailand.69.c: "Defiéndelas públicamente."
 thailand.70.t: "Tanques en la casa del gobierno"
 thailand.70.d: "Comienza la forma en que siempre comienza. Programación regular sustituida por la música patriótica, vehículos blindados en las intersecciones, un comunicado de un 'consejo' nadie había oído hablar de ayer. El gobierno tiene minutos para decidir qué está dispuesto a gastar."
 thailand.70.a: "Rallye de los leales y resista."
 thailand.70.b: "Concede, y abordar el avión."
 thailand.70.c: "Negociar un gobierno de unidad nacional."
 thailand.70.c_tooltip: "§YLos generales entran al gabinete, no al palacio.§!\nLas elecciones sobreviven (§G ninguna suspensión electoral§!) y la presión del golpe cae a §Y35§!. El Reino paga el precio en estabilidad y capital político, y un compromiso §Y desigual§! cede al gobierno durante 180 días."
 thailand.71.t: "La juventud en las calles"
 thailand.71.d: "Se organizan en Telegram, citan Hamtaro y Hunger Games, y llenan los monumentos por decenas de miles. Sus demandas están escritas en aviones de papel arrojados sobre las barreras. Parlamento disuelto, reescribir la constitución, reformar instituciones intocables."
 thailand.71.a: "Dispersión de los rallyes. La orden no puede esperar."
 thailand.71.b: "Abre un diálogo. Concede el tono, no la sustancia."
 thailand.71.c: "Espérenlos. Se cansan antes que nosotros."
 thailand.155.t: "A Región Ablaze"
 thailand.155.d: "Coordinado incendio en tres provincias en una noche. Puntos de control en el día. Profesores escoltados, escuelas cerradas para el término. El sur no ha quemado así en una generación, y el Consejo de Seguridad Nacional quiere una dirección."
 thailand.155.a: "Flood el sur con tropas."
 thailand.155.b: "Llamar a Kuala Lumpur y ampliar el diálogo."
 thailand.156.t: "Caminos tranquilos en Pattani"
 thailand.156.d: "El mapa mensual de incidentes tiene más espacio blanco que rojo. Los mercados permanecen abiertos más allá de la oscuridad, los puntos de control pasan por el tráfico de ondas y los hombres a lo largo de la mesa en Kuala Lumpur están preguntando cuidadosamente cómo sería un estado final."
 thailand.156.a: "Empuje por un acuerdo final."
 thailand.156.b: "Mantener la tranquilidad, y el status quo."
 thailand.350.t: "El Fuego en el Sur"
 thailand.350.d: "El mapa de las tres provincias del sur es una constelación de pins rojos, con bombardeos, emboscadas, incendios y asesinatos. Miles están muertos y las fuerzas de seguridad están sangrando hombres que no pueden reemplazar. La crisis ya no puede manejarse al margen. El gobierno debe decidir qué tipo de estado tiene la intención de estar en el Sur. Un puño, un benefactor o un socio a través de la mesa."
 thailand.350.a: "Aplastarlos. El Sur conocerá el significado del orden."
 thailand.350.b: "La paz del Rey. Desarrolla el Sur, cógelo de vuelta."
 thailand.350.c: "Habla con ellos. Incluso los viejos enemigos pueden firmar un papel."
 thailand.350.e: "No tenemos una política clara. Administrar como viene."
 thailand.356.t: "Los camiones"
 thailand.356.d: "Otro barrido y otro público fuera de otra estación de policía del distrito. Terminó con cientos de detenidos apilados boca abajo en camiones del ejército, y decenas muertas de asfixia para el momento en que llegaron al campamento. Las imágenes viajan por el mundo musulmán antes de Bangkok puede componer una declaración. Sea lo que sea que la operación haya logrado sobre el terreno, acaba de radicalizar una generación y entregar a la insurgencia su mito fundador."
 thailand.356.a: "Una catástrofe. El Sur no olvidará esto."
 thailand.357.t: "Pacificación completa"
 thailand.357.d: "Los generales informan de la misión cumplida. Las bombas de carretera se han detenido, las celdas están rotas, los puestos de control están bajando. Por cada métrica las medidas del ejército, el Sur Profundo es pacificado. Debajo del silencio la queja no ha muerto. Simplemente ha aprendido a esperar."
 thailand.357.a: "Las armas están en silencio. Veremos a las embajadas."
 thailand.358.t: "Una calma del sur"
 thailand.358.d: "No había ningún tratado y no hay autonomía, pero la violencia se ha reclinado en una silenciosa manejada. Corrientes de desarrollo real, notables locales están dentro de la carpa, y la legitimidad de la monarquía en el sur se restaura tranquilamente. Es una calma mantenida por la presencia y el patrocinio, observada en lugar de resolver."
 thailand.358.a: "La corona mantiene la paz que ha ganado."
 thailand.359.t: "El establecimiento hace retroceder"
 thailand.359.d: "El proyecto de ley especial-autonomía ha filtrado, y la reacción en Bangkok es feroz. Generales advierten de desmembramiento, los conservadores del palacio murmuran sobre el precedente, y la prensa nacionalista lo llama rendirse. Los negociadores están listos para firmar, pero el gobierno debe decidir si pasará el capital político para mantener la línea, o regar el marco a algo que el centro puede tragar."
 thailand.359.a: "Mantén la línea. El acuerdo debe ser real."
 thailand.359.b: "Relájate. Mantener la paz, perder el principio."
 thailand.360.t: "El Acuerdo de Pattani"
 thailand.360.d: "Las firmas en una sola página terminan la guerra más larga dentro de las fronteras modernas del Reino. El Sur gana un autogobierno genuino dentro de una Tailandia unitaria, las armas se entregan y los desplazados comienzan a regresar. Es imperfecto, impugnado e histórico, y por primera vez en una generación, los hijos de Pattani crecerán sin toque de queda."
 thailand.360.a: "Paz, por fin, en el sur."
 thailand_news.24.t: "Masacre en Tak Bai"
 thailand_news.24.d: "Filmación de detenidos asfixiados en camiones del ejército fuera de Tak Bai ha llegado a todas las capitales del mundo musulmán. Kuala Lumpur, Yakarta y Ankara han convocado embajadores tailandeseses y los órganos de derechos humanos exigen una investigación. La política sur de Bangkok es ahora un prefacio para la atrocidad, y la insurgencia nunca ha tenido una temporada de reclutamiento más fácil."
 thailand_news.24.a: "El mundo está mirando al Sur."
 thailand_news.25.t: "La paz viene a Pattani"
 thailand_news.25.d: "Después de una generación de derramamiento de sangre, las armas han caído en silencio en el sur profundo de Tailandia. Ya sea por la mano del soldado o el bolígrafo del negociador, la insurgencia más larga de la historia moderna del Reino ha llegado a su fin. Los caminos están abiertos, los mercados llenos y una normalidad de guerra regresa a Pattani, Yala y Narathiwat."
 thailand_news.25.a: "Una larga guerra termina."
 thailand_news.23.t: "A Gobierno de Unidad Nacional"
 thailand_news.23.d: "Los tanques se han retirado de las intersecciones, pero el acuerdo alcanzado en la noche superará la crisis. El gobierno elegido mantiene su mandato y la urna su lugar, pero los jefes de servicio ahora se sientan en la mesa del gabinete, y todo el mundo en Bangkok entiende quién garantizó la paz. Es un compromiso que nadie ama y nadie se atreve a romper, un gobierno nacional con el ejército dentro de la tienda."
 thailand_news.23.a: "Poder, compartido y vigilado."
 thailand.3.c: "Cultivos, no amapolas. Desarrollo alternativo del Fondo."
 thailand.361.t: "Cuerpos de la Carretera"
 thailand.361.d: "La campaña de tres meses ha terminado y la historia está dentro. Las organizaciones de derechos documentan unos 2.800 muertos, la gran mayoría nunca cargado con nada, muchos ni siquiera nombrados. Los Blacklists establecieron viejas puntuaciones, y las cuotas se cumplieron con los cuerpos. Las calles son más tranquilas y las encuestas son más altas que nunca, pero en el cuartel y el palacio, los hombres están tomando notas sobre un gobierno que mata en un horario."
 thailand.361.a: "Los números son los números. No nos disculpamos."
 thailand.362.t: "Crops no Poppies"
 thailand.362.d: "La interdicción por sí sola sólo ha empujado el comercio a través de la siguiente cresta. Los agrónomos y la gente de salud pública tienen una propuesta diferente. Pagar a los agricultores montañosos para cultivar café, macadamia y fruta en lugar de opio, tratar la adicción como enfermedad más que crimen, y dejar que los cultivos legales hagan lo que los helicópteros nunca pudieron. Es más lento, es más barato, y pide al estado que deje de disparar y comience a comprar."
 thailand.362.a: "Desarrollo alternativo del Fondo. Gana las colinas con mercados."
 thailand.362.b: "Sigue interdiciendo. Mantenga la línea que tenemos."
 thailand_news.5.t: "Tailandia revela el corredor económico oriental"
 thailand_news.5.d: "Bangkok ha abierto formalmente su zona de desarrollo insignia en el Seaboard Oriental, con ferrocarril de alta velocidad a tres aeropuertos, una aerotropolis U-Tapao expandida y paquetes de incentivos dirigidos a vehículos eléctricos, aeroespaciales y biotecnología. Los analistas lo llaman el proyecto económico tailandés más ambicioso desde el programa Eastern Seaboard del decenio de 1980."
 thailand_news.5.a: "La Tierra de Sonrisas significa negocio."
 thailand.50.b: "Suaviza el golpe y protege a la gente."
 thailand.55.b: "Construye el coche nacional."
 thailand.200.t: "La Constitución Popular"
 thailand.200.d: "Organizaciones de la sociedad civil, académicos y líderes comunitarios celebran una constitución escrita con auténtica participación pública. Por primera vez en décadas, los tailandeses comunes sienten que tenían una mano en su propia ley básica, y las calles de Bangkok son inesperadamente festivas."
 thailand.200.a: "La democracia tiene raíces."
 thailand.201.t: "Registros en Don Mueang"
 thailand.201.d: "Los números de pasajeros en Don Mueang superan cada registro anterior, y la campaña Amazing Thailand ha trabajado más allá de las proyecciones de cualquiera. Los ejecutivos de Airline anuncian nuevas rutas directas y los operadores turísticos están reservando las próximas dos temporadas ya. La pregunta que tenemos ante nosotros es qué hacer con los ingresos."
 thailand.201.a: "Reinvertirlo en los centros turísticos del sur."
 thailand.201.b: "Cierra el viento."
 thailand.202.t: "Un hambre mundial para el arroz"
 thailand.202.d: "Una sequía en el subcontinente indio y las fallas de cultivos en todo el sudeste asiático han enviado los precios mundiales del arroz a una década alta. Tailandia se encuentra en las reservas de variedades premium Hom Mali y Jasmine que cada importador de granos quiere inmediatamente. El ministerio de comercio está esperando nuestra respuesta."
 thailand.202.a: "Vender el arsenal a precios premium."
 thailand.202.b: "Mantenga el arroz en casa y subvencione los precios nacionales."
 thailand.203.t: "La Solicitud de Basura"
 thailand.203.d: "Estados Unidos. Pacific Command ha hecho una solicitud silenciosa pero formal para ampliar los derechos de acceso en la base aérea U-Tapao para logística, vigilancia y preposición. Los estadounidenses están dispuestos a pagar, en transferencias de tesorería, actualizaciones de equipos y cobertura política. La necesidad pública nunca conoce los detalles."
 thailand.203.a: "Acepta el acceso y toma el dinero."
 thailand.203.b: "Diclina cortésmente. Territorio tailandés, soberanía tailandesa."
 thailand_news.6.t: "Los bendecidos del bambú, no se rompe"
 thailand_news.6.d: "Tailandia ha alcanzado un importante alineamiento diplomático de doble vía, al mismo tiempo que profundiza su relación convencional con Washington y firma una nueva alianza económica marco con Beijing. El ministerio extranjero de Bangkok lo llama 'diplomacia bambú', flexible, resiliente y arraigado en intereses tailandeses por encima de todos los demás."
 thailand_news.6.a: "Un notable acto de equilibrio."
 thailand_news.7.t: "Tailandia paga al FMI dos años antes"
 thailand_news.7.d: "Bangkok ha liquidado toda su obligación de la deuda del Fondo Monetario Internacional, dos años antes de lo previsto. El pronto reembolso, anunciado sin fanfarre por el Ministerio de Finanzas, cierra el capítulo sobre la crisis financiera asiática de 1997 y libera a Tailandia de las últimas condiciones adjuntas al programa de rescate de 1997."
 thailand_news.7.a: "La Tierra de Sonrisas paga sus deudas."
 thailand.205.t: "Tecnócratas contra la Guardia Vieja"
 thailand.205.d: "El nuevo gabinete de estilo CEO ha establecido objetivos de desempeño para cada ministerio, y varios secretarios permanentes han sido reemplazados por ejecutivos de negocios. La vieja burocracia no se divierte. Una guerra tranquila está en marcha entre los tecnócratas empujando 'Thailand Inc.' y los funcionarios de carrera que han dirigido los ministerios durante treinta años."
 thailand.205.a: "Retrocedan los tecnócratas. Reformar los ministerios."
 thailand.205.b: "Protege la burocracia profesional. Mantén a los ministerios en funcionamiento y a los generales."
 thailand.207.t: "Prayuth Fatigue"
 thailand.207.d: "Tres años después, las promesas de reforma de los generales se agotan. El comité de redacción constitucional ha sido reconstituido dos veces. La fecha electoral se ha movido dos veces. Un pregrado con una señal fuera del Parlamento enfrenta diecisiete cargos. La luna de miel ha terminado."
 thailand.207.a: "Gestionaremos cuidadosamente la transición."
 thailand.208.t: "El Standoff continúa"
 thailand.208.d: "Pasan días, luego semanas. Las protestas no se han derrumbado, pero tampoco han escalado. El gobierno no concede ni aclara la plaza. EventoCualmente ambos lados parpadean. La pregunta es quién parpadeó menos."
 thailand.208.a: "Busca una resolución tranquila con concesiones."
 thailand.208.b: "Los manifestantes aceptan el crédito. El gobierno tiene la culpa."
 thailand_news.8.t: "El palacio toma la rueda"
 thailand_news.8.d: "El establecimiento real tailandés ha formalizado su papel en la gestión de los activos del Crown Property Bureau, consolidando autoridad sobre cientos de miles de millones de baht en las tenencias comerciales en una estructura que reporta directamente al palacio. Analistas en Bangkok debaten si esto representa una novedad constitucional o simplemente un teñido legal de arreglos que han existido informalmente durante décadas."
 thailand_news.8.a: "La dinastía Chakri soporta."
 thailand.209.t: "Los niños están en línea"
 thailand.209.d: "Un movimiento de protesta dirigido por jóvenes ha estallado simultáneamente en Bangkok, Chiang Mai y tres campus provinciales. Sus demandas se transmiten sobre aguas vivas antes de que la policía haya inscrito sus barreras. El gobierno debe decidir si comprometerse o esperar."
 thailand.209.a: "Campeona su causa."
 thailand.209.b: "Sigue gobernando. Deja que pase el momento."
 thailand.210.t: "Una carta de los barracones"
 thailand.210.d: "Un documento anónimo, distribuido entre oficiales superiores y luego filtrado, describe los planes para una reducción ordenada por civiles de la influencia militar sobre las promociones y adquisiciones. El texto lleva una advertencia. El ejército está mirando, y la paciencia tiene un límite. Esto puede ser una verdadera trama de golpes en sus primeras etapas, o un farol. La elección de la respuesta define qué tipo de país es este."
 thailand.210.a: "Actúe ahora y purgue los conspiradores antes de que puedan organizarse."
 thailand.210.b: "Procede en silencio. No dignificaremos las fugas con una respuesta."
 thailand.211.t: "Las provincias han hablado"
 thailand.211.d: "Los regresos del noreste y el norte superior están en, y distrito después de que el distrito se ha hundido a la lista de reformas. Los diputados veteranos de treinta años han perdido a veintiocho años que hicieron campaña en las redes sociales. El mapa electoral está siendo redoblado por los votantes que nunca han tenido un diputado local tomar sus llamadas."
 thailand.211.a: "Aproveche el mandato."
 thailand.211.b: "Govern para todos ellos, no sólo nuestros votantes."
 thailand.212.t: "Responden los Conglomerados"
 thailand.212.d: "La subasta de los bloques de espectro previamente monopolizados ha producido exactamente la caída del viento que predijeron los reformadores. La misma semana, un desafío legal coordinado de los tres conglomerados más grandes aterrizó en el Tribunal Constitucional, y una columna de opinión en un periódico realista describió el ministerio financiero como « poseído ideológicamente».La política de ruptura está funcionando, y tiene enemigos poderosos."
 thailand.212.a: "Presiona. La ley está de nuestro lado."
 thailand.212.b: "Ofrezca un asentamiento, un viento controlado en lugar de una ruptura forzada."
 thailand.213.t: "Primer año de la República"
 thailand.213.d: "Doce meses después de la declaración, y el país todavía está aquí, con moretones, energizados y discutiendo, pero aquí. El movimiento realista no ha desaparecido. Ha mutado en una campaña jurídica y cultural. La primera elección presidencial está programada. La pregunta antes del gabinete es si llamarlo un éxito, reconocer la fractura o simplemente seguir con el gobierno."
 thailand.213.a: "Hemos construido algo que durará."
 thailand.213.b: "La causa Chakri no está terminada. La gente recuerda."
 thailand.213.c: "La república sobrevive, por ahora. Todavía hay mucho que defender."
 thailand.214.t: "La Columna pasa el Monumento"
 thailand.214.d: "Tres horas de artillería, armadura y infantería, las fuerzas armadas en plena orden de desfile a lo largo de la Avenida Ratchadamnoen. Las multitudes son más grandes de lo que esperaban los planificadores. Para un país que ha olvidado sus guerras y absorbido sus golpes como rutina, la pantalla aterriza con peso inusual."
 thailand.214.a: "Una nación saluda a sus defensores."
 thailand_news.9.t: "Tailandia legaliza el matrimonio del mismo sexo"
 thailand_news.9.d: "El Parlamento tailandés ha aprobado la Ley de Igualdad de Matrimonio por mayoría de dos tercios, convirtiéndose en el primer país del sudeste asiático en otorgar plenos derechos matrimoniales independientemente del género. El acto tiene efecto inmediatamente. Las celebraciones en los distritos de Silom y Nimman de Chiang Mai han atraído decenas de miles. Varios gobiernos vecinos han emitido declaraciones expresando 'concern'."
 thailand_news.9.a: "Un hito para Asia."
 thailand_news.10.t: "La primavera sostiene"
 thailand_news.10.d: "Tres años desde que el gobierno de reforma asumió el cargo en una ola de protesta juvenil, Tailandia hoy completa una transición democrática plena. Se formaliza el control civil del ejército, se disuelve el senado designado y la primera elección libremente competitiva en dos decenios se celebra sin incidentes. Los observadores internacionales de diecisiete países han certificado el resultado."
 thailand_news.10.a: "La democracia tiene raíces."
 thailand_news.11.t: "Thai Wave llora Asia"
 thailand_news.11.d: "De Tokio a Taipei a Kuala Lumpur, el contenido tailandés está en todas partes. Serie de streaming, actos hip-hop, etiquetas de moda y una máquina de diplomacia gastronómica que el gobierno no planificó y no puede tomar pleno crédito. La producción cultural de Tailandia ha superado el valor y alcance de sus vecinos."
 thailand_news.11.a: "El mundo quiere lo que Tailandia está haciendo."
 thailand.215.t: "Stock of the Kingdom"
 thailand.215.d: "La primera revisión interna del nuevo gobierno está completa. Los funcionarios han recogido el número, los ratios de deuda, las lagunas de infraestructura, los equilibrios comerciales y la moral pública, y tres caminos se destacan del análisis. El gobierno debe elegir su primera prioridad. Lo que sea elegido ahora dará forma a la trayectoria del país durante los próximos dos años."
 thailand.215.a: "Enfoque sobre la recuperación. Reconstruye la economía desde el suelo."
 thailand.215.b: "Enfoque En Orden. Fortalecer las instituciones antes de reformarlas."
 thailand.215.c: "Enfoque sobre el mundo. Liderazgo con diplomacia y comercio."
 thailand.216.t: "El movimiento de los generales"
 thailand.216.d: "La llamada de resistencia del gobierno ha salido a los leales en la policía, la patrulla fronteriza, las redes de la sociedad civil y las calles. Si la gente responde es la pregunta que decide la próxima década de la política tailandesa. En la sala de operaciones, el personal está viendo despliegues unitarios en el mapa y contando."
 thailand.216.a: "Mantén la línea."
 thailand.217.t: "Pekín Signals Displeasure"
 thailand.217.d: "La nota de la embajada china es diplomática pero inequívocamente fría. La creciente alineación de Tailandia con Washington no ha pasado desapercibida. Los medios estatales de Pekín mencionan la postura contradictoria de Tailandia. Las delegaciones de inversión postergan silenciosamente sus visitas. La pregunta antes de Bangkok es cuánto de esto para absorber y cuánto para desviarse."
 thailand.217.a: "Deja enfriar la relación. Hemos tomado nuestra decisión."
 thailand.217.b: "Reasegurar a Pekín silenciosamente con un mensaje personal del PM."
 thailand.218.t: "Washington Adjusts"
 thailand.218.d: "Estados Unidos. El Departamento de Estado ha tomado nota de la nueva alineación BRI en Tailandia con la neutralidad estudiada en público, pero el personal del Congreso ha comenzado a hacer preguntas puntuales sobre la financiación de Cobra Gold y los compromisos de tratados. La evaluación del Pentágono, filtrada a un think-tank de Washington, describe Tailandia como 'estratégicamente ambiguo.' Bangkok debe manejar la relación."
 thailand.218.a: "Acepta el enfriamiento. Somos una nación soberana."
 thailand.218.b: "Reaseguros privados al Embajador. Esto no cambia nada esencial."
 thailand.219.t: "Los Generales en la Permanencia"
 thailand.219.d: "La decisión de institucionalizar la tutela militar ha llegado a páginas editoriales internacionales. El Financial Times lo describe como 'autoritarismo gestionado'. Tres embajadores europeos solicitaron reuniones con el ministerio extranjero en la misma semana. En casa, académicos y estudiantes de mentalidad reformista están leyendo la cobertura y sacando sus propias conclusiones."
 thailand.219.a: "Gobiernan por nuestras propias luces. El comentario extranjero es irrelevante."
 thailand.219.b: "Los críticos están equivocados sobre Tailandia. Vamos a demostrar que están equivocados en nuestros términos."
 thailand.220.t: "El Sur vuelve a recibir visitantes"
 thailand.220.d: "Dos años desde que el tsunami cerró las playas de la costa Andamán a todos menos los equipos de reparación, el último complejo ha reabierto. La Autoridad Turística de Tailandia ha llevado a cabo una cuidadosa campaña de rehabilitación, y las reservas sugieren que funcionó. El sur ha vuelto."
 thailand.220.a: "Tailandia está abierta."
 thailand.221.t: "La Reconstrucción Sur está completa"
 thailand.221.d: "Los equipos internacionales de ayuda e ingenieros gubernamentales han finalizado el programa de reconstrucción de infraestructura costera. Los caminos son reconstruidos, los muelles de pesca reparados, y la red eléctrica restaurada. Los socios de ayuda han sido agradecidos y el andamio está bajando."
 thailand.221.a: "El sur se para de nuevo."
 thailand.222.t: "La crisis financiera mundial"
 thailand.222.d: "El colapso de Lehman Brothers en Nueva York ha enviado ondas de choque a través de mercados asiáticos. El sector exportador de Tailandia está observando cuidadosamente sus libros de pedidos. La pregunta para Bangkok es si los amortiguadores financieros construidos durante el último decenio tendrán lugar, o si la crisis encontrará su camino a través del muro marino."
 thailand.222.a: "Tailandia hace tiempo con la tormenta. Nuestra prudencia ha pagado."
 thailand.222.b: "La tormenta ha llegado. Debemos prepararnos durante dos años difíciles."
 thailand.223.t: "Trescientos y setenta y siete"
 thailand.223.d: "En la sala de lectura del Consejo Privado y en los pasillos de la rama de inteligencia interna del ejército, los analistas están procesando los resultados electorales. Trescientos setenta y siete asientos. Mayoría de partido único. Un mandato sin precedentes en la historia democrática tailandesa, y la red no tiene ningún instrumento fiable contra ella. Hoy no."
 thailand.223.a: "Los pueblos han hablado. Por ahora."
 thailand.224.t: "El Rice Reckoning"
 thailand.224.d: "Los precios mundiales del arroz no han cooperado. El suministro mundial ha dejado al gobierno conteniendo millones de toneladas de arroz almacenado comprado muy por encima del valor de mercado, y el arbitraje que supuestamente debía financiar el plan no se ha materializado. El Ministerio de Finanzas ha puesto tres opciones sobre la mesa. Dos de ellos son políticamente posibles."
 thailand.224.a: "Absorbe las pérdidas y cubre el déficit del Tesoro."
 thailand.224.b: "Deje que el esquema colapse y tome el golpe político ahora."
 thailand.225.t: "Los caminos llegan a las aldeas"
 thailand.225.d: "Los ministros en sombreros duros cortan las cintas en nuevas carreteras a través de la meseta de Khorat y las espuelas ferroviarias hacia los valles del norte. Las oficinas provinciales abren sus puertas en ciudades que sólo han enviado a sus hijos para construir la capital. Por una vez, el desarrollo llega a casa de las personas que entregaron el deslizamiento."
 thailand.225.a: "La tierra interior es recompensada."
 thailand.226.t: "El Reino del Rey Vajiralongkorn"
 thailand.226.d: "El año de luto está terminando. El nuevo enfoque del Rey en el trono es diferente al de su padre. Una presencia más visible en público, un agarre más estricto sobre la propiedad coronaria y una clase diferente de carisma real. La red que sirvió al Noveno Reino debe aprender a servir al Décimo. No es la misma red."
 thailand.226.a: "El Reino entra en una nueva era."
 thailand.227.t: "Los Veteranos Objeto"
 thailand.227.d: "El anuncio de que se eliminará la conscripción ha provocado una respuesta coordinada de oficiales jubilados y asociaciones veteranas. En los cuarteles, los NCOs mayores se quejaban de un ejército «hueto». La prensa publica fotografías de los viejos generales en uniforme completo, que se ven infelices. El gobierno esperaba esto, pero la amplitud del retroceso es más alta que los modelos sugeridos."
 thailand.227.a: "Mantenganse firmes. La reforma es correcta."
 thailand.227.b: "Ofrecer una ceremonia de reconocimiento de veteranos y absorber la crítica simbólicamente."
 thailand.228.t: "Dividendo del turismo"
 thailand.228.d: "La primera temporada después del acuerdo de esquí abierto está en los libros. Los números de la Autoridad Turística son fuertes. Las cifras de llegada ascienden al 12 por ciento, el gasto diario promedio es del 19 por ciento, y los centros turísticos del sur, que se benefician más de las nuevas rutas de transporte de bajo costo, están reportando su mejor trimestre en una década."
 thailand.228.a: "El baht fluye."
 thailand_news.13.t: "Tailandia, Gateway of Asia"
 thailand_news.13.d: "El gobierno tailandés ha proclamado formalmente su corredor de infraestructura meridional, ya sea canal o puente terrestre, «abierta a todas las naciones en condiciones equitativas».La inversión internacional ya ha comenzado a fluir hacia la Zona Económica del Sur y Bangkok acoge delegaciones de doce países que buscan acuerdos preferenciales de tránsito."
 thailand_news.13.a: "La Tierra de Sonrisas ordena los carriles marinos."
 thailand.250.t: "El gobierno Blinks"
 thailand.250.d: "La huelga ha mantenido al país por mucho tiempo, y el costo se ha vuelto insoportable para los hombres en el poder. Los muelles, los carriles, los ministerios, todo se ha detenido y las calles pertenecen al movimiento. En lugar de apostar en el ejército disparando contra su propio pueblo, el gabinete abre la puerta a la negociación. Este es el camino pacífico al poder, ganado por el nervio en lugar del rifle."
 thailand.250.a: "Ganamos las calles. Ahora tomamos el estado."
 thailand.259.t: "Orden de Restauración Generales"
 thailand.259.d: "La huelga se extendió pero nunca rompió la voluntad del gobierno, y el alto mando se quedó sin paciencia primero. Los tanques están en las avenidas, los líderes de la huelga están siendo redondeados, y un toque de queda está en vigor. La revolución ha sido aplastada antes de que pudiera apoderarse del poder, y los hombres uniformados ahora gobiernan en nombre del orden. La carretera roja está cerrada."
 thailand.259.a: "La revolución está rota."
 thailand.251.t: "Los Recoils Mundiales"
 thailand.251.d: "El nuevo gobierno de Tailandia se ha anunciado al mundo. La respuesta de Washington llegó antes de que la tinta secara en los documentos fundadores del partido. Las sanciones económicas, un oleoducto de ayuda congelado y una declaración del Departamento de Estado que logró ser condescendiente y amenazante. Beijing y Hanoi, por el contrario, han enviado felicitaciones."
 thailand.251.a: "Que nos sancionen. No hicimos esta revolución para su aprobación."
 thailand.252.t: "Los Royalists se marchan"
 thailand.252.d: "La reforma agraria ha respondido a la pregunta que la sociedad cortés de Bangkok prefirió no hacer. Los que construyeron su riqueza en el viejo sistema, los propietarios ausentes, la red de inversión alrededor del palacio, las familias provinciales que mantuvieron diez mil rai en cada uno de sus nombres de hijos, han tomado su decisión. La mayoría de ellos ya están en aviones a Singapur, Londres y Los Ángeles."
 thailand.252.a: "Un país no es sus propietarios."
 thailand.253.t: "El dilema de Chakri"
 thailand.253.d: "La dinastía Chakri ha gobernado a Siam y Tailandia durante más de dos siglos. La institución de la monarquía, cualquiera que sea el pensamiento de los individuos que lo sostenían, está tejida en el calendario civil, el sistema legal, la geografía de Bangkok y la arquitectura emocional de una parte significativa de la población. El partido debe decidir qué va a hacer con él.\n\nEl compromiso del partido con las metas de la revolución no está en duda. La única pregunta es si un descanso limpio o una transición gestionada les sirve mejor."
 thailand.253.a: "Abolir la monarquía. No tiene lugar en la república popular."
 thailand.253.b: "Mantenga una figura constitucional mientras el partido gobierna."
 thailand_news.14.t: "Las cataratas de la cortina de bambú"
 thailand_news.14.d: "Tailandia ha formalizado su alineación con Laos y Vietnam en un marco de solidaridad regional que los analistas ya están llamando a la «Cortina de Bambú».Por primera vez desde Camboya de Pol Pot, un gobierno del sudeste asiático ha declarado una orientación comunista. Las capitales occidentales están recalculando. Beijing es acogedor. El baht tailandés ha sido reemplazado por una nueva moneda durante la noche."
 thailand_news.14.a: "El mapa del sudeste asiático ha cambiado."
 thailand_news.31.t: "El Countryside rodea la ciudad"
 thailand_news.31.d: "Después de años de insurgencia desestimada por Bangkok como remanente de una guerra muerta, el Partido Comunista de Tailandia ha declarado la guerra popular abierta. Las zonas de base en las tierras altas del norte y la meseta de Isaan están ahora más allá del alcance de las fuerzas de seguridad, y los reclutas están fluyendo desde aldeas que el estado dejó de servir hace mucho tiempo. Los analistas militares que contaron el movimiento están revisando silenciosamente sus evaluaciones."
 thailand_news.31.a: "Las colinas son suyas ahora."
 thailand_news.32.t: "Tailandia se une al despertar del dragón"
 thailand_news.32.d: "Bangkok ha firmado una asociación radical con Beijing. Contiene inversión, acceso al comercio y un entendimiento de seguridad que coloca a Tailandia revolucionaria firmemente dentro de la órbita china. Los medios estatales lo llaman la alineación natural de dos vecinos socialistas. Los diplomáticos occidentales lo llaman satélite adquiriendo un sol. Las grúas de construcción sobre Bangkok sugieren que el dinero, al menos, es real."
 thailand_news.32.a: "La órbita está fijada."
 thailand_news.33.t: "Una Federación de los Tres Ríos"
 thailand_news.33.d: "Tailandia, Laos, Vietnam y Camboya han anunciado un marco para una federación socialista indonesia, con Bangkok como su corazón industrial y diplomático. Por primera vez, las revoluciones del Mekong hablan con una sola voz, y esa voz es lo suficientemente fuerte que los grandes poderes deben responder en lugar de ignorarla. Si cuatro capitales orgullosos pueden compartir un proyecto sigue siendo la pregunta abierta."
 thailand_news.33.a: "Indochina habla como uno."
 thailand.260.t: "Las camisas rojas toman Ratchaprasong"
 thailand.260.d: "El voto rural ha llegado a Bangkok. Decenas de miles de camisas rojas han ocupado la intersección de Ratchaprasong, el corazón comercial de la capital, y levantar barricadas de bambú afilado y neumáticos apilados. Los centros comerciales están cerrados, el tráfico se detiene y el movimiento dice que permanecerá hasta que el gobierno llame a una elección. El ejército está esperando la palabra."
 thailand.260.a: "Que se queden. La ciudad puede sobrevivir a una intersección ocupada."
 thailand.260.b: "Limpia la intersección. La capital no puede permanecer cerrada indefinidamente."
 thailand.270.t: "El Kingmaker"
 thailand.270.d: "El partido de Anutin Charnvirakul mantiene el bloque decisivo en el nuevo parlamento. Su precio por la entrada de la coalición no es irrazonable, un puñado de ministerios, un compromiso con el gasto en desarrollo rural y una promesa de política muy particular. Pero las coaliciones siempre cuestan más de lo que sugiere la oferta inicial."
 thailand.270.a: "Forma la coalición. La mayoría gobernante vale el precio."
 thailand.270.b: "Declin. Podemos gobernar sin ellos, o no gobernar en absoluto."
 thailand.271.t: "Ministerio de Ministerios"
 thailand.271.d: "Se concluyen las negociaciones a nivel de gabinete. Bhumjaithai recibe el Ministerio de Salud Pública, el Ministerio de Agricultura y un viceprimer ministro. El papeleo está firmado, la coalición es oficial, y el tráfico de caballos comienza inmediatamente."
 thailand.271.a: "La coalición sostiene. Por ahora."
 thailand.272.t: "El Movimiento de Repetición"
 thailand.272.d: "Los miembros conservadores de la coalición, y grupos de sociedad civil alineados por el realista fuera de ella, han montado una campaña formal de derogación contra el acto de despenalización del cannabis. Tienen suficientes firmas para forzar un debate parlamentario. La cuestión es si el gobierno lucha por preservar la política o cambiarla por la paz política."
 thailand.272.a: "Repetir el acto. Estabilidad vale más que el Green Rush."
 thailand.272.b: "Mantenganse firmes. La política se mantiene. Que se lo lleven a los tribunales."
 thailand.273.t: "Una Oferta de Bangkok"
 thailand.273.d: "Tailandia extiende su mano a la Shan. El reconocimiento, las armas y el tesoro de trabajo están sobre la mesa para un estado Shan que se alinea con el Reino. La autonomía sería real. Así que la dependencia que viene con ella, y Naypyidaw no perdonará la elección."
 thailand.273.a: "Acepta la protección de Bangkok."
 thailand.273.b: "Nos quedaremos solos."
 thailand.280.t: "Primera victoria en la carretera"
 thailand.280.d: "Chaiseri Metal y el Primer Ganador 4x4 de Rubber han encontrado compradores en toda la Asociación. infantería marina indonesia, constabulario filipino, un regimiento fronterizo malayo. El primer lote ha enviado. La comisión del agente de exportación es más pequeña que el dividendo de la reputación. El sudeste asiático sabe que Tailandia hace las cosas que vale la pena comprar."
 thailand.280.a: "Firme los contratos. El mercado de la ASEAN es nuestro."
 thailand.281.t: "El Tren de Marines en Sattahip"
 thailand.281.d: "El primer ejercicio anfibio dedicado del Royal Thai Marine Corps en una década pone un batallón a través de carriles predeterminados en la base naval Sattahip. La nueva doctrina está escrita, se financia la expansión de los muelles, y el comandante del Cuerpo ha dejado de disculparse por el presupuesto y comenzó a planear el próximo ejercicio."
 thailand.281.a: "Del mar."
 thailand_news.15.t: "Tailandia, Arsenal emergente de la ASEAN"
 thailand_news.15.d: "Una ola de contratos de exportación de defensa firmados en Bangkok este trimestre ha impulsado a los analistas regionales a reconsiderar la posición de Tailandia en el mercado de defensa del sudeste asiático. First Win MRAPs están en inventarios filipinos e indonesios, y las fusibles de artillería manufacturadas tailandesas se encuentran en reservas malasias. El Royal Thai Arsenal ya no es un programa de contratación nacional. Es un proveedor regional."
 thailand_news.15.a: "Las fábricas del Reino están trabajando."
 thailand_news.16.t: "Bangkok anuncia la Doctrina de Operaciones Multidominios"
 thailand_news.16.d: "El Comando Supremo de las Fuerzas Armadas Reales de Tailandia ha publicado la primera doctrina oficial de operaciones multidominios de Tailandia, integrando la guerra cibernética, electrónica, ataques con drones y maniobras convencionales en un marco operativo unificado. Desarrollado en ejercicios conjuntos con socios americanos y australianos, la doctrina MDO indica que Tailandia ya no concibe la guerra como un concurso de un solo dominio."
 thailand_news.16.a: "El Reino lucha en cada frente."
 thailand.310.t: "El Reactor se vuelve crítico"
 thailand.310.d: "A las 3.47 de la mañana, los instrumentos de la sala de control suben a cero. El primer reactor de agua presurizado de Tailandia ha alcanzado la crítica. El ingeniero jefe lo llama un hito técnico, y el gabinete lo llama seguridad energética. Ambos son correctos. La red nacional se verá diferente por la mañana."
 thailand.310.a: "Una nueva era de poder base."
 thailand.311.t: "Phnom Penh Responds"
 thailand.311.d: "El ministerio extranjero de Camboya ha respondido a las overtures de Bangkok, más formalmente de lo esperado, más calurosamente que temido. El cálculo del gobierno de Phnom Penh está claro. Una estrecha relación con Tailandia es una cobertura contra la sobredependencia en Beijing y una corriente de ingresos que puede proporcionar la economía de crecimiento más rápido de la región."
 thailand.311.a: "Bienvenida a la asociación."
 thailand.311.b: "Engage cauteloso. El progreso lleva tiempo."
 thailand.312.t: "El Diálogo de Yakarta"
 thailand.312.d: "La delegación de Indonesia llega sin un comunicado conjunto redactado. Yakarta quiere saber lo que Bangkok pretende. ¿Una verdadera asociación de iguales regionales, o una competencia por la función de liderazgo de la ASEAN que Indonesia ha considerado desde hace mucho tiempo su propio? Ambas opciones están sobre la mesa. Tampoco es barato."
 thailand.312.a: "Alianza. Ejercicios conjuntos, doctrina compartida, ganancia mutua."
 thailand.312.b: "Competencia. Saldremos de la influencia de Jakarta en su propio vecindario."
 thailand.313.t: "El archivo de contrato chino"
 thailand.313.d: "La evaluación del Ministerio de Finanzas es inequívoca. Los contratos de infraestructura firmados bajo el marco BRI han entregado carreteras y ferrocarriles que Tailandia necesitaba, pero los términos financieros incrustaron la influencia de Beijing en las tuberías del proyecto para una generación. La pregunta que tiene ante sí el gabinete es si seguir aprovechando el capital chino o absorber el dolor a corto plazo de la renegociación."
 thailand.313.a: "Mantenga la financiación. Los proyectos se ejecutan."
 thailand.313.b: "Renegociado. La soberanía cuesta dinero."
 thailand.314.t: "Washington pide una revisión"
 thailand.314.d: "Estados Unidos. El Comando del Pacífico ha solicitado oficialmente un examen de seguridad bilateral. En la práctica, es una invitación a profundizar la alineación convencional de Tailandia, tomar los paquetes de entrenamiento y aceptar la visibilidad política que viene con ser el socio sudeste asiático más confiable de Estados Unidos. La alternativa es mantener la cobertura."
 thailand.314.a: "Profundice la alianza. Tomar la formación y el compromiso."
 thailand.314.b: "Distancia. La cobertura sirve a Tailandia mejor."
 thailand_news.17.t: "Tailandia enciende su primer reactor nuclear"
 thailand_news.17.d: "El Gobierno Real de Tailandia ha llevado a la primera central nuclear comercial de Tailandia al pleno funcionamiento, convirtiéndose en el primer país del sudeste asiático en operar energía nuclear civil. El reactor de agua presurizado de 600 megavatios, ubicado en la provincia de Chachoengsao, suministrará aproximadamente el 8 por ciento de la demanda nacional de electricidad. Los analistas notan la doble utilidad del reactor. Ofrece seguridad energética y un nuevo eje de prestigio técnico en una región donde la capacidad nuclear es cada vez más un marcador de la ambición de potencia media."
 thailand_news.17.a: "El Reino se une a la era nuclear."
 thailand.315.t: "Minas terrestres en Ta Muen Thom"
 thailand.315.d: "Una explosión de minas terrestres cerca del complejo del templo de Ta Muen Thom ha herido a tres soldados del Ejército Real de Tailandia. Ambos lados acusan al otro de plantarlo. El incidente ha desencadenado protestas nacionalistas en Bangkok y Phnom Penh."
 thailand.315.a: "Demanda respuestas y movilización de sentimientos nacionalistas."
 thailand.315.b: "Solicitar la mediación de la ASEAN y dejar que los diplomáticos dirijan."
 thailand.316.t: "Disparos en Ta Muen Thom"
 thailand.316.d: "Las escaramuzas se han roto a lo largo de la frontera disputada. Ambos gobiernos están bajo presión de sus militares y movimientos nacionalistas. El Secretario General de la ASEAN ha emitido una declaración en que se pide moderación."
 thailand.316.a: "Presiona la ventaja."
 thailand.316.b: "Aceptar la cesación del fuego de la ASEAN."
 thailand.317.t: "La guerra de julio, plena participación militar"
 thailand.317.d: "Las fuerzas tailandesas y camboyanas han chocado en un compromiso fronterizo de una semana cerca de Ta Muen Thom y Preah Vihear. Los intercambios de artillería han causado bajas en ambas partes. La ASEAN ha convocado una cumbre de emergencia."
 thailand.317.a: "Aceptar el alto el fuego de la ASEAN después de demostrar fuerza."
 thailand.317.b: "Sube y sostenga las ganancias."
 thailand.318.t: "Tensiones Reignite en la frontera"
 thailand.318.d: "A pesar del acuerdo de cesación del fuego, se han reanudado los enfrentamientos a lo largo de la frontera en disputa. La crisis de diciembre prueba si los dos países pueden mantener su acuerdo o retroceder a un conflicto abierto."
 thailand.318.a: "Reafirmar la cesación del fuego."
 thailand.318.b: "Resume hostilities."
 thailand.319.t: "Washington dice No a F-35"
 thailand.319.d: "Estados Unidos ha rechazado la solicitud formal de Tailandia para los combatientes F-35 Lightning II, citando restricciones de transferencia de tecnología e inquietudes acerca de la relación de Tailandia con China."
 thailand.319.a: "Prosigue el programa Gripen E/F."
 thailand.319.b: "Aceptar el bloque F-16V 70 en su lugar."
 thailand.319.c: "Pivot al J-10CE. Beijing proveerá."
 thailand.320.t: "Paetongtarn Quitado por la Corte"
 thailand.320.d: "El Tribunal Constitucional de Tailandia ha retirado al Primer Ministro Paetongtarn Shinawatra del cargo tras una llamada telefónica filtrada en la que parecía socavar una institución independiente. Anutin Charnvirakul de Bhumjaithai se llama primer ministro cuidador."
 thailand.320.a: "Acepta el veredicto."
 thailand.320.b: "Reto el fallo."
 thailand.321.t: "Anutin toma el Helm"
 thailand.321.d: "Anutin Charnvirakul dirige un gobierno cuidador con el apoyo de confianza y ayuda del Partido Popular. Prometió nuevas elecciones dentro de cuatro meses."
 thailand.321.a: "El gobierno del cuidador comienza su trabajo."
 thailand.322.t: "Tailandia llega a las encuestas, febrero 2026"
 thailand.322.d: "Los tailandeses votan en una elección general que dará forma a la dirección política del país durante los próximos cuatro años. La guerra fronteriza ha impulsado el sentimiento nacionalista hacia Bhumjaithai. El Partido Popular lidera la encuesta urbana."
 thailand.322.a: "Bhumjaithai gana, y el mandato de Anutin es confirmado."
 thailand.322.b: "La coalición del Partido Popular toma el poder."
 thailand_news.18.t: "ASEAN Brokers Thai-Cambodian alto el fuego"
 thailand_news.18.d: "La Asociación de Naciones del Asia Sudoriental ha mediado con éxito un acuerdo de cesación del fuego entre Tailandia y Camboya, finalizando semanas de escaramuzas fronterizas cerca del complejo del templo Ta Muen Thom. El Secretario General de la ASEAN aclamó el resultado como prueba de que las instituciones regionales pueden contener puntos de inflexión bilaterales antes de escalar para abrir la guerra."
 thailand_news.18.a: "La región tiene, por ahora."
 thailand_news.19.t: "Elecciones tailandesas del Partido de Anutin"
 thailand_news.19.d: "Bhumjaithai ha obtenido 193 escaños en las elecciones generales de febrero de 2026 de Tailandia, entregando a Anutin Charnvirakul un mandato dominante y finalizando meses de incertidumbre del cuidador. El resultado consolida el centro político conservador-populista de Tailandia y establece el escenario para un período completo de cuatro años."
 thailand_news.19.a: "Un nuevo mandato para el Reino."
 thailand.330.t: "El Alma del Cuerpo de Oficiales"
 thailand.330.d: "Un argumento tranquilo pasa por el Estado Mayor. Una facción quiere un ejército profesional y apolítico de técnicos competentes. El otro quiere una célebre casta guerrero, el orgullo y la espada de la nación. La elección que el Reino hace ahora dará forma al cuerpo de oficiales para una generación."
 thailand.330.a: "Construye un cuerpo profesional."
 thailand.330.b: "Cultivar prestigio marcial."
 thailand.334.t: "El submarino comisionado"
 thailand.334.d: "Años después de la polémica del motor, el primer barco S26T es finalmente encargado en la Marina Real tailandesa. La tripulación ha entrenado duro para este día. Sea cual sea la política de la adquisición, Tailandia ahora opera un submarino moderno, y el equilibrio regional cambia un poco hacia el sur."
 thailand.334.a: "La flota se pone al mar."
 thailand_news.26.t: "Agarre sobre Bangkok"
 thailand_news.26.d: "La Real Fuerza Aérea de Tailandia ha tomado entrega de sus primeros combatientes JAS 39 Gripen multirole, volarlos en formación sobre la capital para marcar el hito. Los jets construidos por Suecia dan a Tailandia una genuina capacidad de cuarto-combat aéreo y una posición en la moderna guerra aérea relacionada con los datos"
 thailand_news.26.a: "Los cielos del Reino están protegidos."
 thailand_news.27.t: "Armas tailandesas en el mercado mundial"
 thailand_news.27.d: "La nueva Oficina de Exportación de Defensa de Tailandia ha anunciado su primera ola de contratos en el extranjero. Blindaje vehículos, artillería y municiones destinados a compradores de todo el sudeste asiático y más allá. La industria de defensa del Reino, una vez que la línea presupuestaria, se está convirtiendo en un productor de exportación."
 thailand_news.27.a: "Hecho en Tailandia, vendido al mundo."
 thailand_news.28.t: "Una nación en armas"
 thailand_news.28.d: "Bangkok ha revelado un programa de defensa total. Contiene reservas expandidas, simulacros de defensa civil en todas las provincias y una doctrina que trata a toda la sociedad como la última línea de resistencia. Los críticos lo llaman militarización, y el gobierno lo llama prudencia."
 thailand_news.28.a: "Toda la nación está lista."
 SIA_expansionism_threat: "Thai Expansionism"
 thailand.380.t: "Ingenieros del Istmo"
 thailand.380.d: "El veredicto de la comisión de viabilidad está dentro. El corte es duro, pero es posible. La única pregunta que queda es la que ha matado el proyecto por un siglo, y eso es quien paga. Tres ofertas extranjeras se sientan en la mesa de gabinete al lado de la opción de pagar por ella nosotros mismos. Cada uno lleva un precio que no sólo se mide en baht."
 thailand.380.a: "Tome la financiación de Beijing Franja y la Ruta. Barato, rápido, y nos preocuparemos por los términos más tarde."
 thailand.380.b: "Elige Japón. Más lento y más querido, pero construido para durar y libre de cláusulas ocultas."
 thailand.380.c: "Traiga un consorcio internacional. Fase, compartir y no contemplar un solo poder."
 thailand.380.e: "Construyelo nosotros mismos. El canal será tailandés hasta el último bollard."
 thailand.381.t: "Terrestre roto"
 thailand.381.d: "Los cofferdams están hundidos, los primeros metros cúbicos de botín se levantan, y el gran corte en el Kra Isthmus ha comenzado en serio. El trabajo procederá en fases, cada una una una prueba fresca del nervio de la tesorería."
 thailand.381.a: "Que empiece la excavación."
 thailand.382.t: "Una fase completa"
 thailand.382.d: "Otra etapa del canal es terminada y firmada por los ingenieros. El corte es más profundo, las obras están más adelante, y el gabinete se permite un momento de orgullo cauteloso antes de que llegue la próxima factura."
 thailand.382.a: "En la siguiente fase."
 thailand.383.t: "Costo sobrecosto"
 thailand.383.d: "La última fase ha volado a través de su presupuesto. Hard rock, una galería inundada y la estimación revisada de un contratista han dejado la oficina del proyecto pidiendo al gabinete una decisión. Encontrar el dinero, o aceptar que el canal se abrirá más tarde de lo prometido."
 thailand.383.a: "Vierta el dinero y mantén la agenda."
 thailand.383.b: "Aceptar el retraso. La tesorería viene primero."
 thailand.384.t: "El Canal está listo"
 thailand.384.d: "La última puerta de bloqueo está colgada, el alcance de la cumbre se inunda, y los pilotos han dirigido sus primeros tránsitos en lastre. El Canal de Kra está completo en todos menos el corte de cinta. El Reino puede declarar el megaproyecto terminado."
 thailand.384.a: "Corta la cinta y abre el canal."
 thailand.385.t: "Sabotaje en el Corto"
 thailand.385.d: "Una explosión en una estación de bombeo y una carretera cortada llevan la firma de la insurgencia profunda del Sur. El canal pasa por tierra disputada, y los hombres que se oponen a Bangkok han encontrado un objetivo digno de un titular. La oficina del proyecto quiere una decisión. Harden las obras, o hablen con los locales."
 thailand.385.a: "Reforzar la seguridad a lo largo del pasillo."
 thailand.385.b: "Negociar con líderes locales. Compra paz, no sólo guardias."
 thailand.386.t: "Beijing llama al Préstamo"
 thailand.386.d: "Los sobrecostos han tropezado con un pacto en el acuerdo Franja y la Ruta, y los negociadores de Beijing han llegado a Bangkok con una carpeta de opciones, todas ellas favorables a China. La deuda de yuan-denominada se ha convertido en una palanca, y el canal mismo es el colateral. El gabinete debe elegir cómo responder la llamada."
 thailand.386.a: "Concede un contrato de arrendamiento operativo y deja que Beijing tome una parte de los peajes."
 thailand.386.b: "Reestructuración en términos duros. Paga y mantén el canal tailandés."
 thailand.386.c: "Por defecto. El canal es nuestro, así que deja que los mercados hagan lo peor."
 thailand.388.t: "Vuelo de capital"
 thailand.388.d: "El defecto ha espantado los mercados. Los inversores extranjeros se están retirando, el baht se desliza, y el banco central está gastando reservas para frenar el pánico. El daño es grave, pero un soberano que se mantuvo en su tierra lo hará, dado el tiempo."
 thailand.388.a: "Salga de la tormenta."
 thailand.389.t: "Washington y Delhi tomen nota"
 thailand.389.d: "Un contrato de arrendamiento operativo chino sobre el Kra tiene campanas de alarmas de Washington a Nueva Delhi. Ambas capitales temen un chokepoint en el bolsillo de Beijing, y ambas están mirando para ver si Bangkok les tranquilizará o se apoyará más al este."
 thailand.389.a: "Reasegurar a ambos y gastar el capital político para mantenerlos al margen."
 thailand.389.b: "Inclínate en Beijing. La asociación está establecida, así que deja que Occidente se adapte."
 thailand.390.t: "El Estrecho pierde su monopoly"
 thailand.390.d: "Los primeros tanques de carga están transitando por el Kra, y los grandes puertos del Estrecho Malacca están contando el costo. Singapur y Kuala Lumpur, que construyeron sus fortunas en el viejo chokepoint, observan su desagüe de ingresos de tránsito hacia el norte, y no pronto perdonarán al Reino que lo drenó."
 thailand.390.a: "Dos océanos responden a Bangkok ahora."
 thailand.391.t: "¿Qué tipo de Canal?"
 thailand.391.d: "El canal está abierto, pero ¿qué va a ser? ¿Una fortaleza que sostiene la marina por la fuerza, cerrada a rivales y con baterías? ¿O un pasaje internacional neutral, abierto a todas las banderas y garantizado por el tratado? La elección definirá el lugar de Tailandia entre los poderes marítimos para una generación."
 thailand.391.a: "Fortalecer al Kra para defenderlo y negarlo."
 thailand.391.b: "Abre el Kra a todos los que pagan el peaje en paz."
 thailand_news.20.t: "Dos océanos, un Reino"
 thailand_news.20.d: "Después de años de trabajo, miles de millones de baht y una geopolítica que ningún ingeniero pudo haber previsto, el Canal Kra está abierto. Por primera vez, los barcos pasan entre el Mar Andaman y el Golfo de Tailandia sin redondear la Península Malaya. El mapa del comercio asiático ha sido redireccionado, y Bangkok tiene el bolígrafo."
 thailand_news.20.a: "Un canal de un siglo en la fabricación."
 thailand.393.t: "Parías de la Región"
 thailand.393.d: "La máscara está apagada. El impulso de Bangkok para subyugar a sus vecinos ha despojado todas las pretensiones del liderazgo de la ASEAN. Las capitales del sudeste asiático retroceden, y el mundo más amplio se recalcula. Tailandia ya no es la silla de la región. Es la amenaza de la región, y los muros diplomáticos y económicos ya están subiendo."
 thailand.393.a: "Que nos temen. Empire nunca fue ganado por amigos."
 thailand.394.t: "Washington Condemns Bangkok"
 thailand.394.d: "Los Estados Unidos han condenado enérgicamente la agresión tailandesa en el Asia sudoriental. Washington señala que se mantendrá con los estados amenazados de la región, sopesando las garantías y presionando a sus socios para que cierren filas contra el irrevocable hegemon. La influencia americana de Bangkok una vez cortejado está drenando."
 thailand.394.a: "La desaprobación estadounidense no parará la marcha."
 thailand.395.t: "Mano Abierta de Beijing"
 thailand.395.d: "Donde Washington retrocede, Beijing se apoya. China ve en una Tailandia aislada y agresiva un socio útil, un poder que ha quemado sus puentes hacia Occidente y la región, y ahora no tiene otro lugar a donde recurrir. El estatus de parías de Bangkok es la oportunidad de Beijing, y la mano abierta viene con cuerdas que el Reino ya no puede permitirse rechazar."
 thailand.395.a: "Si el Este nos tiene, así sea."
 thailand.431.t: "Una invitación de Bangkok"
 thailand.431.d: "Tailandia ha cursado una invitación oficial para sumarse a su Organización del Tratado de Asia Sudoriental. El pacto ofrece mando compartido, seguridad mutua y una voz regional unida bajo la dirección de Bangkok. Sin embargo, la ASEAN siempre ha protegido su independencia y para atar nuestro destino a Tailandia no es un pequeño paso. La elección es nuestra para hacer libremente, y la nuestra para deshacerse si ya no nos sirve."
 thailand.431.a: "Aceptamos. Nuestra seguridad es compartida más fuerte."
 thailand.431.b: "Nos declinamos. Nuestra independencia no es para negociar."
 thailand.425.t: "[FROM.GetNameDefCap] Firma el Tratado"
 thailand.425.d: "La respuesta de [FROM.GetNameDefCap] es sí. Su delegación está en camino a Bangkok para firmar, y la Organización del Tratado de Asia Sudoriental gana un miembro. Cada firma hace que el siguiente sea más fácil de obtener."
 thailand.425.a: "Un asiento más en la mesa."
 thailand.426.t: "[FROM.GetNameDefCap] Declara la invitación"
 thailand.426.d: "[FROM.GetNameDefCap] nos ha dado las gracias por la oferta y lo ha rechazado. El idioma es cálido y la respuesta es no. Un pacto de este tipo no puede ser forzado a nadie, y la puerta permanece abierta."
 thailand.426.a: "Su elección. La oferta está en pie."
 SIA_kra_fortress_threat: "Fortificaciones del Canal de Kra"
 SIA_kra_default_threat: "Default soberano tailandés"
 SIA_kra_chokepoint_threat: "El Chokepoint de Kra"
 SIA_asean_hegemon_threat: "Oferta tailandesa para la hegemonía de la ASEAN"
 thailand.410.t: "El mapa de un Reino Mayor"
 thailand.410.d: "Los viejos mapas están fuera de nuevo, los que muestran Lan Na, las colinas Shan, las provincias perdidas de Camboya y Laos y el sur malayo como tailandés por derecho. El movimiento Pan-Thai tiene una voz en el gabinete ahora, y hace la pregunta claramente. ¿El Reino proclamará sus irredentas al mundo, o perseguirá los mismos fines con una mano más suave? Cada gran poder está viendo cómo responde Bangkok."
 thailand.410.a: "Proclamadlo. Estas tierras son tailandesas, y el mundo debería saberlo."
 thailand.410.b: "Silencioso. Construimos la posición sin agitar el sabre."
 thailand.411.t: "Un pueblo, un destino"
 thailand.411.d: "La idea de Pan-Thai ya no es un romance burgués de oficiales e historiadores. Los Rallies llenan a Sanam Luang, y la prensa lleva las banderas de una sola nación Tai que se extiende desde Yunnan al Istmo. El movimiento ahora tiene una cara pública, y el gobierno decide darle uno también."
 thailand.411.a: "Que la nación oiga su propio nombre."
 thailand.412.t: "Bamboo en el viento"
 thailand.412.d: "Tailandia se dobla pero no se rompe. Al negarse a elegir entre Washington y Beijing, Bangkok ha mantenido ambos cortejo, la diplomacia bambú de viejo, practicada con una mano moderna. Ambas capitales envían señales cálidas, y tampoco pueden permitirse llevar el Reino a los brazos del otro."
 thailand.412.a: "Mantenemos nuestras opciones abiertas, y nuestros amigos adivinando."
 thailand.413.t: "La cuestión del combustible y el ciclo"
 thailand.413.d: "Los nuevos reactores de Tailandia se ejecutan en un ciclo de combustible soberano, y un ciclo de combustible soberano significa enriquecimiento, y el enriquecimiento significa que la línea entre poder civil y una opción de armas crece delgada. El OIEA quiere mejores salvaguardias, Washington quiere garantías y la región quiere saber lo que Bangkok pretende. No hay ningún programa de bombas en los libros, pero la capacidad está ahora al alcance, y el Reino debe decidir hasta qué punto caminar hacia él."
 thailand.413.a: "Desafíalos. El enriquecimiento soberano es nuestro derecho, sedge o de otro modo."
 thailand.413.b: "Reasegurarlos. Aceptar las salvaguardias completas y mantener la confianza."
 thailand.413.a_tooltip: "§R La alarma contra la proliferación.§! Tailandia gana la amenaza llamada §Y Defianza sobre el Enriquecimiento Extranjero§!, Estados Unidos se vuelve bruscamente contra Bangkok mientras India crece con cautela, y §RLa influencia de Estados Unidos en Tailandia cae un 15%§!."
 thailand.414.t: "La Carta de los Guardianes"
 thailand.414.d: "La constitución es reescrita así que los vigilantes nunca necesitan dormir. Consejos designados, poderes reservados y un senado que responde al cuartel. El estado profundo ya no es un hábito informal sino una garantía escrita. La orden está asegurada, y el precio se paga en la silenciosa muerte de política sin restricciones."
 thailand.414.a: "Estabilidad, hecho permanente."
 SIA_guardianship_cost_tt: "La comunidad internacional se basa en el afianzamiento permanente de los tutores.\n - §RTreasury -20§!\n - §R La opinión de los Estados Unidos y el Reino Unido cae§!"
 thailand.415.t: "Pax Aseana"
 thailand.415.d: "De Manila a Yakarta, de Hanoi a Singapur, las capitales del sudeste asiático elevan sus vasos a Bangkok. Cuando temían una oferta tailandesa de maestría, ahora ven un garante, un Reino que conduce por confianza, encuentra su pacto con el consentimiento y mantiene la paz que prometió. Este es el Pax Aseana, y Tailandia se sienta en su cabeza no como un conquistador sino como un socio."
 thailand.415.a: "Una región en paz, y Tailandia su piedra angular."
 thailand.416.t: "Después del General"
 thailand.416.d: "El general tiene su estreno, su luna de miel y su transición gestionada aún por delante de él. El establecimiento puede afianzarse aún más al empaquetar las instituciones y apretar el control del partido sobre la maquinaria de estado, o puede leer la sala, institucionalizar sus ganancias, y volver a una postura más civil antes de que se agote la paciencia pública."
 thailand.416.a: "Entrenamiento. El establecimiento endurece su control."
 thailand.416.b: "Institucionalizar. Consolidar las ganancias, suavizar la cara."
 thailand.417.t: "El motor del este gira"
 thailand.417.d: "Las grúas a lo largo de la costa este nunca paran. Nuevo ferrocarril, nuevas pistas, nuevos parques industriales. El Corredor Económico Oriental ha alcanzado el despegue, y la inversión está empezando a complicarse por sí misma. Chonburi, Rayong y Chachoengsao se están convirtiendo en la sala de motores de la economía tailandesa."
 thailand.417.a: "El pasillo se mueve a la vida."
 SIA_nuclear_defiance_threat: "Soberana desafío del enriquecimiento"
 SIA_tsunami_warning: "Tsunami Alert Network"
 thailand.363.t: "El Trampa de Productividad"
 thailand.363.d: "Los años de crecimiento han terminado. Una generación dejó la universidad en una economía estancada de salarios estancados, trabajo de fábrica enviado al extranjero, y un mercado inmobiliario que nunca entrarán. Son la cohorte mejor educada de la historia tailandesa y no van a ninguna parte, y saben exactamente a quién culpar. Las intersecciones de Bangkok se llenan con saludos de tres niveles, y la tendencia de los hashtags más rápido que la policía puede leerlos. Move Forward habla su idioma. La política lenta y confortable del pasado no los mantendrá."
 thailand.363.a: "Abre el sistema. Concede la reforma, deja que las nuevas políticas respiren."
 thailand.363.b: "Orden primero. Limpiar las calles y cambiar el tema a la nación."
 thailand.363.c: "Compra tiempo con crecimiento. Pivot para estimular y aliviar el apretón."
 thailand.364.t: "Dos Tailandias"
 thailand.364.d: "Hay dos países dentro del reino. Uno es Bangkok y las capitales provinciales, los graduados, las torres de oficina, los cafés donde la reforma es una conclusión precedente. El otro es el cinturón de arroz y el noreste, donde los populistas construyeron su máquina en fondos de aldea y subsidios de arroz y nunca dejaron ir. Quieren cosas diferentes, temen diferentes futuros y votan por diferentes partidos. Un gobierno debe elegir dónde planta su bandera, o pretender que puede estar por encima de la línea enteramente."
 thailand.364.a: "Corte la capital y los graduados, el futuro urbano de Tailandia."
 thailand.364.b: "Corte el cinturón de arroz, la base del país que entrega."
 thailand.364.c: "Párate por encima de la brecha. Sólo el trono une a los dos Tailandias."
 thailand.365.t: "El Echo del Desgarrador"
 thailand.365.d: "Limpiar las calles no despejó la queja. Lo agudizó. El movimiento que se ha dispersado se ha reagrupado, más grande y más enojado, sus líderes ahora mártires y sus demandas ahora no negociables. Lo que fue una protesta se está convirtiendo en la causa definitoria de una generación, y cada bateón juntó el año pasado diez más este año."
 thailand.365.a: "No hay que devolver esto. Salga de la tormenta."
 thailand.418.t: "Los herederos de la selva"
 thailand.418.d: "La miseria ha durado demasiado tiempo. En los distritos de arriba del país se olvidó el estado, viejos nombres superficie otra vez. Cadres que llevaban fusiles para el Partido Comunista de Tailandia ante la amnistía, ahora gris pero no olvidada, y una generación de sus nietos sin nada que perder. Los círculos de estudio se reúnen por la luz de la lámpara, y la bandera roja, doblada durante cuarenta años, está siendo sacudida. La selva que tragó la última insurgencia sigue ahí. Así es la queja que lo llenó."
 thailand.418.a: "Deja que las células se organicen. El campo es nuestro para perder."
 thailand.418.b: "Aplastar el metro. Redondea los cuadros antes de que esto se extienda."
 thailand.418.c: "Dibuja el pantano de la queja. Vierta dinero en los distritos."
 thailand.74.t: "El caso de los activos"
 thailand.74.d: "El Tribunal Constitucional sopesa si el Primer Ministro ocultó las participaciones de su sierva, conductor y guardia de seguridad. Un veredicto culpable termina la estreno antes de que comience. Los jueces están divididos, y el palacio, la prensa y los generales están viendo cómo se alcanza el veredicto."
 thailand.74.a: "Apóyate en el banco. El veredicto irá a nuestro camino."
 thailand.74.b: "Presentar al proceso y dejar que el tribunal decida."
 thailand.75.t: "Tak Bai"
 thailand.75.d: "En el sur musulmán, los soldados apilan cientos de manifestantes obligados en camiones del ejército. Para cuando llega el convoy, ochenta y cinco están muertos, la mayoría de ellos asfixiados. Las imágenes rodean el mundo. El cuerpo de oficiales cierra sus filas, y la pregunta es si el gobierno civil se atreverá a preguntar qué pasó."
 thailand.75.a: "Quédate detrás del ejército. No hay investigación."
 thailand.75.b: "Pide una investigación. El ejército nos responde."
 thailand.76.t: "Los escáneres CTX"
 thailand.76.d: "El proyecto de ley para los escáneres de detección de bombas del nuevo aeropuerto se ha triplicado, y el marcador ha desaparecido en una cadena de intermediarios cerca del gabinete. Una auditoría honesta avergonzaría al gobierno. Enterrarla acarrea la diferencia pero alimenta la historia de reunión de una administración que trata el tesoro como una cuenta familiar."
 thailand.76.a: "Entierra la auditoría y arranque la diferencia."
 thailand.76.b: "Cancele el contrato y reduzca las pérdidas."
 thailand.77.t: "Silenciando a los críticos"
 thailand.77.d: "Las transmisiones nocturnas de un mogul mediático se han convertido en un punto de encuentro para la calle anti-gobierno, y la emisora independiente iTV está deslizando la correa. Los trajes de difamación, la presión de licencia y la propiedad amistosa podrían llevarlos al tacón, a precio de confirmar todo lo que los críticos dicen acerca de esclarecer la regla de un solo hombre."
 thailand.77.a: "Trae a la prensa al tacón."
 thailand.77.b: "Que la prensa corra y responda palabras con palabras."
 thailand.78.t: "A Parlamento de uno"
 thailand.78.d: "El partido gobernante ha ganado una mayoría absoluta, el primer gobierno de partido único en la historia tailandesa. Sin una coalición que administrar y las agencias independientes llenas de leales, el Primer Ministro puede gobernar sin control. Para el cinturón de arroz es un mandato, y para el establecimiento de Bangkok y los cuarteles es una dictadura electiva en la fabricación."
 thailand.78.a: "Govern descontrolado. La gente nos dio esto."
 thailand.78.b: "Corten a la oposición y compartan la mesa."
 thailand.73.t: "La venta de Shin Corp"
 thailand.73.d: "La familia del Primer Ministro vende su imperio de las telecomunicaciones a un fondo estatal de Singapur por unos setenta y tres mil millones de baht, y, mediante una conveniente reestructuración, no paga un satang en impuestos. La legalidad es impecable, pero la óptica es catastrófica. Dentro de los días las multitudes con camiseta amarilla llenan las avenidas, y el ejército comienza a preguntar en voz alta si la constitución aún une al hombre que vendió un impuesto nacional de activos."
 thailand.73.a: "Pon a los miles de millones. Todo era legal."
 thailand.73.b: "Pagar el impuesto y desactivar la furia."
 thailand.420.t: "Un mandato populista"
 thailand.420.d: "El poder ha pasado al campamento populista. El cinturón de arroz y los pobres urbanos tienen su gobierno otra vez, y con él el programa Thaksinista de fondos del pueblo, salud barata, y un líder que habla su idioma. Los espíritus del antiguo establecimiento ya no sostienen, y la red de palacio y el caucus reforma se funden mientras la nueva máquina toma las palancas. Los barracones, como siempre, están mirando."
 thailand.420.a: "El campo tiene su gobierno."
 thailand.421.t: "Retorno del establecimiento"
 thailand.421.d: "Las palancas han pasado al establecimiento realista, ya sea por votación, negociación de palacio o los tanques al amanecer. La monarquía de red se reafirma. Los concejales privilegiados, los generales y las grandes casas están cerca del trono. Los espíritus de la máquina populista se disuelven junto con su mandato, y el movimiento de reforma es barrido de la mesa. El reino se mantiene bajo las manos familiares."
 thailand.421.a: "El reino está en orden."
 thailand.422.t: "La ola de reforma"
 thailand.422.d: "Una nueva generación ha tomado el poder. El movimiento de reforma que marchó en las calles ahora se encuentra en el gabinete, y la agenda se convierte en desmantelamiento del viejo orden, la conscripción, los monopolios, las instituciones intocables. Los espíritus del gobierno anterior se desvanecen mientras sus líderes caen. La pregunta es si el establecimiento permitirá que se ejecute el experimento."
 thailand.422.a: "El futuro es ahora."
 thailand.423.t: "La Corte decide"
 thailand.423.d: "El Tribunal Constitucional tiene al partido gobernante a su vista. Se redactó una orden de disolución y el ejecutivo podría quedar sin fiat judicial, como muchos antes. El gobierno puede inclinarse ante el veredicto y dar poder a sus rivales, o desafiar al banco y atrever las consecuencias."
 thailand.423.a: "Aceptar el veredicto y dejar de lado con la gracia."
 thailand.423.b: "Desafía a la corte. Respondemos a los votantes, no a los jueces."
 thailand.424.t: "Los Demócratas Endure"
 thailand.424.d: "El poder ha regresado al Partido Demócrata, el más antiguo del Reino, ya sea por turno en la urna o un tribunal que entregó al ejecutivo a la oposición. Ningún deslizamiento, ningún multimillonario carismático, sólo el asunto paciente e ingrato de gobernar como una amplia coalición civil, asume el futuro en las instituciones más que un solo líder. Los espíritus del gobierno anterior se disuelven junto con su mandato. Y en el cinturón de arroz, la máquina de Thaksin ya está reuniendo su fuerza para la próxima ronda."
 thailand.424.a: "El establecimiento mantiene la línea."
 thailand.430.t: "¿Para qué son las bombas?"
 thailand.430.d: "Las primeras ojivas tailandesas son reales, pero un arma no declara a nadie. El Consejo de Seguridad Nacional debe resolver la cuestión que todos los Estados nucleares deben responder. ¿En qué circunstancias los utilizaría el Reino? La postura que declaramos dará forma a cómo la región, y los grandes poderes, leerán nuestras intenciones."
 thailand.430.a: "Retaliation only. Sólo atacaremos si nos golpeamos con armas estratégicas."
 thailand.430.b: "Retaliación táctica y estratégica. Respondemos a cualquier ataque nuclear en especie."
 thailand.430.c: "Declarado de primer uso. Que nuestros enemigos se pregunten, y que temen."
 thailand_news.30.t: "Tailandia se une al Club Nuclear"
 thailand_news.30.d: "Bangkok ha confirmado lo que los servicios de inteligencia habían susurrado durante meses. El Reino de Tailandia posee armas nucleares. Capitales a través de Asia y más allá se mueven para recalcular el equilibrio del poder como un nuevo entrante cruza el umbral."
 thailand_news.30.a: "El mapa ha cambiado."
 SIA_threat_thai_bomb: "Programa de armas nucleares de Tailandia"
 SIA_threat_thai_enrichment: "Programa de enriquecimiento de uranio de Tailandia"
 SIA_threat_thai_first_use: "Posición declarada de primer uso en Tailandia"
 thailand.432.t: "La estrategia no puede esperar"
 thailand.432.d: "Los años del taller hicieron que Tailandia fuera lo suficientemente rica para detenerse, y los ministerios han argumentado sobre el plan de escape durante demasiado tiempo. La frontera no está esperando, y Vietnam está cerrando la brecha. La Estrategia Nacional debe adoptarse ahora."
 thailand.432.a: "Aprobada por decreto"
 thailand.432.b: "Construir el consenso primero"
 thailand.433.t: "Un escudo del norte"
 thailand.433.d: "Bangkok ha pedido a Beijing que prorrogue una garantía formal sobre el Reino. Una promesa china anclaría la inclinación de Tailandia hacia el continente y advertiría a cualquier rival tentado a probar sus fronteras. El precio es un compromiso permanente lejos de casa."
 thailand.433.a: "Ampliar nuestra protección"
 thailand.433.b: "Bangkok puede pararse solo"
 SIA_frontier_overextension_idea: "Overextension Frontier"
 SIA_frontier_overextension_idea_desc: "Las divisiones comprometidas con las marchas occidentales son divisiones que no observan Bangkok. El Ejército Real de Tailandia se estira más delgada que el gobierno le importa admitir, y el público siente la tensión de un compromiso hecho antes de que se disparara."
 SIA_regional_pariah: "Pariah regional"
 SIA_regional_pariah_desc: "Bangkok se tragó toda la marcha de Birmania. Washington y Beijing condenan el acaparamiento de tierras, las capitales de la ASEAN ven sus propias fronteras nerviosamente, y los exportadores tailandeses pagan por el nombre empañado del reino en cada contrato en el extranjero."
 SIA_frontier_partners: "Border Partners"
 SIA_frontier_partners_desc: "Las tierras fronterizas recuperadas se rigen por clientes y pactos en lugar de ocupación. El poder blando es más barato que las guarnición. La administración está inclinada y los equipos de construcción se mueven libremente, y ninguna de las anexiones diplomáticas de retroceso habría traído."
 SIA_kings_moral_authority: "La Autoridad Moral del Rey"
 SIA_kings_moral_authority_desc: "Siete décadas en el trono han dado al monarca una posición moral que ningún político se acerca. En momentos de crisis, una palabra del palacio ha resuelto lo que los ejércitos no podían."
 SIA_royal_guidance_idea: "Bajo el Royal Gaze"
 SIA_royal_guidance_idea_desc: "La guía anual del palacio mantiene el reino y lo aleja de la intromisión extranjera, pero un gobierno electo que se difere al trono encuentra su propio escrito corre hasta ahora."
 SIA_three_pillars_idea: "Nación, Religión, Rey"
 SIA_three_pillars_idea_desc: "Nacionalismo oficial soldado al trono y a la Sangha. La mayoría budista está ligada a la subversión y a las ideas extranjeras, al precio de una mente pública más deferencial."
 SIA_deep_south_grievance: "Quejarse en el sur"
 SIA_deep_south_grievance_desc: "En las provincias malaya-musulmanas, un credo budista-royalista cae como exclusión. Las quejas de Patani endurecen, y Bangkok paga en estabilidad y capital político para mantener la tapa."
 SIA_scarred_coast: "La costa escarpada"
 SIA_scarred_coast_desc: "Sin el dinero del estado detrás de la reconstrucción, los resorts Andaman se mantienen medio gobernados durante años. Los hoteles son tranquilos, los escombros no están claros, y los turistas van a otra parte."
 SIA_new_reign_mourning: "Un Reino en Ratón"
 SIA_new_reign_mourning_desc: "La nación llora al difunto Rey. La vida pública está sometida, el entretenimiento suspendido y la política observa una tregua incómoda."
 SIA_ninth_reign_barami: "Barami del Noveno Reino"
 SIA_ninth_reign_barami_desc: "El rey Bhumibol ha reinado durante más de medio siglo, más tiempo que cualquier monarca en la tierra. Su barami, la autoridad moral ganada a lo largo de esas décadas, está sobre todo político y general. En un momento de crisis una palabra del palacio resuelve lo que ningún gabinete puede, y el trono protege al reino de los diseños extranjeros."
 SIA_ninth_reign_zenith: "La monarquía de la red Ascendente"
 SIA_ninth_reign_zenith_desc: "El palacio ya no sólo reina. A través del Consejo Privado, los tribunales y una red de oficiales leales y empresarios, la Corona llega a cada institución estatal. La palabra del Rey lleva el peso de la ley, el disenso no encuentra compra, y la influencia extranjera rompe contra un muro de consenso realista."
 SIA_tenth_reign_barami: "Barami de la Décima Reina"
 SIA_tenth_reign_barami_desc: "El trono ha pasado al rey Vajiralongkorn, pero la reverencia no es heredada. El nuevo monarca ocupa la oficina que su padre mantuvo sin la autoridad moral que una vez lo llenó. El palacio aún mantiene el reino y protege contra la intromisión extranjera, pero cada palanca es un eco más débil del Noveno Reino."
 SIA_two_thailands: "Dos Tailandias"
 SIA_two_thailands_desc: "Hay dos países dentro de una frontera. Bangkok y las llanuras centrales sostienen la riqueza, los ministerios y el antiguo establecimiento. El norte y el noreste rurales sostienen los votos y una convicción más dura de que sus boletas son robadas por tribunales y golpes de Estado. El golfo entre ellos polariza cada elección y obliga al tesorería a comprar una paz que apenas puede permitirse."
 SIA_three_pillars_start: "Nación, Religión, Rey"
 SIA_three_pillars_start_desc: "$SIA_three_pillars_idea_desc$"
 SIA_populist_machine: "La máquina Populista"
 SIA_populist_machine_desc: "Fondos de aldea, tarjetas sanitarias, alivio de la deuda. Una máquina de políticas que convierte la entrega del gobierno en lealtad electoral, ciclo tras ciclo."
 SIA_yellow_shirts_idea: "Las camisas amarillas"
 SIA_yellow_shirts_idea_desc: "La Alianza Popular para la Democracia es realista, urbano, de clase media y está convencida de que se está comprando la mayoría electoral. Cuando llenan las calles, los gobiernos temblan."
 SIA_red_shirts_idea: "Las camisas rojas"
 SIA_red_shirts_idea_desc: "El Frente Unido para la Democracia contra la Dictadura es rural, septentrional y nororiental. Han ganado todas las elecciones que impugnaron y perdieron a cada gobierno que formaron. Son la mayoría, y lo saben."
 SIA_junta_government: "Junta"
 SIA_junta_government_desc: "Un consejo militar gobierna por decreto. El orden se impone, el disenso es «ajustado», y la cuestión de cuando las elecciones regresen es contestada con una sonrisa y un aplazamiento."
 SIA_guided_democracy: "The 2017 System"
 SIA_guided_democracy_desc: "Un Senado designado, una estrategia vinculante de veinte años y tribunales de disposición confiable. Se celebran elecciones, pero el campo está cercado."
 SIA_network_monarchy_idea: "Monarquía de red"
 SIA_network_monarchy_idea_desc: "Palacio, consejo privilegiado, ejército y poder judicial forman una red informal de autoridad que opera por encima de la política electoral, y supera a todos los gobiernos."
 SIA_reform_momentum: "Reforma Momentum"
 SIA_reform_momentum_desc: "Por primera vez en una generación, la energía en la política tailandesa es con aquellos que quieren cambiar el sistema, no manejarlo."
 SIA_consolidated_democracy_idea: "Una democracia consolidada"
 SIA_consolidated_democracy_idea_desc: "El control civil, el gobierno constitucional y un público que espera que los golpes sean historia. Las instituciones democráticas de Tailandia finalmente se basan en sus propios cimientos."
 SIA_republic_turmoil: "Turmoil constitucional"
 SIA_republic_turmoil_desc: "La cuestión de la república ha dividido todas las instituciones, cada provincia y muchas familias. El estado perdura, pero el consenso debajo de él se ha ido."
 SIA_pan_thai_irredentism: "Pan-Thai Irredentism"
 SIA_pan_thai_irredentism_desc: "La narrativa de los territorios perdidos es la doctrina estatal otra vez. Los pueblos Tai son una nación, las cesiones 1893-1909 son ilegítimas y la historia debe a Tailandia una corrección."
 SIA_drug_war_stain: "Censure internacional"
 SIA_drug_war_stain_desc: "Miles de ejecuciones extrajudiciales durante la guerra contra las drogas siguen a Tailandia en cada foro de derechos humanos y todas las negociaciones diplomáticas."
 SIA_tourism_powerhouse: "Turismo Powerhouse"
 SIA_tourism_powerhouse_desc: "Decenas de millones de visitantes al año hacen del turismo un pilar de la economía y la marca tailandesa un activo global."
 SIA_tourism_powerhouse_2: "Política Industrial de Turismo"
 SIA_tourism_powerhouse_2_desc: "El turismo se graduó de una caída estacional en un pilar gestionado de la política estatal. Una base de visitantes diversificada y de mayor gasto paga impuestos corporativos reales y responde menos a los conglomerados de viajes extranjeros que nunca."
 SIA_tourism_luxury_boom: "De lujo Travel Surge"
 SIA_tourism_luxury_boom_desc: "Una ola de visitantes de alto costo está llenando los resorts de cinco estrellas y conduciendo recibos. La oleada se desvanece una vez que la temporada gira."
 SIA_credit_boom_overheating: "Boom de crédito sobrecalentamiento"
 SIA_credit_boom_overheating_desc: "El dinero barato inundado en más rápido de lo que el sistema bancario podría absorber, y los prestatarios ahora están pagando la diferencia en tasas más altas. La presión se alivia mientras el ciclo se enfría."
 SIA_sustainable_extraction: "Recursos Stewarded"
 SIA_sustainable_extraction_desc: "Los permisos se mueven lentamente y las concesiones permanecen estrechas, pero el estado mantiene una mano más firme sobre quién se beneficia de lo que sale del suelo y responde menos al capital extranjero que financia la extracción más rápida en otros lugares."
 SIA_digital_national_champions: "Campeones digitales nacionales"
 SIA_digital_national_champions_desc: "Un puñado de plataformas estatales dominan el mercado por diseño, fácil de impuestos y simple de regular, pero lo suficientemente cómodo en su posición que deja de empujar para mejorar."
 SIA_detroit_of_asia_idea: "Detroit of Asia"
 SIA_detroit_of_asia_idea_desc: "El Seaboard del Este monta camionetas para el mundo. Las cadenas de suministro automotriz anclan la fabricación tailandesa y mantienen el libro mayor de exportación saludable."
 SIA_bamboo_diplomacy: "Bambú Diplomacy"
 SIA_bamboo_diplomacy_desc: "Bend con el viento, nunca se rompa. Bangkok mantiene la alianza americana, la inversión china y su propio consejo, todo al mismo tiempo."
 SIA_deep_south_insurgency: "Insurgencia del Sur"
 SIA_deep_south_insurgency_desc: "Una insurgencia separatista armada en las provincias de Malay-Muslim de Pattani, Yala y Narathiwat. Su intensidad aumenta y cae con las opciones del gobierno de fuerza, desarrollo o diálogo."
 SIA_war_on_drugs_campaign: "Guerra contra las drogas"
 SIA_war_on_drugs_campaign_desc: "Listas negras, cuotas y ambigüedad de tiro a matar. El comercio de metanfetaminas está en retirada, y también el estado de derecho."
 SIA_deep_south_insurgency_1: "Insurgencia del Sur"
 SIA_deep_south_insurgency_1_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_deep_south_insurgency_2: "Insurgencia del Sur"
 SIA_deep_south_insurgency_2_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_deep_south_insurgency_3: "Insurgencia del Sur"
 SIA_deep_south_insurgency_3_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_pacified_but_smoldering: "Pacificado pero desconcertante"
 SIA_pacified_but_smoldering_desc: "El Puño de Hierro funcionó. Por la única medida que el ejército acepta, el Sur está tranquilo. Pero una generación creció bajo toque de queda y punto de control, y la queja se ha mantenido bajo tierra en vez de lejos. El incidente ocasional sigue brillando, y los pozos de reclutamiento no están secos."
 SIA_royal_pacification: "Pacificación real"
 SIA_royal_pacification_desc: "Una calma gestionada y monitoreada sostenida por el patronaje y la presencia bajo el aegis real. Los flujos de desarrollo, los notables locales son cooptados, y la legitimidad de la monarquía en el Sur se restablece tranquilamente. No es un acuerdo, sino una administración."
 SIA_pattani_autonomy: "Pattani Autonomía"
 SIA_pattani_autonomy_desc: "Una administración especial autogobierno dentro de un Tailandia unitario, con un consejo regional elegido, la escolarización en lengua local y una parte de los ingresos del sur retenidos en el Sur. El dividendo de la paz es real, y el precedente unsettles los centralistas de Bangkok."
 SIA_limited_devolution: "Devolución limitada"
 SIA_limited_devolution_desc: "El marco de autonomía fue regado para aplacar el establecimiento. Una medida de la administración local, pero no una verdadera autonomía. Las armas son silenciosas por ahora, sin embargo el asentamiento deja tanto al sur como al centro insatisfecho."
 SIA_hearts_minds_education_strain: "Corazones & Programa de mentes"
 SIA_hearts_minds_education_strain_desc: "La escolarización en idioma malayo, la divulgación religiosa y la mediación en las aldeas se agotan del presupuesto de educación. El mapa del incidente se pone más tranquilo, pero el sistema de escuelas lleva la factura."
 SIA_southern_development_levy: "Desarrollo del Sur Levy"
 SIA_southern_development_levy_desc: "El desarrollo empuja en las tres provincias a la industria civil a obtener productos de consumo. El dinero fluye hacia el sur durante un año, y los estantes en casa lo sienten."
 SIA_peoples_constitution: "Constitución popular"
 SIA_peoples_constitution_desc: "Una nueva ley básica escrita con amplia participación cívica consagra los derechos, la supervisión civil de las instituciones militares e independientes, restaurando la confianza pública en el orden constitucional."
 SIA_worlds_rice_bowl: "World's Rice Bowl"
 SIA_worlds_rice_bowl_desc: "Thai Hom Mali y Jasmine arroz ofrecen precios premium en todos los continentes. Los ingresos de exportación agrícola anclan la cuenta actual, y cada temporada de cosecha restablece el peso diplomático de Bangkok."
 SIA_bri_debt: "Exposición de la deuda BRI"
 SIA_bri_debt_desc: "Los préstamos de infraestructura Belt-and-Road subsanan las lagunas que el presupuesto no puede, pero los términos de reembolso están escritos en Beijing. La soberanía fiscal de Tailandia se encoge con cada acuerdo firmado."
 SIA_landslide_mandate: "Mandato del pueblo"
 SIA_landslide_mandate_desc: "Una victoria de deslizamiento ha dado al gobierno un verdadero mandato popular. La máquina del partido está energizada, la base rural se movilizó y la oposición al pie de la espalda, pero los generales están viendo muy cuidadosamente los números."
 SIA_ceo_state: "Jefe de Estado"
 SIA_ceo_state_desc: "El gabinete se ha convertido en una sala de juntas y los ministerios una empresa de tenencia. Decisiones moverse rápido y la rendición de cuentas se mueve más lento. Los cheques y los saldos no se han ido. Están siendo reestructurados."
 SIA_cult_of_the_ceo: "Culto del CEO"
 SIA_cult_of_the_ceo_desc: "El estreno se ha dispensado con el teatro de consultas. Sus calificaciones de aprobación son un arma, sus críticos son obstáculos, y los procedimientos internos del partido son lo que dice que son esta semana. La red real se reúne con más frecuencia de lo habitual."
 SIA_dynasty_politics: "Dinámica Política"
 SIA_dynasty_politics_desc: "El nombre Shinawatra es ahora una dinastía, una marca, una red de patrocinio y un plan de sucesión doblado en una sola familia. La lealtad al partido y la lealtad a la familia se han vuelto indistinguibles."
 SIA_institutionalized_party: "Partido Institucionalizado"
 SIA_institutionalized_party_desc: "El movimiento ha sobrevivido al exilio, dos golpes y diecisiete disoluciones del partido. Se ha convertido en algo más duradero que cualquier líder, una verdadera institución política con raíces en cada provincia."
 SIA_privy_council_idea: "Red del Consejo Privado"
 SIA_privy_council_idea_desc: "Las décadas de construcción de alianzas del General Prem Tinsulanonda han producido una red que abarca a los altos militares, el poder judicial y la administración pública. Sus miembros no reciben ningún salario de la red. No necesitan uno."
 SIA_judicialization: "Política de la Corte"
 SIA_judicialization_desc: "El Tribunal Constitucional se ha convertido en un actor político por derecho propio. Cada petición es un arma, y cada decisión una victoria para una facción y una herida a otra. La oposición estudia la ley para sobrevivir."
 SIA_isoc_network: "Red ISOC"
 SIA_isoc_network_desc: "El Comando de Operaciones de Seguridad Interna roza por todas las provincias, informando al ejército en lugar de ministros electos. Su red de inteligencia hace que el alcance del estado sea invisible, omnipresente y notablemente eficaz."
 SIA_crown_property_idea: "Oficina de propiedad de la Corona"
 SIA_crown_property_idea_desc: "El brazo comercial del palacio tiene estacas en tierra, banca y seguros por valor de cientos de miles de millones de baht. La monarquía absoluta ha terminado. La monarquía económica está muy bien."
 SIA_uncle_tu_honeymoon: "La luna de miel Prayuth"
 SIA_uncle_tu_honeymoon_desc: "Orden restaurada, el PDRC fuera de las calles, y un gobierno con un plan de veinte años. Por ahora, el apetito público por la estabilidad da al nuevo estreno un grado inusual de tolerancia."
 SIA_uncle_tu_fatigue: "Prayuth Fatigue"
 SIA_uncle_tu_fatigue_desc: "El primer ministro que prometió hacer aburrido la política ha tenido éxito, de la manera equivocada. La agenda de la reforma está estancada, las elecciones prometidas perpetuamente pospuestas, y los tailandeses más jóvenes han comenzado a preguntar cuándo exactamente 'temporal' se suponía que debía terminar."
 SIA_reform_spring: "Reforma primavera"
 SIA_reform_spring_desc: "Una ola de energía cívica ha sumergido en el movimiento de reforma. Nuevas caras, nuevas demandas y un estado de ánimo en las calles que carreras políticos mayores no han visto en una generación. El establecimiento está tomando nota, no siempre agradable."
 SIA_youthquake: "Youthquake"
 SIA_youthquake_desc: "Los campus universitarios, las redes sociales y las esquinas callejeras están rompiendo con la energía política. Los jóvenes tailandeseses que nunca han votado están corriendo para oficinas, oficinas de personal y recaudando dinero en línea. Los tecnócratas en formación son mejor educados que cualquier generación antes de ellos."
 SIA_barracks_pushback: "Barracks Pushback"
 SIA_barracks_pushback_desc: "Los oficiales superiores han dejado en claro, a través de intermediarios jubilados, silencios puntiagudos y reuniones informativas para la prensa desnuda, que el ritmo de la reforma civil está probando la paciencia institucional del ejército. El ejército sigue controlando sus propias promociones, presupuestos y asignaciones de base."
 SIA_thai_republic: "República Unida de Tanzanía"
 SIA_thai_republic_desc: "La monarquía constitucional más duradera del mundo ha hecho su transformación. Un presidente electo directamente, un parlamento totalmente soberano y una constitución escrita sin veto militar. El cambio no era sin sangre, pero se mantuvo."
 SIA_mandate_recovery: "Mandato de recuperación"
 SIA_mandate_recovery_desc: "El gobierno ha declarado la reconstrucción económica su primera prioridad. Los costos de consumo son comprimidos y los programas de construcción acelerados. Cada baht de inversión productiva lleva el respaldo completo del gobierno durante los próximos dos años."
 SIA_mandate_order: "Mandato de Orden"
 SIA_mandate_order_desc: "El juego de apertura del gobierno es la estabilización antes de la reforma. Se reforzaron las instituciones, se respetaron los tribunales y se suprimió la deriva política. La apuesta es que el orden, entregado convincentemente, gana la reforma de confianza más tarde requiere."
 SIA_mandate_outreach: "Mandato de la extensión"
 SIA_mandate_outreach_desc: "Diplomacia y comercio son las prioridades anunciadas por el gobierno. Las embajadas están completamente dotadas, las delegaciones ministeriales frecuentan y el Ministerio de Comercio ha recibido un presupuesto ampliado y una línea directa al diario del PM."
 SIA_uneasy_compromise: "Un compromiso incómodo"
 SIA_uneasy_compromise_desc: "Los generales se sientan en el gabinete y los políticos mantienen su mandato, un gobierno nacional que mantiene al Reino unido por una desconfianza mutua. Estabilidad se compra al precio de la acción decisiva. Cada ministerio es vigilado, cada iniciativa negociada dos veces. El acuerdo mantiene el país (§G+5% de estabilidad§!), pero ahoga la libertad de maniobra del gobierno (§R-10% de ganancia de poder político §!) hasta que la negociación se lleve a cabo."
 SIA_gfc_headwinds: "Crisis financiera mundial"
 SIA_gfc_headwinds_desc: "El colapso de los mercados de crédito occidentales ha frenado las órdenes de exportación tailandesa y ha reforzado la financiación del comercio. Los precios de los bienes de consumo se arrastran hacia arriba y el contrato de volúmenes comerciales. La tormenta no es culpa de Tailandia, pero la economía lo sentirá durante dos años."
 SIA_coup_risk_modifier: "Riesgo de golpe Presión"
 SIA_coup_risk_modifier_desc: "El alto riesgo de golpes pesa sobre la estabilidad política y suprime la acumulación de poder político. Cuanto más alto sea el riesgo, mayor será la arrastre. Cada punto en el medidor de riesgo se siente en la capacidad del gobierno para gobernar."
 SIA_coup_tier_watchful: "Barracks Watchful"
 SIA_coup_tier_watchful_desc: "Los generales están contentos, por ahora. Leen los periódicos, cuentan las líneas presupuestarias y mantienen a su abogado. No hay penalidad, pero el medidor está subiendo o cayendo con todas las opciones que hace el gobierno.\n\n§YRiesgo de golpe§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_restless: "Barracks Restless"
 SIA_coup_tier_restless_desc: "Editoriales puntiagudas en la prensa del ejército, oficiales jubilados murmurando sobre los programas de charla, un gabinete no se consultó al alto mando. El estado de ánimo en los líos ha empapado. Govern limpiamente o cómpralos de vuelta antes de que empeore.\n\n§YRiesgo de golpe§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_plotting: "Generales Plotting"
 SIA_coup_tier_plotting_desc: "Rotación inusual de tropas, cenas al primer ministro no fue invitado, el palacio recibe a los visitantes en uniforme. Todo el mundo en Bangkok puede leer las señales. El gobierno todavía puede retroceder del borde, pero la ventana está cerrando.\n\n§YRiesgo de golpe§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_tanks: "Tanques calentando"
 SIA_coup_tier_tanks_desc: "Las columnas se alimentan y el script de transmisión está escrito. El alto mando es una provocación lejos de rodar en la Casa del Gobierno. Retire el riesgo de golpe bajo 70, y rápido, o la misión §RReasegurar el Alto Mando§! se agota y los tanques vienen.\n\n§YRiesgo de golpe§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_rice_pledge: "Arroz Pledge Program"
 SIA_rice_pledge_desc: "El Gobierno garantiza a los agricultores precios por encima del mercado para su cosecha de arroz y posee el arsenal estratégico. Los ingresos rurales aumentan, y la exposición del tesoro a los precios globales de los productos básicos aumenta con ellos."
 SIA_red_shirts_mobilized_idea: "Camisas Rojas en marzo"
 SIA_red_shirts_mobilized_idea_desc: "La red rural está movilizada y en las calles. Las manifestaciones masivas en Udon Thani, Khon Kaen y las afueras de Bangkok reúnen la base, y convencen al palacio y al alto mando que el gobierno elegido ha perdido el control. Cada marcha trae la cuenta con el ejército más cercano."
 SIA_kings_moral_authority_2: "El nuevo alineamiento"
 SIA_kings_moral_authority_2_desc: "El Décimo Reino se ha asentado en autoridad, pero es una autoridad diferente. Más visible, más comercial, más polémica que su predecesor. El peso moral de sesenta años en un trono no se transfiere en una sola coronación."
 SIA_kra_mobilization: "Movilización Nacional para el Canal de Kra"
 SIA_kra_mobilization_desc: "Cada grúa, excavadora e batallón de ingeniería que el Reino puede reunir está comprometido con el corredor Kra. Los precios del consumidor suben, los desagües del capital político y la calificación de aprobación del gobierno se dobla bajo el peso, pero la velocidad de construcción es extraordinaria. Esta idea se elimina cuando el canal está completo."
 SIA_kra_canal: "El Canal de Kra"
 SIA_kra_canal_desc: "El canal que conecta el Golfo de Tailandia con el Mar Andamán hace de Tailandia el punto de encuentro del segundo carril de transporte más ocupado del mundo. Los peajes fluyen en el tesorería, las marinas colan cortésmente por los derechos de tránsito, y la opinión de Bangkok vale la pena solicitar en cada capital asiático."
 SIA_kra_debt_trap: "Franja y la Ruta Deuda"
 SIA_kra_debt_trap_desc: "El canal era barato para empezar porque Beijing pagó por ello. El cronograma de reembolso se denomina en yuan, el colateral es la vía hídrica misma, y cada sobrecosto de costes profundiza la obligación. Los precios de los consumidores van hacia arriba y el capital político se escapa mientras que los compuestos del préstamo en el fondo."
 SIA_kra_debt_serviced: "Reestructuración de la deuda"
 SIA_kra_debt_serviced_desc: "El préstamo ha sido renegociado en términos severos pero sobrevivibles. La crisis ha pasado, el canal es tailandés, y el gobierno ha ganado una medida de credibilidad para enfrentarse a Beijing en la mesa de negociación más que en la sala de atrás."
 SIA_kra_default_pariah: "Soberana Default"
 SIA_kra_default_pariah_desc: "Tailandia se alejó del préstamo Franja y la Ruta. El canal es el propio, pero los mercados internacionales de crédito recuerdan, los socios comerciales se ocupan y el precio del capital es alto para un país que ha demostrado que repudiará una deuda cuando la política lo exija."
 SIA_kra_lease_concession: "Concesión de Pekín"
 SIA_kra_lease_concession_desc: "Para liquidar la deuda, se concedió una concesión operativa a largo plazo en parte del canal a una empresa estatal china. El Reino todavía vuela la bandera en las cerraduras, pero una parte de cada peaje ahora navega a Beijing, y el mundo ha notado quién realmente tiene el contrato de arrendamiento."
 SIA_kra_capital_flight: "Vuelo de capital"
 SIA_kra_capital_flight_desc: "El valor predeterminado espantó los mercados. El capital extranjero se dirige a las salidas, el baht está bajo presión, y el banco central está quemando reservas para frenar el sangrado. El choque es severo pero temporal, y la confianza volverá una vez que el polvo se calme."
 SIA_kra_delay: "Construcción Delay"
 SIA_kra_delay_desc: "En lugar de verter más dinero en una fase que superó el presupuesto, el gobierno aceptó un calendario más lento. La velocidad del edificio sufre y las ópticas son pobres, pero el tesoro se ahorra lo peor de los sobrecostos."
 SIA_kra_canal_sovereign: "El Soberano Canal"
 SIA_kra_canal_sovereign_desc: "Construido sin un acreedor extranjero o una cláusula extranjera, el canal es tailandés al último bollard. La prima pagada por la soberanía absoluta compra una base naval-industrial más profunda, un régimen de peaje más fuerte y un prestigio nacional que ninguna concesión podría coincidir."
 SIA_kra_fortress: "Fortaleza Canal"
 SIA_kra_fortress_desc: "Las baterías costeras, los búnkeres endurecidos y una guarnición naval permanente hacen de la Kra una vía de navegación que la Marina Real tailandesa puede mantener por la fuerza. La flota agudiza sus habilidades protegiendo el punto de encuentro, pero el paso militarizado cuesta Bangkok un poco de buena voluntad entre las líneas de transporte."
 SIA_kra_neutral_transit: "Transit Regime neutral"
 SIA_kra_neutral_transit_desc: "El Kra está abierto a todas las banderas en igualdad de condiciones, garantizada por un tratado y confiada por todo poder marítimo. El tráfico y la buena voluntad fluyen juntos. Los peajes corren alto, la opinión de las naciones negociadoras suben y el canal se convierte en un arma global común más que nacional."
 SIA_red_revival: "Fantasmas del CPT"
 SIA_red_revival_desc: "Los cuadros del Partido Comunista de Tailandia, los sobrevivientes de la lucha de 1970, sus hijos, sus estudiantes, han surgido desde los márgenes. El partido tiene energía política, una teoría de la historia y un apetito por el poder. También tiene enemigos, y su presencia en la conversación nacional cuesta al país unos pocos puntos porcentuales de estabilidad cada mes que se niega a trabajar dentro del sistema existente."
 SIA_general_strike_idea: "General Strike (en curso)"
 SIA_general_strike_idea_desc: "El país está siendo deliberadamente paralizado. Docks, ferrocarriles, escuelas, hospitales que operan en equipos de esqueleto. Estabilidad cae un por ciento cada semana que sostiene la huelga. Conducir el impulso a 100 mediante las decisiones del General Strike y el gobierno capitula. Deja que los 180 días salgan cortos y el ejército se haga cargo.\n\n§RMomento de huelga§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_western_sanctions: "West Economic Sanctions"
 SIA_western_sanctions_desc: "Los Estados Unidos y sus aliados han impuesto un paquete de sanciones a Tailandia tras el cambio de gobierno. La inversión se ha congelado, la financiación del comercio se ha vuelto difícil de organizar y se suspenden varios acuerdos bilaterales. El costo es real, y también el beneficio político de tener un enemigo externo claro."
 SIA_asean_pariah: "Parías de la Región"
 SIA_asean_pariah_desc: "La oferta de Tailandia para subyugar a sus vecinos lo ha convertido en un parías a través del sudeste asiático y más allá. Los socios de la ASEAN han congelado Bangkok fuera del comercio regional, el capital extranjero ha huido del agresor, y el costo de cada ladrillo y barril ahora refleja un reino en guerra con la región que dirigió una vez. La aislamiento tiene un precio, y la economía tailandesa lo está pagando."
 SIA_peoples_siam: "El Bloc de Solidaridad Popular"
 SIA_peoples_siam_desc: "Tailandia se ha anclado en una alineación regional con Laos y Vietnam. El marco de reconocimiento mutuo proporciona cobertura diplomática, reduce el aislamiento y, para un país que acaba de nacionalizar sus principales industrias, proporciona las relaciones comerciales que mantienen a los estantes almacenados. La cooperación entre la leche en todo el bloque es la base de una postura de defensa genuinamente independiente."
 SIA_green_rush: "El rubor verde"
 SIA_green_rush_desc: "La despenalización del cannabis ha abierto un nuevo mercado agrícola de productos básicos. Los agricultores isaos están diversificando, los exportadores de productos herbarios se registran más rápido de lo que la agencia de licencias puede procesarlos, y un rincón del sector hospitalario de Bangkok ha pivotado tranquilamente. Los críticos lo llaman un experimento social. Los recibos de tesorería lo llaman ingresos."
 SIA_war_plan_brm: "Plan de Guerra Burma"
 SIA_war_plan_brm_desc: "Los planificadores operativos tailandeses han jugado la campaña de Salween en detalle. corredores de infiltración, nodos logísticos, los Shan irregulares como multiplicador de fuerza. El plan es actual, la infraestructura de estadificación está en su lugar, y el cuerpo oficial conoce el terreno."
 SIA_war_plan_lao: "Plan de guerra Laos"
 SIA_war_plan_lao_desc: "Los cruces de Mekong, las tierras altas pasan, la vulnerabilidad de Vientiane a un empuje desde la dirección Nong Khai. El plan de campaña existe en cada carpeta operacional del 3er Cuartel General del Ejército. Se ha mejorado silenciosamente la infraestructura fronteriza para apoyar un rápido avance."
 SIA_war_plan_cbd: "Plan de guerra Camboya"
 SIA_war_plan_cbd_desc: "El pasillo de Preah Vihear, la bufanda Dangrek, el plano se acerca a Siem Reap. Los planificadores tailandeseses han dibujado los límites operativos y la logística ha partido de guerra tres veces. El estado de estancamiento está listo."
 SIA_war_plan_may: "Plan de guerra Malasia"
 SIA_war_plan_may_desc: "La frontera de 1909 es una limitación de planificación, no un hecho de naturaleza. Las órdenes de campaña detalladas para el enfoque Narathiwat y el corredor Kelantan existen en una carpeta roja marcada RESTRICTED. Las inversiones profundas en infraestructura Sur se duplican como terrenos de estancamiento."
 SIA_protector_of_the_realm: "Protector del Reino"
 SIA_protector_of_the_realm_desc: "Las fuerzas armadas tailandesas ahora anclan la ocupación de la frontera reclamada, manteniendo el orden a través del terreno Shan, Lao, Khmer y Malay ganado en las guerras Pan-Thai mientras que la administración civil se pone al día. El cansancio de guerra se desvanece con la victoria asegurada, y el orgullo en un reino reunificado mantiene el frente del hogar."
 SIA_comprehensive_security_idea: "Seguridad integral"
 SIA_comprehensive_security_idea_desc: "El marco integrado de seguridad nacional reduce la duplicación entre los organismos de interior, defensa e inteligencia. El exceso de consumo cae a medida que la coordinación mejora. La deriva hacia cualquier patrono externo se hace mesurablemente más difícil para el ingeniero."
 SIA_cambodia_partnership: "Asociación de Camboya"
 SIA_cambodia_partnership_desc: "Una relación bilateral estructurada con Phnom Penh abarca la facilitación del comercio, las zonas de desarrollo conjunto y un acuerdo diplomático que posiciona a Tailandia como socio económico preferido de Camboya. La influencia fluye en ambas direcciones, y los recibos comerciales fluyen en una."
 SIA_fuel_reserves: "Reservas estratégicas de combustible"
 SIA_fuel_reserves_desc: "Tres meses de consumo nacional de combustible en reservas estratégicas, en granjas distribuidas de tanques en las cinco regiones. El arsenal suaviza los picos de precios, proporciona amortiguación de crisis y señala a los socios que la logística militar de Tailandia no son rehenes de una sola ruta de suministro."
 SIA_medical_tourism_boom: "Auge del turismo médico"
 SIA_medical_tourism_boom_desc: "Se ha difundido la palabra. Los hospitales privados de Bangkok se reservan sólidos con pacientes extranjeros, y los convalecientes permanecen como turistas. Los recibos y las llegadas construyen mes tras mes, mientras que los distritos corren calientes y los lugareños esperan más tiempo para una cama."
 SIA_aec_tailwind: "Integración de ASEAN Tailwind"
 SIA_aec_tailwind_desc: "El empuje de facilitación del comercio está pagando por toda la región. Baja fricción en las fronteras, cadenas de suministro más profundas, fábricas tailandesas ganando contratos regionales. Los compuestos de crecimiento impulsados por las exportaciones a lo largo de años, incluso cuando el ajuste exprime la capacidad de los bienes de consumo en el hogar."
 SIA_arms_export_orders: "Libro de órdenes de exportación de defensa"
 SIA_arms_export_orders_desc: "El libro de pedidos está lleno. MRAPs, munitions, loitering drones and license-building systems ship to ASEAN buyers on a rolling schedule. Las líneas de armas corren a la capacidad y Tailandia está de pie mientras el proveedor preferido de la región se profundiza, a costa de la fricción diplomática que armar el vecindario siempre trae."
 SIA_royal_development_lands: "Reales tierras de desarrollo"
 SIA_royal_development_lands_desc: "Los proyectos patrocinados por la Corona han abierto nuevas tierras al cultivo y la extracción y han establecido las provincias que tocan. La campiña es más tranquila y la base de recursos más amplia, aunque las propias obras derriben los bienes de la nación mientras corren."
 SIA_eec_construction_boom: "Oleaje de construcción de la CEE"
 SIA_eec_construction_boom_desc: "El Corredor Económico Oriental es un sitio de construcción en vivo, con grúas sobre los puertos, camas de ferrocarril clasificadas y conchas de fábrica que suben. El edificio va más rápido y aumenta la producción, pero el aumento de la capacidad del consumidor-bienes durante la duración."
 SIA_asean_chair_spotlight: "Silla de la ASEAN Spotlight"
 SIA_asean_chair_spotlight_desc: "Bangkok tiene el dil y las cámaras. La presidencia compra una buena voluntad fácil y una postura diplomática más barata en toda la Asociación, mientras dure el foco."
 SIA_purge_disruption: "Disrupción anti-injerto"
 SIA_purge_disruption_desc: "El barrido de la aplicación ha congelado las adquisiciones y ha puesto a la vanguardia las redes de patrocinio. El Contratante se ha apoderado y la máquina política está suciando. Este es el precio de un sistema limpio, pagado por adelantado."
 SIA_army_wage_inflation: "Oficial inflado de nómina"
 SIA_army_wage_inflation_desc: "Los favores compraron el bronce, pero el precio era una nómina hinchada. Los sueldos oficiales, las prestaciones y los puestos fantasmas han sido acolchados en todas las filas, y la factura del salario militar funcionará caliente hasta que el presupuesto vuelva al tacón."
 SIA_chuan_leekpai_desc: "El político del Partido Demócrata de Veteranos y el estadista mayor que sirvió como Primer Ministro entre 1992 y 1995 y entre 1997 y 2001. Su segundo mandato llevó a Tailandia a través de la crisis financiera asiática en un programa del FMI. Conocido por su inalcanzable integridad personal en un rife de sistema con corrupción."
 SIA_thaksin_shinawatra_desc: "Billionaire telecommunications magnate who founded Thai Rak Thai and won a landslide in 2001. Sus programas populistas, el plan de salud de 30 baht y los fondos para el desarrollo de aldeas, transformaron la política rural. Omitido en un golpe militar de 2006, gobernó Tailandia del exilio a través de múltiples partidos proxy."
 SIA_bhumibol_adulyadej_desc: "Rama IX, el noveno monarca de la dinastía Chakri y el jefe de estado más largo del mundo. Su autoridad moral como símbolo unificador se desplegó en cada crisis política. Su paso en octubre de 2016 terminó un reinado de 70 años y se usurpó en un período de profundo luto nacional."
 SIA_vajiralongkorn_desc: "Rama X, Maha Vajiralongkorn, que ascendió al trono tras la muerte de su padre en 2016. Ha ejercido el control directo sobre los bienes coronarios y la Guardia Real, e insertado más directamente en asuntos políticos que sus predecesores. Su reinado coincide con el período más turbulento de la historia constitucional tailandesa."
 SIA_abhisit_vejjajiva_desc: "El líder demócrata con educación en Oxford, que se convirtió en Primer Ministro a través de un voto parlamentario en 2008 tras la disolución del Partido Poder Popular por el Tribunal Constitucional. Su gobierno supervisó la represión de abril a mayo de 2010 contra los manifestantes de Red Shirt en Bangkok."
 SIA_yingluck_shinawatra_desc: "Pheu Thai leader and youngest sister of Thaksin Shinawatra, que ganó las elecciones de julio de 2011 con la mayoría más grande desde 2001. Su gobierno lanzó el programa de arroz-pledging que más tarde se convirtió en un gran escándalo de corrupción. Fue removida por el Tribunal Constitucional en 2014 y huyeron del país antes de un veredicto criminal"
 SIA_prayut_chanocha_desc: "Comandante real del ejército tailandés que dirigió el golpe de mayo 2014, Tailandia duodécimo, y sirvió como Primer Ministro durante nueve años bajo la junta de la NCPO y el Partido Palang Pracharath. Arquitecto del sistema proporcional mixto de la constitución 2017 diseñado para fragmentar partidos de oposición"
 SIA_sonthi_boonyaratglin_desc: "Comandante del ejército que encabezó el golpe de septiembre de 2006 que derrocó a Thaksin Shinawatra mientras el primer ministro estaba en el extranjero. Presidió la junta del Consejo de Seguridad Nacional hasta que se instaló un gobierno civil interino. Más tarde entró en la política electoral como líder de un partido menor."
 SIA_anutin_charnvirakul_desc: "Líder del Partido Bhumjaithai y escion de una familia industrial-constructora que se levantó a la prominencia como Viceprimer Ministro. El posicionamiento estratégico de su partido entre bloques militares y civiles lo convirtió en un rey en tres sucesivos gobiernos de coalición. A finales de 2025, después de la expulsión del Tribunal Constitucional de Paetongtarn."
 SIA_pita_limjaroenrat_desc: "Move Forward Party leader cuyo partido ganó las elecciones del 2023 de mayo con la mayor cuota de voto, sólo para ser bloqueado de formar un gobierno por el Senado nombrado militar. El Tribunal Constitucional disolvió posteriormente el partido y lo prohibió de la política durante cinco años."
 SIA_natthaphong_ruengpanyawut_desc: "Sucesor de Pita Limjaroenrat como líder del partido popular reconstituido, y el gobernador elegido más joven de Bangkok. Representa el cambio generacional en la política progresista tailandesa hacia la gobernanza local y la política climática junto con la reforma constitucional."
 SIA_songkhram_phaendin_desc: "Marshal de la escuela pan-tai, llevando un nombre que significa 'guerra de la tierra'. Subió a través del cuerpo de oficiales predicando que las cesiones de 1893 y 1909 eran heridas todavía abiertas, y que sólo el gobierno de un soldado los cerraría."
 SIA_somchai_ratchaphruek_desc: "Un veterano de los años de la selva del Partido Comunista, surnado por el árbol de lluvia dorada. Sobrevivió las amnistías que vaciaron los campamentos y volvió a organizarse en el noreste, sosteniendo que la revolución fracasó en su momento y no en sus objetivos."
 SIA_banharn_silpaarcha_desc: "Gráfico Líder del Partido tailandés y patrono de la construcción-industria de Suphanburi que sirvió como Primer Ministro entre 1995 y 1996. Su gobierno derramó la infraestructura provincial gastando en su territorio natal tan fuertemente que la prensa le apodaba el cajero automático caminando. La coalición se derrumbó dentro de un año en medio de las acusaciones de corrupción y los signos de alerta económica que precedieron al accidente de 1997."
 SIA_chavalit_yongchaiyudh_desc: "Fundador y líder del Partido Nueva Aspiración, y ex Comandante en Jefe del Ejército Real de Tailandia, que se convirtió en Primer Ministro en noviembre de 1996. Su gobierno ocupó el cargo cuando la crisis de baht se rompió a mediados de 1997, y renunció que noviembre bajo presión del colapso de la moneda su administración no pudo contener."
 SIA_thanathorn_juangroongruangkit_desc: "Auto-parts magnate que cofundó el Partido Futuro Adelante en 2018 y se convirtió en la cara de su política de reforma impulsada por jóvenes. Su rápido ascenso alarmaba el establecimiento. El Tribunal Constitucional disolvió el partido en febrero de 2020 y lo prohibió de su cargo durante una década a lo largo de un préstamo que el partido le había tomado personalmente."
 SIA_virot_paoin_desc: "Un teniente general de policía que tomó el liderazgo de Pheu Thai una vez que la línea de Thaksin siguió adelante, continuando con la coalición populista del partido detrás de un uniforme en lugar de un podio de rally. Su estilo de gobierno se apoya en la lealtad institucional dentro de la policía y el servicio civil en lugar de la movilización rural masiva que su predecesor construyó el partido."
 SIA_srettha_thavisin_desc: "Ejecutivo de inmobiliaria y candidato a primer ministro de Pheu Thai 2023, que se convirtió en Primer Ministro en agosto en la coalición de regreso al poder del partido con antiguos rivales. El Tribunal Constitucional lo retiró de su cargo en agosto de 2024 por una violación ética vinculada a un nombramiento de gabinete, uno de los mandatos más cortos de cualquier estreno tailandés elegido en un decenio."
 SIA_paetongtarn_shinawatra_desc: "La hija más joven de Thaksin Shinawatra y el tercer estreno Shinawatra de Pheu Thai, que asumió el cargo en agosto de 2024 como respuesta del partido a la remoción de su predecesor por la corte. Una llamada telefónica filtrada con Hun Sen de Camboya sobre la disputa fronteriza le costó el estreno dentro de un año, reviviendo preguntas acerca de cuánto de la dirección del gobierno todavía corre a través de su padre."
 SIA_greater_thailand_consolidated: "Aumento de la consolidación de Tailandia"
 SIA_greater_thailand_consolidated_desc: "Las campañas irredentistas han concluido. El reino es más grande y más fuerte que antes, sus reservas de mano de obra se profundizan, sus industrias ensanchadas, su gente unificada por el sacrificio compartido y la victoria compartida. El aparato estatal que apostó la guerra ahora impulsa la construcción."
 SIA_pax_aseana_idea: "Pax Aseana"
 SIA_pax_aseana_idea_desc: "Tailandia lidera un bloque de seguridad estable, coherente y autosuficiente. El capital político fluye de las capitales aliadas, y la estabilidad se ve reforzada por el conocimiento de que Bangkok no se mantendrá solo, ni tampoco ningún aliado. La paz de la región está suscrita por el poder tailandés."
 SIA_asean_defense_member: "Miembro de la SEATO"
 SIA_asean_defense_member_desc: "Esta nación decidió unirse al pacto regional de defensa de Tailandia por su propio acuerdo. El comando compartido y un propósito común fijan el frente del hogar y endurecen la defensa. Librado por consentimiento en lugar de coacción, su compromiso con la comunidad sostiene que una alianza forzada se habría derrumbado."
 SIA_rally_round_flag: "Rallye Ronda la bandera"
 SIA_rally_round_flag_desc: "El incidente fronterizo ha unido al público tailandés detrás de las fuerzas armadas. El sentimiento nacionalista es elevado y las colas de conscripción son largas, pero el estado de ánimo es volátil y la luna de miel no durará para siempre."
 SIA_anti_graft_idea: "Ejecución de la lucha contra el soborno"
 SIA_anti_graft_idea_desc: "Una Comisión Nacional Anticorrupción empobrecida ha comenzado a desmantelar las redes aduaneras y de adquisición que sifonan los ingresos del estado tailandés. Los contratistas compiten sobre el mérito, y los derechos de importación fluyen al tesorería en lugar de a intermediarios. Durante seis meses la campaña es un arrastre del poder político, el precio de correr hacia los intereses arraigados."
 SIA_strait_patrol_posture: "Postura de la Patrulla del Estrecho"
 SIA_strait_patrol_posture_desc: "La Marina Real de Tailandia está llevando a cabo una rotación intensificada de patrullas por el estrecho. Escorts sombra los carriles de envío, las líneas de piquete miran los enfoques, y la flota va más lejos del puerto mientras que la postura sostiene."
 SIA_asean_security_pledge: "Promesa de seguridad de la ASEAN"
 SIA_asean_security_pledge_desc: "Tailandia se ha comprometido como el escudo del sudeste asiático en lugar de su conquistador. Las primeras garantías van a los vecinos que aceptan la protección de Bangkok, y el cuerpo diplomático se apoya en el trabajo paciente de reaseguro. Las garantías son más baratas, las relaciones tienen un costo menor y las fuerzas del Reino se dedican a hacer creíble la promesa."
 SIA_protector_of_asean: "Protector of ASEAN"
 SIA_protector_of_asean_desc: "Tailandia ha elegido el papel de garante en lugar de conquistador. Al extender su paraguas de seguridad a través del Sudeste Asiático, el Reino gana la confianza de sus vecinos y la posición de un gran poder regional. Un cuerpo diplomático permanente ahora proyecta influencia tailandesa en varias capitales de la ASEAN a la vez, financiada por el capital político constante que el papel manda. La diplomacia es más barata, la defensa es más firme y la buena voluntad de la ASEAN fluye hacia Bangkok."
 SIA_frontier_buffer_idea: "Estados ribereños"
 SIA_frontier_buffer_idea_desc: "Los Shan y Karen son mantenidos armados y amistosos como un escudo vivo a lo largo de la frontera con Birmania. Garantías más baratas, una frontera más firme y un borde defensivo contra cualquier empuje de Naypyidaw."
 SIA_shan_campaign: "Campaña Shan"
 SIA_shan_campaign_desc: "El ejército está movilizado y orientado a operaciones en el estado de Shan del Sur, con bonificaciones de combate contra las fuerzas de Shan durante la campaña."
 SIA_karen_campaign: "Campaña Karen"
 SIA_karen_campaign_desc: "Las fuerzas tailandesas presionan en las colinas Karen, con bonificaciones de combate contra las fuerzas Karen durante la campaña."
 SIA_wa_campaign: "Campaña de Wa"
 SIA_wa_campaign_desc: "Las fuerzas tailandesas conducen a las colinas de Wa contra la UWSA, con bonificaciones de combate contra las fuerzas de Wa durante la campaña."
 SIA_us_mech_standard: "NATO-Standard Mechanization"
 SIA_us_mech_standard_desc: "La doctrina americana y los vehículos occidentales traen una organización superior, reconocimiento y fiabilidad de campo, a un precio contado en el presupuesto de defensa."
 SIA_reliability_woes: "Peores de fiabilidad"
 SIA_reliability_woes_desc: "Masa barata vino con apoyo barato. Las fallas de transmisión y los atrasos de piezas de repuesto sap morale y confiabilidad del equipo hasta que la flota se resuelve."
 SIA_chd620_teething: "Problemas de desecación del motor"
 SIA_chd620_teething_desc: "La central eléctrica china sustituta funciona caliente y no se aprueba. Hasta que los bichos se resuelven, los barcos son más lentos y sus tripulaciones menos confiados."
 SIA_bamboo_doctrine: "La Doctrina de Bamboo"
 SIA_bamboo_doctrine_desc: "Amistad con todos y no he visto a nadie. Flexibilidad diplomática, buena voluntad amplia y la estabilidad interna de una nación que se niega a elegir un lado."
 SIA_loyal_opposition: "La Oposición de Loyal"
 SIA_loyal_opposition_desc: "Ganar o perder, la fiesta permanece. Una organización de siglo con raíces en cada provincia y un núcleo establecido de votantes que no se derivan con el clima político. Es el distrito más constante de la política tailandesa, y lo más difícil para cualquier movimiento rival, populista o palacio, para aflojarse."
 SIA_democratic_institutionalism: "Institucionalismo democrático"
 SIA_democratic_institutionalism_desc: "Las reglas ahora superan a los gobernantes. Juzgados independientes, parlamento de trabajo, ministerios profesionales y un público que espera poder cambiar las manos en la urna. La democracia tailandesa se ha convertido en un sistema más que una temporada, y resiste la captura de las calles, el palacio o los cuarteles."
 SIA_pt_tier_dormant: "Mirando la marea populista"
 SIA_pt_tier_dormant_desc: "Por ahora es el voto rural y los demócratas gobiernan en paz. Pero la máquina de Thaksin nunca duerme realmente. En el norte y noreste las viejas lealtades esperan, listos para reunir el momento en que el partido en el poder se ve complaciente. Mantenga adelante con la máquina de circunvalación y la marea permanece en silencio.\n\n§Y Tido populista§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_pt_tier_rising: "Las mareas populistas"
 SIA_pt_tier_rising_desc: "En el noreste las banderas rojas están fuera otra vez. La máquina de Thaksin está ganando, y un gobierno que no puede responder comienza a parecer un cuidador esperando ser expulsado.\n\n§Y Tido populista§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_red_shirt_encampment: "El campamento de Ratchaprasong"
 SIA_red_shirt_crackdown: "El Crackdown de Ratchaprasong"
 SIA_red_shirt_encampment_desc: "Decenas de miles de camisas rojas sostienen el distrito comercial central de Bangkok detrás de barricadas de bambú y neumáticos. Los centros comerciales están cerrados, las oficinas están vacías y el distrito de negocios ha dejado de funcionar. El gobierno ha elegido esperarlos."
 SIA_red_shirt_crackdown_desc: "El ejército despejó la intersección con rondas en vivo. Las barricadas se han ido y también la ocupación, pero los edificios están quemados, la policía está costando más de lo que hicieron, y el país ha visto soldados disparar civiles en televisión."
 SIA_pt_tier_surge: "Un deslizamiento populista Looms"
 SIA_pt_tier_surge_desc: "Las encuestas son una trucha en espera. Las camisas rojas están hablando de venir a Bangkok, y un gobierno que permite que la marea alcance 100 descubrirá si lo significaban.\n\n§Y Tido populista§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_thaksin_ascendant: "Ascendente tailandés thai Rak"
 SIA_thaksin_ascendant_desc: "El accidente de 1997 rompió a los viejos partidos, y en los pasos de vacío Thaksin Shinawatra con una fortuna de telecomunicaciones, una máquina disciplinada, y una promesa que las aldeas del norte y el noreste han esperado una generación para escuchar. Salud barata, alivio de la deuda y un fondo de desarrollo para cada pueblo. Mes a mes el voto rural se reúne detrás de su tailandés Rak Thai, y los demócratas de Chuan gobiernan en tiempo prestado.\n\nCada mes Thai Rak Thai y el bloque más amplio no alineado ganan alrededor del 2% de apoyo, extraído del voto de establecimiento, hasta que la realineación de 2001 resuelve la cuestión.\n\n§YMes a la Reckoning§!: [?ROOT.SIA_thaksin_rise_months|0]/12"
 SIA_broad_coalition_idea: "Una amplia coalición"
 SIA_broad_coalition_idea_desc: "Ministerios entregados a los pequeños partidos y jefes provinciales a cambio de un cortafuegos parlamentario. Amplia y estable, pero cada decisión es una negociación, y el gabinete se mueve a la velocidad de su socio más renuente. El trato es bueno por un año."
 SIA_mekong_soft_power_idea: "Poder suave Mekong"
 SIA_mekong_soft_power_idea_desc: "Los bancos, contratistas y emisores tailandeses llevan la influencia de Bangkok en el Mekong. Una voz más fuerte en el vecindario, y el ancho de banda diplomático para cortejar una nación más al mismo tiempo."
 SIA_occupation_administration: "Administración de ocupación"
 SIA_occupation_administration_desc: "Los gobernadores militares, las juntas de reasentamiento y las oficinas de reconstrucción dirigen ahora las provincias conquistadas. Cumplimiento escala más rápido, la resistencia armada está bajada, y las carreteras y vías de integración suben más rápidamente. El aparato de sostener lo que tomó el ejército."
 SIA_deep_south_category: "El sur profundo"
 SIA_deep_south_category_desc: "Las provincias malaya-musulmanas de Yala, Pattani y Narathiwat están en insurgencia. La represión, el desarrollo y el diálogo tienen todos sus defensores y sus costos.\n§YLa intensidad de la insurgencia§! (0-100) denota la fuerza de la insurgencia meridional. Un nivel superior significa incidentes semanales más mortíferos y un arrastre más pesado en el sur. La fuerza, el desarrollo y el diálogo lo empujan hacia abajo. Las atrocidades y el abandono lo empujan hacia arriba. Las tácticas Iron-Fist dejan un nivel permanente §YGrievance§! que la intensidad nunca puede caer por debajo.\n\n§Y Intensidad de la insurgencia§!: [?ROOT.SIA_insurgency_intensity|0]%\n§YGrievance Floor§!: [?ROOT.SIA_ds_intensity_floor|0]%"
 SIA_greater_thailand_category: "Tailandia más grande"
 SIA_greater_thailand_category_desc: "El programa perdido-territorios. Milicias, reclamaciones e integración de tierras recuperadas."
 SIA_ds_security_operations: "Sweeps de seguridad"
 SIA_ds_security_operations_desc: "Operaciones de cerco y registro en las provincias del sur. El orden mejora mientras duran las operaciones. Si acaban con la insurgencia o la alimentan es debatido en cada informe posterior a la acción."
 SIA_ds_development_fund: "Fondo para el Desarrollo Meridional"
 SIA_ds_development_fund_desc: "Carreteras, escuelas y empleos para las provincias más pobres del país. Más lento que los soldados, más barato que la guerra."
 SIA_ds_emergency_decree: "Decreto de emergencia"
 SIA_ds_emergency_decree_desc: "Poderes especiales para las fuerzas de seguridad en las provincias meridionales. Detención sin cargos, disposiciones de inmunidad, toques de queda. Efectiva y corrosiva."
 SIA_ds_peace_dialogue: "Diálogo de paz abierto"
 SIA_ds_peace_dialogue_desc: "Autorizar conversaciones formales con el movimiento separatista bajo la mediación de Malasia. Hablar con ellos concede que existen. Es también la única forma de que esto termine en una mesa."
 SIA_arm_shan_militias: "Armar a las milicias shan"
 SIA_arm_shan_militias_desc: "Abastecer discretamente a los ejércitos shan a través de la frontera birmana. Cada convoy compra influencia sobre lo que llegue a ser el Estado Shan."
 SIA_shan_client_state: "Patrocinar el estado de Shan"
 SIA_shan_client_state_desc: "Reconocer y respaldar un Estado shan alineado con Bangkok. Nuestros hermanos obtienen su país y nosotros su lealtad."
 SIA_integrate_shan: "Integrar las tierras shan"
 SIA_integrate_shan_desc: "Extender la administración tailandesa a la meseta Shan, con gobernadores, escuelas y el baht. La población debe estar suficientemente pacificada antes de que Bangkok pueda consolidar el control."
 SIA_integrate_laos: "Integrar las tierras laosianas"
 SIA_integrate_laos_desc: "Extender la administración tailandesa a las provincias laosianas reclamadas. Se requiere un alto Cumplimiento y una baja Resistencia en el estado núcleo antes de que pueda avanzar la integración formal."
 SIA_integrate_cambodia: "Integrar las provincias jemeres"
 SIA_integrate_cambodia_desc: "Extender la administración tailandesa a Battambang y Siem Reap, como en 1941-1946. La población jemer debe aceptar el gobierno tailandés antes de poder imponer la administración formal."
 SIA_integrate_malaya: "Integrar las provincias del sur"
 SIA_integrate_malaya_desc: "Extender la administración tailandesa a los antiguos sultanatos cedidos en 1909. La integración exige que la población quede firmemente bajo la influencia de Bangkok antes de la anexión formal."
 SIA_cost_1_0: "£treasury 1.0"
 SIA_cost_1_5: "£treasury 1.5"
 SIA_thaksinite_party_governs_tt: "§Y[neutral_Social_L]§! es el partido gobernante."
 SIA_cost_2_0: "£treasury 2.0"
 SIA_cost_2_0_blocked: "£treasury 2.0 §R(insufficient)§!"
 SIA_otpc_education_strain: "1 Tablet Per Child Rollout"
 SIA_otpc_education_strain_desc: "Cargadores, roturas, unidades de reemplazo y el presupuesto de entrenamiento nadie costó. El ministerio de escuelas está absorbiendo el precio real del programa."
 SIA_packed_senate: "Un Senado de Nuestra Propia"
 SIA_packed_senate_desc: "Loyalistas en la casa superior y las agencias independientes. Por ahora la legislación del gobierno pasa por el filo."
 SIA_cost_5_0: "£treasury 5.0"
 SIA_economy_category: "Estratégico y económico Decisiones"
 SIA_economy_category_desc: "Turismo, medicina, fabricación, armas y megaproyectos, junto con las palancas de la diplomacia de la ASEAN y la alta estrategia. Los motores del estado tailandés responden a la inversión y al capital político, cuando el tesorería y el gabinete pueden evitarlos."
 SIA_ds_hearts_and_minds: "Corazones y mentes"
 SIA_ds_hearts_and_minds_desc: "Escolarización en malayo, acercamiento religioso, juntas de compensación y mediadores de aldea. Nadie hace un desfile por ello, pero el mapa de incidentes se vuelve más tranquilo."
 SIA_contain_the_crisis: "Contener la crisis"
 SIA_contain_the_crisis_desc: "El Sur Profundo ha cocido. Conducir la intensidad insurgente por debajo del punto de ebullición dentro de seis meses, o la violencia en espiral y el costo de estabilidad y legitimidad aumentará."
 SIA_choose_a_path: "Elegir un camino en el sur"
 SIA_choose_a_path_desc: "La crisis es activa y el gobierno tiene un mandato político claro, pero no se ha comprometido ninguna estrategia sur. Cierre en una vía (fuerza, desarrollo real o diálogo) dentro del año, o la deriva costará al Reino caro."
 SIA_medical_tourism_campaign: "Campaña de Turismo Médico"
 SIA_medical_tourism_campaign_desc: "Comercializar los hospitales tailandeses al mundo, con cirugía y convalecencia a una fracción de los precios occidentales y con playa incluida. La campaña se paga sola, si las salas aguantan la carga."
 SIA_eec_investment_phase: "Fase de inversión de la CEE"
 SIA_eec_investment_phase_desc: "Liberar el siguiente tramo de fondos del Corredor Económico Oriental para despeje de terrenos, servicios, puertos y obras ferroviarias en las provincias del este."
 SIA_cost_3_0: "£treasury 3.0"
 SIA_cost_4_0: "£treasury 4.0"
 SIA_cost_6_0: "£treasury 6.0"
 SIA_cost_7_0: "£treasury 7.0"
 SIA_cost_1_0_blocked: "£treasury 1.0 §R(insufficient)§!"
 SIA_cost_1_5_blocked: "£treasury 1.5 §R(insufficient)§!"
 SIA_cost_3_0_blocked: "£treasury 3.0 §R(insufficient)§!"
 SIA_cost_4_0_blocked: "£treasury 4.0 §R(insufficient)§!"
 SIA_cost_5_0_blocked: "£treasury 5.0 §R(insufficient)§!"
 SIA_cost_6_0_blocked: "£treasury 6.0 §R(insufficient)§!"
 SIA_cost_7_0_blocked: "£treasury 7.0 §R(insufficient)§!"
 SIA_family_holdings: "Tenencias familiares"
 SIA_family_holdings_desc: "La familia Shinawatra controla importantes acciones en telecomunicaciones, servicios por satélite, televisión por satélite y una docena de negocios relacionados. Convertir las relaciones gubernamentales en dividendos es una tradición familiar, y un flujo de ingresos que el partido cuenta."
 SIA_royal_projects: "Reales proyectos de desarrollo"
 SIA_royal_projects_desc: "Enviar equipos reales de desarrollo a las provincias rurales para granjas de demostración, clínicas móviles de salud, gestión de cuencas y formación profesional. El prestigio personal del Rey acompaña cada proyecto y los jefes de aldea recuerdan quién los envió."
 SIA_isoc_surveillance_sweep: "Cierre de vigilancia ISOC"
 SIA_isoc_surveillance_sweep_desc: "Enviar equipos de inteligencia del ISOC a barrer redes móviles, redes de informantes de aldea y pasos fronterizos del Profundo Sur. Sin órdenes, sin registros y con una imagen del Sur que el ejército nunca ha tenido."
 SIA_isoc_grid_disruption: "Disrupción de la red ISOC"
 SIA_isoc_grid_disruption_desc: "Meta los oleoductos de financiación, nodos de mando y redes de mensajería que sostienen el tempo operacional de la insurgencia. Cada nodo interrumpido es una bomba que no se apaga."
 SIA_ds_cordon_and_search: "Cordón y búsqueda"
 SIA_ds_cordon_and_search_desc: "Sellar aldeas y registrarlas casa por casa en busca de armas y combatientes. Rompe rápido el ritmo de los insurgentes, pero cada puerta derribada y cada pariente detenido profundiza el agravio del que se alimenta el movimiento."
 SIA_ds_fund_religious_schools: "Financiar las escuelas Pondok"
 SIA_ds_fund_religious_schools_desc: "Donaciones estatales para las escuelas religiosas malaya-musulmanas e instituciones culturales que el Sur tiene querido, en los términos propios del sur. Hace poco a la violencia esta semana, pero golpea duro con la alienación que lo sostiene."
 SIA_asean_rotating_summit: "Acoger la Cumbre de la ASEAN"
 SIA_asean_rotating_summit_desc: "Utilice la presidencia de Tailandia para acoger una cumbre de alto perfil, mostrando a Bangkok como la capital diplomática del sudeste asiático. La buena voluntad resultante se traduce en capital político en el país y prestigio en el extranjero."
 SIA_asean_mediate_myanmar: "Mediar en la crisis de Myanmar"
 SIA_asean_mediate_myanmar_desc: "Posicionar a Tailandia como mediador honesto entre la junta de Myanmar y la comunidad internacional. Un éxito discreto construye influencia duradera en Naipyidó. Un fracaso público sigue siendo una señal útil para el resto de la región."
 SIA_asean_free_trade_push: "Impulsar las medidas de libre comercio de la ASEAN"
 SIA_asean_free_trade_push_desc: "Utilice la presidencia para impulsar medidas de facilitación del comercio, como la armonización aduanera, la reducción de las barreras no arancelarias y los corredores comerciales digitales. Las bases llevan tiempo, pero los recibos de exportación llegan a su debido tiempo. Los vecinos de la ASEAN toman nota del liderazgo constructivo de Bangkok."
 SIA_retry_section_112: "Re-tablecer la Enmienda"
 SIA_retry_section_112_desc: "El primer intento de reformar la sección 112 falló en el poder legislativo. El retroceso público ha sido fuerte, pero también la contra-movilización de los jóvenes votantes. Un segundo intento, mejor preparado y redactado de forma más estrecha, todavía puede pasar si el momento es correcto."
 SIA_ds_autonomy_framework: "Marco de autonomía del Sur"
 SIA_ds_autonomy_framework_desc: "Pilotar un modesto plan de autonomía administrativa para las provincias malayo-musulmanas, con un consejo consultivo regional, estatus oficial para el malayo y financiación escolar descentralizada. No es independencia, ni de lejos, pero basta para demostrar que Bangkok sabe escuchar. Seis meses para diseñarlo, una generación para juzgarlo."
 SIA_isr_persistent_sweep: "ISR barrido persistente"
 SIA_isr_persistent_sweep_desc: "Ponga a los Ojos en el Cielo activos a un reloj permanente sobre el Sur Profundo: cruces fronterizos, tráfico móvil, movimientos de vehículos. Los insurgentes pierden la capacidad de moverse sin ser vistos, y no un soldado tiene que entrar en una aldea."
 SIA_political_gambits_category: "Partidos políticos"
 SIA_political_gambits_category_desc: "Entre enfoques, el gobierno aún tiene palancas: ministros reubicados, fiscales orientados, dinero enviado al interior y, llegado el caso, un pacto con el palacio o un día en los tribunales.\n\n§YPresión reformista§!: [?ROOT.SIA_reform_pressure|0]/100. El descontento urbano y juvenil se desliza hacia Move Forward. Por encima de 60 se desborda en protestas.\n§YMarea populista§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. El campo vuelve a deslizarse hacia Pheu Thai. Solo un gobierno demócrata contiene esto."
 SIA_cabinet_reshuffle: "Rehabilitación del gabinete"
 SIA_cabinet_reshuffle_desc: "Rotar a los ministros, comprar a los críticos y sacar al peor desempeño de la programación televisiva. Con él se va la Fatiga de Prayuth o la Política de la sala de tribunales, la que cuelgue del gobierno en ese momento. El partido proclama una renovación sin cambiar nada que importe."
 SIA_lese_majeste_lever: "Accionar la palanca de lesa majestad"
 SIA_lese_majeste_lever_desc: "Aplicación selectiva de la Sección 112 contra los críticos reformistas más ruidosos. Se presentan cargos, se niega la fianza, se retractan declaraciones. La oposición pierde una voz y todos los que ven lo que ocurre se alejan un paso más del sistema."
 SIA_coup_watch_category: "Los Cuartel están vigilando"
 SIA_coup_watch_category_desc: "Todo populista electo en la historia de Tailandia ha gobernado a la sombra del ejército. Las victorias rápidas, como favores de telecomunicaciones, contratos inflados y corruptelas familiares, compran dinero y votos ahora, pero cada una sube el §YRiesgo de golpe§!. Este también sube solo cada semana, en 0.5 normalmente y en 1.0 mientras la Estabilidad esté por debajo del 50%, y nunca baja sin acción. Las decisiones de abajo lo hacen bajar, y cada una te cuesta algo. Si pasa de 85, se arma la misión §RTranquilizar al alto mando§!. Desactívalo o el ejército se queda con el gobierno.\n\n§YRiesgo de golpe§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_shin_corp_tax_holiday: "Sastre a Telecom Tax Holiday"
 SIA_shin_corp_tax_holiday_desc: "Reescribir discretamente los términos de la concesión para que el imperio familiar de telecomunicaciones pague casi nada en su próxima bonanza. El tesoro y el partido ganan. Los generales llevan la cuenta."
 SIA_school_milk_contract: "Adjudicar el contrato de la leche escolar"
 SIA_school_milk_contract_desc: "Un programa nacional de leche gratuita para escolares rurales, muy popular en las aldeas, canalizado a través de un cártel de proveedores que sabe exactamente a quién agradecer. Las aldeas están agradecidas. Los oficiales no."
 SIA_otpc_tablet_procurement: "Lanzar «Una tableta por niño»"
 SIA_otpc_tablet_procurement_desc: "Un plan vistoso para poner una tableta en las manos de cada alumno de primer grado. A las cámaras les encanta y los números del partido suben. Se paga en efectivo, el presupuesto escolar carga con el peso durante medio año y la contratación es una máquina de sobornos que todo uniformado conoce."
 SIA_family_business_favors: "Contratos de Steer a la empresa familiar"
 SIA_family_business_favors_desc: "Obras públicas, licencias de importación, una concesión portuaria o dos, todo para empresas que casualmente son de parientes del primer ministro. Dinero para el tesoro y para la familia. El ejército lo suma al caso en tu contra."
 SIA_court_the_generals: "Tribunal de los Generales"
 SIA_court_the_generals_desc: "Partidas presupuestarias discretas, destinos de prestigio y algunos ascensos bien colocados. Nada de esto es barato, pero un cuerpo de oficiales contento es un cuerpo paciente. Reduce el riesgo de golpe."
 SIA_military_budget_boost: "Aprobar un derroche en adquisiciones de defensa"
 SIA_military_budget_boost_desc: "Submarines, combatientes, un nuevo cuartel general. Apaga la lista de deseos del ejército y los oficiales recuerdan quién paga las cuentas. La economía civil va un poco más húngara para ello, pero el riesgo de golpe cae marcadamente."
 SIA_anti_corruption_gesture: "Tire a Crony a los Fiscales"
 SIA_anti_corruption_gesture_desc: "Elegir a un aliado prescindible, entregar el expediente a la comisión anticorrupción y dejar que ruedan las cámaras. Los partidarios del Partido ven vendido a un amigo por buenos titulares y las encuestas bajan. Los generales ven un gobierno que castiga a los suyos."
 SIA_promote_loyalists: "Promover oficiales de préstamos"
 SIA_promote_loyalists_desc: "Reorganizar la lista anual de ascensos para mover manos confiables a los mandos que importan: el Primer Ejército, la Guardia del Rey y la guarnición de la capital. Cuesta capital político, pero pone hombres más amigables entre el gobierno y los tanques. Reduce el riesgo de golpe."
 SIA_reassure_high_command: "Tranquilizar al alto mando"
 SIA_reassure_high_command_desc: "Las columnas se alimentan y el script de transmisión está escrito. Traiga el riesgo de golpe bajo 70 antes de que el temporizador se agote, a través de presupuestos, promociones o un balance público con los cronies. Fail y el ejército llevan al gobierno."
 SIA_canal_tolls: "Recoger los peajes del Canal"
 SIA_canal_tolls_desc: "El Canal de Kra lleva algunos de los tráficos marítimos de mayor valor del mundo. La colección de peajes de buques comerciales como contenedores, tanques, transportistas a granel y cruceros fluye directamente al tesoro nacional cada seis meses."
 SIA_kra_construction: "Canal Kra"
 SIA_kra_construction_desc: "El Canal de Kra en toda su vida. En primer lugar, las obras escalonadas del gran corte en el Kra Isthmus, cada fase financiada a su vez, descuidan invitando los sobrecostos de costos y, en terreno disputado, sabotaje. Luego el manejo naval del estrecho terminado: horarios de patrulla, protocolos de tránsito y la seguridad del nuevo chokepoint del mundo.\nEl gran corte procede en tres fases financiadas. §YProgreso de construcción§!: [?ROOT.SIA_kra_progress|0]%"
 SIA_kra_phase_1: "Fase I: cortar el istmo"
 SIA_kra_phase_1_desc: "La primera gran excavación. Conducir el canal a través de la columna vertebral de la península. Financiar la fase antes de que se acabe la temporada de construcción, o la oficina del proyecto volverá con un sobrecosto."
 SIA_kra_phase_2: "Fase II: obras de esclusas y canal"
 SIA_kra_phase_2_desc: "Revestir el corte, hundir las esclusas y construir las obras de canal que contendrán dos mares. Mantén el tesoro por detrás del calendario o afronta otro sobrecosto."
 SIA_kra_phase_3: "Fase III: pruebas de mar"
 SIA_kra_phase_3_desc: "Inundar el tramo de cumbre, colocar las compuertas y pasar a los prácticos en lastre. La fase final antes de que el canal pueda abrirse. Financiarla completa el megaproyecto."
 SIA_strait_patrol: "Patrulla del estrecho"
 SIA_strait_patrol_desc: "Poner buques de la Armada Real Tailandesa en patrulla regular del corredor de tránsito de Kra. La presencia disuade la piratería, tranquiliza al transporte marítimo y da a la flota el tiempo de mar que nunca ha tenido."
 SIA_red_path_category: "Operaciones del Comité de Pueblos"
 SIA_red_path_category_desc: "Difundir la presencia organizativa del partido en comunidades rurales, lugares de trabajo y vecindarios. Cada comité que toma raíz fortalece la base popular del movimiento, y prueba la tolerancia del gobierno."
 SIA_spread_flame_isaan: "Organizar Pueblos Isaan"
 SIA_spread_flame_isaan_desc: "Desplegar cuadros del partido en aldeas y ciudades de distrito de Isaan. Establecer comités de aldea, grupos de alfabetización y redes cooperativas. El Noreste es la base natural del movimiento, así que hay que profundizarla."
 SIA_spread_flame_north: "Organizar las comunidades septentrionales"
 SIA_spread_flame_north_desc: "El norte tiene una larga historia de organización laboral y radicalismo agrario. Los organizadores del partido trabajan las cooperativas de ladera y los sindicatos de madera. Una base aquí significa que el movimiento es más que Isaan."
 SIA_mass_education_campaign: "Campaña masiva de educación política"
 SIA_mass_education_campaign_desc: "Un currículo nacional de educación política que abarca la historia laboral, la teoría económica y la historia del imperialismo en el Sudeste Asiático. Se imparte a través de sindicatos afines al partido, cooperativas y centros comunitarios. La inversión cuesta capital político ahora. La recompensa es un electorado genuinamente consciente en lo político."
 SIA_asean_arms_export: "Contrato de exportación de armas de la ASEAN"
 SIA_asean_arms_export_desc: "Los fabricantes de defensa de Tailandia tienen la capacidad de producción y las relaciones regionales para mantener un programa de exportación recurrente. Cada contrato anual, ya sea MRAPs, fusibles de artillería, murciélagos de municiones o municiones vacilantes, se añade directamente al tesorería y profundiza la posición de Tailandia como el proveedor preferido de segundo nivel de la región."
 SIA_defense_export_contract: "Contrato de exportación de defensa"
 SIA_defense_export_contract_desc: "Con la Oficina de Exportación de Defensa y los arsenales del reino certificados para la venta, el gabinete puede autorizar un contrato de exportación fresco. Chaiseri First Win vehicles, DTI rockets and munitions, and license- built systems ship to ASEAN buyers on a recurring basis. El capital político gastado asegurando el acuerdo regresa al tesoro como ingresos de exportación duro, la ala de defensa-industrial pagando su propia manera."
 SIA_counter_chinese_influence: "Contra la Influencia China"
 SIA_counter_chinese_influence_desc: "Desplegar recursos diplomáticos, económicos e informativos para hacer retroceder la influencia de Pekín en el vecindario de Bangkok. La operación lleva meses y tiene un costo, pero la alternativa es la aquiescencia."
 SIA_counter_indian_influence: "Contra la Influencia India"
 SIA_counter_indian_influence_desc: "El poder blando de Nueva Delhi en el Sudeste Asiático, de la inversión a la programación cultural y las asociaciones estratégicas, se ha ido ampliando en silencio. Una campaña coordinada de contrainfluencia reorienta a los socios regionales hacia Bangkok."
 SIA_renegotiate_china_contracts: "Renegociar los contratos chinos"
 SIA_renegotiate_china_contracts_desc: "Los contratos de infraestructura BRI construyeron carreteras y ferrocarriles que necesitaba Tailandia, pero los términos financieros incrustaron la influencia de Beijing para una generación. El gabinete puede aceptar esa dependencia o pagar el precio político para renegociar los términos."
 SIA_us_security_review: "Revisión de seguridad EE.UU.-Tailandia"
 SIA_us_security_review_desc: "Washington ha solicitado una revisión oficial de la seguridad bilateral. El resultado determina si Tailandia profundiza su alineación de tratados, con los conjuntos de capacitación, el acceso a las adquisiciones y la visibilidad política que entraña o mantiene la cobertura estratégica."
 SIA_strategic_fuel_reserve: "Construir una reserva estratégica de combustible"
 SIA_strategic_fuel_reserve_desc: "Encargar una reserva nacional de combustible para tres meses en parques de tanques distribuidos. La inversión suaviza la volatilidad de precios, da un colchón logístico militar y señala resiliencia de la cadena de suministro a los socios regionales."
 SIA_anti_corruption_drive: "Unidad anticorrupción"
 SIA_anti_corruption_drive_desc: "Una campaña selectiva de aplicación de la ley contra la corrupción en las contrataciones, el fraude aduanero y las redes de clientelismo incrustadas en el gobierno provincial. La contratación limpia es más lenta al principio y más barata a la larga."
 SIA_tax_modernization: "Modernización del sistema tributario"
 SIA_tax_modernization_desc: "Reemplazar el sistema de evaluación en papel del Departamento de Ingresos por una declaración electrónica obligatoria, auditoría algorítmica e incentivos a los evaluadores basados en el rendimiento. La implantación es dolorosa. El dividendo permanente de eficiencia repaga el costo de capital en cinco años."
 SIA_gripen_ef_upgrade: "Gripen E/F Contract"
 SIA_gripen_ef_upgrade_desc: "El contrato Gripen E/F de 12 aeronaves, firmado en agosto de 2025, representa el compromiso del RTAF con un luchador capaz de quinta generación. Los primeros partos se esperan en 2029. El contrato cementa la relación a largo plazo del RTAF con SAAB y bloquea el soporte de mantenimiento sueco a través de los años 2040."
 SIA_imf_program_active: "El programa de reserva del FMI sigue funcionando"
 SIA_ds_active: "La insurgencia Sur Profunda es activa"
 SIA_ds_resolved_force: "El sur profundo fue pacificado por la fuerza"
 SIA_not_ruled_by_communists_tt: "§Y[Communist-State_L]§! no es el partido gobernante."
 SIA_not_ruled_by_democrats_tt: "§Y[conservatism_L]§! no es el partido gobernante."
 SIA_not_ruled_by_royalists_tt: "§Y[Nat_Autocracy_L]§! y §Y[Monarchist_L]§! no son el partido gobernante."
 SIA_ds_intensity_below_25_tt: "Intensidad profunda de la insurgencia Sur más abajo §Y25§! (actualmente §Y [?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_30_tt: "Intensidad profunda de la insurgencia Sur más abajo §Y30§! (actualmente §Y [?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_35_tt: "Intensidad profunda de la insurgencia Sur más abajo §Y35§! (actualmente §Y [?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_40_tt: "Intensidad profunda de la insurgencia Sur más abajo §Y40§! (actualmente §Y [?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_50_tt: "Intensidad profunda de la insurgencia Sur más abajo §Y50§! (actualmente §Y [?SIA_insurgency_intensity|0]§!)"
 SIA_aligned_west_tt: "Al menos dos opciones de alineación occidental tomadas (actualmente §Y[?SIA_pick_west|0]§!)"
 SIA_aligned_china_tt: "Al menos dos opciones de alineación chinas tomadas (actualmente §Y[?SIA_pick_china|0]§!)"
 SIA_aligned_self_tt: "Al menos dos opciones de autosuficiencia tomadas (actualmente §Y[?SIA_pick_self|0]§!)"
 SIA_no_bloc_dominant_tt: "Ningún bloque elegido más de una vez. Occidental §Y[?SIA_pick_west|0]§!, chino §Y[?SIA_pick_china|0]§!, autosuficiente §Y[?SIA_pick_self|0]§!"
 SIA_bamboo_east_gate_tt: "No estamos ambos bajo §Y[Nat_Autocracy_L]§! o §Y[Monarchist_L]§! regla y en una facción con los §Y Estados Unidos§!."
 SIA_outlook_western_tt: "£western_outlook_campaign_cost_modifier_texticon §YPerspectiva occidental§! popularidad: [?temp_outlook_increase|%+]\n"
 SIA_outlook_emerging_tt: "£emerging_outlook_campaign_cost_modifier_texticon §YEmerging Outlook§! popularidad: [?temp_outlook_increase|%+]\n"
 SIA_outlook_nonaligned_tt: "£nonaligned_outlook_campaign_cost_modifier_texticon §Y No-Alineados Outlook§! popularidad: [?temp_outlook_increase|%+]\n"
 SIA_outlook_nationalist_tt: "£nationalist_outlook_campaign_cost_modifier_texticon §YPerspectiva Nacionalista§! popularidad: [?temp_outlook_increase|%+]\n"
 SIA_coup_risk_increase_tt: "§RCoup Risk [?coup_delta|0+]§! (ahora §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_coup_risk_decrease_tt: "§GCoup Risk [?coup_delta|0+]§! (ahora §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_coup_risk_reset_tt: "El golpe tiene éxito. El riesgo de acumulación se reasienta a cero bajo la regla militar."
 SIA_army_patience_exhausted_tt: "La paciencia del ejército está agotada: riesgo de golpe por encima de los 60, después del 1 de enero de 2010."
 SIA_ds_force_track_increase_tt: "El progreso militar hacia una resolución forzada aumenta."
 SIA_ds_peace_track_increase_tt: "El progreso de la negociación hacia un arreglo pacífico aumenta."
 SIA_reform_pressure_increase_tt: "§RPresión de la reforma [?reform_delta|0+]§! (ahora §Y[?ROOT.SIA_reform_pressure|0]§!/100)"
 SIA_reform_pressure_decrease_tt: "§GPresión de la reforma [?reform_delta|0+]§! (ahora §Y[?ROOT.SIA_reform_pressure|0]§!/100)"
 SIA_engage_reform_movement: "Dialogar con el movimiento reformista"
 SIA_engage_reform_movement_desc: "Invitar a los sindicatos estudiantiles y al grupo reformista a la mesa, financiar un programa de empleo juvenil y dejar que las cámaras vean el apretón de manos. Las calles se calman. Sentar al movimiento a la mesa también lo vuelve respetable, y Move Forward se beneficia de ello."
 SIA_rural_development_package: "Paquete de desarrollo rural"
 SIA_rural_development_package_desc: "Fondos de aldea, una planta de precio del arroz, alivio de la deuda agrícola y un nuevo camino hacia la ciudad del distrito. Un pago del tesoro compra un año en el que el campo deja de escuchar la máquina populista."
 SIA_rural_package_active: "Paquete de desarrollo rural"
 SIA_rural_package_active_desc: "Los fondos de la aldea se están desembolsando, el piso del precio está retenido y los tripulantes de la carretera de distrito están trabajando. Los bienes de consumo cuestan un poco más mientras corre, y para ese año el campo es del gobierno."
 SIA_palace_bargain: "Huelga Palacio Bargain"
 SIA_palace_bargain_desc: "Un golpe resuelto por negociación. En lugar de esperar a los tanques, entregamos al palacio y a sus generales lo que tomarían de todos modos. El establishment monárquico entra en el gobierno como socio principal, nuestro partido conserva sus escaños y pierde la primacía, y el Reino cambia sin disparar un tiro."
 SIA_face_the_court: "Comparecer ante el Tribunal Constitucional"
 SIA_face_the_court_desc: "Poner el destino del partido gobernante en manos de los jueces, como Tailandia lleva dos décadas haciendo. A diferencia de un pacto con el palacio, esto es una apuesta y no un arreglo: decide el tribunal. Someterse a una disolución y entregar el poder a nuestros rivales, o desafiar el veredicto y pagar en estabilidad y en la paciencia del ejército."
 SIA_pack_the_senate: "Empaque el Senado"
 SIA_pack_the_senate_desc: "Coloque la casa superior y las agencias independientes con lealistas hasta que nada compruebe el gobierno. Los proyectos de ley pasan sin oposición durante medio año. Para los generales esto es una toma de poder a simple vista."
 SIA_populist_trunk_entry_tt: "§Y[neutral_Social_L]§! es el partido gobernante."
 SIA_royalist_trunk_entry_tt: "§Y[Nat_Autocracy_L]§! or §Y[Monarchist_L]§! es el partido gobernante."
 SIA_democrat_trunk_entry_tt: "§Y[conservatism_L]§! es el partido gobernante."
 SIA_telecom_excise_favor: "El Interruptor de Excises Telecom"
 SIA_telecom_excise_favor_desc: "Convertir las tasas de concesión de telecomunicaciones en un impuesto especial, estructurado para que la AIS, de propiedad familiar, mantenga su ventaja y los nuevos participantes hereden la carga. El tesoro y una agradecida base empresarial te lo recompensan. El alto mando nota que el Estado se administra para el balance de una sola familia. §RAumenta el riesgo de golpe.§!"
 SIA_exim_myanmar_loan: "Préstamo EXIM a Rangún"
 SIA_exim_myanmar_loan_desc: "Conceder un préstamo estatal blando a la junta de Myanmar, destinado, convenientemente, a comprar servicios de satélite y telecomunicaciones a la Shin Satellite de la propia familia. Un gesto de política exterior que sirve a la vez de pulcro contrato para la empresa familiar. Un conflicto de intereses de manual que los generales no pasan por alto. §RAumenta el riesgo de golpe.§!"
 SIA_state_lottery_scheme: "El gobierno Lottery"
 SIA_state_lottery_scheme_desc: "Integrar el juego de números clandestino en un esquema estatal. Efectivo fuera del presupuesto para clientelismo y proyectos favoritos, popular entre los apostadores y el tipo de fondo sin rendición de cuentas que todo manifiesto golpista cita primero."
 SIA_democrat_machine_category: "La máquina del partido"
 SIA_democrat_machine_category_desc: "El borde de los Demócratas es la organización, pero la máquina de Thaksin siempre es un deslizamiento rural para regresar al poder. Trabajar las circunscripciones para mantener la línea.\n\n§Y Tido populista§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. Sube 1 a semana, más rápido en un retroceso o cuando la estabilidad se desliza, y una economía en auge y un país tranquilo sólo lo mantienen nivel. Empujándola de nuevo toma las decisiones a continuación, la cabeza de playa de Isaan, o un paquete de desarrollo rural. Sobre 35 cuesta estabilidad y crecimiento. Por encima de los 70 cuesta mucho más."
 SIA_constituency_machine: "Trabajar en las circunscripciones"
 SIA_constituency_machine_desc: "Enviar a los miembros de vuelta a sus distritos para celebrar consultas, arreglar desagües, resolver disputas y recordar los nombres. Trabajo aburrido y el único que conserva un escaño. §YLa popularidad del Partido Demócrata sube§! y la marea populista se atenúa."
 SIA_pt_pressure_increase_tt: "§R Tida populista [?pt_delta|0+]§! (ahora §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)"
 SIA_pt_pressure_decrease_tt: "§G Tida populista [?pt_delta|0+]§! (ahora §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)"
 SIA_match_the_populists: "Coincidiendo con los Populistas"
 SIA_match_the_populists_desc: "Si no puedes vencer al fondo de aldeas, construye uno mejor. Sanidad barata, alivio de deudas y crédito rural bajo bandera demócrata. Vacía el tesoro y le quita el tema a Pheu Thai."
 SIA_expose_corruption: "Expose la Red"
 SIA_expose_corruption_desc: "Gire las agencias anticorrupción y los tribunales en la máquina populista. Casos de activos, sondas de votación y las largas peleas judiciales que ya han reducido a más de un gobierno Thaksinite."
 SIA_broaden_the_coalition: "Ampliar la Coalición"
 SIA_broaden_the_coalition_desc: "Entregar ministerios a los partidos pequeños y a los jefes provinciales a cambio de sus escaños. El precio es un gabinete fraccioso y de regateos (§Rlas exigencias de la coalición§!), pero construye un cortafuegos parlamentario que ninguna victoria populista abrumadora puede romper. §GLa marea populista retrocede con fuerza.§!"
 SIA_counter_messaging: "Contrarrestar el mensaje populista"
 SIA_counter_messaging_desc: "Responder a la línea populista donde la gente realmente la oye: los programas matinales, las torres de transmisión de las aldeas, los locales sindicales. Un pequeño empujón, repetible, que le va quitando impulso a Pheu Thai."
 SIA_reconstruction_category: "Desarrollar las tierras recuperadas"
 SIA_reconstruction_category_desc: "El territorio adoptado en la Frontera Occidental o las campañas de hegemonía de la ASEAN se lleva a cabo pero aún no está integrado. Pacifique las provincias, vierte dinero de reconstrucción en ellas, y una vez que estén lo suficientemente tranquilos, reclamen por la nación."
 SIA_reconstruction_pacify: "Pacificar las Provincias"
 SIA_reconstruction_pacify_desc: "Inundar las provincias ocupadas de administradores, informantes y programas de amnistía. El Cumplimiento sube en todas las provincias que controlamos pero aún no hemos integrado. Trabajo lento y paciente, pero es el terreno sobre el que se construye todo lo demás."
 SIA_reconstruction_develop: "Obras de reconstrucción de fondos"
 SIA_reconstruction_develop_desc: "Liberar dinero de reconstrucción para carreteras, energía y obras públicas en las tierras recuperadas. Las ranuras de infraestructura y de edificios suben en cada provincia controlada, y las atan a la economía nacional y dan a la población un interés en el gobierno tailandés."
 SIA_reconstruction_integrate: "Proclamar las provincias reunificadas"
 SIA_reconstruction_integrate_desc: "Cuando el cumplimiento es lo suficientemente alto, la ocupación termina y las provincias se convierten en suelo tailandés. Cada provincia pacificada que mantenemos está sujeta al Reino, una ganancia permanente que ninguna conferencia de paz puede deshacer."
 SIA_ghosts_5pct_tt: "§Y[Communist-State_L]§! tiene al menos el 5% de popularidad."
 SIA_reform_5pct_tt: "§Y[socialism_L]§! tiene al menos el 5% de popularidad."
 SIA_reform_trunk_entry_tt: "§Y[socialism_L]§! es el partido gobernante."
 SIA_communist_trunk_entry_tt: "§Y[Communist-State_L]§! es el partido gobernante."
 SIA_seize_power_gate_tt: "Gana la huelga general para que el gobierno capitule o se comprometa a la lucha armada primero."
 SIA_strike_momentum_tt: "§RStrike Momentum [?strike_delta|0+]§! (ahora §Y[?ROOT.SIA_strike_momentum|0]§!/100). A 100 el gobierno capitula."
 SIA_general_strike_category: "El ataque general"
 SIA_general_strike_category_desc: "El país está paralizado y el movimiento presiona para que el gobierno caiga. Conduzca el impulso de la huelga a 100 antes de que terminen los 180 días y el gobierno capitula un camino pacífico al poder. Caer corto y el ejército aplasta la huelga en un golpe de estado.\n\n§RMomento de huelga§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_strike_mass_pickets: "Pasteles de masa"
 SIA_strike_mass_pickets_desc: "Poner a decenas de miles en los piquetes y mantener las plazas día tras día. Barato y rápido, la fuerza diaria que mantiene el país cerrado y la presión creciente."
 SIA_strike_paralyze_transport: "Paralizar los puertos y los ferrocarriles"
 SIA_strike_paralyze_transport_desc: "Financiar desde el fondo de huelga a estibadores y ferroviarios hasta que nada se mueva dentro ni fuera del país. El golpe más pesado que puede asestar el movimiento y el más costoso de sostener."
 SIA_strike_win_the_conscripts: "Ganar sobre los reclutas"
 SIA_strike_win_the_conscripts_desc: "Enviar organizadores a los cuarteles. Cada conscripto que no dispare contra su propio pueblo es uno con el que los generales no pueden contar, y la capitulación se acerca."
