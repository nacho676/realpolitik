 GENERIC_krepost_state_defense_bureau_desc: "Un exportador en la sombra con licencia estatal, especializado en MANPADS y misiles antitanque guiados, que abastece a sus clientes mediante intermediarios sin identificar."
 GENERIC_north_plains_heavy_industries_desc: "Una enorme planta de herencia soviética que produce armas de infantería a gran escala, optimizada para el alto volumen antes que para la calidad."
 GENERIC_sentinel_grid_networks_desc: "Un contratista de señales y mando y control que ofrece soluciones de compresión de la cadena de destrucción a ejércitos sin infraestructura de mando integrada."
 GENERIC_brunn_heavy_engineering_werke_desc: "Una casa de ingeniería de Europa central con raíces de la era de los Habsburgo, que produce sistemas de artillería con licencia y propios."
 GENERIC_reichswerke_konstrukt_dynamik_desc: "Un desarrollador de armamento de doble vía de la Europa central, que abarca plataformas de artillería de orugas y de tanques de batalla principales."
 GENERIC_vector_defense_labs_desc: "Un integrador de defensa antimisiles centrado en el costo, basado en la doctrina de que interceptar más por cada dólar rinde más que el exceso de sofisticación."
 GENERIC_marshall_tractor_works_desc: "Un colectivo de fábricas de tanques que opera con la metodología de producción soviética heredada y prioriza el volumen y la facilidad de reparación."
 GENERIC_vanderlind_hartwell_systems_desc: "Un contratista principal de Washington que usa sus contactos políticos para asegurar programas de vehículos blindados y VCI a gran escala."
 GENERIC_mil_kamov_rotorworks_desc: "Una oficina de aeronaves de ala rotatoria con raíces en el diseño soviético de helicópteros de ataque y transporte, conocida por la durabilidad antes que por la sofisticación."
 GENERIC_helitech_avionique_desc: "Una firma boutique anglo-italiana de aviónica e integración de helicópteros, que ofrece electrónica de alta calidad a precio premium."
 GENERIC_aurora_aerodynamics_corporation_desc: "Una operación secreta de desarrollo avanzado que produce cazas y aviones polivalentes de vanguardia para clientes de defensa exigentes."
 GENERIC_societe_europeenne_daerostructures_desc: "Un consorcio paneuropeo de reparto del trabajo, especializado en estructuras de grandes aeronaves, plataformas de transporte y aviones de patrulla marítima."
 GENERIC_southwestern_aerospace_dynamics_bureau_desc: "Una oficina dirigida por directorio que produce plataformas aéreas polivalentes y estratégicas bajo una estricta supervisión gubernamental."
 GENERIC_skyforge_autonomous_systems_desc: "Una empresa cercana a Silicon Valley que aplica la cultura de las startups de moverse rápido al desarrollo de drones de ataque autónomos."
 GENERIC_compagnie_aeronatique_darmement_desc: "Una casa de armamento de herencia francesa que ofrece estándares de munición compartidos para cazas, aviones navales y misiles guiados."
 GENERIC_whitehall_strategic_solutions_desc: "Una consultora naval boutique convertida en constructora de buques pequeños, especializada en corbetas y patrulleras."
 GENERIC_triton_maritime_defense_group_desc: "Una red de astilleros multinacional que produce destructores y fragatas en varios países socios."
 GENERIC_eastern_maritime_shipbuilding_group_desc: "Un astillero que trabaja en tres turnos continuos y produce cruceros y portaaviones en plazos comprimidos."
 GENERIC_sevmorprom_submarine_yards_desc: "Un astillero submarino del norte de Rusia especializado en profundidades de operación en aguas frías y en plataformas de ataque y de misiles aptas para exportación."
 GENERIC_halland_civic_engineering_group_desc: "Un conglomerado industrial nórdico con experiencia logística de doble uso, que abarca la infraestructura civil y las cadenas de suministro militar."
 GENERIC_second_academy_missile_bureau_desc: "Una oficina compartimentada de investigación de misiles balísticos y de crucero que opera bajo estrictos protocolos de necesidad de saber."
 GENERIC_western_orbital_systems_bureau_desc: "Una oficina de sistemas orbitales y estratégicos centrada en los vehículos de lanzamiento de próxima generación y en la conciencia del dominio espacial."
 GENERIC_central_heavy_atomics_power_desc: "Un programa de propulsión y armamento nuclear que combina la experiencia en reactores civiles con el desarrollo de misiles balísticos navales."
