l_spanish:
 fiji_focus: "Árbol de enfoque de Fiji"
 fiji_influence_defense_through_chaos: "Defensa de la Influencia a Través del Caos"
 fiji_influence_defense_through_chaos_desc: "Fiji es independiente desde los años 70, pero lamentablemente la independencia no ha sido tan gloriosa y pacífica como esperábamos. Los golpes de Estado civiles y militares y las tensiones étnicas desenfrenadas han hecho que la nación se encuentre en una situación de pausa en comparación con la mayor parte del mundo. Sin embargo, el caos genera una especie de barrera natural, ya que las naciones extranjeras son demasiado cautelosas como para perder activos en una región tan pequeña debido a dicho caos. Por lo tanto, tenemos una defensa nacional más alta de lo esperado contra la influencia extranjera, un arma de doble filo, sin duda, pero por el momento, una que funciona a nuestro favor."
 fiji_militarized_society: "Sociedad Militarizada"
 fiji_militarized_society_desc: "El caos y la violencia del golpe de estado de 2000 ha dejado una cicatriz en el pueblo de la nación. La cicatriz es de odio y vergüenza propia. Con esta cicatriz, una nueva ola de las generaciones más jóvenes ha salido a unirse al ejército y, como tal, ha fortalecido la creación y popularidad de una Junta Militar como forma de liderazgo. Esto ha llevado a un camino de determinación y deber, donde el ejército es la sociedad y la sociedad es el ejército."
 fiji_society_of_the_elected_king: "Sociedad del Rey Electo"
 fiji_society_of_the_elected_king_desc: "Con la demostración de fuerza y ​​la responsabilidad fundamental de defender la nación, su historia y el compromiso de mantener la ley y el orden con justicia, muchos han visto la luz extremadamente difusa de la que surgió la Casa de Suva. La conmoción en el pueblo fiyiano ha dejado una impresión que ningún gobierno civil ha logrado desde la independencia. Por ello, muchos han mostrado su apoyo y buscan colaborar con el nuevo sistema, aunque no estén totalmente de acuerdo con él."
 fiji_ostracized_commonwealth_member: "Miembro de la Commonwealth Ostracizado"
 fiji_ostracized_commonwealth_member_desc: "El caos de nuestra nación nos ha puesto en desacuerdo con el resto de la Commonwealth. Mientras disfrutamos del poder extra que esto nos otorga internacionalmente, no vemos la realidad completa de las cosas debido a la naturaleza tensa de nuestra situación interna en los miembros extranjeros. Pero al menos tomaremos lo que podamos obtener."
 fiji_foreign_scientist_imports: "Importación de Científicos Extranjeros"
 fiji_foreign_scientist_imports_desc: "Con algunos incentivos clave podemos traer mentes científicas a Fiji con la promesa de un presupuesto junto con, por ejemplo, unas vacaciones permanentes fuera de casa."
 fiji_pacific_exchange_and_investment_society: "Comisión P.I.E.S."
 fiji_pacific_exchange_and_investment_society_desc: "La Pacific Investment & Exchange Society es una sociedad y un grupo de relaciones exteriores. Más pareciendo un club social regional, utilizamos esta sociedad como una forma de atraer inversores junto con exportar nuestra propia marca en nuestra pequeña parte del pastel global."
 fiji_depoliticized_military: "Militar Despolitizado"
 fiji_depoliticized_military_desc: "Tras un tenue intercambio con los militares, se ha llegado a un acuerdo para mantener la separación de las fuerzas armadas del cuerpo político civil. Un entendimiento simple pero firme que podría abrir la puerta a reformas posteriores que mejoren la imagen de Fiyi como una potencia pequeña, aunque regional."
 fiji_cohesive_integrations_act: "Ley de Integraciones Cohesivas"
 fiji_cohesive_integrations_act_desc: "Buscamos conocer el mundo que nos rodea, buscamos lazos más cercanos con nuestro semejante. Buscamos expandir nuestros horizontes para el mejoramiento de nuestro pueblo y de aquellos que también buscan mejorar."
 fiji_independence_sustainment_act: "Ley de Sostenibilidad de la Independencia"
 fiji_independence_sustainment_act_desc: "Siguiendo el ejemplo de Estados Unidos y de aquellos en el Medio Oriente, buscamos crear nuestro propio espíritu de independencia. Porque si nuestra nación es absorbida por las maquinaciones del mundo, al final prevaleceremos contra todo pronóstico."
 fiji_importing_ideas_exporting_ideals: "Importando Ideas, Exportando Ideales"
 fiji_importing_ideas_exporting_ideals_desc: "Nuestra isla es pequeña, pero nuestras ambiciones son grandes. Puede que no cambiemos fundamentalmente el mundo, pero aún así podemos ser una pieza significativa en el rompecabezas de los asuntos internacionales. Nuestra I+D será eficiente y enfocada, lo que nos permitirá explorar nuevas áreas más rápido en pequeños estallidos. Esto dará a nuestra nación un gran atractivo para las potencias extranjeras."
 fiji_pieces_for_the_peace: "Piezas para la Paz"
 fiji_pieces_for_the_peace-desc: "Con nuestra recién encontrada estabilidad ahora podemos buscar mejor ayuda y oportunidades con aquellos en el mundo más amplio. Aunque aún tenemos un largo camino por recorrer, esto es, no obstante, un gran paso hacia adelante, por decir lo menos."
 fiji_the_fijian_dream: "El Sueño Fijiano"
 fiji_the_fijian_dream_desc: "Tengo un sueño y ese sueño es uno donde aquellos que han sido dejados de lado, menospreciados y abandonados por la sociedad. Esas personas pueden erguirse y mirar hacia arriba en la vida, esas personas pueden decir, esto no es el final, sino más bien un nuevo comienzo. Esto se puede y se logrará, y será el futuro para aquellos que estén bajo la bandera fijiana."
 fiji_building_tall_within_something_small: "Construir Alto Dentro de Algo Pequeño"
 fiji_building_tall_within_something_small_desc: "La Ley de Construcción en Altura resulta bastante engañosa para alguien sin contexto. Este proyecto de ley legisla el mandato de una forma básica de automatización, con la que nuestra población debería estar acostumbrada y familiarizada. Al comprender este principio, podemos construir mucho en un área más pequeña, haciendo así que nuestra isla sea más eficiente y, por lo tanto, más competitiva a nivel mundial."
 fiji_new_foreign_image: "Nueva Imagen Exterior"
 fiji_new_foreign_image_desc: "Con nuestra gente ya no luchando constantemente, o huyendo, o sin hogar, el mundo más amplio a nuestro alrededor ha comenzado a girar la cabeza en admiración. Nuestra isla ha visto una transformación real en estos años y, como tal, con esfuerzos reales vienen resultados reales."
 fiji_foriegn_advisory_board: "Consejo Asesor Extranjero"
 fiji_foriegn_advisory_board_desc: "La Junta Asesora Extranjera (FAB) está compuesta por asesores civiles y militares que fortalecerán y ayudarán a nuestra nación a encaminarse por el buen camino. Si bien muchos se preguntarán si esto socavaría la independencia de nuestra nación frente a fuerzas externas, les aseguro que previmos esa misma preocupación, ya que estos asesores extranjeros serán, en realidad, nuevos ciudadanos de nuestra nación. Mediante incentivos gubernamentales y, en esencia, comprando a estas personas de sus propias naciones, podemos esperar pocos efectos externos, mientras que, a su vez, fortalecemos nuestra propia economía."
 fiji_national_rotc_program: "Programa Nacional de ROTC"
 fiji_national_rotc_program_desc: "Con el establecimiento del programa nacional de Cuerpo de Entrenamiento de Oficiales de Reserva dentro de la educación nacional, podremos enseñar unidad, liderazgo, innovación y trabajo en equipo a las futuras generaciones de nuestra nación. Los impactos sobre la estabilidad nacional y el ethos general de nuestra gente y espíritu nacional serán tremendos."
 fiji_expanded_ministry_of_science: "Ministerio de Ciencia Expandido"
 fiji_expanded_ministry_of_science_desc: "Con prioridad en el desarrollo de tecnologías, podemos albergar una gran cantidad de avances en el espectro de aplicaciones civiles y militares. Como tal, a pesar de los costos, debemos buscar mejorar nuestra posición general si realmente buscamos el futuro de nuestra nación."
 fiji_citizen_soldiers_amendment: "Enmienda de Soldados Ciudadanos"
 fiji_citizen_soldiers_amendment_desc: "No somos un estado con un ejército, somos un ejército con un estado. Las ideas de nacionalismo en el pasado siempre han sido abusadas por actores maliciosos, y demás, para lograr objetivos y ambiciones personales. Pues bien, ya no más. A través de un decreto constitucional, establecemos la idea de lo que es el nacionalismo fijiano, qué significa ser fijiano y cómo alguien puede vivir realmente una vida sintiéndose orgulloso de vivir dicha vida."
 fiji_fijian_general_staff: "Estado Mayor General Fijiano"
 fiji_fijian_general_staff_desc: "El parlamento militar es esencialmente un gran estado mayor general. La mezcla de los asuntos gubernamentales y militares en una cadena de mando unificada significa que la planificación y coordinación de las necesidades tanto militares como civiles puede ser comprendida y atendida a velocidades que ni las partes individuales podrían soñar. Pero debemos ser conscientes del papel que juega este Estado Mayor General, pues uno puede perder la vista al estar rodeado por tal concentración de poder."
 fiji_research_institute_of_fiji: "Instituto de Investigación de Fiji"
 fiji_research_institute_of_fiji_desc: "El R.I.F. es la cúspide de la identidad de nuestra nación. Mediante inversiones moderadamente generalizadas en investigación e innovación en todos los campos, podremos darnos a conocer y atraer a comunidades científicas extranjeras. Con esto en mente, nuestras naciones se expondrán a las tecnologías más rápidamente y nos darán una plataforma para quienes quieran participar en nuestros juegos."
 fiji_royal_engineers_program: "Programa de Ingenieros Reales"
 fiji_royal_engineers_program_desc: "Este programa híbrido limitado, que mezcla la fuerza laboral civil en proyectos gubernamentales y más específicamente, en proyectos relacionados con el ejército, es una base sobre la cual construir. Esto crea una línea base controlada en la que podemos evitar que nuestros ciudadanos caigan en picada, ya que los pensamientos de perder todo pueden afectar la mente y la toma de decisiones de muchos. Este programa estará allí como un faro de esperanza para aquellos que caigan, mostrando que estamos allí para ayudarles a levantarse nuevamente."
 fiji_economic_planning_board: "Junta de Planificación Económica"
 fiji_economic_planning_board_desc: "La EPB es un ala gubernamental de crecimiento económico. Mientras que el sector privado aún puede divertirse, para esos predicadores supuestamente anti-comunistas temerosos de Dios, este ministerio del gobierno es más bien una rama independiente de inversiones. Esto es para ayudar a guiar e iniciar nuevas iniciativas gubernamentales que luego se convertirán en privadas una vez que se asegure la estabilidad. En resumen, la EPB inicia cosas, el sector privado continúa esas cosas, con la esperanza de que sea de forma perpetua."
 fiji_pacific_economics_exchange_commission: "Comisión de Intercambio Económico del Pacífico"
 fiji_pacific_economics_exchange_commission_desc: "El PEEC es una iniciativa regional conjunta para ampliar nuestra influencia y cooperación con las naciones de nuestra región. Si bien el enfoque principal es económico y político, una actividad complementaria de formación militar beneficiaría a todos los participantes."
 fiji_titles_by_election: "Títulos por Elección"
 fiji_titles_by_election_desc: "El Títulos por Elección es un requisito constitucional en el cual se preserva el proceso democrático y el pueblo puede votar quién será su próxima nobleza supuesta. Ya no será un cuento de hadas antes de dormir, ahora realmente podrás decir que tú también puedes ser reina o rey."
 fiji_institute_of_automation: "Instituto Fijiano de Automatización"
 fiji_institute_of_automation_desc: "El FIA es la base de lo que pronto se conocerá como el Programa del Paraíso de Investigación. El objetivo es transformar esencialmente la isla en una enorme instalación de investigación y desarrollo y mostrar al mundo que se puede tener tanto al sol como en la imaginación y creatividad para descubrir lo desconocido de la realidad misma."
 fiji_institute_of_resource_development: "Instituto Fijiano de Desarrollo de Recursos"
 fiji_institute_of_resource_development_desc: "El FIRD es otro hito en el desarrollo del Programa del Paraíso de Investigación. Dedicando su existencia a la extracción, refinamiento y síntesis de recursos al mayor potencial conocido. Aunque sí, nuestra isla es pequeña, esto no significa que no tengamos algo a nuestra disposición. Como tal, este instituto será un punto clave para garantizar los suministros nacionales y cómo hacerlos crecer donde sea posible."
 fiji_institute_of_energy_development: "Instituto de Desarrollo de Energía"
 fiji_institute_of_energy_development_desc: "El IED se centrará en el desarrollo de métodos más eficientes y productivos para producir energía. Este departamento también podría trabajar en conjunto con el FIRD para integrar mejor nuestra energía y cohesión económica."
 fiji_technocratic_military: "Militar Tecnocático"
 fiji_technocratic_military_desc: "Aunque nuestra isla es pequeña, nuestros cerebros no lo son. Este entendimiento nos permite dedicar una buena parte de nuestras capacidades de I+D para fortalecer nuestras fuerzas militares. Aún no tenemos la economía para tener una fuerza aérea moderna, pero al menos podemos especializar mejor nuestras fuerzas navales y terrestres."
 fiji_research_paradise_program: "Programa Paraíso de Investigación"
 fiji_research_paradise_program_desc: "La culminación de nuestros extensos esfuerzos de investigación ha creado un nuevo paraíso para la investigación y el desarrollo en general. La isla se ha transformado en un paraíso, no solo para los turistas extranjeros, sino también para la comunidad científica en su totalidad. Aquí podemos coordinar avances tanto nacionales como extranjeros en campos que conocemos y en nuevos campos que incluso podríamos descubrir. El futuro realmente es ahora."
 fijian_homelessness_crisis: "Crisis de personas sin hogar"
 fijian_homelessness_crisis_desc: "Dada la inestabilidad política del país, el gobierno ha carecido por completo de medidas correctivas y decisivas para abordar la creciente crisis de personas sin hogar. Con el inicio del nuevo milenio, muchos se preguntan si el gobierno realmente puede solucionar este creciente problema que azota al país. Sin embargo, el tiempo dirá si el gobierno puede no solo cuidar de la nación, sino incluso empezar a cuidar de sí mismo."
 fijian_emigration_crisis: "Crisis de emigración masiva"
 fijian_emigration_crisis_desc: "Con la inestabilidad política, el cambio climático y las crecientes tensiones étnicas, los habitantes de Fiji se han dado cuenta de que es mejor abandonar estas pequeñas islas. Depende del nuevo gobierno sentar las bases para un futuro mejor, pero con tantas adversidades en su contra, ¿podrá el gobierno de Fiji resistir la prueba del tiempo?"
 fijian_military: "El Ejército Fijiano"
 fijian_military_desc: "Durante toda la independencia de la isla, el ejército fiyiano ha sido una buena fuerza de autodefensa. Sin embargo, incluso con su limitada participación en misiones extranjeras, el ejército fiyiano tiene poca o ninguna experiencia. A medida que la isla se adentra en la era moderna y se teme que se produzcan más disturbios políticos, muchos se preguntan cuántas veces más tendrán que mantener la paz los militares."
 fijian_economic_condition: "La Economía Fijiana"
 fijian_economic_condition_desc: "A pesar de su modesta población y extensión territorial, la economía fiyiana está bien diversificada. La industria minera destaca en la extracción de recursos como cobre, oro y plata. Las industrias secundarias incluyen la producción de cemento y la navegación. En general, la economía fiyiana cuenta con una base relativamente sólida y, con la llegada del nuevo milenio, el gobierno debe contribuir a una mayor diversificación de la economía, diversificándose en nuevas industrias como la alta tecnología y el desarrollo de software."
 fijian_ethnic_tensions: "Tensiones Indo-Fijianas"
 fijian_ethnic_tensions_desc: "Desde la independencia, la isla de Fiji ha visto un crecimiento bastante modesto en su población. Sin embargo, el inconveniente de esta noción es que la gran mayoría de las personas que migran a Fiji son de ascendencia india. Mientras que para la mayoría esto no significa nada, lamentablemente para una buena parte del pueblo fijiano étnico esto se siente como un reemplazo y marginación. A lo largo de la historia reciente de la isla con la independencia, estas tensiones solo han aumentado drásticamente, depende del gobierno de Fiji resolver esto antes de que ocurra algo serio... ignore los varios golpes de estado que han permeado la historia de la nación, por favor."
 fiji_2000_coups_over: "Un Regreso a la Paz"
 fiji_post_coup_political_shift: "Las lealtades están cambiando"
 fiji_fast_tracked_military_junta: "§8El Largo Camino hacia la Mejora Ha Comenzado§!"
 fiji_fast_tracked_monarchy: "§0Una Corona de Fuerza, Hace Una Corona del Pueblo§!"
 fiji_2006_coup_avoided: "§PHa Evitado el Golpe de Estado de 2006§!"
 fiji_2006_coup_historical: "§lEl Golpe Militar Tiene Éxito§!"
 fiji_2006_coup_military_junta: "§8El Hombre Plátano Ha Caído§!"
 fiji_2006_coup_monarchist_era: "§0La Casa de Suva Ha Ganado§!"
 fiji_2006_coup_technocracy: "§tEl Consejo Tecnocrático Toma el Control§!"
 fiji_news.1.t: "Nacionalistas Secuestran a Funcionarios del Gobierno"
 fiji_news.1.d: "Hoy, 19 de mayo de 2000, miembros del movimiento político pro-fijiano étnico conocido como i-Taukei han tomado como rehenes a miembros clave del gobierno recién elegido y mayormente de ascendencia Indo-fijiana. El primer ministro y varios funcionarios clave del gobierno fueron tomados como rehenes en el edificio del parlamento, con los miembros de i-Taukei prácticamente atrincherados dentro. Las negociaciones están en curso para liberar a los rehenes sin pérdida de vidas."
 fiji_news.1.o1: "¿Por Qué Debemos Pelear Entre Nosotros?"
 fiji_news.2.t: "Gobierno Interino Creado"
 fiji_news.2.d: "Tras los acontecimientos y un estancamiento en las negociaciones con los rebeldes, el Presidente Kamisese Mara declaró estado de emergencia y ha creado un gobierno continuo con lo que quedaba de los miembros del gobierno actualmente rehenes no capturados. La tensión es alta ya que la policía local y las Fuerzas Militares de la República de Fiji, o RFMF, se han visto desbordadas al crear el cordón fallido alrededor del parlamento, junto con lidiar con las crecientes protestas y la agitación civil, ya que los manifestantes atacaron varios negocios indo-fiyianos en Suva."
 fiji_news.2.o1: "¿No Podemos Hacer Nada?"
 fiji_news.3.t: "Autoridad Perdida Causa Golpe Militar"
 fiji_news.3.d: "Como los remanentes del gobierno civil han demostrado su incapacidad para ejercer genuinamente la autoridad ejecutiva, el Comandante de la RFMF, Frank Bainimarama, ha derrocado al gobierno en funciones y ha establecido el suyo propio. Su primera acción fue establecer la ley marcial, lo que les dio más libertad para lidiar con las enormes cantidades de agitación civil."
 fiji_news.3.o1: "Aquí Vamos de Nuevo"
 fiji_news.3.o2: "Los Militares Resolverán Esto"
 fiji_news.4.t: "Intercambio de Disparos en el parlamento"
 fiji_news.4.d: "Tras el golpe militar, la constitución de 1997 fue revocada y las negociaciones fracasaron, con un ultimátum por parte de los militares. Las potencias extranjeras comenzaron a imponer numerosas sanciones a Fiyi, que se retiraba de la Commonwealth; varias naciones prohibieron los productos fiyianos y se prohibieron los equipos deportivos fiyianos. Estas respuestas se debieron a la idea de ceder a las demandas de los rebeldes. El 12 de junio, los militares dispararon tiros de advertencia contra el vehículo de George Speight, aunque Speight afirma que fue un intento fallido de asesinato. Las negociaciones continúan y se han liberado más rehenes. Con la calma de los disturbios civiles y un panorama esperanzador, muchos se preguntan cuánto durará esto."
 fiji_news.4.o1: "Por Favor, Terminen con Esta Violencia Sin Sentido"
 fiji_news.5.t: "¿Los Militares Están de Acuerdo con los Rebeldes?"
 fiji_news.5.d: "El 3 de julio de 2000, Bainimarama nombró a Laisenia Qarase como Primer Ministro, encabezando un gobierno totalmente indígena fiyiano. Speight se indignó por la decisión, y al día siguiente estalló un tiroteo en el Parlamento en el que cinco personas resultaron heridas. El caos se intensificó y los rebeldes organizaron varios incidentes en todo el país. Los soldados en el cuartel Sukunaivalu en Labasa se amotinaron y declararon su apoyo a Speight. Los terratenientes locales se apoderaron de la presa de Monasavu, cortando la energía a Suva. El 8, los rebeldes bloquearon la carretera entre Suva y Nadi y asaltaron una estación de policía en Korovou, tomando 30 rehenes. En la prisión de Naboro, 50 reclusos se amotinaron y tomaron como rehenes a los guardias."
 fiji_news.5.o1: "¿Qué Está Pensando Bananarama?!"
 fiji_news.6.t: "El Golpe Termina"
 fiji_news.6.d: "Durante los meses de junio y julio, las negociaciones semi-continuas permeaban la nación mientras se hablaba y hablaba sobre una reforma del gobierno civil. Eventualmente, cada vez más rehenes serían liberados, con los rebeldes dejando el edificio del parlamento y migrando fuera del área de la capital. Finalmente, el 26 de julio, Speight y su portavoz Joe Nata fueron arrestados cerca de un puesto de control militar después de que los dos líderes rebeldes hicieran amenazas hacia el nuevo presidente y sobre una guerra civil. Poco después, el ejército asaltaría la sede rebelde arrestando a 369 rebeldes adicionales. El golpe civil fue declarado terminado, y no mucho después George Speight sería juzgado por traición y condenado a muerte."
 fiji_news.6.o1: "Paz Al Fin... ¿Pero A Qué Costo?"
 fiji_news.7.t: "Fiji Unido Asegura la Victoria"
 fiji_news.7.d: "Español La Constitución de Fiyi de 1997 requería que las elecciones generales para la Cámara de Representantes se celebraran al menos una vez cada cinco años. El presidente interino Ratu Joni Madraiwiwi emitió una proclamación el 2 de marzo de 2006, efectiva a partir del 27 de marzo, disolviendo el Parlamento. El mandato parlamentario anterior debía expirar el 1 de octubre de 2006. El auto de elecciones se emitió el 28 de marzo; los candidatos presentaron sus nominaciones el 11 de abril y publicaron sus listas de preferencia el 13, mientras que el registro de votantes cerró el 4 de abril. Las elecciones generales se celebraron en Fiyi entre el 6 y el 13 de mayo de 2006. El gobierno titular de Soqosoqo Duavata ni Lewenivanua (SDL), liderado por el primer ministro Laisenia Qarase, fue reelegido para un tercer mandato en el gobierno. La principal oposición fue el Partido Laborista, liderado por Mahendra Chaudhry, así como varios otros partidos menores."
 fiji_news.7.o1: "Estable Como Siempre"
 fiji_news.8.t: "Demandas Militares"
 fiji_news.8.d: "El 16 de octubre de 2006, el comandante de la RFMF, el comodoro Bainimarama, emitió un ultimátum para que el gobierno cumpliera con nueve demandas o renunciara antes del 1 de diciembre. Las nueve demandas se centraban principalmente en que los proponentes del golpe de 2000 fueran llevados ante la justicia; retirar cualquier maniobra política que pudiera aumentar la desigualdad económica basada en motivos raciales; negar la intervención de autoridades extranjeras (mencionando por nombre al Comisionado de Policía Andrew Hughes, un nacional australiano); dejar de lado los procedimientos judiciales relacionados con las declaraciones del ejército de principios de año y abordar formalmente las preocupaciones sobre el gasto gubernamental y la gobernanza interna. Una semana y media después, el 31 de octubre de 2006, el ejército realizó ejercicios alrededor de Suva y cerró los cuarteles del ejército de la ciudad. El ejército dijo que los ejercicios no representaban una amenaza."
 fiji_news.8.o1: "Nos Negamos A Tal Chusma"
 fiji_news.8.o2: "§PVamos A Salvar Las Apariencias Por Ahora§!"
 fiji_news.9.t: "Gobierno del Golpe Militar"
 fiji_news.9.d: "Con el gobierno contestando las demandas militares, el comodoro Frank Bainimarama ha iniciado un golpe de estado que ha derrocado al gobierno, el cual fue calificado como una 'amenaza para la estabilidad social y étnica'. Los acontecimientos aquí fueron rápidos y contundentes, mostrando que el propio ejército parece estar unido en este empeño de la voluntad del comodoro. Pero algunos cuestionan la validez y más aún parecen pensar que el ejército tiene otros planes. Aunque no se sabe mucho, muchos esperan que realmente podamos ver paz en nuestros tiempos."
 fiji_news.9.o1: "¿Es Esto Realmente Suficiente?"
 fiji_news.9.o2: "§lLa Estabilidad Ha Vuelto§!"
 fiji_news.10.t: "Miembros del Golpe Agitan"
 fiji_news.10.d: "Con el reciente golpe que ha establecido al comodoro Frank Bainimarama como el líder de facto de la nación, muchos ahora se preguntan qué realmente les depara el futuro a Fiji. Algunos miembros destacados dentro del golpe parecen estar agitando por una postura más firme sobre cómo se debe gobernar la nación. Uno de ellos dijo que las peleas insignificantes del conflicto étnico son el mayor desastre que la nación ha tenido que soportar, y mucho menos desgarrarse por ello. Por ahora, el mundo entero pone su mirada sobre la naturaleza inestable que esta pequeña isla del Pacífico está soportando."
 fiji_news.10.o1: "§8El Ejército Es Nuestra Salvación§!"
 fiji_news.10.o2: "¿No Hemos Sufrido Suficiente?"
 fiji_news.11.t: "Viejas Ideas Desatan el Faccionismo"
 fiji_news.11.d: "El creciente faccionismo dentro de la junta militar ha visto un resurgir de viejas ideas con un nuevo sabor. La facción conocida como la Casa de Suva parece querer crear una monarquía electa, una especie de antiguos títulos con nuevos principios. En lugar de atar el título a la sangre, las ideas de elecciones y el principio de democracia seguirían presentes. Esta hibridación del monarquismo con el electoralismo democrático sería la base fundamental de su plataforma. Uno de los miembros de la facción incluso declaró, 'Ahora puedes decirle a tu hijo o hija que si trabajas lo suficiente y buscas tus metas en la vida, tú también podrías ser príncipe, princesa o tal vez incluso rey o reina.' Muchos no están seguros sobre la propuesta, pero parece atraer al consejo de jefes y a la herencia tribal del pueblo de la isla."
 fiji_news.11.o1: "Qué Cuento de Hadas"
 fiji_news.11.o2: "§0Bueno...Podría Ser Un Buen Impulso para el Ego§!"
 fiji_news.12.t: "Desestabilización por el Golpe"
 fiji_news.12.d: "Con el golpe prolongándose y muchas facciones ahora siendo protestadas por la población general, muchos se preguntan qué vendrá de esta completa pausa en la nación. Los rumores hablan de una facción llamada el Consejo Tecnocrático, que parece ser parte del grupo secreto conocido como el Partido Tecnocrático de Fiji. Pero muchos de los movimientos de protesta contra el aparato del golpe simplemente desean seguir adelante, con carteles que cada vez más aparecen pidiendo al Partido Laborista de Fiji que tome el control, ya que quedó en segundo lugar en los resultados electorales. ¿Quién será el primero en ceder?"
 fiji_news.12.o1: "§tEl Consejo Toma el Poder§!"
 fiji_news.12.o2: "§PEl Pueblo Ya Ha Tenido Suficiente§!"
 fiji_news.400.t: "Fanáticos Militares"
 fiji_news.400.d: "Con el caos que ha causado el golpe, algunos miembros del ejército han adoptado un enfoque agresivo injustificado, desafiando abiertamente los deseos del comodoro Frank Bainimarama. Las tensiones están escalando y la cohesión dentro del ejército comienza a desmoronarse."
 fiji_news.400.o1: "Dios, ayúdanos"
 fiji_news.401.t: "Crece el Rumor de un Asalto"
 fiji_news.401.d: "Recientemente ha habido rumores de que una secta de la junta militar bajo líderes más radicales ha ideado un plan para asaltar el edificio del parlamento y liberar a los rehenes. Se ha visto al comodoro corriendo para encontrar a estos oficiales radicales con el fin de evitar una crisis nacional no vista desde el primer golpe de estado en la década de 1980. El tiempo dirá si personas sensatas o el caos gobernarán las tierras."
 fiji_news.401.o1: "§8¿Creo que oigo disparos?§!"
 fiji_news.401.o2: "§lEs Extrañamente Silencioso Hoy.§!"
 fiji_news.401.o3: "§0¿Qué es ese alboroto que oigo?§!"
 fiji_news.402.t: "La Masacre de Suva"
 fiji_news.402.d: "El caos arrasa la nación cuando los disparos y un asalto a la situación de los rehenes resultaron en 15 muertes, 27 heridos y pánico masivo en toda la nación. En el caos de este evento que duró una semana, fuentes dicen que el comodoro Frank Bainimarama fue encontrado muerto en un convoy gravemente dañado. Nadie reclama la muerte del comodoro y las opiniones están divididas sobre si realmente debería haber muerto o no. Sin embargo, este es un camino hacia la recuperación que costará mucho a la nación."
 fiji_news.402.o1: "¿Realmente Podemos Recuperarnos de Esto?"
 fiji_news.403.t: "Avanzando"
 fiji_news.403.d: "Ha sido una larga y bastante tediosa aventura reconstruir la nación tras la agitación del golpe de estado de 2000. Pero de las cenizas ha surgido un fénix y este majestuoso pájaro volará. Ahora podemos centrarnos en construir sobre la base que se nos ha dado y mirar no solo a nuestra pequeña isla, sino al mundo que nos rodea."
 fiji_news.403.o1: "El Viaje Solo Ha Comenzado."
 fiji_news.500.t: "La Lucha por el Poder Se Intensifica"
 fiji_news.500.d: "Las unidades militares fueron repentinamente retiradas del ya de por sí desproporcionado cordón alrededor del edificio del parlamento. Fuentes afirman que se escucharon disparos y chirridos de neumáticos cerca de las afueras de Suva. Muchos se preguntan qué sucedió para provocar un cambio tan drástico en el aparato del contragolpe militar respecto a lo que quedaba del gobierno civil. Además, el líder etnonacionalista inicial que inició el golpe ha hecho llamados drásticos para dialogar con él o empezar a afrontar las consecuencias de su inacción. Esperamos tener noticias pronto sobre lo sucedido."
 fiji_news.500.o1: "¿Acaso Aún Tenemos Una Nación?"
 fiji_news.501.t: "Los Resultados Sangrientos Han Llegado"
 fiji_news.501.d: "En un marcado contraste con el mundo moderno en el que vivimos, resulta que una secta volátil del ejército emboscó el convoy del comodoro y, posteriormente, forzó al consejo de los jefes a legalizar la Casa de Suva. Este ascenso sangriento ha resultado en que la nación se convierta en una monarquía, a pesar de la historia del país de haber obtenido su independencia de una monarquía. Una reciente entrevista con uno de los supuestos miembros del Consejo de la Casa declaró que, entre comillas, \"Buscamos tener un gobierno firme, un gobierno justo y un gobierno divino sobre la nación. Si bien sí estamos instalando una forma de ley marcial hasta que los etno-nacionalistas sean tratados, no planeamos abolir las elecciones.\" Muchos son escépticos de las afirmaciones, sin embargo, una gran mayoría solo quiere que se detenga el caos. Veremos cuál es el resultado final de esta corona creada por sangre."
 fiji_news.501.o1: "¿Hay Incluso una Rueda para Tomar!?!"
 fiji_news.502.t: "Una Nueva Era"
 fiji_news.502.d: "Con el proceso de reconstrucción esencialmente terminado, las cicatrices algo sanadas y la nación capaz de centrarse en el futuro. La Casa de Suva se ha comprometido a comprender y desarrollar completamente la nación y su gente. Comprendiendo que tendrá desafíos por delante, la gente, aunque aún vacilante, ha crecido un sentido de tranquilidad en que la vida ha vuelto a la normalidad... incluso si esa normalidad no es considerada, \"normal\"."
 fiji_news.502.o1: "Un Nuevo Capítulo, Un Nuevo Comienzo."
 Rear_Admiral_Villiame_Naupoto_desc: "Villiame Naupoto fue un oficial naval fijiano que, a través del caos del golpe de 2006, se unió a una facción de militaristas más vocales. Esta facción dentro del golpe destituyó y aisló a Frank, entre comillas, Bananaman. Como resultado de este cambio, el golpe, que inicialmente respetaba la constitución, ahora se estaba convirtiendo en una junta militar. Aunque el contralmirante Naupoto es una cara nueva en la escena política, no es un hombre ciego, por lo que la gente se pregunta cómo liderará la nación y a su gente hacia tiempos mejores."
 Laisenia_Qarase_desc: "Laisenia Qarase fue un candidato de compromiso establecido durante el golpe de 2000. No demasiado inclinado a la izquierda, étnicamente fijiano y no demasiado inclinado a la derecha para la época. Ganaría las elecciones anticipadas de 2001 y, sorprendentemente, también las elecciones de 2006. Sin embargo, para 2006 sus opiniones y su partido se habían alineado más con los intereses étnicamente fijianos, y algunos proyectos de ley controvertidos durante su mandato en 2006 crearían la crisis constitucional que llevaría al golpe de estado de 2006 por parte del ejército."
 Mahendra_Chaudhry_desc: "Mahendra Chaudhry fue el líder electo del primer gobierno mayoritario étnicamente Indo-Fijiano de Fiji en 2000. Sin embargo, un agitador de un movimiento etno-nacionalista decidió tomar cartas en el asunto y, como tal, secuestró al gobierno electo. Tras los eventos de dicho golpe, se establecería el Partido Unidos de Fiji, que sería elegido oficialmente en las elecciones anticipadas posteriores al golpe. Mahendra Chaudhry intentaría otra postulación para el puesto de Primer Ministro en las elecciones generales de 2006."
 Dr_Padma_Narsey_Lal_desc: "Padma Narsey Lal, nacida en 1951, estudió en la Universidad del Pacífico Sur, graduándose con una maestría en ciencias, ecología y bioquímica. Fue la primera mujer gujarati en asistir a la universidad. En 1971, recibió la primera Medalla de Oro de la Universidad del Pacífico Sur. También completó una maestría en estudios de recursos y medio ambiente en la Universidad Nacional Australiana y un doctorado en economía agrícola y de recursos en la Universidad de Hawái en Manoa. Padma Lal comenzó como funcionaria pública para el gobierno fijiano antes de pasar a cargos de investigación y gestión de la investigación. Ha sido asesora de Desarrollo Sostenible en la Secretaría del Foro de las Islas del Pacífico, y Asesora Técnica Principal en la Oficina Regional Oceánica de la Unión Internacional para la Conservación de la Naturaleza. Lal también ha ocupado puestos de alta responsabilidad en el Gobierno de la Mancomunidad de Australia, incluido el Centro Australiano para la Investigación Agrícola Internacional."
 King_Sitiveni_I_desc: "Sitiveni Rabuka ahora oficialmente recibe el título de Rey Sitiveni I de la Casa de Suva. El miembro principal y algunos argumentan, potencialmente el fundador de la Casa de Suva. Rabuka hizo su nombre y legado con su carrera política y militar, además de estar involucrado, de una u otra manera, en casi todos los golpes de estado que ha tenido la nación. Estabilidad, Orden, Paz... Estos tres pilares son los que Rabuka ha tratado de mantener y, con este nuevo camino, muchos se preguntan si podrá crear un legado real."
 King_Sitiveni_II_desc: "Jioji Konrote ahora oficialmente recibe el título de Rey Sitiveni II de la Casa de Suva. El ex Mayor General y político fue elegido por el pueblo en el primer ciclo electoral de la era posterior al golpe. El nombre Sitiveni es un símbolo en el consejo de la corona. El símbolo es uno de los miembros principales y algunos argumentan, potencialmente el fundador de la Casa de Suva, Sitiveni Rabuka. Con la convención de nombres establecida como precedente, muchos se preguntan si los siguientes líderes elegirán el símbolo o posiblemente marcarán su propio reclamo en el juego numérico."
 FIJ_focus_the_1999_general_election: "Elecciones generales de 1999"
 FIJ_focus_the_1999_general_election_desc: "En 1999 se celebraron las elecciones generales de Fiji, que organizaron el nuevo gobierno, el Partido Laborista Fiyiiano ocupando la mayoría de los escaños en su Parlamento. La oposición principal, el SVT o Soqosoqo ni Vakavulewa ni Taukei, tomaría el segundo lugar. La dinámica que se establece como Partido Laborista fue considerada un Centro de Izquierda y el SVT es un centro derecho. Sin embargo, en tercer lugar tenemos el Partido FAP o Asociación Fiyiana. Un grupo de escindidos del SVT se consideró irónicamente más derecho a ser predominantemente etníicos fiyianos, sin embargo un cambio en el liderazgo conduciría al suavizado conocido del partido ya que crearían una alianza electoral con el FLP."
 FIJ_focus_assessing_the_national_situation: "Evaluación de la situación nacional"
 FIJ_focus_assessing_the_national_situation_desc: "A pesar de la promesa de las nuevas elecciones, tenemos que conseguir nuestros rodamientos y entender lo que es necesario buscar y arreglar. La agitación de la independencia de nuestra nación justa ha sido uno de los conflictos políticos y golpes después del golpe, después del golpe... Como tal, debemos apresurarnos a menos que caigamos al mismo tipo de quagmire."
 FIJ_focus_increased_security: "Aumento de la aplicación de la ley de Suva"
 FIJ_focus_increased_security_desc: "La capital es incómoda, tememos que más violencia étnica pueda llegar a aquellos con negocios en la zona se vean como una mayor probabilidad debido a la reciente elección de un gobierno mayoritario de Indo-Fijian."
 FIJ_focus_the_2000_debacle: "The 2000 Debacle"
 FIJ_focus_the_2000_debacle_desc: "A finales del siglo, la isla de Fiji fue golpeada por un golpe etnonacionalista. El intento de golpe fue eventualmente suprimido por un contragolpe por los militares, sin embargo desde entonces la confianza en el gobierno civil ha sido en todo momento baja. Ahora el actual partido gobernante e incluso su oposición deben ver si pueden restaurar la esperanza a los pueblos de Fiji."
 FIJ_focus_isolated_terror_attacks: "Ataques nacionalistas"
 FIJ_focus_isolated_terror_attacks_desc: "A pesar del arresto de Speight, la violencia de los rebeldes continuó. El 31 de julio los partidarios de Speight aterrorizaron a la aldea de Dreketi, tomando 30 rehenes. Soldados que habían mutiniado en el Cuartel de Sukunaivalu no se rindieron durante seis semanas. El 8 de agosto los rebeldes emboscaron a una patrulla militar, matando a un soldado y un policía e hiriendo a otros tres."
 FIJ_focus_military_disunity: "Mutiny militar"
 FIJ_focus_military_disunity_desc: "El 2 de noviembre de 2000, soldados de la Unidad de Combate Revolucionario leales a Speight mutinied en el mutín Queen Elizabeth Barracks, reteniendo como rehenes a oficiales en un intento por deponer al comandante militar Frank Bainimarama. Two soldiers were killed and ten were injured when the military reok the barracks. Cuatro de los rebeldes fueron torturados y asesinados por soldados leales después."
 FIJ_focus_political_legitimacy: "Legitimación solidificada"
 FIJ_focus_political_legitimacy_desc: "El 15 de noviembre, el Tribunal Superior de Fiji declaró que el gobierno provisional era ilegal. Mara seguía siendo el Presidente legítimo; El Parlamento no había sido disuelto sino sólo suspendido, y ahora debería ser convocado nuevamente; y por implicación, Chaudhry seguía siendo el Primer Ministro legítimo. Posteriormente, Mara renunció oficialmente, con su renuncia respaldada hasta el 29 de mayo."
 FIJ_focus_political_stagnation: "Deadlock político"
 FIJ_focus_political_stagnation_desc: "Tras la reincorporación de la Constitución de 1997 y posteriormente del gobierno electo de 1999, la nación fue extrañamente suspendida. El gobierno que había sido rehén, aterrorizado para dimitir y así sucesivamente estaba ahora de repente de vuelta a supuestamente normal. Mientras que la nación está a gusto los principales ministros y miembros del gobierno no lo son, algunos se preguntan si realmente pueden mantener su poder en tales consecuencias."
 FIJ_focus_political_challenge: "El desafío de Qarase"
 FIJ_focus_political_challenge_desc: "El gobierno de Qarase apeló la sentencia del Tribunal Superior. El 1 de marzo de 2001, el Tribunal de Apelación de Fiji confirmó la decisión del Alto Tribunal de restablecer la Constitución. El gobierno aceptaría el fallo y buscaría reiniciar la campaña para las próximas elecciones de 2001."
 FIJ_focus_2001_elections: "Elecciones generales de Fiji en 2001"
 FIJ_focus_2001_elections_desc: "La decisión de celebrar nuevas elecciones para iniciar un nuevo proyecto vería que las elecciones se celebraron en agosto y septiembre de 2001. Las elecciones fueron tensas tras la contienda del gobierno elegido en 1999, siendo el partido mayoritario el Partido Laborista de Fiji, que luchaba contra el gobierno instado por Coup de Laisenia Qarase que estaba separado del principal partido opositor. El Partido Unido de Fiji o Soqosoqo Duavata ni Lewenivanua (SDL) se formó bajo Qarase cuando fue jurado como primer ministro durante el golpe del 2000. Dicho partido absorbió la mayor parte de lo que quedaba del Partido Asociación Fiyiiana y una mayoría de la Alianza Democrática Cristiana junto con otros grupos conservadores creando un partido conservador de gran coalición. Al final, el SDL terminaría tomando una victoria mayoritaria en la elección estableciendo el escenario para el manejo post golpe de Estado de la nación en general."
 FIJ_focus_post_coup_cleanup: "Limpieza de la instalación de correos"
 FIJ_focus_post_coup_cleanup_desc: "Después ha habido cantidades significativas de daños a la propiedad y un desastre adecuado de la zona de capital general de Suva. Debemos invertir en limpiar rápidamente las cosas si vamos a empezar con una pizarra en blanco y trabajar hacia adelante hacia nuestros objetivos."
 FIJ_focus_early_community_programs: "Programas comunitarios tempranos"
 FIJ_focus_early_community_programs_desc: "Debemos reconstruir la voluntad del pueblo de trabajar juntos, todos somos ciudadanos de Fiji y como tal debemos estar dispuestos a vivir unos con otros. Para mostrar el golpe no es la realidad de las cosas que crearemos programas de unidad. Esto demostrará que las ciudades y comunidades están a punto de reunirse y no separarse mutuamente."
 FIJ_focus_head_start_cooperatives: "Programas Cooperativos Head Start"
 FIJ_focus_head_start_cooperatives_desc: "Con las generaciones mayores desgarrándose el uno al otro hasta la generación más joven para armar las cosas. Para ello debemos inculcar pronto un sentido de unidad familiar en nuestros sistemas escolares que no importa si eres fiyiano, o Indo-Fijian, estamos todos aquí para trabajar juntos por un mejor mañana."
 FIJ_focus_softer_situational_training_programs: "Programas de entrenamiento de situación más suaves"
 FIJ_focus_softer_situational_training_programs_desc: "Con tensiones elevadas entre los grupos étnicos debemos introducir reformas policiales. Para evitar una reducción de la delincuencia, esta reforma es en realidad un nuevo programa de formación para las fuerzas del orden. El programa que diseñamos alrededor de disputas civiles entre grupos y cómo los oficiales pueden manejar la situación sin parecer favoreciendo un lado u otro."
 FIJ_focus_service_guarantee_citizenship: "Garantías de servicio Ciudadanía!"
 FIJ_focus_service_guarantee_citizenship_desc: "Debemos crear un sentido del orgullo nacional, ya que podemos utilizar los militares, tal vez ayudar a traer nuevos pueblos para hacer nuestra isla más diversa en lugar de sólo fiyianos e indofijos. Para eso vamos a crear un servicio al programa ciudadano dentro de los militares. Un poco de financiación adicional y algo para ocupar mejor personalmente el liderazgo militar debe ayudarnos en general en un mundo postgolpe. Así que recuerda, están haciendo su parte, ¿verdad? ¡Únete a las Fuerzas Militares de la República de Fiji!"
 FIJ_focus_the_universal_retirement_program: "El Programa de Jubilación Universal"
 FIJ_focus_the_universal_retirement_program_desc: "El URP será un fondo de jubilación general que el gobierno creará y dará a cualquier ciudadano que haya alcanzado y presentado para la jubilación u otros beneficios sociales asociados. Esperamos elevar e incluso hacer uso de la palabra para todos los ciudadanos en beneficio de toda la nación."
 FIJ_focus_the_national_care_initiative: "La iniciativa nacional de atención"
 FIJ_focus_the_national_care_initiative_desc: "El NCI será el comienzo del piso de nuestro sistema sanitario. Tratamientos básicos relacionados con accidentes cotidianos n tales estarán disponibles libremente para todos los ciudadanos. Esperamos que el cuidado dado muestre a los ciudadanos que componen nuestra nación que están siendo atendidos y que nos darán una verdadera oportunidad de hacer cosas reales en la mejora de la vida tal como lo conocemos."
 FIJ_focus_soup_kitchens_act: "Ley de comedores populares"
 FIJ_focus_soup_kitchens_act_desc: "Con la creciente falta de vivienda, las tensiones étnicas y las personas que huyen de la isla, debemos buscar soluciones radicales. Un programa gubernamental que establece cocinas de sopa estratégicas para ayudar a todos los que están sin hogar o en un estado adecuado reunirá al pueblo. Esto no es tanto como esperamos hacer pero es la base de una verdadera iniciativa benéfica en toda la nación."
 FIJ_focus_police_fairness_act: "Ley de justicia policial"
 FIJ_focus_police_fairness_act_desc: "Con el escenario establecido y la luz todo sobre la seguridad y manejo de las naciones, nuestra aplicación de la ley debe ser mejor implementada y no visto como vagabundos brodos. Los regimientos de la organización policial y el despliegue serán reevaluados y se considerarán más justos tanto para los altos delitos como para las zonas consideradas descuidadas por los lugareños."
 FIJ_focus_fijian_corps_of_engineers: "Cuerpo de ingenieros fiyianos"
 FIJ_focus_fijian_corps_of_engineers_desc: "El establecimiento de la rama FCE del RFMF será una iniciativa dirigida a los militares, en tiempo de paz, para ayudar al desarrollo nacional. Esto puede significar la renovación de la infraestructura militar existente, pero también se puede utilizar para reforzar proyectos civiles de construcción en obras públicas como agua, carretera, ferrocarril y otras infraestructuras que hacen funcionar nuestra nación."
 FIJ_focus_early_education_standards_act: "Ley de normas de educación temprana"
 FIJ_focus_early_education_standards_act_desc: "La EESA es una ley presupuestaria que destinará fondos a los niveles de educación temprana. Esta financiación irá a una mezcla de maestros que pagan, nuevos libros de texto y estandarizará los materiales y equipos necesarios que las aulas necesitan para cada tema básico. Esta financiación se extenderá uniformemente a todas las escuelas diseñadas para escuelas de tipo elemental, la esperanza de que las nuevas generaciones tengan una mayor comprensión para cuando lleguen a la escuela secundaria deben sentir un desafío más suave. Esto debería sentar las bases para que la financiación futura comience a mejorar nuestro camino y mejorar en general las normas de educación de la nación en general."
 FIJ_focus_targeted_medical_imports: "Importaciones médicas dirigidas"
 FIJ_focus_targeted_medical_imports_desc: "Mediante fondos dedicados, estableceremos una lista de verificación prioritaria del equipo médico, los medicamentos necesarios y los suministros básicos para crear un inventario de referencia para que nuestra infraestructura médica pueda funcionar eficientemente como sea posible. Esto debe comenzar un proceso de fomento, siempre que sea posible, del desarrollo médico nacional para que no seamos hamstrung por las cadenas globales de suministro."
 FIJ_focus_fiji_food_securities_program: "Programa de Valores Alimentarios Fiyianos"
 FIJ_focus_fiji_food_securities_program_desc: "El FFSP es un banco de alimentos como el programa en el que los ciudadanos más afectados pueden reclamar la recogida de dichos beneficios y ser capaces de comprar alimentos necesarios para sobrevivir para su hogar en un tiempo de meses. Esto debe elevar el suelo y ayudar a suavizar la línea de pobreza y cada vez más creciente problema de emigración que vive la nación."
 FIJ_focus_domestic_savings_initiative: "La iniciativa de ahorro nacional"
 FIJ_focus_domestic_savings_initiative_desc: "El DSI será un programa dedicado diseñado como una especie de cofre de guerra para el gobierno. Esta supuesta coyuntura sólo se utilizará durante tiempos de crisis económica y o para realizar programas dedicados y específicos para aliviar situaciones que han crecido a proporciones inalcanzables por las autoridades locales. Esas medidas permitirán que Fiji parezca mejor gestionada y apelante a los espectadores extranjeros, ya que nuestra situación no es totalmente la más atractiva. Sin embargo, prevaleceremos y entraremos en el nuevo milenio con un vigor no visto en los últimos 30 años más desde la independencia."
 FIJ_focus_fijian_economic_diversity_initiative: "La iniciativa de la diversidad económica de Fiji"
 FIJ_focus_fijian_economic_diversity_initiative_desc: "La FEDI es un plan de concepto general en el que durante las próximas dos décadas, la nación de Fiji debería tener algún sentido temprano de autarquía a lo mejor de su capacidad. No hay mucho que se sepa honestamente sobre los recursos que soportamos, pero con la tensión étnica, todo el mundo saliendo y un ejército y una población no demasiado entusiastas en el cuerpo del gobierno, tenemos muchos problemas para enfocarnos plenamente en tal empeño. Con esto en mente hemos mantenido la esperanza de alcanzar el objetivo dentro de las próximas dos décadas, pero su capacidad para con la gente si podemos mantenernos firmes y buscar alcanzar tales metas."
 FIJ_focus_rebuild_suva_initiative: "Reconstrucción de la Iniciativa Suva"
 FIJ_focus_rebuild_suva_initiative_desc: "El R.S.I. es un paquete de ayuda económica mutuamente acordado para los ciudadanos de Suva que más sufrió durante la agitación del golpe de 3 meses. El saqueo masivo y el motín han visto a multitudes de daños en la propiedad y los medios de vida de las personas destruidos, como tal debemos ayudarles a volver a sus pies."
 FIJ_focus_early_business_management: "Programa de Gestión Empresarial"
 FIJ_focus_early_business_management_desc: "El BMP es una iniciativa gubernamental para alentar a la próxima generación de empresarios y mujeres para nuestra nación. Estas serán clases dedicadas y prácticas relacionadas con el trabajo como entrenamiento para entender cómo manejar, correr y comprender lo que realmente significa ser un propietario de negocios. Esperamos poner en marcha el desarrollo de nuestra economía a medida que se toman nuevos préstamos y se producen y venden nuevos bienes y servicios."
 FIJ_focus_startup_investment_program: "Programa de inversión de inicio"
 FIJ_focus_startup_investment_program_desc: "El SIP será un programa dedicado al financiamiento de negocios para los nuevos propietarios de negocios y sus sueños. Si bien tal empresa podría generar malos préstamos, sin embargo, estamos tratando de utilizar una parte específica del presupuesto nacional para permitir un modo de conducta inquebrantable. Como tal, si un negocio invertido falla no llegará a ningún costo adicional para el contribuyente."
 FIJ_focus_start_mining_survey_program: "Inicio Programas de Encuesta de Minería"
 FIJ_focus_start_mining_survey_program_desc: "Comenzaremos varios programas de encuesta para poder identificar qué recursos tenemos y dónde estamos realmente cuando se trata de instituir nuestro programa de autarquía limitado."
 FIJ_focus_importing_mining_equipment: "Importación de equipos mineros"
 FIJ_focus_importing_mining_equipment_desc: "Con las recientes encuestas mineras que hemos propuesto tendremos que apoyar estos nuevos esfuerzos. Teniendo esto en cuenta, crearemos una lista prioritaria de equipo minero crucial, materiales y equipos necesarios para nuestros trabajadores mineros. Estas personas son el núcleo de cómo nuestra nación diversificará su economía en su conjunto."
 FIJ_focus_increased_core_industries: "Aumento de las industrias básicas"
 FIJ_focus_increased_core_industries_desc: "Con el enfoque de nuestra nación mirando hacia adelante en nuestro plan de 20 años, debemos invertir en expandir nuestras industrias del pan y la mantequilla. La silvicultura y la navegación en bote han sido un aspecto bastante fuerte, pero también hemos incluido específicos en el sector minero relacionados con el cemento."
 FIJ_focus_solidifying_precious_metals: "Metales preciosos solidificantes"
 FIJ_focus_solidifying_precious_metals_desc: "La extracción y exportación de oro y plata es un aspecto crucial en nuestras importaciones. Ampliar estos subsectores mejorará considerablemente nuestra relación entre el déficit comercial y la importación y exportación de bienes. Ahora la expansión de tal cosa permitirá el crecimiento de nuestros ingresos comerciales para permitirnos reforzar lo que podemos importar. Ha comenzado un ciclo de crecimiento."
 FIJ_focus_establishing_fijian_manufacturing: "Establecimiento de manufacturas fijianas"
 FIJ_focus_establishing_fijian_manufacturing_desc: "El establecimiento de una sólida base de fabricación significa que tenemos la capacidad de diversificar nuestra cartera económica. Ahora cuando importamos cosas podemos utilizar esta base de referencia para diversificar los usos de dichas importaciones y obtener mejores ganancias de nuestras exportaciones."
 FIJ_focus_economic_relief_fund: "Fondo de Socorro Económico"
 FIJ_focus_economic_relief_fund_desc: "El ERF es una red de seguridad establecida donde si la nación cae en tiempos difíciles o si se cumplen las condiciones económicas que causan que un sector colapse repentinamente o cerca de caída libre, las empresas del sector económico afectado pueden solicitar un rescate organizado. Estos supuestos rescates serán negociados y mantenidos dentro de la comprensión del presupuesto asignado para el ERF. Con tal fondo esperamos detener la corbata si alguna fuerza externa afecta a nuestra economía de cualquier manera."
 FIJ_focus_balanced_trading_budget: "Presupuesto de comercio equilibrado"
 FIJ_focus_balanced_trading_budget_desc: "Con el estado de la nación que garra desde la economía agraria y desindustrializada Pseudo en una nueva era de diversidad y prosperidad, debemos mantener en control que lo que tomamos no supera lo que esperamos exportar. Como tal, debemos analizar algunos presupuestos reales que equilibran casi intervalos trimestrales e incluso medio trimestre, a su debido tiempo ajustaremos nuestra economía y aumentaremos la eficiencia y eficacia general de la economía."
 FIJ_focus_early_adoption_tech_sector_investments: "Aprobación temprana de la inversión en el sector técnico"
 FIJ_focus_early_adoption_tech_sector_investments_desc: "Con el aumento de la llamada Internet siendo los mercados globales de moda y zumbido parecen fijados en él es nuestro deber responder en especie. Como tal, vamos a ajustar nuestra fabricación industrial y las exportaciones para incluir estos nuevos productos y servicios que el sector tecnológico parece generar."
 FIJ_focus_the_motorway_improvement_act: "Ley de mejora de las autopistas"
 FIJ_focus_the_motorway_improvement_act_desc: "El Parlamento ha aprobado un proyecto de ley destinado a actualizar proyectos en las principales carreteras de la nación. El proyecto de ley se considera una manera de adaptarse mejor al creciente tráfico de mercancías y aumentar el acceso a nuevas empresas e industrias potenciales a medida que nuestra economía crece y se desarrolla. Mientras algunos rechazan el aumento del gasto, otros esperan que sea otra piedra paso a nuestro futuro como nación."
 FIJ_focus_the_new_millennia_tax_reform_act: "Ley de reforma tributaria de puestos"
 FIJ_focus_the_new_millennia_tax_reform_act_desc: "El Parlamento aprobó recientemente la Ley PCTR, ley que reforma la recaudación de impuestos sobre las empresas y la población en general de una manera que espero sea más justa para los pobres y la población étnica fiyiana que parece ser una gran proporción de nuestra población afectada por la pobreza."
 FIJ_focus_domestic_energy_initiative: "Iniciativa energética nacional"
 FIJ_focus_domestic_energy_initiative_desc: "La DEI es un programa de estudio, encuesta y planificación. Nuestra isla es relativamente pequeña, como tal debemos buscar para conseguir el más golpe para nuestro dólar cuando se trata de la producción de energía. Teniendo esto en cuenta hemos encontrado una buena fuente de aceite doméstico que podemos cosechar, haciéndolo así también vamos a integrar una forma temprana de la industria petroquímica como una expansión y un vínculo directo con la extracción de recursos. Esto debe funcionar maravillas para la planificación futura."
 FIJ_focus_domestic_resource_diversity: "Programa de diversidad de recursos internos"
 FIJ_focus_domestic_resource_diversity_desc: "El Parlamento ha creado el Programa DRD, una iniciativa gubernamental para ampliar y diversificar nuestros recursos internos y la cantidad extraída. Para la mayor parte de la independencia de nuestra isla justa, fuimos conocidos por oro & plata, sin embargo recientes encuestas y avances tecnológicos han visto el descubrimiento de depósitos decentemente tamaño de recursos clave como hierro, cobre e incluso aceite. Esperamos en el futuro capitalizar considerablemente estas startups infantiles de la extracción de recursos."
 FIJ_focus_the_2006_general_election: "Elecciones generales de 2006"
 FIJ_focus_the_2006_general_election_desc: "Las elecciones generales se celebraron en Fiji entre los días 6 y 13 de mayo de 2006. El gobierno titular de Soqosoqo Duavata ni Lewenivanua (SDL), encabezado por el Primer Ministro Laisenia Qarase, estaba en contra de la principal contraprestación, el Partido Laborista de Fiji, dirigido por Mahendra Chaudhry, así como varios otros partidos menores."
 FIJ_focus_subtle_ethnic_illusions: "Ilusiones etnicas sutiles"
 FIJ_focus_subtle_ethnic_illusions_desc: "Con nuestra reelección segura y las tablas de poder que cambian a nuestro favor, debemos buscar solidificar la hegemonía de nuestro pueblo en la isla. Aunque esto se encontraría con la oposición abierta e incluso la hostilidad, por lo tanto buscaremos ser más sutiles en nuestro enfoque y llevar a un cambio real."
 FIJ_focus_drafting_the_reconciliation_bill: "Redacción del proyecto de ley sobre la reconciliación"
 FIJ_focus_drafting_the_reconciliation_bill_desc: "La Ley de Reconciliación es un proyecto de ley que verá una serie de pequeñas concesiones a la población étnica fiyiana, ya que uno de nuestros puntos principales es mirar hacia atrás el golpe de 2000 y comenzar una nueva hoja dando a los participantes golpistas y miembros encarcelados amnistía. Esperamos que esto dé al público una comprensión justa y más verdadera de que todos cometemos errores y como tal no deben ser definidos únicamente por ellos."
 FIJ_focus_assessing_the_farmland_leases: "Evaluación de las Leases Farmland"
 FIJ_focus_assessing_the_farmland_leases_desc: "Las Leases of Farming a la población de Indo-Fijian como compensación para la antigua Royal Sugar Refining Company bajo regla colonial está bien fuera de fecha. Nos aferramos al pasado perpetúando esa práctica y, como tal, estudiaremos la posibilidad de redactar leyes para que se ocupen debidamente de esa práctica."
 FIJ_focus_labour_party: "FLP gana el golpe de estado"
 FIJ_focus_labour_party_desc: "La FUP ha dado en todas las demandas de los militares por temor a represalias y actuar legítimamente sobre la amenaza de un golpe. Con esto, se celebró una elección rápida que condujo a la elección de un gobierno mayoritario del FLP. Con los militares indirectamente de nuestro lado y una especie de pizarra limpia para arrancar podemos buscar realmente cambiar las cosas para mejor."
 FIJ_focus_turning_down_the_heat: "Bajando el calor"
 FIJ_focus_turning_down_the_heat_desc: "Con el nuevo gobierno a cargo y un consenso con los militares establecidos ahora tenemos una pizarra limpia para trabajar. El punto de ebullición cercano para las tensiones étnicas que culminaron en el fiasco 2006 ahora se ha calmado y podemos empezar a integrar mejor nuestras comunidades. Aunque a medida que el tiempo va disminuyendo, podemos establecer el escenario para una nueva era de paz para la isla."
 FIJ_focus_simmering_national_fears: "Miedo nacional inmerso"
 FIJ_focus_simmering_national_fears_desc: "Muchos siguen huyendo de la nación en las carreteras y debemos actuar sobre esto. A través de reutilizaciones presupuestarias en programas de salud y bienestar podemos alentar a las nuevas generaciones a no huir, ya que la esperanza les muestra que estamos aquí para ellos."
 FIJ_focus_setting_to_boil_new_economic_plans: "Configuración para establecer nuevos planes económicos"
 FIJ_focus_setting_to_boil_new_economic_plans_desc: "La economía está estancada o creciendo a un ritmo que se ve prácticamente estancado si alguien incluso pensó en estornudar en un mercado global. Por lo tanto, debemos poner el calor en nuestras iniciativas económicas y buscar construir tanto la conectividad como la estabilidad económica, una especie de plan Nuestro-Tierra si lo deseas."
 FIJ_focus_a_path_of_healing: "Un camino de sanación"
 FIJ_focus_a_path_of_healing_desc: "Con el paso de la tormenta y nuestros pensamientos recogidos junto con ser organizados ahora asistiremos a la situación interna que probablemente consumirá la mayoría de la administración."
 FIJ_focus_foreign_outreach: "Extensión extranjera"
 FIJ_focus_foreign_outreach_desc: "Con la inestabilidad de nuestra nación ahora mirando más estable a los ojos de las potencias extranjeras, podemos mirar ganar y dar inversiones y ver dónde podemos encontrar nuestro lugar en este mundo nuestro."
 FIJ_focus_farmers_investment_division: "División de Inversiones"
 FIJ_focus_farmers_investment_division_desc: "Los agricultores parecen haber causado muchos rufios en esta isla justa. Por lo tanto, debemos establecer una división equilibrada de la inversión agrícola y la agricultura en el gobierno que pueda atender a todas las necesidades, los agricultores son al final agricultores que todos necesitan ayuda."
 FIJ_focus_fijian_redevelopment_fund_phase_one: "Fase 1 del Fondo para el Redesarrollo de Fiji"
 FIJ_focus_fijian_redevelopment_fund_phase_one_desc: "El FF o el Fondo de Redesarrollo Fiyiiano es una iniciativa gubernamental prolongada que tratará de resolver múltiples cuestiones a través de un centro de coordinación del desarrollo económico. Estos planes serán completos y se establecerán de la mejor manera posible para garantizar la estabilidad nacional en estos tiempos tensos que no hemos sido extraños."
 FIJ_focus_ministry_of_scientific_development: "Ministerio de Desarrollo Científico"
 FIJ_focus_ministry_of_scientific_development_desc: "El Ministerio de Desarrollo Social será un sector dedicado del gobierno, con esta dedicación sus principales objetivos serán buscar mentes brillantes y potenciales mentes futuras de la nación y ser capaces de investigar y desarrollar no sólo nuevas tecnologías sino cómo podemos elevar la educación de nuestro pueblo."
 FIJ_focus_reforming_trade_initiatives: "Reformar las iniciativas comerciales"
 FIJ_focus_reforming_trade_initiatives_desc: "Nuestra isla es el hogar de muchos recursos sin explotar, ya que debemos diversificar nuestra economía debemos ser capaces de exportar y importar. Renegociar los términos comerciales y buscar vender al mejor postor potencial nos permitirá traer más capital para mejorar nuestros planes futuros."
 FIJ_focus_pulling_in_foreign_scientist: "Tiro de científicos extranjeros"
 FIJ_focus_pulling_in_foreign_scientist_desc: "Nuestras mentes más brillantes se van, debemos detener esto de inmediato. Si podemos convencer a los científicos extranjeros de que inicien los departamentos de investigación y creen una base aquí, ahora sólo ayudará el desarrollo de la nación pero disuade a los que también se van."
 FIJ_focus_overhauling_the_tax_code: "Revisión del Código Fiscal"
 FIJ_focus_overhauling_the_tax_code_desc: "El código tributario federal es una farsa, las décadas de golpes, los gobiernos cambiantes y la parte posterior y posterior de los fiyianos pro-étnicos y pro-Indo-Fijians ha hecho un desastre y una gran ineficiencia de nuestro código tributario. Debemos empezar desde el suelo y no dar cuarto para mencionar nada sobre la etnia. El código tributario es para la estabilidad monetaria de la nación y no para escoger favoritos entre nuestros ciudadanos."
 FIJ_focus_domestic_iron_development: "Desarrollo nacional de hierro"
 FIJ_focus_domestic_iron_development_desc: "Con avances recientes en tecnologías de reconocimiento geológico, hemos podido descubrir depósitos de mineral de hierro para los que podemos utilizar para el hogar y la exportación a otros. Esta oferta debe permitirnos un pequeño espacio de control en forma de ayudar a los proyectos nacionales de desarrollo."
 FIJ_focus_expanding_upon_domestic_energy_sources: "Ampliación de las fuentes nacionales de energía"
 FIJ_focus_expanding_upon_domestic_energy_sources_desc: "Nuestra isla, mientras que pequeña está llena al borde con una gran cantidad de diferentes recursos naturales. Son estos mismos recursos los que nos permitirán no sólo asegurar la situación doméstica, sino permitirnos mirar hacia la casa regional para la cual vivimos."
 FIJ_focus_human_resources_fund: "Fondo de Recursos Humanos"
 FIJ_focus_human_resources_fund_desc: "Con el desarrollo de nuestra economía, también debemos tener al menos a la gente que trabaje en ella. Como tal, debemos buscar llevar a casa a nuestros ciudadanos que han huido al extranjero, también debemos buscar traer a aquellos que buscan oportunidad, con suficientes incentivos podemos mostrarles una verdadera oportunidad."
 FIJ_focus_pacific_exchange_and_investment_society: "Pacific Investment & Sociedad de Cambios"
 FIJ_focus_pacific_exchange_and_investment_society_desc: "Dicen que no puedes tener tu pastel y comerlo también, pero qué hay de PIES. La sociedad en cuestión será un gran frente para mezclarse en la región del Pacífico y mirar a afirmarnos mejor entre nuestros competidores mucho más grandes."
 FIJ_focus_phase_two_development_fund: "Etapa 2 del Fondo para el Desarrollo de Fiji"
 FIJ_focus_phase_two_development_fund_desc: "La fase 1 era un poco fangosa por la mezcla de otros focos, pero debemos avanzar con un plan real. El plan es absorber la inversión extranjera, priorizar el crecimiento nacional y equilibrar las importaciones y exportaciones de nuestra nación para mantener un fuerte nivel de independencia económica y exterior."
 FIJ_focus_security_through_community: "Seguridad mediante la comunidad"
 FIJ_focus_security_through_community_desc: "Los esfuerzos de policía se tensan bajo el sistema eliminado, nuestro nuevo sistema permite una mayor participación comunitaria. Estos programas organizarán a los lugareños para estar más sincronizados entre sí, dar a la gente la capacidad de detención ciudadana y permitir la expansión de los departamentos policiales locales mediante el compromiso comunitario."
 FIJ_focus_the_care_balance_act: "Ley de equilibrio de la atención"
 FIJ_focus_the_care_balance_act_desc: "El CBA es una legislación que atravesará el aparato de atención sanitaria y social del país e intentará equilibrar y revisar los pulgares doloridos en la habitación."
 FIJ_focus_the_military_reform_bill: "El proyecto de ley de reforma militar"
 FIJ_focus_the_military_reform_bill_desc: "La Ley Parlamentaria #M253 es un proyecto de ley de negociación, en el que se incrementará la despolitización de los fondos militares para permitir más programas nacionales de capacitación. Esto, así como hacer cheques de pago más grandes para nuestros hombres y mujeres que ponen sus vidas en la línea para defender a nuestra nación y su pueblo. Es un comienzo, pero no hay mucha esperanza en lo que respecta a la inversión militar."
 FIJ_focus_foreign_construction_contracts: "Contratos de construcción extranjera"
 FIJ_focus_foreign_construction_contracts_desc: "Dibujar inversiones extranjeras tiene que empezar con las empresas, no sólo los propios líderes del país. Centrándonos en la ayuda de contratistas nacionales para proyectos de construcción, podemos dibujar nuevas ideas, nuevos materiales y una nueva ola de personas que pueden vivir en la isla."
 FIJ_focus_education_investment_package: "Paquete de Inversión en Educación"
 FIJ_focus_education_investment_package_desc: "El EIP es un aumento dedicado de la educación y los presupuestos R&D para ayudarnos a ganar tracción en relación con nuestros vecinos regionales. De esto podemos buscar nuevas formas más eficientes de recursos y métodos de producción."
 FIJ_focus_foreign_medical_expos: "Exposiciones Médicas Extranjeras"
 FIJ_focus_foreign_medical_expos_desc: "Organizar con instituciones médicas de todo el mundo debería permitirnos realmente invertir en la salud y el bienestar de nuestra gente, sus atributos mentales y físicos y los estilos de vida que intentan tener."
 FIJ_focus_phase_three_development_funds: "Etapa 3 del Fondo para el Desarrollo de Fiji"
 FIJ_focus_phase_three_development_funds_desc: "Estamos en camino a la gente de la grandeza. Centrándonos en los problemas reales y calmando las divisiones establecidas por el pasado hemos establecido nuestra nación en el camino del crecimiento en lugar del camino de la destrucción. Debemos duplicarnos y continuar este método de gobernanza para asegurar el futuro de nuestra nación y ahora nuestro modo de vida."
 FIJ_focus_cohesive_integrations_act: "Ley de integración cohesiva"
 FIJ_focus_cohesive_integrations_act_desc: "Con nuestra patria entendimos que debemos tratar de comprender a nuestros vecinos del Pacífico. Comprender su cultura, su gente y sus sociedades nos permite trabajar mejor con esta gente en el futuro."
 FIJ_focus_resource_securities_initiative: "Iniciativa de Valores de Recursos"
 FIJ_focus_resource_securities_initiative_desc: "La RSI es una institución dedicada a la seguridad estatal y diplomática que trabajará para buscar recursos nacionales y extranjeros para el desarrollo de nuestra nación y el beneficio para quienes proporcionan."
 FIJ_focus_military_baseline_act: "Ley de Bases Militares"
 FIJ_focus_military_baseline_act_desc: "A través de nuestros objetivos de prosperidad e inversión en nosotros mismos y otros una realidad brillante se está volviendo cada vez más evidente. Como tal, debemos crear una disposición de base de nuestros servicios armados y con esto podemos permitir que nuestra nación y sus socios sientan la seguridad y la seguridad que los pequeños merecen de las naciones más grandes."
 FIJ_focus_independence_sustainment_act: "Ley de suspensión de la independencia"
 FIJ_focus_independence_sustainment_act_desc: "A través de la organización de nuestros pueblos en bandas locales, uniendo a las comunidades no sólo como unidades propias sino de una pieza del mayor pastel nacional de Fiji. Buscamos crear un ambiente de desafío y autodeterminación, con los chinos y tantos más grandes....queriendo a las naciones en una búsqueda de auto-ganancia debemos permanecer vigilantes en estos tiempos inciertos."
 FIJ_focus_modern_industrialism_act: "Ley de industrialismo moderno"
 FIJ_focus_modern_industrialism_act_desc: "El MIA es un proyecto de ley que busca racionalizar mejor la forma en que se establecen las industrias de producción y aumentar mejor la eficiencia general de dichas industrias. A su vez aumentaremos los estándares para los que nuestra gente pueda disfrutar en la vida."
 FIJ_focus_food_of_tomorrow: "Comida de mañana"
 FIJ_focus_food_of_tomorrow_desc: "Nuestra isla es pequeña, como tal debemos buscar para asegurar más de menos. Como tal, dedicaremos un ala del departamento general de R&D para asegurar los fundamentos de la vida para nuestro pueblo."
 FIJ_focus_progressive_taxes_progressive_gains: "Fiscales progresivos para la sociedad progresista"
 FIJ_focus_progressive_taxes_progressive_gains_desc: "Con esta reforma tributaria buscamos equilibrar mejor las formas de tributación basadas en los ingresos generados. A través del equilibrio de los niveles tributarios no vemos a nadie superando masivamente a otro simplemente porque supuestamente se jalaron por sus propios obstáculos. Ahora podemos utilizar este nuevo equilibrio de ingresos para dar a todos un mejor estilo de vida e invertir no sólo en la economía, sino el pueblo y esta nación en su conjunto."
 FIJ_focus_united_fiji_installed: "UFP Moderate Government"
 FIJ_focus_united_fiji_installed_desc: "Con el gobierno resistiendo las demandas de los militares, el Comodoro Frank Bainimarama ha iniciado un golpe de Estado y ha buscado instalar a un moderado del Partido Unido de Fiji. La mayoría ven a este nuevo gobierno como militares nombrados sí hombres, sin embargo algunos tienen la esperanza de que esto reajuste la cuerda apretada como el retroceso legislativo la crisis constitucional causada recientemente."
 FIJ_focus_resetting_ethnic_legislations: "Restablecimiento de la legislación étnica"
 FIJ_focus_resetting_ethnic_legislations_desc: "Al recortar y por falta de mejores palabras, reajustar las leyes y los proyectos de ley que parecen haber swayed the ethnic balance. Podemos buscar ponerlos de vuelta a una posición más neutral para conseguir un enfoque mental más nivelado de la situación actual."
 FIJ_focus_slashing_biased_taxes: "Slashing Biased Taxs"
 FIJ_focus_slashing_biased_taxes_desc: "Los gobiernos del pasado han trabajado contra la noción de paz para nuestra isla. Uno de los temas principales fue el código tributario y sus múltiples subrayos sutiles que ayudan a los pueblos étnicos específicos sobre otros, empezaremos a reducirlos."
 FIJ_focus_jobs_initiative: "Iniciativa sobre empleos"
 FIJ_focus_jobs_initiative_desc: "A través de un paquete completo del gasto público vamos a invertir en la creación de iniciativas laborales. Esto ayudará a conseguir que cualquiera y todos sean un trabajo cuando sea posible y establecer un nuevo estándar de igualdad para nuestra nación."
 FIJ_focus_fijian_resource_development_program: "Programa de desarrollo de recursos de Fiji"
 FIJ_focus_fijian_resource_development_program_desc: "El FRDP encabezará el desarrollo de recursos y la extracción. Tal programa será convertido en un ministerio del gobierno y como tal también se verá más para el mejoramiento de la nación en lugar de la mejora de grupos específicos. El punto principal es que las tierras que se encuentran con recursos valiosos tendrán ahora la propiedad del gobierno y las empresas tendrán propiedad compartida en el manejo de la extracción y procesamiento de dichos recursos. El plan es fomentar la unidad nacional mediante el desarrollo de la prosperidad."
 FIJ_focus_health_not_wealth_act: "Ley de salud y no curación"
 FIJ_focus_health_not_wealth_act_desc: "La ley HNW es una legislación que reformará algunas leyes laborales clave que nos permiten mejorar el equilibrio y crear un juego más justo en el medio ambiente de la joe media. Mediante la creación de nuevos estándares laborales y la equiparación o el destripamiento absoluto de las normas antiguas y desactivadas, permitimos a nuestra gente trabajar más inteligente, construir mejor y vivir juntos más tiempo."
 FIJ_focus_fiji_more_than_just_water: "Fiji, más que agua justa"
 FIJ_focus_fiji_more_than_just_water_desc: "Nuestra isla tiene una historia horrible, esta historia es muy evidente a través de las acciones y la posición actual que nuestra nación justa tiene con mucho del mundo. Saber esto debemos buscar lo que los extranjeros piensan sobre nuestra nación y mirar para ganar corazones y mentes. Demostrando que podemos cambiar y que nuestra isla es más que un anuncio de agua."
 FIJ_focus_researching_new_trades: "Investigación de nuevos oficios"
 FIJ_focus_researching_new_trades_desc: "Mediante inversiones generosas en R&D relacionadas con bienes y servicios comerciales. Junto con la obtención de dichos bienes y servicio, nuestra nación alcanzará nuevas alturas nunca antes pensadas."
 FIJ_focus_unity_through_service: "Unidad por servicio"
 FIJ_focus_unity_through_service_desc: "El ejército ha sido la mayor parte en mantener nuestra sociedad juntos. Al final de las cosas debemos reconocer que la fuerza a través de la unidad es lo que impulsa a esta nación hacia adelante. Como tal con algunas negociaciones bien redondeadas con los dirigentes militares hemos elaborado un plan amplio para invertir mejor en el ejército, su personal y permitir una mejor separación de las autoridades civiles y militares. No podemos permitirnos otro 2000 Coup."
 FIJ_focus_peace_for_piece: "Paz por pieza"
 FIJ_focus_peace_for_piece_desc: "A través de la paz en casa logramos pedazos del extranjero. Ahora con nuestra isla viendo un nivel de estabilidad no visto en años muchas naciones están ahora más dispuestas a comerciar, vacaciones y trabajar con nosotros. Esto debería permitirnos ver mejor el futuro y examinar nuestra reclamación dentro de la región."
 FIJ_focus_low_income_work_houses: "Casas de trabajo de bajos ingresos"
 FIJ_focus_low_income_work_houses_desc: "Gobierno creó viviendas de bajos ingresos. Un proyecto dedicado que puede ayudarnos a sacar a la gente de las calles y en hogares y empleos. Concedido el costo será un poco alto, sin embargo para garantizar la seguridad, la seguridad y la prosperidad, debemos entender el gasto real al no hacer tal cosa."
 FIJ_focus_funding_a_new_sector: "Financiación de un nuevo sector"
 FIJ_focus_funding_a_new_sector_desc: "Con nuevas encuestas geológicas hemos sido capaces de determinar un área de gran tamaño para una operación minera de mineral de hierro de baja calidad. Tener esta oferta nacional reforzará nuestra diversificación de la economía y tratará de brindar más oportunidades cuando sea posible."
 FIJ_focus_finding_homes_abroad: "Encontrar casas en el extranjero"
 FIJ_focus_finding_homes_abroad_desc: "Algunas de nuestras personas sin hogar son sorprendentemente excesivamente educadas y tienen habilidades sociales que podrían utilizarse en beneficio de la nación. Como tal, vamos a llevar y contratar a estos expertos bajo valor miembros de nuestra sociedad y expandir la oficina exterior. Usando los tiempos difíciles que han tenido como punto de interés, deben ser capaces de apelar mejor a la gente común de las naciones en el extranjero. Así ahora mostrando al mundo la idea del sueño fiyiano."
 FIJ_focus_evaluating_military_requirements: "Evaluación de las necesidades militares"
 FIJ_focus_evaluating_military_requirements_desc: "Técnicamente un militar no contribuye a la economía de ninguna manera. Sin embargo, tampoco hay personas sin hogar. Así que si pudiésemos elevar artificialmente la línea inferior sólo ajustando los estándares y requisitos para unirse realmente al ejército. Entonces podríamos reducir la falta de vivienda, aumentar nuestra defensa nacional y arrancar aumentar nuestro liderazgo y conocimiento del ejército ya que habrá exposición a unidades más grandes. Todo el mundo gana al final."
 FIJ_focus_reorganizing_homeless_shelters: "Reorganizing Homeless Shelter"
 FIJ_focus_reorganizing_homeless_shelters_desc: "El estado de algunos de nuestros programas de bienestar está realmente impactante. Debemos reorganizar la financiación y estructura de estos lugares para ser más eficientes en la cantidad de personas que puedan manejar cómodamente."
 FIJ_focus_naval_primacy_expected: "Primacía Naval esperada"
 FIJ_focus_naval_primacy_expected_desc: "Nuestra nación es una nación isleña, para que tengamos un impacto genuino en nuestra región de influencia debemos invertir genuinamente en nuestra marina."
 FIJ_focus_synthetics_centric_research: "Syns Centric Research"
 FIJ_focus_synthetics_centric_research_desc: "Nuestra isla tiene una gran cantidad de recursos naturales, el problema es que a escala con el mundo somos significativamente insuficientes. Conocer este problema clave podemos buscar el futuro de los recursos. Mediante la tecnología sintética pionera podríamos establecer nuestras propias formas de limitada Autarky para las que el globo no ha visto realmente antes. Una pequeña nota de pie de página, pero para nosotros es sin embargo una declaración orgullosa de nuestra nación."
 FIJ_focus_streamlining_tax_code_expansions: "Racionalización de las extracciones del Código Fiscal"
 FIJ_focus_streamlining_tax_code_expansions_desc: "El proyecto de ley parlamentario T:101A simplificará el proceso y qué tipos de impuestos se pueden imponer a la nación en su conjunto. Esperamos que mediante la creación de un estándar conocido permita a nuestras empresas y población fomentar el desarrollo en formas que, aunque puedan ir alrededor de estos impuestos, también aumentarán indirectamente los impuestos recaudados."
 FIJ_focus_building_tall: "El acto de Building Tall"
 FIJ_focus_building_tall_desc: "Con nuestro espacio limitado y nuestra nación pequeña debemos aprovechar al máximo el espacio que tenemos. Con esto a mediados buscamos la nueva y moderna línea de base que nuestro pueblo debe estar acostumbrado. La automatización es el futuro, ya sea que realmente nos guste o no, pero en lugar de sustituir a las personas debemos integrar a la gente con las máquinas. Ampliar nuestra capacidad productiva y hacer que nuestra isla sea más eficiente entonces la mayoría puede incluso pensar en."
 FIJ_focus_promoting_a_frugal_lifestyle: "Promoción de un estilo de vida Frugal"
 FIJ_focus_promoting_a_frugal_lifestyle_desc: "Nuestro espacio es limitado y nuestras opciones son pocas cuando se trata de desarrollar nuestra isla. Debemos tener una verdadera consideración en preservar la belleza natural de nuestra tierra si queremos mantener la supuesta Vibe Island Destination para los turistas. Como tal nuestro pueblo debe entender disfrutar de la vida como es, buscar el bien en lo que tienen, en lugar de preocuparse siempre por lo que supuestamente podrían tener. Salvar el materialismo para los estadounidenses, este no será el camino de los fiyianos."
 FIJ_focus_exploiting_corporatism: "Explotando el caboismo"
 FIJ_focus_exploiting_corporatism_desc: "Nuestra nación tiene un montón de negocios locales y extranjeros en los que generamos una cantidad significativa del PIB. Sin embargo, con las tendencias de la naturaleza humana muestra que quieren el poder y el dinero. Podemos explotar esto acogiéndonos y supuestamente tomando sobornos y así sucesivamente, pero en realidad utilizar este dinero como una especie de cofre de guerra. Programas de financiación que pueden caer un poco cortos fuera de las sesiones de presupuesto, manteniendo la paz cuando una posible crisis económica y lo que sea posible. Por supuesto que probablemente se pondrán al día, pero vamos a disfrutarlo mientras podamos."
 FIJ_focus_neutral_selectivism: "Neutral Selectivismo"
 FIJ_focus_neutral_selectivism_desc: "Los grandes perros del Pacífico, el Estado Unidos de América y la República Popular China. Estas dos naciones eventualmente se encaran un poco demasiado duro, como tal debemos ser cordiales pero no buscar favores. EE.UU. es más probable que invierta, pero debemos hacer girar estos en formas que China querría superar. Juega a los mejores perros mientras que indirectamente construyen el tipo bajo perro para hablar."
 FIJ_focus_innovations_sector: "Sector de las innovaciones comienzan"
 FIJ_focus_innovations_sector_desc: "Sin ninguna abundancia real en materias primas debemos ramificarnos en diferentes mercados que apelan al mundo cambiante. Nuestra tecnología empezará a sentar las bases para nuestra brecha en las industrias tecnológicas, permitiéndonos vender software valioso y otros productos a los mejores postores."
 FIJ_focus_employment_commission: "Comisión de Empleo"
 FIJ_focus_employment_commission_desc: "El proyecto de ley 5436, también conocido como Ley de Empleación de Todos, es una legislación que establecerá el departamento de Empleo. La Comisión de Empleo buscará iniciativas financiadas por el Gobierno en las que se puedan financiar y apoyar directamente los puestos de trabajo para garantizar a quienes no tengan un empleo la verdadera oportunidad de tener un empleo. El costo sería mayor al principio, pero a medida que pasa el tiempo se vería compensado por nuevos ingresos fiscales e ingresos provenientes de las nuevas empresas creadas."
 FIJ_focus_limited_fijian_naval_expansion: "Expansión naval limitada de Fiji"
 FIJ_focus_limited_fijian_naval_expansion_desc: "Debemos defender nuestro comercio y nuestras aguas. Un par de barcos PT no es suficiente para justificar una defensa real. Debemos crear una auténtica expansión de posturas limitadas y defensivas con nuestra marina para garantizar la seguridad de nuestra isla. El personal y el equipo deben ser estandarizados y mejorados con los conocimientos que conocemos de las misiones nacionales y extranjeras en las que hemos participado."
 FIJ_focus_education_budget_expansion: "Aumento del presupuesto de educación"
 FIJ_focus_education_budget_expansion_desc: "A través de una expansión del presupuesto educativo, podemos buscar el mejoramiento de la comprensión de nuestro pueblo sobre el mundo más amplio que nos rodea y traer nuevas oportunidades a medida que pasan las generaciones."
 FIJ_focus_balancing_budgets: "Presupuestos de equilibrio"
 FIJ_focus_balancing_budgets_desc: "Hemos visto a nuestra nación desarrollarse y esforzarse, pero también hemos visto una tendencia en el departamento de presupuestación. Si vamos a ser un modelo real de crecimiento debemos ser prudentes en el presupuesto flexible y entender que podemos equilibrar dónde aparecen los excesos y deficiencias."
 FIJ_focus_industrial_expansion: "Expansión industrial"
 FIJ_focus_industrial_expansion_desc: "Nuestro desempleo es muy bajo y lo mejor de todo, nuestras tendencias migratorias también son bajas. Debemos patrocinar una expansión industrial para continuar este dios mandando de una tendencia en la historia de nuestra nación."
 FIJ_focus_revitalization_of_foreign_perception: "Revitalización de la percepción extranjera"
 FIJ_focus_revitalization_of_foreign_perception_desc: "El progreso de nuestra nación ha hecho una imagen mejor, no sólo para nuestro pueblo sino del mundo más grande que nos rodea. Disfrutemos verdaderamente de esta nueva era para nuestro pintoresco paraíso de la isla."
 FIJ_focus_extracting_the_future: "Extrayendo El Futuro"
 FIJ_focus_extracting_the_future_desc: "Las nuevas tecnologías en el estudio geológico y la minería junto con las técnicas de extracción nos han permitido ampliar la comprensión de nuestros recursos disponibles que realmente podemos excavar. Aunque algunos no están sinceramente emocionados con la expansión de las operaciones mineras, esta es sin embargo una parte clave que expande y mantiene nuestro ciclo de desarrollo económico estable y estable."
 FIJ_focus_wealthcare_act: "Ley de atención de la salud"
 FIJ_focus_wealthcare_act_desc: "Con el rápido crecimiento de la riqueza en nuestra nación sólo es apropiado que nuestro pueblo merece la atención y acceso a beneficios médicos y post-jubilación para los cuales nación casi 100 veces nuestro tamaño tienen. Con algunas inversiones y adquisiciones en equipo y personal crearemos el cuidado que nuestra nación ha estado tratando desde hace casi décadas."
 FIJ_focus_military_radicals_force_a_junta: "Radicales militares instalan Junta"
 FIJ_focus_military_radicals_force_a_junta_desc: "Con una presión interna masiva, el Commodore se ha visto obligado a instalar una junta. Con el triste descontento de las noticias ha puesto a la nación, pero los nacionalistas se reúnen para crear orden con los militares."
 FIJ_focus_martial_law_window: "Temporizador de ley marcial"
 FIJ_focus_martial_law_window_desc: "Restituiremos el orden en la tierra, también nos comprometeremos a la estabilización de la nación mientras evaluamos nuestra situación. Esta ley marcial no denotará ningún viaje hacia y desde naciones extranjeras durante un tiempo debido al principio de empeoramiento del problema de la emigración. A muchos no les gustará esto, pero debemos soportarlo."
 FIJ_focus_merging_police_forces: "Fusiones de policía"
 FIJ_focus_merging_police_forces_desc: "La distinción de una Policía Militar y una Policía Civil es un desperdicio de recursos y duplicación de mandos. Como tal, integraremos ambas fuerzas, las colocaremos bajo una estructura militar como la y aseguraremos el objetivo unificado de proteger a nuestra nación y a su pueblo en tiempos de desorden e ilegalidad."
 FIJ_focus_militarized_politics: "Política militarizada"
 FIJ_focus_militarized_politics_desc: "La estructura gubernamental es una buena organización, con algunos afinamientos finos y la militarización del aparato juntos realmente podemos dar vuelta a esta nación como una máquina bien aceitada. Después de todo, lo que es un parlamento pero la versión civil de una reunión general del personal y o sala de planificación."
 FIJ_focus_weathering_the_political_storm: "El tiempo de la tormenta política"
 FIJ_focus_weathering_the_political_storm_desc: "Aunque todavía no estamos completamente fuera del bosque, debemos sin embargo iluminar nuestro agarre sobre los excesos de control. El mundo ya está profundamente en nuestra contra debido al autoritarismo que encarnamos como una junta militar. Así que estamos levantando la prohibición de viajar y la ley marcial, junto a esto estamos pasando nuestro primer caos oficial de reforma post golpe de estado que es el acto de cuidado limitado. Este proyecto de ley reducirá los costos y los excesos directos que frenan nuestro campo médico en este momento, con suerte este gesto convertirá algunas cabezas de una manera positiva."
 FIJ_focus_transparency_in_requirements: "Ley de requisitos de transparencia"
 FIJ_focus_transparency_in_requirements_desc: "El TRA es una revisión amplia de la transparencia en la formulación de normas y los requisitos en las leyes civiles y militares. Esto también afecta la transparencia de los requisitos para cosas como cómo las personas pueden conseguir empleo en la sociedad civil o cómo promociona y responsabilidades en la sociedad militar."
 FIJ_focus_fijian_service_means_fijian_respect: "Servicio de Fiji, respeto de Fiji"
 FIJ_focus_fijian_service_means_fijian_respect_desc: "Los mensajes actualizados y directos en código de conducta se reducirán a viejos rencores. Aumentando las penas y mostrando no sólo en papel, sino también en la práctica que quienes sirven a Fiji son fiyi mismo. Al fomentar este vínculo familiar buscamos unir a nuestra gente y tirar las influencias del viejo mundo."
 FIJ_focus_constitutional_safeguard: "Salvaguardia constitucional"
 FIJ_focus_constitutional_safeguard_desc: "Nuestra gente no confía en el sistema, se dice que el sistema debemos dejarles confiar. Por lo tanto, aprobaremos una enmienda que estipula y hace que un crimen nacional sea objeto de trato injusto entre los ciudadanos fiyianos en su conjunto, independientemente de su origen étnico. Con este decreto esperamos reparar las décadas de lucha que ha destrozado a esta nación."
 FIJ_focus_foreign_advisors: "For foreign Advisors Board"
 FIJ_focus_foreign_advisors_desc: "Con el mundo aparentemente en contra de nosotros debemos mirar para mostrar genuinamente que queremos hacer lo correcto por nuestro pueblo y del beneficio mutuo de los que nos rodean. Como tal con una extensa junta asesora civil y militar creada para ayudarnos a reconstruir nuestra nación, podemos buscar nuevas fronteras de crecimiento para nuestra justa nación isleña."
 FIJ_focus_building_upon_our_civilian_base: "Sobre la base de nuestra Base Civil"
 FIJ_focus_building_upon_our_civilian_base_desc: "La economía es pequeña en comparación con nuestra población, por no mencionar que parece tener muchos problemas con esta falta de economía en su conjunto. Como tal inversión dirigida para aumentar dicha base industrial nos permitirá hacer que el pueblo trabaje para la nación, sus objetivos y por el otro."
 FIJ_focus_starting_domestic_arms_companies: "Inicio Empresas de Armamentos Nacionales"
 FIJ_focus_starting_domestic_arms_companies_desc: "El ejército de Fiji no es conocido por... realmente nada ahora que pienso en ello. Debemos cambiar que y como tal, el mejor punto de partida sería tener la forma de las empresas nacionales de armas dentro de nuestra nación y crear una identidad militar fiyiana única. Puede que nunca nos comparemos con los gustos de Estados Unidos, Alemania y así sucesivamente, pero ciertamente podemos hacernos conocer en la región en la que vivimos."
 FIJ_focus_bringing_jobs_back_to_fiji: "Trayendo gente & Trabajos de vuelta a Fiji"
 FIJ_focus_bringing_jobs_back_to_fiji_desc: "Nuestro pueblo todavía deja nuestra nación, ya sea para estudiar, trabajar o lo que suframos de la emigración que plaga a nuestra nación. Como tal, debemos invertir más directamente y precisamente en los problemas que causan tal éxodo."
 FIJ_focus_establishing_the_university_of_fiji: "Funding The University of Fiji"
 FIJ_focus_establishing_the_university_of_fiji_desc: "Educación... este pilar fundamental de la sociedad debe ser uno de nuestros ejes principales al considerar el futuro de nuestra nación y nuestro pueblo. Este pilar tiene aplicaciones civiles y militares que a su vez se aplicarán en la mayor medida."
 FIJ_focus_fijian_care_act: "Ley de atención nacional de Fiji"
 FIJ_focus_fijian_care_act_desc: "La FNCA es un programa para poner de nuevo en programas que afectan a nuestra población viva. Contrariamente a todo el fervor emocional del teatro político, las personas mayores causan más problemas entonces esperan incluso pensar en. Como tal, si podemos mantenerlos tranquilos a través de la cómoda jubilación después de vivir y así sucesivamente, podremos tener una mejor evaluación sobre las necesidades de la población activa."
 FIJ_focus_increase_funding_for_the_fcoe: "Aumento de la financiación para el FCoE"
 FIJ_focus_increase_funding_for_the_fcoe_desc: "La base de nuestra hibridación civil y militar es la del Cuerpo de Ingenieros de Fiji. Debemos aumentar su financiación para permitir una ampliación de la rama a fin de mejorar tanto las aplicaciones militares como civiles."
 FIJ_focus_deboning_healthcare_excesses: "Excesos de atención de salud desprevenidos"
 FIJ_focus_deboning_healthcare_excesses_desc: "¿Quién habría pensado que si usted tiene programas sin control y sin supervisión debido a décadas de caos político y cambios gubernamentales constantes, esa corrupción y dinero perdido sería algo rampante. Una redada completa y prácticamente un reinicio de nuestra red sanitaria está en orden. Al hacer esto podemos crear una pizarra en blanco que expide los cambios que enfrentamos ahora y la realidad de que nuestra nación está verdaderamente en su propio camino hacia la recuperación."
 FIJ_focus_national_rotc_curriculum: "Programa nacional de ROTC"
 FIJ_focus_national_rotc_curriculum_desc: "En lugares como Estados Unidos, algunas escuelas tienen un programa dirigido por una rama militar en la que enviar programas enseña a los estudiantes lecciones de liderazgo que se aplican al mundo civil mediante una estructura organizada militar. Este es el futuro y el punto principal del sistema escolar que necesitamos. Desde el comienzo de la escuela media todas las escuelas seguirán este formato y los estudiantes de la nación en sus respectivos años de graduación serán organizados para citar, unidades. Forsterizando el conocimiento de la comunidad, el liderazgo y la innovación a través del trabajo en equipo, buscamos crear un futuro para el que nuestros jóvenes puedan comprender y estar preparados."
 FIJ_focus_barracks_housing_initiative: "Barracones Iniciativa de Vivienda"
 FIJ_focus_barracks_housing_initiative_desc: ", la Ley de BHI será una nueva forma de abordar las caídas cortas de viviendas en la nación. Las personas sin hogar pueden residir en un cuartel como unidad de vivienda con otros en disposiciones similares. En tal entorno podrán volver a sus pies a través de un programa de empleo y militar como rutina para inculcar esa iniciativa de nuevo en aquellos que creen que el sistema los ha dejado atrás. Trabajar los ingresos a través de esta cita sobre la cita formación básica como programa hasta que puedan conseguir un trabajo fuera del programa y en un hogar fuera del complejo de barracas."
 FIJ_focus_resource_extractions_act: "Ley de extracciones de recursos"
 FIJ_focus_resource_extractions_act_desc: "La REA priorizará a aquellos que están sin hogar o también en el sistema penal para buscar empleo como una manera de ganarse la vida y hacer el derecho mediante el desarrollo de la nación. Con este acto buscamos comprender y ampliar los recursos que podemos tener en el plano nacional."
 FIJ_focus_expand_the_fcoe: "Ampliación del Cuerpo de Ingenieros de Fiji"
 FIJ_focus_expand_the_fcoe_desc: "Con la creciente necesidad de nuevas infraestructuras, vivienda y economía en su conjunto, debemos ampliar la piedra clave a nuestro puente. Esa piedra clave es el Cuerpo de Ingenieros de Fiji o FCoE. Esta expansión verá un enfoque más rápido y amplio de la gestión del desarrollo a medida que comiencen a asignarse más recursos y mano de obra al subbrazo de los militares."
 FIJ_focus_tax_rebalancing_act: "Ley de reforma fiscal"
 FIJ_focus_tax_rebalancing_act_desc: "El parlamento militar ha aprobado la Ley de reducción de impuestos, en la que se revisará una visión general del actual código tributario individualmente y nos permitirá fijar los impuestos obtusos sobre quienes fueron puestos fuera de un hogar."
 FIJ_focus_expanding_the_ministry_of_science: "Ampliación del Ministerio de Ciencia"
 FIJ_focus_expanding_the_ministry_of_science_desc: "Nuestra nación cae detrás del mundo no sólo porque nuestra tierra es pequeña en tamaño, sino que no realmente innovamos. Buscamos ayuda extranjera como con la creación de nuestra Junta Asesora Extranjera. Pero no más, vamos a mostrar el mundo que podemos conseguir en algún lugar y con eso invertiremos fuertemente en nuestro ministerio de la ciencia y las habilidades generales que nuestra nación tiene para investigar y desarrollar tecnologías."
 FIJ_focus_soldiers_lifestyle_act: "Ley de estilo de vida de un soldado"
 FIJ_focus_soldiers_lifestyle_act_desc: "El Parlamento ha considerado apropiado aprobar un decreto en el que se crea la verdadera línea de fondo para un estilo de vida estándar. La línea inferior es la del soldado promedio dentro de nuestros servicios armados. Esto crea una comprensión nacional y generacional de lo que nuestro pueblo disfruta a expensas de lo que algunos no pueden."
 FIJ_focus_the_citizen_soldiers_act: "Ley de soldados ciudadanos"
 FIJ_focus_the_citizen_soldiers_act_desc: "El Parlamento ha aprobado la Ley de Soldados Ciudadanos, una enmienda constitucional en la que todos los ciudadanos son soldados de la nación y cada soldado es ciudadano de la nación. Esta enmienda declara esencialmente que quienes sirven a Fiji son en sí mismos fiyianos, denotando totalmente que la idea de ser fijiano no es sólo una raza basada en la pseudociencia o basura étnica que algunos quisieran expresar. Pero más bien la idea de Fiji o lo que significa ser fijiano es sobre la devoción a la nación y sus ideas."
 FIJ_focus_energizing_the_nation: "Energización de la Nación"
 FIJ_focus_energizing_the_nation_desc: "Para equilibrar adecuadamente las necesidades militares y civiles, vamos a necesitar ampliar nuestra red de energía. Tener una cuadrícula estable y suministro de combustible probará la estabilidad y previsión del viaje por delante."
 FIJ_focus_naval_industrialism: "Industrialismo naval"
 FIJ_focus_naval_industrialism_desc: "Somos una nación isleña, su única naturaleza que centramos nuestro lado militar de producción hacia buques navales. ¿Cómo más podríamos apelar a poderes extranjeros como Estados Unidos, Australia y demás si resultamos ser nada más que una base militar glorificada."
 FIJ_focus_energy_diversity_act: "Acto de diversidad energética"
 FIJ_focus_energy_diversity_act_desc: "El EDA encomendará la diversidad de nuestra red energética para que nuestra nación sea más defendible de los explotadores extranjeros. Poner todos nuestros huevos en una canasta energizada es una receta para el caos instantáneo si nuestra nación se ataca de cualquier manera forma o forma."
 FIJ_focus_mining_the_future: "La minería El futuro"
 FIJ_focus_mining_the_future_desc: "Sabemos que tenemos nuestros propios recursos, deberíamos utilizarlos para mejorar nuestra nación y prevenir interferencias externas en las necesidades económicas básicas."
 FIJ_focus_naval_priorities: "Prioridades navales"
 FIJ_focus_naval_priorities_desc: "Mientras buscamos tener un reclutamiento robusto y equilibrado para nuestros militares, también sabemos que somos literalmente una isla. A medida que tales aumentos de financiación se deslizarán en la dirección de la marina sobre otras ramas, pero no demasiada causa no necesitamos conflictos inter-servicio poco saludables."
 FIJ_focus_civilian_air_training: "Capacitación aérea civil"
 FIJ_focus_civilian_air_training_desc: "Así que... sabemos que tenemos una historia bastante dura con tener una fuerza aérea. Pero no podemos dejar que el pasado dicte nuestra situación actual y mucho menos nuestros futuros esfuerzos de existencia. Por lo tanto, utilizaremos programas de entrenamiento basados en civiles y aeronaves como una manera de introducir y comenzar los pasos del bebé de nuestra rama de la fuerza aérea. Será un proceso lento, pero uno que necesitamos para sobrevivir en esta era moderna."
 FIJ_focus_prussia_of_the_pacific: "La prusia de Pacifica"
 FIJ_focus_prussia_of_the_pacific_desc: "Nuestro estado es la encarnación moderna de un prusiano como nación. Moldear y fusionar estilos de vida civiles y militares en una máquina cohesiva ha creado una nueva era para Fiji. Somos pequeños, pero estamos orgullosos, construimos alto y hablamos en voz alta, somos un poder regional y haremos oír nuestras voces como cualquier otra nación."
 FIJ_focus_monarchist_acendence: "Ascendencia monarquista"
 FIJ_focus_monarchist_acendence_desc: "La lucha militar ha llevado el camino hacia la senda justa de nuestra nación. Hermanos y hermanas de Fiji, estamos unidos bajo Dios y bajo la bandera de Fiji. Somos los maestros de nuestro propio destino, la democracia ha demostrado ser demasiado inestable para mantener la forma. Por lo tanto, debemos comprometer y crear una nueva sociedad, una con nacionalismo, una con fuerza militar, otra donde ser fijiano es más que simplemente acerca de la etnia."
 FIJ_focus_the_kingdoms_quarrels: "Las peleas del Reino"
 FIJ_focus_the_kingdoms_quarrels_desc: "La situación política es tenue al mejor y absurdamente decrépita en el peor de los casos. Debemos juntar un gabinete, formalizar el gobierno y evaluar los mayores problemas de nuestra nación."
 FIJ_focus_the_kingdoms_economy: "Economía del Reino"
 FIJ_focus_the_kingdoms_economy_desc: "Si vamos a llegar a cualquier parte de este mundo necesitamos tener una economía real. La diversidad es el punto principal, el punto de apoyo sería tener la gente adecuada para dicha economía. En general, aunque tendremos que ir de compras si vamos a llegar a cualquier lugar."
 FIJ_focus_the_ethnic_divides: "Las Divisiones Étnicas"
 FIJ_focus_the_ethnic_divides_desc: "Las divisiones étnicas de la nación se remontan en los días del colonialismo inglés temprano. Con muchos sujetos coloniales de la India siendo importados a Fiji para trabajar en las granjas de azúcar y las compañías de azúcar que forzaron los cofres ingleses. Esta división y migración forzada ha sido muy tensa desde la independencia de nuestra nación en los años 70. Como tal esto debe ser una de nuestras mayores prioridades en la solución para que no queremos realmente permanecer en el poder."
 FIJ_focus_police_standards_act: "Ley de normas policiales"
 FIJ_focus_police_standards_act_desc: "El Parlamento ha aprobado un proyecto de ley que modificará las normas que conforman las fuerzas policiales de Fiji. Todo código de conducta será pulido y reformado en mociones e idiomas para subrayar los hechos y la realidad que independientemente de la situación, todas las acciones deben ser evaluadas equitativamente sobre la base de la situación actual. No debe ocurrir ningún acto de agresión contra ningún civil o ciudadano de Fiji a menos que se produzca una amenaza para la persona o los bienes en curso. Estos pasos funcionarán para poner las ruedas correctas en movimiento."
 FIJ_focus_sponsored_emigration_deals: "Patrocinados acuerdos de emigración"
 FIJ_focus_sponsored_emigration_deals_desc: "Aunque costoso en el corto plazo de las cosas, a largo plazo sabremos que la estabilidad llegará a la nación mucho más rápido... incluso si es por medios poco ortodoxos. Al crear acuerdos de emigración patrocinados con indígenas étnicos, podríamos buscar reducir e homogeneizar indirectamente nuestra nación y trabajar con aquellos que realmente quieren quedarse. Todo el mundo tiene un precio, pero todos también tienen una opción."
 FIJ_focus_hiring_practices_act: "Ley de prácticas de contratación"
 FIJ_focus_hiring_practices_act_desc: "Se aprobó un proyecto de ley que normalizaba el idioma y reafirmaba las leyes contra la discriminación. Parece que lo poco que hicimos ha tenido una buena cantidad de lagunas, como tal establecer el campo de juego recto parará la explotación y discriminación de todos los ciudadanos de nuestra nación justa."
 FIJ_focus_equal_standard_care_act: "Ley de igualdad de la atención estándar"
 FIJ_focus_equal_standard_care_act_desc: "La ESCA es una línea básica legal en la que todas las formas de cuidado, ya sean médicas o sociales relacionadas, públicas o privadas deben tener el mismo nivel de atención básica. Debemos asegurarnos de que no importa quién esté enfermo, o quien se haya retirado, que los ciudadanos de esta nación deben ser atendidos y como tal gozarán de dicha atención sin importar cuál sea su origen étnico."
 FIJ_focus_redrafting_the_constitution: "La redacción de la Constitución"
 FIJ_focus_redrafting_the_constitution_desc: "Ha sido un buen momento desde que se ha promulgado una verdadera redacción de la Constitución. Con esto en mente debemos plantear la estructura gubernamental para gobernar. Debemos establecer los cimientos de la igualdad y las libertades sociales para que nuestra nación se construya, no sea que deseemos caer en nosotros mismos por el camino."
 FIJ_focus_addressing_the_brain_drain: "Dirigir el cerebro"
 FIJ_focus_addressing_the_brain_drain_desc: "Nuestra nación se cuesta solo por existir en este punto. Nuestra gente huye buscando mejores oportunidades y mejores estilos de vida. Si queremos crecer nuestra nación, necesitamos invertir y cuidar a nuestra nación y a su pueblo."
 FIJ_focus_establishing_the_reseach_and_development_ministry: "Establecimiento del Ministerio de R&D"
 FIJ_focus_establishing_the_reseach_and_development_ministry_desc: "La creación y formalización del Ministerio de Investigación y Desarrollo o simplemente el Ministerio de Investigación será un pilar fundamental en nuestra sociedad. Crear una cabeza para la educación de nuestra nación y atributos innovadores nos permite organizar, financiar y bien, innovar."
 FIJ_focus_employment_assistance_programs: "Programas de Asistencia al Empleo"
 FIJ_focus_employment_assistance_programs_desc: "El desempleo de nuestra nación y el miedo a detener la vida debido a un mal giro de los acontecimientos pueden ser una fuerza motriz pesada para hacer que la gente se vaya. Como tal, debemos establecer una serie de programas de prevención para ayudar temporalmente a los ciudadanos a pasar a nuevos puestos de trabajo. Cosas como un pequeño estipendio para ayudar durante el mes pueden caer en las facturas o juntas de trabajo para ayudar a encontrar empleo más rápido, cosas al final que suavizan la transición del empleo y el desempleo sin dar a la gente la sensación de vida aparentemente detenerse."
 FIJ_focus_specializing_medical_research: "Especialización de la investigación médica"
 FIJ_focus_specializing_medical_research_desc: "Nuestro pueblo no es muchos, así que cada vida en esta nación por comparación también es mucho más valiosa. Debemos asegurar que un sector significativo de nuestra investigación y desarrollo vaya hacia tecnologías pioneras dentro del campo médico en su conjunto. Sí, sí nos costará, pero nuestro pueblo debe ser el mejor cuidado si queremos realmente utilizar nuestra población al máximo potencial."
 FIJ_focus_expanding_education_funding: "Ampliación de la financiación educativa"
 FIJ_focus_expanding_education_funding_desc: "Ampliar nuestra inversión general hacia el sistema educativo de nuestra nación nos permite crear nuevas generaciones de ciudadanos más inteligentes. El conocimiento que obtengan se utilizará a su vez para desarrollar nuestra nación y nuestro futuro."
 FIJ_focus_creating_the_research_institute_of_fiji: "Creación del Instituto de Investigación de Fiji"
 FIJ_focus_creating_the_research_institute_of_fiji_desc: "El RIF será el orgullo del desarrollo científico en el Océano Pacífico. Nuestra inversión y nuestra dedicación a la innovación permitirán que nuestro pueblo quiera quedarse, desear mejor no sólo ellos mismos sino nuestra nación en su conjunto. También podemos utilizar esta institución como una forma de poder blando en el desarrollo militar y la proyección nacional del poder."
 FIJ_focus_reviewing_the_housing_crisis: "Revisión de la crisis de vivienda"
 FIJ_focus_reviewing_the_housing_crisis_desc: "En el mundo occidental desarrollado una crisis de vivienda es la del mercado de activos que se estrella. Pero en nuestro caso la crisis de vivienda proviene de un problema creciente de falta de vivienda. A pesar de tener un bajo recuento de población, tenemos un problema sin hogar al igual que algunas naciones en África. Entender esta realidad espeluznante nos permitirá ser decisivos en cómo vamos a arreglar este creciente ordeal y, a su vez, tal vez evite que tal cascada vuelva a ocurrir... o al menos en la escala de que ocurra otra vez."
 FIJ_focus_increased_homeless_shelter_funding: "Aumento de la financiación sin hogar"
 FIJ_focus_increased_homeless_shelter_funding_desc: "Nuestros programas actuales de personas sin hogar no están recibiendo la cantidad de financiación para cuidar adecuadamente a los que han venido en necesidad. Con una inversión directa hacia el aumento de la financiación podemos asegurar mejor la calidad del cuidado que estos ciudadanos pueden tener en su tiempo de necesidad hasta que vuelvan a ponerse de pie."
 FIJ_focus_royal_engineers_program: "Programa de ingenieros reales"
 FIJ_focus_royal_engineers_program_desc: "La REP permitirá un mercado de empleos civiles dentro del Cuerpo de Ingenieros del Ejército. Este ala civil del Cuerpo será utilizada para proyectos de obras públicas, trabajos de construcción patrocinados por el gobierno y así sucesivamente. La idea es tener un trabajo básico en el que si alguien está desempleado y corre el riesgo de perder su hogar y posteriormente su sustento como un todo. Entonces podemos crear un piso duro en el que nuestros ciudadanos puedan ponerse de pie y no sentir que pueden caer libremente en profundidades que temen que no regresen."
 FIJ_focus_young_business_leaders_program: "Joven programa de líderes empresariales"
 FIJ_focus_young_business_leaders_program_desc: "El programa YBL es una iniciativa gubernamental para inspirar y ayudar a los nuevos y futuros líderes empresariales. Todo el mundo tiene la capacidad de poseer y operar un negocio, pero aquellos que realmente quieren hacerlo pueden unirse al programa YBL. Al enseñar habilidades empresariales y aceptar y a su vez no pagar préstamos de pérdida, creamos un ambiente positivo para sobresalir en moldear nuestros futuros pilares económicos."
 FIJ_focus_resource_development_initiative: "Iniciativa de desarrollo de recursos"
 FIJ_focus_resource_development_initiative_desc: "La RDI es una punta de lanza del gobierno en la economía para diversificar nuestros recursos internos. Sabemos que tenemos opciones limitadas debido a que literalmente somos una isla. Sin embargo esto no significa que realmente no tengamos nada de valor, por el contrario tenemos una buena mezcla de minerales y minerales que nos permiten tener una economía bien diversificada. Pero si queremos mantener las mesas giradas a nuestro favor, necesitamos tener algunos recursos más basados en el hogar."
 FIJ_focus_new_economic_planning_board: "Nueva Junta de Planificación Económica"
 FIJ_focus_new_economic_planning_board_desc: "La EPB ayudará a los urbanistas e inversores tanto extranjeros como nacionales a establecer una economía nueva y cada vez más amplia. Esto nos permitirá dibujar en nuevo capital y permitirnos ejercer una forma limitada de proyección de energía blanda en la forma de apoyar a las empresas extranjeras y exportar nuestros productos producidos."
 FIJ_focus_ensuring_a_steeling_future: "Asegurar un futuro de acero"
 FIJ_focus_ensuring_a_steeling_future_desc: "El desarrollo y la adquisición de acero en suficientes manos domésticas nos permite esencialmente funcionar. El acero es uno de los principales recursos y materiales que componen el mundo moderno en el que vivimos. Como tal asegurar un suministro interno nos permite mantener alguna forma de independencia económica."
 FIJ_focus_phase_one_business_development: "Fase 1 Desarrollo de las empresas"
 FIJ_focus_phase_one_business_development_desc: "Los primeros resultados de nuestra revitalización económica están llegando a la vida y, como tal, podremos lucir en prosperidad en ningún momento."
 FIJ_focus_oiling_our_nation: "Aceite a nuestra nación"
 FIJ_focus_oiling_our_nation_desc: "A través de extensas encuestas e investigaciones hemos podido dedicar nuestro plan para asegurar un suministro interno de petróleo. La piedra angular de la era moderna, aseguraremos nuestro futuro y nuestras necesidades energéticas y petroquímicas."
 FIJ_focus_diversifying_the_naval_industries: "Diversificación de las industrias navales"
 FIJ_focus_diversifying_the_naval_industries_desc: "Tenemos una fuerte industria naval, pero debemos diversificar y permitir la expansión de las industrias civiles y militares relacionadas en nuestra isla. Debemos ser capaces de hacer un pequeño reclamo para asegurar el suelo de nuestra nación y nuestro modo de competencia con otras naciones."
 FIJ_focus_rubber_banding_the_nation: "Banda de goma La Nación"
 FIJ_focus_rubber_banding_the_nation_desc: "A través de avances en tecnologías sintéticas hemos sido capaces de asegurar un suministro doméstico considerable de caucho a partir del stock limitado de goma real que tenemos para producir especialmente. Esto puede costar un poco más, pero a largo plazo este impulso asegurará otro paso a tanto autarquía como podamos realmente manejar."
 FIJ_focus_phase_two_business_development: "Fase 2 Desarrollo de las Empresas"
 FIJ_focus_phase_two_business_development_desc: "No cabe duda de que las inversiones continuas para mejorar el crecimiento empresarial y la expansión de nuestra economía nos permitirán crecer a un ritmo constante."
 FIJ_focus_pacific_economics_exchange_commission: "Comisión de intercambio de economía del Pacífico"
 FIJ_focus_pacific_economics_exchange_commission_desc: "Nuestra aventura en el reconocimiento regional y ser un poco de dolor de cabeza para los poderes vying sobre el Pacífico será nuestro logro culminante. La Comisión de Intercambio de Economía del Pacífico es un instrumento de cooperación entre nuestra nación y otros países de la región del Océano Pacífico. El objetivo de la comisión es fomentar una mayor cooperación y unidad entre nosotros y las demás naciones insulares al menos, establecer un amplio status quo en los términos del ejercicio de poder blando."
 FIJ_focus_royal_military_expansion_program: "Programa de expansión militar real"
 FIJ_focus_royal_military_expansion_program_desc: "Una expansión general y financiación de nuestros militares nos permitirán ampliar las misiones nacionales de seguridad y apoyo exterior. No sólo esto sino con un ascenso de los militares podemos inculcar un sentido del deber y el honor hacia nuestra nación y su pueblo, a su vez moldeando las futuras generaciones venideras."
 FIJ_focus_royal_military_contracts: "Reales Contratos Militares"
 FIJ_focus_royal_military_contracts_desc: "Los RMC serán un programa de incentivos para intentar la producción nacional de armas. Si bien no es nada para estornudar honestamente, sin embargo nos permitirá abastecer adecuadamente a nuestros militares y, a su vez, mejorar nuestro entrenamiento mientras que también reducir el tiempo general necesario para entrenar."
 FIJ_focus_royal_fijian_dream: "El sueño real de Fiji"
 FIJ_focus_royal_fijian_dream_desc: "El sueño real de Fiji es el de pensar en el pasado, pero hacerlo por los estándares del presente. Una reafirmación de la declaración constitucional de que se mantendrá la piedra angular de nuestra democracia, pero más bien los nombres de oficinas y títulos serán simplemente cambiados. Es esto simplemente agregar más panash cosmético a nuestra forma de gobierno, sí, pero esto devalua nuestros compromisos para cuidar de nuestra nación y su pueblo, ciertamente no. A veces un pequeño impulso en el ego puede hacer maravillas a los muchos que no siempre confían en sí mismos."
 FIJ_focus_technate_council_emerges: "El Consejo de Tecnología emerge"
 FIJ_focus_technate_council_emerges_desc: "En Fiji muchos expertos técnicos destacados han estudiado en el extranjero. El Consejo Técnico es un grupo de respetados secta de economistas, científicos y otros expertos técnicos que se han reunido en su propio bloque de poder. Como tal en el caos y faccionalismo aparentemente interminables, el Consejo Técnico actuó utilizando sus conexiones e influencia para someter a los líderes de las facciones ya sea por medios directos o indirectos. Como resultado, el Consejo ha asumido el liderazgo de la nación y se esforzará por convertir a Fiji en un modelo de ingenio humano e innovación."
 FIJ_focus_a_technocratic_constitution: "Una Constitución Tecnócrata"
 FIJ_focus_a_technocratic_constitution_desc: "Lo fundamental de cualquier Tecnocracia es que el cuerpo gobernante es para el mejoramiento de la especie y no la subcategoría de dicha especie. Por lo tanto, planeamos redireccionar la constitución de nuestra nación y crear la primera constitución siempre tecnócrata. Los puntos principales que podemos desmoronar a medida que vamos a reformularlo pero basta decir que el punto principal ahora es que mientras nos llamamos fiyianos y tenemos un Estado nacional llamado Fiji. Por lo tanto, cualquier humano bajo el órgano rector de esta nación será tratado como igual. Los seres humanos son humanos, somos la especie y debemos trabajar juntos para solidificar el futuro y el progreso de nuestra especie."
 FIJ_focus_human_treatment_amendment: "Enmienda del tratamiento humano"
 FIJ_focus_human_treatment_amendment_desc: "La Enmienda de Tratamiento Humano establece en un lenguaje claro que cualquier miembro de la especie humana, independientemente de su variación, será tratado como humano. Esto significa que todo acto injusto de daño hecho a otro miembro de la especie debido a la diferencia en creencias, apariencias o identidad personal dentro de los dominios científicos conocidos de la comprensión, será castigado severamente de acuerdo con las leyes establecidas en el código penal."
 FIJ_focus_voting_requirements_amendment: "Enmienda de los requisitos de votación"
 FIJ_focus_voting_requirements_amendment_desc: "La enmienda al requisito de voto es una respuesta sencilla y directa a votar en esta era moderna de los gobiernos democráticos. La edad de votación será de 18 años, la edad legalmente reconocida de convertirse en un adulto y entender la responsabilidad personal de sus propias opciones y acciones de vida. Se permitirá a todos los ciudadanos registrados de la nación votar, esto es para evitar que los adversarios extranjeros malintencionados exploten la apertura que puede provenir de una democracia directa. Los votos serán emitidos a través de un sitio web gubernamental que se puede acceder en casa, por teléfono o en un edificio administrativo local. Los votantes deben poder poner en su número de identificación de ciudadanía para prevenir la doble votación y otros actos maliciosos de dificultad."
 FIJ_focus_working_standards_amendment: "Enmienda de las Normas de Trabajo"
 FIJ_focus_working_standards_amendment_desc: "La enmienda sobre las normas de los entornos y puestos de trabajo recoge el nuevo rumbo que queremos dar fundamentalmente a la nación. La disposición principal es el análisis y la implantación inmediatos del horario rotativo, más conocido como horario 4 & 4: 4 horas al día, 4 días a la semana serán la semana laboral estándar de nuestros ciudadanos. Esta implantación llevará tiempo, pero este formato garantiza el máximo empleo y la máxima retención y felicidad de los trabajadores."
 FIJ_focus_funding_our_future: "Financiación de nuestro futuro"
 FIJ_focus_funding_our_future_desc: "El núcleo de nuestro viaje hacia un futuro tecnocrático es asegurar que las generaciones futuras se estén enseñando de forma adaptativa la información del mundo más amplio y más allá. Algunos son estudiantes visuales, algunos están en la mano. Pero todo es una escala deslizante y como tal si no podemos deslizarnos con esa escala crearemos una casta de personas y sólo las lastimaremos por no realmente preocuparse acerca de cómo pueden aprender y adaptarse."
 FIJ_focus_growing_our_manufacturing_base: "Creciendo nuestra base de fabricación"
 FIJ_focus_growing_our_manufacturing_base_desc: "Si queremos lograr un futuro de progreso debemos crecer, no sólo como nación sino también nuestra economía. Este punto iniciará un enfoque dedicado al crecimiento económico. También tendremos un pilar de apoyo en el desarrollo social y la inversión."
 FIJ_focus_building_the_institute_of_automation: "El Instituto de Automatización"
 FIJ_focus_building_the_institute_of_automation_desc: "El Programa RPP o Research Paradise es algo que lanzará nuestra nación y posteriormente nuestras especies en este planeta hacia el futuro que especulamos. Comenzando con el Instituto de Automatización utilizaremos esta institución para dedicar innovaciones e investigaciones a una mejor automatización e integración de nuevas tecnologías y métodos para los cuales podemos construir, producir y crear. Estableciendo la barra para crear más a precios más baratos y rápidos esperamos dar a todos donde sea posible un nuevo nivel de vida no visto desde la era de la posguerra."
 FIJ_focus_dedicated_welfare_funding: "Fondo para el Bienestar Dedicado"
 FIJ_focus_dedicated_welfare_funding_desc: "Si queremos que nuestros ciudadanos sean productivos y cooperativos, también debemos cuidarlos. El respeto es una calle de dos maneras e independientemente del impacto emocional que todos somos miembros de la misma especie, por lo tanto por decreto constitucional debemos cuidarnos unos a otros como tal."
 FIJ_focus_tech_industrial_investments: "Inversiones industriales tecnológicas"
 FIJ_focus_tech_industrial_investments_desc: "Nuestra comprensión de la economía global más amplia muestra muy bien que las industrias tecnológicas están donde están las cosas. Sabiendo esto podemos entrar en el juego e integrar esto también como parte de nuestro Programa de Investigación para el Paraíso."
 FIJ_focus_institute_for_resource_development: "Instituto para el Desarrollo de los Recursos"
 FIJ_focus_institute_for_resource_development_desc: "El IRD dedicará su investigación hacia formas de extracción de recursos, refinamiento y sintéticos. Esta revisión y dedicación sentarán las bases para nuestro desarrollo de autarquía económica y permitirán al mundo ver que podemos crear un mejor mañana."
 FIJ_focus_institute_for_energy_development: "Instituto para el Desarrollo de la Energía"
 FIJ_focus_institute_for_energy_development_desc: "La creación del IED será desarrollar nuevas formas de producir energía. Esto también se extiende a hacer que estos nuevos métodos de producción sean más eficientes y productivos en general. Como tal, esta nueva extensión del Programa de Investigación para el Paraíso ayudará a asegurar más independencia energética de las potencias extranjeras."
 FIJ_focus_labour_corps: "Cuerpo de Trabajo"
 FIJ_focus_labour_corps_desc: "El Cuerpo de Trabajo es una iniciativa patrocinada por el Gobierno para organizar y priorizar el desarrollo y construcción de nuevas obras públicas y nuevas infraestructuras en su conjunto. Este ejército como la organización civil nos permitirá construir cosas a velocidades que ninguna nación normal desarrollada sería capaz de hacerlo. Esto se debe a la organización y racionalización de las regulaciones junto con cómo atacar directamente las necesidades y hacerlas."
 FIJ_focus_labour_prison_program: "Programa de prisión laboral"
 FIJ_focus_labour_prison_program_desc: "El LPP es una filosofía de rehabilitación en relación con el sistema penal. Los que cometen delitos y sean encarcelados recibirán las formas básicas de atención y atención. Sin embargo, todos los presos podrán inscribirse en el programa LP donde el preso podrá tener un trabajo dedicado en el que puedan obtener créditos energéticos. Estos créditos pueden ser intercambiados para redimir por una cantidad determinada de cotización, actualizaciones, en relación con elevar el mínimo de su duración a un estado más soportable. Después de que todas las supuestas mejoras sean compradas y dependiendo del delito el prisionero puede eventualmente cambiar una cantidad determinada de créditos energéticos para reducir su sentencia. Aunque esta tasa al principio será parcial para mantenerlos, al final el objetivo es fomentar una forma de rehabilitación mediante el trabajo y la dedicación y preparar a los presos para reincorporarse a la sociedad."
 FIJ_focus_increasing_domestic_steel: "Aumentar el acero interno"
 FIJ_focus_increasing_domestic_steel_desc: "A través de extensas encuestas e investigaciones hemos podido avanzar en el desarrollo de nuestra producción nacional de acero. Aunque no es mucho, es sin embargo un buen punto de partida para que seamos más autosuficientes."
 FIJ_focus_technocratic_militarism: "Militarismo Tecnocrático"
 FIJ_focus_technocratic_militarism_desc: "Un principio común de unidad en la historia de nuestra especie es el del deber y el honor a la patria y los que la sirven. Debemos implorar una buena nota de investigación y desarrollo para mejorar nuestros militares. Esto no puede ponernos a la par con naciones como Francia, Alemania y así sucesivamente, pero al menos podríamos emular a un militar estadounidense de tamaño mini. Uno puede soñar... uno puede soñar."
 FIJ_focus_research_paradise_program: "Investigación Programa Paraíso"
 FIJ_focus_research_paradise_program_desc: "Después de casi 3 años en desarrollo, finalmente podemos desencadenar nuestro objetivo final. El Programa de Investigación para el Paraíso servirá como piedra angular de la comunidad científica mundial y utilizará una amplia financiación para crear vacaciones como centro para investigadores de todos los campos para estudiar, experimentar y explorar sus campos de estudio. Crearemos una cita, mundo en el que los campos STEM se pueden ver no sólo como el futuro, sino tan agradable como unas vacaciones regulares."
 FIJ_focus_promoting_domestic_energy_synthetics: "Promoción de la energía nacional sintética"
 FIJ_focus_promoting_domestic_energy_synthetics_desc: "Rupturas en sintéticos ha dado lugar a una creciente oferta nacional de petróleo. Esta oferta nacional se utilizará aún más para crecer nuestra economía, ya que si bien esto puede ser utilizado para la energía esto también impulsará nuestras industrias petroquímicas generales."
 FIJ_focus_technocratic_health_act: "Ley de salud tecnológica"
 FIJ_focus_technocratic_health_act_desc: "El consejo ha aprobado el THA, un proyecto de ley que invierte una expansión general en nuestro sistema sanitario. Esto nos permitirá tratar y cuidar mejor a nuestra población en general. Debemos ser capaces de construir alto, para hacer que debemos tener a la población, tanto en tamaño como en motivación que esa población quiere construir."
 FIJ_focus_industrial_diversity_act: "Ley de diversidad industrial"
 FIJ_focus_industrial_diversity_act_desc: "La AIF ve la mayor diversificación de nuestra economía civil. Con los continuos esfuerzos del Complejo del Instituto hemos sido capaces de desarrollar verdaderamente nuestra nación."
 FIJ_focus_family_care_act: "Ley de atención de la familia"
 FIJ_focus_family_care_act_desc: "Este decreto es un entendimiento fundamental de que para una cohesión social saludable, la familia, independientemente de su composición, es la piedra clave principal de cualquier sociedad. Como tal, debemos reestructurar nuestros programas de bienestar social para apoyar y mantener esta piedra clave para mantener fuerte la estructura de nuestra sociedad."
 FIJ_focus_research_plan_alchemy: "Plan de investigación Alchemy"
 FIJ_focus_research_plan_alchemy_desc: "Nuestro plan más ambicioso hasta la fecha. Plan de Investigación Alchemy costará alrededor de un tercio de nuestro PIB, pero creemos que tenemos los fundamentos extremos para intentar la reorganización molecular. En términos claros esto se acercaría al equivalente de Alchemy en sí. Aunque este técnico sería extremadamente volátil y costoso, si realmente podemos trabajar a través de esto, podríamos desbloquear la forma más verdadera de autarquía económica."
 FIJ_focus_research_plan_armory: "Plan de investigación Blindajey"
 FIJ_focus_research_plan_armory_desc: "Nuestros militares deben estar en pie con nuestros avances civiles. Aunque no podemos poner todas nuestras mejores invenciones nuevas en el campo, lo menos que podemos hacer es elevar la norma a la que nuestro personal de servicio puede luchar y sobrevivir. Aunque esta voluntad por supuesto viene a un costo decente, los resultados finales demostrarán el mejoramiento de la seguridad de nuestra nación en general."
 FIJ_focus_research_plan_biomedical: "Plan de investigación Bio-Medical"
 FIJ_focus_research_plan_biomedical_desc: "Plan Bio-Med está impulsando esencialmente nuestra tecnología y máquinas biológicas y médicas a niveles que extenderán la vida media durante otros 20 años. Prothstetics, las mejoras en la ingeniería genética en su conjunto permitirían a las personas mayores mantenerse más sanas y fuertes a pesar de su edad. Esperamos ser como un paraguas y realmente cubrir a nuestros ciudadanos en una nueva era de innovaciones biomédicas."
 FIJ_focus_naval_innovations: "Innovaciones navales"
 FIJ_focus_naval_innovations_desc: "Nuestro ejército es más que sólo el ejército, un departamento interno dedicado a las innovaciones navales es la única manera en que Fiji puede gobernar sus aguas nacionales."
 FIJ_focus_expansion_of_welfare_programs: "Ampliación de los programas de bienestar"
 FIJ_focus_expansion_of_welfare_programs_desc: "Diversificar nuestros tipos de programas de bienestar permitirá una variedad de cuidados atentos hacia varios problemas constantes que persisten dentro de la nueva era."
 FIJ_focus_research_plan_synthetic: "Plan de investigación sintético"
 FIJ_focus_research_plan_synthetic_desc: "Plan Synthetic es un enfoque al por mayor para refinar nuestro programa sintético que nos permitirá conjurar una oferta nacional de caucho como productos. A costa de las importaciones limitadas de caucho y el aumento de las inversiones en investigación podemos esperar un cierto impulso a nuestras matrizs económicas y sociales generales debido a esta oferta adicional de recursos. Otro paso que damos..."
 FIJ_focus_civilian_corp_of_engineers: "Cuerpo Civil de Ingenieros"
 FIJ_focus_civilian_corp_of_engineers_desc: "El CCE es una extensión civil del Cuerpo de Ingenieros de Fiji. El objetivo es hacer una distinción y priorizar los proyectos de obras civiles y militares. Sin embargo, estos dos grupos pueden unificar si surge la necesidad que tendrá algunas aplicaciones militares indirectas."
 FIJ_focus_research_plan_autarky: "Plan de investigación Autarky"
 FIJ_focus_research_plan_autarky_desc: "A través de años de extensa investigación, planificación e inversiones hemos logrado finalmente un verdadero avance. Uno que solidifica nuestra autarquía económica en la medida más completa. Ahora podemos lograr cualquier cosa, las estrellas pueden incluso no ser el límite más."
 FIJ_focus_research_plan_feast: "Plan de investigación Feast"
 FIJ_focus_research_plan_feast_desc: "Para sostener nuestro crecimiento como especie y sociedad debemos proporcionar los mismos fundamentos de la vida. Una base fundamental es la alimentación, esta clave asegurará la estabilidad social, el crecimiento de la población y un avance del poder blando en la mayoría de las naciones. Podemos encontrar formas de aumentar esencialmente la ayuda extranjera dirigida y liderar el mundo en la lucha contra la pobreza y las inseguridades alimentarias. Fiji se convertirá en una piedra angular de la unidad mundial."
 FIJ_focus_research_plan_nucleus: "Plan de investigación Nucleus"
 FIJ_focus_research_plan_nucleus_desc: "El futuro es verdaderamente ahora. Tantos avances se han hecho en la ingeniería nuclear que su patético avance en las tácticas temibles aún prevalecen un desagradable desprecio de las realidades obvias de la producción energética. Por lo tanto, por supuesto a un costo importante, estableceremos el nuevo estándar mundial de cómo construir realmente un reactor nuclear. Uno que es eficiente, eficaz y uno que probablemente producirá más de la zona útil que controla. Establecimos este estándar verdadero y más seguro que podríamos poner en vergüenza a cualquier nación con un pasado malhumorado en términos de poder nuclear. Para la tecnocracia, el futuro que nuestras especies necesitan, pero de alguna manera parece no querer."