l_spanish:
 MDR_RULE_SHOCKS: "Shocks de mercado"
 MDR_RULE_SHOCKS_HISTORICAL: "Históricos"
 MDR_RULE_SHOCKS_HISTORICAL_DESC: "Los grandes shocks reales llegan en su fecha: guerra de Irak (2003), auge del uranio (2006), crisis de los alimentos (2007), pico del petróleo (2008) y su caída, petróleo caro de 2010 a 2014, Fukushima (2011), caída del petróleo (2014), COVID-19 (2020) y guerra de Ucrania (2022). Además, si la partida provoca uno obvio (una guerra en el Golfo, el cierre de Ormuz, una guerra entre Rusia y Ucrania o sequías en varios países a la vez), también ocurre."
 MDR_RULE_SHOCKS_DYNAMIC: "Dinámicos"
 MDR_RULE_SHOCKS_DYNAMIC_DESC: "No hay fechas fijas. Los shocks vienen de lo que pasa en la partida (guerras en el Golfo, el cierre de Ormuz, una guerra entre Rusia y Ucrania, sequías) y, rara vez, de causas que no se ven venir, como una guerra de precios de la OPEP."
 mdr_shocks_news_a: "Los mercados no esperan a nadie."
 mdr_shocks.1.t: "Se dispara el precio del petróleo"
 mdr_shocks.1.d: "El barril de petróleo sube con fuerza en todos los mercados del mundo. Los países que lo exportan llenan sus arcas; los que lo importan pagan más por el combustible, el transporte y la energía.\n\n[mdr_shock_cause_text]"
 mdr_shocks.2.t: "Se desploma el precio del petróleo"
 mdr_shocks.2.d: "El barril de petróleo cae a precios que hacía años no se veían. Para los importadores es un alivio; para los países que viven de exportarlo, el comienzo de una crisis.\n\n[mdr_shock_cause_text]"
 mdr_shocks.3.t: "Crisis mundial de los alimentos"
 mdr_shocks.3.d: "El precio de los granos sube sin freno. Los países que importan su comida pagan mucho más por alimentar a su población, y en las ciudades más pobres empiezan las protestas por el pan.\n\n[mdr_shock_cause_text]"
 mdr_shocks.4.t: "Bajan los precios de los granos"
 mdr_shocks.4.d: "Las cosechas abundantes hunden el precio de los granos. Comer es más barato, pero los agricultores de los países exportadores ganan mucho menos.\n\n[mdr_shock_cause_text]"
 mdr_shocks.5.t: "Se dispara el precio del uranio"
 mdr_shocks.5.d: "El uranio se vuelve escaso y caro. Los países con minas ganan fortunas; los que dependen de importarlo para sus reactores ven subir el costo de la energía nuclear.\n\n[mdr_shock_cause_text]"
 mdr_shocks.6.t: "Se hunde el precio del uranio"
 mdr_shocks.6.d: "La demanda de uranio se derrumba y su precio cae. Las minas cierran o pierden dinero, y varios proyectos nucleares quedan en pausa.\n\n[mdr_shock_cause_text]"
 MDR_SHOCK_CAUSE_1: "La invasión de Irak pone en duda el suministro de todo el Golfo Pérsico."
 MDR_SHOCK_CAUSE_2: "La demanda de China y la India crece más rápido que la producción, y los especuladores apuestan a que el barril seguirá subiendo."
 MDR_SHOCK_CAUSE_3: "La crisis financiera frena la economía mundial y la demanda de petróleo se derrumba."
 MDR_SHOCK_CAUSE_4: "La economía mundial se recupera y la demanda de Asia mantiene el barril por encima de los cien dólares."
 MDR_SHOCK_CAUSE_5: "El petróleo de esquisto de Estados Unidos inunda el mercado y la OPEP se niega a recortar su producción."
 MDR_SHOCK_CAUSE_6: "La pandemia paraliza los viajes y las fábricas: sobra petróleo y no hay dónde guardarlo."
 MDR_SHOCK_CAUSE_7: "La guerra en Ucrania y las sanciones a Rusia cortan una parte del petróleo y de los granos del mundo."
 MDR_SHOCK_CAUSE_8: "Las reservas de uranio de las viejas armas nucleares se agotan, una mina clave se inunda y todos quieren construir reactores."
 MDR_SHOCK_CAUSE_9: "El accidente de Fukushima cierra reactores en Japón y Alemania, y el mundo duda de la energía nuclear."
 MDR_SHOCK_CAUSE_10: "Malas cosechas en Australia, biocombustibles que se comen el maíz y países que prohíben exportar arroz y trigo."
 MDR_SHOCK_CAUSE_11: "La guerra en el Golfo Pérsico amenaza a los mayores productores de petróleo del mundo."
 MDR_SHOCK_CAUSE_12: "El cierre del Estrecho de Ormuz deja atrapada una parte enorme del petróleo del mundo."
 MDR_SHOCK_CAUSE_13: "La guerra entre Rusia y Ucrania corta el petróleo ruso y los granos del Mar Negro."
 MDR_SHOCK_CAUSE_14: "Sequías graves en varios grandes productores a la vez destruyen buena parte de la cosecha mundial."
 MDR_SHOCK_CAUSE_15: "La OPEP se divide y sus miembros inician una guerra de precios para quedarse con los clientes."
 MDR_SHOCK_CAUSE_16: "Ataques a oleoductos y refinerías clave cortan el suministro de golpe."
 MDR_SHOCK_CAUSE_17: "Plagas y un clima extremo arruinan las cosechas en varios continentes."
 MDR_SHOCK_CAUSE_18: "Un accidente en una de las mayores minas de uranio del mundo deja al mercado sin suministro."
 mdr_oil_bust: "Crisis petrolera"
 mdr_oil_bust_desc: "Vivimos de exportar petróleo y el precio se hundió. Los ingresos del Estado caen, la moneda se debilita y la gente culpa al gobierno. Cuanto más dependemos del petróleo y más bajo está el precio, peor es la crisis."
 mdr_oil_boom: "Bonanza petrolera"
 mdr_oil_boom_desc: "El petróleo caro nos llena de dinero y el país está tranquilo. Pero todo se invierte en el petróleo y el resto de la industria se queda atrás: es la enfermedad holandesa."
 MAPMODE_MDR_CLIMATE_MAP_MODE: "Riesgos climáticos"
 MAPMODE_MDR_CLIMATE_MAP_MODE_NAME: "Riesgos climáticos"
 MAPMODE_MDR_CLIMATE_MAP_MODE_DESCRIPTION: "Muestra el desastre natural más probable de cada estado y cuánto riesgo tiene en total."
 mdr_climate_map_mode_tooltip: "Riesgos climáticos en [FROM.GetName]"
 mdr_climate_map_mode_tooltip_delayed: "Riesgo de cada desastre en §Y[FROM.GetName]§! (cuanto más alto, más frecuente):\n  Terremotos: §Y[?FROM.mdr_hz_q|0]§!\n  Tsunamis: §Y[?FROM.mdr_hz_t|0]§!\n  Tormentas tropicales: §Y[?FROM.mdr_hz_s|0]§!\n  Inundaciones: §Y[?FROM.mdr_hz_f|0]§! (más §Y[?FROM.mdr_hz_m|0]§! en la temporada de monzones)\n  Incendios forestales: §Y[?FROM.mdr_hz_w|0]§!\n  Olas de calor y sequías: §Y[?FROM.mdr_hz_h|0]§!\n  Tornados: §Y[?FROM.mdr_hz_o|0]§!\n\n§HColores (el desastre más probable):§!\nVioleta: terremotos\nAzul oscuro: tsunamis\nCeleste: tormentas tropicales\nAzul: inundaciones\nRojo: incendios forestales\nNaranja: olas de calor y sequías\nVerde agua: tornados\nVerde apagado: poco riesgo\nCuanto más brillante el color, mayor el riesgo total. Los §YCentros de alerta temprana§! y los §YDiques§! reducen el daño."
 MAPMODE_MDR_SOIL_MAP_MODE: "Suelos cultivables"
 MAPMODE_MDR_SOIL_MAP_MODE_NAME: "Suelos cultivables"
 MAPMODE_MDR_SOIL_MAP_MODE_DESCRIPTION: "Muestra dónde se pueden construir Tierras de cultivo y qué tan fértil es el suelo."
 mdr_soil_map_mode_tooltip: "Suelo de [FROM.GetName]"
 mdr_soil_map_mode_tooltip_delayed: "§HColores:§!\nVerde oscuro: suelo muy fértil (§G+20%§! de granos): tierras negras, Pampas, Corn Belt, Punjab, norte de China.\nVerde: suelo cultivable normal.\nAmarillo: suelo pobre o seco (§R-30%§! de granos).\nMarrón: no se puede cultivar (desierto, tundra, pantano, selva cerrada o alta montaña).\n\nLas §YTierras de cultivo§! solo se construyen donde hay §YSuelo cultivable§!, hasta 10 niveles por estado."
 # Tierras raras: recurso, edificios, precio y shocks.
 rare_earths: "Tierras raras"
 rare_earths_desc: "Neodimio, disprosio, lantano y otros 14 elementos que la industria necesita para imanes, pantallas, láseres y guiado de misiles. Cada §YPlanta de microchips§! consume 1 unidad."
 PRODUCTION_MATERIALS_RARE_EARTHS: "Tierras raras"
 MDR_MARKET_PRICES_RARE_EARTHS: "$$ [?global.mdr_ree_price|2]"
 MDR_MARKET_PRICES_RARE_EARTHS_TT: "Información de precio de las §YTierras raras§!:\nIngreso actual: §G$$[?mdr_ree_income|3]§!\nPrecio mínimo: §G$$ 0.30/unidad§!\nPrecio máximo: §G$$ 5.00/unidad§!\nProducción mundial: §Y[?global.mdr_ree_supply|0]§!\nConsumo mundial: §Y[?global.mdr_ree_demand|0]§!\n\nEl precio empieza en §Y1.00§! y sube cuando el mundo consume más por cada unidad producida que al principio. Lo consumen las plantas de microchips y las líneas de producción con electrónica. Las cuotas de exportación de China y las guerras lo pueden multiplicar."
 mdr_rare_earth_complex: "Complejo de tierras raras"
 mdr_rare_earth_complex_plural: "Complejos de tierras raras"
 mdr_rare_earth_complex_desc: "Una mina con su planta de separación, donde el mineral se disuelve en ácido y se separa elemento por elemento.\n\nProporciona al estado:\n§YTierras raras§!: §G+6§! por nivel, multiplicado por la infraestructura y la red eléctrica del estado\nNúmero base de trabajadores requeridos: §Y6.8K§!\nProducto del PIB base: §Y$1B§!\nConsumo base de energía: §R-0.11§! GW\n\nEn cualquier estado, hasta 20 niveles. Cada nivel cuesta más que el anterior."
 mdr_shocks.7.t: "Se dispara el precio de las tierras raras"
 mdr_shocks.7.d: "Las tierras raras escasean y su precio se multiplica. Los fabricantes de microchips, imanes y armas buscan proveedores desesperados, y los países con yacimientos reabren minas que llevaban años cerradas.\n\n[mdr_shock_cause_text]"
 mdr_shocks.8.t: "Se hunde el precio de las tierras raras"
 mdr_shocks.8.d: "Sobran tierras raras y su precio cae. Las minas que no pueden competir con las chinas cierran o pierden dinero.\n\n[mdr_shock_cause_text]"
 MDR_SHOCK_CAUSE_19: "China impone cuotas a la exportación de tierras raras y deja de venderle a Japón tras un choque en las islas Senkaku."
 MDR_SHOCK_CAUSE_20: "China, que produce casi todas las tierras raras del mundo, está en guerra y corta sus exportaciones."
 MDR_SHOCK_CAUSE_21: "Pekín cierra las minas ilegales del sur y recorta las exportaciones para proteger sus reservas."
