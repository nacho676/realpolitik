 tajik_corruption.1.t: "Colección mensual de Mercancías de Mercado Negro"
 tajik_corruption.1.d: "Parece que estos meses los productos del mercado negro han hecho su camino a Dushanbe. Con funcionarios gubernamentales que intentan mantener la calma sobre el envío, muchos en nuestro gabinete están sugiriendo apaciguar algunas facciones internas dentro de nuestro estado utilizando estos bienes. ¿Cómo proceder con ellos?"
 tajik_corruption.1.a: "Recogerlos"
 tajik_corruption.1.b: "Dales a los militares"
 tajik_corruption.1.c: "Dales a los Oligarch."
 tajik_corruption.1.c1: "Dales a los Agricultores"
 tajik_corruption.1.d1: "Dales a los dueños de pequeñas empresas"
 tajik_corruption.1.e: "Dales a las industrias del combustible de Fossil"
 tajik_corruption.1.f: "Dáselos a los Sindicatos Laborales"
 tajik_corruption.1.g: "Darlos a los banqueros internacionales"
 tajik_corruption.1.h: "Dales a los Conglomerados Industriales"
 tajik_corruption.1.i: "Dáselos al MIO."
 tajik_corruption.1.j: "Dáselos al Ulema"
 tajik_corruption.1.k: "Dales a la Fuerza del Qud"
 tajik_corruption.1.l: "Dales a los Landowners"
 tajik_corruption.1.m: "Dales a la Comunidad de Inteligencia"
 tajik_corruption.1.n: "Dales a las Industrias Marítimas"
 tajik_corruption.2.t: "Influencia extranjera Penetrates Nuestro Estado"
 tajik_corruption.2.d: "Parece que el mercado negro ha abierto la puerta de entrada para que la influencia extranjera se suba a nuestro estado. Algunos ciudadanos se están quejando de un rumor idiota difundido por aquellos que propagaron la palabra desde la frontera sur."
 tajik_corruption.2.a: "Okay"
 tajik_corruption.3.t: "Panfletos islamistas"
 tajik_corruption.3.d: "El mercado negro ha abierto nuestra nación a las amenazas potenciales que plantean los islamistas en la región y en el extranjero, y parece que algunos panfletos han sido difundidos predicando la palabra."
 tajik_corruption.3.a: "Okay"
 tajik_corruption.4.t: "Esparcimiento de panfletos antigubernamentales"
 tajik_corruption.4.d: "Los panfletos que fueron difundidos por algún gobierno extranjero en el exterior parecen haber entrado a nuestra nación a través del mercado negro, y han estado causando cierta inestabilidad general alrededor de las zonas rurales, pero menos así en los centros urbanos."
 tajik_corruption.4.a: "Okay"
 tajik_corruption.5.t: "Medicamentos del extranjero Causa Adicción entre soldados"
 tajik_corruption.5.d: "Parece que las drogas de tat han llegado desde el mercado negro y hasta nuestros cuarteles de soldados, causando la adicción masiva en algunas unidades."
 tajik_corruption.5.a: "Okay"
 tajik_corruption.6.t: "Medicamentos de los centros urbanos del extranjero en la adicción"
 tajik_corruption.6.d: "Desafortunadamente, las drogas del mercado negro han encontrado su camino hacia nuestras casas de pueblos, y han estado causando adicción general en algunos barrios, reduciendo su disposición al trabajo."
 tajik_corruption.6.a: "Okay"
 tajik_corruption.7.t: "Ataque terrorista vinculado al mercado negro"
 tajik_corruption.7.d: "Los informes de un atentado terrorista en una de nuestras ciudades se han rastreado hasta una organización terrorista extranjera. Este grupo logró introducir a sus terroristas en nuestras ciudades a través del mercado negro sin que lo supiéramos."
 tajik_corruption.7.a: "Okay"
 tajik_corruption.8.t: "Dinero contrabandado del Tesoro Nacional"
 tajik_corruption.8.d: "Los informes indican que se ha tomado dinero del tesorería nacional, y traficado fuera de algún lugar a través del mercado negro. Si vamos a ser capaces de recuperar este dinero es desconocido, pero tenemos que mantener un ojo fuera"
 tajik_corruption.8.a: "Okay"
 tajik_corruption.9.t: "Oficiales del estado vendidos secretos estatales"
 tajik_corruption.9.d: "Algunos en nuestro gabinete están alegando que los individuos del gobierno están vendiendo secretos estatales a nuestros enemigos a través del mercado negro, potencialmente poniendo en riesgo el secreto nacional."
 tajik_corruption.9.a: "Okay"
 tajik_corruption.10.t: "Grupos de Interes Deshappy with Management"
 tajik_corruption.10.d: "Los grupos de interés dentro de la nación no están muy contentos con el estado actual de los asuntos, donde han declarado que el dinero que debería ir a ellos se está gastando en el mercado negro."
 tajik_corruption.10.a: "Okay"
 tajik_corruption.11.t: "Secretos de Estado Extranjeros contrabandados"
 tajik_corruption.11.d: "A través del mercado negro, hemos sido capaces de hacer contrabando en secretos estatales de estados más desarrollados. Esto nos permite avanzar considerablemente nuestro progreso científico."
 tajik_corruption.11.a: "Bien."
 tajik_corruption.12.t: "Misiles contrabandados de Black-Market"
 tajik_corruption.12.d: "Un camión grande, con una lona cada vez más grande se metió en una instalación del gobierno en Dushanbe hoy. Una vez que la cubierta fue derribada, se reveló un misil de un estado extranjero. Cómo nuestros hombres tienen sus manos en esto, todavía no lo sabemos, sin embargo ahora tenemos cohetes gigantes de metal para golpear a nuestros enemigos con."
 tajik_corruption.12.a: "Bien."
 tajik_corruption.13.t: "Oro contrabandeado en Dushanbe"
 tajik_corruption.13.d: "Los contrabandistas pudieron traer a Dushanbe un montón de oro sin ser detectados, lo que nos permite tener un poco de cojín en términos de superávit económico."
 tajik_corruption.13.a: "Bien."
 tajik_corruption.14.t: "Armas pesadas contrabandadas"
 tajik_corruption.14.d: "Artillería y misiles antitanque cruzaron nuestras fronteras de contrabandistas en otros estados. Esto nos permitirá equipar a nuestras tropas con armas pesadas muy necesarias."
 tajik_corruption.14.a: "Bien."
 tajik_corruption.15.t: "Extranjeros planos contrabandados"
 tajik_corruption.15.d: "Los planos extranjeros fueron contrabandeados en el estado a través del mercado negro, permitiéndonos mejorar el diseño de cada equipo diario con el que de otro modo sería menos eficiente."
 tajik_corruption.15.a: "Bien."
 tajik_corruption.16.t: "Doctrinas militares contrabandadas"
 tajik_corruption.16.d: "Fuimos capaces de contrabandear en las entregas de doctrinas militares extranjeras de alguna escuela de entrenamiento importante en Europa en algún lugar, permitiéndonos mejorar nuestras tácticas."
 tajik_corruption.16.a: "Bien."
 tajik_corruption.17.t: "Equipo de granja contrabandada"
 tajik_corruption.17.d: "Fuimos capaces de contrabandear en equipos agrícolas pesados industriales a través del mercado negro, que ahora nos permitirá construir finalmente una granja importante en algún lugar."
 tajik_corruption.17.a: "Construirlo"
 tajik_corruption.17.b: "Véndelo."
 tajik_corruption.18.t: "Oficial Handbook Smuggled"
 tajik_corruption.18.d: "Se ha contrabandeado un manual oficial de alguna potencia importante, que ahora se utilizará para mejorar la eficiencia de nuestros propios generales cuando se trata de combate, planificación o logística."
 tajik_corruption.18.a: "Bien."
 tajik_corruption.19.t: "Contraband peligroso parado"
 tajik_corruption.19.d: "Fuimos capaces de evitar que el contrabando peligroso fluya en la nación a través del mercado negro, potencialmente salvando cientos si no miles de vidas."
 tajik_corruption.19.a: "Bien."
 tajik_corruption.20.t: "Tayikistán libera drogas a los mercados rusos!"
 tajik_corruption.20.d: "El gobierno tayiko [TAJ.GetFlag] es sospechoso de permitir abiertamente que las drogas fluyan en nuestro país, como medio para ganar algo de ventaja sobre nosotros. Los informes indican que [TAJ.GetFlag] [TAJ.GetName] podría estar planeando aumentar gradualmente la cantidad de drogas que fluyen con el tiempo como una forma de hacer favores por ellos. Sin embargo, podríamos responder con la fuerza, lo que ello dará lugar a que Tayikistán se esconda detrás de otro poder importante para protegerlos."
 tajik_corruption.20.a: "¿Por qué?"
 tajik_corruption.21.t: "Tayikistán aumenta la cantidad de narcóticos que entran en Rusia"
 tajik_corruption.21.d: "El gobierno tayiko [TAJ.GetFlag] ha decidido que quiere aumentar la cantidad de narcóticos que estaban fluyendo desde el mercado negro. Se espera que este movimiento esté en previsión de una solicitud del gobierno tayiko, lo que significa que potencialmente quieren algo antes de que vuelvan a bajar la presión."
 tajik_corruption.21.a: "Okay"
 tajik_corruption.22.t: "Tayikistán aumenta la seguridad fronteriza"
 tajik_corruption.22.d: "El gobierno tayiko ha jurado que ahora restringirá fuertemente el flujo de drogas hacia la asia central, y luego hacia nuestro propio país. Esto nos permite finalmente respirar, sabiendo que no tenemos que preocuparnos por Tayikistán usando el narco-trade como una tarjeta salvaje."
 tajik_corruption.22.a: "Bien."
 tajik_corruption.23.t: "Tayikistán Hints at an increases in Drug Flow"
 tajik_corruption.23.d: "El gobierno tayiko está insinuando reducir su control fronterizo, lo que implica que permitirá que más drogas fluyan hacia Rusia. Esta es una declaración peligrosa que viene de una acción peligrosa. Es muy probable que Tayikistán haga esto como una manera de pedirnos beneficios para su propio gobierno que vendrá a nuestro propio costo."
 tajik_corruption.23.a: "Fine"
 tajik_corruption.23.b: "No, no ahora"
 tajik_corruption.23.c: "Si hacen esto una vez más y verán lo que sucede."
 tajik_corruption.23.c1: "That's it"
 tajik_corruption.24.t: "Rusia Grants Economic Support"
 tajik_corruption.24.d: "El Gobierno ruso ha acordado otorgarnos más apoyo económico, compartir conocimientos para que nuestros propios procesos sean más eficientes y rentables."
 tajik_corruption.24.a: "Genial."
 tajik_corruption.25.t: "Rusia rechaza la ayuda económica"
 tajik_corruption.25.d: "El gobierno ruso se ha negado a concedernos apoyo económico, lo que sugiere que no los hemos presionado casi lo suficiente."
 tajik_corruption.25.a: "¿Han hecho qué ahora?"
 tajik_corruption.26.t: "Russia Problemas Advertencia"
 tajik_corruption.26.d: "El gobierno ruso ha emitido una advertencia: O dejamos de enviar más drogas, o tomarán «acción decisiva» para asegurarnos de que no lo hagamos de nuevo."
 tajik_corruption.26.a: "Worrying"
 tajik_corruption.27.t: "Rusia prepara la invasión"
 tajik_corruption.27.d: "Aparentemente el gobierno ruso ha tenido suficiente, y han emitido un llamado oficial de movilización para el ejército ruso con el fin de invadir nuestro suelo."
 tajik_corruption.27.a: "Esto no puede ser bueno."
 tajik_corruption.28.t: "Rusia emite un Ultimatum"
 tajik_corruption.28.d: "El gobierno ruso nos ha dado un plazo, en el que debemos aumentar nuestra seguridad fronteriza para que no más drogas fluyan hacia territorio ruso."
 tajik_corruption.28.a: "Worrying"
 tajik_corruption.29.t: "Tayikistán se esfuerza por cumplir"
 tajik_corruption.29.d: "Tayikistán no ha cumplido con nuestros términos que les hemos dado, y ahora pronto pagarán las consecuencias, si así lo decidimos."
 tajik_corruption.29.a: "Se acabó para ellos."
 tajik_corruption.29.b: "No nos importa."
 tajik_flavor.1.t: "[TAJ.GetLeader] Descontento con sandías"
 tajik_flavor.1.d: "[TAJ.GetLeader], conocido por su atención al detalle en todos los asuntos de estado, fue visto recientemente mirando las sandías en Tayikistán con más escrutinio de lo habitual. Después de tomar un bocado en un bazar local, según se informa murmuró, «¿Primero, se encogieron mis fronteras, y ahora se encogen mis melones?» Fuentes dicen que inmediatamente ordenó una comisión para investigar esta «crisis de sandía», lamentando que si los melones de Tayikistán no pueden ser perfectos, ¿qué esperanza tiene el mundo?"
 tajik_flavor.1.a: "Señor ten piedad."
 tajik_flavor.2.t: "Grupos unidos de oposición tayika"
 tajik_flavor.2.d: "La OTU, también conocida como la Oposición Tayika Unida emprendió una guerra civil contra Emomali Rahmonov y su gobierno tras la independencia de Tayikistán en los años 90. Sus políticas, y el despido de varias promesas clave de negociación han enojado a la OTU y es una membresía central, causando que se reagrupen y exijan la renuncia de Emomali Rahmonov y su gabinete. Los rumores están circulando que si el grupo pisa cuidadosamente, pueden arriesgar otra guerra civil dentro de la nación en comparación con su objetivo previsto de una revolución pacífica."
 tajik_flavor.2.a: "Interesting"
 tajik_radicalism.1.t: "Partido Renacimiento Islámico Exige nuestra Resignación"
 tajik_radicalism.1.d: "Líderes del Partido Renacimiento Islámico han escrito una carta formal exigiendo a nuestros gobiernos la renuncia, y la transferencia de poder a «instituciones justas». En su carta, declararon que están armados y listos, y en un momento notan que pueden movilizar a un ejército para derrocar nuestro estado. Cómo debemos acercarnos a estos radicales depende del gobierno central ahora.."
 tajik_radicalism.1.a: "Tal vez sea el momento.."
 tajik_radicalism.1.b: "¡Es hora de poner esos radicales en su lugar!"
 tajik_radicalism.2.t: "Madrasas subterráneas comienzan a aparecer"
 tajik_radicalism.2.d: "Rumores of secret underground madrasas have been circulating in government circles, y muchos debates han surgido sobre cómo debemos tratar con ellos yendo hacia adelante"
 tajik_radicalism.2.a: "¡Apágalos!"
 tajik_radicalism.2.b: "No son una amenaza."
 tajik_radicalism.3.t: "El Sermón Religioso se vuelve político"
 tajik_radicalism.3.d: "Recientemente la oración del viernes se ha vuelto cada vez más política, con líderes religiosos hablando sobre el estado de la nación, retratando a nuestro gobierno como corrupto e incapaz de administrar la nación."
 tajik_radicalism.3.a: "Arréstenlos."
 tajik_radicalism.3.b: "No son una amenaza."
 tajik_radicalism.4.t: "Caridades Moscas Ampliar"
 tajik_radicalism.4.d: "Las mezquitas han tenido benéficas desde hace mucho tiempo, pero recientemente han ido ampliando sus redes y han estado recibiendo fondos de individuos desconocidos."
 tajik_radicalism.4.a: "El dinero es propiedad estatal justa"
 tajik_radicalism.4.b: "No son una amenaza."
 tajik_radicalism.5.t: "Círculos religiosos secretos"
 tajik_radicalism.5.d: "Recientemente se han empezado a formar círculos religiosos secretos, donde los individuos asistirían y discutirían asuntos religiosos. Dentro de estos círculos, ha habido rumores de que algunos hablan negativamente del gobierno."
 tajik_radicalism.5.a: "Investigaciones de lanzamiento"
 tajik_radicalism.5.b: "No son una amenaza."
 tajik_radicalism.6.t: "Confrontaciones con el personal militar cerca de las mezquitas"
 tajik_radicalism.6.d: "Ha habido un aumento de personal militar siendo hostigado cerca de mezquitas, donde los fanáticos religiosos atacarían a nuestras tropas lanzando piedras o escupiendo sobre ellas."
 tajik_radicalism.6.a: "Dile al personal que sea más cauteloso"
 tajik_radicalism.6.b: "Pueden defenderse por sí mismos."
 tajik_radicalism.7.t: "Actualización en ataques contra la policía"
 tajik_radicalism.7.d: "Locales desobedientes y poco responsables han estado atacando a la policía e invadiendo ciertas comisarías de policía, provocando bajas en todo el país. La situación se ha salido de la mano, y sólo seguirá empeorando."
 tajik_radicalism.7.a: "Reforzar a la policía"
 tajik_radicalism.7.b: "Pueden defenderse por sí mismos."
 tajik_radicalism.8.t: "Los locales resisten a las patrullas gubernamentales"
 tajik_radicalism.8.d: "En la zona del país, cada vez más locales han comenzado a resistir las patrullas policiales poniendo grandes rocas en el camino de los vehículos. Algunos afirman que esto es un signo de debilidad en nombre del gobierno, y que el Estado está perdiendo su control sobre la población."
 tajik_radicalism.8.a: "La propaganda estatal resolverá todo esto"
 tajik_radicalism.8.b: "Anda por las rocas."
 tajik_radicalism.9.t: "Uptick en los tayikos radicales que regresan desde el extranjero"
 tajik_radicalism.9.d: "Ha habido un aumento inusual en los tayikos radicalizados que regresan del extranjero, y ha habido temores en los círculos gubernamentales de que estos individuos propagarían su peligrosa ideología."
 tajik_radicalism.9.a: "Devuélvelos, no los queremos."
 tajik_radicalism.9.b: "No son una amenaza."
 tajik_radicalism.10.t: "Convoy de Gobierno Ambushed"
 tajik_radicalism.10.d: "Informes indican que un convoy gubernamental fue emboscado en una aldea remota por militantes armados de una organización vinculada al Partido Renacimiento Islámico."
 tajik_radicalism.10.a: "Reforzarlos"
 tajik_radicalism.10.b: "Retrocede."
 tajik_radicalism.11.t: "Base militar atacada"
 tajik_radicalism.11.d: "Según informes, una base militar fue atacada recientemente por fanáticos en una zona remota cerca de la frontera sur. Algunos indican que los militantes podrían estar vinculados al Partido Renacimiento Islámico."
 tajik_radicalism.11.a: "Enviar refuerzos"
 tajik_radicalism.11.b: "Retrocede."
 tajik_radicalism.12.t: "Ataque terrorista en Rusia"
 tajik_radicalism.12.d: "Los medios de comunicación estatales rusos informan que los militantes tayikos han atacado recientemente la infraestructura urbana y causado daños considerables a las zonas circundantes. El gobierno ruso exige reparaciones tanto para las víctimas como para la infraestructura urbana dañada."
 tajik_radicalism.12.a: "Pagaremos por los daños"
 tajik_radicalism.12.b: "No es mi problema."
 tajik_radicalism.120.t: "Atentado terrorista vinculado a nacionales tayikos"
 tajik_radicalism.120.d: "El gobierno de Tajik se ha disculpado recientemente y pagado por los daños causados por un ataque perpetrado en suelo ruso por un nacional tayiko. El ataque dañó la infraestructura de la ciudad, y reclamó algunas vidas, sin embargo el gobierno tayiko se ha ofrecido a pagar los daños y las víctimas."
 tajik_radicalism.120.a: "Okay"
 tajik_radicalism.121.t: "Atentados terroristas vinculados a nacionales tayikos"
 tajik_radicalism.121.d: "Los medios de comunicación estatales informan de que los terroristas sospechosos de ser nacionales tayikos han causado algunos daños en una de nuestras ciudades, causando algunas bajas. El gobierno tayiko se ha negado a pagar por cualquiera de los daños, pero han afirmado que «nuestros corazones van a las víctimas»."
 tajik_radicalism.121.a: "Un día triste para nuestra nación.."
 tajik_radicalism.14.t: "Peligrosos Ideas se propagan en Bazaares"
 tajik_radicalism.14.d: "En ciertos bazares a través de la nación algunos individuos han comenzado a denunciar al gobierno, y nuestras leyes a través de altavoz. Esto ha causado cierto temor dentro del gobierno central, ya que estas personas a menudo atraen considerables multitudes."
 tajik_radicalism.14.a: "¡Cierren temporalmente esos bazares!"
 tajik_radicalism.14.b: "No son una amenaza."
 tajik_radicalism.15.t: "Un nuevo movimiento comienza a formar"
 tajik_radicalism.15.d: "Desde que el IRP fue removido de la vida política por el gobierno central en Tayikistán, algunos miembros de la organización y simpatizantes para el movimiento han comenzado a reunirse alrededor de una nueva bandera y grupo. Ellos van por el Estado Islámico en Khorasan, y han prometido derrocar a nuestro gobierno, y otros en la región. Esto significa que la organización tiene ambiciones que ponen a Tayikistán, Afganistán, Irán y otras naciones en la región dentro de su cruce."
 tajik_radicalism.15.a: "¡Los aplastaremos!"
 tajik_radicalism.16.t: "Estado Islámico en Khorasan lanza grandes ataques de escala!"
 tajik_radicalism.16.d: "IS-KP ha anunciado la creación de su califato en el norte de la nación, en la provincia de Sughd. Afirman que 'topple' el régimen 'heretical' y 'anti-islamic' de [TAJ.GetLeader]. Nuestros intentos fallidos de suprimir la ideología y el pensamiento salafista han culminado en este evento, donde ahora nuestros soldados están movilizados para lanzar un ataque contra los radicales que amenazan nuestra propia existencia ahora."
 tajik_radicalism.16.a: "Preparen las tropas"
 tajik_radicalism.16.b: "Ha llegado el momento."
 iranic_confederation.1.t: "[FROM.GetName] Nos invita a la Confederación Iraní"
 iranic_confederation.1.d: "[FROM.GetName] ha enviado recientemente una delegación a nuestro gobierno, proponiendo una Confederación Iraní entre nuestros estados citando similitudes ideológicas. La delegación también dijo que deseaban invitar a otras naciones iraníes a la confederación, y el líder de la confederación se decidiría mediante un voto colectivo."
 iranic_confederation.1.a: "Nos uniremos"
 iranic_confederation.1.b: "Rechazamos esta amenaza a nuestra independencia!"
 iranic_confederation.2.t: "[FROM.GetName] Firma el Acuerdo"
 iranic_confederation.2.d: "Delegados de [FROM.GetName] estaban más que contentos de firmar nuestro acuerdo con respecto a la Confederación Iraní, y con una firme promesa de apretón de manos sobre cooperación futura fueron presentadas."
 iranic_confederation.2.a: "Genial."
 iranic_confederation.3.t: "[FROM.GetName] Rechaza nuestro Acuerdo"
 iranic_confederation.3.d: "Los delegados de [FROM.GetName] han enviado a nuestros diplomáticos, citando que los motivos ideológicos no justifican la unificación de nuestros estados. También declararon que nuestros pueblos son 'Vastly Diferentes' y tal integración cultural conduciría al caos social."
 iranic_confederation.3.a: "Nuestra unificación llegará un día..."
 iranic_confederation.4.t: "Líder de la Confederación"
 iranic_confederation.4.d: "Ha llegado el momento de que todos los estados miembros de la Confederación Iraní voten finalmente sobre un líder para reunirse. Al seleccionar a un líder, todos los estados miembros comenzarán a integrar sus ejércitos, economías y leyes para ajustarse al de la Confederación Líder."
 iranic_confederation.4.a: "Iran"
 iranic_confederation.4.b: "Afghanistan"
 iranic_confederation.4.c: "Tajikistan"
 iranic_confederation.4.e: "Kurdistan"
 iranic_confederation.4.f: "Osetia del Sur"
 iranic_confederation.5.t: "Resultados para la elección de líder de la Confederación"
 iranic_confederation.5.d: "Ha llegado el momento de revelar al líder de la confederación. Después de una semana de votación, todos los estados nación han emitido sus votos y los resultados concluyeron que el ganador es..."
 iranic_confederation.5.a: "Iran"
 iranic_confederation.5.b: "Afghanistan"
 iranic_confederation.5.c: "Tajikistan"
 iranic_confederation.5.e: "Kurdistan"
 iranic_confederation.5.f: "Osetia del Sur"
 iranic_confederation.6.t: "Centralización de la Confederación"
 iranic_confederation.6.d: "El líder de la Confederación ha anunciado la integración de las leyes y la sociedad, junto con la legalización del libre viaje para todos los ciudadanos de la Confederación entre Estados miembros."
 iranic_confederation.6.a: "Okay"
 iranic_confederation.7.t: "Líder de la Confederación anuncia una unificación total"
 iranic_confederation.7.d: "El Líder de la Confederación, [FROM.GetName] ha anunciado que todos los Estados miembros de la Confederación Iraní volarán ahora a [FROM.capital.GetCapitalVictoryPointName] y se sumarán al «Consejo Supremo de las Naciones Iraníes»."
 iranic_confederation.7.a: "¡Por un futuro más fuerte!"
 iranic_confederation.8.t: "Instituciones internacionales encomiendan la cooperación iraní"
 iranic_confederation.8.d: "Instituciones internacionales como las Naciones Unidas han elogiado nuestra capacidad de dejar a un lado nuestras diferencias entre naciones, y unificar bajo una bandera sin conflicto."
 iranic_confederation.8.a: "¡Genial!"
 iranic_confederation.9.t: "¿La reubicación de la capital?"
 iranic_confederation.9.d: "Tras la unificación de nuestras naciones, el Consejo Supremo de las Naciones Iraníes ha planteado una posible propuesta que trasladaría a la capital de las naciones a un lugar más central para facilitar el acceso de todos los ciudadanos del estado."
 iranic_confederation.9.a: "Muévete a Esfahan."
 iranic_confederation.9.b: "Muévete a Herat"
 iranic_confederation.9.c: "Guárdalo donde está"
 iranic_confederation.10.t: "[FROM.GetName] Amenaza la acción militar"
 iranic_confederation.10.d: "[FROM.GetName] ha amenazado a nuestro gobierno con la acción militar si no renunciamos inmediatamente a nuestras posesiones en la región de Baluchistán. Su gobierno ha prometido utilizar toda la fuerza a su disposición para tomar la tierra que tanto quieren."
 iranic_confederation.10.a: "Llama a su compañero."
 iranic_confederation.10.b: "Bien, comiencen las negociaciones."
 iranic_confederation.11.t: "[FROM.GetName] Reflexiones Nuestras Demandas"
 iranic_confederation.11.d: "[FROM.GetName] ha declarado que bajo ninguna circunstancia dejarán ir de la región balocistana, lo que significa que tendremos que recurrir a la fuerza para recuperar nuestras tierras legítimas."
 iranic_confederation.11.a: "Movilizar a las tropas"
 iranic_confederation.12.t: "[FROM.GetName] Conviene en iniciar negociaciones"
 iranic_confederation.12.d: "[FROM.GetName] ha acordado reconocer nuestra justa reivindicación a Baluchistán, y ha acordado transferir los puestos gubernamentales en la región por nuestra cuenta."
 iranic_confederation.12.a: "Bien."
 iranic_confederation.15.t: "[FROM.GetName] Amenaza la acción militar"
 iranic_confederation.15.d: "[FROM.GetName] ha amenazado a nuestro gobierno con acción militar si no renunciamos inmediatamente a nuestras acciones en la región del Kurdistán. Su gobierno ha prometido utilizar toda la fuerza a su disposición para tomar la tierra que tanto quieren."
 iranic_confederation.15.a: "Llama a su compañero."
 iranic_confederation.15.b: "Bien, comiencen las negociaciones."
 iranic_confederation.16.t: "[FROM.GetName] Reflexiones Nuestras Demandas"
 iranic_confederation.16.d: "[FROM.GetName] ha declarado que bajo ninguna circunstancia dejarán ir de la región del Kurdistán, lo que significa que tendremos que recurrir a la fuerza para recuperar nuestras tierras legítimas."
 iranic_confederation.16.a: "Movilizar a las tropas"
 iranic_confederation.17.t: "[FROM.GetName] Conviene en iniciar negociaciones"
 iranic_confederation.17.d: "[FROM.GetName] ha acordado reconocer nuestra reivindicación legítima a la región del Kurdistán, y ha convenido en transferir los puestos gubernamentales de la región por nuestra cuenta."
 iranic_confederation.17.a: "Bien."
 iranic_confederation.18.t: "[FROM.GetName] Exige nuestra cooperación"
 iranic_confederation.18.d: "El recién establecido [FROM.GetName] exige la cooperación de nuestros gobiernos en «Establecer un nuevo estado, unificado y poder» en la región. Esto significaría la renuncia de nuestro gabinete, y el traslado del gobierno a sus autoridades."
 iranic_confederation.18.a: "No"
 iranic_confederation.18.b: "No tenemos elección.."
 iranic_confederation.19.t: "[FROM.GetName] Rechaza nuestra propuesta"
 iranic_confederation.19.d: "Parece que el gobierno en [FROM.GetName] claramente no valora la paz y la estabilidad sobre la ambición personal, y debemos llevarlos bajo nuestro ala por la fuerza."
 iranic_confederation.19.a: "Movilizar a las tropas"
 iranic_confederation.20.t: "[FROM.GetName] Transfiere el Poder a nuestras Autoridades"
 iranic_confederation.20.d: "[FROM.GetName] ha acordado transferir sus puestos de gobierno a las autoridades y partidos paniristas recientemente establecidos en la nación, poniendo claramente la paz y la estabilidad por encima de la ambición personal."
 iranic_confederation.20.a: "Genial."
 tajik_focus.1.t: "El Código de Vestido"
 tajik_focus.1.d: "Nuestra nación ha tenido una historia de estrictos códigos de vestimenta, dictando lo que hombres y mujeres pueden o no pueden usar. Nuestro gobierno ha estado considerando cambiar algunas de estas regulaciones para que al final del día, nosotros somos los que se benefician. Sin embargo, algunas personas en áreas más conservadoras están amenazando con empaquetar sus bolsas y migrar a otros países si cambiamos las leyes."
 tajik_focus.1.a: "La liberalización de la ley es necesaria"
 tajik_focus.1.b: "¡Aprieta las regulaciones!"
 tajik_focus.2.t: "Tayikistán nos invita al Pacto de TAJ"
 tajik_focus.2.d: "El pacto TAJ, o el Pacto Conjunto Teherán-Afshar es una alianza militar que el gobierno tayiko nos invita a unirse y emprender un viaje de seguridad regional y estabilidad."
 tajik_focus.2.b: "Nos uniremos"
 tajik_focus.2.a: "No"
 tajik_focus.3.t: "[FROM.GetName] Rechaza nuestra invitación"
 tajik_focus.3.d: "El Gobierno [FROM.GetAdjective] ha decidido que es mejor que su nación se mantenga fuera del Pacto TAJ, ya que sienten que no hay necesidad real de abandonar lo que tienen actualmente."
 tajik_focus.3.a: "Okay"
 tajik_focus.4.t: "The Tajik Government Solicita Inversiones"
 tajik_focus.4.d: "El nuevo gobierno en Tayikistán está tratando de construir relaciones mayores con nosotros y otras naciones del Golfo como medio para abrirse al mundo. Quieren mejorar su economía a través de nuestra ayuda."
 tajik_focus.4.a: "Okay"
 tajik_focus.4.b: "No"
 tajik_focus.5.t: "[FROM.GetName] Elija invertir"
 tajik_focus.5.d: "El gobierno en [FROM.GetName] ha elegido invertir en nuestra nación, ayudando a nuestra economía a mejorar a través de su experiencia económica."
 tajik_focus.5.a: "¡Genial!"
 tajik_focus.6.t: "[FROM.GetName] Rechaza las inversiones"
 tajik_focus.6.d: "[FROM.GetName] se ha negado a invertir en nuestro gobierno, y ha citado que no podemos confiar en proteger sus inversiones."
 tajik_focus.6.a: "Unfortunate"
 tajik_focus.7.t: "Tayikistán solicita asistencia médica"
 tajik_focus.7.d: "El gobierno tayiko ha llegado a nuestro gobierno solicitando asistencia médica para su líder moribundo, [TAJ.GetLeader]. Afirman que somos la única nación que podría hacer cualquier cosa para salvar a su líder enfermo, debido a nuestra tecnología avanzada en el campo médico."
 tajik_focus.7.a: "Okay"
 tajik_focus.7.b: "No"
 tajik_focus.8.t: "[FROM.GetName] Envía personal médico"
 tajik_focus.8.d: "El personal médico ha sido enviado por el gobierno [USA.GetAdjective] y actualmente están tratando [TAJ.GetLeader] para mejorar su condición. Están declarando que está en camino a la recuperación."
 tajik_focus.8.a: "Genial."
 tajik_focus.9.t: "[FROM.GetName] Rehabilitación para la emisión de ayuda médica"
 tajik_focus.9.d: "El gobierno [FROM.GetAdjective] se ha negado a enviar personal médico para tratar a nuestro líder enfermo, mostrando que su egoísmo y codicia no conoce límites."
 tajik_focus.9.a: "Las duras realidades del mundo..."
 tajik_focus.10.t: "Nuri Is Dead!"
 tajik_focus.10.d: "Esta mañana, nuestro líder, Sayid Abdulloh Nuri, se anunció que había fallecido de complicaciones médicas como resultado de su cáncer. Muchos se preguntan quién es el próximo líder, sin embargo, Nuri ya había designado a Muhiddin Kabiri como su sucesor."
 tajik_focus.10.a: "We mourn"
 tajik_focus.11.t: "Tayikistán pide el Eje de la Resistencia"
 tajik_focus.11.d: "El gobierno tayiko ha decidido que quiere alinearse con el lado derecho de la historia. Han elegido tomar el manto de la resistencia contra las fuerzas imperialistas y los enemigos de nuestro estado."
 tajik_focus.11.a: "Welcome in"
 tajik_focus.11.b: "Nunca."
 tajik_focus.12.t: "Tayikistán nos invita a la Asociación de Seguridad del Asia Central"
 tajik_focus.12.d: "El gobierno tayiko nos ha invitado a la Asociación de Seguridad del Asia Central, un nuevo pacto de seguridad que asegura que la región no erupcione en ninguna forma de caos o conflicto."
 tajik_focus.12.a: "Okay"
 tajik_focus.12.b: "Una idea terrible"
 tajik_focus.14.t: "[FROM.GetName] ¡Firma el Pacto!"
 tajik_focus.14.d: "El gobierno de [FROM.GetName] ha decidido que realmente quiere paz y estabilidad en nuestra región, han decidido firmar nuestro pacto."
 tajik_focus.14.a: "¡Genial!"
 tajik_focus.15.t: "[FROM.GetName] ¡Rehusa firmar el Pacto!"
 tajik_focus.15.d: "[FROM.GetName] se ha negado a firmar nuestro pacto, insinuando que pueden mirar a nuestro gobierno con sospecha, o tal vez incluso envidia."
 tajik_focus.15.a: "Worrying"
 tajik_focus.16.t: "The Tajik Government Wants to Strengthening Ties"
 tajik_focus.16.d: "El nuevo gobierno de Tayikistán está solicitando que fortalezcamos formalmente nuestros lazos, y una manera de hacerlo, es invirtiendo en su economía. El gobierno tayiko difiere mucho de nosotros ideológicamente, sin embargo, su política exterior parece favorecer la diplomacia pro-occidental a pesar de su ideología, que los aleja de la esfera rusa de influencia."
 tajik_focus.16.a: "Absolutely"
 tajik_focus.16.b: "No"
 tajik_focus.17.t: "¡Cooperación del Gobierno de Estados Unidos!"
 tajik_focus.17.d: "El gobierno americano ha venido con pleno apoyo de nuestro gobierno y nuestro derecho a la autodeterminación y al crecimiento. Han ofrecido diversas opciones de inversión, desde políticas hasta económicas, hasta incluso militares."
 tajik_focus.17.a: "Industrial"
 tajik_focus.17.b: "Económico"
 tajik_focus.17.c: "Política"
 tajik_focus.18.t: "Gobierno americano se niega a cooperar"
 tajik_focus.18.d: "Parece que las viejas líneas ideológicas aún dividen al gobierno americano de reconocernos como amigos suyos."
 tajik_focus.18.a: "Muy desafortunado"
 tajik_focus.19.t: "¿Cambios en nuestras vistas?"
 tajik_focus.19.d: "Se ha hablado mucho de nuestra fiesta y es perspectiva. Muchos siguen siendo muy duros presionados sobre el comunismo completo, y la alineación oriental. Sin embargo, muchos más están argumentando que debemos mirar hacia una visión mundial más no alineada, como resultado de cientos de años de explotación colonial e imperialista de nuestra nación y pueblo."
 tajik_focus.19.a: "Debemos cambiar nuestros caminos."
 tajik_focus.19.b: "¡No! El cambio traerá nuestra desaparición"
 tajik_focus.20.t: "Tayikistán persigue la nacionalización agresiva"
 tajik_focus.20.d: "El gobierno tayiko ha aplicado una política agresiva de nacionalización, confiscando la mayoría de los activos extranjeros (incluidos los nuestros), y reclamando como propiedad gubernamental. Aunque no todo ha sido confiscado, muchos de nuestros trabajadores extranjeros ahora están obligados a regresar como resultado de perder todo."
 tajik_focus.20.a: "No te preocupes."
 tajik_focus.20.b: "¡Sancionarlos!"
 tajik_focus.21.t: "[FROM.GetName] Ordena un Embargo!"
 tajik_focus.21.d: "El gobierno en [FROM.GetName] ha ordenado que se ponga un embargo sobre nuestra nación, cortando todos los vínculos económicos con nosotros. Han declarado que nuestra «incautación ilegal» de sus bienes es una de las causas principales."
 tajik_focus.21.a: "Unfortunate"
 tajik_focus.22.t: "Tayikistán ve la reconciliación"
 tajik_focus.22.d: "El gobierno tayiko ha venido y contactado con nuestro gobierno, buscando mejores lazos y reconciliación."
 tajik_focus.22.a: "No"
 tajik_focus.22.b: "Okay"
 tajik_focus.23.t: "[FROM.GetName] Ignores Us"
 tajik_focus.23.d: "El gobierno talibán ha decidido que quiere ignorar nuestras solicitudes de garantías de paz y seguridad."
 tajik_focus.23.a: "Oh no, anyway"
 tajik_focus.24.t: "El Secretario"
 tajik_focus.24.d: "El secretario de nuestro partido es un papel importante que no debe ser entregado a nadie en el partido. Debemos asignar cuidadosamente al secretario a alguien que consideremos competente y apropiado para gobernar la nación y llevarlo a la gloria."
 tajik_focus.24.a: "Shodi se ha demostrado"
 tajik_focus.24.b: "Assign Abdulloyev"
 tajik_focus.24.c: "Appoint Talbakov"
 tajik_focus.25.t: "OTO Liderazgo"
 tajik_focus.25.d: "Para que la Oposición Tayika Unida prospere una vez más, debemos estar unidos en nuestro llamado a una figura líder contra el régimen opresivo. Si no nos unimos, entonces nos desmoronaremos."
 tajik_focus.25.a: "El IRP nos guiará hacia adelante"
 tajik_focus.25.b: "El Partido Demócrata asegurará la victoria"
 tajik_focus.25.c: "Necesitamos hombres experimentados, ¡llamen a los comunistas!"
 tajik_focus.26.t: "Un asalto al Palacio"
 tajik_focus.26.d: "El palacio de Rahmonov ha sido un punto de contención para la lucha contra la libertad de su opresión. Durante semanas, la OTU ha estado debatiendo si lanzar o no un ataque total contra el palacio en una puja para sacar a Rahmonov. Si ya no está a cargo, entonces el gobierno central colapsaría por sí mismo."
 tajik_focus.26.a: "¡Hallará el palacio!"
 tajik_focus.26.b: "Envíe divisiones blindadas"
 tajik_focus.26.c: "Mano-pick los mejores hombres que tenemos"
 tajik_focus.27.t: "Rahmonov Flees"
 tajik_focus.27.d: "Rahmonov fue capaz de escapar de nuestros recientes ataques en su palacio, y se dice que han sido contrabandeados en un avión privado y volado a Moscú antes de hoy."
 tajik_focus.27.a: "Coward"
 tajik_focus.28.t: "Rahmonov mató"
 tajik_focus.28.d: "Hoy, Rustam Emomali, hijo de Rahmonovs salió y dirigió a la nación en un discurso televisado. 'Mi padre... que con sus manos desnudas creó esta nación, quiere muerto por traidores'. Su discurso marcó el fin de una era, la época de Rahmonov y su dictadura oligárquica. La lucha aún no ha sido ganada, pero esto marca una gran victoria."
 tajik_focus.28.a: "¡Viva la revolución!"
 tajik_focus.29.t: "La revolución tayika"
 tajik_focus.29.d: "Ha llegado el momento de superar al régimen, y esta vez seguiremos con nuestras promesas hasta el final. Lucharemos hasta el final, incluso si significa que cada uno de nuestros hombres muere en el campo de batalla. ¡No podemos dejar que los ladrones de Emomali gobiernan nuestra gran nación, lucharemos por nuestro futuro!"
 tajik_focus.29.a: "Onwards!"
 tajik_focus.30.t: "¡Victoria en la revolución!"
 tajik_focus.30.d: "Nuestras tropas han marchado victoriosamente por las ciudades de la nación. Declarando la victoria, y levantando la bandera de la libertad en cada calle, tienda, casa y oficina. Nuestra victoria ha enviado ondas de choque por toda la región, y es una muestra severa de fuerza a todos los autócratas corruptos que todavía gobiernan la región que su tiempo puede ser levantado también."
 tajik_focus.30.a: "¡Viva la revolución!"
 tajik_focus.280.t: "Demandas de la OTU"
 tajik_focus.280.d: "Durante la guerra civil, elegimos hacer concesiones a la OTU para obtener más asistencia durante la guerra civil. Ahora han llegado directamente a la oficina de [TAJ.GetLeader] exigiendo que sus necesidades sean satisfechas. Tendremos cierto tiempo para satisfacer sus demandas antes de que causen problemas."
 tajik_focus.280.a: "Okay"
 tajik_focus.281.t: "El CSTO"
 tajik_focus.281.d: "Después de la guerra civil, nos expulsaron de la alianza CSTO. Desde entonces, algunos de nuestro gobierno han estado sugiriendo que nos reunamos a la alianza. ¿Deberíamos hacerlo?"
 tajik_focus.281.a: "Es en nuestro mejor interés"
 tajik_focus.281.b: "No, interfiere con nuestros objetivos"
 tajik_focus.282.t: "Fin de las ambiciones yihadistas"
 tajik_focus.282.d: "Tras años de lucha contra el extremismo y el islamismo, finalmente hemos tenido éxito en nuestra propuesta de expulsar estas ideas extranjeras de nuestra nación. El tiempo ha llegado para la recuperación, finalmente podemos descansar sabiendo que nadie dentro de nuestra nación está tratando de traernos de vuelta a las eras de piedra."
 tajik_focus.282.a: "Buen trabajo, [TAJ.GetLeader]"
 tajik_focus.283.t: "Inicio del conflicto Tajik-[KYR.GetAdjective]"
 tajik_focus.283.d: "El gobierno tayiko ha emitido una orden para que sus unidades preparen la ocupación de las ciudades fronterizas en [KYR.GetName]. Esto está suscitando cierta preocupación en el mundo, ya que algunos temen que este conflicto pueda salir de control."
 tajik_focus.283.a: "Veamos qué pasa."
 tajik_focus.31.t: "Comer nuestro propio"
 tajik_focus.31.d: "Nuestro gobierno es capaz de utilizar los oligarcas que se han arraigado en el sistema para concedernos beneficios que de otro modo habrían sido inaccesibles. Podemos usar sectores corruptos del gobierno para pagarnos lo que deben. Estos ricos tayikos se llaman 'New-Tajiks' y apenas nunca hablan públicamente de su riqueza. Podemos averiguar alguna información para cada una de estas personas para justificar sus arrestos y posteriores incautaciones de activos."
 tajik_focus.31.a: "La riqueza de Hoji-Akbar Turajonzoda"
 tajik_focus.31.b: "La riqueza de Bobojon Bobokhonov"
 tajik_focus.31.c: "Riqueza de Ghaffor Mirzoev"
 tajik_focus.31.d1: "¡No necesitamos su dinero!"
 tajik_focus.32.t: "Guías de Mano Fuerte Tayikistán."
 tajik_focus.32.d: "Con el estrago creado por la guerra civil tayika tras el colapso de la URSS, [TAJ.GetLeader] fue catapultado en el liderazgo en 1992, convirtiéndose en presidente del Soviet Supremo. En 1997 había negociado la paz, terminando años de conflicto. Ahora firmemente en control, Rahmon debe alinear a la oposición y cementar su regla para controlar su futuro."
 tajik_focus.32.a: "Intresting"
 tajik_focus.33.t: "Paz de la mente y cómo llegar allí..."
 tajik_focus.33.d: "Rahmon necesita tener algo que refrescarse de todo el estrés. Tendremos que sacarlo de compras y una comida posiblemente incluso..."
 tajik_focus.33.a: "Moscow Hosting"
 tajik_focus.33.b: "Cocinar nuestra propia comida"
 tajik_focus.34.t: "Comiencen las Grandes Bannings"
 tajik_focus.35.t: "Solicitudes de Tayikistán Captured American Weaponry"
 tajik_focus.35.d: "El gobierno de Tajik nos ha contactado pidiendo armas estadounidenses capturadas. A cambio, están dispuestos a pagar el precio por ellos."
 tajik_focus.35.a: "Necesitamos el dinero."
 tajik_focus.35.b: "No"
 tajik_focus.36.t: "Traficantes de talibanes en armas americanas"
 tajik_focus.36.d: "Los talibanes han aceptado nuestras peticiones, y han comenzado a contrabando sobre el equipo militar estadounidense capturado, ayudando a nuestros militares a abastecer sus líneas."
 tajik_focus.36.a: "Esperemos que los estadounidenses no se den cuenta"
 tajik_focus.37.t: "¡Los talibanes nos ignoran!"
 tajik_focus.37.d: "Los talibanes han decidido ignorarnos, en lugar de optar por enviar un burro singular sobre la frontera con una nota adjunta a su espalda que escribió 'American Humvee'."
 tajik_focus.37.a: "¿Qué demonios?"
 tajik_focus.38.t: "Tayikistán sece el Rango de Sarikol!"
 tajik_focus.38.d: "El gobierno de Tajik ha decidido separar el Rango Sarikol a nuestro control, una cordillera que se ha llenado de nada más que disputas desde el día en que nos convertimos en vecinos."
 tajik_focus.38.a: "Genial."
 tajik_focus.39.t: "Tayikistán solicita la venta de armas"
 tajik_focus.39.d: "El gobierno tayiko ha pedido que les vendamos algunas armas. Recientemente nos secederon el Rango Sarikol que demostró que están más que dispuestos a negociar. ¿Quizás podamos enseñarles algo de curtesía?"
 tajik_focus.39.a: "Okay"
 tajik_focus.39.b: "No"
 tajik_focus.40.t: "China Acepta"
 tajik_focus.40.d: "El gobierno chino ha acordado vendernos las armas que solicitamos, como signo de buena voluntad debido a nuestra reciente transferencia del Rango Sarikol al control chino."
 tajik_focus.40.a: "Equipo de infantería chino"
 tajik_focus.40.b: "Chino Blindaje"
 tajik_focus.40.c: "Aviones chinos"
 tajik_focus.41.t: "Rechazos de China"
 tajik_focus.41.d: "A pesar de todo lo que tenemos, tal renuncia a la Rancha Sarikol, el gobierno chino ha tenido la oportunidad de rechazar nuestra solicitud de armas. Muchas personas en nuestro gobierno están enojadas por este movimiento, ya que demuestra que no tienen absolutamente ninguna curtesía."
 tajik_focus.41.a: "¿Por qué?"
 tajik_focus.42.t: "Cierre reciente de las inversiones"
 tajik_focus.42.d: "Debido a nuestras reformas anticorrupción, muchos inversores de todo el mundo han decidido que quieren una participación en la economía tayika. Con la economía proyectada para mejorar drásticamente, podemos esperar un mayor control económico sobre la región."
 tajik_focus.42.a: "¡Genial!"
 tajik_focus.43.t: "Arrendamiento de la 201.ª Base Militar"
 tajik_focus.43.d: "Los rusos han tenido un contrato de arrendamiento en la base militar 201, donde la División 201 del Rifle del ejército ruso ha estado estacionada durante todo el tiempo que podamos recordar. Sin embargo, este arrendamiento es negociable y están en nuestra tierra después de todo. Podemos ver si los rusos valen la pena guardar alrededor, o si queremos renunciar a la trama a alguien más que está dispuesto a pagar más."
 tajik_focus.43.a: "Veamos lo que ofrecen los rusos"
 tajik_focus.43.b: "No estoy convencido de que los rusos tengan algo de valor"
 tajik_focus.44.t: "Tayikistán exige concesiones"
 tajik_focus.44.d: "El gobierno tayiko ha estado viendo el contrato de arrendamiento en la Base Militar 201 más que nunca. Alarmas fueron levantadas una vez que el gobierno tayiko preguntó si teníamos 'nada para contribuir' como resultado de su generosidad inquebrantable al dejarnos quedar en sus tierras. Tal vez el gobierno tayiko está insinuando que necesitamos darles algo si nos gustaría quedarnos..."
 tajik_focus.44.a: "Okay fine"
 tajik_focus.44.b: "No"
 tajik_focus.45.t: "Gobierno ruso ofrece concesiones"
 tajik_focus.45.d: "Parece que los rusos son capaces de recoger en las preguntas sociales, y han decidido darnos algunas inversiones como una muestra de buena voluntad. Aún podemos decidir no dejarles mantener la base, pero nunca pedimos formalmente nada."
 tajik_focus.45.a: "Bien."
 tajik_focus.46.t: "El Gobierno ruso no va a hacer nada."
 tajik_focus.46.d: "El gobierno ruso no pudo recoger nuestras pistas de que queremos algo a cambio de toda nuestra generosidad, y en su lugar nos han enviado una carta formal diciendo 'Gracias por la base, viejo amigo'."
 tajik_focus.46.a: "¿Viejo amigo? Ya lo veremos."
 tajik_focus.47.t: "Tajikistan Betrays Nuestra Causa!"
 tajik_focus.47.d: "A pesar de haber dado al gobierno tayiko exactamente lo que querían, todavía han elegido doble cruce con nosotros y nuestra palabra. Parece que la bondad no era de utilidad, y tendremos que tomar medidas más drásticas en un futuro próximo..."
 tajik_focus.47.a: "No olvidaremos esto."
 tajik_focus.48.t: "Tayikistán cancela el liderato de la base 201!"
 tajik_focus.48.d: "El gobierno tayiko ha decidido recientemente que ya no quiere alquilar la base 201 a nuestro gobierno. En vez de negociar términos, han optado por expulsarnos completamente de la base. Los círculos gubernamentales están pidiendo un posible plan para derrocar al gobierno y a su líder [TAJ.GetLeader] a su debido tiempo."
 tajik_focus.48.a: "Tendremos nuestra venganza."
 tajik_focus.49.t: "¿Y ahora qué?"
 tajik_focus.49.d: "Ha llegado el momento de negociar términos más favorables con respecto a la base militar 201.ª que Rusia ha puesto en nuestra nación desde nuestro nacimiento estatal. Si continuamos dejando que el ejército ruso permanezca sin negociaciones, entonces estamos prácticamente comprometiendo nuestros derechos. Sin embargo, podemos mirar al extranjero a otra nación que está dispuesta a... pagar lo que sea necesario."
 tajik_focus.49.a: "Reintegrar el contrato ruso"
 tajik_focus.49.b: "Llegar a nuestros amigos americanos"
 tajik_focus.49.c: "Llegar a nuestros amigos chinos"
 tajik_focus.49.d1: "Llegar a nuestros amigos indios"
 tajik_focus.50.t: "Tayikistán propone una oferta interesante"
 tajik_focus.50.d: "El gobierno tayiko nos ha presentado una propuesta interesante. Están solicitando una «aceleración» a la Base 201 en Dushanbe. Tomar la propuesta mejora la posición económica de Tayikistán, así como fortalecer nuestra propia posición en la región."
 tajik_focus.50.a: "Una oferta que no podemos dejar desperdiciar"
 tajik_focus.50.b: "Una idea terrible, no podemos hacer nada con eso."
 tajik_focus.51.t: "[FROM.GetName] Acepta nuestra oferta"
 tajik_focus.51.d: "[FROM.GetName] ha decidido que es en su mejor interés tomar nuestra oferta en la base."
 tajik_focus.51.a: "Buena elección, [FROM.GetName]"
 tajik_focus.52.t: "[FROM.GetName] Toma sobre la base 201"
 tajik_focus.52.d: "Esos ladrones en [FROM.GetName] han decidido apoderarse de la base 201 que nuestro ejército estaba acertado. También no podemos olvidar a los tayikos que apuñalan atrás, quienes sin consultarnos nos han dado un tiempo limitado para sacar nuestras fuerzas."
 tajik_focus.52.a: "¿Qué demonios [FROM.GetName]?"
 tajik_focus.53.t: "Nuestro Slice"
 tajik_focus.53.d: "El negocio familiar ha ido bien, o así creemos. Nuestras inversiones están pagando mucho, y nuevas fábricas en Dushanbe y Sughd están apareciendo. Sin embargo, esta base industrial no está controlada por la familia de Rahmon, sino que son parte de un movimiento de empresas privadas. Podemos tomar todo el pastel a la vez, o ir por él incriminadamente."
 tajik_focus.53.a: "Lo quiero todo, ahora"
 tajik_focus.53.b: "No hay necesidad de correr"
 tajik_focus.54.t: "Tayikistán insta a la ampliación de la OTSC"
 tajik_focus.54.d: "El gobierno tayiko nos pide que amplíemos el CSTO, para abarcar una mayor parte del Asia central. Nos piden que amplíemos invitaciones a Turkmenistán y Uzbekistán, con la esperanza de probarse como un miembro influyente de la alianza."
 tajik_focus.54.a: "Buena idea."
 tajik_focus.54.b: "No superes tus límites, Tayikistán"
 tajik_focus.55.t: "Invitación a CSTO"
 tajik_focus.55.d: "Los rusos han cursado una invitación a la alianza CSTO. Esto se debe principalmente a la solicitud de Tajik, donde presionaron al gobierno ruso para que extendiera invitaciones a nuestra nación."
 tajik_focus.55.a: "Okay"
 tajik_focus.55.b: "No"
 tajik_focus.56.t: "Nuestros intereses comunes"
 tajik_focus.56.d: "En este momento, hemos hecho un esfuerzo para des-Rusificar nuestra nación y avanzar hacia una identidad más distintiva. Sin embargo, podemos duplicar nuestros esfuerzos. Al incorporar al Partido Demócrata de Tayikistán, podremos utilizar su liderazgo central y los miembros del partido para impulsar una agenda más iraní en aras de forjar nuestra identidad nacional."
 tajik_focus.56.a: "Adelante con la fusión"
 tajik_focus.56.b: "Limite la integración"
 tajik_focus.56.c: "Una idea terrible. No."
 tajik_focus.57.t: "Voz disidente: Umarali Kuvvatov"
 tajik_focus.57.d: "Umarali Kuvvatov, miembro activo del Grupo 24 ha intensificado sus actividades desde el exilio en Turquía. Nuestro gobierno nos ha presentado una serie de opciones, una de las cuales, siendo el silenciamiento permanente de Umarali. Si escogemos tratar con él de tal manera, hay una posibilidad de que este retroceso en nosotros y seremos vistos con más escrutinio de la gente en nuestra nación y en el extranjero."
 tajik_focus.57.a: "Emitir la orden, deshacerse de él"
 tajik_focus.57.b: "Es mejor que gastemos nuestros recursos en otra cosa"
 tajik_focus.58.t: "Umarali Kuvvatov encontrado muerto en Estambul"
 tajik_focus.58.d: "Los medios turcos informan de que Umarali Kuvvatov fue encontrado muerto en un restaurante del distrito de Fatih de Estambul. Tres personas de origen tayiko han sido detenidas, sin embargo, no se ha conectado al gobierno tayiko. Umarali fue un problema durante muchos años, organizando movimientos de oposición contra nuestro gobierno con esta organización 'Grupo 24', que tiene vínculos con el Partido Renacimiento Islámico (IRP)."
 tajik_focus.58.a: "Ese es un extremo menos suelto."
 tajik_focus.59.t: "Umarali Kuvvatov sobrevive el intento de asesinato"
 tajik_focus.59.d: "Umarali Kuvvatov apenas perdió un disparo de arma que tenía la intención de golpear su cabeza. Escuchando un ruido detrás de él, rápidamente se movió para ver lo que era, lo cual cargó al asesino sería, haciéndolo perder su tiro. The assaliants gun then reportedly jammed, allowing for people in the restaurant to tackle the gunmen and restrain him until police arrived. Este intento de vida de Umarali está siendo culpado a las autoridades tayikas, con el gobierno turco y otros condenando el intento."
 tajik_focus.59.a: "Mierda, nadie dice nada"
 tajik_focus.60.t: "Nuestro nuevo capital administrativo"
 tajik_focus.60.d: "Tras la fundación de la Unión de Estados del Asia Central, pudimos consolidar y legitimar nuestro gobierno. Sin embargo, para consolidar aún más nuestro nuevo estado, tendremos que establecer un nuevo capital en algún lugar dentro de la nación. Utilizaremos las principales zonas urbanas como lugares potenciales, y renombraremos las ciudades en consecuencia."
 tajik_focus.60.a: "Muévete a Ozodobod"
 tajik_focus.60.b: "Muévete a Rustamshahr"
 tajik_focus.60.c: "Muévete a Tojdar."
 tajik_focus.60.d1: "Dushanbe será suficiente."
 tajik_focus.61.t: "[TAJ.GetLeader] Re-Elected!"
 tajik_focus.61.d: "El líder de la nación, [TAJ.GetLeader] ha sido reelegido en una elección popular! Sólo ganando tímido del 100% de los votos, [TAJ.GetLeader] tendrá el honor de dirigir a la nación por otro término. Crowds de sus partidarios han alineado las calles de nuestra capital y están esperando otro término próspero."
 tajik_focus.61.a: "Perfect..."
 tajik_focus.61.b: "¿Y si quisiera una democracia?"
 tajik_focus.62.t: "Nuestra Flota Helicóptero"
 tajik_focus.62.d: "Nuestra flota de helicópteros está envejeciendo rápidamente, y estamos muy cortos. Aunque nuestras opciones de actualizaciones no son las más grandes, ciertamente podemos mejorar los arsenales. Preguntando a los estadounidenses o a los rusos, podremos por lo menos conseguir algunos helicópteros funcionales en nuestros militares."
 tajik_focus.62.a: "Pregunta a los americanos"
 tajik_focus.62.b: "Pregúntale a los rusos"
 tajik_focus.63.t: "Tayikistán pide helicópteros"
 tajik_focus.63.d: "El gobierno tayiko nos está pidiendo que les proveamos algunos de nuestros helicópteros. Esto significaría que daríamos algunas de nuestras flotas más envejecidas, pero la elección es nuestra si queremos que esta pequeña nación en Asia Central consiga sus manos en nuestros helicópteros."
 tajik_focus.63.a: "Autorizar la venta"
 tajik_focus.63.b: "No"
 tajik_focus.64.t: "[FROM.GetName] Autoriza la venta de helicópteros"
 tajik_focus.64.d: "El Gobierno [FROM.GetAdjective] ha aceptado nuestras solicitudes de helicópteros. Aunque enviarán algunas de sus unidades más antiguas, seguirá siendo un impulso masivo para nuestra flota de helicópteros envejecidos."
 tajik_focus.64.a: "Genial."
 tajik_focus.65.t: "[FROM.GetName] Rechaza el Acuerdo Militar"
 tajik_focus.65.d: "Independientemente de nuestras bajas expectativas por la asistencia militar de calidad, el [FROM.GetAdjective] todavía no ha visto que sea adecuado para recibir parte de su ayuda."
 tajik_focus.65.a: "Unfortunate"
 tajik_focus.66.t: "Tayikistán solicita asistencia con sus industrias militares"
 tajik_focus.66.d: "El gobierno tayiko está solicitando nuestro apoyo en la construcción de una industria armamentística fuerte y productiva dentro de su nación. Están ofreciendo dar a nuestro gobierno un trato especial a cambio, y podremos extender nuestra influencia."
 tajik_focus.66.a: "Buena idea."
 tajik_focus.66.b: "No"
 tajik_focus.67.t: "Turquía construye fábricas de armas"
 tajik_focus.67.d: "El gobierno turco había aceptado nuestra solicitud de asistencia con nuestra industria armamentística, y habían construido algunas fábricas para que nuestros trabajadores utilizaran."
 tajik_focus.67.a: "¡Genial!"
 tajik_focus.68.t: "Tayikistán pide apoyo a la industria de armas con expertos en drones"
 tajik_focus.68.d: "El gobierno tayiko está pidiendo a los nuestros que les ayuden a establecer una industria de armamentos, con un enfoque particular en la producción de equipos de drones, similar a partes propias. Seremos capaces de difundir nuestra influencia como resultado, y ayudar a una nación hermano necesitada."
 tajik_focus.68.a: "Gran idea"
 tajik_focus.68.b: "No"
 tajik_focus.69.t: "Irán proporciona apoyo"
 tajik_focus.69.d: "El gobierno iraní ha aceptado nuestra solicitud, y nos han construido una fábrica de armas que ahora está siendo supervisada y dirigida por sus propios expertos en drones, quienes planean entrenar a nuestros trabajadores."
 tajik_focus.69.a: "Genial."
 tajik_focus.70.t: "Tayikistán: Pobreza en medio de la riqueza"
 tajik_focus.70.d: "Nuestra nación es llamada «la nación más pobre de Asia Central» por la mayoría de los expertos. Esta carga económica que nuestro pueblo tiene que soportar es como resultado de la mala gestión por parte de nuestros funcionarios gubernamentales. Es hora de que elijamos un nuevo camino, el camino hacia la recuperación económica y la fuerza nacional."
 tajik_focus.70.a: "Enfoque sobre corrupción"
 tajik_focus.70.b: "Enfoque sobre una fuerza de trabajo productiva"
 tajik_focus.71.t: "Rahmon's Rotting Fruit"
 tajik_focus.71.d: "La República de Tayikistán se encuentra en una situación precaria. La corrupción rampante, el nepotismo generalizado, la ineficiencia gubernamental y las cicatrices de la mala gobernanza han dirigido a la nación lejos del camino del progreso que previó después del colapso de la Unión Soviética. La guerra civil de los años noventa dejó más que la destrucción física. Fracturó la unidad de la nación, sembró desconfianza entre su pueblo, y creó un ambiente de inestabilidad política que persiste hasta hoy. El Presidente Emomali Rahmon, que emergió victorioso en las luchas de poder después de la guerra, se enfrenta ahora a la tarea de reconstruir un país que sigue hundiendo del conflicto devastador. El estancamiento económico, las disparidades regionales y una población cada vez más marginada amenazan con desentrañar la frágil paz. El espectro de la oposición, tanto nacional como en el extranjero, se ve grande, ya que muchos cuestionan la capacidad de Rahmon para llevar al país hacia la prosperidad. ¿Podrá Tayikistán superar sus divisiones internas y trazar un nuevo rumbo para su futuro, o seguirá sumido en la sombra de su pasado turbado?"
 tajik_focus.71.a: "Que el nuevo milenio sea amable con nosotros"
 pamir_conflict.1.t: "Fuerzas de ataque Aseguren Batken"
 pamir_conflict.1.d: "Las fuerzas atacantes han expulsado a los defensores de Batken y han asegurado puestos clave e instituciones gubernamentales en la región."
 pamir_conflict.1.a: "Okay"
 pamir_conflict.2.t: "Fuerzas de Defensa sostienen la línea"
 pamir_conflict.2.d: "Las fuerzas de defensa situadas en la región de los almirantes pudieron detener con éxito a las fuerzas atacantes que trataban de capturar puestos clave en la región."
 pamir_conflict.2.a: "Okay"
 pamir_conflict.3.t: "Cesación del fuego llamada"
 pamir_conflict.3.d: "Debido al progreso inadecuado, las fuerzas atacantes han puesto fin a su ofensiva y han acordado una cesación del fuego."
 pamir_conflict.3.a: "Okay"
 pamir_conflict.4.t: "Nuestras fuerzas eran incapaces de repeler los ataques"
 pamir_conflict.4.d: "Nuestras fuerzas no pudieron mantener la línea, sucumbindo a todos los ataques lanzados por los agresores."
 pamir_conflict.4.a: "Unfortunate"
 pamir_conflict.5.t: "Fuerzas de ataque Aseguren Batken"
 pamir_conflict.5.d: "Las fuerzas atacantes han expulsado a los defensores de Batken y han asegurado puestos clave e instituciones gubernamentales en la región."
 pamir_conflict.5.a: "Okay"
 tajik_lore.0.t: "Nadyrov's Plea"
 tajik_lore.0.d: "Las puertas se abrieron suavemente a la oficina presidencial como un oficial corto, usando una gorra de gran tamaño, se metió en la habitación y colocó una carta en el escritorio de Rahmon, señalando que era una entrega del Jefe del Estado Mayor, Ramil Nadyrov. Otro llamamiento para que los fondos presupuestarios apoyen la inversión militar. El superávit que se expide a nuevos reclutas está en malas condiciones. Mientras Rahmon desplegó la carta, comenzó a leer.\n\nSu Excelencia, Fundador de Paz y Unidad Nacional, Líder de la Nación\nConfío en que esta carta te alcance en buena salud. Escribo para pedir una vez más apoyo financiero a los valientes hombres que están en primera línea, listos para sacrificar todo al servicio de usted y nuestra amada Tayikistán. Estos hombres están preparados para luchar, pero su valor por sí solo no puede llevar el día. Un soldado, después de todo, es tan eficaz como el arma en sus manos.\n\nSinceramente\nRamil Khalilovich Nadyrov\n\nRahmon puso la carta de nuevo en el sobre se inclinó hacia atrás en su silla y humedeció."
 tajik_lore.0.a: "Sólo otro día en el trabajo."
 tajik_lore.1.t: "La verdad más difícil"
 tajik_lore.1.d: "Nadyrov se sentó en su diminuta oficina, el peso de la anticipación colgando en el aire tan fuerte como la gruesa niebla gris que giraba desde la punta de su cigarro. Cada exhalación se agregó a la densa escobilla, revolviendo la habitación angosta en una sombría y sofocante quietud. El débil resplandor de su lámpara de escritorio arroja largas sombras a través de mapas dispersos e informes tácticos, cada uno marcado con círculos rojos y notas apresuradamente escribibles sobre movimientos insurgentes.\n\nUn mensajero había llegado antes, dejando un sobre sellado en su escritorio, llevando el sello oficial de la capital Dushanbe. La carta que acababa de llegar no ofrecía buenas noticias, ni aumento en la financiación militar prometida.\n\nSe inclinó en su silla, y Nadyrov corrió una mano a través de su cabello delgado, la frustración se estremeció profundamente. Añadiendo a la cruenta realidad, un nuevo informe había llegado apenas horas antes, se había establecido otra fortaleza de UI, más profunda en el territorio tayiko. Las noticias lo golpearon como ladrillos, cada palabra un recordatorio amargo de la creciente amenaza que sus fuerzas mal financiadas y mal equipadas se esperaban para combatir. Nadyrov aplastó los restos de su cigarro en el cenicero rebosante, las brasas volando brevemente antes de desvanecerse en la oscuridad. La habitación se sentía más fría ahora, ya que el frío de la incertidumbre se asentaba."
 tajik_lore.1.a: "Allahumma arhamna"
 tajik_lore.2.t: "Arsenal Blueprint"
 tajik_lore.2.d: "Nadyrov se sentó en su diminuta oficina, el peso de la anticipación colgando en el aire tan fuerte como la gruesa niebla gris que giraba desde la punta de su cigarro. Cada exhalación se agregó a la densa escobilla, revolviendo la habitación angosta en una sombría y sofocante quietud. El débil resplandor de su lámpara de escritorio arroja largas sombras a través de mapas dispersos e informes tácticos, cada uno marcado con círculos rojos y notas apresuradamente escribibles sobre movimientos insurgentes.\n\nUn mensajero llegó y colocó un sobre sellado en su escritorio, su superficie marcada con el sello oficial de Dushanbe. Esperando otro rechazo, él lo abrió con un suspiro, preparado para consternación. En lugar de eso, una ola de deleite pasó sobre él. La solicitud había sido aprobada y marcada con un sello de tinta azul. No perdió tiempo, marchó a la sala de mandos y llamó a todo el jefe del personal.\n\nJuntos, comenzaron a coordinar la logística para un envío sustancial de rifles, recién protegidos de arsenales rusos. Cada jefe inspeccionó el inventario, seleccionando las piezas de repuesto y el equipo que más necesitaban. Nadyrov no podía dejar de sonreír a sí mismo."
 tajik_lore.2.a: "Parece que la temporada de conejos está en juego"
 tajik_lore.3.t: "Ópticas del Valle de Tavildara"
 tajik_lore.3.d: "La radio saltó su estática llenando la habitación. Los sonidos distorsionados de gritos distantes se ensancharon a través de los altavoces, acompañados por los ruidos resonantes del tiroteo. Se había enviado un convoy paneado para vigilar la ciudad de Tavildara y sus regiones circundantes se encontraban en las montañas del distrito de Sangvor. Su misión era rastrear los movimientos de posibles insurgentes de la UI, tras informes de reagrupación después de recientes reves en el Afganistán.\n\nDespués de que los informes se filtraron a Nadyrov fue consumido con irritación al oír que una vez más, la operación había fracasado. Sus manos golpearon en el escritorio el impacto que agitaba la habitación. Sabía que los errores pronto serían descubiertos y que sería un fracaso del estado"
 tajik_lore.3.a: "Siempre caminando sobre el borde"
 tajik_lore.4.t: "Ópticas del Valle de Tavildara"
 tajik_lore.4.d: "Desde el nido de cuervo improvisado en el borde del paso de la montaña, sus ojos miraban hacia abajo las vistas de hierro de su rifle. Posicionado detrás de él eran un rebaño de insurgentes, de pie como buitres, esperando un asesinato. Un camión de la era soviética, pintado en verde oliva decolorado y llevando las placas de las Fuerzas Terrestres Tajik, redondeó la esquina. Sus dedos apretados en el gatillo. Las ventanas de la camioneta se estremecieron mientras la cabeza sangrienta del conductor colapsó en el volante, presionando sobre el cuerno. El camión se alejó del lado de la pista hacia el valle abajo, formando una trampa mortal. Un grupo de insurgentes se apresuró para terminarlos. Las balas sonaron fuego de sus rifles penetrando en el camión, eliminando a los que aún están dentro. Arrastraron los cuerpos del vehículo los sonidos débiles de una radio rotura pidiendo una respuesta repetida, pero no llegó la respuesta. La misión se hizo."
 tajik_lore.4.a: "Nuestra fruta está podrida y la mataron."
 tajik_lore.5.t: "La tapadera arriba"
 tajik_lore.5.d: "Nadyrov fue uno de los primeros en llegar a la escena del incidente, acompañado por su convoy de camiones fuertemente blindados y APCs. Inmediatamente ordenó a los reporteros que afirmaran que el vehículo había perdido el control, se desprendió del borde y se estrelló, matando a los ocupantes, todos para cubrir sus huellas."
 tajik_lore.5.a: "Un día en su mejor"
 tajik_lore.6.t: "Una llamada no deseada"
 tajik_lore.6.d: "Rahmon se sentó en su escritorio cuando el teléfono sonó. lo recogió y fue encontrado por [UZB.GetLeader], exigiendo una explicación para la incursión de la UI a través de la frontera tayiko hacia Uzbekistán, que había dado lugar a la muerte de dos guardias fronterizos. Rahmon respondió en un tono contundente.\n\nNo sabíamos de ningún movimiento de UI a través de la frontera. Las patrullas fronterizas tayikas han estado en pleno apogeo...\n\n[UZB.GetLeader] detuvo a su traductor y cortó a Rahmon antes de que pudiera terminar.\n\nNo me importan tus excusas. Una amenaza está en nuestra puerta mientras les dejas picnic. Exijo el cese inmediato de albergar fuerzas de la UI en el centro de Tayikistán o las consecuencias seguirán el ejemplo. Terminó la llamada abruptamente.\n\nRahmon se sentó inmóvil en su escritorio por un momento antes de recoger el teléfono para hacer una llamada al Jefe del Estado Mayor."
 tajik_lore.6.a: "Bueno..."
 tajik_lore.7.t: "Colinas Ablaze"
 tajik_lore.7.d: "Han llegado informes de que un avión de combate uzbeko violó nuestro espacio aéreo, sobrevolando el norte de Tayikistán antes de lanzar una redada dirigida contra uno de los cuatro lugares remotos. Las huelgas parecen haber estado dirigidas a las fortalezas de la UI, pero esto constituye una grave escalada del conflicto y amenaza la seguridad nacional. No podemos permitirnos caminar como perros, pero no podemos permitirnos otro conflicto a gran escala."
 tajik_lore.7.a: "Dejar sin respuesta"
 tajik_lore.7.b: "Rallye de las tropas"
 tajik_lore.8.t: "Planes de huelga en Tayikistán"
 tajik_lore.8.d: "Las fuerzas de la UI se esconden en las montañas de Tayikistán, debemos actuar ahora antes de que llegue tarde."
 tajik_lore.8.a: "No hay elección, nuestra mano es forzada para eso."
 tajik_lore.9.t: "Mina las fronteras"
 tajik_lore.9.d: "La brecha de IMU es frontera todos los días. Debemos tomar y tomar una defensa poniendo minas terrestres para defender el estado."
 tajik_lore.9.a: "No hay elección, nuestra mano es forzada para eso."
 tajik_lore.10.t: "Uzbekistan lays landmines"
 tajik_lore.10.d: "Rahmon volvió a su oficina en su escritorio una nota le esperó. Mientras se desenvolvía tenía una expresión obscura. El mensaje era claro: las fuerzas uzbecas habían comenzado a extraer las regiones fronterizas a lo largo de la frontera entre Tayikistán y Uzbekistán.\n\nCantando en su silla Rahmon se sentía humillado. Una vez más, estaba siendo hecho para parecer un tonto."
 tajik_lore.10.a: "Estamos fuera de nuestro alcance"
 tajik_lore.10.b: "No aceptaremos esto."
 tajik_lore.11.t: "Conferencias de Crisis con Uzbekistán"
 tajik_lore.11.d: "El teléfono era duro y frío un contraste firme con las manos sudorosas de Rahmon. cada anillo un recordatorio de lo que estaba en la línea. Cuando el [UZB.GetLeader] contestó, Rahmon habló con calma contundente mientras que también le indicaba a su personal para salir de la habitación. Nadie sabe qué pasó en esa llamada, pero cuando Rahmon regresó Uzbekistán accedió a pausar su avance. Con Rahmon rehusando elaborar lo que pasó. "
 tajik_lore.11.a: "Un suspiro ancho de nación"
 tajik_lore.12.t: "Uzbekistán golpea a Tayikistán en la operación dirigida de la UCI"
 tajik_lore.12.d: "Uzbekistán lanzó ataques aéreos en todo el norte de Tayikistán contra las fortalezas del Movimiento Islámico de Uzbekistán (UI) en respuesta a actividades transfronterizas de insurgentes. Los funcionarios tayikos han condenado el ataque que lo avista como una violación de su espacio aéreo pero aún no han intensificado el conflicto. Las huelgas marcan un aumento significativo de las tensiones entre las dos naciones."
 tajik_lore.12.a: "Un mundo en el desorden"
 tajik_lore.12.b: "Una sombra sobre nosotros"
 tajik_lore.12.c: "A Flujo Decisivo"
 tajik_lore.13.t: "Uzbekistán mina la frontera tayika"
 tajik_lore.13.d: "Las fuerzas uzbecas han comenzado a establecer minas terrestres a lo largo de la frontera entre Tayikistán y Uzbekistán sobre las preocupaciones de los movimientos insurgentes de la UI. Esto sigue los recientes ataques aéreos dirigidos a posiciones de la UI en el norte de Tayikistán. Los funcionarios tayikos han condenado estas acciones. Estatándolos como violaciones de la soberanía y crecientes tensiones entre las dos naciones"
 tajik_lore.13.a: "Días de Hazy están por delante"
 tajik_lore.14.t: "Invasión de Uzbekistán en Tayikistán"
 tajik_lore.14.d: "El Ejército Nacional de Tajik ha informado que las fuerzas uzbekos han cruzado la frontera y lanzado ataques contra posiciones militares tayikas. El Gobierno de Uzbekistán afirma que la incursión forma parte de una operación de mantenimiento de la paz destinada a garantizar la región de las redes IMU (Movimiento Islámico de Uzbekistán). Tayikistán acusa al gobierno uzbeko de desestabilizar la región con total desprecio por la soberanía nacional. A medida que el conflicto escala muchos civiles huyen hacia el sur. Esto está suscitando preocupaciones acerca de una posible crisis humanitaria."
 tajik_lore.14.a: "Una caminata cuidadosamente que terminó en el fuego del infierno"
 SOV_forbidden_bazaar: "Tajikistan's Blackmailing"
 SOV_forbidden_bazaar_desc: "El gobierno tayiko [TAJ.GetFlag] ha decidido que quiere chantajearnos con el flujo de drogas hacia nuestra nación, desestabilizando varios sectores y causando mucha corrupción. Evento Generalmente llegará a un punto en el que tenemos que pedirles que paren, independientemente de nuestro estatus como aliados."
 SOV_forbidden_bazaar_stop: "Exigir que [TAJ.GetFlag] Tayikistán aumente la seguridad fronteriza"
 SOV_forbidden_bazaar_stop_desc: "Ha llegado el momento de ordenar a ese idiota [TAJ.GetLeader] que endurezca la seguridad alrededor de sus fronteras."
 TAJ_forbidden_bazaar: "Bazar de las Sombras"
 TAJ_forbidden_bazaar_desc: "\n£TAJ_desctext_blackmarket\n\n\n\nMuchos bienes ilegales fluyen por [TAJ.GetFlag] §HTayikistán§! todo desde narcóticos, hasta inmigrantes ilegales que cruzan la frontera con otras naciones del norte. Esto da a nuestro gobierno ventaja contra nuestros vecinos, y en última instancia, [SOV.GetFlag] Rusia. Cuando estamos insatisfechos con las acciones de [SOV.GetFlag] Gobierno ruso, o justo cuando nos sentimos así, podríamos relajarnos §Hseguridad§! rodeando a los §Hmercado negro§! para desestabilizar [SOV.GetFlag] Rusia, esto enojará [SOV.GetFlag] Rusia, y puede resultar en ellos tratando de aumentar su influencia sobre nuestra nación. Cada mes, basado en la seguridad alrededor de la §Hmercado negro§!, conseguiremos el contrabando que contribuirá a nuestro desarrollo con la posibilidad de §Rdesestabilización§! factores sangrando en nuestro propio estado dependiendo de nuestro §Hnivel de seguridad§!. Cada vez que elevamos la cantidad de narcóticos entrando [SOV.GetFlag] Rusia, corremos el riesgo de enojarlos, y si tienen §H40% de influencia§! pueden exigir un final a ti. Podemos ver los modificadores [SOV.GetFlag] Rusia ha atravesado el modificador dinámico en sus listas nacionales de espíritu.\n\nSituación actual de la seguridad: [TAJ_high_security_flag][TAJ_medium_security_flag][TAJ_negligible_security_flag]"
 TAJ_high_security: "Realizar alta seguridad"
 TAJ_high_security_desc: "Ha llegado el momento de tomar más medidas preventivas contra el mercado negro para evitar el flujo de bienes ilegales en la nación."
 TAJ_medium_security: "Promulgar seguridad relajada"
 TAJ_medium_security_desc: "Al relajar la seguridad, podemos recoger los beneficios del mercado negro sin perder cierto control."
 TAJ_negligible_security: "Promulgar la seguridad insignificante"
 TAJ_negligible_security_desc: "¿Quién necesita seguridad cuando usted puede tener dinero?"
 TAJ_threaten_russia: "Amenaza a Rusia"
 TAJ_threaten_russia_desc: "Al amenazar la estabilidad rusa mediante el flujo de narcóticos, podemos asustar a Rusia para que ceda a nuestras exigencias."
 TAJ_flood_russian_market_with_drugs: "Inundar los mercados rusos de [SOV.GetFlag] de narcóticos"
 TAJ_flood_russian_market_with_drugs_desc: "Necesitamos ganar una ventaja, un apalancamiento y una posición de negociación con el gobierno ruso [SOV.GetFlag]. Liberando narcóticos en sus mercados, y aumentando lentamente la presión, podemos conseguir que reconozcan y nos den lo que queremos."
 TAJ_cancel_distribute_monthly_bonus: "Reactivar el evento mensual de bienes del mercado negro"
 TAJ_cancel_distribute_monthly_bonus_desc: "Comenzará a recibir el evento mensual una vez más hacia el final de cada mes."
 TAJ_distribute_monthly_bonus: "Recoger y distribuir automáticamente los bienes mensuales"
 TAJ_distribute_monthly_bonus_desc: "La notificación mensual de mercancías del mercado negro dejará de aparecer, y en cambio distribuirá automáticamente las mercancías. Los bonos serán distribuidos, bajando así algunos de los bonos ligeramente."
 TAJ_increase_drug_amount: "Aumentar la cantidad de estupefacientes"
 TAJ_increase_drug_amount_desc: "Necesitamos aumentar el flujo de narcóticos en [SOV.GetFlag] Rusia para presionarlos aún más."
 TAJ_end_the_drug_flow: "Fin del Swarm de Drogas"
 TAJ_end_the_drug_flow_desc: "Los rusos ya no nos sirven de nada, ahora podemos terminar con la presión y detener el flujo de drogas en su país una vez"
 TAJ_russian_demands: "[SOV.GetFlag] Demandas rusas"
 TAJ_russian_demands_desc: "Los rusos finalmente han emitido un ultimátum, o aumentamos nuestra represión contra las drogas, o entregamos nuestra soberanía territorial."
 TAJ_tajik_revolution_mech: "La revolución tayika [TAJ.GetFlag]"
 TAJ_tajik_revolution_mech_desc: "Los fracasos, la corrupción y el nepotismo del gobierno §HRahmonov§! han demostrado una vez más que no podemos confiar en los autócratas y la dinastía política con el gobierno de la nación. El §HUTO§! y todos los disidentes contra el §HRahmonov Regime§! deben unirse bajo una bandera para liberar a la nación de una vez por todas.\n\nPodemos centrar la revolución alrededor de §HUTO§!, o nuestro propio partido. Al bajar §HUTO Unity§!, centraremos la revolución alrededor de nuestro propio partido, permitiéndonos gobernar sin restricciones al final de la revolución, pero recibiendo menos apoyo durante la guerra civil, y una agitada situación post-revolución. Sin embargo, si priorizamos §HUTO Unity§!, entonces nuestra regla puede ser más estable pero al final tendremos que lidiar con las demandas más adelante.\n\n§HUTO Unity§!: [?TAJ_uto_unity]%"
 TAJ_launch_the_revolt: "Inicie el Revoltaje"
 TAJ_launch_the_revolt_desc: "Ha llegado el momento de superar a Rahmonov y su régimen criminal de una vez por todas."
 TAJ_tap_into_uto_funds: "Grifo en los fondos de la OTU"
 TAJ_tap_into_uto_funds_desc: "Al tomar en secreto fondos de la UTO sin informar a la dirigencia central, podremos sembrar algo de desunión dentro de la organización."
 TAJ_discredit_uto_leadership: "Descrédito Liderazgo de la OTU"
 TAJ_discredit_uto_leadership_desc: "Al desacreditar a la dirigencia de la UTO, podemos empeorar el sentido de confianza dentro del grupo y centrar la atención en nosotros y en nuestro propio partido."
 TAJ_propaganda_campaign: "Propaganda"
 TAJ_propaganda_campaign_desc: "Al lanzar una campaña de propaganda a favor de la UTO, estableceremos una mejor imagen de la organización."
 TAJ_the_crackdown: "El Crackdown"
 TAJ_radicalism_system: "Ecos de la Umma"
 TAJ_radicalism_system_desc: "\n£TAJ_desctext_irp\n\n\n\nLa pobreza, la corrupción, el nepotismo y el desempleo están entre los reclamos que nuestro pueblo ha sostenido contra nuestro gobierno. Sin embargo, uno está sobre todos ellos y es la pajita final para muchos. Nuestra supresión de las prácticas islámicas ha llevado a algunos de nuestros pueblos a creer que la religión es la respuesta a los problemas en el interior \n§H[TAJ.GetFlag] Tayikistán§!, y cree firmemente que un nuevo estado debe emerger de nuestra tierra. Algunos se unen a grupos como el £TAJ_kingdom §H Partido Renacimiento Islámico§!, y a pesar de no ser una insurgencia activa, las cadenas ocasionales de ataques pueden aparecer ligadas al azar a la organización. Los factores económicos, como el bajo PIB o el desempleo, hacen que la gente sea más propensa a salir de la nación y potencialmente se radicalice. Ciertas acciones políticas como la secularización pueden aumentar £TAJ_kingdom §HIRP Influence§!. Si en cualquier momento £TAJ_kingdom §HLa influencia del IIRP§! llega al 100%, aparecerán movimientos que intentarán desestabilizarnos, la región y nuestros socios cercanos.\n\n£TAJ_kingdom §HIRP§! Influencia: [?TAJ_radical_influence]%"
 TAJ_deploy_national_guard: "Desplegar la Guardia Nacional de [TAJ.GetFlag]"
 TAJ_deploy_national_guard_desc: "Al desplegar la Guardia Nacional podemos asegurar que se reprima la actividad política islamista, pero puede ser costoso hacerlo."
 TAJ_recall_national_guard: "Hacer volver a la Guardia Nacional"
 TAJ_recall_national_guard_desc: "Al hacer volver a la Guardia Nacional, la actividad política islamista podría volver a crecer, pero al menos nos quedará algo de dinero en el tesoro."
 TAJ_ban_the_irp: "Denunciar al £TAJ_kingdom  Partido del Renacimiento Islámico"
 TAJ_ban_the_irp_desc: "Ha llegado el momento de que nuestro gobierno denuncie públicamente al £TAJ_kingdom Partido Renacimiento Islámico, y lo prohíba participar en amplias actividades políticas contra el Estado."
 TAJ_radicalism_system_2: "Onda expansiva de la Umma"
 TAJ_radicalism_system_2_desc: "\n£TAJ_desctext_irp2\n\n\n\nLa caída del £TAJ_kingdom §H Partido Renacimiento Islámico§!, y el continuo progreso de la sociedad tayika ha llevado al surgimiento de nuevos movimientos extremistas más radical que el de sus predecesores. £generic_Caliphate_small §H (IS-KP) Estado Islámico - Khorasan§! se ha levantado ahora para llenar el vacío dejado por la caída del IRP, y son mucho más radicales que nunca. Debemos limitar el crecimiento de la ideología salafista en nuestra nación, y mantenerla §H por debajo del 20%§! en todo momento. En cualquier momento si la popularidad salafista es más de §H20%§!, entonces [TAJ.GetFlag] Tayikistán se convertirá en una guerra civil. Seremos capaces de terminar esta insurgencia si traemos nuestra §H Amenaza del Terror§! a §GNegligible§! y nuestra §HRadicalización§! a §GLow§!."
 TAJ_open_menu: "Abrir menú de sistemas internacionales"
 TAJ_open_menu_desc: "¿Confundido dónde encontrar nuestra actual amenaza del radicalismo y el terrorismo? Localice el icono del globo en la parte inferior derecha de su pantalla, o haga clic en esta decisión y diríjase a la pestaña 'Counter-Terror'."
 TAJ_arrest_iskp: "Arrestar £generic_Caliphate_small  a la cúpula del IS-KP"
 TAJ_arrest_iskp_desc: "Dada su falta de apoyo, podemos lograr fácilmente que los locales revelen la ubicación de la dirigencia del EI-K en el país y detenerla."
 iranic_confederation: "Reunificación de las naciones iranias"
 iranic_confederation_desc: "\n£TAJ_desctext_paniranist\n\n\n\n§HLos pueblos irónicos§! se separaron unos de otros a través de diversas guerras en la historia. Primero por la conquista de Alexander, y luego la invasión árabe. Desde entonces, §HIránic§! personas han sido incapaces de unificar bajo una bandera y por lo tanto han sido limitadas en su capacidad para forjar un estado poderoso en el mundo. §HLos movimientos de Pan-Iránic§! surgieron primero en [PER.GetFlag] §H Iran§! en los años 50 y luego se extendieron a [AFG.GetFlag] §HAfganistán§! y [TAJ.GetFlag] §HTayikistán§!, lo que dio lugar a la supresión de las costumbres y el lenguaje iraníes por parte de la Unión Soviética. Seremos capaces de enviar misiones diplomáticas a países que tienen §H gobiernos pan-iranistas§!, y comenzaremos los preparativos para la §HReunificación§! de nuestros estados."
