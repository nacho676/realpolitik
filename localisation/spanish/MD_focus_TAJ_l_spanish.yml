 IRN_announce_iranic_integration: "Anunciar la integración social"
 IRN_announce_total_intergation: "Anuncio Unificación Total"
 IRN_relocation_of_iranic_capital: "¿Traslado de la capital?"
 IRN_ultimatum_to_pakistan: "Enviar un ultimátum a [PAK.GetFlag] Pakistán"
 IRN_ultimatum_to_turkey: "Enviar un ultimátum a [TUR.GetFlag] Turquía"
