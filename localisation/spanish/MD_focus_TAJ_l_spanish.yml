 IRN_ultimatum_to_armenia: "Enviar un ultimátum a [ARM.GetFlag] Armenia"
 TAJ_badakhshani_unrest: "[BDA.GetFlag] El Badakhshan Faultline"
 TAJ_badakhshani_unrest_desc: "\n£TAJ_desctext_BDA\n\n\n\nEl pueblo de [BDA.GetFlag] §HGorno-Badakhshan§! se desarrolló diferentemente que el resto del mundo. \n[TAJ.GetFlag] §HTayikistán§!, preservando su propia identidad distinta. Esto ha provocado algunos problemas administrativos para nuestro gobierno en la región, ya que los enfrentamientos entre las fuerzas de seguridad y los manifestantes no son raros. Si bien no hay riesgo de una revuelta armada activa, la región seguirá consumiendo nuestros arsenales de armas y mano de obra.\n\n[BDA.GetFlag] §HBadakhshani§! Unrest: [?TAJ_badakhshan_unrest_var]%"
 TAJ_subsidies_in_badakhshan: "Conceder subsidios en [BDA.GetFlag] Gorno-Badajshán"
 TAJ_subsidies_in_badakhshan_desc: "Podemos conceder subvenciones a elementos esenciales como la alimentación, la medicina y la atención médica para mejorar la imagen de nuestros gobiernos en la región."
 TAJ_monopolize_state_industries: "Monopolizar las industrias de Badajshán"
 TAJ_monopolize_state_industries_desc: "Las inversiones chinas en la región dejan a las industrias maduras para su monopolización por nuestro gobierno."
 TAJ_visit_the_regional_governor: "Visita al Gobernador Regional"
 TAJ_visit_the_regional_governor_desc: "Al visitar al gobernador regional, podemos reafirmar el apoyo federal a su autonomía y a sus gobiernos locales."
 TAJ_sack_regional_governor: "Destituir al gobernador regional"
 TAJ_sack_regional_governor_desc: "Tener un gobernador pamiri no nos ayuda a mantener un control suficiente de la región; en su lugar debemos centrarnos en sustituir al gobernador por uno tayiko."
 TAJ_dig_for_badakhshani_resources: "Excavar en busca de recursos de Badajshán"
 TAJ_dig_for_badakhshani_resources_desc: "La región tiene muchas joyas y joyas preciosas que están esperando ser minadas. Y a un lado de algunos lugareños enojados, ¿qué nos impide cavarlos?"
 TAJ_conscript_badakhshani_troops: "Reclutar tropas de Badajshán"
 TAJ_conscript_badakhshani_troops_desc: "Los badajshaníes no son distintos de los demás tayikos [TAJ.GetFlag] que residen en la nación, y debemos tratar a todos por igual. Todos deben servir en el ejército de la nación; al fin y al cabo es su deber nacional."
 TAJ_permit_religious_freedoms: "Permitir las Libertades Religiosas"
 TAJ_permit_religious_freedoms_desc: "Pese a que la mayor parte de [TAJ.GetFlag] Tayikistán practica el islam suní, los badajshaníes siguen una corriente del chiismo distinta de la del resto de la nación."
 TAJ_badakhshani_representation: "Mejorar la representación de Badakhshani"
 TAJ_badakhshani_representation_desc: "Quizá el pueblo badajshaní esté algo infrarrepresentado en los asuntos del Estado y le vendría bien un poco más de reconocimiento en el gobierno central."
 TAJ_permit_pamiri_language: "Permiso Lengua Pamiri"
 TAJ_permit_pamiri_language_desc: "Al permitir el idioma pamiri, podemos dar al pueblo badajshaní un sentido de identidad sin miedo a represalias del Estado."
 TAJ_restrict_troop_movement: "Restringir el movimiento de tropas"
 TAJ_restrict_troop_movement_desc: "Al restringir el movimiento de tropas en Badajshán, podemos mostrar a los locales que no queremos hacerles daño."
 TAJ_infrastructure_of_badakhshan: "Infraestructura de Badakhshan"
 TAJ_infrastructure_of_badakhshan_desc: "Los Badakhshani han estado pidiendo mejores carreteras, hogares y calidad de vida. Proporcionándoles eso podemos avanzar un paso adelante en la reconciliación."
 TAJ_form_badakhshani_armed_forces: "Formar las Fuerzas de Defensa Badajshaníes"
 TAJ_form_badakhshani_armed_forces_desc: "El pueblo de Badakhshani tiene derecho a defenderse, y no siempre tendremos los recursos disponibles para brindarles esa asistencia."
 TAJ_khorugh_accord: "El Acuerdo de Khorugh"
 TAJ_khorugh_accord_desc: "Ha llegado el momento de reunirse con representantes de Badakhshani y acordar los términos del acuerdo de Khorugh. Este es un paso importante hacia la descentralización nuestro control sobre la región de Badakhshan."
 TAJ_settle_the_unrest: "Resolver el descontento"
 TAJ_settle_the_unrest_desc: "Ha llegado el momento de resolver los disturbios que han estado asolando la región de Gorno-Badakhshan desde la independencia de nuestra nación."
 TAJ_badakhshan_area: "Disturbios en Badakhshan"
 TAJ_situation_in_pamirs: "Situación en Pamirs"
 TAJ_situation_in_pamirs_desc: "\n£TAJ_desctext_pamir\n\n\n\nComo resultado de malas decisiones cuando llegó al alto mando soviético durante la configuración de las fronteras §HPamir§!, se crearon muchos exclaves y como resultado, las ciudades fueron desconectadas de sus naciones continentales. La falta de negociaciones y compromisos ha ocasionado que la violencia erupcione ocasionalmente entre [KYR.GetFlag] [KYR.GetName], [TAJ.GetFlag] Tayikistán y [UZB.GetFlag] Uzbekistán. Para atacar y tomar un estado §HPamir§!, primero debemos satisfacer las necesidades logísticas y luego atacar. Si logramos tomar un estado y mantenerlo continuamente durante §H9 meses§!, entonces ese estado será nuestro §Hpermanentemente§!."
 TAJ_attack_batken: "Lanzar un asalto a Batken"
 TAJ_attack_batken_desc: "Striking Batken nos permitirá crear un corredor de tierra y fácil acceso a los Pamires del Norte."
 TAJ_batken_occupation: "Ocupación de Batken"
 TAJ_batken_occupation_desc: "Debemos mantener a Batken durante unos 270 días antes de que los lugareños finalmente puedan aceptar la regla de Tajik sobre su territorio."
 TAJ_attack_pamir: "Lanzar un asalto a Pamir"
 TAJ_attack_pamir_desc: "Striking Pamir nos permitirá crear un corredor de tierra y fácil acceso a los Pamires del Sur, y Batken."
 TAJ_pamir_occupation_desc: "Debemos mantener a Pamir durante unos 270 días antes de que los lugareños finalmente puedan aceptar la regla de Tajik sobre su territorio."
 TAJ_pamir_area: "Región de Pamirs"
 TAJ_internal_policies: "Políticas de [TAJ.GetFlag] Tayikistán"
 TAJ_communist_demand: "Exigencias del Partido Comunista"
 TAJ_communist_demand_desc: "Como resultado de la formación de la UTO durante la guerra civil, hemos prometido algunas concesiones a los comunistas..."
 TAJ_islamist_demand: "Exigencias del IRP"
 TAJ_islamist_demand_desc: "Como resultado de la formación de la UTO durante la guerra civil, hemos prometido algunas concesiones al IRP..."
 TAJ_nationalist_demand: "Exigencias del Partido Democrático"
 TAJ_nationalist_demand_desc: "Como resultado de la formación de la UTO durante la guerra civil, hemos prometido algunas concesiones al Partido Democrático..."
 TAJ_uzbekistan_puppet: "Establecer la Región Autónoma Uzbeka de [UZB.GetFlag]"
 TAJ_uzbekistan_puppet_desc: "Tras la justa revuelta en Uzbekistán, por fin podemos afirmar el control de nuestra administración sobre la nación."
 TAJ_soviet_onion: "El martillo moldea la sirena"
 TAJ_soviet_onion_desc: "\n£TAJ_desctext_commie\n\n\n\nTras el colapso de la Unión Soviética, muchos campesinos tayikos y gente rural reminaron sobre los días más antiguos de un estado soviético unificado. Es hora de realizar el verdadero potencial de nuestro estado, y los que nos rodean, y establecer un Consejo de Trabajadores en la región del Asia Central para mostrar al mundo que no dependemos de nadie sino de nuestra propia fuerza."
 TAJ_workers_council_of_central_asia: "Establecer el Consejo de Trabajadores de Asia Central"
 TAJ_The_Undeclared_Cold_War: "La guerra fría no declarada"
 TAJ_The_Undeclared_Cold_War_desc: "\n£TAJ_desctext_cold_war_banner\n\n\n\n[TAJ.GetFlag] Tayikistán preside una postura precaria, atrapada entre la sombra inminente de [UZB.GetFlag] Las aspiraciones centroasiáticas de Uzbekistán y el aumento del movimiento islámico [UZB.GetFlag] Uzbekistán (IMU). El IMU un grupo radical salafista se ha arraigado dentro de regiones remotas y las montañas del centro \n[TAJ.GetFlag] Tayikistán, explotación [TAJ.GetFlag] La frágil seguridad de Tayikistán para seguir sus deseos militantes. Sus operaciones no sólo desestabilizan nuestro estado sino que también corren el riesgo de provocar [UZB.GetFlag] Uzbekistán en acción militar.\n\nLa situación es terrible. Muchos generales temen que el comportamiento de la Rogue del IMU pueda provocar conflictos. [UZB.GetFlag] La postura agresiva de la hegemonía de Uzbekistán propone una amenaza existencial que debemos deshacernos de una línea y caminar cuidadosamente."
