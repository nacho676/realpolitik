l_spanish:
 tajikistan_focus: "Árbol de enfoque tayiko"
 TAJ_rahmons_rotting_fruit: "La fruta podrida de Rahmon"
 TAJ_rahmons_rotting_fruit_desc: "Emomali Rahmon ha estado al mando de la política tayika desde 1994 y ha gobernado la nación desde entonces. La guerra civil que tuvo lugar a principios de los años 90 todavía resuena en muchos tayikos, la corrupción y el soborno son moneda corriente en el país y una volátil guerra civil afgana está generando temores en el seno del gobierno. Dependerá de nuestra administración y de nuestras políticas resolver estos peligrosos acontecimientos."
 TAJ_his_excellency: "Su excelencia"
 TAJ_his_excellency_desc: "Su Excelencia es un título formal de respeto que transmite la dignidad y autoridad de su liderazgo. Emomali Rahmon se considera el corazón del Estado, lo que lo lleva a una espiral de esfuerzos para reforzar esa identidad."
 TAJ_leader_of_nation: "Líder de la nación"
 TAJ_leader_of_nation_desc: "Buenas noches, queridos ciudadanos de Tayikistán. El líder inquebrantable Emomali Rahmonov encarna (Coughs... Ejem) la misma autoridad y unidad de nuestra gran nación. (Sound of boots stomping) Él es la columna vertebral del pueblo tayiko, el pilar firme sobre el cual nuestro futuro se encuentra. Bajo su guía, Tayikistán se mueve hacia un mañana más brillante. (Troops entra y permanece firmemente en su lugar) Que su gobierno perdura durante mil años, y que su liderazgo no pueda iluminar nuestro camino hacia adelante. ¡Abajo el Líder! ('La emisión continúa con una marcha militar tocando en el fondo.')"
 TAJ_security_troubles: "Reforzar la seguridad del Estado"
 TAJ_security_troubles_desc: "Nuestros agentes se han infiltrado en todos los aspectos del estado. Nos mantenemos alerta, sabiendo que no podemos ser comprometidos desde ningún ángulo. Mientras nuestros enemigos acechan, listos para sembrar el caos, debemos estar preparados para cualquier intento de revolución de colores."
 TAJ_rejuvinate_the_opposition: "Rejuvenecer la oposición"
 TAJ_rejuvinate_the_opposition_desc: "Ha llegado el momento de derrocar a Rahmon y sus compinches; la corrupción y el nepotismo ya no gobernarán en Tayikistán, sino que prevalecerán la ley y el orden."
 TAJ_good_thoughts_good_words_good_deeds: "Buenos pensamientos, buenas palabras, buenas acciones"
 TAJ_good_thoughts_good_words_good_deeds_desc: "El Partido Democrático de Tayikistán, una de las facciones que lucharon en la guerra civil de la década de 1990, defiende valores paniranistas y nacionalistas y promete colocar a Tayikistán en la cima de la política y el poder regionales."
 TAJ_tajik_silicon_valley: "Silicon Valley de Tayikistán"
 TAJ_tajik_silicon_valley_desc: "Gracias a nuestra innovación y modernización, podremos crear un nuevo centro tecnológico que podrá considerarse el Silicon Valley de Tayikistán y que, gracias a nuestras esperanzas y oraciones, algún día podrá superar al estadounidense."
 TAJ_exploit_orionbank: "Explotar Orienbank"
 TAJ_exploit_orionbank_desc: "Orienbank, una de las instituciones más corruptas de la era de Emomali, todavía existe hoy en día. Podremos utilizar su riqueza en nuestro propio beneficio, sin importar quién sea el gerente del banco."
 TAJ_restrict_flights_to_russia: "Restringir vuelos a Rusia"
 TAJ_restrict_flights_to_russia_desc: "§Y'...¿Y a dónde crees que vas?'§!\n\nTendremos que poner una parada inmediata a todos los vuelos de Tayikistán a Rusia como forma de preservar nuestra población y seguir construyendo una fuerza de trabajo fuerte."
 TAJ_integration_of_the_agrarian_party: "Integración del Partido Agrario"
 TAJ_integration_of_the_agrarian_party_desc: "El Partido Agrario es bastante popular entre la clase campesina, y aunque han sido marginados en los últimos años, podremos reunir su apoyo en torno a nuestro gobierno con más facilidad si tenemos a sus representantes a nuestro lado."
 TAJ_redetermine_dress_code: "Redefinir el código de vestimenta"
 TAJ_redetermine_dress_code_desc: "En los últimos años, el código de vestimenta se ha vuelto cada vez más flexible, lo que ha permitido que las vestimentas islámicas se generalicen en la sociedad tayika. Sin embargo, podemos modificarlo para promover la vestimenta iraní."
 TAJ_revise_religious_laws: "Revisiones de las Leyes Religiosas"
 TAJ_revise_religious_laws_desc: "Desde hace algún tiempo, la religión ha sido una parte desenfrenada de nuestra constitución. Si no ponemos algunas regulaciones sobre lo que se puede hacer, pronto podríamos caer en las garras del salafismo y su ideología destructiva."
 TAJ_secure_badakhshani_support: "Apoyo seguro de Badakhshani"
 TAJ_secure_badakhshani_support_desc: "Los badajshaníes no están muy contentos con nuestro estado, especialmente después del desastre de la era Rahmon. Es hora de asegurar su apoyo una vez más."
 TAJ_regional_militias: "Desplegar Milicias Regionales"
 TAJ_regional_militias_desc: "Sin una fuerza de seguridad estable y fiable, no podremos mantener el orden. Mediante el establecimiento de milicias regionales podemos evitar que el gobierno se extienda en más zonas rurales, y todavía podemos garantizar el control sobre ellas."
 TAJ_heirs_of_the_samanids: "Herederos de los Samanids"
 TAJ_heirs_of_the_samanids_desc: "Los Samanid fueron una vez un imperio legendario en Asia Central. Sin embargo, es hora de que cumplamos su legado. ¡No debemos dejar que ningún pequeño estado artificial se interponga en el camino de nuestra hegemonía tayika!"
 TAJ_taj_pact: "El Pacto de TAJ"
 TAJ_taj_pact_desc: "§Y'Orden, seguridad, prosperidad'§!\n\nEl pacto TAJ, llamado después de la palabra para corona en Persian asegurará que podamos establecer una región segura y estable, tanto en Asia Central como en Oriente Medio."
 TAJ_summit_in_islamabad: "Cumbre en Islamabad"
 TAJ_summit_in_islamabad_desc: "Pakistán se está conformando para ser un jugador importante en el futuro de este planeta. Pronto tendremos que hacerles una invitación."
 TAJ_reach_out_to_uzbekistan: "Llegar a Uzbekistán"
 TAJ_reach_out_to_uzbekistan_desc: "Los uzbekos nos han estado limitando desde hace décadas. Si tenemos la intención de establecer una verdadera paz y estabilidad, tendremos que ser amigos."
 TAJ_iranic_confederation: "Esfuérzate para la Confederación Iraní"
 TAJ_iranic_confederation_desc: "§YUna tierra, un pueblo, un destino»§!\n\nSi queremos realmente cementar nuestro lugar en el mundo como una superpotencia, tendremos que esforzarnos por una Confederación Iraní. Unir el mundo iraní será la única manera."
 TAJ_summit_in_tehran: "Cumbre en Teherán"
 TAJ_summit_in_tehran_desc: "Teherán, la capital de Irán, será un lugar clave para nuestra nueva Confederación Iraní. Podemos celebrar allí una reunión para discutir los métodos de unificar a nuestras naciones con el tiempo."
 TAJ_begin_phase_one: "Inicio de la fase I"
 TAJ_begin_phase_one_desc: "La fase I será el primer y posiblemente el paso más importante, que nos permitirá difundir las ideas del Pan-Iranismo en toda la región donde residen actualmente los iraníes."
 TAJ_support_anti_clerical_movements_PER: "Apoyo a los movimientos anticlóricos en Irán"
 TAJ_support_anti_clerical_movements_PER_desc: "Los clérigos iraníes son un obstáculo importante para nuestras aspiraciones de lograr una nación iraní unificada. Su ideología atrasada y su sed de poder nunca nos permitirán alcanzar tal cosa, y deben ser eliminados."
 TAJ_AFG_bring_pan_iranists: "Apoyo a los Movimientos Pan-Iranistas Afganos"
 TAJ_AFG_bring_pan_iranists_desc: "Afganistán no ha tenido muchos movimientos paniristas en su historia. Sin embargo, podemos cambiar eso. Mediante la financiación de ciertos grupos podemos potencialmente hacer que cambien sus puntos de vista y posturas, tal vez transformándose en un movimiento pan-iranista en su conjunto."
 TAJ_reinforce_the_iranian_world: "Reforzar el mundo iraní"
 TAJ_reinforce_the_iranian_world_desc: "Los países iraníes deben reunirse y comprender la importancia de la amistad y la estabilidad. Sólo si nos unimos el uno al otro podremos sobrevivir, no hay otro camino."
 TAJ_greater_iranian_world: "El mundo iraní más grande"
 TAJ_greater_iranian_world_desc: "Ha llegado el momento de crear un estado iraní más grande. Mediante la unificación, podremos declararnos como una verdadera casa de poder en el mundo."
 TAJ_maintianing_tajik_independence: "Mantener la independencia de Tayikistán"
 TAJ_maintianing_tajik_independence_desc: "Nuestra soberanía es lo que importa sobre todo. Si no podemos asegurar nuestra propia autonomía, ¿entonces qué bien somos para el pueblo?"
 TAJ_target_russian_lobby: "Objetivo del Lobby Ruso"
 TAJ_target_russian_lobby_desc: "No podemos dejar que los rusos obtengan otro lugar en Tayikistán, especialmente después de su dominio opresivo sobre nuestra nación bajo el imperio y los soviéticos después de ellos."
 TAJ_legacy_of_uto: "Legado de la OTU"
 TAJ_legacy_of_uto_desc: "¡El movimiento de resistencia nunca será olvidado, y nuestros grandes sacrificios que hemos hecho deben ser inmortales a lo largo de la historia!"
 TAJ_dislodge_oligarchs: "Dislodge los Oligarchs"
 TAJ_dislodge_oligarchs_desc: "§G¡Al diablo contigo!»§!\n\nDebemos librar al gobierno y a la nación de cualquier tipo de influencia oligárquica para asegurarnos de que no terminemos como los rusos u otras naciones en Asia Central."
 TAJ_grants_to_new_bussinesses: "Subvenciones para nuevos negocios"
 TAJ_grants_to_new_bussinesses_desc: "Sin nuevas empresas no podemos garantizar una economía estable. Por lo tanto, haremos algunos sacrificios a corto plazo para que algunas de nuestras personas se levanten y corran."
 TAJ_create_revolutionary_command_corps: "Crear el Cuerpo de Mando Revolucionario"
 TAJ_create_revolutionary_command_corps_desc: "Necesitamos crear un ejército que esté dispuesto a proteger nuestra revolución por todos los medios necesarios, no puede haber compromisos."
 TAJ_young_republic: "La joven república"
 TAJ_young_republic_desc: "Sólo a través del poder de la urna podemos asegurar la seguridad de nuestro pueblo para las generaciones venideras. Democratizaremos a favor de un mejor mañana."
 TAJ_liberty_through_strength: "La libertad mediante la fuerza"
 TAJ_liberty_through_strength_desc: "No podemos dejar el destino de la nación a una «elección» de un montón de monedas, sino que tendremos que asegurar la libertad de nuestro pueblo mediante la fuerza, independencia y soberanía."
 TAJ_reinforce_islamic_identity: "Reforzar una identidad islámica"
 TAJ_reinforce_islamic_identity_desc: "El Islam es y será la única religión que representa nuestro estado. No podemos dejar que las ideas extranjeras y el pensamiento afecten la creencia de nuestro pueblo, nuestra religión nos protegerá de las intrusiones extranjeras."
 TAJ_tajik_zoroastrian_symbol: "Zoroastrianismo como una religión simbólica"
 TAJ_tajik_zoroastrian_symbol_desc: "Aunque el Zoroastrismo en su conjunto se ha convertido principalmente en una religión del pasado, no podemos dejar que las ideas detrás de él desaparezcan. A través de buenas palabras, buenos muertos y buenos pensamientos nuestra nación prosperará."
 TAJ_secularize_tajik_society: "Secularizar la sociedad tayika"
 TAJ_secularize_tajik_society_desc: "Reunirse detrás de una religión es una idea tonta, ya que siempre causará alguna forma de división en medio de la sociedad. Podemos asegurar a nuestras naciones el futuro adoptando un modelo secular, y nada menos."
 TAJ_reinforce_claims_on_pamir: "Reforzar las reclamaciones de los Pamires"
 TAJ_reinforce_claims_on_pamir_desc: "No podemos dejar que nuestro control en los Pamirs entre en el abismo. Debemos hacerle saber al mundo quiénes son los verdaderos propietarios de la región. Los chinos no podrán, no pueden y no deben tener una posición en Gorno-Badakhshan."
 TAJ_ban_russian_language: "Prohibir el idioma ruso"
 TAJ_ban_russian_language_desc: "§Y¿Qué hay de ucraniano?'§!\n\nNo permitiremos que esos imperialistas rusos hablen obtengan ninguna clase de influencia cultural sobre nuestro estado, el lenguaje Farsi prevalecerá como el único y verdadero lenguaje del gran y honorable pueblo tayiko."
 TAJ_revolutionary_nationalism: "Nacionalismo Revolucionario"
 TAJ_revolutionary_nationalism_desc: "moldearemos el patriotismo en nuestra nación alrededor de la gran revolución de nuestro estado. No podemos dejar que la ideología ciega guíe a nuestro pueblo, necesitamos un símbolo para seguir adelante."
 TAJ_the_farsi_language: "Colocar el idioma Farsi"
 TAJ_the_farsi_language_desc: "El lenguaje Farsi ha reinado supremo en nuestra nación durante miles de años. Pondremos de relieve la importancia del lenguaje, y aplaudimos su papel en la sociedad para que nuestro pueblo no olvide su identidad."
 TAJ_power_of_prayer: "El poder de la oración"
 TAJ_power_of_prayer_desc: "Sólo a través de la oración nuestra nación encontrará consuelo en el mundo. Sin el islam, Tayikistán no es nada, no puede ser nada y no habría sido nada."
 TAJ_cultural_reset: "Cultural"
 TAJ_cultural_reset_desc: "Nuestra sociedad confía demasiado en el patriotismo al estado tayiko y las ideas extranjeras. Ha llegado el momento de poner fin a esto, y en cambio pondrá énfasis en los ideales islámicos."
 TAJ_nazarzodas_ascension: "Nazarzoda's Ascension"
 TAJ_nazarzodas_ascension_desc: "El general Nazarzoda puede ser el único que conduce a la nación a la prosperidad. Sin él, la fiesta se desmoronará. Es hora de que él y sus partidarios tomen lo que es legítimamente suyo."
 TAJ_hoji_halim: "Hoji Halim"
 TAJ_hoji_halim_desc: "Apodado como 'Hoji Halim', Nazarzoda cementará su papel en nuestra nación como el líder de una vez por todas, porque todos sus buenos rasgos ciertamente superan a los ligeramente negativos."
 TAJ_army_of_loyalists: "Un ejército de loyalistas"
 TAJ_army_of_loyalists_desc: "§Y'Ready, Sir'§!\n\nUn ejército de leales alineará las calles de Dushanbe para mostrar su apoyo a Hoji Halim y su gobierno. Al igual que su ejército, esta gente estará dispuesta a morir por él y el partido."
 TAJ_the_partys_legacy: "El Legado del Partido"
 TAJ_the_partys_legacy_desc: "El partido en su conjunto no puede ser delineado por un solo individuo. Si permitimos que se construyan cultos de personalidad, entonces corremos el peligro de la pluralidad de nuestra representación."
 TAJ_seeking_treatment_for_nuri: "Tratamientos de búsqueda para Nuri"
 TAJ_seeking_treatment_for_nuri_desc: "Nuestro amado líder Nuri está en grave peligro de sucumbir a su enfermedad. Tendremos que buscar posibles métodos de tratamiento para extender su vida y dominio, por mucho tiempo que podamos."
 TAJ_our_brotherhood: "Nuestra Hermandad"
 TAJ_our_brotherhood_desc: "No podemos olvidar la Hermandad Islámica, nuestra hermandad. Ahora debemos utilizar nuestros recursos para ayudar a nuestros hermanos a lograr justicia y prosperidad para su pueblo."
 TAJ_mending_judiciary: "De la Judicatura"
 TAJ_mending_judiciary_desc: "La reputación del sistema judicial en nuestra nación ha estado muy empañada durante las muchas décadas, ya que el gobierno de Rahmonov y sus compinches habían destruido cualquier forma de estado de derecho en el estado. Es hora de arreglar eso."
 TAJ_hold_public_trials: "Realizar juicios públicos"
 TAJ_hold_public_trials_desc: "El castigo público es el único castigo adecuado para aquellos que corrompieron a nuestra nación, y nuestro pueblo debe ser capaz de presenciarlo con sus propios ojos!"
 TAJ_reshuffle_military_cabinet: "Rehabilitación del Gabinete Militar"
 TAJ_reshuffle_military_cabinet_desc: "Ciertamente, casi seguro, hay algunos idiotas en el gabinete militar. Debemos averiguar de primera mano cambiando las cosas un poco para hacerlos más leales."
 TAJ_secure_the_supreme_assembly: "Asegurar la Asamblea Suprema"
 TAJ_secure_the_supreme_assembly_desc: "Sin el apoyo de la asamblea suprema, no tendremos la legitimidad que deseamos. Al establecer una sólida base de apoyo entre los miembros, podremos acercarnos a nuestro objetivo."
 TAJ_parliamentary_model: "Seguir un modelo parlamentario"
 TAJ_parliamentary_model_desc: "La representación es la mejor forma de gobierno, y sin ella, pareceremos usurpadores. Es hora de que permitamos una democratización adicional de la sociedad tayika por el bien de todos."
 TAJ_placating_the_ulema: "Apoyo al Ulema"
 TAJ_placating_the_ulema_desc: "Los Ulemas son de quienes se deriva nuestra legitimidad. Si somos malhumorados por ellos, entonces ciertamente se nos garantizará un final rápido. Al darles lo que quieren, podremos ganar su apoyo."
 TAJ_gulfs_bankroll: "El Bankroll del Golfo"
 TAJ_gulfs_bankroll_desc: "§G Dinero, dinero, dinero«§!\n\nLos estados del Golfo, y más específicamente [SAU.GetName] tienen mucha riqueza sentada a sus puertas. Haremos que inviertan en nosotros y nos abonen para poder conseguir algo de ese capital que están perdiendo."
 TAJ_islamic_sceince: "Islammic Science"
 TAJ_islamic_sceince_desc: "Hay quienes cavan el Islam y la ciencia y son incompatibles, pero no podrían estar más equivocados. Si la historia ha demostrado algo, es que los estudiosos islámicos han creado las bases de la ciencia y las matemáticas que muchas naciones europeas y occidentales basan sus universidades e institutos educativos."
 TAJ_pass_out_grants: "Subvenciones & Becas"
 TAJ_pass_out_grants_desc: "Si queremos que nuestro pueblo sea educado, entonces tendremos que darles algún tipo de ayuda para ayudar a amortiguar la carga financiera."
 TAJ_entrance_of_luxury: "La entrada del lujo"
 TAJ_entrance_of_luxury_desc: "Aunque se supone que somos modestos, un poco de lujo nunca podría doler, especialmente porque estamos tratando de reparar la imagen de una Tayikistán atrasada."
 TAJ_tests_of_loyalty: "Juicios de lealtad"
 TAJ_tests_of_loyalty_desc: "Tendremos que realizar ensayos y pruebas encubiertas entre algunos miembros del gobierno para garantizar su lealtad. No podemos dejar que los traidores se levanten entre nuestras filas."
 TAJ_a_new_era: "Una nueva era"
 TAJ_a_new_era_desc: "Una nueva era está sobre nosotros, una libre de corrupción y nepotismo. Construiremos una nueva Tayikistán junto con el mundo, donde todos de cualquier lugar son bienvenidos!"
 TAJ_seeking_foreign_aid: "Buscar ayuda extranjera"
 TAJ_seeking_foreign_aid_desc: "No podemos reconstruir Tayikistán solo, debemos hacer una petición de ayuda del mundo. Seguramente alguien nos escuchará y nos ayudará."
 TAJ_distance_from_CIS: "Mantener la distancia de la CEI"
 TAJ_distance_from_CIS_desc: "No podemos asociarnos con esas naciones de la CEI. Tendremos que distinguirnos de ellos, y dibujar una línea clara entre nosotros."
 TAJ_purging_rahmons_cronies: "Purging Rahmon's Cronies"
 TAJ_purging_rahmons_cronies_desc: "Los agentes del antiguo gobierno todavía están activos en la actual administración, y deben ser tratados rápidamente si queremos evitar cualquier problema."
 TAJ_reach_out_to_gcc: "Llegar al GCC"
 TAJ_reach_out_to_gcc_desc: "El futuro de nuestra nación y los estados del CCG son uno, tendremos que establecer fuertes lazos con ellos para prosperar."
 TAJ_ushering_in_the_sharia: "Ushering en sharia"
 TAJ_ushering_in_the_sharia_desc: "Ha llegado el momento de que la pureza gobierne nuestra nación, no reglas artificiales. Usaremos el Corán como base para nuestra gobernanza, y nuestro pueblo verá la verdadera justicia."
 TAJ_economic_islamization: "Islamifica la economía"
 TAJ_economic_islamization_desc: "Una economía islámica es el único buen modelo económico. Precios bajos de interés, bancos justos, ¿qué más puede pedir?"
 TAJ_islamic_renaissance: "An Islamic Renaissance"
 TAJ_islamic_renaissance_desc: "Ha llegado el momento de declarar el renacimiento islámico, aquí en el corazón del mundo islámico, Tayikistán. Los uzbekos serán los primeros en sentir la peor parte de este renacimiento, justo en su casa."
 TAJ_najot: "Papeles de Najot"
 TAJ_najot_desc: "Nuestro propio periódico estará seguro de ayudar al pueblo tayiko a mantenerse informado con todas las noticias Tajik, y global. Najot será un nombre que todas las bodegas de la casa vendrán a amar."
 TAJ_manage_badakhshan_front: "Administración del Frente Badakhshan"
 TAJ_manage_badakhshan_front_desc: "Ha habido bastantes problemas viniendo de la región de Badakhshan, es hora de que hagamos algo al respecto."
 TAJ_supporting_shiites_in_badakhshan: "Apoyo a los chiítas en Badakhshan"
 TAJ_supporting_shiites_in_badakhshan_desc: "Muchos que residen en Badakhshan son Shia, y como tal debemos mirar nuevas formas de apaciguarlos."
 TAJ_alignment_with_tehran: "Alineación con Teherán"
 TAJ_alignment_with_tehran_desc: "El gobierno iraní es el único otro verdadero gobierno islámico en el mundo, y debemos tratar de ponerse de su lado bueno presentando nuestra aplicación al eje de la resistencia."
 TAJ_centralization: "Enfoque sobre centralización"
 TAJ_centralization_desc: "Sin centralización, no tendremos verdadero control sobre nuestro estado. Debemos centralizar el estado para mantener la seguridad en toda la nación."
 TAJ_axis_of_resistance: "El eje de la resistencia"
 TAJ_axis_of_resistance_desc: "Ha llegado el momento de solicitar la entrada en el Eje de Resistencia. La voluntad iraní seguramente abrazará a sus hermanos tayikos en la lucha contra el imperialismo."
 TAJ_anti_afghan_rhetoric: "Retórica antiafghan"
 TAJ_anti_afghan_rhetoric_desc: "Esos afganos en nuestro sur han causado ya más que suficientes problemas, ha llegado el momento de lidiar con ellos."
 TAJ_our_way_of_life: "Nuestro Camino de la Vida"
 TAJ_our_way_of_life_desc: "No podemos dejar ir nuestro modo de vida, en cambio, debemos fortalecerlo y cementarlo en la sociedad tayika. No podemos dejar que algunos rebeldes en Badakhshan nos lo quiten."
 TAJ_arrest_ring_leaders: "Arresten a los líderes del anillo"
 TAJ_arrest_ring_leaders_desc: "Debemos mantener a raya la influencia de Shi'ite, y al arrestar a los líderes clave del anillo de oposición podremos contenerlos un poco más."
 TAJ_limit_tehrans_influence: "Limita la influencia de Teherán"
 TAJ_limit_tehrans_influence_desc: "El gobierno iraní se ha sumido en nuestra política durante demasiado tiempo, es hora de que luchemos contra su influencia y aflojemos su control."
 TAJ_strict_isolationism: "Ísolationismo estricto"
 TAJ_strict_isolationism_desc: "§R¡Déjenme en paz, todos ustedes!»§!\n\nNo podemos seguir así, debemos mantenernos aislados del resto del mundo para proteger a nuestro pueblo."
 TAJ_central_asian_security_association: "Asociación de seguridad del Asia Central"
 TAJ_central_asian_security_association_desc: "La región se está desmoronando lentamente, sin embargo, podemos llegar a un acuerdo con los demás estados de la región y establecer una especie de paz en medio de todo este caos."
 TAJ_echoes_of_the_worker: "Ecos del Trabajador"
 TAJ_echoes_of_the_worker_desc: "Los ideales de la clase obrera deben resonar una vez más a través de Tayikistán. Al defender su causa, reafirmaremos nuestro compromiso con los trabajadores y aseguraremos que sus voces guíen nuestro futuro."
 TAJ_russian_doll: "La muñeca rusa"
 TAJ_russian_doll_desc: "Las capas de influencia de la era soviética siguen incrustadas en nuestra gobernanza. Debemos desentrañar cuidadosamente estas capas para determinar qué debe ser preservado y qué debe ser descartado."
 TAJ_strength_out_party_relations: "Strengthening Out-Party Relations"
 TAJ_strength_out_party_relations_desc: "Para solidificar nuestra posición, debemos establecer vínculos más firmes con grupos políticos externos que se ajusten a nuestra visión de Tayikistán y garanticen su apoyo en cuestiones regionales."
 TAJ_reinvite_diaspora: "Reinvitar la Diáspora"
 TAJ_reinvite_diaspora_desc: "Nuestros compatriotas exiliados representan un potencial sin explotar. Al invitarlos a regresar, podemos aprovechar sus conocimientos y habilidades para ayudar en la reconstrucción de nuestra nación. "
 TAJ_the_russogrid: "Russo Electrical Grid"
 TAJ_the_russogrid_desc: "§YSeñor, ¿puedo tomar algo por favor?»§!\n\nLa red de energía rusa es bastante confiable, y podemos asegurar una estable en Tayikistán si pedimos utilizarla, amablemente."
 TAJ_promote_soviet_heritage: "Promover el patrimonio soviético"
 TAJ_promote_soviet_heritage_desc: "El legado soviético es la base de nuestra identidad. Al celebrar esta herencia, podemos fomentar la unidad y el orgullo entre nuestro pueblo mientras reforzamos nuestras raíces ideológicas."
 TAJ_meeting_with_zugyanov: "Reunión con Zyuganov"
 TAJ_meeting_with_zugyanov_desc: "Comprometerse con el líder del Partido Comunista de la Federación de Rusia puede asegurar un valioso apoyo y orientación a medida que navegamos por los desafíos que vamos a plantear."
 TAJ_tajik_strongman: "El Tajik Strongman"
 TAJ_tajik_strongman_desc: "Un líder único e inflexible es necesario para guiar a Tayikistán a través de tiempos turbulentos. Este enfoque garantizará la estabilidad y una gobernanza decisiva."
 TAJ_reassert_tajik_independence: "Reafirmar la independencia de Tajik"
 TAJ_reassert_tajik_independence_desc: "Es hora de liberarse de las sombras de los poderes extranjeros y reclamar el lugar legítimo de Tayikistán como nación independiente y autodeterminada."
 TAJ_pivot_to_the_west: "Pivote hacia el oeste"
 TAJ_pivot_to_the_west_desc: "Explorar las relaciones con las naciones occidentales puede abrir nuevas vías para el crecimiento económico y la modernización, diversificando nuestras alianzas y oportunidades."
 TAJ_treaty_with_nato: "Tratado con la OTAN"
 TAJ_treaty_with_nato_desc: "Un acuerdo estratégico con la OTAN podría traer seguridad y legitimidad internacional, pero corre el riesgo de alienar a los aliados tradicionales."
 TAJ_abandon_cspu: "Abandonar el CPSU"
 TAJ_abandon_cspu_desc: "La ruptura de vínculos con los restos del Partido Comunista de la Unión Soviética puede ser un paso necesario para forjar nuestro propio camino único hacia adelante."
 TAJ_integrate_the_socdems: "Integrar a los socialdemócratas"
 TAJ_integrate_the_socdems_desc: "La cooperación con los socialdemócratas puede crear una amplia coalición, asegurando la estabilidad y una visión compartida para el futuro de Tayikistán."
 TAJ_blast_to_past: "Explosión al pasado"
 TAJ_blast_to_past_desc: "Revisiting the policies e ideales de nuestro pasado soviético podrían proporcionar valiosas lecciones y guía mientras reconstruimos nuestra nación"
 TAJ_wellbeing_of_tajiks: "El bienestar de los tayikos"
 TAJ_wellbeing_of_tajiks_desc: "El bienestar de nuestro pueblo debe ser priorizado sobre todo. Al abordar sus necesidades, podemos garantizar una Tayikistán próspera y unida."
 TAJ_fsb_advisees: "FSB Advisees"
 TAJ_fsb_advisees_desc: "Aceptar asesores del FSB de Rusia puede fortalecer nuestro aparato de seguridad, pero puede llegar a costa de nuestra independencia."
 TAJ_drive_out_the_chinese: "Conducir fuera de los chinos"
 TAJ_drive_out_the_chinese_desc: "La creciente influencia de China en nuestra región debe limitarse a salvaguardar la soberanía y los recursos de Tayikistán."
 TAJ_total_nationalization: "Total nacionalización"
 TAJ_total_nationalization_desc: "Una nacionalización completa de las industrias clave pondrá el control firmemente en manos del Estado, asegurando una distribución equitativa de los recursos."
 TAJ_invite_the_cis: "Invitar a la CEI"
 TAJ_invite_the_cis_desc: "El fortalecimiento de los vínculos con la Comunidad de Estados Independientes puede fomentar la cooperación regional y el crecimiento mutuo."
 TAJ_workers_of_the_world_unite: "¡Trabajadores del Mundo, Unite!"
 TAJ_workers_of_the_world_unite_desc: "Reigniting the spirit of international solidarity among workers will reinforce ouride commitment y expandir nuestra influencia"
 TAJ_the_secretary: "El Secretario"
 TAJ_the_secretary_desc: "Un secretario general capaz y leal es la piedra angular de cualquier partido comunista exitoso. Debemos asegurar que este papel esté lleno de la persona adecuada."
 TAJ_puppet_the_unions: "Marionetas de los sindicatos"
 TAJ_puppet_the_unions_desc: "Al controlar los sindicatos, podemos dirigir a la clase obrera hacia apoyar nuestras políticas y suprimir el disentimiento."
 TAJ_revert_the_economy: "Revertir la economía"
 TAJ_revert_the_economy_desc: "El regreso a una economía centralizada puede proporcionar la estabilidad y el control necesarios para reconstruir Tayikistán."
 TAJ_compromise_with_farmers: "Compromiso con los agricultores"
 TAJ_compromise_with_farmers_desc: "Al abordar las preocupaciones del sector agrícola, podemos asegurar su apoyo y garantizar la seguridad alimentaria para la nación."
 TAJ_tighten_drug_crackdown: "Aprieta el atajo de drogas"
 TAJ_tighten_drug_crackdown_desc: "El tráfico de drogas es una plaga en Tayikistán. Una represión más estricta es necesaria para proteger a nuestro pueblo y mantener el orden."
 TAJ_agrarian_domination: "Dominación Agraria"
 TAJ_agrarian_domination_desc: "Enfoque El desarrollo agrícola proporcionará una sólida base para nuestra economía y asegurar el bienestar de nuestra población rural."
 TAJ_closer_ties_with_afghanistan: "Ties más cercanos con Afganistán"
 TAJ_closer_ties_with_afghanistan_desc: "El fortalecimiento de nuestra relación con el Afganistán puede crear nuevas oportunidades para el comercio y la estabilidad regional."
 TAJ_reconciliation: "Reconciliación"
 TAJ_reconciliation_desc: "La curación de las relaciones horribles con los talibanes puede ser un paso importante que debemos adoptar, aunque sea difícil, es necesario."
 TAJ_eyes_in_the_back: "Ojos en la parte posterior de nuestras cabezas"
 TAJ_eyes_in_the_back_desc: "Para salvaguardar nuestra revolución, debemos permanecer vigilantes contra la traición y garantizar la lealtad dentro de nuestras filas."
 TAJ_reassert_tajik_indepndence: "Reafirmar la independencia tayika"
 TAJ_reassert_tajik_indepndence_desc: "No podemos dejar que la influencia extranjera entre en el gobierno. Tendremos que mantener la seguridad y soberanía de nuestros estados."
 TAJ_sympathizers_in_army: "Simpatizantes en el Ejército"
 TAJ_sympathizers_in_army_desc: "Podemos localizar a aquellos simpatizantes a la causa revolucionaria en el ejército, y tenerlos junto con nosotros y nuestras fuerzas."
 TAJ_befriend_chiefs_of_staff: "Los Jefes de Estado Mayor"
 TAJ_befriend_chiefs_of_staff_desc: "Al ser amigos de los individuos clave, seremos capaces de ganar sobre algunos del alto mando para desertar a nuestro lado."
 TAJ_surround_palace: "Alrededor del Palacio"
 TAJ_surround_palace_desc: "§R¡Salimos, sabemos que estás ahí!»§!\n\n¡Ese cobarde Rahmon se esconde en su palacio, y es el momento de rodearlo y tratarlo de una vez por todas!"
 TAJ_reclaiming_majlis: "Reclamando el Majlis"
 TAJ_reclaiming_majlis_desc: "Debemos organizar un asalto contra el Majlis y tomarlo bajo control. Tal victoria tendrá consecuencias inconmensurables contra el régimen de Rahmon."
 TAJ_tajik_revolution: "La revolución tayika"
 TAJ_tajik_revolution_desc: "§R¡Abajo el dictador!»§!\n\nHa llegado el momento, es hora de deshacernos del viejo y traer un nuevo orden en Tayikistán."
 TAJ_situation_in_pamir: "La situación en los Pamirs"
 TAJ_situation_in_pamir_desc: "§Y¡Lo quiero todo o nada de eso!»§!\n\nLa región del Pamir es bastante contenciosa, ya que tanto nosotros como los kirguís estamos luchando por el control de ella y sus recursos. Sin embargo, podemos cambiar el curso de la historia tomando diferentes medidas."
 TAJ_negotiate_agreement: "Negociar un acuerdo"
 TAJ_negotiate_agreement_desc: "No necesitamos la región de Pamir, sólo lo queremos. Necesitamos equilibrar nuestras necesidades y deseos en contra de cada uno y determinar lo que realmente importa en medio de todo esto. La paz suena mejor."
 TAJ_advance_troops: "Tropas de avance"
 TAJ_advance_troops_desc: "Al diablo con el [KYR.GetAdjective], obtendremos lo que queremos. Y si eso va a significar conflicto, entonces así sea!"
 TAJ_silent_erosion: "Silenciosa Erosión"
 TAJ_silent_erosion_desc: "Con el tiempo nuestra nación ha erosionado en un estado perpetuo de corrupción. Esto tendrá que ser abordado, o no."
 TAJ_change_in_stance: "A Cambio en la Stance"
 TAJ_change_in_stance_desc: "Ha llegado el momento de tomar medidas para evitar que la corrupción se difunda en el gobierno central, y el estado. Trabajaremos en arraigar a estos pocos problemáticos y construir una mejor Tayikistán."
 TAJ_purification_of_authority: "Purificación de la Autoridad"
 TAJ_purification_of_authority_desc: "Para acabar con la corrupción, necesitamos atacarla desde la raíz. Debemos purgar a aquellos individuos que están saqueando la riqueza de nuestros estados por ganancia personal."
 TAJ_cleansing_the_badge: "Limpieza de la placa"
 TAJ_cleansing_the_badge_desc: "La policía es vista como una fuerza corrupta e incompetente entre nuestro pueblo. Ha llegado el momento de demostrar que están realmente allí para la gente, por el pueblo."
 TAJ_rebirth_of_integrity: "Renacimiento de la integridad"
 TAJ_rebirth_of_integrity_desc: "La integridad en Tayikistán había muerto hace mucho tiempo, pero ahora no es el momento de murmurar tales cosas. Es hora de crear un estado más transparente y abierto para nuestro pueblo."
 TAJ_razing_the_old_guard: "Afeitando a la Guardia Vieja"
 TAJ_razing_the_old_guard_desc: "Un grupo de altos dirigentes no puede dictar lo que sucede en el estado, es hora de que los líderes que nuestro pueblo considera competente se hagan cargo del Estado."
 TAJ_burning_the_dark_bridge: "Quemando el puente oscuro"
 TAJ_burning_the_dark_bridge_desc: "El mercado negro ha perseguido a nuestra nación durante mucho tiempo. Es hora de que partamos con el puente oscuro y forjamos un nuevo que es puro y legítimo."
 TAJ_crowns_for_tajiks: "Las coronas son para los tayikos"
 TAJ_crowns_for_tajiks_desc: "Las coronas están destinadas a ser usadas por el pueblo tayiko, no aquellos que buscan hacerle daño. A través de la honestidad, seguridad y justicia crearemos una mejor Tayikistán donde cada tayiko es tratado como un rey o reina."
 TAJ_southern_problems: "Problemas del Sur"
 TAJ_southern_problems_desc: "§Y'Oye, ¿qué es ese ruido?'§!\n\nRockets volando por todo el lugar, disparos sonando cada minuto, la situación afgana no es ideal. Ciertamente, no queremos que esa malicia reine sobre Tayikistán, y como tal, debemos buscar una solución."
 TAJ_masks_of_gold: "Máscaras de oro"
 TAJ_masks_of_gold_desc: "§YNo puedo oírte sobre el sonido de mi nuevo BMW§!\n\n¿Por qué arreglar algo que no está roto? Podemos poner un ojo ciego en las zonas más grises de la nación con el fin de tomar los beneficios."
 TAJ_fortress_of_elite: "Fortaleza de la Elite"
 TAJ_fortress_of_elite_desc: "La forma en que lo vemos, todavía tenemos un estado. Eso debe significar que estamos haciendo algo correcto, y ciertamente, las élites deben ser protegidas de cualquier forma de destrucción."
 TAJ_cementing_the_few: "Cemento de la Vaca"
 TAJ_cementing_the_few_desc: "Si tenemos demasiada gente corriendo por ahí haciendo cosas entonces eso es sólo crear una situación madura para el desastre."
 TAJ_compromise_with_shadows: "Compromiso con las sombras"
 TAJ_compromise_with_shadows_desc: "Debemos hacer compromisos con las fuerzas oscuras del mundo, y si eso significa hacer un trato con los actores no estatales, entonces sea así. Haremos que nuestras necesidades sean cumplidas por cualquier medio necesario."
 TAJ_cave_to_chinese_demands: "Cueva a las Demandas Chinas"
 TAJ_cave_to_chinese_demands_desc: "El dragón rojo gigante al este es una bomba de tiempo que hace cosquillas, y en cualquier momento explotarán. Debemos apaciguarlos, y darles lo que quieren si queremos sobrevivir."
 TAJ_bargains_in_dark: "Bargains en la oscuridad"
 TAJ_bargains_in_dark_desc: "La situación afgana está madura para la explotación, y no podemos permitir que esa oportunidad pase. Debemos aprovecharnos mientras podamos."
 TAJ_negotiate_chinese_presence: "Negociar la asistencia china"
 TAJ_negotiate_chinese_presence_desc: "Si vamos a hacer concesiones a los chinos, entonces tendrán que darnos algo a cambio. Les pediremos algunas armas para que no estemos atrapados en la edad de piedra militarmente."
 TAJ_whispers_in_white: "Whispers en blanco"
 TAJ_whispers_in_white_desc: "Nuestros 'amigos' en el sur han estado ocupados con su pequeña guerra civil desde hace algún tiempo. Si podemos, deberíamos pedirles algo... de bienes."
 TAJ_concerning_developments: "Con respecto a los desarrollos"
 TAJ_concerning_developments_desc: "La situación en Afganistán está empezando a calentarse, y debemos hacer algo al respecto lo antes posible."
 TAJ_southern_solution: "Solución del Sur"
 TAJ_southern_solution_desc: "Para asegurar la supervivencia de nuestro estado y gobierno, debemos llegar a una solución. Hay que elaborar un plan amplio para hacer frente a la guerra civil afgana."
 TAJ_the_lease: "El Plomo"
 TAJ_the_lease_desc: "Los rusos han acogido su Base Militar 201 en nuestra nación desde hace décadas, durante y después del gobierno soviético. Es hora de que reevaluemos esta relación."
 TAJ_boot_in_the_ass: "Expelen la amenaza rusa"
 TAJ_boot_in_the_ass_desc: "§YRecuerde, no ruso§!\n\nHa llegado el momento de liberar a los rusos de nuestro suelo puro de una vez por todas. El futuro de la base militar estará en nuestras manos, y no los rusos con sus meras amenazas."
 TAJ_secure_the_southern_border: "Seguridad en el Sur"
 TAJ_secure_the_southern_border_desc: "Con una nueva situación con respecto a la base 201, debemos reevaluar nuestra seguridad hacia el sur. Buscaremos posibles mejoras para la base."
 TAJ_renegotiate_terms: "Re-Negociar términos"
 TAJ_renegotiate_terms_desc: "En lugar de tomar la base a todos nosotros mismos, podemos considerar renegociar los términos. Podemos retorcer potencialmente el brazo de los rusos para darnos lo que queremos, o podemos dejarlos totalmente a favor de un nuevo amigo."
 TAJ_safeguard_southern_border: "Salvaguardar la frontera sur"
 TAJ_safeguard_southern_border_desc: "En lugar de desplegar tropas, debemos investigar nuevas formas de proteger la frontera sur contra posibles incursiones."
 TAJ_the_tajik_fortress: "La Fortaleza Tajik"
 TAJ_the_tajik_fortress_desc: "Para proteger a la nación, debemos convertirla en una fortaleza. Nuestras fortificaciones harán de invadir a la nación una pesadilla absoluta, y una donde ellos adivinarían sus decisiones."
 TAJ_expand_joint_chiefs_of_staff: "Ampliar los Jefes de Estado Mayor Conjuntos"
 TAJ_expand_joint_chiefs_of_staff_desc: "Los Jefes de Estado Mayor Conjuntos del Ejército necesitan más lealistas sirviendo, actualmente, no tenemos lo suficiente para manejar nuestro ejército cada vez mayor."
 TAJ_founder_of_peace: "Fundador de la Paz"
 TAJ_founder_of_peace_desc: "Nuestro gran líder Rahmon, es el fundador de la paz. Porque él es el que trajo un rápido fin a la guerra civil tayiko, y orden restaurado en nuestras vidas caóticas."
 TAJ_placate_the_scns: "Fortalecer las SCNS"
 TAJ_placate_the_scns_desc: "El SCNS (Comité Estatal para la Seguridad Nacional) va a ser más útil con el tiempo, especialmente con las crecientes necesidades de seguridad en nuestro estado."
 TAJ_rahmons_men: "Hombres de Rahmon"
 TAJ_rahmons_men_desc: "Los pocos de nuestro gobierno que se han demostrado leales a Rahmon deben ser recompensados y promovidos. Hacer esto llevará a más gente a ver a nuestro líder más favorablemente, ya que sus hombres hablarán bien de él."
 TAJ_shift_towards_SCNS: "Cambio hacia el SCNS"
 TAJ_shift_towards_SCNS_desc: "El ejército es claramente incapaz de mantener adecuadamente la seguridad en nuestro estado, y por lo tanto, debemos dejarla a los verdaderos expertos en seguridad para manejarlo."
 TAJ_shift_towards_tna: "Cambio hacia el TAF"
 TAJ_shift_towards_tna_desc: "Las fuerzas armadas tayikas han estado alrededor desde la creación de la nación, y se han demostrado bastante bien. Reforzaremos su posición de mantener la seguridad del Estado, y lo haremos con rapidez."
 TAJ_rahmons_fruits: "Rahmon's Fruits"
 TAJ_rahmons_fruits_desc: "La familia Rahmons ha estado bastante involucrada en el estado de la política tayika, y como resultado han acumulado mucha riqueza. Esto es debido a las empresas familiares que corren, y no hay señales de que planean parar pronto."
 TAJ_appoint_rustam: "Appoint Rustam"
 TAJ_appoint_rustam_desc: "§YTú eres rico, nadie debería presionarte«§!\n\nRustam, hijo de Rahmon, ha demostrado ser un sucesor digno. Para probar sus habilidades, debe nombrar el título de gobernador de Dushanbe."
 TAJ_the_whole_pie: "La pieza entera"
 TAJ_the_whole_pie_desc: "¿Por qué tomar una rebanada cuando podemos tenerlo todo? ¿O tal vez no?"
 TAJ_cis_diplomacy: "Diplomacia de la CEI"
 TAJ_cis_diplomacy_desc: "El diálogo y la diplomacia con las naciones de la CEI es muy importante, son nuestros vecinos en su mayor parte después de todo. Sin embargo, necesitamos verlos con precaución al mismo tiempo y como socios estratégicos."
 TAJ_csto_defense_agreement: "Acuerdo de Defensa de la OMC"
 TAJ_csto_defense_agreement_desc: "Necesitamos invitar a las naciones de la OCS a Tayikistán y que echen un vistazo a nuestros militares. Está en un estado horrible, y seguramente querrían un aliado más fuerte a su lado cuando llegue el momento de la guerra."
 TAJ_promote_csto_expansion: "Promover la expansión de CSTO"
 TAJ_promote_csto_expansion_desc: "La alianza no puede seguir creciendo si optamos por mantener una cantidad fija de miembros. Tendremos que llegar a los uzbekos y turcomanos una vez más."
 TAJ_solidfy_defense_agreement: "Solidificar Acuerdos de Defensa"
 TAJ_solidfy_defense_agreement_desc: "Actualmente los acuerdos defensivos dentro del CSTO no están claros, y si queremos que la alianza dure, tendremos que aclarar con nuestros amigos lo que realmente representan."
 TAJ_improve_bloc_trade: "Mejorar el comercio de bloques"
 TAJ_improve_bloc_trade_desc: "El comercio dentro de los estados de la CEI está falsificando, y como resultado, tendremos que reforzar las conversaciones para mejorar el comercio dentro del bloque de manera que nosotros como resultado nos beneficie directamente de él."
 TAJ_flow_of_investors: "Flujo constante de los inversores"
 TAJ_flow_of_investors_desc: "Para que nuestra economía prospere, vamos a necesitar un flujo constante de inversores. Sin ellos, nuestra economía ciertamente vacilaría en otra recesión."
 TAJ_aid_rogun_dam: "Financiación para la presa Rogun"
 TAJ_aid_rogun_dam_desc: "La presa Rogun tiene seria necesidad de financiación, nuestro estado no tiene suficiente. Buscaremos ayuda de las naciones de la CEI para financiar este proyecto masivo, y construir nuestra nación con su ayuda."
 TAJ_wall_of_difference: "Una pared de diferencia"
 TAJ_wall_of_difference_desc: "No tenemos nada en común con el resto del bloque de la CEI. Somos de Tajik, y permaneceremos como tal. No somos esclavos, no turcos y sin duda ningún aliado suyo."
 TAJ_escelate_pamir_problem: "Escalar el problema de Pamir"
 TAJ_escelate_pamir_problem_desc: "El problema de Pamir ha estado sentado ocioso, es hora de que se trate el tema."
 TAJ_recon_missions_over_border: "Reconciliación entre fondos Misiones"
 TAJ_recon_missions_over_border_desc: "§Y¿Watcha tiene allí amigo?'§!\n\nLos kirguís ciertamente nos ocultan algo, y tendremos que echar un buen vistazo y determinar qué es eso. Ya sea formaciones de tropas o un arma secreta, necesitamos saberlo."
 TAJ_usher_an_era_of_change: "Usher la Era del Cambio"
 TAJ_usher_an_era_of_change_desc: "Para sobrevivir, necesitamos cambiar. Tayikistán no será diferente a esta ley universal. Debemos reformar nuestro país para que pueda adaptarse al clima en desarrollo del siglo XXI."
 TAJ_tajikistan_for_tajiks: "Tayikistán para tayikos"
 TAJ_tajikistan_for_tajiks_desc: "Tayikistán no está destinado a que los extranjeros vengan y se pongan de pie, relajando parar el esfuerzo de nuestro pueblo. Debemos dejar que se sepa que no nos someteremos a ningún poder."
 TAJ_derussification_of_tajikistan: "De-Russification of Tajikistan"
 TAJ_derussification_of_tajikistan_desc: "Durante muchos años los rusos habían gobernado sobre nuestras tierras, y no teníamos más opción que aceptar su cultura. Su influencia en nuestra cultura ha tenido un gran impacto, y ahora es el momento de revertir este daño."
 TAJ_prohibit_russian_patronymics: "Prohibit Russian Patronymics"
 TAJ_prohibit_russian_patronymics_desc: "¡Somos Tajiks! No podemos nombrarnos después de un ruso de hace cien años. Ahora es hora de prohibir esta práctica idiota."
 TAJ_persianization_of_language: "Persianización del idioma"
 TAJ_persianization_of_language_desc: "Necesitamos volver a conectar con nuestras raíces, introduciremos más vocabulario persa en conversaciones cotidianas para distanciarnos de los cambios que los rusos habían traído sobre nuestro lenguaje."
 TAJ_clearing_the_way: "Limpiar el camino"
 TAJ_clearing_the_way_desc: "Tenemos que aclarar el camino para una mayor reforma religiosa. Al apuntar a Salafista, sin embargo, podemos abrir la nación para el cambio."
 TAJ_religious_precautions: "Precauciones religiosas"
 TAJ_religious_precautions_desc: "Tomaremos las precauciones necesarias para proteger a nuestra nación de tener el pensamiento salafista extendido. Al prevenir ciertas prácticas, tomaremos las medidas adecuadas necesarias."
 TAJ_islamic_appearance: "Objetivo de la aparición islámica"
 TAJ_islamic_appearance_desc: "§R'Afeitarlo, o lo haré...'§!\n\nHay que prohibir barbas, ropa negra y vestidos clericales. No podemos permitir que esa apariencia afecte a nuestra juventud, debemos abrazar formas más tradicionales de aspecto tayiko y prohibir el resto."
 TAJ_mosque_regulations: "Reglamento sobre las mezquitas"
 TAJ_mosque_regulations_desc: "Las mezquitas son centros de radicalización y, como resultado, no tenemos más remedio que evitar que nuestros hijos asistan a estas mezquitas. A nadie menor de 18 años se le permitirá ir, nadie. Debemos cerrar algunos de ellos para evitar que se difundan ideales peligrosos."
 TAJ_the_hajj: "Trato con el Hajj"
 TAJ_the_hajj_desc: "Todo musulmán menor de 40 años que resida en la República de Tayikistán está prohibido participar en el Haj en Mecca. Tenemos suficiente gente que va a Rusia, ¿por qué van a [SAU.GetName]?"
 TAJ_the_peoples_party: "El Partido Popular"
 TAJ_the_peoples_party_desc: "Nuestro partido es el partido del pueblo, y los representaremos en su nombre."
 TAJ_minbari_khalq: "Financiación adicional para Minbari Khalq"
 TAJ_minbari_khalq_desc: "Minbari Khalq, o el Tribuno de los Pueblos es el periódico del partido, y no debe ser olvidado. Cada tayiko de toda la nación pronto recogerá la nueva edición para ellos mismos cuando obtengamos financiación adicional asignada a ella."
 TAJ_sozandagoni_vatan: "Ampliar Sozandagoni Vatan"
 TAJ_sozandagoni_vatan_desc: "Sozandagoni Vatan o los Creadores de la Patria son el ala juvenil de nuestro partido. Si podemos involucrar a nuestra gente con la actividad del partido desde una edad temprana, podremos construir un Tayikistán mejor para todos."
 TAJ_electoral_reform: "Reforma electoral"
 TAJ_electoral_reform_desc: "§Y'Lee la huella fina, eso no es lo que dice«§!\n\n¿Quién necesita elecciones si íbamos a ganarlas de todos modos? Bueno, somos un partido democrático, así que tendremos elecciones al final del día. Sin embargo, no sin algunos pequeños cambios primero..."
 TAJ_youth_informants: "Informantes juveniles"
 TAJ_youth_informants_desc: "Podemos utilizar nuestros miembros del ala juvenil para identificar adolescentes rebeldes que andan por nuestras calles, y hacer que se ocupen de ellos en consecuencia."
 TAJ_expand_compulsory_education: "Ampliar la educación obligatoria"
 TAJ_expand_compulsory_education_desc: "En la actualidad, la educación obligatoria sólo llega hasta el décimo grado. Es hora de hacer que sea un requisito que hacen los 12 años enteros."
 TAJ_the_media_law: "Los medios de comunicación 'Ley'"
 TAJ_the_media_law_desc: "Pasando la «Ley» de los medios nos permitirá dar a los periodistas un gran indicio sobre lo que deberían estar priorizando, es decir, si no quieren tomar unas vacaciones extendidas a tierras lejanas."
 TAJ_self_censorship: "Auto Censura"
 TAJ_self_censorship_desc: "Pronto ni siquiera tendremos que decirles qué decir, lo harán por nosotros. Nosotros recompensaremos a los que hablan bien de nosotros, y castigaremos a los que hablan mal."
 TAJ_a_republic_ish: "A Republic-ish"
 TAJ_a_republic_ish_desc: "§GNo hay atajos para la democracia\n- Emomali Rahmon§!\n\nSomos una República, sin embargo, todo se reduce a su interpretación de ella. Claro, tenemos un parlamento y un presidente, ¿cómo podemos ser una dictadura?"
 TAJ_dostievs_endorsement: "El respaldo de Dostiev"
 TAJ_dostievs_endorsement_desc: "Al tener Dostiev, el fundador del partido, respalda a nuestro glorioso líder [TAJ.GetLeader], podremos dar a estos periodistas algo de lo que informar."
 TAJ_reconstruction_of_army: "Reconstrucción del Ejército"
 TAJ_reconstruction_of_army_desc: "Una de las áreas necesitadas de más reformas en nuestra nación es el ejército. Con la tecnología que cae detrás, y el reclutamiento en un todo el tiempo bajo, tenemos que arreglar esto."
 TAJ_modernization_of_the_equipment: "Modernización del equipo"
 TAJ_modernization_of_the_equipment_desc: "Uno de los primeros pasos para arreglar el ejército será modernizar el ejército. Al actualizar la tecnología utilizada, tendremos una ventaja sobre nuestros enemigos."
 TAJ_revise_conscription_laws: "Revisar las leyes de inscripción"
 TAJ_revise_conscription_laws_desc: "Nadie quiere servir estos días, así que nos aseguraremos de que si no quieren hacerlo entonces los forzaremos."
 TAJ_border_troop_centre: "Centro de tropas fronterizas"
 TAJ_border_troop_centre_desc: "Necesitamos desesperadamente tropas de frontera especializadas, y necesitaremos instalaciones específicas para gestionarlas."
 TAJ_cracks_in_the_foundation: "Grietas en la Fundación"
 TAJ_cracks_in_the_foundation_desc: "Hay algunas grietas en la base de la regla de [TAJ.GetLeader] sobre Tayikistán. Tendremos que abordarlos siguiendo una doctrina específica de gobernanza."
 TAJ_grip_on_nation: "El control de la Nación"
 TAJ_grip_on_nation_desc: "No podemos dejar que nuestro dominio de la nación falte, y buscaremos apoyo cuando sea necesario, ya sea en Tayikistán o en el extranjero."
 TAJ_foreign_legitimacy: "Legitimación del Centrario Extranjero"
 TAJ_foreign_legitimacy_desc: "Vamos a basar nuestra legitimidad de los demás, utilizando su alabanza como una piedra pisada para mostrar a nuestro pueblo que somos verdaderamente dignos."
 TAJ_self_empowerment: "Auto Empoderamiento"
 TAJ_self_empowerment_desc: "¿A quién le importa lo que piensan los demás? No necesitamos la ayuda de ningún oligarca, presidente, rey o dictador para construir nuestra legitimidad de los gobiernos."
 TAJ_russias_pawn: "El Peón de Rusia"
 TAJ_russias_pawn_desc: "Claramente, Rusia está dispuesta a financiar nuestros esfuerzos. Y como resultado, parece ser el movimiento más inteligente para ponerse de su lado bueno y seguir como dicen."
 TAJ_expansion_of_the_arms_industry: "Ampliación de la industria del armamento"
 TAJ_expansion_of_the_arms_industry_desc: "Si queremos estar de pie, entonces tendremos que expandir nuestra industria militar. Necesitamos producir nuestras propias armas."
 TAJ_distance_from_foreign_reliance: "Distancia de la confianza extranjera"
 TAJ_distance_from_foreign_reliance_desc: "No podemos estar demasiado dependientes de una nación o la otra, debemos depender de nuestra propia fuerza y nuestra fuerza solo."
 TAJ_our_own_scientists: "Nuestros propios científicos"
 TAJ_our_own_scientists_desc: "Nuestros científicos son tan buenos como los extranjeros, si no mejor. Llevaremos a cabo investigaciones AQUÍ en Tayikistán, y haremos grandes avances y descubrimientos."
 TAJ_russian_arms_deals: "Trajes de armamento rusos"
 TAJ_russian_arms_deals_desc: "Los rusos han acumulado bastante el arsenal, y sin duda podemos usar algunas de sus tácticas para ayudar a construir nuestros arsenales."
 TAJ_russian_oil: "Aceite ruso"
 TAJ_russian_oil_desc: "Este oro negro resuena con el mundo como ningún otro recurso. Si podemos conseguir que los inversionistas rusos acudan al corazón de Tayikistán y cavan por petróleo, podemos atacar la riqueza."
 TAJ_eye_of_asia: "El Ojo de Asia"
 TAJ_eye_of_asia_desc: "Estamos situados casi en el centro de Asia, y nuestra ubicación estratégica se puede utilizar como una gran herramienta para inculcar orgullo dentro de nuestra población."
 TAJ_handeling_foreign_dissidents: "Manejo de los disidentes extranjeros"
 TAJ_handeling_foreign_dissidents_desc: "Hay muchos que no residen en Tayikistán, pero tienen mucho que decir. Tendremos que tratar con estas personas para asegurarnos de que nuestro gobierno no tenga su reputación empañada."
 TAJ_our_strength: "Nuestra fuerza"
 TAJ_our_strength_desc: "Nuestra fuerza no debe olvidarse, independientemente de nuestra situación. Usaremos esta noción patriótica para fortalecer a nuestros pueblos y avanzar hacia adelante!"
 TAJ_emomalis_orders: "Órdenes de Emomali"
 TAJ_emomalis_orders_desc: "Nuestro inquebrantable líder, líder de la nación, fundador de paz y unidad nacional, Emomali Rahmon ha emitido una orden. ¡La orden es bastante simple, prepárate y fuerte para que el gran estado tayiko se vuelva aún más grande!"
 TAJ_kyrgzy_integration: "[KYR.GetAdjective] Integración"
 TAJ_kyrgzy_integration_desc: "Ha llegado el momento de que nuestro rival finalmente se someta. El estado [KYR.GetName] finalmente se dará cuenta de su artificialidad y unirse con nosotros como uno!"
 TAJ_uzbek_integration: "Unificación de uzbeko"
 TAJ_uzbek_integration_desc: "Muchos tayikos residen en Uzbekistán, y no han sido tratados muy bien. Tendremos que volver a unirnos con nuestros Hermanos Uzbek y convertirnos en uno."
 TAJ_dominance_over_afghanistan: "Desentierra el Yard Grave"
 TAJ_dominance_over_afghanistan_desc: "Muchos imperios fueron a Afganistán, y murieron allí. No somos imperio, somos una nación, y somos un pueblo con el pueblo afgano. Es hora de que nuestro sindicato demuestre que todo el mundo está equivocado."
 TAJ_turkmen_cooperation: "Turkmen Dominion"
 TAJ_turkmen_cooperation_desc: "Los turcomanos se mantienen a sí mismos, pero es hora de que hagamos algo al respecto. Si nuestros estados pueden unirse, entonces verán los beneficios de la cooperación de primera mano."
 TAJ_kazakh_invitation: "Cooperación kazaja"
 TAJ_kazakh_invitation_desc: "El kazajo estaba obligado a colapsar de todos modos, así que ¿por qué no se unen a nosotros antes de que nada pueda ir mal?"
 TAJ_central_asian_state: "Un Estado, muchas personas"
 TAJ_central_asian_state_desc: "La Unión de Estados del Asia Central pasará a ser la historia como uno de los sindicatos más exitosos de la historia humana. Ningún ruso pudo gobernar sobre esta región, sin embargo un nativo estará seguro de tener éxito."
 TAJ_armed_forces: "Fortalecimiento de las Fuerzas Armadas"
 TAJ_armed_forces_desc: "La columna vertebral de la seguridad de Tayikistán radica en un ejército bien preparado y disciplinado. Es hora de reforzar nuestras fuerzas armadas y asegurar su preparación para cualquier reto."
 TAJ_air_defense_forces: "Fuerzas de Defensa Aérea"
 TAJ_air_defense_forces_desc: "Proteger nuestros cielos es una prioridad máxima. Desarrollar y modernizar nuestras fuerzas de defensa aérea protegerán a nuestra nación de amenazas aéreas."
 TAJ_security_in_airspace: "Seguridad en el espacio aéreo"
 TAJ_security_in_airspace_desc: "Mantener el control sobre el espacio aéreo de Tayikistán asegura nuestra soberanía e impide incursiones por fuerzas hostiles."
 TAJ_lucrative_weapons_procurements: "Contratación de armas lucrativas"
 TAJ_lucrative_weapons_procurements_desc: "Vamos a tener que poner nuestras manos en armas más avanzadas si queremos subir militarmente."
 TAJ_ground_forces: "Modernizar las fuerzas terrestres"
 TAJ_ground_forces_desc: "Nuestras fuerzas terrestres deben estar equipadas con la última tecnología y capacitación para seguir siendo eficaces y sensibles a las amenazas emergentes."
 TAJ_upgrade_helicopter_fleet: "Actualizar la Flota Helicopter"
 TAJ_upgrade_helicopter_fleet_desc: "Los helicópteros son los caballos de trabajo de la guerra moderna. Mejorar nuestra flota mejorará la movilidad y la flexibilidad táctica en el combate."
 TAJ_nationwide_airbase_upgrades: "Actualizaciones de la base aérea a nivel nacional"
 TAJ_nationwide_airbase_upgrades_desc: "Para apoyar nuestra creciente energía aérea, debemos mejorar y ampliar las bases aéreas en todo el país, asegurando que estén equipadas para manejar aviones modernos."
 TAJ_operational_integrity_desc: "La racionalización de las estructuras de mando y la garantía de una coordinación impecable aumentarán la eficacia de todas las operaciones militares."
 TAJ_statewide_radar_coverage: "Cobertura de radar en todo el Estado"
 TAJ_statewide_radar_coverage_desc: "Una red de radares integral es esencial para la alerta temprana y el mantenimiento del control sobre nuestras fronteras."
 TAJ_ensure_regime_loyalty: "Asegurar la lealtad del régimen"
 TAJ_ensure_regime_loyalty_desc: "La lealtad dentro de las filas es primordial. Implementaremos medidas para erradicar los elementos desleales y salvaguardar el régimen."
 TAJ_mobilization_plan: "Plan General de Movilización"
 TAJ_mobilization_plan_desc: "Un plan de movilización claro y eficiente garantizará que Tayikistán pueda responder rápidamente a las crisis y defenderse en tiempos de necesidad."
 TAJ_tajik_mobility_forces: "Fuerzas de Movilidad de Tayikistán"
 TAJ_tajik_mobility_forces_desc: "El desarrollo de fuerzas altamente móviles permitirá un rápido despliegue y una rápida respuesta a las amenazas en cualquier lugar de la nación."
 TAJ_analyze_civil_war: "Analizar la Guerra Civil"
 TAJ_analyze_civil_war_desc: "Al estudiar las lecciones de nuestra guerra civil, podemos identificar debilidades e implementar estrategias para prevenir conflictos futuros."
 TAJ_ensure_stable_supply: "Asegurar las cadenas de suministro estable"
 TAJ_ensure_stable_supply_desc: "Un suministro constante de recursos y equipo es vital para el éxito de nuestras operaciones militares. Debemos asegurar estas líneas de vida."
 TAJ_contracts_with_partner: "Contratos de armas seguras con socios"
 TAJ_contracts_with_partner_desc: "Colaborar con socios de armas fiables nos proporcionará equipo de alta calidad y fortalecerá nuestras capacidades militares."
 TAJ_turkish_military_industries: "Industrias militares turcas"
 TAJ_turkish_military_industries_desc: "Alentar la inversión turca en la industria militar de Tayikistán fortalecerá nuestras capacidades de producción y creará alianzas valiosas."
 TAJ_iranian_drone_factories: "Iran Drone Factories"
 TAJ_iranian_drone_factories_desc: "La asociación con Irán para construir instalaciones de fabricación de drones dará acceso a la tecnología UAV avanzada y mejorará nuestras capacidades aéreas."
 TAJ_expansion_of_central_command: "Ampliación del Mando Central"
 TAJ_expansion_of_central_command_desc: "Un mando militar más fuerte y centralizado mejorará la coordinación y la adopción de decisiones en todas las ramas de nuestras fuerzas armadas."
 TAJ_tajik_armored_forces: "Desarrollar fuerzas tayikas Blindaje"
 TAJ_tajik_armored_forces_desc: "Modernizar nuestras fuerzas blindadas proporcionará la fuerza de fuego pesada necesaria para dominar el campo de batalla y asegurar la victoria."
 TAJ_phase_out_t_seventy_two: "Fase hacia fuera el T-72"
 TAJ_phase_out_t_seventy_two_desc: "Los tanques T-72 envejecidos ya no cumplen con los estándares modernos. Hacerlos salir hará espacio para vehículos blindados más avanzados."
 TAJ_coescd: "Apoyo al COESCD"
 TAJ_coescd_desc: "El Comité de Situaciones de Emergencia y Defensa Civil es crucial para la respuesta a los desastres y la defensa civil. El fortalecimiento de este órgano aumentará la resiliencia nacional."
 TAJ_national_guard: "Reorganizar el Guardia Nacional"
 TAJ_national_guard_desc: "El Guardia Nacional debe ser reestructurado para abordar mejor los problemas de seguridad interna y prestar apoyo durante las emergencias."
 TAJ_coup_preventive_strategy: "Golpe de estado Estrategia preventiva"
 TAJ_coup_preventive_strategy_desc: "Una estrategia integral para prevenir golpes de Estado salvaguardará la estabilidad de nuestro gobierno y asegurará un progreso continuo."
 TAJ_modern_steel: "Acero moderno"
 TAJ_modern_steel_desc: "El establecimiento de instalaciones avanzadas de fabricación de tanques nos permitirá producir vehículos blindados de última generación a nivel nacional."
 TAJ_sophisticated_troops: "Tropas sofisticadas"
 TAJ_sophisticated_troops_desc: "Invertir en mejoras tecnológicas y capacitación avanzada transformará a nuestras tropas en una fuerza de lucha altamente capaz y moderna."
 TAJ_on_own_feet: "Párate en nuestros propios pies"
 TAJ_on_own_feet_desc: "Al enfocarse en la autosuficiencia en defensa, Tayikistán finalmente puede cumplir el legado que ha buscado durante mucho tiempo. Ya no estaremos a merced de otros poderes, sino que nos mantendremos a nuestros pies y lucharemos contra el mal."
 TAJ_central_asias_poorest: "Pobre de Asia Central"
 TAJ_central_asias_poorest_desc: "Las luchas económicas de Tayikistán son profundas, ganándola el título inviable de los más pobres del Asia central. Debemos enfrentar esta realidad y comenzar el viaje hacia un futuro más brillante."
 TAJ_water_melon_economy: "La economía de la sandía"
 TAJ_water_melon_economy_desc: "Simbólico de nuestra identidad agrícola, nuestra economía depende en gran medida de los cultivos estacionales. Es hora de fortalecer este sector al mismo tiempo que diversifica nuestra base económica."
 TAJ_bode_to_industry: "Un nuevo Bode a la industria"
 TAJ_bode_to_industry_desc: "La base de una fuerte economía tayika radica en el crecimiento industrial. Pondremos las bases para un renacimiento de fabricación."
 TAJ_tap_into_imf_funds: "Introducir en los fondos del FMI"
 TAJ_tap_into_imf_funds_desc: "Garantizar la asistencia del FMI nos proporcionará el apoyo financiero necesario para estabilizar nuestra economía y llevar a cabo reformas críticas."
 TAJ_dehqan_farms: "Support Dehqān Farms"
 TAJ_dehqan_farms_desc: "Nuestras pequeñas granjas independientes son el corazón de la zona rural de Tayikistán. Fortalecerlos aumentará la producción agrícola y los medios de vida rurales."
 TAJ_local_cotton_production: "Revitalizar la producción de algodón"
 TAJ_local_cotton_production_desc: "Cotton ha sido un pilar de nuestra economía durante décadas. Debemos rejuvenecer esta industria vital para recuperar nuestra influencia regional."
 TAJ_modernization_of_farming_equipment: "Modernizar el equipo agrícola"
 TAJ_modernization_of_farming_equipment_desc: "Las prácticas agrícolas anticuadas retienen nuestro potencial agrícola. La introducción del equipo moderno desbloqueará mayores rendimientos y eficiencia."
 TAJ_jewels_of_tajikistan: "Las Joyas de Tayikistán"
 TAJ_jewels_of_tajikistan_desc: "Nuestras piedras preciosas y minerales son un tesoro escondido. Ampliar la minería de piedras preciosas y refinar añadirá brillo a nuestra economía."
 TAJ_uranium_mining: "Reservas de uranio exploto"
 TAJ_uranium_mining_desc: "Los depósitos de uranio de Tayikistán son un recurso valioso. El desarrollo de este sector asegurará una exportación lucrativa y reforzará nuestra economía."
 TAJ_gold_and_silver_sughd: "Oro y Plata de Sughd"
 TAJ_gold_and_silver_sughd_desc: "Las ricas venas de Sughd sostienen riqueza sin explotar. La minería de estos metales preciosos traerá prosperidad a la región y a la nación."
 TAJ_mining_tech_upgrades: "Tecnología de minería de actualización"
 TAJ_mining_tech_upgrades_desc: "La modernización de nuestras técnicas mineras garantizará eficiencia, seguridad y sostenibilidad, lo que nos permitirá maximizar el rendimiento de nuestros recursos naturales."
 TAJ_take_back_control: "Retrocede el control"
 TAJ_take_back_control_desc: "La dominación extranjera en nuestra economía socava la soberanía nacional. Es hora de recuperar el control de las industrias estratégicas de influencias externas."
 TAJ_nationalize_chinese_assets: "Nacionalizar los activos chinos"
 TAJ_nationalize_chinese_assets_desc: "Las empresas chinas mantienen un importante camino en Tayikistán. Al nacionalizar sus activos, reafirmaremos nuestra independencia económica."
 TAJ_reinforce_chinese_corporations: "Reforzar la cooperación con chino"
 TAJ_reinforce_chinese_corporations_desc: "La asociación con las empresas chinas inyectará capital y experiencia en nuestro sector minero, asegurando el crecimiento mutuo y el desarrollo."
 TAJ_sino_tajik_mining_company: "Compañía minera Sino-Tajik"
 TAJ_sino_tajik_mining_company_desc: "Establecer una empresa minera conjunta con China asegurará inversiones y tecnología para explotar eficazmente la riqueza mineral de Tayikistán."
 TAJ_regional_modernization: "Modernización regional"
 TAJ_regional_modernization_desc: "El desarrollo de la infraestructura y la industria en las regiones asegurará un crecimiento equitativo y reducirá las disparidades en Tayikistán."
 TAJ_revise_transit_tarifs: "Revisar los aranceles de tránsito"
 TAJ_revise_transit_tarifs_desc: "El ajuste de los aranceles sobre las mercancías que pasan por Tayikistán alentará el comercio y nos posicionará como un centro de tránsito regional vital."
 TAJ_central_asian_railway_summit: "Cumbre de ferrocarriles del Asia central"
 TAJ_central_asian_railway_summit_desc: "La organización de una cumbre para desarrollar una red ferroviaria regional mejorará la conectividad y fomentará la cooperación económica en Asia Central."
 TAJ_chemical_production: "Ampliación de la producción química"
 TAJ_chemical_production_desc: "Invertir en la industria química diversificará nuestra economía y creará nuevas oportunidades para las exportaciones y el uso doméstico."
 TAJ_rural_hunger: "Dirección del Hambre Rural"
 TAJ_rural_hunger_desc: "El hambre generalizada en las zonas rurales es una desgracia nacional. Debemos lanzar iniciativas para garantizar la seguridad alimentaria de todos los tayikos."
 TAJ_wto_benefits: "Beneficios de la OMC"
 TAJ_wto_benefits_desc: "La adhesión a la OMC ofrece oportunidades para hacer frente al hambre mediante el comercio y la cooperación internacionales. Aprovechemos este potencial."
 TAJ_domestic_innovation: "Innovación nacional para el hambre"
 TAJ_domestic_innovation_desc: "El aprovechamiento del ingenio y la innovación locales proporcionará soluciones sostenibles para combatir el hambre y la malnutrición en Tayikistán."
 TAJ_food_for_troops: "Alimentos para los contingentes"
 TAJ_food_for_troops_desc: "Un ejército bien alimentado es un ejército eficaz. Garantizar una alimentación adecuada para nuestras tropas reforzará la moral y la preparación."
 TAJ_strain_of_energy: "El Estreno de Energía"
 TAJ_strain_of_energy_desc: "La crisis energética de Tayikistán amenaza la estabilidad económica. Hacer frente a la escasez de energía es crucial para el desarrollo a largo plazo."
 TAJ_vakhsh_hydroelectric_project: "Proyecto hidroeléctrico de Vakhsh"
 TAJ_vakhsh_hydroelectric_project_desc: "Invertir en energía hidroeléctrica a lo largo del río Vakhsh generará energía limpia y aliviará nuestros males energéticos."
 TAJ_nuclear_gamble: "El juego nuclear"
 TAJ_nuclear_gamble_desc: "La explotación de la energía nuclear presenta riesgos y recompensas. Si tiene éxito, proporcionará una fuente de energía sostenible para el futuro."
 TAJ_caspian_fuel_pipeline: "Gasoducto de combustible Caspio"
 TAJ_caspian_fuel_pipeline_desc: "Asegurar una ruta de oleoducto hacia el Mar Caspio mejorará el comercio energético y posicionará a Tayikistán como un jugador clave en los mercados regionales."
 TAJ_stamp_out_the_leftists: "Extiende a los izquierdistas"
 TAJ_stamp_out_the_leftists_desc: "Los elementos de izquierda de nuestra nación deben ser tratados, antes de que nos lleven cientos de años atrás a la era soviética, donde nuestra nación fue oprimida."
 TAJ_develop_dushanbe: "Desarrollar Dushanbe"
 TAJ_develop_dushanbe_desc: "Como capital de la nación, Dushanbe debe ejemplificar el potencial de Tayikistán. Las mejoras de infraestructura y el desarrollo urbano lo transformarán en una metrópoli moderna."
 TAJ_concessions_to_badakhshan: "Concesiones a Badakhshan"
 TAJ_concessions_to_badakhshan_desc: "Para mantener la estabilidad, debemos abordar las necesidades únicas de Badakhshan invirtiendo en su desarrollo y concediéndole mayor autonomía."
 TAJ_regional_hospitals: "Hospitales regionales en Badakhshan"
 TAJ_regional_hospitals_desc: "Mejorar la infraestructura sanitaria en Gorno-Badakhshan proporcionará servicios críticos a su población y reducirá las disparidades regionales."
 TAJ_sughd_plan: "El Plan de Desarrollo Sughd"
 TAJ_sughd_plan_desc: "La inversión dirigida en las industrias e infraestructura de Sughd abrirá su potencial económico y creará prosperidad para sus residentes."
 TAJ_anzob_tunnel: "Completa el túnel de Anzob"
 TAJ_anzob_tunnel_desc: "Terminar el túnel de Anzob mejorará la conectividad entre el norte y el sur de Tayikistán, fomentando el comercio y la unidad nacional."
 TAJ_swiss_toolbox_idea: "La Caja de Herramientas Suiza"
 TAJ_swiss_toolbox: "La Caja de Herramientas Suiza"
 TAJ_swiss_toolbox_desc: "Colaborar con expertos suizos aportará técnicas y estrategias avanzadas para modernizar la economía de Tayikistán."
 TAJ_seco_economic_cooperation: "Prioridad de la Cooperación Económica SECO"
 TAJ_seco_economic_cooperation_desc: "El SECO o la Secretaría Estatal de Asuntos Económicos de Suiza siempre están abiertos a la cooperación económica con las naciones en el extranjero, y ciertamente no podemos pasar esa oportunidad."
 TAJ_seri_partnerships: "Asociación de SERI"
 TAJ_seri_partnerships_desc: "SERI o la Secretaría Estatal de Educación, Investigación e Innovación es una institución financiada por los suizos para promover la educación y la investigación en Suiza y en el extranjero. Debemos utilizarlo a nuestra ventaja."
 TAJ_work_visas: "Visas de trabajo de emisión"
 TAJ_work_visas_desc: "Con las condiciones adecuadas, nuestra economía puede prosperar aún más al entregar visas de trabajo a aquellos dispuestos a migrar y satisfacer nuestras necesidades económicas."
 TAJ_rahmon_dead: "Rahmon is Dead!"
 TAJ_rahmon_dead_desc: "Los loyalistas al régimen quedan desmoralizados tras la muerte de Emomali Rahmon."
 TAJ_work_visas_idea: "Visados de trabajo"
 TAJ_loyal_high_command: "Alto Mando Loyal"
 TAJ_uto_support: "Apoyo de la OTU"
 TAJ_tajiks_for_tajikistan: "¡Tayikis es para Tajiks!"
 TAJ_201st_base_upgrade_no_russian: "201st Military Base"
 TAJ_unbalanced_books: "Libros desequilibrados"
 TAJ_unbalanced_books_desc: "Nuestro presupuesto ha salido del negro, no somos pobres, estamos invirtiendo."
 TAJ_moscow_estate: "Moscow Estate"
 TAJ_moscow_estate_desc: "Big House, Big Dreams y un Big Price Tag. Nuestro líder se ha vuelto muy feliz con su llamada «inversión» para el estado."
 TAJ_presidential_palace: "Palacio Presidencial"
 TAJ_presidential_palace_desc: "Aunque no es la casa blanca, es un hogar para nosotros. Probablemente también deberíamos añadir un gran poste de bandera al frente mientras estamos en él."
 TAJ_security_of_the_state: "Seguridad del Estado"
 TAJ_security_of_the_state_desc: "Cámaras en cada esquina de su casa. No puedes escapar de la seguridad estatal."
 TAJ_russian_payments: "Russian Payments"
 TAJ_russian_payments_desc: "El estado ruso ha sido presionado por nosotros para aprovechar algunos beneficios económicos para nuestra propia ganancia."
 TAJ_national_guard_deployed: "Tajik Guardia Nacional"
 TAJ_national_guard_deployed_desc: "El Estado ha decidido que se debe tratar la actividad política islamista. Estamos usando el Guardia Nacional para asegurar que se desmoronen lentamente y se retiren a sus hogares.\n§W------------------§!\nMientras este espíritu nacional está activo, £TAJ_kingdom §HIRP Influencia§! se reducirá por §G-1%§! cada mes."
 TAJ_military_infancy: "Infamia militar"
 TAJ_military_infancy_desc: "A diferencia de otros estados post-soviéticos, [TAJ.GetFlag] Tayikistán no construyó su ejército de unidades soviéticas estacionadas dentro de la nación. [TAJ.GetFlag] Tayikistán optó por construir un ejército desde cero, disolviendo todas las unidades que no fueron hechas por el estado. Esto ha llevado a un ejército inexperto que no ha luchado en un conflicto importante fuera de uno interno.\n§W------------------§!\nEste espíritu nacional puede ser §RRetirado§! si bajamos por el§HFuerzas Armadas de Tayikistán§!' rama en el §HÁrbol de enfoque§!."
 TAJ_flight_of_labor: "Éxodo de la fuerza de trabajo"
 TAJ_flight_of_labor_desc: "La inestabilidad económica ha llevado al 50% de la población masculina emigrando a países como [SOV.GetFlag] [SOV.GetName] para encontrar trabajo. Si bien esta práctica podría beneficiar a las familias individuales, la economía tayika [TAJ.GetFlag] en última instancia perjudica más como resultado de una falta de mano de obra calificada. Además, algunos hombres en el extranjero comienzan a asistir a mezquitas extranjeras y son más propensos al extremismo islámico, lo que lleva a incidentes ocasionales.\n§W------------------§!\nEste espíritu nacional será §RRemovido§! si nuestro §HGDP§! excede §H$250B§! y tenemos al menos §H65% de estabilidad§!.\n§W------------------§!\nLa eliminación de este espíritu nacional nos permitirá poner fin a las campañas §HEchoes de la Ummah§! y £TAJ_kingdom §HIRP Influence§!."
 TAJ_woes_of_the_civilwar: "La guerra civil"
 TAJ_woes_of_the_civilwar_desc: "En 1992, nuestro estado colapsó en una guerra civil de 5 años, donde Tajik luchó contra Tajik. Grupos de oposición al gobierno central unificados bajo la OTU (Oposición Tayika Unitied), con algunos movimientos de secesión que surgen en la región de Badakhshan [BDA.GetFlag]. Una vez concluido la Guerra Civil, el Partido Democrático Popular £TAJ_emerging_reactionary firmó un tratado con múltiples grupos de la OTU, como el £TAJ_kingdom Partido Renacimiento Islámico y el £TAJ_western_conservative Partido Demócrata de Tayikistán, otorgando algunas concesiones a cambio de una cesación del fuego.\n§W------------------§!\nEste espíritu nacional será §R Removido§! si concluimos el conflicto [BDA.GetFlag] §HBadakhshan§!."
 TAJ_201st_base: "201st Military Base"
 TAJ_201st_base_usa: "FOB Dushanbe"
 TAJ_201st_base_raj: "Base Shakti"
 TAJ_201st_base_chi: "Base de la armonía - Dushanbe"
 TAJ_201st_base_desc: "La Base Militar 201 ha sido crítica en nuestras naciones historia corta hasta ahora, ya que la base sirve como centro de [SOV.GetFlag] influencia rusa y protección aun cuando no los limitamos. La 201.ª División de Rifles del ejército ruso [SOV.GetFlag] está actualmente estacionada en la base, y ofrecen a nuestras tropas entrenamiento ocasional contra un potencial [TAL.GetFlag] [AFG.GetFlag] invasión afgana de [TAJ.GetFlag] Tayikistán. También nos pagan un arrendamiento que contribuye a nuestra economía.\n§W------------------§!\nEste espíritu nacional será §RRemovido§! si nos deshacemos del [SOV.GetFlag] §H Acceso Militar Ruso§!"
 TAJ_201st_base_upgrade_desc: "La Base Militar 201 ha sido crítica en nuestras naciones historia corta hasta ahora, ya que la base sirve como centro de [SOV.GetFlag] influencia rusa y protección aun cuando no los limitamos. La 201.ª División de Rifles del ejército ruso [SOV.GetFlag] está actualmente estacionada en la base, y ofrecen a nuestras tropas entrenamiento ocasional contra un potencial [TAL.GetFlag] [AFG.GetFlag] invasión afgana de [TAJ.GetFlag] Tayikistán. También nos pagan un arrendamiento que contribuye a nuestra economía.\n§W------------------§!\nEste espíritu nacional será §RRemovido§! si nos deshacemos del [SOV.GetFlag] §H Acceso Militar Ruso§!"
 TAJ_201st_base_raj_desc: "La Base Shakti sirve como centro de [RAJ.GetFlag] Influencia india, y protección a pesar de que no los limitamos. [RAJ.GetFlag] El ejército indio está actualmente estacionado en la base, y ofrecen a nuestras tropas entrenamiento ocasional contra un potencial [TAL.GetFlag] [AFG.GetFlag] invasión afgana [TAJ.GetFlag] Tayikistán. También nos pagan un arrendamiento que contribuye a nuestra economía.\n§W------------------§!\nEste espíritu nacional será §RRetirado§! si nos deshacemos de [RAJ.GetFlag] §HAcceso militar indio§!"
 TAJ_201st_base_usa_desc: "FOB Dushanbe sirve como centro de [USA.GetFlag] influencia americana, y protección a pesar de que no los limitamos. [USA.GetFlag] El ejército americano está actualmente estacionado en la base, y ofrecen a nuestras tropas entrenamiento ocasional contra un potencial [TAL.GetFlag] [AFG.GetFlag] invasión afgana [TAJ.GetFlag] Tayikistán. También nos pagan un arrendamiento que contribuye a nuestra economía.\n§W------------------§!\nEste espíritu nacional será §RRetirado§! si nos deshacemos de [USA.GetFlag] §HAmerican Military Access§!"
 TAJ_201st_base_chi_desc: "La Base de Armonía sirve como centro de [CHI.GetFlag] La influencia china, y la protección a pesar de que no los limitamos. [CHI.GetFlag] El ejército chino está actualmente estacionado en la base, y ofrecen a nuestras tropas entrenamiento ocasional contra un potencial [TAL.GetFlag] [AFG.GetFlag] invasión afgana [TAJ.GetFlag] Tayikistán. También nos pagan un arrendamiento que contribuye a nuestra economía.\n§W------------------§!\nEste espíritu nacional será §RRetirado§! si nos deshacemos de [CHI.GetFlag] §HAcceso militar chino§!"
 TAJ_tajik_barrier: "Barrera tayika"
 TAJ_tajik_barrier_desc: "Nuestra nación sirve como barrera para nosotros, ya que nuestras altas montañas frenan la propagación de ideas y creencias peligrosas, incluso en un mundo tan conectado en el día moderno."
 TAJ_legacy_of_uto_idea: "Legado de la OTU"
 TAJ_legacy_of_uto_idea_desc: "El legado de la OTU resuena fuertemente con nuestros miembros y personas del partido, ya que nunca olvidaremos los sacrificios hombres valientes hechos en el campo de batalla."
 TAJ_revolutionary_patrionism: "Patriotismo Revolucionario"
 TAJ_revolutionary_patrionism_desc: "La forma más alta del patriotismo proviene de reconocer y abrazar el nuevo orden, y el gobierno."
 TAJ_orionbank: "Orienbank"
 TAJ_orionbank_desc: "En 1925, Orienbank es el banco más antiguo de Tayikistán, que sirve como institución importante para nuestra economía de naciones."
 TAJ_isik: "IS-KP"
 TAJ_isik_desc: "IS-KP, también conocido como Estado Islámico en la provincia de Khorasan ha comenzado una lucha contra nuestro gobierno, y otros en la región, y han prometido derrocar a nuestro estado y aquellos que ellos consideran «infieles» y 'herética'.\n§W------------------§!\nEste espíritu nacional será §R Removido§! si traemos nuestra §H Amenaza del Terror§! a §GNegligible§! y nuestra §HRadicalization§! a §GLow§!.\n§W------------------§!\nSi bien este espíritu nacional está activo, §RIS-KP§! lanzará una §R Guerra Civil§! si §H la Ideología del Salafismo§! excede el 25%, y nuestro §HEstabilidad§! es inferior al 40%"
 TAJ_temp_negotiations: "Negociaciones en curso"
 TAJ_temp_negotiations_desc: "Hemos abierto negociaciones con el pueblo de Badakhshani para otorgarles más autonomía.\n§W------------------§!\nEste espíritu nacional será §R Removido§! una vez que terminemos las negociaciones con el [BDA.GetFlag] §H Gobierno de Alemania-Badakhshan§!"
 TAJ_rahmons_rotten_fruit: "Tajikistan's Rotten Fruit"
 TAJ_rahmons_rotten_fruit_desc: "La corrupción es un lugar común en [TAJ.GetFlag] Tajik society, and the [TAJ.GetFlag] Los tayikos no son extraños al trato injusto y nepotista por parte del gobierno. Esta corrupción se está comiendo lentamente en el potencial de las naciones, y es la razón del éxodo cerebral que actualmente está asolando a la nación joven.\n§W------------------§!\nEste espíritu nacional puede ser §RRetirado§! si bajamos por el §HCambio en la Stance§! rama en el §HÁrbol de enfoque§!.\n§W------------------§!\nEste espíritu nacional no puede ser §RRetirado§! si decidimos hacer el §HMáscaras de oro§! Centrarse."
 TAJ_rahmons_ripe_fruits: "Fruto de Ripe de Tayikistán"
 TAJ_rahmons_ripe_fruits_desc: "Tayikistán ha demostrado ser digno de servir a su pueblo, y hará como tal durante muchos años."
