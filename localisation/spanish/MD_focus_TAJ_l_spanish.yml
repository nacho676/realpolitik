 TAJ_local_militias_desc: "Milicias locales han decidido tomar armas y prepararse en el caso de una invasión de nuestra patria!"
 TAJ_emomali_rahom_desc: "Emomali Rahmonov es el presidente de Tayikistán desde hace muchos años, en el poder desde 1992. Ganó protagonismo tras la caída de la Unión Soviética y el estallido de la guerra civil tayika (1992-1997), durante la cual consolidó su gobierno derrotando a varias facciones opositoras, entre ellas fuerzas islamistas y prodemocráticas. Rahmonov ha mantenido un gobierno muy centralizado y autoritario, que suele recurrir a la represión para sofocar la disidencia política y la libertad de prensa. Bajo su mando, Tayikistán sigue siendo un estrecho aliado de Rusia y enfrenta dificultades económicas, con gran dependencia de las remesas de los trabajadores migrantes tayikos en el extranjero, sobre todo en Rusia. Su administración también se ha distinguido por impulsar la unidad nacional promoviendo la identidad y la lengua tayikas y tomando distancia de la influencia cultural rusa, a la vez que combate a los movimientos islámicos radicales dentro del país."
 TAJ_emomali_rahom_desc2: "Emomali Rahmon es el Presidente de Tayikistán, que desde 1992 ha estado en el poder. Subió a la prominencia después de la caída de la Unión Soviética y el estallido de la Guerra Civil Tayika (1992-1997), durante la cual consolidó su gobierno derrotando varias facciones de oposición, incluyendo fuerzas islamistas y prodemocracias. Rahmon ha mantenido un gobierno altamente centralizado y autoritario, a menudo utilizando la represión para suprimir el disentimiento político y la libertad de los medios. Bajo Rahmon, Tayikistán ha permanecido un estrecho aliado de Rusia y ha luchado con desafíos económicos, dependiendo en gran medida de las remesas de los trabajadores migrantes tayikos en el extranjero, especialmente en Rusia. Su administración también ha estado marcada por los esfuerzos encaminados a promover la unidad nacional mediante la promoción de la identidad y el idioma tayikos, distanciando de las influencias culturales rusas, al tiempo que lucha contra los movimientos islámicos radicales dentro del país."
 TAJ_badakhshan_resistance_dynamic_modifier_desc: "A lo largo de la guerra civil tayika (1992-1997), Gorno-Badakhshan se convirtió en un bastión para las fuerzas de oposición que abogan por una mayor autonomía o independencia absoluta de Tayikistán. Incluso después de la guerra, muchos en Badakhshan continuaron desafiando al gobierno central, exigiendo más libertad política y derechos económicos. Las quejas de la población local se derivan de un sentido de exclusión política y negligencia por parte del gobierno, que se percibe como priorizar los intereses de la mayoría tayika mientras socava la autonomía de la región."
 TAJ_social_amenities: "Servicios sociales"
 TAJ_social_amenities_desc: "Muchas amenidades sociales faltan del promedio de la casa Tajik. Podemos cambiar eso, y lo cambiaremos."
 TAJ_disinformation_campaign: "Campaña de desinformación"
 TAJ_disinformation_campaign_desc: "Al lanzar una campaña de desinformación contra la UTO, seguro debilitaremos la confianza del pueblo en ella."
 TAJ_sarikol_range_seceded: "[CHI.GetFlag] Control chino sobre el rango de Sarikol"
 TAJ_sarikol_range_seceded_desc: "El Rango de Sarikol es una región montañosa en los Pamires, situada en la parte más oriental de Tayikistán cerca de la frontera con China y Afganistán. Esta gama forma parte del sistema Pamir-Alay más amplio y se caracteriza por sus picos escarpados y valles de alta altitud. Sirve de frontera natural, separando la Región Autónoma Tajik Gorno-Badakhshan de la provincia china Xinjiang. La cordillera de Sarikol está escasamente poblada, ya que los pueblos wakhi y kirguís son los principales habitantes de las zonas circundantes. También forma parte de la famosa región «Roof of the World», conocida por sus impresionantes paisajes y su significado histórico estratégico como encrucijada de la Ruta de la Seda."
