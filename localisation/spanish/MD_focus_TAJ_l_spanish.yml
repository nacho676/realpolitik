 TAJ_tajik_drugs: "Estupefacientes tayikos"
 TAJ_tajik_drugs_desc: "El gobierno tayiko [TAJ.GetFlag] ha decidido que quiere jugar con fuego. Están dejando intencionadamente entrar drogas para entrar en nuestro país. Aunque no reconocen oficialmente esta acción, sabemos que están haciendo esto por influencia económica y política sobre nuestro gobierno.\n§W------------------§!\n[TAJ.GetFlag] Tayikistán nos pedirá inversiones o asistencia, y si rechazamos ellos podrían §R aumentar§! la cantidad de narcóticos que fluyen. No podemos amenazarlos oficialmente si están en §HCSTO§!, sin embargo si los amenazamos, entonces pueden buscar ayuda de otro poder, quitándolos de nuestra esfera de influencia."
