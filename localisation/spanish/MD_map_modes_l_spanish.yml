l_spanish:
 MAPMODE_EU_MAP_MODE_NAME: "UE"
 MAPMODE_EU_MAP_MODE: "UE"
 MAPMODE_EU_MAP_MODE_DESCRIPTION: "Muestra a los Estados miembros de la UE, potenciales miembros y titulares actuales de oficinas dentro de la Unión Europea."
 EU_map_mode_tooltip: "Unión Europea"
 EU_map_mode_tooltip_delayed: "Muestra la composición y el liderazgo actuales de la Unión Europea.\n\n§HLa leyenda del color:§!\n§nBlue§! = Estado Miembro de la UE\n§YGold§! = potencial Estado miembro\n\n§HOffice Holders:§!\n§RRed§! = Presidente de la Comisión Europea, Consejo Europeo o Parlamento Europeo\n§9Brown§! = Secretario General de la Marina Euro\n§GGreen§! = Secretario General de EuroArmy\n§CCyan§! = Alto Representante para Asuntos Exteriores y Política de Seguridad\n§0Purple§! = Ministro Europeo de Economía y Finanzas\n§YYellow§! = Presidente del Banco Central Europeo\n§PDeep Pink§! = Director de Frontex\n§OOrange§! = Embajador de la UE ante las Naciones Unidas\n§pPink§! = Presidente de la Federación Europea\n\nActualizado semanalmente."
 MAPMODE_GDP_C_MAP_MODE_NAME: "PIB per cápita"
 MAPMODE_GDP_C_MAP_MODE: "PIB per cápita"
 MAPMODE_GDP_C_MAP_MODE_DESCRIPTION: "Este modo de mapa muestra el PIB per cápita de una nación, representando la producción económica promedio por persona."
 gdp_c_map_mode_tooltip: "PIB per cápita de [FROM.CONTROLLER.GetNameWithFlag]"
 gdp_c_map_mode_tooltip_delayed: "El PIB per cápita de §Y[FROM.CONTROLLER.GetNameWithFlag]§! es: §Y$[?FROM.CONTROLLER:gdp_per_capita|Y]K§!.\n\nEl PIB per cápita representa el producto económico por persona. Los valores superiores indican una economía más rica y productiva.\n\n§HColor Legend:§!\n§nDeep Blue§! = Under 8K (Low income)\n§lBright Blue§! = 8K - 18K (ingreso medio alcantarillado)\n§CCyan§! = 18K - 32K (Ingresos medianos)\n§GGreen§! = 32K - 60K (Ingresos medios de consumo)\n§YYellow§! = 60K - 110K (ingresos altos)\n§9 Oro derecho§! = Sobre 110K (Extremadamente rico)\n\nActualizado con la garrapata económica semanal."
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_NAME: "Energía Unfulfillment"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE: "Energía Unfulfillment"
 MAPMODE_ENERGY_CONSUMPTION_MAP_MODE_DESCRIPTION: "Este modo de mapa muestra el porcentaje actual de demanda energética insatisfecha en los países."
 energy_consumption_map_mode_tooltip: "Consumo de Energía Unfulfillment in [FROM.CONTROLLER.GetNameWithFlag]"
 energy_consumption_map_mode_tooltip_delayed: "Consumo de Energía Unfulfillment in §Y[FROM.CONTROLLER.GetNameWithFlag]§! es: §Y[?FROM.CONTROLLER:unfulfilled_energy_demand_var|%+]§!\n\nEsto muestra el porcentaje de demanda energética que no se está cumpliendo. Un valor negativo significa que la demanda supera la oferta (déficit energético).\n\n§HColor Legend:§!\n§nDeep Blue§! = Under -30% (Severe deficit)\n§lBright Blue§! = -30% a -18% (déficit moderado)\n§CCyan§! = -18% a -12% (déficit secundario)\n§GGreen§! = -12% a -4% (cercamente conocido)\n§YYellow§! = -4% a -1% (casi se reunió)\n§9Bright Gold§! = Sobre -1% (Fully met)\n\n§nDarker es peor.§! Invertir en producción de energía para mejorar.\nActualizado con la garrapata económica semanal."
 MAPMODE_PRODUCTIVITY_MAP_MODE_NAME: "Productividad"
 MAPMODE_PRODUCTIVITY_MAP_MODE: "Productividad"
 MAPMODE_PRODUCTIVITY_MAP_MODE_DESCRIPTION: "Este modo de mapa muestra la productividad actual de los estados individuales, representando la eficiencia de producción económica por trabajador."
 productivity_map_mode_tooltip: "Productividad en [FROM.GetName]"
 productivity_map_mode_tooltip_delayed: "La productividad en §Y[FROM.GetName]§! es: §Y[?FROM.productivity_state_var|Y]§!\n\nLa productividad mide la eficiencia de producción económica de un estado. Los valores más altos significan una mayor producción económica por trabajador.\n\n§HColor Legend:§!\n§nPúrpura profunda§! = debajo de 200 (muy bajo)\n§nDeep Blue§! = 200 - 500 (Low)\n§lBright Blue§! = 500 - 800 (bajo promedio)\n§CCyan§! = 800 - 1200 (Apromedio)\n§GGreen§! = 1200 - 1900 (promedio del archivo)\n§YYellow§! = 1900 - 3800 (High)\n§9 Oro derecho§! = 3800 - 5000 (muy alto)\n§9Deep Orange§! = Arriba de 5000 (Excelente)\n\nActualizado con la garrapata económica semanal."
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_NAME: "Puntos calientes renovables"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE: "Puntos calientes renovables"
 MAPMODE_RENEWABLE_ENERGY_HOTSPOT_MAP_MODE_DESCRIPTION: "Este modo de mapa muestra el potencial natural de energía renovable de cada estado, basado en el viento, solar y otros factores geográficos."
 renewable_energy_hotspot_map_mode_tooltip: "Bono de Capacidad de Energía Renovable en [FROM.GetName]"
 renewable_energy_hotspot_map_mode_tooltip_delayed: "Bono de Capacidad de Energía Renovable en §Y[FROM.GetName]§! es: §Y[?FROM.state_renewable_capacity_factor_modifier_var|Y]§!\n\nEste es un multiplicador de la producción renovable del estado: §Y1.0§! es el promedio mundial, por lo que un estado en 1,5 produce 1.5x el promedio y uno a 0,5 mitad de él.\n\n§HColor Legend (1.0 = promedio mundial):§!\n§RRed§! = Arriba 1.6 (excepcional)\n§9Gold§! = 1.45 - 1.6 (sobresaliente)\n§YYellow§! = 1.2 - 1.45 (muy por encima de la media)\n§GGreen§! = 1.0 - 1.2 (promedio total)\n§CTeal§! = 0.8 - 1.0 (situablemente inferior a la media)\n§nBlue§! = 0,6 - 0,8 (pobre)\n§HDark Blue§! = A continuación 0,6 (muy pobre)\n\nEste valor se fija y no cambia con el tiempo."
 MAPMODE_INFLUENCE_MAP_MODE_NAME: "Influencia"
 MAPMODE_INFLUENCE_MAP_MODE: "Influencia"
 MAPMODE_INFLUENCE_MAP_MODE_DESCRIPTION: "Muestra tu posición de influencia en otros países. La influencia determina el apalancamiento diplomático y afecta la alineación política con el tiempo."
 influence_map_mode_tooltip: "Modo de Mapa de Influencia"
 influence_map_mode_tooltip_delayed: "Muestra países donde usted tiene influencia, su clasificación entre influencers y naciones establecidas para la autoinfluencia.\n\nLa influencia determina su apalancamiento diplomático sobre una nación. El ranking más alto significa una mayor influencia sobre su alineación política y la política exterior.\n\n§HLa leyenda del color:§!\n§GGreen§! = Su nación\n§CCyan§! = 1.º Influencer (dominant)\n§lLight Blue§! = 2.º o 3.º Influencer\n§nNavy Blue§! = 4.º a 7.º Influencer\n§9Orange§! = Nación Autoinfluenciada (mensual)\n§RRed§! = Enfriamiento de la gripe por esparcimiento (recientemente dirigido)\n§HDark Gray§! = Sin influencia\n\nActualizado semanalmente."
 MAPMODE_GCC_MAP_MODE_NAME: "CCG"
 MAPMODE_GCC_MAP_MODE: "CCG"
 MAPMODE_GCC_MAP_MODE_DESCRIPTION: "Muestra a los Estados miembros y potenciales miembros del Consejo de Cooperación del Golfo."
 GCC_map_mode_tooltip: "Consejo de Cooperación del Golfo"
 GCC_map_mode_tooltip_delayed: "Muestra la composición actual del Consejo de Cooperación del Golfo (CCG).\n\n§HLa leyenda del color:§!\n§CTeal§! = Estado miembro del CCG\n§GYellow-Green§! = potencial Estado miembro\n\nActualizado semanalmente."
 MAPMODE_SCO_MAP_MODE_NAME: "Modo de Mapa de la OCS"
 MAPMODE_SCO_MAP_MODE: "Modo de Mapa de la OCS"
 MAPMODE_SCO_MAP_MODE_DESCRIPTION: "Muestra estados miembros, observadores y potenciales miembros de la Organización de Cooperación de Shanghai."
 SCO_map_mode_tooltip: "Organización de cooperación de Shanghai"
 SCO_map_mode_tooltip_delayed: "Muestra la composición actual de la Organización de Cooperación de Shanghai (SCO).\n\n§HLa leyenda del color:§!\n§9Orange§! = Estado Miembro de la OCS\n§0Purple§! = Estado observador\n§CCyan§! = Socio de Diálogo\n§YYellow§! = potencial Estado miembro\n\nActualizado semanalmente."
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_NAME: "Tasa de desempleo"
 unemployment_rate_map_mode_tooltip: "Tasa de desempleo en [FROM.CONTROLLER.GetNameWithFlag]"
 unemployment_rate_map_mode_tooltip_delayed: "Tasa de desempleo en §Y[FROM.CONTROLLER.GetNameWithFlag]§! es: §Y[?FROM.CONTROLLER:total_unemployed_percentage_display|%Y]§!\n\nEsto muestra el porcentaje de la población en edad laboral que está desempleada.\n\n§HColor Legend:§!\n§nDeep Blue§! = Sobre el 35% (Crisis)\n§lBright Blue§! = 22% - 35% (Muy alto)\n§CCyan§! = 10% - 22% (High)\n§GGreen§! = 5% - 10% (Moderado)\n§YSíguelo§! = 2% - 5% (Low)\n§9Bright Gold§! = Under 2% (Full employment)\n\n§nDarker es peor.§! Reducir el desempleo a través del crecimiento económico y la política.\nActualizado con la garrapata económica semanal."
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE: "Tasa de desempleo"
 MAPMODE_UNEMPLOYMENT_RATE_MAP_MODE_DESCRIPTION: "Este modo de mapa muestra la tasa actual de desempleo de los países como porcentaje de la población en edad de trabajar."
 MAPMODE_SUBIDEOLOGY_MAP_MODE_NAME: "Partido de los Ruidos"
 MAPMODE_SUBIDEOLOGY_MAP_MODE: "Partido de los Ruidos"
 MAPMODE_SUBIDEOLOGY_MAP_MODE_DESCRIPTION: "Muestra la subideología del partido que gobierna cada país, con la participación de los partidos gobernantes en el buce."
 subideology_map_mode_tooltip: "Fiesta rugiente de [FROM.CONTROLLER.GetNameWithFlag]"
 subideology_map_mode_tooltip_delayed: "§H[FROM.CONTROLLER.GetNameWithFlag]§!\n\n§HPartido Ruling:§![FROM.CONTROLLER.map_mode_ruling_party]\n\n§HGovernment Coalition:§![FROM.CONTROLLER.map_mode_coalition_none][FROM.CONTROLLER.L_coal_elect_percent_0][FROM.CONTROLLER.L_coal_elect_percent_1][FROM.CONTROLLER.L_coal_elect_percent_2][FROM.CONTROLLER.L_coal_elect_percent_3][FROM.CONTROLLER.L_coal_elect_percent_4][FROM.CONTROLLER.L_coal_elect_percent_5][FROM.CONTROLLER.L_coal_elect_percent_6][FROM.CONTROLLER.L_coal_elect_percent_7][FROM.CONTROLLER.L_coal_elect_percent_8][FROM.CONTROLLER.L_coal_elect_percent_9][FROM.CONTROLLER.L_coal_elect_percent_10][FROM.CONTROLLER.L_coal_elect_percent_11][FROM.CONTROLLER.L_coal_elect_percent_12][FROM.CONTROLLER.L_coal_elect_percent_13][FROM.CONTROLLER.L_coal_elect_percent_14][FROM.CONTROLLER.L_coal_elect_percent_15][FROM.CONTROLLER.L_coal_elect_percent_16][FROM.CONTROLLER.L_coal_elect_percent_17][FROM.CONTROLLER.L_coal_elect_percent_18][FROM.CONTROLLER.L_coal_elect_percent_19][FROM.CONTROLLER.L_coal_elect_percent_20][FROM.CONTROLLER.L_coal_elect_percent_21][FROM.CONTROLLER.L_coal_elect_percent_22][FROM.CONTROLLER.L_coal_elect_percent_23]\n\n§HTotal Government Support:§! §Y[?FROM.CONTROLLER:government_coalition_strength_elect|%1]§!\n\nLos porcentajes son la cuota de voto que cada partido ganó en las últimas elecciones, por lo que naciones que nunca han tenido un programa 0.0%.\n\n§HColor Leyenda:§!\nCada partido mantiene el color que tiene en la política ver la carta de tarta.\n§nAzules§! = Partidos occidentales\n§RRojos§! = Partes emergentes\n§GVerdes§! = Partidos salafistas e islamistas\n§YAmarillos y grises§! = Partidos neutrales\n§9Naranja, oliva y púrpura§! = Partidos nacionalistas\n\nActualizado cada vez que un gobierno cambia."
 map_mode_ruling_party_text: "\n[show_ruling_party] ([?party_pop_elect_array^ruling_party|%1])"
 map_mode_coalition_none_text: "\nNinguno (gobierno único)"