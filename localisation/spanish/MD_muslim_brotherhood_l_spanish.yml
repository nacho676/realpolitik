l_spanish:
 muslim_brotherhood_sponsor: "Red de Hermandad Musulmana"
 muslim_brotherhood_suppressor: "Contra la Hermandad"
 MB_build_network_hub: "Construir la organización internacional"
 MB_build_network_hub_desc: "La Hermandad Musulmana es un movimiento que cruza las fronteras, sus afiliados dispersos por toda la región sin un solo centro. Que [Root.GetNameDef] se convierta en ese centro, coordinando la red y dándonos los medios para apoyar a nuestros hermanos en el extranjero."
 MB_fund_affiliates: "Fondo Afiliados de la Hermandad"
 MB_fund_affiliates_desc: "La Hermandad en [FROM.GetNameDef] es dispuesta pero pobre. El dinero, los organizadores y un flujo constante de apoyo fortalecerán su mano contra un gobierno que preferiría verlos desaparecidos."
 MB_diplomatic_solidarity: "Llamar a la solidaridad de los Hermanos"
 MB_diplomatic_solidarity_desc: "Los gobiernos alineados con los Hermanos están más fuertes juntos que separados. Reunirlos en una mesa, reafirmar la causa común y dejar que el calor entre nosotros se sienta en todo el bloque."
 MB_bankroll_crackdown: "Financiar una represión en el extranjero"
 MB_bankroll_crackdown_desc: "[FROM.GetNameDef] mira que la Hermandad crece dentro de sus fronteras sin los medios para actuar. Ofrézcales los fondos e inteligencia para atacar primero, antes de que el movimiento reúna la fuerza suficiente para amenazar al estado."
 MB_designate_terrorist_organization: "Designar a los Hermanos Musulmanes organización terrorista"
 MB_designate_terrorist_organization_desc: "Calificar a los Hermanos Musulmanes como lo que declaramos que son: una organización terrorista. La designación cuesta poco en casa y coloca a [Root.GetNameDef] hombro con hombro con todos los gobiernos que han trazado la misma línea."
 MB_counter_sponsor_influence: "Exponer la financiación de la Hermandad"
 MB_counter_sponsor_influence_desc: "Alguien financia a los Hermanos en [FROM.GetNameDef], y el dinero deja rastro. Exponerlo, desbaratarlo y ver cómo el movimiento pierde impulso a medida que sus patrocinadores son sacados a la luz."
 MB_rescind_terrorist_designation: "Rescindir la designación terrorista"
 MB_rescind_terrorist_designation_desc: "Dejar caducar discretamente la designación terrorista. La postura contra los Hermanos ha cumplido su propósito y poco se gana manteniendo viejos agravios en los libros."
 MB_sponsored_network: "Patrocinar nuestro movimiento de la Hermandad"
 MB_funding_subversion: "Subversión de la Hermandad en el extranjero"
 MB_solidarity: "Hermandad Musulmana solidaridad"
 MB_crackdown_patron: "Bloqueó nuestra represión."
 MB_funding_repression: "Financiación de la represión de la Hermandad"
 MB_counter_bloc: "Posición común contra la Hermandad"
 MB_branded_terrorist: "Marcar la Hermandad un grupo terrorista"
 brotherhood.6.c: "Cooptar a sus moderados en el gobierno."
 brotherhood.11.t: "Una oferta para financiar una crisis"
 brotherhood.11.d: "[FROM.GetNameDef] nos ha ofrecido silenciosamente dinero e inteligencia para suprimir la Hermandad Musulmana antes de que crezca más fuerte. Sus enviados están esperando una respuesta."
 brotherhood.11.a: "Aceptar la financiación y pasar contra ellos."
 brotherhood.11.b: "Descansa la oferta."