l_spanish:
 mdr_space_program_folder: "Programa espacial"
 mdr_space_program_folder_desc: "Lanzadores, vuelo tripulado, industria y defensa en órbita. Los satélites siguen en su propia pestaña."
 CAT_mdr_space: "Programa espacial"
 CAT_mdr_space_research: "Programa espacial"
 MDR_SPACE_TECH_TOTAL: "76"
 MDR_SPACE_COLUMN_0: "LANZAMIENTO"
 MDR_SPACE_COLUMN_1: "VIDA Y SEGURIDAD"
 MDR_SPACE_COLUMN_2: "RECURSOS Y ENERGÍA"
 MDR_SPACE_COLUMN_3: "DEFENSA ORBITAL"
 MDR_SPACE_COLUMN_4: "INDUSTRIA ORBITAL"
 MDR_SPACE_COLUMN_5: "VIAJES ESPACIALES"
 mdr_sp_foundations: "Fundamentos del programa espacial"
 mdr_sp_foundations_desc: "Formar ingenieros, estudiar la órbita y sentar las bases de un programa. Permite fundar una agencia espacial.\n\n§YAbre:§! crear la agencia espacial y construir cosmódromos."
 mdr_sp_launcher: "Lanzador orbital"
 mdr_sp_launcher_desc: "Un cohete propio capaz de poner una carga en órbita baja.\n\n§YAbre en el menú del programa:§! Banco de motores, Cuenta regresiva automatizada, Sonda a la Luna, Vender lanzamientos."
 mdr_sp_heavy: "Lanzador pesado"
 mdr_sp_heavy_desc: "Más de 20 toneladas en órbita baja: estaciones, sondas y satélites grandes.\n\n§YAbre en el menú del programa:§! Propulsor lateral pesado, Sonda a Marte, Misión tripulada a la Luna."
 mdr_sp_cryogenic: "Etapa criogénica"
 mdr_sp_cryogenic_desc: "Hidrógeno y oxígeno líquidos para llegar más lejos con la misma masa.\n\n§YAbre en el menú del programa:§! Etapa superior reencendible."
 mdr_sp_smalllauncher: "Lanzador ligero comercial"
 mdr_sp_smalllauncher_desc: "Cohetes chicos y baratos para satélites pequeños."
 mdr_sp_reusable: "Primera etapa reutilizable"
 mdr_sp_reusable_desc: "La primera etapa vuelve y aterriza: cada lanzamiento cuesta mucho menos.\n\n§YAbre en el menú del programa:§! Ensayo de recuperación."
 mdr_sp_reusable_once: "§GAl terminarla, una vez:§! 42 de ciencia y un proyecto o misión más a la vez."
 mdr_sp_rapidreuse: "Reutilización rápida"
 mdr_sp_rapidreuse_desc: "Volver a volar el mismo cohete en días, no en meses."
 mdr_sp_superheavy: "Lanzador superpesado"
 mdr_sp_superheavy_desc: "Más de 100 toneladas en órbita baja: lo necesario para ir a la Luna y a Marte.\n\n§YAbre en el menú del programa:§! Plataforma superpesada."
 mdr_sp_superheavy_once: "§GAl terminarla, una vez:§! 8 de prestigio."
 mdr_sp_refuel: "Reabastecimiento en órbita"
 mdr_sp_refuel_desc: "Cargar combustible en órbita multiplica lo que se puede enviar lejos.\n\n§YAbre en el menú del programa:§! Tecnología de depósitos, Remolcador orbital."
 mdr_sp_nuclear: "Propulsión nuclear térmica"
 mdr_sp_nuclear_desc: "Un reactor calienta el propelente y acorta a la mitad los viajes a Marte."
 mdr_sp_electric: "Propulsión eléctrica de alta potencia"
 mdr_sp_electric_desc: "Motores iónicos de megavatios para cargas pesadas entre planetas."
 mdr_sp_fullflow: "Motores de ciclo completo"
 mdr_sp_fullflow_desc: "El límite práctico de los motores químicos: más empuje y menos costo."
 mdr_sp_massdriver: "Catapulta electromagnética lunar"
 mdr_sp_massdriver_desc: "Lanzar carga desde la Luna sin cohetes, aprovechando su baja gravedad."
 mdr_sp_cruiser: "Nave de transporte interplanetario"
 mdr_sp_cruiser_desc: "Una nave de uso permanente entre la Tierra y Marte."
 mdr_sp_crewed: "Vuelo tripulado"
 mdr_sp_crewed_desc: "Cápsulas y entrenamiento para llevar personas a la órbita y traerlas de vuelta.\n\n§YAbre en el menú del programa:§! Trajes espaciales propios, Cuerpo de astronautas, Cápsula tripulada propia, Misión tripulada a la Luna."
 mdr_sp_crewed_once: "§GAl terminarla, una vez:§! 86 de poder político, estabilidad, 6 de prestigio y 4 astronautas."
 mdr_sp_station: "Estación orbital"
 mdr_sp_station_desc: "Un laboratorio habitado de forma permanente en órbita.\n\n§YAbre en el menú del programa:§! Estación orbital propia."
 mdr_sp_station_once: "§GAl terminarla, una vez:§! Un proyecto o misión más a la vez."
 mdr_sp_longstay: "Estadías prolongadas"
 mdr_sp_longstay_desc: "Medicina y rutinas para pasar un año entero en órbita.\n\n§YAbre en el menú del programa:§! Medicina espacial."
 mdr_sp_commercialcrew: "Tripulación comercial"
 mdr_sp_commercialcrew_desc: "Empresas privadas que llevan astronautas por contrato."
 mdr_sp_commercialcrew_once: "§GAl terminarla, una vez:§! 6 astronautas y 54 de poder político."
 mdr_sp_lifesupport: "Soporte vital cerrado"
 mdr_sp_lifesupport_desc: "Reciclar el agua y el aire casi por completo para misiones largas.\n\n§YAbre en el menú del programa:§! Ciclo cerrado de soporte vital."
 mdr_sp_radiation: "Protección contra la radiación"
 mdr_sp_radiation_desc: "Blindajes y refugios para vivir lejos del campo magnético terrestre.\n\n§YAbre en el menú del programa:§! Refugios contra la radiación."
 mdr_sp_habitat: "Hábitat lunar"
 mdr_sp_habitat_desc: "Módulos que protegen a una tripulación del frío y de la radiación de la Luna.\n\n§YAbre en el menú del programa:§! Base lunar, Base marciana."
 mdr_sp_surface: "Operaciones de superficie"
 mdr_sp_surface_desc: "Trajes y vehículos para trabajar semanas fuera de la base."
 mdr_sp_deepmission: "Misiones de larga duración"
 mdr_sp_deepmission_desc: "Tripulaciones que pasan años lejos de la Tierra, rumbo a Marte."
 mdr_sp_marslanding: "Descenso tripulado en Marte"
 mdr_sp_marslanding_desc: "Posar decenas de toneladas en Marte y volver a despegar.\n\n§YAbre en el menú del programa:§! Misión tripulada a Marte."
 mdr_sp_marslanding_once: "§GAl terminarla, una vez:§! 12 de prestigio, estabilidad y apoyo a la guerra."
 mdr_sp_gravity: "Gravedad artificial"
 mdr_sp_gravity_desc: "Naves que giran para proteger los huesos y el corazón."
 mdr_sp_torpor: "Letargo médico"
 mdr_sp_torpor_desc: "Reducir el metabolismo para bajar comida, agua y radiación en el viaje."
 mdr_sp_biosphere: "Biosfera cerrada"
 mdr_sp_biosphere_desc: "Una colonia que produce casi todo lo que come y respira.\n\n§YAbre en el menú del programa:§! Gran domo marciano."
 mdr_sp_tracking: "Red de seguimiento"
 mdr_sp_tracking_desc: "Antenas y radares terrestres para seguir y controlar lo que está en órbita.\n\n§YAbre en el menú del programa:§! Telescopio espacial."
 mdr_sp_powerarrays: "Paneles solares de alto rendimiento"
 mdr_sp_powerarrays_desc: "Células de varias capas nacidas de los satélites.\n\n§YAbre en el menú del programa:§! Satélite solar de prueba."
 mdr_sp_rtg: "Generadores de radioisótopos"
 mdr_sp_rtg_desc: "Energía durante décadas para sondas lejos del Sol.\n\n§YAbre en el menú del programa:§! Programa de radioisótopos, Sonda a Júpiter."
 mdr_sp_prospecting: "Prospección lunar"
 mdr_sp_prospecting_desc: "Sondas que cartografían el hielo y los minerales de la Luna."
 mdr_sp_solar: "Energía solar orbital"
 mdr_sp_solar_desc: "Paneles más livianos y primeros ensayos de enviar energía desde la órbita."
 mdr_sp_lunarice: "Extracción de hielo lunar"
 mdr_sp_lunarice_desc: "Sacar agua de los cráteres polares para beber y hacer combustible.\n\n§YAbre en el menú del programa:§! Uso de recursos in situ, Minas de hielo lunar."
 mdr_sp_lunarice_once: "§GAl terminarla, una vez:§! 38 de ciencia."
 mdr_sp_fission: "Reactor de superficie"
 mdr_sp_fission_desc: "Un reactor pequeño que da energía durante la noche lunar.\n\n§YAbre en el menú del programa:§! Reactor para la superficie."
 mdr_sp_regolith: "Minería de regolito"
 mdr_sp_regolith_desc: "Sacar oxígeno y metales del suelo lunar para no llevarlos desde la Tierra.\n\n§YAbre en el menú del programa:§! Minería de regolito."
 mdr_sp_regolith_once: "§GAl terminarla, una vez:§! 10 de aluminio en la capital."
 mdr_sp_marsfuel: "Combustible marciano"
 mdr_sp_marsfuel_desc: "Fabricar metano y oxígeno con la atmósfera de Marte para volver.\n\n§YAbre en el menú del programa:§! Planta de combustible marciano."
 mdr_sp_asteroidsurvey: "Catálogo de asteroides"
 mdr_sp_asteroidsurvey_desc: "Conocer la composición de los asteroides cercanos."
 mdr_sp_asteroidsurvey_once: "§GAl terminarla, una vez:§! 64 de ciencia."
 mdr_sp_asteroidmining: "Minería de asteroides"
 mdr_sp_asteroidmining_desc: "Traer metales y agua de un asteroide cercano.\n\n§YAbre en el menú del programa:§! Puesto en los asteroides."
 mdr_sp_asteroidmining_once: "§GAl terminarla, una vez:§! 16 de acero, 12 de cromo y 8 de tungsteno en la capital."
 mdr_sp_powerbeam: "Transmisión de energía desde la órbita"
 mdr_sp_powerbeam_desc: "Grandes plantas solares que envían energía a la Tierra.\n\n§YAbre en el menú del programa:§! Ensayo de energía transmitida, Estación solar en Mercurio."
 mdr_sp_powerbeam_once: "§GAl terminarla, una vez:§! Un espacio de edificio en la capital."
 mdr_sp_helium: "Estudio del helio-3"
 mdr_sp_helium_desc: "Evaluar si el helio-3 lunar serviría para la fusión."
 mdr_sp_debris: "Rastreo de basura espacial"
 mdr_sp_debris_desc: "Catalogar los restos en órbita para que los satélites puedan esquivarlos.\n\n§YAbre en el menú del programa:§! Radar de basura espacial, Acuerdo sobre basura espacial."
 mdr_sp_debris_once: "§GAl terminarla, una vez:§! Saca 2 de basura orbital, para todos."
 mdr_sp_awareness: "Vigilancia del espacio"
 mdr_sp_awareness_desc: "Saber qué hace cada objeto en órbita y de quién es.\n\n§YAbre en el menú del programa:§! Satélites de alerta."
 mdr_sp_hardening: "Satélites endurecidos"
 mdr_sp_hardening_desc: "Protección contra interferencias, láseres y explosiones.\n\n§YAbre en el menú del programa:§! Satélites protegidos."
 mdr_sp_spacecommand: "Mando espacial"
 mdr_sp_spacecommand_desc: "Una rama militar dedicada a la órbita.\n\n§YAbre en el menú del programa:§! Ensayo antisatélite."
 mdr_sp_avoidance: "Maniobras automáticas"
 mdr_sp_avoidance_desc: "Satélites que esquivan los choques por su cuenta."
 mdr_sp_cleanup: "Limpieza orbital"
 mdr_sp_cleanup_desc: "Naves que capturan restos y los sacan de órbita.\n\n§YAbre en el menú del programa:§! Misión de limpieza."
 mdr_sp_cleanup_once: "§GAl terminarla, una vez:§! Saca 11 de basura orbital, para todos."
 mdr_sp_patrol: "Patrulla orbital"
 mdr_sp_patrol_desc: "Naves que inspeccionan satélites ajenos de cerca."
 mdr_sp_planetary: "Defensa planetaria"
 mdr_sp_planetary_desc: "Detectar asteroides peligrosos a tiempo.\n\n§YAbre en el menú del programa:§! Vigilancia planetaria."
 mdr_sp_planetary_once: "§GAl terminarla, una vez:§! Estabilidad."
 mdr_sp_deflection: "Desvío de asteroides"
 mdr_sp_deflection_desc: "Impactos que cambian el rumbo de un asteroide."
 mdr_sp_deflection_once: "§GAl terminarla, una vez:§! 5 de prestigio y estabilidad."
 mdr_sp_cislunar: "Control del tráfico lunar"
 mdr_sp_cislunar_desc: "Reglas y radares para el espacio entre la Tierra y la Luna."
 mdr_sp_baseguard: "Protección de bases"
 mdr_sp_baseguard_desc: "Defender colonias de impactos, tormentas solares y sabotajes."
 mdr_sp_microgravity: "Experimentos en microgravedad"
 mdr_sp_microgravity_desc: "Materiales y medicamentos que solo se pueden hacer sin gravedad.\n\n§YAbre en el menú del programa:§! Laboratorio de microgravedad."
 mdr_sp_microgravity_once: "§GAl terminarla, una vez:§! 36 de ciencia."
 mdr_sp_smallsat: "Plataformas de satélites"
 mdr_sp_smallsat_desc: "Un mismo diseño base para muchos satélites.\n\n§YAbre en el menú del programa:§! Plataforma común de satélites, Fábrica de nanosatélites."
 mdr_sp_commercialsat: "Mercado de satélites"
 mdr_sp_commercialsat_desc: "Empresas que venden imágenes, datos y comunicaciones.\n\n§YAbre en el menú del programa:§! Programa de exportación."
 mdr_sp_constellation: "Megaconstelaciones"
 mdr_sp_constellation_desc: "Miles de satélites baratos en órbita baja."
 mdr_sp_constellation_once: "§GAl terminarla, una vez:§! Bono para las próximas 2 investigaciones de esta pestaña."
 mdr_sp_servicing: "Reparación en órbita"
 mdr_sp_servicing_desc: "Naves que reparan y recargan satélites."
 mdr_sp_manufacturing: "Fabricación orbital"
 mdr_sp_manufacturing_desc: "Talleres automáticos que producen lo que vale más que su transporte.\n\n§YAbre en el menú del programa:§! Planta orbital piloto."
 mdr_sp_manufacturing_once: "§GAl terminarla, una vez:§! 2 fábricas militares en la capital."
 mdr_sp_printing: "Impresión 3D en el espacio"
 mdr_sp_printing_desc: "Fabricar piezas y estructuras donde se necesitan.\n\n§YAbre en el menú del programa:§! Impresión 3D de piezas."
 mdr_sp_assembly: "Ensamblaje orbital"
 mdr_sp_assembly_desc: "Armar en órbita naves demasiado grandes para cualquier cohete."
 mdr_sp_lunarfactory: "Fábrica lunar"
 mdr_sp_lunarfactory_desc: "Producir en la Luna con materiales de la Luna."
 mdr_sp_lunarfactory_once: "§GAl terminarla, una vez:§! 3 fábricas civiles en la capital."
 mdr_sp_shipyard: "Astillero orbital"
 mdr_sp_shipyard_desc: "Construir y reparar naves interplanetarias en órbita.\n\n§YAbre en el menú del programa:§! Astillero orbital."
 mdr_sp_platform: "Plataforma orbital gigante"
 mdr_sp_platform_desc: "Una estructura de kilómetros, habitada y productiva."
 mdr_sp_platform_once: "§GAl terminarla, una vez:§! Un proyecto o misión más a la vez, y 8 de prestigio."
 mdr_sp_elevator: "Estudio del ascensor espacial"
 mdr_sp_elevator_desc: "Materiales y cálculos para un cable hasta la órbita. Es la investigación final de esta era."
 mdr_sp_elevator_once: "§GAl terminarla, una vez:§! 30 de prestigio, 180 de poder político, estabilidad y un proyecto o misión más a la vez."
 mdr_sp_navigation: "Navegación interplanetaria"
 mdr_sp_navigation_desc: "Calcular rumbos entre planetas. Sin esto no sale ninguna sonda hacia la Luna ni más lejos.\n\n§YAbre en el menú del programa:§! Sonda a la Luna."
 mdr_sp_gravityassist: "Asistencia gravitatoria"
 mdr_sp_gravityassist_desc: "Usar la gravedad de los planetas para llegar más lejos. Abre Venus, Mercurio y Marte.\n\n§YAbre en el menú del programa:§! Sonda a Mercurio, Sonda a Venus, Sonda a Marte."
 mdr_sp_translunar: "Inyección translunar"
 mdr_sp_translunar_desc: "Mandar una tripulación a la Luna y traerla de vuelta. Obligatoria para la misión tripulada.\n\n§YAbre en el menú del programa:§! Misión tripulada a la Luna."
 mdr_sp_translunar_once: "§GAl terminarla, una vez:§! 4 de prestigio."
 mdr_sp_deepnet: "Red de espacio profundo"
 mdr_sp_deepnet_desc: "Antenas para hablar con naves muy lejanas. Obligatoria para Júpiter, Saturno y los asteroides.\n\n§YAbre en el menú del programa:§! Sonda a un asteroide, Sonda a Júpiter."
 mdr_sp_precisionland: "Descenso de precisión"
 mdr_sp_precisionland_desc: "Posarse a metros del lugar elegido. Obligatorio para las bases.\n\n§YAbre en el menú del programa:§! Base lunar, Módulo de descenso en Marte."
 mdr_sp_aerobrake: "Aerofrenado"
 mdr_sp_aerobrake_desc: "Frenar con la atmósfera en lugar de combustible. Obligatorio para bajar en Marte.\n\n§YAbre en el menú del programa:§! Módulo de descenso en Marte."
 mdr_sp_transithab: "Hábitat de tránsito"
 mdr_sp_transithab_desc: "Vivir meses en el viaje. Obligatorio para los vuelos tripulados a Marte.\n\n§YAbre en el menú del programa:§! Sobrevuelo tripulado de Marte."
 mdr_sp_marstransfer: "Ventana de transferencia a Marte"
 mdr_sp_marstransfer_desc: "Una tripulación que llega a Marte y vuelve. Obligatoria para pisar Marte.\n\n§YAbre en el menú del programa:§! Misión tripulada a Marte."
 mdr_sp_marstransfer_once: "§GAl terminarla, una vez:§! 8 de prestigio y 64 de poder político."
 mdr_sp_venusfloat: "Plataformas flotantes"
 mdr_sp_venusfloat_desc: "Globos en la atmósfera de Venus, a 50 km de altura. Abre la estación en Venus.\n\n§YAbre en el menú del programa:§! Estación flotante en Venus."
 mdr_sp_asteroidnav: "Encuentro con asteroides"
 mdr_sp_asteroidnav_desc: "Acercarse y anclarse a un cuerpo diminuto. Abre el puesto en los asteroides.\n\n§YAbre en el menú del programa:§! Puesto en los asteroides."
 mdr_sp_outerprop: "Propulsión al sistema exterior"
 mdr_sp_outerprop_desc: "Motores para llevar personas hasta las lunas de Júpiter. Abre Calisto.\n\n§YAbre en el menú del programa:§! Base en Calisto (Júpiter)."
 mdr_sp_titanentry: "Entrada en Titán"
 mdr_sp_titanentry_desc: "Descender entre nieblas y lagos de metano. Abre la base en Titán.\n\n§YAbre en el menú del programa:§! Base en Titán (Saturno)."
 mdr_sp_solarnet: "Red del sistema solar"
 mdr_sp_solarnet_desc: "Comunicaciones y rutas entre todos los puestos humanos. Es el final de los viajes de esta era."
 mdr_sp_solarnet_once: "§GAl terminarla, una vez:§! Un proyecto o misión más a la vez, y 12 de prestigio."
