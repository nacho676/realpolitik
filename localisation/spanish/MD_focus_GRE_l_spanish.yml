 GRE_ICBC: "Pedir prestado al ICBC"
 GRE_ICBC_desc: "El Banco Industrial y Comercial de China es uno de los bancos más grandes del mundo. Si cambiamos parte de nuestro poder adquisitivo y deudas a través del banco chino podemos asegurar una mayor cooperación con Beijing y ampliar nuestra capacidad para mantener nuestra creciente economía."
 GRE_chi_real_estate: "Inversiones inmobiliarias chinas"
 GRE_chi_real_estate_desc: "Los inversores de China han comenzado a mirar la compra de bienes en toda Grecia, especialmente en Atenas y las islas. Esta afluencia de capital extranjero puede aliviar la presión sobre las finanzas gubernamentales y atraer más inversión china, profundizando los vínculos económicos entre ambas naciones."
 GRE_chi_investments: "Inversiones chinas"
 GRE_chi_investments_desc: "China está interesada en proyectos extensivos en toda Grecia. Estos proyectos pueden dar vida nueva a áreas de la economía en las que no tenemos los recursos para mejorar por nosotros mismos."
 GRE_piraeus: "Subasta de Piraeus"
 GRE_piraeus_desc: "La subasta del puerto de Piraeus se ha discutido entre los miembros del gobierno y parece que, en medio de la crisis de la deuda, esto aliviará algo de presión sobre nosotros."
 GRE_piraeus_corruption: "Limitar a China"
 GRE_piraeus_corruption_desc: "Los planes de China de expandir su influencia en Grecia son un peligro para nuestra independencia de su influencia. Bajo el pretexto del Consejo Arqueológico Central, podemos detener cualquier plan de expansión de China en seco."
 GRE_chi_investments_piraeus: "Inversiones chinas alrededor de Piraeus"
 GRE_chi_investments_piraeus_desc: "Los chinos han mostrado un gran interés en invertir en las áreas alrededor del puerto de Piraeus. Aunque algunos señalan que este proyecto podría ser peligroso para nuestra independencia extranjera, eso es absolutamente absurdo."
 GRE_chi_nationwide_investments: "Inversiones chinas en todo el país"
 GRE_chi_nationwide_investments_desc: "Las ganancias de permitir que China invierta libremente en nuestro país son inmensas, debemos permitir que los chinos inviertan como deseen."
 GRE_invest_elliniko: "Invertir en Elliniko"
 GRE_invest_elliniko_desc: "Elliniko es una parte suburbana de Atenas que podría considerarse descuidada en comparación con los proyectos de revitalización que hemos lanzado en otros lugares. Esta área es especialmente importante, ya que es un centro turístico."
 GRE_unemployed: "Los desempleados"
 GRE_unemployed_desc: "Al gestionar cuidadosamente el desempleo, podemos asegurarnos de que aquellos que pierden empleos debido a la crisis de la deuda no se queden sin el dinero necesario para cubrir los estándares básicos de vida."
 GRE_glass_cannon_economics: "Economía de cañón de cristal"
 GRE_glass_cannon_economics_desc: "Nuestra economía y nuestros ciudadanos están viendo los beneficios de una economía saludable. A medida que gastan su dinero, ayudan a que nuestro país crezca.\n\nEs decir, siempre y cuando no le suceda nada §Rdesafortunado§! a la economía"
 GRE_strength: "Los Pilares de la Recuperación"
 GRE_strength_desc: "Para todo lo que la crisis de la deuda domina los titulares, Grecia está lejos de la quiebra de activos. La flota mercante más grande de la tierra, un sector farmacéutico segundo sólo para refinar entre nuestras exportaciones, el turismo para rivalizar con cualquiera en el Mediterráneo, y los productos encontrados en tablas de todo el mundo son fundaciones reales y duraderas. Apoyar estas industrias con políticas específicas, en lugar de la austeridad general dictada desde el extranjero, es cómo se construye una recuperación para durar."
 GRE_pharma: "El Powerhouse Genérico"
 GRE_pharma_desc: "Grecia golpea muy por encima de su peso en la medicina, sus fábricas sacando genéricos y medicamentos de marca para empresas como Vianex y Elpen que ocupa el segundo lugar sólo a las refinerías entre nuestras exportaciones. Debido a que esas píldoras y viales se venden en mercados de toda Europa y el Golfo, la industria gana dinero duro incluso cuando la economía tropieza en casa. Una inversión más profunda en las líneas de investigación y producción endurecería uno de nuestros pocos sectores verdaderamente de clase mundial."
 GRE_construction_mat: "Materiales de construcción"
 GRE_construction_mat_desc: "Mármol de Penteli, piedra caliza de las islas, agregado de Thrace. La reorientación de materiales de construcción nacionales desde los mercados de exportación a nuestros propios proyectos de infraestructura reduce los costos y mantiene el dinero en casa."
 GRE_austerity: "El gobierno ha manejado la crisis de austeridad."
 GRE_austerity_desc: "El déficit público es inevitable y, si no actuamos pronto, la economía entrará en un estado aún peor que el actual. §REsto provocará disturbios en todo el país§!, pero si contenemos el malestar, podremos recuperar el control sobre nuestra situación financiera."
 GRE_turn_century: "Cambio de siglo"
 GRE_turn_century_desc: "A medida que nuestro camino en este nuevo mundo llega a un nuevo milenio, muchas cosas son inciertas, la política y la economía en cuestión. Nos corresponde a nosotros guiar a nuestra nación en esta nueva era."
 GRE_golden_dawn: "Amanecer Dorado"
 GRE_golden_dawn_desc: "El partido de extrema derecha Amanecer Dorado es un partido político basado en los ideales del nacionalismo y tiene simpatías por los movimientos nacionalistas de toda Europa. Muchos han criticado a Amanecer Dorado por ser una organización neonazi y criminal, pero esas personas son mentirosas. Amanecer Dorado es el único camino para Grecia, y debemos asegurarnos de que consiga el liderazgo de la nación."
 GRE_subtle_propaganda_campaigns: "Campañas sutiles de propaganda"
 GRE_subtle_propaganda_campaigns_desc: "El pueblo debe conocer la verdad de lo que quiere conseguir Amanecer Dorado y cómo los demócratas destruyeron este país, sumiéndolo en el caos."
 GRE_open_youth_front: "Abrir el Frente Juvenil"
 GRE_open_youth_front_desc: "La Juventud del Amanecer Dorado da disciplina a los jóvenes griegos, educación nacionalista y un sentido de propósito que los partidos democráticos han abandonado. El apoyo juvenil es la base de cualquier movimiento duradero, y una generación elevada en nuestros valores no los cambiará."
 GRE_influence_police: "Influir en la policía"
 GRE_influence_police_desc: "Si conseguimos ganarnos el apoyo de la policía, obtendremos más apoyo de la opinión pública, además de manejar más fácilmente a los traidores políticos."
 GRE_committee_national_memory: "Comité de la Memoria Nacional"
 GRE_committee_national_memory_desc: "Debemos honrar a los grandes héroes nacionalistas que lucharon y murieron por nuestra nación, recordando a la gente sus principios, para que todos podamos unirnos bajo un mismo objetivo."
 GRE_form_golden_dawn_death_legions: "Formar Legiones de la Muerte de la Aurora Dorada"
 GRE_form_golden_dawn_death_legions_desc: "Las legiones de la muerte de Amanecer Dorado serán nuestra principal unidad paramilitar. Se encargarán de limpiar las calles de traidores, así como de imponer el orden y acudir en defensa del país contra los enemigos cuando sea necesario."
 GRE_glorify_regime_of_colonels: "Glorificar el régimen de los coroneles"
 GRE_glorify_regime_of_colonels_desc: "De 1967 a 1974, Grecia estuvo gobernada por la Junta Griega, más conocida como el \"Régimen de los Coroneles\". Bajo los Coroneles, Grecia experimentaba un rápido crecimiento económico, así como estabilidad interna y un enorme ejército que protegía el país. Por tanto, debemos recordar a la población los logros de los Coroneles."
 GRE_golden_greece: "Exigir elecciones inmediatas"
 GRE_golden_greece_desc: "Ha llegado el momento de liderar este país después de reunir el apoyo mayoritario de la población. Exigiremos elecciones al gobierno corrupto para demostrarle quién debe estar realmente al mando."
 GRE_fund_elam: "Amplia financiación para la ELAM"
 GRE_fund_elam_desc: "ELAM, o Frente Popular Nacional, es el partido hermano de Amanecer Dorado en Chipre. Si le proporcionamos más fondos de los que jamás ha soñado, al menos nos aseguraremos de ser populares entre los grecochipriotas."
 GRE_revive_megali_idea: "Revivir la Megali Idea"
 GRE_revive_megali_idea_desc: "La Megali Idea era el concepto de una gran nación griega formada por antiguos territorios griegos, como el norte del Epiro y las zonas costeras de Turquía. Es nuestro destino revivir la Megali Idea y hacer que nuestros antepasados se sientan orgullosos."
 GRE_censor_media: "Censurar los medios de comunicación"
 GRE_censor_media_desc: "Los medios de comunicación, antes de que tomáramos el poder, eran mentirosos y traidores al vender propaganda a favor de los demócratas. Ahora que estamos en el poder, sustituiremos las mentiras demócratas por nuestros propios medios, controlados por el Estado, que sólo publicarán la verdad."
 GRE_one_religion: "Una religión"
 GRE_one_religion_desc: "El cristianismo ortodoxo es nuestra religión de Estado y una parte importante de nuestro patrimonio. Debemos, por todos los medios, prestar más atención a nuestra religión."
 GRE_oppress_political_opposition: "Oprimir a la oposición política"
 GRE_oppress_political_opposition_desc: "Debemos erradicar a los traidores que vendieron nuestro país, así como a cualquiera que sea antigriego. El Amanecer Dorado limpiará Grecia de su quinta columna."
 GRE_army_first: "Políticas del Ejército Primero"
 GRE_army_first_desc: "Al adoptar políticas que prioricen nuestro ejército y su expansión, podemos asegurarnos de que, incluso sin el apoyo del griego promedio, aún mantendremos el control. Por supuesto, eso nunca sucederá."
 GRE_economic_control: "Control Económico"
 GRE_economic_control_desc: "Los gobiernos anteriores se encargaron de destruir la economía al aumentar la deuda de Grecia. Para evitar que esto vuelva a suceder, debemos aumentar nuestro control directo sobre la economía."
 GRE_anti_migrant_policies: "Políticas Antiinmigrantes"
 GRE_anti_migrant_policies_desc: "Los inmigrantes se llevan recursos que podrían ser mejor utilizados por un griego. No podemos permitir que continúen con esta degradación de la Madre Grecia."
 GRE_metaxism: "Metaxismo"
 GRE_metaxism_desc: "Tomamos una gran influencia del régimen de Metaxas, en particular las políticas que refrendó: el corporatismo, los beneficios para la clase obrera y la primacía de la nación griega. Lo único que debemos suprimir es el sentimiento antiimperialista Metaxas sostenido."
 GRE_depart_ecomomic_migrants: "Partida de Migrantes Económicos"
 GRE_depart_ecomomic_migrants_desc: "Ahora que hemos comenzado a promulgar leyes contra los migrantes, debemos comenzar a deportar a los migrantes económicos a sus países de origen."
 GRE_metaxas_policies: "Políticas Metaxistas"
 GRE_metaxas_policies_desc: "Ioannis Metaxas, quien llegó al poder como resultado del golpe del 4 de agosto de 1936, es una gran inspiración para Amanecer Dorado. Fue uno de los líderes más grandes que Grecia ha tenido, ya que llevó al pueblo griego a la gloria y resistió a las potencias del Eje en la Segunda Guerra Mundial. Deberíamos revisitar sus políticas para honrarlo."
 GRE_dissolve_plutocracy: "Disolver la Plutocracia"
 GRE_dissolve_plutocracy_desc: "Durante demasiado tiempo nuestra economía ha sido explotada por regímenes democráticos y extranjeros. Ahora es el momento de destruir este sistema de una vez por todas."
 GRE_increase_agricultural_production: "Aumentar la Producción Agrícola"
 GRE_increase_agricultural_production_desc: "La agricultura ha sido durante mucho tiempo el sector más grande y exitoso en Grecia. Debemos fortalecerlo aún más invirtiendo en el sector agrícola."
 GRE_exploit_and_export: "Explotar y Exportar"
 GRE_exploit_and_export_desc: "Nuestro país está lleno de recursos naturales sin explotar y debemos actuar rápidamente para extraerlos en beneficio del país."
 GRE_revise_national_debt: "Revisar la Deuda Nacional"
 GRE_revise_national_debt_desc: "Los demócratas han conseguido elevar la deuda griega a 300.000 millones de dólares, lo que está provocando problemas para la economía. Por tanto, es necesario negociar para poder librarnos de esta enorme deuda."
 GRE_nationalize_resources: "Nacionalizar los Recursos"
 GRE_nationalize_resources_desc: "Actualmente, muchas empresas extranjeras tienen recursos naturales en nuestro país. Esto es inaceptable. Confiscaremos todos los activos extranjeros dentro de Grecia."
 GRE_trade_agreements: "Acuerdos Comerciales"
 GRE_trade_agreements_desc: "El poder comercial de Grecia es muy bajo, ya que no somos lo suficientemente competitivos en el mundo moderno. Pondremos en marcha acuerdos comerciales para poder exportar nuestros productos a más países."
 GRE_nationalize_banks: "Nacionalizar los Bancos"
 GRE_nationalize_banks_desc: "Como parte de nuestro esquema de control económico, los bancos deben ser nacionalizados por el Estado, ya que poseen activos valiosos que podemos explotar."
 GRE_force_germany_to_pay_debt_taken_from_occupation: "Forzar el Pago de las Deudas de la Ocupación Alemana"
 GRE_force_germany_to_pay_debt_taken_from_occupation_desc: "La ocupación alemana de Grecia durante la Segunda Guerra Mundial fue muy brutal, ya que los alemanes destruyeron una gran parte de Grecia y nos deben 300 mil millones de dólares en reparaciones que nunca fueron pagadas. Hoy les recordaremos eso."
 GRE_russia: "Comercio con Rusia"
 GRE_russia_desc: "Rusia es un aliado histórico ya que ambos somos países cristianos ortodoxos, y nos ha ayudado muchas veces a lo largo de la historia, por lo que debemos aumentar las relaciones comerciales con los rusos."
 GRE_china: "Comercio con China"
 GRE_china_desc: "Aunque tengamos diferencias ideológicas, China apoya regímenes nacionalistas como el nuestro, es una potencia comercial mundial y debemos aumentar los lazos económicos con ellos."
 GRE_iran: "Comercio con Irán"
 GRE_iran_desc: "Aunque Irán puede que no tenga mucho en común con nuestra nación, compartimos muchos objetivos similares y debemos cultivar la cooperación entre nosotros."
 GRE_of_continents_seas: "Una Grecia de Dos Continentes y Cinco Mares"
 GRE_of_continents_seas_desc: "El Megali Idea imagina una Grecia que abarca dos continentes y cinco mares: el Egeo, el Ionian, el Mediterráneo, el Mar Negro y el Mar de Mármara. Nuestra armada debe ser reconstruida en una fuerza digna de esa ambición, capaz de proyectar el poder a través de cada agua que era una vez griega."
 GRE_resolve_naming_dispute: "Resolver la controversia de Naming"
 GRE_resolve_naming_dispute_desc: "La disputa de nombres de Macedonia es un asunto trivial, simplemente lo solucionamos anexando Macedonia del Norte."
 GRE_strike_albania: "Atacar a Albania"
 GRE_strike_albania_desc: "La minoría griega de Epirus del Norte ha soportado el dominio albanés desde 1913. Su lenguaje suprimido, sus iglesias cerradas, sus propiedades incautadas. Un siglo de quejas diplomáticas no ha logrado nada. Arreglamos el asunto nosotros mismos."
 GRE_strike_bulgaria: "Atacar a Bulgaria"
 GRE_strike_bulgaria_desc: "Los misioneros bizantinos desarrollaron la primera lengua literaria del pueblo eslavo, el alfabeto que se convertiría en búlgaro. Los pueblos eslavos de Thrace y Macedonia se integraron en la civilización helénica mucho antes de que existiera un estado búlgaro. Esta campaña es menos una guerra que un regreso a casa."
 GRE_greater_greece: "Grecia Mayor"
 GRE_greater_greece_desc: "Grecia ha sido el centro de muchas de las naciones más poderosas de la historia; deshonraríamos un legado tan importante si no lo continuamos."
 GRE_great_greece: "Gran Grecia"
 GRE_great_greece_desc: "No debemos seguir el camino belicista que ha llevado a la caída incluso de los mayores imperios de la historia."
 GRE_agriculture_focus: "Enfoque en la Agricultura"
 GRE_agriculture_focus_desc: "La agricultura es uno de los elementos más fuertes de la economía griega, ya que proporcionamos una gran cantidad de productos como el aceite de oliva. Debemos invertir más dinero en la agricultura para poder exportar completamente nuestros productos al resto del mundo."
 GRE_greater_state_control: "Mayor Control Económico Estatal"
 GRE_greater_state_control_desc: "El libre mercado ha fallado a Grecia. El capital huyó cuando era más necesario, los bancos privados retuvieron el crédito para proteger las devoluciones de accionistas, y los propietarios extranjeros extrajeron ganancias durante una emergencia nacional. El control directo del estado de las industrias estratégicas pone en marcha decisiones económicas donde pertenecen."
 GRE_kke: "KKE"
 GRE_kke_desc: "KKE (Partido Comunista de Grecia) es un partido de extrema izquierda basado en las ideas del marxismo-leninismo y se opone firmemente al imperialismo extranjero. Busca eliminar la desigualdad y garantizar los derechos de los trabajadores, y está comprometido a crear una verdadera sociedad socialista. ¡Todos debemos unirnos detrás de KKE para guiar a nuestra nación hacia adelante!"
 GRE_communist_education: "Educación Comunista"
 GRE_communist_education_desc: "Las mentes jóvenes son las más impresionables. Inculcar los valores básicos del comunismo en la generación más joven y enseñar a los estudiantes universitarios la gloria de la igualdad podría impulsar en gran medida nuestra causa."
 GRE_labour_focus_unions: "Contactar a los Sindicatos Laborales"
 GRE_labour_focus_unions_desc: "Los sindicatos laborales estarán muy contentos de tener un gobierno dispuesto no solo a cooperar, sino también a ceder a sus demandas. Nos aseguraremos de que su influencia no se extienda más allá de nuestro ascenso al poder para evitar conflictos de intereses."
 GRE_failures_capitalism: "Fallas del Capitalismo"
 GRE_failures_capitalism_desc: "El capitalismo ya no nos bendice con la riqueza infinita que prometía. ¡Es hora de tomar nuestro propio camino para asegurarnos de que una crisis así nunca vuelva a suceder! ¡El efecto de este enfoque se incrementa según la magnitud de la crisis de deuda!"
 GRE_working_class: "La Clase Trabajadora"
 GRE_working_class_desc: "La clase trabajadora, donde los sueños nacen y mueren. Podemos prometerles que serán tratados bien y se les dará el reconocimiento que merecen por ser el fundamento del nuevo estado comunista."
 GRE_communist_propaganda: "Máquina de Propaganda"
 GRE_communist_propaganda_desc: "Debido a nuestra influencia en expansión, podemos permitirnos desatar la máquina de propaganda en Grecia. Aunque el mantenimiento monetario es alto, esta propaganda no debe ser desestimada, será extremadamente efectiva para convertir a la población griega."
 GRE_prepare_government: "Preparar un Gobierno"
 GRE_prepare_government_desc: "Al establecer un gobierno dentro de nuestro partido político, aseguramos una transición efectiva que nos permite actuar sobre nuestros objetivos más rápido que nuestros rivales puedan reorganizarse. Esto será costoso, pero considerando nuestras probabilidades de ganar, es una apuesta bien colocada."
 GRE_damn_market: "Maldito Mercado Libre"
 GRE_damn_market_desc: "Estamos en posición de dar el golpe final a los capitalistas. Con el poder de la propaganda de nuestro lado, podemos asestar el golpe mortal a la economía de libre mercado y, en el proceso, usurpar el trono de exceso en el que los capitalistas se sientan."
 GRE_election_com: "Exigir Elecciones Inmediatas"
 GRE_election_com_desc: "¡Camaradas, el momento es ahora! ¡Toda nuestra preparación hacia un nuevo estado libre nos ha llevado a este momento! ¡Nos aseguraremos de que el gobierno del pueblo gobierne otros 1000 años!"
 GRE_com_democratic: "Comunismo Democrático"
 GRE_com_democratic_desc: "La forma más verdadera de comunismo es aquella que permite que el trabajador promedio elija a su líder en el gobierno. Negarles este derecho es una traición a la naturaleza comunista."
 GRE_com_authoritarian: "Comunismo Autoritario"
 GRE_com_authoritarian_desc: "La gente es demasiado fácilmente engañada por mentiras y promesas arbitrarias que no les afectarían aunque se cumplieran. Es simplemente demasiado arriesgado permitir que un público fácilmente manipulable decida el futuro de Grecia, es demasiado peligroso."
 GRE_handle_bankers: "Manejar a los Banqueros"
 GRE_handle_bankers_desc: "Los capitalistas no tienen lugar en un estado comunista. Debemos redistribuir su riqueza mal adquirida de inmediato."
 GRE_com_constitutionalism: "Constitucionalismo Comunista"
 GRE_com_constitutionalism_desc: "Redactaremos una nueva constitución para garantizar que nadie vuelva a interrumpir el derecho del pueblo a votar, entre otras cosas. Dicho esto, esto significará que el jefe de Estado tendrá menos poder."
 GRE_government_purge: "Purga Gubernamental"
 GRE_government_purge_desc: "Tomaremos el control total del gobierno y nos estableceremos como el único partido permitido para gobernar Grecia. Los fascistas acechan en todas partes y trabajan para colapsar la utopía que luchamos por crear."
 GRE_curtail_corruption: "Reducir la Corrupción"
 GRE_curtail_corruption_desc: "Nuestro ascenso al poder ha creado un vacío de poder que la gente está ansiosa por llenar. Debemos asegurarnos de que nuestro gobierno siga siendo puro y dedicado al pueblo."
 GRE_promote_local: "Promover los Negocios Locales"
 GRE_promote_local_desc: "Los estados comunistas modernos tristemente necesitan incorporar conceptos capitalistas en el Estado para garantizar su supervivencia. Los negocios locales son el pilar de la economía, y para lograr nuestros sueños, debemos reforzar ese pilar."
 GRE_investment_effort: "Inversiones en Infraestructura"
 GRE_investment_effort_desc: "Carreteras, ferrocarriles y líneas de poder son el esqueleto de una economía productiva. Los años de inversión han dejado regiones enteras aisladas de los mercados nacionales. Los gastos de infraestructura dirigidos por el Estado subsanan las lagunas que el sector privado nunca lo haría."
 GRE_subsidize_farmers: "Subvencionar a los Agricultores"
 GRE_subsidize_farmers_desc: "Los agricultores griegos han sido exprimidos durante años por las cuotas de importación de la UE, el aumento de la deuda y la competencia extranjera que no pueden coincidir con el precio. Las subvenciones directas para semillas, equipos y crédito rural les dan espacio para modernizar y mantener su tierra productiva."
 GRE_abandon_army: "Abandonar el Ejército"
 GRE_abandon_army_desc: "El ejército actualmente es una carga para el estado. Las posibilidades de que se utilice una fuerza así son bajas, por lo tanto, es lógico comenzar a reestructurar y reducir el tamaño del ejército según sea necesario."
 GRE_reorganize_army: "Reorganizar el Ejército"
 GRE_reorganize_army_desc: "El antiguo cuerpo de oficiales debe su rango al gobierno anterior. Necesitamos eliminar esas lealtades y reconstruir la estructura de mando alrededor de los hombres que responden al partido, no a una constitución muerta."
 GRE_silence_press: "Silenciar la Prensa"
 GRE_silence_press_desc: "Somos liberadores, no tiranos. Si los medios están demasiado lavados de cerebro para darse cuenta de esto, entonces debemos tomar las riendas nosotros mismos."
 GRE_extend_education: "Extender la Educación"
 GRE_extend_education_desc: "Nuestra gente merece lo mejor en educación para garantizar que tengamos una reserva de personas bien educadas para ocupar trabajos más avanzados."
 GRE_com_resources: "Explotación de Recursos Naturales"
 GRE_com_resources_desc: "Con la infraestructura existente, las empresas estatales pueden ahora extraer y procesar recursos naturales a escala. Las minas, canteras y depósitos energéticos que una vez generados ganancias para los accionistas privados ahora financiarán el bienestar público."
 GRE_farmer_tax: "Recortes de Impuestos para Agricultores"
 GRE_farmer_tax_desc: "Debemos otorgar exenciones fiscales a nuestros agricultores, no solo para animar a más personas a unirse a la profesión, sino también para asegurarnos de que obtengan mayores ganancias, lo que les permitirá expandir su crecimiento con métodos de producción más eficientes e incluso adquirir más tierras."
 GRE_new_army: "Un Nuevo Ejército"
 GRE_new_army_desc: "Hemos reformado nuestro ejército hasta el punto en que ha sido reemplazado por la fuerza policial en términos de seguridad interna. Sin embargo, ¿cómo podemos proyectar influencia sin una verdadera fuerza armada que respalde nuestras palabras? Incluso si no se llega a utilizar, deberíamos comenzar a construir un nuevo ejército que se ajuste a la nueva Grecia."
 GRE_red_army: "Un Ejército Rojo"
 GRE_red_army_desc: "Nos aseguraremos de que el espíritu comunista esté presente en lo más profundo de las filas del nuevo Ejército Rojo. Este fanatismo ideológico será a nuestro favor, ya que creará un ejército leal al estado y dispuesto a luchar hasta el final para preservar el socialismo en Grecia."
 GRE_pacify_unions: "Pacificar los Sindicatos"
 GRE_pacify_unions_desc: "Hemos empoderado a los sindicatos laborales hasta el punto en que están perturbando al estado en múltiples niveles por asuntos cada vez más triviales. Si bien nuestro partido está dedicado al pueblo, la gente necesita una economía que funcione para encontrar trabajo, por lo que debemos pedir a los sindicatos que desistan antes de tener que prohibirles interferir legalmente."
 GRE_purge_unions: "Eliminar los Sindicatos"
 GRE_purge_unions_desc: "Los sindicatos laborales han mostrado una falta de moderación o lealtad, nuestra cortesía solo se extiende hasta cierto punto."
 GRE_militarist_education: "Educación Militarista"
 GRE_militarist_education_desc: "Al introducir la educación militar en nuestro currículo, podemos asegurarnos de que la población en general esté preparada para el reclutamiento en caso de circunstancias extremas."
 GRE_balkan_diplomacy: "Diplomacia Balcánica"
 GRE_balkan_diplomacy_desc: "Es hora de realizar nuestras verdaderas ambiciones. Grecia ha prosperado bajo el comunismo y, aunque no seamos considerados eslavos, seguimos la religión ortodoxa y estamos ubicados en los Balcanes. Tal vez nuestra neutralidad cultural garantice la estabilidad de un estado como: \n\nUn estado Greco-Eslavo."
 GRE_balkan_hegemony: "Hegemonía Balcánica"
 GRE_balkan_hegemony_desc: "Los dos intentos anteriores de formar un estado así han fracasado. Sin embargo, siempre se intentó lograr la unificación mediante la diplomacia en lugar de la fuerza. Si ni siquiera tuviste la fuerza para conquistar los demás estados balcánicos, ¿por qué molestarse en mantenerlos unidos? No tenemos ninguna duda de que podemos mantener tal estado a través de la diplomacia interna; sin embargo, se trata simplemente de resolver el conflicto inevitable en primer lugar."
 GRE_constitution: "La Constitución"
 GRE_constitution_desc: "La Constitución es lo último con lo que tenemos que lidiar antes de consolidarnos en el poder y reconstruir Grecia según nuestra visión."
 GRE_european_communists: "Comunistas Europeos"
 GRE_european_communists_desc: "El comunismo ha dejado una marca en los Balcanes, desde el fin de la URSS y la caída del Bloque Comunista. Quizás con suficiente poder e intriga podamos reavivar la antorcha dejada por nuestros camaradas. Todo lo que necesitamos es una chispa para encender el fuego."
 GRE_bulgaria: "Llevar la Revolución a Bulgaria"
 GRE_bulgaria_desc: "Bulgaria, otrora una nación comunista próspera, perdió el rumbo tras el colapso de la URSS. Darle otra nación a la que admirar y seguir debería permitir que el comunismo volviera a afianzarse."
 GRE_albania: "Llevar la Revolución a Albania"
 GRE_albania_desc: "Albania es una nación que ha enfrentado muchas dificultades. Brindarles protección y asistencia para el desarrollo económico es suficiente para ganarse los corazones y mentes del pueblo albanés, al mismo tiempo que se respeta su soberanía en cierta medida."
 GRE_macedonia: "Llevar la Revolución a Macedonia"
 GRE_macedonia_desc: "Macedonia formó parte de Yugoslavia y disfrutó del mismo comunismo que Serbia; sin embargo, tras la desintegración de Yugoslavia y debido a \"conceptos erróneos\" culturales, abandonó el camino del comunismo. La eliminación de estos conceptos erróneos permitirá a la población volver a apoyar a un gobierno socialista."
 GRE_serbia: "Llevar la Revolución a Serbia"
 GRE_serbia_desc: "Serbia fue una vez el centro de Yugoslavia durante el gobierno comunista. Aunque los serbios han adoptado una ideología nacionalista, algunos aún albergan simpatías comunistas, y el país es un objetivo perfecto para expandir la revolución."
 GRE_romania: "Llevar la Revolución a Rumania"
 GRE_romania_desc: "Rumania es rica en recursos y poder militar. Extender la revolución a ellos seguramente mostraría al mundo que el comunismo se ha restablecido en los Balcanes."
 GRE_dictatorship: "Comienza la Dictadura"
 GRE_dictatorship_desc: "Con nuestros enemigos derrotados, finalmente podemos comenzar a gobernar la nación como siempre debería haber sido."
 GRE_cypriot_question: "La Cuestión Chipriota"
 GRE_cypriot_question_desc: "Las tensiones han llegado a un punto crítico, debemos actuar ahora. §REsto nos llevará a la guerra con Turquía y sus aliados§!; sin embargo, si logramos controlar Chipre en un plazo de 30 días y mantenemos la mayor parte de nuestro territorio central, tal vez podamos firmar un tratado de paz."
 GRE_turkish_trade: "Comercio con Turquía"
 GRE_turkish_trade_desc: "Una de las mejores formas de promover buenas relaciones entre dos naciones es cooperar económicamente entre sí. Al promover el comercio con Turquía, ambas naciones se beneficiarán sin ningún costo."
 GRE_settle_eez_dispute: "Resolver la Disputa de la ZEE"
 GRE_settle_eez_dispute_desc: "La disputa EEZ entre Grecia y Turquía se ha arrastrado sin ningún beneficio a ninguna de las dos partes. Si promovemos el libre comercio en ambas zonas y estamos de acuerdo en un marco equitativo de distribución de recursos, podemos establecer este conflicto para descansar y redirigir esa energía hacia la cooperación."
 GRE_increased_privatization: "Aumento de la Privatización"
 GRE_increased_privatization_desc: "Aumentar la privatización del sector industrial griego podría ser beneficioso para reforzar nuestra industria, así como para crear más oportunidades de empleo y fortalecer la economía griega en su conjunto."
 GRE_leadership: "Liderazgo Eterno"
 GRE_leadership_desc: "Nuestro líder Nikolaos Michaloliakos ha logrado unir al pueblo de Grecia y crear la sociedad griega perfecta. Nikolaos Michaloliakos y el partido Amanecer Dorado deben gobernar Grecia de por vida."
 GRE_new_greece_old_ways: "Nueva Grecia, Viejas Formas"
 GRE_new_greece_old_ways_desc: "Durante décadas hemos sido gobernados por gobiernos que han sumido a nuestro país en el caos. Ahora el pueblo griego demanda cambio, para que podamos regresar a los días que fuimos reconocidos en todo el mundo."
 GRE_draft_youth_wing: "Reclutar al Ala Juvenil"
 GRE_draft_youth_wing_desc: "Como hemos atraído más apoyo de los jóvenes, deberíamos organizarlos en paramilitares para que puedan defender el país contra los enemigos de la revolución."
 GRE_foreign_relations: "Relaciones Exteriores"
 GRE_foreign_relations_desc: "La nueva Grecia no puede estar aislada. Necesitamos socios para el comercio, la seguridad y la legitimidad en la etapa mundial. La cuestión no es si hay que comprometerse. Es con quién relacionarse y en qué términos."
 GRE_dev_cyp: "Desarrollar Chipre"
 GRE_the_hellenic_republic: "La República Helénica"
 GRE_the_hellenic_republic_desc: "A pesar de los problemas que enfrentamos, no debemos abandonar los ideales de la democracia y recurrir a la tiranía para solucionar nuestros problemas, ya que sería una traición a cada hombre y mujer en Grecia."
 GRE_discredit_eu: "Desacreditar a la Unión Europea"
 GRE_discredit_eu_desc: "Para salvaguardar nuestros ideales, debemos mostrar al pueblo los verdaderos valores de la democracia y denunciar el radicalismo como una amenaza a la libertad."
 GRE_support_eu: "Apoyar a la Unión Europea"
 GRE_support_eu_desc: "La Unión Europea promueve la cooperación entre naciones, los valores democráticos, denuncia el radicalismo y busca una Europa pacífica. Grecia debería aumentar los lazos con la Unión Europea."
 GRE_dominant_party_desc: "Como en toda nación democrática, los partidos desempeñan un gran papel en la política de nuestro país y tendremos que elegir sabiamente qué partido guiará a nuestra nación hacia adelante."
 GRE_dominant_party: "El Partido Dominante"
 GRE_new_democracy: "Nueva Democracia"
 GRE_new_democracy_desc: "El partido de centro-derecha 'Nueva Democracia', habiendo demostrado competencia en todos sus gobiernos y sus ideales de mantener nuestras tradiciones, es el partido más adecuado para liderar Grecia."
 GRE_socialist_coalition: "SYRIZA"
 GRE_socialist_coalition_desc: "Los principales partidos griegos han fallado al país y lo han sumido en una catástrofe económica, además de dividir nuestra sociedad. Grecia necesita un nuevo partido que guíe a su pueblo hacia adelante, y nos uniremos en torno al partido de izquierda SYRIZA, que está junto al pueblo y se opone a las políticas de nuestros gobiernos anteriores."
 GRE_economic_liberalism: "Liberalismo Económico"
 GRE_economic_liberalism_desc: "El liberalismo económico debe ser nuestra prioridad si queremos fortalecer la economía griega. Nos aporta un mayor comercio y mayores beneficios económicos para nuestros ciudadanos, como oportunidades de empleo."
 GRE_anti_migration_policies: "Políticas Antimigración"
 GRE_anti_migration_policies_desc: "En los últimos años, Grecia ha atraído a un gran número de migrantes. Si bien nuestro gobierno tolera a los migrantes que vienen a Grecia en busca de oportunidades económicas, nos preocupa la situación de los migrantes ilegales, ya que su número está aumentando gradualmente y necesitaremos imponer restricciones más estrictas."
 GRE_counter_radicals: "Contrarrestar a los Radicales"
 GRE_counter_radicals_desc: "Los partidos radicales en Grecia están ganando popularidad lentamente, y su principal agenda es destruir la ideología que nuestra nación creó: la democracia. Muchos consideran que estos partidos son organizaciones criminales debido a los ataques organizados específicos contra ciertos grupos. Si queremos mantener la democracia, deberemos contrarrestar la influencia de los partidos radicales."
 GRE_increase_corruption_measures: "Medidas Anticorrupción"
 GRE_increase_corruption_measures_desc: "Grecia tiene desde hace tiempo un problema de corrupción que se extiende a todos los sectores del gobierno y ha creado problemas para el Estado. Si queremos crear una mejor administración, tendremos que erradicar la corrupción en el gobierno."
 GRE_increase_industrial_privatization: "Aumentar las Privatizaciones"
 GRE_increase_industrial_privatization_desc: "El sistema público griego es uno de los sectores más grandes de Grecia. Esto ha creado un problema durante algún tiempo, ya que el sector privado griego es relativamente débil. Hay poca competencia en comparación con otros países. Si queremos que nuestra economía crezca, tendremos que alejarnos del sector público y adoptar el privado."
 GRE_reinforce_justice: "Reforzar el Sistema de Justicia"
 GRE_reinforce_justice_desc: "En muchas áreas de nuestro país, la delincuencia está muy extendida debido a la falta de una aplicación adecuada de la ley. Nuestro gobierno deberá reforzar el sistema de justicia para reducir la tasa de delincuencia en Grecia."
 GRE_begin_changing_education_system: "Reformas del Sistema Educativo"
 GRE_begin_changing_education_system_desc: "El sistema educativo griego está muy por detrás del de otros países europeos en cuanto a escuelas, financiación y oportunidades para los menos cualificados. Si queremos tener un sistema educativo moderno, tendremos que aplicar reformas radicales y crear un entorno mejor para nuestros niños."
 GRE_worker_rights: "Derechos de los Trabajadores"
 GRE_worker_rights_desc: "Como parte de nuestras políticas, aumentaremos los derechos de los trabajadores para reducir la desigualdad de todos los hombres y mujeres trabajadores en Grecia."
 GRE_question_eu_policies: "Cuestionar las Políticas de la Unión Europea"
 GRE_question_eu_policies_desc: "Si bien creemos que la Unión Europea es beneficiosa, muchas de sus políticas son inaceptables, como el aumento del control económico. Mientras existan estas políticas, la Unión Europea no nos brindará beneficios."
 GRE_left_united: "La Izquierda Unida"
 GRE_left_united_desc: "Nuestro partido está compuesto por muchas ramas de la izquierda y esto ha creado problemas en nuestro partido durante muchos años. Por lo tanto, debemos aumentar la unidad en nuestro partido, para que podamos unir verdaderamente a la izquierda como una sola."
 GRE_support_the_public_sector: "Apoyo al Sector Público"
 GRE_support_the_public_sector_desc: "El sector público es el más grande de Grecia y emplea a una enorme cantidad de personas. Reforzarlo y modernizarlo también podría generar más oportunidades de empleo y más apoyo para nuestro gobierno."
 GRE_remind_the_failures_of_pasok_and_new_democracy: "Los Fracasos de PASOK y Nueva Democracia"
 GRE_remind_the_failures_of_pasok_and_new_democracy_desc: "Debemos recordar al pueblo griego los fracasos de PASOK y Nueva Democracia, ya que lograron aumentar la desigualdad económica y social, aumentar la deuda externa a 300 mil millones de dólares, crear una crisis de deuda y aumentar los índices de corrupción. Deben aprender que el pueblo griego no ha olvidado sus desastres."
 GRE_encourage_agricultural_growth: "Fomentar el Crecimiento Agrícola"
 GRE_encourage_agricultural_growth_desc: "La agricultura es, con mucho, el sector más grande y fuerte de nuestra economía, y muchos de nuestros productos de exportación a otros países son productos agrícolas como el aceite de oliva. Aumentar la financiación en agricultura impulsará nuestra economía, así como aumentará las exportaciones a otros países."
 GRE_the_greek_crisis: "Solución a la Crisis de Deuda"
 GRE_the_greek_crisis_desc: "Nuestra economía, debido a la enorme cantidad de deuda, está al borde del colapso. Por lo tanto, se deben tomar medidas drásticas para salvar la economía griega."
 GRE_enact_austerity_measures: "Aplicar Medidas de Austeridad"
 GRE_enact_austerity_measures_desc: "Aplicar medidas de austeridad podría salvar nuestra economía del colapso, pero estas medidas no serán tomadas a la ligera por la población."
 GRE_reduce_education: "Reducción de Fondos para la Educación"
 GRE_reduce_education_desc: "Como parte de nuestro programa de austeridad, es necesario que reduzcamos la financiación del sistema educativo para ahorrar más fondos necesarios para la recuperación económica. Lamentablemente, esto reducirá la eficacia del sistema educativo griego, pero al final ayudará a nuestro país."
 GRE_reduce_health: "Recortes en el Sistema de Salud"
 GRE_reduce_health_desc: "La cantidad de dinero que se destina al sistema sanitario griego es excesiva para nuestra economía. Si reducimos los fondos que se destinan a la atención sanitaria, podríamos beneficiar a nuestra economía, pero con la consecuencia de que nuestros ciudadanos padecerán peores condiciones cuando sean hospitalizados."
 GRE_reduce_welfare: "Recortes en el Bienestar"
 GRE_reduce_welfare_desc: "Nuestro país ha invertido mucho en bienestar social y, si bien eso ha mejorado la calidad de vida de nuestros ciudadanos, también ha reducido fondos muy necesarios para reforzar nuestra economía. Para salvar la economía, debemos poner fin al estado de bienestar por el que se caracterizó nuestro país."
 GRE_reduce_army: "Reducir el gasto militar"
 GRE_reduce_army_desc: "En los últimos años, la necesidad de aumentar la financiación militar ha perdido fuerza, ya que nuestro país no irá a la guerra en un futuro próximo. Por lo tanto, sería prudente retirar una parte de la financiación del ejército para reforzar sectores más importantes de nuestra economía."
 GRE_recovery: "Recuperación económica"
 GRE_recovery_desc: "Después de tomar decisiones difíciles y medidas de austeridad severas, nuestro país ha logrado detener el declive económico y reducir la enorme deuda. Esperemos que nuestro país vuelva a ser grandioso, como lo fue en la época de los imperios."
 greece.1.t: "Indignación en medio de nuevas políticas de austeridad"
 greece.1.d: "Hoy, el gobierno griego implementó nuevas medidas de austeridad para cumplir con el rescate de deuda de la UE. Lo que siguió fue la indignación del público, llevando pancartas que decían 'La austeridad es anti-griega'. Estos disturbios solo están empeorando la situación de Grecia y se puede suponer que esto es solo la punta del iceberg."
 greece.1.a: "Tengo un mal presentimiento sobre esto."
 greece.2.t: "Disturbios en las calles"
 greece.2.d: "Hoy, las protestas en Atenas se volvieron violentas después de que la policía intentara contener a la multitud cada vez mayor. Se usó gas lacrimógeno y balas de goma para tratar de detener a la multitud y evitar más destrucción, y aunque la multitud finalmente se retiró, la tensión todavía se siente en el aire."
 greece.2.a: "¡Ellos empezaron!"
 greece.3.t: "Las tensiones empeoran"
 greece.3.d: "Las multitudes han crecido más grandes y muestran cada vez más descontento. No cabe duda de que la situación solo ha empeorado."
 greece.3.a: "¿Cómo pudo pasar esto?"
 greece.4.t: "Amanecer Dorado exige elecciones en Grecia"
 greece.4.d: "Tras haber ganado apoyos, el partido político de extrema derecha Amanecer Dorado ha exigido al gobierno que convoque elecciones, una exigencia a la que el gobierno de Grecia ha accedido gracias al gran apoyo de la población y a la presión interna del gobierno. Se espera que el partido Amanecer Dorado gane, ya que cuenta con un gran apoyo y ha amenazado con que, si el gobierno no permite su victoria, el partido, junto con sus partidarios, tomará represalias contra el gobierno."
 greece.4.a: "Un nuevo amanecer para Grecia"
 greece.4.b: "Interesante"
 greece.5.t: "KKE exige elecciones en Grecia"
 greece.5.d: "Tras obtener el apoyo mayoritario de la clase obrera griega y de varias figuras políticas, el KKE (Partido Comunista de Grecia) ha llamado al gobierno a celebrar elecciones, a lo que el gobierno griego ha accedido considerando que el KKE ha obtenido un apoyo masivo y que el gobierno está bajo presión de múltiples políticos para que celebre elecciones. Se espera que el partido KKE gane las elecciones, ya que cuenta con el apoyo mayoritario de la mayoría de la población y un portavoz del partido ha declarado que si no se les permite celebrar elecciones, la clase obrera lanzará un levantamiento para derrocar al gobierno."
 greece.5.a: "¡Trabajadores de Grecia, levantaos!"
 greece.5.b: "Interesante"
 greece.6.t: "Grecia se inclina hacia la derecha"
 greece.6.d: "Tras las tensiones políticas, la crisis migratoria y económica, los griegos se cansaron de los gobiernos democráticos y apoyaron al partido de extrema derecha Amanecer Dorado. El partido Amanecer Dorado se opone a las políticas económicas del gobierno, es un partido fuertemente antiizquierdista y antiinmigratorio y ha prometido al pueblo griego que erradicará todos los problemas que tiene la sociedad griega."
 greece.6.a: "Grecia resurgirá"
 greece.6.b: "Interesante"
 greece.7.t: "Grecia se inclina hacia la izquierda"
 greece.7.d: "Tras las duras políticas económicas adoptadas por el reciente gobierno griego, el desempleo ha aumentado y la clase obrera griega exige acciones contra el gobierno griego. La clase obrera se ha unido al partido de extrema izquierda KKE (Partido Comunista de Grecia). El KKE está en contra del desempleo y de las violaciones de los derechos de los trabajadores, al tiempo que apoya políticas antioccidentales y organiza constantes disturbios de los trabajadores para presionar al gobierno griego."
 greece.7.a: "Trabajadores de Grecia, su liberación está cerca"
 greece.7.b: "Interesante"
 greece.12.t: "Alexis Tsipras se convierte en líder de SYRIZA"
 greece.12.d: "El 10 de agosto de 2008, el partido de izquierda SYRIZA eligió al joven de 33 años, Alexis Tsipras, como líder del partido, convirtiéndolo en uno de los líderes políticos más jóvenes en la historia de Grecia."
 greece.12.a: "Felicidades"
 greece.13.t: "Disturbios en Chipre del Norte"
 greece.13.d: "Los disturbios armados han roto en Chipre septentrional contra la agenda griega de empujar hacia un Chipre unificado. Los motines fueron obviamente escenificados por las autoridades turcas; sin embargo, su animosidad definitivamente ha revertido cómo somos percibidos."
 greece.13.a: "¡Horror!"
 greece.14.t: "Sindicatos ofrecen su apoyo"
 greece.14.d: "Nuestro reciente ataque a la constitución nos ha dado una considerable oposición política. Los sindicatos han ofrecido su apoyo a cambio de más poder. ¿Realmente tenemos alguna opción?"
 greece.14.a: "No tenemos otra opción."
 greece.15.t: "Sindicatos exigen más concesiones"
 greece.15.d: "Los sindicatos nos visitan nuevamente; sin embargo, esta vez no es su apoyo lo que ofrecen, es su apoyo lo que amenazan con retirar si no cedemos aún más poder a ellos."
 greece.15.a: "¡Bastardos!"
 greece.16.t: "Un cimiento agrietado"
 greece.16.d: "Cada vez es más difícil dormir por las noches, mientras el país se desmorona. Las ciudades más septentrionales están experimentando ataques organizados que han resultado en cientos de víctimas en ambos lados. No podremos contenerlos mucho tiempo con este grado de fuerza.\n\n §REs inútil tratar de contenerlos en el norte. Deberíamos concentrar nuestras tropas para defender Atenas y las áreas circundantes. ¡Nos vemos en la línea del frente!§!"
 greece.16.a: "Quiero a los generales aquí, ¡ahora mismo!"
 greece.17.t: "Se acabó el tiempo"
 greece.17.d: "Nuestras predicciones no estaban equivocadas: los rebeldes del norte se han organizado en un ejército; sin embargo, no parecen tan agresivos como pensábamos originalmente... Espera, tengo que atender esto... Sí. Sí. ¿Estás seguro?\n\n...Maldición."
 greece.17.a: "'Parece que hay varios intentos a través de nuestras líneas para romperlas.'"
 greece.18.t: "Grecia subasta el Pireo"
 greece.18.d: "El gobierno griego ha subastado recientemente el puerto del Pireo en un intento de obtener fondos para la crisis de la deuda. Sería una iniciativa más que valiosa añadir el Pireo a nuestra colección, y también abriría la puerta a futuros proyectos dentro de Grecia y Europa, expandiendo nuestra influencia en la región."
 greece.18.a: "Haz la oferta más alta."
 greece.18.b: "Nuestro desinterés en tal proyecto no se puede expresar con palabras."
 greece.19.t: "China hace una oferta por el Pireo"
 greece.19.d: "Los chinos han mostrado interés en el puerto del Pireo y posteriormente han hecho una oferta considerable de dinero por los derechos exclusivos del puerto, ganando la subasta. Lo que China decida hacer con el puerto en el futuro es cosa suya; sin embargo, también tenemos la capacidad de evitar que China amplíe el puerto o inicie cualquier otro proyecto si lo consideramos peligroso."
 greece.19.a: "Un trato con el Diablo."
 greece.20.t: "China muestra desinterés por el Pireo"
 greece.20.d: "A pesar de nuestros mejores esfuerzos, el gobierno chino ha rechazado nuestra propuesta sin pensarlo dos veces."
 greece.20.a: "Para bien o para mal, no puedo decirlo."
 greece.22.t: "Tensiones de austeridad se disipan"
 greece.22.d: "Es generalmente un día 'tranquilo' para Grecia, ya que las manifestaciones contra la austeridad parecen haber cesado por el momento. Tal vez sea simplemente el agotamiento de las protestas constantes, tal vez sea algo más."
 greece.22.a: "Gracias a Dios."
 greece.23.t: "¡Enosis por fin!"
 greece.23.d: "Después de décadas de disturbios, separación y ansiedad sobre los lazos familiares y las conexiones siendo separadas entre sí, las conferencias Enosis han pagado.\n\nLos grecochipriotas celebran en las calles, los turcochipriotas han sido suficientemente apaciguados y los británicos parecen estar algo contentos con los arreglos que hemos decidido.\n\nTodavía hay una pregunta persistente: ¿qué hacer con Akrotiri y Dhekelia?"
 greece.23.a: "Solicitar el control total"
 greece.23.b: "Permitir que la RAF mantenga las bases"
 greece.24.t: "¡El Gobierno griego quiere recuperar Akrotiri!"
 greece.24.d: "Habiendo alcanzado sus objetivos de Enosis, el gobierno griego ha venido a nosotros sombrero en mano para pedir que devolvamos las bases de Akrotiri y Dhekelia. ¿Debemos dejar que regresen a la regla griega?"
 greece.24.a: "¡Sería incorrecto no hacerlo!"
 greece.24.b: "¡Ni hablar!"
 greece.25.t: "¡El Gobierno griego nos permite quedarnos en Chipre!"
 greece.25.d: "Habiendo logrado sus objetivos de Enosis, el gobierno griego ha llegado a la conclusión de que el regreso de Akrotiri y Dhekelia sería inconveniente para todos; afortunadamente no tendremos que trasladar nuestras tropas de estas tierras."
 greece.25.a: "¡Muy bien entonces!"
 GRE_tax_relief_for_businessman: "Alivio fiscal para empresarios"
 GRE_tax_relief_for_businessman_desc: "Debemos ayudar financieramente a las empresas que se vieron obligadas a valerse por sí mismas en medio de las políticas de nuestras administraciones anteriores, y por eso reduciremos sus impuestos."
 istanbul_renamed: "Estambul renombrada"
 GRE_9833_name: "Constantinopla"
 GRE_constantinople_not_istanbul: "Constantinopla, no Estambul"
 GRE_constantinople_not_istanbul_desc: "Durante cinco siglos Constantinopla ha sido conocido por otro nombre. La ciudad de Constantino y Justiniano, de Hagia Sophia y los Muros Teodosios, renombrada y reescrita por un conquistador. Con la ciudad en manos griegas, restauramos lo que la historia nos robó."
 GRE_gain_10_strength: "Los §Hgrecochipriotas§! §GGANARÁN§! §H¡10 fuerza!§!"
 GRE_lose_10_gain_10: "Los §Hturcochipriotas§! se §RPERDER§! §H¡10 fuerza!§!"
 GRE_austerity_idea: "Tensiones por la austeridad"
 GRE_austerity_idea_desc: "El programa de austeridad ha empujado la paciencia pública más allá de su límite. Las protestas se extienden de Atenas a Salónica, las huelgas están cerrando puertos y hospitales, y la temperatura política está aumentando. Cada nuevo corte añade combustible. Si la tensión no se maneja, el malestar a gran escala es una posibilidad real."
 GRE_please_south_desc: "Si continuamos complaciendo a los grecochipriotas, podremos garantizar que tendrán más probabilidades de apoyarnos en nuestra búsqueda de la unificación de Chipre y, en última instancia, el objetivo de la Enosis."
 GRE_please_north_desc: "Reafirmando que los turcochipriotas no son griegos ni chipriotas. Son colonizadores e invasores que deben ser expulsados ​​de Chipre."
 TUR_CYP_incite_riot_desc: "Es hora de que empecemos a incitar disturbios en el sur de Chipre para garantizar que los griegos no puedan ganar influencia política en la región."
 TUR_CYP_propaganda_north_desc: "Reforzar y difundir la propaganda entre los chipriotas del norte para garantizar que no se dejen influenciar por los griegos es fundamental para nuestro éxito en la región."
 TUR_CYP_propaganda_south_desc: "Reforzar y difundir la propaganda entre los chipriotas del sur para garantizar que no se dejen influenciar por los griegos es fundamental para nuestro éxito en la región."
 TUR_attack_CYP_strength_desc: "Al atacar la fortaleza grecochipriota, podemos garantizar que no puedan ganar influencia política en la región."
 GRE_attack_turkish_strength_desc: "Al atacar la fuerza turcochipriota, podemos garantizar que no puedan ganar influencia política en la región."
 GRE_nato_pressure_turkey_accept_tt: "Aliados que respaldan Grecia alivian la tensión egea y construyen el impulso en Chipre, aumentando la probabilidad de que Turquía retroceda dentro de un mes."
 GRE_nato_pressure_turkey_reject_tt: "Los aliados que declinan no añaden peso diplomático, dejando a Turquía menos propenso a conceder."
 GRE_hellenic_economy: "La economía helénica"
 GRE_hellenic_economy_desc: "La economía griega está en una posición difícil. El aumento de la deuda, el desempleo y la cuestión de la entrada en la zona euro son preocupaciones urgentes. Sin embargo, tenemos una fuerte flota mercante, una posición estratégica y el turismo que trae a millones de visitantes cada año. Deberíamos aprovechar al máximo lo que tenemos."
 GRE_debt_mounts: "Los Montes de la Deuda"
 GRE_debt_mounts_desc: "Nuestra deuda ha aumentado a casi 300 mil millones de dólares, uno de los más altos per cápita del mundo. Los pagos de intereses consumen una gran parte de nuestro presupuesto, dejando poco espacio para la inversión. Los banqueros extranjeros se están volviendo inquietos y la UE quiere respuestas. Tenemos que actuar antes de que esto empeore."
 GRE_debt_mounts_req_tt: "Nuestra §YRelación de la deuda unificada§! es más alto que §Y90%§! (Current) §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_brics_membership_req_tt: "La puntuación de alineación oriental es superior a 7"
 GRE_pillar_of_the_west_req_tt: "El compromiso occidental es superior a 3"
 GRE_aegean_assertiveness_event_tt: "§YEn 90 días, Turquía responderá a nuestras patrullas en el Egeo.§!"
 GRE_cyprus_gas_crisis_event_tt: "§RCon tensiones ya altas, la perforación provocará una reacción naval turca en días.§!"
 GRE_greek_bonds: "Volver a los mercados de bonos"
 GRE_greek_bonds_desc: "Atenas ha sido precio de préstamos a largo plazo desde la crisis, dejando que el Tesoro dependa de las facturas y los desembolsos de acreedores. Una cuestión de diez años de referencia, comercializada por la Agencia de Gestión de la Deuda Pública a fondos europeos y estadounidenses, probaría si los inversores están listos para prestar nuevamente a Grecia en términos normales."
 GRE_solve_evasion: "Resolver la evasión fiscal"
 GRE_solve_evasion_desc: "Cada año se pierden millones de ingresos para evasión fiscal. Si reforzamos nuestra recaudación de impuestos, invertimos en una mejor tecnología y agrietamos cuentas offshore, podemos cerrar las lagunas y recuperar nuestro presupuesto."
 GRE_convert_to_euro: "Convertir en Euro"
 GRE_convert_to_euro_desc: "El Euro es una oportunidad y un riesgo. Adoptarla vincula nuestra economía con la de Europa, lo que significa más estabilidad que el drachma alguna vez, pero perdemos el control de nuestra propia política monetaria. Depende de nosotros si la compensación vale la pena."
 GRE_skouries_mines: "Minas Skouries"
 GRE_skouries_mines_desc: "El depósito de oro de cobre Skouries en Halkidiki es uno de los más grandes de Europa. Las corporaciones extranjeras quieren los derechos de extracción y son empleos prometedores y riqueza. Los ambientalistas están en contra. Tendremos que decidir qué importa más."
 GRE_local_manufacturing: "Hecho en Grecia"
 GRE_local_manufacturing_desc: "La fabricación griega se ha reducido a un puñado de sectores: procesamiento de alimentos, cemento, aluminio, productos farmacéuticos y construcción naval en la costa de Perama. Una norma de preferencias internas en la contratación pública, junto con incentivos a la inversión en virtud de la Ley de desarrollo, daría a las plantas sobrevivientes los libros de orden que necesitan para revivir."
 GRE_military_industrial: "La industria de armas helénicas"
 GRE_military_industrial_desc: "Elliniki Viomichania Oplon y su hermana firma Pyrkal han armado soldados griegos desde la Guerra Fría, pero décadas de propiedad estatal los han dejado entristecido con deuda y líneas de producción ociosas. Las subvenciones sostenidas y orientadas pueden mantener los hornos funcionando, asegurar un suministro interno de municiones y armas pequeñas, y doblar a ambos en un solo fabricante competitivo en lugar de un drenaje perenne en el tesoro."
 GRE_agriculture_sector: "Columna vertebral de la campiña"
 GRE_agriculture_sector_desc: "Casi una quinta parte de los griegos todavía sacan su vida de la tierra, desde los olivares del Peloponés hasta los campos de algodón de Tesalonica. Sin embargo, el sector está envejeciendo, se mete en pequeñas parcelas y depende de Bruselas por sus subvenciones bajo la Política Agrícola Común. Apoyar a nuestros agricultores mientras empujaba el riego, las cooperativas y la maquinaria moderna mantendría las aceitunas Kalamata, feta y Assyrtiko fluyendo a las mesas del mundo."
 GRE_power_corporations: "La Corporación de Poder Público"
 GRE_power_corporations_desc: "Durante medio siglo, la Corporación Estatal del Poder Público, DEI, ha mantenido las luces encendidas al cavar lignito de los fosos de Ptolemaida y Megalopolis. Ese carbón es barato pero sucio, y nuestra dependencia del petróleo y el gas importados nos deja expuestos a cada choque en Oriente Medio. Modernizar la red, ampliar la red de gas de DEPA y construir nuevas plantas convertiría estas utilidades en la columna vertebral estratégica de la nación."
 GRE_austerity_measures: "Medidas de austeridad"
 GRE_austerity_measures_desc: "Los acreedores exigen pensiones reducidas, impuestos más altos y prestaciones eliminadas. Sin austeridad nos enfrentamos a la quiebra, pero con ella nos enfrentamos a la ira pública. Las protestas y huelgas son inevitables. Aquí no hay opciones fáciles."
 GRE_debt_refactoring: "Reestructuración de la deuda estratégica"
 GRE_debt_refactoring_desc: "Las subastas de bonos nos compraron tiempo, pero eso no es suficiente. Los acreedores están impacientes y los pagos de intereses están drenando el tesoro. Necesitamos reestructurar nuestra deuda: renegociar términos, extender las madurezs y mostrar a nuestros socios que darnos espacio para respirar significa que realmente podemos pagarles."
 GRE_ilarionas_hydro: "Ilarionas Hydroelectric"
 GRE_ilarionas_hydro_desc: "El río Ilarionas en el norte de Grecia tiene un enorme potencial hidroeléctrico. La energía hidroeléctrica es limpia, renovable y funciona bajo demanda a diferencia de solar o viento. Este proyecto podría alimentar a cientos de miles de hogares."
 GRE_telecomms: "Inversiones OTE"
 GRE_telecomms_desc: "Millones de griegos en pueblos insulares y ciudades montañosas todavía carecen de acceso confiable a Internet y teléfono. La inversión estatal en OTE podría conectar estas áreas al resto del país, dando acceso a los agricultores a mercados y estudiantes a las universidades."
 GRE_new_railways: "Revitalización de la Línea Rail de Atenas-Tesalónica"
 GRE_new_railways_desc: "El corredor de Atenas-Tesalónica es la columna vertebral de Grecia continental, pero la línea ferroviaria es dolorosamente lenta. El balance moderno y la trayectoria actualizada podrían reducir los tiempos de viaje a la mitad y dar un impulso real a la economía provincial."
 GRE_highway_initiatives: "Extender las autopistas AX"
 GRE_highway_initiatives_desc: "Las montañas que una vez dividieron las antiguas ciudades-estados todavía aíslan comunidades y perjudican el comercio hoy. La red de carreteras AX propuesta cortaría a través de la gama Pindus y conectaría la costa occidental a Thessaly. Será caro, pero los beneficios económicos podrían valer la pena."
 GRE_hellas_gold: "Profundizar las minas Kassandra"
 GRE_hellas_gold_desc: "El distrito minero de Kassandra tiene importantes reservas de cromo que aún no han sido explotadas por completo. La profundización de las operaciones existentes y la inversión en equipo de extracción traería esta riqueza al mercado y reduciría nuestra dependencia de importación."
 GRE_euboea_bauxite_deposits: "Depósitos de Euboea Bauxite"
 GRE_euboea_bauxite_deposits_desc: "Euboea tiene importantes depósitos de bauxita, que es el mineral primario para el aluminio. La extracción a gran escala podría abastecer nuestra base industrial y reducir las importaciones caras."
 GRE_industrial_lignite_mining: "La cuenca de Ptolemaida"
 GRE_industrial_lignite_mining_desc: "Los campos de lignito de radio abierto alrededor de Ptolemaida y Amyntaio en Macedonia Occidental han impulsado la Corporación del Poder Público durante medio siglo. Ampliar la excavación y añadir una planta de licuefacción convertiría la cuenca en una fuente nacional de combustible en lugar de un distrito de carbón envejecido."
 GRE_rare_element_prospecting: "Encuesta del subsuelo helénico"
 GRE_rare_element_prospecting_desc: "Las porfirias de cobre dorado de Halkidiki, el cinturón de bauxita de Parnassos y Peloponnese, y los nickel laterites de Euboea son sólo los depósitos mapeados. Una encuesta geológica nacional de IGME, respaldada por licencias de exploración, identificaría la próxima generación de sitios de extracción."
 GRE_transport_sector: "Carreteras, ferrocarriles y ferries"
 GRE_transport_sector_desc: "Un país de islas y montañas vive o muere por su transporte. Los entrenadores de KTEL recorren los pases, los ferries azul y blanco cosen el Egeo juntos, y los autobuses y carros de la OEAA llevan Atenas a trabajar cada mañana. Renovar flotas envejecidas, extender rutas a los suburbios y tejer carretera, ferrocarril y mar en una sola red de entradas permitiría que las mercancías llegaran al mercado y los trabajadores alcanzaran sus puestos de trabajo."
 GRE_vintage_wines: "Los Vintages de Grecia"
 GRE_vintage_wines_desc: "Los griegos estaban presionando uvas antes de que Roma fuera fundada, sin embargo el mundo todavía conoce nuestro vino sólo como retsina barata en una carafe taverna. Es un desamparo para el volcánico Assyrtiko de Santorini, el valiente Xinomavro de Naoussa, y el rubí Agiorgitiko de Nemea. Invertir en el embotellamiento de propiedades, etiquetas de origen protegido y el turismo de vino podría finalmente establecer las añadas griegas junto a los grandes nombres de Francia e Italia."
 GRE_tobacco_plantations: "Oriental Tobacco"
 GRE_tobacco_plantations_desc: "La hoja de Basma de Macedonia y Thrace, que corría el sol, ha perfumado las mejores mezclas del mundo durante generaciones, y casas como Papastratos en Pireo construyeron fortunas sobre ella. El tabaco occidental puede estar en retiro, pero la demanda permanece a través de los Balcanes y el Medio Oriente, y miles de pequeños agricultores alrededor de Kavala y Xanthi todavía dependen de la cosecha. Debemos apoyar a los productores al mismo tiempo que aliviar a aquellos que pueden hacia nuevos cultivos."
 GRE_gas_oil_plants: "Las refinerías de Attica"
 GRE_gas_oil_plants_desc: "Las refinerías sonando el Golfo Sarónico, Petróleo Helénico en Aspropyrgos y Elefsina y Motor Oil Hellas en Agioi Theodoroi, procesan el crudo que mantiene a Grecia y la mitad de los Balcanes corriendo. Pero las unidades más antiguas están cansadas y sus márgenes están disminuyendo. Nueva capacidad de grieta, desulfurización más limpia y almacenamiento ampliado aseguraría nuestro lugar como el centro de refinación del Mediterráneo sudoriental."
 GRE_trim_the_fat: "Trim el Gordo"
 GRE_trim_the_fat_desc: "El gobierno se ha hinchado e ineficiente. Los ministerios están sobrecargados, los contratos van a amigos y familiares, y la cinta roja está ahogando todo. Necesitamos reducir los residuos, automatizar donde podamos y exigir responsabilidades a las personas."
 GRE_debt_swaps: "De la deuda"
 GRE_debt_swaps_desc: "Cambiar nuestra deuda en bonos denominados moneda extranjera podría reducir nuestra exposición a la volatilidad. Requiere buenos socios bancarios y algunos ingenieros financieros, pero es una manera de gestionar la deuda sin tanta caída política."
 GRE_debt_swap_initial_tt: "§G50 mil millones§! de deuda nacional serán transferidos al socio elegido a un tipo de interés §G3%§!."
 GRE_debt_swap_accepted_opinion: "Cierre de deuda aceptada"
 GRE_debt_swap_rejected_opinion: "Cierre de la deuda rechazada"
 GRE_olympic_airways: "Olympic Airways"
 GRE_olympic_airways_desc: "Fundada por Aristóteles Onassis, Olympic Airways fue una vez el orgullo de la aviación griega. La aerolínea ha luchado en los últimos años pero el nombre todavía tiene peso. Revitalizar el porteador podría traer a los turistas y mantenerlos regresando."
 GRE_trainose: "TrainOSE"
 GRE_trainose_desc: "El sistema ferroviario griego, una vez descuidado, ha visto nueva vida. TrainOSE opera servicios de pasajeros y fletes que conectan Atenas con Thessaloniki, el Peloponnese al continente. Al ampliar las rutas, mejorar los horarios e invertir en el material rodante, podemos hacer que el ferrocarril sea una alternativa genuina."
 GRE_cotton_plantations: "Cotton Plantations"
 GRE_cotton_plantations_desc: "El algodón griego de Thessaly y Macedonia es uno de los mejores del mundo. Las fibras fuertes y la excelente calidad lo hacen genial para los textiles. Apoyar a nuestros agricultores de algodón e invertir en la fabricación podría traer esta industria de vuelta a donde debería estar."
 GRE_fisheries_expansion: "Riquezas del Egeo"
 GRE_fisheries_expansion_desc: "Grecia aterriza más bream de mar cultivado y bajo del mar que cualquier nación en Europa, sus jaulas a lo largo de los golfos protegidos del Ionian y el Egeo. Pero las poblaciones silvestres están colapsando bajo la sobrepesca, la contaminación y los arrastreros que atraviesan la frontera marítima. Ampliar la acuicultura, renovar la flota costera y hacer cumplir cuotas honestas mantendría vivas tanto a los pescadores como a los peces."
 GRE_aegean_wind_banks: "Arriendo el Meltemi"
 GRE_aegean_wind_banks_desc: "Cada verano los Meltemi rugen a través de los Cyclades, uno de los vientos más confiables en toda Europa. Las turbinas que se arrastran a través de las islas y las crestas del continente podrían verter energía limpia en la cuadrícula y romper nuestra dependencia del petróleo y el carbón importados. El mayor premio es el interconexor que por fin atará los generadores diesel de las islas a la red nacional."
 GRE_resolution_crisis: "Resolución Crisis"
 GRE_resolution_crisis_desc: "Hemos estado manejando la crisis durante demasiado tiempo en lugar de resolverla. Es hora de un plan adecuado que se ocupe de la deuda, el crecimiento, la banca y la reforma a la vez. No será fácil, pero es la única manera de avanzar. Completar este enfoque cierra la crisis de la deuda para el bien, por lo que primero debemos llevar nuestra deuda bajo control: interés inferior al 8% y deuda a PIB inferior al 50%."
 GRE_urban_railways: "Ampliación del Metro de Atenas"
 GRE_urban_railways_desc: "El Metro de Atenas transformó la capital por delante de los Juegos del 2004, pero distritos enteros todavía se encuentran más allá de su alcance, Thessaloniki ha esperado décadas para una línea propia, y el tren suburbano Proastiakos apenas rasca su potencial. Conducir nuevos túneles, extender el tranvía a la costa, y juntar las ciudades aliviaría el tráfico de ahogamiento, limpiaría el humo y levantaría la vida diaria de millones."
 GRE_ionian_solar: "Solar iónico"
 GRE_ionian_solar_desc: "Las islas de Ionian tienen mucho sol. Instalar granjas solares en Corfu, Lefkada y Zakinthos nos permitirían aprovechar eso y reducir nuestra dependencia de los combustibles fósiles importados."
 GRE_tourism_boom: "Vive tu Mito en Grecia"
 GRE_tourism_boom_desc: "De las playas de Creta a la caldera de Santorini y los carriles blanqueados de Mykonos, Grecia atrae decenas de millones de visitantes cada año, y el turismo ya gana cerca de una quinta parte de todo lo que produce la economía. Un impulso coordinado de la Organización Nacional del Turismo sobre marketing, capacidad aeroportuaria y conectividad insular podría convertir esa inundación estacional en un verdadero pilar de riqueza nacional."
 GRE_tourism_boom_event_TT: "§YUna temporada récord impulsa un debate sobre dónde debe ir el dinero.§!"
 GRE_mass_tourism: "Ofertas de Sol, Arena y Paquete"
 GRE_mass_tourism_desc: "Llenar los vuelos charter fuera de Manchester y Dusseldorf, bordear las costas con resorts todo incluido, y dejar que la multitud entre en un millón. El turismo volumétrico inunda el tesoro y mantiene un salario de verano al alcance de cada isleño, pero drena los acuíferos de Mykonos, entierra los acantilados de Santorini bajo pasajeros de cruceros, y agota la paciencia de aquellos que realmente viven allí."
 GRE_premium_tourism: "Yates y Boutique Resorts"
 GRE_premium_tourism_desc: "Menos invitados, cada uno pagando mucho más y pisando más ligero. Dirección hacia centros turísticos de cinco estrellas, viajes culturales y arqueológicos, y los puertos deportivos superyacht del Ionian protegen las frágiles islas y la marca griega por igual. Los números de llegada del titular pueden subir más lentamente, pero el dinero que permanece detrás corre más profundo."
 GRE_diaspora_remittances: "Corte la Diáspora"
 GRE_diaspora_remittances_desc: "Millones de griegos en el extranjero, desde Melbourne a Chicago, mantienen vínculos con la patria. La canalización de sus ahorros y remesas hacia la economía convierte el sentimiento en capital."
 GRE_diaspora_remittances_event_TT: "§YLa diáspora responde al llamado a la inversión.§!"
 GRE_reverse_brain_drain: "Retrocede el cerebro"
 GRE_reverse_brain_drain_desc: "La crisis envió una generación de ingenieros griegos, médicos e investigadores en el extranjero. Las pausas fiscales, la financiación de la investigación y los empleos reales pueden traerlos, y su experiencia, de vuelta a casa."
 GRE_eu_cohesion_funds: "Fondos de Cohesión de la UE"
 GRE_eu_cohesion_funds_desc: "Como uno de los miembros de bajos ingresos de la Unión, Grecia es un receptor neto de financiación estructural y de cohesión. Desarrollando cada euro en oferta subscribe caminos, puertos y desarrollo regional."
 GRE_recovery_resilience_facility: "Servicio de Recuperación y Resiliencia"
 GRE_recovery_resilience_facility_desc: "El Servicio de Recuperación y Resiliencia post-pandemia canaliza decenas de miles de millones hacia la transición verde y digital. Pasó bien, es el programa de inversión más grande en la historia griega moderna."
 GRE_recovery_facility_event_TT: "§YBruselas desembolsa el primer tramo, y Atenas debe decidir qué tan rápido gastarlo.§!"
 GRE_infrastructure_cofinancing: "Infraestructura Co-Financing"
 GRE_infrastructure_cofinancing_desc: "El dinero europeo cubre la mayor parte de la factura, el dinero griego cubre el resto. Las autopistas cofinanciadas, las líneas de metro y las rejillas se construyen a una fracción del costo nacional."
 GRE_deterrence_posture: "Posición de disuasión"
 GRE_forward_posture_mod: "Postura Agresiva"
 GRE_defense_partner: "Socio de Defensa"
 GRE_naval_partner: "Compañero naval"
 GRE_strong_naval_partner: "Un socio naval cercano"
 GRE_defense_exporter: "Defensa Exportador"
 GRE_f35_partner: "F-35 Program Partner"
 GRE_aegean_encroachment: "Aegean Encroachment"
 GRE_refused_debt_call_opinion: "Demanda de reembolso de la deuda rechazada"
 GRE_debt_forgiven_opinion: "Deuda perdonada"
 GRE_debt_fully_repaid_opinion: "Deuda Fully Repaid"
 GRE_forgave_debt_opinion: "Forgave Nuestra Deuda"
 GRE_economy_modifier: "Economía helénica"
 GRE_debt_crisis_category: "La crisis de la deuda [GRE.GetAdjective]"
 GRE_debt_crisis_category_desc: "Pese a nuestro crecimiento económico, nuestra deuda sigue acumulándose en cifras cada vez mayores, ya sea por un gasto público ineficaz, bonos que vencen o déficits presupuestarios regulares. Debemos manejar nuestra deuda antes de que se convierta en una crisis, o convertirla en una herramienta que asegure nuestra prosperidad continua en el nuevo milenio.\n\nRazón actual PIB-deuda: [?debt_ratio|%Y]\n§YDeuda en manos de acreedores§! actual: $$[?GRE_total_creditor_debt|0]\n"
 GRE_austerity_tension_mission: "Tensiones de austeridad"
 GRE_austerity_tension_mission_desc: "Los recortes de gastos y los aumentos fiscales han hecho enojar a la gente. Debemos llevar nuestra relación de deuda unificada por debajo §Y75%§! para poner fin a las tensiones. Cada vez que el reloj se agota las protestas empeoran, y si hierven en su pico, el país se desliza hacia una crisis de deuda total."
 GRE_debt_crisis_mission: "La crisis de la deuda [GRE.GetAdjective]"
 GRE_debt_crisis_mission_desc: "La austeridad ha fracasado y los mercados han perdido la fe en nosotros. Debemos llevar nuestra razón de deuda unificada por debajo del §Y75%§! mediante recortes de gasto y traspasando deuda a acreedores extranjeros. Cada vez que se agota el plazo, el gobierno paga el precio, y nuestro fracaso corre el riesgo de arrastrar a toda la Eurozona con nosotros."
 GRE_austerity_placate_decision: "Colocar los Protestores"
 GRE_austerity_placate_decision_desc: "La atención del gobierno y un alivio selectivo pueden quitar filo a la frustración pública. Reducir la presión visible de la austeridad debería ayudar a restablecer la Estabilidad y bajar las tensiones."
 GRE_slash_public_spending_decision: "Gasto público de choque"
 GRE_slash_public_spending_decision_desc: "Recortes generalizados a los ministerios, las nóminas públicas y las pensiones. Las cuentas se verán mejor, pero la gente sentirá cada euro. Reduce nuestra deuda nacional en un §Y5%§!."
 GRE_emergency_tax_hikes_decision: "Anticipos fiscales de emergencia"
 GRE_emergency_tax_hikes_decision_desc: "Subir el IVA y los impuestos sobre la renta para tapar el hueco del presupuesto. La recaudación es real, y también el enojo contra el partido gobernante. Reduce nuestra deuda nacional en un §Y4%§!."
 GRE_privatization_drive_decision: "Privatización Conducir"
 GRE_privatization_drive_decision_desc: "Subastar activos estatales, de puertos a servicios públicos, al mejor postor. Una bonanza única que los sindicatos no perdonarán pronto. Reduce nuestra deuda nacional en un §Y8%§!."
 GRE_unified_ratio_below_75_tt: "Nuestra §YRelación de la deuda unificada§! es menor que §Y75%§! (Current) §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_buys_mission_time_tt: "§GAgrega 30 días a la misión activa de la deuda§!"
 GRE_austerity_mission_active: "\nLa tensión de austeridad actual es §R[gre_austerity_tension]§!"
 GRE_generic_decisions_category: "[GRE.GetNameWithFlag] Política Decisiones"
 GRE_generic_decisions_category_desc: "Decisiones políticas disponibles para el gobierno griego."
 GRE_rename_istanbul_desc: "Con Constantinopla bajo control griego, el gobierno restaura formalmente el nombre histórico de la ciudad. El renombramiento tiene un profundo significado cultural y eleva la moral nacional."
 GRE_archipelago_air_base_rapid_repair: "Programa de reparación rápida de bases aéreas"
 GRE_archipelago_air_base_rapid_repair_desc: "Montar equipos de reparación dedicados y equipo preposicionado en las bases aéreas insulares significa que el daño de los ataques enemigos puede repararse más rápido, y mantiene operativo nuestro poder aéreo."
 GRE_archipelago_anti_air_rapid_repair: "Protocolos de mantenimiento de baterías antiaéreas"
 GRE_archipelago_anti_air_rapid_repair_desc: "Equipos de mantenimiento móviles en los sitios de defensa aérea insulares, con piezas y formación estandarizadas, nos permitirían restaurar más rápido las baterías dañadas y mantener intacta nuestra red de defensa aérea."
 GRE_archipelago_bunker_repair_protocols: "Cuerpo de reparación de fortificaciones insulares"
 GRE_archipelago_bunker_repair_protocols_desc: "Unidades de ingeniería especializadas en todo el archipiélago centradas en la rápida restauración del búnker. Las fortificaciones dañadas se pueden traer de vuelta a la plena eficacia rápidamente."
 GRE_archipelago_naval_base_repair_protocols: "Iniciativa de mantenimiento de bases navales"
 GRE_archipelago_naval_base_repair_protocols_desc: "Materiales de reparación y técnicos cualificados preposicionados en las instalaciones navales insulares permiten reparar más rápido la infraestructura portuaria dañada y mantener en marcha las operaciones marítimas."
 GRE_archipelago_coastal_obstacle_network: "Red de obstáculos costeros"
 GRE_archipelago_coastal_obstacle_network_desc: "Los obstáculos submarinos, los campos minados y las barreras a través de posibles zonas de aterrizaje harían que sea mucho más difícil para cualquier ataque naval enemigo llegar a nuestras costas."
 GRE_archipelago_supply_disruption: "Negación de suministros al territorio central"
 GRE_archipelago_supply_disruption_desc: "Una interrupción logística planificada de antemano en nuestros núcleos insulares dificultaría que cualquier enemigo ocupante mantuviera líneas de suministro o explotara recursos locales."
 GRE_archipelago_coastal_battery_expansion: "Programa de ampliación de baterías costeras"
 GRE_archipelago_coastal_battery_expansion_desc: "Ampliar nuestras instalaciones de artillería costera más allá de lo que el terreno permite normalmente. La geografía insular no debería limitar nuestra capacidad de defender el litoral."
 GRE_archipelago_island_fortress_expansion: "Programa de ampliación de fortalezas insulares"
 GRE_archipelago_island_fortress_expansion_desc: "Financiar obras de ingeniería para construir búnkeres más allá de lo que permiten los límites actuales del terreno. Nuestras islas pueden sostener fortificaciones más fuertes de lo que suponía la doctrina actual."
 GRE_archipelago_attrition_doctrine: "Archipiélago Attrition Doctrine"
 GRE_archipelago_attrition_doctrine_desc: "Codificar tácticas que usan el terreno insular para desangrar a cualquier fuerza atacante. Las unidades enemigas a campo abierto sufrirían mayor desgaste y hostigamiento constante desde nuestras posiciones preparadas."
 GRE_archipelago_supply_interdiction: "Operaciones de interdicción de suministro insular"
 GRE_archipelago_supply_interdiction_desc: "Capacitación y colocación de unidades para negar activamente el acceso de las fuerzas enemigas a los recursos locales. Cualquier enemigo que opera en nuestras islas encontraría sus fuentes de suministro sistemáticamente cortadas."
 GRE_archipelago_missile_battery_expansion: "Ampliación de la defensa antimisil insular"
 GRE_archipelago_missile_battery_expansion_desc: "Financiación adicional para construir sitios de defensa antimisil más allá de los límites normales del terreno en todo el archipiélago. Más inversión de ingeniería nos permite superar las restricciones habituales del terreno."
 GRE_archipelago_air_defense_expansion: "Red ampliada de defensa aérea"
 GRE_archipelago_air_defense_expansion_desc: "Elevar el techo de construcción de instalaciones antiaéreas por encima de los límites normales del terreno. Incluso las islas más pequeñas podrían tener una cobertura densa de defensa aérea."
 GRE_archipelago_decision_active: "Ya está en marcha un programa de defensa del archipiélago"
 GRE_archipelago_set1_A_chosen: "Programa de reparación rápida de la base aérea terminado"
 GRE_archipelago_set1_B_chosen: "Antiaéreo Protocolos de mantenimiento de la batería completados"
 GRE_archipelago_set2_A_chosen: "Cuerpo de reparación de Fortificación Isla completado"
 GRE_archipelago_set2_B_chosen: "Iniciativa de conservación de bases navales terminada"
 GRE_archipelago_set3_A_chosen: "Red de Obstáculos Costeros terminada"
 GRE_archipelago_set3_B_chosen: "Finalización de la denegación de suministros del Territorio Central"
 GRE_archipelago_set4_A_chosen: "Programa de ampliación de la batería costera completado"
 GRE_archipelago_set4_B_chosen: "Programa de Ampliación de la Fortaleza Insular terminado"
 GRE_archipelago_set5_A_chosen: "Archipiélago Attrition Doctrine completed"
 GRE_archipelago_set5_B_chosen: "Operaciones de interceptación de suministros en las islas terminadas"
 GRE_archipelago_set6_A_chosen: "Expansión de la Defensa de Misiles en las Islas"
 GRE_archipelago_set6_B_chosen: "Red Ampliada de Defensa Aérea terminada"
 GRE_lie_about_financial_records_decision: "Ajustar favorablemente los registros financieros"
 GRE_lie_about_financial_records_decision_desc: "Pese a nuestro crecimiento económico constante, nuestra moneda anticuada y otros males económicos nos impiden cerrar nuestros acuerdos económicos con la Unión Europea."
 GRE_negotiate_debt_swap_deals_decision: "Negociar acuerdos de canje de deuda"
 GRE_negotiate_debt_swap_deals_decision_desc: "Abrir negociaciones con una potencia extranjera para reestructurar nuestra deuda mediante canjes de divisas. Al trasladar nuestras obligaciones al banco central de otra nación, quizá obtengamos mejores condiciones de pago."
 GRE_defer_payments_decision: "Deferencia Enfoque Pagos"
 GRE_defer_payments_decision_desc: "En lugar de pagar por adelantado los programas económicos, diferir los costos a nuestra deuda nacional. Esto preserva nuestro tesoro a costa de aumentar nuestras obligaciones."
 GRE_do_not_defer_payments_decision: "Reanudar los pagos directos"
 GRE_do_not_defer_payments_decision_desc: "Dejar de aplazar los costos y volver a pagar por programas económicos directamente desde el tesoro."
 CYP_NCY_diplomatic_category: "Conferencias de Reunificación de Chipre"
 GRE_brit_5_TT: "§GGain 5 British Support§!"
 GRE_brit_30_TT: "§GGain 30 British Support§!"
 GRE_unification_TT: "Cuando esté completo, habrá una conferencia mensual en la que, dependiendo de la aprobación, se podrán lograr progresos."
 PER_presidential_decisions_only_one_is_available_TT: "Solo una de estas decisiones puede estar activa a la vez."
 GRE_homelessness_crisis_category: "La crisis ateniense de Homelessness"
 GRE_homelessness_crisis_category_desc: "Tras el terremoto de 1999 en Atenas, miles de ciudadanos griegos están ahora sin hogar. Se están prestando ayuda y reparaciones en la ciudad, pero podemos optar por impulsar la iniciativa para completar la reparación de los distritos urbanos y residenciales."
 GRE_reconstruction_efforts_in_athens_decision: "Financiar esfuerzos adicionales de reconstrucción en Atenas"
 GRE_reconstruction_efforts_in_athens_decision_desc: "El terremoto ha causado graves daños a través de Atenas. Los bloques de apartamentos se desmoronaron, la infraestructura dañada y barrios enteros reducidos a escombros. Las reparaciones iniciales han comenzado pero los fondos de socorro no son suficientes. Dirigir fondos adicionales hacia la reconstrucción aceleraría el esfuerzo de reconstrucción."
 GRE_issue_relief_funds_to_victims_decision: "Entregar fondos de socorro a las víctimas del terremoto"
 GRE_issue_relief_funds_to_victims_decision_desc: "Más allá de la destrucción material, el terremoto ha dejado a muchas familias sin nada. Ahorros arrasados, negocios destruidos, personas heridas. Entregar fondos directos de ayuda a las víctimas daría ayuda inmediata para comida, ropa, vivienda temporal y lo básico necesario para empezar a reconstruir."
 GRE_petition_turkey_for_support_decision: "Petición [TUR.GetName] para soporte"
 GRE_petition_turkey_for_support_decision_desc: "Solicitar a [TUR.GetNameWithFlag] apoyo para nuestra recuperación tras el terremoto. Esperemos que encuentren en su corazón apoyarnos en nuestro momento de necesidad."
 GRE_cypriot_TT: "§YCyprus§! declara guerra contra §Y Chipre del Norte§!"
 GRE_debt_crisis_experienced_tt: "Nos hemos enfrentado a §RCrisis de la deuda§!"
 GRE_joining_the_euro_interest_rate_tt: "Cambios en los requisitos §Y$EU_join_the_euro_decision$§!:\n- §Y Tasa de interés§! Requisición a §Y6.5%§! en lugar de §Y3.5%§!\n"
 GRE_defer_payments_decision_tt: "Nos permite diferir el pago de acciones futuras (p. ej., decisiones, enfoques) a nuestra §Ydeuda nacional§! o a un §Yacreedor extranjero§! en lugar de pagar en efectivo."
 GRE_golden_visa_deals: "Las Visas de Oro"
 GRE_golden_visa_deals_desc: "El programa Golden Visa ofrece un permiso de residencia de cinco años a cualquier inversionista que cometa una suma calificativa en [GRE.GetAdjective] bienes raíces o negocios. Los compradores de alto valor desde fuera de la UE han mostrado un fuerte interés, proporcionando una línea directa de capital extranjero en el mercado nacional."
 GRE_targeted_pension_reforms: "Reformas de las pensiones dirigidas"
 GRE_targeted_pension_reforms_desc: "El sistema de pensiones absorbe una parte desproporcionada del PIB. Las reformas orientadas a reforzar la elegibilidad, reducir el abuso de jubilación anticipada y transferir las pensiones suplementarias a un modelo financiado aliviarán la carga fiscal sin descalificar por completo la red de seguridad."
 GRE_merchant_marine: "El Merchant Marine"
 GRE_merchant_marine_desc: "Grecia opera la flota mercante más grande del mundo bajo las banderas de la Unión de Shipowners Griegos, uno de los lobbies industriales más poderosos en Atenas. Los armadores y sus familias controlan dos quintas partes del tonelaje de la flota y mantienen el 7-8% del PIB fluyendo hacia las cuentas nacionales a través de salarios, impuestos y tarifas portuarias."
 GRE_tonnage_tax_regime: "Preservar el impuesto de Tonnage"
 GRE_tonnage_tax_regime_desc: "Las familias armamentistas han disfrutado durante mucho tiempo de un régimen favorable de tonelaje que mantiene los vasos aplanados griegos rentables y desalienta la insignia hacia los registros extranjeros. Mantener este régimen preserva los ingresos que fluyen a través de puertos y muelles griegos, manteniendo vivos los patios Skaramangas, Elefsina y Neorion."
 GRE_tax_the_shipowners: "Impuesto a los Magnates de Envío"
 GRE_tax_the_shipowners_desc: "Los moguls navieros han escapado mucho tiempo de la carga de impuestos que cae sobre los griegos ordinarios. Desmantelando el régimen de tonelaje y levando directamente a los armadores extraería una gran catarata única para el tesoro, aunque la insignia sigue siendo una amenaza constante."
 GRE_shipbuilding_revival: "Astilleros griegos reverentes"
 GRE_shipbuilding_revival_desc: "Los patios de Skaramangas, Elefsina y Neorion construyeron una vez la flota mercante que trajo riqueza a Grecia. El restablecimiento de su capacidad con subsidios y contratos específicos devolvería el empleo en los astilleros y aseguraría un suministro interno de cascos modernos."
 GRE_pdo_exports: "Exportaciones Premium de Origen Protegido"
 GRE_pdo_exports_desc: "Las aceitunas Kalamata, aceite de oliva virgen extra, queso feta y vino Assyrtiko son de renombre mundial. Invertir en la designación protegida de marca de origen y la comercialización premium eleva estos productos fuera de la competencia de los productos básicos y ordena precios más altos en los mercados internacionales."
 GRE_recapitalize_banks: "Recapitalizar los bancos"
 GRE_recapitalize_banks_desc: "Los cuatro bancos sistémicos de Grecia acumularon trillones en préstamos sin rendimiento durante la crisis. El Fondo Helenic Financial Estabilidad podría inyectar capital fresco mediante una recapitalización forzada, restableciendo su capacidad de prestar y estabilizar el sistema financiero a un costo fiscal significativo."
 GRE_hercules_scheme: "El Plan de Protección de Activos Hércules"
 GRE_hercules_scheme_desc: "El plan HAPS securitiza préstamos no activos de los balances de los bancos, sin liberar su capacidad de crédito y reduciendo los costos de préstamo para empresas y hogares que buscan crédito."
 GRE_privatize_banks: "Bancos de retorno a manos privadas"
 GRE_privatize_banks_desc: "Vender las apuestas del estado en los bancos recapitalizados a inversores privados atraería una fuerte demanda corporativa y produciría una importante fuente de ingresos fiscales. El voto de confianza del mercado también señalaría el regreso de Grecia a la normalidad."
 GRE_state_bank_control: "Mantener bancos en manos del Estado"
 GRE_state_bank_control_desc: "Retener la propiedad estatal de los bancos nos permite dirigir sus préstamos hacia la construcción nacional, industria y sectores estratégicos sin presión de accionista privada para obtener ganancias. El costo político de la propiedad pública se ve compensado por el control sobre la asignación de créditos."
 GRE_nationalist_takeover_TT: "¡El pueblo griego exige reelección!\n\nAsegúrate de tener suficiente Poder político guardado para esto. Si usted §R fáil§! para elegir y formar un gobierno, §R necesita tener otra elección extraordinaria§! para empoderar §Y[Nat_Fascism_L]§!"
 GRE_dev_cyp_desc: "Chipre ha sufrido décadas de división y subinversión. Con la isla ahora bajo soberanía griega, podemos comenzar el trabajo de desarrollar su infraestructura, economía e instituciones al estándar del continente."
 GRE_decrease_taxes: "Disminuir los impuestos"
 GRE_decrease_taxes_desc: "El pueblo griego no debe ser presionado por la alta tributación. Además, si bajamos los impuestos, podría reducir las tasas de evasión fiscal, que es un gran problema en nuestro país."
 GRE_eastern_neighborhood: "Barrio Oriental"
 GRE_eastern_neighborhood_desc: "Grecia debe definir su relación con sus vecinos más cercanos, Turquía y la isla dividida de Chipre. La forma en que nos involucramos con ambos dará forma a la región para una generación."
 GRE_turkey_rapprochement: "Acercamiento con Turquía"
 GRE_turkey_rapprochement_desc: "Grecia y Turquía tienen más en común que cualquiera de las partes admite. Un diálogo estructurado sobre comercio, migración y el Egeo puede reducir las tensiones y abrir un camino hacia la coexistencia estable."
 GRE_turkey_confrontation: "Para hacer frente a los Ambiciones Turcas"
 GRE_turkey_confrontation_desc: "Las reiteradas violaciones del espacio aéreo griego y las provocaciones en el Egeo no pueden ir sin respuesta. Grecia tomará una posición firme y reunirá a sus aliados para resistir más invasión."
 GRE_aegean_dialogue: "Diálogo egeo"
 GRE_aegean_dialogue_desc: "Un canal formal para el diálogo sobre los derechos y las fronteras de Egeo reduce el riesgo de escalada accidental y establece bases para un acuerdo marítimo duradero."
 GRE_migration_cooperation: "Cooperación en materia de migración"
 GRE_migration_cooperation_desc: "La coordinación de la política migratoria con Turquía es esencial para gestionar el flujo de refugiados en todo el Egeo. La responsabilidad compartida significa menos crisis para ambas partes."
 GRE_greco_turkish_trade: "Acuerdo Comercial Greco-Turquía"
 GRE_greco_turkish_trade_desc: "La expansión del comercio bilateral reduce el incentivo para la confrontación política. La interdependencia económica entre Grecia y Turquía sirve a los intereses de ambos pueblos."
 GRE_nato_pressure_turkey: "Presión de la OTAN en Turquía"
 GRE_nato_pressure_turkey_desc: "Grecia aprovechará su posición dentro de la OTAN para exigir responsabilidades a Turquía por las violaciones de las normas de alianza. Nuestros aliados deben reconocer que la estabilidad en el Mediterráneo oriental requiere moderación turca."
 GRE_aegean_assertiveness: "Aegean Assertiveness"
 GRE_aegean_assertiveness_desc: "La Armada griega aumentará las patrullas y ejercicios en aguas disputadas para afirmar la soberanía sobre la plataforma continental egea y el espacio aéreo."
 GRE_aegean_deterrence: "Deterrence Egeo"
 GRE_aegean_deterrence_desc: "Invertir en defensa costera y fuerzas de respuesta rápida envía una clara señal de que Grecia está dispuesta a defender su territorio contra cualquier incursión."
 GRE_enosis_campaign: "Campaña de enosis"
 GRE_enosis_campaign_desc: "Grecia lanza una campaña diplomática y cultural para fortalecer los vínculos con la comunidad grecochipriota y promover el ideal de eventual reunificación con la patria."
 GRE_cypriot_economic_integration: "Integración económica chipriota"
 GRE_cypriot_economic_integration_desc: "La intensificación de los vínculos comerciales y financieros entre Grecia y la República de Chipre hace que la reunificación sea económicamente atractiva y refuerza la influencia griega en la isla."
 GRE_northern_outreach: "Extensión al norte"
 GRE_northern_outreach_desc: "Grecia llega a turcochipriotas en el norte, ofreciendo incentivos económicos e intercambio cultural para demostrar que la reunificación sirve sus intereses tanto como los de cualquiera."
 GRE_british_bases_accord: "Acuerdo de Bases British"
 GRE_british_bases_accord_desc: "El Reino Unido mantiene dos áreas de base soberana en Chipre. Alcanzar un acuerdo con Londres garantiza la neutralidad británica (o el apoyo activo) para cualquier proceso de reunificación futuro."
 GRE_cyprus_gas_exploitation: "Explotación del gas de Chipre"
 GRE_cyprus_gas_exploitation_desc: "Se han descubierto importantes reservas de gas natural en las aguas al sur de Chipre. Grecia se mueve a desarrollar estos campos conjuntamente, creando intereses económicos compartidos en una isla unificada."
 GRE_confederation_framework: "Confederación"
 GRE_confederation_framework_desc: "Grecia propone un modelo formal de confederación que preserve la autonomía comunitaria al tiempo que une a la isla bajo una sola soberanía, marco que ambas comunidades pueden aceptar."
 GRE_cyprus_reunification: "Reunificación de Chipre"
 GRE_cyprus_reunification_desc: "Con Chipre Momentum con amplio apoyo en ambas comunidades, la Tensión Egea lo suficientemente baja que Turquía no intervendrá, el Acuerdo de Bases Británicas se aseguró y el marco de confederación completamente detallado, el momento para reunir la isla finalmente ha llegado."
 GRE_force_enosis: "Forzar la cuestión"
 GRE_force_enosis_desc: "La negociación ha fracasado y la isla es un barril de polvo. En lugar de esperar a un asentamiento que nunca llegará, Atenas presiona la Enosis al borde, atreviéndose al Norte a actuar. Si el liderazgo turco-chipriota de Nicosia sale primero, la República de Chipre tendrá todo derecho a reunir la isla por la fuerza."
 GRE_aegean_tension_high_TT: "§B Tensión egeo por encima de §H50§!§!"
 GRE_recognize_unified_cyprus: "Reconocer la República Unificada de Chipre"
 GRE_recognize_unified_cyprus_desc: "Las fuerzas de Nicosia han invadido el Norte. La partición que marcó la isla durante medio siglo ha terminado. Atenas reconoce formalmente una única República de Chipre alineada con Grecia y ayuda a integrar el territorio."
 GRE_western_alignment: "Alineación occidental"
 GRE_western_alignment_desc: "Grecia reafirma su lugar en el centro de la diplomacia occidental. Como miembro fundador de la OTAN, un recién llegado de la UE y el ancla natural del Mediterráneo oriental, Atenas se propone convertir su peso geográfico en compromisos políticos vinculantes, iniciando una campaña de extensión bilateral y multilateral que se medirá en Compromiso Occidental."
 GRE_franco_hellenic_pact: "Asociación estratégica Franco-Hellenic"
 GRE_franco_hellenic_pact_desc: "Sobre la base de la alianza estratégica firmada en Atenas el 2021 de septiembre, Grecia persigue un marco bilateral integral con Francia que abarca la industria de defensa, alineación política exterior y seguridad mediterránea oriental. París es el socio superior más dispuesto de Europa; encuadernarlo más cerca es la piedra angular de cualquier postura occidental creíble."
 GRE_eastmed_trilateral: "Trilateral del Mediterráneo oriental"
 GRE_eastmed_trilateral_desc: "Grecia, Israel y Chipre formalizan su cooperación trilateral de larga data: ejercicios navales conjuntos, intercambio de inteligencia y una posición coordinada sobre la seguridad del Mediterráneo oriental. El acuerdo convierte a tres capitales amigables en un único bloque estratégico frente a la cuenca Levantine."
 GRE_eu_political_anchor: "Ancla de miembro fundador de la UE"
 GRE_eu_political_anchor_desc: "Grecia reafirma su identidad como miembro fundador del proyecto europeo. Al tomar una voz líder en Bruselas, sobre la cohesión, sobre la ampliación, sobre política exterior común, Atenas convierte décadas de membresía en peso político actual."
 GRE_strategic_partnership_treaty: "Artículo 2 Cláusula de Defensa Mutua"
 GRE_strategic_partnership_treaty_desc: "Grecia empuja a la asociación franco-helénica a su conclusión: una cláusula vinculante de defensa mutua modelada en el artículo 5, codificada en forma de tratado. Francia se convierte en el primer tratado de poder europeo para defender el territorio griego, bloqueando un cambio permanente en la orden de seguridad mediterránea."
 GRE_eastmed_gas_forum: "EastMed miembro del foro de gas"
 GRE_eastmed_gas_forum_desc: "Grecia formaliza su papel dentro del Foro de Gas de EastMed junto con Chipre, Israel, Egipto, Italia, Jordania y Palestina. El marco institucional ancla la cooperación energética regional, asegura el acceso preferencial al comercio para el transporte marítimo griego y da a Atenas un asiento permanente en la mesa diplomática de East-Med."
 GRE_3plus1_dialogue: "3+1 Strategic Dialogue"
 GRE_3plus1_dialogue_desc: "Grecia, Chipre e Israel formalizan el diálogo 3+1 con los Estados Unidos, un formato respaldado por el Departamento de Estado que abarca la seguridad energética, la cooperación marítima y la lucha contra el terrorismo. El acuerdo da a Washington un canal estructurado en el trilateral de East-Med y corona la arquitectura regional con compromiso estadounidense."
 GRE_eu_strategic_compass: "Compases estratégicos de la UE"
 GRE_eu_strategic_compass_desc: "Grecia se convierte en un defensor vocal de la Compasía Estratégica de la UE, impulsando la autonomía estratégica europea, una integración más profunda del PESCO y un pilar europeo dentro de la OTAN. Atenas se alinea con París y Berlín en defensa continental, intercambiando miembros tranquilos para un papel activo de configuración."
 GRE_pillar_of_the_west: "Pilar del Oeste"
 GRE_pillar_of_the_west_desc: "El trabajo de los años da fruto. Grecia no es la periferia de la diplomacia occidental sino una de sus piedras angulares. La profundidad del legado, medido por el Compromiso Occidental acumulado a través de la campaña, determina cuán firmemente Atenas está incrustada en esa estructura."
 GRE_regional_diplomacy: "Diplomacia regional"
 GRE_regional_diplomacy_desc: "Grecia es un pilar de los Balcanes y debe mantener relaciones fuertes con todos sus vecinos. Estabilidad en la región es inseparable de la propia seguridad y prosperidad de Grecia."
 GRE_prespa_implementation: "Aplicación del Acuerdo de Prespa"
 GRE_prespa_implementation_desc: "El Acuerdo de Prespa resolvió una disputa de décadas sobre el nombre de Macedonia del Norte. Grecia cumple plenamente sus obligaciones, normalizando las relaciones y abriendo la puerta para ampliar el comercio."
 GRE_albania_minority: "Derechos de las minorías albanesas"
 GRE_albania_minority_desc: "Una minoría griega importante vive en el sur de Albania. Grecia mantiene un diálogo constructivo sobre los derechos de las minorías, utilizando la cuestión como base para una mayor participación bilateral en lugar de confrontación."
 GRE_egypt_maritime: "Egipto asociación marítima"
 GRE_egypt_maritime_desc: "Grecia y Egipto firman un acuerdo de límites marítimos en el Mediterráneo oriental, creando un marco jurídico para el desarrollo conjunto de la energía y excluyendo las reclamaciones turcas de la zona."
 GRE_italy_mediterranean_axis: "Italy-Mediterranean Axis"
 GRE_italy_mediterranean_axis_desc: "Italia es el socio comercial más grande de la UE, con comercio bilateral superior a doce mil millones de euros anuales. Una asociación formal amplía la cooperación en energía, transporte y defensa en todo el Mediterráneo central."
 GRE_balkan_energy_corridor: "Corredor de energía balcánica"
 GRE_balkan_energy_corridor_desc: "El interconexor de gas Grecia-Bulgaria y el terminal flotante Alexandroupolis transforman a Grecia en un centro crítico de tránsito energético. Un nuevo oleoducto al norte de Macedonia extiende esta red más profundamente en los Balcanes."
 GRE_mediterranean_energy_hub: "Centro de energía mediterráneo"
 GRE_mediterranean_energy_hub_desc: "Con la FSRU de Alejandría y el terminal de Revithoussa operando a su capacidad, Grecia se posiciona como la puerta principal del GNL de Europa, reemplazando la dependencia del gasoducto ruso con suministro marítimo del Mediterráneo oriental y más allá."
 GRE_gulf_strategic_partners: "Socios estratégicos del Golfo"
 GRE_gulf_strategic_partners_desc: "Grecia establece un Consejo Supremo de Cooperación Estratégica con Arabia Saudita y profundiza los vínculos de defensa e inversión con los EAU. El capital del Golfo y la cooperación militar fluyen hacia el Mediterráneo oriental."
 GRE_balkans_eu_advocacy: "Balkans EU Advocacy"
 GRE_balkans_eu_advocacy_desc: "Basándose en el compromiso de la Cumbre Tesalónica de 2003, Grecia campeona los Balcanes occidentales adhesión a la UE. Como miembro de la UE más establecido de la región, Grecia gana apalancamiento de potencia blanda sobre Serbia, Albania y Macedonia del Norte."
 GRE_imec_gateway: "Puerta de IMEC"
 GRE_imec_gateway_desc: "El Corredor Económico India-Middle Este-Europa designa al Pireo como su término europeo. Las inversiones masivas portuarias y logísticas transforman a Grecia central en un nexo comercial transcontinental que vincula Asia con Europa."
 GRE_se_european_pillar: "Pilar de Europa sudoriental"
 GRE_se_european_pillar_desc: "Grecia cementa su posición como el centro indispensable del sureste de Europa: una pasarela energética, un patrón balcánico, un anclaje comercial mediterráneo y un punto final de pasillo que une tres continentes."
 GRE_eastern_alignment: "Pivote oriental"
 GRE_eastern_alignment_desc: "Después de una década de austeridad Troika y tutela atlántica, Atenas mira hacia el este. Grecia cultivará relaciones paralelas con Rusia, China, Irán y los Balcanes ortodoxos, y a lo largo del tiempo se convertirá en un anclaje mediterráneo del mundo multipolar."
 GRE_strategic_autonomy: "Autonomía estratégica"
 GRE_strategic_autonomy_desc: "Grecia no necesita elegir un solo maestro. Un miembro de la OTAN que todavía compra gas ruso, cortes Golfo y capital chino, y mediates entre rivales pueden extraer concesiones de todos los lados. Atenas traza un curso multi-vector, no contempla ningún bloque y útil para todos."
 GRE_strategic_autonomy_event_TT: "§YSe abre un debate sobre cómo manejar la posición no alineada de Grecia.§!"
 GRE_russia_outreach: "Canales abiertos con Moscú"
 GRE_russia_outreach_desc: "Grecia se acerca silenciosamente al Kremlin con una oferta: contratos de gas natural a largo plazo, acceso portuario ampliado para el transporte marítimo ruso y señales políticas más cálidas. La respuesta de Moscú establecerá el tono de una nueva asociación mediterránea."
 GRE_china_outreach: "Beijing"
 GRE_china_outreach_desc: "Los enviados griegos viajan a Beijing buscando un compromiso más profundo: financiación industrial, telecomunicaciones, infraestructura. La adquisición china de Pireo ya ha demostrado el modelo. Ahora Atenas propone escalarla a través de la economía griega."
 GRE_iran_outreach: "Extensión a Teherán"
 GRE_iran_outreach_desc: "Grecia, muy comprensiva con las sanciones iraníes, propone silenciosamente un trueque y un marco energético fuera del SWIFT. El movimiento es provocador en Bruselas y Washington, pero lucrativo si Teherán está de acuerdo."
 GRE_orthodox_outreach: "Hermandad Ortodoxa"
 GRE_orthodox_outreach_desc: "Atenas convoca una cumbre con Belgrado, Nicosia y Yerevan, forjando un alineamiento cultural y político de la Europa ortodoxa. La diplomacia patriarcal se convierte en artesanía estatal, construyendo un bloque regional que no responde a Bruselas ni a Washington."
 GRE_russia_milcoop: "Helenic-Russian Defense Talks"
 GRE_russia_milcoop_desc: "Siguiendo la asociación energética, Atenas propone una cooperación formal de defensa con Moscú: ejercicios conjuntos, modernización S-300 PMU2 e intercambio de inteligencia. La señal política de la OTAN es inconfundible."
 GRE_china_bri_anchor: "Franja y la Ruta Ancla"
 GRE_china_bri_anchor_desc: "Grecia se ofrece como el ancla europeo de China Franja y la Ruta, ampliando la huella de COSCO, abriendo nuevas zonas de libre comercio en Attica e integrando la logística griega en las cadenas chinas de suministro."
 GRE_iran_med_corridor: "Corredor Mediterráneo oriental"
 GRE_iran_med_corridor_desc: "Atenas propone un corredor energético Irán-Grecia, una cruzada y GNL a través de intermediarios de terceros países para evitar sanciones occidentales. Si Teherán acepta, Grecia se convierte en la ventana de Irán hacia Europa."
 GRE_orthodox_security: "Pacto de seguridad ortodoxa"
 GRE_orthodox_security_desc: "El Consejo ortodoxo formaliza un pacto de defensa: entrenamiento compartido, cooperación de inteligencia y consulta política permanente. Serbia, Chipre y Armenia se unen a Grecia en un bloque discreto pero inconfundible."
 GRE_brics_membership: "Únase a BRICS+"
 GRE_brics_membership_desc: "Grecia se adhiere formalmente al marco BRICS+ como primer miembro europeo. La ruptura con la OTAN está ahora completa; a cambio, Atenas obtiene acceso preferencial al Nuevo Banco de Desarrollo, el sistema de asentamiento Yuan-Ruble y un asiento en la mesa multipolar."
 GRE_multipolar_anchor: "Ancla del Mundo Multipolar"
 GRE_multipolar_anchor_desc: "Grecia se declara ancla del nuevo orden multipolar. La alianza atlántica es renunciada, la Unión Europea queda y una república mediterránea de tres continentes (Eurasian, Levantine, African) nace desde Atenas hacia afuera."
 GRE_eastern_outreach: "Extensión oriental"
 GRE_eastern_outreach_desc: "Atenas ha comenzado a cultivar socios fuera de la alianza atlántica. El ancho de banda diplomático fluye hacia el este, y la autonomía política comercial se ensancha, pero las capitales occidentales están observando atentamente."
 GRE_eurasian_partner: "Compañero eurasiático"
 GRE_eurasian_partner_desc: "Grecia es ahora un socio eurasiático reconocido. El capital de Moscú, Beijing y Teherán subscribe la industria griega, mientras que la opinión occidental se endurece. El camino hacia atrás se estrecha."
 GRE_brics_anchor: "Ancla BRICS"
 GRE_brics_anchor_desc: "Grecia se sienta en la mesa BRICS+. La alianza atlántica es un recuerdo; el Mediterráneo es un mar multipolar. Atenas habla con la autoridad de una bisagra continental."
 GRE_orthodox_defense_pact: "Pacto de Defensa Ortodoxa"
 GRE_orthodox_defense_pact_desc: "Un pacto de defensa permanente entre Europa ortodoxa: ejercicios conjuntos, doctrina compartida e inteligencia conjunta con Belgrado, Nicosia y Yerevan."
 GRE_iran_barter_framework: "INSTEX-Style Barter"
 GRE_iran_barter_framework_desc: "El comercio greco-iraniano fluye a través de un barter clearinghouse fuera del SWIFT, eliminando las sanciones y desbloqueando los mercados iraníes para los exportadores griegos."
 GRE_iran_med_corridor_idea: "Corredor de Energía del Mediterráneo Oriental"
 GRE_iran_med_corridor_idea_desc: "El crudo iraní y el GNL se trasladan a Europa a través de un corredor griego. Refining capacity expands, fuel reserves rise, and Athens becomes a regional energy chokepoint."
 GRE_diplomacy_category: "Diplomacia griega"
 GRE_host_putin_summit: "Acoger una cumbre rusa"
 GRE_host_putin_summit_desc: "Invitar al presidente ruso a Atenas para una cumbre bilateral de alto perfil. Se firman carteras comerciales, se montan sesiones fotográficas y las embajadas occidentales fruncen el ceño."
 GRE_cosco_pier_expansion: "Expansión del muelle COSCO"
 GRE_cosco_pier_expansion_desc: "Cofinanciar otra fase de la ampliación de COSCO en El Pireo. Una fábrica civil se compromete con el proyecto durante tres meses; a cambio, el Ática gana una ranura de infraestructura permanente."
 GRE_instex_iran_barter: "Operar el canal de trueque con Irán"
 GRE_instex_iran_barter_desc: "Procesar un tramo del comercio grecoiraní por la cámara de compensación de trueque, y refrescar el marco y premiar a los comerciantes que lo mantienen vivo."
 GRE_orthodox_patriarchate_summit: "Convocar el Concilio Ortodoxo"
 GRE_orthodox_patriarchate_summit_desc: "Acoger la Cumbre del Patriarcado en Atenas, que reúne a líderes serbios, chipriotas y armenios para consultas eclesiásticas y políticas."
 GRE_retry_russia_outreach: "Re-approach Moscow"
 GRE_retry_russia_outreach_desc: "Tras el rechazo previo, los diplomáticos griegos preparan una propuesta revisada y reabren canales con el Kremlin."
 GRE_retry_russia_milcoop: "Re-proponer las conversaciones de defensa"
 GRE_retry_russia_milcoop_desc: "Renovar la propuesta de cooperación de defensa helenorrusa con condiciones mejoradas y señales más discretas."
 GRE_retry_china_outreach: "Re-approach Beijing"
 GRE_retry_china_outreach_desc: "Enviar un nuevo enviado a Pekín con términos revisados y una nueva ronda de garantías de inversión."
 GRE_retry_china_bri_anchor: "Replantear el papel de ancla de la BRI"
 GRE_retry_china_bri_anchor_desc: "Revisar la oferta de ancla de la BRI con concesiones más amplias en logística, propiedad y alineamiento político."
 GRE_retry_iran_outreach: "Re-engage Tehran"
 GRE_retry_iran_outreach_desc: "Tras la negativa inicial de Teherán, Atenas reabre conversaciones discretas a través de intermediarios de terceros países."
 GRE_retry_iran_med_corridor: "Volver a proponer el Corredor del Mediterráneo"
 GRE_retry_iran_med_corridor_desc: "Revisar la propuesta del Corredor del Mediterráneo Oriental con nuevas opciones de trazado que reduzcan aún más la exposición de Irán a la aplicación de sanciones occidentales."
 GRE_retry_orthodox_outreach: "Reconvocar la Cumbre Ortodoxa"
 GRE_retry_orthodox_outreach_desc: "Recomponer las relaciones tras la fallida cumbre inicial y volver a convocar en Atenas a los ministros de exteriores ortodoxos."
 GRE_retry_orthodox_security: "Volver a proponer el Pacto de Seguridad"
 GRE_retry_orthodox_security_desc: "Renovar el pacto de seguridad ortodoxo con compromisos revisados sobre el intercambio de inteligencia y las rotaciones de ejercicios."
 greece.530.t: "Propuesta de energía griega"
 greece.530.d: "Atenas propone una asociación energética y comercial integral: contratos de gas a largo plazo, concesiones portuarias para el transporte marítimo ruso, y un reajuste discreto de la política exterior griega hacia Moscú. El Ministro de Relaciones Exteriores helénico espera una respuesta."
 greece.530.a: "Una apertura bienvenida. Firme."
 greece.530.b: "Atenas no puede cumplir sus promesas. Declin."
 greece.531.t: "Moscú acepta la asociación"
 greece.531.d: "El Kremlin acepta la propuesta griega. Se intercambian carteras comerciales, se firma un acuerdo bilateral mejorado y el gas ruso comienza a fluir en términos favorables. Atenas tiene su primer socio oriental."
 greece.531.a: "Bienvenidos a la nueva política exterior helénica."
 greece.532.t: "Moscow Declines"
 greece.532.d: "El Kremlin declina cortésmente la onza griega. Sin garantías firmes de Atenas dejando la alianza atlántica, Moscú no tiene ningún incentivo para asumir riesgos políticos. El revés es real, pero la puerta no está cerrada."
 greece.532.a: "Reagrupar e intentarlo de nuevo."
 greece.533.t: "Propuesta de cooperación en defensa griega"
 greece.533.d: "Atenas propone un marco de defensa helénico-ruso formal: ejercicios conjuntos, soporte de modernización S-300 PMU2 y compartir inteligencia. Moscú pesa el premio político contra el retroceso diplomático de la OTAN."
 greece.533.a: "Una alineación histórica. Aceptar."
 greece.533.b: "Grecia sigue siendo miembro de la OTAN. Declin."
 greece.534.t: "Moscú acepta conversaciones de defensa"
 greece.534.d: "El ministerio de defensa ruso está de acuerdo con la cooperación formal. Los oficiales griegos viajan a Moscú para su formación; Los ingenieros rusos llegan a la Base Naval Salamis. El bono de la doctrina terrestre es significativo, pero también el costo político."
 greece.534.a: "Comienza la cooperación de armas helénicas-rusas."
 greece.535.t: "Moscú Declines Defensa conversaciones"
 greece.535.d: "Moscú disminuye, citando las continuas obligaciones de la OTAN en Grecia. Hasta que Atenas abandone la alianza atlántica, o al menos señale una intención creíble a, no habrá cooperación formal de defensa."
 greece.535.a: "Observe la demanda de mayor compromiso."
 greece.536.t: "Enfoque griego para Beijing"
 greece.536.d: "Atenas se acerca a Beijing con una propuesta para profundizar el compromiso económico: telecomunicaciones, financiación de infraestructuras y una integración más amplia de la RB. El Ministerio de Relaciones Exteriores chino adopta la propuesta que se examina."
 greece.536.a: "Un ajuste natural. Endorse."
 greece.536.b: "Los costos políticos superan los beneficios. Declin."
 greece.537.t: "Beijing Acepta"
 greece.537.d: "El liderazgo chino respalda la asociación. El capital estatal comienza a fluir en proyectos industriales y de telecomunicaciones griegos, y la influencia griega en los cálculos de Beijing aumenta mesurablemente."
 greece.537.a: "La asociación Sino-Hellenic profundiza."
 greece.538.t: "Beijing Declines"
 greece.538.d: "Pekín demurs: Atenas, argumenta, no puede ofrecer lo que ya está asegurado a través de canales más tranquilos. Los diplomáticos griegos regresan con las manos vacías pero sin disuasión."
 greece.538.a: "Reevaluar e intentarlo de nuevo."
 greece.539.t: "Propuesta de Anclaje BRI griego"
 greece.539.d: "Atenas se ofrece como el ancla europeo de los Franja y la Ruta: concesiones COSCO ampliadas, zonas de libre comercio en Attica y alineación política sobre temas del Indo Pacífico. El precio es empinado, pero también el premio."
 greece.539.a: "Un ancla de ambición histórica. Aceptar."
 greece.539.b: "Los términos todavía no son aceptables. Declin."
 greece.540.t: "Beijing apoya el anclaje BRI"
 greece.540.d: "China designa oficialmente a Grecia como un ancla BRI. Las tripulaciones de construcción se movilizan; las inundaciones de capital en Attica; una fábrica civil adicional aumenta en la región capital, ya que la inversión china subscribe la industria griega."
 greece.540.a: "Grecia es el término europeo del Franja y la Ruta."
 greece.541.t: "Beijing declina el papel del ancla"
 greece.541.d: "Beijing declina la designación formal del ancla, juzgando la volatilidad política griega demasiado alta para comprometerse a esta escala. Atenas debe demostrar una alineación más firme antes de que la oferta sea renovada."
 greece.541.a: "Los términos deben ser revisados."
 greece.542.t: "Extensión griega a Teherán"
 greece.542.d: "Un enviado griego en Teherán propone un marco comercial y de trueque fuera del SWIFT, diseñado para eludir las sanciones occidentales y abrir mercados iraníes a los exportadores griegos. El Consejo Supremo de Seguridad Nacional debate la oferta."
 greece.542.a: "Un compañero de bienvenida de Europa. Aceptar."
 greece.542.b: "Atenas habla por Occidente. Declin."
 greece.543.t: "Teherán acepta el marco"
 greece.543.d: "Teherán está de acuerdo. El barter clearinghouse está establecido en Atenas, y los exportadores griegos obtienen acceso preferencial a mercados iraníes. Las capitales occidentales no se divierten."
 greece.543.a: "La primera entrada europea en el sistema iraní."
 greece.544.t: "Tehran Declines"
 greece.544.d: "Teherán declina. Grecia, observa el Ministro de Relaciones Exteriores iraní, sigue siendo un estado de la OTAN y cualquier marco sería vulnerable a las sanciones secundarias estadounidenses en el momento en que se activó."
 greece.544.a: "Demostrar la independencia primero."
 greece.545.t: "Propuesta del Corredor de Med griego"
 greece.545.d: "Atenas propone el Corredor Mediterráneo Oriental: la cruda iraní y el GNL viajó a través de intermediarios de terceros países a terminales griegas, luego hacia Europa. El lado iraní pesa el revés contra la represalia estadounidense."
 greece.545.a: "El corredor es un premio estratégico. Aceptar."
 greece.545.b: "La exposición es demasiado grande. Declin."
 greece.546.t: "Teherán adora el Corredor"
 greece.546.d: "Teherán respalda el corredor. El crudo iraní comienza a llegar a los puertos griegos; la capacidad de refinación se expande por toda Attica y Boeotia. Grecia se convierte en un chokepoint de energía mediterránea, y Teherán un beneficiario tranquilo."
 greece.546.a: "El Corredor de Energía del Mediterráneo Oriental está abierto."
 greece.547.t: "Teherán declina el corredor"
 greece.547.d: "Teherán disminuye, citando la contrapresión estadounidense en estados intermediarios. El pasillo está recortado; ambas capitales lo revisarán cuando las condiciones lo permitan."
 greece.547.a: "Espera un momento mejor."
 greece.548.t: "Atenas convoca el Consejo ortodoxo"
 greece.548.d: "Atenas propone una consulta política permanente entre los estados ortodoxos de Europa: Serbia, Chipre, Armenia y más allá. La diplomacia patriarcal se ofrece como cobertura; la artesanía estatal es la verdadera intención."
 greece.548.a: "Una hermandad excesiva. Aceptar."
 greece.548.b: "Los riesgos superan las ganancias. Declin."
 greece.549.t: "Belgrado hace suyo el Consejo"
 greece.549.d: "Belgrado apoya la propuesta, y Nicosia sigue. El Consejo ortodoxo se reúne en Atenas con ministros de relaciones exteriores griegos, serbios y chipriotas. Se ha formado un bloque discreto pero inconfundible."
 greece.549.a: "Nace un bloque ortodoxo."
 greece.550.t: "Belgrade Declines"
 greece.550.d: "Belgrado declina, citando preocupaciones acerca de provocar Bruselas y complicar la adhesión a la UE serbia. El proyecto ortodoxo se retrasa, no está muerto."
 greece.550.a: "Paciencia. Llegará el momento."
 greece.551.t: "Propuesta compacta de seguridad griega"
 greece.551.d: "Atenas propone formalizar el bloque ortodoxo en un pacto de defensa: entrenamiento compartido, inteligencia mancomunada y consulta política permanente. Belgrado pesa el premio contra la inevitable reacción de Bruselas."
 greece.551.a: "El pacto nos fortalece a todos. Aceptar."
 greece.551.b: "Belgrado no puede arriesgarse. Declin."
 greece.552.t: "Pacto de Defensa Ortodoxa firmado"
 greece.552.d: "Belgrado, Nicosia y Yerevan se unen a Atenas para formalizar el Pacto de Defensa Ortodoxa. Los ejercicios conjuntos comienzan; los canales de inteligencia abren; un polo europeo discreto ha aparecido en el mapa."
 greece.552.a: "Se establece una arquitectura de seguridad ortodoxa."
 greece.553.t: "Belgrado declina el Pacto"
 greece.553.d: "Belgrado declina el pacto formal, juzgando el costo diplomático demasiado alto mientras las negociaciones de adhesión de la UE están activas. El bloque ortodoxo sigue siendo, pero informal."
 greece.553.a: "Presiona por otros medios."
 greece.554.t: "Welcome to BRICS+"
 greece.554.d: "Los líderes de BRICS+ dan la bienvenida formalmente a Grecia como el primer miembro europeo de la alianza. Los enviados rusos, chinos, indios e iraníes llegan a Atenas para la ceremonia de adhesión. El capítulo Atlántico está cerrado."
 greece.554.a: "Atenas está en la mesa multipolar."
 greece.555.t: "Grecia ancla el mundo multipolar"
 greece.555.d: "Grecia ha renunciado formalmente a la alianza atlántica y a la Unión Europea, declarando un ancla del nuevo orden multipolar. La república mediterránea de tres continentes ha sido proclamada desde Atenas. El mundo se reorganiza en consecuencia."
 greece.555.a: "El futuro helénico ha comenzado."
 greece.555.b: "Occidente ha perdido su flanco mediterráneo."
 greece.555.c: "Ha surgido un nuevo polo. Tenga cuidado."
 CYP_seek_greek_union: "Buscar la unión con Grecia"
 CYP_seek_greek_union_desc: "La República de Chipre lleva a cabo iniciativas diplomáticas oficiales para fortalecer los vínculos con Grecia, construyendo una eventual unión política."
 CYP_appeal_to_un: "Apelar a las Naciones Unidas"
 CYP_appeal_to_un_desc: "Chipre lleva la cuestión de la reunificación ante las Naciones Unidas, en busca de legitimidad internacional para un arreglo que sirva a la comunidad grecochipriota."
 CYP_economic_incentive_north: "Incentivos económicos para el norte"
 CYP_economic_incentive_north_desc: "Chipre extiende ofertas económicas a las comunidades turcochipriotas del norte, y demuestra que la reunificación trae beneficios tangibles para todos los habitantes de la isla."
 NCY_seek_turkish_union: "Buscar la unión con Turquía"
 NCY_seek_turkish_union_desc: "Chipre del Norte profundiza sus lazos políticos y económicos con Turquía y avanza hacia la perspectiva de una unificación formal bajo liderazgo turco."
 NCY_recognition_campaign: "Campaña internacional de reconocimiento"
 NCY_recognition_campaign_desc: "Chipre del Norte lanza una campaña diplomática para obtener un mayor reconocimiento internacional, y legitimar a su gobierno ante la comunidad de naciones."
 GRE_aegean_defense_posture: "Postura de defensa Egea"
 GRE_aegean_defense_posture_desc: "La disposición y las fuerzas desplegadas en el futuro mantienen al ejército helénico en un estado elevado de alerta. Cada interceptación, cada patrulla, cada ejercicio es una señal de que el territorio griego será defendido."
 GRE_cypriot_integration_idea: "Integración económica chipriota"
 GRE_cypriot_integration_idea_desc: "La profunda integración económica con la República de Chipre, incluida la armonización de las uniones aduaneras y bancarias, refuerza los vínculos comerciales y genera ingresos fiscales corporativos sostenidos para ambas economías."
 GRE_north_macedonian_ties: "Norte de Macedonia"
 GRE_north_macedonian_ties_desc: "Las relaciones normalizadas con Skopje tras el Acuerdo de Prespa han abierto nuevos canales diplomáticos en los Balcanes, generando buena voluntad que se traduce en apalancamiento político."
 GRE_chinese_investment: "Inversión en infraestructura china"
 GRE_chinese_investment_desc: "El capital estatal chino financia infraestructuras y proyectos de construcción industrial en toda Grecia, acelerando los programas de construcción que el presupuesto nacional no puede cubrir por sí solo."
 GRE_lng_gateway: "GNL Gateway"
 GRE_lng_gateway_desc: "Grecia se ha posicionado como el principal punto de aterrizaje de gas natural licuado en Europa, suministrando energía dependiente del oleoducto a socios regionales."
 GRE_balkan_advocate: "Defensor de la UE balcánica"
 GRE_balkan_advocate_desc: "Como el principal campeón de la UE para la adhesión a los Balcanes Occidentales, Grecia ejerce una creciente influencia sobre sus vecinos del norte."
 GRE_imec_terminus: "IMEC European Terminus"
 GRE_imec_terminus_desc: "La designación del Pireo como el punto final europeo del Corredor Económico de la India y Medio Oriente-Europa aporta importantes ingresos en tránsito e inversiones en infraestructura."
 GRE_regional_pillar: "Pilar de Europa sudoriental"
 GRE_regional_pillar_desc: "Grecia ha conseguido un papel como centro indispensable del barrio de Europa sudoriental, proyectando influencia en los canales energéticos, comerciales y diplomáticos."
 GRE_epirus_cultural_ties: "Lazos culturales epirusos"
 GRE_epirus_cultural_ties_desc: "Un marco oficial de derechos de las minorías con Tirana ha estabilizado a las comunidades griegas del sur de Albania, convirtiendo un irritante de larga data en un activo diplomático silencioso."
 GRE_italo_hellenic_axis: "Italo-Hellenic Axis"
 GRE_italo_hellenic_axis_desc: "La política industrial coordinada y los programas de astilleros compartidos con Roma han llevado a Atenas y la península italiana a un solo espacio económico mediterráneo."
 GRE_balkan_gas_transit: "Transit de gas balcánico"
 GRE_balkan_gas_transit_desc: "Las rutas de expansión del gasoducto IGB Caspio y el gas Mediterráneo oriental a través del territorio griego en los Balcanes más amplios, generando ingresos de tránsito sostenidos."
 GRE_gulf_capital_inflow: "Corriente de capital del Golfo"
 GRE_gulf_capital_inflow_desc: "Los fondos soberanos de la península árabe se han trasladado a la industria y la logística griegas, lo que ha acelerado la formación de capital en toda la economía."
 GRE_eez_delimitation: "Acuerdo de Delimitación EEZ"
 GRE_eez_delimitation_desc: "Un acuerdo bilateral de zona económica exclusiva con El Cairo da pistas claras a través del Mediterráneo oriental y un marco jurídico contra las reclamaciones marítimas rivales."
 greece.500.t: "Muerte de Stephen Saunders"
 greece.500.d: "El agregado de la defensa británica Stephen Saunders ha sido asesinado en Atenas por la organización terrorista del 17 de noviembre. El ataque descarado ha atraído la condena internacional y ha presionado enormemente a los servicios de seguridad griegos para desmantelar al grupo."
 greece.500.a: "Ataque contra el terrorismo doméstico"
 greece.500.b: "Cooperar con la inteligencia internacional"
 greece.501.t: "Juicio de la Organización Revolucionaria"
 greece.501.d: "Los miembros capturados del 17 de noviembre están siendo juzgados en Atenas. Después de décadas de evadir la justicia, el liderazgo del grupo se enfrenta a persecución por una serie de asesinatos y bombardeos. El juicio es un momento histórico para la lucha contra el terrorismo griego."
 greece.501.a: "Entregar sentencias duras"
 greece.501.b: "Utilice esto como una oportunidad para reformar los servicios de seguridad"
 greece.502.t: "Guerra contra las protestas terroristas"
 greece.502.d: "Las protestas masivas contra la guerra han estallado en toda Grecia en respuesta a la invasión de Irak. Decenas de miles han salido a las calles de Atenas y Tesalónica, reflejando una profunda oposición pública a la campaña dirigida por Estados Unidos."
 greece.502.a: "Permitir manifestaciones pacíficas"
 greece.502.b: "Restringir las protestas para mantener el orden"
 greece.503.t: "Helios Airways Vuelo 522 Crash"
 greece.503.d: "Helios Airways Vuelo 522 se ha estrellado cerca de Grammatiko después de volar en piloto automático como un vuelo fantasma, matando a los 121 pasajeros y la tripulación. La tragedia, causada por la falta de presurización de la cabina, ha planteado serias preguntas sobre la vigilancia de la seguridad aérea en Grecia."
 greece.503.a: "Reformas de la seguridad aérea"
 greece.503.b: "Tener un día nacional de luto"
 greece.504.t: "Las protestas kurdas en Atenas"
 greece.504.d: "Los miembros de la diáspora kurda en Atenas han organizado grandes manifestaciones en apoyo de los derechos curdos. Las protestas han señalado la atención de Ankara, que considera cualquier apoyo al activismo kurdo en el extranjero con sospecha."
 greece.504.a: "Permitir que las protestas continúen"
 greece.504.b: "Dispersión de las multitudes"
 greece.505.t: "Protesta la crisis de Gaza"
 greece.505.d: "Las manifestaciones pro-palestinas han surgido en las ciudades griegas en respuesta a la creciente crisis de Gaza. Los manifestantes piden al gobierno que tome una postura más fuerte contra las operaciones militares y proporcione ayuda humanitaria."
 greece.505.a: "Solidaridad expresa con los manifestantes"
 greece.505.b: "Instar a la moderación y las soluciones diplomáticas"
 greece.506.t: "2007 Griego Bosque Fuegos"
 greece.506.d: "Devastantes incendios han barrido a través de la Peloponesa y Euboea, matando docenas y destruyendo aldeas enteras. Los incendios han expuesto debilidades críticas en las capacidades de respuesta ante desastres de Grecia y suscitaron enojo público por el manejo de la crisis por parte del gobierno."
 greece.506.a: "Movilizar recursos de emergencia"
 greece.506.b: "Solicitud de asistencia internacional"
 greece.507.t: "Alexandros Grigoropoulos Muerte"
 greece.507.d: "Alexandros Grigoropoulos, de 15 años, ha sido asesinado por un agente de policía en el distrito de Exarchia de Atenas. El tiroteo ha desencadenado los peores disturbios que Grecia ha visto en décadas, con una destrucción generalizada en las principales ciudades."
 greece.507.a: "Procesar a los funcionarios responsables"
 greece.507.b: "Despliegue la policía antidisturbios para restablecer el orden"
 greece.508.t: "2009 Griego Forest Fires"
 greece.508.d: "Otra devastadora temporada de incendios ha golpeado a Grecia, devastando bosques y amenazando asentamientos en toda Attica y el este de Peloponés. A pesar de las lecciones de 2007, la infraestructura de lucha contra incendios del país sigue siendo escasa."
 greece.508.a: "Invertir en la infraestructura de prevención del incendio"
 greece.508.b: "Enfoque alivio a las comunidades afectadas"
 greece.509.t: "Amanecer Dorado entra en el Parlamento"
 greece.509.d: "El partido Golden Dawn de extrema derecha ha ganado escaños parlamentarios por primera vez, capitalizando en la furia pública sobre la austeridad y la crisis económica. Su retórica abiertamente nacionalista y violenta ha alarmado a las instituciones democráticas de toda Europa."
 greece.509.a: "Supervisar sus actividades de cerca"
 greece.509.b: "Ignóralos como un movimiento de fringe"
 greece.510.t: "Formas del Partido de la Solución griega"
 greece.510.d: "El presentador de televisión Kyriakos Velopoulos ha fundado el partido griego Solution, situándolo como una alternativa conservadora-nacionalista. El partido apela a los votantes desilusionados con el derecho tradicional y la franja de extrema derecha."
 greece.510.a: "Reconocer el nuevo paisaje político"
 greece.510.b: "Destituirlos como populistas"
 greece.511.t: "Muerte de Pavlos Fyssas"
 greece.511.d: "El rapero antifascista Pavlos Fyssas ha sido apuñalado hasta la muerte por un miembro de Golden Dawn en Keratsini. El asesinato ha provocado indignación nacional e intensificado los llamamientos para que el gobierno tome medidas decisivas contra la red violenta del partido."
 greece.511.a: "Arruina en el Amanecer de Oro"
 greece.511.b: "Llamada a la calma y el debido proceso"
 greece.512.t: "Juicio de los miembros del Amanecer Dorado"
 greece.512.d: "El liderazgo del Amanecer Dorado es un juicio en lo que se ha convertido en el caso criminal más grande contra un partido político en la historia europea. Los cargos incluyen dirigir una organización criminal, asesinato y múltiples ataques contra inmigrantes y opositores políticos."
 greece.512.a: "Empujar para oraciones máximas"
 greece.512.b: "Que la justicia tome su curso"
 greece.513.t: "El mayor terremoto de Egeo"
 greece.513.d: "Un poderoso terremoto ha golpeado al Egeo oriental cerca de Lesbos, causando daños y bajas importantes. Turquía también se ha visto afectada, abriendo una rara ventana para la cooperación bilateral sobre el alivio de desastres entre los dos vecinos."
 greece.513.a: "Lanzamiento de un esfuerzo nacional de socorro"
 greece.513.b: "Cooperar con Turquía en materia de socorro"
 greece.514.t: "2018 Attica Wildfires"
 greece.514.d: "Los incendios catastróficos han barrido por la Attica oriental, matando a más de cien personas en el pueblo costero de Mati. Es el desastre más mortal del fuego salvaje en la historia griega, exponiendo fallas sistémicas en la planificación de emergencia y protección civil."
 greece.514.a: "Reforma de los sistemas de protección civil"
 greece.514.b: "Prestar asistencia inmediata a las víctimas"
 greece.515.t: "Otro terremoto ateniense"
 greece.515.d: "Un terremoto ha golpeado cerca de Atenas, dañando edificios y causando una alarma generalizada en la capital. Si bien las bajas son limitadas, el evento ha renovado el debate sobre la resiliencia sísmica de la infraestructura del envejecimiento de Grecia."
 greece.515.a: "Fortalecer los códigos de construcción"
 greece.515.b: "Proporcionar socorro de emergencia"
 greece.517.t: "El mayor terremoto de Egeo"
 greece.517.d: "Un poderoso terremoto ha golpeado al Egeo oriental cerca de Lesbos, causando daños y bajas importantes. Turquía también se ha visto afectada, abriendo una rara ventana para la cooperación bilateral sobre el alivio de desastres entre los dos vecinos."
 greece.517.a: "Movilización de los esfuerzos de socorro"
 greece.518.t: "2018 Attica Wildfires"
 greece.518.d: "Los incendios catastróficos han barrido por la Attica oriental, matando a más de cien personas en el pueblo costero de Mati. Es el desastre más mortal del fuego salvaje en la historia griega, exponiendo fallas sistémicas en la planificación de emergencia y protección civil."
 greece.518.a: "Inicio de la respuesta de emergencia"
 greece.519.t: "Otro terremoto ateniense"
 greece.519.d: "Un terremoto ha golpeado cerca de Atenas, dañando edificios y causando una alarma generalizada en la capital. Si bien las bajas son limitadas, el evento ha renovado el debate sobre la resiliencia sísmica de la infraestructura del envejecimiento de Grecia."
 greece.519.a: "Servicios de emergencia coordinados"
 greece.620.t: "Una cuestión de la Unión"
 greece.620.d: "Atenas ha invitado formalmente a la República de Chipre a completar la confederación y reunirse con el estado helénico. La decisión recae en Nicosia."
 greece.620.a: "Únete a la unión helénica"
 greece.620.b: "Mantener una república independiente"
 greece.621.t: "La cuestión del norte"
 greece.621.d: "La propuesta griega se extiende al norte de la isla. La reunificación bajo Atenas disolvería la administración del norte separada y colocaría su territorio dentro del estado helénico."
 greece.621.a: "Aceptar la reunificación"
 greece.621.b: "Rechazar la propuesta"
 greece.630.t: "Un placer de Atenas"
 greece.630.d: "Grecia ha pedido a Turquía que ayude a aliviar la crisis de la vivienda que agota sus ciudades. La cooperación aliviaría la carga sobre Atenas y marcaría un raro momento de buena voluntad entre los dos vecinos."
 greece.630.a: "Apoyo ampliado"
 greece.630.b: "Declin to intervene"
 greece.631.t: "Asistencia turca llega"
 greece.631.d: "La ayuda y el apoyo a la construcción turcas han comenzado a fluir en Grecia, lo que ha agravado la escasez de viviendas y suavizar las relaciones en todo el Egeo."
 greece.631.a: "Una mano de bienvenida"
 greece.632.t: "No Ayuda desde Ankara"
 greece.632.d: "Turquía se ha negado a involucrarse en los problemas de vivienda de Grecia. Atenas debe manejar la crisis solo."
 greece.632.a: "Nos quedamos solos."
 greece.641.t: "Una temporada de grabación"
 greece.641.d: "El verano rompió todos los registros de llegada. Los hoteles están llenos, los aeropuertos estan agitando, y los recibos están entrando. La pregunta es quién se beneficia de la caída del viento."
 greece.641.a: "Reinversión en las islas"
 greece.641.b: "Deja que los operadores lo mantengan"
 greece.642.t: "Respuestas de la Diáspora"
 greece.642.d: "El llamamiento a los griegos en el extranjero ha alcanzado un acorde. Las promesas de inversión y las remesas fluyen de comunidades de todo el mundo, deseosas de que se recupere la patria."
 greece.642.a: "Inicie un fondo soberano de la diáspora"
 greece.642.b: "Remesas coincidentes con el alivio fiscal"
 greece.643.t: "Bruselas abre los toques"
 greece.643.d: "Se ha aprobado el primer tramo de financiación para la recuperación. Decenas de miles de millones están en camino, condicionadas a las reformas y a la capacidad de Grecia para gastar realmente el dinero a tiempo."
 greece.643.a: "Carga frontal de los proyectos"
 greece.643.b: "Pasarlo con cuidado."
 greece.650.t: "La Doctrina Multi-Vector"
 greece.650.d: "Atenas ha declarado que tratará tanto con Oriente y Occidente, en sus propios términos. El gabinete debate lo mejor para convertir esta independencia en apalancamiento."
 greece.650.a: "Diversificar nuestra energía y nuestros socios comerciales"
 greece.650.b: "Posición de Grecia como mediador regional"
 greece_military.01.t: "Se formaron sistemas de defensa helénica"
 greece_military.01.d: "Pyrkal y la industria de armas helénicas se han fusionado en una sola empresa controlada por el Estado, Hellenic Defence Systems. La consolidación tiene por objeto simplificar la adquisición, estandarizar la producción y reconstruir la capacidad industrial de defensa nacional bajo una estructura de gestión."
 greece_military.01.a: "Nace un campeón nacional"
 greece_military.02.t: "La Marina griega reta nuestras aguas"
 greece_military.02.d: "Grecia ha completado su estrategia de aguas soberanas y ahora está abiertamente en juego su reclamación por las aguas egeas y cretanas disputadas. Su expansión naval es un desafío directo a nuestra posición en el Mediterráneo oriental."
 greece_military.02.a: "Ampliar la Flota"
 greece_military.02.b: "Una protesta diplomática"
 greece.516.t: "Movimiento Nacionalista Gains Traction"
 greece.516.d: "Los nacionalistas del ELAM apoyados por Grecia han estado difundiendo su influencia en nuestra isla. Su retórica llama a la unión con Grecia y ha encontrado un público receptivo entre partes de la población. Podemos tolerar su presencia o descifrarnos a costa del malestar público."
 greece.516.a: "Que operen."
 greece.516.b: "Suprimir el movimiento"
 greece_debt.1.t: "El socio de la deuda"
 greece_debt.1.desc: "Las facturas siguen llegando y el tesoro sigue disminuyendo. Nuestro ministro de Finanzas ha propuesto cambiar porciones de nuestra deuda en euros en monedas extranjeras a través del banco central de una nación asociada. El nuevo titular cobraría intereses, pero a tasas negociables y en términos más amistosos que nuestros acreedores actuales. India, Rusia, China o el BCE podrían servir como socio, pero cada uno viene con su propio precio político."
 greece_debt.1.a: "Tal vez el Rupee"
 greece_debt.1.b: "Tal vez el Rouble"
 greece_debt.1.c: "El Yuan podría ser una buena elección"
 greece_debt.1.e: "Quédese en el curso"
 GRE_debt_swap_accept_tt: "§GSi aceptan:§! compran una parte de nuestra deuda, convirtiéndose en acreedores a los que debemos interesarnos, reduciendo nuestro balance ahora a cambio de pagos constantes más adelante."
 GRE_debt_counter_refund_tt: "Declinamos la contraoferta. El capital que el acreedor avanzado sería reembolsado en su totalidad."
 greece_debt.2.a: "Debemos declinar."
 greece_debt.2.b: "Vamos a asumir su deuda"
 GRE_homelessness_crisis_idea: "La crisis ateniense de Homelessness"
 GRE_homelessness_crisis_idea_desc: "El terremoto de Atenas dejó miles de personas sin hogar y durmiendo en parques. Los servicios sociales están abrumados, y las ciudades de tiendas se extienden por toda la capital. Cuanto más esperemos a actuar, peor será."
 GRE_the_drachma_idea: "El Drachma"
 GRE_the_drachma_idea_desc: "Operando fuera de la eurozona significa que manejamos el drachma por nuestra cuenta. La inestabilidad monetaria y el aumento de los costos de préstamo arrastran a la economía, pero un drachma más débil mantiene las exportaciones griegas competitivas y eleva los ingresos en los mercados internacionales."
 GRE_solving_tax_evasion_idea: "Resolver los vacíos fiscales"
 GRE_solving_tax_evasion_idea_desc: "Resolver las lagunas fiscales nos permitirá eliminar las brechas, pero requerirá un gran número de comités y reevaluación de nuestro código tributario nacional."
 GRE_tax_evasion_idea: "Evasión fiscal sin restricciones"
 GRE_tax_evasion_idea_desc: "La evasión fiscal está profundamente arraigada en la vida fiscal griega y drena los ingresos del gobierno. Sin el dinero para financiar servicios básicos y reformas, el estado está atascado."
 GRE_bonds_issued_idea: "Bonos a corto plazo de alto rango"
 GRE_bonds_issued_idea_desc: "Hemos emitido bonos a corto plazo a altas tasas de interés. La inyección de efectivo es útil ahora mismo, pero los altos rendimientos serán una carga hasta que la deuda madure."
