 GRE_integrate_sovereign_bases: "Integrar las Áreas de Bases Soberanas"
 GRE_integrate_sovereign_bases_desc: "Akrotiri y Dhekelia llegaron a nosotros como suelo ocupado, no como suelo griego. Ganarnos a la población local y asentar la administración nos permitirá reclamar las bases como parte plena y permanente de la República Helénica."
