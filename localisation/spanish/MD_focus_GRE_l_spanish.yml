 GRE_rheinmetall_fire_control: "Control de fuego electro-optical"
 GRE_rheinmetall_hunter_killer: "Modo de compromiso Hunter-Killer"
 GRE_rheinmetall_ammo_logistics: "Logística de municiones estandarizadas"
 GRE_rheinmetall_battlefield_networking: "Integración de gestión de campos de batalla"
 GRE_rheinmetall_lethality_export_package: "Paquete de armas de exportación"
 GRE_rheinmetall_hellenic_lynx_doctrine: "Doctrina de combate helénico Lynx"
 GRE_vision_2030: "Visión militar"
 GRE_vision_2030_desc: "Nuestras fuerzas armadas han caído tras años de austeridad y anticuado pensamiento de la Guerra Fría. Tenemos equipos de envejecimiento, estructuras hinchadas y un ejército que no refleja las amenazas que enfrentamos. Este plan es la reforma de defensa más ambiciosa en la historia griega moderna."
 GRE_armored_transition: "Blindaje Transición"
 GRE_armored_transition_desc: "El BMP-1 y el M48 Patton han cumplido su tiempo. Retirar nuestra armadura de Guerra Fría y pasar al Leopard 2 en su variante helénica dará a nuestras brigadas blindadas una fuerza de tanque que puede igualar a cualquiera en la región."
 GRE_pzh_2000: "PzH 2000 Howitzers"
 GRE_pzh_2000_desc: "Nuestra artillería necesita mantenerse al día con la guerra armada moderna. El propulsor autopropulsado PzH 2000 daría a nuestras fuerzas fuego de precisión en rango y asegurar que nuestros comandantes terrestres siempre tengan un apoyo indirecto eficaz contra incendios."
 GRE_m270_mlrs: "M270 MLRS"
 GRE_m270_mlrs_desc: "Cubrir los aterrizajes de la isla y golpear objetivos costeros en todo el Egeo requiere potencia de fuego que va más allá de la línea delantera. El sistema de lanzamiento múltiple M270 daría a nuestro ejército ese tipo de alcance."
 GRE_puls_rocket: "Sistema de cohetes PULS"
 GRE_puls_rocket_desc: "A través del programa conjunto EURO-PULS con Israel y nuestros socios europeos, podemos poner en marcha un sistema de artillería de cohetes de precisión capaz de alcanzar objetivos a largo plazo. Esto haría que cualquier adversario en el Egeo piense dos veces."
 GRE_special_warfare_command: "Comando especial de guerra"
 GRE_special_warfare_command_desc: "Unificar nuestras unidades EKAM, brigadas de asalto, buzos de combate y paracaidistas bajo un único Comando Especial de Guerra nos daría una fuerza de élite que puede operar a través de nuestras islas y más allá. En la guerra moderna, unidades pequeñas y letales pueden decidir los resultados que las divisiones enteras no pueden."
 GRE_archipelagos_strategy: "Estrategia de los archipiélagos"
 GRE_archipelagos_strategy_desc: "Nuestros miles de islas no son una responsabilidad. Con la defensa adecuada y una doctrina coherente, se convierten en una barrera capa que ninguna flota enemiga puede cruzar sin tomar grandes pérdidas. Deberíamos utilizar la geografía del Egeo a nuestra ventaja."
 GRE_f16_modernisation: "F-16 Modernisation"
 GRE_f16_modernisation_desc: "Actualizar 83 de nuestros F-16s al estándar Bloque 70/72 Viper a través de la Industria Aeroespacial Helénica mantendría nuestra flota de luchadores en buena forma, mientras que también construir la experiencia doméstica que necesitamos para el futuro mantenimiento F-35."
 GRE_intl_flight_training: "Centro internacional de entrenamiento de vuelo"
 GRE_intl_flight_training_desc: "Abrir nuestras instalaciones de entrenamiento de vuelo a naciones aliadas construiría buena voluntad, profundizaría los lazos militares y daría a nuestros propios pilotos experiencia en el entrenamiento contra estándares internacionales."
 GRE_new_transport_helicopters: "Nuevos helicópteros de transporte"
 GRE_new_transport_helicopters_desc: "El transporte rápido entre nuestras islas es esencial para la defensa de las islas. Fielding 35 UH-60M Black Hawks junto a nuestro MH-60R Seahawks nos daría la capacidad de elevación para reforzar cualquier posición amenazada antes de que el enemigo pueda cavar."
 GRE_f35_program: "F-35 Program Collaboration"
 GRE_f35_program_desc: "Unirnos al programa F-35 nos da un luchador de quinta generación que nadie en la región puede igualar. El contrato firmado en julio de 2024 es un hito importante para la Fuerza Aérea Helénica y pone a nuestros pilotos por delante de cualquier otra persona en el Egeo."
 GRE_patriot_air_defense: "Sistemas de defensa antiaérea Patriot"
 GRE_patriot_air_defense_desc: "Nuestras baterías Nike Hercules son demasiado viejas para hacer frente a amenazas modernas. La actualización al Patriot PAC-3 con interceptores MSE finalmente daría a Grecia una defensa real contra misiles balísticos y protegería nuestra infraestructura crítica."
 GRE_centauros_anti_drone: "Centauros Sistema Anti-Drone"
 GRE_centauros_anti_drone_desc: "El sistema Centauros C-UAS fue desarrollado por la industria aeroespacial helénica y probada en operaciones del Mar Rojo. Despliegarlo a través de nuestras islas, bases navales y aeródromos es una prioridad. Los Drones son la mayor amenaza en la guerra moderna y necesitamos ser capaces de contrarrestarlos."
 GRE_achilles_shield: "Escudo de Aquiles"
 GRE_achilles_shield_desc: "Integrar nuestras baterías Patriot, defensas de drones Centauros y sistemas de misiles costeros en una red unificada que cubre todo el Egeo crearía una zona antiacceso que hace que cualquier ataque en territorio griego sea extremadamente costoso."
 GRE_kimon_class_frigate: "Frigata de clase Kimon"
 GRE_kimon_class_frigate_desc: "Después de años de programas cancelados, finalmente hemos firmado con Naval Group por tres fragatas HN IED con una opción para un cuarto. La clase Kimon le dará a la Armada Helénica un adecuado combatiente de superficie que puede soportar cualquier flota en la región."
 GRE_hydra_class_upgrade: "Modernización de clase Hydra"
 GRE_hydra_class_upgrade_desc: "Las fragatas de clase Hydra son buques MEKO 200HN construidos en Skaramangas en el decenio de 1990 y forman la columna vertebral de nuestra fuerza combatiente superficial. Una mejora de la vida media a sus radares, suites de guerra electrónicas y misiles antiaéreos les mantendría eficaces en el combate durante décadas."
 GRE_elli_class: "Programa de sustitución de clase Elli"
 GRE_elli_class_desc: "Las fragatas de clase Elli son viejas embarcaciones de clase holandesa Van Speijk transferidas a nosotros en los años 80 y han superado su vida útil. Necesitamos cascos de reemplazo, ya sea construidos internamente en Skaramangas o adquiridos desde el extranjero, para restaurar nuestra fuerza de fragata."
 GRE_roussen_attack_craft: "Clase Roussen Ataque rápido Artesanía"
 GRE_roussen_attack_craft_desc: "El Egeo no es un océano abierto, es aguas estrechas perfectas para el ataque rápido de la artesanía. La clase Roussen se construye exactamente para esto: rápido, con armas de misiles y letal a corta distancia. Una nueva generación de estas naves podría negar a cualquier flota hostil el acceso a las aguas griegas."
 GRE_fremm_frigate: "Fragatas multifuncionales FREMM"
 GRE_fremm_frigate_desc: "Nuestra flota necesita más barcos. Podemos adquirir fragatas de FREMM italianas probadas rápidamente o invertir en una quinta IED del Grupo Naval. Cada opción tiene diferentes ventajas en términos de velocidad, capacidad y relaciones de alianza."
 GRE_submarine_expansion: "Tipo 214 Programa de Adquisiciones"
 GRE_submarine_expansion_desc: "La clase Papanikolis representa lo mejor en la guerra submarina convencional. La propulsión dependiente del aire permite que nuestros barcos permanezcan bajo el agua durante semanas sin surfacing. Ampliar y sostener este programa fortalecería nuestro control del dominio submarino del Egeo."
 GRE_bluewhale_submarines: "Submarinos BlueWhale"
 GRE_bluewhale_submarines_desc: "Los submarinos autónomos no tripulados del Aeroespacial israelí añadirían una capacidad que nadie en la región puede igualar. Estos sistemas funcionan sin tripulación y sin riesgo, dando a nuestra marina una presencia submarina persistente."
 GRE_defense_manufacturing: "Mandato de fabricación local"
 GRE_defense_manufacturing_desc: "Un requisito de contenido local del 25% para todos los principales programas de defensa aseguraría que nuestra industria nacional se beneficie de cada contrato. EAS, HAI y nuestros astilleros crecerían más fuertes y reduciríamos nuestra dependencia de proveedores extranjeros."
 GRE_research_hubs: "Centros de investigación"
 GRE_research_hubs_desc: "La colaboración formal entre nuestras universidades, la industria aeroespacial helénica y el Ministerio de Defensa crearía un oleoducto de innovación para las fuerzas armadas."
 GRE_defense_innovation_center: "Centro de innovación de defensa helénica"
 GRE_defense_innovation_center_desc: "Un centro de innovación dedicado que conecta startups, universidades y socios de la industria de defensa ayudaría a acelerar el desarrollo de la tecnología militar de próxima generación en Grecia."
 GRE_communication_satellites: "Satélites de comunicación"
 GRE_communication_satellites_desc: "Los satélites de comunicaciones militares dedicados nos darían una cobertura general persistente del Egeo y una columna vertebral segura para todas las ramas de las fuerzas armadas."
 GRE_theon_international: "Expansión internacional de Theon"
 GRE_theon_international_desc: "Theon International tiene una fuerte reputación global por la visión nocturna y los sistemas ópticos. Apoyar su expansión en nuevos mercados de exportación generaría ingresos y crearía relaciones de defensa al tiempo que demostraba que la industria griega podía competir al más alto nivel."
 GRE_industrial_synergy: "Sinergía industrial"
 GRE_industrial_synergy_desc: "Nuestros programas de defensa funcionan mejor cuando nuestras industrias cooperan. La coordinación formal entre HAI, nuestros astilleros, EAS y nuestras instituciones de investigación haría que cada programa fuera más rápido, más barato y más capaz."
 GRE_irix_loitering: "Municiones de Loitering IRIX"
 GRE_irix_loitering_desc: "Hellenic Defence Systems se ha asociado con Industrias Paramount para producir el IRIX, la primera munición vagabunda hecha en Grecia. Con una gama de hasta 100 kilómetros, da a nuestras fuerzas una capacidad de huelga de precisión que puede llegar a un territorio enemigo sin depender de proveedores extranjeros."
 GRE_lora_ballistic: "LORA Sistema de misiles balísticos"
 GRE_lora_ballistic_desc: "El sistema de misiles balísticos LORA de Israel Aerospace Industries nos daría una capacidad de huelga de precisión de largo alcance con un rango de 400 kilómetros. Ese tipo de alcance cambia significativamente el equilibrio en el Egeo y da a cualquier adversario potencial algo serio que pensar."
 GRE_iniochos: "Programa de Ejercicio de Iniochos"
 GRE_iniochos_desc: "El ejercicio anual de Iniochos en Andravida se ha convertido en uno de los mejores eventos multinacionales de entrenamiento aéreo europeos. Ampliar la participación y hacer más complejos los escenarios agudizará nuestros pilotos y fortalecerá nuestras relaciones militares con naciones aliadas."
 GRE_grypas_ucav: "Programa Grypas UCAV"
 GRE_grypas_ucav_desc: "La industria aeroespacial helénica ha desarrollado el Grypas, nuestro primer drone de combate diseñado domésticamente. Invertir en este programa significa que tenemos una capacidad de huelga no tripulada que no depende de restricciones a la exportación extranjera o condiciones políticas."
 GRE_integrated_air_defense: "Red integrada de defensa aérea"
 GRE_integrated_air_defense_desc: "Titular las baterías Patriot, el escudo de misiles Achilles, los sistemas antidrone y nuestra cobertura de radar en una sola red capa da a Grecia un cielo que ningún avión hostil o drone puede cruzar sin respuesta. Cada sensor y cada interceptor ahora lucha como un sistema."
 GRE_strategic_transport_fleet: "Flota de transporte estratégico"
 GRE_strategic_transport_fleet_desc: "Nuestra defensa de la isla es tan buena como nuestra capacidad para reabastecerla y reforzarla. La modernización de nuestra flota C-27J y la adquisición de transportes adicionales de C-130H se asegurarían de que ninguna guarnición no fuera apoyada y ninguna isla queda aislada en una crisis."
 GRE_constellation_co_production: "Clase de Constelación Co-producción"
 GRE_constellation_co_production_desc: "Junto con los Estados Unidos hemos comenzado a planificar la coproducción de la fragata de clase FFG-62 Constellation. Esta asociación añade naves de guerra de clase mundial a nuestra flota y desarrolla la experiencia y capacidad de nuestros astilleros en Skaramangas y Elefsina."
 GRE_eyes_of_poseidon: "Ojos de Poseidon"
 GRE_eyes_of_poseidon_desc: "No podemos defender lo que no podemos ver. La integración de las patrullas marítimas, las estaciones costeras de radar y las imágenes satelitales en una red unificada de vigilancia nos daría plena conciencia del mar Egeo e Ioniano."
 GRE_souda_bay_expansion: "Expansión de la Base Naval de Souda Bay"
 GRE_souda_bay_expansion_desc: "Souda Bay es uno de los puertos más estratégicomente valiosos del Mediterráneo. Ampliar nuestra cooperación con Estados Unidos y la OTAN en esta instalación fortalecería nuestras alianzas y consolidaría el papel de Grecia como un ancla clave en el flanco sur de la OTAN."
 GRE_alexandroupolis_strategic_hub: "Centro estratégico de Alexandroupolis"
 GRE_alexandroupolis_strategic_hub_desc: "El puerto de Alexandroupolis se ha convertido en un corredor logístico vital de la OTAN a Europa del Este, superando completamente el Bosphorus. Invertir en su infraestructura y trabajar más estrechamente con Bulgaria y Rumania lo convertiría en un activo estratégico permanente."
 GRE_spike_atgm_integration: "La integración de Spike ATGM"
 GRE_spike_atgm_integration_desc: "Nuestros vehículos de infantería y blindados necesitan un misil guiado antitanque moderno que pueda alcanzar objetivos más allá de la línea de visión. Integrar la familia de misiles Spike a través de nuestras fuerzas terrestres y los buques de patrulla naval daría a cada comandante una opción de huelga de precisión."
 GRE_stinger_manpads: "Modernización de MANPADS"
 GRE_stinger_manpads_desc: "Nuestras guarniciones de la isla y unidades delanteras enfrentan amenazas aéreas que las grandes baterías de defensa antiaérea no pueden cubrir económicamente. La modernización y ampliación de nuestro inventario Stinger MANPADS daría a cada unidad de infantería y nave patrulla una capacidad orgánica de defensa del aire."
 GRE_infantry_digitisation: "Programa de digitización de infantería"
 GRE_infantry_digitisation_desc: "Los soldados modernos deben compartir la misma imagen operacional que el piloto de arriba y la fragata offshore. Equipar nuestra infantería con sistemas de gestión de campos de batalla, comunicaciones encriptadas y equipos de segmentación digital los conectaría a la red más grande en lugar de dejarlos operando aisladamente."
 GRE_sovereign_waters: "Soberana Aguas"
 GRE_sovereign_waters_desc: "Durante décadas otros han desafiado nuestros derechos soberanos en el Mediterráneo Egeo y Oriental y no tuvimos la marina para hacer mucho al respecto. Con una flota modernizada y defensas isleñas adecuadas, ahora podemos afirmar lo que el derecho internacional siempre nos ha concedido. Nuestra zona económica exclusiva es nuestra."
 GRE_rheinmetall_greece: "Rheinmetall in Greece"
 GRE_rheinmetall_greece_desc: "Rheinmetall quiere establecer asamblea local y mantenimiento en Grecia como parte de futuras ofertas de adquisiciones. Formalizar esta asociación e integrar su producción en nuestra industria de defensa nacional fortalecería la modernización de nuestras fuerzas terrestres y convertiría a Grecia en un centro de fabricación de defensa en el sureste de Europa."
 GRE_joint_operations_reform: "Reforma de Operaciones Conjuntas"
 GRE_joint_operations_reform_desc: "Nuestras tres ramas han pasado décadas operando por separado con sus propias doctrinas y culturas de mando. Es esencial un marco de operaciones conjuntas unificado que haga que el ejército, la marina y la fuerza aérea planteen, entrenen y peleen juntos. Todo lo que queremos hacer depende de esto."
 GRE_new_army_doctrine: "De la misa a la maniobra"
 GRE_new_army_doctrine_desc: "El Ejército Helénico fue construido para mantener una línea en Thrace con tantos hombres como sea posible. Esa guerra nunca llegó. Necesitamos reestructurar alrededor de grupos de brigada más pequeños y rápidos que puedan desplegarse en el Egeo rápidamente y responder a las amenazas antes de convertirse en crisis."
 GRE_nco_reform: "La columna vertebral del ejército"
 GRE_nco_reform_desc: "Siempre se ha esperado que los oficiales griegos tomen todas las decisiones a nivel de pelotón porque nunca se les dio autoridad ni formación para actuar por su cuenta. Construir un cuerpo profesional de la NCO que pueda liderar y adaptarse sin esperar órdenes anteriores haría que el ejército fuera mucho más eficaz."
 GRE_thrace_to_aegean: "Reorientación al Ejército"
 GRE_thrace_to_aegean_desc: "Durante cuarenta años nuestras fuerzas terrestres se enfrentaron al noreste hacia el río Evros. Esa amenaza no ha desaparecido, pero ya no es nuestra única preocupación. Debemos reorientar nuestro despliegue primario hacia las islas y costas del Egeo, donde la soberanía se prueba todos los días."
 GRE_joint_fires_doctrine: "Escuela de Armas combinadas"
 GRE_joint_fires_doctrine_desc: "La artillería, la armadura, la infantería y el apoyo aéreo cercano han operado en silos separados durante demasiado tiempo. La guerra combinada de armas debe convertirse en la norma, con cada unidad entrenando juntos. Nuestros soldados necesitan saber cómo trabajar con el apoyo aéreo, no solo leerlo."
 GRE_sead_doctrine: "Represión de las Defensas Enemigas"
 GRE_sead_doctrine_desc: "Nuestros pilotos son uno de los más experimentados en la OTAN por el contraaéreo defensivo sobre el Egeo, pero las huelgas ofensivas contra objetivos defendidos todavía están subdesarrolladas. Necesitamos una doctrina SEAD dedicada usando el SCALP y Meteor de Rafale para tomar defensas aéreas enemigas antes de que los paquetes de huelga entren."
 GRE_iniochos_as_doctrine: "Lecciones de Iniochos"
 GRE_iniochos_as_doctrine_desc: "Cada año Iniochos reúne pilotos de veinte naciones para saber qué funciona en el espacio aéreo disputado. Hemos estado llevando a cabo este ejercicio durante años sin traducir plenamente las lecciones en doctrina. Las conclusiones de cada ciclo deben formalizarse en tácticas y procedimientos actualizados y adoptarse a través de la Fuerza Aérea Helénica."
 GRE_cas_doctrine: "Cerrar la integración de apoyo aéreo"
 GRE_cas_doctrine_desc: "La Fuerza Aérea Helénica y el Ejército Helénico rara vez han entrenado juntos en el nivel necesario para un apoyo aéreo eficaz. Se necesita un oleoducto permanente de capacitación conjunta y protocolos estandarizados de comunicación para que los comandantes terrestres y pilotos de combate puedan realmente trabajar juntos cuando importa."
 GRE_aegean_fortress_doctrine: "El Egeo como Nuestro Mar"
 GRE_aegean_fortress_doctrine_desc: "El Egeo no es un océano abierto. Es un laberinto de seis mil islas, estrechos estrechos, bancos poco profundos y puntos de ahogamiento. Un defensor bien preparado puede hacer que esta geografía sea extremadamente peligrosa para cualquier flota atacante. Necesitamos una marina que haga de todo acercamiento al territorio griego un riesgo que nadie querría tomar."
 GRE_aegean_fortress_doctrine_tt: "[GREadmiraldefenseeffect]"
 GRE_aegean_fortress_doctrine_effect: "Almirantes: §G30% de probabilidad§! de ganar §Y+1 Defensa§! en nivel up."
 GRE_submarine_wolf_packs: "Doctrina de guerra submarina"
 GRE_submarine_wolf_packs_desc: "Los submarinos son el arma más peligrosa del Egeo. El agua es demasiado superficial para que un enemigo se esconda pero lo suficientemente profundo en los lugares adecuados para el nuestro. Entrenar a nuestras tripulaciones para operar en grupos coordinados, compartir datos dirigidos y cubrir las áreas de patrullaje entre sí, significaría que ninguna flota superficial puede moverse por el Egeo sin ser rastreada desde abajo."
 GRE_missile_corvette_network: "La Red Roussen"
 GRE_missile_corvette_network_desc: "Nuestros corbetes de misiles de clase Roussen son rápidos y letales, perfectos para el Egeo, pero nunca han operado como una red coordinada. Integrarlas con radar costero, sensores de isla y informes de contacto submarino en un único cuadro de orientación permitiría que cualquier corvette involucrara cualquier amenaza superficial dentro de minutos."
 GRE_aegean_minefield_doctrine: "Los estrechos mineros"
 GRE_aegean_minefield_doctrine_desc: "Grecia ha tenido una capacidad minera naval desde la Segunda Guerra Mundial, pero nunca se ha integrado adecuadamente en doctrina. Los campos de minas pre-planificados para cada enfoque importante en el Egeo, listos para ser activados dentro de horas, convertirían los estrechos en barreras que incluso una flota superior no puede cruzar con seguridad."
 GRE_sea_denial_complete: "Fortress Aegean"
 GRE_sea_denial_complete_desc: "El Mar Egeo es ahora completamente un dominio operativo griego. Cada capa de nuestra defensa marítima, submarinos, corbetas, fragatas, minas y misiles costeros se ha integrado en una sola doctrina de negación del mar. Es posible que no tengamos la mayor marina del Mediterráneo, pero tenemos la más peligrosa para cualquiera tratando de empujar hacia nuestras aguas."
 GRE_eastern_med_doctrine: "Más allá del Egeo"
 GRE_eastern_med_doctrine_desc: "Los intereses griegos no terminan en el Dodecanese. Nuestros derechos EEZ al sur de Creta, nuestro compromiso con Chipre y nuestras alianzas energéticas con Israel y Egipto requieren una armada que puede operar lejos de casa durante largos períodos. Necesitamos una flota que sea creíble en todo el Mediterráneo oriental, no sólo el Egeo."
 GRE_asw_training: "Cazando submarinos"
 GRE_asw_training_desc: "La guerra antisubmarina es la habilidad más exigente y descuidada de la Armada Helénica. Nuestras nuevas fragatas tienen excelentes sensores y torpedos ASW, pero las tripulaciones necesitan un entrenamiento dedicado para utilizarlos adecuadamente. Un programa permanente de formación ASW que se basa en nuestra propia fuerza submarina enseñaría a las tripulaciones superficiales cómo funcionan los submarinos enemigos."
 GRE_fleet_coordination: "Mando naval único"
 GRE_fleet_coordination_desc: "Operando por todo el Mediterráneo oriental necesita coordinación que los comandos de escuadrón fragmentados no pueden proporcionar. Reestructurar la Armada Helénica bajo un único comando operativo con conciencia en tiempo real de cada nave, submarino y aviones de patrulla haría que la flota fuera mucho más eficaz en su conjunto."
 GRE_eastern_med_taskforce: "Mastería operativa mediterránea"
 GRE_eastern_med_taskforce_desc: "Con el Egeo asegurado, necesitamos extender nuestro alcance a través del Mediterráneo. Reestructurar nuestro oleoducto de entrenamiento, reformar las rotaciones de flotas y ejecutar despliegues prolongados construirá la capacidad para rastrear e involucrar a cualquier flota hostil en toda la longitud del Mediterráneo."
 GRE_eastern_med_supremacy: "Supremacía del Mediterráneo oriental"
 GRE_eastern_med_supremacy_desc: "Un equipo de tareas expedicionario permanente, sostenido por modernos muelles y que van desde el Ionian hasta la cuenca Levantine, convierte a la Armada Helénica en el poder marítimo decisivo del Mediterráneo oriental. La proyección de poder en esta escala responde a cualquier reto antes de llegar a las aguas griegas."
 GRE_landforces_modifier: "Helenic Army"
 GRE_landforces_modifier_desc: "Grecia tiene una fuerza de tierra endurecida por la batalla formada por décadas de tensión egea. Nuestro ejército está entrenado, equipado y posicionado para defender cada metro de suelo griego."
 GRE_airforce_modifier: "Fuerza Aérea Infierno"
 GRE_airforce_modifier_desc: "La Fuerza Aérea Helénica controla los cielos sobre el Egeo. Nuestros pilotos están entre los más experimentados de la OTAN, forjados por interceptaciones diarias y el espacio aéreo impugnado."
 GRE_navy_modifier: "Armada del Infierno"
 GRE_navy_modifier_desc: "Grecia es una nación marítima. Nuestra flota de fragatas, submarinos y ataques rápidos patrullan aguas que han sido griegas desde la antigüedad."
 GRE_cold_war_giant_1: "Ejército de Guerra Fría"
 GRE_cold_war_giant_1_desc: "Nuestro ejército fue construido para detener un empuje soviético a través de los Balcanes. Esa guerra nunca llegó. Ahora tenemos formaciones sobredimensionadas que son caras al hombre, lentas de moverse y entrenadas para un campo de batalla que ya no existe."
 GRE_aircraft_bad_1: "Fuerza Aérea de Guerra Fría"
 GRE_aircraft_bad_1_desc: "Nuestra flota aérea es un parche de aviones de la era de la Guerra Fría. Los grandes espacios aéreos son caros de mantener y nuestros pilotos carecen de la doctrina para proyectar el poder más allá del Egeo. La aviación estratégica y la vigilancia son importantes lagunas."
 GRE_navy_bad_1: "Armada de Guerra Fría"
 GRE_navy_bad_1_desc: "Nuestra flota se ve grande en papel, pero es un desastre en la práctica. Los cascos de segunda mano de tres marinas diferentes significan tres cadenas logísticas diferentes. Los costos de combustible son demasiado altos, la cobertura antiaérrea tiene lagunas y nuestros oficiales están capacitados para patrullas costeras en lugar de operaciones de flota."
 GRE_defense_industry: "Arsenal del Egeo"
 GRE_defense_industry_modifier: "Arsenal del Egeo"
 GRE_defense_industry_modifier_desc: "Desde los astilleros de Skaramangas hasta las fábricas de armas alrededor del Pireo, la industria griega ha estado abasteciendo a las fuerzas armadas durante generaciones. Tenemos nuestra propia industria de defensa y deberíamos usarla."
 GRE_research_hubs_idea_tt: "[GREresearchhubidea]"
 GRE_archipelagos_defense_plan: "Escudo del Egeo"
 GRE_archipelagos_defense_plan_desc: "Una arquitectura de defensa capa que trata la cadena de la isla Egeo como una red integrada de fortalezas. La reparación rápida, las baterías costeras, la negación de suministros y la cobertura de misiles se combinan para que cualquier enfoque en aguas griegas sea costoso."
 GRE_archipelagos_defense_plan_country: "Escudo del Egeo"
 GRE_archipelagos_defense_plan_country_desc: "Una arquitectura de defensa capa que trata la cadena de la isla Egeo como una red integrada de fortalezas. La reparación rápida, las baterías costeras, la negación de suministros y la cobertura de misiles se combinan para que cualquier enfoque en aguas griegas sea costoso."
 GRE_defense_innovation_research_mission: "Ciclo de investigación de innovación en defensa"
 GRE_defense_innovation_research_mission_desc: "El Centro de Innovación de Defensa Helénica impulsa la investigación continua en todas las ramas de las fuerzas armadas. Cada 100 días, un avance puede emerger en armadura, artillería, sistemas de infantería, aviación o tecnología naval."
 GRE_aegean_survey: "Estudio de los fondos marinos egeos"
 GRE_aegean_survey_desc: "Planificamos lo que es nuestro. Una encuesta geológica completa del fondo marino egeo establecerá el alcance de nuestras reservas de hidrocarburos y sentará las bases para la extracción."
 GRE_aegean_surveyed: "Aguas egeas maduradas"
 GRE_aegean_extraction: "Extracción de aceite egeo"
 GRE_aegean_extraction_desc: "Las encuestas están completas. Comenzamos a extraer de los campos Egeos. Aceite griego de aguas griegas para la economía griega."
 GRE_aegean_extracting: "Aceite Egeo Extracto"
 GRE_aegean_offshore_industry: "Egeo de la industria offshore"
 GRE_aegean_offshore_industry_desc: "La extracción genera industria. Construimos la infraestructura de apoyo para procesar y distribuir lo que sacamos del lecho marino del Egeo."
 GRE_crete_survey: "Estudio del lecho marino del sur de Creta"
 GRE_crete_survey_desc: "Las aguas al sur de Creta tienen un potencial sin explotar. Ampliamos nuestras operaciones de reconocimiento en las cuencas Ionian y Levantine."
 GRE_crete_surveyed: "Aguas de Cretan Mapped"
 GRE_crete_extraction: "Extracción de petróleo del sur de Creta"
 GRE_crete_extraction_desc: "Las aguas griegas más profundas producen las mayores reservas. Comenzamos la extracción al sur de Creta y aseguramos el futuro económico de la nación."
 GRE_crete_extracting: "Aceite de cretano extraído"
 GRE_crete_offshore_industry: "Industria marina del sur de Creta"
 GRE_crete_offshore_industry_desc: "Los campos del sur están produciendo. Construimos la capacidad industrial para convertir la extracción cruda en una producción económica duradera."
 TUR_naval_expansion_response: "Programa de Expansión Naval"
 TUR_naval_expansion_response_desc: "En respuesta a la asertividad marítima griega, Turquía acelera su programa de construcción naval. Los patios funcionan con mayor capacidad para cerrar la brecha en el Mediterráneo oriental."
 GRE_creditor_management_category: "Gestión de la deuda griega"
 GRE_creditor_management_category_desc: "Como tenedores de deuda soberana griega, podemos reclamar partes de la deuda o condonarla por completo. Nuestras tenencias actuales generan ingresos regulares por intereses de Atenas."
 GRE_propose_debt_deal: "Proponer el trato de la deuda"
 GRE_propose_debt_deal_desc: "Proponer que una nación extranjera asuma una parte de nuestra deuda nacional a cambio de pagos regulares de intereses. Traspasaremos el 10% de nuestra deuda actual al acreedor elegido, que sube al 25% cuando nuestra deuda pase del 90% del PIB."
 GRE_repay_creditor: "Repay Creditor"
 GRE_repay_creditor_desc: "Hacer un pago único para reducir nuestra deuda pendiente con este acreedor en el 10% de lo adeudado."
 GRE_creditor_call_in_debt: "Reclamar la deuda griega"
 GRE_creditor_call_in_debt_desc: "Exigir que Grecia reembolse de inmediato el 20% de la deuda que nos debe. Es una acción diplomática severa que puede dañar las relaciones."
 GRE_creditor_forgive_debt: "Perdona la deuda griega"
 GRE_creditor_forgive_debt_desc: "Apaga el 25% de la deuda que Grecia nos debe como un gesto de buena voluntad. Esto mejorará significativamente las relaciones con Atenas."
 greece_debt.10.t: "Propuesta de la deuda griega"
 greece_debt.10.d: "[FROM.GetName] nos ha abordado con una propuesta para asumir una parte de su deuda nacional. A cambio, recibiríamos pagos regulares de intereses en la cantidad retenida. La suma propuesta es modesta pero representa una corriente de ingresos fiable."
 greece_debt.10.a: "Aceptar los términos"
 greece_debt.10.b: "No estamos interesados"
 greece_debt.10.c: "Sólo a un ritmo más alto"
 greece_debt.12.t: "Debt Deal Aceptado"
 greece_debt.12.d: "[FROM.GetName] ha acordado asumir una parte de nuestra deuda nacional. Haremos pagos regulares de intereses a ellos, pero nuestra carga general de la deuda ha sido reestructurada."
 greece_debt.12.a: "Un arreglo necesario"
 greece_debt.13.t: "Concesiones de la deuda"
 greece_debt.13.d: "[FROM.GetName] ha rechazado nuestra propuesta de mantener una parte de nuestra deuda. Debemos buscar socorro en otro lugar o encontrar otros medios para abordar nuestra situación financiera."
 greece_debt.13.a: "Encontraremos otra manera."
 greece_debt.14.t: "Contraoferta recibida"
 greece_debt.14.d: "[FROM.GetName] está dispuesto a mantener nuestra deuda, pero sólo a un tipo de interés superior al que propusimos inicialmente. El aumento del costo de la prestación de servicios a esta deuda debe ser ponderado contra el alivio inmediato que proporciona."
 greece_debt.14.a: "Aceptar la tasa más alta"
 greece_debt.14.b: "Los términos son inaceptables"
 greece_debt.16.t: "Deuda llamada"
 greece_debt.16.d: "[FROM.GetName] exige el pago inmediato de una parte de la deuda que les debemos. El incumplimiento dañará nuestra relación y la credibilidad internacional."
 greece_debt.16.a: "Pagar lo que demandan"
 greece_debt.16.b: "No podemos permitirnos esto."
 greece_debt.17.t: "Deuda perdonada"
 greece_debt.17.d: "[FROM.GetName] ha escrito generosamente una parte de la deuda que les debemos. Este alivio inesperado facilita considerablemente nuestra carga financiera."
 greece_debt.17.a: "Un socorro de bienvenida"
 greece_debt.18.t: "Deuda griega totalmente pagada"
 greece_debt.18.d: "[FROM.GetName] ha pagado totalmente todas las deudas pendientes que nos deben. Si bien perdemos una fuente de ingresos por intereses, el reembolso demuestra responsabilidad fiscal."
 greece_debt.18.a: "La cuenta está arreglada"
 greece_debt.2.t: "Propuesta de la deuda"
 greece_debt.2.d: "[FROM.GetName] pide que consideremos tomar una parte de su deuda nacional a través de un acuerdo de intercambio."
 GRE_eligible_creditor_tt: "No debe estar en guerra con Grecia, ser independiente, no ya un acreedor, y tener opinión arriba -50"
 GRE_debt_ratio_above_50_tt: "La relación entre deuda y PIB debe ser superior al 50%"
 GRE_debt_ratio_above_90_tt: "La relación entre deuda y PIB debe estar por encima del 90%"
 GRE_propose_debt_deal_accept_tt: "El acreedor asume una parte de nuestra deuda, recortando nuestra deuda nacional a cambio de los pagos de intereses en curso."
 GRE_creditor_call_in_debt_accept_tt: "Grecia paga la parte llamada de la deuda que nos debe."
 GRE_creditor_call_in_debt_reject_tt: "Grecia se niega a pagar, sosurando las relaciones entre nuestras naciones."
 GRE_retry_outreach_accept_tt: "Ellos están de acuerdo con nuestra apertura, mejorar las relaciones y avanzar en nuestra alineación."
 GRE_repay_10pct_tt: "Reembolso 10% de la deuda adeudada a este acreedor."
 GRE_call_in_20pct_tt: "Demanda de reembolso del 20% de la deuda griega que tenemos."
 GRE_forgive_25pct_tt: "Perdonar el 25% de la deuda que Grecia nos debe."
 GRE_eastmed_jor_accept_tt: "Jordania se suma al foro, mejora de las relaciones y apertura de un acuerdo comercial con nosotros."
 GRE_eastmed_jor_reject_tt: "Jordania declina, costándonos capital político."
 GRE_interest_rate_below_cap_tt: "La tasa de interés debe estar por debajo del 8%"
 GRE_interest_rate_above_min_tt: "La tasa de interés debe ser superior al 0,5%"
 GRE_creditor_holds_significant_debt_tt: "Tenemos más de §Y10 mil millones§! en §Y Deuda griega§! (Current §Y[?GRE_debt_held_by_us|1] billion§!)"
 GRE_deferred_to_creditors_tt: "Gastos diferidos distribuidos proporcionalmente a las naciones acreedoras"
 GRE_prospecting_category: "Prospección de recursos griegos"
 GRE_prospecting_category_desc: "Nuestros estudios geológicos han identificado yacimientos minerales prometedores en la Grecia continental y las islas. Con la tecnología de excavación y la infraestructura adecuadas, podemos convertir estos sitios en minas productivas."
 GRE_prospecting_unlocked_tt: "Desbloquear las decisiones sobre perspectivas de recursos"
 GRE_halkidiki_prospecting: "Expansión minera de Halkidiki"
 GRE_halkidiki_prospecting_desc: "La península de Halkidiki en el norte de Grecia tiene importantes depósitos de cromo y oro. Los distritos mineros de Skouries y Stratoni pueden ampliarse con técnicas modernas de excavación."
 GRE_peloponnese_bauxite: "Extracción de Bauxite Peloponés"
 GRE_peloponnese_bauxite_desc: "Las minas y el distrito de Fokis contienen importantes reservas de bauxita. La extracción progresiva puede abastecer nuestra industria de aluminio durante décadas."
 GRE_thessaly_mining: "Minería de níquel de Tesalia"
 GRE_thessaly_mining_desc: "Los depósitos Larymna nickel laterite en Thessaly representan una de las mayores reservas de níquel en Europa. La extracción sistemática producirá subproductos de acero y cromo."
 GRE_aegean_mining: "Extracción minera de la isla Egeo"
 GRE_aegean_mining_desc: "Las islas volcánicas del Egeo, en particular Milos y Naxos, contienen depósitos de bentonita, perlita y emery que pueden ser explotados comercialmente."
 GRE_pipeline_infrastructure: "Infraestructura de tuberías"
 GRE_pipeline_infrastructure_desc: "Una red de oleoductos que conectan los sitios de prospección con las refinerías existentes y consumidores industriales hace la extracción comercialmente viable y vincula al sector de recursos a la red de energía griega más amplia."
 greece.28.t: "Propuesta de Inversión Industrial China"
 greece.28.d: "[FROM.GetName] nos ha acercado a invertir en su base industrial. Proponen que financiamos la construcción de una fábrica en Thessaly a cambio de influencia comercial sobre su creciente economía."
 greece.28.a: "Una inversión sólida"
 greece.28.b: "No tenemos interés en la industria griega"
 greece.29.t: "Inversión china Aceptada"
 greece.29.d: "China ha acordado financiar nuestra expansión industrial en Thessaly. Se construirá una nueva fábrica con capital chino, profundizando nuestros vínculos económicos con Beijing."
 greece.29.a: "Excelentes noticias"
 greece.30.t: "China Investment Declined"
 greece.30.d: "China ha rechazado nuestra propuesta de inversión industrial. Todavía podemos continuar con la construcción nosotros mismos, aunque vendrá a nuestro propio costo."
 greece.30.a: "Lo financiaremos nosotros mismos."
 greece.30.b: "El proyecto no es viable sin capital extranjero"
 greece.31.t: "Propuesta de inversión portuaria del Pireo"
 greece.31.d: "[FROM.GetName] propone la inversión china en el puerto de Pireo. COSCO Shipping adquiriría una participación controladora en la autoridad portuaria, financiando importantes mejoras de infraestructura a cambio de control comercial sobre uno de los puertos más ocupados del Mediterráneo."
 greece.31.a: "Piraeus es un activo estratégico que vale la pena invertir en"
 greece.31.b: "No invertiremos en puertos griegos"
 greece.32.t: "COSCO apremia la toma del neureo"
 greece.32.d: "China ha acordado invertir en Pireo. COSCO Shipping financiará la expansión portuaria, añadiendo nueva capacidad e infraestructura de muelles. La influencia china en nuestra economía crece, pero también nuestra capacidad portuaria."
 greece.32.a: "El puerto prosperará"
 greece.33.t: "China declina la inversión del neureo"
 greece.33.d: "China se ha negado a invertir en Pireo. Aún podemos modernizar el puerto nosotros mismos, pero sin capital chino el costo cae completamente en nuestro tesoro."
 greece.33.a: "Vamos a modernizar el Pireo nosotros mismos"
 greece.33.b: "El puerto puede esperar"
 greece.34.t: "Propuesta para el desarrollo de bienes raíces griegos"
 greece.34.d: "[FROM.GetName] nos ha acercado a desarrollar bienes raíces comerciales en la región de Attica. Los desarrolladores chinos financiarían la construcción de centros comerciales, hoteles y edificios de oficinas a cambio de arrendamientos a largo plazo y presencia comercial."
 greece.34.a: "La propiedad griega es una inversión atractiva"
 greece.34.b: "No estamos interesados en bienes raíces griegas"
 greece.35.t: "Inversión inmobiliaria china aceptada"
 greece.35.d: "Los desarrolladores chinos financiarán importantes proyectos de construcción en toda Attica. La nueva capacidad comercial y residencial transformará la región, aunque la presencia comercial china crece significativamente."
 greece.35.a: "La construcción comienza"
 greece.36.t: "China Inversión inmobiliaria de Declines"
 greece.36.d: "China se ha negado a invertir en nuestro sector inmobiliario. Todavía podemos continuar con el desarrollo utilizando el capital nacional."
 greece.36.a: "Lo desarrollaremos nosotros mismos"
 greece.36.b: "El desarrollo puede esperar"
 greece.37.t: "Propuesta de inversión en infraestructura a nivel nacional"
 greece.37.d: "[FROM.GetName] propone un amplio programa de infraestructura en toda Grecia. Las empresas estatales chinas financiarían aeropuertos, fábricas y construcción de oficinas en todo el país a cambio de una influencia comercial sustancial."
 greece.37.a: "Grecia está madura para el desarrollo"
 greece.37.b: "El alcance de esta propuesta nos concierne"
 greece.38.t: "Inversión nacional china aceptada"
 greece.38.d: "China se ha comprometido con un programa de infraestructura nacional. Nuevos aeropuertos, fábricas y edificios comerciales se construirán en toda Grecia a expensas de China."
 greece.38.a: "Una asociación transformadora"
 greece.39.t: "China declina la inversión a nivel nacional"
 greece.39.d: "China ha rechazado nuestra propuesta de inversión en todo el país. Todavía podemos construir la infraestructura nosotros mismos, aunque el costo será considerable."
 greece.39.a: "Lo construiremos nosotros mismos."
 greece.39.b: "Demasiado costoso sin apoyo extranjero"
 greece.40.t: "Propuesta de desarrollo de Elliniko"
 greece.40.d: "[FROM.GetName] propone la inversión china en el antiguo sitio del Aeropuerto Internacional Elliniko. El proyecto de desarrollo costero masivo transformaría pistas abandonadas en un moderno distrito urbano con mejoras de infraestructura en toda Attica y Peloponnese."
 greece.40.a: "El proyecto Elliniko tiene un gran potencial"
 greece.40.b: "No invertiremos en este proyecto"
 greece.41.t: "China Elliniko Inversión Aceptada"
 greece.41.d: "China ha acordado financiar el proyecto de redesarrollo Elliniko. Las mejoras de infraestructura se extenderán tanto a la Attica como al Peloponés."
 greece.41.a: "Un proyecto histórico comienza"
 greece.42.t: "China Declines Elliniko Inversión"
 greece.42.d: "China se ha negado a invertir en el redesarrollo de Elliniko. Podemos continuar con el proyecto utilizando nuestros propios fondos, o podemos deshacer los planes."
 greece.42.a: "Lo financiaremos nosotros mismos."
 greece.42.b: "Desplaza el proyecto por ahora"
 greece.46.t: "Solicitud de préstamo de ICBC"
 greece.46.d: "[FROM.GetName] se ha acercado al Banco Industrial y Comercial de China buscando un préstamo sustancial. Proponen que la ICBC extienda crédito igual al 10% de su PIB, profundizando nuestros vínculos financieros con Atenas y ampliando la presencia bancaria china en el Mediterráneo."
 greece.46.a: "Extender el préstamo"
 greece.46.b: "El riesgo es demasiado grande"
 greece.47.t: "Préstamo de la ICBC aprobado"
 greece.47.d: "El Banco Industrial y Comercial de China ha aprobado nuestra solicitud de préstamo. El capital chino fluye hacia nuestro tesorería, proporcionando una inyección significativa de fondos. Nuestra dependencia financiera de Beijing se profundiza, pero el alivio inmediato es bienvenido."
 greece.47.a: "Los fondos están asegurados"
 greece.48.t: "Préstamo de ICBC Denied"
 greece.48.d: "China ha rechazado prorrogar un préstamo de la ICBC. Sin apoyo bancario chino, debemos buscar fuentes alternativas de capital o gestionar dentro de nuestros medios existentes."
 greece.48.a: "Nos las arreglaremos"
 GRE_drydock_modernization: "Modernización Drydock"
 GRE_drydock_modernization_desc: "La inversión en modernas instalaciones de secado ha ampliado la capacidad naval de reparación y construcción, permitiendo a la Armada Helénica mejorar su flota más eficientemente."
 GRE_strategic_autonomy_idea: "Autonomía estratégica"
 GRE_strategic_autonomy_idea_desc: "He aquí a ningún bloque único, Grecia negocia y negocia con todos ellos. La libertad de jugar a cada lado da mejores términos y una medida de aislamiento de la presión de gran potencia."
 GRE_euro_adopted: "Euro Adopción"
 GRE_euro_adopted_desc: "La adopción del euro por Grecia ha integrado su economía en la zona euro más amplia, reduciendo los costos de préstamo y facilitando el comercio a expensas de una política monetaria independiente."
 GRE_manpads_expansion_idea: "Expansión de MANPADS"
 GRE_manpads_expansion_idea_desc: "Un programa ampliado para sistemas portátiles de defensa del aire ha mejorado la capacidad antiaire y reducido los costos de producción mediante investigación y fabricación nacionales."
 GRE_port_modernization: "Modernización portuaria"
 GRE_port_modernization_desc: "La infraestructura portuaria degradada ha ampliado la capacidad del astillero y mejorado la eficiencia naval en los astilleros griegos."
 GRE_research_hubs_idea: "Centros de Investigación Militar"
 GRE_research_hubs_idea_desc: "Se han establecido centros de investigación militares dedicados para acelerar el desarrollo tecnológico de defensa y la innovación en sistemas de armas."
 GRE_research_hubs_idea_2: "Centros de investigación avanzados"
 GRE_research_hubs_idea_2_desc: "La expansión del programa de centros de investigación ahora abarca la tecnología espacial junto con las aplicaciones militares, ampliando la frontera tecnológica de Grecia."
 GRE_greater_state_control_authoritarian: "Control estatal autoritario"
 GRE_greater_state_control_authoritarian_desc: "El Estado ha asumido el control directo sobre sectores económicos clave, acelerando la construcción al costo de la libertad política y la flexibilidad burocrática."
 GRE_com_liberators: "Libertadores del Pueblo"
 GRE_com_liberators_desc: "Cursos de fervor revolucionarios a través de las filas. Los soldados que luchan en tierra natal están amoldados por la causa, golpeando más fuerte y más firme en defensa de la revolución."
 GRE_western_outreach: "West Outreach"
 GRE_western_outreach_desc: "La diplomacia griega está dedicada a una campaña de divulgación bilateral y multilateral en toda la OTAN y la Unión Europea. Compromiso Occidental: [?GRE_western_commitment|0]"
 GRE_franco_hellenic_strategic_partnership: "Asociación estratégica Franco-Hellenic"
 GRE_franco_hellenic_strategic_partnership_desc: "La alianza estratégica 2021 ha desbloqueado una profunda cooperación industrial-defensa con Francia. Las fábricas de armas griegas se ejecutan en normas comunes, las bonificaciones de investigación francesa fluyen a nuestros programas militares y la coordinación política se ha intensificado."
 GRE_franco_greek_mutual_defense: "Cláusula de defensa mutua Franco-Greek"
 GRE_franco_greek_mutual_defense_desc: "El artículo 2 de la alianza mejorada compromete a Francia a defender el territorio griego. La cláusula pone de relieve la seguridad griega en términos continentales y une dos de las mayores fuerzas militares del Mediterráneo a una sola unidad estratégica."
 GRE_eastmed_trilateral_idea: "GRE-ISR-CYP Trilateral"
 GRE_eastmed_trilateral_idea_desc: "Las declaraciones conjuntas, los ejercicios conjuntos y la inteligencia mancomunada han soldado a las tres fuerzas armadas y aéreas en un solo espacio operacional en toda la cuenca del Mediterráneo oriental."
 GRE_eastmed_gas_forum_idea: "EastMed miembro del foro de gas"
 GRE_eastmed_gas_forum_idea_desc: "El transporte marítimo griego se mueve a través de carriles preferenciales, flujos regionales de gas enriquecen las refinerías griegas y los muelles, y Atenas mantiene un asiento permanente en la mesa de energía del Este-Med."
 GRE_3plus1_pact: "3+1 Strategic Dialogue"
 GRE_3plus1_pact_desc: "El compromiso americano corona el trilateral de East-Med. Los ejercicios conjuntos, el intercambio de inteligencia y el diálogo estratégico estructurado aumentan la capacidad operacional de las fuerzas armadas griegas en todos los ámbitos marítimo y aéreo."
 GRE_eu_political_anchor_idea: "Ancla de miembro fundador de la UE"
 GRE_eu_political_anchor_idea_desc: "Grecia ejerce el peso político de un miembro fundador de la UE, aprovechando el comercio intrabloc y formando la agenda de Bruselas desde una posición de antigüedad."
 GRE_eu_strategic_compass_idea: "EU Strategic Compass Advocate"
 GRE_eu_strategic_compass_idea_desc: "La diplomacia griega avanza en la Compasía Estratégica Europea, pidiendo la autonomía del aventurismo externo de grandes potencias al tiempo que une la base industrial-defensa de la UE cada vez más cerca."
 greece.556.t: "La Reafirmación Occidental"
 greece.556.d: "Grecia anuncia una reafirmación amplia de su alineamiento occidental, abriendo una campaña sostenida de divulgación bilateral y multilateral en toda la OTAN y la Unión Europea. Atenas está señalizando, a aliados y rivales por igual, que su futuro estratégico está firmemente anclado en Occidente."
 greece.556.a: "A welcome restatement"
 greece.556.b: "Grecia mantiene la línea"
 greece.556.c: "Toma nota"
 greece.557.t: "Propuesta griega: Alianza Estratégica"
 greece.557.d: "Atenas propone una asociación estratégica integral que abarca la cooperación industrial-defensa, alineación política exterior y seguridad del Mediterráneo oriental. El gobierno griego está dispuesto a comprometer capital político sustancial para hacer de este un buque insignia de la política mediterránea francesa."
 greece.557.a: "Firmar la asociación"
 greece.557.b: "Declarar la propuesta"
 greece.558.t: "Francia acepta la asociación"
 greece.558.d: "París acepta la alianza estratégica. Los grupos de trabajo conjuntos se ocupan inmediatamente de la cooperación industrial en materia de defensa, y los conocimientos especializados franceses se convierten en fábricas de armas griegas y programas de investigación. La asociación se presenta como un modelo para la cooperación bilateral europea."
 greece.558.a: "Un acuerdo histórico"
 greece.559.t: "[FROM.GetName] Declara la asociación"
 greece.559.d: "[FROM.GetName] informa a Atenas, con discreción diplomática, que la asociación no puede proceder. El costo político sigue siendo real."
 greece.559.a: "A regrettable setback"
 greece.560.t: "Propuesta griega: Trilateral del Mediterráneo oriental"
 greece.560.d: "Atenas propone un marco trilateral formal con Israel y Chipre: ejercicios conjuntos, inteligencia conjunta y posiciones diplomáticas coordinadas. El acuerdo convertiría la cooperación de larga data en una forma institucional vinculante."
 greece.560.a: "Firme el trilateral"
 greece.560.b: "Declarar la propuesta"
 greece.561.t: "Israel se une a la Trilateral"
 greece.561.d: "Israel firma el marco trilateral. Las celdas mixtas de planificación se encuentran en el plano operacional, y los acuerdos israelíes de intercambio de información se extienden a las contrapartes griegas."
 greece.561.a: "Bienvenido a nuestros socios"
 greece.563.t: "Propuesta griega: Trilateral del Mediterráneo oriental"
 greece.563.d: "Atenas propone el marco trilateral formal con Chipre e Israel. Para Nicosia la oferta es esencialmente automática, pero la firma formal todavía necesita venir."
 greece.563.a: "Por supuesto que firmamos"
 greece.563.b: "Sostenerse para un nuevo examen"
 greece.564.t: "Chipre se une a la trilateral"
 greece.564.d: "Nicosia firma el marco trilateral con Atenas y Jerusalén. Los tres gobiernos ahora operan bajo un paraguas diplomático y operacional unificado en todo el Mediterráneo oriental."
 greece.564.a: "A unificada East-Med"
 greece.566.t: "Propuesta griega: Artículo 2 Cláusula de Defensa Mutua"
 greece.566.d: "Atenas propone la conclusión natural de la alianza estratégica: una cláusula vinculante de defensa mutua modelada en el artículo 5, escrita directamente en el tratado bilateral. Por primera vez, la integridad territorial griega estará garantizada por un importante poder europeo en términos de tratados."
 greece.566.a: "Firmar la cláusula de defensa mutua"
 greece.566.b: "Declin. Demasiado lejos, demasiado rápido."
 greece.567.t: "Francia firma la Cláusula de Defensa Mutua"
 greece.567.d: "Signos de París. El artículo 2 del tratado actualizado compromete a Francia a defender el territorio griego. La onda diplomática llega mucho más allá del Mediterráneo."
 greece.567.a: "Una nueva era de seguridad europea"
 greece.568.t: "Franquicia declina la cláusula de defensa mutua"
 greece.568.d: "París declina la cláusula de defensa mutua como un paso demasiado lejos para la actual doctrina estratégica francesa. La asociación existente sigue siendo, pero la garantía de seguridad vinculante no se materializará."
 greece.568.a: "Un serio revés."
 greece.569.t: "Propuesta griega: 3+1 Diálogo Estratégico"
 greece.569.d: "Atenas, Nicosia y Jerusalén proponen conjuntamente formalizar el diálogo estratégico 3+1 con los Estados Unidos, un marco respaldado por el Departamento de Estado que abarca la seguridad energética, la cooperación marítima y la lucha contra el terrorismo en el Mediterráneo oriental."
 greece.569.a: "Participación en el diálogo"
 greece.569.b: "Compromiso de demoras"
 greece.570.t: "Estados Unidos engancha el 3+1"
 greece.570.d: "Washington participa formalmente en el diálogo estratégico 3+1. Los compromisos de entrenamiento y ejercicio estadounidenses se expanden en todo el Mediterráneo oriental, y las fuerzas armadas griegas obtienen acceso a un nuevo nivel de experiencia operacional conjunta."
 greece.570.a: "Una asociación indispensable"
 greece.571.t: "Estados Unidos posterga la participación"
 greece.571.d: "El Departamento de Estado señala que las prioridades estratégicas más amplias están absorbiendo la atención estadounidense. El marco 3+1 no está abandonado, pero la actualización formal no sucederá en el ciclo actual."
 greece.571.a: "Revisitaremos más tarde."
 greece.572.t: "Grecia: Pilar del Oeste"
 greece.572.d: "Los tratados, declaraciones y asociaciones exitosos han transformado a Grecia de un miembro periférico de la OTAN en una columna de carga de diplomacia occidental en el Mediterráneo oriental. Atenas habla ahora de una posición de peso estructural en Bruselas y Washington por igual."
 greece.572.a: "Pilar del Oeste"
 greece.572.b: "Un aliado restaurado"
 greece.572.c: "Una nueva geometría estratégica"
 greece.575.t: "Alexandroupolis FSRU viene en línea"
 greece.575.d: "La unidad flotante de almacenamiento y regasificación amarrada en Alexandroupolis ha comenzado la operación comercial, anclando el pivote del sudeste de Europa lejos del gasoducto ruso. El suelo griego es ahora un punto de entrada para el suministro energético del continente."
 greece.575.a: "Atenas ilumina la lámpara"
 greece.575.b: "Un nuevo nodo útil"
 greece.577.t: "Piraeus ancla el Corredor IMEC"
 greece.577.d: "Los Jefes de Estado en Delhi, Riyadh y Bruselas han confirmado a Piraeus como el término europeo del corredor económico entre India y Medio Oriente y Europa. Se prevé que los volúmenes de transbordo a través de Attica se triplicarán durante el decenio."
 greece.577.a: "Del Egeo al Océano Índico"
 greece.577.b: "Un hito logístico"
 greece.580.t: "Propuesta griega: hoja de ruta de cooperación Prespa"
 greece.580.d: "Atenas propone una hoja de ruta estructurada para ampliar el Acuerdo Prespa: grupos de trabajo sectoriales, un arreglo de libre comercio y planificación conjunta de la infraestructura. El paquete vincularía nuestras economías para una generación."
 greece.580.a: "Skopje está listo para construir en Prespa"
 greece.580.b: "No pasaremos más allá del marco existente"
 greece.581.t: "Macedonia del Norte apoya la hoja de ruta"
 greece.581.d: "Skopje ha firmado la hoja de ruta de cooperación Prespa. Los grupos de trabajo se reunirán en Thessaloniki dentro de las semanas, y un arreglo de libre comercio está ahora al alcance."
 greece.581.a: "Excelentes noticias"
 greece.582.t: "Propuesta griega: Marco de derechos de las minorías"
 greece.582.d: "Atenas propone un marco formal sobre los derechos de la comunidad de habla griega en el sur de Albania: escuelas de idiomas, restitución de bienes y cooperación cultural transfronteriza, a cambio de vínculos bilaterales más cálidos."
 greece.582.a: "Tirana acepta el marco"
 greece.582.b: "No podemos estar de acuerdo con estos términos"
 greece.583.t: "Albania firma el Marco de las Minorías"
 greece.583.d: "El acuerdo está firmado en Tirana. Las comunidades de habla griega en el sur de Albania reciben protecciones concretas, y los canales ministeriales con Atenas se profundizan en consecuencia."
 greece.583.a: "Una ganancia diplomática"
 greece.584.t: "Propuesta griega: Acuerdo de EEZ del Mediterráneo oriental"
 greece.584.d: "Atenas propone una delimitación bilateral de zona económica exclusiva con El Cairo. El acuerdo resolvería las reclamaciones marítimas superpuestas y excluiría a los actores rivales del desarrollo conjunto de los recursos de los fondos marinos."
 greece.584.a: "El Cairo firma el acuerdo"
 greece.584.b: "El Cairo disminuye por ahora"
 greece.585.t: "Egipto ratifica el Acuerdo EEZ"
 greece.585.d: "Egipto ha ratificado la delimitación marítima. Las encuestas conjuntas de la zona demarcada comienzan dentro del mes, y las cláusulas comerciales vinculadas al acuerdo entran en vigor."
 greece.585.a: "Un acuerdo fundamental"
 greece.586.t: "Propuesta griega: Eje Mediterráneo italo-helénico"
 greece.586.d: "Atenas propone una asociación integral con Roma: política industrial coordinada, programas compartidos de astilleros y posiciones alineadas sobre la seguridad mediterránea. Las dos penínsulas actuarían como una en Bruselas."
 greece.586.a: "Roma está de acuerdo con la asociación"
 greece.586.b: "Rome politely declines"
 greece.587.t: "Italia se une al eje mediterráneo"
 greece.587.d: "Italia ha firmado el documento de asociación. Los comités industriales conjuntos y un marco para la coproducción naval se convocan en Atenas dentro del trimestre."
 greece.587.a: "Nace un eje"
 greece.588.t: "Propuesta griega: Expansión de tuberías IGB"
 greece.588.d: "Atenas propone una expansión gradual del interconexor Grecia-Bulgaria y la terminal de Alexandroupolis conectada. Sofía ganaría el suministro diversificado de gas; Atenas capturaría ingresos de tránsito en los Balcanes."
 greece.588.a: "Sofía firma el plan de expansión"
 greece.588.b: "Sofía rechaza la propuesta"
 greece.589.t: "Bulgaria Greenlights the Pipeline Ampliation"
 greece.589.d: "Sofía ha aprobado la expansión. Se prevé que la construcción comenzará dentro de la temporada; se proyecta que los flujos de gas norte a Bulgaria y sur a través de terminales griegas se duplicarán."
 greece.589.a: "Un corredor estratégico"
 greece.590.t: "Propuesta griega: Consejo Estratégico Helénico-Saudi"
 greece.590.d: "Atenas propone un Consejo Supremo de Cooperación Estratégica con Riyadh: cooperación industrial-defensa, coinversión de la riqueza soberana y diálogo ministerial regular. El Reino ganaría un socio mediterráneo; Grecia ganaría capital."
 greece.590.a: "Riyadh acepta"
 greece.590.b: "Riyadh declines"
 greece.591.t: "Arabia Saudita convoca al Consejo"
 greece.591.d: "El Consejo Supremo de Cooperación Estratégica celebra su reunión inaugural en Atenas. Los fondos saudíes de riqueza soberana anuncian un primer tramo de inversión en la industria griega."
 greece.591.a: "Una asociación histórica"
 greece.592.t: "Propuesta griega: Pacto de Inversión Helénica-Emirati"
 greece.592.d: "Atenas propone un pacto de inversión estructurado con Abu Dhabi: tratamiento tributario para fondos Emirati, acceso libre a la zona en Attica y inversión griega recíproca en la red logística del Golfo."
 greece.592.a: "Abu Dhabi acepta"
 greece.592.b: "Abu Dhabi declines"
 greece.593.t: "Emiratos Árabes Unidos firman el Pacto"
 greece.593.d: "Abu Dhabi ha firmado el pacto. El capital emirati comienza a fluir en la logística y la industria griega, y las empresas griegas obtienen acceso preferencial a la infraestructura del centro del Golfo."
 greece.593.a: "Excelente"
 greece.594.t: "Propuesta griega: EastMed Gas Forum Accession"
 greece.594.d: "Atenas propone que Amman se una al Foro de Gas Mediterráneo Oriental, con Grecia patrocinando su adhesión. Una arquitectura energética regional que se extiende desde el Levante hasta el Egeo emergería."
 greece.594.a: "Amman acepta la invitación"
 greece.594.b: "Amman declines"
 greece.595.t: "Jordania se une al EastMed Gas Forum"
 greece.595.d: "Jordania ha formalizado su adhesión al Foro del Gas de EastMed. El alcance geográfico y político de la institución se extiende decisivamente por toda la cuenca del Mediterráneo oriental."
 greece.595.a: "Una victoria diplomática"
 GRE_lobby_eu_partners: "Compañeros de la UE del vestíbulo"
 GRE_lobby_eu_partners_desc: "Pasar capital político en una campaña sostenida de cabildeo dentro de la Unión Europea: visitas bilaterales, documentos de posición y comercio de concesiones, para impulsar las prioridades diplomáticas griegas hacia adelante y acumular Compromiso Occidental."
 GRE_eastern_alignment_score: "Alineación oriental griega"
 GRE_eastern_alignment_score_tt: "$GRE_eastern_alignment_score$: $RIGHT|+=0Y$"
 GRE_aegean_tension: "Tensión egeo"
 GRE_aegean_tension_tt: "§HAegean Tension§!: §Y[?GRE_aegean_tension|+=0]§!/100"
 GRE_cyprus_momentum: "El impulso de Chipre"
 GRE_cyprus_momentum_tt: "§HCyprus Momentum§!: §Y[?GRE_cyprus_momentum|+=0]§!/100"
 GRE_tension_change: "§Y[GRE.GetFlag][CYP.GetFlag] Tensión Egeo[TUR.GetFlag] [NCY.GetFlag]§!"
 GRE_tension_change_tt: "$GRE_tension_change$: $RIGHT|-=0$"
 GRE_momentum_change: "§Y[GRE.GetFlag][CYP.GetFlag]El Momento de Ciro[TUR.GetFlag][NCY.GetFlag]§!"
 GRE_momentum_change_tt: "$GRE_momentum_change$: $RIGHT|+=0$"
 GRE_confederation_all_done_TT: "§BLas tres decisiones de confederación resolvieron§!"
 GRE_cyprus_momentum_high_TT: "§BMomento de Chipre por encima de §H+70§!§!"
 GRE_cyprus_momentum_mid_TT: "§BMomento de Chipre por encima de §H+40§!§!"
 GRE_aegean_tension_low_TT: "§B Tensión egeo debajo §H40§!§!"
 GRE_eastern_vars_initialized: "Tema de la Hermandad Oriental inicializado"
 GRE_migration_deal_active: "La cooperación en materia de migración con Turquía es activa"
 GRE_assertive_patrols: "El régimen de patrullas afirmativas egeo está activo"
 GRE_lost_continental_shelf_claims: "Cedió reclamaciones de la plataforma continental a Turquía"
 GRE_aegean_de_escalation: "Retrocedido del ultimátum turco"
 GRE_confederation_active: "La cadena de decisión de la Confederación está activa"
 GRE_confederation_autonomy_done: "Estructura de autonomía de la Confederación acordada"
 GRE_confederation_economy_done: "Distribución económica de la Confederación acordada"
 GRE_confederation_security_done: "Marco de seguridad acordado por la Confederación"
 GRE_defending_sovereignty: "Defender la Soberanía griega"
 GRE_defending_sovereignty_desc: "Una postura sostenida de preparación militar se centró en disuadir la invasión turca en el Egeo y sobre Chipre. La Armada Helénica y la Fuerza Aérea mantienen una mayor vigilancia, y el gasto en defensa consume recursos que de otro modo podrían ir a bienes de consumo. Este disuasivo objetivo fortalece la resolución griega pero impone un costo económico."
 GRE_aegean_naval_supremacy: "Supremacía naval Egeo"
 GRE_aegean_naval_supremacy_desc: "Las patrullas desplegadas y una presencia permanente en la superficie dan a la Armada Helénica el borde en las aguas disputadas del Egeo."
 GRE_migration_cooperation_idea: "Pacto migratorio UE-Turquía"
 GRE_migration_cooperation_idea_desc: "Turquía procesa las corrientes migratorias en su propio territorio a cambio de concesiones griegas y europeas, lo que reduce la presión sobre las islas egeas."
 GRE_migration_crisis_idea: "Crisis migratoria"
 GRE_migration_crisis_idea_desc: "Turquía se ha retirado del pacto de migración, enviando nuevas olas de llegadas a través de las instalaciones de recepción griega Egeo y abrumador."
 GRE_confederation_category: "Confederación de Chipre"
 GRE_confederation_category_desc: "Resolver las cuestiones estructurales de la confederación chipriota propuesta: autonomía, distribución económica y seguridad."
 GRE_eastern_missions_category: "Hermandad Oriental Misiones"
 GRE_eastern_missions_category_desc: "Desafíos de política recurrentes que surgen de las vías del Egeo y de Chipre."
 GRE_decide_autonomy_level: "Decidir Confederación Autonomía"
 GRE_decide_autonomy_level_desc: "Decidir si el nuevo Estado adoptará un modelo federal con instituciones centrales fuertes o una confederación más laxa que otorgue a cada comunidad amplio autogobierno."
 GRE_decide_economic_distribution: "Decidir la distribución económica"
 GRE_decide_economic_distribution_desc: "Decidir si el presupuesto federal se repartirá de forma paritaria entre las dos comunidades o se ponderará según la contribución al PIB."
 GRE_decide_security_guarantees: "Decidir garantías de seguridad"
 GRE_decide_security_guarantees_desc: "Decidir si el Estado reunificado quedará bajo el paraguas de seguridad de la OTAN o seguirá una postura de defensa neutral."
 GRE_aegean_dialogue_mission: "Diálogo egeo"
 GRE_aegean_dialogue_mission_desc: "Cada seis meses, los negociadores griegos y turcos deben decidir hasta dónde empujar sus respectivas reclamaciones. La misión termina si el diálogo se derrumba en confrontación abierta o guerra."
 greece.700.t: "Diálogo Egeo: Examen de seis meses"
 greece.700.d: "La última ronda de negociaciones ha alcanzado un tenedor familiar. Los homólogos turcos presionan para que se hagan concesiones parciales griegas en la plataforma continental a cambio de una nueva escalada. Mantener firmes preserva nuestras reivindicaciones, pero los temperamentos se debilitarán."
 greece.700.a: "Oferta concesiones medidas"
 greece.700.b: "Mantenga la línea"
 greece.701.t: "Ankara sale del Pacto de Migración"
 greece.701.d: "Citando la postura diplomática griega, las autoridades turcas han suspendido la cooperación en materia de retorno y procesamiento de migrantes. Los recién llegados ya están siendo reportados en las islas Egeas; los centros de recepción enfrentan una crisis dentro de semanas."
 greece.701.a: "Brace para el influjo"
 greece.702.t: "Aegean Incident"
 greece.702.d: "Una patrulla turca penetró en el espacio aéreo reivindicado por Grecia durante la noche. Intervinieron interceptores helénicos. No hubo disparos, pero las distancias de cierre eran peligrosamente cortas. La decisión ahora es si desactivar o empujar hacia atrás más fuerte."
 greece.702.a: "De-escalate"
 greece.702.b: "Escalar la respuesta"
 greece.703.t: "Ankara refuerza el norte de Chipre"
 greece.703.d: "Los medios de comunicación estatales turcos han confirmado un apoyo ampliado a la administración en Chipre septentrional. El movimiento parece calibrado en lugar de provocativo, una señal que Atenas no puede perseguir a Chipre en sus propios términos."
 greece.703.a: "Nota para el registro"
 greece.704.t: "Crisis de gas del Mediterráneo oriental"
 greece.704.d: "Los buques de perforación turcos han entrado en aguas Grecia y Chipre consideran una zona económica exclusiva. Atenas debe decidir si desactivar la posición o mantener el campo en riesgo de una confrontación más amplia."
 greece.704.a: "Terreno de rendimiento por ahora"
 greece.704.b: "Mantenga el campo"
 greece.705.t: "Ultimátum turco"
 greece.705.d: "Ankara ha emitido una advertencia severa: la continuación de la acción griega sobre Chipre se cumplirá con consecuencias no especificadas pero tangibles. El Ministerio de Relaciones Exteriores debe responder."
 greece.705.a: "Retrocede del borde"
 greece.705.b: "Rehusar ser intimidado"
 greece.706.t: "Rutina Airspace Incident"
 greece.706.d: "Otro sobrevuelo turco ha sido registrado y protestado a través de los canales habituales. El patrón continúa, ni el lado que desea escalar, ni dispuesto a retroceder."
 greece.706.a: "Presentar la protesta"
 greece.710.t: "Confederación: Cuestión de la autonomía"
 greece.710.d: "Los negociadores han colocado dos modelos sobre la mesa: un acuerdo federal con instituciones centrales fuertes, o una confederación que delega la mayoría de los poderes a las comunidades. La elección definirá el carácter del nuevo estado."
 greece.710.a: "Modelo federal"
 greece.710.b: "Modelo Confederal"
 greece.711.t: "Confederación: Distribución económica"
 greece.711.d: "¿Cómo se compartirán los ingresos federales? La paridad estricta tranquiliza a la comunidad más pequeña, pero una fórmula ponderada por el PIB refleja la realidad económica y sería más fácil de defender internamente."
 greece.711.a: "Distribución basada en la paridad"
 greece.711.b: "Distribución ponderada por PIB"
 greece.712.t: "Confederación: Marco de Seguridad"
 greece.712.d: "¿El estado reunificado caerá bajo el paraguas de la OTAN, o adoptará una postura neutral de defensa? Cada camino tiene sus partidarios en Atenas y Nicosia."
 greece.712.a: "Paraguas de seguridad de la OTAN"
 greece.712.b: "Posición de defensa neutral"
 greece.720.t: "Demandas de la Unión chipriota"
 greece.720.d: "Después de meses de maniobra diplomática y presión sobre Turquía, Atenas está dispuesta a emitir demandas formales para la unión de Chipre y Chipre Septentrional con Grecia. Grecia ha cultivado suficiente apoyo entre la población grecochipriota y, si Turquía ha apoyado bajo presión internacional, también se puede persuadir a los dirigentes norchipriotas. El momento de la verdad está cerca."
 greece.720.a: "Emitir las demandas"
 greece.721.t: "La guerra regresa a Chipre"
 greece.721.d: "Uno o ambos gobiernos chipriotas han rechazado las demandas de Grecia por la unión, y el conflicto militar es inminente. Ankara ha emitido confusas condenas y advertencias. El ejército turco mantiene una postura lista, pero no se ha comprometido directamente a intervenir. La comunidad internacional observa tensamente si Atenas comprometerá sus propias fuerzas armadas o seguirá apoyando encubiertamente."
 greece.721.a: "Observe la reacción"
 greece.722.t: "¿Qué tan lejos irá Atenas?"
 greece.722.d: "La República de Chipre ha rechazado la demanda sindical y el conflicto militar es inminente. Podemos armar y suministrar fuerzas pro-unión greco-chipriotas de las sombras con voluntarios y material, o comprometer abiertamente a las Fuerzas Armadas Helénicas para hacer cumplir la anexión. La primera mantiene a Grecia en las buenas gracias de la OTAN. El segundo pone a los soldados griegos en combate, requiere salir de la alianza y puede desencadenar una intervención directa turca. Pero también garantiza una rápida conquista y la integración de la isla meridional."
 greece.722.a: "Voluntarios y material sólo"
 greece.722.b: "De las Fuerzas Armadas Helénicas; declarar la guerra contra Chipre"
 greece.730.t: "Presión de la OTAN en Turquía"
 greece.730.d: "Atenas se acerca a un aliado de la OTAN, solicitando que utilicen canales diplomáticos para persuadir a Turquía de moderar su postura agresiva en el Egeo. Tal presión de una potencia occidental podría persuadir a Ankara para que reconsidere su postura."
 greece.730.a: "Párese con Atenas"
 greece.730.b: "Esta no es nuestra pelea."
 greece.731.t: "Apoyo aliado seguro"
 greece.731.d: "Nuestro socio de la OTAN ha acordado involucrar a Ankara en el asunto de las tensiones egeas. El apoyo diplomático de Occidente debe ayudar a aliviar el enfrentamiento y reivindicar nuestra posición asertiva."
 greece.731.a: "Una victoria diplomática"
 greece.732.t: "Nuestra solicitud fue rechazada"
 greece.732.d: "El aliado de la OTAN ha rechazado educadamente entablar conversaciones directas con Turquía sobre las controversias egeas. Prefieren permanecer neutrales en asuntos marítimos bilaterales."
 greece.732.a: "Quedamos resueltos."
 greece.733.t: "Propuesta de integración económica chipriota"
 greece.733.d: "Atenas propone una profunda integración económica con la República de Chipre, incluyendo una unión aduanera, armonización bancaria y política energética coordinada. Tales vínculos vincularían estrechamente a la isla con la economía griega al tiempo que aumentaban los niveles de vida en Nicosia."
 greece.733.a: "Integrar con Grecia"
 greece.733.b: "Preserve nuestra autonomía"
 greece.734.t: "Chipre acepta la integración"
 greece.734.d: "Nicosia ha aceptado la propuesta. Las empresas grecochipriotas y chipriotas están armonizando las normas, los sistemas bancarios se están consolidando y las corrientes de inversión compartidas en todo el Egeo. La unión económica fortalece la mano de Atenas en cualquier futuro arreglo político."
 greece.734.a: "La unidad produce prosperidad"
 greece.735.t: "Chipre declina la integración profunda"
 greece.735.d: "Nicosia ha rechazado respetuosamente el ofrecimiento de profunda integración económica. La República de Chipre prefiere mantener su independencia en materia económica por ahora, incluso a costa del crecimiento más lento."
 greece.735.a: "Seguimos comprometidos"
 greece.736.t: "Proyecto de desarrollo del gas Mediterráneo oriental"
 greece.736.d: "Atenas propone el desarrollo conjunto de campos de gas natural offshore en las aguas al sur de Chipre y al este de Creta. Un programa de extracción compartido aumentaría las economías y generaría ingresos energéticos a largo plazo."
 greece.736.a: "Desarrollar juntos los campos"
 greece.736.b: "Demasiado provocativo por ahora"
 greece.737.t: "Chipre Gas Fields Commence Operations"
 greece.737.d: "Las plataformas de perforación grecochipriotas y chipriotas han comenzado a extraer gas natural de los campos conjuntos. La nueva capacidad de refinación viene en línea y ambas economías se benefician de ingresos energéticos sostenidos. El movimiento envía una señal a Ankara que los griegos están dispuestos a desarrollar su Zona Económica Exclusiva independientemente de las objeciones turcas."
 greece.737.a: "Recursos seguros nuestro futuro"
 greece.738.t: "Chipre rechaza la Ventura de Gas"
 greece.738.d: "La República de Chipre se ha negado a participar en el desarrollo conjunto del gas, temiendo el retroceso diplomático de Turquía. Atenas no forzará el tema."
 greece.738.a: "Una oportunidad perdida"
 greece.739.t: "Divulgación a turcochipriotas"
 greece.739.d: "Atenas extiende una mano económica y cultural a la comunidad turcochipriota en el norte. Atenas ofrece inversiones, privilegios comerciales y programas de intercambio cultural, demostrando que la reunificación bajo los auspicios griegos sirve tanto a los intereses del norte como a la parte grecochipriota."
 greece.739.a: "Aceptar la inversión griega"
 greece.739.b: "Seguimos siendo cuidadosos."
 greece.740.t: "Chipre Septentrional acoge la inversión"
 greece.740.d: "El liderazgo turcochipriota ha aceptado la inversión griega y vínculos económicos más estrechos. El dinero fluye hacia el norte, las asociaciones empresariales se forman y la influencia cambia gradualmente a favor de Atenas. Las bases para la eventual reunificación crecen más firmes para el mes."
 greece.740.a: "Semillas plantadas para la unidad"
 greece.741.t: "Norte de Chipre rechaza la extensión"
 greece.741.d: "La comunidad turcochipriota, atendida por las intenciones griegas, ha reducido el conjunto de medidas de inversión. El apoyo de Ankara sigue siendo su escudo, y las overturas de Atenas no los han persuadido de otra manera."
 greece.741.a: "Otro revés"
 greece.742.t: "Soberana Acuerdo de Bases propuesto"
 greece.742.d: "Atenas pide que el Reino Unido transfiera el control de las Soberanas Zonas Bases de Akrotiri y Dhekelia. A cambio, Grecia ofrece una indemnización, un acceso continuado de la OTAN y garantías para preservar las instalaciones militares británicas. La transferencia de estas bases constituiría un nuevo equilibrio estratégico en Chipre."
 greece.742.a: "Cede las bases a Grecia"
 greece.742.b: "Las bases permanecen británicas"
 greece.743.t: "Reino Unido está de acuerdo en transferirse"
 greece.743.d: "Londres ha decidido que transferir las bases sirve los intereses a largo plazo de ambas naciones. Las fuerzas griegas ocupan ahora Akrotiri y Dhekelia, y Atenas gana profundidad estratégica y control sobre los principales aeródromos y puertos. El turno propina el equilibrio militar decisivamente a favor de la Enosis."
 greece.743.a: "Una adquisición histórica"
 greece.744.t: "Transferencia de Diclinas del Reino Unido"
 greece.744.d: "El gobierno británico se ha negado a renunciar a las Soberanas Zonas Base. Siguen siendo territorio británico e instalaciones militares británicas, como lo han hecho desde 1960."
 greece.744.a: "Nuestras manos están atadas."
 GRE_western_commitment: "Alineación occidental griega"
 GRE_western_commitment_tt: "$GRE_western_commitment$: $RIGHT|+=0Y$"
 greece.745.t: "La Campaña de Presión Concluye"
 greece.745.d: "La campaña para presionar a Turquía sobre Chipre ha concluido. Varios grandes poderes han expresado su apoyo a la posición griega, citando la necesidad de estabilidad en el Mediterráneo oriental y los derechos del pueblo chipriota. Atenas tiene ahora un gran apalancamiento diplomático. Sobre la base del número de voces aliadas, Ankara tiene una posibilidad [GRE_GetTurkeyConcessionChance] de retroceder y aceptar una menor influencia sobre Chipre. Si Turquía se niega, las tensiones se elevarán a través del Egeo."
 greece.745.a: "Vea cómo responde Ankara"
 greece.724.t: "Atenas exige unión"
 greece.724.d: "El gobierno griego ha exigido formalmente que la República de Chipre se someta a la unión con Grecia. La oferta es clara: unirse voluntariamente, y la transición será suave y próspera. Basado en el sentimiento griego-chipriota y la influencia turca, las probabilidades de aceptación se sitúan en [GRE_GetCyprusAcceptanceChance]. El gobierno de Nicosia se enfrenta a una opción histórica."
 greece.724.a: "Aceptar unión con Grecia"
 greece.724.b: "Rechazar la demanda"
 greece.725.t: "Atenas exige el envío norte"
 greece.725.d: "Grecia ha prestado ahora su atención a Chipre Septentrional, exigiendo que los dirigentes turcochipriotas acepten también la unión con Atenas. La posición turcochipriota es más complicada: el norte ha dependido desde hace mucho tiempo de la protección militar turca y los vínculos culturales. Las probabilidades de aceptación se sitúan en [GRE_GetNorthernCyprusAcceptanceChance], moduladas por si Turquía ha retrocedido bajo la presión de la OTAN y por la profundidad del impulso griego-cipriota. Si Chipre Septentrional se niega, la isla sigue dividida y es probable que exista un conflicto armado."
 greece.725.a: "Aceptar unión con Grecia"
 greece.725.b: "Buscar protección turca; rechazar la demanda"
 greece.726.t: "¿Qué tan lejos irá Atenas?"
 greece.726.d: "Chipre Septentrional se niega a presentar voluntariamente, y el gobierno turcochipriota señala que buscará apoyo militar turco para resistir la absorción. Grecia ahora se enfrenta a una opción: continuar con la ayuda encubierta a las fuerzas prosindicas y esperar que la situación resuelva pacíficamente, o comprometer directamente a las Fuerzas Armadas Helénicas a anexar el norte por la fuerza. La acción militar directa significa salir de la OTAN, ya que la alianza no respaldará una guerra ofensiva para tomar territorio de la esfera de influencia de un miembro de la OTAN."
 greece.726.a: "Voluntarios y material sólo"
 greece.726.b: "De las Fuerzas Armadas Helénicas; declarar la guerra contra Chipre septentrional"
 greece.723.t: "Cyprus Reunified"
 greece.723.d: "Los dos estados chipriotas han sido unificados bajo la bandera griega. Ambos territorios del sur y el norte están ahora plenamente incorporados a Grecia como estados cored. Por primera vez desde 1974, la isla está entera bajo una sola autoridad. Esta es la culminación de décadas del nacionalismo chipriota y las ambiciones irredentistas griegas: enosis alcanzada por fin."
 greece.723.a: "Un día histórico para el helenismo"
