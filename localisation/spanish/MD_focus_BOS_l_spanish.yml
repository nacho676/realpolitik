 BOS_ATTITUDE_TOOLTIP: "§YConfía§! mide hasta qué punto un grupo constituyente se encuentra con el gobierno central, de §tHostile§! a §gIndiferente§! y §GAmén§! a §GLoyal§!. Los grupos hostiles pueden demostrar y bloquear caminos políticos, mientras que los valores combinados modifican nacional Estabilidad."
 bos_srpska_gui_info_TOOLTIP: "§YSerbs§! reside principalmente en la República Srpska, una parte de tierra que abraza a la Federación de Bosnia y Herzegovina desde el este y el norte. La República Srpska es una entidad autónoma dentro de Bosnia y Herzegovina. Son predominantemente ortodoxos en la fe."
 bos_bosniak_gui_info_TOOLTIP: "§YLos bosniacos§! son un grupo étnico que comparte conjuntamente la entidad de la Federación de Bosnia y Herzegovina para no confundirse con el nombre del país de Bosnia y Herzegovina. Su mayoría residen en Bosnia central y son predominantemente musulmanes en la fe."
 bos_croat_gui_info_TOOLTIP: "Los §Ycroatas§! son el grupo minoritario dentro de la Federación de Bosnia y Herzegovina. Viven principalmente en la región suroeste de Bosnia, a lo largo de la frontera de la costa sur de Croacia. Son predominantemente católicos en su fe."
