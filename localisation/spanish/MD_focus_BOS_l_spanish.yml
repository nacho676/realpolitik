 BOS_mechanization_of_the_army_desc: "La movilidad protegida permitirá que un pequeño ejército mueva las reservas rápidamente y sobreviva en un campo de batalla moderno."
 BOS_boots_on_the_ground_desc: "Bosnia puede centrar su defensa en infantería capacitada, posiciones preparadas y una amplia reserva en lugar de vehículos caros."
 BOS_national_high_command_desc: "Un alto mando conjunto colocará a los ejércitos de la entidad bajo la autoridad civil nacional y establecerá normas comunes de planificación."
 BOS_aerial_dominance_desc: "Un programa de aviación de combate priorizará la preparación de los combatientes, la calidad piloto y el control del espacio aéreo bosnio."
 BOS_transportation_methods_desc: "Los vehículos de utilidad modernos y los procedimientos logísticos mejorarán la velocidad de despliegue y reducirán las fallas de suministro."
 BOS_rifle_advancements_desc: "Los rifles de servicio modernos, la armadura corporal y los métodos de producción mejorarán la eficacia de la infantería y el suministro doméstico."
 BOS_wave_tactics_desc: "Una doctrina de reserva pesada utilizará formaciones concentradas de infantería para mantener el terreno y absorber presión sostenida."
 BOS_civilian_training_desc: "La instrucción ampliada de las reservas preparará a los civiles para la movilización sin mantener una fuerza permanente inalcanzable."
 BOS_restoration_of_old_aircraft_desc: "La reparación de helicópteros heredados y la reconstrucción de una base aérea restaurarán una capacidad limitada de aviación de transporte."
 BOS_aircraft_acquiring_desc: "Los combatientes rusos ofrecen una ruta rápida para combatir la aviación, aunque los costes de adquisición y bastión desprevendrán el tesoro."
 BOS_personal_carriers_desc: "Los vehículos de combate de infantería completarán la transición del transporte motorizado a unidades de armas combinadas protegidas."
 BOS_resupply_equipment_desc: "Las radios modernas, las armas de apoyo y el equipo logístico harán que las unidades de primera línea sean más autosuficientes."
 BOS_artillery_refurbishment_desc: "Renovar las armas heredadas y estandarizar las municiones restaurará el apoyo fiable a los incendios."
 BOS_small_arms_purchase_desc: "Los fusiles extranjeros pueden llenar la escasez inmediata de existencias mientras se reorganiza la producción nacional."
 BOS_mobilization_requirements_desc: "Las obligaciones de reserva claras y los procedimientos de llamada permitirán que el gobierno amplíe el ejército durante una emergencia."
 BOS_combine_the_armies_desc: "La integración completa disolverá los comandos de entidad paralela y creará una única cadena nacional de mando."
 BOS_great_level_of_cooperation_desc: "Las formaciones de las Entidades pueden conservar tradiciones distintas al tiempo que adoptan la planificación conjunta, la capacitación y la adquisición."
 BOS_the_land_fleet_desc: "Los estándares de vehículos comunes consolidarán los transportes, transportistas y vehículos de apoyo en una fuerza mecanizada sostenible."
 BOS_main_battle_line_desc: "Las armas antiaérmicas y las reservas móviles permitirán a Bosnia contrarrestar formaciones más pesadas sin financiar una gran flota de tanques."
 BOS_streamline_production_desc: "Los contratos estandarizados y los métodos de montaje reducirán el costo del suministro de equipo de infantería."
 BOS_provide_equipment_updates_desc: "Un ciclo de modernización programado mantendrá los rifles y las armas compatibles entre las fuerzas armadas."
 BOS_general_staff_reforms_desc: "La planificación profesional, los procedimientos comunes del personal y el equipo de protección moderno sustituirán la improvisación en tiempo de guerra."
 BOS_aerial_cooperation_desc: "Los comandos de defensa aérea y aviación compartirán datos de vigilancia, planes de bastión y control operativo."
 BOS_officer_training_desc: "Un plan de estudios nacional de oficiales construirá un cuerpo profesional leal a las instituciones estatales en lugar de los comandos de entidades."
 BOS_military_drills_desc: "Los ejercicios conjuntos pondrán a prueba la nueva estructura de mando y expondrán los fallos restantes en coordinación."
 BOS_prepping_an_offensive_desc: "Los oficiales de Estado Mayor determinarán un eje decisivo de los suministros anticipados y almacenados antes de la próxima fase de la guerra civil."
 BOS_bosnian_elections_desc: "La crisis financiera mundial ha expuesto la dependencia de Bosnia del crédito extranjero, las exportaciones débiles y las instituciones divididas. El gobierno debe elegir una política de recuperación antes de que la caída se arrastre."
 BOS_economic_revision_desc: "La política fiscal debe revisarse para financiar la recuperación sin suprimir la inversión o la demanda del hogar."
 BOS_post_war_effort_desc: "La reconstrucción inacabada, las comunidades desplazadas y las instituciones dañadas siguen limitando el desarrollo años después de la guerra."
 BOS_rally_the_troops_desc: "Los comandantes locales recordarán a los reservistas y reconstruirán unidades agotadas por las batallas de apertura."
 BOS_commence_the_offensives_desc: "Los ataques coordinados explotarán los preparativos realizados por nuestros comandos de campo y forzarán al enemigo de posiciones clave."
 BOS_dig_in_desc: "Posiciones fortificadas y líneas de retroceso preparadas preservarán nuestras fuerzas si los puestos ofensivos."
 BOS_detain_serbian_generals_desc: "La persecución de oficiales acusados de crímenes de guerra fortalecerá la confianza internacional y el estado de derecho, pero aumentará la resistencia en la República Srpska."
 BOS_release_serbian_generals_desc: "La liberación de oficiales serbios detenidos apoyará la reconciliación con la República Srpska y Serbia, a pesar de las críticas de los grupos de víctimas."
 BOS_grant_more_rights_to_serbian_peoples_desc: "Las garantías más fuertes para la representación serbia pueden reducir la presión separatista y la inversión directa hacia las comunidades desatendidas."
 BOS_oppress_serbian_back_supports_desc: "Los fabricantes de motores extranjeros pueden proporcionar empleos y capital productivo, pero su influencia dará forma a la política industrial de Bosnia."
 BOS_the_state_desc: "Se necesitan instituciones nacionales capaces de coordinar la recuperación respetando la división constitucional de Bosnia."
 BOS_grant_herzegovinians_more_rights_desc: "El aumento de la financiación de la policía mejorará la seguridad y la ejecución locales, aunque los gastos añadidos cargarán el presupuesto nacional."
 BOS_limit_herzegovinians_desc: "La reducción de los gastos policiales preservará los fondos públicos, pero la aplicación más débil puede permitir que la delincuencia organizada se amplíe."
 BOS_mobilize_the_nation_desc: "La movilización de emergencia ampliará el grupo de reemplazos capacitados a disposición de las fuerzas armadas."
 BOS_request_military_supplies_desc: "Turquía y Albania pueden proporcionar armas de infantería, pero cada gobierno decidirá si puede evitar el equipo."
 BOS_bosnians_will_lead_the_military_desc: "Un comando civil nacional completará el programa de recuperación a favor de la integración y pondrá fin a las medidas financieras de emergencia."
 BOS_anti_serbian_propaganda_desc: "La nacionalización de las tenencias industriales extranjeras ampliará el control estatal, pero dañará la confianza del inversionista y las relaciones con Alemania."
 BOS_improve_road_quality_in_sarajevo_desc: "Reparar la red vial de Sarajevo reconectará los barrios, reducirá las demoras en el flete y apoyará nuevas inversiones del sector de servicios."
 BOS_improvement_of_the_health_care_system_desc: "Una norma nacional de atención de la salud ampliará el acceso y sustituirá al sistema fragmentado de posguerra."
 BOS_secure_regional_support_for_government_desc: "Un gobierno estable requiere la cooperación de los dirigentes municipales y de las entidades, no sólo una mayoría parlamentaria en Sarajevo."
 BOS_crackdown_of_anti_war_propaganda_desc: "La censura y contrapropaganda en tiempos de guerra mantendrán la resolución pública a costa del debate político abierto."
 BOS_formation_of_a_junta_desc: "Un consejo militar puede imponer la unidad en el esfuerzo de guerra, pero las instituciones civiles perderán el control del estado."
 BOS_removal_of_the_dayton_accords_desc: "Reformar el sistema Dayton transferirá más responsabilidad a las instituciones nacionales preservando al mismo tiempo las protecciones del acuerdo de paz."
 BOS_post_war_clean_up_desc: "Borrar ruinas, municiones sin detonar y sitios abandonados preparará regiones dañadas para la reconstrucción."
 BOS_improve_service_industry_desc: "Las oficinas modernas, los servicios públicos fiables y los impuestos comerciales más bajos ayudarán a Sarajevo a desarrollar una economía de servicio competitiva."
 BOS_improvement_of_the_education_system_desc: "Las normas comunes de educación y mejores escuelas mejorarán las aptitudes al tiempo que limitarán la corrupción en la administración pública."
 BOS_banja_luka_mine_desc: "Los modernos equipos y estándares de seguridad pueden devolver el sector minero de Banja Luka a una producción rentable."
 BOS_farming_sector_desc: "La remoción de minas y la inversión agrícola ayudarán a las granjas familiares a modernizar y suministrar mercados nacionales."
 BOS_end_nato_desc: "El gobierno islamista desafiará la posición regional de la OTAN y se preparará para una confrontación que puede no ser capaz de controlar."
 BOS_national_appeasement_desc: "Un programa de reconciliación mejorará las relaciones entre los bosnios, croatas y serbios y comprometerá al gobierno a una reforma constitucional pacífica."
 BOS_role_the_dice_desc: "Los dirigentes de la República Srpska pueden forzar una rápida consolidación, aceptar graves inestabilidades y un nuevo riesgo de conflicto civil."
 BOS_popular_support_desc: "Un mandato negociado entre los tres pueblos constitutivos dará al gobierno dirigido por la República Srpska una vía más segura para reformar."
 BOS_develop_national_sentiment_desc: "Una campaña patriótica sostenida reforzará el régimen de tiempos de guerra y mantendrá intacta la movilización nacional."
 BOS_land_mine_removal_desc: "Un programa nacional de remoción de minas mapeará las tierras contaminadas, capacitará a los equipos de limpieza y reducirá el costo humano continuo de la guerra."
 BOS_rebuild_infrastructure_in_sarajevo_desc: "La reconstrucción en Sarajevo reforzará la red eléctrica de la capital y reabrirá su terminal ferroviario, señalando que la recuperación nacional sigue siendo una prioridad."
 BOS_rebuild_infrastructure_in_srpska_desc: "La reconstrucción de la red en Banja Luka y la terminal ferroviaria de Bijeljina conectarán las comunidades de la República Srpska a los mercados e instituciones nacionales."
 BOS_rebuild_infrastructure_in_herzegovina_desc: "Una red reforzada y una terminal ferroviaria de trabajo en Herzegovina mejorarán el acceso a Mostar y reactivar el comercio en todo el sur."
 BOS_build_a_war_memorials_desc: "Los monumentos reconocerán pérdidas civiles y militares al tiempo que darán a las comunidades lugares para el recuerdo público."
 BOS_make_way_for_more_industry_desc: "La minería y la agricultura pueden apoyar una base industrial rural más amplia si ambos sectores reciben la preparación necesaria."
 BOS_military_industrialization_desc: "Una planta de armas calculada en Sarajevo apoyará el rearme, siempre que la economía pueda financiarla."
 BOS_autonomy_advancements_desc: "La liberación de Herzegovina y la República Srpska como sujetos autónomos formalizará el autogobierno de las entidades dentro de Bosnia."
 BOS_cooperative_effort_desc: "Un programa cooperativo de la República Srpska preservará las instituciones federales y promoverá la alineación oriental mediante el consentimiento en lugar de coacción."
 BOS_removal_of_lands_in_herzegovina_desc: "Los equipos de remoción reabrirán tierras contaminadas en Herzegovina para su asentamiento, agricultura y transporte."
 BOS_removal_of_lands_in_central_bosnia_desc: "La remoción de minas de Bosnia central protegerá a sus comunidades densas y restaurará las tierras productivas."
 BOS_removal_of_lands_in_central_srpska_desc: "La remoción de minas en la República Srpska central hará que los distritos rurales dañados sean seguros para su recuperación."
 BOS_rebuild_factories_in_sarajevo_desc: "Una fábrica civil reconstruida y una infraestructura de apoyo restaurarán el empleo industrial en Sarajevo."
 BOS_the_repair_of_srpska_and_herzegovina_desc: "La inversión industrial e infraestructura equilibrada en la República Srpska y Herzegovina demostrará que la recuperación se extiende más allá de Sarajevo."
 BOS_national_unrest_desc: "La estabilidad de caída y la hostilidad comunitaria han abierto un camino para que las organizaciones sindicales desafieran a ambos bloques nacionalistas."
 BOS_state_opposition_desc: "Una oposición cívica impugnará a los partidos nacionalistas de la República Srpska mediante elecciones, equilibrando la autoridad federal contra el riesgo de que se siga alienando a los votantes serbios."
 BOS_eastern_trade_bloc_desc: "Los acuerdos comerciales mutuos con Rusia y Serbia convertirán la alineación política en un acceso comercial sostenido."
 BOS_commence_centralization_desc: "Las autoridades de la República Srpska transferirán poderes a las entidades al gobierno central y suprimirán los centros constitucionales competidores."
 BOS_national_agenda_desc: "Un programa legislativo compartido combinará la estabilidad social, la reforma fiscal y el reconocimiento de los tres pueblos constituyentes."
 BOS_final_land_mine_removal_efforts_desc: "Coordinar los programas regionales despejará los campos minados restantes y cerrará la campaña de remoción de minas después de la guerra de Bosnia."
 BOS_workers_front_desc: "Un Frente de Trabajadores organizará sindicatos descontentos en una fuerza política nacional con su propio programa económico."
 BOS_national_unity_desc: "Las entidades volverán a la administración nacional directa después de una transición negociada, restaurando un estado federal pluralista."
 BOS_cooperative_alliance_desc: "Rusia decidirá si la asociación oriental de Bosnia justifica la admisión a la OCS."
 BOS_introduction_of_mandatory_conscription_desc: "El servicio obligatorio ampliará la reserva a costa de una obligación más pesada en los hogares y empleadores."
 BOS_decrease_poverty_rate_desc: "El gasto social orientado reducirá la pobreza y estabilizará a las comunidades desatendidas durante la recuperación posterior a la guerra."
 BOS_the_teachings_of_orthodox_desc: "La cooperación con el clero ortodoxo fortalecerá el pacto social oriental al tiempo que desplazará a las instituciones islámicas del gobierno."
 BOS_concessions_to_the_work_unions_new_desc: "Un pacto sindical vinculante cambiará el gasto social y los derechos laborales para la estabilidad política."
 BOS_puppet_economics_new_desc: "Los consejos de trabajo recibirán un papel formal en la gestión, mientras que el nuevo sistema financia impuestos corporativos superiores."
 BOS_religious_identity_desc: "El Estado islamista reivindicará el liderazgo de las comunidades bosnias más allá de sus fronteras y preparará una política regional coercitiva."
 BOS_tax_reforms_desc: "La baja tasa de impuestos de las familias y las empresas ampliará el apoyo político al reducir los ingresos inmediatos del Estado."
 BOS_state_atheism_new_desc: "El gobierno obrero eliminará el privilegio religioso de las instituciones estatales, ganando la libertad administrativa a expensas del clero."
 BOS_mechanical_production_new_desc: "La producción mecanizada y el entrenamiento técnico aumentarán la productividad y completarán la transición industrial de la economía obrera."
 BOS_land_doctrine_desc: "Bosnia necesita una doctrina defensiva apta para terrenos montañosos, mano de obra limitada y un presupuesto modesto."
 BOS_gain_croat_popular_support: "Ganar el apoyo popular croata"
 BOS_destabilize_the_government: "Desestabilizar al gobierno"
