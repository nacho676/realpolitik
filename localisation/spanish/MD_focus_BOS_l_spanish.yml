 BOS_motor_influence_tt: "Un fabricante extranjero ganará §Rinfluencia§! sobre Bosnia a cambio de la inversión."
 BOS_union_serbia_accept_tt: "Serbia incorpora Bosnia y toma el control de sus fuerzas armadas."
 BOS_union_serbia_reject_tt: "Bosnia sigue siendo independiente y las relaciones con Serbia se deterioran."
 BOS_military_supplies_accept_tt: "Un país que responde envía armas de infantería a Bosnia."
 BOS_military_supplies_reject_tt: "Un país que responde puede preservar su arsenal, empeorando las relaciones con Bosnia."
 BOS_turkish_supplies_accept_tt: "Turquía envía 2.500 armas de infantería de su arsenal a Bosnia."
 BOS_albanian_supplies_accept_tt: "Albania envía 750 armas de infantería de su arsenal a Bosnia."
 BOS_military_supplies_decline_tt: "Bosnia no recibe ningún equipo de nosotros y verá la negativa."
 BOS_civil_war_over: "La Guerra Civil de Bosnia ha terminado"
 civil_war_focus: "En la guerra civil"
 BOS_air_chief: "Estado Mayor de la Fuerza Aérea de Bosnia"
 BOS_air_chief_desc: "Un estado mayor aéreo conjunto coordina la limitada aviación de combate de Bosnia, los helicópteros de transporte y las necesidades de apoyo terrestre."
 novica_simic: "Novica Simić"
 novica_simic_desc: "Un alto comandante serbio bosnio se centró en la defensa territorial y preservar la preparación de combate."
 cvjetko_savic: "Cvjetko Savić"
 cvjetko_savic_desc: "Un oficial de reforma se centró en reconstruir la estructura de mando de la posguerra de Bosnia."
 novak_dukic: "Novak Đukić"
 novak_dukic_desc: "Un experimentado comandante de campo se adecua a operaciones especiales y terrenos difíciles."
 miladin_milojcic: "Miladin Milojčić"
 miladin_milojcic_desc: "Un funcionario se centró en la maniobra, la movilidad y la planificación operacional."
 anto_jelec: "Anto Jeleč"
 anto_jelec_desc: "Un comandante croata bosnio experimentó en operaciones defensivas y organización de la fuerza."
 senad_masovic: "Senad Mašović"
 senad_masovic_desc: "Un oficial profesional se centró en las normas de capacitación y la integración militar."
 BOS_operation_althea: "Operación Althea"
 BOS_operation_althea_desc: "La Operación Althea es la misión de la Unión Europea que sucedió a la SFOR en 2004. Apoya el acuerdo de Dayton y traspasa la responsabilidad de seguridad a las instituciones bosnias."
 BOS_draft_EUFOR: "Proyecto de EUFOR"
 BOS_draft_EUFOR_desc: "Reemplazar el mandato de la SFOR, liderada por la OTAN y a punto de expirar, por una misión de mantenimiento de la paz liderada por la UE."
 BOS_demand_eufor_withdrawal: "Retirada de la EUFOR"
 BOS_demand_eufor_withdrawal_desc: "Reducir la presencia militar internacional y poner a prueba si Bosnia puede sostener una seguridad interna independiente."
 BOS_SFOR_title: "La Fuerza de Estabilización en Bosnia y Herzegovina"
 BOS_SFOR_title_desc: "La Fuerza de Estabilización liderada por la OTAN impone las disposiciones militares del Acuerdo de Dayton y apoya la seguridad de la posguerra en Bosnia. Su mandato puede ampliarse durante una crisis o reducirse a medida que se recuperen las instituciones nacionales."
 BOS_peacekeeper_oversight: "De mantenimiento de la paz"
 BOS_peacekeeper_oversight_desc: "Las misiones europeas permanecen en Bosnia mientras las reformas van por detrás de las necesidades de seguridad interna."
 BOS_civil_war_operations: "Operaciones de guerra civil"
 BOS_civil_war_operations_desc: "Coordinar acciones de emergencia en tiempos de guerra en las zonas de conflicto mientras Bosnia siga en guerra civil."
 BOS_rotating_presidency: "Presidencia Rotating"
 BOS_rotating_presidency_desc: "La presidencia de Bosnia gira entre los representantes bosnio, croata y serbio. El arreglo limita la dominación de un grupo constitutivo, pero las transferencias frecuentes de autoridad pueden interrumpir la legislación.\n\nActitud serbia: [ROOT.BOS_srpska_attitude]\nActitud bosniaca: [ROOT.BOS_bosniak_attitude]\nActitud croata: [ROOT.BOS_croat_attitude]"
 BOS_more_sfor: "Solicitar una prórroga de la SFOR"
 BOS_more_sfor_desc: "Pedir a la OTAN que amplíe el mandato de la SFOR mientras Bosnia siga inestable política o económicamente."
 BOS_lower_sfor: "Solicitar una reducción del plazo de la SFOR"
 BOS_lower_sfor_desc: "Acortar el mandato de la SFOR mientras las instituciones de Bosnia se preparan para asumir plena responsabilidad de seguridad."
 BOS_attack_upon_nato_desc: "Las fuerzas de Bosnia están en una grave desventaja operacional contra los miembros de la OTAN."
 BOS_sfor_vol_troops: "Compromiso de Voluntarios de la SFOR"
 BOS_sfor_vol_troops_desc: "Los participantes en el mantenimiento de la paz pueden desplegar rápidamente voluntarios si Bosnia regresa a la guerra civil."
 BOS_SER_vol_troops: "Compromiso de Voluntarios de Serbia"
 BOS_SER_vol_troops_desc: "Serbia puede desplegar rápidamente voluntarios para apoyar a la República Srpska en un nuevo conflicto bosnio."
 BOS_idea_muslim_nationalism: "Nacionalismo musulmán mobilizado"
 BOS_idea_muslim_nationalism_desc: "El nacionalismo religioso apoya la movilización y la intervención extranjera al endurecer el régimen contra el cambio político."
 BOS_idea_srpska_supremacy: "Srpska Supremacy"
 BOS_idea_srpska_supremacy_desc: "Las instituciones de la República Srpska dominan el Estado y dirigen su política de recursos, pero el intercambio de poder ha terminado efectivamente."
 BOS_dominant_entity_idea: "Entidad dominante"
 BOS_dominant_entity_idea_desc: "El control de la República Srpska del estado central mantiene al gobierno y lo endurece contra la influencia política extranjera."
 BOS_workers_front_idea: "Frente de Trabajadores"
 BOS_workers_front_idea_desc: "El trabajo organizado se ha convertido en una fuerza política independiente. Su movilización fortalece al gobierno mientras desajusta las instituciones existentes."
 BOS_workers_compact: "Pacto de la Unión Nacional"
 BOS_workers_compact_desc: "El Estado ha garantizado los derechos laborales y el gasto social a cambio de la paz laboral y mayores costos operativos."
 BOS_worker_managed_economy: "Economía gestionada por el trabajador"
 BOS_worker_managed_economy_desc: "Los consejos de trabajo comparten autoridad con los administradores de empresas. El sistema eleva recibos de impuestos pero inicialmente interrumpe la producción industrial."
 BOS_mechanical_modernization: "Modernización mecánica"
 BOS_mechanical_modernization_desc: "La maquinaria moderna y la formación técnica han convertido la gestión de los trabajadores en un modelo industrial más productivo."
 BOS_workers_republic_idea: "Trabajadores de la República"
 BOS_workers_republic_idea_desc: "Los delegados del Consejo dirigen el estado y su industria. El orden socialista establecido acelera la construcción y administración pública."
 BOS_idea_prepping_an_offensive: "Preparado ofensivo"
 BOS_idea_prepping_an_offensive_desc: "Suministros almacenados y planes detallados de personal mejoran temporalmente la preparación operacional."
 BOS_idea_commence_the_offensives: "Momento ofensivo"
 BOS_idea_commence_the_offensives_desc: "Las fuerzas armadas están comprometidas con una ofensiva coordinada en todo el frente de la guerra civil."
 BOS_idea_rally_the_troops: "Tropas destrozadas"
 BOS_idea_rally_the_troops_desc: "Las formaciones de reserva y los reclutas locales sostienen el apoyo público para el esfuerzo de guerra."
 BOS_idea_mobilize_the_nation: "Movilización nacional"
 BOS_idea_mobilize_the_nation_desc: "La movilización de emergencia acelera las operaciones militares y la producción de equipo de infantería con licencia."
 BOS_idea_dig_in: "Defensas preparadas"
 BOS_idea_dig_in_desc: "Los ingenieros y las unidades de campo están preparando rápidamente posiciones defensivas."
 BOS_idea_fight_or_perish: "Luchar o Perish"
 BOS_idea_fight_or_perish_desc: "El gobierno está aprovechando mano de obra adicional para prevenir la derrota en la guerra civil."
 BOS_idea_national_sentiment: "Sentimiento nacional de tiempos de guerra"
 BOS_idea_national_sentiment_desc: "La propaganda estatal sostiene la movilización nacionalista durante el conflicto."
 BOS_religious_identity_idea: "Identidad religiosa"
 BOS_religious_identity_idea_desc: "El gobierno define el estado a través de instituciones islámicas y un programa nacionalista religioso."
 BOS_low_police_budget: "Bajo presupuesto policial"
 BOS_low_police_budget_desc: "La reducción de la financiación policial reduce los gastos rutinarios, pero debilita la respuesta del Estado al crimen organizado."
 BOS_bosniak_balkan_aspiration_desc: "Las fuerzas bosniacas se movilizan para preservar el estado y derrotar a los ejércitos serbios y croatas de fuga."
 BOS_srpska_balkan_aspiration_desc: "La República Srpska se moviliza para derrotar al gobierno central de Bosnia y a las fuerzas croatas en competencia."
 BOS_croat_balkan_aspiration_desc: "Las fuerzas croatas de Bosnia se movilizan para asegurar su territorio contra los ejércitos bosnio y serbio."
 BOS_police_high_desc: "La financiación ampliada de la policía mejora la ejecución y el control político a un costo fiscal sustancial."
 BOS_air_doctrine_review: "Aire Doctrine Review"
 BOS_air_doctrine_review_desc: "Los estudios y ejercicios temporales del personal están acelerando la adopción de una doctrina aérea práctica."
 BOS_internal_investment_desc: "Los incentivos a la inversión nacional apoyan la industria civil al tiempo que reducen la proporción de productos que se desvía del uso productivo."
 BOS_crime_increase_desc: "Las escasas fuerzas de seguridad han permitido que la delincuencia organizada se expanda, aumentando los costos administrativos y de consumo."
 BOS_idea_mechanization_of_the_army: "Ejército mecanizado"
 BOS_idea_mechanization_of_the_army_desc: "Los vehículos protegidos y la planificación móvil dan al pequeño ejército de Bosnia mayor alcance operacional a un costo de personal manejable."
 BOS_idea_transportation_methods: "Transporte del Ejército Moderno"
 BOS_idea_transportation_methods_desc: "Los vehículos utilitarios estándar y los helicópteros de transporte reducen el costo y la complejidad de la logística militar."
 BOS_idea_the_land_fleet: "Flota mecanizada integrada"
 BOS_idea_the_land_fleet_desc: "Las familias de vehículos comunes apoyan una fuerza equilibrada de transportes y portaaviones blindados sin exceso de adquisición."
 BOS_idea_aerial_dominance: "Aérea"
 BOS_idea_aerial_dominance_desc: "Bosnia está invirtiendo en preparación para los combates, calidad piloto y estrecha coordinación con las fuerzas terrestres."
 BOS_idea_air_defence_initiative: "Iniciativa de defensa aérea"
 BOS_idea_air_defence_initiative_desc: "Las defensas aéreas terrestres y la vigilancia proporcionan un escudo creíble para las ciudades, bases y formaciones de campo."
 BOS_idea_apc_armament: "Blindaje Transportadores de personal"
 BOS_idea_apc_armament_desc: "Los transportistas blindados estandarizados mejoran la protección de la infantería y la movilidad combinada de armas."
 BOS_idea_main_battle_line: "Moderno Anti-Blindaje Doctrina"
 BOS_idea_main_battle_line_desc: "Las fuerzas antiamores móviles permiten a Bosnia competir con formaciones más pesadas sin mantener una flota de tanques costosa."
 BOS_idea_boots_on_the_ground: "Ejército de infantería"
 BOS_idea_boots_on_the_ground_desc: "La infantería preparada y las reservas formadas forman el núcleo de una fuerza defensiva adecuada al terreno y presupuesto de Bosnia."
 BOS_eu_development_loans: "Préstamos para el desarrollo de la UE"
 BOS_eu_development_loans_desc: "El crédito europeo es financiar la reconstrucción y aliviar la economía de consumo, pero las condiciones de reembolso conllevan una carga de interés más pesada y dejan a Bosnia más expuesta al apalancamiento extranjero."
 BOS_election_stimulus: "Gasto de elecciones-año"
 BOS_election_stimulus_desc: "El gasto de emergencia por delante del voto está estableciendo presupuestos para el hogar y levantando la confianza pública en el gobierno."
 BOS_reconstruction_drive: "Unidad de reconstrucción nacional"
 BOS_reconstruction_drive_desc: "Un programa coordinado de reconstrucción está acelerando la construcción en todo el país y restableciendo lentamente la confianza pública en el Estado."
 BOS_national_mobilization: "Marco nacional de movilización"
 BOS_national_mobilization_desc: "Las obligaciones claras de reserva aumentan la cantidad de mano de obra capacitada, y los planes defensivos preparados significan que cualquier territorio bosnio ocupado resistirá mucho más ferozmente a un ocupante."
 BOS_idea_detain_ratko_mladic: "Ratko Mladić Detained"
 BOS_idea_detain_ratko_mladic_desc: "La cooperación con la justicia internacional ha mejorado la confianza occidental en las instituciones de Bosnia."
 BOS_idea_civilian_training: "Ampliación de la capacitación en reservas"
 BOS_idea_civilian_training_desc: "Un programa de entrenamiento nacional temporal está preparando reservistas para la movilización y defensa territorial."
 BOS_idea_post_war_clean_up: "Programa de limpieza de posguerra"
 BOS_idea_post_war_clean_up_desc: "La limpieza y reconstrucción coordinadas están acelerando temporalmente la inversión en las comunidades dañadas."
 BOS_pro_bosnia: "Formación de un Gobierno bosnio-bajado"
 BOS_pro_bosnia_desc: "Un gobierno respaldado por bosnio dirige las instituciones estatales y reduce el costo de la administración nacional."
 BOS_pro_srpska: "Formación de un gobierno basado en los serbios"
 BOS_pro_srpska_desc: "Un gobierno respaldado por los serbios dirige las instituciones estatales y prioriza la cooperación en materia de seguridad con la República Srpska."
 BOS_civil_war_recovery: "Recuperación de la Guerra Civil"
 BOS_civil_war_recovery_desc: "La guerra civil renovada ha dañado la producción, la confianza pública y la capacidad de Bosnia para atraer socios."
 BOS_post_war_efforts: "Recuperación de Postwar Effort"
 BOS_post_war_efforts_desc: "Los ingresos fiscales y los incentivos para la reconstrucción están apoyando un aumento temporal de las inversiones en posguerra."
 BOS_milorad_dodik_idea: "Milorad Dodik"
 BOS_milorad_dodik_idea_desc: "La red política de Milorad Dodik obstruye las instituciones centrales al tiempo que fortalece la autonomía de la República Srpska."
 BOS_farming_improvements: "Mejoras de la agricultura"
 BOS_farming_improvements_desc: "El equipo moderno y la tierra más segura están mejorando la producción agrícola y la estabilidad rural."
 BOS_farming_powerhouse: "Agropecuario"
 BOS_farming_powerhouse_desc: "Un sector agrícola productivo apoya ahora los ingresos rurales, el crecimiento de la población y la base tributaria."
 BOS_mining_development: "Minería"
 BOS_mining_development_desc: "Las minas modernizadas están aumentando la extracción de recursos y la actividad local imponible."
 BOS_mining_industry: "Industria minera"
 BOS_mining_industry_desc: "La inversión consolidada ha creado un sector minero más amplio y eficiente."
 BOS_lumber_harvesting_idea: "Lumber Harvesting"
 BOS_lumber_harvesting_idea_desc: "Las inversiones forestales y de procesamiento están ampliando la producción de recursos rurales y las actividades imponibles."
 BOS_dayton_accords_desc: "El acuerdo de Dayton restringe la expansión y limita el enfrentamiento militar con Serbia y Croacia, mientras que Bosnia sigue en paz."
 BOS_land_mine_removal_efforts_desc: "Los equipos de remoción de minas están reduciendo la carga económica y sanitaria de las tierras contaminadas, pero el programa requiere financiación sostenida."
 BOS_trade_deal_with_russia: "Acuerdo Comercial de Sarajevo-Moscú I"
 BOS_trade_deal_with_russia_desc: "Un acuerdo limitado con Rusia apoya la inversión y reduce los costos de consumo al mismo tiempo que aumenta la influencia política oriental."
 BOS_trade_deal_with_russia_expanded: "Acuerdo Comercial de Sarajevo-Moscú II"
 BOS_trade_deal_with_russia_expanded_desc: "El comercio y el crédito ruso ampliados profundizan la cooperación económica y la alineación política oriental de Bosnia."
 BOS_trade_deal_with_eu: "Acuerdo Comercial de la UE I"
 BOS_trade_deal_with_eu_desc: "Un acuerdo limitado con la Unión Europea reduce los costos de consumo y apoya la integración democrática y financiera."
 BOS_trade_deal_with_eu_expanded: "Acuerdo de Comercio de la UE II"
 BOS_trade_deal_with_eu_expanded_desc: "El acceso ampliado a los mercados europeos y el crédito fortalece la alineación económica occidental de Bosnia."
 BOS_trade_with_nato: "Paquete de Ayuda de la OTAN"
 BOS_trade_with_nato_desc: "Los asociados de la OTAN proporcionan asistencia económica que reduce los costos inmediatos y alienta la alineación política occidental."
 BOS_trade_with_usa: "Tratado Conjunto de Comercio de Bosnia y Herzegovina"
 BOS_trade_with_usa_desc: "Un acuerdo bilateral con los Estados Unidos apoya la producción de energía, el acceso al consumidor y la alineación política occidental."
 BOS_gov_old_name: "Parlamentaria de Bosnia"
 BOS_islamic_revolt: "Revuelta bosnia mujahideen"
 BOS_islamic_upper: "Califato bosnio"
 bos_workers_republic: "República de los Trabajadores de Bosnia y Herzegovina"
 BOS_events.1.t: "Guerra Civil de Bosnia"
 BOS_events.1.d: "La República Srpska ha declarado la independencia y Bosnia ha regresado a la guerra civil. El gobierno central debe derrotar a las fuerzas de ruptura o arriesgar la partición permanente del país."
 BOS_events.1.a: "Defend Bosnia y Herzegovina"
 BOS_events.1.b: "Párese con la República Srpska"
 BOS_events.2.t: "Los croatas declaran independencia"
 BOS_events.2.d: "Los dirigentes croatas de Bosnia en Herzegovina han declarado la independencia mientras que el país ya está dividido por la guerra. El gobierno central debe restablecer el control en el sur sin abandonar el frente contra la República Srpska."
 BOS_events.2.a: "Restaurar la integridad territorial del país"
 BOS_events.2.b: "Lado con los secesionistas croatas"
 BOS_events.4.t: "El fin de la guerra"
 BOS_events.4.d: "El Gobierno ha restablecido el control sobre Bosnia y Herzegovina, poniendo fin a la nueva guerra civil. La desmovilización, la reconstrucción y la reconciliación política pueden comenzar ahora."
 BOS_events.4.a: "Reintegración total"
 BOS_events.4.b: "Autonomía negociada"
 BOS_events.4.c: "Supervisión manual de la administración internacional"
 BOS_events.59.t: "El despegue se rompe en la guerra"
 BOS_events.59.d: "La crisis de secesión funcionó sin un acuerdo. La República Srpska ha declarado abiertamente la independencia y el país está en guerra de nuevo."
 BOS_events.59.a: "Mantener el país unido por la fuerza"
 BOS_events.60.t: "Herzegovina se escapa"
 BOS_events.60.d: "Sin llegar a un acuerdo, los dirigentes croatas de Herzegovina han declarado la independencia y tomado armas contra Sarajevo."
 BOS_events.60.a: "Restaurar el control en el sur"
 BOS_events.11.t: "Armas extranjeras Llegan"
 BOS_events.11.d: "Un socio regional ha entregado armas de infantería para nuestras fuerzas. El envío reforzará el frente y fortalecerá la relación detrás de él."
 BOS_events.11.a: "Distribuir las armas"
 BOS_events.12.t: "Los agricultores"
 BOS_events.12.d: "Los agricultores que se enfrentan a precios bajos, tierras inseguras y apoyo estatal débil han comenzado una huelga nacional. Sus organizadores exigen la inversión agrícola y un cambio en la política económica."
 BOS_events.12.a: "Aceptar un cambio de gobierno"
 BOS_events.12.b: "Negociar con los agricultores"
 BOS_events.13.t: "Acuerdo con los Strikers"
 BOS_events.13.d: "El gobierno y los dirigentes de la huelga han aceptado un acuerdo que abarca los salarios, las protecciones en el lugar de trabajo y las negociaciones futuras. El acuerdo termina las protestas inmediatas pero compromete al Estado a nuevas obligaciones."
 BOS_events.13.a: "Honra el acuerdo"
 BOS_events.14.t: "Huelga de mineros"
 BOS_events.14.d: "Los trabajadores de las minas han detenido la producción para exigir condiciones más seguras, salarios fiables y cambios más cortos. La huelga se extiende a través de comunidades que dependen de la industria."
 BOS_events.14.a: "Aceptar un cambio de gobierno"
 BOS_events.14.b: "Negociar con los mineros"
 BOS_events.9.t: "Bosnia Solicita armas"
 BOS_events.9.d: "[FROM.GetName] ha solicitado armas de infantería para su guerra civil. La ayuda ampliaría nuestra influencia en los Balcanes, pero el equipo debe provenir de nuestras propias reservas."
 BOS_events.9.a: "Enviar las armas"
 BOS_events.9.b: "Preserve nuestros arsenales"
 BOS_events.34.t: "Bosnia Seeks CSTO Miembros"
 BOS_events.34.d: "[FROM.GetName] ha solicitado la entrada en el CSTO. La pertenencia extendería la alianza a los Balcanes occidentales, pero también podría importar las disputas no resueltas de Bosnia."
 BOS_events.34.a: "Admit Bosnia"
 BOS_events.34.b: "Rechazar la aplicación"
 BOS_events.35.t: "Miembros de la OIMT aprobados"
 BOS_events.35.d: "Rusia ha aprobado nuestra solicitud. Bosnia ahora comparte las obligaciones colectivas de defensa de la CSTO."
 BOS_events.35.a: "Aceptar las obligaciones"
 BOS_events.36.t: "Composición de CSTO Rechazado"
 BOS_events.36.d: "Rusia ha rechazado nuestra solicitud y se ha negado a extender la alianza a los Balcanes."
 BOS_events.36.a: "Reconsiderar nuestra política oriental"
 BOS_events.15.t: "Oferta de cooperación con armas bosnias"
 BOS_events.15.d: "[FROM.GetName] ha propuesto un arreglo industrial de defensa, solicitando licencias de producción para aviones y rifles serbios. Los vínculos militares más estrechos vincularían a Sarajevo con Belgrado, aunque algunos en Bosnia resentirán la dependencia."
 BOS_events.15.a: "Conceder las licencias de producción"
 BOS_events.15.b: "Rechazar la solicitud"
 BOS_events.16.t: "Licencias de armas de Belgrado"
 BOS_events.16.d: "Serbia ha aprobado la transferencia de licencias de producción. Las fábricas bosnianas pueden construir ahora diseños serbios, aunque el sentimiento pro-serbio entre las comunidades bosnias ha suscitado disturbios."
 BOS_events.16.a: "Comience la producción con licencia"
 BOS_events.17.t: "Belgrade Declines"
 BOS_events.17.d: "Serbia ha rechazado la oferta de cooperación armamentística, sin querer compartir su industria de defensa en estos términos."
 BOS_events.17.a: "Mira a otro lado."
 BOS_events.18.t: "Invitación a la Inversión de Bosnia"
 BOS_events.18.d: "[FROM.GetName] invita a los fabricantes extranjeros a establecer la producción dentro del país. La construcción de una planta abriría un nuevo mercado y extendería nuestra influencia comercial sobre la economía bosnia."
 BOS_events.18.a: "Construir una fábrica en Bosnia"
 BOS_events.18.b: "Declarar la invitación"
 BOS_events.19.t: "Extranjeros Automaker Invests"
 BOS_events.19.d: "[FROM.GetName] ha acordado construir una planta en Bosnia. La inversión trae empleos y capital, aunque el gobierno de la casa del fabricante ganará una posición en nuestra política industrial."
 BOS_events.19.a: "Bienvenido a la inversión"
 BOS_events.20.t: "Inversión declinada"
 BOS_events.20.d: "[FROM.GetName] se ha negado a invertir en la industria automovilística de Bosnia por ahora."
 BOS_events.20.a: "Enfoque otro fabricante"
 BOS_events.21.t: "Bosnia busca comprar rifles"
 BOS_events.21.d: "[FROM.GetName] desea comprar un envío de armas modernas alemanas de infantería. La venta ganaría divisas y buena voluntad en Sarajevo."
 BOS_events.21.a: "Aprobar la venta"
 BOS_events.21.b: "Rechazar la venta"
 BOS_events.22.t: "Explosiones alemanas entregadas"
 BOS_events.22.d: "Alemania ha aprobado la venta. Un envío de armas modernas de infantería está en camino a nuestros depósitos."
 BOS_events.22.a: "Distribuir las armas"
 BOS_events.23.t: "Alemania declina la venta"
 BOS_events.23.d: "Berlín ha rechazado vender armas de infantería a Bosnia en este momento."
 BOS_events.23.a: "Buscar otro proveedor"
 BOS_events.24.t: "Bosnia Seeks Ruso Rifles"
 BOS_events.24.d: "[FROM.GetName] desea comprar una gran cantidad de armas de infantería rusa. La orden sería una venta de bienvenida para la industria rusa."
 BOS_events.24.a: "Aprobar la venta"
 BOS_events.24.b: "Rechazar la venta"
 BOS_events.25.t: "Fusiles rusos entregados"
 BOS_events.25.d: "Rusia ha aprobado la venta. Un gran envío de armas de infantería está en camino hacia nuestras existencias."
 BOS_events.25.a: "Distribuir las armas"
 BOS_events.26.t: "Rusia declina la venta"
 BOS_events.26.d: "Moscú ha rechazado vender armas de infantería a Bosnia en este momento."
 BOS_events.26.a: "Buscar otro proveedor"
 BOS_political.4.t: "Elección de la posguerra en Bosnia"
 BOS_political.4.d: "La primera elección nacional del nuevo siglo de Bosnia y Herzegovina determinará qué coalición dirige las frágiles instituciones de posguerra del país."
 BOS_political.4.a: "Mantener el gobierno dirigido por Bosnia"
 BOS_political.4.a_tt: "El §Y Partido de la Acción Democrática§! dirigirá al gobierno. La próxima rotación presidencial pasará a un representante serbio."
 BOS_political.4.b: "Retroceder una coalición liderada por los serbios"
 BOS_political.4.b_tt: "El §YAlliance of Independent Social Democrats§! liderará una coalición con la §YPartido Democrático Serbio§!. La próxima rotación presidencial pasará a un representante croata."
 BOS_political.20.t: "Solución después de la guerra civil"
 BOS_political.20.d: "La guerra ha terminado. Bosnia y Herzegovina ha sido reciente bajo una sola autoridad, y la tarea inmediata está estabilizando al Estado mientras las ex facciones se desmantelan."
 BOS_political.20.a: "De la República Srpska"
 BOS_political.20.b: "Establecer un gobierno de raza croata"
 BOS_political.20.c: "Bosnia unida al control de Sarajevo"
 BOS_political.1.t: "Estado de la posguerra"
 BOS_political.1.d: "Bosnia y Herzegovina entra en el nuevo siglo con instituciones dañadas, autoridad dividida y una recuperación inacabada. El gobierno debe decidir cuánto poder debe permanecer con las entidades."
 BOS_political.1.a: "Define el nuevo estado"
 BOS_political.2.t: "Autonomía de Entidad Ampliada"
 BOS_political.2.d: "El Gobierno ha transferido autoridad nacional adicional a Herzegovina y la República Srpska al tiempo que mantiene una política exterior y de defensa común. Bosnia ahora funciona como una federación más suelta."
 BOS_political.2.a: "Aplicar el arreglo"
 BOS_political.3.t: "Reunificación federal"
 BOS_political.3.d: "La autonomía ampliada ha creado jurisdicciones superpuestas en comunidades mixtas y debilitado los servicios comunes. Los líderes de las Entidades han aceptado la reunificación bajo un acuerdo federal que preserva la representación local."
 BOS_political.3.a: "Reunificar la federación"
 BOS_political.5.t: "La crisis financiera"
 BOS_political.5.d: "La crisis financiera mundial ha reducido las exportaciones, ha reducido el crédito y ha empujado a los empleadores bosnios hacia la despido. La recuperación requerirá una política fiscal e industrial coordinada."
 BOS_political.5.a: "Preparar un programa de recuperación"
 BOS_political.6.t: "Milorad Dodik"
 BOS_political.6.d: "Milorad Dodik ha consolidado el liderazgo en la República Srpska y ha hecho que la autonomía de las entidades sea el centro de su programa político. Su creciente red complicará cada intento de fortalecer las instituciones nacionales."
 BOS_political.6.a: "Sarajevo debe responder"
 BOS_political.8.t: "Controversias de Segregación Turns Violento"
 BOS_political.8.d: "Una controversia sobre la integración de los alumnos serbios y bosnios se ha intensificado en una marcha hacia la asamblea municipal. El vandalismo y los ataques contra empresas de propiedad de los repatriados han obligado a la policía antidisturbios a intervenir."
 BOS_political.8.a: "Las divisiones siguen siendo profundas"
 BOS_political.9.t: "Para el personal de mantenimiento de la paz"
 BOS_political.9.d: "La OTAN ha anunciado una reducción de su presencia bosnia en el mantenimiento de la paz a medida que mejora la situación de seguridad. Los líderes locales discrepan sobre si las fuerzas nacionales están dispuestas a asumir la misión."
 BOS_political.9.a: "Revise nuestra disposición"
 BOS_political.10.t: "Informe Documentos Ataques de prensa"
 BOS_political.10.d: "Un nuevo informe registra un aumento de las amenazas y agresiones contra periodistas bosnios durante 2002. Las organizaciones nacionalistas y los patronos políticos locales son culpados por gran parte de la intimidación."
 BOS_political.10.a: "Proteger la presentación de informes independientes"
 BOS_political.11.t: "Nikolić condenado a 23 años"
 BOS_political.11.d: "Un tribunal ha condenado a Dragan Nikolić, oficial serbio de Bosnia a 23 años de prisión por delitos cometidos en el campamento de detención de Sušica. El fallo ha reabierto las controversias políticas sobre la rendición de cuentas en tiempos de guerra."
 BOS_political.11.a: "La justicia debe ser ejecutada"
 BOS_political.13.t: "Regresos de refugiados Alcanzan Nuevo Alto"
 BOS_political.13.d: "Más ciudadanos desplazados regresan a medida que la seguridad mejora y se reconstruyen los hogares. Las autoridades locales deben prestar servicios y proteger a los repatriados en las comunidades donde persisten tensiones de guerra."
 BOS_political.13.a: "Apoyar su regreso"
 BOS_political.14.t: "Los refugiados y los repatriados se encuentran en huelgas frías"
 BOS_political.14.d: "Un resfriado grave ha afectado a las comunidades de refugiados y repatriados en Bosnia y Herzegovina. Los organismos nacionales y las Naciones Unidas luchan por suministrar combustible para la calefacción, refugio y alimentos."
 BOS_political.14.a: "Movilizar socorro de emergencia"
 BOS_political.15.t: "Daños a la plaga de Alija Izetbegović"
 BOS_political.15.d: "Un artefacto explosivo ha dañado la tumba del ex presidente Alija Izetbegović en Sarajevo. El ataque ha provocado indignación pública y renovados temores de violencia políticamente motivada."
 BOS_political.15.a: "Investigar el ataque"
 BOS_political.17.t: "Southeast Europe Floods"
 BOS_political.17.d: "La precipitación récord ha inundado ciudades, ha dañado la infraestructura y ha desencadenado deslizamientos a través de Bosnia y los estados vecinos. Los servicios de emergencia se enfrentan a un esfuerzo prolongado de socorro y reconstrucción."
 BOS_political.17.a: "Coordinación del socorro en casos de desastre"
 BOS_events.55.t: "Alija Izetbegović Dies"
 BOS_events.55.d: "El ex presidente Alija Izetbegović ha muerto por complicaciones de enfermedades cardíacas. Su muerte cierra un capítulo definido en la política bosniaca y la lucha de Bosnia y Herzegovina por la independencia."
 BOS_events.55.a: "Honra su legado"
 BOS_events.55.b: "El estado debe avanzar"
 BOS_political.21.t: "Bosnia pide una garantía"
 BOS_political.21.d: "[FROM.GetName] nos ha pedido que garanticemos su independencia mientras la EUFOR transfiere la responsabilidad de seguridad a las instituciones bosnias."
 BOS_political.21.a: "Garantía Bosnia"
 BOS_political.21.b: "Declinar el compromiso"
 BOS_political.22.t: "Bosnia Propone Unión"
 BOS_political.22.d: "El gobierno encabezado por la República Srpska en [FROM.GetName] ha propuesto su incorporación a Serbia. La aceptación transferiría el territorio de Bosnia y las fuerzas armadas a nuestro estado."
 BOS_political.22.a: "Aprobar el sindicato"
 BOS_political.22.b: "Preserve estados separados"
 BOS_zivko_radisic: "Živko Radišić"
 BOS_ante_jelavic: "Ante Jelavić"
 BOS_halid_genjac: "Halid Genjac"
 BOS_sulejman_tihic: "Sulejman Tihić"
 BOS_mirko_sarovic: "Mirko Šarović"
 BOS_dragan_covic: "Dragan Čović"
 BOS_haris_silajdzic: "Haris Silajdžić"
 BOS_nebojsa_radmanovic: "Nebojša Radmanović"
 BOS_zeljko_komsic: "Željko Komšić"
 BOS_bosnia_random: "Un nuevo representante bosnio asumirá la presidencia rotatoria."
 BOS_serb_random: "Un nuevo representante serbio asumirá la presidencia rotatoria."
 BOS_croat_random: "Un nuevo representante croata asumirá la presidencia rotatoria."
 BOS_events.45.a: "Negociaciones abiertas"
 BOS_events.45.d: "Los empleados públicos se han unido al malestar laboral y exigido salarios confiables, negociación colectiva y un fin a las citas patronales."
 BOS_events.45.t: "Apartado del sector público"
 BOS_events.46.a: "El movimiento se está extendiendo"
 BOS_events.46.d: "Las manifestaciones se han expandido de los lugares de trabajo a los centros urbanos, ya que los sindicatos coordinan las demandas en líneas de entidad."
 BOS_events.46.t: "Protestas Laborales en todo el país"
 BOS_events.47.a: "Protección de las instituciones públicas"
 BOS_events.47.d: "Una confrontación fuera de un edificio del gobierno se ha vuelto violenta. Los líderes sindicales culpan a los provocadores, mientras que los funcionarios de seguridad exigen poderes de emergencia."
 BOS_events.47.t: "Protestas Turn Violent"
 BOS_events.48.a: "Reconocer el nuevo gobierno"
 BOS_events.48.d: "La vieja coalición ha perdido el control del parlamento. Un gabinete respaldado por trabajadores reclama ahora la autoridad para reorganizar el estado y la economía."
 BOS_events.48.t: "Los trabajadores entran en el gobierno"
 BOS_eu_accession: "Europeann Union Accession"
 BOS_eu_accession_desc: "La membresía exige cerrar los capítulos de negociación de uno en uno. Cada paso necesita el acuerdo de los tres grupos constituyentes, y Republika Srpska puede frenar el proceso cada vez que su dirigencia se vuelva hostil."
 BOS_eu_judicial_reform: "Cerrar el capítulo del Poder Judicial"
 BOS_eu_judicial_reform_desc: "Alinear el procedimiento judicial, la revisión en apelación y la independencia de la fiscalía con los criterios de adhesión a la UE."
 BOS_eu_anti_corruption_commitments: "Adoptar compromisos de lucha contra la corrupción"
 BOS_eu_anti_corruption_commitments_desc: "Comprometerse con los criterios anticorrupción supervisados por la UE. Bruselas no abrirá este capítulo mientras la captura del Estado siga siendo grave."
 BOS_eu_market_alignment: "Alinearse con el Mercado Único"
 BOS_eu_market_alignment_desc: "Adoptar las normas de producto, los procedimientos aduaneros y las reglas de competencia de la UE. El cumplimiento es caro, pero desbloquea fondos de preadhesión."
 BOS_eu_candidate_status: "Estado del candidato seguro"
 BOS_eu_candidate_status_desc: "Solicitar al Consejo Europeo que reconozca a Bosnia y Herzegovina como candidata oficial a miembro."
 BOS_eu_open_negotiations: "Negociaciones de acceso abierto"
 BOS_eu_open_negotiations_desc: "Iniciar negociaciones formales de adhesión con la Comisión Europea. Se espera resistencia de Banja Luka a medida que se amplían las obligaciones a nivel estatal."
 BOS_eu_sign_accession_treaty: "Firmar el Tratado de Adhesión"
 BOS_eu_sign_accession_treaty_desc: "Concluir las negociaciones y firmar el tratado de adhesión. La membresía en sí aún requiere una solicitud formal a la Unión Europea."
 BOS_treasury_5_tt: "La tesorería sostiene al menos £treasury 5.0"
 BOS_treasury_2_tt: "La tesorería sostiene al menos £treasury 2.0"
 BOS_judiciary_meets_eu_standards_tt: "El poder judicial cumple los criterios de adhesión de la UE"
 BOS_anti_corruption_framework_tt: "Se ha establecido un marco anticorrupción vigilado por la UE"
 BOS_market_aligned_with_eu_tt: "La regulación nacional se alinea con el mercado único"
 BOS_recognized_eu_candidate_tt: "Bosnia y Herzegovina se convierte en un candidato reconocido como miembro de la UE"
 BOS_eu_application_open_tt: "Bosnia y Herzegovina puede solicitar ahora la adhesión de la Unión Europea"
 BOS_economic_development: "Desarrollo económico"
 BOS_economic_development_desc: "Programas de inversión financiados desde el extranjero, de privatización y de reconstrucción para la economía de posguerra.\n Las redes de clientelismo a nivel de entidad controlan los nombramientos, los contratos y buena parte de la economía. Desmantelarlas es lento y enfurece a los grupos que se benefician de ellas."
 BOS_court_turkish_investment: "Tribunal de Inversión Turca"
 BOS_court_turkish_investment_desc: "Abrir la puerta a las constructoras y bancos turcos. El dinero de Ankara entra, y con él la influencia turca sobre Sarajevo."
 BOS_court_gulf_investment: "Inversión en el Golfo de la Corte"
 BOS_court_gulf_investment_desc: "Invitar a los fondos del Golfo a invertir en inmuebles, turismo y finanzas. El capital eleva el tesoro y estabiliza el ánimo, y crece la posición de Riad en Bosnia."
 BOS_rapid_privatization: "Privatización rápida"
 BOS_rapid_privatization_desc: "Vender rápido empresas estatales a quien las compre. Las ventas llenan el tesoro y elevan la producción, pero las gangas alimentan la corrupción e inquietan a la fuerza laboral."
 BOS_transparent_privatization: "Privatización transparente"
 BOS_transparent_privatization_desc: "Vender empresas estatales mediante licitaciones abiertas y auditadas. Lo recaudado es menor y el proceso más lento, pero la corrupción baja y la confianza pública se mantiene."
 BOS_thermal_plant_chinese_financing: "Planta termal financiada por China"
 BOS_thermal_plant_chinese_financing_desc: "Tome un préstamo chino para expandir una central eléctrica de lignito. La salida aumenta a la vez, pero la deuda y la influencia de Beijing vienen con ella."
 BOS_hydro_refurbishment: "Renovar las centrales hidroeléctricas"
 BOS_hydro_refurbishment_desc: "Renovar las represas y turbinas envejecidas del Neretva y el Drina. La factura inicial es real, pero la energía confiable estabiliza la industria."
 BOS_end_brcko_supervision: "Fin de la supervisión de Brcko"
 BOS_end_brcko_supervision_desc: "Derribar el régimen internacional de supervisión sobre el distrito de Brcko y entregarlo plenamente a las instituciones locales. La República Srpska pondrá a prueba el nuevo acuerdo inmediatamente."
 BOS_police_restructuring: "Reestructuración de la policía"
 BOS_police_restructuring_desc: "Consolidar la fragmentada policía de las entidades bajo un marco estatal, condición previa de la UE para un mayor acercamiento. Republika Srpska lamenta la pérdida de control."
 BOS_anti_corruption_investigations: "Investigaciones anticorrupción"
 BOS_anti_corruption_investigations_desc: "Dirigir a los fiscales del Estado contra las redes de clientelismo arraigadas. La corrupción bajará, pero el grupo constituyente cuyos funcionarios sean acusados se volverá inquieto."
 BOS_judicial_appointments: "Despolitizar los nombramientos judiciales"
 BOS_judicial_appointments_desc: "Control de los nombramientos judiciales de los dirigentes del partido a un consejo independiente."
 BOS_depoliticized_judiciary_tt: "Los nombramientos judiciales están aislados del control de partidos"
 BOS_public_procurement_reform: "Reforma de la contratación pública"
 BOS_public_procurement_reform_desc: "Introducir licitaciones abiertas para los contratos estatales. Publicar las cuentas cuesta dinero por adelantado y termina con varios arreglos cómodos."
 BOS_transparent_procurement_tt: "Los contratos estatales se adjudican mediante licitación abierta"
 BOS_diaspora_investment_drive: "Diáspora Investment Drive"
 BOS_diaspora_investment_drive_desc: "Invitar a las asociaciones empresariales de la diáspora a cofinanciar proyectos públicos y colocar una emisión única de bonos entre ahorradores emigrados."
 BOS_dual_citizenship_outreach: "Extensión de doble ciudadanía"
 BOS_dual_citizenship_outreach_desc: "Simplificar los trámites de doble nacionalidad y el registro consular para que los emigrantes mantengan lazos formales con el país. Una diáspora registrada mayor envía más dinero a casa."
 BOS_expanded_dual_citizenship_tt: "Los ingresos por remesas de la Diáspora aumentan en un 20%"
 BOS_diaspora_return_program: "Programa de retorno de la diáspora"
 BOS_diaspora_return_program_desc: "Financiar subvenciones de reasentamiento y colocación laboral para familias que regresan del extranjero. Es caro, pero el país necesita más gente que dinero."
 BOS_treasury_1_tt: "La tesorería sostiene al menos £treasury 1.0"
 BOS_dayton_pressure: "Dayton bajo presión"
 BOS_dayton_pressure_desc: "Republika Srpska desafía a las instituciones estatales y amenaza con la secesión. Sarajevo puede conceder autonomía, pedir al Alto Representante que imponga un arreglo o buscar arbitraje internacional."
 BOS_concede_to_srpska_demands: "Ceder ante las exigencias de la Entidad"
 BOS_concede_to_srpska_demands_desc: "Devolver a Republika Srpska las competencias disputadas. La crisis termina, a costa de la autoridad central."
 BOS_invoke_bonn_powers: "Invocar los Poderes de Bonn"
 BOS_invoke_bonn_powers_desc: "Pedir al Alto Representante que imponga la legislación en disputa y destituya a los funcionarios obstruccionistas. Es eficaz y profundamente resentido en Banja Luka."
 BOS_request_international_arbitration: "Solicitud de Arbitraje Internacional"
 BOS_request_international_arbitration_desc: "Remitir la disputa al arbitraje internacional. Lento y costoso, pero pone fin al enfrentamiento sin premiar a ninguna de las partes."
 BOS_phase_out_ohr_supervision: "Poner fin a la supervisión de la OHR"
 BOS_phase_out_ohr_supervision_desc: "Con las relaciones de entidad estables, negocia la transferencia de los poderes restantes del Alto Representante a las instituciones nacionales."
 BOS_dayton_pressure_decisions_available_tt: "Las respuestas a la crisis están disponibles en las decisiones de Dayton bajo presión"
 BOS_eu_candidate: "Unión Europea Candidato"
 BOS_eu_candidate_desc: "La condición de candidato da a Bosnia y Herzegovina un camino oficial para la adhesión, la presentación periódica de informes sobre los progresos y las relaciones más fáciles con los Estados miembros."
 BOS_eu_negotiations: "Negociaciones de Adhesión de la UE"
 BOS_eu_negotiations_desc: "Los capítulos de acceso son abiertos y la asistencia técnica de la UE fluye hacia las instituciones estatales, acelerando el trabajo administrativo e infraestructura."
 BOS_eu_accession_treaty: "Tratado de adhesión a la UE"
 BOS_eu_accession_treaty_desc: "El tratado de adhesión se firma y está en marcha la ratificación. Los mercados tratan la membresía asentada, y el aparato estatal trabaja con clara dirección."
 BOS_eu_accession_funds: "Pre-Accesión Asistencia"
 BOS_eu_accession_funds_desc: "Instrumento para los fondos de asistencia previa a la adhesión Financian infraestructura, capacidad administrativa y préstamos estatales más baratos."
 BOS_republika_srpska_secession_crisis: "Crisis de secesión"
 BOS_republika_srpska_secession_crisis_desc: "La República Srpska boicotea a las instituciones estatales y prepara la legislación del referéndum. Los patronos extranjeros observan una apertura mientras el enfrentamiento continúa."
 BOS_ohr_supervision: "Supervisión de la OHR"
 BOS_ohr_supervision_desc: "El Alto Representante ejerce directamente las facultades de Bonn. Los fallos impuestas mantienen al Estado instituciones funcionales, pero paralelamente elegidas."
 BOS_national_reconciliation: "Reconciliación Nacional"
 BOS_national_reconciliation_desc: "Los tres grupos constitutivos respaldan al gobierno estatal. La cooperación entre las entidades es rutinaria y no excepcional."
 BOS_political.24.t: "Estado candidato concedido"
 BOS_political.24.d: "El Consejo Europeo ha reconocido oficialmente a Bosnia y Herzegovina como candidato para ser miembro. La decisión premia años de reforma y obliga a Bruselas a informar sobre nuestros progresos cada año."
 BOS_political.24.a: "Un futuro europeo"
 BOS_political.25.t: "Banja Luka bloquea las conversaciones"
 BOS_political.25.d: "Los delegados de la República Srpska han salido del Parlamento estatal, negándose a ratificar el marco de negociación a menos que las competencias de las entidades estén garantizadas por escrito."
 BOS_political.25.a: "Negociar su regreso"
 BOS_political.25.b: "Ratificar sin ellos"
 BOS_political.26.t: "Escándalo de adquisiciones"
 BOS_political.26.d: "Los periodistas han publicado contratos que tipifican a altos funcionarios de las entidades para enjuagar licitaciones públicas. La red llega a ministerios, empresas estatales y al menos a un partido rector."
 BOS_political.26.a: "Proseguir la red"
 BOS_political.26.b: "Bury la historia"
 BOS_political.27.t: "La República Srpska amenaza la secesión"
 BOS_political.27.d: "La asamblea de entidades en Banja Luka ha programado un voto para retirarse de las instituciones estatales, y su liderazgo está discutiendo abiertamente un referéndum sobre la independencia."
 BOS_political.27.a: "El estado debe responder"
 BOS_political.28.t: "El Standoff Hardens"
 BOS_political.28.d: "Los meses de boicot han pasado sin un acuerdo. Las instituciones de Entidades funcionan ahora como si la autoridad estatal fuera opcional, y los moderados de todas las partes han perdido terreno."
 BOS_political.28.a: "Un precedente peligroso"
 BOS_diaspora_remittances: "Diáspora Remittances"
 BOS_diaspora_remittances_desc: "El dinero enviado a casa por los bosnios que trabajan en el extranjero vale aproximadamente una décima parte del PIB. Alcanza hogares en todas partes del país, incluyendo aquellos que el presupuesto estatal nunca lo hace."
 BOS_diaspora_returnees: "Diáspora de regreso"
 BOS_diaspora_returnees_desc: "Los subsidios de reasentamiento están trayendo familias de Alemania, Austria y Escandinavia. Llegan con ahorros, habilidades y niños."
 BOS_nato_interoperability: "Interoperabilidad de la OTAN"
 BOS_nato_interoperability_desc: "Los ejercicios conjuntos, las normas de alianza y los programas de asociación para la paz están reconstruyendo a las fuerzas armadas en línea occidental."
 BOS_political.29.t: "Dinero de la Diáspora viene a casa"
 BOS_political.29.d: "El impulso de inversión ha cerrado con compromisos de propietarios de empresas de la diáspora en Europa y América del Norte. Las sumas son modestas por las normas internacionales, pero llegan a municipios que los inversores extranjeros ignoran."
 BOS_political.29.a: "Welcome news"
 BOS_political.30.t: "Karadžić está detenido"
 BOS_political.30.d: "Las noticias de Belgrado se han difundido a través de Sarajevo dentro de la hora. Radovan Karadžić, líder en tiempos de guerra de los serbios de Bosnia, ha sido detenido y enfrenta traslado a La Haya. Las asociaciones de sobrevivientes y las familias de víctimas se reúnen en vigilias tranquilas desde Sarajevo a Srebrenica. En Banja Luka el humor es más oscuro."
 BOS_political.30.a: "Trece años demasiado tarde"
 BOS_political.31.t: "Mladić está detenido"
 BOS_political.31.d: "Ratko Mladić, comandante del ejército que llevó a cabo la masacre de Srebrenica, ha sido detenido en una granja en el norte de Serbia. Para las madres de Srebrenica el arresto termina dieciséis años de espera. A través de la línea fronteriza entre Entidades, algunos todavía hablan de él como defensor."
 BOS_political.31.a: "Justicia llega a Lazarevo"
 BOS_political.32.t: "Sejdić-Finci Ruling"
 BOS_political.32.d: "El Tribunal Europeo de Derechos Humanos ha dictaminado que las normas de elegibilidad étnica de la Constitución violan el Convenio Europeo. Dervo Sejdić y Jakob Finci, activista romaní y líder de la comunidad judía, no pueden defender la presidencia porque no pertenecen a ninguno de los tres pueblos constituyentes. Las partes croatas añaden que el acuerdo actual permite a otros elegir su miembro de la Presidencia para ellas. La aplicación de la decisión requiere un cambio constitucional que nadie está ansioso por negociar."
 BOS_political.32.a: "Amending Dayton es más fácil dicho que hecho"
 BOS_sejdic_finci_ruling_tt: "§YStrasburgo ha fallado en contra de las normas de elegibilidad étnica de la Constitución. La reforma judicial que aborda el fallo tendrá un peso extra en Bruselas.§!"
 BOS_sejdic_finci_addressed_tt: "§GLa reforma aborda el fallo de Sejdić-Finci, cerrando una demanda permanente desde Bruselas.§!"
 BOS_serbia_reaction_tt: "Serbia decidirá si regresará a la República Srpska."
 BOS_croatia_reaction_tt: "Croacia decidirá si apoyar a Herzeg-Bosnia."
 BOS_political.33.t: "La EUFOR se apodera de"
 BOS_political.33.d: "En una ceremonia en Camp Butmir, la Fuerza de Estabilización liderada por la OTAN ha entregado formalmente su misión a la Unión Europea. La Operación Althea hereda las tropas, bases y mandato de la SFOR bajo los arreglos de Berlín Plus. Para la mayoría de los bosnios el único cambio visible es la bandera en la manga."
 BOS_political.33.a: "Las banderas cambian en Butmir"
 BOS_political.34.t: "El Primer Censo Desde la Guerra"
 BOS_political.34.d: "Los enumeradores han comenzado el primer recuento de población desde 1991. Toda cuestión de etnia, idioma y fe es objeto de controversia, y la República Srpska ya ha anunciado que no aceptará la metodología para contar con ciudadanos que viven en el extranjero. Detrás de las formas se encuentra la pregunta que nadie hace en voz alta: quién todavía está aquí."
 BOS_political.34.a: "Cuenta lo que queda"
 BOS_political.35.t: "Tuzla está quemando"
 BOS_political.35.d: "Las protestas que comenzaron fuera de las fábricas de bancarrota de Tuzla se han extendido a Sarajevo, Zenica y Mostar. Los edificios gubernamentales están ardiendo, y la multitud no está cantando consignas étnicas sino que exige empleos y el enjuiciamiento del fraude de privatización. Los plenums de los ciudadanos se están formando para poner sus demandas directamente a los gobiernos cantonales."
 BOS_political.35.a: "Cumplir las demandas de los plenums"
 BOS_political.35.b: "Restaurar el orden primero"
 BOS_political.36.t: "Solicitud presentada en Bruselas"
 BOS_political.36.d: "El presidente del Consejo de Ministros ha remitido la solicitud de Bosnia para ser miembro de la Unión Europea a la presidencia holandesa del Consejo. Los años de adaptación están por delante antes de que el status candidato esté en alcance, pero la aplicación compromete cada nivel de gobierno, en papel al menos, a la misma dirección."
 BOS_political.36.a: "El camino será largo."
 BOS_political.37.t: "El Alto Representante prohíbe la denegación de genocidio"
 BOS_political.37.d: "En uno de sus actos finales en el cargo, el Alto Representante saliente ha impuesto sanciones penales por negar el genocidio de Srebrenica y glorificar a los criminales de guerra. Banja Luka ha estallado. Los líderes de las Entidades declaran nulo la decisión, anuncian un boicot a las instituciones estatales y hablan abiertamente de recuperar lo que Dayton dio."
 BOS_political.37.a: "La ley se aplica a todos"
 BOS_political.37.b: "Mantenga el estado fuera de él"
 BOS_political.38.t: "Banja Luka Votos para retirarse"
 BOS_political.38.d: "La asamblea de entidades ha dado instrucciones a su gobierno para sacar a la República Srpska del ejército estatal, la autoridad tributaria y el poder judicial dentro de seis meses. Las conclusiones son declaratorias por ahora, pero mapean el camino hacia la disolución en lenguaje llano. Las embajadas están redactando declaraciones, y se pregunta a los garantes de Dayton cuál es el acuerdo que todavía vale."
 BOS_political.38.a: "Llévalo a los garantes"
 BOS_political.38.b: "Espera a que Banja Luka parpadee"
 BOS_political.40.t: "Kosovo declara la independencia"
 BOS_political.40.d: "Pristina ha proclamado la independencia de Serbia. La declaración divide a Bosnia: los dirigentes bosnio y croata se inclinan hacia el reconocimiento, mientras que la República Srpska advierte que es un precedente para su propia separación."
 BOS_political.40.a: "Apoyo de voz a la libre determinación"
 BOS_political.40.b: "Rechazar la declaración unilateral"
 BOS_political.40.c: "Mantenga la neutralidad para mantener el estado unido"
 BOS_political.41.t: "Masa de migrantes en la Una-Sana"
 BOS_political.41.d: "Miles de personas que se desplazan por la ruta de los Balcanes Occidentales están varadas cerca de la frontera croata. Las autoridades del Cantón Una-Sana dicen que los campamentos están desbordados y no pueden enfrentarse solos."
 BOS_political.41.a: "Solicitud de asistencia a la Unión Europea"
 BOS_political.41.b: "Aprieta la frontera y despeja los campamentos"
 BOS_political.42.t: "Acuerdo de Asociación con Europa"
 BOS_political.42.d: "Bosnia y Herzegovina ha firmado el Acuerdo de Estabilización y Asociación con la Unión Europea. Es el primer paso contractual en el largo camino hacia la adhesión."
 BOS_political.42.a: "Un hito hacia Europa"
 BOS_political.43.t: "Un impuesto sobre el valor añadido del Estado"
 BOS_political.43.d: "Un solo IVA estatal reemplaza el antiguo remiendo de los impuestos de ventas de las entidades. La colección está centralizada y los ingresos se comparten a través de una cuenta nacional."
 BOS_political.43.a: "Aplicar el impuesto unificado"
 BOS_political.43.b: "Que las entidades mantengan sus propias tarifas"
 BOS_political.44.t: "El paquete de abril"
 BOS_political.44.d: "Un conjunto negociado de enmiendas constitucionales fortalecería al Estado central y simplificaría la presidencia. Quedan dos votos cortos en la Cámara de Representantes."
 BOS_political.44.a: "Pasar capital para aprobar las reformas"
 BOS_political.44.b: "Deja que el paquete falle"
 BOS_political.45.t: "El Butmir habla"
 BOS_political.45.d: "Los mediadores estadounidenses y europeos han reunido a los líderes del partido en una base cerca de Sarajevo para romper el estancamiento constitucional. Las propuestas piden a las entidades que cedan poderes al Estado."
 BOS_political.45.a: "Colaborar con los mediadores"
 BOS_political.45.b: "Defender las prerrogativas de la entidad"
 BOS_political.46.t: "Distrito de Brcko en cuestión"
 BOS_political.46.d: "La República Srpska amenaza con retirar a sus funcionarios de las instituciones compartidas del distrito de Brcko, el corredor autogobierno puesto bajo supervisión estatal después de la guerra."
 BOS_political.46.a: "Defender el estado compartido del distrito"
 BOS_political.46.b: "Concede terreno para mantener la paz"
 BOS_political.47.t: "Mostar Sin un Gobierno"
 BOS_political.47.d: "Los partidos croatas y bosnios no pueden acordar un estatuto de ciudad, y Mostar ha pasado años sin elecciones locales válidas. La ciudad dividida vaga sin un consejo."
 BOS_political.47.a: "Imposible un estatuto de ciudad unificado"
 BOS_political.47.b: "Dejen a las partes en su despegue"
 BOS_political.48.t: "El Éxodo Acelera"
 BOS_political.48.d: "Los autobuses y los vuelos presupuestarios de Sarajevo, Tuzla y Banja Luka corren por completo en una dirección. Los jóvenes graduados, comerciantes y familias enteras se van para Alemania, Austria y Croacia más rápido de lo que el estado puede reemplazarlos."
 BOS_political.48.a: "Comisión un informe sobre las causas"
 BOS_political.48.b: "Desestimarlo como movilidad ordinaria de la UE"
 BOS_political.49.t: "Komšić gana el Asiento Croat"
 BOS_political.49.d: "Željko Komšić ha ganado la sede croata de la presidencia en los votos de mayoría bosniaca, derrotando al Dragan Čović de HDZ. Las ciudades de mayoría croata lo declaran poco bienvenido, y Zagreb está protestando por el resultado que su propia comunidad rechaza."
 BOS_political.49.a: "Un mandato multiétnico, bastante ganado"
 BOS_political.49.b: "Los votantes croatas fueron revocados, no representados"
 BOS_political.50.t: "El Deadlock del Programa de la OTAN"
 BOS_political.50.d: "Los ministros del SNSD se niegan a permitir que el Estado presente un Programa Nacional Anual a la OTAN, y sin uno el Consejo de Ministros no puede formar. Los meses pasan sin ningún gobierno en absoluto."
 BOS_political.50.a: "Presentar el programa independientemente"
 BOS_political.50.b: "Ofrecer un programa de reforma reetiquetado en su lugar"
 BOS_political.51.t: "Un gobierno, por fin"
 BOS_political.51.d: "Catorce meses después de la elección, el Consejo de Ministros ha sido jurado. Sarajevo tiene un gobierno de nuevo, comprado con un compromiso que salva la cara nadie está totalmente contento."
 BOS_political.51.a: "Volver al trabajo"
 BOS_political.52.t: "Un Alto Representante Sin Mandato"
 BOS_political.52.d: "Christian Schmidt ha asumido el cargo de Alto Representante, pero el Consejo de Seguridad de la ONU nunca aprobó su nombramiento. Rusia, China y los dirigentes de la República Srpska se han apoderado del vacío para llamar a su autoridad ilegítima."
 BOS_political.52.a: "Negocios como de costumbre en Sarajevo"
 BOS_political.53.t: "Reformas impulsadas en el Ballot Box"
 BOS_political.53.d: "A medida que se cerraron las encuestas, el Alto Representante utilizó sus poderes de Bonn para imponer enmiendas a la Constitución de la Federación y a la ley electoral, ampliando la Cámara de los Pueblos y estableciendo plazos para formar gobiernos. Los críticos lo llaman una constitución impuesta; HDZ lo llama retrasado."
 BOS_political.53.a: "Una solución pragmática, sin embargo llegó"
 BOS_political.53.b: "An illiberal overreach"
 BOS_political.53.c: "Mantente fuera de la discusión"
 BOS_political.54.t: "Banja Luka voids la corte"
 BOS_political.54.d: "La asamblea de entidades ha aprobado leyes que declaran que los fallos del Tribunal Constitucional del Estado no se aplican en la República Srpska y prohíben la publicación de las decisiones del Alto Representante en la gaceta oficial de la entidad. El escrito de Sarajevo se detiene ahora en la Línea Inter-Entity Boundary."
 BOS_political.54.a: "Concurso a través de cada canal disponible"
 BOS_political.54.b: "Deja que pase el momento"
 BOS_hr_legitimacy_disputed_tt: "§RLa República Srpska considera nula las decisiones del Alto Representante, profundizando la crisis§!"
 BOS_political.55.t: "Bruselas abre las conversaciones"
 BOS_political.55.d: "Ocho años después de la aplicación de Bosnia, el Consejo Europeo ha acordado abrir negociaciones de adhesión. El camino a la membresía sigue siendo largo, pero por primera vez pasa por Bruselas en lugar de alrededor."
 BOS_political.55.a: "Celebrar el hito"
 BOS_political.55.b: "Temperar las celebraciones"
 BOS_political.57.t: "Dodik condenó y prohibió"
 BOS_political.57.d: "El Tribunal de Bosnia y Herzegovina ha condenado a Milorad Dodik por desafiar las decisiones del Alto Representante y le impidió ocupar su cargo. Las instituciones de la República Srpska deben decidir si aceptar el fallo o desafiarlo."
 BOS_political.57.a: "El fallo está en pie"
 BOS_political.57.b: "No se dirá a la República Srpska quién lo dirige."
 BOS_reject_third_entity_demand: "Rechazar la exigencia de una tercera entidad"
 BOS_reject_third_entity_demand_desc: "Descartar reestructurar la Federación en una entidad croata separada de mayoría croata. Los partidos bosnios respiran aliviados; los partidos croatas dicen que prueba que Sarajevo nunca escuchará."
 BOS_concede_partial_croat_autonomy: "Conceder una autonomía croata parcial"
 BOS_concede_partial_croat_autonomy_desc: "Conceder a los cantones de mayoría croata mayor autogobierno sin llegar a una tercera entidad completa. Responde al agravio central de la HNS, a costa de otra capa de gobierno que coordinar."
 BOS_register_defence_property: "Registrar los bienes de defensa como propiedad estatal"
 BOS_register_defence_property_desc: "Transferir los sitios militares aún reclamados por las entidades a los libros del estado, la condición previa que la OTAN ha establecido para activar un Plan de Acción de Afiliación"
 BOS_request_nato_waiver: "Solicitar una exención de la OTAN"
 BOS_request_nato_waiver_desc: "Pedir a la OTAN que renuncie sin más a la condición de bienes de defensa en lugar de esperar el consentimiento de Republika Srpska. Funciona, y Banja Luka no olvida quién lo pidió."
 BOS_activate_map: "Activar el Plan de Acción para la Adhesión"
 BOS_activate_map_desc: "Con la pregunta de propiedad resuelta, tome el Plan de Acción de Afiliación de la OTAN y comience el camino formal hacia la adhesión."
 BOS_expand_arms_exports: "Ampliar las exportaciones de municiones y armas"
 BOS_expand_arms_exports_desc: "Respaldar a las plantas de armas vinculadas al Estado mientras amplían las exportaciones a compradores de toda Europa y más allá. Las carteras de pedidos están llenas, y también la discusión sobre adónde van a parar los envíos."
 BOS_gulf_investment_delivered_tt: "§GBuroj Ozone rompe terreno en el horario§!"
 BOS_gulf_investment_stalled_tt: "§RBuroj Ozono se encuentra muy corto de lo prometido§!"
 BOS_host_sarajevo_film_festival: "Acoger el Festival de Cine de Sarajevo"
 BOS_host_sarajevo_film_festival_desc: "Respaldar con fondos y logística estatales el mayor festival de cine del sudeste de Europa. Atrae turistas y prensa a Sarajevo cada verano y mantiene el perfil cultural de la ciudad muy por delante de sus vecinos."
 BOS_federation_development_grant: "Subvención para el desarrollo de la Federación"
 BOS_federation_development_grant_desc: "Canalizar fondos del tesoro a infraestructura en los cantones de la Federación de mayoría bosnia. La comunidad bosnia acoge con agrado la inversión, aunque Republika Srpska la interpreta como favoritismo."
 BOS_herzegovina_development_grant: "Beca de desarrollo de Herzegovina"
 BOS_herzegovina_development_grant_desc: "Financiar carreteras y servicios en Herzegovina, de mayoría croata. Los líderes croatas lo toman como reconocimiento, mientras los bosnios resienten que el dinero fluya a los bastiones nacionalistas."
 BOS_srpska_development_grant: "Subvención de desarrollo para Republika Srpska"
 BOS_srpska_development_grant_desc: "Dirigir fondos del tesoro a infraestructura en Republika Srpska. El gesto compra buena voluntad serbia, pero los bosnios se erizan ante la idea de premiar a la entidad que sigue amenazando con irse."
 BOS_croat_grievance: "Gordura política"
 BOS_croat_grievance_desc: "Los partidos croatas dicen que el asiento croata de la presidencia fue decidido por los votos bosnios, no los croatas, y exigen un sistema electoral que no puede ser superado desde fuera de la comunidad."
 BOS_third_entity_demand: "Reestructuración federal"
 BOS_third_entity_demand_desc: "Los cantones de mayoría croata mantienen una autonomía ampliada, ganada a costa de un aparato estatal que es una capa más complicada para correr."
 BOS_contested_high_representative: "Mandato controvertido del Alto Representante"
 BOS_contested_high_representative_desc: "El Alto Representante asumió sus funciones sin que el Consejo de Seguridad de las Naciones Unidas aprobara su aprobación. La República Srpska trata la brecha como licencia para ignorar sus fallos, y cada uso de los poderes de Bonn invita ahora a una lucha por la legitimidad así como a una lucha política."
 BOS_map_participant: "Plan de Acción para la Afiliación a la OTAN"
 BOS_map_participant_desc: "Los oficiales bosnios capacitan y planifican junto con los homólogos de la OTAN en el marco del Plan de Acción para la Afiliación, el camino oficial hacia una eventual adhesión."
 BOS_arms_export_boom: "Exportación de armas"
 BOS_arms_export_boom_desc: "Las plantas de armas conectadas por el Estado tienen capacidad para llenar órdenes de calibre de la OTAN y del Pacto de Varsovia por igual. El tesorería beneficia, y también el argumento sobre quién los envíos realmente llegan."
 BOS_brain_drain_1: "Emigración masiva"
 BOS_brain_drain_1_desc: "Cientos de miles se han ido desde que comenzó la era del viaje sin visa, y los educados y los jóvenes están sobrerepresentados entre ellos. Las aulas, las clínicas y los pisos de fábrica sienten la brecha."
 BOS_brain_drain_eased_tt: "§GLas familias retorcidas están atenuando el problema de la emigración masiva§!"
 BOS_economic_reconstruction: "Reconstruir la economía"
 BOS_economic_reconstruction_desc: "Bosnia de posguerra nunca terminó la reconstrucción. Una generación en adelante, el estado todavía necesita un programa económico coherente en lugar de privatización ad hoc y préstamos extranjeros tomados uno a la vez."
 BOS_reform_agenda_adoption: "Adoptar el Programa de Reforma"
 BOS_reform_agenda_adoption_desc: "Comprometiéndose con el programa de reforma socioeconómica que la UE ha fijado como precio de reactivar la vía de adhesión. Las reformas judiciales y de mercado se mueven más rápido una vez que Bruselas pueda apuntar a un plan formal."
 BOS_growth_plan_negotiations: "Negociar el Plan de Crecimiento"
 BOS_growth_plan_negotiations_desc: "Charlas abiertas sobre la base del Fondo de Reforma y Crecimiento de la UE. El dinero es real, pero también lo son las condiciones que se adjuntan a él."
 BOS_corridor_vc_northern_construction: "Construir el Corredor del Norte"
 BOS_corridor_vc_northern_construction_desc: "Empuje la construcción del Corredor Vc a través de Doboj, Zenica y Sarajevo. Es el proyecto de infraestructura más grande del país desde la guerra, financiado principalmente desde Bruselas."
 BOS_corridor_vc_southern_construction: "Extender el Corredor Sur"
 BOS_corridor_vc_southern_construction_desc: "Lleve la autopista hacia Mostar, cerrando la brecha entre el norte industrial de la Federación y su cara Adriática hacia el sur."
 BOS_corridor_vc_opening: "Abierto Corridor Vc"
 BOS_corridor_vc_opening_desc: "Cortar la cinta en la ruta completada desde la frontera húngara hasta el puerto de Ploče. Es la entrega más clara de dos décadas de desarrollo financiado por la UE."
 BOS_east_energy_partnership: "Financiación de la energía china"
 BOS_east_energy_partnership_desc: "Aprovechar los préstamos y contratistas estatales chinos para mantener las plantas de carbón en funcionamiento y expansión, sea cual sea el costo del archivo de adhesión a la UE."
 BOS_west_energy_partnership: "Política de energía alineada con la UE"
 BOS_west_energy_partnership_desc: "La inversión más eficiente hacia la energía hidroeléctrica y las actualizaciones de la red financiadas por la UE en lugar de nuevas capacidades de carbón, manteniendo el sector energético dentro de las reglas europeas del estado-ayuda."
 BOS_defense_industry_revival: "Revive las Plantas de Defensa"
 BOS_defense_industry_revival_desc: "Poner el estado detrás de Igman Konjic y Unis Ginex, las plantas de municiones que una vez abastecían la mitad de Yugoslavia y ahora se sientan bien bajo capacidad."
 BOS_arms_industry_capacity_expansion: "Ampliación de la capacidad de producción"
 BOS_arms_industry_capacity_expansion_desc: "Retoque las plantas de armamento para dirigir a la vez líneas de producción del Pacto de la OTAN y Varsovia, la combinación que hace que las municiones bosnias puedan venderse casi en cualquier lugar"
 BOS_defense_export_drive: "Perseguir el Boom Exportar"
 BOS_defense_export_drive_desc: "Retrocedan las plantas a medida que aumentan para los mercados de exportación abiertos por renovada demanda en el extranjero. Los libros de pedidos están llenos y se llenan."
 BOS_national_jobs_program: "Iniciar un programa nacional de empleo"
 BOS_national_jobs_program_desc: "Creación de empleo y formación en casa para dar a los cientos de miles que se han ido desde la era libre de visados comenzó una razón para considerar quedarse o regresar."
 BOS_youth_retention_initiative: "Invertir en la Retención de los Jóvenes"
 BOS_youth_retention_initiative_desc: "Ampliar el programa de empleos con subsidios y soporte para vivienda dirigido directamente a los jóvenes graduados y comerciantes que componen la mayor parte del flujo."
 BOS_brain_drain_reversed_tt: "§GEl problema de la emigración masiva se ha resuelto§!"
 BOS_corridor_vc_trade_boost: "Corridor Vc Abierto"
 BOS_corridor_vc_trade_boost_desc: "El enlace de la autopista terminada reduce los tiempos de flete en todo el país y fuera al Adriático, lo que facilita el comercio con el resto de Europa."
 BOS_defense_industrial_base: "Base Industrial de Defensa Revivida"
 BOS_defense_industrial_base_desc: "Igman Konjic y Unis Ginex están más cerca de su antigua capacidad, aunque la producción adicional sigue compitiendo con bienes civiles para las mismas fábricas."
 BOS_jobs_program_idea: "Programa de empleo nacional"
 BOS_jobs_program_idea_desc: "La creación de empleo financiada por el Estado está dando a los trabajadores una razón para quedarse en lugar de unirse a la cola para un autobús con destino a Alemania."
 BOS_youth_retention_idea: "Subvenciones para la retención de jóvenes"
 BOS_youth_retention_idea_desc: "Los subsidios de vivienda y carrera dirigidos a jóvenes graduados están manteniendo algunos de ellos en el país lo suficiente como para comenzar familias y carreras aquí."
 BOS_mostar_industrial_decline: "Ropa de fundición Mostar"
 BOS_mostar_industrial_decline_desc: "La planta de aluminio que fue una vez el mayor consumidor de potencia de la Federación se sienta oscura, y la economía de Mostar es corta varios miles de empleos que no ha reemplazado."
 BOS_mostar_industrial_revival: "Mostar bajo nueva dirección"
 BOS_mostar_industrial_revival_desc: "Un inversor estratégico ha asumido las operaciones de la fundición Mostar, reiniciando la producción a una capacidad reducida pero viable."
 BOS_zenica_industrial_decline: "Zenica Steelworks Wind-down"
 BOS_zenica_industrial_decline_desc: "El horno de explosión que anclaba la economía de Zenica durante más de un siglo se ha enfriado, y la región está absorbiendo la pérdida de miles de empleos."
 BOS_zenica_industrial_revival: "Zenica bajo nueva propiedad"
 BOS_zenica_industrial_revival_desc: "Un comprador ha asumido los siderúrgicos Zenica, manteniendo parte de la vieja fuerza laboral empleada bajo nueva gestión."
 BOS_eu_growth_plan_tranche: "Retirar un tramo del Plan de Crecimiento de la UE"
 BOS_eu_growth_plan_tranche_desc: "Solicitar el siguiente desembolso del Mecanismo de Reforma y Crecimiento de la UE. Una corrupción por encima del umbral o un gobierno demasiado inestable para negociar harán perder el tramo."
 BOS_political.58.t: "La fundición de Mostar es oscura."
 BOS_political.58.d: "Aluminij Mostar, el mayor consumidor de energía de la Federación, ha sido recortado sobre cientos de millones en deudas no pagadas a la utilidad eléctrica. Glencore se alejó de una toma hace meses, y reiniciar una fundición de este tamaño después de un cierre completo puede que ni siquiera sea posible."
 BOS_political.58.a: "Deja que la planta se cierre"
 BOS_political.58.b: "Corte un inversor estratégico"
 BOS_political.59.t: "El horno de hoja de Zenica se hunde"
 BOS_political.59.d: "ArcelorMittal ha idled the blast furnace at its Zenica steelworks, una planta que ha anclado la economía de la ciudad durante más de un siglo. La escasa demanda europea y los altos costos energéticos han hecho que la línea no sea rentable para funcionar."
 BOS_political.59.a: "Deja que el horno permanezca frío"
 BOS_political.59.b: "Encontrar un nuevo propietario"
 BOS_political.60.t: "El bloque 7 de Tuzla cae"
 BOS_political.60.d: "La unidad de lignito financiada por China en Tuzla está oficialmente muerta. La garantía estatal detrás del préstamo incumplió las reglas de la ayuda estatal de la UE hace años, y el gobierno finalmente ha confirmado lo que Bruselas ya estaba diciendo. China Gezhouba quiere su contrato honrado independientemente."
 BOS_political.60.a: "Aceptar la cancelación"
 BOS_political.60.b: "Concurso la terminación"
 BOS_political.61.t: "Viajes gratuitos a Europa"
 BOS_political.61.d: "La UE ha abolido visados de Schengen cortos para los titulares de pasaportes biométricos bosnios. Por primera vez desde la guerra, cruzar a la UE no significa nada más que mostrar un pasaporte en la frontera."
 BOS_political.61.a: "Celebrar el hito"
 BOS_political.61.b: "Adviértete donde conduce este camino"
 BOS_visa_era_emigration_tt: "§YLos viajes sin violencia a la UE han hecho más fácil que nunca§!"
 BOS_political.62.t: "El Movimiento Cívico de las Elecciones 2010"
 BOS_political.62.d: "El SDP multiétnico de Zlatko Lagumdžija ha superado el voto de la Federación por primera vez desde la guerra, mientras que el SNSD de Milorad Dodik barre a Republika Srpska. Seis partidos ahora tienen que construir un gobierno que no puede dominar."
 BOS_political.62.a: "Construir sobre el avance cívico"
 BOS_political.62.b: "Que las entidades mantengan sus terrenos"
 BOS_political.63.t: "Una coalición, dieciséis meses tarde"
 BOS_political.63.d: "Dieciséis meses después de la clausura de las encuestas, una coalición de seis partidos ha formado finalmente un Consejo de Ministros. Tomó la mayor parte de ese tiempo para estar de acuerdo en quién lo presidiría."
 BOS_political.63.a: "Volver a gobernar"
 BOS_paralysis_lifted_tt: "§GLa parálisis de la formación del gobierno se ha resuelto§!"
 BOS_political.64.t: "Regreso de los nacionalistas"
 BOS_political.64.d: "El SDA ha reclamado el título más importante de la Federación, Dragan Čović ocupa el puesto de presidente croata y Dodik ha mantenido estrechamente a la República Srpska. El experimento multiétnico de 2010 se ha derrumbado."
 BOS_political.64.a: "Los viejos bloques han vuelto por una razón."
 BOS_political.64.b: "Pruebe el camino cívico otra vez"
 BOS_political.65.t: "Mostar Votos Otra vez"
 BOS_political.65.d: "Después de que un fallo judicial europeo forzó la mano de Sarajevo e Izetbegović y Čović golpearon un nuevo estatuto de ciudad, Mostar ha celebrado elecciones locales por primera vez en doce años. La ciudad dividida finalmente tiene un consejo elegido."
 BOS_political.65.a: "Un nuevo mandato para la ciudad"
 BOS_political.65.b: "Una tregua frágil, nada más"
 BOS_political.66.t: "Ley de agentes extranjeros de la República Srpska"
 BOS_political.66.d: "Días después de la condena de Dodik, la asamblea de entidades se ha apresurado a través de una ley que obliga a las ONG extranjeras y medios independientes a registrarse como agentes extranjeros e informar cada donación. La OSCE y la Comisión de Venecia lo llaman un retroceso de la sociedad civil."
 BOS_political.66.a: "Condena la represión"
 BOS_political.66.b: "Republika Srpska responde a sí misma"
 BOS_political.67.t: "Un guerrero que nadie servirá"
 BOS_political.67.d: "Dodik ha ignorado una orden de arresto nacional e interpol, que viaja por Belgrado e Israel a Moscú. Cuando la agencia estatal de seguridad trató de arrestarlo dentro de la República Srpska, la policía de entidades se interpuso en el camino."
 BOS_political.67.a: "Presione el arresto"
 BOS_political.67.b: "Que se enfríe la confrontación"
 BOS_rs_police_standoff_tt: "§RLa policía de la República Srpska protege a Dodik del arresto, profundizando la crisis§!"
 BOS_political.68.t: "Una elección rápida para la presidencia de Dodik"
 BOS_political.68.d: "Con Dodik despojado de la presidencia por la comisión electoral, la República Srpska ha celebrado una elección presidencial rápida. El lealista SNSD Siniša Karan y el retador de SDS Branko Blanuša terminan en tres puntos uno del otro."
 BOS_political.68.a: "La máquina SNSD sostiene"
 BOS_political.68.b: "La oposición se rompe"
 BOS_political.69.t: "Ljubić Ruling"
 BOS_political.69.d: "El Tribunal Constitucional ha reducido la garantía de al menos un delegado por grupo étnico por cantón en la Cámara de los Pueblos de la Federación. El Parlamento no tiene mayoría para escribir un reemplazo, por lo que la ley electoral permanece congelada."
 BOS_political.69.a: "Advierta que esto volverá a morder"
 BOS_political.69.b: "Observe y siga adelante"
 BOS_political.49.d_ljubic: "Željko Komšić ha ganado la sede croata de la presidencia en los votos de mayoría bosniaca, derrotando al Dragan Čović de HDZ. La misma brecha electoral que dejó abierto el Tribunal Constitucional en la sentencia de Ljubić hace dos años es ahora el centro del caso de HDZ que los votantes croatas siempre pueden ser revocados. Las ciudades de mayoría croata lo declaran poco bienvenido, y Zagreb está protestando por el resultado que su propia comunidad rechaza."
 BOS_political.70.t: "La policía de Bugojno Bombing"
 BOS_political.70.d: "Una bomba casera ha roto la estación de policía en Bugojno, matando a un oficial e hiriendo a seis. La célula salafista detrás de ella es la primera gran red yihadista cultivada doméstica que el país ha enfrentado desde la guerra."
 BOS_political.70.a: "Tratarlo como una célula aislada"
 BOS_political.70.b: "Sonar la alarma de la radicalización"
 BOS_counter_radicalization_available_tt: "§YAhora se dispone de una decisión contra la radicalización§!"
 BOS_political.71.t: "Fuego en la Embajada de EE.UU."
 BOS_political.71.d: "Un tirador del enclave wahhabista de Gornja Maoča ha disparado más de cien balas contra la embajada estadounidense en Sarajevo antes de que un francotirador lo derribase. El problema de radicalización del país ya no es una historia nacional."
 BOS_political.71.a: "Absorbe la caída diplomática"
 BOS_political.71.b: "Respuestas a la demanda en los enclaves"
 BOS_salafi_enclave_decision_available_tt: "§YAhora se dispone de una decisión para vigilar los enclaves salafi§!"
 BOS_political.72.t: "Ataque a la estación de policía de Zvornik"
 BOS_political.72.d: "Un pistolero ha matado a un oficial de policía en la estación Zvornik en la República Srpska antes de ser muerto, el primer ataque islamista para atacar dentro de la entidad serbia. Algunos de sus conocidos asociados lucharon en Siria."
 BOS_political.72.a: "La amenaza no respeta ninguna línea de entidad"
 BOS_political.73.t: "Washington sanciona la red de Dodik"
 BOS_political.73.d: "El Tesoro de EE.UU. ha sancionado a Milorad Dodik y ampliado la red alrededor de su familia y red patronal, citando la corrupción y la obstrucción deliberada de Dayton. Es el instrumento coercitivo occidental más agudo para la República Srpska hasta ahora."
 BOS_political.73.a: "Responsabilidad atrasada"
 BOS_political.73.b: "Un ataque contra la propia República Srpska"
 BOS_sanctions_deepen_crisis_tt: "§RLas sanciones agravan la actual crisis de secesión en la República Srpska§!"
 BOS_political.74.t: "La Babylution"
 BOS_political.74.d: "El Parlamento permitió que la ley de identificación ciudadana se extendiera en el punto muerto, por lo que los recién nacidos han ido sin números de identificación, pasaportes o tarjetas médicas durante meses. Después de que un bebé gravemente enfermo murió esperando tratamiento en el extranjero, diez mil personas han marchado en Sarajevo, la mayor protesta cívica desde la guerra."
 BOS_political.74.a: "Prométeme una solución rápida"
 BOS_political.74.b: "Dejar que el parlamento lo haga"
 BOS_political.75.t: "Bosnio Califica para la Copa Mundial"
 BOS_political.75.d: "Una victoria de 1-0 en Lituania ha enviado Bosnia y Herzegovina a su primera Copa Mundial como nación independiente. Durante unas semanas, el escuadrón de Edin Džeko tiene a todo el país animando por lo mismo."
 BOS_political.75.a: "Un país unido, si brevemente"
 BOS_political.81.t: "La SAA finalmente toma efecto"
 BOS_political.81.d: "Nueve años después de la firma, el Acuerdo de Estabilización y Asociación ha entrado en vigor. Reanuda un camino europeo que se ha estancado durante años y establece el Programa de Reforma que ahora está tomando forma en el Consejo de Ministros."
 BOS_political.81.a: "Un nuevo comienzo con Bruselas"
 BOS_political.77.t: "B&H Airlines Fundada para siempre"
 BOS_political.77.d: "El gobierno de la Federación ha liquidado el portaequipajes B&H Airlines bajo deudas que nunca podría pagar. Por primera vez desde la independencia, el país no tiene aerolínea nacional."
 BOS_political.77.a: "Déjalo ir."
 BOS_political.77.b: "Arréglalo"
 BOS_political.78.t: "Buroj Ozone Anuncio"
 BOS_political.78.d: "Dubai's Buroj Property Development ha presentado planes para una ciudad de 4,3 millones de euros en Trnovo, justo fuera de Sarajevo, prometiendo miles de empleos. La capital del Golfo está viendo los sectores de bienes raíces y turismo de Bosnia como nunca antes."
 BOS_political.78.a: "Bienvenido al anuncio"
 BOS_political.76.t: "EFT Stanari viene en línea"
 BOS_political.76.d: "La planta de lignito Stanari de 300 megavatios cerca de Banja Luka ha llegado a la operación comercial, la primera nueva planta térmica construida en cualquier lugar de Bosnia desde la guerra. La República Srpska tiene ahora su propia fuente constante de poder, financiada y construida con dinero chino."
 BOS_political.76.a: "Un punto del orgullo de la República Srpska"
 BOS_political.80.t: "El Primer Prido de Sarajevo"
 BOS_political.80.d: "Aproximadamente dos mil personas han marchado por Sarajevo para el primer Orgullo del país, la última antigua capital yugoslava que tiene uno. Una pequeña contraprotesta se reunió bajo una bandera de «valores tradicionales», pero la marcha pasó sin violencia."
 BOS_political.80.a: "Garantizar la protección de los manifestantes"
 BOS_political.80.b: "Mantenga la distancia del estado"
 BOS_political.79.t: "Inundaciones y deslizamientos de tierra Bury Jablanica"
 BOS_political.79.d: "Inundaciones y deslizamientos de tierra Flash han atravesado Bosnia central y meridional, el peor desastre que ha visto el país en una década. Donja Jablanica ha sido golpeado más duro, con un flujo de escombros enterrando casas y matando docenas."
 BOS_political.79.a: "Llamamiento a la ayuda solidaria de la UE"
 BOS_political.79.b: "Reconstruido por nuestra cuenta"
 BOS_pass_jmbg_law: "Aprobar la ley JMBG"
 BOS_pass_jmbg_law_desc: "Hacer aprobar en el parlamento una nueva ley de documento de identidad ciudadano, que ponga fin al lapso de registro que ha dejado a los recién nacidos sin documentos de identidad."
 BOS_jmbg_law_passed_tt: "§GLa ley de identificación ciudadana ha sido sustituida, y las protestas han disminuido§!"
 BOS_counter_radicalization_program: "Lanzar un programa de contrarradicalización"
 BOS_counter_radicalization_program_desc: "Financiar el acercamiento y la vigilancia dirigidos a las redes salafistas detrás del reciente atentado, para revertir parte del daño a la seguridad interna."
 BOS_monitor_salafi_enclaves: "Vigilar los enclaves salafistas"
 BOS_monitor_salafi_enclaves_desc: "Poner aldeas como Gornja Maoča bajo vigilancia sostenida. Mejora la detección y dice a las comunidades bosnias que viven allí exactamente cómo las ve el Estado."
 BOS_repatriate_foreign_fighters: "Repatriar y procesar a combatientes extranjeros"
 BOS_repatriate_foreign_fighters_desc: "Repatriar a los ciudadanos que lucharon por el EI en Siria e Irak y juzgarlos conforme a la ley antiterrorista de 2014. La reintegración es cara y no todos los casos terminan limpiamente."
 BOS_reintegration_success_tt: "§GLos repatriados se han reintegrado con éxito§!"
 BOS_reintegration_relapse_tt: "§RAlgunos retornados han retrocedido hacia redes radicales§!"
 BOS_government_formation_paralysis: "Parálisis de la formación gubernamental"
 BOS_government_formation_paralysis_desc: "Ninguna coalición manda suficientes escaños para formar un Consejo de Ministros. Los ministerios se ocupan de los presupuestos del cuidador mientras las partes negocian."
 BOS_civil_society_crackdown: "Sociedad Civil Crackdown"
 BOS_civil_society_crackdown_desc: "Las leyes de los agentes extranjeros de la República Srpska obligan a las ONG y a los medios independientes a registrar, reportar su financiación y etiquetar su propio producto. Los vigilantes y los donantes se están retirando de la entidad."
 BOS_domestic_terror_threat_1: "Amenaza contra el terrorismo nacional"
 BOS_domestic_terror_threat_1_desc: "Una pequeña pero activa red salafista opera en gran parte fuera de la opinión del estado, sacando reclutas de un puñado de comunidades aisladas."
 BOS_counter_radicalization_measures: "Medidas de lucha contra la radicalización"
 BOS_counter_radicalization_measures_desc: "Los programas de extensión y el monitoreo expandido están disipando en las redes que produjeron el bombardeo de Bugojno."
 BOS_salafi_enclave_monitoring: "Vigilancia del enclave de Salafi"
 BOS_salafi_enclave_monitoring_desc: "Los servicios de seguridad mantienen una vigilancia permanente sobre Gornja Maoča y comunidades similares. Obtiene más parcelas de las que solía, a costa de la confianza en los barrios que se observan."
 BOS_foreign_fighter_reintegration: "Reintegración de los combatientes extranjeros"
 BOS_foreign_fighter_reintegration_desc: "Los repatriados condenados y liberados en el marco del programa de repatriación están siendo dirigidos a trabajar y alejados de las redes que los reclutaron por primera vez."
 BOS_eufor_deterrence: "Reforzamiento de la EUFOR"
 BOS_eufor_deterrence_desc: "Una guarnición más grande de la EUFOR Althea es un recordatorio visible de que la paz de Bosnia está fuera de los garantes, hecho que pesa sobre cualquiera en Banja Luka pensando en la secesión."
 BOS_eufor_deterrence_tt: "§YLa presencia reforzada de la EUFOR amortigua el riesgo de una puja de secesión de la República Srpska§!"
 BOS_jmbg_crisis: "JMBG Crisis"
 BOS_jmbg_crisis_desc: "Los recién nacidos van sin documentos de identidad mientras que el Parlamento no está de acuerdo con una ley de identificación ciudadana sustitutiva. Cuanto más se arrastre, mayor será la protesta."
 BOS_world_cup_unity: "Fiebre del Mundial"
 BOS_world_cup_unity_desc: "La carrera del equipo nacional a su primera Copa del Mundo ha dado a los bosnios, croatas y serbios algo similar para animar al mismo tiempo."
 BOS_stanari_plant_online: "Planta de Stanari en línea"
 BOS_stanari_plant_online_desc: "La planta de lignito Stanari, construida en China, está alimentando el poder constante en la red de Republika Srpska, la primera nueva capacidad térmica construida en cualquier lugar del país desde la guerra."
 BOS_national_carrier_pride: "El orgullo de la compañía nacional"
 BOS_national_carrier_pride_desc: "El portaaviones de bandera subvencionado del estado sigue volando, un pequeño punto de orgullo en un país que se ha ido sin uno desde 2015."
