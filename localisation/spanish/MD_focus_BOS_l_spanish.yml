 BOS_focus: "Bosnio Enfoque Árbol"
 BOS_army_of_the_federation_bosnia_herzegovina: "Ejército de la Federación"
 BOS_army_of_the_federation_bosnia_herzegovina_desc: "Las formaciones bosniacas y croatas de la Federación deben entrar en la estructura de mando nacional sin perder disponibilidad operacional."
 BOS_army_of_republic_of_srpska: "Ejército de la República Srpska"
 BOS_army_of_republic_of_srpska_desc: "Las formaciones de la República Srpska deben estar representadas en las nuevas fuerzas armadas si hay que soportar la unificación militar."
 BOS_air_doctrine: "Examen de la Doctrina del Aire"
 BOS_air_doctrine_desc: "El pequeño brazo aéreo de Bosnia necesita una doctrina adecuada para la defensa territorial, el transporte y el apoyo de las fuerzas terrestres."
 BOS_air_defence_initiative: "Iniciativa de defensa aérea"
 BOS_air_defence_initiative_desc: "Una red de defensa aérea con capas ofrece a Bosnia una respuesta práctica a los aviones hostiles sin requerir una gran flota de combatientes."
 BOS_apc_armament: "Blindaje Transportadores de personal"
 BOS_apc_armament_desc: "Las unidades de equipamiento con portadores de personal blindados protegerán la infantería al tiempo que darán a las formaciones mecanizadas una mayor potencia de fuego."
 BOS_re_enlist_ratko_mladic: "Re-Enlist Ratko Mladić"
 BOS_re_enlist_ratko_mladic_desc: "El regreso de Ratko Mladić al mando proporcionaría experiencia a costa de la reconciliación y la legitimidad internacional."
 BOS_detain_ratko_mladic: "Detain Ratko Mladić"
 BOS_detain_ratko_mladic_desc: "La cooperación con la justicia internacional eliminará a Ratko Mladić de los asuntos militares, pero enojará a muchos serbios bosnios."
 BOS_sam_systems: "Implementar sistemas SAM"
 BOS_sam_systems_desc: "Los misiles fijos de superficie a aire protegerán a Sarajevo y las principales infraestructuras militares del ataque aéreo."
 BOS_aa_personnel_equipment: "Unidades de Defensa Aérea Equip"
 BOS_aa_personnel_equipment_desc: "Los equipos móviles de defensa antiaérea necesitan lanzadores modernos, sensores y entrenamiento para acompañar las formaciones terrestres."
 BOS_helicopter_transportation: "Ampliar el transporte de helicópteros"
 BOS_helicopter_transportation_desc: "Una flota de helicópteros de transporte más grande apoyará el despliegue rápido, la evacuación y el socorro en casos de desastre."
 BOS_radar_detection_advancement: "Detección de radares avanzados"
 BOS_radar_detection_advancement_desc: "Una moderna estación de radar conectará las unidades de defensa aérea de Bosnia y proporcionará una alerta temprana de acercarse a los aviones."
 BOS_domestic_production: "Producción de aeronaves nacionales"
 BOS_domestic_production_desc: "Una planta militar nacional mantendrá el equipo de la fuerza aérea y reducirá la dependencia de proveedores extranjeros inciertos."
 BOS_national_air_force_scheme: "Programa nacional de fuerza aérea"
 BOS_national_air_force_scheme_desc: "Un programa nacional de fuerza aérea combinará luchadores, apoyos y inversiones basadas en un plan de adquisiciones."
 BOS_house_of_representatives: "Empoderar a la Cámara de Representantes"
 BOS_house_of_representatives_desc: "Una Cámara de Representantes más fuerte dará a la legislación nacional un mandato democrático claro, preservando al mismo tiempo la representación constitucional para cada pueblo constituyente."
 BOS_bosnian_elections_crisis_gate_tt: "Sólo está disponible mientras el país se encuentra en condiciones de crisis financiera."
 BOS_the_federation: "Renovar el Pacto Federal"
 BOS_the_federation_desc: "Renovar el pacto federal aclarará los poderes de las entidades y reducirá la influencia extranjera, aunque cada liderazgo constitutivo debe renunciar a cierta libertad de acción."
 BOS_elections_political: "Reforma del Sistema Electoral"
 BOS_elections_political_desc: "La reforma electoral establecerá un mandato duradero para la presidencia rotatoria y determinará qué coalición nacional controla el programa de modernización."
 BOS_balkan_backyard: "Balkan Backyard"
 BOS_balkan_backyard_desc: "La memoria compartida de la prosperidad yugoslava puede apoyar un proyecto regional voluntario, pero los gobiernos vecinos deben ser persuadidos en lugar de presionados o coaccionados."
 BOS_fight_or_perish: "Luchar o Perish"
 BOS_fight_or_perish_desc: "El Estado aprovechará su mano de obra restante y aceptará la tensión necesaria para sobrevivir a la guerra civil."
 BOS_unified_armed_forces: "Fuerzas Armadas Unificadas"
 BOS_unified_armed_forces_desc: "Una fuerza unificada aceptable para todos los pueblos constituyentes completará el programa de recuperación cooperativa y pondrá fin a las medidas financieras de emergencia."
 BOS_anti_federation_propaganda: "Desafío de la Federación"
 BOS_anti_federation_propaganda_desc: "Rechazar la autoridad federal, dirigir nuevas industrias hacia la República Srpska y profundizar los vínculos con Serbia a costa de la estabilidad nacional."
 BOS_alija_izetbegovic_legacy: "Alija Izetbegović legado"
 BOS_alija_izetbegovic_legacy_desc: "El legado de Alija Izetbegović vincula la estadidad bosnia a las instituciones democráticas y la movilización de tiempos de guerra. Sus sucesores deben decidir qué parte de esa herencia guiará a Bosnia."
 BOS_european_relations: "Revive el legado yugoslavo"
 BOS_european_relations_desc: "La divulgación cultural y política en toda la ex Yugoslavia convertirá la nostalgia en apoyo de la cooperación regional."
 BOS_revive_relation_with_serbia_yugoslavia: "Relaciones de Revelación con [SER.GetName]"
 BOS_revive_relation_with_serbia_yugoslavia_desc: "El restablecimiento de los vínculos oficiales con Serbia fortalecerá el gobierno encabezado por la República Srpska, mientras que los alarmantes dirigentes bosnios y croatas."
 BOS_eu_loans: "Préstamos para el desarrollo de la UE"
 BOS_eu_loans_desc: "El crédito para el desarrollo europeo proporcionará liquidez inmediata para la reconstrucción, añadiendo al mismo tiempo una obligación de deuda medida."
 BOS_bosnian_revanchism: "Bosnian Revanchism"
 BOS_bosnian_revanchism_desc: "Los líderes revanchistas colocarán las reivindicaciones bélicas bosnias por encima del compromiso de Dayton, fortaleciendo los intereses militares y arriesgando un nuevo conflicto comunal."
 BOS_western_objectives: "Alineación occidental"
 BOS_western_objectives_desc: "Una firme alineación occidental abrirá instituciones euroatlánticas y asistencia en materia de seguridad al cerrar la alternativa oriental."
 BOS_eastern_frontier: "Alineación oriental"
 BOS_eastern_frontier_desc: "Bosnia tratará de establecer asociaciones rusas y serbias como contrapeso oriental para la supervisión occidental."
 BOS_a_new_struggle: "Una nueva lucha"
 BOS_a_new_struggle_desc: "Los organizadores revanchistas movilizarán las redes nacionalistas y debilitarán el asentamiento político de la posguerra."
 BOS_us_assistance: "Asistencia de los Estados Unidos"
 BOS_us_assistance_desc: "Los vínculos comerciales más estrechos con los Estados Unidos sustituirán los amplios vínculos comerciales de la OTAN por una asociación bilateral centrada."
 BOS_bosnian_euro_defence_clause: "Garantías europeas de defensa"
 BOS_bosnian_euro_defence_clause_desc: "Los estados europeos clave decidirán individualmente si garantizarán a Bosnia como la EUFOR transfiere la responsabilidad a las instituciones nacionales."
 BOS_russo_bosnian_alignment: "Asociación rusa"
 BOS_russo_bosnian_alignment_desc: "Una asociación formal con Rusia profundizará el comercio oriental y el apoyo político sin borrar la soberanía de Bosnia."
 BOS_serbian_bosnian_arms_treaty: "[SER.GetName] Tratado sobre armas de Bosnia"
 BOS_serbian_bosnian_arms_treaty_desc: "Las licencias de producción serbia acelerarán el rearme mientras aumentan la influencia de Belgrado sobre la política de defensa bosnia."
 BOS_srpska_supremacy: "Srpska Supremacy"
 BOS_srpska_supremacy_desc: "Un programa supremacista desmantelará el reparto del poder y colocará al Estado bajo las instituciones de la República Srpska, provocando a los demás pueblos constituyentes."
 BOS_national_awakening: "Despertar nacional"
 BOS_national_awakening_desc: "El movimiento revanchista romperá con la supervisión internacional y preparará una incautación islamista del poder estatal."
 BOS_relax_conscription_laws: "Leyes de Relajación de la Conscripción"
 BOS_relax_conscription_laws_desc: "La reducción del servicio obligatorio aliviará la carga que pesa sobre los hogares a medida que las fuerzas de las entidades regresen al control civil nacional."
 BOS_cooperation_alignment: "Cooperativa de alineación"
 BOS_cooperation_alignment_desc: "Las medidas conjuntas de administración y lucha contra la corrupción alinearán a las entidades con Sarajevo sin abolir su autonomía."
 BOS_bosnian_trade_alliance: "Asociación de armas occidentales"
 BOS_bosnian_trade_alliance_desc: "Las licencias de aeronaves y armas de infantería estadounidenses anclarán una asociación de armas occidentales."
 BOS_beograd_conference: "Conferencia de Belgrado"
 BOS_beograd_conference_desc: "Una conferencia en Belgrado resolverá las controversias económicas y de seguridad antes de que Bosnia busque una alianza oriental más amplia."
 BOS_muslim_strong_arm: "Islamista Vanguard"
 BOS_muslim_strong_arm_desc: "Una vanguardia islamista consolidará el nuevo régimen y buscará apoyo de gobiernos simpáticos en el extranjero."
 BOS_muslim_nationalism: "Nacionalismo musulmán"
 BOS_muslim_nationalism_desc: "El nacionalismo musulmán combina la autoridad religiosa, la movilización y una política exterior intervencionista."
 BOS_demote_serbian_irrational_nationalism_new: "Contain Serbian Hardliners"
 BOS_demote_serbian_irrational_nationalism_new_desc: "Los partidos federales aislarán facciones serbias, negociando tensión a corto plazo para un estado cívico más fuerte."
 BOS_accommodate_serbian_pride_new: "Alojamiento en Serbia Autonomía"
 BOS_accommodate_serbian_pride_new_desc: "Las concesiones constitucionales reconocerán la autonomía serbia y atraerán a las partes moderadas de la República Srpska al gobierno."
 BOS_nato_status: "Buscar en la OTAN"
 BOS_nato_status_desc: "Bosnia tratará de ser miembro de la OTAN sólo después de la reconciliación nacional y el fin de la supervisión extranjera de emergencia."
 BOS_union_with_serbia: "Unión con Serbia"
 BOS_union_with_serbia_desc: "Serbia recibirá una propuesta negociada de unión política y podrá aceptar o rechazar la incorporación de Bosnia."
 BOS_mosque_construction: "Programa de construcción de mezquitas"
 BOS_mosque_construction_desc: "El apoyo estatal a las mezquitas e instituciones religiosas profundizará la identidad islámica del régimen."
 BOS_milorad_dodik_new: "Sideline Milorad Dodik"
 BOS_milorad_dodik_new_desc: "La eliminación de la red patronal de Milorad Dodik reducirá la corrupción pero alienará partes del electorado de la República Srpska."
 BOS_european_affairs: "Europeann Affairs"
 BOS_european_affairs_desc: "El comercio europeo y las instituciones democráticas se convertirán en la base de la política exterior pacífica de Bosnia."
 BOS_pathway_towards_eu_membership: "Camino de los miembros de la UE"
 BOS_pathway_towards_eu_membership_desc: "Bosnia cumplirá con las necesidades de infraestructura y gobernanza europeas, mientras que los miembros de la UE deciden si invertir."
 BOS_formation_of_bonds_with_the_eu: "Construir los niveles económicos de la UE"
 BOS_formation_of_bonds_with_the_eu_desc: "Los vínculos comerciales ampliados con la Unión Europea profundizarán el acceso a los mercados y reducirán los costos de financiación."
 BOS_yugoslav_cultural_revival: "Renacimiento cultural yugoslavo"
 BOS_yugoslav_cultural_revival_desc: "La película, la música y los memoriales de guerra compartidos financiados por el Estado presentarán las décadas yugoslavas como herencia común en lugar de un experimento fallido."
 BOS_common_market_proposal: "Propuesta del Mercado Común"
 BOS_common_market_proposal_desc: "Una oferta de comercio libre de aranceles entre los estados sucesores reconstruirá los lazos comerciales cortados en el decenio de 1990."
 BOS_federal_charter: "Proyecto de Carta Federal"
 BOS_federal_charter_desc: "Un proyecto de constitución publicado para una federación voluntaria dará al movimiento de reunificación un programa político concreto."
 BOS_reconciliation_commission: "Comisión de Reconciliación"
 BOS_reconciliation_commission_desc: "Una comisión conjunta sobre las quejas en tiempo de guerra escuchará testimonios de los tres pueblos constituyentes y reducirá el costo interno del proyecto yugoslavo."
 BOS_convene_the_federation: "Convocar la Federación"
 BOS_convene_the_federation_desc: "Sarajevo convocará a los gobiernos sucesores para negociar una federación restaurada una vez que el apoyo popular lo permita."
 BOS_greater_srpska_state: "Estado de la República Srpska"
 BOS_greater_srpska_state_desc: "El estado centralizado será reconstruido alrededor de las instituciones de la República Srpska, reemplazando el proyecto sindical por supremacía de entidad en casa."
 BOS_purge_the_federation: "Purga de la Federación"
 BOS_purge_the_federation_desc: "Los funcionarios bosnios y croatas serán retirados de los ministerios, tribunales y mandos policiales, poniendo fin a la resistencia organizada al gobierno de la República Srpska."
 BOS_srpska_command_primacy: "Primacía del Comando de la República Srpska"
 BOS_srpska_command_primacy_desc: "Los oficiales de la República Srpska llenarán todos los puestos de alto rango en las fuerzas armadas, obligando al ejército a dirigir la entidad."
 BOS_dominant_entity: "La Entidad Dominante"
 BOS_dominant_entity_desc: "La República Srpska rige actualmente Bosnia de hecho y en derecho. Las instituciones federales restantes existen para servir a la entidad."
 BOS_council_democracy: "Consejo de Democracia"
 BOS_council_democracy_desc: "Los consejos de trabajo elegirán delegados a los órganos nacionales, dando al trabajo organizado un papel constitucional permanente."
 BOS_nationalize_heavy_industry: "Nacionaliza la industria pesada"
 BOS_nationalize_heavy_industry_desc: "El estado tomará apuestas de control en molinos, minas y maquinas y los colocará bajo administración del consejo."
 BOS_workers_republic: "Proclamar la República de los Trabajadores"
 BOS_workers_republic_desc: "El movimiento obrero sustituirá al orden post-Dayton por una república socialista gobernada a través de sus consejos."
 BOS_business_sector_management: "Desarrollar el sector empresarial"
 BOS_business_sector_management_desc: "Un proyecto de oficina costoso en Sarajevo formalizará la economía de los servicios, siempre que haya suficientes trabajadores disponibles para su personal."
 BOS_lumber_harvesting: "Desarrollar el sector forestal"
 BOS_lumber_harvesting_desc: "Las normas de silvicultura y procesamiento sostenibles ampliarán las exportaciones rurales sin depender de otro programa permanente de subvenciones."
 BOS_land_mines_desc: "Los campos minados en tiempo de guerra siguen matando a civiles, restringiendo los asentamientos y eliminando las tierras productivas del uso."
 BOS_prep_for_civil_war_map: "Preparativos de Guerra Civil"
 BOS_prep_for_civil_war: "Operaciones de preparación para la guerra civil"
 BOS_prep_for_civil_war_desc: "Republika Srpska se rearma mientras Bosnia se acerca a un nuevo conflicto civil. Las operaciones preparatorias pueden asegurar armas y mejorar la preparación del gobierno antes de que comience la lucha."
 BOS_bosnian_faction_management: "Grupo Constituyente de Gestión"
 BOS_internal_factions: "Los pueblos de Bosnia"
 BOS_internal_factions_desc: "El acuerdo de Dayton divide la autoridad entre las instituciones nacionales, la Federación de Bosnia y Herzegovina y la República Srpska. La política gubernamental cambia la actitud de cada grupo constituyente, Estabilidad y la voluntad de proporcionar mano de obra."
 BOS_return_of_entitled_lands: "Integrar las Tierras Controladas"
 BOS_return_of_entitled_lands_desc: "Integrar un estado vecino controlado cuando alcance al menos un 80% de Cumplimiento y caiga por debajo del 10% de Resistencia."
 BOS_islamic_uprising: "El destino de la guerra civil bosnia"
 BOS_islamic_uprising_desc: "Los combatientes de El Mudžahid pueden volverse contra Sarajevo y contra Republika Srpska si la guerra civil dura más que su paciencia."
 BOS_declare_islamic_takeover: "El Mudžahid Revolt"
 BOS_declare_islamic_takeover_desc: "Combatientes islamistas extranjeros se preparan para romper con el gobierno y fundar su propio Estado mientras continúa la guerra civil."
 BOS_core_states_2: "Integrar [FROM.GetName]"
 BOS_core_states_2_desc: "Comprometer recursos políticos e industriales a integrar este Estado vecino sumiso."
 BOS_raid_weapon_stockpiles: "Almacenes de armas raras"
 BOS_raid_weapon_stockpiles_desc: "Incautar armas de infantería de depósitos de guerra sin custodia antes de que comience un nuevo conflicto civil."
 BOS_civil_war: "La tormenta de renombre"
 BOS_civil_war_desc: "Republika Srpska se prepara para la secesión. Si la crisis no se resuelve, la guerra civil comenzará cuando esta misión expire."
 BOS_croats_declare_independence: "Los croatas declaran independencia"
 BOS_croats_declare_independence_desc: "Las comunidades croatas hostiles pueden apoyar una secesión de Herzegovina si la Estabilidad nacional sigue baja."
 BOS_srpska_declares_independence: "Republika Srpska declara la independencia"
 BOS_srpska_declares_independence_desc: "Las comunidades serbias hostiles pueden apoyar la secesión si la Estabilidad nacional sigue baja."
 BOS_quell_serbians: "Oposición serbia de Suppress"
 BOS_quell_serbians_desc: "Utilizar medidas coercitivas contra las organizaciones serbias hostiles, reduciendo su actitud y Estabilidad mientras cambia el apoyo de los partidos."
 BOS_gain_srpska_popular_support: "Ganar el apoyo popular serbio"
 BOS_gain_srpska_popular_support_desc: "Financiar programas de acercamiento y locales para mejorar la Actitud y la Estabilidad serbias."
 BOS_fund_bosniak_community_programs: "Financiar programas de la comunidad bosnia"
 BOS_fund_bosniak_community_programs_desc: "Pagar con el tesoro escuelas, clínicas y servicios locales en zonas bosnias. Reconstruye la Confianza bosnia como lo haría un impulso político, pero con dinero en lugar de Poder político."
 BOS_fund_croat_community_programs: "Financiar programas de la comunidad croata"
 BOS_fund_croat_community_programs_desc: "Pagar con el tesoro escuelas, clínicas y servicios locales en zonas croatas. Reconstruye la Confianza croata como lo haría un impulso político, pero con dinero en lugar de Poder político."
 BOS_fund_srpska_community_programs: "Financiar programas de la comunidad serbia"
 BOS_fund_srpska_community_programs_desc: "Pagar con el tesoro escuelas, clínicas y servicios locales en zonas serbias. Reconstruye la Confianza serbia como lo haría un impulso político, pero con dinero en lugar de Poder político."
 BOS_collaboration_with_serbians: "Cooperar con los líderes serbios"
 BOS_collaboration_with_serbians_desc: "Convertir a los líderes serbios amigos en socios leales mediante una cooperación política sostenida."
 BOS_quell_bosniaks: "Oposición de los bosnios"
 BOS_quell_bosniaks_desc: "Utilizar medidas coercitivas contra las organizaciones bosniacas hostiles, aceptando la inestabilidad inmediata para remodelar el apoyo de los partidos."
 BOS_collaboration_with_bosniaks: "Cooperar con los líderes bosnios"
 BOS_collaboration_with_bosniaks_desc: "Convertir a los dirigentes bosnios amigos en socios leales mediante una cooperación política sostenida."
 BOS_quell_croats: "Oposición de Croat Suppress"
 BOS_quell_croats_desc: "Utilizar medidas coercitivas contra las organizaciones croatas hostiles, aceptando la inestabilidad inmediata para remodelar el apoyo de los partidos."
 BOS_gain_bosniak_popular_support: "Ganar el apoyo popular bosnio"
 BOS_gain_bosniak_popular_support_desc: "Financiar programas de acercamiento y locales para mejorar la Actitud y la Estabilidad bosnias."
 BOS_collaboration_with_croats: "Cooperar con los líderes croatas"
 BOS_collaboration_with_croats_desc: "Convertir a los líderes croatas amigos en socios leales mediante una cooperación política sostenida."
 BOS_gain_croat_popular_support_desc: "Financiar programas de acercamiento y locales para mejorar la Actitud y la Estabilidad croatas."
 BOS_destabilize_the_government_desc: "Hundir deliberadamente la confianza pública y la disposición para la guerra. Con la estabilidad y el apoyo a la guerra tan bajos, las entidades serbias o croatas hostiles pueden declarar la independencia."
 BOS_srpska_faction: "Serbs"
 BOS_bosniak_faction: "Bosniaks"
 BOS_croat_faction: "Croats"
 srpska_attitude_friendly: "§GAmén§!"
 BOS_all_factions_at_least_friendly_trigger: "Los tres grupos constitutivos son al menos §GAmén§!"
 bosniak_attitude_friendly: "§GAmén§!"
 croat_attitude_friendly: "§GAmén§!"
 BOS_anti_government_demonstrations_desc: "Muchos han tomado las calles sobre nuestras acciones. El malestar disminuirá una vez que se recuperen la actitud de las personas afectadas y Estabilidad."
 BOS_internal_faction_balance: "Los pueblos de Bosnia"
 BOS_internal_faction_balance_desc: "El equilibrio de los intereses bosnio, croata y serbio en todo el aparato estatal da forma a la estabilidad y al reclutamiento."
 BOS_landmine_contamination: "Landmine Contamination"
 BOS_landmine_contamination_desc: "Los campos minados a tiempo de guerra en esta región matan a civiles, restringen los asentamientos y mantienen las tierras productivas fuera de uso."
 BOS_cooperator: "Bosnian Co-operator"
 BOS_political_reformer: "Reformador Político"
 BOS_presidency_rotation_cooldown: "La rotación es debida"
 BOS_rotation_of_leaders: "Realizar una rotación presidencial"
 BOS_rotation_of_leaders_desc: "Transfiera la presidencia colectiva al próximo representante constitutivo una vez que termine el período de rotación actual."
 BOS_rotation_branch_available_tt: "Uno de los representantes de los pueblos constituyentes preside actualmente la Presidencia"
 BOS_s_bridge_builder: "Bosnia's Bridge-Builder"
 bos_croat_war_info_tool_tip: "§RNOTE§!\nHerzeg-Bosnia romperá y declarará guerra contra nosotros y la República Srpska.\nAlgunos se enfocarán hasta que termine la guerra civil.\nUna vez que termine la guerra, un evento volverá a abrirlos."
 bos_dodik_gains_power_2010_tt: "Milorad Dodik gana poder alrededor de 2010-2011"
 bos_this_will_lock_certain_paths_within_the_focus_tree: "§REsto bloqueará los caminos para algunas partes del árbol de enfoque§!"
 BOS_united_nations_aid: "Ayuda de asociados internacionales"
 BOS_croats_declare_independence_hidden: "Restaurar las zonas desmilitarizadas de posguerra"
 BOS_croats_declare_independence_hidden_desc: "Restaurar las zonas desmilitarizadas de las entidades cuando la crisis de secesión no haya derivado en guerra civil."
 bos_srpska_builds_up: "§YLa República Srpska§! ha visto nuestros actos y ha iniciado §Rrearmament§! de todos los miembros activos anteriores del servicio."
 bos_remove_idea_tooltips: "El jugador ahora puede justificar objetivos de guerra \nEl colapso de la guerra civil será eliminado"
 BOS_financial_crisis_desc: "La caída de las exportaciones, el escaso crédito y el aumento del desempleo están debilitando las finanzas públicas de Bosnia. Un programa de recuperación coherente puede reducir la crisis."
 BOS_treasury_higher_than_3_5_tt: "Requiere más de §Y$3.5 mil millones§! en el tesoro."
 BOS_treasury_higher_than_4_5_tt: "Requiere más de §Y$4.5 milliardes§! en el tesoro."
 BOS_treasury_higher_than_8_5_tt: "Requiere más de §Y$8.5 milliardes§! en el tesoro."
 BOS_treasury_higher_than_4_3_tt: "Requiere más de §Y$4.3 billones§! en el tesoro."
 BOS_treasury_higher_than_12_6_tt: "Requiere más de §Y$12.6 milliardes§! en el tesoro."
 BOS_convene_the_federation_tt: "£decision_icon_small La decisión §YConvene the Federation§! completa la reunificación una vez que cada Estado sucesor alcance §Y75%§! Yugonostalgia y lideramos el reavivamiento"
 BOS_purge_quell_decisions_tt: "£decision_icon_small El §YOposición de los bosnios§! y §YOposición de Croat Suppress§! las decisiones siguen disponibles"
 BOS_faction_attitude_header: "Confianza"
 BOS_faction_stability_header: "Efecto neto"
 BOS_faction_manpower_header: "mano de obra"
 BOS_faction_value_unavailable: "§gUnavailable§!"
 BOS_STABILITY_TOOLTIP: "§YNet Effect§! muestra los modificadores nacionales combinados que actualmente producen los grupos constitutivos: el cambio Estabilidad de su confianza y el cambio de población recruitable de sus mano de obra."
 BOS_net_stability_factor_display: "§YEstabilidad§!: [?ROOT.BOS_internal_faction_stability_factor|%0]"
 BOS_net_manpower_factor_display: "§YReclutas§!: [?ROOT.BOS_internal_faction_manpower_factor|%0]"
 BOS_MANPOWER_TOOLTIP: "§Ymano de obra§! mide a los reclutas que cada grupo constituyente proporcionará. Los valores combinados modifican la Población Contratable."
 bos_no_wars_tt: "§RNo podemos declarar guerras§!.\nSi la estabilidad cae por debajo del 30% y las facciones constitutivas no son leales, el riesgo de guerra civil aumenta marcadamente."
 bos_serbian_attitude_not_loyal_tt: "Requiere £text_icon_bos_srpska §YSerbs§! estar por debajo §GLoyal§! Confianza."
 bos_croat_attitude_not_loyal_tt: "Requiere £text_icon_bos_croat §YCroats§! estar debajo §GLoyal§! Confianza."
