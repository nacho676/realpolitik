 BOS_bnttmih_mio_trait_barrel_forge: "Forge"
 BOS_bnttmih_mio_trait_m60_recoilless: "M60 Recoilless Rifle"
 BOS_bnttmih_mio_trait_gun_125_m84: "M-84 125mm Gun"
 BOS_bnttmih_mio_trait_gun_100_t55: "T-55 100mm Gun"
 BOS_bnttmih_mio_trait_m84_recoilless: "M84 Recoilless Rifle"
 BOS_bnttmih_mio_trait_at_gun_100: "100mm Anti-Tank Gun"
 BOS_bnttmih_mio_trait_mountain_gun_100: "100mm Mountain Gun"
 BOS_croat_secession_crisis: "Crisis de la secesión croata"
 BOS_croat_secession_crisis_desc: "Las instituciones Herceg-Bosna están redactando legislación de retiro y perforando sus propias unidades. Si las quejas croatas no se abordan antes de que se acabe el enfrentamiento, el sur se descompone en armas."
 BOS_dayton_two: "Asentamientos de Dayton revisados"
 BOS_dayton_two_desc: "Un acuerdo constitucional renegociado movilizó la autonomía de las entidades más amplia para poner fin a los combates. Se compra estabilidad, a costa de un centro más suelto."
 BOS_srpska_secession_crisis_opens_tt: "La República Srpska abre una crisis de secesión. Si no se resuelve antes de que cierre la ventana, la entidad va a la guerra."
 BOS_croat_secession_crisis_opens_tt: "Herceg-Bosna abre una crisis de secesión. Raise Croat Trust to Friendly antes de que la ventana se cierre para mantener el sur en el país."
 bos_srpska_reconciliation_full_tt: "La confianza serbia en el gobierno se restablece a Hostil al volver la entidad por completo a la autoridad central."
 bos_srpska_negotiated_autonomy_tt: "La confianza serbia en el gobierno pasa a Amistosa según los términos de autonomía negociados."
 BOS_croat_deescalation_hint_tt: "Crían la confianza croata a Friendly a través de las decisiones de facciones para desactivar la crisis antes de que expire."
 BOS_rotate_presidency_hint_tt: "Utilice la decisión Rotation of Leaders para entregar la presidencia y restablecer la paciencia de la comunidad de espera."
 BOS_croat_neutrality_pact_honored_tt: "El Pacto de Neutralidad Croat sostiene. Herceg-Bosna se queda fuera de la guerra y no se encamina."
 BOS_political.82.t: "República Srpska se prepara para Secede"
 BOS_political.82.d: "La asamblea de entidades ha fijado una fecha para retirarse de las instituciones estatales. Todavía hay una ventana estrecha para retirarla antes de que la independencia sea declarada franca."
 BOS_political.82.a: "Encontrar una manera de desactivarlo"
 BOS_political.83.t: "Herzegovina amenaza con romper el camino"
 BOS_political.83.d: "Los líderes croatas en el sur se están moviendo hacia la secesión, citando años de ser superado. La única manera de mantenerlos en el país."
 BOS_political.83.a: "Llegar a la comunidad croata"
 BOS_political.84.t: "La Presidencia Rotation Stalls"
 BOS_political.84.d: "El asiento se debió a cambiar de manos, pero la entrega sigue siendo apagada. La comunidad que espera su turno está empezando a ver el retraso como deliberado."
 BOS_political.84.a: "Note su frustración"
 BOS_offer_amnesty: "Oferta Amnistía"
 BOS_offer_amnesty_desc: "Conceder amnistía a los combatientes que depongan las armas. Afianza la posición de la comunidad serbia pero se lee como debilidad en el frente interno."
 BOS_forced_requisition: "Requisición forzada"
 BOS_forced_requisition_desc: "Incautar suministros y material de las entidades para mantener financiado el esfuerzo de guerra. Llena el tesoro y endurece el resentimiento serbio."
 BOS_sign_croat_neutrality_pact: "Firmar el Pacto de Neutralidad Croata"
 BOS_sign_croat_neutrality_pact_desc: "Garantizar la autonomía croata a cambio de su neutralidad. Si sigue una toma islámica, Herzegovina permanecerá en el país en lugar de escindirse."
 BOS_canton_pressure_campaign: "Campaña de presión de cantón"
 BOS_canton_pressure_campaign_desc: "Presionar a los cantones bosnio y croata para que se alineen con el programa central. Estabiliza al Estado a costa de la buena voluntad de ambas comunidades."
 BOS_serbian_alignment_overtures: "Alineación serbia Overtures"
 BOS_serbian_alignment_overtures_desc: "Profundizar los lazos políticos y económicos con Belgrado. La influencia serbia en Bosnia crece, la comunidad serbia se acerca al gobierno y la paciencia bosnia se agota."
 BOS_srpska_supremacy_measures: "Medidas de supremacía serbia"
 BOS_srpska_supremacy_measures_desc: "Promover las prioridades nacionalistas y de seguridad serbias en la política y las instituciones del gobierno."
 BOS_bosniak_governing_partner: "Socio rector bosnio"
 BOS_bosniak_governing_partner_desc: "Un socio bosnio leal mantiene la política de coalición estable y disminuye el malestar."
 BOS_croat_governing_partner: "Compañero de gobierno"
 BOS_croat_governing_partner_desc: "Un socio leal Croat apoya la reforma económica pero reduce la flexibilidad de la coalición nacional."
 BOS_srpska_governing_partner: "Socio de gobierno serbio"
 BOS_srpska_governing_partner_desc: "Un socio serbio leal mejora la cooperación en materia de seguridad, pero debilita la supervisión federal."
 BOS_reconstruction_dividends: "Dividendos de reconstrucción"
 BOS_reconstruction_dividends_desc: "Una coalición de posguerra que coopera con los programas de reconstrucción puede generar ganancias económicas a corto plazo."
 BOS_governing_partner_dividends_tt: "§GSi nuestro socio de coalición gobernante es leal:§! la reconstrucción paga dividendos por 180 días."
 BOS_internal_faction_balance_stability_tt: "§Y Confianza comunitaria:§! cada comunidad por debajo de §R25§! La confianza se aplica §R-15%§! nacional Estabilidad, cada una de las subvenciones §G50§! §G+5%§!, cada una por encima §G74§! subvenciones §G+10%§!."
 BOS_internal_faction_balance_manpower_tt: "§Y Mano de obra comunitaria:§! cada comunidad por debajo §R25§! mano de obra aplica §R-15% §! población reclutable, cada una por encima §G50§! subvenciones §G+15%§!, cada una por encima §G74§! subvenciones §G+20%§!."
 BOS_revanchism_peacekeepers_warning_tt: "§YNota:§! El personal de paz de la EUFOR debe salir del país antes de que pueda proceder el Despertar Nacional."
 BOS_national_awakening_consequences_tt: "§REsto nos compromete a la guerra con la República Srpska. Si entonces declaramos la toma de posesión islámica, el gobierno convierte las secezas islamistas y Herzegovina con parte del ejército.§!"
 BOS_islamic_takeover_consequences_tt: "§REl gobierno se convierte en islamista y Herzegovina, tomando parte del ejército con él.§!"
 BOS_eufor_withdrawal_threat: "Bosnia exige la retirada de la EUFOR"
 BOS_csto_accept_tt: "Bosnia se une a la CSTO de nuestro lado."
 BOS_csto_reject_tt: "Derribamos la solicitud de Bosnia al CSTO."
 BOS_euro_defence_accept_tt: "Extendemos una garantía de defensa a Bosnia y la misión de la EUFOR concluye."
 BOS_euro_defence_decline_tt: "Nos declinamos para subescribir la seguridad de Bosnia."
 BOS_events.56.t: "El bloque bosnio presiona por una autoridad central"
 BOS_events.56.d: "Los partidos bosnios en el Parlamento estatal están empujando a fortalecer las instituciones centrales a expensas de las entidades, y esperan que el gobierno les apoye."
 BOS_events.56.a: "Retrocede el empuje centralizador"
 BOS_events.56.b: "Mantenga la línea en las entidades"
 BOS_events.56.c: "Desarrollo de fondos en la Federación en su lugar"
 BOS_events.57.t: "Croat Bloc Demanda Garantías de Entidad"
 BOS_events.57.d: "Los líderes croatas de Herzegovina quieren garantías más firmes para la representación croata, advirtiendo que sin ellos obstaculizarán las instituciones estatales."
 BOS_events.57.a: "Alojamiento Croat bloc"
 BOS_events.57.b: "Rechazar las garantías frescas"
 BOS_events.57.c: "Invertir en Herzegovina en su lugar"
 BOS_events.58.t: "Republika Srpska exige competencias"
 BOS_events.58.d: "Banja Luka está exigiendo de nuevo que los poderes transferidos al Estado sean entregados a la entidad, enmarcandolo como cuestión del acuerdo Dayton."
 BOS_events.58.a: "Negociar una transferencia limitada"
 BOS_events.58.b: "Rechazar la demanda directamente"
 BOS_events.58.c: "Devolver poderes de ingresos a la entidad"
 BOS_events.61.t: "Una oferta china para la República Srpska"
 BOS_events.61.d: "El gobierno encabezado por la República Srpska quiere aprobar un proyecto de infraestructura financiado por China en la entidad. Beijing gana una posición, y los partidos bosnios de Sarajevo son cuidadosos con las cuerdas adjuntas."
 BOS_events.61.a: "Aprobar el proyecto"
 BOS_events.61.b: "Bloquear la financiación"
 BOS_events.62.t: "Un empuje para la autonomía fiscal"
 BOS_events.62.d: "Con un croata en el jefe del gobierno, los líderes de Herzegovina presionan para otra transferencia de poderes de ingresos, una tercera entidad en todos menos nombre."
 BOS_events.62.a: "Desarrollar los poderes"
 BOS_events.62.b: "Mantener el control fiscal central"
 BOS_events.63.t: "Ampliación del presupuesto central"
 BOS_events.63.d: "El gobierno encabezado por Bosnia quiere ampliar el presupuesto central, financiando a las instituciones estatales que las entidades han muerto de hambre desde hace mucho tiempo. Banja Luka resentirá cada marca convertible."
 BOS_events.63.a: "Ampliar el presupuesto"
 BOS_events.63.b: "Dejar el presupuesto como es"
 BOS_events.64.t: "Los autobuses siguen dejando"
 BOS_events.64.d: "La emigración se ha vuelto imposible de ignorar. Los turnos completos no se llenan y las familias jóvenes están vendiendo. Trabajos programas, subsidios de retención juvenil, el enlace comercial Corridor Vc y las remesas de la diáspora son las palancas que pueden frenar el flujo."
 BOS_events.64.a: "Debemos mantener a nuestra gente en casa."
 BOS_events.65.t: "Un país Vaciando"
 BOS_events.65.d: "El éxodo ha llegado a la crisis. Las clínicas cercanas por falta de enfermeras y aldeas están a medio vacío. Sólo un trabajo sostenido en programas de empleo, subsidios de retención de jóvenes, el enlace Corridor Vc y las remesas reducirán la presión."
 BOS_events.65.a: "Retroceda la disminución"
 BOS_entity_competency_transfer: "Competencias rotativas de la Entidad"
 BOS_entity_competency_transfer_desc: "Los poderes de recaudación de ingresos han sido entregados a la entidad, comprando calma política al costo de un gobierno central más lento y controvertido."
 BOS_corruption_hits_weakest_tt: "§RLa comunidad con la menor confianza en el gobierno pierde más terreno a medida que se rompe el escándalo.§!"
 BOS_eu_accession_push: "Europeann Accession Push"
 BOS_eu_accession_push_desc: "Con la condición de candidato formal garantizado y cada comunidad detrás de la oferta, presione el programa de adhesión hacia adelante. Los prestamistas internacionales premian el impulso y la confianza en los ascensos del gobierno de reforma."
 BOS_electoral_reform_package: "Paquete de Reforma Electoral"
 BOS_electoral_reform_package_desc: "Una vez que cada comunidad confía en el Estado, la estructura de presidencia discriminatoria puede ser finalmente reemplazada. Terminar el sistema de cupos étnicos retira la amenaza de secesión que sombría a la antigua oficina rotatoria al tiempo que mantiene sus beneficios estabilizadores."
 BOS_open_balkan_initiative: "Iniciativa Balcanes Abiertos"
 BOS_open_balkan_initiative_desc: "Únete al mercado regional dirigido por Serbia para la libre circulación de bienes, mano de obra y capital. Belgrado ejerce influencia en Sarajevo, pero los representantes serbios acogen con beneplácito los vínculos más estrechos y las pequeñas empresas prosperan."
 BOS_berlin_process_commitment: "Compromiso del Proceso de Berlín"
 BOS_berlin_process_commitment_desc: "Cooperación regional anclada en el Proceso de Berlín patrocinado por Alemania y no en la órbita de Belgrado. La vía proeuropea tranquiliza a los socios croatas y bosnios y abre la puerta a la financiación occidental."
 BOS_confront_entity_obstruction: "Confrontar la obstrucción de la Entidad"
 BOS_confront_entity_obstruction_desc: "La República Srpska ha pasado años bloqueando las instituciones estatales y amenazando la retirada. Decidir si enfrentar la obstrucción se encamina o comprar calma a través de concesiones."
 BOS_energy_transition_strategy: "Estrategia de transición energética"
 BOS_energy_transition_strategy_desc: "Más allá de la división del carbón-versus-hidro con capacidad renovable distribuida en ambas entidades. Proyectos compartidos tranquilizan a las comunidades croata y serbia y dan a los jóvenes trabajadores una razón para quedarse."
 BOS_digital_diaspora_economy: "Economía Digital de la Diáspora"
 BOS_digital_diaspora_economy_desc: "Conectar el sector tecnológico a la gran comunidad de emigrantes en el extranjero. El trabajo a distancia y el regreso del talento facilitan la presión de emigración y ganan sobre los pequeños y medianos propietarios de negocios."
 BOS_census_2023: "The 2023 Census"
 BOS_census_2023_desc: "Realizar el censo de población a largo plazo. Los resultados resolverán disputas sobre los números de cada comunidad, pero cualquier gente que el gobierno enfatiza se sentirá reconocida a expensas de un rival."
 BOS_eu_candidacy_momentum: "Momento de candidatura de la UE"
 BOS_eu_candidacy_momentum_desc: "El estatus de candidato formal ha energizado el campo de reforma y ha reafirmado la confianza pública en el gobierno."
 BOS_reformed_presidency: "Presidencia reformada"
 BOS_reformed_presidency_desc: "La presidencia étnica rotatoria ha sido sustituida por un sistema abierto a todos los ciudadanos. La gobernanza es más tranquila y legítima, y la constante amenaza de secesión de entidades ha levantado."
 BOS_open_balkan_market: "Mercado de los Balcanes Abierto"
 BOS_open_balkan_market_desc: "Los miembros del mercado regional han ampliado las oportunidades de exportación de las empresas bosnias a un costo modesto para el consumo interno."
 BOS_digital_economy_idea: "Economía digital"
 BOS_digital_economy_idea_desc: "La inversión en conectividad y software ha aumentado la producción de investigación y ayudado a las fábricas a adoptar prácticas modernas."
 BOS_events.66.t: "Obstrucción de la Entidad"
 BOS_events.66.d: "El liderazgo de la República Srpska ha bloqueado nuevamente la legislación estatal y ha flotado en retirarse de las instituciones federales. El gobierno debe responder antes de que se difunda la parálisis."
 BOS_events.66.a: "Tomar una línea dura"
 BOS_events.66.b: "Ofrecer concesiones"
 BOS_events.67.t: "The 2023 Census"
 BOS_events.67.d: "Las cifras del censo están listas para su publicación. Los líderes de cada comunidad están presionando para que sus números sean destacados en los resultados oficiales."
 BOS_events.67.a: "Destacar el recuento de los bosnios"
 BOS_events.67.b: "Enfatizar el conteo Croat"
 BOS_events.67.c: "Poner de relieve el recuento serbio"
 BOS_confront_entity_obstruction_choice_tt: "§YSe abre una opción: confrontar directamente a la República Srpska o buscar alojamiento.§!"
 BOS_hardline_rs_crisis_warning_tt: "§RSi la confianza serbia cae por debajo de los 25, mientras Milorad Dodik dirige la República Srpska, el enfrentamiento puede escalarse en una crisis de secesión.§!"
 BOS_reformed_presidency_tt: "§GSustituye a la presidencia rotativa activa con la Presidencia Reformada, poniendo fin al riesgo de secesión manteniendo sus beneficios de estabilidad.§!"
 BOS_emigration_eased_energy_tt: "§GPresión de emigración reducida en 5.§!"
 BOS_emigration_eased_digital_tt: "§GPresión de emigración reducida en 10.§!"
 BOS_digital_diaspora_synergy_tt: "§GLas remesas de Diaspora financian una nueva fábrica civil sin costo alguno para el tesoro.§!"
 RSK_requisition_the_mines: "Requisición de las minas"
 RSK_requisition_the_mines_desc: "Incautar la producción de las minas de la Entidad para el fondo de guerra. Los trabajadores no nos lo agradecerán."
 RSK_appeal_to_belgrade: "Llamamiento a Belgrado"
 RSK_appeal_to_belgrade_desc: "Pedir a Serbia que respalde abiertamente a la Entidad, para elevar la moral y mejorar las relaciones con Belgrado."
 HZG_war_levy: "Guerra de Herzegovina Levy"
 HZG_war_levy_desc: "Imponer una tasa de emergencia a los cantones para financiar la guerra. La Estabilidad sufrirá."
 HZG_appeal_to_zagreb: "Apelación a Zagreb"
 HZG_appeal_to_zagreb_desc: "Pedir a Croacia que respalde a Herzeg-Bosnia, para elevar la moral y mejorar las relaciones con Zagreb."
 BOS_events.68.t: "La Entidad llama"
 BOS_events.68.d: "La República Srpska hace un llamamiento a Serbia en favor de las armas y los voluntarios. Belgrado debe sopesar el apoyo abierto contra el riesgo de una guerra más amplia."
 BOS_events.68.a: "Enviar armas y voluntarios"
 BOS_events.68.b: "No podemos ser vistos para intervenir"
 BOS_events.69.t: "Belgrado responde"
 BOS_events.69.d: "Las cajas serbias llegan al frente. Los soldados de la Entidad toman el corazón."
 BOS_events.69.a: "Para el pueblo serbio"
 BOS_events.70.t: "Los Cantones Llaman"
 BOS_events.70.d: "Herzeg-Bosnia hace un llamamiento a Croacia para que las armas y los voluntarios mantengan la línea."
 BOS_events.70.a: "Armar los cantones"
 BOS_events.70.b: "Zagreb debe mantenerse fuera de esto"
 BOS_events.71.t: "Zagreb Respuestas"
 BOS_events.71.d: "Las armas croatas llegan a Herzeg-Bosnia. Los defensores de los cantones están acorazados."
 BOS_events.71.a: "Para los croatas"
 RSK_serbian_support_accept_tt: "§GEnviar 2000 armas de infantería a la República Srpska y abrir el apoyo voluntario.§!"
 RSK_serbian_support_decline_tt: "§REl apoyo de guerra de la República Srpska cae.§!"
 HZG_croat_support_accept_tt: "§GEnviar 1500 armas de infantería a Herzeg-Bosnia y abrir el apoyo voluntario.§!"
 HZG_croat_support_decline_tt: "§REl apoyo de guerra de Herzeg-Bosnia cae.§!"
 BOS_thermal_chinese_financing_tt: "§YBeijing se le dirá que el préstamo está firmado, y tomará su influencia en Bosnia a cambio.§!"
 BOS_events.72.t: "Señales de Sarajevo para Tuzla"
 BOS_events.72.d: "Bosnia ha firmado la línea de crédito para la expansión del lignito Tuzla: 0,10 mil millones de nuestros libros y nuestros contratistas sobre el terreno. La planta es el premio más pequeño. Lo que el préstamo realmente compra es un asiento en la mesa de Sarajevo, y un socio en los Balcanes que nos debe."
 BOS_events.72.a: "Splendid."
 BOS_court_turkish_investment_tt: "§YAnkara se le dirá que el mercado está abierto, y tomará su influencia en Bosnia a cambio.§!"
 BOS_court_gulf_investment_tt: "§YRiyadh se le dirá que los fondos son bienvenidos, y tomará su influencia en Bosnia a cambio.§!"
 BOS_events.73.t: "Sarajevo abre la puerta"
 BOS_events.73.d: "Bosnia ha aclarado el camino para nuestras empresas de construcción y nuestros bancos. Secciones de autopistas, vivienda, red sucursal en Sarajevo. Trabajar para nuestros contratistas y una posición en un país que todavía nos mira como parientes. La palabra de Ankara cargará peso en la Federación ahora."
 BOS_events.73.a: "Excelente."
 BOS_events.74.t: "Buroj Ozone encuentra sus Backers"
 BOS_events.74.d: "Sarajevo ha invitado al capital del Golfo a la propiedad, el turismo y las finanzas. La ciudad de Trnovo es el espectáculo, pero el dinero llega más lejos: apartamentos, hoteles y bancos que sostienen su papel. Cualquiera que sea la entrega de los proyectos, el liderazgo musulmán de Bosnia recordará cuyos fondos llegaron."
 BOS_events.74.a: "Splendid."
 BOS_defeat_all_serbs: "Guerra civil con la República Srpska en curso"
 BOS_croat_neutrality_pact: "El pacto de neutralidad croata firmado"
 BOS_rs_crisis_resolved: "Crisis de secesión en la República Srpska"
 BOS_third_entity_resolved: "Tercera demanda de Entidades Resolvadas"
 BOS_defence_property_registered: "Cuestión de la propiedad de defensa"
 BOS_privatization_settled: "Política de privatización"
 BOS_federation_grant_cooldown: "Subvención de desarrollo de la Federación sobre enfriamiento"
 BOS_herzegovina_grant_cooldown: "Ayuda para el desarrollo de Herzegovina sobre la refrigeración"
 BOS_srpska_grant_cooldown: "Subvención de desarrollo de la República Srpska sobre enfriamiento"
 BOS_loser: "Derrote de la guerra civil bosniaca"
