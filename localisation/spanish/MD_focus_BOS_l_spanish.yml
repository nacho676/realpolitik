 civil_war_bosnia: "Guerra civil bosnia activa."
 BOS_EUFOR: "EUFOR"
 BOS_EUFOR_desc: "La Fuerza de la Unión Europea Bosnia y Herzegovina es una misión de mantenimiento de la paz dirigida por la UE en Bosnia y Herzegovina que logró la SFOR, encaminada a mantener la paz y la estabilidad, apoyar a las autoridades locales y aplicar los Acuerdos de Dayton que terminaron la guerra de Bosnia."
 BOS_SFOR: "SFOR"
 BOS_SFOR_desc: "La Fuerza de Estabilización en Bosnia y Herzegovina es una fuerza multinacional de mantenimiento de la paz dirigida por la OTAN.\n§W---------------§!\n Tras la Guerra de Bosnia, asociados internacionales como el Banco Mundial, la Unión Europea, el Programa de Desarrollo de las Naciones Unidas y USAID financiaron la reconstrucción de Bosnia. Sus programas reconstruyeron infraestructura, reforzaron la gobernanza y los servicios públicos, y apoyaron la recuperación económica."
 BOS_attack_upon_nato: "Ataque a la OTAN"
 BOS_bosniak_balkan_aspiration: "Aspiraciones Bosniacas en los Balcanes"
 BOS_srpska_balkan_aspiration: "Aspiraciones Serbias en los Balcanes"
 BOS_croat_balkan_aspiration: "Aspiraciones Croatas en los Balcanes"
 BOS_post_yugoslav_war_state: "Estado Postguerra Yugoslava"
 BOS_post_yugoslav_war_state_desc: "Bosnia es una de las cuatro repúblicas que logró declarar la independencia durante las guerras yugoslavas del decenio de 1990. De los cuatro, experimentó los más horrores, con miles de refugiados que huían del país. Las vastas zonas de tierra están contaminadas por minas terrestres y municiones sin detonar. Muchos de sus antiguos ciudadanos viven ahora en el extranjero. Estos acontecimientos dieron a las Naciones Unidas una reputación nueva e inquebrantable como organización incapaz o no dispuesta a proteger a los que se encuentran en peligro."
