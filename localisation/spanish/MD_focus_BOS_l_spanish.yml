 bos_war_civil_war: "La Guerra Civil de Bosnia"
 event_chain_will_fire: "Una secuencia de huelgas y confrontaciones políticas probará si el trabajo organizado puede reemplazar a la coalición existente."
 news.83.t: "Bosnia regresa a la guerra civil"
 news.83.desc: "La República Srpska ha declarado su independencia y Bosnia y Herzegovina ha regresado a la guerra civil. Las organizaciones internacionales han pedido una cesación del fuego inmediata a medida que las fuerzas de las entidades se movilicen en todo el país."
 news.83.a: "La paz de Dayton ha fracasado"
 news.84.t: "Mujahideen Únete a la Guerra de Bosnia"
 news.84.desc: "Los combatientes de El Mudžahid han roto con Sarajevo y proclamado Estado islamista en Bosnia. Su intervención añade una tercera facción armada al conflicto y ha atraído la condena de gobiernos vecinos."
 news.84.a: "La guerra se ha intensificado"
 news.86.t: "La guerra civil bosniaca termina"
 news.86.desc: "La facción victoriosa ha restablecido el control sobre Bosnia y Herzegovina después de derrotar a las fuerzas de fuga restantes. El gobierno enfrenta ahora la desmovilización, la reconstrucción y otro intento de solución política."
 news.86.a: "La lucha ha terminado."
 if_a_strike_happens_this_may_lead_to_a_shift_in_government_tt: "Si ocurre una huelga, esto puede llevar a un cambio en el gobierno"
 BOS_bosniak_lead_government: "Gobierno de Bosnia y Herzegovina"
 BOS_bosniak_lead_government_desc: "Una coalición liderada por Bosnia priorizará las instituciones nacionales y abrirá la reconciliación con Occidente o un programa revanchista más confrontacional."
 BOS_House_of_Representatives_shortcut: "Cámara de Representantes"
 BOS_prepping_an_offensive_shortcut: "Preparando una ofensiva"
 BOS_post_war_effort_shortcut: "Esfuerzo postguerra"
 BOS_politicized_army_shortcut: "Ejército politizado"
 BOS_srpska_lead_government: "Gobierno de la República Srpska"
 BOS_expand_federalization: "Ampliar la federalización"
 BOS_politicized_army: "Ejército politizado"
 BOS_srpska_lead_government_desc: "Una coalición dirigida por la República Srpska defenderá las instituciones de las entidades y perseguirá a los asociados orientales, después elegirá entre el federalismo cooperativo y la supremacía política."
 BOS_expand_federalization_desc: "La autoridad de la entidad mayor protegerá a las instituciones locales manteniendo coherente la política exterior y de defensa de Bosnia."
 BOS_politicized_army_desc: "Las lealtades de las Entidades y los nombramientos políticos aún dividen a las fuerzas armadas. La integración gradual puede crear una institución nacional profesional."
 BOS_anti_government_demonstrations: "Manifestaciones contra el gobierno"
 BOS_politicized_army_idea: "Ejército politizado"
 BOS_politicized_army_idea_desc: "Las lealtades paralelas, los nombramientos políticos y las tradiciones separadas en tiempos de guerra obstaculizan el mando nacional. Las reformas exitosas pueden convertir la fuerza en una institución profesional."
 BOS_aggressive_nation: "Postura agresiva"
 BOS_aggressive_nation_desc: "La nación ha adoptado una postura militar agresiva para lograr sus objetivos de guerra."
