l_spanish:
 MDR_AUTO_PAGE: "Agencia espacial"
 MDR_AUTO_TAB_TT: "Automatizar el programa espacial: proyectos, misiones, presupuesto, empresas, personal y colonias."
 MDR_AUTO_DESC: "La agencia espacial puede manejarse sola cada semana. Elegí qué hace y con qué límites; lo demás sigue en su menú."
 MDR_AUTO_HEAD_AGENCY: "Agencia espacial"
 MDR_AUTO_HEAD_WORK: "Proyectos y misiones"
 MDR_AUTO_HEAD_MONEY: "Dinero y personal"
 MDR_AUTO_HEAD_COLONIES: "Colonias"
 MDR_AUTO_MASTER: "Modo automático"
 MDR_AUTO_MASTER_TT: "Con esto activado, la agencia se maneja sola cada semana con las opciones de esta página. Nunca gasta por debajo de la reserva."
 MDR_AUTO_CHANCE: "Éxito mínimo"
 MDR_AUTO_CHANCE_V: "[?mdr_space_auto_min_chance|0]%"
 MDR_AUTO_TARGET_V: "[?mdr_space_auto_target_pct|2]%"
 MDR_AUTO_RESERVE_V: "$$[?mdr_space_auto_reserve|0]B"
 MDR_AUTO_STEP_TT: "Clic: de a uno. §YMayús + clic§!: de a diez (de a cinco en el éxito)."
 MDR_AUTO_PRIORITY: "Prioridad"
 MDR_AUTO_PRIORITY_V: "[mdr_space_auto_priority_name]"
 MDR_AUTO_PRIORITY_TT: "Qué categoría de proyectos va primero. Clic para cambiar. Equilibrada sigue el orden de la lista."
 MDR_AUTO_PRIORITY_0: "Equilibrada"
 MDR_AUTO_STATE: "[mdr_space_auto_state]"
 MDR_AUTO_STATE_NONE: "§gTodavía no hay agencia espacial: se crea desde el menú del Programa Espacial.§!"
 MDR_AUTO_STATE_OFF: "§YModo automático apagado.§! La agencia solo hace lo que se le pide."
 MDR_AUTO_STATE_SHORT: "§RTesoro debajo de la reserva:§! no inicia nada y recorta si está marcado."
 MDR_AUTO_STATE_ON: "§GModo automático encendido.§! Cada semana revisa todo lo marcado."
 MDR_AUTO_PROJECTS: "Iniciar proyectos"
 MDR_AUTO_PROJECTS_TT: "Inicia un proyecto por semana cuando hay lugar, según la prioridad."
 MDR_AUTO_MISSIONS: "Lanzar misiones"
 MDR_AUTO_MISSIONS_TT: "Inicia misiones cuando hay lugar. Los lanzamientos solo si el éxito llega al mínimo de abajo."
 MDR_AUTO_GOALS: "Reclamar objetivos cumplidos"
 MDR_AUTO_GOALS_TT: "Reclama el prestigio de cada meta apenas se cumple."
 MDR_AUTO_HQ: "Ampliar la sede"
 MDR_AUTO_HQ_TT: "Amplía la sede cuando sobran 30 de ciencia y el dinero no toca la reserva."
 MDR_AUTO_QUIET: "Sin avisos de proyectos terminados"
 MDR_AUTO_QUIET_TT: "No muestra el evento de cada proyecto o misión terminada. Las fallas sí se avisan."
 MDR_AUTO_BUDGET: "Llevar el presupuesto a"
 MDR_AUTO_BUDGET_TT: "Mueve el presupuesto hacia esta meta, de a 0,05% por semana."
 MDR_AUTO_CUTBACK: "Recortar si el tesoro baja de"
 MDR_AUTO_CUTBACK_TT: "Con el tesoro debajo de la reserva baja el presupuesto 0,01% por semana y no inicia nada."
 MDR_AUTO_COMPANIES: "Contratar empresas"
 MDR_AUTO_COMPANIES_TT: "Contrata una empresa para cada servicio que no tenga, de a una por semana."
 MDR_AUTO_STAFF: "Contratar personal"
 MDR_AUTO_STAFF_TT: "Suma científicos e ingenieros mientras los sueldos no pasen 60% del presupuesto semanal, y astronautas hasta 12."
 MDR_AUTO_COLONIES: "Cuidar las colonias"
 MDR_AUTO_COLONIES_TT: "Abre la ruta de carga si falta algo, construye el módulo que hace falta y envía colonos con buena moral."
