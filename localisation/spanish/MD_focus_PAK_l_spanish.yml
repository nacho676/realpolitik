l_spanish:
 pakistan.1.t: "Presión americana en las áreas tribales"
 pakistan.1.d: "Los Estados Unidos exigen que el Pakistán adopte medidas militares decisivas contra grupos militantes que operan desde las zonas tribales administradas federalmente a lo largo de la frontera con el Afganistán. Washington ha dejado claro que la continua inacción tendrá consecuencias para la relación bilateral y la ayuda militar estadounidense."
 pakistan.1.a: "Lanzamiento de una operación militar en Waziristan"
 pakistan.1.b: "Negociar con los ancianos tribales en su lugar"
 pakistan.1.c: "Rechazar las demandas estadounidenses"
 pakistan.2.t: "Pakistán lanza una operación tribal"
 pakistan.2.d: "El Pakistán ha lanzado una operación militar contra las fortalezas militantes en las zonas tribales, respondiendo a la presión estadounidense. La operación se dirige a elementos talibanes y al-Qaeda en la frontera afgana."
 pakistan.2.a: "Un desarrollo positivo"
 pakistan.3.t: "Pakistán se niega a actuar"
 pakistan.3.d: "El Pakistán ha rechazado tomar medidas militares decisivas en las zonas tribales a pesar de las demandas estadounidenses. Los militantes siguen operando libremente a lo largo de la frontera con el Afganistán, socavando los esfuerzos de coalición en el Afganistán."
 pakistan.3.a: "Cortar la ayuda militar a Pakistán"
 pakistan.3.b: "Aceptar su decisión por ahora"
 pakistan.4.t: "Retaliación Militante"
 pakistan.4.d: "La operación militar en las zonas tribales ha provocado una feroz represalia. Grupos militantes han lanzado una ola de bombardeos en las principales ciudades, dirigidos a edificios gubernamentales, mercados e instalaciones militares. Los talibanes paquistaníes han declarado la guerra contra el Estado."
 pakistan.4.a: "Intensificar la represión"
 pakistan.4.b: "Busca un alto el fuego con los militantes"
 pakistan.5.t: "La ayuda americana suspendida"
 pakistan.5.d: "Estados Unidos ha suspendido la ayuda militar a Pakistán en respuesta a la negativa del gobierno de actuar contra militantes en las zonas tribales. La pérdida de fondos americanos va a ceder el presupuesto de defensa."
 pakistan.5.a: "Esto es una indignación."
 pakistan.6.t: "Avances en las zonas tribales"
 pakistan.6.d: "Después de meses de operaciones militares sostenidas, las fuerzas armadas de Pakistán han progresado significativamente en las zonas tribales. Se han desmantelado importantes fortalezas militantes, aunque el costo humano y económico ha sido severo. La pregunta ahora es si declarar la victoria o mantener una presencia militar permanente."
 pakistan.6.a: "Declara victoria y consolida"
 pakistan.6.b: "Mantener la presencia militar"
 PAK_waziristan_insurgency: "Insurgencia Waziristan"
 PAK_waziristan_insurgency_desc: "Las fuerzas armadas pakistaníes participan en una importante campaña de contrainsurgencia en las zonas tribales, que lucha contra grupos militantes a lo largo de la frontera con el Afganistán."
 PAK_suspended_american_aid: "American Aid suspendida"
 PAK_suspended_american_aid_desc: "Estados Unidos ha suspendido la ayuda militar a Pakistán, desplegando el presupuesto de defensa y limitando las adquisiciones de armas."
 PAK_tribal_pacification: "Zonas tribales Pacificación"
 PAK_tribal_pacification_desc: "La exitosa campaña militar en las zonas tribales ha fortalecido las capacidades de contrainsurgencia del ejército y ha restablecido un cierto grado de estabilidad a la región fronteriza."
 pakistan_news.1.t: "Pakistán lanza Operación Militar en Zonas Tribales"
 pakistan_news.1.d: "Las fuerzas armadas pakistaníes han lanzado una importante operación militar contra los talibanes y las fortalezas de Al-Qaida en las zonas tribales administradas federalmente a lo largo de la frontera con el Afganistán. La ofensiva, llevada a cabo bajo intensa presión americana, apunta a redes militantes que han utilizado el terreno accidentado como un refugio seguro."
 pakistan_news.1.a: "Los arrancaremos."
 pakistan_news.1.b: "Un paso en la dirección correcta"
 pakistan_news.1.c: "Noted"
 pakistan_news.2.t: "Pakistán declara victoria en zonas tribales"
 pakistan_news.2.d: "Tras una prolongada campaña militar, el Pakistán ha declarado que se han desmantelado importantes fortalezas militantes en las zonas tribales. La operación ha sido costosa tanto en vidas como en recursos, pero el gobierno dice que la región fronteriza es más segura de lo que ha estado en años."
 pakistan_news.2.a: "Una victoria dura."
 pakistan_news.2.b: "Acogemos con beneplácito este progreso"
 pakistan_news.2.c: "Noted"