l_spanish:
 mdr_mnc_category: "Empresas multinacionales"
 mdr_mnc_category_desc: "Empresas extranjeras que operan en nuestro país. Pagan regalías e impuestos y traen tecnología; la sede se lleva el resto de la ganancia. Se pueden nacionalizar o invitar a nuevas. Se congelan con guerra, embargo o sanciones, y a los seis meses se van."
 mdr_mnc_toggle_invites: "Mostrar u ocultar empresas para invitar"
 mdr_mnc_toggle_invites_desc: "Muestra la lista de empresas extranjeras que podrían abrir operaciones aquí, o la oculta."
 mdr_mnc_nat_cooldown_tt: "No nacionalizamos ninguna empresa en los últimos 180 días"
 mdr_mnc_expropriation_risk: "Riesgo de expropiación"
 mdr_mnc_expropriation_risk_desc: "Nacionalizamos una empresa extranjera. Los inversores piden más para venir y la economía pierde algo de impulso."
 mdr_mnc_expropriated: "Nacionalizó una de nuestras empresas"
 mdr_mnc_host: "Empresas multinacionales"
 mdr_mnc_host_desc: "Las empresas extranjeras que operan aquí traen tecnología y gestión."
