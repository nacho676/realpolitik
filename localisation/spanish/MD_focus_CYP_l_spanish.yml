l_spanish:
 CYP_division_of_the_island: "La Isla Dividida"
 CYP_division_of_the_island_desc: "La Línea Verde corta Chipre en dos. Chipre septentrional sigue bajo ocupación turca y la autoridad de la República termina en una zona de amortiguación vigilada por las Naciones Unidas. La división no resuelta drena la voluntad política y mantiene a una parte de la población y el territorio fuera del alcance."
 CYP_eu_membership: "Estado Miembro de la UE"
 CYP_eu_membership_desc: "Chipre se unió a la Unión Europea en 2004, obteniendo acceso al mercado único, fondos estructurales y un marco de apoyo político de los socios de Nicosia en Bruselas. La membresía forma la trayectoria económica y la postura diplomática de la isla."
 CYP_offshore_gas: "Campos de gas East Med"
 CYP_offshore_gas_desc: "Los bloques de exploración en aguas de Zona Económica Exclusiva han confirmado reservas comerciales viables de gas. Los ingresos por extracción y las ofertas de licencias traen una nueva corriente de ingresos y complican las relaciones con Turquía, que impugna partes de la zona."
 CYP_financial_center: "Centro financiero regional"
 CYP_financial_center_desc: "Chipre ha desarrollado una reputación como jurisdicción de bajo nivel para la tenencia de empresas, registros marítimos y corrientes internacionales de capital. El sector aporta ingresos sustanciales de servicios, pero atrae el escrutinio sobre la transparencia."
 CYP_tourism_economy: "Turismo-Economía virgen"
 CYP_tourism_economy_desc: "Sol, costa y antigüedad atraen a millones de visitantes cada año. El turismo es una piedra angular del PIB chipriota, que apoya la hospitalidad y el comercio minorista al mismo tiempo que suaviza algunas de las presiones de importación de una economía pesada en el consumo."
 CYP_foreign_investment_wave: "Propulsión de inversión extranjera"
 CYP_foreign_investment_wave_desc: "Un programa activo de incentivos fiscales, visados de inversionista y garantías bilaterales ha abierto una breve ventana de inversión extranjera directa elevada. El nuevo capital está fluyendo en servicios, bienes raíces y manufacturas ligeras."
 CYP_develop_offshore_gas: "Desarrollar yacimientos de gas marinos"
 CYP_develop_offshore_gas_desc: "Encargar estudios y adjudicar contratos de licencia para poner en producción los bloques de gas del Mediterráneo oriental. La inversión es sustancial, pero un desarrollo exitoso dará una fuente de ingresos a largo plazo y reforzará las reclamaciones chipriotas sobre su Zona Económica Exclusiva."
 CYP_eu_accession_push: "Iniciativa de profundización de la UE"
 CYP_eu_accession_push_desc: "Chipre se dirige a Bruselas y a los Estados miembros clave sobre la plena participación en los procesos de integración de la UE, desde la candidatura a Schengen hasta la consolidación de la Eurozona. El cabildeo sostenido genera buena voluntad griega y europea hacia la posición de Nicosia en la disputa de la isla."
 CYP_bicommunal_talks: "Conferencias bicomunales"
 CYP_bicommunal_talks_desc: "Invitar a representantes de Chipre del Norte a un diálogo estructurado bajo los auspicios de la ONU. El progreso rara vez es espectacular, pero el contacto sostenido mantiene abierta una vía de arreglo y señala a Grecia y Europa que Nicosia actúa de buena fe."
 CYP_court_foreign_investment: "Tribunal de Inversión Extranjera"
 CYP_court_foreign_investment_desc: "Ofrecer incentivos selectivos a empresas extranjeras que consideran a Chipre como base de operaciones. El paquete inicial cuesta fondos del tesoro, pero una captación exitosa de capital eleva los ingresos del sector servicios y amplía la base fiscal durante un tiempo limitado."
 CYP_mobilize_greek_cypriots: "Reunir a la comunidad grecochipriota"
 CYP_mobilize_greek_cypriots_desc: "Dirigir recursos estatales a las asociaciones cívicas, la Iglesia y la diáspora para reforzar el apoyo a la visión de la República sobre la isla. Una comunidad grecochipriota segura de sí y organizada refuerza la mano de Nicosia en la disputa por el futuro de Chipre."
 CYP_outreach_to_north: "Tender la mano a través de la Línea Verde"
 CYP_outreach_to_north_desc: "Financiar proyectos intercomunitarios, aperturas comerciales y contactos discretos con moderados del norte. Cada turcochipriota ganado para un arreglo compartido y encabezado por Nicosia resta argumentos a la partición permanente."
 NCY_mobilize_turkish_cypriots: "Reunir a la comunidad turcochipriota"
 NCY_mobilize_turkish_cypriots_desc: "Movilizar las instituciones del Norte y el respaldo de Ankara para consolidar a la comunidad turcochipriota tras la existencia de un Estado separado. Un Norte unido es más difícil de absorber en cualquier arreglo encabezado por Grecia."
 NCY_settler_program: "Programa de asentamientos anatólicos"
 NCY_settler_program_desc: "Continuar la política de larga data de reasentar a familias de la Anatolia continental en el norte. El cambio demográfico afianza el peso turcochipriota en la isla, aunque ahonda el agravio en el sur y atrae críticas internacionales."
