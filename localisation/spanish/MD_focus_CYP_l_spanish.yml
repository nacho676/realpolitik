 cyprus.1.t: "Confirmado: Las reservas de Med Este son visibles"
 cyprus.1.d: "Los resultados de la encuesta están dentro. La perforación en los bloques Afrodita y adyacente ha confirmado reservas lo suficientemente grandes como para apoyar la extracción comercial. Nicosia se mueve rápidamente para finalizar los contratos de licencias. Turquía ha presentado sus objeciones a través de canales diplomáticos, pero la base jurídica para nuestra Zona Económica Exclusiva es sólida."
 cyprus.1.a: "Comiencen el desarrollo."
 cyprus.2.t: "Charlas bicomunales: Una elección del enfoque"
 cyprus.2.d: "Las delegaciones grecochipriotas y turcochipriotas se han reunido en Nicosia bajo la facilitación de las Naciones Unidas. La atmósfera es cautelosa. Ambas partes tienen quejas pendientes y tampoco tiene prisa en ofrecer concesiones. La forma en que avanzamos aquí dará forma al próximo ciclo de negociaciones."
 cyprus.2.a: "Participar de manera constructiva y formular propuestas concretas sobre la mesa."
 cyprus.2.b: "Mantenga firme en posiciones básicas y rehúse a moverse primero."
 cyprus.3.t: "Chipre: Un asiento más profundo en la tabla europea"
 cyprus.3.d: "Funcionarios chipriotas han regresado de Bruselas con una posición institucional más fuerte que antes. Los socios de la UE han reconocido la adhesión constante de Nicosia al acervo y su participación activa en las estructuras europeas. La isla está de pie en Bruselas es más alta que en cualquier momento desde la adhesión."
 cyprus.3.a: "Usaremos este impulso."
 cyprus.4.t: "Línea verde: incidentes en la zona de amortiguación"
 cyprus.4.d: "Un enfrentamiento en uno de los puestos de control de la zona de amortiguación se ha convertido en un incidente diplomático menor. La fuerza de mantenimiento de la paz de las Naciones Unidas ha restablecido el orden, pero ambas partes están negociando acusaciones. El evento ha reiniciado el debate en Nicosia sobre cómo manejar las provocaciones del Norte."
 cyprus.4.a: "Emitir una condena pública formal."
 cyprus.4.b: "Levántalo a través de la ONU y manténgalo fuera de la prensa."
