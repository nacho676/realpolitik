 PRODUCTION_PRICE_10_TT: "Precio unitario, y el §Rtotal§! de todo el lote.\n\nLa producción §Yno se paga por adelantado§!. El total se cobra §Ysemana a semana durante el tiempo de construcción§!, actualmente unos §Y$[?var_space_week_10|C2]b por semana§!.\n\nAgregar líneas paralelas acorta la construcción pero aumenta tanto el total como el cobro semanal."
 PRODUCTION_PRICE_11_TT: "Precio unitario, y el §Rtotal§! de todo el lote.\n\nLa producción §Yno se paga por adelantado§!. El total se cobra §Ysemana a semana durante el tiempo de construcción§!, actualmente unos §Y$[?var_space_week_11|C2]b por semana§!.\n\nAgregar líneas paralelas acorta la construcción pero aumenta tanto el total como el cobro semanal."
 PRODUCTION_PRICE_12_TT: "Precio unitario, y el §Rtotal§! de todo el lote.\n\nLa producción §Yno se paga por adelantado§!. El total se cobra §Ysemana a semana durante el tiempo de construcción§!, actualmente unos §Y$[?var_space_week_12|C2]b por semana§!.\n\nAgregar líneas paralelas acorta la construcción pero aumenta tanto el total como el cobro semanal."
 PRODUCTION_PRICE_13_TT: "Precio unitario, y el §Rtotal§! de todo el lote.\n\nLa producción §Yno se paga por adelantado§!. El total se cobra §Ysemana a semana durante el tiempo de construcción§!, actualmente unos §Y$[?var_space_week_13|C2]b por semana§!.\n\nAgregar líneas paralelas acorta la construcción pero aumenta tanto el total como el cobro semanal."
 PRODUCTION_PRICE_14_TT: "Precio unitario, y el §Rtotal§! de todo el lote.\n\nLa producción §Yno se paga por adelantado§!. El total se cobra §Ysemana a semana durante el tiempo de construcción§!, actualmente unos §Y$[?var_space_week_14|C2]b por semana§!.\n\nAgregar líneas paralelas acorta la construcción pero aumenta tanto el total como el cobro semanal."
 SPACE_AUTO_TITLE: "§YProgram Automation§!"
 SPACE_AUTO_TITLE_TT: "Maneja tu programa espacial sin microgestión: cada semana pide los satélites y vehículos de lanzamiento que exige el plan elegido y los lanza cuando las existencias alcanzan para completar una rotación.\n\nSiempre construye la §Ygeneración más nueva que hayas investigado§!, nunca una más antigua, y se detiene sola cuando una constelación llega a su capacidad máxima.\n\n§YLas cifras de este panel se recalculan una vez al mes§! y de nuevo cada vez que reabres esta pestaña; así que si un dato parece desactualizado tras terminar una tecnología, cambia de pestaña y vuelve para actualizarlo.\n\n§RLos KILLSAT no se automatizan§!: son armas orbitales y no una constelación de cobertura, así que no hay una capacidad objetivo que cubrir."
 SPACE_AUTO_STATUS: "[space_auto_status_loc]"
 SPACE_AUTO_STATUS_TT: "§YInactivo§! - la automatización está apagada.\n§YActivo§! - pide y lanza; la cifra es el cobro semanal actual.\n§YEn espera§! - la producción aún no ha entregado lo suficiente para un vuelo completo.\n§YA capacidad máxima§! - todas las constelaciones del plan están llenas; inactivo hasta que investigues una generación nueva.\n§YDetenido§! - ninguna carga útil del plan cabe en el vehículo de lanzamiento.\n§YPausado§! - el tesoro no puede cubrir el siguiente lote; reduce la rotación o activa el gasto deficitario.\n§YParado§! - el tesoro está vacío y el gasto deficitario está desactivado.\n\nEste estado se recalcula una vez al mes y cada vez que reabres esta pestaña."
 SPACE_AUTO_TOGGLE_TT: "[!space_auto_toggle_button_click_enabled]Activa o desactiva la automatización."
 SPACE_AUTO_TOGGLE_TT_DELAYED: "Apagar la automatización solo detiene los pedidos nuevos. Los lotes que ya están en producción terminan y siguen facturándose hasta que se entregan, así que no se pierde nada de lo que ya pagaste.\n\nAl volver a encenderla se reanuda desde donde estén tus constelaciones."
 SPACE_AUTO_PRESET: "§gPlan:§! [space_auto_preset_name_loc]"
 SPACE_AUTO_PRESET_DESC: "[space_auto_preset_desc_loc]"
 SPACE_AUTO_PRESET_TT: "Qué satélites construye la automatización. No hace falta ningún diseño manual: cada plan elige por sí solo la generación más nueva que hayas investigado.\n\n§YAutomático§! reconstruye primero tu red más desactualizada y pasa a la siguiente cuando esa se llena.\n§YEnfocado§! compromete todas las casillas con una sola familia.\n§YEmparejado§! y §YEquilibrado§! dividen el manifiesto y ceden casillas a la familia más atrasada a medida que las demás se llenan.\n§YPersonalizado§! lanza el manifiesto que preparaste arriba y guardaste."
 SPACE_AUTO_PRESET_NEXT_TT: "Next plan"
 SPACE_AUTO_PRESET_PREV_TT: "Previous plan"
 space_auto_preset_0: "§YAutomatic§!"
 space_auto_preset_1: "§YGNSS Focus§!"
 space_auto_preset_2: "§YCOMSAT Focus§!"
 space_auto_preset_3: "§YSPYSAT Focus§!"
 space_auto_preset_4: "§YGNSS + COMSAT§!"
 space_auto_preset_5: "§YGNSS + SPYSAT§!"
 space_auto_preset_6: "§YCOMSAT + SPYSAT§!"
 space_auto_preset_7: "§YBalanced§!"
 space_auto_preset_8: "§YCustom§!"
 space_auto_preset_0_desc: "Reconstruye la red que esté más desactualizada y luego pasa a la siguiente. No hay nada por construir en este momento."
 space_auto_preset_0_desc_gnss: "Se reconstruye primero la red más antigua: actualmente §GGNSS§!. Pasa a la siguiente por sí sola cuando llega a su capacidad."
 space_auto_preset_0_desc_com: "Se reconstruye primero la red más antigua: actualmente §GCOMSAT§!. Pasa a la siguiente por sí sola cuando llega a su capacidad."
 space_auto_preset_0_desc_spy: "Se reconstruye primero la red más antigua: actualmente §GSPYSAT§!. Pasa a la siguiente por sí sola cuando llega a su capacidad."
 space_auto_preset_1_desc: "Las cuatro casillas con GNSS. Velocidad del ejército, precisión de ataques aéreos y navales, velocidad de construcción y producción de recursos."
 space_auto_preset_2_desc: "Las cuatro casillas con COMSAT. Poder de mando, organización del ejército, velocidad de planificación, poder político y operaciones de inteligencia."
 space_auto_preset_3_desc: "Las cuatro casillas con SPYSAT. Límite de planificación, reconocimiento, observación, eficiencia de convoyes, velocidad de investigación y cobertura de inteligencia."
 space_auto_preset_4_desc: "Dos GNSS y dos COMSAT por vuelo. Puntería y construcción junto con mando y control."
 space_auto_preset_5_desc: "Dos GNSS y dos SPYSAT por vuelo. Puntería y construcción junto con reconocimiento e investigación."
 space_auto_preset_6_desc: "Dos COMSAT y dos SPYSAT por vuelo. Mando y control junto con reconocimiento e inteligencia."
 space_auto_preset_7_desc: "Dos GNSS más un COMSAT y un SPYSAT. El GNSS pesa el doble, por ser el más barato y ligero de lanzar."
 space_auto_preset_8_desc: "Lanza el manifiesto que preparaste en la pantalla de lanzamiento y guardaste. Las cargas útiles se siguen mejorando cada semana a la generación más nueva."
 SPACE_AUTO_ROTATION: "§gRotation:§! [?var_space_auto_flights|C0]"
 SPACE_AUTO_ROTATION_TT: "Vuelos lanzados por rotación. Cada vuelo lleva un vehículo de lanzamiento y el manifiesto completo de cargas útiles.\n\nUna rotación solo vuela cuando las existencias tienen un juego completo para cada vuelo, así que el número real puede ser menor mientras la producción se pone al día.\n\nEste es tu control de gasto. Una rotación de este tamaño cuesta unos §Y$[?var_space_auto_est_cost|C1]b§!, repartidos semanalmente durante su tiempo de construcción.\n\n§YLos cambios se aplican de inmediato§!: no hace falta apagar y encender la automatización. Nada de lo que ya está en producción se vuelve a cotizar; el nuevo tamaño solo se cobra cuando se pida el siguiente lote."
 SPACE_AUTO_ROTATION_PLUS_TT: "Un vuelo más por rotación (máximo 10)"
 SPACE_AUTO_ROTATION_MINUS_TT: "Un vuelo menos por rotación (mínimo 1)"
 SPACE_AUTO_BUDGET: "§gWeekly:§! $[?space_prod_expense|C1]b"
 SPACE_AUTO_FUNDS: "[space_auto_funds_loc]"
 SPACE_AUTO_FUNDS_TT: "Lo que le queda a la automatización por comprometer: tu tesoro, menos lo que todavía deben los lotes en marcha.\n\nUn lote solo se inicia cuando esto cubre su precio completo. No es una cifra semanal: el cobro semanal se muestra a la izquierda."
 SPACE_AUTO_BUDGET_TT: "Lo que cobran cada semana tus producciones en curso, y los fondos con los que cuenta la automatización.\n\nUn lote solo se inicia cuando tu §Ytesoro cubre su precio completo§!. Una vez iniciado, se paga semana a semana durante su tiempo de construcción en lugar de descontarse de una vez; esto también vale para los pedidos que hagas a mano.\n\nUna rotación completa con el tamaño actual cuesta unos §Y$[?var_space_auto_est_cost|C1]b§!. Cambiar la rotación nunca afecta lo que ya se está construyendo: los lotes conservan el tamaño y el cobro con que se pidieron, y la nueva cifra solo se factura cuando se haga el siguiente lote.\n\nCon el §Ygasto deficitario§! activado, la comprobación del tesoro se omite por completo y los pedidos siguen a crédito."
 SPACE_AUTO_SAVE_BUTTON: "Save Custom"
 SPACE_AUTO_SAVE_BUTTON_TT: "[!space_auto_save_button_click_enabled]Guarda el manifiesto de cargas útiles preparado arriba como el plan §YPersonalizado§! y cambia a él."
 SPACE_AUTO_SAVE_TT_trigger_2: "Hay al menos una §YCarga útil§! cargada arriba"
 SPACE_AUTO_SAVE_BUTTON_TT_DELAYED: "Solo se guardan las casillas de carga útil. El vehículo de lanzamiento es siempre el más nuevo que hayas investigado, así que nunca hace falta seleccionarlo."
 SPACE_AUTO_UPGRADE_BUTTON: "Upgrade Now"
 SPACE_AUTO_UPGRADE_BUTTON_TT: "[!space_auto_upgrade_button_click_enabled]Asciende cada constelación a la generación más nueva que hayas investigado, siempre que los satélites que ya están en órbita lo permitan sin perder cobertura."
 SPACE_AUTO_UPGRADE_BUTTON_TT_DELAYED: "Nada asciende una constelación por sí solo: solo se degrada; sin esto, tus satélites más nuevos quedan en órbita sin aportar nada.\n\nLa automatización lo hace después de cada lanzamiento; el botón es para cuando has estado lanzando a mano."
 SPACE_AUTO_MANIFEST: "[space_auto_manifest_loc]"
 SPACE_AUTO_MANIFEST_TT: "El vehículo de lanzamiento y las cargas útiles que lleva un solo vuelo en esta rotación.\n\nLa automatización lanza §Yel cohete más antiguo de tu hangar que todavía pueda levantar una carga útil§!, de modo que se gastan primero las etapas antiguas sobrantes. La producción nueva siempre es de la generación más reciente, así que las existencias viejas se agotan solas.\n\nLas casillas cuya constelación ya está completa se ceden a una familia que todavía necesita satélites, y el manifiesto se recorta a lo que ese cohete pueda levantar; por eso la cantidad puede ser menor que tus cuatro casillas y por eso un cohete más antiguo lleva menos satélites por vuelo."
 SPACE_AUTO_BUILDING: "[space_auto_building_loc]"
 SPACE_AUTO_BUILDING_TT: "Lo que hay actualmente en las líneas de producción. Son lotes de producción normales: también aparecen en la pestaña §YProducción§! de esta ventana con su tiempo restante y cuentan para el límite de un lote por tipo.\n\nLos vehículos de lanzamiento tardan mucho más en construirse que los satélites, así que la primera rotación después de encender la automatización puede estar a casi un año de distancia."
 SPACE_AUTO_DEFICIT: "Deficit spending"
 SPACE_AUTO_DEFICIT_TT: "Permite pedidos sin importar el saldo del tesoro, y cubre el costo con deuda.\n\nApagado, un lote solo se inicia si tu tesoro cubre su precio completo, así que el programa nunca puede gastar dinero que no tienes. La automatización quedará inactiva antes que excederse.\n\n§RUn colapso por bancarrota inminente siempre la detiene, sin importar nada§!: esa protección no se puede apagar."
 SPACE_AUTO_DEFICIT_TT_DELAYED: "Este es el interruptor que permite que un programa espacial supere a la economía que lo paga."
 SPACE_AUTO_STOCKPILE: "Build ahead"
 SPACE_AUTO_STOCKPILE_TT: "Construye todo el programa por adelantado en lugar de una rotación cada vez.\n\nLos vehículos de lanzamiento tardan de 240 a 440 días frente a los 80 a 260 de un satélite, así que pedir solo lo que necesita la próxima rotación deja la plataforma parada esperando cohetes. Con esta opción activada, la automatización ordena todos los lanzamientos que necesitará el programa y toda la constelación restante en un solo lote.\n\nCuesta mucho más por semana, pero alcanza la capacidad mucho antes y sigue lanzando sin pausas."
 SPACE_AUTO_STOCKPILE_TT_DELAYED: "Combina bien con el §Ygasto deficitario§!: las existencias son lo que compra tu presupuesto, y el interruptor de déficit es lo que le quita el techo."
 SPACE_AUTO_LATEST_OLV: "Latest OLV only"
 SPACE_AUTO_LATEST_OLV_TT: "Lanzar solo el vehículo de lanzamiento más nuevo que hayas investigado.\n\nApagado, la automatización lanza §Yel cohete más antiguo en existencia que todavía pueda levantar el manifiesto§! y mantiene encargada la generación más nueva, de modo que las etapas sobrantes de una generación anterior se gastan en vez de quedarse en el hangar. Un cohete más antiguo levanta menos, así que esos vuelos llevan un manifiesto más pequeño.\n\nEncendido, las etapas antiguas se ignoran por completo. Cada vuelo lleva el manifiesto completo, pero el programa espera cohetes nuevos en lugar de lanzar los que ya tiene."
 SPACE_AUTO_LATEST_OLV_TT_DELAYED: "Actívalo cuando tus etapas sobrantes sean demasiado pequeñas para justificar una plataforma de lanzamiento, y desactívalo cuando prefieras vaciar el hangar antes que esperar.\n\n§RLas cargas útiles SPYSAT pesan exactamente lo que el cohete correspondiente puede levantar§!. En un plan de satélites espía, una etapa más antigua nunca puede llevar la generación más nueva, así que este interruptor no cambia nada ahí."
 SPACE_AUTO_NET_GNSS: "[space_auto_net_gnss_loc]"
 SPACE_AUTO_NET_GNSS_TT: "§YSatélites de navegación§! - velocidad del ejército, apoyo aéreo cercano y precisión de ataque naval, bombardeo estratégico, posicionamiento y probabilidad de impacto naval; además de velocidad de construcción y extracción de recursos en el ámbito civil.\n\nLa familia más barata y ligera de poner en órbita."
 SPACE_AUTO_NET_COM: "[space_auto_net_com_loc]"
 SPACE_AUTO_NET_COM_TT: "§YSatélites de comunicaciones§! - poder de mando, organización del ejército, velocidad de planificación, escolta e intercepción aéreas, coordinación naval; además de poder político, cifrado, ganancia de la red de inteligencia y resultados de las operaciones.\n\nLa eficacia también depende de la tecnología de tus receptores terrestres."
 SPACE_AUTO_NET_SPY: "[space_auto_net_spy_loc]"
 SPACE_AUTO_NET_SPY_TT: "§YSatélites de reconocimiento§! - límite de planificación, reconocimiento, reducción de la penalización por clima, observación y eficiencia de convoyes; además de velocidad de investigación, cobertura de inteligencia en todas las ramas y supresión de la resistencia.\n\nLos repuestos más allá de tus constelaciones pueden asignarse a misiones de espionaje."
