 MD_AUTO_REJECT_SATELLITE_LABEL_TT: "§YRechazar automáticamente las ofertas de satélites de la IA§!\n\nCuando está activado, las naciones de la IA dejan de enviarnos propuestas de acceso compartido a sus satélites militares y civiles GNSS, de comunicaciones y espía."
