 satellites.2.t: "Sistema de GNSS Militares"
 satellites.2.d: "Hemos perdido demasiados de nuestros satélites GNSS militares, por lo que debemos degradar nuestro sistema GNSS militar. A un nivel inferior será menos eficiente, pero volverá a funcionar."
 satellites.2.a: "De acuerdo"
 satellites.3.t: "Sistema de GNSS civiles"
 satellites.3.d: "Hemos perdido demasiados de nuestros satélites GNSS civiles, por lo que debemos degradar nuestro sistema GNSS civil. A un nivel inferior será menos eficiente, pero volverá a funcionar."
 satellites.3.a: "De acuerdo"
 satellites.4.t: "El sistema de comunicaciones satelitales militares se ha degradado"
 satellites.4.d: "Hemos perdido demasiados de nuestros satélites de comunicación militar, por lo que debemos degradar nuestro sistema de comunicación por satélite militar. A un nivel inferior será menos eficiente, pero volverá a funcionar."
 satellites.4.a: "De acuerdo"
 satellites.5.t: "Se degrada el sistema de comunicaciones satelitales civiles"
 satellites.5.d: "Hemos perdido demasiados de nuestros satélites de comunicación civiles, por lo que debemos degradar nuestro sistema de comunicación por satélite civil. A un nivel inferior será menos eficiente, pero volverá a funcionar."
 satellites.5.a: "De acuerdo"
 satellites.6.t: "El sistema de satélites de reconocimiento militar se ha degradado"
 satellites.6.d: "Hemos perdido demasiados de nuestros satélites espías militares, por lo que debemos degradar nuestro sistema de satélites de reconocimiento militar. A un nivel inferior será menos eficiente, pero volverá a funcionar."
 satellites.6.a: "De acuerdo"
 satellites.7.t: "El sistema de satélites de reconocimiento civil se ha degradado"
 satellites.7.d: "Hemos perdido demasiados de nuestros satélites espías civiles, por lo que debemos degradar nuestro sistema de satélites de reconocimiento civil. A un nivel inferior será menos eficiente, pero volverá a funcionar."
 satellites.7.a: "De acuerdo"
 satellites.8.t: "Límite de Satélites Alcanzado"
 satellites.8.d: "Tenemos demasiados satélites en órbita y no podemos lanzar más en este momento. El límite es de 3.000 satélites activos. Desorbitando deliberadamente uno de nuestros satélites libera una ranura."
 satellites.8.a: "De acuerdo"
