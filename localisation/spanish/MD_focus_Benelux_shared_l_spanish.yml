l_spanish:
 BNL_dynmod_union: "Sindicato Benelux"
 BNL_benelux_union_treaty: "Tratado de la Unión Benelux"
 BNL_benelux_union_treaty_desc: "Firmada en La Haya en 2008, el nuevo tratado sustituye al acuerdo de expiración de 1958 y renombra nuestra cooperación la Unión Benelux. Lleva adelante el mercado común y amplía nuestro trabajo conjunto en justicia, seguridad y desarrollo sostenible, dando a los tres estados un único marco moderno para construirse."
 BNL_single_market: "Benelux Mercado interno"
 BNL_single_market_desc: "El Benelux va más allá del mercado europeo más amplio, eliminando las barreras administrativas que aún dividen las tres economías. Larga un laboratorio para la integración europea, el sindicato pilota las normas comunes y el reconocimiento mutuo que permiten a las empresas comerciar y operar como si las fronteras no estuvieran allí."
 BNL_capital_integration: "Integración del mercado de capital"
 BNL_capital_integration_desc: "El intercambio de Amsterdam, los bancos de Bruselas y la vasta industria de fondos de inversión de Luxemburgo ya forman una de las piscinas más profundas del capital europeo. La armonización de la supervisión financiera y las normas transfronterizas permite que el capital fluya libremente a las empresas más productivas en todo el sindicato."
 BNL_port_cooperation: "Rotterdam y Amberes"
 BNL_port_cooperation_desc: "Rotterdam y Amberes son los dos puertos más grandes de Europa. Coordinar el clúster Antwerp-Rotterdam-Amsterdam en lugar de competir por la misma carga convierte la logística Benelux en una sola puerta de entrada de clase mundial."
 BNL_freight_corridors: "Corredores de peso"
 BNL_freight_corridors_desc: "Los enlaces ferroviarios dedicados como el Betuweroute y el Iron Rhine conectan los puertos marítimos al interior europeo. La inversión conjunta en estos corredores fortalece la columna vertebral industrial del sindicato."
 BNL_north_sea_wind: "El viento del mar norte"
 BNL_north_sea_wind_desc: "Bajo los Mares del Norte Cooperación energética el Benelux desarrolla conjuntamente viento offshore. Las conexiones de la red de estanqueidad convierten al Mar del Norte en una fuente de energía renovable compartida."
 BNL_gas_hub: "Centro de gas Benelux"
 BNL_gas_hub_desc: "El campo Groningen y la terminal de GNL en Zeebrugge hacen del Benelux un centro comercial de gas. Coordinando el suministro a través del Foro de Energía Pentalateral asegura la energía del sindicato."
 BNL_research_cooperation: "Región de la tecnología más alta"
 BNL_research_cooperation_desc: "Eindhoven y Leuven, llegando hacia Aachen, forman la Región Tecnológica Superior, una de las concentraciones más densas de investigación de alta tecnología en Europa. Al unir laboratorios, financiación y talento a través de este triángulo transfronterizo, el Benelux puede superinnovar rivales muchas veces su tamaño."
 BNL_university_network: "Red universitaria"
 BNL_university_network_desc: "Delft, Leuven, Eindhoven y Wageningen anclan una densa red académica. Vincular sus programas y grados crea un conjunto compartido de talentos y conocimientos."
 BNL_hightech_triangle: "High-Tech Triangle"
 BNL_hightech_triangle_desc: "Brainport Eindhoven, hogar de ASML y NXP, e imec en Leuven forman el corazón de la investigación semiconductora europea. El respaldo conjunto de este grupo mantiene al Benelux en la frontera de alta tecnología."
 BNL_space_cooperation: "Cooperación espacial"
 BNL_space_cooperation_desc: "El corazón técnico de la Agencia Espacial Europea, ESTEC, se encuentra en Noordwijk. La coordinación de las contribuciones del Benelux a los esfuerzos espaciales europeos genera una capacidad avanzada de ingeniería."
 BNL_nuclear_research: "Investigación nuclear"
 BNL_nuclear_research_desc: "Petten en Holanda y el SCK CEN en Mol en Bélgica, con su proyecto de reactores MYRRHA, lideran la investigación europea en reactores e isótopos médicos. Un programa conjunto promueve la ciencia nuclear del sindicato."
 BNL_innovation_area: "Área de innovación Benelux"
 BNL_innovation_area_desc: "Vincular la red de investigación, el clúster de alta tecnología y los programas nucleares y espaciales en una sola esfera de innovación hace del Benelux una de las regiones más intensas de investigación sobre la tierra."
 BNL_benelux_parliament: "Parlamento Benelux"
 BNL_benelux_parliament_desc: "Un tratado de 2015 sustituye al antiguo Consejo Consultivo de 1955 por la Asamblea Interparlamentaria Benelux, dando al sindicato un foro parlamentario extraído de las tres legislaturas nacionales. Fortalecerla pone las bases para una integración política más profunda entre los tres estados."
 BNL_benelux_court: "Tribunal de Justicia Benelux"
 BNL_benelux_court_desc: "Un protocolo de 2012 moderniza la Corte de Justicia de Benelux, ampliando su competencia desde el mercado común a nuevos campos como la propiedad intelectual. El tribunal común armoniza la ley en las tres jurisdicciones y da al sindicato un orden jurídico común."
 BNL_shared_foreign_policy: "Política exterior común"
 BNL_shared_foreign_policy_desc: "Siguiendo una tradición tan antigua como la propia unión, los tres gobiernos concertan sus posiciones ante cada Consejo Europeo y cumbre de la OTAN. Hablando con una sola voz, el Benelux lleva peso en Bruselas mucho más allá del tamaño de sus miembros."
 BNL_political_union: "Unión Política"
 BNL_political_union_desc: "Con un parlamento compartido, un tribunal común y una sola política exterior ahora en vigor, los tres gobiernos van más allá de la mera cooperación, obligando a sus instituciones políticas a un sindicato en todos menos nombre."
 BNL_treaty_of_union: "Tratado de la Unión"
 BNL_treaty_of_union_desc: "Aquí culminan decenios de instituciones comunes. Con los tres pueblos profundamente integrados, el gobierno líder pone la cuestión de un solo estado Benelux a sus socios. Sólo con su consentimiento puede separar la soberanía dar paso a una nación."
 BNL_treaty_of_union_tt: "Abre el camino a un estado de Benelux unificado"
 BNL_integration_requirement_tt: "$BNL_integration$ is above §G100§!"
 BNL_integration: "§Y Integración Benelux§!"
 BNL_integration_tt: "£GFX_benelux_icon $BNL_integration$: $RIGHT|+=1$"
 BNL_integration_tooltip: "£GFX_benelux_icon $BNL_integration$: §G[?BNL_integration]§!"
 BNL_benelux_defence: "Declaración de Defensa de Benelux"
 BNL_benelux_defence_desc: "La Declaración de Benelux de 2012 comprometió a Bélgica, los Países Bajos y Luxemburgo a aunar sus esfuerzos de defensa, compartir costos y aumentar la producción militar conjunta. Es el marco en que las tres fuerzas armadas profundizan su cooperación."
 BNL_mio_sharing_tt: "§Y[BEL.GetNameWithFlag]§!, §Y[HOL.GetNameWithFlag]§! y §Y[LUX.GetNameWithFlag]§! compartir todos §YOrganizaciones Militares-Industriales.§!"
 BNL_benelux_air_policing: "Policía aérea de Benelux"
 BNL_benelux_air_policing_desc: "Desde 2017 Bélgica y Holanda se turnan para proteger el espacio aéreo de los tres países bajo una sola alerta rápida de reacción, con derecho a interceptar las fronteras entre sí."
 BNL_air_defence_command: "Central de mando y control aéreo"
 BNL_air_defence_command_desc: "Un centro de mando y control aéreo compartido integra el panorama por radar y las defensas aéreas terrestres de las tres naciones en un sistema coordinado."
 BNL_binational_air_command: "Comando Aéreo Binacional"
 BNL_binational_air_command_desc: "Merging the operational air commands let the Benelux air forces plan y volar sus misiones como una sola organización, compartir bases, controladores y procedimientos"
 BNL_mrtt_fleet: "Flota MRTT multinacional"
 BNL_mrtt_fleet_desc: "La flota mancomunada de Airbus A330 Multi Role Tanker Transports, con sede en Eindhoven y compartida entre los socios Benelux y otros estados europeos, proporciona aire-a-aire refugio y transporte aéreo estratégico a cada miembro."
 BNL_eatc: "Europeann Air Transport Command"
 BNL_eatc_desc: "Con sede en Eindhoven, el Comando Europeo de Transporte Aéreo agrupa el transporte militar, el refugio y los aviones aeromédicos de sus miembros bajo un mando."
 BNL_belux_a400m: "BELUX A400M Unit"
 BNL_belux_a400m_desc: "Bélgica y Luxemburgo agrupan sus transportes A400M Atlas en una sola unidad binacional de Melsbroek, compartiendo tripulación, mantenimiento y un centro común de capacitación. El avión solitario de Luxemburgo vuela en colores belgas, las dos naciones dividiendo los costos y horas de vuelo de una flota."
 BNL_f35_cooperation: "Joint F-35 Sustainment"
 BNL_f35_cooperation_desc: "Bélgica y los Países Bajos coordinan la capacitación y el mantenimiento de sus flotas F-35, compartiendo instalaciones y conocimientos especializados en las dos fuerzas aéreas."
 BNL_benesam: "Acuerdo naval de BENESAM"
 BNL_benesam_desc: "Bélgica y los Países Bajos dirigen sus dos marinas como una, compartiendo capacitación, logística y mantenimiento mientras cada uno mantiene el mando de sus propios despliegues. Profundizar este acuerdo de larga data hace que la flota combinada sea mucho mayor que la suma de sus partes."
 BNL_admiral_benelux: "Admiral Benelux"
 BNL_admiral_benelux_desc: "Un único personal naval binacional de Den Helder dirige las operaciones de las flotas belga y holandesa, con los dos comandantes de la marina que comparten el cuartel general conjunto."
 BNL_vlissingen_class: "Vlissingen-class Mine-hunters"
 BNL_vlissingen_class_desc: "El programa conjunto Belga-Dutch Replacement Mine Counter Measures, un esfuerzo de doce naves para retirar a los cazadores tripartitas de clase Alkmaar envejecidos. Construido por Naval Group, estas naves madre independientes cazan minas desde una distancia segura con drones autónomos superficiales y submarinos. Los Países Bajos tienen seis embarcaciones como la clase Vlissingen, junto con los propios barcos de Bélgica del mismo diseño."
 BNL_hollandklasse_frigate: "Desarrollo de la fragata clase Holland"
 BNL_hollandklasse_frigate_desc: "Los Países Bajos establecen nuevas fragatas Hollandklasse para renovar su patrulla marítima y la flota antisubmarina. Con sensores modernos, sistemas de misiles y casco poco visible, protegen las aguas holandesas y apoyan operaciones en el extranjero."
 BNL_aswf_frigate: "Guerra antisubmarina Frigate"
 BNL_aswf_frigate_desc: "Bélgica y los Países Bajos reemplazan conjuntamente sus fragatas de clase M con un nuevo diseño antisubmarino de guerra, compartiendo sistemas de desarrollo, radar y combate."
 BNL_para_school: "Escuela de Paracaidistas Benelux"
 BNL_para_school_desc: "Las escuelas paracaidistas de Benelux se consolidan en un único centro de formación en Schaffen, que califica a las tropas aéreas de las tres naciones a una norma común."
 BNL_csomtg: "Grupo de Trabajo mixto sobre operaciones especiales"
 BNL_csomtg_desc: "Bélgica y los Países Bajos conforman un grupo de tareas marítimas de operaciones especiales combinado, listo para desplegar juntos en tierra y mar para misiones rápidas de la OTAN."
 benelux.1.t: "A Tratado de Benelux de la Unión"
 benelux.1.d: "[FROM.GetName] propone que dejemos a un lado nuestra soberanía separada y nos unamos a un solo estado Benelux. Décadas de instituciones compartidas han preparado el terreno, pero la entrega de la nacionalidad no es un pequeño paso."
 benelux.1.a: "Nos uniremos al sindicato"
 benelux.1.b: "Seguimos siendo nuestra propia nación."
 benelux.2.t: "Nuestro socio acepta la Unión"
 benelux.2.d: "[FROM.GetName] ha acordado unirse a un Benelux unificado. Con nuestro socio ahora vinculado a nosotros, podemos completar la formación de la unión."
 benelux.2.a: "Una nueva nación nace"
 benelux.3.t: "Nuestro socio declina a la Unión"
 benelux.3.d: "[FROM.GetName] todavía no está dispuesto a renunciar a su independencia. El sindicato tendrá que esperar, o ser construido sobre terreno más firme."
 benelux.3.a: "Seremos pacientes."
 benelux.4.t: "A Tratado de Benelux de la Unión"
 benelux.4.d: "[FROM.GetName] propone que dejemos a un lado nuestra soberanía separada y nos unamos a un solo estado Benelux. Ya anclamos la cooperación de Benelux, nuestra economía y fuerzas armadas enjaulando las propias de nuestros socios, y efectivamente lideran el sindicato en todo menos nombre. Una fusión formal cambiaría esa primacía de facto, y nuestra única retención sobre un estado que ya dominamos, para instituciones compartidas no podemos dirigir unilateralmente."
 benelux.4.a: "Nos uniremos al sindicato"
 benelux.4.b: "Seguimos siendo nuestra propia nación."
 benelux.5.t: "A Tratado de Benelux de la Unión"
 benelux.5.d: "[FROM.GetName] propone que dejemos a un lado nuestra soberanía separada y nos unamos a un solo estado Benelux. Hasta el punto más pequeño de los tres, nos arriesgamos a ser tragados política y culturalmente por nuestros dos vecinos mucho mayores, nuestro Gran Ducado se redujo a una nota de pie de página en un sindicato que no podemos esperar dirigir."
 benelux.5.a: "Nos uniremos al sindicato"
 benelux.5.b: "Seguimos siendo nuestra propia nación."
 BNL_retry_treaty_of_union_BEL: "Renovar la propuesta de unión a Bélgica"
 BNL_retry_treaty_of_union_BEL_desc: "Bélgica rechazó la última propuesta de un Estado unificado del Benelux. Un enfoque revisado, respaldado por argumentos nuevos y presión diplomática renovada, aún podría convencer a Bruselas."
 BNL_retry_treaty_of_union_HOL: "Renovar la propuesta de unión a los Países Bajos"
 BNL_retry_treaty_of_union_HOL_desc: "Los Países Bajos rechazaron la última propuesta para un estado de Benelux unificado. Un enfoque revisado, respaldado por argumentos frescos y una presión diplomática renovada, todavía puede traer a La Haya."
 BNL_retry_treaty_of_union_LUX: "Renovar la propuesta de unión a Luxemburgo"
 BNL_retry_treaty_of_union_LUX_desc: "Luxemburgo rechazó la última propuesta de un Estado unificado del Benelux. Un enfoque revisado, respaldado por argumentos nuevos y presión diplomática renovada, aún podría convencer al Gran Ducado."
 BNL_retry_shared_outlook_tt: "Es más probable que acepten si compartimos la misma forma de gobierno."
 BNL_retry_influence_tt: "Es más probable que acepten si tenemos una influencia significativa sobre ellos."
 BNL_retry_opinion_tt: "Es más probable que acepten si su opinión sobre nosotros es superior a §G200§!."