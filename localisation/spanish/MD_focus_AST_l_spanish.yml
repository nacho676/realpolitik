 hung_parliament_ast: "Parlamento colgado"
 hung_parliament_ast_desc: "Por primera vez desde 1940, Australia está experimentando un parlamento colgado. Ninguna de las partes tiene suficiente mar para formar gobierno, y hasta que podamos negociar el apoyo necesario para llevar a nuestros 72 escaños a 76, estamos efectivamente en un sistema legislativo."
 hung_parliament_ast_2: "Coalición rocosa"
 hung_parliament_ast_2_desc: "Podemos haber formado un gobierno, pero la coalición que existe es menos que ideal. En stock con miembros infelices del partido y comodines independientes, cualquier fracaso de la política podría desencadenar un final temprano para nuestro gobierno en su infancia."
 diplomacy_tightrope_ast: "Diplomático"
 diplomacy_tightrope_ast_desc: "Naveguemos un complejo acto de equilibrio, manteniendo una profunda alianza de seguridad y defensa con los Estados Unidos, mientras perseguimos la interdependencia comercial estabilizada con China. Evitar ser forzado a elegir entre los dos es cómo hemos logrado mantenernos a flote."
 non_permanent_unsc_member: "Miembro no permanente del Consejo de Seguridad"
 non_permanent_unsc_member_desc: "El Consejo de Seguridad de las Naciones Unidas elige a 10 miembros no permanentes para que se unan a la Asamblea General cada dos años. Estas naciones pueden presentar resoluciones apreciadas por la votación"
 gloves_off_diplomacy_ast: "Guantes de diplomacia"
 consuls_of_peace_idea_ast: "Cónsuls of Peace"
 the_australian_century_tt: "§YAvanzó varias propuestas para nuevas minas que se encuentran actualmente en espera de aprobación.§!"
 kevin_rudd_desc: "Experto geopolítico asiático y regular de TV, Kevin Rudd se ha encontrado la nueva cara del movimiento Laboral. Un personaje capaz de hacer malabarismo con la estabilidad de Howard, con la promesa de la reforma que demanda la nación, Rudd ha mostrado un obstáculo para equilibrar los intereses del partido mientras permanece en las buenas gracias del público. \n\nGracias a las reformas de Gough Whitlam, Rudd pudo asistir a la universidad y utilizar su educación para unirse al Departamento de Asuntos Exteriores en 1981. Experimenta que ha usado durante toda su carrera. Desde entonces se ha disparado en el partido, y como miembro durante la época de la puerta giratoria del Trabajo, Rudd no es extraño para cortar la política. Sin embargo, su optimismo lo ha empujado a construir la fiesta de nuevo. \n\nIntento ampliar su atractivo y corregir el faccionalismo que lo ha mantenido estancado durante décadas, el hombre de Queensland ahora tiene el timón. Una posición que ha idolatrado desde que se une al partido a los 15 años, y una que tiene la intención de hacer justicia."
