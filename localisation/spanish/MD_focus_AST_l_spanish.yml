 julia_gilard_desc: "Como activista y socio legal nacido en Gales, Gillard se ha convertido en la primera mujer líder del país. \n \nInicialmente un Socialista de Facción Izquierda en la ALP de Victoria, Gillard vino a prominencia utilizando sus conexiones con el sector empresarial. Una habilidad ganada de años como abogado industrial. Conducir en un campo tradicionalmente dominado por hombres, y desafiar las probabilidades a pesar de permanecer solteros y sin ninguna creencia religiosa, Gillard ha roto oficialmente el status quo del Parlamento. \n\nSea cual sea la dirección que vaya, el partido sigue con un malestar tentativo, ya que se aleja de la certeza tradicional. Cualquier error podría romper la nueva estabilidad del partido, enviar a Gillard antes de que su liderazgo haya comenzado."
