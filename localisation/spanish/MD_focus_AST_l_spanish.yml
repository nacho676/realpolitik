 fruits_of_the_summit: "Fruits of the Summit"
 toughen_up_on_boat_arrivals_ast: "Toughen Up on Boat Arrivals"
 toughen_up_on_boat_arrivals_ast_desc: "Un problema constante en los titulares es que los solicitantes de asilo llegan en barco. No hay una solución fácil tratando de arreglarlo, pero si no nos enfrentamos a ellos la oposición lo hará, y entonces sólo será un palo que puedan usar contra nosotros."
 strengthen_police_funding_ast: "Fortalecimiento de la financiación policial"
 strengthen_police_funding_ast_desc: "Para ayudar con el aumento de la violencia en las pandillas y grupos extremistas podemos repasar a nuestros departamentos con fondos para asegurar un mejor equipo y capacitar a más personal."
 stack_the_branches_ast: "Ataque las ramas"
 stack_the_branches_ast_desc: "Algunas de nuestras personas más influyentes de derechas han recibido solicitudes para que una serie de prominentes miembros del partido se conviertan en nuestro gobierno, quienes son de la facción Derecha Laboral. Esto podría atraer apoyo dentro de la fiesta a riesgo de aparecer un pequeño cronyist."
 pause_on_tariffs_ast: "Pausa sobre los aranceles"
 pause_on_tariffs_ast_desc: "Cuando nuestro comercio está aprovechando nuestra mejor opción es «quebrar la cuerda» sobre aranceles para bienes o servicios esenciales, a costa de algunos ingresos a corto plazo."
