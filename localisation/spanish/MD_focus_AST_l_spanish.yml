 ast_introduce_temporary_levies_desc: "Si nuestro déficit está saliendo de la mano podemos introducir gravámenes de emergencia en las empresas y los ingresos altos, aumentando temporalmente las tasas tributarias para obtener algunos ingresos adicionales."
