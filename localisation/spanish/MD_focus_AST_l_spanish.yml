 australia_abbottgov_focus: "El Gobierno de Abbott"
 tony_abbott_desc: "La carrera de Tony ha sido una actuación de bailar alrededor de la crítica, y lloverla sobre sus oponentes. Como líder opositor despiadadamente capaz, Tony ha dirigido al partido hacia una postura más fuerte, con un penchant para popularizar sus eslóganes de tres palabras. \n\nNacido en Londres, criado en Sydney como católico romano y educado como jesuita, la primera prioridad de Tony en la escuela era convertirse en sacerdote. Un profundo deseo de servicio y liderazgo espiritual lo llevó a eventualmente regresar al Reino Unido como estudiante de Oxford, aprendiendo tanto como pudiera antes de su servicio. Aunque, a pesar de la adoración, sus inclinaciones por la política nunca lo dejarían. \n\nSu organización regular de rallyes y manifestaciones lo oponen a la dirección estudiantil de izquierda de Oxford, incluso en enfrentamientos violentos. A su regreso a Australia, Tony seguiría sus intenciones originales y se sumaría al sacerdocio en 1984 a los 26 años. Después de tres años en el servicio, él llegaría a admitir ser «un peg cuadrado tratando de entrar en un agujero redondo», y que el sacerdocio no era simplemente destinado para él. \n\nYa que su devoción no era suficiente para superar su amor por la emoción de la política, Tony se unió al Boletín como periodista, dando lugar a un eventual papel como Secretario de Prensa del Partido Liberal. El experimentado y divisivo intérprete del partido ahora ha ascendido al asiento más alto de la Nación."
 executive_management_ast: "Gestión Ejecutiva"
 the_turnbull_government_desc: "No hay contenido para este árbol ahora mismo. Un árbol de enfoque Turnbull se desarrollará en el futuro, pero por ahora este foco es un marcador de lugar."
 collapsing_state_sol: "Estado que colapsa"
 collapsing_state_sol_desc: "La ley y el orden han colapsado efectivamente en la nación, con grandes swathes controlados por bandas rugientes de policías corruptos y militantes armados. Lo que queda es una pequeña economía en estado de caída libre, y el propio gobierno está atrapado dentro del parlamento. Sin finanzas ni autoridad para controlar la situación en espiral."
 collapsing_state_sol_1: "Estado frágil"
 collapsing_state_sol_1_desc: "La mayoría de los militantes han sido desarmados y permanecen bajo la custodia del Estado. No obstante, se ha restablecido la ley a algunas ciudades, la situación sigue siendo un delicado equilibrio."
 collapsed_state_sol: "Estado colapsado"
 collapsed_state_sol_desc: "Mientras muchos de los habitantes siguen huyendo de las islas, los militantes restantes continúan recogiendo la carcasa de una nación muerta. Las últimas luces de la democracia se han desvanecido, y hay poca esperanza de un futuro para aquellos que tratan de sobrevivir."
