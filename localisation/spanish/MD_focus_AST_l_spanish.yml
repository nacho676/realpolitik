 auslink_in_nt: "AusLink en el Territorio del Norte"
 auslink_in_nt_desc: "El marco de AusLink ha permitido la rápida reparación y actualización de nuestras carreteras regionales en el pasado. Podemos reutilizar ese sistema para mejorar rápidamente las líneas logísticas en nuestras comunidades septentrionales, construir puentes, rutas de carga pesada e infraestructura agrícola."
 national_partnership_agreement_ast: "Acuerdo de Asociación Nacional"
 national_partnership_agreement_ast_desc: "Trabajando en estrecha colaboración con las comunidades indígenas de NT y Australia Occidental, podemos abordar el hacinamiento severo mediante la construcción de cientos de nuevos hogares para acoger a los locales. Los contratos también nos ayudarán con los grupos de interés para la vivienda, y proporcionarán trabajo a contratistas locales."
 foundation_for_regional_renewal_ast: "Subvenciones de renovación rural"
 foundation_for_regional_renewal_ast_desc: "Podemos establecer una asociación conjunta entre el gobierno federal y el Fondo Sydney Myer para crear un vehículo de financiación agrícola local. Las subvenciones se destinarán a pequeñas empresas y consejos municipales para financiar salas comunitarias, sistemas rurales de agua y proyectos agrícolas."
 grain_line_upgrades_ast: "Actualizaciones de la línea de grano"
 grain_line_upgrades_ast_desc: "Los planos han venido desde el NSW y los gobiernos victorianos para importantes mejoras estructurales a las líneas de granos de la región. Casi todos los agricultores regionales utilizan las líneas para transportar cosechas a puertos, y mejorar las líneas podría mejorar enormemente su producción y reducir la dependencia del transporte de vehículos. A su vez, bajando el desgaste y desgarrando las carreteras."
 grain_lines_upgraded_ast: "Actualización de la línea de grava regional"
 mining_indutrialists_opinion_tt: "Opinión mínima §YLa industria del combustible alimentario§! §R-20§!"
 peter_costello_desc: "Tal vez pocos en la historia de la política australiana son tan versados en la gestión económica como Peter Costello., rebotando entre el trabajo y la asesoría legal antes de aterrizar en el Partido Liberal, Costello abogaría por una reorganización radical de la economía. EventoSe une a la facción reformista económica del partido, donde se encontraría con el ex líder de oposición John Howard. \n\nDespués de las elecciones de 1996, y como subjefe y tesorero en el gobierno de Howard, Costello superó su rápida reforma. Como resultado, por primera vez en más de una década, el presupuesto estaba en superávit, y juntos habían aprobado con éxito la reforma «imposible» anterior del sistema tributario. \n\nIncluso cuando la relación entre los dos comenzó a amar, Costello nunca se apartó lejos de las palancas del poder. Ahora, mientras él maneja la mayor palanca en la nación, sus sueños de dominación económica apenas están a un paso de la realidad."
 western_mining_corp_research_ast: "West Mining Corp Research"
 ast_an_open_ear_tt: "La situación §Rclimate§! en nuestra nación puede §Rworsen.§!"
 literacy_progress_the_gap_ast: "Cierre del progreso de la cosecha"
 literacy_progress_the_gap_ast_1: "Continuando la Gap"
 closing_the_gap_event.2.t: "Cierre los resultados de la Gap"
 closing_the_gap_event.2.d: "Con nuestra campaña de alfabetización y apoyo social que se dio unos años para seguir, los resultados han vuelto lamentablemente mezclados. Si bien se está inscribiendo a más niños y se están encarcelando menos adultos en general, las tasas de cuidado fuera del hogar y la delincuencia juvenil aumentan constantemente. Como resultado, parece que nuestro esfuerzo por llevar a los australianos desfavorecidos hacia la corriente principal se considera parcialmente un fracaso. \n\nPodemos invertir más en el programa para continuar el trabajo y tal vez refinarlo, o podríamos reducir nuestras pérdidas ahora y sacar el plug."
 closing_the_gap_event.2.a: "Continúe el trabajo."
 closing_the_gap_event.2.b: "Apágalo."
 closing_the_gap_event.3.d: "Con nuestra campaña de alfabetización y apoyo social que se dio unos años para seguir, los resultados han vuelto positivos. Se están inscribiendo más niños, se está encarcelando a menos adultos en general, las tasas de permanencia fuera del hogar y la delincuencia juvenil están disminuyendo constantemente. Parece que nuestro esfuerzo por llevar a los australianos desfavorecidos hacia la corriente principal está realmente pagando."
 closing_the_gap_event.3.a: "Otro éxito."
