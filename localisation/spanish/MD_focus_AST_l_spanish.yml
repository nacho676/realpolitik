 ast_closing_the_gap_tt: "Tomará tiempo antes de empezar a ver los §Gresultos§! de estos programas..."
 nrf_ast: "Fundación Nacional para la Reconciliación"
 nrf_ast_desc: "Si vamos a asegurar que el marco para la reconciliación proactiva existe después de nuestro mandato, necesitamos crear un órgano de organización dedicado a financiar proyectos que hagan una diferencia."
 sihip_ast: "Estratégico Programa de Vivienda e Infraestructura Indígena (SIHIP)"
 sihip_ast_desc: "Los miembros aborígenes del Territorio del Norte han sufrido posiblemente más que nadie en los últimos años. La vivienda, entre muchas otras cosas, se ha deteriorado y necesita con urgencia reformas."
 family_reunion_services_ast: "Familia Reunion Services"
 family_reunion_services_ast_desc: "Podemos comenzar a desarrollar un programa para proporcionar servicios de localización, reunión y asesoramiento familiar a las personas aborígenes e isleñas del Estrecho de Torres que fueron desalojadas por la fuerza de sus familias durante las generaciones robadas."
 rural_job_initiative_ast: "Iniciativa de empleo rural"
 rural_job_initiative_ast_desc: "Trabajar con algunos de nuestros mayores benefactores como Andrew Forrest para crear proyectos públicos y privados, contratar locales para la mayoría del trabajo, estimulará la oportunidad para algunas de nuestras comunidades que sufren sequías laborales."
