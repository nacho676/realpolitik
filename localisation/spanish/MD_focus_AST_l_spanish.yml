 AST_the_lucky_country: "El País Suerte"
 AST_the_lucky_country_desc: "Después de que Donald Horne acuñó el dicho en 1964, la mayoría de los australianos han malinterpretado la frase como describir el éxito afortunado del país en la minería. Aunque es cierto que hemos sido dotados de una masa terrestre muy grande, muy llena de minerales raros y valiosos, Donald usó el dicho para burlar a los líderes del tiempo por invertir demasiado en esa vía, y descuidando nuevas oportunidades económicas. En resumen: no estábamos diversificando lo suficiente. Esto nos ha dejado en una situación donde Australia es sólo unas pocas plantas tecnológicas o de fabricación que nos mantienen alejados de ser un estado de alquiler completamente soplado. Estamos totalmente en base a nuestras exportaciones, y o lo aceptamos o comenzamos el proceso de inmersión."
 AST_fuel_the_mining_boom: "Fuel el Boom de Minería"
 AST_fuel_the_mining_boom_desc: "La minería ha sido la base de la economía australiana literalmente desde que se convirtió en una colonia. Desde la prisa de oro hasta el día actual, la minería ha mantenido nuestra economía rebosante y en expansión. Todo lo cual consume una cantidad incalculable de gasolina manteniendo el mineral cargado y enviado fuera. Si las circunstancias en el Oriente Medio empeoran, podríamos ver cómo nuestra economía se detiene. Antes de que amplíemos más necesitamos asegurar nuestras reservas estratégicas en casa, y mantener el suministro listo para un día lluvioso."
 AST_acis_scheme: "Plan ACIS"
 AST_acis_scheme_desc: "Se creó el Plan de Competitividad e Inversión Automotriz para proporcionar a nuestras industrias automotrices ayuda y financiación para impulsar la inversión, la investigación y el desarrollo. Nuestra industria ha faltado cuando se compara con los gustos de los que nos rodean, así que un impulso a nuestras empresas cultivadas en casa no va a ir desafortunado."
 AST_a_sea_of_panels: "A Sea of Panels"
 AST_a_sea_of_panels_desc: "Nuestras plantas de paneles solares rurales son una vista para contemplar. Como una obra de arte circular, remojando los rayos que normalmente están dando a turistas quemaduras de sol. Nuestra mezcla actual de combustibles renovables y fósiles es un punto corto de saludable, y una expansión de nuestros actuales arsenales solares equilibrará eso."
 AST_commit_to_renewables: "Compromiso a los renovables"
 AST_commit_to_renewables_desc: "El futuro de nuestra producción energética no debe ser dictado por nuestro suministro de carbón o gas. Nuestro desarrollo de tecnologías de energía renovable ha progresado sorprendentemente rápidamente en los últimos años. Es hora de que nos aprovechemos."
 AST_harness_the_wind: "Harness el viento"
 AST_harness_the_wind_desc: "En la mitología griega Aeolus fue el dios confiado por Zeus para controlar los vientos, sólo liberando las terribles tormentas cuando se lo ordenó. Aunque no podemos controlar los vientos, gracias a nuestros científicos, podemos aprovechar su poder. Instalar más turbinas donde más se beneficien nos dará una buena fuente de energía limpia y sizable."
 AST_rewire_the_nation: "Rewire la Nación"
 AST_rewire_the_nation_desc: "Hay pocos problemas que hemos encontrado en esta nación que se pueden arreglar tirando un montón de dinero sobre ella. Este es uno de ellos. Los ingenieros ya han tenido sus comités y planificación, y ahora estamos listos para lanzar una actualización a las redes eléctricas en toda la nación, modernizándolas para nuestras necesidades de capacidad actuales."
 AST_fix_the_potholes: "Arregla los agujeros de patas"
 AST_fix_the_potholes_desc: "La prohibición de conducir en este país siempre ha sido las lagunas. Pregunte a cualquier conductor, urbano o rural, cuentan cuentos de reparaciones de coches, cerca de accidentes y otras historias de horror. A medida que el deber de proteger a nuestros ciudadanos cae bajo el gobierno, es nuestra responsabilidad librar esta plaga."
 AST_north_west_shelf_expansion: "Norte de la plataforma oeste expansión"
 AST_north_west_shelf_expansion_desc: "La plataforma noroeste ha sido una de nuestras plantas de gas más largas y exitosas en la península, procesando un trozo masivo de todos nuestros extractos de petróleo y gas. La propuesta actual sugiere ampliar la vida operacional del proyecto hasta 2070, proporcionándonos un procesamiento muy necesario hasta entonces."
 AST_its_just_coal: "¡Es sólo carbón!"
 AST_its_just_coal_desc: "Hay oponentes de nuestra expansión que podrían temer combustibles fósiles. A ellos les decimos: no tengas miedo, no tengas miedo, no te hará daño. Es carbón. Para mí ya que los australianos están casi en nuestra sangre. Amamos este mineral oscuro y polvoriento y alimenta nuestros hogares. Las renovables pueden ser lo nuevo, pero el carbón siempre estará allí para nosotros, quemando."
 AST_high_speed_focus_ast: "Rail de alta velocidad"
 AST_high_speed_focus_ast_desc: "La maldición del carril de alta velocidad ha plagado nuestros estados desde los años 80. Cada vez que un gobierno federal comienza el proceso de construir ferrocarril por encima de 200 km/h, el proyecto nunca pasa de la etapa de planificación. Esta vez no. Estamos entrando ahora, y lo estamos viendo. Tenemos la tecnología y la ruta: Brisbane a Sydney a Melbourne. Nada está de pie en nuestro camino."
 AST_dig_deep: "Profundidad"
 AST_dig_deep_desc: "El refinamiento de Alumina ha hecho varios avances recientes en nuestros centros mineros remotos. Si ponemos presión directamente sobre agilizar el proceso de aprobación de los derechos mineros, entonces pueden llegar a trabajar perforando más rápido y más profundo."
 AST_lng_megaprojects: "Megaproyectos de GNL"
 AST_lng_megaprojects_desc: "Nuestras instalaciones de GNL son uno de nuestros métodos de arte más avanzados para transportar gas natural a otras naciones, y nos ha ahorrado enormemente en costos de envío. El proceso de enfriamiento del gas a temperaturas muy bajas por lo que se convierte en un líquido, y disminuye el volumen de gas en un 600%. Trabajar con las empresas para ampliar estas instalaciones, y de alguna manera, asumir los costes de construcción, les levantará e irán más pronto."
 AST_the_boom_never_ends: "El Boom nunca termina"
 AST_the_boom_never_ends_desc: "A veces tienes suerte, y a veces solo eres Australia. Las cosas están en auge aquí en el sector minero, y nos gustaría mantener ese boom. Inversiones, estímulos, todo el lote. Nuestras compañías van a seguir perforando con nuestra aprobación y todo lo que tenemos que hacer es sentarse y disfrutar de ella."
 AST_treat_the_farmers: "Tratar a los agricultores"
 AST_treat_the_farmers_desc: "Los granjeros de esta nación resultan ser algunos de los más difíciles trabajando alrededor. Al final del día sus manos están cubiertas de suciedad para que la nuestra pueda tener un anillo de diamante en ellos. O lo he oído. De todos modos, necesitamos recompensarlos por su trabajo. Un regalo, si quieres."
 AST_enjoy_the_prosperity: "Disfruta de la prosperidad"
 AST_enjoy_the_prosperity_desc: "Cuando aparcas a los expertos todos están de acuerdo en que nuestro sector minero no va a ninguna parte. En este momento las exportaciones están alimentando a esta nación como nunca hemos experimentado antes, y las recompensas son nuestras para disfrutar. Podemos invertir sustancialmente en la infraestructura para apoyar futuros esfuerzos mineros y producción de combustible mientras el hierro está caliente. Asegurarnos de sacar el máximo provecho del boom."
 AST_heavy_industry_projects: "Proyectos industriales pesados"
 AST_heavy_industry_projects_desc: "Nuestras empresas de construcción estatales han estado trabajando duro para construir este maravilloso país, pero la demanda de mayor capacidad es bastante evidente. La ejecución de los planes para una expansión será costosa, pero directo hacia adelante. El mundo verá a Australia que estamos destinados a ser."
 AST_urban_expansion_initiative: "Iniciativa de Ampliación Urbana"
 AST_urban_expansion_initiative_desc: "No podemos construir sin tierra, y esta propuesta ha sido redactada para permitirnos eludir muchos de los requisitos habituales para la adquisición de tierras que algunas de las variedades protestantes están llamando «aprendizaje», lo cual no es. La tierra será pagada, por supuesto, el proceso simplemente será más rápido."
 AST_defy_the_mantra: "Defy el Mantra"
 AST_defy_the_mantra_desc: "No permaneceremos contemplados a un apodo. Australia evolucionará o morirá. Cuando las minas secan o el próximo desastre económico venga nuestra economía permanecerá porque invertimos en su futuro. Al expandirnos a una serie de vías económicas podemos diversificar nuestra producción nacional. No seremos un estado más arrendatario, sino una nación robusta."
 AST_global_weapons_manufacturing: "Fabricación mundial de armas"
 AST_global_weapons_manufacturing_desc: "Australia nunca ha sido conocida como proveedor mundial de armas, aparte de los compromisos del cuadro. Si la diversificación es necesaria, aumentar nuestra producción y potencialmente abastecer a otras naciones en el proceso, podría hacer que la inversión valga la pena."
 AST_overseas_opportunities: "Oportunidades en el extranjero"
 AST_overseas_opportunities_desc: "Muchas de nuestras mayores compañías de combustibles fósiles ya operan fuertemente en el extranjero donde se presenta la oportunidad. Operaciones que se pueden alentar si suavizamos los códigos actuales y plantamos algunos incentivos aquí y allá."
 AST_the_white_paper: "El Libro Blanco"
 AST_the_white_paper_desc: "Nuestro personal superior ha recomendado que iniciemos la reestructuración con un objetivo de establecer el tono. Tenemos algunas opciones para hacer que las cosas se muevan, pero en última instancia depende de qué área creemos que el ejército podría mejorarse mejor. La producción de armas siempre va a ser un factor que debemos considerar. Establecer objetivos de producción podría acelerar esa preparación. El recuento de tropa es otra área que podría ser fijada con cuotas de entrenamiento más rápidas. Por último, podríamos dejar de cargar la carga a nuestras industrias de defensa. Mover el tiempo de entrega en unos pocos proyectos debe motivarlos lo suficiente."
 AST_hardening_our_units: "Hardening Nuestras Unidades"
 AST_hardening_our_units_desc: "Durante la guerra del golfo y otras intervenciones desde entonces, las amenazas asimétricas se han convertido en una nueva y aterradora forma de guerra con la que hemos tenido que lidiar. Ocasionalmente más potencia de fuego no lo corta, y para los pocos desafortunados que han experimentado estos nuevos ataques, especialmente los artefactos explosivos improvisados, aquellos que sobrevivieron lo hicieron porque sus vehículos se mantenían. Desarrollar nuestra dureza puede ser la diferencia que nuestras tropas necesitan para mantenerse vivas, y continuar las operaciones."
 AST_a_networked_army: "Un ejército en red"
 AST_a_networked_army_desc: "El paisaje digital ha sido una maravilla para nuestras industrias hasta ahora. Del mismo modo, al transformar las fuerzas terrestres en una fuerza digitalmente conectada, sensor-a-shooter permite tomar decisiones más rápidas y retransmitir instantáneamente con comando. Nuestras fuerzas conjuntas estarán más unificadas que nunca, y las operaciones pueden ser gestionadas directamente por comando para asegurar que las decisiones correctas se tomen en el momento adecuado."
 AST_diisr_ast: "DIISR"
 AST_diisr_ast_desc: "Por una u otra razón no tenemos un singular instituto de investigación guiado por el gobierno. Tenemos unos pocos privados, e incluso algunos líderes a nivel estatal, pero la demanda de una instalación para someterse a la investigación que necesitamos necesita algo más grande. Planes para un Departamento de Innovación, Industria, Ciencia e Investigación han aterrizado en nuestro escritorio, y la construcción está simplemente esperando aprobación."
 AST_rnd_tax_incentive: "R&D Tax Incentives"
 AST_rnd_tax_incentive_desc: "Ahora que el DIISR está en funcionamiento, dedicando una parte de financiación a Investigación y Desarrollo, y una serie de subvenciones para comenzar proyectos aseguran que estamos en el borde sangriento de la innovación."
 AST_our_beloved_bushmaster: "Nuestros Amados Bushmasters"
 AST_our_beloved_bushmaster_desc: "Los Bushmasters han sido un icono en nuestro ejército que ha capturado los corazones de muchos expertos militares por su versatilidad, diseño de firma y capacidades de campo. Nos han estado sirviendo bien en el extranjero, y producir más de ellos debe ser una prioridad. Afortunadamente esa solicitud ya estaba incluida en el Libro Blanco."
 AST_the_special_forces: "Que Dares Gana"
 AST_the_special_forces_desc: "El SAS australiano se ha convertido en una fuente de orgullo para muchos, y con buena razón. El regimiento de élite, que originalmente fue modelado después de la unidad británica, ha llegado bastante útil para operaciones en el extranjero sensibles. Mantenerlos equipados con la mejor tecnología que hemos asegurado su éxito continúa."
 AST_lessons_from_the_middle_east_ast: "Lecciones del Oriente Medio"
 AST_lessons_from_the_middle_east_ast_desc: "Aprendimos varias cosas de una serie de operaciones en el Oriente Medio. No cabe duda de que esa ha sido la incompatibilidad entre nuestros uniformes y el lugar común del tiempo en polvo en la región. Mientras están diseñados para el calor de Australia, pueden ser mejorados para ser mejores."
 AST_remembering_the_anzacs: "Recordando los ANZAC"
 AST_remembering_the_anzacs_desc: "Nuestra Ceremonia ANZAC siempre ha conmemorado a aquellos 'que sirvieron y murieron en todas las guerras, conflictos y operaciones de mantenimiento de la paz'. Eso incluye no sólo a los que perecieron en la Gran Guerra, sino nuestras tropas en conflictos recientes como la Guerra del Golfo e Indonesia. La lección que tomamos es el deber sagrado de mantener a nuestras tropas a salvo. Ahora, mientras la guerra cambia constantemente, también debemos cambiar e innovar para dar a nuestras fuerzas la mayor oportunidad en el campo de batalla. Si no, los recordaremos en la próxima ceremonia."
 AST_never_another_darwin: "Nunca más Darwin"
 AST_never_another_darwin_desc: "El 19 de febrero de 1942, una redada de bombardeos de unos 188 aviones japoneses atravesó Darwin. Aparte de la destrucción de nuestra infraestructura militar, la pérdida de personal y vidas civiles fue catastrófica, y el mayor de cualquier ataque contra nosotros en la guerra. Las reglas de la guerra han cambiado, pero las lecciones se han mantenido iguales."
 AST_new_tools: "Nuevas herramientas"
 AST_new_tools_desc: "Si el siglo XXI nos ha demostrado algo, es que la complacencia mata. Claro que podríamos guardar los mismos rifles, mantener nuestras doctrinas iguales, pero nuestros enemigos no lo harán. La innovación en todo el Atlántico y el Pacífico ha producido armas más finas, diseñadas para una mayor gama de entornos y tipos de amenazas. Algo que no podemos permitirnos ignorar."
 AST_old_reliable: "Viejo confiable"
 AST_old_reliable_desc: "Ya miramos en el extranjero durante la guerra fría, y fuimos con los austriacos. Steyr lo consiguió bien con el AUG. Un arma aerodinámica y elegante que nuestros fabricantes han pasado décadas perfeccionando desde entonces. ¿Por qué cambiar algo bueno? En cambio, podemos invertir en ampliar la producción actual, asegurando que estamos listos para cualquier exigencia sorpresa."
 AST_lithgow_arms: "Lithgow Arms"
 AST_lithgow_arms_desc: "La planta Lithgow Arms ha sido un símbolo de nuestras capacidades y resistencia desde 1912. Nos sirvió fielmente a través de la primera y segunda guerra y ha producido más de un millón de rifles para nosotros en ese tiempo. Es por eso que el triste estado de esto ahora es difícil de ver. Hay que hacer algo."
 AST_grow_our_command: "Crece nuestro Comando"
 AST_grow_our_command_desc: "Una de las creaciones de papel blanco se ha hecho. Comando de Operaciones Especiales, diseñado para unir nuestras unidades de fuerzas especiales con los Comandos. Con la amenaza cada vez mayor que el terror ha estado planteando, junto con los desafíos habituales, nuestras fuerzas especiales están necesitando toda la asistencia que puedan recibir. Combinar el esfuerzo puede crear un delito unido que podamos manejar."
 AST_the_second_white_paper: "The 2nd White Paper"
 AST_the_second_white_paper_desc: "Con el éxito más o menos del Libro Blanco 2000, la administración nos ha dado una nueva directiva muy similar a la anterior. Continua expansión y un borde en nuestra proeza tecnológica para mantenernos, libras por libra, a la par con los gigantes. Hemos subido al plato antes, podemos hacerlo de nuevo."
 AST_strategic_reform: "Reforma estratégica"
 AST_strategic_reform_desc: "El estado actual de nuestros departamentos no va a cortarlo. Una reforma de arriba a abajo de nuestras actuales fuerzas estratégicas recortará algunas de las ineficiencias que han crecido en las últimas décadas, y nos permitirá evolucionar hacia una fuerza mucho más táctil y sensible que pueda lidiar con la situación cada vez más cambiante que el Pacífico nos ha otorgado."
 AST_incorporate_the_peacekeeping_training_ast: "Incorporar la capacitación en mantenimiento de la paz"
 AST_incorporate_the_peacekeeping_training_ast_desc: "Australia participa en las misiones de paz de las Naciones Unidas desde el final de la Segunda Guerra Mundial, aportando personal y recursos. Durante estas décadas, y en especial con la reciente intervención en Timor Oriental, hemos extraído varias lecciones de guerra que podrían integrarse mejor en nuestra propia doctrina, manteniendo a nuestras tropas protegidas incluso en los entornos más improbables."
 AST_recruitment_campaigns: "Campañas de reclutamiento"
 AST_recruitment_campaigns_desc: "Desde que el cartel «Coo-ee-won't YOU come?», hemos tenido un cuchillo para campañas de reclutamiento. Con los avances de Internet un nuevo reino de oportunidad se ha presentado para nosotros a utilizar. Podemos poner en marcha una serie de anuncios que aprovechan el espacio, y llegar a aquellos menos inclinados a ver televisión regular."
 AST_land_one_two_one: "LAND 121"
 AST_land_one_two_one_desc: "El proyecto ha sido un esfuerzo constante para reemplazar a muchos de nuestros camiones medianos y pesados, desprotegidos, con diseños mejorados de Rheinmetall, destinados a mejorar su logística y movilidad, junto con los beneficios de la armadura. Hasta ahora el proyecto ha sido un éxito, y ahora nuestros vehículos antiaéreos y de apoyo cercano están a punto de ser actualizados."
 AST_stop_panicking: "Dejar de vomitar"
 AST_stop_panicking_desc: "Todo el mundo necesita cautivar. Somos el gobierno, no controlamos la economía. Si las cosas van mal, incluso por un momento, de repente todos nos señalan los dedos. Peor, están empezando a entrar en pánico. Los estímulos a casi todo el mundo deben comprarnos un poco más de calma hasta que podamos conseguir un mango en esto."
 AST_guarantee_the_banks: "Garantizar los Bancos"
 AST_guarantee_the_banks_desc: "Si los bancos tienen miedo, los mantendremos en el verde. Haremos lo que sea necesario para mantenerlos en marcha, demonios, garantizaremos TODOS los depósitos bancarios. Ningún banco está subiendo en este país y vamos a poner suficientes vendajes fiscales para evitar que el PIB se desplome solo del gasto público."
 AST_grab_the_securities: "Coge los valores"
 AST_grab_the_securities_desc: "El mercado de viviendas en EE.UU. fue lo que empezó todo esto, y miles de propietarios en Australia se preguntan si les sucederá lo mismo. Podemos asegurar al público comprando los valores respaldados por hipotecas para apoyar nuestras finanzas de vivienda, y asegurarnos de que no vayan a la quiebra."
 AST_turn_things_around: "Date la vuelta"
 AST_turn_things_around_desc: "El Plan Nacional de Construcción y Empleo se ha convertido en el paquete económico más grande que hemos hecho. Cubre infraestructura escolar, vivienda social, construcción de viviendas, desgravaciones fiscales, proyectos ferroviarios y más pagos de estímulo que usted puede contar. El pico de nuestro apoyo a la nación debe mostrar que somos serios acerca de recuperar las cosas en el camino, y sofocar los nervios de todos."
 AST_the_royal_australian_navy: "Real Armada Australiana"
 AST_the_royal_australian_navy_desc: "Nuestro orgullo y alegría al salir de nuestra costa es la RAAN. Si no fuera obvio Australia es una nación isleña. Durante siglos la única manera de que cualquier fuerza de invasión pudiera llegar a nuestras costas fue a través de una flota, y protegido de que alguna vez fuimos por la Armada Británica Real. Ahora, por supuesto, podríamos ser golpeados por un misil intercontinente, y mucho más daño podría hacerse sin que nadie tenga que aterrizar en nuestras costas, pero ese no es el punto. Como odo al papel que tuvieron una vez, y con un trabajo no menos importante, nombramos a nuestra marina real, y lo despachamos para mantener las ondas seguras como lo hicieron una vez. Para proteger nuestra gloriosa nación."
 AST_embrace_the_support_role: "Abrazar el papel de apoyo"
 AST_embrace_the_support_role_desc: "Abrazar el papel de apoyo - La realidad de nuestra posición en el Pacífico es la de detenerse. Por nuestra cuenta, uno a uno, no tenemos ninguna oportunidad contra una flota china o rusa. Pondremos una pelea, pero la única manera de ganar la guerra es a través de nuestros aliados. Nuestro papel siempre ha estado jugando segundo fiddle a los americanos, y eso ha estado bien hasta ahora. Todo lo que tenemos que hacer es esperar hasta que lleguen, y luego ganamos. No hay vergüenza en jugar el papel de apoyo, especialmente si lo hacemos bien."
 AST_we_are_the_pacific: "We are the Pacific"
 AST_we_are_the_pacific_desc: "Los tiempos han cambiado. La Unión Soviética ya no es, y China todavía no es su sucesor. En realidad, una guerra naval es muy poco probable en el horizonte. Si fuera así, tal vez no nos mantengamos solos. No con esta marina. Si nos comprometemos a expandirlo podemos crear una fuerza con la que pocos puedan tener en cuenta. Usando todo a nuestra disposición el papel de nuestra nación podría no ser colocado en piedra."
 AST_trade_support: "Apoyo al comercio"
 AST_trade_support_desc: "Una de nuestras responsabilidades vitales ha estado protegiendo el comercio entre nosotros y nuestros valiosos socios. Mantener el flujo de mercancías a salvo de la interdicción por nuestros rivales navales, como China, asegura que el comercio con nuestros mayores importadores, como China, siga prosperando."
 AST_multidimensional_warfare: "Operaciones multidominio"
 AST_multidimensional_warfare_desc: "Al integrar el poder militar a través de la tierra, el mar, el aire, el espacio y los dominios cibernéticos nos encontramos en una ventaja significativa sobre los enemigos atrapados que carecen en estos campos. Tanto los departamentos aéreos como la marina necesitan trabajar juntos en esto."
 AST_whetstone_training: "Entrenamiento Whetstone"
 AST_whetstone_training_desc: "Como una espada que deja ocioso, si nuestra Marina no está constantemente probada y refinada, se oxidará. Los ejercicios de combate del mar van a frustrar nuestros cadetes y marineros en forma, o así me ayudan. Estarán listos para cualquier compromiso en cualquier momento porque ese es el trabajo, y nos harán orgullosos."
 AST_wide_scanning: "Escáner ancho"
 AST_wide_scanning_desc: "La Red de Radar Operacional de Jindalee (JORN) ha pasado su periodo prototipo y se ha trasladado a la fase 5 implementando, lo que significa esencialmente que es muy probable que sea la tecnología de radar más avanzada alrededor, monitorizando en rangos superiores a 3.000 kilómetros. Inventar la cosa era la parte fácil, ponerla en nuestras naves es la parte difícil."
 AST_an_outside_review: "Una revisión exterior"
 AST_an_outside_review_desc: "Para medir nuestras capacidades hemos encargado una revisión externa. Los resultados son una crítica algo sorprendente sobre nuestra capacidad de producción, que necesitaremos para mejorar si vamos a llegar a cualquier lugar desarrollando una armada seria."
 AST_the_middle_ships: "Los buques medios"
 AST_the_middle_ships_desc: "Mucho sudor y lágrimas han ido a desarrollar nuestros destructores de clase Hobart. Reemplazando nuestros barcos de clase Perth desde los años 60, y diseñados para restaurar nuestras capacidades de misiles guiados, pueden ser nuestra actualización más importante en todo el tablero."
 AST_screening_role: "Función de la proyección"
 AST_screening_role_desc: "Si apoyamos a nuestros aliados en el Pacífico necesitamos ser los ojos y oídos para ellos. Nuestra capacidad para ver amenazas antes de que estén en nuestra puerta no es sólo un beneficio táctico para ellos tampoco, nos ayuda a preparar y controlar el campo en juego. Cuanto mejor estamos en esto, mejor vamos a actuar."
 AST_below_the_enemy: "Debajo del Enemigo"
 AST_below_the_enemy_desc: "Mientras algunos de nuestros submarinos fueron encargados más recientemente, gran parte de nuestra flota es muy vieja. Se han hecho mejoras a la mayoría, pero esto no cambia el hecho de que nos están poniendo activamente en desventaja tecnológica, especialmente cuando nuestra mejor oportunidad es a través de combates indirectos."
 AST_containment_theory: "Teoría de contención"
 AST_containment_theory_desc: "Durante la guerra fría operamos bajo la práctica de «teoría del mantenimiento», junto a los estadounidenses. Una teoría diseñada explícitamente para bloquear la expansión soviética. La junta para la geopolítica ha cambiado, pero de alguna manera la asignación no lo ha hecho. Nuestros enemigos cumplen un objetivo muy real y expansionista. Ya sea mediante la diplomacia o la construcción de islas, nuestra soberanía está incuestionablemente amenazada si no podemos resistir esto, o al menos frenarla. La presencia naval consistente, junto con la acción diplomática exitosa es la única manera de ver un futuro sin guerra directa, lo que significa que es nuestra única opción."
 AST_the_groundwork: "Los fundamentos"
 AST_the_groundwork_desc: "El trabajo duro debe ser puesto en el establecimiento de la infraestructura para lo que estamos tratando de hacer. Una expansión masiva de nuestros actuales astilleros y espacios departamentales tendrá que ser empleada rápidamente, lo cual probablemente será un poco costoso."
 AST_expand_command_capabilities: "Ampliar las capacidades del comando"
 AST_expand_command_capabilities_desc: "Con el alcance de lo que estamos filmando, vamos a necesitar expandir la Sede Naval y el Departamento de Defensa para manejarlo. Mantener ambas ramas estrechamente conectadas durante la transición, mientras que supervisar el aumento de producción va a ser costoso, pero necesario."
 AST_carrier_project: "Project"
 AST_carrier_project_desc: "No fue hace tanto tiempo que Australia tenía sus propios portaaviones. El HMAS Sydney y Melbourne fueron adecuados para cualquier compromiso y verdaderas bellezas del mar. A medida que los tiempos cambiaron y nuestros gastos militares brillaban, tales hemots ya no eran viables. Hasta ahora. Los transportistas serán devueltos a nuestra flota y el legado de nuestros barcos retirados vivirá."
 AST_like_submarines_in_a_barrel: "Like Submarines in a Barrel"
 AST_like_submarines_in_a_barrel_desc: "Tenemos que cerrar la brecha de transporte, y para hacerlo vamos a tener que utilizar nuestros helicópteros. El MH-60R Seahawk es un excelente ejemplo para lograr nuestros objetivos de movilidad. Podemos invertir en el proyecto para desarrollar el diseño y comenzar la producción."
 AST_ship_to_air: "No te asustes a los Destructores"
 AST_ship_to_air_desc: "Nuestros destructores tienen hambre de misiles, y la única manera de alimentarlos es más misiles. No el viejo técnico, eso no va a hacer. Vamos a necesitar algo nuevo para alimentar a estas criaturas."
 AST_grants_to_contractors: "Subvenciones a Contratistas"
 AST_grants_to_contractors_desc: "Si no nos dieran exactamente lo que queríamos todo el tiempo, diría que estas empresas se estaban aprovechando de nosotros. Afortunadamente las inversiones adecuadas han demostrado ser lo suficientemente confiables para mantener la asociación. Un poco más de inversión y podríamos estar viendo la mejora de producción que necesitamos."
 AST_adf_academies: "ADF Academies"
 AST_adf_academies_desc: "Nuestro principal instituto para combinar el entrenamiento militar con la educación universitaria está en Canberra. Es sólo un edificio, pero para nuestra defensa exige que ese número vaya a tener que subir. Construiremos un número de ellos en todas nuestras ciudades principales, y tal vez aflojen algunos de los requisitos también."
 AST_the_raaf: "La Real Fuerza Aérea de Australia"
 AST_the_raaf_desc: "Ah, la Real Fuerza Aérea de Australia. Nuestro principal departamento de guerra aérea, continuando manteniendo los cielos sobre Australia seguros y seguros. Tienen los mejores uniformes, la mejor comida y el trabajo más fresco de las ADF. Pero no moramos en los beneficios. El mandato ha sido expedido, y el enfoque es simple. Superioridad aérea en el Pacífico, y apoyo para nuestras operaciones expedicionarias. Lo que vamos a hacer es nuestra discreción."
 AST_fourth_generation_striking: "4th Generation Striking"
 AST_fourth_generation_striking_desc: "Obtener nuestras manos en aviones de cuarta generación no va a ser fácil, y vamos a tener que utilizar plenamente nuestras conexiones y capacidad tecnológica para llegar allí. La brecha entre los combatientes del 3.º y 4.º gen no es tan masiva, pero a la velocidad que se aproxima la 5.ª generación, es obvio que no queremos quedarnos atrás."
 AST_globemasters: "Globemasters"
 AST_globemasters_desc: "El Boeing Globemaster III es nuestro principal avión de carga para transportes aéreos estratégicos y tropas de transporte. Boeing ciertamente se entregó en este. El modelo es más grande y mucho más poderoso que el anterior, pero no lo adivinarías, queremos otro. Les enviaremos las especificaciones y esperamos que los resultados sean suficientes."
 AST_shadow_in_the_sky: "Shadow in the Sky"
 AST_shadow_in_the_sky_desc: "El AAI RQ-7 Shadow es nuestra unidad de reconocimiento más eficaz y un drone de combate no tripulado desarrollado actualmente. Otro técnico nifty levantado de los estadounidenses que marca un cambio de estrella a la naturaleza de la guerra. A medida que aumenta nuestra infraestructura móvil, y el alcance en que actúan nuestras operaciones, la capacidad de lucha ha aumentado mucho más allá de lo que anteriormente éramos capaces."
 AST_the_roulettes: "Los Roulettes"
 AST_the_roulettes_desc: "Los Roulettes son el propio equipo aéreo aerobático de la Fuerza Aérea. Han volado alrededor del mundo realizando una serie de espectáculos atrevidos y han capturado naturalmente la admiración de aquellos lo suficientemente afortunados como para verlos. La línea de fondo es si cada vez que vuelan hace un número para nuestra reputación, entonces por todos los medios les vamos a dejar volar."
 AST_employ_ballistic_missiles: "Misiles balísticos empleados"
 AST_employ_ballistic_missiles_desc: "Los misiles de huelga de precisión a largo plazo se emplean con frecuencia para disuadir los conflictos. Son la herramienta mágica utilizada para bailar a lo largo de la línea gris entre la no confrontación y toda guerra. Si, por ejemplo, una de nuestras bases en el extranjero fuera a ser golpeada, podríamos desplegar una «respuesta proporcional» donde los golpeamos en un sitio igualmente estratégico con nuestros misiles de largo alcance, y todo el mundo llega a casa feliz con sólo egos ligeramente bruñidos y sin preocupaciones de guerra. En teoría."
 AST_project_wedgetail: "Proyecto Wedgetail"
 AST_project_wedgetail_desc: "El proyecto Boeing E-7 es uno de nuestros esfuerzos más recientes en centros móviles de mando. Nos proporciona un sistema de alerta temprana, gracias al radar abocado arriba, y la inteligencia local en tiempo real sobre el campo de batalla. Por supuesto, los aviones pueden ser reacondicionados y utilizados para otros fines aéreos a nuestra discreción."
 AST_keep_them_out: "Mantenlos fuera"
 AST_keep_them_out_desc: "Mientras que detectarlos es una cosa, en realidad disuadir a los aviones enemigos de estrangular las ciudades australianas es otra. Nuestros aviones no siempre pueden estar en el aire, así que los sistemas portátiles y fijos de 'NASAMS' servirán en su lugar. Acompañados por el radar son una poderosa fuerza defensiva para contemplar."
 AST_preserve_the_super_hornets: "Preserve el Super Hornets"
 AST_preserve_the_super_hornets_desc: "Desde la jubilación de los F-111s, los 24 F/A-18F Super Hornets han aumentado para ocupar su lugar, que ellos mismos están subiendo allí edad sabia. Podemos mejorar el modelo y actualizar una serie de sistemas internos para ayudar al cambio a asegurar que estén listos para el nuevo papel."
 AST_masters_of_command: "Maestros del Mando"
 AST_masters_of_command_desc: "Utilizar la logística de helicópteros para las operaciones ha revolucionado nuestro potencial móvil. Sin la necesidad de aeropuertos, representan el mejor caso de uso para zonas de alta tensión y campos de batalla en evolución. La ejecución de un organismo dedicado a las operaciones de helicópteros logísticos mejorará su competencia en toda la junta directiva."
 AST_reopen_cockatoo_island: "La isla de Cockatoo"
 AST_reopen_cockatoo_island_desc: "La creciente necesidad de patios de reparación ha comenzado a usarse en nuestra infraestructura actual. La isla de Cockatoo, que acaba de cerrar en los años 90 pero se ha convertido en algo de destino turístico, tendrá que ser reconstruida desde el suelo para reparar la nueva generación de barcos rotos."
 AST_the_howard_government: "El Gobierno de Howard"
 AST_the_howard_government_desc: "El sol se levanta en nuestra nación. Rico en la belleza, de suelo dorado, y verdaderamente girt por el mar. Australia es única en su lugar como un poder regional en el Pacífico; un país con muchos amigos y pocos enemigos. Sin embargo, los australianos anhelan un mañana mejor, y muchos han caído a través de las grietas de la sociedad. La clase obrera se ha reunido alrededor del gobierno de Howard en las últimas elecciones, dejando a los liberales disfrutar de una cómoda mayoría. \n\nAhora se nos ha entregado un mandato de cambio cauteloso y se espera que sigamos. El gobierno de Keating nos dejó con un sizable agujero en el presupuesto que, mientras hemos sido rigurosos para parchear, todavía nos deja con el trabajo de traerlo más al verde. Las protestas han encendido las calles demandando acción, y nuestros propios negocios piden reforma económica. \n\nEl país afortunado está en nuestras manos."
 AST_new_millennium_economics: "Nueva economía del Milenio"
 AST_new_millennium_economics_desc: "El presupuesto ha sido entregado y aprobado. La disciplina fiscal y un superávit presupuestario son nuestras políticas más demandadas, pero eso no significa que no podamos gastar un poco para hacer un dólar por la línea. Varios activos hinchados en el gobierno son los primeros que se venden, y un montón de recortes todavía se pueden hacer para financiar expansiones de otros programas. \n\nEl banco de reserva ya ha aumentado la tasa de efectivo. Depende de nosotros seguir el traje. Seremos duros, pero justos como siempre."
 AST_trim_taxes: "Trim Taxs"
 AST_trim_taxes_desc: "Durante las últimas elecciones hicimos promesas de reducir impuestos para los australianos trabajadores duros. Nuestra posición no ha cambiado. Los residentes mayores y los ingresos altos pueden ser los primeros en recibir una corriente de recortes fiscales, dejando más dinero embriagado a negocios locales y más en el banco."
 AST_restrict_welfare: "Cortar los Bludgers Dole"
 AST_restrict_welfare_desc: "Nuestras expansiones a la cúpula han dejado nervioso el presupuesto del partido. Sin una manera de frenar la hinchazón vamos a estar deshaciendo nuestro duro trabajo equilibrando los libros estos últimos años. Si empezamos con limitar el alcance del programa, y poner en requisitos difíciles para permanecer en él podríamos conseguir. El aumento de las obligaciones mutuas también reducirá a algunos de los participantes menos productivos."
 AST_another_round_of_tax_cuts: "Otra ronda de recortes fiscales"
 AST_another_round_of_tax_cuts_desc: "¿Qué clase de gobierno seríamos si no pensáramos en nuestros negocios? Se ha hecho mucho crecimiento durante nuestro período, pero algunas pequeñas empresas, e incluso algunas grandes, han mostrado una lentitud de la productividad. Podemos aliviar su dificultad con más recortes de impuestos y una pequeña reforma para recortar las aguas para la competencia."
 AST_launch_the_gst: "Inicie el GST"
 AST_launch_the_gst_desc: "La legislación ha aprobado y el impuesto sobre bienes y servicios ahora puede reemplazar los sistemas anticuados de antaño. Lees y los otros naysayers pueden quejarse de ello, pero el GST ha pasado sus pruebas. Las empresas pueden beneficiarse de un impuesto simplificado y mayorista, y tampoco dañará el presupuesto."
 AST_cater_to_the_seniors: "Cater to the Seniors"
 AST_cater_to_the_seniors_desc: "Cualquier gobierno sano se agita en el cruce de vez en cuando. Incluso las políticas de oposición política deben ser consideradas en el mejor interés de nuestro pueblo. El GST ha proporcionado un impulso sustancial al presupuesto, pero muchos de nuestros mayores no están sintiendo el beneficio. Exención de alimentos básicos del programa, y una generosa compensación a los pensionistas debe suavizar el golpe. Los liberales no serán sacrificados por la miseria de la pureza ideológica."
 AST_rethink_negative_gearing: "Rethink Negative Gearing"
 AST_rethink_negative_gearing_desc: "Nuestros cambios para impulsar el engranaje negativo no han estado sin controversia. Los propietarios del hogar y especialmente nuestra base de votación más antigua han aludido los cambios, sin embargo, aquellos que no pueden permitirse viviendas han visto el cohete precios en tan solo un corto período. Cuanto más trabajo inclinado en nuestro gobierno está viendo los efectos espiral antes de que nuestro término sea aún mayor. Podría destruir nuestra buena voluntad con la clase mayor, pero una economía sana a largo plazo podría salvar el daño. Sólo podemos esperar que los luchadores permanezcan leales."
 AST_first_home_first_served: "Primer hogar, primer servido"
 AST_first_home_first_served_desc: "Otra de las víctimas proyectadas del GST es el primer dueño de casa. Con el precio de los materiales de construcción que suben, hemos asignado una subvención para $7000 para ser emitidos a los primeros propietarios. Ayudándoles a levantar una pierna en el creciente mercado competitivo."
 AST_meeting_the_mining_giants: "Encuentro con los Gigantes Mineros"
 AST_meeting_the_mining_giants_desc: "No es raro que el líder de una nación se reúna con los grandes jugadores. La Cámara de Comercio e Industria Boulder ha solicitado una reunión en persona, probablemente estimulada por nuestros recortes fiscales recientes. Sólo podemos esperar que estén lo suficientemente envalentonados para hacer más demandas. Al final depende de nosotros si los escuchamos."
 AST_proud_and_free: "Proud y Libre"
 AST_proud_and_free_desc: "Si examinamos las regiones que más sufren de escasez de aptitudes y desempleo, podemos centrarnos en establecer hasta 24 colegios técnicos dirigidos a los jóvenes que abandonan la escuela y a los desempleados. Al extender también el trabajo para el Dole a los aprendices, los pondrá en el mismo pie que los estudiantes universitarios. La Fuerza de Defensa también se ha comprometido a asignar una parte del equipo y el mantenimiento para la capacitación adicional en aptitudes. \n\nLos estudiantes van a ser más libres para seguir sus pasiones de carrera mientras nuestra industria manufacturera está reforzada. Esto más o menos marca una docena de bases de bajos ingresos al mismo tiempo, y ciertamente amplía nuestra base electoral con la juventud TAFE."
 AST_invest_in_people: "Invertir en personas"
 AST_invest_in_people_desc: "Los que se enfrentan al fondo de la roca pueden encontrar difícil recogiéndose de nuevo. Si bien no fomentamos el desempleo a largo plazo, podemos evitar penalizarlos incluyendo incentivos para asistir a programas de capacitación en TAFE y otros proyectos de defensa y comunidad. Menos una entrega gratuita y más inversión en el futuro de nuestros trabajadores."
 AST_beef_up_the_dole: "Beef Up the Dole"
 AST_beef_up_the_dole_desc: "Hasta ahora nuestro programa Work for the Dole ha sido un éxito rotundo. Menos Aussies están desempleadas, y los del programa están ocupados mejorando su aptitud para el trabajo. Podemos ampliar el Dole para incorporar obras públicas y ampliar el rango de edad para los solicitantes adecuados."
 AST_the_baby_bonus: "El Bono del Bebé"
 AST_the_baby_bonus_desc: "Ya no va a tener un niño con riesgo financiero. Al reemplazar el subsidio de maternidad, las nuevas madres recibirán un pago una vez libre de $3000. Alentar a las familias jóvenes a tomar el émbolo y suavizar la carga que viene con la nueva paternidad."
 AST_protect_the_water: "Proteger el agua"
 AST_protect_the_water_desc: "Algunos de los ríos más lejanos del interior son sólo una semana de mal tiempo lejos de secar por completo, negando granjas enteras y ciudades de agua. La Iniciativa Nacional del Agua es el primer paso en nuestra búsqueda de sostenibilidad. Gestionar el uso del agua y mantener niveles de extracción sostenibles en las comunidades más remotas mantiene el suministro de agua disponible para millones."
 AST_the_kyoto_protocol_ast: "Protocolo de Kyoto"
 AST_the_kyoto_protocol_ast_desc: "Ya hemos negociado términos justos en la propuesta de la ONU. Ratificarlo nos reuniría con los otros 84 países que ya están comprometidos a reducir nuestros gases de efecto invernadero. Sea cual sea el efecto que tengamos en el calentamiento global, estarás seguro de que lo estamos haciendo mínimo y que Australia es una nación responsable en este asunto."
 AST_the_carbon_pollution_reduction_scheme: "El plan de reducción de la contaminación por carbono"
 AST_the_carbon_pollution_reduction_scheme_desc: "Rudd ha propuesto un esquema para reducir los niveles actuales de carbono provenidos de nuestras industrias en un total del 25%, utilizando 'caps' que las empresas tendrían que mantener bajo sus niveles de contaminación. Rudd es un hombre típicamente elevado, y un látigo cuando se trata del cambio climático, pero el público tiene su espalda. Si ajustamos el esquema lo suficiente para evitar dañar nuestra ventaja competitiva en los combustibles fósiles, podríamos salirnos con él."
 AST_the_drought_force: "La Fuerza de Sequía"
 AST_the_drought_force_desc: "Hasta ahora la transición hacia el nuevo siglo ha sido rocosa. Tal vez el mayor signo de preocupación ha sido la «sequedad milenaria», que puede ser la peor sequía que hemos experimentado en la historia de nuestra nación. Con nuestros socorristas de emergencia ya ocupados asistiendo a ello, estamos estirados buscando opciones más cercanas a nuestro gobierno. Ya hemos incorporado nuestro trabajo para los participantes de Dole en obras públicas, y ahora podemos centrarlos en tierras privadas afectadas por este desastre natural."
 AST_a_nation_worth_preserving: "A Nation Worth Preserving"
 AST_a_nation_worth_preserving_desc: "Hemos logrado mejoras duraderas en la sostenibilidad de nuestra nación. Tal vez no afectará al mundo en su conjunto, pero para Aussies, la nación que aman perseverará. Las aguas son más claras, la smog ha desaparecido. Podría haber más que hacer, más métodos para la energía limpia o medios de preservación, pero por ahora podemos descansar como una nación más orgullosa."
 AST_practical_reconciliation: "Reconciliación práctica"
 AST_practical_reconciliation_desc: "«Me gustaría empezar por reconocer a los Propietarios Tradicionales de la tierra en la que nos encontramos hoy. También me gustaría dar mis respetos a los ancianos pasado y presente.» \n\nPuede sonar como waffle, pero la relación con los australianos indígenas no ha sido una sin lucha. Cada gobierno debe reconocer su historia con dignidad y respeto, y el liderazgo no es uno sin responsabilidad. Sin embargo, seguimos adelante, reconocemos el pasado y abrazamos el futuro. Uniendo a los australianos con un enfoque medido."
 AST_walk_the_journey: "Camina el Viaje"
 AST_walk_the_journey_desc: "Ha sido un largo camino, y conozco uno difícil para muchos australianos. Como muchos hay que hemos ayudado, es ingenuo de cualquiera de nosotros pretender que algunos no permanecen. Nuestros esfuerzos para sanar esa brecha, y elevar a los que quedan atrás, deben comenzar con programas centrados en la salud, la educación, la vivienda y el empleo. Los programas ya examinados en el Parlamento serán financiados y ampliados. Los desfavorecidos y la coalición caminarán de la mano."
 AST_a_national_apology: "Una disculpa nacional"
 AST_a_national_apology_desc: "Keating quiere atajarnos. Bien, jugaremos al trabajo en su propio juego. Les daré a esas galaxias en el Guardián lo que quieren. Voy a asumir la responsabilidad de las generaciones anteriores, y luego podemos seguir adelante. Aussias Indígenas conseguirán su justa sacudida, y nadie dirá que yo no los ayudo."
 AST_its_mabo_its_the_vibe: "Es Mabo, su Vibe"
 AST_its_mabo_its_the_vibe_desc: "El caso Mabo fue una decisión histórica para el Tribunal Superior. Eddie luchó por el título nativo, la existencia de tierras precoloniales y terminó terra nullius para bien. \n\nAl trabajar con las comunidades indígenas y proponer una enmienda para incluir una Declaración de Reconciliación en el preámbulo de la Constitución, reconoceríamos sus derechos a la tierra, ampliando la actual Ley sobre los Derechos de las Tierras Aborígenes. Es simbólico, tal vez, pero muestra que somos serios sobre la igualdad. Todos los votantes tendrán un voto igual."
 AST_the_civil_partnership_act: "Ley de asociación civil"
 AST_the_civil_partnership_act_desc: "Actualmente los estados y el territorio restringen que las parejas del mismo sexo sean reconocidas como incluso en una relación, lo cual puede causar una serie de cuestiones menores para ellos legalmente. Si bien nos retractamos de abordar el tema del mismo matrimonio sexual como una postura moral, podemos ayudar a aquellos que no desean casarse y al menos someter la decisión a votación."
 AST_avoid_the_speech: "Evite el discurso"
 AST_avoid_the_speech_desc: "No creo, como cuestión de principio, que una generación pueda aceptar la responsabilidad por los actos de una generación anterior. No acepto eso como cuestión de principio. Este gobierno no entregará gestos vacíos, ni se verá atrapado en la materia indígena por puntos políticos. La coalición debe parecer unificada en esto. Cualquier charla de asistir a la caminata de reconciliación debe ser tapada en el capullo."
 AST_crack_down_on_protests: "Crack Down on Protests"
 AST_crack_down_on_protests_desc: "El atraco, las manifestaciones, todo lo que necesita parar. ¡Todo el mundo necesita calmarse! No me importa cómo lo hagamos. Cambia los titulares, y aumenta la policía. Lo que podamos hacer para que los problemas reales puedan tener el foco de atención y controlar a estos hooligans. No escucharé su autoagrandamiento. ¡De hecho, no voy a prestar ninguna atención! Nuestra política será elogiada como rechazo a la política de culpa y simulación. Estoy seguro de ello."
 AST_abolish_the_atsic: "Abolir el ATSIC"
 AST_abolish_the_atsic_desc: "Hasta ahora el experimento que es representación separada ha sido un fracaso. Un decenio de financiación se ha verificado sin ningún beneficio práctico para la comunidad indígena en absoluto. Peor han sido las denuncias de mala gestión, corrupción, fraude, la lista continúa. No más. Destrozaremos a la agencia y sacaremos todo lo que podamos de su financiación."
 AST_with_safer_communities: "Con comunidades más seguras"
 AST_with_safer_communities_desc: "Reports of child abuse and a collapse in remote indigenous communities up north is a national disaster to put it lightly. El apoyo bipartidista para una intervención moral era fácil de obtener. Despliegaremos las tropas, restringiremos el bienestar, emplearemos controles de salud obligatorios y vigilancia. Se prohibirá la pornografía y el alcohol en las comunidades, y finalmente podremos devolver los derechos de tierra al gobierno. Algunos elementos requerirán suspender la Ley de Discriminación Racial, lo que significa que los responsables y grupos comunitarios se van a quejar, pero cuando la ley y el orden han sido restaurados los lugareños no serán los únicos que nos dan las gracias."
 AST_we_are_many: "Somos muchos"
 AST_we_are_many_desc: "Somos, sin duda, un país diverso. Incluso durante los días de la política 'White Australian', la nación fue inundada por europeos de no dos ascendencias similares. Ahora el país ha abierto sus puertas a muchos, y somos responsables de esa ingesta. Cómo gobernar el asunto definirá el maquillaje para las próximas décadas de Australia. Ya sea rico o fuerte, decidimos la política y la vida de millones."
 AST_widen_our_net: "Ampliar nuestras redes"
 AST_widen_our_net_desc: "La oficina de inmigración ha avanzado mucho desde la «Política Australiana Blanca», pero deja que se enfrente, el número sigue siendo bajo, muy bajo. Al ritmo que nuestra economía está en auge, la escasez de trabajadores será un nuevo problema en desarrollo. Para arreglar esto estamos ampliando la ingesta de trabajadores extranjeros, y para equilibrar esto, se hará más estricto hincapié en los migrantes cualificados con un acceso reducido al bienestar para los nuevos migrantes. Esto debe complacer simultáneamente a ambos lados del pasillo, mientras que el atractivo para las grandes empresas."
 AST_with_open_arms: "Con brazos abiertos"
 AST_with_open_arms_desc: "Esta nación siempre ha sido multicultural, y una que ha necesitado la llegada por mar. No todo el mundo ha venido a través de los canales adecuados, sin embargo han reclamado asilo desde todos los rincones del mundo. Deseando eventualmente ser parte de los millones que disfrutan de nuestro generoso país. La ineficiencia de nuestras políticas actuales se puede simplificar para permitir que los solicitantes de asilo más auténticos sean más breves. Las familias con niños serán trasladadas de los centros de detención y de viviendas comunitarias, y se llevarán a cabo investigaciones privadas para las personas detenidas durante más de dos años."
 AST_girt_by_border_patrol: "Girt by Border Patrol"
 AST_girt_by_border_patrol_desc: "Australia podría ser una isla, pero eso lo deja vulnerable a la invasión por el mar. Los incidentes en el agua han puesto nuestra patrulla fronteriza existente en aguas más calientes de lo habitual. Sin una clara capacidad de salvaguardar nuestras costas, ¿cómo podemos esperar que nuestras fuerzas mantengan a esta nación segura? Con el Proyecto de Ley de Protección Fronteriza no habrá duda alguna en nuestra capacidad de volcar naves, protegiendo a los oficiales de una acción legal injusta si lo hacen."
 AST_the_pacific_solution: "La solución del Pacífico"
 AST_the_pacific_solution_desc: "Mientras nuestra inmigración legal se ha desplomado, la inmigración ilegal no lo ha hecho. Miles de migrantes están aterrizando en nuestras costas cada año indocumentados, y parece que ese número está aumentando. Con la infraestructura existente que se está volviendo abrumada, en Nauru y Manus Island se construirán centros de detención fuera de la tierra para albergar a los solicitantes de asilo mientras determinamos su condición. Compensando a ambas naciones con justicia. Luego reduciremos el territorio continental viable para reivindicaciones válidas de asilo, más saltadores de cola desincentivadores."
 AST_for_bright_minds: "Para las mentes brillantes"
 AST_for_bright_minds_desc: "Los estudiantes extranjeros se están convirtiendo rápidamente en una fuente de ingresos no tan insignificante para nuestras mejores universidades. Actualmente sólo algunos pueden venir a través de nuestras visas de estudio limitadas, pero si ajustamos los requisitos, un poco, mucho más estudiantes viajarán aquí desde el extranjero, y mucho más dinero irá al sector educativo."
 AST_strong_in_difference: "Fuerte en la Diferencia"
 AST_strong_in_difference_desc: "Hemos gestionado una población de pueblos diferentes, culturalmente diversos, que se han amalgamado en una nueva identidad australiana. Todos nos vemos diferentes y cada uno de nuestros puntos fuertes, pero en general estamos construyendo Australia. Los lugares de trabajo están llenos al borde de mentes brillantes y aquellos que han tenido éxito en su búsqueda por el sueño de esta nación. El sueño de pertenecer, y como también lo hemos hecho, llevándose bien."
 AST_tear_out_the_roots: "Extiende las raíces"
 AST_tear_out_the_roots_desc: "Es bien conocido muchos de nuestros problemas de seguridad comienzan y terminan en Indonesia. Nuestro vecino más fuerte e inmediato, y uno muy vulnerable a los elementos extremistas. Si se pudiera llegar a un entendimiento entre nosotros, en particular una colaboración para erradicar las células de insurgencia y dentro de su nación, ambas partes se beneficiarían. Establecer las bases para una cooperación más estrecha en el futuro."
 AST_welcome_the_experts: "Bienvenidos a los Expertos"
 AST_welcome_the_experts_desc: "Podemos tener algunas de las mentes más brillantes ya, pero invitar a algunos más del extranjero no nos haría daño. Incluso puede suavizar algunos de los golpes que enfrentamos en R&D. Si utilizamos el sistema SkillSelect ya existente podemos extender visas a migrantes cualificados de todos los rincones del mundo moderno."
 AST_protected_on_all_sides: "Protected on All Sides"
 AST_protected_on_all_sides_desc: "Mientras el sol se pone en nuestros océanos dorados, nuestra gente puede relajarse sabiendo que en cada lado de su nación, patrullando las aguas, nuestras patrullas los mantienen a salvo. Cuando los temores de la gente de otra nación que salta sobre nuestras playas chocan contra la prensa, sabrán que es simplemente temeroso ya que el gobierno tiene su espalda. Que su futuro esté asegurado."
 AST_the_howard_doctrine: "La Doctrina Howard"
 AST_the_howard_doctrine_desc: "Después de nuestra intervención en Timor Oriental en 1999, unos pocos periodistas comenzaron a acuñar el término, destinado a describirnos como un proveedor de primer recurso para muchas naciones del Pacífico. Aunque eso podría ser una evaluación exacta, creo que nuestra doctrina no se limita a tal postura. \n\nAntes de convertirme en Primer Ministro, esta nación estaba definiendo su lugar en el mundo demasiado estrecho. Nuestro gobierno tiene la capacidad de reequilibrar la política exterior de Australia para reflejar mejor la intersección única de las culturas y la historia que habitamos. El tiempo sólo ha fortalecido mi creencia de que no enfrentamos una opción entre nuestra historia y nuestra geografía. Nos sentamos en una posición única de flexibilidad, donde podemos seguir siendo fieles a nuestros aliados y lealtades tradicionales al tiempo que se construyen y fortalecen nuevas alianzas en la región."
 AST_deputy_peacekeepers: "Agentes de Paz Adjuntos"
 AST_deputy_peacekeepers_desc: "En el Andy Griffith Show, Barney Fife es ayudante del sheriff de la ciudad, Andy Taylor. A veces cuando el sheriff no está a su alrededor, le toca a Barney mantener el orden y dirigir el espectáculo en su lugar. El papel policial global de los Estados Unidos se ha vuelto incuestionable desde la caída del Muro de Berlín, pero aparecen nuevas amenazas todos los días, y algunas de esas increíblemente cercanas a Australia. Del mismo modo que Barney, Australia está en una posición donde nos encargan patrullar el Pacífico mientras Estados Unidos está en otro lugar. No es una posición fácil, pero lo tomamos en palas."
 AST_war_on_the_terrible: "War on the Terrible"
 AST_war_on_the_terrible_desc: "En nuestra era actual, las definiciones clásicas y nuestros métodos para combatir el terrorismo son lamentablemente anticuados. Aquellos que desean hacer daño a los australianos se están adaptando mucho más rápido a las tecnologías de hoy. La introducción de legislación para enmendar nuestras definiciones jurídicas del terrorismo y la modificación de las leyes que castigan a las personas que lo hacen son los primeros pasos eficaces. Se necesitarán potenciar los poderes de detención y las capacidades de vigilancia de ASIO para mantenernos al día, y dar a nuestras unidades la reacción móvil para reducir las amenazas antes de que surjan."
 AST_new_wave_counter_terrorism: "Nuevo Wave Counter-Terrorism"
 AST_new_wave_counter_terrorism_desc: "Incluso nuestras nuevas enmiendas no son suficientes. A medida que recibimos más información sobre los ataques terroristas inminentes contra el suelo de Aussie, lo más obvio es que nuestros poderes deben ser multiplicados. ASIO y la policía tendrán que ampliarse. Las redadas antiterroristas, la detención preventiva y la instigación de la policía local con 'parar y buscar' van a acabar con la amenaza. Somos conscientes de que esto va a ser un movimiento controvertido, pero nuestra situación requiere mucho más de medias medidas."
 AST_commit_to_foreign_intervention: "Commit to Foreign Intervention"
 AST_commit_to_foreign_intervention_desc: "El conflicto creció en casi todos los continentes del mundo. La excepción es Australia. La única forma en que hemos podido mantener las cosas de esa manera, y seguir haciéndolo es asegurarnos de que el conflicto abierto no se derrama en nuestras aguas. Ser capaz de intervenir en estas amenazas antes de salir de la mano es esencial para esto. Los objetivos en el medio este y sureste de la asia son focos para las células terroristas, pero podemos elegir dónde y cómo intervenir si sirve a los intereses de seguridad de nuestra nación."
 AST_place_rudd_in_the_fire: "Lugar Rudd en los Fuegos"
 AST_place_rudd_in_the_fire_desc: "Parece que Kevin Rudd se ha convertido en una creciente molestia en el partido de oposición mientras intentamos aprobar legislación. Lo peor es que está ganando tracción en el ojo público. Actualmente es el ministro de la sombra para los asuntos exteriores, pero ¿qué tal si le asignamos a nuestro propio comité extranjero. Ponlo trabajando en diplomacia en el Pacífico. No sólo nos protegería de los golpes, sino que mantendrá sus ojos alejados de la legislación antiterrorista."
 AST_our_capacity_for_peace: "Nuestra capacidad para la paz"
 AST_our_capacity_for_peace_desc: "Los esfuerzos de Rudd para conseguir un diálogo con los chinos realmente han dado frutos. Están dispuestos a negociar una iniciativa conjunta de mantenimiento de la paz en el Pacífico. Una oportunidad como esta no viene a menudo, y podría permitirnos demostrarnos como iguales a los chinos, definiendo futuras colaboraciones. Menos doblar la rodilla, más compartir un interés común en el mantenimiento del Pacífico."
 AST_off_to_delhi: "Fuera a Delhi"
 AST_off_to_delhi_desc: "El uranio sigue siendo nuestra mayor reserva mineral sin explotar, y nuestras empresas están ansiosos de conectarse con un nuevo socio exportador antes de comenzar la perforación. Por todas las apariencias India es el cliente obvio. Una superpotencia emergente en Asia meridional lo suficientemente fuerte como para afirmar su propia voluntad en el Mar Arábigo. Podrían ser un aliado muy útil a medida que crece nuestra esfera, o al menos un importador fiable de nuestro uranio."
 AST_marks_gambit: "Mark Gambit"
 AST_marks_gambit_desc: "Desde la independencia de Singapur, la relación que compartimos no ha sido más que cordial. Es natural que tomemos los siguientes pasos. Nuestro fideicomisario Mark Vaile ha estado trabajando en el primer serio acuerdo comercial bilateral que les hemos ofrecido en dos décadas. Simultáneamente ha estado haciendo overtures a Tailandia con un acuerdo similar para el libre comercio arancelario mayoritario. Liberar el movimiento de mercancías dentro y fuera de Australia ha sido un inquilino básico para nuestra reelección, y mientras que el partido tratará de sacar tanta publicidad como sea posible, el pueblo australiano recogerá los beneficios."
 AST_fossil_fuels_for_yuan: "Fósil de combustible para Yuan"
 AST_fossil_fuels_for_yuan_desc: "Nuestra diplomacia con China se ha ido sin un hitch. Sus esfuerzos latentes para industrializar rápidamente les ha dado un hambre de carbón, que es afortunadamente algo que somos abundantes. Hacer un trato con ellos parece una victoria, y podría hacernos un socio comercial más atractivo a otras naciones asiáticas."
 AST_partner_with_the_japanese: "Socio con el japonés"
 AST_partner_with_the_japanese_desc: "El comercio asiático está superando rápidamente la de nuestras conexiones en Europa. Derecha para que nuestros intereses hayan cambiado mucho más a nivel local. En el negocio los japoneses son algunos de los adversarios más tímidos que puedes encontrar. Igualmente diplomáticamente. Están abiertos a recibir nuestras exportaciones agrícolas a cambio de concesiones por nuestra parte. La reducción de tarifas en su electrónica y coches era una petición obvia, pero sospechamos que pedirán más."
 AST_to_promote_our_spirit: "To Promote Our Spirit"
 AST_to_promote_our_spirit_desc: "Nuestros esfuerzos en el extranjero han pagado bien. Más están viendo a Australia en una nueva luz, y viéndonos como un socio importante en el Pacífico. El pueblo también debe ver nuestros logros, y celebrar el espíritu australiano por lo que es. Podemos financiar una serie de anuncios televisivos y publicaciones en línea para promover nuestra nación, duplicando como marketing turístico. Tampoco va a doler poner el logotipo de nuestra fiesta en la esquina inferior. Es lo menos que podemos conseguir para nuestras búsquedas."
 AST_the_coalition_convention: "La Convención de la Coalición"
 AST_the_coalition_convention_desc: "La convención es a menudo donde las carreras vienen a morir, ya que sus discursos y súplicas de relevancia no se encabezan, y la otra persona es elegida el próximo líder para la coalición. A veces, sin embargo, la perseverancia paga. Ahora la coalición ya tiene un líder lo suficientemente fuerte como para tomar el mando, y esta vez es simplemente una cuestión de hacer un buen discurso."
 AST_wholesale_economics: "Al por mayor Economía"
 AST_wholesale_economics_desc: "El término mayorista generalmente está acreditado a los minoristas o empresas, pero algunos han utilizado el término para describir el acto de privatizar activos del gobierno. No hemos sido despiadados con nuestro raspado de ineficiencias del gobierno. Apenas. Es por eso que deberíamos hacer un poco de esfuerzo. Hay muchas agencias para que trimemos, y un montón de ingresos si podemos encontrar los licitadores adecuados. En la parte trasera hay algunas posibilidades de inversión en nuestros sectores laborales que, si escogemos sabiamente, no pondrán una abolladura en nuestro buen ingreso."
 AST_finalize_the_telstra_sale: "Finalizar la venta de Telstra"
 AST_finalize_the_telstra_sale_desc: "La venta de Telstra ha sido un ordeal plurianual para los contadores del gobierno cargados de desenredar todos los elementos corrobos que habían llegado a ser una carga para nosotros para manejar. ASX nos ha ofrecido un acuerdo más que justo para los activos restantes, y cualquier racionalista económico tendría esta finalización antes de cambiar su mente, lo cual es lo que tenemos la intención de hacer."
 AST_allow_foreign_interests: "Permitir los intereses extranjeros"
 AST_allow_foreign_interests_desc: "Como lo hizo Faust, a veces necesitas hacer un trato con el diablo. Los optimistas en el parlamento pueden tener que creer que Australia puede sobrevivir por su cuenta. Que de alguna manera esta nación insular puede ser autosuficiente ante la globalización. Están equivocados. Nuestras industrias sólo pueden durar si permitimos que el capital extranjero accione nuestro dólar-hungry-machine de una economía, y los medios de comunicación no son diferentes. Si es para sobrevivir necesita inversión."
 AST_crush_the_unions: "Aplastar a los Sindicatos"
 AST_crush_the_unions_desc: "La presencia del sindicato en nuestra economía e incluso en nuestra política ha crecido demasiado y con demasiada fuerza a partir de los últimos años. Ninguna organización como la suya debe estar sumida en cualquiera de nuestros asuntos, mucho menos los de nuestros trabajadores.La Ley de Workchoice pretende enmendar ese desprecio y despojar a los sindicatos de su presencia en las fábricas. No les echará completamente fuera, pero dará a los dueños de negocios una oportunidad de lucha."
 AST_carve_up_medicare: "Carve Up Medicare"
 AST_carve_up_medicare_desc: "Algo a lo que nunca llegamos en nuestro primer mandato fue reexaminar la medicare. El programa admite que muchos australianos cuentan con servicios médicos fiables y de estado del arte gratuitamente, pero sí parecen estar aprovechando esa oferta. Las ineficiencias que azotan el programa también han desembocado en su costo bajo la mala gestión del trabajo. Como un cuchillo bien afilado, podemos cortar la grasa que está colgada por demasiado tiempo."
 AST_broadband_blueprint: "Plano de banda ancha"
 AST_broadband_blueprint_desc: "Tenemos la tecnología. Podemos reconstruir nuestra infraestructura de red para permitir a todos los australianos el estado de los servicios de internet de arte para empresas y hogares por igual. Si aplicamos lo que sabemos y trabajamos para implementarlo en la infraestructura actual, podríamos desarrollar un plan para implementarlo a nivel nacional en un período muy corto de tiempo."
 AST_curb_outside_interference: "Curb Interferencia externa"
 AST_curb_outside_interference_desc: "Abrir el mercado y la economía australiana al resto del mundo ha sido un boón hasta ahora, pero hay una cierta línea que dibujamos cuando manejamos la nación. Aprobar la inversión extranjera es el pan y la mantequilla de negocio en la mayoría de las industrias, excepto para los medios. El efecto que Kerry Packer ha tenido en nuestros medios de comunicación no puede ser exagerado, y podemos imaginar con astucia qué tipo de interés extranjero peor podríamos estar invitando si las puertas se abrieron. Por ahora mantenemos las puertas cerradas."
 AST_bat_for_the_battlers: "Bat para los Battlers"
 AST_bat_for_the_battlers_desc: "Australia nunca debe ser una nación definida por la clase o la envidia, sino unida por el compañerismo y los logros. Nuestros luchadores, los australianos de clase media, nos han llevado a la meta más veces que no. Es justo que les devolvamos un poco en el lugar de trabajo. Sin dejar que se egreguen con las demandas, le daremos una oreja a los sindicatos para implementar algunas políticas poco significativas. Los que realmente cuentan."
 AST_back_australias_ability: "La habilidad de Australia"
 AST_back_australias_ability_desc: "Nuestro «crecimiento de la crema» política económica sabia ha sido el programa de habilidad de Australia atrás. Un programa de renovación expansivo para impulsar nuestras principales obras de construcción durante un período de cuatro años, que debería reducir drásticamente el desempleo y devolver una gran cantidad de fondos fiscales que hemos absorbido de nuevo a la circulación."
 AST_feel_the_heef_ast: "Siente el HEEF"
 AST_feel_the_heef_ast_desc: "El Fondo de Dotación de Educación Superior es uno de nuestros recientes proyectos de ley de política destinados a embalar la inversión en instituciones de educación superior y nuestros sitios de R&D. Inicialmente vamos a ser los únicos que invierten en el fondo, pero eventualmente está destinado a engañar de nuevo al gobierno, de alguna manera. Todo suena como un poco de toro, pero si ambas partes lo respaldan podría haber algo que valga la pena."
 AST_if_we_build_it: "If We Build It"
 AST_if_we_build_it_desc: "Nuestra promesa de reelección de construir 21 nuevos hospitales ha surgido debido, y los costos han aumentado lamentablemente desde nuestras estimaciones anteriores. Nuestros expertos fiscales han recomendado subcontratar la construcción al sector privado, que todavía nos costará mucho. En la parte de arriba podríamos estar ahorrando en los costos médicos públicos con todas las nuevas instalaciones."
 AST_australian_made: "Australiana Made"
 AST_australian_made_desc: "El logotipo de Australian Made fue una de nuestras estrategias de marketing más exitosas que el gobierno hizo. El icono era fácil de reconocer, y más gente compraba local debido a ello. Ahora el gasto público se ha derrumbado, y es difícil elegir local sobre importaciones baratas desde Vietnam o China. Si aumentamos la campaña de marketing para apuntar no sólo localmente, sino en el extranjero, a decir que Australian Made es una garantía de calidad, podemos encontrar una nueva vía para ellos."
 AST_preserve_the_old_forests: "Preservar los bosques antiguos"
 AST_preserve_the_old_forests_desc: "Uno de nuestros orgullos y alegrías ha sido los bosques antiguos en Tasmania. Cuenta con algunos de los árboles de flores más altos del mundo, incluso con más de 90 metros! Es un tesoro para contemplar, y tan importante para esta nación como el Gran Arrecife en mucho sentido. Extender las protecciones actuales a 170.000 hectáreas adicionales debe hacer bien para prevenir su pérdida, sin sofocar nuestra industria maderera."
 AST_ets: "Emisiones comerciales"
 AST_ets_desc: "Otra parte de la legislación climática que hace noticias en Parliment es el 'Emissions Trading Scheme.' De alguna manera el trabajo sigue concocting estas cosas, y por alguna razón hay algunos en la escucha del partido. En este momento nos han ofrecido un softbol para preparar el esquema con una serie de subvenciones hacia el desarrollo de la energía nuclear. La energía nuclear no es algo que estamos apoyando actualmente, pero no podemos matarlo en la cuna, y si podemos conseguir algo de ellos para suavizar los loones climáticos a nuestra política, lo tomaremos."
 AST_the_new_liberals: "Los Nuevos Liberales"
 AST_the_new_liberals_desc: "Te guste o no, la fiesta ha cambiado. Ya no somos los pequeños «i» liberales de los 90, sino una fuerza profesional para los valores tradicionales. Hemos mezclado con éxito el liberalismo económico con el conservadurismo fiscal. La realidad de las cuestiones geopolíticas está siendo reconocida y tratada, y los australianos se están quedando con más en su bolsillo y menos yendo a impuestos. Francamente la nación es mejor para ello, y lo estamos disfrutando con el apoyo de los votantes principales. La dirección que movemos ahora el partido podría hacer o romper nuestro impulso, pero también tendrá efectos resonantes para las generaciones que confían en nuestra mano de guía."
 AST_keep_them_in_line: "Keep Them In Line"
 AST_keep_them_in_line_desc: "Nuestro partido ha estado plagado de golpes conspirantes e internos por mucho tiempo. ¿Cómo puede el público tener confianza en nuestra coalición si ni siquiera confiamos en nosotros mismos? Tendremos que «reestructurar» el código del partido para los desafíos de liderazgo y restringir la práctica a las circunstancias más difíciles. Sólo será necesario alentar a unos pocos nacionales para apoyar el cambio."
 AST_secure_the_coalition: "Asegurar a la Coalición"
 AST_secure_the_coalition_desc: "Mientras no siempre vemos ojo a ojo, nuestros amigos nacionales han caminado la línea con nosotros durante casi un siglo. Nos gustan esos guisantes en la cápsula. Es poco probable ahora, pero una división de coalición condenaría a nuestros partidos a no volver a ganar otra elección federal. Algo así no debería dejarse al destino. Reescribir las cláusulas para una división para que sea virtualmente imposible para cualquier lado las mantendrá en nuestras gracias, buenas o no. Entonces realmente estaremos unidos, en espíritu y escritos en piedra."
 AST_entice_crossbenchers: "Entice Crossbenchers"
 AST_entice_crossbenchers_desc: "Nuestro sistema político se ha empeñado en el trabajo de los cruzados durante décadas. Los a menudo sin espina dorsal nos han ayudado a pasar algunas facturas a lo largo de nuestro tiempo, cambiando de una y otra vez entre apoyarnos y la oposición, o sentados completamente. Algunos sólo necesitan un regalo o dos para traerlos de vuelta en la línea. Unos pocos apretones de manos aquí, un poco de inversión allí, y haremos suficiente de ellos leales."
 AST_broaden_our_beliefs: "Ampliar nuestras creencias"
 AST_broaden_our_beliefs_desc: "Es casi estereotipado decir que nuestra fiesta ha estado atrapada en el barro con respecto a nuestras creencias. Después de todo, somos tradicionalistas, es una postura razonable. La desventaja de esto es que podemos estar perdidos en una política valiosa que no todo el partido apoya. Tal vez sea hora de sentarnos y hablar las cosas con las fiestas más pequeñas. Podríamos aprender una o dos cosas."
 AST_axe_the_governor_general: "Axe el Gobernador General"
 AST_axe_the_governor_general_desc: "El referéndum republicano podría haber fracasado en 99, pero eso no significa que necesitemos un representante de un país a medio camino por todo el mundo entrometiendo en nuestra toma de decisiones. Ya han despedido a uno de nuestros líderes antes, pueden hacerlo otra vez. Es hora de despedirlos. Al revisar sus cabezas y directamente a la Reina hacemos formalmente la petición, con un par de «reportos» de mala praxis para apoyarnos, y deshacernos de ellos nosotros mismos."
 AST_our_own_kings: "Nuestros propios reyes"
 AST_our_own_kings_desc: "Ahora que la monarquía se está moviendo para encontrar un reemplazo, podemos empezar a utilizar los procesos actuales para moler la transición tanto como sea posible. Estarán nadando en un mar de disputas legales e indagaciones oficiales hasta que sean años antes de que puedan jurar en otro, y tendremos libre reinado sobre nuestras políticas, sin ojos de la corona."
 AST_prepare_the_successor: "Prepare el Sucesor"
 AST_prepare_the_successor_desc: "A veces es mejor acabar con las cosas mientras son buenas. Hice una promesa durante el mandato anterior de que bajaría antes de la próxima elección. Esa oportunidad vino y se fue, pero no es demasiado tarde para colgar el sombrero y preparar al próximo líder para llevarnos adelante. Recuerdo haber luchado para llegar aquí, y ahora estoy considerando dejarlo ir."
 AST_peace_with_honour: "Paz con honor"
 AST_peace_with_honour_desc: "Y el futuro del Partido Liberal fue decidido..."
 AST_the_sydney_declaration: "La Declaración de Sydney"
 AST_the_sydney_declaration_desc: "La declaración fue redactada originalmente y debe presentarse como el compromiso de Australia para satisfacer las demandas del cambio climático del mundo en la APEC. Sin embargo, sirve un propósito más grande que la virtud señalmente a nuestros amigos orientales que somos progresistas en nuestras causas. La propia declaración demuestra el peso que usamos en la acción diplomática. Anuncia que Australia está dispuesta a colaborar con el mundo, y que tenemos el efecto de causar un cambio real cuando lo hacemos. Puede que apenas nos deshagamos en la parte superior 10, pero estamos aquí ahora, y sólo estamos moviéndonos."
 AST_the_quad: "El Quad"
 AST_the_quad_desc: "Las conversaciones con Japón y la India sobre el socorro en casos de desastre han sido fructíferas hasta el punto en que están insinuando un canal más permanente para las discusiones diplomáticas. El vicepresidente de EE.UU. incluso ha sido favorable a la idea de formar el pacto para ordenar y supervisar las recientes acciones de China en el Pacífico. Finalmente el nombre 'Diálogo de Seguridad Cuadrilateral' se estableció en, pero por ahora estamos nicknaming it the 'Quad.'"
 AST_negotiate_with_our_northern_neighbours: "Nuestros vecinos del norte"
 AST_negotiate_with_our_northern_neighbours_desc: "Nuestra historia con Papua Nueva Guinea ha sido muy positiva en estas últimas décadas, a pesar de unos cuantos hipos aquí y allá. Ellos han permanecido uno de nuestros mayores socios comerciales para el caucho, y mantener ese arreglo se ha convertido en una cuestión de seguridad nacional. Hemos invitado a su Primer Ministro para ayudar a resolver un arreglo de ironclad."
 AST_anzus_collaboration: "ANZUS Collaboration"
 AST_anzus_collaboration_desc: "El Tratado de ANZUS ha tenido, sin duda alguna, sus momentos rocosos. No fue todo eso hace mucho tiempo cuando Nueva Zelanda técnicamente consiguió la bota después de negar a los submarinos nucleares de EE.UU. entrar en sus puertos. Sin embargo las cosas han resultado, el tratado es algo como un vínculo fraternal entre nosotros. A pesar de lo lejos que la política estadounidense ha ido de Europa y hacia el Oriente Medio; si están ahí, estamos allí. Nuestro enfoque podría alejarse de los locales, pero es todo un esfuerzo global de todos modos."
 AST_an_american_treaty: "Un Tratado Americano"
 AST_an_american_treaty_desc: "Como tal vez la economía más grande del mundo, nuestro imperativo, fuera de la obvia ventaja de seguridad, ha estado manteniendo vínculos económicos con los Estados Unidos. No son una nación fácil de alterar, especialmente porque ya han invertido tanto en nuestro país. Aunque ocasionalmente recompensar su apoyo nunca ha dolido, y ciertamente les recompensamos con un acuerdo comercial prioritario."
 AST_howard_of_arabia: "Howard of Arabia"
 AST_howard_of_arabia_desc: "Australia sigue siendo una nación cristiana mayoritaria. Nuestra moral está en sus orígenes en el Oriente Medio. Israel ha sido uno de nuestros socios más fuertes por décadas, y han demostrado su determinación para la democracia basada en principios una y otra vez. No podemos dejarlos secar cuando nos necesitan. Una pareja más fuerte con ellos es nuestro imperativo religioso."
 AST_keep_security_regional: "Mantener la seguridad regional"
 AST_keep_security_regional_desc: "Por mucho que nos hemos movido con la acción en el medio este, nuestras prioridades siempre han sido para nuestros vecinos inmediatos. Las naciones de la isla del Pacífico nos buscan por su seguridad ahora, y como deberían. Australia tiene la obligación moral de mantenerlos a salvo y libres de elementos radicales mientras crecemos como poder regional. Nuestras búsquedas con ellos deben representar esto."
 AST_preventative_measures: "Medidas preventivas"
 AST_preventative_measures_desc: "No te pones las botas después de que la serpiente te muerda. Cuando estás en el arbusto lo primero que te aseguras de tener es tus botas, y el segundo es un palo grande. Esa noción, tan cruda como es, debe ser utilizada cuando se trata de nuestra defensa en el extranjero. No vamos a salir con las manos vacías, y no vamos a dejar a nuestros vecinos en riesgo sin un poco de protección."
 AST_dissuade_the_middle_kingdom: "Reclamaciones en Papua"
 AST_dissuade_the_middle_kingdom_desc: "Nuestro dominio en la región depende de evitar que Indonesia nos supere geopolíticamente, y es una situación que puede ser más fácil de manejar si los aíslamos. Los nacionalistas de Papua Nueva Guinea nos han pedido que reconozcamos su reclamación por Guinea Occidental desde hace años. Reforzar una tensión fronteriza entre ellos podría ser lo que necesitamos para salvar la amistad, y acercar a PNG al pliegue."
 AST_the_indonesian_ultimatum: "Indonesio Ultimatum"
 AST_the_indonesian_ultimatum_desc: "El conflicto con Indonesia se ha convertido en una ocurrencia común a finales. No importa nuestra postura, o el alcance de nuestra colaboración, no pueden parecer graparse con los elementos radicales dentro de la nación. Podemos darles un ultimátum que nos permite enviar nuestra propia operación de mantenimiento de la paz a Aceh y ocupar efectivamente la región hasta que pueda gestionarse como una nación independiente. Lo hemos hecho antes, con éxito, podemos hacerlo de nuevo. Si se niegan podemos usar todas las sanciones bajo el sol hasta que las recupere en la mesa."
 AST_a_visit_from_malaysia: "A Visit from Malaysia"
 AST_a_visit_from_malaysia_desc: "Pocas naciones han sido tan francas y genuinas con las comunicaciones como Malasia. Nos han visitado muchas veces de sus líderes a sus ministros inferiores, y las conversaciones comerciales siempre se han ido sin un hitch. Tal vez es nuestro patrimonio común de la Commonwealth, pero un profundo respeto ha crecido entre nuestras naciones. Esta vez las discusiones se han reducido en nuestras exportaciones agrícolas, lo que ha sido, por razones de seguridad, restrictivo. Probablemente pedirán que suavizamos las leyes."
 AST_peacekeeping_in_somalia: "Mantenimiento de la paz en Somalia"
 AST_peacekeeping_in_somalia_desc: "Aunque inicialmente prometedor, el gobierno de transición en Somalia ha estado en una posición tenue tras el conflicto del señor de la guerra, y el país se ha separado efectivamente. La crisis humanitaria en curso ha sido suficiente para que nos avisemos, y ahora el gobierno ha pedido una intervención externa. Podría ser una oportunidad para ejercer nuestro personal de mantenimiento de la paz sin involucrarse directamente en el conflicto."
 AST_the_coal_family: "La familia del carbón"
 AST_the_coal_family_desc: "Al igual que el sueño americano de los años 50, muchos australianos idílicos son una vida tradicional viviente de autodeterminación. Francamente probablemente inventan un buen pedazo de nuestra base electoral, ¿y por qué no? Es la forma en que animamos a las familias Aussie a vivir. Independiente y feliz. Podemos devolver el favor despojándonos en las políticas que impiden la construcción de viviendas, así como reducir unos pocos impuestos a la tierra para aliviar la carga. Nuestras familias no deben ser castigadas por poseer su propio pedazo de nuestra hermosa tierra."
 AST_the_abbott_government: "El Gobierno de Abbott"
 AST_the_abbott_government_desc: "A partir de hoy declaro que Australia está bajo nueva dirección y que Australia es una vez más abierta para los negocios. Abierto y liderado por un gobierno que maximiza el potencial de todos. No sólo los que votaron por nosotros. \n\nUn gobierno, en sus términos más simples, para todos y para muchos. Aquellos que los grandes Menzies describieron como ' elevadores, no inclinadores.' A las familias olvidadas serán atendidos. Los impuestos pesados se irán, los barcos serán parados, y el presupuesto volverá a estar en camino por un superávit como nosotros no hemos visto o escuchado antes. \n\nSin perder más tiempo, vamos a hacerlo."
 AST_expand_the_executive: "Ampliar el Ejecutivo"
 AST_expand_the_executive_desc: "Existe una paradoja entre nuestra misión de disminuir el tamaño del gobierno, al tiempo que aumentamos nuestra capacidad para hacer el trabajo. Cuando el capitán dirige el barco, sus llamadas deben dirigirse sin perder tiempo consultando a la totalidad del Parlamento."
 AST_honour_the_party: "Honor al Partido"
 AST_honour_the_party_desc: "Nuestro gabinete necesita reflejar el legado del partido si vamos a ser aceptados avanzando. El trabajo de John Howard para redefinir el Partido Liberal fue monumental en adaptarse a esta nueva era de la política moderna, y contratar personal de su gobierno trae una multitud de experiencias."
 AST_building_stronger: "Construcción más fuerte"
 AST_building_stronger_desc: "Entendemos en la médula de nuestros huesos que no puedes tener una sociedad sin economía para sostenerla y que no puedes tener una economía sin negocios que puedan sacar provecho. Asimismo, la confianza en la fuerza de nuestras finanzas ha alcanzado un punto bajo, a pesar de nuestro optimismo habitual. Nuestra tarea ahora es construirla de nuevo, y construirlo lo suficientemente fuerte para hacer que cualquier Ausie orgulloso."
 AST_the_advisory_council: "El Consejo Asesor"
 AST_the_advisory_council_desc: "Los liberales no deben ser vistos como el partido contra la reconciliación. Después de todo, fue Harold Holdt quien terminó la Política de Australia Blanca. Se formará un Consejo para mantenernos informados sobre los asuntos indígenas, y mantener la narración centrada en cambios prácticos."
 AST_cut_the_programs: "Axe los programas"
 AST_cut_the_programs_desc: "No podemos subvencionar sin fin a las comunidades remotas que no contribuyen a los esfuerzos de reconciliación del gobierno. Las comunidades indígenas que reciben financiación, y no remolquen la línea tendrán sus presupuestos reducidos. Puro y sencillo."
 AST_its_the_constitution: "Es la Constitución."
 AST_its_the_constitution_desc: "Lo que tenemos que hacer ahora es acabar con el silencio que se hace eco en nuestra constitución, la omisión de los pueblos indígenas de la Constitución. Tal sentimiento requiere tomar decisiones fuera del Parlamento, con un referéndum para reconocer a los aborígenes e isleños del Estrecho de Torres como nuestros primeros pueblos naciones."
 AST_compete_on_the_farms: "Compete On the Farms"
 AST_compete_on_the_farms_desc: "La agricultura Ma y Pa ha sido la columna vertebral del sector agrícola de este país desde su federación. Las granjas de Tasmania a Australia Occidental, dirigidas por generaciones de Aussies, están siendo exprimidas por grandes corporaciones. No podemos seguir siendo competitivos sin importar a nuestros agricultores mediante préstamos accesibles y mejoras en el suministro de agua. Nuestra política necesita priorizarlos manteniendo independientes."
 AST_develop_the_northern_territory: "Desarrollar el Pan Bowl"
 AST_develop_the_northern_territory_desc: "Se ha presentado un plan para varios proyectos de desarrollo del Territorio del Norte encaminados a construir el Estado en una central industrial y agrícola. Al firmarlo vamos a cultivar un estado generalmente ignorado por gobiernos anteriores, y potencialmente crear el cuenco de pan para Australia y el Pacífico durante décadas venideras."
 AST_getting_in_there: "Entrando ahí"
 AST_getting_in_there_desc: "Desafortunadamente los caminos entrando y saliendo de NT han caído en un estado triste. Además de eso, la línea ferroviaria Ghan tendrá que ser actualizada para apoyar los materiales entrando."
 AST_funnel_in_workers: "Embudo en los trabajadores"
 AST_funnel_in_workers_desc: "mano de obra va a ser necesario para poner en marcha nuestras operaciones. Nada que pocos visados preferenciales y subsidios de reubicación no puedan arreglar."
 AST_project_manton: "Proyecto Manton"
 AST_project_manton_desc: "La presa Manton solía ser el principal suministro de agua y electricidad en la región para Darwin construyó su propia presa. Los costos de renovación y reactivación de la presa para abastecer a las comunidades cercanas están sorprendentemente dentro del presupuesto, y demostrarían tangible nuestro compromiso de construir NT."
 AST_compassionate_government: "Una feria."
 AST_compassionate_government_desc: "En este país, si tienes que ir, tendrás una oportunidad. Eso también podría ser el mantra del partido bajo nuestra dirección. Nuestro pueblo debe ser recompensado por su esfuerzo, y para aquellos que no están en el mejor lugar para empezar les apoyaremos con una mano de ayuda ligera. Eso no es derecho, eso es justicia."
 AST_keep_the_fire_burning: "Mantenga el fuego quema"
 AST_keep_the_fire_burning_desc: "El agujero que el bienestar está ardiendo en la cartera del gobierno nos hundirá si no conseguimos un mango. Al mismo tiempo, los programas están empezando a tener resultados positivos serios en nuestra población. Si nos detenemos cortos ahora podría deshacer los años del trabajo que se ha llevado a. En su lugar, tendremos que recortar algunos fondos para cubrir los costos actuales y esperar que Keynes tuviera razón a largo plazo."
 AST_national_curriculum_review: "Examen del programa"
 AST_national_curriculum_review_desc: "Aparte de los habituales prejuicios políticos que se arrastran a nuestros planes de estudios, parece que la financiación pública se ha estancado en excluir nuestras escuelas rurales. Cada escuela de Australia merece un tiro justo, y cada estudiante una educación que cuenta con el éxito de la civilización occidental, no sólo los problemas. Todos deberíamos estar orgullosos de la nación en la que crecimos, y del sistema educativo en ella."
 AST_another_baby_boom: "Otro Bebé Boom"
 AST_another_baby_boom_desc: "El amor es algo hermoso. Nuestro gobierno lo sabe más que la mayoría. Durante la elección prometimos una revisión de la licencia parental pagada, proporcionando a las nuevas madres 26 semanas de licencia a la par con su salario. Se ha levantado mucha presión en el partido, pero poner a las madres de nuestra nación primero es la prioridad más grande."
 AST_responsible_governance: "Gobierno responsable"
 AST_responsible_governance_desc: "El gasto imprudente en nuestro gobierno está prácticamente apostando por una crisis presupuestaria. La mayor responsabilidad del partido gobernante es tomar decisiones difíciles. No podemos seguir pagando el préstamo de casa con la tarjeta de crédito."
 AST_the_welfare_bloat: "No es tal sociedad"
 AST_the_welfare_bloat_desc: "El bienestar público es simplemente demasiado fácil de acceder al sistema existente. Cualquiera con mala suerte y una mala espalda puede obtener los beneficios completos de Centrelink y Medicare. El nivel de entrada debe ser ajustado, y algunos programas sin necesidad van a ser eliminados si vamos a llegar a cualquier lugar con la reducción en la hinchazón del presupuesto."
 AST_cashless_welfare: "Cashless Payments"
 AST_cashless_welfare_desc: "Con los juicios en las comunidades del Territorio del Norte, estamos seguros de que es factible una pequeña escala. Reemplazar depósitos directos con tarjetas bancarias hechas por el gobierno, y mantener gastos limitados esenciales va a mantener a los vulnerables de nuestra comunidad fuera de los casinos o se desmayó en las calles."
 AST_up_the_gst: "Uno más impuestos"
 AST_up_the_gst_desc: "La mayor reforma a nuestro sistema tributario ocurrió hace sólo unos años, pero ya ha tenido enormes beneficios para el país. Mientras que controvertidos en ese momento, nuestros negocios ahora disfrutan de un sistema más simple y los ingresos añadidos han financiado nuestros programas más costosos. Aumentarla sólo un toque va a romper con los dolores presupuestarios que enfrentamos actualmente."
 AST_national_audit_commission: "Comisión Nacional de Auditoría"
 AST_national_audit_commission_desc: "El gasto desperdicio en el gobierno se ha convertido en la pólvora debajo de sus botas en términos de lo difícil que es deshacerse. La creación de una comisión de una vez en generación dedicada a aclararla en toda la administración es el mejor curso de acción. Todo estará en el bloque de cortar."
 AST_investigate_union_corruption: "Guerra con los sindicatos"
 AST_investigate_union_corruption_desc: "Que los tabloides sepan que estamos declarando guerra contra el mal. Declarar la guerra contra la corrupción, y declarar que hay ciertas normas en nuestra sociedad. Si eres oficial de la compañía o funcionario sindical, tienes que obedecer la ley."
 AST_the_energy_crisis: "La crisis energética"
 AST_the_energy_crisis_desc: "La obsesión con la protección del clima nos ha disparado en el pie justo a la puerta de un armageddon energético. Incluso cuando podemos controlarlo, las demandas de nuestro pueblo no están siendo satisfechas, y el costo creciente ha puesto más en peligro financiero que cualquier otra crisis que esta nación haya enfrentado. Nuestro gobierno necesita poner nuestro pie en el tema de una vez por todas."
 AST_duttons_plan_focus: "Plan de Dutton"
 AST_duttons_plan_focus_desc: "Nuestro ministro de salud, Peter Dutton, ha sumido sus pies en nuestro debate energético con una solución que se inclina por decir lo menos. Retirar las restricciones nucleares de Australia para permitir que se construyan centrales eléctricas y corregir la escasez de energía de una vez por todas. Hemos disfrutado de unas buenas décadas apartándose de la perspectiva de ello, y por buena razón, pero podría ser la solución drástica que estamos buscando."
 AST_look_below: "Mira abajo"
 AST_look_below_desc: "La respuesta a todos nuestros problemas siempre ha estado bajo nuestros pies. Los Greenies lo temen, el Trabajo lo ignora, pero la Coalición lo respeta. Ninguna fuente renovable va a reemplazar a nuestro Dios dada fuente de poder, cultivada para nosotros desde la muerte de los dinosaurios."
 AST_build_it: "Construirlo"
 AST_build_it_desc: "Uno de los beneficios del poder del carbón es la belleza de él. Tenemos algunas de las mejores plantas de gas natural de este lado del mundo, y mucho más agradable que esas turbinas fuertes y feas. Al activar medidas de emergencia AEMO para adquirir más generadores y construir nuestras propias plantas, podemos construir algo más en un período muy corto."
 AST_deny_it: "Negarlo."
 AST_deny_it_desc: "Un malestar espiritual ha estado sacudiendo la moral y la ambición de lo que una vez fue un país que no puso límites a lo que podía lograr. Las concesiones al cambio climático han absorbido nuestra generación de energía, al tiempo que incrustamos a nuestros vecinos para recoger la industria que hemos perdido. No podemos devolver el reloj, pero podemos quitar las cadenas."
 AST_friend_of_the_mines: "Friend Of the Mines"
 AST_friend_of_the_mines_desc: "Después de una charla con nuestro amigo en Newscorp, está claro que la presión sobre nuestras corporaciones mineras podría ser un poco más ligera. Comenzando con cambiar nuestro enfoque de los derechos mineros."
 AST_light_on_the_hill: "A Light On the Hill"
 AST_light_on_the_hill_desc: "Australia ha sido un faro de luz como democracia en el Pacífico durante décadas, y ahora es una luz literal. Los australianos podrán descansar fácilmente con acceso a la electricidad, calefacción y refrigeración asequibles y abundantes viviendas en todo el país. Un testamento para los logros de nuestro gobierno, y el progreso que hemos hecho como nación."
 AST_acquire_enrichement: "Pequeñas rocas verdes"
 AST_acquire_enrichement_desc: "Es una cosa vergonzosa que extraemos tanto de las cosas, y sin embargo no tenemos instalaciones de enriquecimiento para realmente utilizarlo. Podemos importar y reunir rápidamente a uno de nuestros amigos en los estados, al tiempo que pasamos por algunas recomendaciones para levantarlo y correr oportunamente."
 AST_convert_the_ansto_reactor: "Convertir el reactor ANSTO"
 AST_convert_the_ansto_reactor_desc: "Evidentemente ya tenemos un reactor en Sydney. Seguro que podría no ser el modelo exacto que necesitamos para generar energía, pero podemos romper los ruidos de algunos de nuestros jefes científicos para conseguir la cosa lista para la salida. No es exactamente ciencia de cohetes después de todo."
 AST_tweak_the_restrictions: "Held Back No More"
 AST_tweak_the_restrictions_desc: "Mucho está reteniendo al país de la energía libre de emisiones. En particular, las voces verde-céntricas que establecen varias «zonas libres nucleares» en toda la articulación. Como cuestión de emergencia nacional, las zonas tienen que ir."
 AST_first_stop_jakarta: "Primera parada Yakarta"
 AST_first_stop_jakarta_desc: "Podemos comenzar nuestro mandato enviando un fuerte mensaje de que la política exterior de Australia se mantiene regional. No podemos darnos el lujo de dar un paso por Europa cuando las naciones aquí necesitan nuestra ayuda más que nunca. Menos Ginebra, más Yakarta."
 AST_sail_steady: "Velero Steady"
 AST_sail_steady_desc: "Julie Bishop, nuestra canciller, ha enfatizado el enfoque de la «diplomacia económica» para nuestro término, centrándose en programas continuos de ayuda y esfuerzos de libre comercio. Francamente no es demasiado disimilar para los gobiernos que tenemos ante nosotros, pero cuando millones de vidas están en sus manos es mejor no sacudir el barco."
 AST_the_anglosphere: "La Anglosfera"
 AST_the_anglosphere_desc: "Australia tiene un patrimonio indígena, una fundación británica y un carácter multicultural. Como tal nuestra conexión con los ingleses es tan cercana como los hermanos. Hablamos el mismo idioma, amamos a nuestro rugby y luchamos por los mismos ideales democráticos. Nuestra comunión es tan sagrada como ellos vienen, y así debe permanecer de esa manera."
 AST_o_canada: "O Canada!"
 AST_o_canada_desc: "Nuestros hermanos del Commonwealth. Tan lejos y sin embargo nuestros lazos van tan profundo como el de dos viejos amigos. No dolería tocar la base y discutir la oportunidad de inversión que nuestros diplomáticos han estado cocinando."
 AST_swell_the_support: "Soñar el soporte"
 AST_swell_the_support_desc: "No es ningún secreto que nuestro reclutamiento de defensa se ha derrumbado desde los 90. Ampliar los requisitos de elegibilidad, campañas de reclutamiento y apertura de prácticas de defensa es un primer paso apropiado para cumplir nuestros roles obligatorios."
 AST_of_knights_and_dames: "Of Knights and Dames"
 AST_of_knights_and_dames_desc: "Los 'Knights and Dames of the Order of Australia' solían ser los más altos que podía otorgar para reconocer un servicio extraordinario al país. Como típico con la mayoría de los gobiernos del Trabajo, el título fue arrojado bajo su dominio. Mientras volvamos debemos restaurar un pedazo de nuestra herencia que no debería haber sido olvidada."
 AST_american_integration: "Integración Americana"
 AST_american_integration_desc: "Nuestros aliados a lo largo del Pacífico han flotado la idea de un ejercicio de entrenamiento conjunto durante algún tiempo. Los beneficios de poder utilizar nuestro nuevo equipo solo en un entorno práctico serían inestimables para nuestras fuerzas, y podrían mantenernos más cerca del conocimiento con Estados Unidos."
 AST_square_kilometre_array: "Cuadrado Kilometre Array"
 AST_square_kilometre_array_desc: "En una puja entre nosotros y Nueva Zelanda para ser parte del proyecto, como se esperaba, ganamos. Entre nosotros, Sudáfrica y el Reino Unido, llegamos a ser parte de los proyectos astronómicos más ambiciosos en nuestra vida. Nuestro trabajo es construir más de 130.000 antenas tipo árbol sobre un área de 21 km. En teoría nos permite explorar el cielo más de 10.000 veces más rápido de lo que podemos ahora. Es toda muy alta tecnología, y es una oportunidad emocionante para nuestros científicos en el campo."
 AST_joint_defense_tech: "Tecnologia de Defensa Conjunta"
 AST_joint_defense_tech_desc: "La alianza Five Eyes se ha convertido en uno de nuestros activos más fuertes en la guerra contra el terror, y en la reunión general de inteligencia que va a durar 60 años. Establecer una división de investigación sería lo suficientemente fácil, y ayudará a superar cualquier brecha tecnológica que exista entre nosotros."
 AST_the_submarine_corporation: "La Corporación Submarina"
 AST_the_submarine_corporation_desc: "En nuestros esfuerzos por apoyar a la flota con nuevos submarinos, el ASC viene a nuestra ayuda. El principal proveedor de construcción naval para nosotros desde los años 80, y recientemente nacionalizado, la empresa está a nuestra disposición."
 AST_new_columbo_plan: "Nuevo Plan Colombo"
 AST_new_columbo_plan_desc: "Tras la Segunda Guerra Mundial se aplicó el Plan Colombo para reconstruir una Asia devastada, ayudándola con el envío de nuestros expertos técnicos y permitiendo que los suyos estudiaran en nuestro país. Podemos aplicar de nuevo los mismos principios para asistir a una Asia nueva y en desarrollo, permitiendo que sus estudiantes cursen estudios en nuestras universidades con visados acelerados."
 AST_growing_demands: "Conocer el desafío"
 AST_growing_demands_desc: "Ningún gobierno puede ser económicamente responsable a expensas de la seguridad nacional. El ADF necesita estar siempre en una posición donde pueda responder a la llamada de cualquier conflicto. Cualquier cosa menos nos pone en un mal lugar."
 AST_visiting_the_rainbow_nation: "La Nación Arco Iris"
 AST_visiting_the_rainbow_nation_desc: "Hemos tenido una historia colorida con Sudáfrica, volviendo tan lejos como apoyar a sus tropas durante la Segunda Guerra Boer. Casi 200.000 de ellos viven en Australia, y el número sigue creciendo a medida que las solicitudes de refugiados se han inundado recientemente. A medida que las tensiones continúan calentando, la presión ha montado para que tomemos una postura sobre el problema."
 AST_indonesian_intervention: "Asegure el archipiélago"
 AST_indonesian_intervention_desc: "La situación en Indonesia se ha permitido deteriorar durante demasiado tiempo. Si bien nuestros esfuerzos en 1999 fueron, en general, un éxito, será necesario seguir participando en el país para hacer frente a la amenaza del fundamentalismo islámico."
 AST_an_oceanic_alliance: "Una alianza oceánica"
 AST_an_oceanic_alliance_desc: "Los asuntos de los del Pacífico son sentidos y manejados por nosotros aquí. Hemos tenido que confiar en el otro en más ocasiones que no, y ha cultivado una profunda unidad entre nosotros."
 AST_aukus_abbott: "AUKUS"
 AST_aukus_abbott_desc: "Nuestro compromiso compartido con el orden internacional basado en normas con el Reino Unido y los Estados Unidos de América es tan grueso como vienen. Hemos pasado por las trincheras en casi todos los conflictos importantes del siglo pasado. Por lo tanto, profundizar esa cooperación es el mejor camino hacia un mundo más seguro."
 AST_the_greatest_statesman: "El Mayor Estado"
 AST_the_greatest_statesman_desc: "La posición de Australia ha sido solidificada en el Pacífico. Una nación hermosa ya no es un observador del crecimiento de Asia, sino un participante activo en su ascenso. Los historiadores van a mirar atrás y ver que este era el punto que enviamos al país por el camino correcto."
 AST_the_asian_century: "El Siglo Asiático"
 AST_the_asian_century_desc: "A pesar de lo que los críticos podrían decir, no estamos entrando en Asia sin un plan. No se necesita mucha investigación para ver que los países del norte de Asia han logrado una transformación económica sin igual en la historia humana en sólo unas pocas décadas. Necesitamos señalar a las naciones que Australia está abierta para el negocio, y listo para nuestra parte de esa transformación."
 AST_our_greatest_partner: "Nuestro socio más cercano"
 AST_our_greatest_partner_desc: "China hizo una cosa milagrosa cuando sacaron a cientos de millones de personas de la pobreza y de la clase media. Asimismo, nuestra asociación con ellos continúa creciendo en algo mucho mayor que cualquier otra nación del Pacífico. A pesar de aquellos en el gobierno que instan a Australia a elegir entre nuestros intereses económicos y de seguridad, el hecho es que usted no hace nuevos amigos al perder viejos; y usted no hace algunas amistades más fuertes al debilitar a otros."
 AST_indian_investments: "Inversión india"
 AST_indian_investments_desc: "Algunas corporaciones indias han manifestado su interés en ampliar su fabricación en el país, y establecer una tienda en Sydney. Las restricciones actuales a las empresas extranjeras han frenado el proceso, pero una aprobación directa de la [GetASTLeaderTitle] sería todo lo que necesitarían para comenzar rápidamente y empezar a traer los empleos."
 AST_sanpou_yoshi: "Sanpo Yoshi"
 AST_sanpou_yoshi_desc: "Sanpo Yoshi es un antiguo término japonés que dicta que cada transacción debe beneficiar al vendedor, el comprador y la sociedad en general. Un «triple-win» si quieres. Nuestros acuerdos actuales con los japoneses en lo que respecta al comercio son todo menos una victoria. Existe un serio equilibrio comercial entre nosotros que, hasta que sea rectificado, está impulsando una cuña entre nuestras naciones."
 AST_seoul_refineries: "Refinerías de Seúl"
 AST_seoul_refineries_desc: "Desde la Guerra de Corea hemos mantenido vínculos muy estrechos con el gobierno surcoreano, militar y económicamente. Con el éxito de su nueva base industrial en Seúl, establecer un acuerdo con ellos para refinar nuestro propio petróleo nos ahorraría la molestia de hacerlo nosotros mismos, y conseguiría que las cosas funcionen mucho antes."
 AST_australian_exceptionalism: "Australian Exceptionalism"
 AST_australian_exceptionalism_desc: "En esta nación existe un conjunto único de virtudes. En lugar de un mandato divino o una cualidad inherente desenterrada, la nuestra se basa en las generaciones anteriores que han tomado las decisiones difíciles y los sacrificios para llevarnos al nuevo amanecer. Esa tradición debe continuar, y Australia se conservará a toda costa."
 AST_stop_the_boats: "Detén los barcos"
 AST_stop_the_boats_desc: "La cantidad de entradas ilegales y ahogamientos en el mar estimulados por los contrabandistas es la mayor crisis que la nación ha enfrentado en años. Nuestro especialista en fronteras, Scott Morrison, ha ideado una operación de estilo militar para mantener nuestras costas seguras y devolver la marea, con patrullas amplificadas y eliminando los visados de protección permanente para desincentivar a los saltadores que corren el riesgo."
 AST_raise_the_threat_level: "Aumentar el nivel de amenaza"
 AST_raise_the_threat_level_desc: "La amenaza del terrorismo se ha convertido tristemente en un hecho de vida, y lamentablemente hay algunos ciudadanos australianos y residentes que nos harían daño. Emplear más seguridad en aeropuertos, bases, edificios gubernamentales y grandes eventos públicos va a ser una necesidad."
 AST_tighten_the_flow: "Aprieta el flujo"
 AST_tighten_the_flow_desc: "La idea de Australia multicultural podría no haber fracasado, pero a nuestros niveles actuales el flujo es simplemente demasiado alto para ser un número sostenible. Considerando las necesidades de nuestros ciudadanos, endurecer ese flujo es el próximo paso."
 AST_prevention_measures: "Medidas de prevención"
 AST_prevention_measures_desc: "Una mano desmontada debe estar al volante cuando se trata de la intervención. El golpe correcto y decisivo puede detener una amenaza en su infancia. Al menos tener la opción de actuar cuando pueda mantenerlo disponible cuando más lo necesitemos."
 AST_wielding_the_stick: "Limpiando el palillo"
 AST_wielding_the_stick_desc: "Trabajando junto a uno de los mayores y más confiables productores de armas hemos organizado la construcción de dos nuevas plantas de fabricación, destinadas a abastecernos con las armas de hoy, para las batallas mañana. Es un lema, lo sé."
 AST_deployment_mandate: "Mandato de despliegue"
 AST_deployment_mandate_desc: "Nuestra rápida movilización para la preparación de combate se ha acelerado con unos pocos objetivos para asegurarnos de que estemos en el camino correcto. El éxito de ellos proporcionará la confianza que necesitamos para justificar el golpe repentino del gasto, y demostrar lo que somos realmente capaces."
 AST_employ_reserves: "Reservas para empleados"
 AST_employ_reserves_desc: "El deber principal de las reservas de nuestra nación incluye la asistencia durante desastres naturales y emergencias domésticas. Considerando que nuestra defensa es una emergencia doméstica, los emplearemos en cualquier área sin cumplir con nuestro personal de tiempo completo, liberando fuerzas para su despliegue."
 AST_let_them_serve: "Deja que ellos sirvan"
 AST_let_them_serve_desc: "La política actual de contratación es demasiado restrictiva para nuestros planes de expansión. Abrir el programa hasta las prácticas de defensa y ofrecer alivio de la deuda para aquellos que aplican obtendrán nuestros números de inflamación a los niveles requeridos."
 AST_incorporate_them: "Incorporar"
 AST_incorporate_them_desc: "Ya tenemos un programa sustancial destinado a poner a los asistentes sociales para trabajar en obras públicas. Ahora podemos redirigirlos a nuestras industrias militares, sacando algo del peso de nuestras fuerzas ADF."
 AST_a_shining_fleet: "Una Flota Luminosa"
 AST_a_shining_fleet_desc: "Desde el final de la guerra fría nuestra infraestructura naval se ha permitido desintegrar al punto de convertirse en una vulnerabilidad en nuestra defensa. Nuestra capacidad para construir barcos se ha disipado virtualmente. Comenzando con revivir nuestros muelles de propiedad estatal, el esfuerzo será dirigido por la infraestructura naval australiana recientemente organizada, y pronto nuestra nación volverá a las olas una vez más."
 AST_assistance_from_langley: "Asistencia de Langley"
 AST_assistance_from_langley_desc: "El tío Sam nos ha lanzado antes, si hacemos la solicitud seguramente estarán dispuestos a darnos una mano de ayuda en el departamento de inteligencia. Como dicen, saber es la mitad de la batalla."
 AST_our_fight: "Nuestra lucha"
 AST_our_fight_desc: "Nuestro viaje por delante es uno que debemos hacer por nuestra cuenta. No estrictamente por nuestra cuenta, por supuesto, pero necesitamos demostrar que Australia tiene la capacidad de armarse y luchar contra sus propias batallas. Somos una nación de hacedores después de todo."
 AST_asian_partnership: "Asociación asiática"
 AST_asian_partnership_desc: "Sólo eres la mitad de lo que eres sin tus amigos. Los países de Asia han sido más que amigos para nosotros a lo largo de los años, y Japón en particular ha estado con nosotros de la mano durante nuestro armamento. Hasta ahora hemos estado cocinando un acuerdo con ellos para comprar una serie de submarinos para remar nuestros números de la flota, y es primordial que lo veamos."
 AST_accelerate_the_timeline: "Acelerar la línea de tiempo"
 AST_accelerate_the_timeline_desc: "A medida que nuestra ventana de preparación llega a su fin, una producción de último minuto va a necesitar ser acelerada. Necesitamos cocinar nuestros huevos un poco más rápido."
 AST_in_our_backyard: "En nuestro patio trasero"
 AST_in_our_backyard_desc: "La marina real ha estado navegando por el Indo-Pacífico durante aproximadamente un siglo, desde su formación en 1911. Durante las dos guerras mundiales hemos aprendido algunas lecciones invaluables, incluyendo cómo proyectar la fuerza sobre estas costas. Esa experiencia se pondrá a prueba para los ensayos futuros."
 AST_counter_the_island_chain: "Contra la Cadena de la Isla"
 AST_counter_the_island_chain_desc: "Desde la década de 1940 China ha empleado una campaña de intimidación y acaparamiento de isla para solidificar su reclamo en el Mar del Sur de China. Mientras que la expansión era algo manejable en el pasado, su último éxito con las islas artificiales ha amplificado la amenaza. Si no bajamos el pie mientras podemos, cualquier lugar al norte de nosotros podría convertirse en el próximo «Mar de China Oriental»."
 AST_dealings_in_kuala_lumpur: "Dealings in Kuala Lumpur"
 AST_dealings_in_kuala_lumpur_desc: "El comercio mineral entre nosotros y Malasia ha aumentado hasta el punto de que sus diplomáticos se han puesto en contacto para discutir un acuerdo comercial. Potencialmente racionalizando un flujo de mercancías ya altamente rentable. Mientras lo hacemos, podríamos introducir términos para un acuerdo de neutralidad entre nosotros. Mantenerlos en contacto con la creciente esfera de China."
 AST_guadalcanal_garrison: "Guarnición de Guadalcanal"
 AST_guadalcanal_garrison_desc: "Tras el estallido de la Segunda Guerra Mundial y la posterior invasión de las islas Salomón por el Japón imperial, este intentó usar las islas como plataforma de lanzamiento para atacar nuestro país. Algunos de los combates más intensos se libraron en esas islas, y no podemos arriesgarnos a que otro país vuelva a ganar ese punto de apoyo."
 AST_mutual_defense: "Mutua Defensa"
 AST_mutual_defense_desc: "No podemos patrullar el Pacífico por nuestra cuenta, y uno de nuestros aliados más cercanos desde el final de la guerra fría, a pesar de la historia mixta, ha sido Japón. Cómo han remarcado, por así decirlo, no ha sido menos que admirable. Vamos a necesitarlos para que venga el conflicto."
 AST_due_reparations: "Overdue Reparations"
 AST_due_reparations_desc: "Mientras que la seguridad conjunta es fascinante, conseguir lo que se nos debe por WW2 es algo más alto en nuestra prioridad. Más de 27.000 australianos perdieron sus vidas, más del 64% de los cuales estaban luchando contra las fuerzas japonesas, y gastaron casi 3 mil millones de libras durante el curso de la guerra. Eso ni siquiera menciona el Bombeo de Darwin."
 AST_pukpuk_treaty: "El Tratado de Pukpuk"
 AST_pukpuk_treaty_desc: "Hemos estado dando consejos sobre la idea de una cooperación más estrecha en defensa con Papua Nueva Guinea desde hace años. La idea de combinar nuestros comandos militares presenta una oportunidad efectiva para contrarrestar la creciente esfera de influencia de China, y afirmar una influencia más directa en nuestro vecino amistoso."
 AST_the_indonesian_solution: "Tomando Indonesia"
 AST_the_indonesian_solution_desc: "Indonesia ha sido una espina en nuestro lado desde hace décadas, y el tiempo para las negociaciones ha terminado. Se requerirá una gestión directa. Restituiremos el orden a la región."
 AST_island_leasing: "Arrendamiento de islas"
 AST_island_leasing_desc: "Las islas de Nueva Caledonia se encuentran en una posición estratégicamente crucial en nuestro flanco nororiental. Ser capaz de colocar nuestras tropas allí nos permitiría crear una especie de muro de hierro alrededor de todo el Mar del Coral. Afortunadamente estamos en la posición donde podemos alquilar derechos de basing en las islas de nuestros amigos franceses."
 AST_the_middle_power: "El Poder Medio"
 AST_the_middle_power_desc: "Conseguir a Corea del Sur de nuestro lado produciría un «cabeza de las brasas», por así decirlo, en China. Un cuchillo justo en el intestino si un conflicto iba a estallar entre nosotros, y la oportunidad es demasiado buena para no perseguir."
 AST_fuel_the_grudge: "Combustible el Grudge"
 AST_fuel_the_grudge_desc: "La pieza final en el tablero. Una vez que cruzamos el umbral no hay vuelta atrás. Nuestra política tendrá que alejarse de China y hacia Taiwán. Si podemos llevarlos a bordo, todo lo demás debería caer en su lugar."
 AST_shirt_front_the_dragon: "Camiseta delante del dragón"
 AST_shirt_front_the_dragon_desc: "La flota de China ha estado tratando de armar fuerte a Filipinas fuera del atolón disputado Scarborough Shoal por unas semanas. Como la mayoría de los bullies, si mostramos apoyo a Filipinas con nuestras propias naves y montamos un perímetro alrededor de la isla, el bravado de China se disipará rápidamente."
 AST_the_canberra_treaty: "El Tratado de Canberra"
 AST_the_canberra_treaty_desc: "La guerra se ha evitado, y el Dragón ha demostrado que los países del Pacífico no se inclinan a la coacción."
 AST_the_lottery_draft: "El borrador de la Lotería"
 AST_the_lottery_draft_desc: "La última vez que promulgamos el Plan de Servicio Nacional, el movimiento fue menos que popular. Aún necesitamos fuerzas más listas si vamos a salir de la guerra. La 'votación del cumpleaños' tendrá que regresar."
 AST_stock_up: "Abastecerse"
 AST_stock_up_desc: "Nuestra marina no puede estar en todas partes. Va a haber escasez, y sólo podemos rezar para que antes tengamos suficiente de los bienes críticos en almacenamiento."
 AST_border_commanders: "Comandantes fronterizos"
 AST_border_commanders_desc: "Técnicamente hablando nuestro país carece de un guardacostas. El Comando de Fronteras Marítimas suele ser la protección fronteriza, pero sin una fuerza dedicada, por lo general utilizando una mezcla de unidades ADF y RANPF. Podemos remediar esto incorporando las reservas restantes en su propia fuerza de combate, encargada de proteger nuestras costas contra cualquier amenaza."
 AST_remember_the_squander_bug: "Recuerda el error del escuadrón"
 AST_remember_the_squander_bug_desc: "El gasto indulgente mientras la nación se enfrenta a su mayor desafío financiero ya que WW2 equivale a traición. Podemos traer de vuelta un clásico antiguo para ridiculizar a nuestros ciudadanos malhumorados por el gasto durante el conflicto, y vender nuestras armas mientras tanto."
 AST_secure_a_landing: "Asegure un aterrizaje"
 AST_secure_a_landing_desc: "Dada nuestra separación distinta, cualquier invasión va a estar en el mar. Tendremos que pedir unos cuantos barcos privados para satisfacer las demandas logísticas de la tarea, y abrir nuestro conocimiento anfibio."
 AST_all_in: "Todos en"
 AST_all_in_desc: "Las industrias de nuestra nación deben dedicarse totalmente a la amenaza actual. Se promulgará un estado de guerra total. Algunas libertades pueden ser suspendidas temporalmente, pero las demandas del estado y el ejército deben ser priorizadas."
 canberra_treaty_idea: "Tratado de Canberra"
 AST_the_rudd_government: "El Gobierno de Rudd"
 AST_the_rudd_government_desc: "Australia ha buscado el futuro. El pueblo ha decidido que nosotros, como nación, avancemos - para planear el futuro, abrazarlo juntos. Unidos escribiendo una nueva página en la historia del país, y hacer que este gran país nuestro sea aún mayor. \n\nNo podemos tomar esta confianza sagrada por sentado. \n\nLas mejoras en los sistemas de educación están atrasadas. La capacidad de nuestros sistemas hospitalarios públicos y el bienestar está en necesidad desesperada de atención. Nuestra infraestructura carece de lo que exige el siglo XXI, y la ausencia de iniciativa para hacer frente a la crisis del cambio climático nos ha retrasado décadas. No venimos como manifestantes del status quo, sino como el instrumento para la gente común. Asistir a estas áreas y las mayores amenazas que enfrenta este país es sólo el comienzo. \n\nNuestra política debe estar en contacto con los australianos y las necesidades que tienen. Mucho está montando en nuestra capacidad de llevar a la nación a la nueva década."
 AST_mend_the_rift: "Secuestrar el Rift"
 AST_mend_the_rift_desc: "El descuido del gobierno de la coalición ha permitido a los que se aferran a las grietas de la sociedad caer. Los desfavorecidos, los marginados; como han sido expulsados las grietas también han crecido. Podemos comenzar el viaje de reunir a los australianos visitando las peores zonas afectadas. Comunidades remotas que experimentan lo más duro de la crisis de la vivienda, comunidades sin hogar, agricultores y trabajadores que luchan. Si brillamos una luz sobre sus situaciones podemos mostrarles que el gobierno tiene cuidado, y ese cambio está llegando."
 AST_heal_the_people: "Sanar al pueblo"
 AST_heal_the_people_desc: "Ahora mismo, nuestra salud pública es un desastre. Los tiempos de espera están poniendo a las personas necesitadas de cirugía para salvar vidas durante un año a veces, y los departamentos de emergencia se han sobrecargado hasta el punto en que los pacientes ni siquiera llegan al quirófano. Con la promulgación de normas nacionales de emergencia, podemos ampliar inmediatamente las necesidades de capacidad hospitalaria pública y elevar los niveles mínimos de personal en todo el país."
 AST_unite_the_country: "Une el País"
 AST_unite_the_country_desc: "Es nuestro trabajo ahora dirigir la nave, y si no podemos mantener a todos a bordo entonces no lo estamos haciendo bien. Todavía existe una brecha entre los australianos que nos impide ser completos, y la negativa a reconocer el pasado nos impide abrazar el futuro. Si vamos a lograr ambos necesitamos examinar la desigualdad que se ha convertido en una malicia inquebrantable en este país durante siglos. Tal vez no podamos desmantelarlo completamente, pero podemos intentarlo."
 AST_economic_revolution: "Revolución Económica"
 AST_economic_revolution_desc: "No se necesita mucho para reconocer el gran experimento neoliberal de los últimos 30 años ha fracasado. El fundamentalismo de libre mercado que ha producido se ha revelado como poco más que la codicia personal vestida como una filosofía económica. Irónicamente, ahora cae a la gente de la socialdemocracia para evitar que esta forma del capitalismo se canibalice. \n\nNecesitamos alquilar un nuevo sistema de capitalismo social, responsable ante la gente, que equilibra el incentivo privado con responsabilidad pública. Mediante la regulación y mayores redes de seguridad fundamentales para nuestro pueblo, podemos lograr una economía más fuerte y más nacional."
 AST_a_voice_for_all_australians: "Una voz para todos los australianos"
 AST_a_voice_for_all_australians_desc: "No nos pusieron aquí para aprobar una reforma tibia. Sin embargo vamos cuarto la fiesta seguirá, y si no lo hacen encontraremos una manera de azotarlos en forma. La verdadera batalla va a ser el senado, por lo que no tenemos mayoría. Para pasar cualquier cosa será necesario que los números estén llenos de votos de los partidos opositores y la independencia. \n\nSi sacudimos el árbol lo suficientemente duro, y vendemos nuestros planes justo a la derecha, algunos votos podrían caer en nuestra canasta, y finalmente podemos pasar algo significativo."
 AST_work_with_the_party: "Trabajar con el Partido"
 AST_work_with_the_party_desc: "El Partido Laborista ha demostrado una y otra vez su posición como la mejor esperanza para Australia. A través del liderazgo sabio y la empatía moral probada continuamos la tendencia de aprobar legislación que no sólo beneficia al pueblo de esta nación, sino a los venideros. \n\nUn sabio líder también sabe cuándo escuchar a su partido. No podemos pasar nuestras reformas sin un partido unido, y actualmente el camino a la política de paso es demasiado estrecho para carecer de precaución. Presentar una política sensible es la única manera de que lo consigamos a través de la Cámara, y el Senado."
 AST_form_the_pact: "Forma el Pacto"
 AST_form_the_pact_desc: "Si vamos a aprobar alguna de nuestras propuestas más radicales tendremos que acercarnos a los Verdes. Son los hippies demasiado optimistas del parlamento. Una reunión con su líder, Bob Brown, podría ser suficiente para reunir a todos ellos, aunque hacerlo va a enajenar completamente cualquier apoyo del Partido Liberal, de hecho podríamos perder algunos de nuestros propios miembros también. \n\nAún así, vamos a necesitar su ayuda para cruzar la línea de meta."
 AST_something_has_to_give: "Something Has to Give"
 AST_something_has_to_give_desc: "Hay una podredumbre debajo de las tablas de madera de nuestra sociedad. A pesar de todos nuestros avances y esfuerzos sociales, cualquiera en Australia puede caer si las circunstancias son suficientemente malas, y muchos lo hacen. Hay redes de seguridad, por supuesto, pero cuando nuestros propios pagos de bienestar están por debajo del umbral de pobreza, e incluso los ancianos se ven obligados a buscar empleo para evitar la inanición, algo tiene que dar. \n\nNuestros sistemas de apoyo están rotos, y muchos en nuestro país ya lo sienten. No podemos esperar y dejar que empeore más."
 AST_meet_with_the_unions: "Reúnete con los sindicatos"
 AST_meet_with_the_unions_desc: "Si vamos a avanzar con nuestras reformas, el mejor lugar para empezar es con los sindicatos. El Partido Laborista fue fundado por los sindicatos después de todo, y son nuestros mayores benefactores. \n\nCiertamente nos ayudará a tocar la base con los trabajadores, y señalemos que estamos abiertos a la colaboración."
 AST_earnest_cheques_for_the_needy: "Cheques más largos para los necesitados"
 AST_earnest_cheques_for_the_needy_desc: "Para aquellos que viven en el borde de la pobreza, un solo accidente o una factura sorpresa podría enviarlos. Parte de nuestro apoyo para el público incluye una serie de bonos en efectivo directos únicos para reponer la línea inferior, y mantener a los vulnerables protegidos de cualquier ruina financiera repentina."
 AST_new_consensus: "Nuevo consenso"
 AST_new_consensus_desc: "El Consenso de Washington ha sido la prescripción estándar para las economías desde los años 80. Ahora, con los albores de las nuevas economías globalizadas que cuestionan ese consenso, Australia también debe encontrar su propio consenso. Aunque no sea tan libre como eso en Washington, ni tan autoritario como el de Pekín, nuestro será la intervención con finura."
 AST_insulate_the_homes: "Aisla las casas"
 AST_insulate_the_homes_desc: "Es una vergüenza que cada noche miles de familias australianas estén durmiendo en el frío. Nuestras estimaciones están en algún lugar de la gama del 40% de los hogares que no están aislados, lo que conduce a facturas de poder más altas gastadas en calefacción para aquellos que pueden permitirse, mucho menos aquellos que no pueden. Desarrollaremos un programa en todo el país para cubrir los costos de vivienda que podrían enfrentarse a instalar el aislamiento."
 AST_fair_shake_of_the_sauce_bottle: "Un afeitado justo de la botella de salsa"
 AST_fair_shake_of_the_sauce_bottle_desc: "El problema más grande que cualquier pareja enfrenta cuando busca tener un niño es las limitaciones financieras. Tomar el tiempo libre necesario para cuidar a un niño en sus años más cruciales es algo que pocos pueden incluso considerar, especialmente en esta economía actual y cambiante. Dado que es nuestra responsabilidad cuidar a los australianos, debemos apoyarlos como podamos. \n\nCada padre de Australia, incluso los que adoptan, tendrá derecho a 26 semanas de licencia parental remunerada. Todo el mundo que lo desee tendrá un sacudido justo al convertirse en padre, porque este es el gobierno de la justicia."
 AST_housing_initiative: "Rodar fuera de las casas"
 AST_housing_initiative_desc: "Hemos llegado a un acuerdo con contratistas privados para ayudarnos a construir más de 20.000 nuevas viviendas sociales y reparar aproximadamente 12.000 propiedades inhabitables en toda Australia durante los próximos 10 años. Esto albergará a miles de personas que sufren de falta de vivienda en el primer año."
 AST_the_care_act: "Enmienda de la Seguridad Social"
 AST_the_care_act_desc: "Después de largas negociaciones con el partido y con los liberales, hemos logrado poner una tapa a nuestra legislación social. La revisión de los programas de elegibilidad y trabajadores, Centrelink estará disponible para casi un millón más de australianos. Los pensionistas verán un golpe considerable a sus pagos, al mismo tiempo que equilibran el cambio aumentando la edad de elegibilidad y endureciendo el medicare para aplacar a la oposición. Cientos más becas y aumentos en los pagos por discapacidad. \n\nCada vez más australianos van a vivir más fácil mientras el gobierno tiene la espalda."
 AST_shelter_for_all: "Refugio para todos"
 AST_shelter_for_all_desc: "Si nuestra inversión actual en el país no fue lo suficientemente grande, los planes que tenemos para abordar la falta de vivienda han empujado a los halcones presupuestarios a una histeria. Hemos desechado el plan inicial para 20.000 viviendas sociales durante 10 años por 100.000 en ese mismo período. El primero de ellos construidos durante el próximo año irá directamente a albergar a los más en riesgo. \n\nIncluso los más progresistas del partido están llamando al plan audaz, y algunos incluso lo llaman imposible. La mayor parte de nuestra capacidad de construcción tendrá que ser utilizada para el proceso inicial si es factible."
 AST_root_and_branch_approach: "Acercamiento de raíz y rama"
 AST_root_and_branch_approach_desc: "Gran parte de nuestras reformas más amplias se pueden describir como cambios «raíz y rama», en los que el enfoque para reestructurar algo como la atención médica o la vivienda tiene que comenzar a raíz. Instituir exámenes independientes o rediseñar completamente el proceso para ayudar mucho más australianos y operar con mayor eficiencia. Nuestros planes para rediseñar el sistema de bienestar social han llegado a ser más caros de lo que podemos facilitar en la actualidad, lo cual nos deja con un déficit considerable. \n\nPor mucho que nos gustaría complacer a todos, el financiamiento tiene que venir de alguna parte."
 AST_a_stronger_net: "Una red más fuerte"
 AST_a_stronger_net_desc: "Con aportes de los Verdes hemos reunido lo que podría ser la mayor legislación social que el país haya visto jamás. Una reforma radical de nuestra actual capacidad social y elegibilidad, con programas masivos para apuntar a millones en la pobreza y recaudar pagos a niveles habitables, al tiempo que elevan el salario mínimo del gobierno. Sin duda esto va a sacudir las cosas en la industria, y podría ser lo más cercano que una nación de nuestro tamaño tiene a un ingreso básico universal, pero si vamos a hacer cambios sociales que superarán nuestra generación, esto sería. \n\nPerderemos algunos de los halcones del presupuesto del partido, pero valdrá la pena por lo que hemos logrado."
 AST_bill_of_rights: "Our Bill of Rights"
 AST_bill_of_rights_desc: "Después de nuestra elección una serie de voces hicieron su deseo de un 'grande de derechos' que moldea fundamentalmente a nuestros gobiernos enfocarse en los derechos de nuestros ciudadanos. Ahora tenemos la oportunidad de proponer un estatuto del Commonwealth que traería sólo eso. Implementar derechos de protección, cambios en nuestro sistema judicial y organismos de autoridad, y presentar una carta a nuestro parlamento con la responsabilidad que tenemos a los australianos para mantener su igualdad, libertad y seguridad. Esencialmente los nueve metros enteros."
 AST_the_social_contract: "El contrato social"
 AST_the_social_contract_desc: "Los sistemas de atención y apoyo se han reducido y decaído hasta tal punto donde el número creciente de personas sin se ha convertido en los muchos. No es más cierto que los australianos son libres que el sistema que les ha fallado una y otra vez, los ha reducido a la dependencia del estado incluso por las necesidades más pequeñas. En otro lugar ese mismo sistema ha descuidado a los que necesitan atención. \n\nAhora es nuestra responsabilidad cambiar las cosas. Se abordará el problema de las personas ignoradas y desfavorecidas. Este sistema no puede continuar."
 AST_a_national_congress: "Congreso Nacional"
 AST_a_national_congress_desc: "Aunque el ATSIC fue un paso hacia el progreso unificado, en algún lugar a lo largo de la línea perdió su camino, y su propósito para la representación real nunca se realizó realmente. Al trabajar con la Comisión Australiana de Derechos Humanos, podemos organizar un nuevo Congreso Nacional de los Primeros Pueblos de Australia para reemplazarlo. Permitiéndonos trabajar más activamente junto con las Ausías Indígenas para implementar políticas centradas en la igualdad y el cambio proactivo."
 AST_visit_the_schools: "Visita a las escuelas"
 AST_visit_the_schools_desc: "Al igual que nuestra revolución económica, se necesitará una reforma del sistema escolar. Ya hemos elaborado planes para invertir fuertemente en la remodelación y construcción de nuevas escuelas comerciales, y podemos empezar por visitar algunas de nuestras escuelas locales en Queensland para sentir la situación sobre el terreno."
 AST_digital_education: "Educación digital"
 AST_digital_education_desc: "El avance de Internet ha sido algo para ver a los australianos, y especialmente a nuestra juventud. Si se enseña a una edad joven para ser mejor utilizado, nuestra próxima generación estará equipada para manejar el nuevo reino digital, y evitar los peligros que podría presentar. Instalar una serie de computadoras en las aulas, junto con nuestras otras remodelaciones, nos preparará para la era moderna."
 AST_a_national_agreement: "A. Acuerdo nacional"
 AST_a_national_agreement_desc: "Hay varios miembros de la oposición inclinados a trabajar con nosotros en política indígena. Si podemos convencerlos de que consideren las cuestiones como la crisis que son, podemos ejecutar proyectos de ley como medidas de emergencia. Empleando rápidamente programas para abordar enfermedades crónicas, tasas de alfabetización y acceso a la atención primaria en zonas remotas."
 AST_state_health_reform: "Reforma Estatal de la Salud"
 AST_state_health_reform_desc: "Típicamente los estados locales administran hospitales públicos de sus propios bolsillos. Sin embargo, recientemente han pasado laxas o están sufriendo graves problemas de financiación, porque el cuidado actual no está casi haciendo suficiente. La única manera de gestionar una reforma financiera es tomar el control de la financiación del hospital, manteniendo las operaciones generales manejadas localmente. \n\nPodemos realizar nuestras propias revisiones para ver qué áreas podrían necesitar mejorar e ir desde allí. Si lanzan un escándalo tendremos que amenazarlos con un referéndum constitucional para dar al gobierno federal el control total de los hospitales públicos, entonces veremos si todavía se ladran. \n\nPor una vez el dólar se detiene con nosotros."
 AST_equal_opportunity: "Igualdad de oportunidades"
 AST_equal_opportunity_desc: "No tenemos derecho a interponernos en la demanda de igualdad de derechos matrimoniales. Incluso si no lo estamos defendiendo nosotros mismos, todavía podemos poner el asunto en un referéndum, y medir dónde está la percepción pública. Si pasa, y la oposición sigue en contra de nosotros, podemos usarla como combustible para las próximas elecciones."
 AST_respect_traditional_values: "Respetar los valores tradicionales"
 AST_respect_traditional_values_desc: "Un gobierno justo tiene la responsabilidad de escuchar las necesidades de los muchos, respetando al mismo tiempo los medios de subsistencia de los pocos. Australia ha prosperado gracias a un liderazgo medido y cauteloso. No vamos a obligar a nadie a hornear una torta que va contra su religión, ni vamos a revolver la olla de las guerras culturales. Es hora de dar un paso atrás para un cambio."
 AST_clean_feed: "Alimento limpio"
 AST_clean_feed_desc: "Incluso con nuestros programas de educación digital no podemos evitar que el peor de Internet afecte a la juventud. Incluso ahora en línea bullying y cibercrimen amenazan el tejido mismo de la vida australiana. Delegaremos una lista de los peores delincuentes en línea a nuestros proveedores de servicios de Internet, lo que les exigirá"
 AST_close_the_gap: "Cierra el Gap"
 AST_close_the_gap_desc: "Nuestra política central y continua al abordar los asuntos indígenas ha estado reduciendo la brecha en la esperanza de vida, el logro educativo y las oportunidades económicas. La esperanza de vida en particular para los australianos indígenas es casi 10 años menos que para los ciudadanos no indígenas. Las tasas de alfabetización también son mucho menores, y las tasas de mortalidad infantil son dobles que las de los no indígenas. \n\nTienes razón. Necesitamos proponer legislación que incluya una amplia gama de programas dedicados a la causa, y hacer objetivos difíciles para mejorar la vida de nuestros Primeros Pueblos."
 AST_tackle_the_mining_oligarchy: "Abordar la Oligarquía Minera"
 AST_tackle_the_mining_oligarchy_desc: "Las insidiosas fuerzas que han influido en nuestro gobierno continúan haciéndolo hasta hoy gracias a la riqueza que han drenado de nuestra tierra. Durante siglos amasaron una fortuna y se negaron a compartirla, mientras que los trabajadores que contrataban trabajo son pagados demasiado poco y dispuestos de muy fácilmente. Es hora de que paguen su parte, y que el pueblo australiano sea recompensado por el mineral que sale de su tierra."
 AST_draft_the_legislation: "Proyecto de legislación"
 AST_draft_the_legislation_desc: "Con el alcance de lo que estamos tratando de lograr, tendremos que redactar la última ley tributaria, carente de lagunas y reunir a todos los expertos que podemos presentar. Si estamos haciendo esto, lo haremos de la manera correcta."
 AST_tax_the_super_profits: "Impuesto a los Super Profits"
 AST_tax_the_super_profits_desc: "Muchas noches pasadas en el Parlamento nos han recompensado con una lanza brillante para usar contra las grandes corporaciones. Una tasa tributaria dinámica, dirigida a las mayores empresas y fiscalizando sólo los «super-beneficios» obtenidos cuando una empresa excede con creces su tasa de ingreso normal, finalmente reducirá algunos de los ingresos que se generaron durante el boom minero. Esto también debe evitar la etiqueta de impuestos injustos, ya que el impuesto será nulo si la empresa ha infravalorado, o sus costos operativos exceden los rendimientos."
 AST_throw_businesses_a_bone: "Throw Corps a Bone"
 AST_throw_businesses_a_bone_desc: "La regulación entre nuestros propios estados es excesiva para decir lo menos. Está costando a las empresas grandes y pequeñas una cantidad elevada, y está disminuyendo mucho el comercio, que sólo va a aumentar el costo de los bienes localmente. Si queremos echar un hueso a las industrias y demostrar que no estamos solo para conseguirlas, podemos trabajar junto al consejo de negocios para crear una economía nacional sin problemas. Uno que corta la montaña de cinta roja a cambio de un viaje más fácil, y mayor flujo."
 AST_tear_off_special_interests: "Tear Off Interes Especiales"
 AST_tear_off_special_interests_desc: "Los grupos de interés se han convertido en una presencia maligna en nuestro sistema político que debería haber sido tratado hace mucho tiempo. Tener influencia injusta en nuestro ciclo electoral y proceso político. No podemos hablar por el otro lado del pasillo, pero al investigar a nuestro propio partido por la influencia injusta podríamos ser capaces de cortar algunos de los tendriles sueltos. Podría no deshacerse de ellos para siempre, pero hará que la eliminación en el futuro sea más fácil."
 AST_own_our_resources: "Propietarios de nuestros recursos"
 AST_own_our_resources_desc: "Uno de los mayores errores del gobierno era permitir la propiedad extranjera de nuestros recursos sin tener una participación en ellos mismos. Concedido de que nos hemos beneficiado bien de su crecimiento continuo, y la economía global es un éxito por una razón, pero tampoco debemos descuidar los intereses de nuestra propia nación. \n\nYa recibimos regalías del cuerpo minero para la minería de nuestra tierra, si subimos el costo que podrían protestar a corto plazo, pero eventualmente vendrán a la mesa, y podemos negociar mejor cómo se manejan los minerales de nuestro país."
 AST_spirit_of_gough: "The Spirit of Gough"
 AST_spirit_of_gough_desc: "El trágico cuento de Gough Whitlam es uno para los libros de historia. Un hombre con ambición demasiado alto, cortado por los poderes que le rodean. A pesar de su corto plazo brillaba como un gran revolucionario para la política progresista, y era sólo su intento de reducir el creciente control de las industrias mineras que lo hicieron. \n\nPodría ser demasiado tarde para promulgar la escala de propiedad que estaba planeando, pero todavía podemos hacerlo orgulloso. Al crear la primera empresa minera administrada por el gobierno, podemos apartar a las corporaciones y sacar el mineral de nuestras propias minas, tomando todos los beneficios y todas las recompensas para nosotros mismos."
 ast_spirit_of_gough_tt: "Crea la Autoridad Petroleum y Minerales §0.§!"
 AST_twenty_twenty_summit: "2020 Summit"
 AST_twenty_twenty_summit_desc: "La Cumbre 2020 ha sido la idea de la postura más involucrada de nuestro gobierno sobre gobernar. Un foro democrático abierto, invitando a 1.000 líderes comunitarios, expertos y ciudadanos a crear una estrategia para el futuro de la nación. Los australianos que deciden su propio futuro es una gran manera de arrancar nuestro término, y demuestra que estamos comprometidos a cambiar."
 AST_kyoto_accords: "El compromiso de Kyoto"
 AST_kyoto_accords_desc: "Ratificar el Protocolo de Kyoto es sólo el principio. Para verlo cumplir su potencial vamos a tener que empujar más lejos. No hay trozo de carbón sin voltear."
 AST_big_australia: "Gran Australia"
 AST_big_australia_desc: "El concepto fue batido durante la cumbre de 2020. Nuestra población más pequeña ha sido una de las únicas cosas que nos sostienen en nuestro viaje para estar allí arriba con los grandes. En este momento sólo hay tantos bebés que podemos hacer. El nuevo plan ha incluido pasos para llegar a 36 millones en 2050, fundamentalmente aumentando la incorporación de nuestro sistema migratorio. Todo tiene que ser racionalizado."
 AST_seasonal_labour_scheme: "Plan de trabajo estacional"
 AST_seasonal_labour_scheme_desc: "El atraco de nuestra población más pequeña sólo puede ser modificado en el corto plazo con una corriente de trabajo importado. Ampliar las restricciones para embalar a más trabajadores extranjeros hacia nuestras industrias les mantendrá creciendo mientras tanto, y mantener la reducción que podríamos esperar por debajo de la línea."
 AST_our_sibling_state: "Nuestro Estado hermano"
 AST_our_sibling_state_desc: "Pocos podrían medir la intensa rivalidad entre nosotros y el país con una población más pequeña que Sydney. Si es deporte o algo más en realidad, nunca oirás el final si salen arriba. Nuestras economías ya están bastante sincronizadas, pero hemos estado trabajando en un acuerdo comercial para vincular eficazmente a nuestras naciones financieramente. El comercio y la inversión fluirán entre nosotros como el agua si tiene éxito."
 AST_pacific_islands_forum: "Pacífico Foro de las Islas"
 AST_pacific_islands_forum_desc: "Cada pocos años nuestra nación, Nueva Zelanda y los de las naciones insulares se reúnen para discutir los intereses regionales y abordar los desafíos que enfrentan. Ha sido una manera eficaz de mantenernos informados sobre nuestros vecinos oceánicos. Este año el tema de los permisos de trabajo ha estado directamente en la agenda, y algunas naciones han discutido permisos temporales para el desarrollo hortícola conjunto. Si estamos de acuerdo en tomar o no, el plan ciertamente tiene sus méritos."
 AST_end_the_imperialism: "Fin del Imperialismo"
 AST_end_the_imperialism_desc: "Tal vez sentarse en el asiento más grande de la nación ha proporcionado un sentido de claridad. En el ambiente arraigado que han creado nuestros predecesores, a veces tenemos una opción. Ya sea para continuar infligiendo interferencia y daño sin necesidad a través del mundo, o para en lugar de tirar hacia atrás y respetar los límites que han crecido alrededor de nosotros."
 AST_maintain_obligations: "Mantener las obligaciones"
 AST_maintain_obligations_desc: "Retenemos un cierto nivel de responsabilidad para los gobiernos que llegaron antes, y los intereses que han creado en el Pacífico y Más Allá. Cuando nuestra política, tan a menudo como lo hace, afecta la vida de millones, tenemos que acercarnos a las cosas con un toque suave. Tomar un sledgehammer a nuestras relaciones tan temprano en adelante sólo va a terminar mal para nosotros. Es mejor que guardemos lo que tenemos, y mejorarlo donde sea posible."
 AST_the_free_trade_area: "Zona de Libre Comercio"
 AST_the_free_trade_area_desc: "Los meses de negociación con los estados de la ASEAN nos han dado una oportunidad increíblemente lucrativa. Mientras que nuestro país y Nueva Zelanda no cumplen con los criterios para unirse al bloque comercial, todavía podemos acceder a algunos de sus beneficios por convertirse en «participantes», esencialmente creando una zona de libre comercio entre nosotros y Asia."
 AST_the_beginning_of_something_new: "El comienzo de algo nuevo"
 AST_the_beginning_of_something_new_desc: "Aunque el pacto de la ASEAN ha funcionado bien para unificar los estados asiáticos en estas últimas décadas, las tres economías más grandes del Pacífico apenas permanecen tensas. Japón, India y China pueden tener sus propios acuerdos individuales, pero palidece en comparación con el sindicato establecido en Europa. \n\nAunque admitidamente ambiciosos, si pudiéramos unir a estos países, incluidos los nuestros, en una unión económica combinada, la prosperidad financiera sería simplemente el comienzo. La paz en el Pacífico se lograría con una moneda meramente unificada."
 AST_address_the_tiger: "Dirección del Tigre"
 AST_address_the_tiger_desc: "Las relaciones con la India están volando sin problemas ahora mismo. Algunos pueden incluso decir peachy. No deberíamos intentar arruinar algo bueno, pero ¿quién dice que no podemos mejorarlo? Su disposición con China es uno de los obstáculos más grandes que enfrentaríamos formando el sindicato. Si podemos hacer algún tipo de avance el resto del trabajo será una brisa."
 AST_an_asian_pacific_union: "An Asian Pacific Union"
 AST_an_asian_pacific_union_desc: "Cada pieza tiene que estar en su lugar perfecto para lo que estamos tratando de sacar. Cuán lejos podemos ir y cuánto de una huella que hacemos en la historia geopolítica va a ser definida por estas conversaciones. Nuestro trabajo finalmente pagará."
 AST_renegotiate_with_papua: "Maneja la crisis del barco"
 AST_renegotiate_with_papua_desc: "Miles de migrantes están aterrizando en nuestras costas cada año indocumentados, y parece que ese número está aumentando. A medida que la infraestructura existente se desborde, será necesario reexaminar la solución fuera de la tierra para atender a la crisis actual."
 AST_keep_the_gears_turning: "Mantener los engranajes girando"
 AST_keep_the_gears_turning_desc: "Estamos demasiado interconectados con el mundo para salir. La política de contención-por-proxy sólo funciona si seguimos engrasando los engranajes, y mostrando que nuestras promesas se pegan. El riesgo de volvernos atrás es demasiado alto. No es un bien mayor. No es sólo causa."
 AST_world_hold_on: "Aguarde el mundo"
 AST_world_hold_on_desc: "Necesitamos enviar un mensaje a los otros países que Australia no ha alcanzado el pico. Todavía estamos aquí, y vamos al extranjero. Promoviendo la inversión externa al reducir la regulación que retiene a nuestros grandes negocios es el tipo de colonialismo económico del que podemos estar orgullosos. Fox News y Outback Steakhouse eran sólo un vistazo de lo que somos capaces. Ya lo verán."
 AST_assure_the_other_side: "Asegurar el otro lado"
 AST_assure_the_other_side_desc: "No podemos sobrevivir sin nuestros negocios. El comercio actúa como los glóbulos que atraviesan nuestra industria. Las obligaciones de las Partes aparten, sin un interés otorgado en apoyarlas a través del actual cambio financiero, el corazón de nuestra economía podría aprovecharse. Hay que lograr un equilibrio para apoyarlos, como indirectamente nos apoyan."
 AST_forward_with_fairness: "Adelante con la justicia"
 AST_forward_with_fairness_desc: "Todos estamos para mejorar la vida de nuestros trabajadores, pero ahogar el crecimiento empresarial durante estos tiempos simplemente no es una opción. La supresión de AWA y la introducción de la negociación colectiva demostrarán que estamos dispuestos a trabajar en intereses empresariales. Después de todo, el derecho al trabajo debe permanecer con el trabajador, no con el sindicato."
 AST_represent_the_worker: "Representar al Trabajador"
 AST_represent_the_worker_desc: "El trabajo está constituido fundamentalmente por seres humanos con dignidad intrínseca en lugar de simplemente un bien económico. Si nuestros trabajadores no creen que tenemos la espalda, ¿cómo se espera que se levanten por sus propios derechos? No podemos ser vistos favoreciendo los deseos de las empresas sobre nuestro propio pueblo."
 AST_the_emissions_trading_scheme: "Emisiones del sistema de comercio"
 AST_the_emissions_trading_scheme_desc: "El cambio climático se ha convertido en los mayores desafíos morales de nuestro tiempo. No sólo para nosotros, sino para todo el mundo. Cientos de naciones se encuentran ahora siendo advertidos del peligro inminente, pero su fuerza para actuar está siendo desafiada. ¿Pueden dejarse de lado las comodidades de nuestras industrias para las generaciones futuras? ¿Podemos realmente soportar la carga de llevar la economía a nuevas alturas mientras preservamos nuestro medio ambiente? Para nosotros la respuesta siempre será sí. \n\nEl esquema ha sido una de nuestras promesas de campaña más largas, introduciendo gorros en la salida CO2 de una empresa. Si las empresas desean expulsar más necesitarán permisos eliminados del gobierno, o pagar mucho por ellos, lo que resulta en menos producción de energía a corto plazo. Su objetivo es disminuir nuestra producción a niveles anteriores al 2000, incentivando la energía renovable, pero sin duda nos elevará una cantidad justa en nuevos ingresos."
 AST_cut_the_csiro: "Corta el CSIRO"
 AST_cut_the_csiro_desc: "Lamentablemente, la Organización de Investigación Científica e Industrial del Commonwealth no ha estado sacando su peso. Usted esperaría suficientes subsidios hinchados para financiar completamente otros organismos podrían haber producido algo, pero en las últimas décadas los costos han crecido, y produjo muy poco de valor. Tendremos que destriparlo para recuperar las cosas, y no nos dolerá a nuestros cofres."
 AST_green_energy_incentives: "Incentivos de energía verde"
 AST_green_energy_incentives_desc: "Si los combustibles fósiles están disminuyendo, las energías renovables deben estar al día. Más que eso, necesitan ser alentados si estamos encontrando cualquier tipo de adopción nacional en el futuro. Desarrollando nuestras capacidades geotérmicas e invirtiendo en un Fondo de Innovación Automovilística Verde nos llevará a la dirección correcta."
 AST_fair_work_australia: "Buen trabajo Australia"
 AST_fair_work_australia_desc: "Dada la desconexión entre nuestros negocios y el gobierno, el partido ha aconsejado la creación de una oficina de relaciones, trabajando en favor de los intereses empresariales para alinear mejor nuestro enfoque con el suyo. Esto debe eliminarse con la Ley de relaciones laborales, y las temidas reformas de la Workchoices. Si lo implementamos con retroalimentación de los sindicatos podemos trabajar en algunas de las protecciones obreras habituales, apaciguando ambos lados del argumento."
 AST_snip_the_red_tape: "Snip la cinta roja"
 AST_snip_the_red_tape_desc: "A pesar de nuestra Comunidad bastante unificada, nuestros gobiernos estatales ciertamente no trabajan juntos así como nos gustaría. Si un negocio quiere registrarse necesita navegar a través de los formularios y tarifas para cada estado individual que operan, por lo que si operan en dos estados es el doble de las tasas y el doble de los formularios. Crear un único registro nacional en línea va a permitir que cualquiera en el país se registre una vez y hecho, luego directamente al negocio."
 AST_for_the_common_farmer: "Para el Granjero Común"
 AST_for_the_common_farmer_desc: "Desde el comienzo del siglo, nuestros agricultores lo han tenido difícil. La peor causa de preocupación ha sido la sequía del Milenio que, a pesar de nuestras políticas, sigue obstaculizando la recuperación agrícola. Sentarse con los defensores nos ayudará a trabajar en algunas soluciones reales."
 AST_walkable_cities: "20-Minute Cities"
 AST_walkable_cities_desc: "Nuestra mayor lucha ha estado en las calles. Al comienzo de la revolución industrial, los ciudadanos fueron empujados a callejones estrechos y obligados a adoptar los paisajes del asfalto como sus reuniones sociales. Desde entonces nuestro sentido de comunidad se ha reducido y se ha convertido en un elemento sacrificial dentro del entretenimiento. No podemos obligar a la gente a salir, pero podemos engatusarlos. \n\nIncorporando el plan de 20 minutos de la ciudad, desarrollado por el consejo de Melbourne, podemos aflojar restricciones de ruido y financiar una serie de proyectos creativos y festivales para traer gente de vuelta a las calles, reconstruyendo un sentido de comunidad. Poner en marcha programas y expansiones gratuitas para jóvenes a nuestra infraestructura, y nuestros barrios serán centros de cultura bulliciosos en cuestión de años."
 AST_keep_them_safe: "Mantenerlos a salvo"
 AST_keep_them_safe_desc: "Australia no tiene un animal nacional, aunque la mayoría argumentaría que es el Kangaroo Rojo. Un símbolo casi universalmente reconocido, y sin embargo tantos saben acerca de los lindos critters que cuelgan sobre nuestros bosques. Ya sea que sean compañías madereras o enfermedades, cada año la población declive para Koala se pone peor, y sin embargo poco se hace para protegerlos. Si los nominamos como especies protegidas, se puede hacer más para mantener estos marsupiales memorables alrededor y a salvo de la extinción."
 AST_industry_research_bank: "Banco de investigación del Commonwealth"
 AST_industry_research_bank_desc: "Nuestra investigación sólo se ha derrumbado porque lo hemos permitido. Una falta de inversión en áreas críticas impide a nuestras organizaciones hacer el mismo trabajo que se construyeron para hacer, empujando por las barreras. Arriba el presupuesto y arriba de los objetivos."
 AST_natos_best_friend: "El mejor amigo de la OTAN"
 AST_natos_best_friend_desc: "Australia ya es uno de los aliados no miembros más cercanos de Nato. Nos entrenamos con ellos, nos sometemos a mantenimiento de la paz con ellos, y compartimos inteligencia. Nuestra postura en el Pacífico podría fortalecerse mucho más con el respaldo correcto, y aunque nuestra neutralidad tiene sus beneficios, es hora de un compromiso más cercano."
 AST_from_the_ashes: "De las cenizas"
 AST_from_the_ashes_desc: "Ahora que estamos de vuelta al mando tenemos que centrarnos en ganar las próximas elecciones. Nuestra política tiene que ser clave a corto plazo, y reunir al partido detrás de nosotros va a requerir una onza de inspiración y una abundancia de arma-twisting."
 AST_a_new_dawn: "Un nuevo amanecer"
 AST_a_new_dawn_desc: "El público necesita ver al Trabajo como un partido nacido de nuevo. La vieja piel de lucha tiene que ser derramada, y se redactará una nueva imagen de competencia y fiabilidad para salvar la base electoral."
 AST_repair_the_party: "Reparar el Partido"
 AST_repair_the_party_desc: "Nuestras viejas relaciones con las facciones del partido son más o menos en tatters. Peor es que el sistema que nos permitió ser derrocados todavía está presente. Desarraigar los mecanismos actuales para hacer que los golpes de Estado sean menos comunes y reescribir las reglas del partido es la única manera en que vamos a arreglar las cosas."
 AST_fight_back: "Lucha atrás"
 AST_fight_back_desc: "Si los medios de Newscorp pensaran que podrían seguir arrastrándonos por el barro y no tendríamos una respuesta para ello, estarían soñando. La arena del debate es una calle de dos maneras, y vamos a golpearlos duro."
 AST_on_the_campaign_trail: "On the Campaign Trail"
 AST_on_the_campaign_trail_desc: "Verdaderamente los últimos años no han sido ideales, y el Trabajo ciertamente ha perdido su camino. Visitar a los australianos rurales y urbanos, en toda la nación, y comprender los problemas reales que les afectan muestra que estamos listos para volver a ser el partido que escucha. Comenzando eso anunciando nuestra carrera en la Conferencia Nacional."
 AST_win_manufacturers: "Fabricantes ganadores"
 AST_win_manufacturers_desc: "Estamos apostando nuestro segundo término fuerte con la Ley de empleos australianos. Un paquete de 2 mil millones de dólares para capacitar a 7.000 trabajadores manufactureros, ayudándoles a la transición hacia los sectores productivos mientras nuestros mercados tradicionales de automoción y textil se enfrentan a una reducción. Una solución práctica para la caída de la industria en curso."
 AST_cast_the_die: "Echa el molde"
 AST_cast_the_die_desc: "Nuestros chips están en su lugar, y el pueblo australiano está listo para elegir a su próximo líder. Hemos hecho todo lo posible para prepararnos y presentar nuestra visión, sólo podemos esperar que los votantes estén a bordo."
 AST_the_gillard_gov: "El Gobierno de Gillard"
 AST_the_gillard_gov_desc: "Este gobierno cree en recompensar a los que trabajan más duro, no a los que se quejan más fuerte. Cree en recompensar a aquellos que, día tras día, trabajan en nuestras fábricas y en nuestras granjas, en nuestras minas y en nuestros molinos, en nuestras aulas y en nuestros hospitales, que premia ese duro trabajo, decencia y esfuerzo. Las personas que juegan por las reglas, ponen sus alarmas temprano, llevan a sus hijos a la escuela, están junto a sus vecinos y aman a su país. \n\nNuestro país es bendecido de muchas maneras, pero el estado de las finanzas de nuestra nación ha corroído y hinchado hasta el punto del abandono. Aseguro a todos los australianos que el presupuesto volverá en buena salud bajo nuestra dirección. Teniendo en cuenta el deber que los antes establecidos, estamos comprometidos a emprender un gobierno fiscalmente responsable y fuerte que comprenda las necesidades de más que sólo los pocos fuertes. \n\nLa política mediática terminará. Terminará la indiferencia hacia las necesidades de nuestras industrias, y se devolverán las cualidades de dignidad y sensibilidad."
 AST_form_the_minority_coalition: "Forma de la Coalición Minoritaria"
 AST_form_the_minority_coalition_desc: "El futuro del trabajo ahora descansa en nuestra capacidad de formar un gobierno."
 AST_go_green: "Hacerse ecológico"
 AST_go_green_desc: "Cuando no nos apuñalan en la espalda, los Verdes han sido una fiesta útil para nuestra causa. Negociar con ellos difícilmente será un problema, y la mayoría de sus preferencias políticas se alinean con las nuestras. Seguro que tendremos que implementar algunas reformas de token aquí y allá, pero tendrán la espalda cuando importa."
 AST_wrangle_liberal_defectors: "Defectores liberales Wrangle"
 AST_wrangle_liberal_defectors_desc: "Algunos miembros actuales del Partido Liberal y Nacional han mostrado interés en nuestra agenda, y algunos ya han saltado el barco en lugar del drama reciente del partido. Encontrarlos y ofrecerles un lugar en nuestro gobierno a cambio de apoyo debe ser lo suficientemente fácil, y mostrar que no estamos por encima de trabajar con la oposición para preservar los valores conservadores."
 AST_clean_energy_act: "Acto de energía limpia"
 AST_clean_energy_act_desc: "Tras no lanzar el Plan de Comercio de Emisiones, se ha redactado un sustituto menos divisivo para hacer frente a nuestras crecientes emisiones de carbono. El alcance del acto todavía no está completamente definido, pero, al igual que el ETS, el objetivo del acto es limitar la producción de CO2 con impuestos recién introducidos y fomentar la producción de energía limpia."
 AST_clean_energy_creation: "Creación de energía limpia"
 AST_clean_energy_creation_desc: "Hemos estado en un home-run haciendo frente a la crisis climática, y es hora de que invertimos algunos de nuestros fondos para continuar con el plan. El largo plazo siempre ha sido lograr la independencia renovable de nuestras reservas de carbón. Empecemos la transición."
 AST_address_the_stolen_generations: "Dirección de las Generaciones Robadas"
 AST_address_the_stolen_generations_desc: "Hay suficiente apoyo en la oposición para dar una dirección a las Generaciones Robadas sin aparecer para montar los abrigos de cola de la Disculpa Nacional. Ciertamente nos hará parecer muy bipartidistas, y podría ser una fuente de consuelo para algunos en la comunidad."
 AST_correct_the_mouthboxes: "Corregir los Mouthboxes"
 AST_correct_the_mouthboxes_desc: "Las corporaciones y los activistas políticos han sido autorizados a mentir directamente en línea y en la televisión con poco o nada de consecuencias. Aunque es difícil probar cualquier malicia, o daño causado por el lax en verdad, no podemos permitir que esta tendencia preocupante continúe. La introducción de leyes que castiguen anuncios o publicaciones engañosos debe frenar la tendencia, y traer cierta semejanza de la realidad a la política."
 AST_let_debate_decide: "Dejar el debate decidir"
 AST_let_debate_decide_desc: "Uno de los proyectos de ley que nos han entregado los Verdes está destinado a expandir las libertades del mismo sexo. Nuestro gobierno todavía está bastante en la valla, si no se opone a hacer movimientos repentinos en esa dirección, pero podemos dejarlo a la asamblea para decidirlo de una manera justa."
 AST_ndis: "Formulario del NDIS"
 AST_ndis_desc: "La simple verdad es que la discapacidad puede afectar a cualquiera de nosotros y por lo tanto afecta a todos nosotros. Raramente está alguien financieramente listo para las consecuencias y ahora mismo los que enfrentan el aislamiento, la pobreza y la pérdida de dignidad sólo pueden depender del poco que nuestros servicios de bienestar proporcionan específicamente a los discapacitados. \n\nLa introducción del Plan Nacional de Seguros de Discapacidad podría ser el apoyo más significativo desde la introducción de Gough Whitlam de atención médica universal. Millones de personas necesitadas tendrán el apoyo que necesitan, y la nación estará más orgullosa de ello."
 AST_the_gonski_review: "La revisión de Gonski"
 AST_the_gonski_review_desc: "Al comienzo de nuestro mandato encargamos una revisión de nuestro sistema escolar para encontrar cualquier deficiencia que necesite un parche. The resulting review found a compounding gap in educational outcomes driven byeconomic status and funding inefficiencies. En resumen, las escuelas públicas que recibían menos fondos terminaron con puntuaciones más pobres en toda la junta directiva. \n\nEs necesario instituir un recrudecimiento serio de la financiación educativa para abordar el problema y ayudar a nuestros estudiantes. Ellos son el futuro de nuestra nación después de todo."
 AST_take_less: "Toma menos"
 AST_take_less_desc: "Hay muy poco en lo que el Partido Liberal es correcto, pero lo que tienen razón es mantener los impuestos bajos. ¿Cómo podemos esperar que el australiano promedio valore las recompensas de su trabajo si terminamos tomando la mayor parte de ella. Una población más fuerte es una con más en su bolsillo."
 AST_get_more: "Más..."
 AST_get_more_desc: "Los impuestos se han utilizado desde la creación de nuestra nación, aunque últimamente han sido abandonados por el derecho de la clase baja a disfrutar de actividades degeneradas. La elección entre aparecer «aceptando socialmente», y llevar cualquier tipo de columna vertebral moral es fácil para nosotros."
 AST_regulate_the_unions: "Regular las Uniones"
 AST_regulate_the_unions_desc: "Al igual que o no, los sindicatos son, por su propia definición, obstrucción al crecimiento económico. Ellos erosionan las libertades que los trabajadores tienen que trabajar, y los derechos de las empresas a contratar. Prácticamente estamos retenidos por la garganta por el poder político que los sindicatos han manipulado para controlar al gobierno y sofocar la prosperidad. \n\nEs necesario permitir que la legislación limite su alcance y mantenga la política de esta nación dentro del gobierno, no dominada por estos burócratas pequeños de extrema izquierda."
 AST_national_broadband_network: "Red nacional de banda ancha"
 AST_national_broadband_network_desc: "El NBN ha estado en desarrollo durante casi una década en este momento, con miles de millones ya invertidos en el esquema para traer velocidades de red a través de Australia en línea con el día moderno. Si algo el proyecto ha tardado más de lo necesario, y todavía la oposición clama a costa. Si nuestros recortes han sido por algo, los gastos como estos valen la pena."
 AST_back_in_black: "Regreso en negro"
 AST_back_in_black_desc: "Sin señalar los dedos, nuestro gasto se ha vuelto imprudentemente exagerado. El desperdicio estriba en nuestro presupuesto, y ningún gobierno debe tener que pagar por los pecados del anterior. Todas las paradas tienen que ser arrastradas para traernos de vuelta al negro, y mantener la inflación baja. Sin «si», sin «peros». El fracaso no es una opción aquí y no fallaremos."
 AST_slam_the_door_on_them: "Golpea la puerta en ellos"
 AST_slam_the_door_on_them_desc: "Con cuánto ha aumentado nuestro bienestar, nuestro primer orden de negocio debe estar examinando los criterios de elegibilidad de nuestros servicios de discapacidad. El aumento de los requisitos a un nivel razonable debe arrancar algunos de los freeloaders que de otro modo no están necesariamente necesitados del apoyo, y la poda de unos pocos programas desperdicio traerá el gasto de nuevo a un nivel más aceptable."
 AST_scrounge_a_penny: "Scrounge a Penny"
 AST_scrounge_a_penny_desc: "En la búsqueda de exprimir los ahorros de cualquier manera que podamos, a veces tienes que ser creativo, especialmente cuando se trata de recaudar impuestos. Aludly announcing a tax hike es una manera segura de reducir nuestro apoyo cuando todavía estamos empezando. En su lugar, si subimos silenciosamente el impuesto medicare del 1,5% al 2%, los que pagan por él apenas habrá notado, y habremos acumulado un poco de financiación adicional para el presupuesto."
 AST_digitise_the_tvs: "Digitizar los canales"
 AST_digitise_the_tvs_desc: "Después de que el programa piloto en Mildura resultó ser un éxito, estamos sacando el resto del cambio por todo el país, reemplazando las viejas conexiones con cajas de configuración. El despliegue es manejado completamente por nosotros, y debe permitir incluso a los australianos rurales acceder a una gama de canales nuevos en gran calidad. La gran igualación del entretenimiento comienza aquí."
 AST_our_own_white_paper: "Nuestro propio Libro Blanco"
 AST_our_own_white_paper_desc: "La Fuerza de Defensa de Australia ha desempeñado un papel central como el escudo sagrado de innumerables naciones, cerca y lejos. A medida que las demandas de protección han crecido, también tiene el presupuesto, y ninguna parte del gobierno está a salvo de la despilfarro. El ejército seguirá siendo tan eficaz como siempre, pero será necesario llevar a cabo un escrutinio duro de las deficiencias."
 AST_plain_cigarette_packaging: "Plain Cigarette Packaging"
 AST_plain_cigarette_packaging_desc: "Fuera de nuestros recortes de gasto, abordar la crisis del cáncer ha sido una de nuestras mayores prioridades. Los anuncios oficiales han hecho su parte, pero la disponibilidad de cigarrillos en casi todas las tiendas sigue siendo un problema fundamental. En lugar de prohibir abiertamente el tabaquismo, sustituir los embalajes de marca por mini-advertencias que advierten de los peligros del fumar va a hacer imposible ignorar la asociación con el cáncer. \n\nMantendrá a los padres responsables, y asustará a la juventud."
 AST_put_the_squeeze_on_them: "Put the Squeeze On"
 AST_put_the_squeeze_on_them_desc: "Parte de nuestra reforma estatal de la salud ha estado revisando los gastos actuales manejados por los estados, y enmendarlos para ofrecer mejor atención de manera oportuna y eficiente. Esta vez presentaremos un tipo diferente de revisión, dirigida a eliminar los residuos del gasto. Igual que la última vez, probablemente nos pelearán por ello, pero eventualmente vamos a sacar cada gota de ellos de vuelta al presupuesto."
 AST_australia_works: "Australia trabaja"
 AST_australia_works_desc: "Promptly llamado, el programa pretende incorporar la base de 'Work For the Dole' en un gobierno dirigido, Servicio de construcción a nivel estatal, Prestación de un trabajo coherente a las personas en materia de bienestar social, y la creación de nuevos empleos para mantener a flote a la industria de la construcción actualmente en disminución, pero necesario para traer a nuestro país de nuevo en camino"
 AST_free_the_market: "Un mercado más libre"
 AST_free_the_market_desc: "En este momento nuestra hermosa nación está siendo ahogada por un gobierno sobrecargado, y un sector privado huido. Estamos retrasados y al mismo tiempo nos negamos a permitir que las empresas crezcan por su cuenta. Limitar ese agarre reduciendo el estrangulamiento fiscal y privatizando nuestros espacios de oficina no utilizados, será la revitalización que necesitamos y permitirá que el libre mercado tome su curso."
 AST_mediate_with_the_mines: "Mediar con las minas"
 AST_mediate_with_the_mines_desc: "La relación entre el Partido Laborista y las minas se nos ha entregado en un estado menos que ideal. Tiene que ocurrir un cambio serio si vamos a trabajar junto con ellos para reformar, y el lugar para empezar está en medio. Organizar una variedad de eventos para discutir las demandas y la oportunidad de colaboración va a sentar las bases para nuestro trabajo en marcha."
 AST_endorse_the_magnates: "Endorse los Magnetes"
 AST_endorse_the_magnates_desc: "Uno de nuestros mayores CEOs mineros, Gina Rinehart, se ha acercado directamente a la administración para suavizar su petición de traer a 1700 trabajadores extranjeros cualificados, complementando las minas recién creadas en Australia Occidental. Gina no ha sido más que apoyar a nuestro nuevo gobierno hasta ahora, y salir al pie derecho con ella podría ser el lugar adecuado para empezar si vamos a tango con las minas."
 AST_entice_competition: "Competencia de talento"
 AST_entice_competition_desc: "Si los sindicatos están preocupados por la formación de monopolios, abra el mercado a empresas extranjeras. La competencia ha moderado economías durante siglos, y la economía australiana no es diferente. Ser una mezcla de ideas es parte de lo que construyó este país en primer lugar."
 AST_minerals_resource_tax: "Impuesto sobre recursos minerales"
 AST_minerals_resource_tax_desc: "El impuesto de Super Profits era demasiado ambicioso y fue entregado en el peor momento posible. Tenemos que cooperar con las industrias mineras si lo estamos haciendo fuera de esta bajada en una sola pieza. La cooperación nos ha proporcionado esta poca legislación. Verdaderamente no es suficiente para despojarnos en la monopolización de nuestros recursos, pero tendrá que hacerlo por ahora."
 AST_bauxite_investment: "Inversión de Bauxite"
 AST_bauxite_investment_desc: "El aluminio resulta ser uno de los metales más importantes del siglo XXI. Está en todas partes, es increíblemente útil, y tenemos mucho de esto aquí. Es afortunado que una propuesta de tal mina haya aterrizado en nuestro escritorio, presentada para nuestra consideración bajo la solicitud de inversión. Cuando una oportunidad como esta se presenta, es prudente no rechazarla."
 AST_pilbara_expansion: "Expansión de Pilbara"
 AST_pilbara_expansion_desc: "La mayoría de las solicitudes de tierras mineras se manejan a nivel local, sin embargo, una solicitud ha llegado para un sitio en Pilbara que pasa a cruzar la frontera de uno de los parques nacionales allí. El sitio está bastante lejos de cualquier lugar de conservación, pero el caso se encuentra actualmente en la corte alta. Es posible que podamos poner nuestro peso en las escalas y acelerar su aprobación, en interés de nuestra economía por supuesto."
 AST_ease_on_restrictions: "Facilidad en las restricciones"
 AST_ease_on_restrictions_desc: "Muchos proyectos mineros cada año son desechados por restricciones ambientales. Incluso los lugares de excavación más pequeños pueden ser eliminados sobre zonas de protección o nueva legislación climática. En este momento la mayor desaceleración del crecimiento económico es una falta de disponibilidad. Un concepto ridículo considerando el tamaño de Australia. Esto debe enmendarse."
 AST_train_it_out: "Entrenarlo."
 AST_train_it_out_desc: "La escena minera en Australia Occidental está prácticamente rogando por líneas ferroviarias pesadas de acceso abierto, conectando minas remotas, como el Pilbara, a puertos. Construir nuestras propias líneas de gobierno rompería el monopolio que los gigantes sostienen sobre la infraestructura ferroviaria, y permitirá a decenas de mineros de nivel medio y inferior llevar su producto al puerto, aumentando drásticamente nuestros volúmenes nacionales de exportación."
 AST_champion_the_mets_sector: "Campeón del METS"
 AST_champion_the_mets_sector_desc: "Con lo racionalizado que nuestra nación se ha convertido en para los esfuerzos mineros, las corporaciones han comenzado a tratarlo como un «cuarto al mundo», por así decirlo. Donde la extracción de recursos se ha convertido en una búsqueda estrecha. Australia necesita ser vista como el Silicon Valley de la tecnología minera. \n\nFinanciar las organizaciones METS (Mining Equipment, Technology and Services), y dirigir nuestro propio R&D a la minería de operaciones remotas, acelerará el desarrollo del transporte autónomo y evolucionará nuestras técnicas actuales para la extracción. El futuro de la minería se hará aquí."
 AST_the_australian_century: "El siglo australiano"
 AST_the_australian_century_desc: "Las edades de oro raramente se tropiezan, o una casualidad afortunada. Son el resultado del trabajo puesto en más de décadas o incluso siglos, y pocas veces, si alguna vez, ellos hastatuan. A diferencia de las naciones de la historia, nuestro gobierno no tropieza en la oscuridad. Todo lo que hacemos hoy ha sido años en la elaboración, y nuestro éxito ha sido cuidadosamente planeado desde el principio. Ahora es nuestro momento."
 AST_the_foreign_ministry: "Ministerio de Relaciones Exteriores"
 AST_the_foreign_ministry_desc: "El aumento de Asia, y en particular China, ha puesto a Australia en una posición perpetua «más baja» económicamente que los que nos rodean. Mientras que esto podría ser una realidad alarmante para algunos, el siglo XXI no será una continuación de la unipolaridad, y esto trae consigo una caída de oportunidades para nosotros. Si estamos dispuestos a competir y superar nuestras predilección, el Pacífico es un mundo nuevo para explotar o abrazar al beneficio de nuestra nación."
 AST_foreign_minister_rudd: "Ministro de Relaciones Exteriores Rudd"
 AST_foreign_minister_rudd_desc: "El ex líder podría ser el más experimentado en asuntos extranjeros que tenemos en nuestra lista. Kevin Rudd ha pasado décadas cultivando un diálogo con las naciones asiáticas, y ya ha desempeñado un papel crucial para el gobierno en el crecimiento más interrelacionado. Rudd ha propuesto una serie de giras diplomáticas para fortalecer nuestra posición, y presentar a Australia como la rama del olivo del Pacífico."
 AST_papua_residency: "Papua Residency"
 AST_papua_residency_desc: "La economía de Papua se ha incorporado lentamente con la nuestra en todos menos un acuerdo oficial. Rectificar que mediante la negociación de un pacto económico completo finalmente sellará el acuerdo."
 AST_soften_the_emerald: "Suavizar la Esmeralda"
 AST_soften_the_emerald_desc: "Para una nación vecina tan cercana, usted esperaría que la relación entre nosotros sea mutuamente chipper. Desafortunadamente el grifo sólo ha crecido hasta tarde, y enviar a Rudd para arreglar las cosas podría ser la única manera de salvar las relaciones."
 AST_the_new_bear: "El nuevo oso"
 AST_the_new_bear_desc: "Toda la naturaleza de Rusia ha cambiado en sus años post-soviéticos. El país ha aceptado lentamente la ideología del capitalismo, y ha permitido los intereses extranjeros bajo su abrigo de piel. Esta podría ser nuestra oportunidad de plantar nuestra bandera diplomáticamente, y organizar algo que nos favorezca, a pesar de la distancia entre nosotros."
 AST_entente_with_north_korea: "Entente con Corea del Norte"
 AST_entente_with_north_korea_desc: "Rudd ha propuesto un viaje a la zona desmilitarizada coreana para conocer al líder norcoreano con la esperanza de acercar las dos naciones a la coexistencia pacífica. Tal vez esté llegando a las estrellas un poco, pero el plan es una especie de sonido, y serán las primeras overtures que hemos hecho directamente con los norcoreanos."
 AST_foreign_minister_smith: "Ministro de Relaciones Exteriores Smith"
 AST_foreign_minister_smith_desc: "Stephen Smith ha sido un miembro prominente del partido desde Keating, y fue el primero en ofrecer sus servicios al ministerio extranjero. Su política se alinea bastante bien con la nuestra en que Smith quiere que Australia emerge como el punto de intersección del comercio en el Pacífico. Utilizar el nuevo mundo como punto de crecimiento para nuestra relevancia económica en el extranjero de cualquier manera que beneficie al país."
 AST_our_glowing_deposits: "Nuestros depósitos de guante"
 AST_our_glowing_deposits_desc: "Los depósitos están allí, simplemente necesitamos exportarlos. Nuestro cliente actual nos ha estado advirtiendo por los derechos minerales durante un tiempo, y es justo que ofrezcamos las mercancías."
 AST_the_best_of_both_worlds: "El mejor de ambos mundos"
 AST_the_best_of_both_worlds_desc: "Naveguemos un complejo acto de equilibrio, manteniendo una profunda alianza de seguridad y defensa con los Estados Unidos, mientras perseguimos la interdependencia comercial estabilizada con China. Evitar ser forzado a elegir entre los dos es cómo hemos logrado mantenernos a flote."
 AST_made_in_vietnam: "Hecho en Vietnam"
 AST_made_in_vietnam_desc: " Era una extraña sensación para muchos australianos cuando miraban hacia abajo las mercancías que siempre compraron y de repente vieron el pequeño texto en la parte inferior diciéndoles que no estaba hecho aquí, pero en lugar de un lugar llamado «Vietnam.» No era fácil de tragar, pero cuando sus bolsillos estaban más llenos y las tiendas tenían más variedad, rápidamente lo superaron."
 AST_foreign_minister_carr: "Ministro de Relaciones Exteriores Carr"
 AST_foreign_minister_carr_desc: "Bob Carr podría ser el mayor realista de nuestra lista, o al menos el más pragmático. En su núcleo, Carr cree que la política exterior es una serie de improvisaciones. Australia está obligada a hacer frente simultáneamente a su búsqueda de recurrir como centro moral en el Pacífico, mientras que al mismo tiempo no tiene miedo de ensuciar sus manos para proteger nuestros intereses. Cómo equilibramos esa es la prueba real."
 AST_smother_the_pot: "Stir el Pot"
 AST_smother_the_pot_desc: "Los intereses australianos se han enredado tanto en el Oriente Medio que cualquier cosa que suceda allí nos afecta aquí. La última década ha convertido una olla hirviendo de tumulto en un fuego que no podemos permitirnos mantenernos alejados."
 AST_the_big_boys_club: "El Big Boys Club"
 AST_the_big_boys_club_desc: "Hay 5 puestos permanentes en el Consejo de Seguridad de las Naciones Unidas y unos 15 puestos no permanentes, que se ocupan cada pocos años. La política que afecta al mundo entero se decide en las cámaras de la ONU entre esos países. Con nuestras propias responsabilidades tan fuertemente entrelazadas con el resto del mundo, es justo que tengamos un asiento en la mesa. Tenemos que trabajar para aumentar nuestras probabilidades de entrar."
 AST_global_weapon_trading: "Comercio mundial de armas"
 AST_global_weapon_trading_desc: "Carr está utilizando nuestra posición en la ONU para abogar fuertemente por un tratado mundial sobre el comercio de armas, destinado a rastrear y reducir el suministro de armas a estados desfavorables y grupos terroristas, al tiempo que hace más atractivas las ventas de armas de nosotros mismos y otras naciones occidentales. Es codicioso, pero ahora está reuniendo apoyo en Nueva York para conseguirlo."
 AST_myanmar_intervention: "Myanmar Intervención"
 AST_myanmar_intervention_desc: "El colapso de Myanmar se ha convertido en una pesadilla humanitaria. Cualquier opción que hagamos para involucrarnos va a tener sus propias consecuencias, tanto como permanecer fuera de ella lo hará."
 AST_consuls_of_peace: "Cónsuls of Peace"
 AST_consuls_of_peace_desc: "El destino de Australia está firmemente arraigado en la cooperación mundial. Nuestras misiones en el extranjero y las operaciones de mantenimiento de la paz han sido invariablemente con el objetivo de alentar y, ocasionalmente, restablecer el orden basado en normas. Es un papel que nos esforzamos, y una reputación que debemos preservar."
 AST_centurians_of_the_pacific: "Pacific Centurians"
 AST_centurians_of_the_pacific_desc: "Las reglas de la intervención global han cambiado desde el comienzo del nuevo siglo. La seguridad nacional ha ocupado el lugar de las libertades civiles tradicionales, y el marco para la prevención ha sido adoptado por casi todos los países occidentales tras ataques fundamentalistas. No hacemos nuevos amigos ni protegemos a este país al limitarnos a las reglas de antaño, pero nos hacemos un objetivo si no reaccionamos adecuadamente."
 AST_the_costello_government: "El Gobierno de Costello"
 AST_the_costello_government_desc: "Australia tiene más de 100 años ahora, y ha llegado un largo camino desde la federación. Con una población sólo una fracción de nuestra nación vecina, nuestra economía se está convirtiendo rápidamente en uno de los más grandes del mundo a pesar de eso. Nuestro pueblo ha visto al país alrededor de ellos crecer más rico y más próspero que las generaciones anteriores jamás soñadas, y sin embargo las verdaderas riquezas permanecen intactas. \n\nNuestro potencial permanece justo debajo de la superficie, como una vena de aceite, esperando ser abierto. La gestión monetaria de las minas ha cesado, y muchas de nuestras mayores industrias se han vuelto complacientes. El bienestar se ha convertido en un peso muerto en nuestro presupuesto, y las pequeñas empresas todavía luchan una batalla cuesta arriba para acceder a un mercado cada vez más reducido. \n\nLa forma de nuestra gobernanza tiene que cambiar."
 AST_a_bastion_for_commerce: "A Bastion for Commerce"
 AST_a_bastion_for_commerce_desc: "A medida que las naciones conectadas por el Pacífico crecen más cerca, la demanda de un punto medio para el comercio se ha vuelto más evidente. Australia tiene ahora la oportunidad de ser un faro para el comercio, vinculando varias economías a un puerto, como Constantinopla y Venecia antes que él."
 AST_bring_in_the_chains: "Bring in the Chains"
 AST_bring_in_the_chains_desc: "Nos hemos beneficiado mucho de la importación de culturas de lejos y ancho. Las corporaciones no tienen ninguna excepción a esto. Ya tenemos una línea fuera de la puerta de los que solicitan instalar tienda. Digo que los dejemos."
 AST_domestic_demands: "Demandas domésticas"
 AST_domestic_demands_desc: "La opinión de que nosotros y los obreros del cuello azul de nuestra nación comparten es que la industria local importa. Una industria nacional fuerte debe ser capaz de hacer frente a cualquier crisis económica mundial, y por lo tanto, con un poco de cuidado, lo hará."
 AST_outsource_the_troubles: "Proporcione los problemas"
 AST_outsource_the_troubles_desc: "La escasez de puestos de trabajo se ha convertido en nuestro mayor obstáculo para el crecimiento continuo en los últimos años. Simplemente no tenemos suficientes trabajadores para llenar la brecha, y cualquier solución a largo plazo va a dejar pasar nuestros mejores años de expansión. Tenemos que mirar al extranjero."
 AST_come_one_come_all: "Vengan, vengan."
 AST_come_one_come_all_desc: "Nuestro dinero necesita permanecer dentro de Australia, al menos nuestros salarios lo hacen. La mejor manera de enchufar la brecha en nuestro empleo es tender a la línea inferior. Miles quieren probar su mano trabajando en Australia. Sólo tenemos que abrir la puerta."
 AST_off_with_tariffs: "Unburden el mercado"
 AST_off_with_tariffs_desc: "La economía liberal ha dado a luz el concepto de «abundancia».La idea de que los mercados más libres y la oportunidad más libre para gastar su dinero inevitablemente resultan en una sociedad mejor. Un concepto equivalente que nuestros negocios están ansiosos de probar. Los impuestos onerosos que aún permanecen deben ser despojados."
 AST_negotiate_with_the_rba_ast: "Negociar con el RBA"
 AST_negotiate_with_the_rba_ast_desc: "Un poco dulce hablar con el Banco de Reserva podría conseguirnos la palanca que necesitamos para traernos una marea económica. Afortunadamente tenemos las conexiones necesarias para persuadir al banco a reducir los tipos de interés, e incentivar el gasto de consumo mientras tanto."
 AST_fix_the_trade_woes: "Arreglar las condiciones comerciales"
 AST_fix_the_trade_woes_desc: "Si bien la importación y exportación de mercancías a través de nuestra nación ha aumentado a enormes niveles en un período muy corto de tiempo, también ha crecido la confusión general con nuestro sistema comercial entre nuestras empresas. Los déficits comerciales y la gestión ineficiente están obstaculizando nuestros márgenes de ganancia, y disminuyen los procesos del comercio. Se requerirá la creación de una nueva agencia. Uno dedicado a suavizar todo el proceso."
 AST_adventure_in_the_usa: "Adventure in the USA"
 AST_adventure_in_the_usa_desc: "Estados Unidos siempre ha sido, y puede ser siempre, nuestro mayor inversionista. La tierra del mac grande, el hogar de los libres, y amigo para todos. Estaríamos mal si no fuéramos a ellos para el próximo paso en nuestra evolución económica."
 AST_im_an_oil_man: "I'm an Oil Man"
 AST_im_an_oil_man_desc: "Llora que deberíamos tener nuestro propio desarrollo petrolífero en este país. Tenemos los pozos, y tenemos el paisaje para ello. El proceso simplemente ha tardado demasiado, y por nuestro gobierno se levantarán esas botas. Más aceite fluirá."
 AST_for_queen_and_company: "Para Queen and Company"
 AST_for_queen_and_company_desc: "Nuestras overtures en los estados han recortado el agua suficiente para atraer a algunas corporaciones inglesas a expandir su participación en nuestro sector agrícola."
 AST_rail_endeavors: "Ferrocarril Endeavors"
 AST_rail_endeavors_desc: "Hemos trabajado junto a la Corporación Bechtel para nuestras líneas ferroviarias de larga distancia antes, ahora ellos y los gobiernos estatales están buscando folletor un proyecto de investigación del desarrollo juntos. Ya han ofrecido especificaciones para nuevos modelos eléctricos y diesel. Ahora solo tenemos que firmarlo."
 AST_the_miracle_economy: "La economía milagrosa"
 AST_the_miracle_economy_desc: "Ya los medios de comunicación se refieren al éxito de nuestra economía como un milagro en estos tiempos. Por supuesto, no es un milagro. Nuestro éxito siempre se ha empeñado en nuestro juicio y nuestra atención sigue siendo sólida. Así que, como un jardín bien mantenido, el resultado de nuestra gestión ha florecido en algo espectacular."
 AST_ride_the_bubble: "Paseo por el Bubble"
 AST_ride_the_bubble_desc: "Cuando la burbuja de punto-com golpeó unos años atrás se sentía como que el cielo estaba literalmente cayendo sobre nosotros. Los precios de las acciones se acumularon sobre miles de millones en la inversión en computación repentinamente aparecieron, y miles de millones más se perdieron con él. Esta vez nos aseguramos de que el terreno sea firme para calcular las inversiones, con infraestructura para apoyar el crecimiento y la regulación más ligera necesaria para evitar que el sistema se estrelle nuevamente."
 AST_silicon_dreams: "Silicon Dreams"
 AST_silicon_dreams_desc: "La ambición de un día convirtiéndose en una nación tecnológicamente independiente comienza con nuestra capacidad para fabricar fichas comerciales. A partir de pequeña escala, podemos prescindir de fondos para grupos de investigación de chips y permitir que una instalación de prueba en Victoria arranque las cosas."
 AST_jobs_for_the_needy: "Trabajos para los necesitados"
 AST_jobs_for_the_needy_desc: "La supervisión de la realización del trabajo Para el Dole es algo que todavía estamos pagando el precio por ahora. Los trabajadores nunca deberían haber sido quitados de las industrias privadas para ser utilizados en obras públicas. Todo el punto de bienestar debe ser conseguir a los que pueden trabajar, en el trabajo. Un nuevo programa tendrá que ocupar su lugar."
 AST_keep_it_competitive: "Mantenlo Competitivo"
 AST_keep_it_competitive_desc: "Cuanto más crecemos industrialmente, mayor es el riesgo de un mercado inclinado. Los monopolios pueden convertirse en flagelos si los dejamos, y el triste hecho es que la regulación es lo más cercano a una defensa segura en la batalla contra ellos. Podemos trabajar a nivel estatal para coordinar la política e ir desde allí."
 AST_shatter_the_iron_curtain: "Destrozar la cortina de hierro"
 AST_shatter_the_iron_curtain_desc: "La guerra fría terminó para Australia cuando nos estrechamos las manos con Mao en 73'. Hemos disfrutado de una amistad que ha durado cualquier partidismo del partido o crisis global desde entonces. Será necesario crear un foro para asegurar que el futuro de nuestras colaboraciones siga siendo seguro y por encima del consejo."
 AST_our_man_in_beijing: "Our Man in Beijing"
 AST_our_man_in_beijing_desc: "Alexander Downer, nuestro antiguo ministro de Relaciones Exteriores y ahora diputado, se ha acercado lo suficiente con el gobierno chino y su clase empresarial que algunos en nuestro propio partido han cuestionado dónde están sus lealtades. Sin embargo, necesitaremos su perspicacia para obtener algo significativo fuera de nuestra nueva asociación. Comenzando con el próximo vuelo a Beijing."
 AST_the_lithium_projects: "Proyectos Greenbushe"
 AST_the_lithium_projects_desc: "Los proyectos de litio de Greenbushe se han convertido en un desarrollo prometedor para nuestras comunidades australianas occidentales. Con la intención de producir 1 millón de toneladas anuales de litio por el final del proyecto, haciéndonos uno de los mayores exportadores de litio procesados del mundo para entonces. Todo lo que necesitan ahora es un pequeño empujón fiscal."
 AST_cater_to_investors: "Cater to Investors"
 AST_cater_to_investors_desc: "Los desarrolladores chinos representan más del 60% de nuestros propietarios extranjeros. Ese tipo de inversión está empezando a constituir la columna vertebral de nuestra industria del desarrollo de la tierra, y mantener sus intereses alineados es necesario para mantener esa relación sin problemas."
 AST_the_future_fund: "Fondo para el Futuro"
 AST_the_future_fund_desc: "La idea inicial para el fondo era ayudar a cubrir las superannuaciones de nuestro servidor público, pero el concepto podría muy bien ser utilizado para potenciar las inversiones extranjeras de nuestra nación. Ya se ha traído una cantidad sorprendente de inversores extranjeros, en particular el grupo belga Euroclear, y es hora de ponerlo en acción."
 AST_a_friendly_union: "A More Friendly Union"
 AST_a_friendly_union_desc: "Un sindicato que no ha estado desperdiciando nuestra espalda es el tipo europeo. Se han conseguido ganancias para organizar la reducción de las limitaciones en las ventas europeas de automóviles en nuestro país, al menos durante los próximos años. Una visita a la sede de la UE podría poner las cosas en marcha para nosotros, y dar a nuestros consumidores algunas nuevas opciones elegantes."
 AST_fechado: "Fechado!"
 AST_fechado_desc: "La creciente prosperidad de la economía minera brasileña no ha sido extrañada por nuestros industriales mineros, quienes nos han pedido que alimentemos las regulaciones de importación para el equipo minero. Haría poco en la forma de costarnos cualquier cosa, y nos acercaría a nuestros amigos en el G20."
 AST_the_republic_question: "Cuestión de la República"
 AST_the_republic_question_desc: "Desde nuestra federación, Australia ha seguido siendo el sujeto de facto de la corona inglesa. Nuestra constitución es monárquica, y nuestro jefe de estado sigue siendo el de los Reinos Unidos. Mientras que funcionó durante un período, el temperamento de los tiempos es democrático. No designamos a personas para que ocupen su cargo por herencia. En nuestra sociedad y en nuestro tiempo preferimos citas por mérito. \n\nAustralia tendrá el día como una nación verdaderamente independiente."
 AST_how_we_sell_it: "How We Sell It"
 AST_how_we_sell_it_desc: "Conseguir el apoyo popular para nuestro referéndum va a ser el obstáculo final en la carrera. Será necesaria una mayoría nacional de todos los votantes, y el apoyo de 4 de cada 6 de nuestros estados y territorios. Una hazaña imposible si no ganamos los corazones y las mentes del público. Necesitamos encender las máquinas de medios y empezar a reunir apoyo en persona."
 AST_send_it_through: "Envíenlo."
 AST_send_it_through_desc: "Después del fracaso del referéndum de 1999, el tema de una república se ha arraigado con la mayoría del parlamento como un presagio de mala suerte. Estamos en una desventaja significativa en comparación con la última vez. Es posible que tengamos que retorcer algunas muñecas para hacerla rodar."
 AST_our_commonwealth: "Nuestra Comunidad"
 AST_our_commonwealth_desc: "No podemos tirar casi dos siglos de historia y parentesco en el viento. Especialmente durante un período transitorio como este. Reafirmando nuestro compromiso con el Commonwealth podría aliviar las preocupaciones de algunos de los realistas todavía en la valla."
 AST_free_from_binds: "Gratis de Binds"
 AST_free_from_binds_desc: "Nuestra salida de la monarquía no se puede medir la mitad. Nuestros lazos con la corona deben ser cortados, y con ella la manta suave que nos mantuvo cómodos todos estos años. El cambio que necesitamos es el que deja los cortes y magulladuras después de romper a través del techo de vidrio. No será fácil."
 AST_run_the_games: "Correr los Juegos"
 AST_run_the_games_desc: "Cada cuatro años nuestro atletismo se adapta a competir en los Juegos del Commonwealth, un espectáculo multi-deporte no tan diferente a los Juegos Olímpicos, reuniendo a los de todo el mundo dentro de la Comunidad de Naciones. El tiempo puede ser justo para nosotros para pedir que se anfitriones los próximos juegos."
 AST_kowtow_to_the_crown: "Kowtow to the Crown"
 AST_kowtow_to_the_crown_desc: "Recibir una bendición oficial de la monarquía finalmente pondrá un pin en la facción opositora, aunque a costa de alienar a algunos de nuestros propios republicanos, pero cuando los votos empiecen a pasar difícilmente seguirán siendo críticos."
 AST_crossing_the_floor: "Cruzando el piso"
 AST_crossing_the_floor_desc: "Los cabezas del trabajo se van a reír de su camino al banco cuando escuchen que los necesitamos para el voto. No será fácil humillarlos, y sin duda harán sus demandas, pero el camino por delante es hacia adelante. Si lo queremos o no, son nuestros nuevos aliados por el momento."
 AST_approaching_the_governor: "Aproximación al Gobernador"
 AST_approaching_the_governor_desc: "El último paso del proceso. La situación es levemente incómoda, dada la naturaleza de entregar al Gobernador General su propia renuncia. Sólo podemos esperar que lo tomen bien."
 AST_a_shining_example: "Un ejemplo brillante"
 AST_a_shining_example_desc: "Necesitamos ser el ejemplo de una democracia exitosa para las naciones del Pacífico. Nuestro éxito en esta gran tarea será un testamento para aquellos no sólo en la región, sino lejos y ancho. Incluso en la edad de nuestro país podemos tirar los grilletes del control."
 AST_no_kings: "No Kings"
 AST_no_kings_desc: "Los mecanismos de nuestra nueva constitución deben reflejar las realidades de los cambios políticos modernos. Ningún sistema puede ser inmune a su deshacer, pero pueden ser resistentes. Los poderes se separarán y habrá supervisión, con salvaguardias de terceros para garantizar que las ideas autoritarias y reaccionarias sean puestas en control."
 AST_endow_the_arts: "Dotar de las Artes"
 AST_endow_the_arts_desc: "La libertad de expresión es uno de los pilares de la democracia, y ha sido desde la Stockade Eureka. Francamente cualquier inversión en las artes es típicamente un desperdicio, pero si hay algo que necesitamos ser vistos como sensibles hacia ahora mismo, es la cultura."
 AST_hold_onto_the_wild: "Manténganse en el Salvaje"
 AST_hold_onto_the_wild_desc: "En un esfuerzo por fomentar una mayor silvicultura en los suburbios, se concederá a los terratenientes que opten por reservar parte o toda su tierra para la conservación en perpetuidad una menor responsabilidad fiscal como parte del impuesto sobre las ganancias de capital. Mientras tanto, podemos asegurar que las protecciones de parques nacionales estén codificadas en nuestra nueva constitución. Mantenerlos a salvo durante décadas por venir."
 AST_a_generation_to_persevere: "A Generation to Persevere"
 AST_a_generation_to_persevere_desc: "El futuro de nuestra nación está enteramente en manos de las generaciones después de nosotros. Atender a ellos y asegurar que se les dé el conocimiento suficiente para prosperar equivale a garantizar nuestro modo de vida prevalece. La educación debe convertirse en un derecho constitucional, dotado por nuestro commonwealth."
 AST_enshrine_the_protections: "Enshrine las protecciones"
 AST_enshrine_the_protections_desc: "El siguiente paso en la modificación de nuestra constitución debe ser un paso trascendental. No sólo en los sistemas de gobierno, sino también para nuestros ciudadanos. Nuestro más vulnerable no debe tener su nivel de derechos determinado por quien se sienta en la silla más grande de Canberra. Deben estar consagrados en la Constitución y ser permanentes para el futuro previsible. \n\nAustralia no es un país donde los pocos están protegidos, pero donde todo el mundo está. Parada completa."
 AST_modernize_the_communities: "Modernizar las comunidades"
 AST_modernize_the_communities_desc: "Tenemos una serie de programas en el oleoducto destinados a embalar más contratos hacia nuestras comunidades de bajos ingresos, destinados a traer más trabajo a aquellos sin, y mejorar la imagen de ciudades más pequeñas y luchadoras."
 AST_with_heritage_to_remember: "With Heritage to Remember"
 AST_with_heritage_to_remember_desc: "El camino de la reconciliación está en muchos sentidos llegando a su siguiente fase. La mano de apoyo tendrá que llegar de nuevo, pero esta vez para otorgarse. \n\nModificar la constitución para permitir que los propietarios locales tradicionales puedan negociar tratados formales relacionados con la preservación y la soberanía sobre la tierra, junto con los derechos de aprobación del desarrollo, entreguen las riendas de la reconciliación a la comunidad. Dar a las comunidades locales el derecho a su propio futuro y la capacidad de salvaguardar su pasado."
 AST_one_last_push: "Un último empujón"
 AST_one_last_push_desc: "Tenemos el mandato. Los votos están siendo contados. Sólo podemos esperar que la historia esté de nuestro lado esta vez."
 AST_a_new_constitution: "Una nueva Constitución"
 AST_a_new_constitution_desc: "La próxima era de la gobernanza australiana está por delante. El paso que hacemos ahora, aburrido, tal vez incluso un poco de locura, establece el escenario para los libros de historia. Sobre esta roca estamos construyendo el futuro de la nación, nuestra nueva constitución."
 AST_the_mining_snag: "La trampa de la minería"
 AST_the_mining_snag_desc: "Verdaderamente la industria minera ha sido tratada con abismo más de unas pocas veces en los últimos años, aunque no podemos ignorar los pecados del sector. Hay que entender entre nosotros, entre las necesidades del gobierno y los derechos de los industriales. Una tregua será corregida."
 AST_a_little_of_this: "A Little of This"
 AST_a_little_of_this_desc: "Algunas grandes empresas con apuestas en las minas también se invierten en la industria maderera. Una industria que después de años de retroceso por grupos ambientales le ha despojado de sus ganancias. Abrir algunos de los bosques estatales para la cosecha y dejar caer una regulación o también puede ganarnos algo del favor que necesitamos."
 AST_formal_investigation: "Investigación formal"
 AST_formal_investigation_desc: "La coacción sistémica y la lucha por los cerdos son el resultado más común de que la industria minera se vuelva demasiado politizada. No podemos eliminar toda la podredumbre, pero podemos sacudir las cosas con una comisión formal en las minas, dirigida a descubrir algunas de las más exageradas corrupción en la superficie."
 AST_for_a_bit_of_that: "For a Bit of That"
 AST_for_a_bit_of_that_desc: "Todas las denuncias de las minas suelen ser excesivas. Lo presionan, sus campañas mediáticas se oponen. Han estado prácticamente en nuestra puerta golpeando para eliminarlos. Mientras están en ello, ofreciéndoles un retroceso temporal podría abrir sus mentes a la reforma."
 AST_training_the_next_miners: "Entrenar a los próximos mineros"
 AST_training_the_next_miners_desc: "La formación profesional en TAFE debe proporcionarnos la medida más rápida para formar nuevos reclutas para la industria, con poco costo para ellos, e incluso un pequeño incentivo para aquellos que lo elijan."
 AST_when_opportunity_calls: "Cuando la oportunidad llama"
 AST_when_opportunity_calls_desc: "La oficina exterior ha regresado del Oriente Medio con una oferta directamente de la Casa de Saud con una interesante colaboración en nuestros esfuerzos mineros. Esto marca la primera interacción que hemos tenido con ellos sobre el tema, y todo lo que tengan en mente podría ser demasiado lucrativo para pasar."
 AST_tussle_with_the_media: "Tussle con los medios"
 AST_tussle_with_the_media_desc: "No podemos dejar que el cuerpo minero tenga todo lo que diga. Incluso con los medios de Murdoch contra nosotros, todavía podemos conseguir nuestra palabra con la prensa y exponer algunos de nuestros descubrimientos en la televisión nacional."
 AST_war_with_the_party: "Guerra con el Partido"
 AST_war_with_the_party_desc: "Con la fuerza actual de la campaña contra nosotros, algunos miembros del partido están empezando a dispersarse. O unirse a los medios de comunicación para rehusar nuestro gobierno o tratar de distanciarse de nosotros. Tenemos que ir a la ofensiva. Redondear a los desertores y aislar las bocas fuertes de los medios. Hazles saber que todavía estamos a cargo."
 AST_no_gas_all_breaks: "No Gas All Breaks"
 AST_no_gas_all_breaks_desc: "Tenemos que romper con la tradición partidaria de patrocinio a las minas. Las oportunidades en nuestro sector renovable están evolucionando y mejorando cada día. Iberdrola tiene una serie de plantas exitosas en Victoria actualmente. Con algún financiamiento y aprobación del gobierno van a establecer una tienda en toda la nación."
 AST_the_processing_debacle: "El Debacle Procesante"
 AST_the_processing_debacle_desc: "Como resultado de nuestros hallazgos, se nos ha puesto mucho peso para encontrar una solución para estos inmigrantes. No será una elección fácil, pero para nosotros rara vez lo es."
 AST_bowen_expansion: "Expansión de Bowen"
 AST_bowen_expansion_desc: "BHP ha hecho una solicitud para la aprobación expresa de su nuevo oleoducto en Queensland, Bowen Basin. Construido para acelerar masivamente su producción de acero allí. Un poco de retroceso ha surgido de grupos ambientales en relación con la ruta que atraviesa los hábitats de Koala, pero los representantes del proyecto nos han asegurado que el daño será mínimo."
 AST_fortescue_lines: "Líneas de Fortescue"
 AST_fortescue_lines_desc: " Nuestro mayor centro minero para mineral de hierro está situado en Australia Occidental y gestionado por la empresa Fortescue. Nos han invitado a invertir conjuntamente en su proyecto Magnetite, entregando mayores volúmenes de mineral con bajas emisiones. En este caso podría quitarnos algo de calor si estamos apelando tanto a las minas como a los ambientalistas."
 AST_secure_resource_tax: "Impuestos sobre recursos seguros"
 AST_secure_resource_tax_desc: "Por último, nuestro primer impuesto global sobre la renta de recursos destinado a hacer frente a algunas de las ineficiencias tributarias durante el boom minero. Con provisiones para asegurar que nuestras pequeñas empresas y minas no se vean obstaculizadas, una nueva corriente de ingresos fluirá en nuestro presupuesto sin afectar la productividad."
 AST_an_open_ear: "Un oído abierto"
 AST_an_open_ear_desc: "Las restricciones climáticas de nuestros predecesores han arrojado a toda la industria de golpe con lo limitado que se han convertido. ¿Cómo podemos esperar competir cuando las naciones de alrededor están pagando poco del costo? Es necesario promulgar una mano de regulación más suave, y se pondrá en marcha un reprensión de las restricciones actuales hasta que encontremos algo sensible."
 AST_olympic_dam_developments: "Desarrollos de las presas olímpicas"
 AST_olympic_dam_developments_desc: "La Corporación de Minería Occidental se ha acercado a nosotros con un esfuerzo conjunto de investigación, utilizando la mina de uranio en la presa olímpica. También hemos recibido protestas muy fuertes de la mina, desde dentro y fuera del Parlamento, sobre sus efectos en la comunidad local. Cualquier expansión de la mina y las instalaciones allí va a resultar en algún retroceso, pero es apenas algo que no podemos climatizar."
 AST_changing_the_system: "Cambiar el sistema"
 AST_changing_the_system_desc: "Hemos llegado lejos con nuestro manejo de la industria. Los beneficios están llegando ahora a través de la limpieza y en mayor volumen que nunca. Todavía se puede hacer mucho para mejorar la naturaleza de ella, pero por ahora podemos mirar atrás y admirar el trabajo."
 AST_the_turnbull_government: "El Gobierno de Turnbull"
 AST_the_turnbull_government_desc: "Este enfoque es un marcador de posición. ¡Un árbol de enfoque Turnbull está en desarrollo y será liberado pronto!"
 corroboree_event.1.t: "The Speech at Corroboree"
 corroboree_event.1.d: "Howard estaba detrás del anciano mientras daba la introducción de [GetASTLeaderTitle]. Daría su discurso en Corroboree. Algo que se había convertido en una firma de su estilo de campaña y líder desde entonces elegido. Esta vez, sin embargo, la multitud estaría fría. No hubo gritos impassionados mientras daba su retórica de 'conciliación práctica' y medía acercamiento. Muchos de la multitud habían estado esperando horas, y parecía que ninguno de ellos estaba impresionado por lo que parecían promesas más vacías de progreso. Unos pocos se marcharon, y algunos encadenaron mientras giraban la espalda en protesta. \n\nDespués del discurso, y se dio un aplauso tibio, Howard habló con los ancianos de largo. Él no dio concesiones para una disculpa, o cualquier movimiento que él vio como «adhesivos gestos.» Las partes eventualmente se fueron, y hubo un aire de decepción que colgó durante algún tiempo."
 corroboree_event.1.a: "Podría haber sido peor..."
 mining_giants_talk.1.t: "Una reunión con los Gigantes"
 mining_giants_talk.1.d: "Como se esperaba, los diversos jefes mineros han pedido que extiendamos nuestros recortes fiscales para aprovechar el auge de la minería en curso. Su razonamiento afirma que la financiación ahorrada les permitiría ampliar las operaciones a largo plazo. El corte adicional es pequeño e improbable descarrilar nuestras finanzas, pero podríamos decidir contra la solicitud y simplemente mantener las cosas iguales. Alternativamente podríamos aumentar la tasa tributaria para desahogar en algunos de los boom nosotros mismos, con poca consecuencia inmediata."
 mining_giants_talk.1.a: "Dales la reducción de impuestos."
 mining_giants_talk.1.b: "Mantengamos las cosas iguales."
 mining_giants_talk.1.c: "Sube la tasa de impuestos y el rastrillo en nuestra parte."
 civil_partnership_act.1.t: "La Ley de asociación civil pasa por todo el país"
 civil_partnership_act.1.d: "Reunidos fuera de Capital Hill miles de defensores fueron los primeros en presenciar a Peter Costello en dar a conocer que la primera legislación para el reconocimiento del matrimonio había pasado casi unánimemente. El proyecto de ley multipartidista pasó después de una encuesta postal nacional dio un impulso sin precedentes a la reforma. \n\nPresentada por la Coalición, que anteriormente sólo había reconocido los conceptos de matrimonio tradicional, y apoyada por casi todos los miembros del Trabajo y los Verdes, el paso vino como un shock para muchos de la multitud, quienes reaccionaron con una mezcla de lágrimas y alegría. Costello señaló que el acto no era sólo un paso para los derechos gays, sino «los derechos de todos los australianos», y que la puerta estaba abierta a la reforma en el futuro. Mientras que las parejas todavía tendrán que casarse fuera del país, los ya casados ahora podrán vincular legalmente su asociación."
 civil_partnership_act.1.a: "Bien por ellos."
 the_national_apology.1.t: "La disculpa nacional"
 the_national_apology.1.d: "Después de lo que parecía inicialmente como el recorte de los pies, John Howard entregó una 'apologación' nacional oficial por errores históricos contra la población indígena de la nación: los aborígenes y los isleños del Estrecho de Torres. \nEl gesto histórico, basado en el informe Bringing Them Home de 1997, fue presentado en la Cámara Parlamentaria por el [GetASTLeaderTitle] y ha enviado una onda de choque emocional a través de Australia. Crowds in the Great Hall and on the lawns outside Parliament animado and clapped. Varios miles de personas se reunieron en la lluvia para ver el discurso trascendental en las calles de Sydney. La comunidad ha sentido un profundo sentimiento de alivio y curación, y muchos en ella están aclamando los esfuerzos de reconciliación por parte de la coalición un éxito incuestionable."
 the_national_apology.1.a: "It's time to move forward."
 pacific_solution.1.t: "La solución del Pacífico"
 pacific_solution.1.d: "El Gobierno australiano se ha acercado a nosotros con una propuesta relativa a las instalaciones de procesamiento offshore. A cambio de acoger estos sitios, se han ofrecido a mejorar significativamente nuestra infraestructura local y las instalaciones portuarias navales para apoyar las operaciones."
 pacific_solution.1.a: "Aceptar la inversión de Australia."
 pacific_solution.1.b: "Nuestra soberanía no está en venta."
 pacific_solution.3.t: "Papua Nueva Guinea acepta"
 pacific_solution.3.d: "Agradecidamente el gobierno de Papua Nueva Guinea ha acordado nuestra propuesta. La construcción de las nuevas instalaciones de procesamiento comenzará rápidamente."
 pacific_solution.3.a: "Como se esperaba."
 pacific_solution.4.t: "Papua Nueva Guinea Declines"
 pacific_solution.4.d: "Nuestros vecinos han rechazado la propuesta, citando preocupaciones sobre soberanía y oposición local. Tendremos que encontrar otra manera."
 pacific_solution.4.a: "Disappointing."
 pacific_solution.5.t: "Nauru Acepta"
 pacific_solution.5.d: "El gobierno regional de Nauru ha aceptado nuestra propuesta. Otro paso en nuestras operaciones del Pacífico se ha ido sin un pinchazo."
 pacific_solution.5.a: "Como se espera"
 pacific_solution.6.t: "Solución Pacífico Rechazado"
 pacific_solution.6.d: "Nauru rechazó la propuesta. Parece que no serán útiles en nuestros problemas de inmigración y, en cambio, han renunciado a permanecer aislados en el Pacífico."
 pacific_solution.6.a: "Esto es desastroso..."
 stomp_out_the_roots.1.t: "Australia ofrece cooperación contra el terrorismo"
 stomp_out_the_roots.1.d: "El Gobierno australiano ha propuesto una iniciativa conjunta de seguridad centrada en la lucha contra la eliminación de las células extremistas dentro de nuestro país. Están ofreciendo un amplio apoyo táctico y compartir inteligencia."
 stomp_out_the_roots.1.a: "Coopera para un Indonesia más seguro."
 stomp_out_the_roots.1.b: "Podemos manejar nuestra propia seguridad interna."
 stomp_out_the_roots.2.t: "Indonesia Agrees to Cooperation"
 stomp_out_the_roots.2.d: "Yakarta ha aceptado formalmente nuestra propuesta. Nuestras operaciones en su territorio pueden comenzar inmediatamente, y nuestras agencias de inteligencia ya están manejando el movimiento."
 stomp_out_the_roots.2.a: "El comienzo de una sólida asociación."
 stomp_out_the_roots.3.t: "Iniciativa conjunta de Yakarta rechaza"
 stomp_out_the_roots.3.d: "El gobierno indonesio ha rechazado nuestro ofrecimiento de cooperación militar, prefiriendo manejar solo los asuntos."
 stomp_out_the_roots.3.a: "Su pérdida."
 state_visit: "Visita estatal"
 ast_off_to_delhi.1.t: "A Visit to India"
 ast_off_to_delhi.1.d: "Después de que Howard bajara del avión eran sonrisas y temblando a mano hasta el podio. Después de su independencia hemos mantenido relaciones entre sí. Suficiente para no ofender. Ahora nos reunimos por cuarta vez este mes. Los medios locales estaban disfrutando de la oportunidad de mostrar el llamamiento de la India a los líderes extranjeros, y no desperdiciaron tiempo para poner a Howard en sus políticas en casa. Eso no sería suficiente para alejar al gobierno. Estaríamos exportando uranio a un ritmo más alto que cualquier otra nación cercana podría, y sonreirían y asentirían con la promesa de ningún enriquecimiento, mientras sonrííamos. Al final del día este fue otro 'golpe' para Australia. Fuimos los que cosechaban los beneficios, y cada apretón de manos nos acercaba a ser el mayor exportador del Pacífico."
 ast_off_to_delhi.1.a: "Un ganar-ganar para ambas naciones."
 ast_trade_deal: "Concesiones comerciales"
 ast_trade_agreement: "Acuerdo comercial"
 refused_trade_deal: "Rechazar nuestro acuerdo comercial"
 marks_trade.1.t: "Comercio de Australia"
 marks_trade.1.d: "En un esfuerzo por fortalecer los vínculos económicos regionales, el gobierno australiano ha alcanzado una propuesta de acuerdo comercial «sin aranceles». La propuesta incluye restricciones menores a la importación de nuestra electrónica a cambio de derechos minerales exclusivos. Ambas naciones están de pie para prosperar significativamente por el aumento del flujo de bienes entre nosotros, sin embargo, la elección sigue siendo nuestra."
 marks_trade.1.a: "A prosperous partnership awaits."
 marks_trade.1.b: "Nuestros mercados deben permanecer protegidos."
 ast_our_capacity_for_peace.1.t: "Australia propone la Iniciativa para el Mantenimiento de la Paz"
 ast_our_capacity_for_peace.1.d: "Con el objetivo de salvaguardar la estabilidad del Pacífico, el gobierno de Canberra nos ha abordado con un plan para operaciones conjuntas de mantenimiento de la paz. La propuesta sería efectivamente una base para la cooperación militar entre nosotros, específicamente contra el terrorismo. La propuesta también incluye planes futuros para el intercambio de información. Podríamos aceptar la oferta ahora y hacer frente a cualquier cambio que sugieran en la línea, o podríamos rechazarla totalmente."
 ast_our_capacity_for_peace.1.a: "La paz es el único camino hacia delante."
 ast_our_capacity_for_peace.1.b: "Decidimos cómo se salvaguarda el Pacífico por nuestra cuenta."
 ast_our_capacity_for_peace.2.t: "Acuerdo Alcanzado"
 ast_our_capacity_for_peace.2.d: "Beijing ha respondido favorablemente a nuestra propuesta. Nuestra iniciativa de mantenimiento de la paz está oficialmente en marcha, y se han comprometido a unirse a nosotros pronto para solidificar el movimiento."
 ast_our_capacity_for_peace.2.a: "Mantendremos un buen ojo en ellos."
 ast_our_capacity_for_peace.3.t: "Propuesta rechazada"
 ast_our_capacity_for_peace.3.d: "El Gobierno de Beijing ha reunido con fría indiferencia nuestras fuerzas para un pacto mutuo de mantenimiento de la paz. Sus diplomáticos han respondido con preocupación por su propia soberanía en el Pacífico."
 ast_our_capacity_for_peace.3.a: "Entonces nos quedaremos solos."
 fossil_fuels.1.t: "Fósil de combustible para Yuan"
 fossil_fuels.1.d: "Australia ha propuesto una expansión masiva de las exportaciones de carbón para alimentar a nuestros crecientes sectores industriales. A cambio de tipos de cambio favorables, están listos para convertirse en nuestro socio energético principal."
 fossil_fuels.1.a: "Los motores de la industria requieren combustible."
 fossil_fuels.1.b: "Aseguraremos el carbón a nuestra manera."
 fossil_fuels.2.t: "Fósil de combustible para Yuan"
 fossil_fuels.2.d: "Sobre la base de nuestra actual iniciativa de mantenimiento de la paz, Australia ha sugerido un pacto comercial amplio. Al asegurar nuestras líneas de suministro de energía a través de este programa 'Fossil Fuels for Yuan', cementamos aún más nuestra seguridad energética y oferta."
 fossil_fuels.2.a: "Nuestra asociación crece aún más fuerte."
 fossil_fuels.2.b: "Su cooperación será suficiente."
 fossil_fuels.3.t: "Acuerdo de carbón firmado"
 fossil_fuels.3.d: "El gobierno chino se ha mostrado reacio a aceptar compromisos de combustible fósil a largo plazo. Por ahora han aceptado una modesta propuesta de exportación para abastecer sus reservas. Nuestro sector minero ya está preparando el acuerdo."
 fossil_fuels.3.a: "Excelente."
 fossil_fuels.4.t: "Propuesta de combustible fósil"
 fossil_fuels.4.d: "China ha rechazado todas nuestras ofertas para ampliar las exportaciones de carbón, citando sus deseos de independencia energética."
 fossil_fuels.4.a: "Una oportunidad perdida."
 fossil_fuels.5.t: "La contrapropuesta china"
 fossil_fuels.5.d: "Sorprendentemente, al recibir nuestra propuesta de ampliar las exportaciones de carbón, los delegados chinos contrarrestaron con una oferta propia. A prior trade agreements covering a vast range of Chinese electronics and goods in exchange for virtually tariff-free trade on our coal and other mineral exports. El resultado no pudo haber sido mejor para nosotros. Nuestros jefes de la industria se están moviendo para asegurar las exportaciones mientras el acuerdo está en pie."
 fossil_fuels.5.a: "Nuestra suerte continúa."
 ast_jap_trade.1.t: "Negociaciones comerciales con Australia"
 ast_jap_trade.1.d: "Las semanas de negociación con los australianos han producido la primera entrega de un acuerdo comercial amplio. Las características específicas incluyen la exportación de grandes cantidades de productos agrícolas a nuestras costas a cambio de reducir sus aranceles sobre nuestra electrónica y automóviles. Esto podría proporcionar un suministro constante de alimentos, pero podríamos aprovechar la oportunidad para impulsar más."
 ast_jap_trade.1.a: "Aceptar los términos propuestos"
 ast_jap_trade.1.b: "Exigir derechos prioritarios a sus preciosos minerales"
 ast_jap_trade.1.c: "Los términos son desfavorables"
 ast_jap_trade.2.t: "Acuerdo de comercio japonés firmado"
 ast_jap_trade.2.d: "La delegación de Tokio ha comunicado que las negociaciones han sido un éxito. Esta es la primera vez que el Japón ha negociado un acuerdo de asociación económica global o un acuerdo de libre comercio con una economía importante, mucho menos con nosotros. Esto marca un giro serio para nuestras relaciones, y puede sustentar una relación más fuerte durante muchos años por venir."
 ast_jap_trade.2.a: "¡Saludos!"
 ast_jap_trade.3.t: "Japón exige derechos minerales"
 ast_jap_trade.3.d: "Las negociaciones han dado un giro. Ahora están exigiendo acceso prioritario a nuestros valiosos depósitos minerales para apoyar su creciente industria tecnológica, y compensan el costo de rebajar los aranceles. Esto podría poner una grave tensión en nuestra propia disponibilidad de recursos internos, y hace que el acuerdo sea menos favorable en general. Podríamos empujarlos a volver al acuerdo original, pero podría arriesgarse por completo a las negociaciones."
 ast_jap_trade.3.a: "Acordar con sus nuevos términos y asegurar el acuerdo"
 ast_jap_trade.3.b: "Mantenga nuestra postura. Exigir el acuerdo original"
 ast_jap_trade.4.t: "Propuesta de comercio"
 ast_jap_trade.4.d: "La delegación de Tokio ha enviado una noticia de que las negociaciones han disminuido. Parece que se retiraron de la sala de juntas sin mucha idea de más discusión. Nuestros planes para un acuerdo están esencialmente muertos en el agua. Si bien esto pone un toque serio en nuestros planes para el comercio, puede haber otras vías que podemos explorar."
 ast_jap_trade.4.a: "Un revés para nuestro ahora"
 ast_jap_trade.5.t: "Australia es firme"
 ast_jap_trade.5.d: "Los delegados de Canberra se mantienen firmes en la oferta original, negando cualquier negociación por los derechos minerales. Han dejado claro que el acuerdo de oferta para las importaciones agrícolas a cambio de la reducción de aranceles es definitivo."
 ast_jap_trade.5.a: "Perhaps we were rash."
 ast_jap_trade.5.b: "Entonces no hay trato que hacer."
 base_state_visit.1.t: "Visita a los Estados Unidos"
 base_state_visit.1.d: "Howard había visitado anteriormente la Casa Blanca en 1999 durante algunas discusiones sobre aranceles. llovía entonces y, como simbólicamente, estaba lloviendo de nuevo. Hizo su camino por las puertas delanteras, después de reunirse con el presidente, a un grupo de periodistas con paraguas. Todo era grande en Estados Unidos. Sus tiendas eran grandes, sus iglesias eran grandes. La residencia para el presidente era especialmente grande. Australiano no tenía nada a ese equivalente en tamaño, y definitivamente no tan grande. Uno podría decir que estaban compensando por algo, pero realmente lo tenían todo, y eventualmente tendríamos que venir a la mesa para conseguir nuestra parte de eso. Si se trata de garantías para la defensa pacífica o la adquisición comercial, Australia tendría que demostrarse como un socio valioso. Como teníamos con Vietnam y Corea, estaríamos allí para el próximo."
 base_state_visit.1.a: "Por nuestra paz mental."
 base_state_visit.2.t: "Visiting China"
 base_state_visit.2.d: "Cuando Howard aterrizó en Pekín el primero en reunirse con él fue el primer ministro chino. Pasados los medios chinos a su alrededor, el principal les lleva a un restaurante acordonado cerca para discutir sus opciones de comercio. China era un socio muy ansioso para negociar, pero siempre había cavernas para trabajar con ellos. La realidad de su autoritarismo no fue olvidada por Howard, y era evidente en cada discusión que los chinos tenían que sentir como si estuvieran recibiendo la mano superior. Las negociaciones con ellos se convirtieron en un buen baile de esbozar el futuro que Australia quería y de alguna manera alinearlo con el suyo. Cada carta tenía que ser jugada antes de sus próximas conversaciones comerciales para mantenernos en un pie justo. Cuando ambos se levantaron para dejar a Howard se sentía seguro de que había jugado bastante bien."
 base_state_visit.2.a: "Y el escenario fue establecido."
 base_state_visit.3.t: "Normalización de los norcoreanos"
 base_state_visit.3.d: "Las discusiones con los norcoreanos eran únicas porque las bases no se habían establecido con la nación durante algunas décadas, y Howard estaba más o menos entrando en territorio inexplorado. Peor era la desconexión entre ellos. Cada compromiso se manejaría indirectamente a través de nuestras conexiones en China, que luego lo analizarían a los coreanos. Nunca había ninguna expectativa de una charla cara a cara, pero el hecho de que el mismo Howard nunca estaba hablando con un verdadero representante le dio a todo un tono extraño. Evento Finalmente acordaron una embajada en Canberra, que desde el principio hizo a Howard incómodo, pero si alguna vez iban a continuar las conversaciones tendrían que hacerse."
 base_state_visit.3.a: "Mejor que nada."
 base_state_visit.4.t: "Una visita de Corea del Sur"
 base_state_visit.4.d: "El Presidente surcoreano llegó temprano esa mañana en Canberra con un objetivo muy singular en mente. Australia llegó de la mano con los estadounidenses cuando estalló la guerra coreana. Desde entonces hemos sido una opción fácil para la seguridad de defensa en el Pacífico, y mientras su vecino norte tuviera armas nucleares, seguiríamos así. Esa misma pregunta se planteó. El presidente era cortés al respecto, pero eventualmente tendríamos que solidificar algo. Caminando por los Jardines Botánicos [KOR.GetLeader] habló de los problemas económicos en curso, y cómo las conversaciones norcoreanas se habían estancado. Mientras tanto, se acordaría un pacto comercial, pero nada más fue prometido."
 base_state_visit.4.a: "Tendrá que hacerlo por ahora."
 base_state_visit.5.t: "La Ceremonia de Gallipoli"
 base_state_visit.5.d: "La gente de Turquía siempre ha sido considerada acerca de la tradición Anzac. Supongo que es fácil cuando usted era el lado ganador ese día, pero han sido suficientemente comprensivos para designar un sitio para visitar cada año y honrar a los muertos. La mayoría ven la ceremonia como un momento para llorar, o tomar con ellos el significado de que la guerra es inútil y así sucesivamente. Pocos consideran el día como un derroche de alianzas internacionales, y que sin los británicos dejarnos en la península unos pocos cientos de miles podrían no haber muerto ese día. Nuestros líderes anteriores lo hicieron, mientras cambiamos de Inglaterra a América, y desde entonces el enfoque en las alianzas se ha inculcado en la política de cada partido. Afortunadamente Turquía ha permanecido como un amigo leal."
 base_state_visit.5.a: "No lo olvidemos."
 base_state_visit.6.t: "Visitas de la monarquía"
 base_state_visit.6.d: "Su Majestad la Reina Isabel II, acompañado por Su Alteza Real el Duque de Edimburgo, llegó a Australia como parte de sus celebraciones del Jubileo de Oro \n\nLa pareja real aterrizó en Adelaide el 27 de febrero de 2002 y visitará varias ciudades, incluyendo Cairns y Canberra, coincidiendo con la Reunión de Jefes de Gobierno del Commonwealth \n\nCrowds onving the British Union Jack flag animado de la galería pública establecida para la 13.ª visita de la reina, y alineado a lo largo de la ruta de 5 millas desde el aeropuerto hasta Admiralty House. Se espera que el [GetASTLeaderTitle] le dé la bienvenida pronto, y es posible que el referéndum republicano fallido esté en la lista de temas"
 base_state_visit.6.a: "Mantengamos las cosas civiles."
 rudd_state_visit.1.t: "Visiting Russia"
 rudd_state_visit.1.d: "Había pocos países en la tierra más grandes que Australia geográficamente. Ninguno argumentaría que la Federación de Rusia era uno de ellos. Howard no estaba listo para el frío cuando salió del avión. Después de dos días en el país, todavía lo huyó cuando salió y el viento helado soplaba a través de él. Varias personas se habían reunido fuera del hotel con banderas australianas y rusas, lo que era tranquilizador. Kevin Rudd había organizado esta reunión, y Howard sentía que fue arrojado al fondo. ¿Estaba luchando con el oso de la manera correcta? Se estaban alejando del choque económico de los 90. Teóricamente el presidente ruso estaría buscando cualquier ayuda comercial para mantenerlos a flote, pero Howard apenas sintió la bienvenida desde su llegada. Tendría que trabajar para convencerles de que el uranio australiano valía la pena las negociaciones."
 rudd_state_visit.1.a: "The beginning of something..."
 leaked_memo.1.t: "La memoria de plomo"
 leaked_memo.1.d: "De alguna manera, uno de esos journos consiguió una carta de uno de nuestros hombres del partido, Shane Stone, que por casualidad incluyó una serie de duras críticas a nuestro gobierno. El Guardián ya está pintando la frase «Mean and Tricky Howard» como su titular. No sé cómo salió pero los medios de comunicación están haciendo un circo en él, y ahora tenemos que ponernos al día para cubrir nuestros fines. Algunos del partido, incluyendo a Peter, están exigiendo que pongamos a Stone políticamente como una especie de búsqueda desesperada de la mafia. Hasta que la noticia de ello muera no podemos hacer nada, y esto disminuye gravemente nuestro impulso para el cambio. Si algo no puedo imaginarlo podría empeorar."
 leaked_memo.1.a: "¿Puede?"
 reconciliation_journey.1.t: "The Journey to Reconciliation"
 reconciliation_journey.1.d: "Howard y el equipo de medios se escabulló en la pequeña habitación donde uno de los concejales aborígenes estaba esperando. Se firmaron más papeles, y luego se presentaron para las cámaras. Mientras el concejal se volvió y estremeció la mano de Howard, el [GetASTLeaderTitle] notó lo duro que eran sus manos, cubiertas de callos y huesos. Su cara también parecía dura, pero sus ojos estaban acuosos. Howard podía ver los años de penuria en la cara del hombre, y esperar que se aferrara ahora. Cuidado con no perder. «Gracias, Sr. Howard.» Dijo antes de salir con los periodistas. \n\nEstaba solo ahora, y estuvo allí por un momento en el pensamiento. Había volteado en las políticas para la reconciliación más veces de lo que estaba cómodo, y sin embargo el país aparentemente era mejor para ello. Después de todo lo que había hecho, poco a poco, Australia finalmente estaba avanzando. Un sentido de satisfacción establecido para él mientras estaba allí en silencio. Evento Cada vez más gente mediática entró y el día continuó como normal."
 reconciliation_journey.1.a: "There's more to be done."
 ast_the_coalition_convention.1.t: "La Convención de la Coalición"
 ast_the_coalition_convention.1.d: "«Hemos logrado mucho, hemos conquistado la oposición. Australia está orgullosa y alta alrededor del mundo. Somos respetados por lo que hemos logrado con nuestra economía, y somos vistos como una nación dispuesta a tomar posición sobre cuestiones internacionales. Hay un hilo dorado que atraviesa tantas políticas de la Coalición, y ese es el gran principio de elección. Mayor elección para que todos los australianos elijan su futuro. Nuestra nación es más libre de lo que ha sido. Su gente está ganando más, comprando más y viviendo más orgulloso.» \n\n«El desafío que tenemos por delante es tan grande como lo fue cuando intentamos volver al cargo en 1996 y mientras buscamos de nuevo en las próximas elecciones. Mientras tanto, se puede hacer mucho para seguir mejorando el estado de nuestros gastos y la economía en crecimiento. Muchos partidarios están esperando más políticas para mejorar sus vidas y la vida de muchos más, dentro y fuera de Australia. Nuestra carga es inherente a nuestro núcleo moral. Somos una nación de dar a todos un 'camino justo'. Cada uno y cada uno de nosotros sabe nuestra responsabilidad de dirigir. Esa responsabilidad no ha cesado.»"
 ast_the_coalition_convention.1.a: "El desafío no ha terminado."
 the_white_paper.1.t: "Aplicación del Libro Blanco"
 the_white_paper.1.d: "El documento de Defensa 2000 fue realizado como un examen amplio de nuestras actuales capacidades militares, y las que demanda la administración actual. Con más peso sobre las capacidades defensivas de Australia como principal proveedor de seguridad y mantenimiento de la paz en el Pacífico, las demandas han sido predominantemente expandirse. No sólo personal. Mando, tecnológicamente, nuestra fabricación de armas, todos necesitan ser mejorados o ampliados. Afortunadamente, tenemos una serie de programas en desarrollo que podrían ayudarnos a lograr esto."
 the_white_paper.1.a: "Nuestra producción importa más."
 the_white_paper.1.b: "No podemos luchar sin nuestras fuerzas."
 the_white_paper.1.c: "Pueden manejar la demanda."
 the_white_paper.2.t: "Aplicación del Segundo Libro Blanco"
 the_white_paper.2.d: "Ya sea que estemos sufriendo de éxito o no, una vez más estamos obligados a comenzar la reestructuración con un objetivo inicial. La primera sugerencia ha sido una revisión de los métodos de movimiento que incorporan las unidades de campo para hacerlos más eficientes. También se sugirieron cambios en nuestra política de refuerzo. De lo contrario podríamos retroceder al alto mando para acelerar su investigación actual sobre nuestras doctrinas."
 the_white_paper.2.a: "El movimiento será nuestra clave."
 the_white_paper.2.b: "Siempre se necesitan refuerzos."
 the_white_paper.2.c: "De vuelta a la tabla de dibujo."
 lithgow_arms.1.t: "La venta de armas pequeñas Lithgow"
 lithgow_arms.1.d: "Thales ha ofrecido una suma para comprar y renovar la antigua fábrica para ser utilizada en nuestros medios de producción. Han sido confiables en nuestros esfuerzos de producción de armas antes, y la fábrica está en un poco de estado. Darle nueva vida con ellos podría ser lo mejor. Sin embargo, podríamos remodelar el edificio nosotros mismos."
 lithgow_arms.1.a: "Véndelo."
 lithgow_arms.1.b: "We can fix it up."
 governor_general_sacked.1.t: "Gobernador General Sacked"
 governor_general_sacked.1.d: "Por tal vez la primera vez en la historia de Australia, el Gobernador General ha sido removido de su posición por la propia reina Isabel. Las noticias sorprendentes han llegado después de una serie de conversaciones entre la correspondencia del Reino Unido y el Primer Ministro, ya sea que se haya previsto o no, aparentemente han dado lugar a la expulsión. Cómo esto afectará a la formulación de políticas en curso del actual gobierno no está claro, pero ha llegado como un shock para muchos partidarios de la familia real en el país. Los voceros del gobierno liberal todavía no han comentado sobre el despido."
 governor_general_sacked.1.a: "Buena liberación."
 solomon_islands_intervention.1.t: "El colapso de las Islas Salomón"
 solomon_islands_intervention.1.d: "Tras una serie de levantamientos militantes y desarmes fracasados, el gobierno de las Islas Salomón ha colapsado eficazmente, dejando en su lugar un estado de ilegalidad. En la actualidad se están celebrando enfrentamientos entre los grupos militantes que combaten las tensiones étnicas, y los servicios públicos han roto por completo, dejando a muchos vulnerables a la violencia y dando lugar a una creciente crisis humanitaria. El Primer Ministro Allan Kemakeza ha enviado formalmente una petición desesperada de ayuda de los países vecinos para ayudar al estado fallido, al que el gobierno australiano todavía no ha comentado ninguna intervención. Sin ningún cambio, se espera que la situación en las Islas sólo empeore."
 solomon_islands_intervention.1.a: "Un desarrollo preocupante."
 solomon_islands_intervention.2.t: "Intervención de las Islas Salomón"
 solomon_islands_intervention.2.d: "Desde los Bombings de Bali, todo el mundo en el senado ha sido conmovedor sobre el tema del terrorismo. En este momento la situación en las Islas Salomón ha hecho todo pero nos ha puesto a gusto. Es muy probable que las cosas peores lleguen, cuanto más podría derramarse sobre nuestras aguas, y crear un nuevo terreno de cultivo para los tipos de construcción de bombas. El Primer Ministro ya nos ha pedido una solicitud de intervención, si ponemos la idea a votación el resultado sería casi unánime. Tenemos el imperativo moral, pero entrar allí podría mantenernos atrapados en un quagmire peor de lo que hemos experimentado antes, y sólo puede empeorar las cosas. Cómo vamos por esto, de cualquier manera, no será fácil."
 solomon_islands_intervention.2.a: "We need to intervene."
 solomon_islands_intervention.2.b: "It's not our conflict."
 sol_intervention_tt: "§2Decisiones para intervenir en las Islas Salomón será desbloqueado.§!"
 sol_intervention_failure_tt: "§RLa situación sólo empeorará...§!"
 solomon_islands_intervention.3.t: "The Intervention a Success"
 solomon_islands_intervention.3.d: "Hasta el momento la situación sobre el terreno ha mejorado hasta el punto en que las tiendas comienzan a reabrir, las carreteras son claras de los militantes y los esfuerzos de reconstrucción han comenzado. Nuestras fuerzas tendrán que permanecer en el país durante algunos años, pero podemos tomar algún alivio de que la nación se estabilice, y esperamos empezar a sanar. El gobierno de las Islas Salomón está en deuda con nosotros y seguirá trabajando estrechamente con la organización del estado provisional. Mientras tanto, la reacción internacional a nuestros esfuerzos no ha sido más que positiva. Seguimos cosechando en buenas ópticas mientras nuestra seguridad en el Pacífico se fortalece."
 solomon_islands_intervention.3.a: "A job well done."
 solomon_islands_intervention.4.t: "A Nation Without Hope"
 solomon_islands_intervention.4.d: "La situación en las Islas Salomón sólo ha empeorado durante nuestros esfuerzos de intervención y ha crecido tan inestable que nos hemos visto obligados a recuperar nuestras pérdidas y abandonar la intervención. Los militantes continúan luchando en las calles y el gobierno restante prácticamente ha disuelto. La reacción internacional ha sido una conmoción silenciosa, y los países restantes participan en la intervención de manera similar a la discontinuante. Todavía queda poca esperanza para los que viven en las islas."
 solomon_islands_intervention.4.a: "Qué desastre..."
 solomon_islands_intervention.6.t: "Warlord toma el poder en las Islas Salomón"
 solomon_islands_intervention.6.d: "Jimmy Lusibaea, líder del famoso grupo militante 'Malaita Eagle Force', asaltó el edificio del parlamento ayer por la tarde y se ha instalado como líder interino. Después de meses de combates en el suelo en Guadalcanal entre los últimos restos de la policía estatal y las fuerzas de Lusibaea, un alto el fuego fue corregido permitiendo el paso del grupo hacia la capital, incluso apostando en el golpe. \n\nDesde el colapso efectivo del gobierno meses antes y el estado de legalidad en las islas, la parálisis del gobierno se ha convertido en un campo de cultivo para los combates militantes, y ha provocado una crisis migratoria en la región. El líder rebelde afirma que el nuevo gobierno trabajará para poner fin a la crisis actual, y devolver a los malaitanos diásporos a la isla principal que fueron obligados a huir en los años anteriores."
 solomon_islands_intervention.6.a: "La oscuridad cae sobre las islas."
 walk_for_reconciliation.1.t: "El paseo por la reconciliación"
 walk_for_reconciliation.1.d: "Más de 250.000 manifestantes indígenas y no indígenas han marchado hoy por el Puente Portuario de Sydney en un acto público de apoyo a la reconciliación. En una corriente continua que dura casi seis horas, la manifestación política ha sido la más grande de la historia australiana. Uno de los organizadores, Evelyn Scott, ha admitido que las multitudes eran mucho más de lo que esperaban, y que esperaban que el acto no se perdiera por la administración, que ha aparecido fuera del paso con el sentimiento público respecto a la reconciliación. Durante la demostración, los manifestantes animaron como un skywriter escribió la palabra «lo siento» en el cielo por encima del puerto. Según el organizador, se están planeando más marchas para dar seguimiento al éxito de la caminata."
 walk_for_reconciliation.1.a: "They're free to do so."
 sydney_olympic_games.1.t: "Los Juegos Olímpicos de Sydney comienzan"
 sydney_olympic_games.1.d: "Los Juegos Olímpicos de Verano han comenzado oficialmente en Sydney, Australia. Difundida en 220 países y territorios, dando a estos Juegos la mayor cobertura de la historia olímpica, la apertura contó con el sprinter Cathy Freeman entregando la antorcha, quien también tomó la medalla de oro 100 del país en la final de 400 metros. 199 países están participando en el evento, incluyendo Corea del Norte, que fue visto marchar junto con Corea del Sur bajo una sola bandera, marcando su unidad simbólica por primera vez en medio siglo. Se espera que el evento continúe por otras dos semanas durante las cuales los países participantes competirán entre sí."
 sydney_olympic_games.1.a: "Muy el espectáculo."
 shell_takeover.1.t: "Cosecha de carga de Woodside Petroleum"
 shell_takeover.1.d: "Las noticias han hecho nuestra manera de que Royal Dutch Shell ha estado persiguiendo una toma de Woodside Petroleum por valor $10 mil millones. Ambas compañías han compartido una estrecha relación durante los últimos años, y Shell ha hecho evidente que su apoyo técnico para el proyecto North-West LG se movería a una expansión más involucrada de las instalaciones. Nuestro subjefe y tesorero del partido Peter Costello, sin embargo, ha estado en contra de la moción y nos está aconsejando que bloqueemos el acuerdo porque una gran empresa posee la mayoría de los proyectos de gas se opone a nuestros intereses nacionales."
 shell_takeover.1.a: "Bloquea la oferta."
 shell_takeover.1.b: "Permite la toma."
 tampa_affair.1.t: "El Tampa Affair"
 tampa_affair.1.d: "La nueva política del gobierno sobre los solicitantes de asilo se ha convertido en un catalizador para una tormenta política que estalló después de que un buque noruego fuera de la costa de la isla navideña. El comandante del carguero MV Tampa, Capitán Arne Rinnan, había rescatado a cientos de solicitantes de asilo estratados de un barco pesquero indonesio y estaba tratando de traerlos a seguridad en Australia. \n\nA pesar de la mala salud de los 433 solicitantes de asilo en el Tampa, el buque fue embarcado por tropas del SAS y ordenó dar la vuelta. Una respuesta mayoritariamente negativa ha venido de la embajada noruega en relación con el cambio a los ilegales dirigidos por el gobierno de Howard. ¿Qué tan lejos puede ir la política es la suposición de alguien?"
 tampa_affair.1.a: "An unfortunate circumstance."
 bali_bombings.1.t: "Los Bombings de Bali"
 bali_bombings.1.d: "El terror se ha extendido por la isla indonesia de Bali, ya que tres bombas fueron detonadas matando a unas 202 personas, entre ellas 88 australianos. El sentido de paz y distancia que ha tenido la nación durante el crecimiento de la actividad terrorista en el extranjero se ha destrozado repentinamente anoche. Two of the bombs were reportedly located in occupied nightspots, where Australian tourism is commonplace, while the third exploded in front of the American consulate in Denpasar. Si bien no está clara la conexión con Al-Qaida, el ataque se perpetró sin duda en un acto de terrorismo. \n\nMás de 50 cuerpos cubiertos en hojas blancas a pie de la calle una vez ocupada a la mañana siguiente. Un duro mensaje de que Australia ya no es un espectador en la lucha constante contra el terrorismo."
 bali_bombings.1.a: "Dear God..."
 embassy_attacked.1.t: "Embajada de Australia atacada"
 embassy_attacked.1.d: "Informes están llegando que una explosión ocurrió fuera de una de nuestras embajadas en Indonesia esta mañana a las 10 am. Afortunadamente ninguno de nuestros empleados fue asesinado, pero hasta ahora 9 personas han sido asesinadas y alrededor de 150 son heridos por lo que era probable una bomba de coche. Parece evidente que esto estaba dirigido a nosotros, y no estamos seguros ahora mismo si esto está conectado con los bombardeos anteriores en Bali, aunque es un ataque similar. El gobierno de Indonesia ha estado personalmente en contacto con nosotros para organizar una investigación. Esto sólo podría ser el comienzo de ataques más selectivos."
 embassy_attacked.1.a: "Esto se está convirtiendo en una pesadilla."
 asian_earthquakes.1.t: "Ayuda india"
 asian_earthquakes.1.d: "Más de 11.000 personas han sido asesinadas por los terremotos a través de Asia en este momento. Miles de hogares y automóviles han sido barridos por los tsunamis que asolan las costas, lo que ha dado lugar a apagones de comunicación masiva en todas las regiones afectadas, y una cantidad incalculable de devastación hacia carreteras y líneas de tren. En particular, la India se enfrenta a algunas de las peores cosas, aunque en este momento no se conoce cuánto daño se ha infligido. La Cruz Roja mundial ha hecho un llamamiento de emergencia para que se preste asistencia inmediata a los países afectados. Podríamos aprovechar esta oportunidad para enviar un paquete de apoyo a la India y fortalecer nuestros vínculos existentes."
 asian_earthquakes.1.a: "Los apoyaremos."
 asian_earthquakes.1.b: "They're on their own."
 asian_earthquakes.2.t: "Australia ofrece ayuda"
 asian_earthquakes.2.d: "En respuesta a los terremotos que nos afectan y al resto de Asia en este momento, Canberra nos ha ofrecido un paquete de ayuda para apoyar la recuperación."
 asian_earthquakes.2.a: "Una sorpresa, para estar seguro, pero una bienvenida."
 cronulla_riots.1.t: "Disturbios raciales de Cronulla"
 cronulla_riots.1.d: "En el suburbio de la playa de Cronulla bandas locales de hasta 200 hombres descendieron a una confrontación con la policía local fuera de una mezquita en lo que se describe como disturbios raciales. Esto sigue una serie de enfrentamientos, uno de los cuales incluyó a unos 5.000 miembros del mitin que atacaron a individuos de apariencia del Medio Oriente. Los combates se han extendido a otras zonas de Sydney en una serie de ataques de venganza por parte de miembros de la comunidad musulmana. Desde entonces, los disturbios han dejado más de 30 heridos, incluido el personal policial y médico, y han llevado a 16 arrestos. Múltiples grupos religiosos han sido vocales en sus críticas a los ataques, y la policía local ha hecho un retorno al orden una prioridad, pero las altas tensiones en las calles de Sydney siguen siendo."
 cronulla_riots.1.a: "Supongo que es su derecho a quejarse."
 cronulla_riots.1.b: "Clamp down on them."
 rip_steve_irwin.1.t: "Death of an Icon"
 rip_steve_irwin.1.d: "El naturalista Steve Irwin, que adquirió fama mundial como el cazador de cocodrilos de TV, ha muerto trágicamente durante un accidente de buceo en el que un rayo perforaba su pecho. El incidente ocurrió mientras filmaba un documental submarino en Port Douglas. La tripulación intentó llevarlo a un helicóptero de rescate de emergencia, pero murió antes de que llegaran los paramédicos. La muerte ha sido un shock para muchos australianos, y fans en todo el mundo. \n\n«Es una terrible pérdida para la industria turística y para la conservación de la naturaleza. Todo el que conoció a Steve estaba impresionado con su energía y su entusiasmo, él era un auténtico Aussie larrikin.»El ministro de turismo de Queensland, Margaret Keech explicó. La muerte del icono nacional ha provocado profundas reacciones de incluso los parlamentarios, que se dirigieron a la muerte con discursos de condolencia tanto por [AST.GetLeader] como por miembros de la oposición."
 rip_steve_irwin.1.a: "Australia ha perdido un hijo maravilloso y colorido."
 a_global_financial_crisis.1.t: "A Global Financial Crisis"
 a_global_financial_crisis.1.d: "El colapso del mercado de la vivienda estadounidense y el posterior cierre bancario ha hecho su camino a través de las vías fluviales hacia nosotros. Ya nuestro dólar está depreciando rápidamente y la confianza del consumidor se ha hundido. En respuesta, el Banco de Reserva ha cedido y reducido la tasa de efectivo, y decenas de empresas se están cerrando ante una recesión. Si no conseguimos un mango en esto y ralentizamos la caída, el desempleo podría romperse y podríamos enfrentarnos a una depresión como la que no hemos visto en décadas."
 a_global_financial_crisis.1.a: "Se puso peor."
 rus_deal_ast.1.t: "A Trato de los australianos"
 rus_deal_ast.1.d: "Canberra nos ha ofrecido un acuerdo comercial para los derechos de exportación favorables a sus depósitos de uranio. Los australianos han insistido en que se utilicen minerales para proyectos energéticos y no para el enriquecimiento de armas. De hecho, el acuerdo iría bien en alimentar nuestros reactores, y siempre podemos cambiar nuestras mentes más tarde. Por otro lado, ¿confiamos en que nos suministren?"
 rus_deal_ast.1.a: "Muy bien."
 rus_deal_ast.1.b: "No thanks."
 rus_deal_ast.2.t: "El acuerdo comercial ruso"
 rus_deal_ast.2.d: "Moscú ha acordado nuestro acuerdo comercial. Los enviaremos nuestro uranio a un precio justo, y los rublos fluirán en el tesoro australiano. Ya han comenzado a organizar los envíos con su oficina de comercio."
 rus_deal_ast.2.a: "Excelente."
 rus_deal_ast.3.t: "El acuerdo comercial ruso"
 rus_deal_ast.3.d: "Moscú se ha negado a nuestro acuerdo comercial y ha argumentado que su fuente de uranio seguirá siendo más localizada."
 rus_deal_ast.3.a: "Bueno, lo intentamos."
 isr_ast_visit.1.t: "Una visita a Tierra Santa"
 isr_ast_visit.1.d: "A Howard le gustaban los israelíes. Su resiliencia no era diferente a la que se encontró en los australianos, y sus diplomáticos eran algunos de los mejores alrededor. Aunque nunca desperdiciaron la oportunidad de decirles su difícil situación en el Oriente Medio. Una nación que sufre constantemente, pero su dedicación a los valores de la democracia es admirable. \n\nSe paró frente a la pared ahora, y una gran tristeza fluía por Howard. Esta debe haber sido la tercera vez que visitó el país, pero esta fue su primera vez viendo el Muro de Vela. La emoción al ver que era casi abrumadora, y se acomodaba dentro de él. Tal vez así fue como los israelíes se sintieron todo el tiempo. Tal pérdida. Una de las ayudas le preguntó a Howard si quería tocar la pared, como era tradición. Sin una palabra asintió y se acercaron. Un sombrero delgado y circular fue colocado sobre su cabeza, y cuando tocó la pared sintió que el espíritu de ella soplaba en él."
 isr_ast_visit.1.a: "Una experiencia bíblica."
 adf_acq_astuirement.1.t: "ADF Acquirement Contenders"
 adf_acq_astuirement.1.d: "Nuestras selecciones para el proveedor principal de la adquisición se han redondeado a tres opciones. Nuestro primero, y el más fácil de racionalizar, es Estados Unidos. Han hecho algunos buenos avances con sus principales rifles de combate, y su experiencia en el extranjero, así como nuestros compromisos compartidos de defensa, les hace una elección fácil a nivel estratégico. La segunda opción es Alemania. Si no vamos con Austria, podríamos elegir a su vecino. Heckler y Koch se han convertido en uno de los mejores fabricantes de rifles de todo el mundo. No estaríamos equivocados allí. Por último es una antigua Bélgica confiable. Nadie descartará la serie FN como un buen equipo, y nuestros amigos del Commonwealth en el Reino Unido han desarrollado su propia línea para satisfacer sus necesidades. Podemos hacer lo mismo fácilmente."
 adf_acq_astuirement.1.a: "Pégala con los americanos."
 adf_acq_astuirement.1.b: "Ve por la calidad."
 adf_acq_astuirement.1.c: "Vieja y demostrada"
 ast_high_speed_rail.1.t: "Proyecto de alta velocidad se enfrenta a Delays"
 ast_high_speed_rail.1.d: "Parece casi esperado que el proyecto se haya convertido en una complicación. La ruta al sur de Brisbane está planeada para atravesar un largo conjunto de montañas. Las estimaciones para la densidad de las montañas estaban apagadas y la excavación actual va a costar significativamente más."
 ast_high_speed_rail.1.a: "Esto se esperaba."
 ast_high_speed_rail.1.b: "Arrastre el proyecto."
 ast_high_speed_rail.2.t: "Cuestiones relativas a la adquisición de tierras encabeza el tren de alta velocidad"
 ast_high_speed_rail.2.d: "Han surgido más problemas en las zonas suburbanas necesarias para el paso de los ferrocarriles. Varios grupos de NIMBY (no en mi patio trasero) se han opuesto a la propuesta de desarrollo y las batallas legales podrían detener el proyecto indefinidamente. Ir alrededor de la zona significará raspar la ruta actual y redactar otra."
 ast_high_speed_rail.2.a: "¿Qué hizo la NIMBY alguna vez por nosotros?"
 ast_high_speed_rail.2.b: "Por supuesto que no."
 ast_high_speed_rail.3.t: "Costos de recursos Despacio El tren"
 ast_high_speed_rail.3.d: "Otro retroceso para el Proyecto Rail de Alta Velocidad. Las órdenes de hierro establecidas anteriormente han caído repentinamente después de que los costos de acero se hayan disparado. Ahora los distribuidores están pidiendo tres veces la tasa anterior, que considerando cuánto costo original era, es un trozo considerable de todo el presupuesto."
 ast_high_speed_rail.3.a: "¿Cuánto fue eso otra vez?"
 ast_high_speed_rail.3.b: "Tell him he's dreaming."
 ast_high_speed_rail.4.t: "Costos de alta velocidad corregidos"
 ast_high_speed_rail.4.d: "Después de casi cinco años de construcción para el proyecto, la financiación original y adicional casi se ha utilizado. Con los costos de trabajo, permisos y materiales en todo momento elevados se está reformulando la inversión en el proyecto para incluir otros 80 mil millones de dólares. Algunos de los planificadores están convencidos de que la luz está al final del túnel, pero después de tantos retrocesos nada sobre el proyecto es una garantía."
 ast_high_speed_rail.4.a: "Please let it be over."
 ast_high_speed_rail.4.b: "No voy a caer para eso otra vez."
 ast_high_speed_rail.5.t: "Rail de alta velocidad revelada"
 ast_high_speed_rail.5.d: "Después de una serie de contratiempos y escalones presupuestarios se ha revelado la Red de ferrocarriles de alta velocidad, con el primer tren que sale de la estación de Brisbane. La línea ferroviaria, que ha sido toutizada como el estado absoluto del arte, actualmente va desde Brisbane a Melbourne, y se declara para hacer el viaje en un poco menos de 6 horas. Muchos se reunieron alrededor de la estación, que había sido remodelada para dar cabida a la línea de ferrocarril transformada, para presenciar el tren llegar. \n\nEl proyecto representa sin duda una modernización de la nación en los últimos años, y se espera que sirva a más de 200.000 viajeros cada día. Transformando la forma en que muchos Aussies van a viajar."
 ast_high_speed_rail.5.a: "A marvel of engineering!"
 base_state_visit.7.t: "A Trip to Indonesia"
 base_state_visit.7.d: "Las cosas estaban bastante tensas después de los bombardeos, tal hasta el punto en que Howard no podía dar un paso en ninguna dirección sin un cordón de tropas después de haber saltado del avión. Los indonesios tenían cuidado de mantener las apariencias, pero la insurgencia en curso en Aceh era una mirada dolorosa. El Primer Ministro de Indonesia parece más que feliz de debatir los compromisos en materia de seguridad, a pesar de las negociaciones sobre ese mismo tema que se repiten una y otra vez. Las cosas entre nuestras naciones habían crecido tenues ahora, lejos de la 'kumbaya' de años post-colonialismo, y las grietas estaban muy mostrando."
 base_state_visit.7.a: "Hasta la próxima vez."
 generic_bushfires_ast.1.t: "Amplios Bushfire en Australia rural"
 generic_bushfires_ast.1.d: "Un verano inusualmente caliente y seco ha provocado enormes incendios a lo largo de Victoria. Más de 1 millón de hectáreas de tierra han quemado hasta el momento en que muchos de los fuegos más pequeños se han combinado en la Gran Divide y fusionado. Afortunadamente, los incendios se han limitado a la mayoría de las montañas no habitadas y parques nacionales, aunque algunos edificios y ganado todavía se han perdido. Los bomberos continúan conteniendo la difusión con éxito. A pesar de este humo está causando interrupciones en los vuelos del aeropuerto de Melbourne."
 generic_bushfires_ast.1.a: "Troubling."
 papua_affair.1.t: "Conferencias Diplomáticas sobre el Fritz"
 papua_affair.1.d: "Una vez que se produjo una complicación en el aeropuerto de Brisbane, donde llegó el primer ministro de Papua Nueva Guinea [PAP.GetLeader], parece que nuestras negociaciones pueden estar subiendo a humo. \n\nUno de los empleados del aeropuerto pidió al líder que retirara sus zapatos durante el control de seguridad, que aparentemente era un procedimiento estándar, sólo la PM parece haber tomado como una humillación. Sus enviados ya están llenos para salir en el avión y nuestros diplomáticos están rogando con ellos que vuelvan a convocar las conversaciones. Tendremos que intervenir personalmente si queremos salvar algo."
 papua_affair.1.a: "Attempt to scrounge something."
 papua_affair.1.b: "Pueden estar bien por todo lo que nos importa."
 ast_howard_of_arabia.1.t: "Howard of Arabia"
 ast_howard_of_arabia.1.d: "El coche rebotó sobre otro pozo profundo y Howard casi golpeó su cabeza en la parte superior del jeep. El diplomático en el asiento delantero dio vueltas y comenzó a explicar rápidamente cómo la carretera aquí fue dañada por los escombros de caer misiles, como resultado de la cúpula de hierro. Mientras Howard asintió y aceptó que era mejor que la alternativa, no podía evitar pensar que la imagen del país que había desarrollado en la ciudad no era la misma que la realidad aquí. Las FDI parecían estar alrededor de cada esquina mientras el coche se estaba convirtiendo en el consulado, donde Howard iba a pronunciar su discurso sobre la seguridad regional. \n\nAustralia ya había hundido sus botas en el Oriente Medio, y ahora iba a estar colocando una base permanente para ayudar a los israelíes a mantener una tapa sobre las cosas. De muchas maneras parecía que a pesar de la perspectiva occidental que tenían, Israel seguía siendo una nación en desarrollo sin las bases para un futuro pacífico. Incluso sus temores a una invasión iraní paliaban la desunión que tenían con su vecino inmediato, los palestinos y de repente Howard estaba reconsiderando todo el acuerdo."
 ast_howard_of_arabia.1.a: "Nuestro futuro está con Israel."
 ast_howard_of_arabia.1.b: "No podemos prometer nada por ahora..."
 indonesian_ultimatum.1.t: "El Ultimatum australiano"
 indonesian_ultimatum.1.d: "Australia ha exigido que entreguen la provincia de Aceh a sus miembros del personal de mantenimiento de la paz, permitiendo efectivamente que uno de nuestros territorios sea ocupado por sus fuerzas. Han afirmado que esto conduciría a una eventual independencia para la región, libre de insurgentes, pero no tenemos manera de garantizar eso, y todavía sería la pérdida de nuestro propio suelo. Si nos negamos, nos han amenazado con sanciones."
 indonesian_ultimatum.1.a: "We have no choice."
 indonesian_ultimatum.1.b: "¡Esto es indignante!"
 indonesian_ultimatum.2.t: "Indonesia Complies"
 indonesian_ultimatum.2.d: "Yakarta ha acordado los términos que se les han presentado y ha renunciado al territorio de Aceh. Nuestro personal de mantenimiento de la paz enviará pronto y restaurará el orden a la provincia. El pueblo indonesio pronto estará libre de insurgencia."
 indonesian_ultimatum.2.a: "¡La paz ha triunfado!"
 indonesian_ultimatum.3.t: "El indonesio rechaza el Ultimatum."
 indonesian_ultimatum.3.d: "Yakarta ha rechazado nuestros términos y se niega a permitir que nuestro personal de mantenimiento de la paz entre en Aceh. Han prometido obstinadamente eliminar la insurgencia por su cuenta."
 indonesian_ultimatum.3.a: "So be it."
 indonesian_ultimatum.4.t: "El Ultimatum australiano"
 indonesian_ultimatum.4.d: "Australia ha exigido que entreguen la provincia de Aceh a sus miembros del personal de mantenimiento de la paz, permitiendo efectivamente que uno de nuestros territorios sea ocupado por sus fuerzas. Han afirmado que esto conduciría a una eventual independencia para la región, libre de insurgentes, pero no tenemos manera de garantizar eso, y todavía sería la pérdida de nuestro propio suelo. Si nos negamos, nos han amenazado con sanciones."
 indonesian_ultimatum.4.a: "We have no choice."
 indonesian_ultimatum.4.b: "¡Esto es indignante!"
 us_aus_trade_howrd.1.t: "Discusiones comerciales con Australia"
 us_aus_trade_howrd.1.d: "El gobierno de Canberra ha alcanzado con una oferta para el comercio prioritario de derechos minerales a cambio de que nosotros reduzcamos aranceles sobre las exportaciones de maquinaria de alto valor. La pérdida icome de los aranceles sería insignificante, y los derechos minerales serían más que compensables."
 us_aus_trade_howrd.1.a: "Estos son términos favorables."
 us_aus_trade_howrd.1.b: "No thanks."
 us_aus_trade_howrd.2.t: "Los Estados Unidos están de acuerdo con el Pacto de Comercio"
 us_aus_trade_howrd.2.d: "Sin ningún desacuerdo, los estadounidenses han acordado rebajar sus aranceles a las exportaciones de maquinaria de alto valor a cambio de que ofrezcamos derechos minerales."
 us_aus_trade_howrd.2.a: "Cheers to the friendship!"
 us_aus_trade_howrd.3.t: "Las conversaciones comerciales se fusionan con EE.UU."
 us_aus_trade_howrd.3.d: "Parece que cualquier camino con las conversaciones comerciales ha aparecido sin manos. Los americanos no se están moviendo con el cambio a los aranceles, y nos han dejado un poco fuera en el frío."
 us_aus_trade_howrd.3.a: "An unexpected downturn."
 trip_to_malaysia_ast.1.t: "A Visit From Malaysia"
 trip_to_malaysia_ast.1.d: "El Ministro de Comercio e Industria de Malasia, Rafidah Aziz, nos ha abordado con una adición a nuestro tratado actual para la exportación de carne. El nuevo acuerdo ofrece contratos sobre las exportaciones a cambio de que relajemos unos pocos impuestos y regulaciones sobre ellas. Es una oferta sólida, aunque los requisitos pueden presentar un agujero de bucle que podrían aprovechar en la línea. Todavía nos ofrece un precio favorable para nuestras mercancías."
 trip_to_malaysia_ast.1.a: "¡Por nuestros amigos, por supuesto!"
 trip_to_malaysia_ast.1.b: "Hoy no."
 internal_talk_liberal.1.t: "A Spat Between Colleagues"
 internal_talk_liberal.1.d: "Howard se sentía como Peter Costello, su bien sirviente diputado del partido desde la primera elección, siempre tenía un hueso que recoger con él. Parecían chocar con todas las oportunidades, pero eso no les había impedido trabajar juntos para mejor, y Pedro era parcialmente responsable de la positividad económica en curso. Ahora estaban discutiendo sobre la migración. Peter era muy aturdido en los beneficios económicos, pero Howard, preocupado por la «lavajía» del multiculturalismo, se mantuvo firme en la integración. \n\nEl fortalecimiento de la patrulla fronteriza también tuvo el beneficio de disminuir el contrabando humano, que se había convertido en un tema tópico en las noticias. Peter afirmó en su lugar que la idea era propensa a apoyar, y simplemente terminaría siendo un desperdicio del presupuesto. No hubo acuerdo entre ellos."
 internal_talk_liberal.1.a: "Y sin embargo, había que tomar una decisión."
 internal_talk_liberal.2.t: "A Visit From Tony"
 internal_talk_liberal.2.d: "Howard estaba ocupado presentando los papeles para el cambio de reglas del partido cuando llegó un golpe a la puerta. Sabía que tenía una ventana de 2 horas antes de la próxima reunión, así que fue una sorpresa cuando el Ministro de Salud, Tony Abbott, entró. El hombre que había hecho un buen trabajo manejando el departamento y tratando con el impar sindical matón, presentó a Howard nuevas modificaciones para medicare. Unos pocos en la fiesta eran parciales para etiquetar a Abbott un fanot de partido, pero Howard no lo vio así. A él Abbott apareció dedicado a la gente. Un nacionalista por todas las definiciones. \n\nSin duda tenía la ambición de convertirse en Primer Ministro, pero nunca le impidió mostrar lealtad a Howard, y había aumentado un respeto mutuo entre ellos. Cuando dejó la habitación Howard volvió a escribir, y un pensamiento se enfureció. Tal vez, después de estos últimos años en el cargo, podría considerar a Tony un buen amigo."
 internal_talk_liberal.2.a: "Back to it then."
 internal_talk_liberal.3.t: "Eligiendo al Sucesor"
 internal_talk_liberal.3.d: "Cuando se trataba de elegir al próximo líder del partido, Howard estaba en un tenedor. Parecía más que a menudo que su nemesis en el parlamento era su propio diputado, Peter Costello. Vendrían a soplar más a menudo de lo que tenía con las otras fiestas. Peter siempre estaba atormentando por el trabajo, y no le dolió que tenía buena posición con el resto de la fiesta. Su visión para una Australia económicamente independiente es realmente intrigante, y con él a cargo se le aseguraría que el partido continuaría sin problemas. \n\nSin embargo, había otro. Tony Abbott era de muchas maneras un protegido a Howard, aunque había sido firme en Howard sirviendo otro término. A pesar de que Abbott fue visto como un poco de acólito en el partido, y considerado un poco lavado, Juan vio una convicción en el hombre que casi le recordó a sí mismo. Abbott imaginó no sólo una Australia independiente, sino una más fuerte también. Entrando en las próximas elecciones, la decisión tomaría o rompería el partido."
 internal_talk_liberal.3.a: "Peter es el sucesor natural."
 internal_talk_liberal.3.b: "Tony tiene lo que se necesita."
 internal_talk_liberal.3.c: "Pensándolo bien..."
 internal_talk_liberal.4.t: "Howard Resigns as Leader"
 internal_talk_liberal.4.d: "«Ha sido un inmenso privilegio cada día de mi vida haber sido [GetASTLeaderTitle] de este hermoso país y quiero dar las gracias al pueblo australiano por el privilegio. Lo respeto y lo honro. Después de años de persecución, liderar esta nación ha sido la experiencia más increíble de toda una vida.» \n\n«Acepto la plena responsabilidad por el Partido Liberal, los éxitos y las pocas pérdidas que hemos tenido, y por lo tanto estoy bajando como líder del partido. Quiero agradecer al pueblo de Bennelong, y al pueblo de Australia por haberme elegido para representar a esta nación». \n\n«A medida que entrego las riendas a mi propio diputado y tesorero Peter Costello debo una deuda muy especial de gratitud. Ha sido un administrador maravilloso de la economía australiana y el futuro de nuestro partido está muy ligado con Peter. Él es mucho nuestro futuro.» \n\n«Deseo bien a la nación, creo muy profundamente que los mejores años de Australia están por delante de ella.»"
 internal_talk_liberal.4.a: "En nuevos horizontes..."
 internal_talk_liberal.5.d: "«Ha sido un inmenso privilegio todos los días de mi vida en estos últimos años haber sido [GetASTLeaderTitle] de este hermoso país y quiero dar las gracias al pueblo australiano por el privilegio. Lo respeto y lo honro. Después de años de persecución, liderar esta nación ha sido la experiencia más increíble de toda una vida.» \n\n«Acepto la plena responsabilidad por el Partido Liberal, los éxitos y las pocas pérdidas que hemos tenido, y por lo tanto estoy bajando como líder del partido. Quiero agradecer al pueblo de Bennelong, y al pueblo de Australia por haberme elegido para representar a esta nación». \n\n«A medida que entrego las riendas al próximo líder, mi propio Ministro de Salud y orgulloso colega Tony Abbot, debo una deuda muy especial de gratitud. Ha sido un maravilloso representante para muchos australianos, y el futuro de nuestro partido está muy ligado a Tony. Él es mucho nuestro futuro.» \n\n«Deseo bien a la nación, creo muy profundamente que los mejores años de Australia están por delante de ella.»"
 solomon_islands_intervention.5.t: "Cleaning Up"
 solomon_islands_intervention.5.d: "Los lugareños caminaron a la pila y tiraron otra carga de armas sobre ella. Sobre todo rifles. Otra milicia se había rendido al 3er ejército australiano ese día y los oficiales estaban desviando. Mañana el regimiento del ingeniero vendría a destruirlos delante de una multitud. Lo harían en uno de los estadios todavía funcionales como muestra pública que el orden estaba siendo restaurado. Si esa orden vino de casa o no el soldado de la ADF no lo sabía, pero siguió viéndolos apilar. \n\nDecenas a la vez, se unieron y el montón creció. Él y el resto de la compañía habían cazado al grupo que éstos habían venido desde hace aproximadamente un mes, y ellos fueron los primeros en rendirse a la vista. Empezaba a parecer que las cosas estaban llegando a su fin, antes de lo que esperaba. Los combates se calmaban, pero pocas luces trabajaban incluso en la ciudad cercana, y alguien enfermo estaba siendo expulsado de la isla. Si los lugareños iban a quedarse, era necesario hacer más una vez que el tiroteo se detuvo. \n\nLa radio en su hombro brindó a la vida y se fue, moviéndose hacia el siguiente pueblo."
 solomon_islands_intervention.5.a: "Vuelvan al trabajo."
 a_global_financial_crisis.2.t: "Financiero Shakeup"
 a_global_financial_crisis.2.d: "Varias empresas de tamaño medio respaldadas por préstamos han caído en las últimas semanas y declarado bancarrota. El golpe a nuestras cifras de desempleo es un aspecto negativo, pero la tranquilidad ha sido un poco preocupante. El aire de la crisis económica está empezando a alterar a nuestros expertos fiscales, quienes están solicitando que estemos preparados para tomar medidas inmediatas si algo surge. Excepto que nada tiene por ahora, lo que nos deja en la posición incómoda de esperar."
 a_global_financial_crisis.2.a: "No nos preocupemos por nada."
 black_saturday_ast.1.t: "Sábado negro"
 black_saturday_ast.1.d: "Durante unos días, varios incendios se han convertido en cientos a través de Victoria en lo que se ha llamado el peor día de fuegos artificiales. Miles de bomberos a través de la nación se han reunido en una desesperada puja para contener los fuegos, que ya han tomado la vida de 25 individuos. \n\nDías de aire caliente y seco desde el centro de Australia han creado las condiciones perfectas para que los incendios se expandan increíblemente rápido. Ya se han destruido Swaths of homes and land, iniciando un estado de emergencia a medida que los miembros del servicio se apresuran a evacuar zonas en riesgo. Aunque poco se puede hacer mientras recorre los bosques estatales y los parques nacionales, con llamas grabadas para llegar a 30 metros de altura."
 black_saturday_ast.1.a: "Este no es nuestro año."
 black_saturday_ast.2.t: "Los Fuegos Victoria continúan apasionando"
 black_saturday_ast.2.d: "Habilidades sobre Victoria han permanecido negras durante semanas ya que los incendios no han dejado de subir, elevando el número de muerte a 173. Las líneas de control han tenido éxito en la ralentización de la propagación, aunque se calcula que 400.000 hectáreas han sido quemadas, diezmando la fauna silvestre local. \n\nEl [GetASTLeaderTitle] ha estado dentro y fuera de la zona visitando a los afectados, que parecían visiblemente molestos al ver el daño, estaba presente para proporcionar cierta comodidad a aquellos ahora sin hogares. Un número que es probable ahora en los miles. Los bomberos agotados continúan sus esfuerzos, con un clima favorable que se espera llegar en la próxima semana. \n\nLos días más oscuros de Victoria en décadas pueden llegar lentamente a su fin, aunque no sin una pérdida abrumadora para el país."
 black_saturday_ast.2.a: "A tragedy beyond words."
 ast_elections_howard_placeholders.1.t: "Sorpresa Win for the Howard Government"
 ast_elections_howard_placeholders.1.d: "El aumento de los precios del combustible y las fuertes reacciones a una serie de políticas de John Howard no fueron suficientes para impedir que el líder ganara un tercer mandato. Saliendo de la carrera con 82 escaños en la Cámara de Representantes, el Partido Liberal ha experimentado posiblemente el giro más rápido de la fortuna política en la historia del país. \n\nMientras tanto, el gobierno liderado por Kim Beazley ha sufrido su voto primario más bajo desde 1934, con algunas fuentes dentro del Partido Laborista afirmando que se espera que el líder de la oposición retroceda. Howard agradeció a sus partidarios, en particular a los pequeños negocios, por su victoria electoral mientras dio su discurso de victoria en el Hotel Wentworth en Sydney, y describió sus planes para una nueva reforma."
 ast_elections_howard_placeholders.1.a: "¡Es tan fácil!"
 ast_elections_howard_placeholders.2.t: "El Gobierno de Howard Bolso otro mandato"
 ast_elections_howard_placeholders.2.d: "Mientras Mark Latham luchó para hacer terreno como el nuevo líder del Trabajo, [AST.GetLeader] se ha levantado, ganando otro término para la Coalición y asegurando una mayoría. Los liberales disfrutaron de un cómodo aumento en las encuestas después de la tragedia de Bali Bombings, señalando una preferencia por una gobernanza cautelosa y estable. \n\nNo cabe duda de que el éxito de las políticas nacionales de ordenación del agua rural, llevadas a cabo para combatir la sequía del Milenio, también ha contribuido a la victoria de la Coalición. Esta victoria marca la segunda racha de servicio más larga para el partido. \n\nEl ALP hizo algunas ganancias, ganando un asiento de los Verdes y algunos de los Nacionales. Aunque esto es probable que resulte en otra sacudida para la fiesta."
 ast_elections_howard_placeholders.2.a: "¡Tres años más!"
 election_outcomes_ast.1.t: "Ganancia histórica para el trabajo de Rudd"
 election_outcomes_ast.1.d: "El líder liberal [AST.GetLeader] fue derrocado anoche mientras Kevin Rudd llevó al Trabajo a una victoria de deslizamiento, obteniendo un giro del 5,7% en toda la nación. Por primera vez en la historia australiana, el Partido Laborista tiene ahora gobierno en todos los estados y territorios. La ascensión del líder adjunto Julia Gillard también marca la primera vez que una mujer tendrá la segunda oficina pública más alta en la tierra. \n\nEl líder de la coalición ya ha bajado, haciendo un llamado a Rudd durante la noche para felicitarlo por la victoria. El nuevo [GetASTLeaderTitle] ha hecho campaña para mejorar las relaciones industriales, los derechos indígenas y la acción rápida sobre el cambio climático, con el objetivo de tomar al país en una nueva dirección, que remarcó durante su discurso de victoria: «Hoy se entregó la elección al pueblo, y Australia ha mirado hacia el futuro»."
 election_outcomes_ast.1.a: "Y el futuro es ahora."
 election_outcomes_ast.2.t: "Una victoria inicial para la coalición"
 election_outcomes_ast.2.d: "Las predicciones para una victoria Laboral han sido aplastadas mientras la Coalición ruge hacia adelante por otro término consecutivo. [GetASTLeaderTitle] [AST.GetLeader] comentó los resultados como una victoria para la mayoría silenciosa, y delineó planes para nuevas inversiones económicas durante su discurso. Aunque la coalición continuará en el gobierno, la ALP hizo importantes avances a través de la nación en casi todos los estados y territorios, dejando al actual gobierno con una escasa mayoría. \n\nKevin Rudd ha llamado al [GetASTLeaderTitle] para felicitarlos por la victoria, y se espera que aborde la pérdida más tarde en la noche. La Coalición lidera ahora con la responsabilidad de guiar al país, manteniendo la renovada fe del público en el partido."
 election_outcomes_ast.2.a: "¡Tranquilízate!"
 a_global_financial_crisis.3.t: "Efectos de la crisis"
 a_global_financial_crisis.3.d: "Los efectos persistentes de la crisis financiera han disminuido en las últimas semanas. La economía se ha normalizado principalmente a niveles anteriores, y el sentimiento público ha aumentado en apoyo de nuestros esfuerzos. Parece que nuestra respuesta a la crisis ha pagado en última instancia, e incluso ha hecho que nuestra economía sea más resiliente para esos retrocesos económicos en el futuro."
 a_global_financial_crisis.3.a: "We're back in business."
 turnbull_letter_ast.1.t: "La carta Turnbull"
 turnbull_letter_ast.1.d: "El actual líder del Partido Liberal, Malcolm Turnbull, ha salido en contra de nuestro gobierno afirmando poseer un email demostrando nuestra corrupción. Lo que exactamente contiene la carta sólo podemos especular, pero parece ser lo suficientemente malo para convencer a los medios de comunicación a correr con ella. Nuestra propia gente afirma que la fuente de Turnbull vino del gobierno, lo que significa que podemos tener un topo dentro del partido. \n\nMalcolm Turnbull se espera revelar la carta al Parlamento en las próximas semanas. Por ahora sólo podemos cruzar nuestros dedos y esperar que el daño no sea muy malo."
 turnbull_letter_ast.1.a: "What did we do?"
 turnbull_letter_ast.2.t: "A Phony Letter"
 turnbull_letter_ast.2.d: "Resulta que el famoso email de Malcolm Turnbull no era más que una falsificación. Durante la auditoría nacional en la reclamación, la fuente de Turnbull admitió que lo hizo todo. El topo de la fiesta, Godwin Grech, estaba dando información falsa a Turnbull para clout. El retroceso resultante prácticamente ha hundido las calificaciones de aprobación de Turnbull, y redujo al partido liberal a un desastre terrible. Mientras tanto, nuestras encuestas de opinión han retrocedido, y Grech ha sido arrancado rápidamente del partido."
 turnbull_letter_ast.2.a: "¡Nunca lo creímos por un segundo!"
 oceanic_viking_ast.1.t: "Oceanic Viking Dilemma"
 oceanic_viking_ast.1.d: "Parece que uno de nuestros buques marítimos que se utilizan actualmente para los esfuerzos de protección fronteriza ha aprehendido a 78 solicitantes de asilo de Sri Lanka que intentan entrar en Australia. Una vez que estaban a bordo del barco, según nuestra política actual, fueron llevados a la isla indonesia de Bintan para procesar, sólo ahora se niegan a desembarcar como una especie de protesta. \n\nEsto marca la interdicción del buque 49 este año, y como es habitual los medios de comunicación están encaminando sobre él. Hasta ahora el personal a bordo del Oceanic Viking no ha tenido éxito en eliminarlos, y cuanto más tiempo se sienta allí peor nos busca. La oposición ya lo utiliza para pintarnos como débiles contra la migración ilegal, y parece que algunos de los solicitantes de asilo a bordo necesitan atención médica. \n\nPodemos negociar o forzarlos."
 oceanic_viking_ast.1.a: "Darles un procesamiento preferencial."
 oceanic_viking_ast.1.b: "Send in the troops."
 oceanic_viking_ast.2.t: "Las protestas antiinmigración son rampantes"
 oceanic_viking_ast.2.d: "Las protestas han estallado en la mayoría de nuestras principales ciudades sobre el resultado del drama oceánico vikingo, principalmente estimulado por miembros políticos de derecha. En particular, el partido Una Nación ha sido muy crítico de la acción, incluso más agresivamente que la oposición, y a pesar de su pequeño tamaño ha atraído una atención notable en línea. \n\nSu ex líder del partido, Pauline Hanson, que ha construido su carrera sobre la retórica polémica, también llamó a nuestro gobierno durante un mitin en Queensland, etiquetando a nuestro gobierno «anti-Australiano.» En respuesta a las protestas contrarrevolucionarias también han encendido, aunque menor en escala, dando lugar a varios enfrentamientos."
 oceanic_viking_ast.2.a: "¿Por qué no todo el mundo puede calmarse?"
 oceanic_viking_ast.3.t: "Mishap operacional"
 oceanic_viking_ast.3.d: "Según nuestras instrucciones, el SAS fue montado para eliminar con fuerza a los solicitantes de asilo del buque. Parece que, previo al evento, nuestro conocimiento operativo era limitado. Cuando nuestra unidad abordó el barco descubrieron que uno de los migrantes de Sri Lanka se había armado con una pistola, y un tiroteo salió entre ellos. Afortunadamente sólo uno de nuestros hombres resultó herido, pero 4 de los migrantes a bordo fueron asesinados y dos heridos. The rest were successfully removed and transportd to Bintan detention centre. \n\nSe ha convocado un período de sesiones de las Naciones Unidas en respuesta, y es de esperar que el contratiempo sea bastante grave. Las protestas han surgido en la mayoría de nuestras principales ciudades, que también han impulsado sus propias protestas contrarrevolucionarias. Si está al revés, la oposición se mantiene relativamente tranquila."
 oceanic_viking_ast.3.a: "¿Cómo pudo pasar esto?"
 aus_cylcone.1.t: "Cylcone Ului golpea a Queensland"
 aus_cylcone.1.d: "Uno de los ciclones más severos que hemos visto ha hecho caídas en Queensland, causando daños infraestructurales a nivel estatal y dejando más de 60.000 hogares sin poder durante días. El ciclón pasó por las Islas Salomón y mantuvo una categoría 3 antes de disiparse. Dados los avisos avanzados, la mayoría fueron evacuados de las zonas con antelación, sin embargo, se ha informado de una muerte. \n\nDesde entonces, se han desplegado servicios nacionales de emergencia y las ADF para reparar los daños y devolver la energía en línea."
 aus_cylcone.1.a: "A tragedy nonetheless."
 great_barrier_reef.1.t: "Spill de aceite en el Gran Arrecife Barrera"
 great_barrier_reef.1.d: "Un portaaviones chinos de carbón ha estado en tierra al este de Rockhampton en Central Queensland. El barco estaba a más de 10 km fuera del carril de transporte cuando golpeó el arrecife, raspando a lo largo de él por una distancia considerable antes de parar, y filtrando sobre 2 millas náuticas de aceite de combustible pesado. \n\nHasta ahora los remolcadores han sido enviados para quitar el barco, aunque hay temores de que el barco se rompa en los mares ásperos. La UNESCO y nuestros gerentes de Reef están en armas que el barco estaba tan lejos de su rumbo, y que la zona alrededor puede estar ahora contaminada. Trabajamos con ellos para minimizar el daño, pero es un proceso lento."
 great_barrier_reef.1.a: "Muy desafortunado."
 ast_elections.3.t: "Día de las elecciones"
 ast_elections.3.d: "Los sellos están siendo empaquetados, los anuncios se están acabando, y la sede del partido está en alta alerta. La temporada de campaña ha terminado y las cabinas de votación se han establecido en previsión del día electoral. Los australianos de todo el país se reunirán pronto para votar por el futuro de la Cámara Parlamentaria, y ahora la decisión de nuestro próximo líder está en sus manos."
 ast_elections.3.a: "Que gane el mejor candidato."
 dissolution_election_rudd.3.t: "Rudd gana grande"
 dissolution_election_rudd.3.d: "Los miembros de la sede del Trabajo celebran la victoria para Kevin Rudd ya que marca la primera victoria consecutiva para el partido desde 1993, y ha confirmado las esperanzas para muchos de los partidarios de [GetASTLeaderTitle]. El trabajo está de vuelta. \n\nDespués de meses de campaña en reformas continuas, los resultados han afirmado el mandato de Rudd. Landing Labor con un gobierno mayoritario, se espera que se forme en las próximas semanas gracias a un montón de nuevos miembros. Casi todo el estado de Queensland ha convertido una sombra de rojo. \n\nLos resultados electorales también proporcionaron a los Verdes dos puestos más, lo que indica un creciente apoyo público para la acción climática."
 dissolution_election_rudd.3.a: "Vuelvan al negocio."
 dissolution_election_rudd.4.t: "Tony Abbott saluda a la victoria"
 dissolution_election_rudd.4.d: "La multitud cantó «Tony, Tony, Tony» dentro de la sala llena del Hotel Four Seasons como el partido liberal garantizó la victoria en una de las elecciones más estrictas en la historia de las naciones. El líder conservador, que montó la campaña sobre un rastro de retórica ardiente en medio de promesas para «Parar los Barcos», anunció que fue «humbled» para tomar el volante del gobierno. «Desde hoy declaro que Australia está bajo nueva dirección y Australia es una vez más abierta para el negocio». \n\nEl Abad crítico para el clima prestó atención durante la campaña con una fuerte oposición a la dirección de la opinión pública, y sin embargo los votantes han hablado. Se espera que las posturas fuertes sobre la inmigración y el conservadurismo fiscal sigan a medida que el trabajo empaqueta sus bolsas, y los liberales crean una vez más tienda."
 dissolution_election_rudd.4.a: "¡Los liberales han vuelto!"
 ast_elections.1.t: "La Elección Blitz"
 ast_elections.1.d: "La temporada electoral se ha acercado y el tiempo para la campaña ha comenzado. De acuerdo con la ley electoral, sólo tenemos 8 semanas para comunicar nuestro mensaje. Ya sea que lo hagamos saturando los medios de comunicación, viajando por el país o debatiendo la oposición, el reloj está marcando. Tenemos que salir y estar ocupados si esperamos ganar."
 ast_elections.1.a: "¡Manténganse con los liberales!"
 ast_elections.1.b: "A fair go with Labor!"
 ast_elections.1.c: "¡Australiana primero con una nación!"
 ast_elections.1.e: "¡Pelea por el cambio con los Verdes!"
 special_gillard_election.1.t: "Llamando a las nuevas elecciones"
 special_gillard_election.1.d: "La única manera de sellar la legitimidad de nuestro nuevo gobierno es con una nueva elección general. Si podemos reunir sus votos y asegurar el próximo mandato, establecerá el mandato que necesitamos para seguir liderando, y potencialmente disminuir la derrota que podríamos recibir de la oposición mientras pasamos la ley. Todavía hay riesgo de participar en cualquier elección, así que tendremos que ocuparnos durante los próximos 60 días."
 special_gillard_election.1.a: "Hacia adelante y hacia arriba."
 election_outcomes_ast.5.t: "Resultados de votación: ¡Un Hung Parliment!"
 election_outcomes_ast.5.d: "En una sorpresa electoral que no ha ocurrido desde 1940, ninguno de los partidos ha salido un ganador limpio. La Coalición y el Trabajo obtuvieron 72 escaños durante el conteo, dejándolos 4 cortos de formar un gobierno. Esto llevó a una conclusión incómoda en la noche mientras ambos candidatos salieron al escenario para declarar que, a pesar de los resultados siendo altos, la elección no había terminado. \n\nDurante los próximos días las partes tendrán que combatirlo en la Cámara de Representantes y negociar con los miembros restantes para asegurar un gobierno."
 election_outcomes_ast.5.a: "Una nación dividida."
 election_outcomes_ast.4.t: "Otra victoria para el Gobierno de Rudd"
 election_outcomes_ast.4.d: "Crowds vagó por las calles de Sydney anoche mientras los resultados para una victoria electoral del trabajo entraron. Después de otro mandato de política fuerte, Kevin Rudd ha ganado una vez más la buena voluntad del público, ganando el 48% de los votos y asegurando un número de Coalición ocupó asientos en Queensland, perforando las anteriores fortalezas pro-mining alrededor de la Cuenca de Bowen. \n\nRudd se dirigió a la victoria en el campo del cricket de Gabba, junto con su familia, para celebrar la tercera victoria. \n\n«Mi familia ha dado todo en la vida pública, y todo por mi campaña. En los días venideros, Thérèse y yo pasaremos los próximos pocos juntos, con los niños también, y luego volverá a ello. El espectáculo aún no ha terminado.»"
 election_outcomes_ast.4.a: "Y los buenos tiempos pasan."
 election_outcomes_ast.6.t: "Gillard asegura otro mandato"
 election_outcomes_ast.6.d: "La primera mujer de Australia [GetASTLeaderTitle] ha desafiado la votación temprana, ganando el apoyo del público una vez más y consiguiendo un gobierno minoritario. Gillard agradeció a sus partidarios en el Centro de Convenciones y Exposiciones de Melbourne, destacando sus planes de liderazgo fiscalmente responsable y nuevas reformas a la salud. \n\nEl líder de oposición, Tony Abbott, llamó a Gillard poco después de los resultados para felicitarla por la victoria. Después de otra pérdida, se espera que Abbott abandone el liderazgo del partido, indicando un cambio en la política del partido a la luz de la falta de desplazar al partido a la derecha."
 election_outcomes_ast.6.a: "Una victoria para una política razonable."
 new_governor_general_ast.1.t: "El Nuevo Gobernador General"
 new_governor_general_ast.1.d: "Por primera vez en la historia de nuestra nación una mujer ha sido jurada como el nuevo gobernador general. Quentin Bryce, de 65 años, ex abogada y gobernadora en el estado de Queensland, es la 25.ª gobernadora general de Australia, convirtiéndose en la primera mujer en el papel en 107 años. \n\nEn una ceremonia en la Cámara Parlamentaria de Canberra, Bryce prometió un juramento de lealtad a la Reina como un saludo de 21 cañones fue despedido afuera. \n\n«Quiero que sepan que tomo este papel con solemnidad, imparcialidad, energía y un profundo amor por el país que compartimos», dijo. «Prometo ser abierto, receptivo y fiel al pensamiento contemporáneo y al trabajo de la sociedad australiana»."
 new_governor_general_ast.1.a: "Los tiempos están cambiando."
 indo_cattle_drama.1.t: "Indonesia Cattle exporta Dilemma"
 indo_cattle_drama.1.d: "ABC transmitió recientemente su programa de Four Corners que expone la crueldad sistémica en la industria ganadera indonesia. El vídeo es bastante gráfico, y un gran público ha exigido que cesemos de nuestras exportaciones ganaderas a Indonesia inmediatamente. Podemos suspender las exportaciones de ganado vivo hasta que acepten nuevos marcos regulatorios, pero la prohibición destruirá financieramente nuestras granjas al norte."
 indo_cattle_drama.1.a: "Suspendieron las exportaciones."
 indo_cattle_drama.1.b: "It's not worth it."
 malaysia_solution_ast.1.t: "La Solución de Malasia"
 malaysia_solution_ast.1.d: "Teniendo en cuenta el estado de decrépito de nuestros actuales centros de detención de inmigrantes, Malasia ha alcanzado con una oferta para descargar 800 solicitantes de asilo que tenemos en nuestra posesión a ellos, a cambio de tomar en 4.000 refugiados procesados. Arreglaría nuestras cuestiones de detención inmediatas y calmaría algunas de las quejas públicas, pero Malasia no es signataria de la Convención sobre los Refugiados de las Naciones Unidas, lo que hace que todo el acuerdo sea legalmente dudoso."
 malaysia_solution_ast.1.a: "We'll shake on that."
 malaysia_solution_ast.1.b: "It's not legally sound."
 malaysia_solution_ast.2.t: "Los tribunales superiores bloquean el acuerdo de Malasia"
 malaysia_solution_ast.2.d: "Lamentablemente, el Tribunal Superior de Australia ha dictaminado el intercambio ilegal en virtud de la Ley de Migración y bloqueado la transferencia. La reacción inmediata fue un montón de acusaciones de la oposición, y si algo las reacciones públicas sólo han empeorado ahora. Es posible que tengamos que considerar la posibilidad de estudiar otros métodos para resolver nuestro problema de detención de inmigrantes."
 malaysia_solution_ast.2.a: "No tan fácil."
 embassy_tent_protests.1.t: "La Embajada de Tent Protests"
 embassy_tent_protests.1.d: "En conmemoración del 40.º aniversario de la Embajada de Tentas Aborígenes, una ocupación de protesta que apoya los derechos indígenas fuera del Parlamento en 1972, se celebra cerca del lugar una ceremonia de entrega de premios en el restaurante Lobby. Parece que un grupo de manifestantes que se habían reunido en el sitio han emigrado hacia el restaurante. Algo parece haberlos enjuagado, ya que algunos están empezando a golpear en las ventanas. \n\nDesde que el [GetASTLeaderTitle] y líder de la oposición están presentes en el evento, la seguridad ha aconsejado una evacuación inmediata del lugar por un helicóptero cercano. La multitud se ve bastante reñida, pero quizás abrir un diálogo podría calmar las cosas."
 embassy_tent_protests.1.a: "Get me out of here!"
 embassy_tent_protests.1.b: "Hablemos con la multitud."
 embassy_tent_protests.2.t: "El [GetASTLeaderTitle] lesionado"
 embassy_tent_protests.2.d: "Una pesadilla de seguridad se desarrolló cuando los guardias con Gillard hicieron una brecha en la multitud, permitiéndole salir y hablar con ellos. Sólo un minuto después de que hicieron un objeto lanzado por uno de los manifestantes golpeó el [GetASTLeaderTitle], tocándola al suelo e hiriéndola a los ojos. La policía y los guardias descendieron sobre la multitud y evacuaron a Julia Gillard del evento, pero después de un viaje al hospital parece que el daño a su ojo derecho es permanente. \n\nEl líder de oposición Tony Abbott pasó un momento en la asamblea elogiando a la [GetASTLeaderTitle] sobre su valentía, y condenó el ataque."
 embassy_tent_protests.2.a: "Oh no..."
 embassy_tent_protests.3.t: "Tocando el Crowd"
 embassy_tent_protests.3.d: "Una vez que Rudd salió del pabellón agradecidamente nada salió mal, ya que la multitud parecía sumergirse una vez comenzó a mezclarse con ellos. Parecía que un comentario hecho por Tony Abbott provocó el alboroto, y como el líder de la oposición había sido evacuado, las tensiones se habían enfriado. \n\nEl [GetASTLeaderTitle] pasó una hora con la multitud y los periodistas cercanos antes de regresar a la ceremonia. Proporcionándole un poco de publicidad positiva."
 embassy_tent_protests.3.a: "That's how it's done."
 embassy_tent_protests.4.t: "Raspando con los Protestores"
 embassy_tent_protests.4.d: "Después de que la seguridad hizo una brecha en la multitud para Tony para salir del pabellón y hablar con los manifestantes, uno de ellos le arrojó, aparentemente intoxicado, y en reacción el [GetASTLeaderTitle] lanzó un puño hacia atrás. El protestante no ha sufrido ninguna lesión importante, y es evidente que Abbott se defendía a sí mismo, pero los periodistas en su interior rompieron todas las fotos que necesitaban y ahora parece que el [GetASTLeaderTitle] está luchando literalmente con manifestantes."
 muslim_protests_sydney.1.t: "Riots islámicos erupción en Sydney"
 muslim_protests_sydney.1.d: "En una serie de manifestaciones masivas entre Oriente Medio y Londres, los musulmanes han marchado enojo por la polémica liberación de la película «Innocence of Muslims». Sydney no ha sido una excepción ya que las protestas se han propagado al CDB. Más de 150 policías han sido llamados a las protestas y 6 han sido llevados al hospital después de que estallaran en disturbios. \n\nHasta ahora 8 personas han sido arrestadas, y después de un enfrentamiento tenso fuera del consulado americano, las multitudes han comenzado a dispersarse."
 muslim_protests_sydney.1.a: "No es lugar para el extremismo."
 murrawarri_republic_event.1.t: "La República de Murrawarri declara la independencia"
 murrawarri_republic_event.1.d: "Nuestro Parlamento ha recibido una carta en la que anuncia la independencia de un Estado con el nombre de la República Murrawarri. En la carta se estipula que el «Consejo de Pueblos del Murrawarri» ha reclamado territorio atrayendo la frontera entre Nueva Gales del Sur y Queensland como su nueva tierra soberana, y han exigido reconocimiento. \n\nFrancamente es lo más extraño que ha visto cualquiera de nuestros empleados, y no parecen tener ninguna base legal para hacer la solicitud, o para que respondamos."
 murrawarri_republic_event.1.a: "¿El Murra-qué?"
 shark_attacks_ast.1.t: "Tiburón Ataques elevan la preocupación pública"
 shark_attacks_ast.1.d: "Alrededor de 270 kilómetros al sur de Perth, cerca de Gracetown, un hombre de 35 años fue asesinado por un tiburón. 6 días más tarde otro surfista, Zac Young de 18 años, murió en un ataque de tiburón cerca del puerto de Coffs. La repentina cadena de muertes relacionadas con el tiburón ha impulsado al gobierno australiano occidental a prometer un enfoque más agresivo para cazar tiburones que entran en zonas populares de natación. \n\nA pesar del riesgo de que los ataques de tiburones disminuyeran en los últimos años, el gobierno de la WA ha gastado más de $20 millones en patrullas aéreas y culinarios para derribar a la población de tiburones, un movimiento cuestionado por los biólogos marinos como una reacción excesiva."
 shark_attacks_ast.1.a: "We're friends, not food!"
 election_outcomes_ast.3.t: "Trabajo asegura otro mandato"
 election_outcomes_ast.3.d: "Los australianos se han reunido en todo el país para votar y decidir la dirección futura de la nación. Esta vez han elegido para que la gobernanza de [AST.GetLeader] continúe, otorgando al partido otro mandato. El [GetASTLeaderTitle] dio su discurso electoral en la sede de Barton, rodeado por una multitud animada de partidarios del Trabajo, y esbozó los planes continuos para sus próximos tres años. La «maldición de la incumbencia» del trabajo aparentemente ha sido levantada, y en su lugar se convirtió en un regalo, alejando a los votantes del cambio en apoyo de la estabilidad continua."
 election_outcomes_ast.3.a: "¿Por qué parar algo bueno?"
 election_outcomes_ast.7.t: "Partido Liberal gana la reelección"
 election_outcomes_ast.7.d: "A medida que los partidos electorales terminaron y el conteo llegó a su fin, se espera que el titular [AST.GetLeader] gane decisivamente la reelección. El mandato de su gobierno ha continuado ganando sobre la mayoría de los votantes, y solidificó su posición en la Cámara y el Senado, con pequeñas ganancias en toda la nación. Se espera que la empresa en el Parlamento se convoque como de costumbre, con el nuevo mandato que comienza el mes próximo."
 election_outcomes_ast.7.a: "¡Los buenos tiempos siguen viniendo!"
 election_outcomes_ast.9.t: "Malcolm Turnbull Eke una victoria en los votos"
 election_outcomes_ast.9.d: "El líder liberal Malcolm Turnbull ha conseguido la victoria en las elecciones federales, y la Coalición se dirige hacia una mayoría delgada en el Parlamento. \n\n«Este es un gran día de hoy», dijo Turnbull a la prensa antes de dar su discurso por la noche. \n\nDespués de la campaña para introducir un gobierno que abraza una dirección más tecnócrata, el nuevo [GetASTLeaderTitle] dio su discurso de aceptación con esa dirección en mente. \n\n«Debemos ser más competitivos, debemos ser más productivos y - debemos ser más innovadores». \n\nSe espera que el gobierno de Turnbull afronte las crecientes demandas energéticas de la nación, y aborde los sectores tecnológicos cada vez más amplios, con «una disposición para encontrar un terreno común con la gente y con nuestras industrias. El progreso es ayudar a todos, sé que podemos lograr algo genial si le ponemos nuestras mentes más grandes»."
 election_outcomes_ast.9.a: "Here's to a brighter direction!"
 detention_centres_full.1.t: "Centres Reaching Capacity"
 detention_centres_full.1.d: "Los centros de Papua y Nauru han comenzado a alcanzar la capacidad, a pesar de su alcance inicial y éxito, lo que ha causado un embotellamiento en nuestras operaciones de procesamiento de migrantes. Aunque la financiación ya está siendo dirigida a los centros para enmendar las deficiencias actuales, habrá que seguir mejorando o adoptando otras opciones si vamos a resolver el problema a largo plazo. Esto llega en un momento en que las llegadas no autorizadas han aumentado a su nivel más alto en años."
 detention_centres_full.1.a: "¿Nada dura?"
 migration_event_ast.1.t: "Inmigración no autorizada golpea nuevo récord"
 migration_event_ast.1.d: "El número de migrantes ilegales que intentan aterrizar en nuestras costas se ha disparado en los últimos meses. Ya sea alimentado por las crisis en curso, o la envidia de nuestra nación próspera, los migrantes vienen de lejos y ancho, y muchos están saltando la cola. Nuestra patrulla fronteriza ha llegado a un alto número de interceptaciones, y está empezando a poner fin a nuestra capacidad operacional."
 migration_event_ast.1.a: "Tiempos preocupantes."
 aukus_formed_ast.1.t: "AUKUS Partnership In Action"
 aukus_formed_ast.1.d: "Los líderes de Australia, el Reino Unido y los Estados Unidos se reunieron en Washington, D.C, en el Pentágono antes para discutir la formación de la alianza trilateral. Según se informa, las capacidades cibernéticas, la inteligencia artificial y la protección de las cadenas de suministro formaban parte del debate, todo ello con el objetivo de intensificar la cooperación diplomática y de defensa entre los tres estados. \n\n«Durante más de 70 años, Australia, el Reino Unido y Estados Unidos han trabajado juntos... Hoy - nos recomendamos a esta visión.» \n\nLa asociación aparentemente funcionará como una adición a las tres alianzas actuales de la nación. [AST.GetLeader] ha indicado que la primera intención de AUKUS es fortalecer la proliferación de defensa."
 aukus_formed_ast.1.a: "La compañía de dos, tres es una asociación."
 pukpuk_treaty_event.1.t: "Tratado histórico PNG-Australia firmado en vigor"
 pukpuk_treaty_event.1.d: "El histórico «Tratado de Pukpuk» entre Papua Nueva Guinea y Australia ha sido finalizado, y ha sido proclamado como una elevación de las relaciones de nuestra nación por el [GetASTLeaderTitle], señalando su unión «como vecinos, como compañeros, y ahora como aliados». \n\nEl tratado, nombrado después del término local para el cocodrilo, iniciará el proceso de integración del ejército PNG en la Fuerza de Defensa de Australia y permitirá que hasta 10.000 nacionales de PNG sirvan. Ambos también se comprometen a apoyarse mutuamente si uno de los dos países está siendo atacado. Un boón sizable para la proyección y estabilidad de seguridad regional."
 pukpuk_treaty_event.1.a: "¡A nuestros socios y amigos!"
 ast_taiwan_recognition.1.t: "Australia reconoce a la República de China"
 ast_taiwan_recognition.1.d: "En una inversión histórica de la política bipartidista, [AST.GetLeader] ha reconocido formalmente a Taiwán como un estado soberano e independiente. Representando el primer pivote que el país ha alejado de una postura China continental desde la visita de Gough Whitlam en 1971. Como parte de un «momento por la paz» en la región del Indo Pacífico, el [GetASTLeaderTitle] señaló que el reconocimiento viene como un «conocimiento de la realidad», con un impulso para el concepto de dos Chinas. \n\nLas reacciones de China han sido rápidas y escamosas. Los ministros chinos han lanzado a Australia como una «nación de dos caras» en línea, y el ministerio extranjero ha comenzado inmediatamente a establecer una serie de restricciones al comercio entre los países, sólo un pelo corto de un embargo completo."
 ast_taiwan_recognition.1.a: "Un amigo de hecho."
 howard_rumblings_in_dark.1.t: "Rumblings in the Party"
 howard_rumblings_in_dark.1.d: "Siempre había un nivel de beligerancia en el Partido Liberal, y con cualquier controversia que a menudo encontraría hirviendo a la superficie. Howard sabía que la única diferencia entre un compañero de trabajo y un colega descontento era una buena encuesta, y últimamente la votación fue erróneamente baja. Los grumbles de backdoor habían cerrado su camino a los papeles, pero incluso sin los tabloides las críticas podían ser escuchadas. \n\nAlgunos dijeron que Howard era simplemente demasiado viejo, otros que él estaba «sin tacto.» Él sabía que mucho al contrario del pensamiento, él estaba muy en contacto con el detrás de las escenas de scheming. Su propio diputado, Peter Costello, ya estaba haciendo movimientos para la próxima votación de liderazgo. Aceptar acuerdos y sacar votos, y si Howard no pudiera sacar las cosas a su manera entonces estaría fuera del primer ministerio, y Costello estaría dentro. Tal era la naturaleza de la política del partido."
 howard_rumblings_in_dark.1.a: "We must fix this."
 howard_rumblings_in_dark.2.t: "Betrayals in the Cabinet"
 howard_rumblings_in_dark.2.d: "No había salido del azul, pero era en las primeras horas de la mañana que tenía las noticias. En lugar de dejar que lo arrastren por el barro, y rozándola a través de la votación de liderazgo, Howard iba a ir en sus términos. Había traído la fiesta de vuelta del borde, y ahora lo estaban echando. \n\n«Ha sido un inmenso privilegio todos los días de mi vida en estos últimos años haber sido [GetASTLeaderTitle] de este hermoso país y quiero agradecer al pueblo australiano el privilegio que me han dado durante ese período de tiempo. Lo respeto y lo honro. Después de años de persecución, liderar esta nación ha sido la experiencia más increíble de toda una vida.» \n\n«Quiero dar las gracias al pueblo australiano por el privilegio que me han dado, permitiéndome servir. Acepto la plena responsabilidad por el Partido Liberal, los éxitos y las pérdidas que hemos tenido. No es fácil perder tu lugar en la fiesta. Sin embargo, les debo más de lo que me debe el partido». \n\nTerminó con una ola corta, y luego volvió a Bennelong. De vuelta a los pastos más verdes..."
 howard_rumblings_in_dark.2.a: "Yet it still stung."
 abbott_gov_event.1.t: "Gobierno Abbott revela gabinete dominado por Hombre"
 abbott_gov_event.1.d: "Los elegidos [GetASTLeaderTitle], Tony Abbott, han revelado un gabinete pesado sobre la experiencia, con 15 veteranos del gobierno de Howard – pero una luz sobre la representación femenina, con el diputado [GetASTLeaderTitle], Julie Bishop, la única mujer en el gabinete de 19 tiempos. \n\nAbbott exclamó que estaba decepcionado porque no había «al menos dos» mujeres en el gabinete, pero esperaba que las mujeres fueran promovidas a lo largo del tiempo, con mujeres «buenos y talentosas» en el ministerio exterior «atrapar en la puerta» del gabinete proveniente del ministerio exterior. Aunque de los 11 miembros del ministerio exterior, sólo cuatro son mujeres. \n\nEl desequilibrio ha sacado numerosas críticas de los partidos de la oposición, a las que Abbott fue rápido para alejarse para abordar los «grandes problemas»."
 abbott_gov_event.1.a: "It is a meritocracy after all."
 abbott_gov_event.2.t: "Australia vota «Sí» para el reconocimiento indígena"
 abbott_gov_event.2.d: "Tras un voto nacional de apoyo del 74%, los australianos aborígenes y los isleños del Estrecho de Torres quedarán consagrados en la Constitución como parte del nuevo enfoque del gobierno abadt para el reconocimiento indígena. En el festival de cultura anual de Garma que llevó al referéndum, Abbott señaló que «el reconocimiento indígeno no cambiará nuestra constitución sino completarla», describiendo la enmienda como un momento de sanación para muchos. \n\nDesde los resultados, Abbott también ha reiterado su plan de pasar una semana en una comunidad indígena. \n\n«El hecho es que si estos lugares son el hogar de los primeros australianos, ¿por qué no deberían estar en casa del [GetASTLeaderTitle] de nuestro país?»"
 abbott_gov_event.2.a: "Muy cierto."
 abbott_gov_event.3.t: "El incidente de la cebolla"
 abbott_gov_event.3.d: "Tony Abbott descendió a Tasmania rural, reuniéndose con los agricultores locales como parte de su proyecto agrícola. Los reporteros se reunieron alrededor del pabellón mientras Tony agitó las manos y dio un breve discurso junto con uno de los agricultores. \n\nFrente a él estaba una canasta cuadrada rebosando con productos, cada uno tan maduro y brillante como el siguiente. Mientras el granjero estaba explicando el proyecto a los reporteros, la mente de Abbott estaba en las cebollas. \n\n¿Los journos creerían que estaba realmente dedicado a los granjeros si no lo mostraba? ¿Cómo pudieron ver que los productos australianos eran realmente los mejores del mundo? \n\nMientras miraba hacia abajo las cebollas, alguien aparte de él comenzó a enredar. «Puedes quitarte un bocado ahora si tienes ganas!» \n\n¿Habían dicho eso realmente, o los propios pensamientos de Tony le estaban echando huevos? Antes de que supiera que una cebolla estaba en su mano. Las cámaras parpadeaban, y algunos jeers sonaban, mientras tomaba un mordisco de la cebolla cruda. El agricultor se volvió incredulante, ya que Tony sólo se detuvo para asentirse antes de tomar otro bocado. «Muy bien» era todo lo que podía hacer, viendo a Tony seguir munchándose."
 abbott_gov_event.3.a: "Why did he do that?"
 abbott_gov_event.4.t: "# Andando #"
 abbott_gov_event.4.d: "Otro mosquito encontró su camino en la tienda, a pesar de la red y el rociado incesante. Estaba demasiado oscuro para ver la cosa, así que trató de ignorarla. Había estado pasando la mitad mejor de una semana en Arnhem Land con los líderes locales, en el remoto Territorio del Norte, y la experiencia era muy pacífica, aparte de la constante charla del portátil al lado de su cama. \n\nAl día siguiente fueron las ceremonias habituales, y una sola vez con el líder del clan Gumatji. El líder estaba muy ansioso por discutir la oferta que había recibido de Rio Tinto, con una propuesta para una nueva mina de bauxita cerca. Ya habían perforado en la región antes, pero la nueva mina estaría en tierra sagrada, por lo que el [GetASTLeaderTitle] tenía que firmar. \n\nEl líder del clan iba a recibir el 75 por ciento de las regalías, y Rio Tinto afirmó que la operación daría al Gumatji «successful careers in the mining industry.» Dudoso, dado que en todos los años que Río ha minedo en las tierras de Yolngu, la operación sólo ha producido un aprendiz aborígenes calificado."
 abbott_gov_event.4.a: "Aprobar la mina."
 abbott_gov_event.4.b: "Es tierra sagrada."
 abbott_gov_event.5.t: "Resbalajes en el Curriculum"
 abbott_gov_event.5.d: "Tony Abbott estaba en el podio frente a la misma sala llena que hizo campaña hace poco. Detrás de él estaba un estandarte del Partido Liberal y la bandera australiana, a la que él insistió también fue tensa. Comenzó con las habituales especialidades antes de indagar en la falta del actual sistema educativo. Tony estaba quizás a su más cómodo cuando se metió en las cosas. Es lo que le hizo un buen líder de la oposición, y ahora estaba tratando de vender su reforma curricular. \n\nNo cabe duda de que su retórica los estaba ganando, pero mientras el discurso iba en algo más desafortunado ocurrió. \n\n«Nadie, por inteligente que sea bien educado, sin embargo experimentado... es el supositorio de toda sabiduría.» \n\nUnas risas sonaron como Abbott lentamente se dio cuenta de que había confundido la palabra repositorio con el nombre de una herramienta rectal médica. Continuó el discurso sin más golpes, pero al día siguiente ese pequeño error estaba por todas partes."
 abbott_gov_event.5.a: "They do sound similar..."
 abbott_gov_event.6.t: "Results of the Commission"
 abbott_gov_event.6.d: "La auditoría ha realizado un examen amplio de nuestros gastos, y ha proporcionado un plan bastante radical para reducir el gasto. Se incluyen los recortes a las pensiones, la atención de salud pública, la educación y la dola. Si seguimos adelante con la propuesta completa, el público podría ser demasiado para que nos recuperemos, pero sin duda proporcionará un impulso masivo al presupuesto. De lo contrario podríamos regarla y entregar algo más agradable a los votantes."
 abbott_gov_event.6.a: "Relájate."
 abbott_gov_event.6.b: "Go all the way."
 malcolm_abbott_event.1.t: "Malcolm's Visit"
 malcolm_abbott_event.1.d: "Nuestro ministro de comunicación, Malcolm Turnbull, nos ha acercado en silencio con respecto a nuestra dirección política, advirtiendo que cualquier corte de costos continuo va a tener ramificaciones serias. No está claro si quiere decir que las reacciones del partido en particular o la percepción pública, pero Malcolm tiene un problema para el teatro antes. Esto puede ser otro de las exageraciones, y él se ha opuesto vocalmente a nuestras restricciones fiscales antes."
 malcolm_abbott_event.1.a: "Publicly anuncia un fin a la reducción de costos."
 malcolm_abbott_event.1.b: "He's overreacting."
 malcolm_abbott_event.2.t: "Las protestas de Abbott «Cruel budget» Sparks en todo el país"
 malcolm_abbott_event.2.d: "Miles han asistido a rallyes por toda Australia protestando por la última ronda de recortes de costos del gobierno. Grandes protestas de 'Bust the Budget' se realizaron en casi todas las ciudades importantes, especialmente a las que asistió el Consejo Australiano de Sindicatos, quien participó en la marcha. El tesorero Joe Hockey ha tratado de defender los recortes, afirmando que el país ha «traído a las líneas de guerra de clases de la década de 1970» y su presupuesto era sobre igualdad de oportunidades, no igualdad de resultados. \n\nSin embargo, los manifestantes han indicado que están planeando continuar la marcha durante el resto del mes. El más reciente de los cuales estaba fuera de los jardines de la Cámara Parlamentaria, con un títere más grande que la vida del [GetASTLeaderTitle]."
 malcolm_abbott_event.2.a: "¡No me parezco así!"
 malcolm_abbott_event.3.t: "El Liderazgo Spill"
 malcolm_abbott_event.3.d: "Después del reciente retroceso público, durante la última reunión del partido uno de los miembros votó por un «spill» de liderazgo, provocando un nuevo voto para si Tony debe seguir siendo líder o no. Ya que nadie tiene la voluntad de hacer el desafío, el único candidato aparte de Tony era una silla vacía en la habitación. \n\nCuando los votos llegaron, el [GetASTLeaderTitle] salió por encima con 61 votos, aunque un número no significativo de 39 votos fue a la silla vacía. Es evidente que la caída en el apoyo del partido es algo por lo que preocuparse, y si no podemos dar vueltas a las cosas alrededor de otro voto podría terminar mucho peor."
 malcolm_abbott_event.3.a: "Todavía hay tiempo."
 abbott_jakarta_event.1.t: "Luchar contra la Buena Lucha"
 abbott_jakarta_event.1.d: "En la mente de Abbott, pasar por Yakarta era el lugar adecuado para empezar. Deslizó las mentes de muchos australianos que Indonesia era una nación mayoritariamente musulmán con más de 230 millones de personas, sólo un pequeño salto de la tierra natal. Desde los Bombings de Bali parecía que cada mes aparecían noticias de otro ataque. Nunca estaba seguro de que el siguiente no estaría más cerca de casa, y así el pensamiento siempre estaba en su mente. \n\nCuando Tony habló con el presidente, [IND.GetLeader], planteó el tema. Por supuesto su objetivo era vender la idea de las operaciones de mantenimiento de la paz australianas en el país, algo que había estado viéndose por un tiempo ahora, y mucho al consternación del gobierno indonesio. \n\nDe antemano, el poder blando había sido la estrategia durante décadas, con programas educativos y otros paquetes de ayuda para mantener las tensiones étnicas, por lo que eran abundantes, a niveles moderados. Aunque apenas era una solución a la amenaza del fundamentalismo. Al mejor Tony se fue con una promesa de su gobierno de continuar las actuales cooperaciones, y que la puerta estaría abierta a futuros esfuerzos."
 abbott_jakarta_event.1.a: "In short, a disappointing outcome."
 o_canada_abbott.1.t: "Australia ofrece cooperación minera"
 o_canada_abbott.1.d: "El gobierno de Canberra se ha acercado a nosotros con una oferta para intercambiar expertos técnicos mineros en un esfuerzo por acercar nuestras naciones y aprovechar los ricos recursos naturales que ambos heredamos. El acuerdo es bastante sencillo y en la superficie nos beneficiaría a ambos, incluso si el actual gobierno australiano no ha estado muy cercano al nuestro."
 o_canada_abbott.1.a: "Damos la bienvenida a nuestros hermanos del Commonwealth."
 o_canada_abbott.1.b: "No thanks."
 o_canada_abbott.2.t: "A Few Gaffs In Ottawa"
 o_canada_abbott.2.d: "En Ottawa, Tony se dirigió a la multitud de periodistas, muchos de los cuales eran australianos a pesar de su ubicación. Parecía que ni siquiera podía dejar el país sin un cuadro de journos persiguiéndolo. [CAN.GetLeader] estaba a su lado mientras hablaba. Mientras intentaba no caer en el hábito de estereotiparlos, no podía evitar mencionar que eran una gente amigable. Un poco lejos para su gusto, sin embargo. \n\nLa mente de Tony volvió a cerrar su discurso. Se volvió y estremeció la mano de su líder antes de salir, y mientras tropezó unas cuantas veces en el discurso, en un momento refiriéndose al país como «Canadia», las cosas se apagaron en gran medida sin un hitch. El gobierno canadiense había acordado una inversión minera, y a cambio estábamos enviando a nuestros propios expertos allí para ayudar con la perforación."
 o_canada_abbott.2.a: "It's that Commonwealth commonality."
 abbott_china_trade.1.t: "Cooperación en materia de comercio de Australia"
 abbott_china_trade.1.d: "El líder australiano, [AST.GetLeader], ha estado muy ansioso por ampliar el alcance actual de nuestro comercio con su nación progresando con un Tratado de Libre Comercio. El acuerdo incluiría hasta el 95% de las importaciones arancelarias libres de nuestras mercancías, y un intercambio de recursos más suave, junto con las estipulaciones que permiten a nuestras empresas privadas invertir en Australia con mayor facilidad. En la superficie esto parece ser un ganar-ganar en cada sentido de la palabra."
 abbott_china_trade.1.a: "A worthy endeavor"
 abbott_china_trade.1.b: "No en nuestro mejor interés."
 abbott_china_trade.2.t: "El Acuerdo de Libre Comercio [GetYear] firmado"
 abbott_china_trade.2.d: "China ha acordado nuestro acuerdo bilateral de libre comercio, fortaleciendo enormemente el flujo de minerales y productos manufacturados entre nosotros. Casi una década de negociaciones para un pacto más expansivo finalmente se han realizado. Dada la posición de la nación como nuestra mayor fuente de ingresos de exportación, los efectos deben sentirse inmediatamente en toda la economía. Con un documento firmado y un apretón de manos, el Pacífico es de repente un lugar más cercano, más unido."
 abbott_china_trade.2.a: "La magia de los intereses alineados."
 abbott_china_trade.3.t: "China niega más colaboración comercial"
 abbott_china_trade.3.d: "Por desgracia, China ha rechazado nuestras ofertas de mayor colaboración y nos ha cerrado diplomáticamente por el momento. Parece que es posible que debamos mirar otras avenidas para confiar en el futuro."
 abbott_china_trade.3.a: "No es el peor resultado, pero ciertamente no bueno."
 abbott_navy_exercises_event.1.t: "Frutas de los Ejercicios"
 abbott_navy_exercises_event.1.d: "Los ejercicios con nuestros amigos americanos se han enrollado y han dado algunos resultados útiles. Aparte de que nuestras fuerzas recibieron alguna práctica muy necesaria, los ejercicios señalaron algunas deficiencias en la tecnología de nuestra unidad. Después de compartir los datos con nuestras divisiones R&D, parece que podemos aplicar algunos de estos hallazgos con nuestro desarrollo de investigación."
 abbott_navy_exercises_event.1.a: "This certainly is useful."
 knights_and_dames_ast_event.1.t: "Reacciones mixtas sobre la caballerosidad del Príncipe Felipe"
 knights_and_dames_ast_event.1.d: "Los colegas mayores de [GetASTLeaderTitle] han mostrado vocalmente una mezcla de desconcierto, enojo y consternación por su decisión de restablecer la tradición al otorgar un Caballero Australiano al Príncipe Felipe, un no australiano. \n\nLos ministros del Gabinete han dicho al ABC que el [GetASTLeaderTitle] no consultó a ninguno de los líderes antes de anunciar el premio. Un movimiento que parece haber dividido el parlamento entre partidarios republicanos. \n\n«Estoy muy contento de que en sus años 90, hacia el final de una vida de servicio y deber, en este país podamos reconocer adecuadamente lo que ha hecho por nosotros.» Tony Abbott dijo en su declaración sobre la decisión. Aunque la reacción del Reino Unido ha sido una gratitud un tanto muda, las reacciones en casa están resumiendo para ser cualquier cosa pero."
 knights_and_dames_ast_event.1.a: "No puedes complacer a todos."
 abbott_japan_trade_deal.1.t: "Renegociaciones comerciales de Canberra"
 abbott_japan_trade_deal.1.d: "El [GetASTLeaderTitle] de Australia, [AST.GetLeader], nos ha contactado directamente para discutir renegociar los compromisos comerciales que actualmente tenemos con su nación para «reegir» algunas inadecuaciones. No está claro si se están infiriendo a algunos de nuestros lados o de los suyos, pero algo irrefutable del acuerdo podría proporcionar un tránsito más suave de mercancías entre nosotros. En particular, las importaciones agrícolas."
 abbott_japan_trade_deal.1.a: "Parece justo."
 abbott_japan_trade_deal.1.b: "No thanks."
 abbott_japan_trade_deal.2.t: "Negociaciones con Japón Trato Histórico"
 abbott_japan_trade_deal.2.d: "Las renegociaciones han alcanzado el oro económico, presentándonos un acuerdo mucho más justo. Los aranceles que Japón tiene sobre nuestra carne serán prácticamente eliminados, junto con un montón de otros productos agrícolas. El único producto que no estaban dispuestos a brotar era el arroz, sin embargo. \n\nTambién firman un contrato de recursos prioritarios. Mientras tanto, como se prometió, estamos cortando una serie de aranceles sobre su electrónica y sus vehículos. El impulso que esto dará a nuestro sector agrícola no puede ser subestimado. Una victoria seria para nosotros en comparación con el trato original."
 abbott_japan_trade_deal.2.a: "Now that's a fair go."
 abbott_saf_event.1.t: "Ciudad del Cabo Woes"
 abbott_saf_event.1.d.a: "Curiosamente, la nación de Sudáfrica tiene tres capitales diferentes. Un hecho que Abbott luchó para comprender. En cuanto a no frenar las cosas, Johannesburgo fue elegido por el bien de la sencillez, y cuando llegó la parada era el recién construido estadio FNB. Evidentemente estaban ansiosos de mostrar sus esfuerzos de modernización, aunque Tony no podía dudar que estaba en un país en desarrollo. \n\nEl elefante que eventualmente tendría que abordar era el problema de los refugiados. Miles de agricultores predominantemente blancos, que huían de los enfrentamientos étnicos en curso, habían estado protestando por la inacción del gobierno sudafricano. Sin embargo, los funcionarios insisten en que están haciendo todo lo posible, y ese asunto se está soplando de forma proporcional. \n\nTodo lo que Abbott sabía era que el número de refugiados estaba creciendo y exigían condenación."
 abbott_saf_event.1.d.b: "Curiosamente, la nación de Sudáfrica tiene tres capitales diferentes. Un hecho que Abbott luchó para comprender. En cuanto a no frenar las cosas, Johannesburgo fue elegido por el bien de la sencillez, y cuando llegó la primera parada fue el memorial Nelson Mandella. Había un profundo respeto que Abbott tenía para el hombre, incluso solicitando que las banderas en Australia sean bajadas a la mitad mástil durante el día. \n\nAunque el elefante que eventualmente tendría que abordar era el problema de los refugiados. Miles de agricultores predominantemente blancos, que huían de los enfrentamientos étnicos en curso, habían estado protestando por la inacción del gobierno sudafricano. Sin embargo, los funcionarios insisten en que están haciendo todo lo posible, y ese asunto se está soplando de forma proporcional. \n\nTodo lo que Abbott sabía era que el número de refugiados estaba creciendo y exigían condenación."
 abbott_saf_event.1.b: "Condena al gobierno y agiliza los visados de refugiados."
 abbott_saf_event.1.a: "Tienen nuestro apoyo."
 indonesian_intervention_abbott.2.t: "Yakarta rechaza nuestra solicitud"
 indonesian_intervention_abbott.2.d: "Es de esperar que el gobierno indonesio haya rechazado nuestra solicitud de permitir operaciones de mantenimiento de la paz en el país, y ha impedido a nuestros diplomáticos seguir discutiendo la acción. La respuesta nos ha dejado con pocas opciones para hacer cumplir la demanda aparte de la acción directa. Mientras tanto, parece que toda la cooperación se ha congelado."
 indonesian_intervention_abbott.2.a: "Nos están forzando la mano."
 indonesian_intervention_abbott.3.t: "Yakarta aprueba nuestros esfuerzos de mantenimiento de la paz"
 indonesian_intervention_abbott.3.d: "Parece que el infierno se ha congelado, o tal vez Yakarta tiene. El Gobierno de Indonesia ha aprobado nuestra solicitud de operaciones de mantenimiento de la paz en la nación. Esto hará maravillas por nuestro anti-terorismo, y con nosotros capaces de intervenir directamente sobre las amenazas, la posibilidad de otro ataque en el futuro se ha reducido drásticamente."
 indonesian_intervention_abbott.3.a: "This is great news!"
 oceanic_alliance_ast.1.t: "Talks Of An Oceanic Alliance"
 oceanic_alliance_ast.1.d: "El gobierno de Canberra ha enviado a una delegación para discutir la formación de una alianza oficial oceánica, con el propósito expreso de unirnos. La unión significaría efectivamente combinar nuestras fuerzas militares con el fin de mantener las medidas defensivas en el Pacífico, y los australianos han insistido en que el pacto evitaría el potencial del conflicto en la región para el futuro previsible si se realiza. Sin embargo, ciertamente estaríamos renunciando a cierto nivel de autonomía, y tal vez no nos atemos voluntariamente a la política exterior siempre cambiante de Australia."
 oceanic_alliance_ast.1.a: "A worthy endeavor."
 oceanic_alliance_ast.1.b: "Nuestra independencia es más importante."
 oceanic_alliance_ast.2.t: "Nueva Zelanda rechaza la alianza"
 oceanic_alliance_ast.2.d: "Parece que el gobierno de Nueva Zelanda no ha considerado apropiado formalizar una alianza en este momento, viendo que sus capacidades defensivas actuales son suficientes. Es un resultado decepcionante estar seguro, pero todavía puede haber otras vías para explorar."
 oceanic_alliance_ast.2.a: "Como ellos mismos."
 oceanic_alliance_ast.3.t: "Indonesia rechaza la Alianza"
 oceanic_alliance_ast.3.d: "Parece que el gobierno indonesio no ha considerado apropiado formalizar una alianza en este momento, viendo que sus capacidades defensivas actuales son suficientes. Es un resultado decepcionante estar seguro, pero todavía puede haber otras vías para explorar."
 oceanic_alliance_ast.4.t: "Papua Nueva Guinea rechaza la Alianza"
 oceanic_alliance_ast.4.d: "Parece que el gobierno de Port Moresby no ha considerado apropiado formalizar una alianza en este momento, viendo que sus capacidades defensivas actuales son suficientes. Es un resultado decepcionante estar seguro, pero todavía puede haber otras vías para explorar."
 oceanic_alliance_ast.5.t: "Vanuatu rechaza la Alianza"
 oceanic_alliance_ast.5.d: "Parece que la República de Vanuatu no ha considerado apropiado formalizar una alianza en este momento, viendo que sus capacidades defensivas actuales son suficientes. Es un resultado decepcionante estar seguro, pero todavía puede haber otras vías para explorar."
 operation_sovereign_abbott.1.t: "Operación Soberana Fronteras"
 operation_sovereign_abbott.1.d: "Scott Morrison se inclinó hacia Abbott y cogió su mano, sacudiéndolo mientras las cámaras parpadeaban. Scott era un par de pulgadas más alto que él, y su mano estaba atrapada en el agarre de Scott por unos segundos más de lo que se sentía cómodo con. En privado Morrison había vendido la factura como un paso impopular pero necesario para combatir la creciente tensión de migración ilegal, y se ofreció a ser el frente de ella en caso de cualquier contratiempo. Abbott fue lo suficientemente experimentado como para saber que había más en juego. \n\nMorrison había ganado notabilidad por su trabajo detrás de las escenas, actuando como un látigo de fiesta en todos menos título para mantener a todo el mundo en línea. Admitido que era eficaz, y muy rápido para ofrecer una solución a los problemas sólo tenía la previsión de ver. Hasta ahora había hecho sus cuotas. Si quería conseguir algo de crédito era justo, era su política después de todo. Así que Abbott estuvo de acuerdo, y el lanzamiento se había convertido en un gran truco publicitario para su gobierno."
 operation_sovereign_abbott.1.a: "¡Di queso!"
 japan_subs_abbott.1.t: "Deciding on the Purchase"
 japan_subs_abbott.1.d: "El plan original era comprar 6 submarinos de clase Harushio para reemplazar nuestra flota envejecida de clase Collins. Sin embargo, teniendo en cuenta la necesidad de poder de fuego sobre las olas, podríamos solicitar una compra de 3 destructores de luz basados en el heli. \n\nLos subs remarían nuestros números de flota muy bien, y los modelos han sido actualizados a la última tecnología. Por otro lado, los destructores de la clase Murasame podrían darnos el borde en el aire y en términos de fuerza de fuego cruda."
 japan_subs_abbott.1.a: "Stick to the subs."
 japan_subs_abbott.1.b: "Go with the destroyers."
 japan_subs_abbott.2.t: "Solicitud de compra de buques desde Australia"
 japan_subs_abbott.2.d: "Los australianos han alcanzado una propuesta interesante. Se han ofrecido a comprar seis de nuestros submarinos envejecidos, Harushio-clase para rematar su flota por una suma considerable. Esto fortalecería nuestros lazos de defensa, y proporcionaría algunos fondos adicionales para los subs de reemplazo."
 japan_subs_abbott.2.a: "Aprobar el trato."
 japan_subs_abbott.2.b: "No es de nuestro mejor interés."
 japan_subs_abbott.3.d: "Los australianos han alcanzado una propuesta interesante. Se han ofrecido a comprar tres de nuestros envejecidos, los destructores de luz de Murasame para remar su flota por una suma considerable. Esto fortalecería nuestros lazos de defensa, y proporcionaría algunos fondos adicionales para los buques de reemplazo."
 japan_subs_abbott.4.t: "Japón Rechaza la venta"
 japan_subs_abbott.4.d: "Inesperadamente el gobierno japonés ha rechazado nuestro acuerdo, prefiriendo mantener su flota a su tamaño actual. A este ritmo van a llamarnos el país de la UNLUCKY."
 japan_subs_abbott.4.a: "Esto no puede ser..."
 japan_subs_abbott.5.t: "Japón aprueba la venta"
 japan_subs_abbott.5.d: "Japón ha aprobado la solicitud de venta, y los barcos pronto serán transferidos a nuestra flota. Proporcionándonos un poco de fuerza de fuego adicional necesaria en los mares."
 japan_subs_abbott.5.a: "Excelentes noticias."
 abbott_condemns_china.1.t: "Tony Abbott denuncia la expansión de China"
 abbott_condemns_china.1.d: "La reciente postura de Australia [GetASTLeaderTitle] sobre China ha preocupado a los veteranos del Partido Liberal, y el apoyo de los votantes, tomando una nueva posición contra la construcción artificial de la isla en el país. \n\nEn una conferencia de prensa ayer el líder reprendió los recientes movimientos de China como «la mayor expansión militar en la historia de la paz». Exigiendo un fortalecimiento urgente de las propias fuerzas de Australia para mantener la disuasión. Poniendo de relieve la colocación de más buques y aviones en Asia oriental para excitar al país de las cadenas de suministro críticas. \n\nDesde el anuncio oficiales chinos han condenado la postura, y describió a Tony Abbott como induciendo «histeria anti-China». Independientemente de la intención, las tensiones buscan alcanzar un punto alto entre los dos países."
 abbott_condemns_china.1.a: "¿Son nubes de tormenta?"
 kuala_lumpur_abbott.1.t: "Pacto de Comercio para la Neutralidad"
 kuala_lumpur_abbott.1.d: "El comercio mineral entre nosotros y Australia ha llegado al punto de que el gobierno de Australia nos ha contactado para discutir la promulgación de un acuerdo de libre comercio entre nosotros. Las características específicas del acuerdo incluyen la reducción de carbón, aluminio y otros aranceles minerales, junto con algunas importaciones de productos. A cambio, Australia reducirá sus aranceles sobre nuestras exportaciones de petróleo crudo, equipo electrónico y transporte. \n\nParte del acuerdo, sin embargo, ha estipulado que declaramos nuestra neutralidad en sus actuales desacuerdos con China, lo que sólo nos equivale a firmar un pacto de no agresión con ellos."
 kuala_lumpur_abbott.1.a: "Un acuerdo justo."
 kuala_lumpur_abbott.1.b: "It's too much to ask."
 kuala_lumpur_abbott.2.t: "Malasia firma el Pacto"
 kuala_lumpur_abbott.2.d: "Nuestros amigos en Malasia han firmado el acuerdo comercial y han firmado formalmente el pacto de permanecer diplomáticamente neutrales en nuestros asuntos. Permitiendo el intercambio de minerales y producir fluir suavemente entre nosotros. Otra parte de la Cadena de la Isla ha sido sacada de la foto."
 kuala_lumpur_abbott.2.a: "Muy bien."
 kuala_lumpur_abbott.3.t: "Malasia Acuerdo de neutralidad rehusado"
 kuala_lumpur_abbott.3.d: "A pesar de nuestras mejores intenciones, Malasia se ha negado a hacer promesas y ha rechazado nuestro acuerdo comercial. Un pedazo de la cadena de la isla lamentablemente permanece sobre la mesa."
 kuala_lumpur_abbott.3.a: "Quién sabía que la diplomacia podría ser tan difícil."
 jap_repar_abbott.1.t: "Australia exige reparaciones para la segunda guerra mundial"
 jap_repar_abbott.1.d: "Curiosamente, el gobierno australiano se ha puesto en contacto con nosotros para organizar pagos muy aplazados por sus gastos durante WW2. La solicitud ha desconcertado a la mayoría de los funcionarios, que han visto nuestras relaciones con el país en gran medida positiva en las décadas desde la guerra. Sin embargo, su gobierno parece serio, y nos ha enviado un precio bastante grande."
 jap_repar_abbott.1.a: "Pagadlo."
 jap_repar_abbott.1.b: "¿Esto debe ser una broma?"
 jap_repar_abbott.2.t: "Los japoneses coinciden en pagar las reparaciones"
 jap_repar_abbott.2.d: "Parece que su gobierno entiende nuestros males, y ha acordado hacer un pago de suma global directamente para cubrir el costo de la guerra. Tampoco van a la mitad. Se celebrará una ceremonia oficial con la delegación japonesa en el puerto de Darwin, y se formará un departamento para facilitar la transferencia de las reparaciones. A pesar de la irregularidad de todo el evento, los medios de comunicación lo están llevando bien, y los partidos de oposición se mantienen en gran medida mudos."
 jap_repar_abbott.2.a: "Ahora las viejas heridas pueden sanar."
 jap_repar_abbott.3.t: "Japón rechaza las reparaciones"
 jap_repar_abbott.3.d: "En un giro algo vergonzoso el gobierno japonés ha rechazado la solicitud, y ha ido a lambarnos en su televisión nacional. Por supuesto que el nuestro debe estar en cahoots, porque todas las principales redes están haciendo una burla de todo el ordeal, sólo suplantado por la derrota que estamos recibiendo en la Cámara y el Senado. Algunas protestas se han visto incluso fuera del Parlamento agitando señales que representan a Abbott como un mendigo, sentado fuera de la embajada japonesa."
 jap_repar_abbott.3.a: "There's no need to rub it in."
 jap_alliance_abbott.1.t: "Alianza mutua desde abajo"
 jap_alliance_abbott.1.d: "Australia ha ofrecido un pacto de seguridad mutua, cuyos detalles darían lugar a una llamada a la guerra si el conflicto iba a estallar entre nosotros y China. El pacto aparentemente tiene por objeto disuadir de nuevos enfrentamientos con China, en un esfuerzo por salvaguardar el Pacífico."
 jap_alliance_abbott.1.a: "In this we are aligned."
 jap_alliance_abbott.1.b: "Esto va demasiado lejos."
 jap_alliance_abbott.2.t: "El Acuerdo de Yokohama"
 jap_alliance_abbott.2.d: "El gobierno de Tokio ha firmado el pacto, creando una alianza de seguridad entre nosotros. Si un conflicto fuera a salir entre nosotros y China, Japón sería llamado para unirse a la lucha. Otra pieza se ha añadido a nuestro lado del tablero."
 jap_alliance_abbott.2.a: "Una alianza honorable"
 jap_alliance_abbott.3.t: "Japón rechaza el Pacto"
 jap_alliance_abbott.3.d: "Después de un silencio inusual de los delegados japoneses, el [GetASTLeaderTitle] recibió una facetime de su homólogo japonés. Fue una llamada larga y con viento, y sólo se podía escuchar gritos murmurados fuera de la oficina del PMS, pero después de finalmente divulgar en un baile de tipo que las negociaciones han sido canceladas."
 jap_alliance_abbott.3.a: "Tal vez el peor resultado."
 france_abbott_ast.1.t: "Arrendamiento de islas"
 france_abbott_ast.1.d: "El Gobierno de Australia nos ha acercado con una oferta de arrendamiento de tierras en las islas de Nueva Caledonia para uso militar, durante un período de 5 años. Nos han asegurado que el contrato de arrendamiento garantizaría la estabilidad continua en el Pacífico, como parte de sus recientes esfuerzos de mantenimiento de la paz, y han ofrecido 39 mil millones para los derechos sobre la tierra y el bastión."
 france_abbott_ast.1.a: "Un trato justo."
 france_abbott_ast.1.b: "Las islas son nuestras solas."
 france_abbott_ast.2.t: "Nueva Caledonian Lease"
 france_abbott_ast.2.d: "Francia ha aprobado felizmente el contrato de arrendamiento, dando a nosotros el derecho de facto de ampliar nuestra presencia e infraestructura militar en las islas circundantes durante los próximos 5 años."
 france_abbott_ast.2.a: "Nuestro alcance crece."
 france_abbott_ast.3.t: "El plomo de la isla cae"
 france_abbott_ast.3.d: "Francia ha rechazado nuestra oferta de arrendar las islas en este momento, y nos ha dejado en el frío estratégicamente. Tendremos que encontrar otra manera de asegurar nuestro flanco oriental."
 france_abbott_ast.3.a: "It was a great deal!"
 france_abbott_ast.4.t: "Island Lease se acerca a su fin"
 france_abbott_ast.4.d: "El período de arrendamiento que Australia tiene en las islas Nueva Caledonia para el posicionamiento militar se acerca a su fin. Podemos ofrecerles una extensión por otros 5 años, o podemos solicitar que devuelvan las islas."
 france_abbott_ast.4.a: "Deja que extiendan el contrato de arrendamiento."
 france_abbott_ast.4.b: "Es hora de que vuelvan al pliegue."
 france_abbott_ast.5.t: "Francia Ofertas Ampliación"
 france_abbott_ast.5.d: "A medida que se acerca el fin de nuestro contrato de arrendamiento en las islas Nueva Caledonia, Francia ha logrado ofrecernos una prórroga por otros 5 años."
 france_abbott_ast.5.a: "Una oferta razonable."
 france_abbott_ast.5.b: "Pueden tenerlos de vuelta."
 france_abbott_ast.6.t: "Island Lease termina"
 france_abbott_ast.6.d: "A medida que se acerca el fin de nuestro contrato de arrendamiento en las islas Nueva Caledonia, Francia ha pedido que volvamos las islas y retiremos nuestras tropas actualmente estacionadas allí."
 france_abbott_ast.6.a: "Una petición razonable."
 france_abbott_ast.6.b: "Ahora son nuestros."
 france_abbott_ast.7.t: "Nueva Caledonian Islands Returned"
 france_abbott_ast.7.d: "Australia ha devuelto rápidamente las islas arrendadas y nos agradeció personalmente su uso."
 france_abbott_ast.7.a: "A fruitful transaction."
 france_abbott_ast.8.t: "Australia se niega a las Islas Relinquish"
 france_abbott_ast.8.d: "En lo que sólo puede describirse como una arrogancia insensata, el gobierno australiano se ha negado a renunciar a las islas. Incluso se han negado a pagar una extensión de arrendamiento, ocupando ilegalmente efectivamente las islas. Si bien una controversia diplomática que limita con la intervención militar no sería de duda, tendremos que protestar contra la ocupación en el escenario mundial."
 france_abbott_ast.8.a: "¡Esto es indignante!"
 middlepower_abbott.1.t: "Australia busca alianza"
 middlepower_abbott.1.d: "Una oferta de seguridad mutua ha llegado a nuestro camino desde Australia, cuyos detalles desencadenarían una llamada a la guerra si un conflicto iba a erupción entre nosotros y China. El núcleo de la propuesta es un intento de aislar a China y contener su esfera de influencia en el Pacífico. \n\nSin embargo, el acuerdo no incluye a Corea del Norte y podría poner un objetivo en nosotros dada nuestra proximidad con China. A pesar de ello, Australia nos ha asegurado que el pacto se ha creado sólo como disuasivo."
 middlepower_abbott.1.a: "Una búsqueda digna."
 middlepower_abbott.1.b: "No es suficiente."
 middlepower_abbott.2.t: "Complicaciones de la Alianza"
 middlepower_abbott.2.d: "Corea del Sur está impulsando más garantías defensivas en relación con el tratado, dada su proximidad a Corea del Norte alineada por China. Podemos facilitarlos con algunos programas de entrenamiento de tropas y apoyo a la producción, pero sin duda sería costoso. Nuestra elección depende de lo alto que valoramos el respaldo de Corea."
 middlepower_abbott.2.a: "Un tratado moderado para llevarlos."
 middlepower_abbott.2.b: "Cualquier cosa y todo."
 middlepower_abbott.2.c: "Es demasiado costoso."
 middlepower_abbott.3.t: "Contraofertas de australia con asistencia en defensa"
 middlepower_abbott.3.d: "En un intento por salvar el tratado, los australianos han contraofrecido un programa de capacitación en cooperativas y sus expertos para ayudar con la producción de armas. Es una oferta agradable sin duda. Claramente esperan que aceptemos."
 middlepower_abbott.3.a: "We welcome their support."
 middlepower_abbott.3.b: "It's still not worth it."
 middlepower_abbott.4.t: "Australia Contraofertas con considerable asistencia"
 middlepower_abbott.4.d: "En un intento de salvar el tratado, los australianos han contraofrecido una oferta muy sizable. Un amplio programa para la formación de los contingentes cooperativos y el apoyo a la producción de armas, incluidos contratos de reunión de plantas, préstamos de adquisición y expertos técnicos para ayudar a la ejecución. Claramente están saliendo con la esperanza de que aceptemos."
 middlepower_abbott.4.a: "We welcome their support."
 middlepower_abbott.4.b: "It's still not worth it."
 middlepower_abbott.5.t: "KAMAT se inscribió en la fuerza"
 middlepower_abbott.5.d: "En la embajada en Seúl, nuestros diplomáticos y Corea del Sur firmaron el Tratado de Seguro Mutuo Coreano-Australiano, garantizando que ambas naciones se apoyarían mutuamente en caso de guerra que amenazara la seguridad de ese país. Ahora estamos más alineados que nunca, y otro país ha venido a nuestro apoyo en la batalla por el Pacífico."
 middlepower_abbott.5.a: "Welcome aboard."
 middlepower_abbott.6.t: "Negotiations Hit a Wall"
 middlepower_abbott.6.d: "Las discusiones entre nosotros y los coreanos aparentemente han caído. A pesar de salir en buenas condiciones, se han librado de sus propias preocupaciones de seguridad. Nuestro trabajo para jaular al dragón tendrá que continuar sin ellos."
 middlepower_abbott.6.a: "El tigre coreano duerme."
 abbott_china_occupation.1.t: "The Strategy of Denial"
 abbott_china_occupation.1.d: "En la sala oscura Tony Abbott y el resto del gabinete de guerra vieron la pantalla brillante cortada entre tomas aéreas, imágenes satelitales y filmaciones de vigilancia de los transportes de tropas. Era hora de la noche y el video era choppy, pero el emblema del Ejército Popular de Liberación estaba claro como cualquier cosa. El enemigo había llegado a la tierra. \n\nEl corazón de Abbott se hundió. Se inclinó en su silla y corrió sus palmas a través de su frente. El resto de la habitación estaba tranquila, sólo se rompió cuando el analista paró las imágenes y comenzó la sesión informativa. Su primera prioridad era controlar la narrativa, pero sin duda el video ya estaba siendo compartido en línea, y esto buscaba ser el peor error de defensa nacional en la historia de la nación. De aquí en la lucha sería una cuesta arriba. \n\nHubo un silencio incómodo mientras el analista se detuvo y esperó la entrada del PM. La cara de Abbott, contorsionada en el pensamiento, era una mezcla de pereza y vacante. Finalmente se volvió hacia el resto de la habitación. «Mira, en este punto es bastante obvio que bueno, la mierda sucede.»"
 abbott_china_occupation.1.a: "In this case, it does."
 abbott_shirtfronting_china.1.t: "Flashpoint en Sea"
 abbott_shirtfronting_china.1.d: "Informes esporádicos están saliendo de nuestra flota en el Mar del Sur de China. Aunque la mayoría de las cuentas son parches, y la situación todavía no está clara, parece haber habido una confrontación en el Shoal. \n\nDespués de que nuestros barcos fueran desplegados para patrullar el Shoal Scarborough fueron confrontados por una flota china cercana. Esa flota exigió que nuestras naves abandonaran la zona y, poco después de que nuestras naves se negaran a hacerlo, una de las naves chinas abrió fuego. Hubo un intercambio momentáneo entre ellos antes de que el nuestro se retirara. Dos de nuestras fragatas se perdieron, con cuatro bajas hasta ahora. \n\nYa que estamos descubriendo esto ya que está sucediendo no ha habido una respuesta de China. La pelota está en nuestra corte sobre cómo proceder. Ahora mismo estamos en el borde de un cuchillo."
 abbott_shirtfronting_china.1.a: "Consigue una línea a Beijing."
 abbott_shirtfronting_china.1.b: "Este es un ataque descarado. No podemos mostrar debilidad."
 abbott_shirtfronting_china.2.d: "Una línea directa ha pasado del australiano [GetASTLeaderTitle] para discutir el asunto que se desarrolla en el Mar de China Meridional. Mientras nuestros informes siguen llegando, es evidente que ocurrió una escaramuza entre nuestra flota estacionada allí y una patrulla australiana, ocurriendo cerca del Shoal de Scarborough. \n\nSegún el informe, uno de nuestros destructores disparó un disparo de advertencia sobre los buques australianos, lo que provocó el intercambio. Hasta ahora ha habido tres bajas, y la flota ha recibido daños menores. Los australianos, sin embargo, parecen haber perdido dos barcos y pueden haber perdido cinco de sus propios. \n\nAhora son líderes que exigimos que retiremos nuestras naves de la zona y nos comprometamos a hablar de descalificación. La audacia es ciertamente irritante, pero la situación podría convertirse en una pesadilla en el escenario mundial si no damos concesiones."
 abbott_shirtfronting_china.2.a: "Anything to prevent a war."
 abbott_shirtfronting_china.2.b: "El dragón no se arrastra con las ovejas."
 abbott_shirtfronting_tt: "Vamos a retirar nuestras naves de la hoal por el momento siendo"
 abbott_shirtfronting_china.3.t: "De pie."
 abbott_shirtfronting_china.3.d: "El gobierno chino ha acordado retirar sus barcos de la región. Por un momento parecía que nuestras naciones estaban en un camino inevitable a la guerra, pero hemos estrechado ese rumbo. Mientras las tensiones siguen siendo elevadas, se han ofrecido a enviar una delegación a Canberra para arreglar algo sólido para evitar que esto suceda de nuevo. Hemos sufrido mucho por esto, pero marca una pequeña victoria."
 abbott_shirtfronting_china.3.a: "Otra guerra se evitó."
 abbott_shirtfronting_china.4.t: "Silence"
 abbott_shirtfronting_china.4.d: "La línea hizo clic y el sonido en el otro extremo fue muerto. Los chinos no están dispuestos a discutir cualquier tipo de escalada, a pesar de ser plenamente conscientes del incidente. Nos sentamos en un cruce de caminos. Si China continúa con este nivel de escalada indiscutible, estamos esencialmente en un nivel de guerra sin luchar. Por otro lado, hay poca distancia de una declaración en blanco."
 abbott_shirtfronting_china.4.a: "We have to stand down."
 abbott_shirtfronting_china.4.b: "If it's war they want..."
 call_japan_to_our_side_ast: "Llama a Japón a nuestro lado"
 call_kor_to_our_side_ast: "Llama a Corea del Sur a nuestro lado"
 call_roc_to_our_side_ast: "Llama a Taiwán a nuestro lado"
 abbott_call_to_arms.1.t: "Australia Calls Us to Arms"
 abbott_call_to_arms.1.d: "De acuerdo con el acuerdo firmado entre nuestras naciones, debido al conflicto actual entre ellas y China, Australia nos ha llamado a honrar el pacto y unirse a la lucha."
 abbott_call_to_arms.1.a: "A la guerra entonces."
 malcolm_abbott_event.4.t: "En la sala de monos"
 malcolm_abbott_event.4.d: "Tony se sentó allí en la sala vacía del Parlamento, con sólo el zumbido de una bombilla moribunda por encima para mantenerlo en compañía. Sus pensamientos se enfurecieron en su tiempo en Uluru, durante su primera larga carrera. Todo el viaje fue agonizante. Tony no estaba en ninguna forma para aceptar el desafío, y casi se rindió más de unas cuantas veces, pero nunca se había sentido más libre que en ese momento. \n\nNo había nada a tu alrededor en el exterior. Sólo el silbido de la Witchiti Bush se balancea en el viento, y el sol que late. Cuando terminó se había convertido en el comienzo de su largo amor por los maratones y eventos «ironman». La naturaleza agotadora de los actos se convirtió en una prueba de carácter, y ahora en el cargo había un nivel similar de agonía, pero el trabajo siempre valió la pena. \n\nEsta vez, sin embargo, ese no sería el caso. El viaje estaba llegando a su fin. Mientras todos los parlamentarios liberales se amontonaban para votar, Tony sería derrotado 44 a 54. Con Malcolm Turnbull tomando las riendas como el nuevo líder. La política fomentaba la deslealtad, pero todavía se sentía como una puñalada en la espalda. Él tomó cierta comodidad en el hecho de que, fiel a su palabra, él se había convertido en un perdedor, no un renuncio."
 malcolm_abbott_event.4.a: "El maratón terminó."
 malcolm_abbott_event.5.t: "Malcolm Turnbull Sworn in as [GetASTLeaderTitle]"
 malcolm_abbott_event.5.d: "En el jardín delantero de la Cámara Parlamentaria, Malcolm Turnbull dio su primera dirección como nuevo líder del Partido Liberal y PM, prometiéndose cambios «extensivos» para producir un «gobierno del siglo XXI». Turnbull anunció una mezcla de recién llegados y veteranos del partido para ayudar a cerrar la transición, incluyendo a Scott Morrison y Christopher Pyne, poniendo atención a la introducción de cinco miembros adicionales del gabinete femenino. \n\n«Debemos ser más competitivos, debemos ser más productivos y -debemos ser más innovadores», dijo el nuevo [GetASTLeaderTitle], imprimiendo al gobierno que abrace una dirección más tecnócrata. \n\nMientras las heridas todavía están frescas a los ojos de los endurecedores conservadores en el partido, la mayoría han apoyado el ascenso de Turnbull, con un impulso temprano para votar por los liberales desde el derrocamiento."
 malcolm_abbott_event.5.a: "Here's to the future."
 aus_war_on_terror_abbott.1.t: "A Pretext for War"
 aus_war_on_terror_abbott.1.d: "Tony limpió el sudor de la frente y miró alrededor de la habitación del personal ocupado de los medios, todo corriendo por ahí para la dirección. Las luces que habían traído eran horriblemente calientes, y Tony esperaba que todo el asunto fuera más rápido. En el último mes había habido demasiadas reuniones de prensa e inteligencia para su comodidad, y ahora era su trabajo vender la nación en ella. \n\nEl teleprompt fue lanzado hacia adelante y mientras todo el mundo se callaba. Tony le quitó la garganta. Al dar la dirección a la nación él mencionaría un nombre con el que los medios de comunicación habían estado bombardeando al público durante meses. Ese nombre era Jemaash Islamiyah. \n\nJemaash Islamiyah era una red terrorista vinculada al Al-Queda ASIS estaba confiadamente buscando los Bombings de Bali y el ataque de la Embajada. Nos habían golpeado una y otra vez, y cuando finalmente encontramos su escondite agujero, los indonesios rechazaron nuestra entrada de tropas. En esencia, convertirse en 'arboradores de terroristas' como Tony reclamaría. \n\nSi el público creía plenamente o no era en gran medida irrelevante. La decisión se adoptó antes de la dirección. Esto simplemente estaba poniendo trabajo de pista."
 aus_war_on_terror_abbott.1.a: "\"It's time we fought back.\""
 the_canberra_treaty_abbott.1.t: "El Tratado de Canberra"
 the_canberra_treaty_abbott.1.d: "Después de llegar a Canberra, los términos del tratado han aclarado la desmilitarización de las Islas Spratly, una limitación para nuestra producción de flotas y un acuerdo de no confrontación entre nosotros mismos, Australia y Filipinas. Esto suavizaría el desastroso resultado del encuentro de la flota, sin embargo, equivale a una humillación que limita el movimiento en nuestro propio territorio. \n\nSi bien el tratado es sólo temporal, cuenta con el respaldo de algunos de nuestros principales asociados comerciales. El golpe de la espalda sería sizable."
 the_canberra_treaty_abbott.1.a: "Para preservar la paz."
 the_canberra_treaty_abbott.1.b: "Están soñando si creen que estamos firmando."
 the_canberra_treaty_abbott.2.t: "Firma del Tratado"
 the_canberra_treaty_abbott.2.d: "Los delegados chinos y filipinos llegaron a Canberra a las primeras horas de la mañana para preparar la reunión. Cuando comenzó sólo un vestuario silencioso podía ser oído entre ellos. El hecho de que los representantes chinos no salieran a primera vista del tratado era una buena señal. Este fue un ritual de humillación para ellos, pero uno con repercusiones demasiado altas para evitar. \n\nEl resultado final fue una desmilitarización acordada de las aguas alrededor del Shoal Scarborough, y las Islas Spratly. China también se comprometió a limitar sus operaciones de producción y patrullaje de flotas, junto con un acuerdo de no confrontación. \n\nNo fue el golpe de nocaut que podríamos haber deseado, pero hoy logramos romper la ilusión de la supremacía china. Su armadura de porcelana ha sido cortada, y la esfera china ha sido contenida. Al menos por el momento."
 the_canberra_treaty_abbott.2.a: "Peace in our time!"
 the_canberra_treaty_abbott.3.t: "Los chinos caminan"
 the_canberra_treaty_abbott.3.d: "En un resultado menos sorprendente, durante la conclusión de los términos del tratado, los delegados chinos simplemente se levantaron y salieron de la sala de conferencias. Como sabemos, ya han llegado a los aeropuertos para ir a casa. Es descarada, pero sabíamos que los términos del tratado eran arriesgados. \n\nNo fue el nocaut que podríamos haber deseado, y la salida fue bastante el fracaso diplomático, pero hoy logramos romper la ilusión de la supremacía china. Su armadura porcelana ha sido cortada, y la esfera china ha mostrado su vulnerabilidad. \n\nPor ahora, los EE.UU., junto con una multitud de otras naciones se han unido a nosotros para sancionar a China como respuesta."
 the_canberra_treaty_abbott.3.a: "We did our best."
 starbucks_event_ast.1.t: "Difficulty Brewing"
 starbucks_event_ast.1.d: "Las sábanas opacas fueron levantadas de las mesas nuevas y brillantes, y los asientos estaban desempaquetados y montados. La sirena verde había llegado a las calles de Sydney, con 87 tiendas de hecho saliendo por toda la nación, y para las 5am ya había una línea alrededor de la manzana. Starbucks formaba parte de la reciente ola de cadenas estadounidenses de comida rápida que aterrizaban en el país, y los gerentes, que también habían venido de Estados Unidos, estaban ansiosos por ser parte del lanzamiento. \n\nCuando las puertas abrieron una corriente de clientes inundados, junto con reporteros para documentar el evento. La tienda estaba llena de clientes, y luego, después de unas horas, no lo fue. Cuando la fiesta de apertura se fue, la tienda, en comparación con la multitud que estaba afuera, estaba extrañamente vacía. \n\nUn puñado de personas, en su mayoría turistas, venían a menudo, pero por lo general era tranquilo. Esto continuaría durante el resto de la semana, y luego, después de algunos meses de desempeño insuficiente en todo el país, la mayoría de las tiendas cerrarían."
 starbucks_event_ast.1.a: "Sólo el más apropiado sobrevive."
 econ_costello_events.1.t: "La hierba roja y el Limelight"
 econ_costello_events.1.d: "Como Costello estaba allí en el sol de la paliza, con un olor que metió algo terrible en el aire, y una espalda empapada en sudor, él estaba en su elemento. \n\nLa torre gigante detrás de ellos, bombeando fuertemente el aceite, fue el respaldo para su importante trato. La mayoría de las piezas fueron enviadas desde los Estados Unidos y juntas aquí en menos de un mes. Docenas más como si estuvieran alojados en Queensland y SA. Lufkin Industries estaba manejando toda la operación, así que ni un centavo venía del gobierno. Sin embargo estaríamos cosechando las recompensas. \n\nEl polvo estaba empezando a soplar y pegarse a sus trajes, así que Costello y los representantes corporativos allí rápidamente envolvieron la operación de fotos. Una cantidad sorprendente de empresas estaban golpeando en la puerta ahora que el gobierno estaba siendo visto como ostensiblemente pro-oil, y Lufkin era sólo el primero. \n\nEn la mente de Peter el carbón se había convertido en un capullo temporal. Mantuvo las luces encendidas, y mantuvo los hogares calientes, pero no era el combustible que mantenía el resto del mundo ardiendo. La próxima ráfaga minera estaría sobre el petróleo."
 econ_costello_events.1.a: "It's just good business."
 econ_costello_events.2.t: "Exportaciones Boom"
 econ_costello_events.2.d: "A medida que nuestros vínculos con China se han acercado, nuestra economía de exportación ha estado en auge. Los volúmenes comerciales con ellos han aumentado significativamente en un período relativamente corto de tiempo, con carbón y minerales críticos que fluyen entre nosotros a tasas históricas. Gusto en continuar por unos meses."
 econ_costello_events.2.a: "To us go the spoils."
 econ_costello_events.3.t: "One Night in Beijing"
 econ_costello_events.3.d: "Cuando Pedro y el resto del gabinete extranjero llegaron a Beijing, había sido la primera vez que vio la ciudad desde el G20, y en esos pocos años el paisaje urbano ya era muy diferente. La determinación de China de salvar la brecha económicamente la había visto prácticamente soar por encima de sus vecinos, y sus ciudades se habían convertido en estribos de imponentes monolitos de vidrio. Cualquier parte de ese crecimiento que Australia podría conseguir era un bono. \n\nUn coche corto los entregó desde el aeropuerto hasta el 'Gran Salón del Pueblo.' Un edificio brutalista, casi soviético-esque en los ojos de Pedro. Admite que la smog de la ciudad era menos evidente de lo que esperaban, y había curioso muy pocos coches fuera. \n\nLlegaron a la sala donde se suponía que el ministro de Relaciones Exteriores y los delegados chinos debían reunirse con ellos, pero habían pasado casi dos horas y nadie vino. Finalmente un desconocido Alexander Downer llegó tropezando. Soplando y enderezando su corbata, se disculpó por el retraso y la reunión finalmente se despidió. \n\nSería la mayor inversión única en la historia de la nación, y un paraíso para nuestras exportaciones agrícolas. Una docena de empresas estarían creando tiendas en nuestras ciudades y suburbios, y los empleos bajarían a los trabajadores, orquestados para apuntar las áreas más necesitadas. Mientras sacudían las manos y se fueron, el viaje ciertamente había sido el más extraño en la memoria de Pedro."
 econ_costello_events.3.a: "Pero sigue siendo el más fecundo."
 econ_costello_events.4.t: "Mercado de la Vivienda inundado con dinero sucio"
 econ_costello_events.4.d: "Los intentos del gobierno de batir las ventas en el mercado de la vivienda apelando a los inversores chinos parecen haber atrapado más que una oferta de compradores entusiastas. El busto de ayer de un altibajo vendido recientemente en Perth ha revelado una red de blanqueo de dinero y financiación ilícita que fluye hasta la recaudación de fondos del Partido Liberal, ya que uno de los inversores arrestados fue revelado como un donante importante del partido. \n\nLos grupos que monitoreaban la red hasta el punto señalaron que podría haber docenas de compradores extranjeros procedentes de China utilizando el mercado de viviendas para eludir las restricciones de vuelo de Beijing. La respuesta de China ha sido una solicitud inmediata de extradición para los involucrados. Una respuesta que puede indicar que el impulso cálido de las relaciones puede llegar a un final repentino."
 econ_costello_events.4.a: "Ninguna buena inversión va impune..."
 costello_in_the_mines.1.t: "Las corporaciones mineras retroceden"
 costello_in_the_mines.1.d: "Antes de que la investigación pudiera ser anunciada, se ha filtrado palabra al gran cuerpo minero que ahora está lanzando todo lo que pueden a nosotros para frenar la comisión. Ya nos han acortado una docena de desafíos legales, y algunas minas ya han cerrado en protesta. Peor es que los medios de comunicación parecen unirse con ellos. \n\nSin incluso una convicción formal, cualquier buena voluntad que teníamos con las minas se ha evaporado prácticamente, y algunos magnates se han movido a financiar la oposición y más partidos nacionalistas como Una Nación, dejando al partido en un punto incómodo para la financiación futura. Hemos pateado bien y realmente el nido de los cuernos."
 costello_in_the_mines.1.a: "La podredumbre debe ser arrancada a cualquier costo."
 costello_in_the_mines.2.t: "Results of the Investigation"
 costello_in_the_mines.2.d: "La comisión finalmente nos ha presentado sus conclusiones y el resultado es sorprendente. A través de docenas de minas, en particular en los sectores del transporte, se ha encontrado que cientos de trabajadores han sido contratados ilegalmente. Algunos incluso han trabajado para las empresas durante años. La reacción de las corporaciones mineras se ha mantenido en silencio, y mientras el proceso legal está en marcha nos quedamos con la difícil decisión de manejar repentinamente a cientos de nuevos migrantes en el país."
 costello_in_the_mines.2.a: "Una industria malhumorada."
 costello_in_the_mines.3.t: "Manejo de los trabajadores"
 costello_in_the_mines.3.d: "Más de trescientos migrantes han sido encontrados viviendo en el país como resultado de la investigación. Casi la mitad de ese número ha estado trabajando en el sector minero durante más de dos años. Los medios de comunicación, y algunos en nuestro gabinete, son firmes que utilizamos nuestras capacidades actuales para deportarlos inmediatamente. Sin embargo, teniendo en cuenta el nivel de capacitación de los migrantes, podríamos conceder visados temporales para permitir un trabajo continuo. Eso evitaría una pérdida repentina de ingresos para las minas, pero no sería un movimiento popular."
 costello_in_the_mines.3.a: "Deportarlos."
 costello_in_the_mines.3.b: "Que se queden."
 costello_in_the_mines.4.t: "Ofertas de Arabia"
 costello_in_the_mines.4.d: "El Príncipe Heredero y Primer Ministro [SAU.GetLeader] nos ha abordado directamente sobre la solicitud. Están ofreciendo una fuerte inversión en nuestra actual minería mineral crítica, a cambio de levantar algunas de las restricciones contra la inversión de su nación en Australia. Han mostrado especial interés en nuestros deportes, y permitirles invertir podría aumentar enormemente el alcance de nuestra industria del entretenimiento, aunque estaríamos abriendo la puerta a un país menos escrutable."
 costello_in_the_mines.4.a: "Una oferta justa."
 costello_in_the_mines.4.b: "No nos acerquemos demasiado."
 costello_republic_events.1.t: "Escalando las Murallas del Senado"
 costello_republic_events.1.d: "A diferencia de nuestro último intento de empujar la materia republicana a través del Parlamento, los votos simplemente no están a nuestro favor hasta ahora. Hardliner Tony Abbott se ha unido una vez más a la multitud anti-republicana como lo hizo en 1999, actuando como portavoz durante el Tiempo de Pregunta y dividiendo efectivamente al partido. Su aptitud para causar problemas en los medios de comunicación también ha llegado a la plena exhibición, aprovechando cualquier oportunidad para hacer campaña contra nosotros como sea posible. \n\nSi no podemos conseguirlo a través del senado antes incluso de someterlo a un referéndum, nuestras posibilidades están muertas en el agua, y nuestro limitado apoyo que queda dentro del partido está empezando a desmoronarse. Es posible que debamos empezar a buscar otras formas de husmear los votos."
 costello_republic_events.1.a: "Un camino difícil está por delante."
 costello_republic_events_abbott_tt: "§YLa oposición trabajará contra nosotros yendo hacia adelante§!."
 costello_republic_events.2.t: "Conseguir los votos"
 costello_republic_events.2.d: "Kevin Rudd fue fácilmente el político más inteligente en el parlamento. Howard lo odiaba, su propia fiesta ni siquiera parecía gustarle. De alguna manera se había metido hasta la cima del Partido Laborista, y ahora era nuestro mayor obstáculo para conseguir los votos. \n\nRudd había solicitado que se reunieran en uno de los cafés justo fuera de la Cámara Parlamentaria, probablemente con el propósito expreso de dar a cualquier paparazzi cerca la oportunidad de capturar una foto de él y el [GetASTLeaderTitle] juntos. Cualquier cosa que lo levante y nos arroje barro. \n\nLlegó tarde, según siempre, e insistió en quedarse para la comida. Panqueques de pato y bistec, lo que sea que sea, fue ordenado, y luego Rudd finalmente se metió en él. El trabajo estaba tratando de pasar su nueva expansión a Medicare, que sin duda iba a ser aplastado por nuestra fiesta. Era una teta para tat en términos más simples, y con un batido nos daba los votos para conseguirlo a través del senado y lanzar algo de apoyo a nuestro camino. \n\nAunque el costo era un poco difícil de tragar."
 costello_republic_events.2.a: "Do we have a choice?"
 costello_republic_events.3.t: "Unconventional Assent"
 costello_republic_events.3.d: "Al entregar la legislación al Gobernador General, sorprendentemente, lo han firmado sin un pinchazo. Incluso parecen ansiosos de ayudarnos, yendo hasta el punto de apoyar la noción de una república en los medios. Ahora que tenemos su aprobación podemos considerar agregar otras adiciones a la nueva constitución. El trabajo no ha terminado, por supuesto. Aún necesitaremos el apoyo del público antes de que podamos enviarlo a través del Senado otra vez. A diferencia de 1999, esta vez debemos seguir movilizando al público y no dejar que el impulso muera."
 costello_republic_events.3.a: "Lets get to it then."
 costello_republic_events.4.t: "Los australianos aborrecen la monarquía"
 costello_republic_events.4.d: "Las pancartas verdes, amarillas y azules han manchado a Sydney y otras ciudades importantes hoy. Un esfuerzo del Movimiento de la República de Australia en previsión de los resultados del referéndum. A medida que llegaron hoy, el voto midió el 63% a favor de una república, con cuatro de los cinco estados necesitaban apoyarlo. Aunque la legislación todavía tendrá que ser empujada por el Parlamento antes de que pueda ser reconocida como ley, el resultado ha abolido efectivamente el monarquismo australiano. \n\nEl papel del gobernador general será revocado, habrá que instituir una nueva bandera y el título del Primer Ministro cambiará pronto para reflejar el nuevo modelo de gobierno. Los republicanos han pasado las horas restantes del día celebrando en las calles, y aunque el movimiento de la oposición no tuvo éxito al mantener el status quo, su líder, político liberal Tony Abbott, admitió que el cambio ha puesto a Australia en camino para un «funzamiento futuro»."
 costello_republic_events.4.a: "Por fin."
 costello_republic_events.4.b: "Un cambio sorprendente."
 costello_in_the_mines.5.t: "A Reunión con el Mogul"
 costello_in_the_mines.5.d: "Conseguir una reunión con Rupert Murdoch no fue difícil. Sucedió que el CEO de Newscorp había estado contactando regularmente con la oficina de Peter, y estaba ansioso por reunirse y discutir política. De alguna manera había pasado media década desde que hablaron por última vez, pero cuando se encontraron de nuevo Rupert parecía que no había envejecido un día. \n\nLa mayoría sabía que era el jefe de Newscorp, y la mitad de los periódicos con eso, pero pocos sabían cuántos proyectos mineros estaba atado. Cuando Peter trató de burlar la idea de una reforma tributaria minera Rupert lo cambiaría cada vez. Conseguir la aprobación del mogul se suponía que debía arrancar las cosas, pero la oportunidad se estaba hundiendo rápidamente. \n\nCuando finalmente llegaron a las minas Rupert continuaría y seguiría con los votantes de Geelong y Blue Collar. El electorado de Peter era Geelong, así que el punto no se perdió en él, pero si iba a salvar un punto que necesitaba para hacerlo ahora. \n\n«Seguro que después de cinco años de crecimiento una reforma tributaria no está tan lejos. Debe haber algún tipo de recompensa para el resto de nosotros... \n\n»¿Reward?« Rupert colgó la palabra como si fuera un bazo en la boca del viejo. »Recuerdo cuando el partido se oponía al gran gobierno.« Estoy seguro de que ya sabes lo que necesita el partido». \n\nCon ese fin Rupert le dio las gracias por su tiempo y se despidieron. No era la piedra pisada que esperaba que fuera, de hecho Costello no estaba muy seguro qué hacer de la reunión en absoluto. Sólo podía esperar que no estuviera haciendo nada peor que Howard."
 costello_in_the_mines.5.a: "Un sentimiento incómodo."
 costello_republic_events.5.t: "Alba en el Parlamento"
 costello_republic_events.5.d: "Con una energía que Costello sólo podía imaginar fue la última sensación durante la federación, todo el Parlamento estaba en un estado de jubileo. Streamers y banners estaban colgando de casi todos los lugares de trabajo. La mitad del edificio había sido abandonada ya que los políticos estaban en los pubs locales o celebraban en las zonas de comedor. \n\nMientras tenía que empujar a través de una multitud agrupada alrededor de un televisor portátil, él vislumbraba lo que estaban viendo. Un espectáculo de luces alrededor del Puente Portuario, con una ardiente entrega de la nueva bandera estaba colgando de ella mientras los fuegos artificiales disparaban sobre la cabeza. Era evidente que incluso la oposición estaba celebrando de alguna manera u otra. Nuestro país finalmente había dado su próximo gran salto. Nos habíamos arrastrado de nuestra adolescencia. \n\nLa sala de baile era convenientemente extravagante para la ocasión, y cuando Costello llegó y comenzó a ordenar sus cartas para el discurso, se dio cuenta de una cara familiar en la multitud. John Howard se había presentado para la fiesta. Costello no pudo evitar dar un paso fuera del podio y caminar para conocer al ex Primer Ministro, su antiguo compañero. \n\nSus manos se apretaron en un batido y Howard, con una mirada templada pero orgullosa en su cara, sonrió."
 costello_republic_events.5.a: "«Bien hecho, amigo. Bien hecho.»"
 commonwealth_games_ast.1.t: "Los Juegos de Commonwealth [GetYear]"
 commonwealth_games_ast.1.d: "Más de 5.000 atletas de 71 países, territorios y cuerpos se han reunido en Melbourne, Australia para competir en los Juegos del Commonwealth este año. Inauguración en el mismo lugar que los Juegos Olímpicos de Verano de 1956, y con una serie de espectáculos incluyendo un tranvía volador y la pantalla central de fuegos artificiales, se espera que 17 deportes estén en escaparate. \n\nPor primera vez en la historia de los Juegos, el Baton de la Reina visitó cada nación y territorio del Commonwealth participando en los Juegos, un viaje de 180.000 KM (112.500 millas). Demostrando el compromiso a largo plazo y las profundas conexiones entre las Naciones del Commonwealth."
 commonwealth_games_ast.1.a: "Nuestros valores compartidos viven en deportes competitivos."
 commonwealth_games_ast.1.b: "Bastante el espectáculo."
 costello_republic_events.6.t: "Shoulders to the Wheel"
 costello_republic_events.6.d: "Alexander Downer, diputado del Primer Ministro, reclinado en su silla como Costello plantó sus planes. Downer tenía una mochila para caras de póquer. Nunca supiste lo que estaba pensando hasta que abrió la boca, y Costello lo había elegido porque lo hizo tan raramente, pero esta vez pudo ver la sorpresa en su cara. Después del lanzamiento Downer se inclinó hacia adelante y entregó la línea que el PM esperaba. «¿Cómo sabes que esto no será una repetición de 99?» \n\nLa pregunta había colgado la cabeza de Costello durante todo el proceso. No podía estar seguro de que pudieran evitar otro fracaso como el referéndum de 1999, o que podrían volver a pasarlo por las cámaras. Nada de eso estaba garantizado, pero tenía que intentarlo. \n\nDespués de un corto combate de discusión, Downer arrancó y acordó ayudar. Estaban tropezando en territorio no cargado, o un quagmire familiar. Al menos bajaban juntos en esta nave. Sin embargo, había una cosa que Downer no podía imaginar. \n\n«¿Tendría que llamarle Primer Ministro, o Señor Presidente?»"
 costello_republic_events.6.a: "Y luego la discusión continuó."
 labor_factionalism.1.t: "Faccionalismo Laboral"
 labor_factionalism.1.d: "El Partido Laborista puede no ser una coalición, pero sí tiene sus propias facciones. Dos tienen más que decir. A la izquierda están los socialistas democráticos, abogando por políticas socialmente progresistas como el aumento del bienestar, fortaleciendo la medicare e intervención económica. Kevin Rudd más o menos representa este lado. En el otro lado está la variedad más centrista. Muchos de ellos siguen los principios económicos del «Tercer Camino»; programas fiscalmente conservadores que tienen como objetivo dar a la gente una 'mano' no un 'salir', y más propenso a los intereses empresariales. \n\nRepresentar a la derecha del trabajo es Julia Gillard, actualmente sirviendo como diputado [GetASTLeaderTitle]. Mientras que en interés de la nación, Rudd y Gillard trabajan constantemente juntos en la formulación de políticas, existe un acuerdo silencioso entre ellos para no pisar los dedos de cada uno. Anhelar demasiado de una manera u otra podría ceder la alianza, o incluso romper el partido por completo. \n\nDurante nuestra campaña también hicimos promesas de promulgar el esquema §YEmissions Trading Scheme§!, en consonancia con nuestra dirección política climática. Debemos asegurarnos de que pasemos el plan durante nuestro primer mandato, para que el partido no comience a cuestionar nuestra dirección."
 labor_factionalism.1.a: "Una tarea tenue."
 rudd_apology.1.t: "Una disculpa nacional"
 rudd_apology.1.d: "Sólo unos meses en la nueva tenencia de Kevin Rudd, y el [GetASTLeaderTitle] ha hecho un discurso a la nación con una «apologación» oficial por los errores históricos contra los Primeros Pueblos de Australia: los aborígenes e isleños del Estrecho de Torres. \n\nEl gesto histórico, basado en el informe Bringing Them Home de 1997, fue presentado en la Cámara Parlamentaria por el [GetASTLeaderTitle], y desde entonces ha enviado una onda de choque emocional a través de Australia. Crowds in the Great Hall and on the lawns outside Parliament animado and clapped. Varios miles de personas se reunieron en la lluvia para ver el discurso trascendental en las calles de Sydney. \nLa comunidad ha sentido una profunda sensación de alivio y curación, y muchos en ella están aclamando los esfuerzos de Rudd para enmendar la inacción por parte de las administraciones anteriores."
 rudd_apology.1.a: "Ya era hora."
 tackle_mining_oligarchy_ast.1.t: "Chatear sobre impuestos"
 tackle_mining_oligarchy_ast.1.d: "Rudd odiaba el paseo desde su escritorio a la oficina de Ken. Los pasillos de la Cámara Parlamentaria eran un blanco plano como un pabellón hospitalario, y conjuró una serie de malos recuerdos dentro y fuera del lugar. Apareció en la puerta justo debajo de la placa de nombre recién instalada, 'Ken Henry.' \n\nCuando entró en Ken todavía estaba ocupado trabajando lejos en la revisión de impuestos que el resto del comité estaba amablemente llamando a la «Revisión Henry». Ken era sólo unos años más viejo que Rudd, pero él tenía una vieja guardia mirar hacia él. No ayudó que tendiera a hacer punteros hacia el nuevo [GetASTLeaderTitle] con frecuencia. \n\nSe esperaba que la revisión tocara las ganancias mineras, y Rudd quería saber todo sobre los detalles. Los dos lo despidieron durante unas pocas horas sobre la idea de impuestos super e implementación justa antes de que Ken finalmente lanzara el sombrero y se fuera a casa. Pero no Rudd. Su noche acababa de empezar, pero necesitaría ayuda para hacer rodar la pelota."
 tackle_mining_oligarchy_ast.1.a: "Alguien que conoce el juego."
 tackle_mining_oligarchy_ast.2.t: "No hay marcha atrás"
 tackle_mining_oligarchy_ast.2.d: "Otra noche del Parlamento para Rudd estaba siendo gastado con Wayne Swan. Swan era uno de los «gang of four», que los medios llamaban el círculo interior de Rudd. Los otros dos eran Julia Gillard y Lindsey Tanner. \n\nKevin había pasado un buen tiempo revisando el plan de leyes, y él ya había montado un equipo de ayudas que estaban trabajando en él en su oficina, pero Swan era crucial para el éxito del plan. No sólo desde que tuvo la experiencia como tesorero para ver cualquier cosa que el resto de ellos podrían perder, pero agregó validez a todo. Rudd todavía parecía un poco extraño político. Nadie cuestionaba las credenciales de Swan. \n\n«Realmente vas tras la columna vertebral de nuestra política aquí. Muchos de nuestros chicos están respaldados por las minas. Hacemos esto y no van a ser felices. Vendrán tras nosotros con todo lo que tengan. Se va a poner feo». \n\n«Creo que hemos pasado por peor, ¿verdad?» Kevin se rascó nerviosamente la nariz y sonrió, pero Wayne no flinchó. Él sólo miró a Kevin con esta mirada preocupada, pero sin embargo aceptó ayudar. \n\nEn cierto momento estaban todos juntos en esto, y Kevin creyó que Wayne no querría ver su administración caer. Estarían navegando juntos en la tormenta."
 tackle_mining_oligarchy_ast.2.a: "Nunca se suponía que fuera fácil."
 pink_batts_ast.1.t: "El Debacle de los Batts Rosa"
 pink_batts_ast.1.d: "Parece que el peor escenario ha ocurrido con respecto a nuestro Programa de Aislamiento en el Hogar. Más de unas pocas de las instalaciones han fallado a largo plazo, y peor aún, cuatro trabajadores han muerto durante la instalación. Tres de electrocución y uno de hipertermia. Ya se ha solicitado una comisión real, y ha llegado a nuestro camino un importante juicio de acción de clase de los proveedores e instaladores que parecen haber sufrido daños financieros. \n\nDecir que esto es un desastre podría ser una subestimación. La caída política por sí sola tiene el potencial de enviarnos abajo. Tendremos que cesar inmediatamente el plan y seguir con un programa de retiro."
 pink_batts_ast.1.a: "¿Cómo pudo pasar esto?"
 bob_brown_event.1.t: "El ecléctico Bob Brown"
 bob_brown_event.1.d: "Bob Brown era un hombre curioso. Su activismo y obsesión con el medio ambiente hicieron que Rudd se viera como un industrialista en comparación, y los eco-cabezas lo amaban por ello. No fue sorprendente que fuera el fundador de facto del Partido Greens. Más de una década más tarde y todavía estaba completamente indiscutido en el Partido. En vez de eso lo sostuvieron como su líder del cartel, que en sí mismo vertió sobre un culto a la personalidad en los ojos de Rudd. \n\nBrown había acordado venir a la capital para reunirse con Rudd para almorzar y discutir la cooperación, que hasta ahora había sido ligeramente antagónica. Cuando llegó Brown eran todas sonrisas, y rápidamente se mudó para un apretón de manos. Almorzaban en uno de los cafés cercanos, por desgracia poniéndolos fuera y a merced del tiempo Canberra, que era casi siempre terrible. Quizás fue por eso que todos los políticos estaban molestos. \n\nParecía por teléfono que el apoyo de los Verdes ya estaba en la bolsa, pero mientras Rudd lo repasó otra vez, Brown simplemente agitó su cabeza. A pesar de lo grande que ya era, él quería que fueran más allá, y cada vez que trató de llevar al líder a la realidad de lo que razonablemente podría pasar por el senado, Brown no brotaba. \n\nSea cual sea el microcosmos de apalancamiento que tenían los Verdes, lo estaba usando ahora, y empezó a renunciar a la paciencia de Rudd. Cuando finalmente agitaron las manos Rudd se dio cuenta de que el trabajo iba bien o iban a casa con las manos vacías."
 bob_brown_event.1.a: "Y no había entre sí."
 school_visit_rudd.1.t: "A Walk Through Coorparoo"
 school_visit_rudd.1.d: "Kevin y su séquito habían llegado a la escuela al mediodía para conocer al director, y hacer un recorrido por el lugar. Alguien evidentemente había avisado de la prensa, porque justo cuando entraron en una multitud de periodistas también se derramaron, y pronto estaban completamente rodeados. \n\nLas preguntas usuales salieron de la boca del periodista: «¿Está el gobierno respaldando la reforma? ¿Acaso el Trabajo no cumplió su promesa de ser fiscalmente conservador?» \n\nRudd intentó su mejor esfuerzo para ignorarlos, y para obtener al menos una palabra con el principio sobre las renovaciones. Consiguieron arrancar una de las puertas y entrar en el patio donde se había construido la nueva cancha de baloncesto, y estaba duplicando como la sala de montaje. La nueva estructura era agradable y todo, pero un poco dolorido a los ojos cuando se contrasta con los edificios mucho más antiguos a su lado. \n\nLa plaga del diseño moderno había encontrado finalmente la Escuela Estatal de Coorparoo. Sin embargo, las nuevas mejoras serían un boon para escuelas como este, más por lo que las escuelas empeoran. Mientras entraban, un cordón de niños seguía y pasaba por encima de los reporteros para interrogarlos. El [GetASTLeaderTitle] lo empezó. \n\n«Bueno, esto es genial estar aquí. Pon las manos arriba, ¿qué te gusta más sobre este nuevo pasillo?» \n\n«Podemos sentarnos en asientos», respondió un estudiante.« \n\n »Puedes sentarte en asientos - ¡eso es una gran diferencia!«"
 school_visit_rudd.1.a: "De hecho fue..."
 gayvote_rudd.1.t: "Australia Vota SÍ a la Igualdad de Matrimonio"
 gayvote_rudd.1.d: "Después de la legalización del matrimonio entre personas del mismo sexo se sometió a un referéndum voluntario, el 61,6% de los australianos han dicho que sí, dando la luz verde para que el acto pasara por la Cámara y el Senado. Con una participación del 79,5%, millones han dado su voto para decidir el cambio, y se espera que la aprobación resultante de la ley sea ratificada en los próximos meses, mucho a la elación de parejas del mismo sexo en el país que buscan matrimonio.\n\nEl ministro de Trabajo Bill Shorten estaba con la multitud en Sydney celebrando el cambio, y animó los esfuerzos del [GetASTLeaderTitle], y miembro de la oposición, Malcolm Turnbull, por defender la legislación. \n\n«Qué día tan fabuloso para ser australiano - que ambos lados del pasillo están listos para el cambio, y apoyar la voz del público.»"
 gayvote_rudd.1.a: "Love Wins!"
 unite_the_nation_speech_ast.1.t: "Kevin Rudd habla de la nación"
 unite_the_nation_speech_ast.1.d: "El nuevo [GetASTLeaderTitle] ha esbozado un compromiso de escribir una «nueva página» en la historia de Australia, y que tiene como objetivo cerrar la brecha de desigualdad que existe actualmente en toda la nación. Se esbozaron planes para nuevos programas sociales y económicos, como Rudd anunció que tenían por objeto superar los logros de la generación anterior, después de lo cual se leyeron historias personales de los Primeros Pueblos australianos. \n\nEl [GetASTLeaderTitle] terminó el discurso haciendo hincapié en una asociación más estrecha con los pueblos aborígenes e isleños del Estrecho de Torres, para «cerrar la brecha entre promesa y desempeño». \n\nHasta ahora el discurso ha bajado bien, aunque quien puede decir cuánto tiempo durará este bien sin cambios concretos."
 unite_the_nation_speech_ast.1.a: "Me llamo Kevin, soy de Queensland y estoy aquí para ayudar."
 something_to_give_ast.1.t: "Algo que dar"
 something_to_give_ast.1.d: "El chime de Centrelink salió del teléfono mientras pasaba por el pequeño apartamento. Había estado en espera durante casi una hora esperando ser puesta a través de un operador, pero mientras el reloj se acercaba a las 5pm sus esperanzas estaban secando. Acababa de salir de clases para el día, pero si no consiguiera a alguien por teléfono esta vez volvería mañana. Sentía que el ciclo nunca terminaba. \n\nFinalmente el teléfono se rompió y una voz vino a través. No perdió tiempo en descargar su situación sobre el otro orador. Había estado estudiando todo el tiempo y, sin suerte buscando trabajo, sus cuentas se estaban acumulando. Incluso en el bienestar los pagos no eran suficientes para cubrirlo, y el miedo de tener que moverse y salir estaba mirando cada vez más probable. Sólo necesitaba un poco más de tiempo. \n\nLa voz en el otro extremo era simpática, aunque sonaba casi tan cansada como ella, pero parecía que no había nada por lo que calificaba. Se hundió por el mostrador de cocina y en el suelo. No había ninguna salida. La operadora preguntó si podían ponerla en espera, y una vez más estaba sola. Estaba demasiado cansada para llorar, y no cambiaría nada. Así fue como siempre lo fue. \n\nDe repente el operador regresó. Sólo esa semana se ha puesto en marcha un nuevo plan que permite a los beneficiarios solicitar pagos de emergencia. Los reembolsos serían sacados de los siguientes pagos por pieza, y no era mucho, pero cubriría el alquiler, y ella podría seguir estudiando. Las noticias eran abrumadoras. Después de la llamada saltó en emoción, y las lágrimas comenzaron a transmitir sus mejillas."
 something_to_give_ast.1.a: "Un poco de ayuda va lejos."
 bill_of_rights_ast.1.t: "Pasando el Estatuto"
 bill_of_rights_ast.1.d: "Al final ambos lados de la casa y el senado nos estaban peleando con dientes y clavos. Hemos regado las cosas hasta niveles apropiados, pero sigue siendo un comienzo. La «Commonwealth of Australia Human Rights Act», que ofrece ampliaciones a nuestra libertad de expresión leyes, derechos de reunión, juicio justo, igualdad ante la ley, libertad de tortura, continúa la lista. \n\nNo sólo estamos implementando la mayor legislación de derechos civiles en nuestra historia, con amplias protecciones para los pueblos aborígenes e isleños del Estrecho de Torres, sino que es algo que sentará las bases para que todas las generaciones futuras de australianos estén protegidas por la ley. \n\nPor ahora todavía necesitamos ratificar todo y comenzar la implementación en los próximos meses, pero sin duda se siente como un gran paso para la madurez de nuestra nación."
 bill_of_rights_ast.1.a: "A aquellos que disfrutarán de los frutos."
 rudd_nz_deal.1.t: "A Wellington"
 rudd_nz_deal.1.d: "Rudd estaba tomando uno de los vuelos tempranos por la mañana para no perderse la vista de las montañas desde arriba. Si había algo que la tierra de los kiwis estaba golpeando a Australia, era el paisaje. Su ministerio extranjero amaba recordarle que filmaron allí al Señor de los Anillos, y no fue un misterio por qué. El acuerdo comercial Trans-Tasman que él estaba allí para firmar iba a empatar nuestras economías prácticamente juntas, lo que sorprendió a Rudd de que no se había establecido antes \n\nEl Primer Ministro, [NZL.GetLeader], fue lo suficientemente rápido como para ser la primera mano que estremeció bajar del avión, llevando las conversaciones al salón de diplomacia del aeropuerto. Ir juntos sobre él todo en el papeleo se veía bien; eliminar prácticamente todos los aranceles y barreras comerciales sobre bienes y servicios, lo habitual. Ahora fue el momento en que su Primer Ministro estaba esperando. \nSugirieron que el primer acto del acuerdo sea una inversión en los centros industriales de Nueva Zelanda por Australia, y siguieron enumerando los rendimientos durante las próximas décadas. Todo fue un sonido, pero ¿realmente valdría la pena invertir tanto de inmediato?"
 rudd_nz_deal.1.a: "Fine."
 rudd_nz_deal.1.b: "El acuerdo comercial es suficiente por ahora."
 rudd_visit_ast.1.t: "Acercándose a los surcoreanos"
 rudd_visit_ast.1.d: "Después de aterrizar en el país, una de las primeras paradas fue una operación fotográfica en el cementerio conmemorativo de Busan. Rudd tuvo la suerte de no haber luchado en guerras. Ninguno de los ministros australianos que siguen sirviendo está a su alrededor para la guerra coreana, y el jefe entre sus prioridades es evitar otro conflicto de ese tipo. \n\nEl memorial era masivo, y muy poderoso cerca. Todo el cementerio era un jardín, y casi todos los lápidas tenían una flor o cobertura. Las banderas de todo el mundo las acompañaban. Los surcoreanos tenían la amenaza de guerra atormentándose sobre sus cabezas todos los días, por lo que naturalmente mantenían sus aliados muy cerca. \n\nCuando finalmente regresaron a la Asamblea Nacional, el Presidente de Corea del Sur, [KOR.GetLeader], había respondido positivamente a la idea de un sindicato pacífico pero era franca sobre la caverna. Como siempre, las seguridades defensivas de nosotros eran el requisito, y parecían bastante establecidas en piedra. Querían estar seguros de que si Corea del Norte hubiera lanzado un misil, lanzaríamos un misil, y si enviaran una flota, tendríamos el nuestro esperando. La idea ciertamente tenía méritos, ¿pero valía la pena sacudir el status quo?"
 rudd_visit_ast.1.a: "We're in this together."
 rudd_visit_ast.1.b: "No vale la pena el riesgo."
 rudd_visit_ast.1.c: "\"We're already with you.\""
 rudd_visit_ast.2.t: "Volando sobre Osaka"
 rudd_visit_ast.2.d: "El Japón ha adoptado el nuevo orden económico en marcha. Su carrera hacia la cima de las listas del PIB en los años 90 fue muy admirable, pero sus ciudades fueron el verdadero testamento. Volar sobre Osaka parecía mirar hacia abajo a una docena de Times Square. Incluso nuestras ciudades más urbanizadas no llevaban una vela a la suya, que brillaba como una carta de amor de neón al capitalismo. \n\nLlegaron a Tokio y comenzaron las delegaciones. Los japoneses se ocupan de las conversaciones como si la cuestión acabase de plantear, y no se discutió a lo largo de un mes antes. Rudd se preguntaba si estaban estancados, pero eventualmente hicieron una demanda. \n\nCualquier pretexto para una unión económica en el Pacífico tenía que incluir garantías de que China se comprometería a mapear sus territorios en el mar. Su hábito de construir isla y expandir su control naval estaban preocupados por los japoneses, que creían que nosotros trabajando como un interino para ellos podría echar las cosas a buen pie."
 rudd_visit_ast.2.a: "Presentaremos los términos pero nada más."
 rudd_visit_ast.3.t: "La respuesta de Beijing"
 rudd_visit_ast.3.d: "Después de un largo vuelo, Rudd no pudo evitar sentirse ligeramente derrotado. El equipo chino de ministros extranjeros se rió de la sala de conferencias. A pesar de las discusiones que iban bien, Beijing era pesimista sobre el concepto de una unión económica pacífica. Los méritos de la ASEAN sirvieron lo suficientemente bien actualmente, y [CHI.GetLeader] no estaba dispuesto a negociar nada nuevo con los poderes vecinos. \n\nAl no ser una pérdida total, las conversaciones se han convertido en algo al menos. El equipo discutió a largo plazo planeando un acuerdo comercial más abierto entre nuestras naciones, y nos ha ofrecido una nueva. El nuevo acuerdo abarca una amplia gama de importaciones chinas a cambio de comercio prácticamente libre de aranceles sobre nuestras exportaciones de carbón y otros minerales. \n\nUn consuelo agradable para las conversaciones que caen."
 rudd_visit_ast.3.a: "No está mal."
 rudd_visit_ast.4.t: "Plum Blossoms"
 rudd_visit_ast.4.d: "El Ministro de Relaciones Exteriores chino nos ha transmitido que Beijing está abierta a renegociar sus líneas territoriales con Japón. Esto podría ser un comienzo, pero el hecho de que son receptivos a la demanda muestra hasta dónde hemos llegado. Han pedido que participemos en las discusiones como una especie de observador neutral, lo cual sin duda tomará algunos años. \n\nPuede que estemos un tiempo fuera de una verdadera Unión del Pacífico, pero los avances que hemos logrado para obtener la paz en el Pacífico, aunque sea temporal, no pueden subestimarse. Beijing también ha movido para mejorar nuestro acuerdo comercial existente, atar a nuestras naciones aún más de cerca económicamente, junto con promesas de futuras conversaciones de defensa naval."
 rudd_visit_ast.4.a: "Peace In Our Time"
 gillard_talk.1.t: "I Shot the Deputy"
 gillard_talk.1.d: "Por sus reuniones habituales, Julia Gillard estaba informando a Rudd de su lado del gobierno. Desde que fue jurada como Vice [GetASTLeaderTitle], Julia estaba a cargo del «superministerio», el departamento de educación, empleo y relaciones laborales se convirtió en uno. Era mucho para manejar, pero Rudd confiaba en que podía manejarlo. En los 8 años se conocían, ella lo frotó como uno de los políticos más astutos en Canberra, y muy capaz. \n\nJulia había comenzado la sesión informativa llenando a Rudd con las últimas quejas presentadas por los muchos negocios que sentían que estaban recibiendo el corto final del palo por un gobierno muy imparcial sindical. Por supuesto que la mayor parte de ella podría ser ignorada, pero Julia era firme que necesitábamos permanecer en buenos términos con ellos. Cuán lejos fuimos con nuestras políticas sociales importaron poco, siempre y cuando no nos alejamos de nuestra actual postura pro-negocio. \n\nCuando terminó Rudd podía sentir sus ojos perforando en la suya. Incluso cuando hablaban casualmente sentía que lo estaba analizando de alguna manera. Rudd estuvo de acuerdo en examinar la recomendación y se fueron durante el día, aunque se preguntó qué tan grave era."
 gillard_talk.1.a: "Algo que considerar."
 papua_talks_rudd.1.t: "Renovaciones a los centros de detención"
 papua_talks_rudd.1.d: "Australia se ha ofrecido a renovar los centros de detención que construyeron aquí a cambio de menores subsidios extranjeros. De hecho, los centros han comenzado a disminuir ya que estaban casi totalmente vaciados, y los efectos sobre nosotros serán muy pocos. Esto parece estar en un esfuerzo por solucionar sus problemas de inmigración en curso."
 papua_talks_rudd.1.a: "Fine."
 papua_talks_rudd.1.b: "Esta vez no."
 papua_talks_rudd.2.t: "Papua Nueva Guinea está de acuerdo con las reformas"
 papua_talks_rudd.2.d: "A pesar del arrendamiento que se agota, el gobierno de Port Moresby ha acordado permitirnos el acceso a los centros para que las renovaciones puedan comenzar. Esto debería permitirnos reubicar los puentes de cola a Papua Nueva Guinea, y espero disuadir futuros aterrizajes en nuestro suelo."
 papua_talks_rudd.2.a: "Como se esperaba."
 papua_talks_rudd.3.t: "Papúa renueva las conversaciones"
 papua_talks_rudd.3.d: "A pesar del ofrecimiento de indemnización financiera, el Gobierno de Port Moresby ha rechazado toda discusión sobre la renovación de los centros de detención. Parecen estar colgados de la moralidad de todo el asunto. Ahora tendremos que seguir albergando a los solicitantes de asilo aquí."
 papua_talks_rudd.3.a: "An unexpected disappointment"
 address_the_tiger_event_ast.1.t: "Brokering Peace in Bharat"
 address_the_tiger_event_ast.1.d: "Las conversaciones con la India han sido predeterminadas desde el comienzo del mandato de Kevin Rudd, o incluso antes de eso. Nuestros objetivos estratégicos para el Pacífico están bien alineados, y han estado ansiosos de trabajar junto a las ADF para ajustar su ejército. Ahora simplemente tuvimos que introducir la idea de trabajar con China. \n\nEn Nueva Delhi la alfombra roja fue realmente rodada. [RAJ.GetLeader] estaba haciendo un trato más grande de lo que Rudd esperaba, después de todo, la mayoría de sus comunicaciones fueron manejadas por el teléfono en su escritorio. La visita oficial del estado fue simplemente un espectáculo, pero una agradable seguramente. \n\nCuando se reunieron en Hyderabad House para discutir el acuerdo, la asociación militar fue inmediatamente ampliada, y por supuesto estaban de acuerdo. Luego comenzaron las negociaciones reales. Tan pronto como China se mencionó el tono en la sala de conferencias cambió. Habría encontrado una multitud más agradable con la delegación taiwanesa sobre el tema de China que aquí. \n\nRudd intentó su mejor esfuerzo para facilitarlos en él durante las próximas horas, pero lo mejor que pudo conseguir fue una promesa de considerar la unión económica «una vez que los otros países habían acordado trabajar con China», que era básicamente un no. Aunque, oficialmente Rudd diría que los había traído a la mesa."
 address_the_tiger_event_ast.1.a: "Y eso fue suficiente."
 legislation_rudd_blocked.1.t: "Legislación bloqueada en el Senado"
 legislation_rudd_blocked.1.d: "Parece que todo el partido liberal está en contra de nuestro pasaje. Nos están lanzando todo en el libro, e incluso han arreglado una cantidad de independencia a su causa. No seremos capaces de aprobar el proyecto de ley así, y a menos que podamos apuntalar el apoyo que necesitamos durante la remisión, la legislación está muerta en el Senado. \n\nTípicamente tendremos que esperar 3 meses antes de que pueda ser enviado de nuevo. Durante ese tiempo podríamos utilizar nuestro alcance para obtener más votos y obtener una mayoría, tan improbable como parece. Tal vez no podamos acercarnos a los liberales, pero los Verdes podrían ser amables con nuestras reformas si ya no las hemos llevado a bordo, y los miembros independientes podrían ir de cualquier manera."
 legislation_rudd_blocked.1.a: "So much for bipartisanship..."
 legislation_rudd_blocked.2.t: "El segundo voto"
 legislation_rudd_blocked.2.d.a: "A pesar de nuestros esfuerzos, la mayoría liberal sigue siendo fuerte. A pesar de todas sus demoras procesales y demandas de enmienda todavía pudimos llegar a la etapa de votación, durante la cual perdimos 34-42. Parece que todos los independientes se han alineado con los liberales, y los Verdes no fueron lo suficientemente tentados para votar con nosotros. \n\nNo estamos completamente fuera de opciones, sin embargo. Podríamos solicitar una doble disolución, disolver tanto la Cámara de Representantes como el Senado y desencadenar una elección temprana. Es una maniobra muy arriesgada, y hacerlo llevaría la posibilidad de perder asientos si el momento no es bueno. También podría ser la única manera de conseguirnos los asientos que necesitamos para una mayoría. \n\nNo se ha disparado desde 1987, y Gillard nos ha aconsejado fuertemente en contra. Siempre podríamos esperar hasta las próximas elecciones. Aún así, la opción está disponible para nosotros si queremos pasarla antes de entonces."
 legislation_rudd_blocked.2.d.b: "A pesar de nuestros esfuerzos, la mayoría liberal sigue siendo fuerte en el Senado. A pesar de todas sus demoras procesales y demandas de enmienda todavía pudimos llegar a la etapa de votación, durante la cual perdimos estrechamente 37-39, gracias al apoyo de Greens. Parece que todos los independientes se han alineado con los liberales. \n\nNo estamos completamente fuera de opciones, sin embargo. Podríamos solicitar una doble disolución, disolver tanto la Cámara de Representantes como el Senado y desencadenar una elección temprana. Es una maniobra muy arriesgada, y actualmente estamos por unos puntos en comparación con las elecciones anteriores. Entrar en otra elección tan pronto podría perdernos el primer ministerio. También puede ser nuestra única manera de conseguir una mayoría. \n\nNo se ha disparado desde 1987, y Gillard nos ha aconsejado fuertemente en contra de ella, sugiriendo que esperamos hasta nuestro próximo mandato. Aún así, la opción está disponible para nosotros si queremos pasarla ahora mientras tenemos el impulso."
 legislation_rudd_blocked.2.a: "It's time to act."
 legislation_rudd_blocked.2.b: "Es demasiado arriesgado."
 legislation_rudd_blocked.3.t: "La disolución doble"
 legislation_rudd_blocked.3.d: "Ahora que los dominos han caído y la disolución ha sido activada, se programará una elección temprana. Con el primer obstáculo, tenemos que centrarnos en la campaña. Nuestro partido va estable en las encuestas, pero los liberales podrían cambiar al público si los dejamos. En este momento están liderados por Tony Abbott, uno de nuestros críticos más apostólicos. No ha tenido golpes hasta ahora, así que no deberíamos contenernos. \n\nCon 60 días hasta el día de las elecciones, tendremos que mantener al país en control y continuar nuestra campaña si estamos tratando de avanzar."
 legislation_rudd_blocked.3.a: "The pressure is on."
 legislation_rudd_blocked.4.t: "Victoria"
 legislation_rudd_blocked.4.d.a: "Rudd cayó en su silla y dejó salir un suspiro de alivio. La legislación aprobada. Por fin se acabó. El resto del Partido Laborista y los Verdes salieron aplausos. El otro lado del pasillo parecía sentarse allí con los brazos cruzados, pero en la primera fila Rudd vio a Malcolm Turnbull mirando fijamente hacia él, y podía jurar que Malcolm estaba sonriendo. \n\nSentía una palmadita en la espalda, y al girar vio a Gillard sonriendo hacia él. Incluso tenía que admitir que esto era un logro para el partido. La fiesta finalmente estaba haciendo algo realmente grande, y la dentadura que estaban haciendo en la falta de vivienda significaría realmente algo. El trabajo se había convertido finalmente en el partido de la reforma. Puede que no dure, pero hoy ganaron la primera batalla. \n\nSe limpió el sudor de la cabeza y se levantó para aplaudir con la fiesta. Era hora de disfrutarlo mientras duró."
 legislation_rudd_blocked.4.d.b: "Rudd cayó en su silla y dejó salir un suspiro de alivio. La legislación aprobada. Por fin se acabó. El resto del Partido Laborista y los Verdes salieron aplausos. El otro lado del pasillo parecía sentarse allí con los brazos cruzados, pero en la primera fila Rudd vio a Malcolm Turnbull mirando fijamente hacia él, y podía jurar que Malcolm estaba sonriendo. \n\nSentía una palmadita en la espalda, y al girar vio a Gillard sonriendo hacia él. Incluso tenía que admitir que esto era un logro para el partido. Cuántos años las corporaciones mineras han hecho imposible la reforma real, y sin embargo ahora estarían pagando sus cuotas. Sin duda, las campañas de desprestigio continuarían durante algunos meses, pero hoy había ganado la primera batalla. \n\nSe limpió el sudor de la cabeza y se levantó para aplaudir con la fiesta. Era hora de disfrutarlo mientras duró."
 legislation_rudd_blocked.4.d.c: "Rudd cayó en su silla y dejó salir un suspiro de alivio. La legislación aprobada. Por fin se acabó. El resto del Partido Laborista y los Verdes salieron aplausos. El otro lado del pasillo parecía sentarse allí con los brazos cruzados, pero en la primera fila Rudd vio a Malcolm Turnbull mirando fijamente hacia él, y podía jurar que Malcolm estaba sonriendo. \n\nSentía una palmadita en la espalda, y al girar vio a Gillard sonriendo hacia él. Incluso tenía que admitir que esto era un logro para el partido. El trabajo cumplió sus promesas. Australia sería el país para subir al plato cuando ningunos otros lo fueran. Las generaciones futuras estarían aseguradas por nosotros. \n\nSe limpió el sudor de la cabeza y se levantó para aplaudir con la fiesta. Era hora de disfrutarlo mientras duró."
 legislation_rudd_blocked.4.a: "Bien ganado."
 approach_parties_rudd.1.t: "Acercándose a los liberales"
 approach_parties_rudd.1.d: "El Partido Liberal y los Nacionales están comprometidos con una estrategia «no sin excepción» ahora mismo, aparentemente en protesta por nuestra falta de inclusión en la planificación. Si tuvieran su forma, la cuenta sería despojada a nada. Independientemente, no están dispuestos a trabajar en ninguna enmienda ahora."
 approach_parties_rudd.1.a: "No puedes ganar todos."
 approach_parties_rudd.2.t: "Apaciguar a los Verdes"
 approach_parties_rudd.2.d: "El único problema con conseguir a los Verdes a bordo era sus demandas. Para un partido tan pequeño su aptitud para causarnos problemas no podía ser subestimada. Si no negociamos votarían en contra de ella en protesta, e insistieron en que fortalezcamos una ley ya polémica. Usando todo en nuestras mangas para hacer algunos compromisos, han acordado apoyar esencialmente la misma factura, con algunas adiciones menores."
 approach_parties_rudd.2.a: "Esperemos que mantengan su palabra."
 approach_parties_rudd.3.t: "Los forasteros"
 approach_parties_rudd.3.d: "Tanto el senador del Partido Laborista Demócrata como el independiente, Nick Xenophone, eran venta dura en la cuenta. Nick ha sido especialmente crítico con nuestra administración desde el principio, y ambos de su historial electoral han sido principalmente liberales parcializados, pero después de prometer trabajar en futuras enmiendas con ellos han acordado respaldar la ley."
 approach_parties_rudd.3.a: "Excelente."
 mad_katter_ast.1.t: "El Mad Katter"
 mad_katter_ast.1.d: "Bob Katter era el rey de facto del norte de Queensland, habiendo servido durante casi 20 años como su representante. Era un político de marca de fuego por cada significado de la palabra, y en particular de ninguna manera ordinario. No la manera en que se vestía, ni sus opiniones, y especialmente no la forma en que hablaba. Si Katter te atrapaba la oreja estarías en un viaje, sin ninguna manera segura de saber a dónde iría. \n\nHabían comenzado la reunión con la pretensión de colaborar en un nuevo proyecto de ley, pero Katter había ido tangente sobre la difícil situación de los agricultores y la importación de bananos. Con el tiempo se puso muy emotivo, a lo que Rudd tenía que reinar en él. Era claramente muy apasionado por el costo humano de las sequías en curso. \n\nRudd no podía decidir si el hombre era socialista o conservador, o tal vez una extraña mezcla de los dos. De cualquier manera iban a encontrar algo para ayudar a los agricultores."
 mad_katter_ast.1.a: "It's the least we can do."
 whispers_in_the_crowd_ast.1.t: "Whispers in the Crowd"
 whispers_in_the_crowd_ast.1.d: "Para ahora, Kevin Rudd fue utilizado a la naturaleza de la Cámara Parlamentaria. Cómo se decidió el status quo por la tarde, y nada permaneció permanente. Ahora que las cosas estaban en plena oscilación se sentía cómodo con el ritmo que el gobierno estaba haciendo, sin embargo, algo había cambiado entre ahora y cuando él juró adentro, y estaba empezando a ponerse sobre él. \n\nParecía llevarse bien con casi todo el mundo en su gabinete, pero ocasionalmente tenía la sensación de que su buena voluntad se estaba lamentando. Donde antes de que tomaran sus órdenes con pasos, ahora más frecuentemente, lo estaban interrogando. Tenía que explicar su razonamiento cada vez más, y puso en tela de juicio la dirección de su política. \n\n¿Estaba siendo paranoico? Posiblemente. Tal vez todo lo que pasaba era pesar sobre ellos. Además, todavía confiaba en su gabinete para ir de fiesta. \n\nRudd lo arrancó y continuó con su trabajo. Probablemente no fue nada."
 whispers_in_the_crowd_ast.1.a: "¿O era eso?"
 mining_smear_campaign_ast.1.t: "La campaña mediática"
 mining_smear_campaign_ast.1.d: "La campaña de los medios de comunicación está a toda velocidad ahora que el gran cuerpo minero descubrió lo que estamos haciendo. Docenas de anuncios diferentes inundan cada canal y longitud de onda. Banners en carretera. En lugar de pagar sus deudas, están dejando millones para defraudar a nuestro gobierno. No es todo pegajoso, pero cuando lo hace está perjudicando nuestra capacidad de gobernar, y la percepción pública está disminuyendo. \n\nLa coalición ya está saltando en el carro para criticarnos. Si no hacemos algo para mantener una tapa en esto pronto las cosas sólo empeorarán."
 mining_smear_campaign_ast.1.a: "No muy bien."
 corruption_outcome_aus.1.t: "Mano atrapada en el Jar"
 corruption_outcome_aus.1.d: "El resultado de nuestras recientes investigaciones del partido ha dado suficiente munición para que excluya la influencia extranjera en el partido por el bien, o por lo menos por el momento. Sin embargo, un par de hallazgos que no estaban relacionados con los grupos de interés han salido, y está pintando nuestro partido en una mala luz. \n\nNo ha surgido nada que pueda estar atado a nosotros, sin embargo, pero es suficiente perder cierta credibilidad en el ojo del público. Tendremos que mantener nuestras narices limpias adelante, hasta que estemos fuera del foco."
 corruption_outcome_aus.1.a: "Oops!"
 aus_gillard_overthrow.1.t: "A Knock at the Door"
 aus_gillard_overthrow.1.d: "Rudd estaba pasando por el papeleo habitual en su oficina cuando un golpe sonó desde la puerta. Reconoció el patrón, y así llamó a Julia Gillard, quien entró de manera lenta pero deliberada. A diferencia de su rutina habitual, se quedó de pie, y mientras Rudd la miraba, ella dio las noticias. \n\nPara Rudd se sentía como si las paredes de la oficina a su alrededor caían hacia adentro. Mientras continuaba en su mundo estaba colapsando, y todo lo que podía hacer era ver con sorpresa mientras ella entregaba la daga. Gillard iba a desencadenar un desafío de liderazgo. No podía creerlo, su propio compañero que lo derrocaba, y mucho menos a alguien que consideraba un amigo. Lo peor no terminó. Estaba exigiendo su renuncia. \n\nYa había sido derrocado en todos menos escribiendo, pero le estaba ofreciendo la opción de salvar la cara y evitar el proceso en el Parlamento. Mientras ella enumeraba a todos los miembros del gabinete que respaldaban a su Rudd se dio cuenta de cada aliado que tenía que voltear. Estaba solo en la fiesta ahora."
 aus_gillard_overthrow.1.a: "It was all over."
 aus_gillard_overthrow.2.t: "Dawn"
 aus_gillard_overthrow.2.d: "Las cámaras rodearon el podio exterior, esperando el anuncio. Para ahora todos sabían lo que estaba pasando. Cualquier noticia que salió del Parlamento viajó rápido, y fue un golpe de estado en la planificación durante bastante tiempo. A la mañana siguiente ya había terminado, y mientras los reporteros estaban allí esperando el momento, las puertas finalmente se abrieron y el [GetASTLeaderTitle] salió con su familia. \n\n«Fui elegido por el pueblo australiano como [GetASTLeaderTitle] de este país para traer de vuelta una justa marcha para todos los australianos y he dado mi máximo absoluto para hacer eso, le he dado todo lo absoluto. En ese espíritu estoy orgulloso de los logros que hemos logrado para hacer más justo este país». \n\nSus ojos ya estaban empezando a regar. Quizás Rudd era el correcto [GetASTLeaderTitle] en el momento equivocado. Había poco que podía haber hecho para evitar lo que resultaba ser una puerta giratoria de un partido, donde los derrocamientos se estaban convirtiendo en una triste norma. \n\n «Han sido dos años y medio muy ocupados. Hemos lanzado nuestro absoluto todo esto y creo que cuando miramos hacia atrás, estas reformas soportarán en el futuro y harán de Australia, creo, un lugar más justo y mejor de lo que habría sido de otra manera.» \n\nHabía aplausos de ellos antes de que Rudd se despidiera. Sólo podía esperar que tuviera razón, y que su trabajo para cambiar las cosas se pegaría."
 aus_gillard_overthrow.2.a: "Adiós dulce príncipe."
 the_new_look_rudd.1.t: "El nuevo look"
 the_new_look_rudd.1.d: "A medida que el zumbido de la temporada electoral comenzó a arrastrarse hacia su día a día, Rudd encontró que tenía mucho menos tiempo para centrarse en su propia elección. No era improbable que se quedara en el Parlamento, repasando propuestas y lo habitual, sólo para estar fuera del camino de la campaña al día siguiente. \n\nHoy fue una salida de la capital y en su propio electorado de Griffith, Queensland. Mientras el sol apenas estaba fuera él ya estaba repasando notas, y apreciando la tranquilidad antes de que todo el mundo estuviera levantado. Una rareza en los últimos días. Como si en la cola, sin embargo, la calma se rompió, y la puerta de la pantalla de vuelo a la campervan se abrió para revelar un hosting Anthony Albanese. \n\nAnthony era un hombre torpe y portuario, pero no fue hace mucho tiempo que los dos estaban en la garganta del otro para liderar el partido, y Rudd se aseguró de no olvidarlo. Anthony tropezó con un café en la mesa junto a Rudd, quien le dio las gracias con un guiño. \n\n«Queso que estás mirando gruff.» Señaló en la barbilla de Rudd. Rudd lo tocó y se dio cuenta de que no había afeitado en dos o tres días, y su stubble blanco había crecido en una barba. \n\n«Parece que lo soy. ¿Cómo me veo?» \n\n«Quiero decir que no está mal. Podría ser una sorpresa para los votantes.» Anthony dijo con una risa. \n\n«Hmm. Supongo que no quiero estar mirando desdichada.» \n\n«No lo sé. Tal vez les guste»."
 the_new_look_rudd.1.a: "Then I'll keep it."
 the_new_look_rudd.1.b: "Hora de afeitarse."
 rudd_the_next_leader.1.t: "El futuro del partido"
 rudd_the_next_leader.1.d: "Llega un momento en la vida de cualquier líder cuando deben pensar en la próxima generación. Julia Gillard no era tanto una generación más joven en comparación con Rudd, pero podría ser muy bien el futuro de la fiesta. En virtud del acuerdo que hicieron entrar en las elecciones de 2007, Rudd había prometido a Gillard que en algún momento él iba a bajar y dejarla correr tras él. \n\nLa responsabilidad era pesada para Rudd, pero Gillard aún no lo había decepcionado. Era la parte de negocios de la fiesta. Parecía raro que sus preocupaciones por los déficits presupuestarios y el crecimiento económico no se expresaran, y sus planes para una revisión minera nacional habían alcanzado el interés de Rudd. Claramente le importaba lo suficiente. Si fuera adecuada para el trabajo o no, en algún momento Rudd tendría que decidir."
 rudd_the_next_leader.1.a: "Algo que considerar."
 rudd_the_next_leader.1.b: "¡Nunca!"
 rudd_the_next_leader.2.t: "Paso hacia abajo"
 rudd_the_next_leader.2.d: "«Este país, que puede manejar sus diferencias políticas pacíficamente y resolver nuestra política de manera pacífica y civilizada, es por eso que este país es un país tan grande. Que en esta maravillosa tapicería de la Australia moderna, el mosaico de nuestra nación multicultural, que diseña tal unidad fuera de la diversidad, allí se encuentra el gran milagro australiano.» \n\n«El pueblo australiano, creo, merece un nuevo comienzo con nuestro liderazgo. Sé que esto no será una buena noticia para algunos de ustedes, pero mi responsabilidad ha sido mantener al Trabajo como una fuerza de lucha por el futuro, para que podamos unirnos detrás del próximo líder de nuestro partido, Julia.» \n\n«Así que amigos, no escucharán mi voz en los asuntos públicos de la nación por algún tiempo.» \n\n«Me he honrado de servir como tu [GetASTLeaderTitle] y como líder de tu partido, pero llega un momento en que sabes que lo has dado todo, y un tiempo para que el partido renueve aún más su liderazgo para el futuro»."
 rudd_the_next_leader.2.a: "«Para mí, ese tiempo es ahora.»"
 rudd_campaigning_round_two.1.t: "Ronda y ronda del Centro de Convenciones"
 rudd_campaigning_round_two.1.d: "Mientras Rudd caminó por el pasillo de la Conferencia Nacional del Trabajo y la multitud estaba golpeando un campo de fiebre. Incluso el veterano de la fiesta Paul Keating estaba allí para animarlo, dando al evento una sensación de sueño. Fue como si nunca se fuera. Los últimos años simplemente habían sido un mal sueño y ahora había despertado al aplauso de sus colegas. Lo mismo que había aplaudido su caída. \n\nFue extraño lo insensato que era la política. Siempre estabas al borde de un cuchillo con el público, e incluso la gente en tu propia fiesta. Sin embargo, él todavía sacudió sus manos si significaba conseguir su apoyo para las próximas elecciones. Todo estaba demasiado cerca para sentirse cómodo. \n\nNecesitaría sacar un milagro para conseguir otro término, pero estaba lejos, y Rudd le daría todo."
 rudd_campaigning_round_two.1.a: "Volvimos, y estamos aquí para quedarnos."
 gillard_gov_event.1.t: "Una nueva dirección"
 gillard_gov_event.1.d: "En la apretada sala de conferencias Julia Gillard dio su primera charla de prensa como [GetASTLeaderTitle]. Los reporteros y compañeros políticos se habían reunido para escucharla hablar, y esperaban abate por el mandato que estaba a punto de revelar. El peso estaba realmente sobre ella ahora. Meses de trabajo para llegar a esta posición exacta, todas las tarjetas tenían que ser cuidadosamente apiladas y los miembros del gabinete cortejo en dar su apoyo. Todo para llegar aquí. \n\nGillard era ahora una de las mujeres más poderosas del mundo, y sin embargo su posición nunca se sentía más precaria. Cualquier culpa que hiciera sería examinada y muladada durante días por la oposición o los medios de comunicación, o realmente cualquier persona que sintiera que no tenía la fortaleza para asumir la posición de sus compañeros. Cada paso debe hacerse con cuidado. \n\nPasar cualquier política razonable debía ponerse en el backburner hasta que se pudiera llamar la elección, lo cual iba a ser pronto. Hasta entonces tendría que mirar la parte, y esperar que el público creyera que podía hacer el trabajo."
 gillard_gov_event.1.a: "¿Alguna pregunta?"
 papua_residency_ast.1.t: "Oferta del Pacto Económico de Australia"
 papua_residency_ast.1.d: "En un esfuerzo por fortalecer los vínculos económicos regionales, el gobierno australiano ha alcanzado una propuesta de acuerdo comercial «sin aranceles». La propuesta incluye restricciones menores a nuestros bienes y servicios a cambio de derechos minerales exclusivos mutuos. Ambas naciones están de pie para prosperar significativamente por el aumento del flujo de bienes entre nosotros, sin embargo, la elección sigue siendo nuestra."
 papua_residency_ast.1.a: "For them, of course!"
 papua_residency_ast.1.b: "No thanks."
 papua_residency_ast.2.t: "Integración económica de Papua"
 papua_residency_ast.2.d: "Papua Nueva Guinea ha acordado el pacto propuesto para vincular nuestras economías a través del comercio. Se están finalizando las negociaciones, lo que permite el comercio libre de aranceles sobre bienes y servicios de Papua, inversiones simplificadas y derechos prioritarios de recursos en ambas partes. Oceanía es un paso más cerca de convertirse en una unión regional y económica."
 papua_residency_ast.2.a: "Excelente."
 papua_residency_ast.3.t: "Falta de conexión con Papua"
 papua_residency_ast.3.d: "Por desgracia, Papua Nueva Guinea ha rechazado el pacto y prefiere mantener nuestras relaciones comerciales actuales."
 papua_residency_ast.3.a: "Disappointing."
 indo_ast_trade_deal.1.t: "Australia propone el Acuerdo Comercial"
 indo_ast_trade_deal.1.d: "En un esfuerzo por calentar nuestras relaciones frías, Australia ha propuesto un acuerdo de libre comercio con la promesa de cooperación militar en el futuro. En este momento el acuerdo proporcionaría una transición fluida de los bienes y servicios con nosotros, muy probablemente proporcionando un botín económico, pero el acuerdo militar está bastante abierto."
 indo_ast_trade_deal.1.a: "Una propuesta justa."
 indo_ast_trade_deal.1.b: "No thanks."
 indo_ast_trade_deal.2.t: "Buenas noticias de Rudd"
 indo_ast_trade_deal.2.d: "Kevin Rudd ha regresado de Indonesia con resultados favorables. Indonesia reaccionó positivamente a un acuerdo de libre comercio con la condición de que nuestro ADF se comprometa a esfuerzos conjuntos de seguridad. Ya hemos trabajado en los esfuerzos de lucha contra el terrorismo junto con los indonesios, por lo que esto no sería nada nuevo, y la solicitud se ha dejado intencionalmente abierta, permitiéndonos definir los compromisos en el futuro. Por ahora el acuerdo dará un buen impulso al comercio entre nuestras naciones."
 indo_ast_trade_deal.2.a: "Splendid."
 indo_ast_trade_deal.3.t: "Indonesia rechaza la oferta comercial"
 indo_ast_trade_deal.3.d: "El gobierno de Yakarta ha rechazado lamentablemente el pacto, respondiendo fríamente a los esfuerzos de Rudds, y ha preferido mantener nuestras relaciones comerciales actuales."
 indo_ast_trade_deal.3.a: "No es genial, pero tal vez lo esperaba."
 forming_government_gil.1.t: "Escoge tu veneno"
 forming_government_gil.1.d: "Los resultados de las elecciones han dejado muy claro que necesitamos formar un gobierno de coalición si queremos permanecer en el trabajo. Ahora mismo, la oposición se mueve rápidamente para tomar sus propios asientos de la Cámara. La facción izquierda del partido nos ha alentado a buscar un pacto con los Verdes. Hemos trabajado con ellos antes, y parece que están dispuestos, pero algunos de nuestros miembros conservadores son sify en ir tan lejos, y más que probable que los Verdes plantearán algunas demandas propias. \n\nPor otra parte, varios desertores liberales nos han abordado con el apoyo de algunas de nuestras agendas y están dispuestos a unirse a nosotros en una coalición. Con el apoyo ex-Liberal podemos salir como más bipartidista al populus general. Considerando los resultados de las elecciones, aparecer más en el medio podría no ser una mala elección."
 forming_government_gil.1.a: "Go with the Greens"
 forming_government_gil.1.b: "A Liberal-Labor Coalition it is."
 gillard_gov_event.2.t: "Relleno del Gabinete"
 gillard_gov_event.2.d: "El gabinete se inclinaba para ser el grupo competente de los mejores del Trabajo, al menos en los ojos de Julia, y más importante la variedad leal. Wayne Swan, el nuevo diputado [GetASTLeaderTitle], había acordado reunirse con Gillard para discutir la formación del ministerio extranjero. \n\nCuando se reunieron en su oficina, Gillard explicó que estaba mucho más interesada en centrarse en los asuntos internos de la nación y permitir que el ministerio extranjero gestionara su propio acuerdo. Juntos revisaron las opciones y había dos opciones obvias. Stephen Smith fue el primero en ofrecer sus servicios a la nueva [GetASTLeaderTitle], habiendo servido previamente bajo Keating, y había permanecido un leal Laborita desde entonces. Swan estaba seguro de que Smith remolcaría la línea del partido y más o menos nos mantendría en el camino recto. \n\nLas otras opciones eran Bob Carr. Carr había estado fuera del parlamento por algún tiempo trabajando como consultor, y estaba ganando popularidad sobre sus ardientes debates públicos. Su política tendía hacia la variedad más atrevida, y su nominación sin duda dejaría una marca, si ese era el ángulo que Julia estaba buscando. Sin embargo, había tiempo para decidir, y con todo lo que pasaba no había prisa para reanudar las cosas en el extranjero."
 gillard_gov_event.2.a: "Mucho que considerar."
 forced_adoptions_gillard.1.t: "El gobierno de Gillard aborda las adopciones forzadas"
 forced_adoptions_gillard.1.d: "[GetASTLeaderTitle] Julia Gillard entregó esta noche una disculpa nacional por los actos históricos de la política gubernamental, desde 1950 y 1975, que forzó la separación de miles de madres indígenas de sus hijos. \n\n«Reconocemos los profundos efectos de estas políticas y prácticas sobre los padres y reconocemos el daño que causan estas acciones a hermanos, abuelos, socios y miembros de la familia extendidos», dijo Gillard al público lleno de más de 800 personas dentro de la Cámara Parlamentaria, muchas de las cuales estaban en lágrimas. \n\nSe estima que 100.000 a 150.000 mil lactantes fueron removidas forzosamente o coercitivamente de madres, en su mayoría jóvenes solteras."
 forced_adoptions_gillard.1.a: "Nuestros corazones salen a ellos."
 let_debate_decide_gillard.1.t: "Legislación de Matrimonio del mismo sexo lanzada"
 let_debate_decide_gillard.1.d: "En un resultado no tan sorprendente la Cámara de Representantes votó abrumadoramente contra la legislación del mismo sexo, en 98-42 el proyecto fue rechazado. La plataforma de nuestro partido se ha opuesto típicamente al concepto, y la mayoría de las respuestas han sido las defensas habituales de los valores tradicionales y así sucesivamente. Ya hemos sacado muchas críticas de votantes progresistas en línea, y sin duda va a engañar a las próximas elecciones."
 let_debate_decide_gillard.1.a: "Welp."
 let_debate_decide_gillard.2.t: "Flies de la Enmienda Antidiscriminación A través del Senado"
 let_debate_decide_gillard.2.d: "En un acto sorpresa de bipartidismo, nuestra legislación de protecciones del mismo sexo ha disparado a través de la Cámara y el Senado con apoyo abrumador. La enmienda incluía amplias protecciones contra la discriminación por motivos de orientación sexual, junto con programas financiados por el Commonwealth para proteger y apoyar a los vulnerables, y prestar servicios educativos, fortaleciendo el acto ya existente. \n\nSólo las quejas leves provenían de los líderes de la oposición respecto a los nitpicks en las directrices, pero en su mayor parte esto parece una victoria generacional para el partido. El apoyo que ya estamos recibiendo en línea desde el progresivo es abrumador."
 let_debate_decide_gillard.2.a: "¡Otra victoria!"
 opposition_attacks_ast.1.t: "Oposición Firing Off Shots"
 opposition_attacks_ast.1.d: "La retórica habitual de Tony Abbott siempre ha sido parte inflamatoria, parte excesiva, pero recientemente ha tomado los ataques a nuevas alturas. Después de que una multitud de manifestantes aparecieron fuera de la Cámara del Parlamento con algunos signos bastante «obscenos», Abbott aprovechó la oportunidad para salir y mezclarse con ellos, invitando a los periodistas a filmar el asunto. \n\nLo que podría haber sido una reunión de franjas se ha dado suficiente atención que los periódicos están ahora deportivos «DITCH THE WITCH», y algunos incluso incluyendo «BURN THE BITCH.» Es una locura, incluso para Abbott, y ahora los medios de Newscorp está rodando con él."
 opposition_attacks_ast.1.a: "Genial."
 opposition_attacks_ast.2.t: "Abbott lanza el recorrido por medios de comunicación Nuestra gobernanza"
 opposition_attacks_ast.2.d: "Una vez más Tony Abbott ha captado el foco de atención sólo para criticar nuestra política. Recientemente, en el Today Show, Abbott siguió adelante y sobre la infeasibilidad de nuestra planificación presupuestaria, etiquetando como «wasteful», «boneheaded» y los jabs habituales. Esto no habría golpeado tan duro si un Newspoll el día anterior no nos hubiera pintado como el gobierno menos preferido, sentado 5 puntos detrás de Abbott en las encuestas. A medida que nuestro apoyo disminuye, lo que digamos no tiene mucha pierna en la que soportar."
 opposition_attacks_ast.2.a: "Can't we catch a break?"
 ast_fm_rudd_focus.5.t: "Kevin Rudd deja gabinete"
 ast_fm_rudd_focus.5.d: "Durante una conferencia de prensa en Washington, DC, Rudd aparentemente anunció a la muchedumbre allí que estaría formalmente pisando como nuestro ministro de Relaciones Exteriores. Un shock para la multitud allí, y sin duda no es una gran mirada en nuestro gobierno, pero se puso peor cuando Rudd entonces pasó a culparnos por su decisión. Afirmando que no tenía nuestro respaldo. \n\nEs muy probable que la próxima oportunidad que tenga, Rudd intentará un desafío de liderazgo contra nosotros. Ya hay una disserción en la fiesta, así que tendremos que estar listos para cualquier cosa. Por ahora necesitaremos un nuevo ministro de Relaciones Exteriores."
 ast_fm_rudd_focus.5.a: "¿La falta de apoyo? ¡Pero lo elegimos!"
 opposition_attacks_ast.3.t: "Los textos de Peter Slipper"
 opposition_attacks_ast.3.d: "Nuestro actual Presidente de la Cámara, Peter Slipper, ha estado bajo fuego recientemente después de que cientos de textos privados que hizo fueron hechos públicos como parte de procedimientos legales contra él. Peter era anteriormente miembro del Partido Liberal, que saltó el barco para unirse a nosotros como independiente. Los textos son bastante malos, aunque un asunto personal para el orador, pero ahora los liberales nos pintan como sexistas por no dejar a Pedro en el acto. \n\nTony Abbott ha reunido un voto de no confianza contra nosotros a menos que saquemos a Peter Slipper, de lo contrario tenemos una oportunidad en la asamblea para defendernos. Mientras los textos no son grandes, apenas son peores que los comentarios liberales habituales, y no le dolería dar a Abbott un pedazo de nuestra mente."
 opposition_attacks_ast.3.a: "Vayamos a la asamblea."
 opposition_attacks_ast.3.b: "Sack Slipper."
 opposition_attacks_ast.4.t: "El discurso de Gillard Misogyny recibe apoyo Viral"
 opposition_attacks_ast.4.d: "Durante un día vitriolico del debate parlamentario de ayer, el [GetASTLeaderTitle] desató sobre el carácter del líder de la oposición Tony Abbott después de las tensiones sobre los textos de Slipper hechos en un punto de ruptura para su actual feud. Durante la asamblea voto sin confianza, Gillard comenzó a volar Abbott por su propia retórica sexista en los últimos años. \n\n«No voy a ser conferenciado sobre el sexismo y la misoginia por este hombre, no lo haré. Y el Gobierno no será conferenciado sobre el sexismo y la misoginia por este hombre. Ahora no, nunca.» \n\nEl discurso de Gillard fue recibido inmediatamente no sólo por toda la nación, sino también en línea global. Los periódicos del Reino Unido y de Estados Unidos han sido rápidos para entrar en el teatro político, con lo que Gillard «ataque contra el sexismo» es «bríster» pero «brilliante», según el Telegraph."
 opposition_attacks_ast.4.a: "Me alegra que haya pagado."
 rudd_events_gillard.1.t: "Kevin Rudd ofrece servicios"
 rudd_events_gillard.1.d: "Mientras todavía estamos en el proceso de finalizar nuestro gabinete, Rudd nos ha acercado con la oferta de servir como Ministro de Relaciones Exteriores. Sin duda, Rudd podría ser el ministro más experimentado y demostrablemente efectivo en asuntos extranjeros, y podría servir como un impulso político para tener a alguien de la oficina anterior sirviendo con nosotros ahora. Aún así, podríamos querer separar nuestro gabinete de lo viejo si queremos aparecer como la nueva cara del trabajo."
 rudd_events_gillard.1.a: "Welcome aboard."
 rudd_events_gillard.1.b: "We're fine, thank you."
 rudd_events_gillard.2.t: "The Q&A Drama"
 rudd_events_gillard.2.d: "Algunas noticias han flotado nuestra manera de que Kevin Rudd hizo una aparición sorpresa en el programa de charlas Q+A, respondiendo a varias preguntas relacionadas con su término. Al valor nominal el espectáculo no era nada de lo que preocuparse, pero algunos miembros del gabinete han notado el tono «crítico» que Rudd dio a algunas preguntas, culpando a ciertos «colleagues» por socavarlo durante su mandato. \n\nTan imparcial como suena, los periodistas están haciendo la conexión directamente con nosotros y culpando a los miembros en nuestro gabinete por el fallecimiento de Rudd. A pesar de lo ridículos que son las acusaciones, nos está dando otro dolor de cabeza en las encuestas."
 rudd_events_gillard.2.a: "Is he doing it on purpose?"
 rudd_events_gillard.3.t: "Kevin Rudd haciendo campaña"
 rudd_events_gillard.3.d: "Recientemente se ha visto a Rudd en elecciones locales que apoyan a otros miembros del Trabajo. Por todos los medios el apoyo es apreciado por el partido, pero Rudd está casi a propósito haciendo todo sobre sí mismo. Convertir visitas en operaciones fotográficas, y sacar el foco de atención a los candidatos para dar sus propias entrevistas. Está reuniendo apoyo alrededor de sí mismo en lugar de nuestra administración, y podría estar funcionando. \n\nEl apoyo a Rudd en Newspolls está creciendo mucho más alto que el nuestro, y si hacemos algo para detener su pequeño recorrido sólo podría empeorar las cosas."
 rudd_events_gillard.3.a: "Damn it Kevin!"
 rudd_events_gillard.4.d: "Rudd ha sido visto asistiendo a varios electores locales que apoyan a nuestros candidatos del Trabajo. Esta es una actividad bastante estándar para los miembros del partido experimentados, excepto que Rudd parece estar saliendo de su camino para iluminar nuestras políticas, defendiéndolas a la prensa. \n\nSi los medios de comunicación realmente van a rodar con ella es una cosa, pero está haciendo maravillas para nuestras cifras de votación, y sin duda va a ayudarnos en las próximas elecciones estatales."
 rudd_events_gillard.4.a: "Qué considerado."
 rudd_events_gillard.5.t: "Rudd sale contra nuestro Gobierno"
 rudd_events_gillard.5.d: "Esperamos que Kevin Rudd se haya estado escabullindo alrededor del parlamento buscando convertir a más de nuestros ministros en nuestra contra. Desafortunadamente los medios de comunicación están corriendo con una conversación «legada» donde Rudd proclamó que no creía en nuestro gobierno para ganar las próximas elecciones, y que estaba considerando un reto de liderazgo con serio respaldo. \n\nComo de costumbre, esto es probablemente un truco de Kevin para burlarnos, y llamar una votación de liderazgo podría ponerlo en su lugar, pero ¿es incluso vale la pena el humor?"
 rudd_events_gillard.5.a: "Llama a la votación de liderazgo."
 rudd_events_gillard.5.b: "Es una hamburguesa sin nada."
 rudd_events_gillard.6.t: "Liderazgo Ballot llamado"
 rudd_events_gillard.6.d: "Tras las elecciones de liderazgo laboral, Kevin Rudd fue golpeado manualmente 71 a 31. Rudd ha prometido poner fin a cualquier otro desafío contra nosotros, y apoyar en otras votaciones en el futuro, sea cual sea el mérito que pueda tener. Los resultados muestran que, a pesar de todo, la fiesta todavía tiene nuestra espalda. Este gobierno va a continuar su misión al pueblo australiano, sin importar lo difícil que sea. Es hora de volver al ring y seguir empujando nuestra política."
 rudd_events_gillard.6.a: "¡Escuchen!"
 rudd_events_gillard.7.t: "Renuncias masivas en el Gabinete"
 rudd_events_gillard.7.d: "Tres de nuestros principales miembros del gabinete han entregado sus renuncias dentro de la misma semana en lo que sólo podemos imaginar es una especie de protesta de nuestro gobierno. El gabinete inferior Los simpatizantes de Rudd también han bajado en respuesta. La situación no puede ser más grave en términos de unidad del partido. Tendremos que batir algunos reemplazos de emergencia y hacer un anuncio pronto para salvar la cara. \n\nSi estos sabotajes no fueran tan frecuentes podríamos estar empujando una reforma seria, y realmente comprometiéndonos con el trabajo que fuimos elegidos para hacer."
 rudd_events_gillard.7.a: "Como ratas huyendo de un barco hundiendo."
 rudd_events_gillard.8.t.a: "Los verdes terminan la alianza"
 rudd_events_gillard.8.t.b: "Ex-liberal Independents se reúnen alrededor de [GetASTLeaderTitle]"
 rudd_events_gillard.8.d.a: "En medio de las recientes salidas en el gabinete, la nueva líder del partido Greens, Christine Milne, ha anunciado que su partido también nos abandonará, disolvándonos la alianza. Mencionaron una excusa de hockey sobre un desacuerdo en la política, pero sabíamos que esto sucedería eventualmente. El trabajo está preparado para entrar en las próximas elecciones solo."
 rudd_events_gillard.8.d.b: "En medio de las críticas de los partidos opositores, los independientes se han reunido alrededor del [GetASTLeaderTitle], defendiendo la política de nuestro gobierno ante el drama en curso. A pesar de estar dentro y fuera del hospital, Tony Windsor incluso apareció frente a las cámaras para presumir sobre las reformas positivas que ha ayudado a poner a través, habiendo apoyado nuestros números en la Casa. Sinceramente, es hora de que tengamos algo de apreciación."
 rudd_events_gillard.8.a: "Típico."
 rudd_events_gillard.8.b: "Un gesto de bienvenida."
 rudd_events_gillard.9.t: "Otro desafío de liderazgo"
 rudd_events_gillard.9.d: "Mientras nuestra posición en las encuestas empeora, nuestras críticas en el parlamento han surgido, como los tiburones que olían la sangre, y han comenzado a preparar un desafío de liderazgo. Desde el último nuestro respaldo ha disminuido severamente. A pesar de la promesa de Kevin Rudd, se rumorea que está poniendo su nombre adelante para el voto si se hace un desafío, y sin duda ha estado jugando con sus leales por un tiempo. \n\nA pesar de nuestra victoria en la última votación, podríamos no alejarnos de esta inexpugnable."
 rudd_events_gillard.9.a: "En la brecha."
 gillard_goodbye_ast.1.t: "Cortina final"
 gillard_goodbye_ast.1.d: "En una reunión antes del voto Rudd se comprometió a retirarse de la política si perdió, no que su palabra tuviera un peso real en ese momento. Sería satisfactorio verlo caminar lentamente hacia el horizonte, nunca manchar estos pasillos de nuevo. Desafortunadamente no tuvimos tanta suerte. Por un margen de 57 a 45 Rudd fue el ganador claro. \n\n¿Estaba Australia realmente lista para una mujer [GetASTLeaderTitle]? Ciertamente no lo mostraban, dentro o fuera del parlamento. De repente Julia había perdido todo lo que había gastado tanto tiempo para conseguir, y ni siquiera había tiempo para procesarlo. Estaban fuera de la sala del Caucus Laboral y directamente en la sala de conferencias. \n\nGillard hizo su último discurso a una multitud similar a la que la vio jurada. Era corto y sencillo. Gillard no impugnaría los resultados. ¿Cuál sería el punto? A veces juegas tus cartas y pierdes. \n\nY Gillard no sería un mal perdedor."
 gillard_goodbye_ast.1.a: "Se acabó ahora."
 gillard_goodbye_ast.2.t: "El Ballot Final"
 gillard_goodbye_ast.2.d: "Durante la votación Gillard permaneció genial. No quería darles la satisfacción de estar preocupada. Rudd estaba sentado en la parte trasera de la habitación atormentada. No tenía que decir nada, simplemente radió la hinchazón. En sus momentos finales como [GetASTLeaderTitle] Julia lo honraría con dignidad, de lo contrario le hubiera gustado caminar a través de la habitación y dar un poco de sentido al hombre. \n\nLa votación fue llamada y los nombres fueron llamados lentamente. 47... 51... 55... 63. El relato final fue de 63 a 39. Gillard había ganado. \n\nSu gabinete se levantó y empezó a aplaudir detrás de ella. Apenas podía moverse, pero se forzó a aceptar el brindis, mientras su mente corría por el razonamiento. ¿Había finalmente aceptado la fiesta? En algún tipo de protesta final, Kevin Rudd se puso de pie también y comenzó a aplaudir. Antes del voto, Rudd se había comprometido a retirarse de la política si perdía. Nunca tendría que verlo de nuevo. \n\nEstaban fuera de la sala Labor caucus y en la cercana sala de conferencias rápidamente, y Gillard anunció los resultados, confirmando que ella estaría corriendo en las próximas elecciones."
 gillard_goodbye_ast.2.a: "¿Se acabó?"
 uranium_trade_deal_ast.1.t: "Propuesta de comercio de uranio de Australia"
 uranium_trade_deal_ast.1.d: "El gobierno australiano nos ha presentado un acuerdo económico para exportar uranio a nosotros en volúmenes crecientes, a cambio de minimizar los aranceles sobre sus exportaciones. Su gobierno ha acordado reducir igualmente los aranceles sobre nuestras exportaciones y abrir los términos a compromisos más cooperativos con el comercio en el futuro. El acuerdo estipula que el uranio no debe ser utilizado para el enriquecimiento de grado de armas, pero una vez que el mineral está en nuestras fronteras depende realmente de nosotros."
 uranium_trade_deal_ast.1.a: "Un acuerdo fecundo."
 uranium_trade_deal_ast.1.b: "It's not in our interest."
 uranium_trade_deal_ast.2.t: "India está de acuerdo con el acuerdo de uranio"
 uranium_trade_deal_ast.2.d: "India ha acordado los nuevos términos y firmado el pacto comercial! Podemos esperar una gama de bienes y servicios de ellos a un ritmo creciente y racionalizado, mientras que bajan aranceles sobre nuestro uranio. Es crucial para el éxito del acuerdo, también han acordado adoptar las normas de la Agencia Internacional de Energía Atómica (OIEA), estipulando que el uranio no se utilizará para el enriquecimiento de grado de armas. A cambio, cooperaremos con ellos en investigación energética."
 uranium_trade_deal_ast.2.a: "¡Una victoria!"
 uranium_trade_deal_ast.3.t: "India rechaza el Pacto de Comercio"
 uranium_trade_deal_ast.3.d: "La India se ha negado a nuestros excesos de comercio, y ha optado por continuar los compromisos actuales. [GetASTLeaderTitle] [RAJ.GetLeader] no ha comentado el resultado, pero parece que no estamos a favor de su gobierno. Esto es ciertamente un paso atrás para el comercio pacífico, y una desafortunada supervisión."
 uranium_trade_deal_ast.3.a: "We're losing our touch."
 uranium_trade_deal_ast.5.t: "Moscú firma el Pacto"
 uranium_trade_deal_ast.5.d: "El gobierno de Moscú ha acordado nuestros términos comerciales y eliminará una gama de aranceles sobre nuestras mercancías a cambio de aumentar las exportaciones de uranio para ellos. Si bien seguían siendo vagos en el uso del uranio, se comprometieron a no utilizarlo para enriquecer las categorías de armas. El acuerdo marca un avance decisivo en la cooperación que no se ha logrado a este nivel desde antes de la caída del Muro de Berlín, y parecen ansiosos por continuar la cooperación entre nosotros."
 uranium_trade_deal_ast.5.a: "¡Saca el borscht!"
 uranium_trade_deal_ast.6.t: "Moscú saca de las negociaciones"
 uranium_trade_deal_ast.6.d: "Rusia se ha negado a nuestras overtures para el comercio, y ha optado por continuar los compromisos actuales. El Presidente [SOV.GetLeader] no ha comentado el resultado, pero parece que no estamos a favor de su gobierno. Esto es ciertamente un paso atrás para el comercio pacífico, y una desafortunada supervisión."
 uranium_trade_deal_ast.6.a: "El oso está mejor solo."
 rudd_in_korea.1.t: "De la Tierra Downunder"
 rudd_in_korea.1.d: "El ministro de Relaciones Exteriores de Australia ha estado llevando a cabo negociaciones con nosotros, a través de China, para organizar un calentamiento de las relaciones entre nosotros y Corea del Sur. El esquema es audaz, y algo ingenuo. Los australianos han pedido que nos comprometamos a establecer un plazo en el que cese la producción de armas de largo alcance, sin desmantelar ninguna de nuestras armas actuales, a cambio de la sanción del socorro y el apoyo para el desarrollo. Como nuestra guerra con Corea del Sur no ha terminado técnicamente, se han ofrecido a resolver la disputa en el puesto de control DMZ. Esta podría ser una oportunidad de propaganda valiosa."
 rudd_in_korea.1.a: "Una ocasión única."
 rudd_in_korea.1.b: "No es nuestro mejor interés."
 rudd_in_korea.2.t: "El triunfo de Kevin Rudd en Corea"
 rudd_in_korea.2.d: "Caminando lentamente por el punto de control de la zona desmilitarizada entre Corea del Norte y Corea del Sur, Kevin Rudd fue encontrado por el líder norcoreano [KOR.GetLeader], y las dos manos agitadas. Cada uno de ellos su propio lado de la frontera, marcando un salto simbólico en las relaciones coreanas, y significando un cambio dramático al mayor status quo en Asia. Rudd entonces cruzó, convirtiéndose en el primer miembro del gobierno australiano, y ex líder, para entrar en el país. \n\nDespués de cuatro meses de intensas negociaciones, pasando por China y adelante, se logró un avance decisivo. [NKO.GetLeader] ha acordado un plazo para poner fin al desarrollo de armas de largo alcance, y una resolución a la guerra coreana, que ha estado en curso desde 1950 técnicamente, a cambio de la sanción del socorro y el apoyo a la ayuda para el desarrollo. Rudd y el Líder Supremo hablaron en una conferencia de prensa más adelante, enfatizando la amistad mutua que nuestras dos naciones esperan lograr. \n\nEl presidente surcoreano, [KOR.GetLeader], que acompañó Rudd al DMZ, elogió el esfuerzo de Rudd como verdadero éxito y un boón para la paz internacional."
 rudd_in_korea.2.a: "La diplomacia sólida gana de nuevo."
 vietnam_trade_gillard_ast.1.t: "Comercio de Australia"
 vietnam_trade_gillard_ast.1.d: "El gobierno australiano nos ha presentado un acuerdo económico para simplificar el comercio entre nosotros en volúmenes crecientes y minimizar los aranceles a ambas partes. Hemos disfrutado constantemente de un comercio saludable entre nosotros hasta ahora, y parecen estar interesados en arreglos más cooperativos en el futuro."
 vietnam_trade_gillard_ast.1.a: "Una propuesta justa."
 vietnam_trade_gillard_ast.1.b: "This doesn't suit us."
 vietnam_trade_gillard_ast.2.t: "Vietnam está de acuerdo con las negociaciones comerciales"
 vietnam_trade_gillard_ast.2.d: "El gobierno vietnamita ha acordado los nuevos términos y firmado el pacto comercial. Podemos esperar una gama de bienes y servicios de ellos a un ritmo creciente y simplificado, y más australianos podrán disfrutar de productos más baratos en las tiendas cercanas."
 vietnam_trade_gillard_ast.2.a: "It's all coming together."
 vietnam_trade_gillard_ast.3.t: "Vietnam rechaza las negociaciones comerciales"
 vietnam_trade_gillard_ast.3.d: "Vietnam ha rechazado nuestras ventajas por el comercio, y ha optado por continuar los compromisos actuales. La presión externa puede haber impedido que firmaran el acuerdo, pero el Secretario General [VIE.GetLeader] no ha comentado el resultado. Esto es ciertamente un paso atrás para el comercio pacífico, y un resultado desafortunado."
 vietnam_trade_gillard_ast.3.a: "Un resultado decepcionante."
 stir_the_pot_event.1.t: "Australia exige una zona libre de moscas"
 stir_the_pot_event.1.d: "Después de varios incidentes en los que nuestros combatientes golpearon accidentalmente la infraestructura civil, el gobierno de Australia ha exigido que nos adhiramos a una «zona de exclusión aérea» forzada sobre Libia, instituyendo que nuestros aviones permanezcan en sus bases para que no sean contratados por la Fuerza Aérea de Australia. Ya sea que tengan la intención de hacer cumplir esta solicitud no es para nosotros decir, pero están muy lejos, y exigen mucho."
 stir_the_pot_event.1.a: "Acquiesce to their demands."
 stir_the_pot_event.1.b: "Libyan airspace is Libyan!"
 stir_the_pot_event.2.t: "Libia rinde cuentas a nuestras demandas"
 stir_the_pot_event.2.d: "Con la amenaza de una intervención australiana, [LBA.GetLeader] ha acordado instituir una «zona de exclusión aérea» sobre el espacio aéreo libio durante su conflicto civil. Es de esperar que las bajas civiles sean mínimas e impidan el derrame en los Estados vecinos."
 stir_the_pot_event.2.a: "Realpolitik en acción."
 stir_the_pot_event.3.t: "Libia rechaza nuestra solicitud"
 stir_the_pot_event.3.d: "A pesar de la continua pérdida de vidas civiles, [LBA.GetLeader] ha rechazado nuestra solicitud de una «zona de exclusión aérea» sobre el espacio aéreo libio. Su conflicto civil en curso seguirá causando un peligro presente para la población de la región, y el riesgo de derramamiento en los Estados vecinos está creciendo. La forma en que hacemos cumplir nuestras demandas depende de nosotros ahora."
 stir_the_pot_event.3.a: "Conocieron la alternativa."
 myanmar_intervention_gillard.1.t: "Australia exige la cooperación para el mantenimiento de la paz"
 myanmar_intervention_gillard.1.d: "El gobierno de Australia nos ha enviado una demanda para permitir que sus fuerzas de mantenimiento de la paz entren en el país y ayudarnos a manejar la actual crisis insurgente. La ayuda sería apreciada, sin embargo, sus términos esencialmente nos harían un estado político cliente a su gobierno hasta que se levante la crisis, lo cual no está definido por sus términos. Parecen totalmente indecentes a hacer cumplir la solicitud, en tal medida que si rechazamos una invasión militar no está fuera de la cuestión."
 myanmar_intervention_gillard.1.a: "Por supuesto que no."
 myanmar_intervention_gillard.1.b: "We have no alternative."
 myanmar_intervention_gillard.2.t: "Myanmar acepta términos"
 myanmar_intervention_gillard.2.d: "Frente a la creciente amenaza insurgente, [BRM.GetLeader] ha acordado permitir que nuestros efectivos de mantenimiento de la paz en Malasia contengan la crisis. Un componente sizable de nuestras fuerzas armadas comenzará la ocupación en breve. En última instancia, esta es una gran victoria en la lucha contra el terrorismo."
 myanmar_intervention_gillard.2.a: "Es por su propio bien."
 myanmar_intervention_gillard.3.t: "Myanmar niega condiciones de mantenimiento de la paz"
 myanmar_intervention_gillard.3.d: "A pesar de que nuestra delegación se despidió en buenas condiciones con los malasios, [BRM.GetLeader] ha rechazado abiertamente nuestro ofrecimiento de ayudar a combatir la creciente crisis insurgente. La nación ha seguido desentrañando el borde del colapso, presentando un riesgo real de convertirse en una cama caliente para las células terroristas. Considerando lo mal que pueden llegar las cosas, nuestra respuesta debe ser proporcional al peligro que esto presenta."
 myanmar_intervention_gillard.3.a: "Sancionarlos para cooperar."
 myanmar_intervention_gillard.3.b: "Debemos intervenir."
 ast_myanmar_intervention_rejection_outcomes_tt: "Si Myanmar se niega, Australia puede imponer sanciones y un embargo o preparar un objetivo de guerra de títeres."
 reconciliation_discontent: "La reconciliación descontento"
 reconciliation_discontent_desc: "Una desventaja persistente impregna la vida de los australianos indígenas. Mientras que el caso Mabo revitalizó el espíritu de muchos, constantemente indiferentes líderes durante la última década ha molido gran parte de la esperanza que pocos todavía tenían, y aún menos están viendo los beneficios de él hoy. Una pequeña minoría vocal todavía apela al gobierno por un cambio desesperado."
 reform_despair_ast: "Reconciliación"
 reform_despair_ast_desc: "Sin esperanza para cambiar el espíritu de reconciliación se ha apagado. Los australianos indígenas siguen viviendo en la franja sin un futuro garantizado, y muchos otros se sienten desencantados con la dirección de nuestra política. La igualdad para todos en nuestra nación ahora se siente muy lejos de su alcance. Podemos esperar que los votantes no afectados apoyen movimientos más radicales en el futuro."
 rekindled_hope_ast: "Esperanza reavivada"
 rekindled_hope_ast_desc: "Se ha levantado un peso de muchos australianos. De una manera pequeña pero mensurable, la nación se ha movido hacia la curación. Mientras el camino es todavía largo, el viaje para llegar allí se ha hecho más fácil. Se están poniendo a disposición más oportunidades para los necesitados. Los lugares de trabajo y las escuelas se han unificado más y respaldan a todos los australianos. La comunidad espera ahora con esperanza."
 economic_radical: "Económico Radical"
 john_howard: "John Howard"
 the_rba_ast: "El RBA"
 the_rba_ast_desc: "El Banco de Reserva de Australia es nuestro banco central y autoridad en la emisión de billetes bancarios. Esto significa esencialmente que controlan la tasa de interés. Si jugamos bien con nuestras políticas, desciende el gasto y el desempleo, jugarán bien."
 work_for_the_dole: "Trabajo para el Dole"
 work_for_the_dole_desc: "El programa tiene como objetivo capacitar a los participantes y ponerlos a trabajar ayudando a las comunidades locales si son capaces. Seguirán recibiendo apoyo de ingresos durante el trabajo mientras seguimos entrenándolos."
 work_for_the_dole_2: "Trabajo para el Dole"
 work_for_the_dole_2_desc: "El programa tiene como objetivo capacitar a los participantes y ponerlos a trabajar ayudando a las comunidades locales si son capaces. Seguirán recibiendo apoyo de ingresos durante el trabajo mientras seguimos entrenándolos. A medida que se cultiva, hemos incorporado una serie de roles de construcción estatales a la lista de oportunidades, para ayudar con nuestras obras de construcción."
 baby_bonus_idea_ast: "Bono de bebé"
 baby_bonus_idea_ast_desc: "El plan tiene por objeto compensar los gastos que pesan sobre los nuevos padres que crían a su hijo. Se distribuye una suma global de $3.000 a los padres por hijo elegible. Esto debería alentar a una población creciente a mitigar nuestros australianos envejecidos."
 negative_gearing_tooltip_tt: "Daños masivos nuestra relación con los §Ylandowners§! y nuestras posibilidades de reelección, pero puede prevenir una crisis de vivienda en el futuro."
 tafe_investment: "Inversiones en TAFE"
 signed_the_kyoto_protocol_ast: "Firmó el Protocolo de Kyoto"
 kyoto_protocol_ast: "Protocolo de Kyoto"
 kyoto_protocol_ast_desc: "Originalmente adoptado por otras naciones en 1997, el Protocolo ha sido una piedra rectora para reducir las emisiones de gases de efecto invernadero para las industrias, sobre la base del último consenso científico sobre el calentamiento global. Si bien no todas sus restricciones están en vigor, las estamos introduciendo a lo largo del tiempo con la esperanza de alcanzar eventualmente una producción neta de gases de efecto invernadero."
 ast_avoid_the_speech_tt: "Se ordenará al partido que siga siendo imparcial en interés de la unidad de coalición. Sólo podemos esperar que el público pierda interés."
 national_water_initiative_ast: "§GIniciativa Nacional del Agua§!"
 national_water_initiative_ast_2: "§GIniciativa Nacional del Agua§!"
 ast_a_nation_worth_preserving_tt: "Los efectos de nuestro §Gsuccess§! se sentirán en las generaciones siguientes."
 police_and_security_increase_tt: "Nuestra §YPolítica y Financiación de Seguridad§! se incrementará para combatir las protestas."
 police_and_security_increase_2_tt: "Nuestra §YPolítica y Financiación de Inteligencia§! se incrementará para ampliar nuestros poderes judiciales."
 asio: "ASIO"
 asio_desc: "La Organización Australiana de Seguridad e Inteligencia es responsable de proteger a nuestros ciudadanos contra todas las amenazas internas. Originalmente creada durante cinco décadas antes, la organización se ha adaptado para contrarrestar las crecientes amenazas que enfrenta Australia en el nuevo milenio."
 streamlined_asylum_policy_ast: "Política de asilo racionalizada"
 encourage_foreign_students_ast: "Alentados estudiantes extranjeros"
 foreign_industrial_experts_ast: "Expertos técnicos extranjeros"
 foreign_industrial_experts_ast_desc: "Se han concedido visados preferenciales adicionales a expertos de ultramar. Traer algunas de las mentes más brillantes de todo el trabajo para trabajar y enseñar en Australia."
 border_protection_bill_ast: "Proyecto de Ley de protección de fronteras"
 our_ast_deputy_peacekeepers: "Nuestros Pacificadores Adjuntos"
 australian_political_system: "Sistema político australiano"
 king_of_the_battlers: "King of the Battlers"
 tourism_campaign_ast: "Campaña Nacional"
 accepted_pacific_solution: "Aceptada la solución del Pacífico"
 denied_pacific_solution: "Declinó la solución del Pacífico"
 IND_extremist_suppression_bonus: "Actividades conjuntas de Australia contra el terrorismo"
 rudd_in_the_fire_tt: "Kevin Rudd se pondrá a trabajar para encontrar oportunidades en el extranjero para nosotros. Más §2Decisiones§! estarán disponibles en la pestaña Internacional Misiones con el tiempo."
 sino_aus_peacekeeping: "Mantenimiento de la paz sino-Australiano"
 sino_aus_peacekeeping_desc: "Si bien sólo el comienzo de esa iniciativa, el acuerdo sienta las bases para futuras operaciones de mantenimiento de la paz en el Pacífico. Al cooperar en la reunión de inteligencia, la lucha contra el terrorismo y la protección del comercio, podemos seguir manteniendo los océanos entre nosotros seguros, y salvar la brecha entre nuestras dos naciones."
 ast_peacekeeping: "Mantenimiento de la paz entre China y Australia"
 chinese_export_bonus_ast: "China Export Deal"
 japanese_export_deal_ast: "Concesiones agrícolas japonesas"
 japanese_export_deal_ast_1: "Trato de exportación japonés"
 howard_doctrine_tt: "Los nuevos esfuerzos en el extranjero estarán disponibles en la pestaña §2decisiones§!."
 ast_international_missions: "International Misiones"
 ast_international_missions_desc: "Nuestra doctrina representa una flexibilidad para explorar nuevas oportunidades que consideramos fructíferas, respetando las antiguas. Australia está en el precipicio de un nuevo futuro brillante. Sólo tenemos que darle un empujón."
 aus_us_visit: "State visit to America"
 aus_china_visit: "State visit to China"
 aus_norm_nk: "Normalizar las relaciones norcoreanas"
 aus_sk_visit: "Visita del Estado de Corea del Sur"
 aus_tur_visit: "Gallipoli Ceremony in Turkey"
 aus_rus_visit: "State visit to Russia"
 aus_eng_visit: "Visita del Estado de la Monarquía"
 ast_political_decisions: "Político Decisiones"
 ast_political_decisions_desc: "Nuestra capacidad de dirigir la nación requiere que enrollemos ocasionalmente las mangas y engrasemos algunas palmas. Ya sea que sean gigantes de la industria o aquellos más cercanos al gobierno, lo que hacemos detrás de las escenas mantiene el país en marcha. No es un trabajo honesto, pero es mucho."
 ast_approach_the_unions: "Enfoque de las Uniones"
 ast_approach_the_unions_desc: "A ninguno de nosotros nos gusta tratar con los sindicatos, pero si vamos a hacer algún salón en la industria, hay que llegar a un compromiso. Nuestros esfuerzos en materia de reforma dependen de ello."
 ast_manufacturer_subsidies: "Subvenciones del fabricante"
 ast_manufacturer_subsidies_desc: "Los subsidios son como el WD40 para las plantas de producción. Cuando algunos de ellos no están corriendo tan suave que sacas los subsidios, y espero que vuelvan a ponerse en forma."
 ast_cabinet_reshuffle: "Rehabilitación del gabinete"
 ast_cabinet_reshuffle_desc: "Últimamente el gabinete ha estado rezagado detrás de la línea del partido. Algunos son simplemente inadecuados para el trabajo, mientras que otros son insubordinados. Afortunadamente podemos usar uno de los pocos poderes que tenemos como líder del partido. Al reshuffling el gabinete podemos colocar algunos de nuestros picos más favorables delante y centro, y eliminar los menos inclinados para ayudarnos."
 ast_loosen_gambling_restrictions: "Restricciones de juego de loosen"
 ast_loosen_gambling_restrictions_desc: "Un vicio entre muchos australianos es el juego. Habita casi todos los vestigios de nuestra economía de una manera u otra. En los últimos años nuestras políticas han bajado duramente en la industria, pero podemos aflojar algunas de las restricciones ligeramente para ver algunos logros a corto plazo, y hacer feliz a todos."
 ast_revisit_zoning_laws: "Revisita las leyes Zoning"
 ast_revisit_zoning_laws_desc: "Actualmente el gobierno estatal y los consejos locales dictan el 'qué, dónde y cómo' al construir en la propiedad. Recientemente los desarrolladores de propiedades nos han estado acosando para levantar algunas de las restricciones. Volver a examinar las directrices podría evitar algunas de estas preocupaciones."
 cdep: "Proyectos de empleo para el desarrollo comunitario"
 cdep_desc: "El programa original surgió del deseo de que las comunidades indígenas pudieran planificar y construir proyectos de desarrollo. El programa continuó lo suficientemente bien, pero podemos aumentar el alcance de los proyectos enviando especialistas gubernamentales y aumentando la financiación disponible."
 nielns: "Estrategia Nacional de Alfabetización Inglesa Indígena y Numeracia"
 nielns_desc: "Las tasas de alfabetización de los aborígenes y los isleños del Estrecho de Torres se han reducido en los últimos años, lo que junto con las tasas de asistencia ya deficientes parece una receta para el desastre. Si trabajamos con las escuelas para desarrollar programas que ayuden a los estudiantes, podría cambiar muchas vidas."
 fam_violence_proj: "Proyectos de prevención de la violencia familiar"
 fam_violence_proj_desc: "La violencia familiar era la fea verdad que pocos políticos querían tocar en los años 90. Nuevos enfoques basados en evidencia han hecho que el proceso sea más clínico, y menos una responsabilidad política, por lo que financiarlos es un paso fácil para nosotros."
 construct_recon_place: "Construir el lugar de reconciliación"
 construct_recon_place_desc: "Se han redactado y presentado varias propuestas de paisaje urbano en nuestro escritorio para su aprobación. Entre ellos está el Lugar de Reconciliación en Canberra. Si es aprobado podría ser un testimonio maravilloso de nuestros esfuerzos."
 repatriate_remains: "Restos indígenas repatriados"
 repatriate_remains_desc: "No es ningún secreto que los museos británicos albergan una serie de objetos de otros países. Entre ellos se incluyen restos humanos. Varios grupos indígenas han pedido que se devuelvan los restos a Australia para su entierro."
 mabo_referendum: "State of Reconciliation Amendment"
 mabo_referendum_desc: "La modificación de la constitución incluye formalmente una Declaración de Reconciliación en el preámbulo de la Constitución, reconociendo sus tierras los derechos indígenas australianos."
 ast_walk_the_journey_tt: "Los programas y acciones relacionados con nuestro esfuerzo de reconciliación se abrirán en la pestaña Política §2Decisiones§!."
 mabo_vibe_tt: "La Enmienda del Estado de Reconciliación estará disponible en §2decisiones§!."
 ast_strong_in_difference_1_ast: "Multiculturalismo gestionado"
 the_lucky_country_ast: "El País Suerte"
 the_lucky_country_ast_desc: "Años de expansión de las operaciones mineras y falta de innovación en otros sectores nos han hecho depender de nuestra economía exportadora. Nuestros conglomerados deben cavar profundo y tomar su relleno si vamos a prosperar aquí. O eso o algo debe cambiar."
 wind_power_grants_ast: "Subvenciones de energía eólica"
 acis_ast: "§2Esquema de competitividad e inversión automotriz§!"
 high_speed_ast_tt: "El proyecto se puede iniciar en la pestaña §2decisiones§! de la industria. Construirlo será muy costoso y puede encontrarse con retrasos."
 lng_tt: "Los proyectos de GNL serán desbloqueados en la pestaña Industria §2decisiones§!."
 encouraged_foreign_investment_ast: "Anime la Inversión Extranjera."
 encouraged_foreign_investment_ast_desc: "TDA"
 diisr_ast_1: "DIISR"
 adf_sensor_upgrades: "Actualizaciones de sensores ADF"
 our_beloved_bushmaster_tt: "§2El costo de producción§! para nuestro Bushmaster se reducirá en §G20%§!"
 lessons_from_the_middle_east_ast_1: "Modificaciones resistentes al calor"
 heef_ast: "Fondo de Dotación de la Educación Superior"
 ast_wholesale_economics_tt: "§2Decisiones§! permitirnos privatizar partes del gobierno estará disponible en la pestaña Política Decisiones."
 subdued_governor_general_ast: "Gobernador general sometido"
 subdued_governor_general_ast_desc: "Con la actual promulgación del nuevo gobernador general atado por un torrente burocrático de desafíos legales, estamos libres de cambiar nuestras posturas extranjeras sin tener que preocuparse por ninguna interferencia real. Los días de despidos están actualmente detrás de nosotros."
 hostile_to_our_tradition: "Hostile to Our Traditions"
 ets: "Subvenciones de energía nuclear"
 protect_forests_ast: "§GProtecciones forestales del Viejo Crecimiento§!"
 foreign_interests_in_media_ast: "Interés Extranjero en Nuestros Medios"
 gutted_unions_ast: "§2WorkChoices§!"
 ast_back_australias_ability_1: "La habilidad de Australia"
 hospital_investment_ast: "Inversión hospitalaria"
 curbing_outside_interference_ast: "Curvando la Interferencia externa"
 work_conditions_amended_ast: "Condiciones de trabajo enmendadas"
 australian_made: "Australiana Made"
 ast_our_own_kings_tt: "Sin el Gobernador General sofocando nuestra política, estaremos libres de tomar la política exterior §R en nuestras propias manos.§!"
 crossbencher_support_ast: "Apoyo a Crossbencher"
 ast_keep_them_in_line_tt: "§HLas posibilidades de un reto de liderazgo se reducirán drásticamente.§!"
 ast_secure_the_coalition_tt: "§HUna división de coalición será menos probable en el futuro.§!"
 ast_broaden_our_beliefs_tt: "Seremos capaces de obtener apoyo de otras partes para reforzar nuestra §Ypopularidad.§!"
 old_reliable_ast_tt: "El §2Costo de producción§! para nuestro armamento Austeyre se reducirá §G10%§!"
 socomd_ast: "Comando de Operaciones Especiales"
 peacekeeping_training_ast: "Capacitación en mantenimiento de la paz"
 strategic_reforms_1_ast: "Reformas Estratégicas de la ADF"
 sell_federal_airports: "Vender aeropuertos federales"
 sell_railcorp_freight: "Vender FreightCorp y acciones nacionales de Rail"
 sell_broadcast_australia: "Vender Broadcast Australia"
 sell_dasfleet: "Vender DASFLEET"
 sell_reserve_bank_assets: "Vender activos del Banco de Reserva"
 ast_industry_decisions: "Sector industrial Proyectos"
 ast_industry_decisions_desc: "Los proyectos industriales, encabezados por nuestro gobierno, nos permiten mejorar directamente la producción nacional con menos tensión en nuestras corporaciones privadas."
 lng_megaproject_1: "Proyecto GNL Gorgon en Queensland"
 lng_megaproject_2: "GNL Ichthys en el Territorio del Norte"
 lng_megaproject_3: "Proyecto Wheatstone de GNL en Australia Occidental"
 lng_megaproject_4: "LNG Curtis in Queensland"
 lng_megaproject_5: "Plutón de GNL en Australia Occidental"
 lng_megaproject_6: "GNL Prelude offshore"
 recruitment_campaign: "Campaña de reclutamiento en línea"
 lng_megaproject_ast_tt: "Los megaproyectos estarán disponibles en la pestaña Industria §2Decisiones§!."
 heavy_industry_tt: "Los proyectos estatales de industria pesada estarán disponibles en la pestaña Industria §2Decisiones§!."
 heavy_industry_project: "Construcción industrial pesada"
 ast_urban_expansion_initiative_tt: "§2Decisiones §! para ampliar nuestras ranuras de construcción se pondrán a disposición en la pestaña Industria Decisiones."
 recruitment_campaigns_tt: "Las campañas de reclutamiento estarán disponibles en la pestaña §2Militar Decisiones§!."
 adf_acq_astuirement_program: "Programa de Adquisición ADF"
 the_white_paper: "The 2000 White Paper"
 the_white_paper_desc: "El documento de Defensa 2000 fue realizado como un examen amplio de nuestras actuales capacidades militares, y las que demanda la administración actual. Con más peso sobre la fuerza de Australia como principal proveedor de seguridad y mantenimiento de la paz en el Pacífico, las demandas han sido predominantemente expandirse."
 the_second_white_paper_1: "The 2nd White Paper"
 the_second_white_paper_1_desc: "Tras el éxito del primer documento, se ha encargado a las ADF que emprendan programas y reestructuración más expansivos para seguir cumpliendo con las exigencias de la defensa del Pacífico."
 ast_we_are_many_tt: "El §Gfuturo§! la demografía de nuestra nación está en nuestras manos."
 sol_islands_intervention: "Asistencia regional Misión a las Islas Salomón"
 sol_islands_intervention_desc: "La situación en el país ahora mismo es ciertamente menos que ideal. La lucha de bandidos y militantes es común, los servicios públicos se han descompuesto y la policía restante ha sido faccionalizada entre los grupos de guerra. Si queremos restaurar el orden a las Islas, se debe realizar un importante esfuerzo de estabilidad y reconstrucción pronto."
 sol_situation_countdown: "The situation is deteriorating..."
 organise_occupation_force: "Organizar la Fuerza de Ocupación"
 organise_occupation_force_desc: "Será necesario crear una fuerza ocupacional antes de iniciar cualquier operación importante. Actualmente algunas otras naciones han prometido su apoyo, pero la mayor parte de la fuerza tendrá que ser nuestra. Dos mil soldados y alrededor de doscientos efectivos entrenados para el mantenimiento de la paz servirán como fuerzas del orden en la isla."
 operation_anode: "Operación Anodo"
 operation_anode_desc: "Nuestra principal ofensiva sobre las Islas se llevará a cabo en varias etapas, en parte por mar y en parte por aire con nuestros Chinooks. El primer objetivo será aprovechar una serie de posiciones clave en la isla para actuar como centros de operaciones logísticos y de avanzada. Entonces podemos desplegar el trabajo de reconstrucción. Lo llamamos 'Operación Helpem Fren' para buenas ópticas, una frase que en su idioma significa 'ayudar a un amigo.'"
 secure_honiara: "Seguro Honiara"
 secure_weather_coast: "Safe Weather Coast"
 secure_rural_guadalcanal: "Seguro Rural Tambea"
 secure_malaita_province: "Provincia de Secure Malaita"
 sol_disarm_the_militias: "Desarmar a las Milicias"
 sol_red_cross: "Coordinar con la Cruz Roja"
 sol_red_cross_desc: "La Cruz Roja ya tiene una presencia significativa en la isla. Coordinar con ellos podría permitir que nuestros equipos traten y evacuen a civiles en riesgo."
 negotiate_with_the_militias: "Negociar con los Militantes"
 negotiate_with_the_militias_desc: "Negociar con militantes armados es difícilmente una misión estabilizadora, pero si nos acercamos a los más razonables para organizar el alto el fuego podría comprarnos más tiempo."
 disband_the_local_police: "Desarrolla a la Policía Local"
 disband_the_local_police_desc: "La policía local de las Islas se ha vuelto rampante con la corrupción y el faccionalismo hasta el punto en que ya no sirven al pueblo. Tendremos que desmontar la estructura actual de las fuerzas del orden si queremos arreglar algo."
 rebuild_the_local_policeforce: "Reconstrucción de la Policía Local"
 rebuild_the_local_policeforce_desc: "Si vamos a reconstruir la aplicación de la ley en el país tendremos que crear una junta multinacional de comisionados para comenzar a investigar e instruir a los nuevos reclutas de oficiales, y hacer cumplir las salvaguardias para mantener las cosas funcionando en el futuro."
 run_anticorruption_campaign: "Ejecutar campañas anticorrupción"
 run_anticorruption_campaign_desc: "Actualmente el paisaje político en la nación apenas es funcional, y mucho menos inescrupuloso. Pocos de los que quedan en el gobierno están sin marca. Habrá que iniciar una represión nacional de las prácticas ilegales, y entonces podemos ver cómo se establecen los nuevos cimientos."
 recruit_public_servants: "Contratación de funcionarios públicos"
 recruit_public_servants_desc: "Siguiendo con nuestros esfuerzos por despejar la junta, los funcionarios públicos de las naciones internacionales participantes serán contratados para servir en el nuevo gobierno por el momento, mientras que se hacen planes para sustituirlos eventualmente por los locales. Esta experiencia externa ayudará al gobierno con su rápida reconstrucción."
 reorganise_the_army: "Reorganizar el Ejército"
 reorganise_the_army_desc: "El país no tiene una fuerza militar efectiva desde su independencia en 1978. Lo poco que hizo ha incluido una unidad de vigilancia marítima y algunas tropas entregadas de la policía desactiva. Mientras que nuestros miembros del personal de mantenimiento de la paz tomarán el rollo de un ejército permanente, podemos empezar a capacitar a las unidades locales para tomar la presión de nosotros y ayudar a las operaciones."
 loans_to_the_new_government: "Préstamos al nuevo Gobierno"
 loans_to_the_new_government_desc: "Si bien seguimos desarrollando un nuevo sistema de gobernanza para las Islas Salomón, su deuda internacional sigue pendiente. Les prestaremos la financiación para pagar nuevo personal y reconstruir el gobierno."
 send_our_reconstruction_teams: "Envíe nuestros equipos de reconstrucción"
 send_our_reconstruction_teams_desc: "El estado de las cosas ha mejorado lo suficiente que podemos enviar a nuestros equipos de reconstrucción para ayudar en la reconstrucción y construcción de servicios públicos."
 sol_intervention: "Intervención de las Islas Salomón en curso"
 sol_intervention_success: "La intervención ha sido un éxito."
 the_financial_crisis_ast: "La crisis financiera"
 the_financial_crisis_ast_desc: "Fue alimentado por préstamos depredadores para hipotecas subprime y una falta de regulación, la burbuja de vivienda más grande en la historia de los Estados Unidos ha saltado, y el resto del mundo se deja sosteniendo su propia parte de la bolsa."
 tfc_fixing_tt: "§HLa economía mejorará.§!"
 tfc_fixing_2_tt: "Más §2Las decisiones§! estarán disponibles en la pestaña Política Decisiones para combatir la crisis."
 tampa_ast: "El Tampa Affair"
 focus_tree_has_changed_ast_tt: "§HEl árbol de enfoque ha cambiado§!"
 infrastructure_investment_act: "Ley de inversiones en infraestructura"
 incentivise_small_business_loans: "Incentivar pequeños préstamos empresariales"
 increase_unemployment_payments: "Aumentar los pagos por desempleo"
 aus_rus_trade_deal: "Ofrezca a los rusos un trato comercial"
