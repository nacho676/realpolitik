 the_roulettes_tt: "Una opción para recorrer los Roulettes estará disponible en la pestaña §2Militar Decisiones§!."
 john_howard_desc: "John Howard es un bastión final de los viejos liberales. Un estudiante de Robert Menzies, y un suscriptor al surgimiento del centro-derecha, la política de Howard ha impulsado el partido hacia la clase media. Priorizar la libertad individual, la propiedad de los hogares y la libre empresa para frenar la marea del sindicalismo creciente y traer al partido de vuelta desde una década de irrelevancia. \n\nUn abogado comercial antes de unirse al Partido Liberal, Howard subió la escalera del presidente de los Jóvenes Liberales para convertirse finalmente en miembro de Bennelong en 1974. Llevarlo al mundo de la política parlamentaria. No pasó mucho tiempo antes de que el gobierno de Fraser lo atrapara al año siguiente y fuera nombrado Ministro de Asuntos Empresarios y Consumidores. \n\nLa falta de problemas de Howard disparando a las filas y la creciente experiencia en asuntos económicos le hizo el Tesorero más joven en casi 75 años. Un promotor de los mercados más libres, sus esfuerzos por reformar el sistema económico envejecido se vieron sofocados por una economía debilitadora, con la recesión de los años 80 que dejó fuera del poder a los liberales. \n\nSu posición en el partido cambiaría durante la próxima década, que podría describirse fácilmente como una serie de golpes, dobles golpes y ofertas electorales fallidas por Howard. Finalmente, la oportunidad de Howard llegó en 1996, ganando en un deslizamiento contra el titular Paul Keating bajo la promesa de la campaña de disminuir el déficit presupuestario y sacar a Australia de su caída económica. Una promesa que sigue siendo peor."
 sydney_declaration_idea_ast: "La Declaración de Sydney"
 AST_MOD_MILLENNIUM_DAWN_DESC: "A medida que el siglo gira, Australia ha visto sus primeros signos de prosperidad económica desde los años 80. Con el Primer Ministro John Howard al frente, un líder conocido por su política económica progresista y popularidad mediadora, el país ya ha sufrido cambios significativos en un corto período de tiempo. Ahora de pie en un umbral cultural, con los Juegos Olímpicos de Sydney que suben, Australia está preparada para la grandeza, si se guía por una mano firme. \n\nA pesar del progreso, el descontento está creciendo. Años de abandono por parte del gobierno para enmendar el sufrimiento de las comunidades indígenas se han esforzado, y la indignación por las reformas estancadas sigue extendiéndose. La dominación de la industria de recursos también ha aumentado hasta el punto en que la economía australiana limita con convertirse en un petro-estado, dejando a la nación en un estado muy precario."
 mining_industrialists_ast: "Mineros industriales"
 mining_industrialists_ast_desc: "Una mano invisible se ha fusionado en la política australiana y sus industrias desde hace décadas. La legislación contra ellos siempre parece ponerse seca, y la dirección de nuestra economía sólo ha tenido éxito si favorece a los conglomerados mineros. Ya sea a través del lobby o los medios de comunicación, eventualmente siempre salen arriba."
