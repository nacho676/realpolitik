 the_great_australia_act: "§2La Ley de la Gran Australia§!"
 the_great_australia_act_desc: "Tal vez el mayor programa de reforma social en la historia de nuestro país. Un esfuerzo masivo para mejorar la igualdad de Australia y eliminar a millones de personas de la pobreza. Con una amplia cobertura de la capacidad social, una revisión de la elegibilidad y la escala de cobertura, un aumento de los pagos de apoyo y varios programas para ayudar a los australianos desfavorecidos avanzan."
