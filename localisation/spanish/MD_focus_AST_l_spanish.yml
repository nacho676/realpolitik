 reduced_interstate_regulation_ast: "§2Reglamentación interestatal reducida§!"
 paid_parental_scheme_ast: "Plan parental remunerado"
 paid_parental_scheme_ast_2: "Plan de pagos parentales"
 paid_parental_scheme_ast_desc: "Da derecho a nuevos padres hasta 26 semanas de licencia pagada. Permitirles tomar tiempo libre del trabajo para cuidar mejor a sus recién nacidos, o niños adoptados, y fomentar una población creciente."
 paid_parental_scheme_ast_2_desc: "Una amalgama de nuestros planes de apoyo parental, reemplazando el antiguo Bono de Bebé con pagos financieros para ayudar a los nuevos padres. También da derecho a nuevos padres de hasta 26 semanas de licencia pagada, y una vez que se cancelan los pagos para cuidar mejor a sus recién nacidos, o niños adoptados, y alentar a una población en crecimiento."
 social_capitalism_ast: "Capitalismo social"
 social_capitalism_ast_desc: "Nuestro enfoque para la gestión de la economía ha venido con algunos beneficios, y algunas desventajas menores. Podemos influir más directamente en nuestra economía y asegurarnos de que se mantenga alineada con el beneficio de nuestros ciudadanos mediante la utilización de regulación y gestión directa. A medida que trabajemos en la aplicación del enfoque, nuestros métodos se perfeccionarán."
 building_the_education_revolution_ast: "§GEdificio de la revolución educativa§!"
 a_new_era_ast: "Una nueva era"
 a_new_era_ast_desc: "Nuestra nación ha entrado en una nueva era de igualdad. A través del trabajo constante de los muchos, el futuro es ahora más brillante para todos los australianos..."
