 syrian_refugees_idea_ast: "Syrian Refugees Welcome"
 syrian_civil_war_refugees_ast: "Manejar a los refugiados sirios"
 syrian_refugees_event_ast.1.t: "Refugiados sirios"
 syrian_refugees_event_ast.1.d: "Con el estallido del conflicto en Siria, miles de refugiados buscan asilo en nuestra nación. Han pasado por los canales adecuados, y las circunstancias de las que huyen ciertamente los calificarían para entrar, pero la elección es finalmente nuestra. Dejarlos entrar podrían alentar más a pasar por los procesos adecuados, o podría abrir las puertas de inundación para otra crisis migratoria."
 syrian_refugees_event_ast.1.a: "Déjenlos entrar."
 syrian_refugees_event_ast.1.b: "It's not our problem."
 malaysianflight_event_ast.1.t: "The Disappearance of MH370"
 malaysianflight_event_ast.1.d: "Un avión internacional de pasajeros, operado por Malaysian Airlines, cayó de radares ayer mientras volaba sobre el Mar del Sur de China en una desaparición que ha dejado a las familias destrozadas, y la compañía aérea mudo fundido. \n\nEl vuelo, originalmente destinado a aterrizar en Beijing, desapareció misteriosamente de sensores hace tres días en ruta desde la Capital de Malasia. Si bien las autoridades siguen buscando cualquier destrozo, se ha dicho a los familiares de los pasajeros desaparecidos que se preparen para lo peor. 40 barcos y 34 aviones de nueve naciones diferentes están participando en la búsqueda, aunque funcionarios malasios han afirmado que todavía no tienen idea de lo que pasó mal."
 malaysianflight_event_ast.1.a: "Where did it go?"
 AST_keep_them_aligned: "Mantén a los alineados"
 AST_keep_them_aligned_desc: "El Partido Nacional ha estado tratando de causar un revuelo sobre nuestra política agrícola, o la falta de ella. Aunque estas tácticas de coacción podrían haber trabajado con las administraciones anteriores, no definirá cómo manejamos este gabinete. Liberaremos nuestros propios subsidios para los agricultores, en nuestros términos, y lo proclamaremos a los medios como nuestra victoria. \n\nMuestra si quieren jugar con nosotros, tiene que estar en nuestros términos."
 AST_privatise_the_care: "Privatizar el Cuidado"
 AST_privatise_the_care_desc: "El experimento de salud pública en Australia ha visto aumentar los costos más allá de niveles aceptables o incluso manejables, con apenas ninguna mejora para la atención. Al privatizar partes del programa, estamos acogiendo con beneplácito la perspectiva de ampliar la elección y aumentar la eficiencia para aquellos que buscan atención. Es un modelo probado, y estamos abiertos a adoptarlo."
 papua_affair.2.t: "Propuesta de caucho australiano"
 papua_affair.2.d: "El gobierno de Canberra ha propuesto un patrocinio estatal para varias plantaciones de caucho alrededor de Port Moresby. Según ellos, el acuerdo tiene como objetivo fortalecer y garantizar un comercio estable entre nosotros, y en particular nuliza algunos de nuestros aranceles. Los pequeños agricultores locales apoyan la solicitud sobre el fondo del aumento de las exportaciones, pero la propuesta podría hacernos más acordes con ellos en el futuro."
 papua_affair.2.a: "Es un buen negocio."
 papua_affair.2.b: "No hay trato."
 papua_affair.3.t: "Goma Aseguida"
 papua_affair.3.d: "Afortunadamente el Primer Ministro acordó intentar las conversaciones por segunda vez y ha apoyado nuestra propuesta. Los agricultores alrededor de Port Moresby disfrutarán de una demanda creciente y algunos subsidios generosos, mientras que recibimos un flujo constante de caucho para nuestras industrias en crecimiento. Toda la región debería beneficiarse de este acuerdo."
 papua_affair.3.a: "Otro Trato Sucesivo."
 papua_affair.4.t: "No Reply"
 papua_affair.4.d: "Lamentablemente, la delegación de Papua Nueva Guinea no está abierta a nuestras conversaciones ahora mismo. O eso o han olvidado cómo contestar el teléfono. Es un resultado decepcionante, pero mientras tanto podemos expandir nuestra búsqueda por el caucho más localmente."
 papua_affair.4.a: "No puedes ganarlos a todos."
