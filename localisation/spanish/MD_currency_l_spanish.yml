l_spanish:
 reserve_currency: "Política de reserva"
 reserve_currency_desc: "La base monetaria de las reservas monetarias y la deuda internacional de esta nación. Los países que se adhieren a una importante moneda de reserva obtienen acceso a sus redes de liquidez y a la infraestructura de asentamientos, mientras que las naciones que mantienen reservas nacionales conservan plena soberanía monetaria al costo del acceso internacional al crédito."
 us_dollar: "[1182.owner.GetAdjective] Dólar"
 us_dollar_desc: "La moneda de reserva mundial dominante. La retención de las reservas en dólares proporciona liquidez y acceso inigualables a los mercados internacionales de crédito, pero deja al país expuesto a costos de deuda nominados por dólar que aumentan cuando la moneda nacional se debilita."
 euro: "Euro"
 euro_desc: "La moneda de la Unión Europea, la segunda moneda de reserva más cotizada del mundo. Disponible para los Estados miembros de la UE, el euro proporciona estabilidad monetaria regional y acceso preferencial a los mercados de capitales europeos."
 chinese_yuan: "[547.owner.GetAdjective] Yuan"
 chinese_yuan_desc: "El renminbi, la moneda nacional de China, es un activo emergente de reserva promovido por Beijing como una alternativa al dominio del dólar. Los socios comerciales dentro de la órbita económica china se benefician de su creciente red de asentamientos."
 russia_rouble: "[652.owner.GetAdjective] Rouble"
 russia_rouble_desc: "La moneda de la Federación de Rusia, utilizada en la Unión Económica Eurasia y entre los socios comerciales post-soviéticos. Mantener las reservas de rublo integra un país en los sistemas de pago alternativos de Rusia y el marco de liquidación de energía."
 japanese_yen: "Yen [615.owner.GetAdjective]"
 japanese_yen_desc: "La moneda de Japón y la tercera divisa más cotizada del mundo. Los países de la órbita económica del Japón se benefician de sus redes de asentamiento establecidas y de la relativa estabilidad del yen, aunque su adopción de reservas fuera del Asia oriental sigue siendo limitada."
 british_pound: "[13.owner.GetAdjective] Pound"
 british_pound_desc: "La moneda de reserva más antigua todavía en uso internacional activo. La libra apoya los flujos comerciales y financieros en todo el Commonwealth y mantiene una posición significativa en las reservas globales de divisas, ofreciendo a los países alineados con el acceso estable del Reino Unido a los mercados de capital profundo de Londres."
 swiss_frank: "[74.owner.GetAdjective] Franc"
 swiss_frank_desc: "La moneda de Suiza, reconocida mundialmente como un activo seguro. Aunque raramente se adopta como reserva formal por otras naciones, la estricta disciplina monetaria del franco y la neutralidad política de Suiza hacen que sea únicamente resistente a las crisis monetarias y los choques externos."
 no_foreign_reserve: "Reserva nacional"
 no_foreign_reserve_desc: "Esta nación posee sus reservas en moneda nacional más que una norma extranjera. Retiene la plena soberanía monetaria y se aísla de las conmociones externas del tipo de cambio, pero renuncia al acceso a las redes de liquidez e instalaciones de crédito internacionales vinculadas a las principales monedas de reserva."
 currency_strength_modifier: "Fuerza de moneda"
 reserve_roi_bonus: "Reserva Moneda ROI"
 reserve_roi_bonus_desc: "Regreso adicional a la inversión de tener una fuerte moneda de reserva extranjera. Escala mensualmente con el tamaño de la red monetaria y de adopción del emisor. Una economía emisor debilitadora reduce este bono."
 reserve_trade_bonus: "Ajuste del comercio de divisas"
 reserve_trade_bonus_desc: "Bono de opinión comercial pequeño de operar dentro del mismo bloque de divisas. Refleja las relaciones comerciales preferenciales y la infraestructura de pago compartida entre naciones utilizando la misma moneda de reserva."
 seigniorage_income_modifier: "Ingresos por separación"
 monetary_policy_decisions: "Política monetaria"
 currency_backing: "Moneda Respaldo"
 currency_backing_desc: "El estándar de activos subyacente a la moneda nacional. Las normas relativas al dinero duro vinculan la moneda a una reserva de productos básicos, imponiendo disciplina pero limitando la flexibilidad monetaria. Los sistemas fiat permiten la plena soberanía monetaria a costa de un mayor riesgo de inflación."
 gold_standard_back: "Estándar de oro"
 gold_standard_back_desc: "La moneda nacional está etiquetada y canjeable en oro a un ritmo fijo. La expansión monetaria se ve limitada por reservas físicas de oro, inculcando confianza a largo plazo pero restringiendo la capacidad del gobierno para responder a crisis económicas."
 silver_standard: "Plata estándar"
 silver_standard_desc: "La moneda nacional está respaldada por reservas de plata a una tasa de conversión fija. Menos restrictivo que una mina de oro, el estándar de plata proporciona un grado de disciplina de los productos básicos al tiempo que permite una flexibilidad monetaria modestamente mayor."
 bi_metal_standard: "Estándar bimetálico"
 bi_metal_standard_desc: "La moneda está respaldada por oro y plata en los ratios de cambio fijo. Históricamente adoptado para ampliar la base monetaria, esta disciplina estándar equilibra la materia prima con mayor flexibilidad de suministro que una peluca pura monometálmica."
 no_currency_backing: "Moneda de Fiat"
 no_currency_backing_desc: "La moneda está respaldada únicamente por la autoridad y la solvencia del gobierno emisor. Sin limitaciones de los productos básicos, la política monetaria es plenamente flexible y permite una respuesta rápida a las crisis pero aumenta la susceptibilidad a la presión inflacionaria."
 gulden: "[46.owner.GetAdjective] Guilder"
 gulden_desc: "La moneda histórica de los Países Bajos, reintroducida después de salir de la eurozona. Respaldado por una estricta disciplina monetaria y un gran superávit comercial, el florín otorga plena soberanía monetaria y aísla a la economía de las conmociones externas, aunque previene la profunda liquidez de los principales bloques de reserva y rara vez se mantiene en el extranjero."
