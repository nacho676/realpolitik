l_spanish:
 switzerland_focus: "Árbol de Enfoque de Suiza"
 SWI_the_mountain_fortress: "La Fortaleza en la Montaña"
 SWI_the_mountain_fortress_desc: "La defensa más eficiente que poseemos es nuestras montañas. Debemos construir estos si queremos mantener el borde defensivo."
 SWI_guns_for_the_population: "Armas para la Población"
 SWI_guns_for_the_population_desc: "Una nación que está rodeada por naciones más fuertes debe tener una población siempre lista para proteger sus hogares."
 SWI_zurich_industrial_project: "Proyecto Industrial de Zúrich"
 SWI_zurich_industrial_project_desc: "Si queremos competir con nuestros vecinos, debemos tener un sector industrial sólido."
 SWI_strengthen_the_secret_services: "Fortalecer los Servicios Secretos"
 SWI_strengthen_the_secret_services_desc: "Los servicios secretos pueden hacer mucho para descubrir amenazas tanto externas como internas en nuestra nación."
 SWI_military_investments_1: "Programa de armas I"
 SWI_military_investments_1_desc: "Financiar el primer tramo del Programa anual de Armamentos puesto ante el Parlamento, convirtiendo un presupuesto de defensa sostenido en nueva capacidad industrial."
 SWI_geneva_industrial_project: "Proyecto Industrial de Ginebra"
 SWI_geneva_industrial_project_desc: "Ginebra siempre podría utilizar más empleos de fábrica. Deberíamos reformar completamente la zona."
 SWI_secure_the_swiss_borders: "Asegurar las Fronteras Suizas"
 SWI_secure_the_swiss_borders_desc: "Comenzaremos a establecer vastas redes de patrullas y puntos de control en las fronteras para asegurarnos de que nadie pueda entrar o salir sin que lo sepamos."
 SWI_italian_forts: "Fortalezas Italianas"
 SWI_italian_forts_desc: "Siempre debemos estar preparados para un ataque de nuestros vecinos del sur."
 SWI_german_forts: "Fortalezas Alemanas"
 SWI_german_forts_desc: "Llegamos demasiado cerca para la comodidad de la guerra con Alemania durante WW2. No se puede permitir que nos quiten de guardia si la agresión alemana vuelve a aumentar."
 SWI_french_forts: "Fortalezas Francesas"
 SWI_french_forts_desc: "No es como si Francia no nos hubiera invadido antes. No podemos permitir que nos abrumen como lo hicieron siglos atrás. Estaremos preparados, por si acaso."
 SWI_military_investments_2: "Programa de armas II"
 SWI_military_investments_2_desc: "Llevar adelante el Programa de Armamentos con una segunda oleada de adquisiciones, habiendo demostrado que la inversión constante produce una industria de defensa autosuficiente."
 SWI_the_cern_project: "El Proyecto CERN"
 SWI_the_cern_project_desc: "La investigación nuclear es el camino del futuro. Deberíamos comenzar estudios exhaustivos en este campo."
 SWI_the_large_hadron_collider: "Paul Scherrer Institute"
 SWI_the_large_hadron_collider_desc: "El Instituto Paul Scherrer de Villigen es el centro de investigación más grande de Suiza, aceleradores de partículas y fuentes de neutrones con profunda experiencia en materiales reactores y seguridad nuclear. Su trabajo ancla el programa nuclear civil de la Confederación."
 SWI_construct_power_plants: "Plantas de energía reservadas"
 SWI_construct_power_plants_desc: "La energía hidroeléctrica alpina nos lleva a lo largo de la mayor parte del año, pero un invierno frío y seco puede dejar la cuadrícula corta. Plantas con gas de reserva como la de Birr dan a la Confederación una reserva para volver a caer cuando las importaciones se agotan."
 switzerland.2.t: "Fin del Sistema Político Suizo"
 switzerland.2.d: "El sistema de democracia directa de Suiza, marcado desde hace mucho tiempo por un inusual grado de participación popular en el gobierno a través de frecuentes referéndums, está siendo destruido.\n\nEl líder suizo [SWI.GetLeader] ha anunciado que estas «distracciones de la vida pública» y «Referencias innecesarias» dejarían de tener lugar."
 switzerland.2.o1: "¡Buen riddance!"
 switzerland.2.o2: "Qué pena."
 switzerland.2.o3: "Lo que sea."
 switzerland_news.1.t: "Suiza se une a la ONU"
 switzerland_news.1.d: "Originalmente, el gobierno suizo se había negado a unirse a las Naciones Unidas después del fin de la Segunda Guerra Mundial, señalando la continua dedicación del país a su propia neutralidad, incluso cuando Ginebra acogió la Oficina de las Naciones Unidas, principal sede europea de la organización.\n\nAhora, después de un referéndum público sobre el asunto, el Gobierno suizo ha anunciado que el país avanzaría para abandonar su puesto como espectador y ahora se sumaría a la organización como miembro completo."
 switzerland_news.1.o1: "¡Ya era hora, Suiza!"
 switzerland_news.1.o3: "¿Realmente es tan importante?"
 SWI_join_un: "Nuevo miembro de la ONU"
 swiss_political_system: "Sistema político de Suiza"
 swiss_political_system_desc: "Suiza tiene un sistema político muy singular y es el único país del mundo que puede llamarse con razón \"democracia semidirecta\". Los ciudadanos pueden cambiar la Constitución por referéndum, pueden vetar leyes por referéndum, pueden incluso aprobar leyes por referéndum.\nSin embargo, esto tiene implicaciones para los políticos: Como el pueblo hace la política de cualquier manera, el sistema suizo de coaliciones tiene que incluir el mayor número posible de fuerzas. Los cuatro grandes partidos de Suiza, la UDC, el FDP, el PDC y el PS, están constantemente juntos en el gobierno, lo que hace que las elecciones nacionales en Suiza sean más o menos inútiles, ya que el pueblo no gobierna a través de sus representantes, sino mediante referendos."
 SWI_swiss_neutrality_desc: "§YReglas especiales:§!\n\n§Y§! §RCANNOT§! §Y ¡declaramos guerra contra otros países!§!\n--------------\nLos suizos son conocidos por todo el mundo para ser neutrales. Desde su fundación como república, el país no ha participado en ningún tipo de conflicto ofensivo y ha permanecido neutral durante ambas guerras mundiales.\n--------------\nEste espíritu nacional puede ser §RRemovido§! completando los §H Cambios radicales§! o el §HAbierto§! Enfoque."
 SWI_Expanding_nuclear_research: "Ampliar la investigación nuclear"
 SWI_expand_swiss_nuclear_plants: "Expansión de la flota nuclear"
 SWI_expand_swiss_nuclear_plants_desc: "Beznau, Gösgen y Leibstadt todavía satisfacen la demanda interna, pero el margen está disminuyendo. La ampliación de la capacidad del reactor ahora garantizaría la independencia energética suiza para una generación."
 SWI_research_and_development: "Armasuisse ciencia y tecnología"
 SWI_research_and_development_desc: "Armasuisse S+T es el centro tecnológico del Departamento de Defensa, uniendo sensores, comunicaciones, seguridad cibernética e investigación de materiales. Al sostener una base tecnológica pertinente para la seguridad en el país, Suiza minimiza su dependencia de los proveedores extranjeros en crisis."
 SWI_asd_gruppe: "ETH programa de investigación de dominios"
 SWI_asd_gruppe_desc: "Bind armasuisse al ETH Domain, ETH Zurich y EPFL, bajo un programa conjunto de seguridad del Programa de Investigación. Los francos federales y el talento académico se agrupan para convertir la investigación fronteriza en capacidad de defensa sobre el terreno."
 SWI_small_arms_development: "Desarrollo de las armas de infantería"
 SWI_small_arms_development_desc: "Modernizar el sucesor del rifle de servicio Stgw 90 (SG 550) y sus ópticas, aprovechando la experiencia SIG y B&T. Un ejército de milicias vive o muere por la confiabilidad del arma en las manos de cada soldado ciudadano."
 SWI_sig_ag_research_teams: "Equipos suizos de investigación de armas"
 SWI_sig_ag_research_teams_desc: "Prepara equipos de diseño dedicados dentro del linaje SIG de armas pequeñas en Neuhausen. Décadas de fabricación suiza de precisión están dirigidas a la próxima generación de armas individuales y escuadradas."
 SWI_precision_launch_platforms: "Sistemas antitabón guiados"
 SWI_precision_launch_platforms_desc: "Desarrollar sistemas antitanque guiados portátiles para dar a los granadiers desmontados un golpe decisivo contra la armadura en el terreno cercano de la península alpina."
 SWI_support_platforms_research: "Sistemas Integrados de Mando"
 SWI_support_platforms_research_desc: "Avance de la red de gestión de batallas Heer de la FIS para que los comandantes compartan una imagen táctica común en tiempo real. El mando, el control y las comunicaciones suizas dan derecho a la milicia dispersa en una sola fuerza."
 SWI_mass_produced_firearms: "Munición y producción de armas pequeñas"
 SWI_mass_produced_firearms_desc: "La producción de municiones domésticas y armas pequeñas a través de SwissP Defence (antes RUAG Ammotec). Los arsenales nacionales garantizados mantienen a la milicia armada sin depender de las importaciones."
 SWI_armored_vehicles_study: "Blindaje Programa de vehículos"
 SWI_armored_vehicles_study_desc: "Coordinar la industria suiza de vehículos blindados alrededor de las familias GDELS-Mowag Piranha y Eagle, la columna vertebral con ruedas de las brigadas mecanizadas."
 SWI_airframes_study: "Programa de Aeronáutica"
 SWI_airframes_study_desc: "Consolidar la experiencia de aeronáutica suiza en todo Pilatus en Stans y RUAG Aviation en Emmen, desde marcos de entrenamiento hasta mantenimiento y estructuras de combate aéreo."
 SWI_mbt_concept: "Leopard 2 Modernization"
 SWI_mbt_concept_desc: "Actualizar la flota Pz 87 Leopard 2 con paquetes de control de incendios, protección y movilidad dirigidos por RUAG para mantener el tanque de batalla principal relevante en las próximas décadas."
 SWI_spart_systems: "Artillería autopropulsada"
 SWI_spart_systems_desc: "Ampliar el alcance y la precisión del M109 (Pz Hb) autopropulsado howitzer a través del programa de actualización KAWEST, entregando fuegos sensibles en todo terreno montañoso."
 SWI_spaa_systems: "Defensa de aire móvil"
 SWI_spaa_systems_desc: "Campo un vehículo móvil de defensa aérea de corto alcance construido en el sistema de defensa aérea Rheinmetall Skyranger 35mm, protegiendo las fuerzas de maniobra de aviones y drones"
 SWI_production_line_innovations: "Líneas de producción automatizadas"
 SWI_production_line_innovations_desc: "Retool RUAG y Mowag salas de montaje con automatización moderna, elevando la producción y liberando escasa mano de obra calificada para trabajos de mayor valor."
 SWI_import_missile_tech: "Integración de misiles guiados"
 SWI_import_missile_tech_desc: "Adquirir e integrar misiles modernos de aire a aire y superficie a aire, construyendo el know-how nacional para sostenerlos y adaptarlos en plataformas suizas."
 SWI_helicopter_research: "Programa Rotary-Wing"
 SWI_helicopter_research_desc: "Sostengan y actualicen las flotas Super Puma / Cougar y EC635 a través de la aviación RUAG, los caballos de trabajo del transporte suizo, enlace y rescate de montaña."
 SWI_air_cavalry_armament: "Armamento de la Caballería Aérea"
 SWI_air_cavalry_armament_desc: "Armen la flota de Super Puma y escriban la doctrina de Airmobile para ir con ella, convirtiendo a los escuadrones de transporte en un brazo de maniobra que la milicia puede llamar."
 SWI_gunship_development: "Desarrollo de armas"
 SWI_gunship_development_desc: "Las variantes de rotación armada de campo para un apoyo cercano y un reconocimiento armado, más barato para comprar y mantener que una flota de helicópteros de ataque dedicada."
 SWI_revise_isolation_strategy: "Beyond the Réduit"
 SWI_revise_isolation_strategy_desc: "Pasar más allá del Réduit Alpino estático hacia una moderna defensa de área dinámica, coincidiendo con las reformas de Desarrollo Adicional del Ejército (WEA) a un cuadro de amenaza cambiado."
 SWI_log_tunnel_network: "Depósitos de túnel alpino"
 SWI_log_tunnel_network_desc: "Explotar la red oculta suiza de depósitos y túneles cavernosos aburridos en las montañas, almacenando municiones y combustible donde ningún ataque aéreo puede llegar a ellos."
 SWI_domestic_res_output: "Suministro económico nacional"
 SWI_domestic_res_output_desc: "Fortalecer el wirtschaftliche Landesversorgung, el marco legal que mantiene la energía, los alimentos y los bienes críticos fluyendo a la nación en una emergencia."
 SWI_strat_supply_reserves: "Reservas estratégicas obligatorias"
 SWI_strat_supply_reserves_desc: "Fortalecer el sistema Pflichtlager de existencias obligatorias, con meses de combustible, alimentos y medicamentos en reserva contra el bloqueo o la crisis."
 SWI_environmental_adaptation: "Doctrina de guerra alpina"
 SWI_environmental_adaptation_desc: "Entrenar y equipar a formaciones especializadas de montaña para luchar y sobrevivir en condiciones de invierno de alta altitud, convirtiendo el terreno en un arma."
 SWI_repair_decaying_forts: "Regreso a las fortalezas alpinas"
 SWI_repair_decaying_forts_desc: "Reactivete select artillery forts and hardened positions decommissioned under the Army 95 and Army XXI reforms, restaurando profundidad a las defensas de la montaña"
 SWI_graubunden_gold_silver: "Extracción minera alpina"
 SWI_graubunden_gold_silver_desc: "Reabiertos minerales en los Alpes Graubünden para asegurar un truco doméstico de materiales estratégicos para la industria armamentística."
 SWI_graubunden_iron_mines: "Minería de mineral alpino"
 SWI_graubunden_iron_mines_desc: "Explotar mineral de hierro alpino para alimentar un pequeño suministro de acero interno, reduciendo la dependencia de las materias primas importadas para la producción de guerra."
 SWI_mil_industry_expansion: "Ampliar la Base Industrial de Defensa"
 SWI_mil_industry_expansion_desc: "Aumentar la base industrial pertinente para la seguridad que la Ley de Materiel de Guerra obliga a Suiza a mantener. Una nación neutral debe ser capaz de armarse y sostenerse cuando se cierran las líneas de suministro extranjeras."
 SWI_sig_neuhausen_factory: "SIG Obras en Neuhausen"
 SWI_sig_neuhausen_factory_desc: "Ampliar las históricas obras SIG en Neuhausen am Rheinfall, el corazón de la fabricación suiza de armas pequeñas desde el siglo XIX."
 SWI_sig_graubunden_factory: "Producción de armas dispersas"
 SWI_sig_graubunden_factory_desc: "Dispersar pequeñas armas y la producción de municiones en los valles de Graubünden, endurecimiento de la base industrial contra una huelga fugaz en línea con la doctrina de dispersión suiza"
 SWI_infrastructural_advancement: "Infraestructura industrial"
 SWI_infrastructural_advancement_desc: "Actualizar los enlaces ferroviarios y viales alimentando las plantas de armas para que las materias primas y el equipo terminado se muevan de forma fiable incluso bajo tensión en tiempo de guerra."
 SWI_expand_gdels_mowag: "GDELS-Mowag Kreuzlingen"
 SWI_expand_gdels_mowag_desc: "Ampliar la planta GDELS-Mowag en Kreuzlingen, hogar de los vehículos blindados Piranha y Eagle que sirven al ejército suizo y exportan clientes por igual."
 SWI_new_factory_ruag: "Nueva RUAG Facility"
 SWI_new_factory_ruag_desc: "Abrir nueva capacidad RUAG MRO Suiza para la sobrecarga de aviones y sistemas terrestres. La política nacional se reserva la gran mayoría del mantenimiento militar suizo para el RUAG."
 SWI_cooperation_with_rheinmetall: "Cooperación con Rheinmetall"
 SWI_cooperation_with_rheinmetall_desc: "Estrechar los lazos con Rheinmetall Air Defence AG en Zurich, heredero de Oerlikon Contraves y su patrimonio de defensa aérea de 35 mm, Skyguard y Skyshield."
 SWI_cooperation_with_thales: "Cooperación con Thales"
 SWI_cooperation_with_thales_desc: "Compañero con Thales Suisse para sistemas de radar, optronía y mando y control, conectando a las fuerzas suizas en tecnología probada de sensores y redes."
 SWI_general_staff: "Personal de las Fuerzas Armadas"
 SWI_general_staff_desc: "Planificación y doctrina consolidadas bajo el personal de las fuerzas armadas (Führungsstab der Armee) bajo el Jefe de las Fuerzas Armadas, dar a la milicia un moderno mando conjunto"
 SWI_gemeinsames_ok: "Kommando Spezialkräfte"
 SWI_gemeinsames_ok_desc: "Construir el Comando de las Fuerzas Especiales, su destacamento del Reconocimiento del Ejército 10 y formaciones de granaderos, en una pequeña cabeza de lanza pero élite para el ejército miliciano."
 SWI_ausbildungskommando: "Kommando Ausbildung"
 SWI_ausbildungskommando_desc: "Reformar el Comando de Formación que dirige la contratación de escuelas y cursos de actualización. La fuerza del sistema suizo es toda una población que pasa por la formación disciplinada y estandarizada."
 SWI_airforce_modernization: "The Air2030 Program"
 SWI_airforce_modernization_desc: "Lanzamiento Air2030, la mayor adquisición de armas en la historia moderna suiza, para reemplazar el envejecimiento F-5 Tiger y F/A-18 Hornet y reconstruir la defensa aérea terrestre para una generación."
 SWI_general_air_defense: "Nuevo Fighter Aircraft Evaluation"
 SWI_general_air_defense_desc: "Abre la evaluación de New Fighter Aircraft (NKF), que enarbola a los candidatos seleccionados en Payerne y los mide contra las exigencias del espacio aéreo suizo denso y montañoso."
 SWI_import_eurofighters: "Oferta Eurofighter Typhoon"
 SWI_import_eurofighters_desc: "Evalua el Airbus y el Tifón Eurofighter BAE, un probado luchador europeo de superioridad aérea ofrecido con un paquete de participación industrial sustancial."
 SWI_import_rafale_fighters: "Oferta Dassault Rafale"
 SWI_import_rafale_fighters_desc: "Evaluar el Dassault Rafale, el versátil luchador omnirole de Francia, pesando sus ventajas de soberanía y compensando ofertas contra el campo."
 SWI_german_manufacturing: "Ataques industriales alemanes"
 SWI_german_manufacturing_desc: "Negociar la transferencia de tecnología y compensar el trabajo con el consorcio Eurofighter liderado por Alemania, canalizando los francos de adquisición a la industria suiza."
 SWI_french_manufacturing: "Frances Industrial Offsets"
 SWI_french_manufacturing_desc: "Negociar offset e industrial-participación se ocupa de Dassault y Thales, asegurando la construcción suiza a cambio de la compra de aeronaves."
 SWI_interception_practices: "Seleccione la F-35A Lightning II"
 SWI_interception_practices_desc: "Eligiendo el Lockheed Martin F-35A, cuya fusión de sensores y su sigilo superó la evaluación. La conciencia situacional de quinta generación transforma la interceptación suiza y alerta de reacción rápida."
 SWI_multi_role_specialization: "Integración multirole"
 SWI_multi_role_specialization_desc: "Integrar el F-35A a través de funciones de defensa aérea y huelga, armarlo con misiles AIM-120 y AIM-9X y municiones de precisión para una sola flota flexible."
 SWI_air_sup_adaptation: "Policía de aire redonda"
 SWI_air_sup_adaptation_desc: "Mantener una alerta de reacción rápida 24/7 sobre el espacio aéreo suizo, una capacidad que la Fuerza Aérea alcanzó en 2020 y que ahora sostiene con la nueva flota de cazas."
 SWI_acquire_transport_planes: "Transporte aéreo táctico"
 SWI_acquire_transport_planes_desc: "Ampliar la capacidad de transporte aéreo en torno a la flota de Super Puma y Cougar y aviones ligeros, moviendo tropas y suministros de socorro en todo el país y en el extranjero."
 SWI_airbase_expansion: "Modernización de la base aérea"
 SWI_airbase_expansion_desc: "Modernizar las principales bases operativas en Payerne, Meiringen y Emmen, incluyendo los refugios de cavernas de montaña que permiten a los jets montar un ataque subterráneo."
 SWI_nasams_batteries: "Patriota-Based Air Defense"
 SWI_nasams_batteries_desc: "Procure Patriot sistemas de superficie a aire de largo alcance bajo Air2030, dando a Suiza su primera verdadera defensa contra amenazas de alta altitud y enfrentamiento."
 SWI_florako: "Vigilancia aérea de FLORAKO"
 SWI_florako_desc: "Ejecute el sistema FLORAKO, la red integrada de radares y mandos que observa el espacio aéreo suizo alrededor del reloj y se asienta tanto a los combatientes como a la defensa aérea terrestre."
 SWI_Grune_idea: "Grüne Schweiz"
 SWI_Grune_idea_desc: "Para un Suiza más limpio, justo y más libre - donde la gente y el planeta vienen antes del beneficio!"
 SWI_universal_education_bonus_desc: "La inversión de Suiza en educación moderna ha alimentado la investigación sobre energía renovable y tecnología sostenible, allanando el camino para un futuro más limpio."
 SWI_environmental_reforms: "Reformas ambientales"
 SWI_environmental_reforms_desc: "Las leyes ambientales amplias tienen por objeto reducir las emisiones, proteger los recursos naturales y pasar la economía hacia la sostenibilidad."
 SWI_limit_industry: "Desarrollo industrial limitado"
 SWI_limit_industry_desc: "La expansión industrial se limita a proteger el medio ambiente de Suiza, negociando un rápido crecimiento para la estabilidad ecológica a largo plazo."
 SWI_eco_tourism: "Ecoturismo"
 SWI_eco_tourism_desc: "La promoción de viajes ecológicos trae nueva vida a las zonas rurales, preservando los paisajes prísticos de Suiza."
 SWI_national_parks: "Parques Nacionales"
 SWI_national_parks_desc: "Ampliar áreas protegidas salvaguarda la vida silvestre y fortalece la imagen global de Suiza como líder ambiental."
 SWI_completely_green: "¡Totalmente Verde!"
 SWI_completely_green_desc: "A través de una reforma e innovación implacable, Suiza logra la plena sostenibilidad ecológica, una nación impulsada enteramente por energía limpia."
 SWI_christian_values: "Valores cristianos"
 SWI_christian_values_desc: "Los principios cristianos tradicionales guían la política social y fortalecen el fundamento moral de la sociedad suiza."
 SWI_banned_abortion: "Aborto prohibido"
 SWI_banned_abortion_desc: "Las leyes estrictas prohíben el aborto, lo que refleja un renovado compromiso nacional con la ética social conservadora."
 SWI_ndb: "Swiss NDB"
 SWI_ndb_desc: "The Swiss NDB enhances intelligence operations, protecting national security and maintaining neutrality in an unstable world."
 SWI_traditionalist: "Traditionalism"
 SWI_traditionalist_desc: "El pensamiento tradicionalista forma la política, enfatizando la fe, la familia y el patrimonio nacional sobre las tendencias sociales modernas."
 SWI_army_fund: "Fondos del Ejército"
 SWI_army_fund_desc: "El aumento del gasto en defensa refuerza la disposición de los militares suizos y moderniza su infraestructura."
 SWI_ngo_funding: "NGO Financiación"
 SWI_ngo_funding_desc: "El Gobierno presta apoyo a las organizaciones no gubernamentales que trabajan en la ayuda humanitaria, la protección del medio ambiente y los derechos civiles."
 SWI_efficiency: "Eficiencia Suiza"
 SWI_efficiency_desc: "La eficiencia suiza se convierte en un elemento distintivo de la gobernanza: burocracia simplificada, reducción de los desechos y gestión precisa."
 SWI_fortress_switzerland: "Fortress Switzerland"
 SWI_fortress_switzerland_desc: "Principales fortificaciones y redes modernas de defensa aseguran que Suiza siga siendo impenetrable en cualquier conflicto."
 SWI_tax_code: "Código Fiscal simplificado"
 SWI_tax_code_desc: "Un sistema tributario simplificado reduce la evasión, atrae la inversión y apoya una economía equilibrada."
 SWI_foreign: "Sociedades extranjeras"
 SWI_foreign_desc: "Se alienta a las empresas extranjeras a invertir en Suiza, impulsando la innovación y la creación de empleos manteniendo al mismo tiempo el control nacional."
 SWI_agriculture: "Financiación agrícola"
 SWI_agriculture_desc: "Suiza invierte en la agricultura moderna y sostenible: apoyo a los agricultores locales, protección de las comunidades rurales y seguridad alimentaria para las generaciones futuras."
 SWI_fdp: "FDP"
 SWI_fdp_desc: "FDP es un partido liberal que aboga por mercados libres, emprendimiento individual, libertad económica y mínima intervención estatal."
 SWI_police_reforms: "Reformas policiales"
 SWI_police_reforms_desc: "Modernizar la aplicación de la ley, mejorar la eficiencia y aumentar la seguridad pública en todo el país."
 SWI_financial_deregulation: "Desregulación financiera"
 SWI_financial_deregulation_desc: "Reducir las restricciones bancarias y financieras para fomentar la inversión, el crecimiento y el dinamismo económico."
 SWI_precision: "Precisión suiza"
 SWI_precision_desc: "Fomentar la excelencia en la fabricación suiza, promover la industria de alta calidad y mantener la reputación de la nación por la precisión."
 SWI_fund_startups: "Startups tecnológicas"
 SWI_fund_startups_desc: "Proporcionar financiación y apoyo a las startups tecnológicas para impulsar la innovación y asegurar el futuro económico de Suiza."
 SWI_direct_democracy: "Reformas directas de la democracia"
 SWI_direct_democracy_desc: "Ampliar la participación ciudadana mediante referéndums e iniciativas, fortaleciendo el proceso democrático."
 SWI_progressive_tax: "Reformas Fiscales Progresivas"
 SWI_progressive_tax_desc: "Implementar un sistema tributario progresivo justo para financiar los servicios públicos y garantizar el equilibrio económico."
 SWI_pda: "Partei der Arbeit"
 SWI_pda_desc: "El Partido Comunista de Suiza, ganando una influencia significativa, aboga por cambios radicales en la estructura económica nacional, tratando de transformar la neutralidad suiza en un motor de solidaridad socialista."
 SWI_nationalize_industries: "Industrias clave nacionalizadas"
 SWI_nationalize_industries_desc: "El Consejo Federal inicia la toma de los principales sectores industriales, colocando los recursos vitales y la producción bajo control estatal para asegurar una distribución equitativa y un desarrollo planificado."
 SWI_socialist_countries_ties: "Ties con los países socialistas"
 SWI_socialist_countries_ties_desc: "Suiza busca activamente vínculos diplomáticos, culturales y políticos más estrechos con las naciones alineadas a la causa socialista, preparándose para pivotar su neutralidad de larga data hacia un movimiento mundial."
 SWI_socialist_agreements: "Acuerdos comerciales"
 SWI_socialist_agreements_desc: "Nuevos acuerdos comerciales a largo plazo se negocian con los estados socialistas, asegurando el acceso a materias primas cruciales y ampliando el mercado de productos de precisión suizos."
 SWI_higher_wages_idea: "Salarios superiores"
 SWI_higher_wages_idea_desc: "Los aumentos obligatorios en el salario mínimo y la supervisión federal de las estructuras salariales garantizan que los trabajadores suizos reciban un salario digno y sostenible, lo que aumenta el consumo doméstico."
 SWI_cheaper_house: "Vivienda barata"
 SWI_cheaper_house_desc: "Una iniciativa federal para subvencionar los precios de alquiler y subvencionar la construcción reduce drásticamente el costo de la vivienda privada, haciendo que la propiedad sea accesible a un segmento más amplio de la población."
 SWI_public_housing: "Vivienda pública"
 SWI_public_housing_desc: "La inversión masiva estatal en proyectos de vivienda pública de calidad proporciona viviendas modernas y asequibles, abordando la densidad urbana y la seguridad de la vivienda para la clase trabajadora."
 SWI_challenged_elite: "Desafiando a la élite bancaria"
 SWI_challenged_elite_desc: "Se publica un desafío directo a la élite bancaria secreta y poderosa. Se imponen nuevas regulaciones, fiscalizando las transferencias de capital privado e investigando la evasión tributaria para recargar los cofres federales."
 SWI_mind_federation: "Mente de la federación"
 SWI_mind_federation_desc: "Se establece una visión unificada para la nueva Federación, centrándose en el sistema político en eficiencia, colaboración e integración rápida de nuevos territorios y poblaciones."
 SWI_growing_federation: "La Federación de Rusia"
 SWI_growing_federation_desc: "Las reformas industriales y administrativas de la Federación están dobladas en un programa único y coordinado. El desarrollo de infraestructura, producción e investigación de fábrica avanza ahora bajo una bandera federal, estandarizando y alineando políticamente cada cantón recién adquirido."
 SWI_modernize_direct: "Democracia Directa Modernizada"
 SWI_modernize_direct_desc: "La democracia directa se ha modificado y modernizado, incorporando nuevas tecnologías y procesos simplificados para asegurar un rápido compromiso ciudadano y una rápida toma de decisiones a nivel nacional."
 SWI_council_states: "Consejo de los Estados"
 SWI_council_states_desc: "El Consejo de Estados se reorganiza para dar una mayor representación más justa a todos los cantones nuevos y establecidos, equilibrando el poder legislativo entre la población y la autonomía regional."
 SWI_fiscal_equalization: "Fondo de Nivelación Fiscal"
 SWI_fiscal_equalization_desc: "Se crea un nuevo fondo federal para redistribuir la riqueza de los cantones más ricos a los más pobres, asegurando el desarrollo uniforme y altos niveles de vida en toda la Federación."
 SWI_develop_federation: "La Federación de Rusia"
 SWI_develop_federation_desc: "Enfoque se coloca en proyectos de infraestructura y desarrollo a largo plazo en toda la Federación Alpina, especialmente en territorios recién adquiridos, para maximizar el potencial económico y la estabilidad política."
 switzerland.8.t: "Consulta Suiza para los Alpes"
 switzerland.8.desc: "Suiza solicita la transferencia inmediata de Savoy, Provenza y Niza a su control, citando vínculos históricos y cultura alpina compartida."
 switzerland.8.a: "Cede los estados"
 switzerland.8.b: "Rechazar"
 switzerland.9.t: "Reclamación de Alpes aceptada"
 switzerland.9.desc: "Francia ha acordado inesperadamente nuestra investigación, dejando toda la región alpina. ¡Una gran victoria diplomática!"
 switzerland.9.a: "¡Una Suiza nueva y más fuerte!"
 switzerland.10.t: "Reclamación de Alpes"
 switzerland.10.desc: "Nuestra investigación se encontró con una negativa dura. Francia no está dispuesta a negociar la integridad territorial."
 switzerland.10.a: "Los esfuerzos diplomáticos han fracasado."
 switzerland.11.t: "Consulta para Alpes Italianos"
 switzerland.11.desc: "El gobierno suizo ha emitido una investigación formal para la cesión de Aosta, Piemonte, Lombardia y Tirol Sur a la Confederación Suiza."
 switzerland.11.a: "Cede las provincias"
 switzerland.11.b: "Rechazar la investigación"
 switzerland.12.t: "Aceptación italiana"
 switzerland.12.desc: "Roma ha acordado sorprendentemente nuestras investigaciones territoriales, citando un deseo de paz regional. ¡Los Alpes están unificados!"
 switzerland.12.a: "¡Una República Alpina unificada!"
 switzerland.13.t: "Italiano Refusal"
 switzerland.13.desc: "Italia ha rechazado enérgicamente nuestras indagaciones, considerando la solicitud como un insulto a la soberanía nacional."
 switzerland.13.a: "Nuestra diplomacia ha fracasado."
 switzerland.14.t: "Solicitud de Tyrol austriaco"
 switzerland.14.desc: "Suiza, en su intento de unificar el territorio alpino, ha emitido una solicitud formal para la cesión de Tyrol. Si bien históricamente significativo, la aceptación podría impedir los conflictos futuros."
 switzerland.14.a: "Cede Tyrol a los suizos"
 switzerland.14.b: "Rechazar la reclamación suiza"
 switzerland.15.t: "Tyrol Acquired"
 switzerland.15.desc: "Viena (o el ocupante actual de Austria) ha aceptado nuestra solicitud, añadiendo la región vital de Tirol a la Confederación. Nuestros esfuerzos de unificación continúan con éxito."
 switzerland.15.a: "Una gran victoria diplomática."
 switzerland.16.t: "Rechazo de Tyrol"
 switzerland.16.desc: "Nuestra solicitud diplomática de Tyrol fue rechazada por completo. El actual propietario del Estado considera que la reclamación es un reto inaceptable para sus fronteras."
 switzerland.16.a: "Debemos esperar un momento mejor."
 switzerland_news.7.t: "La Federación Alpina"
 switzerland_news.7.d: "Tras una extensa maniobra diplomática y un movimiento popular en toda la región, Suiza ha consolidado formalmente el control sobre la histórica patria alpina. La nación ha cambiado oficialmente su nombre a 'La Federación de los Alpes' o 'Federación Alpina' para abreviar.\n\nEste cambio trascendental crea un estado federal poderoso y unificado que se extiende a través de la cordillera central europea, alterando fundamentalmente el equilibrio del poder en la región. El nuevo gobierno se ha comprometido a preservar la autonomía cultural y política de cada región que engloba."
 switzerland_news.7.a: "Redefinir la neutralidad desde 1516."
 switzerland_news.8.t: "Una nueva República: Suiza Votos para centralizar el poder"
 switzerland_news.8.d: "Por un estrecho margen, el pueblo suizo ha aprobado el referéndum constitucional para abandonar la estructura federal a favor de una república centralizada. El cambio, impulsado por el movimiento de la Nueva Era, promete una gobernanza simplificada y una identidad nacional cohesiva, pero viene al costo de la autonomía cantonal tradicional. La nueva República Suiza reemplaza oficialmente a la Confederación hoy, provocando tanto celebraciones como protestas en los antiguos cantones. La comunidad internacional vela de cerca por las implicaciones de este cambio radical en una de las naciones más estables de Europa."
 switzerland_news.8.a: "¡La Confederación está muerta!"
 SWI_suisse_politique: "Política suiza"
 SWI_suisse_politique_desc: "Establecer el marco para el árbol de enfoque nacional suizo y determinar la dirección política inicial de la Confederación."
 SWI_strengthening_the_federation: "Fortalecimiento de la Federación"
 SWI_strengthening_the_federation_desc: "Reforzar los vínculos entre los cantones y fortalecer la autoridad del gobierno central para garantizar la unidad nacional."
 SWI_dissolving_the_federation: "Disolver la Federación"
 SWI_dissolving_the_federation_desc: "El sistema federal es insostenible. Iniciar un proceso polémico para reestructurar el país, priorizando una sola República Suiza unificada."
 SWI_deepening_swiss_democracy: "Profundizar la democracia suiza"
 SWI_deepening_swiss_democracy_desc: "Ampliar el alcance de las herramientas democráticas directas, dando al pueblo más poder a través de los referendos e iniciativas para configurar la política nacional."
 SWI_panalpine_initiative: "Iniciativa Pan-Alpine"
 SWI_panalpine_initiative_desc: "Abrazar una política exterior más activa y un papel regional. Busque alinearse con las regiones alpinas de los estados vecinos o integrarlas."
 SWI_partei_der_arbeit: "Partei der Arbeit"
 SWI_partei_der_arbeit_desc: "Empoderar al partido obrero de izquierda para implementar una agenda socialista dirigida a la igualdad económica y a la propiedad colectiva."
 SWI_sp: "Partido Socialdemócrata (SP)"
 SWI_sp_desc: "Apoyar a los socialdemócratas en sus esfuerzos por reformar el sistema político hacia un mayor bienestar social y cooperación internacional."
 SWI_grune: "El Partido Verde (Grüne)"
 SWI_grune_desc: "Prestar apoyo político al Partido Verde para impulsar políticas amplias de protección ambiental y desarrollo sostenible."
 SWI_fdu: "Unión democrática federal (FDU)"
 SWI_fdu_desc: "Dar mayor influencia a la Unión Federal Democrática para defender los valores cristianos conservadores y evangélicos y la autonomía local."
 SWI_svp: "Partido Popular Suizo (SVP)"
 SWI_svp_desc: "Retrocede al Partido Popular Suizo en su impulso por estrictos controles de inmigración, conservadurismo fiscal y soberanía nacional."
 SWI_the_mind_of_the_federation: "La mente de la Federación"
 SWI_the_mind_of_the_federation_desc: "Cultivar una identidad nacional unificada y fortalecer la conciencia colectiva de la Confederación."
 SWI_proclaim_the_alp_federation: "Proclamar la Federación Alp"
 SWI_proclaim_the_alp_federation_desc: "Declarar la formación de una Federación Alpina unificada, consolidando todos los territorios alpinos compartidos bajo una nueva y poderosa entidad liderada por Suiza."
 SWI_alp_federation_coring_tt: "Estados propios de la Federación Alpina con al menos un 80% de cumplimiento se convierten en territorio central. En cambio, los Estados que están por debajo de ese umbral reclaman ganancias."
 SWI_strengthen_the_federation: "Fortalecer la Federación"
 SWI_strengthen_the_federation_desc: "Invertir en proyectos e instituciones nacionales clave para que el gobierno federal sea más robusto y resistente contra las presiones internas y externas."
 SWI_modernize_direct_democracy: "Modernizar la democracia directa"
 SWI_modernize_direct_democracy_desc: "Simplificar los procesos de petición y votación para la democracia directa, asegurando que el sistema siga siendo eficiente y relevante en la era moderna."
 SWI_empower_the_council_of_states: "Empoderar al Consejo de los Estados"
 SWI_empower_the_council_of_states_desc: "Aumentar el poder legislativo del Consejo de Estados para representar mejor los intereses y la soberanía de los cantones individuales."
 SWI_fiscal_equalization_fund: "Fondo de Nivelación Fiscal"
 SWI_fiscal_equalization_fund_desc: "Establecer un fondo permanente para redistribuir la riqueza federal, asegurando paridad financiera y estabilidad en todos los cantones, ricos y pobres."
 SWI_social_equality: "Igualdad social"
 SWI_social_equality_desc: "Aplicar políticas para disminuir la disparidad económica y promover la justicia social, en particular para las comunidades marginadas y los ciudadanos de bajos ingresos."
 SWI_workers_rights: "Derechos del trabajador"
 SWI_workers_rights_desc: "Aprobar legislación integral para garantizar salarios justos, condiciones de trabajo seguras y el derecho a organizarse para todos los trabajadores suizos."
 SWI_workers_rights_idea: "Derechos del trabajador"
 SWI_workers_rights_idea_desc: "Aprobar legislación integral para garantizar salarios justos, condiciones de trabajo seguras y el derecho a organizarse para todos los trabajadores suizos."
 SWI_cheaper_housing: "Vivienda más barata"
 SWI_cheaper_housing_desc: "Subvencionar y regular el mercado de la vivienda para garantizar una vivienda asequible está disponible para todos los ciudadanos de todo el país."
 SWI_expand_public_housing: "Ampliar la vivienda pública"
 SWI_expand_public_housing_desc: "Inicie un proyecto federal masivo para construir nuevas viviendas públicas de alta calidad en los principales centros urbanos."
 SWI_challenge_the_banking_elite: "Desafío de la Elite Bancaria"
 SWI_challenge_the_banking_elite_desc: "Promulgar normas estrictas e introducir nuevos impuestos dirigidos al poderoso y secreto sector bancario internacional."
 SWI_nationalize_key_industries: "Nacionalizar las industrias clave"
 SWI_nationalize_key_industries_desc: "Transfiera la propiedad de sectores vitales como energía, transporte y comunicación desde manos privadas al estado."
 SWI_end_banking_secrecy: "El secreto bancario final"
 SWI_end_banking_secrecy_desc: "Abolir la larga tradición del secreto bancario suizo, alineando el sistema financiero con las normas internacionales de transparencia."
 SWI_neutrality_pda: "Neutralidad (Sendero Parcial)"
 SWI_neutrality_pda_desc: "Reafirmar la política tradicional de neutralidad suiza, pero priorizar las reformas socialistas nacionales sobre los enredos extranjeros."
 SWI_strengthen_ties_with_socialist_countries: "Fortalecer las Ties con los Países Socialistas"
 SWI_strengthen_ties_with_socialist_countries_desc: "Forja relaciones diplomáticas y económicas más estrechas con el creciente bloque de las naciones socialistas y comunistas."
 SWI_strengthen_domestic_independence: "Fortalecimiento de la independencia nacional"
 SWI_strengthen_domestic_independence_desc: "Establecer políticas que promuevan la autosuficiencia en recursos e industria, protegiendo a la economía suiza de la volatilidad del mercado mundial."
 SWI_trade_agreements_with_socialist_states: "Acuerdos comerciales con los Estados socialistas"
 SWI_trade_agreements_with_socialist_states_desc: "Firme pactos comerciales exclusivos con naciones socialistas y no alineadas para diversificar los mercados de exportación suizos."
 SWI_direct_democracy_reforms: "Reformas directas de la democracia"
 SWI_direct_democracy_reforms_desc: "Introducir cambios técnicos y de procedimiento para que el proceso democrático sea más fluido y receptivo a las demandas ciudadanas."
 SWI_domestic_independence: "Independencia nacional"
 SWI_domestic_independence_desc: "Enfoque sobre maximizar la autonomía y soberanía suizas, rechazando interferencia de bloques regionales más grandes como la UE."
 SWI_move_closer_to_the_eu: "Más cerca de la UE"
 SWI_move_closer_to_the_eu_desc: "Trabajar para profundizar la integración de Suiza con el mercado único y las estructuras políticas de la Unión Europea."
 SWI_humanitarian_leadership: "El liderazgo humanitario"
 SWI_humanitarian_leadership_desc: "Reforzar el papel de Suiza como un faro global de ayuda, refugio y derecho internacional a través de la diplomacia y el aumento del gasto humanitario."
 SWI_national_health_service: "Servicio Nacional de Salud"
 SWI_national_health_service_desc: "Reimaginar el sistema de salud introduciendo un Servicio Nacional de Salud completamente financiado por el Estado para garantizar el acceso universal a la atención médica."
 SWI_expand_labour_union_power: "Ampliar poder de la Unión Laboral"
 SWI_expand_labour_union_power_desc: "Aprobar legislación que otorga significativamente más autoridad e influencia a los sindicatos sindicales organizados en la negociación colectiva y política industrial."
 SWI_progressive_tax_reform: "Reforma Fiscal Progresiva"
 SWI_progressive_tax_reform_desc: "Superar el código tributario para aumentar drásticamente las tasas de los más altos ingresos y corporaciones para financiar programas sociales."
 SWI_strengthen_parliamentary_socialism: "Fortalecimiento del Socialismo Parlamentario"
 SWI_strengthen_parliamentary_socialism_desc: "Trabajar en el marco democrático para aumentar gradualmente el poder del establecimiento político socialdemócrata."
 SWI_welfare_state_of_the_future: "Estado de bienestar del futuro"
 SWI_welfare_state_of_the_future_desc: "Pioneer un sistema de seguridad social de próxima generación, garantizando a todos los ciudadanos un ingreso básico digno y una protección social integral."
 SWI_invest_in_green_infrastructure: "Invertir en infraestructura verde"
 SWI_invest_in_green_infrastructure_desc: "Promulgar importantes fondos estatales para construir obras públicas sostenibles, incluidas redes de energía renovable y transporte ecológico."
 SWI_fund_ngos: "Organizaciones no gubernamentales"
 SWI_fund_ngos_desc: "Proporcionar subsidios y apoyo federales sustanciales a las organizaciones no gubernamentales ambientales y sociales para reforzar la sociedad civil."
 SWI_geneva_climate_diplomatic_hub: "Strengthening Geneva as a Climate Hub"
 SWI_geneva_climate_diplomatic_hub_desc: "Aprovechar la condición internacional de Ginebra para acoger grandes cumbres climáticas y negociaciones diplomáticas, aumentando el poder suave de Suiza."
 SWI_limit_industrial_expansion: "Limite la expansión industrial"
 SWI_limit_industrial_expansion_desc: "Promulgar moratorias y leyes estrictas de zonificación para frenar la expansión de la industria pesada y proteger la belleza natural del paisaje suizo."
 SWI_protect_the_alps: "Protege los Alpes"
 SWI_protect_the_alps_desc: "Designar los Alpes como zona de máxima protección ecológica, prohibiendo el desarrollo a gran escala o la extracción de recursos."
 SWI_renewable_energy_research: "Investigación de energía renovable"
 SWI_renewable_energy_research_desc: "Financiar avances científicos y tecnológicos en energía solar, hidroeléctrica y geotérmica para lograr la plena independencia energética nacional."
 SWI_centralization: "Centralización del poder"
 SWI_centralization_desc: "Cambiar la autoridad de los cantones al Gobierno Federal, consolidando el poder para una acción nacional rápida y decisiva."
 SWI_strengthen_the_cantons: "Fortalecer los cantones"
 SWI_strengthen_the_cantons_desc: "Reforzar la autonomía y los poderes tradicionales de los gobiernos cantonales, preservando el espíritu del federalismo."
 SWI_close_the_borders: "Cerrar las fronteras"
 SWI_close_the_borders_desc: "Implementar una política de cierre fronterizo absoluto para controlar la inmigración y proteger la identidad nacional suiza y el mercado laboral."
 SWI_ban_abortion: "Prohibición del aborto"
 SWI_ban_abortion_desc: "Promulgar legislación para prohibir completamente el aborto, alinear las leyes del país con principios morales conservadores."
 SWI_faith_welfare: "Bienestar basado en la fe"
 SWI_faith_welfare_desc: "Reestructurar la red de seguridad social para depender de organizaciones religiosas y caritativas privadas, reduciendo la participación del Estado."
 SWI_stricter_immigration: "Leyes de inmigración más estrictas"
 SWI_stricter_immigration_desc: "Introducir un sistema basado en puntos y cuotas para limitar severamente todas las formas de migración legal e ilegal al país."
 SWI_maintain_armed_neutrality: "Mantener la neutralidad armada"
 SWI_maintain_armed_neutrality_desc: "Mantener la tradición de larga data de la no alineación militar, garantizando al mismo tiempo una fuerza de defensa poderosa y lista."
 SWI_distance_from_eu: "Distancias de la UE"
 SWI_distance_from_eu_desc: "Iniciar el proceso de desacoplamiento de la política económica y política suiza de la influencia y las regulaciones de la Unión Europea."
 SWI_fund_ndb: "Fondo del BDN"
 SWI_fund_ndb_desc: "Incrementar la financiación del Servicio Nacional de Inteligencia (NDB) para mejorar las capacidades nacionales de seguridad, lucha contra el espojo y vigilancia."
 SWI_stop_un_training: "Stop UN Peacekeeper Training"
 SWI_stop_un_training_desc: "Poner fin a la polémica práctica de capacitar al personal extranjero de mantenimiento de la paz de las Naciones Unidas, haciendo hincapié en una postura militar puramente defensiva."
 SWI_traditionalist_propaganda: "Propaganda Tradicionalista"
 SWI_traditionalist_propaganda_desc: "Inicie una campaña nacional para promover valores conservadores y tradicionales suizos a través de los medios de comunicación y la educación patrocinados por el Estado."
 SWI_expand_army_fund: "Ampliar los fondos del ejército"
 SWI_expand_army_fund_desc: "Garantizar una nueva fuente permanente de ingresos federales dedicada exclusivamente a aumentar el presupuesto de las Fuerzas Armadas Suizas."
 SWI_promote_swiss_identity: "Promover la identidad suiza"
 SWI_promote_swiss_identity_desc: "Subvencionar instituciones culturales y lingüísticas para fomentar un sentido más fuerte y unificado del patriotismo suizo y la pertenencia nacional."
 SWI_skepticism_ngos: "Escepticismo sobre las ONG"
 SWI_skepticism_ngos_desc: "Investigar y restringir las actividades de las ONG extranjeras y nacionales, citando preocupaciones sobre su influencia en la soberanía nacional."
 SWI_expand_agriculture: "Ampliar la agricultura"
 SWI_expand_agriculture_desc: "Invertir en tecnologías y subsidios agrícolas modernos para aumentar significativamente la producción nacional de alimentos y la autosuficiencia nacional."
 SWI_national_efficiency: "Eficiencia nacional"
 SWI_national_efficiency_desc: "Introducir reformas burocráticas y administrativas en todas las agencias federales para reducir los desechos y aumentar la velocidad y eficacia del gobierno."
 SWI_isolationism: "Isolationism"
 SWI_isolationism_desc: "Adoptar una política de desprendimiento global completo, cierre de fronteras y mercados para eliminar toda injerencia extranjera en los asuntos suizos."
 SWI_armed_neutrality: "Neutralidad armada"
 SWI_armed_neutrality_desc: "Codificar formalmente una política exterior de defensa, asegurando que el ejército esté bien equipado para defender la independencia de la nación a toda costa."
 SWI_defend_secrecy: "Defender el secreto bancario"
 SWI_defend_secrecy_desc: "Se opone enérgicamente a toda presión internacional para desmantelar las leyes privadas del secreto bancario del país."
 SWI_attract_foreign_investors: "Atraer inversores extranjeros"
 SWI_attract_foreign_investors_desc: "Ofrecer nuevos incentivos, desgravaciones fiscales y garantías reglamentarias para alentar a las empresas internacionales a trasladarse a Suiza."
 SWI_market_liberalization: "Liberalización del mercado"
 SWI_market_liberalization_desc: "Desregulación de mercados e industrias nacionales para promover la libre competencia, innovación y crecimiento económico."
 SWI_keep_swiss_neutrality: "Mantener la Neutralidad Suiza"
 SWI_keep_swiss_neutrality_desc: "Mantener la interpretación tradicional y estricta del no intervencionismo, priorizando la estabilidad financiera sobre los enredos políticos."
 SWI_modernize_neutrality: "Modernizar la neutralidad"
 SWI_modernize_neutrality_desc: "Adaptar el concepto de neutralidad a un contexto moderno, permitiendo un mayor compromiso diplomático e intervención humanitaria en el extranjero."
 SWI_reduce_welfare: "Reducir el gasto de bienestar"
 SWI_reduce_welfare_desc: "Cortar los gastos federales en programas sociales y beneficios para reducir la deuda nacional y fomentar el ahorro privado."
 SWI_moderate_police_reforms: "Reformas de la policía moderadas"
 SWI_moderate_police_reforms_desc: "Realizar cambios graduales para aumentar la financiación policial, modernizar el equipo y mejorar las relaciones comunitarias."
 SWI_industrial_development: "Desarrollo industrial"
 SWI_industrial_development_desc: "Invertir fuertemente en la expansión del sector manufacturero nacional y construir nuevos complejos industriales en áreas estratégicas."
 SWI_swiss_precision: "Ingeniería de precisión suiza"
 SWI_swiss_precision_desc: "Enfoque Investigación e inversión nacional en fabricación, relojería y ingeniería mecánica especializada de alta tecnología."
 SWI_tech_startups: "Promover Tech Startups"
 SWI_tech_startups_desc: "Crear un ecosistema favorable de financiación, desgravaciones fiscales y programas de incubación para fomentar un creciente sector tecnológico nacional."
 SWI_free_trade: "Comercio libre"
 SWI_free_trade_desc: "Eliminar los aranceles y reducir las barreras comerciales para integrar plenamente la economía suiza en el sistema de comercio globalizado."
 SWI_radical_changes: "Cambios radicales"
 SWI_radical_changes_desc: "Una reevaluación nacional del sistema político, allanando el camino para los cambios revolucionarios y fundacionales de la Confederación."
 SWI_promote_left: "Promover la política de izquierdas"
 SWI_promote_left_desc: "Empezar una campaña para aumentar significativamente la popularidad e influencia de las ideologías comunista y socialista en toda la Confederación."
 SWI_workers_council: "Consejos de Trabajadores toman el poder"
 SWI_workers_council_desc: "Establecer formalmente los consejos obreros como órganos económicos y políticos supremos del estado, dando poder directo al proletariado."
 SWI_nationalize_banks: "Nacionalizar los Bancos"
 SWI_nationalize_banks_desc: "Aproveche el control del poderoso y secreto sector bancario de la nación, situándolo bajo la propiedad pública federal en beneficio de la gente."
 SWI_agricultural_collectivization: "Colectivización agrícola"
 SWI_agricultural_collectivization_desc: "Abolir la propiedad privada de la tierra y organizar todas las granjas en grandes empresas agrícolas colectivas estatales."
 SWI_workers_cooperatives: "Cooperativas de los Trabajadores"
 SWI_workers_cooperatives_desc: "Apoyar la formación de cooperativas de propiedad de los trabajadores y gestionadas como modelo dominante de producción, manteniendo el control económico descentralizado."
 SWI_militias_of_the_people: "Milicias del Pueblo"
 SWI_militias_of_the_people_desc: "Disolver el ejército permanente y reemplazarlo con una red descentralizada de milicias populares armadas, políticamente fiables, provenientes de la clase obrera."
 SWI_secret_police: "Policía secreta"
 SWI_secret_police_desc: "Establecer una fuerza policial secreta poderosa y omnipresente para vigilar la actividad contrarrevolucionaria y suprimir el disentimiento interno."
 SWI_denounce_eu: "Denunciar a la UE"
 SWI_denounce_eu_desc: "Condena formalmente a la Unión Europea como organización burguesa y retira cualquier cooperación o vínculo político suizo."
 SWI_suppress_party_enemies: "Supresión de enemigos del Partido"
 SWI_suppress_party_enemies_desc: "Utilice el pleno poder del Estado para eliminar y silenciar a todos los partidos políticos y organizaciones rivales."
 SWI_multilingual_worker_solidarity: "Solidaridad multilingüe del trabajador"
 SWI_multilingual_worker_solidarity_desc: "Destacar la identidad de clase común en las divisiones lingüísticas de la nación para forjar un proletariado unificado y multilingüe."
 SWI_peoples_tribune: "Tribuno Popular"
 SWI_peoples_tribune_desc: "Establezca la oficina del Tribuno Popular, un representante electo para actuar como una verificación popular sobre el poder del gobierno central."
 SWI_central_committee: "Comité Central"
 SWI_central_committee_desc: "Vest máxima autoridad política en un pequeño y poderoso Comité Central del Partido, asegurando la pureza ideológica y el mando centralizado."
 SWI_peoples_constitution: "La Constitución Popular"
 SWI_peoples_constitution_desc: "Borrar y promulgar una nueva constitución que consagra los derechos de la clase obrera y formaliza la estructura socialista del estado."
 SWI_national_charter: "La Carta Nacional"
 SWI_national_charter_desc: "Escribir una Carta Nacional para reemplazar la antigua constitución, declarando formalmente el compromiso del nuevo Estado con los principios nacionalistas y autoritarios."
 SWI_propaganda_machine: "Máquina Propaganda"
 SWI_propaganda_machine_desc: "Construir un sofisticado aparato de medios estatales para controlar el flujo de información y garantizar el cumplimiento ideológico entre la ciudadanía."
 SWI_economic_self_sufficiency: "Autosuficiencia económica"
 SWI_economic_self_sufficiency_desc: "Evitar toda la economía suiza hacia la autarquía, priorizar la producción nacional y eliminar la dependencia del comercio exterior."
 SWI_expel_foreign_companies: "Expelen compañías extranjeras"
 SWI_expel_foreign_companies_desc: "Forzar el cierre inmediato y la nacionalización de todas las empresas extranjeras que operan en suelo suizo."
 SWI_revive_the_nf: "Revive El Frente Nacional"
 SWI_revive_the_nf_desc: "Reestablezca el histórico Frente Nacional y faculte a sus líderes para defender un programa político radical, nacionalista y autoritario."
 SWI_fascism_idea: "Frente Nacional"
 SWI_fascism_idea_desc: "El Frente Nacional fue un partido de extrema derecha en Suiza que floreció durante los años 1930. En su punto culminante el grupo tenía hasta 9.000 miembros, según el Diccionario Histórico de Suiza, y pudo haber tenido una membresía de 25.000 miembros, según el Centro Simon Wiesenthal. El partido fue financiado por el Ministerio del Reich de Propaganda. Se convirtió en descompuesto en 1940 y fue prohibido por el Consejo Federal suizo en 1943."
 SWI_national_unity: "Unidad Nacional"
 SWI_national_unity_desc: "Reprime todas las divisiones internas y los conflictos ideológicos para forjar una sola voluntad nacional unificada bajo el nuevo régimen."
 SWI_leader_of_a_nation: "Un líder de una nación"
 SWI_leader_of_a_nation_desc: "Conceder nuevos poderes a una figura nacional carismática, transfiriendo la nación a un liderazgo fuerte y personalizado."
 SWI_militarize_society: "Militarizar la sociedad"
 SWI_militarize_society_desc: "Integrar los principios militares en la vida civil, hacer cumplir el servicio obligatorio y promover la disciplina y la obediencia en toda la nación."
 SWI_fascist_propaganda: "Fascista Propaganda"
 SWI_fascist_propaganda_desc: "Inicie una agresiva campaña mediática nacional para promover la ideología del régimen y demonizar a todos los enemigos percibidos del estado."
 SWI_censorship: "Censorship"
 SWI_censorship_desc: "Imponer el control total sobre todas las formas de medios, arte y producción intelectual para garantizar la absoluta conformidad ideológica."
 SWI_pan_alpine_identity: "Identidad pan-alpina"
 SWI_pan_alpine_identity_desc: "Declarar la existencia de un «pueblo alpino» común en Suiza y sus vecinos, sentando las bases ideológicas para la expansión."
 SWI_ban_radical_neutrals: "Ban Neutrals radicales"
 SWI_ban_radical_neutrals_desc: "Proscribe a todos los grupos políticos que abogan por la neutralidad absoluta y pasiva, etiquetandolos como impatrióticos y un peligro para el estado."
 SWI_german_superiority: "Superioridad alemana"
 SWI_german_superiority_desc: "Priorizar a la población de habla alemana y adoptar una política de alineación cultural y lingüística con Alemania."
 SWI_swiss_identity: "Identidad suiza"
 SWI_swiss_identity_desc: "Campeona una identidad suiza única, multiétnica y ferozmente independiente, distinta de todos los grandes poderes vecinos."
 SWI_alpine_destiny: "Destino alpino"
 SWI_alpine_destiny_desc: "Exigir la unificación de todos los territorios alpinos bajo la bandera suiza y preparar a los militares para la próxima guerra de unificación."
 SWI_one_party_state: "Un Estado Parte"
 SWI_one_party_state_desc: "Abolir todas las instituciones democráticas restantes y formalizar el monopolio político completo y permanente del partido gobernante."
 SWI_further_strengthen_the_federation: "Fortalecer aún más la Federación"
 SWI_further_strengthen_the_federation_desc: "Suiza es una nación basada en el compromiso entre cantones, culturas e idiomas. Al fortalecer aún más la estructura federal, podemos asegurar una mayor estabilidad, mejorar la coordinación entre los cantones y reforzar la unidad de la Confederación frente a las tensiones internas y las amenazas externas."
 SWI_higher_wages: "Salarios superiores"
 SWI_higher_wages_desc: "El aumento de los costos de vida y la creciente demanda económica requieren acción. Al fomentar los salarios más altos en sectores clave, podemos mejorar los niveles de vida, fortalecer el consumo interno y garantizar la estabilidad social a largo plazo."
 SWI_universal_education: "Educación universal"
 SWI_universal_education_desc: "La educación es la base de una nación fuerte y próspera. Al proporcionar acceso universal a la escolarización, podemos asegurar que todos los ciudadanos tengan las habilidades y conocimientos necesarios para contribuir al futuro de Suiza."
 SWI_fund_ngo: "Fondo de organizaciones no gubernamentales"
 SWI_fund_ngo_desc: "Las organizaciones no gubernamentales desempeñan un papel fundamental en el apoyo a las comunidades y la solución de los problemas sociales. Al proporcionar financiación estatal, podemos mejorar su capacidad para servir al público y complementar los esfuerzos gubernamentales."
 SWI_ban_neutrals: "Neutrales prohibidos"
 SWI_ban_neutrals_desc: "Suiza no puede permitirse permanecer neutral ante las crecientes amenazas y la inestabilidad mundial. Al prohibir la neutralidad, afirmamos el papel activo de nuestra nación en los asuntos internacionales y nos preparamos para defender nuestros intereses en el extranjero."
 SWI_militarized_society: "Sociedad militarizada"
 SWI_militarized_society_desc: "Una nación fuerte requiere una ciudadanía fuerte. Al abrazar una sociedad militarizada, inculcamos disciplina, preparación y responsabilidad compartida por la defensa de Suiza."
 SWI_secret_agency: "La Agencia Secreta"
 SWI_secret_agency_desc: "La inteligencia es la columna vertebral de la seguridad nacional. Al establecer una agencia secreta, Suiza puede vigilar las amenazas, reunir información crítica y actuar con decisión antes de que los peligros lleguen a nuestras fronteras."
 SWI_swiss_companies_only: "Compañías Suizas"
 SWI_swiss_companies_only_desc: "Para fortalecer nuestra economía y proteger los intereses nacionales, sólo se permitirá a las empresas suizas operar en determinados sectores. Esto asegura empleos para nuestros ciudadanos y mantiene a nuestras industrias bajo control nacional."
 SWI_self_sufficiency: "Autosuficiente"
 SWI_self_sufficiency_desc: "Suiza debe reducir su dependencia de las importaciones extranjeras y garantizar que se produzcan recursos esenciales en el país. Al promover la autosuficiencia, salvaguardamos nuestra economía y fortalecemos la resiliencia nacional."
 SWI_workers: "Los trabajadores"
 SWI_workers_desc: "Una nación es tan fuerte como su fuerza de trabajo. Mediante la implementación de políticas a favor de los trabajadores, aseguramos salarios justos, mejores condiciones laborales y una población más satisfecha y productiva."
 SWI_communism_idea: "Comunismo"
 SWI_communism_idea_desc: "Inspirado en principios socialistas, el comunismo suizo busca poner los medios de producción bajo el control del pueblo. Al reestructurar nuestra economía, buscamos reducir la desigualdad y asegurar que todos los ciudadanos compartan la riqueza de la nación."
 SWI_new_age: "Nueva Era"
 SWI_new_age_desc: "La vieja confederación ha seguido su curso. Al disolver la federación y establecer una república unificada, Suiza entra en una nueva era de gobierno, centralizando el poder y redefiniendo el futuro de la nación."
 SWI_agricultural_collectivization_idea: "Colectivización agrícola"
 SWI_agricultural_collectivization_idea_desc: "Para alimentar a la nación y modernizar el campo, debemos organizar granjas en unidades colectivas. La colectivización agrícola aumentará la eficiencia, mejorará la asignación de recursos y fortalecerá el control estatal sobre la producción de alimentos."
 SWI_censor: "Censorship"
 SWI_censor_desc: "Para preservar el orden social y proteger la estabilidad nacional, se debe vigilar cuidadosamente la información. La aplicación de la censura garantiza que las ideologías nocivas y la propaganda desestabilizadora no pueden socavar a Suiza."
 SWI_central_committee_idea: "El Comité Central"
 SWI_central_committee_idea_desc: "Un estado fuerte requiere un liderazgo decisivo. El establecimiento de un Comité Central consolida el poder, coordina la política en todo el país y asegura que la visión del partido se aplique eficazmente."
 SWI_politica_estera_svizzera: "Politica Estera Svizzera"
 SWI_politica_estera_svizzera_desc: "La política exterior de Suiza siempre ha sido neutral. Si nos alejamos de ese camino, podría darnos un borde en diferentes campos."
 SWI_choosing_our_path: "Elegir nuestro camino"
 SWI_choosing_our_path_desc: "Ahora nos enfrentamos a la decisión de qué hacer con nuestra política exterior. Ciertas personas prefieren la neutralidad, pero hay un movimiento para abrirse a la OTAN y a la UE."
 SWI_opening_up: "Apertura"
 SWI_opening_up_desc: "Hemos decidido alejarnos de nuestra política de neutralidad."
 SWI_neutral_foreign_policy: "Política exterior neutral"
 SWI_neutral_foreign_policy_desc: "Hemos decidido abrazar la neutralidad. ¿Por qué cambiar algo que funciona?"
 switzerland.17.t: "Elegir nuestro camino"
 switzerland.17.desc: "Ahora es el momento de decidir, cambiaremos o permaneceremos sin cambios. Ya sea que cambiemos o permanezcamos, habrá beneficios de cualquier manera."
 switzerland.17.a: "¡Tenemos que abrirnos al mundo!"
 switzerland.17.b: "¿Por qué cambiar algo que funciona?"
 SWI_digitalisation: "Suiza digital"
 SWI_digitalisation_desc: "La estrategia del Consejo Federal de Suiza Digital compromete a la Confederación a cobertura nacional de fibras y administración sin papel. Modernizar nuestras redes mantiene a las empresas suizas competitivas y permite que los ciudadanos resuelvan sus asuntos con el estado en línea."
 SWI_sustainability: "Energy Strategy 2050"
 SWI_sustainability_desc: "Avalado por referéndum, la Estrategia Energética 2050 elimina la energía nuclear a favor de la energía hidroeléctrica, solar y almacenamiento en red. Los parques de baterías suavizan la producción renovable alpina y evitan que el crecimiento económico salga fuera de nuestro entorno."
 SWI_microchip_research: "Semiconductor Investigación"
 SWI_microchip_research_desc: "La precisión suiza ya sustenta los módulos de posicionamiento u-blox, los laboratorios microelectrónicos de CSEM y el trabajo de diseño de ST en Ginebra. Dirección EPFL y ETH Zurich hacia el diseño semiconductor afirma una parte de una industria que el mundo no puede funcionar sin."
 SWI_microchip_plant: "Fundamentos nacionales"
 SWI_microchip_plant_desc: "Con los diseños probados, es hora de romper terreno. Una fundición nacional convierte los planos suizos en silicio suizo y protege a nuestra industria de golpes de suministro extranjeros."
 SWI_defending_swiss_independence: "Defender la independencia suiza"
 SWI_defending_swiss_independence_desc: "Para mantener nuestra neutralidad, debemos mantener nuestra independencia. Y para hacer esto, primero debemos contrarrestar las influencias extranjeras que rodean, tratando de encadenarnos a otros lados."
 SWI_effort_to_better_relations: "Esfuerzo para mejorar las relaciones"
 SWI_effort_to_better_relations_desc: "Por mucho tiempo hemos jugado la tarjeta de neutralidad. Ahora debemos mejorar nuestras relaciones con nuestros vecinos que hemos descuidado durante demasiado tiempo."
 SWI_swiss_mercenaries: "Swiss Mercenaries"
 SWI_swiss_mercenaries_desc: "Debemos establecer nuestra propia fuerza mercenaria. Si hay algunos que saben pelear en las montañas, es nuestra gente. Que debemos explotar para obtener ganancias."
 SWI_swiss_peacekeeping: "Mantenimiento de la paz"
 SWI_swiss_peacekeeping_desc: "La ONU necesita al personal de mantenimiento de la paz en este mundo volátil. Suiza debe responder."
 SWI_enforcing_the_uns_will: "Hacer cumplir la voluntad de la ONU"
 SWI_enforcing_the_uns_will_desc: "Los contingentes suizos pasan de la observación a la ejecución, respaldando los mandatos del Consejo de Seguridad con las tropas que responden a Berna."
 SWI_befriend_the_eu: "Ser amigo de la UE"
 SWI_befriend_the_eu_desc: "Ahora debemos elegir: ¿Queremos seguir en nuestro camino completo de neutralidad, o queremos ser amigos de la UE?"
 SWI_nato: "NATO?"
 SWI_nato_desc: "La membresía terminaría siglos de neutralidad formal. El Consejo Federal debe decidir si la garantía de seguridad vale el precio."
 SWI_expand_the_mercenaries: "Ampliar los Mercenarios"
 SWI_expand_the_mercenaries_desc: "Parece que nuestros mercenarios nos están ganando reputación en todo el mundo. ¡Mantengámoslo y amplíenlos!"
 SWI_foreign_investments: "Inversiones extranjeras"
 SWI_foreign_investments_desc: "Debemos aprovechar nuestra nueva alineación con otras naciones occidentales. Podemos ir a pedir inversiones, y ofrecer algo de vuelta."
 SWI_local_arms_production: "Producción de armas locales"
 SWI_local_arms_production_desc: "Debemos continuar en nuestro camino de neutralidad, y las ofertas de armas se pueden considerar como algún tipo de alineación. Por eso debemos producir nuestro propio armamento."
 SWI_internal_investments: "Inversiones internas"
 SWI_internal_investments_desc: "Debemos mejorarnos gastando nuestro propio dinero en nosotros mismos, haciendo inversiones internas."
 SWI_integration_to_nato: "Integración en la OTAN"
 SWI_integration_to_nato_desc: "Ahora que nos hemos unido a la OTAN, tenemos que empezar a integrar nuestros sistemas de armas más antiguos y nuevos a los estándares de la OTAN."
 SWI_integration_to_nato_tt: "Cada otro miembro §YNATO§! gana §G+25§! opinión de Suiza"
 SWI_alignment_to_NATO: "Alineación a la OTAN"
 SWI_alone_is_safer: "Solo es más seguro"
 SWI_alone_is_safer_desc: "Aunque nos hemos abierto a Occidente, es bastante el salto para unirse realmente a la OTAN. Debemos preservar nuestra independencia en este asunto."
 SWI_expanded_trade: "Comercio ampliado"
 SWI_expanded_trade_desc: "Tenemos que ampliar nuestro comercio para ganar favores de la UE, y quizás encontrar el valor para unirse a la UE más adelante."
 SWI_partner_like_everyone: "Compañero como todos"
 SWI_partner_like_everyone_desc: "No vemos una buena ganancia al alinear nuestro comercio más con la UE. Es por eso que nuestras relaciones deben mantenerse tan alineadas con ellas como con cualquier otro país."
 SWI_bank_of_the_west: "Banco de Occidente"
 SWI_bank_of_the_west_desc: "Tenemos una enorme industria bancaria que podemos explotar a nuestra propia ventaja. Sin embargo, debemos ofrecerlo principalmente a Occidente."
 SWI_idea_environmental_reforms: "Reformas ambientales"
 SWI_idea_environmental_reforms_desc: "Las leyes ambientales amplias tienen por objeto reducir las emisiones, proteger los recursos naturales y pasar la economía hacia la sostenibilidad."
 SWI_idea_eco_tourism: "Ecoturismo"
 SWI_idea_eco_tourism_desc: "La promoción de viajes ecológicos trae nueva vida a las zonas rurales, preservando los paisajes prísticos de Suiza."
 SWI_idea_national_parks: "Parques Nacionales"
 SWI_idea_national_parks_desc: "Ampliar áreas protegidas salvaguarda la vida silvestre y fortalece la imagen global de Suiza como líder ambiental."
 SWI_idea_completely_green: "¡Totalmente Verde!"
 SWI_idea_completely_green_desc: "A través de una reforma e innovación implacable, Suiza logra la plena sostenibilidad ecológica, una nación impulsada enteramente por energía limpia."
 SWI_idea_christian_values: "Valores cristianos"
 SWI_idea_christian_values_desc: "Los principios cristianos tradicionales guían la política social y fortalecen el fundamento moral de la sociedad suiza."
 SWI_idea_fortress_switzerland: "Fortress Switzerland"
 SWI_idea_fortress_switzerland_desc: "Principales fortificaciones y redes modernas de defensa aseguran que Suiza siga siendo impenetrable en cualquier conflicto."
 SWI_idea_tax_code: "Código Fiscal simplificado"
 SWI_idea_tax_code_desc: "Un sistema tributario simplificado reduce la evasión, atrae la inversión y apoya una economía equilibrada."
 SWI_idea_fdp: "Partido Democrático Libre (FDP)"
 SWI_idea_fdp_desc: "El FDP es un partido liberal que aboga por mercados libres, empresaria individual, libertad económica y mínima intervención estatal."
 SWI_idea_financial_deregulation: "Desregulación financiera"
 SWI_idea_financial_deregulation_desc: "La reducción de las restricciones bancarias y financieras fomenta la inversión, el crecimiento y el dinamismo económico."
 SWI_idea_sp: "Partido Socialdemócrata (SP)"
 SWI_idea_sp_desc: "Los socialdemócratas dirigen el sistema político hacia un mayor bienestar social y cooperación internacional."
 SWI_idea_fdu: "Unión democrática federal (FDU)"
 SWI_idea_fdu_desc: "La Unión Federal Democrática defiende los valores cristianos conservadores, evangélicos y la autonomía local."
 SWI_idea_svp: "Partido Popular Suizo (SVP)"
 SWI_idea_svp_desc: "El Partido Popular Suizo presiona para controles de inmigración estrictos, conservadurismo fiscal y soberanía nacional."
 SWI_idea_defend_secrecy: "Secreto bancario"
 SWI_idea_defend_secrecy_desc: "Toda la presión internacional para desmantelar el secreto bancario privado es rebuffed. La confidencialidad del cliente sigue siendo la ley de la tierra."
