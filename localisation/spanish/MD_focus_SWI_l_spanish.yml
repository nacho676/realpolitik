 SWI_the_bank_of_the_world: "El Banco del Mundo"
 SWI_the_bank_of_the_world_desc: "El secreto bancario suizo hizo de Zurich y Ginebra las bóvedas del mundo. Formalizar ese papel y dejar que el capital extranjero se resuelva aquí en lugar de en Londres o Frankfurt."
 SWI_strengthening_swiss_cooperation: "Fortalecimiento de la cooperación suiza"
 SWI_strengthening_swiss_cooperation_desc: "Los ejercicios conjuntos, la doctrina compartida y el equipo estandarizado vinculan a la milicia suiza con sus nuevos asociados de la Alianza."
 SWI_bastion_of_democracy: "Bastión de la democracia"
 SWI_bastion_of_democracy_desc: "La neutralidad nunca fue indiferencia. Suiza es un ejemplo de autogobierno, y lo dice claramente."
 SWI_eu_investments: "Europeann Investments"
 SWI_eu_investments_desc: "El capital suizo fluye hacia el Mercado Único. Nuestros bancos apoyan el crecimiento europeo, y el crecimiento europeo subscribe nuestros bancos."
 SWI_on_our_own_path: "En nuestro propio camino"
 SWI_on_our_own_path_desc: "La UE es un cliente entre muchos. La financiación suiza sirve a quien paga, y responde solo a Bern."
 SWI_staple_of_democracy: "El pilar de la democracia"
 SWI_staple_of_democracy_desc: "Los capitales occidentales nos acompañan porque nuestras instituciones son predecibles. Esa previsibilidad es en sí misma una exportación."
 SWI_eu_candidacy: "Europeann Union Candidacy"
 SWI_eu_candidacy_desc: "Bern presenta una solicitud formal a Bruselas. La adhesión terminaría con el parche bilateral y vincularía a Suiza a la Unión que ha circunscrito durante décadas."
 SWI_eu_candidacy_tt: "Suiza se convierte en §Ycandidato de la UE§!"
 SWI_friend_for_all: "Un amigo para todos"
 SWI_friend_for_all_desc: "Sin bloque, sin alineación, sin amigos permanentes. Suiza ofrece sus buenos oficios a cada nación y confía en todos ellos."
 SWI_trust_in_the_eu: "Confianza en la UE"
 SWI_trust_in_the_eu_desc: "La candidatura no es miembro. La intensificación de la cooperación con los Estados miembros demuestra el compromiso suizo antes del voto de adhesión."
 SWI_trust_in_the_eu_tt: "Cada uno §YEstado miembro de la UE§! aumentos §G+30§! opinión de Suiza"
 SWI_swiss_independence: "Independencia Suiza"
 SWI_swiss_independence_desc: "Los lobbies extranjeros se han vuelto cómodos en Berna. Su influencia se retrocede y las instituciones nacionales reafirman el control."
 SWI_mutual_defence_training: "Capacitación en Defensa Mutua"
 SWI_mutual_defence_training_desc: "Escuelas de guerra alpinas abiertas a socios europeos. Sus soldados aprenden nuestras montañas, y nuestra milicia aprende a luchar a su lado."
 SWI_invest_in_eu: "Invertir en la UE"
 SWI_invest_in_eu_desc: "Los fondos de pensiones y bancos suizos toman apuestas directas en la industria europea, convirtiendo el peso financiero en posición política."
 SWI_national_investments: "Inversiones nacionales"
 SWI_national_investments_desc: "El capital que habría ido al extranjero se ha convertido en infraestructura suiza, industria suiza e investigación suiza."
 SWI_defence_training_in_the_alps: "Capacitación en Defensa en los Alpes"
 SWI_defence_training_in_the_alps_desc: "Cada recluta aprende el terreno que defenderá. Los cursos de rehabilitación perforan a la milicia en los valles que se le asigna para retener."
 SWI_european_defence: "Europeann Defense"
 SWI_european_defence_desc: "Un marco común europeo de defensa toma forma, con ingeniería suiza y neutralidad suiza en su centro más que a su margen."
 SWI_swiss_banking: "Banca suiza"
 SWI_swiss_banking_desc: "Nuestros bancos han superado el país al que son nombrados. Consolidar el sector y dejar que funcione a la escala que ha ganado."
 SWI_swiss_banking_two: "El Vault del Mundo"
 SWI_swiss_banking_two_desc: "Los depósitos llegan de cada continente. Suiza deja de competir con los grandes centros financieros y se convierte en el lugar donde guardan sus reservas."
 SWI_last_man_standing: "El último hombre"
 SWI_last_man_standing_desc: "La doctrina asume lo peor: cada corte de carretera, cada aliado se fue. La milicia está capacitada para luchar independientemente."
 SWI_swiss_neutrality: "Neutralidad suiza"
 SWI_protect_alps: "Protector de los Alpes"
 SWI_protect_alps_desc: "Los Alpes no son paisajes. La protección federal de los valles altos preserva el terreno que ha mantenido a invasores fuera durante seis siglos."
 SWI_Expanding_nuclear_research_desc: "Los reactores suizos van más allá de la generación de energía. Los programas de investigación en los institutos federales empujan a ciclos de combustible y la ciencia de materiales."
 swiss_political_system4: "Sistema Político de Suiza"
 swiss_political_system4_desc: "El poder es empujado hacia los cantones. Bern coordina en lugar de mandos, y el gobierno local decide qué puede decidir el gobierno local. La toma de decisiones federal disminuye, pero la construcción y administración responden a las personas que viven con las consecuencias."
 SWI_milita: "La milicia armada"
 SWI_milita_desc: "El ejército ciudadano está politizado y armado. El servicio se convierte en una escuela del estado tanto como del rifle."
 SWI_multilingual_workers: "Trabajadores multilingües"
 SWI_multilingual_workers_desc: "Los trabajadores alemanes, franceses, italianos y romanche se organizan a través de las fronteras lingüísticas que han dividido largamente la mano de obra suiza."
 SWI_propaganda_idea: "Estado Propaganda"
 SWI_propaganda_idea_desc: "La oficina de prensa federal deja de informar y empieza a persuadir. Los programas de radio, impresos y escolares llevan el mismo mensaje."
 SWI_true_neutral: "Neutralidad verdadera"
 SWI_true_neutral_desc: "§YReglas especiales:§!\n\n§Y §! §RCANNOT§! §Y unir una facción!§!\n--------------\nNo neutralidad armada, no neutralidad benevolente. Suiza no tiene ningún lado, no tiene base ni firma ninguna garantía.\n--------------\nEste espíritu nacional puede ser §RRemovido§! a través de la decisión §HAbandon True Neutrality§!."
 SWI_sig_sauer_ag: "SIG Sauer AG"
 SWI_sig_sauer_ag_desc: "Las obras de Neuhausen arman a la milicia. Cada hogar suizo con un rifle de servicio tiene una salida de SIG."
 SWI_rheinmetall_cooperation: "Cooperación Rheinmetall"
 SWI_rheinmetall_cooperation_desc: "Reinmetall Air Defence in Zurich, heredero de Oerlikon, vincula armas suizas y trabajo por radar con la casa de armas más grande de Alemania"
 SWI_thales_cooperation: "Tales Cooperación"
 SWI_thales_cooperation_desc: "Thales Suisse suministra los radares, optronía y sistemas de mando que convierten a una milicia en una fuerza en red."
 SWI_local_production1: "Producción local"
 SWI_local_production1_desc: "Las armas compradas en el extranjero pueden ser sujetas a embargo. Armas construidas en Thun no pueden. Las líneas domésticas se apoderan de lo esencial."
 SWI_pilatus_aircraft_manufacturer_trainer_header: "Aviones de entrenador"
 SWI_pilatus_aircraft_manufacturer_attack_header: "Ataque de luz"
 SWI_pilatus_aircraft_manufacturer_utility_header: "Utility & Transport"
 switzerland.18.t: "La cuestión de la OTAN"
 switzerland.18.desc: "Los protocolos de adhesión se sitúan en la mesa del Consejo Federal. Firmarlas termina con una neutralidad armada que ha superado a todos los imperios de Europa."
 switzerland.18.a: "Firme los protocolos."
 switzerland.18.b: "La neutralidad no es negociable."
 switzerland.22.t: "Nuestro lugar en Europa"
 switzerland.22.desc: "Bruselas ofrece un mayor acceso al comercio en términos que vincularían la regulación suiza a la legislación de la UE. Los cantones están divididos."
 switzerland.22.a: "Aumentar los vínculos con la UE."
 switzerland.22.b: "Comercio con todos por igual."
 switzerland.23.t: "La oferta suiza"
 switzerland.23.desc: "Berna propone que el Principado se una a la Federación Alpina. Liechtenstein ya utiliza el franco y comparte nuestra unión aduanera. Lo que queda es la corona."
 switzerland.23.a: "Aceptar el sindicato."
 switzerland.23.b: "El Principado está solo."
 switzerland.24.t: "Liechtenstein Accedes"
 switzerland.24.desc: "Vaduz ha acordado. El Principado entra en la Federación como miembro completo, y el último enclave independiente de los Alpes se ha ido."
 switzerland.24.a: "Los Alpes están enteros."
 switzerland.25.t: "Liechtenstein rechaza"
 switzerland.25.desc: "El Príncipe ha disminuido. Vaduz mantendrá su corona, su parlamento y su independencia, por pequeña que sea."
 switzerland.25.a: "So be it."
 switzerland.26.t: "Un Ultimatum alpino"
 switzerland.26.desc: "Berna ha emitido un ultimátum: el Principado debe entrar en la Federación Alpina, por acuerdo si es posible y por fuerza si es necesario. Las tropas suizas están en masa a lo largo de una frontera que nunca ha necesitado defender. El Landtag debe decidir ahora si Liechtenstein presenta o desafía a su vecino."
 switzerland.26.a: "No podemos enfrentarnos a Suiza."
 switzerland.26.b: "¡El Principado no se arrodillará!"
 SWI_un_member_tt: "Suiza debe ser un §Y miembro de las Naciones Unidas§! (junto a la decisión §G de las Naciones Unidas §!)"
 SWI_bank_established_tt: "Suiza debe haber establecido un §Yprincipal centro financiero§! a través de §GBank of the West§!, §GEl Banco del Mundo§!, §GEuropean Investments§! or §GEn nuestro propio camino§!"
 SWI_world_bank_established_tt: "Suiza debe haber establecido el centro financiero §Ymundo§! a través de §GEl Banco del Mundo §!, §G Inversiones Europeas§! o §GEn nuestro propio Camino§!"
 SWI_fiscal_equalization_council: "Fondo de Nivelación Fiscal"
 SWI_fiscal_equalization_council_desc: "Con el Consejo de Estados que dirige la reforma, un nuevo fondo federal redistribuye riquezas de los cantones más ricos a los más pobres, asegurando un desarrollo uniforme y altos niveles de vida en toda la Federación preservando al mismo tiempo la autonomía regional."
 SWI_idea_mass_produced_firearms: "Mass-Produced Firearms"
 SWI_idea_mass_produced_firearms_desc: "Las líneas de producción estandarizadas y las partes intercambiables han reducido el costo de las armas pequeñas, mejorando al mismo tiempo la fiabilidad y el rendimiento defensivo."
 SWI_idea_gunship_development: "Desarrollo de armas"
 SWI_idea_gunship_development_desc: "Heavily armed helicopter gunships provide close air support and reconnaissance, integrating air mobility with the army's defence teaching."
 switzerland.27.t: "Solicitud de compra de Eurofighter"
 switzerland.27.d: "Suiza ha solicitado comprar aviones Eurofighter Typhoon de nuestra industria de defensa."
 switzerland.27.a: "Aprobar la venta."
 switzerland.27.b: "Decline, nuestras líneas de producción están ocupadas."
 switzerland.28.t: "Solicitud de compra de Rafale"
 switzerland.28.d: "Suiza ha solicitado comprar aviones de caza Rafale de nuestra industria de defensa."
 switzerland.28.a: "Aprobar la venta."
 switzerland.28.b: "Decline, nuestras líneas de producción están ocupadas."
 switzerland.29.t: "C-130J Purchase Request"
 switzerland.29.d: "Suiza ha solicitado comprar aviones de transporte C-130J Super Hércules desde nuestra industria de defensa."
 switzerland.29.a: "Aprobar la venta."
 switzerland.29.b: "Decline, nuestras líneas de producción están ocupadas."
 switzerland.30.t: "Compra Aprobada"
 switzerland.30.d: "Nuestra solicitud de compra ha sido aprobada. Los aviones están siendo entregados."
 switzerland.30.a: "Excelente."
 switzerland.31.t: "Compra denegada"
 switzerland.31.d: "Nuestra solicitud de compra ha sido rechazada. No se entregará ningún avión."
 switzerland.31.a: "Un revés para el programa."
 SWI_heer_modifier: "Schweizer Heer"
 SWI_heer_modifier_desc: "El Ejército Suizo es una fuerza de milicia construida sobre la conscripción universal, donde el ciudadano guarda su rifle en casa y la montaña se trata como la primera línea de defensa. No tiene ningún ejército de campo permanente de consecuencia, en lugar de depender de la movilización rápida, las demoliciones preparadas y el terreno alpino fortificado."
 SWI_schweizerische_luftwaffe_modifier: "Schweizerische Luftwaffe"
 SWI_schweizerische_luftwaffe_modifier_desc: "La Fuerza Aérea Suiza existe para mantener el espacio aéreo sobre la Confederación y nada más allá de ella. Sus aviones vuelan desde bases alpinas endurecidas y hangares cavernosos, encargados de la interceptación y la vigilancia del aire en lugar de proyección de energía."
 SWI_military_industry_modifier: "Industria militar suiza"
 SWI_military_industry_modifier_desc: "La producción de armas suizas es pequeña, precisa y celosamente independiente. Firmas como RUAG, MOWAG y SIG Sauer abastecen a la milicia y exportan al extranjero, sosteniendo una base industrial de defensa mucho más grande que el tamaño del país sugeriría."
 SWI_politica_estera_svizzera_modifier: "Política exterior suiza"
 SWI_politica_estera_svizzera_modifier_desc: "Las opciones acumuladas de Berna en el extranjero, desde la neutralidad armada y el mantenimiento de la paz de las Naciones Unidas hasta los vínculos bancarios y la alineación con Europa o la OTAN. Cada paso en el programa de política exterior forma la posición de la Confederación, sus finanzas y la disposición de su milicia."
 SWI_alps_treaty: "Tratado de Alpes"
 SWI_alps_treaty_trade: "Términos de comercio del Tratado de Alpes"
 SWI_geneva_climate_accord: "Acuerdo climático de Ginebra"