l_spanish:
 balkan_news.1.t: "Karadžić Condenado de Genocidio"
 balkan_news.1.d: "El tribunal de La Haya ha declarado culpable a Radovan Karadžić de genocidio en Srebrenica y de crímenes de lesa humanidad en toda Bosnia, y lo condenó a cuarenta años. Dos decenios después de Dayton, el líder en tiempos de guerra de los serbios de Bosnia ha sido juzgado por el tribunal por su guerra."
 balkan_news.1.a: "El veredicto es leído en voz alta en Sarajevo"
 balkan_news.1.b: "Un veredicto contra todos los serbios, algunos dicen"
 balkan_news.1.c: "Justicia, demora"
 balkan_news.2.t: "La vida Sentencia para Karadžić"
 balkan_news.2.d: "La sala de apelaciones ha rechazado la apelación de Radovan Karadžić y ha elevado su sentencia a cadena perpetua, dictando que el plazo original de cuarenta años es inadecuado por la gravedad de sus crímenes. Es la palabra final sobre el hombre que dirigió la República Srpska a través de la guerra."
 balkan_news.2.a: "La Haya cierra el caso"
 balkan_news.3.t: "Mladić Condenado de Genocidio"
 balkan_news.3.d: "El tribunal ha condenado a Ratko Mladić por genocidio, crímenes de guerra y crímenes de lesa humanidad, y lo condenó a cadena perpetua. El ex general gritó a los jueces y tuvo que ser retirado de la sala antes de terminar la lectura. En Srebrenica, las madres de los muertos miraban en silencio."
 balkan_news.3.a: "Las respuestas generales al fin"
 balkan_news.4.t: "Suicidio en la sala de audiencias"
 balkan_news.4.d: "Momentos después de que los jueces confirmaran su sentencia de veinte años, el general bosnio croata Slobodan Praljak declaró que no era un criminal de guerra y bebió un frasco de veneno ante las cámaras. Murió dentro de horas. La sala de apelaciones confirmó las convicciones de los seis ex dirigentes Herzeg-Bosnia, encontrando una empresa criminal conjunta que llegó a Zagreb."
 balkan_news.4.a: "Rechazó la justicia de la corte"
 balkan_news.4.b: "Un duro final al último caso del tribunal"
 balkan_news.5.t: "Mladić's Appeal Rejected"
 balkan_news.5.d: "Los jueces de las Naciones Unidas han confirmado la condena por genocidio y cadena perpetua de Ratko Mladić, cerrando el último caso importante derivado de la guerra bosnia. Un cuarto de siglo después de Srebrenica, el balance judicial con la guerra está completo. El cálculo político no lo es."
 balkan_news.5.a: "El archivo cierra"
 CRO_nat_populism_gain_tt: "§REl derecho nacionalista gana apoyo.§!"
 balkan_news.6.t: "La Declaración Mundial de Serbia"
 balkan_news.6.d: "Belgrado y Banja Luka han aprobado conjuntamente una declaración de trece páginas sobre la unidad de tierras serbias bajo un Alto Consejo Permanente para la cooperación entre Serbia y la República Srpska. Es corta en la fuerza legal y larga en la intención."
 balkan_news.6.a: "Un patrono vale la pena tener"
 balkan_news.6.b: "La autoridad de Sarajevo se erosiona aún más"
 balkan_news.6.c: "Noticias del barrio"
 balkan_news.7.t: "EUFOR se dobla."
 balkan_news.7.d: "Días después de que los tanques rusos cruzaran a Ucrania, la UE ha duplicado aproximadamente la guarnición de la EUFOR Althea en Bosnia y Herzegovina, volando en tropas de reserva como cobertura contra la inestabilidad del derrame."
 balkan_news.7.a: "Una muestra tranquilizadora de resolución"
 balkan_news.7.b: "Una precaución tomada en otro lugar"
 balkan_news.8.t: "Erdoğan Rallies Sarajevo"
 balkan_news.8.d: "Conducido de la campaña en Europa occidental, Erdoğan ha celebrado su único rallye europeo de la carrera en Sarajevo, sorteando miles y reuniéndose con Bakir Izetbegović de SDA. Dodik lo llama interferencia."
 balkan_news.8.a: "Un amigo Sarajevo puede contar con"
 balkan_news.8.b: "Un mitin en el país de otra persona"
 balkan_news.9.t: "Lavrov's Sarajevo Visit"
 balkan_news.9.d: "Sergey Lavrov ha visitado Sarajevo, saludado solo en el aeropuerto por Dodik. Para la ocasión no se planteó ninguna bandera bosnia. Se fue con un icono ortodoxo de hace siglos, cuyos orígenes se remontan a Luhansk, un regalo que Kyiv quiere explicar."
 balkan_news.9.a: "La política exterior de la República Srpska"
 balkan_news.9.b: "Una visita como cualquier otra"