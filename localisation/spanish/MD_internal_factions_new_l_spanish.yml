l_spanish:
 internal_factions_events.53.t: "Loyalty Party Under Scrutiny"
 internal_factions_events.53.d: "Los cuadros comunistas han presentado al gobierno una lista de funcionarios burocráticos que consideran ideológicamente poco confiable. Están exigiendo una investigación formal de lealtad y la eliminación de aquellos que no cumplen con las normas del partido."
 internal_factions_events.53.o1: "Conducta de la purga"
 internal_factions_events.53.o2: "Rechazar sus demandas"
 internal_factions_events.53.o3: "Inicie un examen limitado"
 internal_factions_events.54.t: "Los cuadros piden la colectivización"
 internal_factions_events.54.d: "Los Cadres Comunistas se han vuelto impacientes con las explotaciones agrícolas privadas. Están empujando al gobierno a lanzar una campaña de colectivización, consolidando tierras agrícolas bajo control estatal para aumentar la eficiencia y la conformidad ideológica."
 internal_factions_events.54.o1: "Recopilación de apoyo"
 internal_factions_events.54.o2: "Rechazar la propuesta"
 internal_factions_events.54.o3: "Reforma agraria limitada"
 internal_factions_events.55.t: "Demandas de la industria Expansión portuaria"
 internal_factions_events.55.d: "La Industria Marítima ha presentado una propuesta para ampliar las instalaciones portuarias a lo largo de la costa, argumentando que la congestión les está costando millones anuales. Los terratenientes locales y los urbanistas se han opuesto, citando preocupaciones de desplazamiento y perturbación urbana."
 internal_factions_events.55.o1: "Aprobar la expansión"
 internal_factions_events.55.o2: "Negar la propuesta"
 internal_factions_events.55.o3: "Negociar un compromiso"
 internal_factions_events.56.t: "Piratería disrupts Rutas de envío"
 internal_factions_events.56.d: "Un aumento de la piratería ha puesto en peligro nuestros carriles comerciales. Los representantes de la industria marítima exigen una intervención gubernamental para proteger sus buques y carga, advirtiendo que la inacción aumentará los costos de seguros y disuadirá la inversión."
 internal_factions_events.56.o1: "Fondo un programa de escolta naval"
 internal_factions_events.56.o2: "Ignora el problema"
 internal_factions_events.56.o3: "Solicite la cooperación internacional"
 internal_factions_events.57.t: "Anillo de Espionaje Extranjero descubierto"
 internal_factions_events.57.d: "Los analistas de inteligencia han identificado un anillo de espionaje extranjero que opera dentro de nuestras fronteras. La Comunidad de Inteligencia está presionando al gobierno para que actúe con decisión antes de que la red extraiga información clasificada."
 internal_factions_events.57.o1: "Expone la red públicamente"
 internal_factions_events.57.o2: "Neutralizarlo en silencio"
 internal_factions_events.57.o3: "No se tomen medidas"
 internal_factions_events.58.t: "Preguntas de Legislatura Inteligencia"
 internal_factions_events.58.d: "Antes del próximo ciclo electoral, los miembros de la legislatura han planteado preguntas puntuales sobre el presupuesto opaco de los servicios de inteligencia. Los grupos de defensa están pidiendo una mayor rendición de cuentas, mientras que la Comunidad de Inteligencia advierte que la transparencia comprometerá las operaciones en curso."
 internal_factions_events.58.o1: "Defender el presupuesto en su totalidad"
 internal_factions_events.58.o2: "Publicar información parcial"
 internal_factions_events.58.o3: "Compromiso de plena transparencia"
 internal_factions_events.59.t: "Los combatientes extranjeros cruzan la frontera"
 internal_factions_events.59.d: "Una ola de combatientes extranjeros ha entrado en nuestro territorio, trazada por el conflicto en curso. Están ofreciendo sus servicios a nuestra causa, aunque su confiabilidad y disciplina siguen siendo inciertos. Las redes de Jihadi Extranjeros están instando al gobierno a encontrarles un papel."
 internal_factions_events.59.o1: "Integrarlos en unidades regulares"
 internal_factions_events.59.o2: "Desplieguelos al frente inmediatamente"
 internal_factions_events.59.o3: "Aléjalos en la frontera."
 internal_factions_events.60.t: "Jihadi Brigades Demanda Autonomía"
 internal_factions_events.60.d: "Enmarcados por sus crecientes números, las brigadas extranjeras Jihadi exigen el reconocimiento formal como una fuerza autónoma que opera bajo su propia estructura de mando. Sostienen que la independencia operacional les permitirá actuar con mayor eficacia sin injerencia burocrática."
 internal_factions_events.60.o1: "Concédeles autonomía operacional"
 internal_factions_events.60.o2: "Negar la solicitud"
 internal_factions_events.60.o3: "Integrarlos en el comando nacional"
 internal_factions_events.61.t: "Quds Force Seeks Más Recursos"
 internal_factions_events.61.d: "Quds El liderazgo de la Fuerza ha presentado una solicitud oficial de financiación adicional y material para ampliar sus operaciones proxy regionales, argumentan que la oportunidad estratégica es ahora y que subfinancian riesgos ceder influencia a los poderes rivales"
 internal_factions_events.61.o1: "Proporción de financiación completa"
 internal_factions_events.61.o2: "Ofrezca apoyo parcial"
 internal_factions_events.61.o3: "Negar la solicitud"
 internal_factions_events.62.t: "Vulnerabilidad de un vecino"
 internal_factions_events.62.d: "Quds Force intelligence reports that a neighbouring state, currently embroiled in conflict, is vulnerable to proxy pressure. La ventana de la oportunidad es estrecha, pero los potenciales beneficios estratégicos son significativos."
 internal_factions_events.62.o1: "Explotar la situación"
 internal_factions_events.62.o2: "Compartir inteligencia con estados alineados"
 internal_factions_events.62.o3: "Dejar pasar la oportunidad"
 establish_political_commissars_decision: "Incorporó a Comisarios Políticos"
 establish_political_commissars_decision_desc: "Desplegar comisarios del partido en las unidades militares para imponer la lealtad ideológica y elevar la moral. Los comisarios responderán directamente a los Cuadros Comunistas, lo que refuerza su influencia sobre las fuerzas armadas."
 worker_reeducation_programme_decision: "Programa de Reeducación Laboral"
 worker_reeducation_programme_decision_desc: "Financiar un programa estatal de reeducación para reforzar la ideología del partido en la fuerza laboral. El cumplimiento sube y la demanda de consumo baja a medida que los trabajadores redirigen su esfuerzo a las prioridades del Estado."
 maritime_safety_inspections_decision: "Inspecciones obligatorias de seguridad marítima"
 maritime_safety_inspections_decision_desc: "Encargar un régimen integral de inspecciones de seguridad en todas las instalaciones portuarias y astilleros nacionales. Elevar los estándares tranquiliza a la industria y mejora la producción de los astilleros durante el periodo de inspección."
 naval_shipping_subsidy_decision: "Subvenciones navales"
 naval_shipping_subsidy_decision_desc: "Proporcionar subsidios directos del gobierno a los operadores nacionales de transporte marítimo de larga distancia. El programa amplía el alcance operativo de nuestra flota mercante y mejora el rendimiento de los astilleros."
 counter_intelligence_sweep_decision: "Lucha contra la inteligencia"
 counter_intelligence_sweep_decision_desc: "Autorizar a la Comunidad de Inteligencia a realizar un barrido sistemático de las redes gubernamentales y militares en busca de penetración extranjera. Los costos del espionaje extranjero bajan y mejora la seguridad de nuestras comunicaciones durante la operación."
 expand_intelligence_network_decision: "Ampliar las redes de inteligencia"
 expand_intelligence_network_decision_desc: "Financiar el establecimiento de nuevas estaciones de inteligencia en el extranjero y de activos de inteligencia humana. La red ampliada mejora nuestra capacidad de descifrar comunicaciones enemigas y vigilar movimientos militares extranjeros."
 jihadi_recruitment_drive_decision: "Unidad de reclutamiento Jihadi"
 jihadi_recruitment_drive_decision_desc: "Patrocinar una activa campaña de reclutamiento en redes simpáticas para atraer a los combatientes extranjeros a nuestra causa. La mano de obra adicional fluye dentro y nuestra capacidad de fuerzas especiales crece."
 martyr_glorification_campaign_decision: "Marty Glorification Campaign"
 martyr_glorification_campaign_decision_desc: "Lanzar una campaña de propaganda que glorifique a los combatientes caídos y eleve el martirio a ideal cultural. El fervor bélico sube con fuerza, aunque el mensaje radicalizador corre el riesgo de inflamar el sentir extremista."
 support_proxy_networks_decision: "Soporte Redes Proxy"
 support_proxy_networks_decision_desc: "Canalizar fondos y equipo a través de la Fuerza Quds a grupos intermediarios regionales que operan en Estados vecinos. Reforzar estas redes amplía nuestro alcance estratégico y reduce el costo directo de mantener la presión sobre los rivales."
 quds_force_training_programme_decision: "Programa de entrenamiento de la Fuerza Quds"
 quds_force_training_programme_decision_desc: "Autorizar a la Fuerza Quds a dirigir un entrenamiento avanzado de guerra irregular para unidades militares selectas. Mejora la pericia en guerra no convencional y se amplía la capacidad de las fuerzas especiales."
 internal_factions_events.63.t: "Contratistas Lobby for Export Deals"
 internal_factions_events.63.d: "Los contratistas de defensa presionan al Gobierno para que preste su apoyo a una serie de contratos de exportación de armas en el extranjero. Argumentan que los acuerdos traerán ingresos significativos y mantendrán líneas de producción nacionales, pero los críticos advierten que las ventas amplias podrían inflamar tensiones regionales y atraer escrutinio internacional no deseado."
 internal_factions_events.63.o1: "Aprobar las exportaciones completas"
 internal_factions_events.63.o2: "Limitar las ventas a los compradores aliados"
 internal_factions_events.63.o3: "Rechazar el esfuerzo de presión"
 defense_procurement_programme_decision: "Programa de Adquisición de Defensa"
 defense_procurement_programme_decision_desc: "Lanzar un ciclo de adquisiciones dedicado que garantice pedidos constantes a los fabricantes de armas nacionales. Los contratos sostenidos aumentan la recaudación de impuestos de la industria militar y reducen la carga de bienes de consumo, y premian a la industria de defensa por su cooperación continuada."
 classified_research_programme_decision: "Programa de Investigación Clasificada"
 classified_research_programme_decision_desc: "Comprometer fondos clasificados a la investigación de tecnología militar realizada con socios de la industria de defensa. La inversión acelera la producción de investigación y endurece la seguridad de las comunicaciones, con una transferencia financiera al iniciar el programa."
 issue_government_bonds_decision: "Emitir bonos del gobierno respaldados por banqueros"
 issue_government_bonds_decision_desc: "Autorizar la emisión de bonos del gobierno respaldados por bancos y gestionados a través de redes bancarias internacionales. La inyección inmediata de capital eleva la estabilidad, aunque el servicio de la deuda empuja los tipos de interés al alza mientras dure."
 attract_foreign_investment_decision: "Atraer inversión extranjera"
 attract_foreign_investment_decision_desc: "Coordinar con contactos bancarios internacionales para señalar estabilidad y reducir las barreras de entrada. La campaña acorta el tiempo necesario para recibir inversión extranjera y aumenta la recaudación fiscal del capital entrante."
 internal_factions_cadre_purge: "Purga de cuadros"
 internal_factions_cadre_purge_desc: "Los comisarios del Partido están realizando investigaciones de lealtad en toda la burocracia, fortaleciendo la disciplina ideológica a costa de la perturbación administrativa."
 internal_factions_collectivisation_drive: "Colectivización Drive"
 internal_factions_collectivisation_drive_desc: "Se está llevando a cabo la colectivización agrícola, interrumpiendo las cadenas de suministro y aumentando la escasez de bienes de consumo a medida que las explotaciones agrícolas privadas se trasladan al control estatal."
 internal_factions_convoy_escort: "Programa de escolta naval"
 internal_factions_convoy_escort_desc: "Las escoltas navales financiadas por el Gobierno están protegiendo los carriles de transporte marítimo comercial, fomentando la confianza y la experiencia de nuestro personal naval."
 internal_factions_piracy_losses: "Disrupción de la piratería"
 internal_factions_piracy_losses_desc: "La piratería no comprobada está perturbando nuestros carriles de transporte marítimo, socavando la confianza comercial y desestabilizando la economía más amplia."
 internal_factions_neutralised_spies: "Red de Espionaje Desmantelada"
 internal_factions_neutralised_spies_desc: "Una red de inteligencia extranjera ha sido neutralizada silenciosamente, mejorando nuestras capacidades de contraespionaje durante un período."
 internal_factions_transparency_costs: "Gastos de transparencia en la inteligencia"
 internal_factions_transparency_costs_desc: "La divulgación pública de las operaciones de inteligencia ha debilitado nuestra seguridad de cifrado a medida que los adversarios se adaptan a métodos recién revelados."
 internal_factions_jihadi_frontline: "Despliegue en primera línea de Jihadi"
 internal_factions_jihadi_frontline_desc: "Los combatientes extranjeros desplegados directamente en el frente están presionando líneas enemigas agresivamente, aunque su falta de integración con fuerzas regulares deja los flancos expuestos."
 internal_factions_jihadi_autonomy: "Fuerza Autónoma de Jihadi"
 internal_factions_jihadi_autonomy_desc: "Las brigadas autónomas reconocidas de jihadi operan bajo su propio mando, ampliando significativamente nuestro techo de fuerzas especiales."
 internal_factions_jihadi_integrated: "Fuerzas integradas de Jihadi"
 internal_factions_jihadi_integrated_desc: "Los combatientes extranjeros integrados oficialmente en la estructura de mando nacional han mejorado la cohesión unitaria y las tasas de recuperación organizativa."
 internal_factions_quds_expanded: "Cuds Force Expanded Operations"
 internal_factions_quds_expanded_desc: "Los recursos adicionales han permitido que la Fuerza de Cods amplíe sus operaciones indirectas, reduciendo el costo de mantenimiento de las actividades subversivas extranjeras."
 internal_factions_quds_operation: "IV. Operación Estratégica de la Fuerza"
 internal_factions_quds_operation_desc: "La Fuerza Quds está explotando activamente la inestabilidad en un estado vecino, proporcionando una ventaja táctica en las operaciones en curso."
 fund_religious_schools_decision: "Fondo para las escuelas religiosas"
 fund_religious_schools_decision_desc: "Canalizar fondos del gobierno a una red de escuelas religiosas que operan bajo la supervisión de los ulemas wahabíes. La alfabetización mejora y la estabilidad social sube a medida que las instituciones amplían su alcance."
 enforce_moral_codes_decision: "Códigos Morales"
 enforce_moral_codes_decision_desc: "Facultar a las autoridades religiosas para hacer cumplir las normas morales públicas en todo el país. La medida refuerza la influencia de los ulemas y eleva la cohesión social, aunque las restricciones más estrictas empujan al alza el gasto de consumo."
 agricultural_subsidies_decision: "Subvenciones agrícolas"
 agricultural_subsidies_decision_desc: "Proporcionar subsidios directos al sector agrícola para aumentar la producción y premiar a la facción de los Agricultores por su cooperación. El desembolso inicial reduce las reservas del tesoro, pero las ganancias de productividad sostienen la economía durante el programa."
 rural_infrastructure_fund_decision: "Fondo de Infraestructura Rural"
 rural_infrastructure_fund_decision_desc: "Comprometer fondos del gobierno a mejoras de carreteras, riego y almacenamiento en zonas rurales. La inversión aligera la carga de trabajo de los distritos agrícolas y gana la buena voluntad de las comunidades agrícolas."
 infrastructure_investment_programme_decision: "Programa de inversiones en infraestructura"
 infrastructure_investment_programme_decision_desc: "Asociarse con grandes conglomerados industriales para financiar una amplia mejora de infraestructura en toda la base productiva del país. La producción de fábricas y oficinas sube mientras dure el programa, y afianza el papel de los conglomerados como pilar de la economía."