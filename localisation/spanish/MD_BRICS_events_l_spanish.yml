l_spanish:
 brics_join.1.t: "[FROM.GetNameDef] busca la membresía de BRICS"
 brics_join.1.d: "[FROM.GetNameDef] ha solicitado formalmente unirse a BRICS. Como líder del bloque, la decisión de admitirlos descansa con nosotros."
 brics_join.1.a: "Fortalecen el bloque. Admítelos."
 brics_join.1.b: "Su membresía no nos sirve."
 brics_join.2.t: "Nuestra aplicación es aceptada"
 brics_join.2.d: "BRICS ha aprobado nuestra oferta de afiliación. Tomamos nuestro asiento entre las naciones del bloque."
 brics_join.2.a: "Toma nuestro lugar en BRICS"
 brics_join.3.t: "Nuestro BRICS Bid es rechazado"
 brics_join.3.d: "El liderazgo de BRICS ha rechazado nuestra aplicación. La puerta no está cerrada para siempre, y podemos presionar nuestro caso de nuevo a tiempo."
 brics_join.3.a: "Volveremos a aplicar más tarde."
 brics_join.3.b: "Abandona el esfuerzo"
 brics_join.4.t: "[ROOT.GetNameDef] Se une a los BRICS"
 brics_join.4.d: "[ROOT.GetNameDef] ha sido admitido en BRICS, ampliando el alcance y peso del bloque en el orden internacional."
 brics_join.4.a: "Un saldo de cambio"
 brics_join.5.t: "Hora de aproximarse a los BRICS otra vez"
 brics_join.5.d: "Ha pasado bastante tiempo desde nuestro último rechazo. Podemos presentar una nueva solicitud a los líderes de BRICS."
 brics_join.5.a: "Reenviar nuestra solicitud"
 brics_join.5.b: "Aún no."
 brics_join.6.t: "[FROM.GetNameDef] Nos invita a fundar BRICS"
 brics_join.6.d: "[FROM.GetNameDef] está llevando a BRICS a ser y nos ha pedido que estemos entre sus miembros fundadores, formando el bloque desde el principio."
 brics_join.6.a: "Ayudaremos a encontrar BRICS"
 brics_join.6.b: "Mantendremos nuestra distancia."