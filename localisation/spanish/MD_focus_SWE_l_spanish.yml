 Sweden_foci.70.t: "Nuestros objetivos de cooperación militar se cumplieron con éxito."
 Sweden_foci.70.d: "Nuestros esfuerzos han dado frutos y hemos dado otro gran paso adelante en el camino hacia la paz mundial."
 Sweden_foci.70.b: "Hoy es nuestro buen día."
 Sweden_foci.71.t: "Nuestras intenciones de cooperación militar se han visto frustradas."
 Sweden_foci.71.d: "Aunque hemos puesto mucho esfuerzo, nuestro negocio siempre enfrenta contratiempos, pero estamos seguros de que podemos seguir avanzando."
 Sweden_foci.71.b: "No te preocupes, todavía tenemos una oportunidad algún día."
