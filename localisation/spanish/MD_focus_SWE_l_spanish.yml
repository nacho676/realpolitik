 Sweden.300.t: "Sony Ericsson está creado"
 Sweden.300.d: "Ericsson y Sony están listos para combinar sus negocios de teléfonos en una empresa conjunta. Sony aporta diseño de consumo y experiencia mediática, mientras que Ericsson contribuye a la ingeniería de comunicaciones móviles."
 Sweden.300.a: "Formulario Sony Ericsson"
 Sweden.300.b: "Retener los negocios de Ericsson"
 Sweden.301.t: "Estrategia del Handset de Ericsson"
 Sweden.301.d: "El mercado de smartphones se está consolidando a medida que se intensifica la competencia. Ericsson puede dejar los teléfonos de consumo y concentrarse en la infraestructura de red, o comprometer más capital para mantener un negocio de dispositivos totalmente controlado."
 Sweden.301.a: "Salir del negocio de los teléfonos"
 Sweden.301.b: "Reinversión en los teléfonos de Ericsson"
 Sweden.302.t: "Ericsson Acquires Vonage"
 Sweden.302.d: "Ericsson ha completado su adquisición de Vonage, añadiendo servicios de comunicaciones en la nube y una gran base de desarrolladores. La empresa puede construir una plataforma global API de red o mantener su capital concentrado en las redes de radio."
 Sweden.302.a: "Construir la plataforma API de Vonage"
 Sweden.302.b: "Permanecer centrado en las redes de radio"
 Sweden.310.t: "Dieciséis barcos para el cuerpo anfibio"
 Sweden.310.d: "El cuerpo anfibio quiere dieciséis naves de suministro de luz, y Djupvik tiene la línea de aluminio para construirlas. La Marina está pidiendo una especificación militar: montajes de choque, control de daños, un casco que va a dar un golpe. Los clientes comerciales del patio quieren los mismos veinticuatro metros por más bien menos dinero, y lo quieren ahora."
 Sweden.310.a: "Construir el Lätt trosbåt a la especificación naval"
 Sweden.310.b: "Mantenga la línea comercial en funcionamiento"
 Sweden.311.t: "Los Tapper Boats Volver al Yard"
 Sweden.311.d: "La clase Tapper ha estado patrullando el archipiélago desde 1993 y estaba destinada a retirarse hace años. No lo ha hecho. Seis cascos están volviendo a Djupvik, y la pregunta es qué tan profundo va el refit: una suite de sonar Kongsberg completo y nuevos motores, o suficiente acero y pintura para mantenerlos flotando otra década."
 Sweden.311.a: "Ajuste a la suite sonar de Kongsberg"
 Sweden.311.b: "Extender los cascos y nada más"
 Sweden.312.t: "Öckeröborgen toma la pasarela"
 Sweden.312.d: "Cincocientos dieciocho cascos desde 1894, y el patio sigue siendo lo suficientemente pequeño para ser comprado. El grupo Öckeröborgen ha hecho una oferta: capital para la pasarela, un segundo edificio y el capital de trabajo para licitar contratos Djupvik siempre ha sido demasiado pequeño para perseguir. Se pide a la familia que ha manejado el patio durante cuatro generaciones."
 Sweden.312.a: "Tomar la inversión"
 Sweden.312.b: "Mantenga el patio independiente"
