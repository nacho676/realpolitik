 Sweden_foci.2001.d3: "El gobierno sueco nos pidió que adquiriéramos una licencia de producción para el Leopard 2A6 y que actualicemos 122 tanques Strv al estándar Strv 122B, con la intención de mejorar la producción nacional y modernizar sus fuerzas blindadas."
