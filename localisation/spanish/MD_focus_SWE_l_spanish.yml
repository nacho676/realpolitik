 Sweden_foci.1002.d1: "[USA.GetLeader] ha autorizado la transferencia de combatientes avanzados para mejorar nuestras capacidades de fuerza aérea. [SWE.GetLeader] ha expresado profundo reconocimiento por el apoyo del gobierno [USA.GetAdjective] y supervisará su integración personalmente."
