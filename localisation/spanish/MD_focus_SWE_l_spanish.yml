 Sweden_foci.1.t: "Aumento de las capacidades de la flota de luchadores"
 Sweden_foci.1.d: "Mientras nuestros combatientes Gripen producidos internamente sirven como la columna vertebral de nuestra fuerza aérea, integrar aviones complementarios podría reforzar significativamente nuestra versatilidad operacional. Procurar a los combatientes adicionales de asociados internacionales puede mejorar nuestras capacidades estratégicas e influir en las relaciones diplomáticas futuras."
 Sweden_foci.1.o1: "Explore Adquisición de Combatientes U.S.-Manufactured"
 Sweden_foci.1.o2: "Explore Adquisición de combatientes ruso-manufacturados"
