 Sweden_foci.5.d: "Para mejorar nuestras capacidades logísticas y de transporte de tropas, Suecia está evaluando la adquisición de helicópteros de transporte avanzados. Esta iniciativa pretende fortalecer nuestra eficacia operativa y fomentar colaboraciones de defensa internacional."
 Sweden_foci.5.o1: "Comprar MH-60L Black Hawk Helicopters de los Estados Unidos"
 Sweden_foci.5.o2: "Procure Mi-26 Helicópteros de Rusia"
 Sweden_foci.5.o3: "Comprar AS532 Cougar Helicopters de Francia"
 Sweden_foci.5001.t: "Respuesta a la solicitud de adquisición de helicópteros de transporte de Suecia"
 Sweden_foci.5001.d1: "Acabamos de recibir la solicitud de Suecia de adquirir helicópteros MH-60L Black Hawk. La aprobación de esta solicitud fortalecería los lazos de defensa entre las dos naciones y mejoraría las capacidades tácticas de transporte de Suecia."
 Sweden_foci.5001.d2: "Acabamos de recibir la solicitud de Suecia de adquirir helicópteros Mi-26. La aprobación de esta solicitud podría abrir vías para la colaboración militar y aumentar significativamente la capacidad de transporte pesado de Suecia."
 Sweden_foci.5001.d3: "Acabamos de recibir la solicitud de Suecia de adquirir helicópteros AS532 Cougar. La aprobación de esta solicitud fomentaría relaciones de defensa más estrechas y proporcionaría a Suecia capacidades versátiles de transporte de ascensor mediano."
 Sweden_foci.5001.o1: "Decline Solicitud de Suecia"
 Sweden_foci.5001.o2: "Aceptar la solicitud de Suecia"
 Sweden_foci.5002.t: "Aprobación de la Solicitud de Adquisición de Helicópteros de Transporte de Suecia"
 Sweden_foci.5002.d1: "Estados Unidos ha aprobado la solicitud de Suecia de adquirir helicópteros MH-60L Black Hawk. Esta decisión marca un paso significativo en la cooperación de defensa entre las dos naciones."
 Sweden_foci.5002.d2: "Rusia ha aceptado la propuesta de Suecia de comprar helicópteros Mi-26, abriendo nuevas vías para la colaboración militar y mejorando las capacidades de transporte pesado de Suecia."
 Sweden_foci.5002.d3: "Francia ha acordado suministrar helicópteros AS532 Cougar a Suecia, fortalecer los lazos de defensa y proporcionar a Suecia soluciones de transporte versátiles."
 Sweden_foci.5002.o1: "Procede con los planes de adquisición y modernización"
 Sweden_foci.5003.t: "Rechazo de la Solicitud de Adquisición de Helicópteros de Transporte de Suecia"
 Sweden_foci.5003.d1: "Estados Unidos ha rechazado la solicitud de Suecia de adquirir helicópteros MH-60L Black Hawk, citando consideraciones estratégicas y compromisos existentes."
 Sweden_foci.5003.d2: "Rusia ha rechazado la propuesta de Suecia de comprar helicópteros Mi-26, señalando implicaciones geopolíticas y prioridades estratégicas."
 Sweden_foci.5003.d3: "Francia ha rechazado la solicitud de Suecia de adquirir helicópteros AS532 Cougar, centrándose en sus propios requisitos de defensa y políticas de exportación."
 Sweden_foci.5003.o1: "Dile paradoja a geobloquear su país"
 Sweden_foci.6.t: "Ampliando la Flota Submarina de Suecia"
 Sweden_foci.6.d: "Para reforzar nuestras capacidades navales y garantizar la defensa de nuestros intereses marítimos, Suecia está considerando la expansión de su flota submarino. Tenemos varias opciones: adquirir submarinos avanzados de aliados extranjeros o desarrollar nuestro propio diseño indígena."
 Sweden_foci.6.o1: "Procure Tipo 212 Submarines de Alemania"
 Sweden_foci.6.o2: "Procure Lada-Class Submarines de Rusia"
 Sweden_foci.6.o3: "Procure Seawolf-Class Submarines de los Estados Unidos"
 Sweden_foci.6.o4: "Desarrollar un diseño submarino indígena"
 Sweden_foci.6001.t: "Suecia Solicitudes de compra de submarinos"
 Sweden_foci.6001.d1: "El Gobierno sueco ha pedido oficialmente que se adquieran submarinos tipo 212 de Alemania. La aprobación de esta solicitud podría mejorar las relaciones bilaterales de defensa y contribuir a la seguridad regional."
 Sweden_foci.6001.d2: "El gobierno sueco ha pedido formalmente que se adquieran submarinos de la clase Lada de Rusia. La aprobación de esta solicitud podría abrir vías para la colaboración militar e influir en las relaciones futuras."
 Sweden_foci.6001.d3: "El Gobierno sueco ha pedido formalmente que se adquieran submarinos de clase Seawolf de los Estados Unidos. La aprobación de esta solicitud podría fortalecer los lazos de defensa y promover la interoperabilidad entre nuestras armadas."
 Sweden_foci.6001.o1: "Decline Solicitud de Suecia"
 Sweden_foci.6001.o2: "Aceptar la solicitud de Suecia"
 Sweden_foci.6002.t: "Aprobación de la Solicitud de Contratación Submarina de Suecia"
 Sweden_foci.6002.d1: "Alemania ha aprobado la solicitud de Suecia para adquirir submarinos Tipo 212. Esta decisión marca un paso significativo en la cooperación de defensa entre las dos naciones y mejorará las capacidades navales de Suecia."
 Sweden_foci.6002.d2: "Rusia ha aceptado la propuesta de Suecia de comprar submarinos Lada-Class, abriendo nuevas vías para la colaboración militar y potenciando la flota submarino sueca."
 Sweden_foci.6002.d3: "Estados Unidos ha aprobado la solicitud de Suecia para adquirir submarinos Seawolf-Class. Esta decisión refuerza los lazos de defensa y mejora significativamente las capacidades de guerra submarina de Suecia."
 Sweden_foci.6002.o1: "Proceda con los Planes de Adquisición e Integración"
 Sweden_foci.6003.t: "Rechazo de la Solicitud de Contratación Submarina de Suecia"
 Sweden_foci.6003.d1: "Alemania ha rechazado la solicitud de Suecia de adquirir submarinos Tipo 212, citando consideraciones estratégicas y compromisos existentes. Esta decisión puede afectar a la cooperación de defensa futura."
 Sweden_foci.6003.d2: "Rusia ha rechazado la propuesta de Suecia de comprar submarinos Lada-Class, señalando implicaciones geopolíticas y prioridades estratégicas. Este rechazo es una oportunidad perdida para mejorar la colaboración militar."
 Sweden_foci.6003.d3: "Estados Unidos ha rechazado la solicitud de Suecia de adquirir submarinos Seawolf-Class, centrándose en sus propios requisitos de defensa y políticas de exportación. Esta decisión puede afectar a las relaciones diplomáticas futuras."
 Sweden_foci.6003.o1: "Próxima visita del estado servimos Surströmming"
 Sweden_foci.6004.t: "Ceremonia de Comisión de los Nuevos Submarines de Suecia"
 Sweden_foci.6004.d1: "En una ceremonia formal celebrada en Estocolmo, nuestros recién adquiridos submarinos Tipo 212 se encargaron oficialmente a la Marina sueca. Asistieron al evento numerosos representantes alemanes, destacando los vínculos de fortalecimiento entre nuestras naciones y el escenario para la cooperación futura."
 Sweden_foci.6004.d2: "En una ceremonia formal celebrada en Estocolmo, nuestros recién adquiridos submarinos Lada-Class se encargaron oficialmente a la Armada sueca. La presencia de dignatarios rusos subrayó la creciente colaboración de defensa entre nuestros países, potencialmente beneficiando las relaciones futuras."
 Sweden_foci.6004.d3: "En una ceremonia formal celebrada en Estocolmo, nuestros recién adquiridos submarinos Seawolf-Class fueron oficialmente asignados a la Marina sueca. El evento, agraciado por altos funcionarios de los Estados Unidos, destacó la creciente asociación de defensa y su impacto positivo en nuestras relaciones futuras."
 Sweden_foci.6004.d4: "En un momento orgulloso para nuestra nación, los submarinos de desarrollo sueco se encargaron oficialmente a la Marina durante una ceremonia en Estocolmo. Este logro no sólo mejora nuestras capacidades navales, sino que también muestra nuestro compromiso con la autosuficiencia y la innovación en tecnología de defensa."
 Sweden_foci.6004.o1: "Celebrar esta piedra angular en el avance naval"
 Sweden_foci.7.t: "Ampliación de la Flota Corvette de la Marina sueca"
 Sweden_foci.7.d: "Para mejorar nuestras capacidades navales y asegurar la defensa de nuestras aguas territoriales, Suecia está considerando la adquisición de corbetas adicionales. Tenemos varias opciones: adquirir corbetas avanzadas de aliados extranjeros o desarrollar nuestro propio diseño indígena."
 Sweden_foci.7.o1: "Procure MEKO A-100 Corvettes de Alemania"
 Sweden_foci.7.o2: "Procure Tarantul-Class Corvettes de Rusia"
 Sweden_foci.7.o3: "Procure Hamina-Class Corvettes de Finlandia"
 Sweden_foci.7001.t: "Suecia solicita comprar corvettes"
 Sweden_foci.7001.d1: "El Gobierno sueco ha pedido formalmente que se adquieran corbetas del MEKO A-100 de Alemania. La aprobación de esta solicitud podría mejorar las relaciones bilaterales de defensa y contribuir a la seguridad regional."
 Sweden_foci.7001.d2: "El Gobierno sueco ha solicitado formalmente que se adquieran corvettes de la clase Tarantul de Rusia. La aprobación de esta solicitud podría abrir vías para la colaboración militar e influir en las relaciones futuras."
 Sweden_foci.7001.d3: "El Gobierno sueco ha pedido oficialmente que se adquieran corvettes de la clase Hamina de Finlandia. La aprobación de esta solicitud podría fortalecer los lazos de defensa y promover la interoperabilidad entre nuestras armadas."
 Sweden_foci.7001.o1: "Decline Solicitud de Suecia"
 Sweden_foci.7001.o2: "Aceptar la solicitud de Suecia"
 Sweden_foci.7002.t: "Aprobación de la solicitud de adquisición de Corvette de Suecia"
 Sweden_foci.7002.d1: "Alemania ha aprobado la solicitud de Suecia de adquirir corbetas MEKO A-100. Esta decisión marca un paso significativo en la cooperación de defensa entre las dos naciones y mejorará las capacidades navales de Suecia."
 Sweden_foci.7002.d2: "Rusia ha aceptado la propuesta de Suecia de comprar corvettes Tarantul-Class, abriendo nuevas vías para la colaboración militar y potenciando la flota naval sueca."
 Sweden_foci.7002.d3: "Finlandia ha aprobado la solicitud de Suecia de adquirir corvettes Hamina-Class. Esta decisión refuerza los lazos de defensa y promueve la cooperación regional en materia de seguridad."
 Sweden_foci.7002.o1: "Proceda con los Planes de Adquisición e Integración"
 Sweden_foci.7003.t: "Rechazo de la solicitud de adquisición de Corvette de Suecia"
 Sweden_foci.7003.d1: "Alemania ha rechazado la solicitud de Suecia de adquirir corbetas MEKO A-100, citando consideraciones estratégicas y compromisos existentes. Esta decisión puede afectar a la cooperación de defensa futura."
 Sweden_foci.7003.d2: "Rusia ha rechazado la propuesta de Suecia de comprar corbetas Tarantul-Class, señalando implicaciones geopolíticas y prioridades estratégicas. Este rechazo es una oportunidad perdida para mejorar la colaboración militar."
 Sweden_foci.7003.d3: "Finlandia ha rechazado la solicitud de Suecia de adquirir corbetas Hamina-Class, centrándose en sus propios requisitos de defensa y políticas de exportación. Esta decisión puede afectar a las relaciones diplomáticas futuras."
 Sweden_foci.7003.o1: "Pagarán, lanzarán la reunificación ABBA"
 Sweden_foci.7004.t: "Ceremonia de Comisión de las Nuevas Corvettes de Suecia"
 Sweden_foci.7004.d1: "En una ceremonia formal celebrada en Estocolmo, nuestros recién adquiridos corbetes MEKO A-100 fueron oficialmente asignados a la Armada sueca. Asistieron al evento numerosos representantes alemanes, destacando los vínculos de fortalecimiento entre nuestras naciones y el escenario para la cooperación futura."
 Sweden_foci.7004.d2: "En una ceremonia formal celebrada en Estocolmo, nuestros recién adquiridos corvettes de Tarantul-Class fueron oficialmente encargados a la Armada sueca. La presencia de dignatarios rusos subrayó la creciente colaboración de defensa entre nuestros países, potencialmente beneficiando las relaciones futuras."
 Sweden_foci.7004.d3: "En una ceremonia formal celebrada en Estocolmo, nuestros recién adquiridos corvettes Hamina-Class se encargaron oficialmente a la Armada sueca. El evento, agraciado por altos funcionarios de Finlandia, destacó la creciente asociación de defensa y su impacto positivo en nuestras relaciones futuras."
 Sweden_foci.7004.o1: "Celebrar esta piedra angular en el avance naval"
 Sweden_foci.10.t: "Integración Estratégica: Imperativa de Infraestructura"
 Sweden_foci.10.d: "En un mundo cada vez más volátil, la infraestructura ya no es meramente una cuestión de planificación civil. Los ferrocarriles, las redes digitales, los puertos y los corredores de transporte se han convertido en componentes esenciales de la preparación militar y la movilidad estratégica. Suecia ha propuesto formalmente una iniciativa conjunta europea para modernizar e interconectar infraestructura crítica en todo el continente, con un diseño de doble uso tanto para la resiliencia económica como para la utilidad de defensa.\n\nLa propuesta, respaldada por planificadores de defensa suecos y el Ministerio de Empresa, describe un esfuerzo coordinado para ampliar la capacidad logística, estandarizar los protocolos de movilidad militar y fortificar nodos críticos contra el sabotaje o ciberataque. Destaca la necesidad de asegurar conexiones trans-Baltic, mejorar el flujo operativo de la OTAN desde el Ártico a Europa Central y permitir escenarios de despliegue rápido en caso de amenazas híbridas o convencionales.\n\nSi bien se enmarca como una contribución a la cohesión económica de la Unión Europea y los objetivos de transición verde, la lógica subyacente es inequívocamente estratégica. Suecia busca posicionarse no sólo como un centro logístico, sino como una formadora proactiva de la arquitectura geoeconómica y de defensa europea.\n\nLa respuesta de los principales socios europeos definirá si esta iniciativa marca un punto de inflexión en la resiliencia colectiva o es víctima de intereses nacionales fragmentados e inercia política."
 Sweden_foci.10.a: "Aprobar la propuesta, Europa debe estar lista."
 Sweden_foci.10.b: "Rechazar, esto va más allá de la infraestructura civil."
 Sweden_foci.101.t: "[From.GetNamewithFlag] Se une a la Iniciativa de Infraestructura"
 Sweden_foci.101.d: "[From.GetNamewithFlag] se ha comprometido oficialmente a participar en nuestra iniciativa de infraestructura paneuropea. Al hacerlo, reconocen que las carreteras, los puertos y las líneas ferroviarias no son sólo líneas de vida económica, sino activos estratégicos en una era de creciente incertidumbre. Su liderazgo ha reconocido que la logística civil y militar debe armonizarse en toda Europa para garantizar una respuesta rápida, asegurar cadenas de suministro y resiliencia regional.\n\nEsta decisión refuerza la capacidad de nuestros países para soportar y adaptarse a las presiones militares, al tiempo que aumenta el comercio y la cooperación transnacional. Detrás de las escenas, los planificadores militares ya están coordinando protocolos logísticos conjuntos, medidas de ciberresiliencia y rutas de movilidad para imprevistos.\n\nSu participación envía un mensaje poderoso: Europa no será arrebatada de la guardia. La unidad en infraestructura es la unidad en defensa."
 Sweden_foci.101.a: "Una decisión sabia."
 Sweden_foci.102.t: "§Y[From.GetNamewithFlag]§! Rechaza nuestra propuesta"
 Sweden_foci.102.d: "§Y[From.GetNamewithFlag]§! ha rechazado nuestro ofrecimiento de unirse a la iniciativa de infraestructura estratégica, citando preocupaciones de soberanía, limitaciones presupuestarias o prioridades divergentes. Si bien la decisión se enmarca como pragmática, en última instancia indica una renuencia a invertir en capacidad de resistencia y defensa mutua a largo plazo.\n\nEn el clima de seguridad actual, tal pensamiento aislacionista conlleva riesgos. Sin logística integrada, el despliegue rápido de la fuerza se vuelve incierto. Sin normas compartidas, las cadenas de suministro siguen siendo vulnerables. Y sin voluntad política, la disuasión colectiva de Europa se debilita.\n\nAunque lamentablemente, presionaremos adelante con socios dispuestos. Si surge una crisis militar, pueden encontrar que el costo de la inacción supera cualquier ahorro a corto plazo. La infraestructura no es un lujo, sino el andamiaje de la soberanía."
 Sweden_foci.102.a: "Su pérdida."
 Sweden_foci.11.t: "§Y[SWE.GetNamewithFlag]§! Ofrecimientos para unirse a la Iniciativa Cybershield"
 Sweden_foci.11.d: "En el mundo actual, la guerra ya no se limita al campo de batalla o a las armas convencionales. Los conflictos han evolucionado silenciosos, elegantes y a menudo invisibles al ojo público. Los ciberataques, las campañas de desinformación, el sabotaje digital y las operaciones de influencia impulsadas por IA ahora plantean amenazas no sólo a las estructuras militares sino a todos los ciudadanos, instituciones y empresas.\n\n§Y[SWE.GetNamewithFlag]§! nos ha presentado la oportunidad de sumarnos a la Iniciativa Cybershield un marco de cooperación multinacional destinado a fomentar la resiliencia cibernética colectiva. El programa incluye centros de monitoreo conjuntos, inteligencia de amenazas compartidas y respuestas coordinadas a las intrusiones hostiles y tácticas híbridas de guerra.\n\nA medida que la digitalización de nuestra sociedad se profundiza cada año, el dominio cibernético se está convirtiendo en uno de los ámbitos más decisivos de la seguridad nacional. Unirse mejoraría nuestras capacidades y nos incrustara en una red de defensa más grande. Sin embargo, aceptar la oferta implica también cierto grado de alineación tecnológica y soberanía compartida en materia digital."
 Sweden_foci.11.a: "Nos uniremos, unidos somos más seguros."
 Sweden_foci.11.b: "Estamos solos, nuestra fuerza es independencia."
 Sweden_foci.111.t: "§Y[From.GetNamewithFlag]§! Se une a la Iniciativa Cybershield"
 Sweden_foci.111.d: "§Y[From.GetNamewithFlag]§! ha acordado oficialmente participar en nuestra iniciativa Cybershield. Su decisión marca un paso crítico hacia la construcción de una arquitectura paneuropea de defensa digital, donde los socios confiables comparten inteligencia, refuerzan su resistencia cibernética civil y militar, y se unen contra las amenazas híbridas.\n\nComo parte del proceso de integración, se establecerán protocolos conjuntos para la detección de amenazas, la protección crítica de infraestructura y la capacidad de respuesta rápida. Se espera que esta cooperación aumente considerablemente tanto nuestra conciencia operacional como nuestra capacidad de soportar ofensivas cibernéticas complejas y multicapas.\n\nSu compromiso fortalece no sólo nuestra frontera digital afirma una visión compartida de soberanía y autonomía estratégica en el siglo XXI."
 Sweden_foci.111.a: "Excelente, unidad en el ciberespacio."
 Sweden_foci.112.t: "§Y[From.GetNamewithFlag]§! Rechaza la Iniciativa Cybershield"
 Sweden_foci.112.d: "§Y[From.GetNamewithFlag]§! ha rechazado nuestra invitación a unirse a la iniciativa Cybershield. Ya sea motivada por el escepticismo, cálculo político o un deseo de no alineación digital, su decisión envía una señal de que no están dispuestos a incrustarse en un marco colectivo de ciberseguridad.\n\nEste rechazo no sólo debilita el alcance potencial del intercambio de información y la disuasión digital en toda Europa, sino que también puede aislar §Y[From.GetNamewithFlag]§! en una era cuando la desinformación, sabotaje y código hostil no respetan fronteras.\n\nSi bien es decepcionante, su ausencia no va a detener nuestros esfuerzos. Procederemos con aquellos que entienden las apuestas y están dispuestos a actuar en consecuencia."
 Sweden_foci.112.a: "Un movimiento corto."
 Sweden_foci.12.t: "Suecia propone un Foro Económico Mutuo"
 Sweden_foci.12.d: "En una iniciativa encaminada a fortalecer la cooperación regional y la resiliencia industrial, §Y[SWE.GetNameWithFlag]§! ha propuesto la creación de un foro económico mutuo. La idea es institucionalizar el diálogo económico, la coordinación de las inversiones y las alianzas industriales a largo plazo entre los Estados participantes.\n\nSuecia sostiene que la profundización de los vínculos económicos, especialmente en sectores como la tecnología verde, la fabricación avanzada y la innovación digital, no sólo estabilizaría el crecimiento sino que también reforzaría la autonomía estratégica en una economía mundial cada vez más polarizada. Entre los instrumentos propuestos figuran programas conjuntos de adquisiciones, mecanismos de protección de la cadena de suministro y fondos compartidos de innovación.\n\nLa participación en este foro tendría acceso a la investigación compartida, una mayor integración de las estrategias industriales y el potencial para la competitividad a largo plazo a escala continental.\n\nLa pregunta ahora es: ¿Deseamos dar forma a esta nueva arquitectura, o permanecer fuera de ella?"
 Sweden_foci.12.a: "Una excelente iniciativa que nos uniremos."
 Sweden_foci.12.b: "No estamos interesados."
 Sweden_foci.121.t: "§Y[From.GetNamewithFlag]§! Se une al Foro Económico"
 Sweden_foci.121.d: "§Y[From.GetNamewithFlag]§! ha aceptado nuestra propuesta de establecer un foro económico mutuo. Su decisión constituye un paso positivo hacia una mayor coordinación de la política industrial, la resiliencia regional de la cadena de suministro y el crecimiento impulsado por la innovación.\n\nYa se están celebrando conversaciones bilaterales iniciales, que exploran la cooperación en esferas como los sistemas energéticos, los mercados digitales y las tecnologías de transición verde. Esta alianza podría convertirse en un modelo para el desarrollo económico pragmático y autosuficiente en una época de cambio de la dinámica del comercio mundial.\n\nLa iniciativa de Suecia está ganando tracción y con cada nuevo participante, su potencial se multiplica."
 Sweden_foci.121.a: "Una alianza prometedora."
 Sweden_foci.122.t: "§Y[From.GetNamewithFlag]§! Declara la invitación del Foro Económico"
 Sweden_foci.122.d: "§Y[From.GetNamewithFlag]§! ha decidido no participar en el foro económico mutuo propuesto. Ya sea por preocupación por la soberanía, el mal alineamiento de las prioridades o la renuencia a coordinar estrategias económicas, el rechazo limita el alcance de lo que podría haber sido un poderoso marco regional.\n\nAunque lamentablemente, Suecia procederá con socios de mente similar. El objetivo del foro sigue siendo invariable: crear una arquitectura económica resiliente y cooperativa adecuada para un futuro incierto.\n\nSi las circunstancias cambian, la puerta puede estar abierta pero el impulso puede ser difícil de recuperar."
 Sweden_foci.122.a: "Su decisión, sus consecuencias."
 Sweden_foci.13.t: "Suecia Propone Cooperación Estratégica del Tanque de Piensa"
 Sweden_foci.13.d: "§Y[SWE.GetNameWithFlag]§! ha alcanzado una propuesta para intensificar la cooperación entre nuestros principales grupos de reflexión, instituciones académicas y órganos de asesoramiento normativo. El objetivo es alinear las perspectivas estratégicas, coordinar la investigación política a largo plazo y construir una infraestructura de conocimiento compartida capaz de anticipar cambios geopolíticos y amenazas híbridas.\n\nEsa cooperación incluiría diálogos regulares sobre políticas, planificación de escenarios compartidos, publicaciones conjuntas y programas de intercambio de expertos. Suecia cree que al combinar el capital intelectual, nuestros países pueden agudizar su previsión estratégica y prepararse mejor para los desafíos emergentes en defensa, tecnología, seguridad energética y resiliencia económica.\n\nSi bien el foro seguirá siendo independiente del control político directo, su influencia en la formulación de políticas podría ser significativa. La pregunta es: ¿estamos listos para pensar juntos, o seguiremos razonando en forma aislada?"
 Sweden_foci.13.a: "El conocimiento es poder – nos uniremos."
 Sweden_foci.13.b: "Preferimos mantener plena autonomía."
 Sweden_foci.131.t: "§Y[From.GetNameWithFlag]§! Se une a la red de tanques de pensamiento estratégico"
 Sweden_foci.131.d: "§Y[From.GetNameWithFlag]§! ha aceptado nuestra invitación a construir una red cooperativa de instituciones de investigación, centros de estudios estratégicos y grupos de reflexión sobre políticas. Esta nueva capa de colaboración abre un backchannel de intercambio intelectual estructurado, capaz de configurar estrategias nacionales y fomentar la resiliencia contra la desinformación, la guerra cognitiva y la fragmentación de políticas.\n\nEl primer simposio conjunto ya está en planificación. Los temas incluyen la soberanía digital, la fusión militar-civil, las transiciones energéticas y el impacto de las tecnologías emergentes en la seguridad nacional.\n\nEsto es más que un acercamiento académico, es una alineación estratégica a través de ideas."
 Sweden_foci.131.a: "Una elección inteligente."
 Sweden_foci.132.t: "§Y[From.GetNameWithFlag]§! rechaza la cooperación con el think tank estratégico"
 Sweden_foci.132.d: "§Y[From.GetNameWithFlag]§! ha optado por no participar en la red propuesta de Suecia para una cooperación más profunda con los tanques de pensamiento. Ya sea debido a la distancia ideológica, las preocupaciones acerca de la influencia o una preferencia por la autonomía intelectual nacional, su negativa reduce el alcance del diálogo estratégico transfronterizo.\n\nSi bien es lamentable, la iniciativa procederá con participantes dispuestos. En un momento en que la información es un campo de batalla y la perspicacia es un arma, elegir el aislamiento sobre cooperación puede venir a un costo.\n\nLa conversación continuará con o sin ellos."
 Sweden_foci.132.a: "Que pierdan el futuro."
 Sweden_foci.14.t: "Suecia nos invita a un ejercicio militar conjunto"
 Sweden_foci.14.d: "§Y[SWE.GetNameWithFlag]§! ha cursado una invitación a participar en un ejercicio militar coordinado en territorio sueco. Se espera que los simulacros simularán escenarios de defensa multidominio, incluyendo protección costera, resistencia a la guerra cibernética y despliegue rápido de unidades mixtas estándar y nacionales de la OTAN.\n\nMás allá de los beneficios operacionales, esta es también una señal diplomática. Suecia se muestra como un socio de seguridad creíble y está probando tanto su propia preparación como la de sus aliados en condiciones realistas. El ejercicio nos brinda la oportunidad de evaluar las capacidades suecas, perfeccionar nuestra interoperabilidad y fortalecer la confianza mutua.\n\nLos ejercicios militares conjuntos sirven de disuasión y preparación. Si optamos por unirnos, enviaremos un mensaje propio."
 Sweden_foci.14.a: "Participaremos – la fuerza conjunta es una fuerza real."
 Sweden_foci.14.b: "Rechazamos – nuestra doctrina sigue siendo soberana."
 Sweden_foci.141.t: "§Y[From.GetNameWithFlag]§! Se une al ejercicio militar sueco"
 Sweden_foci.141.d: "§Y[From.GetNameWithFlag]§! ha aceptado nuestra invitación a unirse a los próximos ejercicios militares conjuntos. Su participación aumenta el alcance y la complejidad del ejercicio, agregando valiosas pruebas de interoperabilidad entre estructuras de mando, sistemas logísticos y protocolos de coordinación en tiempo real.\n\nSe espera que los observadores de estados aliados y agregados de defensa de terceros países supervisen el evento de cerca. Esta cooperación refuerza visiblemente la seguridad regional y muestra el papel creciente de Suecia como un actor de defensa capaz y confiable.\n\nLa confianza se construye en acción y este ejercicio hablará más alto que las palabras."
 Sweden_foci.141.a: "Una señal fuerte a los posibles adversarios."
 Sweden_foci.142.t: "§Y[From.GetNameWithFlag]§! Declara la invitación del ejercicio militar"
 Sweden_foci.142.d: "§Y[From.GetNameWithFlag]§! ha declinado unirse a nuestros simulacros militares previstos. Si bien no han emitido una razón oficial, la decisión puede derivarse de la precaución política, las preocupaciones logísticas o la renuencia a ser vista alineando demasiado estrechamente con posturas suecas o de defensa de la OTAN.\n\nEsta ausencia puede ser notada tanto por los aliados como por los adversarios. En tiempos de incertidumbre, la voluntad o la falta de voluntad para entrenar juntos dice mucho acerca de la orientación estratégica de una nación.\n\nSin embargo, los ejercicios irán adelante. Los que aparecen, dan forma al futuro."
 Sweden_foci.142.a: "Eligieron el silencio sobre la solidaridad."
 Sweden_foci.143.t: "El ejercicio de la OTAN-Suecia comienza en Norrbotten"
 Sweden_foci.143.d: "Boden, en la remota extensión de Norrbottens län, se ha convertido en el epicentro de uno de los ejercicios militares más ambiciosos jamás realizados en suelo sueco. Normalmente es mejor conocido por el pastoreo de renos, el silencio cubierto de nieve y el grito ocasional de 'Perkele!' que se hace eco a través de la frontera finlandesa, esta tranquila región del norte ahora humea con los movimientos coordinados de tanques, aeronaves y fuerzas especiales.\n\nEl taladro conjunto sueco-OTAN reúne una gama de capacidades modernas: Gripen y Eurofighter squadrons duel en los cielos, múltiples variantes Leopard truenan a través del terreno congelado, y las tropas de élite realizan aterrizajes anfibios simulados en los bordes helados de Buddbyträsket.\n\nMás allá del espectáculo militar, este ejercicio es una señal de preparación estratégica, interoperabilidad aliada y la doctrina sueca de defensa total hecha tangible. La preparación civil y el profesionalismo militar no se oponen a los valores aquí son dos caras de la misma moneda.\n\n§YSi vis pacem, para bellum§! no es sólo retórica latina. Es un principio tejido en la forma nórdica de pensar silenciosa, enfocada y duradera."
 Sweden_foci.143.a: "Un ensayo frío para un mundo más cálido."
 Sweden_foci.23.t: "Suecia establece reclamaciones sobre nuestra tierra"
 Sweden_foci.23.d: "§Y[FROM.GetNameWithFlag]§! ha rechazado la propuesta sueca de integración más profunda. El interés nacional, las barreras constitucionales o la opinión pública parecen haber superado la perspectiva de unificación o alianza.\n\nMientras los canales diplomáticos permanecen abiertos, el revés marca un momento crítico para la visión regional más amplia de Suecia y subraya la fragilidad de la unidad nórdica bajo presión."
 Sweden_foci.23.a: "Deberíamos aceptarlos como colonos."
 Sweden_foci.23.b: "Nunca cruzarán nuestra frontera."
 Sweden_foci.24.t: "Reclamación territorial aceptada"
 Sweden_foci.24.d: "§Y[FROM.GetNameWithFlag]§! ha aceptado la presencia sueca en las regiones reclamadas. El acuerdo, enmarcado como un arreglo controlado y un proceso de coordinación bilateral, cambia eficazmente la influencia administrativa a favor de Suecia.\n\nLa facilidad de las tensiones, los proyectos de infraestructura comienzan y surgen mecanismos conjuntos de gobernanza aunque las cuestiones relativas a la soberanía a largo plazo siguen siendo políticamente sensibles."
 Sweden_foci.24.a: "Inicio de los preparativos para la integración"
 Sweden_foci.25.t: "Rechazo de la reclamación territorial"
 Sweden_foci.25.d: "§Y[FROM.GetNameWithFlag]§! ha rechazado firmemente la reivindicación territorial hecha por §Y[ROOT.GetNameWithFlag]§!.\n\nEn la declaración oficial se hizo hincapié en la integridad nacional y se advirtió que toda nueva participación sueca en la zona objeto de controversia se consideraría un acto hostil. El tono diplomático se endurece, y el riesgo de inestabilidad regional aumenta."
 Sweden_foci.25.a: "No olvidaremos esto."
 Sweden_foci.26.t: "Separatistas suecos exigen unirse a la península"
 Sweden_foci.26.d: "Un grupo de separatistas de habla sueca en una de nuestras regiones ha solicitado oficialmente la anexión del Reino de Suecia. Afirman vínculos históricos, afinidad cultural y discriminación por parte de las autoridades locales.\n\nMientras §YSuecia§! no ha respaldado oficialmente este movimiento, las voces públicas en Estocolmo hablan de 'unificación nacional'."
 Sweden_foci.26.a: "Esta es nuestra tierra sagrada."
 Sweden_foci.26.b: "Pueden tenerlo temporalmente."
 Sweden_foci.27.t: "Suecia envía una invitación de facción"
 Sweden_foci.27.d: "§YSuecia§! nos ha invitado oficialmente a unirse a su nueva facción nórdica propuesta. Enmarcada como una coalición de estados neutrales, democráticos o no alineados, la alianza pretende mejorar la disuasión regional, coordinar la política de defensa y construir una identidad geopolítica compartida.\n\nLos vínculos históricos, la proximidad cultural y el interés compartido en la autosuficiencia se citan como fundamentos pero las implicaciones estratégicas siguen siendo complejas."
 Sweden_foci.27.a: "Una gran idea – debemos unirnos"
 Sweden_foci.27.b: "¿Están borrachos? No hay posibilidad"
 Sweden_foci.28.t: "Invitación de la facción Denied"
 Sweden_foci.28.d: "§Y[FROM.GetNameWithFlag]§! ha rechazado la invitación de Suecia a unirse a la facción nórdica. Citando riesgos de enredo, pérdida de soberanía o escepticismo hacia las ambiciones estratégicas de Suecia, el gobierno ha optado por la distancia.\n\nEl rechazo pone en duda la cohesión de los esfuerzos regionales de defensa y puede señalar una creciente polarización en el norte de Europa."
 Sweden_foci.28.a: "Decepcionante, pero esperada"
 Sweden_foci.29.t: "Invitación de Facción Aceptada"
 Sweden_foci.29.d: "§Y[FROM.GetNameWithFlag]§! se ha unido oficialmente a la facción nórdica. La decisión marca un punto de inflexión decisivo en la diplomacia regional, confirmando el alineamiento con la visión de Suecia de disposición militar coordinada, intercambio tecnológico y autonomía política exterior.\n\nLa planificación militar conjunta y la cooperación industrial probablemente seguirán solidificando un nuevo bloque de energía en el Norte."
 Sweden_foci.29.a: "Les damos la bienvenida con los brazos abiertos"
 Sweden_foci.30.t: "Inversión sueca en nuestro sector bancario"
 Sweden_foci.30.d: "§YSuecia§! ha ofrecido una iniciativa de inversión estructurada destinada a modernizar y estabilizar nuestro sector bancario nacional. La propuesta incluye inyecciones de capital, acceso a tecnologías financieras nórdicas y integración a largo plazo en la esfera de influencia monetaria de Suecia.\n\nMientras que el programa promete liquidez y modernización, algunos temen aumentar la influencia extranjera sobre las políticas fiscales nacionales."
 Sweden_foci.30.a: "Aceptar la oferta – Capital y estabilidad"
 Sweden_foci.30.b: "Decline – Protegemos nuestra soberanía fiscal"
 Sweden_foci.31.t: "Inversión bancaria Aceptada"
 Sweden_foci.31.d: "§Y[FROM.GetNameWithFlag]§! ha acordado nuestra propuesta de invertir en su sistema bancario nacional. Los modelos de capital y gobernanza financiera suecos se introducirán en etapas, lo que traerá tanto la modernización como la influencia.\n\nEsto profundiza el alcance económico de Suecia y podría allanar el camino para una mayor armonización de las regulaciones fiscales y la coordinación monetaria regional."
 Sweden_foci.31.a: "Una fuerte posición financiera"
 Sweden_foci.32.t: "Inversión bancaria Rechazada"
 Sweden_foci.32.d: "§Y[FROM.GetNameWithFlag]§! ha rechazado nuestra oferta de invertir en su sector bancario. Motivada por preocupaciones sobre la autonomía nacional, el retroceso político o las alianzas concurrentes, su decisión marca un claro límite para la extensión económica sueca.\n\nLa cooperación futura puede retrasarse y la confianza en las empresas conjuntas se ha debilitado al menos por ahora."
 Sweden_foci.32.a: "Su pérdida, no la nuestra"
 Sweden_foci.33.t: "Suecia propone apoyo económico 'Flexible'"
 Sweden_foci.33.d: "Una delegación sueca ha llegado con una propuesta de «desbloquear nuestro potencial de crecimiento» mediante la inversión directa en sectores financieros y estratégicos. Si bien el paquete promete financiación para el desarrollo y apoyo logístico, incluye las expectativas informales de indulgencia regulatoria, acceso interno y alineación con ciertos intereses extranjeros.\n\nYa sea visto como cooperación pragmática o interferencia silenciosa, el acuerdo difumina la línea entre la ayuda económica y la influencia."
 Sweden_foci.33.a: "Aceptar pero hacer cumplir una estricta supervisión para limitar la corrupción"
 Sweden_foci.33.b: "Si no hay ganancia para nosotros personalmente, ¿por qué molestarnos?"
 Sweden_foci.331.t: "Acuerdo de Inversión Aceptado"
 Sweden_foci.331.d: "§Y[FROM.GetNameWithFlag]§! ha aceptado nuestra oferta de cooperación económica estratégica. Su Gobierno convino en abrir sectores selectos al capital sueco a cambio de una ayuda específica para el desarrollo e influencia informal. La puerta a la alineación a largo plazo se desbloquea ahora tranquila pero eficazmente."
 Sweden_foci.331.a: "Un éxito discreto"
 Sweden_foci.332.t: "Oferta de inversión rechazada"
 Sweden_foci.332.d: "§Y[FROM.GetNameWithFlag]§! ha rechazado nuestra iniciativa de inversión. Oficialmente citando las preocupaciones de soberanía nacional y transparencia, su gobierno optó por renunciar al acuerdo propuesto. El rechazo limita nuestro alcance en la región por ahora."
 Sweden_foci.332.a: "Se arrepentirán de eso."
 Sweden_Forsvarsbeslutet.1.t: "Un nuevo mandato, un camino militar"
 Sweden_Forsvarsbeslutet.1.d: "La elección ha terminado. Un nuevo gobierno toma posesión, y como exige la tradición, Su Majestad el Rey leerá la declaración de apertura del Riksdag.\n\nDesde los bosques solitarios de Lappland hasta el puente Öresund, desde los acantilados barridos de Gotland hasta las cumbres cubiertas de nieve de Helagsfjäll, la gente sueca escucha.\n\n¿Qué rumbo vamos a establecer para nuestras fuerzas armadas? ¿Fortaleceremos nuestra capacidad para defender la patria manteniendo cerca a nuestros regimientos y nuestra disposición fuerte? ¿Proyectaremos nuestra fuerza en el extranjero, uniéndonos a coaliciones y misiones de mantenimiento de la paz que conllevan riesgos, pero que puedan mantener las amenazas lejos de nuestras fronteras? ¿O aceptaremos la calma del presente y cambiaremos los recursos en otros lugares, confiando en la diplomacia y la paz?\n\nEl gobierno tiene un mandato. Ahora debe elegir."
 Sweden_Forsvarsbeslutet.1.o1: "Fortalecer las capacidades de la patria."
 Sweden_Forsvarsbeslutet.1.o2: "Ampliar nuestra capacidad de actuar en el extranjero."
 Sweden_Forsvarsbeslutet.1.o3: "Retrocede al ejército."
 Sweden_Forsvarsbeslutet.2.t: "Una cuestión del acero y la estrategia"
 Sweden_Forsvarsbeslutet.2.d: "El camino es el que nuestro gobierno ha elegido fortalecer las fuerzas armadas de Suecia. Pero la fuerza viene en muchas formas.\n\nEn un campamento, las voces son claras: comprar nuevos STRV 122 tanques y CV 90 vehículos de combate de infantería. Herramientas probadas, familiares a nuestros soldados, listos para ser desplegados en los bosques y campos que fueron hechos para.\n\nOtros piden precaución. ¿Por qué gastar ahora, preguntan cuándo el mundo de mañana exigirá nuevos sistemas y diseños más inteligentes? Mejor invertir en ingenieros de desarrollo, laboratorios e ideas que puedan dar forma a la próxima generación de defensa sueca.\n\nEntonces hay quienes ven números. Frío, límites fiscales. Ellos apuntan a las hojas de cálculo en Finansdepartementet y sacuden sus cabezas. El testamento puede estar allí, pero el dinero no lo es.\n\nEl Riksdag debe decidir una vez más."
 Sweden_Forsvarsbeslutet.2.a: "Ordene nueva STRV 122s y CV 90s fuerza confiable, aquí y ahora."
 Sweden_Forsvarsbeslutet.2.b: "Invierte en R&D y prepárate para la próxima generación."
 Sweden_Forsvarsbeslutet.2.c: "Simplemente no podemos permitírnoslo este año."
 Sweden_Forsvarsbeslutet.3.t: "El cielo sobre nosotros"
 Sweden_Forsvarsbeslutet.3.d: "Un ejército moderno es tan fuerte como las alas de arriba. Como parte de nuestro renovado esfuerzo de defensa, ahora debemos decidir el futuro de nuestra fuerza aérea.\n\nEl Gripen rápido, ágil y orgulloso sueco. Algunos instan a un nuevo ciclo de adquisiciones, a ampliar nuestros escuadrones y asegurarnos de que estamos listos para los cielos del mañana con el avión en el que confiamos hoy.\n\nOtros argumentan por una ruta diferente. Ellos ven amenazas futuras no en peleas de perros, sino en sistemas de sigilo, sensores, precisión. Los fondos, dicen, deben ir al desarrollo, no al despliegue.\n\nPero en las tranquilas habitaciones del Ministerio de Finanzas, el estado de ánimo es más sobrio. Enthusiasm cumple con los techos del presupuesto. El patriotismo cumple con la contabilidad.\n\nUna vez más, el gobierno debe elegir."
 Sweden_Forsvarsbeslutet.3.a: "Ordene nuevos cazas JAS 39 Gripen preparados para los cielos de mañana."
 Sweden_Forsvarsbeslutet.3.b: "Invertir en aeroespacial R&D diseñar el próximo salto adelante."
 Sweden_Forsvarsbeslutet.3.c: "Este año no hay dinero para las alas."
 Sweden_Forsvarsbeslutet.4.t: "Acero, Pistas y Alas"
 Sweden_Forsvarsbeslutet.4.d: "Tierra y aire. Motores de acero y jet. El corazón de la defensa sueca siempre ha descansado en la armonía de las fuerzas que trabajan juntas.\n\nAlgunos proponen que todos vayamos a adquirir nuevos tanques STRV 122, CV 90 vehículos de combate para infantería y escuadrones frescos de luchadores Gripen. Una modernización de espectro completo para hacer a Totalförsvaret más que una doctrina: una realidad.\n\nOtros sugieren paciencia. Mejor invertir en futuros diseños más ligero, inteligente, más eficiente. No debemos construir para hoy lo que será obsoleto mañana.\n\nY entonces, por supuesto, la realidad llama. Hay hojas de cálculo, límites, promesas hechas en otros lugares. La ambición se encuentra con austeridad. Los cofres no son infundados.\n\nAhora decidimos cómo es la fuerza."
 Sweden_Forsvarsbeslutet.4.a: "Comprar CV 90s, STRV 122s y Gripens equipar una fuerza moderna, ahora."
 Sweden_Forsvarsbeslutet.4.b: "Enfoque en la forja tecnológica a largo plazo de la próxima generación primero."
 Sweden_Forsvarsbeslutet.4.c: "Queremos pero no podemos permitírnoslo."
 Sweden_Forsvarsbeslutet.10.t: "Försvarsbeslutet 2000: ¿Tijeras o escudos?"
 Sweden_Forsvarsbeslutet.10.d: "En los salones de madera del Riksdag, las tazas de café se conectan y las negociaciones suaves se desarrollan con toda la urgencia de una fría mañana de enero. El Försvarsutskottet presenta sus hallazgos, y la sala está llena de fideos, cejas surtidas, y el arte intranslatable del compromiso sueco medido.\n\nFuera de la capital, el humor es diferente. En Boden y Revingehed, los oficiales se preguntan si sus regimientos sobrevivirán otra ronda de recortes. Los barracones de conscript se sienten más vacíos de lo que deberían. En todo el país, la gente leyó los titulares y suspiro. Es, después de todo, una cosa muy sueca para debatir la política de seguridad con una hoja de cálculo en una mano y un principio de neutralidad en la otra.\n\nEl nuevo Försvarsbeslutet propone reducción de gastos, consolidación de unidades y reducción de las fuerzas permanentes. Los críticos advierten de una postura debilitadora en un mundo impredecible. Los partidarios lo llaman responsabilidad fiscal en un tiempo de paz. Como siempre, el resultado final es un compromiso.\n\nNo estamos desarmando. Pero estamos disminuyendo silenciosamente, cortésmente y con gran preocupación por el proceso.\n\nTotalförsvaret permanece en papel. Si permanece en la práctica... dependerá de lo que el futuro demanda."
 Sweden_Forsvarsbeslutet.10.a: "Suecia se beneficiará del sistema de registros"
 Sweden_Forsvarsbeslutet.10.b: "Suecia se aloja con las brigadas"
 Sweden_Forsvarsbeslutet.11.t: "El bloqueo de la reforma"
 Sweden_Forsvarsbeslutet.11.d: "La tinta apenas está seca. Desde las costas heladas de Öresund hasta los campos congelados de Lappland, soldados, funcionarios públicos y ciudadanos comunes esperan la siguiente señal: ¿cuándo entrará en vigor el nuevo Försvarsbeslutet?\n\nEn las reuniones del personal y los ayuntamientos, la pregunta es como vapor de café matutino. Las unidades se preguntan cuándo cambiarán sus presupuestos. Los municipios miran a los planes de infraestructura. Algunos están listos para mover a otros preferirían otra ronda de discusiones tranquilas.\n\nEste es el camino sueco. Calma, medida, deliberada. Nadie grita. Nadie entra en pánico. Pero todo el mundo sabe: Totalförsvaret sólo funciona si la maquinaria está bien cubierta y los engranajes giran en sincronización.\n\nAhora viene el asunto del tiempo. No si pero cuando."
 Sweden_Forsvarsbeslutet.11.a: "Deberíamos estar listos en unos 6 meses."
 Sweden_Forsvarsbeslutet.11.b: "Es mejor que lo pongas en fase. Comienza el próximo año."
 Sweden_Forsvarsbeslutet.11.c: "Hazlo lo más rápido posible."
 Sweden_news.1.o1: "Un nuevo gigante financiero emerge en el Norte."
 Sweden_news.2.t: "Profundiza la cooperación nórdica y báltica"
 Sweden_news.2.d: "En la actualidad, representantes de Suecia, Noruega, Dinamarca, Finlandia, Islandia, Estonia, Letonia y Lituania firmaron una declaración oficial por la que se fortalecía la asociación Nordic-Baltic Eight (NB8). Este marco regional coordinará las discusiones normativas en áreas tales como asuntos exteriores, defensa, infraestructura digital y resiliencia climática.\n\nAunque no es una alianza militar, el NB8 se considera ampliamente como una respuesta estratégica al aumento de la incertidumbre geopolítica en la región. Los observadores observan su potencial para convertirse en un bloque septentrional con peso diplomático compartido y mecanismos de política regional integrados."
 Sweden_news.2.o1: "Unidad a través de intereses compartidos y geografía."
 Sweden_news.3.t: "Sindicato NORDCAPS establecido"
 Sweden_news.3.d: "Estocolmo ha anunciado la formación del Enfoque Coordinador Nórdico para la Paz y la Seguridad o NORDCAPS una nueva iniciativa escandinava diseñada para mejorar la planificación conjunta de defensa, interoperabilidad e intercambio de inteligencia entre las naciones miembros.\n\nSi bien no es una alianza militar oficial, NORDCAPS servirá de plataforma para la cooperación estructurada en materia de seguridad entre Suecia, Noruega, Dinamarca y Finlandia. Los defensores lo ven como un complemento flexible y nórdico a las estructuras de defensa europeas existentes.\n\nLos ejercicios, la coordinación de crisis y las evaluaciones estratégicas compartidas constituirán la columna vertebral de la cooperación que avanza."
 Sweden_news.3.o1: "Escandinavia está unido."
 Sweden_news.4.t: "El ejercicio es todo alrededor de nosotros"
 Sweden_news.4.d: "A través de las ciudades tranquilas y carreteras rurales de Suecia, el ruido de los motores y el rugido de las turbinas de jet han reemplazado la quietud habitual. JAS 39 Los combatientes Gripen se despegan y aterrizan en pistas de aterrizaje improvisadas carreteras ordinarias ahora sirven como puntos de lanzamiento para la defensa aérea. En los bosques densos de Småland y Värmland, STRV 122 tanques y CV 90 vehículos de combate de infantería se desplazan por el suelo como depredadores de acero. Las municiones de entrenamiento se hacen eco a través del paisaje.\n\nPara muchos civiles, la realización se establece: estamos en medio de un ejercicio militar. Totalförsvaret no es sólo teoría que es experiencia vivida. Todo el país es parte de la perforación.\n\nAlgunos encuentran seguridad en la preparación. Otros sienten el peso de lo que implica."
 Sweden_news.4.o1: "La nación entrena como uno."
 Sweden_news.5.t: "Se están llevando a cabo fortificaciones estratégicas"
 Sweden_news.5.d: "Se levantan muros de hormigón donde los bosques se quedaron sin perturbar. Los ingenieros refuerzan puentes con malla de acero y cargas en forma. En el norte, los bunkers cavan en granito; en el sur, las trincheras antitanque se extienden a través de tierras agrícolas como cicatrices.\n\nEsto no es un retorno al pasado es la forma de defensa moderna. De Östersund a Karlskrona, Suecia se sujeta. Cada puesto de control, cada agujero de zorro, cada túnel reforzado es un mensaje: no seremos atrapados sin preparación.\n\nTotalförsvaret convierte el terreno en fortaleza. El país no duerme pone su mandíbula."
 Sweden_news.5.o1: "Que los bosques peleen con nosotros."
 Sweden_news.6.t: "Forjando líderes para el frente"
 Sweden_news.6.d: "En las aulas y en los rangos de fuego directo, se están formando los futuros comandantes de Suecia. La teoría táctica da paso a los simulacros de humo y ejercicios de mesa de arena; la presión de las decisiones tomadas en minutos endurece el instinto en la doctrina.\n\nDe Försvarshögskolan a puestos de batallón remoto, los oficiales perfeccionan la habilidad que separa el orden del caos. En Totalförsvaret, el liderazgo no es opcional es la base de supervivencia.\n\nNo esperamos que la guerra nos enseñe. Nos preparamos con antelación."
 Sweden_news.6.o1: "Una mente aguda conduce manos firmes."
 Sweden_news.7.t: "La gente en uniforme"
 Sweden_news.7.d: "Llegan en camuflaje descolorido, cargando rifles estándar y termosas desde casa. Son maestros, mecánicos, estudiantes ciudadanos. Pero esta semana, son Hemvärnet.\n\nA través de bosques y tierras agrícolas, los ejercicios de defensa doméstica se desarrollan con el realismo sorprendente. Los bloqueos de carretera suben por la noche. Las comunicaciones se prueban en condiciones de apagón. Las cocinas de campo alimentan batallones. Los niños observan desde porches mientras pasan los convoyes.\n\nEste no es el ejército que viene al pueblo. Es la gente convirtiéndose en el ejército."
 Sweden_news.7.o1: "Preparado en paz, listo en crisis."
 Sweden_news.8.t: "La Casa de Marzo comienza"
 Sweden_news.8.d: "Los cascos salen. Los puntos de control desaparecen. Roads once patrolled by armoured vehicles now host bikes and summer traffic. Las unidades movilizadas de Hemvärnet se paran, dejando atrás pequeñas pero rutas en el suelo y un recuerdo del movimiento.\n\nSin embargo, algo se agudiza. En todas las aldeas que albergaban un pelotón, en cada bosque despejado para la formación, hay un cambio sutil. Volvimos a la normalidad, pero lo normal ahora sabe cómo se siente la preparación.\n\nTotalförsvaret nos enseñó que la seguridad no es la ausencia del miedo. Es la presencia de preparación."
 Sweden_news.8.o1: "Normal, pero nunca más ingenuo."
 Sweden_news.9.t: "Una nación llamada a la soberbia"
 Sweden_news.9.d: "La orden de activación llegó justo después del amanecer. Dentro de horas, los uniformes fueron desempaquetados, las armas recolectadas, las radios rotas a la vida. En ciudades y puestos de avanzada en Suecia, la tranquila maquinaria de movilización comenzó a humedecer.\n\nHemvärnet no llega con la ceremonia simplemente aparece. Las intersecciones de carretera están aseguradas. Los centros de comunicaciones están gestionados. Los bosques susurran de nuevo con el movimiento.\n\nNo hay pánico. Sólo determinación. El país ha entrenado para este momento. Ahora, lo promulga."
 Sweden_news.9.o1: "Gente ordinaria. Preparaciones extraordinarias."
 Sweden_news.10.t: "Försvarsbeslutet 2000 viene a la fuerza"
 Sweden_news.10.d: "La nueva estructura está en su lugar. En todo el país, las columnas de vehículos blindados se deslizan por ciudades tranquilas y se dirigen hacia sus guarniciones reestructuradas. Los niños miran con asombro mientras los gigantes de acero pasan por sus escuelas, sus imaginaciones removidas por el ruido de la preparación.\n\nEn Boden, Skövde y Enköping, la vida comienza a cambiar. Las mujeres jóvenes se inclinan contra las vallas, viendo la llegada de los reclutas desde cada rincón del país se enfrenta a nuevos frentes hacia el norte, dibujados por el deber. Hay una chispa familiar en los ojos, un guiño a la tradición, a los lentos ritmos del servicio compartido.\n\nEl número de unidades ha cambiado. El mapa de la defensa sueca es redireccionado. Pero la esencia sigue: personas, propósito y preparación. *Totalförsvaret* no ha desaparecido. Simplemente se ha movido a menos y más fuertes fundaciones."
 Sweden_news.10.a: "Una nueva Millennia ha comenzado"
 Sweden_news.11.t: "Continuidad en un mundo cambiante"
 Sweden_news.11.d: "Si bien algunos analistas de los presupuestos con ojos cansados en el Ministerio de Finanzas están visiblemente disgustados con la decisión de mantener una fuerza armada tan considerable, no todos comparten su preocupación. En Boden, un grupo de jóvenes reclutas ahora con un verdadero camino hacia el servicio profesional se rompen en una actuación espontánea de *Dancing Queen* en el patio cubierto de nieve. Es una escena extrañamente conmovedora, parte de la sátira, parte del orgullo. Un momento emocional poco común madura a través de la nación.\n\nIncluso Su Majestad el Rey, generalmente reservado en asuntos de estado, escribe una carta manuscrita al Riksdag agradeciendo a sus miembros por su sabiduría y por preservar una tradición que desde hace mucho tiempo ha sido un pilar de la independencia sueca."
 Sweden_news.11.a: "Una estructura que vale la pena defender."
 Sweden_news.12.t: "Fondo nacional sueco para invertir en Cryptocurrency"
 Sweden_news.12.d: "Si bien Suecia nunca ha sido conocida por los movimientos audaces de la política monetaria, el ritmo de la innovación financiera mundial ha hecho que la vacilación sea un riesgo en sí misma. Hoy, en un anuncio histórico, el Rey declaró que el fondo nacional de jubilación será autorizado para ampliar su cartera invirtiendo directamente en criptomonedas e incluso en operaciones mineras de criptomoneda.\n\nLos partidarios aclaman la decisión como visionaria y necesaria para la futura economía sueca, mientras que los críticos advierten de la volatilidad e incertidumbre que aún rodean los activos digitales.\n\nSin embargo, la edad del cripto ha alcanzado oficialmente el corazón financiero de Suecia."
 Sweden_news.12.a: "Un paso audaz hacia el futuro."
 Sweden_news.20.t: "Agenda: «El precio de la neutralidad»"
 Sweden_news.20.d: "En su última emisión, Agenda abordó 'El precio de la neutralidad'. Economistas, ex diplomáticos y oficiales militares debatieron los costos tangibles y beneficios de la postura no alineada de Suecia. «Perdemos influencia, pero mantenemos independencia», dijo un experto. Otros señalaron la pérdida de oportunidades en materia de cooperación en materia de seguridad y desarrollo de armamentos. El espectáculo puso de relieve una verdad difícil: mientras que la neutralidad ofrece libertad, a menudo viene a expensas del apalancamiento, el acceso y la seguridad. A medida que el mundo crece más volátil, el viejo modelo se enfrenta a nuevas preguntas."
 Sweden_news.20.a: "El costo de principio es raramente barato."
 Sweden_news.21.t: "Agenda: «Pregúntale al Ministro – Diálogo Público sobre Defensa»"
 Sweden_news.21.d: "La agenda emitió un segmento en vivo titulado 'Pregúntele al Ministro', donde los ciudadanos cuestionaron directamente al Ministro de Defensa de Suecia. Los temas van desde el gasto militar hasta las alianzas estratégicas. Cuando se le preguntó acerca de la neutralidad, el Ministro respondió: «Nuestra política se adapta al mundo, pero nuestros principios permanecen.» Mientras algunos elogiaron la apertura, otros llamaron a las respuestas evasivas. Los espectadores se quedaron reflexionando sobre si esto era un diálogo significativo o relaciones públicas pulidas. Una cosa era cierta: la confianza pública debe ser ganada, no gestionada."
 Sweden_news.21.a: "La gente está vigilando y juzgando."
 Sweden_news.22.t: "Agenda: «¿Conciencia de seguridad o movilización silenciosa?»"
 Sweden_news.22.d: "En un episodio titulado 'Security Awareness or Quiet Mobilization?', Agenda abordó la línea fina entre información y alarma. Con folletos gubernamentales y PSA en aumento, los panelistas debatieron si esto refleja la transparencia o la militarización sutil. «¿Nos están pidiendo que nos preparemos pero para qué exactamente?» preguntó un profesor de comunicaciones. Otros sostuvieron que las naciones democráticas deben fomentar la preparación civil sin temor. El episodio capturó un creciente malestar: ¿Suecia se prepara para la guerra o simplemente preparando la mente pública?"
 Sweden_news.22.a: "El mensaje es claro pero el motivo no lo es."
 Sweden_news.23.t: "Agenda: «¿Una campaña simbólica para preparar a los ciudadanos?»"
 Sweden_news.23.d: "Agenda investigó una reciente campaña pública lanzada por las autoridades suecas para sensibilizar a la defensa civil y la seguridad nacional. Titulado '¿Una campaña simbólica para preparar a los ciudadanos?', el segmento cuestionó si la iniciativa tiene sustancia o simplemente intención simbólica. «Parece más como teatro que preparación», dijo un invitado. Otros defendieron el programa como un primer paso necesario para aumentar la resiliencia pública. El espectáculo capturó a una sociedad en tensión tranquila consciente de los crecientes riesgos, inseguro cómo responder."
 Sweden_news.23.a: "La preparación pública sigue siendo más aspiración que el hecho."
 Sweden_news.24.t: "Agenda: «El camino sueco - Entre el idealismo y Realpolitik»"
 Sweden_news.24.d: "En una discusión reflexiva titulada «El camino sueco», Agenda exploró si la diplomacia moral de Suecia todavía se alinea con su comportamiento de política exterior. «Afirmamos liderar con valores», dijo un periodista, «pero nuestras exportaciones de armas y estrategias de alianza sugieren lo contrario.» El debate tocó todo desde el mantenimiento de la paz de la ONU a acuerdos industriales militares. El segmento cerró con una pregunta provocativa: ¿Es 'el camino sueco' un principio guía o simplemente un ejercicio de marca en un mundo cínico?"
 Sweden_news.24.a: "El mito del excepcionalismo moral se encuentra escrutinio."
 Sweden_news.25.t: "Agenda: «¿Qué significa la neutralidad para nosotros hoy?»"
 Sweden_news.25.d: "La agenda planteó una pregunta señalada: «¿Qué significa la neutralidad para nosotros hoy?» El segmento contó con un debate espírita sobre el legado y futuro de la neutralidad sueca. Los académicos argumentaron si la cooperación con las fuerzas militares occidentales compromete los valores tradicionales. Un general retirado insistió: «La neutralidad siempre fue sobre la independencia estratégica, no el aislamiento».El público quedó sin una respuesta clara solamente la conciencia de que el concepto, una vez piedra angular nacional, ahora requiere un repensamiento profundo a la luz de las nuevas realidades geopolíticas."
 Sweden_news.25.a: "Se está redefiniendo un principio básico de identidad sueca."
 Sweden_news.26.t: "Agenda: «¿Un mundo multipolar – oportunidad o amenaza?»"
 Sweden_news.26.d: "Esta semana, Agenda examinó las implicaciones de un orden mundial multipolar para Suecia. El programa contó con analistas de defensa y académicos de política exterior que debatían si un sistema global menos dominado por Estados Unidos crea oportunidades para la autonomía sueca o mayor peligro. Un experto advirtió: «La multitipolaridad no significa paz, sino imprevisibilidad». Otros contrarrestaron que Suecia puede beneficiarse de nuevos poderes de equilibrio. Como los principales estados realign, el programa destacó un dilema emergente: si Suecia debe permanecer estratégicamente ágil o comenzar a elegir lados."
 Sweden_news.26.a: "Suecia refleja su posición en un mundo cambiante."
 Sweden_news.27.t: "Agenda: «La Otra Europa»"
 Sweden_news.27.d: "El segmento de la agenda titulado «La Otra Europa» invitó a los suecos a reexaminar su lugar en el continente. Los panelistas discutieron cómo Suecia desafía históricamente la simple categorización Este-Oeste. «Somos parte de Europa», dijo un historiador, «pero a menudo sienten que los forasteros dentro tanto de la OTAN como de la UE.»El diálogo exploró la idea de un 'tercer espacio' en la política europea una esfera para estados neutrales y democráticos que traza caminos independientes. Pero el espectáculo también preguntó: ¿Es esta visión realista, o es la creación de mitos nostálgicos en un mundo cada vez más polarizado?"
 Sweden_news.27.a: "Los suecos se preguntan dónde pertenecen realmente."
 Sweden_news.28.t: "Agenda: «¿Llamando al Arrogante Oeste?»"
 Sweden_news.28.d: "En el episodio de anoche de la Agenda del SVT, el tema 'Blaming the Arrogant West?' provocó una discusión cargada. El estudio reunió a ex embajadores, analistas de políticas y académicos para reflexionar sobre si la distancia creciente de Suecia con el liderazgo occidental está enraizada en desilusión. Un invitado señaló: «Hay un sentido creciente de que los poderes occidentales esperan obediencia, no diálogo.» Otro añadió: «La neutralidad no es sumisión es una postura». La conversación destacó una crítica creciente dentro de la sociedad sueca: que ser marginado en la política internacional puede no ser una cuestión de neutralidad, sino de orgullo."
 Sweden_news.28.a: "El debate continúa a través de mesas de cena y periódicos."
 Sweden_news.29.t: "Agenda: «¿Un nuevo Ostpolitik?»"
 Sweden_news.29.d: "La Agenda de anoche hizo una pregunta raramente planteada en la política general: «¿Debería Suecia volver a conectarse con el Este?» El tema no se refería a la nostalgia de la Guerra Fría, sino a la diplomacia pragmática con Rusia y sus vecinos. Los críticos lo llamaron ingenuo «No puedes construir confianza en la agresión», dijo un panelista. Pero otros argumentaron que el aislamiento sólo refuerza la hostilidad. «El diálogo no es aval», contrarrestó a un ex embajador. El espectáculo generó reflexiones incómodas sobre si la alineación estratégica total de Suecia con Occidente ha reducido su flexibilidad diplomática. ¿Podría el compromiso selectivo ser un camino hacia la estabilidad regional o una ilusión peligrosa?"
 Sweden_news.29.a: "La idea del diálogo oriental suscita tanto la memoria como el disentimiento."
 Sweden_news.30.t: "Agenda: «Construyendo el Pensamiento Estratégico Sueco»"
 Sweden_news.30.d: "En el programa se analizó una brecha a menudo superada en la resiliencia nacional: la falta de una capacidad de investigación estratégica sueca sólida e independiente. Bajo el título 'Construyendo el Pensamiento Estratégico Sueco', el segmento mostró esfuerzos emergentes para establecer un grupo de reflexión nacional centrado en la seguridad, la diplomacia y la geopolítica. «Hemos subcontratado demasiado de nuestra cosmovisión a otros», dijo un investigador de políticas. El debate se convirtió en cuánto de la política exterior sueca es reactiva y no conceptual. El consenso: si Suecia quiere la autonomía, primero debe entender sus propios intereses en sus propios términos."
 Sweden_news.30.a: "Una voz soberana comienza con ideas soberanas."
 SWE_idea_swedish_legacy: "El legado sueco"
 SWE_idea_swedish_legacy_desc: "Pocas naciones de nuestro tamaño han mantenido una independencia tan larga a través de siglos de presión geopolítica. El legado de Suecia es una de neutralidad, innovación y competencia militar sin agresión. De las reformas de Gustavian a la doctrina de la Guerra Fría de la neutralidad armada, el modelo sueco se basa en la disuasión mediante la preparación y una voluntad social profundamente incrustada para defender.\n\nEn este legado encontramos identidad y obligación."
 SWE_idea_Armestaben: "Arméstaben – Comando Central del Ejército"
 SWE_idea_Armestaben_desc: "Reestablecido como nervio de mando para las operaciones terrestres, Arméstaben desempeña un papel vital en la coordinación y la preparación estratégica. Su estructura fusiona el desarrollo de la doctrina con la logística sobre el terreno, asegurando que las fuerzas suecas sigan siendo modernas y sensibles.\n\nEl regreso de un personal centralizado del ejército indica nuestra intención: planificamos, nos adaptamos y nos dirigimos."
 SWE_idea_total_defence_duty: "Total de la Defensa"
 SWE_idea_total_defence_duty_desc: "Totalförsvaret no es simplemente una política que es una obligación. Se espera que los ciudadanos suecos sirvan no sólo de manera uniforme, sino mediante la preparación civil: logística, atención médica, infraestructura y respuesta a crisis. En tiempos de amenaza, toda la nación se convierte en un sistema de resistencia.\n\nLa defensa total no se trata solo de la conscripción. Se trata de la contribución, de cada sueco."
 SWE_idea_active_training: "Rutinas de entrenamiento de deber activo"
 SWE_idea_active_training_desc: "Las fuerzas que entrenan sólo en teoría caen primero en la práctica. Suecia mantiene un sólido programa de entrenamiento combinado de armas, ejercicios conjuntos y escenarios de condiciones reales. Desde archipiélagos congelados hasta terreno urbano, nuestras tropas ensayan no sólo tácticas sino adaptación.\n\nNo se declara la disposición de combate. Está entrenado en el hábito."
 SWE_idea_total_training: "Capacitación en defensa integral"
 SWE_idea_total_training_desc: "La capacitación en Suecia se extiende más allá del ejército permanente. La policía, la defensa civil, la salud, la infraestructura y los gobiernos locales participan en ejercicios de contingencia. El resultado no es meramente logístico, sino cultural. La sociedad espera funcionar bajo presión.\n\nNo simulamos el colapso. Simulamos cómo superarlo."
 SWE_idea_nb8: "Nordic-Baltic Eight (NB8)"
 SWE_idea_nb8_desc: "El NB8 es una plataforma de cooperación pragmática entre los estados nórdico y báltico unificada por la geografía, el interés económico y las preocupaciones comunes en materia de seguridad. Mediante la coordinación diplomática y las iniciativas conjuntas, el NB8 da a Suecia una voz regional flexible y dirigida por civiles fuera de los principales bloques de poder.\n\nLas alianzas tranquilas construyen fronteras fuertes."
 SWE_idea_nordefco: "NORDEFCO – Cooperación de Defensa Nórdica"
 SWE_idea_nordefco_desc: "NORDEFCO combina las capacidades de defensa de los estados nórdicos sin exigir la plena integración de alianzas. Las adquisiciones conjuntas, los ejercicios compartidos y las estructuras de mando interoperables refuerzan el mosaico de seguridad de la región. Para Suecia, es una manera de fortalecer la disuasión sin sacrificar la soberanía.\n\nUnidad en flexibilidad. Defensa sin rendición."
 SWE_idea_swedish_banking: "Sistema bancario sueco"
 SWE_idea_swedish_banking_desc: "Construido en confianza, regulación y previsión tecnológica, el sistema bancario de Suecia está entre los más resistentes de Europa. Con alta penetración digital, baja dependencia en efectivo y política de crédito conservadora, puede hacer tiempo a la turbulencia económica con confianza tranquila.\n\nEn un mundo volátil, la moderación fiscal es fortaleza."
 SWE_development_found_of_the_swedish_construction_industry: "La fundación de la construcción sueca moderna"
 SWE_development_found_of_the_swedish_construction_industry_desc: "Postwar Suecia invirtió fuertemente en infraestructura, culminando en un sector de construcción robusto y versátil. Desde puentes en Norrland hasta ferrocarril subterráneo en Estocolmo, las empresas suecas construyen para durabilidad, eficiencia y climas duros. En tiempos de crisis, esta capacidad se convierte en reparación de doble uso, refuerzo y reconstrucción.\n\nNuestros ingenieros no solo construyen que defienden el futuro en concreto."
 SWE_idea_sverige_tourism: "Discover Sweden"
 SWE_idea_sverige_tourism_desc: "Durante muchos años, Suecia era poco más que un lugar distante en el mapa a menudo reducido a clichés de ABBA, modelos rubios y poco más. Sin embargo, más allá de los estereotipos se encuentra un país impresionante, rico en historia, cultura y naturaleza. Desde las costas norteñas de reno, bajo las luces polares, hasta la moderna maravilla del Puente Öresund en el sur, Suecia ofrece a los visitantes una experiencia única e inolvidable. Al invertir en infraestructura, hospitalidad y marketing internacional, podemos desbloquear el vasto potencial de la belleza y el encanto de nuestra nación."
 SWE_idea_2percent_inflation_goal: "2% Inflation Target"
 SWE_idea_2percent_inflation_goal_desc: "La estabilidad económica no viene por casualidad que se dirige cuidadosamente. Al comprometernos con un objetivo de inflación del 2%, buscamos anclar expectativas, apoyar el crecimiento sostenible y mantener el poder adquisitivo sin provocar sobrecalentamiento. Un entorno monetario predecible construirá confianza entre inversores, empresas y ciudadanos por igual."
 SWE_idea_gold_standart: "Regreso al estándar de oro"
 SWE_idea_gold_standart_desc: "En medio de una creciente incertidumbre, la vieja promesa de moneda respaldada por el oro está resurrando. Restaurar el estándar de oro pretende restablecer la confianza en nuestro sistema monetario, ofreciendo valores fijos y protegiendo a la economía de excesos especulativos. Sin embargo, el marco rígido puede limitar la flexibilidad en tiempos de crisis."
 SWE_idea_back_by_bonds: "Moneda respaldada por bonos"
 SWE_idea_back_by_bonds_desc: "En lugar de atar nuestras manos a una mercancía fija, podemos apoyar nuestra moneda con bonos estatales creando un sistema creíble y adaptable. La deuda del Gobierno servirá de base para la emisión monetaria, equilibrando la estabilidad con la capacidad de responder dinámicamente a las presiones financieras."
 SWE_idea_nordbanken: "Consolidación de Nordbanken"
 SWE_idea_nordbanken_desc: "En un intento por estabilizar el sector financiero, Nordbanken ha sido reestructurado en una institución más fuerte y resistente. Apoyado por medidas estatales e iniciativas privadas, el banco es una piedra angular del sistema financiero moderno de Suecia, capaz de hacer frente a las tormentas económicas futuras."
 SWE_lower_costs: "Reducción de los gastos de defensa"
 SWE_lower_costs_desc: "Los gastos militares se han reducido significativamente para reasignar recursos hacia las prioridades nacionales. Mientras esto aligera la carga fiscal, también reduce la disponibilidad inmediata de defensa, haciendo un equilibrio estratégico cuidadoso más crítico que nunca."
 SWE_idea_den_education_reform1: "Reforma Educativa: Fundaciones"
 SWE_idea_den_education_reform1_desc: "Reconociendo la necesidad de una economía moderna y basada en el conocimiento, la primera fase de la reforma educativa se centra en fortalecer la educación preescolar y mejorar el acceso a una educación de calidad en todas las regiones."
 SWE_idea_den_education_reform2: "Reforma educativa: Ampliación"
 SWE_idea_den_education_reform2_desc: "Sobre la base de los éxitos iniciales, la reforma entra en su segunda fase ampliando la formación secundaria y profesional, ajustando los planes de estudio a las exigencias de una economía mundial competitiva."
 SWE_idea_den_education_reform3: "Reforma Educativa: Excelencia"
 SWE_idea_den_education_reform3_desc: "La tercera fase impulsa la excelencia mejorando las instituciones de educación superior, fomentando la innovación en materia de investigación y promoviendo la colaboración internacional para situar a Suecia al frente de los logros académicos."
 SWE_idea_den_education_reform4: "Reforma Educativa: futuro listo"
 SWE_idea_den_education_reform4_desc: "Con los cimientos, la expansión y las fases de excelencia terminadas, la fase final garantiza que la educación siga siendo ágil, inclusiva y orientada hacia el futuro preparando ciudadanos para los desafíos dinámicos del mundo de mañana."
 SWE_idea_automotive_JAP: "Cooperación automotriz japonesa"
 SWE_idea_automotive_JAP_desc: "Forged through new partnerships with Japan's precision-driven automotive industry, Sweden gains access to cut-edge technologies, manufacturing techniques, and competitive market strategies. La colaboración con las principales empresas japonesas aumenta nuestra resiliencia en la producción, asegurando que permanezcamos al frente de la innovación mundial.\n\nDesde motores eficientes hasta soluciones híbridas, se escribe un nuevo capítulo en la excelencia automotriz."
 SWE_idea_automotive_USA: "Cooperación automotriz americana"
 SWE_idea_automotive_USA_desc: "Construido sobre la profundización de los vínculos con los gigantes industriales de Estados Unidos, el sector automotriz de Suecia absorbe las mejores prácticas de producción masiva, diseño comercial y escala logística. Nuestras fábricas se vuelven más rápidas, más flexibles y más competitivas, recortando la artesanía nórdica con dinamismo industrial estadounidense.\n\nEn cada chasis y eje de accionamiento, se forma un espíritu compartido de ambición."
 SWE_idea_automotive_GER: "Cooperación automotriz alemana"
 SWE_idea_automotive_GER_desc: "Fortalecido por la cooperación con los líderes automotriz de renombre mundial de Alemania, la industria sueca abarca la ingeniería de precisión, el control de calidad y la innovación en los niveles más altos. Las empresas conjuntas y el intercambio de conocimientos aseguran avances tecnológicos e impulsan nuestras propias capacidades industriales.\n\nEn cada equipo y pistón, la búsqueda de la excelencia perdura."
 SWE_idea_astrazenca: "Asociación AstraZeneca"
 SWE_idea_astrazenca_desc: "Mediante asociación con AstraZeneca, Suecia cementa su lugar en la encrucijada de la medicina, la biotecnología y la investigación avanzada. Los proyectos conjuntos aceleran las tuberías de desarrollo de drogas y fortalecen nuestra posición en los mercados farmacéuticos internacionales.\n\nCursos de innovación a través de cada frasco y fórmula que producimos."
 SWE_idea_Pharmacia1: "Farmacia: principios Ruptura"
 SWE_idea_Pharmacia1_desc: "Los primeros avances de Farmcia sentaron las bases de la reputación farmacéutica sueca, mezclando ciencia rigurosa con un espíritu emprendedor audaz. Los logros de nuestros investigadores en biotecnología y tratamientos médicos siguen resonando a nivel mundial.\n\nEn cada descubrimiento, el espíritu pionero brilla."
 SWE_idea_Pharmacia2: "Farmacia: Expansión Global"
 SWE_idea_Pharmacia2_desc: "Basándose en una tradición de innovación, la expansión de Farmacia hacia mercados internacionales indica una nueva era de influencia farmacéutica sueca. Las fusiones estratégicas y las colaboraciones de investigación posicionan a Suecia como un centro líder en ciencias de la salud y tecnología médica.\n\nEn todos los laboratorios y todas las asociaciones, se está dando forma al futuro."
 SWE_idea_swedish_think_tank: "ISDS – Institutet för Svensk Diplomati och Säkerhet"
 SWE_idea_swedish_think_tank_desc: "El Instituto de Diplomacia y Seguridad Sueca (ISDS) es un organismo financiado por el Estado encargado de analizar la posición de Suecia en un mundo cada vez más inestable. Oficialmente centrado en la diplomacia, la previsión económica y los marcos de seguridad civil, el ISDS influye silenciosamente en el pensamiento estratégico en el gobierno y el mundo académico. Mientras defiende formalmente la neutralidad, el instituto produce simulaciones clasificadas y papeles blancos explorando el papel potencial de Suecia en futuras alianzas, intervenciones y arquitecturas de inversión. En tiempos de ambigüedad geopolítica, ISDS proporciona la infraestructura intelectual para una política exterior flexible y orientada hacia el futuro."
 SWE_idea_ostkontact: "Initiera Östkontakt"
 SWE_idea_ostkontact_desc: "Al mantener la neutralidad oficial, iniciamos intercambios culturales, económicos y académicos con Rusia y los estados eurasiáticos. Estas conexiones de bajo perfil sirven como base para futuros escenarios de alineación. También señalan a los actores nacionales que la neutralidad no significa lealtad hacia Occidente."
 SWE_idea_anti_lgbt: "Campaña de política tradicionalista"
 SWE_idea_anti_lgbt_desc: "Una red de voces conservadoras ha lanzado un retroceso cultural contra los valores sociales progresistas, pidiendo un retorno a las 'normas tradicionales suecas'. Al carecer de respaldo oficial del Estado, su influencia ha impregnado el discurso público, suscitando debates sobre derechos LGBTQ+, libertad de expresión y política familiar. Las ONG internacionales y las instituciones europeas manifiestan su preocupación por el aumento de la polarización social."
 SWE_idea_folkhemmet: "Folkhemmet moderno"
 SWE_idea_folkhemmet_desc: "Partiendo de la inspiración del modelo sueco a mediados del siglo XX de 'Folkhemmet' el Hogar Popular una nueva visión de bienestar inclusivo y fuerte responsabilidad estatal está ganando tracción. Este concepto modernizado hace hincapié en la cohesión social, la igualdad económica y un equilibrio entre los mecanismos de mercado y bienestar, con el objetivo de proteger a los ciudadanos de la inestabilidad mundial preservando al mismo tiempo la unidad nacional."
 SWE_Logistic_invests: "Inversiones logísticas estratégicas"
 SWE_Logistic_invests_desc: "Reconociendo la importancia estratégica de la infraestructura resistente, Suecia ha comenzado a modernizar sus corredores de transporte, sistemas logísticos digitales y cadenas militares de suministro. Este programa de inversión está diseñado para asegurar la movilidad nacional, garantizar una respuesta militar rápida e integrarse con los estándares logísticos nórdicos y de toda la UE."
 SWE_cybershield: "Cyberförsvar – Escudo cibernético nacional"
 SWE_cybershield_desc: "Se ha puesto en marcha una iniciativa nacional amplia de ciberseguridad para defender la infraestructura crítica, las redes gubernamentales y la soberanía digital. Desarrollado en cooperación con instituciones académicas y contratistas de defensa, el programa Cyber Shield integra la detección de amenazas basadas en AI, capacidades cibernéticas ofensivas y simulacros conjuntos con socios confiables en toda la UE y la OTAN."
 SWE_think_tank_links: "Red de políticas – enlaces estratégicos del grupo de reflexión"
 SWE_think_tank_links_desc: "Suecia ha intensificado la cooperación con los grupos de reflexión internacionales e institutos de política académica, con el objetivo de elevar su capacidad geopolítica y estratégica. Esta estrategia de diplomacia del conocimiento permite la influencia ideacional, planificación de escenarios y asesoramiento normativo específico en ámbitos como la resiliencia climática, la guerra híbrida y la regulación digital."
 SWE_economic_forum: "Foro económico nórdico"
 SWE_economic_forum_desc: "Una nueva iniciativa pan-nódica reúne a economistas, líderes de la industria y actores estatales para coordinar las respuestas a los desafíos económicos. El Foro procura alinear las políticas fiscales, las transiciones verdes y las estrategias de innovación para salvaguardar la competitividad a largo plazo y la resiliencia de la región nórdica en una economía mundial cada vez más fragmentada."
 SWE_idea_rassism: "Latent Racism"
 SWE_idea_rassism_desc: "A pesar de su imagen progresiva, Suecia enfrenta desafíos estructurales y culturales relacionados con la exclusión étnica, la estratificación social y la marginación política. Estas tensiones amenazan la cohesión y legitimidad nacionales."
 SWE_idea_pluralism: "Pluralismo Democrático"
 SWE_idea_pluralism_desc: "Suecia abarca la diversidad ideológica, la libertad de los medios de comunicación y la representación minoritaria. El pluralismo democrático no es meramente tolerado. Se cultiva como fuente de legitimidad e innovación."
 SWE_idea_royal_social_society: "Sociedad Social Real"
 SWE_idea_royal_social_society_desc: "La Familia Real de Suecia participa activamente en iniciativas sociales, causas filantrópicas y programas de empoderamiento juvenil. Su presencia fomenta la identidad nacional y conecta la tradición con responsabilidad cívica."
 SWE_idea_royal_crown_and_military: "La Corona y las Fuerzas Armadas"
 SWE_idea_royal_crown_and_military_desc: "La monarquía fortalece su vínculo simbólico con los militares de Suecia. Mediante ceremonias públicas, legado histórico y valores compartidos, la Corona refuerza la unidad de nación y defensa."
 SWE_idea_royal_crown_and_military2: "La Corona y las Fuerzas Armadas – Integradas"
 SWE_idea_royal_crown_and_military2_desc: "La presencia de la Familia Real en formación oficial, asesoría estratégica y educación nacional de defensa está institucionalizada. Esto marca una nueva etapa de alineación simbólica pero influyente entre la monarquía y el ethos militar."
 SWE_idea_Victoria: "Princesa Victoria"
 SWE_idea_Victoria_desc: "Como heredero del trono, Crown Princess Victoria se ha convertido en un símbolo de continuidad, empatía y servicio público. Su dedicación a los deberes cívicos y su capacidad de conectarse entre las divisiones sociales inspiran la confianza en la monarquía y fomentan la unidad nacional. Su presencia refleja una monarquía moderna que comprende su papel en una sociedad democrática."
 SWE_idea_Madeleine: "Princess Madeleine"
 SWE_idea_Madeleine_desc: "La Princesa Madeleine es conocida por su compromiso con la protección de los niños, las causas humanitarias y la caridad internacional. Su trabajo con organizaciones globales y su capacidad para representar a Suecia en el extranjero contribuye a una imagen internacional positiva y refuerza el poder suave de la monarquía."
 SWE_idea_philip: "Príncipe Carl Philip"
 SWE_idea_philip_desc: "El príncipe Carl Philip, entrenado como oficial militar y activo en representación pública, puentes tradición y modernidad. Él encarna la lealtad, la disciplina y el servicio nacional. Su conexión con las fuerzas armadas y su compromiso con los veteranos y eventos públicos refuerza la unidad simbólica entre la Corona y el ejército."
 SWE_idea_royal_cultural_institutes: "Reales institutos culturales"
 SWE_idea_royal_cultural_institutes_desc: "La Familia Real apoya activamente museos, academias y diplomacia cultural. Estos institutos conservan el patrimonio nacional y fortalecen el poder blando de Suecia en el extranjero."
 SWE_the_royals: "Los Reales"
 SWE_the_royals_desc: "La Familia Real sigue sirviendo como símbolo nacional respetado, admirado y deliberadamente limitado en influencia política. Su papel es ceremonial, pero profundamente arraigado en el tejido cultural de Suecia."
 SWE_monarch_military1: "Försvarsmakten"
 SWE_monarch_coordination_plan: "Plan de coordinación estatal y económica"
 SWE_kultur_idea: "Svensk Kulturväckelse"
 SWE_mannerheim_plan: "Pacto de infraestructura Mannerheim"
 SWE_prepare_baltic: "Dominion over Östersjön"
 SWE_prepare_baltic_tt: "§R¡Este espíritu nacional será eliminado si vamos a la guerra!§!"
 SWE_development_integration: "Desarrollo de la red logística del Reino"
 SWE_exploitation: "Explotación sueca"
 SWE_colonial_court_idea: "Corte Colonial"
 SWE_viking_legacy_idea1: "Espíritu de Uppsala"
 SWE_danelaw_arsenal: "Arsenal de Danelaw"
 SWE_danelaw_arsenal_desc: "Desde el momento de las redadas vikingas, los que permanecen iguales, no se puede gobernar la lucha y gobernar sin el suministro adecuado. §YExcepto usted puede allanar algunas iglesias o monasterio§!"
 SWE_easter_horizon_idea1: "Este de Horizonte"
 SWE_easter_horizon_idea1_desc: "Después de insinuar hacia la influencia de la OTAN, nos dirigimos a los poderes del futuro."
 Sweden_Rus_Exercise: "Ejercicio militar sueco-ruso"
 Sweden_Rus_Exercise_desc: "Suecia y Rusia han acordado realizar un ejercicio militar conjunto, fortaleciendo las capacidades regionales de coordinación y defensa."
 SWE_russian_energy_idea: "Acuerdo de Energía Rusa"
 SWE_russian_energy_idea_desc: "Suecia ha concertado un acuerdo de cooperación energética con Rusia. Si bien ello garantiza un suministro constante de combustible y electricidad, también aumenta la dependencia económica de la Federación de Rusia."
 SWE_industry_exchange_swe: "Intercambio militar de la industria"
 SWE_venezualen_accord_ven: "Inversión de infraestructura sueca"
 SWE_venezualen_accord_ven_desc: "Tras un acuerdo bilateral con Suecia, Venezuela recibe inversiones en infraestructura y apoyo tecnológico, fortaleciendo su capacidad industrial y desarrollo energético."
 SWE_venezualen_accord: "Acontecimientos de petróleo venezolano"
 SWE_venezualen_accord_desc: "Como parte de un acuerdo estratégico de inversión, Suecia ha conseguido acceso a largo plazo al petróleo venezolano a cambio de inversiones industriales. El acuerdo aumenta la seguridad energética y el alcance económico de Suecia."
 SWE_cuba_medical_exchange: "Asociación sueca de tecnología médica"
 SWE_cuba_medical_exchange_desc: "Gracias a un acuerdo bilateral con Suecia, Cuba se beneficia de tecnologías médicas avanzadas suecas, equipos y programas conjuntos de investigación, fortaleciendo nuestras capacidades sanitarias domésticas."
 SWE_iran_petrochemical_swe: "Acuerdo Petroquímico iraní"
 SWE_iran_petrochemical_swe_desc: "Mediante un acuerdo estratégico con el Irán, Suecia ha obtenido acceso a recursos esenciales basados en el petróleo. Las empresas suecas participan ahora en empresas petroquímicas avanzadas en el extranjero, mejorando el procesamiento industrial nacional y asegurando insumos energéticos a largo plazo."
 SWE_iran_petrochemical_iran: "Colaboración industrial sueca"
 SWE_iran_petrochemical_iran_desc: "Suecia ha comenzado a invertir en los sectores petroquímicos y refinados de Irán. Con su experiencia técnica y equipo industrial, la capacidad iraní está creciendo tanto en la producción como en la sofisticación tecnológica, potenciando nuestra economía energética."
 SWE_decision_Forsvarsmarkten_category: "Försvarsmakten"
 SWE_decision_Forsvarsmarkten_category_desc: "\n£GFX_swedisch_homeguard \n\n\n\n\nEl sistema de defensa sueco se basa en el concepto de Totalförsvaret, un enfoque unificado que combina la preparación militar y civil. En virtud de esta doctrina, Försvarsmakten trabaja junto con organismos civiles como MSB para garantizar la resiliencia nacional en tiempos de crisis o guerra. El värnplikt reactivado proporciona un flujo constante de personal capacitado, reforzando las fuerzas armadas y creando una sociedad capaz de resistencia colectiva. Cada ciudadano es parte del plan de defensa nacional, desde la movilización hasta operaciones de resistencia sostenidas."
 SWE_Home_Guard: "Expandir Hemvärnet"
 SWE_Home_Guard_desc: "El Hemvärnet es la columna vertebral de la defensa local y la respuesta rápida. Al ampliar su tamaño, la disponibilidad regional mejorará y nuestra capacidad de resistir incursiones o ataques repentinos se reforzará considerablemente. La conexión local de estas unidades garantiza la resiliencia incluso bajo presión."
 SWE_fortifications: "Fortalecer las ubicaciones estratégicas"
 SWE_fortifications_desc: "Para salvaguardar áreas clave, debemos invertir en posiciones defensivas sólidas. Desde las costas de Skåne hasta los bosques de Norrland, las fortificaciones fijas pueden retrasar o repeler a cualquier agresor lo suficientemente largo como para que la movilización termine."
 SWE_Officer_education_course: "Programa de educación oficial"
 SWE_Officer_education_course_desc: "El liderazgo en las Försvarsmakten debe cultivarse mediante una educación rigurosa y continua. Al ampliar los programas de formación de nuestros oficiales en instituciones como la Försvarshögskolan, aseguramos competencia estratégica y excelencia en el campo de batalla."
 SWE_only_active_Personal_Trainings_exercise: "Realizar ejercicios de personal activo"
 SWE_only_active_Personal_Trainings_exercise_desc: "Los ejercicios rutinarios y de campo son esenciales para mantener alerta y listas para el combate a nuestras fuerzas permanentes. Estos ejercicios reforzarán la disciplina, la coordinación y la preparación en condiciones realistas."
 SWE_Home_defence_Trainings_exercise: "Unidades de Defensa del Hogar"
 SWE_Home_defence_Trainings_exercise_desc: "La preparación empieza en casa. Al realizar ejercicios a gran escala para reservistas y unidades de voluntarios, reforzamos nuestra capacidad de responder a amenazas híbridas y escenarios de guerra no convencional."
 SWE_launch_total_defence: "Activar Totalförsvaret"
 SWE_launch_total_defence_desc: "Totalförsvaret moviliza a toda la nación. La infraestructura civil, los servicios de emergencia y las fuerzas militares funcionarán al unísono en una estrategia nacional coordinada de defensa. Esta medida marca un cambio de las rutinas de tiempo de paz a la preparación del espectro completo."
 SWE_back_to_normality: "Desmovilizar y volver a la normalidad"
 SWE_back_to_normality_desc: "Con la amenaza de retroceso, podemos empezar a recortar nuestro estado más elevado de preparación. Totalförsvaret se levantará, y la nación pasará de nuevo a las rutinas de tiempo de paz, pero las lecciones y estructuras permanecerán en su lugar para el futuro."
 SWE_decision_Royal_category: "La Familia Real de Suecia"
 SWE_decision_Royal_category_desc: "\n\n\n\n£GFX_SWE_royals_decisions_pic \n\n\n\n\n\n\nLa monarquía sueca, revivida en 1818 bajo el antiguo Mariscal Napoleónico Jean-Baptiste Bernadotte (King Charles XIV John), sentó las bases para la Suecia moderna a través de la neutralidad, reforma e industrialización. Aunque despojado del poder político por la constitución de 1974, la dinastía Bernadotte sigue siendo un símbolo central. El Rey Carl XVI Gustaf y la Princesa Victoria de la Corona representan continuidad y modernidad, reforzando la identidad nacional y la unidad a través de la diplomacia cultural y los roles ceremoniales..."
 SWE_king_speak_to_the_nation: "Discurso real a la nación"
 SWE_king_speak_to_the_nation_desc: "En tiempos de incertidumbre o reflexión nacional, el Rey puede dirigirse directamente al pueblo. Aunque carecen de autoridad política, esos discursos tienen un peso simbólico y refuerzan la unidad, la confianza y la continuidad del Estado sueco."
 SWE_send_to_mandatory_service: "Participación real en el servicio militar"
 SWE_send_to_mandatory_service_desc: "Para fortalecer su vínculo con la nación y sus fuerzas de defensa, los miembros de la Familia Real pueden cumplir su servicio militar junto a los ciudadanos comunes. Este acto subraya el papel de la monarquía como símbolo compartido del deber, la humildad y la cohesión nacional."
 SWE_training_as_officer: "Real Officer Training"
 SWE_training_as_officer_desc: "Miembros seleccionados de la realeza, como la princesa heredera Victoria y el príncipe Carlos Felipe, realizan formación de oficial para profundizar su comprensión de las tradiciones militares y las responsabilidades cívicas de Suecia. Estas experiencias fomentan el respeto entre las fuerzas armadas y reflejan el compromiso continuo de la monarquía con el servicio nacional."
 SWE_science_patronage: "Mecenazgo real para la ciencia"
 SWE_science_patronage_desc: "La Familia Real Sueca ha apoyado desde hace mucho tiempo la educación, la investigación y la innovación. Al otorgar el patrocinio real a las instituciones científicas, podemos inspirar interés público, atraer talento extranjero y fortalecer la reputación de Suecia como un centro de conocimiento y progreso."
 SWE_military_review: "Real revisión militar"
 SWE_military_review_desc: "Una inspección ceremonial de nuestras fuerzas armadas por la Familia Real eleva la moral y muestra la preparación de Suecia. Más allá de la tradición, estos actos fomentan la unidad entre el ejército y el pueblo y proyectan confianza al mundo."
 SWE_economy_review: "Foro Económico Real"
 SWE_economy_review_desc: "Acoger un foro económico encabezado por la realeza señala estabilidad y atrae inversión. El papel simbólico y la presencia internacional de la Familia Real pueden abrir puertas a negociaciones comerciales y asociaciones que refuercen nuestra economía."
 SWE_support_nationalist: "Soporte sutil para valores nacionales"
 SWE_support_nationalist_desc: "Mientras se mantiene oficialmente neutral, los miembros de la Familia Real pueden destacar las tradiciones y el patrimonio de Suecia. Tales gestos resonan con el sentimiento nacionalista y refuerzan el orgullo de nuestra soberanía."
 SWE_support_Democracy: "Campeón de Valores Democráticos"
 SWE_support_Democracy_desc: "Al enfatizar el compromiso de la monarquía con la democracia y el estado de derecho, la Familia Real puede servir como un guardián simbólico del sistema político sueco, fomentando la confianza tanto en el hogar como en el extranjero."
 SWE_will_of_the_people: "Voluntad del pueblo"
 SWE_will_of_the_people_desc: "El apoyo a la monarquía está aumentando en toda la nación, pero nos aferramos a los valores democráticos que definen Suecia moderna. Incluso con la capacidad de restaurar el derecho a gobernar por la voluntad del pueblo, seguimos siendo los primeros entre iguales, guiando a la nación a través del servicio en lugar de la dominación."
 Sweden_royal.1.t: "Real participación en el servicio obligatorio"
 Sweden_royal.1.d: "De acuerdo con el sistema de conscripción de Suecia y la tradición real de larga data, un miembro de la Familia Real comienza el servicio militar. Mientras la monarquía ya no tiene autoridad de mando, los actos simbólicos del deber nacional compartido ayudan a reforzar el vínculo entre estado, sociedad y corona.\n\nEsta decisión también dará forma a la percepción pública: la elección de figura real refleja diferentes valores de liderazgo, deber o compasión."
 Sweden_royal.1.o1: "Asignar Crown Princess Victoria"
 Sweden_royal.1.o1_desc: "Como heredero del trono, la Princesa Heredera Victoria se someterá a formación básica y educación oficial. Su imagen pública de disciplina, conciencia social y compromiso internacional establecerá un poderoso ejemplo del servicio real en los tiempos modernos."
 Sweden_royal.1.o2: "Assign Prince Carl"
 Sweden_royal.1.o2_desc: "El príncipe Carl Philip, conocido por su interés en las tradiciones navales y la ingeniería, servirá en las fuerzas armadas como símbolo de lealtad operacional e integración juvenil. Su entrenamiento también puede aumentar el respeto dentro del cuerpo de oficiales."
 Sweden_royal.2.t: "Real Officer Training Begins"
 Sweden_royal.2.d: "Tras su asignación al servicio militar obligatorio, el miembro de la familia real seleccionado ha sido aprobado para la formación oficial. Mientras sus funciones futuras siguen siendo ceremoniales, la decisión refleja el principio permanente de servicio igualitario de Suecia y el compromiso de la monarquía con la credibilidad, unidad e integración nacional."
 Sweden_royal.2.o1: "Crown Princess Victoria comienza el entrenamiento de oficiales avanzados"
 Sweden_royal.2.o1_desc: "La formación de Victoria seguirá un programa a medida, incluyendo liderazgo, coordinación de crisis y cooperación civil-militar. Su compromiso es ampliamente percibido como un signo de seria preparación para su papel futuro, no sólo una presencia simbólica."
 Sweden_royal.2.o2: "Prince Carl Philip se une a la escuela de oficiales navales"
 SWE_heavy_industry_modifier: "Herencia de la industria pesada sueca"
 SWE_heavy_industry_modifier_desc: "Forjado en las fundaciones del siglo XX, la industria pesada de Suecia sigue siendo una piedra angular del poder nacional. Desde vehículos blindados hasta turbinas hidroeléctricas, nuestra capacidad de producción es fiable, adaptable y profundamente integrada con los mercados de exportación. Empresas como Bofors, Scania y Volvo AB forman la columna industrial de Totalförsvaret, capaz de pasar de la producción civil a militar cuando el momento lo exige.\n\nEl acero sigue fluyendo en venas suecas."
 SWE_Vattenfall_modifier: "Vattenfall - Potenciando el norte"
 SWE_Vattenfall_modifier_desc: "Fundada hace más de un siglo y todavía estatal, Vattenfall es más que un proveedor de energía es un activo estratégico. A través del dominio hidroeléctrico y el creciente control sobre los sistemas de calefacción nuclear y de distrito, Vattenfall asegura la resiliencia energética de Suecia tanto en paz como en conflicto. Su integración en la red en toda la región nórdica también lo convierte en un elemento clave de la diplomacia energética regional.\n\nCuando otros importan el poder, Suecia genera su propio."
 SWE_financial_place_modifier: "Centro financiero nórdico"
 SWE_financial_place_modifier_desc: "Con Estocolmo como su corazón palpable, Suecia se ha convertido en un centro financiero para la región nórdica-báltica. Instituciones como Nordea, SEB y el Riksbank anclan flujos de capital estables y sistemas regulatorios modernos, mientras que la banca digital conduce la carga a una economía sin efectivo. La resiliencia financiera es más que un número de seguridad nacional.\n\nLos mercados de Suecia pueden ser pequeños por estándares globales, pero superan su peso."
 SWE_pharmacy_modifier: "Swedish Pharmaceutical Excellence"
 SWE_pharmacy_modifier_desc: "Rooted en investigación y refinado a través de la regulación, la industria farmacéutica sueca mezcla ciencia de precisión con alcance global. Astra, Recipharm y Sobi anclan un clúster que exporta salud, desarrolla biologics y pioneros medicina personalizada. Con fuertes vínculos universitario-industria y confianza pública en la medicina, el sector es un silencioso centinela de resiliencia y prosperidad.\n\nAquí, las moléculas se convierten en milagros."
 SWE_digital_modifier: "Pioneros del Norte Digital"
 SWE_digital_modifier_desc: "Desde la infraestructura de banda ancha temprana hasta las startups tecnológicas de clase mundial, el viaje digital de Suecia comenzó antes de que se diera cuenta del mundo. Un empuje respaldado por el Estado para la conectividad, educación e innovación ha convertido el silicio frío en un tejido social cálido. Ericsson, Spotify y Klarna son sólo la superficie de abajo es una fuerza laboral digitalmente fluida y un estado listo para automatizar, analizar y actuar.\n\nEn Suecia, los datos fluyen como agua."
 SWE_mining_modifier: "Legado de la Minería Sueca"
 SWE_mining_modifier_desc: "El sector minero de Suecia ha sido desde hace mucho tiempo un pilar del poder industrial, construido a partir de rocas antiguas y impulsado por la innovación. Kiruna y Gällivare hacen eco con el ritmo de taladros y cargadores, mientras que LKAB y Boliden impulsan la extracción sostenible en un mundo hambriento de materias primas. Nuestros ores alimentan las fábricas de Europa, nuestros métodos establecen estándares globales. \n\nDebajo de la nieve se encuentra la fuerza."
 SWE_army_dynamic_modifier: "Sveriges Försvarsmakt"
 SWE_army_dynamic_modifier_desc: "Las reformas recientes han redefinido al ejército sueco en una fuerza más móvil, profesional y modular, capaz de defensa nacional y despliegues internacionales."
 SWE_Special_forces_modifier: "Försvarsmaktens Elitenheter"
 SWE_Special_forces_modifier_desc: "Las unidades de élite de Suecia, capacitadas en guerra ártica, combate urbano y operaciones asimétricas, aumentan el alcance estratégico de la competencia militar y del proyecto en zonas de conflicto de alta intensidad."
 SWE_politics_modifier: "Paisaje Político Fragmente"
 SWE_politics_modifier_desc: "El paisaje político está marcado por cambios ideológicos, inestabilidad de la coalición y una creciente tensión entre reformistas y tradicionalistas. El gobierno en estas condiciones requiere adaptabilidad y compromiso."
 SWE_monarchy_modifier: "Signatura de la continuidad nacional"
 SWE_monarchy_modifier_desc: "La monarquía, aunque ceremonial, sirve como un símbolo unificador que encarna la legitimidad histórica y la estabilidad social. Su presencia refuerza la cohesión durante tiempos de incertidumbre."
 SWE_wind_farms: "Parques de viento"
 SWE_wind_farms_desc: "Con la energía eólica convirtiéndose en un recurso económico cada vez más viable y sostenible, las inversiones regionales en parques eólicos están empezando a transformar el paisaje energético. Aunque todavía en sus primeras etapas, este cambio promete aumentar la independencia energética y reducir el impacto ambiental a lo largo del tiempo."
 SWE_mines: "Operaciones mineras"
 SWE_mines_desc: "Se están revitalizando las industrias mineras locales para extraer valiosos recursos naturales. Estas operaciones constituyen una base fundamental para las economías regionales y el desarrollo industrial."
 SWE_upgraded_mining_equipment: "Equipo de Minería Modernizado"
 SWE_upgraded_mining_equipment_desc: "La inversión en maquinaria y técnicas mineras modernas ha mejorado considerablemente la eficiencia y seguridad de la extracción, potenciando la producción y reduciendo los costos operacionales."
 SWE_science_center: "Centro regional de ciencias"
 SWE_science_center_desc: "Un centro científico dedicado fomenta la innovación y la investigación tecnológica, sirviendo como un centro para el mundo académico, las startups e industrias que buscan desarrollar soluciones de vanguardia."
 SWE_energy_link: "Infraestructura Enlace"
 SWE_energy_link_desc: "Las nuevas inversiones en las líneas de transmisión de energía y la infraestructura transfronteriza refuerzan las redes regionales, asegurando un suministro energético más estable y seguro para los sectores industrial y civil."
 SWE_nuklear_plant: "Planta nuclear"
 SWE_nuklear_plant_desc: "La construcción de una central nuclear proporciona un paso importante hacia la seguridad energética a largo plazo. Si bien requiere una supervisión cuidadosa, suministra electricidad a gran escala y de baja emisión esencial para las economías modernas."
 SWE_automotive_industrie_expansion: "Expansión de la industria automotriz"
 SWE_automotive_industrie_expansion_desc: "El sector automotriz nacional está experimentando una rápida expansión, con nuevas instalaciones y cadenas de suministro que aumentan la producción industrial, el empleo y la capacidad de exportación."
 SWE_regional_tourism_invest: "Desarrollo regional del turismo"
 SWE_regional_tourism_invest_desc: "Las inversiones dirigidas a la infraestructura turística tienen por objeto desbloquear el potencial económico de las atracciones culturales, históricas y naturales locales, impulsando el crecimiento del sector de los servicios y la prosperidad regional."
 SWE_Riga_legacy: "Herencia de la Riga sueca"
 SWE_Riga_legacy_desc: "La influencia histórica del Imperio sueco en Riga aún se hace eco a través de sus instituciones e infraestructura. Este legado apoya el desarrollo y la estabilidad locales."
 SWE_southafrica_metals: "Acuerdo sobre metales estratégicos de Sudáfrica"
 SWE_southafrica_metals_desc: "Mediante un acuerdo bilateral con Sudáfrica, Suecia ha conseguido acceso confiable a metales raros y estratégicos críticos para nuestras industrias de defensa y alta tecnología."
 SAF_swe_metals_investment: "Inversión sueca de minería"
 SAF_swe_metals_investment_desc: "Las inversiones suecas están impulsando la infraestructura minera de Sudáfrica, aportando tecnologías avanzadas y fortaleciendo la producción industrial en sectores estratégicos clave."
 SWE_balance_of_power: "Neutralidad sueca"
 SWE_balance_of_power_desc: "Desde 1814, Suecia ha caminado por un camino de separación deliberada de grandes bloques de poder no fuera de la debilidad, sino de una doctrina estratégica de no alineación. Este equilibrio ahora enfrenta nuevas presiones. En un mundo reestructurado por poderes cambiantes, ¿puede Suecia mantener su curso independiente, o debe elegir un lado en la nueva brecha global?"
 SWE_souvereign_neutrality: "Soberana neutralidad"
 SWE_souvereign_neutrality_desc: "Durante más de dos siglos, Suecia ha preservado con éxito su soberanía al permanecer fuera de las alianzas militares. Esta política está arraigada en el pragmatismo y la precaución, forjada por la guerra y refinada en paz. Incluso en el siglo XXI, la neutralidad sigue siendo un pilar definitorio de la identidad sueca y un poder silencioso en su propio derecho."
 SWE_nato_side: "Orientación occidental"
 SWE_nato_side_desc: "En un mundo sacudido por guerras de agresión, amenazas cibernéticas y resurgimiento autoritario, Suecia ya no puede permitirse permanecer sola. La población y el liderazgo se dirigen hacia Occidente no sólo por garantías de seguridad, sino para reafirmar valores compartidos de democracia, transparencia y defensa colectiva. La carretera atlántica ofrece protección, pero a un precio: la pérdida de neutralidad tradicional."
 SWE_russia_side: "Realignación del Este"
 SWE_russia_side_desc: "Desilusionados por la decadencia de Occidente, divisiones internas y dogmas culturales, segmentos de la población sueca y élite comienzan a mirar hacia el este. Lo que una vez fue inconcebible alinearse con Moscú ahora emerge como un contrarretroceso radical al liberalismo global. Para ellos, la neutralidad ha fracasado, y Occidente se ha convertido en la misma amenaza que una vez pretendía proteger contra."
 SWE_atlantic_alligment: "Alineación atlántica"
 SWE_atlantic_alligment_desc: "Un segmento creciente de la población sueca exige una integración plena en el sistema de alianzas occidentales. En una era de inestabilidad, muchos ven la pertenencia a la OTAN y una garantía transatlántica de seguridad como el único camino realista hacia adelante incluso a costa de abandonar durante dos siglos de neutralidad."
 SWE_western_preference: "Preferencias occidentales"
 SWE_western_preference_desc: "La opinión pública favorece cada vez más lazos fuertes con Occidente. Si bien sigue existiendo la neutralidad formal, el deseo de una cooperación más estrecha con los asociados de la OTAN y la Unión Europea está aumentando, impulsado por preocupaciones en materia de seguridad, valores democráticos compartidos e integración económica profunda."
 SWE_cooperative_neutrality: "Neutralidad cooperativa"
 SWE_cooperative_neutrality_desc: "Una gran parte del pueblo sueco todavía cree en la neutralidad pero no en el aislamiento. Cada vez hay mayor apoyo a la cooperación internacional en los diálogos de mantenimiento de la paz, inteligencia y defensa, sin cruzar la línea hacia una alianza completa."
 SWE_pragmatic_eastern_opening: "Apertura oriental pragmática"
 SWE_pragmatic_eastern_opening_desc: "Algunas voces sostienen que Suecia debe diversificar su política exterior y reducir la dependencia de los poderes occidentales. Exigen un compromiso pragmático con el Este, especialmente Rusia, no por ideología, sino por deseo de estabilidad regional y oportunidad económica."
 SWE_strategic_balance: "Equilibración estratégica"
 SWE_strategic_balance_desc: "El debate público está cambiando. A medida que aumentan las tensiones a nivel mundial, una parte de la sociedad exige una estrategia más audaz de equilibrio no totalmente occidental ni oriental, sino que posiciona a Suecia como un estabilizador soberano en la región báltica mediante alineamientos selectivos y flexibilidad diplomática."
 SWE_Russian_allignment: "Alineación rusa"
 SWE_Russian_allignment_desc: "En los círculos fringe pero en crecimiento, Occidente no es visto como un protector, sino como una fuerza corrosiva decayendo moralmente y hostil a la tradición. Estos grupos exigen una reorientación radical hacia Rusia, abrazandola como un baluarte contra el globalismo liberal y un socio en la soberanía."
 SWE_balance_of_power_category: "Suecia y su historia de la neutralidad"
 SWE_balance_of_power_category_desc: "Desde 1814, Suecia ha seguido un camino de desapego deliberado de los bloques de grandes potencias, no por debilidad sino por una doctrina estratégica de no alineamiento. Este equilibrio afronta ahora nuevas presiones. En un mundo reestructurado por potencias cambiantes, ¿puede Suecia mantener su rumbo independiente, o debe elegir bando en la nueva división global?"
 SWE_the_price_of_neutrality: "Neutralitetens Pris"
 SWE_the_price_of_neutrality_desc: "Suecia tiene una larga y compleja historia de neutralidad, forjada a través de siglos de guerra y supervivencia. Desde Gustavus Adolphus en la Guerra de los Treinta Años hasta la declaración de neutralidad de 1834, y el 'modelo sueco' de posguerra de la diplomacia, nuestra distancia de las alianzas nos mantuvo a salvo. Pero en un mundo cambiante, la neutralidad tiene un costo y tal vez sea el momento de considerar acercarse a una asociación militar oficial con Occidente."
 SWE_ask_the_minister_of_defence_dialog: "Fråga Försvarsministern"
 SWE_ask_the_minister_of_defence_dialog_desc: "El Ministro de Defensa representa tanto la memoria institucional como la previsión estratégica. Al iniciar un diálogo público mediante declaraciones oficiales y entrevistas, permitimos que la idea de alineación occidental entre en el ámbito público por medio de la autoridad, no la ideología. Esto ayuda a cambiar la percepción nacional hacia el pensamiento de alianza a largo plazo."
 SWE_security_information_campain: "Informationskampanj om Säkerhet"
 SWE_security_information_campain_desc: "Lanzar una campaña basada en hechos sobre las vulnerabilidades de defensa de Suecia y el cambiante entorno de seguridad del Mar Báltico sirve para replantear el debate. Si la neutralidad nos mantuvo a salvo, hoy puede exponernos. La conciencia pública se vuelve una herramienta para forjar apoyo a una cooperación más profunda con las estructuras de defensa occidentales."
 SWE_symbolic_campain_to_make_citizens_familiar: "Symbolisk Kampanj för Medborgarförståelse"
 SWE_symbolic_campain_to_make_citizens_familiar_desc: "Ejercicios conjuntos de símbolos sutiles y poderosos con la OTAN, banderas en embajadas o campañas de intercambio cultural pueden influir en el sentimiento público. La familiaridad genera aceptación. Esta campaña simbólica no cambia la política directamente, pero prepara emocionalmente a los ciudadanos para una posible alineación occidental."
 SWE_the_swedish_way: "Den Svenska Vägen"
 SWE_the_swedish_way_desc: "Durante generaciones, «El camino sueco» ha representado independencia, diplomacia y no alineamiento. Esta iniciativa reafirma nuestro compromiso con la neutralidad al menos en la forma. Pero al fomentar una reflexión nacional sobre cómo garantiza Suecia la paz en el siglo XXI, empezamos a modelar la mentalidad que, con el tiempo, puede llevar hacia el alineamiento con los marcos de seguridad occidentales."
 SWE_what_means_neutrality_to_us: "Vad Betyder Neutralitet för Oss?"
 SWE_what_means_neutrality_to_us_desc: "Esta campaña de discusión nacional se enmarca como una reafirmación de la postura neutral de Suecia. Pero preguntando qué significa realmente la neutralidad en el mundo complejo de hoy, invitamos a la reinterpretación estratégica. Esto permite un ablandamiento gradual de la resistencia pública a posibles alianzas manteniendo al mismo tiempo la apariencia de continuidad."
 SWE_build_up_swedish_think_tank: "Etablera Svensk Tankesmedja"
 SWE_build_up_swedish_think_tank_desc: "Un laboratorio de ideas respaldado por el Estado y centrado en la política de neutralidad da legitimidad intelectual al mantenimiento de la independencia. Pero su función real es simular y analizar, al principio a puerta cerrada, opciones de alianza. Mientras refuerza en público la neutralidad, prepara un consenso de élites y marcos políticos que podrían permitir un giro si las circunstancias lo exigen."
 SWE_multipolar_world: "En Multipolär Värld"
 SWE_multipolar_world_desc: "El momento unipolar ha terminado. Un creciente desafío al este El dominio occidental, y Suecia debe reconocer esta cambiante arquitectura global. Al promover una visión del mundo basada en el equilibrio multipolar, abrimos la mente pública para establecer contactos más profundos con los poderes no occidentales, especialmente aquellos que abogan por la soberanía, la pluralidad cultural y la no intervención."
 SWE_det_andra_europa: "Det Andra Europa"
 SWE_det_andra_europa_desc: "Hay otra Europa no formada por Bruselas y la OTAN, sino arraigada en tradición, soberanía y una experiencia histórica diferente. Destacando los vínculos culturales, religiosos y geopolíticos con Europa oriental y el mundo eslavo, ayudamos a construir un espacio psicológico e ideológico para la reorientación."
 SWE_do_ostkontact: "Initiera Östkontakt"
 SWE_do_ostkontact_desc: "Al mantener la neutralidad oficial, iniciamos intercambios culturales, económicos y académicos con Rusia y los estados eurasiáticos. Estas conexiones de bajo perfil sirven como base para futuros escenarios de alineación. También señalan a los actores nacionales que la neutralidad no significa lealtad hacia Occidente."
 SWE_blame_the_arrogant_west: "Criticar al arrogante Occidente"
 SWE_blame_the_arrogant_west_desc: "La insatisfacción pública con el supuesto moralismo, el dominio económico y la hipocresía de política exterior de Occidente crece. Al canalizar este sentir en la retórica oficial, replanteamos la neutralidad no como un equilibrio entre potencias sino como un rechazo a la arrogancia occidental. Este giro aumenta la receptividad pública a las alternativas orientales."
 SWE_Technologie_Exchange_groupe_desc: "En honor de Lars Onsager, un químico físico ganador del Premio Nobel de fondo noruego-americano con raíces suecas, este instituto fomenta la colaboración tecnológica transfronteriza. Su objetivo es acelerar el avance científico y la innovación industrial mediante el intercambio estructurado de conocimientos entre las naciones asociadas."
 SWE_four_year_plan_category: "Plan de cuatro años para la gente"
 SWE_four_year_plan_category_desc: "La monarquía ha sido desmantelada, y con ella la ilusión del privilegio heredado. Ahora comienza la verdadera transformación de la sociedad sueca guiada por el pueblo, para el pueblo. El Plan de Cuatro Años moviliza todos los recursos nacionales para el progreso colectivo, la independencia industrial, la claridad ideológica y la disposición internacional."
 SWE_increase_the_workforce: "Movilizar a los trabajadores"
 SWE_increase_the_workforce_desc: "La gente ya no son espectadores. Todas las manos deben servir al bien colectivo. Cada ciudadano contribuirá independientemente de la clase anterior, el género o la región."
 SWE_improve_economic_capacity: "Reestructurar la economía"
 SWE_improve_economic_capacity_desc: "De las fincas reales a los servicios privatizados, todos los sectores estratégicos están siendo reestructurados bajo control público. La producción servirá a la nación no el lujo dinástico."
 SWE_true_education: "Establecer la educación ideológica"
 SWE_true_education_desc: "La monarquía corrompió las mentes de los jóvenes con mitos y obediencia. Una nueva educación cívica enseñará pensamiento crítico, igualdad y lealtad a la república no a una corona."
 SWE_build_partnership: "Forma alianzas anti-imperialistas"
 SWE_build_partnership_desc: "Para resistir a los antiguos poderes y monopolios mundiales, Suecia formará alianzas con otros estados que rechazan la aristocracia, la explotación económica y la dominación externa."
 SWE_intervention_force: "Crear la Fuerza de Intervención Popular"
 SWE_intervention_force_desc: "Debemos estar listos para defender la república no sólo dentro de nuestras fronteras, sino dondequiera que el pueblo esté oprimido. La Fuerza de Intervención actuará con rapidez, decisión y sin vacilación."
 philip_mandatory_service: "Prince Philip haciendo el servicio obligatorio"
 madeleine_mandatory_service: "Princesa Madeleine haciendo el servicio obligatorio"
 victoria_mandatory_service: "Princesa Victoria haciendo el servicio obligatorio"
 SWE_whistle_blowers_I: "Hate whistleblowers"
 SWE_whistle_blowers_II: "Love whistleblowers"
 SWE_Technologie_Exchange_groupe_name: "Instituto Onsager de Intercambio Tecnológico"
 Sweden_foci.40.t: "Evaluación de la Fuerza Aérea: Suecia no está preparada"
 Sweden_foci.40.d: "Una comisión interna reciente dirigida por altos funcionarios de la Fuerza Aérea sueca ha llegado a la conclusión de que nuestra infraestructura actual de defensa aérea es insuficiente para satisfacer las demandas de la guerra moderna. Nuestros sistemas existentes carecen de la capacidad para contrarrestar las amenazas multi-vector de alta velocidad, especialmente los misiles cruceros y los drones de bajo vuelo.\n\nEl informe insta a la acción inmediata: debemos decidir si ampliar nuestras capacidades de intercepción a largo plazo, fortalecer nuestra defensa móvil de corto alcance o reestructurar ambas de una manera más equilibrada."
 Sweden_foci.40.a: "Invertir en sistemas de defensa aérea de corto alcance"
 Sweden_foci.40.b: "Implementar plataformas de interceptores de misiles de largo alcance"
 Sweden_foci.40.c: "Priorizar la defensa de aire capas en todas las gamas"
 Sweden_foci.41.t: "Reestructuración de los aeropuertos militares"
 Sweden_foci.41.d: "Nuestra actual infraestructura militar de base aérea sigue la doctrina de la Guerra Fría, enfatizando la dispersión sobre operaciones sostenidas. A la luz de las amenazas modernas y las necesidades operacionales, una reforma está atrasada. El personal de defensa ha presentado múltiples opciones que van desde la ampliación de capacidad y las mejoras logísticas hasta la construcción de un nuevo centro importante en el centro de Suecia."
 Sweden_foci.41.a: "Ampliación de la capacidad de las bases aéreas"
 Sweden_foci.41.b: "Construir una base en Värmland"
 Sweden_foci.41.c: "Modernizar la logística de las bases aéreas"
 Sweden_foci.42.t: "SAAB presenta el Gripen 39E"
 Sweden_foci.42.d: "La compañía de defensa sueca SAAB ha presentado oficialmente a su luchador multirole de próxima generación, el Gripen 39E. Diseñado para la superioridad del aire rentable, las huelgas de precisión y la guerra moderna en red, cuenta con sensores mejorados, rango y capacidad de armas.\n\nSuecia se ha ofrecido a exportar las aeronaves a nuestro país ya sea mediante un acuerdo directo de adquisición o un acceso limitado a tecnologías clave para el desarrollo nacional."
 Sweden_foci.42.a: "Coloque el orden y fortalezca nuestra fuerza aérea"
 Sweden_foci.42.b: "Estudiar el diseño y extraer lo que podemos"
 Sweden_foci.44.t: "Suecia solicita acceso a los misiles Taurus"
 Sweden_foci.44.d: "Suecia ha solicitado oficialmente permiso para comprar un número limitado de misiles de crucero Taurus KEPD 350. Estas armas de huelga de precisión de largo alcance desarrolladas conjuntamente por Alemania y Suecia dependen de componentes alemanes sensibles y la limpieza de las exportaciones. La delegación sueca insiste en que la adquisición fortalecería la defensa e interoperabilidad regionales.\n\nDebemos decidir si autorizar la transferencia."
 Sweden_foci.44.a: "Ellos ya utilizan algunos componentes que apruebamos el acuerdo"
 Sweden_foci.44.b: "No compartimos este nivel de capacidad"
 Sweden_foci.43.t: "Taurus Adquisición aprobada"
 Sweden_foci.43.d: "Alemania ha aprobado oficialmente nuestra solicitud de adquirir el sistema de misiles Taurus KEPD 350. Esto constituye un paso importante para profundizar la cooperación estratégica y dar un salto adelante en nuestras capacidades de huelga a largo plazo.\n\nAhora podemos poner un orden inicial o enfocarnos en aprender del diseño avanzado del misil."
 Sweden_foci.43.a: "Realizar un pedido para 40 unidades"
 Sweden_foci.43.b: "Estudiar el diseño para el desarrollo nacional"
 Sweden_foci.45.t: "Exportación del Taurus denegada"
 Sweden_foci.45.d: "Alemania ha rechazado nuestra solicitud de compra de misiles de crucero Taurus, citando restricciones a la exportación y preocupaciones políticas internas. Si bien es decepcionante, esta decisión revela los límites de la confianza estratégica y nos obliga a reconsiderar nuestra profunda doctrina."
 Sweden_foci.45.a: "Una señal inapropiada"
 Sweden_foci.34.t: "Kockums presenta el submarino de clase Blekinge"
 Sweden_foci.34.d: "El constructor naval sueco Kockums ha presentado su último desarrollo el submarino Blekinge-class (A26). Diseñado para operaciones subacuáticas de próxima generación, el buque cuenta con arquitectura avanzada del sigilo, bahías modulares de misión y propulsión independiente del aire.\n\nSe nos ha hecho una oferta formal de exportación. Ahora debemos decidir si comprar directamente los submarinos o participar en una asociación limitada para acceder a ciertos componentes y tecnologías."
 Sweden_foci.34.a: "Haga un pedido para el sistema completo"
 Sweden_foci.34.b: "Negociación para la tecnología e integración parciales"
 Sweden_foci.341.t: "Blekinge-Class Blueprints Entregado"
 Sweden_foci.341.d: "Siguiendo nuestro acuerdo con Kockums, hemos recibido los esquemas de producción completos para el submarino de clase Blekinge. La producción nacional puede comenzar inmediatamente, dando a nuestra marina un borde estratégico en operaciones de aguas poco profundas y patrullas robadas."
 Sweden_foci.341.a: "Excelente preparar las pasarelas"
 SWE_more_then_10_submarines_TT: "tiene más de §Y10 submarinos de ataque§! (Current: [?num_ships_with_type@attack_submarine|Y0])"
 SWE_more_then_400_multi_role_aircraft_TT: "tiene más de §Y400 aviones multirole§! (Current: [?num_deployed_planes_with_type@small_plane_strike_airframe|Y0])"
 SWE_more_then_20_awacs_aircraft_TT: "tiene más de §Y24 awacs aeronaves§! (Current: [?num_deployed_planes_with_type@large_plane_awacs_airframe|Y0])"
 SWE_more_then_12_special_bat_in_service_TT: "tiene más de §Y5 batallones de fuerzas especiales en servicio§! (Current: [?num_battalions_with_type@Special_Forces|Y0])"
 SWE_more_then_450_MBT_in_service_TT: "tiene más de §Y450 tanques en servicio§! (Current: [?num_equipment_in_armies@medium_tank_chassis|Y0])"
 SWE_more_then_1200_IFV_in_service_TT: "tiene más de §Y1200 IFV en servicio§! (Current: [?num_equipment_in_armies@medium_tank_flame_chassis|Y0])"
 SWE_stinky_melon: "Visitados"
 SWE_weapons_depots: "Dispersos depósitos de armas estratégicas"
 SWE_weapons_depots_desc: "De conformidad con nuestra doctrina de defensa total y resiliencia a largo plazo, debemos asegurar que nuestras fuerzas armadas y futuros esfuerzos de resistencia tengan acceso ininterrumpido a suministros esenciales. \n\nComenzaremos a dispersar silenciosamente armas, municiones y caches de equipo en todo el país, especialmente en las regiones rurales y boscosas. Estos depósitos ocultos formarán la columna vertebral de nuestra movilización de reservas y servirán como elemento disuasivo para cualquier ocupante."
 Sweden_news.31.d: "En un movimiento no visto desde la era de la Guerra Fría, el gobierno sueco ha comenzado a abrir depósitos de armas de larga data en todo el país. Originalmente establecidos como parte de la doctrina Totalförsvar, estos caches contienen armas, municiones y suministros destinados a apoyar las fuerzas de reserva en caso de emergencia nacional.\n\nSi bien Estocolmo sigue haciendo hincapié en la preferencia por la paz y la diplomacia, esta medida pone de manifiesto una creciente preocupación por el entorno de seguridad regional. La activación de los depósitos marca un claro cambio de la preparación pasiva a las medidas activas para imprevistos."
 Sweden_news.31.t: "Suecia activa los depósitos de armas ocultas"
 SWE_modernize_marinen_effort: "Modernizar la Marina Sueca"
 SWE_modernize_marinen_effort_desc: "Las fuerzas navales de Suecia han desempeñado durante mucho tiempo un papel crítico en la defensa de nuestras costas y asegurando el Mar Báltico. Sin embargo, las amenazas marítimas emergentes, la capacidad de huelga a largo plazo y la competencia submarina exigen una modernización fundamental del Marinen.\n\nInvertiremos en los combatientes de superficie actualizados, las tecnologías submarinos, las redes de sensores y las capacidades de guerra litoral. Una armada moderna es esencial no sólo para la defensa nacional, sino también para contribuir a la seguridad marítima regional y proteger las líneas vitales de comunicación marítima."
 SWE_swedish_mio_submarine: "Ampliar las capacidades submarinas suecas"
 SWE_swedish_mio_submarine_desc: "La flota submarino de Suecia ha sido optimizada tradicionalmente para operaciones en aguas poco profundas y estrechas del Mar Báltico. Sin embargo, las exigencias estratégicas evolutivas requieren un cambio más allá de la mera defensa costera.\n\nDebemos invertir en diseños de próxima generación con amplia gama, cargas modulares y resistencia adecuadas para misiones globales desde patrullas árticas hasta reconocimiento expedicionario. Una dedicada Organización Militar-Industrial (MIO) nos permitirá coordinar la investigación, producción e integración del sistema."
 Sweden_foci.46.t: "Charlas Submarinas con Kockums"
 Sweden_foci.46.d: "A medida que avanzamos para modernizar nuestra flota submarino, una delegación de Kockums ha llegado a presentar varias propuestas. Sus ingenieros navales están bien preparados, y los planes para un orden escalable ya están sobre la mesa.\n\nPero también hay... un invitado bien vestido en la esquina que no aparece en el horario. Acompañado por un secretario encantador y una maleta aún más encantadora, representa 'soluciones alternativas' a los retos de la adquisición."
 Sweden_foci.46.a: "Procede con un plan formal con Kockums"
 Sweden_foci.46.b: "La maleta habla más alto que los planos..."
 Sweden_foci.47.t: "Propuestas submarinas presentadas por los Kockums"
 Sweden_foci.47.d: "Tras el renovado interés de Suecia en ampliar sus capacidades submarinas, Kockums ha presentado una serie de conceptos submarinos avanzados. Fuentes cercanas al ministerio de defensa sugieren que se están considerando varios diseños que van desde naves modulares de patrullas sigilosas a plataformas de largo alcance profundo.\n\nUna decisión estratégica se espera pronto, con analistas navales elogiando el compromiso de Suecia para modernizar su flota."
 Sweden_foci.47.a: "Realmente profesional"
 Sweden_foci.48.t: "Clase 212 Submarines Llegan tranquilamente"
 Sweden_foci.48.d: "Esta mañana, dos nuevos submarinos de la clase 212 de fabricación alemana cambiaron tranquilamente las manos durante una ceremonia de baja llave a la que asistieron funcionarios selectos. Se dice que los buques, desarrollados por ThyssenKrupp Marine Systems, representan un «canal de adquisición paralelo» que supera largas licitaciones formales.\n\nAunque algunos periodistas han comenzado a hacer preguntas sobre la naturaleza del acuerdo y las personas involucradas, los círculos gubernamentales parecen infacesados. Por ahora, parece que la maleta ha entregado más que promesas."
 Sweden_foci.48.a: "Eficiencia alemana"
 Sweden_news.32.t: "¿Una Visita Real con Intención Estratégica?"
 Sweden_news.32.d: "Una delegación real sueca está visitando nuestro país, oficialmente para mejorar los vínculos diplomáticos y expresar buena voluntad. Pero mientras el público da la bienvenida a su llegada con entusiasmo y calidez, detrás de las escenas, los debates son más pragmáticos.\n\nEsta visita presenta una oportunidad. Su popularidad simbólica puede ser aprovechada para la diplomacia pública, y su presencia podría suavizar posiciones en las negociaciones en curso. Al mismo tiempo, nuestra parte es muy consciente de que la amistad por sí sola no paga las cuentas y tal vez sea hora de asegurar que la buena voluntad se traduzca en un beneficio estratégico o económico mensurable."
 Sweden_news.32.a: "Utilice su popularidad para el compromiso público"
 Sweden_news.32.b: "Nuestra amistad tiene su precio"
 Sweden_news.33.t: "Un día de verdadera amistad"
 Sweden_news.33.d: "La visita real sueca en §Y[FROM.GetNameWithFlag]§! se convirtió en más que una ocasión ceremonial. Mientras los banquetes estatales y las declaraciones conjuntas llenaban el horario, era la resonancia pública inesperada lo que realmente importaba. Royals habló directamente con nuestros ciudadanos, asistió a eventos culturales y simbólicamente fortaleció el vínculo entre nuestros pueblos.\n\nA veces, la diplomacia no necesita un acuerdo complejo. A veces, es suficiente ser visto, escuchado y recordado."
 Sweden_news.33.a: "Esta es una verdadera amistad."
 Sweden_news.34.t: "Ofertas detrás de puertas cerradas"
 Sweden_news.34.d: "Aunque la delegación real captó titulares, el verdadero éxito de la visita en §Y[FROM.GetNameWithFlag]§! se apartó de las cámaras. Durante las reuniones de puerta cerrada, se suspendieron las negociaciones iniciales. No fue hasta que un representante industrial sueco del séquito oficial intervino y propuso una empresa conjunta de fábrica que el avance llegó.\n\nEl acuerdo puede no haber sido grande, pero sentó las bases para la cooperación futura. A veces, la diplomacia está sellada por el sentido empresarial más que las palabras."
 Sweden_news.34.a: "No es genial, pero todavía un éxito"
 Sweden_foci.50.t: "Una invitación a NORDEFCO"
 Sweden_foci.50.d: "La Cooperación de Defensa Nórdica (NORDEFCO) se ha convertido en un foro relevante para la alineación estratégica y la cooperación militar en toda la región nórdica. Recientemente recibimos una invitación oficial para convertirse en miembro participante completo.\n\nMientras que la oferta promete acceso a ejercicios conjuntos, logística y estructuras de adquisiciones compartidas, los críticos advierten que puede atarnos demasiado de cerca a las posturas de defensa de los estados vecinos y erosionar elementos de soberanía nacional. ¿Es más estrecha la cooperación nórdica un paso adelante, o un compromiso demasiado lejos?"
 Sweden_foci.50.a: "Participaremos en NORDEFCO"
 Sweden_foci.50.b: "No renunciaremos a nuestra independencia."
 Sweden_foci.51.t: "[FROM.GetNameWithFlag] Rechaza la membresía NORDEFCO"
 Sweden_foci.51.d: "A pesar de una invitación abierta y esperanzas para un marco de defensa nórdica unificado, [FROM.GetName] ha rechazado oficialmente unirse a NORDEFCO como miembro completo. Su decisión, enmarcada como cuestión de soberanía y autonomía estratégica, ha arrojado una sombra sobre los esfuerzos de integración regional.\n\nMientras la puerta permanece abierta para la cooperación futura, esto marca una oportunidad perdida para fortalecer las capacidades de defensa colectiva en el Norte."
 Sweden_foci.51.a: "Una decisión lamentable"
 Sweden_foci.52.t: "Funding of NORDCAPS"
 Sweden_foci.52.d: "Hemos recibido una invitación para unirse al nuevo marco de cooperación militar nórdico-báltico: NORDCAPS. A raíz del cambio de equilibrios de poder y las crecientes amenazas híbridas, la unidad regional ya no es un lujo sino una necesidad.\n\nLa membresía significaría formación conjunta, interoperabilidad, estrategias de contratación compartida y una doctrina común de defensa entre los estados nórdico y báltico. Algunos ven esto como la base de una identidad europea de seguridad verdaderamente independiente en el norte. Otros advierten de la pérdida de flexibilidad estratégica.\n\n¿Vamos a dar un paso adelante?"
 Sweden_foci.52.a: "Somos más fuertes."
 Sweden_foci.52.b: "Caminamos solos"
 Sweden_foci.53.t: "Desperdiciaron su oportunidad"
 Sweden_foci.53.d: "Otra nación tuvo la oportunidad de unirse a nosotros en una iniciativa colectiva de defensa, y lo dejaron escapar. Mientras extendimos nuestra mano, dudaron, postraron o ignoraron la llamada.\n\nHay momentos en la historia cuando las opciones definen más que la política. Éste era uno de ellos."
 Sweden_foci.53.a: "Jerks"
 Sweden_foci.54.t: "Formación de Nordbanken"
 Sweden_foci.54.d: "Las autoridades suecas han aprobado la fusión bancaria que formará Nordbanken, una importante institución financiera con fuerte influencia regional. Nos están invitando a apoyar y participar en esta fusión. Esa cooperación podría abrir nuevas oportunidades financieras y fortalecer las inversiones transfronterizas."
 Sweden_foci.54.a: "Esto vitalizará nuestra economía."
 Sweden_foci.54.b: "No, vamos a declinar."
 Sweden_foci.55.t: "Oferta sueca para aumentar la cooperación militar-industrial"
 Sweden_foci.55.d: "Suecia ha propuesto un acuerdo para profundizar nuestra cooperación en el sector militar-industrial. Esto incluiría proyectos conjuntos de desarrollo, capacidades de producción compartidas y adquisiciones coordinadas para mejorar la eficiencia y la capacidad."
 Sweden_foci.55.a: "Acepta la oferta."
 Sweden_foci.55.b: "Mantenga la producción nacional."
 Sweden_foci.56.t: "Invitación al grupo de intercambio tecnológico sueco"
 Sweden_foci.56.d: "Suecia nos ha invitado a sumarnos a su nuevo grupo de intercambio tecnológico. La iniciativa tiene como objetivo fomentar la cooperación en investigación avanzada, tecnología de defensa e innovación industrial entre socios de confianza."
 Sweden_foci.56.a: "Firme el acuerdo."
 Sweden_foci.56.b: "Descansa la oferta."
 Sweden_foci.57.t: "Solicitud de compra de Drones Reaper"
 Sweden_foci.57.d: "El gobierno sueco se ha acercado a nosotros con una solicitud de compra de drones MQ-9 Reaper. Afirman que esta adquisición mejorará significativamente su capacidad de reconocimiento y huelga, fortaleciendo su capacidad para responder a las amenazas modernas."
 Sweden_foci.57.a: "Vender los drones."
 Sweden_foci.57.b: "Negar su petición."
 Sweden_royal.13.t: "Propuesta de un Real Instituto Cultural"
 Sweden_royal.13.d: "Una delegación diplomática de Suecia ha llegado con una oferta prestigiosa. Desean establecer un Real Instituto Cultural dentro de nuestro país, destinado a profundizar el intercambio cultural, fomentar la comprensión mutua y fortalecer nuestros vínculos bilaterales. El instituto acogería exposiciones, intercambios académicos y proyectos históricos conjuntos, proporcionando al mismo tiempo un puente simbólico entre nuestros pueblos.\n\nTal institución podría mejorar nuestras relaciones y crear una base duradera para la cooperación, pero algunos dentro de nuestra administración son precavidos de posibles substancias políticas."
 Sweden_royal.13.a: "Este será nuestro beneficio mutuo."
 Sweden_royal.13.b: "La respuesta es no"
 SWE_norways_kings: "Norway's Kings"
 SWE_norways_kings_desc: "La Familia Real de Noruega, con su larga y orgullosa historia, sigue siendo un símbolo respetado de unidad y tradición en Noruega. Sus estrechos lazos históricos y familiares con nuestra propia Casa Real presentan una oportunidad única para fortalecer los lazos entre nuestras naciones. Al fomentar la diplomacia real, los eventos culturales compartidos y los compromisos públicos coordinados, podemos reforzar las conexiones personales entre las dos monarquías.\n\nTales esfuerzos podrían crear un sentido más fuerte de parentesco nórdico, profundizar la confianza entre nuestros pueblos y presentar un frente real unido a los ojos del mundo."
 SWE_nb8_member: "Miembro de la cooperación nórdico-báltica"
 SWE_small_arms_improve: "Modernizar las armas pequeñas"
 SWE_small_arms_improve_desc: "Desde los bosques de Norrland hasta las calles de Estocolmo, nuestros soldados deben estar equipados con armas dignas de un ejército moderno. Al mejorar el diseño, la producción y la distribución de nuestras armas pequeñas, garantizaremos que el soldado sueco siga siendo un símbolo de precisión y fiabilidad."
 SWE_military_review_idea: "Examen militar"
 SWE_economy_review_idea: "Examen económico"
 SWE_science_patronage_idea: "Patronaje científico"
 SWE_real_kingdom: "Proclamar el Reino de Suecia"
 SWE_real_kingdom_desc: "El pueblo ha hablado, y su voluntad no puede ser ignorada. Al proclamar formalmente el Reino Real de Suecia, restauramos el lugar tradicional de la Corona como pilar central de la identidad de nuestra nación, al tiempo que lo combinamos con la estabilidad de la gobernanza moderna. Carolus Rex está listo para llevarnos a una nueva era."
 SWE_real_equality: "Igualdad real"
 SWE_ban_islam_modifier: "Prohibición del Islam"
 SWE_tight_bands: "Relaciones amigables"
 SWE_Swedish_mediation: "Diplomacia sueca"
 Swedisch_monarchy: "Diplomacia Real de Suecia"
 SWE_neutral_trade_efforts: "Actividades comerciales de neutralidad"
 SWE_neutral_efforts: "Actividades comerciales de neutralidad"
 SWE_opened_market: "Mercado abierto para nosotros"
 SWE_anti_nato_minus: "Curso Anti-NATO"
 SWE_anti_nato_plus: "Curso Anti-NATO"
 SWE_send_to_UN: "Asignar a un miembro de la Familia Real a un programa de la ONU"
 SWE_visit_asia: "Misión diplomática en el Lejano Oriente"
 SWE_visit_EU: "Gira diplomática real por Europa"
 SWE_governmental_office: "Internship in Riksdag"
 SWE_trading_net: "Red comercial nórdica"
 SWE_trading_net_desc: "Suecia ha fortalecido sus vínculos comerciales en toda la región nórdica, creando una red económica resiliente que asegura las importaciones clave, aumenta las exportaciones y estabiliza el crecimiento."
 SWE_gold_reserve: "Reserva Estratégica del Oro"
 SWE_gold_reserve_desc: "Al ampliar las tenencias nacionales de oro, Suecia refuerza la independencia financiera y la credibilidad, proporcionando un búfer contra las crisis y la presión externa."
 SWE_swiss_neutrality: "Neutralidad Suiza-Estilo"
 SWE_swiss_neutrality_desc: "Modelado en la práctica suiza, Suecia se compromete a una neutralidad estricta manteniendo una defensa creíble. Esto preserva la libertad de acción y la flexibilidad diplomática."
 SWE_neutrality_reintended: "Neutralidad confirmada"
 SWE_neutrality_reintended_desc: "Suecia volverá a los principios de la diplomacia imparcial y la formulación de políticas independientes. Al reafirmar nuestra posición de neutralidad, no nos comprometemos a alianzas ni bloques, sino a la defensa de nuestra soberanía y la búsqueda de soluciones pacíficas."
 SWE_refuse_all_block_membership: "Rechazar todos los miembros de Bloc"
 SWE_refuse_all_block_membership_desc: "Suecia permanecerá fuera de todos los bloques militares y políticos, preservando nuestra libertad de acción y asegurando que nuestra política exterior sea dictada únicamente por intereses suecos."
 SWE_host_international_mediation_summit: "Reunión de la Cumbre Internacional sobre Mediación"
 SWE_host_international_mediation_summit_desc: "Invitaremos a diplomáticos, negociadores y líderes de todo el mundo a Suecia para una cumbre encaminada a resolver las controversias en curso. Esto fortalecerá nuestra reputación como mediador de confianza."
 SWE_security_guaraties_for_neutrals: "Garantías de seguridad para Neutrals"
 SWE_security_guaraties_for_neutrals_desc: "Al ofrecer garantías mutuas de defensa a otros estados neutrales, creamos un disuasivo colectivo contra la agresión, reforzando al mismo tiempo nuestro compromiso común con la independencia."
 SWE_non_aligned_trade_network: "Red de Comercio de Países No Alineados"
 SWE_non_aligned_trade_network_desc: "Formaremos una red comercial entre naciones no alineadas, asegurando vínculos económicos estables sin enredos políticos."
 SWE_emergency_refugees_hub: "Centro de refugiados de emergencia"
 SWE_emergency_refugees_hub_desc: "Suecia establecerá una infraestructura de respuesta rápida para albergar y procesar a los refugiados en tiempos de crisis, equilibrando la responsabilidad humanitaria con la seguridad nacional."
 SWE_international_arbitration_authoritry: "Autoridad Internacional de Arbitraje"
 SWE_international_arbitration_authoritry_desc: "Suecia establecerá una autoridad permanente para el arbitraje, ofreciendo resolución legal a las controversias entre estados y empresas bajo control neutral."
 SWE_enshine_Armed_neutrality_in_law: "Consagrar por ley la neutralidad armada"
 SWE_enshine_Armed_neutrality_in_law_desc: "Haremos de la neutralidad armada un principio constitucional, asegurando que los futuros gobiernos mantengan la defensa independiente e imparcialidad diplomática de Suecia."
 SWE_total_border_sorvailance: "Total de Vigilancia Fronteriza"
 SWE_total_border_sorvailance_desc: "Al integrar sistemas avanzados de vigilancia a lo largo de todas las fronteras, aseguramos nuestro territorio contra la infiltración, el contrabando y el espionaje."
 SWE_reinforce_gotland_bastion: "Reforzar Gotland Bastion"
 SWE_reinforce_gotland_bastion_desc: "Gotland es la clave para la seguridad báltica. Ampliaremos sus fortificaciones, defensas aéreas y presencia naval para disuadir cualquier acción hostil."
 SWE_underground_command_center: "Centro de comandos subterráneo"
 SWE_underground_command_center_desc: "Construiremos una instalación de comandos endurecidos y subterráneos para asegurar que el liderazgo nacional pueda funcionar incluso durante las crisis más graves."
 SWE_Energy_autarky_program: "Programa Energy Autarky"
 SWE_Energy_autarky_program_desc: "Mediante la diversificación de las fuentes de energía y el aumento de la producción nacional, Suecia puede eliminar la dependencia de los suministros energéticos extranjeros."
 SWE_Arctic_defence_initiative: "Iniciativa de defensa del Ártico"
 SWE_Arctic_defence_initiative_desc: "Aumentaremos nuestra presencia e infraestructura militar en el Ártico para salvaguardar nuestros territorios del norte y carriles de transporte."
 SWE_national_cyber_defense_grid: "Red nacional de defensa cibernética"
 SWE_national_cyber_defense_grid_desc: "Una red de defensa cibernética totalmente integrada protegerá la infraestructura crítica y las comunicaciones estatales contra la intrusión digital."
 SWE_gold_reserve_expansion: "Ampliación de la reserva de oro"
 SWE_gold_reserve_expansion_desc: "Aumentar nuestras reservas de oro reforzará la estabilidad financiera y fortalecerá nuestra soberanía económica en tiempos de incertidumbre mundial."
 SWE_banking_secrecy_act: "Ley de secreto bancario"
 SWE_banking_secrecy_act_desc: "Presentaremos estrictas protecciones de confidencialidad para los clientes bancarios, atrayendo depósitos extranjeros mientras reforzamos nuestra neutralidad financiera."
 SWE_national_militaria_expansion: "Expansión Nacional Militaria"
 SWE_national_militaria_expansion_desc: "Ampliaremos nuestros arsenales de armas, municiones y equipo militar para asegurar la disponibilidad en cualquier situación."
 SWE_universal_conscription_reform: "Reforma Universal de Conscripción"
 SWE_universal_conscription_reform_desc: "Modernizaremos y ampliaremos nuestro sistema de conscripción, asegurando que cada ciudadano sea entrenado y preparado para defender a la nación."
 SWE_armed_financial_neutrality_doctrine: "Doctrina de Neutralidad Financiera Armada"
 SWE_armed_financial_neutrality_doctrine_desc: "Combinando sólidas capacidades de defensa con una estricta independencia económica, Suecia disuaderá tanto la coacción militar como financiera."
 SWE_declaration_of_perpetual_neutrality: "Declaración de Neutralidad Perpetua"
 SWE_declaration_of_perpetual_neutrality_desc: "Declararemos formalmente la neutralidad perpetua de Suecia, comprometiéndonos a evitar guerras de agresión manteniendo la fuerza para defendernos."
 SWE_neutrality_without_equal: "Neutralidad sin igual"
 SWE_neutrality_without_equal_desc: "A través de la diplomacia, la independencia económica y la preparación militar, Suecia se convertirá en el estándar mundial para un estado neutral verdaderamente independiente y respetado."
 SWE_eastern.01.t: "Invitación al ejercicio militar conjunto"
 SWE_eastern.01.d: "Suecia ha propuesto un ejercicio militar conjunto con Rusia para mejorar la cooperación y preparación regionales.\n"
 SWE_eastern.01.a: "Aceptamos la invitación"
 Sweden_eastern.01.b: "Debemos rechazarla educadamente."
 Sweden_eastern.101.t: "Rusia acepta la invitación"
 Sweden_eastern.101.d: "Rusia ha aceptado nuestra propuesta de realizar ejercicios militares conjuntos. Se trata de un signo positivo de cooperación militar.\n"
 Sweden_eastern.101.a: "Fuerza por unidad"
 Sweden_eastern.102.t: "Rusia declina la invitación"
 Sweden_eastern.102.d: "Rusia ha rechazado la invitación de Suecia a unirse en ejercicios militares. Las tensiones diplomáticas aumentan ligeramente como resultado.\n"
 Sweden_eastern.102.a: "Lo entendemos."
 Sweden_eastern.02.t: "Propuesta para unirse a la Iniciativa del Cinturón y la Ruta"
 Sweden_eastern.02.d: "Suecia ha invitado formalmente a China a participar en la Iniciativa del Cinturón y la Ruta, ofreciendo coinversión en proyectos de infraestructura destinados a fortalecer los lazos económicos euroasiáticos.\n"
 Sweden_eastern.02.a: "Sí, China invierte mucho"
 Sweden_eastern.02.b: "Apoyo moderado"
 Sweden_eastern.02.c: "Debemos declinar"
 Sweden_eastern.03.t: "China se compromete a una inversión importante"
 Sweden_eastern.03.d: "China ha aceptado la propuesta de Suecia con un importante compromiso de inversión. Esto ha mejorado considerablemente los vínculos económicos y políticos bilaterales.\n"
 Sweden_eastern.03.a: "A nuestra prosperidad compartida"
 Sweden_eastern.04.t: "China ofrece inversiones moderadas"
 Sweden_eastern.04.d: "China ha convenido en sumarse a la iniciativa a un nivel moderado, lo que indica buena voluntad y compromiso limitado con los esfuerzos conjuntos de infraestructura.\n"
 Sweden_eastern.04.a: "A prudent collaboration"
 Sweden_eastern.05.t: "China disminuye la participación"
 Sweden_eastern.05.d: "China se ha negado a participar en la Iniciativa Franja y la Ruta en asociación con Suecia. Si bien esto retrasa la cooperación, el camino diplomático sigue abierto.\n"
 Sweden_eastern.05.a: "Respetamos su decisión"
 Sweden_eastern.07.t: "Propuesta de Pacto Estratégico de Energía"
 Sweden_eastern.07.d: "Suecia ha propuesto un acuerdo estratégico de energía con la Federación de Rusia, cuyo objetivo es asegurar la cooperación a largo plazo en materia de combustible e infraestructura.\n"
 Sweden_eastern.07.a: "Acepta la propuesta e invierte"
 Sweden_eastern.07.b: "Debemos declinar"
 Sweden_eastern.08.t: "Rusia acepta Pacto de Energía"
 Sweden_eastern.08.d: "Rusia ha aceptado el pacto energético. Seguirá el desarrollo conjunto de la infraestructura y los vínculos económicos más profundos.\n"
 Sweden_eastern.08.a: "Una alianza energética nace"
 Sweden_eastern.09.t: "Rusia rechaza el Pacto de Energía"
 Sweden_eastern.09.d: "Rusia ha rechazado la propuesta de un acuerdo estratégico de energía. Suecia debe explorar ahora otros socios energéticos.\n"
 Sweden_eastern.09.a: "Un resultado decepcionante"
 Sweden_eastern.10.t: "Propuesta para el intercambio de tecnología militar"
 Sweden_eastern.10.d: "Suecia propone un programa conjunto de intercambio de tecnología militar entre la SAAB y el Ejército Popular de Liberación, destinado a fomentar la innovación y la coordinación estratégica.\n"
 Sweden_eastern.10.a: "Aceptamos y empezamos la cooperación"
 Sweden_eastern.10.b: "Declinamos la propuesta"
 Sweden_eastern.11.t: "China acepta intercambio tecnológico"
 Sweden_eastern.11.d: "China ha aceptado la propuesta de un intercambio de tecnología conjunto. Ingenieros de SAAB y el PLA iniciarán la investigación colaborativa.\n"
 Sweden_eastern.11.a: "Excelente"
 Sweden_eastern.12.t: "China Rechaza el intercambio tecnológico"
 Sweden_eastern.12.d: "China ha rechazado la oferta de Suecia para la colaboración tecnológica. Esto limita las opciones de defensa R&D de Suecia.\n"
 Sweden_eastern.12.a: "Lamentable"
 Sweden_eastern.14.t: "Propuesta del Pacto de Minerales"
 Sweden_eastern.14.d: "Suecia propone un acuerdo estratégico con Corea del Norte para asegurar minerales raros y recursos industriales a cambio de la cooperación económica y el reconocimiento.\n"
 Sweden_eastern.14.a: "Aceptar el pacto de minerales"
 Sweden_eastern.14.b: "Rechazar la oferta"
 Sweden_eastern.15.t: "Corea del Norte acepta Pacto de Minerales"
 Sweden_eastern.15.d: "Corea del Norte ha aceptado la propuesta. Suecia comenzará a importar recursos estratégicos clave y se ha establecido una cooperación limitada.\n"
 Sweden_eastern.15.a: "Excelente"
 Sweden_eastern.16.t: "Corea del Norte rechaza el Pacto"
 Sweden_eastern.16.d: "Corea del Norte ha rechazado la oferta de Suecia para un acuerdo mineral. Esto puede complicar la estrategia de abastecimiento industrial a largo plazo de Suecia.\n"
 Sweden_eastern.16.a: "Lamentable"
 Sweden_eastern.17.t: "Propuesta para el intercambio de la industria militar"
 Sweden_eastern.17.d: "Suecia propone un acuerdo secreto con Corea del Norte para intercambiar conocimientos y herramientas de la industria militar. Esta cooperación puede mejorar la producción en ambas partes, aunque corre el riesgo de retroceso internacional.\n"
 Sweden_eastern.17.a: "Acorde con el intercambio"
 Sweden_eastern.17.b: "Nosotros no podemos arriesgar esto"
 Sweden_eastern.18.t: "Corea del Norte acepta Pacto de Industria"
 Sweden_eastern.18.d: "Corea del Norte ha acordado un acuerdo de cooperación industrial. Actualmente se está llevando a cabo el desarrollo de la industria militar mutua.\n"
 Sweden_eastern.18.a: "Una alianza inesperada"
 Sweden_eastern.19.t: "Corea del Norte rechaza la propuesta"
 Sweden_eastern.19.d: "Corea del Norte ha rechazado el acuerdo industrial. Suecia debe buscar otros medios para ampliar su producción militar.\n"
 Sweden_eastern.19.a: "Una Oportunidad Perdida"
 Sweden_eastern.20.t: "Propuesta sueca para construir el ferrocarril comercial ártico"
 Sweden_eastern.20.d: "El gobierno sueco ha propuesto invertir en un proyecto de infraestructura conjunta: un ferrocarril de alta capacidad entre Estocolmo y Murmansk. La línea mejoraría el comercio y la logística entre nuestras naciones a través del corredor Ártico.\n"
 Sweden_eastern.20.a: "Trenes para la victoria"
 Sweden_eastern.21.t: "Propuesta de Acuerdo de Inversión con Suecia"
 Sweden_eastern.21.d: "Suecia ha propuesto un acuerdo de inversión bilateral con Venezuela. A cambio del petróleo venezolano, Suecia invertirá en infraestructura venezolana y tecnología avanzada.\n"
 Sweden_eastern.21.a: "Aceptar el acuerdo"
 Sweden_eastern.21.b: "Debemos declinar"
 Sweden_eastern.22.t: "Venezuela acepta el Acuerdo de Inversiones"
 Sweden_eastern.22.d: "Venezuela ha acordado el acuerdo de inversión. Suecia recibirá petróleo, mientras que Venezuela se beneficia de la experiencia sueca y la inversión en infraestructura.\n"
 Sweden_eastern.22.a: "Excelente cooperación"
 Sweden_eastern.23.t: "Venezuela rechaza el Acuerdo de Inversión"
 Sweden_eastern.23.d: "Venezuela ha rechazado la propuesta de Suecia para un acuerdo de inversión mutua. La cooperación diplomática y energética no procederá.\n"
 Sweden_eastern.23.a: "Lamentable"
 Sweden_eastern.24.t: "Propuesta de cooperación petrolera offshore"
 Sweden_eastern.24.d: "Suecia ha propuesto una iniciativa conjunta con Angola para desarrollar plataformas de petróleo offshore a lo largo de la costa atlántica. La asociación aseguraría suministros energéticos e impulsaría la infraestructura de extracción de Angola.\n"
 Sweden_eastern.24.a: "Aceptar la empresa conjunta"
 Sweden_eastern.24.b: "Rechazar la propuesta"
 Sweden_eastern.25.t: "Angola acepta el Acuerdo sobre petróleo desbordado"
 Sweden_eastern.25.d: "Angola ha aceptado la propuesta. Suecia invertirá en el desarrollo conjunto de plataformas offshore, ampliando el acceso a valiosas reservas petroleras.\n"
 Sweden_eastern.25.a: "Una asociación valiosa"
 Sweden_eastern.26.t: "Angola rechaza la propuesta"
 Sweden_eastern.26.d: "Angola ha rechazado la oferta de Suecia para el desarrollo conjunto offshore. Los canales diplomáticos siguen abiertos, pero la cooperación no procederá.\n"
 Sweden_eastern.26.a: "Lamentable"
 Sweden_eastern.27.t: "Propuesta de acuerdo sobre metales estratégicos"
 Sweden_eastern.27.d: "Suecia ha propuesto un acuerdo bilateral para asegurar el acceso a los metales raros y estratégicos de Sudáfrica. A cambio, Suecia invertirá en tecnologías mineras y capacidad industrial.\n"
 Sweden_eastern.27.a: "Aceptar la propuesta"
 Sweden_eastern.27.b: "Rechazar la oferta"
 Sweden_eastern.28.t: "Sudáfrica acepta el acuerdo de metales"
 Sweden_eastern.28.d: "Sudáfrica ha acordado el acuerdo bilateral. Suecia obtiene acceso garantizado a metales raros, mientras que Sudáfrica se beneficia de la inversión tecnológica y la cooperación minera.\n"
 Sweden_eastern.28.a: "Alianzas valiosas"
 Sweden_eastern.29.t: "Sudáfrica rechaza el Acuerdo"
 Sweden_eastern.29.d: "Sudáfrica ha rechazado el acuerdo de comercio de metales propuesto. Suecia tendrá que buscar otros asociados para sus necesidades de recursos.\n"
 Sweden_eastern.29.a: "That's unfortunate"
 Sweden_eastern.30.t: "Propuesta para un intercambio médico con Suecia"
 Sweden_eastern.30.d: "Suecia ha propuesto un acuerdo de cooperación médica: Cuba aportaría sus médicos y experiencia sanitaria mundial, mientras que Suecia proporciona investigación, equipo y conocimientos biotecnológicos.\n"
 Sweden_eastern.30.a: "Aceptar el intercambio médico"
 Sweden_eastern.30.b: "Rechazar la oferta"
 Sweden_eastern.31.t: "Cuba acepta el intercambio médico"
 Sweden_eastern.31.d: "Cuba ha aceptado el acuerdo de cooperación médica. Actualmente se iniciarán misiones conjuntas de salud y programas de intercambio de investigación.\n"
 Sweden_eastern.31.a: "Por la salud mundial"
 Sweden_eastern.32.t: "Cuba rechaza el intercambio médico"
 Sweden_eastern.32.d: "Cuba ha rechazado la propuesta de colaboración médica. La cooperación diplomática en materia de salud no procederá.\n"
 Sweden_eastern.32.a: "Una Oportunidad Perdida"
 Sweden_eastern.33.t: "Propuesta de un Acuerdo Petroquímico Sueco-Iraniano"
 Sweden_eastern.33.d: "El Gobierno sueco ha presentado una propuesta oficial al Ministerio iraní de Petróleo. El acuerdo describe las inversiones conjuntas en refinación de infraestructura, instalaciones offshore y procesamiento petroquímico avanzado. Suecia busca un suministro estable de recursos derivados del petróleo, mientras que el Irán se beneficiaría de la experiencia industrial, el equipo y el capital extranjero sueco.\n\nSi se acepta, el acuerdo podría sentar las bases para una asociación energética estratégica a largo plazo."
 Sweden_eastern.33.a: "Aceptar el acuerdo petroquímico"
 Sweden_eastern.33.b: "Rechazar la oferta"
 Sweden_eastern.34.t: "Irán acepta el Acuerdo Petroquímico"
 Sweden_eastern.34.d: "Irán ha aprobado el acuerdo propuesto con Suecia. Las empresas conjuntas comenzarán a desarrollar y modernizar complejos de refinería, así como a ampliar la producción química industrial. Las empresas de ingeniería suecas se están preparando para entrar en el mercado iraní, marcando un nuevo capítulo en los vínculos económicos bilaterales.\n"
 Sweden_eastern.34.a: "Lanzamiento de la asociación"
 Sweden_eastern.35.t: "Irán rechaza el Acuerdo Petroquímico"
 Sweden_eastern.35.d: "Irán ha rechazado la oferta de Suecia para formar una asociación petroquímica. Aunque los canales diplomáticos siguen abiertos, la oportunidad para el desarrollo conjunto de la energía se ha aplazado indefinidamente.\n"
 Sweden_eastern.35.a: "Infortunado, pero entendido"
 Sweden_eastern.36.t: "Propuesta para el intercambio tecnológico de Drone"
 Sweden_eastern.36.d: "Suecia se ha ofrecido a concertar un pacto de tecnología bilateral con Irán. A cambio del acceso a los diseños de drones de combate y los datos operativos, Suecia proporcionará los sistemas de guerra aeroespacial y electrónica de la SAAB.\n\nAmbas naciones se benefician de la polución cruzada de sistemas UAV de campo de batalla probados y de alta tecnología."
 Sweden_eastern.36.a: "Acorde con el intercambio de tecnología"
 Sweden_eastern.36.b: "Rechazar la oferta"
 Sweden_eastern.37.t: "Irán acepta Pacto de Drone"
 Sweden_eastern.37.d: "Irán ha aceptado el acuerdo bilateral sobre tecnología de drones. La cooperación en materia de desarrollo y capacitación cruzada de los Emiratos Árabes Unidos comenzará ahora entre las empresas suecas e iraníes y el personal militar.\n"
 Sweden_eastern.37.a: "Comience el programa conjunto"
 Sweden_eastern.38.t: "Irán rechaza el pacto de Drone"
 Sweden_eastern.38.d: "Irán ha rechazado la oferta de Suecia para un acuerdo conjunto de investigación y desarrollo de drones. La iniciativa se ha estancado por ahora.\n"
 Sweden_eastern.38.a: "Lamentable"
 SWE_towards_communism: "Avanzando hacia el socialismo"
 SWE_towards_communism_desc: "Para abordar plenamente las injusticias sociales, debemos transitar hacia una economía socialista donde la clase trabajadora controle los medios de producción. Al redistribuir la riqueza, empoderar a los trabajadores y abolir las divisiones de clase, podemos construir una sociedad más igualitaria y justa."
