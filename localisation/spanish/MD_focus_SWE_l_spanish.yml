l_spanish:
 sweden_focus: "Árbol de Enfoque Sueco"
 SWE_post_crisis_fiscal_decisions: "Decisiones Fiscales Post-Crisis"
 SWE_post_crisis_fiscal_decisions_desc: "La economía sueca, que en los años 70 tuvo los ingresos más altos de Europa, no ha logrado mantenerse a la cabeza del resto. Especialmente la Crisis de los 90, cuando el PIB cayó un 5% a principios de la década, marcó la antes intocable máquina de dinero sueca. El presupuesto de 1994 tuvo un déficit del 15% del PIB. Ahora, el gobierno necesita establecer una política convincente para el nuevo milenio."
 SWE_riksbank_policy: "Política del Riksbank"
 SWE_riksbank_policy_desc: "El Riksbank de Suecia es el banco central, activo desde 1668 y encargado de gestionar la corona sueca, la moneda nacional. Las acciones del banco central pueden ser fundamentales para la postura fiscal e incluso diplomática del gobierno."
 SWE_currency_policy: "Política Monetaria"
 SWE_currency_policy_desc: "La inflación y la deflación son siempre posibilidades centrales a considerar. Mientras Suecia mantenga la corona como su moneda exclusiva y propia, el Riksbank puede controlar la cantidad de dinero en circulación y, por lo tanto, el valor de la moneda en los mercados nacionales e internacionales."
 SWE_improve_the_stridsvagn_122: "Mejorar el Stridsvagn 122"
 SWE_improve_the_stridsvagn_122_desc: "El Stridsvagn 122 es una versión con licencia del tanque de batalla principal Leopard 2A5 alemán. Especializado en combate forestal, el Stridsvagn aún podría ser objeto de experimentos militares para tal vez hacer que la próxima generación de tanques suecos sea aún más efectiva, y tal vez esta vez menos alemana, como familia de máquinas de guerra."
 SWE_contracts_for_german_armament_companies: "Contratos para Empresas de Armamento Alemanas"
 SWE_contracts_for_german_armament_companies_desc: "El sector militar sueco nunca ha sido masivo desde el principio y su tamaño también se ha reducido en las últimas décadas, especialmente desde el final de la Guerra Fría, que ha situado la 'neutralidad armada' un poco más abajo en las prioridades del gobierno. Mientras no podamos asegurarnos de que nuestras armas sean perfectas nosotros mismos, los alemanes ciertamente estarían encantados de ayudar. Tal vez deberíamos considerar contratarlos."
 SWE_oresund_bridge: "Puente de Öresund"
 SWE_oresund_bridge_desc: "En construcción desde finales de la década de 1990, el Öresundsbron (Øresundsbroen en danés) es un gran proyecto de puente y túnel que conecta Malmö en el sur de Suecia con Copenhague, la capital de Dinamarca. Esto marcaría una nueva conexión entre el sur de Fennoscandia y el continente europeo, y facilitaría el comercio con los daneses, así como con los alemanes y otros países europeos."
 SWE_expand_e20: "Ampliar la E20"
 SWE_expand_e20_desc: "La E20, una de las carreteras transeuropeas de la red de carreteras europeas, conecta, entre otros, Dinamarca y Suecia a través del recién construido puente de Öresund, para luego continuar hacia el norte hacia Estocolmo, donde la carretera continúa en ferry hacia Estonia y Rusia. Debemos asegurarnos de que el tráfico por la E20 pueda fluir libremente, porque lo que ayuda a nuestros socios nos ayuda a nosotros."
 SWE_expand_malmo_harbor: "Ampliar el Puerto de Malmö"
 SWE_expand_malmo_harbor_desc: "Con el Öresund completado, también deberíamos centrarnos en hacer de Malmö una nueva alternativa marítima atractiva para Gotemburgo. Esto permitiría a nuestros socios comerciales del sur en Dinamarca, Alemania y Polonia enviar mercancías de manera más eficaz y rápida hacia el territorio sueco."
 SWE_expand_the_merchant_fleet: "Expandir la Flota Mercante"
 SWE_expand_the_merchant_fleet_desc: "Con riqueza, debemos asegurarnos de crear la base para más riqueza. Construyendo una cantidad impresionante de convoyes, deberíamos poder asegurarnos de que Suecia se mantenga literalmente a flote en cuanto a competitividad económica."
 SWE_expand_the_stockholm_docks: "Expandir los Puertos de Estocolmo"
 SWE_expand_the_stockholm_docks_desc: "Nuestra ventana más importante hacia el Báltico oriental y hacia Finlandia, Estonia y Rusia es el sistema portuario de nuestra capital, Estocolmo. Deberíamos ampliarlo para que el comercio con estos países sea más fácil y menos complicado."
 SWE_northern_friendship: "Amistad del Norte"
 SWE_northern_friendship_desc: "Suecia es una nación de paz y no hay motivos para cambiar eso. Deberíamos centrarnos en construir relaciones cordiales y provechosas con nuestros socios, amigos y aliados europeos."
 SWE_friendship_with_denmark: "Amistad con Dinamarca"
 SWE_friendship_with_denmark_desc: "Suecia y Dinamarca tardaron bastante en descubrir su mutuo amor, y en los últimos diez siglos se enfrentaron en más de veinte guerras. Pero Dinamarca y Suecia, la primera inspiración de la bandera de la segunda, la segunda claramente superior a la primera en todos los demás aspectos, se han encontrado mutuamente como amigos y socios. Y a veces como rivales. Malditos daneses."
 SWE_friendship_with_norway: "Amistad con Noruega"
 SWE_friendship_with_norway_desc: "Noruega estuvo al lado de Suecia durante mucho tiempo, tanto figurativa como geográficamente. Aunque la extraña forma de su país es una historia aparte, es innegable que la amistad entre nuestras dos naciones ha sido mutuamente beneficiosa. Aunque eligieron el divorcio en 1905. Eso fue grosero."
 SWE_friendship_with_the_baltic_states: "Amistad con los Estados Bálticos"
 SWE_friendship_with_the_baltic_states_desc: "Estonia, Letonia y Lituania comparten mucho con los países nórdicos, al menos eso dicen. Mientras seguimos intentando descubrir qué similitudes culturales, aparte de una vaga relación lingüística entre el estonio y el finlandés, se supone que unen Europa del Norte a esa parte de Europa del Este, podríamos hacer que sean nuestros amigos de una vez. ¿Por qué no?"
 SWE_swedish_norwegian_steel_production: "Producción de Acero Sueco-Noruego"
 SWE_swedish_norwegian_steel_production_desc: "Las tierras fronterizas de Suecia y Noruega son ricas en recursos naturales y difíciles de alcanzar. Tal vez, al trabajar juntos, nuestros dos países puedan encontrar un terreno común sobre el cual pararse. Y otro terreno dividido que podamos explotar y vender al mejor postor."
 SWE_friendship_with_finland: "Amistad con Finlandia"
 SWE_friendship_with_finland_desc: "Finlandia ha sido nuestro vecino leal desde su independencia. Y aunque ellos no harían las mismas afirmaciones con respecto a nuestra lealtad después del debacle de la Guerra de Invierno, nuestras naciones están generalmente en buenos términos, especialmente considerando que los finlandeses-suecos son una importante minoría que ambas naciones deben cuidar en cierta medida juntas."
 SWE_job_opportunities_in_scania: "Oportunidades de Empleo en Escania"
 SWE_job_opportunities_in_scania_desc: "Con personas extranjeras y empresas que se mudan al sur de Suecia, podemos permitirnos patrocinar la creación de empleos en esta región. Más clientes significa más demanda, lo que se traduce en un mayor potencial de crecimiento."
 SWE_friendship_with_iceland: "Amistad con Islandia"
 SWE_friendship_with_iceland_desc: "Islandia es un espectáculo impresionante y diplomáticamente quizás el país menos controvertido de la Tierra. No ser amigo de Islandia es prácticamente un pecado."
 SWE_expand_e6: "Ampliar E6"
 SWE_expand_e6_desc: "La E6, que va desde el norte de Noruega hasta Oslo y desde allí hasta la punta sur de Suecia, es una de las rutas comerciales y de viaje más importantes entre Suecia y su vecino occidental rico en petróleo. Debemos valorar la relación noruego-sueca y la dinámica comercial entre nuestras dos naciones manteniendo la carretera intacta y haciéndola más accesible en nuestro lado."
 SWE_further_european_integration: "Mayor Integración Europea"
 SWE_further_european_integration_desc: "Aunque Suecia se muestra escéptica ante las ideas paneuropeas sólo desde un punto de vista cultural, una mayor integración económica ha demostrado ser innegablemente eficaz. Los alemanes compran nuestras cosas y nosotros compramos cosas alemanas. Los daneses compran nuestras cosas y nosotros compramos cosas danesas. Vendamos y compremos más cosas."
 SWE_reform_the_diplomatic_agenda: "Reformar la Agenda Diplomática"
 SWE_reform_the_diplomatic_agenda_desc: "El escenario mundial es un área muy delicada y un solo paso en falso puede costar miles de empleos o incluso millones de vidas. Debemos asegurarnos de que Suecia solo utilice lo mejor de lo mejor cuando se trata de embajadores, sirviendo los intereses suecos con determinación pero sin ofender abiertamente a nuestros socios."
 SWE_invite_european_experts: "Invitar a Expertos Europeos"
 SWE_invite_european_experts_desc: "Nuestros socios europeos tienen el personal necesario para resolver casi cualquier problema al que nos enfrentemos. Al invitarlos y reunirlos en Estocolmo, podríamos obtener un nuevo recurso de conocimiento del cual beneficiarnos."
 SWE_befriend_germany: "Hacer Amistad con Alemania"
 SWE_befriend_germany_desc: "Alemania es el destino más importante de las exportaciones de Suecia y el origen más importante de las importaciones. Ofender a los alemanes significaría poner en peligro toda nuestra economía."
 SWE_european_military_contracts: "Contratos Militares Europeos"
 SWE_european_military_contracts_desc: "Los miembros de la Unión Europea poseen una tecnología militar bastante avanzada y podemos utilizar medios diplomáticos para intercambiar nuestra experiencia."
 SWE_befriend_france: "Hacer Amistad con Francia"
 SWE_befriend_france_desc: "Francia es una de las potencias más influyentes de Europa, y pronto será nuestra amiga."
 SWE_armored_initiative: "Iniciativa de Blindados"
 SWE_armored_initiative_desc: "La guerra acorazada es más rápida y poderosa que la infantería regular, ¡hagamos la Blitzkrieg sueca!"
 SWE_artillery_initiative: "Iniciativa de Artillería"
 SWE_artillery_initiative_desc: "La artillería es muy importante en el frío norte, ya que los soldados pueden congelarse."
 SWE_infantry_weapons_initiative: "Iniciativa de Armas de Infantería"
 SWE_infantry_weapons_initiative_desc: "La infantería puede que no sea la mejor opción, ya que no es rápida y no tenemos muchos hombres para reclutar, pero no podemos ignorar que forma la columna vertebral de cualquier ejército."
 SWE_befriend_the_united_kingdom: "Hacer Amistad con el Reino Unido"
 SWE_befriend_the_united_kingdom_desc: "El Reino Unido es un gran país, una de las mayores potencias industriales y militares dentro de la UE. Hagamos amistad con ellos y saquemos provecho."
 SWE_overhaul_the_university_system: "Reformar el Sistema Universitario"
 SWE_overhaul_the_university_system_desc: "Nuestro sistema universitario no ha mejorado desde la antigüedad, necesitamos modernizarlo al nivel de Harvard."
 SWE_befriend_italy: "Hacer Amistad con Italia"
 SWE_befriend_italy_desc: "Nosotros y los italianos tenemos mucho en común, ¡como albóndigas y espaguetis!"
 SWE_join_nato: "Unirse a la OTAN"
 SWE_join_nato_desc: "La OTAN puede abrir muchas puertas a inversiones internacionales y cooperaciones militares."
 SWE_defensive_doctrines: "Doctrinas Defensivas"
 SWE_defensive_doctrines_desc: "Suecia y sus fríos desiertos son muy fáciles de defender, por lo que debemos centrarnos en ello. El sector industrial estará muy contento, mientras que nuestro sector de armas estará bastante enfadado."
 SWE_northern_ambition: "Ambición del Norte"
 SWE_northern_ambition_desc: "Suecia ha mantenido la neutralidad durante los últimos dos siglos. Es hora de poner fin a esta lamentable tendencia y plantar cara en un escenario mundial que nos ha ignorado durante demasiado tiempo."
 SWE_justify_swedish_imperialism: "Justificar el Imperialismo Sueco"
 SWE_justify_swedish_imperialism_desc: "En general, los esfuerzos coloniales suecos del pasado se ven como notas a pie de página risibles de la historia en los tiempos modernos. ¿Suecia poseyendo Estonia y Dánzig? ¿Colonizando en América del Norte? ¡Qué tontería, ¿verdad? Ya no más. Estos intentos de realizar un imperio sueco bajo un soberano sueco no deben ser objeto de burla, sino de admiración."
 SWE_partnership_of_convenience: "Asociación por Conveniencia"
 SWE_partnership_of_convenience_desc: "Rusia puede ser nuestro amigo muy fácilmente, ya que ambos vivimos en bosques fríos y desolados."
 SWE_join_csto: "Unirse a la CSTO"
 SWE_join_csto_desc: "Para encontrar una nueva posición dentro de la política mundial, nos hemos alejado de nuestros antiguos socios occidentales. Afortunadamente, hay otro gigante autoritario aislado que aspira al poder mundial cerca. Aliarnos con los rusos es el siguiente paso lógico para la grandeza sueca."
 SWE_animosity_towards_russia: "Animosidad hacia Rusia"
 SWE_animosity_towards_russia_desc: "Podríamos recuperar la confianza popular perdida asegurando a la población sueca que ciertamente no nos acercaremos a los autoritarios del este. Rusia no es amiga de Suecia."
 SWE_rediscover_racial_theories: "Redescubrir Teorías Raciales"
 SWE_rediscover_racial_theories_desc: "Suecia solía ser uno de los racistas originales, incluidas teorías biológicas sobre las implicaciones del patrimonio. Buenos tiempos. Al dar la bienvenida a estas doctrinas educativas de vuelta a nuestras escuelas, podríamos revivir una buena parte de la sociedad sueca."
 SWE_glorify_the_royal_family: "Glorificar a la Familia Real"
 SWE_glorify_the_royal_family_desc: "La familia real sueca nunca hizo nada malo y siempre tiene razón. ¡Son la mejor familia real de toda Europa!"
 SWE_demand_equality_for_finland_swedes: "Exigir Igualdad para los Suecos de Finlandia"
 SWE_demand_equality_for_finland_swedes_desc: "¡Los suecos en Finlandia han sufrido lo suficiente por estar allí! Exijamos cambios sociales al gobierno finlandés."
 SWE_glorify_the_viking_heritage: "Glorificar el Legado Vikingo"
 SWE_glorify_the_viking_heritage_desc: "¡Alabemos a Thor! ¡Alabemos a Odín! ¡Alabemos a Freya! Los antiguos dioses aman al nuevo gobierno y nosotros amamos nuestros grandes tiempos de saqueo, cuando partíamos con los bolsillos vacíos y regresábamos con ellos llenos de oro."
 SWE_the_king_of_sweden: "El Rey de Suecia"
 SWE_the_king_of_sweden_desc: "Hemos recordado adecuadamente a nuestro pueblo lo grandioso que es nuestro rey. ¡Es hora de restaurar a los herederos de Gustavo Adolfo y Carlos a su lugar legítimo!"
 SWE_anti_finnish_sentiment: "Sentimiento Anti-Finlandés"
 SWE_anti_finnish_sentiment_desc: "Dominémoslos nuevamente."
 SWE_embrace_the_northern_resistance_movement: "Abrazar el Movimiento de Resistencia del Norte"
 SWE_embrace_the_northern_resistance_movement_desc: "¡Suecia gobernará Escandinavia nuevamente!"
 SWE_the_emperor_of_sweden: "El Emperador de Suecia"
 SWE_the_emperor_of_sweden_desc: "Ser un rey está bien y todo, pero ¿sabes qué es mejor? Ser un emperador. 'Rey de Suecia' suena como el aburrido jefe de estado de una aburrida monarquía constitucional. Pero 'Emperador de Suecia' suena como un gobernante que va a hacer que Suecia sea grande de nuevo, hacer de Estonia una colonia de nuevo y hacer que el Rey de Bélgica parezca un idiota."
 SWE_northern_militias: "Milicias del Norte"
 SWE_northern_militias_desc: "Reclutar milicias en el país aumentará el tamaño de nuestro ejército y, por lo tanto, nuestro poder para la expansión."
 SWE_baltic_colonization_plan: "Plan de Colonización Báltica"
 SWE_baltic_colonization_plan_desc: "Atacar a todos los Estados bálticos asegurará la dominación nórdica de Suecia."
 SWE_government_propaganda: "Oficina Real de Comunicación"
 SWE_government_propaganda_desc: "La información es poder, y la Corona debe controlar su mensaje. Una oficina de comunicaciones real unificará nuestro discurso y silenciará la disidencia."
 SWE_offer_province_status_to_estonia: "Ofrecer el Estatuto de Provincia a Estonia"
 SWE_offer_province_status_to_estonia_desc: "Al ofrecerle a Estonia el estatuto de provincia, expandiremos el Imperio Sueco de manera pacífica."
 SWE_tillbaka_till_riket: "Tillbaka till Riket (De vuelta al Reino)"
 SWE_tillbaka_till_riket_desc: "El antiguo concepto alemán de 'Heim ins Reich' debería ser un buen modelo para nuestra propia ideología nacional."
 SWE_aryan_pact: "Pacto de Aseguramiento Mutuo Fascista"
 SWE_aryan_pact_desc: "El Pacto de Aseguramiento Mutuo Fascista (MFAP, por sus siglas en inglés) asegurará nuestros intereses en la expansión territorial europea, al tiempo que nos protege a nosotros y a nuestros 'aliados' Alemania."
 SWE_state_control_of_newspapers: "Control Estatal de los Periódicos"
 SWE_state_control_of_newspapers_desc: "Nuestra prensa ahora está controlada por el estado fascista, lo que hará que la gente crea en nuestra utopía nazi."
 SWE_censor_the_internet: "Censurar Internet"
 SWE_censor_the_internet_desc: "Internet es un lugar peligroso para nuestra población sueca. Podríamos censurarlo y prohibirlo en algunos lugares para asegurar la propaganda estatal en todas partes."
 SWE_ally_the_kaiser: "Aliar al Kaiser"
 SWE_ally_the_kaiser_desc: "El Kaiserreich alemán y el Imperio Sueco han regresado, qué gran momento para una alianza que asegure la monarquía en Europa."
 SWE_the_swedish_imperial_army: "El Ejército Imperial Sueco"
 SWE_the_swedish_imperial_army_desc: "Los vikingos fueron grandiosos, ¿qué tal la guerra moderna?"
 SWE_the_swedish_imperial_air_force: "La Fuerza Aérea Imperial Sueca"
 SWE_the_swedish_imperial_air_force_desc: "La Fuerza Aérea no existía en nuestro antiguo imperio, y será la mejor del mundo en el nuevo."
 SWE_pro_swedish_video_games: "Videojuegos Pro-Suecia"
 SWE_pro_swedish_video_games_desc: "De alguna manera, una compañía sueca originaria de Estocolmo comenzó a hacer grandes juegos sobre historia. Nos propusieron hacer un juego especial sobre nuestro grandioso imperio sueco si les pagamos."
 SWE_the_swedish_imperial_navy: "La Armada Imperial Sueca"
 SWE_the_swedish_imperial_navy_desc: "La Armada Real Sueca es una de las más antiguas del mundo. Durante la era vikinga dominamos los países bálticos y el norte de Europa. Sin embargo, en la era moderna, nuestra armada está incompleta. Construiremos más astilleros y aumentaremos nuestro poder naval, ¡haciendo que la armada de Suecia vuelva a ser la mejor!"
 Sweden.1.t: "El fin de la Iglesia Estatal de Suecia"
 Sweden.1.d: "La Iglesia de Suecia es la comunidad cristiana más grande de Suecia y la segunda comunidad luterana más grande del mundo, así como la tercera iglesia protestante más grande, más pequeña sólo después de la luterana Mekane Yesus de Etiopía y la Iglesia anglicana de Inglaterra del Reino Unido.\n\nRecientemente, la estrecha conexión entre el Estado y la Iglesia de Suecia ha sido constantemente puesta en tela de juicio, ya que la Iglesia de Suecia ha sido designada como la iglesia estatal del gobierno y la monarquía suecos. Muchas otras naciones europeas no otorgan tal posición a un organismo eclesiástico en particular. Esto, a ojos de los críticos, no sólo discrimina a los extranjeros de fe no cristiana, sino también a las pequeñas comunidades católicas y ortodoxas de Suecia.\n\nLa Iglesia de Suecia ya no tiene un poder real. ¿No deberíamos abolir nuestros vínculos con ellos? ¿O mantenerlos por el bien de la tradición?\n\nHistóricamente, Suecia rompió sus lazos con su iglesia estatal el 1 de enero de 2000."
 Sweden.1.o1: "¡Debemos deshacernos de ella!"
 Sweden.1.o2: "¡El luteranismo es importante! ¡Mantengámoslo!"
 Sweden.1.o3: "De todos modos, Thor y Odín son mucho mejores."
 Sweden.3.t: "El fin de la Iglesia Estatal de Suecia"
 Sweden.3.d: "La Iglesia de Suecia es la comunidad cristiana más grande de Suecia y la segunda comunidad luterana más grande del mundo, así como la tercera iglesia protestante más grande, más pequeña sólo después de la luterana Mekane Yesus de Etiopía y la Iglesia anglicana de Inglaterra del Reino Unido.\n\nRecientemente, la estrecha conexión entre el Estado y la Iglesia de Suecia ha sido constantemente puesta en tela de juicio, ya que la Iglesia de Suecia ha sido designada como la iglesia estatal del gobierno y la monarquía suecos. Muchas otras naciones europeas no otorgan tal posición a un organismo eclesiástico en particular. Esto, a ojos de los críticos, no sólo discrimina a los extranjeros de fe no cristiana, sino también a las pequeñas comunidades católicas y ortodoxas de Suecia.\n\nLa Iglesia de Suecia ya no tiene un poder real. ¿No deberíamos abolir nuestros vínculos con ellos? ¿O mantenerlos por el bien de la tradición?\n\nHistóricamente, Suecia rompió sus lazos con su iglesia estatal el 1 de enero de 2000."
 Sweden.3.o1: "¡Debemos deshacernos de ella!"
 Sweden.3.o2: "¡El luteranismo es importante! ¡Mantengámoslo!"
 Sweden.3.o3: "De todos modos, Thor y Odín son mucho mejores."
 Sweden.5.t: "Decisiones fiscales posteriores a la crisis"
 Sweden.5.d: "Las crisis presupuestarias y económicas de la década de 1990 han dejado a Suecia marcada. Nuestros gastos superan con creces nuestros ingresos y necesitamos hacer algo al respecto."
 Sweden.5.o1: "Los recortes en el bienestar son la única opción."
 Sweden.5.o2: "El déficit es inevitable."
 Sweden.6.t: "Política del Riksbank"
 Sweden.6.d: "El banco central de Suecia tiene como tarea principal administrar la moneda, la corona sueca, y así controlar la inflación y la deflación de los valores monetarios en la economía sueca. El Riksbank necesita nuevas órdenes sobre cómo proceder en los próximos años."
 Sweden.6.o1: "Mantener la estabilidad económica."
 Sweden.6.o2: "Inflar la corona sueca."
 Sweden.7.t: "Videojuegos Pro-Suecia"
 Sweden.7.d: "Los videojuegos son una forma fácil de influir en personas estúpidas que pasan más tiempo jugando videojuegos políticos en lugar de centrarse en problemas reales.\n\n¿Qué proyecto deberíamos impulsar hasta su finalización? (Ya hemos excluido un juego ambientado entre 1836 y 1936, porque eso no sucederá).\n\nRecuerda, necesitamos enseñar a los niños lo grandiosa que es Suecia. Además, debemos bloquear características de juego esenciales detrás de pagos adicionales."
 Sweden.7.o1: "'Ironhearts', un juego sobre la neutralidad."
 Sweden.7.o2: "'Europa Supremalis', un juego sobre la esclavización de africanos."
 Sweden.7.o3: "'Deus Vult', un juego sobre el incesto."
 Sweden.8.t: "Suecia exige igualdad para los suecos de Finlandia"
 Sweden.8.d: "La reciente agresión neoimperialista de Suecia contra Finlandia ha alcanzado su punto máximo con demandas de igualdad para la minoría de habla sueca en Finlandia.\n\nAquí está la cosa: ya son iguales. El movimiento más grande dentro del grupo afirma lo contrario, y hasta ahora solo ha reunido a 50 miembros. No hay nada de lo que los suecos puedan sentirse ofendidos, y nada que podamos cambiar."
 Sweden.8.o1: "Los suecos están locos."
 Sweden.9.t: "Plan de colonización báltica"
 Sweden.9.d: "Los Estados bálticos deben volver al estatus de dependencia sueca. Estonia, Letonia y Lituania fueron soluciones temporales aceptables, pero su tiempo ha llegado a su fin."
 Sweden.9.o1: "¡Por Suecia!"
 Sweden.10.t: "Suecia nos ofrece el estatus de provincia"
 Sweden.10.d: "Claro, siempre nos gustó la idea de formar parte del norte de Europa, pero Suecia ha sido muy... abierta con nosotros recientemente. Y ahora, el gobierno real sueco ha pedido a Estonia que se una a Suecia como provincia. Esto resultaría en el fin de Estonia como nación soberana. ¡Qué absurdo!"
 Sweden.10.o1: "Tenemos que ceder."
 Sweden.10.o2: "¡Nunca!"
 Sweden.11.t: "¡Estonia se resiste!"
 Sweden.11.d: "Estonia se ha atrevido a rechazar nuestra generosa propuesta de asumir la carga de guiar a los estonios hacia la civilización. Nos sorprendió que lograran que su carta de respuesta estuviera libre de errores gramaticales, pero también somos escépticos sobre lo que vendrá después. ¿Cómo deberíamos proceder?"
 Sweden.11.o1: "Malinterpretaron cuando pensaron que tenían opción."
 Sweden.11.o2: "Bueno, los alcanzaremos en otro momento."
 Sweden_news.1.t: "El sector bancario nórdico se consolida"
 Sweden_news.1.d: "En un importante desarrollo financiero, Nordbanken de Suecia ha anunciado una fusión estratégica con el Unibank A/S y Christiania Bank de Dinamarca og Kreditkasse. La entidad recientemente unificada funcionará bajo el nombre de Nordea, convirtiéndose en una de las mayores instituciones financieras del norte de Europa.\n\nEl movimiento marca un paso significativo hacia la integración económica en la región nórdica, racionalizando los servicios bancarios a través de las fronteras y reforzando la resiliencia financiera compartida. Los críticos advierten de la centralización, pero los proponentes ven oportunidad y eficiencia en escala."
 SWE_germanic_roots: "Revivamos nuestras raíces germánicas"
 SWE_germanic_roots_desc: "El legado de Suecia está profundamente entrelazado con el mundo cultural y político alemán del comercio Hanseático y los vínculos dinásticos en el norte de Alemania. Al reconocer este patrimonio, podemos fortalecer nuestra influencia en las antiguas esferas de cooperación y afirmar nuestro lugar en los asuntos centrales europeos."
 SWE_union_with_denmark: "Proponer una unión con Dinamarca"
 SWE_union_with_denmark_desc: "A pesar de siglos de rivalidad, los lazos entre Suecia y Dinamarca son muy profundos. Una nueva unión podría remodelar el mapa estratégico de Escandinavia, no mediante la conquista, sino a través de la voluntad común y la alineación dinástica."
 SWE_pommerania_and_bremen_invest: "Invertir en Pomerania y Bremen"
 SWE_pommerania_and_bremen_invest_desc: "Los históricos puestos comerciales y territorios reales del norte de Alemania pueden volver a formar parte de nuestra órbita económica y cultural. Las inversiones específicas en puertos, astilleros e infraestructuras allanarán el camino para un nuevo compromiso político."
 SWE_oranje_ports: "Acceso seguro a los puertos de Oranje"
 SWE_oranje_ports_desc: "Los puertos de los Países Bajos conectaban antiguamente la Corona sueca con el mundo atlántico. Restablecer la presencia naval y económica en los Países Bajos garantizaría el acceso marítimo y restauraría legados olvidados."
 SWE_guardians_of_the_baltics: "Guardianes del Báltico"
 SWE_guardians_of_the_baltics_desc: "Con la creciente inestabilidad alrededor del Mar Báltico, Suecia debe avanzar como el protector de la soberanía báltica, el comercio y la seguridad. Esta función exigirá la presencia naval, el alcance diplomático y, de ser necesario, una postura militar firme."
 SWE_karelien_claims: "Reactivar las reclamaciones sobre Carelia"
 SWE_karelien_claims_desc: "Las tierras de Carelia, disputadas durante mucho tiempo, tienen un profundo valor cultural y estratégico. Ya sea a través de la diplomacia, los programas de asentamiento o la presión, Suecia puede seguir un camino para restaurar su influencia en estos territorios fronterizos."
 SWE_poland_lituania_claims: "Reclamaciones en Polonia y Lituania"
 SWE_poland_lituania_claims_desc: "Históricamente, los monarcas suecos reclamaban derechos sobre partes de Polonia y Lituania. Al invocar los derechos dinásticos y apoyar a los actores regionales, podemos legitimar nuestra influencia en esta zona disputada entre Oriente y Occidente."
 SWE_rumors_of_uprisings: "Rumores de levantamientos"
 SWE_rumors_of_uprisings_desc: "El descontento crece en varias regiones donde los lazos culturales con Suecia siguen siendo fuertes. La inteligencia sugiere la posibilidad de movimientos autónomos que simpatizan con nuestra causa. ¿Debemos limitarnos a observar o prepararnos discretamente para actuar?"
 SWE_invest_and_settlement_deals: "Iniciar acuerdos de liquidación e inversión"
 SWE_invest_and_settlement_deals_desc: "Para afianzar nuestra influencia, pondremos en marcha iniciativas estratégicas de asentamiento y acuerdos de infraestructura en regiones históricamente vinculadas. A través de la presencia económica y los corredores demográficos, Suecia puede remodelar el equilibrio de poder regional sin necesidad de una anexión formal."
 SWE_fb00: "Försvarsbeslut 2000"
 SWE_fb00_desc: "Cada pocos años el gobierno discute, junto con el Secretario de Defensa, el nivel de amenaza en la zona y qué enfoque tomar. Su gobierno empujará a través del parlamento un aumento o disminución en el gasto militar y la doctrina dependiendo de qué camino escoja."
 SWE_fb04: "Försvarsbeslut 2004"
 SWE_fb04_desc: "Cada pocos años el gobierno discute, junto con el Secretario de Defensa, el nivel de amenaza en la zona y qué enfoque tomar. Su gobierno empujará a través del parlamento un aumento o disminución en el gasto militar y la doctrina dependiendo de qué camino escoja."
 SWE_fb09: "Försvarsbeslut 2009"
 SWE_fb09_desc: "Cada pocos años el gobierno discute, junto con el Secretario de Defensa, el nivel de amenaza en la zona y qué enfoque tomar. Su gobierno empujará a través del parlamento un aumento o disminución en el gasto militar y la doctrina dependiendo de qué camino escoja."
 SWE_fb15: "Försvarsbeslut 2015"
 SWE_fb15_desc: "Cada pocos años el gobierno discute, junto con el Secretario de Defensa, el nivel de amenaza en la zona y qué enfoque tomar. Su gobierno empujará a través del parlamento un aumento o disminución en el gasto militar y la doctrina dependiendo de qué camino escoja."
 SWE_fb20: "Försvarsbeslut 2020"
 SWE_fb20_desc: "Cada pocos años el gobierno discute, junto con el Secretario de Defensa, el nivel de amenaza en la zona y qué enfoque tomar. Su gobierno empujará a través del parlamento un aumento o disminución en el gasto militar y la doctrina dependiendo de qué camino escoja."
 SWE_foi: "Totalförsvarets forskningsinstitut"
 SWE_foi_desc: "La fusión del Instituto Nacional de Investigación para la Defensa (FOA) y el Instituto Nacional de Investigación Aeronáutica (FFA) nos permitirá llevar a cabo investigaciones de manera más eficaz."
 SWE_democratic_politics: "Futuro democrático"
 SWE_democratic_politics_desc: "Suecia tiene una larga historia de ideas democráticas y de esfuerzo por difundirlas por todo el mundo."
 SWE_soc_1: "Invertir en innovación sueca"
 SWE_soc_1_desc: "Si nos mantenemos por delante de todos los demás en materia de investigación e innovación, siempre tendremos la ventaja."
 SWE_soc_2: "Esfuerzos políticos"
 SWE_soc_2_desc: "Trabajen juntos para encontrar estabilidad y más poder político."
 SWE_soc_3: "Ampliar la Unión"
 SWE_soc_3_desc: "Tener buenas condiciones laborales con tu empleador debería ser un derecho humano."
 SWE_soc_4: "Permitir a los refugiados buscar refugio"
 SWE_soc_4_desc: "Con las guerras actuales en Oriente Medio, es sin duda nuestra responsabilidad cuidar de todos los hombres y mujeres que desean huir de la crisis y refugiarse en un lugar seguro hasta que termine la guerra y puedan regresar."
 SWE_soc_5: "Ejercicios del norte"
 SWE_soc_5_desc: "Necesitamos organizar ejercicios avanzados para demostrar a nuestros conciudadanos que nuestro ejército es realmente capaz de resistir cualquier invasión procedente del este."
 SWE_archer: "Desarrollar el sistema de artillería Archer."
 SWE_archer_desc: "Otros países deciden importar sus armas, pero es evidente que no tienen el mismo oso al lado, por lo que debemos ir más allá y fabricar una de las mejores artillerías autopropulsadas de la historia moderna."
 SWE_mod_1: "Fondos para Saab-Kockums"
 SWE_mod_1_desc: "Saab-Kockums, el actual constructor de nuestra fuerza silenciosa, necesita más inversiones para seguir suministrando submarinos más nuevos y mejores que protejan nuestras costas en las aguas ocultas."
 SWE_mod_2: "Resolver la crisis energética"
 SWE_mod_2_desc: "El partido ecologista ha arruinado nuestros precios de la electricidad durante el invierno al cerrar por la fuerza nuestros reactores, a pesar de que han superado las pruebas de seguridad para varios años. Cuando hace un frío que pela y no hay viento, sus nuevas y sofisticadas turbinas eólicas no sirven de nada."
 SWE_mod_3: "El portaaviones sueco"
 SWE_mod_3_desc: "Los estadounidenses llaman a nuestra isla cultural el portaaviones insumergible. Me parece una idea estupenda, hagámoslo."
 SWE_mod_4: "Invierta en calidad fabricada en Suecia."
 SWE_mod_4_desc: "Los productos fabricados en Suecia siempre han sido de gran calidad. Mejorarla aún más y hacernos un nombre atraerá a inversores y compradores extranjeros."
 SWE_new_to_nato: "Nuevo en la OTAN"
 SWE_new_to_nato_desc: "Hemos sido ratificados con éxito por todos los miembros de la OTAN. Esto garantiza nuestra protección y fortalece la alianza. Sin embargo, también debemos intentar explorar las oportunidades industriales que se han abierto."
 SWE_nato_standards: "Conforme a los estándares de la OTAN"
 SWE_nato_standards_desc: "Nuestras fuerzas armadas han sido castigadas por nuestras opiniones neutrales. ¡Es hora de que volvamos a poner al ejército a la altura de los estándares de la OTAN para poder protegernos a nosotros mismos y a nuestros aliados!"
 SWE_nato_contracts: "Contratos de la OTAN"
 SWE_nato_contracts_desc: "Nuestras nuevas oportunidades incluyen contratos militares que antes resultaban difíciles de conseguir debido a que nuestros competidores utilizaban sus influencias políticas en su beneficio. Esta vez nos resultará más fácil encontrar operaciones de importación y exportación."
 SWE_american_contracts: "Contratos estadounidenses"
 SWE_american_contracts_desc: "Debemos investigar qué tipo de equipamiento militar podemos obtener de los acuerdos con Estados Unidos."
 SWE_air_force_expansion: "Expansión de la Fuerza Aérea"
 SWE_air_force_expansion_desc: "Nuestros envejecidos C-130H de los años sesenta están en buen estado, pero tienen muchos años a cuestas, y una versión más reciente beneficiaría nuestras capacidades estratégicas e internacionales."
 SWE_drones_for_sweden: "Drones para Suecia"
 SWE_drones_for_sweden_desc: "Los conflictos recientes han demostrado la importancia de la guerra no tripulada. Deberíamos ponernos en contacto con los estadounidenses e intentar comprar algunas de sus variantes más antiguas disponibles en el mercado."
 SWE_attack_helicopters: "Helicópteros suecos"
 SWE_attack_helicopters_desc: "Los Estados Unidos están buscando vender sus helicópteros de ataque más antiguos. Esto ha abierto una gran oportunidad para conseguirlos por un precio más barato. Tal vez podamos conseguirlos más baratos si exportamos un poco más de Carl Gustav rifle sin retroceso."
 SWE_german_contracts: "Contratos alemanes"
 SWE_german_contracts_desc: "Deberíamos investigar qué tipo de equipamiento militar podemos obtener de los acuerdos con nuestro vecino del sur, los alemanes."
 SWE_panzer_expansion: "Expansión Panzer"
 SWE_panzer_expansion_desc: "Más tanques para el ejército mejorarían nuestras capacidades de guerra terrestre."
 SWE_domestic_tank_factories: "Fábricas nacionales de tanques"
 SWE_domestic_tank_factories_desc: "Ahora que formamos parte de la OTAN, deberíamos revisar nuestra antigua producción de tanques y tal vez desarrollar un nuevo stridsvagn que podamos exportar nosotros mismos. Alguien me ha dicho que FOI ha alquilado uno de los nuevos Leopards del ejército sueco."
 SWE_artillery_collaborations: "Colaboraciones de artillería"
 SWE_artillery_collaborations_desc: "Nuestra anterior colaboración con Noruega fue un gran éxito. Los alemanes también están buscando adquirir un nuevo vagón de artillería de apoyo. Quizás deberíamos aprovechar esta oportunidad para conseguir un acuerdo que nos beneficie a ambos."
 SWE_canadian_gripens: "Gripens Canadienses"
 SWE_canadian_gripens_desc: "Ahora que formamos parte de la OTAN, podemos empezar a hablar con Canadá sobre una colaboración en el JAS 39E. Un gran caza para ambas naciones."
 SWE_forsvarsmakten: "Försvarsmakten"
 SWE_forsvarsmakten_desc: "Nuestra defensa nacional es la columna vertebral de nuestra seguridad. Fortalecer la Försvarsmakten es esencial para salvaguardar nuestra soberanía y garantizar la protección de nuestras fronteras."
 SWE_batch_3: "JAS Batch III"
 SWE_batch_3_desc: "La inversión en el desarrollo y la producción del JAS Batch III modernizará nuestra fuerza aérea, proporcionándonos aviones de combate de última generación capaces de hacer frente a los retos de la guerra contemporánea."
 SWE_batch_4: "JAS lote IV"
 SWE_batch_4_desc: "Continuando con la evolución de nuestra fuerza aérea, el proyecto JAS Batch IV tiene como objetivo aportar nuevos avances a nuestras capacidades aéreas. Esta inversión garantiza que nos mantengamos a la vanguardia de la tecnología aeronáutica."
 SWE_next_generation_gripen: "Gripen de próxima generación"
 SWE_next_generation_gripen_desc: "Al embarcarnos en el desarrollo del Gripen de próxima generación, nuestro objetivo es crear un avión de combate de última generación que no solo satisfaga nuestras necesidades de defensa, sino que también pueda convertirse en un valioso producto de exportación."
 SWE_ak5: "Automatkarbin 5"
 SWE_ak5_desc: "La mejora de nuestro rifle estándar, el Automatkarbin 5, garantiza que nuestra infantería esté equipada con la última tecnología en armas pequeñas, lo que aumenta la eficacia de nuestras fuerzas terrestres."
 SWE_cv90_fleet: "Stridsfordon 90"
 SWE_cv90_fleet_desc: "La ampliación y modernización de nuestra flota de vehículos blindados Stridsfordon 90 refuerza las capacidades de nuestras fuerzas terrestres, proporcionándoles equipos fiables y avanzados para diversos escenarios de combate."
 SWE_bae_systems_ab: "Sistemas BAE AB"
 SWE_bae_systems_ab_desc: "La formación de alianzas con BAE Systems AB abre oportunidades para proyectos de defensa colaborativos, fomentando el intercambio tecnológico y garantizando la mejora continua de nuestras capacidades militares."
 SWE_the_infantry: "Infanteriet"
 SWE_the_infantry_desc: "Invertir en la formación, el equipamiento y la moral de nuestra infantería es fundamental. Una infantería fuerte y bien preparada constituye la columna vertebral de nuestro ejército, capaz de hacer frente a retos en diversos frentes."
 SWE_luftvarnet: "Luftvärnet"
 SWE_luftvarnet_desc: "Mejorar nuestras capacidades de defensa aérea mediante inversiones en Luftvärnet garantiza que nuestros cielos sigan siendo seguros, protegiendo a nuestra nación de amenazas aéreas y manteniendo el control de nuestro espacio aéreo."
 SWE_visby_class: "Clase Visby"
 SWE_visby_class_desc: "Continuar con el desarrollo y la producción de los buques de la clase Visby refuerza nuestras fuerzas navales, dotándolas de capacidades avanzadas en la guerra naval y garantizando nuestros intereses marítimos."
 SWE_visby_class_2: "Visby Clase II"
 SWE_visby_class_2_desc: "Basándose en el éxito de la clase Visby, el proyecto Visby Clase II tiene como objetivo mejorar aún más nuestras capacidades navales, garantizando que nuestra flota se mantenga a la vanguardia de la tecnología naval."
 SWE_hms_uppland: "HMS Uppland"
 SWE_hms_uppland_desc: "La inversión en el programa del submarino HMS Uppland refuerza nuestras capacidades submarinas, añadiendo un activo sigiloso y potente a nuestras fuerzas navales."
 SWE_blekinge_class: "Clase Blekinge"
 SWE_blekinge_class_desc: "El desarrollo de los buques de la clase Blekinge amplía nuestra flota naval, proporcionándonos embarcaciones versátiles capaces de desempeñar diversas funciones en operaciones marítimas."
 SWE_lulea_class: "Clase Luleå"
 SWE_lulea_class_desc: "Con el fin de mejorar nuestras capacidades navales, el proyecto de la clase Luleå tiene como objetivo incorporar buques modernos y eficientes a nuestra flota, garantizando que nuestras fuerzas marítimas estén bien preparadas para los retos futuros."
 SWE_flygvapnet: "Flygvapnet"
 SWE_flygvapnet_desc: "El fortalecimiento de la Flygvapnet es esencial para mantener la superioridad aérea. Esta área de interés abarca inversiones en tecnología, formación e infraestructura para mantener nuestra fuerza aérea en su máximo nivel."
 SWE_armen: "Armén"
 SWE_armen_desc: "Mejorar las capacidades del Ejército es fundamental para las operaciones terrestres. Este enfoque implica inversiones en equipamiento, formación y planificación estratégica para garantizar que nuestro ejército esté preparado para una variedad de escenarios."
 SWE_marinen: "Marinen"
 SWE_marinen_desc: "Reforzar la Marinen es fundamental para proteger nuestros intereses marítimos. Esta área prioritaria incluye inversiones en tecnología naval, ampliación de la flota y alianzas estratégicas para mantener una marina fuerte y capaz."
 SWE_rymdvapnet: "Rymdvapnet"
 SWE_rymdvapnet_desc: "Explorando el ámbito de la defensa espacial, el enfoque de Rymdvapnet se centra en inversiones en tecnología satelital, vigilancia espacial y capacidades estratégicas para proteger nuestros intereses más allá de la atmósfera terrestre."
 SWE_adopt_norwegian_model: "Adoptar el modelo noruego"
 SWE_adopt_norwegian_model_desc: "Los noruegos han recorrido un largo camino exportando materias primas y petróleo. Puede que no tengamos mucho petróleo, pero sí nos sentamos en el mayor depósito de metales terrestres raros de Europa."
 SWE_Digital_agenda: "La Agenda Digital"
 SWE_Digital_agenda_desc: "Suecia debe abrazar la revolución digital. A través de una agenda integral, lideraremos el camino hacia un futuro conectado y competitivo."
 SWE_bredbandslyftet: "El impulso de la banda ancha"
 SWE_bredbandslyftet_desc: "El acceso a la banda ancha de alta velocidad es fundamental para la innovación, la educación y el desarrollo rural. Invertiremos en la conectividad a nivel nacional."
 SWE_IT_skolan: "Tecnología de la Información en las Escuelas"
 SWE_IT_skolan_desc: "Los estudiantes suecos merecen herramientas y entornos digitales que los preparen para el mundo del mañana. Modernizaremos la educación mediante las tecnologías de la información."
 SWE_digitalize_administration: "Digitalizar la administración"
 SWE_digitalize_administration_desc: "Los servicios públicos deben ser eficientes y fáciles de usar. Al digitalizar la administración gubernamental, reducimos la burocracia y aumentamos la transparencia."
 SWE_nordic_cooperation: "Cooperación digital nórdica"
 SWE_nordic_cooperation_desc: "Reforzaremos la cooperación con nuestros vecinos nórdicos en materia de infraestructura digital, innovación y ciberseguridad."
 SWE_swedish_alone: "Soberanía digital"
 SWE_swedish_alone_desc: "Suecia desarrollará sus propios sistemas digitales seguros, minimizando la dependencia de plataformas extranjeras y garantizando la integridad de los datos."
 SWE_Vinnova_digital_innovation: "Subvenciones para la innovación digital de Vinnova"
 SWE_Vinnova_digital_innovation_desc: "La agencia de innovación Vinnova liderará los esfuerzos para financiar la investigación digital de vanguardia y el espíritu emprendedor en todo el país."
 SWE_E_legitimation_for_citizen: "Identificación electrónica para todos los ciudadanos"
 SWE_E_legitimation_for_citizen_desc: "Un sistema de identificación electrónica seguro y universal garantizará que todos los suecos tengan acceso a servicios digitales modernos."
 SWE_IT_start_up: "Apoyo a las empresas emergentes de TI"
 SWE_IT_start_up_desc: "Incrementaremos el ecosistema de startups de Suecia mediante la financiación, la mentoría y el acceso a los mercados digitales globales."
 SWE_second_digital_agenda: "Agenda Digital 2.0"
 SWE_second_digital_agenda_desc: "Una vez sentadas las bases, es hora de ampliar nuestras ambiciones digitales: estrategia en la nube, marcos de IA y liderazgo global."
 SWE_coding_in_school: "La programación en el plan de estudios"
 SWE_coding_in_school_desc: "La programación se convertirá en una asignatura troncal en las escuelas suecas, lo que garantizará que la próxima generación pueda dar forma al mundo digital."
 SWE_digital_education_for_all: "Educación digital para todos"
 SWE_digital_education_for_all_desc: "La alfabetización digital permanente es clave para la inclusión. Garantizaremos que todos los ciudadanos tengan acceso a herramientas, formación y oportunidades."
 SWE_Industrial_digitalisation: "Digitalización industrial"
 SWE_Industrial_digitalisation_desc: "Suecia debe mantenerse a la vanguardia de la revolución digital. Al invertir en automatización, fabricación inteligente y métodos de producción basados en la inteligencia artificial, impulsaremos nuestra productividad industrial y nuestra competitividad en el mercado global."
 SWE_revitalize_the_nation: "Revitalizar la nación"
 SWE_revitalize_the_nation_desc: "Debe reforzarse la columna vertebral económica de Suecia. Al reestructurar nuestros sistemas y prioridades financieros, ponemos las bases para un futuro más fuerte."
 SWE_Riksbanken_souveranity: "Soberanía del Riksbank"
 SWE_Riksbanken_souveranity_desc: "El banco central sueco debe actuar de forma independiente y decisiva. Reforzaremos su soberanía y lo protegeremos de influencias extranjeras o políticas."
 SWE_AP_fonderna_restructure: "Reestructurar los fondos AP"
 SWE_AP_fonderna_restructure_desc: "Nuestros fondos públicos de pensiones deben adaptarse para garantizar la sostenibilidad a largo plazo y la resiliencia nacional."
 SWE_kosolidate_budgets: "Consolidar el presupuesto"
 SWE_kosolidate_budgets_desc: "La responsabilidad fiscal es clave para la seguridad financiera. Un presupuesto equilibrado y transparente restaurará la confianza pública."
 SWE_inflation_goal: "Reafirmar el objetivo de inflación"
 SWE_inflation_goal_desc: "La estabilidad de los precios es fundamental para la previsibilidad económica. Reforzaremos el objetivo de inflación como piedra angular de la política monetaria."
 SWE_global_investments: "Atraer inversión global"
 SWE_global_investments_desc: "Suecia debe ser vista como un destino estable y atractivo para el capital internacional. Abriremos nuevos canales para la inversión global responsable."
 SWE_regularly_bond_trade: "Operaciones regulares con bonos del Estado"
 SWE_regularly_bond_trade_desc: "Un sistema estructurado de emisión de bonos del Estado permitirá una gestión más inteligente de la deuda y un mejor control del mercado."
 SWE_no_bonds_just_gold: "Sin bonos, solo oro"
 SWE_no_bonds_just_gold_desc: "Abandonando los instrumentos de deuda, volvemos a un modelo de reserva fiscal basado en el oro para garantizar el valor nacional duradero."
 SWE_transparency_law: "Ley Nacional de Transparencia"
 SWE_transparency_law_desc: "Aprobaremos leyes que garanticen que los procesos financieros, los datos y las decisiones estén a disposición del público y la prensa."
 SWE_stabilize_the_exchange: "Estabilizar el tipo de cambio de la corona sueca"
 SWE_stabilize_the_exchange_desc: "La volatilidad amenaza tanto el comercio como el ahorro. Introduciremos mecanismos para estabilizar el valor de nuestra moneda nacional."
 SWE_Pension_only: "Modelo de reserva solo para pensiones"
 SWE_Pension_only_desc: "Centrar nuestra riqueza pública en las pensiones asegura el futuro de nuestros jubilados, separándolo de la especulación y de los shocks globales."
 SWE_Norwegian_fond_model: "Adoptar el modelo del Fondo Noruego"
 SWE_Norwegian_fond_model_desc: "Inspirados por nuestros vecinos, canalizaremos la riqueza derivada de los recursos hacia un fondo de inversión global a largo plazo para beneficiar a todos los suecos."
 SWE_Back_up_Privat_banks: "Respaldar a los bancos privados"
 SWE_Back_up_Privat_banks_desc: "Crearemos reservas de emergencia y protocolos de intervención para garantizar la supervivencia de la banca privada en tiempos de crisis."
 SWE_Digitalize_central_bank: "Digitalizar el Banco Central"
 SWE_Digitalize_central_bank_desc: "Las herramientas y plataformas modernas harán que nuestro banco central sea más rápido, más preciso y más transparente que nunca."
 SWE_allow_crypto: "Permitir Cryptocurrencies"
 SWE_allow_crypto_desc: "Legalizaremos y regularemos el uso de criptomonedas, integrando los activos digitales en el marco financiero nacional."
 SWE_centralize_finacial_supervision: "Centralizar la supervisión financiera"
 SWE_centralize_finacial_supervision_desc: "Toda supervisión financiera se someterá a una autoridad única y eficiente para eliminar las deficiencias y la corrupción."
 SWE_Digital_statistics_and_intrest_rate: "Digitalizar estadísticas económicas & Control de tarifas"
 SWE_Digital_statistics_and_intrest_rate_desc: "Utilizando el seguimiento digital y la analítica predictiva, revolucionaremos cómo monitorizamos y ajustamos los tipos de interés y las métricas económicas."
 SWE_automotive_Sector: "Revitalizar el sector automotriz"
 SWE_automotive_Sector_desc: "La industria automotriz de Suecia, pilar de nuestra economía, debe ser modernizada y apoyada con nuevas inversiones, tecnologías y cooperación internacional."
 SWE_swedisch_industry: "Fortalecimiento de la industria sueca"
 SWE_swedisch_industry_desc: "De la fabricación a la industria pesada, la productividad sueca es un activo nacional. Protegeremos y mejoraremos nuestra base industrial para una nueva generación."
 SWE_Vattenfall_restructure: "Restructure Vattenfall"
 SWE_Vattenfall_restructure_desc: "Vattenfall debe convertirse en más eficiente, innovador y listo para el futuro. La reestructuración estratégica la convertirá en un líder de energía verde y segura."
 SWE_Pharma_industry_foundings: "Fondo de la Industria Farmacéutica"
 SWE_Pharma_industry_foundings_desc: "Invertiremos en el sector farmacéutico para impulsar la salud pública, el potencial de exportación y nuestra reputación mundial por las ciencias de la vida."
 SWE_astrazeneca_focus: "Expansión de AstraZeneca"
 SWE_astrazeneca_focus_desc: "AstraZeneca es una de nuestras principales empresas farmacéuticas. Apoyando su crecimiento y R&D aportará beneficios a largo plazo a Suecia y más allá."
 SWE_Pharmacia_focus: "Revivir Farmacia"
 SWE_Pharmacia_focus_desc: "Pharmacia fue una vez un líder mundial. Con el apoyo específico, podemos traerlo de vuelta a la prominencia a través de la ciencia, la innovación y la resiliencia."
 SWE_attract_partners_japan: "Atraer a los socios japoneses"
 SWE_attract_partners_japan_desc: "Las alianzas estratégicas con las empresas japonesas traerán sinergia tecnológica y fuertes oportunidades de crecimiento bilateral."
 SWE_attract_partners_USA: "Atraer a los socios estadounidenses"
 SWE_attract_partners_USA_desc: "Trabajar con inversores y empresas estadounidenses abrirá potentes canales de investigación, mercado y producción para industrias suecas."
 SWE_attract_partners_Germany: "Atraer a los socios alemanes"
 SWE_attract_partners_Germany_desc: "La precisión alemana y la innovación sueca pueden crear una poderosa alianza industrial, fomentando el desarrollo mutuo y la expansión."
 SWE_Vattenfall_PL: "Vattenfall in Poland"
 SWE_Vattenfall_PL_desc: "Ampliaremos las operaciones energéticas de Vattenfall en Polonia, fortaleciendo nuestra influencia regional y seguridad energética."
 SWE_Vattenfall_GER: "Vattenfall in Germany"
 SWE_Vattenfall_GER_desc: "Las inversiones en la infraestructura energética alemana mejorarán los vínculos energéticos transfronterizos de Vattenfall y los rendimientos económicos."
 SWE_Vattenfall_NL: "Vattenfall en Holanda"
 SWE_Vattenfall_NL_desc: "Nuestra presencia en los Países Bajos se centrará en las inversiones de energía renovable y la creación de una cooperación europea sostenible."
 SWE_british_SWE_partnership: "Asociación Británica-Suecia"
 SWE_british_SWE_partnership_desc: "Un acuerdo bilateral con el Reino Unido se centrará en la cooperación científica, industrial y energética para fortalecer nuestra competitividad mutua."
 SWE_biotech_startups: "Soporte Biotech Startups"
 SWE_biotech_startups_desc: "Estableceremos un fondo nacional y centros de innovación para apoyar a las nuevas empresas biotecnológicas en la vanguardia de la medicina mundial."
 SWE_found_biovitrum_AB: "Encontrado Biovitrum AB"
 SWE_found_biovitrum_AB_desc: "Biovitrum AB se convertirá en piedra angular de la biotecnología sueca y el tratamiento de enfermedades raras."
 SWE_in_market_production: "Fomentar la producción de mercado"
 SWE_in_market_production_desc: "Apoyaremos a las empresas que transfieran de la investigación a una producción escalable y lista para la exportación en los sectores de farmacéutica y tecnología."
 SWE_made_in_sweden: "Celebrada en Suecia"
 SWE_made_in_sweden_desc: "Una iniciativa nacional de branding promoverá los bienes hechos por Suecia como productos de alta calidad, sostenibles y futuros en todo el mundo."
 SWE_Vattenfall_windparks: "Ampliar Vattenfall Wind Parks"
 SWE_Vattenfall_windparks_desc: "La energía eólica será una parte crítica de nuestro futuro renovable. Apoyaremos a Vattenfall en aumentar la capacidad de energía eólica."
 SWE_Vattenfall_nuclear: "Modernizar Vattenfall Nuclear"
 SWE_Vattenfall_nuclear_desc: "La energía nuclear seguirá siendo parte de nuestra combinación estratégica. Modernizaremos nuestros reactores y aseguraremos la sostenibilidad a largo plazo."
 SWE_sodertalje_science_center: "Centro científico Södertälje"
 SWE_sodertalje_science_center_desc: "Crearemos un centro de ciencia e innovación líder en Södertälje, reuniendo academias, industria y start-ups."
 SWE_cooperation_with_universities: "Universidad-Cooperación Industria"
 SWE_cooperation_with_universities_desc: "Nuestras universidades trabajarán en estrecha colaboración con la industria mediante donaciones, retos de innovación y proyectos R&D."
 SWE_fusion_swedish_orphan_biovitrum: "Combinado con Biovitrum orfanático sueco"
 SWE_fusion_swedish_orphan_biovitrum_desc: "La fusión de los principales jugadores en medicamentos huérfanos posicionará a Suecia como un centro global para soluciones de enfermedades raras."
 SWE_volvo_investments: "Invertir en Volvo"
 SWE_volvo_investments_desc: "Apoyaremos la transición de Volvo en los mercados de vehículos eléctricos, inteligentes y autónomos para preservar su estatus global."
 SWE_northvolt_invests: "Apoyo a las Inversiones de Northvolt"
 SWE_northvolt_invests_desc: "Las tecnologías de baterías de Northvolt son fundamentales para nuestra transición limpia. Apoyaremos su ampliación en toda Suecia y Europa."
 SWE_Saab_investments: "Apoyar la doble innovación de Saab"
 SWE_Saab_investments_desc: "De defensa a aviación, Saab es un activo crítico. Invertiremos en su frontera tecnológica, tanto civil como militar."
 SWE_Vattenfall_energy_link_ger: "Vattenfall Energy Link a Alemania"
 SWE_Vattenfall_energy_link_ger_desc: "Un sólido vínculo energético con Alemania aumentará las exportaciones y estabilizará la red europea del Norte."
 SWE_Vattenfall_biomass: "Iniciativa Vattenfall Biomass"
 SWE_Vattenfall_biomass_desc: "Ampliaremos la producción e investigación de biomasa de Vattenfall para reducir la dependencia fósil mientras apoyamos las industrias rurales."
 SWE_Vattenfall_energy_link_baltics: "Vattenfall Link al Baltics"
 SWE_Vattenfall_energy_link_baltics_desc: "Profundizaremos la cooperación energética con los Baltics mediante exportaciones limpias de electricidad y el desarrollo compartido de redes."
 SWE_expand_pharma_capacity: "Ampliación de la capacidad farmacéutica"
 SWE_expand_pharma_capacity_desc: "Incrementaremos la producción nacional de medicamentos para salvar vidas, centrándonos tanto en la seguridad de la salud pública como en el crecimiento económico."
 SWE_adapt_international_approval_standards: "Armonizar las normas farmacéuticas internacionales"
 SWE_adapt_international_approval_standards_desc: "La adopción de normas reglamentarias mundiales acelerará las exportaciones suecas de flema y simplificará los oleoductos de desarrollo."
 SWE_excavation: "Invertir en la excavación minera"
 SWE_excavation_desc: "La riqueza mineral de Suecia sigue sin explotarse en gran medida. Al invertir en tecnologías de excavación y estudiar nuevas áreas de recursos, podemos desbloquear oportunidades económicas y alimentar nuestras ambiciones industriales."
 SWE_heavy_industry_expansion: "Ampliar la industria pesada"
 SWE_heavy_industry_expansion_desc: "Una nación moderna requiere una sólida base de industria pesada. Mediante el desarrollo de infraestructuras y subsidios, aumentaremos la producción de acero, maquinaria y materiales procesados."
 SWE_Mechanic_sector: "Apoyar el Sector Mecánico"
 SWE_Mechanic_sector_desc: "La industria mecánica de Suecia es de clase mundial. Con soporte estratégico, podemos impulsar la innovación, la fabricación de precisión y la producción de componentes de alto valor."
 SWE_Svenska_Kullagerfabriken: "SKF – Rodamientos para el mundo"
 SWE_Svenska_Kullagerfabriken_desc: "Svenska Kullagerfabriken (SKF) proporciona tecnología vital para rodamientos de bolas al mercado mundial. Al empoderar a esta empresa, garantizamos componentes de alta calidad tanto para la producción civil como militar."
 SWE_Kiruna_mine: "Ampliar la mina Kiruna"
 SWE_Kiruna_mine_desc: "La mina de mineral de hierro Kiruna es una de las más grandes del mundo. Aumentar la capacidad y mejorar los enlaces de transporte garantizarán un suministro constante de materiales estratégicos."
 SWE_sandvik_invest: "Invertir en Sandvik Engineering"
 SWE_sandvik_invest_desc: "Sandvik es un líder en herramientas y materiales avanzados. Nuestra inversión fortalecerá su papel en la innovación de metalurgia, minería y materiales."
 SWE_Aitik: "Abra la mina Aitik Copper"
 SWE_Aitik_desc: "La mina Aitik en Norrbotten tiene vastas reservas de cobre. El desarrollo estratégico de este sitio apoyará la electrónica y el crecimiento industrial."
 SWE_SSAB: "Producción de acero con SSAB"
 SWE_SSAB_desc: "Svenskt Stål AB (SSAB) está a la vanguardia de la producción de acero. Mediante la modernización y expansión de sus plantas, Suecia puede suministrar acero de alta calidad nacional y exterior."
 SWE_hexagon_manifacturing_inteligence: "Hexagon fabricando inteligencia"
 SWE_hexagon_manifacturing_inteligence_desc: "Empresa sueca Hexagon lidera en la medición de precisión y software de fabricación. Apoyar su innovación aumenta nuestra competitividad industrial."
 SWE_improve_mining_equipment: "Modernizar el equipo minero"
 SWE_improve_mining_equipment_desc: "Mediante el desarrollo de equipos mineros más avanzados, automatizados y duraderos, aumentamos la eficiencia y reducimos el riesgo de los trabajadores en todo el sector."
 SWE_Malmberget: "Invertir en la mina de Malmberget"
 SWE_Malmberget_desc: "El sitio Malmberget contiene ricos depósitos de mineral de hierro. Mejorar las capacidades de extracción aquí ayudará a satisfacer la creciente demanda de materias primas."
 SWE_Garpenberg: "Modernizar las operaciones de Garpenberg"
 SWE_Garpenberg_desc: "Los recursos polimetálicos de Garpenberg, incluyendo zinc y plata, son críticos para la industria moderna. Mejorar la infraestructura de esta mina maximizará la producción."
 SWE_focus_on_sveden: "Enfoque sobre la industria nacional"
 SWE_focus_on_sveden_desc: "Antes de mirar en el extranjero, primero debemos fortalecer nuestras propias fundaciones industriales, asegurando que Suecia se vuelva autosuficiente y resiliente."
 SWE_support_expansion: "Apoyo a la expansión industrial"
 SWE_support_expansion_desc: "Nuestras industrias están preparadas para el crecimiento. Con el apoyo estatal, podemos ampliar las operaciones, emplear más ciudadanos y exportar excelencia sueca."
 SWE_mining_investments: "Aumento de las inversiones mineras"
 SWE_mining_investments_desc: "La extracción mineral es un pilar de la fuerza industrial. La inversión estratégica en este sector asegurará que tengamos los recursos para cualquier reto."
 SWE_attract_investors: "Atraer inversión extranjera"
 SWE_attract_investors_desc: "El capital mundial busca economías estables e innovadoras. Al abrir nuestros mercados y ofrecer incentivos, podemos atraer inversiones vitales."
 SWE_mechanic_in_perfection: "Perfection in Mechanics"
 SWE_mechanic_in_perfection_desc: "Precisión e innovación definen mecánica sueca. Seguiremos perfeccionando y exportando nuestra experiencia de ingeniería mecánica en todo el mundo."
 SWE_swedish_projects: "Proyectos de desarrollo sueco"
 SWE_swedish_projects_desc: "Suecia es más que industria e innovación. Al invertir en infraestructura, crecimiento regional e identidad nacional, garantizamos una sociedad equilibrada y próspera."
 SWE_found_visit_sverige: "Encontrado Visita Suecia"
 SWE_found_visit_sverige_desc: "Para atraer turistas y destacar las ofertas únicas de Suecia, estableceremos 'Visite Suecia' – una agencia nacional de turismo que muestra todo desde la naturaleza hasta la vida urbana."
 SWE_Stockholm_and_upsala: "Promover Estocolmo y Uppsala"
 SWE_Stockholm_and_upsala_desc: "Nuestra capital y su histórica ciudad gemela tienen un inmenso valor cultural y económico. La promoción estratégica de Estocolmo y Uppsala aumenta tanto el turismo como el orgullo nacional."
 SWE_promote_lappland_and_raindeer: "Lappland y Reindeer Trail"
 SWE_promote_lappland_and_raindeer_desc: "El norte de Suecia ofrece paisajes impresionantes y experiencias culturales sami. Promoveremos Lappland como un auténtico destino ártico, con el pastoreo de renos y aventuras de invierno."
 SWE_Goteborg_and_the_south: "Göteborg y la costa meridional"
 SWE_Goteborg_and_the_south_desc: "Las costas oeste y sur de Suecia ofrecen experiencias culinarias, ciudades encantadoras y patrimonio marítimo. Göteborg servirá como puerta de entrada a esta región soleada y escénica."
 SWE_cruise_the_coast: "Crucero por la costa sueca"
 SWE_cruise_the_coast_desc: "Con miles de islas y un rico pasado marítimo, Suecia es perfecta para el crucero costero. Ampliaremos los puertos, promoveremos el viaje en ferry y atraeremos líneas internacionales."
 SWE_on_the_rail: "Ver Suecia en Tren"
 SWE_on_the_rail_desc: "Eco-friendly y pintoresco, el viaje en tren es la forma ideal para explorar Suecia. Las inversiones en conexiones ferroviarias orientadas al turismo apoyarán las economías regionales y el turismo sostenible."
 SWE_infrastructure_projects: "Iniciativas nacionales de infraestructura"
 SWE_infrastructure_projects_desc: "Para mantener el crecimiento económico y la cohesión, debemos lanzar una oleada de grandes proyectos de infraestructura. De ferrocarril a digital, estas inversiones unirán a la nación."
 SWE_bothnia_line: "Completar la línea Bothnia"
 SWE_bothnia_line_desc: "The Bothnia Line conecta el norte de Suecia más eficientemente con el resto del país. Completar este ferrocarril aumenta el desarrollo regional y la movilidad."
 SWE_exoand_gotland_infrastructure: "Ampliar la infraestructura de Gotland"
 SWE_exoand_gotland_infrastructure_desc: "Estratégicamente ubicado en el Mar Báltico, Gotland necesita infraestructura modernizada para apoyar el comercio, el turismo y la defensa."
 SWE_expand_stockholm_harbor: "Expande el puerto de Estocolmo"
 SWE_expand_stockholm_harbor_desc: "Para manejar el aumento del comercio y el turismo, debemos invertir en expandir el puerto de Estocolmo en un moderno centro marítimo."
 SWE_expand_the_malmo_docks: "Ampliar los muelles Malmö"
 SWE_expand_the_malmo_docks_desc: "Malmö es la puerta del sur de Suecia. Ampliar sus muelles garantiza un manejo de carga más rápido y vínculos más fuertes con Europa continental."
 SWE_SBUF: "Fondo Sueco de Construcción (SBUF)"
 SWE_SBUF_desc: "Crearemos un fondo dedicado para apoyar las obras públicas y el desarrollo de la infraestructura en Suecia."
 SWE_norra_lanken: "Construct Norra Länken"
 SWE_norra_lanken_desc: "Norra Länken facilitará la congestión en el norte de Estocolmo y mejorará el flujo de tráfico entre las zonas industriales y la capital."
 SWE_sodra_lanken: "Build Södra Länken"
 SWE_sodra_lanken_desc: "El proyecto de carretera Södra Länken complementa nuestra red de carreteras, facilitando la logística eficiente y el acceso al sur."
 SWE_ericsson_digital_infrastructure: "Infraestructura digital Ericsson-Led"
 SWE_ericsson_digital_infrastructure_desc: "Junto con Ericsson, lideraremos Europa en infraestructura digital desplegando 5G, redes de nube y sistemas de comunicación."
 SWE_found_industry_park_malmo: "Parque de la industria en Malmö"
 SWE_found_industry_park_malmo_desc: "Para revitalizar la economía de Malmö, estableceremos un moderno parque industrial que atrae a las empresas tecnológicas, biotecnológicas y logísticas."
 SWE_found_industry_park_stockholm: "Parque de la industria en Estocolmo"
 SWE_found_industry_park_stockholm_desc: "Un parque industrial con sede en Estocolmo aprovechará el ecosistema académico, tecnológico y de inversión de la ciudad para el crecimiento futuro."
 SWE_norbotten_line: "Actualizar la línea Norrbotten"
 SWE_norbotten_line_desc: "El ferrocarril Norrbotten es clave para la minería y la logística norte. La modernizaremos y ampliaremos para mayor capacidad."
 SWE_found_nordbanken: "Encontrado en Nordbanken"
 SWE_found_nordbanken_desc: "Un nuevo banco público Nordbanken promoverá la inversión nacional, los préstamos empresariales y la inclusión financiera regional."
 SWE_found_NORDCAPS: "Crear Grupo de Inversiones NORDCAPS"
 SWE_found_NORDCAPS_desc: "Para apoyar a los sectores estratégicos, estableceremos NORDCAPS un grupo de inversión centrado en las empresas tecnológicas, energéticas y transversales."
 SWE_banking_oportunity: "Programa de oportunidades bancarias"
 SWE_banking_oportunity_desc: "Facilitaremos las regulaciones y proporcionaremos incentivos para que Suecia sea un líder regional en innovación financiera responsable."
 SWE_thermal_energy_cooperation: "Energy Cooperation"
 SWE_thermal_energy_cooperation_desc: "Al promover proyectos de energía térmica, mejoramos la seguridad energética y avanzamos nuestros objetivos de descarbonización."
 SWE_agreement_to_support_industrial_mio_cooperation: "Acuerdo de Cooperación Industrial MIO"
 SWE_agreement_to_support_industrial_mio_cooperation_desc: "Mediante acuerdos multiindustriales, sincronizaremos la innovación industrial, el entrenamiento de mano de obra y las asociaciones internacionales."
 SWE_form_Postnord: "Formulario PostNord"
 SWE_form_Postnord_desc: "Una compañía logística conjunta PostNord será fundada con Dinamarca para manejar correo transfronterizo, paquetes y logística digital."
 SWE_digital_oportunity: "La oportunidad digital"
 SWE_digital_oportunity_desc: "La digitalización ofrece la oportunidad de saltar adelante. Invertiremos en habilidades digitales, startups y plataformas seguras para la economía a prueba de futuro."
 SWE_found_Nordic_baltic_kooperation: "Cooperación económica nórdica y báltica"
 SWE_found_Nordic_baltic_kooperation_desc: "Una cooperación más estrecha con nuestros vecinos nórdicos y bálticos aumenta la resiliencia económica y construye un bloque regional fuerte."
 SWE_the_New_army: "Establecer la Sede de las Fuerzas Armadas de Suecia"
 SWE_the_New_army_desc: "Para preparar a Suecia para las realidades estratégicas del siglo XXI, nuestro liderazgo militar debe ser reorganizado y empoderado. El establecimiento de una sede centralizada de las fuerzas armadas suecas permitirá simplificar la coordinación entre ramas, la planificación logística integrada y una doctrina unificada para la defensa nacional.\n\nEste movimiento marca un cambio estructural de la administración dispersa del tiempo de paz a un comando totalmente operativo, listo para la misión capaz de responder a crisis con velocidad y precisión."
 SWE_Navy_reforms: "Reformas navales"
 SWE_Navy_reforms_desc: "Para mantener una fuerza naval capaz, debemos modernizar nuestra flota, reestructurar estrategias de mando e integrar nuevas tecnologías. Una marina más fuerte garantizará la capacidad de Suecia para proteger sus aguas y el poder del proyecto cuando sea necesario."
 SWE_Green_water_doctrine: "Doctrina de agua verde"
 SWE_Green_water_doctrine_desc: "La estrategia naval de Suecia debe centrarse en defender nuestras aguas costeras manteniendo la capacidad de operar en mares cercanos. Mediante la adaptación de una Doctrina de Agua Verde, garantizamos una flota ágil y versátil."
 SWE_combined_arms_operation: "Operaciones de armas combinadas"
 SWE_combined_arms_operation_desc: "La guerra moderna requiere una cooperación ininterrumpida entre las fuerzas terrestres, aéreas y navales. Refinaremos nuestra coordinación militar para ejecutar operaciones conjuntas con la máxima eficiencia."
 SWE_Expand_coastal_patrols: "Ampliar las patrullas costeras"
 SWE_Expand_coastal_patrols_desc: "El aumento de la cobertura patrullera a lo largo de nuestra costa mejorará la seguridad nacional y disuadirá las amenazas potenciales. Invertir en nuevos buques de patrulla y tecnologías de vigilancia es clave para asegurar las aguas suecas."
 SWE_Improve_asw_training: "Mejorar Guerra antisubmarina"
 SWE_Improve_asw_training_desc: "Los submarinos enemigos representan una amenaza constante para nuestras aguas. Mejorando el entrenamiento de guerra antisubmarina (ASW) y adquiriendo sistemas de sonar avanzados, fortaleceremos nuestra defensa naval."
 SWE_balanced_task_force_doctrine: "Doctrina del Equipo de Tareas Equilibrada"
 SWE_balanced_task_force_doctrine_desc: "Una flota equilibrada es esencial tanto para la defensa como para la proyección del poder. Al estructurar nuestras fuerzas navales en equipos de tareas versátiles, aumentaremos la eficacia operacional."
 SWE_improve_Radar_and_rec: "Mejorar el Radar y el Reconocimiento"
 SWE_improve_Radar_and_rec_desc: "Las mejores capacidades de radar y reconocimiento proporcionarán una mayor conciencia de la situación, lo que nos permitirá detectar las amenazas tempranamente y responder con eficacia."
 SWE_improved_amphibious_units: "Mejora de las unidades anfibias"
 SWE_improved_amphibious_units_desc: "Nuestras fuerzas anfibias deben ser modernizadas para realizar operaciones de respuesta rápida. Invertiremos en una mejor formación, nueva nave de aterrizaje y un mayor apoyo logístico."
 SWE_Brown_water_doctrine: "Doctrina de agua marrón"
 SWE_Brown_water_doctrine_desc: "La geografía única de Suecia exige una marina capaz de operar eficazmente en entornos costeros y fluviales. Una Doctrina de Agua Marrón mejorará nuestra capacidad para proteger las vías fluviales y los archipiélagos interiores."
 SWE_Baltic_minefield_planning: "Planeamiento Báltico Minefield"
 SWE_Baltic_minefield_planning_desc: "Las minas han sido históricamente un método rentable de defensa naval. Mediante el desarrollo de un plan estratégico de campos minados del Báltico, disuadiremos las incursiones hostiles y aseguraremos nuestra costa."
 SWE_Expand_Coast_and_river_patrols: "Ampliar las patrullas costeras y fluviales"
 SWE_Expand_Coast_and_river_patrols_desc: "Mantener la seguridad a lo largo de la costa sueca y las vías fluviales interiores requiere fuerzas de patrulla dedicadas. Al expandir nuestras unidades de patrullas costeras y fluviales, aseguramos una vigilancia constante."
 SWE_specified_amphibious_defence_force: "Special Amphibious Defence Force"
 SWE_specified_amphibious_defence_force_desc: "Una fuerza de defensa anfibia dedicada garantizará que Suecia pueda defender sus archipiélagos y llevar a cabo operaciones costeras eficientemente. Se dará prioridad a la capacitación y el equipo especializados."
 SWE_archipelago_warfare: "Archipiélago Warfare"
 SWE_archipelago_warfare_desc: "Las muchas islas de Suecia crean desafíos y oportunidades tácticas únicos. Desarrollar tácticas especializadas para la guerra de archipiélagos dará a nuestras fuerzas una ventaja en la defensa de nuestra patria."
 SWE_Homewater_intervention: "Intervención en el agua de casa"
 SWE_Homewater_intervention_desc: "En tiempos de crisis, Suecia debe ser capaz de actuar rápidamente para asegurar sus aguas. Fortalecer nuestra capacidad de intervenir en controversias territoriales y amenazas a la seguridad garantizará la estabilidad marítima."
 SWE_Improve_mine_warfare: "Mejorar la guerra de minas"
 SWE_Improve_mine_warfare_desc: "Las minas navales siguen siendo un elemento de disuasión eficaz contra las incursiones enemigas. Al modernizar nuestras capacidades de guerra contra minas, podemos controlar mejor las vías navegables estratégicas y defender nuestras costas."
 SWE_Interbranch_commando: "Interbranch Commando"
 SWE_Interbranch_commando_desc: "Para mejorar nuestras capacidades operacionales, Suecia establecerá unidades de comando de élite que puedan integrarse perfectamente con todas las ramas del ejército. Esta iniciativa fomentará la cooperación entre los servicios y asegurará que nuestras fuerzas especiales estén preparadas para cualquier reto, tanto en el país como en el extranjero."
 SWE_Realtime_data_sharing: "Compartir datos en tiempo real"
 SWE_Realtime_data_sharing_desc: "En el campo de batalla moderno, la información es clave. Mediante la puesta en práctica del intercambio de datos en tiempo real en todas las unidades militares, Suecia logrará una conciencia inigualable sobre la situación. Esta actualización permitirá una adopción de decisiones más rápida y una coordinación más eficaz, dándole un margen estratégico en cualquier conflicto."
 SWE_Improve_marine_infantry: "Modernización de la infantería marina"
 SWE_Improve_marine_infantry_desc: "Nuestra infantería marina debe estar lista para enfrentar los desafíos del siglo XXI. Este enfoque invertirá en capacitación avanzada, equipo nuevo y tecnología de vanguardia para transformar nuestras fuerzas marinas en una unidad de combate formidable y anfibia capaz de despliegue rápido y operaciones de combate sostenidas."
 SWE_Gotland_radar: "Red de radar Gotland"
 SWE_Gotland_radar_desc: "Para salvaguardar nuestra integridad territorial, Suecia establecerá una red de radares de vanguardia en la isla de Gotland. Esta iniciativa estratégica mejorará considerablemente nuestras capacidades de vigilancia aérea y marítima, proporcionando alerta temprana sobre posibles amenazas y garantizando la seguridad de nuestros cielos y mares."
 SWE_fast_reaction_force: "Fuerza de reacción rápida"
 SWE_fast_reaction_force_desc: "En un mundo siempre cambiante, Suecia debe estar dispuesta a responder rápidamente a las amenazas emergentes. Nuestra nueva Fuerza de Reacción Rápida será la vanguardia de nuestra defensa, capaz de desplegar en un momento para proteger nuestra soberanía y apoyar a nuestros aliados."
 SWE_Rapid_deployment_doctrine: "Doctrina de Despliegue rápido"
 SWE_Rapid_deployment_doctrine_desc: "La guerra moderna exige agilidad y velocidad. Mediante la adopción de una Doctrina de Despliegue Rápido, nuestras fuerzas serán capacitadas y equipadas para movilizarse rápidamente, asegurando que podamos hacer frente a cualquier reto, ya sea en casa o en el extranjero."
 SWE_Integrated_command_and_control: "Comando y Control Integrados"
 SWE_Integrated_command_and_control_desc: "Un ejército cohesivo requiere una comunicación y coordinación inigualables. Nuestros sistemas de mando y control integrados unificarán nuestras fuerzas, mejorando nuestra capacidad para tomar decisiones rápidas e informadas en el calor de la batalla."
 SWE_Armestaben: "Reforzar al Estado Mayor del Ejército"
 SWE_Armestaben_desc: "Una fuerza terrestre capaz no requiere sólo equipo, sino coordinación competente, doctrina y preparación. Fortaleceremos al Estado Mayor del Ejército (Arméstaben) como unidad central de planificación y mando de las fuerzas terrestres suecas.\n\nAl mejorar el liderazgo operacional, actualizar los protocolos de capacitación e integrar nuevas evaluaciones estratégicas, el Estado Mayor del Ejército velará por que nuestras fuerzas terrestres sean ágiles, modernas y listas para la evolución de las amenazas tanto en el país como en el extranjero."
 SWE_Joint_operation_Training: "Capacitación en operaciones conjuntas"
 SWE_Joint_operation_Training_desc: "El futuro de la guerra es colaborativo. Nuestro programa de entrenamiento de operaciones conjuntas forja fuertes vínculos entre nuestro Ejército, Armada y Fuerza Aérea, creando un frente unificado capaz de enfrentar amenazas complejas y de múltiples dominios."
 SWE_Advanced_Territorial_defence: "Avanzada Territorial Defense"
 SWE_Advanced_Territorial_defence_desc: "Nuestra patria es nuestro mayor activo. Las iniciativas avanzadas de Defensa Territorial fortificarán nuestras fronteras e infraestructura crítica, asegurando que Suecia siga siendo un bastión de seguridad en un mundo incierto."
 SWE_Defence_focus: "Defensa Nacional Enfoque"
 SWE_Defence_focus_desc: "En tiempos de paz, nos preparamos para la guerra. Nuestra Defensa Nacional Enfoque priorizará la modernización de nuestras capacidades militares, asegurando que Suecia esté siempre dispuesta a defender sus intereses y valores."
 SWE_Reorganize_the_Active_troops: "Reorganización de tropas activas"
 SWE_Reorganize_the_Active_troops_desc: "Nuestras tropas activas son la primera línea de defensa. Esta reorganización optimizará su estructura y despliegue, mejorando su disponibilidad y eficacia tanto en operaciones defensivas como ofensivas."
 SWE_Reorganize_reserve: "Reorganización de las fuerzas de reserva"
 SWE_Reorganize_reserve_desc: "Una reserva fuerte es crucial para una defensa sostenida. Al reorganizar nuestras fuerzas de reserva, aseguramos que Suecia pueda reforzar rápidamente sus tropas activas en tiempos de crisis, manteniendo nuestras capacidades defensivas durante períodos prolongados."
 SWE_Advanced_Armor_Tactics: "Avanzadas Blindaje Tácticas"
 SWE_Advanced_Armor_Tactics_desc: "Blindaje La guerra está evolucionando. Nuestro programa Advanced Blindaje Tactics equipará a nuestros tripulantes con las últimas estrategias y tecnologías, asegurando que sigan siendo una fuerza formidable en el campo de batalla."
 SWE_mobile_Warfare_doctrine: "Doctrina de guerra móvil"
 SWE_mobile_Warfare_doctrine_desc: "La movilidad es clave para el combate moderno. Al abrazar una Doctrina de Guerra Móvil, nuestras fuerzas serán entrenadas para operar rápida y decisivamente, superando al enemigo y asegurando la victoria."
 SWE_Strengthen_infantry_training: "Fortalecimiento de la capacitación en infantería"
 SWE_Strengthen_infantry_training_desc: "La infantería es el corazón de nuestro ejército. Los programas de entrenamiento mejorados forjarán soldados más fuertes y resistentes, capaces de superar cualquier desafío y defender a nuestra nación con determinación inquebrantable."
 SWE_Advanced_mechanized_tactic: "Avanzadas tácticas mecanizadas"
 SWE_Advanced_mechanized_tactic_desc: "Las unidades mecanizadas combinan velocidad y potencia de fuego. Nuestras tácticas mecanizadas avanzadas garantizarán que estas unidades estén a la vanguardia de la innovación militar, listas para dirigir nuestras operaciones y asegurar objetivos clave."
 SWE_Modernize_Armored_Tactics: "Tácticas modernas Blindaje"
 SWE_Modernize_Armored_Tactics_desc: "Blindaje Las unidades deben adaptarse al campo de batalla cambiante. Modern Blindajeed Tactics integrará las últimas tecnologías y estrategias, asegurando que nuestros tanques y vehículos blindados sigan siendo una fuerza potente en cualquier conflicto."
 SWE_Armored_Delay: "Blindaje Dilatación tácticas"
 SWE_Armored_Delay_desc: "A veces, la mejor defensa es un retraso estratégico. Nuestra táctica de demora Blindaje entrenará nuestras fuerzas para frenar el avance del enemigo, comprando tiempo para refuerzos y girando la marea de batalla."
 SWE_Reserve_mobilisation_plan: "Plan de Movilización Reserva"
 SWE_Reserve_mobilisation_plan_desc: "En tiempos de crisis, nuestras reservas deben estar listas para reforzar nuestras defensas. Este plan de movilización garantiza una rápida y eficiente llamada, integrando las unidades de reserva sin problemas en nuestras fuerzas activas."
 SWE_Territorial_defence_coordination: "Coordinación de la defensa territorial"
 SWE_Territorial_defence_coordination_desc: "Una defensa coordinada es una fuerte defensa. Al mejorar nuestra Coordinación Territorial de Defensa, aseguramos que todas las ramas de nuestro trabajo militar juntos para proteger nuestra patria, sin dejar lagunas para que el enemigo pueda explotar."
 SWE_Rapid_Armor_deployment: "Despliegue rápido Blindaje"
 SWE_Rapid_Armor_deployment_desc: "La velocidad es crucial en la guerra armada. Nuestras estrategias de Despliegue Rápida Blindaje garantizarán que nuestros tanques y vehículos blindados estén siempre en el lugar correcto en el momento adecuado, listos para atacar cuando sea necesario."
 SWE_Mechanized_Stormtroops: "Tropas de tormenta mecanizada"
 SWE_Mechanized_Stormtroops_desc: "Los tropa de tormenta mecanizada son la punta de la lanza. Equipados con los últimos vehículos y armas, dirigirán nuestras ofensivas, atravesarán las líneas enemigas y asegurarán la victoria."
 SWE_Specialized_infantry: "Unidades especializadas de infantería"
 SWE_Specialized_infantry_desc: "Las unidades especializadas de infantería reciben capacitación para misiones específicas y de alto riesgo. Ya sea guerra urbana, combate de montaña o operaciones en la selva, estos soldados están listos para cualquier cosa."
 SWE_Mech_Art: "Formación de artillería mecánica"
 SWE_Mech_Art_desc: "La artillería mecanizada combina la movilidad con una fuerza de fuego devastadora. Nuestros programas de entrenamiento asegurarán que estas unidades estén siempre listas para proporcionar apoyo crucial, convirtiendo la marea de batalla a nuestro favor."
 SWE_Advanced_Armor_counterattack: "Avanzado Blindaje Contraataque"
 SWE_Advanced_Armor_counterattack_desc: "Cuando el enemigo golpee, debemos estar listos para atacar. Nuestras estrategias avanzadas Blindaje Counterattack asegurarán que nuestras unidades blindadas puedan reagruparse rápidamente y lanzar contraofensivos devastadores."
 SWE_Improve_reserve_training: "Mejoramiento de la reserva"
 SWE_Improve_reserve_training_desc: "Nuestras reservas son una parte vital de nuestra defensa. Los programas de entrenamiento mejorados asegurarán que siempre estén listos para intensificar y defender nuestra nación, sin importar el reto."
 SWE_Optimize_supply_chain: "Cadena de suministro optimizada"
 SWE_Optimize_supply_chain_desc: "Un ejército bien dotado es un ejército fuerte. Al optimizar nuestra cadena de suministro, aseguramos que nuestras tropas tengan todo lo que necesitan, cuando la necesitan, para mantener su espíritu de lucha y eficacia."
 SWE_Global_intervention_capability: "Capacidad de intervención mundial"
 SWE_Global_intervention_capability_desc: "En un mundo interconectado, las amenazas pueden surgir en cualquier lugar. Nuestra Capacidad de Intervención Global garantiza que podemos proyectar el poder e influir mucho más allá de nuestras fronteras, salvaguardando nuestros intereses y promoviendo la estabilidad."
 SWE_Balance_act: "Estrategia militar equilibrada"
 SWE_Balance_act_desc: "Una estrategia militar equilibrada es clave para nuestro éxito. Al invertir en capacidades ofensivas y defensivas, aseguramos que Suecia esté preparada para cualquier reto, desde la defensa territorial hasta las operaciones internacionales."
 SWE_Artillery_Impovements: "Mejoras de la artillería"
 SWE_Artillery_Impovements_desc: "La artillería es la columna vertebral de nuestro soporte para incendios. Al invertir en las últimas tecnologías y capacitación, aseguramos que nuestras unidades de artillería estén siempre listas para proporcionar un poder de fuego decisivo cuando sea necesario."
 SWE_naval_landing_training: "Entrenamiento naval de aterrizaje"
 SWE_naval_landing_training_desc: "Las operaciones anfibias son complejas y exigentes. Nuestros programas de Capacitación Naval Landing prepararán a nuestras tropas para ejecutar aterrizajes en la playa y asaltos costeros con precisión y eficacia."
 SWE_Air_mobility_exercise: "Ejercicios de movilidad aérea"
 SWE_Air_mobility_exercise_desc: "La movilidad aérea es crucial para el despliegue rápido y el apoyo. Nuestros ejercicios asegurarán que nuestras fuerzas aéreas estén listas para transportar tropas y suministros de forma rápida y eficiente, donde sea necesario."
 SWE_lone_fighter_training: "Formación de luchadores solitarios"
 SWE_lone_fighter_training_desc: "A veces, nuestros soldados deben operar solos detrás de las líneas enemigas. El entrenamiento de luchadores solitarios les proporciona las habilidades y la resiliencia para sobrevivir y prosperar en las condiciones más difíciles."
 SWE_Delay_training: "Entrenamiento de demoras"
 SWE_Delay_training_desc: "Reducir el avance del enemigo puede ser una táctica crucial. Nuestros programas de Entrenamiento Delay prepararán nuestras tropas para frenar el progreso del enemigo, comprando tiempo para refuerzos y girando la marea de batalla."
 SWE_Direct_counter_attack: "Contraataque directo"
 SWE_Direct_counter_attack_desc: "Cuando el enemigo golpee, debemos estar listos para atacar. Nuestras estrategias Direct Counterattack asegurarán que nuestras fuerzas puedan reagruparse rápidamente y lanzar contraofensivos decisivos, recuperando la iniciativa."
 SWE_entrenchment_training: "Atrincheramiento Capacitación"
 SWE_entrenchment_training_desc: "Atrincheramiento es una táctica defensiva vital. Nuestros programas de entrenamiento asegurarán que nuestras tropas estén calificadas para cavar y mantener su terreno, sin importar el reto."
 SWE_Wargames_and_exercise: "Juegos de guerra y ejercicios"
 SWE_Wargames_and_exercise_desc: "Los juegos de guerra y los ejercicios son esenciales para perfeccionar nuestras habilidades y probar nuestras estrategias. Al participar en escenarios de entrenamiento regulares y realistas, aseguramos que nuestras fuerzas estén siempre listas para los desafíos de la guerra moderna."
 SWE_army_defence_exercise: "Ejercicios de Defensa del Ejército"
 SWE_army_defence_exercise_desc: "Defender nuestra patria es nuestra máxima prioridad. Nuestros Ejercicios de Defensa del Ejército prepararán nuestras tropas para repeler cualquier amenaza, asegurando que Suecia siga siendo segura y soberana."
 SWE_Global_Crisis_management: "Gestión mundial de crisis"
 SWE_Global_Crisis_management_desc: "En un mundo de cambio constante, las crisis pueden surgir en cualquier lugar. Nuestras estrategias de gestión global de crisis aseguran que estamos listos para responder con rapidez y eficacia, salvaguardando nuestros intereses y promoviendo la estabilidad."
 SWE_security_intervention: "Intervención de seguridad"
 SWE_security_intervention_desc: "Cuando la seguridad se ve amenazada, la intervención rápida es crucial. Nuestras estrategias de Intervención de Seguridad aseguran que podamos actuar decisivamente para restaurar el orden y proteger nuestros intereses, tanto en el país como en el extranjero."
 SWE_Ready_for_Defence: "Listo para Defensa"
 SWE_Ready_for_Defence_desc: "Una fuerte defensa comienza con la preparación. Al invertir en capacitación, equipamiento e infraestructura, aseguramos que Suecia esté siempre preparada para defender su soberanía y proteger a su pueblo."
 SWE_Airforce_structure: "Estructura de la Fuerza Aérea"
 SWE_Airforce_structure_desc: "Una fuerza de aire moderna requiere una estructura moderna. Esta revisión simplificará nuestros sistemas de mando y control, mejorando la coordinación y eficiencia en todas las operaciones aéreas."
 SWE_Restructure_Airdefense: "Reestructuración de la Defensa Aérea"
 SWE_Restructure_Airdefense_desc: "Nuestros cielos deben permanecer inviolables. Al reestructurar nuestra defensa aérea, aseguramos un sistema integrado y capa capaz de detectar y neutralizar cualquier amenaza aérea."
 SWE_Restructure_Airports: "Reestructuración de la infraestructura del aeropuerto"
 SWE_Restructure_Airports_desc: "Los aeropuertos son la línea de vida de nuestras operaciones aéreas. Esta reestructuración modernizará nuestra infraestructura aeroportuaria, asegurando el despliegue rápido y seguro de nuestros activos aéreos."
 SWE_enhance_pilot_training: "Mejoramiento de la capacitación piloto"
 SWE_enhance_pilot_training_desc: "Nuestros pilotos son la punta de la lanza. Los programas de capacitación mejorados perfeccionarán sus habilidades, asegurando que estén listos para cualquier reto, desde misiones de superioridad aérea hasta huelgas de precisión."
 SWE_strike_focus: "Operaciones de huelga Enfoque"
 SWE_strike_focus_desc: "Las huelgas de precisión son cruciales en la guerra moderna. Este enfoque equipará a nuestra fuerza aérea con las últimas tecnologías y tácticas, asegurando que podamos dar golpes decisivos contra objetivos de alto valor."
 SWE_interception_focus: "Operaciones de interceptación Enfoque"
 SWE_interception_focus_desc: "Interceptar aviones enemigos es una medida defensiva vital. Este enfoque mejorará nuestras capacidades de interceptación, asegurando que nuestros cielos permanezcan seguros contra cualquier incursión."
 SWE_Improve_groundattack_training: "Mejora de la capacitación sobre ataques terrestres"
 SWE_Improve_groundattack_training_desc: "El apoyo a las tropas terrestres desde el aire es esencial para operaciones de armas combinadas. El entrenamiento mejorado asegurará que nuestros pilotos sean hábiles para proporcionar un apoyo aéreo cercano, convirtiendo la marea de batalla a nuestro favor."
 SWE_Integrated_strike_tactics: "Tacticas integradas de huelga"
 SWE_Integrated_strike_tactics_desc: "Las tácticas de huelga integradas combinan las fortalezas de nuestras fuerzas aéreas, terrestres y marítimas. Al coordinar nuestras operaciones, garantizamos el máximo impacto y eficiencia en cualquier compromiso."
 SWE_Improve_fighter_training: "Mejora de la capacitación de los combatientes"
 SWE_Improve_fighter_training_desc: "Nuestros pilotos de combate son los guardianes de nuestros cielos. Los programas de entrenamiento mejorados les dotarán de las habilidades y tácticas necesarias para mantener la superioridad del aire en cualquier conflicto."
 SWE_Improve_Radarcapability: "Capacidad de radar mejorada"
 SWE_Improve_Radarcapability_desc: "Radar es el ojo de nuestra defensa aérea. Al mejorar nuestras capacidades de radar, garantizamos la detección temprana y el seguimiento de cualquier amenaza aérea, proporcionando a nuestras fuerzas el tiempo y la información necesarios para responder con eficacia."
 SWE_Combat_exercise_simulation_center: "Centro de simulación del ejercicio de combate"
 SWE_Combat_exercise_simulation_center_desc: "La formación realista es clave para combatir la preparación. Nuestro centro de simulación de última generación proporcionará escenarios inmersos y desafiantes, perfeccionando las habilidades de nuestros pilotos y preparándolos para operaciones del mundo real."
 SWE_Upgrade_Comunication_network: "Red de comunicaciones actualizada"
 SWE_Upgrade_Comunication_network_desc: "La comunicación sin problemas es vital para las operaciones coordinadas. Al mejorar nuestra red de comunicaciones, aseguramos que nuestras fuerzas puedan compartir información y coordinar acciones en tiempo real, mejorando nuestra eficacia operacional."
 SWE_fight_simulation_center: "Centro de simulación de vuelo"
 SWE_fight_simulation_center_desc: "Los escenarios de combate simulados permiten que nuestros pilotos entrenen para las condiciones más difíciles. Nuestro Centro de Simulación de Vuelo proporcionará formación realista e inmersiva, preparando nuestra fuerza aérea para cualquier eventualidad."
 SWE_Digital_battlefield_organization: "Organización de campo de batalla digital"
 SWE_Digital_battlefield_organization_desc: "El campo de batalla moderno es digital. Al organizar nuestras operaciones en torno a un marco digital, potenciamos nuestra capacidad de sensibilización, coordinación y toma de decisiones sobre la situación, asegurando que mantenemos el margen en cualquier conflicto."
 SWE_Improve_AWACS_Datalink: "Mejoramiento del enlace de datos AWACS"
 SWE_Improve_AWACS_Datalink_desc: "AWACS proporciona los ojos y oídos de nuestras operaciones aéreas. Al mejorar nuestras capacidades de enlace de datos, garantizamos el intercambio en tiempo real de información crítica, mejorando nuestra capacidad para detectar, rastrear y comprometer con eficacia las amenazas."
 SWE_Implement_realtime_data_sharing: "Implementación de Compartir datos en tiempo real"
 SWE_Implement_realtime_data_sharing_desc: "El intercambio de datos en tiempo real es crucial para las operaciones coordinadas. Al implementar tecnologías avanzadas de intercambio de datos, aseguramos que nuestras fuerzas tengan la información que necesitan, cuando lo necesiten, para realizar acciones decisivas en el calor de la batalla."
 SWE_Taurus_integration: "Integrar el Misil Taurus"
 SWE_Taurus_integration_desc: "En un panorama estratégico en rápida evolución, Suecia debe fortalecer su capacidad para realizar huelgas de precisión a larga distancia. El misil de crucero Taurus KEPD 350, desarrollado por Alemania y Suecia, parece ser una solución ideal, especialmente en combinación con nuestra plataforma de combate multirole, el JAS 39 Gripen.\n\nAl iniciar conversaciones sobre adquisiciones, licencias o integración conjunta, podemos aumentar dramáticamente nuestras capacidades de lucha profunda mientras permanecemos fuera de los marcos tradicionales de alianzas."
 SWE_Special_Operation_capability: "Mejora de la capacidad de las operaciones especiales"
 SWE_Special_Operation_capability_desc: "Las operaciones especiales son la punta de la lanza en guerra no convencional. Al mejorar nuestras capacidades en esta esfera, aseguramos que nuestras fuerzas estén listas para ejecutar misiones de alto riesgo y de alto nivel, salvaguardando nuestros intereses nacionales en las sombras."
 SWE_focus_on_infiltration: "Operaciones de infiltración Enfoque"
 SWE_focus_on_infiltration_desc: "La infiltración es una habilidad crucial para las fuerzas especiales. Este enfoque equipará a nuestros operadores con las últimas tácticas y tecnologías, permitiéndoles penetrar líneas enemigas sin ser detectadas y reunir inteligencia vital."
 SWE_focus_on_Reconnaissance_capability: "Mejoramiento de la capacidad de reconocimiento"
 SWE_focus_on_Reconnaissance_capability_desc: "El reconocimiento es los ojos y oídos de nuestras operaciones militares. Al mejorar nuestras capacidades de reconocimiento, aseguramos que nuestras fuerzas tengan la información que necesitan para hacer acciones decisivas, ya sea en defensa o ofensa."
 SWE_focus_on_counter_spy_capability: "Operaciones de lucha contra la pobreza Enfoque"
 SWE_focus_on_counter_spy_capability_desc: "La contraespionaje es vital para la seguridad nacional. Este enfoque fortalecerá nuestra capacidad para detectar y neutralizar las operaciones de inteligencia extranjeras, salvaguardar nuestros secretos y mantener nuestra ventaja estratégica."
 SWE_Reform_Specialforces_training: "Reforma de la Capacitación de las Fuerzas"
 SWE_Reform_Specialforces_training_desc: "Nuestras fuerzas especiales son elite, y su entrenamiento debe reflejar esto. Esta reforma introducirá técnicas de vanguardia y estándares rigurosos, asegurando que nuestros operadores estén siempre listos para las misiones más exigentes."
 SWE_Improve_secret_secvice_cooperation: "Mejora de la cooperación en el servicio secreto"
 SWE_Improve_secret_secvice_cooperation_desc: "La cooperación entre nuestros servicios secretos y fuerzas especiales es crucial para las operaciones exitosas. Al mejorar esta colaboración, potenciamos nuestra capacidad para ejecutar misiones encubiertas y reunir información de manera efectiva."
 SWE_Improve_Special_forces_activities: "Actividades de las Fuerzas Especiales"
 SWE_Improve_Special_forces_activities_desc: "Las actividades de las Fuerzas Especiales son diversas y exigentes. Esta mejora proporcionará a nuestros operadores las herramientas y el entrenamiento que necesitan para sobresalir en cualquier entorno, desde la guerra urbana hasta operaciones de selva."
 SWE_integrate_drones_to_rec_forces: "Integración drona en las fuerzas de reconocimiento"
 SWE_integrate_drones_to_rec_forces_desc: "Los Drones ofrecen capacidades incomparables en reconocimiento y vigilancia. Al integrar tecnología avanzada de drones en nuestras fuerzas de reconocimiento, potenciamos nuestra capacidad para reunir inteligencia y monitorear amenazas en tiempo real."
 SWE_training_by_secret_service: "Programas de capacitación en servicios secretos"
 SWE_training_by_secret_service_desc: "Nuestros servicios secretos poseen habilidades y conocimientos únicos. Al incorporar su experiencia en nuestros programas de capacitación, aseguramos que nuestras fuerzas especiales estén equipadas con las últimas tácticas y técnicas, listas para enfrentar cualquier reto."
 SWE_Artillery: "Modernización de la artillería"
 SWE_Artillery_desc: "Para seguir siendo eficaz en el campo de batalla moderno, nuestras unidades de artillería deben ser actualizadas con sistemas de apuntamiento mejorados, capacidades de largo alcance y mayor movilidad. Un renovado enfoque en la artillería dará a nuestras fuerzas terrestres el filo de fuego que necesitan."
 SWE_lvkv_90: "Mejorar la plataforma Lvkv 90"
 SWE_lvkv_90_desc: "El vehículo antiaéreo autopropulsado Lvkv 90 sigue siendo una piedra angular de nuestra defensa del aire móvil. La modernización de esta plataforma garantiza que pueda enfrentar nuevas amenazas aéreas con mayor precisión y supervivencia."
 SWE_airmobile_units: "Establecer unidades de transporte aéreo"
 SWE_airmobile_units_desc: "El despliegue rápido es clave en los conflictos dinámicos de hoy. Mediante la formación de unidades aéreas especializadas, habilitamos capacidades de reacción rápida en todo Suecia y más allá, potenciando nuestra flexibilidad militar."
 SWE_cv90_modernization: "CV90 Modernization Program"
 SWE_cv90_modernization_desc: "El vehículo de combate de infantería CV90 es central en nuestras fuerzas terrestres. Al mejorar su armadura, sensores y potencia de fuego, aseguramos que nuestras tropas estén apoyadas por una de las plataformas más avanzadas de su clase."
 SWE_modernize_marine_effort: "Modernizar el cuerpo anfibio"
 SWE_modernize_marine_effort_desc: "Con la geografía única de Suecia, las capacidades anfibias son esenciales. Mejorar nuestras unidades marinas con nuevas naves de aterrizaje, equipos y entrenamiento asegurará nuestras costas y mejorará el despliegue rápido."
 SWE_modernize_equipment: "Modernizar el equipo del ejército"
 SWE_modernize_equipment_desc: "Nuestros soldados merecen lo mejor. Del equipo personal a los sistemas de comunicación, un amplio esfuerzo de modernización aumentará la eficacia, seguridad y coordinación en el campo de batalla."
 SWE_corvettes: "Ampliar la Flota de Corvette"
 SWE_corvettes_desc: "Corvettes rápidos, sigilosos y mortales son vitales para defender nuestras aguas. Ampliar nuestra flota de corvette reforzará la presencia y disuasión naval de Suecia en el Mar Báltico."
 SWE_Visby_2_or_lulea_class: "Próxima generación Corvette Development"
 SWE_Visby_2_or_lulea_class_desc: "Es hora de dar el siguiente paso en la innovación naval. Ya sea una continuación de la línea Visby o un nuevo diseño de Luleå, el desarrollo de una nueva clase de corvette solidificará el borde tecnológico naval sueco."
 SWE_only_gripen: "Compromiso a la exclusividad Gripen"
 SWE_only_gripen_desc: "El luchador Gripen encarna la innovación e independencia suecas. Al comprometernos con una fuerza aérea todo-Gripen, racionalizamos la logística e invertimos plenamente en nuestras capacidades aeroespaciales nacionales."
 SWE_complimentary_aitrplain: "Adquisiciones complementarias de las aeronaves"
 SWE_complimentary_aitrplain_desc: "Para mejorar la versatilidad y resiliencia de nuestra flota de luchadores, debemos considerar aviones complementarios. La adquisición estratégica cubrirá las lagunas operativas y fortalecerá las capacidades de defensa aérea."
 SWE_internal_politics: "Política interna"
 SWE_internal_politics_desc: "A medida que avanzamos en un nuevo siglo, Suecia debe enfrentar tanto los desafíos internos como las divisiones ideológicas. Un renovado enfoque en la política interna ayudará a estabilizar la nación y establecer el rumbo para el futuro."
 SWE_old_traditions: "Respeto Tradiciones antiguas"
 SWE_old_traditions_desc: "Antes de mirar hacia el futuro, debemos reconocer los valores y estructuras que han moldeado nuestra nación. Abrazar las tradiciones probadas por el tiempo proporciona una base para la unidad y la identidad."
 SWE_socialdemokraterna: "Apoyar a los socialdemócratas"
 SWE_socialdemokraterna_desc: "Con una larga historia de llevar a Suecia hacia la igualdad y la prosperidad, el Partido Socialdemócrata está dispuesto a abordar los desafíos del nuevo milenio. Su enfoque en el bienestar, la inclusión y la justicia económica resuena con el pueblo."
 SWE_S_social_investments: "Ampliar las inversiones sociales"
 SWE_S_social_investments_desc: "Una sociedad fuerte se construye a través de la inversión en su pueblo. Al ampliar la financiación para la salud, el bienestar y la infraestructura, garantizamos la estabilidad a largo plazo y reduciremos la desigualdad social."
 SWE_S_school_improvements: "Mejorar la educación en todo el país"
 SWE_S_school_improvements_desc: "La educación es la columna vertebral de cualquier democracia moderna. Al mejorar las escuelas, aumentar los sueldos de los maestros y actualizar los planes de estudio, aseguramos un futuro más brillante para todos los niños suecos."
 SWE_S_open_borders: "Proseguir políticas fronterizas abiertas"
 SWE_S_open_borders_desc: "Suecia ha sido desde hace mucho tiempo un líder humanitario. Abrazar fronteras abiertas refleja nuestros valores de tolerancia e inclusión al abordar la escasez laboral a través de la inmigración."
 SWE_S_company_laws: "Reformar los reglamentos corporativos"
 SWE_S_company_laws_desc: "La justicia en el lugar de trabajo comienza con la ley. Mediante la reforma de las regulaciones corporativas, buscamos proteger los derechos de los trabajadores, garantizar salarios justos y prevenir prácticas explotadoras."
 SWE_international_recruitment_agreement: "Acuerdo Internacional de Contratación"
 SWE_international_recruitment_agreement_desc: "Para hacer frente a las lagunas del mercado laboral, formalizaremos acuerdos que faciliten el reclutamiento internacional ético. Esta política fortalece los sectores clave manteniendo al mismo tiempo el compromiso global de Suecia con la equidad."
 SWE_S_union_workers: "Empoderar a las Uniones"
 SWE_S_union_workers_desc: "Los sindicatos fuertes son esenciales para una sociedad justa. Mejoraremos los derechos de negociación colectiva, salvaguardaremos la influencia sindical y protegeremos a los trabajadores en todas las industrias."
 SWE_socialdemokraterna_2: "Un camino progresivo hacia adelante"
 SWE_socialdemokraterna_2_desc: "Los socialdemócratas están comprometidos a llevar a Suecia a una nueva era que combina la sostenibilidad, la innovación y la justicia social. Un mandato renovado nos permitirá promulgar reformas audaces y fortalecer la democracia."
 SWE_centerpartiet: "Apoyo al Partido Centro"
 SWE_centerpartiet_desc: "Con profundas raíces en las tierras rurales de Suecia, el Partido Centro promueve la descentralización, la sostenibilidad y el emprendimiento. Su visión equilibra el liberalismo del mercado con una fuerte administración ambiental."
 SWE_c_school_grading_system: "Revisar el sistema de enseñanza escolar"
 SWE_c_school_grading_system_desc: "Para garantizar la equidad y motivación en la educación, debemos actualizar el sistema de clasificación escolar. Las normas más claras y evaluaciones más flexibles beneficiarán tanto a los estudiantes como a los educadores."
 SWE_c_farmers: "Apoyo a los agricultores suecos"
 SWE_c_farmers_desc: "Nuestros agricultores son la columna vertebral del campo. Al aumentar las subvenciones, mejorar la infraestructura y promover la producción local de alimentos, protegemos los medios de subsistencia y la seguridad alimentaria."
 SWE_c_police: "Fortalecimiento de la policía local"
 SWE_c_police_desc: "La seguridad comienza a nivel comunitario. El fortalecimiento de las fuerzas policiales locales mediante una mejor capacitación y recursos garantizará la seguridad y la confianza en todas las zonas rurales y urbanas."
 SWE_c_railways: "Invertir en ferrocarriles"
 SWE_c_railways_desc: "El transporte ferroviario es esencial para una Suecia sostenible y conectada. Renovar y ampliar nuestra red ferroviaria beneficiará tanto a las personas como a las empresas, especialmente en áreas remotas."
 SWE_c_telecom: "Expansión de Telecom Rural"
 SWE_c_telecom_desc: "Internet de alta velocidad y servicios confiables de telecomunicaciones ya no son lujos que son necesidades. Invertiremos en conectividad rural para cerrar la brecha digital y empoderar a todas las comunidades."
 SWE_c_vitalice_the_country_side: "Revitalizar el Campo"
 SWE_c_vitalice_the_country_side_desc: "La despoblación amenaza a Suecia rural. Al promover las empresas locales, mejorar los servicios y apoyar a las familias jóvenes, respiramos nueva vida en el campo."
 SWE_c_enviremental_friendly_economy: "Construir una economía ecológicamente amigable"
 SWE_c_enviremental_friendly_economy_desc: "Una economía verde es una economía fuerte. Incentivaremos la energía limpia, la agricultura sostenible y los modelos de producción circular para asegurar la prosperidad a largo plazo para Suecia."
 SWE_c_liberalize_worker_rights: "Liberalizar los derechos laborales"
 SWE_c_liberalize_worker_rights_desc: "Para fomentar la innovación y la creación de empleo, debemos modernizar las leyes laborales. Un marco regulatorio más flexible ayudará tanto a los empleados como a los empresarios."
 SWE_centerpartiet_2: "Una Suecia más verde y más libre"
 SWE_centerpartiet_2_desc: "El Partido Centro prevé una Suecia donde las comunidades rurales prosperan, los mercados funcionan con justicia y se preserva la naturaleza. A través de políticas pragmáticas y orientadas hacia el futuro, lideramos tanto con el corazón como con la razón."
 SWE_folkpartiet: "Apoyar al Partido Liberal"
 SWE_folkpartiet_desc: "El Partido Liberal prevé una Suecia basada en la libertad individual, la educación y los mercados abiertos. Sus políticas tienen por objeto empoderar a las personas mediante el conocimiento, la reducción de los impuestos y la integración social."
 SWE_fp_ghetto_issues: "Dirección Ghetto Issues"
 SWE_fp_ghetto_issues_desc: "La exclusión social y las sociedades paralelas amenazan los valores de igualdad y cohesión. Mediante reformas específicas en materia de educación y vivienda, nos proponemos abordar las causas fundamentales de la segregación urbana."
 SWE_fp_pro_euro: "Únete a la Eurozona"
 SWE_fp_pro_euro_desc: "La integración económica es clave para el futuro de Suecia. Al adoptar el euro, fortalecemos nuestros lazos con Europa, promocionamos el comercio y ganamos una mayor expresión en los asuntos continentales."
 SWE_fp_tax_cut: "Implementar recortes fiscales"
 SWE_fp_tax_cut_desc: "Una carga tributaria inferior permite a los individuos y las empresas por igual. Al reducir los impuestos, promovemos el emprendimiento, fomentamos el trabajo y alimentamos el crecimiento económico."
 SWE_fp_school_investments: "Invertir en educación"
 SWE_fp_school_investments_desc: "El conocimiento es libertad. Aumentaremos la financiación de las escuelas, apoyaremos a los maestros de alto rendimiento e introduciremos reformas para asegurar que cada niño tenga acceso a una educación de calidad."
 SWE_fp_integration: "Promover la integración social"
 SWE_fp_integration_desc: "La inmigración exitosa se basa en una integración efectiva. Invertiremos en la formación de idiomas, el empleo y la educación para asegurar que los recién llegados contribuyan plenamente a la sociedad sueca."
 SWE_fp_lower_worker_rights: "Desregular los Mercados Laborales"
 SWE_fp_lower_worker_rights_desc: "Un mercado laboral más flexible fomenta la innovación y la competitividad. Al reducir las barreras burocráticas y ajustar las protecciones anticuadas, apoyamos una economía dinámica."
 SWE_fp_privatisation_efforts: "Ampliar los esfuerzos de privatización"
 SWE_fp_privatisation_efforts_desc: "Los servicios públicos pueden beneficiarse de la eficiencia del sector privado. Nos proponemos introducir competencia e innovación en sectores como la educación, la salud y el transporte para mejorar la calidad y la elección."
 SWE_fp_improve_labor_migration: "Mejorar las políticas de migración laboral"
 SWE_fp_improve_labor_migration_desc: "Una política de inmigración inteligente puede resolver la escasez de mano de obra y fortalecer la economía. Agilizaremos los procesos de visado y crearemos caminos claros para que los trabajadores cualificados entren en Suecia."
 SWE_fp_start_up: "Soporte Inicio-Actividades e Innovación"
 SWE_fp_start_up_desc: "Los empresarios son el futuro de la economía. Crearemos incentivos fiscales, simplificaremos las regulaciones y estableceremos incubadoras tecnológicas para ayudar a que las start-ups prosperen en todo el país."
 SWE_fp_lower_public_spendings: "Reducir el gasto público"
 SWE_fp_lower_public_spendings_desc: "Para garantizar las finanzas sostenibles, debemos reducir el gasto público ineficiente. La racionalización de los programas sociales y gubernamentales liberará recursos para la educación y el crecimiento."
 SWE_folkpartiet_2: "Un futuro liberal"
 SWE_folkpartiet_2_desc: "El Partido Liberal dirige Suecia hacia un futuro de libertad, innovación y cooperación internacional. Su compromiso con la educación, la apertura y la reforma económica guiarán a la nación hacia adelante."
 SWE_moderaterna: "Apoyar a la Parte Moderada"
 SWE_moderaterna_desc: "El Partido Moderado cree en una economía fuerte, gobernanza eficiente y seguridad nacional. Su plataforma liberal-conservadora enfatiza recortes fiscales, inversiones y una fuerza de defensa capaz."
 SWE_m_energy_problems: "Abordar la crisis energética"
 SWE_m_energy_problems_desc: "El aumento de los costos energéticos y el suministro inestable amenazan la competitividad de Suecia. Priorizaremos la inversión en soluciones energéticas fiables basadas en el mercado, incluida la producción nuclear y nacional."
 SWE_m_kockums: "Revitalizar el astillero de Kockums"
 SWE_m_kockums_desc: "Kockums ha sido una piedra angular de la defensa naval sueca. Al invertir en la producción de buques submarinos y superficiales, restauramos la capacidad nacional y garantizamos una autonomía estratégica."
 SWE_m_reopen_f16: "Ala de aire F16"
 SWE_m_reopen_f16_desc: "Suecia debe estar lista para defender sus cielos. La reapertura del Ala Aérea F16 en Uppsala fortalece nuestra capacidad de defensa aérea y apoya las rápidas capacidades nacionales de respuesta."
 SWE_m_lower_isk_taxes: "Impuestos ISK inferiores"
 SWE_m_lower_isk_taxes_desc: "Investment Savings Accounts (ISK) son cruciales para el fomento de la riqueza doméstica. Bajaremos el impuesto ISK para fomentar los ahorros a largo plazo e impulsar la inversión privada de capital."
 SWE_m_attract_investors: "Atraer inversión extranjera"
 SWE_m_attract_investors_desc: "Para seguir siendo competitivo en la etapa global, Suecia debe ser un imán para el capital. Racionalizaremos las regulaciones y proporcionaremos incentivos para atraer a inversores internacionales."
 SWE_m_infrastructure_projects: "Proyectos de infraestructura de lanzamiento"
 SWE_m_infrastructure_projects_desc: "La infraestructura moderna apoya el crecimiento económico y la resiliencia nacional. Invertiremos en carreteras, ferrocarriles, puertos e infraestructura digital para estimular el desarrollo a través de Suecia."
 SWE_m_reduce_public_spendings: "Cortar gasto público"
 SWE_m_reduce_public_spendings_desc: "Para garantizar la salud fiscal a largo plazo, el gasto público debe ser restringido. Revisaremos los presupuestos de bienestar y administración, con el objetivo de un estado más fuerte y eficaz."
 SWE_m_attract_skilled_workers: "Atraer el trabajo hábil"
 SWE_m_attract_skilled_workers_desc: "Para mantener nuestras industrias competitivas, debemos dar la bienvenida al talento del extranjero. Los procesos simplificados de inmigración y el reclutamiento selectivo ayudarán a subsanar las principales lagunas en los conocimientos."
 SWE_moderaterna_2: "Reforma para un Suecia más fuerte"
 SWE_moderaterna_2_desc: "La agenda de reforma del Partido Moderado se basa en la libertad económica, la gobernanza responsable y la seguridad nacional. Con políticas audaces, dirigimos Suecia hacia la fuerza, estabilidad y prosperidad."
 SWE_kristdemokraterna: "Apoyar a los demócratas cristianos"
 SWE_kristdemokraterna_desc: "Los demócratas cristianos ofrecen una política basada en la dignidad humana, la responsabilidad y el cuidado de los más vulnerables. Con un enfoque en la familia, la fe y el desarrollo regional, tienen como objetivo reconstruir el tejido social de Suecia."
 SWE_kd_Family_values: "Fortalecer los valores familiares"
 SWE_kd_Family_values_desc: "La familia es la piedra angular de la sociedad. Al apoyar la elección parental, el matrimonio y la estabilidad a largo plazo, creamos un Suecia más fuerte y compasivo."
 SWE_kd_the_church_in_the_middle_of_society: "Poner la Iglesia en el Corazón de la Sociedad"
 SWE_kd_the_church_in_the_middle_of_society_desc: "La fe y la tradición son vitales para nuestra brújula moral. Al dar a la Iglesia y a las organizaciones religiosas un papel más fuerte, reconectamos con nuestro patrimonio espiritual."
 SWE_kd_swing_in_spendings: "Ajuste de las prioridades del gasto público"
 SWE_kd_swing_in_spendings_desc: "Debemos reorientar el gasto público hacia el bienestar social y el apoyo familiar. Al reordenar los presupuestos, aseguramos que los recursos vayan donde más se necesitan."
 SWE_kd_lower_taxes_for_families: "Menores impuestos para las familias"
 SWE_kd_lower_taxes_for_families_desc: "El aumento de una familia no debe ser una carga financiera. Al reducir los impuestos para los padres, especialmente aquellos con múltiples hijos, facilitamos el camino de la vida familiar."
 SWE_kd_improve_child_support: "Mejorar el apoyo a los niños"
 SWE_kd_improve_child_support_desc: "Los niños merecen el mejor comienzo posible en la vida. Aumentaremos los beneficios de los niños e invertiremos en programas de apoyo a la crianza de los hijos para asegurar que ningún niño se quede atrás."
 SWE_kd_reform_workspace: "Reforma del lugar de trabajo para las familias"
 SWE_kd_reform_workspace_desc: "Es más fácil equilibrar el trabajo y la familia. Apoyaremos horas flexibles, licencias parentales y un lugar de trabajo más humano que respete la vida familiar."
 SWE_kd_decentralisation: "Empuje para la descentralización"
 SWE_kd_decentralisation_desc: "Las comunidades locales conocen mejor sus necesidades. Al transferir el poder de los niveles nacional a regional, fortalecemos la democracia y la capacidad de respuesta local."
 SWE_kd_increase_safety_network: "Ampliar la red de seguridad social"
 SWE_kd_increase_safety_network_desc: "Una sociedad civilizada se ocupa de sus miembros más débiles. Reforzaremos las protecciones sociales para los ancianos, enfermos y discapacitados mediante iniciativas de asistencia social selectivas."
 SWE_kd_increase_private_healthcare: "Apoyo a la atención de salud privada"
 SWE_kd_increase_private_healthcare_desc: "La libertad de elección es esencial. Al ampliar el papel de los proveedores privados de atención médica, presentamos la competencia, reducir los tiempos de espera y mejorar la calidad general del cuidado."
 SWE_kd_regional_investments: "Invertir en las Regiones"
 SWE_kd_regional_investments_desc: "Deben abordarse las diferencias entre las zonas urbanas y rurales. A través de inversiones en salud, infraestructura y servicios en áreas rurales, revitalizamos a toda la nación."
 SWE_kristdemokraterna_2: "Una Suecia compasiva y estable"
 SWE_kristdemokraterna_2_desc: "Con una política arraigada en la dignidad y responsabilidad humana, los demócratas cristianos trabajan para construir un Suecia donde las familias prosperan, las comunidades florecen y nadie queda atrás."
 SWE_K_nationalize_major_industries: "Nacionalize Major Industries"
 SWE_K_nationalize_major_industries_desc: "Los medios de producción deben servir a la gente, no al beneficio privado. Los sectores clave, como la energía, el transporte y las telecomunicaciones, estarán bajo la propiedad pública para garantizar el control democrático y la sostenibilidad a largo plazo."
 SWE_Vansterpartiet: "Apoyar al Partido de Izquierda"
 SWE_Vansterpartiet_desc: "El Partido de Izquierda defiende la igualdad, los derechos de los trabajadores y una economía que trabaja para todos. Con nuestro apoyo, una nueva era política puede comenzar uno arraigado en la justicia y la solidaridad."
 SWE_K_increase_taxes: "Aumento de la tasación progresiva"
 SWE_K_increase_taxes_desc: "Una sociedad justa requiere que los que más contribuyen contribuyan. Incrementaremos impuestos sobre el capital y la riqueza para financiar servicios públicos y reducir la desigualdad."
 SWE_K_collectivice_housing_market: "Recopilar el Mercado de la Vivienda"
 SWE_K_collectivice_housing_market_desc: "La vivienda debe ser un derecho, no una mercancía. Al ampliar la vivienda pública y regular la propiedad privada, garantizaremos una vida asequible para todos."
 SWE_K_agrar_collectivism: "Colectivo Agrario"
 SWE_K_agrar_collectivism_desc: "Rural Suecia no debe dejarse atrás. Mediante iniciativas cooperativas de agricultura y apoyo estatal, potenciaremos a las comunidades locales y garantizaremos la seguridad alimentaria."
 SWE_K_workers_council: "Establecer Consejos de Trabajadores"
 SWE_K_workers_council_desc: "La democracia debe extenderse al lugar de trabajo. Mediante el establecimiento de consejos obreros elegidos, los empleados tendrán una influencia real sobre la gestión y las operaciones."
 SWE_K_abolish_state_religion: "Religión del Estado"
 SWE_K_abolish_state_religion_desc: "Suecia es una sociedad moderna y secular. Para garantizar la libertad religiosa y la neutralidad estatal, separaremos completamente la iglesia y el estado."
 SWE_K_free_state_services: "Ampliar los servicios públicos gratuitos"
 SWE_K_free_state_services_desc: "Desde la salud hasta la educación y el transporte, creemos en el acceso universal. Ampliar e invertir en servicios públicos gratuitos construirá una sociedad para muchos, no los pocos."
 SWE_K_increase_police: "Ampliación de la policía comunitaria"
 SWE_K_increase_police_desc: "La seguridad y la justicia van de la mano. Al aumentar los recursos para la policía orientada a la comunidad, abordaremos la delincuencia mediante la prevención, la rehabilitación y el apoyo social."
 SWE_communism_2: "Una sociedad socialista democrática"
 SWE_communism_2_desc: "Nuestras reformas no son el fin que son el comienzo de un nuevo modelo para la sociedad. El control democrático, la igualdad y la solidaridad nos guiarán en un futuro justo e inclusivo para todos los suecos."
 SWE_v_hold_the_red_line: "Sostenga la Línea Roja"
 SWE_v_hold_the_red_line_desc: "En tiempos de vacilación ideológica, debemos seguir comprometidos con nuestros principios. La línea roja representa nuestros valores socialistas, y no lo cruzaremos."
 SWE_v_the_left_divides: "La Izquierda divide"
 SWE_v_the_left_divides_desc: "La lucha interna ha asolado a la izquierda. Si queremos progresar, debemos reconocer nuestras divisiones y trabajar a través de ellas con unidad y respeto."
 SWE_v_modernize_the_left: "Modernizar la izquierda"
 SWE_v_modernize_the_left_desc: "Para mantenerse relevante en una sociedad que cambia rápidamente, la izquierda debe modernizarse: adoptar políticas verdes, nuevas tecnologías y valores sociales modernos."
 SWE_v_centralize_party_discipline: "Disciplina centralizada del Partido"
 SWE_v_centralize_party_discipline_desc: "Una parte unificada es una parte efectiva. Reforzando la disciplina del partido, aseguraremos cohesión, lealtad y mensajes consistentes."
 SWE_v_return_to_class_struggle: "Regresar a la lucha de clases"
 SWE_v_return_to_class_struggle_desc: "La base de nuestro movimiento es la lucha entre la clase obrera y las élites. Es hora de volver a esa misión central."
 SWE_v_Migration_weaken_wages: "La migración debilita los salarios"
 SWE_v_Migration_weaken_wages_desc: "Debemos reconocer las realidades económicas de las políticas transfronterizas. La migración no reglamentada puede suprimir los salarios y los sistemas de bienestar social, especialmente para los trabajadores en sectores vulnerables."
 SWE_v_embrace_feminist_workforce: "Abrace una fuerza de trabajo feminista"
 SWE_v_embrace_feminist_workforce_desc: "El feminismo y el socialismo van de la mano. Apoyaremos la igualdad de oportunidades, la licencia parental y las reformas estructurales para empoderar a las mujeres en el mercado laboral."
 SWE_v_Eco_socialist_developement_plan: "Plan de desarrollo Eco-Socialista"
 SWE_v_Eco_socialist_developement_plan_desc: "La sostenibilidad ambiental y la justicia social son inseparables. Nuestro plan invertirá en tecnologías ecológicas y priorizará a los trabajadores y comunidades."
 SWE_v_progressive_public_sector: "Sector público progresivo"
 SWE_v_progressive_public_sector_desc: "El sector público debe estar en el centro de la innovación y la igualdad. Ampliaremos y modernizaremos el servicio a todos los ciudadanos de manera efectiva."
 SWE_v_expropriate_the_exploiters: "Expropiar a los explotadores"
 SWE_v_expropriate_the_exploiters_desc: "Aquellos que se beneficien de la espalda de los trabajadores ya no lo harán descontrolado. Reclamaremos riqueza y recursos para la gente."
 SWE_v_command_economic_revival: "Comando Economic Revival"
 SWE_v_command_economic_revival_desc: "Mediante la planificación central y la inversión dirigida, reactivaremos las industrias, crearemos empleos y guiaremos a la economía hacia resultados equitativos."
 SWE_v_nationalize_efforts: "Nacionalizar los esfuerzos"
 SWE_v_nationalize_efforts_desc: "Los sectores clave deben estar bajo control democrático. La nacionalización garantiza que las industrias vitales sirvan al bien público en lugar de a los beneficios privados."
 SWE_v_support_urban_pluralism: "Apoyo al pluralismo urbano"
 SWE_v_support_urban_pluralism_desc: "Diversas comunidades urbanas son la columna vertebral de la sociedad progresista. Apoyaremos el pluralismo cultural, los servicios públicos y la vivienda accesible."
 SWE_K_reafirm_welfare: "Reafirmar el Estado de Bienestar"
 SWE_K_reafirm_welfare_desc: "El bienestar no es un lujo. Es un derecho. Resistiremos a la privatización y fortaleceremos nuestra red de seguridad universal para las generaciones venideras."
 SWE_v_high_income_redistribtion: "Redistribución de alto ingreso"
 SWE_v_high_income_redistribtion_desc: "La riqueza extrema debe ser redistribuida para crear una sociedad más justa. Los límites de impuestos y riqueza progresivos son herramientas vitales en este esfuerzo."
 SWE_v_agrar_reforms: "Reformas agrarias"
 SWE_v_agrar_reforms_desc: "Las zonas rurales no deben dejarse atrás. Invertiremos en cooperativas, agricultura sostenible y acceso a la tierra para los pequeños agricultores."
 SWE_v_five_year_plan: "Plan quinquenal"
 SWE_v_five_year_plan_desc: "Un plan a largo plazo dirigido por el Estado guiará las prioridades económicas, sociales y ecológicas con objetivos claramente definidos y un progreso públicamente responsable."
 SWE_v_regulation_over_nationalization: "Reglamento sobre la nacionalización"
 SWE_v_regulation_over_nationalization_desc: "No todos los sectores privados deben ser incautados. Mediante una regulación estricta, podemos alcanzar objetivos sociales sin la nacionalización inmediata."
 SWE_miljopartiet: "El Partido Verde"
 SWE_miljopartiet_desc: "Nacido de los movimientos antinucleares y ambientales de finales del siglo XX, Miljöpartiet de gröna pretende llevar a Suecia a un futuro sostenible, inclusivo y democrático. A medida que la crisis climática se acelera y crecen las divisiones sociales, creemos que Suecia debe actuar como pionera mundial en energía renovable, economía ecológica e innovación verde. Guiados por sabiduría ecológica, justicia social y democracia popular, trabajaremos para una nación que respete tanto la naturaleza como la humanidad. Es hora de pensar a largo plazo: para nuestros hijos, nuestro planeta y toda la vida."
 SWE_g_green_movement_first: "Movimiento Verde Primero"
 SWE_g_green_movement_first_desc: "Nuestras raíces se encuentran en activismo y ambientalismo. Debemos permanecer fieles a nuestro movimiento ante cualquier otra cosa."
 SWE_g_pragmatic_policy: "Política pragmática"
 SWE_g_pragmatic_policy_desc: "El cambio real requiere compromiso. Al abrazar el pragmatismo, podemos implementar nuestra visión paso a paso."
 SWE_ban_fossil_subsidies: "Prohibir subsidios de combustible fósil"
 SWE_ban_fossil_subsidies_desc: "Subvencionar combustibles fósiles contradice nuestros objetivos ambientales. Pondremos fin a estos subsidios y reorientaremos los fondos hacia la sostenibilidad."
 SWE_g_greenlabor_market_strategy: "Estrategia del mercado de trabajo verde"
 SWE_g_greenlabor_market_strategy_desc: "Necesitamos una fuerza de trabajo que prospere en la economía verde. Esta estrategia apoya la capacitación, la transición y la innovación en los sectores conscientes del clima."
 SWE_g_enviremental_tax: "Reforma fiscal ambiental"
 SWE_g_enviremental_tax_desc: "Implementaremos un sistema tributario que recompensa la sostenibilidad y responsabiliza a los contaminadores."
 SWE_g_enviremental_agriculture: "El medio ambiente"
 SWE_g_enviremental_agriculture_desc: "La agricultura debe ser sostenible y productiva. Apoyaremos la agricultura ecológica y la biodiversidad."
 SWE_g_broad_enviremental_agenda: "Programa sobre el Medio Ambiente"
 SWE_g_broad_enviremental_agenda_desc: "Desde la calidad del aire hasta los océanos, desde la silvicultura hasta la energía, nuestras políticas abordan cada faceta de la crisis ambiental."
 SWE_g_parlamrntary_profesionalism: "Profesional Parlamentario"
 SWE_g_parlamrntary_profesionalism_desc: "Para promulgar una reforma real, debemos ser considerados como competentes y serios en el ámbito político."
 SWE_g_tax_incentives_for_gren_innovation: "Incentivos fiscales para la innovación verde"
 SWE_g_tax_incentives_for_gren_innovation_desc: "Apoyaremos a las startups y empresas establecidas que invierten en tecnología limpia a través de recortes fiscales específicos y apoyo."
 SWE_g_cultural_autonomy_and_diversity: "Autonomía cultural y diversidad"
 SWE_g_cultural_autonomy_and_diversity_desc: "El medio ambiente y los derechos humanos están vinculados. Aceptamos la diversidad y la autonomía de todas las comunidades dentro de Suecia."
 SWE_g_green_municipal_innovation_hubs: "Centros de innovación municipales verdes"
 SWE_g_green_municipal_innovation_hubs_desc: "Las ciudades y las ciudades liderarán el camino en la política climática mediante la innovación impulsada localmente, con el apoyo de la financiación nacional."
 SWE_g_Renewable_vision: "Visión renovable"
 SWE_g_Renewable_vision_desc: "Una Suecia 100% renovable está a su alcance. Estableceremos metas ambiciosas y crearemos una hoja de ruta para lograrlas."
 SWE_g_inclusive_migation_policy: "Política migratoria inclusiva"
 SWE_g_inclusive_migation_policy_desc: "La sostenibilidad incluye la dignidad humana. Nuestra política migratoria será inclusiva, ética y centrada en la integración."
 SWE_g_ecological_feminism_as_core: "El feminismo ecológico como núcleo"
 SWE_g_ecological_feminism_as_core_desc: "Reconocemos que las cuestiones ambientales y la igualdad entre los géneros están profundamente interconectadas. Los valores feministas guiarán nuestras políticas ecológicas."
 SWE_g_circular_economy_polices: "Políticas de economía circular"
 SWE_g_circular_economy_polices_desc: "No desperdicies nada. Reutilizar todo. La economía circular no es sólo una opción. Es nuestro único camino sostenible hacia adelante."
 SWE_g_green_startup_heaven: "Paraíso de las startups verdes"
 SWE_g_green_startup_heaven_desc: "Suecia se convertirá en el país de destino para los empresarios conscientes del clima mediante subvenciones, infraestructura y visibilidad mundial."
 SWE_g_Suits_and_Birkenstocks: "Trajes y Birkenstocks"
 SWE_g_Suits_and_Birkenstocks_desc: "Un movimiento verde moderno combina ideales de base con la ejecución profesional. Estamos listos para liderar en el parlamento y en la calle."
 SWE_s_the_classic_welfare_model: "El modelo de bienestar clásico"
 SWE_s_the_classic_welfare_model_desc: "Reafirmaremos nuestro compromiso con el estado de bienestar sueco, un modelo admirado mundialmente por su igualdad, salud, educación y estabilidad económica."
 SWE_s_the_reform_welfare_model: "Reforma del modelo de bienestar"
 SWE_s_the_reform_welfare_model_desc: "A medida que la sociedad evoluciona, también debe nuestro sistema de bienestar. Modernizaremos la estructura manteniendo al mismo tiempo los valores fundamentales de solidaridad y apoyo."
 SWE_s_progressive_tax_system_renewal: "Renovación del Sistema Fiscal Progresivo"
 SWE_s_progressive_tax_system_renewal_desc: "Para garantizar la financiación del bienestar sostenible, renovaremos el sistema tributario con políticas progresivas orientadas a la equidad y la redistribución."
 SWE_s_open_border: "Frontera abierta"
 SWE_s_open_border_desc: "Aceptamos la apertura. Al acoger a los recién llegados, Suecia enriquece su mercado laboral, la vida cultural y el perfil internacional."
 SWE_s_Labor_oriented_migration: "Migración orientada al trabajo"
 SWE_s_Labor_oriented_migration_desc: "Formaremos la política migratoria para satisfacer las necesidades del mercado laboral, asegurando la integración y utilidad económica."
 SWE_s_digital_welfare_service: "Servicios de Bienestar Digital"
 SWE_s_digital_welfare_service_desc: "El futuro es digital. Mediante la modernización de los servicios sociales, mejoramos el acceso, reducimos la burocracia y aumentamos la eficiencia."
 SWE_s_Gender_equality_for_economics: "Igualdad entre los géneros en la economía"
 SWE_s_Gender_equality_for_economics_desc: "La política económica debe empoderar a todos. Eliminaremos la desigualdad estructural y promoveremos la agencia económica de las mujeres."
 SWE_s_invest_in_futur_schooling: "Invertir en la futura escolarización"
 SWE_s_invest_in_futur_schooling_desc: "La educación es la clave para el futuro. Invertiremos en escuelas, maestros y estudiantes para asegurar la prosperidad a largo plazo."
 SWE_s_labor_union_priority: "Sindicato Prioridad"
 SWE_s_labor_union_priority_desc: "Los sindicatos fuertes son esenciales para condiciones de trabajo justas. Protegeremos y priorizaremos los derechos de negociación colectiva."
 SWE_s_independend_labor_policy: "Política laboral independiente"
 SWE_s_independend_labor_policy_desc: "Debemos mantener el control nacional sobre los estándares y regulaciones laborales, incluso en medio del cambio global."
 SWE_s_centralizion_efforts: "Actividades de centralización"
 SWE_s_centralizion_efforts_desc: "Nos proponemos simplificar las funciones estatales y reducir la fragmentación mediante iniciativas centrales de gobernanza."
 SWE_s_force_renewable_energy: "Energía renovable"
 SWE_s_force_renewable_energy_desc: "La crisis climática exige una acción atrevida. Transiremos rápidamente a las fuentes de energía renovable en toda la nación."
 SWE_s_liberalize_the_energy_market: "Liberalizar el mercado energético"
 SWE_s_liberalize_the_energy_market_desc: "Al abrir el sector energético a la competencia y la innovación, reduciremos los costos y aumentaremos la eficiencia."
 SWE_s_international_recruitment_agreements: "Acuerdos de Contratación Internacional"
 SWE_s_international_recruitment_agreements_desc: "Firmaremos acuerdos para atraer a profesionales internacionales y apoyar sectores necesitados de mano de obra calificada."
 SWE_s_the_renewed_social_democrazy: "La Democracia Social Renovada"
 SWE_s_the_renewed_social_democrazy_desc: "Combinando la tradición del bienestar con la innovación, forjamos una nueva era de democracia social: sostenible, inclusiva y futura."
 SWE_c_green_opening: "La apertura verde"
 SWE_c_green_opening_desc: "Abriremos nuestra plataforma centrista a valores verdes, con el objetivo de unir el medio ambiente con innovación, pragmatismo y potenciación local."
 SWE_c_envirementalism_as_identity: "Ambientalismo como identidad"
 SWE_c_envirementalism_as_identity_desc: "Los valores ambientales serán el centro de nuestra identidad política, definiendo nuestras prioridades y políticas en todos los sectores."
 SWE_c_support_cooperative_and_local_economy: "Apoyo Economía Cooperativa y Local"
 SWE_c_support_cooperative_and_local_economy_desc: "Promoveremos el localismo y las empresas cooperativas para crear economías resilientes, democráticas y comunitarias."
 SWE_c_highschool_reforms: "Reformas de la secundaria"
 SWE_c_highschool_reforms_desc: "La educación moderna es clave para la sostenibilidad y la innovación. Reformaremos el sistema escolar para centrarse en el pensamiento crítico y la conciencia ecológica."
 SWE_c_labor_market_deregulation: "Desregulación del mercado laboral"
 SWE_c_labor_market_deregulation_desc: "Reduciremos las cargas reglamentarias del mercado laboral para promover el empleo, la iniciativa empresarial y la flexibilidad."
 SWE_c_decentralize_welfare: "Descentralizar el bienestar"
 SWE_c_decentralize_welfare_desc: "Para satisfacer mejor las necesidades locales, descentralizaremos los sistemas sociales y potenciaremos a los municipios con mayor responsabilidad."
 SWE_c_human_centered_migration_policy: "Política migratoria centrada en el ser humano"
 SWE_c_human_centered_migration_policy_desc: "Implementaremos una política migratoria basada en la dignidad, la integración y la contribución social a largo plazo."
 SWE_c_reaffirm_the_agrarian_legacy: "Reaffirm el Legado Agrario"
 SWE_c_reaffirm_the_agrarian_legacy_desc: "Rural Suecia es la columna vertebral de nuestro patrimonio. Protegeremos la agricultura, los pequeños agricultores y el uso tradicional de la tierra."
 SWE_c_expand_green_energy: "Ampliar la energía verde"
 SWE_c_expand_green_energy_desc: "Para combatir el cambio climático y construir una economía resiliente, invertiremos fuertemente en fuentes de energía limpias y renovables."
 SWE_c_digital_infrastructure: "Infraestructura digital"
 SWE_c_digital_infrastructure_desc: "Hay que conectar una sociedad moderna y verde. Construiremos una infraestructura digital robusta para apoyar la innovación y la igualdad."
 SWE_c_champion_small_businesses_and_start_up: "Champion Small Businesss and Start-Ups"
 SWE_c_champion_small_businesses_and_start_up_desc: "Alimentaremos el emprendimiento y la innovación eliminando la cinta roja y ofreciendo apoyo específico a pequeñas empresas."
 SWE_c_privatisation_of_public_service: "Privatización de la función pública"
 SWE_c_privatisation_of_public_service_desc: "La eficiencia y la innovación en la prestación de servicios pueden lograrse mediante la introducción de mecanismos de mercado en el sector público."
 SWE_c_tax_cut_for_innovation: "Cortes fiscales para la innovación"
 SWE_c_tax_cut_for_innovation_desc: "La innovación merece recompensa. Reduciremos los impuestos sobre avances ecológicos y tecnológicos para acelerar el crecimiento y la sostenibilidad."
 SWE_c_green_centrist_identity: "Identidad centrista verde"
 SWE_c_reach_into_the_cities: "Llegar a las ciudades"
 SWE_c_reach_into_the_cities_desc: "Urban Sweden está cambiando. Nos comprometeremos con las comunidades metropolitanas para ampliar nuestro apoyo y defender una política urbana verde e inclusiva."
 SWE_c_Liberal_centrist_identity: "Identidad centrista liberal"
 SWE_c_Liberal_centrist_identity_desc: "El liberalismo, la tecnología y la modernización verde definirán nuestra plataforma centrista para el siglo XXI."
 SWE_c_modernice_patry_identity: "Modernizar la identidad del partido"
 SWE_c_modernice_patry_identity_desc: "Para mantenerse relevantes en un mundo cambiante, actualizaremos la identidad de nuestro partido, abrazando una visión moderna, abierta y ecológica."
 SWE_fp_social_liberal_ways: "Formas sociales liberales"
 SWE_fp_social_liberal_ways_desc: "Vamos a trazar un curso que combina la libertad individual con la responsabilidad social. El liberalismo social será nuestra filosofía rectora."
 SWE_fp_defend_liberal_values: "Defender valores liberales"
 SWE_fp_defend_liberal_values_desc: "En una era de turbulencia política, es vital salvaguardar la democracia liberal, el pluralismo y el estado de derecho."
 SWE_fp_liberal_renewal: "Renovación liberal"
 SWE_fp_liberal_renewal_desc: "El liberalismo debe evolucionar para enfrentar nuevos desafíos. Renovaremos nuestra ideología con una agenda orientada hacia el futuro, basada en la justicia y la igualdad."
 SWE_fp_migartion_into_workforce: "Migración en la fuerza de trabajo"
 SWE_fp_migartion_into_workforce_desc: "Integraremos a los migrantes en el mercado laboral para fortalecer la productividad económica y la cohesión social."
 SWE_fp_dutys_for_citizenship: "Funciones para la ciudadanía"
 SWE_fp_dutys_for_citizenship_desc: "La ciudadanía implica derechos, pero también responsabilidades. Promoveremos la educación cívica y la integración mediante el compromiso mutuo."
 SWE_fp_performance_principle: "El Principio de Ejecución"
 SWE_fp_performance_principle_desc: "Creemos en recompensar el mérito y el esfuerzo, y reformaremos los servicios públicos y la educación en torno al desempeño y la rendición de cuentas."
 SWE_fp_defend_press_freedom: "Defender la libertad de prensa"
 SWE_fp_defend_press_freedom_desc: "Una prensa libre es una piedra angular de la democracia. Lo defenderemos de la interferencia estatal y el monopolio del mercado."
 SWE_fp_increase_parlamentarian_controll: "Aumento del control parlamentario"
 SWE_fp_increase_parlamentarian_controll_desc: "El Parlamento debe supervisar el poder ejecutivo. Fortaleceremos la transparencia y la rendición de cuentas democrática."
 SWE_fp_increase_individual_freedom: "Aumentar la libertad individual"
 SWE_fp_increase_individual_freedom_desc: "Promoveremos políticas que amplíen la autonomía individual, expresión y opciones de estilo de vida."
 SWE_fp_school_as_core_of_state_responsibility: "Escuela como núcleo de la responsabilidad del Estado"
 SWE_fp_school_as_core_of_state_responsibility_desc: "La educación es un bien público. El estado garantizará que todos los estudiantes reciban una educación equitativa y de alta calidad."
 SWE_fp_early_performance_assessment: "Evaluación de los resultados iniciales"
 SWE_fp_early_performance_assessment_desc: "Presentaremos evaluaciones tempranas para identificar las necesidades de los estudiantes y mejorar los resultados académicos."
 SWE_fp_Expand_elite_schools: "Ampliar las escuelas de élite"
 SWE_fp_Expand_elite_schools_desc: "Apoyaremos el desarrollo de escuelas de élite para fomentar la excelencia y el liderazgo en la educación."
 SWE_fp_education_as_eco_investment: "Educación como inversión económica"
 SWE_fp_education_as_eco_investment_desc: "La educación no es un costo, sino una inversión estratégica. Financiaremos escuelas, universidades e investigación generosamente."
 SWE_fp_social_startups: "Apoyo Social Startups"
 SWE_fp_social_startups_desc: "Fomentaremos el emprendimiento con un propósito social apoyando a las startups innovadoras que se ocupan de los desafíos públicos."
 SWE_fp_social_market_economy: "Economía del mercado social"
 SWE_fp_social_market_economy_desc: "Adoptaremos un modelo que equilibra los principios del libre mercado con fuertes protecciones sociales y competencia justa."
 SWE_fp_expand_equality: "Ampliación de la igualdad"
 SWE_fp_expand_equality_desc: "Nos proponemos reducir las desigualdades sociales mediante reformas específicas, instituciones inclusivas y medidas afirmativas."
 SWE_fp_protect_fundamental_digital_rights: "Proteger los derechos digitales fundamentales"
 SWE_fp_protect_fundamental_digital_rights_desc: "La libertad debe extenderse al ciberespacio. Defendemos la privacidad, la expresión y el acceso digital como derechos fundamentales."
 SWE_fp_decrease_surveillance: "Disminución de la vigilancia"
 SWE_fp_decrease_surveillance_desc: "La vigilancia masiva socava la democracia. Volveremos a hacer un seguimiento excesivo y restauraremos las libertades civiles."
 SWE_fp_mandatory_swedish_language_instruction: "Instrucción obligatoria del idioma sueco"
 SWE_fp_mandatory_swedish_language_instruction_desc: "Un lenguaje compartido es clave para la integración. Mandaremos instrucción sueca para todos los residentes."
 SWE_fp_police_as_guardian_of_law: "Policía como Guardián de la ley"
 SWE_fp_police_as_guardian_of_law_desc: "La policía debe proteger a los ciudadanos y respetar la ley de manera imparcial. Invertiremos en capacitación, transparencia y confianza."
 SWE_fp_expansion_of_digital_surveillance: "Expansión de Vigilancia Digital"
 SWE_fp_expansion_of_digital_surveillance_desc: "Para contrarrestar las amenazas cibernéticas y garantizar la seguridad nacional, ampliaremos las capacidades de vigilancia digital con supervisión."
 SWE_m_social_cuts: "Implementar cortes sociales"
 SWE_m_social_cuts_desc: "Para garantizar la sostenibilidad económica, reduciremos los gastos sociales y promoveremos la responsabilidad individual respecto de la dependencia del bienestar."
 SWE_m_privatisation_state_property: "Privatiza la propiedad estatal"
 SWE_m_privatisation_state_property_desc: "privatizaremos las empresas estatales para aumentar la eficiencia, promover la competencia y reducir la deuda pública."
 SWE_m_cut_taxes: "Impuestos de corte"
 SWE_m_cut_taxes_desc: "La reducción de los impuestos sobre el trabajo y la empresa revitalizará la economía, estimulará la creación de empleos e iniciativas de recompensa."
 SWE_m_law_and_order: "Ley y Orden"
 SWE_m_law_and_order_desc: "Una sociedad segura es una sociedad libre. Invertiremos en la aplicación de la ley y aplicaremos medidas más severas contra la delincuencia."
 SWE_m_attract_statr_up: "Atraer Start-Ups"
 SWE_m_attract_statr_up_desc: "Crearemos un entorno favorable a las empresas para atraer y apoyar start-ups innovadores en todo el país."
 SWE_m_attract_investor: "Atraer inversores"
 SWE_m_attract_investor_desc: "Mediante la desregulación y los incentivos fiscales, convertiremos a Suecia en un destino atractivo tanto para inversores nacionales como extranjeros."
 SWE_m_reform_social_state: "Reforma del Estado de Bienestar"
 SWE_m_reform_social_state_desc: "El sistema de bienestar social debe reformarse para centrarse en los más necesitados, reduciendo las ineficiencias y la dependencia a largo plazo."
 SWE_m_liberalice_workspace: "Liberalizar el lugar de trabajo"
 SWE_m_liberalice_workspace_desc: "Al eliminar las regulaciones rígidas del mercado laboral, aumentaremos la flexibilidad, productividad y empleo."
 SWE_m_Arbetslinjen: "La línea de trabajo"
 SWE_m_Arbetslinjen_desc: "El trabajo siempre debe pagar más que el bienestar. Implementaremos reformas que incentivan el empleo sobre los beneficios."
 SWE_m_infrastructure_subventions: "Subvenciones de infraestructura"
 SWE_m_infrastructure_subventions_desc: "La inversión pública dirigida en infraestructura impulsará el desarrollo regional y permitirá el crecimiento del sector privado."
 SWE_m_increase_energy_production: "Aumento de la producción de energía"
 SWE_m_increase_energy_production_desc: "Ampliaremos la producción energética para asegurar el suministro, reducir los precios y apoyar la competitividad industrial."
 SWE_m_reduce_public_tax: "Reducir los impuestos públicos"
 SWE_m_reduce_public_tax_desc: "Reduciremos la carga fiscal general para empoderar a los ciudadanos, estimular la demanda y impulsar la actividad económica."
 SWE_m_improve_migration_and_education: "Mejorar la migración y la educación"
 SWE_m_improve_migration_and_education_desc: "Una mejor integración mediante la educación y la adquisición de idiomas garantizará que los migrantes contribuyan significativamente a la sociedad."
 SWE_m_cut_public_spendings: "Cortar gasto público"
 SWE_m_cut_public_spendings_desc: "Reduciremos los gastos estatales innecesarios para equilibrar el presupuesto y fomentar la estabilidad económica a largo plazo."
 SWE_m_support_start_ups: "Soporte Inicio-Ups"
 SWE_m_support_start_ups_desc: "Brindaremos apoyo estratégico a los empresarios mediante subvenciones, burocracia simplificada y programas de redes."
 SWE_m_liberal_eco_way: "Un camino económico liberal"
 SWE_m_liberal_eco_way_desc: "Creemos en una economía liberal donde el mercado impulsa el crecimiento y la innovación, apoyada por un sector público racionalizado."
 SWE_m_modernized_liberalism: "Liberalismo modernizado"
 SWE_m_modernized_liberalism_desc: "Nuestra ideología evolucionará para hacer frente a los desafíos del siglo XXI, equilibrando la libertad personal con una gobernanza eficiente y una economía dinámica."
 SWE_kd_deregulate_workspace: "Desregular el lugar de trabajo"
 SWE_kd_deregulate_workspace_desc: "Nos proponemos restaurar la flexibilidad en el mercado laboral reduciendo la sobreregulación y promoviendo la cooperación entre empleadores y empleados."
 SWE_kd_traditional_values_in_education: "Valores tradicionales en la educación"
 SWE_kd_traditional_values_in_education_desc: "Nuestras escuelas no deben enseñar habilidades, sino también reforzar valores atemporales como el respeto, la disciplina y la responsabilidad."
 SWE_kd_KKK_Kyrka_Kullar_Kastruller: "Kyrka, Kullar, Kastruller"
 SWE_kd_KKK_Kyrka_Kullar_Kastruller_desc: "Fe, familia y hogar. Reafirmamos nuestro compromiso con las piedras angulares de una sociedad sana: la Iglesia, la Familia y el Corazón."
 SWE_kd_privatisation_in_healthcare: "Privatiza los servicios sanitarios"
 SWE_kd_privatisation_in_healthcare_desc: "Un sistema sanitario diversificado, incluyendo alternativas privadas, impulsará la calidad a través de la competencia preservando al mismo tiempo el acceso para todos."
 SWE_kd_decentralice_education: "Educación descentralizada"
 SWE_kd_decentralice_education_desc: "Creemos en dar a las comunidades locales y los padres más control sobre la educación de sus hijos."
 SWE_kd_working_migration: "Migración basada en el trabajo"
 SWE_kd_working_migration_desc: "Nuestra política migratoria debe hacer hincapié en la responsabilidad, centrándose en las personas que contribuyen a la sociedad mediante el trabajo."
 SWE_kd_values_bevor_work: "Valores antes de la fuerza de trabajo"
 SWE_kd_values_bevor_work_desc: "Una sociedad sana debe priorizar los valores compartidos y la integración cultural sobre la utilidad económica pura."
 SWE_kd_more_state_care: "Apoyo a la atención y el bienestar"
 SWE_kd_more_state_care_desc: "Fortaleceremos el apoyo a las familias, los cuidadores y los necesitados mediante un sistema de bienestar compasivo y funcional."
 SWE_kd_voluntary_for_honor: "Honor a través del servicio voluntario"
 SWE_kd_voluntary_for_honor_desc: "El deber cívico y el voluntariado construyen comunidad y carácter. Promoveremos el servicio voluntario como contribución noble de la sociedad."
 SWE_kd_fight_paralel_society: "Combatir Sociedades paralelas"
 SWE_kd_fight_paralel_society_desc: "Para proteger la unidad nacional, actuaremos contra comunidades aisladas y aseguraremos que se mantengan normas democráticas comunes en toda la sociedad."
 SWE_kd_increase_parental_rights: "Incrementar los derechos de los padres"
 SWE_kd_increase_parental_rights_desc: "Los padres deben tener el papel principal en la crianza de sus hijos. Ampliaremos sus derechos en educación, salud y bienestar."
 SWE_kd_decentralice_social_services: "Descentralizar los servicios sociales"
 SWE_kd_decentralice_social_services_desc: "Las autoridades locales conocen mejor a sus ciudadanos. Cambiaremos la responsabilidad de los servicios sociales más cerca de los que sirven."
 SWE_kd_benefits_for_voluntary_service: "Beneficios del Servicio Voluntario"
 SWE_kd_benefits_for_voluntary_service_desc: "Los voluntarios deben ser reconocidos. Ofrecemos beneficios a individuos que dan su tiempo para servir a otros."
 SWE_kd_regional_investment: "Invertir en las Regiones"
 SWE_kd_regional_investment_desc: "Invertiremos en Suecia rural y regional para reducir la desigualdad, mejorar el acceso y apoyar las economías y tradiciones locales."
 SWE_modern_issues: "Abordar las cuestiones modernas"
 SWE_modern_issues_desc: "Suecia está en una encrucijada. Desde cambios demográficos hasta disturbios urbanos, ha llegado el momento de enfrentar los desafíos del siglo XXI con la acción política audaz."
 SWE_sverigedemokraterna: "Apoyar a los demócratas suecos"
 SWE_sverigedemokraterna_desc: "Los demócratas suecos defienden el nacionalismo, la cohesión cultural y el retorno a los valores tradicionales. Al apoyarlos, cambiamos el enfoque para proteger la identidad sueca."
 SWE_sd_folkhemmet: "Restaurar el Folkhemmet"
 SWE_sd_folkhemmet_desc: "La visión del Folkhemmet una sociedad cohesiva donde todos los ciudadanos son parte de la familia nacional debe ser renovada. Reconstruiremos una Suecia que proteja a la suya."
 SWE_sd_reduce_immigration: "Reducir drásticamente la inmigración"
 SWE_sd_reduce_immigration_desc: "La actual política de inmigración es insostenible. Para preservar la cultura y seguridad de Suecia, debemos imponer limitaciones estrictas y recuperar el control completo sobre nuestras fronteras."
 SWE_sd_clean_the_ghettos: "Reclamar los Suburbios"
 SWE_sd_clean_the_ghettos_desc: "La falta de ley y las sociedades paralelas no pueden tolerarse. Un esfuerzo centrado para desmantelar las redes criminales y reintegrar áreas problemáticas restaurará la unidad nacional."
 SWE_sd_traditional_families: "Promover los valores familiares tradicionales"
 SWE_sd_traditional_families_desc: "Una sociedad estable está construida sobre familias fuertes. Al fomentar los valores tradicionales y oponerse a los experimentos sociales modernos, refuerzamos nuestra fundación cultural."
 SWE_sd_increase_police_resources: "Fondo de la Policía"
 SWE_sd_increase_police_resources_desc: "Nuestras fuerzas policiales están insuficientemente financiadas y sobrecargadas. Es hora de ampliar sus números, actualizar el equipo y restablecer la ley y el orden en Suecia."
 SWE_sd_ban_islam: "Prohibir el Islam radical"
 SWE_sd_ban_islam_desc: "El islam radical representa una amenaza para los valores y la seguridad suecos. Con una acción decisiva, prohibiremos las organizaciones extremistas y protegeremos a los ciudadanos del extremismo ideológico."
 SWE_sd_patriotism: "Revive patriotismo sueco"
 SWE_sd_patriotism_desc: "Debemos recordar a nuestros ciudadanos lo que significa ser sueco. A través de la educación, las iniciativas culturales y el orgullo nacional, fortaleceremos nuestra identidad compartida."
 SWE_sverigedemokraterna_2: "A Suecia para los suecos"
 SWE_sverigedemokraterna_2_desc: "Con nuestras fronteras seguras, nuestra cultura protegida y nuestras instituciones renovadas, ahora nos centramos en reconstruir una Suecia fuerte, unida y soberana para las generaciones venideras."
 SWE_sd_the_family: "La Familia como Fundación"
 SWE_sd_the_family_desc: "Fortaleceremos las estructuras familiares tradicionales como piedra angular de una sociedad sana, haciendo hincapié en las responsabilidades y los valores nacionales."
 SWE_sd_ban_hijab: "Prohibir el Hijab"
 SWE_sd_ban_hijab_desc: "Las prendas religiosas que simbolizan la opresión no tienen lugar en la vida pública sueca. El hijab será prohibido en escuelas e instituciones gubernamentales."
 SWE_sd_the_swedish_workforce: "Facultar a la fuerza de trabajo sueca"
 SWE_sd_the_swedish_workforce_desc: "Se dará prioridad a los suecos nativos en el empleo, la formación profesional y los programas de bienestar, reduciendo la dependencia del trabajo extranjero."
 SWE_sd_the_State_of_sverige: "El Estado de Sverige"
 SWE_sd_the_State_of_sverige_desc: "Construiremos un estado fuerte y soberano que refleje la voluntad y las tradiciones del pueblo sueco, con autoridad centralizada y orgullo nacional."
 SWE_sd_tradition_and_tolerance: "Tradición y tolerancia"
 SWE_sd_tradition_and_tolerance_desc: "Suecia debe redescubrir sus raíces patrimonio cultural, valores comunes y cohesión social. Toleramos la diversidad que respeta la tradición sueca."
 SWE_sd_ban_lgbtq: "Prohibición de la promoción LGBTQ"
 SWE_sd_ban_lgbtq_desc: "El estado ya no financiará ni apoyará la promoción LGBTQ en escuelas o medios de comunicación. Los niños merecen un ambiente neutral arraigado en la biología y la tradición."
 SWE_sd_only_skilled_workforce: "Sólo la migración hábil"
 SWE_sd_only_skilled_workforce_desc: "La inmigración se limitará a las personas con aptitudes necesarias urgentemente en Suecia. A todos los demás se les negará la entrada o el apoyo."
 SWE_sd_autonom_regions: "Límite de las Regiones Autónomas"
 SWE_sd_autonom_regions_desc: "Ninguna región actuará fuera de los valores de la nación. La autonomía local se curará cuando socava la integración o la unidad nacional."
 SWE_sd_stop_migration: "Para la migración"
 SWE_sd_stop_migration_desc: "Pondremos fin a toda inmigración no esencial para restablecer el control, garantizar la seguridad y reintegrar la cultura sueca en la vida cotidiana."
 SWE_sd_central_power: "Centralizar el poder"
 SWE_sd_central_power_desc: "Para aplicar eficazmente las reformas nacionales, concentraremos el poder político en manos del Estado y reduciremos la obstrucción regional."
 SWE_sd_Lebensbaum: "El Árbol de la Vida"
 SWE_sd_Lebensbaum_desc: "Plantaremos las semillas de una sueca orgullosa y duradera arraigada en la tradición, la unidad y la defensa de nuestra patria."
 SWE_sd_the_economy: "Garantizar la Economía Nacional"
 SWE_sd_the_economy_desc: "La economía sueca debe servir primero a sus ciudadanos. Lo reorientaremos hacia la resiliencia nacional y una menor dependencia de los mercados mundiales."
 SWE_sd_the_security: "Restaurar la seguridad nacional"
 SWE_sd_the_security_desc: "La seguridad es la base de una nación fuerte. Invertimos en las fuerzas militares, fronterizas y policiales para proteger a nuestro pueblo."
 SWE_sd_the_social: "Preserve el tejido social"
 SWE_sd_the_social_desc: "Nos proponemos restaurar una sociedad unificada y moral. Se salvaguardarán las normas culturales y se eliminarán las influencias dañinas."
 SWE_sd_the_future: "Visión para el futuro"
 SWE_sd_the_future_desc: "El futuro de Suecia reside en la tradición, la tecnología y el orgullo nacional. Formaremos una nación de la que nuestros descendientes estarán orgullosos."
 SWE_sd_protect_traditions: "Protege nuestras tradiciones"
 SWE_sd_protect_traditions_desc: "Defenderemos las vacaciones suecas, las costumbres y el lenguaje de influencia extranjera. El orgullo nacional comienza con la preservación cultural."
 SWE_Western_focus: "Alinear con Occidente"
 SWE_Western_focus_desc: "Suecia debe fortalecer sus vínculos con los poderes occidentales, asegurando que nuestros valores se ajusten al mundo democrático. Al profundizar la cooperación diplomática, militar y económica, solidificamos nuestro papel como miembro clave del bloque occidental."
 SWE_EU_continental_commitment: "Compromiso continental"
 SWE_EU_continental_commitment_desc: "Suecia profundiza su compromiso con la arquitectura europea de seguridad e innovación. Nuestro futuro no está en espléndido aislamiento, sino en responsabilidad compartida y fuerza coordinada."
 SWE_EU_visit_buckingham: "Visita estatal a Buckingham"
 SWE_EU_visit_buckingham_desc: "Si bien Gran Bretaña ha dejado la UE, sus vínculos culturales y de seguridad con Suecia siguen siendo profundos. Una visita estatal reafirma el respeto mutuo y abre canales discretos para la alineación futura."
 SWE_EU_renew_stockholm_berlin_axis: "Renovar el eje de Estocolmo–Berlín"
 SWE_EU_renew_stockholm_berlin_axis_desc: "Berlín y Estocolmo pueden formar una columna vertebral para moderación europea, resiliencia e innovación. Este eje estratégico fortalece la diplomacia, la planificación militar y la coordinación fiscal."
 SWE_EU_franco_swedish_alliance: "Forge Franco-Suecia alianza"
 SWE_EU_franco_swedish_alliance_desc: "Francia es un pilar central de autonomía europea y capacidad militar. Una alianza formal permite a Suecia participar en la defensa de vanguardia, cooperación con la disuasión nuclear y respuesta a crisis."
 SWE_EU_european_research_council_ties: "Fortalecer los Tios ERC"
 SWE_EU_european_research_council_ties_desc: "Suecia se compromete a una mayor integración con el Consejo Europeo de Investigación, armonizando los objetivos científicos de financiación e innovación con los asociados continentales."
 SWE_EU_European_cybershield: "Únete al Cyber Shield europeo"
 SWE_EU_European_cybershield_desc: "La ciberseguridad es ahora soberanía. Al participar en la iniciativa Cyber Shield de toda la UE, aumentamos la detección de amenazas, capacidades compartidas y disuasión ofensiva."
 SWE_EU_logistic_networks: "Integrar las Redes Logísticas Europeas"
 SWE_EU_logistic_networks_desc: "Las cadenas de suministro y los corredores de movilidad son vitales para la defensa europea. Suecia integrará su infraestructura en una red logística unificada para la rápida movilización y resiliencia económica."
 SWE_EU_mio_links: "Conectarse con Operadores Industriales Militares de la UE"
 SWE_EU_mio_links_desc: "Mediante la cooperación público-privada, vinculamos las empresas suecas con los Operadores Industriales Militares Europeos (MIO), creando una red de alta capacidad para la producción compartida y R&D."
 SWE_EU_joint_weather_and_space_monitoring: "Vigilancia conjunta del tiempo y el espacio"
 SWE_EU_joint_weather_and_space_monitoring_desc: "La resiliencia climática y la vigilancia orbital son ahora prioridades de defensa. Una iniciativa conjunta de monitoreo refuerza la autonomía estratégica europea tanto en el espacio como en la ciencia."
 SWE_EU_innovation_hub_programm: "Únase al Programa Europeo de Centros de Innovación"
 SWE_EU_innovation_hub_programm_desc: "La innovación no es abstracta que define el borde militar, civil y digital. Suecia se une al European Innovation Hub para impulsar la transformación de inteligencia artificial, cuántica y energética."
 SWE_EU_European_defence_identity: "Apoyo a la identidad de defensa europea"
 SWE_EU_European_defence_identity_desc: "Suecia apoya una identidad única de defensa europea: cooperativa, soberana y capaz. Esto no se opone a la OTAN que la complementa, fortaleciendo Europa desde dentro."
 SWE_USA_revitalize_atlantic_link: "Revitalizar el Enlace Atlántico"
 SWE_USA_revitalize_atlantic_link_desc: "Reafirmamos nuestro vínculo transatlántico con los Estados Unidos. La seguridad compartida, la resiliencia democrática y los vínculos económicos constituyen el fundamento de la estrategia sueca."
 SWE_USA_defense_consultation_USA: "Consulta de Defensa con EE.UU."
 SWE_USA_defense_consultation_USA_desc: "Mediante el diálogo de alto nivel, coordinamos doctrinas, evaluaciones de amenazas y estrategias de adquisición con nuestros homólogos estadounidenses."
 SWE_USA_defense_consultation_CAN: "Participación en la Consulta de Defensa Canadiense"
 SWE_USA_defense_consultation_CAN_desc: "Canadá, al igual que Suecia, equilibra la soberanía con la cooperación. Las consultas de defensa fomentan la estrategia del Ártico común, la alineación de la capacitación y la coordinación espacial."
 SWE_USA_think_tank_links: "Enlace con Estados Unidos Tanques de pensamiento estratégico"
 SWE_USA_think_tank_links_desc: "La cultura estratégica está formada por los conocimientos especializados. Mediante asociaciones institucionales con los grupos de reflexión estadounidenses, fortalecemos la previsión política y el diálogo académico-militar."
 SWE_USA_found_economical_forum: "Encontrado Foro Económico Transatlántico"
 SWE_USA_found_economical_forum_desc: "Un nuevo foro económico canaliza la inversión, la innovación y la planificación industrial entre Suecia y socios transatlánticos. Mercados abiertos, suministro resistente, futuro común."
 SWE_USA_found_nobel_techgroup: "Encontrado el Nobel de Tecnología Transatlántica"
 SWE_USA_found_nobel_techgroup_desc: "La excelencia sueca en la ciencia cumple con el capital y la capacidad estadounidenses. Este Grupo Nobel de Tecnología promueve avances cooperativos en biotecnología, ciberseguridad y fabricación avanzada."
 SWE_USA_intel_partnership: "Mejoramiento de la colaboración en materia de inteligencia"
 SWE_USA_intel_partnership_desc: "De las señales a los satélites, profundizamos la cooperación con los servicios de inteligencia aliados que aseguran la conciencia común, la resiliencia y la respuesta antihibrida."
 SWE_USA_military_industrial_exchange: "Programa militar de intercambio industrial"
 SWE_USA_military_industrial_exchange_desc: "Las líneas de producción conjuntas, la colaboración con contratistas y los ensayos técnicos conjuntos refuerzan la interoperabilidad y reducen la duplicación que sienta las bases para la preparación en toda la alianza."
 SWE_USA_human_science_projects: "Lanzamiento de proyectos conjuntos de ciencias humanas"
 SWE_USA_human_science_projects_desc: "Comprender la resiliencia, la fatiga y la adopción de decisiones es tan vital como el hardware. Suecia y Estados Unidos cooperan en las ciencias humanas en defensa, salud y respuesta al estrés."
 SWE_USA_formal_cooperation_treaty: "Tratado de Cooperación Formal"
 SWE_USA_formal_cooperation_treaty_desc: "Concluimos un tratado formal con Estados Unidos, bloqueo de alineación estratégica, garantías de defensa y desarrollo institucional compartido."
 SWE_west_deepen_relations_NATO: "Relaciones profundas con la OTAN"
 SWE_west_deepen_relations_NATO_desc: "Más allá de ser miembro, Suecia busca una confianza estratégica. Nos alineamos activamente con la OTAN en el desarrollo de capacidades, doctrina y estructura de mando."
 SWE_west_host_nato_exercises: "Organizar ejercicios de la OTAN"
 SWE_west_host_nato_exercises_desc: "Suecia acogerá ejercicios multinacionales en su territorio enviando una clara señal de preparación, confianza y cohesión de la alianza."
 SWE_west_baltic_sea_securuty_cooperation: "Fortalecimiento de la cooperación en materia de seguridad del mar Báltico"
 SWE_west_baltic_sea_securuty_cooperation_desc: "Junto con los aliados de la OTAN, desarrollamos una presencia persistente y protocolos comunes en el teatro báltico que disuaden las amenazas y proyectan la estabilidad."
 SWE_west_addapt_nato_doctrine: "Adaptarse Doctrina de la OTAN"
 SWE_west_addapt_nato_doctrine_desc: "Armonizamos la doctrina militar sueca con los conceptos operativos de la OTAN que aumentan la interoperabilidad y se preparan para operaciones conjuntas a través de dominios."
 SWE_west_build_complimentary_structures: "Construir estructuras complementarias"
 SWE_west_build_complimentary_structures_desc: "Nuestras capacidades nacionales complementarán las lagunas de la OTAN, incluidas la logística, la resiliencia y los dominios de alto nivel. La soberanía inteligente es una utilidad estratégica."
 SWE_west_participation_in_allied_command_transformation: "Únete a Transformación del Comando Aliado"
 SWE_west_participation_in_allied_command_transformation_desc: "Participamos en los esfuerzos de transformación de comandos de la OTAN ayudando a configurar conceptos futuros e integración tecnológica dentro de la alianza."
 SWE_west_balistic_missile_waring_system: "Únete al sistema de alerta de misiles balísticos"
 SWE_west_balistic_missile_waring_system_desc: "Suecia se integra en los sistemas de alerta temprana y rastreo de misiles de la OTAN que permiten una respuesta más rápida y una vigilancia compartida de las amenazas aéreas."
 SWE_west_strategic_datalinks: "Establecer vínculos de datos estratégicos"
 SWE_west_strategic_datalinks_desc: "Construimos enlaces de datos encriptados y de alta seguridad con la arquitectura C4ISR de la OTAN, garantizando una comunicación perfecta durante las operaciones conjuntas."
 SWE_west_shared_missile_development: "Participar en el desarrollo de misiles compartidos"
 SWE_west_shared_missile_development_desc: "Los programas conjuntos R&D con miembros de la OTAN permiten que Suecia contribuya y se beneficie de la tecnología de misiles de próxima generación."
 SWE_west_surveillance_data_sharing_protocol: "Implementar protocolo de intercambio de datos sobre vigilancia"
 SWE_west_surveillance_data_sharing_protocol_desc: "Estamos de acuerdo en protocolos formales para el intercambio en tiempo real de datos de radar, sonar y satélite creando una imagen situacional común en toda la alianza."
 SWE_west_nato_officer_training: "Participación en la capacitación de oficiales de la OTAN"
 SWE_west_nato_officer_training_desc: "Los oficiales suecos ahora capacitan dentro de las instituciones de la OTAN para mejorar la fluidez doctrinal, la cohesión estratégica y el intercambio de liderazgo."
 SWE_the_royal_family: "La Familia Real"
 SWE_the_royal_family_desc: "La dinastía de Bernadotte ha servido a Suecia durante generaciones, no por dominación, sino por encarnar la unidad y continuidad. La Corona sigue por encima de la política, pero no por encima del propósito."
 SWE_improve_royal_cultural_institutes: "Mejorar los Reales Institutos Culturales"
 SWE_improve_royal_cultural_institutes_desc: "Reales academias, fundaciones e institutos históricos sirven como guardianes del patrimonio nacional. Su modernización preserva el legado e inspira a las generaciones futuras."
 SWE_nordi_royal_networks: "Fortalecer Redes Reales Nórdicas"
 SWE_nordi_royal_networks_desc: "Las monarquías nórdicas comparten más que las tradiciones que comparten familias. Estos bonos reales construyen confianza entre estados y forman un eje simbólico de estabilidad."
 SWE_ties_to_windsor: "Mantener los azulejos con la casa de Windsor"
 SWE_ties_to_windsor_desc: "Gran Bretaña y Suecia tienen vínculos reales de larga data. El contacto regular con la Cámara de Windsor reafirma nuestra diplomacia suave y valores compartidos dentro de la Comunidad de Monarquías."
 SWE_bernadotte_legacy: "Honor a Bernadotte Legacy"
 SWE_bernadotte_legacy_desc: "Desde el Mariscal de Francia hasta el Rey de Suecia, la línea Bernadotte es un relato de adaptación, dignidad y supervivencia. Honramos este legado no sólo en títulos, sino en servicio."
 SWE_royal_legacy_fund: "Establecer el Fondo Royal Legacy"
 SWE_royal_legacy_fund_desc: "Un fondo nacional, bajo patrocinio real, apoyará proyectos en educación, investigación y cohesión social construyendo puentes entre la historia y el futuro."
 SWE_royal_partonage: "Ampliar Patronaje Real"
 SWE_royal_partonage_desc: "La Corona apoya incontables iniciativas en toda la sociedad, desde las artes hasta las causas ambientales. La expansión estratégica de este patronato amplifica la unidad y la confianza."
 SWE_european_royal_circle: "Forma un Círculo Real Europeo"
 SWE_european_royal_circle_desc: "Más allá de la diplomacia, los reyes se conectan a través del patrimonio compartido. Un Círculo Real Europeo permite la coordinación cultural, alianzas ceremoniales y un diálogo discreto en tiempos turbulentos."
 SWE_ties_to_japan_imperials: "Honor Ties a los Imperiales japoneses"
 SWE_ties_to_japan_imperials_desc: "La Familia Imperial Japonesa comparte con Suecia un profundo respeto por la tradición y el simbolismo. Los vínculos diplomáticos y ceremoniales se cultivan con cuidado y reconocimiento mutuo."
 SWE_ties_to_jordan_royals: "Conectarse con la Casa Real de Jordania"
 SWE_ties_to_jordan_royals_desc: "La familia real de Jordania es un pilar de estabilidad en el Medio Oriente. La construcción del respeto mutuo aumenta el papel de Suecia como un puente entre civilizaciones."
 SWE_house_of_hohenzollern: "Conectarse a la Casa de Hohenzollern"
 SWE_house_of_hohenzollern_desc: "La histórica casa real alemana sigue influyente en los círculos culturales y aristocráticos. Renovar contacto simbólico fortalece la tradición monarquica transeuropea."
 SWE_house_of_Nassau: "La Casa de Nassau"
 SWE_house_of_Nassau_desc: "Los descendientes luxemburgueses de Nassau encarnan la continuidad silenciosa en Europa. Fortalecer los lazos ceremoniales refuerza la legitimidad real más allá de las fronteras."
 SWE_house_of_Sachsen_coburg_gotha: "Celebrar la Casa de Sachsen-Coburg-Gotha"
 SWE_house_of_Sachsen_coburg_gotha_desc: "Esta dinastía conecta Gran Bretaña, Bélgica y Bulgaria una web de diplomacia real. Al celebrar la ascendencia compartida, profundizamos los canales de poder blando en el corazón de Europa."
 SWE_house_of_bourbon: "Tetas Cordiales a la Casa de Bourbon"
 SWE_house_of_bourbon_desc: "Aunque políticamente se desvaneció, la Casa de Borbón aún simboliza la grandeza europea. Nuestras interacciones siguen siendo ceremoniales pero llevan peso en la memoria aristocrática."
 SWE_the_crown_and_totalforsvaret: "La Corona y Totalförsvaret"
 SWE_the_crown_and_totalforsvaret_desc: "La monarquía sirve como símbolo de unidad en el concepto total de defensa de Suecia. La presencia de los reyes aumenta la moral, la conciencia y la confianza en la preparación nacional."
 SWE_royal_commander_in_symbol: "Comandante real en Símbolo"
 SWE_royal_commander_in_symbol_desc: "Sin tener autoridad operacional, la Corona simboliza el mando de la unidad. Un rango ceremonial formal refuerza el vínculo entre nación, defensa y tradición."
 SWE_royal_presence_at_exercises: "Presencia Real en Ejercicios"
 SWE_royal_presence_at_exercises_desc: "Los miembros de la familia real asisten a ejercicios militares nacionales y aliados que muestran respeto, mejora de la moral y personificación de la supervisión civil."
 SWE_support_for_veterans_and_families: "Apoyo a Veteranos y Familias"
 SWE_support_for_veterans_and_families_desc: "La monarquía apoya iniciativas para veteranos, soldados heridos y sus familias que afirman el vínculo sagrado entre servicio y reconocimiento."
 SWE_honor_of_service: "Honor del Servicio"
 SWE_honor_of_service_desc: "Reales medallas, ceremonias y honores reconocen actos de servicio militar, civil o humanitario. Estos rituales recuerdan a la nación que el deber y la dignidad todavía importan."
 SWE_symbol_of_resilience: "Signatura de la resiliencia"
 SWE_symbol_of_resilience_desc: "A través de las tormentas de la historia, la Corona sueca ha sufrido: ininterrumpida, inquebrantable y firme. En esta nueva era de juicios, la monarquía servirá una vez más como ancla de la nación, un emblema vivo de perseverancia que entristece a nuestro pueblo para enfrentar cualquier desafío."
 SWE_anchor_of_the_nation: "Ancla de la Nación"
 SWE_anchor_of_the_nation_desc: "Cuando las instituciones fluctúan y las ideologías chocan, la Corona sigue siendo constante. No ordena que se conecte."
 SWE_pluralistic_society: "Sociedad pluralista"
 SWE_pluralistic_society_desc: "La fuerza de Suecia radica en la armonía de sus diversas voces. Al abrazar el pluralismo bajo la mano guía de la Corona, forjaremos una nación donde la unidad no prospere a través de la uniformidad, sino mediante el respeto mutuo y el propósito compartido."
 SWE_revitalize_excavation: "Revitalizar la excavación"
 SWE_revitalize_excavation_desc: "De las minas de hierro de Bergslagen a las canteras de Gotland, la tierra de Suecia tiene la fuerza cruda del reino. Al modernizar nuestros métodos de excavación, desbloquearemos estos recursos de nuevo, alimentando tanto nuestra industria como nuestras ambiciones."
 SWE_revitalize_demographics: "Revitalize Demographics"
 SWE_revitalize_demographics_desc: "La fuerza de una nación se mide no sólo en sus brazos sino en su pueblo. Al apoyar el crecimiento de la familia, fomentar la migración calificada y garantizar la oportunidad para todos, Suecia asegurará una población vibrante y duradera para las generaciones venideras."
 SWE_revitalize_agrarian_industrie: "Revitalizar la industria agraria"
 SWE_revitalize_agrarian_industrie_desc: "Los campos fértiles de Suecia han sido desde hace mucho tiempo la base de nuestra prosperidad. Mediante la modernización de los métodos agrícolas y el fortalecimiento de las economías rurales, aseguraremos que nuestras granjas alimenten una vez más a la nación y apoyen sus crecientes ambiciones."
 SWE_form_royal_social_society: "Formar la Sociedad Social Real"
 SWE_form_royal_social_society_desc: "Para fomentar la unidad entre la Corona y el pueblo, estableceremos la Real Sociedad Social, una red dedicada al intercambio cultural, obras benéficas y la promoción de la solidaridad nacional bajo la presencia guía de la monarquía."
 SWE_medial_royals: "Visibilidad de los medios de comunicación"
 SWE_medial_royals_desc: "La familia real moderna debe equilibrar la tradición con visibilidad. La presencia estratégica de los medios de comunicación aumenta su papel como cifras relatables y unificantes."
 SWE_modernize_the_image: "Modernizar la imagen real"
 SWE_modernize_the_image_desc: "El vestido, el mensaje y la presencia social deben evolucionar. Una monarquía moderna aún honra el pasado pero habla en la voz del presente."
 SWE_defender_of_tradition: "Defensor de la Tradición"
 SWE_defender_of_tradition_desc: "La Corona salvaguarda el patrimonio de valores básicos de Suecia, el decoro y la continuidad. Esto no es el conservadurismo, sino la administración cultural."
 SWE_royal_diplomacy: "Diplomacia real"
 SWE_royal_diplomacy_desc: "Visitas reales, patrocinio y compromiso ceremonial abren puertas diplomáticas a menudo donde los gobiernos no pueden. La Corona trabaja en silencio, pero con efecto."
 SWE_royal_charity: "Trabajo de caridad real"
 SWE_royal_charity_desc: "A través de cientos de fundaciones y causas, la familia real sirve al pueblo. Del bienestar infantil a la acción climática, su impacto es moral y no político."
 SWE_form_kings_concil: "Forma el Consejo del Rey"
 SWE_form_kings_concil_desc: "Un consejo de asesoramiento ceremonial compuesto por académicos, oficiales y estadistas proporciona información estratégica al monarca y un símbolo nacional del diálogo."
 SWE_expand_royal_guard: "Ampliar la Guardia Real"
 SWE_expand_royal_guard_desc: "La Guardia Real no representa sólo seguridad, sino honor ceremonial. Su expansión aumenta la visibilidad, disciplina y tradición en la vida pública militar."
 SWE_enhance_royal_protocol: "Mejora del Protocolo Real"
 SWE_enhance_royal_protocol_desc: "El protocolo ceremonial fortalece la identidad nacional y el poder blando. Mejorar los rituales, las visitas y los honores preserva la gravedad de la monarquía en la gobernanza moderna."
 SWE_the_crown_as_bridge: "La Corona como un puente"
 SWE_the_crown_as_bridge_desc: "Entre partidos y personas, generaciones y naciones la Corona es el puente. Ni gobernante ni gobernante en espera, permanece como la memoria viva de Suecia."
 SWE_non_aligned_responsibility: "La responsabilidad de la neutralidad"
 SWE_non_aligned_responsibility_desc: "La neutralidad histórica de Suecia no nace de pasividad, sino de principio. En un mundo dividido, defendemos la responsabilidad de seguir siendo independientes, creíbles y socialmente resilientes. Ni impulsados por imperios ni ideologías, estamos firmes en nuestro propio modelo de gobierno donde la estabilidad, la paz y el bienestar no son consignas, sino deberes."
 SWE_neutrality_an_other_sweden: "Otro Suecia"
 SWE_neutrality_an_other_sweden_desc: "Es hora de repensar lo que Suecia puede ser. Libre de la presión transatlántica, debemos reimaginar la neutralidad, no como distancia pasiva, sino como una alternativa consciente a las alianzas imperiales."
 SWE_the_eastern_horizon: "El Horizonte Oriental"
 SWE_the_eastern_horizon_desc: "Suecia no debe seguir a la OTAN y los estadounidenses, sólo porque el país está civilizado y en Europa. Tenemos que dar la vuelta a nuestra visión al mundo"
 SWE_question_nato: "Pregunta Valor de la OTAN"
 SWE_question_nato_desc: "La doctrina estratégica de Suecia debe servir a los intereses nacionales más que a los de las alianzas extranjeras. Un examen público determinará si la OTAN garantiza realmente la seguridad o restringe la soberanía."
 SWE_suspend_eu_defense_integration: "Suspendiendo la integración de defensa de la UE"
 SWE_suspend_eu_defense_integration_desc: "La participación en proyectos colectivos de defensa europea debe detenerse para mantener una estructura independiente de mando sueca."
 SWE_suspend_eu_defense_integration_tt: "Posibilidades para el ascenso de 'Leave' si el nacionalista tiene ⁇ 25% Popularidad."
 SWE_denounce_sanction_policy: "Denunciar la política de sanciones"
 SWE_denounce_sanction_policy_desc: "Suecia no participará en las sanciones económicas occidentales contra los nuevos poderes, priorizando el comercio abierto y la neutralidad política."
 SWE_join_the_belt_and_road_forum: "Únete al Foro Franja y la Ruta"
 SWE_join_the_belt_and_road_forum_desc: "Suecia se comprometerá formalmente con la Iniciativa China Franja y la Ruta, posicionandose como una puerta norteña para nuevas rutas comerciales globales."
 SWE_nordic_eurasian_dialogue: "Diálogo Nórdico-Eurasiano"
 SWE_nordic_eurasian_dialogue_desc: "Las conversaciones con Rusia y los socios eurasiáticos abrirán oportunidades para corredores económicos y de transporte a largo plazo que vinculan Suecia con Asia."
 SWE_strategic_energy_pact_russia: "Pacto Estratégico de Energía con Rusia"
 SWE_strategic_energy_pact_russia_desc: "Un acuerdo de suministro a largo plazo asegurará el acceso sueco a la energía rusa, aislando la economía de los mercados occidentales volátiles."
 SWE_SCO_observer_status: "SCO observador status"
 SWE_SCO_observer_status_desc: "Suecia obtendrá la condición de observador en la Organización de Cooperación de Shanghai para explorar alternativas de cooperación en materia de seguridad a la OTAN."
 SWE_joint_exercises_with_russia: "Ejercicios conjuntos con Rusia"
 SWE_joint_exercises_with_russia_desc: "Los ejercicios de combate con las Fuerzas Armadas Rusas mejorarán las capacidades de la guerra invernal de Suecia."
 SWE_PLA_saab_technology_exchange: "Intercambio de tecnología PLA-SAAB"
 SWE_PLA_saab_technology_exchange_desc: "Un programa bilateral combinará la ingeniería aeroespacial sueca con capacidad de fabricación china para producir sistemas avanzados."
 SWE_join_brics_new_development_bank: "Únase al nuevo Banco de Desarrollo BRICS"
 SWE_join_brics_new_development_bank_desc: "Los miembros del NDB proporcionarán financiación para proyectos de infraestructura suecos sin las condiciones políticas impuestas por las instituciones occidentales."
 SWE_eurasian_raj_link: "Enlace Eurasian Rail"
 SWE_eurasian_raj_link_desc: "Un corredor de carga directo a través de Rusia conectará Suecia a los mercados del Asia oriental."
 SWE_Nordic_corean_minarl_pact: "Pacto de minerales nórdicos y coreanos"
 SWE_Nordic_corean_minarl_pact_desc: "Corea del Norte tiene minerales raros en abundancia. Organizaremos discretamente envíos a cambio de comida, medicina y equipo industrial."
 SWE_pyongyang_heavy_industry_exchange: "Pyongyang intercambio industrial pesado"
 SWE_pyongyang_heavy_industry_exchange_desc: "Suministraremos herramientas de máquina a cambio para la capacidad de fabricación pesada en pedidos específicos, fortaleciendo ambos lados."
 SWE_neutrality_divtrine_revision: "Revisión de Doctrina de Neutralidad"
 SWE_neutrality_divtrine_revision_desc: "La doctrina de neutralidad de Suecia se actualizará para priorizar el compromiso activo con los poderes no occidentales."
 SWE_information_partnership_with_RT: "Asociación de información con RT"
 SWE_information_partnership_with_RT_desc: "Un acuerdo de cooperación mediática con Rusia Hoy expandirá la capacidad de Suecia para presentar su perspectiva globalmente."
 SWE_eastern_cultural_exchange_program: "Programa de intercambio cultural oriental"
 SWE_eastern_cultural_exchange_program_desc: "Los acuerdos culturales con Rusia, China e India promoverán la comprensión mutua y los vínculos entre personas."
 SWE_diplomatic_privot_global_south: "Diplomáticos en el Sur Mundial"
 SWE_diplomatic_privot_global_south_desc: "El comercio y el compromiso político se centrarán en los mercados emergentes de África, América Latina y Asia."
 SWE_petro_caribe_nordic_accord: "PetroCaribe – Acuerdo Nórdico"
 SWE_petro_caribe_nordic_accord_desc: "Caracas tiene petróleo y busca socios confiables fuera del Oeste. Trataremos la ingeniería y fabricación de precisión para entregas crudas seguras."
 SWE_angola_offshore_cooperation: "Cooperación offshore angoleña"
 SWE_angola_offshore_cooperation_desc: "Los campos petroleros de Angola y la tecnología de aguas profundas de Suecia asegurarán beneficios mutuos fuera de los principales del petróleo occidental."
 SWE_south_africa_strategic_metal_pact: "Pacto de metales estratégicos sudafricanos"
 SWE_south_africa_strategic_metal_pact_desc: "Garantizaremos suministros a largo plazo de platino, manganeso y tierras raras para nuestras industrias."
 SWE_cuban_medical_exchange: "Intercambio Médico Cubano"
 SWE_cuban_medical_exchange_desc: "La diplomacia médica de Cuba es legendaria. Invitaremos a especialistas cubanos a formar nuestro cuerpo de salud pública, construyendo buena voluntad y capacidad."
 SWE_teheran_petrochemical_partnership: "Teherán Petrochemicals partnership"
 SWE_teheran_petrochemical_partnership_desc: "Las vastas reservas energéticas e industrias químicas de Irán pueden alimentar nuestra economía. Faldaremos embargos occidentales a través de sistemas alternativos de pago."
 SWE_iranian_drone_technologie_transfer: "Transferencia de tecnología iraní de drones"
 SWE_iranian_drone_technologie_transfer_desc: "La experiencia de Irán en la guerra con drones de bajo costo tiene lecciones para nosotros. Adquirimos y adaptaremos sus sistemas para nuestras propias fuerzas."
 SWE_energy_autarky_program_idea: "Programa Energy Autarky"
 SWE_energy_autarky_program_idea_desc: "Esta iniciativa nacional prioriza la independencia energética interna. Al invertir en la producción de combustible sintético, diversificar las fuentes de energía y asegurar contratos de suministro a largo plazo, Suecia reduce su vulnerabilidad a las perturbaciones extranjeras y fortalece la autonomía estratégica."
 SWE_international_peace_institution: "Autoridad Internacional de Arbitraje"
 SWE_international_peace_institution_desc: "Suecia se ha posicionado como un garante neutral de las normas jurídicas internacionales al acoger a un órgano arbitral multinacional. Esto fortalece nuestra influencia diplomática, aumenta la credibilidad en la resolución mundial de conflictos y abre nuevos canales para el compromiso multilateral."
 SWE_royalist_revival: "Restauración de Bernadotte"
 SWE_royalist_revival_desc: "La Cámara de Bernadotte debe reclamar su lugar central en la sociedad sueca y la gobernanza. A través de la tradición y la unidad, la monarquía comenzará su regreso como el fundamento de la nación."
 SWE_monarch_constitution: "De Gobierno Reescrito"
 SWE_monarch_constitution_desc: "La constitución de Suecia debe reflejar la verdadera voluntad de la Corona. Al reescribir el Instrumento de Gobierno, la monarquía se elevará por encima de los escuadrones partidistas para conducir con claridad y fuerza."
 SWE_chamber_of_crown: "Cámara de la Corona"
 SWE_chamber_of_crown_desc: "La Corona exige una institución dedicada a supervisar su autoridad fiscal en expansión. A través de la cámara reformada, las prioridades reales darán forma al destino económico del reino."
 SWE_military_reform_act: "Försvarsmakten Reform Act"
 SWE_military_reform_act_desc: "Las fuerzas armadas de Suecia deben transformarse en una fuerza de lealtad y disciplina. Al reorganizar Försvarsmakten, aseguramos que nuestro ejército sirva primero y siempre al soberano."
 SWE_naval_program: "Programa naval Carl XVI Gustaf"
 SWE_naval_program_desc: "Para ordenar el Báltico una vez más, nuestra flota debe ser renovada. Bajo el patrocinio de Carl XVI Gustaf, una marina revitalizada protegerá los mares y legados de Suecia."
 SWE_northern_shield: "Iniciativa de escudos del norte"
 SWE_northern_shield_desc: "El vasto norte no debe quedar expuesto a la influencia externa. Fortalecer nuestras fronteras garantiza tanto la seguridad como la dignidad del reino."
 SWE_skane_defense: "Skånelands Försvarslinje"
 SWE_skane_defense_desc: "El sur de Suecia, especialmente Skåne, Halland y Blekinge, se encuentra cerca de Europa continental y no debe pasarse por alto. Fortificando Skåneland, creamos un bastión sur de defensa real y orgullo cultural."
 SWE_project_riksglans: "Proyecto Riksglans"
 SWE_project_riksglans_desc: "La gente debe ver la gloria de la Corona en piedra y espectáculo. Los monumentos nacionales y las ceremonias reales atarán a la población a su soberano."
 SWE_industrial_plan_svea: "Plan Industrial Svea"
 SWE_industrial_plan_svea_desc: "El crecimiento industrial de Suecia se guiará por una visión singular. Mediante la planificación central, sentamos las bases para una economía real autosuficiente."
 SWE_state_coordination_plan: "Plan de coordinación estatal y económica"
 SWE_state_coordination_plan_desc: "Una Suecia próspera debe servir fielmente a su monarca. Se coordinarán las industrias nacionales para fortalecer el Estado bajo supervisión real."
 SWE_livgardet: "Reinstate el Livgardet"
 SWE_livgardet_desc: "El Livgardet volverá a ponerse como protectores del Rey. Su regreso indicará el renacimiento de nuestro orgullo marcial y soberanía real."
 SWE_folkplikt: "Folkplikt Declaration"
 SWE_folkplikt_desc: "Todo ciudadano tiene un deber para la nación y el monarca. El servicio obligatorio fomentará la unidad, la resiliencia y la lealtad."
 SWE_mining_act: "Mine Act of Bergslagen"
 SWE_mining_act_desc: "Los ricos recursos de Bergslagen no deben caer en beneficio extranjero. Nacionalizaremos y protegeremos estos activos en nombre de la Corona."
 SWE_royal_council: "Riketsrådet revivió"
 SWE_royal_council_desc: "El Consejo Real será restaurado como una institución de sabiduría y mando real. En su cámara, las decisiones se harán eco con la voz del Rey."
 SWE_bofors_compact: "Bofors-MilDef compacto"
 SWE_bofors_compact_desc: "Para armar a la nación, debemos alinear las necesidades militares con la producción industrial. Un pacto real entre Bofors y las fábricas nacionales garantizará la disponibilidad constante."
 SWE_kungliga: "Kungliga Vetenskapsrådet"
 SWE_kungliga_desc: "La Corona recuperará el liderazgo científico de Suecia. A través del Royal Science Council, la innovación servirá al futuro del reino."
 SWE_kultur: "Svensk Kulturväckelse"
 SWE_kultur_desc: "Un gran despertar cultural revolverá al pueblo sueco. El patrocinio real conducirá un renacimiento en el patrimonio, el arte y la identidad."
 SWE_reign_without_rival: "Reign Sin Rival"
 SWE_reign_without_rival_desc: "El tiempo para el compromiso ha terminado. El Rey reinará solo, indiscutido por el parlamento o la voz populista."
 SWE_rikshalvan_reunited: "Östra Rikshalvan Reunited"
 SWE_rikshalvan_reunited_desc: "Finlandia ha sido parte de nuestro legado real. A través de la diplomacia o la necesidad, traeremos nuestras tierras orientales de vuelta al reino."
 SWE_mannerheim_pact: "Pacto de infraestructura Mannerheim"
 SWE_mannerheim_pact_desc: "La integración no puede lograrse sin inversión. Mediante la infraestructura y la reforma, Finlandia se preparará para una plena reunificación."
 SWE_mannerheim_pact_tt: "§YLos efectos de este enfoque se mostrarán cuando controlamos los Estados [FIN.GetFlag][FIN.GetAdjectiveCap]§!"
 SWE_dominion_ostersjon: "Dominion over Östersjön"
 SWE_dominion_ostersjon_desc: "Para asegurar nuestra influencia, debemos dominar el Mar Báltico. El control de sus aguas garantiza tanto el comercio como la soberanía."
 SWE_unification_baltiska: "Unificación del Broderfolk Baltiska"
 SWE_unification_baltiska_desc: "Los pueblos bálticos están atados a nosotros a través de siglos de historia. Los reuniremos bajo la protección de la Corona sueca."
 SWE_kalmar_unification: "La ambición Kalmar se renovó"
 SWE_kalmar_unification_desc: "La Unión Kalmar una vez trajo fuerza a través de la unidad. Suecia ocupará ahora su lugar legítimo como líder del mundo nórdico."
 SWE_post_kingdom_logistics: "Red logística de post-reino"
 SWE_post_kingdom_logistics_desc: "Modernizar nuestros nuevos territorios los anclará a nuestra visión estratégica. Ferrocarriles y puertos atenderán las necesidades económicas y militares de Suecia."
 SWE_post_kingdom_logistics_tt: "Los efectos de este enfoque se mostrarán cuando controlamos cualquier estado desde:§Y \n[ICE.GetNameWithFlag] \n[NRY.GetNameWithFlag] \n[DEN.GetNameWithFlag] \n[EST.GetNameWithFlag] \n[LAT.GetNameWithFlag] \n[LIT.GetNameWithFlag]§!"
 SWE_eastern_marches: "Restaurar las marchas orientales"
 SWE_eastern_marches_desc: "Ingria y Karelia eran las murallas orientales del reino sueco, protegiendo al Báltico de la expansión Muscovite. Reclamaremos estas tierras por la Corona."
 SWE_reclaim_swedish_pomerania: "Reclame Pomerania Sueca"
 SWE_reclaim_swedish_pomerania_desc: "Pomerania sueca y el puerto de Wismar una vez nos dieron un lugar a pie en Alemania. Al revivir nuestras afirmaciones, controlaremos la puerta occidental del Báltico meridional."
 SWE_german_shipyards: "Revive los Astilleros Pomeranianos"
 SWE_german_shipyards_desc: "Los astilleros de Pomerania sueca y Wismar construyeron una vez buques que gobernaban el Báltico. Mediante la modernización de estas instalaciones, aseguraremos nuestra supremacía naval durante décadas por venir."
 SWE_dansk: "Real Prusia Reclamado"
 SWE_dansk_desc: "Prusia real y el puerto de Gdańsk fueron una vez bajo nuestra influencia durante la altura de nuestro imperio. Su regreso asegurará nuestro dominio sobre el comercio báltico."
 SWE_polish_grain: "Arnés del Grain"
 SWE_polish_grain_desc: "Las fértiles llanuras de Prusia Real y Gdańsk han suministrado durante mucho tiempo el mundo Báltico. Al restaurar el comercio de granos bajo nuestra bandera, garantizamos tanto el crecimiento económico como la seguridad alimentaria estratégica."
 SWE_eastern_timber: "Explotar la Madera y Minerales Orientales"
 SWE_eastern_timber_desc: "Karelia e Ingria son ricos en madera, alquitrán y minerales vitales para la construcción naval e industria. Traerlos bajo la dirección sueca fortalecerá nuestro ejército y economía por igual."
 SWE_colonial_court: "Estatuto de la Corte Colonial"
 SWE_colonial_court_desc: "Una carta ceremonial afirmará la continua presencia de Suecia en el extranjero. Estas leyes servirán para legitimar nuestro legado colonial."
 SWE_saint_barthelemy: "Restaurar la Gloria de Gustavia"
 SWE_saint_barthelemy_desc: "Saint Barthélemy volverá a su época dorada como puerto libre. Su avivamiento honrará nuestra historia marítima y colonial."
 SWE_carolusborg: "Legado de Carolusborg"
 SWE_carolusborg_desc: "Nuestro legado en África Occidental no debe olvidarse. Al invertir en la Costa del Oro, reavivamos el recuerdo de la exploración sueca."
 SWE_fort_christina: "Reclamen Fort Christina"
 SWE_fort_christina_desc: "Nueva Suecia se levantará de nuevo, si sólo en nombre. Reestableceremos nuestro legado a lo largo del Delaware como símbolo de la resistencia sueca."
 SWE_nya_sverige: "Narrativa de Nya Sverige"
 SWE_nya_sverige_desc: "A través de historias, monumentos y diplomacia, compartiremos nuestro pasado colonial. Esta narrativa mejorará la imagen global de Suecia."
 SWE_viking_legacy: "Despertar el Espíritu de Uppsala"
 SWE_viking_legacy_desc: "Las sagradas tradiciones de Uppsala inspirarán nuevamente al pueblo sueco. Como en días pasados, nos reunimos bajo las banderas de nuestros antepasados."
 SWE_conquest_denmark: "Romper la cadena danesa"
 SWE_conquest_denmark_desc: "Las islas y territorios bajo dominio danés formaron una parte vital del mundo nórdico: Bornholm vigilando el Báltico, las Faroes y Groenlandia abriendo el camino hacia el Atlántico. Al romper la cadena de control de Dinamarca, restauraremos estas tierras a la Corona y dirigiremos el mar norte una vez más."
 SWE_conquest_norway: "Reclamar el Corazón Vikingo"
 SWE_conquest_norway_desc: "Desde los fiordos de Lofoten hasta la expuesta helada de Svalbard, Noruega era la cuna de nuestros antepasados marineros. Al restaurar estas costas del norte a la Corona sueca, controlaremos las mismas aguas de las que nació la Edad Vikinga."
 SWE_bornholm_raid: "Estación de Bornholm Raider"
 SWE_bornholm_raid_desc: "Bornholm será nuestro puerto de asalto Báltico, lanzando huelgas rápidas contra el envío enemigo y reforzando nuestro control del mar."
 SWE_longship_doctrine: "Doctrina de Longship"
 SWE_longship_doctrine_desc: "Las tácticas de la longevidad (acercamiento swift, huelga repentina, retiro rápido) renacerán en una guerra moderna y anfibia."
 SWE_artic_training: "Formación de corredores árticos"
 SWE_artic_training_desc: "Nuestros comandos dominarán la guerra ártica, operando con destreza inigualable en los mares congelados y tundra donde otros falsificarían."
 SWE_diaspora: "Movilización de la Diáspora"
 SWE_diaspora_desc: "En todo el mundo, las comunidades de ascendencia nórdica responderán a nuestra llamada, financiando nuestras flotas e incrementando las filas de nuestros guerreros."
 SWE_conquest_england: "Tormenta los zapatos anglosajones"
 SWE_conquest_england_desc: "Las costas orientales de Inglaterra, desde Northumbria hasta East Anglia, una vez estaban bajo el dominio del Danelaw. Al golpear a estas orillas de nuevo, recuperaremos las viejas fortalezas de Norse y los traeremos de vuelta a nuestra esfera de poder."
 SWE_conquest_ireland: "Reforge el reino nórdico de Dublín"
 SWE_conquest_ireland_desc: "Dublín fue fundada por los comerciantes vikingos y se convirtió en una de las ciudades más ricas de Norse en el mar occidental. Al recuperarlo, lo restauraremos como un centro clave para el comercio y las operaciones marítimas en el Atlántico Norte."
 SWE_conquest_iceland: "Trae a Islandia de regreso a la Fold"
 SWE_conquest_iceland_desc: "Asentado por Norsemen hace más de mil años, Islandia era el corazón de la exploración vikinga en Groenlandia y Vinland. Al traerlo una vez más bajo nuestra protección, restauraremos la piedra angular de nuestro dominio del Atlántico Norte."
 SWE_greenlandic_strongold: "Greenlandic Stronghold"
 SWE_greenlandic_strongold_desc: "De Erik el Rojo a Suecia moderna, Groenlandia ha sido un centinela del Norte. Fortificarla anclará nuestra supremacía del Ártico."
 SWE_dublin_trade: "Centro comercial Dublin Norse"
 SWE_dublin_trade_desc: "Fundada por colonos de Norse, Dublín se convertirá en nuestro moderno centro comercial en el mar occidental, uniendo al mundo vikingo una vez más."
 SWE_conquest_canada: "Reclamar Vinland"
 SWE_conquest_canada_desc: "Hace mil años, nuestros antepasados nórdicos cruzaron el Atlántico y establecieron la tierra que llamaron Vinland. Hoy seguiremos su velada, restaurando nuestra presencia en Terranova y marcando el regreso del espíritu vikingo al Nuevo Mundo."
 SWE_riches_vinland: "Cosecha a los ricos de Vinland"
 SWE_riches_vinland_desc: "Los sagas hablaron de tierras fértiles de Vinland, bosques ricos y aguas abundantes. Ahora bajo nuestra bandera, estos recursos servirán al reino, suministrando madera para nuestras flotas, minerales para nuestras faldas y comida para alimentar a nuestros ejércitos en crecimiento a través del mar."
 Sweden.12.t: "Försvarsbeslutet 2000"
 Sweden.12.d: "Hemos convocado al Parlamento este día para discutir el futuro de nuestra doctrina de las fuerzas armadas. Nos hemos centrado en la defensa de la invasión durante décadas, pero sin ningún trato real quizás deberíamos considerar reducir el gasto en los militares para conseguir recursos y dinero disponibles en otros lugares."
 Sweden.12.o1: "Preparación de la Estrategia de Invasión"
 Sweden.12.o2: "Preparación de la estrategia operacional"
 Sweden.13.t: "Försvarsbeslutet 2004"
 Sweden.13.d: "Una vez más hemos convocado al Parlamento para discutir el futuro de nuestra doctrina de las fuerzas armadas. Dependiendo de la situación actual de amenaza debemos decidir qué camino tomar."
 Sweden.13.o1: "Estrategia de invasión"
 Sweden.13.o2: "Estrategia operacional"
 Sweden.14.t: "Försvarsbeslutet 2009"
 Sweden.14.d: "La Ley de defensa de los últimos años se aplazó debido a la agresión rusa contra Georgia. Ahora eso se acabó y podemos decidir si debemos reubicar fondos."
 Sweden.14.o1: "Supresión del servicio militar obligatorio"
 Sweden.14.o2: "Aumento del gasto militar"
 Sweden.15.t: "Försvarsbeslutet 2015"
 Sweden.15.d: "Hemos convocado al Parlamento este día para discutir el futuro de nuestra doctrina de las fuerzas armadas. El general Sverker Göransson ha dicho en una entrevista que Suecia sólo sería capaz de defenderse durante una semana contra las amenazas actuales en la región."
 Sweden.15.o1: "¡Tonterías! Estamos bien."
 Sweden.15.o2: "Aumento del gasto militar"
 Sweden.16.t: "Försvarsbeslutet 2020"
 Sweden.16.d: "La situación de amenaza en el mundo está aumentando y por lo tanto tenemos dos opciones. Si ponemos fondos para reconstruir nuestra defensa de la invasión o rezamos para que estemos bien de todos modos."
 Sweden.16.o1: "No podemos pagarlo."
 Sweden.16.o2: "Mejora de la defensa de los fondos"
 Sweden.17.t: "Gripen E prevalece en Brasil!"
 Sweden.17.d: "El JAS 39E ha ganado el programa de luchadores F-X2 en Brasil. Esto impulsará nuestra economía masivamente cuando empecemos a entregar, y nuestro desarrollo irá más rápido."
 Sweden.17.o1: "¡Grandes noticias!"
 Sweden.18.t: "Primer Gripen E enviado a Brasil"
 Sweden.18.d: "El JAS 39E ha ganado el programa de luchadores F-X2 en Brasil. Esto impulsará nuestra economía masivamente cuando empecemos a entregar, y nuestro desarrollo irá más rápido. Ahora el primero de los 36 Gripens ordenados han sido enviados a Brasil."
 Sweden.18.o1: "¡Maravillosa cooperación!"
 Sweden.19.t: "submarino sueco «sunk» USS Ronald Reagan"
 Sweden.19.d: "El USS Ronald Reagan, un recién construido $6.2 mil millones de aeronaves, fue cazado por un submarino sueco. Afortunadamente, no ocurrió en combate real. Sin embargo, fue simulado como parte de un juego de guerra. Un equipo de tareas de transporte con numerosas escoltas antisubmarinas frente a HSwMS Gotland, un pequeño submarino sueco propulsado por diesel que pesa 1.600 toneladas. A pesar de múltiples ataques contra Reagan, el Gotland nunca fue detectado. La Armada de EE.UU. ha solicitado un contrato de arrendamiento del Gotland y su tripulación durante dos años para realizar ejercicios antisubmarinos. Los resultados convencieron a la Armada de Estados Unidos de que sus sensores submarinos no podían lidiar con el robo HSwMS Gotland."
 Sweden.19.o1: "No deberíamos subestimar la ingeniería sueca."
 Sweden.20.t: "2021 Crisis del gobierno sueco"
 Sweden.20.d: "Una crisis del gobierno comenzó en 2021 en Suecia después de que el Riksdag derrotó al Primer Ministro Stefan Löfven con un voto sin confianza. Queda la pregunta. ¿Debe renunciar o declarar una elección rápida?"
 Sweden.20.o1: "Resign"
 Sweden.20.o2: "Llamamiento a las elecciones de ida y vuelta"
 Sweden.20.o3: "Meh... Ellos son claramente delirios"
 Sweden.21.t: "2021 Crisis del gobierno sueco"
 Sweden.21.d: "Una crisis del gobierno comenzó en 2021 en Suecia después de que el Riksdag derrotó al Primer Ministro Stefan Löfven con un voto sin confianza. Queda la pregunta. ¿Debe renunciar o declarar una elección rápida?"
 Sweden.21.o1: "¿Y por qué deberíamos importarnos?"
 Sweden.21.o2: "Oh god"
 Sweden.22.t: "Suecia se une a la zona Schengen"
 Sweden.22.d: "Suecia finalmente se ha unido al área Schengen eliminando la necesidad de utilizar pasaportes cuando viaja en la UE. La Zona Schengen es una zona que comprende 27 países europeos que han abolido oficialmente todo el pasaporte y todos los demás tipos de control fronterizo en sus fronteras mutuas. Al ser un elemento dentro del ámbito más amplio de la política de libertad, seguridad y justicia de la Unión Europea (UE), funciona en su mayoría como una sola jurisdicción bajo una política común de visados con fines internacionales de viaje. La zona es nombrada después del Acuerdo de Schengen de 1985 y el Convenio de Schengen de 1990, ambos firmados en Schengen, Luxemburgo."
 Sweden.22.o1: "Mejor tarde que nunca"
 Sweden.23.t: "Norrtåg ha sido fundada"
 Sweden.23.d: "Norrtåg (Northern Trains) es una empresa de propiedad pública que pertenece al condado de Norrbotten, el condado Västerbotten, el condado de Västernorrland y el condado de Jämtland en Suecia. La compañía posee trenes de pasajeros y organiza la operación de trenes de pasajeros. Norrtåg controla las ventas de entradas y contrata a un operador que maneja la operación de tren real (staff y permisos). Los trenes están operados bajo el nombre de la marca Norrtåg."
 Sweden.23.o1: "Nuestra infraestructura está mejorada."
 Sweden.24.t: "Premio Nobel cumple 100"
 Sweden.24.d: "El Premio Nobel cumple 100 y 161 ganadores anteriores son invitados por su fiesta de cumpleaños. Los Premios Nobel son cinco premios separados que, según la voluntad de Alfred Nobel de 1895, se otorgan a «aquellos que durante el año anterior han conferido el mayor beneficio para la humanidad». Alfred Nobel era un químico, ingeniero e industrial sueco más conocido por la invención de dinamita. Murió en 1896. In his will, he bequeathed all of his remaining realisable assets to be used to establish five awards which became known as Nobel Prizes. Premios Nobel fueron premiados por primera vez en 1901."
 Sweden.24.o1: "Wonderful!"
 Sweden.25.t: "El asesinato de Rinkeby"
 Sweden.25.d: "El asesinato de Rinkeby tuvo lugar el 26 de febrero de 2002, cuando Radu Acsinia, de 19 años, fue asesinado a tiros en la estación de Rinkeby, en el metro de Estocolmo, Suecia. El 23 de octubre de 2002, el Tribunal de Apelación de Svea, en Estocolmo, declaró culpables conjuntamente a cuatro jóvenes. Los dos delincuentes más jóvenes fueron condenados cada uno a cuatro años de custodia juvenil, mientras que los dos hermanos Önder Yildiz (entonces 20 años) y Özkan Yildiz (24) – recibieron penas de prisión de 10 años y vida respectivamente."
 Sweden.25.o1: "Preocupando el desarrollo..."
 Sweden.26.t: "La inauguración de Västermalmsgallerian"
 Sweden.26.d: "Västermalmsgallerian es un centro comercial en Kungsholmen, Estocolmo, Suecia, inaugurado el 23 de agosto de 2002. El centro comercial está situado en un edificio reformado que data de los años 70 en el bloque de la ciudad 'Trossen' cerca de la estación de metro Fridhemsplan en la intersección de las calles Sankt Eriksgatan y Fleminggatan. El nombre Västermalmsgallerian viene de Västermalm, un nombre alternativo para el distrito de Kungsholmen. El centro comercial es el primer centro comercial de Kungsholmen, incluyendo tiendas para la moda, decoración interior y comida. Tiene una superficie total de 10'000 m2, e incluye 45 tiendas de varios tamaños y cadenas comerciales internacionales."
 Sweden.26.o1: "¡Más impuestos para mí!"
 Sweden.27.t: "Anna Lindh (S) ha sido asesinada"
 Sweden.27.d: "El 10 de septiembre de 2003 mientras compraba en la sección de damas del almacén Nordiska Kompaniet en el centro de Estocolmo para un debate televisado más tarde esa noche en el referéndum sobre la adopción del euro por Suecia, Lindh fue apuñalado en el pecho, el abdomen y los brazos. En ese momento, no estaba protegida por guardaespaldas del Servicio de Seguridad de Suecia; esto resultó controvertido, dada la similitud entre el asesinato de Lindh y el del Primer Ministro Olof Palme en 1986 (el primer asesinato de un miembro del gobierno en la historia sueca moderna)."
 Sweden.27.o1: "Oh no"
 Sweden.27.o2: "¡Encontraremos quién hizo esto!"
 Sweden.28.t: "¡La policía encontró al asesino!"
 Sweden.28.d: "El 16 de septiembre un hombre fue detenido como sospechoso por motivos justificables (el nivel más bajo de sospecha), pero fue absuelto de todos los cargos y liberado. El 24 de septiembre, la policía anunció que un sospechoso, Mijailo Mijailović (nacido en Suecia a los padres serbios), había sido detenido y arrestado a un nivel más alto de sospecha: «causa probable». El 25 de septiembre, se anunció que el perfil de ADN de Mijailović coincidió con el de los pelos en una gorra de béisbol dejado en (o cerca) la escena del crimen, y se parecía al hombre filmado en la tienda donde Lindh fue atacado. Después de negar toda participación, Mijailović confesó el crimen el 6 de enero de 2004, proporcionando un relato completo de los sucesos del 10 de septiembre en una sesión extra de interrogatorio policial solicitada por Peter Althin (consejera de Mijailović). Fue declarado culpable en un juicio celebrado del 14 al 17 de enero. Después de una evaluación psiquiátrica fue condenado a cadena perpetua el 23 de marzo. El 8 de julio, un tribunal de apelación anuló la sentencia de Mijailović (después de que los exámenes concluyeron que estaba mentalmente enfermo en el momento del asesinato), y Mijailović fue trasladado a un pabellón psiquiátrico seguro. Los fiscales recurrieron al Tribunal Supremo de Suecia, que restableció su condena a cadena perpetua el 2 de diciembre de ese año. Mijailović renunció a su ciudadanía sueca y ha solicitado sin éxito que se transfiera a Serbia."
 Sweden.28.o1: "Lo tenemos."
