 SWE_ericsson_manufacturer: "Ericsson"
 SWE_ericsson_manufacturer_desc: "Fundada en un taller de Estocolmo en 1876 y todavía la razón por la que un país de diez millones establece normas de telecomunicaciones el resto del mundo entonces adopta. Ericsson construye las redes de acceso a la radio que transportan un tercio del tráfico móvil del mundo, y su división de microondas armado defensa aérea sueca con radar hasta que se vendió a Saab."
 SWE_ericsson_manufacturer_trait: "Patrimonio de Radio Systems"
 SWE_ericsson_manufacturer_mio_header_networks: "Redes y despliegue"
 SWE_ericsson_manufacturer_mio_header_research: "Investigación y Normas"
 SWE_ericsson_radio_base_stations: "Estaciones de radio"
 SWE_ericsson_radio_base_stations_desc: "El mástil, el armario y el enlace de backhaul. Herrajes sin memoria que decide si existe una red en absoluto."
 SWE_ericsson_mobile_core_network: "Red de núcleo móvil"
 SWE_ericsson_mobile_core_network_desc: "Cambio, registros de suscriptores y facturación. Quien suministra el núcleo mantiene al operador como cliente durante una década."
 SWE_ericsson_national_rollout: "Nacional Rollout"
 SWE_ericsson_national_rollout_desc: "Las obligaciones de cobertura escritas en la licencia convierten una construcción comercial en infraestructura nacional."
 SWE_ericsson_export_contracts: "Contratos de exportación"
 SWE_ericsson_export_contracts_desc: "Los operadores en el extranjero compran la red de referencia Suecia construida en casa, y el contrato de mantenimiento que lo sigue."
 SWE_ericsson_hardened_military_links: "Enlaces militares endurecidos"
 SWE_ericsson_hardened_military_links_desc: "Los portadores cifrados y resistentes a la mermelada para las fuerzas armadas, construidos en la red civil pero diseñados para sobrevivir sin ella."
 SWE_ericsson_research_laboratory: "Investigación"
 SWE_ericsson_research_laboratory_desc: "Una organización permanente de investigación en lugar de una oficina de proyecto, que es lo que permite a un proveedor liderar un estándar en vez de implementar uno."
 SWE_ericsson_radio_chipset_design: "Diseño de Radio Chipset"
 SWE_ericsson_radio_chipset_design_desc: "Diseñar el silicio de la banda base elimina una dependencia y captura el margen que va con él."
 SWE_ericsson_standards_leadership: "Liderazgo de normas"
 SWE_ericsson_standards_leadership_desc: "Presidir el grupo de trabajo vale más que ganar cualquier licitación única: el estándar está escrito alrededor de lo que usted ya puede construir."
 SWE_ericsson_expanded_operations: "Operaciones ampliadas"
 SWE_ericsson_expanded_operations_desc: "Programas más paralelos que un único contrato insignia, y el personal para ejecutarlos."
 SWE_ericsson_signals_support_division: "División de Apoyo a las Firmas"
 SWE_ericsson_signals_support_division_desc: "Trabajos silenciosos para el establecimiento de la defensa, aprovechando los mismos conocimientos radiofónicos que venden estaciones base."
 SWE_ericsson_integrated_network_house: "Casa de red integrada"
 SWE_ericsson_integrated_network_house_desc: "Silicio, radio, núcleo y estándares bajo un techo. Pocos proveedores en cualquier lugar pueden pujar toda la pila."
 Sweden.320.t: "Un campeón o varios"
 Sweden.320.d: "Saab ha absorbido a Celsius, y con él la mayor parte de lo que quedaba de fabricación sueca de defensa. Bruselas aprobará la fusión sólo contra las inmersiones, y la pregunta es qué tan profunda van. Mantener el todo dentro de Saab da a un país de nueve millones de una sola empresa capaz de construir un luchador; recortarlo preserva la competencia que un mercado de este tamaño puede no ser capaz de apoyar."
 Sweden.320.a: "Mantén a Saab como el campeón nacional"
 Sweden.320.b: "Divest profundamente y mantener la base de proveedores competitivo"
 Sweden.321.t: "Vendido con la fábrica acoplada"
 Sweden.321.d: "Nadie compra un Gripen porque es barato. Saab lo vende con compensaciones: montaje local, transferencia de tecnología, participación industrial vale una gran parte del contrato. Sudáfrica, Hungría y la República Checa fueron todos ganados de esa manera. El modelo mueve aeronaves, y cada acuerdo da a un cliente parte de la capacidad que hizo Suecia vale la pena comprar."
 Sweden.321.a: "Vender el paquete industrial, no sólo el avión"
 Sweden.321.b: "Mantener el trabajo sensible en Suecia"
 Sweden.322.t: "Brazil Says Gripen"
 Sweden.322.d: "Brasil ha elegido el Gripen NG sobre el Rafale y el Super Hornet, treinta y seis aeronaves contra un paquete de transferencia de tecnología que pone a Embraer dentro del programa. Es la mayor exportación que Saab ha firmado, y hace de la próxima generación del avión un producto sueco-brasileño en lugar de puramente sueco."
 Sweden.322.a: "Tomar el orden y compartir la plataforma"
 Sweden.322.b: "Mantener a la próxima generación un programa nacional"
 Sweden.323.t: "Devolviendo a los Yards"
 Sweden.323.d: "Kockums construye submarinos de Suecia y ThyssenKrupp lo posee, y la relación se ha roto lo suficientemente lejos que el estado ha cancelado los contratos y enviado funcionarios para retirar el equipo del patio. Saab está dispuesto a comprarlo. Hacerlo devuelve la construcción submarino a manos suecas a un precio fijado por un vendedor que ahora no tiene otro comprador."
 Sweden.323.a: "Comprar Kockums y repatriar los patios"
 Sweden.323.b: "Mantener la construcción a través de un propietario extranjero"
 Sweden.324.t: "La aplicación"
 Sweden.324.d: "Suecia ha solicitado unirse a la OTAN, y dos siglos de no alineación formal terminan con ella. Para Saab cambia al cliente: requisitos de interoperabilidad, adquisición de alianzas y un rearme europeo que ya ha llenado los libros de pedidos. También termina el argumento de que un avión sueco es la única opción que viene sin una alianza adjunta."
 Sweden.324.a: "Construir para la alianza"
 Sweden.324.b: "Mantenga una línea independiente que los clientes pueden comprar sin unirse a nada"
 Sweden.325.t: "Lo que Saab Became"
 Sweden.325.d: "Un cuarto de siglo de consolidación, compensación, un orden brasileño y un patio submarino repatriado ha resuelto lo que es Saab, y lo que un país de nueve millones todavía puede construir para sí mismo: quién compra el avión, y cuya alianza los sensores están conectados."
 Sweden.325.a: "Un exportador aliado con los libros de pedidos completos"
 Sweden.325.b: "Un exportador que no responde a ninguna alianza"
 Sweden.325.c: "Un especialista dentro de la alianza de otro"
 Sweden.325.e: "Un arsenal que en su mayoría se arma"
 SWE_saab_allied_arms_exporter: "Exportador de armas aliadas"
 SWE_saab_allied_arms_exporter_desc: "Saab vende cazas, sensores y submarinos en una alianza que ha decidido rearme, y patios suecos y líneas de montaje son los que los construyen. Poseer la capacidad significa que el libro de pedidos es un activo nacional en lugar de una relación con el cliente."
 SWE_saab_non_aligned_exporter: "Non-Aligned Exporter"
 SWE_saab_non_aligned_exporter_desc: "Saab todavía vende el avión con la fábrica adjunta, a los compradores que quieren capacidad sin una alianza adherida a él. El mercado es más pequeño y la independencia es el producto."
 SWE_saab_alliance_specialist: "Especialista en Alianza"
 SWE_saab_alliance_specialist_desc: "Saab construye los sensores, alerta temprana aérea y submarinos que la alianza no puede generar fácilmente en otro lugar, y compra el resto. La especialización gana un asiento; no gana una base de producción completa."
 SWE_saab_domestic_arsenal: "Arsenal interno"
 SWE_saab_domestic_arsenal_desc: "Saab construye principalmente para Suecia, en términos suecos, a volúmenes suecos. La ingeniería sobrevive intacta y los costos de unidad son lo que son cuando nadie más los comparte."