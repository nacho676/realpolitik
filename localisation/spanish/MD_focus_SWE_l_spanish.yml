 Sweden_foci.1001.t: "Suecia explora la adquisición de aeronaves de combate complementario"
 Sweden_foci.1001.d1: "El gobierno sueco está considerando la compra de jets adicionales para complementar su flota Gripen existente. La participación en este proceso de adquisiciones con los Estados Unidos podría influir significativamente en nuestras futuras relaciones diplomáticas y militares, lo que podría mejorar las alianzas estratégicas e interoperabilidad."
 Sweden_foci.1001.d2: "El gobierno sueco está considerando la compra de jets adicionales para complementar su flota Gripen existente. La participación en este proceso de adquisición con Rusia podría influir significativamente en nuestras futuras relaciones diplomáticas y militares, afectando potencialmente a alineamientos geopolíticos y colaboraciones de defensa."
