l_spanish:
 CHI_NKO_bilateral_cooperation: "Tratado de Amistad Sino-DPRK"
 CHI_NKO_bilateral_cooperation_desc: "El Tratado de Amistad, Cooperación y Asistencia Mutua firmado en 1961 entre la República Popular Democrática de Corea y la República Popular Democrática de Corea sigue siendo el único tratado de defensa mutua que cualquier nación tiene. Reafirmando sus compromisos revitaliza una relación que tanto Beijing como Pyongyang han permitido enfriar, abriendo la puerta a una cooperación estructurada en todos los ámbitos económicos, militares y políticos."
 CHI_NKO_border_trade_zones: "Hwanggumpyong Zona Económica"
 CHI_NKO_border_trade_zones_desc: "La isla de Hwanggumpyong se encuentra en el río Yalu entre Sinuiju y Dandong. Conjuntamente designado como zona económica especial en 2011, el proyecto se detuvo debido a la fricción política. Revivir la inversión china en la zona de Hwanggumpyong restablece el corredor del río Yalu como columna vertebral del comercio bilateral."
 CHI_NKO_rason_sez: "Rajin-Sonbong Puerto de Libre Comercio"
 CHI_NKO_rason_sez_desc: "La Zona Económica Especial Rason, formada por la fusión de Rajin y Sonbong, da a China acceso portuario del Pacífico sin hielo. La inversión china desarrolla Container Terminal 3 en Rajin Port, fabricación ligera y los enlaces de carretera y ferrocarril que conectan la zona con la frontera china en Tumen y Hunchun."
 CHI_NKO_dandong_trade_hub: "Corredor de Comercio Sinuiju-Dandong"
 CHI_NKO_dandong_trade_hub_desc: "Dandong maneja más del 70% de todas las mercancías que cruzan la frontera China-DPRK. Ampliar la infraestructura aduanera y de almacenamiento Dandong, junto con la limpieza simplificada en el Puente de la Amistad, cementa la ciudad como la columna comercial irremplazable de la relación bilateral."
 CHI_NKO_mineral_extraction: "Concesiones Musan Iron Ore"
 CHI_NKO_mineral_extraction_desc: "La mina de mineral de hierro abierto Musan en la provincia de Hamgyong del Norte es uno de los mayores depósitos de mineral de hierro en Asia. Grupos chinos, entre ellos el CITIC y la Tonghua Iron y Steel Company, han firmado contratos de extracción que otorgan acceso a cambio de capital e infraestructura. Las concesiones se extienden a la magnesita del sur de Hamgyong y antracita de la cuenca de Anju."
 CHI_NKO_fisheries_agreement: "West Korea Sea Fishing Compacto"
 CHI_NKO_fisheries_agreement_desc: "Corea del Norte ha vendido licencias anuales de pesca en el Mar de Corea del Oeste a flotas chinas que operan en aguas que los pescadores coreanos dependían una vez. Formalizar esto en un pacto bilateral proporciona a Pyongyang ingresos previsibles de licencias al tiempo que da cobertura legal a las empresas pesqueras chinas para operaciones que han impulsado repetidamente protestas de Seúl y Tokio."
 CHI_NKO_yuan_settlement: "Acuerdo del Banco Comercial de Koryo"
 CHI_NKO_yuan_settlement_desc: "El Banco Comercial de Koryo y la sucursal del Banco de China Dandong han manejado durante mucho tiempo las corrientes financieras informales que subyacen al comercio bilateral. Establecer acuerdos formales de limpieza de yuan elimina la exposición del dólar que somete a los comerciantes norcoreanos a sanciones secundarias, incrustando la economía DPRK más profundamente en la infraestructura financiera china."
 CHI_NKO_labor_export: "Dongbei Labor Dispatch programa"
 CHI_NKO_labor_export_desc: "El despacho de trabajo organizado por el Estado envía decenas de miles de trabajadores norcoreanos a fábricas, obras y restaurantes en Liaoning, Jilin y Heilongjiang. Los trabajadores son reclutados a través de agencias gubernamentales y enviados bajo contratos que remiten la mayoría de los salarios directamente a Pyongyang, haciendo del programa Dongbei una fuente primaria de moneda dura para el régimen."
 CHI_NKO_yalu_river_bridge: "Sinuiju-Dandong segundo cruce"
 CHI_NKO_yalu_river_bridge_desc: "El New Yalu River Bridge, un tramo de cuatro vías completado en 2014 a expensas chinas, conecta la zona de desarrollo ribereño de Dandong directamente con las afueras de Sinuiju. A pesar de estar sin usar durante años sin un camino de conexión en el lado norcoreano, abrir el cruce transforma la capacidad de carga en el corredor más crítico de la frontera."
 CHI_NKO_energy_cooperation: "CNPC Dandong oleoducto"
 CHI_NKO_energy_cooperation_desc: "China National Petroleum Corporation opera el único oleoducto hacia Corea del Norte, que va desde Dandong al complejo químico Ponghwa cerca de Sinuiju. China suministra prácticamente todo el petróleo crudo de la República Popular Democrática de Corea a través de esta única arteria, dando a Beijing una palanca no expresa sobre la economía norcoreana. Ampliar el rendimiento y ampliar las exportaciones de electricidad desde Liaoning asegura la base industrial de Corea del Norte."
 CHI_NKO_telecom_network: "Koryolink 3G Rollout"
 CHI_NKO_telecom_network_desc: "Koryolink, la red móvil de Corea del Norte, fue construida con inversión en Orascom egipcio pero sus cadenas de equipos funcionan fuertemente a través de proveedores chinos. Ampliar la participación china a través de los rodillos de hardware Huawei y ZTE 3G más allá de Pyongyang a las ciudades provinciales, mientras que los enlaces de fibra transfronteriza proporcionan al gobierno de DPRK una columna vertebral controlada pero funcional de banda ancha."
 CHI_NKO_power_grid_link: "Enlace de rejilla hidroeléctrica Supung"
 CHI_NKO_power_grid_link_desc: "La estación hidroeléctrica Supung en el río Yalu fue construida en la década de 1940 y ha suministrado electricidad tanto a Liaoning como a Corea del Norte desde entonces. Rehabilitar la infraestructura de transmisión compartida y formalizar el acuerdo de interconexión de red estabiliza el suministro de energía a Pyongyang y al norte industrial, permitiendo que la producción de fábrica se recupere."
 CHI_NKO_paektu_tourism: "Paektusan-Changbaishan pasillo"
 CHI_NKO_paektu_tourism_desc: "Mt. Paektu, el pico volcánico que rodea a la provincia de Ryanggang y Jilin, es simultáneamente el origen sagrado de la mitología fundadora de la dinastía Kim y un destino importante para los turistas chinos que visitan Changbaishan. El desarrollo de la infraestructura turística integrada en ambos lados de la frontera captura el gasto de visitantes chinos al tiempo que da a Pyongyang una ventana cuidadosamente curada al mundo exterior."
 CHI_NKO_defense_consultations: "PLA-KPA habla con el personal general"
 CHI_NKO_defense_consultations_desc: "Desde la guerra de Corea han existido canales formales entre el Departamento General del PLA y el Buró Político General del KPA, pero con frecuencia han desaparecido. El restablecimiento de consultas regularizadas a nivel del vicejefe crea un foro estructurado para compartir evaluaciones de amenazas, coordinar las respuestas a los ejercicios entre Estados Unidos y el Reino Unido y prevenir la mal cálculo a lo largo de la frontera."
 CHI_NKO_military_exchanges: "Programa de intercambio universitario de defensa nacional"
 CHI_NKO_military_exchanges_desc: "La Universidad Nacional de Defensa del PLA en Beijing acepta oficiales de la DPRK para cursos superiores de mando, mientras que los agregados militares chinos obtienen mayor acceso a las instalaciones de capacitación del KPA a cambio. El programa construye una generación de comandantes norcoreanos familiarizados con la doctrina y el equipo del PLA, profundizando la interoperabilidad y redes personales que superan cualquier acuerdo político único."
 CHI_NKO_joint_naval_patrols: "Patrulla marítima de mar amarillo compacta"
 CHI_NKO_joint_naval_patrols_desc: "La Flota del Mar del Norte PLAN y el Mando Naval de KPA coordinan los horarios de patrulla en el Mar Amarillo para abordar el transbordo ilegal, la pesca no autorizada por flotas de terceros, y el monitoreo de grupos de transportistas estadounidenses. Una línea de comunicación marítima bilateral reduce el riesgo de incidentes en el mar y establece China como garante naval de facto de Corea del Norte."
 CHI_NKO_air_defense_umbrella: "Red de defensa aérea del noreste de Asia"
 CHI_NKO_air_defense_umbrella_desc: "Las estaciones de radar de la Fuerza Aérea PLA en Liaoning y Jilin ya observan la península coreana. Al vincular sus feeds de alerta temprana a los centros de mando de la Fuerza Aérea de KPA y compartir datos de detección sobre el caballo, Corea del Norte da tiempo de advertencia eficaz contra cualquier ataque aéreo estadounidense o surcoreano, sin exigir que Pyongyang desarrolle la infraestructura de forma independiente."
 CHI_NKO_arms_transfers: "Contratos de suministro KOMID"
 CHI_NKO_arms_transfers_desc: "La Korea Mining Development Trading Corporation es la principal agencia de adquisiciones de armas del DPRK y ha facilitado históricamente transferencias tecnológicas de empresas estatales chinas de defensa. Formalizing supply contracts for artillery components, armored vehicle parts, and ammunition fills critical gaps in KPA preparedness while providing Chinese defense firms with a low-visibility export customer."
 CHI_NKO_buffer_state_doctrine: "Lips y Doctrina de dientes"
 CHI_NKO_buffer_state_doctrine_desc: "La frase tan cercana como los labios y dientes ha descrito la relación China-DPRK desde la Guerra de Corea. Codificar esto en la doctrina estratégica formal reconoce que ninguna nación puede aceptar el colapso o alineación extranjera del otro. Para Beijing, un búfer norcoreano evita que las fuerzas estadounidenses y ROK lleguen al Yalu. Para Pyongyang, el respaldo estratégico chino sigue siendo la garantía definitiva de supervivencia del régimen."
 CHI_NKO_party_to_party_dialogue: "Acuerdo del comité central CPC-WPK"
 CHI_NKO_party_to_party_dialogue_desc: "Las relaciones entre el Partido Comunista Chino y el Partido de los Trabajadores Coreanos preceden a ambos estados e históricamente se han llevado a cabo por canales del partido en lugar de diplomáticos. La reactivación del marco de enlace del Comité Central da a Beijing una línea directa al Politburo WPK que supera las formalidades estatales y permite que se produzcan debates delicados sin antecedentes públicos."
 CHI_NKO_cultural_exchanges: "Intercambio con la compañía artística Mansudae"
 CHI_NKO_cultural_exchanges_desc: "El Mansudae Art Studio y sus grupos de actuación representan la máxima expresión de la cultura revolucionaria DPRK. Enviar conjuntos Mansudae a Beijing y Shangai mientras las delegaciones de cine y ópera china visitan Pyongyang construye la narrativa pública de solidaridad fraterna y proporciona al régimen imágenes propagandísticas de los públicos chinos que celebran logros coreanos."
 CHI_NKO_un_coordination: "Acuerdo de protección del veto de la UNSC"
 CHI_NKO_un_coordination_desc: "El asiento permanente de China en el Consejo de Seguridad de la ONU se ha utilizado repetidamente para regar o bloquear resoluciones dirigidas contra Corea del Norte. Formalizar la coordinación entre diplomáticos chinos y norcoreanos en la ONU asegura que los vetos de Beijing se desplieguen estratégicamente para proteger a Pyongyang de las medidas más duras, manteniendo al mismo tiempo la apariencia de compromiso constructivo."
 CHI_NKO_un_coordination_tt: "§Y[CHI.GetNameWithFlag]§! vetará toda sugerencia de la ONU contra §Y[NKO.GetNameWithFlag]§!"
 CHI_NKO_sanctions_circumvention: "Red de la empresa frontal Zokwang"
 CHI_NKO_sanctions_circumvention_desc: "Zokwang Trading y una red de compañías afiliadas de conchas registradas en Dandong, Shenyang y Hong Kong mueven mercancías sancionadas, procesan transferencias financieras prohibidas y facilitan las transferencias de petróleo crudo de barco a barco que sustentan el suministro de combustible de Corea del Norte. La profundización de la tolerancia china de esta infraestructura proporciona a Pyongyang una línea de vida indispensable, a costa de exponer las entidades chinas a sanciones secundarias estadounidenses."
 CHI_NKO_strategic_partnership: "Alianza de cooperación estratégica"
 CHI_NKO_strategic_partnership_desc: "Elevar la relación bilateral con una Alianza Integral de Cooperación Estratégica, el nivel más alto de clasificación diplomática china, coloca a la República Popular Democrática de Corea junto con Rusia y Pakistán en el anillo interno de la alineación estratégica china. La declaración compromete a ambas partes a celebrar consultas sobre todas las principales cuestiones y señales internacionales a Washington, Seúl y Tokio que Beijing considera que la seguridad norcoreana es inseparable de sí misma."
 CHI_nko_juche_production: "Producción de reservas masivas"
 CHI_nko_juche_production_desc: "Los trabajadores norcoreanos enviados a través del programa de trabajo de Dongbei traen una disciplina industrial distinta formada por décadas de doctrina de autosuficiencia Juche: la capacidad para sostener la producción de alto volumen de diseños simples y probados bajo un mínimo exceso. Integrar esta fuerza de trabajo en la red de subcontratación Dandong-area de NORINCO reduce los costos por unidad y amplía la capacidad de producción a través del rango de equipo de infantería de la oficina."
 NKO_chi_manufacturing_assistance: "Normas de fabricación china"
 NKO_chi_manufacturing_assistance_desc: "La asistencia técnica de las empresas estatales chinas, principalmente subsidiarias NORINCO que operan a través de la Korea Mining Development Trading Corporation, ha transferido tolerancias estandarizadas de producción, procedimientos de control de calidad y especificaciones de componentes a las fábricas de armas ligeras del 1er Bureau. El resultado es una reducción de las tasas de chatarra, un rendimiento balístico más consistente y menores costos unitarios en las líneas de armas pequeñas y merecidas por la tripulación."
 CHI_NKO_border_trade_idea: "Zona comercial Hwanggumpyong"
 CHI_NKO_energy_supply_idea: "CNPC Acuerdo de suministro de combustible"
 CHI_NKO_telecom_idea: "Programa de infraestructura Koryolink"
 CHI_NKO_telecom_idea_desc: "Una empresa conjunta que expande la infraestructura móvil y de datos de Koryolink, vinculando las telecomunicaciones norcoreanas con las redes chinas y mejorando las comunicaciones a través de la frontera."
 CHI_NKO_shared_modifier: "[CHI.GetAdjectiveCap]-[NKO.GetAdjectiveCap] Relación"
 CHI_NKO_shared_modifier_desc: "Rastrea la profundidad acumulada de la cooperación Sino-DPRK en todos los ámbitos económicos, militares y políticos. Los vínculos más fuertes mejoran la producción agrícola e industrial, las relaciones comerciales, la eficiencia de las fábricas y las exportaciones de recursos al tiempo que refuerzan la planificación, organización y defensa aérea del ejército; una mayor alineación también amplía la capacidad de inteligencia y aumenta Poder político y Apoyo a la guerra mientras los dos estados se coordinan más estrechamente."
 CHI_eternal_allies: "Alianza Juche-Comunista"
 CHI_NKO_telecom_network_tt: "[CHI_NKO_telecom_idea_desc]\n"
 CHI_NKO_no_influence_puppet_TT: "El sistema de influencia no puede subyugar §Y[NKO.GetNameWithFlag]§!. La subordinación formal de Corea del Norte pasa por el árbol de enfoque conjunto Sino-DPRK, culminando en el acuerdo de Beijing."