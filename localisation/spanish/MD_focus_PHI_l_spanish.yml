 PHI_corruption_strength_exact_tt: "§YCorrupción§! reducidos §R[?PHI_corruption_roll|0]§! (Current: §Y[?PHI_corruption_strength|0]§!)"
 PHI_edsa_dos_category: "La crisis de EDSA Dos"
 PHI_edsa_dos_category_desc: "Las acusaciones de corrupción han desestabilizado a la administración. El juicio político ha paralizado el gobierno. La gente observa y se impacienta. Toma la decisión §YAbrir el segundo sobre§! antes de que expire el temporizador."
 PHI_the_people_grow_disillusioned: "La gente crece desilusionada..."
 PHI_the_people_grow_disillusioned_desc: "El voto del Senado para suprimir las pruebas clave de impeachment ha indignado al público. Cientos de miles están convergiendo en el Santuario EDSA. El reloj se acaba."
 PHI_open_the_second_envelope: "Abrir el segundo sobre"
 PHI_open_the_second_envelope_desc: "Pese al voto 11-10 del senado para suprimirla, aún tenemos el poder de permitir que se abra la controvertida prueba. Nos dañará políticamente, pero puede ser la única forma de preservar la confianza institucional e impedir que caiga el gobierno."
 PHI_edsa_corruption_below_55_tt: "§YLa fuerza de la corrupción§! debe estar por debajo §Y55§! (Current: [?PHI.PHI_corruption_strength|Y0])"
 PHI_edsa_stability_above_60_tt: "§Y§! debe estar por encima de §Y60%§!"
 PHI_edsa_dos_impeachment_atmosphere: "Impeachment Paralysis"
 PHI_edsa_dos_impeachment_atmosphere_desc: "El juicio por impeachment domina todas las noticias transmitidas. El capital político está sangrando diariamente mientras la nación observa la lucha de la administración por la supervivencia."
 PHI_edsa_dos_recovery_spirit: "Post-EDSA Stabilisation"
 PHI_edsa_dos_recovery_spirit_desc: "La nueva administración ha asumido el poder bajo circunstancias extraordinarias. Las promesas de reforma están generando un optimismo público cauteloso, aunque persisten profundas heridas políticas."
 PHI.1.t: "Explosiones de Escándalo Juetengate"
 PHI.1.d: "Un denunciante ha venido acusando al Presidente Joseph Estrada y a miembros de su círculo interno de recibir millones en sobornos jueteng. La indignación pública está creciendo rápidamente a medida que los informes de los medios exponen capas más profundas de corrupción dentro de la administración. Las figuras de oposición, los líderes de la iglesia y las organizaciones de la sociedad civil han comenzado a organizar manifestaciones que exigen responsabilidad del gobierno. Con tensiones crecientes en todo el país, la administración debe decidir ahora cómo responderá a los disturbios cada vez mayores. O enfrentar el fin de la administración por completo."
 PHI.1.a: "Esto puede ir en espiral hacia algo más grande..."
 PHI.2.t: "Fin de la Línea"
 PHI.2.d: "Comenzó con un paseo. Cuando el Senado votó 11-10 para suprimir las pruebas clave de impeachment, todo el equipo de la fiscalía abandonó la sala de audiencias. En pocas horas, cientos de miles de filipinos habían comenzado a inundar el Santuario EDSA en una manifestación masiva recordando la Revolución del Poder Popular original de 1986. Dentro de días, las Fuerzas Armadas de Filipinas y la Policía Nacional Filipina retiraron su apoyo de la administración. Los secretarios del Gabinete renunciaron en masa. El Presidente Hilario Davide Jr. administró el juramento de su cargo a la Vicepresidenta Gloria Macapagal-Arroyo. Joseph Estrada partió del Palacio Malacañang sin renunciar formalmente. Comienza un nuevo capítulo."
 PHI.2.a: "La gente ha hablado."
 PHI.3.t: "Inauguración de Gloria Macapagal Arroyo"
 PHI.3.d: "Al igual que después de que Joseph Estrada dejara su cargo como presidente de Filipinas, Gloria Arroyo, El vicepresidente de Joseph Estrada del partido £PHI_conservatism Lakas-CMD ha sido jurado como el 14.º presidente de Filipinas. Aunque algunos pueden decir que la ascensión de Arroyo a la presidencia fue ilegítima, el pueblo se regocija como otro líder corrupto ha sido derrotado con los bloques de revolución y protesta. Aunque la administración Arroyo tomará tiempo para recuperarse, el cambio podría finalmente estar en el aire como Arroyo promete reparar las heridas del ex presidente que fue derribado."
 PHI.3.a: "El cambio podría estar en el aire."
 PHI.4.t: "El Segundo Envélope está abierto"
 PHI.4.d: "Después de días de agitación política, el Senado ha votado para abrir el polémico «Second Envelope».Lo que se esperaba se convertiría en el momento decisivo del juicio por impeachment trae un breve suspiro de alivio en toda la nación. Con la evidencia que ahora entra en el proceso judicial, los fiscales abandonan los planes para una caminata masiva y piden a otra revolución popular que pierda rápidamente impulso.\nEl presidente Joseph Estrada sobrevive a la tormenta política del día, pero su gobierno sigue profundamente herido. Las denuncias de corrupción siguen dominando los titulares, los mercados financieros siguen siendo incómodos y tanto los aliados como los opositores entienden que la batalla por el impeachment está lejos de terminar. El gobierno ha evitado el colapso, pero su futuro ahora descansa totalmente en los resultados del juicio."
 PHI.4.a: "La República tiene... por ahora."
 PHI.5.t: "La campaña Mindanao termina"
 PHI.5.d: "Los últimos mandos de base organizados del Frente Islámico de Liberación Moro han sido sobrecorridos. Lo que queda del Frente es un puñado de comandantes fugitivos sin territorio, ingresos o una cadena de mando capaz de coordinarlos. El Comando Sur ha entregado la responsabilidad de los municipios recuperados a las autoridades civiles, y las Fuerzas Armadas se están reduciendo a la fuerza de la guarnición.\n\nLa insurgencia termina sin una firma en cualquier documento. Si las quejas que la produjeron han terminado con ella es otra pregunta enteramente."
 PHI.5.a: "Mindanao está bajo nuestra autoridad."
 PHI.6.t: "El Acuerdo Integral sobre el Bangsamoro"
 PHI.6.d: "Tras años de negociación interrumpida por Malasia, el Gobierno y el Frente Moro Islámico de Liberación han firmado un acuerdo amplio. El Frente desactivará sus armas y combatientes bajo verificación independiente. A cambio, la Región Autónoma de Mindanao Musulmana da paso a una entidad Bangsamoro con su propio parlamento, una parte definida de los ingresos nacionales y autoridad sobre sus asuntos internos.\n\nLa transición costará a Manila mucho dinero y una medida de soberanía sobre el sur. También termina cuatro décadas de guerra."
 PHI.6.a: "La paz vale el precio."
 PHI.7.t: "La Rebelión más larga está rota"
 PHI.7.d: "Los frentes guerrilleros del Nuevo Ejército Popular han sido desmantelados en una región a la vez. Sus comités regionales han sido capturados o dispersos, sus redes fiscales rurales se han roto y lo que queda del Comité Central no dirige nada desde el exilio en los Países Bajos.\n\nEl Partido Comunista de Filipinas lanzó su prolongada guerra popular en 1969. Ha superado desde entonces la dictadura de Marcos, cuatro presidentes y todo proceso de paz. No superará a este."
 PHI.7.a: "Cincuenta años de guerra han terminado."
 PHI.8.t: "Liquidación en Oslo"
 PHI.8.d: "El Gobierno noruego ha acogido la ronda final de conversaciones entre Manila y el Frente Nacional Democrático. El acuerdo otorga amnistía a los presos políticos y compromete al gobierno a un programa de reforma agraria e inversión rural. A cambio, el Nuevo Ejército Popular se desmovilizará permanentemente y el Frente impugnará el poder a través de partidos legales.\n\nLos Hardliners de ambos lados denuncian el acuerdo. Ninguno manda a las fuerzas a continuar sin el otro."
 PHI.8.a: "La guerra termina en la mesa."
 PHI.9.t: "La Ley contra la dinastía pasa"
 PHI.9.d: "En contra de todas las expectativas, el Congreso ha aprobado legislación habilitante para el artículo II, sección 26 de la Constitución. Los familiares de los funcionarios titulares en el segundo grado de consanguinidad no pueden tener éxito ni ocupar cargos simultáneamente en la misma jurisdicción.\n\nLos clanes provinciales que han suministrado gobernadores, congresistas y presidentes por generaciones se enfrentan ahora a un mapa electoral que no pueden heredar. El liderazgo del partido está abierto a los candidatos sin familia detrás de ellos, y una gran cantidad de carreras terminó el momento en que el presidente firmó."
 PHI.9.a: "Las familias no son dueñas de la República."
 PHI_news.1.t: "Estrada en la Revolución del Poder Popular Segundo"
 PHI_news.1.d: "El Presidente Joseph Estrada se ha visto obligado de su cargo después de días de manifestaciones masivas y el colapso de sus procesos de impeachment provocó una crisis política en Manila. A medida que las Fuerzas Armadas y la Policía Nacional Filipina retiraron su apoyo al presidente asfixiado, el vicepresidente Gloria Macapagal Arroyo juró el cargo, poniendo fin a la administración de Estrada. Los gobiernos de toda Asia han acogido con beneplácito la transferencia pacífica del poder observando atentamente el futuro político de Filipinas."
 PHI_news.1.a: "Un final dramático a la presidencia de Estrada."
 PHI_news.2.t: "La crisis de Estrada sobrevive"
 PHI_news.2.d: "El presidente filipino Joseph Estrada ha climatizado estrechamente lo que parece ser la crisis política más grave de su presidencia. Después de que el Senado votó para admitir la polémica Segunda Envelope en evidencia, el juicio por impeachment reanudó en lugar de colapsar en caos político.\nLa decisión aliviaba temporalmente los temores de las manifestaciones masivas y otro movimiento del Poder Popular, permitiendo que Estrada permaneciera en el cargo mientras continúa el proceso judicial. A pesar de este reprensión, las acusaciones de corrupción siguen arrojando una larga sombra sobre la administración, dejando tanto los gobiernos extranjeros como los mercados financieros inciertos acerca del futuro político del país."
 PHI_news.2.a: "Estrada permanece en el poder."
 PHI_edsa_dos_tt: "§YEl presidente Joseph Estrada ha sido atrapado manejando dinero ilegal, la gente se reúne en las calles. Si no abordamos esto§!, §R este puede ser el fin de toda nuestra administración tal como lo conocemos§!."