 PHI_investigate_corporations: "Investigar Sociedades"
 PHI_investigate_corporations_desc: "Los grandes conglomerados filipinos han disfrutado desde hace tiempo de relaciones acogedoras con reguladores y legisladores. Una investigación enfocada de la contabilidad empresarial, las declaraciones de impuestos y los contratos con el gobierno podría exponer esquemas de soborno y malversación, aunque el resultado depende de cuán arraigada esté la corrupción actualmente.\n\nNivel actual de corrupción: [ROOT.GetPHI_corruption_tier_number]"
 PHI_audit_government_contracts: "Contratos gubernamentales de auditoría"
 PHI_audit_government_contracts_desc: "Los contratos de infraestructura pública y de adquisiciones son fuentes notorias de corrupción, con sobornos y facturas infladas que desvían fondos de los proyectos públicos. Una auditoría exhaustiva de contratos recientes puede descubrir tratos fraudulentos, aunque los funcionarios con algo que ocultar se resistirán al escrutinio.\n\nNivel actual de corrupción: [ROOT.GetPHI_corruption_tier_number]"
 PHI_inspect_tax_bureau: "Inspeccione la oficina fiscal"
 PHI_inspect_tax_bureau_desc: "La Oficina de Ingresos Internos ha estado plagada de denuncias de soborno, asentamientos insuficientes y registros falsificados. Una inspección interna podría recuperar ingresos perdidos y eliminar agentes corruptos, aunque la propia corrupción de la oficina pueda proteger a los peores delincuentes.\n\nNivel actual de corrupción: [ROOT.GetPHI_corruption_tier_number]"
 PHI_investigate_the_military: "Investigar a los militares"
 PHI_investigate_the_military_desc: "Los escándalos de adquisiciones y los soldados fantasma han drenado durante mucho tiempo el presupuesto de las Fuerzas Armadas de Filipinas. Investigar las finanzas militares corre el riesgo de fricción con el cuerpo de oficiales, pero las pesquisas exitosas pueden recuperar fondos robados y restaurar la disciplina en las filas.\n\nNivel actual de corrupción: [ROOT.GetPHI_corruption_tier_number]"
 PHI_purge_local_officials: "Purge funcionarios locales"
 PHI_purge_local_officials_desc: "Las unidades de gobierno local, desde los capitolios provinciales hasta los ayuntamientos de barangay, suelen estar dominadas por dinastías políticas que tratan el cargo público como un negocio familiar. Una purga selectiva de funcionarios locales corruptos puede quebrar su dominio del poder, aunque las dinastías arraigadas pueden resistirse con todo lo que tienen.\n\nNivel actual de corrupción: [ROOT.GetPHI_corruption_tier_number]"
 PHI_trace_offshore_accounts: "Traza Cuentas Offshore"
 PHI_trace_offshore_accounts_desc: "La riqueza mal habida de décadas de corrupción se ha canalizado a menudo a cuentas en el extranjero y empresas fantasma. Rastrear estas cuentas es lento, costoso y diplomáticamente delicado, pero un rastreo exitoso puede recuperar sumas enormes y asestar un golpe severo a las redes que las construyeron.\n\nNivel actual de corrupción: [ROOT.GetPHI_corruption_tier_number]"
 PHI_police_investiture: "Policía Inversión"
 PHI_police_investiture_desc: "Redirigir fondos del gobierno para reforzar la Policía Nacional Filipina, y mejorar la eficacia de los investigadores a costa de un mayor gasto policial."
 PHI_police_investiture_active_tt: "El aumento de la financiación policial está activo. Todas las investigaciones contra la corrupción han mejorado las posibilidades de éxito.\n§R+20%§! costo policial. §R-15§! potencia máxima de mando."
 PHI_corporate_scandal_industry: "Escándalo corporativo"
 PHI_corporate_scandal_industry_desc: "La exposición de la corrupción corporativa de alto valor ha sacudido la confianza de los inversores en nuestro sector industrial."
 PHI_procurement_scandal_construction: "Escándalo de adquisiciones"
 PHI_procurement_scandal_construction_desc: "La corrupción mayor descubierta en los contratos gubernamentales ha frenado la construcción a medida que se revisan los contratos."
 PHI_customs_fraud_tax: "Fraude aduanero expuesto"
 PHI_customs_fraud_tax_desc: "Un anillo de fraude aduanero ha interrumpido la recaudación de impuestos mientras se reestructura la oficina."
 PHI_tax_scandal_investment: "Escandalo de la oficina fiscal"
 PHI_tax_scandal_investment_desc: "La corrupción de alto nivel en la oficina fiscal ha asustado a los inversores extranjeros."
 PHI_military_scandal_org: "Escándalo de la corrupción militar"
 PHI_military_scandal_org_desc: "La corrupción en el personal general ha interrumpido las estructuras de mando y la cohesión unitaria."
 PHI_offshore_fortune_investment: "Fondos Offshore recuperados"
 PHI_offshore_fortune_investment_desc: "Se han reinvertido los activos extraterritoriales confiscados, abriendo nuevos canales de inversión extranjera."
 PHI_locked_corruption: "Corrupción entrelazada"
 PHI_locked_corruption_desc: "§RNo puede cambiar manualmente las leyes de corrupción§!\nAños de política patronal, ineficiencia burocrática e intereses especiales arraigados han dejado la corrupción tejida en el tejido del estado filipino. Los recursos públicos se desvían rutinariamente, la rendición de cuentas sigue siendo débil y las cifras poderosas siguen beneficiándose del statu quo. No se puede lograr una reforma significativa mediante un decreto por sí solo. La lucha contra la corrupción requerirá investigaciones decididas, instituciones más fuertes y un gobierno dispuesto a desafiar a los que se benefician del sistema. "
 PHI_corruption_eradicated: "Gobernanza limpia"
 PHI_corruption_eradicated_desc: "A través de años de reforma sostenida, Filipinas ha logrado algo raro en su historia: un gobierno que funciona con auténtica integridad. Las instituciones son más fuertes, se ha restablecido la confianza pública y el ciclo del injerto se ha roto, por ahora. Mantener esta norma requerirá vigilancia continua."
 PHI_corruption_event.1.t: "Nivel de corrupción reducido"
 PHI_corruption_event.1.d: "Nuestros incesantes esfuerzos han pagado. Se han desmantelado las redes corruptas y se ha establecido un nuevo nivel de rendición de cuentas."
 PHI_corruption_event.1.a: "Avances por fin."
 PHI_corruption_event.2.t: "La corrupción empeora"
 PHI_corruption_event.2.d: "A pesar de nuestros esfuerzos, las fuerzas corruptas han consolidado su control. El soborno y el injerto se han extendido aún más a las instituciones del estado."
 PHI_corruption_event.2.a: "Debemos hacerlo mejor."
 PHI_corruption_event.10.t: "Investigación: Sospechoso de cobertura"
 PHI_corruption_event.10.d: "Nuestros investigadores encontraron un muro de abogados, documentos sellados y pérdida repentina de memoria. Alguien poderoso está cubriendo sus huellas, pero no podemos probarlo."
 PHI_corruption_event.10.a: "Sigue vigilándolos."
 PHI_corruption_event.11.t: "Investigación: La corrupción Encontrada"
 PHI_corruption_event.11.d: "Se ha expuesto un anillo de corrupción de nivel medio que opera en el sector privado. Varios ejecutivos enfrentan cargos y se ha recuperado una parte de fondos mal apropiados."
 PHI_corruption_event.11.a: "Proseguirlos."
 PHI_corruption_event.12.t: "Investigación: Escándalo corporativo"
 PHI_corruption_event.12.d: "Un escándalo corporativo masivo ha sacudido al sector empresarial. Ejecutivos concubrieron con funcionarios del Estado para sifón de fondos públicos. La caída ha sacudido la confianza de los inversores."
 PHI_corruption_event.12.a: "Aprovecha sus activos."
 PHI_corruption_event.13.t: "Investigación: La corrupción de alto valor expuesta"
 PHI_corruption_event.13.d: "Un descubrimiento extraordinario: una red de corrupción corporativa de alto valor que llega a la cima del sector privado ha sido completamente expuesta. Se están incautando Billones de activos."
 PHI_corruption_event.13.a: "Esto no será olvidado."
 PHI_corruption_event.20.t: "Auditoría: No se ha encontrado evidencia"
 PHI_corruption_event.20.d: "La auditoría no resultó nada factible. Cada contrato se fijó en papel. O los libros están limpios o alguien los limpió antes de llegar."
 PHI_corruption_event.20.a: "Lo intentamos."
 PHI_corruption_event.21.t: "Auditoría: Falta de gestión"
 PHI_corruption_event.21.d: "Los auditores descubrieron la contabilidad descuidada y las facturas infladas en varios departamentos. Los fondos mal gestionados han sido anulados."
 PHI_corruption_event.21.a: "Haz que rindan cuentas."
 PHI_corruption_event.22.t: "Auditoría: Contratación Comida de corrupción"
 PHI_corruption_event.22.d: "Se ha abierto una raqueta de adquisiciones arraigada. Los funcionarios estaban adjudicando sistemáticamente contratos a las compañías de proyectiles a cambio de sobornos."
 PHI_corruption_event.22.a: "Desmantelar la red."
 PHI_corruption_event.23.t: "Auditoría: National Embezzlement Revealed"
 PHI_corruption_event.23.d: "Se ha descubierto un esquema de malversación asombrosa que se extiende a través de varios ministerios. La escala del robo de los cofres públicos es un escándalo nacional."
 PHI_corruption_event.23.a: "Esto termina ahora."
 PHI_corruption_event.30.t: "Inspección fiscal: No hay hallazgos"
 PHI_corruption_event.30.d: "Los inspectores no encontraron pruebas contundentes de equivocación. Los agentes eran cooperativos y los registros aparecieron en orden. La investigación cierra sin resultado."
 PHI_corruption_event.30.a: "Vuelvan al trabajo."
 PHI_corruption_event.31.t: "Inspección fiscal: Bribery Discovered"
 PHI_corruption_event.31.d: "Se vio atrapado a varios agentes de impuestos de bajo nivel aceptando sobornos para reducir las evaluaciones. Han sido despedidos y recuperados los impuestos."
 PHI_corruption_event.31.a: "Casa limpia."
 PHI_corruption_event.32.t: "Inspección fiscal: Fraude aduanero expuesto"
 PHI_corruption_event.32.d: "Se ha desmantelado un sofisticado anillo de fraude aduanero. Los contrabandistas habían sobornado a altos agentes para pasar por cargamentos sin trabas durante años."
 PHI_corruption_event.32.a: "Reformar la oficina."
 PHI_corruption_event.33.t: "Inspección fiscal: altos funcionarios implicados"
 PHI_corruption_event.33.d: "Los altos funcionarios de la Oficina de Ingresos Internos han estado implicados en un plan de corrupción sistémico. El escándalo ha alarmado a los inversores extranjeros y ha frustrado la confianza pública."
 PHI_corruption_event.33.a: "Proseguir a cada uno de ellos."
 PHI_corruption_event.40.t: "Investigación militar: pruebas cubiertas"
 PHI_corruption_event.40.d: "Los militares cerraron filas. Nuestros investigadores fueron encontrados con muros de piedra en todos los niveles. Si existe corrupción, se ha enterrado profundamente."
 PHI_corruption_event.40.a: "Volveremos."
 PHI_corruption_event.41.t: "Investigación militar: agentes capturados"
 PHI_corruption_event.41.d: "Varios oficiales de bajo rango fueron atrapados desviando asignaciones de combustible y equipo para obtener ganancias personales. Han sido marcializados por el tribunal."
 PHI_corruption_event.41.a: "Se sirve la justicia."
 PHI_corruption_event.42.t: "Investigación militar: personal general implicado"
 PHI_corruption_event.42.d: "Los miembros del personal general han estado implicados en un anillo de corrupción que incluye contratos de compra de defensa. El escándalo ha interrumpido la cadena de mando."
 PHI_corruption_event.42.a: "Despierten las filas."
 PHI_corruption_event.43.t: "Investigación militar: la figura superior expuesta"
 PHI_corruption_event.43.d: "Una figura militar superior ha estado expuesta públicamente por infundir fondos de defensa durante muchos años. La revelación ha impactado tanto a las fuerzas armadas como al público."
 PHI_corruption_event.43.a: "Nadie está por encima de la ley."
 PHI_corruption_event.50.t: "Purge: No hay resultados significativos"
 PHI_corruption_event.50.d: "Funcionarios locales mantuvieron sus cabezas abajo y la purga encontró poco para actuar. O las redes se callaron o fueron avisadas con antelación."
 PHI_corruption_event.50.a: "Lo intentaremos de nuevo."
 PHI_corruption_event.51.t: "Purge: Se ha encontrado una red de injertos"
 PHI_corruption_event.51.d: "Se ha desmantelado una red de injertos a pequeña escala que opera desde la burocracia local. Un puñado de funcionarios han sido retirados de sus puestos."
 PHI_corruption_event.51.a: "Buena liberación."
 PHI_corruption_event.52.t: "Purge: local Syndicate expuesto"
 PHI_corruption_event.52.d: "Se ha expuesto un importante sindicato local integrado en el gobierno regional. Su remoción ha perturbado las estructuras de poder locales y ha provocado disturbios."
 PHI_corruption_event.52.a: "Estabilidad seguirá."
 PHI_corruption_event.53.t: "Purge: La dinastía política Toppled"
 PHI_corruption_event.53.d: "Se ha derribado una dinastía política arraigada que había controlado el gobierno local durante décadas. Sus activos han sido confiscados, aunque los leales permanecen inquietos."
 PHI_corruption_event.53.a: "Empieza una nueva era."
 PHI_corruption_event.60.t: "Trace Offshore: No hay rastro encontrado"
 PHI_corruption_event.60.d: "Nuestros investigadores financieros golpearon un callejón sin salida. Cada pista se disolvió en compañías anónimas de conchas a través de múltiples jurisdicciones. El dinero ha desaparecido."
 PHI_corruption_event.60.a: "Los perdimos."
 PHI_corruption_event.61.t: "Rastreo de tierra: cuentas menores encontradas"
 PHI_corruption_event.61.d: "Se han identificado y congelado varias cuentas offshore menores vinculadas a funcionarios gubernamentales. Las cantidades son modestas pero el precedente es significativo."
 PHI_corruption_event.61.a: "Congela todo."
 PHI_corruption_event.62.t: "Rastreo de tierra: Red de lavado expuesta"
 PHI_corruption_event.62.d: "Se ha desmantelado una importante red de blanqueo de dinero que transporta fondos a través de cuentas offshore. Se ha repatriado una suma significativa al tesoro filipino."
 PHI_corruption_event.62.a: "Tráelo a casa."
 PHI_corruption_event.63.t: "Offshore Fortune Uncovered"
 PHI_corruption_event.63.d: "Un descubrimiento extraordinario: una vasta fortuna offshore perteneciente a altos funcionarios ha sido descubierta e incautada. La caída del viento es histórica y envía un mensaje poderoso."
 PHI_corruption_event.63.a: "La gente lo sabrá."
 PHI_corruption_event.99.t: "Restablecimiento de la confianza pública"
 PHI_corruption_event.99.d: "Con la vieja dinastía política alejada del poder, las comunidades locales están reconstruyendo lentamente la confianza en sus instituciones. Un sentido del optimismo cauteloso se está apoderando."
 PHI_corruption_event.99.a: "La gente está detrás de nosotros."
 PHI_corruption_event.100.t: "Lo hemos hecho"
 PHI_corruption_event.100.d: "Después de años de intensas investigaciones, enjuiciamientos y reformas institucionales, nuestro impulso anticorrupción ha alcanzado un hito que pocos creían posible. Las arraigadas redes de injerto y patrocinio que una vez paralizado nuestro gobierno han sido desmanteladas. Filipinas se encuentra en el umbral de una nueva era, definida no por lo que roban los funcionarios, sino por lo que construyen."
 PHI_corruption_event.100.a: "Hoy comienza una nueva Filipinas."
 PHI_corruption_event.200.t: "Escándalo de lobby corporativo"
 PHI_corruption_event.200.d: "Los rumores están circulando que un conglomerado mayor ha utilizado donaciones secretas para influir en la legislación reciente. El público está prestando atención, y la oposición huele sangre."
 PHI_corruption_event.200.a: "Ignóralo. No podemos luchar contra todos."
 PHI_corruption_event.200.b: "Iniciar una auditoría limitada."
 PHI_corruption_event.200.c: "Condenarlos públicamente."
 PHI_corruption_event.201.t: "Proyectos fantasma"
 PHI_corruption_event.201.d: "Un informe parlamentario ha encontrado varios proyectos de infraestructura financiados por el Estado sin rastro de terminación: no hay carreteras construidas, no hay edificios en pie, ningún trabajador jamás contratado. El dinero simplemente desapareció."
 PHI_corruption_event.201.a: "Barrenlo debajo de la alfombra."
 PHI_corruption_event.201.b: "Culpa a los funcionarios locales."
 PHI_corruption_event.201.c: "Inicie una investigación oficial."
 PHI_corruption_event.202.t: "Impuesto Leak"
 PHI_corruption_event.202.d: "Un denunciante ha presentado pruebas de que altos funcionarios del gobierno han estado evadiendo impuestos a través de una red de compañías falsas. Los documentos ya circulan en la prensa."
 PHI_corruption_event.202.a: "Maneja esto silenciosamente."
 PHI_corruption_event.202.b: "Haz un ejemplo de ellos."
 PHI_corruption_event.202.c: "Ofrecer indulgencia a cambio de cooperación."
 PHI_corruption_event.203.t: "Fraude de las adquisiciones militares"
 PHI_corruption_event.203.d: "Las investigaciones han revelado envíos de armas desaparecidas destinados a las Fuerzas Armadas de Filipinas. Se firmaron facturas, se registraron entregas, pero el equipo no se encuentra en ninguna parte."
 PHI_corruption_event.203.a: "Desestimar las acusaciones."
 PHI_corruption_event.203.b: "Castigar unos pocos chivos expiatorios."
 PHI_corruption_event.203.c: "Inicie una investigación completa."
 PHI_corruption_event.204.t: "Redes provinciales de mafias"
 PHI_corruption_event.204.d: "Los informes de inteligencia policial han confirmado lo que muchos locales ya sabían: varios funcionarios provinciales y barangay están cooperando activamente con los sindicatos del crimen organizado. El dinero de protección está cambiando las manos a cada nivel."
 PHI_corruption_event.204.a: "Ignóralo."
 PHI_corruption_event.204.b: "Arréstenlos públicamente."
 PHI_corruption_event.204.c: "Reemplazarlos con leales."
 PHI_corruption_event.205.t: "Plan de Kickback Extranjero"
 PHI_corruption_event.205.d: "Evidencias han surgido que las empresas extranjeras de construcción y energía sobornaron a altos funcionarios para asegurar contratos gubernamentales lucrativos. El rastro de papel lleva hasta la capital."
 PHI_corruption_event.205.a: "Negar todo."
 PHI_corruption_event.205.b: "Cláralos tranquilamente."
 PHI_corruption_event.205.c: "Haz un ejemplo público."
 PHI_corruption_event.206.t: "Burtic Rot"
 PHI_corruption_event.206.d: "La pequeña corrupción se ha normalizado cada vez más en todas las oficinas gubernamentales. Los secretarios esperan sobres. Los inspectores necesitan persuadir. Los permisos tienen un precio más allá de su cuota oficial. La cultura de las pequeñas corrupcións está erosionando la confianza institucional."
 PHI_corruption_event.206.a: "Que tengan sus pequeñas ventajas."
 PHI_corruption_event.206.b: "Emitir reformas simbólicas."
 PHI_corruption_event.206.c: "Reasignar a varios funcionarios."
