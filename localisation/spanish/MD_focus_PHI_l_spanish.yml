 PHI_islamism_dynamic_modifier: "El creciente islamismo radical"
 PHI_islamism_dynamic_modifier_tooltip: "El islamismo ha estado separado de Filipinas durante siglos. Recientemente eso ha comenzado a cambiar y la parte sur del país ha visto una radicalización extrema."
 PHI_npa_insurgency_dynamic_modifier: "Guerra popular prolongada"
 PHI_npa_insurgency_dynamic_modifier_tooltip: "El Partido Comunista de Filipinas ha librado la guerra guerrillera rural a través del Nuevo Ejército Popular desde 1969. Sus cuadros de aldeas tributarias, patrullas emboscadas y disputan al gobierno local a través de Luzon, Samar y Mindanao oriental."
 PHI_milf_decisions_category: "El conflicto de Moro"
 PHI_milf_decisions_category_desc: "El conflicto moro se refiere como una serie de conflictos armados dentro de la provincia de Mindanao. El conflicto de Moro comenzó como resultado de la política de reasentamiento aplicada durante el territorio del Commonwealth filipino en 1935. Explotó cuando 11 aprendices militares musulmanes fueron asesinados en Corregidor. El Frente Nacional Islámico Moro se formó poco después en 1969 y desde entonces ha estado en conflicto abierto con las Fuerzas del Gobierno.\n £generic_anarchist_communism_small §R Fuerza de MILF:§! [?PHI.PHI_strength_of_milf|20]%"
 PHI_anti_muslim_propaganda: "Propaganda antimusulmana"
 PHI_anti_muslim_propaganda_desc: "Orientar los medios estatales y los mensajes públicos para contrarrestar la influencia de los grupos insurgentes islamistas radicales que operan en Mindanao."
 PHI_crush_the_moro_insurgency: "Aplastar la insurgencia moro"
 PHI_crush_the_moro_insurgency_desc: "Con el Frente Islámico de Liberación Moro reducido a restos dispersos, las Fuerzas Armadas pueden declarar concluido la campaña Mindanao. El mando de las provincias del sur vuelve al gobierno civil, y la insurgencia termina por la fuerza de armas en lugar de negociar."
 PHI_sign_the_bangsamoro_agreement: "Firmar el Acuerdo Bangsamoro"
 PHI_sign_the_bangsamoro_agreement_desc: "Las conversaciones mediadas por Malasia en Kuala Lumpur han llevado al Frente a la mesa. Un acuerdo integral desmovilizaría a sus combatientes, reemplazaría la Región Autónoma del Mindanao Musulmán por una entidad Bangsamoro con verdaderos poderes fiscales y legislativos y comprometería a Manila a financiar la transición."
 PHI_communist_insurgency_category: "Rebelión del Nuevo Ejército del Pueblo"
 PHI_communist_insurgency_category_desc: "El Rebelión del Ejército Popular Nuevo es la insurgencia comunista más antigua del mundo. El NPA ha estado luchando constantemente desde 1969 contra el gobierno nacional filipino.\n\nEs hora de que pongamos esfuerzo en aplastar esta rebelión.\n £generic_Communist_State_small §R Fuerza de la NPA:§! [?PHI.PHI_strength_of_npa|20]%"
 PHI_sustained_military_offensive: "Sustented Military Offensive"
 PHI_sustained_military_offensive_desc: "Comprometer unidades del ejército y de la policía a despejar los frentes guerrilleros en la Sierra Madre, Samar y el interior de Davao. Los barridos degradan al Nuevo Ejército del Pueblo más rápido que cualquier otro método, pero las operaciones prolongadas en el campo cuestan al gobierno apoyo entre la población rural."
 PHI_peace_and_development_teams: "Equipos de paz y desarrollo"
 PHI_peace_and_development_teams_desc: "Desplegar equipos mixtos civiles y militares en barangays bajo influencia guerrillera, que combinen la construcción de caminos y escuelas con labores de gobierno local. Negar a la insurgencia su base de reclutamiento es más lento que un barrido y bastante más caro, pero no cuesta estabilidad."
 PHI_amnesty_for_returning_cadres: "Amnistía para los cuadros que regresan"
 PHI_amnesty_for_returning_cadres_desc: "Ofrecer inmunidad legal, ayuda en efectivo y apoyo a los medios de vida a los combatientes que entreguen sus armas. Las deserciones masivas vacían los frentes guerrilleros, aunque perdonar a los insurgentes cuesta al gobierno prestigio ante el cuerpo de oficiales y las víctimas de la rebelión."
 PHI_defeat_the_new_peoples_army: "Derrotar al Nuevo Ejército del Pueblo"
 PHI_defeat_the_new_peoples_army_desc: "Los frentes guerrilleros han sido rotos y el Comité Central está esparcido en el extranjero. Declarar la rebelión militarmente derrotada cierra la más larga insurgencia comunista en el mundo."
 PHI_conclude_the_oslo_talks: "Concluir las conversaciones de Oslo"
 PHI_conclude_the_oslo_talks_desc: "Mediadores noruegos han mantenido abierto un canal con el Frente Democrático Nacional durante años. Un acuerdo final cambiaría amnistía política y compromisos de reforma agraria por la desmovilización permanente del Nuevo Ejército del Pueblo."
 PHI_anti_dynasty_law: "Ley contra la dinastía"
 PHI_anti_dynasty_law_desc: "El artículo II, sección 26 de la Constitución de 1987 prohíbe las dinastías políticas, pero el Congreso nunca ha aprobado la legislación de desarrollo, y las familias que dominan el legislativo no tienen motivo para hacerlo. Forzar un proyecto de ley impediría que los parientes de los titulares los sucedan en el cargo, y rompería el dominio de los clanes provinciales sobre la política nacional y abriría la dirección de todos los partidos a candidatos ajenos a las grandes familias."
 PHI_corruption_battle_mechanic_category: "La batalla de la corrupción"
 PHI_corruption_battle_mechanic_category_desc: "Décadas de clientelismo político, instituciones débiles e intereses arraigados han dejado la corrupción profundamente incrustada en casi todos los niveles del gobierno. Erradicarla exigirá investigaciones sostenidas y selectivas en la burocracia, el ejército y el sector privado. A medida que las reformas se consoliden y las instituciones se fortalezcan, las futuras investigaciones serán más fáciles y eficaces.\n\nNivel actual de corrupción:  [Root.GetPHI_corruption_tier_number]\nFuerza actual de la corrupción: [?PHI_corruption_strength|Y0]"
