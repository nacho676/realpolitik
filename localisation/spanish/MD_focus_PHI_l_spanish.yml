 PHI_purge_nothing_tt: "§R70%§!: No hay resultados significativos.\nNo hay cambio."
 PHI_purge_minor_tt: "§Y60%§!: Se encontró una red de injertos a pequeña escala.\n§G-5§! progreso de la corrupción."
 PHI_purge_major_tt: "§Y35%§!: Mayor sindicato local expuesto.\n§G-10§! progreso de la corrupción. §R+1%§! objetivo de resistencia."
 PHI_purge_huge_tt: "§G10%§!: La dinastía política derrocó.\n§G-20§! progreso de la corrupción. §R+2%§! objetivo de resistencia. §G+3%§! estabilidad después de 90 días."
 PHI_offshore_nothing_tt: "§R85%§!: No se ha encontrado rastro.\nNo hay cambio."
 PHI_offshore_minor_tt: "§Y50%§!: Cuentas menores trazadas.\n§G-5§! progreso de la corrupción."
 PHI_offshore_major_tt: "§Y20%§!: Se encontró una red de lavado mayor.\n§G-25§! progreso de la corrupción."
