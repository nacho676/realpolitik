l_spanish:
 MDR_RULE_COVID_DYNAMIC: "Dinámica"
 MDR_RULE_COVID_DYNAMIC_DESC: "El brote empieza en Wuhan en un momento al azar después de 2015 (en promedio, una vez por década) y llega a cada país al azar en los meses siguientes. Las vacunas llegan un año después del brote."

 mdr_industrial_subsidies: "Subsidios industriales"
 mdr_industrial_subsidies_desc: "El Estado paga parte de la inversión de las empresas que construyen fábricas de chips y de materiales avanzados en nuestro territorio, como la Ley de Chips de Estados Unidos en 2022."
 mdr_enact_industrial_subsidies: "Aprobar subsidios industriales"
 mdr_enact_industrial_subsidies_desc: "Atraemos inversión extranjera y aceleramos la construcción de plantas de microchips y compuestos. Cuesta el 0,5% del PIB por año mientras estén activos."
 mdr_end_industrial_subsidies: "Terminar los subsidios industriales"
 mdr_end_industrial_subsidies_desc: "Dejamos de pagar los subsidios. No podremos volver a aprobarlos durante un año."
 mdr_industrial_subsidies_cooldown_tt: "Pasó al menos un año desde que terminamos los últimos subsidios industriales"


 mdr_ammo_shortage_1: "Munición escasa"
 mdr_ammo_shortage_1_desc: "Nos quedan menos de cuatro semanas de munición al ritmo actual de combate. Los oficiales racionan los disparos."
 mdr_ammo_shortage_2: "Falta de munición"
 mdr_ammo_shortage_2_desc: "Nos quedan menos de dos semanas de munición. La artillería dispara solo contra blancos prioritarios."
 mdr_ammo_shortage_3: "Munición agotada"
 mdr_ammo_shortage_3_desc: "Las tropas en el frente se quedan sin balas ni proyectiles. Solo pueden defenderse como pueden."

 uranium: "Uranio"
 uranium_desc: "El uranio natural alimenta las plantas de enriquecimiento, que producen el combustible de los reactores nucleares. Cada planta consume 1 unidad; sin uranio, la producción de combustible nuclear cae."
 mdr_uranium_modifier: "Uranio para el enriquecimiento"
 mdr_uranium_mine: "Mina de uranio"
 mdr_uranium_mine_plural: "Minas de uranio"
 mdr_uranium_mine_desc: "Mina a cielo abierto, subterránea o por lixiviación.\n\nProporciona al estado:\n§YUranio§!: §G+5§! por nivel, §G+1§! más por cada tecnología de minería, multiplicado por la infraestructura y la red eléctrica del estado\nNúmero base de trabajadores requeridos: §Y4.2K§!\nProducto del PIB base: §Y$0.5B§!\nConsumo base de energía: §R-0.03§! GW\n\nEn cualquier estado, hasta 10 niveles. Cada nivel cuesta más que el anterior."

 mdr_early_warning_center: "Centro de alerta temprana"
 mdr_early_warning_center_plural: "Centros de alerta temprana"
 mdr_early_warning_center_desc: "Sismógrafos, radares meteorológicos, sirenas y equipos de emergencia entrenados. Reduce el daño de cualquier desastre en este estado.\n\nNúmero base de trabajadores requeridos: §Y250§!\nConsumo base de energía: §R-0.002§! GW"
 mdr_coastal_dikes: "Diques y defensas costeras"
 mdr_coastal_dikes_plural: "Diques y defensas costeras"
 mdr_coastal_dikes_desc: "Diques, compuertas y muros contra el mar, que se construyen en las provincias costeras. Con uno basta para reducir el daño de los tsunamis, las tormentas tropicales y las inundaciones en su estado."
 mdr_cropland: "Tierras de cultivo"
 mdr_cropland_plural: "Tierras de cultivo"
 mdr_cropland_desc: "Campos de trigo, maíz y arroz, con sus caminos, riego y galpones. Cada nivel cosecha alrededor de un millón de toneladas de cereal por año y da trabajo en el campo.\n\nProporciona al estado:\n§YGranos§!: §G+10§! por nivel, multiplicado por la infraestructura, el suelo y el clima del estado, y §G+1§! más por cada tecnología de §YFertilizantes§! investigada\nNúmero base de trabajadores requeridos: §Y25K§!\nProducto del PIB base: §Y$1.25B§!\n\nSolo se construye en estados con §YSuelo cultivable§!, hasta 10 niveles por estado. Cada nivel de §YDistrito agroindustrial§! en el mismo estado suma §G+3%§! de granos."
 mdr_arable_land: "Suelo cultivable"
 mdr_arable_land_desc: "Este estado tiene tierra donde se puede cultivar: no es desierto, tundra, pantano, selva cerrada ni alta montaña. Permite construir §YTierras de cultivo§!. La calidad del suelo cambia cuánto rinden."
 mdr_soil_rich: "Suelo muy fértil"
 mdr_soil_poor: "Suelo pobre o seco"

 # Munición: barra superior, decisiones, espíritu y modificador.
 MDR_AMMO_TOPBAR_K: "[?mdr_ammo_k|1]K"
 MDR_AMMO_TOPBAR_M: "[?mdr_ammo_m|2]M"
 MDR_AMMO_TOPBAR_LOW: "§R[?mdr_ammo_k|1]K§!"
 MDR_AMMO_TOPBAR_TT: "§YMunición§!\n\nReserva: §Y[?mdr_ammo_k|1]K§! cajas\nCambio diario: §Y[?mdr_ammo_net_k|+2]K§!  ([mdr_ammo_eta_text])\nProducción diaria: §G[?mdr_ammo_gain_k|2]K§!\nCapacidad de almacenamiento: §Y[?mdr_ammo_capacity_k|1]K§!\n\nConsumo diario actual: §R[?mdr_ammo_use_k|2]K§!\nDe eso, maniobras y entrenamiento: §Y[?mdr_ammo_drill_k|2]K§!\nConsumo diario en guerra total: §Y[?mdr_ammo_use_max_k|2]K§!\n--------------\nLa §Ymunición§! la producen y la guardan las §Yfábricas militares§!, o se compra en el exterior (decisiones, §YCompra de munición§!). Solo la gastan las unidades que están combatiendo (según las bajas de cada semana): las que están en reserva o en un frente tranquilo no gastan. Además, las maniobras y prácticas de tiro gastan munición todo el año, según el tamaño del ejército y el §Ygasto militar§!; las divisiones que están entrenando gastan más.\nInvestigaciones de §YMunición§! (Infantería): §G+[?mdr_ammo_tech_gain|%1]§! de producción y §G+[?mdr_ammo_tech_cap|%1]§! de capacidad.\n§RSi se acaba, el ejército sufre castigos de ataque y defensa cada vez más graves, hasta casi no poder combatir.§!"
 mdr_ammo_category: "Compra de munición"
 mdr_ammo_category_desc: "La munición la producen nuestras fábricas militares. Si no alcanza, podemos comprarla en el exterior: se paga ahora y llega cuando se entrega el pedido.\n\nReserva: §Y[?mdr_ammo_k|1]K§! de §Y[?mdr_ammo_capacity_k|1]K§! cajas\nProducción diaria: §G[?mdr_ammo_gain_k|2]K§!\nConsumo diario actual: §R[?mdr_ammo_use_k|2]K§!\nDe eso, maniobras y entrenamiento: §Y[?mdr_ammo_drill_k|2]K§!"
 mdr_ammo_buy_1: "Comprar 1.000 cajas de munición"
 mdr_ammo_buy_1_desc: "Un pedido chico en el mercado internacional de armas. Llega en 7 días."
 mdr_ammo_buy_5: "Comprar 5.000 cajas de munición"
 mdr_ammo_buy_5_desc: "Un pedido mediano en el mercado internacional de armas. Llega en 14 días."
 mdr_ammo_buy_10: "Comprar 10.000 cajas de munición"
 mdr_ammo_buy_10_desc: "Un pedido grande en el mercado internacional de armas. Llega en 30 días."
 mdr_ammo_buy_25: "Comprar 25.000 cajas de munición"
 mdr_ammo_buy_25_desc: "Un pedido muy grande que los proveedores tardan en completar. Llega en 45 días."
 mdr_ammo_buy_50: "Comprar 50.000 cajas de munición"
 mdr_ammo_buy_50_desc: "Un contrato de guerra que ocupa líneas de producción extranjeras. Llega en 60 días."
 mdr_ammo_production_focus: "Priorizar la producción de munición"
 mdr_ammo_production_focus_desc: "Durante 60 días nuestra industria militar trabaja para los depósitos: triplica la munición producida, a costa del resto de su producción. Cuesta el 0,075% del PIB y se puede repetir 90 días después de ordenarla."
 mdr_ammo_focus_cooldown_tt: "Pasaron 90 días desde la última vez que priorizamos la munición"
 mdr_ammo_focus_cost_text: "£treasury [?mdr_ammo_focus_cost|2]"
 mdr_cost_0_2: "£treasury 0.2"
 mdr_cost_0_2_blocked: "£treasury §R0.2§!"
 mdr_cost_0_2_tooltip: "Esta compra cuesta 0.2 §Hmil millones§!"
 mdr_cost_1_0: "£treasury 1.0"
 mdr_cost_1_0_blocked: "£treasury §R1.0§!"
 mdr_cost_1_0_tooltip: "Esta compra cuesta 1.0 §Hmil millones§!"
 mdr_cost_2_0: "£treasury 2.0"
 mdr_cost_2_0_blocked: "£treasury §R2.0§!"
 mdr_cost_2_0_tooltip: "Esta compra cuesta 2.0 §Hmil millones§!"
 mdr_cost_5_0: "£treasury 5.0"
 mdr_cost_5_0_blocked: "£treasury §R5.0§!"
 mdr_cost_5_0_tooltip: "Esta compra cuesta 5.0 §Hmil millones§!"
 mdr_cost_10_0: "£treasury 10.0"
 mdr_cost_10_0_blocked: "£treasury §R10.0§!"
 mdr_cost_10_0_tooltip: "Esta compra cuesta 10.0 §Hmil millones§!"
 mdr_ammo_gain_factor: "£infantry_equipment_texticon Producción de munición"
 mdr_ammo_gain_factor_desc: "Munición que producen cada día las fábricas militares."

 # Uranio: precio en la pantalla de comercio y panel.
 MDR_MARKET_PRICES_URANIUM: "$$ [?global.mdr_uranium_price|2]"
 MDR_MARKET_PRICES_URANIUM_TT: "Información de precio del §YUranio§!:\nIngreso actual: §G$$[?mdr_uranium_income|3]§!\nPrecio mínimo: §G$$ 0.70/unidad§!\nPrecio máximo: §G$$ 11.75/unidad§!"
 MDR_URANIUM_BUTTON: "Abre la interfaz del §YUranio§!"
 MDR_URANIUM_BUTTON_TT: "Abre el panel del §YUranio§!, donde puedes ver cuánto uranio extraen tus §YMinas de uranio§!, cuánto consumen tus §YPlantas de enriquecimiento§!, cuánto importas y exportas, y a qué precio se vende en el mercado mundial.\n\nNOTA: Cada §YPlanta de enriquecimiento§! consume §Y1§! de §YUranio§!. Si no alcanza, las plantas producen menos combustible nuclear y los reactores rinden menos. Las §YMinas de uranio§! solo se pueden construir en estados con un §YYacimiento de uranio§!, y el uranio que falta se compra en esta pantalla de comercio, como los demás recursos."
 MDR_URANIUM_PANEL_TITLE: "Uranio"
 MDR_URANIUM_PANEL_COUNTRY: "Nuestro uranio"
 MDR_URANIUM_PANEL_COUNTRY_TEXT: "Extraído: §Y[?mdr_uranium_produced|0]§!\nMinas: §Y[?mdr_uranium_mines|0]§! niveles en §Y[?mdr_uranium_deposits|0]§! estados\nImportado: §Y[?mdr_uranium_imported|0]§!   Exportado: §Y[?mdr_uranium_exported|0]§!\nConsumo de nuestras plantas de enriquecimiento: §Y[?mdr_uranium_need|0]§!\nCombustible nuclear perdido por falta de uranio: §R[?mdr_uranium_shortfall|%0]§!\nIngresos por exportación: §G$$[?mdr_uranium_income|3]§! mil millones por semana"
 MDR_URANIUM_PANEL_WORLD: "Mercado mundial"
 MDR_URANIUM_PANEL_WORLD_TEXT: "Precio: §Y$$[?global.mdr_uranium_price|2]§! por unidad   Producción mundial: §Y[?global.mdr_uranium_supply|0]§!   Demanda mundial: §Y[?global.mdr_uranium_demand|0]§!"
 MDR_URANIUM_PANEL_INFO: "Las §YMinas de uranio§! se construyen en la pantalla de construcción, solo en los estados con un §YYacimiento de uranio§!. Cada nivel da 1 de uranio. Cada planta de enriquecimiento consume 1; si falta, producen menos combustible nuclear. El uranio se compra y se vende en esta pantalla, como los demás recursos."
 mdr_ammo_focus_idea: "Priorizando la munición"
 mdr_ammo_focus_idea_desc: "Nuestra industria militar trabaja para los depósitos de munición, a costa del resto de su producción."

 # Granos y fertilizantes.
 wheat: "Granos"
 wheat_desc: "Trigo, maíz, arroz y demás cereales que cosechan las §YTierras de cultivo§!: 10 por nivel, más 1 por cada tecnología de fertilizantes. Cada unidad es de 100.000 toneladas al año. Es toda la comida de la población y se comercia como cualquier otro recurso."
 PRODUCTION_MATERIALS_WHEAT: "Granos"
 mdr_fertilizers_1: "Fertilizantes de liberación controlada"
 mdr_fertilizers_1_desc: "Gránulos recubiertos liberan el nitrógeno de a poco, así los cultivos aprovechan más y la lluvia arrastra menos.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 mdr_fertilizers_2: "Inhibidores de nitrificación"
 mdr_fertilizers_2_desc: "Aditivos que mantienen el nitrógeno del suelo en la forma que usan las plantas: más cosecha con el mismo fertilizante.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 mdr_fertilizers_3: "Fertilización de dosis variable"
 mdr_fertilizers_3_desc: "Mapas de suelo y abonadoras guiadas por GPS dan a cada parte del campo exactamente el fertilizante que necesita.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 mdr_fertilizers_4: "Biofertilizantes microbianos"
 mdr_fertilizers_4_desc: "Bacterias y hongos que fijan nitrógeno y liberan fósforo alimentan los cultivos y recuperan los suelos gastados.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 mdr_fertilizers_5: "Nanofertilizantes"
 mdr_fertilizers_5_desc: "Nutrientes transportados en nanopartículas llegan a las raíces casi sin pérdidas y reducen el fertilizante necesario por tonelada de grano.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 mdr_fertilizers_6: "Amoníaco verde"
 mdr_fertilizers_6_desc: "Amoníaco fabricado con hidrógeno renovable: el fertilizante deja de depender de los combustibles fósiles y se vuelve barato y abundante.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 mdr_fertilizers_7: "Fertilizantes de nutrientes reciclados"
 mdr_fertilizers_7_desc: "El nitrógeno y el fósforo se recuperan de las aguas residuales y de los desechos de la ganadería: el fósforo deja de depender de minas que se agotan.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 mdr_fertilizers_8: "Cereales fijadores de nitrógeno"
 mdr_fertilizers_8_desc: "Trigo, maíz y arroz modificados para convivir con bacterias que toman el nitrógeno del aire, como ya hacen las legumbres. Se necesita mucho menos abono.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 mdr_fertilizers_9: "Microbiomas de suelo diseñados"
 mdr_fertilizers_9_desc: "Comunidades de microbios hechas a medida para cada tipo de suelo, que liberan nutrientes, retienen agua y protegen las raíces.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 mdr_fertilizers_10: "Fertilizantes inteligentes"
 mdr_fertilizers_10_desc: "Cápsulas que liberan nutrientes solo cuando la planta los pide, con señales químicas de sus raíces. Casi nada se pierde en el suelo ni en los ríos.\n\nCada nivel de §YTierras de cultivo§! produce §G+1§! de Granos."
 MDR_MARKET_PRICES_WHEAT: "$$ [?global.mdr_wheat_price|3]"
 MDR_MARKET_PRICES_WHEAT_TT: "Información de precio de los §YGranos§!:\nIngreso actual: §G$$[?mdr_wheat_income|3]§!\nPrecio mínimo: §G$$ 0.054/unidad§!\nPrecio máximo: §G$$ 0.270/unidad§!\n\nCada unidad de granos son 100.000 toneladas al año. El precio base, §Y0.077§!, equivale a unos 120 dólares por tonelada (el precio del año 2000) y sube cuando en el mercado mundial de alimentos hay más compradores que vendedores."

 # Comida: barra superior.
 MDR_FOOD_TOPBAR_DAYS: "[?mdr_food_days|0]d"
 MDR_FOOD_TOPBAR_LOW: "§R[?mdr_food_days|0]d§!"
 MDR_FOOD_TOPBAR_TT: "§YAlimentos§!\n\nReservas: §Y[?mdr_food_stock_mt|2]M§! de §Y[?mdr_food_capacity_mt|2]M§! t (§Y[?mdr_food_days|0]§! días de consumo)\nPoblación alimentada: [mdr_food_fed_text]\nAutosuficiencia: §Y[?mdr_food_self_sufficiency|0]%§!   Precio mundial: §Y$$[?global.mdr_wheat_price|3]§!\n--------------\n§YBalance diario: §![mdr_food_gain_text]\n  §G+[?mdr_food_grown_k|1]K§! cosecha ([?mdr_food_cropland_levels|0] Tierras de cultivo × [?mdr_wheat_per_cropland|0] granos)\n  §R-[?mdr_food_need_k|1]K§! consumo ([?population_total_m|1] millones × [?mdr_food_per_capita|2] t al año)\n  §R-[?mdr_food_spoil_k|1]K§! se echa a perder en los depósitos[mdr_food_line_loss][mdr_food_line_import][mdr_food_line_export][mdr_food_line_buy][mdr_food_line_sell][mdr_food_line_unmet]\n--------------\n§YCapacidad de reservas: [?mdr_food_capacity_mt|2]M t§!\n  §Y[?mdr_food_cap_base_mt|2]M§! base (tres meses de consumo)\n  §Y[?mdr_food_cap_reserves_mt|2]M§! Reservas de Recursos Estratégicos\n  §Y[?mdr_food_cap_silos_mt|2]M§! silos agroindustriales\n  Investigaciones de §YFertilizantes§!: §G+[?mdr_food_tech_cap|%1]§! de capacidad y §G-[?mdr_food_tech_spoil|%1]§! de pérdida en depósitos\nTrabajadores del campo: §Y[?mdr_cropland_manpower_fulfillment|%0]§! de los necesarios\n\n[mdr_food_status_text]"
 MDR_FOOD_GAIN_POS: "§G+[?mdr_food_gain_k|1]K§! t"
 MDR_FOOD_GAIN_NEG: "§R[?mdr_food_gain_k|1]K§! t"
 MDR_FOOD_STATUS_SHORT: "§RParte de la población pasa hambre: los castigos crecen con cuánta gente no come.§!"
 MDR_FOOD_STATUS_FULL: "§GReservas llenas: el excedente se vende al mundo.§!"
 MDR_FOOD_STATUS_FALLING: "§YLas reservas están bajando.§!"
 MDR_FOOD_STATUS_RISING: "§GLas reservas están creciendo.§!"
 MDR_EMPTY: ""
 MDR_FOOD_LINE_LOSS: "\n  §R-[?mdr_food_loss_k|1]K§! perdido por sequías y desastres"
 MDR_FOOD_LINE_IMPORT: "\n  §G+[?mdr_food_trade_in_k|1]K§! granos importados (comercio)"
 MDR_FOOD_LINE_EXPORT: "\n  §R-[?mdr_food_trade_out_k|1]K§! granos exportados (comercio)"
 MDR_FOOD_LINE_BUY: "\n  §G+[?mdr_food_buy_k|1]K§! comprado al mundo (§R$$[?mdr_food_cost|3]§! mil millones por semana)"
 MDR_FOOD_LINE_SELL: "\n  §R-[?mdr_food_sell_k|1]K§! excedente vendido al mundo (§G$$[?mdr_food_income|3]§! mil millones por semana)"
 MDR_FOOD_LINE_UNMET: "\n  §R[?mdr_food_unmet_k|1]K§! que faltan y nadie nos vende"
 MDR_FOOD_FED_ALL: "§G100%§! (toda la población come lo suficiente)"
 MDR_FOOD_FED_MILD: "§Y[?mdr_food_fed_pct|1]%§! (escasez leve)"
 MDR_FOOD_FED_CRISIS: "§O[?mdr_food_fed_pct|1]%§! (crisis alimentaria)"
 MDR_FOOD_FED_FAMINE: "§R[?mdr_food_fed_pct|1]%§! (hambruna)"
 MDR_FOOD_FED_EXTREME: "§R[?mdr_food_fed_pct|1]%§! (hambruna extrema)"
 mdr_food_shortage: "Escasez de alimentos"
 mdr_food_shortage_desc: "Solo come lo suficiente el [?mdr_food_fed_pct|1]% de la población. Cuanta más gente pasa hambre, más caen la estabilidad, el poder político, el apoyo a la guerra y el crecimiento de la población, y más sube la inflación: con un 5% sin comer es una molestia, con la mitad es una catástrofe."
