 LKT_focus_metallic_bloodlines_act: "Ley de líneas de sangre metálicas"
 LKT_focus_metallic_bloodlines_act_desc: "El MBA es un paquete de financiación alrededor saltando y asegurando la capacidad de nuestra nación para tener un suministro doméstico de hierro y acero. El acero es especialmente el segundo pilar de la vida a una economía al lado del poder humano y el hormigón."
 LKT_focus_metallic_masters: "Metallic significa"
 LKT_focus_metallic_masters_desc: "Otros medios de nuestra independencia nacional significan que, lamentablemente, debemos cavar tanto profunda como codictivamente. Como una pequeña cantidad de metales ligeros se puede encontrar en el estado de Dakota del Sur, lo que debería permitirnos diversificar nuestras capacidades económicas."
 LKT_focus_bio_fuel_prominence: "Biocombustible"
 LKT_focus_bio_fuel_prominence_desc: "Mediante esfuerzos de desarrollo dedicados e incansables en biocombustibles y la etapa que debe establecerse alrededor de ellos, podemos crear una forma más eficiente y abundante de energía. Esto ayudará a reducir nuestras demandas generales, así como el costo potencial en el uso de la tierra y los recursos que se pueden reservar para mejores necesidades del pueblo y la nación en general."