 LKT_politics.5.t: "Los nuevos nacionales de Lakotan, fiestas"
 LKT_politics.5.d: "Los New Lakotan Nationals es un creciente movimiento pro-nacionalista de partidos que buscan enfocarse más en el aislamiento y preservar la nueva identidad sobre la mayoría de otras cosas. Muchos en la nación son escépticos de lo que esto significaría para los diferentes grupos minoritarios, pero la mayoría también creen que la naturaleza interconectada del globo es lo que trajo a la gran implosión de la antigua república. Aunque algunos pueden votar con el nuevo bloque de partidos simplemente a pesar de los crecientes partidos económicos socialistas que parecen haber crecido más naturalmente del limitado a no desarrollar las tierras de la nación."
