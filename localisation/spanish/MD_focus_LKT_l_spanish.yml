 LKT_politics.4.t: "Los Partidos Populares de Progreso"
 LKT_politics.4.d: "El emergente bloque económico socialista de los partidos políticos ha ganado tracción puramente a pesar del aumento en los Nuevos Partidos Nacionales Lakotan. Esta supuesta dicotomía «izquierda, derecha» significa que la política de la nación se está moviendo más y más facciones. Pero a medida que comienza la votación y el pueblo espera dar su paso adelante con lo que creen que es correcto para la nación, muchos se preguntan quién será el primer partido gobernante de la nación joven."
