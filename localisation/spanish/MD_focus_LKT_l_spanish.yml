l_spanish:
 Republic_of_Lakota_focus: "Árbol de Enfoque de la República de Lakota"
 LKT_Sakakawea_capital: "Has Hecho §YSakakawea§! La capital"
 LKT_Sakakawea_capital_name: "Sakakawea"
 LKT_Pierre_capital: "Has Hecho §YPierre§! La capital"
 LKT_Pierre_capital_name: "Pierre"
 LKT_Fort_Nakanin_capital: "Has Hecho §Y Fort Nakanin§! La capital"
 LKT_Fort_Nakanin_capital_name: "Fuerte Nakanin"
 LKT_New_Cheyenne_capital: "Has Hecho §Y New Cheyenne§! La Capital"
 LKT_New_Cheyenne_capital_name: "Nuevo Cheyenne"
 LKT_Old_Cheyenne_capital_name: "Viejo Cheyenne"
 LKT_decisions_war_time_mobilization_category: "Movilización en tiempos de guerra"
 LKT_decisions_war_time_mobilization_category_desc: "Cuando surge la necesidad, podemos recurrir a una legión de voluntarios para al menos llenar los vacíos en las filas. Porque no sabemos cuándo vendrá la guerra, pero sí sabemos que estará sobre nosotros."
 LKT_war_time_mobilization: "Movilización de la primera ola"
 LKT_war_time_mobilization_desc: "Ha llegado la llamada a las armas y debemos presentarnos para asegurar la defensa de nuestros hogares. ¡A las armas, muchachos de Dixie!"
 LKT_war_second_wave_defenders: "Defensores de la segunda ola"
 LKT_war_second_wave_defenders_desc: "El enemigo avanza, por lo que debemos reclutar otra oleada de defensores. La moral de la nación se verá afectada, pero necesitamos tropas."
 LKT_war_desperate_defenders: "Defensores desesperados"
 LKT_war_desperate_defenders_desc: "La situación se vuelve sombría; necesitamos a cada persona disponible, capaz o no, para mantener la línea. Quizás, solo quizás, aún podamos ganar esto."
 LKT_ideas_economic_development_commission: "Comisión de Desarrollo Económico"
 LKT_ideas_economic_development_commission_desc: "La unidad entre el Frente de Reclamación y el gobierno nacional es más fuerte que nunca. Se creó una nueva comisión económica para desarrollar y comprender el hacer económico de nuestra nación. Ahora que tanto los de abajo como los de arriba trabajan juntos, el futuro de nuestra gran nación es una pieza más hacia la verdadera unidad."
 LKT_event.1.t: "El jefe del Gobierno"
 LKT_event.1.d: "Dado que en este momento no tenemos intención de mirar más al norte, la seguridad de la capital de nuestra nación depende de nuestros cuatro estados más septentrionales. Dakota, Montana y Wyoming. Aunque algunos disuaden de esta idea, ya que creen que cuanto más lejos esté la capital del frente, más se alejará la ayuda y la atención. No obstante, no podemos dejarnos entorpecer por estas disputas de distracción. Sin embargo, muchos se preguntan también si deberíamos ceñirnos a una denominación más básica de la capital o si deberíamos apelar a los orígenes autóctonos de las tierras. Por el momento, estos cuatro estados candidatos están haciendo un hueco para parecer tan atractivos al comité de orígenes nacionales como para que su estado sea elegido."
 LKT_event.1.o1: "¿No acabamos de colapsar por este tipo de cosas?"
 LKT_event.2.t: "Un Debate en el Corazón."
 LKT_event.2.d: "De nuestros cuatro contendientes, tenemos una división entre los que están más en línea con lo antiguo y los que quieren estar un poco más en sintonía con las influencias nativas de las tierras. En el rincón nativo tenemos Montana con Fort Nakanin, un juego de la antigua reserva nativa cercana que era para las tribus Nakoda y A'ananin. En Dakota del Norte tenemos Sakakawea, el mayor río del estado. En los participantes del sur tenemos a Pierre, Dakota del Sur, como su opción. Dado que no se ha visto mucho desarrollo en el estado, muchos dentro del estado creen que la nueva capital federal será fácil de crear su propio distrito para ser una pieza en el rompecabezas metropolitano más amplio de Pierre. Por último tenemos New Cheyenne, que al estar aproximadamente en el centro derecha del estado, tendrá prioridad sobre la antigua capital del estado de Wyoming, que pasará a llamarse Old Cheyenne. Algunos residentes están un poco dolidos con la idea, pero muchos creen que es un bonito símbolo de renovación, ya que la capital federal toma la antorcha de una nueva página en la historia de la joven nación."
 LKT_event.2.o1: "Sakakawea"
 LKT_event.2.o2: "Pierre"
 LKT_event.2.o3: "Fuerte Nakanin"
 LKT_event.2.o4: "Nuevo Cheyenne"
 LKT_event.3.t: "Auditando el Sur"
 LKT_event.3.d: "Después de una larga y tediosa empresa para estabilizar la nación, finalmente hemos podido abordar esta supuesta organización del \"Frente de Reclamación\", que aparentemente nos está ayudando. Sin embargo, hemos enviado auditores para averiguar la verdadera razón por la cual estas personas decidieron abandonar sus hogares ya establecidos para hacer nuevos. En cualquier caso, debemos esperar a ver exactamente lo que se informa antes de actuar genuinamente."
 LKT_event.3.o1: "No puede ser tan malo, ¿verdad?"
 LKT_event.4.t: "Primeros informes"
 LKT_event.4.d: "Ha llegado información, que en el mejor de los casos es contradictoria y en el peor, confusa. Algunos informes indican que la RF es literalmente lo que dice ser: un grupo de nativos que huyen de la República del Sur para intentar forjarse un nuevo hogar. Como resultado, la situación económica de Kansas ha crecido más rápido que la del resto del país. Sin embargo, por otro lado, hay informes de que algunos miembros de la RF participan en actos delictivos contra ciudadanos locales e incluso en actividades pseudomafiosas para mantener su reputación a flote. Estas idas y venidas significan que podríamos tener un papel importante en la reconstrucción, o que nos clavarán un cuchillo en el estómago. En cualquier caso, debemos tomar una decisión seria, una que podría resultar en acciones de las que nos arrepintamos más adelante."
 LKT_event.4.o1: "¡Criminales, todos ellos!"
 LKT_event.4.o2: "Espera, tal vez haya algo más en esto"
 LKT_event.5.t: "Una oferta que no podrán rechazar"
 LKT_event.5.d: "Con los informes impactantes sobre las actividades más ilegales del RF, un auditor ha tomado la iniciativa y se ha reunido con el liderazgo del RF para, más o menos, hacerles una oferta. Reduzcan parte de su grandilocuencia y dejen que el gobierno nacional del norte se lleve más crédito, y los dejaremos en paz. Naturalmente, el liderazgo del RF tuvo reacciones encontradas, y la más fuerte fue la respuesta colectiva en crecimiento. La respuesta citada fue: \"Somos un pueblo pacífico y nos sentimos profundamente ofendidos de que crean que somos criminales comunes y gánsteres organizados, como sus homólogos blancos de antaño. Les mostraremos que no toleraremos comentarios tan groseros y degradantes para estigmatizar a nuestro pueblo.\" El auditor fue expulsado y acosado hasta la frontera de Nebraska, con esto queda claro que nuestras suposiciones eran correctas y debemos actuar pronto."
 LKT_event.5.o1: "Dales un centímetro y se llevan todo un estado"
 LKT_event.6.t: "Reunir a la nación"
 LKT_event.6.d: "Crece el malestar en Kansas a medida que los miembros de la RF y los líderes locales han comenzado a ponerse del lado de este movimiento rebelde en su conjunto. Como tal, los estados del norte han comenzado a unirse y necesitamos comenzar algún tipo de movilización si queremos llegar realmente a alguna parte pronto."
 LKT_event.6.o1: "Es nuestra nación, no la suya"
 LKT_event.7.t: "Rebelión abierta"
 LKT_event.7.d: "Esos malditos traidores por fin lo han hecho, han subido bien alto la bandera del estado de Kansas y han declarado el estado independiente de la república. Tendremos que organizar las tropas y acabar con esto antes de que nuestros vecinos vean debilidad."
 LKT_event.7.o1: "Haz sonar la alarma"
 LKT_event.8.t: "¡A la guerra!"
 LKT_event.8.d: "La nación está movilizada, valga lo que valga, y como tal marchamos hacia el sur para defender nuestras tierras de estas alimañas traidoras y oportunistas. Buena voluntad y todo eso, baaah, un montón de tonterías en el mejor de los casos y un montón más de mentiras en el peor."
 LKT_event.8.o1: "¡Marchamos hacia el sur!"
 LKT_event.9.t: "No nos dejan elección"
 LKT_event.9.d: "Nos llaman ladrones, sinvergüenzas y criminales. Pues no lo somos y nos defenderemos con esta gente amable y afín de Kansas. ¡Por Kansas y por la verdadera libertad!"
 LKT_event.9.o1: "¡Luchamos por nuestra libertad!"
 LKT_event.5000.t: "Investigaciones adicionales"
 LKT_event.5000.d: "Los informes que se siguen publicando muestran que cada vez se demuestra que las afirmaciones sobre el lado ilegal de las actividades de la organización son falsas. Por ello, han comenzado a surgir negociaciones para reactivar la economía del país y trabajar más en pos de una unión más armoniosa de los pueblos."
 LKT_event.5000.o1: "Gracias a Dios que miramos más allá"
 LKT_event.5001.t: "Planes Adicionales"
 LKT_event.5001.d: "Las conversaciones iniciales y los planes de inversión han hecho que la economía crezca por todas partes. Tal crecimiento ha hecho que nuestra nación vea algo que pensábamos que tardaría meses y es el desarrollo. Tal y como van las cosas, debemos estudiar la creación de una comisión económica que garantice el desarrollo económico equilibrado y constante de nuestra gran nación y sus numerosos pueblos."
 LKT_event.5001.o1: "¡Por la prosperidad!"
 LKT_event.5002.t: "La Comisión"
 LKT_event.5002.d: "Las negociaciones y desarrollos continuos han resultado en la formación de la \"Comisión de Desarrollo Económico\". Esta comisión ha llevado a una doctrina de planificación y crecimiento económico más cohesiva que ayudará a nuestra nación durante generaciones."
 LKT_event.5002.o1: "Unidos Permanecemos, Divididos Nunca Más Estaremos"
 LKT_organizing_the_farmers: "Organizando a los agricultores"
 LKT_organizing_the_farmers_desc: "No tenemos mucho, pero lo que tenemos debemos aprovecharlo y prepararnos para cuando lo necesitemos."
 LKT_creating_infantry_reserves: "Creación de las reservas"
 LKT_creating_infantry_reserves_desc: "Acosados ​​por adversarios a nuestro alrededor, debemos esperar lo peor. Creemos una fuerza de reserva lista para que, cuando llegue el momento, estemos preparados para el enemigo."
 LKT_mobilizing_the_reserves: "Movilizando las reservas"
 LKT_mobilizing_the_reserves_desc: "El momento se acerca y debemos garantizar la seguridad de nuestros queridos ciudadanos. Reunamos a las reservas y salgamos a defender nuestros hogares."
 LKT_focus_a_capital_conundrum: "Una capital Conundrum"
 LKT_focus_a_capital_conundrum_desc: "Con límites limitados que se mantienen unidos que llamamos nación, debemos buscar una base para la cual podemos llamar capital de nuestra nación. Al norte buscamos y esperamos una resolución."
 LKT_focus_montana_monster: "Montana Monster"
 LKT_focus_montana_monster_desc: "La reconstrucción finalmente ha comenzado, nuestra nación debe ser capaz de servir y alimentarse antes de que podamos siquiera pensar en cualquier otra cosa. Como tal agricultura será la prioridad en estos primeros días."
 LKT_focus_montana_marvel: "El Montana Marvel"
 LKT_focus_montana_marvel_desc: "De trapos a riquezas, o por lo menos de estómago vacío a completo. Como tal, podemos empezar a rodar nuestros servicios municipales civiles y generales para ayudar a estabilizar la sociedad dentro del estado y traer una nueva paz a estas tierras."
 LKT_focus_northern_troubles: "Troubles del Norte"
 LKT_focus_northern_troubles_desc: "Los Dakotas como la mayoría de nuestra nación son muy escasos y no se desarrollan realmente a pesar de los recuentos de población de algunos estados. Independientemente de que debemos solidificar nuestros territorios fronterizos nothern antes de que el oportunista intente llevarlos, sin mencionar a ninguna gente que está tratando de salir también será una gran pérdida para nuestra nación. Por ahora vamos a conseguir algo de economía."
 LKT_focus_our_northern_light: "Nuestra Luz del Norte"
 LKT_focus_our_northern_light_desc: "Con la economía y los comienzos de la estabilidad social que regresan a Dakota del Norte, ahora podemos empezar a ampliar las emergencias locales y los servicios civiles. De esto podemos expandir el dominio del control dentro de nuestra nación joven."
 LKT_focus_yellowstone_yelling: "El grito de Yellowstone"
 LKT_focus_yellowstone_yelling_desc: "Las tierras claman por su caos y peligro a lo largo de ellas, debemos establecer una iniciativa para devolver la paz y la tranquilidad a estas partes. No hay muchos dentro del estado sin embargo con esto en mente que significa que hay aún menos desarrollo y cosas con las que trabajar en general. Pero la gente debe tener algo y les daremos comida para sus vientres."
 LKT_focus_worland_wonder: "El Worland Wonder"
 LKT_focus_worland_wonder_desc: "Por último, se ha restablecido un sembalance de la paz y con que los servicios civiles y otras enmiendas municipales pueden ser restaurados para devolver la cohesión social a más de nuestra nación. Pronto podremos disfrutar de un lugar que podamos llamar a casa."
 LKT_focus_southern_turmoil: "Turmoil del Sur"
 LKT_focus_southern_turmoil_desc: "Bubble burbuja de trabajo y problemas, revolvemos la olla de todos esos problemas. Desde el fondo de la desesperación traemos a la superficie algo que podemos limpiar y reparar. Con una economía y comida en las mesas que pusimos, contaremos historias de lo que alguna vez fueron fábulas que habían sido puestas. Ahora adelante marchamos para marcar el ritmo, porque nuestra gente nos necesita en estas necesidades extremas del destino."
 LKT_focus_rapid_city_revival: "Renacimiento rápido de la ciudad"
 LKT_focus_rapid_city_revival_desc: "Con una mano firme hacemos nuestra paz, para el pueblo de estas tierras les dejaremos fiestas... bien con las rimas de mierda. Usted ha construido algún tipo de economía, ahora comienza a rodar en la administración gubernamental y los servicios civiles para restaurar la cohesión social y recuperar la solidaridad de otra parte de su nación."
 LKT_focus_industry_what_industry: "Industria, ¿qué industria?"
 LKT_focus_industry_what_industry_desc: "Ahora a pesar de lo que muchos querrían reclamar, a la realidad obvia que tenemos algún poder industrial... puede no ser mucho pero es algo independientemente del hecho. Esto por lo menos nos ayuda a estabilizar y diversificar nuestro maquillaje económico sobre todos."
 LKT_focus_nebraska_neck_breaker: "Nebraska Neck Breaker"
 LKT_focus_nebraska_neck_breaker_desc: "Con la nación todos los heridos debemos trabajar para sanar sus heridas. Como tal restaurar algún tipo de base económica permitirá que las personas se reúnan y reinicien la sociedad tal como lo conocemos."
 LKT_focus_from_broken_bow_to_fixed: "Desde el Tazón roto hasta la fijación"
 LKT_focus_from_broken_bow_to_fixed_desc: "Las heridas sanan, pero las cicatrices aún permanecen, llevará tiempo sanar completamente y seguir adelante desde el pasado, pero podemos hacerlo, una pieza a la vez."
 LKT_focus_kansas_city_catastrophe: "Catástrofe de Kansas City"
 LKT_focus_kansas_city_catastrophe_desc: "Kansas City, Kansas, qué lugar, lleno de gente, cosas que hacer y cosas para salir del contexto y divertirse. Sin embargo, eso podría decirse de muchas cosas, sin embargo una chispa se encendió y la ciudad era una luz con más que sólo jeers y alegrías. Ahora debemos traer de vuelta lo que una vez se perdió y establecer un nuevo camino a la renovación."
 LKT_focus_the_kansas_city_kitty: "El gatito de Kansas City"
 LKT_focus_the_kansas_city_kitty_desc: "Ahora que la economía es, bien existente podemos volver al columpio de las cosas. Escuché que el club está abierto en la calle principal y así podemos bailar la noche como solían hacerlo en los viejos tiempos."
 LKT_focus_the_new_republic: "La Nueva República"
 LKT_focus_the_new_republic_desc: "De las cenizas de los viejos se levanta un nuevo. ahora nos propusimos descubrir no sólo nosotros mismos sino el futuro por el que deseamos hacer."
 LKT_focus_new_elections_begin: "Comienzan las nuevas elecciones"
 LKT_focus_new_elections_begin_desc: "Ahora es el momento de comenzar nuestros fundamentos políticos. Al celebrar nuestra primera elección nacional, establecimos el escenario para que nuestro pueblo llegue a sus propias conclusiones y se haga cargo del destino por el cual desea."
 LKT_focus_the_councils_of_authority: "The Councils Of Authority"
 LKT_focus_the_councils_of_authority_desc: "En un giro interesante del destino parece que uno de los muchos, casi «oligarquicos» partidos ha ganado en la elección. La verdadera pregunta ahora es exactamente lo que cualquiera de estos partidos ha planeado para la nación. Quiero decir, el término oligarquía es una distinción tan imponente que seguramente esto no va bien para la nación. ¿Qué estaba pensando la gente?"
 LKT_focus_DDP_political_plan: "El Plan Político del Partido Democracia de Dakota"
 LKT_focus_DDP_political_plan_desc: "Al concluir las primeras elecciones, parece que el Partido Democracia de Dakota ha conseguido la victoria. Ahora planean implementar sus políticas para ayudar a moldear la nación y es gente en estos días tempranos e inseguros."
 LKT_focus_skill_assessment_fairs: "Ferias de evaluación de habilidades"
 LKT_focus_skill_assessment_fairs_desc: "Los SAF son eventos patrocinados federalmente diseñados para perfeccionar y que la población aprenda y comprenda sus habilidades en todos los campos. Esto nos permite ayudar a emplear individuos, así como darnos una mejor comprensión de lo talento que tenemos dentro de nuestra nación."
 LKT_focus_light_industry_investment: "Inversiones de la industria ligera"
 LKT_focus_light_industry_investment_desc: "El establecimiento de industrias limitadas pero significativas en nuestra nación dará una exposición pasiva a nuevos conjuntos de habilidades y oportunidades laborales. Puede que no sea mucho, pero es un trabajo honesto como dicen."
 LKT_focus_business_taxes_redraft: "Impuestos de negocios Redraft"
 LKT_focus_business_taxes_redraft_desc: "Concluyéndole un primer impuesto sobre las empresas individuales. Estableceremos un nuevo piso para el cual nuestras políticas tributarias se puedan llevar a cabo. Si bien nuestra economía no tiene mucho en el camino de los detalles, la superación de las demandas sobre dichas empresas por impuestos corporativos generales sin duda tendrá un efecto negativo en nuestros ingresos."
 LKT_focus_education_streamlining: "Evolución de la educación"
 LKT_focus_education_streamlining_desc: "Simplificar el currículo en los fundamentos para los que los estudiantes pueden utilizar en su día a día nos permitirán estudiar mejor la gestión de las aulas, así como cómo reformar el currículo en el futuro."
 LKT_focus_basic_arms_industry_investment: "Inversión básica en la industria de las armas"
 LKT_focus_basic_arms_industry_investment_desc: "Nuestra nación es escasa y está subdesarrollada. Seremos vistos como un blanco fácil por muchos y mientras no queremos ser un objetivo fácil, para que desarrollemos tan tempranas ambiciones militaristas, debemos crear una razón para ello. Como tal, estableceremos la base para la fabricación de armas locales para apoyar la caza y ayudar a mantener las armas para nuestras fuerzas militares permanentes."
 LKT_focus_extensive_geological_surveys: "Extensas Encuestas Geológicas"
 LKT_focus_extensive_geological_surveys_desc: "A través de extensas investigaciones y encuestas sobre las tierras de lo que se perciben como «depósitos de bajo valor», podemos empezar a encontrar maneras de hacer esto lo que parecen depósitos de recursos minúsculos y convertirlos en algo significativo. Si bien será costoso al principio, los beneficios a largo plazo y la seguridad de nuestra independencia nacional valen el precio."
 LKT_focus_KCK_political_plan: "El Plan Político KCK"
 LKT_focus_KCK_political_plan_desc: "El Kansas City Koalition es un colectivo de líderes empresariales y figuras políticas que quieren llevar a la nación en el camino tan rápido como razonablemente posible. Como tales, sus cosas principales se centran en la estabilidad económica y la gestión de la población debido al «Gran colapso»."
 LKT_focus_zoning_reforms: "Reformas de Zoning"
 LKT_focus_zoning_reforms_desc: "Permitir un enfoque más flexible y diferente a las formas más tradicionales de zonificación debería permitir que nuestras ciudades y ciudades se adapten mejor a las necesidades de nuestros ciudadanos y la economía en general."
 LKT_focus_integrated_health_plans: "Planes Integrados de Salud"
 LKT_focus_integrated_health_plans_desc: "Al incorporar los planes obligatorios de atención sanitaria proporcionados a las empresas permitirán disponer de medios de contratación más flexibles y racionalizar las necesidades de los empleados para satisfacer las exigencias del entorno laboral."
 LKT_focus_regulatory_cutbacks: "Recortamientos regulatorios"
 LKT_focus_regulatory_cutbacks_desc: "La eliminación de una gran cantidad de tediosas y contraproducentes regulaciones productivas permitirá a las empresas apoyar mejor a la nación y a la gente que emplean."
 LKT_focus_national_employment_commission: "Comisión Nacional de Empleo"
 LKT_focus_national_employment_commission_desc: "El NEC es un organismo nacional implementado en la tarea de buscar mano de obra tanto doméstica como extranjera vecina para llenar empleos y crecer una economía más estable y bien redondeada. Por supuesto que será un poco difícil para los trabajadores extranjeros «cazadores de cabeza», sin embargo nuestros hermanos y hermanas continentales serán tratados como ciudadanos regulares, ya que todo el objetivo del programa es asegurar que la economía no está superando a la fuerza laboral disponible."
 LKT_focus_ensuring_military_stockpiles: "Asegurar a los Stockpiles Militares"
 LKT_focus_ensuring_military_stockpiles_desc: "La defensa nacional es importante, sin embargo para poder defender a su propia nación primero debe tener el equipo necesario para hacerlo. Como tal expansión con el NEC nos permitirá emplear a más personas en fábricas para crear estos arsenales de manera que nuestro ejército y la fuerza aérea puedan defender a nuestra nación del interés inesperado."
 LKT_focus_LTP_political_plan: "El Plan Político de LTP"
 LKT_focus_LTP_political_plan_desc: "El Partido Tecnocrático Lakotan es un partido de progreso e innovación. Enfoque En cuanto a la educación, R&D y la creación del entorno económico para financiar tales esfuerzos, el LTP espera crear una nación que se esfuerza por mejorar y encontrar formas de hacer mejor aún."
 LKT_focus_mandatory_education_programs: "Programas obligatorios de educación"
 LKT_focus_mandatory_education_programs_desc: "Los eurodiputados son programas diseñados para promover los límites de la educación al no pasar por los niveles simples de la escuela. Pero programas independientes fuera del estándar para fomentar nuevas oportunidades para la gente independientemente de su edad."
 LKT_focus_the_means_of_efficiency: "The Means Of Efficiency"
 LKT_focus_the_means_of_efficiency_desc: "Nuestra nación está escasamente poblada y como tal debemos enfocarnos y adaptarnos a esta realidad. Como tal, debemos aprovechar los medios de eficiencia y trabajo para hacer debido a lo que tenemos."
 LKT_focus_ends_of_a_means: "Ends Of A Means"
 LKT_focus_ends_of_a_means_desc: "Tenemos acceso a un recurso básico que es mineral de hierro. Podemos convertir este mineral en acero que es una pieza fundamental para el rompecabezas económico moderno. Como tal, debemos invertir fuertemente en la extracción de este recurso si tenemos que tener una verdadera piedra de paso para nuestra autosuficiencia."
 LKT_focus_economic_expansion_act: "Ley de Ampliación Económica"
 LKT_focus_economic_expansion_act_desc: "Los desarrollos industriales generales permitirán que nuestra base económica se expanda. Esto a su vez debería permitirnos construir más capital para nuevas inversiones."
 LKT_focus_peoples_defense_act: "Ley de Defensa de los Pueblos"
 LKT_focus_peoples_defense_act_desc: "El PDA es un programa de defensa nacional limitado que creó oportunidades industriales y contractuales limitadas para dar a nuestra nación un medio para equipar a nuestros soldados con equipos."
 LKT_focus_militarized_politics_plan: "Plan de Política Militarizada"
 LKT_focus_militarized_politics_plan_desc: "Con la nación en desacuerdo sobre lo que es correcto y equivocado en cómo avanzar, elementos de la AFL, Fuerzas Armadas de Lakota, han tomado la iniciativa y de alguna manera han asegurado una mayoría de votos para ganar esta primera elección. Aunque muchas dudas ganarían una elección menos divisiva, más aún están felices de tener una dirección que simplemente preguntándose en lo desconocido."
 LKT_focus_national_conscription_period: "Período de inscripción nacional"
 LKT_focus_national_conscription_period_desc: "Debido a nuestro recuento de población abrumadoramente bajo en comparación con nuestros vecinos costeros, debemos introducir un período obligatorio de reclutamiento de al menos medio año. Muchos desaprobarán el movimiento, sin embargo si vamos a enfocarnos genuinamente en la defensa nacional y prepararnos para tal tomfoolery de los otros poderes en ser, entonces como tal debemos hacer esto."
 LKT_focus_military_classroom_standards: "Normas militares de aula"
 LKT_focus_military_classroom_standards_desc: "Al incorporar requisitos simples como proeza física y conocimientos básicos de tipo en formaciones de taladro, así como tácticas de unidad pequeñas, podemos crear una forma suelta de entrenamiento básico que luego prepara a los futuros adultos jóvenes reclutados para su período obligatorio de conscripción."
 LKT_focus_basic_economic_investments: "Inversiones económicas básicas"
 LKT_focus_basic_economic_investments_desc: "Si vamos a tener la oportunidad de defendernos entonces debemos realmente tener un medio para apoyar tales esfuerzos. Como tal, crearemos proyectos limitados de expansión industrial para que tengamos tales medios."
 LKT_focus_military_industrial_sector: "Sector industrial militar"
 LKT_focus_military_industrial_sector_desc: "El MIS es nuestra forma de complejo industrial militar. Sin embargo, la diferencia clave es que estas fábricas serán multipropósito en que se construirán con los medios de adaptabilidad. Lo que queremos decir es que estos todavía contribuyen a la economía civil en formas limitadas durante el tiempo de paz, pero pueden fácilmente convertir y aumentar la producción de materiales de guerra cuando llegue el momento."
 LKT_focus_less_for_more: "Menos para más"
 LKT_focus_less_for_more_desc: "Enfoque Para que las inversiones requieran menos mano de obra para ser utilizadas en empresas individuales y sectores económicos se libera más para los militares y para la expansión económica. Con esto en mente nuestra población es también aborreciblemente pequeña en comparación con el resto del continente prácticamente. Como tal, invertiremos en producción de alimentos, cadenas de suministro y aprovecharemos los medios de reproducción para que nuestros ciudadanos puedan vivir y amar como quieran."
 LKT_focus_general_military_improvements_funding: "Financiación de mejoras militares generales"
 LKT_focus_general_military_improvements_funding_desc: "El GMIF es un sólido paquete de financiación para permitir a nuestros militares mejorar los medios que consideramos necesarios para los campos de batalla potenciales en los que podemos encontrarnos. Con el aire siendo la mayor amenaza, dividiremos las inversiones uniformemente entre la fuerza aérea y el ejército por el momento."
 LKT_focus_the_parties_for_tradition: "Las Partes por Tradición"
 LKT_focus_the_parties_for_tradition_desc: "Una colección de partidos del centro-derecho a más simplemente derecho inclinado se reúnen para formar un bloque de votación conocido como las Partes por la Tradición. Como tal es una curiosidad ver si y qué partido el pueblo podría gravitar hacia la primera elección de la nación."
 LKT_focus_ORP_political_plan: "El Plan Político ORP"
 LKT_focus_ORP_political_plan_desc: "El Partido de la Antigua República utiliza una plataforma de estabilidad y precaución. La plataforma THis puede ser vista como lenta y constante ganando la carrera y considerando la situación en que nos encontramos como una nación creo que muchos no habrían votado por ellos si decidieron saltar el arma como algunas partes."
 LKT_focus_strategic_mechanization_act: "Ley de mecanización estratégica"
 LKT_focus_strategic_mechanization_act_desc: "La dependencia excesiva de nuestra economía para estar alrededor de la agricultura en algún grado u otro significa que mucha gente está atada en este esfuerzo. Como tal, a pesar del rugido que esto pueda crear, debemos hacer cumplir alguna forma de esfuerzos de mecanización como medio para distribuir mejor la fuerza de trabajo disponible que tenemos."
 LKT_focus_better_neighbors_act: "Ley de mejores vecinos"
 LKT_focus_better_neighbors_act_desc: "Dado que el sector económico primario es la agricultura, la abundancia de alimentos no es algo raro. Como tal podemos incentivar a los «buscadores de asilo» de nuestras naciones vecinas para iniciar la población y ayudar a reconstruir nuestra economía en su conjunto. Los trabajos no significan nada sin gente para llenarlos después de todo."
 LKT_focus_green_thumb_officers_act: "Los oficiales de Green Thumb actúan"
 LKT_focus_green_thumb_officers_act_desc: "La Ley GTO está pensada para mejorar la financiación de las fuerzas del orden y distribuir mejor los recursos entre los barrios y los medios de vida de las regiones más aisladas."
 LKT_focus_kansas_economic_upgrade: "Actualización económica de Kansas"
 LKT_focus_kansas_economic_upgrade_desc: "Un área significativa de desarrollo es nuestro estado más meridional de Kansas. Este estado para todo lo que su desarrollo tiene una dependencia agrícola más alta de lo esperado. Como tal, a través de algunas inversiones generosas planeamos convertir un área específica de la mayor economía agrícola en una mezcla de industria ligera y pesada."
 LKT_focus_better_budgeting_act: "Mejor Ley de presupuestación"
 LKT_focus_better_budgeting_act_desc: "La Ley de Mejores Presupuestos contempla el presupuesto educativo existente y hace una auditoría completa y detallada para ayudar a simplificar y asignar mejor los recursos fiscales. Con esto se pretende mejorar las normas educativas eliminando tanto como sea posible la inconsistencia que los fracasos presupuestarios pueden tener en estudiantes y personal."
 LKT_focus_experimental_extractions_act: "Ley de Extracciones Experimentales"
 LKT_focus_experimental_extractions_act_desc: "Nuestra nación carece de un acero núcleo y o simplemente una oferta de mineral de hierro decente. Como tales encuestas geológicas y fuertes inversiones, independientemente de la rentabilidad neta se llevarán a cabo en los estados de Kansas y Nebraska para asegurar que nuestra nación tenga acceso a este bloque crítico de construcción de la economía moderna."
 LKT_focus_GLP_political_plan: "El Plan Político del Gran Partido Liberal"
 LKT_focus_GLP_political_plan_desc: "Utilizar políticas moderadamente liberales para mejorar nuestra agricultura apoyará a nuestra nación y su pueblo. Muchos votaron por el Gran Partido Liberal porque fue visto como un partido de lento progreso, de cambios en formas que la gente podría adaptarse y comprender. Pero sólo el tiempo dirá si esto seguirá siendo verdad."
 LKT_focus_food_bank_securities_act: "Ley de valores del Banco Alimentario"
 LKT_focus_food_bank_securities_act_desc: "La Ley FBS es legislación para crear bonos gubernamentales y bonos de inversión privados que entrarán en la compra de alimentos comunes que los hogares puedan tener. Estos «bancos de alimentos» se utilizarán para ayudar a las familias a adquirir las necesidades diarias que pueden no ser capaces de pagar en tiempos de necesidad. Las organizaciones benéficas que tienen estructuras estables y coherentes que ayudan a alimentar a las personas sin hogar y otros ciudadanos empobrecidos también pueden solicitar esos valores, pero estarán acompañadas por reguladores federales para asegurar que se utilicen los alimentos y fiscales con fines previstos."
 LKT_focus_audit_commissions_act: "Ley de comisiones de auditoría"
 LKT_focus_audit_commissions_act_desc: ", la Ley de ACA o Auditoría es una legislación establecida para establecer una comisión independiente de auditores que asegure que los organismos federales y el personal estén asignando recursos fiscales y materiales a los medios enumerados y previstos. Este órgano se hará cargo de personas que no estén asociadas con ninguna institución política o partido político y, como tal, provendrán de las respectivas esferas financieras y reglamentarias para garantizar la imparcialidad."
 LKT_focus_raw_value_act: "Ley de valor bruto"
 LKT_focus_raw_value_act_desc: "Nuestra nación sólo puede obtener tanto valor de la agricultura. La gente quiere cosas y cosas requiere recursos minerales y como tal vamos a invertir en elementos de tierra raras y otras minas minerales de alto valor para asegurar que podemos diversificar nuestra cartera nacional por falta de mejores palabras."
 LKT_focus_improving_immigration_processes: "Mejoramiento de los procesos de inmigración"
 LKT_focus_improving_immigration_processes_desc: "Al invertir en mejorar los recursos dedicados a la aplicación de la inmigración y el proceso general para convertirse en ciudadanos, podemos esperar un llamamiento más suave y mejor a los extranjeros. Esta esperanza será que elijan a nuestra nación como su nuevo hogar y podemos darles un nuevo contrato de arrendamiento en la vida y su significado siempre precioso."
 LKT_focus_invest_care_act: "El acto de cuidado de inversión"
 LKT_focus_invest_care_act_desc: "Invest Care es una iniciativa presupuestaria para proporcionar financiación más coherente a los servicios médicos. Con estos mejores esfuerzos de financiación esperamos elevar la moral de los empleados y fomentar las oportunidades futuras de empleo, así como asegurarnos de que los edificios estén a la altura del código y el equipo está funcionando según lo previsto. Tu cuidado es nuestra inversión, porque una gente mejor significa una nación mejor."
 LKT_focus_national_defense_upgrades: "Actualizaciones de Defensa Nacional"
 LKT_focus_national_defense_upgrades_desc: "Las inversiones mejoradas para mejorar el equipo y la familiaridad del personal con dicho equipo aumentarán nuestras capacidades para ayudar a defender a nuestra nación de los actos de agresión extranjeros."
 LKT_focus_TTP_political_plan: "TTP Plan Político"
 LKT_focus_TTP_political_plan_desc: "El Partido de las Tradiciones Tribales es un partido semi-nativista en la naturaleza pero no en un grado que muchos asumirían. El nativismo viene alrededor de la idea de que mientras estas tierras eran una vez tierras tribales, para avanzar, preservar y sobrevivir debemos unirnos como una nación de muchos pueblos. Usando la tradición para la unidad, como la familia, la comunidad y la creencia en principios por los que nos fijamos a mantenernos fieles."
 LKT_focus_defense_spending_program: "Programa de gasto en defensa"
 LKT_focus_defense_spending_program_desc: "El DSP es un paquete de gasto diseñado alrededor de preparar a la nación para una postura más defensiva. Nuestras tierras están abiertas y cerradas en vastas áreas y, como tal, debemos trabajar estos terrenos a nuestra ventaja."
 LKT_focus_families_security_stipend: "Family Security Stipend"
 LKT_focus_families_security_stipend_desc: "Las Familias Stipend como muchos están llamando es un estipendio archivable que las familias pueden aplicar y llegar a ayudar a aliviar cualquier tensión económica que puedan estar enfrentando en relación con las necesidades familiares. Las necesidades de alimentos, ropa y cuidado infantil están cubiertas por el estipendio, así como una lista de otros artículos registrados con su tarjeta de estipendio federal."
 LKT_focus_food_supply_mandate: "Mandato de suministro de alimentos"
 LKT_focus_food_supply_mandate_desc: "Nuestro pueblo vive en tierras fértiles, tierras que deben alimentar fácilmente a los pueblos que viven sobre ellos. Con esto invertiremos y crearemos un mandato que nuestros ciudadanos siempre tendrán comida barata y buena para cada comida, cuando sea posible, porque es la supervivencia misma de nuestra nación que cuelga en el equilibrio de nuestro suministro de alimentos."
 LKT_focus_limited_industrialization_efforts: "Escasos esfuerzos de industrialización"
 LKT_focus_limited_industrialization_efforts_desc: "Para diversificar la economía y asegurar un mercado de trabajo saludable y robusto, debemos invertir en desarrollos industriales limitados para garantizar que nuestros recursos humanos sean tan diversos como estas tierras proporcionarán."
 LKT_focus_setting_up_new_contracts: "Setting Up New Contracts"
 LKT_focus_setting_up_new_contracts_desc: "Crear una base de referencia limitada para nuestras capacidades de fabricación militar nos dará al menos una métrica de las demandas que podemos enfrentar si la guerra alguna vez debe romper en el continente norteamericano."
 LKT_focus_strategic_mining_operations: "Operaciones estratégicas de minería"
 LKT_focus_strategic_mining_operations_desc: "Nuestra nación tiene recursos, pero tenemos que invertir bastante para adquirir minerales más vaulables y económicos de gran alcance. Con eso en mente invertiremos en preciosas extracción de metales en Wyoming y operaciones limitadas de metal ligero en Dakota del Sur. No será mucho, pero complementar algunos fondos R&D debe pagar a su debido tiempo."
 LKT_focus_LTSP_political_plan: "Plan Político de lTSP"
 LKT_focus_LTSP_political_plan_desc: "El Partido de Solidaridad Tradicional Lakotan & es un partido de medios conservadores bastante genéricos. Buscando enfocarse en asuntos comunitarios y familiares y utilizar esto como un medio para fomentar la unidad nacional, muchos se preguntan por qué este partido y algunos otros partidos igualmente conservadores existen incluso en el estado fracturado que son."
 LKT_focus_community_improvement_programs: "Programas de mejora comunitaria"
 LKT_focus_community_improvement_programs_desc: "Los CIP están diseñados para proporcionar a la comunidad un alcance y esfuerzos de mejora general para reunir a las comunidades y fomentar los acontecimientos generales fuera de las zonas más pequeñas o más rurales."
 LKT_focus_farming_expansion_efforts: "Actividades de ampliación de la agricultura"
 LKT_focus_farming_expansion_efforts_desc: "La estabilidad de nuestra nación prospera en el hecho de que tenemos muchas tierras fértiles y, como tal, desarrollaremos estas tierras para animar a nuestro pueblo a crecer con los campos que cultivan."
 LKT_focus_building_to_new_heights: "Building To New Heights"
 LKT_focus_building_to_new_heights_desc: "Los sectores de la oficina y la tecnología necesitan ampliarse. Si vamos a diversificar adecuadamente nuestra economía y el potencial de nuestro ciudadano entonces debemos invertir en nuevos desarrollos, así como esfuerzos educativos para apoyarlos."
 LKT_focus_manufacturing_new_industries: "Fabricación de nuevas industrias"
 LKT_focus_manufacturing_new_industries_desc: "Desarrollar la base básica de nuestra economía es fundamental para la expansión general."
 LKT_focus_securing_armaments: "Armamentos de seguridad"
 LKT_focus_securing_armaments_desc: "Ser capaz de abastecer nuestras tropas es primordial para nuestra defensa nacional. Ya que no esperamos nada en un futuro próximo, empezaremos pequeños y desarrollaremos un par de fábricas para manejar la escasez de equipos básicos."
 LKT_focus_natural_resources_act: "Ley de recursos naturales"
 LKT_focus_natural_resources_act_desc: "Un amplio y bien redondeado paquete de inversiones mineras que busca revolucionar las capacidades de recursos de nuestra nación. Aunque será costoso que pagará por sí mismo como marchas del tiempo."
 LKT_focus_the_common_folk_progress_parties: "Los Partidos Populares de Progreso"
 LKT_focus_the_common_folk_progress_parties_desc: "Los Partidos Populares como algunos prefieren llamar a los crecientes partidos socialistas alineados económicos son un grupo de partidos que en alguna forma o moda creen que necesitan ganar tracción para que el «derecho» no lo haga. Independientemente de lo que algunos funcionarios del partido en estos diferentes grupos quieren usar como excusa, muchos ven a estos partidos como una forma más común de ver la nación ya que la mayoría de las tierras no se desarrollan y así «Big Business» realmente no existe en el sentido tradicional."
 LKT_focus_FPP_political_plan: "El Plan Político FPP"
 LKT_focus_FPP_political_plan_desc: "Trabajando sobre la base de un partido obrero del agricultor, el Partido Progresista del Agricultor está utilizando la idea de principios socialistas democráticos para la nación de un agricultor. Esencialmente en lugar de centrarse principalmente en los trabajadores industriales, su enfoque será el mejoramiento de los trabajadores agrícolas. Considerando el maquillaje de la economía de nuestra nación, no es de extrañar que hayan ganado las elecciones."
 LKT_focus_american_asylum_act: "«Americano» Ley de asilo"
 LKT_focus_american_asylum_act_desc: "El triple A actúa como algunos lo llaman, es una pseudo política de frontera abierta. Esencialmente hablando aquellos que pueden probar que vivieron durante largo tiempo de permanencia que vivieron en los territorios de la antigua república se concederá asilo en la nación. Este tipo de toma del lema usado alrededor de la estatua de libertad en el este es una gran manera de traer a la gente a nuestra nación y crecer nuestra economía a través de trabajos que parece estar haciendo más de entonces tenemos gente para llenarlos."
 LKT_focus_expanded_health_services: "Servicios de salud ampliados"
 LKT_focus_expanded_health_services_desc: "Mejorar nuestras capacidades de atención médica y poder llegar a cualquier persona dentro de una cantidad razonable de tiempo garantizará las tasas de supervivencia y mejorará la salud general de nuestros ciudadanos."
 LKT_focus_fine_tuning_industrial_regulations: "Regulación industrial de ajuste fino"
 LKT_focus_fine_tuning_industrial_regulations_desc: "Si bien nuestro maquillaje económico no depende en gran medida de la industria, todavía podemos vencer la curva ajustando un pre-empativamente golpeando ciertas regulaciones problemáticas que han sofocado o perjudicado abiertamente a los ciudadanos de una multitud de naciones."
 LKT_focus_more_for_more_act: "Más para más acción"
 LKT_focus_more_for_more_act_desc: "Esta iniciativa de financiación ayudará a racionalizar mejor las prácticas agrícolas, al tiempo que alentará la construcción de nuevas explotaciones agrícolas e industrias conexas. Cuanto más se tenga en cuenta para mayor parte el hecho de que menos personas irán a la agricultura a largo plazo, sin embargo el mismo tipo de gente agrícola seguirá siendo capaz de participar."
 LKT_focus_farmer_jims_research_emporium: "Emporium de investigación del granjero Jim"
 LKT_focus_farmer_jims_research_emporium_desc: "Un emporio de investigación agrícola ayudará a generar nuevas generaciones de agricultores, así como puede duplicarse como una instalación de investigación para ayudar a mejorar la producción de productos agrícolas."
 LKT_focus_steeled_veins_act: "Acero Veins actuar"
 LKT_focus_steeled_veins_act_desc: "El mineral de hierro, la sangre viva para crear acero un pilar crítico de las economías y estructuras modernas está debajo de nuestros pies. Debemos invertir y asegurarnos de que podamos asegurar este recurso comúnmente demandado si vamos a tener una economía estable y funcional."
 LKT_focus_LAS_political_plan: "LAS POLÍTICAS"
 LKT_focus_LAS_political_plan_desc: "La Sociedad Agraria de Lakotan es un movimiento colectivista que busca modernizar las políticas agrarias al mismo tiempo que contempla formas de cortar el gobierno de maneras que devuelven más poder al propio pueblo."
 LKT_focus_asylum_experiment: "Experimento de asilo"
 LKT_focus_asylum_experiment_desc: "Buscamos poblar nuestras tierras, nuestras granjas y nuestra propia nación. Como tal, debemos buscar las mejores formas de asilo buscando y hacer lo que sea necesario para inventar estas breves llegadas críticas."
 LKT_focus_improving_farming_methods: "Mejoramiento de los métodos agrícolas"
 LKT_focus_improving_farming_methods_desc: "Invertir para mejorar las necesidades económicas básicas como la producción de alimentos beneficiará a cada individuo independientemente de su procedencia. Como tal, vamos a buscar maneras de mejorar la agricultura de cualquier manera para mejorar nuestros suministros alimenticios."
 LKT_focus_mechanized_agriculture_union: "Unión de Agricultura Mecanizada"
 LKT_focus_mechanized_agriculture_union_desc: "Al unir los sectores económicos de la industria y la agricultura sentamos un precedente mutuo que estos sectores no pueden funcionar sin el mejoramiento del otro. Como tal crecimiento y desarrollo mutuo deben ser asegurados si tenemos que tener una sociedad verdaderamente igual."
 LKT_focus_local_farming_initiatives: "Iniciativas Locales de Agricultura"
 LKT_focus_local_farming_initiatives_desc: "El mayor problema para la seguridad alimentaria es las líneas de suministro. Ser capaz de producir mercancías a granel no significa nada si estropean antes de llegar a almacenar estantes. Con esto en mente, fomentaremos más desarrollos locales para disminuir la necesidad de transporte largo de alimentos. Mejorar el precio por artículo y la moneda lista que nuestro pueblo tendrá para sus necesidades."
 LKT_focus_more_ways_to_work_the_land: "Más formas de trabajar en la tierra"
 LKT_focus_more_ways_to_work_the_land_desc: "La agricultura sólo puede llegar hasta ahora y las exigencias de los métodos agrícolas modernos significa que debemos atravesar adecuadamente las tierras y encontrar recursos minerales. Como tal conjunto nacionalmente equilibrado de encuestas geológicas, las operaciones mineras así como la creación de nuevas instalaciones de procesamiento pondrán a nuestra nación en alturas nunca antes vistas en la era moderna."
 LKT_focus_the_land_of_opportunity: "The Land Of Opportunity"
 LKT_focus_the_land_of_opportunity_desc: "Nuestras tierras son vastas, vacías y maduras para que las comunidades prosperen y trabajen juntas. Pongamos en marcha un mandato de dar la bienvenida a los que buscan un mejor mañana."
 LKT_focus_PNP_political_plan: "PNP Plan Político"
 LKT_focus_PNP_political_plan_desc: "La fiesta para la preservación nacional es una fiesta verde bastante estándar. A pesar de comprometerse en comparación con los más tradicionales, el PNP busca modernizarse así como asegurar que la belleza natural de la nación permanezca en tacto."
 LKT_focus_building_tall_not_wide: "Tall de edificio no ancho"
 LKT_focus_building_tall_not_wide_desc: "Al investigar nuevas formas de eficiencia de fábrica podemos trabajar juntos para encontrar maneras de mantenernos al día con las demandas de nuestra sociedad sin necesidad de utilizar tanto terreno en el proceso."
 LKT_focus_stable_economics: "Estado de economía estable"
 LKT_focus_stable_economics_desc: "Enfoque En cuanto a nuestra estabilidad económica, debemos encontrar un equilibrio entre la eficiencia en las fábricas y otros sectores económicos mientras buscamos compensar el diferente mercado de trabajo. Como tal, tendremos que mejorar nuestras inversiones en servicios sociales e iniciativas de planificación económica."
 LKT_focus_local_food_producers: "Productores locales de alimentos"
 LKT_focus_local_food_producers_desc: "El programa LFP establece un puñado de fincas diseñadas para alimentar a las poblaciones locales. Mayor reducción de los costos alimentarios y fomento del gasto interno en lugar de la importación y exportación extranjeras."
 LKT_focus_sufficient_tech_investments: "Inversiones tecnológicas suficientes"
 LKT_focus_sufficient_tech_investments_desc: "El sector tecnológico en nuestra nación es poco o nada. Sin embargo, tenemos los recursos para hacer alguna inversión decente para que al menos podamos tener tanto la diversidad en el empleo como los recursos avilables para utilizar más adelante."
 LKT_focus_domestic_arms_production_efforts: "Actividades de producción de armas domésticas"
 LKT_focus_domestic_arms_production_efforts_desc: "Nuestra capacidad para preservar nuestras tierras y nuestro pueblo está apalancada sólo por las capacidades de nuestra fuerza militar permanente. Aunque nada parece estar sucediendo en un futuro cercano, no tener nada que empezar tampoco está planeando por ninguna parte de la imaginación."
 LKT_focus_eco_extraction_efforts: "Eco-Extract efforts"
 LKT_focus_eco_extraction_efforts_desc: "Mediante un buen manejo y refinación de los medios de extracción de recursos, podemos tener una amplia y diversa cantidad de recursos. Sin embargo, las cantidades directas serán severamente limitadas simplemente debido a nuestra propia moderación en las operaciones mineras. Pero esperamos seguir desarrollando medios para obtener más de menos a medida que avanza la tecnología."
 LKT_focus_RBP_political_plan: "Plan Político RBP"
 LKT_focus_RBP_political_plan_desc: "El Partido Rose Bush espera promover los derechos de los trabajadores y, en general, hacer avanzar a la nación por un camino progresivo de industrialización. Buscando crear más una unión entre el desarrollo económico y el desarrollo social. El RBP hará lo que pueda para garantizar la estabilidad y la prosperidad entre jefes y trabajadores."
 LKT_focus_revamped_corporate_taxes: "Impuestos corporativos revisados"
 LKT_focus_revamped_corporate_taxes_desc: "Mediante la revisión del código tributario, especialmente en torno a la tasa de impuestos corporativos más estandarizada, podemos asegurarnos de que tenemos una forma estable de ingresos y cambiar más de las necesidades fiscales a entidades corporativas o de oficina en lugar del pagador fiscal promedio."
 LKT_focus_education_for_all: "Educación para Todos"
 LKT_focus_education_for_all_desc: "Ampliando enormemente nuestros sistemas educativos y la capacidad de cada ciudadano para adquirir los conocimientos del mundo que nos rodea. Esto nos permite obtener beneficios pasivos a medida que nuestra población se vuelve más educada y alcanza niveles más altos y más altos como base de referencia."
 LKT_focus_fixing_our_ore_deal: "Arreglar nuestro acuerdo de mineral"
 LKT_focus_fixing_our_ore_deal_desc: "Hierro, acero, el pilar moderno que sostiene cualquier economía después del hormigón mismo. Debemos invertir decentemente en hacer nuestras propias líneas de suministro de acero si queremos sobrevivir mucho tiempo por nuestra cuenta. Estamos rodeados de todos los lados por desconocidos, así que al menos hagamos una cosa conocida."
 LKT_focus_from_fields_to_cities_act: "Ley de campos a ciudades"
 LKT_focus_from_fields_to_cities_act_desc: "Los desarrollos generales en nuestros centros rurales y urbanos permiten una amplia expansión al mercado de trabajo y a la calidad de los empleos disponibles para nuestros ciudadanos."
 LKT_focus_from_it_sector_developments: "Desarrollos del sector de la TI"
 LKT_focus_from_it_sector_developments_desc: "Tener un sector informático y tecnológico pequeño pero autosuficiente será muy beneficioso para continuar los esfuerzos por diversificar adecuadamente nuestro maquillaje económico."
 LKT_focus_supplying_our_military_needs: "Suministro de nuestras necesidades militares"
 LKT_focus_supplying_our_military_needs_desc: "Las necesidades básicas deben satisfacerse en todo momento, independientemente de que sean civiles o militares. Si queremos defendernos de cualquier incursión extranjera, entonces debemos desarrollar algunas fábricas para asegurar que la producción militar sea viable a nuestras necesidades."
 LKT_focus_new_lakotan_nationals_parties: "Nuevos nacionales de Lakotan, Partes"
 LKT_focus_new_lakotan_nationals_parties_desc: "La marea creciente del pensamiento económico socialista, la implosión súbita y violenta de la vieja república y las tierras inalteradas e intocadas por las que nuestra nación ocupa. Estas son sólo algunas razones por las cuales ustedes, los ciudadanos de nuestra nación gloriosa deben votar por uno de nosotros. ¡Los New Lakotan Nationals! Únete a nosotros para mantener la nueva identidad por la que hemos forjado libres de intromisión extranjera y el idealismo marxista o incluso maoísta. Votar hoy y hacer su parte!"
 LKT_focus_YIP_political_plan: "YIP Plan Político"
 LKT_focus_YIP_political_plan_desc: "El YIP o el Young Industrialist Party es un partido centrado en la modernización y poner la prosperidad a la vanguardia de la política. Aunque algunos temen que son mearly sólo oligarcas en capas, muchos dentro del partido se centran en mostrar y probar los esfuerzos planeados en lugar de entretener el tradicional alboroto político de barro."
 LKT_focus_sponsored_immigration: "Inmigración patrocinada"
 LKT_focus_sponsored_immigration_desc: "Nuestras tierras son estériles, nuestros ciudadanos pocos y como tal debemos traer nuevos clientes buscando una vida mejor. Un mercado de trabajo vacío esperando ser llenado y tierra para establecerse en lo que el ojo puede ver. Esa es nuestra promesa a estos nuevos pioneros."
 LKT_focus_recruiting_talent: "Contratación de talento"
 LKT_focus_recruiting_talent_desc: "Otras formas de mejorar nuestro recuento principal para la población es ofrecer oportunidades a los trabajadores cualificados. Mejores salarios y condiciones de vida es siempre un buen incentivo."
 LKT_focus_south_munitions: "Municiones del Sur"
 LKT_focus_south_munitions_desc: "Garantizar cadenas de producción locales para suministros militares permitirá a nuestros miembros del servicio hacer frente a cualquier amenaza que nos suponga."
 LKT_focus_central_industries: "Industrias centrales"
 LKT_focus_central_industries_desc: "No puedo apoyar a un militar sin apoyar a la gente misma. Como tal, centralizaremos los desarrollos industriales para adaptarse mejor a las necesidades de viajes en busca de empleo."
 LKT_focus_bismarck_bombs: "Bombas Bismarck"
 LKT_focus_bismarck_bombs_desc: "Más manufactorias militares arriba en las llanuras del norte nos permitirán lidiar con materiales más volátiles con daños colaterales limitados si algo ocurre alguna vez."
 LKT_focus_promoting_human_resources: "Promoción de los recursos humanos"
 LKT_focus_promoting_human_resources_desc: "Los campos están maduros para la recolección y también lo son las personas. Al incentivar la producción agrícola y las personas para conseguirla de campo a tablas en todo el país debemos asegurar los desarrollos específicos de los esfuerzos de inmigración, así como el apoyo económico para hacerlo."
 LKT_focus_CDS_political_plan: "CDS Plan Político"
 LKT_focus_CDS_political_plan_desc: "Nacionalismo geográfico y aislacionismo. Estos dos pilares son los que sostienen los valores fundamentales de la «Sociedad» y su algo que muchos están confundidos. Para uno, ¿cómo es que uno sólo sea «Geográficamente nacionalista» y dos, cómo puede el aislacionismo incluso ayudarnos con tan poco desarrollo a nuestro nombre para empezar. Cualquiera que sea el caso puede ser la Sociedad Crop Duster cobra adelante mientras se apoderan de la victoria en las elecciones."
 LKT_focus_learning_social_values: "Aprendizaje de valores sociales"
 LKT_focus_learning_social_values_desc: "Nuestra sociedad se avergüenza porque la gente no sabe qué defender como nuestra propia. La familia, la nación y el espíritu de las tierras en las que vivimos son todos los valores fundamentales para promover y asegurar una sociedad más estable y justa."
 LKT_focus_character_creation_programs: "Programas de creación de caracteres"
 LKT_focus_character_creation_programs_desc: "Mediante una mezcla de programas voluntarios y obligatorios que integran parte de la educación y el servicio militar, muchos de nuestros ciudadanos y generaciones futuras estarán facultados para comprender la responsabilidad y el deber. No sólo a la nación sino a sí mismos, a su familia y a aquellos que les son queridos."
 LKT_focus_supply_chains: "Cadenas de suministro"
 LKT_focus_supply_chains_desc: "Nuestra nación es vasta, sobre todo plana y en general una nación bastante subdesarrollada en eso. Debemos hacer todo lo posible para crear líneas de suministro fuertes y flexibles que apoyen a nuestra nación."
 LKT_focus_domestic_families_act: "Ley de la familia doméstica"
 LKT_focus_domestic_families_act_desc: "El DFA es un paquete presupuestario diseñado para promover y subvencionar realmente a las familias más grandes y fomentar así el crecimiento de la población nacional. Como el talento extranjero puede ser difícil de encontrar que pueda ajustarse a nuestros estándares culturales debemos asegurarnos de que nuestro bajo recuento de población nunca sea un factor crítico en nuestra propia supervivencia."
 LKT_focus_encouraging_favorable_migrants: "Alentando a los migrantes favorables"
 LKT_focus_encouraging_favorable_migrants_desc: "Debemos escanear y buscar el talento y las habilidades que nuestra nación y sus ciudadanos necesitan. Porque nuestra supervivencia está limitada sólo a nuestra capacidad y como tal debemos forzarnos a aumentar las habilidades que podemos tener."
 LKT_focus_increased_military_investments: "Aumento de las inversiones militares"
 LKT_focus_increased_military_investments_desc: "Necesitamos asegurar que nuestros miembros de servicio estén equipados y listos para cualquier fuerza enemiga que pueda caer en nuestras tierras."
 LKT_focus_LGF_political_plan: "IGF Political Plan"
 LKT_focus_LGF_political_plan_desc: "La Liga de los Campos Dorados como muchos se refieren es una fiesta que no muchos creían ganar, pero aquí estamos. Muchos no están seguros de cómo un partido así ganó para empezar, pero con tiempos tan inciertos supongo que hay poco en el camino de lo que se puede hacer. Esperemos que sea más bueno que malo."
 LKT_focus_improved_food_production: "Mejor producción de alimentos"
 LKT_focus_improved_food_production_desc: "Garantizar alimentos para nuestra población fomenta el crecimiento nacional y la estabilidad social."
 LKT_focus_increasing_industrial_base: "Aumento de la base industrial"
 LKT_focus_increasing_industrial_base_desc: "Aumentar nuestra capacidad industrial nos permite diversificar nuestra economía, mejorar su salud general y brindar a nuestros ciudadanos más oportunidades que nunca encontrarían en aquellos que nos limitan."
 LKT_focus_local_military_production: "Producción militar local"
 LKT_focus_local_military_production_desc: "Invertir en la fabricación militar local nos permite asegurar equipos para nuestros servicios armados y evita la desintegración de nuestros militares. Sin embargo, debemos profundizar en esto si queremos defendernos verdaderamente de los salvajes que miran nuestras tierras con codicia y envidia."
 LKT_focus_increasing_lawful_order: "Aumento de la orden legal"
 LKT_focus_increasing_lawful_order_desc: "Aumentando el brote para los servicios de policía y seguridad podemos ir tras crímenes de todo tipo. Así, permitiéndonos mantener a las entidades corporativas en línea así como potenciales meddlers extranjeros que puedan mezclarse con la multitud de ciudadanos que tienen derecho."
 LKT_focus_military_education_act: "Ley de educación militar"
 LKT_focus_military_education_act_desc: "El MEA es una estandarización de la educación en torno a las directrices de una organización militar. Los intelectuales ya no infectarán las mentes de nuestra juventud con ideas falsas que errogan los cimientos de nuestra sociedad. Ahora es deber, honor, coraje, respeto y sacrificio. Para el hogar, la familia y los queridos en los corazones y las mentes de todos nuestros ciudadanos."
 LKT_focus_self_mobilization: "Ley de automovilización"
 LKT_focus_self_mobilization_desc: "La Ley de automovilización es un plan económico integral para movilizar a la nación y sus ciudadanos en una especie de «estancia de los medios», por ejemplo. Esto significa que la herramienta para que la economía sea más eficiente, empleando a más personas en situación de movilización real y aumentando los esfuerzos de conscripción para preparar mental y socialmente a la población para satisfacer las necesidades de cualquier incursión hostil contra nosotros."
 LKT_focus_HOY_political_plan: "Plan Político Hoy"
 LKT_focus_HOY_political_plan_desc: "La Casa de Yellowstone está separada del fenómeno global más amplio que es el «Modern Monarchist Movement». Este movimiento político general y ligeramente diverso tiene sólo un inquilino principal que es la gloria al voto y no la sangre. Esto significa simplemente mantener y refinar el proceso de votación para ser más amplio y flexible. Cosas como el sufrimiento universal a la edad de 18 años, el voto de elección clasificada para los candidatos y convertir las oficinas elegidas en títulos. Lo que significa que el presidente es ahora el Rey o decir que un representante es ahora un señor o lo que no. Muchos están confundidos pero la mayoría se venden lentamente sobre la idea de ser un duque, barón o lo que no simplemente por ser un funcionario de la nación."
 LKT_focus_office_titles_act: "Ley de títulos de oficina"
 LKT_focus_office_titles_act_desc: "Estandarizar los títulos feudales alrededor de las oficinas del gobierno mostrará a la gente que si trabajan lo suficientemente duro, incluso pueden ser un príncipe o una princesa."
 LKT_focus_expanding_mining_operations: "Ampliación de las operaciones mineras"
 LKT_focus_expanding_mining_operations_desc: "Tenemos que asegurarnos de que nuestra nación pueda estar en pie. Como tal, tenemos que invertir en operaciones mineras relacionadas con la extracción de recursos minerales en los que somos críticomente deficientes."
 LKT_focus_farmers_primacy_act: "Ley de primacía de los agricultores"
 LKT_focus_farmers_primacy_act_desc: "Nuestra seguridad alimentaria es la única cosa para crear una economía estable. Con nuestra población tan pequeña debemos hacer todo lo que podamos para fomentar su crecimiento y la alimentación es una de las mejores maneras de hacerlo."
 LKT_focus_expanding_immigration_efforts: "Ampliación de los esfuerzos de inmigración"
 LKT_focus_expanding_immigration_efforts_desc: "El estado de las cosas en el mundo es como un acto de equilibrio. Algunas naciones son buenas, otras están bien y otras siguen siendo malas. Debemos esforzarnos para que los que nos limitan vean que somos una de las mejores naciones. Alentar la inmigración ayuda a estabilizar nuestro mercado de trabajo y ayuda a estimular el desarrollo en áreas que carecen severamente."
 LKT_focus_improving_education_standards: "Mejoramiento de las normas de educación"
 LKT_focus_improving_education_standards_desc: "Debemos avanzar en las normas de educación para garantizar que nuestra capacidad de innovar y producir bienes y servicios pueda ser lo menos despilfarra posible."
 LKT_focus_national_economic_investments: "Inversiones económicas nacionales"
 LKT_focus_national_economic_investments_desc: "Diversificar nuestra economía es asegurar pasivamente nuestra independencia nacional. Produciendo sólo un poco de todo lo que podemos utilizar este taburete como una manera de negociar y trabajar nuestro camino en relaciones exteriores y acuerdos comerciales por igual."
 LKT_focus_industrialization_question: "La cuestión industrial"
 LKT_focus_industrialization_question_desc: "Los «Grand Plains States», como muchos se refieren a una buena parte de los estados que tenemos bajo nuestro control son algunas de las tierras menos desarrolladas en la antigua república y ciertamente dentro de la nueva república que tenemos. Sin embargo, tenemos un nuevo gobierno y un nuevo comienzo para hacer lo que queramos. Como tal, debemos hacernos una pregunta. Para industrializar o no."
 LKT_focus_the_great_northern_railway: "El Gran Ferrocarril Norte"
 LKT_focus_the_great_northern_railway_desc: "Una vez un mero engranaje en el ferrocarril de Burlington Northern Sante Fe, ahora es una vez más una empresa independiente. Con la reorganización de lo limitado que tenemos disponible para nosotros, podemos establecer tanto una bandera caída en la historia del ferrocarril como mejorar y financiar nuestra creciente infraestructura."
 LKT_focus_northern_bypass: "North Bypass"
 LKT_focus_northern_bypass_desc: "La ruta de los territorios fronterizos a lo largo de la frontera canadiense nos permitirá tener una ruta alternativa para transportar mercancías desde Montana a Dakota del Norte. sin mencionar el potencial de las necesidades de transporte relacionadas con acuerdos comerciales también."
 LKT_focus_great_western_mainline: "Gran West Mainline"
 LKT_focus_great_western_mainline_desc: "Viajar por Montana a Wyoming nos permitirá trepar grandes cantidades de carga a través de los diversos terrenos montañosos y montañosos de nuestra región occidental."
 LKT_focus_the_southern_extension: "La extensión del sur"
 LKT_focus_the_southern_extension_desc: "Trabajar nuestro camino a Kansas nos permite transportar mercancías desde lejos norte en los Dakotas hasta el estado más o menos aislado y, por lo tanto, fomentar la cooperación entre todos los estados dentro de nuestra república."
 LKT_focus_completing_the_network: "Completar la red"
 LKT_focus_completing_the_network_desc: "Redondear nuestras inversiones mediante la creación de bypasses en diferentes lugares estratégicos nos permite tener rutas alternativas en caso de desastre natural, accidentes hechos por el hombre o cualquier cosa que pueda ocurrir que podría dañar una o más rutas existentes."
 LKT_focus_modern_agrarian_economy: "A Modern Agrarian Economy"
 LKT_focus_modern_agrarian_economy_desc: "Nuestras tierras son vastas, fértiles y abundantes. Sería una lástima dejar que todo se desperdiciara bajo la naturaleza tóxica y llorosa que es el industrialismo moderno. Debemos volver a un medio más simple y aún más sofisticado para alcanzar nuestra dependencia económica. Estas tierras serán la clave para eso, porque cada parte de esta tierra será una granja para nutrir al mundo en general."
 LKT_focus_northern_farms_adaptation_act: "Ley de adaptación a las granjas septentrionales"
 LKT_focus_northern_farms_adaptation_act_desc: "El NFAA es legislación para invertir en granjas y centros agrícolas en los estados del norte. Estos incluyen inversiones y financiación, así como capacitación para métodos de adaptación invernal, así como estructuras potencialmente nuevas y medios de proporcionar productos incluso en el conjunto muerto del invierno. Las casas verdes y las instalaciones debidamente aisladas y climatizadas para el stock en vivo significan que habrá un medio estable de estar en un agricultor casi todo el año."
 LKT_focus_centralia_farms_act: "Ley de granjas de Centralia"
 LKT_focus_centralia_farms_act_desc: "El CFA reorganizará las fincas en los estados centrales de nuestra nación bajo una entidad corporativa conjunta pública y privada. El objetivo principal de esto es instigar el equilibrio en el crecimiento, así como asegurar la diversidad en los productos agrícolas basados en las capacidades de cada estado a mano. Siendo la división más grande en casi la mitad del estado, el interés compartido de la generación privada de riqueza así como la seguridad del interés público en la seguridad alimentaria es por eso que esta es una empresa conjunta."
 LKT_focus_southern_farming_traditions: "Tradiciones de granjas del sur"
 LKT_focus_southern_farming_traditions_desc: "En la parte sur de la nación, así como en la antigua república, una especie de tradición blanda era la importancia de cultivar cultivos comerciales. Ahora, mientras somos una nueva nación, no puede estar bajo la importancia de algunos de estos cultivos comerciales en términos de exportación y valor nacional que se debe tener. Como tal, vamos a engranar nuestro estado sureño más estable del clima de Kansas para estar más inclinados a producir una mezcla de estos cultivos comerciales."
 LKT_focus_targeted_mechanization_efforts: "Actividades de mecanización dirigidas"
 LKT_focus_targeted_mechanization_efforts_desc: "Al enfocar cualquier esfuerzo industrial en impulsar el sector agrícola, podemos asegurar un vasto aumento de productividad y una economía diversificada adecuada para retroceder, Nunca se sabe si el clima o un fenómeno global debe intentar dañarnos."
 LKT_focus_bio_fuel_investments: "Inversiones de biocombustibles"
 LKT_focus_bio_fuel_investments_desc: "Utilizando nuestro sistema educativo para diversificar e impedir los beneficios de una economía agraria. Ahora podemos buscar refinar y explorar nuevas formas de biocombustibles para ayudar a alimentar nuestros coches, hogares y negocios."
 LKT_focus_the_farmers_tax_code: "Código Fiscal del Agricultor"
 LKT_focus_the_farmers_tax_code_desc: "Haciendo un recrudecimiento completo del código tributario y construyéndolo alrededor del precedente de preservar nuestros medios agrarios de producción. Podemos asegurar la estabilidad dentro de la fuerza de trabajo y buscar ayudar a invertir en futuras granjas y agricultores para nuestra nación."
 LKT_focus_funding_general_education_improvements: "Financiación de mejoras de la educación general"
 LKT_focus_funding_general_education_improvements_desc: "Dedicar nuestro presupuesto a la educación ayudará a las generaciones futuras a ayudar a progresar nuestras necesidades tecnológicas como curiosidad y surge la necesidad misma."
 LKT_focus_bio_fuel_engineering_institute: "Instituto de Ingeniería Bio-Fuel"
 LKT_focus_bio_fuel_engineering_institute_desc: "El BFEI es un centro dedicado de investigación y educación superior dedicado a mejorar las aplicaciones y la eficiencia general de los biocombustibles. Usaremos esta institución como un pilar para la educación y mejor la eficacia de nuestra proeza económica."
 LKT_focus_skill_set_education_programs: "Juegos de Skill Education Programs"
 LKT_focus_skill_set_education_programs_desc: "La SSEP es una financiación incitativa para diversificar y mejorar aún más las habilidades generales que nuestros ciudadanos pueden adquirir en su vida. Esperamos que esto mejore considerablemente los esfuerzos en materia de empleo y dé lugar a un enfoque más estable y redondeado del crecimiento económico y el desarrollo."
 LKT_focus_lakotan_development_fund: "El Fondo de Desarrollo de Lakotan"
 LKT_focus_lakotan_development_fund_desc: "Al asignar una sección específica del presupuesto, podemos asegurar que se creen desarrollos específicos para equilibrar y mejorar nuestra base económica."
 LKT_focus_the_fifth_revolution: "The 5th Industrial Revolution"
 LKT_focus_the_fifth_revolution_desc: "A la vuelta de los milenios, los actos de industrialización habían pasado por dos importantes iteraciones. Desde allí vimos que el tercero era el aumento de los elementos de automatización y la fuente era el surgimiento de la IA e integraciones informáticas más allá de lo que se pensaba posible. Ahora fijamos el escenario para la quinta revolución, donde nosotros, una nación de campos y nada mero en términos de industria, rivalizaremos incluso con el ascenso de los del lejano oriente en su modernización."
 LKT_focus_rushmore_revival: "Proyecto Rushmore Revival"
 LKT_focus_rushmore_revival_desc: "Los Dakotas son un símbolo, no sólo del nuevo nombre de identidad más neutral o nuevo que hemos elegido para nuestra nación. Pero estos dos estados son un símbolo para la identidad central de las tierras por las que ocupamos. Como tal, debemos hacer de estos dos la primera prioridad en nuestra nueva política de revolución para la industrialización de la nación en general."
 LKT_focus_rocky_roads_no_more: "Proyecto Rocky Roads No Más"
 LKT_focus_rocky_roads_no_more_desc: "Nuestros estados de Montana y Wyoming, aquellos que limitan o son prácticamente secciones enteras de la cordillera rocosa son de importancia estratégica. Estos estados sirven como conexiones a través de la cordillera y desafíos para el desarrollo debido al terreno. Por lo tanto, deben tomarse inversiones compresivas en infraestructura y desarrollo económico para garantizar que estos estados no se dejen atrás."
 LKT_focus_kansas_city_kerosene: "Proyecto Kansas City Kerosene"
 LKT_focus_kansas_city_kerosene_desc: "Los estados de Kansas y Nebraska tienen un potencial sin explotar. Con estos estados que tienen aceite notable, así como campos de gas natural que se derivan técnicamente de los orígenes de Texas. Podemos utilizar estos recursos para impulsar nuestra nación al frente del industrialismo. Mediante la coordinación de los esfuerzos mineros, así como las inversiones económicas, deberíamos poder esperar grandes cosas."
 LKT_focus_rare_earth_energy_act: "Ley de energía terrestre rara"
 LKT_focus_rare_earth_energy_act_desc: "El desarrollo de minas elementales terrestres raras, así como la ampliación de nuestra capacidad energética nacional, nos permitirá no sólo continuar el crecimiento de nuestra base industrial, sino también proporcionarnos chips de negociación para los esfuerzos diplomáticos."
 LKT_focus_project_nebraska_namesake: "Proyecto Nebraska Namesake"
 LKT_focus_project_nebraska_namesake_desc: "El estado de Nebraska tiene una gran cantidad de recursos estratégicos que no se explotan para la verdadera escala o los recursos totalmente intactos que conocemos. Como tal, iniciaremos una amplia campaña de minería y reconocimiento para asegurar que estos recursos estratégicos se presenten para alimentar no sólo nuestra industrialización, sino también aumentar nuestro potencial de capital político extranjero."
 LKT_focus_business_tax_reforms: "Reformas fiscales de las empresas"
 LKT_focus_business_tax_reforms_desc: "Con nuestra creciente base industrial, nuestro maquillaje económico se vuelve cada vez más diverso. Como tal, necesitamos echar un buen vistazo y revisar el código tributario de nuestros diversos sectores empresariales para garantizar la naturaleza justa y justa del código. Esto debería permitirnos aumentar los medios naturales para los que los propios ciudadanos pueden crear startups, así como simplemente ahorrar su propio dinero y contribuir a la economía de cualquier manera que se parezca."
 LKT_focus_peoples_tax_reforms: "Reformas Fiscales del Pueblo"
 LKT_focus_peoples_tax_reforms_desc: "Mientras que el negocio es bueno, esos negocios sólo hacen lo bueno que las personas mismas son. Como tal, necesitamos asegurar que el código tributario sea simplificado, modernizado y razonable para mantener una ciudadanía cada vez industrializada."
 LKT_focus_establishing_lakotan_institute_of_technology: "El Instituto de Tecnología de Lakotan"
 LKT_focus_establishing_lakotan_institute_of_technology_desc: "La creación del LIT es un avance decisivo en los esfuerzos de R&D centralizados. No sólo conseguimos reunir recursos tanto materiales como humanos en un área más localizada. Esta institución está diseñada para ayudar a desarrollar y mejorar las ciencias conocidas a lo mejor de las capacidades de cualquiera."
 LKT_focus_national_investment_progrmas: "Programas nacionales de inversión"
 LKT_focus_national_investment_progrmas_desc: "Con nuestra economía en camino y cosas mirando hacia arriba y arriba, ahora podemos empezar a calmarnos y establecer un rumbo constante. Algunas inversiones generales a través de la junta en términos de programas de presupuesto permitirán que nuestra gente se especialice, crezca y adapte a la economía siempre cambiante de la era moderna."
 LKT_focus_a_new_economy: "Una nueva economía"
 LKT_focus_a_new_economy_desc: "Con la economía situada ahora podemos centrarnos en nuestra política. En general, ahora estamos un paso más cerca de mirar más allá de nuestros asuntos internos."
 LKT_focus_department_of_energy: "The Department Of Energy"
 LKT_focus_department_of_energy_desc: "Tener una economía está todo bien y alegre, sin embargo no significa nada si no podemos realmente poder y utilizarla. Como tal, estableceremos el Departamento de Energía de Lakotan para asegurarnos de resolver este problema."
 LKT_focus_fueling_agrarianism: "Fueling Agrarianism"
 LKT_focus_fueling_agrarianism_desc: "Dado que la economía nacional es la supremacía agrícola, debemos adaptar y hacer crecer nuestra economía energética para satisfacer esas demandas. Lo bueno es que con inversiones adecuadas realmente no necesitamos cultivar la infraestructura energética, sino que sólo tenemos que desarrollar hasta qué punto el combustible va de las fuentes que lo necesitan más que otros."
 LKT_focus_fueling_tomorrows_economy: "Fusionar la economía de mañana"
 LKT_focus_fueling_tomorrows_economy_desc: "Nuestras necesidades son vastas, pero nuestras tierras y recursos son aún más escasos. Debemos desarrollar un sector energético para garantizar nuestras demandas y las exigencias del futuro serán aseguradas por medios nacionales."
 LKT_focus_a_new_green_deal: "A New Green Deal"
 LKT_focus_a_new_green_deal_desc: "El New Green Deal o NGD es un plan integral de inversión energética para desarrollar y garantizar el método más eficiente y literalmente sólo verdadero de producción de energía verde se utiliza a su mejor capacidad que los avances actuales y esperanzadamente futuros se desbloquearán. Pequeñas plantas más eficientes, limitada inversión en esfuerzos de reciclaje de combustible gastado. Los nueve metros enteros y algunos."
 LKT_focus_finalizing_doe_capabilities: "Finialización de las capacidades DoE"
 LKT_focus_finalizing_doe_capabilities_desc: "Con nuestro sector energético ahora en consonancia con nuestras necesidades económicas, podemos trabajar para sinergiar estas dos cosas y impulsar nuestra nación hacia el futuro que crearemos."
 LKT_focus_increased_funding_for_donr: "Aumento de la financiación para DoNR"
 LKT_focus_increased_funding_for_donr_desc: "Al invertir más en adquirir los recursos naturales que están bajo nuestros propios pies, podemos asegurar una economía más autosuficiente o por lo menos una economía más equilibrada."
 LKT_focus_massive_investments: "Inversiones masivas"
 LKT_focus_massive_investments_desc: "Para asegurarnos de conseguir todo lo que invertiremos tanto como sea posible para adquirir tanto y tanta diferencia recursos minerales que podríamos obtener."
 LKT_focus_need_by_need_investment_strategy: "Necesidad por estrategia de inversión necesaria"
 LKT_focus_need_by_need_investment_strategy_desc: "Nuestros esfuerzos mineros deben complementar nuestros principales esfuerzos económicos. Como tal, vamos a invertir en el Departamento de Recursos Naturales sobre una base necesaria para mantener las demandas en control."
 LKT_focus_iron_ore_revival: "Ley de reactivación del mineral de hierro"
 LKT_focus_iron_ore_revival_desc: "Nuestros depósitos de mineral de hierro se destapan al mejor e incluso cortan debido a errores pasados. Sin embargo, ese ya no será el caso. A través de inversiones en Dakota del Sur, Kansas y Montana para nombrar algunos, ampliaremos las operaciones existentes así como reabriremos viejas operaciones como la de kansas que se cerró pre-maturamente debido a preocupaciones ambientales. La limpieza y tal puede ser un poco costoso, pero una producción significativa de mineral de hierro significa que tendremos un suministro doméstico saludable de uno de los materiales clave del mundo moderno. Acero."
 LKT_focus_bauxite_brawls_act: "Bauxite Brawls actúa"
 LKT_focus_bauxite_brawls_act_desc: "Garantizar que nuestra economía tenga acceso a metales más flexibles significa que también podemos profundizar en aplicaciones civiles y militares. Como tal reactivación, la expansión y la inversión en sitios mineros más intensivos de energía valdrá la pena a largo plazo de las cosas."
 LKT_focus_precious_mines_act: "Ley de minas preciosas"
 LKT_focus_precious_mines_act_desc: "Múltiples estados tienen depósitos Elementales de REE o Rare Earth. Como tal, invertiremos en abrir y ampliar las operaciones a escalas comerciales potenciales para garantizar la máxima diversidad de nuestro maquillaje económico. Después de todo, más material doméstico significa más interés extranjero."
 LKT_focus_rubber_stamp_act: "La Ley de Sellos de Caucho"
 LKT_focus_rubber_stamp_act_desc: "Tenemos mucha producción nacional de petróleo. Parte de esto se puede reasignar estratégicamente a productos químicos sintéticos y la producción de caucho para asegurar que tengamos el pico de diversidad de recursos entre nuestras tierras."
 LKT_focus_lakotan_military_development_board: "Junta de Desarrollo Militar Lakotan"
 LKT_focus_lakotan_military_development_board_desc: "El LMDB está diseñado para simplificar el desarrollo y mejorar nuestras capacidades militares. Considerando que realmente sólo tenemos dos ramas de servicio por las que preocuparse, debe ser un esfuerzo directo hacia adelante. Sin embargo, algún personal que estaba formalmente separado de la armada de la antigua república espera establecer una Armada Lakotan algún día. Pero por ahora su ejército y fuerza aérea todo el camino."
 LKT_focus_military_refinement: "Refinamiento militar"
 LKT_focus_military_refinement_desc: "A través del juicio y el error, mucha inversión tanto en material como en personal, así como justo tiempo en sí mismo. Finalmente hemos creado al menos una rama de servicio solidificada de nuestras fuerzas armadas para garantizar la defensa y seguridad nacionales de nuestros ciudadanos y sus hogares."
 LKT_focus_lakotan_army_pay_standards: "El ejército de Lakotan paga las normas"
 LKT_focus_lakotan_army_pay_standards_desc: "Garantizar un pago de calidad y la capacidad de nuestros soldados para cuidar no sólo a sí mismos sino que potencialmente a sus seres queridos en casa elevará pasivamente la moral. Como bonificación, es probable que esta mayor dedicación se derrame en las tasas de entrenamiento y la calidad de los soldados que podemos buscar para producir a partir de dicho entrenamiento."
 LKT_focus_establishing_arms_contractors: "Establecimiento de contratistas de armas"
 LKT_focus_establishing_arms_contractors_desc: "Crear una industria de armas dedicada a apoyar esencialmente el rayo principal de apoyo de nuestra defensa nacional es primordial. Como tal, conseguiremos financiación para asegurar el suministro constante de nuestras tropas con armamento de calidad."
 LKT_focus_sundance_war_college: "El Sundance War College"
 LKT_focus_sundance_war_college_desc: "Mi creación de un instituto militar dedicado a la escolarización podemos preparar tanto los futuros oficiales de la NCO como oficiales encargados para los campos de batalla del mañana. Entrenarlos en tácticas, liderazgo y deligación de responsabilidad. Lo más importante es que les enseñamos adaptabilidad ya que cualquier buen soldado siempre debe entender que si las cosas pueden ir mal, lo más probable será."
 LKT_focus_butte_testing_facilities: "Instalaciones para pruebas de mantequilla"
 LKT_focus_butte_testing_facilities_desc: "Mediante la creación de un complejo dedicado a las pruebas y instalaciones R&D, podemos asegurar la calidad cada vez mayor de nuestras tropas para que puedan estar listas para los posibles conflictos en el futuro."
 LKT_focus_research_mania: "Investigación Mania"
 LKT_focus_research_mania_desc: "R&D es donde está. Invertimos en gran medida en el desarrollo de nuevos armamentos, municiones y equipos de apoyo para asegurar que la calidad de nuestras tropas esté más allá de quienes deseen perjudicarnos de cualquier manera."
 LKT_focus_geneva_compliant_munitions: "Municiones de Ginebra «en consonancia»"
 LKT_focus_geneva_compliant_munitions_desc: "Aunque, por supuesto, debemos mirar bien a los ojos de la comunidad internacional, esto no significa que no podamos probar los límites de las cosas. ¿Verdad?"
 LKT_focus_experiemental_weapons_platoon: "Plato de armas experimentales"
 LKT_focus_experiemental_weapons_platoon_desc: "El EWP será una unidad dedicada que se separará de la más amplia «Cuerpo de Armas Experiementla». Este sub-branch de nuestro ejército designará pelotones de apoyo para ayudar a la prueba de campo y dar unidades en una mermelada o situación un impulso necesario como y cuando se solicite. En su mayoría, el EWP estará compuesto por un arma anti experiencial y puede adaptarse a las necesidades de las peticiones del ejército en un campo de batalla siempre cambiante."
 LKT_focus_the_corps: "Los «Corps»"
 LKT_focus_the_corps_desc: "El establecimiento de un Cuerpo de Armas Experiementarias nos permite dirigir los esfuerzos de financiación, capacitación y ensayo en la medida más plena y flexible posible. Este nuevo cuerpo R&D será el faro de luz que nos guiará y nos ayudará a defendernos contra todos los enemigos de nuestras tierras."
 LKT_focus_logistical_primacy: "Escuela de Primacía Logística del Pensamiento"
 LKT_focus_logistical_primacy_desc: "Al enfocar nuestros esfuerzos en la logística de luchar contra una guerra, podemos superar a nuestros enemigos por medios puramente attricionales si las cosas realmente se desvían en tal depravación."
 LKT_focus_bread_and_butter_doctrine: "El pan & Butter Doctrine"
 LKT_focus_bread_and_butter_doctrine_desc: "Al retomar la conciencia económica hacia un conflicto de supervivencia, las medidas preventivas de racionamiento y las tiendas de alimentos estratégicamente ubicadas no solo ayudarán a nuestros esfuerzos militares sino también a cualquier recuperación."
 LKT_focus_supply_heroes: "Héroes de suministro"
 LKT_focus_supply_heroes_desc: "Las balas no vuelan sin suministro. Independientemente de las medidas pedanéticas de lo que significa ser un héroe, todos podemos estar de acuerdo en que cualquiera tiene la capacidad de sobresalir en su campo y ser el héroe que la gente necesita. Como tal, estamos promoviendo el Cuerpo de Suministros y abriendo esfuerzos diferenciados basados en la oferta y la logística para asegurar la máxima cohesión entre las cadenas de suministro y las unidades que sirven."
 LKT_focus_logistics_corps_training_programs: "Programas de capacitación del Cuerpo Logístico"
 LKT_focus_logistics_corps_training_programs_desc: "Abrir nuestro ejército a todos los paseos de la vida no siempre significa que tengan que ser gruñidos en primera línea. Y un «POG» no siempre tiene que ser un drenaje en el estado de ánimo para un gruñido de primera línea. Como tal, nos dedicaremos a tener nuevo entrenamiento y una doctrina especializada para nuestro cuerpo logístico para asegurar la cohesión en primera línea, la eficiencia de las líneas de suministro y la eficacia militar general en el campo de batalla."
 LKT_focus_lakotan_air_force_training_improvements: "Mejoras en la capacitación de las fuerzas aéreas de Lakotan"
 LKT_focus_lakotan_air_force_training_improvements_desc: "Mediante la normalización adecuada de los criterios de calificación esperamos establecer una nueva crema de los cultivos en términos de eficacia piloto en situaciones de combate."
 LKT_focus_fighter_priority_structure: "Estructura prioritaria de combate"
 LKT_focus_fighter_priority_structure_desc: "El esfuerzo organizativo de las FPS es retomar la funcionalidad primaria de la rama del servicio de la fuerza aérea alrededor de la clase de caza de aeronaves. La formación y la composición de las unidades garantizarán una primacía de los combatientes sobre apoyo terrestre o apoyo estratégico general a los bombarderos. Lo poco que hacemos debe ser capaz de volar sin-molested por aviones enemigos dondequiera que nuestros combatientes son."
 LKT_focus_fighter_supremacy_doctrine: "Doctrina de supremacía de combate"
 LKT_focus_fighter_supremacy_doctrine_desc: "El desarrollo de nuestra doctrina aérea para girar más exclusivamente en torno a los luchadores es asegurar el control completo y total de los cielos arriba. Por lo tanto, independientemente de dónde podamos carecer de bombas o asistencia terrestre, podemos asegurar un campo de prueba gratuito para estos aspectos con la supremacía aérea sin control."
 LKT_focus_ground_support_priority_structure: "Estructura de prioridades de apoyo terrestre"
 LKT_focus_ground_support_priority_structure_desc: "El esfuerzo organizativo del SGP reorganizará la rama de servicio de la fuerza aérea para dar prioridad al desarrollo y el despliegue de aeronaves tipo apoyo terrestre. Esto asegurará que, si bien podemos carecer de esfuerzos totales de supremacía del aire, todavía debemos ser capaces de golpear y dirigir al enemigo desde el aire y garantizar la estabilidad en primera línea por lo menos."
 LKT_focus_ground_support_supremacy_doctrine: "Apoyo terrestre Doctrina de supremacía"
 LKT_focus_ground_support_supremacy_doctrine_desc: "El desarrollo de nuestra doctrina aérea para priorizar aviones tipo apoyo terrestre asegurará la estabilidad en primera línea, así como robar la capacidad del enemigo para luchar por un período prolongado. El daño organizacional sólo hace tanto pero si destruimos los suministros y el equipo del enemigo entonces no pueden luchar para empezar."
 LKT_focus_strategic_bomber_priority_structure: "Estructura prioritaria del bombardero estratégico"
 LKT_focus_strategic_bomber_priority_structure_desc: "El esfuerzo organizativo del SBPS permitirá a nuestra fuerza aérea aplastar la voluntad del enemigo de luchar. La industria y la infraestructura son una misión fundamental para que cualquier nación proteja en caso de conflicto prolongado. Como tal, desarrollaremos bombarderos estratégicos para demolir estas máquinas de guerra y romper las cintas de carretera y ferrocarril que dan a nuestros enemigos la capacidad de intentar dañarnos."
 LKT_focus_strategic_bomber_supremacy_doctrine: "Doctrina de supremacía del bombardero estratégico"
 LKT_focus_strategic_bomber_supremacy_doctrine_desc: "Al refinar nuestra doctrina aérea en torno a aviones de clase de bombarderos estratégicos, eliminaremos la capacidad del enemigo para luchar contra nosotros. Sin una economía o una industria de armas, el enemigo no puede armar a su pueblo ni emplearlos también. Al final no podemos conseguir una guerra rápida, pero nos aseguraremos de que nadie destruirá a nuestro pueblo y estas tierras para las cuales defendemos."
 LKT_focus_clear_skies_for_all: "Cielos claros para todos"
 LKT_focus_clear_skies_for_all_desc: "El refinamiento y las mejoras de nuestra fuerza aérea estarán en exhibición para que todos lo vean. Alentar los espectáculos de aire organizados y los espacios de formación para que el público vea nos permitirá asegurar a los ciudadanos que nuestra nación tendrá cielos brillantes durante días."
 LKT_focus_creating_a_real_navy: "Creating A Real Navy"
 LKT_focus_creating_a_real_navy_desc: "El día finalmente está aquí cuando podemos crear una verdadera marina y no algunos patrones para ir a rafting del río. Sin embargo, el viaje será tedioso ya que un río no es nada como el océano abierto."
 LKT_focus_early_ship_construction_efforts: "Actividades de construcción de buques tempranos"
 LKT_focus_early_ship_construction_efforts_desc: "Nuestra proeza naval puede nunca ser el «top of the line», pero sin duda podemos empezar con una línea de fondo."
 LKT_focus_formalizing_naval_training_programs: "Formalización de programas navales de formación"
 LKT_focus_formalizing_naval_training_programs_desc: "Al adoptar finalmente un programa de entrenamiento real con ayuda ambiental de nuestras nuevas aguas costeras, podemos asegurar que la calidad de nuestro personal naval sea respetable."
 LKT_focus_our_naval_priority: "Nuestra Prioridad Naval"
 LKT_focus_our_naval_priority_desc: "Al crear una nueva prioridad en nuestro desarrollo naval establecimos al menos un estándar de tipo que las generaciones futuras puedan construir."
 LKT_focus_naval_command_structure: "Estructura del Mando Naval"
 LKT_focus_naval_command_structure_desc: "La rama de servicio naval del LAF se consideraba una broma en el mejor de los casos y un castigo en el peor de los casos. Sin embargo, con la adquisición de nuevas propiedades frente al agua y el comienzo de los esfuerzos de construcción de buques de agua azul, debemos convertir esta broma en una rama de servicio seria y tangeble. Como tal, se creará la formalización de la estructura del mando naval LNCS o Lakotan para facilitar y establecer futuros avances a la excelencia naval."
 LKT_focus_gulf_dry_docking_facilities: "Instalaciones de acoplamiento seco"
 LKT_focus_gulf_dry_docking_facilities_desc: "Ampliar nuestros esfuerzos de construcción naval nos permitirá adaptar y crecer nuestra marina."
 LKT_focus_mid_atlantic_shipping_investments: "Inversiónes en el transporte medioatlántico"
 LKT_focus_mid_atlantic_shipping_investments_desc: "Los esfuerzos continuos para ampliar nuestra marina deben tomarse si queremos cubrir todo este territorio."
 LKT_focus_beyond_the_plains: "Más allá de las llanuras"
 LKT_focus_beyond_the_plains_desc: "Con nuestra patria ahora estabilizada y próspera debemos pensar más allá de nuestras fronteras. Si buscamos o no expandirnos es independientemente del punto, porque debemos pensar más allá simplemente por el hecho de que muchos otros miran más allá de sus propias fronteras. Debemos decidir cuál será nuestro futuro."
 LKT_focus_A_New_Destiny: "Un nuevo destino"
 LKT_focus_A_New_Destiny_desc: "El mandato se ha perdido, los del continente norteamericano buscan recuperarlo. Sabemos que esto es verdad a través de los rumores de las tierras y como tal pondremos nuestra reclamación y saldremos arriba. Porque nuestro destino es contemplar y no de los del oriente o del occidente."
 LKT_focus_eyeing_the_borderlands: "Ojo por las tierras fronterizas"
 LKT_focus_eyeing_the_borderlands_desc: "El comienzo de nuestro destino comienza con los primeros pasos fuera de nuestras propias fronteras. Como tal, debemos trabajar para asegurar que nuestras propias fronteras estén donde establezcamos nuestros primeros pasos."
 LKT_focus_the_pacific_shores: "Zapatos del Pacífico"
 LKT_focus_the_pacific_shores_desc: "Tendremos nuestra puesta de sol en la brisa del mar de las costas Pacífico. El oeste es una distancia más corta para cubrir que el este al menos."
 LKT_focus_great_lakes_great_takes: "Grandes lagos, grandes tomas"
 LKT_focus_great_lakes_great_takes_desc: "Ampliar hacia el este significa que vamos a estar tratando con vastas y diversas tierras. Debemos utilizar nuestros esfuerzos para comprender y poder navegar por la vastedad que es la Región de los Grandes Lagos."
 LKT_focus_southern_summaries: "Summaries meridionales"
 LKT_focus_southern_summaries_desc: "Desde las marismas hasta las alturas de montaña, la región sur de los Estados Unidos probablemente será nuestra más difícil de atravesar. Como tal práctica, estudiar y entrenarnos para hacer frente a esos desafíos será necesario mientras tratamos de asegurar estas tierras futuras."
 LKT_focus_northeastern_needs: "Necesidades del noreste"
 LKT_focus_northeastern_needs_desc: "Montañas y bosques hasta donde el ojo puede ver. Necesitaremos tiempo y energía para abordar estas tierras."
 LKT_focus_manifesting_strength_for_our_destiny: "Manifesting Strength Para Nuestro Destino"
 LKT_focus_manifesting_strength_for_our_destiny_desc: "Debemos prepararnos y seguir construyendo nuestras fuerzas. Para el destino que nos propusimos crear será nuestro a su debido tiempo."
 LKT_focus_operation_cascadian_calamity: "Operación Calamidad Cascadiana"
 LKT_focus_operation_cascadian_calamity_desc: "Empieza el comienzo de nuestra gran cruzada para la seguridad continental. Comenzaremos con el más cercano a nuestro poder que es Cascadia. Las montañas serán duras pero servirán como grandes campos de entrenamiento para nuestros soldados."
 LKT_focus_operation_san_jose: "Operación San José"
 LKT_focus_operation_san_jose_desc: "Dormir por la costa oeste nos permite crear nuestra propia muralla, que es el océano Pacífico. Como tal, el próximo paso hacia la seguridad continental está asegurado una vez que tomamos California."
 LKT_focus_operation_sierra_mist: "Operación Sierra Mist"
 LKT_focus_operation_sierra_mist_desc: "Asegurar la región rica en energía del suroeste, así como el resto de las montañas rocosas nos permite establecer una gran línea defensiva si algo viola nuestras costas occidentales."
 LKT_focus_operation_sam_houston: "Operación Sam Houston"
 LKT_focus_operation_sam_houston_desc: "Garantizar la identidad más grande en el continente americano significa que aseguramos la voluntad de los diversos pueblos. Los tejanos son una gente de mente orgullosa e independiente y para asegurarles allana el camino para cualquier incursión oriental que podamos emprender."
 LKT_focus_reorganizing_civil_services: "Reorganización de los servicios civiles"
 LKT_focus_reorganizing_civil_services_desc: "Crear nuevos servicios civiles estandarizados nos permite gestionar mejor nuestros territorios y mejorar los esfuerzos de integración para permitir que la gente pase por las guerras de la memoria reciente. No será perfecto, pero ciertamente es un paso en la dirección correcta."
 LKT_focus_operation_rustic: "Operación Rústica"
 LKT_focus_operation_rustic_desc: "Nuestra marcha hacia el este comienza, tomando la ruta norte da como más llanuras, colinas rodantes y bosques. Aunque no un paseo de pasteles para estar seguro, sería buena práctica antes de nuestro avance sur."
 LKT_focus_operation_charleston: "Operación Charleston"
 LKT_focus_operation_charleston_desc: "Desde el Mississippi hasta el Atlántico, marchamos para asegurar la ruta sur y conectarnos de mar a mar brillante."
 LKT_focus_operation_north_east_corridor: "Operación Corredor del Norte"
 LKT_focus_operation_north_east_corridor_desc: "El tramo final para reclamar el mandato. Con esto tendremos el control completo de la república continental y aseguraremos nuestro destino... en todo caso tenemos que reconstruir, pero me divago."
 LKT_focus_west_coast_cleanup: "Limpieza de la Costa Oeste"
 LKT_focus_west_coast_cleanup_desc: "Con la nación bajo nuestro control ahora podemos centrarnos en limpiar y reconstruir las tierras desgarradas por la guerra. El mejor enfoque sería empezar al oeste y recorrer hacia el este."
 LKT_focus_south_central_rebuilding: "Reconstrucción central del sur"
 LKT_focus_south_central_rebuilding_desc: "Con el oeste asegurado ahora podemos centrarnos en nuestra línea de fondo, en este caso los estados que terminan la mitad occidental de la nueva república. Consolidar estos territorios deja todo lo que queda al este del Mississippi, debe hacerse en breve."
 LKT_focus_mississippi_miracle: "Mississippi Miracle"
 LKT_focus_mississippi_miracle_desc: "La marcha al este comienza y con el cruce del Mississippi podemos reconstruir e integrar los estados del sur en la nueva nación."
 LKT_focus_reviving_the_rustbelt: "Reviviendo el Rustbelt"
 LKT_focus_reviving_the_rustbelt_desc: "Reconstruir y devolver la estabilidad económica a los viejos estados rustbelt ayudará a integrar las tierras así como a las personas en estas tierras."
 LKT_focus_northeast_renewal: "Renovación del noreste"
 LKT_focus_northeast_renewal_desc: "El tramo final, integrando estos últimos estados asegurará la unidad del Pacífico al atlántico."
 LKT_focus_the_second_republic: "La Segunda República"
 LKT_focus_the_second_republic_desc: "El viaje fue largo y fue costoso, pero la paz ha sido traída de vuelta a las tierras y la unidad una vez más se presenta en el continente norteamericano. Sólo un paso final para asegurar el futuro que hemos establecido para crear para nosotros mismos."
 LKT_focus_Containment_Plan_West: "Plan de contención West"
 LKT_focus_Containment_Plan_West_desc: "La expansión es primordial para sobrevivir en este mundo inestable y hostil. El nuevo mundo está destrozado y debemos poner en juego nuestra reclamación a una parte de él. El Plan Cambrian o el Plan de Contención Westward será para nosotros para solidificar nuestro control de todo lo que está al oeste del Mississippi. Esto debería permitirnos fortalecer y crear un nuevo y más estable sentido de seguridad para nuestro pueblo."
 LKT_focus_war_plan_purple: "Plan de guerra púrpura"
 LKT_focus_war_plan_purple_desc: "Uno de nuestros primeros pasos para asegurar la mitad occidental del continente norteamericano sería asegurar nuestro flanco. Como tal Cascadia está en el camino para nuestras vacaciones pacíficas."
 LKT_focus_war_plan_skorpion: "Plan de Guerra Skorpion"
 LKT_focus_war_plan_skorpion_desc: "Asegurar la región rica en energía de los estados del suroeste ayudará a aumentar nuestra estabilidad económica y asegurar un borde significativo de nuestros rivales occidentales."
 LKT_focus_war_plan_yellow: "Plan de Guerra Amarillo"
 LKT_focus_war_plan_yellow_desc: "Asegurar la costa del Pacífico significa que hemos asegurado cerca de la mitad de las tierras occidentales. Seguiremos reclamando nuestro futuro y solidificaremos los fundamentos para nuestra nueva manera de avanzar."
 LKT_focus_war_plan_blue: "Plan de Guerra Azul"
 LKT_focus_war_plan_blue_desc: "Texas asegura la segunda pieza final del rompecabezas occidental que estamos tratando de montar. Oklahoma sería la pieza final, sin embargo no estamos seguros exactamente qué cruzar el Mississippi implicaría políticamente y como tal podemos presentar ese debate por otro tiempo."
 LKT_focus_consolidating_the_territories: "Consolidación de los territorios"
 LKT_focus_consolidating_the_territories_desc: "Con el oeste ahora bajo nuestro control, debemos trabajar para integrar y moldear las tierras y la gente en una nueva nación."
 LKT_focus_pacific_pearls: "Pacific Pearls"
 LKT_focus_pacific_pearls_desc: "Trabajar para integrar y reconstruir los estados Pacíficos ayudará a abrir un montón del mundo de vuelta al comercio y el turismo para nuestra nación. La revitalización de puertos y hotspots turísticos es un avance crítico."
 LKT_focus_southern_sunrise: "Sur de Sunrise"
 LKT_focus_southern_sunrise_desc: "Reconstruir la energía rica en el suroeste, así como el estado económicamente dotado de Texas, dará a nuestra nación un impulso muy necesario para la estabilidad y la prosperidad."
 LKT_focus_the_western_identity: "La identidad occidental"
 LKT_focus_the_western_identity_desc: "Con estas tierras que hemos unido declaramos una nueva nación, un nuevo pueblo y una nueva cultura avanzando."
 LKT_focus_The_Great_Barrier_Plan: "El Plan Gran Barrera"
 LKT_focus_The_Great_Barrier_Plan_desc: "Fundamentalmente nadie debería tener control directo sobre tanto territorio. Por lo tanto, debemos cambiar eso y asegurar que la estabilidad se forja en el continente americano del Norte. Si podemos consolidar la tierra media y el títere y o comprar la lealtad del este y el oeste entonces podemos crear una especie de Unión Confederal Norteamericana... probablemente necesita un mejor nombre."
 LKT_focus_vegas_odds: "Las probabilidades de las Vegas"
 LKT_focus_vegas_odds_desc: "Las tierras de la unión que no necesitamos por completo y como tal lo utilizaremos a nuestra ventaja al adquirirlas para el futuro que buscamos."
 LKT_focus_texas_tussle: "Texas Tussle"
 LKT_focus_texas_tussle_desc: "La formación de la Gran Barrera será asegurar los estados centrales del centro aproximadamente geográfico del continente norteamericano. Este primer paso con Texas ayudará a establecer el escenario para más incursiones del sur."
 LKT_focus_western_consolidation: "Consolidación occidental"
 LKT_focus_western_consolidation_desc: "Consolidar el territorio títere que nos ordena permite una división más igual de territorio. Así que dar más incentivo a nuestro nuevo títere para cuando buscamos la costa pacífica."
 LKT_focus_the_great_war: "La Gran Guerra"
 LKT_focus_the_great_war_desc: "La Gran Guerra Continental comenzará a medida que aseguremos los territorios del golfo de la República Sur. Aunque ciertamente no necesitamos los estados del sur, su incapacidad para renunciar al estado de Oklahoma significa que no tenemos otra opción. Como bonificación aparte del hecho de que también podemos asegurar que ningún poder oriental se levantará lo suficiente para desafiar tanto a nosotros como al sur."
 LKT_focus_eastern_consolidation: "Consolidación oriental"
 LKT_focus_eastern_consolidation_desc: "Con la Gran Guerra Continental terminamos con nosotros ahora podemos integrar lo que los estados centrales que quisimos, así como asegurar a los estados del sur en el entendimiento de que no serán anexados directamente."
 LKT_focus_cartel_cleanup: "Cártel de limpieza"
 LKT_focus_cartel_cleanup_desc: "La extensión sur del Plan Gran Barrera es la de adquirir México. Que mejor justificación que limpiar la casa de las organizaciones de cártel rampantes que paralizan a la nación."
 LKT_focus_reorganizing_mexican_territories: "Reorganización de los territorios mexicanos"
 LKT_focus_reorganizing_mexican_territories_desc: "Mediante la división de los territorios de México podemos dar favor a nuestra marioneta occidental al mismo tiempo que solidificamos nuestro poder sobre el estado actual de los asuntos."
 LKT_focus_securing_the_western_coastline: "Asegurar la costa occidental"
 LKT_focus_securing_the_western_coastline_desc: "Con los estados cercanos al oeste bajo nuestro control y el frente sur seguro, ahora podemos mirar hacia el lejano oeste con la costa pacífica. La seguridad de estas tierras nos preparará para el desafío final que tenemos por delante."
 LKT_focus_dividing_up_the_west: "Dividing Up The West"
 LKT_focus_dividing_up_the_west_desc: "Con las tierras occidentales bajo nuestro control, ahora depende de nosotros cómo dividir razonablemente estas tierras para promover la unidad y la capacidad de cooperar y avanzar juntos."
 LKT_focus_improving_the_homefront: "Mejorar el frente principal"
 LKT_focus_improving_the_homefront_desc: "Consolidando y trabajando en hacer que nuestras ganancias actuales sean más cohesivas, establecemos el escenario para asegurar nuestro objetivo final en el plan. La conquista del norte no estará en marcha en ningún momento, pero cómo lidiar con ella es otra cuestión."
 LKT_focus_northern_investment_opportunity: "La oportunidad de inversión del norte"
 LKT_focus_northern_investment_opportunity_desc: "Debemos cooperar con Canadá para asegurar que nuestras naciones puedan trabajar juntas, ya que una inversión de infraestructura a través de ferrocarriles nos conectará mejor."
 LKT_focus_operation_polar_bear: "Operación Oso Polar"
 LKT_focus_operation_polar_bear_desc: "Vamos al norte, para asegurar el resto de nuestra barrera y así asegurar el futuro que deseamos crear para nosotros mismos."
 LKT_focus_the_northern_concessions: "Las Concesiones del Norte"
 LKT_focus_the_northern_concessions_desc: "Asegurando el norte debemos ahora redividir las tierras y asegurar la estabilidad en el continente americano del Norte para futuras generaciones."
 LKT_focus_the_continental_confederation: "La Confederación Continental"
 LKT_focus_the_continental_confederation_desc: "Nuestras Naciones están orgullosas y unidas, porque el nuevo mundo ha visto una nueva unidad bajo la antigua bandera de Lakota y como tal forjaremos junto con un nuevo nombre para una nueva nación. Una nación que busca unir a los pueblos, no a las tierras, sino a los pueblos bajo una nueva identidad y cuando estén listos formaremos una América del Norte unida."
 LKT_country_flag_elections: "Las elecciones comienzan"
 LKT_Canadian_War_Goal_Unlock: "Then It Is War"
 LKT_Prairie_Federation_desc: "[LKT.GetFlag]§YRepública de Lakota§! Cambios Nombre a [LKT.GetFlag]§YLa Federación de la Pradera§!"
 LKT_Free_Fields_Society_desc: "[LKT.GetFlag]§YRepública de Lakota§! Cambios Nombre a [LKT.GetFlag]§Y Sociedad de Campo Libre§!"
 LKT_Grand_Duchy_Of_Yellowstone_desc: "[LKT.GetFlag]§YRepública de Lakota§! Cambiar nombre al [LKT.GetFlag]§Y Gran Ducado de Yellowstone§!"
 LKT_Second_American_Republic_desc: "[LKT.GetFlag]§YRepública de Lakota§! cambia el nombre a la [LKT.GetFlag]§Y2a República Americana§!"
 LKT_Cambrian_Nation_desc: "[LKT.GetFlag]§YRepública de Lakota§! Cambios Nombre a la [LKT.GetFlag]§YCambria§!"
 LKT_Continental_Confederation_desc: "[LKT.GetFlag]§YRepública de Lakota§! Cambiar nombre a la [LKT.GetFlag]§Y Confederación Continental§!"
 LKT_divided_we_fell: "Dividido We Fell"
 LKT_divided_we_fell_desc: "Las cenizas se han asentado y aunque estamos maltratados, no somos derrotados por este repentino y sin precedentes acontecimiento que nos sucede. Tenemos que marchar hacia adelante y empezar a ponerse de pie en nuestros propios dos pies."
 LKT_federal_budgets: "Presupuestos nacionales"
 LKT_federal_budgets_desc: "Si vamos a conseguir algo significativo entonces debemos evaluar y trabajar nuestros presupuestos para satisfacer nuestras necesidades. Arregla lo que falla y expande lo que funciona, ahora si sólo será tan fácil."
 LKT_domestic_policies: "Administración de asuntos internos de Lakotan"
 LKT_domestic_policies_desc: "El LDAA es la rama dedicada del gobierno responsable de evaluar y trabajar para moldear las políticas y leyes aprobadas por el gobierno nacional en la propia nación. En resumen, quiero saber qué pasa con la gente y luego ver el LDAA."
 LKT_industrial_policies: "Departamento de Comercio & Actividades económicas"
 LKT_industrial_policies_desc: "La DCEA es responsable de la administración y el desarrollo de la economía nacional. La administración lleva a cabo reglamentos, subsidios comerciales y demás actividades para garantizar una economía equilibrada y estable."
 LKT_resource_management_policies: "Department of Natural Resources"
 LKT_resource_management_policies_desc: "El DNR es responsable del empleo y la gestión de nuestros recursos internos, ya sean humanos o materiales en su naturaleza."
 LKT_tax_policies: "Departamento de ingresos"
 LKT_tax_policies_desc: "El DoR es responsable de la recaudación y ejecución de los ingresos tributarios. Los cambios en el código tributario o las condiciones comerciales significan que el departamento debe adaptar y ajustar a los ciudadanos y partes comerciales para pagar su cuota debida al participar en cualquier tipo de comercio o actividad económica."
 LKT_army_service_branch: "El Ejército Republicano Lakotan"
 LKT_army_service_branch_desc: "El LRA es la rama principal del servicio armado que defiende nuestra nación. Mientras que los cielos arriba están llenos de nuestros chicos voladores, no significan nada si aquellos en el suelo no pueden hacer nada acerca de las fuerzas enemigas presentes."
 LKT_air_force_service_branch: "Fuerza aérea de Lakotan"
 LKT_air_force_service_branch_desc: "El LAF es responsable de asegurar los cielos arriba para garantizar que la inmolestación de nuestras fuerzas terrestres y navales se mantengan a partir de incursiones aéreas enemigas."
 LKT_navy_service_branch: "El Servicio Naval de Lakotan"
 LKT_navy_service_branch_desc: "El LNS es una bolsa mixta. Siendo relegados a sólo notables vías fluviales que se deslizan por nuestra nación, el servicio naval es visto más como una broma o una manera más barata de reducir el desempleo."
 LKT_ideas_foreign_isolation_office: "Oficina de aislamiento exterior"
 LKT_ideas_foreign_isolation_office_desc: "A raíz de un giro tan violento y aparentemente imposible de los acontecimientos, nuestra nación es ahora... una nación. Con la implosión de la antigua república ahora formamos una nueva y más segura república de apuestas. Utilizar el nombre de lakota para apelar a las minorías nativas permite la estabilidad y formar una nueva identidad en conjunto. Sin embargo con esta nueva esperanza encontrada, muchos son cuidadosos de nuestros vecinos, así como sólo la intromisión extranjera en su conjunto. Es este sentimiento que persiste alrededor de nuestra nación y por qué algunos han llamado con júbilo al Ministerio de Relaciones Exteriores como la «Oficina de Isolación Extranjera», debido a que el gobierno no está haciendo verdaderos esfuerzos en la diplomacia."
 LKT_ideas_agrarian_fuel_economy: "Economía del combustible agrario"
 LKT_ideas_agrarian_fuel_economy_desc: "Con la agricultura que proporciona la participación del león en la producción económica, debemos desarrollar y adaptar nuestro sector energético a esto de inmediato. Las inversiones de investigación en la producción de biocombustibles y las formas de reducir la necesidad de grandes aparatos de infraestructura seguramente ayudarán a simplificar y hacer lo mejor de nuestras necesidades energéticas."
 LKT_ideas_a_new_green_deal: "A Green New Deal"
 LKT_ideas_a_new_green_deal_desc: "Un paquete integral de inversión, el NGD invertirá en la producción de energía nuclear y lo hará tan eficiente y práctico como los avances futuros modernos y potenciales nos permitirán tener. Plantas más pequeñas, centros de reciclaje de varillas gastadas y más como la ciencia nos permite."
 LKT_ideas_well_rounded_energy_sector: "Bueno Sector energético redondeado"
 LKT_ideas_well_rounded_energy_sector_desc: "Con nuestro Departamento de Energía en consonancia con nuestras necesidades económicas nacionales ahora podemos asegurar un futuro estable y próspero."
 LKT_ideas_improved_rail_network: "Mejora de la red de ferrocarriles"
 LKT_ideas_improved_rail_network_desc: "Al invertir en nuestros ferrocarriles hemos podido conectar mejor a la nación, así como mejorar las líneas de suministro tanto militares como civiles sabios."
 LKT_ideas_experimental_weapons_corp: "Cuerpo de Armas Experimentales"
 LKT_ideas_experimental_weapons_corp_desc: "Dedicado al logro de las unidades de respuesta más flexibles, el EWC se dedica a los esfuerzos del R&D y a las pruebas de campo de combate para asegurar que cuando una unidad militar necesita ayuda, obtenga la ayuda en las necesidades."
 LKT_ideas_lctp: "Programa de capacitación del Cuerpo de Logística"
 LKT_ideas_lctp_desc: "El Programa LCT está diseñado para abrir oportunidades de contratación a aquellos que pueden no ser material de primera línea. Para garantizar la estabilidad y eficacia de la primera línea, nuestras cadenas de suministro deben estar en su mejor momento y, como tal, aseguraremos que sean como tales."
 LKT_ideas_fighter_supremacy: "Supremacía de los combatientes"
 LKT_ideas_fighter_supremacy_desc: "Al priorizar el desarrollo y despliegue de luchadores en nuestra fuerza aérea, establecimos el escenario para crear cielos claros e inmolados de los invasores enemigos."
 LKT_ideas_ground_support_supremacy: "La supremacía de apoyo terrestre"
 LKT_ideas_ground_support_supremacy_desc: "Si priorizamos los aviones de apoyo de Gorund, podemos asegurarnos de que incluso nuestras caídas cortas en la supremacía del aire no impidan nuestra capacidad para golpear y dirigir las fuerzas terrestres enemigas. Permitiendo que nuestras primeras líneas se estabilicen e impidan que el enemigo destruya nuestras tierras."
 LKT_ideas_strategic_bomber_supremacy: "Supremacía de los Bomberos Estratégicos"
 LKT_ideas_strategic_bomber_supremacy_desc: "Al priorizar el desarrollo y despliegue de bombarderos estratégicos, aplastaremos la voluntad y capacidad del enemigo para luchar. La industria y la infraestructura se desmoronarán ante nuestros poderosos bombarderos."
 LKT_ideas_strategically_cheap: "Doctrina estratégicamente barata"
 LKT_ideas_strategically_cheap_desc: "Los objetivos más pequeños también son más difíciles de alcanzar. Podemos utilizar nuestro rafting de ríos y experiencias costeras limitadas para crear nuevas tácticas de éxito y ejecución para que nuestros buques navales sean diseñados alrededor. Por supuesto que habrá algunos retrocesos pero no es como si lo supieramos mejor, así que tenemos que aprender de una manera u otra."
 LKT_ideas_naval_command_structure: "Estructura del Mando Naval"
 LKT_ideas_naval_command_structure_desc: "Al establecer una estructura de mando naval genuina y organizada, consolidaremos aún más nuestros esfuerzos para crear una rama de servicio naval real."
 LKT_anarchist_asylum_experiement: "Experimento de Asilo anarquista"
 LKT_anarchist_asylum_experiement_desc: "Nuestras tierras son vastas y subdesarrolladas, debemos prometer llenar estas tierras llevando gentes de lejos y ancho que desean buscar un mejor mañana."
 LKT_ideas_standardized_civil_services: "Servicios civiles normalizados"
 LKT_ideas_standardized_civil_services_desc: "Crear una nueva forma estándar de administración civil y servicios públicos generales nos permite integrar pasivamente las nuevas tierras que hemos adquirido. Como bonificación también funciona como divulgación pública y da más de un corazón y mentes acercamiento a las cosas entonces simplemente golpeando a la gente en sumisión."
 LKT_ideas_the_second_american_republic: "La Segunda República Americana"
 LKT_ideas_the_second_american_republic_desc: "Con las tierras ahora reunificadas y el mandato reclamado, establecemos desde las ruinas de la 2.ª República Americana."
 LKT_ideas_cultivating_a_new_identity: "Cultivating A New Identity"
 LKT_ideas_cultivating_a_new_identity_desc: "Las tierras al oeste del Mississippi están bajo nuestro control, ahora debemos trabajar para solidificar los corazones y las mentes de la gente y forjar juntos un nuevo camino hacia adelante."
 LKT_ideas_securing_the_new_order: "Asegurar el Nuevo Orden"
 LKT_ideas_securing_the_new_order_desc: "Nuestro Plan Gran Barrera ha continuado en el camino de la terminación y es con este entendimiento que nos centramos más en los asuntos internos para asegurar la estabilidad de dicho orden. El continente norteamericano verá la paz y la prosperidad a través de una unión de naciones trabajando juntas para lograr un objetivo común."
 LKT_collapse_event.1.t: "No mucho, pero basta."
 LKT_collapse_event.1.d: "A medida que la tormenta nos pasa y las cosas comienzan a calmarnos, ahora debemos buscar reconstruir nuestros estados y reorganizarnos en una nueva nación. Sin embargo, con no haber mucho desarrollo para empezar, significa que tampoco tenemos mucho que reconstruir. Como una de nuestras principales preguntas para plantear al pueblo será qué tipo de economía queremos para nuestra nación. Sin embargo, no es mucho, pero su trabajo honesto de todos modos."
 LKT_collapse_event.1.o1: "Bueno, vamos a trabajar supongo"
 LKT_nation_name_event.1.t: "Una nueva nación"
 LKT_nation_name_event.1.d: "Con los nativos siendo tan pequeños no tenemos ningún cuidado en el mundo para mantener el supuesto «seguro geográfico y la historia respetando» nombre de Lakota. En lugar de eso, nos convertiremos en Grandes Plainsmen de la nueva Federación de la Pradera."
 LKT_nation_name_event.1.o1: "¡Por estas tierras son nuestras tierras!"
 LKT_nation_name_event.2.t: "¿Una nación libre?"
 LKT_nation_name_event.2.d: "Con la sociedad elegida, muchos se preguntan si esta es realmente la nueva hoja a la que debemos recurrir para prevalecer en nuestro futuro próximo. Como tal ha surgido un gran debate al que encontraremos como nación para ser nuestra guía. Por un lado tenemos a aquellos que desean prevalecer bajo el pretexto de la Sociedad de Campos Libres. Esencialmente un entorno adyacente anarquista para el cual permanecer por nuestra cuenta. El otro mantiene el status quo y busca mejores opciones si es posible. ¿Pero qué quiere la gente?"
 LKT_nation_name_event.2.o1: "¡La Sociedad de Campos Libres!"
 LKT_nation_name_event.2.o2: "Maybe It's Too Early?"
 LKT_nation_name_event.3.t: "¿Una nación real?"
 LKT_nation_name_event.3.d: "En un giro impactante la Casa de Yellowstone ha sido elegida. El partido promete ampliar los medios democráticos para el proceso de votación, así como un sufrimiento universal básico para garantizar la mayor participación de los ciudadanos de la nación. La única diferencia es que los títulos feudales serán asignados a las oficinas elegidas y, por lo tanto, cambiarán de manera cosmética los significados y el ethos detrás del propio gobierno. Algunos se preguntan si deberíamos comenzar una transición real de la nación para adaptarse a esto o permanecer en el curso."
 LKT_nation_name_event.3.o1: "¡El Gran Ducado!"
 LKT_nation_name_event.3.o2: "Tal vez esto es un poco demasiado lúgubre para ser práctico?"
 LKT_nation_name_event.4.t: "Establecimiento de la nueva República"
 LKT_nation_name_event.4.d: "Con la nación al borde de ser reconstruidos debemos solidificar nuestro mandato con el establecimiento de la 2.ª República Americana. De las cenizas de los viejos se levanta un nuevo camino hacia adelante."
 LKT_nation_name_event.4.o1: "Ave Nova Republica!"
 LKT_nation_name_event.5.t: "La identidad occidental"
 LKT_nation_name_event.5.d: "Las tierras occidentales están bajo una bandera y es con esto que declaramos una nueva nación. Cambria. En referencia al hito atemporal que define una parte significativa de nuestras tierras la cordillera Rocky Mountain. Con los fósiles de la era cambriana que se encuentran a lo largo de ellos utilizamos esto como un elemento básico para demostrar que somos ciudadanos y el pueblo de Cambria. Defenderemos y nutriremos las tierras y nuestros pueblos hasta el final del tiempo."
 LKT_nation_name_event.5.o1: "Gloria a Cambria!!!"
 LKT_event.10.t: "La «Inversión Mutua»"
 LKT_event.10.d: "Canadá se desarrolla sólo donde tiene que ser, podríamos «ayudarlos» invirtiendo en una conexión mutua ferroviaria a mejores valores comerciales y de transporte para nuestras naciones. Si aceptan, entonces no hay problema, si niegan... bueno tenemos un problema entonces."
 LKT_event.10.o1: "Esperemos que acepten"
 LKT_event.11.t: "Una oferta de inversión"
 LKT_event.11.d: "La República de Lakota ha venido a nosotros con una oferta interesante. Quieren construir un ferrocarril desde las Dakotas hasta la línea principal en Regina, Saskatchewan así como Winnepeg, Manitoba. Esto ayudaría con los acuerdos comerciales, el turismo y la cooperación general justa entre nuestras dos naciones. No vemos realmente un problema con él, pero algunos en el parlamento ven esto como un falso pretexto con las recientes actividades que la república ha sufrido recientemente. Entonces, ¿cuál es nuestra respuesta?"
 LKT_event.11.o1: "Aprobar el trato"
 LKT_event.11.o2: "Rechazar su oferta amablemente"
 LKT_event.111.t: "El trato se derrumbe"
 LKT_event.111.d: "Los canadienses han rechazado nuestra oferta, ahora tendremos que volver a plantear la situación ya que no hay otra vía para seguir adelante en este momento."
 LKT_event.111.o1: "¿Los tambores que oigo?"
 LKT_event.12.t: "Comienzo de la construcción"
 LKT_event.12.d: "El acuerdo está aprobado y hemos comenzado la construcción, esperamos que este sea un proyecto liso y será completado a finales de mes."
 LKT_event.12.o1: "Todo de acuerdo con el plan"
 LKT_event.13.t: "Problemas en el Gran Norte"
 LKT_event.13.d: "Las tripulaciones del informe del proyecto de que han estado ocurriendo extraños inccidentes. A pesar de que el proyecto está casi terminado, han habido informes de miembros desaparecidos de la tripulación y una animosidad de construcción de nuestra gente contra los Lakotans. No estamos seguros de lo que está pasando pero sospechamos que jugamos mal al mínimo."
 LKT_event.13.o1: "No me gusta este sentimiento..."
 LKT_event.14.t: "¡Canadienses sucios de sangre!"
 LKT_event.14.d: "Los periódicos y los medios de televisión gritan, los canadienses más gruesos de la sangre matan a los Lakotans que trabajan, ya que la nación está en alboroto por los rumores que salen del reciente proyecto ferroviario entre nosotros y el gobierno canadiense. Con cosas que funcionan mejor de lo esperado utilizaremos esto para instigar la guerra que queremos en lugar de la guerra que podríamos haber tenido."
 LKT_event.14.o1: "¡Envíenles Nuestras Demandas!"
 LKT_event.15.t: "Una situación preocupante"
 LKT_event.15.d: "Las demandas de Lakotan han llegado repentinamente al gobierno, exigen una indemnización por la pérdida de vidas de Lakotan en forma de inversiones industriales y un precio de pago del proyecto. La suma total llega a unos 35 mil millones y muchos canadienses están indignados por las acusaciones formuladas contra sus compatriotas. Como tal tenemos una decisión muy difícil de tomar."
 LKT_event.15.o1: "Guardar la cara y sólo pagarlos"
 LKT_event.15.o2: "Al diablo que les mostraremos"
 LKT_event.16.t: "Un resultado inesperado"
 LKT_event.16.d: "Bueno, de alguna manera fallamos... ¿sucesivamente? Pero este no es el resultado real que queríamos y, como tal, tendremos que prepararnos para el plan B."
 LKT_event.16.o1: "Organizar las tropas"
 LKT_politics.1.t: "Inicio de la campaña"
 LKT_politics.1.d: "En todo el país, se están formando partidos políticos y la gente está empezando a reunirse detrás de aquellos que creen ser la próxima entidad política gobernante adecuada para la nación. Como algunos pequeños squabbles también comienzan entre fiestas más duras, muchos están emocionados de ver justo donde la nación va a ir desde aquí."
 LKT_politics.1.o1: "Todo es justo en amor y guerra"
 LKT_politics.2.t: "El «Consejo de las Partes Autoridades»"
 LKT_politics.2.d: "En toda la confusión y el clamor por los votos, una colección de partidos con estilos de liderazgo algo similares ha surgido para crear un bloque para la votación. Este supuesto Consejo de Autoridad es lo que muchos creen ser una colección de partidos que funcionan como Oligarchies. Aunque cada parte rechaza un punto de referencia tan degradante, algunos miembros no pueden negar ciertos aspectos del manejo que han ocurrido recientemente. Independientemente de que dependa del pueblo votar y averiguar quién quiere liderar la nación."
 LKT_politics.2.o1: "DDP Wins!"
 LKT_politics.2.o2: "KCK Wins!"
 LKT_politics.2.o3: "LTP Wins!"
 LKT_politics.2.o4: "AFL Wins?"
 LKT_politics.2.o5: "Esto no puede ser todo el mundo, quién es el siguiente"
 LKT_politics.3.t: "Las Partes por Tradición"
 LKT_politics.3.d: "A medida que las cosas continúan calentando un nuevo bloque de poder ha comenzado a formarse como una colección de derecha y centro derecha inclinando los partidos intentar formar un bloque de votación. Enfrentándose al interés común de tener nuevas y viejas tradiciones conocidas por las tierras y sus pueblos. Las partes por tradición creen que el cambio puede suceder, pero no debe tirar el pasado por el bien de dicho cambio. Sin embargo, corresponde al pueblo votar, votar y votar para asegurar una victoria para el partido que desean dirigir a la nación."
 LKT_politics.3.o1: "ORP Wins!"
 LKT_politics.3.o2: "TTP Wins!"
