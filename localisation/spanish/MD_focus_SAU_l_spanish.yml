 SAU_pipeline_transit_TUR_t1_desc: "El aceite saudí cruza Turquía, y las tarifas de tránsito hinchan el tesoro. El oleoducto eleva la producción de acero y cromo de la nación. §GIngresos adicionales: $1.00B§!"
