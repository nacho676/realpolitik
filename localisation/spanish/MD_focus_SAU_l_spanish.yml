 SAU_events.322.t: "Etapa III: Alcanzar una fuerza totalmente moderna"
 SAU_events.33.a: "Conviértete en el puente hacia Europa."
 SAU_events.33.b: "No provocaremos a Rusia."
 SAU_events.33.d: "Arabia Saudita nos pide llevar su oleoducto hacia Europa. Nos convertiríamos en el portero del petróleo del Golfo hacia Occidente, coleccionando nuestro peaje en cada barril, y Moscú no nos lo agradecería."
 SAU_events.33.t: "El camino hacia Europa"
 SAU_events.330.a: "Comprar American: el M1A2 Abrams"
 SAU_events.330.b: "Diversificar nuestros proveedores de armas"
 SAU_events.330.c: "Construir una industria nacional de armamentos"
 SAU_events.330.d: "Ampliar el Guardia Nacional"
 SAU_events.330.desc: "La Guerra del Golfo puso de manifiesto lo imprudente que era nuestro ejército para defender el Reino por sí solo. Las Reales Fuerzas de Tierras sauditas deben ser reconstruidas - pero con cuyas armas, y en qué líneas?"
 SAU_events.330.t: "Reconstrucción de las Fuerzas de Tierras"
 SAU_events.331.a: "Fragatas francesas: el programa Sawari"
 SAU_events.331.b: "Naves estadounidenses y entrenamiento"
 SAU_events.331.c: "Botes de defensa y patrulla costeras"
 SAU_events.331.d: "Llegar a una flota de agua azul"
 SAU_events.331.desc: "Desde el Golfo Arábigo hasta el Mar Rojo, el Reino debe guardar dos largas costas y la línea de vida petrolera del mundo. ¿Qué tipo de flota construiremos?"
 SAU_events.331.t: "Una Armada para Dos Mares"
 SAU_events.332.a: "Águilas Americanas: el programa Peace Sun"
