 SAU_events.312.desc: "¿Cómo luchará el cuerpo blindado con sus nuevos Abrams? Cada camino es un cambio duradero - nos hace más fuertes de una manera y más débiles otra.\n\n§YPor otra parte, una opción para ver exactamente lo que otorga y cuesta.§!"
