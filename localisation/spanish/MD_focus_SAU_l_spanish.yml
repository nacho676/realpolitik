 SAU_succession_panel_dormant: "El trono está ocupado y la sucesión no está en competencia. Si se reabriera, los príncipes y sus facciones serán puestos aquí.[ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_named: "El Príncipe Heredero ha sido nombrado: §H[ROOT.GetSAUCrownPrinceName]§!. El concurso ha terminado y el arreglo tendrá exactamente el tiempo que haga el Rey.\n\n§YLa salud del Rey:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race1: "El rey Fahd está muerto y el rey Abdullah reina ahora, pero él también es viejo y la sucesión no se soluciona. Tres príncipes pretenden ser nombrado heredero: Salman bin Abdulaziz, portador estándar del establecimiento Sudairi; Mohammed bin Nayef, maestro de los servicios de seguridad; y Mutaib bin Abdullah, comandante de la Guardia Nacional.\n\nDe vuelta un príncipe y reunir a la familia y el estado detrás de él mientras socavan a sus rivales. Cada facción también es para sí mismo, por lo que el equilibrio de influencia cambia cada mes. Cuando el rey Abdullah muere, el príncipe sosteniendo la mayor parte de influencia asciende al trono.\n\n§YSalman bin Abdulaziz:§! [?SAU_salman_share|0]%\n§YMohammed bin Nayef:§! [?SAU_mbn_share|0]%\n§YMutaib bin Abdullah:§! [?SAU_mutaib_share|0]%\n\n§YHeir aparente, fueron Abdullah a morir hoy:§! §H[ROOT.GetSAUCrownFrontrunner]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race2: "El rey Salman reina, y el concurso se ha reducido a dos hombres y un título. Mohammed bin Nayef tiene el Ministerio del Interior, el archivo de lucha contra el terrorismo y la confianza de Washington. Mohammed bin Salman mantiene la economía, la cartera de defensa y el oído de su padre, que en esta familia siempre ha contado por más.\n\nRetrocedan uno y reunen el estado detrás de él mientras socavan al otro. Quien tiene la mayor parte cuando el Rey nombra a su heredero - o cuando muere sin nombrar uno- toma el trono después de él.\n\n§YMohammed bin Salman:§! [?SAU_heir_mbs_share|0]%\n§YMohammed bin Nayef:§! [?SAU_heir_mbn_share|0]%\n\n§YHeredero aparente hoy:§! §H[ROOT.GetSAUHeirFrontrunner]§!\n§YLa salud del Rey:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
