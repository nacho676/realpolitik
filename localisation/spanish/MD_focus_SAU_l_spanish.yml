 SAU_events.32.a: "Toma su dinero."
 SAU_events.32.b: "Nunca. Deja que se asfixien con Hormuz."
 SAU_events.32.d: "Nuestros antiguos rivales en Riyadh desean correr su petróleo a través de nuestro territorio hacia el mar. Pagarán muy bien en las tasas de tránsito. El orgullo es una cosa, pero el tesoro está vacío."
 SAU_events.32.t: "Una propuesta saudita"
