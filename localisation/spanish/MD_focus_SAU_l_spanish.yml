 SAU_research_modifery_01: "§HDiversificación§! - Investigación & Desarrollo"
 SAU_research_modifery_01_desc: "La financiación dirigida para universidades e institutos de investigación está acelerando el impulso del Reino para construir una economía de conocimiento más allá del petróleo."
 SAU_research_modifery_02: "§HDiversificación§! - World-Class Research"
 SAU_research_modifery_02_desc: "Instituciones emblemáticas como KAUST han convertido a Arabia Saudita en un creciente centro regional para la ciencia y la innovación, aprovechando el talento de todo el mundo."
 SAU_research_modifier_01: "Awakening Minds"
 SAU_research_modifier_01_desc: "Los programas básicos de alfabetización están ampliando el número de saudíes capaces de entrar en la educación formal."
 SAU_research_modifier_02: "Una nación de lectura"
 SAU_research_modifier_02_desc: "El aumento de la alfabetización ha creado un público de lectura más amplio y una mayor demanda de escuelas y materiales educativos."
 SAU_research_modifier_03: "Ampliación de la educación"
 SAU_research_modifier_03_desc: "Las escuelas y la matrícula ampliadas están dando más acceso a la educación primaria y secundaria de los saudíes."
 SAU_research_modifier_04: "Funds of Learning"
 SAU_research_modifier_04_desc: "El Reino ha establecido las instituciones y el personal capacitado necesario para un sistema nacional de educación más amplio."
 SAU_research_modifier_06: "Cultivating Intellect"
 SAU_research_modifier_06_desc: "Universidades e instituciones de investigación están produciendo una mayor cantidad de especialistas saudíes altamente educados."
 SAU_royal_ulema_alliance_content: "§H Alianza Royal-Ulema§!"
 SAU_royal_ulema_alliance_content_desc: "El §LUlema§! y la §HCasa de al Saud§! cooperan productivamente. La grasa rutinaria era favorable al trono; las políticas rutinarias respetan al clero. Ninguna de las partes tiene causa de queja."
 SAU_royal_ulema_alliance_high: "§H Alianza Royal-Ulema§!"
 SAU_royal_ulema_alliance_high_desc: "El §LConsejo de Becarios mayores§! apoya firmemente el trono, y el establecimiento religioso presenta la política real como legítima. Esta alineación estrecha refuerza sustancialmente la dinastía."
 SAU_royal_ulema_alliance_neutral: "§H Alianza Royal-Ulema§!"
 SAU_royal_ulema_alliance_neutral_desc: "El trono y el clero mantienen una relación §Yformal pero limitada§!. Ninguna de las partes apoya o obstruye activamente a la otra, por lo que el equilibrio del poder no proporciona bonificación ni penalidad."
 SAU_royal_ulema_alliance_neutral_tt: "§YLa relación entre el hombre y el Reino es equilibrada, no hay bonificación ni penalidad.§! \n§Y balance del cambio de poder = 0.00§!"
 SAU_royal_ulema_alliance_strained: "§RTensión entre la realeza y los ulemas§!"
 SAU_royal_ulema_alliance_strained_desc: "Los miembros del §LUlema§! critican privadamente el trono y utilizan sermones para cuestionar la reforma gubernamental. Esta oposición reduce la legitimidad religiosa de la dinastía."
 SAU_sabic_01: "SABIC"
 SAU_sabic_01_desc: "La Saudi Basic Industries Corporation es un importante fabricante petroquímico. Si bien sigue creciendo, el SABIC contribuye a la diversificación industrial y proporciona empleo más allá del sector petrolero."
 SAU_sabic_agrinutrients: "§HSABIC§! - Agri-Nutrients & Especialidad Química"
 SAU_sabic_agrinutrients_desc: "SABIC Agri-Nutrients convierte el gas saudí en urea y amoníaco, alimentando granjas a través de Asia y África y haciendo del Reino un poder fertilizante."
 SAU_sabic_foreign_jv: "§HSABIC§! - Venturas mixtas extranjeras"
 SAU_sabic_foreign_jv_desc: "Las empresas conjuntas con Shell, ExxonMobil y Mitsubishi trajeron tecnología de clase mundial a las plantas de SABIC manteniendo los beneficios anclados en el Reino."
 SAU_sabic_ge_plastics: "§HSABIC§! - GE Plastics Adquisición"
 SAU_sabic_ge_plastics_desc: "La adquisición 2007 de GE Plastics para más de once mil millones de dólares abovedado SABIC en el primer rango de productores mundiales de plásticos diseñados durante la noche."
 SAU_sabic_global_champion: "§HSABIC§! - campeón mundial de productos químicos"
 SAU_sabic_global_champion_desc: "SABIC se encuentra entre las mayores compañías químicas de la Tierra, la prueba de que la industria saudí puede competir mucho más allá del barril de petróleo."
 SAU_sabic_hadeed: "§HSABIC§! - Complejo de acero HADEED"
 SAU_sabic_hadeed_desc: "Hadeed, el brazo de acero del SABIC en Jubail, alimenta la construcción saudí con millones de toneladas de rebar y acero plano que una vez tuvo que ser importado."
 SAU_sabic_ibn_affiliates: "§HSABIC§! - Los Afiliados de Ibn"
 SAU_sabic_ibn_affiliates_desc: "Las filiales de Ibn Sina, Ibn Zahr e Ibn Rushd diseminaron la producción petroquímica de SABIC en plásticos, metanol y fibras."
 SAU_sabic_jubail_yanbu: "§HSABIC§! - Jubail & Yanbu Industrial Cities"
 SAU_sabic_jubail_yanbu_desc: "Las ciudades de la comisión real de Jubail y Yanbu convirtieron la costa vacía en dos de los complejos industriales más grandes del mundo, el fundamento de la industria pesada saudita."
 SAU_sabic_rnd: "§HSABIC§! - Tecnología Home-Grown"
 SAU_sabic_rnd_desc: "Los centros de investigación de SABIC en Riad, Bangalore y Geleen mantienen sus catalizadores y polímeros en la frontera tecnológica."
 SAU_sagia_initiative: "§H Iniciativa SAGIA§!"
 SAU_sagia_initiative_02: "§HSAGIA - Reformas de Inversiones§!"
 SAU_sagia_initiative_02_desc: "§LSAGIA§! ha aflojado las restricciones de propiedad y reducido los retrasos en la concesión de licencias. Estas reformas están atrayendo más negocios extranjeros y facilitando la entrada del mercado saudí."
 SAU_sagia_initiative_03: "§HSAGIA - Centro de Capital Exterior§!"
 SAU_sagia_initiative_03_desc: "Arabia Saudita ha abierto §H sectores estratégicos§!, introducidos §H incentivos impuestos§! y desarrollado §H ciudades económicas§! a lo largo de sus costas. Estas políticas han convertido al Reino en un importante destino regional para la inversión extranjera directa."
 SAU_sagia_initiative_04: "§GSAGIA - Powerhouse de inversión§!"
 SAU_sagia_initiative_04_desc: "Arabia Saudita combina ahora una economía §Hdiversificada§! con un mercado de inversiones §Habierto§!. Las reformas completadas de la SAGIA atraen a importantes trabajadores extranjeros y calificados."
 SAU_sagia_initiative_desc: "Establecido por decreto real §YAbril de 2000§!, el §LSaudi Arabian General Investment Authority§! es la primera agencia del Reino dedicada a atraer inversión extranjera. Es responsable de simplificar el derecho empresarial, proporcionando a los inversores un §Húnico punto de contacto§!, y mejorar el acceso al mercado saudí."
 SAU_salman_health_critical: "§HLa Salud del Rey§! - §R Crítica§!"
 SAU_salman_health_critical_desc: "El Rey ya no viaja y a menudo extraña las reuniones del Consejo. El palacio proporciona poca información, las principales figuras para prepararse para una sucesión."
 SAU_salman_health_declining: "§HLa Salud del Rey§! - §Y Declining§!"
 SAU_salman_health_declining_desc: "El Rey está acortando o cancelando más audiencias oficiales, aunque el palacio no ha anunciado una enfermedad grave. Su horario reducido está empezando a afectar los negocios del gobierno."
 SAU_salman_health_near_death: "§HLa salud del rey§! - §RMuerte cerca§!"
 SAU_salman_health_near_death_desc: "El Rey está cerca de la muerte y ha transferido eficazmente el gobierno a sus sucesores. La actividad política está dominada ahora por los preparativos para la sucesión."
 SAU_salman_health_serious: "§HLa salud del rey§! - §YSerious§!"
 SAU_salman_health_serious_desc: "El Rey hace pocas comparecencias públicas, y los ministros reciben cada vez más instrucciones a través del Tribunal Real en lugar de directamente de él."
 SAU_salman_health_stable: "§HLa Salud del Rey§! - §GEstable§!"
 SAU_salman_health_stable_desc: "El Rey mantiene un calendario oficial completo, recibe embajadores, preside el Consejo de Ministros y revisa los documentos del gobierno. Su participación continua mantiene ordenadamente al tribunal y a los ministerios."
 SAU_shura_led_notables: "Consejo de las Mesas"
 SAU_shura_led_notables_desc: "Los dirigentes tribales y las principales familias mercantes dominan el Consejo de Shura mediante acuerdos oficiosos concertados antes de votar oficialmente. Este arreglo es representativo de las estructuras de poder establecidas por la Arabia Saudita, pero retrasa la adopción de decisiones."
 SAU_shura_led_technocrats: "Consejo de los Ministerios"
 SAU_shura_led_technocrats_desc: "Los tecnócratas han hecho que el Consejo de Shura sea más eficaz en la revisión de presupuestos y políticas gubernamentales. Sus miembros son altamente competentes pero representan poco a comunidades fuera de Riad."
 SAU_shura_led_ulema: "Consejo del Ulema"
 SAU_shura_led_ulema_desc: "Los eruditos religiosos controlan el Consejo de Shura y evitan que las propuestas opuestas por el establecimiento religioso lleguen al Rey."
 SAU_sp_abrams_combined: "Blindaje: Brazos combinados"
 SAU_sp_abrams_combined_desc: "Tanques, infantería y artillería luchando como un equipo equilibrado.\n§G+5%§! División Ataque\n§G+5%§! División Defensa\n§G+5%§! División Organización\n§R+10%§!"
 SAU_sp_abrams_defensive: "Blindaje Muro defensivo"
 SAU_sp_abrams_defensive_desc: "Armadura de polvo como un escudo inamovible para el Reino.\n§G+10%§! Division Defence\n§G+10%§! Velocidad de emprendimiento\n§R-10%§! Division Speed"
 SAU_sp_abrams_shock: "Blindaje: Shock & Ruptura"
 SAU_sp_abrams_shock_desc: "Puños blindados rápidos y duros para romper la línea enemiga.\n§G+10%§!\n§G+5%§! División Speed\n§R-5%§! División Organización"
 SAU_sp_apache_antiarmor: "Aviación del Ejército: Tank-Killers"
 SAU_sp_apache_antiarmor_desc: "Cazadores armados con fuego infernal para destripar un avance blindado.\n§G+7,5%§!\n§G+5%§! División de Ataque\n§R-5%§!"
 SAU_sp_apache_closeair: "Aviación del Ejército: Apoyo cercano"
 SAU_sp_apache_closeair_desc: "Armaduras arriba para mantener y proteger a las tropas terrestres.\n§G+5%§! División Organización\n§G+5%§! División de Recuperación\n§R+10%§! Accidentes aéreos"
 SAU_sp_apache_recon: "Aviación del Ejército: Recon & Raids"
 SAU_sp_apache_recon_desc: "Ojos hacia adelante y relámpagos en las redadas profundas detrás de la línea.\n§G+7.5%§! División Velocidad\n§G+5%§! Velocidad de planificación\n§R-5%§! División de Defensa"
 SAU_sp_arty_mass: "Artillería: Fuegos Masivos"
 SAU_sp_arty_mass_desc: "Sobrevolando los cuarteles para pulverizar al enemigo, el suministro será condenado.\n§G+10%§!\n§R+10%§! Consumo de Suministro"
 SAU_sp_arty_mobile: "Artillería: Disparo y chocolate"
 SAU_sp_arty_mobile_desc: "Fuego y desplazamiento antes de que el enemigo pueda responder.\n§G+5%§! División Velocidad\n§G+5%§! División Organización\n§R-5%§! División de Defensa"
 SAU_sp_arty_precision: "Artillería: Fuegos de precisión"
 SAU_sp_arty_precision_desc: "Menos, rondas más inteligentes en exactamente el objetivo adecuado.\n§G+7,5%§! División de Ataque\n§G+5%§! Obtención de experiencia del ejército\n§R+5%§! Uso de bienes de consumo"
 SAU_sp_awacs_control: "AWACS: Control de Batalla Aérea"
 SAU_sp_awacs_control_desc: "Los controladores coser cada luchador en una web de matar.\n§G+10%§! Superioridad aérea\n§G+5%§!\n§R+3%§! Uso de bienes de consumo"
 SAU_sp_awacs_earlywarn: "AWACS: Red de alerta temprana"
 SAU_sp_awacs_earlywarn_desc: "Ninguna redada cruza la frontera invisible.\n§G+10%§! Defensa Aérea\n§R-5%§! Ataque aéreo"
 SAU_sp_awacs_groundlink: "AWACS: enlace terrestre conjunto"
 SAU_sp_awacs_groundlink_desc: "La imagen de arriba guía al ejército abajo.\n§G+5%§! División Ataque\n§G+5%§! Velocidad de planificación\n§R-5%§!"
 SAU_sp_combat_armor: "Armamentos de combate: Blindaje"
 SAU_sp_combat_armor_desc: "Un puño de armadura por correo como cabeza de lanza.\n§G+7,5%§!\n§G+5%§! División Speed\n§R+5%§! Consumo de Suministros"
 SAU_sp_combat_firepower: "Armas de combate: potencia de fuego"
 SAU_sp_combat_firepower_desc: "Aplastar al enemigo con un gran peso de fuego.\n§G+7,5%§! División de Ataque\n§R-5%§! División Velocidad"
 SAU_sp_combat_infantry: "Armas de combate: infantería profesional"
 SAU_sp_combat_infantry_desc: "La infantería profesional hábil y estable mantiene el campo.\n§G+7,5%§! División Defensa\n§G+5%§! División Organización\n§R-5%§!"
 SAU_sp_fleet_bluewater: "Armada: Ambición de agua azul"
 SAU_sp_fleet_bluewater_desc: "Alcanzar más allá del Golfo hacia el océano abierto.\n§G+15%§! rango naval\n§G+5%§! ataque de la nave capital\n§R-5%§! moral naval"
 SAU_sp_fleet_coastal: "Naval: Coastal Defence"
 SAU_sp_fleet_coastal_desc: "Una pared de pequeño arte vigilando cada puerto y arrecife.\n§G+5%§! moral naval\n§G+10%§! defensa de pantalla\n§R-5%§! ataque de la nave capital"
 SAU_sp_fleet_gulf: "Marina: Control del Mar del Golfo"
 SAU_sp_fleet_gulf_desc: "Dominar las aguas cercanas y concurridas del Golfo Arábigo.\n§G+10%§!\n§G+5%§! Coordinación naval\n§R-10%§! rango naval"
 SAU_sp_pgm_interdiction: "Munición guiada por precisión: Interdicción de Battlefield"
 SAU_sp_pgm_interdiction_desc: "Corta al enemigo de la parte trasera antes de que pueda luchar.\n§G+5%§! División Organización\n§G+5%§! ataque de apoyo aéreo cercano\n§R+10%§! Costo de la Doctrina Aérea"
 SAU_sp_pgm_sead: "Munición guiada por precisión: represión de la defensa"
 SAU_sp_pgm_sead_desc: "Blind y romper la red de defensa aérea enemiga primero.\n§G+7.5%§! Superioridad aérea\n§G+5%§! Ataque aéreo\n§R-5%§! agilidad del aire"
 SAU_sp_pgm_strike: "Munición guiada por precisión: huelga de precisión"
 SAU_sp_pgm_strike_desc: "Bombas inteligentes que aplanan el objetivo y ahorran el resto.\n§G+10%§! ataque de apoyo aéreo cercano\n§G+5%§! Ataque aéreo\n§R+5%§! Uso de bienes de consumo"
 SAU_sp_posture_deterrence: "Postura: Deterrence estratégico"
 SAU_sp_posture_deterrence_desc: "Un escudo equilibrado que hace pensar a cualquier agresor dos veces.\n§G+5%§! División Defensa\n§G+5%§! Defensa aérea\n§G+5%§! Estabilidad\n§R-5%§! División Attack"
 SAU_sp_posture_homeland: "Postura: Defensa Nacional"
 SAU_sp_posture_homeland_desc: "Todo se volvió hacia adentro para hacer del Reino una fortaleza.\n§G+10%§! Defensa del Territorio Central\n§G+5%§! Max Atrincheramiento\n§R-5%§! velocidad de división"
 SAU_sp_posture_projection: "Postura: Proyección de energía"
 SAU_sp_posture_projection_desc: "Un militar que puede llegar y atacar lejos de casa.\n§G+5%§! División Velocidad\n§G+10%§! rango naval\n§G+5%§! Ataque aéreo\n§R+5%§! Uso de bienes de consumo"
 SAU_sp_redflag_bvr: "Aire: Más allá del rango visual"
 SAU_sp_redflag_bvr_desc: "Matar desde lejos antes de que el enemigo te vea.\n§G+7.5%§! Ataque aéreo\n§G+5%§! Superioridad del aire\n§R+10%§! Costo de la Doctrina Aérea"
 SAU_sp_redflag_defensive: "Air Defence Doctrine"
 SAU_sp_redflag_defensive_desc: "Sobrevivir, soportar y proteger los cielos sobre el Reino.\n§G+10%§! Defensa Aérea\n§G+5%§! Agilidad del aire\n§R-5%§! Ataque aéreo"
 SAU_sp_redflag_dogfight: "Aire: Maestría en pelea de perros"
 SAU_sp_redflag_dogfight_desc: "Gire y queme - es dueño de la pelea cercana.\n§G+10%§! Agilidad del aire\n§G+5%§! Ataque aéreo\n§R-5%§! defensa aérea"
 SAU_sp_reform_crash: "Reforma: Programa Crash"
 SAU_sp_reform_crash_desc: "Reforma ahora, reforma rápido - y maldita sea la interrupción.\n§G+10%§!\n§G+5%§! División Organización\n§R-5%§! Estabilidad"
 SAU_sp_reform_foreign: "Reforma: Contratistas extranjeros"
 SAU_sp_reform_foreign_desc: "Contratar expertos extranjeros para hacerlo rápido y bien - por un precio.\n§G-15%§! Tiempo de entrenamiento del Ejército\n§G+5%§! Obtención de experiencia del ejército\n§R-5%§!"
 SAU_sp_reform_steady: "Reforma: Construcción Metódica"
 SAU_sp_reform_steady_desc: "Paciente, reforma ordenada que el ejército puede absorber.\n§G+5%§! División Organización\n§G+5%§! División de Recuperación\n§R-3%§! División de Ataque"
 SAU_sp_sang_regime: "Guardia Nacional: Guardia de Regime"
 SAU_sp_sang_regime_desc: "Primero y último, el SANG protege el trono y las dos ciudades santas.\n§G+10%§! Defensa del Territorio Central\n§G+5%§! Estabilidad\n§R-5%§! División Ataque"
 SAU_sp_sang_security: "Guardia Nacional: Seguridad Interna"
 SAU_sp_sang_security_desc: "Un vigilante contra la subversión y el descontento en casa.\n§G-25%§! Actividad Subversiva Enemiga\n§G+5%§! Estabilidad\n§R-5%§! Apoyo a la guerra"
 SAU_sp_sang_tribal: "Guardia Nacional: Levíos tribales"
 SAU_sp_sang_tribal_desc: "El poder tribal de la lealtad aumenta las filas, si no su pulido.\n§G+10%§! Población restablecida\n§G+5%§! División de Recuperación\n§R-5%§! División Organización"
 SAU_sp_sf_counterterror: "Fuerzas Especiales: Lucha contra el Terrorismo"
 SAU_sp_sf_counterterror_desc: "Una fuerza pequeña y letal para el rescate de rehenes y el contraterrorismo.\n§G+10%§! Ataque de fuerzas especiales\n§G+5%§! Defensa de las Fuerzas Especiales\n§R-3%§!"
 SAU_sp_sf_raiders: "Fuerzas Especiales: Raiders Profundos"
 SAU_sp_sf_raiders_desc: "Más operadores golpeando profundamente, a algún costo para su durabilidad.\n§G+5%§!\n§G+7,5%§!\n§R-5%§! defensa de fuerzas especiales"
 SAU_sp_sf_recon: "Fuerzas Especiales: Reconocimiento"
 SAU_sp_sf_recon_desc: "Ojos silenciosos que hacen que todo el ejército vea más lejos.\n§G+5%§!\n§G+5%§! Velocidad de planificación\n§R-5%§!"
 SAU_spirit_king_in_name: "Rey en nombre, heredero en uniforme"
 SAU_spirit_king_in_name_desc: "La monarquía permanece formalmente intacta, mientras que el Príncipe Heredero sirve como oficial militar bajo la autoridad del Consejo. Este compromiso evita una ruptura abierta entre las instituciones reales y militares sin satisfacer plenamente ninguno de los dos lados."
 SAU_spirit_national_service: "Desfiles del Servicio Nacional"
 SAU_spirit_national_service_desc: "Dos desfiles militares de dos años en King Fahd Road usan armadura, grupos escolares y transmisiones en vivo para construir apoyo público al servicio nacional. Su carácter escénico no ha impedido una fuerte asistencia."
 SAU_spirit_officer_housing: "Programa de Vivienda de los Oficiales"
 SAU_spirit_officer_housing_desc: "El gobierno está construyendo rápidamente viviendas, escuelas y clínicas para oficiales y sus familias. Estos beneficios refuerzan la lealtad del agente al régimen."
 SAU_spirit_officer_purge: "La Purga del Cuerpo de Oficiales"
 SAU_spirit_officer_purge_desc: "Los oficiales que dudaron durante la toma de posesión han sido retirados, mientras que los que lo apoyaron conservan el mando. La purga ha reducido el tamaño del ejército pero ha hecho que el cuerpo de oficiales restante sea más obediente."
 SAU_spirit_public_accounts: "Cuentas Públicas del Consejo"
 SAU_spirit_public_accounts_desc: "Los ministerios publican su gasto por primera vez en la historia saudí. La política ha enojado a las familias que se beneficiaron del secreto pero es muy popular con el público."
 SAU_spirit_quincy_reaffirmed: "El Entendimiento de Quincy"
 SAU_spirit_quincy_reaffirmed_desc: "Los Estados Unidos y el Consejo continúan el acuerdo oficioso sobre petróleo y seguridad establecido por primera vez en 1945. Las fuerzas estadounidenses protegen el transporte marítimo del Golfo mientras que los petroleros saudíes suministran mercados mundiales, y ambos gobiernos prefieren dejar el acuerdo indocumentado."
 SAU_spirit_security_directorate: "La Dirección de Seguridad"
 SAU_spirit_security_directorate_desc: "El Consejo ha combinado los registros de Mabahith, las redes del Ministerio del Interior y la inteligencia militar en una sola dirección bajo un solo general. Sus amplios poderes de vigilancia lo hacen efectivo pero ampliamente desconfiado."
 SAU_spirit_unbeholden: "El Reino Unbeholden"
 SAU_spirit_unbeholden_desc: "Arabia Saudita ha rechazado las garantías y guarnición de seguridad extranjera. Ahora compra sus propias defensas aéreas y entrena a sus propios oficiales, ganando independencia a un costo financiero muy alto."
 SAU_succession_instability: "§RInstalabilidad de la sucesión§!"
 SAU_succession_instability_desc: "El Rey Fahd ha sido incapacitado desde su accidente cerebrovascular en 1995, dejando al Príncipe Heredero Abdullah como gobernante de facto. La corte real está dividida entre los partidarios de Abdullah y la poderosa facción Sudairi, creando un ambiente de incertidumbre política. Hasta que la sucesión se resuelva formalmente, la toma de decisiones del Reino sigue paralizada por rivalidades facciones."
 SAU_syria_landbridge_severed: "El Puente Terrestre de Irán severizó"
 SAU_syria_landbridge_severed_desc: "Un gobierno amistoso en Damasco ha cortado la ruta terrestre de Teherán a Hezbollah. La victoria estratégica infunde al Reino y mantiene el reino."
 SAU_syria_pipeline_t1: "Levant Pipeline (Tier I)"
 SAU_syria_pipeline_t1_desc: "El petróleo saudí cruza Jordania y Siria al Mediterráneo, desafiando el gas ruso a las puertas de Europa. §G Ingresos adicionales: $ 3.50B§! de las exportaciones de oleoductos, contra §R Gastos adicionales: $ 2.00B§! en derechos de tránsito a los países la línea cruza - una red §G+$ 1.50B§! por semana. Sabotaje deja caer la línea un tier, cortando ambos; una línea de nivel 1 cortada cierra la ruta."
 SAU_syria_pipeline_t2: "Levant Pipeline (Tier II)"
 SAU_syria_pipeline_t2_desc: "El petróleo saudí cruza Jordania y Siria al Mediterráneo, desafiando el gas ruso a las puertas de Europa. §GIngresos adicionales: $ 4.25B§! de las exportaciones de oleoductos, contra §R Gastos adicionales: $ 2.30B§! en derechos de tránsito a los países la línea cruza - una red §G+$ 1.95B§! por semana. Sabotaje deja caer la línea un tier, cortando ambos; una línea de nivel 1 cortada cierra la ruta."
 SAU_syria_pipeline_t3: "Oleoducto del Levante (Nivel III)"
 SAU_syria_pipeline_t3_desc: "El petróleo saudí cruza Jordania y Siria al Mediterráneo, desafiando el gas ruso a las puertas de Europa. §G Ingresos adicionales: $ 5.00B§! de las exportaciones de oleoductos, contra §R Gastos adicionales: $ 2.50B§! en derechos de tránsito a los países la línea cruza - una red §G+$ 2.50B§! por semana. Sabotaje deja caer la línea un tier, cortando ambos; una línea de nivel 1 cortada cierra la ruta."
 SAU_syrian_quagmire: "El Quagmire sirio"
 SAU_syrian_quagmire_desc: "Años de apoyo a una guerra sin éxito en Siria han reducido tanto el apoyo público como los fondos disponibles del Tesoro. El gobierno sirio sigue en el poder a pesar de los gastos del Reino."
 SAU_tadawul_market: "§GTadawul, la Bolsa de Valores saudí LVL 0§!"
 SAU_tadawul_market_desc: "La Bolsa de Valores §LSaudi§! está en su etapa inicial, con funciones básicas de comercio y regulación. Completar los objetivos pertinentes profundizará el mercado y aumentará sus beneficios económicos."
 SAU_tadawul_market_t1: "§GTadawul, la Bolsa de Valores saudí LVL 1§!"
 SAU_tadawul_market_t10: "§GTadawul, la Bolsa de Valores saudí LVL 10§!"
 SAU_tadawul_market_t10_desc: "El programa de reforma está completo, con todas las leyes planificadas, reguladores y listas existentes. §LTadawul§! es ahora el intercambio más grande §G en MENA§!, con una capitalización de mercado mayor que el resto de los intercambios del mundo árabe combinado."
 SAU_tadawul_market_t1_desc: "La primera etapa de la reforma de Tadawul ha mejorado las operaciones de mercado y la confianza de los inversores. Seguirán desarrollándose otros aspectos pertinentes."
 SAU_tadawul_market_t2: "§GTadawul, la Bolsa de Valores saudí LVL 2§!"
 SAU_tadawul_market_t2_desc: "Más empresas están enumerando en Tadawul y los volúmenes comerciales están aumentando, aumentando los ingresos fiscales de las oficinas y las empresas."
 SAU_tadawul_market_t3: "§GTadawul, la Bolsa de Valores saudí LVL 3§!"
 SAU_tadawul_market_t3_desc: "Tres etapas de la reforma de Tadawul han aumentado el acceso del intercambio al capital y su contribución a los ingresos estatales."
 SAU_tadawul_market_t4: "§GTadawul, la Bolsa de Valores saudí LVL 4§!"
 SAU_tadawul_market_t4_desc: "Tadawul financia ahora la industria civil, así como las empresas cotizadas, mientras que una regulación más fuerte mejora la confianza y estabilidad de los inversores."
 SAU_tadawul_market_t5: "§GTadawul, la Bolsa de Valores saudí LVL 5§!"
 SAU_tadawul_market_t5_desc: "Tadawul ha completado la mitad de su programa de reforma, con mayor actividad comercial, ingresos y confianza del inversionista."
 SAU_tadawul_market_t6: "§GTadawul, la Bolsa de Valores saudí LVL 6§!"
 SAU_tadawul_market_t6_desc: "Seis etapas de reforma han ampliado el papel de Tadawul en la financiación de las empresas sauditas y atraer inversiones."
 SAU_tadawul_market_t7: "§GTadawul, la Bolsa de Valores saudí LVL 7§!"
 SAU_tadawul_market_t7_desc: "Siete etapas de reforma han hecho de Tadawul un intercambio regional maduro con capital sustancial bajo gestión."
 SAU_tadawul_market_t8: "§GTadawul, la Bolsa de Valores saudí LVL 8§!"
 SAU_tadawul_market_t8_desc: "Un Tadawul maduro canaliza capital en la construcción e industria y da al gobierno mayor influencia sobre política económica."
 SAU_tadawul_market_t9: "§GTadawul, la Bolsa de Valores saudí LVL 9§!"
 SAU_tadawul_market_t9_desc: "Tadawul se está acercando al pleno desarrollo, produciendo altos ingresos fiscales corporativos e industriales y desempeñando un papel más importante en la política económica nacional."
 SAU_tenth_five_year_plan: "El Décimo Plan Quinquenal"
 SAU_tenth_five_year_plan_desc: "El Ministerio de Economía y Planificación ha publicado planes quinquenales desde 1970, pero muchos funcionaron principalmente como declaraciones de intención. Este plan proporciona financiación completa para puertos, ferrocarriles, carreteras de circunvalación y reformas del ministerio.\n\n§GA lo largo de cinco años§!."
 SAU_vision_2030_delivered: "Vision 2030: Delivered"
 SAU_vision_2030_delivered_desc: "Visión 2030 ha llevado a cabo importantes proyectos de construcción y diversificación, como la NEOM, el redesarrollo de Riyadh y nuevas instalaciones turísticas. Arabia Saudita ahora depende menos fuertemente del petróleo crudo."
 SAU_vision_2030_expectations: "Visión 2030: La promesa"
 SAU_vision_2030_expectations_desc: "El anuncio de los megaproyectos de Visión 2030 ha atraído la inversión y el aumento de la confianza pública. Su escala también crea importantes costos presupuestarios y políticos hasta que se completen los proyectos prometidos."
 SAU_vision_2030_progress: "Visión 2030: Tomar Forma"
 SAU_vision_2030_progress_desc: "La construcción está en marcha a través del Reino, y los primeros proyectos Visión 2030 están operando. Este progreso visible ha reducido la duda pública sobre el programa."
 SAU_vision_2030_white_elephant: "Visión 2030: Los elefantes blancos"
 SAU_vision_2030_white_elephant_desc: "Visión 2030 ha perdido su plazo, dejando los principales proyectos inacabados o no utilizados después de cientos de miles de millones en el gasto. El fracaso ha validado los críticos del programa y ha dañado la confianza en el liderazgo."
 SAU_water_crisis_01: "§HCrisis Managed Water§!"
 SAU_water_crisis_01_desc: "La desalinización ampliada, una política agrícola más eficiente y un menor consumo público han reducido la crisis hídrica a un nivel §G manejable§!. El Reino todavía enfrenta escasez de agua estructural, pero los suministros siguen siendo fiables."
 SAU_water_crisis_02: "§HSevera crisis del agua§!"
 SAU_water_crisis_02_desc: "Arabia Saudita está drenando los acuíferos fósiles §LSaq§! y §LWajid§! más rápido de lo que pueden ser reemplazados. La agricultura consume gran parte de las aguas subterráneas restantes, mientras que la dependencia de la desalinización aumenta §Y los costos del consumo§!, reduce §Y la eficiencia§! y debilita la paciencia pública §Y§!."
 SAU_yemen_attack_buff: "Coordinada ofensiva"
 SAU_yemen_attack_buff_desc: "La planificación saudí y el apoyo al fuego dan a nuestras fuerzas una ventaja decisiva en el ataque. +15% ataque contra los Houthis."
 SAU_yemen_pipeline_t1: "Pipeline de mar árabe (Tier I)"
 SAU_yemen_pipeline_t1_desc: "La cruda saudí corre al sur por Al Mahrah hasta el Mar Arábigo, pasando por el Estrecho de Hormuz. §G Ingresos adicionales: $ 2.00B§! de las exportaciones de oleoductos, contra §R Gastos adicionales: $ 1.00B§! en tarifas de tránsito a los países la línea cruza - una red §G+$ 1.00B§! por semana. Sabotaje deja caer la línea un tier, cortando ambos; una línea de nivel 1 cortada cierra la ruta."
 SAU_yemen_pipeline_t2: "Pipeline del Mar de Arabia (Tier II)"
 SAU_yemen_pipeline_t2_desc: "La cruda saudí corre al sur por Al Mahrah hasta el Mar Arábigo, pasando por el Estrecho de Hormuz. §G Ingresos adicionales: $ 2.50B§! de las exportaciones de oleoductos, contra §R Gastos adicionales: $ 1.15B§! en derechos de tránsito a los países la línea cruza - una red §G+$ 1.35B§! por semana. Sabotaje deja caer la línea un tier, cortando ambos; una línea de nivel 1 cortada cierra la ruta."
 SAU_yemen_pipeline_t3: "Pipeline del Mar Arábigo (Tier III)"
 SAU_yemen_pipeline_t3_desc: "La cruda saudí corre al sur por Al Mahrah hasta el Mar Arábigo, pasando por el Estrecho de Hormuz. §G Ingresos adicionales: $ 3.00B§! de las exportaciones de oleoductos, contra §R Gastos adicionales: $ 1.25B§! en derechos de tránsito a los países la línea cruza - una red §G+$ 1.75B§! por semana. Sabotaje deja caer la línea un tier, cortando ambos; una línea de nivel 1 cortada cierra la ruta."
 SAU_baath_state: "El Ba'ath árabe"
 SAU_baath_state_tt: "§YUnidad, libertad, socialismo.§!\n\nEl partido es la vanguardia de la nación árabe, fusible oficial y obrero, cacao y estudiante en una sola voluntad revolucionaria. Cada frontera no es más que un camino hacia una patria árabe."
 SAU_communist_state: "El Estado Socialista"
 SAU_communist_state_tt: "La dictadura del proletariado en Arabia. Estas ganancias sólo tienen lugar mientras el Partido Comunista saudí gobierna. Si pierde el poder, desaparecen."
 SAU_Military_Rule: "Regla militar"
 SAU_Monarchy_house_of_al_saud: "La casa de Al Saud"
 SAU_nda_state: "La Asamblea Nacional Democrática"
 SAU_nda_state_tt: "Las instituciones de la república liberal se profundizan con cada reforma ganada en la urna electoral."
 SAU_nlf_doctrine: "Socialismo de los Países No Alineados"
 SAU_nlf_doctrine_tt: "§YVista árabe al socialismo (Frente de Liberación Nacional solamente):§!\n§G+15% Poder político Ganar, +10% Apoyo a la guerra§!"
 SAU_peoples_council_works: "Consejo de Obras Públicas"
 SAU_peoples_council_works_tt: "Comisariado por §Y el Consejo Popular§! y construido a su nivel"
 SAU_rep_shia_hardline_doctrine: "Teocracia revolucionaria"
 SAU_rep_shia_hardline_doctrine_tt: "Hezbollah Al-Hejaz gobierna en nombre del jurista, la nación se movilizó para la resistencia."
 SAU_rep_shia_moderate_doctrine: "Gobernanza reformista"
 SAU_rep_shia_moderate_doctrine_tt: "El Movimiento de Reforma gobierna mediante la reconciliación, el bienestar y la urna electoral."
 SAU_rep_shia_state: "República de Shia"
 SAU_rep_shia_state_tt: "Las instituciones de la república chiíta se fortalecen con cada reforma ganada y cada victoria tomada."
 SAU_scp_doctrine: "Marxista-leninista Vanguard"
 SAU_scp_doctrine_tt: "§YOrtodoxo Marxismo-Leninismo (Partido Comunista Saudio solamente):§!\n§G+10% Eficiencia de Fábrica, +10% Velocidad de Construcción, +5% Estabilidad§!"
 SAU_arab_consensus: "Consenso árabe contra la normalización"
 SAU_arab_shield_bond: "Hermanos del Escudo Árabe"
 SAU_beijing_agreement: "El Acuerdo de Beijing"
 SAU_betrayed_palestine: "Abandonó la causa palestina"
 SAU_boycott_israel: "Boicot"
 SAU_cause_solidarity: "Solidaridad con Palestina"
 SAU_egypt_economic_ties: "Apoyo económico saudí"
 SAU_egypt_military_ties: "Patronato militar saudí"
 SAU_egypt_partnership: "Asociación saudí-egipcia"
 SAU_exposed_iran: "Expuestas en Yemen"
 SAU_iraq_friendship: "La Amistad de Arabia Saudita"
 SAU_islamic_rivalry: "La caballería islámica"
 SAU_islamic_rivalry_tt: "[PER.GetFlag]§REl concurso para el mundo islámico comienza.§!"
 SAU_israel_normalization: "Normalización de las relaciones"
 SAU_proxy_aggression: "Patrocinador del Terror"
 SAU_quincy_reaffirmed: "Acuerdo de Quincy reafirmado"
 SAU_recognition_anger: "Estado palestino reconocido"
 SAU_recognized_palestine: "Reconocida Palestina"
 SAU_taif_spirit: "Espíritu de Taif"
 SAU_talks_collapsed: "Conversaciones de normalización fallidas"
 SAU_two_state_champion: "Campeón de la solución biestatal"
 HOU_break_ceasefire_category: "La cesación del fuego saudita"
 HOU_drop_north_yemen_name: "Reclamar el nombre de Yemen"
 HOU_drop_north_yemen_name_desc: "Dejar de lado la identidad de Yemen del Norte y volver a gobernar bajo nuestra propia bandera."
 PER_houthi_militia: "Mobilizar la Milicia Popular"
 PER_houthi_militia_desc: "Movilizar a partidarios tribales para dar al movimiento hutí mano de obra adicional a bajo costo."
 PER_houthi_old_weapons: "Contrabandear armas a los hutíes"
 PER_houthi_old_weapons_desc: "Enviar un cargamento de fusiles viejos por el Mar Rojo y cruzar la frontera hasta los combatientes hutíes."
 PER_houthi_raise_brigade: "Endurecer las defensas"
 PER_houthi_raise_brigade_desc: "Enviar ingenieros de la Fuerza Quds para atrincherar a los hutíes en las montañas. Serán mucho más difíciles de desalojar del terreno que ocupan."
 PER_houthi_support_category: "Apoyar a los Houthis"
 SAU_abdullah_kaec_construction: "Construcción de KAEC de tracción rápida"
 SAU_abdullah_kaec_construction_desc: "Acelerar la construcción de la Ciudad Económica Rey Abdullah eximiendo de permisos y contratando más contratistas a lo largo de la costa del Mar Rojo."
 SAU_abdullah_kasp_scholarship: "Ampliar la beca en el extranjero de la KASP"
 SAU_abdullah_kasp_scholarship_desc: "Ampliar las becas en el extranjero financiadas por el Estado para que más estudiantes saudíes puedan estudiar materias en las que el Reino carece de especialistas formados. Su educación reforzará la fuerza laboral nacional cuando regresen."
 SAU_abdullah_kaust_grants: "Financiar las becas de alta tecnología de KAUST"
 SAU_abdullah_kaust_grants_desc: "Proporcionar a KAUST grandes subvenciones de investigación para reclutar a especialistas destacados y establecer laboratorios avanzados en Thuwal."
 SAU_abdullah_national_dialogue: "Convocar foros de diálogo nacional"
 SAU_abdullah_national_dialogue_desc: "Reunir a clérigos, reformistas, representantes chiíes y mujeres en foros de diálogo nacional. Las reuniones darán a los grupos excluidos un cauce formal para plantear sus inquietudes."
 SAU_abdullah_sang_subsidies: "Subvenciones de modernización SANG"
 SAU_abdullah_sang_subsidies_desc: "Subvencionar nuevos contratos de vehículos para el Arabia Saudita Guardia Nacional, reduciendo el costo de su modernización y reforzando su lealtad al gobierno."
 SAU_Among_Major_powers_Open_east: "Abrir las decisiones de §RLa cooperación con Oriente§!"
 SAU_appoint_provincial_governor: "Nombrar a un gobernador provincial"
 SAU_appoint_provincial_governor_desc: "La provincia está vacante. Seleccione una provincia en el mapa y el Consejo decidirá quién lo toma.\n\nCada provincia puede ser entregada una vez."
 SAU_arm_arab_revolutionaries: "Armar a los revolucionarios árabes"
 SAU_arm_arab_revolutionaries_desc: "Fusiles de suministro y organizadores capacitados a los movimientos comunistas que operan en otros países árabes."
 SAU_arm_lebanese_army: "Armar al Ejército Libanés"
 SAU_arm_lebanese_army_desc: "Proporcionar al Ejército Libanés armas y entrenamiento saudíes para que pueda operar con independencia de Hezbolá."
 SAU_back_mbn: "Respaldar a Mohammed bin Nayef"
 SAU_back_mbn_desc: "Tira tu peso detrás del Ministro del Interior, arquitecto del estado antiterrorista del Reino y favorito de Washington. Comprometerse con un candidato vincula al tribunal a su causa por el resto de la sucesión."
 SAU_back_mbn_heir: "Respaldar a Mohammed bin Nayef"
 SAU_back_mbn_heir_desc: "Apoyar a Crown Prince Mohammed bin Nayef sobre la base de su servicio del Ministerio del Interior, registro antiterrorista y fuertes relaciones con Washington."
 SAU_back_mbs_heir: "Respaldar a Mohammed bin Salman"
 SAU_back_mbs_heir_desc: "Apoya a Mohammed bin Salman, el hijo joven del Rey, ya que consolida la autoridad sobre un número creciente de ministerios a pesar de su experiencia limitada."
 SAU_back_mutaib: "Respaldar a Mutaib bin Abdullah"
 SAU_back_mutaib_desc: "Tira tu peso detrás del hijo del rey Abdullah, comandante del Guardia Nacional y heredero de la tribu de su padre después. Comprometerse con un candidato vincula al tribunal a su causa por el resto de la sucesión."
 SAU_back_salman: "Respaldar a Salman bin Abdulaziz"
 SAU_back_salman_desc: "Tira tu peso detrás del príncipe Sudairi y gobernador de Riad. Comprometerse con un candidato vincula al tribunal a su causa por el resto de la sucesión."
 SAU_bahrain_restore_khalifa: "Restaurar la Casa de Jalifa"
 SAU_bahrain_restore_khalifa_desc: "Desplegar a través de la calzada para restaurar a la Casa de Jalifa si pierde el poder en Baréin.\n\n§YDisponible cuando§! Baréin ya no esté gobernado por la Casa de Jalifa.\n\n§GRestaura en el poder a la Casa de Jalifa§!, saca a Baréin de cualquier facción que no sea la nuestra y lo pone bajo el §YEscudo de la Península§!.\n\n§R-$15 mil millones, -2% de estabilidad§!, y las relaciones con Teherán sufrirán. §G+5% de apoyo a la guerra§!."
 SAU_bop_note: "§HCómo son los futuros cambios del Reino§!"
 SAU_bop_note_desc: "El §HEl futuro del Reino§! el equilibrio no puede cambiarse directamente a través de una decisión. §Lterminados§! en el Tadawul, SAGIA y otras ramas, así como a través de §Leventos clave§! y el Rey §Lreformas§!."
 SAU_break_houthi_ceasefire: "Romper la cesación del fuego"
 SAU_break_houthi_ceasefire_desc: "Levanta la tregua con los Houthis y reanuda la Operación Tormenta Decisiva."
 SAU_broadcast_revolution: "Transmitiendo la revolución"
 SAU_broadcast_revolution_desc: "Utilice Radio Free Arabia para promover el apoyo comunista entre los trabajadores y otros grupos descontentos en todos los países árabes."
 SAU_coalition_member_arm_yemen: "De la República"
 SAU_coalition_member_arm_yemen_desc: "Armas y hombres enviados al gobierno reconocido en nuestro propio nombre, no de Riyadh.\n\n§GYemen recibe 1.500 armas de infantería, 8.000 mano de obra y experiencia militar§!. Repetible cada 30 días."
 SAU_coalition_member_category: "La coalición Yemen"
 SAU_coalition_member_leave: "Deja la Coalición"
 SAU_coalition_member_leave_desc: "Retirada de la coalición liderada por Arabia Saudita y poner fin a nuestra participación en su campaña del Yemen.\n\n§RRiyadh pierde un compañero de coalición y lo toma personalmente§!; §G+50 poder político, +3% estabilidad§!."
 SAU_coalition_member_strike: "Volar nuestro Sortie"
 SAU_coalition_member_strike_desc: "Nuestra parte de la orden de tareas aéreas, volada contra una provincia que tienen los hutíes.\n\n§RDaña la infraestructura, la industria de armas y las defensas aéreas§! de la provincia objetivo. Repetible cada 21 días."
 SAU_communist_invite_to_comintern: "Invitar a [FROM.GetName] al Comintern Árabe"
 SAU_communist_invite_to_comintern_desc: "Extender una invitación a [FROM.GetName] para unirse al Comintern Árabe. Un Estado obrero hermano no necesita ser liberado por la fuerza; puede aceptar o declinar."
 SAU_communist_seize_power: "Lanzar la Revolución Socialista en [FROM.GetName]"
 SAU_communist_seize_power_desc: "Donde los trabajadores tienen las calles, huelga. Con un apoyo abrumador el viejo régimen cae; donde el movimiento es meramente fuerte, el país se hunde en la guerra civil revolucionaria."
 SAU_council_national_service: "Desfiles del Servicio Nacional"
 SAU_council_national_service_desc: "Celebrar un desfile militar televisado a nivel nacional en la avenida Rey Fahd con el Consejo presente. La exhibición fomentará el apoyo público a las fuerzas armadas y al nuevo gobierno."
 SAU_council_officer_housing: "Programa de Vivienda de los Oficiales"
 SAU_council_officer_housing_desc: "Construir complejos de viviendas, escuelas y clínicas para el cuerpo de oficiales. Esto mejorará el apoyo militar al Consejo, pero desvía fondos públicos de otras necesidades."
 SAU_council_officer_purge: "Depurar el cuerpo de oficiales"
 SAU_council_officer_purge_desc: "Retirar a los oficiales cuya lealtad fue incierta durante la toma del poder y apartar a otros identificados en la investigación posterior. El ejército será más pequeño pero más confiable."
 SAU_council_public_accounts: "Publicar las cuentas públicas"
 SAU_council_public_accounts_desc: "Publicar las cuentas de los ministerios para demostrar el compromiso del Consejo con un gobierno transparente. Esto mejora su reputación de honestidad pero restringe el gasto discrecional que antes se usaba para arreglos informales."
 SAU_council_security_directorate: "Establecer la Dirección de Seguridad"
 SAU_council_security_directorate_desc: "Reunir a la Mabahith, las redes del Ministerio del Interior y la inteligencia militar bajo una sola dirección. Un reporte centralizado mejorará la capacidad del Consejo para vigilar amenazas en todo el Reino."
 SAU_councils_category: "Los Consejos del Reino"
 SAU_councils_category_desc: "§HMajlis ash-Shura§! - [ROOT.GetSAUShuraBench]\n§OUlema§! [?SAU_shura_ulema|0] §YTecnócratas§! [?SAU_shura_technocrats|0] §GNotables§! [?SAU_shura_notables|0]\n§HEl Consejo Popular§! - [ROOT.GetSAUPCStanding], [ROOT.GetSAUPCBloc]\n§OReformistas§! [?SAU_pc_reformists|0] §YTradicionalistas§! [?SAU_pc_traditionalists|0] §GProvinciales§! [?SAU_pc_provincials|0]\n\nDos cámaras ahora se sientan en Riad y tampoco pueden obligar al Rey a hacer nada.\n\n§HThe Majlis ash-Shura§! es nombrado y aconseja sobre lo que sea que se entrega. Cualquiera que tenga más asientos establece su carácter, y el personaje vale algo:\n§OUlema-led§! §G+8% de estabilidad, +10% de defensa de deriva§! / §R-5% de investigación, -5% migración§!\n§YTechnocrat-led§! §G+8% de investigación, +6% de salida de oficina, +5% productividad§! / §R-5% de estabilidad§!\n§GLiderazgo de mesa§! §G+8% del poder político, -8% de la corrupción§! / §R+3% de bienes de consumo, -3% de apoyo a la guerra§!\n\n§YAsienta un banco más allá de los 70 y el Rey puede alquilar el Consejo permanentemente.§! Una carta doble que el carácter del banco, lo fija en la Ley Básica y termina el concurso para siempre - el asiento cuenta dejar de decidir nada. Rechazar, y las tres bancas se reasientan a 40 con la cámara todavía la suya para rebalance.\n\n§HEl Consejo Popular§! responde hacia abajo. Es el primer cuerpo en la historia del Reino que habla por los gobernados más que a ellos, y puede legislar sobre asuntos internos. El Rey conserva el veto, y §Rcada uso de ella cuesta estabilidad y apoyo a la guerra§!."
 SAU_crown_prince_category: "Prince"
 SAU_cyber_defensive_op: "Operación Cibernética Defensiva"
 SAU_cyber_defensive_op_desc: "Endurecer el Reino y sabotear los sistemas ofensivos del objetivo durante §Y90 días§!. Sus fuerzas combaten §Y10% más débiles al atacar§! contra nosotros, mientras la GIP protege nuestras propias redes. Requiere una red de §G70%§! en el objetivo."
 SAU_cyber_offensive_op: "Operación Cibernética Offensiva"
 SAU_cyber_offensive_op_desc: "Convierte la red en un arma. A §Y90-día§! La huelga cibernética del GIP derriba las órdenes y defensas del objetivo: sus divisiones combaten §Y10% más débil en la defensa§! y su industria se mantiene firme. Requiere una red §G70%§! en el objetivo."
 SAU_debug_bop_left: "§Y (DEBUG) Cambio hacia el Tradicionalismo§!"
 SAU_debug_bop_left_desc: "Solo herramienta de modders/depuración. Desplaza el equilibrio del §HFuturo del Reino§! §R-0.05 a la izquierda§! (hacia el Tradicionalismo). Visible solo cuando el juego se inicia con -debug."
 SAU_debug_bop_right: "§Y(DEBUG) Cambio hacia la liberalización§!"
 SAU_debug_bop_right_desc: "Solo herramienta de modders/depuración. Desplaza el equilibrio del §HFuturo del Reino§! §G+0.05 a la derecha§! (hacia la Liberalización). Visible solo cuando el juego se inicia con -debug."
 SAU_debug_category: "DEBUG - Sucesión saudí"
 SAU_debug_clear_decree_lock: "DEBUG: Borrar el bloqueo del decreto de 60 días"
 SAU_debug_clear_decree_lock_desc: "Borra SAU_royal_decree_active para que las decisiones del monarca reinante puedan tomarse de nuevo de inmediato, sin esperar los 60 días."
 SAU_debug_drain_salman_health: "DEBUG: Drenar la salud del rey Salman"
 SAU_debug_drain_salman_health_desc: "Fija SAU_salman_health a 0. La cadena de ascenso se activa en el siguiente tick mensual y corona a quien sea entonces príncipe heredero."
 SAU_debug_faisalite_conviction_up: "(DEBUG) Convicción faisalista +25"
 SAU_debug_faisalite_conviction_up_desc: "Suma 25 de convicción y reevalúa el nivel. Repite para cruzar 45 y 75."
 SAU_debug_faisalite_open: "(DEBUG) Abrir la cadena faisalista"
 SAU_debug_faisalite_open_desc: "Activa el evento de la cumbre de La Meca que inicia la cadena, sin esperar 140 días."
 SAU_debug_faisalite_pivot: "(DEBUG) Activar el giro hacia Irak"
 SAU_debug_faisalite_pivot_desc: "Activa el evento del giro de ocupación estadounidense sin importar la situación de la guerra."
 SAU_debug_faisalite_readout: "Faisalite: [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_faisalite_readout_desc: "§HConvicción§!: §Y [?SAU_faisalite_conviction|0]§! de §Y100§!\n§H Conservatismo social por mes§!: §Y[?SAU_social_conservatism|0]§!\n§HTier§!: [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_grievance_open: "(DEBUG) Abrir la cadena del golpe"
 SAU_debug_grievance_open_desc: "Fija la bandera del colapso petrolero de 2008 y activa el evento de agravio de los oficiales que inicia la cadena, sin esperar a 2008."
 SAU_debug_grievance_readout: "(DEBUG) Oficiales: [ROOT.GetSAUArmyGrievance]"
 SAU_debug_grievance_readout_desc: "§HGrievance§!: §Y [?SAU_army_grievance|0]§! de §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n§HGuard blindado§! (dobla la tasa mensual): verificada por la bandera SAU_sang_shielded."
 SAU_debug_grievance_up: "(DEBUG) Agravio de los oficiales +25"
 SAU_debug_grievance_up_desc: "Suma 25 de agravio y reevalúa el nivel. Repite para cruzar 50 (orden de despliegue) y 75 (el golpe)."
 SAU_debug_junta_legitimacy_up: "(DEBUG) Legitimidad de la junta +25"
 SAU_debug_junta_legitimacy_up_desc: "Sube el prestigio del Consejo, para comprobar que la crisis se completa en lugar de agotar el tiempo."
 SAU_debug_junta_legitimacy_zero: "(DEBUG) Legitimidad de la junta a 0"
 SAU_debug_junta_legitimacy_zero_desc: "Deja al Consejo en nada, de modo que la crisis de legitimidad se arma en la siguiente comprobación."
 SAU_debug_junta_open: "(DEBUG) Forzar el golpe de los oficiales"
 SAU_debug_junta_open_desc: "Arma la cadena de agravios y activa el evento de toma de poder de inmediato."
 SAU_debug_king_abdullah: "DEBUG: Coronar al rey Abdullah"
 SAU_debug_king_abdullah_desc: "Fija SAU_current_king a 1, instala a Abdullah como líder del país y reabre la carrera sucesoria de la era de Abdullah (Salman 45 / MBN 30 / Mutaib 25)."
 SAU_debug_king_mbn: "DEBUG: Coronar a Mohammed bin Nayef"
 SAU_debug_king_mbn_desc: "Fija SAU_current_king a 3 e instala a Mohammed bin Nayef como líder del país."
 SAU_debug_king_mbs: "DEBUG: Coronar a Mohammed bin Salman"
 SAU_debug_king_mbs_desc: "Fija SAU_current_king a 5 e instala a Mohammed bin Salman como líder del país."
 SAU_debug_king_mutaib: "DEBUG: Coronar a Mutaib bin Abdullah"
 SAU_debug_king_mutaib_desc: "Fija SAU_current_king a 4 e instala a Mutaib bin Abdullah como líder del país."
 SAU_debug_king_salman: "DEBUG: Coronar al rey Salman"
 SAU_debug_king_salman_desc: "Fija SAU_current_king a 2, instala a Salman como líder del país, restablece su salud a 100 y abre la carrera de príncipe heredero MBS contra MBN."
 SAU_debug_oil_dep_readout: "(DEBUG) Dependencia del petróleo: [?oil_dependence|0] (tick trimestral [?SAU_oil_dep_quarter|0]/3)"
 SAU_debug_oil_dep_readout_desc: "Lee el valor de dependencia y cuánto lleva avanzado el tick trimestral."
 SAU_debug_pc_open: "(DEBUG) Crear el Consejo del Pueblo"
 SAU_debug_pc_open_desc: "Fija la bandera y sienta a la cámara en 40/40/40 con prestigio 50, sin el enfoque."
 SAU_debug_pc_readout: "(DEBUG) Estado del Consejo del Pueblo"
 SAU_debug_pc_readout_desc: "§HAbierto§! (SAU_ peoples_council_open, set by SAU_establish_the_peoples_council)\n§HStanding§!: §Y[?SAU_pc_standing|0]§! - Obras Públicas necesita 60+\n§HAsientos§! - reformistas §Y[?SAU_pc_reformists|0]§!, tradicionalistas §Y[?SAU_pc_traditionalists|0]§!, provinciales §Y[?SAU_pc_provincials|0]§! - un banco necesita 21+ para hablar\n§HVetoes utilizados§!: §Y[?SAU_pc_vetoes|0]§!"
 SAU_debug_pc_reset_cycle: "(DEBUG) Borrar las banderas de la sesión"
 SAU_debug_pc_reset_cycle_desc: "Borra SAU_pc_debate_ongoing y SAU_pc_doing_bill si una sesión se atasca."
 SAU_debug_pc_standing_up: "(DEBUG) Prestigio del Consejo +20"
 SAU_debug_pc_standing_up_desc: "Sube el prestigio en 20 para poder probar Obras públicas."
 SAU_debug_shura_dissolve: "(DEBUG) Disolver el Majlis ash-Shura"
 SAU_debug_shura_dissolve_desc: "Ejecuta SAU_shura_dissolve: borra la bandera, pone a cero los bancos y quita el espíritu."
 SAU_debug_shura_open: "(DEBUG) Abrir el Majlis ash-Shura"
 SAU_debug_shura_open_desc: "Fija SAU_shura_open y sienta al Consejo en 50/50/50, sin SAU_reorganization_of_the_majlis_ash_shura ni Miteb en el trono."
 SAU_debug_shura_readout: "(DEBUG) Comprobación de la puerta de la Shura"
 SAU_debug_shura_readout_desc: "§HCada condición necesita la categoría:§!\n§Y Consejo abierto§! (SAU_shura_open, establecido por SAU_reorganization_of_the_majlis_ash_shura)\n§YHouse of Al Saud ruling§!: [?ruling_party|0] debe ser 10\n§YNo coup§! (SAU_military_coup_ready must be clear)\n§YMonarquía intacta§! (SAU_monarchy_abolished must be clear)\n\n§HSeats§! - ulema [?SAU_shura_ulema|0], tecnócratas [?SAU_shura_technocrats|0], notables [?SAU_shura_notables|0]"
 SAU_debug_storm_complete_civil_war: "(DEBUG) Completar el enfoque de la Guerra Civil de Yemen"
 SAU_debug_storm_complete_civil_war_desc: "Completa a la fuerza SAU_the_yemeni_civil_war sin esperar la comprobación mensual."
 SAU_debug_storm_open: "(DEBUG) Activar la Reunión de Riad"
 SAU_debug_storm_open_desc: "Activa directamente el evento 194, saltándose el enfoque y sus requisitos previos."
 SAU_debug_storm_readout: "Coalición: [?SAU_coalition_partners|0]"
 SAU_debug_storm_readout_desc: "§HCoalition partners§!: §Y [?SAU_coalition_partners|0]§!\n§HStorm lanzado§!: flag SAU_decisive_storm_launched\n§HCivil war focus§!: SAU_the_yemeni_civil_war"
 SAU_debug_water_pride_down: "§Y(DEBUG) fuerza el orgullo del agua -1 tier§!"
 SAU_debug_water_pride_down_desc: "Herramienta de modders/depuración. Fuerza el espíritu §HAguas soberanas§! un nivel hacia abajo sin importar la estabilidad. Visible solo con -debug."
 SAU_debug_water_pride_up: "§Y(DEBUG) fuerza el orgullo del agua +1 tier§!"
 SAU_debug_water_pride_up_desc: "Herramienta de modders/depuración. Fuerza el espíritu §HAguas soberanas§! un nivel hacia arriba sin importar la estabilidad. Visible solo con -debug."
 SAU_div_arms: "Localizar la producción de armas"
 SAU_div_arms_desc: "Desarrollar la §HSAMI§! y la industria de defensa nacional. Las armas hechas en Arabia Saudí reducen la factura de importaciones, dan empleo a ingenieros y §Gamplían la base industrial§! más allá del petróleo."
 SAU_div_digital: "Hacer crecer la economía digital"
 SAU_div_digital_desc: "Support §Hfintech, e-commerce and start-ups§! to create qualified employment and a larger non-oil tax base. Este §G reduce la confianza en el crudo§! al expandir las industrias digitales privadas."
 SAU_div_giga_project: "Fondo a Giga-Project"
 SAU_div_giga_project_desc: "Comprometer fondos importantes a §HNEOM§! y a su ciudad planeada en el noroeste. El proyecto aporta una demanda de construcción sustancial y aleja a la economía §Gdel petróleo§!, pero a un costo fiscal muy alto."
 SAU_div_pif_invest: "PIF inversión estratégica"
 SAU_div_pif_invest_desc: "Dirigir capital del §HFondo de Inversión Pública§! a fábricas, capacidad de construcción y empleo nacionales en Riad. Esto da una gran reducción de la §Gdependencia del petróleo§! a un costo considerable para el tesoro."
 SAU_div_renewables: "Ampliación de la capacidad renovable"
 SAU_div_renewables_desc: "Desarrollar la §Henergía solar y eólica§! en el Barrio Vacío. La energía limpia libera crudo para exportar y §Gafloja la dependencia de la economía del petróleo§!."
 SAU_div_tourism_event: "Acoger un evento mundial de turismo"
 SAU_div_tourism_event_desc: "Promover complejos turísticos, festivales, peregrinaciones y turismo internacional en la §Hcosta del Mar Rojo§!. El gasto de los visitantes §Gdiversifica§! los ingresos del Reino más allá del petróleo."
 SAU_domestic_external_category: "§HSaudi Domestic & External Affairs§!"
 SAU_east_belt_road: "Inversión de la Franja y la Ruta"
 SAU_east_belt_road_desc: "Aceptar la inversión china de la Franja y la Ruta en puertos, ferrocarriles y ciudades industriales saudíes. Los proyectos amplían la infraestructura sin las condiciones políticas que suelen imponer los socios occidentales."
 SAU_east_energy_markets: "Mercados de energía asiáticos"
 SAU_east_energy_markets_desc: "Ampliar las exportaciones de petróleo a China y otras economías asiáticas. Una base de clientes más amplia mejora la influencia saudí y reduce la dependencia de la demanda occidental."
 SAU_east_trade: "Acuerdo de Comercio con el Este"
 SAU_east_trade_desc: "Concluir acuerdos comerciales que intercambien exportaciones de energía saudíes por bienes manufacturados de las economías asiáticas en crecimiento."
 SAU_faisalite_category: "La cuestión de los fascistas"
 SAU_faisalite_endowments: "Fondo de las Dotaciones"
 SAU_faisalite_endowments_desc: "Proporcionar financiación adicional a las dotaciones religiosas que han sufrido déficits desde que cayeron los ingresos del petróleo. Los fondos sin rastrear asegurarán el apoyo de clérigos que influyen en los sermones de todo el Reino."
 SAU_faisalite_guard_petition: "Las peticiones de la Guardia"
 SAU_faisalite_guard_petition_desc: "Permitir que oficiales superiores de la Guardia Nacional presenten una petición pública a Mutaib. Firmarla identificará a los oficiales que apoyan su pretensión a la sucesión."
 SAU_faisalite_int_buy_satellite_channels: "Comprar los canales árabes de satélite"
 SAU_faisalite_int_buy_satellite_channels_desc: "Comprar las grandes cadenas satelitales árabes y nombrar personal alineado con Riad. Esto amplía la influencia saudí sobre los medios regionales pero preocupa a los ulemas."
 SAU_faisalite_int_endow_universities: "Dotar a las universidades extranjeras"
 SAU_faisalite_int_endow_universities_desc: "Financiar cátedras permanentes de Estudios Islámicos en universidades extranjeras, de El Cairo a Kuala Lumpur. Riad aportará la financiación y determinará el currículo aprobado."
 SAU_faisalite_int_hard_currency_loans: "Prestar en divisa fuerte"
 SAU_faisalite_int_hard_currency_loans_desc: "Ofrecer préstamos en dólares a gobiernos que no pueden obtener financiación asequible en otro lugar. Las condiciones favorables aumentarán su dependencia del apoyo saudí."
 SAU_faisalite_int_officers_abroad: "Comisionar al cuerpo de oficiales en el extranjero"
 SAU_faisalite_int_officers_abroad_desc: "Asignar oficiales saudíes como asesores e instructores a las fuerzas armadas de todo el mundo musulmán. Estos despliegues mejoran la experiencia militar saudí y amplían la influencia de Riad."
 SAU_faisalite_int_pilgrimage_quotas: "Ampliar las cuotas de peregrinación"
 SAU_faisalite_int_pilgrimage_quotas_desc: "Aumentar las cuotas del Hach pese a la presión añadida sobre la infraestructura de La Meca. Más peregrinos conocerán la administración saudí de los lugares santos y volverán a casa con lazos más fuertes con el Reino."
 SAU_faisalite_iso_buy_foreign_firms: "Comprar a las empresas extranjeras"
 SAU_faisalite_iso_buy_foreign_firms_desc: "Comprar empresas de propiedad extranjera que operan en el Reino y traspasar sus activos a ministerios estatales. Esto aumenta el control saudí de la economía pero deja a los nuevos operadores sin la experiencia que ya tenían las empresas."
 SAU_faisalite_iso_cancel_visas: "Cancelar los visados de trabajo extranjeros"
 SAU_faisalite_iso_cancel_visas_desc: "Dejar que un millón de permisos de trabajo extranjeros caduquen sin renovación. Esto aumenta la proporción de saudíes en la fuerza laboral pero retrasará los proyectos que dependen de mano de obra extranjera."
 SAU_faisalite_iso_close_foreign_schools: "Clausurar las escuelas extranjeras"
 SAU_faisalite_iso_close_foreign_schools_desc: "Cerrar las escuelas internacionales y trasladar a sus alumnos al sistema estatal. La educación seguirá un currículo saudí, pero las escuelas no están preparadas para los alumnos adicionales."
 SAU_faisalite_iso_import_licences: "Racionar las licencias de importación"
 SAU_faisalite_iso_import_licences_desc: "Reducir el número de licencias de importación emitidas cada trimestre. Las importaciones serán más escasas y caras, y dan más margen en el mercado a los productores nacionales."
 SAU_faisalite_iso_repatriate_reserves: "Repatriar las reservas soberanas"
 SAU_faisalite_iso_repatriate_reserves_desc: "Sacar las reservas soberanas saudíes de Nueva York y Londres y devolverlas al Reino. Esto refuerza el control directo de los activos nacionales pero dañará gravemente las relaciones con los socios financieros occidentales."
 SAU_faisalite_score_interventionist: "§RInterventionist§!   §Y[?SAU_faisalite_interventionist|0]§!"
 SAU_faisalite_score_interventionist_desc: "El intervencionismo usa cumbres, apoyo financiero y asesores militares para poner a Riad a la cabeza de la Umma. Pueden correr dos directrices intervencionistas a la vez, y cada una rinde solo al completarse; mantén esta puntuación por encima de la puntuación §Oaislacionista§! para que el pilar final sea §RLa doctrina de la Tercera Vía§!."
 SAU_faisalite_score_isolationist: "§OIsolationist§! §Y [?SAU_faisalite_isolationist|0]§!"
 SAU_faisalite_score_isolationist_desc: "El aislacionismo concentra la política saudí en sus fronteras, su religión y su petróleo y evita compromisos exteriores. Pueden correr dos directrices aislacionistas a la vez, y cada una rinde solo al completarse; mantén esta puntuación por encima de la puntuación §Rintervencionista§! para que el pilar final sea §OEl aislamiento espléndido§!."
 SAU_faisalite_sermons: "Circula los Sermones"
 SAU_faisalite_sermons_desc: "Reeditar los discursos grabados de Faisal y distribuir transcripciones en los círculos de la Guardia Nacional. La campaña revivirá su doctrina política, aunque el Ministerio reconocerá sus implicaciones para el gobierno actual."
 SAU_Foregin_affairs_category: "§GAsuntos de Relaciones Exteriores§!"
 SAU_Foreign_affairs_unlocked: "§H Asuntos extranjeros desbloqueados§!"
 SAU_Foreign_affairs_unlocked_desc: "El Ministerio de Relaciones Exteriores vuelve a responder al Reino. Las decisiones que figuran a continuación están abiertas."
 SAU_found_arab_comintern: "Fundar el Comintern Árabe"
 SAU_found_arab_comintern_desc: "Arabia convoca a los Estados comunistas del mundo árabe en un único bloque revolucionario bajo su propio liderazgo."
 SAU_fsa_foreign_fighters: "Abrir el canal de combatientes extranjeros"
 SAU_fsa_foreign_fighters_desc: "Permitir que voluntarios extranjeros que viajan por el Golfo se unan al Ejército Libre Sirio y aumenten su mano de obra disponible."
 SAU_fsa_send_cash: "Fondos Wire para el Ejército Sirio Libre"
 SAU_fsa_send_cash_desc: "Establecer un canal de financiación encubierto para los salarios, adquisiciones y organización política del Ejército Libre Sirio."
 SAU_fsa_smuggle_weapons: "Contrabandear armas a los rebeldes"
 SAU_fsa_smuggle_weapons_desc: "Hacer pasar armas ligeras por Jordania para reforzar al Ejército Libre Sirio contra el gobierno sirio."
 SAU_heir_mbn_maneuver: "El Príncipe Heredero Manoeuvres"
 SAU_heir_mbn_maneuver_desc: "Use la autoridad del Ministerio del Interior de Mohammed bin Nayef, registros de seguridad y reputación antiterrorista para fortalecer su sucesión."
 SAU_heir_mbs_maneuver: "El joven príncipe Manoeuvres"
 SAU_heir_mbs_maneuver_desc: "Transferir carteras adicionales a Mohammed bin Salman y eliminar funcionarios que se oponen a su reclamación de sucesión."
 SAU_heir_rally_support: "Reunir apoyo para el heredero"
 SAU_heir_rally_support_desc: "Reunirse con príncipes veteranos e informar a editores influyentes para forjar apoyo al heredero elegido antes de que se anuncie formalmente la sucesión."
 SAU_heir_undermine_mbn: "Mohammed bin Nayef"
 SAU_heir_undermine_mbn_desc: "Hacer circular inquietudes sobre la salud, la resistencia y la estrecha relación de Mohammed bin Nayef con Estados Unidos para debilitar su apoyo en la corte."
 SAU_heir_undermine_mbs: "Mohammed bin Salman"
 SAU_heir_undermine_mbs_desc: "Destacar la conducción de Mohammed bin Salman de la guerra de Yemen, su alto gasto y sus disputas con príncipes veteranos para debilitar su apoyo en la corte."
 SAU_houthi_break_ceasefire: "Romper el alto el fuego saudí"
 SAU_houthi_break_ceasefire_desc: "Las armas del Reino han caído en silencio, pero la guerra no es ganada. Incrementar la cesación del fuego y renovar la ofensiva contra los saudíes."
 SAU_if_cross_border_raid: "Cross-Border Raid"
 SAU_if_cross_border_raid_desc: "Lanzar una incursión armada para atacar depósitos y puestos militares israelíes. La opción más audaz y la que más probablemente provoque una respuesta feroz."
 SAU_if_rocket_barrage: "Descarga de cohetes sobre poblaciones israelíes"
 SAU_if_rocket_barrage_desc: "Ordenar al Frente lanzar cohetes contra poblaciones israelíes, para trastocar la economía y obligar a la población a refugiarse."
 SAU_if_suicide_bombing: "Lanzar una campaña de bombardeos"
 SAU_if_suicide_bombing_desc: "Ordenar a las células del Frente llevar a cabo atentados suicidas en ciudades israelíes, para reducir la moral pública y aumentar los costos de seguridad de Israel."
 SAU_intel_counterintel_sweep: "Lucha contra la inteligencia"
 SAU_intel_counterintel_sweep_desc: "El GIP gira hacia dentro por una temporada - casas seguras enrolladas, clerks cipher rotaron, y cada manejador extranjero en el Reino dado una razón para ir tranquilo.\n\n§GSuprime la subversión extranjera y endurece nuestros cifradores durante 90 días§!, y deja a la comunidad de inteligencia complacida cuando termina.\n\n§YRepetitable§! - un barrido sostiene sólo siempre y cuando lo sigas ejecutando."
 SAU_intel_counterterror: "Dirección de Lucha contra el Terrorismo"
 SAU_intel_counterterror_desc: "Coordinar incursiones y operaciones de inteligencia contra células de Al Qaeda y yihadistas. La represión refuerza la estabilidad, une a la Casa de Saud tras la GIP y golpea directamente a cualquier combatiente extranjero que opere en el Reino."
 SAU_intel_expand_gip: "Ampliar la Presidencia General de Inteligencia"
 SAU_intel_expand_gip_desc: "Nuevas estaciones, nueva cobertura, nuevas promociones de formación. La Presidencia no recluta a un hombre y se detiene: construye un lugar donde ponerlo.\n\n§GAñade de forma permanente una ranura de operativo§!, de modo que el Reino pueda mantener a otro oficial en el campo para siempre.\n\n§YRepetible hasta 3 veces.§!"
 SAU_intel_foreign_stations: "Red de estaciones extranjeras"
 SAU_intel_foreign_stations_desc: "Abrir estaciones de la GIP en el extranjero para hacer retroceder la influencia iraní y extender el alcance saudí por la región."
 SAU_intel_mabahith: "Fortalecer el Mabahith"
 SAU_intel_mabahith_desc: "Ampliar la vigilancia y las operaciones de la Mabahith contra la disidencia interna. Un mayor control interno mejora la estabilidad y el apoyo del establishment religioso."
 SAU_intel_surveillance_tech: "Adquirir tecnología avanzada de vigilancia"
 SAU_intel_surveillance_tech_desc: "En lugar de esperar a los ingenieros propios del Reino, la GIP compra los sistemas de monitoreo y análisis de datos por completo y hace que los contratistas extranjeros los instalen.\n\n§GInstala de inmediato los computadores de la Agencia§!, §Ysin la investigación ni el trabajo previo departamental que la agencia exigiría normalmente§!.\n\n§RPagas por el atajo§!: más caro que construirlo tú mismo, y disponible una sola vez."
 SAU_Intelligence_category: "§G Presidencia de Inteligencia General§!"
 SAU_islamic_rivalry_close: "Suspendieron la campaña contra Irán"
 SAU_islamic_rivalry_close_desc: "Desactivar discretamente la campaña. Cierra las decisiones de la Rivalidad Islámica hasta que se reabran."
 SAU_islamic_rivalry_open: "Abrir la campaña contra Irán"
 SAU_islamic_rivalry_open_desc: "Poner el aparato del Reino a trabajar contra Teherán. Abre las decisiones de la Rivalidad Islámica."
 SAU_isr_talks_backchannel: "Abra el backchannel"
 SAU_isr_talks_backchannel_desc: "Use intermediarios en terceros países para identificar términos que Israel podría aceptar antes de que el gobierno inicie negociaciones públicas."
 SAU_isr_talks_clock: "Concluir las conversaciones con Israel"
 SAU_isr_talks_clock_desc: "Desde el momento en que Israel acepta hablar, el plazo es de 120 días. Israel debe aceptar la Iniciativa de Paz Árabe y al menos otra vía antes de que la paciencia, la política y los enemigos de la región lo cierren."
 SAU_isr_talks_palestine: "Ofrecer la Iniciativa de Paz Árabe"
 SAU_isr_talks_palestine_desc: "Poner por escrito sobre la mesa la iniciativa de 2002: plena normalización con el mundo árabe a cambio de un Estado palestino independiente en las líneas de 1967."
 SAU_isr_talks_sweeten: "Endulzar el trato"
 SAU_isr_talks_sweeten_desc: "Ofrecer inversión, cielos abiertos y acceso al mercado del Golfo como incentivos económicos para un acuerdo."
 SAU_isr_talks_us_mediation: "Trae a Washington."
 SAU_isr_talks_us_mediation_desc: "Pedir a Estados Unidos que garantice las conversaciones y use su influencia con Israel para respaldar un acuerdo."
 SAU_junta_address_the_nation: "La Nación"
 SAU_junta_address_the_nation_desc: "Hacer que un alto miembro del Consejo dé un discurso televisado que explique el nuevo gobierno y su programa. El discurso tranquilizará a parte del público de que el Estado sigue bajo control efectivo."
 SAU_junta_category: "El Consejo Militar Supremo"
 SAU_junta_control_readout: "§HControl§! §W [?SAU_junta_control|0]§!"
 SAU_junta_control_readout_desc: "El Control mide la capacidad del Consejo para hacer cumplir sus órdenes mediante guarniciones, puestos de control, expedientes de inteligencia y personal leal. Baja uno cada mes y los programas temporales del Consejo gastan Control adicional al lanzarse."
 SAU_junta_legitimacy_crisis: "El Consejo debe responder por sí mismo."
 SAU_junta_legitimacy_crisis_desc: "El Consejo ha perdido su Legitimación restante, y el apoyo de clérigos y autoridades provinciales está empezando a colapsar. Tiene seis meses para establecerse con los oficiales, atender las demandas tribales y restaurar su posición a §H20§!.\n\n§R Si pasan ciento ochenta días sin cumplir ese umbral, el Reino entrará en conflicto abierto.§!"
 SAU_junta_legitimacy_readout: "§HLegitimación§! §W [?SAU_junta_legitimacy|0]§!"
 SAU_junta_legitimacy_readout_desc: "La Legitimidad mide la aceptación de un Consejo que no tiene detrás elecciones, fatwa ni sucesión legal. Baja uno cada mes, y al llegar a cero el Consejo tiene 180 días para recuperarla a 20."
 SAU_junta_reinforce_garrisons: "Reforzar las guarnición"
 SAU_junta_reinforce_garrisons_desc: "Desplegar batallones adicionales en las capitales provinciales, dotar por completo los puestos de control y restablecer las comunicaciones militares entre Riad y las guarniciones."
 SAU_junta_standing_readout: "§HPosición§! [ROOT.GetSAUJuntaStanding]"
 SAU_junta_standing_readout_desc: "[ROOT.GetSAUJuntaStandingEffect]"
 SAU_junta_tour_the_provinces: "Recorre las Provincias"
 SAU_junta_tour_the_provinces_desc: "Enviar representantes del Consejo a reunirse con líderes locales en Buraydah, Yeda, Yazán y el interior. Escuchar agravios y financiar peticiones locales mejorará el apoyo provincial."
 SAU_king_abdullah_category: "Rey Abdullah bin Abdulaziz"
 SAU_king_mbn_category: "Rey Mohammed bin Nayef"
 SAU_king_mbs_category: "Rey Mohammed bin Salman"
 SAU_king_mutaib_category: "Rey Mutaib bin Abdullah"
 SAU_king_salman_category: "Rey Salman bin Abdulaziz"
 SAU_mbn_border_surveillance: "Fortificar las redes de vigilancia de la guardia fronteriza"
 SAU_mbn_border_surveillance_desc: "Instalar torres, vallas de sensores y cámaras térmicas a lo largo de las fronteras con Yemen e Irak para mejorar la detección de cruces no autorizados."
 SAU_mbn_mabahith_campaign: "Autorizar la campaña de contrasubversión de la Mabahith"
 SAU_mbn_mabahith_campaign_desc: "Autorizar a la Dirección General de Investigación a desmantelar presuntas redes subversivas en todo el Reino. La campaña también detendrá a algunas personas cuya implicación es incierta."
 SAU_mbn_maneuver: "Maniobras de la facción de Bin Nayef"
 SAU_mbn_maneuver_desc: "Los servicios de seguridad trabajan para adelantar la demanda de Mohammed bin Nayef, y puede volver a la corte contra su propio candidato."
 SAU_mbn_rehabilitation_center: "Activar el Centro de Rehabilitación Príncipe Nayef"
 SAU_mbn_rehabilitation_center_desc: "Colocar a los detenidos en un programa de rehabilitación con clérigos, psicólogos y sus familias. El programa puede reducir la reincidencia, aunque algunos participantes volverán a la actividad militante."
 SAU_mbn_special_security_forces: "Desplegar a las Fuerzas Especiales de Seguridad del Ministerio del Interior"
 SAU_mbn_special_security_forces_desc: "Desplegar a las Fuerzas Especiales de Seguridad del Ministerio del Interior en las grandes ciudades, para dar al ministro una fuerza armada independiente del ejército regular."
 SAU_mbn_western_intel_networks: "Activar las redes conjuntas de inteligencia occidentales"
 SAU_mbn_western_intel_networks_desc: "Ampliar el enlace de inteligencia entre Riad, la CIA y los servicios británicos. Arabia Saudí compartirá información sensible a cambio de un mejor acceso a la inteligencia occidental."
 SAU_mbs_anticorruption_drive: "Ejecutar la campaña anticorrupción"
 SAU_mbs_anticorruption_drive_desc: "Detener a príncipes y empresarios en un hotel de lujo y exigir acuerdos financieros con el Estado. Esto devuelve fondos al tesoro y demuestra el control del Príncipe Heredero sobre la élite."
 SAU_mbs_aramco_liquidity: "Asignación de liquidez estratégica de Aramco"
 SAU_mbs_aramco_liquidity_desc: "Transferir parte del capital disponible de Aramco a programas controlados por el Príncipe Heredero, limitando el papel de la junta en la decisión."
 SAU_mbs_gami_localization: "Movilizar la localización de defensa de la GAMI"
 SAU_mbs_gami_localization_desc: "Exigir a los contratistas de defensa extranjeros que gasten la mitad de la financiación de adquisiciones dentro del Reino o pierdan el acceso a los contratos saudíes."
 SAU_mbs_pif_neom: "Asignar fondos del PIF a NEOM y a proyectos de frontera"
 SAU_mbs_pif_neom_desc: "Asignar capital del Fondo de Inversión Pública a los proyectos de la ciudad lineal, el puerto y el complejo de montaña de NEOM, pese a sus altos riesgos técnicos y financieros."
 SAU_mbs_vision2030_blitz: "Lanzar el blitz de campaña Visión 2030"
 SAU_mbs_vision2030_blitz_desc: "Lanzar una campaña coordinada de publicidad y conferencias para forjar apoyo público e institucional a Visión 2030."
 SAU_military_category: "§H Modernización de las fuerzas armadas§!"
 SAU_militia_back_dflp: "Financiar el Frente Democrático"
 SAU_militia_back_dflp_desc: "Financiar a facciones palestinas laicas como contrapeso a movimientos rivales y aumentar la influencia saudí dentro de la política palestina."
 SAU_militia_back_hamas: "Bankroll Hamas"
 SAU_militia_back_hamas_desc: "Proporcionar a Hamás dinero, armas y reclutas a cambio de un mayor alineamiento con Riad en lugar de Teherán."
 SAU_militia_islamic_front: "Forjar un Frente Islámico leal a Arabia Saudí"
 SAU_militia_islamic_front_desc: "Crear y financiar una nueva facción islamista cuya organización y mando sigan dependiendo del apoyo saudí."
 SAU_mod_abrams_gunnery: "Programa de artillería Abrams"
 SAU_mod_abrams_gunnery_desc: "Ejecutar el programa para elegir cómo combate esta parte de las fuerzas armadas.\n\n§YSe abre con:§! Tanque de batalla principal M1A2 Abrams.\n§GAbre una elección de tres doctrinas§!, cada una con una fortaleza y un inconveniente. Vuelve a ejecutarlo luego para §Ycambiar§!. §H[Reforma de la Etapa I: termina las tres reformas de la Etapa I para desbloquear la Etapa II.]§!"
 SAU_mod_apache_training: "Entrenamiento de naves apaches"
 SAU_mod_apache_training_desc: "Ejecutar el programa para elegir cómo combate esta parte de las fuerzas armadas.\n\n§YSe abre con:§! Aviación del Ejército y helicópteros artillados Apache.\n§GAbre una elección de tres doctrinas§!, cada una con una fortaleza y un inconveniente. Vuelve a ejecutarlo luego para §Ycambiar§!. §H[Reforma de la Etapa II: termina las tres reformas de la Etapa II para desbloquear la Etapa III.]§!"
 SAU_mod_artillery_livefire: "Ejercicio de Artillería en Vivo-Fire"
 SAU_mod_artillery_livefire_desc: "Ejecutar el programa para elegir cómo combate esta parte de las fuerzas armadas.\n\n§YSe abre con:§! Artillería autopropulsada M109.\n§GAbre una elección de tres doctrinas§!, cada una con una fortaleza y un inconveniente. Vuelve a ejecutarlo luego para §Ycambiar§!. §H[Reforma de la Etapa II: termina las tres reformas de la Etapa II para desbloquear la Etapa III.]§!"
 SAU_mod_awacs_battle: "Entrenamiento de gestión de combate AWACS"
 SAU_mod_awacs_battle_desc: "Ejecutar el programa para elegir cómo combate esta parte de las fuerzas armadas.\n\n§YSe abre con:§! AWACS E-3 Sentry.\n§GAbre una elección de tres doctrinas§!, cada una con una fortaleza y un inconveniente. Vuelve a ejecutarlo luego para §Ycambiar§!. §H[Reforma de la Etapa III: el último lote.]§!"
 SAU_mod_complete: "Etapa III: Alcanzar una fuerza totalmente moderna"
 SAU_mod_complete_desc: "§HEstadio III de III - una fuerza totalmente moderna.§!\n\n§REsto permanece bloqueado hasta completar las tres reformas de la Etapa II:§!\n §Y- Ejercicio de Artillería en Vivo\n - Entrenamiento de naves apaches\n - Ejercicio de la Flota Combinada§!\n(Pulse una doctrina en cada uno).\n\n§GLo que sucede:§! las fuerzas armadas llegan a §G Totalmente Modernizadas§! - un verdadero contrapeso para Irán - y las reformas finales aparecen: §YFuerzas Especiales, AWACS y Precisión Strike§!. Fuegos una vez."
 SAU_mod_construction: "Patrocinador Industrial Construcción"
 SAU_mod_construction_desc: "Financiar nuevas fábricas y carreteras en la Provincia Oriental para ampliar la capacidad industrial en la principal región productora de petróleo."
 SAU_mod_devfund: "Capitalizar el Fondo de Desarrollo"
 SAU_mod_devfund_desc: "Dotar al fondo nacional de desarrollo para abrir nueva capacidad de construcción en la Provincia Oriental."
 SAU_mod_fleet_exercise: "Ejercicio combinado de la flota"
 SAU_mod_fleet_exercise_desc: "Ejecutar el programa para elegir cómo combate esta parte de las fuerzas armadas.\n\n§YSe abre con:§! Las Reales Fuerzas Navales Saudíes.\n§GAbre una elección de tres doctrinas§!, cada una con una fortaleza y un inconveniente. Vuelve a ejecutarlo luego para §Ycambiar§!. §H[Reforma de la Etapa II: termina las tres reformas de la Etapa II para desbloquear la Etapa III.]§!"
 SAU_mod_gulf_lessons: "Juegos de Guerra: Lecciones del Golfo"
 SAU_mod_gulf_lessons_desc: "Establezca un ejercicio importante para poner a prueba al ejército contra las duras lecciones de 1991 y decida qué modelo para reconstruirlo.\n\n§YSe abre con:§! Lecciones de la Guerra del Golfo.\n§G Abre una selección de cuatro doctrinas §! - americana, GCC, OTAN o doméstica - cada una con sus propias fortalezas y un inconveniente. Ejecute los juegos de guerra más tarde a §Yswitch doctrina§!."
 SAU_mod_modernize: "Etapa II: Modernizar las armas de combate"
 SAU_mod_modernize_desc: "§HStage II de III - reequipamiento de las armas de combate.§!\n\n§REsto permanece encerrado hasta que completes las tres reformas de la etapa I:§!\n §Y- Guardia Nacional Lecturas\n - Programa Abrams Gunnery\n - entrenamiento de combate contra el aire en la bandera roja§!\n(Pulse una doctrina en cada uno).\n\n§GLo que sucede:§! las fuerzas armadas van de §YEn Reforma§! a §YModernización§!, y aparecen tres nuevas reformas - §YArtillería, Apache y la Flota Combinada§!. Usted debe completar los tres antes §YStage III§! se desbloqueará. Fuegos una vez."
 SAU_mod_pgm_doctrine: "Curso de doctrina de ataque de precisión"
 SAU_mod_pgm_doctrine_desc: "Ejecutar el programa para elegir cómo combate esta parte de las fuerzas armadas.\n\n§YSe abre con:§! Municiones de guiado de precisión.\n§GAbre una elección de tres doctrinas§!, cada una con una fortaleza y un inconveniente. Vuelve a ejecutarlo luego para §Ycambiar§!. §H[Reforma de la Etapa III: el último lote.]§!"
 SAU_mod_red_flag: "Entrenamiento de combate aéreo Red Flag"
 SAU_mod_red_flag_desc: "Ejecutar el programa para elegir cómo combate esta parte de las fuerzas armadas.\n\n§YSe abre con:§! La Real Fuerza Aérea Saudí.\n§GAbre una elección de tres doctrinas§!, cada una con una fortaleza y un inconveniente. Vuelve a ejecutarlo luego para §Ycambiar§!. §H[Reforma de la Etapa I: termina las tres reformas de la Etapa I para desbloquear la Etapa II.]§!"
 SAU_mod_reform: "Etapa I: Lanzamiento del Programa de Reforma"
 SAU_mod_reform_desc: "§HStage I de III - la primera fase de modernización.§!\n\n§GPara ejecutarlo:§! completar el enfoque §YEl Estado Mayor§!, luego ganar los §Y Juegos de Guerra: Lecciones del Golfo§! (elegir una doctrina de la guerra del Golfo).\n\n§GQué sucede:§! las fuerzas armadas van de §RUnmodernized§! a §YEn la Reforma§!, y aparecen tres nuevas reformas - §YGuardia Nacional, Abrams Gunnery and Red Flag§!.\n\n§RImportante:§! entonces debe completar §R los tres§! de esas reformas antes de §YStage II§! se desbloqueará. Fuegos una vez."
 SAU_mod_sang_drills: "Ejercicios de preparación de la Guardia Nacional"
 SAU_mod_sang_drills_desc: "Ejecutar el programa para elegir cómo combate esta parte de las fuerzas armadas.\n\n§YSe abre con:§! Guardia Nacional de Arabia Saudí.\n§GAbre una elección de tres doctrinas§!, cada una con una fortaleza y un inconveniente. Vuelve a ejecutarlo luego para §Ycambiar§!. §H[Reforma de la Etapa I: termina las tres reformas de la Etapa I para desbloquear la Etapa II.]§!"
 SAU_mod_sf_selection: "Curso de Selección de Fuerzas Especiales"
 SAU_mod_sf_selection_desc: "Ejecutar el programa para elegir cómo combate esta parte de las fuerzas armadas.\n\n§YSe abre con:§! Mando de Fuerzas Especiales.\n§GAbre una elección de tres doctrinas§!, cada una con una fortaleza y un inconveniente. Vuelve a ejecutarlo luego para §Ycambiar§!. §H[Reforma de la Etapa III: el último lote.]§!"
 SAU_mod_workforce: "Capacitar a la fuerza de trabajo nacional"
 SAU_mod_workforce_desc: "Los programas profesionales ponen a más saudíes en trabajos cualificados, estableciéndose la sociedad y la moral nacional."
 SAU_mutaib_capital_garrison: "Fortificar la red de guarnición de la capital"
 SAU_mutaib_capital_garrison_desc: "Establecer puestos de control de la Guardia Nacional, posiciones blindadas y comunicaciones independientes alrededor de Riad. Esto protege la capital a la vez que refuerza el control de la Guardia sobre ella."
 SAU_mutaib_janadriyah_festival: "Acoger el Festival Nacional del Patrimonio de Janadriyah"
 SAU_mutaib_janadriyah_festival_desc: "Hacer que la Guardia Nacional organice el festival de Janadriyah con carreras de camellos, danza de espadas, poesía y ceremonias tribales televisadas. El evento refuerza los lazos de Mutaib con los líderes tribales."
 SAU_mutaib_maneuver: "Maniobras de Facción de Mutaib"
 SAU_mutaib_maneuver_desc: "El Guardia Nacional trabaja para adelantar la demanda de Mutaib, y puede volver a la corte contra su propio candidato."
 SAU_mutaib_sang_logistics: "Gestión logística autónoma de la SANG"
 SAU_mutaib_sang_logistics_desc: "Crear un sistema de suministro independiente para la Guardia Nacional en lugar de depender de los depósitos del ejército regular. La autonomía logística aumenta la independencia operativa y política de la Guardia."
 SAU_mutaib_sang_procurement: "Acelerar las adquisiciones de aviación y blindados de la SANG"
 SAU_mutaib_sang_procurement_desc: "Priorizar helicópteros Apache y vehículos blindados para la Guardia Nacional antes que los pedidos del ejército regular, incluido un componente de aviación independiente de la Guardia."
 SAU_mutaib_tribal_reserves: "Movilizar las reservas tribales de la SANG"
 SAU_mutaib_tribal_reserves_desc: "Pedir a los jeques tribales que aporten personal de reserva remunerado a la Guardia Nacional bajo el sistema de levas establecido."
 SAU_officer_crisis_category: "La pelea de los oficiales"
 SAU_officer_grievance_readout: "El Cuerpo de Oficiales: [ROOT.GetSAUArmyGrievance]"
 SAU_officer_grievance_readout_desc: "§HGrievance§!: §Y [?SAU_army_grievance|0]§! de §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n\nEsta entrada muestra el nivel actual de reclamación y no tiene efecto de decisión."
 SAU_officers_pay_arrears: "Paga a los Arreares"
 SAU_officers_pay_arrears_desc: "Pagar once meses de asignaciones, suplementos de vivienda y salarios atrasados en una única transferencia retroactiva. Esto da un alivio temporal sin resolver la causa del agravio de los oficiales.\n\n§G-20 de agravio§!, §R-$12 mil millones§!, repetible cada 60 días."
 SAU_officers_promote_colonels: "Promover los Coroneles"
 SAU_officers_promote_colonels_desc: "Dar mandos de brigada a oficiales de carrera con experiencia en lugar de reservarlos para los príncipes. El cambio mejorará la confianza del cuerpo en el ascenso por mérito.\n\n§G-15 de agravio§!, §G+2% de estabilidad§!, repetible cada 90 días."
 SAU_officers_restore_defence_budget: "Restaurar el presupuesto de defensa"
 SAU_officers_restore_defence_budget_desc: "Restaurar la financiación recortada a las fuerzas regulares y trasladar el costo al presupuesto de la Guardia Nacional. Esto atiende la causa principal del agravio de los oficiales.\n\n§G-25 de agravio§!, §R-$25 mil millones§!, y la Guardia deja de estar protegida de modo que el agravio sube a la mitad de ritmo; solo puede hacerse una vez."
 SAU_officers_settle_for_good: "Llegar a un arreglo con los oficiales"
 SAU_officers_settle_for_good_desc: "Establecer una comisión elegida por los oficiales, publicar un calendario de ascensos y hacer que el Rey respalde personalmente el acuerdo. Solo puede completarse una vez eliminados todos los agravios pendientes.\n\n§GTermina la crisis de forma permanente y evita un golpe§!; requiere un agravio en §Y0§!."
 SAU_oil_conserve: "Conservar las Reservas"
 SAU_oil_conserve_desc: "Reducir la producción para preservar reservas para uso futuro. Esto sacrifica ingresos actuales pero §Greduce la dependencia de la economía del petróleo§! y mejora la estabilidad."
 SAU_oil_embargo: "Proclamar un embargo petrolero"
 SAU_oil_embargo_desc: "Repetir la política de §H1973§! poniendo fin a las exportaciones de petróleo al §LOccidente y los amigos de Israel§!, en concreto a §LEstados Unidos, Gran Bretaña, Francia, Alemania y los Países Bajos§!. Sus economías sufrirán el choque de suministro, mientras que Arabia Saudí gana apoyo en los países árabes y musulmanes.\n\nEl Reino pierde ingresos de exportación occidentales y daña las relaciones con Washington, pero gana §Hprestigio, unidad y la bendición del clero§!."
 SAU_oil_increase_output: "Aumento de la producción de petróleo"
 SAU_oil_increase_output_desc: "Aumentar la producción de crudo en la Provincia Oriental para §Gmás petróleo e ingresos inmediatos§!. Esto también hace a la economía §Rmás dependiente§! de las exportaciones de petróleo."
 SAU_oil_new_field: "Desarrollar un nuevo yacimiento petrolero"
 SAU_oil_new_field_desc: "Financiar la exploración y nuevos pozos en el Barrio Vacío. El proyecto suma un gran §Gyacimiento petrolero§! pero aumenta la dependencia del Reino del petróleo."
 SAU_oil_new_field_tt: "§GUn nuevo campo es probado§! - §Y+15 petróleo§! aparece en una de las provincias del Reino, a un costo de §R $150 mil millones§!"
 SAU_opec_cut_production: "Producción de aceite de corte"
 SAU_opec_cut_production_desc: "Utilizar el papel de Arabia Saudita como productor oscilante de la OPEP para reducir la producción y §G aumentar el precio mundial del petróleo§!, aumentando los ingresos por barril. Usable cada 180 días."
 SAU_opec_flood_market: "Inundar el mercado del petróleo"
 SAU_opec_flood_market_desc: "Aumentar la producción lo suficiente para §Rbajar el precio mundial del petróleo§!. Arabia Saudí pierde ingresos a corto plazo, pero los exportadores competidores (§LRusia, Irán, Irak, Venezuela§!) sufren mayores pérdidas económicas. Utilizable una vez al año."
 SAU_operation_decisive_storm: "Operación Tormenta Decisiva (Amaliyat Asifat al-Hazm)"
 SAU_operation_decisive_storm_desc: "Lanzar §YAmaliyat Asifat al-Hazm§!, la campaña aérea de la coalición contra el territorio en manos de los hutíes en Yemen. La aviación saudí atacará posiciones hutíes, protegerá a las fuerzas del gobierno y desbloqueará un apoyo continuado al ejército yemení."
 SAU_pal_aid_package: "Paquete de ayuda palestina"
 SAU_pal_aid_package_desc: "Proporcionar financiación trimestral saudí para los salarios, hospitales, servicios y la reconstrucción de la Autoridad Palestina en Ramala."
 SAU_pal_fund_development: "Fondo para el Desarrollo Palestino"
 SAU_pal_fund_development_desc: "Financiar carreteras, escuelas y clínicas en los territorios palestinos para mejorar las condiciones de vida y apoyar un arreglo viable de dos Estados."
 SAU_pal_invest_gaza: "Invertir en Gaza y Cisjordania"
 SAU_pal_invest_gaza_desc: "Invertir en fábricas e infraestructura en Gaza y Cisjordania para crear empleo y reducir el apoyo a los grupos militantes."
 SAU_pc_convene: "Convocar el Consejo del Pueblo"
 SAU_pc_convene_desc: "Convocar la cámara y dar a cualquier bloque con suficientes escaños tres semanas para presentar un proyecto de ley. Una vez presentado, el Rey debe ratificarlo o vetarlo; la ratificación fortalece al bloque patrocinador, mientras que el veto lo debilita.\n\nRepetible cada 90 días."
 SAU_pc_convene_tt: "Abre el pleno: un bloque con §Y21+ escaños§! puede presentar un proyecto de ley en §Y21 días§!"
 SAU_pc_dissolve: "Disolver el Consejo del Pueblo"
 SAU_pc_dissolve_desc: "Disolver el Consejo del Pueblo por decreto real sin fecha fijada para su regreso.\n\n§R-10% de estabilidad, -8% de apoyo a la guerra§!, §G+150 de poder político§!. No puede deshacerse."
 SAU_pc_enact_provincial: "Promulgar el proyecto de ley de los provinciales"
 SAU_pc_enact_provincial_desc: "Aplicar las cuotas saudíes de contratación ratificadas, la reforma del patrocinio y la inspección independiente pese a la oposición de los grandes intereses mercantiles.\n\n§HPrestigio§! mide la autoridad pública del Consejo del Pueblo; §Gsube§! cuando se oye y se promulga un proyecto de ley y §Rbaja§! tras un veto, una negligencia o un proyecto caducado. Por debajo de §Y40§!, el Consejo no puede sacar adelante un proyecto en los ministerios."
 SAU_pc_enact_provincial_tt: "Necesita §Y300 de poder político§!, y el Consejo debe seguir respaldando el proyecto: su §Hprestigio§! por encima de §Y40§! (ahora §Y[?SAU_pc_standing|0]§! de §Y100§!)"
 SAU_pc_enact_reformist: "Promulgar el proyecto de ley de los reformistas"
 SAU_pc_enact_reformist_desc: "Aplicar el proyecto de ley reformista ratificado encargando a los ministerios preparar sus reglamentos, calendarios y presupuesto.\n\n§HPrestigio§! mide la autoridad pública del Consejo del Pueblo; §Gsube§! cuando se oye y se promulga un proyecto de ley y §Rbaja§! tras un veto, una negligencia o un proyecto caducado. Por debajo de §Y40§!, el Consejo no puede sacar adelante un proyecto en los ministerios."
 SAU_pc_enact_reformist_tt: "Necesita §Y300 de poder político§!, y el Consejo debe seguir respaldando el proyecto: su §Hprestigio§! por encima de §Y40§! (ahora §Y[?SAU_pc_standing|0]§! de §Y100§!)"
 SAU_pc_enact_traditionalist: "Promulgar el proyecto de ley de los tradicionalistas"
 SAU_pc_enact_traditionalist_desc: "Aplicar el programa ratificado de dotaciones religiosas, subsidios de vivienda y clínicas provinciales a través de los ministerios responsables.\n\n§HPrestigio§! mide la autoridad pública del Consejo del Pueblo; §Gsube§! cuando se oye y se promulga un proyecto de ley y §Rbaja§! tras un veto, una negligencia o un proyecto caducado. Por debajo de §Y40§!, el Consejo no puede sacar adelante un proyecto en los ministerios."
 SAU_pc_enact_traditionalist_tt: "Necesita §Y300 de poder político§!, y el Consejo debe seguir respaldando el proyecto: su §Hprestigio§! por encima de §Y40§! (ahora §Y[?SAU_pc_standing|0]§! de §Y100§!)"
 SAU_pc_public_works: "Comisión de Obras Públicas"
 SAU_pc_public_works_desc: "El Consejo selecciona una provincia y fija un estándar de §Y[?SAU_pc_req_civ|0]§! fábricas civiles, §Y[?SAU_pc_req_off|0]§! oficinas y §Y[?SAU_pc_req_inf|0]§! de infraestructura que el gobierno debe cumplir sin construcción gratuita; el estándar sube tras cada mandato exitoso. §HDos años para cumplir§!: el éxito da a la provincia §G+1 ranura de edificio permanente, +10% de velocidad de construcción y +5% de mano de obra§!, mientras que el fracaso §Rabandona las obras y quita una fábrica civil§!. §YRequiere§! un prestigio del Consejo de §G60 o más§!; costo: §R-$4 mil millones§!."
 SAU_pc_readout: "Consejo Popular: [ROOT.GetSAUPCBloc]"
 SAU_pc_readout_desc: "§HEl Consejo Popular§! - [ROOT.GetSAUPCBloc], [ROOT.GetSAUPCStanding] (§Y[?SAU_pc_standing|0]§! de §Y100§!)\n§YReformistas§!: [?SAU_pc_reformists|0] §YTradicionalistas§!: [?SAU_pc_traditionalists|0] §YProvinciales§!: [?SAU_pc_provincials|0]\n§H vetos reales utilizados§!: §Y[?SAU_pc_vetoes|0]§!\n\n§HStanding§! mide la autoridad pública; §Grisas§! cuando se escucha y promulga un proyecto de ley, §R cae §! después de un veto, negligencia o una medida vencida, y debe permanecer en §Y40+§! para llevar un proyecto de ley a través de los ministerios o §Y60+§! para encargar obras públicas. Esta entrada es informativa y no tiene efecto de decisión."
 SAU_pc_session_clock: "El Consejo espera una respuesta"
 SAU_pc_session_clock_desc: "El Consejo se ha reunido, y un bloque calificador tiene tres semanas para presentar un proyecto de ley antes de que el período de sesiones expire sin respuesta."
 SAU_pc_take_provincial_bill: "Oír a los Provinciales"
 SAU_pc_take_provincial_bill_desc: "Permitir que el bloque provincial presente un proyecto de ley que establezca cuotas saudíes de contratación, reforme el sistema de patrocinio y cree una inspección laboral independiente."
 SAU_pc_take_reformist_bill: "Oír a los reformistas"
 SAU_pc_take_reformist_bill_desc: "Permitir que el bloque reformista de abogados jóvenes y graduados que regresan presente un proyecto de ley centrado en el desempeño del gobierno y la reforma institucional."
 SAU_pc_take_traditionalist_bill: "Oír a los Tradicionales"
 SAU_pc_take_traditionalist_bill_desc: "Permitir que el bloque tradicionalista presente un proyecto de ley que financie dotaciones religiosas, subsidios de vivienda y clínicas en provincias desatendidas."
 SAU_pc_works_mandate: "Mandato del Consejo: [SAU_pc_works_province.GetName]"
 SAU_pc_works_mandate_desc: "El Consejo ha seleccionado [SAU_pc_works_province.GetName], y el gobierno tiene dos años para cumplir con su estándar de desarrollo publicado. Ninguna construcción se proporciona automáticamente.\n\nEl estándar requerido es §Y[?SAU_pc_req_civ|0]§! fábricas civiles, §Y[?SAU_pc_req_off|0]§! oficinas, y §Y[?SAU_pc_req_inf|0]§! infraestructura en la provincia."
 SAU_pipeline_iraq: "El oleoducto europeo"
 SAU_pipeline_iraq_desc: "Tras la caída de Sadam, construir el tramo iraquí de un oleoducto hacia la frontera turca. Se necesitará un acuerdo aparte con Ankara antes de que el petróleo saudí pueda llegar a Europa."
 SAU_pipeline_iraq_talks: "Abrir conversaciones con Bagdad"
 SAU_pipeline_iraq_talks_desc: "Pedir al gobierno de Sadam que permita un oleoducto saudí a través de Irak pese a su hostilidad hacia la Casa de Saud. Es improbable que Bagdad acepte."
 SAU_pipeline_sabotage_category: "Sabotaje saudí Pipelines"
 SAU_pipeline_syria_assad: "Negociar el oleoducto del Levante"
 SAU_pipeline_syria_assad_desc: "Asegurar el tránsito por Jordania y luego negociar con el hostil gobierno de Asad un oleoducto por Siria hasta el Mediterráneo. Damasco exigirá a cambio cuantiosas tasas de tránsito y concesiones políticas."
 SAU_pipeline_syria_fsa: "El Levante Pipeline (Siria Libre)"
 SAU_pipeline_syria_fsa_desc: "Asegurar el tránsito por Jordania y luego ofrecer a un gobierno sirio amigo inversión saudí a cambio de una ruta de oleoducto hasta el Mediterráneo."
 SAU_pipeline_turkey_extend: "Extender el oleoducto a Turquía"
 SAU_pipeline_turkey_extend_desc: "Negociar con Ankara la extensión del oleoducto iraquí hasta Turquía y conectar el petróleo saudí directamente con los mercados europeos."
 SAU_pipeline_yemen: "La tubería del mar árabe"
 SAU_pipeline_yemen_desc: "Construir un oleoducto a través del sur amigo de Yemen y Al Mahrah hasta el Mar Arábigo. La línea sigue siendo vulnerable a interrupciones mientras continúe la guerra de Yemen."
 SAU_proj_alula: "Construye AlUla"
 SAU_proj_alula_desc: "El desarrollo de las antiguas tumbas nabatanas y oasis de AlUla en un destino cultural y patrimonial insignia. §Y(Cost: $50 billion, build ~450 days)§! §RDeadline: [?SAU_remain_alula|0] days left.§! §HContiene 5 fábricas civiles en construcción.§!"
 SAU_proj_amaala: "Construir Amaala"
 SAU_proj_amaala_desc: "Un enclave de turismo de bienestar y ultralujo en la costa noroccidental del Mar Rojo, la «Riviera de Oriente Medio». §Y(Costo: $50 mil millones, construcción ~450 días)§! §RPlazo: quedan [?SAU_remain_amaala|0] días.§! §HInmoviliza 5 fábricas civiles durante la construcción.§!"
 SAU_proj_diriyah: "Construir Diriyah"
 SAU_proj_diriyah_desc: "La restauración del lugar de nacimiento del Reino en un distrito histórico y cultural alrededor de la ciudad barrobrick de At-Turaif. §Y(Cost: $50 billion, build ~450 days)§! §RDeadline: [?SAU_remain_diriyah|0] days left.§! §HContiene 5 fábricas civiles en construcción.§!"
 SAU_proj_green_riyadh: "Construir Green Riyadh"
 SAU_proj_green_riyadh_desc: "Un programa para plantar millones de árboles en la capital, que refresque la ciudad y suavice el desierto. §Y(Costo: $30 mil millones, construcción ~365 días)§! §RPlazo: quedan [?SAU_remain_green_riyadh|0] días.§! §HInmoviliza 4 fábricas civiles durante la construcción.§!"
 SAU_proj_jeddah_central: "Construye Jeddah Central"
 SAU_proj_jeddah_central_desc: "El redesarrollo del paseo marítimo de Jeddah en un centro moderno, con un estadio, puerto deportivo y distrito cultural. §Y(Cost: $60 billion, build ~450 days)§! §RDeadline: [?SAU_remain_jeddah_central|0] days left.§! §HContiene 6 fábricas civiles en construcción.§!"
 SAU_proj_king_salman_park: "Construir el Parque Rey Salman"
 SAU_proj_king_salman_park_desc: "Desarrollar uno de los mayores parques urbanos del mundo en Riad. §Y(Costo: $40 mil millones, construcción ~270 días)§! §RPlazo: quedan [?SAU_remain_king_salman_park|0] días.§! §HInmoviliza 4 fábricas civiles durante la construcción.§!"
 SAU_proj_neom: "Construye NEOM"
 SAU_proj_neom_desc: "Desarrollar NEOM como la región urbana e industrial emblemática del Reino para la era posterior al petróleo, en la costa del Mar Rojo. §Y(Costo: $150 mil millones, construcción ~730 días)§! §RPlazo: quedan [?SAU_remain_neom|0] días.§! §HInmoviliza 10 fábricas civiles durante la construcción.§!"
 SAU_proj_new_murabba: "Construye nuevo Murabba"
 SAU_proj_new_murabba_desc: "Un nuevo centro para Riad construido en torno al Mukaab, una torre en forma de cubo tan vasta que alberga veinte Empire State Buildings. §Y(Costo: $100 mil millones, construcción ~730 días)§! §RPlazo: quedan [?SAU_remain_new_murabba|0] días.§! §HInmoviliza 10 fábricas civiles durante la construcción.§!"
 SAU_proj_oxagon: "Construye Oxagon"
 SAU_proj_oxagon_desc: "Construir un puerto flotante y un centro de manufactura en NEOM organizado en torno a la industria de energía limpia. §Y(Costo: $80 mil millones, construcción ~540 días)§! §RPlazo: quedan [?SAU_remain_oxagon|0] días.§! §HInmoviliza 8 fábricas civiles durante la construcción.§!"
 SAU_proj_qiddiya: "Construir Qiddiya"
 SAU_proj_qiddiya_desc: "Una megaciudad de entretenimiento, deporte y cultura a las afueras de Riad, con parques temáticos, estadios y un circuito de automovilismo. §Y(Costo: $80 mil millones, construcción ~540 días)§! §RPlazo: quedan [?SAU_remain_qiddiya|0] días.§! §HInmoviliza 8 fábricas civiles durante la construcción.§!"
 SAU_proj_red_sea: "Construir el Proyecto del Mar Rojo"
 SAU_proj_red_sea_desc: "Un destino turístico de ultralujo en docenas de islas prístinas, construido con una estricta norma ambiental. §Y(Costo: $80 mil millones, construcción ~540 días)§! §RPlazo: quedan [?SAU_remain_red_sea|0] días.§! §HInmoviliza 7 fábricas civiles durante la construcción.§!"
 SAU_proj_roshn: "Construye ROSHN"
 SAU_proj_roshn_desc: "El promotor nacional de vivienda construye comunidades integradas enteras para poner a millones de saudíes en hogares modernos. §Y(Cost: $60 billion, build ~365 days)§! §RDeadline: [?SAU_remain_roshn|0] days left.§! §HCuenta con 7 fábricas civiles mientras se están construyendo.§!"
 SAU_proj_sindalah: "Construye Sindalah"
 SAU_proj_sindalah_desc: "Desarrollar Sindalah como el destino de lujo de NEOM en una isla del Mar Rojo y su primer proyecto abierto a visitantes. §Y(Costo: $40 mil millones, construcción ~270 días)§! §RPlazo: quedan [?SAU_remain_sindalah|0] días.§! §HInmoviliza 4 fábricas civiles durante la construcción.§!"
 SAU_proj_soudah_peaks: "Construir Soudah Peaks"
 SAU_proj_soudah_peaks_desc: "Desarrollar un destino de turismo de montaña en las altas cumbres de Asir, aprovechando el clima más fresco y el paisaje verde de la región. §Y(Costo: $40 mil millones, construcción ~450 días)§! §RPlazo: quedan [?SAU_remain_soudah_peaks|0] días.§! §HInmoviliza 5 fábricas civiles durante la construcción.§!"
 SAU_proj_sports_blvd: "Construir Sports Boulevard"
 SAU_proj_sports_blvd_desc: "Un corredor recreativo de 135 kilómetros a través de Riad para ciclismo, carrera y equitación. §Y(Costo: $30 mil millones, construcción ~270 días)§! §RPlazo: quedan [?SAU_remain_sports_blvd|0] días.§! §HInmoviliza 4 fábricas civiles durante la construcción.§!"
 SAU_proj_the_line: "Construir la LÍNEA"
 SAU_proj_the_line_desc: "Construir THE LINE como una ciudad lineal sin coches de 170 kilómetros entre dos estructuras espejadas de 500 metros. §Y(Costo: $200 mil millones, construcción ~900 días)§! §RPlazo: quedan [?SAU_remain_the_line|0] días.§! §HInmoviliza 12 fábricas civiles durante la construcción.§!"
 SAU_proj_trojena: "Construir Trojena"
 SAU_proj_trojena_desc: "Un complejo de montaña abierto todo el año en las tierras altas de NEOM, con esquí al aire libre en el desierto árabe. §Y(Costo: $60 mil millones, construcción ~450 días)§! §RPlazo: quedan [?SAU_remain_trojena|0] días.§! §HInmoviliza 5 fábricas civiles durante la construcción.§!"
 SAU_rally_support: "Reunir apoyo para nuestro candidato"
 SAU_rally_support_desc: "Movilizar el clientelismo de la familia real, el establishment religioso y la prensa tras tu príncipe. La ganancia puede ser leve, sólida o un gran avance."
 SAU_repair_pipeline_iraq: "Ampliar el oleoducto a Europa"
 SAU_repair_pipeline_iraq_desc: "Subir un nivel el oleoducto troncal del norte: restaurar lo que destruyó el sabotaje o instalar la capacidad de bombeo adicional para llevar más crudo hacia Turquía."
 SAU_repair_pipeline_syria: "Ampliar el oleoducto del Levante"
 SAU_repair_pipeline_syria_desc: "Subir un nivel la línea del Mediterráneo: restaurar lo que destruyó el sabotaje o ensanchar el corredor por Amán y Damasco."
 SAU_repair_pipeline_yemen: "Ampliar el oleoducto del Mar Arábigo"
 SAU_repair_pipeline_yemen_desc: "Subir un nivel la línea del sur: restaurar lo que destruyó el sabotaje o instalar la capacidad adicional para llevar más crudo más allá de Ormuz."
 SAU_request_f15: "Solicitar el F-15 a Estados Unidos"
 SAU_request_f15_desc: "Abrir negociaciones con Washington para adquirir el F-15 Strike Eagle. Si los estadounidenses aceptan, se desbloqueará el enfoque §YF-15 Strike Eagle§!.\n\n§REsta es una elección excluyente:§! el primer proveedor en aceptar fija nuestro caza y los otros tres programas (§YTornado GR4§!, §YPanavia Tornado§! y §YEurofighter Typhoon§!) se cerrarán para siempre. Elige con cuidado."
 SAU_request_panavia: "Solicitar el Panavia Tornado a Italia"
 SAU_request_panavia_desc: "Acercarse a Roma por el Panavia Tornado IDS, el caza de ataque multinacional. Si los italianos aceptan, se desbloqueará el enfoque §YPanavia Tornado§!.\n\n§REsta es una elección excluyente:§! el primer proveedor en aceptar fija nuestro caza y los otros tres programas (§YF-15 Strike Eagle§!, §YTornado GR4§! y §YEurofighter Typhoon§!) se cerrarán para siempre. Elige con cuidado."
 SAU_request_tornado: "Solicitar el Tornado GR4 al Reino Unido"
 SAU_request_tornado_desc: "Acercarse a Londres por el Tornado GR4, el avión de ataque que fue la columna vertebral del histórico programa Al Yamamah. Si los británicos aceptan, se desbloqueará el enfoque §YTornado GR4§!.\n\n§REsta es una elección excluyente:§! el primer proveedor en aceptar fija nuestro caza y los otros tres programas (§YF-15 Strike Eagle§!, §YPanavia Tornado§! y §YEurofighter Typhoon§!) se cerrarán para siempre. Elige con cuidado."
 SAU_request_typhoon: "Solicitar el Eurofighter Typhoon"
 SAU_request_typhoon_desc: "Acercarse al consorcio europeo (Alemania) por el Eurofighter Typhoon dentro del programa Al Salam. Si aprueban la exportación, se desbloqueará el enfoque §YAl Salam: Eurofighter Typhoon§!.\n\n§REsta es una elección excluyente:§! el primer proveedor en aceptar fija nuestro caza y los otros tres programas (§YF-15 Strike Eagle§!, §YTornado GR4§! y §YPanavia Tornado§!) se cerrarán para siempre. Elige con cuidado."
 SAU_rivalry_back_separatists: "Retrocedan los separatistas"
 SAU_rivalry_back_separatists_desc: "La Presidencia General de Inteligencia canaliza dinero y armas a Ahwaz, Balochistan y Kurdistán. La periferia de Irán revuelve."
 SAU_rivalry_propaganda_blitz: "Ofensiva mediática antiiraní"
 SAU_rivalry_propaganda_blitz_desc: "Inundar las ondas y las mezquitas con el caso contra Teherán."
 SAU_rivalry_strait_patrols: "Patrullas de estrecho"
 SAU_rivalry_strait_patrols_desc: "Mantener a la flota en ejercicios en las estrechas aguas de Ormuz."
 SAU_royal_patronage: "Patronaje Real"
 SAU_royal_patronage_desc: "Utilizar nombramientos y contratos reales para obtener apoyo al candidato elegido entre los miembros superiores de la familia. Esto está disponible una vez en cada carrera de sucesión.\n\n§G+20 de pie§! para el príncipe que ya estás respaldando, §Y una vez bajo el rey Abdullah y una vez bajo el rey Salman§!."
 SAU_royal_patronage_tt: "§G+20§! a la posición del príncipe que estás respaldando"
 SAU_sabotage_pipeline_iraq: "Huelga Europa Pipeline"
 SAU_sabotage_pipeline_iraq_desc: "Golpear el oleoducto que lleva petróleo saudí por Irak hacia Europa. Si se corta, se derrumba con él el desafío de Riad a Moscú."
 SAU_sabotage_pipeline_syria: "Strike el Levant Pipeline"
 SAU_sabotage_pipeline_syria_desc: "Meta el cruce saudí hacia el Mediterráneo. Un éxito acorta la línea y tira el Reino de la ruta."
 SAU_sabotage_pipeline_yemen: "Strike el mar árabe Pipeline"
 SAU_sabotage_pipeline_yemen_desc: "Enviar saboteadores contra la línea saudí a través del sur de Yemen. Si pasan, el petróleo se detiene y el Reino pierde su ruta sur."
 SAU_salman_burden_of_state: "Cargar al Rey con asuntos de Estado"
 SAU_salman_burden_of_state_desc: "Exigir al Rey que maneje expedientes, delegaciones y ceremonias que normalmente se delegarían. La mayor carga de trabajo acelerará el deterioro de su salud."
 SAU_salman_cpsa_council: "Convocar el Consejo de Asuntos Políticos y de Seguridad"
 SAU_salman_cpsa_council_desc: "Reemplazar los comités de seguridad existentes por un único Consejo de Asuntos Políticos y de Seguridad que se reúna en el palacio real. La autoridad consolidada acortará el tiempo requerido para las grandes decisiones."
 SAU_salman_health_status: "§HLa Salud del Rey§!: [GetSAUKingHealth]"
 SAU_salman_health_status_desc: "La condición del Rey se reporta como [GetSAUKingHealth]. Cuando su salud falla, el Príncipe Heredero se convierte en Rey."
 SAU_salman_ksrelief: "Movilice las operaciones de KSrelief"
 SAU_salman_ksrelief_desc: "Enviar convoyes de ayuda de KSrelief, hospitales de campaña y suministros de alimentos al exterior bajo patrocinio oficial saudí. La operación da asistencia humanitaria y mejora el apoyo al gobierno en casa."
 SAU_salman_maneuver: "Maniobras de Facción de Salman"
 SAU_salman_maneuver_desc: "El bloque Sudairi trabaja para adelantar la demanda de Salman, y puede volver a la corte contra su propio candidato."
 SAU_salman_riyadh_metro_plan: "Ampliar el Plan Metropolitano de Riad"
 SAU_salman_riyadh_metro_plan_desc: "Ampliar Riad mediante seis líneas de metro y una serie de nuevos distritos organizados en torno a la red de transporte."
 SAU_salman_royal_decrees: "Emitir decretos estructurales reales"
 SAU_salman_royal_decrees_desc: "Use decretos reales para fusionar, abolir y reorganizar ministerios sin un largo proceso legislativo."
 SAU_salman_royal_physicians: "Invocar a los Médicos Reales"
 SAU_salman_royal_physicians_desc: "Traer especialistas de Europa y Estados Unidos para tratar al Rey y despejar su agenda para el descanso. Esto mejorará su estado temporalmente pero no puede detener su declive a largo plazo."
 SAU_salman_spark_park: "Subvenciona King Salman Energy Park"
 SAU_salman_spark_park_desc: "Subvencione el parque energético King Salman de treinta cuartos cerca de Dammam para producir bombas, válvulas y equipos de perforación internamente."
 SAU_shura_convene_session: "Convocar el Consejo"
 SAU_shura_convene_session_desc: "Celebrar una sesión con acta del Majlis ash-Shura, con ministros obligados a asistir y responder preguntas. Las actuaciones se publicarán y podrían moldear el debate público aunque el Rey conserve la autoridad final.\n\nEsta decisión solo puede tomarse una vez."
 SAU_shura_seat_notables: "Asiento de los Notables"
 SAU_shura_seat_notables_desc: "Nombrar al Consejo a jeques tribales y familias de comerciantes destacadas de Yeda y Buraydah.\n\nRepetible cada 60 días."
 SAU_shura_seat_notables_tt: "§G+10 escaños notables§!, §R-5 escaños§! para el ulema y los tecnócratas\n§GNotable-led§!: §G+8% del poder político, -8% de los costos de corrupción§! / §R+3% de los bienes de consumo, -3% de apoyo a la guerra§!\n§YEn 70 escaños, el Rey puede alquilar el Consejo de manera permanente.§!"
 SAU_shura_seat_technocrats: "Asiento a los tecnócratas"
 SAU_shura_seat_technocrats_desc: "Nombrar al Consejo a economistas, ingenieros y funcionarios ministeriales con experiencia, incluidos saudíes formados en el extranjero.\n\nRepetible cada 60 días."
 SAU_shura_seat_technocrats_tt: "§G+10 asientos tecnócratas§!, §R-5 escaños§! para el ulema y los notables\n§YTécnócrata-dirigido§!: §G+8% de investigación, +6% producción de oficinas, +5% crecimiento de productividad§! / §R-5% estabilidad§!\n§YEn 70 escaños, el Rey puede alquilar el Consejo de manera permanente.§!"
 SAU_shura_seat_ulema: "Seat el Ulema"
 SAU_shura_seat_ulema_desc: "Nombrar al Consejo a eruditos religiosos de alto rango y a sus candidatos aprobados, lo que aumenta la influencia clerical sobre su labor.\n\nRepetible cada 60 días."
 SAU_shura_seat_ulema_tt: "§G+10 asientos ulema§!, §R-5 escaños§! para los tecnócratas y los notables\n§OUlema-led§!: §G+8% de estabilidad, +10% defensa contra la deriva§! / §R-5% research, -5% migration§!\n§YEn 70 escaños, el Rey puede alquilar el Consejo de manera permanente.§!"
 SAU_spread_revolution_category: "Difundir la revolución"
 SAU_storm_air_campaign: "Strike Houthi Posiciones"
 SAU_storm_air_campaign_desc: "Seleccionar una provincia en manos del movimiento hutí y atacar sus depósitos, aeródromos y rutas de suministro. El ataque también dañará la infraestructura cercana e infligirá bajas.\n\n§RDaña la infraestructura, la industria de armas y las defensas aéreas§! de la provincia objetivo y cuesta mano de obra a los defensores. Repetible cada 14 días."
 SAU_storm_partner_readout: "Coalición: [?SAU_coalition_partners|0] socios"
 SAU_storm_partner_readout_desc: "§H Los Estados que vuelan con el Reino§!: §Y [?SAU_coalition_partners|0]§!\n\nCada miembro de la coalición puede retirarse independientemente."
 SAU_storm_stand_down: "Pónganse en marcha."
 SAU_storm_stand_down_desc: "Poner fin a las salidas de la coalición y disolver la campaña sin más operaciones militares.\n\n§G+4% de estabilidad§!, §R-3% de apoyo a la guerra§!. Termina la campaña definitivamente."
 SAU_undermine_mbn: "Mohammed bin Nayef"
 SAU_undermine_mbn_desc: "Utilice contactos judiciales, revelaciones dañinas y retenido patrocinio para reducir el apoyo de Mohammed bin Nayef. El resultado puede variar de ningún efecto a una pérdida importante de influencia."
 SAU_undermine_mutaib: "Mutaib bin Abdullah"
 SAU_undermine_mutaib_desc: "Use contactos judiciales, revelaciones dañinas y conserve el patrocinio para reducir el apoyo de Mutaib bin Abdullah. El resultado puede variar de ningún efecto a una pérdida importante de influencia."
 SAU_undermine_salman: "Salman bin Abdulaziz"
 SAU_undermine_salman_desc: "Utilice contactos judiciales, revelaciones dañinas y retenido patrocinio para reducir el apoyo de Salman bin Abdulaziz. El resultado puede variar de ningún efecto a una pérdida importante de influencia."
 SAU_unleash_laf: "Desarrollar el ejército libanés"
 SAU_unleash_laf_desc: "El ejército es reconstruido, pagado y armado. Ahora Riyadh pide a Beirut el único reembolso que importa: desarmar Hezbollah, por la fuerza si es necesario."
 SAU_vision2030_category: "Vision 2030 Projects"
 SAU_west_free_trade: "Libre comercio con Occidente"
 SAU_west_free_trade_desc: "Reducir aranceles y firmar pactos comerciales en todo el bloque de la OTAN. Las relaciones con la alianza occidental mejoran y un acuerdo comercial abierto ata sus mercados al Reino."
 SAU_west_joint_training: "Capacitación conjunta americana-saudi"
 SAU_west_joint_training_desc: "Realizar ejercicios conjuntos con instructores estadounidenses para mejorar el entrenamiento de armas combinadas saudí y dar experiencia a todas las fuerzas armadas."
 SAU_west_petrodollar: "Petrodollar Recycling"
 SAU_west_petrodollar_desc: "Los ingresos petroleros saudíes se reciclan en bonos del Tesoro de EE. UU. y empresas conjuntas estadounidenses. El Reino gana menos al principio, pero Washington se enriquece y se compromete más con la Casa de Saud."
 SAU_yemen_old_weapons: "Armas excedentes de buques"
 SAU_yemen_old_weapons_desc: "Enviar armas de infantería saudíes obsoletas de los depósitos militares al gobierno yemení con un costo interno mínimo."
 SAU_yemen_raise_brigade: "Coordinar el ofensivo"
 SAU_yemen_raise_brigade_desc: "Integrar a oficiales saudíes en el mando yemení y planear un empuje coordinado. Las fuerzas del gobierno ganan una ventaja duradera en el ataque contra los hutíes."
 SAU_yemen_war_funds: "Financiar el esfuerzo de guerra"
 SAU_yemen_war_funds_desc: "Anímate dinero a Adén para pagar salarios, comprar combustible y mantener a los soldados del gobierno en el campo un tiempo más."
 YEM_drop_south_yemen_name: "Reclamar el nombre de Yemen"
 YEM_drop_south_yemen_name_desc: "Dejar de lado la identidad de Yemen del Sur y volver a gobernar simplemente como Yemen."
 yemen_partition_category: "Los dos yemenitas"
 SAU_events.1.a: "Que Alá tenga misericordia de su alma."
 SAU_events.1.d: "El rey Fahd bin Abdulaziz Al-Saud, Custodio de las Dos Mezquitas Santas, ha fallecido después de años de disminución de la salud tras su accidente cerebrovascular en 1995. El Príncipe Heredero Abdullah, que ha estado gobernando el Reino de facto durante casi una década, ascenderá ahora al trono como Rey. La crisis de sucesión que se ha asolado durante años en el Reino ha sido finalmente resuelta."
 SAU_events.1.t: "Muerte del rey Fahd"
 SAU_events.10.a: "Únete a OPEC+."
 SAU_events.10.b: "Rechazar el acuerdo."
 SAU_events.10.d: "Riyadh propone coordinar la producción de petróleo con Moscú bajo la OPEP+, dando a ambos exportadores mayor influencia sobre los precios mundiales."
 SAU_events.10.t: "[SAU.GetFlag] Acuerdo OPEC+ [SOV.GetFlag]"
 SAU_events.100.a: "La región respira"
 SAU_events.100.d: "Irán ha ido a la guerra contra la expoliada República de Arabia, sumergiendo al Golfo en un conflicto abierto entre los dos centros rivales del poder chiíta."
 SAU_events.100.t: "Guerra en el Golfo"
 SAU_events.101.a: "Permaneceremos"
 SAU_events.101.d: "Teherán ha parado de la guerra, pero su furia es clara. Los agentes iraníes agitan el malestar en nuestras ciudades y los medios de comunicación iraníes marcan la república como un estado hereje."
 SAU_events.101.t: "Tehran Seethes"
 SAU_events.102.a: "Reconcile con las monarquías del Golfo"
 SAU_events.102.b: "Campeona la causa de la democracia árabe"
 SAU_events.102.d: "Con un parlamento sentado y la república a sus pies, la cuestión de dónde está Arabia en el mundo ya no puede aplazarse. ¿Hará paz con las monarquías del Golfo, o dirigirá la causa de la democracia árabe?"
 SAU_events.102.t: "La República y la Región"
 SAU_events.103.a: "Únase a la liga"
 SAU_events.103.b: "Mantenerse independiente"
 SAU_events.103.d: "La República de Arabia invita a nuestra nación a una liga de democracias árabes, un bloque que responde a sus pueblos en vez de a reyes o clérigos."
 SAU_events.103.t: "Un llamado a las democracias"
 SAU_events.104.a: "Un nuevo capítulo para Arabia"
 SAU_events.104.d: "Han terminado décadas de monarquía absoluta. A medida que las multitudes llenan las calles de Riad, un Consejo Nacional de Transición ha tomado las riendas del estado, jurando gobernar sólo hasta que Arabia pueda elegir su propio camino en la urna electoral."
 SAU_events.104.t: "La Casa de las Cataratas Saud"
 SAU_events.107.a: "Proclamar la República Árabe de Arabia"
 SAU_events.107.b: "Mantenga la República de Arabia"
 SAU_events.107.d: "El Ba'ath tiene las riendas del estado. ¿Se proclamará Arabia la República Árabe, la vanguardia de la nación árabe, o mantendrá el modesto nombre de la República de Arabia?"
 SAU_events.107.t: "El nombre de la República"
 SAU_events.109.a: "Únase a la Comintern Árabe"
 SAU_events.109.b: "Nos quedaremos solos."
 SAU_events.109.d: "[FROM.GetName] nos invita a la Comintern Árabe, un sindicato de estados obreros ligados por la causa de la revolución. Podemos unirnos a nuestros camaradas o mantener nuestro propio camino."
 SAU_events.109.t: "A Llamar a la Comintern Árabe"
 SAU_events.11.a: "Acepta el trato."
 SAU_events.11.b: "Descansa la oferta."
 SAU_events.11.d: "Riyadh ofrece a Washington una negociación permanente: un flujo fiable de petróleo saudí a los mercados estadounidenses a cambio de una cooperación más estrecha en materia de seguridad. El Reino espera una respuesta."
 SAU_events.11.t: "[SAU.GetFlag] Petróleo para la Seguridad"
 SAU_events.110.a: "Una lección costosa."
 SAU_events.110.d: "El Ejército Sirio Libre ha sido aplastado. Los rebeldes que armamos y financiamos están esparcidos o muertos, y Damasco permanece ininterrumpido. Años de tesoro y credibilidad derramados en Siria han comprado al Reino nada más que una derrota humillante y un régimen que ahora se apoya más en Teherán que nunca."
 SAU_events.110.t: "El Gambito Sirio colapsa"
 SAU_events.111.a: "Aceptar la cesación del fuego"
 SAU_events.111.b: "La guerra continúa"
 SAU_events.111.d: "Riyadh ha presentado términos para una cesación del fuego. El Reino detendrá su campaña aérea y terminará con hostilidades directas, dejando al gobierno de Sana para luchar contra su propia guerra. La oferta se sienta sobre la mesa."
 SAU_events.111.t: "Una oferta saudita de Cesación del Fuego"
 SAU_events.112.a: "Una pausa en la lucha"
 SAU_events.112.d: "Sana'a ha acordado una cesación del fuego. La Operación Tormenta Decisiva está herida y el Reino retrocede del frente yemení. La tregua sólo aguantará mientras lo deseemos."
 SAU_events.112.t: "Los Houthis Aceptan"
 SAU_events.113.a: "So be it"
 SAU_events.113.d: "Sana'a ha rechazado nuestros términos por completo. La guerra en Yemen continúa, y la Operación Tormenta Decisiva continúa."
 SAU_events.113.t: "Los Houthis Refuse"
 SAU_events.114.a: "Entonces peleamos."
 SAU_events.114.d: "La tregua ha terminado. Emboldado y rearme, Ansar Allah ha destrozado la cesación del fuego y reanudado sus ataques. La guerra en Yemen ha vuelto, ya sea que el Reino lo desea o no."
 SAU_events.114.t: "Los Houthis rompen la cesación del fuego"
 SAU_events.115.a: "Declaradlo Rey. Ha esperado lo suficiente."
 SAU_events.115.b: "El tiempo no está bien. Que sirva como Príncipe Heredero."
 SAU_events.115.d_mbn: "La orden es válida. Mohammed bin Nayef sigue siendo Príncipe Heredero, su reclamación confirmada por el Rey y sin responder en público. El hombre más joven se retira a sus ministerios, superados por ahora - y el Reino exhala."
 SAU_events.115.d_mbs: "Está hecho. Mohammed bin Nayef está aliviado de sus oficinas y, antes de las cámaras, besa la mano del joven que lo ha desplazado. Mohammed bin Salman es el Príncipe Heredero, y la línea de sucesión ha saltado una generación. Los príncipes mayores no dicen nada. Decir que nada es en sí mismo una respuesta."
 SAU_events.115.t: "El Príncipe Heredero es nombrado"
 SAU_events.116.a: "Que reine."
 SAU_events.116.d_mbn: "El rey Salman está muerto, y el príncipe heredero se adhiere como siempre estaba destinado. Mohammed bin Nayef toma el trono con los servicios de seguridad detrás de él y una reputación construida sobre mantener el Reino de pie."
 SAU_events.116.d_mbs: "El rey Salman está muerto, y el trono pasa a su hijo. Mohammed bin Salman gobierna el Reino a una edad cuando la mayoría de sus predecesores todavía estaban esperando un ministerio. Los hombres que lo dudaron desde hace mucho tiempo han sido retirados, arrestados o reconciliados."
 SAU_events.116.t: "Un nuevo rey en Riad"
 SAU_events.117.a: "Envíenlos a casa."
 SAU_events.117.b: "Naturalizar los útiles."
 SAU_events.117.d: "Nueve millones de trabajadores extranjeros mantienen la economía del Reino en pie. Ponen la tubería, dotan a los hospitales, conducen las lorries y llenan los sitios - y no son, y nunca serán, de la nación que los Faisalites quieren reconstruir. El Consejo no puede estar de acuerdo en que son un andamio para ser eliminado o una fundación sobre la que se construirá."
 SAU_events.117.t: "Cuestión de la fuerza de trabajo expatriados"
 SAU_events.118.a: "Retirada de lo que no escribimos."
 SAU_events.118.b: "Trabajarlos desde dentro."
 SAU_events.118.d: "Las Naciones Unidas, el Fondo y el Banco se construyeron sin el consentimiento del Reino. El retiro liberaría a Riyadh de instituciones que no escribía, pero lo dejaba hablar más bien que oír. El Consejo debe elegir entre distancia e influencia."
 SAU_events.118.t: "Cuestión de los Foros Internacionales"
 SAU_events.119.a: "Tráelo todo a casa."
 SAU_events.119.b: "Déjalo donde gana."
 SAU_events.119.d: "Cientos de miles de millones se encuentran en tesorería y bancos occidentales, seguros y rentables pero vulnerables a la presión extranjera. Llevar la riqueza a casa financiaría el desarrollo del Reino; dejarla en el extranjero conserva sus retornos y la influencia de Riyadh en las capitales occidentales."
 SAU_events.119.t: "La cuestión de la riqueza extranjera"
 SAU_events.12.a: "Aceptar la asociación."
 SAU_events.12.b: "Descansa la oferta."
 SAU_events.12.d: "Arabia Saudita propone una asociación a largo plazo con Gran Bretaña. Los ingresos del petróleo pagarían por la industria y los conocimientos especializados británicos, reviviendo el espíritu de Al-Yamamah."
 SAU_events.12.t: "[SAU.GetFlag] Una asociación saudí-británica"
 SAU_events.120.a: "Las Mezquitas son un deber, no un mandato."
 SAU_events.120.b: "Hablamos por los fieles."
 SAU_events.120.d: "Más de mil millones de musulmanes no comparten una sola voz política. El Reino tiene a Meca y Medina, y el ulema pregunta si esa confianza es un deber de cumplir silenciosamente o un mandato para dirigir la Ummah abiertamente."
 SAU_events.120.t: "La cuestión global de Ummah"
 SAU_events.121.a: "El Mandato de Autosuficiencia."
 SAU_events.121.b: "Equidencia armada."
 SAU_events.121.d: "Dos bloques están cada uno convencido de que el Reino es suyo para perder. Riyadh puede permanecer armado y equidistante, comprando de ambos mientras no pertenece a ninguno o aceptar el costo de construir sus propias armas y dependiendo de ningún arsenal extranjero."
 SAU_events.121.t: "La cuestión de la superpotencia"
 SAU_events.122.a: "Alms, dado libremente."
 SAU_events.122.b: "Ayuda con condiciones."
 SAU_events.122.d: "El dinero saudí llega a cada rincón del mundo musulmán: mezquitas, clínicas, gobiernos y ejércitos. Faisal lo dio como limosnas y no pidió nada por escrito; sus herederos argumentan que la ayuda sin condiciones no compra ninguna influencia duradera. El Reino debe elegir entre caridad y apalancamiento."
 SAU_events.122.t: "La cuestión de la ayuda soberana"
 SAU_events.123.a: "Ataque los colores extranjeros. Se van a casa."
 SAU_events.123.a_tt: "Toda potencia extranjera pierde acceso militar al Reino"
 SAU_events.123.b: "El acuerdo está en pie. La necesidad permite lo que el principio prohíbe."
 SAU_events.123.d: "Las banderas extranjeras todavía vuelan sobre el suelo saudí, y cada año hacen los sermones crecen más difícilmente para responder. Las guarniciones garantizan al Reino contra sus vecinos y lo humillan ante su propio clero en el mismo aliento. El Consejo se ha quedado sin las formas de aplazar la decisión."
 SAU_events.123.t: "La cuestión de las bases extranjeras"
 SAU_events.124.a: "Proclamadlo del púlpito."
 SAU_events.124.b: "Proclamadlo desde el palacio."
 SAU_events.124.d: "Cuando Faisal tomó el trono de su hermano en 1964 lo hizo con una fatwa en la mano y el Consejo de Ministros ya reorganizado debajo de él - la mezquita y la maquinaria se movió en la misma semana. Saud había pasado el Reino al borde de la quiebra; Faisal respondió con una austeridad que nadie había pedido y un programa de diez puntos en el que nadie había votado.\n\nEl programa debe ser revivido. La única pregunta que queda es en cuyo nombre se revivió - el clero recuerda al Rey que gobernó con ellos, y los ministerios recuerdan al Rey que dirigió el mismo estado."
 SAU_events.124.t: "Resurgencia Faisalita"
 SAU_events.125.a: "Compra sus cartas."
 SAU_events.125.b: "Reemplazarlos de forma directa."
 SAU_events.125.d: "Abdulaziz ató la península junto con los matrimonios y estipendios, y dejó sus hijos gobernando provincias que eran, en todo sentido práctico, propias. Faisal pasó once años imprimiendo a los ministerios sueltos de ese arreglo y nunca lo terminó por completo.\n\nLas cartas pueden ser compradas a un precio que el Tesoro se sentirá, o simplemente pueden ser revocados - que es más barato, y hace enemigos dentro de la familia que sobrevivan al Rey que los hizo."
 SAU_events.125.t: "Centralización de los Emiratos Provinciales"
 SAU_events.126.a: "Dales los tribunales."
 SAU_events.126.b: "Dales las escuelas."
 SAU_events.126.d: "Faisal gobernó con los eruditos en su hombro y pagó por él en cuotas. Cuando trajo televisión al Reino en 1965 su propio sobrino murió atacando la estación de Riad, y una década más tarde el hermano del hombre entró en un majlis y disparó al Rey muerto. La alianza con el ulema nunca fue decorativa y nunca libre.\n\nLo que se les da ahora decide cuál es el Reino. Los tribunales los harían árbitros de la ley. Las escuelas los harían autores de la próxima generación."
 SAU_events.126.t: "Aumentar la Autoridad de Ulema"
 SAU_events.127.a: "Exígelos."
 SAU_events.127.b: "Reeducarlos."
 SAU_events.127.d: "La ironía no se pierde en nadie: Faisal construyó la tecnocracia misma, enviando saudíes a El Cairo, Londres y California y dándoles ministerios cuando llegaron a casa. Zaki Yamani dirigió la cartera de petróleo con un título de Harvard en su bolsillo y lo hizo mejor que cualquiera que el Reino pudiera haber criado en casa.\n\nPero los hombres regresaron con más que calificaciones, y el Consejo ahora argumenta si la respuesta es el aeropuerto o el aula."
 SAU_events.127.t: "Purge la élite occidentalizada"
 SAU_events.128.a: "Appoint by examination."
 SAU_events.128.b: "Nombrado por lealtad."
 SAU_events.128.d: "Antes de Faisal apenas había un estado para el personal. Las finanzas del Reino corrieron a través de la propia casa del Rey y un puñado de mercaderes confiables, y la diferencia entre el tesoro y el bolso real era una cuestión de opinión. Construyó ministerios donde había retenedores.\n\nLo que la nueva burocracia es realmente para nunca fue arreglado. Un servicio elegido por examen será competente y no estará agradecido. Un servicio elegido por la lealtad no será ninguno."
 SAU_events.128.t: "La Soberana Administración Pública"
 SAU_events.129.a: "Déjenlos patrullar en la fuerza."
 SAU_events.129.b: "Manténganlos asesorados."
 SAU_events.129.d: "El Comité para la Promoción de la Virtud y la Prevención del Vice fue una dispersión de los agentes locales hasta que el Estado le dio un presupuesto, un uniforme y una cadena de mando. Faisal necesitaba que el clero se reconciliara con la televisión, con las escuelas de niñas y con los ingenieros extranjeros caminando por las calles de Dhahran, y el Comité era parte de lo que pagó.\n\nNunca ha sido una fuerza de policía, y nunca ha sido uno tampoco."
 SAU_events.129.t: "Los Comités Virtud devuelven"
 SAU_events.13.a: "Aceptar el pacto de inversión."
 SAU_events.13.d: "A un lado las viejas sospechas, Riyadh ofrece a París un amplio pacto de inversión: capital saudí para la industria francesa y experiencia francesa para el Reino. Ambos gobiernos están a punto de ganar."
 SAU_events.13.t: "[SAU.GetFlag] Pacto de Inversiones Franco-Saudi"
 SAU_events.130.a: "Ataque los satélites."
 SAU_events.130.b: "Compra las redes."
 SAU_events.130.d: "Faisal combatió su primera guerra mediática contra la Voz de los Árabes de Nasser, que transmitió a los cuarteles saudíes y dijo a los soldados sauditas que su Rey era un sirviente americano. Riyadh respondió con transmisores propios y una gran cantidad de dinero colocado en silencio con los editores en Beirut y El Cairo.\n\nLa lección tomó: una emisión no se puede discutir con. Sólo se puede atascar, o comprar."
 SAU_events.130.t: "Prohibir los medios extranjeros"
 SAU_events.131.a: "Asiento a los notables."
 SAU_events.131.b: "Ampliar la membresía."
 SAU_events.131.d: "El Programa de Diez Puntos de 1962 prometió al Reino un Consejo Consultivo. Faisal gobernó durante trece años más y nunca convocó uno, y cayó a Fahd para finalmente ocuparlo en 1992 - treinta años tarde, y nombró en lugar de elegido.\n\nLa promesa está siendo hecha de nuevo, y la composición es todo el argumento. Los notables lo harían un tribunal. Una membresía más amplia haría algo que el tribunal no pueda predecir por completo."
 SAU_events.131.t: "Reorganización del Majlis ash-Shura"
 SAU_events.132.a: "Institutos técnicos."
 SAU_events.132.b: "Academias militares."
 SAU_events.132.d: "El boom fue construido por las manos de otras personas - trabajadores yemeníes, maestros egipcios, empleados palestinos, y en el tiempo un millón y más del sur de Asia. La respuesta de Faisal fue la educación en una escala que la península nunca había intentado: King Abdulaziz University abrió en 1967, los programas de becas enviaron miles al extranjero, y el Reino estableció sobre la fabricación de su propia clase media.\n\nPara lo que se fabrica esa clase es la decisión delante del Consejo."
 SAU_events.132.t: "La iniciativa de los cuadros nacionales"
 SAU_events.133.a: "Cierralo por completo."
 SAU_events.133.b: "Admite a quien necesitamos."
 SAU_events.133.d: "Para la década de 1970, la fuerza laboral extranjera se acercaba a un tercio de todo el mundo dentro de las fronteras, y estaba haciendo la mayor parte del trabajo que mantenía las luces ardiendo. Faisal tomó el trabajo y se preocupó por la política que llegó - los palestinos trajeron la causa, los yemeníes trajeron números, y los egipcios trajeron a Nasser.\n\nSellar la frontera restablece a la nación y da a los ministerios una escasez de mano de obra para la cual no tienen ningún plan."
 SAU_events.133.t: "La frontera cerrada"
 SAU_events.134.a: "Fortalecer la costa."
 SAU_events.134.b: "Fortalecer el interior."
 SAU_events.134.d: "El Reino de Faisal fue sonado por gente que quería que se fuera: el Egipto de Nasser a través del Mar Rojo, los republicanos en Sanaa, los baathistas en Bagdad y Damasco, y una Unión Soviética que había escrito la Casa de Saud como una reliquia esperando el entierro. Construyó el Guardia Nacional contra el golpe y compró aviones estadounidenses contra la invasión, y nunca estuvo completamente seguro de lo que vendría primero.\n\nEl Reino debe decidir ahora qué amenaza se está preparando."
 SAU_events.134.t: "El Reino de la Fortaleza"
 SAU_events.135.a: "Conócelo en Meca."
 SAU_events.135.b: "Convenéalo en el extranjero."
 SAU_events.135.d: "Cuando Al-Aqsa se quemó en agosto de 1969, Faisal tuvo a los jefes del mundo musulmán reunidos en Rabat dentro de semanas, y la Organización de la Conferencia Islámica existió antes de que el año fuera. Fue la respuesta a la Liga Árabe de Nasser - no árabe y secular, sino musulmana y liderada por La Meca.\n\nDonde el Reino convoca a los fieles es en sí mismo la declaración. Las Ciudades Santas confieren una legitimidad que no puede prestar ninguna sala de conferencias en el extranjero."
 SAU_events.135.t: "Conferencia Islámica de Solidaridad"
 SAU_events.136.a: "Amenaza el embargo abiertamente."
 SAU_events.136.b: "Aplíquelo en silencio."
 SAU_events.136.d: "El 17 de octubre de 1973 Faisal cortó la producción y cerró los grifos a Estados Unidos. Un barril pasó de tres dólares a casi doce dentro de una temporada, el Occidente descubrió precisamente lo que valía su comodidad, y el Reino descubrió que tenía un arma que nunca había pensado disparar.\n\nNo ha sido despedido desde entonces. El Ministerio ha mantenido las cifras vigentes todo el tiempo."
 SAU_events.136.t: "El Espíritu del '73"
 SAU_events.137.a: "Las armas primero."
 SAU_events.137.b: "Todo lo demás primero."
 SAU_events.137.d: "El Reino bombea el aceite, lo vende en el extranjero y compra todo lo que necesita - incluyendo la tubería por la que pasa el petróleo. Los planes quinquenales de Faisal estaban destinados a romper ese círculo y en gran medida lograron construir las cosas que mueven el petróleo más rápido.\n\nLa sustitución tiene que comenzar en algún lugar, y donde comienza decide lo que el Reino puede hacer sin pedir permiso a nadie."
 SAU_events.137.t: "Erradicar la dependencia extranjera"
 SAU_events.138.a: "Fórmalo."
 SAU_events.138.b: "Póngase al corriente."
 SAU_events.138.d: "Faisal fundó la Liga Mundial Musulmana en Meca en 1962 y llevó a la Organización de la Conferencia Islámica a ser siete años más tarde. Ambos estaban sentados donde el dinero saudí podía alcanzarlos, y ambos fueron construidos para responder a un pan-árabe que no tenía lugar para los reyes.\n\nSus sucesores seguían pagando las facturas y poco a poco dejaron de escribir la agenda. El dinero compra deferencia; los funcionarios compran control. No son lo mismo."
 SAU_events.138.t: "Reclamar el liderazgo de la OCI"
 SAU_events.139.a: "Una cuota estricta."
 SAU_events.139.b: "Una cuota escalonada."
 SAU_events.139.d: "Aramco fue hecho para comprar saudí donde existió Arabia, y donde no lo hizo, el Reino pagó a las empresas extranjeras para construir la fábrica que lo haría. Era lento, era caro, y sigue siendo la única manera en que un país importando sus propios pedazos de perforación deja de hacerlo.\n\nCuán difícil es establecer la palabra decide si los ministerios cumplen, o simplemente aprenden a presentar exenciones."
 SAU_events.139.t: "El Código de Suministros Interiores"
 SAU_events.14.a: "Aceptar la inversión."
 SAU_events.14.b: "Descansa la oferta."
 SAU_events.14.d: "Arabia Saudita ofrece invertir en nuestra industria a cambio de vínculos económicos más profundos. Aceptar traería nuevas fábricas e influencia saudí."
 SAU_events.14.t: "[SAU.GetFlag] Inversión en los países de la OTAN"
 SAU_events.140.a: "Que siga a Faisal. La Guardia la llevará."
 SAU_events.140.b: "El Reino de Faisal murió con Faisal. Deja que descanse."
 SAU_events.140.d: "Fahd está enterrado y Abdullah es Rey en su propio derecho por fin, después de diez años de gobernar en nombre de otro hombre. La sucesión está abierta, y los príncipes ya han comenzado a contar.\n\nEl propio hijo del Rey viene a él con un argumento en lugar de una reclamación. Miteb ordena el Guardia Nacional - los levies tribales, los hombres del interior, la fuerza levantada precisamente porque el ejército regular no podía ser confiado cerca de un trono. Ha estado leyendo Faisal: la austeridad, la autosuficiencia, el Reino que habló por la Ummah y pidió la licencia de Washington para nada. El tío que gobernó de esa manera fue muerto por su propio sobrino, y cada hombre en la habitación lo sabe.\n\nEl programa de Faisal no tiene heredero. Miteb está pidiendo ser uno."
 SAU_events.140.t: "Resurgencia Faisalita"
 SAU_events.141.a: "Que el mercado encuentre su propio piso."
 SAU_events.141.b: "El estado va a comprar. No podemos dejar que esto se convierta en política."
 SAU_events.141.d: "El 25 de febrero el Índice Tadawul All Share cerró a 20.634 y luego dejó de subir. No ha dejado de caer desde entonces.\n\nEsto no es un accidente de bancos e instituciones. Algo cercano a la mitad de la población adulta del Reino estaba en ese mercado - maestros, conductores, soldados, funcionarios públicos - muchos de ellos que poseían acciones compradas en dinero prestado a precios no podían justificar ninguna ganancia. En los centros comerciales se abrieron suelos de brókerage. Las mujeres cambiaron de habitaciones segregadas. Fue, durante dos años, el pasatiempo nacional.\n\nPara cuando el índice encuentre su piso habrá arrojado algo cerca de dos tercios de su valor, y varios cientos mil millones de riyals de ahorro familiar con él. La Autoridad del Mercado de Capitales tiene tres años y nunca ha visto nada como esto. El Consejo debe decidir si el estado atrapa el cuchillo que cae, o permite al mercado enseñar la lección que está enseñando."
 SAU_events.141.t: "Negro febrero"
 SAU_events.142.a: "Cortar la producción. Defiende el precio."
 SAU_events.142.b: "Mantenga la salida. Deja que los productores caros se rompan primero."
 SAU_events.142.d: "El precio de un barril está cayendo y no muestra ningún signo de parada. El presupuesto se escribió sobre supuestos que ya no tienen lugar, y cada ministerio está a punto de descubrir cuál de sus programas era asequible y cuáles eran meramente financiados. \nRiyadh ha estado aquí antes. A principios de la década de 1980 cortó su propia producción para mantener el precio arriba, observó a cada otro productor vender silenciosamente en la brecha que había dejado, y vio la salida saudí caer en aproximadamente tres trimestres mientras el precio colapsó de todos modos. La lección fue cara y sigue siendo discutida en el Ministerio.\nEl Reino tiene los barriles más baratos en la tierra. Esa es la única ventaja real que tiene, y se puede gastar defendiendo el precio para todos, o gastando sobrevalorando a los productores que no pueden permitirse vender en estos números."
 SAU_events.142.t: "Collapse de precio del petróleo"
 SAU_events.143.a: "Una dura lección en un aula caro."
 SAU_events.143.d: "La bolsa saudí ha perdido la mayor parte de su valor en cuestión de meses, borrando varios cientos mil millones de riyals de riqueza familiar. Inusualmente para un mercado de este tamaño, las pérdidas caen casi enteramente sobre los saudíes ordinarios en lugar de instituciones - maestros escolares, conductores y funcionarios públicos que compraron en el pico, muchos de ellos a crédito. Los analistas en el extranjero están notando que el mayor exportador de petróleo del mundo acaba de descubrir que también tiene una clase de inversores minoristas, y ninguna idea qué hacer con uno."
 SAU_events.143.t: "Riyadh: Las colas de Tadawul"
 SAU_events.144.a: "El barril decide, como siempre lo hace."
 SAU_events.144.d: "El precio del crudo ha caído a través de cada piso que los analistas dibujaron para él. Los estados exportadores están reescribiendo presupuestos balanceados sobre supuestos que ahora son visiblemente inútiles, mientras que los importadores disfrutan de un viento que tienen cuidado de no celebrar demasiado fuerte. Cada ojo está en Riyadh, que tiene los barriles más baratos de la tierra y por lo tanto la única decisión que importa: cortar la producción y mantener el precio para todos, o seguir bombeando y descubrir quién rompe primero."
 SAU_events.144.t: "El precio del aceite se derrumbe"
 SAU_events.145.a: "Protege a la Guardia. Es lo que nos protege."
 SAU_events.145.b: "Ambos servicios lo llevarán igual."
 SAU_events.145.d: "Las reservas están drenando y el presupuesto no se cerrará. Los subsidios van primero, luego los proyectos de capital, y ahora el Ministerio de Finanzas ha llegado a la línea de defensa.\n\nLa dificultad es que el Reino no tiene un ejército. Tiene las fuerzas regulares bajo el Ministerio de Defensa, y tiene la Guardia Nacional - reclutada de las tribus leales del interior, encadenada alrededor de Riyadh y los campos petroleros, respondiendo directamente al trono.La Guardia existe porque los hijos de Abdulaziz no confiaron en el ejército, y se ha pagado en consecuencia desde entonces.\n\nLos cortes pueden caer en ambos, o la Guardia puede ser protegida y los oficiales regulares se les puede decir que hacer. Una de esas opciones mantiene el trono seguro este año. El otro lo mantiene a salvo en diez.\n\n§HEl cuerpo de oficiales§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! of §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.145.t: "Los Cortes Inigualables"
 SAU_events.146.a: "Envíen a la Guardia. Limpia las calles."
 SAU_events.146.b: "Nadie se despliega. Encuentra el dinero y compra la paz."
 SAU_events.146.d: "La austeridad ha llegado a la calle. Hay multitudes en Qatif y Dammam, y las más pequeñas en Riad que los ministerios insisten no son multitudes en absoluto.\n\nLa Guardia Nacional es el instrumento para esto - siempre ha sido, ese es todo su punto - y la Guardia está lista, financiada y dispuesta. El cuerpo de oficiales regulares no se ha preguntado, y está observando con mucho cuidado para ver quién se le pide.\n\nCada coronel del Ministerio de Defensa entiende lo que significa si la Guardia es enviada mientras sus propias unidades se sientan sin pagar en los cuarteles. Significa que el trono ha decidido qué ejército confía, en público, permanentemente.\n\n§HEl cuerpo de oficiales§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! of §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.146.t: "La Orden de Despliegue"
 SAU_events.147.a: "Muévete a Riyadh. La Guardia no tendrá tiempo para reaccionar."
 SAU_events.147.b: "Esto no. Somos soldados, no políticos."
 SAU_events.147.d: "La Guardia es pagada y confiada; el ejército no lo es. Los hombres que vuelan la aeronave, dirigen la armadura y sostienen la frontera se les ha dicho, sin que nadie lo diga, que son el segundo ejército en su propio país.\n\nHay precedente para lo que sucede después. En 1969 una conspiración de la fuerza aérea y oficiales del ejército - Nasserist, Hejazi, cansado de ser gobernado por una familia - entró en un informe de inteligencia de derrocar a Faisal. Cientos fueron arrestados. El Reino sacó la lección de que las fuerzas regulares no podían confiar, construyó la Guardia más alta, y nunca preguntó por qué los oficiales lo habían querido en primer lugar.\n\nEl personal se ha reunido durante algunas semanas y ya no está discutiendo los presupuestos.\n\n§HEl cuerpo de oficiales§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! of §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.147.t: "Los oficiales deciden"
 SAU_events.148.a: "El Reino tiene un nuevo gobierno."
 SAU_events.148.d: "Las unidades del ejército regular saudí se trasladaron a Riad antes del amanecer y sostenían los ministerios, la autoridad emisora y los enfoques de los palacios reales. Guardia Nacional Los cuarteles estaban rodeados en la misma hora y no se han resistido. Un Consejo Militar Supremo ha anunciado que está restableciendo el orden público y que la posición constitucional del trono no cambia - una fórmula que los observadores pueden leer varias maneras.\n\nAramco reporta carga normal en Ras Tanura. Esa es la única frase en todo el despacho que los mercados petroleros están leyendo."
 SAU_events.148.t: "Riyadh: Armour en las calles"
 SAU_events.149.a: "Proclamar una República Socialista Árabe."
 SAU_events.149.b: "Proclamar una República Islámica."
 SAU_events.149.c: "Proclamar una República Constitucional."
 SAU_events.149.d: "El trono está acabado. El Consejo tiene los ministerios, la autoridad emisora y los enfoques de cada palacio en Riad, y ha descubierto lo que cada junta descubre: apoderarse de un país lleva una noche, y gobernar uno toma un nombre.\nUna república debe ser proclamada, y una república debe ser proclamada como algo. Los oficiales de la habitación no están de acuerdo en qué. Algunos sirvieron junto a iraquíes y sirios y llegaron a casa admirando al Ba'ath - una nación árabe, un partido, el ejército como su columna vertebral. Otros apuntan al este a Qatif y la Provincia Oriental y argumentan que la única circunscripción masiva que el Reino ha suprimido es la que llevaría una república sobre sus hombros. Una facción más joven, las que se envían al extranjero para estudiar, quieren una constitución y un parlamento y la palabra república para significar lo que significa en todas partes. Y un puñado, más tranquilo que el resto, han estado leyendo cosas por las que los Mabahith una vez los habría arrestado.\nLo que sea anunciado esta noche, será anunciado en nombre del pueblo saudí, y ninguno de ellos ha sido preguntado."
 SAU_events.149.e: "Proclamar una República Popular."
 SAU_events.149.t: "Al-Jumhuriya"
 SAU_events.15.a: "Aceptar la asociación naval."
 SAU_events.15.b: "Descansa la oferta."
 SAU_events.15.d: "Riyadh se acerca a Madrid con una oferta naval: los patios españoles construirían para la Royal Saudi Navy, y el dinero saudí fluiría en la industria española."
 SAU_events.15.t: "[SAU.GetFlag] Una asociación saudí-española"
 SAU_events.150.a: "Absorbelos. Pueden usar nuestro uniforme."
 SAU_events.150.b: "Disolver completamente a la Guardia. Envíenlos a casa."
 SAU_events.150.c: "Mantenga una trompeta, bajo nuestro mando."
 SAU_events.150.d: "Setenta y cinco mil hombres, criados de las tribus de Najd porque los hijos de Abdulaziz no confiaban en un ejército de profesionales, y armados lo suficientemente bien que ningún ejército profesional podía avanzar en Riad sin luchar primero contra ellos. Estaban rodeados de sus barracas la noche y no dispararon. Ahora el Consejo tiene que decidir qué hacer con ellos.\n\nNo son una formación enemiga. Sus oficiales son primos y vecinos de los hombres que les sostienen las armas, y cada uno de sus soldados pertenece a una tribu con un reclamo sobre el estado. Disolverlos y el Concilio ahorra mucho dinero y hace muchos enemigos en el interior. Absorbe y dobla su mano de obra y traga setenta y cinco mil hombres cuya lealtad era, hasta la semana pasada, explícitamente a alguien más."
 SAU_events.150.t: "La Guardia disuelto"
 SAU_events.151.a: "Responderán al estado o a nadie."
 SAU_events.151.b: "Restaurar los estipendios. Cada riyal de ellos."
 SAU_events.151.d: "Los estipendios se detuvieron cuando la Guardia lo hizo. En el interior que no se leía como medida presupuestaria - los pagos a las tribus de Najd y la Shammar prefeccionan al Reino en sí, son el arreglo por el cual Abdulaziz lo reunió, y nunca han sido interrumpidos.\n\nLos jeques no están en rebelión. Simplemente no contestan, y en un país este tamaño que no responde es la mayor parte del camino allí."
 SAU_events.151.t: "La respuesta de las tribus"
 SAU_events.152.a: "Arréstenlos. Todos, esta noche."
 SAU_events.152.b: "Tráelos. Ampliar el Consejo y compartir la culpa."
 SAU_events.152.d: "Un Consejo que no puede pagar, no puede gobernar y no puede explicarse es un Consejo que sus propios coroneles comienzan a discutir en la tercera persona. Hay reuniones de nuevo - las mismas habitaciones, las mismas filas, la misma frase cuidadosa que precedió a la última.\n\nLos hombres que tomaron a Riad saben exactamente cómo se hace esto, porque lo hicieron. Esa es la dificultad de gobernar por golpe: usted ha publicado el método."
 SAU_events.152.t: "Los oficiales giran"
 SAU_events.153.a: "Mejor pobre que colgado."
 SAU_events.153.d: "Los estipendios son restaurados, los tribunales están callados, y una fecha es nombrada para una asamblea consultiva que todo el mundo entiende será nombrado en lugar de elegido. No es mucho. Es suficiente que los hombres que contaban las semanas restantes del Consejo hayan dejado de contar en voz alta.\n\nEl Tesoro es más ligero por una suma que nadie va a publicar, y los oficiales que llevaron a Riyadh han entregado una buena parte de lo que tomaron para."
 SAU_events.153.t: "El Consejo compra su manera de volver"
 SAU_events.154.a: "Entonces se resolverá en el campo."
 SAU_events.154.d: "Noventa días, y el Consejo no encontró nada que decir. La guarnición en Ha'il declaró para el Rey esta mañana, la provincia oriental seguido de mediodía, y los levies tribales que la Guardia usaba han dejado de fingir ser cualquier otra cosa.\n\nEl ejército que tomó el país en una noche es ahora la única institución que lo defiende, y está descubriendo que un estado mantenido enteramente por la fuerza requiere más fuerza que nadie presupuestado."
 SAU_events.154.t: "El Reino divide"
 SAU_events.155.a: "El mundo observa la Provincia Oriental."
 SAU_events.155.d: "Los combates se han reportado en todo el interior saudí entre unidades leales al Consejo Militar Supremo y formaciones que declaran la Casa de Saud. La Provincia Oriental, donde está el petróleo, es impugnada. Brent abrió once dólares más alto y no ha dejado de escalar.\n\nCada ministerio extranjero con una embajada en Riyadh está emitiendo la misma declaración sobre moderación, y cada uno de ellos está trabajando silenciosamente a qué lado ser visto retroceder tarde en lugar de temprano."
 SAU_events.155.t: "Riyadh: Guerra civil en Arabia Saudita"
 SAU_events.156.a: "Guarde Abdullah. El trono vale lo que nos cuesta."
 SAU_events.156.b: "Encuéntranos un Rey que entienda el arreglo."
 SAU_events.156.d: "Las gobernaciones son las del Consejo para entregar ahora, lo que plantea la cuestión de que ha sido cuidadosamente no plantear. Todavía hay un rey.\n\nAbdullah es viejo, personalmente austero de una manera que el país siempre ha gustado, y ordenó el Guardia Nacional durante cuarenta años antes de la disolución del Concilio - lo que significa que los hombres que tomaron Riad están preguntando si mantener al hombre cuyo ejército acaban de disolver. A su favor: nadie en el Reino cuestiona su legitimidad, y un trono que nadie pregunta vale más que varias divisiones.\n\nContra él: no es un cabeza de figura por temperamento y nunca lo ha sido. Mantenerlo significa devolver algo de lo que el Consejo tomó, en la práctica y en público. La alternativa es encontrar un príncipe que entienda que el arreglo es al revés."
 SAU_events.156.t: "La cuestión del trono"
 SAU_events.157.a: "Salman bin Abdulaziz."
 SAU_events.157.b: "Mohammed bin Nayef."
 SAU_events.157.c: "Mutaib bin Abdullah."
 SAU_events.157.d: "El rey Abdullah ha sido retirado del trono, y el Consejo Militar Supremo debe nombrar un sucesor de entre los príncipes superiores de la Casa de Saud.\n\nCada candidato lleva una circunscripción diferente detrás de él - el establecimiento Sudairi, los servicios de seguridad, las tribus del interior y la generación más joven de la familia. La elección del Consejo determinará cuál parte del Reino reconoce primero el nuevo arreglo, y qué parte tendrá que ser persuadida."
 SAU_events.157.e: "Mohammed bin Salman."
 SAU_events.157.t: "Un Rey más Conveniente"
 SAU_events.158.a: "Un oficial de servicio. §H+5 Control, -5 Legitimacy§!"
 SAU_events.158.b: "Un príncipe de la Casa de Saud. §H-5 Control, +5 Legitimacy§!"
 SAU_events.158.c: "Un lugar notable. §H+2 Control, +2 Legitimacy§!"
 SAU_events.158.d: "El asiento está vacío y el Consejo debe llenarlo. Se han presentado tres nombres, y cada uno de ellos compra al Consejo algo diferente.\n\nUn oficial será obedecido y resentido. Un príncipe será reconocido e ignorado. Un lugar notable no será, que es la parte útil y la parte peligrosa a la vez."
 SAU_events.158.t: "La provincia de [SAU_governor_province.GetName]"
 SAU_events.159.a: "Una regencia estrecha. Él guarda el trono y las mezquitas."
 SAU_events.159.b: "Una regencia total. Cada poder, sin excepción."
 SAU_events.159.c: "Una regencia de cinco años. Ponle una cita."
 SAU_events.159.d: "El documento es corto. It records that His Majesty, being indisposed, entrusts the executive authority and the defence portfolio to a Council acting in his name, and it bears his signature under a paragraph he was given no opportunity to amend.\n\nLo que queda por resolver es cuánto toma el decreto en realidad. Una regencia que deja al Rey su mezquita, su título y sus ceremonias es una regencia con la que el país puede vivir, y una que no le deja nada es simplemente la verdad escrita. Los abogados señalan, sin ser preguntados, que un decreto con una fecha en él es más fácil firmar que un decreto sin uno.\n\nNo hay constitución que suspenda. Esa siempre ha sido la conveniencia de este Reino."
 SAU_events.159.t: "El Decreto de Regency"
 SAU_events.16.a: "Extender el paraguas de defensa aérea."
 SAU_events.16.b: "Rechazar la solicitud."
 SAU_events.16.d: "El Reino pide a Washington un paraguas ampliado de defensa aérea. Las baterías Patriot sonaban ciudades sauditas y campos petrolíferos, pagados en su totalidad por Riad."
 SAU_events.16.t: "[SAU.GetFlag] El escudo americano"
 SAU_events.160.a: "El aparato completo. Maldito, tribunales, censores."
 SAU_events.160.b: "Sólo poderes de emergencia. Deja las calles solas."
 SAU_events.160.d: "La Asamblea, el movimiento entre las provincias y las imprentas pasan bajo la autoridad militar esta mañana. Los abogados del Consejo observan que el Reino nunca ha poseído una constitución para suspender, lo que salva mucho la redacción.\n\nLa pregunta es hasta dónde va. La maldición, los tribunales y los censores mantendrán el país quieto y serán recordados por una generación. Los poderes de emergencia sin el toque de queda se mantendrán más bien menos y serán perdonados antes."
 SAU_events.160.t: "Ley marcial"
 SAU_events.161.a: "El decreto decía cinco años. Han pasado cinco años."
 SAU_events.161.b: "La indisposición continúa. Indefinidamente."
 SAU_events.161.d: "Hace cinco años el Consejo puso una fecha en su propia autoridad, y los abogados que le aconsejaron hacerlo han pasado los años intervinientes siendo reasignados silenciosamente. La fecha ha llegado. Todos en el Reino saben que ha llegado.\n\nHonrar significa devolver al ejecutivo a un trono que el Consejo ha pasado cinco años hundiendo, y confiar en que la gratitud es algo real. Romperlo significa que la palabra del Consejo vale exactamente lo que todos sospecharon, y nunca valdrá más que eso de nuevo.\n\n§HUna promesa mantuvo costos al Consejo de Seguridad. Una promesa rota cuesta todo lo demás.§!"
 SAU_events.161.t: "Los Expires de Regency"
 SAU_events.162.a: "Licence los diseños. Necesitamos producción, no orgullo."
 SAU_events.162.b: "Construirlo nosotros mismos, desde el mineral hacia arriba."
 SAU_events.162.d: "El Reino ha comprado sus armas en el extranjero ya que tenía armas para comprar, y los hombres ahora que lo gobiernan pasaron su carrera esperando repuestos extranjeros que llegaron cuando el parlamento de alguien más lo permitió. La ley obliga a la fabricación nacional de lo que se puede hacer aquí.\n\nHay dos maneras de empezar. Compra las licencias y la herramienta, y tiene plantas corriendo dentro de tres años haciendo los diseños de alguien más bajo los términos de otra persona. O empezar de la nada - la metalurgia, los ingenieros, las fallas - y poseer el resultado por completo, a un costo que el Tesoro se sentirá durante una década."
 SAU_events.162.t: "Las industrias de defensa actúan"
 SAU_events.163.a: "Los príncipes. Que el país los vea contabilizar."
 SAU_events.163.b: "Los disidentes. Los archivos ya están escritos."
 SAU_events.163.c: "Ambos. No tomamos el estado para ser selectivos."
 SAU_events.163.d: "El tribunal se encuentra bajo la autoridad militar, sin apelación, y toma jurisdicción los jueces ordinarios nunca fueron concedidos. El ulema ha sido consultado sobre la forma de las actuaciones y no sobre los veredictos, que han notado.\n\nEl Consejo debe decidir quién es presentado ante él. Hay príncipes cuyas cuentas no sobrevivirán a una auditoría y cuya desgracia el país disfrutará enormemente. Hay organizadores, clérigos y signatarios cuyos archivos los Mabahith han mantenido durante veinte años. Probar el primero es popular y rentable. Probar el segundo es necesario y será recordado."
 SAU_events.163.t: "El Tribunal de Emergencia"
 SAU_events.164.a: "Servicio universal. Cada hombre de edad, sin exenciones."
 SAU_events.164.b: "Servicio selectivo. Las tribus mantienen sus exenciones."
 SAU_events.164.d: "El Al Saud nunca conscribió a nadie. Un ejército de voluntarios provenientes de tribus de confianza es leal; un ejército de todos es simplemente grande, y un gran ejército en un país de este tamaño desarrolla opiniones sobre cómo se dirige el país.\n\nEl Consejo es en sí mismo la opinión que temió el último régimen, lo que da a la discusión cierta torpeza. Se propone asumir el riesgo de todos modos - la única pregunta es si el impuesto cae sobre todo o sobre todos los que el Consejo puede permitirse molestar."
 SAU_events.164.t: "Conscripta el reino"
 SAU_events.165.a: "Los príncipes mayores. Sus nombres todavía llevan al país."
 SAU_events.165.b: "Los primos pasados por alto. La gratitud es más barata que el prestigio."
 SAU_events.165.c: "Los descontentos ricos. Tráelos y auditarlos más tarde."
 SAU_events.165.d: "La familia no es una cosa. Son miles de personas con reivindicaciones salvajemente desiguales, y muchos de ellos han pasado sus vidas siendo pasadas por la rama que sostenía el trono. El Consejo acaba de quitar esa rama de la ecuación.\n\nHay príncipes mayores cuyos nombres solos establecerían una provincia. No hay primos de ninguna distinción particular que estarían agradecidos por una gobernación y recuerden quién se la dio. Y hay los que tienen dinero y quejas, que podrían ser traídos barato y auditados más tarde."
 SAU_events.165.t: "Loyalistas en las provincias"
 SAU_events.166.a: "Paga las casas mercantes. Compra el Hejaz correctamente."
 SAU_events.166.b: "Garrison. Se ajustarán."
 SAU_events.166.d: "La provincia de Makkah es Jeddah, las casas mercantes, la peregrinación y el Hejaz - una región que era un reino en su propio derecho hasta 1925 y nunca ha dejado de mencionarlo. Sus familias financiaron el estado antes de que el petróleo lo hiciera y nunca se han reconciliado plenamente con la regla Najdi.\n\nSe pueden comprar, y son caros. O la provincia puede ser enganchada, y se les puede recordar que la peregrinación pasa por los puestos de control ahora."
 SAU_events.166.t: "Provincia de Makkah"
 SAU_events.167.a: "Corten ellos. Concede lo que hay que reconocer."
 SAU_events.167.b: "Reasignar las sillas. Necesitamos la redacción ahora."
 SAU_events.167.d: "Medina sostiene la mezquita del Profeta y el establecimiento académico que creció alrededor de ella durante trece siglos. Sus juristas pueden describir al Consejo como una necesidad que la comunidad debe aceptar, o como una usurpación que debe soportar, y el texto viajará más allá de cualquier comunicado del Consejo.\n\nPueden ser juzgados, lo que significa concesiones y paciencia. O las sillas mayores pueden ser reasignadas a los hombres que ya están de acuerdo, lo cual es más rápido y que todos los estudiosos del mundo musulmán se darán cuenta."
 SAU_events.167.t: "Provincia de Al-Madinah"
 SAU_events.168.a: "Párate detrás del Rey. Borrow el título, no lo tomes."
 SAU_events.168.b: "La tutela pertenece al estado, no al hombre."
 SAU_events.168.d: "Fahd tomó el título Custodio de las Dos Mezquitas Santas en 1986, dejando a un lado a Majestad por algo que reclamaba lo que ningún otro gobernante musulmán podía reclamar. Es lo más valioso que la Casa de Saud posee y no se transfiere.\n\nEl Concilio no puede tomarlo de un Rey viviente. Puede estar detrás de él cuando lo usa, y ser visto hacerlo - que le da legitimidad al Consejo y recuerda a todos cuya legitimidad es. O puede anunciar que la tutela descansa con el Estado en lugar del hombre, y descubrir cómo el mundo musulmán toma eso."
 SAU_events.168.t: "Guardianes de las dos mezquitas"
 SAU_events.169.a: "Comiencen con los comités de la Provincia Oriental."
 SAU_events.169.b: "Coloque los sermones bajo revisión."
 SAU_events.169.c: "Comience con los firmantes de la petición."
 SAU_events.169.d: "Los Mabahith no necesitaban construir nada. Los gabinetes del Ministerio del Interior mantienen a los organizadores de la Provincia Oriental por nombre y calle, los predicadores de Sahwa por sermón y fecha, y los hombres que firmaron la petición de 2003 y la firmaron nuevamente en 2007. El ministerio que reunió todo esto siempre fue cuidadoso con él, porque los hombres en los archivos tenían primos en el ministerio. El Consejo no tiene primos."
 SAU_events.169.e: "Coge los tres archivos juntos."
 SAU_events.169.t: "Los archivos ya están abiertos"
 SAU_events.17.a: "Responderemos a esto."
 SAU_events.17.d: "Militants of [ROOT.SAU_GetFrontName] han soltado un bombardeo de cohetes a través de la frontera. Las sirenas caen sobre nuestras ciudades mientras las familias se agitan por refugio y el daño es elevado."
 SAU_events.17.t: "Rockets Strike Nuestros Pueblos"
 SAU_events.170.a: "En la corte abierta, y televisado."
 SAU_events.170.b: "Arréglalo en el Ritz, como antes."
 SAU_events.170.c: "Perdón, a la tasa de marcha."
 SAU_events.170.d: "Los contadores han terminado, y las cifras son peores que los rumores. Ministerios que no construyeron nada, comisiones sobre aviones que nunca fueron entregados, una década de los ingresos del Reino que simplemente pararon en algún lugar entre el tesoro y el contratista. Al país le van a decir algo de esto. La única pregunta es cuánto pasa frente a una cámara, y cuánto se instala en un hotel con las puertas cerradas."
 SAU_events.170.t: "Príncipes en el muelle"
 SAU_events.171.a: "Pensarlos, generosa y permanentemente."
 SAU_events.171.b: "Exilie las líneas de alto nivel."
 SAU_events.171.c: "Proseguir, y confiscar lo que se encuentra."
 SAU_events.171.d: "Abdulaziz tenía cuarenta y cinco hijos registrados y el Reino ha pasado setenta años absorbiendo las consecuencias. Hay varios miles de ellos ahora, trayendo estipendios, sosteniendo gobernaciones, casados en cada casa mercante de Jeddah a Hofuf. Ninguno de ellos individualmente es una amenaza para el Consejo. Todos ellos juntos son el único gobierno alternativo que el país ha conocido, y no pueden simplemente ser dejados donde están."
 SAU_events.171.e: "Déjalos ricos y ornamentales."
 SAU_events.171.t: "Cada uno de ellos una reclamación"
 SAU_events.172.a: "Reconozca el Consejo. La relación es con el país."
 SAU_events.172.b: "Reconozcanlos, y tomen algo por ello."
 SAU_events.172.c: "No tratamos con un consejo de coroneles."
 SAU_events.172.d: "La carta es corta. Señala que las obligaciones del Reino no cambian, que se cumplirán los objetivos de producción, que el personal estadounidense es seguro y que el Consejo acogería con beneplácito una pronta reunión. No menciona al Rey, las detenciones o la constitución. Washington ahora tiene que decidir lo que está mirando: un gobierno, o un grupo de oficiales que por casualidad están sentados donde solía estar un gobierno."
 SAU_events.172.t: "El Consejo escribe a Washington"
 SAU_events.173.a: "Puertos, ferrocarril y el corredor norte."
 SAU_events.173.b: "Capital, y sin condiciones adjuntas."
 SAU_events.173.d: "El embajador chino llegó cuatro días después de la misma noche, felicitó al Consejo por el restablecimiento del orden y se trasladó directamente al tema de la entrega en Yanbu. No hubo referencia al Rey, a las detenciones o a la constitución. Es la conversación más directa que el ministerio extranjero del Reino ha tenido en una década, y todo el mundo en la habitación entiende precisamente lo que se vende."
 SAU_events.173.t: "Ninguna pregunta"
 SAU_events.174.a: "Admítelos, una vez que Riyadh se asiente con Teherán."
 SAU_events.174.b: "La solicitud es rechazada."
 SAU_events.174.c: "Admítelos. No hay condiciones."
 SAU_events.174.d: "La solicitud saudita de miembros completos llega a la Secretaría sin preámbulo ni condiciones que se le adjuntan, lo cual es en sí mismo una declaración. La Organización nunca ha admitido un estado del Golfo. También nunca ha rechazado a un productor de petróleo en escala de fundaciones que preguntó cortésmente. La pregunta en Beijing no es si Riyadh es útil - que fue resuelto hace años - pero si admitirlo significa importar una disputa que la Organización ha pasado dos décadas evitando."
 SAU_events.174.t: "Una aplicación de Riyadh"
 SAU_events.175.a: "Restaurar el entendimiento con Teherán."
 SAU_events.175.b: "No nos dirán quiénes son nuestros vecinos."
 SAU_events.175.d: "La respuesta es cortés e inequívoca. China patrocinará la solicitud, presidirá el voto y llevará a los miembros más pequeños - y a cambio el entendimiento corregido en Beijing en 2023 será restaurado por escrito, embajadas y todos. La Organización no quiere un miembro que va a pasar cada cumbre discutiendo con otro miembro. Riyadh se le pide que compre su asiento con una firma, no con aceite."
 SAU_events.175.t: "Términos de Beijing"
 SAU_events.176.a: "Fíjate, y sigue adelante."
 SAU_events.176.d: "No se da ninguna razón, porque no se requiere ninguno. La comunicación agradece al Reino por su interés, señala el valor del diálogo continuo y cierra. Riyadh ha sido rechazado por una organización que estaba asegurada tomaría a cualquiera, y la negativa será leída correctamente en cada capital que importa."
 SAU_events.176.t: "La aplicación está destilada"
 SAU_events.177.a: "Tome asiento."
 SAU_events.177.d: "La votación es unánime, lo que significa que se resolvió antes de ser tomada. El Reino se une como miembro pleno sin condiciones previas, sin período probatorio y sin referencia alguna a la forma en que su actual gobierno llegó al cargo. Ese silencio es todo lo que se ha comprado."
 SAU_events.177.t: "Admitido sin condiciones"
 SAU_events.178.a: "Los barriles se mueven como antes."
 SAU_events.178.d: "El reconocimiento llega como una declaración de dos líneas emitida el viernes por la tarde, donde Washington pone las cosas que preferiría que nadie examinara. El embajador vuelve la semana siguiente. Nada en la relación comercial se renegocia y nada sobre los últimos seis meses es mencionado por ambos lados, luego o después."
 SAU_events.178.t: "Negocios como Usual"
 SAU_events.179.a: "Concedan el acceso. Es lo que cuesta el reconocimiento."
 SAU_events.179.b: "El reconocimiento en esos términos no es un reconocimiento."
 SAU_events.179.d: "Washington reconocerá al Consejo, y ha adjuntado un calendario a la oferta: acceso ampliado en el Príncipe Sultán, derechos de preposición en la Provincia Oriental, y sobrevuelo permanente. El razonamiento no está escondido. Un gobierno que necesita reconocimiento lo suficiente para pedirlo es un gobierno que puede ser acusado por él, y el Consejo preguntó primero."
 SAU_events.179.t: "Reconocimiento, a un precio"
 SAU_events.18.a: "Los cobardes pagarán."
 SAU_events.18.d: "Una campaña coordinada de bombardeos por [ROOT.SAU_GetFrontName] ha atravesado nuestras ciudades. Los muertos son contados como el público exige que el gobierno actúe."
 SAU_events.18.t: "Bombardeos en Nuestras Ciudades"
 SAU_events.180.a: "Entonces nos las arreglamos sin ellos."
 SAU_events.180.d: "La declaración se extiende a cuatro párrafos sobre el gobierno constitucional y el estado de derecho, y es emitida por un Departamento de Estado que no ha dicho nada comparable a la mitad de los vecinos del Reino. El Consejo lo lee, señala cuál de sus propios oficiales fue entrenado en Kansas, y lo archiva. La relación no termina. Simplemente deja de hablarse."
 SAU_events.180.t: "Washington Declines"
 SAU_events.181.a: "Reafirmadlo en su totalidad. Seguridad para el petróleo, como antes."
 SAU_events.181.b: "El aceite, sí. La garantía, no."
 SAU_events.181.c: "Deja que se lapse. Nunca fue escrito."
 SAU_events.181.d: "En febrero de 1945 Roosevelt y Abdulaziz se reunieron a bordo de un crucero en el Gran Lago Bitter y acordaron el arreglo que ha subscrito ochenta años de política: seguridad estadounidense, petróleo saudí. Ninguno firmó nada, que cada gobierno desde entonces ha encontrado conveniente. Riyadh ahora está pidiendo, formal y por escrito, para una respuesta a la pregunta que la vaguedad fue diseñada para evitar - era el trato hecho con un rey, o con un país?"
 SAU_events.181.t: "La pregunta de Quincy"
 SAU_events.182.a: "Nada está firmado. Nada tiene que ser."
 SAU_events.182.d: "No hay documento, porque nunca hubo un documento. Hay un grupo portador que no se va, una nota aprobada entre dos gobiernos que no serán publicados en ninguno de los dos países, y un acuerdo de combustible renovado durante veinte años en los términos antiguos. Ocho años después, el acuerdo ha sobrevivido a un cambio de dinastía por el método simple de nunca haber sido escrito."
 SAU_events.182.t: "El entendimiento sostiene"
 SAU_events.183.a: "Tomaremos la mitad de esas naves."
 SAU_events.183.d: "La relación comercial se confirma en cierto detalle y la relación de seguridad se describe, dos veces, como siendo objeto de examen. Riyadh entiende perfectamente la construcción: los tanques están garantizados y el Reino no lo es. Es la mitad de Quincy que no cuesta a Washington nada, ofrecido por una administración que ha contado el costo de la otra mitad."
 SAU_events.183.t: "La mitad de un Bargain"
 SAU_events.184.a: "Entonces el Reino se garantiza a sí mismo."
 SAU_events.184.d: "Sin declaración, sin rechazo, sin reunión. La solicitud es reconocida por un subsecretario adjunto y nunca contestada, y después de algunos meses se hace evidente que la no respuesta era la respuesta. No se han repudiado ochenta años de acuerdo. Simplemente se les ha permitido caducar, en silencio, de la forma en que tales cosas siempre terminan."
 SAU_events.184.t: "Garantía de nadie"
 SAU_events.185.a: "Deja que lean."
 SAU_events.185.b: "El Reino tiene una política exterior."
 SAU_events.185.d: "Cuatro meses después del nuevo reinado, la Organización de la Conferencia Islámica se reunió en Meca - el cuerpo que el rey Faisal construyó después de que Al-Aqsa se incendiara en 1969, convocado en su propia ciudad por su hermano menor. Se acordó un programa de acción de diez años y todos se fueron a casa. En los desordenes de los oficiales Guardia Nacional han estado leyendo los discursos más antiguos, los de 1973, y observando que Faisal no se detuvo en los programas. Mutaib bin Abdullah manda a la Guardia. No ha detenido la lectura."
 SAU_events.185.t: "La Cumbre de la Meca"
 SAU_events.186.a: "Fingelo abiertamente, en nombre del Reino."
 SAU_events.186.b: "Que la Guardia lo pague en silencio."
 SAU_events.186.c: "Hazlo entrar."
 SAU_events.186.d: "En 1969 Al-Aqsa se quemó y Faisal tuvo los jefes del mundo musulmán reunidos en Rabat dentro del mes; la Organización de la Conferencia Islámica existe debido a ello. El círculo alrededor de Mutaib quiere que la cumbre se convoque y la Liga Mundial Musulmana se financió abiertamente - en el nombre del Reino, a expensas del Reino, con la bandera del Reino en el podio.\n\n§HSentimiento fascista§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.186.t: "La memoria Rabat"
 SAU_events.187.a: "Faisal tiene un heredero después de todo."
 SAU_events.187.d: "RIYADH - El comandante de la Arabia Saudita Guardia Nacional ha pasado la semana haciendo, en miniatura, lo que su tío hizo en su totalidad. El presupuesto de la Liga Mundial Musulmana ha sido restablecido a algo cerca de su cuota de 1970, el Banco Islámico de Desarrollo debe ser recapitalizado fuera de los fondos de guardia-adyacente, y Mutaib bin Abdullah ha llamado - sin precedentes, para un comandante saudí en lugar de un ministro - para que la Organización de Cooperación Islámica sea convocada en sesión extraordinaria.\n\nEl rey Faisal fundó la Liga en Meca en 1962 y reunió a la Organización en Rabat en 1969, y en octubre de 1973 demostró lo que el Reino podría hacer el día que eligió actuar en lugar de mediar. La Guardia no es el estado y su comandante no es el Rey. Ambos puntos se están haciendo en Riyadh mucho más a menudo que hace un mes."
 SAU_events.187.t: "Faisal tiene un heredero"
 SAU_events.188.a: "Diga claramente lo que ya se dice en privado."
 SAU_events.188.b: "La guerra de Washington no es nuestra para narrar."
 SAU_events.188.d: "Hay divisiones americanas en Mesopotamia, en el lado lejano de una frontera que el Reino nunca ha podido cerrar. Cualquier cosa que Washington llame al acuerdo, cada predicador de Buraydah a Abha lo describe de la misma manera, y ninguno de ellos está siendo contradictorio por los hechos. El círculo alrededor de Mutaib ha dejado de discutir sobre si Faisal tenía razón acerca de Occidente. Se ha seguido hacia lo que sigue desde su derecho.\n\n§HSentimiento fascista§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.188.t: "La siguiente puerta de ocupación"
 SAU_events.189.a: "El Reino no reforma para ser aplaudido en el extranjero."
 SAU_events.189.b: "El siglo no nos espera."
 SAU_events.189.d: "Individualmente los decretos son modestos - una regla relajada aquí, un ministerio reestructurado allí, una profesión abierta a personas previamente no permitidas en ella. Juntos son el mayor cambio social desde que las escuelas tomaron niñas, y nadie en Riyadh pretende que fueron redactados sin un ojo sobre cómo leerían en Washington y Londres. Los púlpitos han notado la segunda parte más que la primera.\n\n§HSentimiento fascista§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.189.t: "El Reino abre"
 SAU_events.19.a: "Reforzar la frontera."
 SAU_events.19.d: "Los combatientes de [ROOT.SAU_GetFrontName] han cruzado la frontera, golpeando los depósitos militares antes de fundirse en la noche. Nuestras fuerzas se apresuran a responder."
 SAU_events.19.t: "Incursión cruzando la frontera"
 SAU_events.190.a: "Haga la pregunta de Faisal en voz alta."
 SAU_events.190.b: "La reserva no es un arma."
 SAU_events.190.d: "Otro capital musulmán, otra campaña aérea estadounidense, otra declaración saudí que exhorta a todas las partes. El círculo alrededor de Mutaib ha renunciado a las declaraciones de redacción. Circula una pregunta en su lugar, y es precisamente la pregunta que Faisal respondió en octubre de 1973: ¿Cuál es el uso de la mayor reserva petrolera en la tierra si nunca se recoge?\n\n§HSentimiento fascista§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.190.t: "La próxima guerra"
 SAU_events.191.a: "Deja que corra. Debería ser visto en su cabeza."
 SAU_events.191.b: "Canalizarlo a través de los ministerios."
 SAU_events.191.c: "Dispersión antes de que nombre a un rey."
 SAU_events.191.d: "Ha dejado de ser una conversación entre oficiales. El retrato de Faisal está en las ventanas de la calle Olaya; los sermones del viernes en Buraydah y Unaizah han estado en el mismo tema durante seis semanas; y los propios conscriptos de la Guardia están citando a sus instructores de 1973. Nadie organizó esto y todo el mundo reconoce dónde apunta. Mutaib bin Abdullah no ha dicho nada en público, que es ahora leer como un comunicado.\n\n§HSentimiento fascista§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.191.t: "La calle recuerda a Faisal"
 SAU_events.192.a: "La respuesta de Faisal. Dilo en sus palabras."
 SAU_events.192.b: "Abre el tesoro a los que están bajo fuego."
 SAU_events.192.c: "Una declaración instando a que se restrinja a todas las partes."
 SAU_events.192.d: "Las fuerzas israelíes están en acción contra un estado árabe, y la televisión del Reino la lleva viva e ininterrumpida. Dentro de un día los carteles son americanos tanto como israelíes - el avión, las municiones, el veto que seguirá en el Consejo de Seguridad. Este es el terreno elegido por Faisal en 1973 y el argumento no ha cambiado en el intervalo: el Reino tiene la mayor reserva petrolera en la tierra y nunca ha estado dispuesto a recogerla.\n\n§HSentimiento fascista§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.192.t: "Otra guerra, y la misma pregunta"
 SAU_events.193.a: "Deja que el registro demuestre que fue arreglado en una mesa."
 SAU_events.193.d: "Corre a sesenta páginas y recomienda casi exactamente lo que los coroneles pidieron en primer lugar, que es lo que sucede cuando se permite a una comisión elegir sus propios miembros. Las promociones son miradas, los atrasos están cerrados, y los oficiales que fueron nombrados en los archivos del Ministerio del Interior se les dice silenciosamente que los archivos han sido cerrados también.\n\nNo habrá golpe. A los soldados del Reino se les ha dado una razón para no ser los que lo terminan, y para un ejército que generalmente es suficiente."
 SAU_events.193.t: "La comisión informa"
 SAU_events.194.a: "Entonces está de acuerdo. Pon la pregunta a todos ellos."
 SAU_events.194.b: "El Reino responderá por sí mismo al Yemen."
 SAU_events.194.d: "Llegan durante un solo fin de semana y la agenda nunca se publica. Kuwait envía al Jeque Mohammed Al-Khalid Al-Sabah, Viceprimer Ministro y Ministro del Interior; Qatar envía a su Primer Ministro, el Jeque Abdullah bin Nasser Al Thani, que también tiene la cartera de interiores. Los Emiratis ya están en el edificio.\n\nLa capital ha caído con los Houthis y el presidente reconocido está en algún lugar al sur de ella sin ningún ejército digno del nombre. La pregunta antes de la sala no es si el Golfo puede actuar. Es si el Golfo actúa como una firma o como varios - y cada estado en el pasillo decidirá eso por sí mismo."
 SAU_events.194.t: "La reunión de Riyadh"
 SAU_events.195.a: "Firma. Por todos los medios necesarios."
 SAU_events.195.b: "Yemen no será rescatado en un protectorado."
 SAU_events.195.d: "La solicitud saudí se somete directamente al Presidente, y no es una oferta de ayuda tanto como una petición de permiso. Riyadh quiere una carta: un llamamiento al Consejo de Seguridad y un llamamiento separado a los estados del Consejo de Cooperación del Golfo, pidiéndoles que intervengan §Y por todos los medios necesarios§!.\n\nUn gobierno reconocido puede legalmente invitar a las fuerzas extranjeras a su propio suelo, y esa carta es la base jurídica completa de lo que sigue. Firmada, trae las fuerzas aéreas del Golfo. Sin firmar, la República se enfrenta a los Houthis con lo que todavía tiene - y mantiene el derecho de decir después que nunca fue cliente de nadie."
 SAU_events.195.t: "La cuestión de Riad"
 SAU_events.196.a: "La tormenta decisiva comienza."
 SAU_events.196.b: "Aire y mar sólo. Ningún soldado saudí cruza la frontera."
 SAU_events.196.d: "El anuncio no se hace en Riad. Adel al-Jubeir, embajador del Reino en Estados Unidos, lo lee en la embajada de Washington mientras que los primeros aviones ya son aéreos - una elección de lugar que cuenta a cada capital del mundo que fue consultado y cuándo.\n\nOperación Tormenta Decisiva. Los estados que contestaron la invitación son nombrados como participantes, algunos de los cuales aprenden el alcance de su participación desde la emisión. El objetivo declarado es la restauración del gobierno legítimo. No se da la fecha final, y no se pide ninguna.\n\n§HCoalition partners§!: §Y [?SAU_coalition_partners|0]§!"
 SAU_events.196.t: "La Declaración"
 SAU_events.197.a: "El Golfo ha ido a la guerra."
 SAU_events.197.d: "WASHINGTON - Una coalición liderada por Arabia Saudita inició operaciones aéreas sobre Yemen esta noche, anunciada desde la embajada saudí aquí en lugar de Riad. El Reino cita una solicitud escrita del reconocido Presidente del Yemen y las disposiciones de defensa colectiva del Consejo de Cooperación del Golfo.\n\nTeherán ha condenado la operación y niega armar el movimiento Houthi. Washington ha confirmado que está proporcionando apoyo logístico e de inteligencia mientras no comete ningún avión propio. Ningún miembro de la coalición ha ofrecido una estimación de cuánto tiempo se espera que dure la campaña."
 SAU_events.197.t: "Operación Tormenta Decisiva"
 SAU_events.198.a: "Volaremos con el Reino."
 SAU_events.198.b: "Esta no es nuestra guerra."
 SAU_events.198.d: "La solicitud llega a través del embajador saudí y es inusualmente directa: aeronaves, o las tripulaciones para prestarles servicios, o en el último recurso un nombre en la comunicación. El Reino está reuniendo una coalición contra el avance de Houthi y preferiría no reunirlo solo.\n\nUnirse compra una gran cantidad de crédito en Riad y una parte de lo que sigue. Declining cuesta ese crédito y nada más - y la guerra no tiene fecha final adjunta a él."
 SAU_events.198.t: "Riyadh nos pide que volemos"
 SAU_events.199.a: "Entonces no iremos donde no nos pidan."
 SAU_events.199.b: "No necesitamos su firma."
 SAU_events.199.d: "La respuesta de Sanaa es cortés, sin prisa y totalmente negativa. No habrá ningún llamamiento al Consejo de Seguridad ni ninguna petición al Golfo, y el Reino está agradecido por su preocupación en la reserva de los gobiernos lingüísticos por la preocupación que se proponen ignorar.\n\nSin esa carta no hay invitación, y sin invitación una campaña aérea sobre el Yemen es simplemente una campaña aérea sobre el Yemen. Riyadh todavía puede actuar. Lo hará por cuenta propia, y cada capital lo grabará de esa manera."
 SAU_events.199.t: "La carta no viene"
 SAU_events.2.a: "¡Larga vida al Rey!"
 SAU_events.2.d: "Abdullah bin Abdulaziz Al-Saud ha sido proclamado oficialmente Rey de Arabia Saudita y Custodio de las Dos Mezquitas Santas. Habiendo servido como gobernante de facto desde 1995, su ascensión formal trae estabilidad y continuidad al Reino. El rey Abdullah es conocido por sus cautelosas tendencias reformistas y sus esfuerzos para promover el diálogo interreligioso."
 SAU_events.2.t: "Rey Abdullah Ascend el Trono"
 SAU_events.20.a: "Jaysh al-Islam (Armía del Islam)"
 SAU_events.20.b: "Ansar al-Haramayn (Defensores de las dos mezquitas santas)"
 SAU_events.20.c: "Kata'ib al-Aqsa (Brigas Al-Aqsa)"
 SAU_events.20.d: "El nuevo movimiento respaldado por Arabia Saudita necesita un nombre antes de que se anuncie al mundo. Su bandera elegida definirá cómo los partidarios y enemigos hablan de ella."
 SAU_events.20.e: "Liwa al-Tawhid (Brigada del Monoteísmo)"
 SAU_events.20.t: "Un nombre para el frente"
 SAU_events.200.a: "La reforma en la medida en que los ministerios lo llevarán."
 SAU_events.200.b: "Sólo el nombre de los decretos ha cambiado."
 SAU_events.200.c: "Abre la economía y deja que la política siga."
 SAU_events.200.d: "Fahd es enterrado en Al Oud en una tumba sin marcar, como requiere la doctrina, y Abdullah es Rey en su propio nombre después de una década de gobernar en el de otra persona. Las condolencias llegan de noventa capitales y la primera reunión del gabinete se celebra la misma semana.\n\nTodo lo que ha querido hacer ya que el trazo es ahora su orden en lugar de proponerlo, y los ministerios lo saben. Lo que aún no saben es lo mucho que todavía tiene la intención. Hay hombres en ese gabinete que han pasado diez años asumiendo que la respuesta fue muy poco."
 SAU_events.200.t: "Un nuevo Reino"
 SAU_events.201.a: "Que el Consejo de Allegiación reine la sucesión."
 SAU_events.201.b: "El Rey nombra a su heredero. El Consejo lo aplaudirá."
 SAU_events.201.c: "Compra el consentimiento de la familia."
 SAU_events.201.d: "La sucesión ha sido resuelta por la antigüedad entre hermanos desde 1953, que trabajaban mientras había hermanos y mientras podían estar de acuerdo. Hay menos de ambos cada año, y las dos últimas transiciones fueron administradas por hombres que ya no están vivos para manejar el próximo.\n\nLa propuesta sobre la mesa es un consejo permanente de los hijos y nietos de Abdulaziz, facultado para confirmar a un príncipe heredero y gobernar sobre la aptitud de un rey. Sería el primer procedimiento escrito que el trono ha tenido. También sería el primer cuerpo en la historia del Reino con una reclamación sobre el Rey mismo, y no todo el mundo en la habitación no ha notado eso."
 SAU_events.201.t: "Consolidación de la Corona"
 SAU_events.202.a: "Que hablen, y publiquen lo que dicen."
 SAU_events.202.b: "Pueden reunirse. La agenda es nuestra."
 SAU_events.202.d: "El salón está arreglado para que un clérigo chiíta de Qatif se sienta a poca distancia de hablar de un académico salafi de Riad, y las mujeres están presentes, detrás de una pantalla, por primera vez en la historia del Reino. Nada decidido aquí ata a nadie. Esa es la cuestión y también la objeción a ella.\n\nLos delegados dirán lo que se les permite decir. Lo mucho que no se ha resuelto, y los dos hombres que lo resolverán están en desacuerdo: uno sostiene que una sesión que no cambia nada es peor que ninguna sesión, la otra que una sesión que cambia algo es la primera de una serie que nadie controla."
 SAU_events.202.t: "El Diálogo Nacional"
 SAU_events.203.a: "Tome la oferta de Washington en su totalidad."
 SAU_events.203.b: "Los Mabahith se encargarán de sí mismos."
 SAU_events.203.c: "Rehabilitarlos. Las prisiones sólo hacen más."
 SAU_events.203.d: "Los compuestos de Al Hamra e Ishbiliya fueron bombardeados por hombres que crecieron aquí, fueron escolarizados aquí, y fueron financiados a través de organizaciones benéficas registradas aquí. Sea cual fuere la disputa que se suponía que era, ahora es demostrable con el Reino mismo.\n\nWashington ofrece una célula de enlace, integración de listas de vigilancia y acceso a señales que nunca ha compartido con nadie en la región. Aceptar significa oficiales estadounidenses leyendo archivos saudíes. Refusing significa hacer esto solo, en un país donde mucha gente está de acuerdo con los bombarderos."
 SAU_events.203.t: "Cooperación en la lucha contra el terrorismo"
 SAU_events.204.a: "La mitad de los asientos, y hombres en los rollos."
 SAU_events.204.b: "Nombra a todos y llámalo consulta."
 SAU_events.204.c: "Pongan a las mujeres en los rollos también."
 SAU_events.204.d: "La mitad de los escaños en los consejos municipales, elegidos; la otra mitad nombrada; y los mismos concejos tienen autoridad sobre drenaje, iluminación callejera y permisos de construcción. Nadie en el palacio pretende que esto es una transferencia de poder.\n\nEl argumento en contra no es que los consejos hagan daño. Es que los saudíes habrán votado, y que un precedente, a diferencia de un decreto, no puede retirarse silenciosamente el año siguiente."
 SAU_events.204.t: "Celebración de elecciones municipales"
 SAU_events.205.a: "Fue asesor para el último."
 SAU_events.205.d: "El Consejo se encontraba en sesión cuando llegó el orden y la orden no se explicaba. Los miembros fueron agradecidos por su servicio en un comunicado de cuatro líneas, el edificio estaba cerrado, y los archivos que habían pasado años se les permitió leer regresar a los ministerios de los que procedían.\n\nSe sentó junto a la licencia del Rey. No hay rey, o ya no hay uno de la Casa de Saud, y por lo tanto no hay consejo. Nadie en Riyadh esperaba que sobreviviera la semana y nadie lo ha dicho en voz alta."
 SAU_events.205.t: "El Consejo está disuelto"
 SAU_events.206.a: "Deja que pase."
 SAU_events.206.b: "La Corona retiene el consentimiento."
 SAU_events.206.d: "El banco reformista lo ha costado a sí mismo, que es nuevo, y el costo es optimista, lo cual no lo es. Caminos a las aldeas que la red de troncos saltó, agua a los distritos que todavía lo compran por el buque cisterna, y una cláusula que exige al ministerio publicar lo que pasa.\n\nEs la última cláusula que el ministerio objeta."
 SAU_events.206.t: "El proyecto de ley de reformadores"
 SAU_events.207.a: "Deja que pase."
 SAU_events.207.b: "La Corona retiene el consentimiento."
 SAU_events.207.d: "El banco tradicionalista propone lo que siempre ha propuesto y nunca antes ha podido votar: las dotaciones financiadas correctamente, los subsidios de vivienda recaudados, y un calendario de clínicas para las provincias que han ido sin uno desde el auge.\n\nEl ministerio financiero describe la aritmética como aspiracional. El banco responde que la aritmética ha sido aspiracional en la otra dirección durante treinta años."
 SAU_events.207.t: "El proyecto de ley de los tradicionalistas"
 SAU_events.208.a: "Deja que pase."
 SAU_events.208.b: "La Corona retiene el consentimiento."
 SAU_events.208.d: "Los miembros provinciales se han combinado, que nadie en Riyadh esperaba que manejaran. Los cupos saudíes de contratación con dientes en ellos, el fin de los arreglos de patrocinio que vinculan a un trabajador con un empleador, y una inspección que informa al Consejo en lugar del ministerio que inspecciona.\n\nCada casa mercante en Jeddah ha escrito al palacio esta semana. El banco lo sabe, y ha programado el voto de todos modos."
 SAU_events.208.t: "El proyecto de ley provincial"
 SAU_events.209.a: "Treinta asientos, por decreto real."
 SAU_events.209.b: "La cámara permanece como está."
 SAU_events.209.d: "Treinta escaños, garantizados por decreto para que ningún futuro rey pueda dejar tranquilamente el número lapso - una quinta parte de la cámara. Entrarían por una puerta separada y se sentarían en una sección separada, y las fotografías viajarían mucho más allá del plan de asientos.\n\nCuarenta eruditos mayores han firmado una carta. La carta no amenaza nada, porque no es necesario."
 SAU_events.209.t: "Mujeres en el Consejo de Shura"
 SAU_events.21.a: "Mira los acontecimientos de cerca."
 SAU_events.21.d: "Un movimiento previamente desconocido que se llama [ROOT.SAU_GetFrontName] ha anunciado su existencia a través de la Ribera Occidental y dentro de las propias fronteras de Israel. En declaraciones coordinadas promete resistencia armada hasta la liberación, alegando una ola de ataques recientes como propia. Los servicios de inteligencia se agrupan para rastrear sus orígenes, su financiación y su alcance."
 SAU_events.21.t: "Un nuevo frente en la Tierra Santa"
 SAU_events.210.a: "El Golfo no pierde una monarquía."
 SAU_events.210.d: "MANAMA - Armadura saudita cruzó el King Fahd Causeway antes del amanecer y llegó a la capital sin disparar. Riyadh describe el despliegue como una operación de Escudo de la Península realizada a petición del gobierno legítimo de Bahrein, y se niega a explicar qué gobierno hizo la solicitud.\n\nTeherán lo ha llamado ocupación. Washington ha pedido moderación en todas las partes y no ha pedido a nadie que se vaya. La Casa de Khalifa está de vuelta en el palacio, y la disposición que lo puso allí es ahora una cuestión de registro público en lugar de comprensión privada."
 SAU_events.210.t: "La Causa"
 SAU_events.211.a: "Bomba. Los campos son la estrategia."
 SAU_events.211.b: "Construye la industria que sobrevive los pozos."
 SAU_events.211.c: "Encuesta. Hay más ahí fuera."
 SAU_events.211.d: "Abqaiq procesa la mayor parte del crudo del Reino en una instalación y Ras Tanura lo carga en otra. Dos huelgas exitosas harían más daño a la economía mundial que cualquier ejército de la región podría manejar en un año, y el ministerio finalmente se le ha pedido que diga en voz alta lo que pretende hacer al respecto.\n\nHay dinero para una respuesta, no tres. Bombardea más fuerte mientras los campos están seguros; construye la industria que sobreviviría perderlos; o deja de asumir los campos que el Reino ya tiene son todos los campos que hay."
 SAU_events.211.t: "Estrategia de Defensa del Petróleo"
 SAU_events.212.a: "Que el banco llegue hacia arriba."
 SAU_events.212.d: "La ley siempre es adecuada. Lo que faltaba era cualquier banco dispuesto a aplicarlo hacia arriba - un tribunal que podría convocar a un ministro, una comisión que podría abrir las cuentas de un príncipe, y un juez que todavía tendría una carrera después.\n\nFuncionará exactamente así como la paciencia del Rey con él, y todo el que pueda ser convocado sabe eso. El dinero ya deja de mover la semana se anuncian los tribunales."
 SAU_events.212.t: "Los tribunales de corrupción"
 SAU_events.213.a: "Nadie está por encima del archivo."
 SAU_events.213.d: "Unos doscientos príncipes, ministros y hombres de negocios se celebran en el hotel más caro del país durante meses. Se dice que se recuperan cien mil millones de dólares. No se publican cargos, no se dictan veredictos y los comunicados se negocian uno a la vez.\n\nSe describe como una campaña anticorrupción. Funciona como el momento en que la familia dejó de ser un colectivo y empezó a ser una audiencia, y cada inversionista en la tierra vio que sucede."
 SAU_events.213.t: "El Ritz-Carlton"
 SAU_events.214.a: "Tranquilízate. Siempre iba a serlo."
 SAU_events.214.d: "Los lanzamientos se negocian uno a la vez y los términos nunca se publican: una empresa firmada aquí, una fundación disuelta allí, la posición de un hijo tranquilo garantizado. Todos los involucrados entienden que estos no son instrumentos legales sino políticos.\n\nEl dinero vuelve al país casi a la vez, porque los hombres que lo devuelven ahora tienen una razón para mantenerlo donde se puede observar. El archivo en cada uno de ellos permanece abierto en un cajón en Riyadh."
 SAU_events.214.t: "Ofertas de backdoor"
 SAU_events.215.a: "La familia tendrá que encontrar algo más de lo que discutir."
 SAU_events.215.d: "Los príncipes seguían contando el apoyo del otro cuando los oficiales dejaron de contar nada. No hay heredero de nombre, porque no hay trono que heredar - el Concilio ha quitado la cuestión de la mesa y no tiene la intención de volver a ponerla.\n\nLos hombres que pasaron los últimos años reuniendo sus facciones han descubierto que una facción sólo vale lo que vale la institución detrás de ella, y que la institución detrás de todos ellos era la monarquía."
 SAU_events.215.t: "La Sucesión está cerrada"
 SAU_events.216.a: "Que lo prediquen abiertamente."
 SAU_events.216.b: "Mantenlo en los líos."
 SAU_events.216.c: "Diles que el Reino tiene un Rey a la vez."
 SAU_events.216.d: "La gente de Mutaib ha puesto la misma pregunta al Diwan por tercera vez este año, y esta vez no se han molestado en decirlo como una pregunta. El Reino se llama guardián de las dos mezquitas y se comporta como un cliente. Faisal no lo hizo. Eso es todo el argumento y no se complica más al examinarlo.\n\nLa sucesión es inestable, lo que significa que todo lo dicho ahora se dice delante de los hombres que están eligiendo lados."
 SAU_events.216.t: "El Círculo pregunta otra vez"
 SAU_events.217.a: "El Reino continúa."
 SAU_events.217.d: "Riyadh ha anunciado la muerte del rey Fahd bin Abdulaziz Al Saud, que ocupó el trono durante veintitrés años y, desde el derrame de 1995, celebró muy poco del trabajo que vino con él. El Reino que sale fue gobernado en su nombre y en la mano de su hermano durante una década, y la transición anunciada esta mañana cambia el título en los documentos en lugar del hombre que los firma.\n\nCrown Prince Abdullah se adhiere. Ya ha pasado los ochenta. Los hombres que importan no le están mirando - ellos lo están viendo más allá de él, a quien se llama el próximo."
 SAU_events.217.t: "La muerte del rey Fahd"
 SAU_events.218.a: "La sucesión es la historia ahora."
 SAU_events.218.d: "El rey Abdullah bin Abdulaziz Al Saud está muerto, y con él va el último de los hermanos que podrían reclamar el trono solo en la antigüedad sin que nadie haga una segunda pregunta. Fue enterrado en una tumba sin marcar en Al-Oud, como el rito requiere y como todo rey ante él ha sido.\n\nSalman se adhiere dentro de horas. Lo que sigue es la parte que el Reino ha aplazado durante treinta años: la corona debe eventualmente pasar a una generación que no tiene ninguna reivindicación automática, y cada príncipe ahora vivo lo sabe."
 SAU_events.218.t: "La muerte del rey Abdullah"
 SAU_events.219.a: "Viva el Rey."
 SAU_events.219.d: "El Rey está muerto. Riyadh ha liberado el anuncio con la economía del lenguaje que se reserva para el trono, y el Príncipe Heredero ya ha recibido la bay'ah de los príncipes mayores, el ulema, y los hombres que mandan a la Guardia.\n\nEl reinado que termina hoy comenzó con un anciano y un Reino que todavía corrió en el entendimiento de que la corona se movía de lado entre hermanos. Termina con ese entendimiento desaparecido, desmantelado por el propio Rey, a favor de una sucesión que se ha invitado al mundo a considerar resuelto."
 SAU_events.219.t: "La muerte del rey Salman"
 SAU_events.22.a: "Deja que el aceite fluya hacia el sur."
 SAU_events.22.b: "Nuestra tierra no es una carretera saudita."
 SAU_events.22.d: "Los saudíes piden dirigir un oleoducto a través de nuestras provincias del sur al Mar Arábigo. Las tarifas de tránsito llenarían nuestro tesorería, y Riyadh nos debía un favor que no podía pagar fácilmente."
 SAU_events.22.t: "Una tubería al mar"
 SAU_events.24.a: "Construye el oleoducto."
 SAU_events.24.b: "Descansa la oferta."
 SAU_events.24.d: "Arabia Saudita ofrece dirigir su petróleo a través de nuestra tierra hacia Turquía y Europa. Iraq se convertiría en el puente entre el Golfo y Occidente, y los ingresos de tránsito reconstruirían la nación."
 SAU_events.24.t: "El Pipeline a Europa"
 SAU_events.25.a: "Envíalos a casa con las manos vacías."
 SAU_events.25.d: "La Casa de Saud envía enviados que proponen un oleoducto a través de nuestro suelo. Olvidan quién manda aquí. Iraq no se inclina a nadie, menos a Riyadh."
 SAU_events.25.t: "Un Enviado de la Arabia Saudita en Bagdad"
 SAU_events.26.a: "Excelente."
 SAU_events.26.d: "Los Welders ponen la sección final y las válvulas se abren. La cruda saudí ahora fluye a lo largo de una nueva arteria al mar, y el agarre del Reino sobre la energía del mundo se endurece."
 SAU_events.26.t: "Los flujos de aceite"
 SAU_events.27.a: "Encontraremos otra manera."
 SAU_events.27.d: "El trato ha caído. Por ahora, esta ruta al mar permanece más allá de nuestro alcance, y Hormuz sigue siendo nuestra única puerta."
 SAU_events.27.t: "La ruta está cerrada"
 SAU_events.28.a: "Un contratiempo costoso."
 SAU_events.28.d: "La guerra ha alcanzado el oleoducto. Los Saboteadores han volado una sección a la ruina y el aceite ha dejado de fluir. Hasta que el sur de Yemen esté asegurado, se pierde la ruta del Mar Arábigo."
 SAU_events.28.t: "El Pipeline está severizado"
 SAU_events.29.a: "Abre la ruta."
 SAU_events.29.b: "Declina a los saudíes."
 SAU_events.29.d: "Riyadh pide dirigir un oleoducto a través de nuestro reino hacia el Mediterráneo. Las tarifas de tránsito por sí solas establecían nuestras finanzas, y los saudíes son amigos generosos."
 SAU_events.29.t: "Un oleoducto por Jordania"
 SAU_events.3.a: "Acepta la oferta saudita."
 SAU_events.3.b: "Desclina la oferta saudí."
 SAU_events.3.d: "Riyadh ofrece a las empresas chinas acceso a proyectos agrícolas y energéticos saudíes. Aceptar profundizaría los vínculos económicos entre China y el Reino."
 SAU_events.3.t: "[SAU.GetFlag] Trato saudí-China [CHI.GetFlag]"
 SAU_events.30.a: "Bienvenida al gasoducto."
 SAU_events.30.b: "Siria no está a la venta."
 SAU_events.30.d: "Con el acuerdo de Jordania, los saudíes proponen llevar su petróleo a través de nuestra tierra al mar. Una Siria libre y próspera se beneficiaría muy bien, y la amistad de Riyadh vale la pena."
 SAU_events.30.t: "Una oferta de Riyadh"
 SAU_events.300.a: "Tecnócratas independientes."
 SAU_events.300.b: "La supervisión real es esencial."
 SAU_events.300.c: "Traigan expertos extranjeros."
 SAU_events.300.d: "El §LCapital Market Law§! Ahora debemos decidir: quién se sentará a la cabeza del nuevo §LCapital Market Authority§!Los tecnócratas exigen la independencia; §HRoyal Court§! exige supervisión; los asesores extranjeros ofrecen su experiencia. La elección definirá la arquitectura financiera del reino para una generación."
 SAU_events.300.t: "§H Decreto Real M/30 - Implementación§!"
 SAU_events.301.a: "El marco anglosajón."
 SAU_events.301.b: "El marco Sharia-primer."
 SAU_events.301.c: "Un modelo híbrido."
 SAU_events.301.d: "La incorporación formal remodela el paisaje corporativo. Empresas mixtas, Sociedades de responsabilidad limitada – el §LKingdom§! debe elegir su modelo. El marco §LAnglo-Saxon§! ofrece eficiencia a costa de la influencia extranjera; el marco §LSharia-first§! ofrece legitimidad al costo de la velocidad; el §Lhibrid§! toma un camino medio medido."
 SAU_events.301.t: "§HLas Reformas Legales de 2007§!"
 SAU_events.310.a: "Formación Americana & Asociación"
 SAU_events.310.b: "Defensa colectiva del GCC"
 SAU_events.310.c: "NATO-Style Professionalism"
 SAU_events.310.d: "Autosuficiencia nacional"
 SAU_events.310.desc: "Operación Tormenta del Desierto humilló a todos los ejércitos que lo vieron. Las Reales Fuerzas de Tierras sauditas actuaron adecuadamente al lado de sus socios de coalición, pero el Estado Mayor sabe la verdad: sin energía aérea estadounidense, logística y mando, el ejército del Reino no estaba listo.\n\nLos juegos de guerra han terminado, y el veredicto está dentro. Ahora el Reino debe elegir el modelo para reconstruir sus fuerzas armadas. Cada camino nos hace más fuertes de una manera y más débil en otra - no hay libre elección.\n\n§YPor encima de cada opción para ver exactamente lo que otorga y lo que cuesta.§!"
 SAU_events.310.t: "Juegos de guerra: Lecciones de la Guerra del Golfo"
 SAU_events.311.a: "Guardia Nacional: Guardia de Regime"
 SAU_events.311.b: "Guardia Nacional: Levíos tribales"
 SAU_events.311.c: "Guardia Nacional: Seguridad Interna"
 SAU_events.311.desc: "El Arabia Saudita Guardia Nacional debe decidir para qué es realmente. Cada camino es un cambio duradero - nos hace más fuertes de una manera y más débiles otra.\n\n§YPor otra parte, una opción para ver exactamente lo que otorga y cuesta.§!"
 SAU_events.311.t: "Guardia Nacional Perforaciones de levadura"
