 SAU_neom_aqaba_zone: "Zona Económica NEOM-Aqaba"
 SAU_neom_aqaba_zone_desc: "La megaciudad saudí de la NEOM y el puerto jordano de Aqaba operan como una sola zona económica transfronteriza, acelerando la construcción y alimentando el tesoro."
 SAU_oil_defend_price_idea: "Defender el precio"
 SAU_oil_defend_price_idea_desc: "Arabia Saudita ha reducido la producción para apoyar el precio mundial del petróleo. Esto mejora los ingresos por barril, pero sacrifica la cuota de mercado a los productores que mantienen su producción."
 SAU_oil_dependence_t1: "§GLa economía del petróleo§! - Diversified"
 SAU_oil_dependence_t1_desc: "§HLa dependencia del petróleo: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RCambió cada 3 meses automático§!\n\nUna economía moderna y diversificada. El petróleo es una exportación entre muchos - el Reino es §Gresiliente§! a cualquier precio del crudo puede hacer. Visión 2030, alcanzada."
 SAU_oil_dependence_t2: "§YLa Economía del Petróleo§!"
 SAU_oil_dependence_t2_desc: "§HLa dependencia del petróleo: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RCambió cada 3 meses automático§!\n\nLa industria, los servicios y la tecnología ahora tienen un peso real. Un choque de petróleo es sobrevivible, no catastrófico."
 SAU_oil_dependence_t3: "§YLa economía petrolera§! - Diversificación"
 SAU_oil_dependence_t3_desc: "§HLa dependencia del petróleo: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RCambió cada 3 meses automático§!\n\nLa economía se está expandiendo. El petróleo sigue siendo el pilar más grande, pero ya no es el único que importa."
 SAU_oil_dependence_t4: "§RLa Economía del Petróleo§! - Aceite-Dependiente"
 SAU_oil_dependence_t4_desc: "§HLa dependencia del petróleo: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RCambió cada 3 meses automático§!\n\nLos sectores no petroleros están creciendo, pero el crudo sigue pagando por casi todo. Un accidente de precio todavía dolería - mal."
 SAU_oil_dependence_t5: "§RLa economía petrolera§! - Total Petrostate"
 SAU_oil_dependence_t5_desc: "§HLa dependencia del petróleo: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RCambió cada 3 meses automático§!\n\nEl Reino vive y muere por el barril. §Gcasi todo§! del presupuesto - inmensamente rentable, pero §Rpeligrosamente expuesto§! a cualquier colapso en el precio mundial.\n§YLa dependencia del petróleo cambia sólo a través de sus enfoques y decisiones - las opciones del petróleo lo elevan, la diversificación lo baja. El Reino comienza profundamente dependiente; sólo una reforma sostenida lo reduce, y permanece donde usted lo deja.§!"
 SAU_oil_embargoed: "§REmbargo de la tierra§!"
 SAU_oil_embargoed_desc: "Arabia Saudita y sus socios de la OPEP han cortado el petróleo. Las colas de combustible, las cerraduras de fábrica y los precios alargados agarran la economía hasta que se levante el embargo."
 SAU_oil_for_security_pact: "Petróleo para Seguridad"
 SAU_oil_for_security_pact_desc: "El Reino mantiene los mercados americanos suministrados con petróleo, y Washington infrascribe la seguridad saudita. El arreglo ancla el riyal, el dólar y la casa de Saud por igual."
 SAU_oil_for_security_pact_loc: "[USA.GetFlag]Oil for Security\n§H Alimenta el multiplicador de ingresos de exportación:§! §G+5,00%§!\n"
 SAU_oil_for_security_pact_USA: "Petróleo para Seguridad"
 SAU_oil_for_security_pact_USA_desc: "Riyadh garantiza el flujo de petróleo a los mercados estadounidenses: combustible barato y fiable a cambio del paraguas de seguridad estadounidense."
 SAU_oil_market_share_idea: "Defendiendo la participación del mercado"
 SAU_oil_market_share_idea_desc: "Arabia Saudita mantiene una alta producción y acepta precios más bajos para preservar su parte del mercado petrolero. Sus bajos costos de extracción le permiten superar a los productores más caros."
 SAU_oil_price_collapse_idea: "Collapse de precio del petróleo"
 SAU_oil_price_collapse_idea_desc: "Los precios del petróleo están muy por debajo del nivel asumido por el presupuesto estatal. Los ingresos de exportación han disminuido mientras el gasto social sigue siendo elevado, obligando al gobierno a aprovechar sus reservas."
 SAU_OPEC_Russia_deal_new: "OPEC+ Coordinación"
 SAU_OPEC_Russia_deal_new_desc: "Riyadh y Moscú establecieron cuotas de producción juntas. Dos superpoderes petrolíferos dirigiendo un mercado."
 SAU_OPEC_Russia_deal_new_loc: "\n§H[SAU.GetFlag]OPEC+ Agreement[SOV.GetFlag]§!\n§HFossil Fuels Export Revenue Multiplier:§! §G+5,00%§!\n"
 SAU_pipeline_empire: "Encrucijada de la energía"
 SAU_pipeline_empire_desc: "Arabia Saudita tiene ahora rutas de exportación de petróleo a tres mares y ya no depende del Estrecho de Hormuz como su única salida importante."
 SAU_pipeline_transit_IRQ_t1: "Tráfico saudí de oleoductos (tierra I)"
 SAU_pipeline_transit_IRQ_t1_desc: "El petróleo saudí cruza Iraq, y las tarifas de tránsito aumentan el tesoro. El oleoducto eleva la producción petrolera de la nación. §GIngresos adicionales: $1.00B§!"
 SAU_pipeline_transit_IRQ_t2: "Transito de tubería saudita (Tier II)"
 SAU_pipeline_transit_IRQ_t2_desc: "El petróleo saudí cruza Iraq, y las tarifas de tránsito aumentan el tesoro. El oleoducto eleva la producción petrolera de la nación. §GIngresos adicionales: $1.15B§!"
