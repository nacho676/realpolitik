l_spanish:
 saudi_focus_tree: "Arabia Saudita Enfoque Árbol"
 SAU_crackdown_on_the_opposition: "Averiguamiento en la oposición"
 SAU_crackdown_on_the_opposition_desc: "El Mabahith mantiene extensos archivos sobre organizadores chiítas, clérigos sahwa y peticionarios liberales. El Consejo utilizará esos registros para identificar y suprimir la oposición al gobierno militar."
 SAU_modernisation_balance_of_power_category: "§HEl futuro de Krishna§!"
 SAU_shia_rights_reform: "Reforma de los derechos chiítas"
 SAU_shia_rights_reform_desc: "Codificar los derechos de los chiítas en la ley de la tierra.\n\n§G-Resistencia de Shia, +Estabilidad, + Población de Shia§!."
 SAU_trials_of_the_old_order: "Juicios del Antiguo Orden"
 SAU_trials_of_the_old_order_desc: "El Consejo perseguirá a los miembros de la antigua orden real en tribunales públicos. A diferencia de los asentamientos privados de la purga Ritz-Carlton 2017, estos procedimientos presentarán abiertamente los cargos y fallos, al mismo tiempo que sirven a los intereses políticos del Consejo."
 SAU_unif_command_control_tt: "§HSe establece una estructura unificada de mando y control en todas las fuerzas armadas del CCG§!."
 SAU_unif_cross_border_tt: "§YRequiere desarrollar infraestructura transfronteriza en la región fronteriza (nivel de infraestructura 3 o superior).§!"
 SAU_unif_exploit_authority_tt: "§YRequiere que el Reino sea la influencia extranjera líder en cada otro Estado miembro del CCG.§!"
 SAU_unif_increase_autonomy_tt: "§HLa autonomía regional facilita las quejas sectarias. La influencia doméstica crece y la radicalización retrocede.§!"
 HOU_houthi_resilience: "Ansar Allah resiliencia"
 HOU_houthi_resilience_desc: "Ansar Allah ha operado en el norte montañoso de Yemen durante décadas. Su familiaridad con el terreno y las posiciones montañosas establecidas hacen que las fuerzas de Houthi sean difíciles de deslegar."
 PER_houthi_defense_buff: "Fortificaciones de montaña"
 PER_houthi_defense_buff_desc: "Las defensas construidas por Irán convierten a las tierras altas en una fortaleza. +15% de defensa contra las fuerzas del gobierno."
 SAU_arab_shield_member: "Miembro del Escudo Árabe"
 SAU_arab_shield_member_desc: "Esta nación participa en los arreglos colectivos de defensa del Escudo Árabe, mejorando la defensa y moral de sus fuerzas armadas."
 SAU_aramco_01: "Saudi Aramco"
 SAU_aramco_01_desc: "La Saudi Arabian Oil Company es la empresa petrolera más grande del mundo, totalmente nacionalizada desde 1980. Aramco controla las vastas reservas petroleras del Reino y sirve como columna vertebral de la economía saudí, generando la mayoría de los ingresos gubernamentales. Si bien es inmensamente rentable, la empresa opera con transparencia limitada y todavía no ha modernizado su estructura corporativa."
 SAU_aramco_02: "Saudi Aramco - Operaciones ampliadas"
 SAU_aramco_02_desc: "Aramco ha ampliado sus operaciones más allá de la extracción de petróleo crudo, invirtiendo en refinar la capacidad, las empresas petroquímicas y las asociaciones internacionales. La creciente eficiencia de la empresa y su diversificada cartera han fortalecido su posición como piedra angular de la economía saudí."
 SAU_aramco_03: "Saudi Aramco - líder mundial de energía"
 SAU_aramco_03_desc: "Saudi Aramco se ha transformado en un gigante energético mundial moderno. Con una lista pública exitosa, operaciones de aguas abajo ampliadas e inversiones internacionales estratégicas, la empresa ahora es una de las corporaciones más valiosas del mundo. Sus ingresos alimentan no sólo el presupuesto del Reino sino también ambiciosos programas de desarrollo en toda la nación."
 SAU_aramco_downstream: "§HSaudi Aramco§! - Integración Intensiva"
 SAU_aramco_downstream_desc: "Aramco se ha expandido en refinación y producción química, lo que le permite obtener ingresos de cada etapa entre la extracción de crudo y las ventas de combustible al por menor."
 SAU_aramco_engineers: "§HSaudi Aramco§! - Ingenieros sauditas de Petróleo"
 SAU_aramco_engineers_desc: "Una generación de ingenieros sauditas de petróleo, entrenados en KFUPM y en el extranjero, ha reemplazado a las manos extranjeras que una vez corrieron los campos."
 SAU_aramco_export: "§HSaudi Aramco§! - exportar Powerhouse"
 SAU_aramco_export_desc: "Aramco se construye como una máquina de exportación, sus terminales y flotas petroleros sintonizados para ofrecer más crudo a más mercados que cualquier rival."
 SAU_aramco_gas: "§HSaudi Aramco§! - El sistema de gas maestro"
 SAU_aramco_gas_desc: "El Sistema Master Gas captura el gas natural que anteriormente se arrastró y lo transporta a centrales eléctricas e instalaciones industriales en toda Arabia Saudita."
 SAU_aramco_ghawar: "§HSaudi Aramco§! - El campo de Ghawar"
 SAU_aramco_ghawar_desc: "Ghawar es el campo de petróleo convencional más grande del mundo y produce millones de barriles por día. Su producción es central tanto para Aramco como para la economía saudita."
 SAU_aramco_giant: "§HSaudi Aramco§! - La compañía más valiosa del mundo"
 SAU_aramco_giant_desc: "Aramco es la empresa más valiosa de la Tierra, su producción, reservas y ganancias sin par en la historia corporativa."
 SAU_aramco_megafields: "§HSaudi Aramco§! - nuevos Mega-Fields"
 SAU_aramco_megafields_desc: "Los principales desarrollos en Shaybah, Khurais y el campo de Manifa offshore han ampliado la capacidad de producción saudí y han continuado la inversión del Reino en grandes proyectos petroleros."
 SAU_aramco_national: "§HSaudi Aramco§! - Nacionalización completa"
 SAU_aramco_national_desc: "Completado en 1980, la compra de accionistas americanos hizo Aramco totalmente saudí. El aceite del Reino ahora responde a Riyadh solo."
 SAU_aramco_opec: "§HSaudi Aramco§! - Productor oscilante de la OPEP"
 SAU_aramco_opec_desc: "Arabia Saudita mantiene suficiente capacidad de producción de repuesto para aumentar o reducir el suministro de la OPEP e influir en los precios mundiales del petróleo más que cualquier otro miembro."
 SAU_aramco_petrochem: "§HSaudi Aramco§! - Refining Integrado"
 SAU_aramco_petrochem_desc: "PetroRabigh y SATORP, Joint ventures with Sumitomo and Total, Refinación de soldaduras y petroquímicas en complejos integrados únicos en el Mar Rojo y el Golfo"
 SAU_aramco_production: "§HSaudi Aramco§! - Maximizar la producción"
 SAU_aramco_production_desc: "Aramco prioriza la máxima producción sostenible al tiempo que conserva la capacidad de repuesto. Esto permite que Arabia Saudita responda rápidamente a los cambios en la política de demanda o producción gubernamental."
 SAU_aramco_rastanura: "§HSaudi Aramco§! - Ras Tanura & Abqaiq"
 SAU_aramco_rastanura_desc: "El terminal de exportación Ras Tanura y el complejo de procesamiento Abqaiq manejan una gran parte del crudo saudí antes de entrar en los mercados mundiales. Juntos se encuentran entre las mayores instalaciones petroleras de su tipo."
 SAU_aramco_rnd: "§HSaudi Aramco§! - Investigación EXPEC"
 SAU_aramco_rnd_desc: "El Centro de Investigación Avanzada EXPEC en Dhahran lidera el mundo en ingeniería de embalses, exprimiendo más petróleo de cada campo a menor costo."
 SAU_baathist_party_1: "La Cuenca del Nacionalista Árabe"
 SAU_baathist_party_1_loc: "\n[SAU.GetFlag]The Bastion of Arab Nationalist\n§HForegin Influence§! Multiplicador: §G+5.00%§!\n§HForegin Influence§! Coup Success Factor: §G+25.0%§!\n\n"
 SAU_baathist_party_3: "Unidad, libertad, socialismo"
 SAU_baathist_party_3_loc: "[SAU.GetFlag]Unidad, libertad, socialismo\nVelocidad de construcción: §G+10.00%§!\nMultiplicador de la campaña nacionalista de propaganda: §G-10.00%§!\nCrecimiento de Prdouctividad Mensual: §G+0.05§!\n\n"
 SAU_banking_649_hybrid: "§HInterest Law§! – §YHybrid (Sukuk + Informal)§!"
 SAU_banking_649_hybrid_desc: "Los servicios bancarios islámicos y sukuk operan junto con los préstamos convencionales informales. El sistema sigue siendo oficialmente compatible con la sharia, al tiempo que permite una flexibilidad práctica limitada."
 SAU_banking_649_hybrid_loc: "\n§HLey interesante:§! §YSukukuk + Interés informal§!\n §G+2.0%§! Impuestos de Office Park\n §G+1.0%§! Poder político\n §G+0.5%§! Estabilidad\n"
 SAU_banking_649_islamic: "§HLey Interesa§! - §RProhibición estricta de Riba§!"
 SAU_banking_649_islamic_desc: "Riba está prohibida sin excepción. La financiación fluye a través de la distribución de ganancias y estructuras murabaha, y el banco fiel con una conciencia clara."
 SAU_banking_649_islamic_loc: "\n§HLey interesante:§! §BProhibición estricta de Riba§!\n §G+3.0%§! Poder político\n §G+2.0%§! Estabilidad\n §G+0.5%§! La deriva salafista\n"
 SAU_banking_649_secular: "§HLey de Interés§! - §GConvencional§!"
 SAU_banking_649_secular_desc: "El interés es legal y de precio abierto. La banca convencional prospera y el capital fluye libremente, sea lo que los clérigos prediquen el viernes."
 SAU_banking_649_secular_loc: "\n§HLey interesante: §! §GConvencional§!\n §G+4.0%§! Impuestos de Office Park\n §G+3.0%§!\n §G+0.5%§!\n §R-1.0%§! Estabilidad\n"
 SAU_banking_650_hybrid: "§HReserve Mandato§! - §YModerado§!"
 SAU_banking_650_hybrid_desc: "Los requerimientos de reserva moderados permiten a los bancos ampliar el crédito manteniendo grandes amortiguadores financieros que un sistema ligeramente regulado."
 SAU_banking_650_hybrid_loc: "\n§H Mandato de reserva:§! §Y Reservas moderadas§!\n §G+1.0%§! Velocidad de Construcción\n §G+0.5%§! Estabilidad\n"
 SAU_banking_650_islamic: "§HReserve Mandate§! - §R Full Asset Backing§!"
 SAU_banking_650_islamic_desc: "Cada depósito está respaldado por activos reales. El crédito crece lentamente, pero ningún banco saudí puede colapsar en una carrera."
 SAU_banking_650_islamic_loc: "\n§HReserve Mandate:§! §B Total Asset Backing (Sharia)§!\n §G+2.5%§! Estabilidad\n §G+2.0%§! Apoyo a la guerra\n §R-2.0%§! Velocidad de Construcción\n"
 SAU_banking_650_secular: "§HReserve el mandato§! - §G Reserva práctica§!"
 SAU_banking_650_secular_desc: "Los bancos prestan contra una fracción de sus depósitos, multiplicando el crédito a través de la economía de la manera occidental."
 SAU_banking_650_secular_loc: "\n§H Mandato de reserva:§! §G Reserva práctica (occidental)§!\n §G+3.0%§! Velocidad de Construcción\n §G+5.0%§! Reparación de la industria\n §R-2.0%§! Uso de bienes de consumo\n §R-1.5%§! Estabilidad\n"
 SAU_banking_651_hybrid: "§H Código de especulación§! - §Y Derivativos regulados§!"
 SAU_banking_651_hybrid_desc: "Derivados comercio dentro de límites estrictos, cobertura permitida, especulación policial."
 SAU_banking_651_hybrid_loc: "\n§H Código de especulación:§! §Y Sólo Derivativos regulados§!\n §G+1,5%§!\n §G+0.5%§! Estabilidad\n"
 SAU_banking_651_islamic: "§H Código de Divulgación§! - §RNo Gharar§!"
 SAU_banking_651_islamic_desc: "La prohibición de los derivados de barras de gharar, venta corta y otros productos financieros basados en incertidumbre o especulación excesiva."
 SAU_banking_651_islamic_loc: "\n§H Código de especulación:§! §B No Gharar - No Gambling§!\n §G+2.5%§! Estabilidad\n §G+2.0%§! Poder político\n §G+3§! La aceptación de la neutralidad\n"
 SAU_banking_651_secular: "§H Código de Divulgación§! - §G Regulación de la Luz§!"
 SAU_banking_651_secular_desc: "Las opciones, los futuros y otros derivados se permiten bajo supervisión reglamentaria limitada."
 SAU_banking_651_secular_loc: "\n§H Código de especulación:§! §GDerivativos & Futuros permitidos§!\n §G+3.0%§!\n §G+2.0%§!\n §R-2.0%§! Estabilidad\n"
 SAU_banking_652_hybrid: "§H Código Interbancario§! - §Y Canales corporales§!"
 SAU_banking_652_hybrid_desc: "Dos canales interbancarios corren de lado a lado, convencionales e islámicas, y cada banco elige su contador."
 SAU_banking_652_hybrid_loc: "\n§H Código Interbancario:§! §Y Canales corporales§!\n §G+1,5%§! Impuestos de Office Park\n §G+1.0%§! Poder político\n"
 SAU_banking_652_islamic: "§H Código Interbancario§! - §RMurabaha§!"
 SAU_banking_652_islamic_desc: "La liquidez interbanca se mueve a través de la mercancía murabaha, manteniendo incluso dinero durante la noche dentro de los límites de la Sharia."
 SAU_banking_652_islamic_loc: "\n§H Código Interbancario:§! §BMurabaha-Based§!\n §G+2.5%§! Poder político\n §G+1.5%§! Estabilidad\n §G+0.5%§! La deriva salafista\n"
 SAU_banking_652_secular: "§H Código Interbancario§! - §G Estilo LIBOR§!"
 SAU_banking_652_secular_desc: "Los bancos se prestan unos a otros a tipos de interés de referencia, tejiendo financiación saudí en mercados monetarios globales."
 SAU_banking_652_secular_loc: "\n§H Código Interbancario:§! §G Corredor de Interés Convencional§!\n §G+3.0%§! Impuestos de Office Park\n §G+2.0%§!\n §G+0.5%§!\n §R-1.0%§! Estabilidad\n"
 SAU_banking_653_hybrid: "§HControl de Banca §! - §Y Estructuras paralelas§!"
 SAU_banking_653_hybrid_desc: "Los bancos convencionales e islámicos responden a pistas de control paralelas bajo un tejado central del banco."
 SAU_banking_653_hybrid_loc: "\n§HControl de Banca:§! §Y Parallel SAMA + Estructuras Sharia§!\n §G+2.0%§!\n §G+1.5%§! Poder político\n"
 SAU_banking_653_islamic: "§HControl de Banca §! - §RSAMA + Sharia Council§!"
 SAU_banking_653_islamic_desc: "SAMA comparte autoridad con un consejo de supervisión Sharia, y ninguna licencia bancaria sobrevive el veto de los eruditos."
 SAU_banking_653_islamic_loc: "\n§HControl bancario:§! §BSAMA + Supervisión de la Sharia§!\n §G+4.0%§! Poder político\n §G+2.5%§! Estabilidad\n §G+1.0%§! La deriva salafista\n"
 SAU_banking_653_secular: "§HControl de Banca §! - §G SAMA independiente§!"
 SAU_banking_653_secular_desc: "SAMA regula la banca como un banco central independiente, responsable de la confianza del mercado y poco más."
 SAU_banking_653_secular_loc: "\n§HControl bancario:§! §G SAMA independiente§!\n §G+4.0%§!\n §G+2.0%§!\n §G+1.0%§!\n §R-1.0%§! Estabilidad\n"
 SAU_banking_654_pragmatic: "§HLa financiación islámica§! – §YEl Hub Islámico Global§!"
 SAU_banking_654_pragmatic_desc: "Riyadh se está convirtiendo en un centro internacional para la financiación islámica. Sus reglamentos conservan la credibilidad de la sharia al tiempo que acogen a instituciones de otros mercados financieros importantes."
 SAU_banking_654_pragmatic_loc: "\n§HBastion of Islamic Finance:§! §Y Global Islamic Finance Hub§!\n §G+3.0%§! Poder político\n §G+2.5%§! Estabilidad\n §G+5.0%§!\n §G+4.0%§! Impuestos corporativos\n §G+5§! Aceptación de la neutralidad\n"
 SAU_banking_654_strict: "§HLa financiación islámica§! - §ROrtodoxia estricta§!"
 SAU_banking_654_strict_desc: "El Reino exige la plena adhesión a las normas financieras islámicas ortodoxas. Esto limita la flexibilidad pero atrae a clientes que priorizan el estricto cumplimiento de Sharia."
 SAU_banking_654_strict_loc: "\n§HBastion of Islamic Finance:§! §BStrict Orthodoxy§!\n §G+5.0%§! Poder político\n §G+5.0%§! Estabilidad\n §G+2.0%§! La deriva salafista\n §G+10§! Aceptación de la neutralidad\n §G+10.0%§! defensa de la deriva\n"
 SAU_banking_655_full: "§H Finanzas secularizadas§! - §GFull Anglo-Saxon§!"
 SAU_banking_655_full_desc: "Arabia Saudita ha adoptado el modelo bancario anglosajón en su totalidad. El cambio expande los mercados de capitales convencionales pero se enfrenta a la oposición del establecimiento religioso."
 SAU_banking_655_full_loc: "\n§HFinanza secularizada:§! §GFull Anglo-Saxon§!\n §G+10.0%§! Impuestos de Office Park\n §G+7.0%§!\n §G+5.0%§!\n §G+4.0%§!\n §G+2,0%§!\n §R-3.0%§! Estabilidad\n §R-2,0%§! Uso de bienes de consumo\n"
 SAU_banking_655_gradual: "§H Finanzas secularizadas§! - §Y Gradual§!"
 SAU_banking_655_gradual_desc: "Se están introduciendo gradualmente normas financieras convencionales para reducir la oposición religiosa organizada a la secularización."
 SAU_banking_655_gradual_loc: "\n§HFinanciamiento secularizado:§! §Y Transición gradual§!\n §G+6,0%§! Impuestos de Office Park\n §G+4.0%§!\n §G+3.0%§!\n §G+1,0%§!\n §R-1.0%§! Estabilidad\n"
 SAU_banking_system: "§HSistema bancario§!"
 SAU_banking_system_desc: "El sector financiero del Reino. Cada enfoque de la ley bancaria le da al jugador una §Lsecular§!, §Lislamic§! o §Lhibrid§! opción; el resultado vive aquí como un subsistema §H§!. El modificador total proviene de la suma de todos los subsistemas elegidos."
 SAU_banking_system_tt: "[SAU_banking_649_loc][SAU_banking_650_loc][SAU_banking_651_loc][SAU_banking_652_loc][SAU_banking_653_loc][SAU_banking_654_loc][SAU_banking_655_loc]"
 SAU_black_february_bailout_idea: "La intervención de febrero"
 SAU_black_february_bailout_idea_desc: "El estado ha gastado fondos públicos para frenar el colapso de Tadawul y proteger a los pequeños inversores de las peores pérdidas. La intervención reduce los fondos disponibles del Tesoro y establece un precedente costoso para futuras crisis de mercado."
 SAU_black_february_idea: "Negro febrero"
 SAU_black_february_idea_desc: "El Tadawul ha perdido dos tercios de su valor, destruyendo gran parte de los ahorros invertidos por los hogares saudíes. El fracaso del gobierno de intervenir ha causado enojo público generalizado."
 SAU_communist_state_2: "La Nación Proletaria"
 SAU_communist_state_2_loc: "[SAU.GetFlag]La Nación Proletaria\n§HIngresos fiscales sobre población§! Multiplicador: §G+5.00%§!\n§HAgricultura§! Multiplicador de ingresos fiscales: §G+5.00%§!\n§HDistrito Comercial de Agricultura§! Productividad: §G+10.00%§!\n\n"
 SAU_communist_state_2_tt: "[SAU_communist_state_1_loc][SAU_communist_state_2_loc][SAU_communist_state_3_loc][SAU_communist_state_4_loc][SAU_communist_state_5_loc]"
 SAU_Cooperation_West_East: "[USA.GetFlag] Cooperación entre un mundo dividido [CHI.GetFlag]"
 SAU_Cooperation_West_East_desc: "Entre el Mundo Dividido, en dos Blocs Principales, el Mundo del Este que está junto con Rising Superpower [CHI.GetFlag] China, y El lado occidental liderado por los Estados Unidos [USA.GetFlag] en este mundo y el Nuevo Milenio"
 SAU_Cooperation_West_East_tt: "[SAU_IMEC_india_deal_new_loc][SAU_OPEC_Russia_deal_new_loc]"
 SAU_custodian_of_the_cause: "Custodio de la Causa"
 SAU_custodian_of_the_cause_desc: "Riyadh ha hecho de Palestina la medida de su liderazgo del mundo árabe, y la calle árabe responde con lealtad."
 SAU_cyber_defensive_posture: "Postura defensiva cibernética"
 SAU_cyber_defensive_posture_desc: "Las operaciones de endurecimiento del GIP están protegiendo las redes del Reino y frenando la colección de inteligencia hostil."
 SAU_cyber_defensive_target: "Contramedidas cibernéticas sauditas"
 SAU_cyber_defensive_target_desc: "Las defensas cibernéticas del GIP han degradado la coordinación y el mando ofensivos."
 SAU_cyber_offensive_target: "Bajo ataque cibernético saudita"
 SAU_cyber_offensive_target_desc: "Las operaciones cibernéticas del GIP han dañado el mando y la coordinación defensiva, e interrumpido la industria."
 SAU_decisive_storm_air_cover: "Coalición Air Cover"
 SAU_decisive_storm_air_cover_desc: "Los aviones de Arabia Saudita y coalición proporcionan cobertura aérea para las fuerzas gubernamentales yemeníes, otorgando +10% de defensa contra los Houthis. Este apoyo termina si se acepta una cesación del fuego o el movimiento Houthi deja de existir."
 SAU_decree_abdullah_kaec_construction: "KAEC Fast-Track"
 SAU_decree_abdullah_kaec_construction_desc: "Las obras civiles en todo el Reino están siendo empujadas a través del ritmo establecido en la costa del Mar Rojo."
 SAU_decree_abdullah_kasp_scholarship: "Beca en el extranjero de KASP"
 SAU_decree_abdullah_kasp_scholarship_desc: "Una generación capacitada en el extranjero está filtrando de nuevo a los ministerios, las universidades y las empresas."
 SAU_decree_abdullah_kaust_grants: "Becas KAUST High-Tech"
 SAU_decree_abdullah_kaust_grants_desc: "Los subsidios ampliados de KAUST están acelerando la investigación universitaria y aumentando el rendimiento de la industria de alta tecnología."
 SAU_decree_abdullah_national_dialogue: "Foros Nacionales de Diálogo"
 SAU_decree_abdullah_national_dialogue_desc: "En las salas de conferencias se están discutiendo problemas en lugar de en la calle."
 SAU_decree_abdullah_sang_subsidies: "Subvenciones de modernización SANG"
 SAU_decree_abdullah_sang_subsidies_desc: "Los contratos subvencionados retienen el precio de los vehículos blindados y mantienen las formaciones hasta la fuerza."
 SAU_decree_mbn_border_surveillance: "Rejillas de vigilancia de la Guardia Fronteriza"
 SAU_decree_mbn_border_surveillance_desc: "La frontera se ve finalizada, y las tropas en ella están excavadas detrás de posiciones preparadas."
 SAU_decree_mbn_mabahith_campaign: "Campaña contra la subversión de Mabahith"
 SAU_decree_mbn_mabahith_campaign_desc: "Los mabahith están vigilando las comunicaciones e intensificando la vigilancia de los presuntos disidentes en todo el Reino."
 SAU_decree_mbn_rehabilitation_center: "Centro de rehabilitación Prince Nayef"
 SAU_decree_mbn_rehabilitation_center_desc: "El centro del Príncipe Nayef intenta rehabilitar a los militantes y devolverlos a la vida civil en lugar de permitir que el encarcelamiento o la muerte fortalezcan el reclutamiento extremista."
 SAU_decree_mbn_special_security_forces: "MOI Fuerzas Especiales de Seguridad"
 SAU_decree_mbn_special_security_forces_desc: "Las fuerzas del Ministerio del Interior están en las calles, y cualquiera que trabaje contra el Reino lo encuentra mucho más difícil."
 SAU_decree_mbn_western_intel_networks: "Redes de inteligencia conjuntas occidentales"
 SAU_decree_mbn_western_intel_networks_desc: "La toma compartida de los servicios aliados está llenando lo que la colección saudí no puede alcanzar."
 SAU_decree_mbs_anticorruption_drive: "Los asentamientos de Ritz-Carlton"
 SAU_decree_mbs_anticorruption_drive_desc: "Las detenciones de Ritz-Carlton han obligado a los sauditas ricos a entregar activos al estado y demostraron el control del liderazgo sobre las fortunas privadas."
 SAU_decree_mbs_aramco_liquidity: "Aramco Liquidez Estratégica"
 SAU_decree_mbs_aramco_liquidity_desc: "El dinero del petróleo se está moviendo directamente en las manos del estado, y la industria ha sido liberada del libro mayor."
 SAU_decree_mbs_gami_localization: "Localización de Defensa GAMI"
 SAU_decree_mbs_gami_localization_desc: "Las armas están saliendo de las líneas saudíes en lugar de las extranjeras, y las plantas de armamentos se están multiplicando."
 SAU_decree_mbs_pif_neom: "NEOM & Proyectos Frontier"
 SAU_decree_mbs_pif_neom_desc: "El Fondo de Inversiones Públicas financia la OIM y proyectos fronterizos conexos, incluida la infraestructura de transporte necesaria para apoyarlos."
 SAU_decree_mbs_vision2030_blitz: "Visión 2030 Campaña Blitz"
 SAU_decree_mbs_vision2030_blitz_desc: "Los ministerios gubernamentales y la inversión pública están siendo dirigidos hacia la rápida implementación del programa Vision 2030 del Príncipe Heredero."
 SAU_decree_mutaib_capital_garrison: "Cuadrícula de guarnición de capital"
 SAU_decree_mutaib_capital_garrison_desc: "El Guardia Nacional ha establecido un cordón de seguridad y una extensa red de vigilancia en todo Riad."
 SAU_decree_mutaib_janadriyah_festival: "Festival del Patrimonio de Janadriyah"
 SAU_decree_mutaib_janadriyah_festival_desc: "El festival Janadriyah promueve el patrimonio tribal y fortalece las relaciones entre el gobierno y las comunidades tribales."
 SAU_decree_mutaib_sang_logistics: "Logística de SANG"
 SAU_decree_mutaib_sang_logistics_desc: "La Guardia alimenta y se alimenta a sí misma, y desperdicia mucho menos hacerlo."
 SAU_decree_mutaib_sang_procurement: "SANG Aviation & Blindaje Contratación"
 SAU_decree_mutaib_sang_procurement_desc: "Los contratos de guardia se están llenando primero, y a un precio el ejército regular no consigue."
 SAU_decree_mutaib_tribal_reserves: "Reservas Tribal SANG"
 SAU_decree_mutaib_tribal_reserves_desc: "Los levies tribales están llenando los rollos de la Guardia más rápido que los reclutadores podían solos."
 SAU_decree_salman_cpsa_council: "Consejo de Asuntos Políticos &"
 SAU_decree_salman_cpsa_council_desc: "Un consejo ahora muestra la política y la seguridad por igual, y el trabajo del personal se mueve a la velocidad del hombre que lo preside."
 SAU_decree_salman_ksrelief: "Operaciones de KSrelief"
 SAU_decree_salman_ksrelief_desc: "KSrelief utiliza operaciones humanitarias sauditas visibles para proporcionar ayuda en el extranjero y mejorar la reputación internacional del Reino."
 SAU_decree_salman_riyadh_metro_plan: "Plan Metropolitano de Riyadh"
 SAU_decree_salman_riyadh_metro_plan_desc: "El programa de construcción de la capital ha establecido el tempo para la construcción en todas partes."
 SAU_decree_salman_royal_decrees: "Reales Decretos estructurales"
 SAU_decree_salman_royal_decrees_desc: "Los decretos reales están reorganizando ministerios y centralizando la aplicación de la política gubernamental."
 SAU_decree_salman_spark_park: "Rey Salman Energy Park"
 SAU_decree_salman_spark_park_desc: "La fabricación de energía doméstica está exprimiendo más de todos los campos y cada granja de tanques."
 SAU_div_construction: "§HDiversificación§! - Construcción & Inmobiliaria"
 SAU_div_construction_desc: "La construcción y el desarrollo inmobiliario se están convirtiendo en componentes importantes de la economía no petrolera de Arabia Saudita."
 SAU_div_defence: "§HDiversificación§! - Industria de defensa"
 SAU_div_defence_desc: "Una industria de armas doméstica mantiene el gasto de defensa dentro del Reino, construyendo fábricas y experiencia en lugar de comprarlas."
 SAU_div_energy: "§HDiversificación§! - Energía renovable"
 SAU_div_energy_desc: "Los grandes proyectos solares reducen la demanda interna de energía aceitada, dejando más crudo disponible para las exportaciones y aumentar los ingresos del gobierno."
 SAU_div_governance: "§HDiversificación§! - Gobernanza & Estado de Derecho"
 SAU_div_governance_desc: "Los tribunales más coherentes y los ministerios responsables mejoran el entorno empresarial y facilitan la aplicación de las políticas gubernamentales."
 SAU_div_logistics: "§HDiversificación§! - Logística & Transporte"
 SAU_div_logistics_desc: "La inversión en puertos, ferrocarriles y carreteras fortalece el papel de Arabia Saudita en el comercio entre Asia, África y Europa."
 SAU_div_social: "§HDiversificación§! - Desarrollo social"
 SAU_div_social_desc: "Las escuelas, hospitales y viviendas dan a los saudíes ordinarios una participación en la nueva economía, y una razón para creer en ella."
 SAU_div_tech: "§HDiversificación§! - Tecnología & Innovación"
 SAU_div_tech_desc: "Parques de investigación y capital inicial semilló un sector tecnológico saudí que contrata graduados de la industria petrolera nunca pudo."
 SAU_div_tourism: "§HDiversificación§! - Turismo & Entretenimiento"
 SAU_div_tourism_desc: "Resorts, sitios de patrimonio y distritos de entretenimiento abren el Reino a los visitantes que una vez se apartó, y su dinero se queda."
 SAU_diversification: "§HDiversión económica§!"
 SAU_diversification_desc: "El Reino está desarrollando un §Leconomía no petrolera§! para reducir su exposición a cambios en los precios del petróleo. Cada pilar completado, incluyendo gobernanza, industria, turismo, tecnología, energía y desarrollo social, aparece aquí y §Greduce la dependencia del petróleo§!."
 SAU_diversification_tt: "[SAU_div_governance_loc][SAU_div_construction_loc][SAU_div_tourism_loc][SAU_div_logistics_loc][SAU_div_tech_loc][SAU_div_defence_loc][SAU_div_energy_loc][SAU_div_social_loc]"
 SAU_doctrine_american: "Doctrina: Asociación Americana"
 SAU_doctrine_american_desc: "Entrenar con fuerzas estadounidenses, comprar americanos y luchar por el camino estadounidense. El camino más capaz - al precio de la dependencia y el resentimiento doméstico silencioso.\n\n§G+10%§!\n§G+10%§!\n§G+5%§! División Organización\n§R-10%§!"
 SAU_doctrine_domestic: "Doctrina: autosuficiencia doméstica"
 SAU_doctrine_domestic_desc: "Construir una industria de defensa indígena y una fuerza que no debe nada a proveedores extranjeros. Proud y autosuficiente, si un paso detrás del borde de corte.\n\n§G+10%§! Salida de la fábrica de armas\n§G+5%§! División de Recuperación\n§R-5%§! Obtención de experiencia del ejército"
 SAU_doctrine_gcc: "Doctrina: GCC Collective Defence"
 SAU_doctrine_gcc_desc: "Ancla la defensa del Reino en el Consejo de Cooperación del Golfo y la Fuerza de Escudo de Península. Formidable en el suelo del hogar, pero con un comité y cauteloso sobre el ataque.\n\n§G+15%§! División Defensa del Territorio Central\n§G+5%§! Población restablecida\n§R-5%§! División Ataque"
 SAU_doctrine_nato: "Doctrina: Profesionalidad de la OTAN"
 SAU_doctrine_nato_desc: "Adoptar normas de la OTAN: un cuerpo profesional de oficiales, planificación de armas combinadas y trabajo riguroso del personal. Superb comando and control - pero una fuerza costosa para mantener.\n\n§G+10%§! Velocidad de Planificación\n§G+10%§! planificación máxima\n§G+5%§! División Organización\n§R+5%§! Uso de bienes de consumo"
 SAU_eco_bureau_bad: "§RLa economía saudita§! - Tapa roja"
 SAU_eco_bureau_bad_desc: "Las empresas saudíes enfrentan licencias lentas, aprobaciones superpuestas y patrocinio generalizado. Estas barreras burocráticas reducen el valor de la inversión pública."
 SAU_eco_bureau_good: "§GLa economía saudita§! - Estado racionalizado"
 SAU_eco_bureau_good_desc: "Permisos en días en lugar de años. Un estado simplificado permite que el negocio saudí se mueva a la velocidad del mercado."
 SAU_eco_capital_bad: "§RLa economía saudita§! - Vuelo de Capital"
 SAU_eco_capital_bad_desc: "La riqueza privada saudita se encuentra en Londres, Ginebra y Nueva York. Los hombres más ricos del Reino invierten en todas partes excepto en casa."
 SAU_eco_capital_good: "§GLa economía saudita§! - Capital Nacional"
 SAU_eco_capital_good_desc: "Capital saudí se queda y trabaja en el Reino, financiando fábricas y empresas en lugar de áticos extranjeros."
 SAU_eco_diversify_bad: "§RLa economía saudita§! - Estado de Rentier"
 SAU_eco_diversify_bad_desc: "El gobierno depende de los ingresos del petróleo, mientras que muchos ciudadanos dependen del empleo y los beneficios estatales. Por lo tanto, los cambios en el precio de una sola mercancía afectan a toda la economía."
 SAU_eco_diversify_good: "§GLa economía saudita§! - Diversified"
 SAU_eco_diversify_good_desc: "El turismo, la industria, la logística y las finanzas ahora tienen un peso real al lado del barril de petróleo. Los ingresos del Reino ya no cuelgan a un precio único."
 SAU_eco_industry_bad: "§RLa economía saudita§! - Dependencia de Importación"
 SAU_eco_industry_bad_desc: "Casi todo en un estante saudí llega por barco. Fuera del sector petrolero, el Reino hace poco que consume."
 SAU_eco_industry_good: "§GLa economía saudita§! - Industria nacional"
 SAU_eco_industry_good_desc: "Las fábricas sauditas suministran ahora lo que el Reino una vez importado, y el libro mayor lo muestra."
 SAU_eco_labour_bad: "§RLa economía saudita§! - Expat Labour"
 SAU_eco_labour_bad_desc: "Millones de expatriados hacen el trabajo del Reino mientras que los jóvenes saudíes esperan a las autoridades sinecutivas que ya no existen."
 SAU_eco_labour_good: "§GLa economía saudita§! - Fuerza de Trabajo saudí"
 SAU_eco_labour_good_desc: "Los saudíes llenan puestos de trabajo saudí, desde el piso de la tienda hasta la suite ejecutiva. La nómina de sueldos permanece en el Reino."
 SAU_econ_industry_first: "§HModelo económico§! - primera industria"
 SAU_econ_industry_first_desc: "El Reino da prioridad al acero, fundición, fabricación y otras industrias pesadas. Esto aumenta la producción industrial, pero requiere más bienes de consumo y mano de obra."
 SAU_econ_mixed: "§HModelo económico§! - Sendero mixto"
 SAU_econ_mixed_desc: "El Reino desarrolla industria y servicios al mismo tiempo. El crecimiento está menos concentrado que en una estrategia de un solo sector, lo que hace la economía más resiliente."
 SAU_econ_services: "§HModelo económico§! - Servicios Primero"
 SAU_econ_services_desc: "El Reino prioriza la banca, logística, finanzas y turismo como fuentes de empleo saudí cualificado. Esto mejora la economía del conocimiento, pero proporciona menos capacidad industrial."
 SAU_economic_cities: "Iniciativa de ciudades económicas"
 SAU_economic_cities_desc: "King Abdullah Economic City y otros centros urbanos planificados están atrayendo inversión en oficinas, industria y servicios. Estas ciudades construidas a propósito sirven como motores del crecimiento económico no petrolero."
 SAU_economy: "§HLa economía saudita§!"
 SAU_economy_desc: "La economía saudita del año 2000: §Lrico en aceite pero no diversificado§!, ponderado por el vuelo de capital, la dependencia de importación, la cinta roja burocrática, la dependencia del trabajo expatriado y la adicción a una sola mercancía. §HÁrbol económico§! repara una debilidad y construye la base industrial SABIC. Completa el árbol y un §Rdebuff pesado§! se convierte en §Geconomía equilibrada y diversificada§!.\n\n§YA continuación: cada subsistema económico, rojo donde todavía roto, verde una vez reformado.§!"
 SAU_economy_tt: "[SAU_eco_capital_loc][SAU_eco_industry_loc][SAU_eco_bureau_loc][SAU_eco_labour_loc][SAU_eco_diversify_loc][SAU_eco_model_loc][SAU_eco_cities_loc]"
 SAU_faisalite_balanced: "El Equilibrio Faisalite"
 SAU_faisalite_balanced_desc: "El Reino combina la autosuficiencia interna con un compromiso limitado en el extranjero sin que se acerque a su doctrina fija. Mantener este equilibrio se hace más difícil a medida que aumentan los compromisos extranjeros."
 SAU_faisalite_closed_schools: "Las escuelas están cerradas"
 SAU_faisalite_closed_schools_desc: "Los planes de estudios extranjeros se han ido y todavía no se ha escrito nada para reemplazarlos. Una cohorte perderá varios años hasta la brecha."
 SAU_faisalite_conviction_decided: "Círculo de Faisalite: Decidido"
 SAU_faisalite_conviction_dormant: "Círculo de Faisalite: Dormant"
 SAU_faisalite_conviction_gathering: "Círculo de Faisalite: Reunión"
 SAU_faisalite_conviction_insistent: "Círculo de Faisalite: Insistente"
 SAU_faisalite_conviction_stirring: "Círculo de Faisalite: Stirring"
 SAU_faisalite_creditor_of_the_ummah: "Acreedor de la Ummah"
 SAU_faisalite_creditor_of_the_ummah_desc: "Los préstamos sauditas a largo plazo para los países musulmanes dan a Riyadh influencia sobre los gobiernos deudores. El pago diferido fortalece su dependencia a corto plazo y buena voluntad."
 SAU_faisalite_foreign_endowments: "Dotación en el extranjero"
 SAU_faisalite_foreign_endowments_desc: "El dinero saudí da sillas y bibliotecas en una docena de universidades extranjeras, y los estudiantes saudíes entran en ellas sin oposición."
 SAU_faisalite_import_rationing: "Importación Rationing"
 SAU_faisalite_import_rationing_desc: "Las licencias se emiten espaciosamente y las colas forman fuera del ministerio. Lo que el Reino no puede comprar debe encontrar en casa, y es encontrar algo más de lo esperado."
 SAU_faisalite_interventionist_dominant: "§RInterventionism Ascendant§!"
 SAU_faisalite_interventionist_dominant_desc: "Cumbres, subvenciones y asesores militares han hecho de Arabia Saudita un poder central en el mundo musulmán. Esta influencia también hace que el Reino sea responsable de controversias costosas más allá de sus fronteras."
 SAU_faisalite_interventionist_leaning: "§RIntervencionista en desarrollo§!"
 SAU_faisalite_interventionist_leaning_desc: "El Reino está gastando en el extranjero de nuevo y siendo escuchado por ello. Faisal reconocería la dirección, si aún no la escala."
 SAU_faisalite_isolationist_dominant: "§OIsolationism Ascendant§!"
 SAU_faisalite_isolationist_dominant_desc: "Arabia Saudita se ha cerrado a la mayoría de las influencias y obligaciones extranjeras. Esto preserva su independencia, pero reduce el acceso al conocimiento exterior y lo deja diplomáticamente aislado."
 SAU_faisalite_isolationist_leaning: "§OIsolacionista leal§!"
 SAU_faisalite_isolationist_leaning_desc: "El Reino está entrando. Menos manos extranjeras, menos obligaciones externas y un cuerpo diplomático con menos y menos que hacer."
 SAU_faisalite_labour_shortage: "Falta de trabajo"
 SAU_faisalite_labour_shortage_desc: "La mitad del andamio en el Reino está vacía. Los hombres que lo sostuvieron se han ido a casa, y los hombres que estaban destinados a reemplazarlos no han llegado."
 SAU_faisalite_nationalised_management: "Gestión nacionalizada"
 SAU_faisalite_nationalised_management_desc: "Los gerentes extranjeros se han ido y sus reemplazos están aprendiendo el trabajo en él. Las plantas todavía funcionan, después de una moda."
 SAU_faisalite_officers_abroad: "El Cuerpo de Oficiales en el Extranjero"
 SAU_faisalite_officers_abroad_desc: "Lo mejor del personal está aconsejando al ejército de alguien más. Sus propias formaciones notan la ausencia."
 SAU_faisalite_street_movement: "La calle recuerda a Faisal"
 SAU_faisalite_street_movement_desc: "Un movimiento popular está presentando al Rey Faisal como un modelo de independencia saudí, enfatizando el embargo petrolero y su resistencia a la presión occidental. Su relato simplificado de su gobierno se ha difundido de mezquitas a campus universitarios y ahora sostiene un movimiento organizado de oposición."
 SAU_forces_modernized: "Fuerzas Armadas Modernizadas"
 SAU_forces_modernized_desc: "Un militar totalmente moderno y profesional, el igual de cualquiera en la región y un verdadero contrapeso para Irán."
 SAU_forces_modernizing: "Modernización de fuerzas"
 SAU_forces_modernizing_desc: "La capacitación, la doctrina y el equipo están alcanzando las normas occidentales. Las fuerzas son ahora una coincidencia para sus vecinos."
 SAU_forces_reforming: "Fuerzas de reforma"
 SAU_forces_reforming_desc: "Las primeras reformas se están llevando a cabo y las peores de las viejas debilidades se están desvaneciendo. Sigue modernizando."
 SAU_forces_unmodernized: "Fuerzas Armadas no modernizadas"
 SAU_forces_unmodernized_desc: "Décadas de dependencia de contratistas extranjeros y doctrina anticuada han dejado a las fuerzas armadas sin temor. Utilice la decisión §YModernizar las Fuerzas Armadas§! para reformarlas, paso a paso."
 SAU_fortified_kingdom: "Fortress Arabia"
 SAU_fortified_kingdom_desc: "Las bases endurecidas, las defensas aéreas capas y las guarniciones costeras mejoran la capacidad de Arabia Saudita para soportar un ataque iraní."
 SAU_french_investment_pact_FRA: "Pacto de inversión saudí-francés"
 SAU_french_investment_pact_FRA_desc: "Un pacto respaldado por el Estado abre mercados saudíes a la industria francesa y trae capital del Golfo a Francia."
 SAU_grievance_bitter: "Oficial Corps: Bitter"
 SAU_grievance_brink: "Oficial Corps: En el Brink"
 SAU_grievance_contained: "Oficial Corps: Contained"
 SAU_grievance_mutinous: "Oficial Corps: Mutinous"
 SAU_grievance_restive: "Oficial Corps: Restive"
 SAU_guardian_of_palestine: "Guardian of Palestine"
 SAU_guardian_of_palestine_desc: "Al defender la causa palestina, el Reino se ha ganado a través del mundo musulmán, otorgando legitimidad al trono en casa y en el extranjero."
 SAU_gulf_war_lessons: "Lecciones de la Guerra del Golfo"
 SAU_gulf_war_lessons_desc: "La Guerra del Golfo de 1991 expuso graves debilidades en el equipo, la doctrina y el mando sauditas. El Estado Mayor está estudiando modelos competidores para la reforma militar pero aún no ha seleccionado uno.\n\n§G+5%§! Obtención de experiencia del ejército\n§G+5%§! Velocidad de planificación\n\n§YArranca los 'Juegos de guerra: lecciones del Golfo' decisión de elegir una doctrina.§!"
 SAU_hajj_management_01: "Custodio de las Dos Mezquitas Santas"
 SAU_hajj_management_01_desc: "Como guardianes de Meca y Medina, el gobierno saudí supervisa la peregrinación anual de Hajj, acogiendo aproximadamente dos millones de musulmanes de todo el mundo cada año. La peregrinación genera ingresos significativos a través del turismo, el transporte y la hospitalidad, al tiempo que otorga al Reino prestigio religioso sin igual en todo el mundo musulmán."
 SAU_hormuz_shield: "El escudo de Hormuz"
 SAU_hormuz_shield_desc: "Las escoltas navales sauditas protegen a los petroleros que pasan por el estrecho de Hormuz y reducen la capacidad de Irán para interrumpir los envíos de petróleo."
 SAU_IMEC_india_deal_new: "Corredor IMEC"
 SAU_IMEC_india_deal_new_desc: "El corredor India-Middle East-Europe canaliza el comercio indio a través de puertos y carril saudíes. El Reino recoge los peajes de una nueva Ruta de la Seda."
 SAU_IMEC_india_deal_new_loc: "\n§H[RAJ.GetFlag] Corredor Económico de Europa Oriental y Medio India§! (IMEC) [SAU.GetFlag]\nVelocidad de construcción: §G+5,00%§!\nGanancia de combustible por Fossil Fuels: §G+3.00%§!\n§HResource Export Revenue§! Multiplier: §G+1.50%§!\n"
 SAU_India_one_IMEC_india_deal: "[RAJ.GetFlag] §HCorredor Económico India-Oriente Medio-Europa§![SAU.GetFlag] (IMEC)"
 SAU_India_one_IMEC_india_deal_desc: "El corredor económico India-Middle East-Europe vincula puertos indios a través del Golfo con mercados europeos por ferrocarril y mar. India se encuentra en la puerta oriental del corredor y las ganancias con cada envío."
 SAU_iraq_border_defense: "North Frontier Defenses"
 SAU_iraq_border_defense_desc: "El ejército está excavado a lo largo de la frontera iraquí, listo para cualquier repetición de 1990. +10% defensa contra Irak. Levanta una vez que Saddam se ha ido."
 SAU_iraq_pipeline_t1: "Europa Pipeline (Tier I)"
 SAU_iraq_pipeline_t1_desc: "El petróleo saudí fluye al norte por Irak hacia Turquía y el mercado europeo Moscú guarda tan celos. §G Ingresos adicionales: $ 2.25B§! de las exportaciones de oleoductos, contra §R Gastos adicionales: $ 1.00B§! en derechos de tránsito a los países la línea cruza - una red §G+$ 1.25B§! por semana. Sabotaje deja caer la línea un tier, cortando ambos; una línea de nivel 1 cortada cierra la ruta."
 SAU_iraq_pipeline_t2: "Europa Pipeline (Tier II)"
 SAU_iraq_pipeline_t2_desc: "El petróleo saudí fluye al norte por Irak hacia Turquía y el mercado europeo Moscú guarda tan celos. §G Ingresos adicionales: $ 2.75B§! de las exportaciones de oleoductos, contra §R Gastos adicionales: $ 1.15B§! en tarifas de tránsito a los países la línea cruza - una red §G+$ 1.60B§! por semana. Sabotaje deja caer la línea un tier, cortando ambos; una línea de nivel 1 cortada cierra la ruta."
 SAU_iraq_pipeline_t3: "Europa Pipeline (Tier III)"
 SAU_iraq_pipeline_t3_desc: "El petróleo saudí fluye al norte por Irak hacia Turquía y el mercado europeo Moscú guarda tan celos. §GIngresos adicionales: $ 3.25B§! de las exportaciones de oleoductos, contra §R Gastos adicionales: $ 1.25B§! en tarifas de tránsito a los países la línea cruza - una red §G+$ 2.00B§! por semana. Sabotaje deja caer la línea un tier, cortando ambos; una línea de nivel 1 cortada cierra la ruta."
 SAU_islamic_leadership: "Líder del Mundo Islámico"
 SAU_islamic_leadership_desc: "La custodia de Arabia Saudita de Meca y Medina y su papel en las grandes cumbres islámicas dan a Riyadh una influencia sustancial en todo el mundo musulmán."
 SAU_israel_tech_partnership: "Silicona y Arena"
 SAU_israel_tech_partnership_desc: "Los Acuerdos de Riad combinan la inversión saudita con la tecnología israelí y apoyan la investigación conjunta en ambos países."
 SAU_junta_accepted: "El Consejo: Aceptado"
 SAU_junta_contested: "El Consejo: Concurtido"
 SAU_junta_illegitimate: "El Consejo: Ilegítimo"
 SAU_junta_rejected: "El Consejo: Rechazado"
 SAU_junta_tolerated: "El Consejo: Tolerado"
 SAU_laf_offensive: "Operación Cedar Resolve"
 SAU_laf_offensive_desc: "La financiación y el equipo sauditas han incrementado la capacidad del Ejército Libanés y su voluntad de llevar a cabo operaciones ofensivas contra Hezbollah."
 SAU_national_water_pride_minus1: "§H Aguas reinantes§! - §YDoubtful§!"
 SAU_national_water_pride_minus1_desc: "A 35-44% Estabilidad, confianza pública en la §LPropiedad saudita§! el programa de agua se está debilitando. §Ypequeña pérdida de legitimidad§! para la dinastía."
 SAU_national_water_pride_minus2: "§H Aguas sobresalientes§! - §REntrenada§!"
 SAU_national_water_pride_minus2_desc: "La baja estabilidad ha aumentado la crítica privada del programa §Lnacional de agua§!. Su mal desempeño daña la reputación de la dinastía."
 SAU_national_water_pride_minus3: "§H Aguas soberbias§! - §RRecuperación§!"
 SAU_national_water_pride_minus3_desc: "El programa de agua se ha convertido en un ejemplo prominente de mala gestión gubernamental. La persistente escasez está causando una pérdida de apoyo §R grave§! para la dinastía."
 SAU_national_water_pride_minus4: "§H Aguas reinantes§! - §RCatastrófica§!"
 SAU_national_water_pride_minus4_desc: "En condiciones de §Rinestabilidad extrema§!, la escasez de agua ha dañado gravemente la legitimidad de la §HCasa de al Saud§!. Sólo la estabilidad restaurada o la caída de la dinastía terminará esta pena."
 SAU_national_water_pride_neutral: "§H Aguas soberbias§! - §YSteady§!"
 SAU_national_water_pride_neutral_desc: "Aproximadamente el 50% Estabilidad, el programa nacional de agua no proporciona ningún beneficio político ni una pena. Un cambio en Estabilidad lo moverá hacia un nivel positivo o negativo."
 SAU_national_water_pride_plus1: "§H Aguas soberbias §! - §GSatisfecho§!"
 SAU_national_water_pride_plus1_desc: "La estabilidad adecuada y el servicio de agua confiable preservan la reputación de la dinastía y proporcionan un beneficio político §Gmodest§!."
 SAU_national_water_pride_plus2: "§H Aguas reinantes§! - §G Conducción§!"
 SAU_national_water_pride_plus2_desc: "Fuerte estabilidad y funcionamiento fiable de la §LPropiedad saudita§! El sistema de desalinización demuestra la competencia del Gobierno y mejora el respeto al §HCasa de al Saud§!."
 SAU_national_water_pride_plus3: "§H Aguas soberbias§! - §GConfident§!"
 SAU_national_water_pride_plus3_desc: "La alta estabilidad ha hecho que el programa nacional de agua sea un §Hfuente de prestigio interno§!. Demanda de §LKKAUST§! experiencia en el extranjero y los rendimientos financieros del programa proporcionan beneficios adicionales."
 SAU_national_water_pride_plus4: "§H Aguas soberbias§! - §GTriumphant§!"
 SAU_national_water_pride_plus4_desc: "Al más alto nivel de estabilidad, el §LPropiedad saudita§! el programa de agua es ampliamente considerado como un gran logro nacional. §HCasa de al Saud§! el beneficio máximo de legitimidad del programa."
