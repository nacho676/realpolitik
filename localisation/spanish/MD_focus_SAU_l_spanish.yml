 SAU_establish_corruption_courts_choice_tt: "§YEl reinado es redefinido§! - los tribunales cortan la corrupción, y el poder tributario y político se levanta con ellos. §R Precio de los inversores en el nuevo riesgo§!, y los acusados tienen amigos."
 SAU_the_ritz_carlton_purge_choice_tt: "§YEl reinado está en forma§! - la purga compra poder político, corrupción más barata y mejor inteligencia. §R El capital extranjero lo lee como expropiación§! y precios del Reino en consecuencia."
 SAU_backdoor_deals_choice_tt: "§YEl reinado se rehace§! - los rendimientos, los ingresos del mercado y la inversión mejoran. §R La corrupción se profundiza dos veces más §!, y la corte paga por ella en el poder político."
 SAU_new_partners_choice_tt: "§YLa elección sigue§! - el Consejo elige un garante fuera del Golfo: 'Turquía' / 'Irán' / 'India' / 'Pakistán' / 'Rusia'. A quien sea elegido se le pide que responda."
 SAU_the_khaleeji_union_choice_tt: "§GEl Golfo se convierte en un estado§! - cada miembro del GCC restante está §H junto con sus fuerzas §!, su tierra es cored, y el Reino toma el nombre §HKhaleej§!."
 SAU_ras_al_khair_complex: "Complejo Ras Al-Khair"
 SAU_ras_al_khair_complex_desc: "En la costa del Golfo al norte de Jubail el Reino derrama hormigón para un complejo desalinización y poder a una escala que nadie ha intentado. Es dinero estatal, tierra estatal y mano de obra estatal, y seguirá funcionando cuando los hombres que firmaron por ella se hayan ido.\n\n§GConstruye una central e infraestructura de combustibles fósiles en Haasa§! y mantiene el país.\n\n§RCostes 60bn§!. Construido por el Reino, propiedad del Reino."
 SAU_the_shuaibah_iwpp: "La Shuaibah IWPP"
 SAU_the_shuaibah_iwpp_desc: "Al sur de Jeddah un consorcio toma la planta de agua y energía en su propio balance y vende la salida al Reino bajo un contrato de veinte años. Es más barato, es más rápido, y el medidor se lee en otra capital.\n\n§GConstruye una central eléctrica de combustibles fósiles e infraestructura energética en Hejaz§!.\n\n§RCostes 30bn y profundiza la influencia americana§!. La mitad del precio, y no completamente el tuyo."
 SAU_the_sovereign_saudi_water_company: "La soberana compañía de agua saudita"
 SAU_the_sovereign_saudi_water_company_desc: "Quien haya colocado la tubería, el Reino pone ahora una sola empresa soberana sobre todo - aranceles, reservas, asignación entre las provincias. Por primera vez hay un escritorio donde la pregunta 'cuánta agua tiene el Reino' tiene una respuesta.\n\n§G Abre Aguas Soberanas§!, la posición del Reino sobre el agua y otorga poder político.\n\nNo hace agua. Hace que el Reino rinda cuentas por ello."
 SAU_throttle_pipeline_yemen: "Tranquilícese la tubería del mar árabe"
 SAU_throttle_pipeline_yemen_desc: "Recortar un nivel la línea del sur. Enviamos menos y ganamos menos, pero la tasa de tránsito de Saná cae con ella y sentirán el apretón mucho antes que nosotros."
 SAU_throttle_pipeline_syria: "Tranquilízate con la Pipeline Levant"
 SAU_throttle_pipeline_syria_desc: "Recortar un nivel la línea del Mediterráneo. Amán y Damasco se llevan una porción menor y ambas recuerdan de quién es el crudo que llena la tubería."
 SAU_throttle_pipeline_iraq: "Tranquilícese la tubería de Europa"
 SAU_throttle_pipeline_iraq_desc: "Recortar un nivel la línea del norte. La tasa de Bagdad se reduce en consecuencia: presión aplicada sin cerrar del todo las válvulas."
 SAU_tt_pipeline_shutdown_dependence: "§GReduce la dependencia del petróleo.§! Con la línea cerrada, el Reino se apoya menos en la exportación de crudo."
 SAU_shutdown_pipeline_yemen: "Cerrar el oleoducto del Mar Arábigo"
 SAU_shutdown_pipeline_yemen_desc: "Cerrar las válvulas en Al Mahrah. Los ingresos de exportación cesan, pero también las tasas de tránsito que pagamos a Saná, y Yemen no perdonará que se le corte el suministro."
 SAU_shutdown_pipeline_syria: "Cerrar el oleoducto del Levante"
 SAU_shutdown_pipeline_syria_desc: "Cerrar la línea del Mediterráneo. Amán y Damasco pierden sus tasas de tránsito y ambas recordarán quién apagó las bombas."
 SAU_shutdown_pipeline_iraq: "Cerrar el oleoducto a Europa"
 SAU_shutdown_pipeline_iraq_desc: "Cerrar el oleoducto troncal del norte. La extensión turca se queda sin nada que transportar y se cierra con él; Bagdad y Ankara pierden sus tasas."
 SAU_shutdown_pipeline_turkey: "Cerrar la extensión turca"
 SAU_shutdown_pipeline_turkey_desc: "Deja de bombear por la frontera iraquí. La línea del tronco permanece abierta - sólo Ankara pierde su corte, y Ankara se dará cuenta."
 SAU_events.355.a: "Aprobar la venta."
 SAU_events.355.b: "Rechazar la solicitud."
 SAU_events.355.desc: "Riyadh quiere el Paladin, y lo quiere en números. El Reino ha disparado a los americanos 155 mm desde la década de 1970, por lo que las tripulaciones, el calibre y toda la cadena de dirección de fuego ya son nuestras; lo que están comprando es la torreta digital que permite un disparo de batería y desplazarse antes de que el radar de contra-batería responda. Los saudíes pagarán en efectivo y a tiempo, y el acuerdo mantiene a un competidor fuera de un parque de armas que hemos mantenido durante treinta años. También pone a nuestros lanzadores dentro de un rango de una guerra fronteriza que no controlamos."
 SAU_events.355.t: "Saudi Solicitud de Artillería Americana"
 SAU_events.356.a: "Aprobar la venta."
 SAU_events.356.b: "Rechazar la solicitud."
 SAU_events.356.desc: "Una petición inusual ha llegado de Riyadh: los saudíes quieren la Msta-S. El Reino nunca ha comprado un arma rusa, y sus artilleros han entrenado toda su carrera en los calibres occidentales, por lo que el caso práctico para esto es delgado. El caso político no lo es. La venta al ejército mejor financiado en el Golfo abriría un mercado que Washington ha tratado como cerrado desde el embargo de petróleo, y cada otra capital del Golfo se daría cuenta de qué manera había mirado Riyadh."
 SAU_events.356.t: "Saudi Solicitud de artillería rusa"
 SAU_events.357.a: "Aprobar la venta."
 SAU_events.357.b: "Rechazar la solicitud."
 SAU_events.357.desc: "Riyadh ha pedido el CAESAR, y por una vez el lanzamiento de ventas se escribe. Un arma montada en camión cruza las distancias del Reino bajo su propio poder, no necesita ningún transportador, y puede estar de vuelta en el movimiento un minuto después de la última ronda. Los saudíes han visto lo que hace un auitzer en su frontera sur y han llegado a la conclusión obvia. La orden mantendría la línea en Roanne caliente durante años y ataba Riyadh a conchas francesas, barricas francesas y técnicos franceses."
 SAU_events.357.t: "Saudi Solicitud de artillería francesa"
 SAU_events.358.a: "Aprobar la venta."
 SAU_events.358.b: "Rechazar la solicitud."
 SAU_events.358.desc: "Los saudíes quieren el PzH 2000, que es halagador y torpe en igual medida. Es el mejor auitzer del mundo y todo el mundo en el negocio lo sabe; es también la razón por la que el Bundestag pasará una quincena discutiendo sobre dónde terminan estas armas. El Reino es un cliente que paga con una guerra en su frontera sur, y la licencia debe ser firmada por un gobierno que ha prometido tener cuidado con eso exactamente. La industria quiere el orden. Puede que la coalición no sobreviva concediéndola."
 SAU_events.358.t: "Saudi Solicitud de artillería alemana"
 SAU_events.364.a: "Aprobar la venta."
 SAU_events.364.b: "Rechazar la solicitud."
 SAU_events.364.desc: "Riyadh está pidiendo el M270, y esta no es otra venta de artillería. Un lanzador que pone el valor del acero de un batallón en una cuadrícula cuadrada en menos de un minuto es un arma estratégica, y los cohetes que dispara son nuestros para abastecer o retener durante tanto tiempo como el Reino posee los lanzadores. Eso es apalancamiento, y también es la exposición: cualquiera que estos lanzadores sean utilizados será reportado con nuestra bandera en la caja."
 SAU_events.364.t: "Saudi Solicitud de Artillería Rocket Americana"
 SAU_events.365.a: "Aprobar la venta."
 SAU_events.365.b: "Rechazar la solicitud."
 SAU_events.365.desc: "Riyadh ha pedido comprar el Smerch, y la solicitud nos dice más de lo que el orden ganaría. Nadie vende un lanzador de 300 mm a un país que puede comprar americano, a menos que ese país haya sido rechazado. El Reino quiere llegar a él no puede entrar en Washington, y está dispuesto a venir a Moscú para encontrarlo. Las armas son una buena venta. El precedente es mejor."
 SAU_events.365.t: "Saudi Solicitud de Artillería Rusa Rocket"