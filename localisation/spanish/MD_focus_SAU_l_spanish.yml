 SAU_events.354.t: "Saudi Solicitud de un buque de guerra alemán"
 SAU_events.360.a: "§HEstablezca un Fondo Soberano de la Wealth.§! Bloquee el viento e invierta para el futuro."
 SAU_events.360.b: "§HFund Grand Megaprojects.§! Vierta el dinero en fábricas y ciudades en casa."
 SAU_events.360.c: "§HDistribuir a la gente.§! Los subsidios y los bonos compran lealtad y calma."
 SAU_events.360.d: "Escalada cruzada de $ 25 a más §G$ 140 por barril§!. Los Petrodollares inundan el tesoro más rápido de lo que el Reino puede contar. La caída §Y2003-2008§! es una oportunidad de una vez en generación - y cómo se gasta dará forma al Reino durante décadas. El Consejo debate: §L ¿salvarlo, construir con él, o compartirlo§!?"
 SAU_events.360.t: "§HEl Boom de Aceite§!"
 SAU_events.361.a: "§RUn golpe indignante§!."
 SAU_events.361.b: "Encontrar nuevos proveedores y montarlo."
 SAU_events.361.d: "Riyadh se ha unido a un embargo de petróleo árabe contra nosotros. Los Tankers se sientan ociosos en el Golfo, nuestras refinerías se están quedando secas y los precios de la bomba se están quedando sin control. Factorías ociosos y motoristas colan durante horas.\n\nLos saudíes dicen que los grifos permanecerán cerrados hasta que nuestra política hacia la región cambie. Nuestra economía sentirá la presión durante todo el tiempo que tenga el embargo."
 SAU_events.361.t: "§R Arabia Saudí Corta nuestro petróleo§!"
 SAU_events.362.a: "§GLa tierra es nuestra espada.§!"
 SAU_events.362.b: "§REl tiempo de esta tormenta será§!."
 SAU_events.362.c: "Una escalada peligrosa."
 SAU_events.362.d: "En un eco de §H1973§!, el Reino de Arabia Saudita ha proclamado un embargo sobre los envíos de petróleo a Occidente y a los amigos de Israel. §LUnited States, Britain, France, Germany and the Netherlands§! ahora se enfrentan a la escasez de combustible, los precios racionados y el alza.\n\nEn todo el mundo árabe y musulmán, la multitud aclama el desafío de Riyadh. En las capitales occidentales, los gobiernos luchan por proveedores alternativos y advierten de recesión. El petróleo, una vez meramente un bien, se ha convertido en un arma de artesanía estatal."
 SAU_events.362.t: "§HArabia Saudita anula el arma de aceite§!"
 SAU_events.363.a: "§YEl barril siempre llama.§! (§ROil Dependence +2§!)"
 SAU_events.363.d: "Incluso cuando el Reino diversifica, la gravedad de la cruda nunca deja ir. Cada ministerio, cada línea presupuestaria, cada petrodollar fácil revuelve la economía hacia el barril. Intereses verdosos, energía barata y el camino de la menor resistencia todo tiran en una dirección.\n\nSin esfuerzo constante, el Reino retrocede hacia la dependencia del petróleo."
 SAU_events.363.t: "§REl Tiro del Petróleo§!"
 SAU_events.370.a: "§GEmbrace market reform.§! Deje que el sector privado dirija."
 SAU_events.370.b: "§RProtege el orden establecido.§! El cambio puede esperar."
 SAU_events.370.d: "Los tecnócratas del Ministerio de Economía presionan para §Lderegulación, privatización y mercados abiertos§!. La vieja guardia advierte que moverse demasiado rápido desvelará el contrato social en el que se construye el Reino. El Consejo debe indicar una dirección."
 SAU_events.370.t: "§HCambio económico§!"
 SAU_events.371.a: "§GExpand opportunities for women.§! La economía necesita todo talento."
 SAU_events.371.b: "§RActualizar los roles tradicionales.§! Preserve la estructura familiar."
 SAU_events.371.d: "Una nueva generación de mujeres sauditas educadas quieren trabajar, y la economía las necesita. Los reformadores ven un talento sin explotar; el §LUlema§! y las familias conservadoras ven una línea que no debe ser cruzada."
 SAU_events.371.t: "§H Mujeres en la fuerza de trabajo§!"
 SAU_events.372.a: "§GPermitir el acceso abierto.§! El Reino no puede ocultarse del mundo."
 SAU_events.372.b: "§RFilter and censor.§! Guarda la moral pública."
 SAU_events.372.d: "La televisión por satélite y la Internet temprana vierten ideas extranjeras en salas de estar saudíes. Los liberales dan la bienvenida a la apertura al mundo; los tradicionalistas exigen el filtro estatal lo que llega a los fieles."
 SAU_events.372.t: "§HDishes de satélite y Internet§!"
 SAU_events.373.a: "§GArregla su autoridad.§! Rein en las patrullas."
 SAU_events.373.b: "§RReafirme su mandato.§! La virtud debe ser ejecutada."
 SAU_events.373.d: "El §LComité para la Promoción de Virtud§! patrulla las calles enforzando el vestido, la oración y la mezcla de sexos. Los habitantes de la ciudad y las empresas caen en su poder; el clero les considera los guardianes del alma de la nación."
 SAU_events.373.t: "§HLa Policía Religiosa§!"
 SAU_events.380.a: "Permitir cuentas convencionales de interés."
 SAU_events.380.b: "Prohibición estricta de la riba - La Sharia es suprema."
 SAU_events.380.c: "Sukuk en público, interés pragmático en privado."
 SAU_events.380.d: "El Reino debe tomar una posición sobre §Lriba§! - la prohibición del interés. §L Reformadores seculares§! argumentan que las cuentas convencionales de interés atraen al capital extranjero y modernizan la banca. El §LConsejo de Estudios Superiores§! exige una prohibición estricta consistente con la Sharia. A §Hhybrid§! permite sukuk para el público, interés informal detrás de puertas cerradas."
 SAU_events.380.t: "§HLa Ley de Interés Normalizado§!"
 SAU_events.381.a: "Reserva fraccional moderna - crecimiento al costo de la estabilidad."
 SAU_events.381.b: "Asset-backed only - estable pero más lento."
 SAU_events.381.c: "Requisitos de reserva moderados."
 SAU_events.381.d: "¿Cuánto crédito pueden crear los bancos de cada riyal de depósitos? El modelo §LWestern§! utiliza la banca de reserva fraccional §H §! - 10:1 apalancamiento, más crédito, más crecimiento, más riesgo. La §L alternativa islámica§! exige §H respaldo de activos completos§! - cada préstamo ligado a la riqueza real, más lento pero estable. El §Hhybrid§! establece requisitos de reserva moderados."
 SAU_events.381.t: "§H Mandatos de Reserva Natural§!"
 SAU_events.382.a: "Regulación de la luz - permiten derivados y futuros."
 SAU_events.382.b: "Prohibición estricta - sin gharar, sin juego."
 SAU_events.382.c: "Los derivados regulados sólo - enfoque equilibrado."
 SAU_events.382.d: "¿Qué tan ajustado debería regular el Reino §Lespecie, derivados y futuros§!? La vista §Loccidental§! los considera como herramientas vitales de gestión del riesgo. La §L vista islámica§! los condena como §Lghar§! (excesiva incertidumbre) - poco mejor que el juego. A §Hhybrid§! permite únicamente derivados regulados."
 SAU_events.382.t: "§HLas directivas antiespeculación§!"
 SAU_events.383.a: "Mercado interbancario convencional basado en intereses."
 SAU_events.383.b: "Mercado interbancario islámico basado en Murabaha."
 SAU_events.383.c: "Híbrido - ambos, corre por separado."
 SAU_events.383.d: "Cuando los bancos se prestan unos a otros, ¿en qué términos? §LModelo occidental§! usos §Hcorredores convencionales de tipos de interés§! (tipo LIBOR). §LIslamic alternative§! rutas interbandas por §Hmurabaha§! - financiación con cargo a los costos y gastos. §Hhíbrido§! permite ambos, sectorialmente."
 SAU_events.383.t: "§HEl Código de Lending Interbank§!"
 SAU_events.384.a: "SAMA - regulador secular independiente."
 SAU_events.384.b: "SAMA + Consejo Sharia con veto vinculante."
 SAU_events.384.c: "Híbrido - dos estructuras paralelas."
 SAU_events.384.d: "¿Quién supervisa los bancos del Reino? §LModelo occidental§! # §LSAMA§! (Agencia Monetaria de Arabia Saudita) §Hregulador tecnocrático independiente§!. §LIslamic alternative§! pares SAMA con un §HSharia oversight council§! - clérigo con poder de veto vinculante. §Hhíbrido§! son dos estructuras paralelas."
 SAU_events.384.t: "§HLa Ley de Control Bancario§!"
 SAU_events.385.a: "Ortodoxia estricta - sin compromiso."
 SAU_events.385.b: "Pragmatic - liderar el mercado financiero islámico global."
 SAU_events.385.d: "El Reino se compromete plenamente a §H las finanzas islámicas§!. ¿Pero qué tan estrictamente? §L Ortodoxia estricta§! - no compromiso, cada transacción bendecida por Sharia- gana el apoyo incondicional del §LUlema§! y estabilidad para las generaciones. §LPragmatic Islamic§! - global Islamic finance hub, attracting Muslim capital from §LMalaysia§!, §LIndonesia§!, §LIran§!, the §LGulf§! - sacrifica un grado de pureza para influencia."
 SAU_events.385.t: "§HBastion of Islamic Finance§!"
 SAU_events.386.a: "Full Anglo-Saxon - todos los instrumentos permitidos."
 SAU_events.386.b: "Gradual - práctica occidental con chapa de Sharia."
 SAU_events.386.d: "El Reino rompe con la tradición y §H seculariza§! su sector financiero. El camino §LFull Anglo-Saxon§! adopta cada instrumento occidental - §Hderivatives§!, §Hbonds§!, §Hmargin trading§! - dibuja capital extranjero máximo pero enrage el §LUlema§!. El camino §LGradual§! mantiene un chapero de Sharia sobre la práctica occidental - menos ingresos, menos retroceso."
 SAU_events.386.t: "§GLa secularización de las finanzas§!"
 SAU_events.39.a: "La tormenta se ha roto."
 SAU_events.39.d: "Los aviones de combate de la Arabia Saudita y la coalición han alcanzado objetivos en todo el Yemen controlado por Houthi en una campaña aérea radical. Riyadh ha declarado su intención de restaurar el gobierno reconocido y retroceder al movimiento respaldado por Irán. El Medio Oriente respira."
 SAU_events.39.t: "Operación Tormenta Decisiva Comienza"
 SAU_events.390.a: "Aprobar la venta a Riyadh"
 SAU_events.390.b: "Rechazar la solicitud"
 SAU_events.390.d: "El Reino de Arabia Saudita ha solicitado formalmente la compra del F-15 Strike Eagle - nuestro mejor luchador de exportación. Riyadh es un aliado clave del Golfo y un importante cliente de armas. ¿Aprobamos la venta?"
 SAU_events.390.t: "Solicitud saudita: el F-15 strike Eagle"
 SAU_events.391.a: "Excelentes noticias."
 SAU_events.391.d: "Los Estados Unidos han acordado vender el F-15 Strike Eagle al Reino. El acuerdo está hecho - la Royal Saudi Air Force pronto volará los mejores jets americanos."
 SAU_events.391.t: "Washington aprueba el acuerdo F-15"
 SAU_events.392.a: "A setback."
 SAU_events.392.d: "Los Estados Unidos se han negado a vender el F-15 en este momento. Podemos renovar nuestra solicitud después de un tiempo."
 SAU_events.392.t: "Washington Declines"
 SAU_events.393.a: "Aprobar la exportación"
 SAU_events.393.b: "Rechazar la solicitud"
 SAU_events.393.d: "Arabia Saudita ha solicitado al Tifón Eurofighter en el marco del programa Al Salam. Como socio del consorcio, ¿Alemania aprobará la exportación a Riyadh?"
 SAU_events.393.t: "Saudi Solicitud: el Eurofighter Typhoon"
 SAU_events.394.a: "Excelentes noticias."
 SAU_events.394.d: "El consorcio ha acordado exportar el Tifón Eurofighter al Reino. El programa Al Salam puede proceder ahora."
 SAU_events.394.t: "El acuerdo de tifonía está aprobado"
 SAU_events.395.a: "A setback."
 SAU_events.395.d: "Los europeos se han negado a exportar el tifón por ahora. Podemos intentarlo de nuevo más tarde."
 SAU_events.395.t: "El trato del tifón está destilado"
 SAU_events.396.a: "Aprobar la venta a Riyadh"
 SAU_events.396.b: "Rechazar la solicitud"
 SAU_events.396.d: "El Reino de Arabia Saudita desea ampliar el programa Al Yamamah y comprar el Tornado GR4 actualizado. Riyadh ha sido un cliente leal de la industria británica durante décadas. ¿Aprobamos la venta?"
 SAU_events.396.t: "Saudi Solicitud: el Tornado GR4"
 SAU_events.397.a: "Excelentes noticias."
 SAU_events.397.d: "El Reino Unido ha acordado suministrar el Tornado GR4 al Reino en virtud de un acuerdo ampliado de Al Yamamah. Nuestros escuadrones de la huelga serán la envidia del Golfo."
 SAU_events.397.t: "Londres aprueba el acuerdo Tornado"
 SAU_events.398.a: "A setback."
 SAU_events.398.d: "El Reino Unido se ha negado a ampliar el acuerdo de Tornado en este momento. Podemos renovar nuestra solicitud después de un tiempo."
 SAU_events.398.t: "London Declines"
 SAU_events.399.a: "Aprobar la exportación"
 SAU_events.399.b: "Rechazar la solicitud"
 SAU_events.399.d: "Arabia Saudita ha solicitado al Panavia Tornado IDS, el avión de ataque multinacional. Como socio del consorcio, ¿Italia aprobará la exportación a Riyadh?"
 SAU_events.399.t: "Saudi Solicitud: la Panavia Tornado"
 SAU_events.4.a: "Excelentes noticias."
 SAU_events.4.d: "[FROM.GetNameDefCap] ha aceptado nuestra oferta. El acuerdo ahora puede avanzar."
 SAU_events.4.t: "[FROM.GetNameDefCap] Acepta la Oferta"
 SAU_events.40.a: "Contención: aislar y estrangular el régimen."
 SAU_events.40.b: "Detente cauteloso: baja la temperatura, por ahora."
 SAU_events.40.c: "Paso de guerra: atacaremos antes que él."
 SAU_events.40.d: "Saddam sigue gobernando en Bagdad, y la memoria de Kuwait y Khafji se cuelga sobre el Golfo. El Reino debe establecerse en cómo tratará con este peligroso vecino, antes de que él decida apostar nuevamente."
 SAU_events.40.t: "La sombra de Saddam"
 SAU_events.400.a: "Excelentes noticias."
 SAU_events.400.d: "Italia ha acordado exportar el IDS Panavia Tornado al Reino. El consorcio da la bienvenida a un nuevo operador valorado."
 SAU_events.400.t: "Roma aprueba el acuerdo Tornado"
 SAU_events.401.a: "A setback."
 SAU_events.401.d: "Italia se ha negado a exportar el Tornado por ahora. Podemos intentarlo de nuevo más tarde."
 SAU_events.401.t: "Rome Declines"
 SAU_events.5.a: "A setback."
 SAU_events.5.d: "[FROM.GetNameDefCap] ha rechazado nuestra oferta. Las relaciones entre nuestros países sufrirán."
 SAU_events.5.t: "[FROM.GetNameDefCap] Rechaza la Oferta"
 SAU_events.56.a: "Anfitriona de las conversaciones en Beijing."
 SAU_events.56.b: "Esta no es nuestra pelea."
 SAU_events.56.d: "Arabia Saudita nos pide que mediamos entre Riad y Teherán. Ambas costas del Golfo nos venden petróleo, y su disputa amenaza a cada petrolero en el que dependemos. La celebración de las conversaciones coronaría a Beijing como el poder indispensable de la región."
 SAU_events.56.t: "A Solicitud de Riyadh"
 SAU_events.57.a: "Firme el acuerdo."
 SAU_events.57.b: "No nos sentaremos con ellos."
 SAU_events.57.d: "China nos invita a Beijing a firmar un acuerdo con Arabia Saudita: relaciones restauradas, embajadas reabiertas y un fin al sangramiento proxy. Los saudíes ya han acordado. El bolígrafo nos espera."
 SAU_events.57.t: "Una invitación a Beijing"
 SAU_events.58.a: "Un nuevo capítulo."
 SAU_events.58.d: "Bajo los auspicios chinos, el Reino y la República Islámica han firmado. Las embajadas reabrirán, los proxies se calmarán, y el Golfo respira. La rivalidad no ha terminado, pero los cuchillos están derramados."
 SAU_events.58.t: "El Acuerdo de Beijing"
 SAU_events.59.a: "So be it."
 SAU_events.59.d: "Las conversaciones se han derrumbado antes de que empezaran. La rivalidad continúa, y el Golfo sigue siendo peligroso."
 SAU_events.59.t: "Fracasos de mediación"
 SAU_events.6.a: "Únase al corredor."
 SAU_events.6.b: "Declarar la propuesta."
 SAU_events.6.d: "Arabia Saudita propone el Corredor Económico de la India-Middle East-Europe, una ruta comercial que une la India a Europa a través del Golfo mientras pasa por el Canal de Suez."
 SAU_events.6.t: "[SAU.GetFlag] El Corredor Este-Europa Medio India [RAJ.GetFlag]"
 SAU_events.60.a: "El ejército se mueve en Hezbollah."
 SAU_events.60.b: "El Líbano no sangrará por Riad."
 SAU_events.60.d: "El dinero saudí reconstruyó nuestro ejército; Los rifles saudíes llenan sus armories. Ahora Riad pregunta el precio: moverse contra Hezbolá y romper su estado dentro del estado. El ejército es más leído de lo que ha sido. Si el Líbano sobrevive al intento es otra pregunta."
 SAU_events.60.t: "Un mandato de Riad"
 SAU_events.61.a: "La orden vuelve al sur."
 SAU_events.61.d: "Las columnas del Ejército Libanés están rodando al sur mientras Beirut se mueve a restaurar la autoridad estatal sobre el sur del Líbano. Después de décadas de vivir junto a un estado dentro del estado, el gobierno ha ordenado que su ejército reconstruido desarmar a Hezbollah por la fuerza. Las capitales del Golfo aplauden; Teherán lo llama traición contra la resistencia."
 SAU_events.61.t: "Ejército libanés se mueve contra Hezbollah"
 SAU_events.63.a: "La evidencia habla."
 SAU_events.63.d: "Arabia Saudita ha puesto ante la Liga Árabe un expediente de fragmentos de misiles, manifiestos de envío e interceptado comunicaciones que rastrean el arsenal de Houthi a Irán. Las capitales árabes están respondiendo con unidad infrecuente, y las negaciones de Teherán están encontrando pocos oyentes."
 SAU_events.63.t: "Dossier expone la mano de Irán en Yemen"
 SAU_events.64.a: "Las calles son inquietos."
 SAU_events.64.d: "De Teherán a Beirut, la multitud está en las calles contra los gobiernos del Eje de Resistencia. Los reclamos de los manifestantes son locales, pero su financiación, nota de observadores, tiene un acento claramente del Golfo. El Eje culpa a las manos extranjeras; las manos extranjeras niegan todo."
 SAU_events.64.t: "Protestas Suda el eje de la resistencia"
 SAU_events.65.a: "La Ummah tiene una dirección."
 SAU_events.65.d: "El mundo islámico se ha reunido en su ciudad más santa por invitación saudita, con la delegación de Irán sentada entre los demás. Cualquier cosa que se decida detrás de puertas cerradas, la imagen es inconfundible: cuando el Ummah se reúne, se monta en Meca, y Riyadh se sienta a la cabeza de la mesa."
 SAU_events.65.t: "La Cumbre de la Meca"
 SAU_events.67.a: "Un apretón de manos en Beijing."
 SAU_events.67.d: "En una ceremonia que pocos creían posible, Arabia Saudita e Irán han firmado un acuerdo en Beijing para restaurar las relaciones diplomáticas después de años de rivalidad. Las embajadas se reabrirán y las guerras proxy son para calmarse. China ha negociado el acuerdo, y el mensaje a Washington es inconfundible: hay un nuevo mediador en Medio Oriente."
 SAU_events.67.t: "El Acuerdo de Beijing"
 SAU_events.68.a: "Oídlos."
 SAU_events.68.b: "No hay nada que discutir."
 SAU_events.68.d: "A través de intermediarios en un tercer capital, Arabia Saudita pregunta si Israel entretendría conversaciones sobre la normalización. Todavía no se han nombrado condiciones. La pregunta es si escuchar."
 SAU_events.68.t: "Un acercamiento silencioso de Riad"
 SAU_events.69.a: "Progreso."
 SAU_events.69.d: "La respuesta de Israel ha vuelto más caliente de lo esperado. La pista se mantiene, y las conversaciones pulgada hacia adelante."
 SAU_events.69.t: "Signales positivos de Tel Aviv"
 SAU_events.7.a: "Aceptar la asociación."
 SAU_events.7.b: "Descansa la oferta."
 SAU_events.7.d: "Riyadh propone una asociación de inversión estratégica centrada en Saudi Telecom Company e infraestructura surcoreana. Ambos países tendrían acceso al mercado del otro."
 SAU_events.7.t: "[SAU.GetFlag] Asociación de Arabia Saudita y Corea [KOR.GetFlag]"
 SAU_events.70.a: "Disappointing."
 SAU_events.70.d: "La respuesta de Israel ha vuelto el toque y el frío. La pista se ha estancado, y las conversaciones se atenuan con ella."
 SAU_events.70.t: "A Cold Responder"
 SAU_events.71.a: "Acepta las líneas de 1967. Un estado de paz."
 SAU_events.71.b: "Las líneas de 1967 son imposibles."
 SAU_events.71.d: "Arabia Saudita ha ofrecido oficialmente la Iniciativa de Paz Árabe: reconocimiento, embajadas, comercio y paz con todo el mundo árabe, a cambio de un Estado palestino independiente en las líneas de 1967. Es el premio más grande jamás ofrecido, al precio que Israel ha rechazado por décadas."
 SAU_events.71.t: "La Iniciativa de Paz Árabe"
 SAU_events.72.a: "Tómate el trato."
 SAU_events.72.b: "El dinero no es el problema."
 SAU_events.72.d: "Los negociadores saudíes endulzan la mesa: fondos de inversión, cielos abiertos, corredores tecnológicos y acceso al mercado más grande del Golfo. La paz con Riyadh no pagaría nada de paz."
 SAU_events.72.t: "La riqueza del Golfo"
 SAU_events.73.a: "Paz por un estado. Historia."
 SAU_events.73.d: "Arabia Saudita e Israel han firmado los Acuerdos de Riad: la plena normalización de las relaciones a cambio de que Israel acepte un Estado palestino independiente en las líneas de 1967, garantizado por Arabia Saudita y Jordania. La Iniciativa Árabe para la Paz, desestimada por una generación, ha redoblado el mapa del Oriente Medio en una sola tarde."
 SAU_events.73.t: "Los Acuerdos de Riad"
 SAU_events.74.a: "Las viejas líneas regresan."
 SAU_events.74.d: "Las conversaciones entre Riyadh y Tel Aviv han terminado sin acuerdo. Israel no aceptaría un Estado palestino; Arabia Saudita no abandonaría la demanda. La apertura diplomática más audaz de una generación se cierra con una puerta rebosante."
 SAU_events.74.t: "Los discursos saudíes-israelí colapsan"
 SAU_events.75.a: "La apuesta del siglo."
 SAU_events.75.d: "Sin condiciones, sin un Estado palestino y sin previo aviso, Arabia Saudita ha reconocido a Israel y ha abierto plenas relaciones. Washington celebra, Tel Aviv exults y la calle árabe quema. El Custodio de las Dos Mezquitas Santas ha hecho la apuesta del siglo."
 SAU_events.75.t: "Arabia Saudita reconoce a Israel"
 SAU_events.76.a: "Ha pasado el momento."
 SAU_events.76.d: "Las conversaciones con Israel se han quedado sin tiempo. Demasiadas preguntas permanecieron abiertas demasiado tiempo, y el momento ha pasado. Las delegaciones empacan silenciosamente, y las viejas líneas vuelven al mapa."
 SAU_events.76.t: "La ventana cierra"
 SAU_events.77.a: "Prepara los acuerdos."
 SAU_events.77.d: "Israel ha aceptado lo suficiente de nuestros términos para hacer realidad el acuerdo. Lo que queda es la firma, y los libros de historia."
 SAU_events.77.t: "Ruptura en las conversaciones"
 SAU_events.79.a: "Abre las conversaciones."
 SAU_events.79.b: "No hay nada que discutir."
 SAU_events.79.d: "A través de Washington y Ammán se dice que Arabia Saudita está lista para discutir la normalización, abiertamente y al más alto nivel. El precio será empinado y las conversaciones serán vigiladas por todo el mundo. Pero ninguna mano árabe esta grande ha sido extendida."
 SAU_events.79.t: "Una Overture de Riad"
 SAU_events.8.a: "Firme el pacto de defensa."
 SAU_events.8.b: "Declina el pacto."
 SAU_events.8.d: "Arabia Saudita propone un pacto de defensa mutua con Pakistán mientras las tensiones se elevan a través del Medio Oriente. El acuerdo incluiría garantías y acceso militar para ambos países."
 SAU_events.8.t: "[SAU.GetFlag] Pacto de Defensa saudí-paquistaní [PAK.GetFlag]"
 SAU_events.80.a: "Lo impensable, programado."
 SAU_events.80.d: "Riyadh y Tel Aviv lo han confirmado: se han iniciado conversaciones formales sobre la normalización de las relaciones. Las delegaciones ya están en el aire. Cada cancillería en la Tierra está reorganizando sus suposiciones sobre el Medio Oriente, y cada enemigo del acuerdo está empezando su propio reloj."
 SAU_events.80.t: "Las conversaciones saudíes-israelí comienzan"
 SAU_events.81.a: "Su negativa es su respuesta."
 SAU_events.81.d: "Tel Aviv ha rechazado incluso abrir negociaciones. La onza está muerta a la llegada, y la mano del Reino, extendida ante todo el mundo, se cuelga en el aire. No habrá trato en esta generación."
 SAU_events.81.t: "Israel rechaza las conversaciones"
 SAU_events.82.a: "Un futuro construido en hormigón y vidrio."
 SAU_events.82.d: "El plazo llega, y contra todas las predicciones que el Reino ha entregado. Los glitters de la NEOM en el Mar Rojo, Riyadh ha sido hecho nuevamente, y los turistas llegan donde sólo los derricks petroleros una vez se pararon. Arabia Saudita se ha comprado un futuro que no funciona en crudo."
 SAU_events.82.t: "Vision 2030 Delivered"
 SAU_events.83.a: "Las promesas llegaron."
 SAU_events.83.d: "El año es 2030, y la Visión no está construida en su mayoría. Las torres semiacabadas se oxidan en el desierto, las ciudades prometidas están vacías, y los cientos de miles de millones gastados tienen poco que mostrar. Los críticos que lo llamaron una fantasía están tomando su vuelta de victoria, y la gente está escuchando."
 SAU_events.83.t: "Los elefantes blancos"
 SAU_events.84.a: "Escríbelo."
 SAU_events.84.d: "Otro de los proyectos emblemáticos de la Visión ha pasado su plazo sin terminar. Los contratistas son pagados, las grúas bajan, y la prensa tiene su titular. El capital huye, y las dudas se extienden un poco más."
 SAU_events.84.t: "Un proyecto pierde su límite"
 SAU_events.88.a: "La sucesión ya está en cuestión"
 SAU_events.88.d: "El rey Fahd bin Abdulaziz Al-Saud está muerto. Sentido por un golpe hace una década, reinó en nombre mientras su medio hermano Abdullah gobernaba como regente, y ahora Abdullah asciende el trono en su propio derecho. Sin embargo, Abdullah es el mismo pasado ochenta, y a través de los majlis de la Casa de Saud los príncipes ya pesan quién lo seguirá.\n\n§YAhora comienza el concurso para tener éxito al Rey Abdullah. Ver las decisiones del Príncipe Heredero.§!"
 SAU_events.88.t: "La muerte del rey Fahd"
 SAU_events.89.a: "La corona pasa"
 SAU_events.89.d: "El rey Abdullah bin Abdulaziz Al-Saud está muerto. Durante una década los príncipes de la Casa de Saud pesaron y negociaron sobre quién debe seguirlo. Esa pregunta no puede esperar más, y el príncipe que manda la mayor parte de influencia será proclamado Rey.\n\n§YSalman bin Abdulaziz:§! [?SAU_salman_share|0]%\n§YMohammed bin Nayef:§! [?SAU_mbn_share|0]%\n§YMutaib bin Abdullah:§! [?SAU_mutaib_share|0]%"
 SAU_events.89.t: "La muerte del rey Abdullah"
 SAU_events.9.a: "Aceptar la asociación."
 SAU_events.9.b: "Descansa la oferta."
 SAU_events.9.d: "Arabia Saudita propone una asociación estratégica de inversión con China. El acuerdo ampliaría los proyectos de infraestructura china y fortalecería la posición de Beijing en el Golfo."
 SAU_events.9.t: "[SAU.GetFlag] Alianza Estratégica de la Arabia Saudita [CHI.GetFlag]"
 SAU_events.90.a: "Párese con la Corona"
 SAU_events.90.b: "Abolir el Reino"
 SAU_events.90.d: "La fiebre que barre el mundo árabe ha entrado en el Reino. Los cuervos llenan las calles de la Provincia Oriental y las ciudades del Hejaz, exigiendo un fin al dominio absoluto. El mutaween duda, el Guardia Nacional espera por sus órdenes, y la Casa de Saud debe decidir si responder a las personas con fuerza o dejar caer el viejo orden."
 SAU_events.90.t: "La primavera árabe enfrenta al Reino"
 SAU_events.91.a: "Cierra ahora."
 SAU_events.91.b: "Sostenlo como palanca"
 SAU_events.91.b.tt: "La decisión §YStrait Blockade§! se mantiene disponible para cerrar el estrecho en el momento de su elección."
 SAU_events.91.d: "La guerra ha llegado al Golfo. Nuestras baterías de misiles y botes de ataque rápido están listos a lo largo del Estrecho de Hormuz, la arteria por la que debe pasar una quinta parte del aceite mundial. Podemos ahogarlo ahora y poner la economía mundial en sus rodillas, o mantener la amenaza sobre nuestros enemigos y cerrarla en un momento de nuestra elección."
 SAU_events.91.t: "¿Cerrar el Estrecho de Hormuz?"
 SAU_events.92.a: "Proclamar la República Islámica"
 SAU_events.92.b: "Mantenga la República de Arabia"
 SAU_events.92.d: "Con el movimiento chiíta ascendente, la asamblea constituyente debe establecer qué tipo de estado será la república: una República Islámica fundada en la autoridad religiosa o la República secular de Arabia."
 SAU_events.92.t: "El carácter de la República"
 SAU_events.93.a: "Únete al eje iraní de la resistencia"
 SAU_events.93.b: "Forja un frente antiimperialista independiente"
 SAU_events.93.d: "Teherán extiende su mano a la nueva república chiíta. Los corredores deben elegir: tomar un lugar dentro del eje iraní de la resistencia bajo la tutela del Líder Supremo, o forjar un frente independiente que no responda a ningún capital extranjero."
 SAU_events.93.t: "El eje de la resistencia"
 SAU_events.94.a: "Únete al frente"
 SAU_events.94.b: "Declarar la invitación"
 SAU_events.94.d: "La República de Arabia levanta una bandera rival al eje de la resistencia, pidiendo a nuestra nación que rompa con Teherán y se uniera a un frente independiente liderado por Riad."
 SAU_events.94.t: "Una invitación de Arabia"
 SAU_events.95.a: "Únase a la Comintern Árabe"
 SAU_events.95.b: "Apartaos."
 SAU_events.95.d: "La Arabia Roja exhorta a los trabajadores y revolucionarios del mundo árabe a unirse bajo una sola bandera."
 SAU_events.95.t: "La Comintern Árabe"
 SAU_events.96.a: "Un amanecer rojo se levanta."
 SAU_events.96.d: "La bandera roja vuela sobre Riad. La Casa de Saud es barrida y se proclama la República Popular de Arabia, prometiéndose llevar la revolución a través del mundo árabe."
 SAU_events.96.t: "La República Popular de Arabia"
 SAU_events.97.a: "Así es proclamado"
 SAU_events.97.d: "La asamblea constituyente ha proclamado la República Islámica de Arabia, fundada en la tutela del jurista y el imperio de los fieles."
 SAU_events.97.t: "La República Islámica de Arabia"
 SAU_events.98.a: "Una grieta peligrosa"
 SAU_events.98.d: "Arabia ha roto con Teherán, rechazando la tutela iraní para liderar su propio frente antiimperialista. El mundo chiíta está dividido entre dos centros rivales de resistencia."
 SAU_events.98.t: "Cisma en el eje"
 SAU_events.99.a: "Ellos responderán por esto"
 SAU_events.99.d: "Riyadh ha roto con el Eje y ha atraído a nuestros aliados. Teherán debe decidir cómo responder a esta traición de la resistencia."
 SAU_events.99.t: "El saudí Schism"
