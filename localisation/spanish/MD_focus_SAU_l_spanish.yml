 SAU_corporate_policy: "Política empresarial y laboral"
 SAU_corporate_policy_tt: "§HCómo el Reino regula sus empresas y a quién se les permite contratar.§!"
 SAU_corporate_policy_2_tt: "§YLas cuotas de Nitaqat y las reglas de Kafala sobreviven a cualquier gobierno - estos términos sobreviven un cambio de régimen.§!"
 SAU_shura_rebalanced_tt: "§YLas tres bancas se reasientan a 40 escaños§! - el Consejo permanece impugnado y no se publica ninguna carta"
 SAU_shura_charter_ulema: "El consejo de eruditos mayores"
 SAU_shura_charter_ulema_desc: "El ala religiosa del Consejo está escrita en la Ley Fundamental. La legislación es leída por su conformidad antes de que se lea para cualquier otra cosa, y los eruditos responden sólo al Rey.\n\nEl Reino es más difícil de mover y mucho más difícil de subvertir. También deja de aprender tan rápido como sus vecinos."
 SAU_shura_charter_technocrats: "El Consejo de Planificación"
 SAU_shura_charter_technocrats_desc: "El Consejo se convierte en lo que sus tecnócratas siempre argumentan que debería ser, un órgano de planificación formado por personas que pueden leer un balance, con un mandato permanente sobre la política industrial y educativa.\n\nEl Reino moderniza más rápido de lo que se esperaba. Los hombres dejaron de consultar."
 SAU_shura_charter_notables: "La Sala de Familias"
 SAU_shura_charter_notables_desc: "Las grandes casas mercantes y tribales toman asientos permanentes, y el Consejo se convierte en la sala donde el patronato del Reino es negociado abiertamente en lugar de en privado.\n\nFunciona suave y barato. No pedirá al país nada difícil."
 SAU_events.220.t: "Los Planificadores piden un mandato"
 SAU_events.220.d: "Los tecnócratas ahora mantienen al Consejo de Seguridad. Han redactado una propuesta que haría permanente - un mandato permanente de planificación sobre la industria, la educación y el presupuesto, con la composición del Consejo fijada en la Ley Fundamental.\n\nEl Rey puede firmarlo y conseguir un gobierno que funcione, o rechazar y mantener una cámara que todavía pueda reequilibrar cuando le convenga."
 SAU_events.220.a: "Carta al Consejo de Planificación."
 SAU_events.220.b: "El Consejo permanece lo que yo hago."
 SAU_events.221.t: "Las familias presentan su caso"
 SAU_events.221.d: "Los notables sostienen el Consejo, y han venido al Diwan con una propuesta redactada por hombres que han estado negociando con esta familia durante un siglo - escaños permanentes para las grandes casas, a cambio de la tranquilidad que el Rey siempre ha confiado en ellos para guardar.\n\nEs el gobierno más barato disponible y el menos ambicioso."
 SAU_events.221.a: "Carta a la Cámara de Familias."
 SAU_events.221.b: "El Consejo permanece lo que yo hago."
 SAU_events.222.t: "Los eruditos piden ser escritos en"
 SAU_events.222.d: "El ulema sostiene al Consejo y desea que entre en la Ley Fundamental - un cuerpo permanente de eruditos mayores con primera lectura sobre cada medida que pasa el Reino.\n\nSe resolvería la cuestión de la autoridad religiosa en el Reino por una generación, a favor de los eruditos, y no puede ser deshecho por un Rey posterior en mal estado de ánimo."
 SAU_events.222.a: "Carta al Consejo de Becarios Superiores."
 SAU_events.222.b: "El Consejo permanece lo que yo hago."
 SAU_junta_grip_firm: "El escrito del Consejo corre"
 SAU_junta_grip_firm_desc: "Las órdenes emitidas en Riad se llevan a cabo en Jazan la misma semana. Los gobernadores provinciales responden al teléfono, los servicios de seguridad informan hacia arriba en lugar de lado, y nadie espera silenciosamente para ver qué camino va esto.\n\nEs la única ventaja que un gobierno de oficiales tiene sobre el que reemplazó."
 SAU_junta_grip_uneven: "An Uneven Writ"
 SAU_junta_grip_uneven_desc: "El Consejo gobierna adecuadamente la capital y la provincia oriental, y el resto del Reino aproximadamente. Se siguen instrucciones donde alguien está mirando.\n\nEs suficiente para mantener el país. No es suficiente para cambiarlo."
 SAU_junta_grip_slipping: "La entrada se detiene en la carretera Ring"
 SAU_junta_grip_slipping_desc: "Fuera de Riyadh las órdenes del Consejo son recibidas, presentadas y ignoradas por hombres calculando cuánto tiempo durará. Los comandantes de la guarnición han comenzado a corresponderse entre sí en lugar de con la capital.\n\nUn gobierno que no puede ser obedecido todavía no es un gobierno que ha caído, pero la distinción se está volviendo más delgada."
 SAU_regency_deadline_tt: "§YEl decreto debe renovarse, extenderse o permitirse lapso en cinco años§!"
 SAU_debug_shura_seat_jump: "§Y(DEBUG) Tecnócratas +30 escaños§!"
 SAU_debug_shura_seat_jump_desc: "Empuja al banco tecnócrata por encima del umbral de 70 escaños de la carta para que se active el evento de la carta."
 SAU_debug_corp_readout: "§Y(DEPURACIÓN) Política corporativa§!: impuestos [?SAU_corp_tax|%1] migr. [?SAU_corp_migration|%1] trabajadores [?SAU_corp_civ_workers|%1] IED [?SAU_corp_fdi_cost|%1]"
 SAU_debug_corp_readout_desc: "Lee las variables de política empresarial y laboral en las que escriben las vías Nitaqat y Kafala."
 SAU_debug_junta_control_up: "§Y(DEBUG) Junta Control +25§!"
 SAU_debug_junta_control_up_desc: "Sube el control del Consejo para probar los niveles de control."
 SAU_debug_junta_control_down: "§Y(DEBUG) Junta Control -25§!"
 SAU_debug_junta_control_down_desc: "Reduce el control del Consejo para probar las penalizaciones de las órdenes que se deslizan."
 SAU_water_national_company: "La National Water Company"
 SAU_water_national_company_desc: "La desalización, distribución y facturación se consolidan en una utilidad estatal que responde al Ministerio. Construye donde el Reino necesita agua en lugar de dónde está el margen, que es el punto y también el problema con él.\n\nEl agua llega al interior. La utilidad nunca se convertirá en un beneficio y nunca se le pidió."
 SAU_water_foreign_operators: "Operadores de Agua Extranjera"
 SAU_water_foreign_operators_desc: "Las plantas son construidas, ejecutadas y mantenidas bajo contrato por empresas que lo han hecho cien veces antes, a una norma que el Reino todavía no pudo alcanzar por sí mismo.\n\nEl agua es más limpia y barata por metro cúbico. Los contratos se denominan en dólares y la experiencia deja cuando lo hacen."
 SAU_events.223.t: "El Reino, brevemente"
 SAU_events.223.d: "Una nota corta sobre cómo se juega este Reino, de los hombres que tendrán que ejecutarlo.\n\n§HEl futuro del Reino§! - un equilibrio, no un botón. Se mueve con focos, eventos y las reformas que el Rey promulga, y decide lo receptivo que es el país para la modernización.\n§HOil Dependence§! - un número de 0 a 100 que se arrastra §Yun punto cada tres meses§! por sí mismo. Decisiones de diversificación y se centran en tirarlo hacia abajo. Es el largo argumento de toda la campaña.\n§HCorporate and Labour Policy§! - en el árbol económico. §OCantidades de Nitaqat§! (tax y alquiler de saudíes, perder el trabajo extranjero) o §YKafala liberalisation§! (trabajadores y capital extranjero, a costa de ingresos fiscales y empleos para los nacionales). Ambos alimentan la verdadera cifra de desempleo del Reino.\n§HLos Consejos§! El Majlis Ash-Shura se sienta desde el principio. §Oulema§!, §Ytecnócratas§! or §Gnotables§!; cualquier banco que conduce establece su carácter, y pasado §Y70 asientos§! El Consejo Popular llega más tarde, aprueba las facturas y puede ser vetado a un precio.\n§HLa Sucesión§! - cuando Fahd muere los príncipes comienzan a maniobrar. De vuelta uno a través de las decisiones del Príncipe Heredero; quien conduce cuando el Rey muere toma el trono, y cada uno trae sus propias directivas. §YUna directiva ocupa el tribunal a la vez.§!\n§HEl Ejército§! - los oficiales guardan su propia cuenta de lo que se les debe, déjenlo correr y actuarán en él. §RCuidado con la lectura de la queja, y establecerse antes de que sea demasiado tarde§! - el golpe puede prevenirse, pero no revertirse.\n§HLa primavera árabe§! - si la región atrapa, el descontento construye como un número. En punto de ruptura el Rey elige: montarlo y sangrar estabilidad, o §Rdeja caer la monarquía§! y entregar al país a un consejo de transición.\n§HLa República de Arabia§! - el trono no es permanente, y hay §Ytres caminos fuera de él§!Que los oficiales lleven a Riyadh y §OProclamar la República§! bajo el dominio militar; mantener intacto el trono, pero §Oponer una fiesta aparte de la Casa de Al Saud en el poder§!, que abre Declarar a la República de Arabia del Royal Hub; o dejar el §OPrimavera Árabe corre hasta su punto de ruptura§! y apártese, que lo declara por ti. §REl camino militar cierra los otros dos§! - un Reino que ya ha tenido su golpe de Estado no puede tomar el civil.\n\nTodo lo anterior es visible en las pestañas de decisión. Nada aquí tiene que ser memorizado - todo está escrito en los botones."
 SAU_events.223.a: "Entendido. Empecemos."
 SAU_tadawul_needs_market_tt: "§RRequiere que el Tadawul sea listado primero§! - completo §HTadawul, La Bolsa de Valores saudíes§! y cada enfoque en esta rama lo elevará un nivel:"
 SAU_trials_of_the_old_order_choice_tt: "§YLa elección sigue§! - 'En la corte abierta, y televisado / 'Settle it in the Ritz, como antes« / 'Pardones, a la tasa de marcha. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!"
 SAU_crackdown_on_the_opposition_choice_tt: "§YUna elección sigue§! - 'Comenzar con los comités de la Provincia Oriental' / 'Place los sermones bajo revisión' / 'Empieza con los signatarios de la petición' / 'Tome los tres archivos juntos'. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_water_pride_open_tt: "§Y Abre Aguas Soberanas§! - nueve rangos de Catastrófico a Triumphant. Rastrea §Hstability§!: un país seguro cree que los grifos correrán, uno sacudido no. Se asienta cada mes por su cuenta."
 SAU_unif_road_still_open_tt: "§YEl Consejo todavía no se ha convertido en otro lugar§! - preguntando a nuevos socios o declarando que la autonomía cierra el camino americano permanentemente."
 SAU_unif_usa_refused_tt: "§YWashington no ha tomado ya el Golfo bajo su ala §! - abierto si nunca lo preguntaste, o si los americanos §R reutilizados§!."
 SAU_unif_partners_refused_tt: "§Y Ningún socio externo ha tomado el Golfo bajo su ala §! - abierto si nunca lo preguntaste, o si ellos §R reutilizados§!."
 SAU_unif_not_yet_autonomous_tt: "§YEl Concilio no ha declarado su independencia§! - ir solo cierra este camino."
 SAU_unif_no_member_aligned_tt: "§Y Ningún miembro del Consejo ha invitado a una potencia extranjera en§! - bases turcas o indias, asesores rusos, garantías de seguridad externas, compras de armas o adquisiciones extranjeras cierran todo este camino."
 SAU_intel_surveillance_bypass_tt: "§YEvalua los propios requisitos de la agencia§! - no §HInvestigación mejorada§! y no §HDepartamento del Formo§! actualización necesaria"
 SAU_Intelligence_category_desc: "La Presidencia General de Inteligencia (GIP) es la principal agencia de inteligencia del Reino, responsable tanto de recopilación y análisis de inteligencia nacional como extranjera. Desempeña un papel crucial en la seguridad nacional, la lucha contra el terrorismo y la planificación estratégica.\n\n§GDesbloquear el GIP§! le permitirá tomar decisiones que mejoran sus capacidades de inteligencia, proporcionando valiosas ideas y ventajas en los asuntos domésticos e internacionales.\n\nA Decisiones se abrirá cuando llegue §G70%§! GIP Network Penetration en un País, y será más probable que aparezca el mayor es su penetración. No estarán disponibles si tu penetración cae por debajo del 70%."
 SAU_Foregin_affairs_category_desc: "§G Arabia Saudita Relaciones Exteriores§!\nLa política exterior del Reino está definida por un delicado acto de equilibrio diplomático. Como poder regional y custodio de los lugares más sagrados del Islam, debemos navegar por alianzas complejas, asegurar nuestros intereses económicos y mantener la estabilidad en el Medio Oriente. Si nos alineamos estrechamente con nuestros aliados occidentales tradicionales, giramos hacia los mercados emergentes del Este o nos afirmamos como un hegemon regional independiente, nuestro cuerpo diplomático allanará el camino.\n\n Para abrir más Decisión Relacionado con los Asuntos de Foregin, usted debe completar Enfoquees o obtener un Speical Evento mientras avanza hacia adelante\n\n Todo el Decisiones aparecerá de nuevo después de un año desde que lo seleccione."
 SAU_domestic_external_category_desc: "Las palancas del Reino sobre su frente natal, su petróleo y su futuro más allá de él.\n\n§HCómo aparecen estas decisiones:§!\n§GInterior§! medidas - impulsos de construcción, el fondo para el desarrollo y la reforma de la fuerza de trabajo - desbloquear con §Y«liberalización económica»§!.\n§GAceite§! mudanzas - aumento de la producción, nuevos campos, reservas reservadas, embargo de petróleo y las palancas de la OPEP - desbloquear con §Y'Saudi Aramco'§! y su doctrina de exportación.\n§GDiversificación§! proyectos - PIF inversión, giga-proyectos, renovables, la economía digital, el turismo y la industria de defensa - desbloquear al completar la §Y'Vision 2030'§! árbol.\n\n§HAlgunas decisiones piden más de ustedes:§! a §Ynuevo campo petrolífero§! necesita la estrategia de producción Aramco; §Yembargo de petróleo§! sólo puede proclamarse §Gen tiempo de paz§! mientras su economía petrolera se está ejecutando. Cada cuesta tiempo y tesorería, y la mayoría empuja su §Hdependencia del petróleo§! arriba o abajo."
 SAU_vision2030_category_desc: "Los gigaproyectos de Arabia Saudí, cada uno con su plazo. Financiarlos y terminarlos a tiempo para hacer realidad Visión 2030. Si los plazos pasan, los proyectos se vuelven costosos monumentos a la ambición y arrastran la Visión hacia el fracaso.\n\n Habrá una decisión para construir cada proyecto; cada proyecto tiene un plazo que aparece al pasar el cursor sobre él, y se actualiza semanalmente: si es 1848, la siguiente actualización del plazo de la decisión será 1841 (-7 días).\n\n Si no haces el proyecto y el plazo termina, habrá un debuff en Visión 2030; en cambio, al terminar el proyecto aumentará el buff."
 SAU_military_category_desc: "El largo programa para reconstruir las fuerzas armadas del Reino después de la conmoción de §LOperación Tormenta del Desierto§! - de un militar que necesitaba §L American§! potencia aérea, logística y comando para luchar, en una fuerza moderna y un verdadero contrapeso a §LIrán§!.\n\n§HCómo funciona:§!\nToda reforma es una §Ydecisión§! desbloqueada por un enfoque militar §Y§!. Cada uno abre una §G elección de doctrinas§! - y cada doctrina es un deliberado §Rtrade-off§!, fortaleciendo las fuerzas de una manera mientras les cuesta otra. Usted puede volver a dirigir una reforma más tarde a §Y doctrina de brujas§!.\n\n§H Las tres etapas:§!\nAvances de preparación en etapas - §RUnmodernized§! to §YIn Reform§! to §YModernizing§! to §GModernized§!. Cada Etapa revela su propio lote de reformas, y usted debe §Y completar todas ellas§! antes de que se abra la siguiente Etapa. Todo comienza ganando los §L Juegos de Guerra: Lecciones del Golfo§!.\n\nCada doctrina que eliges se alimenta del espíritu nacional §L El ejército saudí§!, donde se muestra el efecto combinado."
 SAU_crown_prince_category_desc: "[ROOT.GetSAUSuccessionPanel]"
 SAU_king_abdullah_category_desc: "Abdullah sostiene el Reino desde el primer año: regente mientras vive Fahd, rey por derecho propio desde 2005. Su muerte en enero de 2015 resuelve la carrera sucesoria, y quien de §YSalman§!, §YMohammed bin Nayef§! o §YMutaib§! haya reunido más influencia hereda tanto el trono como su propio conjunto de directrices. Usa las decisiones del §Ypríncipe heredero§! durante su reinado para decidir cuál. Cada directriz ocupa a la corte durante §Y60 días§! y no puede emitirse una segunda directriz hasta que la primera haya seguido su curso."
 SAU_king_salman_category_desc: "El reinado de Salman abre una segunda contienda, §YMohammed bin Salman§! contra §YMohammed bin Nayef§!, resuelta en junio de 2017, cuando puedes coronar al ganador de inmediato o dejarlo como príncipe heredero. Si esperas, toma el trono cuando la salud del Rey falle por fin, en 2032 como muy tarde. Síguelo en la pestaña de §Yprincipe heredero§! y sostenlo o desgástalo a tu gusto. Cada directriz ocupa a la corte durante §Y60 días§! y no puede emitirse una segunda directriz hasta que la primera haya seguido su curso."
 SAU_king_mbs_category_desc: "Se alcanza respaldando a Mohammed bin Salman en la carrera por ser príncipe heredero bajo el rey Salman, y luego declarándolo rey directamente en 2017 o esperando a que falle la salud de Salman. Cada directriz ocupa a la corte durante §Y60 días§! y no puede emitirse una segunda directriz hasta que la primera haya seguido su curso."
 SAU_king_mbn_category_desc: "Se alcanza de dos maneras: empujar a Mohammed bin Nayef por delante de Salman y Mutaib en la carrera sucesoria de la era de Abdullah, o hacerlo nombrar príncipe heredero bajo el rey Salman y que sobreviva al Rey. Cada directriz ocupa a la corte durante §Y60 días§! y no puede emitirse una segunda directriz hasta que la primera haya seguido su curso."
 SAU_king_mutaib_category_desc: "Solo se alcanza ganando por completo la carrera sucesoria de la era de Abdullah, por delante de Salman y de Mohammed bin Nayef: la vía del outsider. No hay más sucesión guionizada después de él. Cada directriz ocupa a la corte durante §Y60 días§! y no puede emitirse una segunda directriz hasta que la primera haya seguido su curso."
 SAU_faisalite_category_desc: "Faisal ibn Abdulaziz nunca fue un aislacionista. Fundó la Liga del Mundo Musulmán y, cuando Al-Aqsa ardió en 1969, reunió a los jefes de Estado musulmanes en Rabat en pocas semanas: la Organización de la Conferencia Islámica fue obra suya. Abrió el tesoro a Egipto y Jordania en Jartum tras 1967, detuvo en las montañas de Yemen al ejército expedicionario de Nasser, fundó el Banco Islámico de Desarrollo y en 1973 convirtió el propio petróleo en un arma e hizo que Occidente lo sintiera. La autosuficiencia nunca fue su destino. Era su medio: la fuerza que un Reino necesitaba antes de poder hablar por la Umma sin pedir permiso a nadie.\n\nSus herederos reciben la doctrina sin el hombre, y con ella una pregunta que él nunca tuvo que responder. El §Oaislacionismo§! toma la autosuficiencia como su propia recompensa: una frontera sellada, sin clientes, sin cruzadas, un Reino que no rinde cuentas a nadie. El §Rintervencionismo§! la toma como Faisal: un cimiento, puesto para que Riad pueda guiar a los fieles y plantarse armada entre los bloques y no tras ninguno.\n\n§HDónde se encuentra hoy el Reino§! - [ROOT.GetSAUFaisaliteLean]\n[ROOT.GetSAUFaisaliteLeanEffect]\n\n§HDirectrices en curso§!: §Y[?SAU_faisalite_active|0]§! de §Y2§!. Pueden correr dos a la vez, de cualquiera de los lados, y cada una rinde solo cuando ha seguido su curso.\n\nLos enfoques, los eventos y las decisiones de abajo mueven todos estos contadores, y nada aquí se compra barato. El que esté más alto cuando se alcen los pilares decide el último de ellos: §RLa doctrina de la Tercera Vía§! o §OEl aislamiento espléndido§!."
 SAU_junta_category_desc: "El Consejo gobierna por dos cosas y no es propio de ninguna manera. §HControl§! es lo que puede imponer - las guarnición, los puestos de control, los archivos, los hombres que responden cuando se llama. §HLa legitimidad§! es lo que se debe, y no se le debe nada: ninguna elección, ninguna fatwa, ninguna sucesión, sólo el hecho de que la armadura llegó primero.\n\nTodo lo que eleva uno es pagado por fuera del otro. La legitimación cae cada mes independientemente - una junta que simplemente gobierna tranquilamente es una junta que se queda sin tiempo.\n\n§HEn cero, el Consejo tiene noventa días para encontrar una razón para existir. Si no puede, el Reino resolverá la cuestión en el campo.§!"
 SAU_officer_crisis_category_desc: "El ejército regular llevó el costo del accidente y la Guardia Nacional no lo hizo, y el cuerpo oficial ha resuelto cuál de esos hechos es deliberado. Nada de esto tiene que terminar en tanques en la calle Olaya. Termina así sólo si nada se hace al respecto.\n\n§HEl cuerpo de oficiales§! - [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! of §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]\n\nEl dolor aumenta cada mes por sí mismo. §Y0§! y usted puede establecerse con los oficiales permanentemente; déjelo pasar §Y75§! con la orden de despliegue dada y lo resolverán ellos mismos."
 SAU_modernisation_balance_of_power_category_desc: "Dos visiones luchan por el alma del §LReino de Arabia Saudita§!. El campo §Rtradicionalista§! - el §LConsejo de Becarios mayores§!, la corte §Lroyal§!, los ancianos §Ltribales§! - protege los viejos caminos. El campo §Gliberalización§! - los tecnócratas, los ingenieros entrenados en el extranjero, la §LVisión 2030§! aboga - prensa por apertura, reforma y un lugar en la mesa del mundo moderno. El equilibrio cambia con cada enfoque completado y todas las decisiones adoptadas."
 SAU_spread_revolution_category_desc: "La República Popular de Arabia es sólo la primera chispa. La revolución debe extenderse hasta que cada obrero árabe haya tirado sus cadenas.\n\nEsta categoría se desbloquea una vez §YLa República Popular de Arabia§! es completo y un gobierno comunista reglas. §YTransmitiendo la revolución§! aumenta el apoyo comunista dentro de los países árabes, mientras §YEncontrado el Comintern Árabe§! reúne los estados de compañeros trabajadores. §YLanzamiento de la Revolución Socialista§! la decisión se mantiene §Rescondido§! en cada país árabe hasta que sus comunistas alcancen §Y30%§! soporte, así que siga transmitiendo hasta que aparezca. Una vez que lo haga, huelga: §Y50%§! o más la revolución apodera al Estado, mientras §Y30-50%§! ignifica una guerra civil revolucionaria. Los estados de los trabajadores no son derrocados, sólo bienvenidos en la §YArab Comintern§! a través de §YInvitar a la Comintern Árabe§!."
 SAU_pipeline_sabotage_category_desc: "El petróleo del Reino deja por tubería, y también el de todos los demás.\n\n§RLa lucha contra la línea de un rival eleva el precio del crudo y la temperatura de la región§! en igual medida."
 SAU_coalition_member_category_desc: "Respondimos a la invitación de Riyadh y nuestros aviones están en rotación. Lo que vale - y cuánto tiempo tenemos la intención de seguir pagando por ello - es una pregunta para nosotros solos, y la puerta fuera no está cerrada."
 SAU_debug_category_desc: "Herramientas de prueba para la sucesión, el reinado y los sistemas de salud King Salman. Esta categoría sólo existe en una construcción de depuración - es invisible en un lanzamiento normal y en multijugador."
 SAU_proxy_aggression_desc: "Estamos financiando ataques contra su gente. No lo olvidarán pronto."
 SAU_traditionalist_bop_left_side_desc: "El §LClero de Wahhabi§!, príncipes conservadores y jeques tribales. Conservan el carácter del Reino pero resisten los cambios que exige el mundo."
 SAU_liberalisation_bop_right_side_desc: "Los tecnócratas §L§!, ingenieros entrenados en el extranjero y príncipes reformistas. Abren las puertas del Reino, a costa de perturbar el orden establecido."
 SAU_modernisation_bop_centre_range_desc: "Ni la tradición ni la reforma dominan. El Reino mantiene firme - por ahora."
 SAU_traditionalist_bop_low_range_desc: "El clero y los conservadores tienen una mano superior de §Y luz§!. El Reino se mueve con cautela."
 SAU_traditionalist_bop_medium_range_desc: "La tradición es la mano §H guía§!. Las propuestas de reforma se pesan contra siglos de precedentes - y por lo general se encuentran deseando."
 SAU_traditionalist_bop_advanced_range_desc: "El §LConsejo de Becarios Superiores§! establece la agenda. Los modernizadores son §Ymarginalizados§! o §Yexilados§!. El Reino se ve interior."
 SAU_traditionalist_bop_win_range_desc: "La regla §Lulema§! en todo menos nombre. El mundo llama; el Reino no responde. La tradición tiene §Rwon§!, y el precio se paga en décadas perdidas."
 SAU_liberalisation_bop_low_range_desc: "Los reformadores tienen un §Gtoehold§!. Nuevas oficinas, nuevas escuelas, nuevas ideas a través de las grietas."
 SAU_liberalisation_bop_medium_range_desc: "El programa §LCrown Prince§! es la nueva ortodoxia. Las universidades se expanden, el turismo abre, las mujeres conducen."
 SAU_liberalisation_bop_advanced_range_desc: "La reforma se acumula en la reforma. El §Lulema§! grumble; los §Ltribes §! grumblen; pero el §Gpace§! no disminuye. El Reino está cambiando más rápido de lo que su gente puede metabolise."
 SAU_liberalisation_bop_win_range_desc: "Arabia Saudita es §Ginreconocible§! del Reino de 2000. Capital exterior, turismo extranjero, cultura extranjera. Los reformadores tienen §Gwon§! - pero las §Yclerics§! no se han olvidado."
 SAU_Monarchy_house_of_al_saud_desc: "La Casa de Al Saud es la familia dominante del Reino de Arabia Saudita. Fue fundada por Abdulaziz Ibn Saud en 1932 y desde entonces ha mantenido el control sobre el país mediante una combinación de alianzas políticas, legitimidad religiosa y poder económico derivado de la riqueza petrolera."
 SAU_Military_Rule_desc: "El Consejo Militar Supremo gobierna el Reino. El trono permanece, la respuesta de los ministerios en otro lugar, y los oficiales que tomaron Riad están descubriendo que tener un país es considerablemente más difícil que apoderarse de uno."
 SAU_gip_network: "§HRed de estaciones del GIP§!"
 SAU_gip_network_tt: "Estaciones, oficiales de cobertura y casos - la capacidad permanente de la Presidencia.\n"
 SAU_gip_slots_cap_tt: "§YLa Presidencia puede correr a la mayoría de 3 oficiales adicionales§! - las estaciones están construidas, y no hay más que abrir."
 SAU_stage1_decision_gate_tt: "§YEsta decisión aparece una vez iniciada la etapa I.§!"
 SAU_stage2_decision_gate_tt: "§YEsta decisión aparece una vez que la etapa II ha comenzado.§!"
 SAU_stage3_decision_gate_tt: "§YEsta decisión aparece una vez que la Etapa III ha comenzado.§!"
 SAU_vision2030_commitment_tt: "§REl Reino se ha comprometido ahora: entregar los proyectos, o enfrentar la reacción de las promesas rotas.§!"
 SAU_tadawul_matured_tt: "§GEl Tadawul ha llegado a su lista completa§! - el intercambio no se puede aumentar aún más, por lo que los fondos de flotación §H nuevo espacio de oficinas §! en lugar:"
 SAU_events.402.t: "El juego de la caballería"
 SAU_events.402.d: "El exceso de Teherán ha sido aceptado. Las embajadas se reabrirán, la campaña contra la República Islámica está terminada, y los clérigos que nos llamaron usurpers encontrarán sus sermones cuidadosamente editados. Las armas de Hezbollah se alejan de nosotros con su patrón. La rivalidad no se olvida - pero es, por ahora, apartado."
 SAU_events.402.a: "Una paz más fría que la amistad, y mejor que la alternativa."
 SAU_accession_to_the_sco: "Adhesión a la SCO"
 SAU_accession_to_the_sco_desc: "Riyadh se convirtió en un socio de diálogo de la Organización de Cooperación de Shanghai en 2023. La membresía completa profundizaría las relaciones con China y Rusia, pero también requeriría una cooperación más estrecha con Irán."
 SAU_the_royal_saudi_air_force: "La Real Fuerza Aérea de Arabia Saudita"
 SAU_the_royal_saudi_air_force_desc: "Desarrollar la Real Fuerza Aérea de Arabia Saudita (RSAF) en el brazo aéreo más fuerte del Golfo."
 SAU_peace_sun_f_15_eagle_program: "Peace Sun: F-15 Programa Águila"
 SAU_peace_sun_f_15_eagle_program_desc: "Inicie el programa Peace Sun con los Estados Unidos para llevar el F-15 Eagle al Reino."
 SAU_f_15c_d_eagle_squadrons: "F-15C/D Eagle Squadrons"
 SAU_f_15c_d_eagle_squadrons_desc: "Los escuadrones F-15C/D Eagle para ganar y mantener la superioridad del aire sobre los cielos saudíes."
 SAU_f_15s_eagle: "F-15S Eagle"
 SAU_f_15s_eagle_desc: "Adquirir el Águila F-15S bajo el Sol IX de Paz, capaz de luchar por los cielos y golpear profundamente."
 SAU_tornado_gr4: "Tornado GR4"
 SAU_tornado_gr4_desc: "El acuerdo de Al-Yamamah con Gran Bretaña traerá el Tornado GR4 al servicio saudí. Su capacidad de huelga viene con una larga dependencia del entrenamiento británico, partes y mantenimiento."
 SAU_panavia_tornado: "Panavia Tornado"
 SAU_panavia_tornado_desc: "Los escuadrones de Field Panavia Tornado en la huelga, el reconocimiento y las funciones de defensa aérea."
 SAU_the_european_typhoon_al_salam_deal: "El Tifón Europeo: Trato de Al Salam"
 SAU_the_european_typhoon_al_salam_deal_desc: "Firme el acuerdo de Al Salam para el Tifón, un moderno luchador multirole para el nuevo siglo."
 SAU_f_15sa_advanced_eagle: "F-15SA Advanced Eagle"
 SAU_f_15sa_advanced_eagle_desc: "El F-15SA es más que una compra. Sus demandas aviónicas, armas y mantenimiento requieren una base de apoyo saudí capaz de mantener el Águila Avanzada en el aire."
 SAU_e_3_sentry_awacs: "E-3 Sentry AWACS"
 SAU_e_3_sentry_awacs_desc: "Opera el AWACS de Sentry E-3 para ver y controlar toda la imagen del aire y dirigir a los luchadores."
 SAU_aerial_refueling_fleet: "Flota de reabastecimiento aéreo"
 SAU_aerial_refueling_fleet_desc: "Construya una flota de tanques para que los jets saudíes puedan patrullar todo el Reino y atacar a largo plazo."
 SAU_c_130_hercules_airlift: "C-130 Hercules Airlift"
 SAU_c_130_hercules_airlift_desc: "Ampliar la flota Hércules C-130 para mover tropas y suministros en cualquier lugar a velocidad."
 SAU_king_abdulaziz_air_base: "King Abdulaziz base aérea"
 SAU_king_abdulaziz_air_base_desc: "Desarrollar la Base Aérea Rey Abdulaziz en Dhahran, custodiando la Provincia Oriental y el Golfo."
 SAU_king_khalid_air_base: "Base aérea del rey Khalid"
 SAU_king_khalid_air_base_desc: "Desarrollar King Khalid Air Base en Khamis Mushait, la base sur endurecida que cubre la frontera yemení."
 SAU_prince_sultan_air_base: "Base aérea del Príncipe Sultán"
 SAU_prince_sultan_air_base_desc: "Desarrollar Prince Sultan Air Base en Al Kharj, un centro central dentro del Reino."
 SAU_precision_guided_munitions: "Municiones guiadas por precisión"
 SAU_precision_guided_munitions_desc: "Stock de bombas y misiles guiados por precisión para que una sola orden pueda destruir lo que una vez tomó muchos."
 SAU_saudi_uav_program: "Programa UAV saudí"
 SAU_saudi_uav_program_desc: "Iniciar un programa saudí de drones para la vigilancia de larga resistencia y la huelga de precisión."
 SAU_air_operations_command: "Comando de Operaciones Aéreas"
 SAU_air_operations_command_desc: "Establecer un Comando Central de Operaciones Aéreas para planificar y dirigir toda la campaña aérea como uno."
 SAU_secure_support_in_the_al_madinah_province: "Apoyo seguro en la provincia de Al-Madinah"
 SAU_secure_support_in_the_al_madinah_province_desc: "Medina contiene la mezquita del Profeta y un influyente establecimiento clerical. Garantizar el apoyo de sus eruditos ayudará a legitimar al Consejo y reducir la oposición religiosa."
 SAU_the_house_of_al_saud: "La casa de Al Saud"
 SAU_the_house_of_al_saud_desc: "Abdulaziz ibn Saud estableció un sistema de sucesión que pasó el trono entre sus hijos por la antigüedad. Después de seis reyes y setenta años, los hermanos elegibles restantes están envejeciendo y el Reino debe prepararse para la sucesión a la próxima generación."
 SAU_ground_broken_at_rabigh: "Roto de tierra en Rabigh"
 SAU_ground_broken_at_rabigh_desc: "El Reino comenzará la construcción de una ciudad económica de 68 kilómetros cuadrados en Rabigh, planeada para dos millones de residentes y un importante puerto del Mar Rojo. Es la mayor de seis ciudades económicas destinadas a atraer inversiones privadas junto con fondos estatales."
 SAU_hold_municipal_elections: "Celebración de elecciones municipales"
 SAU_hold_municipal_elections_desc: "Más de veintiuno elegirán la mitad de los escaños del consejo municipal, mientras que el gobierno nombra el resto. Los consejos tienen autoridad limitada sobre servicios como drenaje, iluminación callejera y permisos, pero el voto establece un precedente político importante."
 SAU_establish_the_peoples_council: "Establezca el Consejo Popular"
 SAU_establish_the_peoples_council_desc: "El Reino establecerá un consejo elegido con autoridad para proponer leyes sobre asuntos internos. El Rey conservará un veto absoluto, pero ejercerlo tendrá un costo político visible."
 SAU_securing_our_future: "Asegurando nuestro futuro"
 SAU_securing_our_future_desc: "El Reino reforzará el control de las publicaciones mediante la concesión de licencias, los editores aprobados y las restricciones a temas delicados. Esto debilitará la oposición organizada y fortalecerá el régimen, pero también desalentará a los graduados cualificados para que regresen e impidan que los ministerios reciban una crítica honesta."
 SAU_intervention_in_bahrain: "Intervención en Bahrein"
 SAU_intervention_in_bahrain_desc: "La Fuerza de Escudo de la Península intervino en Bahrein en marzo de 2011 a petición del Gobierno de Bahrein y ayudó a suprimir el malestar en Manama. El Reino renovará este compromiso y prepararse para defender la Cámara de Khalifa sin esperar otra cumbre del CCG"
 SAU_investigate_the_east: "Investigar el Oriente"
 SAU_investigate_the_east_desc: "Las protestas en Qatif y Awamiyah se han expandido de las demandas sobre el desempleo y los detenidos a las quejas políticas más amplias. El Ministerio del Interior investigará las actividades de oposición en la provincia oriental y actuará contra amenazas identificadas."
 SAU_women_in_the_shura_council: "Mujeres en el Consejo de Shura"
 SAU_women_in_the_shura_council_desc: "Ninguna mujer ha prestado servicios en el Consejo Consultivo, aunque la Ley Fundamental no prohíbe su nombramiento. El Rey puede nombrar a las mujeres directamente, pero debe hacerlo a pesar de la oposición esperada de eruditos conservadores."
 SAU_the_oil_defense_strategy: "Estrategia de Defensa del Petróleo"
 SAU_the_oil_defense_strategy_desc: "El Reino depende de un pequeño número de instalaciones petroleras a lo largo de la costa del Golfo. Una estrategia unificada de defensa del petróleo coordinará el presupuesto y protegerá estas instalaciones mientras que el Estado desarrolla alternativas a ellas."
 SAU_national_security_threats: "Amenazas de Seguridad Nacional"
 SAU_national_security_threats_desc: "La seguridad nacional saudí enfrenta cuatro amenazas conectadas: guerra en la frontera sur, reclutamiento yihadista, disturbios entre la población chiíta cerca de los campos petroleros, y grupos apoyados por Irán en las fronteras del Reino. Se financiará un servicio único para evaluar y coordinar la política contra los cuatro."
 SAU_the_riyadh_meeting_operation_decisive_storm: "La reunión de Riyadh: operación Tormenta decisiva"
 SAU_the_riyadh_meeting_operation_decisive_storm_desc: "Una coalición de nueve estados se reunió en Riad y comenzó la Operación Tormenta Decisiva el 26 de marzo de 2015, combinando operaciones aéreas con un bloqueo naval. Los planificadores saudíes esperaban una breve campaña, a pesar de las advertencias de los yemenitas familiarizados con el conflicto."
 SAU_the_tenth_five_year_plan: "El Décimo Plan Quinquenal"
 SAU_the_tenth_five_year_plan_desc: "El décimo plan quinquenal establece objetivos para el crecimiento no petrolero, el empleo saudí y la diversificación económica. Los planes anteriores hicieron promesas similares, pero la disminución de las reservas hace que la aplicación sea cada vez más urgente."
 SAU_defying_the_ajam: "desafiando al Ajam"
 SAU_defying_the_ajam_desc: "La ejecución de Nimr al-Nimr, la quema de la embajada saudí en Teherán, y la separación de las relaciones diplomáticas han intensificado notablemente la rivalidad con Irán. El Reino aceptará los costos económicos y diplomáticos en lugar de que parezcan producirse."
 SAU_aramco_ipo: "Aramco IPO"
 SAU_aramco_ipo_desc: "Arabia Saudita flotaba 1,5 por ciento de Aramco en el Tadawul en diciembre 2019, elevando alrededor de $25 mil millones. La venta no logró la valoración propuesta por el Príncipe Heredero de dos billones de dólares o un listado extranjero, pero siguió siendo la mayor venta de un activo estatal en la región."
 SAU_vision_2030_announced: "Vision 2030 Announced"
 SAU_vision_2030_announced_desc: "Visión 2030 fue anunciada en abril de 2016 con objetivos para un fondo soberano de dos millones de dólares, menor dependencia del petróleo, mayor empleo privado y amplia reforma social. A diferencia de los planes de diversificación anteriores, establece un plazo firme para la entrega."
 SAU_saudi_israel_normalization_track: "Rastreo de Normalización saudí-israelí-israelí"
 SAU_saudi_israel_normalization_track_desc: "Arabia Saudita no tiene ningún tratado ni relaciones de embajada con Israel, pero permite sobrevuelos israelíes y mantiene contactos discretos de inteligencia. Riyadh sigue exigiendo avances en Palestina en público, al tiempo que discute la normalización en diferentes términos en privado."
 SAU_establish_corruption_courts: "Establecer tribunales de corrupción"
 SAU_establish_corruption_courts_desc: "El Reino establecerá tribunales especializados de corrupción y una comisión permanente con jurisdicción sobre ministros y príncipes. Su credibilidad dependerá de si enjuician a los acusados mayores, así como a funcionarios ordinarios."
 SAU_the_ritz_carlton_purge: "El Ritz-Carlton Purge"
 SAU_the_ritz_carlton_purge_desc: "La campaña anticorrupción detuvo cerca de doscientos príncipes y hombres de negocios en el Ritz-Carlton y recuperó activos sustanciales. También consolidó la autoridad del Príncipe Heredero sobre la familia real."
 SAU_backdoor_deals: "Ofertas de backdoor"
 SAU_backdoor_deals_desc: "Los detenidos de Ritz-Carlton serán liberados después de haber negociado privadamente asentamientos financieros en lugar de juicios públicos. Esto recupera rápidamente los activos, pero la falta de procedimientos transparentes perjudicará la confianza en el estado de derecho."
 SAU_a_new_kingdom: "Un nuevo Reino"
 SAU_a_new_kingdom_desc: "Abdullah gobernó en nombre de Fahd durante gran parte de la década antes de la muerte de Fahd. Su adhesión deja sin cambios el orden constitucional, pero le da autoridad directa para implementar las políticas que había propuesto anteriormente."
 SAU_consolidating_the_crown: "Consolidación de la Corona"
 SAU_consolidating_the_crown_desc: "Un decreto real creará el Consejo de Allegiación, compuesto por hijos y nietos de Abdulaziz, para confirmar príncipes de corona y evaluar la aptitud del rey. Esto crea el primer procedimiento escrito de sucesión, aunque la capacidad del Consejo para limitar al Rey sigue siendo incierta."
 SAU_scholarship_programs_abroad: "Programas de Becas en el extranjero"
 SAU_scholarship_programs_abroad_desc: "El programa de becas financiará decenas de miles de saudíes y sus familias para estudiar en el extranjero. Ampliará la mano de obra calificada del Reino, exponiendo a los estudiantes a sistemas políticos y sociales que difieren de Arabia Saudita."
 SAU_expand_the_national_guard: "Ampliar el Guardia Nacional"
 SAU_expand_the_national_guard_desc: "El Guardia Nacional es reclutado de tribus históricamente leales a Abdulaziz y opera fuera del mando militar regular. La ampliación protege el trono y evita que el cuerpo de oficiales regulares controle toda la fuerza armada en el Reino."
 SAU_joining_the_wto: "Afiliación a la OMC"
 SAU_joining_the_wto_desc: "Después de doce años de negociaciones, el Reino se sumará a la OMC mediante aranceles vinculantes, apertura de sectores de servicios, admisión de bancos extranjeros e aseguradores y revisión del derecho comercial. La membresía limita cierta autonomía comercial pero da a Arabia Saudita voz en el sistema que rige sus exportaciones de petróleo."
 SAU_al_saud_national_dialogue: "Diálogo nacional"
 SAU_al_saud_national_dialogue_desc: "El Diálogo Nacional reúne a clérigos chiítas, académicos salafis, mujeres y hombres para discutir cuestiones nacionales e informar sus conclusiones al Rey. No tiene autoridad legislativa, pero permite un debate público inusualmente amplio."
 SAU_counter_terrorism_cooperation: "Cooperación en la lucha contra el terrorismo"
 SAU_counter_terrorism_cooperation_desc: "Los bombardeos compuestos de 2003 mostraron que al-Qaeda estaba apuntando al estado saudí y a los estadounidenses en el Reino. Arabia Saudita responderá con redadas, listas de vigilancia, investigaciones financieras y programas de rehabilitación de luchadores en estrecha cooperación con la inteligencia estadounidense."
 SAU_the_atlantic_realignment: "El Reino Atlántico"
 SAU_the_atlantic_realignment_desc: "El Consejo buscará el reconocimiento y el apoyo de Washington haciendo hincapié en que las exportaciones sauditas de petróleo continuarán bajo el nuevo gobierno. Esto probará si los Estados Unidos valoran su relación con el estado saudí más que la monarquía desechada."
 SAU_foreign_water_operators: "Operadores de Agua Extranjera"
 SAU_foreign_water_operators_desc: "El programa de desalinización se somete a licitación internacional. Las plantas suben más rápido que cualquier cosa que el Reino haya construido solo, y los hombres que las dirigen responden a una oficina principal en el extranjero.\n\n§GLos Operadores de Aguas Extranjeras§! y §Y encierran la crisis del agua por un paso§!, a costa de §R influencia americana en el Reino§!.\n\nEficiente, y una mano permanente en el grifo."
 SAU_among_the_major_powers: "Entre las principales potencias"
 SAU_among_the_major_powers_desc: "El petróleo hace que el Reino sea indispensable, pero la indispensabilidad no es lo mismo que la seguridad. Alcanzar más allá de la región a los poderes que conforman el orden mundial y decidir cuál de ellos Riad se apoyará."
 SAU_anti_iranian_propaganda: "Propaganda anti-Iraniana"
 SAU_anti_iranian_propaganda_desc: "El Reino utilizará sus redes de medios para criticar a la República Islámica y construir apoyo suní contra la influencia iraní."
 SAU_appoint_loyalists_in_the_provinces: "Design Loyalists in the Provinces"
 SAU_appoint_loyalists_in_the_provinces_desc: "El nuevo gobierno sustituirá a los gobernadores provinciales reales por leales oficiales de servicio. Esto elimina una importante fuente de poder principado y coloca a las provincias bajo control militar."
 SAU_unity_freedom_socialism: "Unidad, libertad, socialismo"
 SAU_unity_freedom_socialism_desc: "Las tres palabras del Ba'ath se convierten en la ley de la tierra: la unidad de la nación árabe, la liberación del colonizador y el socialismo para el pueblo."
 SAU_cells_across_the_arab_world: "Células de todo el mundo árabe"
 SAU_cells_across_the_arab_world_desc: "El partido establecerá células baathistas en las capitales árabes para organizar y apoyar futuras revoluciones."
 SAU_the_sword_of_unity: "La Espada de la Unidad"
 SAU_the_sword_of_unity_desc: "Los estados árabes que rechazan la unión voluntaria serán introducidos en el nuevo orden por la fuerza."
 SAU_purge_the_reactionaries: "Purge los Reaccionarios"
 SAU_purge_the_reactionaries_desc: "El gobierno revolucionario eliminará a los monarquistas, islamistas y agentes extranjeros que amenazan el gobierno baathista."
 SAU_the_united_arab_republic: "La República Árabe Siria"
 SAU_the_united_arab_republic_desc: "Las tierras árabes estarán unidas en un solo estado revolucionario llamado República Árabe Siria."
 SAU_one_arab_nation: "Una nación árabe"
 SAU_one_arab_nation_desc: "Borrar las fronteras dibujadas por Sykes y Picot y enseñar a una generación que no hay más que una nación árabe con un mensaje eterno."
 SAU_the_vanguard_of_the_arabs: "La vanguardia de los árabes"
 SAU_the_vanguard_of_the_arabs_desc: "Arabia reclamará el liderazgo del mundo árabe desde el Atlántico al Golfo y dirigirá el movimiento nacionalista más amplio."
 SAU_expel_the_imperialists: "Expelen a los imperialistas"
 SAU_expel_the_imperialists_desc: "Conducir las últimas bases y asesores extranjeros de suelo árabe y romper los tratados desiguales de la era colonial."
 SAU_industrialize_the_nation: "Industrializar la Nación"
 SAU_industrialize_the_nation_desc: "Un plan industrial nacional construirá molinos de acero, represas y fábricas para que la república pueda producir sus propios bienes y armas esenciales."
 SAU_the_revolutionary_command_council: "El Consejo del Mando Revolucionario"
 SAU_the_revolutionary_command_council_desc: "Vest suprema autoridad en un consejo de los líderes del partido, fusible partido y estado en una sola voluntad revolucionaria."
 SAU_pan_arab_solidarity: "Solidaridad panárabe"
 SAU_pan_arab_solidarity_desc: "Manténganse con todas las luchas árabes de Palestina al Magreb, y hagan de Arabia el patrono de la causa nacionalista."
 SAU_build_the_party: "Construir el Partido"
 SAU_build_the_party_desc: "La revolución organizará un partido disciplinado con células que se extienden de aldeas a la dirección nacional."
 SAU_arab_republic_secular_republic: "Una República secular"
 SAU_arab_republic_secular_republic_desc: "Mezquita separada del estado y une a la nación por identidad árabe en lugar de secta, para que Sunni y Shia, musulmán y cristiano sean uno."
 SAU_the_arab_socialist_path: "El Sendero Socialista Árabe"
 SAU_the_arab_socialist_path_desc: "Rechazar el capitalismo y el comunismo soviético para un socialismo claramente árabe: las alturas dominantes en las manos del pueblo, el pequeño comerciante dejó libre."
 SAU_nationalize_the_heights: "Nacionalizar las alturas"
 SAU_nationalize_the_heights_desc: "Aprovechar el petróleo, los bancos y las grandes empresas de los concesionarios extranjeros y las viejas familias, y entregar su riqueza a la nación."
 SAU_land_to_the_peasants: "Tierra a los campesinos"
 SAU_land_to_the_peasants_desc: "Romper las grandes fincas y dar el suelo al hombre que lo trabaja, terminando con el agarre feudal en el campo."
 SAU_the_officer_corps: "El Cuerpo de Oficiales"
 SAU_the_officer_corps_desc: "El partido reclutará a oficiales jóvenes y utilizará las fuerzas armadas para enseñar y hacer cumplir la doctrina baathista."
 SAU_arm_the_vanguard: "El brazo de Vanguard"
 SAU_arm_the_vanguard_desc: "Se establecerá una milicia partidaria políticamente fiable junto con el ejército regular."
 SAU_forge_the_national_army: "Forja el Ejército Nacional"
 SAU_forge_the_national_army_desc: "Construir un ejército mecanizado moderno digno de la nación árabe y capaz de llevar la revolución más allá de nuestras fronteras."
 SAU_saudi_aramco: "Saudi Aramco"
 SAU_saudi_aramco_desc: "La §YSaudi Arabian Oil Company§! es la empresa petrolera más grande de la Tierra y la columna vertebral del Reino. Esta rama construye el campo sector petrolífero por campo y luego compromete Aramco a una doctrina estratégica §Y §! - §Ypump more, refine más, o exporta para ingresos máximos§! - todos alimentando el espíritu nacional único §YSaudi Aramco§!."
 SAU_arm_the_anti_iranian_groups: "Armar a los grupos anti-Iranianos"
 SAU_arm_the_anti_iranian_groups_desc: "El Reino armará grupos antigubernamentales entre los Baluchos de Irán y las minorías árabes, extendiendo el conflicto al territorio iraní."
 SAU_the_saudi_armed_forces: "Las Fuerzas Armadas de Arabia Saudita"
 SAU_the_saudi_armed_forces_desc: "Unificar y modernizar las fuerzas terrestres, marítimas y aéreas del Reino en un solo ejército profesional."
 SAU_lessons_of_the_gulf_war: "Lecciones de la Guerra del Golfo"
 SAU_lessons_of_the_gulf_war_desc: "En 1990 el Iraq de Saddam incautó a Kuwait y masacrado en nuestra frontera; sólo una coalición extranjera salvó al Reino, y la Batalla de Khafji fue combatida en suelo saudí. Operación Tormenta del Desierto puso de manifiesto lo dependientes que somos de otros - nunca más."
 SAU_ministry_of_defence_and_aviation: "Ministerio de defensa y aviación"
 SAU_ministry_of_defence_and_aviation_desc: "Reorganizar al Ministerio de Defensa y Aviación (MODA) en un mando moderno que puede planificar, presupuestar y dirigir todas las fuerzas armadas."
 SAU_the_general_staff: "El personal general"
 SAU_the_general_staff_desc: "Construya un personal general profesional para escribir planes de guerra, ejecutar ejercicios y operaciones de mando."
 SAU_the_royal_saudi_land_forces: "Las fuerzas de tierra sauditas reales"
 SAU_the_royal_saudi_land_forces_desc: "Construya las Reales Fuerzas de Tierras sauditas (RSLF) en un ejército moderno y móvil con sede en Riad."
 SAU_saudi_arabian_national_guard: "Arabia Saudita Guardia Nacional"
 SAU_saudi_arabian_national_guard_desc: "Ampliar el Arabia Saudita Guardia Nacional (SANG), la fuerza tribal leal al trono que protege a la familia real y las ciudades santas."
 SAU_king_abdulaziz_royal_guard: "Rey Abdulaziz Royal Guard"
 SAU_king_abdulaziz_royal_guard_desc: "Fortalecer el Regimiento de la Guardia Real, la unidad de élite juró proteger a la persona del Rey."
 SAU_m1a2_abrams_main_battle_tank: "M1A2 Abrams tanque de combate principal"
 SAU_m1a2_abrams_main_battle_tank_desc: "Adquirir el American M1A2 Abrams, el tanque más pesado y capaz de la región y la columna vertebral de la armadura saudita."
 SAU_armored_brigades: "Blindaje Brigadas"
 SAU_armored_brigades_desc: "Levantar y equipar a grandes brigadas blindadas para una guerra decisiva de maniobra en el desierto abierto."
 SAU_mechanized_infantry: "Infantería mecanizada"
 SAU_mechanized_infantry_desc: "Forma infantería mecanizada para mantener el suelo y apoyar a las cabezas de lanza blindadas."
 SAU_m109_self_propelled_artillery: "M109 Self-Propelled Artillery"
 SAU_m109_self_propelled_artillery_desc: "Campo el M109 autopropulsado auitzer para dar a las divisiones soporte de fuego móvil y protegido."
 SAU_astros_ii_rocket_artillery: "Artillería de cohetes ASTROS II"
 SAU_astros_ii_rocket_artillery_desc: "Adquirir el sistema de cohetes ASTROS II brasileño para bombardeos masivos y a largo plazo."
 SAU_royal_saudi_strategic_missile_force: "Fuerza de Misiles Estratégicos Real Saudí"
 SAU_royal_saudi_strategic_missile_force_desc: "Establecer la Fuerza Estratégica de Misiles como rama separada, disuasión estratégica del Reino."
 SAU_df_3_ballistic_missiles: "DF-3 Ballistic Missiles"
 SAU_df_3_ballistic_missiles_desc: "La compra secreta de misiles chinos DF-3 en 1988 dio a Riad un alcance estratégico que ninguna capital vecina podía ignorar. Construye la fuerza que mantenga creíble esa disuasión."
 SAU_army_aviation_and_apache_gunships: "Aviación del Ejército y Armaduras de Apache"
 SAU_army_aviation_and_apache_gunships_desc: "Prepara un Comando de Aviación del Ejército y adquiere el AH-64 Apache, un asesino de tanques para el propio brazo aéreo del ejército."
 SAU_special_forces_command: "Comando de las Fuerzas Especiales"
 SAU_special_forces_command_desc: "Forjar un Mando de Fuerzas Especiales para incursiones, antiterrorismo y reconocimiento tras las líneas enemigas."
 SAU_roll_back_iran_in_the_gulf: "Retrocedan Irán en el Golfo"
 SAU_roll_back_iran_in_the_gulf_desc: "Irán utiliza redes políticas y de milicias para ampliar su influencia en Bahrein, Iraq y otros lugares del Golfo. El Reino apoyará a los gobiernos y facciones locales que pueden reducir esa influencia."
 SAU_the_basra_grid_connection: "La conexión Basora Grid"
 SAU_the_basra_grid_connection_desc: "El sur de Irak se escalinata a través de los apagón mientras importa el poder iraní. Wire Basra en la red del Golfo y reemplazar la electricidad iraní por la corriente saudí."
 SAU_counter_iranian_influence: "Lucha contra la influencia iraní"
 SAU_counter_iranian_influence_desc: "Las milicias y el dinero de Irán han inundado el vacío dejado por Saddam. Empezar la larga campaña para arrancar a Iraq del control de la República Islámica."
 SAU_buy_the_iraqi_parliament: "Comprar el Parlamento iraquí"
 SAU_buy_the_iraqi_parliament_desc: "El Reino utilizará el patrocinio financiero para obtener apoyo de los bloques parlamentarios y ministros iraquíes. El objetivo es alejar a Bagdad de Teherán y de Riad."
 SAU_chinese_mediation: "Chinese Mediation"
 SAU_chinese_mediation_desc: "China es un cliente importante de Arabia Saudita e Irán y se ha ofrecido a mediar entre ellos. Aceptar su papel podría estabilizar las relaciones sin resolver la rivalidad estratégica más amplia."
 SAU_the_agrarian_revolution: "La Revolución Agraria"
 SAU_the_agrarian_revolution_desc: "La transformación del campo está completa, su superávit alimentando las ciudades y la revolución."
 SAU_collectivization: "Collectivization"
 SAU_collectivization_desc: "Las granjas privadas se fusionan en grandes colectivos trabajados en común y respondiendo al plan."
 SAU_dictatorship_of_the_proletariat: "Dictadura del proletariado"
 SAU_dictatorship_of_the_proletariat_desc: "El poder se concentra en la clase obrera a través de un único partido revolucionario que no impulsa oposición."
 SAU_ignite_the_gulf: "Ignite el Golfo"
 SAU_ignite_the_gulf_desc: "El estado obrero proporcionará agentes y armas a los movimientos revolucionarios en las monarquías del Golfo."
 SAU_land_to_the_fellahin: "Tierra a los Fellahin"
 SAU_land_to_the_fellahin_desc: "Las grandes fincas están rotas y entregadas a los campesinos que las labran."
 SAU_embrace_moscow: "Embrace Moscow"
 SAU_embrace_moscow_desc: "Arabia se alineará con el bloque soviético e intercambiará petróleo por armas y apoyo político."
 SAU_nationalize_the_oil_fields: "Nacionalizar los campos petrolíferos"
 SAU_nationalize_the_oil_fields_desc: "La riqueza bajo las arenas pertenece al pueblo, no a los príncipes. ARAMCO es incautado y colocado bajo control de los trabajadores."
 SAU_the_new_arab_man: "El nuevo hombre árabe"
 SAU_the_new_arab_man_desc: "Se cultiva una nueva cultura revolucionaria, barriendo las supersticiones y jerarquías del viejo orden."
 SAU_the_non_aligned_road: "El Camino de los Países No Alineados"
 SAU_the_non_aligned_road_desc: "Arabia traza un curso independiente, liderando a las naciones no alineadas contra el imperialismo y la dominación soviética por igual."
 SAU_soviets_of_the_oil_workers: "Soviets de los trabajadores petroleros"
 SAU_soviets_of_the_oil_workers_desc: "Los consejos obreros elegidos gobernarán los campos petroleros y constituirán una institución central del Estado proletario."
 SAU_toward_pan_arab_union: "Hacia la Unión Panárabe"
 SAU_toward_pan_arab_union_desc: "La revolución llega hacia el exterior, buscando la unión con los otros estados árabes progresistas."
 SAU_the_peoples_republic_of_arabia: "La República Popular de Arabia"
 SAU_the_peoples_republic_of_arabia_desc: "El orden provisional da paso a un estado obrero plenamente constituido: la República Popular de Arabia."
 SAU_progressive_islam: "Islam progresivo"
 SAU_progressive_islam_desc: "En lugar de aplastar la fe, el partido enlista clérigos progresistas para predicar un socialismo compatible con el Islam."
 SAU_a_proletarian_nation: "Una Nación Proletaria"
 SAU_a_proletarian_nation_desc: "Arabia definirá la identidad nacional a través de los trabajadores y el trabajo en lugar de filiación tribal o lealtad a la monarquía."
 SAU_form_the_red_guard: "Formar la Guardia Roja"
 SAU_regularize_the_red_guard: "Regularizar la Guardia Roja"
 SAU_regularize_the_red_guard_desc: "Forja a las milicias revolucionarias en un ejército rojo profesional, con equipo estandarizado, oficiales capacitados y una industria de guerra para armarlos."
 SAU_the_peoples_militia: "La Milicia Popular"
 SAU_the_peoples_militia_desc: "Mantenga la revolución en manos del pueblo, armando a todos los obreros y campesinos como milicianos listos para defender la república."
 SAU_form_the_red_guard_desc: "Una milicia revolucionaria de los trabajadores petroleros y los pobres urbanos juró defender la revolución."
 SAU_rural_literacy_brigades: "Brigadas de alfabetización rural"
 SAU_rural_literacy_brigades_desc: "Los cuadros admiran por todo el campo para enseñar lectura, escritura y doctrina revolucionaria."
 SAU_state_atheism: "Estado Ateísmo"
 SAU_state_atheism_desc: "La religión es declarada el opio de las masas. El clero está despojado del poder y las mezquitas caen en silencio."
 SAU_state_industrialization: "Industrialización del Estado"
 SAU_state_industrialization_desc: "El gobierno utilizará programas estatales acelerados para construir molinos de acero, represas y fábricas en toda Arabia."
 SAU_vanguard_of_the_region: "Vanguardia de la Región"
 SAU_vanguard_of_the_region_desc: "Arabia se establece como la vanguardia de la revolución en todo el mundo árabe y el Golfo."
 SAU_womens_emancipation: "Women's Emancipation"
 SAU_womens_emancipation_desc: "Las mujeres entrarán en la fuerza laboral y el partido como iguales legales y políticos, poniendo fin a las restricciones del viejo orden sobre su participación."
 SAU_a_strategic_partnership_with_china: "Una alianza estratégica con China"
 SAU_a_strategic_partnership_with_china_desc: "Elige a Beijing en Washington como el principal socio de gran potencia del Reino. Capital chino y armas chinas vienen sin sermones, pero también sin la vieja garantía americana."
 SAU_conscript_the_kingdom: "Conscripta el reino"
 SAU_conscript_the_kingdom_desc: "El Reino ha dependido tradicionalmente de voluntarios de tribus de confianza en lugar de conscripción. El Consejo aceptará los riesgos políticos de un ejército de masas para aumentar la mano de obra disponible."
 SAU_oil_for_security: "Petróleo para Seguridad"
 SAU_oil_for_security_desc: "El trato es tan viejo como el encuentro a bordo del USS Quincy: La cruda saudí mantiene la economía americana girando, y las armas estadounidenses mantienen al Reino seguro. Profundice la asociación petrodollar que subscribe el reino."
 SAU_cooperation_with_the_east: "Cooperación con el Oriente"
 SAU_cooperation_with_the_east_desc: "El centro de gravedad de la economía mundial se dirige hacia Asia, y Asia tiene sed de petróleo. Abra el Reino a los poderes crecientes del Este y cuide contra un Occidente poco confiable."
 SAU_cooperation_with_the_west: "Cooperación con Occidente"
 SAU_cooperation_with_the_west_desc: "Washington y sus aliados han garantizado la seguridad del Golfo desde los días del rey Abdulaziz. Ancla el Reino firmemente en el campamento occidental y comercializa el petróleo del mundo para la protección del mundo."
 SAU_engage_the_new_baghdad: "Participación en la Nueva Bagdad"
 SAU_engage_the_new_baghdad_desc: "Un nuevo gobierno se encuentra en Bagdad, dirigido por Shia y juzgado por Teherán. Trague viejas enemistades y dibuje el nuevo Iraq hacia el pliegue árabe."
 SAU_counter_the_baathist_remnant: "Contra el remanente baathista"
 SAU_counter_the_baathist_remnant_desc: "Ya sea que Saddam cayó o simplemente faltó, el Baath sigue siendo una fuerza en las sombras de Iraq. Negar a los diehards del viejo régimen cualquier camino de regreso al poder."
 SAU_declare_the_republic_of_arabia: "Declarar la República de Arabia"
 SAU_declare_the_republic_of_arabia_desc: "La monarquía ha caído y el consejo provisional tiene poder en nombre del pueblo. Ahora el viejo reino se disuelve para el bien y se proclama un nuevo estado: la República de Arabia, construida sobre la voluntad de sus ciudadanos en lugar del linaje de una dinastía."
 SAU_the_defense_industries_act: "Las industrias de defensa actúan"
 SAU_the_defense_industries_act_desc: "La Arabia Saudita ha dependido desde hace mucho tiempo de las armas importadas y los repuestos extranjeros. La Ley sobre las industrias de defensa exigirá la producción nacional cuando sea posible y con licencia cuando sea necesario, a pesar de los costos más altos y una menor eficiencia a corto plazo."
 SAU_disband_the_national_guard: "Disolver el Guardia Nacional"
 SAU_disband_the_national_guard_desc: "El Guardia Nacional fue creado de tribus leales para proteger el trono contra el ejército regular. El Consejo disolverá sus regimientos y ofrecerá su personal en las fuerzas armadas regulares, eliminando la base militar independiente de la monarquía."
 SAU_the_economy_under_military_order: "La economía bajo orden militar"
 SAU_the_economy_under_military_order_desc: "Los oficiales tomarán el control de Aramco, SABIC, los puertos y contratistas principales. Las operaciones petrolíferas pueden continuar bajo sus ingenieros existentes, pero es probable que la administración militar reduzca la eficiencia en otras partes de la economía."
 SAU_emergency_tribunal: "Tribunal de Emergencia"
 SAU_emergency_tribunal_desc: "Los tribunales convocados bajo la autoridad militar, sin apelación, juzgando los delitos que los tribunales ordinarios nunca fueron sometidos a jurisdicción. El ulema es consultado sobre la forma de las actuaciones y no sobre los veredictos."
 SAU_energy_subsidies_for_jordan: "Subvenciones de energía para Jordania"
 SAU_energy_subsidies_for_jordan_desc: "Jordania no tiene aceite propio y siente cada pico en el mercado. Ata el reino a la generosidad saudí con combustible barato y crudo de descuento."
 SAU_aid_sudan: "Sudán"
 SAU_aid_sudan_desc: "Khartoum necesita financiación que Teherán no haya proporcionado. La ayuda saudí puede comprar un descanso con Irán, pero también vincula a Riyadh con un gobierno ya aislado por las sanciones occidentales."
 SAU_side_with_algeria: "Lado con Argelia"
 SAU_side_with_algeria_desc: "Riyadh no puede cortejar a Argel y Rabat con igual calidez mientras su rivalidad divide al Magreb. Argelia ofrece una experiencia difícil contra las insurgencias islamistas, pero elegirlo significa relaciones de enfriamiento con una monarquía en Marruecos."
 SAU_back_the_brotherhood: "Retrocedan la Hermandad"
 SAU_back_the_brotherhood_desc: "Egipto es tanto el lugar de nacimiento de la Hermandad como el centro del mundo árabe. Respaldar el movimiento daría a Riyadh una red islamista popular en el extranjero, pero arriesgar la fricción con gobiernos que temen a la Hermandad en la urna electoral."
 SAU_back_the_strongman: "Atrás el Strongman"
 SAU_back_the_strongman_desc: "Los generales de Egipto prometen orden, hostilidad a la Hermandad y un estado lo suficientemente fuerte como para mantener el centro del mundo árabe. El dinero saudí puede mantener esa orden de pie y El Cairo alineado con Riyadh."
 SAU_befriend_the_turks: "Sé amigo de los turcos"
 SAU_befriend_the_turks_desc: "[befriend_the_turks_description]"
 SAU_contain_the_turks: "Contener a los turcos"
 SAU_contain_the_turks_desc: "No podemos permitir que Turquía siga sus intereses en el Oriente Medio. [TUR.GetLeader] El apoyo del islam político corre el riesgo de fortalecer un movimiento populista peligroso, que puede tratar de derrocar a nuestro gobierno."
 SAU_influence_muslim_europe: "Influencia de la Europa musulmana"
 SAU_influence_muslim_europe_desc: "Los Balcanes tienen comunidades musulmanas con pocas razones para mirar a Riad. Becas, mezquitas y redes caritativas pueden convertir una fe compartida en influencia saudí duradera en Europa."
 SAU_influence_north_africa: "Influencia en África septentrional"
 SAU_influence_north_africa_desc: "El Magreb mira hacia el norte a Europa y al sur a África más a menudo que al este a Riyadh. El dinero y la diplomacia sauditas pueden cambiar eso, pero cada movimiento entra en la rivalidad entre Argelia y Marruecos."
 SAU_side_with_morocco: "Lado con Marruecos"
 SAU_side_with_morocco_desc: "Marruecos comparte el interés del Reino en preservar la regla monárquica y limitar la influencia argelina. Siding con Rabat fortalece un socio natural, pero cierra puertas en Argel."
 SAU_sanction_sudan: "Sanction Sudan"
 SAU_sanction_sudan_desc: "[SUD.GetLeader] El liderazgo ha estado plagado de polémica internacional. Bajo su gobierno, se ha acusado al Sudán de ser patrocinador estatal del terror y un importante abusador de los derechos humanos. Las naciones occidentales han sancionado posteriormente este estado pícaro, un ejemplo que debemos seguir."
 SAU_sanction_turkey: "Sanction Turkey"
 SAU_sanction_turkey_desc: "A pesar de nuestras advertencias, Turquía ha seguido sumándose en el mundo árabe. No tenemos más remedio que usar medidas coercitivas para disuadir a Turquía de promover sus ambiciones imperialistas."
 SAU_security_guarantees: "Garantías de seguridad"
 SAU_security_guarantees_desc: "Las estrechas relaciones con Ankara valen poco si desaparecen en una crisis. Una garantía mutua vincularía la seguridad turca y saudita y advertiría a cualquier enemigo que atacara uno de los medios para enfrentar ambos."
 SAU_turkish_bases: "Bases turcas"
 SAU_turkish_bases_desc: "La concesión del acceso militar de Turquía daría a Ankara una razón directa para proteger al Reino. También daría a un poder regional rival una posición en suelo saudí."
 SAU_libyan_arms_shipments: "Armas libias Envíos"
 SAU_libyan_arms_shipments_desc: "El estado fracturado de Libia se ha convertido en una subasta para armas y dinero extranjeros. Con los poderes occidentales retrocediendo, los envíos saudíes pueden comprar una facción amistosa y un lugar en la lucha por su petróleo y puertos."
 SAU_the_faisalite_resurgence: "Resurgencia Faisalita"
 SAU_the_faisalite_resurgence_desc: "El programa Faisalite regresa después de una generación de negligencia. Pide austeridad, autosuficiencia y un Reino que represente a la Ummah en lugar de depender de Washington."
 SAU_centralization_of_the_provincial_emirates: "Centralización de los Emiratos Provinciales"
 SAU_centralization_of_the_provincial_emirates_desc: "Los emires provinciales han dirigido sus regiones como fincas privadas desde la fundación. Riyadh recuerda sus cartas y cuestiones nuevas - más cortas, revocables, y firmadas por el Rey."
 SAU_the_sovereign_civil_service: "La Soberana Administración Pública"
 SAU_the_sovereign_civil_service_desc: "La administración pública utilizará exámenes para nombramientos y registros de servicios para ascensos. Esto reducirá la influencia de las conexiones familiares sobre el empleo gubernamental."
 SAU_reorganization_of_the_majlis_ash_shura: "Reorganización del Majlis ash-Shura"
 SAU_reorganization_of_the_majlis_ash_shura_desc: "Miteb ampliará y reorganizará el Majlis ash-Shura y le dará acceso a asuntos gubernamentales sustantivos. Permanecerá subordinado al Rey, pero ganará un papel consultivo y administrativo más claro."
 SAU_the_national_cadre_initiative: "La iniciativa de los cuadros nacionales"
 SAU_the_national_cadre_initiative_desc: "El Reino capacitará a los ciudadanos saudíes para reemplazar a trabajadores extranjeros en ocupaciones de importancia estratégica. La eficiencia a corto plazo puede disminuir mientras la fuerza laboral nacional gana experiencia."
 SAU_the_fortress_kingdom: "El Reino de la Fortaleza"
 SAU_the_fortress_kingdom_desc: "El gobierno de Faisalite ha consolidado sus instituciones, removido a sus oponentes y reducido la influencia extranjera. El Reino debe decidir ahora si esta autonomía apoyará el aislamiento o una política independiente más activa."
 SAU_the_spirit_of_73: "El Espíritu del '73"
 SAU_the_spirit_of_73_desc: "El embargo petrolífero de 1973 demostró que la política de producción saudita podría influir en los gobiernos occidentales. El Reino considerará la posibilidad de utilizar esa ventaja para obtener nuevas concesiones políticas."
 SAU_the_international_forums_question: "Cuestión de los Foros Internacionales"
 SAU_the_international_forums_question_desc: "El Reino debe decidir si persigue sus intereses a través de instituciones como las Naciones Unidas y el FMI o retirarse de un sistema en el que tenga poco papel en la redacción de las normas."
 SAU_the_superpower_engagement_question: "La cuestión de la superpotencia"
 SAU_the_superpower_engagement_question_desc: "Ambos bloques de superpotencia buscan alineación saudí. Riyadh puede permanecer independiente mientras compra de ambos, o reducir su dependencia mediante el desarrollo de la producción de armas domésticas."
 SAU_eradicate_foreign_dependency: "Erradicar la dependencia extranjera"
 SAU_eradicate_foreign_dependency_desc: "El Reino tratará la dependencia de las importaciones esenciales como una vulnerabilidad estratégica. Por lo tanto, la sustitución nacional tendrá prioridad incluso cuando las mercancías importadas sean más baratas."
 SAU_the_foreign_wealth_question: "La cuestión de la riqueza extranjera"
 SAU_the_foreign_wealth_question_desc: "Arabia Saudita tiene cientos de miles de millones de dólares en bancos occidentales y valores del gobierno. Repatriar esta riqueza reduciría la influencia extranjera, pero dejarla en el extranjero sigue siendo más segura y rentable."
 SAU_increase_the_ulemas_authority: "Aumentar la Autoridad de Ulema"
 SAU_increase_the_ulemas_authority_desc: "Los eruditos son restaurados a los consejos de los que fueron calmados. Faisal gobernó con el ulema en su hombro, y sus herederos no pretenderán otra cosa."
 SAU_the_domestic_supply_quota: "El Código de Suministros Interiores"
 SAU_the_domestic_supply_quota_desc: "Cada ministerio, contratista y refinería será necesario para comprar una parte mínima de los bienes hechos por la Arabia Saudita. Los productos nacionales pueden costar inicialmente más y empeorar, pero las cuotas fomentarán la capacidad nacional."
 SAU_the_sovereign_aid_question: "La cuestión de la ayuda soberana"
 SAU_the_sovereign_aid_question_desc: "La ayuda saudita puede distribuirse como apoyo incondicional a las comunidades musulmanas o utilizarse para obtener concesiones políticas. El Reino debe decidir si la solidaridad religiosa o la influencia estratégica regirán su asistencia."
 SAU_islamic_solidarity_conference: "Conferencia Islámica de Solidaridad"
 SAU_islamic_solidarity_conference_desc: "Riyadh convocará una Conferencia de Solidaridad Islámica y financiará los procedimientos. La reunión reactivará el enfoque de Faisal de utilizar instituciones patrocinadas por Arabia Saudita para coordinar el mundo musulmán."
 SAU_the_expatriate_workforce_question: "Cuestión de la fuerza de trabajo expatriados"
 SAU_the_expatriate_workforce_question_desc: "Nueve millones de trabajadores extranjeros apoyan la economía saudita pero están en conflicto con el objetivo fascista de autosuficiencia nacional. Reducir su papel será económicamente costoso, mientras que retenerlos limitará la Saudization."
 SAU_reclaim_the_oic_leadership: "Reclamar el liderazgo de la OCI"
 SAU_reclaim_the_oic_leadership_desc: "La Organización de Cooperación Islámica tiene su sede en Jeddah. Riyadh utilizará su financiación y posición en el país anfitrión para dirigir la agenda de la organización más activamente."
 SAU_the_global_ummah_question: "La cuestión global de Ummah"
 SAU_the_global_ummah_question_desc: "El control del Reino de las Dos Mezquitas Santas le da una reivindicación única al liderazgo entre los musulmanes del mundo. Debe decidir si convertir ese estatus en una responsabilidad activa hacia la Ummah global."
 SAU_splendid_isolation: "Espléndido aislamiento"
 SAU_splendid_isolation_desc: "El Reino se retirará de bloques, relaciones con los clientes y campañas extranjeras. Se concentrará en defender sus fronteras, preservar la fe y gestionar sus recursos petroleros."
 SAU_the_virtue_committees_return: "Los Comités Virtud devuelven"
 SAU_the_virtue_committees_return_desc: "El Comité para la Promoción de la Virtud y la Prevención de la Vicenciana toma las calles que perdió. Sus patrullas son visibles de nuevo, y también el mensaje que llevan."
 SAU_the_third_way_doctrine: "La Doctrina de la Tercera Vía"
 SAU_the_third_way_doctrine_desc: "El Reino rechazará la alineación con Washington y Moscú y organizará un bloque independiente de estados musulmanes encabezados por Riad. Este bloque se basará en su propia producción de armas y responderá sólo a la Ummah."
 SAU_ban_foreign_media: "Prohibir los medios extranjeros"
 SAU_ban_foreign_media_desc: "Los platos de satélite bajan, las mesas cierran, y las noticias del Reino están escritas en el Reino. Lo que el mundo dice sobre Arabia Saudita ya no es un asunto doméstico."
 SAU_the_closed_frontier: "La frontera cerrada"
 SAU_the_closed_frontier_desc: "Visas tensa, contratos lapso y los barrios expatriados comienzan a vaciarse. El Reino decide que sería más pobre y propio."
 SAU_purge_the_westernized_elite: "Purge la élite occidentalizada"
 SAU_purge_the_westernized_elite_desc: "Los ministerios comienzan a llenar con hombres educados en Riyadh en lugar de en Boston. Aquellos que llegaron a casa con títulos extranjeros y hábitos extranjeros encuentran sus archivos revisados y sus oficinas reasignados."
 SAU_the_foreign_bases_question: "La cuestión de las bases extranjeras"
 SAU_the_foreign_bases_question_desc: "El acceso militar extranjero ofrece al Reino protección exterior, pero enoja a los clérigos que consideran a las tropas extranjeras en Arabia como un insulto. Riyadh debe decidir si esa protección vale la pena para su soberanía y legitimidad religiosa."
 SAU_sever_the_western_pact: "Sever el Pacto Occidental"
 SAU_sever_the_western_pact_desc: "El Reino cerrará las bases extranjeras y exigirá que sus guarniciones se vayan. Esto restablece el control saudí sobre su territorio, pero termina una importante garantía de seguridad externa."
 SAU_the_base_retention_edict: "El Edicto de Retención Base"
 SAU_the_base_retention_edict_desc: "Las bases extranjeras y sus acuerdos de suministro seguirán siendo. El gobierno defenderá esta decisión al ulema como una necesidad de seguridad a pesar de sus objeciones religiosas."
 SAU_fight_iran_indirectly: "Luchar contra Irán de manera indirecta"
 SAU_fight_iran_indirectly_desc: "La batalla abierta con la República Islámica arruinaría ambos lados. En cambio, sangró a Teherán a través de sus proxies y sus provincias inquietos, nunca cruzaron la línea hacia una guerra abierta."
 SAU_modon_industrial_cities: "MODON ciudades industriales"
 SAU_modon_industrial_cities_desc: "Yanbu, Ras al-Khair y Jubail tienen espacio para más que terminales de petróleo. MODON los llenará con obras de cemento, fundiciones de aluminio y fertilizantes, reemplazando las importaciones por mercancías hechas en casa."
 SAU_the_return_of_national_capital: "El retorno del capital nacional"
 SAU_the_return_of_national_capital_desc: "Las fortunas sauditas se sientan en propiedad extranjera, bancos y valores mientras los proyectos en casa esperan dinero. El Ministerio de Comercio dará a ese capital una razón para regresar y trabajar dentro del Reino."
 SAU_jeddah_islamic_port_expansion: "Jeddah expansión del puerto islámico"
 SAU_jeddah_islamic_port_expansion_desc: "Jeddah es la puerta del Reino al Mar Rojo. Las nuevas terminales de carga y los enlaces ferroviarios se desplazarán más hacia el interior del transporte y mantendrán el puerto por delante del creciente comercio."
 SAU_the_supreme_economic_council: "El Consejo Económico Supremo"
 SAU_the_supreme_economic_council_desc: "Cuatro ministerios reclaman un pedazo de política económica, y ninguna respuesta a los demás. Un Consejo Económico Supremo les da un cuadro, una agenda y una autoridad para resolver controversias."
 SAU_sabics_global_expansion: "Expansión Global de SABIC"
 SAU_sabics_global_expansion_desc: "SABIC ha superado el mercado nacional. Las adquisiciones como GE Plastics darán a la empresa nuevos materiales, patentes y clientes más allá del Golfo."
 SAU_the_jubail_ii_expansion: "La expansión Jubail II"
 SAU_the_jubail_ii_expansion_desc: "Jubail II crecerá alrededor de más que petroquímicos. Ampliar el complejo de acero Hadeed dará a la construcción saudí una fuente interna de rebar y acero plano."
 SAU_the_saudi_export_program: "El Programa de Exportación saudita"
 SAU_the_saudi_export_program_desc: "Las fábricas sauditas no pueden crecer solo en el mercado interno. El programa de exportación llevará plásticos, combustibles refinados y cemento a mercados asiáticos, africanos y latinoamericanos que han conocido al Reino principalmente por petróleo crudo."
 SAU_sabic_agri_nutrients: "SABIC Agri-Nutrients"
 SAU_king_abdullah_financial_district: "Distrito financiero King Abdullah"
 SAU_king_abdullah_financial_district_desc: "King Abdullah Financial District dará a los bancos, fondos de inversión y socios multinacionales una dirección en Riyadh. Los acuerdos firmados en sus torres pueden traer capital extranjero y experiencia a la industria saudita."
 SAU_sabic_agri_nutrients_desc: "SABIC ya convierte el gas saudí en productos químicos. Ampliar la producción de amoníaco y urea hará que el Reino sea un gran proveedor de fertilizantes y granjas de alimentación mucho más allá de Arabia."
 SAU_economic_diversification: "Diversificación económica"
 SAU_economic_diversification_desc: "El petróleo seguirá siendo el negocio más grande del Reino, pero no necesita ser cada negocio. El capital se moverá en la fabricación, los servicios y la logística para que una caída de precios brutos ya no llegue a cada nómina saudita."
 SAU_non_oil_exports: "Exportaciones no petroleras"
 SAU_non_oil_exports_desc: "Un petrolero no debe ser la única exportación saudí que alguien reconoce. Los plásticos, químicos, cemento y maquinaria pueden ganar su propio lugar en el libro mayor del comercio y hacer que los ingresos extranjeros dependan menos de la cruda."
 SAU_economic_liberalization: "Liberalización económica"
 SAU_economic_liberalization_desc: "Una firma privada no debe necesitar un príncipe, una subvención y un año de firmas para abrir sus puertas. Cortar el laberinto de licencias y dejar que las empresas compitan para los clientes en lugar de favores."
 SAU_sabic_technology_and_innovation: "SABIC Technology & Innovación"
 SAU_sabic_technology_and_innovation_desc: "La materia prima barata por sí sola no mantendrá SABIC competitivo para siempre. La investigación en catalizadores, polímeros y métodos de producción puede poner patentes saudíes al lado de las plantas sauditas."
 SAU_the_2000s_oil_boom: "El Boom de Aceite 2000"
 SAU_the_2000s_oil_boom_desc: "El precio del petróleo está subiendo, llenando el tesoro y levantando el Tadawul con él. El boom puede financiar la nueva industria, si el Reino invierte antes de que el ciclo vuelva a girar."
 SAU_the_national_industrial_strategy: "Estrategia Nacional Industrial"
 SAU_the_national_industrial_strategy_desc: "Una estrategia industrial de diez años vinculará a ministerios y empresas con objetivos compartidos para el acero, la maquinaria, el empleo saudí y el crecimiento de las exportaciones. Finalmente, los progresos pueden medirse con más del tamaño del presupuesto."
 SAU_the_mining_sector: "El sector minero"
 SAU_the_mining_sector_desc: "Ma'aden, fundada en 1997, hace la minería §YTercer pilar§! de la economía junto al petróleo y los petroquímicos - fosfato en Al-Jalamid, oro en Mahd adh-Dhahab, y bauxita y aluminio atado para Ras al-Khair."
 SAU_the_tourism_sector: "El sector turístico"
 SAU_the_tourism_sector_desc: "El §YSupreme Commission for Tourism§!, creado en 2000, convierte la herencia del reino, su costa del Mar Rojo y - sobre todo - el §Yperegrinación a Meca y Medina§! en una industria permanente y de todo el año."
 SAU_the_construction_boom: "El Boom de la Construcción"
 SAU_the_construction_boom_desc: "La inversión en hidrocarburos financiará una extensa construcción en Riyadh, Jeddah y Dammam, incluyendo torres, centros comerciales, carreteras y otras infraestructuras urbanas."
 SAU_the_digital_economy: "La Economía Digital"
 SAU_the_digital_economy_desc: "El §YCommunications and IT Commission§! (2001) termina el monopolio de las telecomunicaciones y conecta el reino - redes móviles, banda ancha y los primeros servicios del gobierno electrónico llegan a cada provincia."
 SAU_the_eighth_development_plan: "El Octavo Plan de Desarrollo"
 SAU_the_eighth_development_plan_desc: "Cinco años de gasto necesitan más que una lista de ministerios. El Octavo Plan de Desarrollo coordinará los proyectos económicos y sociales del gobierno hasta 2009."
 SAU_the_industrial_path: "El Sendero Industrial"
 SAU_the_industrial_path_desc: "El acero, la fundición y la fabricación pusieron fábricas ante las oficinas. El camino industrial crea capacidad industrial en el hogar, pero exige más capital, mano de obra y maquinaria importada."
 SAU_the_services_path: "El Camino de los Servicios"
 SAU_the_services_path_desc: "Banca, logística, finanzas y turismo pueden emplear graduados saudíes sin esperar nuevos molinos de acero. Una economía dirigida por servicios requiere menos inversión en industrias pesadas y deja más de las necesidades físicas del Reino para importar."
 SAU_the_balanced_path: "El camino equilibrado"
 SAU_the_balanced_path_desc: "La industria y los servicios avanzarán juntos, difundiendo la inversión en ambos. El compromiso evita la dependencia de un sector. Ninguno de los dos tiene toda la capital que quiere."
 SAU_the_ninth_development_plan: "El Noveno Plan de Desarrollo"
 SAU_the_ninth_development_plan_desc: "La economía saudita de 2015 no parece la de 1995. La fabricación por sí sola supera lo que las exportaciones de petróleo valían hace una década."
 SAU_the_saudi_landbridge: "El puente de tierra saudí"
 SAU_the_saudi_landbridge_desc: "El puente terrestre saudí conectará el puerto islámico de Jeddah en el Mar Rojo con Riyadh y Dammam en el Golfo por ferrocarril. El peso cruzará la península sin navegar por Arabia."
 SAU_stc_privatization: "Privación STC"
 SAU_stc_privatization_desc: "STC ya no puede expandirse al ritmo de un ministerio. La privatización pondrá nuevo capital detrás de las redes de fibra y móviles, pero el control público sobre la compañía nacional se debilitará."
 SAU_the_saudi_electricity_company: "La compañía de electricidad saudita"
 SAU_the_saudi_electricity_company_desc: "Las fábricas y las ciudades están creciendo más rápido que la red eléctrica. La Compañía de Electricidad saudita atará nuevas turbinas de gas a la transmisión costa-coasta y evitará que los apagón establezcan el techo en desarrollo."
 SAU_urban_development: "Desarrollo urbano"
 SAU_urban_development_desc: "Riyadh, Jeddah y Dammam están creciendo más rápido que sus carreteras, utilidades y vivienda. La planificación urbana debe ponerse al día antes de que la congestión se convierta en el próximo cuello de botella del Reino."
 SAU_the_real_estate_development_fund: "El Fondo de Desarrollo Inmobiliario"
 SAU_the_real_estate_development_fund_desc: "Un hogar en las principales ciudades se mueve más allá del alcance de las familias sauditas comunes. El Fondo de Desarrollo Inmobiliario financiará nuevos barrios y reducirá la lista de espera de viviendas."
 SAU_the_north_south_railway: "El ferrocarril Norte-Sur"
 SAU_the_north_south_railway_desc: "El ferrocarril Norte-Sur llevará fosfato y bauxita de las minas del norte al golfo mientras une pueblos del interior dependen desde hace mucho tiempo de carreteras. Rail reducirá el costo de mover carga a través del Reino."
 SAU_king_abdullah_economic_city: "King Abdullah económica ciudad"
 SAU_king_abdullah_economic_city_desc: "Las ciudades planificadas en Rabigh, Madinah y Jazan están destinadas a escapar del papeleo que frena el resto de la economía. Sus reglas simplificadas probarán si una nueva ciudad puede superar la vieja burocracia."
 SAU_the_labour_law_of_2005: "Ley del trabajo de 2005"
 SAU_the_labour_law_of_2005_desc: "El trabajo expatriados construyó el Reino moderno, pero el sistema de patrocinio deja a los trabajadores vinculados a empleadores y saudíes excluidos de las nóminas privadas. La ley de 2005 aflojará partes de kafala y presionará a las empresas para que contraten ciudadanos."
 SAU_tatweer_education_reform: "Reforma educativa de Tatweer"
 SAU_tatweer_education_reform_desc: "El aprendizaje radical no puede proporcionar a los ingenieros y administradores las necesidades de la nueva economía. Tatweer revisará el plan de estudios, reducirá las horas de enseñanza religiosa y traerá inglés a las aulas del cuarto grado."
 SAU_king_fahd_medical_city: "Ciudad médica del rey Fahd"
 SAU_king_fahd_medical_city_desc: "La atención especializada se concentra en unos pocos hospitales y algunas ciudades. King Fahd Medical City y nuevas instalaciones provinciales traerán ese estándar al alcance de los saudíes que no pueden viajar a Riyadh para el tratamiento."
 SAU_kaust: "KAUST"
 SAU_kaust_desc: "Una universidad gana una reputación a través del trabajo realizado dentro de ella, no el nombre por encima de su puerta. Los mayores presupuestos de investigación en KAUST, KFUPM y KAU darán a los estudiosos saudíes los laboratorios y subvenciones para competir en el extranjero."
 SAU_k_a_care_renewable_energy: "K.A.CARE energía renovable"
 SAU_k_a_care_renewable_energy_desc: "El Reino quema aceite valioso para hacer electricidad a pesar de la luz solar más fuerte del mundo. K.A.CARE probará otro futuro en Sakaka y Dumat al-Jandal, emparejando energía solar con viento del norte."
 SAU_royal_decree_m_30_capital_market_law: "Real Decreto M/30, Ley del Mercado de Capitales"
 SAU_royal_decree_m_30_capital_market_law_desc: "El Real Decreto M/30, emitido por el Rey Fahd el 31 de julio de 2003, promulgó la Ley del Mercado de Capitales. Establece un marco jurídico moderno para la regulación del mercado de capital Tadawul y saudí."
 SAU_the_2007_legal_reforms: "Las reformas jurídicas de 2007"
 SAU_the_2007_legal_reforms_desc: "Las reformas legales del Reino de 2007 codifican la incorporación formal y establecen reglas claras para crear entidades jurídicas reconocidas. Las empresas ahora pueden operar bajo un marco corporativo más predecible."
 SAU_the_qualified_foreign_investor_program: "El Programa de Inversionistas Extranjeros Calificados"
 SAU_the_qualified_foreign_investor_program_desc: "El §Y15 de junio de 2015§!, la §YCapital Market Authority§! abre el §YTadawul§! para dirigir la inversión institucional extranjera por primera vez. Los fondos con al menos §Y$5 millardos§! en activos bajo administración pueden comprar acciones saudíes sin intermediarios locales, comenzando el camino hacia §Y Mercados Emergentes de MSCI §! inclusión."
 SAU_msci_emerging_markets_inclusion: "MSCI Mercados emergentes Inclusión"
 SAU_msci_emerging_markets_inclusion_desc: "In §YJunio 2018§!, §YMSCI§! anuncia la actualización de Arabia Saudita desde Standalone hasta el estado de Mercados Emergentes. §YMayo 2019§! y termina con la segunda fase en §YAgosto 2019§!. La inclusión completa da la §YTadawul§! aproximadamente §G2.83%§! del índice y se espera que traiga §G$14 a 16 mil millones§! en inversión pasiva."
 SAU_the_kafalah_sme_program: "El programa Kafalah SME"
 SAU_the_kafalah_sme_program_desc: "El programa Kafalah proporcionará préstamos favorables, procedimientos más sencillos y capacitación para ayudar a los empresarios saudíes a establecer pequeñas y medianas empresas."
 SAU_the_aramco_ipo: "La IPO Aramco"
 SAU_the_aramco_ipo_desc: "On §Y11 diciembre 2019§!, §YSaudi Aramco§! listas en las §YTadawul§!, levantamiento §G$ 25,6 mil millones§! inicialmente y §G$ 29.4 mil millones§! después de la opción Greenshoe. Se convierte en el §GIPO más grande en la historia§!, superando §YLista de Alibaba 2014§!, y restos enumerados en §YRiyadh§! en lugar de §YNueva York§! or §YLondres§!."
 SAU_the_saudi_financial_and_banking_laws: "De las leyes financieras y bancarias sauditas"
 SAU_the_saudi_financial_and_banking_laws_desc: "La Ley de control bancario de 1966 y las leyes del mercado de capitales y el seguro cooperativo promulgadas en 2003 constituyen el principal marco jurídico para la financiación saudita. Juntos establecen obligaciones y sanciones claras para los bancos, aseguradoras y participantes en el mercado."
 SAU_the_capital_market_authority: "La Autoridad del Mercado de Capitales"
 SAU_the_capital_market_authority_desc: "Una bolsa de valores no puede la propia policía mientras que las fortunas de los hogares saudíes cuelgan sus precios. La Autoridad del Mercado de Capital establecerá reglas de inclusión, investigará los abusos y hará que Tadawul responda a un regulador."
 SAU_edaa_the_securities_depository: "Edaa: El depositario de valores"
 SAU_edaa_the_securities_depository_desc: "§YEdaa§!, el Centro Depósito de Valores, establecerá los comercios de Tadawul y mantendrá registros electrónicos de propiedad. Esta infraestructura moderna mejorará la fiabilidad del mercado para inversores nacionales y extranjeros."
 SAU_the_saudi_logistics_hub: "El Centro de Logística de Arabia Saudita"
 SAU_the_saudi_logistics_hub_desc: "El Reino utilizará Jeddah, Dammam y Riyadh para desarrollar un centro logístico que vincule las rutas comerciales a través de Asia, África y Europa."
 SAU_establish_joint_stock_conglomerates_jsc: "Establecer conglomerados mixtos (JSC)"
 SAU_establish_joint_stock_conglomerates_jsc_desc: "La conversión de las principales entidades estatales en empresas mixtas públicas permitirá a los ciudadanos e inversores institucionales proporcionar capital para la expansión industrial. Esto reduce la dependencia de nuevos proyectos sobre financiación directa del tesorería."
 SAU_the_saudi_sukuk_programme: "El Programa saudita de Sukuk"
 SAU_the_saudi_sukuk_programme_desc: "De §Y2017§!, el §YMinisterio de Finanzas§! lanza un programa soberano sostenido sukuk – §G $9 mil millones§! en la emisión internacional debut. Los bonos compatibles con la ley se convierten en un vehículo primario para la financiación del gobierno saudí y la recaudación de capitales corporativos. El Reino y §YMalasia§! dividen el mercado mundial de bonos islámicos entre ellos."
 SAU_limited_liability_company_llc: "Sociedad de Responsabilidad Limitada (LLC)"
 SAU_limited_liability_company_llc_desc: "La Ley de Sociedades 2015, vigente en 2016, establece una estructura jurídica moderna para empresas de responsabilidad limitada junto con sociedades anónimas. El capital protegido y la condición jurídica reconocida ayudarán a las empresas nacionales a crear cadenas de suministro y establecer asociaciones con las empresas internacionales."
 SAU_the_gulfs_economic_engine: "El motor económico del Golfo"
 SAU_the_gulfs_economic_engine_desc: "La economía más fuerte del Reino atraerá trabajadores regionales, profesionales financieros y capital a Riyadh en lugar de perderlos a los mercados vecinos."
 SAU_one_stop_shop: "One-Stop Shop"
 SAU_one_stop_shop_desc: "Las empresas extranjeras pasaron §Yaños§! tratando con varios ministerios para registrar un negocio. SAGIA's §YOne-Stop Shop§! combina esos pasos de licencia en un §Gsingle counter§!, reduciendo los retrasos y oportunidades para §Ycorrupción§!."
 SAU_open_strategic_sectors: "Sectores estratégicos abiertos"
 SAU_open_strategic_sectors_desc: "§YLas telecomunicaciones§!, §Yseguro§! y §Y mining §! se abrirán al capital extranjero. Los nuevos competidores traerán §Ytecnología§! y §Yexpertise§! mientras que obligan a las empresas respaldadas por el Estado a modernizarse."
 SAU_foreign_investment_law_of_2000: "Ley de inversiones extranjeras de 2000"
 SAU_foreign_investment_law_of_2000_desc: "§YAbril 2000§! La Ley de Inversión Extranjera permite a los extranjeros poseer §G100%§! de las empresas sauditas en la mayoría de los sectores. La eliminación de las restricciones anteriores de propiedad tiene por objeto atraer sustancialmente más capital internacional."
 SAU_economic_cities_drive: "Las ciudades económicas conducen"
 SAU_economic_cities_drive_desc: "Se planean seis nuevas ciudades económicas, incluyendo §YKing Abdullah Economic City§! en el Mar Rojo, §YReconocimiento de la Ciudad Económica§! en Madinah, y §YPrince Abdulaziz bin Mousaed City§! en Hail. Cada uno será un centro §Y construido para fines§! para la industria, los servicios y el comercio fuera de las principales áreas productoras de petróleo."
 SAU_international_partnerships: "Alianzas internacionales"
 SAU_international_partnerships_desc: "Empresas conjuntas con §YGeneral Electric§!, §YDow Chemical§!, §YSumitomo§! y §YMitsubishi§! traerá §Ytecnología§! y §Y experiencia manual§! al Reino. Los ingenieros saudíes trabajarán con estos socios y desarrollarán las habilidades necesarias para gestionar futuros proyectos a nivel nacional."
 SAU_tax_incentive_package: "Paquete de incentivos fiscales"
 SAU_tax_incentive_package_desc: "La tasa tributaria corporativa para inversores extranjeros caerá de §Y45%§! a §G20%§!, mientras que el ingreso personal permanece §G obligado§!. SAGIA promoverá estos términos a nivel internacional para atraer capital extranjero."
 SAU_saudi_arabia_open_for_business: "Arabia Saudita, Abierto para Negocios"
 SAU_saudi_arabia_open_for_business_desc: "Las licencias pasan ahora a través de una oficina en lugar de muchas, las empresas extranjeras pueden poseer lo que construyen, y nuevas ciudades económicas compiten por su capital. Arabia Saudita ya no pide a los inversores que pasen por alto la burocracia; está abierta para los negocios."
 SAU_ras_tanura_and_abqaiq: "Ras Tanura & Abqaiq"
 SAU_complete_nationalization: "Nacionalización completa"
 SAU_complete_nationalization_desc: "Entre §Y1973 y 1980§! el Reino compra a los socios americanos de la Compañía Arábica Americana del Petróleo. ARAMCO se convierte totalmente en propiedad saudí - §YSaudi Aramco§!."
 SAU_the_master_gas_system: "El sistema de gas maestro"
 SAU_the_master_gas_system_desc: "Lanzado en §Y1975§!, el Sistema de Gas Maestro captura el gas una vez §Y inflado§! en los pozos, alimentando energía barata y materia prima a las nuevas industrias del Reino."
 SAU_saudi_petroleum_engineers: "Ingenieros sauditas de Petróleo"
 SAU_saudi_petroleum_engineers_desc: "§YKFUPM§! en Dhahran entrena una generación de ingenieros y geólogos sauditas de petróleo. La fuerza laboral de Aramco se convierte en la más §YSaudizada§! en el Reino."
 SAU_the_ghawar_field: "El Campo de Ghawar"
 SAU_the_ghawar_field_desc: "§YGhawar§! - el mayor campo de petróleo convencional jamás descubierto, que se extiende 280 km debajo de la provincia oriental. Por décadas solo produce más de la mitad de la cruda del Reino."
 SAU_ras_tanura_and_abqaiq_desc: "§YRas Tanura§!, el puerto petrolero más grande del mundo, y el complejo de estabilización §YAbqaiq§! reúnen, procesan y exportan gran parte de la producción cruda de Aramco. Ampliar y proteger estas instalaciones es esencial para el sector petrolero del Reino."
 SAU_downstream_integration: "Integración de aguas abajo"
 SAU_downstream_integration_desc: "Deja de vender crudo crudo. Refinerías y complejos petroquímicos en §YJubail, Yanbu y Rabigh§! convierten cada barril en combustibles y plásticos de mayor valor §Y en casa§! - y alimenta SABIC."
 SAU_petrorabigh_and_satorp: "PetroRabigh & SATORP"
 SAU_petrorabigh_and_satorp_desc: "§YPetroRabigh§! (con el Sumitomo de Japón, 2005) y §YSATORP§! en Jubail (con el Total de Francia) son empresas conjuntas a escala mundial que rompen el crudo saudí en combustibles y productos químicos. El Reino deja de exportar barriles crudos y comienza a exportar §Yproductos§!."
 SAU_doctrine_maximize_production: "Doctrina: Maximizar la producción"
 SAU_doctrine_maximize_production_desc: "Aumente la capacidad sostenible de Aramco hacia §Y12 millones de barriles al día§!. Abrir nuevos campos a través de la Provincia Oriental y el Barrio Vacío.\n\n§GAceite de cosechas§! en todo el Reino y aumenta el combustible - la base de una §Y economía de guerra§!.\n§YMutualmente exclusiva con las otras dos doctrinas.§!"
 SAU_doctrine_export_powerhouse: "Doctrina: Export Powerhouse"
 SAU_doctrine_export_powerhouse_desc: "La cruzada fluye hacia el este y oeste por el supertanker. Como productor de la OPEP §Y§!, el Reino convierte su petróleo en la corriente de ingresos más fiable del mundo §Ypetrodollar§!.\n\n§G Resource export income§! and recurring treasury - the foundation of a §Ymoney economy§!.\n§YMutually exclusiva con las otras dos doctrinas.§!"
 SAU_new_mega_fields: "Nuevos megafondos"
 SAU_new_mega_fields_desc: "§YShaybah§! (1998) profunda en el barrio vacío, §YKhurais§! (2009) y offshore §YManifa§! (2013) - una nueva generación de campos gigantes empuja la capacidad de Aramco cada vez más alta. §GMás flujos de petróleo.§!"
 SAU_opec_swing_producer: "Productor oscilante de la OPEP"
 SAU_opec_swing_producer_desc: "La capacidad de producción libre del Reino le permite actuar como productor §Y de la OPEP§! e influir en los precios mundiales del petróleo. Esto desbloquea las decisiones §YOPEC Oil Lever§! para aumentar los precios de los ingresos o reducirlos a la presión de los competidores."
 SAU_the_council_of_economic_and_development_affairs: "El Consejo de Asuntos Económicos &"
 SAU_the_council_of_economic_and_development_affairs_desc: "Creado en 2015, el §YConsejo de Asuntos Económicos y de Desarrollo§! coordina ministerios y supervisa la implementación del programa de reforma económica del gobierno."
 SAU_the_worlds_most_valuable_company: "La compañía más valiosa del mundo"
 SAU_the_worlds_most_valuable_company_desc: "Saudi Aramco se ha convertido en el §Ycompañía más valiosa en la Tierra§! y sigue siendo central para el sector petrolero del Reino y las finanzas públicas.\n§YRequiere un PIB nacional sobre $1.800 millones.§!"
 SAU_the_national_transformation_program: "El Programa Nacional de Transformación"
 SAU_the_national_transformation_program_desc: "Visión 2030 necesita plazos que sobrevivan a la ceremonia de anuncio. El Programa Nacional de Transformación §Y§! dará a cada ministerio un objetivo, un presupuesto y una medida pública de si se entrega."
 SAU_nazaha_the_anti_corruption_authority: "Nazaha: Autoridad Anticorrupción"
 SAU_nazaha_the_anti_corruption_authority_desc: "§YNazaha§!, Comisión Nacional Anticorrupción, se estableció en 2011 para investigar la corrupción financiera y administrativa en todos los organismos públicos. Su mandato fortalece la supervisión de los organismos y funcionarios gubernamentales."
 SAU_the_judicial_reform_of_2007: "Reforma Judicial de 2007"
 SAU_the_judicial_reform_of_2007_desc: "La reforma judicial del Rey Abdullah §Y2007§! codificará los procedimientos judiciales, creará un Tribunal Supremo y tribunales especializados, y dará a las empresas un sistema legal más predecible."
 SAU_tayseer_regulatory_reform: "Tayseer: Reforma Regulatoria"
 SAU_tayseer_regulatory_reform_desc: "El Centro Nacional de Competitividad (§YTayseer§!) reducirá las licencias, aprobaciones y otros requisitos administrativos que retrasan la inversión."
 SAU_the_ministry_of_investment_misa: "Ministerio de Inversiones (MISA)"
 SAU_the_ministry_of_investment_misa_desc: "SAGIA se convertirá en el §YMinisterio de Inversión§! en 2020, centralizando los servicios gubernamentales y la política para inversores extranjeros."
 SAU_expec_research_centre: "Centro de investigación EXPEC"
 SAU_expec_research_centre_desc: "El §YExploration and Petroleum Engineering Center§! desarrollará la tecnología nacional de manipulación y perforación de embalses. Esto le da a Aramco capacidades técnicas avanzadas y mejora su comprensión de la geología saudí."
 SAU_strong_saudi_banks: "Bancos saudíes fuertes"
 SAU_strong_saudi_banks_desc: "Al Rajhi, NCB, Riyad Bank y Samba se expandirán hasta que los bancos saudíes estén entre los cien más grandes del mundo."
 SAU_insurance_for_all: "Seguros para Todos"
 SAU_insurance_for_all_desc: "El Reino ampliará el seguro de salud, automóvil y propiedad después de décadas de desarrollo limitado del mercado."
 SAU_grow_the_capital_markets: "Crece los mercados de capital"
 SAU_grow_the_capital_markets_desc: "Más IPOs, mayor liquidez y acceso extranjero QFI desarrollarán el Tadawul en un intercambio más grande y más maduro."
 SAU_a_saudi_bond_market: "Un mercado saudí de bonos"
 SAU_a_saudi_bond_market_desc: "El Reino desarrollará mercados para sukuk soberano, sukuk corporativo y bonos convencionales que puedan atraer inversores de Londres a Tokio."
 SAU_the_sakani_housing_program: "El Programa de Vivienda Sakani"
 SAU_the_sakani_housing_program_desc: "El programa §YSakani§! pone la propiedad en el hogar al alcance de los saudíes comunes - tierra, finanzas y unidades listas entregadas a escala."
 SAU_the_national_housing_company: "La National Housing Company"
 SAU_the_national_housing_company_desc: "§YLa Compañía Nacional de Vivienda§! utilizará la construcción estandarizada y los desarrollos planificados por maestros para ampliar la vivienda en las principales ciudades."
 SAU_the_saudi_cement_industry: "La industria de los cementos saudíes"
 SAU_the_saudi_cement_industry_desc: "Saudi Cement, Yamama y otros productores nacionales suministrarán el programa de construcción y reducirán las importaciones de cemento."
 SAU_glass_and_building_materials: "Vidrio & Materiales de construcción"
 SAU_glass_and_building_materials_desc: "El Reino producirá vidrio flotante, cerámica y acero estructural internamente para abastecer su sector de la construcción."
 SAU_vision_2030: "Vision 2030"
 SAU_vision_2030_desc: "§YVision 2030§! es el plan del Príncipe Heredero para reducir la dependencia del petróleo a través del turismo, la industria, el entretenimiento y los principales proyectos de desarrollo. Su plazo público 2030 hace que el gobierno rinda cuentas directamente por la realización de estas reformas."
 SAU_qiddiya_and_the_line: "Qiddiya & La Línea"
 SAU_qiddiya_and_the_line_desc: "§YQiddiya§! y §YLa Línea§! introducirá los conceptos de entretenimiento y desarrollo urbano que preceden al grupo más grande del Reino de giga-proyectos."
 SAU_the_red_sea_project: "El proyecto del Mar Rojo"
 SAU_the_red_sea_project_desc: "El §YProyecto Mar Rojo§! desarrollará el turismo de lujo a lo largo de la costa y abrirá determinadas islas saudíes a visitantes internacionales."
 SAU_king_salman_international_airport: "King Salman Aeropuerto Internacional"
 SAU_king_fahd_international_airport: "King Fahd Aeropuerto Internacional"
 SAU_king_fahd_international_airport_desc: "El vasto King Fahd International Airport de Dammam tiene espacio para convertirse en más que un soporte de registro. Ampliar sus pistas y su capacidad de aeródromo en una puerta este para pasajeros y cargas sauditas."
 SAU_king_salman_international_airport_desc: "El nuevo §YKing Salman International Airport§! en Riyadh será diseñado para 100 millones de pasajeros al año y apoyará los objetivos turísticos y logísticos del Reino."
 SAU_king_abdullah_port: "Puerto King Abdullah"
 SAU_king_abdullah_port_desc: "§YKing Abdullah Port§!, el primer puerto totalmente privado de la región, se expandirá en un importante contenedor hub."
 SAU_the_digital_government_authority: "La autoridad del gobierno digital"
 SAU_the_digital_government_authority_desc: "La Autoridad del Gobierno Digital §Y§! colocará los servicios públicos en una plataforma en línea común y reducirá la administración basada en papel."
 SAU_the_e_commerce_boom: "E-Commerce Boom"
 SAU_the_e_commerce_boom_desc: "El crecimiento de Salla, Noon y otras start-ups moverán más actividad minorista saudí en línea y expandirán el sector del comercio electrónico."
 SAU_fintech_saudi: "Fintech Saudi"
 SAU_fintech_saudi_desc: "STC Pay, Tamara y un marco de banca abierta permitirán §YFintech Saudi§! desarrollar Riyadh como centro financiero-tecnológico regional."
 SAU_kacst_science_and_technology: "KACST: Ciencia & Tecnología"
 SAU_kacst_science_and_technology_desc: "El §YKing Abdulaziz City for Science and Technology§! ancla la base de investigación del Reino, desde materiales avanzados hasta el espacio."
 SAU_the_human_capability_program: "El Programa de Capacidad Humana"
 SAU_the_human_capability_program_desc: "Las nuevas industrias necesitan a los saudíes entrenados para dirigirlas. El Programa §Y Desarrollo de la Capacidad Humana§! vinculará las aulas, las escuelas profesionales y la formación profesional con los empleos que el Reino está tratando de crear."
 SAU_the_national_technology_development_program: "Programa Nacional de Desarrollo Tecnológico"
 SAU_the_national_technology_development_program_desc: "El Programa Nacional de Desarrollo Tecnológico financia las start-ups y la tecnología profunda que el Reino necesitará cuando los ingresos del petróleo disminuyen."
 SAU_the_saudi_space_commission: "La Comisión Espacial de la Arabia Saudita"
 SAU_the_saudi_space_commission_desc: "Creada en 2018, la Comisión Espacial §YSaudi§! desarrollará misiones de astronauta, capacidad de lanzamiento y participación saudita en el sector espacial internacional."
 SAU_saudi_satellites_and_arabsat: "Satélites sauditas & Arabsat"
 SAU_saudi_satellites_and_arabsat_desc: "El programa SaudiSat y la participación del Reino en §YArabsat§! expandirán las capacidades saudíes de comunicación y observación en órbita."
 SAU_sami_saudi_arabian_military_industries: "SAMI: Industrias militares sauditas"
 SAU_sami_saudi_arabian_military_industries_desc: "§YSaudi Arabian Military Industries§! se fundó en 2017 para localizar la defensa -la mitad del presupuesto de armas, gastado en casa, para 2030."
 SAU_gami_localise_the_arms_industry: "GAMI: Localizar la industria de armas"
 SAU_gami_localise_the_arms_industry_desc: "La §Y Autoridad General de Industrias Militares §! licencia y cultiva un sector nacional de armas desde casi nada."
 SAU_the_saudi_drone_program: "El programa saudí Drone"
 SAU_the_saudi_drone_program_desc: "Las municiones y el reconocimiento §Ydrones§!, diseñados y construidos en el Reino."
 SAU_the_national_cybersecurity_authority: "La Autoridad Nacional de Seguridad Cibernética"
 SAU_the_national_cybersecurity_authority_desc: "El §YNational Cybersecurity Authority§! (2017) endurece las redes del Reino después de una década de ataques contra Aramco y los ministerios."
 SAU_sdaia_data_and_artificial_intelligence: "SDAIA: Datos & Inteligencia Artificial"
 SAU_sdaia_data_and_artificial_intelligence_desc: "El §YSaudi Data and AI Authority§!, establecido en 2019, coordinará la estrategia nacional de IA, ampliará la supercomputación y hará que los datos del gobierno estén disponibles para uso práctico."
 SAU_the_national_data_centres: "Los centros nacionales de datos"
 SAU_the_national_data_centres_desc: "Los centros de datos requieren energía abundante y construcción importante. El Reino puede proporcionar tanto, como campus hiperescala pueden apoyar una industria de nubes domésticas que sirve a la región más amplia."
 SAU_the_5g_network: "The 5G Network"
 SAU_the_5g_network_desc: "STC y Mobily mantienen al Reino en §Y5G§!, entre los más rápidos despliegues del mundo."
 SAU_absher_and_yesser_e_government: "Abher & Yesser E-Government"
 SAU_absher_and_yesser_e_government_desc: "Yesser, §YAbsher§! y Tawakkalna colocarán los servicios gubernamentales en plataformas móviles y reemplazarán a millones de transacciones personales."
 SAU_the_health_sector_transformation: "Transformación del sector de la salud"
 SAU_the_health_sector_transformation_desc: "La transformación del sector de la salud organizará hospitales en grupos responsables, ampliará el hospital virtual de Seha y aumentará el papel del seguro privado."
 SAU_madrasati_and_curriculum_reform: "Madrasati & Reforma del Plan de estudios"
 SAU_madrasati_and_curriculum_reform_desc: "La plataforma §YMadrasati§! y los planes de estudio revisados aumentarán la instrucción en pensamiento crítico, inglés y programación reduciendo al mismo tiempo la dependencia del aprendizaje bruto."
 SAU_the_riyadh_metro: "El metro Riyadh"
 SAU_the_riyadh_metro_desc: "Seis líneas debajo de la capital – el metro §YRiyadh§!, uno de los mayores proyectos urbano-transport jamás construidos en una sola fase."
 SAU_the_national_renewable_energy_program: "El Programa Nacional de Energía Renovable"
 SAU_the_national_renewable_energy_program_desc: "El §YNational Renewable Energy Program§! desarrollará decenas de gigavatios de generación solar y eólica, permitiendo que se exporte más petróleo crudo en lugar de quemado para electricidad."
 SAU_the_sakaka_solar_plant: "La planta solar de Sakaka"
 SAU_the_sakaka_solar_plant_desc: "La construcción de la planta §YSakaka§! comenzó en 2018, y se inauguró oficialmente en 2021 como la primera instalación solar de gran utilidad del Reino. Su bajo precio de electricidad demuestra el potencial comercial de la generación solar saudita."
 SAU_the_dumat_al_jandal_wind_farm: "Dumat al-Jandal Wind Farm"
 SAU_the_dumat_al_jandal_wind_farm_desc: "La granja eólica de 400 megavatios §YDumat al-Jandal§! utilizará fuertes vientos del norte para suministrar electricidad renovable y convertirse en la mayor instalación eólica del Medio Oriente."
 SAU_neom_green_hydrogen: "NEOM Hidrogen verde"
 SAU_neom_green_hydrogen_desc: "La NEOM acogerá la planta más grande del mundo §Yhidrógeno verde§!. El proyecto tiene por objeto convertir la electricidad renovable de bajo costo en un combustible exportable."
 SAU_the_civil_nuclear_program: "El Programa Nuclear Civil"
 SAU_the_civil_nuclear_program_desc: "El poder solar se desvanece cada noche, mientras que la demanda de electricidad y agua desalinada no lo hace. Un programa nuclear civil puede abastecerse durante todo el tiempo, siempre y cuando el Reino acepte el costo y el escrutinio que siguen cada reactor."
 SAU_battery_energy_storage: "Almacenamiento de energía a batería"
 SAU_battery_energy_storage_desc: "Las baterías a gran escala almacenarán la generación solar de mediodía para su uso durante el pico de demanda nocturna, mejorando la confiabilidad de la energía renovable."
 SAU_modernise_the_national_grid: "Modernizar el Grid Nacional"
 SAU_modernise_the_national_grid_desc: "Una red inteligente §Ynacional§!, interconectada con la red GCC, reducirá los apagones y equilibrará la generación renovable variable."
 SAU_ceer_the_saudi_electric_car: "Ceer: El coche eléctrico saudita"
 SAU_ceer_the_saudi_electric_car_desc: "§YCeer§!, fundada en 2022, y la planta Lucid cerca de Jeddah establecerá producción nacional de vehículos eléctricos. Esto permite a Arabia Saudita fabricar vehículos en lugar de depender totalmente de las importaciones."
 SAU_fund_vision_2030: "Fund Vision 2030"
 SAU_fund_vision_2030_desc: "Un plan tan grande no puede vivir solo en anuncios. Encomendar fondos de tesorería y capital del Fondo Público de Inversiones a proyectos que puedan reducir la dependencia del petróleo, crear empleos en el sector privado y demostrar que Vision 2030 ha ido más allá de la junta directiva."
 SAU_the_standardized_interest_law: "La Ley de intereses normalizados"
 SAU_the_standardized_interest_law_desc: "El interés se encuentra en la línea de fallas entre Sharia y la banca moderna. El Reino debe decidir si prohibir la riba directamente, permitir el préstamo convencional o tolerar el interés detrás de las formas islámicas."
 SAU_fractional_reserve_mandates: "Mandatos de reserva fraccional"
 SAU_fractional_reserve_mandates_desc: "Las reservas inferiores liberan más depósitos para prestar pero dejan a los bancos menos capaces de soportar retiros. El nuevo mandato debe decidir cuánto crédito pueden crear los bancos saudíes de cada riyal depositado."
 SAU_the_anti_speculation_directives: "Las Directivas Anti-Speculación"
 SAU_the_anti_speculation_directives_desc: "Los derivados permiten que las empresas se ocupen de los cambios de precio, pero los mismos instrumentos pueden convertir los mercados en un casino. Los reguladores deben trazar la línea entre la gestión útil del riesgo y el exceso de gharar prohibido bajo Sharia."
 SAU_the_interbank_lending_code: "El Código de Lending Interbank"
 SAU_the_interbank_lending_code_desc: "Los bancos saudíes necesitan un mercado nocturno para mover dinero entre ellos. Riyadh debe elegir si esa liquidez fluye a través de intereses convencionales, murabaha de productos básicos o dos sistemas mantenidos lado a lado."
 SAU_the_banking_control_law: "La Ley de control bancario"
 SAU_the_banking_control_law_desc: "El argumento sobre la banca termina con una cuestión de autoridad. ¿El SAMA regulará como un órgano tecnocrático independiente, un consejo de Sharia mantendrá el veto, o ambos supervisarán sus propias instituciones?"
 SAU_bastion_of_islamic_finance: "Bastion of Islamic Finance"
 SAU_bastion_of_islamic_finance_desc: "La financiación islámica puede ser una ortodoxia saudí protegida o un negocio vendido al mundo musulmán más amplio. Las reglas estrictas aseguran la confianza del ulema; las reglas pragmáticas traen más clientes a Riyadh."
 SAU_the_secularization_of_finance: "La secularización de las finanzas"
 SAU_the_secularization_of_finance_desc: "La apertura de cada instrumento financiero occidental sacaría del control administrativo al capital extranjero y la banca de aguas residuales. Una transición gradual puede suavizar el retroceso, pero sigue existiendo la ruptura con la tradición."
 SAU_a_defensive_deal_with_pakistan: "Un trato defensivo con Pakistán"
 SAU_a_defensive_deal_with_pakistan_desc: "Pakistán ocupa el ejército más grande del mundo musulmán, y su bomba es la única que posee un estado sunita. Bind Islamabad a la defensa de las Dos Mezquitas Sagradas."
 SAU_sabic_industrialization: "SABIC Industrialization"
 SAU_sabic_industrialization_desc: "§GSABIC§! (Saudi Basic Industries Corporation) es el gigante petroquímico del Reino, fundado en 1976. Convierte el aceite saudí en plásticos, fertilizantes y químicos - los bloques de construcción de una economía moderna."
 SAU_establish_sagia: "Establecer SAGIA"
 SAU_establish_sagia_desc: "Un decreto real establecerá la Autoridad General de Inversión §YSaudi Arabian§! para atraer a §G capital extranjero§!. SAGIA simplificará la concesión de licencias, trabajará directamente con inversores internacionales y promoverá §YRiyadh§! como centro para §Y negocio global§!."
 SAU_tadawul_the_saudi_stock_exchange: "Tadawul, la bolsa saudí"
 SAU_tadawul_the_saudi_stock_exchange_desc: "El comercio de acciones sauditas creció desde un mercado informal hasta el intercambio §GTadawul§!. Un moderno mercado de capitales ahora necesita una lista formal, divulgación y reglas comerciales antes de que pueda llevar las ambiciones de inversión del Reino."
 SAU_the_water_crisis: "La crisis del agua"
 SAU_the_water_crisis_desc: "Los acuíferos del Reino están siendo agotados, §Y las plantas de desalinización§! están bajo creciente presión, y el uso de agua per cápita está entre los §Y más altos del mundo§!. El gobierno debe reconocer formalmente la crisis antes de que pueda implementar una respuesta nacional."
 SAU_saudi_foreign_policy: "La política exterior saudita"
 SAU_saudi_foreign_policy_desc: "El trono, las ciudades santas y cada petrolero que sale del Golfo dependen de lo que Riyadh hace en el extranjero. La diplomacia saudí debe mantener los grandes poderes cerca sin dejar que ninguno de ellos sea dueño de la seguridad del Reino."
 SAU_fortify_the_kingdom: "Fortalecer el Reino"
 SAU_fortify_the_kingdom_desc: "Si la guerra fría con Irán se pone caliente, el golpe caerá en la Provincia Oriental y el Estrecho. Harden las defensas del reino para la disuasión del día falla."
 SAU_freedom_or_death: "Libertad o muerte"
 SAU_freedom_or_death_desc: "La guerra siria se ha convertido en una prueba de voluntad entre Riad y Teherán. Comprometerse plenamente a la rebelión y el prestigio saudí en la caída del régimen de Assad."
 SAU_fund_the_jordanian_army: "Fondo del Ejército de Jordania"
 SAU_fund_the_jordanian_army_desc: "Un fuerte ejército jordano protege el largo flanco norte del Reino. Escribe a los soldados de Ammán para que, cuando importa, respondan a Riad."
 SAU_fund_the_lebanese_army: "Fondo del Ejército Libanés"
 SAU_fund_the_lebanese_army_desc: "En Líbano el ejército nacional es el único contrapeso al estado de Hezbollah dentro de un estado. Finan a los LAF como un polo rival para la milicia iraní."
 SAU_fund_the_free_syrian_army: "Fondo del ejército sirio libre"
 SAU_fund_the_free_syrian_army_desc: "El levantamiento contra la Casa de Assad es una oportunidad para romper el puente de Irán al mar. Canalizar dinero y armas a los rebeldes que luchan en nombre de una Siria libre."
 SAU_guardians_of_the_two_mosques: "Guardianes de las dos mezquitas"
 SAU_guardians_of_the_two_mosques_desc: "El título Custodio de las Dos Mezquitas Sagradas da al Rey una reclamación religiosa indisponible a otros gobernantes musulmanes. El Consejo no puede asumir el título, pero puede fortalecer su legitimidad apoyando públicamente al Rey en este papel."
 SAU_the_hormuz_shield: "El escudo de Hormuz"
 SAU_the_hormuz_shield_desc: "Irán amenaza con cerrar el Estrecho en la primera señal de guerra. Construye el escudo aéreo y naval, con ayuda aliada, que mantiene a los tanques navegando lo que Teherán amenaza."
 SAU_the_india_middle_east_corridor: "El Corredor Oriental India-Middle"
 SAU_the_india_middle_east_corridor_desc: "Una nueva carretera de ferrocarril, puertos y oleoductos podría correr desde Mumbai a través de Arabia hasta el corazón de Europa. Haz que el Reino sea el vínculo indispensable en el pasillo que supere los puntos de encuentro del alcance de Irán."
 SAU_install_a_loyalist_in_the_government: "Instalar un loyalista en el Gobierno"
 SAU_install_a_loyalist_in_the_government_desc: "Se asignará a cada ministerio importante un oficial de servicio con autoridad para contrarrestar sus decisiones. Los ministros conservarán sus títulos, pero los militares ganarán el control directo sobre la administración pública."
 SAU_king_fahd_university_of_petroleum_and_minerals: "King Fahd universidad de Petróleo y minerales"
 SAU_king_fahd_university_of_petroleum_and_minerals_desc: "La ciencia, la tecnología, la ingeniería y las matemáticas tienen prioridad. El reino necesita ingenieros, no clérigos. El plan de estudios cambia en consecuencia."
 SAU_the_tatweer_education_project: "El proyecto de educación Tatweer"
 SAU_the_tatweer_education_project_desc: "El proyecto Tatweer enfatizará el pensamiento crítico, el análisis y el debate en lugar de la memorización. Esta reforma cambia tanto los métodos de enseñanza como la cultura educativa más amplia."
 SAU_english_language_education: "Enseñanza del idioma inglés"
 SAU_english_language_education_desc: "El inglés se impartirá en la escuela primaria para que los graduados saudíes puedan participar más eficazmente en la economía mundial."
 SAU_the_teachers_colleges: "Los Colegios de Profesores"
 SAU_the_teachers_colleges_desc: "Los profesores recibirán formación moderna en pedagogía, gestión de aulas y tecnología educativa."
 SAU_tatweer_smart_schools: "Escuelas inteligentes de Tatweer"
 SAU_tatweer_smart_schools_desc: "Tatweer Smart Schools introducirá tabletas de aula, plataformas de aprendizaje en línea y tutoría con ayuda de AI."
 SAU_king_abdulaziz_university: "Universidad King Abdulaziz"
 SAU_king_abdulaziz_university_desc: "Universidades como el Rey Saud, KAUST, KFUPM y la Princesa Nourah University se expandirán por todo el Reino y mejorarán el acceso a la educación superior."
 SAU_king_abdullah_university_of_science_and_technology: "Universidad King Abdullah de ciencia y tecnología"
 SAU_king_abdullah_university_of_science_and_technology_desc: "Las asociaciones con el MIT, Oxford y la Sorbona, junto con universidades extranjeras en Arabia Saudita, aportarán conocimientos académicos internacionales al Reino."
 SAU_the_king_abdullah_scholarship_program: "El programa de Becas King Abdullah"
 SAU_the_king_abdullah_scholarship_program_desc: "El Programa de Becas King Abdullah financiará miles de estudiantes saudíes en las principales universidades extranjeras. Los graduados volverán con calificaciones avanzadas y experiencia internacional."
 SAU_integrate_gosi_payrolls: "Integrar las nóminas GOSI"
 SAU_integrate_gosi_payrolls_desc: "La Organización General de Seguro Social ya sabe quién está en cada nómina del Reino, porque recauda las contribuciones. Nadie había pensado señalar esa base de datos en la cuestión de cuotas.\n\nEn el momento en que está conectado, la banda Nitaqat de una firma se computa, y el número de saudíes empleados realmente deja de ser lo que la firma escribió por última vez en un formulario."
 SAU_reform_the_kafala_system: "Reforma del Sistema Kafala"
 SAU_reform_the_kafala_system_desc: "Millones de trabajadores extranjeros viven en el Reino atado a un solo empleador que tiene sus documentos y su permiso para salir. La reforma no termina el acuerdo - hace que sea legible, portátil y mucho más fácil de entrar.\n\nLa entrada crece y se vuelve ordenada. Las firmas dejan de pagar para trabajar en torno a un sistema que nadie puede defender en público."
 SAU_platinum_tier_privileges: "Privilegios de Tier Platinum"
 SAU_platinum_tier_privileges_desc: "Las firmas de la banda superior obtienen sus permisos renovados a la vista, sus contratos aprobados primero, y su expansión ondeó mientras que la competencia todavía está desconcertante.\n\nNo cuesta al Tesoro nada, y compra más cumplimiento que cualquier multa que haya impuesto el Ministerio."
 SAU_red_zone_visa_freezes: "Zona roja Visa Freezes"
 SAU_red_zone_visa_freezes_desc: "Las firmas en la banda inferior pueden no renovar un único permiso de trabajo hasta que salgan de él. No restringido - congelado.\n\nAlguna reestructuración dentro del trimestre. Algunos contratan a los saudíes que no necesitan. Algunos simplemente dejan de funcionar, y el Ministerio ha decidido que puede vivir con eso."
 SAU_launch_the_qiwa_platform: "Lanzamiento de la plataforma Qiwa"
 SAU_launch_the_qiwa_platform_desc: "Un portal para todas las transacciones laborales en el Reino - contratos, transferencias, cupos permanentes, solicitudes de permiso. Lo que solía tomar un mes de papeleo lleno lleva una tarde.\n\nEs lo menos glamoroso de este programa y el que ambos campamentos están de acuerdo."
 SAU_repeal_the_expatriate_levy: "Derogación del Expatriado Levy"
 SAU_repeal_the_expatriate_levy_desc: "El cargo mensual de cada trabajador extranjero estaba destinado a pagar a los saudíes en las nóminas privadas. Lo que realmente hizo fue cerrar las firmas con los márgenes más delgados y empujar al resto a contratar fuera de los libros.\n\nElevándolo devuelve el trabajo que la economía continúa, y no devuelve nada al Tesoro."
 SAU_high_skill_visa_fast_track: "Visa de alto nivel rápido-track"
 SAU_high_skill_visa_fast_track_desc: "Los ingenieros, cirujanos y arquitectos de sistemas que el Reino todavía no puede producir son ondeados en días más que meses, con sus familias, y sin un patrocinador que sostiene su pasaporte.\n\nEl Reino compra la experiencia que no ha terminado de crecer."
 SAU_abolish_the_noc_requirement: "Abolir el Requisito NOC"
 SAU_abolish_the_noc_requirement_desc: "Un trabajador puede cambiar de empleador sin el permiso escrito de su empleador actual. Es una cláusula que se desprende del código de trabajo, y termina el arreglo que hizo que todo el sistema fuera lo que era.\n\nAvisos de capital. También todos los que se beneficiaron de la vieja regla."
 SAU_the_doroob_training_initiative: "La iniciativa de capacitación Doroob"
 SAU_the_doroob_training_initiative_desc: "Una plataforma nacional de aprendizaje electrónico para las habilidades que el sector privado realmente anuncia, libre en el punto de uso y abierto a cualquier persona con un ID nacional.\n\nNo fijará el mercado laboral. Se quita la excusa de que nadie fue entrenado."
 SAU_the_taqat_employment_portal: "El Portal de Empleo de Taqat"
 SAU_the_taqat_employment_portal_desc: "La puerta del trabajo nacional: todos los buscadores de trabajo en un registro, cada vacante conforme a lo dispuesto en otra, y un Ministerio que finalmente puede ver la brecha entre ellos\n\nJazan y las Fronteras del Norte aparecen por primera vez en los datos"
 SAU_the_saudization_quotas: "Los Quotas de Saudization"
 SAU_the_saudization_quotas_desc: "La cuota deja de ser una figura nacional y se convierte en un horario - construcción, retail, telecomunicaciones y transporte cada uno consigue un piso, ponderado por cuántos saudíes el sector podría absorber plausiblemente.\n\nEl Ministerio se ha equivocado sobre ese número antes."
 SAU_subsidize_sme_compliance: "Subvenciona a las PYMES Cumplimiento"
 SAU_subsidize_sme_compliance_desc: "Un conglomerado puede llevar una cuota. Una firma de treinta personas no puede, y esas empresas emplean más saudíes por riyal de ingresos que cualquier conglomerado en el Reino.\n\nCrédito barato, un horario de inspección más ligero y el espacio de oficina para crecer."
 SAU_the_industrial_cadre_mandate: "El mandato de los cuadros industriales"
 SAU_the_industrial_cadre_mandate_desc: "Se dice a la industria pesada qué parte de su personal técnico debe ser saudita, y se le da una década para llegar allí. Los gigantes petroquímicos pueden absorberlo; los contratistas alrededor de ellos tendrán que aprender.\n\nEl Reino deja de importar a cada ingeniero que toca un oleoducto."
 SAU_hrdf_wage_subsidies: "Subvenciones de salarios del FNUDC"
 SAU_hrdf_wage_subsidies_desc: "El Fondo para el Desarrollo de Recursos Humanos paga una parte del salario de un empleado saudí durante los primeros años de empleo, en la teoría de que la brecha entre un nacional y un expatriado es principalmente una brecha en la experiencia.\n\nLas firmas toman la subvención. Si el alquiler sobrevive a su expiración es la parte que nadie ha resuelto."
 SAU_the_wusool_transport_subsidy: "Wusool Transport Subsidy"
 SAU_the_wusool_transport_subsidy_desc: "La mitad de los graduados en el Reino son mujeres y casi ninguno está empleado, y la limitación vinculante no es talento o permiso - es que no pueden llegar a la oficina.\n\nEl estado subvenciona el viaje. La fuerza de trabajo crece por un número que no puede coincidir con la política migratoria."
 SAU_foreign_ownership_deregulation: "Desregulación de la propiedad extranjera"
 SAU_foreign_ownership_deregulation_desc: "Una firma extranjera puede poseer su operación saudita, repatriar ganancias sin discusión, y saltar al socio local que contribuyó con una firma y tomó un tercio.\n\nLa capital llega rápidamente. También la cuestión de quién es dueño de la industria del Reino."
 SAU_secondary_education_expansion: "Expansión de la educación secundaria"
 SAU_secondary_education_expansion_desc: "Se expanden las escuelas secundarias. El entrenamiento profesional crece. Cada adolescente saudí tiene acceso a la educación secundaria - académica o profesional."
 SAU_technical_and_vocational_training_corporation: "Corporación de Formación Técnica y Profesional"
 SAU_technical_and_vocational_training_corporation_desc: "Las universidades técnicas entrenan plomeros, electricistas, mecánicos y soldadores. No todos los saudíes necesitan un título universitario. La economía necesita comercios cualificados."
 SAU_saudi_internal_affairs: "Asuntos internos saudíes"
 SAU_saudi_internal_affairs_desc: "La política interna del Reino abordará la seguridad pública, la educación, la salud y el bienestar económico. Estos sistemas sirven de base para la estabilidad y el desarrollo a largo plazo."
 SAU_confront_the_literacy_crisis: "Frente a la crisis de alfabetización"
 SAU_the_anglo_style_curriculum: "El Curriculum Anglo-Style"
 SAU_the_anglo_style_curriculum_desc: "Un plan de estudios anglo-estilo traerá más pensamiento crítico, investigación científica y debate aula en escuelas saudíes. La economía necesita esos hábitos, incluso si el ulema los ve como intrusión extranjera."
 SAU_confront_the_literacy_crisis_desc: "En el año 2000, más de uno de cada cinco saudíes no pueden leer, dejando al Reino con una tasa de analfabetismo §Y del 79%§!. El dinero del petróleo no puede modernizar un país sin maestros, ingenieros y empleados. Riyadh debe elegir entre un §YCurso de estilo anglo§! y un sistema §Ydoméstico de pistas académicas y profesionales§!.\n\n§G Cada enfoque educativo eleva la tasa de alfabetización§! hacia la plena alfabetización."
 SAU_education_transformation_complete: "Transformación educativa Completa"
 SAU_education_transformation_complete_desc: "Las universidades se han ampliado, los planes de estudio han cambiado y la alfabetización está aumentando en todo el Reino. Las reformas no han resuelto todas las debilidades, pero las aulas sauditas están mejor preparadas para el trabajo por delante."
 SAU_domestic_secondary_tracks: "Pistas secundarias nacionales"
 SAU_domestic_secondary_tracks_desc: "Las escuelas secundarias sauditas se dividirán en caminos académicos y vocacionales, cada una construida alrededor de las habilidades necesarias en el hogar. El sistema cuesta más construir que importar un modelo extranjero, pero responde a las prioridades sauditas."
 SAU_ministry_of_human_resources_mandate: "Mandato del Ministerio de Recursos Humanos"
 SAU_the_nitaqat_decree: "Decreto Nitaqat"
 SAU_the_nitaqat_decree_desc: "El Reino deja de pedir a las empresas que contraten a los saudíes y comienza a calificarlos sobre si lo hicieron. Cada firma tiene un color, el color decide lo que se permite hacer la firma, y el color se calcula a partir de una nómina que el Ministerio ya puede ver.\n\nEs la primera política laboral en la historia del Reino con un mecanismo de ejecución adjunto."
 SAU_ministry_of_human_resources_mandate_desc: "El Ministerio tiene la autoridad que siempre se ha asumido de tener: establecer cuotas por sector, rechazar un visado sin explicarse a sí mismo y cerrar una empresa que no cumpla.\n\nFirmas que pasaron años presionando el departamento equivocado descubren que ahora hay una correcta, y no está interesada."
 SAU_fast_track_government_contracts: "Contratos gubernamentales de tracción rápida"
 SAU_fast_track_government_contracts_desc: "Cada riyal que gasta el Estado en infraestructura se convierte en un instrumento de política laboral. Las empresas que cumplen la oferta primero, se pagan primero, y se lo dicen públicamente.\n\nEl Reino es el cliente más grande del Reino. Finalmente ha decidido comprar en consecuencia."
 SAU_gip: "GIP"
 SAU_gip_desc: "GIP profesionaliza. La capacitación, el equipo y los procedimientos cumplen las normas internacionales. La seguridad interna del reino se vuelve más efectiva - y más visible."
 SAU_the_open_market: "El mercado abierto"
 SAU_the_open_market_desc: "La respuesta es dejar de preguntar al estado. Las reglas de propiedad van, los controles de capital van y el mercado decide qué empresas merecen existir y cuáles saudíes necesitan.\n\nEs el camino más rápido y el más difícil. Nadie que pierda un trabajo en él será atrapado por nada."
 SAU_opec_agreement: "Acuerdo OPEC+"
 SAU_opec_agreement_desc: "Moscú y Riyadh son rivales en el mercado petrolero y en los lados opuestos de Siria, pero juntos pueden fijar el precio del crudo. Ataque el trato que mantiene intacto al cártel de dos."
 SAU_command_of_the_gulf: "Comando del Golfo"
 SAU_command_of_the_gulf_desc: "Con la armada iraní rota y el estrecho abierto, el Reino es el dueño de las aguas del Golfo. El largo concurso para el mar es ganado."
 SAU_the_iraq_war: "La guerra de Irak"
 SAU_the_iraq_war_desc: "Los tanques americanos están rodando hacia Bagdad, y el viejo orden en Mesopotamia está a punto de ser barrido. El Reino debe prepararse para cualquier ascenso de los restos."
 SAU_king_in_name_heir_in_uniform: "Rey en nombre, heredero en uniforme"
 SAU_king_in_name_heir_in_uniform_desc: "El trono permanecerá, pero el heredero será tanto un príncipe como un oficial sirviente aceptable para el Concilio. Este compromiso preserva la dinastía mientras coloca la sucesión bajo supervisión militar."
 SAU_the_kingdom_unbeholden: "El Reino Unbeholden"
 SAU_the_kingdom_unbeholden_desc: "El Reino rechazará las garantías de seguridad y los patronos extranjeros y se basará enteramente en su propia defensa. Esta es la opción más costosa, pero preserva la plena independencia estratégica."
 SAU_martial_law_issues: "Cuestiones de Derecho Marcial"
 SAU_martial_law_issues_desc: "Las autoridades militares controlarán la asamblea pública, el movimiento entre las provincias y la prensa. Debido a que el Reino no tiene constitución para suspender, estas restricciones pueden imponerse directamente por decreto."
 SAU_secure_support_in_the_mecca_province: "Apoyo seguro en la provincia de Mecca"
 SAU_secure_support_in_the_mecca_province_desc: "La provincia de Makkah incluye a Jeddah, los centros de peregrinación, familias mercantes influyentes y una identidad hejazi que precede al gobierno saudí. El Consejo utilizará el patrocinio, las fuerzas de seguridad y las concesiones políticas para asegurar la provincia."
 SAU_the_mecca_summit: "La Cumbre de la Meca"
 SAU_the_mecca_summit_desc: "El Reino acogerá negociaciones en Meca y utilizará la cumbre para fortalecer la posición de Riad como mediador en el mundo musulmán."
 SAU_memories_of_khafji: "Memories of Khafji"
 SAU_memories_of_khafji_desc: "En 1991 la armadura iraquí se apoderó brevemente de un pueblo fronterizo saudí, una humillación que el Reino nunca olvidó. Deje que la memoria de Khafji acero las defensas del reino contra cualquier repetición."
 SAU_the_military_takeover: "La toma militar"
 SAU_the_military_takeover_desc: "Las fuerzas armadas han incautado a los ministerios, autoridad de radiodifusión y enfoques de los palacios reales. El Guardia Nacional creado para prevenir tal golpe ha sido rodeado, dejando a los militares en control del Reino."
 SAU_the_monarchy_under_military_rule: "La monarquía bajo la regla militar"
 SAU_the_monarchy_under_military_rule_desc: "El Rey permanecerá en el palacio y seguirá firmando decretos, pero el Consejo controlará a las fuerzas armadas y determinará la política gubernamental. La monarquía sobrevive como institución formal sin poder independiente."
 SAU_the_royal_saudi_naval_forces: "Las Reales Fuerzas Navales sauditas"
 SAU_the_royal_saudi_naval_forces_desc: "Construir las Reales Fuerzas Navales sauditas (RSNF), divididas entre dos mares, para proteger las largas costas del Reino."
 SAU_eastern_fleet_jubail: "Flota oriental (Jubail)"
 SAU_eastern_fleet_jubail_desc: "Base la Flota Oriental en Jubail para dominar el Golfo Arábigo y proteger las terminales petrolíferas."
 SAU_western_fleet_jeddah: "Flota occidental (Jeddah)"
 SAU_western_fleet_jeddah_desc: "Base la Flota Occidental en Jeddah para asegurar la costa del Mar Rojo y los enfoques de Bab-el-Mandeb."
 SAU_sawari_ii_frigate_programme: "Programa de fragatas Sawari II"
 SAU_sawari_ii_frigate_programme_desc: "Adquirir las fragatas de clase Al Riyadh construidas en francés bajo el programa Sawari II, los barcos más poderosos de la flota."
 SAU_badr_class_corvettes: "Corvettes de clase inferior"
 SAU_badr_class_corvettes_desc: "Campo los corbetes de clase Badr para patrulla, escolta y huelga costera."
 SAU_royal_saudi_marines: "Marines saudíes reales"
 SAU_royal_saudi_marines_desc: "Eleve una fuerza marina saudí real para los aterrizajes anfibios y la defensa de la costa e islas."
 SAU_king_faisal_naval_base: "Base naval del rey Faisal"
 SAU_king_faisal_naval_base_desc: "Desarrollar las grandes bases navales en Jeddah y Jubail para sostener una marina de dos flotas."
 SAU_neom_aqaba_synergy: "NEOM-Aqaba Synergy"
 SAU_neom_aqaba_synergy_desc: "Donde la megaciudad saudí de la NEOM se encuentra con el puerto jordano de Aqaba, una única zona económica podría atracar al golfo entre ellos. Coloque las dos orillas en un motor de crecimiento."
 SAU_deal_with_the_french: "Trato con los franceses"
 SAU_deal_with_the_french_desc: "París vende armas a cualquiera y da conferencias a todos, pero el negocio es negocio. Un pacto de inversión cuidadosamente cercado permite que el Reino se beneficie de la industria francesa manteniendo al mismo tiempo mejores opciones a su alcance."
 SAU_a_new_iraqi_alignment: "Una nueva alineación iraquí"
 SAU_a_new_iraqi_alignment_desc: "Años de diplomacia paciente y patrocinio dan fruto: Al fin, las inclinaciones de Bagdad hacia Riad. Ancla la nueva alineación antes de que pueda deslizarse hacia Teherán."
 SAU_major_non_nato_ally: "General de la OTAN"
 SAU_major_non_nato_ally_desc: "Al margen de una alianza convencional, lo más cercano que una nación puede estar al lado de las potencias atlánticas es el estatus de un socio privilegiado. Asegure para el Reino la posición de un importante aliado no-OTAN."
 SAU_the_palestine_question: "Cuestión de Palestina"
 SAU_the_cause_above_all: "La causa sobre todo"
 SAU_the_cause_above_all_desc: "El Reino apoyará a Palestina central en su reivindicación de liderazgo en el mundo musulmán y en su papel como Custodio de las Dos Mezquitas Santas."
 SAU_open_the_backchannel: "Abra el backchannel"
 SAU_open_the_backchannel_desc: "Hombres callados en terceros países, deniables y pacientes, sonan lo que Tel Aviv podría aceptar antes de cualquier lado dice algo en voz alta."
 SAU_the_arab_peace_initiative: "La Iniciativa de Paz Árabe"
 SAU_the_arab_peace_initiative_desc: "El propio plan del Reino, ofrecido en Beirut en 2002 y nunca retirado: la plena normalización con todo el mundo árabe a cambio de una Palestina independiente en las líneas de 1967. Riyadh vuelve a ponerlo sobre la mesa, formalmente y por escrito."
 SAU_sweeten_the_deal: "Endulzar el trato"
 SAU_sweeten_the_deal_desc: "Fondos de inversión, corredores tecnológicos y cielos abiertos. Riyadh muestra a Tel Aviv lo que vale la paz con la mayor economía del Golfo."
 SAU_the_talks_collapse: "Las conversaciones se desploman"
 SAU_the_talks_collapse_desc: "Israel no pagaría el precio, y Riad no lo rebajaría. Las delegaciones vuelan a casa, y la pregunta vuelve a su vieja respuesta."
 SAU_the_riyadh_accords: "Los Acuerdos de Riad"
 SAU_the_riyadh_accords_desc: "Israel ha aceptado la Iniciativa de Paz Árabe. Reconocimiento por estadidad en las líneas de 1967, con la nueva Palestina garantizada por Arabia Saudita y Jordania: el acuerdo del siglo, firmado en Riad."
 SAU_embassies_and_trade: "Embajadas y comercio"
 SAU_embassies_and_trade_desc: "Vuelos, misiones comerciales y flujo de capital entre Riyadh y Tel Aviv. La paz comienza a pagar por sí misma."
 SAU_silicon_and_sand: "Silicona y Arena"
 SAU_silicon_and_sand_desc: "La tecnología israelí y el capital saudí hacen socios naturales. Las empresas mixtas en ciber, agua y agritech tienen raíces en ambos desiertos."
 SAU_double_down_on_palestine: "Doble Down on Palestine"
 SAU_double_down_on_palestine_desc: "Si Israel no otorgará un estado, el Reino construirá uno de todos modos: dinero, instituciones y peso saudí detrás de Ramallah."
 SAU_rally_the_arab_league: "Rallye de la Liga Árabe"
 SAU_rally_the_arab_league_desc: "Las conversaciones fallidas demostraron el punto de cada capital que ondea. Riyadh reúne a la Liga detrás de una sola línea: sin normalización sin Palestina."
 SAU_no_peace_without_palestine: "No hay paz sin Palestina"
 SAU_the_fate_of_palestine: "El destino de Palestina"
 SAU_the_fate_of_palestine_desc: "Ya sea por tratado o por desafío, el Reino se ha vinculado al futuro de Palestina. El Custodio de las Dos Mezquitas Santas no abandona Jerusalén."
 SAU_no_peace_without_palestine_desc: "No habrá embajada en Tel Aviv mientras Palestina siga ocupada. El Reino mantiene la línea que el mundo árabe dibujó en 2002."
 SAU_normalization_with_conditions: "Normalización con condiciones"
 SAU_normalization_with_conditions_desc: "El precio de Riyadh no ha cambiado desde la Iniciativa de Paz Árabe: reconocimiento por estadidad. Si Israel quiere la mano del Reino, aceptará una Palestina independiente."
 SAU_normalization_without_conditions: "Normalización Sin Condiciones"
 SAU_normalization_without_conditions_desc: "El Reino reconocerá a Israel sin exigir concesiones sobre Palestina. Esto mejorará las relaciones con los Estados Unidos y fomentará el comercio, pero provocará una oposición sustancial en todo el mundo árabe."
 SAU_normalization_champion_the_palestinian_cause: "Campeón de la Causa Palestina"
 SAU_normalization_champion_the_palestinian_cause_desc: "El dinero saudí mantiene las luces en Ramallah y la causa viva en cada capital árabe."
 SAU_strengthen_the_resistance: "Fortalecer la resistencia"
 SAU_strengthen_the_resistance_desc: "Las facciones que resisten la ocupación no querrán fondos ni amigos mientras Riyadh está detrás de ellos."
 SAU_boycott_israeli_goods: "boicotear los bienes israelíes"
 SAU_boycott_israeli_goods_desc: "No un riyal de dinero saudí tocará a un estante israelí. El mercado del Reino cierra sus puertas."
 SAU_pressure_the_normalizers: "Presión de los Normalizadores"
 SAU_pressure_the_normalizers_desc: "Cualquier gobierno árabe tentado por el apretón de manos de Tel Aviv sentirá primero el disgusto de Riyadh. Las filas se mantienen porque el Reino las sostiene."
 SAU_an_arab_consensus: "Un consenso árabe"
 SAU_an_arab_consensus_desc: "De Rabat a Bagdad, el Reino forja una voz árabe sobre Israel: ningún reconocimiento, ninguna relación, ninguna excepción."
 SAU_the_palestine_question_desc: "Cada capital árabe tiene una respuesta a la pregunta israelí; ninguna está de acuerdo. Riyadh debe elegir ahora su propio: paz sin condiciones, paz con precio o nada de paz."
 SAU_a_deal_with_south_korea: "Un trato con Corea del Sur"
 SAU_a_deal_with_south_korea_desc: "Los astilleros, reactores y gigantes de construcción coreanos construyeron gran parte del Golfo moderno. Court Seoul como socio en la energía nuclear, la industria de defensa y los megaproyectos de Vision 2030."
 SAU_saudi_china_deal: "Trato saudí-China"
 SAU_saudi_china_deal_desc: "Las empresas chinas tienen hambre en los contratos de petróleo y una posición en el Golfo. Ofrézcales acceso a proyectos agrícolas y energéticos saudíes a cambio de inversiones en el Reino."
 SAU_operation_red_gulf: "Operación Golfo Rojo"
 SAU_operation_red_gulf_desc: "Si la guerra fría se enciende, el Reino debe estar listo para llevar la lucha a la costa iraní. Elaborar los planes para una campaña decisiva en las aguas del Golfo."
 SAU_palestine_champion_the_palestinian_cause: "Campeón de la Causa Palestina"
 SAU_bankroll_the_resistance: "Banca la resistencia"
 SAU_bankroll_the_resistance_desc: "Las palabras son baratas. Canalizar dinero y armas reales a las facciones palestinas para que la influencia saudí, no iraní, configura la lucha."
 SAU_arm_the_militants: "Brazo de los Militantes"
 SAU_arm_the_militants_desc: "Retrocedan las facciones armadas. Riyadh se convierte en el jefe de la pistola, impugnando a Teherán por la lealtad de cada luchador en Gaza."
 SAU_guardian_of_al_aqsa: "Guardian of Al-Aqsa"
 SAU_guardian_of_al_aqsa_desc: "El apoyo de la Arabia Saudita ha asegurado a Riad un papel duradero en Palestina y ha fortalecido su afirmación de proteger a Al-Aqsa."
 SAU_broker_a_two_state_peace: "Quebrar una paz de dos Estados"
 SAU_broker_a_two_state_peace_desc: "El Reino mediará una solución de dos estados. Un acuerdo patrocinado por Arabia Saudí ampliaría la influencia diplomática de Riyadh en todo el mundo árabe."
 SAU_palestine_champion_the_palestinian_cause_desc: "Palestina sigue siendo una de las cuestiones más importantes desde el punto de vista político en el mundo árabe. Apoyar la causa palestina fortalecerá la reivindicación del Reino hacia el liderazgo musulmán y contra la influencia iraní."
 SAU_ceasefire_with_the_houthis: "Cesación del fuego con los Houthis"
 SAU_ceasefire_with_the_houthis_desc: "Ofrezca a los Houthis una cesación del fuego que detenga las pérdidas sauditas y congele el frente. Si lo aceptan, la paz significará vivir con un enemigo armado en la frontera sur."
 SAU_the_great_pipeline_game: "El Gran Juego de Pipeline"
 SAU_the_great_pipeline_game_desc: "La mayoría de las exportaciones sauditas de petróleo pasan por el estrecho de Hormuz, dejándolas vulnerables a la perturbación iraní. El Reino considerará tres rutas de oleoductos alternativos: a través del Yemen al Mar Arábigo, a través de Siria al Mediterráneo, o a través de Irak y Turquía hacia Europa; cada una cruza una región inestable y compite con los intereses energéticos rusos."
 SAU_prepare_defences_against_saddam: "Preparen Defences against Saddam"
 SAU_prepare_defences_against_saddam_desc: "Un Saddam acorralado es peligroso. Fortalecer la frontera norteña contra el ejército que una vez estuvo en Kuwait, un día de viaje desde los campos petroleros."
 SAU_proclaim_the_republic: "Proclamar la República"
 SAU_proclaim_the_republic_desc: "El Consejo abolirá formalmente la monarquía y proclamará una república. Las instituciones del nuevo estado permanecen inestables, pero el trono de Al Saud no sobrevivirá a la declaración."
 SAU_reaffirming_the_quincy_agreement: "Reafirmando el Acuerdo de Quincy"
 SAU_reaffirming_the_quincy_agreement_desc: "Roosevelt y Abdulaziz establecieron la base de las relaciones entre Arabia Saudita y Estados Unidos a bordo del USS Quincy en febrero de 1945: apoyo de seguridad estadounidense a cambio de aceite saudí fiable. El Consejo pedirá confirmación de que este acuerdo se aplica al estado saudí en lugar de sólo a la monarquía."
 SAU_the_regency_decree: "El Decreto de Regency"
 SAU_the_regency_decree_desc: "El Rey firmará un decreto traspasando poderes ejecutivos y de defensa al Consejo por un período no especificado de incapacidad. El decreto conserva una apariencia legal al tiempo que coloca al gobierno bajo control militar."
 SAU_master_the_crisis: "Maestro de la crisis"
 SAU_master_the_crisis_desc: "Sea cual sea la forma en que se construyó el agua, ahora está fluyendo, y el Ministerio finalmente puede planear por un año más que una temporada.\n\n§Y Cierra la última crisis del agua§!. Disponible una vez Ras Al-Khair o Shuaibah está en línea.\n\nEl Reino deja de racionar y comienza a construir."
 SAU_arm_the_faithful: "El brazo fiel"
 SAU_arm_the_faithful_desc: "Distribuir armas y capacitación a las milicias de la revolución."
 SAU_hezbollah_brigades: "Hezbollah Brigades"
 SAU_hezbollah_brigades_desc: "Forjar a las milicias en brigadas disciplinadas modeladas sobre la resistencia libanesa."
 SAU_shia_civil_rights: "Derechos civiles"
 SAU_shia_civil_rights_desc: "Garantizar que la comunidad chiíta esté en pie de igualdad ante la ley, terminando décadas de discriminación oficial."
 SAU_sectarian_coexistence: "Coexistencia sectaria"
 SAU_sectarian_coexistence_desc: "Forge un pacto nacional entre sunnitas y chiítas, basado en la ciudadanía compartida."
 SAU_the_constitutional_shia_republic: "La república de Shia constitucional"
 SAU_the_federal_welfare_state: "El Estado de Bienestar Federal"
 SAU_the_federal_welfare_state_desc: "Construir las instituciones de la república constitucional: un estado de bienestar federal que une a las comunidades mediante la prosperidad compartida y el estado de derecho."
 SAU_the_constitutional_shia_republic_desc: "Coronar el camino moderado con una república constitucional asegurando los derechos de Shia dentro de un orden pluralista."
 SAU_develop_the_eastern_province: "Desarrollar la Provincia Oriental"
 SAU_develop_the_eastern_province_desc: "Canalizar la riqueza petrolífera de la república a la larga tierra chiíta del este."
 SAU_export_the_revolution: "Exportar la revolución"
 SAU_export_the_revolution_desc: "Llevar la revolución más allá de las fronteras de Arabia a los chiítas del Golfo."
 SAU_federal_autonomy: "Federal Autonomía"
 SAU_federal_autonomy_desc: "Devolver el verdadero poder a las provincias chiítas dentro de un sindicato federal pluralista."
 SAU_alliance_with_iran: "Alianza con Irán"
 SAU_alliance_with_iran_desc: "Ata el nuevo estado a Teherán, patrón de la revolución chiíta en toda la región."
 SAU_the_islamic_republic_of_arabia: "La República Islámica de Arabia"
 SAU_the_revolutionary_state: "El Estado Revolucionario"
 SAU_the_revolutionary_state_desc: "La República Islámica centralizará sus instituciones, milicias y clero bajo un gobierno revolucionario disciplinado alineado con la resistencia."
 SAU_the_islamic_republic_of_arabia_desc: "Proclamar a la República Islámica bajo la tutela del jurista, alineada con el eje de resistencia."
 SAU_shia_national_dialogue: "Diálogo nacional"
 SAU_shia_national_dialogue_desc: "Solicite reparación para los chiítas mediante la negociación y la urna en lugar de confrontación."
 SAU_the_parliamentary_path: "Sendero Parlamentario"
 SAU_the_parliamentary_path_desc: "Encomendar al movimiento a una asamblea electa, impugnando el poder abiertamente como una oposición leal."
 SAU_reconcile_with_the_republic: "Reconciliarse con la República"
 SAU_reconcile_with_the_republic_desc: "Bury viejas quejas y aceptar un lugar dentro del marco nacional, negociando la revolución para la representación."
 SAU_guarantee_religious_freedom: "Garantizar la libertad religiosa"
 SAU_guarantee_religious_freedom_desc: "Protege los ritos y seminarios de cada comunidad bajo una república tolerante y secular."
 SAU_the_republic_endures: "De la República"
 SAU_the_republic_endures_desc: "Los años provisionales han terminado. La república chiíta ahora gobierna a través de instituciones permanentes, y los ciudadanos deben considerar con ella como el estado duradero de Arabia."
 SAU_the_resistance: "La resistencia"
 SAU_the_resistance_desc: "Rallye de los fieles a la lucha armada, en el espíritu del Hejaz Hezbollah."
 SAU_the_revolutionary_vanguard: "La vanguardia revolucionaria"
 SAU_the_revolutionary_vanguard_desc: "Coloque al clero armado en el jefe del estado, por encima del partido y el parlamento."
 SAU_wilayat_al_faqih: "Wilayat al-Faqih"
 SAU_wilayat_al_faqih_desc: "Enshrine la tutela del jurista, otorgando autoridad suprema en el líder religioso supremo."
 SAU_the_national_charter: "La Carta Nacional"
 SAU_the_national_charter_desc: "Proclamar una constitución escrita que une al gobernante y gobernó por igual a la ley."
 SAU_liberalize_the_economy: "Liberalizar la economía"
 SAU_liberalize_the_economy_desc: "Abrir la economía cerrada a la competencia y a la empresa privada."
 SAU_privatize_the_state_sector: "Privatizar el sector estatal"
 SAU_privatize_the_state_sector_desc: "Vender las empresas estatales hinchadas en manos privadas y dejar que el mercado funcione."
 SAU_open_to_foreign_investment: "Abierta a la Inversión Extranjera"
 SAU_open_to_foreign_investment_desc: "Bienvenido capital extranjero para construir las fábricas que el reino nunca tuvo."
 SAU_diversify_beyond_oil: "Diversificar más allá del petróleo"
 SAU_diversify_beyond_oil_desc: "Quitar la república de crudo, construir una economía que supere los pozos."
 SAU_secure_property_rights: "Derechos de propiedad seguros"
 SAU_secure_property_rights_desc: "Enshrine el derecho a poseer, y el derecho a mantener lo que uno ha construido."
 SAU_free_trade_agreements: "Tratados de Libre Comercio"
 SAU_free_trade_agreements_desc: "Firme pactos de comercio abierto que unen a Arabia a los mercados del mundo."
 SAU_an_independent_central_bank: "Un Banco Central Independiente"
 SAU_an_independent_central_bank_desc: "Liberar a la autoridad monetaria de la injerencia política."
 SAU_champion_the_private_sector: "Campeón del sector privado"
 SAU_champion_the_private_sector_desc: "Retrocede a los empresarios y pequeñas empresas que impulsan una economía libre."
 SAU_equality_for_women: "Igualdad para la Mujer"
 SAU_equality_for_women_desc: "Reducir las leyes de tutela y colocar a las mujeres como iguales en la vida pública."
 SAU_reform_the_schools: "Reformar las escuelas"
 SAU_reform_the_schools_desc: "Reemplazar la enseñanza clerical rota con un plan de estudios moderno y secular."
 SAU_an_elected_majlis_al_shura: "Un Majlis al-Shura elegido"
 SAU_an_elected_majlis_al_shura_desc: "Transformar el Consejo Consultivo designado en un parlamento nacional libremente elegido."
 SAU_freedom_of_religion: "Libertad de religión"
 SAU_freedom_of_religion_desc: "Garantizar a toda fe el derecho de adorar libremente y en abierto."
 SAU_nda_secular_republic: "Una República secular"
 SAU_nda_secular_republic_desc: "Dibuja una línea firme entre mezquita y estado."
 SAU_empower_civil_society: "Empoderamiento de la sociedad civil"
 SAU_empower_civil_society_desc: "Legalizar los sindicatos, las organizaciones benéficas y las asociaciones que tejen a un pueblo libre juntos."
 SAU_guarantee_labor_rights: "Garantía Derechos laborales"
 SAU_guarantee_labor_rights_desc: "Garantizar el derecho a organizarse, a huelga y a un salario justo."
 SAU_a_human_rights_charter: "A Carta de Derechos Humanos"
 SAU_a_human_rights_charter_desc: "Ata la república a los derechos universales de todo su pueblo."
 SAU_realign_with_the_west: "Realizar con Occidente"
 SAU_realign_with_the_west_desc: "Gire la república hacia Washington y Bruselas como socio entre las democracias."
 SAU_mend_the_gulf: "Mend el Golfo"
 SAU_mend_the_gulf_desc: "Reconciliar con los estados del Golfo como una nación árabe, monarquías y todo."
 SAU_join_the_worlds_institutions: "Únase a las instituciones del mundo"
 SAU_join_the_worlds_institutions_desc: "Tome asiento de Arabia en los consejos del orden internacional."
 SAU_open_the_borders: "Abran las fronteras"
 SAU_open_the_borders_desc: "Facilite el flujo de personas y bienes a través de una frontera más libre."
 SAU_an_arab_democratic_league: "Una Liga Democrática Árabe"
 SAU_an_arab_democratic_league_desc: "Rallye de las democracias del mundo árabe bajo una sola bandera liderada por Riad."
 SAU_the_first_free_elections: "Las primeras elecciones libres"
 SAU_the_first_free_elections_desc: "Abre la votación a todos los ciudadanos y deja que el pueblo escoja su propio gobierno."
 SAU_an_independent_judiciary: "Un poder judicial independiente"
 SAU_an_independent_judiciary_desc: "Liberar a los tribunales del palacio, fundando un poder judicial que sólo responda a la ley."
 SAU_freedom_of_the_press: "Libertad de prensa"
 SAU_freedom_of_the_press_desc: "Levanta la mano del censor de los periódicos y las ondas aéreas."
 SAU_the_anti_corruption_commission: "Comisión contra la Corrupción"
 SAU_the_anti_corruption_commission_desc: "Encontré un vigilante independiente para arrancar el injerto de alta oficina."
 SAU_decentralize_the_provinces: "Descentralizar las provincias"
 SAU_decentralize_the_provinces_desc: "Desarrolla el verdadero poder para elegir los consejos provinciales en todo el reino."
 SAU_limit_the_executive: "Limitar el poder ejecutivo"
 SAU_limit_the_executive_desc: "Ata la presidencia con límites de mandato, para que ningún líder gobierne por vida."
 SAU_the_provisional_government: "El Gobierno Provisional"
 SAU_convene_the_national_assembly: "Convocar la Asamblea Nacional"
 SAU_convene_the_national_assembly_desc: "El gobierno provisional convocará a los partidos políticos de la nueva república y determinará qué movimiento dirigirá el estado permanente."
 SAU_the_communist_party: "El Partido Comunista"
 SAU_the_communist_party_desc: "El Partido Comunista saudí pasó cuatro décadas bajo tierra, en exilio o en prisión. Su liderazgo sobreviviente regresa a Riyadh con un pequeño pero bien organizado movimiento."
 SAU_the_national_democratic_assembly: "La Asamblea Nacional Democrática"
 SAU_the_national_democratic_assembly_desc: "Entregar la nueva república a los demócratas liberales de la Asamblea Nacional Democrática. Prometen una constitución escrita, un parlamento elegido y una economía abierta que responda a la urna electoral."
 SAU_the_arab_baath_party: "El Partido Ba'ath Árabe"
 SAU_the_arab_baath_party_desc: "Entregar la república al Partido Ba'ath Socialista Árabe, los nacionalistas panárabes seculares que soñan con una sola nación árabe unida."
 SAU_the_islamic_parties: "Las Partes Islámicas"
 SAU_the_islamic_parties_desc: "Los clérigos sahwa, las redes de Hermandad Musulmana y las sociedades benéficas islámicas sobrevivieron a repetidas prohibiciones y ahora exigen un papel en el gobierno post-revolucionario."
 SAU_the_provisional_government_desc: "El Consejo Nacional de Transición gobierna un país sin constitución, sin elecciones y sin futuro establecido. Su primera tarea es simplemente mantener el orden y sentar las bases para la república que seguirá."
 SAU_restoration_of_relations: "Restauración de relaciones"
 SAU_restoration_of_relations_desc: "Años de lazos cortados dan paso, cauteloso, a las embajadas reabiertas. Gestione la peligrosa distensión con la República Islámica sin renunciar a los intereses del Reino."
 SAU_the_house_that_rules_the_kingdom: "La Casa que rige el Reino"
 SAU_the_house_that_rules_the_kingdom_desc: "La dinastía Al Saud ha gobernado Arabia central durante generaciones. Desde el derrame del rey Fahd en 1995, §Y poder efectivo§! ha pasado a príncipes mayores compitiendo para controlar la sucesión."
 SAU_sanction_the_southern_bloc: "Sanción del Bloc Sur"
 SAU_sanction_the_southern_bloc_desc: "Ahogar las finanzas de las facciones alineadas por Irán en toda la región. Sanciones y listas negras mueren de hambre a los amigos de Teherán del dinero que les mantiene leales."
 SAU_saddam_falls: "Saddam cae"
 SAU_saddam_falls_desc: "Las estatuas bajan y el régimen colapsa, dejando un vacío donde un gran estado árabe una vez se puso de pie. Riyadh debe moverse antes de que Teherán lo llene."
 SAU_saddam_endures: "Saddam Endures"
 SAU_saddam_endures_desc: "El régimen baathista sobrevive a la tormenta, herido pero no roto. El viejo enemigo permanece al otro lado de la frontera norte, y el Reino debe vivir con el tirano de Bagdad un tiempo más."
 SAU_saudi_economic_focus_tree: "Saudi Economic Enfoque Árbol"
 SAU_saudi_economic_focus_tree_desc: "El petróleo paga las facturas, los trabajadores extranjeros hacen gran parte del trabajo, y el capital saudí demasiado a menudo sale del país. La siguiente economía debe hacer más en casa, emplear más saudíes y dar a las ciudades más allá de Riad una parte del crecimiento."
 SAU_national_water_company: "Compañía nacional de agua"
 SAU_national_water_company_desc: "El Reino construye su propio agua. Una empresa estatal, un mandato y oleoductos se dirigen a ciudades que nunca justificarían la inversión comercialmente.\n\n§GGrants La Compañía Nacional del Agua§! y §G una infraestructura en Najd§!, y §Yeas la crisis del agua por un paso§!.\n\nMás lento y más caro que contratarlo. Se queda saudita."
 SAU_a_saudi_spanish_partnership: "Una asociación saudí-español"
 SAU_a_saudi_spanish_partnership_desc: "Los patios españoles construyen los nuevos corbetes del Reino y las firmas españolas su tren de alta velocidad a Mecca. Cultivar Madrid como un socio europeo útil fuera del círculo habitual."
 SAU_sermons_from_the_ministry: "Sermones del Ministerio"
 SAU_sermons_from_the_ministry_desc: "El Ministerio revisará el viernes khutba distribuido a mezquitas en todo el Reino. Un texto común leído a partir de aproximadamente quince mil púlpitos dará al gobierno influencia directa sobre la mensajería religiosa."
 SAU_recognize_the_shia_clergy: "Reconocer el clérigo chiíta"
 SAU_recognize_the_shia_clergy_desc: "Conceda al funcionario §YShia ulema§! que está junto con el establecimiento Wahhabi.\n\n§G+Estabilidad, + población de Shia§!."
 SAU_crackdown_on_shia_dissent: "Averiguar el disentimiento de Shia"
 SAU_crackdown_on_shia_dissent_desc: "Responder disentimiento con el §YMabahith§! y el §Y Guardia Nacional§!. Los chiítas serán observados, contenidos y empujados a los márgenes - y la mayoría sunita descansará más fácil para ello.\n\n§R+Resistencia de Shia§!, §R-Población de Shia§!, §G+Estabilidad, +Apoyo a la guerra§!."
 SAU_sunni_shia_dialogue: "Diálogo Sunni-Shia"
 SAU_sunni_shia_dialogue_desc: "Un diálogo nacional para comenzar a sanar catorce siglos de cisma.\n\n§G-Resistencia de Shia, +Estabilidad, + Población de Shia§!."
 SAU_invest_in_the_eastern_province: "Invertir en la Provincia Oriental"
 SAU_invest_in_the_eastern_province_desc: "Vierte petrodólares en el corazón de Shia - carreteras, hospitales, puertos.\n\n§G+Estabilidad, + población shia§!."
 SAU_resettling_the_eastern_province: "Reasentar la provincia oriental"
 SAU_resettling_the_eastern_province_desc: "La pregunta de Shia se resuelve por fin. §YProvincia Oriental§! se calla a través del reasentamiento de pacientes para una generación.\n\n§R- Población de Shia§!, §Gresistencia rota§!, §G++Estabilidad§!."
 SAU_economic_inclusion: "Inclusión económica"
 SAU_economic_inclusion_desc: "Comparte la riqueza de los campos petrolíferos con las personas que viven por encima de ellos. La herida sectaria finalmente comienza a cerrar.\n\n§GLa resistencia terminó, +Estabilidad, + población de Shia§!."
 SAU_equal_educational_access: "Igualdad de acceso a la educación"
 SAU_equal_educational_access_desc: "Construye escuelas y universidades en §YQatif§! y §YAl-Ahsa§! para que coincidan con las del Najd.\n\n§G+Estabilidad, + población de Shia§!."
 SAU_embrace_shia_citizens: "Abrazar a los ciudadanos chiítas"
 SAU_embrace_shia_citizens_desc: "Bienvenida a los chiítas como ciudadanos plenos - y comenzar un viaje que podría terminar con la §YCasa de Saud§! en sí mismo reconsiderando la fe que se construyó para suprimir.\n\n§G+Población de Shia, -Resistencia de Hiya§!."
 SAU_sectarian_harmony: "Armonía sectaria"
 SAU_sectarian_harmony_desc: "Sunni y Shia, una nación bajo una corona.\n\n§GLa resistencia terminó, +Estabilidad, + población de Shia§!."
 SAU_integrate_the_communities: "Integrar las Comunidades"
 SAU_integrate_the_communities_desc: "Abran el ejército, la policía y la burocracia a los ciudadanos chiítas que juran lealtad a la corona.\n\n§G-Resistencia de Shia, +Estabilidad, + Población de Shia§!."
 SAU_the_shia_question: "La pregunta de Shia"
 SAU_the_shia_question_desc: "Alrededor de dos millones §YShia§! ciudadanos viven en la producción petrolera §Y Provincia Este§!. La §YCasa de Saud§! debe elegir entre la represión, el alojamiento o un cambio fundamental en su política religiosa."
 SAU_rehabilitate_the_detainees: "Rehabilitar a los Detenidos"
 SAU_rehabilitate_the_detainees_desc: "Liberar a los presos políticos de la Provincia Oriental y traerlos de vuelta a la sociedad saudita.\n\n§G-Resistencia de Shia, +Estabilidad§!."
 SAU_shia_political_representation: "Shia Representación Política"
 SAU_shia_political_representation_desc: "Asientos en el §YShura Council§! para los chiítas de la provincia oriental.\n\n§G-Resistencia de Hija, + Estabilidad, + Población de Hiya§!."
 SAU_security_clampdown: "Seguridad Clampdown"
 SAU_security_clampdown_desc: "Inundar la Provincia Oriental con puestos de control, informantes y fuerzas de reacción rápida.\n\n§R+Resistencia de los Estados§!, §R-Población de los Estados §!, §G+Apoyo a la guerra§!."
 SAU_sectarian_settlement: "Asentamientos sectarios"
 SAU_sectarian_settlement_desc: "El Reino ha resuelto la cuestión chiíta a través de la represión, el alojamiento o la conversión y ahora puede consolidar la política resultante.\n\n§G+Estabilidad, +Poder político§!."
 SAU_the_house_of_saud_embraces_shiaism: "La Casa de los Abrazos del Shiaism"
 SAU_the_house_of_saud_embraces_shiaism_desc: "Lo impensable: la §Y Familia Real§! adopta formalmente §Y Doce Shiaism§!. Centuries de la ortodoxia Wahhabi son revocados por un solo decreto. La §Y Provincia Este§! se alegra; el §YNajd§! y el §Yulema§! carrete.\n\n§G++Población Shia§!, §G La resistencia terminó§!, §Raprobó la fe chiíta§!, §R-Estabilidad§! (por ahora)."
 SAU_sunni_supremacy: "Sunni Supremacy"
 SAU_sunni_supremacy_desc: "Enshrine Sunni primacía en la ley, las escuelas y la mezquita. Hay una fe verdadera en el Reino, y no es suya.\n\n§R- Población de Shia§!, §G+Estabilidad, +Apoyo de lana§!."
 SAU_suppress_the_clerics: "Suprimir a los clérigos"
 SAU_suppress_the_clerics_desc: "Silencio los predicadores de la marca de fuego de §YQatif§! y §YAwamiyah§! antes de que sus sermones se conviertan en consignas.\n\n§R+Resistencia de Shia§!, §R-Población de Shia§!."
 SAU_sunni_shia_tolerance: "Tolerancia Sunni-Shia"
 SAU_sunni_shia_tolerance_desc: "Ni perseguidos ni convertidos - simplemente coexisten. Apacigua las restricciones, deja que los chiítas adoran en paz, y deja que el Reino respire.\n\n§G-Resistencia de Shia, +Estabilidad, + Población de Shia§! (sin cambio de fe)."
 SAU_stir_the_axis_of_resistance: "Stir el eje de la resistencia"
 SAU_stir_the_axis_of_resistance_desc: "La fuerza de Irán es una cadena de proxies del Líbano al Yemen, y cada enlace tiene sus descontentos. Finan las protestas y fracturas que convierten a los aliados de Teherán en pasivos."
 SAU_foreign_volunteers_for_the_rebels: "Voluntarios extranjeros para los rebeldes"
 SAU_foreign_volunteers_for_the_rebels_desc: "El dinero solo no ganará la guerra. Abran los oleoductos que llevan a combatientes y material a través de las fronteras a las líneas frontales de la oposición."
 SAU_direct_intervention_in_yemen: "Intervención directa en Yemen"
 SAU_direct_intervention_in_yemen_desc: "Envíen al ejército saudí. Una campaña directa promete una decisión más rápida y una victoria más clara, y arriesga un quagmire que sangra al Reino durante años."
 SAU_a_proxy_war_in_yemen: "Una guerra indirecta en Yemen"
 SAU_a_proxy_war_in_yemen_desc: "Luchar contra la guerra a través de otros. Banca el gobierno exiliado, las milicias del sur y las tribus, y deja que los yemeníes hagan la muerte mientras los jets sauditas observan desde arriba."
 SAU_supreme_military_council: "Consejo Militar Supremo"
 SAU_supreme_military_council_desc: "El consejo militar provisional recibirá un estatuto permanente y normas oficiales de afiliación. Rank determinará la membresía, mientras que el mando durante el golpe seguirá formando influencia dentro del Consejo."
 SAU_the_amman_bailout: "El Salto de Ammán"
 SAU_the_amman_bailout_desc: "El Reino Hachemita es un frágil búfer contra el caos hacia su norte, y está roto. Mantenga a Jordan solvente y leal con el chequebook del Reino."
 SAU_the_battle_for_the_straits: "La batalla por los estrechos"
 SAU_the_battle_for_the_straits_desc: "Quien manda el Estrecho de Hormuz ordena una quinta parte del aceite del mundo. Prepare el Reino y sus aliados para romper el control de Irán en la vía fluvial más importante del mundo."
 SAU_the_islamic_rivalry: "La caballería islámica"
 SAU_the_islamic_rivalry_desc: "Irán promueve su modelo revolucionario y apoya a los grupos armados del Líbano al Yemen. Arabia Saudita impugnará el liderazgo iraní a través de los medios de comunicación, asociados regionales y preparativos para un posible conflicto en el Golfo."
 SAU_the_levant_strategy: "La estrategia Levant"
 SAU_the_levant_strategy_desc: "Siria quema y Jordan teeters, y más allá de ellos se encuentra el camino hacia el Mediterráneo. Dar forma a la ventaja de Levant a Arabia antes que Irán y sus amigos lo hagan primero."
 SAU_the_new_order_over_the_kingdom: "El Nuevo Orden sobre el Reino"
 SAU_the_new_order_over_the_kingdom_desc: "El gobierno de emergencia se ha convertido en un orden político permanente. Las renovaciones reiteradas de la autoridad militar han eliminado toda distinción práctica entre las medidas temporales y las normas normales."
 SAU_the_silk_road_pivot: "La Ruta de la Seda Pivot"
 SAU_the_silk_road_pivot_desc: "China es el mayor comprador de crudo saudí y no condiciona la cooperación económica a la reforma política nacional. La Iniciativa Franja y la Ruta ofrece puertos, ferrocarriles y capital, pero la relación sigue siendo principalmente transaccional."
 SAU_the_silk_web_network: "La red Silk Web"
 SAU_the_silk_web_network_desc: "La información es un arma, y el Reino tiene la intención de manejarla. Teje una web de medios, clérigos y voces en línea que lleve el mensaje de Riyadh a través de la región."
 SAU_the_american_shield: "El escudo americano"
 SAU_the_american_shield_desc: "Atar la defensa del Reino irreversiblemente a los Estados Unidos: basar, inteligencia y la garantía sin palabras de que un ataque contra Riyadh es un ataque a los intereses de Washington. El precio depende de un solo patrón."
 SAU_the_succession_question: "La cuestión de la sucesión"
 SAU_the_succession_question_desc: "Miles de príncipes conservan estatus y potenciales reivindicaciones bajo el viejo orden. El gobierno debe decidir si la pensión, el exilio, el enjuiciamiento o marginación política."
 SAU_the_spirit_of_taif: "El Espíritu de Taif"
 SAU_the_spirit_of_taif_desc: "El Acuerdo de Taif fraguado saudí una vez terminó la guerra civil del Líbano y dio al Reino una mano en Beirut. Revive ese papel y reclame Líbano desde la órbita de Irán."
 SAU_the_yemen_quagmire: "El Yemen Quagmire"
 SAU_the_yemen_quagmire_desc: "La guerra en Yemen ha sido costosa, pero también ha llevado a Irán a una trampa, expuesta como el patrón de los misiles Houthi que caen sobre Riyadh. Convertir la cuadrícula en un arma de diplomacia."
 SAU_the_yemeni_peace_talks: "Las conversaciones de paz yemeníes"
 SAU_the_yemeni_peace_talks_desc: "Cada guerra termina en una mesa. Traiga a las facciones yemeníes condiciones que dejan la frontera sur del Reino segura."
 SAU_defeat_in_syria: "Derrota en Siria"
 SAU_defeat_in_syria_desc: "El régimen perdura, impulsado por jets rusos y milicias iraníes. El Reino debe reducir sus pérdidas y salvar la influencia que puede de una guerra que no podría ganar."
 SAU_total_victory_in_the_civil_war: "Victoria total en la guerra civil"
 SAU_total_victory_in_the_civil_war_desc: "Crush the Houthis outright and restore a single government wholly heen to Riyadh. Yemen se convierte en un protectorado saudí en todo menos nombre."
 SAU_victory_in_syria: "Victoria en Siria"
 SAU_victory_in_syria_desc: "Damasco cae, y con él el puente terrestre de Irán hacia Hezbolá. Un gobierno amistoso en Siria abre el Levant a la influencia saudí y el Mediterráneo a los oleoductos saudíes."
 SAU_a_partnership_with_britain: "Una asociación con Gran Bretaña"
 SAU_a_partnership_with_britain_desc: "Desde los contratos de Al-Yamamah hasta la formación de oficiales saudíes, Londres ha sido un amigo más tranquilo pero más constante que la mayoría. Establecer una asociación estratégica con el Reino Unido."
 SAU_benign_dominance: "Predominio benigno"
 SAU_benign_dominance_desc: "Riyadh conduce con un §Gmás ligero toque§!: inversión, patrocinio y respeto por la dignidad de los emiratos más pequeños. Hegemonía sin humillación."
 SAU_command_and_control: "Command & Control"
 SAU_command_and_control_desc: "Un centro de mando conjunto, defensa aérea integrada e inteligencia compartida le dará a la península Escudo una estructura operacional unificada."
 SAU_common_market: "Mercado Común"
 SAU_common_market_desc: "Un marco regulatorio único: un conjunto de normas, un documento aduanero, un mercado regional de §Y50 millones de consumidores§!."
 SAU_cross_border_transit_systems: "Sistemas de tránsito cruzados"
 SAU_cross_border_transit_systems_desc: "Carreteras, ferrocarriles y oleoductos tejen la península juntos. El §YGCC Railway§! - largo discutido, nunca construido - finalmente rompe terreno."
 SAU_economic_union: "Unión Económica"
 SAU_economic_union_desc: "Unificado §YZona aduanera§!, regulaciones armonizadas y las bases de un §Ymercado común§! los comerciantes de la península §YJeddah§! y §YDubai§! han esperado una generación."
 SAU_exploit_authority: "Autoridades de explotación"
 SAU_exploit_authority_desc: "Arabia Saudita hará cumplir su hegemonía a través de §Ypresión económica§! y otras medidas coercitivas contra los Estados miembros no compatibles. La Alianza funcionará como §GSaudi-dominated bloc§!."
 SAU_the_gulf_cooperation_council: "El Consejo de Cooperación del Golfo"
 SAU_the_gulf_cooperation_council_desc: "Durante dos décadas el §YGCC§! ha funcionado principalmente como un foro para la consulta entre las monarquías del Golfo. Riyadh lo ampliará en una organización regional más eficaz."
 SAU_the_gulf_academy: "La Academia del Golfo"
 SAU_the_gulf_academy_desc: "Una academia de formación unificada de oficiales en §YRiyadh§!. Los futuros generales de cada estado del CCG compartirán un aula, una doctrina y una §Y lealtad a la Alianza§!."
 SAU_increase_autonomy: "Aumentar la autonomía"
 SAU_increase_autonomy_desc: "Más §Ypolítica exterior independiente§!. El GCC habla por sí mismo en foros internacionales - no como cliente americano, sino como un §YPotencia regional§!.\n\n§YUna de las tres carreteras para el patrono del Consejo§! - §YWashington§!, §Ynuevos asociados§!, or §YNinguno.§!. Se abren en ese orden: sólo se puede recurrir a nuevos socios una vez que los americanos tienen §Rdenegada§! tú, y sólo ve solo una vez que ambos lo hayan hecho. §RCada carretera que toma cierra los de arriba para siempre.§!"
 SAU_intra_gcc_trade: "Comercio Intra-GCC"
 SAU_intra_gcc_trade_desc: "Suelta las últimas barreras arancelarias entre los Estados miembros. Mercancías, capital y trabajo fluyen libremente de §YMuscat§! a §YKuwait City§!."
 SAU_joint_defense_agreement: "Acuerdo Conjunto de Defensa"
 SAU_joint_defense_agreement_desc: "An §YArtículo 5§!-como pacto de defensa mutua: un ataque a uno es un ataque contra todos. §YIrán§! toma nota."
 SAU_joint_research_initiatives: "Iniciativas conjuntas de investigación"
 SAU_joint_research_initiatives_desc: "A compartido §Y Fondo tecnológico§! piscinas recursos para la desalinización, energía solar y R&D petroquímica. §YKAUST§! se convierte en el centro regional."
 SAU_gcc_joint_ventures: "Empresas conjuntas del CCG"
 SAU_gcc_joint_ventures_desc: "El GCC coordinará la producción, adquisición y mantenimiento de defensa. Capital saudí, §YEmirati logistics§! y §YAstilleros de Bahhraini§! apoyarán un sistema militar-industrial compartido."
 SAU_the_khaleeji_union: "La Unión Khaleeji"
 SAU_the_khaleeji_union_desc: "Las seis monarquías formarán una confederación con autoridad compartida sobre política exterior, defensa y moneda. La Unión §YKhaleeji§! será liderada de §YRiyadh§!."
 SAU_military_union: "Unión Militar"
 SAU_military_union_desc: "La §YPeninsula Shield§! ha existido desde 1984, pero tiene una integración práctica limitada. Riyadh establecerá un comando conjunto, una contratación compartida y una doctrina común."
 SAU_new_partners: "Nuevos socios"
 SAU_new_partners_desc: "Más allá de Washington: trata con §YBeijing§!, §YMoscú§!, §YDelhi§! y §YBruselas§!. La península diversifica a sus clientes.\n\n§YUno de tres caminos para el patrono del Consejo§! - §YWashington§!, §Y nuevos socios§!, o §Y nadie en absoluto§!. Se abren en ese orden: sólo se puede recurrir a nuevos socios una vez que los americanos §R lo hayan reutilizado§!, y solo vayan solo una vez que ambos lo tengan. §RCada camino se cierran los que están por encima de ella para siempre.§!"
 SAU_political_union: "Unión Política"
 SAU_political_union_desc: "Una política exterior coordinada. Una línea diplomática compartida. Los emiratos más pequeños temen §YLa dominación saudí§! - pero Riyadh insiste en que esta es una asociación de §Y iguales entre monarcas§!."
 SAU_solidify_pro_american_alignment: "Solidificar la alineación Pro-Americana"
 SAU_solidify_pro_american_alignment_desc: "El §YGCC§! formaliza su asociación de seguridad con Washington. Bases, entrenamiento, armas, inteligencia - todo fluyendo a través de Riad.\n\n§YUno de tres caminos para el patrono del Consejo§! - §YWashington§!, §Ynuevos socios§!, o §Yninguno en absoluto§!. Se abren en ese orden: sólo se puede volver a nuevos socios una vez que los americanos §R han reutilizado§! usted, y sólo ir solo una vez que ambos lo hayan hecho. §RCada camino se cierran los que están por encima de él para siempre.§!"
 SAU_pursue_hegemony: "Persecución hegemonía"
 SAU_pursue_hegemony_desc: "Riyadh sustituirá al liderazgo informal con autoridad directa sobre las otras monarquías del CCG. Pueden oponerse, pero la presión económica y militar saudí limitará su capacidad de resistir."
 SAU_a_robust_alliance: "Una alianza robusta"
 SAU_a_robust_alliance_desc: "El §YEscudo de península§! se convertirá en una fuerza operacional de 100.000 tropas con equipo moderno y doctrina unificada."
 SAU_shared_currency: "Moneda compartida"
 SAU_shared_currency_desc: "El dinar §Ykhaleeji§! - una moneda única para el GCC, no pescó al dólar sino a una cesta. El paso económico más audaz que ha dado la península."
 SAU_the_yemeni_civil_war: "La guerra civil yemení"
 SAU_the_yemeni_civil_war_desc: "Los Houthis se han apoderado de la capital y han llevado al gobierno reconocido a exiliarse, y una posición iraní está arraigando en la puerta de Arabia. El Reino debe decidir hasta qué punto irá para revertirlo."
 SAU_sabotage_the_regimes_backers: "Sabotear a los Backers del Regime"
 SAU_sabotage_the_regimes_backers_desc: "Por cada arma que envía el Reino, Teherán y Moscú envían dos. Trabajar en las sombras para interrumpir las líneas de suministro y los próxies que probaban Damasco."
 SAU_the_national_industrial_strategy_gdp_tt: "National §YGDP§! es más de §G $1500 millones§!"
 SAU_stc_privatization_gdp_tt: "National §YGDP§! es más de §G $1500 millones§!"
 SAU_kaust_gdp_tt: "National §YGDP§! es más de §G $1600 mil millones§!"
 SAU_the_gulfs_economic_engine_gdp_tt: "National §YGDP§! es más de §G $1500 millones§!"
 SAU_the_worlds_most_valuable_company_gdp_tt: "National §YGDP§! es más de §G $1800 millones§!"
 SAU_vision_2030_gdp_tt: "National §YGDP§! es más de §G $1600 mil millones§!"
 SAU_sdaia_data_and_artificial_intelligence_gdp_tt: "Nacional §YGDP§! es más de §G $2000 mil millones§!"
 SAU_the_civil_nuclear_program_gdp_tt: "National §YGDP§! supera §G $1700 mil millones§!"
 SAU_fund_vision_2030_gdp_tt: "National §YGDP§! es más de §G $1800 millones§!"
 SAU_the_dynamic_tiering_formula: "La Fórmula de Tiering Dinámica"
 SAU_the_dynamic_tiering_formula_desc: "Una cuota que significa una cosa a una firma de nueve mil y otra a una firma de nueve no puede ser un número único. La fórmula escala el requisito con cuenta de cabeza, ingresos y sector, y lo recalcula cada trimestre.\n\nLas empresas dejan de jugar el umbral dividiéndose en dos."
 SAU_high_green_zone_incentives: "Incentivos de zona alta y verde"
 SAU_high_green_zone_incentives_desc: "Debajo del platino se sienta la banda donde la mayoría de los empleadores serios del Reino viven en realidad. Son compatibles, no son excepcionales, y hasta ahora el sistema no les dio nada por ello.\n\nProcesamiento prioritario y un calendario de auditoría más ligero, en la teoría de que premiar a los casi cumplidos es más barato que castigarlos."
 SAU_the_yellow_band_warnings: "La Banda Amarilla Advertencias"
 SAU_the_yellow_band_warnings_desc: "Una firma en amarillo se dice, por escrito y con una fecha adjunta, exactamente lo lejos que cae y lo que sucede cuando el trimestre cierra.\n\nLa mayoría lo arreglan. La advertencia cuesta al Ministerio una carta y le ahorra una congelación."
 SAU_the_secularization_of_finance_choice_tt: "§YUna elección sigue§! - 'Full Anglo-Saxon - todos los instrumentos permitidos' / 'Gradual - práctica occidental con Sharia veneer'."
 SAU_bastion_of_islamic_finance_choice_tt: "§YUna elección sigue§! - 'Strict orthodoxy - no compromiso' / 'Pragmatic - liderar el mercado financiero islámico global'."
 SAU_the_banking_control_law_choice_tt: "§YUna elección sigue§! - 'SAMA - regulador secular independiente' / 'SAMA + Consejo Sharia con veto vinculante' / 'Hybrid - dos estructuras paralelas'."
 SAU_the_interbank_lending_code_choice_tt: "§YUna opción sigue§! - 'Mercadillo interbancario convencional basado en intereses' / 'Mercado interbancario islámico basado en Murabaha' / 'Hybrid - ambos, corren por separado'."
 SAU_the_anti_speculation_directives_choice_tt: "§YUna elección sigue§! - 'Regulación de la luz - permitir derivados y futuros' / 'Prohibición estricta - no gharar, no juegos de azar' / 'De derivados regulados sólo - enfoque equilibrado'."
 SAU_fractional_reserve_mandates_choice_tt: "§YUna opción sigue§! - 'Reserva fraccional moderna - crecimiento al costo de la estabilidad' / 'Asset-backed only - estable pero más lento' / 'Requisitos de reserva moderada'."
 SAU_the_standardized_interest_law_choice_tt: "§YLa elección sigue§! - 'Permitir cuentas convencionales de interés' / 'Prohibición estricta de la riba - La Sharia es suprema' / 'Sukukuk en público, interés pragmático en privado'."
 SAU_conscript_the_kingdom_choice_tt: "§YLa elección sigue§! - 'Servicio Universal. Cada hombre de edad, sin exenciones' / 'Servicio selectivo. Las tribus guardan sus exenciones. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_emergency_tribunal_choice_tt: "§YLa elección sigue§! - 'Los príncipes. Que el país los cuide de ello« / 'Los disidentes. Los archivos ya están escritos» / 'Ambos. No tomamos el estado para ser selectivos. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_the_defense_industries_act_choice_tt: "§YUna elección sigue§! - 'Licence the designs. Necesitamos producción, no orgullo« / 'Construirlo nosotros mismos, desde el mineral hacia arriba'. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_martial_law_issues_choice_tt: "§YLa elección sigue§! - 'El aparato completo. Curfew, tribunales, censores / 'Emergency powers only. Deja las calles solas. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_the_regency_decree_choice_tt: "§YLa elección sigue§! - 'Una regencia estrecha. Él guarda el trono y las mezquitas« / 'Una regencia total. Cada potencia, sin excepción» / 'Una regencia de cinco años. Ponle una cita. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_the_succession_question_choice_tt: "§YUna elección sigue§! - 'Péndelos, generosa y permanentemente' / 'Exile las líneas mayores' / 'Proseguir, y confiscar lo que se encuentra' / 'Dejarlos ricos y ornamentales'. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_the_silk_road_pivot_choice_tt: "§YLa elección sigue§! - 'Ports, rail y el corredor norte' / 'Capital, y ninguna condición adjunta'. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_guardians_of_the_two_mosques_choice_tt: "§YLa elección sigue§! - 'Stand behind the King. Borrow the title, do not take it' / 'La tutela pertenece al estado, no el hombre'. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_secure_support_in_the_al_madinah_province_choice_tt: "§YLa elección sigue§! - 'Cortadlos. Concede lo que hay que conceder« / 'Reasignar las sillas. Necesitamos la redacción ahora. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_secure_support_in_the_mecca_province_choice_tt: "§YUna elección sigue§! - 'Pagar las casas mercantes. Compra el Hejaz correctamente« / 'Garrison it. Se ajustarán. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_appoint_loyalists_in_the_provinces_choice_tt: "§YLa elección sigue§! - 'Los príncipes mayores. Sus nombres todavía llevan el país' / 'Los primos pasados por alto. La gratitud es más barata que el prestigio' / 'Los descontentos ricos. Tráelos y auditarlos más tarde. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_disband_the_national_guard_choice_tt: "§YLa elección sigue§! - 'Absorbelos. Pueden usar nuestro uniforme' / 'Disolver la Guardia enteramente. Envíalos a casa« / 'Mantenga una trompeta, bajo nuestro mando'. Se mueve §H el control de los oficiales sobre el estado y la legitimidad de la junta§!."
 SAU_the_riyadh_meeting_operation_decisive_storm_choice_tt: "§YLa elección sigue§! - 'Entonces está acordada. Ponga la pregunta a todos ellos« / 'El Reino responderá a Yemen por sí mismo'."
 SAU_the_oil_defense_strategy_choice_tt: "§YUna elección sigue§! - 'Pump. Los campos son la estrategia« / 'Construir la industria que sobrevive los pozos' / 'Survey. Hay más de eso ahí fuera."
 SAU_women_in_the_shura_council_choice_tt: "§YUna elección sigue§! - 'Tres asientos, por decreto real' / 'La cámara permanece como es'."
 SAU_hold_municipal_elections_choice_tt: "§YUna elección sigue:§! - 'Si los asientos, y los hombres en los rollos' / 'Apunten a todos y lo llamen consulta' / 'Put las mujeres en los rollos también'."
 SAU_counter_terrorism_cooperation_choice_tt: "§YUna elección sigue§! - 'Tomar la oferta de Washington en su totalidad' / 'Los Mabahith se encargarán de sí mismos' / 'Rehabilitarlos. Las prisiones sólo hacen más."
