 SAU_pipeline_transit_SYR_t1: "Tráfico saudí de oleoductos (tierra I)"
 SAU_pipeline_transit_SYR_t1_desc: "El petróleo saudí cruza Siria, y las tarifas de tránsito hinchan el tesoro. El oleoducto eleva la construcción y estabilidad de la nación. §GIngresos adicionales: $1.00B§!"
