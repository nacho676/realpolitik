 protests_main_text: "La siguiente cuadrícula muestra lo que los ciudadanos esperan de usted y lo que actualmente financia. Los espacios en rojo indican que las protestas se están desviando; cerrarlos es la forma más directa de reducir las tensiones.[fuel_protests_TT]\n"
 OPEN_PROTESTS_BUTTON: "Pantalla Open §YProtest System§!"
 OPEN_PROTESTS_BUTTON_TT: "Abra el panel §YProtests System§!. Revisar las fuentes mensuales de deriva, la corriente Fuerza de protesta y la radicalización, y los niveles de gasto que esperan los ciudadanos."
 PROTEST_TITLE: "§YSistema de protestas§!"
 CLOSE_PROTEST_SCREEN: "Cerrar §YProtests System§! Screen"
 expected_law_mechanic_tt: "§YLeyendo la red de gastos§!\n"
 EL_green_square_explanation_tt: "§GGreen§!: §g gasto previsto que el público está recibiendo. Cada plaza verde es una razón menos para que los ciudadanos protesten.§!"
 EL_blue_square_explanation_tt: "§BBlue§!: §g Pasando por encima de lo que los ciudadanos esperan actualmente. Coste el dinero cada mes, pero no compra ningún alivio de protesta adicional.§!"
 EL_red_square_explanation_tt: "§RRed§!: §g gasto previsto que estamos §Rfalificando§! para proveer. Cada cuadrado rojo alimenta la línea §YEfecto inminente§! en el desglose de deriva arriba.§!"
 EL_white_square_explanation_tt: "Blanco: §gLos niveles de ley que no son esperados ni financiados. Idle hasta que las expectativas ciudadanas suban lo suficientemente alto para exigirlas.§!"
 expected_social_spending_tt: "Los ciudadanos esperan un nivel de §YGasto social§! establecido por sus leyes, espíritus nacionales, tecnología y PIB per cápita. Cada número entero es un nivel, cubierto por las leyes disponibles en esta categoría.\n\n§YNivel previsto:§! §Y[expected_social_spending_law_name]§! (actualmente) [?expected_welfare_spending|0Y])\n\n§YDesglose§!\nLeyes, espíritus, tecnología: [?ROOT.modifier@expected_welfare_modifier]\nPIB per cápita: [calculate_gdp_c_modifier_welfare_spending]\n"
 expected_health_spending_tt: "Los ciudadanos esperan un nivel de §YGasto en salud§! establecido por sus leyes, espíritus nacionales, tecnología y PIB per cápita. Cada número entero es un nivel, cubierto por las leyes disponibles en esta categoría.\n\n§YNivel previsto:§! §Y[expected_healthcare_spending_law_name]§! (actualmente) [?expected_health_spending|0Y])\n\n§YDesglose§!\nLeyes, espíritus, tecnología: [?ROOT.modifier@expected_healthcare_modifier]\nPIB per cápita: [calculate_gdp_c_modifier_healthcare_spending]\n"
 expected_adm_spending_tt: "Los ciudadanos esperan un nivel de §YGasto administrativo§! establecido por sus leyes, espíritus nacionales, tecnología y PIB per cápita. Cada número entero es un nivel, cubierto por las leyes disponibles en esta categoría.\n\n§YNivel previsto:§! §Y[expected_bureau_spending_law_name]§! (actualmente) [?expected_adm_spending|0Y])\n\n§YDesglose§!\nLeyes, espíritus, tecnología: [?ROOT.modifier@expected_adm_modifier]\nPIB per cápita: [calculate_gdp_c_modifier_adm_spending]\n"
 expected_edu_spending_tt: "Los ciudadanos esperan un nivel de §YGasto en educación§! establecido por sus leyes, espíritus nacionales, tecnología y PIB per cápita. Cada número entero es un nivel, cubierto por las leyes disponibles en esta categoría.\n\n§YNivel previsto:§! §Y[expected_education_spending_law_name]§! (actualmente) [?expected_edu_spending|0Y])\n\n§YDesglose§!\nLeyes, espíritus, tecnología: [?ROOT.modifier@expected_education_modifier]\nPIB per cápita: [calculate_gdp_c_modifier_education_spending]\n"
 expected_police_spending_tt: "Los ciudadanos esperan un nivel de §YGastos de policía§! establecido por sus leyes, espíritus nacionales, tecnología y PIB per cápita. Cada número entero es un nivel, cubierto por las leyes disponibles en esta categoría.\n\n§YNivel previsto:§! §Y[expected_police_spending_law_name]§! (actualmente) [?expected_police_spending|0Y])\n\n§YDesglose§!\nLeyes, espíritus, tecnología: [?ROOT.modifier@expected_police_modifier]\nPIB per cápita: [calculate_gdp_c_modifier_police_spending]\n"
 expected_defence_spending_tt: "Los ciudadanos esperan un nivel de §YGasto militar§! establecido por sus leyes, espíritus nacionales, tecnología y PIB per cápita. Cada número entero es un nivel, cubierto por las leyes disponibles en esta categoría.\n\n§YNivel previsto:§! §Y[expected_mil_spending_law_name]§! (actualmente) [?expected_military_sp|0Y])\n\n§YDesglose§!\nLeyes, espíritus, tecnología: [?ROOT.modifier@expected_mil_modifier]\nPIB per cápita: [calculate_gdp_c_modifier_military_spending]\n"
 MD_protests_state_calm_text: "§GCalm§!: ninguna misión de disturbios activa."
 MD_protests_state_calm_tt: "Ninguna misión de advertencia o revuelta está activa. Este panel permanece visible mientras que §YFuerza de protesta§! es superior a 20. Actúa sobre el aumento de la deriva antes de que se inicie una crisis."
 MD_protests_state_warning_text: "§YAdvertencia§!: movimiento de protesta que forma."
 MD_protests_state_warning_tt: "La misión §YIncoming Protests§! está activa. Si se da cuenta, el descontento comienza en un estado central no capital elegible. Resolverlo mediante la estabilización de la economía y las condiciones políticas que desencadenaron la advertencia, o utilizar §YAplausos Protesters§! y §Y Reforma preventiva§! para comprar tiempo y menor fuerza."
 MD_protests_state_revolt_text: "§RRevolt§!: resistencia en los estados centrales."
 MD_protests_state_revolt_tt: "La misión §YIncoming Revolt§! está activa. Las nuevas regiones no capitalistas pueden unirse cada mes, con una posibilidad igual a la actual §YFuerza de protesta§! menos §YExhausción de protesta§!, capped at §Y75%§!. El agotamiento aumenta por §G5§! puntos cada mes activo. Los estados afectados son claros en §Y50% Cumplimiento§! y debajo §Y40% Resistencia§!. Mantener Fuerza de protesta en §G0§! por §Y60 días§! termina la revuelta. Si la misión principal expira primero con fuerza por encima de 0, la guerra civil toma entre §Y10%§! y §Y50%§! del país sobre la base de estados no resueltos y Radicalización."
 MD_protests_state_cooldown_text: "§BCooldown§!: recuperación de la crisis."
 MD_protests_state_cooldown_tt: "Período de recuperación después de una crisis de protesta. Ninguna nueva misión de protesta puede disparar durante §Y1000§! días. Utilice la sala de respiración para reequilibrar el gasto y reconstruir la estabilidad antes de que la presión comience a subir de nuevo."
 MD_drift_diagnosed_text: "[MD_top_resistant_state_display]"
 MD_top_resistant_state_active: "§YEstado peor:§! [event_target:MD_top_resistant_state_scope.GetName] (§R [?MD_top_resistant_state_value|0]%§!)"
 MD_top_resistant_state_none: "§YEstado peor:§! §GNone§!"
 MD_drift_diagnosed_tt: "El estado central no resuelto con el más alto §YResistencia§!. Use las decisiones de revuelta y una guarnición suficiente para empujarla abajo §Y40% Resistencia§! al elevar Cumplimiento a §Y50%§!.\n\nMuestra §Gnone§! cuando cada estado afectado es pacificado."
 MD_drift_header_text: "§Y Fuentes de deriva mes§! (última garrapata)"
 MD_drift_spending_tt: "Los ciudadanos esperan una línea de base del bienestar, la salud, la educación, la policía, el gasto administrativo y militar. El gasto empuja la fuerza de protesta hacia arriba; el exceso de gasto enfria las tensiones pero drena el tesoro. §R+1§! se añade cuando el combustible se agota.\n\nAumente las leyes marcadas rojas en la rejilla de gastos a continuación para cerrar las mayores brechas. §YApease Protesters§! y §YReforma preventiva§! puede comprar tiempo mientras reequilibra."
 MD_drift_stability_tt: "Estabilidad ha caído más abajo §Y20%§! y el gobierno todavía tiene elecciones, por lo que los votantes están tomando las calles.\n\nPase los focos y eventos que otorgan estabilidad, y detenga costosas construcciones militares que lo arrastran. §YPromise: Tax Relief for Citizens§! añade un §G+5%§! factor de estabilidad durante 300 días, lo que hace cada otra estabilidad ganar tierra más rápido. Un gobierno no elegido elimina a este conductor de forma directa si su camino político permite el cambio."
 MD_drift_interest_tt: "La tasa de banco central es superior a §Y8.9%§!. Los préstamos cuestan más, las empresas dejan al personal, y el público culpa al gobierno.\n\nBajar la tasa de la pestaña §Y Dinero§!. Cualquier cosa debajo §G8.9%§! elimina este conductor. Cuanto más por encima del umbral se encuentra la tasa, mayor será el golpe mensual. Mantener las caminatas cortas y utilizarlas sólo contra la inflación."
 MD_drift_recession_tt: "La economía está en recesión. Cada mes añade un éxito aleatorio alrededor de §R+3§! Fuerza de protesta.\n\nEliminar la idea de §Yrecesión§! a través del sistema económico elimina completamente a este conductor. Vea el panel de economía para los eventos de recuperación, y apoyarse en §YAplausos Protesters§! y §Y Reforma preventiva§! para salir del peor de él."
 MD_drift_depression_tt: "La economía está en depresión, la recesión es peor hermano. Cada mes añade un éxito aleatorio alrededor de §R+4§! Fuerza de protesta, aproximadamente un tercio peor que la recesión.\n\nEliminar la idea de §Ydepresión§! a través del sistema económico elimina este conductor. §YPromise: Tax Relief§! and §YPromise: Jobs Program§! cut protest pressure if you can deliver the targets, while §YAppease Protesters§! and §YPreemptive Reform§! buy time."
 MD_drift_war_tt: "Hemos estado en guerra durante más de §Y36§! meses y la población está agotada. Cada 24 meses adicionales de guerra añade otro §R+1§! al mes. Una guerra de cuatro años golpea §R+2§!, una guerra de seis años golpea §R+3§!, sin meseta.\n\nTerminar la guerra deja caer a este conductor a cero inmediatamente. Si ya han comenzado las revueltas, §YHearts and Minds Campaign§! crece el cumplimiento mientras terminas la guerra."
 MD_drift_corruption_tt: "La fuerza de la coalición gubernamental está por debajo §Y30%§! mientras que una idea de corrupción es activa o se suspenden las elecciones. Cuanto más débil sea la coalición, mayor será el éxito. A §Y10%§! la fuerza de coalición cuesta §R+0.2§! por mes, a §Y20%§! cuesta §R+0.1§!.\n\nReducir la idea de corrupción a través de los focos y eventos anticorrupción. Construir el apoyo de la coalición a través de pactos subideológicos. Restaurar las elecciones elimina a este conductor de manera directa. §YPromise: Tax Relief§! paga §G+3%§! fuerza de coalición sobre el éxito, útil una vez que la estabilidad está subiendo."
 MD_drift_ct_tt: "El monitoreo de Internet o los arrestos de protesta son activos. La represión agrega un éxito mensual aleatorio alrededor de §R+5§! Fuerza de protesta, el más duro de las fuentes al azar.\n\nSe supone que son herramientas a corto plazo. Eliminar la idea de TC una vez que la misión activa se aclara, o el sangrado continúa indefinidamente. Durante una crisis activa, emparejando TC con §YPromise: Emergency Police Funding§! apila la reducción de resistencia-crecimiento."
 MD_drift_passive_tt: "La atención pública se desvía. Cada mes hay una posibilidad §Y50%§! de §G-2§! Fuerza de protesta por sí sola, promediando alrededor §G-12§! por año gratis.\n\nTiempo de compra con §YAplausos Protesters§! y §Y Reforma preventiva§! permite que el enfriamiento pasivo haga la mayor parte del trabajo."
 MD_drift_total_text: "§YNet el mes pasado:§!"
 MD_protests_strength_readout_text: "§YFuerza:§! §Y[?protest_strength|0]§!§Y / 100 · Radicalización:§! §Y[?protest_radicalisation|0]§!§Y / 10§!"
 MD_protests_strength_readout_tt: "Dos calibres conducen el ciclo de vida de protesta.\n\n§YFuerza de protesta§! (actualmente [?protest_strength|0] / 100) rastrea cuán cerca está el país de crisis. Arriba §Y50§!, la misión de Advertencia puede disparar. Durante una revuelta activa, Strength controla sólo la posibilidad de que se difundan los disturbios. Mantenerla en §G0§! por §Y60 días§! termina la revuelta.\n\nLa fuerza aumenta mensualmente de las fuentes de deriva mostradas anteriormente. Cae a través de la refrigeración pasiva, §Y Reforma preventiva§! y misiones prometedoras exitosas.\n\n§YProtest Radicalisation§! (actualmente [?protest_radicalisation|0] / 10) tiene un §Y20%§! la posibilidad mensual de subir mientras que Strength es al menos 50 o una misión de protesta está activa. De lo contrario tiene una §Y10%§! posibilidad de caer. La radicalización superior aumenta el tamaño de la guerra civil de una revuelta fracasada."
 MD_drift_total_tt: "La suma de todas las fuentes de deriva activas más enfriamiento pasivo. Significado positivo Fuerza de protesta está subiendo; significa negativo que está cayendo.\n\nPara voltear el negativo neto, diríjase al conductor más grande mostrado arriba. §YReforma preventiva§! y §YProtestadores de Apnease §! compran tiempo mientras que la estructura fija la tierra.\n\n3 §YPromise§! Las decisiones se comprometen a una meta de 200 a 350 días. El éxito y la misión Revolt consigue más tiempo; el fracaso y la promesa rota añade una pequeña penalización. §YPromise: Emergency Police Funding§! se ejecuta 200 días y le pide que deje caer Fuerza de protesta por §G10§!, pagando §G+75§! días en la misión Revolt. §YPromise: Tax Relief§! corre 300 días y le pide que aumente Estabilidad por §G5%§!, pagando §G+100§! días. §YPromise: Jobs Program§! corre 350 días y le pide que abandone el desempleo en §G1.5%§!, pagando §G+120§! días."
 MD_protests_revolt_states_text: "§RLos estados del país siguen resistiendo:§!"
 MD_protests_revolt_states_tt: "La misión §YIncoming Revolt§! se completa cuando llega a §G0§!. Los estados no capitalistas afectados se aclaran automáticamente en §Y50% Cumplimiento§! y debajo §Y40% de resistencia§!. Los estados del capital no pueden unirse a la revuelta."
