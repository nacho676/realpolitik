 centralnato.1.d: "Kazajstán se ha vuelto mucho más occidental alineado en los últimos años. Muchos de nuestros ministros y diplomáticos han propuesto invitar a Kazajstán a unirse a la OTAN. ¿Deberíamos hacerlo?"
 centralnato.1.a: "Invitémoslos!"
