 UZB_migration_central_asia_5_desc: "Comenzaremos a invitar activamente a Uzbeks en el extranjero a regresar a Uzbekistán. A través del programa de retorno emigrante y creando condiciones atractivas para el regreso, podremos reducir la migración y fortalecer nuestros vínculos culturales con la diáspora."
