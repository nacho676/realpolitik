 Karakalpaks_rebelled_yes: "Karakalpakistán se ha rebelado"
 TRK_ruhnama: "Ruhnama"
 TRK_ruhnama_desc: "Bajo la dirección del gran líder Turkmenbashi, Ruhnama es el libro del alma de nuestra nación, un oasis en el desierto y un faro en la noche oscura. Encarna la sabiduría y la gloria del pueblo turcomano durante tres mil años. Desde el vasto imperio de Oguz Khan hasta el país neutral de hoy, ¡siempre hemos sido los guardianes de la libertad y la dignidad!"
 UZB_modify_karakalpakstan_opinion_effect_tt: "Cambio §HLa Opinión§! de Karakalpakstan por §H [?temp_change]§! (Current Opinion: [?UZB.UZB_karakalpakstans_opinion|0])\n"
 UZB_modify_uzbeks_opinion_effect_tt: "Cambia §HUzbek§! Opinión de §H[?temp_change]§! (Opinión actual: [?UZB.UZB_uzbeks_opinion|0])\n"