 CES_oligarchic_drift: "Complacer a los Oligarcas"
 CES_oligarchic_drift_desc: "Agradar a los oligarcas por ahora es una buena opción para iniciar nuestra diplomacia extranjera."
 CES_populistic_sentiment: "Sentimiento Populista"
 CES_populistic_sentiment_desc: "Podemos gastar algo de dinero para aplacar al público."
 CES_common_soviet_legacy: "Legado Común Soviético"
 CES_common_soviet_legacy_desc: "El legado soviético común une a todos los países post-soviéticos y más allá. Usaremos esto para nuestros esfuerzos diplomáticos."
 CES_cis_ties: "Vínculos con la CEI"
 CES_cis_ties_desc: "Los países de la CEI son los más cercanos a nosotros debido al camino histórico compartido que tomamos juntos."
 CES_us_ties: "Vínculos con EE. UU."
 CES_us_ties_desc: "La colaboración con USAID puede darnos acceso a asistencia técnica, experiencia y recursos para abordar desafíos clave como la lucha contra la pobreza, el fortalecimiento de la salud y la educación."
 CES_diplo_startup: "Inicio Diplomático"
 CES_diplo_startup_desc: "Nuestra diplomacia ahora debe iniciar compromisos más activos con otros países."
