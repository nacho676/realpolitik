 UZB_migration_central_asia_4_desc: "Esta decisión está dirigida a preservar y fortalecer la identidad uzbeka entre los uzbekos que viven en el extranjero. Al organizar programas culturales, actividades educativas y apoyar a las comunidades uzbekas en el extranjero, Uzbekistán tiene como objetivo reducir la emigración y mantener los lazos con los compatriotas."
