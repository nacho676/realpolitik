 centralnato.2.d: "Uzbekistán se ha vuelto mucho más occidental alineado en los últimos años. Muchos de nuestros ministros y diplomáticos han propuesto invitar a Uzbekistán a unirse a la OTAN. ¿Deberíamos hacerlo?"
