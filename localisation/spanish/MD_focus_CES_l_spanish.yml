 CES_idea_diplomatic_powerhouse: "Pragmatismo Diplomático"
 CES_idea_eacu_cooperation: "Cooperación de la UCTE"
 CES_idea_eacu_cooperation_desc: "La Unión Aduanera Eurasiana (originalmente la Comunidad Económica de Eurasia) promueve vínculos económicos entre la mayoría de los estados post-soviéticos. El sindicato impone un arancel externo común a todas las mercancías que entran en el sindicato y actúa como una entidad singular al concluir acuerdos comerciales y negociaciones."
 CES_idea_eacu_cooperation_2: "Cooperación Integrada de la UCTE"
 CES_idea_eacu_cooperation_2_desc: "La Unión Aduanera Eurasiana (originalmente la Comunidad Económica de Eurasia) promueve vínculos económicos entre la mayoría de los estados post-soviéticos. El sindicato impone un arancel externo común a todas las mercancías que entran en el sindicato y actúa como una entidad singular al concluir acuerdos comerciales y negociaciones."
 centralkaz.3516.t: "Formación del Consejo Turco"
 centralkaz.3516.d: "¿Deberíamos unirnos?"
 centralkaz.3516.a: "Sí"
