 drugs.1.t: "Los resultados de la búsqueda de traficantes de drogas"
 drugs.1.d: "Recientemente terminamos una búsqueda de los mayores narcotraficantes en nuestro país. ¡Los encontramos! Ahora el tráfico de drogas no es tan fuerte como solía ser."
 drugs.1.a: "Muy bien"
 drugs.2.t: "Los resultados de la búsqueda de traficantes de drogas"
 drugs.2.d: "Recientemente hemos completado una búsqueda de los mayores narcotraficantes en nuestro país. Lamentablemente, no pudimos encontrarlos. Puede que valga la pena intentarlo de nuevo."
 drugs.2.a: "Triste"
 drugs.3.t: "Los resultados de la búsqueda de traficantes de drogas"
 drugs.3.d: "Recientemente hemos completado una búsqueda de los mayores narcotraficantes en nuestro país. Lamentablemente, no pudimos encontrarlos. Puede que valga la pena intentarlo de nuevo."
 drugs.3.a: "Triste"
 drugs.4.t: "Juicio a los traficantes de drogas"
 drugs.4.d: "Encontramos a los traficantes de drogas y los llevamos a juicio. No habrá más narcotráfico a través de nuestro país. ¡Estamos libres de contrabandistas!"
 drugs.4.a: "Muy bien"
 ces_post_soviet_legacy_idea: "Legado postsoviético"
 ces_post_soviet_legacy_idea_desc: "Uno de los aspectos clave del legado post-soviético es la transición de una economía centralizada a las relaciones comerciales. Este período fue acompañado por la inestabilidad económica, la inflación y la redistribución de la riqueza, lo que afectó los medios de subsistencia y el consumo."
 ces_neutral_idea: "Neutralidad uzbeka"
 ces_neutral_idea_desc: "La neutralidad uzbeka encarna el deseo de paz y no agresión de Uzbekistán. Es un compromiso de no involucrarse en conflictos internacionales y no permitir que su territorio sea utilizado para acciones militares. Este principio contribuye a la estabilidad en la región y fortalece el papel de Uzbekistán como mediador en la resolución de disputas internacionales."
 CES_our_state_kaz: "Nuestro [ROOT.GetName]"
 CES_our_state_kaz_desc: "Hoy es el comienzo del viaje del país en el nuevo milenio."
 CES_newly_reestab_militar: "El ejército de [ROOT.GetName]"
 CES_newly_reestab_militar_desc: "El ejército de [ROOT.GetName] necesita reformas."
 CES_assemble_generals: "Reunir a los Generales"
 CES_assemble_generals_desc: "Este es un paso importante en nuestro viaje estratégico. En nuestra búsqueda del éxito y la prosperidad, necesitamos reunir a todos los verdaderos generales, expertos y líderes de nuestro Ejército para discutir y desarrollar un plan de desarrollo sólido."
 CES_improve_borderline_guards: "Mejorar la Guardia Fronteriza"
 CES_improve_borderline_guards_desc: "Fortalecer la seguridad fronteriza es un paso estratégico importante para garantizar la seguridad y estabilidad nacional."
 CES_establish_the_doctrine: "Reforma educativa"
 CES_establish_the_doctrine_desc: "La preservación de la seguridad nacional y la efectividad del ejército requieren una educación de calidad en el ejército."
 CES_broken_economy_idea_1: "Sistema económico altamente arruinado"
 CES_broken_economy_idea_1_desc: "El legado del sistema de economía planificada soviética dejó a [FROM.GetName] en una posición difícil después del colapso de la URSS. La infraestructura económica estaba gestionada centralmente, lo que hacía que la transición a una economía de mercado fuera un proceso más difícil y doloroso. La pérdida de muchas regiones de recursos y la dependencia de los suministros de energía también afectaron la economía de [FROM.GetName]. La República perdió el acceso a algunos recursos naturales que estaban controlados por la URSS. Esto llevó a la inestabilidad en la economía y a la escasez de ingresos."
 CES_broken_economy_idea_2: "Sistema económico moderadamente arruinado"
 CES_broken_economy_idea_2_desc: "El legado del sistema de economía planificada soviética dejó a [FROM.GetName] en una posición difícil después del colapso de la URSS. La infraestructura económica estaba gestionada centralmente, lo que hacía que la transición a una economía de mercado fuera un proceso más difícil y doloroso. La pérdida de muchas regiones de recursos y la dependencia de los suministros de energía también afectaron la economía de [FROM.GetName]. La República perdió el acceso a algunos recursos naturales que estaban controlados por la URSS. Esto llevó a la inestabilidad en la economía y a la escasez de ingresos."
 CES_broken_economy_idea_3: "Sistema económico ligeramente arruinado"
 CES_broken_economy_idea_3_desc: "El legado del sistema de economía planificada soviética dejó a [FROM.GetName] en una posición difícil después del colapso de la URSS. La infraestructura económica estaba gestionada centralmente, lo que hacía que la transición a una economía de mercado fuera un proceso más difícil y doloroso. La pérdida de muchas regiones de recursos y la dependencia de los suministros de energía también afectaron la economía de [FROM.GetName]. La República perdió el acceso a algunos recursos naturales que estaban controlados por la URSS. Esto llevó a la inestabilidad en la economía y a la escasez de ingresos."
 CES_outdated_army_idea: "Caos en el ejército"
 CES_outdated_army_idea_desc: "El colapso de la URSS llevó a nuestro país a un nuevo entorno geopolítico, lo que creó incertidumbre en las relaciones con las antiguas repúblicas soviéticas y los estados recién independizados. Esto complicó la gestión de las fuerzas armadas y requirió una revisión de la estrategia y estructura del ejército."
 CES_outdated_army_idea_1: "Control militar desorganizado"
 CES_outdated_army_idea_1_desc: "El colapso de la URSS llevó a nuestro país a un nuevo entorno geopolítico, lo que creó incertidumbre en las relaciones con las antiguas repúblicas soviéticas y los estados recién independizados. Esto complicó la gestión de las fuerzas armadas y requirió una revisión de la estrategia y estructura del ejército."
 CES_outdated_army_idea_2: "Control militar corrupto"
 CES_outdated_army_idea_2_desc: "El colapso de la URSS llevó a nuestro país a un nuevo entorno geopolítico, lo que creó incertidumbre en las relaciones con las antiguas repúblicas soviéticas y los estados recién independizados. Esto complicó la gestión de las fuerzas armadas y requirió una revisión de la estrategia y estructura del ejército."
 CES_outdated_army_idea_3: "Control militar ineficaz"
 CES_outdated_army_idea_3_desc: "El colapso de la URSS llevó a nuestro país a un nuevo entorno geopolítico, lo que creó incertidumbre en las relaciones con las antiguas repúblicas soviéticas y los estados recién independizados. Esto complicó la gestión de las fuerzas armadas y requirió una revisión de la estrategia y estructura del ejército."
 CES_army_modernization: "Modernización del Ejército"
 CES_army_modernization_desc: "La modernización de nuestro ejército es una clave importante para la formación de nuestras fuerzas armadas."
 CES_modern_warfare: "Guerra Moderna"
 CES_modern_warfare_desc: "Es necesario adaptar nuestro ejército a las realidades modernas para poder repeler eficazmente cualquier amenaza externa."
 CES_create_territorial_defence: "Establecer Defensa Territorial"
 CES_create_territorial_defence_desc: "La creación de una defensa territorial es un aspecto importante de la formación de nuestra capacidad de defensa."
 CES_airforce_trainings: "Capacitación de la Fuerza Aérea"
 CES_airforce_trainings_desc: "Los programas de capacitación de la Fuerza Aérea son vitales para garantizar la preparación y profesionalidad del personal de aviación. Estos programas abarcan una serie de actividades, incluyendo simulaciones de vuelo, desarrollo de habilidades técnicas y colaboraciones internacionales. Son esenciales para mejorar las capacidades de defensa del país y salvaguardar su espacio aéreo, contribuyendo a la seguridad nacional y la estabilidad regional en Asia Central."
 CES_new_air_doctrine: "Nueva Doctrina Aérea"
 CES_new_air_doctrine_desc: "Necesitamos cambiar nuestro enfoque sobre las tácticas de guerra aérea."
 CES_india_air: "Aviones Indios"
 CES_india_air_desc: "Podemos organizar un acuerdo de armas entre nosotros y la India para comprar aviones nuevos y modernos para nuestra fuerza aérea."
 CES_russian_air: "Aviones Rusos"
 CES_russian_air_desc: "Podemos organizar un acuerdo de armas entre Rusia y nosotros para comprar aviones nuevos y modernos para nuestra fuerza aérea."
 CES_european_air: "Aviones Europeos"
 CES_european_air_desc: "Podemos organizar un acuerdo de armas entre nosotros y países europeos para comprar nuevos planos modernos para nuestra fuerza aérea."
 CES_china_air: "Aviones Chinos"
 CES_china_air_desc: "Podemos organizar un acuerdo de armas entre nosotros y China para comprar nuevos planos modernos para nuestra fuerza aérea."
 CES_us_air: "Aviones Americanos"
 CES_us_air_desc: "Podemos organizar un acuerdo de armas entre nosotros y los Estados Unidos para comprar aviones nuevos y modernos para nuestra fuerza aérea."
 CES_wing_loong: "Drones Chinos"
 CES_wing_loong_desc: "Podemos organizar un acuerdo de armas entre nosotros y China para comprar nuevos drones modernos para nuestra fuerza aérea."
 CES_predator_xp: "Predator XP"
 CES_predator_xp_desc: "El General Atomics MQ-1 Predator (a menudo denominado drone Predator) es una aeronave piloteada de forma remota (RPA) construida por General Atomics que fue utilizada principalmente por la Fuerza Aérea de los Estados Unidos (USAF) y la Agencia Central de Inteligencia (CIA)."
 CES_airbus_stuff: "Aviones de Transporte Airbus"
 CES_airbus_stuff_desc: "Podemos establecer contratos con Airbus para comprar aviones de transporte para las necesidades logísticas de nuestra fuerza aérea."
 CES_euro_helicopters: "Helicópteros Europeos"
 CES_euro_helicopters_desc: "La compra de los helicópteros europeos más nuevos beneficiará enormemente a nuestra fuerza aérea."
 CES_czech_jets: "Jets de Entrenamiento Checoslovacos"
 CES_czech_jets_desc: "Después de la caída del bloque oriental, muchos estados post-comunistas vendieron sus equipos retirados. Es posible que necesitemos comprar algo para nuestra fuerza aérea."
 CES_tai_anka: "Drones Turcos"
 CES_tai_anka_desc: "Los drones turcos han demostrado ser muy eficaces en los conflictos recientes. Es posible que tengamos que comprar algo."
 CES_bell_uh: "BELL-UH"
 CES_bell_uh_desc: "El Bell UH-1 Iroquois es un helicóptero militar utilitario diseñado y producido por la compañía aeroespacial estadounidense Bell Helicopter. Es el primer miembro de la prolífica familia Huey, así como el primer helicóptero con motor a turbina en servicio con el ejército de los Estados Unidos."
 CES_infantr_guns: "Reforma de la Infantería"
 CES_infantr_guns_desc: "La reforma de nuestra infantería es necesaria para aumentar la coordinación y la unidad de nuestras tropas."
 CES_us_guns: "Rifles estadounidenses"
 CES_us_guns_desc: "Los rifles AR pueden no ser tan fiables como los AK, pero se han demostrado como armas muy modulares y precisas. Tenemos que adquirirlos."
 CES_us_equip: "Equipo de nivel de la OTAN"
 CES_us_equip_desc: "El equipo de nivel de la OTAN es el mejor del mundo!"
 CES_rus_equip: "Equipo ruso"
 CES_rus_equip_desc: "El equipo ruso es el mejor del mundo!"
 CES_russian_guns: "Rifles AK"
 CES_russian_guns_desc: "Los rifles AK pueden no ser tan modulares como AR, pero se han demostrado como armas muy robustas y fiables. Tenemos que adquirirlos."
 CES_chinese_guns: "Rifles chinos"
 CES_chinese_guns_desc: "El QBZ-95 es una plataforma de armas prometedora que ha atraído el interés de nuestro Ministerio de Defensa. Es posible que necesitemos adquirirlos."
 CES_chinese_equip: "Nuevas alternativas chinas"
 CES_chinese_equip_desc: "El nuevo equipo chino es el mejor del mundo!"
 CES_us_art: "Artillería estadounidense"
 CES_us_art_desc: "La adquisición de artillería estadounidense por nuestro país representa un movimiento estratégico para mejorar sus capacidades de defensa. Esta adquisición implica la compra de sistemas avanzados de artillería desde Estados Unidos, fortaleciendo nuestra preparación militar. Tales adquisiciones son parte integrante de la estrategia nacional de seguridad del país, promoviendo la modernización de la defensa y potenciando su capacidad para responder eficazmente a los desafíos de seguridad regional."
 CES_rus_art: "Artillería rusa"
 CES_rus_art_desc: "La adquisición de artillería rusa por parte de nuestro país representa un movimiento estratégico para mejorar sus capacidades de defensa. Esta adquisición implica la compra de sistemas de artillería avanzados de Rusia, fortaleciendo nuestra preparación militar. Tales adquisiciones son fundamentales para la estrategia de seguridad nacional del país, promoviendo la modernización de la defensa y reforzando su capacidad para responder a los desafíos de seguridad regional de manera efectiva."
 CES_chinese_art: "Artillería china"
 CES_chinese_art_desc: "La adquisición de artillería china por parte de nuestro país representa un movimiento estratégico para mejorar sus capacidades de defensa. Esta adquisición implica la compra de sistemas de artillería avanzados de China, fortaleciendo nuestra preparación militar. Tales adquisiciones son fundamentales para la estrategia de seguridad nacional del país, promoviendo la modernización de la defensa y reforzando su capacidad para responder a los desafíos de seguridad regional de manera efectiva."
 CES_buying_tanks: "Tanques de [ROOT.GetName]"
 CES_buying_tanks_desc: "[ROOT.GetName] Las necesidades de tanque deben ser evaluadas e investigadas."
 CES_chinese_tanks: "Tanques chinos"
 CES_chinese_tanks_desc: "La adquisición de tanques chinos por parte de [ROOT.GetName] refleja su compromiso con la modernización de sus fuerzas armadas. Estas compras implican la adquisición de sistemas avanzados de tanques de China para reforzar las capacidades militares del país. Esta inversión estratégica mejora la preparación defensiva de [ROOT.GetName] y subraya su dedicación a mantener un ejército robusto y bien equipado para abordar las necesidades de seguridad regional."
 CES_russian_tanks: "Tanques rusos"
 CES_russian_tanks_desc: "La adquisición de tanques rusos por parte de [ROOT.GetName] refleja su compromiso con la modernización de sus fuerzas armadas. Estas compras implican la adquisición de sistemas avanzados de tanques de Rusia para reforzar las capacidades militares del país. Esta inversión estratégica mejora la preparación defensiva de [ROOT.GetName] y subraya su dedicación a mantener un ejército robusto y bien equipado para abordar las necesidades de seguridad regional."
 CES_american_tanks: "Tanques estadounidenses"
 CES_american_tanks_desc: "[ROOT.GetName] La adquisición de tanques estadounidenses refleja su compromiso con la modernización de sus fuerzas armadas. Estas compras implican la adquisición de sistemas avanzados de tanques desde Estados Unidos para reforzar las capacidades militares del país. Esta inversión estratégica mejora la disponibilidad de defensa de [ROOT.GetName] y subraya su dedicación a mantener un ejército robusto y bien equipado para atender las necesidades de seguridad regional."
 CES_urainian_btr: "Ukrainian BTRs"
 CES_urainian_btr_desc: "[ROOT.GetName] La decisión de comprar vehículos del BTR ucraniano (portero de personal blindado) indica un movimiento estratégico para mejorar sus capacidades militares. Esta adquisición implica la adquisición de estos vehículos blindados versátiles de Ucrania para fortalecer las fuerzas armadas de [ROOT.GetName]. Estos BTR desempeñarán un papel crucial en la estrategia de defensa del país, ayudando en la movilidad, el transporte de tropas y la seguridad fronteriza, contribuyendo finalmente a la seguridad nacional y la estabilidad regional."
 CES_rus_bars: "BARS rusos"
 CES_rus_bars_desc: "[ROOT.GetName] La decisión de comprar vehículos rusos BARS indica un movimiento estratégico para mejorar sus capacidades militares. Esta adquisición implica la adquisición de estos vehículos blindados versátiles de Rusia para fortalecer las fuerzas armadas de [ROOT.GetName]. Estos vehículos desempeñarán un papel crucial en la estrategia de defensa del país, ayudando en la movilidad, el transporte de tropas y la seguridad fronteriza, contribuyendo finalmente a la seguridad nacional y la estabilidad regional."
 CES_polaris: "Polaris"
 CES_polaris_desc: "Los vehículos gubernamentales y de defensa Polaris ofrecen un rendimiento y una fiabilidad que se ajustan a las demandas de nuestra organización, sin importar cuál sea la necesidad."
 CES_navy: "La Armada de [ROOT.GetName]"
 CES_navy_desc: "La Armada de [ROOT.GetName] necesita reforma."
 CES_navy_dockyard: "Nuestros astilleros"
 CES_navy_dockyard_desc: "Deben construirse nuevos muelles para que nuestros barcos sean construidos y almacenados."
 CES_navy_corvette: "Corbetas"
 CES_navy_corvette_desc: "Un corbeta es un pequeño buque de guerra. Es tradicionalmente la clase más pequeña de embarcación considerada como una nave de guerra adecuada. La clase de naves de guerra sobre la corbeta es la de la fragata, mientras que la clase de abajo fue históricamente la del bucle de la guerra."
 CES_navy_frigates: "Fragatas"
 CES_navy_frigates_desc: "Una fragata es un tipo de buque de guerra. En diferentes épocas, los roles y las capacidades de los barcos clasificados como fragatas han variado algo. El nombre de fragata en los siglos XVII y XVIII se daba a cualquier barco de vela completo construido para la velocidad y la maniobrabilidad, destinado a ser utilizado en roles de exploración, escolta y patrullaje."
 CES_navy_doctrine: "Reforma doctrinal"
 CES_navy_doctrine_desc: "Nuestra doctrina naval necesita renovación."
 CES_western_start: "El camino democrático"
 CES_western_start_desc: "Es hora de que nuestro país emprenda el camino del gobierno democrático."
 CES_western_reform_govern: "Reforma gubernamental"
 CES_western_reform_govern_desc: "Nuestro gobierno necesita una reforma urgente."
 CES_western_decentr: "Descentralización"
 CES_western_decentr_desc: "Es hora de dar a las regiones más derechos."
 CES_western_defend_people_rights: "Derechos Humanos y Libertades"
 CES_western_defend_people_rights_desc: "Nuestro Estado respetará en lo sucesivo los derechos y libertades de todos los ciudadanos."
 CES_western_anti_corruption: "Lucha contra la corrupción"
 CES_western_anti_corruption_desc: "Los funcionarios corruptos serán castigados!"
 CES_western_prave_rabochich: "Derechos de los trabajadores"
 CES_western_prave_rabochich_desc: "Nuestros trabajadores deben estar protegidos por garantías sociales."
 CES_western_freedom_smi: "Libertad de expresión"
 CES_western_freedom_smi_desc: "La libertad de expresión es uno de los principios básicos de nuestro estado."
 CES_western_welfare: "Inversiones en salud"
 CES_western_welfare_desc: "Nuestra gente debe estar sana."
 CES_western_mothers_posobia: "Beneficios por maternidad"
 CES_western_mothers_posobia_desc: "Asignaremos tanto dinero como sea posible para las prestaciones por maternidad."
 CES_western_economic_rost: "El crecimiento de nuestra economía"
 CES_western_economic_rost_desc: "Nuestra política competente ha dado lugar al crecimiento económico."
 CES_western_infrastructure: "Inversiones en infraestructura"
 CES_western_infrastructure_desc: "La infraestructura de nuestro país debe ser desarrollada y modernizada."
 CES_western_education_reform: "Reforma educativa"
 CES_western_education_reform_desc: "Invertimos fuertemente en la reforma educativa."
 CES_western_science_reform: "Inversiones científicas"
 CES_western_science_reform_desc: "Invertiremos en nuestra ciencia, porque es el futuro de nuestro país!"
 CES_western_sport: "Promoción de los deportes"
 CES_western_sport_desc: "Nación saludable! - Nación fuerte!"
 CES_western_ciphrovisation: "Digitalización global"
 CES_western_ciphrovisation_desc: "La digitalización fortalecerá el crecimiento de nuestra economía."
 CES_western_resource: "Fuentes de energía alternativa"
 CES_western_resource_desc: "Desarrollaremos fuentes de energía alternativas."
 CES_western_liberal_heaven: "Vitrina liberal de Asia Central"
 CES_western_liberal_heaven_desc: "Somos un ejemplo de construir un estado liberal en Asia Central."
 CES_liberals_modifier: "Democracia en Asia Central"
 CES_liberals_modifier_desc: "El sistema democrático es, en principio, único para la región del Asia central. Representa un intento agudo y rápido de ponerse al día con las democracias occidentales en todos los cargos."
 CES_economic_affairs: "Asuntos Económicos"
 CES_economic_affairs_desc: "A principios de los 2000, comenzó un periodo transformador para los países de Asia Central mientras navegaban por el complejo panorama del desarrollo económico y la transición."
 CES_debt_reafctoring: "Reestructuración de la deuda"
 CES_debt_reafctoring_desc: "Reestructurar nuestra deuda nos permitirá más libertad en el gasto público."
 CES_exploit_natural_resources: "Explotación de Recursos Naturales"
 CES_exploit_natural_resources_desc: "Asia Central, una región conocida por sus diversos paisajes y abundantes recursos naturales, ha sido un punto focal para la explotación de recursos a lo largo de la historia."
 CES_uranium_extraction: "Extracción de Uranio"
 CES_uranium_extraction_desc: "La extracción de uranio en Asia Central involucra la minería, el procesamiento y la exportación de este elemento radiactivo, contribuyendo a la generación de energía y las tecnologías nucleares en todo el mundo. Este recurso tiene una significancia económica para la región y ha llevado a la cooperación y regulación internacional en la gestión de los recursos de uranio."
 CES_support_gold_mining: "Apoyo a la Minería de Oro"
 CES_support_gold_mining_desc: "Asia Central es conocida por sus ricos depósitos de oro, y la extracción de este metal precioso juega un papel clave en la economía de la región. Países como Kazajistán, Kirguistán y Uzbekistán son actores principales en la industria minera de oro."
 CES_keep_it_governmental: "Mantenerlo Gubernamental"
 CES_keep_it_governmental_desc: "Debemos mantener nuestras industrias mineras de propiedad estatal, ya que asegura nuestra autonomía."
 CES_metal_extraction: "Extracción de Metales"
 CES_metal_extraction_desc: "Asia Central es un centro para la extracción de varios metales, incluyendo cobre, plata y elementos de tierra raros. Las extensas reservas minerales de la región han estimulado una industria minera vibrante."
 CES_increase_privatisation: "Aumentar la Privatización"
 CES_increase_privatisation_desc: "Nos beneficiaremos más de la privatización, pero nos hará más vulnerables a la influencia extranjera."
 CES_enlarge_the_mines: "Ampliar las Minas"
 CES_enlarge_the_mines_desc: "Ampliar nuestras minas es necesario para cultivar la industria minera."
 CES_natural_gas: "Gas Natural"
 CES_natural_gas_desc: "La extracción de gas en Asia Central implica la perforación, procesamiento y transporte de gas natural para satisfacer la demanda energética tanto nacional como internacional. Los recursos de gas de la región tienen una importante relevancia económica, fomentando tanto la cooperación regional como el comercio energético global."
 CES_oil_extraction: "Extracción de Petróleo"
 CES_oil_extraction_desc: "Asia Central es el hogar de importantes reservas petroleras, siendo Kazajistán un importante jugador en la industria de extracción de petróleo de la región."
 CES_invite_exxon: "Invitar a Exxon"
 CES_invite_exxon_desc: "ExxonMobil Corporation es una corporación multinacional estadounidense de petróleo y gas y el mayor descendiente directo de Standard Oil de John D. Rockefeller."
 CES_invite_chevron: "Invitar a Chevron"
 CES_invite_chevron_desc: "Chevron Corporation es una corporación multinacional estadounidense de energía, predominantemente especializada en petróleo y gas."
 CES_invite_lukoil: "Invitar a Lukoil"
 CES_invite_lukoil_desc: "La Compañía Petrolera PJSC Lukoil es una corporación energética multinacional rusa con sede en Moscú, especializada en la extracción, producción, transporte y venta de petróleo, gas natural, productos derivados del petróleo y electricidad."
 CES_united_joint_venture: "Unión de Empresas Conjuntas"
 CES_united_joint_venture_desc: "Fusionaremos las acciones y nos beneficiaremos de ello."
 CES_trade_idea: "Expansión del Comercio"
 CES_supporting_what_has_left: "Apoyar lo que ha quedado"
 CES_supporting_what_has_left_desc: "Nuestra economía fue destrozada por la caída de la Unión Soviética. Ha llegado el momento de apoyar lo que queda."
 CES_establishing_relations_with_world_bank: "Ingresar a la OMC"
 CES_establishing_relations_with_world_bank_desc: "Entrar en la OMC es crucial para ampliar nuestra economía comercial."
 CES_establishing_relations_with_asian_bank: "Apoyo del Banco Asiático"
 CES_establishing_relations_with_asian_bank_desc: "Obtener apoyo del ADB es una buena oportunidad para ganar más beneficios."
 centrasiaev.1.t: "Negociaciones de Apoyo del Banco Asiático"
 centrasiaev.1.d: "El Banco Asiático ha aceptado nuestra propuesta de apoyo. Ahora necesitamos elegir qué necesitamos pedirles."
 centrasiaev.1.a: "Apoyo Educativo"
 centrasiaev.1.b: "Apoyo Económico"
 centrasiaev.1.c: "Apoyo Social"
 CES_national_invest_strategy: "Estrategia Nacional de Inversiones"
 CES_national_invest_strategy_desc: "La elaboración y aplicación de una estrategia nacional de inversión se está convirtiendo en parte integrante del desarrollo económico moderno."
 centrasiaev.2.t: "Kazajistán pide Inversiones"
 centrasiaev.2.d: "Están pidiendo inversiones económicas. ¿Deberíamos estar de acuerdo?"
 centrasiaev.2.a: "Por supuesto"
 centrasiaev.2.b: "Lo siento, no"
 centrasiaev.3.t: "Uzbekistán pide Inversiones"
 centrasiaev.3.d: "Están pidiendo inversiones económicas. ¿Deberíamos estar de acuerdo?"
 centrasiaev.3.a: "Por supuesto"
 centrasiaev.3.b: "Lo siento, no"
 centrasiaev.4.t: "Kirguistán pide Inversiones"
 centrasiaev.4.d: "Están pidiendo inversiones económicas. ¿Deberíamos estar de acuerdo?"
 centrasiaev.4.a: "Por supuesto"
 centrasiaev.4.b: "Lo siento, no"
 CES_special_economic_zones: "Zonas Económicas Especiales"
 CES_special_economic_zones_desc: "Asia Central reconoce la necesidad de establecer zonas económicas especiales (ZEE) para estimular el desarrollo económico. Estas zonas ofrecen incentivos como exenciones fiscales, reducción de regulaciones y procesos administrativos simplificados para atraer inversiones nacionales y extranjeras. En Asia Central, las ZEE sirven como catalizadores para diversificar las economías, fomentar la innovación y crear empleos, particularmente en sectores como la manufactura, la tecnología y el comercio. Al promover entornos favorables para los negocios, estas zonas juegan un papel fundamental en los esfuerzos de la región para atraer inversiones, mejorar la infraestructura e impulsar el crecimiento económico."
 CES_infr_investment: "Inversiones en Infraestructura"
 CES_infr_investment_desc: "Asia Central está priorizando las inversiones en infraestructura para modernizar y expandir sus redes de transporte, energía y telecomunicaciones. Estas inversiones son fundamentales para conectar los diversos países de la región y facilitar el comercio y la conectividad con las naciones vecinas."
 CES_industrial_revival: "Revitalización Industrial"
 CES_industrial_revival_desc: "Las inversiones industriales en Asia Central son factores clave para el crecimiento económico en la región. Estas inversiones están dirigidas a diversos sectores como la manufactura, la energía, la tecnología y la infraestructura. Juegan un papel fundamental en la mejora de la productividad, la creación de oportunidades de empleo y el aumento de la competitividad de la región a nivel global. Asia Central busca activamente inversiones industriales nacionales y extranjeras para aprovechar su potencial económico y promover el desarrollo regional, convirtiéndola en un foco clave tanto para gobiernos como para empresas privadas en la región."
 CES_invite_daewoo: "Invitar a Daewoo"
 CES_invite_daewoo_desc: "Daewoo, que significa literalmente «gran universo» y un portmanteau de dae, es decir grande, y el nombre dado del fundador y presidente Kim Woo-choong, también conocido como el Grupo Daewoo, fue un gran chaebol surcoreano (tipo de conglomerado) y fabricante de automóviles."
 CES_invite_toyota: "Invitar a Toyota"
 CES_invite_toyota_desc: "Toyota Motor Corporation es un fabricante multinacional japonés de automóviles con sede en la ciudad de Toyota, Aichi, Japón. Toyota es uno de los fabricantes de automóviles más grandes del mundo, produciendo alrededor de 10 millones de vehículos al año."
 CES_invite_avtovas: "Invitar a AVTOVAZ"
 CES_invite_avtovas_desc: "AvtoVAZ es una empresa de fabricación de automóviles de propiedad estatal rusa. Anteriormente era conocido como VAZ, un acrónimo de Volga Automotive Plant en ruso. AvtoVAZ es más conocido por su serie de vehículos Lada insignia."
 CES_fostering_productive_innovation_project: "Proyecto de Fomento de Innovaciones"
 CES_fostering_productive_innovation_project_desc: "El Proyecto de Fomento de Innovaciones en Asia Central es una iniciativa estratégica destinada a promover la innovación y el avance tecnológico en la región. A través de inversiones dirigidas en investigación, educación y emprendimiento, este proyecto busca estimular la creatividad y la innovación. Juega un papel vital en la mejora de la competitividad y la diversificación económica de los países de Asia Central, posicionándolos para un crecimiento sostenible y relevancia global en el siglo XXI."
 CES_russian_it_companies: "Empresas de TI Rusas"
 CES_russian_it_companies_desc: "Las empresas de TI rusas tienen una presencia creciente en Asia Central, contribuyendo a la transformación digital de la región. Estas empresas aportan experiencia tecnológica y soluciones innovadoras a diversos sectores, incluyendo finanzas, salud y educación. Su presencia fomenta la colaboración transfronteriza, el intercambio de conocimientos y el desarrollo económico, apoyando el camino de Asia Central hacia un futuro digital mientras se beneficia de las capacidades tecnológicas e inversiones rusas."
 CES_restructuring_the_army: "Reestructuración del Ejército"
 CES_restructuring_the_army_desc: "[ROOT.GetName] está llevando a cabo un esfuerzo integral de reestructuración del ejército para modernizar y mejorar sus capacidades defensivas. Esta iniciativa implica la actualización de equipos, la optimización del despliegue de tropas y la mejora del entrenamiento y la tecnología. Al alinear sus fuerzas armadas con los desafíos de seguridad contemporáneos, [ROOT.GetName] busca reforzar su seguridad nacional y contribuir a la estabilidad regional, posicionándose como una fuerza militar más capaz y ágil."
 CES_develop_turism: "Desarrollo del Turismo"
 CES_attract_tourists: "Atraer Turistas"
 CES_attract_tourists_desc: "Atraer Turistas"
 CES_special_gambling_regions: "Regiones Especiales de Juego"
 CES_special_gambling_regions_desc: "Nuestro Ministro de Economía ha propuesto un proyecto especial de regiones de juego para impulsar nuestra economía."
 CES_russian_it_specialists: "Especialistas rusos en informática"
 CES_russian_it_specialists_desc: "Los especialistas rusos de TI están buscando nuevos lugares para establecer sus empresas. ¡Nuestro país es el destino perfecto!"
 CES_agricultural_reneissance: "Renacimiento Agrícola"
 CES_agricultural_reneissance_desc: "Tenemos que empezar a revitalizar nuestra agricultura."
 CES_supporting_wheat_production: "Apoyo a la Producción de Shawarma"
 CES_supporting_wheat_production_desc: "Nuestro shawarma debe ser el mejor de los mejores, entre todos los países del mundo!"
 CES_foster_horse_production: "Fomentar la Producción de Caballos"
 CES_foster_horse_production_desc: "La cría de caballos es una parte integral de nuestra economía, necesitamos expandirla!"
 CES_export_of_kumis: "Exportación de Kumis"
 CES_export_of_kumis_desc: "Kumis es nuestra bebida nacional y debemos mostrar su grandeza al mundo entero!"
 CES_agricultural_subsidies: "Subsidios Agrícolas"
 CES_agricultural_subsidies_desc: "Subvencionar la agricultura de nuestro país es necesario."
 CES_farming_encoruraging: "Fomento de la Agricultura"
 CES_farming_encoruraging_desc: "Mucha de nuestra población está desempleada. Debemos demostrar que la agricultura es una manera viable de participar en la economía."
 CES_supporting_wheat_production_one: "Apoyo a la Producción de Trigo"
 CES_supporting_wheat_production_one_desc: "El trigo debe prosperar en nuestro campo, podremos exportarlo y obtener ingresos."
 CES_supporting_wheat_production_two: "Métodos Alternativos de Agricultura"
 CES_supporting_wheat_production_two_desc: "La eficiencia debe ser nuestra máxima prioridad. Cuanto más cosechamos, mejor."
 CES_farming_encouragement_one: "Fomento de la Agricultura de Calidad"
 CES_farming_encouragement_one_desc: "La efectividad debe ser nuestra prioridad. Debemos garantizar calidad para encontrar nuestro nicho."
 CES_cotton_production: "Producción de Algodón"
 CES_cotton_production_desc: "Nuestras tierras son tradicionalmente conocidas por la producción de algodón de calidad. Debemos cumplir con estas expectativas."
 CES_connection_with_educational_abroad: "Conexión con la Educación en el Extranjero"
 CES_connection_with_educational_abroad_desc: "Debemos establecer conexiones con institutos agrícolas para educar a nuestros agricultores."
 CES_connection_with_educational_abroad_one: "Conexión con la Educación en el Extranjero Uno"
 CES_connection_with_educational_abroad_one_desc: "Debemos establecer conexiones con institutos agrícolas para educar a nuestros agricultores."
 CES_voluonteer_labor: "Trabajo Voluntario"
 CES_voluonteer_labor_desc: "Debemos hacer... eh... voluntarios de las prisiones para trabajar en los campos. Esto traerá solo prosperidad, ¿verdad?"
 CES_keep_it_civil: "Mantenerlo Civilizado"
 CES_keep_it_civil_desc: "Solo deberíamos fomentar el trabajo civil y justo en nuestro sector agrícola."
 CES_agricultural_institutes: "Institutos agrícolas"
 CES_agricultural_institutes_desc: "Deberíamos abrir nuestras propias instituciones agrícolas y educarlas con nuestra experiencia."
 CES_agriculture_policy: "Política agrícola"
 CES_switzerland_investments_idea: "Comercio con Suiza"
 CES_new_markets: "Nuevos mercados"
 CES_new_markets_desc: "La apertura de nuevos mercados es la clave del éxito en el espacio económico mundial. Por un lado, ofrece la oportunidad de ampliar las ventas a nivel internacional y aumentar los ingresos generales del negocio. Por otra parte, el comercio con otros países ayuda a desarrollar la diversidad cultural y la comprensión entre los pueblos, lo que promueve la paz y la cooperación entre las naciones."
 CES_trade_with_china: "Comercio con China"
 CES_trade_with_china_desc: "El comercio con China se está convirtiendo en un factor decisivo en la economía mundial por su influencia, sus capacidades tecnológicas y sus recursos, y promueve el desarrollo mutuo, la innovación y la creación de relaciones económicas sostenibles."
 CES_trade_with_south_korea: "Comercio con Corea del Sur"
 CES_trade_with_south_korea_desc: "El comercio con Corea del Sur es clave para la prosperidad y la diversidad en nuestra economía global. Este importante socio comercial ofrece oportunidades únicas para ampliar nuestros horizontes y enriquecer nuestras relaciones en diversos sectores."
 CES_trade_with_north_korea: "Comercio con Corea del Norte"
 CES_trade_with_north_korea_desc: "Corea del Norte es un mercado con un enorme potencial que pocos conocen. Tiene una gran cantidad de recursos naturales, incluidos el carbón, los minerales e incluso metales potencialmente valiosos. El comercio con este país podría ser de interés para las empresas que buscan nuevos mercados y fuentes de materias primas."
 CES_trade_with_india: "Comercio con India"
 CES_trade_with_india_desc: "India representa un mercado enorme para la exportación de bienes y servicios. Con una población de más de mil millones y una clase media en crecimiento, India puede ser un socio importante para el comercio global. Exportar a India puede ayudar a expandir nuestra base de clientes y aumentar las ventas."
 CES_trade_with_turkey: "Comercio con Turquía"
 CES_trade_with_turkey_desc: "Turquía es un puente entre Europa y Asia, lo que la convierte en un socio clave para el desarrollo del comercio intercontinental. El país cuenta con una amplia infraestructura, así como puertos y corredores de transporte modernos, lo que garantiza una logística eficiente y acceso a una variedad de mercados."
 CES_trade_with_mongolia: "Comercio con Mongolia"
 CES_trade_with_mongolia_desc: "Mongolia tiene vastos recursos naturales, incluidos minerales, carbón, carne y lana. El comercio con Mongolia puede ser una fuente de materias primas asequibles y de calidad, que impactarán positivamente nuestras industrias."
 CES_trade_with_pakistan: "Comercio con Pakistán"
 CES_trade_with_pakistan_desc: "Pakistán es un país que ofrece ventajas económicas y geoestratégicas significativas, y la cooperación con él puede ser muy beneficiosa."
 CES_trade_with_russia: "Comercio con Rusia"
 CES_trade_with_russia_desc: "Rusia es un país de gran potencial y muchas ventajas, y la cooperación con él puede traer beneficios significativos."
 CES_trade_with_ukraine: "Comercio con Ucrania"
 CES_trade_with_ukraine_desc: "Ucrania es un gran mercado con más de 40 millones de personas, lo que lo convierte en un socio atractivo para expandir nuestras operaciones comerciales y aumentar las ventas."
 CES_trade_with_azerbaijan: "Comercio con Azerbaiyán"
 CES_trade_with_azerbaijan_desc: "Azerbaiyán es un actor clave en la industria energética con importantes reservas de petróleo y gas natural. La cooperación con Azerbaiyán puede proporcionar acceso a estos importantes recursos y contribuir a la diversidad de suministros de productos energéticos."
 CES_trade_with_belarus: "Comercio con Bielorrusia"
 CES_trade_with_belarus_desc: "Bielorrusia es un gran mercado con una población de muchos millones. Exportar bienes y servicios a Bielorrusia nos abre perspectivas para aumentar las ventas y expandir nuestra base de clientes."
 CES_trade_with_armenia: "Comercio con Armenia"
 CES_trade_with_armenia_desc: "Armenia es un país con una economía en desarrollo activo, y la cooperación con él puede proporcionarnos acceso a nuevos mercados y socios. Exportar bienes y servicios a Armenia nos abre nuevas perspectivas para expandir nuestro negocio y aumentar las ventas."
 CES_trade_with_georgia: "Comercio con Georgia"
 CES_trade_with_georgia_desc: "Georgia es un país con una rica herencia cultural y perspectivas de cooperación, lo que lo convierte en un socio importante para nuestra economía."
 CES_trade_with_iran: "Comercio con Irán"
 CES_trade_with_iran_desc: "Irán tiene importantes reservas de recursos energéticos, incluidos el petróleo y el gas. El comercio con Irán nos ofrece oportunidades para la seguridad energética y el acceso a recursos importantes."
 CES_trade_with_europe: "Comercio con Europa"
 CES_trade_with_europe_desc: "Europa es el hogar de algunas de las mayores economías del mundo. El comercio con países europeos nos ofrece oportunidades para ampliar nuestro negocio y aumentar las ventas."
 CES_trade_with_switzerland: "Comercio con Suiza"
 CES_trade_with_switzerland_desc: "Suiza es reconocida por su industria manufacturera, incluidos relojes, productos farmacéuticos y procesamiento de alimentos. El comercio con Suiza proporciona acceso a productos y bienes de alta calidad, lo que puede apoyar el crecimiento de nuestras operaciones comerciales."
 CES_trade_with_greece: "Comercio con Grecia"
 CES_trade_with_greece_desc: "Grecia es rica en recursos turísticos, y la cooperación con ella puede crear oportunidades para el desarrollo de la industria turística e intercambio de experiencias."
 CES_trade_with_united_kingdom: "Comercio con el Reino Unido"
 CES_trade_with_united_kingdom_desc: "El Reino Unido es un gran mercado con alto poder adquisitivo, lo que lo convierte en un socio atractivo para ampliar nuestras oportunidades de negocio y aumentar las ventas."
 CES_trade_with_france: "Comercio con Francia"
 CES_trade_with_france_desc: "Francia es un país rico en arte, cultura y una economía dinámica, lo que lo convierte en un socio atractivo para desarrollar nuestras relaciones comerciales."
 CES_trade_with_usa: "Comercio con EE.UU."
 CES_trade_with_usa_desc: "Estados Unidos es un país con gran influencia económica, una destacada innovación y tremendas perspectivas de cooperación, lo que lo convierte en un socio clave para desarrollar relaciones comerciales internacionales."
 CES_trade_with_spain: "Comercio con España"
 CES_trade_with_spain_desc: "España es un gran mercado con un alto potencial de crecimiento empresarial. La cooperación con empresas y emprendedores españoles nos abre nuevas oportunidades para expandir nuestras operaciones y aumentar las ventas."
 TRK_berli_modifier: "Politburó revivido"
 nat_coalit_tt: "§YNos uniremos con otros nacionalistas§!"
 nationalists.1.t: "Propuesta de cooperación militar"
 nationalists.1.d: "Debido a nuestros intereses geopolíticos comunes en el escenario mundial, la cuestión de la posibilidad de cooperación militar ha surgido ante nuestros gobiernos. Como creemos, esa cooperación impulsará nuestro espíritu nacional porque nos acercaremos aún más a nuestros hermanos turcos de Asia Central."
 nationalists.1.a: "Un momento histórico para nuestras naciones. El pueblo turco será aún más fuerte!"
 nationalists.1.b: "¿Asia Central? ¿Qué es eso?"
 CES_nationalist_policy: "Política Nacionalista"
 CES_kaz_modifier: "Reformas Militares y Políticas de Kazajistán"
 CES_kaz_modifier_desc: "Nuestro ejército y las agencias de seguridad estatal necesitan reformas, Kazajistán no podrá enfrentarse a sus enemigos si no se prepara para la defensa o la guerra."
 CES_kaz_reform_vs: "Reformas Globales"
 CES_kaz_reform_vs_desc: "Nuestras agencias del ejército y de seguridad necesitan reformas radicales, y las comenzaremos ahora."
 CES_kaz_ter_oborna: "Defensa Territorial"
 CES_kaz_ter_oborna_desc: "Nuestro país es vasto y necesita más protección. La defensa territorial abordará esta necesidad."
 CES_kaz_nat_gurad: "Guardia Nacional"
 CES_kaz_nat_gurad_desc: "Transformaremos las tropas internas en el Guardia Nacional para mayor eficiencia."
 CES_kaz_gos_ohrana: "Servicio de Seguridad del Estado"
 CES_kaz_gos_ohrana_desc: "Un órgano especial del Estado directamente subordinado y responsable ante el Presidente de Kazajstán, formando parte de las fuerzas nacionales de seguridad, y la aplicación de medidas de seguridad para garantizar la protección del Presidente, otras personas protegidas, y objetos dentro de la competencia establecida por la ley"
 CES_kaz_reog_kadet: "Reorganizar las Escuelas Militares"
 CES_kaz_reog_kadet_desc: "Nuestros soldados deben ser entrenados de acuerdo con las mejores normas internacionales."
 CES_kaz_defence_doctrine: "Doctrina Defensiva"
 CES_kaz_defence_doctrine_desc: "Nuestro país es pacífico, pero debe estar listo para defenderse."
 CES_kaz_sso: "Fuerzas de Operaciones Especiales"
 CES_kaz_sso_desc: "Crearemos nuestras propias Fuerzas de Operaciones Especiales."
 CES_ter_oborona_tt: "§YLa Defensa Territorial§! será creada"
 nationalists.2.t: "La cuestión de nuestro futuro"
 nationalists.2.d: "Nuestro nuevo gobierno ha puesto mucho esfuerzo en fortalecer nuestro país, y ahora nos enfrentamos a la cuestión de la futura expansión de nuestra esfera de influencia. Podemos seguir el camino de restaurar el antiguo poder de la Horda de Oro, pero también podemos seguir las ideas relativamente nuevas de unir a los pueblos turcos."
 nationalists.2.a: "La Horda de Oro fue la mejor versión de nuestro país. Recuperaremos ese poder!"
 nationalists.2.b: "Solo uniéndonos el pueblo turco se hará más fuerte!"
 mongolempire.path: "§YElegimos el camino de la Horda de Oro§!"
 turan.path: "§YHemos elegido el camino del Gran Turán§!"
 CES_new_turkic_state: "Nuevo Estado Turco"
 CES_new_turkic_state_desc: "El pueblo turco siempre ha sido la nación dominante en Asia, y en algunos casos en Europa. Debemos devolverle la gloria a nuestra nación creando un estado turco fuerte."
 CES_national_counc: "Consejo Nacional"
 CES_national_counc_desc: "Sin el apoyo de varios partidos nacionalistas militarizados y sus seguidores, no podremos sostener nuestro régimen a largo plazo."
 CES_look_hist: "Mire Históricamente"
 CES_look_hist_desc: "Algunos territorios que una vez nos pertenecían ahora están bajo el control de otros estados. Debemos recuperarlos."
 CES_revive_nomad_spirit: "Revive el Espíritu Nómada"
 CES_revive_nomad_spirit_desc: "El nómada es nuestra verdadera forma de vida. Nuestros antepasados recorrían muchas tierras, extendiendo nuestra cultura a otros territorios. Deberíamos estar orgullosos de este patrimonio."
 CES_ignite_turkic_militar: "Enciende el Militarismo Turco"
 CES_ignite_turkic_militar_desc: "Los pueblos turcos deben unirse para enfrentar amenazas externas."
 CES_promote_pan_turk: "Promover el Pan-Turquismo"
 CES_promote_pan_turk_desc: "Sólo uniendo las mentes de muchas personas turcas podemos acercarnos más al objetivo de unificar a nuestros pueblos."
 CES_establish_loyal_natgov: "Establecer un Gobierno Nacional Leal"
 CES_establish_loyal_natgov_desc: "Al instalar un liderazgo leal, no tendremos que preocuparnos por los conflictos internos."
 CES_trukism_is_our_body: "El Turquismo es nuestro Cuerpo"
 CES_trukism_is_our_body_desc: "Debemos estar orgullosos de nuestra identidad y promover la idea de unir a nuestras naciones bajo una bandera."
 CES_connect_grey_wolves: "Conectar los Lobos Grises"
 CES_connect_grey_wolves_desc: "Turquía es nuestro potencial aliado estratégico e ideológico. Debemos fortalecer nuestro compromiso para proyectar nuestra influencia con mayor fuerza."
 CES_turkic_army: "Ejército Turco"
 CES_turkic_army_desc: "Necesitamos financiar nuestro complejo militar-industrial para poder llevar a cabo con éxito nuestra política exterior."
 CES_purge_disloyals: "Purga de las Ratas"
 CES_purge_disloyals_desc: "Todavía hay muchos en nuestro país que se oponen a nuestra posición. Debemos erradicar este disenso."
 CES_anti_russian_nat_prop: "Propaganda Nacional Anti-Rusa"
 CES_anti_russian_nat_prop_desc: "Ha llegado el momento de cortar lazos con nuestro mayor enemigo. No más botas rusas pondrán un pie en nuestro suelo."
 CES_no_other_lang: "No Otros Idiomas"
 CES_no_other_lang_desc: "Rusia ha explotado durante mucho tiempo nuestras tierras y nuestro pueblo en guerras sin sentido y sangrientas lejos de casa. Ya no toleraremos su presencia en nuestro país."
 CES_embrace_traditions: "Abrazar las Tradiciones"
 CES_embrace_traditions_desc: "Necesitamos mantener nuestras tradiciones vivas para fortalecer nuestro espíritu nacional."
 CES_paramilitar_stuff: "Organizaciones Paramilitares"
 CES_paramilitar_stuff_desc: "Al mantener una mentalidad militarista en nuestra sociedad, seremos capaces de impulsar nuestra agenda con mayor éxito."
 CES_milyouth_nat: "Nacionalismo Juvenil Militar"
 CES_milyouth_nat_desc: "La juventud es parte integral de nuestro sistema. Al nutrir su espíritu de lucha desde temprana edad, podemos fortalecer las defensas de nuestro país."
 CES_nat_tengri_spir: "Espíritu Nacional Tengri"
 CES_nat_tengri_spir_desc: "Debemos restaurar la gloria del Khaganate turco para que nuestro pueblo pueda volver a ser considerado como los maestros legítimos de su tierra."
 CES_back_to_genghis_khan: "Volver a Genghis Khan"
 CES_back_to_genghis_khan_desc: "Mongolia es el punto de partida de la grandeza de nuestro país. Volveremos a estas tierras para restaurar la justicia histórica."
 CES_kipchak_chak: "Kipchak Chak"
 CES_kipchak_chak_desc: "Llevaremos a los Gagauz de vuelta a nuestro país, liberándolos de la opresión rumana."
 CES_free_uighurs: "Liberar a los Uigures"
 CES_free_uighurs_desc: "Los Uyghurs son una nación oprimida dentro de China. Nos están llamando para ayudar a liberarlos."
 CES_invade_jap: "Invadir Japón"
 CES_invade_jap_desc: "Esta vez no serán salvados por otra tormenta kamikaze."
 CES_march_to_siberia: "Marchar hacia Siberia"
 CES_march_to_siberia_desc: "¿Rusia cree que somos demasiado débiles para golpearlos desde atrás? Están muy equivocados."
 CES_those_whorej: "Esos Whorej"
 CES_those_whorej_desc: "O la gente de Asia Central se une con nosotros bajo una bandera única, o sólo habrá caos aquí. Ha llegado el momento de decidir el destino de esta región."
 CES_revive_khanate: "Revive el Khanato"
 CES_revive_khanate_desc: "El Khaganate turco se convertirá en una nación tan grande que incluso EE.UU. escuchará nuestra opinión. ¡Todo se hará con nuestro permiso!"
 CES_tribute_to_khan: "Tributo al Khan"
 CES_tribute_to_khan_desc: "Cada hombre leal a nuestro régimen estará obligado a pagar tributo a nuestro nuevo Khan."
 CES_finally_united: "Finalmente Unidos"
 CES_finally_united_desc: "Ahora que la mayoría de los países turcos están unidos bajo nuestra bandera, podemos considerar completamente a nuestra nación grande nuevamente."
 CES_cultural_unif: "Unificación Cultural"
 CES_cultural_unif_desc: "A pesar de que nuestra población es predominantemente turca, aún existen muchas culturas diferentes en nuestro país que no nos permiten unirnos completamente. Debemos encontrar una nueva idea para la unidad cultural."
 CES_turkify_finland: "Turquificar Finlandia"
 CES_turkify_finland_desc: "Finlandia es el territorio que nuestro Kaganato no alcanzó. Lo corregiremos sometiendo a los finlandeses y turquificándolos."
 CES_nat_islam_spir: "Espíritu Nacional Islámico"
 CES_nat_islam_spir_desc: "El Islam es lo que ha llevado a nuestra nación a la grandeza. Debemos restaurar esa grandeza reuniéndonos con nuestros hermanos en cultura y religión."
 CES_path_of_seljuk: "Camino de los Seljuk"
 CES_path_of_seljuk_desc: "Al subyugar el territorio de Irán, podemos asegurar una ventaja estratégica en la región."
 CES_idelural: "Idel-Ural"
 CES_idelural_desc: "Bashkiria es un territorio que nos pertenece legítimamente. Debemos recuperarlo."
 CES_ottoman_spirit: "Espíritu Otomano"
 CES_ottoman_spirit_desc: "Turquía es el vecino turco más grande y debemos reunir a nuestros pueblos para construir una sociedad más justa."
 CES_reunite_azer: "Reunirse con Azerbaiyán"
 CES_reunite_azer_desc: "Aunque Azerbaiyán es una nación turca, es bastante indisciplinada. Corregiremos eso."
 CES_crush_who_reject: "Aplastar a los que Rechazan"
 CES_crush_who_reject_desc: "Esta vez, extenderemos nuestra influencia a toda Asia Central. Todos los disidentes serán eliminados."
 CES_finish_the_deed: "La Amenaza Armenia"
 CES_finish_the_deed_desc: "En este momento, Armenia mantiene a nuestros hermanos turcos bajo su control. Los liberaremos del dominio armenio."
 CES_declare_turan: "Proclamar Turán"
 CES_declare_turan_desc: "Finalmente podremos proclamar la unificación completa de nuestro pueblo. Muchos países han reconocido nuestra superioridad, y ahora podemos tener un impacto más global en el mundo."
 CES_turkic_equality: "Igualdad Turca"
 CES_turkic_equality_desc: "Todos los residentes de nuestro país tendrán iguales derechos, independientemente de su situación económica anterior bajo el control de otros países."
 CES_raise_from_ash: "Resurgir de las Cenizas"
 CES_raise_from_ash_desc: "[FROM.GetNameDef], como estado independiente, pasó por un período histórico difícil después del colapso de la Unión Soviética. La independencia que el país obtuvo en 1991 fue un símbolo de resurgir de las cenizas de la era pasada."
 CES_raise_from_ash_idea: "Resurgir de las Cenizas"
 CES_raise_from_ash_idea_desc: "[FROM.GetNameDef], como estado independiente, pasó por un período histórico difícil después del colapso de la Unión Soviética. La independencia que el país obtuvo en 1991 fue un símbolo de resurgir de las cenizas de la era pasada."
 CES_establ_absolu_loy: "Establecer Lealtad Absoluta"
 CES_establ_absolu_loy_desc: "Este es un intento de nuestro gobernante de obtener el apoyo total de los oligarcas a sus políticas. Sin embargo, algunos de ellos han comenzado a criticar al gobierno y al liderazgo del país, lo que podría llevar a una división de fuerzas entre la élite y debilitar la autoridad del presidente en el ámbito internacional."
 CES_our_beloved_autocrat_kaz: "Fortalecer el Partido"
 CES_our_beloved_autocrat_kaz_desc: "[CES_our_beloved_autocrat_kaz_desc]"
 KAZ_our_beloved_autocrat_kaz_desc: "Como nuestro autócrata favorito, Nursultan Abishuly Nazarbayev fue capaz de transformar la economía de Kazajistán durante su largo gobierno (1989-2019). Gracias en gran parte a sus políticas y pensamiento estratégico, los países de Asia Central han ganado nueva estabilidad y prosperidad. Uno de los factores clave en el éxito del autócrata Nazarbayev fue que fue capaz de crear un aparato estatal fuerte capaz de gestionar eficazmente la economía del país. Como resultado, Kazajistán pudo lograr avances significativos en la industria y la agricultura, lo que llevó a un aumento en los ingresos nacionales y mejoró la calidad de vida de la población."
 UZB_our_beloved_autocrat_kaz_desc: "Como nuestro autócrata favorito, Islam Abduganievich Karimov pudo transformar la economía de Uzbekistán durante su largo gobierno (1991-2016). Gracias en gran parte a sus políticas y pensamiento estratégico, los países de Asia Central han ganado nueva estabilidad y prosperidad. Uno de los factores clave en el éxito del autócrata Karimov fue que pudo crear un aparato estatal fuerte capaz de gestionar eficazmente la economía del país. Como resultado, Uzbekistán pudo hacer avances significativos en la industria y la agricultura, lo que llevó a un aumento en los ingresos nacionales y a una mejora en la calidad de vida de la población."
 KYR_our_beloved_autocrat_kaz_desc: "Como nuestro autócrata favorito, Askar Akayev pudo transformar la economía de Kirguistán durante su largo gobierno (1991-2005). Gracias en gran parte a sus políticas y pensamiento estratégico, los países de Asia Central han ganado nueva estabilidad y prosperidad. Uno de los factores clave en el éxito del autócrata Akayev fue que pudo crear un aparato estatal fuerte capaz de gestionar eficazmente la economía del país. Como resultado, Kirguistán pudo hacer avances significativos en la industria y la agricultura, lo que llevó a un aumento en los ingresos nacionales y a una mejora en la calidad de vida de la población."
 CES_purge_unloyal_polit: "Purga de Políticos Desleales"
 CES_purge_unloyal_polit_desc: "Nuestro líder decide implementar reformas políticas drásticas. Estas reformas están destinadas a fortalecer nuestro poder y suprimir a las fuerzas de oposición consideradas desleales al régimen."
