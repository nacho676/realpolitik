 border_war_training_failure.1.t: "Accidente de entrenamiento"
 border_war_training_failure.1.d: "Un accidente durante los ejercicios sobre el terreno ha dejado a varios soldados heridos y planteado preguntas acerca de la seguridad operacional."
 border_war_training_failure.1.a: "Revisar el ejercicio"
 border_war_training_failure.2.t: "Accidente de armamento combinado"
 border_war_training_failure.2.d: "Una colisión durante el entrenamiento combinado de armas dañó equipo e hirió a varios soldados."
 border_war_training_failure.2.a: "Suspensión del taladro"
 border_war_tension_failure.1.t: "Repulsión de la acción fronteriza"
 border_war_tension_failure.1.d: "Las fuerzas de Rival respondieron a la última provocación con fuego preciso, costando vidas e interrumpiendo los preparativos locales."
 border_war_tension_failure.1.a: "Retrocede."
 border_war_operation_blocked.1.t: "Operación cancelada"
 border_war_operation_blocked.1.d: "La propiedad, el control, la presencia de tropas o las condiciones diplomáticas cambiaron antes de terminar los preparativos. La operación ha sido cancelada sin el progreso del gasto."
 border_war_operation_blocked.1.a: "Understood"
 border_war_outcome.1.t: "Empuje exitoso"
 border_war_outcome.1.d: "Nuestras fuerzas prevalecieron en el último enfrentamiento y ganaron impulso hacia su objetivo local."
 border_war_outcome.1.a: "Consolidación de la posición"
 border_war_outcome.2.t: "Operación Repulsada"
 border_war_outcome.2.d: "Las fuerzas de Rival repelieron el ataque y redujeron nuestro impulso alrededor del estado impugnado."
 border_war_outcome.2.a: "Reevaluar el plan"
 border_war_outcome.3.t: "Stalemate en la frontera"
 border_war_outcome.3.d: "El enfrentamiento terminó sin un resultado decisivo, costando parte de nuestro impulso local."
 border_war_outcome.3.a: "Mantenga la línea"
 pak_raj_border_claim.1.t: "Una demanda territorial"
 pak_raj_border_claim.1.d_420: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir a Azad Cachemira. La concesión transferiría el estado y baja tensión. El refusal abriría una crisis más amplia."
 pak_raj_border_claim.1.d_427: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir Jammu y Cachemira. La concesión transferiría el estado y baja tensión. El refusal abriría una crisis más amplia."
 pak_raj_border_claim.1.d_429: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir Punjab Oriental. La concesión transferiría el estado y baja tensión. El refusal abriría una crisis más amplia."
 pak_raj_border_claim.1.d_563: "[FROM.GetNameDefCap] ha utilizado repetidas victorias locales para exigir a Central Punjab. La concesión transferiría el estado y baja tensión. El refusal abriría una crisis más amplia."
 pak_raj_border_claim.1.d_573: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir Punjab del Sur. La concesión transferiría el estado y baja tensión. El refusal abriría una crisis más amplia."
 pak_raj_border_claim.1.d_426: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir a Sindh. La concesión transferiría el estado y baja tensión. El refusal abriría una crisis más amplia."
 pak_raj_border_claim.1.d_987: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir a Gujarat Occidental. La concesión transferiría el estado y baja tensión. El refusal abriría una crisis más amplia."
 pak_raj_border_claim.1.d_984: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir a West Rajasthan. La concesión transferiría el estado y baja tensión. El refusal abriría una crisis más amplia."
 pak_raj_border_claim.1.a: "Concede el estado disputado"
 pak_raj_border_claim.1.b: "Rechazar la reclamación"
 pak_raj_border_crisis.1.t: "Crisis fronteriza estalló"
 pak_raj_border_crisis.1.d: "Nuestra reivindicación territorial rechazada se ha endurecido en una crisis diplomática y militar. La movilización podría forzar concesiones, pero también reduce el camino hacia atrás."
 pak_raj_border_crisis.1.a: "Movilizar la frontera"
 pak_raj_border_crisis.1.b: "Baja silenciosamente."
 pak_raj_border_crisis.2.t: "El Rival Mobiliza"
 pak_raj_border_crisis.2.d: "Las fuerzas de Rival se están moviendo hacia la frontera. Podemos contrarrestar o buscar conversaciones antes de que la crisis se haga más difícil de contener."
 pak_raj_border_crisis.2.a: "Counter-mobilize"
 pak_raj_border_crisis.2.b: "Busquen conversaciones inmediatas"
 pak_raj_border_crisis.3.t: "Un Ultimatum Territorial"
 pak_raj_border_crisis.3.d_420: "[FROM.GetNameDefCap] demanda a Azad Cachemira y amenaza una guerra limitada si nos negamos."
 pak_raj_border_crisis.3.d_427: "[FROM.GetNameDefCap] exige Jammu y Cachemira y amenaza una guerra limitada si nos negamos."
 pak_raj_border_crisis.3.d_429: "[FROM.GetNameDefCap] exige a Eastern Punjab y amenaza una guerra limitada si nos negamos."
 pak_raj_border_crisis.3.d_563: "[FROM.GetNameDefCap] demanda a Central Punjab y amenaza una guerra limitada si nos negamos."
 pak_raj_border_crisis.3.d_573: "[FROM.GetNameDefCap] exige el sur de Punjab y amenaza una guerra limitada si nos negamos."
 pak_raj_border_crisis.3.d_426: "[FROM.GetNameDefCap] exige a Sindh y amenaza una guerra limitada si nos negamos."
 pak_raj_border_crisis.3.d_987: "[FROM.GetNameDefCap] exige a Gujarat Occidental y amenaza una guerra limitada si nos negamos."
 pak_raj_border_crisis.3.d_984: "[FROM.GetNameDefCap] demanda a West Rajasthan y amenaza una guerra limitada si nos negamos."
 pak_raj_border_crisis.3.a: "Aceptar y retirar"
 pak_raj_border_crisis.3.b: "Rechazar el ultimátum"
 pak_raj_border_crisis.4.t: "Ultimatum Rechazado"
 pak_raj_border_crisis.4.d: "El rival ha rechazado nuestra demanda. O debemos hacer cumplir la reclamación contra el estado en disputa o absorber el costo político de retroceder."
 pak_raj_border_crisis.4.a: "Forzar la cuestión"
 pak_raj_border_crisis.4.b: "Atrás."
 pak_raj_border_crisis.5.t: "Una señal nuclear"
 pak_raj_border_crisis.5.d: "Los planificadores militares proponen un cambio visible en la preparación nuclear para demostrar su resolución. La restricción reduciría las tensiones, pero podría leerse como debilidad."
 pak_raj_border_crisis.5.a: "Aumento de la disponibilidad nuclear"
 pak_raj_border_crisis.5.b: "Mantener la moderación"
 pak_raj_border_crisis.6.t: "El Rival Signals Readiness"
 pak_raj_border_crisis.6.d: "El rival ha planteado visiblemente la disponibilidad nuclear. Coincidir con la postura crearía un enfrentamiento nuclear, mientras que la moderación reduciría la tensión inmediata."
 pak_raj_border_crisis.6.a: "Responder en especie"
 pak_raj_border_crisis.6.b: "De-escalate unilaterally"
 pak_raj_border_crisis.7.t: "A Solicitud de Mediación"
 pak_raj_border_crisis.7.d: "La crisis de Indo-Pakistani amenaza la estabilidad regional. Los diplomáticos americanos pueden ofrecer un canal para una escalada negociada."
 pak_raj_border_crisis.7.a: "Oferta mediación"
 pak_raj_border_crisis.7.b: "Aléjate de eso."
 pak_raj_border_crisis.8.t: "American Mediation"
 pak_raj_border_crisis.8.d: "Los Estados Unidos se han ofrecido a negociar una escalada mutua. La aceptación terminaría con la crisis y reduciría las tensiones bilaterales."
 pak_raj_border_crisis.8.a: "Aceptar la mediación"
 pak_raj_border_crisis.8.b: "Rechazo de interferencia externa"
 pak_raj_border_crisis.9.t: "La crisis pasa"
 pak_raj_border_crisis.9.d: "La confrontación inmediata ha terminado sin una guerra abierta. Las fuerzas a lo largo de la frontera están regresando a la preparación rutinaria."
 pak_raj_border_crisis.9.a: "Acknowledged"
 pak_raj_border_crisis.10.t: "Una victoria diplomática"
 pak_raj_border_crisis.10.d: "El rival concedió el estado disputado. La confrontación ha terminado en nuestros términos."
 pak_raj_border_crisis.10.a: "Consolidar la victoria"
 pak_raj_border_crisis.11.t: "La Reclamación ha transcurrido"
 pak_raj_border_crisis.11.d: "El control del estado en disputa cambió antes de que la crisis pudiera resolverse. La demanda territorial ya no es válida."
 pak_raj_border_crisis.11.a: "Cerrar el archivo"
 raj_chi_border_crisis.2.t: "Una demanda territorial"
 raj_chi_border_crisis.2.d_475: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir a Arunachal Pradesh. La concesión transferiría el estado y calmaría la frontera, mientras que la negativa arriesga una guerra limitada."
 raj_chi_border_crisis.2.d_982: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir a Sikkim. La concesión transferiría el estado y calmaría la frontera, mientras que la negativa arriesga una guerra limitada."
 raj_chi_border_crisis.2.d_591: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir Aksai Chin. La concesión transferiría el estado y calmaría la frontera, mientras que la negativa arriesga una guerra limitada."
 raj_chi_border_crisis.2.d_993: "[FROM.GetNameDefCap] ha utilizado victorias locales repetidas para exigir a Ladakh. La concesión transferiría el estado y calmaría la frontera, mientras que la negativa arriesga una guerra limitada."
 raj_chi_border_crisis.2.a: "Concede el estado disputado"
 raj_chi_border_crisis.2.b: "Rechazar la demanda"
 raj_chi_border_crisis.3.t: "Demanda de retirada Rechazada"
 raj_chi_border_crisis.3.d: "El rival se niega a restaurar el estado en disputa. Podemos crear un objetivo de guerra limitado para ese estado o ponerse de pie."
 raj_chi_border_crisis.3.a: "Preparar una respuesta limitada"
 raj_chi_border_crisis.3.b: "¡Arriba!"
 raj_chi_border_crisis.4.t: "El Estado Contenido"
 raj_chi_border_crisis.4.d: "El rival aceptó nuestra demanda y concedió el estado disputado, terminando la confrontación sin una guerra más grande."
 raj_chi_border_crisis.4.a: "Restaurar la frontera"
 raj_chi_border_crisis.5.t: "La Reclamación ha transcurrido"
 raj_chi_border_crisis.5.d: "El control del estado en disputa cambió antes de que la confrontación pudiera resolverse. La demanda ya no es válida."
 raj_chi_border_crisis.5.a: "Cerrar el archivo"