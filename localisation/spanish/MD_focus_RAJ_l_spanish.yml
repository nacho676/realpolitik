 raj_chi_border_stage_incursion_desc: "Empujar una patrulla a través de la línea desde [From.GetName], nuestro sector fronterizo asignado. Cuesta 20 de poder de mando. Las unidades desplegadas sufren desgaste mientras dure. Aumenta la Tensión bilateral en 15 y conlleva riesgo de bajas. Retirar la patrulla antes de los quince días entrega 3 de Preparación a nuestro rival.\n\nCuando la patrulla regrese, el ejército asigna un nuevo sector fronterizo."
 raj_chi_border_shell_positions: "Bombardear posiciones fronterizas desde [From.GetName]"
 raj_chi_border_shell_positions_desc: "Bombardear las posiciones frente a [From.GetName], nuestro sector fronterizo asignado, con la artillería y la artillería de cohetes estacionadas allí. Cuesta 20 de poder de mando. Las unidades desplegadas sufren desgaste mientras dure. Aumenta la Tensión bilateral en 22, crea más tensión mundial y conlleva riesgo de represalia. Retirar las piezas antes de los quince días entrega 5 de Preparación a nuestro rival.\n\nCuando termine el bombardeo, el ejército asigna un nuevo sector fronterizo."
