 RAJ_make_threshold_higher: "Aumentar el umbral"
 RAJ_make_threshold_higher_desc: "Para lograr la integridad electoral, debemos aumentar el umbral electoral para eliminar a los aficionados y demás tontos, y dejar así lugar para gente inteligente y educada."
 RAJ_BRICS_integer: "Creación de los BRICS"
 RAJ_BRICS_integer_desc: "Es hora de que las principales potencias mundiales se unan en un solo esfuerzo para crear un mundo multipolar. La conceptualización de los BRICS propuesta en el Foro Económico de San Petersburgo debe implementarse."
 RAJ_appease_hindus_desc: "Invertir en programas de la comunidad hindú e iniciativas culturales. Sube la opinión hindú pero las comunidades musulmanas pueden verlo como favoritismo."
 RAJ_appease_sikhs_desc: "Atender los agravios de la comunidad sij y financiar programas culturales. Mejora la opinión sij, pero los hindúes pueden verlo como favoritismo."
 RAJ_appease_buddhists_desc: "Apoyar la preservación del patrimonio budista y el alcance comunitario. Plantea la opinión budista pero puede ser visto como favoritismo por los hindúes."
 RAJ_appease_christians_desc: "Financiar el desarrollo de la comunidad cristiana y atender las preocupaciones por discriminación. Sube la opinión cristiana pero los hindúes pueden verlo como favoritismo."
 RAJ_appease_muslims_desc: "Invertir en el bienestar de la comunidad musulmana y atender las preocupaciones de seguridad. Sube la opinión musulmana pero los hindúes pueden verlo como favoritismo."
 RAJ_naxalite_insurgency: "Insurgencia Naxalita Severa"
 RAJ_naxalite_insurgency_desc: "[RAJ.GetName] sufre una grave insurgencia naxalita-maoísta. El Corredor Rojo se mantiene muy activo, con importantes operaciones guerrilleras, frecuentes emboscadas a las fuerzas de seguridad y un importante control territorial por parte de los insurgentes."
 RAJ_naxalite_insurgency_severe_TT: "§RNivel de Insurgencia Grave§! - Importante presencia y operaciones guerrilleras"
 RAJ_naxalite_insurgency_1: "Alta Insurgencia Naxalita"
 RAJ_naxalite_insurgency_1_desc: "[RAJ.GetName] se enfrenta a una insurgencia naxalita muy activa. Los insurgentes mantienen una fuerte presencia en zonas rurales y atacan frecuentemente instalaciones y personal gubernamental."
 RAJ_naxalite_insurgency_high_TT: "§ONivel de Insurgencia Alto§! - Insurgencia activa con ataques frecuentes"
 RAJ_naxalite_insurgency_2: "Insurgencia Naxalita Moderada"
 RAJ_naxalite_insurgency_2_desc: "[RAJ.GetName] se enfrenta a una insurgencia naxalita moderada. Existe una presencia rebelde establecida con incidentes periódicos, pero las fuerzas de seguridad mantienen el control general."
 RAJ_naxalite_insurgency_moderate_TT: "§YNivel de Insurgencia Moderado§! - Presencia establecida con actividad periódica"
 RAJ_naxalite_insurgency_3: "Insurgencia Naxalita Débil"
 RAJ_naxalite_insurgency_3_desc: "[RAJ.GetName] tiene una presencia naxalita limitada en esta región. Se producen incidentes esporádicos, pero la infraestructura insurgente se ha visto considerablemente deteriorada."
 RAJ_naxalite_insurgency_weak_TT: "§GNivel de Insurgencia Débil§! - Presencia limitada con incidentes esporádicos"
 RAJ_naxalite_insurgency_4: "Baja Insurgencia Naxalita"
 RAJ_naxalite_insurgency_4_desc: "[RAJ.GetName] presenta mínima actividad naxalita en esta zona. La región está prácticamente despejada, con solo incidentes aislados."
 RAJ_naxalite_insurgency_low_TT: "§GNivel de Insurgencia Bajo§! - Actividad mínima, área prácticamente despejada."
 RAJ_development_boost: "Iniciativa de Desarrollo Activa"
 RAJ_development_boost_TT: "§GIniciativa de Desarrollo§! - Aumento de la velocidad de construcción gracias a los programas de desarrollo del gobierno"
 RAJ_integrated_development_initiative: "Iniciativa de Desarrollo Integral"
 RAJ_integrated_development_initiative_desc: "Implementar programas integrales de desarrollo en las zonas afectadas por los naxalitas, incluyendo infraestructura, educación y atención médica. Esto aborda las causas profundas de la insurgencia, reduciendo los agravios tribales y mejorando las condiciones locales."
 RAJ_surrender_rehabilitation_program: "Programa de Rendición y Rehabilitación"
 RAJ_surrender_rehabilitation_program_desc: "Implementar una política de rendición que ofrezca amnistía y beneficios de rehabilitación a los naxalitas que depongan las armas. Esto ha sido históricamente eficaz, con importantes rendiciones tras estos programas."
 RAJ_operation_green_hunt: "Operación Caza Verde"
 RAJ_operation_green_hunt_desc: "Lanzar una ofensiva paramilitar masiva y coordinada contra los bastiones naxalitas. Esta operación a gran escala involucra a las fuerzas paramilitares centrales, que colaboran con la policía estatal para despejar y mantener el territorio."
 RAJ_samadhan_doctrine: "Adoptar la Doctrina SAMADHAN"
 RAJ_samadhan_doctrine_desc: "Implementar la doctrina integral SAMADHAN: liderazgo inteligente, estrategia agresiva, motivación y capacitación, inteligencia procesable, KPI basados ​​en paneles de control, aprovechamiento de la tecnología, plan de acción para cada teatro y sin acceso a financiamiento."
 RAJ_naxal.10.t: "Fusión PWG-MCC Forma el CPI (Maoísta)"
 RAJ_naxal.10.d: "El Grupo de Guerra Popular y el Centro Comunista Maoísta se han fusionado para formar el Partido Comunista de la India (Maoísta). Esta unificación crea una fuerza insurgente más formidable, con cuadros, recursos y control territorial combinados en todo el Corredor Rojo."
 RAJ_naxal.10.a: "Esta es una escalada grave."
 RAJ_naxal.11.t: "Ataque Mayor Naxalita"
 RAJ_naxal.11.d: "Los insurgentes naxalitas han lanzado un ataque devastador contra las fuerzas de seguridad. Una emboscada causó la muerte de varios miembros del personal y destruyó equipo. La audacia de este ataque demuestra la continua fortaleza de la insurgencia."
 RAJ_naxal.11.a: "Debemos responder con firmeza."
 RAJ_naxal.12.t: "Rendición Masiva de Naxalitas"
 RAJ_naxal.12.d: "Tras nuestro programa de rehabilitación y la presión constante, un número significativo de cuadros naxalitas se han entregado a las autoridades. Los exinsurgentes están siendo procesados ​​para su reintegración a la sociedad."
 RAJ_naxal.12.a: "Un éxito de nuestra política."
 RAJ_naxal.13.t: "Liderazgo Naxalita Eliminado"
 RAJ_naxal.13.d: "Operaciones de inteligencia han resultado en la eliminación de un líder naxalita clave. Este golpe a la estructura de mando insurgente perturbará sus operaciones y podría desencadenar disputas internas sobre la sucesión."
 RAJ_naxal.13.a: "Una victoria significativa."
 RAJ_naxal.14.t: "Protestas por Desplazamiento de Tribus"
 RAJ_naxal.14.d: "Las comunidades tribales de las zonas afectadas por los naxalitas protestan contra el desplazamiento debido a los proyectos mineros e industriales. Los naxalitas intentan capitalizar estas quejas para reclutar nuevos cuadros y obtener apoyo popular."
 RAJ_naxal.14.a: "Ignorar las protestas."
 RAJ_naxal.14.b: "Abordar sus inquietudes."
 RAJ_naxal.15.t: "Conclusión de la Operación Caza Verde"
 RAJ_naxal.15.d: "La ofensiva paramilitar coordinada ha logrado resultados significativos. Las posiciones naxalitas en varios estados se han visto afectadas, sus líneas de suministro interrumpidas y varios bastiones desmantelados. La insurgencia se ha visto debilitada."
 RAJ_naxal.15.a: "Continúa la presión."
 RAJ_naxal.16.t: "India Libre de Naxalitas"
 RAJ_naxal.16.d: "Tras años de esfuerzo sostenido, la India ha erradicado eficazmente la insurgencia naxalita-maoísta. El Corredor Rojo ya no representa una amenaza significativa. El desarrollo ha llegado a las zonas tribales y se ha rehabilitado a antiguos insurgentes. Esto marca un logro histórico en materia de seguridad interna."
 RAJ_naxal.16.a: "Comienza una nueva era."
 RAJ_operation_green_hunt_active: "Operación Caza Verde Activa"
 RAJ_operation_green_hunt_active_desc: "Se está llevando a cabo una masiva ofensiva paramilitar coordinada contra los bastiones naxalitas. Las fuerzas de seguridad están despejando y controlando el territorio a lo largo del Corredor Rojo."
 RAJ_samadhan_doctrine_idea: "Doctrina SAMADHAN"
 RAJ_samadhan_doctrine_idea_desc: "Se ha adoptado una estrategia integral de contrainsurgencia que combina liderazgo inteligente, operaciones agresivas, inteligencia procesable y aprovechamiento de la tecnología."
 RAJ_naxal_free_india: "India Libre de Naxalitas"
 RAJ_naxal_free_india_desc: "La India ha eliminado con éxito la insurgencia naxalita-maoísta. El Corredor Rojo ha sido asegurado y el desarrollo ha llegado a las zonas tribales previamente afectadas."
 RAJ_salwa_judum_active: "Salwa Judum Activo"
 RAJ_salwa_judum_active_desc: "El controvertido programa de milicias civiles Salwa Judum (Marcha por la Paz o Caza de la Purificación) opera activamente en Chhattisgarh. Si bien es eficaz en la represión de los maoístas, ha suscitado críticas por violaciones de derechos humanos."
 RAJ_counter_insurgency_operations: "Operaciones de Contrainsurgencia"
 RAJ_counter_insurgency_operations_desc: "Lanzar una campaña integral de contrainsurgencia contra los bastiones naxalitas en el Corredor Rojo. Esto implicará operaciones militares coordinadas, recopilación de inteligencia y estrategias de dominación de la zona."
 RAJ_reduce_naxalite_level_tt: "Reduce el nivel de insurgencia naxalita en 1 en este estado"
 RAJ_naxal.17.t: "Emboscada en Dantewada"
 RAJ_naxal.17.d: "El 6 de abril de 2010, naxalitas tendieron una emboscada a una compañía de efectivos de la CRPF en el distrito de Dantewada, en Chhattisgarh. El ataque causó la muerte de 76 agentes de seguridad, convirtiéndolo en uno de los ataques más mortíferos en la historia de la insurgencia. Los maoístas utilizaron artefactos explosivos improvisados ​​(IED) y armas automáticas en un asalto bien coordinado que duró varias horas."
 RAJ_naxal.17.a: "Esta es una tragedia nacional."
 RAJ_naxal.18.t: "Ataque en Sukma"
 RAJ_naxal.18.d: "El 24 de abril de 2017, los naxalitas lanzaron una emboscada devastadora contra personal de la CRPF en el distrito de Sukma, Chhattisgarh. 25 agentes de seguridad murieron en el ataque. Los maoístas siguen demostrando su capacidad de ataque a pesar de años de operaciones de contrainsurgencia."
 RAJ_naxal.18.a: "Nosotros no seremos disuadidos"
 RAJ_salwa_judum: "Iniciar Salwa Judum"
 RAJ_salwa_judum_desc: "Salwa Judum (Marcha por la Paz o Caza de la Purificación) es una controvertida milicia antinaxalita apoyada por el gobierno estatal de Chhattisgarh. Si bien es eficaz en la lucha contra la insurgencia, ha enfrentado duras críticas por violaciones de derechos humanos y finalmente fue declarada inconstitucional por el Tribunal Supremo en 2011."
 RAJ_road_connectivity_program: "Conectividad Vial en el Corredor Rojo"
 RAJ_road_connectivity_program_desc: "Mejorar la infraestructura vial en las zonas afectadas por los naxalitas. Una mejor conectividad reduce la influencia maoísta al llevar los servicios gubernamentales a zonas tribales remotas y dificultar la operación de los insurgentes."
 RAJ_MAO_rebellion_desc: "La grave insurgencia naxalita y el creciente apoyo comunista han envalentonado a células maoístas para organizar manifestaciones masivas contra el gobierno. Si no se frena su influencia, seguirá una rebelión armada."
 RAJ_bolywood_idea_desc: "La industria cinematográfica de la India, centrada en Mumbai, es la más grande del mundo por salida. Su alcance cultural se extiende a través de Asia meridional, Oriente Medio y la diáspora india global, sirviendo como un poderoso vehículo para proyección de energía blanda."
 RAJ_settle_gujarat_unrest: "Conforman Gujarat Unrest"
 RAJ_settle_gujarat_unrest_desc: "Dirigir recursos estatales a aliviar las tensiones comunales en Gujarat y restablecer el orden, sin esperar a un gobierno concreto en Delhi. Esto sube tanto la opinión hindú como la musulmana. Cuando ambas se recuperen a 35 o más, el malestar de Gujarat cesa por sí solo, y mantener su opinión más alta mantiene la región en calma."
 RAJ_kashmir_unrest: "Kashmir descontento"
 RAJ_kashmir_unrest_desc: "Kashmir sigue siendo inquietante mientras su mayoría musulmana se siente alienada de Delhi. Hasta que se aborden sus agravios, las operaciones de seguridad saltan la moral y la estabilidad en todo el valle. El aumento de la opinión musulmana a través de la decisión apaciguada, el diálogo interconfesional y los enfoques regionales superiores a 35 aclara este malestar."
 RAJ_punjab_unrest: "Pujab Unrest"
 RAJ_punjab_unrest_desc: "El resentimiento persistente de Sikh mantiene a Punjab al borde, drenando capital político y estabilidad. La solución de las preocupaciones de la comunidad es el único camino de regreso a la calma. Elevar la opinión de Sikh a través de la decisión apaciguada, el diálogo interconfesional y los enfoques regionales superiores a 35 aclara este malestar."
 RAJ_bengal_unrest: "Un malestar bengalí"
 RAJ_bengal_unrest_desc: "La fricción comunal con la población musulmana de Bengal interrumpe la industria y el orden de la región. El malestar persiste hasta que su fe se reconcilie con el estado. El aumento de la opinión musulmana a través de la decisión apaciguada, el diálogo interconfesional y los enfoques regionales superiores a 35 aclara este malestar."
 RAJ_northeast_unrest: "Un descontento del noreste"
 RAJ_northeast_unrest_desc: "Las comunidades cristianas del noreste desconfian al gobierno central, alimentando el sentimiento separatista. El reclutamiento y la estabilidad sufren hasta que se alivian sus reclamos. El aumento de la opinión cristiana a través de la decisión apaciguada, el diálogo interconfesional y los enfoques regionales superiores a 35 aclara este malestar."
 RAJ_new_army_idea_desc: "Un amplio programa de modernización ha reestructurado a las Fuerzas Armadas Indias en torno a nuevos principios doctrinales, mejorando los oleoductos de reclutamiento, la coordinación operacional y la preparación para combatir todos los servicios."
 RAJ_BRICS_desc: "La membresía en BRICS abre los vínculos comerciales y políticos con el bloque, acelerando la modesta cooperación de investigación y dando a los negociadores indios una mano más fuerte en la mesa con otros miembros."
 RAJ_BRICS_associate: "Asociado de BRICS"
 RAJ_BRICS_associate_desc: "Asociada de pie vincula a la nación con el comercio y la investigación de BRICS sin ser miembro completo, otorgando beneficios bloqueados reducidos al mismo tiempo que deja la puerta abierta a la promoción."
 RAJ_BRICS_observer: "Un observador de BRICS"
 RAJ_BRICS_observer_desc: "La condición de observador mantiene a la nación comprometida con la diplomacia BRICS y calienta sus relaciones comerciales con el bloque, un primer paso hacia una integración más profunda."
 RAJ_brics_leadership_TT: "Como líder de BRICS, India atrae influencia política y buena voluntad comercial que crece a medida que más naciones se unen al bloque."
 RAJ_BRICS_bank_desc: "El Nuevo Banco de Desarrollo canaliza los préstamos estatales a los recursos estratégicos y proyectos industriales, levantando los rendimientos de los recursos locales y la producción de fábrica. El costo es la exposición: las potencias extranjeras aprovechan nuestras decisiones financieras."
 RAJ_BRICS_cur_desc: "Coordinar la política monetaria con el bloque reduce nuestros costos de financiación y mejora los términos comerciales con los miembros, pero el gasto inicial de la reestructuración de nuestros ciclos económicos es pronunciado y el nuevo arreglo aumenta los costes continuos del ciclo."
 RAJ_steady_elephant: "Elefante de Steady"
 RAJ_steady_elephant_desc: "India debe avanzar con el peso deliberado e imparable de un elefante: paciente, inamovible cuando se impugna, y decisivo cuando se desgasta. Un estado fuerte e independiente exige ese ideal de carácter nacional."
 RAJ_iri_fake_ns2_desc: "Las auditorías de las adquisiciones y la revisión parcial del ministerio de defensa han comenzado a morder. La capacidad desperdiciada y los costos inflados de conversión siguen siendo pesados, pero las peores distorsiones de la Licencia Raj-era están empezando a aliviarse."
 RAJ_iri_fake_ns3_desc: "Las reformas han reducido la suficiente cinta roja que las fábricas de defensa funcionan con una eficiencia aceptable. La conversión de las líneas de producción civil ya no es prohibitivamente costosa, aunque los bolsillos del patrocinio todavía distorsionan los resultados."
 RAJ_iri_fake_ns4_desc: "Un régimen moderno de adquisiciones, una contratación transparente y una aplicación seria contra la corrupción han convertido a la industria de defensa en un sector competitivo. Las ineficiencias son ahora manejables en lugar de lisiar."
 RAJ_re_fake_militar2_desc: "Las cadenas de mando reestructuradas y las herramientas de coordinación modernizadas han estabilizado gran parte de la fuerza. El arraigo y la disciplina del movimiento defensivo están mejorando, incluso si la organización bajo fuego sigue los ejércitos pares."
 RAJ_re_fake_militar3_desc: "Las reformas doctrinales y la integración conjunta del personal han cerrado en gran medida la brecha con militaridades comparables. La mayoría de las unidades ahora operan con una cohesión predecible sobre el terreno."
 RAJ_re_fake_militar4_desc: "Una generación de profesionalización ha pagado. Las fuerzas indias ahora operan con coordinación moderna, maniobra disciplinada y la doctrina de arraigo de un ejército de alto nivel."
 RAJ_industrial_expansion: "Expansión industrial"
 RAJ_industrial_expansion_desc: "Invertir en la industria pesada y la capacidad de fabricación modernizará nuestra economía y creará empleos en toda la nación."
 RAJ_agrarian_society: "Sociedad agraria"
 RAJ_agrarian_society_desc: "Fortalecer nuestro sector agrícola garantiza la seguridad alimentaria y apoya a las comunidades rurales que forman la columna vertebral de nuestra nación."
 RAJ_expanding_at_calcutta: "Ampliación en Calcutta"
 RAJ_expanding_at_calcutta_desc: "Con el aumento de la población, nos enfrentamos al hecho de que Calcuta necesita expandirse. Nos inspiramos en las políticas de expansión permanente observadas en otras ciudades importantes."
 RAJ_standard_rationing: "Racionamiento estándar y reforma agraria"
 RAJ_standard_rationing_desc: "Las reformas de la agricultura y el racionamiento de tierras y alimentos modernizan al mismo tiempo las estructuras tradicionales de poder."
 RAJ_indian_air_force: "Fuerza aérea india"
 RAJ_indian_air_force_desc: "Modernizar la Fuerza Aérea India y ampliar su entrenamiento de combate, construyendo los aeródromos experimentados necesarios para controlar nuestro espacio aéreo."
 RAJ_NAJA_idea_1_desc: "Fuerzas paramilitares y de policía equipadas con armas militares y capacitación, desplegadas para mantener la seguridad interna y contrarrestar las amenazas insurgentes en regiones propensas a conflictos."
 RAJ_network_centric_warfare: "Guerra céntrica de red"
 RAJ_network_centric_warfare_desc: "La guerra centrado en la red, también llamada operaciones centradas en la red o guerra neta, es una doctrina militar o teoría de la guerra que pretende traducir una ventaja de la información, permitida en parte por la tecnología de la información, en una ventaja competitiva a través de las redes informáticas de fuerzas dispersas."
 RAJ_interfaith_dialogue: "Diálogo interconfesional"
 RAJ_interfaith_dialogue_desc: "Financiar un programa sostenido de reconciliación nacional que reúna a todas las confesiones en la misma mesa. Sube la opinión en todas las comunidades a la vez sin dejar ningún grupo resentido, pero el esfuerzo es lento y pesa mucho en el tesoro."
 RAJ_religion_conflict_musl_hindu_title: "La violencia hindú-musulmana estalla"
 RAJ_religion_conflict_musl_hindu_desc: "En una de las ciudades más grandes y más densamente pobladas, un grupo de hindúes y musulmanes comenzó a luchar por una disputa desconocida. Lo que se sabe, sin embargo, es que ambas partes se están rasgando activamente entre sí en pedazos, y está tomando seriamente un peaje sobre la fuerza policial allí."
 RAJ_religion_conflict_musl_christ_title: "Musulmanes y cristianos en Odds"
 RAJ_religion_conflict_musl_christ_desc: "Un grupo de musulmanes y cristianos están en desacuerdo hoy sobre la construcción de una Iglesia cerca de una mezquita. Ambos bandos afirman que el otro debe mover su lugar de culto a otro lugar en la ciudad, y hasta ha habido reportes de pequeños escaramuzas por toda la ciudad."
 RAJ_religion_conflict_hindu_christ_title: "Los hindúes y los cristianos chocan"
 RAJ_religion_conflict_hindu_christ_desc: "Esta mañana, un grupo de hindúes estaba indignado por un cristiano que insultaba a un hindú que intentaba convertir. El incidente se ha intensificado en la lucha abierta entre los dos grupos, con varios edificios establecidos ablaze."
 RAJ_religion_conflict_back_hindu: "De vuelta a los hindúes"
 RAJ_religion_conflict_back_muslim: "Retrocedan los musulmanes"
 RAJ_religion_conflict_back_christian: "Retrocedan los cristianos"
 RAJ_religion_conflict_resolve: "Encontrar una solución para complacer a ambos lados"
 RAJ_drdo_idea_desc: "The Defence Research and Development Organisation channels indigenous R&D en las fuerzas armadas, acelerando la investigación militar, reduciendo el costo de convertir la capacidad civil en producción militar y empujando a la IA para favorecer los avances militares."
 RAJ_indian_national_congress: "Congreso nacional indio"
 RAJ_indian_national_congress_desc: "El Congreso Nacional Indio ha sido una fuerza dominante en la política india desde su independencia. Fortalecer el aparato del partido consolidará la gobernanza democrática."
 RAJ_indian_socialism_idea_desc: "El legado de la economía mixta de Nehru impulsa la dirección del estado pesado de producción industrial, producción de armas e infraestructura. Las subidas de rendimiento de fábrica, pero la cohesión social sufre bajo la rigidez del permiso-raj."
 RAJ_scandinavian_model_idea_desc: "Las plantillas de política socialdemocrática importadas reducen los costos educativos y estabilizan el orden político, a costa de la burocracia inflada y un estado de ánimo público más tranquilo y menos militarizado."
 RAJ_true_social_democracy_idea_desc: "Un acuerdo social-estatal maduro reduce los costos sociales y de atención de la salud, levantando el apoyo de guerra a través de la competencia estatal visible. El aumento de los costos del personal y la estabilidad política disminuyen ligeramente bajo la carga redistributiva."
 RAJ_new_democratic_india_idea_desc: "Un compromiso reafirmado con las normas democráticas eleva la estabilidad, acelera la generación de poder político y refuerza la deriva democrática en la opinión nacional."
 RAJ_vietnamese_intervention: "Pregunta Independencia de Vietnam"
 RAJ_demand_singapore: "Demanda Singapur"
 RAJ_demand_singapore_desc: "Con nuestra posición regional asegurada, ha llegado el momento de presionar nuestro reclamo histórico sobre Singapur y llevar al Estado-ciudad a nuestra esfera."
 RAJ_arms_export_economy: "Exportación de armas"
 RAJ_brics_leadership: "Liderazgo de BRICS"
 RAJ_religious_climate: "Clima religioso"
 RAJ_country_has_any_naxalite_states: "Un estado en India tiene una presencia activa de Naxalite"
 RAJ_has_severe_naxalite_states_trigger: "Un estado en la India tiene una presencia Naxalita severa"
 RAJ_state_has_any_naxalite: "Este estado tiene una presencia activa de Naxalite"
 RAJ_country_has_any_naxalite_states_TT: "Cualquier estado tiene una presencia activa de Naxalita"
 RAJ_has_severe_naxalite_states_trigger_TT: "Cualquier estado tiene una presencia activa de Naxalita severa"
 RAJ_hindu_discontent: "Hindu Discontent"
 RAJ_hindu_discontent_desc: "La mayoría hindú está cada vez más insatisfecha con las políticas gubernamentales. Como el grupo demográfico más grande, su descontento amenaza la estabilidad política y erosiona la base de apoyo del gobierno. Raising Hindu opinion above §Y35§! termina."
 RAJ_religious_harmony: "Religiosa Armonía"
 RAJ_religious_harmony_desc: "Todas las principales comunidades religiosas de la India tienen una opinión favorable del gobierno. Esta armonía interconfesional fortalece la unidad nacional y atrae la inversión. Celebrada mientras toda fe se sienta por encima §Y74§!."
 RAJ_religious_climate_TT: "§Y Clima religioso§!: Estabilidad y escala Poder político con la opinión media de las cinco fes. Cada punto por encima de §Y50§! vale §G+0.4%§! a cada uno, cada punto por debajo cuesta el mismo, capped al §G+10%§! y §R-10%§!."
 RAJ_settle_gujarat_unrest_TT: "[RAJ.GetNameWithFlag] §YMuslim§! La opinión es superior a 50\n[RAJ.GetNameWithFlag] §YHindu§! La opinión es superior a 50."
 RAJ_maoist_suppression: "Raid Maoists in [FROM.GetName]"
 RAJ_suppression_failed_tt: "§RLa redada ha fracasado.§! Los simpatizantes maoístas se reúnen alrededor de la operación anchada, aumentando el apoyo comunista."
 RAJ_delhi_caliphate: "Declarar Delhi Caliphate"
 RAJ_delhi_caliphate_desc: "El movimiento salafista toma el aparato del Estado y proclama un califato dirigido por Delhi, terminando la república constitucional y obligando al nuevo gobierno a la ley islámica."
 RAJ_iran_doctrinal_dispute: "Frente a la Doctrina iraní"
 RAJ_iran_doctrinal_dispute_desc: "La doctrina revolucionaria chia de Teherán es un rival ideológico directo al proyecto salafista sunita. Confrontar la influencia regional de Irán es ahora una prioridad estratégica."
 RAJ_MAO_rebellion_armed: "Conflicto armado inminente"
 RAJ_MAO_rebellion_armed_desc: "La insurgencia maoísta se ha intensificado más allá de las manifestaciones. Las células armadas se movilizan para una guerra abierta contra el gobierno. Si se deja sin control, la guerra civil es inevitable."
 RAJ_central_asian_revolution: "Revolución salafista en [FROM.GetName]"
 RAJ_central_asian_revolution_desc: "Las condiciones en [FROM.GetNameDefCap] están maduras para un levantamiento salafista. Canalizar nuestra influencia al movimiento fascista local y provocar una revolución armada para llevar al país a nuestra esfera."
 RAJ_BRICS_polit_alliance_faction_warning_tt: "§RAdvertencia:§! esto §R desmantelar su facción existente§! y sustituirla por una nueva facción BRICS. Cualquier miembro no BRICS que usted haya invitado será §R rechazado§!."
 RAJ_arms_export_economy_TT: "§YEconomías de escala§!\nCada socio exportador distinto eleva §G capacidad industrial§! como escalas de la industria armamentística: §G+1%§! producción de fábrica por socio."
 RAJ_energy_idea_desc: "La inversión en energía nuclear nacional amplía la capacidad de generación y reduce nuestra dependencia del combustible importado."
 RAJ_207_sd_idea_desc: "El Tata Indica, el primer auto de pasajeros totalmente indígena de la India, ancla un sector automotriz nacional que acelera la construcción de edificios y la expansión de fábricas, genera ingresos fiscales corporativos, y da un modesto impulso a la estabilidad política y al crecimiento demográfico."
 RAJ_network_improvement_idea_desc: "Las mejoras a la infraestructura nacional de telecomunicaciones aceleran el despliegue de redes digitales en todo el país."
 RAJ_socdem_stability_factor: "Estabilidad Factor"
 RAJ_Local_markets_desc: "Los bazares nacionales y el comercio a nivel de calle prosperan, acelerando la construcción de pequeños edificios en todo el país."
 TT_RAJ_LOCAL_MARKETS_MODIFIER: "§YAdditional Income§!: $§G0.080§!"
 indian_event.61.t: "Bombarderos de entrenamiento de Mumbai"
 indian_event.61.d: "El 11 de julio de 2006, una serie de siete explosiones coordinadas de bombas atravesadas por la red ferroviaria suburbana de Mumbai durante la hora punta de la tarde, matando a 209 personas e hiriendo a más de 700. Los ataques, llevados a cabo por Lashkar-e-Taiba con apoyo local, apuntaron a la línea de vida de la ciudad y enviaron ondas de choque en toda la nación."
 indian_event.61.a: "Este es un acto de guerra."
 RAJ_naxal.19.t: "La emboscada del Valle de Darbha"
 RAJ_naxal.19.d: "El 25 de mayo de 2013, los insurgentes naxalitas emboscaron a un convoy del Congreso Nacional Indio en el Valle de Darbha de Chhattisgarh, matando a 27 personas incluyendo altos líderes estatales y su detalle de seguridad. El ataque expuso lagunas críticas en la seguridad de inteligencia y rutas en el Corredor Rojo."
 RAJ_naxal.19.a: "La insurgencia debe ser aplastada."
 indian_event.62.t: "Ataque de la Base Uri"
 indian_event.62.d: "El 18 de septiembre de 2016, cuatro militantes atacaron un cuartel general de la brigada del Ejército Indio cerca de Uri en Jammu y Cachemira, matando a 19 soldados e hiriendo a otros 30. El ataque, uno de los más mortíferos contra las fuerzas de seguridad en Cachemira, ha provocado numerosos llamamientos para represalias."
 indian_event.62.a: "Pagarán por esto."
 indian_event.63.t: "Demonetización anunciada"
 indian_event.63.d: "El 8 de noviembre de 2016, el gobierno anunció abruptamente la demonetización de Rs 500 y Rs 1000 billetes, lo que hizo que el 86% de la moneda del país quedara inválida durante la noche. Mientras se dirigía a frenar el dinero negro y la moneda falsificada, el movimiento ha causado una perturbación masiva de la vida cotidiana y la economía informal."
 indian_event.63.a: "Un sacrificio necesario."
 RAJ_eastas.6.t: "Enfrentamiento de Doklam"
 RAJ_eastas.6.d: "En junio de 2017, tropas indias y chinas se encerraron en un enfrentamiento de 73 días en el trijunto Doklam cerca de Bhután. Las fuerzas indias bloquearon los intentos chinos de extender un camino hacia el territorio en disputa, lo que llevó a las dos potencias nucleares al borde del conflicto armado en el Himalaya."
 RAJ_eastas.6.a: "No vamos a ceder una pulgada."
 indian_event.64.t: "Ataque del Terror de Pulwama"
 indian_event.64.d: "El 14 de febrero de 2019, un bombardero suicida de Jaish-e-Mohammed arrojó un vehículo cargado de explosivos en un convoy CRPF cerca de Pulwama en Cachemira, matando a 40 personas. El ataque terrorista más mortífero contra las fuerzas de seguridad en décadas ha desencadenado una crisis nacional y demandas de represalia."
 indian_event.64.a: "La sangre exige sangre."
 indian_event.65.t: "Article 370 Revoked"
 indian_event.65.d: "El 5 de agosto de 2019, el gobierno revocó el artículo 370 de la Constitución, despojando a Jammu y Cachemira de su condición especial autónoma y bifurcando al Estado en dos Territorios de la Unión. El movimiento, acompañado de un cierre de seguridad y apagón de comunicaciones, ha atraído tanto elogio nacional como la preocupación internacional."
 indian_event.65.a: "Cachemira está totalmente integrada."
 indian_event.66.t: "CAA protestas erupción"
 indian_event.66.d: "En diciembre de 2019 surgieron protestas generalizadas en todo el país contra la Ley de enmienda de la ciudadanía, que otorga la ciudadanía a refugiados no musulmanes de países vecinos pero excluye a los musulmanes. Los manifestantes argumentan que la ley viola los principios seculares de la Constitución."
 indian_event.66.a: "Debemos escuchar a la gente."
 RAJ_eastas.7.t: "El choque de Galwan Valley"
 RAJ_eastas.7.d: "El 15 de junio de 2020, tropas indias y chinas realizaron un combate brutal de mano a mano en el Valle de Galwan de Ladakh, lo que dio lugar a la muerte de 20 soldados indios y un número desconocido de bajas chinas. El enfrentamiento marca el primer enfrentamiento fronterizo fatal entre los dos países desde 1975."
 RAJ_eastas.7.a: "Honraremos su sacrificio."
 RAJ_naxal.20.t: "Bijapur emboscada"
 RAJ_naxal.20.d: "El 3 de abril de 2021, los insurgentes naxalitas emboscaron fuerzas de seguridad en el distrito de Bijapur de Chhattisgarh, matando a 22 personas en uno de los ataques más mortíferos de los últimos años. El incidente pone de relieve la persistente amenaza en el Corredor Rojo a pesar de años de operaciones contra la insurgencia."
 RAJ_naxal.20.a: "No romperán nuestra determinación."
 RAJ_naxal.21.t: "Tribunal Supremo golpea a Salwa Judum"
 RAJ_naxal.21.d: "El 5 de julio de 2011, el Tribunal Supremo de la India dictaminó que Salwa Judum era inconstitucional, ordenando el desarme inmediato de la milicia tribal patrocinada por el Estado que armar a civiles mal entrenados para luchar contra los maoístas violó derechos fundamentales y alimentó el mismo ciclo de violencia que estaba destinado a reprimir y los organismos internacionales de derechos humanos están vigilando a Nueva Delhi de cerca"
 RAJ_naxal.21.a: "Cumpliremos el fallo."
 RAJ_human_rights_scrutiny: "De los Derechos Humanos"
 RAJ_human_rights_scrutiny_desc: "Las organizaciones internacionales de derechos y la prensa nacional están analizando el comportamiento contra la insurgencia. Estabilidad y el capital político toma un éxito, y los servicios de inteligencia extranjeros encuentran a la India un blanco más suave mientras dura el foco."
 indian_event.67.t: "Manipur estalla en la violencia"
 indian_event.67.d: "En mayo de 2023, la violencia étnica explotó en Manipur entre las comunidades Meitei y Kuki, provocando meses de enfrentamientos, incendios y desplazamientos. La crisis, arraigada en los derechos de la tierra, el estado de reserva y las líneas de falla religiosa, ha expuesto profundas fracturas en el estado nororiental."
 indian_event.67.a: "Debemos restaurar el orden."
 RAJ_regional.1.t: "Huelga cruzada"
 RAJ_regional.1.d: "El 9 de junio de 2015, el Ejército Indio lanzó huelgas quirúrgicas a través de la frontera de Myanmar, destruyendo campamentos NSCN-K responsables de una emboscada que mató a 18 soldados en el distrito Chandel de Manipur. La operación marca la primera huelga transfronteriza reconocida por la India contra los santuarios insurgentes."
 RAJ_regional.1.a: "Lo tenían viniendo."
 RAJ_regional.2.t: "Intercambio de enclaves con Bangladesh"
 RAJ_regional.2.d: "El 6 de junio de 2015, la India y Bangladesh intercambiaron 162 enclaves en un acuerdo histórico que puso fin a una controversia fronteriza de 68 años. Más de 50.000 residentes apátridas recibirán finalmente la ciudadanía."
 RAJ_regional.2.a: "Un día histórico."
 RAJ_regional.3.t: "Rohingya Crisis recupera la India"
 RAJ_regional.3.d: "En agosto de 2017, la represión militar de Myanmar ha llevado más de 700.000 rohingya a través de la frontera hacia Bangladesh. India acoge a 40.000 refugiados rohingya, y el gobierno debe decidir si protegerlos o deportarlos."
 RAJ_regional.3.a: "Deportarlos a todos."
 RAJ_regional.3.b: "Concédeles refugio."
 RAJ_regional.4.t: "Teesta habla de colapsar"
 RAJ_regional.4.d: "En abril de 2017, el primer ministro de Bangladesh Hasina llegó a Nueva Delhi con la esperanza de concluir un acuerdo sobre compartir las aguas del río Teesta. El ministro jefe de West Bengal ha bloqueado una vez más el acuerdo, dejando a Dhaka con las manos vacías."
 RAJ_regional.4.a: "Anular la oposición estatal."
 RAJ_regional.4.b: "La política nacional viene primero."
 RAJ_regional.5.t: "NRC Excluye Millones"
 RAJ_regional.5.d: "En agosto de 2019, el último Registro Nacional de Ciudadanos en Assam ha excluido a 1,9 millones de personas, la mayoría de ellas musulmanas bengalí. Junto con la Ley de enmienda de la ciudadanía, el movimiento ha provocado protestas nacionales y una respuesta furiosa de Dhaka."
 RAJ_regional.5.a: "La seguridad nacional lo exige."
 RAJ_regional.6.t: "Campaña de referéndum de Khalistan"
 RAJ_regional.6.d: "En 2020, la organización prohibida Sikhs for Justice ha iniciado un referéndum mundial de independencia no vinculante, que ha dado grandes resultados entre la diáspora sij. El movimiento está alimentando el sentimiento separatista en casa a pesar de la represión del gobierno."
 RAJ_regional.6.a: "Crush este movimiento."
 RAJ_regional.7.t: "Los refugiados de Myanmar inundaron la frontera"
 RAJ_regional.7.d: "Tras el golpe militar de febrero de 2021 en Myanmar, miles de refugiados chin se han cruzado en Mizoram y Manipur. El gobierno central ha ordenado a los estados que los empujen, pero el ministro principal de Mizoram está desafiando abiertamente a Nueva Delhi."
 RAJ_regional.7.a: "Cierra la frontera."
 RAJ_regional.7.b: "Déjenlos pasar."
 RAJ_regional.8.t: "Marco de paz Naga firmado"
 RAJ_regional.8.d: "El 3 de agosto de 2015, el gobierno firmó un acuerdo marco con el NSCN-IM después de 18 años de negociaciones. El acuerdo promete una resolución a una de las insurgencias más antiguas de Asia y un nuevo capítulo para el noreste."
 RAJ_regional.8.a: "Un paso hacia una paz duradera."
 RAJ_regional.9.t: "Contrabandistas de armas"
 RAJ_regional.9.d: "La inteligencia ha descubierto un oleoducto activo de armas que va desde Myanmar hacia el corredor rojo nororiental. Una operación conjunta con Myanmar podría cerrarla, pero requiere recursos y capital diplomático."
 RAJ_regional.9.a: "Inicie una operación conjunta."
 RAJ_regional.9.b: "No podemos evitar los recursos."
 RAJ_regional.10.t: "Crisis de Asesinato Nijjar"
 RAJ_regional.10.d: "En junio de 2023, el líder de Khalistani Hardeep Singh Nijjar fue asesinado en Columbia Británica. El primer ministro de Canadá ha acusado públicamente a la India de orquestar el asesinato, desencadenando la peor crisis diplomática entre los dos países en décadas."
 RAJ_regional.10.a: "Expelen a sus diplomáticos."
 RAJ_regional.11.t: "Ejercicios navales de la bahía de Bengal"
 RAJ_regional.11.d: "En 2014, la India amplió la cooperación marítima con Bangladesh y Myanmar mediante el marco BIMSTEC, realizando patrullas conjuntas y ofreciendo corbetas a ambas marinas. La iniciativa ancla la India como el poder naval dominante en la Bahía de Bengal."
 RAJ_regional.11.a: "El poder del proyecto en nuestras aguas."
 RAJ_regional.12.t: "Los asesinatos fronterizos de BSF"
 RAJ_regional.12.d: "La Fuerza de Seguridad Fronteriza de la India ha sido nuevamente acusada de matar a civiles de Bangladesh a lo largo de la frontera. Dhaka ha presentado una protesta formal y los grupos de derechos humanos están pidiendo responsabilidad."
 RAJ_regional.12.a: "Orden de restricción."
 RAJ_regional.12.b: "La frontera debe ser tenida."
 RAJ_regional.13.t: "Bloqueo fronterizo de Nepal"
 RAJ_regional.13.d: "En septiembre de 2015, tras la adopción por Nepal de una nueva constitución que margina a la minoría madhesi, India ha restringido los envíos de combustible y suministros en toda la frontera. Nepal enfrenta una crisis humanitaria a medida que se acerca el invierno y China ofrece rutas alternativas de suministro."
 RAJ_regional.13.a: "Aprieta el bloqueo."
 RAJ_regional.13.b: "Restricciones de facilidad."
 RAJ_regional.13.c: "Levanta el bloqueo."
 RAJ_regional.14.t: "Nepal recurre a China"
 RAJ_regional.14.d: "Los meses de suministros restringidos han devastado la economía de Nepal. Kathmandu ha firmado nuevos acuerdos comerciales y de tránsito con Beijing, un cambio dramático en un país largo dentro de la órbita de la India. El bloqueo se ha convertido en un relato de exceso de alcance."
 RAJ_regional.14.a: "El daño se hace."
 RAJ_regional.14.b: "Extender una rama de olivo."
 RAJ_regional.14.c: "Nuestra restricción pagó."
 RAJ_regional.15.t: "Conflicto fronterizo de Kalapani"
 RAJ_regional.15.d: "En mayo de 2020, el Parlamento de Nepal aprobó por unanimidad una enmienda constitucional que afirmaba Kalapani, Lipulekh y Limpiyadhura. La trijunción en disputa se encuentra en la frontera entre India y Nepal y China, y los despliegues de tropas podrían intensificar las tensiones a través de toda la frontera del Himalaya."
 RAJ_regional.15.a: "Reforzar nuestras posiciones."
 RAJ_regional.15.b: "Proponer negociaciones."
 RAJ_regional.15.c: "Aceptar una encuesta conjunta."
 RAJ_regional.16.t: "Tratado de 1950 en examen"
 RAJ_regional.16.d: "Nepal ha propuesto oficialmente la revisión del Tratado de Paz y Amistad de 1950, por lo que es una reliquia desigual. El tratado sustenta la influencia de la India sobre la política exterior y de defensa de Nepal, y la renegociación podría reestructurar la relación bilateral."
 RAJ_regional.16.a: "Modernizar la asociación."
 RAJ_regional.16.b: "El tratado se mantiene."
 RAJ_regional.17.t: "Bhutan Thanks India"
 RAJ_regional.17.d: "Tras la resolución del enfrentamiento de Doklam, Bhután ha expresado en privado su profunda gratitud por la voluntad de la India de enfrentar a China en su territorio soberano. Thimphu está ansioso por formalizar vínculos de defensa más fuertes."
 RAJ_regional.17.a: "Profundice la alianza."
 RAJ_regional.17.b: "Un apretón de manos es suficiente."
 RAJ_regional.18.t: "Ampliación de la energía hidroeléctrica de Bhután"
 RAJ_regional.18.d: "El Proyecto Hidroeléctrico Mangdechhu ha sido encargado, añadiendo 720 MW de capacidad. India financia y construye las presas de Bhután y compra el excedente eléctrico, anclando una de las asociaciones más disueltas pero estables en Asia meridional."
 RAJ_regional.18.a: "Ampliar la asociación."
 RAJ_regional.18.b: "Tenemos suficientes compromisos."
 RAJ_regional.19.t: "Bhután bloquea la democracia"
 RAJ_regional.19.d: "En marzo de 2008, el rey Jigme Singye Wangchuck ha supervisado la transición pacífica de Bhután desde la monarquía absoluta a la democracia constitucional. Las primeras elecciones se han celebrado sin incidentes. El aliado más cercano de la India entra en una nueva era."
 RAJ_regional.19.a: "Bienvenidos a la democracia."
 RAJ_regional.19.b: "Una monarquía era más simple."
 RAJ_regional.20.t: "Bloqueo de India Bites"
 RAJ_regional.20.d: "El cierre por la India de los cruces fronterizos ha dejado a Nepal críticamente corto de combustible, medicamentos y gas para cocinar. Beijing ha ofrecido suministros de emergencia y derechos de tránsito por el Tíbet. Kathmandu se enfrenta a una elección asombrosa entre el orgullo y el pragmatismo."
 RAJ_regional.20.a: "Acepta la oferta de China."
 RAJ_regional.20.b: "Fin y negociación."
 RAJ_regional.21.t: "Ottawa exige responsabilidad"
 RAJ_regional.21.d: "El Canadá ha acusado formalmente a la India de participar en el asesinato del líder de Sikh Hardeep Singh Nijjar en suelo canadiense. Ottawa está sopesando su próximo movimiento, ya que el enfrentamiento diplomático amenaza el comercio bilateral y la gran diáspora indo-canadiana."
 RAJ_regional.21.a: "Expel Indian diplomats."
 RAJ_regional.21.b: "Resolución diplomática."
 RAJ_regional.22.t: "Dhaka condena las expulsiones de Rohingya"
 RAJ_regional.22.d: "La India ha comenzado a deportar a los refugiados rohingyas de regreso hacia Myanmar, con la pronunciada condena de Dhaka. Bangladesh, ya abrumado con más de un millón de refugiados de Myanmar, ha llamado a la acción una traición a las obligaciones humanitarias compartidas."
 RAJ_regional.22.a: "Condena la decisión de Nueva Delhi."
 RAJ_regional.23.t: "Dhaka acoge la solidaridad de la India"
 RAJ_regional.23.d: "La decisión de la India de proteger a los refugiados rohingya en lugar de expulsarlos ha sido acogida calurosamente en Dhaka. Bangladesh considera que esto es un acto de solidaridad genuina en una crisis que ha tensado a todos los países de la región."
 RAJ_regional.23.a: "Apreciamos la solidaridad de la India."
 RAJ_regional.24.t: "India refuerza Kalapani"
 RAJ_regional.24.d: "Las tropas indias se han movido para reforzar posiciones en la disputada trijunción de Kalapani-Lipulekh, días después de que el parlamento de Nepal declarara unánimemente el territorio. Kathmandu debe decidir si corresponder a la postura militar de la India o buscar una salida diplomática."
 RAJ_regional.24.a: "Movilizar nuestras fuerzas."
 RAJ_regional.24.b: "Protesta por la diplomacia."
 RAJ_regional.25.t: "Bután pesa la alianza de India"
 RAJ_regional.25.d: "A raíz del enfrentamiento de Doklam, la India ha profundizado su asociación de defensa con Bhután. Thimphu agradece la intervención de la India, pero consciente de que la alineación plena podría provocar aún más a Beijing, que tiene sus propias reivindicaciones territoriales en territorio bhutaneso."
 RAJ_regional.25.a: "India es nuestro escudo."
 RAJ_regional.25.b: "No debemos provocar a China."
 RAJ_regional.26.t: "Dhaka firma el acuerdo de la Teesta"
 RAJ_regional.26.d: "Después de años de negociaciones estancadas por las objeciones de Bengala Occidental, la India finalmente ha anulado la oposición interna y se ha ofrecido a firmar el acuerdo de distribución del agua del río Teesta. El acuerdo es una importante victoria diplomática para Bangladesh y podría transformar las relaciones bilaterales."
 RAJ_regional.26.a: "Firme el acuerdo."
 RAJ_ladakh_crisis: "Crisis separatista de Ladakh"
 RAJ_ladakh_crisis_desc: "La opinión musulmana en Ladakh ha caído a niveles peligrosamente bajos. Si no atendemos pronto sus agravios, la región podría declarar la independencia."
 RAJ_meghalaya_crisis: "Crisis separatista de Meghalaya"
 RAJ_meghalaya_crisis_desc: "La opinión cristiana en Meghalaya ha caído a niveles peligrosamente bajos. Si no atendemos pronto sus agravios, la región podría declarar la independencia."
 RAJ_manipur_crisis: "Crisis separatista de Manipur"
 RAJ_manipur_crisis_desc: "La opinión cristiana en Manipur ha caído a niveles peligrosamente bajos. Si no atendemos pronto sus agravios, la región podría declarar la independencia."
 RAJ_sikkim_crisis: "Sikkim Crisis separatista"
 RAJ_sikkim_crisis_desc: "La opinión budista en Sikkim ha caído a niveles peligrosamente bajos. Si no atendemos pronto sus agravios, la región podría declarar la independencia."
 RAJ_punjab_crisis: "Crisis separatista de Punjab"
 RAJ_punjab_crisis_desc: "La opinión sij en Punyab ha caído a niveles peligrosamente bajos. Si no atendemos pronto sus agravios, la región podría declarar la independencia."
 RAJ_raise_muslim_opinion_tt: "La opinión musulmana debe ser superior a 19"
 RAJ_raise_christian_opinion_tt: "La opinión cristiana debe ser superior a 19"
 RAJ_raise_buddhist_opinion_tt: "La opinión budista debe ser superior a 19"
 RAJ_raise_sikh_opinion_tt: "La opinión de Sikh debe ser superior a 14"
 RAJ_rebellion.1.a: "Esto es un desastre."
 RAJ_rebellion.1.b: "La situación se ha estabilizado."
 RAJ_rebellion_ladakh_title: "Ladakh declara la independencia"
 RAJ_rebellion_ladakh_desc: "La población musulmana de Ladakh ha perdido toda la fe en el gobierno central. Los separatistas armados han tomado el control de la región y declarado independencia. Nuestras fuerzas han sido expulsadas de la zona."
 RAJ_rebellion_meghalaya_title: "Meghalaya declara la independencia"
 RAJ_rebellion_meghalaya_desc: "Las comunidades cristianas de Meghalaya se han levantado contra el gobierno central. Las milicias tribales han tomado el control del estado y declarado independencia."
 RAJ_rebellion_manipur_title: "Manipur declara la independencia"
 RAJ_rebellion_manipur_desc: "Las comunidades cristianas y tribales de Manipur se han levantado contra el gobierno central. Los grupos armados han tomado el control del Estado y declarado independencia."
 RAJ_rebellion_sikkim_title: "Sikkim declara la independencia"
 RAJ_rebellion_sikkim_desc: "La población budista de Sikkim ha perdido toda la fe en el gobierno central. Las fuerzas separatistas han tomado el control y declarado la independencia, tratando de restaurar la soberanía de Sikkim."
 RAJ_rebellion_punjab_title: "Punjab declara la independencia"
 RAJ_rebellion_punjab_desc: "La población sij de Punjab ha perdido toda la fe en el gobierno central. Los separatistas de Khalistan han tomado el control de la región y declarado independencia."
 indian_event.70.t: "BRICS Invitación completa de membresía"
 indian_event.70.d: "[FROM.GetName] ha extendido una invitación para que nuestra nación se uniera a los BRICS como miembro completo. Esto representa una oportunidad significativa para profundizar nuestros vínculos económicos y políticos con las economías emergentes más dinámicas del mundo. La membresía completa nos otorga derechos de voto, acceso al Nuevo Banco de Desarrollo y participación en todas las iniciativas del BRICS."
 indian_event.70.a: "Aceptar la invitación con honor"
 indian_event.70.b: "Decline - no satisfacemos los requisitos"
 indian_event.71.t: "[FROM.GetName] Acepta la membresía completa de BRICS"
 indian_event.71.d: "[FROM.GetName] ha aceptado formalmente nuestra invitación a unirse a BRICS como miembro completo. Esta expansión histórica fortalece nuestra alianza y brinda nuevas oportunidades para la cooperación en el comercio, las finanzas y la seguridad."
 indian_event.71.a: "Bienvenido a ellos en el pliegue"
 indian_event.72.t: "[FROM.GetName] Declines BRICS membresía completa"
 indian_event.72.d: "[FROM.GetName] ha rechazado nuestra invitación a unirse a BRICS como miembro completo. Si bien es decepcionante, respetamos su decisión y esperamos continuar el compromiso diplomático a través de otros canales."
 indian_event.72.a: "Una oportunidad perdida"
 indian_event.73.t: "BRICS cursó una invitación de membresía"
 indian_event.73.d: "[FROM.GetName] nos ha invitado a ser miembros asociados de BRICS. Esta situación ofrece mejores oportunidades de cooperación sin pleno derecho de voto. Los miembros asociados participan en iniciativas económicas y tienen la condición de observador en las cumbres."
 indian_event.73.a: "Aceptar la membresía asociada"
 indian_event.73.b: "Diferencia - requisitos no cumplidos"
 indian_event.74.t: "[FROM.GetName] Acepta la membresía asociada BRICS"
 indian_event.74.d: "[FROM.GetName] ha aceptado nuestra invitación para ser miembro asociado en BRICS. Esto fortalece nuestros vínculos económicos y abre nuevas vías para la cooperación."
 indian_event.74.a: "Un paso más cerca de la integración plena"
 indian_event.75.t: "[FROM.GetName] Diclines BRICS Associate Membership"
 indian_event.75.d: "[FROM.GetName] ha rechazado nuestra oferta de membresía asociada en BRICS. Seguimos abiertos a la cooperación futura."
 indian_event.75.a: "Tal vez en otro momento"
 indian_event.76.t: "Invitación de la condición de observador BRICS"
 indian_event.76.d: "[FROM.GetName] nos ha ofrecido la condición de observador en BRICS. Esto nos permite asistir a las cumbres, participar en grupos de trabajo y construir relaciones con los Estados miembros mientras consideramos un compromiso más profundo."
 indian_event.76.a: "Aceptar la condición de observador"
 indian_event.76.b: "Decline - no interesado"
 indian_event.77.t: "[FROM.GetName] Acepta la condición de observador de BRICS"
 indian_event.77.d: "[FROM.GetName] ha aceptado nuestra invitación a la condición de observador en BRICS. Esto marca el comienzo de lo que podría ser una relación más profunda."
 indian_event.77.a: "Cada viaje comienza con un solo paso"
 indian_event.78.t: "[FROM.GetName] Declines BRICS status de observador"
 indian_event.78.d: "[FROM.GetName] ha rechazado nuestra oferta de estatus de observador en BRICS. La invitación debe ser reconsiderada."
 indian_event.78.a: "Tal vez a tiempo"
 indian_event.79.t: "BRICS Associate membership Offer"
 indian_event.79.d: "[FROM.GetName] ha ofrecido elevar nuestra posición dentro de BRICS de observador a miembro asociado. El status asociado nos otorga un asiento en las iniciativas económicas del bloque y una voz más fuerte en los debates de la cumbre, profundizando nuestra asociación con las economías emergentes."
 indian_event.79.a: "Aceptar la promoción"
 indian_event.79.b: "Decline - estamos contentos como observadores"
 indian_event.82.t: "Afiliación completa ofrecida por BRICS"
 indian_event.82.d: "[FROM.GetName] se ha ofrecido a elevar nuestra posición dentro de BRICS desde socio hasta miembro completo. La membresía completa otorga derechos de voto, acceso al Nuevo Banco de Desarrollo y entrada en los arreglos de seguridad de la alianza, obligando nuestro futuro al bloque."
 indian_event.82.a: "Aceptar la membresía completa"
 indian_event.82.b: "Decline - el compromiso es demasiado grande"
 RAJ_brics_invite_full_member: "Invitar a [FROM.GetName] como miembro de pleno derecho"
 RAJ_brics_invite_full_member_desc: "[FROM.GetName] puede calificar para la membresía completa de BRICS. Todos los miembros obtienen derechos de voto, acceso al Nuevo Banco de Desarrollo y participación en todas las iniciativas del BRICS."
 RAJ_brics_invite_associate_member: "Invitar a [FROM.GetName] como miembro asociado"
 RAJ_brics_invite_associate_member_desc: "[FROM.GetName] puede calificar para la membresía asociada, fortaleciendo el alcance global de BRICS mediante una mayor cooperación económica."
 RAJ_brics_invite_observer: "Invitar [FROM.GetName] como observador"
