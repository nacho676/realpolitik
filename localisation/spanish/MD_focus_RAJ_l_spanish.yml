 RAJ_seek_permanent_unsc_seat: "Buscar miembros permanentes del Consejo de Seguridad"
 RAJ_seek_permanent_unsc_seat_desc: "La población, el peso económico y el papel de la India en el mantenimiento de la paz internacional apoyan una reclamación por representación permanente en el Consejo de Seguridad de las Naciones Unidas. Comenzaremos la campaña diplomática necesaria para presentar esa reclamación ante el Consejo y la Asamblea General."
 RAJ_enshrine_pluralism: "El pluralismo enshrine"
 RAJ_enshrine_pluralism_desc: "Escribir el acuerdo religioso en el orden constitucional en lugar de dejarlo a la buena voluntad del gobierno del día. Requiere la ley §YLa Armonía Popular§! y la Armonía Religiosa permanente. El bono está bloqueado permanentemente, y la opinión comunitaria ya no impulsa el malestar, las crisis separatistas o la secesión."
 RAJ_all_faiths_content: "Cada fe tiene una opinión arriba §Y80§!"
 RAJ_pluralist_harmony: "Pluralista Armonía"
 RAJ_pluralist_harmony_desc: "Pluralismo adoptado desde una posición de fuerza. Cada comunidad ya se encuentra detrás del gobierno, tan igual que el estado lee como reconocimiento en lugar de como una concesión promovida por una mayoría resentida."
 RAJ_pluralist_settlement: "Arreglo de Pluralist"
 RAJ_pluralist_settlement_desc: "El acuerdo religioso está escrito en el orden constitucional y ya no depende del gobierno del día. La posición comunal ha dejado de gobernar la cohesión del sindicato."
