 border_war_claim_progress_cost_tt: "§Yprogreso de reclamación§!: $RIGHT|+=0$"
 pak_raj_border_attack_outcome_tt: "Después de §Y10§! días se abre una guerra fronteriza para el estado impugnado. Una victoria añade §Y20 progreso de reclamación§!, una derrota cuesta §Y10§! y un estancamiento cuesta §Y5§!.\nSi la propiedad, el control o la presencia de tropas cambian primero, la operación se cancela sin costo alguno."
 raj_chi_border_attack_outcome_tt: "Después de §Y10§! días se abre una guerra fronteriza para el estado impugnado. Una victoria añade §Y20 progreso de reclamación§!, una derrota cuesta §Y10§! y un estancamiento cuesta §Y5§!.\nSi la propiedad, el control o la presencia de tropas cambian primero, la operación se cancela sin costo alguno."
 border_war_frontier_exercise: "Ejercicio de vanguardia"
 border_war_frontier_exercise_desc: "Las maniobras sostenidas en la frontera están usando las unidades estacionadas aquí."
 border_war_frontier_operation: "Operación Frontier"
 border_war_frontier_operation_desc: "Las operaciones activas a lo largo de la frontera están usando las unidades estacionadas aquí."
 border_war_state_garrison_tt: "Controlamos el sector fronterizo asignado y tenemos al menos §Y5§! divisiones situadas allí"
 border_war_state_patrol_tt: "Controlamos el sector fronterizo asignado y tenemos al menos §Y3§! divisiones situadas allí"
 border_war_state_mechanized_tt: "Controlamos el sector fronterizo asignado y tenemos al menos §Y3§! divisiones con infantería mecanizada o motorizada situada allí"
 border_war_state_artillery_tt: "Controlamos el sector fronterizo asignado y tenemos al menos §Y3§! divisiones con artillería o artillería de cohetes situadas allí"
 border_war_operation_blocked.2.t: "Preparativos Abandonados"
 border_war_operation_blocked.2.d: "La guarnición destinada a la operación dejó la frontera antes de que los preparativos fueran completos. El ejercicio fue cancelado, y el rival ha utilizado la apertura para ganar la iniciativa."
 border_war_operation_blocked.2.a: "Un lapso costoso"
 border_war_mobilization_idea: "Movilización general"
 border_war_mobilization_idea_desc: "Las fuerzas armadas se han trasladado a una crisis a lo largo de la frontera en disputa."
 pak_raj_border_train_army: "Realizar ejercicios del ejército en [From.GetName]"
 pak_raj_border_train_army_desc: "Realizar un ejercicio de quince días con las divisiones que guarnecen [From.GetName], nuestro sector fronterizo asignado. Cuesta 20 de poder de mando. Las unidades desplegadas sufren desgaste mientras dure. Aumenta la Preparación en 3. Sacar a la guarnición antes de los quince días entrega esos mismos 3 de Preparación a nuestro rival.\n\nCuando termine el ejercicio, el ejército asigna un nuevo sector fronterizo."
 pak_raj_border_train_mechanized: "Realizar ejercicios mecanizados en [From.GetName]"
 pak_raj_border_train_mechanized_desc: "Realizar un ejercicio mecanizado de quince días con las divisiones mecanizadas y motorizadas estacionadas en [From.GetName], nuestro sector fronterizo asignado. Cuesta 20 de poder de mando. Las unidades desplegadas sufren desgaste mientras dure. Aumenta la Preparación en 8, con riesgo de accidente. Retirarlas antes de los quince días entrega esos mismos 8 de Preparación a nuestro rival.\n\nCuando termine el ejercicio, el ejército asigna un nuevo sector fronterizo."
 pak_raj_border_train_artillery: "Realizar ejercicios de artillería en [From.GetName]"
 pak_raj_border_train_artillery_desc: "Realizar un ejercicio de tiro de quince días con la artillería y la artillería de cohetes estacionadas en [From.GetName], nuestro sector fronterizo asignado. Cuesta 20 de poder de mando. Las unidades desplegadas sufren desgaste mientras dure. Aumenta la Preparación en 5. Retirar las piezas antes de los quince días entrega esos mismos 5 de Preparación a nuestro rival.\n\nCuando termine el ejercicio, el ejército asigna un nuevo sector fronterizo."
 pak_raj_border_stage_incursion: "Etapa de una incursión fronteriza desde [From.GetName]"
 pak_raj_border_stage_incursion_desc: "Empujar una patrulla a través de la línea desde [From.GetName], nuestro sector fronterizo asignado. Cuesta 20 de poder de mando. Las unidades desplegadas sufren desgaste mientras dure. Aumenta la Tensión bilateral en 15 y conlleva riesgo de bajas. Retirar la patrulla antes de los quince días entrega 3 de Preparación a nuestro rival.\n\nCuando la patrulla regrese, el ejército asigna un nuevo sector fronterizo."
 pak_raj_border_shell_positions: "Bombardear posiciones fronterizas desde [From.GetName]"
 pak_raj_border_shell_positions_desc: "Bombardear las posiciones frente a [From.GetName], nuestro sector fronterizo asignado, con la artillería y la artillería de cohetes estacionadas allí. Cuesta 20 de poder de mando. Las unidades desplegadas sufren desgaste mientras dure. Aumenta la Tensión bilateral en 22, crea más tensión mundial y conlleva riesgo de represalia. Retirar las piezas antes de los quince días entrega 5 de Preparación a nuestro rival.\n\nCuando termine el bombardeo, el ejército asigna un nuevo sector fronterizo."
 pak_raj_border_negotiate: "Open Indo-Pakistani habla"
 pak_raj_border_negotiate_desc: "Utilice la buena voluntad mutua para reducir la tensión bilateral en 25. Un arreglo pacífico de crisis respaldado por una fuerte confianza mutua puede regular permanentemente la frontera."
 pak_raj_border_negotiate_tt: "§GLa Tensión Bilateral Indo-Pakistani disminuye en 25§!"
 pak_raj_border_settlement_tt: "§G India y Pakistán establecen un acuerdo fronterizo duradero§!"
 pak_raj_border_issue_ultimatum: "Emitir un ultimátum territorial"
 pak_raj_border_issue_ultimatum_desc: "Exigir el estado exacto que respalda nuestro impulso local. El rechazo permite un objetivo de guerra limitado contra ese estado."
 pak_raj_border_ultimatum_tt: "El rival puede devolver el estado en disputa o rechazar la demanda y arriesgar una guerra limitada."
 pak_raj_border_tension_90_required_tt: "Tensión Bilateral Indo-Pakistani es por lo menos 90"
 pak_raj_border_stand_down: "Abajo de la crisis"
 pak_raj_border_stand_down_desc: "Terminar la crisis, reducir la Tensión bilateral en 30 y aceptar una pérdida de Apoyo a la guerra."
 pak_raj_border_stand_down_tt: "§GEncaja la crisis y reduce la Tensión Bilateral Indo-Pakistani en 30§!"
 pak_raj_border_reject_ultimatum_tt: "§REl emisor puede crear un objetivo de guerra limitado para el estado disputado§!"
 pak_raj_border_mediation_offer_tt: "El escalador de crisis decidirá si aceptar la mediación estadounidense."
