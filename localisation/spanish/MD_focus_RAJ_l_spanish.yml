 RAJ_PAK_border_conflict_category: "Conflicto fronterizo de Indo-Pakistani"
 RAJ_PAK_border_conflict_category_desc: "[RAJ.GetNameDefCap] y [PAK.GetNameDefCap] permanecen divididos sobre Jammu y Cachemira y una frontera fuertemente militarizada. Los ejercicios, las incursiones y los intercambios de artillería pueden construirse hacia enfrentamientos limitados o una crisis diplomática. El progreso se rastrea por separado para cada estado impugnado.\n\n$border_readiness_RAJ$: [?RAJ.pak_raj_border_readiness|Y0]\n$border_readiness_PAK$: [?PAK.pak_raj_border_readiness|Y0]\n$pak_raj_border_tension$: [?global.pak_raj_border_tension|Y0]\n\n§YFrontier States§! (80 claim progress required to press a claim):\n[420.Owner.GetFlag] [420.GetName]: [?THIS.pak_raj_border_progress_420|Y0]\n[427.Owner.GetFlag] [427.GetName]: [?THIS.pak_raj_border_progress_427|Y0]\n[429.Owner.GetFlag] [429.GetName]: [?THIS.pak_raj_border_progress_429|Y0]\n[563.Owner.GetFlag] [563.GetName]: [?THIS.pak_raj_border_progress_563|Y0]\n[573.Owner.GetFlag] [573.GetName]: [?THIS.pak_raj_border_progress_573|Y0]\n[426.Owner.GetFlag] [426.GetName]: [?THIS.pak_raj_border_progress_426|Y0]\n[987.Owner.GetFlag] [987.GetName]: [?THIS.pak_raj_border_progress_987|Y0]\n[984.Owner.GetFlag] [984.GetName]: [?THIS.pak_raj_border_progress_984|Y0]\n\nEl ejército asigna un estado fronterizo como nuestro sector activo a la vez, y cada preparación es escenario de él. Un nuevo sector se extrae de los estados fronterizos que controlamos una vez terminada la preparación actual."
 RAJ_CHI_border_conflict_category: "Conflicto Fronterizo Sino-Indiano"
 RAJ_CHI_border_conflict_category_desc: "[RAJ.GetNameDefCap] y [CHI.GetNameDefCap] disputan varias secciones de la Línea de Control Actual, desde Aksai Chin y Ladakh a Sikkim y Arunachal Pradesh. Las operaciones requieren fuerzas locales y construyen el impulso sólo hacia el estado donde se produjeron los combates.\n\n$border_readiness_RAJ$: [?RAJ.raj_chi_border_readiness|Y0]\n$border_readiness_CHI$: [?CHI.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$: [?global.raj_chi_border_tension|Y0]\n\n§YFrontier States§! (80 claim progress required to press a claim):\n[475.Owner.GetFlag] [475.GetName]: [?THIS.raj_chi_border_progress_475|Y0]\n[982.Owner.GetFlag] [982.GetName]: [?THIS.raj_chi_border_progress_982|Y0]\n[591.Owner.GetFlag] [591.GetName]: [?THIS.raj_chi_border_progress_591|Y0]\n[993.Owner.GetFlag] [993.GetName]: [?THIS.raj_chi_border_progress_993|Y0]\n\nEl ejército asigna un estado fronterizo como nuestro sector activo a la vez, y cada preparación es escenario de él. Un nuevo sector se extrae de los estados fronterizos que controlamos una vez terminada la preparación actual."
 border_war_axis_requirements_tt: "Debemos poseer y controlar el estado fuente, colocar al menos una división allí, y enfrentar al rival en el estado objetivo. Estas condiciones se revisan de nuevo cuando terminan los preparativos."
 border_war_capture_requirements_tt: "Debemos mantener un estado de origen adyacente con al menos una división mientras que el rival posee y controla el objetivo. Estas condiciones se revisan de nuevo cuando la operación termina."
