 raj_chi_border_train_mechanized_desc: "Realizar un ejercicio mecanizado de gran altitud de quince días con las divisiones mecanizadas y motorizadas estacionadas en [From.GetName], nuestro sector fronterizo asignado. Cuesta 20 de poder de mando. Las unidades desplegadas sufren desgaste mientras dure. Aumenta la Preparación en 8, con riesgo de accidente. Retirarlas antes de los quince días entrega esos mismos 8 de Preparación a nuestro rival.\n\nCuando termine el ejercicio, el ejército asigna un nuevo sector fronterizo."
