 raj_chi_border_train_army_desc: "Realizar un ejercicio de gran altitud de quince días con las divisiones que guarnecen [From.GetName], nuestro sector fronterizo asignado. Cuesta 20 de poder de mando. Las unidades desplegadas sufren desgaste mientras dure. Aumenta la Preparación en 3. Sacar a la guarnición antes de los quince días entrega esos mismos 3 de Preparación a nuestro rival.\n\nCuando termine el ejercicio, el ejército asigna un nuevo sector fronterizo."
