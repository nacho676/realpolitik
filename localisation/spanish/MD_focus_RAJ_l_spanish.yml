l_spanish:
 Cheap_Labor: "Mano de Obra Barata"
 Cheap_Labor_desc: "Nacido de patrones históricos de explotación colonial y mano de obra masiva no calificada, la fuerza laboral de [ROOT.GetName] sigue siendo abundante y barata. Aunque este excedente de mano de obra ha impulsado el crecimiento industrial post-independencia, continúa alimentando un ciclo de desigualdad y agitación social que pone en peligro la estabilidad nacional."
 RAJ_iri_fake_ns: "Industria Militar Altamente Corrupta"
 RAJ_iri_fake_ns_desc: "El complejo legado de la era del Raj de Licencias de la India, caracterizado por una regulación pesada y una burocracia excesiva, aún persiste en la industria de defensa. Aunque las reformas de la década de 1990 abrieron puertas para la expansión industrial civil, el sector militar sigue siendo una red de corrupción e ineficiencia, rastreada hasta procesos de adquisición opacos y la falta de responsabilidad heredada de décadas pasadas."
 RAJ_re_fake_militar: "Ejército Altamente Desorganizado"
 RAJ_re_fake_militar_desc: "La sombra de la Partición de la India y las estructuras militares organizadas apresuradamente que siguieron se ciernen sobre las fuerzas armadas. Junto con las ineficiencias burocráticas y la falta de métodos de coordinación modernos, esto resulta en un aparato militar desorganizado. Sin embargo, estas deficiencias hacen evidente dónde se necesita mejorar con más urgencia, reduciendo ligeramente el drenaje de recursos al reestructurar las doctrinas militares."
 india_divided: "Regionalismo Indio"
 india_divided_desc: "La vasta diversidad cultural y lingüística de la India, legado de su rica historia e innumerables reinos, a menudo se ha manifestado como regionalismo que complica la gobernanza nacional. Este mosaico de intereses locales ha socavado históricamente el poder político centralizado, haciendo cohesiva la formulación de políticas una ardua tarea. Sin embargo, existen varios caminos - tanto conciliatorios como contundentes- para navegar por este complejo paisaje y potencialmente forjar una identidad nacional más unificada."
 RAJ_gujarat_trouble_idea: "Inestabilidad Comunal en Gujarat"
 RAJ_gujarat_trouble_idea_desc: "Las tensiones comunales en Gujarat, legado de divisiones religiosas y étnicas profundamente arraigadas, se han intensificado en un conflicto abierto entre musulmanes e hindúes. La situación no sólo desestabiliza la región sino que también reduce los recursos militares y administrativos, lo que afecta a la preparación y durabilidad de las tropas desplegadas en condiciones difíciles. Este malestar persiste hasta que tanto la opinión hindú como musulmana se recuperen a 35 o más, y la opinión de fe superior lo facilita aún más."
 RAJ_looming_water: "Escasez de Agua"
 RAJ_looming_water_desc: "La aguda escasez de agua en la India, empeorada por prácticas agrícolas insostenibles y una rápida urbanización, tiene consecuencias de largo alcance. No solo tensa la estabilidad social y la gobernanza, sino que también obstaculiza gravemente las operaciones militares y el apoyo logístico. A pesar de su estado actual, los esfuerzos concertados en la gestión del agua y el desarrollo de infraestructuras podrían aliviar significativamente estos efectos debilitantes."
 india_focus: "Árbol de Enfoque Indio"
 RAJ_indian_minist_of_foreign_affairs: "Ministerio de Asuntos Exteriores indio"
 RAJ_indian_minist_of_foreign_affairs_desc: "La institucionalización de la supervisión de las políticas extranjeras centraliza la estrategia diplomática y el compromiso internacional."
 RAJ_affairm_claims_on_aksai_chin: "Afirmar Reclamaciones sobre Aksai Chin"
 RAJ_affairm_claims_on_aksai_chin_desc: "Aksai Chin ha sido un tema de controversia entre la India y China durante décadas. La India mantiene que el área es una parte integral de su territorio soberano, mientras que China afirma sus reclamaciones históricas sobre la región. La disputa sigue sin resolverse y continúa siendo un tema complejo en las relaciones entre la India y China."
 indian_event.1.t: "La India Afirma Reclamaciones sobre Aksai Chin"
 indian_event.1.d: "La India ha reafirmado una vez más sus afirmaciones inquebrantables sobre Aksai Chin, en medio de la persistente disputa territorial con China. La región disputada, situada en el sector oriental de Jammu y Cachemira, ha sido un punto de contención de larga data entre los dos vecinos asiáticos. El gobierno indio reafirmó su posición, afirmando que Aksai Chin es parte integral del territorio soberano de la India. Esta reafirmación viene como una respuesta resuelta a las reivindicaciones históricas de China sobre la región. La disputa de Aksai Chin ha sido un reto significativo en las relaciones India-China, con ambas naciones que tienen opiniones contrastantes sobre la propiedad legítima del territorio. Continúan los esfuerzos diplomáticos para resolver la cuestión, pero hasta ahora se ha mantenido una resolución definitiva. La firme posición de la India sobre sus reivindicaciones territoriales subraya su compromiso de salvaguardar la soberanía nacional y preservar la unidad de sus fronteras. El Gobierno sigue abierto al diálogo constructivo y a las negociaciones pacíficas para hacer frente a la controversia de larga data y forjar un camino adelante en interés de la estabilidad y la cooperación regionales. A medida que evoluciona la situación, tanto la India como China están siendo vigilados de cerca por la comunidad internacional, que espera una resolución amistosa para reducir las tensiones y fomentar el entendimiento mutuo."
 indian_event.1.a: "Interesante"
 indian_event.2.t: "India retira las reclamaciones de Aksai Chin!"
 indian_event.2.d: "En un movimiento significativo e inesperado, la India ha anunciado su decisión de retirar las reclamaciones sobre la región en disputa de Aksai Chin, situada en la parte oriental de Jammu y Cachemira. El territorio ha sido un punto de contención de larga data entre la India y China, llevando a relaciones tensas entre los dos países. La decisión del gobierno indio de renunciar a las reclamaciones sobre Aksai Chin llega como un paso audaz hacia encontrar una resolución pacífica a la disputa territorial. Aunque la región ha sido un tema controvertido durante décadas, este sorprendente movimiento refleja el compromiso de la India de fomentar el diálogo y desescalar las tensiones con su nación vecina. La retirada de las reclamaciones sobre Aksai Chin tiene como objetivo crear una atmósfera propicia para negociaciones constructivas con China, con esperanzas de una solución mutuamente aceptable que respete los intereses de ambos países. Este desarrollo inesperado es probable que capte la atención de la comunidad internacional, y los observadores esperan la respuesta de China al movimiento de la India. La decisión marca un posible punto de inflexión en las relaciones entre la India y China y podría abrir nuevas posibilidades para la estabilidad regional y la cooperación. A medida que la situación evoluciona, tanto la India como China se espera que se involucren en conversaciones diplomáticas para explorar el camino a seguir, asegurando la coexistencia pacífica y la prosperidad de los dos gigantes asiáticos."
 RAJ_friendship_with_china: "Amistad con China"
 RAJ_friendship_with_china_desc: "Deberíamos olvidar nuestros conflictos pasados y asegurar una paz completa y estable entre nuestros países."
 RAJ_strat_milcoop_china: "Cooperación Militar con China"
 RAJ_strat_milcoop_china_desc: "La cooperación militar con China es altamente necesaria para que nuestros ejércitos cooperen e incrementen nuestra eficiencia en batalla."
 RAJ_partnership_with_tajikistan: "Asociación con Tayikistán"
 RAJ_partnership_with_tajikistan_desc: "La India y Tayikistán comparten un fuerte vínculo de amistad basado en lazos históricos, culturales y estratégicos. Ambas naciones tienen una larga historia de interacciones cercanas e intercambio cultural. La India ha estado proporcionando asistencia para el desarrollo y experiencia técnica a Tayikistán en varios sectores, incluyendo el desarrollo de infraestructuras, educación y atención médica. Además, ambos países han cooperado en los campos de defensa y seguridad, con la India entrenando al personal de defensa de Tayikistán y proporcionando ayuda militar. Tayikistán, por su parte, ha apoyado consistentemente la postura de la India en varios temas internacionales."
 RAJ_withdraw_claims_on_aksai_chin: "Retirar Reclamaciones de Aksai Chin"
 RAJ_withdraw_claims_on_aksai_chin_desc: "Retirar las reclamaciones de Aksai Chin es esencial para desarrollar relaciones con China y aliviar las tensiones entre nuestros países."
 RAJ_aksai_chin_withdraw_tt: "§YYa no podremos participar en conflictos fronterizos con §B[CHI.GetNameDef]§! sobre Aksai Chin.§!"
 RAJ_push_the_kasmir_question: "Impulsar la Cuestión de Cachemira"
 RAJ_push_the_kasmir_question_desc: "Impulsar la Cuestión de Cachemira es crucial para presionar a Pakistán agresivo!"
 RAJ_kashmir_quest_tt: "§YEsto aumentará las tensiones indo-pakistaníes§!"
 RAJ_increase_regional_influence: "Aumentar la Influencia Regional"
 RAJ_protect_asian_allies: "Proteger a los Aliados Asiáticos"
 RAJ_protect_asian_allies_desc: "Para contrarrestar el Dominio de China en la Región, deberíamos apoyar a Myanmar y sus asuntos."
 RAJ_partnership_with_iran: "Asociación con Irán"
 RAJ_partnership_with_iran_desc: "Los vínculos con Irán proporcionan acceso al comercio y presencia estratégica en la región del Océano Índico."
 RAJ_increase_regional_influence_desc: "Ampliación de la influencia política y económica en todo el Asia meridional y el Océano Índico."
 RAJ_new_army_idea: "Nuevo Ejército Indio"
 RAJ_indian_saarc_idea: "SAARC"
 RAJ_indian_saarc_idea_desc: "La Asociación del Asia Meridional para la Cooperación Regional, establecida en 1985, se une a los principales estados del Asia meridional para el desarrollo y la coordinación de políticas. El liderazgo indio del bloque añade peso político al gabinete y mejora las relaciones comerciales con los Estados miembros."
 RAJ_saarc: "Asociación del Sur de Asia para la Cooperación Regional"
 RAJ_saarc_desc: "Los lazos de SAARC se unen a Asia meridional mediante el comercio y el desarrollo, aunque las tensiones regionales limitan una mayor integración."
 indian_event.3.t: "La India nos invita a la Asociación del Sur de Asia para la Cooperación Regional"
 indian_event.3.d: "La India nos invita a la Asociación del Sur de Asia para la Cooperación Regional, ¿deberíamos aceptar unirnos?"
 indian_event.3.a: "Por supuesto"
 indian_event.3.b: "Lo siento, no"
 RAJ_act_east_policy: "Política de Actuar hacia el Este"
 RAJ_act_east_policy_desc: "La intensificación del compromiso entre Asia y el Pacífico gira en torno a la India hacia Asia sudoriental y la integración económica regional."
 act_east_pol_tt: "§YComenzaremos el Programa de la Política de Actuar hacia el Este§!"
 RAJ_asean_partner: "Asociación con ASEAN"
 RAJ_asean_partner_desc: "La asociación con la ASEAN fortalece los vínculos de Asia sudoriental mediante el comercio y la coordinación política, a pesar de las rivalidades regionales."
 RAJ_east_asia_summit: "Cumbre de Asia Oriental"
 RAJ_east_asia_summit_desc: "En línea con nuestra Política de Actuar hacia el Este, asistir a la Cumbre de Asia Oriental representa un paso crucial para profundizar nuestros lazos diplomáticos y esfuerzos colaborativos. Al forjar lazos más fuertes con actores clave como Rusia, Japón y Laos, allanamos el camino para un futuro regional más integrado y armonioso."
 RAJ_eastas.1.t: "Cumbre de Asia Oriental"
 RAJ_eastas.1.d: "La 18ª Cumbre de Asia Oriental (EAS) se reunió virtualmente hoy, reuniendo a líderes de 18 países miembros para discutir desafíos regionales apremiantes y mejorar la cooperación en la región de Asia Oriental. Organizada por Singapur, la cumbre sirvió como una plataforma para un diálogo y colaboración abiertos, con el objetivo de fomentar la paz, la estabilidad y la prosperidad en la región. La EAS vio la participación de líderes que representan a los estados miembros de ASEAN, junto con Australia, China, la India, Japón, Nueva Zelanda, Corea del Sur, Rusia y los Estados Unidos. Esta reunión diversa e inclusiva refleja el compromiso de la cumbre con el compromiso regional inclusivo y el diálogo. Durante la cumbre, los líderes participaron en discusiones francas sobre una amplia gama de temas, incluyendo la recuperación económica en la era post-pandemia, estrategias de mitigación y adaptación al cambio climático, seguridad marítima, esfuerzos contra el terrorismo y medidas para combatir los delitos transnacionales. Además, los líderes abordaron desafíos geopolíticos y enfatizaron la importancia de mantener el derecho internacional, respetar la soberanía y mantener un orden basado en reglas en la región del Indo-Pacífico."
 RAJ_eastas.1.o1: "Interesante"
 RAJ_neutrality_idea: "La Política de Neutralidad"
 RAJ_neutrality_idea_desc: "La política de neutralidad de la India es mantener nuestro delicado equilibrio de permanecer fuera de los problemas del mundo. Es hora de que tomemos el camino de movernos de estos grupos y declarar a la India una nueva nación neutral."
 RAJ_bimstek: "BIMSTEC"
 RAJ_bimstek_desc: "La Iniciativa de la Bahía de Bengala para la Cooperación Técnica y Económica Multisectorial es una organización regional compuesta por siete naciones que rodean la Bahía de Bengala: la India, Bangladesh, Sri Lanka, Bután, Nepal, Myanmar y Tailandia. Establecida en 1997, BIMSTEC tiene como objetivo promover la cooperación en varios sectores, incluyendo comercio, inversión, energía, tecnología, turismo y contraterrorismo, entre otros. Esta agrupación subregional está estratégicamente posicionada para mejorar la conectividad y la integración económica en el sur y el sudeste de Asia. Aunque BIMSTEC tiene un tremendo potencial, el progreso ha sido a veces obstaculizado por desafíos políticos y logísticos, incluyendo la conectividad limitada entre sus estados miembros. Sin embargo, sigue siendo una plataforma significativa para fomentar la cooperación y el desarrollo en una región geográfica y culturalmente diversa, particularmente a medida que las naciones buscan fortalecer la estabilidad regional y el crecimiento económico."
 RAJ_indian_bimstek_idea: "BIMSTEC"
 RAJ_indian_bimstek_idea_desc: "La Iniciativa de la Bahía de Bengala para la Cooperación Técnica y Económica Multisectorial, fundada en 1997, vincula a la India con Bangladés, Sri Lanka, Bután, Nepal, Myanmar y Tailandia en un trabajo coordinado de comercio, energía y antiterrorismo. La cooperación impulsa modestas mejoras en la velocidad de investigación interna y la estabilidad política."
 indian_event.4.t: "Invitación a BIMSTEC"
 indian_event.4.d: "La India nos invita al programa de asociación BIMSTEC, ¿deberíamos unirnos?"
 indian_event.4.a: "Claro!"
 indian_event.4.b: "Lo siento, no"
 RAJ_befriend_butan_and_nepal: "Hacer Amistad con Nepal y Bután"
 RAJ_befriend_butan_and_nepal_desc: "La India, Bután y Nepal comparten profundos lazos históricos, culturales y geográficos. Históricamente, la India ha jugado un papel crucial en el desarrollo y la estabilidad de estas naciones himalayas. Bután disfruta de una relación única con la India, marcada por una estrecha cooperación diplomática, económica y estratégica. La India ha asistido a Bután en varios proyectos de desarrollo y asuntos de seguridad, manteniendo una fuerte y amistosa asociación."
 RAJ_support_nov_idea: "Apoyo Militar Indio"
 RAJ_support_neaplese_army: "Apoyo al Ejército de Nepal"
 RAJ_support_neaplese_army_desc: "La cooperación militar indo-nepalesa tiene una base histórica basada en la proximidad geográfica y las preocupaciones de seguridad mutua. Los dos países tienen una tradición de intercambios militares, entrenamiento y estrechos lazos de defensa. La India ha sido un proveedor significativo de equipos militares a Nepal, incluyendo armas, municiones y hardware. Ambas naciones colaboran en temas como el contraterrorismo, la gestión de desastres y el mantenimiento de la estabilidad regional. Además, los regimientos Gurkha en el Ejército Indio tienen una fuerte conexión histórica con Nepal, reclutando soldados de la región."
 RAJ_mutual_trade_agreements: "Acuerdos Comerciales Mutuos"
 RAJ_mutual_trade_agreements_desc: "La cooperación comercial indo-butanesa está caracterizada por una fuerte y multifacética asociación económica, profundamente arraigada en lazos históricos y mutuos intereses. Bután es un beneficiario significativo del apoyo económico y la asistencia para el desarrollo de la India, con la India siendo el mayor socio comercial y fuente de inversión extranjera de Bután. Las áreas clave de cooperación incluyen proyectos hidroeléctricos, donde las empresas indias están involucradas en empresas conjuntas para desarrollar el abundante potencial hidroeléctrico de Bután. Esto no solo ayuda al crecimiento económico de Bután, sino que también satisface las necesidades energéticas de la India."
 RAJ_befriend_bangladesh: "Hacer Amistad con Bangladesh"
 RAJ_befriend_bangladesh_desc: "El comercio entre la India y Bangladesh ha aumentado, impulsado por una mejor infraestructura y acuerdos comerciales preferenciales. Ambos países han colaborado en grandes proyectos como la construcción de autopistas transfronterizas y líneas de transmisión de energía, mejorando la conectividad regional. Además, han trabajado juntos en temas como el contraterrorismo, la seguridad y la gestión de desastres."
 RAJ_defense_bangladesh: "Pacto de Defensa de Bangladesh"
 RAJ_defense_bangladesh_desc: "A través de una serie de acuerdos y entendimientos, la India y Bangladesh han fortalecido realmente sus lazos de defensa. Deberíamos ratificar un acuerdo marco para la cooperación en defensa que es históricamente significativo porque avanzará significativamente nuestra alianza de seguridad. Este marco aborda intercambios militares mejorados, entrenamiento y cooperación en contraterrorismo y seguridad marítima."
 RAJ_border_agreements: "Acuerdos Fronterizos con Bangladesh"
 RAJ_border_agreements_desc: "Además de eliminar una fuente significativa de fricción, esta decisión abrirá la puerta para más conectividad y cooperación entre los dos países. Más de 50,000 personas que viven en enclaves podrán intercambiar, obteniendo la ciudadanía en sus naciones de origen. Además, permitirá llevar a cabo una serie de proyectos de desarrollo, como la construcción de carreteras, puentes y otras infraestructuras a lo largo de las nuevas áreas fronterizas establecidas."
 indian_event.5.t: "Acuerdo fronterizo con la India"
 indian_event.5.d: "La India propone un acuerdo fronterizo con nosotros para que podamos resolver nuestras disputas fronterizas y continuar la cooperación mutua."
 indian_event.5.a: "Claro."
 indian_event.5.b: "Esto es demasiado!"
 RAJ_suppress_probangl_separat: "Suprimir el Separatismo Pro-Bangladesh"
 RAJ_suppress_probangl_separat_desc: "Aunque nuestros lazos de defensa con Bangladesh se han fortalecido, aún existe un sentimiento marginal que aboga por una unión más estrecha con nuestro vecino del este. Es fundamental para la integridad nacional que abordemos y suprimamos estas inclinaciones separatistas, asegurando una India estable y unida."
 RAJ_approach_singapore: "Acercarse a Singapur"
 RAJ_approach_singapore_desc: "Singapur es nuestro socio neutral de larga data en la región asiática. Necesitamos mejorar nuestra relación con ellos."
 RAJ_meaf: "MEAF"
 RAJ_meaf_desc: "Los mercados de Oriente Medio y África se han vuelto bastante importantes después de varias transformaciones en sus regiones. Necesitamos mejorar las relaciones con ellos no solo en comercio, sino también en términos militares y políticos."
 RAJ_partnership_with_uae: "Asociación con EAU"
 RAJ_partnership_with_uae_desc: "Fortalecer los lazos con los Emiratos Árabes Unidos amplía el comercio del Golfo y la influencia estratégica."
 RAJ_gulf_oil_deal: "Acuerdo Petrolero del CCG"
 RAJ_gulf_oil_deal_desc: "La India tiene una gran necesidad de combustible y petróleo. La cooperación con los países del Golfo es una clave directa para satisfacer nuestras necesidades."
 RAJ_oman_military_base: "Base Militar de Omán"
 RAJ_oman_military_base_desc: "Omán e India comparten no solo lazos culturales e históricos, sino también políticos, así como intereses comunes en la región. Necesitamos fortalecer los lazos."
 RAJ_befriend_algeria: "Amistad con Argelia"
 RAJ_befriend_algeria_desc: "Argelia es uno de los pocos países con los que tenemos un alto volumen de comercio en el Norte de África. Quizás pronto quieran profundizar su relación con nosotros y necesitamos crear un buen terreno para esto."
 RAJ_utilizing_indian_diaspora: "Lazos de la Diáspora"
 RAJ_utilizing_indian_diaspora_desc: "Aprovechar la diáspora india mundial aumenta las conexiones comerciales y la influencia diplomática en el extranjero."
 RAJ_mauritius: "Amistad con Mauricio"
 RAJ_mauritius_desc: "Hay una diáspora significativa en Mauricio, que tiene una gran influencia en la política del país. Es hora de usar esto para fortalecer los lazos."
 RAJ_srilank_relat: "Amistad con Sri Lanka"
 RAJ_srilank_relat_desc: "Históricamente, las relaciones entre Sri Lanka e India han sido muy cordiales. Teniendo raíces históricas, la gente de Sri Lanka nos trata con mucha amabilidad. Podemos considerar a este país como fraternal y nuestras relaciones con ellos deben mejorarse."
 RAJ_seychelles: "Amistad con Seychelles"
 RAJ_seychelles_desc: "Seychelles ha buscado durante mucho tiempo encontrar una alternativa geopolítica para fortalecer los lazos comerciales, las capacidades de defensa y la cooperación en términos de tecnología. La amistad con India es una elección natural para ellos."
 RAJ_tradepar_china: "Asociación Comercial con China"
 RAJ_tradepar_china_desc: "A pesar de tener relaciones tensas con China, la asociación comercial con ellos sigue siendo necesaria para ambas economías."
 RAJ_eastern_affiars: "Asuntos del Este"
 RAJ_eastern_affiars_desc: "La India disfruta tradicionalmente de buenas relaciones con los poderes emergentes. Debemos aprovecharlo para mejorar las relaciones diplomáticas y comerciales."
 RAJ_stratpar_russi: "Asociación Estratégica con Rusia"
 RAJ_stratpar_russi_desc: "A pesar de las buenas relaciones entre China y Rusia, Rusia ha sido nuestro socio confiable en el campo del comercio y la defensa desde los tiempos de la URSS. Es hora de renovar esta relación."
 RAJ_stratpar_soaf: "Asociación Estratégica con Sudáfrica"
 RAJ_stratpar_soaf_desc: "Sudáfrica es una de las economías de más rápido crecimiento en el mundo. Al igual que nosotros, están comprometidos a mejorar el comercio global y encontrar socios."
 RAJ_stratpar_braz: "Asociación Estratégica con Brasil"
 RAJ_stratpar_braz_desc: "Brasil lleva mucho tiempo en términos remotamente buenos. Debemos encontrar métodos para mejorar el comercio con ellos y fortalecer los vínculos políticos."
 RAJ_looking_west: "Mirando al Oeste"
 RAJ_looking_west_desc: "A pesar de su posición tradicionalmente neutral, India tiene relaciones relativamente buenas con los países occidentales, que vienen no solo del comercio, sino también de un enemigo común: China."
 RAJ_friendship_with_israel: "Amistad con Israel"
 RAJ_friendship_with_israel_desc: "Las relaciones entre India e Israel tienen una larga historia de cooperación conjunta. En el nuevo siglo XXI, estas conexiones necesitan ser confirmadas."
 RAJ_friendship_with_france: "Amistad con Francia"
 RAJ_friendship_with_france_desc: "Después de firmar un pacto estratégico con Francia en 1998, Francia se convirtió en uno de los mayores socios de India dentro de la OTAN. Estas relaciones necesitan ser profundizadas de manera productiva."
 RAJ_become_major_non_nato_allies: "Aliado de la OTAN"
 RAJ_become_major_non_nato_allies_desc: "Quizás, para poder enfrentarnos a China y Pakistán, necesitamos mejorar las relaciones con Occidente lo suficiente como para firmar una asociación con la OTAN o incluso algo más. Dadas las tendencias actuales, quizás Occidente nos reciba con los brazos abiertos."
 RAJ_military_coop_with_us: "Cooperación Militar-Técnica con EE.UU."
 RAJ_military_coop_with_us_desc: "EE.UU. es una superpotencia, con los desarrollos más avanzados en términos de defensa. Necesitamos cooperar con ellos y mejorar nuestras capacidades de defensa."
 RAJ_tradedeals_with_us: "Acuerdos Comerciales con EE.UU."
 RAJ_tradedeals_with_us_desc: "El comercio con los Estados Unidos es un paso consistente en nuestra política de cooperación con Occidente. Encontraremos algo que nos interese mutuamente en términos de comercio."
 indian_event.6.t: "Propuesta India"
 indian_event.6.d: "Desde el reciente alineamiento de India con nosotros, nos piden que revocamos el estatus de Aliado Mayor No OTAN de Pakistán."
 indian_event.6.a: "Claro!"
 indian_event.6.b: "Lo siento, no"
 indian_event.667.t: "EE.UU. está de acuerdo."
 indian_event.667.d: "Ellos eliminarán el estatus de MNNA de Pakistán."
 indian_event.667.a: "Genial"
 indian_event.668.t: "EE.UU. rechazó nuestra propuesta."
 indian_event.668.d: "Pakistán seguirá siendo un aliado mayor no OTAN de EE.UU."
 indian_event.668.a: "Disappointing."
 RAJ_support_taiwan: "Apoyo a Taiwán"
 RAJ_support_taiwan_desc: "Aunque Taiwán reclama muchos territorios que son contrarios a nuestros intereses, puede valer la pena apoyarlos contra un enemigo común: la RPC."
 RAJ_indian_modern_prog: "Solicitud de USAID"
 RAJ_indian_modern_prog_desc: "Los programas de ayuda estadounidenses se han vuelto comunes en India. Puede valer la pena mejorar y fortalecer la cooperación en esta área."
 RAJ_joining_nato: "Una alianza de la OTAN"
 RAJ_joining_nato_desc: "La OTAN opera exclusivamente en la región euroatlántica, por lo que la membresía total está fuera de alcance. Aún podemos seguir con lo mejor: el estatus de Major Non-NATO Ally, abriendo la puerta a ejercicios conjuntos, transferencias tecnológicas y una relación de defensa privilegiada con Occidente."
 RAJ_SCO_join: "Unión a la OCS"
 RAJ_SCO_join_desc: "Aunque nuestra relación con China es tensa, nuestra relación con Rusia es bastante productiva. Quizás podamos ingresar a la estructura de la OCS, a pesar de todas las contradicciones con la RPC."
 RAJ_cont_non_aligned_polic: "Continuar el Camino No Alineado"
 RAJ_cont_non_aligned_polic_desc: "India tradicionalmente ha estado en el camino de la no alineación y la neutralidad completa. No debemos buscar nuevos aliados y cruzar los límites de lo permitido. Debemos mantener nuestra distancia."
 RAJ_isolationist_policies: "Políticas de Aislamiento"
 RAJ_isolationist_policies_desc: "A pesar de nuestro comercio, el aislamiento social del resto del mundo puede ser beneficioso."
 RAJ_boosting_our_local_market: "Impulsar el mercado local"
 RAJ_boosting_our_local_market_desc: "Fortalecer el mercado interno es un paso consistente hacia lograr la autonomía completa de India en este mundo."
 RAJ_active_support_of_stete_woned_shiet: "Apoyo Activo"
 RAJ_active_support_of_stete_woned_shiet_desc: "Debemos apoyar no solo las relaciones de mercado en el país, sino también las corporaciones estatales que regularán los aspectos más importantes de la economía."
 RAJ_india_first: "India Primero"
 RAJ_india_first_desc: "India debe estar por encima de todo. Estamos solos en este mundo y necesitamos darnos cuenta de esto."
 RAJ_indian_autarky_effort: "Esfera de Influencia India"
 RAJ_indian_autarky_effort_desc: "Ha llegado el momento no solo de mejorar las relaciones con nuestros socios, sino también de construir nuestra propia esfera de influencia."
 RAJ_self_sufficient_market: "Nuevas Ideas de Ola"
 RAJ_self_sufficient_market_desc: "Es hora de admitir que nuestro camino es un nuevo hito en el paradigma ideológico de India: estamos construyendo nuestro propio y nuevo futuro."
 RAJ_asking_nato_help_pak: "Expulsar a Pakistán"
 RAJ_asking_nato_help_pak_desc: "Pakistán ha sido durante mucho tiempo un aliado de EE.UU. fuera de la OTAN. Necesitamos excluir su presencia en la cooperación con Occidente y tomar su lugar."
 RAJ_indias_politics: "Política India"
 RAJ_indias_politics_desc: "La política india está en el punto de inflexión de un milenio a otro. ¿Cómo se construirá su historia?"
 indian_event.7.t: "Política India"
 indian_event.7.d: "La India se enfrenta a una combinación de desafíos políticos y económicos en el nuevo milenio, ya que la nación trata de navegar por un paisaje complejo y abordar cuestiones apremiantes. El nuevo milenio produjo una serie de obstáculos que probaron la resiliencia de las instituciones democráticas y la estabilidad económica de la India. En el frente político, el país fue testigo de un paisaje político fragmentado marcado por los gobiernos de la coalición y frecuentes cambios en el liderazgo. Esto generó cierto grado de inestabilidad y impidió la aplicación de reformas cruciales. La ausencia de una clara mayoría en el gobierno central hizo que la adopción de decisiones fuera un proceso difícil, a menudo exigiendo negociaciones delicadas con diversos asociados regionales e ideológicos. Económicamente, la India luchó con problemas persistentes como déficit fiscal, lento crecimiento industrial y desempleo. La economía se enfrentaba a obstáculos para capitalizar plenamente las reformas iniciadas en el decenio de 1990, y algunos sectores experimentaron un crecimiento lento. Los desafíos estructurales, la cinta roja burocrática y la infraestructura inadecuada obstaculizaron la facilidad de hacer negocios y limitaron el potencial del país para una rápida expansión económica. Además, la India fue testigo de los efectos devastadores del estallido de burbujas de punto-com, que tuvo efectos en el sector de la tecnología de la información india. Varias empresas de tecnología de la información se enfrentaban a contratiempos, ya que los mercados mundiales experimentaron un retroceso, lo que dio lugar a despidos y tensiones financieras dentro de la industria. En medio de estos desafíos, el gobierno se centró en las medidas normativas para impulsar el crecimiento económico, atraer inversiones extranjeras y fomentar la iniciativa empresarial. Se adoptaron medidas para mejorar el desarrollo de la infraestructura, racionalizar las reglamentaciones y estimular las actividades industriales. Sin embargo, los efectos de estas iniciativas tuvieron tiempo para manifestar y requerían esfuerzos sostenidos para producir resultados positivos. A pesar de los obstáculos enfrentados, la resiliencia y el tejido democrático de la India permanecieron intactos. La vibrante sociedad civil del país, el poder judicial independiente y la prensa libre desempeñaron funciones críticas para garantizar la rendición de cuentas y promover el discurso público sobre cuestiones vitales."
 indian_event.7.a: "Interesante"
 RAJ_atal_bihari_vajpayee: "Atal Bihari Vajpayee"
 RAJ_atal_bihari_vajpayee_desc: "Atal Bihari Vajpayee es un destacado estadista indio y una figura prominente en la política india. Sirvió como Primer Ministro de India en tres ocasiones separadas: primero por un breve período en 1996, luego de 1998 a 1999, y finalmente desde 1999. Vajpayee fue un miembro fundador del Partido Bharatiya Janata y un líder clave en el Rashtriya Swayamsevak Sangh, una organización nacionalista hindú."
 RAJ_lahore_summit_legacy: "Legado de la Cumbre de Lahore"
 RAJ_lahore_summit_legacy_desc: "La Declaración de Lahore fue un acuerdo bilateral y un tratado de gobernanza entre India y Pakistán. El tratado fue firmado el 21 de febrero de 1999, al concluir una cumbre histórica en Lahore, y ratificado por los parlamentos de ambos países el mismo año. Según los términos del tratado, se alcanzó un entendimiento mutuo hacia el desarrollo de arsenales atómicos y para evitar el uso operativo no autorizado y accidental de armas nucleares. La Declaración de Lahore añadió responsabilidad a los líderes de ambas naciones para evitar la carrera nuclear, así como conflictos no convencionales y convencionales."
 RAJ_prevention_of_terror_act: "Ley de Prevención del Terrorismo"
 RAJ_prevention_of_terror_act_desc: "Ley N.º 15 de 2002, una ley para hacer disposiciones para la prevención y el manejo de actividades terroristas y para asuntos relacionados con ellas."
 indian_event.8.t: "Calmar las Protestas de Gujarat"
 indian_event.8.d: "El descontento fue provocado por un incidente en el que un tren que transportaba peregrinos hindúes fue incendiado, resultando en la muerte de varias personas. El incidente se atribuyó a un presunto ataque de una multitud musulmana. Las secuelas del incidente del tren vieron una violencia generalizada, con enfrentamientos comunitarios entre comunidades hindúes y musulmanas en varias partes de Gujarat. Las protestas y los disturbios posteriores resultaron en la pérdida de cientos de vidas, heridos y daños significativos a la propiedad. ¿Qué debemos hacer?"
 indian_event.8.a: "Modi hará el trabajo!"
 indian_event.8.b: "Esperemos que las protestas se calmen por sí solas."
 RAJ_settling_down_gujarat: "Calmar las Protestas de Gujarat"
 RAJ_settling_down_gujarat_desc: "La violencia estalló tras un incendio de trenes en Godhra, que reclamó la vida de 59 personas, principalmente peregrinos hindúes. Posteriormente se produjeron enfrentamientos comunales generalizados en varias partes de Gujarat, lo que dio lugar a la pérdida de cientos de vidas y al desplazamiento de miles de personas."
 RAJ_eastas.2.t: "Las Naciones Forman una Nueva Alianza para Fortalecer la Cooperación Económica Global"
 RAJ_eastas.2.d: "En un desarrollo significativo para la economía global, las naciones de Brasil, Rusia, India y China han formado oficialmente una alianza conocida como BRIC. La creación de esta nueva alianza tiene como objetivo fortalecer la cooperación económica, mejorar los lazos comerciales y fomentar un mundo más interconectado. La formación de BRIC marca un punto de inflexión en la dinámica económica global, ya que estas cuatro naciones representan colectivamente una parte sustancial de la población mundial, la superficie terrestre y la producción económica. Juntas, poseen un enorme potencial para impulsar el crecimiento económico global y promover el desarrollo sostenible. La base de BRIC se basa en objetivos compartidos y beneficios mutuos. Al aprovechar sus recursos combinados, las naciones de BRIC aspiran a promover un crecimiento económico inclusivo y equilibrado, mejorar los flujos de comercio e inversión y proporcionar una plataforma para la cooperación en varios sectores, incluidas las finanzas, la energía, la infraestructura y la tecnología. Esta nueva alianza recién formada tiene una promesa significativa para los países miembros. Brasil, Rusia, India y China aportan cada uno fortalezas y capacidades únicas a la mesa. Brasil posee abundantes recursos naturales y un vibrante sector agrícola, mientras que Rusia es conocida por sus reservas de energía y su destreza tecnológica. La creciente economía de servicios de India y su mano de obra cualificada contribuyen a su poder económico, y las capacidades manufactureras y de exportación de China son reconocidas mundialmente."
 RAJ_eastas.2.o1: "Interesante"
 RAJ_BRICS: "Miembro de BRICS"
 indian_event.9.t: "Torre BRICS"
 indian_event.9.d: "Se ha propuesto un nuevo proyecto en un foro económico reciente para construir una Torre BRICS con fines de un nuevo banco internacional."
 indian_event.9.a: "Maravilloso"
 RAJ_tower_tt: "§YEsto aumentará la influencia china sobre nosotros, pero mejorará nuestra economía§!"
 RAJ_BRICS_tower_project: "Proyecto de la Torre BRICS"
 RAJ_BRICS_tower_project_desc: "Para fortalecer los lazos interestatales, necesitamos crear un nuevo Banco de Desarrollo para todos los países miembros de BRICS."
 RAJ_BRICS_bank: "Banco BRICS"
 indian_event.10.t: "Propuesta del Banco BRICS"
 indian_event.10.d: "El Banco BRICS ha propuesto un proyecto de desarrollo para cada estado miembro. ¿Deberíamos estar de acuerdo?"
 indian_event.10.a: "Claro."
 indian_event.10.b: "Lo siento, no"
 RAJ_BRICS_payment_system: "Sistema de Pago BRICS"
 RAJ_BRICS_payment_system_desc: "Para mejorar y simplificar el comercio, necesitamos crear un nuevo sistema de transacciones y pagos."
 RAJ_BRICS_cur: "Esfuerzos de Moneda Común BRICS"
 indian_event.11.t: "Proyecto de Moneda Común"
 indian_event.11.d: "BRICS ha propuesto un nuevo Proyecto de Moneda Común, ¿deberíamos estar de acuerdo?"
 indian_event.11.b: "Lo siento, no"
 RAJ_common_currenc_project: "Proyecto de Moneda Común"
 RAJ_common_currenc_project_desc: "Este proyecto puede no implementarse de inmediato, pero la conceptualización de una moneda común es una buena base para la integración mutua."
 RAJ_BRICS_contig_reserv_arrang: "Arreglo de Reserva Contingente"
 RAJ_BRICS_contig_reserv_arrang_desc: "El Arreglo de Reserva Contingente de BRICS es un marco para proporcionar protección contra las presiones de liquidez global. Esto incluye problemas de moneda donde las monedas nacionales de los miembros se ven adversamente afectadas por las presiones financieras globales."
 RAJ_eastas.3.t: "Crecimiento económico de BRICS para un futuro innovador."
 RAJ_eastas.3.d: "La 11.ª Cumbre de los BRICS, celebrada en Brasilia (Brasil), se ha acercado con éxito, demostrando el compromiso del Brasil, Rusia, India, China y Sudáfrica de fomentar la cooperación y impulsar el crecimiento económico. Los líderes de las naciones miembros se reunieron en la capital brasileña durante dos días de deliberaciones, debates y reuniones bilaterales. La cumbre comenzó con una ceremonia de apertura, durante la cual el Presidente del Brasil dio la bienvenida a los Jefes de Estado y destacó la importancia de fortalecer la asociación BRICS para navegar por los desafíos mundiales y desbloquear nuevas oportunidades. Los dirigentes entablaron debates amplios sobre una amplia gama de cuestiones, entre ellas el comercio, la inversión, la innovación y las preocupaciones geopolíticas."
 RAJ_eastas.3.o1: "Interesante"
 RAJ_BRICS_pro_tempore: "Cumbre en Brasil"
 RAJ_BRICS_pro_tempore_desc: "Ha llegado el momento de convocar la cumbre más grande en la historia de la organización para fortalecer las relaciones entre los estados."
 indian_event.12.t: "Invitación BRICS"
 indian_event.12.d: "Hemos sido observadores en la Organización BRICS durante mucho tiempo. Nos proponen unirnos. ¿Deberíamos hacerlo?"
 indian_event.11.a: "Por supuesto"
 indian_event.12.b: "Lo siento, no"
 RAJ_eastas.4.t: "Irán se une a BRICS"
 RAJ_eastas.4.d: "En un desarrollo significativo, Irán se ha unido oficialmente al grupo BRICS, compuesto por Brasil, Rusia, India, China y Sudáfrica. Esta expansión del bloque BRICS marca un hito en la cooperación regional y global, ya que Irán se convierte en la primera nación de Medio Oriente en unirse a la influyente asociación. La decisión se anunció durante la 12ª Cumbre de BRICS, celebrada de manera virtual debido a las circunstancias globales actuales. La inclusión de Irán en BRICS es el resultado de extensas discusiones entre los países miembros, destacando la importancia estratégica del país y su potencial para la colaboración económica. La participación de Irán no solo mejorará la influencia regional de BRICS, sino que también fomentará una mayor cooperación entre Medio Oriente y otras naciones de BRICS."
 RAJ_eastas.4.o1: "Interesante"
 RAJ_BRICS_expansion: "Expansión de BRICS"
 RAJ_BRICS_expansion_desc: "A medida que BRICS continúa evolucionando como una alianza significativa, invitar a Irán, una nación con recursos ricos y de importancia estratégica, agregará una nueva dimensión. Esta inclusión puede diversificar y fortalecer nuestra visión colectiva, fortaleciendo la influencia global de la alianza."
 RAJ_BRICS_as_econ_alliance: "Alianza Económica"
 RAJ_BRICS_as_econ_alliance_desc: "Más allá de las empresas militares, el verdadero potencial de BRICS radica en aprovechar su poder económico combinado. Al promover un frente económico unido, las naciones miembros pueden esperar un crecimiento acelerado, estabilidad financiera y sinergias mejoradas, consolidando la posición del bloque en la arena económica global."
 brics_coalition: "Pacto DEF BRICS"
 RAJ_BRICS_as_polit_alliance: "Pacto de Defensa BRICS"
 RAJ_BRICS_as_polit_alliance_desc: "Unidos en nuestros objetivos para una dinámica de poder global equilibrada, la formulación de un Pacto de Defensa BRICS es una progresión natural. Este pacto garantizará la asistencia mutua en defensa, cimentando el vínculo entre los estados miembros y asegurando la seguridad colectiva contra amenazas externas."
 RAJ_new_development_bank: "Nuevo Banco de Desarrollo"
 RAJ_new_development_bank_desc: "El nuevo Banco de Desarrollo debería convertirse en la base para la integración de BRICS y mejorar las relaciones entre los estados miembros."
 RAJ_recognition_tibet_as_china: "Reconocimiento del Tíbet como parte de China"
 RAJ_recognition_tibet_as_china_desc: "El Gobierno de India, poco después de la independencia de India en 1947, trató al Tíbet como un país independiente de facto. Sin embargo, más recientemente, la política de India sobre el Tíbet ha sido consciente de las sensibilidades chinas y ha reconocido al Tíbet como parte de China."
 RAJ_national_highway_project: "Proyecto de Autopista Nacional"
 RAJ_national_highway_project_desc: "El Proyecto de Desarrollo de Autopistas Nacionales es un proyecto de cuatro carriles de autopistas nacionales existentes y seis carriles de autopistas nacionales importantes seleccionadas de India. El proyecto comenzó en 1998 bajo el liderazgo del Primer Ministro, Atal Bihari Vajpayee. Las Autopistas Nacionales representan solo alrededor del 2% de la longitud total de las carreteras, pero transportan alrededor del 40% del tráfico total a lo largo y ancho del país."
 RAJ_eastas.5.t: "India reconoce al Tíbet como chino"
 RAJ_eastas.5.d: "En un intento por acelerar la resolución de la disputa fronteriza, India y China acordaron el martes nombrar a un representante especial para explorar, desde la perspectiva política de la relación bilateral general, un marco sobre el arreglo fronterizo. En la primera declaración conjunta de Principios de Relaciones y Cooperación Integral firmada por el Primer Ministro Atal Bihari Vajpayee y su homólogo chino Wen Jiabao, India reconoció que la Región Autónoma del Tíbet es parte del territorio de la República Popular China."
 RAJ_eastas.5.o1: "Interesante"
 RAJ_pradhan_mantri_gram_sadak_yojana: "Pradhan Mantri Gram Sadak Yojana"
 RAJ_pradhan_mantri_gram_sadak_yojana_desc: "El Pradhan Mantri Gram Sadak Yojana es un plan nacional en India para proporcionar una buena conectividad por carretera en todas las condiciones climáticas a las aldeas no conectadas."
 RAJ_article_three_seventy: "Artículo 370"
 RAJ_article_three_seventy_desc: "El artículo 370 de la constitución india otorgó un estatus especial a Jammu y Cachemira, una región ubicada en la parte norte del subcontinente indio y parte de la región más grande de Cachemira que ha sido objeto de una disputa entre India, Pakistán y China desde 1947."
 RAJ_sarva_shisha_abhiyan: "Sarva Shiksha Abhiyan"
 RAJ_sarva_shisha_abhiyan_desc: "Sarva Shiksha Abhiyan, o SSA, es un programa del Gobierno de India destinado a la universalización de la educación elemental \"de manera oportuna\", la 86ª Enmienda a la Constitución de India que hace de la educación gratuita y obligatoria para los niños entre las edades de 6 y 14 un derecho fundamental."
 RAJ_foreign_education_partner_ship: "Asociación Educativa Extranjera"
 RAJ_foreign_education_partner_ship_desc: "Nuestros estudiantes necesitan la oportunidad de obtener una educación extranjera para volverse aún más inteligentes."
 indian_event.13.t: "Operación West End"
 indian_event.13.d: "Tehelka, liderada por su fundador Tarun Tejpal, llevó a cabo una operación encubierta utilizando cámaras ocultas y periodistas encubiertos haciéndose pasar por comerciantes de armas. La operación se centró principalmente en la corrupción dentro de la industria de defensa, enfocándose en altos funcionarios y políticos que supuestamente estaban involucrados en tratos ilegales de armas y en aceptar sobornos. Durante varios meses, los periodistas encubiertos de Tehelka grabaron conversaciones con varios funcionarios, incluidos burócratas, oficiales militares y políticos. Capturaron evidencia en video que mostraba a estos individuos aceptando sobornos y discutiendo actividades ilegales relacionadas con la adquisición de defensa. La operación destacó específicamente la corrupción en la compra de equipos de defensa, como armas, municiones y vehículos. La operación salió a la luz cuando Tehelka publicó una serie de videos explosivos y artículos detallando el escándalo de corrupción. La exposición creó un gran revuelo en todo el país, llevando a la indignación pública y a demandas de acción contra los implicados en la operación. Varios personajes de alto perfil fueron atrapados en la operación encubierta, incluidos políticos de varios partidos políticos, oficiales del ejército y burócratas. Algunos de los nombres prominentes involucrados incluían al entonces presidente del Bharatiya Janata Party, Bangaru Laxman, quien fue captado en video aceptando un soborno, así como Jaya Jaitly, una política destacada del Samata Party."
 indian_event.13.a: "Despida a los responsables!"
 indian_event.13.b: "Déjelo como está."
 RAJ_operation_west_end: "Operación West End"
 RAJ_operation_west_end_desc: "La Operación West End, también conocida como el escándalo de Tehelka, se refiere a una importante operación encubierta llevada a cabo por un portal de noticias indio llamado Tehelka en 2001. La operación expuso la corrupción en el sector de defensa de la India y llevó a un escándalo a nivel nacional."
 indian_event.14.t: "Cumbre Conjunta de India y Pakistán"
 indian_event.14.d: "La cumbre fue asistida por el entonces Primer Ministro indio Atal Bihari Vajpayee y el entonces Presidente paquistaní Pervez Musharraf. El objetivo principal de la cumbre fue promover el diálogo y buscar una resolución pacífica a los conflictos entre India y Pakistán, particularmente el problema de Cachemira. Durante la cumbre, ambos líderes se involucraron en discusiones extensas sobre varios asuntos, incluyendo el conflicto de Cachemira, el terrorismo y las tensiones fronterizas. Las conversaciones se llevaron a cabo a puerta cerrada, y los detalles de las negociaciones no fueron divulgados al público en ese momento. Sin embargo, se informó que las discusiones fueron a menudo intensas e involucraron perspectivas diferentes sobre varios temas clave."
 indian_event.14.a: "Maravilloso"
 RAJ_agra_summit: "Cumbre de Agra"
 RAJ_agra_summit_desc: "La Cumbre de Agra, también conocida como la Cumbre de Paz de Agra, fue una reunión diplomática de alto nivel entre los líderes de India y Pakistán celebrada en Agra, India, en julio de 2001. La cumbre fue un intento significativo de resolver los problemas de larga data entre los dos países, incluido el conflicto de Cachemira."
 RAJ_new_defence_council_gathering_d: "Tensión en la frontera de Cachemira"
 RAJ_new_defence_council_gathering: "Reunión del Consejo de Defensa"
 RAJ_new_defence_council_gathering_desc: "No necesitamos depender de la buena voluntad de Pakistán! Es hora de convocar al Consejo de Defensa y preparar nuevamente un plan de defensa y contraataque."
 RAJ_easing_military_standoff: "Alivio del despido militar"
 RAJ_easing_military_standoff_desc: "Nuestras relaciones en la frontera con Pakistán están bastante tensas. Podría valer la pena hacer un esfuerzo para calmar la situación."
 indian_event.15.t: "Pruebas nucleares en Rajastán"
 indian_event.15.d: "Las pruebas lograron su objetivo principal de darle a la India la capacidad de construir armas de fisión y termonucleares con rendimientos de hasta 200 kilotones. El entonces Presidente de la Comisión de Energía Atómica de la India describió cada una de las explosiones de Pokhran-II como equivalentes a varias pruebas realizadas por otros estados con armas nucleares durante décadas. Posteriormente, la India estableció la capacidad de simulación por computadora para predecir los rendimientos de explosivos nucleares cuyos diseños están relacionados con los diseños de explosivos utilizados en esta prueba."
 indian_event.15.a: "Maravilloso"
 indian_event.16.t: "Inteligencia militar india"
 indian_event.16.d: "La India nos ha proporcionado información militar estratégica sobre China."
 indian_event.16.a: "Maravilloso"
 RAJ_strategic_assistance_to_us: "Asistencia estratégica a EE. UU."
 RAJ_strategic_assistance_to_us_desc: "EE. UU. será nuestro principal apoyo para enfrentar a China."
 RAJ_world_hindi_conference: "Conferencia Mundial de Hindi"
 RAJ_world_hindi_conference_desc: "La Conferencia Mundial de Hindi es un evento global que reúne a académicos, lingüistas, escritores y entusiastas del idioma hindi de todo el mundo. Esta conferencia sirve como una plataforma para promover y celebrar la riqueza y diversidad del idioma hindi y su patrimonio cultural."
 RAJ_citizenship_india: "Aparato administrativo mejorado"
 RAJ_citizenship_india_desc: "Deberíamos aumentar la posibilidad de que las personas indias obtengan la ciudadanía india y se repatríen a la India."
 RAJ_amoozesh_parvaresh: "Escuelas secundarias mejoradas"
 raj_middle_school_tt: "§YMejoraremos las escuelas secundarias indias§!"
 RAJ_middle_school_modernization: "Modernización de escuelas secundarias"
 RAJ_middle_school_modernization_desc: "Las escuelas secundarias en la India no se han modernizado desde hace mucho tiempo y requieren un cambio en el enfoque y la metodología de enseñanza."
 RAJ_good_governance_day: "Día del Buen Gobierno"
 RAJ_good_governance_day_desc: "Atal Bihari Vajpayee es bien conocido por su maravillosa forma de gobernar el país."
 RAJ_further_privatization: "Mayor privatización"
 RAJ_further_privatization_desc: "Después de cambiar el rumbo de nuestra economía, debemos continuar por el camino de una mayor privatización de nuestra economía."
 RAJ_videsh_sanchar: "Expansión de Videsh Sanchar"
 RAJ_videsh_sanchar_desc: "A medida que la India entra en el siglo XXI, debe expandir sus telecomunicaciones y proporcionar cobertura de información a todo el país."
 RAJ_hindu_primacy_economy: "Economía dominada por la ética hindú"
 RAJ_hindu_primacy_economy_desc: "La ética india debería convertirse en la base no solo de las relaciones sociales, sino también de las relaciones económicas. Solo allí podemos asegurar una competencia justa."
 RAJ_dab_on_lashkare_taiba: "Contrarrestar a Lashkar-e-Taiba"
 RAJ_dab_on_lashkare_taiba_desc: "Los grupos islamistas han estado operando de manera encubierta en nuestro país durante mucho tiempo. Es hora de encontrarlos y tomar contramedidas contra ellos."
 RAJ_terror_and_disruptive_activities_act: "Ley de terrorismo y actividades disruptivas"
 RAJ_terror_and_disruptive_activities_act_desc: "Nuestro sistema legislativo no estaba preparado para los nuevos desafíos del terrorismo del siglo XXI. Es hora de adaptarlo y hacer los ajustes necesarios."
 RAJ_joint_summit_with_pakistan: "Cumbre conjunta con Pakistán"
 RAJ_joint_summit_with_pakistan_desc: "Para tranquilizar a ambos países, se debe convocar una cumbre conjunta con Pakistán. Esto reducirá la tensión y nos permitirá cooperar en el futuro."
 RAJ_nuclear_tests_rajasthan: "Pruebas nucleares en Rajastán"
 RAJ_nuclear_tests_rajasthan_desc: "La renovación y expansión de nuestro arsenal nuclear es un precedente importante para la política de defensa india moderna. Es hora de llevar a cabo nuevas pruebas en Rajastán y estar seguros de nuestro poder."
 RAJ_iri_fake_ns2: "Industria militar altamente corrupta"
 RAJ_iri_fake_ns3: "Industria militar moderadamente corrupta"
 RAJ_iri_fake_ns4: "Industria militar ligeramente corrupta"
 RAJ_re_fake_militar2: "Ejército moderadamente desorganizado"
 RAJ_re_fake_militar3: "Ejército ligeramente desorganizado"
 RAJ_re_fake_militar4: "Ejército organizado"
 RAJ_true_tiger_economy: "Economía del tigre verdadero"
 RAJ_true_tiger_economy_desc: "Una economía de tigre es la economía de un país que experimenta un rápido crecimiento económico, generalmente acompañado de un aumento en el nivel de vida."
 indian_event.17.t: "Economía india"
 indian_event.17.d: "En el año 2000, la economía india experimentó un período de crecimiento y transformación significativos. Se caracterizó por medidas de liberalización gradual iniciadas a principios de la década de 1990, que continuaron dando forma al panorama económico. Con una población de más de mil millones de personas, la India presentó un vasto mercado de consumo y una fuerza laboral que atrajo la inversión extranjera. La economía estaba impulsada principalmente por la agricultura, la industria y los servicios. La agricultura empleaba a una gran parte de la población, contribuyendo a la seguridad alimentaria y al sustento rural. El sector industrial se expandió, con la manufactura y los textiles desempeñando roles cruciales, mientras que los servicios emergieron como un motor de crecimiento importante, particularmente en tecnología de la información y externalización de procesos comerciales."
 indian_event.17.a: "Interesante"
 RAJ_natural_competitor: "Competidor natural"
 RAJ_natural_competitor_desc: "La India es un contendiente natural en el mercado global. Debemos alcanzar y superar al mundo entero."
 indian_event.18.t: "La India pide inversiones"
 indian_event.18.d: "Los diplomáticos de la [RAJ.GetNameWithFlag] se han acercado a nuestro gobierno hoy con una propuesta interesante. Están buscando investigar inversiones y desarrollo dentro de la economía [RAJ.GetAdjective] para desarrollarla aún más. El acuerdo acercaría a nuestros dos países y, en última instancia, ayudaría a los lazos económicos entre nosotros. ¿Deberíamos aceptar sus términos?"
 indian_event.18.a: "Por supuesto"
 indian_event.18.b: "Lo siento, no"
 indian_event.19.t: "[FROM.GetName] Rechazó la oferta de inversión!"
 indian_event.19.d: "[FROM.GetName] ha rechazado nuestra oferta de inversiones. Realmente es un día triste."
 indian_event.19.a: "Ugh"
 indian_event.20.t: "[FROM.GetName] Aceptó la oferta de inversión!"
 indian_event.20.d: "[FROM.GetName] ha aceptado nuestra oferta!"
 indian_event.20.a: "Bien"
 RAJ_attract_foreign_business: "Atraer capital extranjero"
 RAJ_attract_foreign_business_desc: "Atraer capital externo es imperativo para expandir nuestra economía. Es hora de enviar ofertas lucrativas a nuestros diversos socios."
 RAJ_the_new_steel_industry: "La nueva industria del acero"
 RAJ_the_new_steel_industry_desc: "El acero es la base de la industria pesada. Sin él, es imposible crear una base competitiva para la industria. Necesitamos expandir su producción."
 RAJ_expand_the_mines: "Expandir las minas"
 RAJ_expand_the_mines_desc: "Construir una industria necesariamente requiere expandir las minas de recursos y aumentar las reservas de recursos del país."
 RAJ_subs_coal_india: "Subvencionar la Industria Minera"
 RAJ_subs_coal_india_desc: "Para fortalecer el desarrollo de la extracción de recursos en nuestro país, debemos subvencionar este sector de nuestra economía."
 RAJ_hindustan_zinc: "Hindustan Zinc"
 RAJ_hindustan_zinc_desc: "Hindustan Zinc Limited es un productor integrado de minería y recursos de zinc, plomo, plata y cadmio en la India. Es una subsidiaria de Vedanta Limited."
 RAJ_bus_nmdc: "NMDC"
 RAJ_bus_nmdc_desc: "NMDC Limited, anteriormente National Mineral Development Corporation, es una empresa del sector público indio involucrada en la exploración de mineral de hierro, cobre, roca fosfática, piedra caliza, dolomita, yeso, bentonita, magnesita, diamantes, estaño, tungsteno, grafito, carbón, etc. Es el mayor productor y exportador de mineral de hierro de la India, produciendo más de 35 millones de toneladas de mineral de hierro de tres minas mecanizadas en Chhattisgarh y Karnataka."
 RAJ_deregul_the_econ: "Desregular la economía"
 RAJ_deregul_the_econ_desc: "La desregulación de la economía es un aspecto importante para crear un mercado más dinámico y de rápido crecimiento en la India."
 RAJ_industrial_investments: "Inversiones industriales"
 RAJ_industrial_investments_desc: "Además de depender de inversores externos y varios hombres de negocios, el propio estado debe hacer esfuerzos para invertir en la industria del país."
 RAJ_indian_machine_tool_assoc: "Asociación de fabricantes de herramientas de máquinas indias"
 RAJ_indian_machine_tool_assoc_desc: "La Asociación de Fabricantes de Herramientas de Máquinas de la India es el organismo industrial más importante del sector de herramientas de máquinas en la India."
 ind_mach_tool_tt: "§YLa Asociación de Fabricantes de Herramientas de Máquinas de la India mejorará enormemente nuestra industria§!"
 indian_event.21.t: "Exhibición textil!"
 indian_event.21.d: "La Exposición de la Industria Textil celebrada en la India mostró el vibrante y diverso sector textil del país. Presentó una amplia gama de productos, incluidos ropa, telas y accesorios, destacando la artesanía e innovación dentro de la industria textil india. Entre los artículos exhibidos, las camisas rosas indias destacaron y recibieron reconocimiento al ganar un prestigioso premio de concurso. Estas camisas demostraron la única combinación de arte tradicional y diseño contemporáneo, combinando un trabajo manual intrincado y telas de alta calidad. Las camisas rosas indias cautivaron a la audiencia con su exquisita artesanía, atención al detalle y paleta de colores vibrantes. Este logro no solo celebró el talento y la creatividad de los artesanos textiles indios, sino que también mostró el atractivo global de los textiles indios. Además, solidificó la reputación de la India como un destino líder para la producción y el diseño textil, enfatizando el rico patrimonio del país y su capacidad para adaptarse a las tendencias de la moda moderna. El éxito de las camisas rosas indias en la exposición sirvió como testimonio de la próspera industria textil en la India, contribuyendo a su crecimiento, reconocimiento internacional y continuas contribuciones a la economía y la identidad cultural del país."
 indian_event.21.a: "Genial"
 RAJ_textile_exhibition: "Industria textil"
 RAJ_textile_exhibition_desc: "La industria textil en la India, tradicionalmente, después de la agricultura, es la única industria que ha generado un enorme empleo tanto para mano de obra calificada como no calificada. La industria textil continúa siendo el segundo sector que más empleo genera en la India."
 RAJ_indian_naval_industry: "Industria naval india"
 RAJ_indian_naval_industry_desc: "A pesar de nuestra buena posición comercial y marítima, debemos desarrollar nuestra industria marítima."
 RAJ_indian_mitime_research: "Investigación marítima india"
 RAJ_indian_mitime_research_desc: "La investigación en el campo de la construcción naval y la industria marítima es esencial para el desarrollo de nuestra situación económica."
 RAJ_hindalco: "HINDALCO"
 RAJ_hindalco_desc: "Hindalco Industries Limited es una empresa fabricante de aluminio y cobre indio, y una subsidiaria del Grupo Aditya Birla."
 RAJ_eastern_dockyards: "Astilleros del Este"
 RAJ_eastern_dockyards_desc: "Una propuesta es construir nuevos astilleros en el Este y desarrollar la industria marítima en esa región."
 RAJ_western_dockyards: "Astilleros del Oeste"
 RAJ_western_dockyards_desc: "Una propuesta es construir nuevos astilleros en el Oeste y desarrollar la industria marítima en esa región."
 RAJ_manufact_schemes: "Esquemas económicos"
 RAJ_manufact_schemes_desc: "A medida que la India entra en el siglo XXI, es hora de crear nuevos patrones de producción y cadenas de suministro que satisfagan las demandas de los tiempos."
 RAJ_diamond_ind: "Industria del diamante"
 RAJ_diamond_ind_desc: "La minería de diamantes y metales preciosos es una parte significativa de las exportaciones de la India. Es necesario desarrollar nuevos depósitos para desarrollar la economía."
 RAJ_expand_chromium: "Expandir el cromo"
 RAJ_expand_chromium_desc: "Los nuevos depósitos de cromo descubiertos están atrayendo a inversores nacionales y extranjeros. Necesitamos desarrollar este tema y comenzar la minería."
 RAJ_expand_khullar: "Expandir Khullar"
 RAJ_expand_khullar_desc: "Nuestro gobierno ha considerado oportuno cuidar de nuestro tesoro nacional de recursos naturales."
 RAJ_indian_car_industry: "Industria automotriz india"
 RAJ_indian_car_industry_desc: "Para convertirnos en un país competitivo en el mercado internacional, debemos continuar desarrollando nuestra industria automotriz."
 RAJ_petrol_refiners: "Refinerías de petróleo"
 RAJ_petrol_refiners_desc: "El petróleo es la sangre vital de las economías y las industrias militares modernas. Necesitamos desarrollar esta industria."
 RAJ_unpec_growth: "Crecimiento sin precedentes"
 RAJ_unpec_growth_desc: "Hurra, nuestra economía se ha fortalecido considerablemente! Para ello, nuestro gobierno ha organizado incluso un banquete esta noche."
 RAJ_export_of_india: "Exportación de la India"
 RAJ_export_of_india_desc: "Nuestro país es rico en recursos y, aunque ya sufrimos durante el dominio colonial al exportar nuestros recursos a Gran Bretaña y otros países coloniales, por ahora debemos apoyar nuestra economía con fondos adicionales de las exportaciones."
 RAJ_UAZ: "UAZ"
 RAJ_russia_cars_companies: "Empresas automotrices rusas"
 RAJ_russia_cars_companies_desc: "Rusia es un país bastante desarrollado en la industria automovilística. Deberíamos invitar a sus empresas a mejorar nuestra posición en esta industria."
 RAJ_the_bull_of_asia: "El toro de Asia"
 RAJ_the_bull_of_asia_desc: "Nuestro país es el toro económico de Asia, que romperá incluso la economía de China con sus cuernos."
 RAJ_the_worlds_jeweller: "La joyera del mundo"
 RAJ_the_worlds_jeweller_desc: "Los diamantes, zafiros y otros materiales son nuestra riqueza nacional. Debemos aprovechar nuestra posición única."
 RAJ_indian_rice_funds: "Fondos de arroz indio"
 RAJ_indian_rice_funds_desc: "Esta vez, China no será la única superpotencia del arroz."
 RAJ_indian_infrastruct: "Infraestructura india"
 RAJ_indian_infrastruct_desc: "Hasta ahora, la situación de infraestructura en nuestro país es inaceptable. Debemos prevenir esto, de lo contrario los chistes sobre las malas carreteras también nos alcanzarán."
 RAJ_brazillian_industrial_partnership: "Asociación Industrial Brasileña"
 RAJ_brazillian_industrial_partnership_desc: "Brasil ofrece valiosa experiencia y recursos que pueden contribuir a la modernización y expansión de nuestro sector industrial. Al establecer una alianza, podemos acelerar el avance tecnológico y fortalecer los lazos económicos entre nuestras naciones."
 RAJ_dealing_with_eu_companies: "Negociar con empresas europeas"
 RAJ_dealing_with_eu_companies_desc: "Europa es nuestro principal mercado para la interacción de nuestra economía con la economía europea. Debemos desarrollar esta esfera."
 RAJ_hindustan_aeronautics: "Hindustan Aeronautics"
 RAJ_hindustan_aeronautics_desc: "El cielo es el tercer océano que el hombre ha conquistado. Debemos captar esta industria con todas nuestras hélices para ser más fuertes."
 RAJ_tatamotors: "TATA Motors"
 RAJ_tatamotors_desc: "TATA Motors, nuestra principal empresa de automóviles. Tenemos que hacerlo más avanzado que nuestros competidores occidentales."
 RAJ_building_industry_of_india: "Industria de la construcción de la India"
 RAJ_building_industry_of_india_desc: "Ahora la India es capaz de construirse a sí misma."
 RAJ_fight_unorganiz_work_force: "Luchar contra la fuerza laboral desorganizada"
 RAJ_fight_unorganiz_work_force_desc: "El desempleo es nuestro mayor enemigo. Ahora todos en este país estarán trabajando."
 RAJ_ultra_tech_content: "Contenido Ultra-Tech"
 RAJ_ultra_tech_content_desc: "Es hora de alcanzar a los países occidentales en el desarrollo de la tecnología informática."
 RAJ_increasing_control_over_business: "Aumentar el control sobre los negocios"
 RAJ_increasing_control_over_business_desc: "Los negocios en nuestro país no deben quedarse fuera. El destino de nuestra economía puede depender de ello."
 RAJ_lagilizing_the_business: "Legalizar los negocios"
 RAJ_lagilizing_the_business_desc: "La siguiente etapa para mejorar la calidad de nuestro negocio es eliminar las oportunidades para actividades ilegales."
 indian_event.22.t: "Dilema del trabajo barato"
 indian_event.22.d: "Debemos decidir cómo vamos a reformar nuestro mercado laboral en la India. ¿Deberíamos apoyar sus derechos o dejarlo como está?"
 indian_event.22.a: "Garantizar sus derechos!"
 indian_event.22.b: "Déjalo como está."
 RAJ_modern_building_technology: "Tecnologías de construcción modernas"
 RAJ_modern_building_technology_desc: "Es hora de acercarnos aún más al momento en que la India se convierta en uno de los países más desarrollados del mundo."
 RAJ_mumbai_restoration: "Enfocarse en Mumbai"
 RAJ_mumbai_restoration_desc: "Es hora de reconstruir la antigua Mumbai."
 RAJ_delhi_urbanization_plan: "Plan de urbanización de Delhi"
 RAJ_delhi_urbanization_plan_desc: "Necesitamos urbanizar nuestra capital, Delhi. Esto mejorará la condición de nuestro país."
 RAJ_unslumization_of_cities: "Desbaratización de ciudades"
 RAJ_unslumization_of_cities_desc: "Otro proyecto que supuestamente mejorará la vida en nuestro país."
 RAJ_mahindra: "Mahindra"
 RAJ_mahindra_desc: "Mahindra & Mahindra es un fabricante indio de automóviles de SUV, camiones y tractores."
 RAJ_force_motors: "Motores de fuerza"
 RAJ_force_motors_desc: "Dependiendo de la versión, autobuses pequeños urbanos o interurbanos, de 6,7 metros de largo, con capacidad de asientos de 18 a 32. El motor es un turbo diésel de 4 cilindros y 76 hp."
 RAJ_uranium_corp_of_india: "Corporación de Uranio de la India"
 RAJ_uranium_corp_of_india_desc: "Una empresa del sector público bajo el Ministerio de Energía Atómica para la minería y el procesamiento de uranio. La corporación se estableció en 1967 y es responsable de la minería y el procesamiento de mineral de uranio en la India. La empresa opera minas en Jadugor, Bhatina, Narvapahar, Turamdih y Banduhurang."
 RAJ_inviting_iaea: "Invitar a la AIEA"
 RAJ_inviting_iaea_desc: "El Organismo Internacional de Energía Atómica (OIEA) es una organización internacional establecida de conformidad con la decisión de la ONU del 4 de diciembre de 1954. Es miembro del sistema de la ONU y ejerce poderes para desarrollar la cooperación en el uso pacífico de la energía atómica."
 RAJ_bus_agreement_with_us: "Acuerdos con EE. UU."
 RAJ_bus_agreement_with_us_desc: "Estados Unidos se ha convertido en nuestro principal socio comercial de energía nuclear. Hora de firmar más acuerdos."
 RAJ_bus_agreement_with_rus: "Acuerdos con Rusia"
 RAJ_bus_agreement_with_rus_desc: "La industria de energía nuclear de Rusia también es una de las líderes en el mundo. Necesitamos comenzar a cooperar más con Rusia."
 RAJ_finalize_kaiga: "Finalizar Kaiga"
 RAJ_finalize_kaiga_desc: "La Estación Generadora Kaiga es una estación generadora de energía nuclear situada en Kaiga, cerca del río Kali, en el distrito de Uttara Kannada de Karnataka, India. La planta ha estado en operación desde marzo de 2000 y es operada por la Corporación de Energía Nuclear de la India."
 RAJ_tarapur4: "Tarapur 4"
 RAJ_tarapur4_desc: "La planta de energía nuclear Tarapur-4 de la India es el reactor nuclear más grande de la India, con una capacidad de 540 MW. Está siendo construida por Nuclear Power Corp India Ltd"
 RAJ_expanding_nmdc: "Expandir NMDC"
 RAJ_expanding_nmdc_desc: "La expansión del NMDC aumenta la capacidad minera estatal y los ingresos de exportación de mineral de hierro y minerales raros."
 RAJ_invite_foreign_powers: "Invitar a inversores extranjeros"
 RAJ_invite_foreign_powers_desc: "Debemos hacer que esta industria sea más atractiva para los inversores extranjeros, para que el progreso pueda avanzar más rápido."
 RAJ_bringing_back_the_plan: "Traer de vuelta el plan"
 RAJ_bringing_back_the_plan_desc: "La planificación centralizada remodela nuestra estrategia económica. El crecimiento industrial se acelera, aunque los cambios ideológicos desencadenan la resistencia política."
 RAJ_expansive_subsidies: "Subsidios Expansivos"
 RAJ_expansive_subsidies_desc: "Los subsidios apoyan la fundación agrícola de la India, potenciando las comunidades rurales y la productividad agrícola."
 RAJ_indian_ricebelt: "Cinturón de Arroz de la India"
 RAJ_indian_ricebelt_desc: "La inversión en el cultivo de arroz fortalece nuestra economía agraria y la estabilidad rural."
 RAJ_leaving_as_it_is: "Dejarlo como está"
 RAJ_leaving_as_it_is_desc: "La energía renovable (viento y solar) se vuelve central en nuestra estrategia energética a largo plazo y su autosuficiencia."
 RAJ_teacoffedance: "Té, Café, Bailemos!"
 RAJ_teacoffedance_desc: "Ampliar las exportaciones de té y café impulsa el crecimiento económico y la autonomía nacional."
 RAJ_exportsubsidies: "Regulación de Exportaciones"
 RAJ_exportsubsidies_desc: "Los controles de exportación protegen nuestros recursos y fomentan la independencia de fabricación nacional."
 RAJ_high_import_tariffs: "Altos Aranceles de Importación"
 RAJ_high_import_tariffs_desc: "Los altos aranceles protegen a la industria india de la competencia extranjera y construyen soberanía económica."
 RAJ_tea_production: "Producción de Té"
 RAJ_tea_production_desc: "Ampliar la producción de té aumenta el empleo rural y los ingresos de exportación."
 RAJ_coffee_production: "Producción de Café"
 RAJ_coffee_production_desc: "El cultivo del café fortalece los lazos agrarios y construye una base agrícola orientada hacia la exportación."
 RAJ_coffee_tata_tea: "Ampliar las exportaciones de té y café"
 RAJ_coffee_tata_tea_desc: "Las asociaciones del sector privado con TATA y otras empresas amplían las exportaciones de té y café al tiempo que fomentan la capacidad industrial."
 RAJ_supporting_local_producers: "Apoyo a Productores Locales"
 RAJ_supporting_local_producers_desc: "El apoyo gubernamental a las pequeñas empresas construye manufacturas y artesanías locales."
 RAJ_indian_rice_bowl: "Cuenco de Arroz de la India"
 RAJ_indian_rice_bowl_desc: "Un impulso centrado en la producción de arroz fortalece nuestra seguridad alimentaria y economía rural, aunque a un costo político."
 RAJ_incr_regional_control: "Aumentar el Control Regional"
 RAJ_incr_regional_control_desc: "La centralización de la administración regional fortalece la capacidad estatal y el control político sobre los asuntos locales."
 RAJ_local_prod_gov_prod: "¿Productores Locales? Productores Gubernamentales!"
 RAJ_local_prod_gov_prod_desc: "La producción estatal sustituye a la empresa privada, fomentando la capacidad de fabricación pública y la independencia."
 RAJ_new_prospects_for_socialism: "Nuevas Perspectivas para el Socialismo"
 RAJ_new_prospects_for_socialism_desc: "Abrazar los ideales socialistas acelera el control estatal sobre la industria y las políticas redistributivas."
 RAJ_state_run_capitalism: "Capitalismo de Estado"
 RAJ_state_run_capitalism_desc: "Las corporaciones estatales reemplazan los monopolios privados, equilibrando las fuerzas del mercado con el control público."
 RAJ_further_expansion_into_market: "Comité Económico"
 RAJ_further_expansion_into_market_desc: "Un Comité Económico coordina la inversión estatal y el crecimiento industrial."
 RAJ_secured_food_source: "Fuente de Alimento Asegurada"
 RAJ_secured_food_source_desc: "La autosuficiencia alimentaria mediante la inversión agrícola gana el apoyo de los agricultores y aumenta la resiliencia económica."
 RAJ_unite_the_farms: "Unir las Granjas"
 RAJ_unite_the_farms_desc: "Las iniciativas agrícolas colectivas refuerzan la cooperación rural y la independencia alimentaria nacional, aunque algunos intereses privados se oponen."
 RAJ_our_next_logical_step: "Tratar con Gobernadores Locales"
 RAJ_our_next_logical_step_desc: "La negociación con los gobernadores locales fortalece la autoridad central y el desarrollo de la infraestructura regional."
 RAJ_full_socialism_control: "Conversión Completa al Socialismo"
 RAJ_full_socialism_control_desc: "Un cambio profundo en el paisaje político se desarrolla mientras los susurros del socialismo crecen más alto. Con los viejos ecos oligárquicos que se desvanecen, el Congreso Sindical All India encuentra su voz, marcando un nuevo capítulo en el viaje ideológico de la India."
 RAJ_pressure_big_business: "Presionar a Grandes Negocios"
 RAJ_pressure_big_business_desc: "El suave forcejeo entre la política y el comercio se intensifica, tallando un camino hacia una narrativa económica más autodeterminada. En medio de esta marea cambiante, la esencia de la autonomía nacional encuentra un terreno más firme."
 RAJ_looming_water1: "Reducción de la Escasez de Agua"
 RAJ_looming_water2: "Escasez Parcial de Agua"
 RAJ_stabiliz_supply_water: "Estabilización del Suministro de Agua"
 RAJ_stabiliz_supply_water_desc: "El problema de la escasez de agua es muy alto en la agenda en la India. Debemos hacer todo lo posible para resolver este problema."
 RAJ_israeli_water_spec: "Especialistas en Agua de Israel"
 RAJ_israeli_water_spec_desc: "Los especialistas israelíes ya han ofrecido su asistencia en el tema de la filtración y el suministro de agua a la población."
 RAJ_spanish_water_spec: "Especialistas en Agua de España"
 RAJ_spanish_water_spec_desc: "Los especialistas españoles ya han ofrecido su asistencia en el tema de la filtración y el suministro de agua a la población."
 RAJ_minjur_water_plant: "Planta de Agua de Minjur"
 RAJ_minjur_water_plant_desc: "La Planta de Desalinización de Minjur es una planta de desalinización de agua por ósmosis inversa en la aldea de Kattupalli, un suburbio del norte de Chennai, India, en la costa de la Bahía de Bengala que suministra agua a la ciudad de Chennai. Construida en un sitio de 60 acres, es la planta de desalinización más grande de la India."
 RAJ_nemmeli_water_plant: "Planta de Agua de Nemmeli"
 RAJ_nemmeli_water_plant_desc: "La Planta de Desalinización de Nemmeli es una planta de desalinización de agua en Nemmeli, Chennai, en la costa de la Bahía de Bengala que suministra agua a la ciudad de Chennai."
 water_ind_tt: "§GResolveremos gradualmente el problema de la escasez de agua§!"
 RAJ_invest_in_bollywood: "Invertir en Bollywood"
 RAJ_invest_in_bollywood_desc: "La inversión estatal en Bollywood expandirá la industria cinematográfica de la India, impulsará las exportaciones culturales y generará un poder suave en el escenario mundial."
 indian_event.23.t: "La Industria Cinematográfica India Sorprende al Mundo!"
 indian_event.23.d: "El cine indio ha vuelto a demostrar su poder global ya que la última película india, Sueños Místicos, está arrasando en todo el mundo. La película, dirigida por el aclamado cineasta indio Rohit Verma, ha roto récords de taquilla y ha capturado los corazones de las audiencias de todo el mundo, marcando un nuevo hito para el cine indio en el escenario global. Sueños Místicos cuenta una historia convincente de amor, autodescubrimiento y el poder de la conexión humana. Ambientada en el majestuoso telón de fondo del Himalaya, la película combina bellamente impresionantes visuales, una narración cautivadora y actuaciones sobresalientes de un elenco talentoso. El éxito de la película se puede atribuir a su capacidad para resonar con audiencias de diversos orígenes culturales. Sus temas universales de amor, esperanza y espiritualidad han tocado la fibra sensible de los espectadores de todo el mundo, trascendiendo las barreras del lenguaje y la cultura. La cinematografía impresionante y la narrativa meticulosamente elaborada de la película han recibido elogios tanto de críticos como de cinéfilos."
 indian_event.23.a: "¡La India es la mejor! ¡Los que dudan de ello están equivocados!"
 RAJ_bolywood_idea: "Bollywood"
 RAJ_tata_consult: "TATA Consult"
 RAJ_tata_consult_desc: "Tata Consultancy Services (TCS) es una empresa multinacional india de servicios de TI y consultoría, parte del Grupo Tata. Con sede en Mumbai, es uno de los mayores empleadores de TI del mundo."
 RAJ_software_tech_park: "Parque Tecnológico de Software"
 RAJ_software_tech_park_desc: "Una organización científica y tecnológica del Ministerio de Electrónica e Tecnología de la Información (MeitY), dedicada a promover industrias de TI e ITES, innovación, investigación, startups y propiedad intelectual en sectores tecnológicos emergentes."
 RAJ_hcl_tech_lim: "Tecnología HCL limitada"
 RAJ_hcl_tech_lim_desc: "HCL Technologies Limited, que opera como HCLTech (anteriormente Hindustan Computers Pvt. Limited), es una empresa multinacional india de servicios y consultoría de tecnología de la información (TI) con sede en Noida."
 RAJ_tech_mahindra: "Tecnología Mahindra"
 RAJ_tech_mahindra_desc: "Una empresa multinacional india que proporciona servicios de información tecnológica y consultoría. Mahindra Group tiene su sede en Pune y su oficina registrada en Mumbai. Tech Mahindra es una empresa de $6.0 mil millones con más de 148,000 empleados en 90 países."
 RAJ_infosys_limited: "Infosys Limitada"
 RAJ_infosys_limited_desc: "Una empresa india dedicada al desarrollo de software personalizado para empresas de comercio electrónico y telecomunicaciones. También proporciona servicios de consultoría de software e información tecnológica."
 RAJ_wipro: "WIPRO"
 RAJ_wipro_desc: "Wipro es una corporación multinacional india que proporciona servicios de información tecnológica, consultoría y procesos empresariales. Es una de las principales empresas de Big Tech."
 RAJ_forces_of_india: "Fuerzas de la India"
 RAJ_forces_of_india_desc: "La organización militar de la India, diseñada para la defensa de la República y la protección de la libertad y la independencia del Estado, uno de los instrumentos políticos más importantes de poder."
 RAJ_indian_militias: "Milicias Indias"
 RAJ_indian_militias_desc: "La milicia es una parte integral de nuestro ejército. Para llevar a cabo con éxito operaciones militares, también necesitamos desarrollar nuestra milicia."
 RAJ_assam_rifles: "Fusiles de Assam"
 RAJ_assam_rifles_desc: "Una fuerza paramilitar central responsable de la seguridad fronteriza, la contrainsurgencia y el orden público en el noreste de la India. Su deber principal es proteger la frontera entre la India y Myanmar. El AR es una de las Fuerzas Policiales Armadas Centrales bajo el Ministerio de Asuntos Internos. El Ejército Indio mantiene el control operativo sobre el AR. Como fuerza policial, su reclutamiento, beneficios, promoción y política de jubilación están regidos por las normas de CAPF. Aproximadamente el 80 por ciento de los oficiales son nombrados por el Ejército, mientras que el resto del personal es reclutado de la plantilla de AR. El AR está comandado por el Director General de los Fusiles de Assam, quien es nombrado por el Ministerio de Asuntos Internos."
 RAJ_special_frontier_force: "Fuerza Fronteriza Especial"
 RAJ_special_frontier_force_desc: "Una unidad de operaciones especiales india creada el 14 de noviembre de 1962. Estaba compuesta principalmente por refugiados tibetanos que viven en la India. Ha crecido en tamaño y alcance de operaciones. Inicialmente, su propósito principal era llevar a cabo operaciones encubiertas detrás de las líneas chinas en caso de otra guerra sino-india."
 RAJ_indian_special_forces: "Fuerzas Especiales Indias"
 RAJ_indian_special_forces_desc: "Para realizar operaciones especiales detrás de las líneas enemigas, o dentro del país, necesitamos tener fuerzas especiales entrenadas."
 RAJ_NAJA_idea_1: "Policía Militarizada"
 RAJ_riot_police_idea: "Policía Antidisturbios"
 RAJ_riot_police_idea_desc: "Se despliegan unidades dedicadas a la lucha antidisturbios para reprimir los disturbios civiles y la violencia comunitaria. Su presencia disuade el desorden de masas pero agota las libertades civiles y puede inflamar el sentimiento público contra el gobierno."
 RAJ_outer_doctrine_idea: "Doctrina de Guerra con Vecinos"
 RAJ_outer_doctrine_idea_desc: "La India ha formalizado una doctrina estratégica orientada alrededor de posibles conflictos con Pakistán y China. La planificación militar, la postura de la fuerza y las adquisiciones están calibradas hacia estos dos vectores de amenazas primarias."
 RAJ_national_security_guard: "Guardia de Seguridad Nacional"
 RAJ_national_security_guard_desc: "Conocida comúnmente como los \"Gatos Negros\", es la unidad antiterrorista de la India bajo el Ministerio de Asuntos Internos. Fue fundada el 16 de octubre de 1984 después de la Operación Estrella Azul para combatir actividades terroristas y proteger a los Estados de disturbios internos. Oficialmente aprobada por el Parlamento de la India bajo la Ley de la Guardia de Seguridad Nacional de 1986. Es una de las siete Formaciones de Policía Armada Central de la India."
 RAJ_special_protection_group: "Grupo de protección especial"
 RAJ_special_protection_group_desc: "Una agencia del Gobierno de la India cuya única responsabilidad es proteger al Primer Ministro de la India y, en algunos casos, a su familia. Fue formado en 1988 por un Acta del Parlamento de la India. El SPG protege constantemente al Primer Ministro tanto en la India como en el extranjero, así como a los miembros más cercanos de la familia del Primer Ministro que viven con él en su residencia oficial. Sin embargo, los miembros de la familia pueden rechazar la protección."
 RAJ_railway_protection_group: "Grupo de Protección Ferroviaria"
 RAJ_railway_protection_group_desc: "El Grupo de Protección Ferroviaria es una sección de la nueva policía militar que se crea específicamente para proteger la logística necesaria del gobierno y combatir disturbios armados."
 RAJ_border_security_force: "Fuerza de Seguridad Fronteriza"
 RAJ_border_security_force_desc: "Organización india para la protección de fronteras con Pakistán y Bangladesh. Es una de las siete Unidades de Policía Armada Central de la India, creada después de la Guerra Indo-Pakistaní de 1965 \"para garantizar la seguridad de las fronteras de la India y asuntos relacionados.\""
 RAJ_saastra_seema_bal: "Saastra Seema Bal"
 RAJ_saastra_seema_bal_desc: "Las fuerzas de guardia fronteriza de la India están desplegadas a lo largo de sus fronteras con Nepal y Bután. Es una de las siete formaciones de policía armada central bajo el control administrativo del Ministerio de Asuntos Internos."
 RAJ_central_armed_police: "Policía Armada Central"
 RAJ_central_armed_police_desc: "El nombre colectivo de las organizaciones policiales centrales en la India bajo el Ministerio de Asuntos Internos. Técnicamente, son formaciones paramilitares, anteriormente conocidas como Formaciones Paramilitares Centrales."
 RAJ_indotibet_border_police: "Fuerza de Policía Indo-Tibetana"
 RAJ_indotibet_border_police_desc: "La Policía de Frontera Indo-Tibetana (ITBP) es una fuerza de guardia fronteriza de la India desplegada a lo largo de sus fronteras con la Región Autónoma del Tíbet. Es una de las siete Fuerzas de Policía Armada Central, establecida en 1962 a raíz de la Guerra Sino-India de 1962."
 RAJ_expanding_cprf: "Expansión de CRPF"
 RAJ_expanding_cprf_desc: "Formaciones militares subordinadas al Ministerio de Asuntos Internos de la India, que desempeñan las funciones de una reserva policial armada para garantizar el orden público, la seguridad interna y la integridad del estado, combatir el terrorismo, garantizar la seguridad durante las elecciones, asistir a las autoridades civiles, superar las consecuencias de desastres naturales."
 RAJ_reformation_of_dislocation: "Reformation of Dislocation"
 RAJ_reformation_of_dislocation_desc: "Nuestra Fuerza Aérea necesita cambiar sus tácticas de despliegue para prevenir muchos incidentes durante la guerra."
 RAJ_mirage2000: "Compra de Mirage 2000"
 RAJ_mirage2000_desc: "El Dassault Mirage 2000 es un luchador multirole francés de cuarta generación desarrollado en la década de 1970 por Dassault. En servicio desde 1984, fue el principal avión de combate de la Fuerza Aérea Francesa a finales del siglo XX y principios del siglo XXI. Está en servicio con varios países de Asia, Europa y América Latina."
 RAJ_rafale: "Aviones Rafale"
 RAJ_rafale_desc: "El Dassault Rafale es un luchador multirole francés de cuarta generación desarrollado por Dassault Aviation. Efectuó su primer vuelo en julio de 1986 y fue adoptado por la Armada Francesa en 2004 y la Fuerza Aérea Francesa en 2006."
 RAJ_su30: "Compra de SU-30"
 RAJ_su30_desc: "Caza multipropósito soviético/ruso de dos asientos para la conquista de la supremacía aérea, generación 4+. Está diseñado para destruir objetivos aéreos de día y de noche, en condiciones meteorológicas simples y complejas, así como contra el fondo del suelo cuando se utiliza interferencia activa y pasiva, control del espacio aéreo, bloqueo de aeródromos enemigos a gran profundidad y acciones sobre objetivos terrestres y marítimos. También puede utilizarse para controlar operaciones de combate grupales al alcanzar la supremacía aérea, destruir desembarcos enemigos en el aire, realizar reconocimiento aéreo y destruir objetivos terrestres en condiciones meteorológicas simples y complejas."
 RAJ_haltejas: "Desarrollo de Haltejas"
 RAJ_haltejas_desc: "Caza multipropósito ligero indio de cuarta generación. La aeronave monomotor está hecha según el esquema \"sin cola\" con un ala triangular. El prototipo del avión realizó su primer vuelo en 2001; fue desarrollado bajo el programa LCA."
 RAJ_haljaguar: "Desarrollo de Haljaguar"
 RAJ_haljaguar_desc: "El combatiente-bomber es un desarrollo conjunto del Reino Unido (British Aircraft Corporation) y Francia (Breguet). Estuvo en servicio con las Fuerzas Aéreas de estos países durante tres decenios, y también fue exportado. La creación de SEPECAT Jaguar fue uno de los primeros programas conjuntos de fabricantes de aviones europeos. La producción fue manejada por el consorcio SEPECAT (SEPECAT, de fr. Société Européenne de Production de l'avion École de Combat et d'appui Tactique - European Aviation Production Association for the production of combat and tactical support aircraft)."
 RAJ_embnetra: "EMB-145I Netra"
 RAJ_embnetra_desc: "El Embraer ERJ-145 es el modelo principal de la familia de aviones regionales ERJ (Embraer Regional Jet), desarrollado por el fabricante de aviones brasileño Embraer a principios de la década de 1990. Además del modelo básico, hay varias modificaciones con un alcance de vuelo aumentado: ERJ-145ER (Extended Range), ERJ-145LR (Long Range), ERJ-145XR (Extra-long Range). El avión ha sido operado por aerolíneas desde 1996. Se produjeron más de 700 ERJ-145 durante la producción en serie. La producción del avión continúa en Brasil y desde 2004 también en China."
 RAJ_contracts_with_us_air: "Contratos con la Fuerza Aérea de EE. UU."
 RAJ_contracts_with_us_air_desc: "La Fuerza Aérea de EE.UU. es las unidades de aviación más avanzadas y fuertes. Tenemos que firmar acuerdos con ellos sobre el desarrollo conjunto de aeronaves."
 RAJ_gulfstr4: "GulfStream 4"
 RAJ_gulfstr4_desc: "El Gulfstream IV (Gulfstream 4) es una familia de aeronaves de aviación ejecutiva desarrollada por Gulfstream Aerospace Corporation en la década de 1980. Está representada tanto por los modelos básicos Gulfstream IV como por sus generaciones posteriores Gulfstream IV SP, G300 y G400, así como G350 y G450. Durante el período de 1985 a 2018, se produjeron más de 900 aeronaves de la familia, la mayoría de las cuales continúan volando."
 RAJ_indian_navy_ind: "Marina India"
 RAJ_indian_navy_ind_desc: "Ahora nuestra marina no puede presumir de ninguna cualidad distintiva en comparación con nuestros competidores occidentales y orientales. Pero si queremos ocupar nuestro lugar bajo el sol, tendremos que cuidar de nuestra flota."
 RAJ_lessons_from_cactus: "Lecciones de la Operación Cactus"
 RAJ_lessons_from_cactus_desc: "La Operación Cactus fue bastante exitosa para nuestro ejército, así como para nuestra marina. Hemos tenido en cuenta muchos de los matices que surgieron durante esa operación y los estamos utilizando para mejorar la calidad de nuestra flota."
 indian_event.24.t: "Legado de la Operación Cactus"
 indian_event.24.d: "La Operación Cactus fue una operación militar llevada a cabo por las Fuerzas Armadas de la India en el año 1988. La operación se emprendió para neutralizar un intento de golpe de Estado en la nación insular de Maldivas. El 3 de noviembre de 1988, un grupo de militantes maldivos, respaldados por mercenarios de Sri Lanka, lanzó un golpe contra el entonces presidente de Maldivas, Maumoon Abdul Gayoom. El golpe tenía como objetivo derrocar al gobierno y establecer un régimen pro-rebelde. En respuesta a esta grave amenaza, India desplegó rápidamente sus fuerzas para asistir al gobierno maldivo. El 4 de noviembre, aviones de transporte de la Fuerza Aérea India, escoltados por buques de guerra de la Marina India, transportaron un contingente de tropas del Ejército Indio a Male, la capital de Maldivas."
 indian_event.24.a: "Interesante"
 RAJ_domestic_ship_prod: "Producción Nacional de Buques"
 RAJ_domestic_ship_prod_desc: "Necesitamos desarrollar nuestra propia capacidad nacional de construcción naval."
 RAJ_navy_aviation: "Aviación Naval"
 RAJ_navy_aviation_desc: "Para proteger eficazmente nuestra flota, necesitamos tener aviación naval."
 RAJ_goa_dock_exp: "Expansión de Astilleros"
 RAJ_goa_dock_exp_desc: "A medida que crece nuestra producción naval, necesitamos ampliar nuestra capacidad de astillero para sostenerla."
 RAJ_revit_soviet_ships: "Revitalizar las Antiguas Capacidades"
 RAJ_revit_soviet_ships_desc: "El enfoque soviético en la construcción naval fue lo suficientemente efectivo como para que pudiéramos integrarlo nosotros mismos."
 RAJ_scquir_submarines: "Submarinos Indios"
 RAJ_scquir_submarines_desc: "Para hundir con éxito los barcos de otras personas, necesitamos nuestros propios submarinos."
 RAJ_agree_brit_onnavy: "Acuerdo con Gran Bretaña"
 RAJ_agree_brit_onnavy_desc: "Habiendo sido anteriormente una potencia marítima líder, nos vemos obligados a firmar un acuerdo de cooperación con Gran Bretaña."
 RAJ_naval_trainings: "Entrenamientos Navales"
 RAJ_naval_trainings_desc: "Una buena preparación de nuestra flota asegurará nuestro dominio en el mar."
 RAJ_russia_navy_agree: "Especialistas de la Marina Rusa"
 RAJ_russia_navy_agree_desc: "La cooperación con los rusos nos permitirá fortalecer nuestra posición en el mar."
 RAJ_anew_indian_army: "Un Nuevo Ejército Indio"
 RAJ_anew_indian_army_desc: "Debemos crear un nuevo concepto del Ejército Indio para adaptarnos a las realidades modernas."
 RAJ_towards_new_mil_doct: "Hacia una Nueva Doctrina Militar"
 RAJ_towards_new_mil_doct_desc: "Es hora de admitir que nuestra doctrina militar está muy desactualizada. Si queremos ser invencibles en el nuevo milenio, necesitamos crear una nueva doctrina militar."
 RAJ_threat_of_the_dragon: "Amenaza del Dragón"
 RAJ_threat_of_the_dragon_desc: "Nuestra segunda mayor amenaza es China, nuestro rival de larga data en la región. Necesitamos analizar su doctrina militar y prepararnos para su ataque."
 RAJ_threat_of_the_crescent: "Amenaza de la Media Luna"
 RAJ_threat_of_the_crescent_desc: "Pakistán es nuestro principal enemigo en la arena geopolítica. Su ejército está bastante fragmentado y podemos intentar formar una defensa competente contra Pakistán."
 RAJ_threat_of_terror_mil: "Amenaza del Terrorismo"
 RAJ_threat_of_terror_mil_desc: "Nuestro nuevo enemigo que ha aparecido en el siglo XXI es el terrorismo. Este enemigo es interno y necesitamos preparar nuestro sector de defensa contra factores que trabajan desde dentro."
 RAJ_strategic_initiative: "Iniciativa Estratégica"
 RAJ_strategic_initiative_desc: "Debemos tomar la máxima iniciativa estratégica en la región y estar preparados para atacar preventivamente al enemigo. Prepararse para un escenario así es esencial."
 RAJ_military_infrastructure: "Infraestructura Militar"
 RAJ_military_infrastructure_desc: "Para estar preparados para una guerra a largo plazo, necesitamos preparar nuestras líneas de suministro logístico y construir carreteras federales."
 RAJ_new_military_methodology: "Nueva Metodología Militar"
 RAJ_new_military_methodology_desc: "Necesitamos rechazar la antigua metodología de guerra y conceptualizar la nueva guerra de nuestro tiempo con todas sus especificidades."
 RAJ_preparations_in_kashmir: "Preparativos en Cachemira"
 RAJ_preparations_in_kashmir_desc: "Ha habido luchas y enfrentamientos en Cachemira durante mucho tiempo. Este polvorín explotará tarde o temprano. Necesitamos estar preparados."
 RAJ_behead_northwest_separat: "Decapitar el Separatismo del Noroeste"
 RAJ_behead_northwest_separat_desc: "Los separatistas han buscado durante mucho tiempo destruir nuestra estructura estatal. Debemos decapitar a esta serpiente que acecha en nuestro jardín!"
 RAJ_antiterror_raids: "Redadas Antiterroristas"
 RAJ_antiterror_raids_desc: "Las redadas contra terroristas deben convertirse en algo común para las tropas internas. Los islamistas están desestabilizando nuestra situación, debemos erradicarlos de nuestra tierra."
 RAJ_counter_terror_trainings: "Entrenamientos Antiterroristas"
 RAJ_counter_terror_trainings_desc: "Debemos preparar a la población, al Ministerio de Situaciones de Emergencia y a las fuerzas policiales para las medidas antiterroristas que se aplicarán si hay una amenaza. Este es un aspecto importante de la seguridad pública."
 RAJ_bangladesh_line: "Línea de Bangladesh"
 RAJ_bangladesh_line_desc: "A pesar de nuestras buenas relaciones con Bangladesh, los migrantes ilegales y los terroristas de diversa índole intentan periódicamente cruzar nuestra frontera con ellos. Debemos tomar contramedidas contra esto."
 RAJ_southeatern_protection: "Protección del Sureste"
 RAJ_southeatern_protection_desc: "La frontera con Myanmar es muy inestable. Las milicias armadas no deben cruzar nuestra frontera."
 RAJ_smallwar_prep: "Preparativos para Pequeñas Guerras"
 RAJ_smallwar_prep_desc: "Debemos estar preparados para guerras locales y operaciones de mantenimiento de la paz. Estas son pequeñas guerras para las que, sin embargo, debemos estar preparados."
 RAJ_preparing_our_reserve: "Preparar nuestra Reserva"
 RAJ_preparing_our_reserve_desc: "Debemos estar preparados para operaciones de combate a largo plazo. Basándonos en esto, nuestras reservas militares deben ser reabastecidas y actualizadas."
 RAJ_bigwar_prep: "Preparativos para una Gran Guerra"
 RAJ_bigwar_prep_desc: "Cualquier guerra potencial con Pakistán y China es una gran guerra que podría llevar a una escalada nuclear. Debemos estar preparados incluso para un escenario así."
 RAJ_concept_coldstart: "Conceptualizar el Inicio en Frío"
 RAJ_concept_coldstart_desc: "El Inicio en Frío es una doctrina militar que fue desarrollada por las Fuerzas Armadas de la India para su uso en una posible guerra con Pakistán. Implica que las diversas ramas del ejército de la India lleven a cabo operaciones ofensivas como parte de grupos de combate unificados. La doctrina tiene la intención de permitir que las fuerzas convencionales de la India realicen ataques de contención para evitar una represalia nuclear de Pakistán en caso de conflicto."
 RAJ_concept_hotstart: "Conceptualizar el Inicio en Caliente"
 RAJ_concept_hotstart_desc: "Hot Start es una doctrina militar desarrollada por las Fuerzas Armadas de la India para operaciones ofensivas rápidas contra China. Se trata de grupos de batalla unificados de múltiples ramas de servicio que llevan a cabo acciones ofensivas rápidas, destinadas a lograr resultados decisivos antes de que el conflicto pueda escalar a un intercambio nuclear."
 RAJ_religious_groups: "Identidad de la India"
 RAJ_religious_groups_desc: "Las 5 religiones principales de [RAJ.GetFlag] §H India§! tienen diferentes niveles de opinión sobre el gobierno. Obviamente, el §HHindus§! tendrá una opinión muy alta del gobierno naturalmente. Pero algunos otros, como los §HMuslims§!, no lo harán. Por lo tanto, mediante la gestión de estos grupos religiosos, podemos §H mantener la paz y la estabilidad§! dentro de la nación. Si no guardamos una opinión adecuada con estos grupos religiosos, entonces ellos pueden tratar de obtener §Rindependencia§! de [RAJ.GetFlag] §HIndia§!.\n\nOpinión hindú: §Y[?RAJ_hindus_opinion]§!\nOpinión de Sikh: §Y[?RAJ_sikh_opinion]§!\nOpinión Budista: §Y[?RAJ_buddhist_opinion]§!\n§Y[?RAJ_christians_opinion]§!\nOpinión Musulmana: §Y[?RAJ_muslim_opinion]§!\n\n§HThresholds§!\n§YCada fe:§! Estabilidad y Poder político escala con el promedio de los cinco, de §R-10%§! en un promedio de 25 a §G+10%§! a 75.\n\n§GLos cinco más arriba 74:§! Becas de Armonía Religiosa §G+5%§!, §G+5%§! Poder político y §G+0.10§! Población mensual.\n\n§RAbajo 35:§! que las regiones de la fe caen en malestar. Los hindúes menores de 35 años también causan el descontento hindú: §R-5%§!, §R-10%§! Poder político, §R-3%§! Apoyo a la guerra.\n\n§RAbajo 20 (Sikhs abajo 15):§! se abre una crisis separatista. Elevar esa fe dentro de §Y180 días§! o el estado es desmilitarizado y la rebelión sigue.\n\n§RAbajo 5 cuando la rebelión se rompe:§! el estado sece.\n\n§H Solución de la cuestión§!\nSólo con toda fe arriba §Y80§! puede el árbol focal adoptar §Y Armonía Pluralista§! como ley religiosa nacional, un asentamiento mucho más fuerte que el pluralismo impuesto desde arriba. Con esa ley en su lugar y la Armonía Religiosa, §YEnshrine Pluralism§! lo escribe en el orden constitucional: la bonificación está bloqueada en su pico y la opinión comunitaria ya no conduce a disturbios, crisis o secesión.\n"
 RAJ_appease_hindus: "Aplacar a los Hindúes"
 RAJ_appease_sikhs: "Aplacar a los Sijs"
 RAJ_appease_buddhists: "Aplacar a los Budistas"
 RAJ_appease_christians: "Aplacar a los Cristianos"
 RAJ_appease_muslims: "Aplacar a los Musulmanes"
 RAJ_religion.4.t: "Erupción de la violencia comunitaria"
 RAJ_religion.4.d: "Varios grupos cristianos, musulmanes e hindúes comenzaron a luchar por una disputa desconocida en una de nuestras ciudades más grandes, y los bolsillos de violencia están empezando a estallar en todo el país. Por ahora, no importa por qué están luchando - lo que importa es cómo los hacemos parar."
 RAJ_religion.4.a: "Apoyar a los Cristianos"
 RAJ_religion.4.b: "Apoyar a los Hindúes"
 RAJ_religion.4.c: "Apoyar a los Musulmanes"
 RAJ_themodels_ofothers: "Modelos de Otros"
 RAJ_themodels_ofothers_desc: "Debemos analizar los modelos de los ejércitos de otros países y adoptar los mejores aspectos de sus formaciones."
 RAJ_milind_of_india: "Industria Militar de la India"
 RAJ_milind_of_india_desc: "El sector de la industria de defensa de la India es un sector estratégicamente importante en la India. India tiene una de las fuerzas militares más grandes del mundo con una fuerza de más de 1,44 millones de personal activo."
 RAJ_new_standart_for_equip: "Nuevos Estándares de Equipamiento"
 RAJ_new_standart_for_equip_desc: "Para luchar eficazmente en el campo de batalla, necesitamos optimizar nuestras armas pequeñas."
 RAJ_do_in_india: "Hacer en la India"
 RAJ_do_in_india_desc: "Necesitamos deshacernos del antiguo enfoque de la fabricación de armas."
 indian_event.25.t: "Tratar con Vipin Khanna"
 indian_event.25.d: "Para asegurar su posición en el mercado indio, Vipin Khanna, un conocido funcionario corrupto en la industria militar india, nos ofreció un trato que supuestamente no podemos rechazar. ¿Cómo lo haremos?"
 indian_event.25.a: "Adiós."
 indian_event.25.b: "Este es un buen trato!"
 RAJ_handl_cor_indefcor: "Manejar la Corrupción!"
 RAJ_handl_cor_indefcor_desc: "La corrupción en el ejército es ruinosa para la seguridad y las capacidades de defensa de nuestra nación. Es necesario prevenir la corrupción en nuestro ejército."
 RAJ_clearing_out_the_ranks: "Limpieza de las Filas"
 RAJ_clearing_out_the_ranks_desc: "Tenemos demasiado personal redundante en nuestras filas. Para optimizar el ejército, necesitamos cortarlos."
 RAJ_deal_vipin_khanna: "Propuesta de Vipin Khanna"
 RAJ_deal_vipin_khanna_desc: "Vipin Kumar Khanna (14 de diciembre de 1930 - 7 de noviembre de 2019) fue un magnate de negocios indio y oficial del ejército. Khanna tenía diversos intereses empresariales. Fundó Dynamic Sales Service International, una empresa de comercio y comercialización de productos básicos que se expandió aún más en el apoyo a la ingeniería, el desguace de buques, los bienes de consumo rápido y las industrias adicionales."
 RAJ_refr_rech_contr: "Refrescar los Contratos"
 RAJ_refr_rech_contr_desc: "Un ejército contratado nos permitirá tener un ejército profesional. Necesitamos optimizar esta parte."
 RAJ_clearing_ministr: "Limpieza del MOD"
 RAJ_clearing_ministr_desc: "La etapa final de las reformas de nuestro ejército es aumentar el control sobre los gerentes de nuestro ejército."
 RAJ_DRDO: "DRDO"
 RAJ_DRDO_desc: "La Organización de Investigación y Desarrollo de Defensa (DRDO) es el organismo gubernamental indio responsable del desarrollo tecnológico para fines militares y está bajo el Ministerio de Defensa de la India. El objetivo de DRDO es promover la prosperidad de la India haciendo que la ciencia y la tecnología sean de clase mundial, sentando las bases para la autosuficiencia en tecnologías militares críticas y proporcionando una ventaja decisiva en el equipo tecnológico de las fuerzas armadas nacionales."
 RAJ_drdo_idea: "DRDO"
 RAJ_munitions_india_limited: "Municiones India Limited"
 RAJ_munitions_india_limited_desc: "Una empresa de defensa estatal india con sede en Pune, India, establecida en 2021 como parte de la reestructuración y corporativización de la Junta Directiva de la Fábrica de Ordnance en siete empresas públicas diferentes. Ordnance India fabrica principalmente municiones, explosivos, misiles y bombas para uso por las Fuerzas Armadas de la India, militares extranjeros y uso civil nacional."
 RAJ_pinaka_launcher: "Lanzador Pinaka"
 RAJ_pinaka_launcher_desc: "El Pinaka es un lanzador de cohetes múltiples indio de 214 mm (MLRS) diseñado para atraer vehículos blindados y blindados, mano de obra y artillería del enemigo, destruir nodos de comunicación, puestos de mando e infraestructura militar industrial. Este lanzador también puede utilizarse para la instalación remota de minas antipersonal y antitanque. El desarrollo de este MLRS se inició en 1983, y en 1999 fue adoptado por el Ejército Indio. The Pinaka MLRS was reportedly used in combat during the Kargil War, a border conflict between India and Pakistan that took place in 1999. El primer regimiento en armarse con el MLRS de Pinaka se formó en 2000."
 RAJ_HSLDB: "HSLDB"
 RAJ_HSLDB_desc: "India necesita fortalecer su industria de cohetes para defender y explorar el espacio con éxito."
 RAJ_shivalik: "Granadas Shivalik"
 RAJ_shivalik_desc: "La granada Shivalik es una granada autóctona de la India. Fue desarrollada por el Laboratorio de Investigación Balística Terminal, TBRL, un laboratorio de la Organización de Investigación y Desarrollo de la Defensa, DRDO, que se encuentra en las estribaciones de las montañas Shivalik cerca de Chandigarh, y por lo tanto, deriva su nombre de aquí."
 RAJ_armor_vehic_nigam: "Vehículos Blindados Nigam"
 RAJ_armor_vehic_nigam_desc: "Armoured Vehicles Nigam Limited (AVANI) es una empresa de defensa estatal india, con sede en Avadi, Chennai, India, establecida en 2021 como parte de la reestructuración y corporativización de la Junta de Fábricas de Ordenanza en siete diferentes Empresas del Sector Público. AVANI fabrica principalmente vehículos de combate blindados, tanques de batalla principales y sus motores para el uso de la India."
 RAJ_arjun: "Tanque Principal de Batalla ARJUN"
 RAJ_arjun_desc: "Arjun es un tanque principal de batalla desarrollado por el mayor contratista de defensa de la India, la Organización de Investigación y Desarrollo de la Defensa (DRDO), para el Ejército Indio. El tanque lleva el nombre de Arjun, uno de los personajes principales del poema épico indio, el Mahabharata."
 RAJ_t90_rus: "T90 Ruso"
 RAJ_t90_rus_desc: "El tanque de combate ruso T-90 entró en servicio en 1992. En 1999, se le dio el nombre informal 'Vladimir'."
 RAJ_british_challenger: "Desafiante Británico"
 RAJ_british_challenger_desc: "Un tanque principal de batalla producido por la empresa británica Vickers Defense Systems (ahora parte de BAE Systems). Es el tercer tanque en llevar el nombre Challenger. Aunque el Challenger 2 fue desarrollado sobre la base del Challenger, el nuevo tanque difiere del modelo anterior con nuevo equipo y componentes: solo el 5% de las partes son comunes a ambos modelos. El Challenger 2 ha reemplazado ahora al modelo anterior en servicio con el Ejército Británico."
 RAJ_bmp_sarath: "BMP Sarath"
 RAJ_bmp_sarath_desc: "El BMP-2 Sarath es una variante india del Vehículo de Combate de Infantería (ICV) BMP-2 que ha sido fabricado bajo licencia por la Junta de Fábricas de Ordenanza en la India. El BMP-2 Sarath se introdujo por primera vez en servicio con el Ejército Indio a principios de la década de 1990."
 RAJ_mod_tru_stallion: "Caballo de Tiro Ashok Leyland"
 RAJ_mod_tru_stallion_desc: "Una serie de camiones indios de servicio mediano y pesado, producidos por la empresa Ashok Leyland desde 1987. Los camiones están diseñados sobre chasis Ford Cargo. Una parte significativa de los vehículos se produce para el Ejército Indio."
 RAJ_adv_weapons_eqip_lim: "Armas y Equipos Avanzados India"
 RAJ_adv_weapons_eqip_lim_desc: "Cuantas más oportunidades económicas tengamos, más necesitaremos un ejército. Los viejos pedidos están siendo cada vez más eliminados y están llegando nuevos, especialmente en nuestro ejército."
 RAJ_field_gun_fact: "Fábrica de Cañones de Campo"
 RAJ_field_gun_fact_desc: "Field Gun Factory, Kanpur (FGK) es una fábrica ubicada en Kanpur, India. Inaugurada en 1979, es el miembro más joven de la división de Armas, Vehículos y Equipos (WV&E) de las Fábricas de Ordenanza de la India. La facultad puede construir varios tipos de Cañones de Campo."
 RAJ_gun_jabalpur: "Fábrica de Carruajes de Cañones Jabalpur"
 RAJ_gun_jabalpur_desc: "Una planta de defensa y localidad en el distrito de Jabalpur de Madhya Pradesh, India. Ubicada en el pintoresco entorno de la cordillera de Satpura, este pequeño municipio gubernamental está construido alrededor de una planta de defensa del mismo nombre. Está a unos 3 km de la estación de tren de la ciudad de Jabalpur y también está estrechamente conectada con la ciudad. Está rodeada por otros establecimientos de defensa. Escuelas centrales, hospitales, iglesias, templos y clubes se encuentran dentro de la finca."
 RAJ_gun_shell_factory: "Fábrica de Cañones y Proyectiles Cossipore"
 RAJ_gun_shell_factory_desc: "Gun and Shell Factory, Cossipore, Calcuta, es la unidad madre de las Fábricas de Ordenanza de la India bajo la Junta de Fábricas de Ordenanza, conocida adecuadamente como el cuarto brazo de la defensa. La fábrica comenzó su viaje cuando la tierra sagrada en Cossipore fue comprada en el año 1801 y las actividades de producción comenzaron el 18 de marzo de 1802."
 RAJ_ordnance_factory_tiruchapari: "Fábrica de Ordenanza Tiruchirappalli"
 RAJ_ordnance_factory_tiruchapari_desc: "Una planta de fabricación de armas pequeñas operada por Advanced Weapons and Equipment India Limited, una empresa con sede en Tiruchirappalli, Tamil Nadu, que anteriormente formaba parte de la Junta de Fábricas de Ordenanza del Ministerio de Defensa, Gobierno de la India. La empresa está dirigida únicamente por un oficial IOFS llamado Gerente General, quien es el Director Ejecutivo responsable de la gestión general de la empresa. OFT es la mayor empresa de fabricación de armas pequeñas en la India y tiene la gama más diversa de productos."
 RAJ_ordnance_factory_korwa: "Proyecto de Fábrica de Ordenanza Korwa"
 RAJ_ordnance_factory_korwa_desc: "Ordnance Factory Project, Korwa es un proyecto de modernización y vía rápida de la Junta de Fábricas de Ordenanza. El proyecto se estableció en diciembre de 2007 en Amethi, UP. HAL, Korwa es una unidad de defensa vecina. Esta fábrica es la última pluma en el sombrero de la Organización OF, con tecnología de última generación."
 RAJ_ordnance_kanpur: "Fábrica de ordenanza Kanpur"
 RAJ_ordnance_kanpur_desc: "Ordnance Factory Kanpur es una de las 41 fábricas de ordenanza bajo los auspicios de la Junta de Fábricas de Ordenanza (OFB), Kolkata. Fue concebida en el año 1942 como Proyecto de Transplantación ante la amenaza inminente de las potencias del Eje que emergían del frente oriental durante la Segunda Guerra Mundial. La fábrica está ubicada en Kalpi Road a una distancia de ocho kilómetros de la estación de tren central de Kanpur."
 RAJ_small_factory_kanpur: "Expandiendo OFK"
 RAJ_small_factory_kanpur_desc: "La Junta de Fábricas de Ordenanza (OFB), compuesta por las Fábricas de Ordenanza de la India, ahora conocida como Dirección de Ordenanza (Coordinación y Servicios), fue una organización bajo el Departamento de Producción de Defensa (DDP) del Ministerio de Defensa (MoD), Gobierno de la India. Las 41 Fábricas de Ordenanza de la India se han convertido en 7 Empresas del Sector Público de Defensa (DPSU)."
 RAJ_ordnance_factory_ishapore: "Fábrica de Rifles Ishapore"
 RAJ_ordnance_factory_ishapore_desc: "Empresa estatal india de fabricación de armas con sede en Ichhapur, Bengala Occidental."
 RAJ_troop_comfrt: "Confort de las Tropas Limitado"
 RAJ_troop_comfrt_desc: "Debemos frenar la dejadez en nuestro ejército para mejorar su calidad."
 RAJ_upd_mil_unif: "Ley de Revisión de Uniformes Digitales"
 RAJ_upd_mil_unif_desc: "Nuestro ejército necesita una buena comunicación para mantener la efectividad de la misión."
 RAJ_upd_cloth: "Actualización de Equipo de Fuerzas Especiales"
 RAJ_upd_cloth_desc: "Es hora de mejorar el equipo de nuestras fuerzas especiales."
 RAJ_gliders_india_lim: "Gliders India limitó"
 RAJ_gliders_india_lim_desc: "Gliders India Limited (GIL) es una empresa de defensa estatal india con sede en Ordnance Parachute Factory en Kanpur."
 RAJ_miltech_innov: "Innovaciones de tecnología militar"
 RAJ_miltech_innov_desc: "Debemos fortalecer nuestras defensas de red militar contra intrusiones externas."
 RAJ_india_optel: "India Optel limitó"
 RAJ_india_optel_desc: "India Optel Limited es una empresa de defensa estatal india con sede en Dehradun."
 RAJ_electr_optic: "Expandiendo la Investigación NVG"
 RAJ_electr_optic_desc: "El NVG anterior en el Ejército Indio está obsoleto. Necesitamos mejorarlo."
 RAJ_yantra_india: "Yantra India se limitó"
 RAJ_yantra_india_desc: "Yantra India Limited es una importante empresa de producción de defensa estatal india con sede en Nagpur, India."
 RAJ_mil_electr: "Investigación electrónica militar"
 RAJ_mil_electr_desc: "Nuestros competidores extranjeros hace mucho que evolucionaron en electrónica. Necesitamos alcanzarlos."
 RAJ_command_innov: "Innovaciones de Comando"
 RAJ_command_innov_desc: "Necesitamos mejorar nuestros sistemas de comunicación de comando."
 RAJ_bharat_desc: "Empresa estatal de la India, uno de los mayores proveedores de equipos electrónicos para el Ejército Indio. La empresa tiene 9 plantas y varias oficinas regionales."
 RAJ_indian_radar: "Radares Indios"
 RAJ_indian_radar_desc: "El Radar de Detección de Bajo Alcance, también llamado Radar Doppler Indio, una serie de radares 2D fueron desarrollados por el Establecimiento de Desarrollo de Electrónica y Radar de la Organización de Investigación y Desarrollo de Defensa para el Ejército y la Fuerza Aérea. Luego fueron fabricados por Bharat Electronics, que generalmente es un socio de fabricación de LRDE. INDRA-I es un radar de vigilancia móvil para la detección de objetivos de bajo nivel, mientras que INDRA-II está diseñado para la intercepción de objetivos guiados desde tierra."
 RAJ_akash_missiles: "Misiles Akash"
 RAJ_akash_missiles_desc: "Akash es un sistema de misiles antiaéreos de corto alcance desarrollado en la India, diseñado para proporcionar defensa aérea de instalaciones y grupos de tropas."
 RAJ_indian_army_air_defense_force_idea: "Defensa Aérea India"
 RAJ_igmdp: "IGMDP"
 RAJ_igmdp_desc: "Un programa del Ministerio de Defensa de la India para la investigación y desarrollo de misiles de largo alcance. El programa fue gestionado por la Organización de Investigación y Desarrollo de Defensa y la Junta de Fábricas de Ordenanza en asociación con otras organizaciones políticas del gobierno indio. El proyecto comenzó en 1982-83 bajo el liderazgo de Abdul Kalam, quien supervisó su finalización en 2008 tras el desarrollo exitoso de estos misiles estratégicos."
 RAJ_finsas: "F-INSAS"
 RAJ_finsas_desc: "El programa de la India para equipar a su infantería con equipos de última generación, F-INSAS significa Sistema de Soldado de Infantería del Futuro. Sin embargo, el Ejército Indio ha decidido desechar el programa F-INSAS en favor de dos proyectos separados. El nuevo programa tendrá dos componentes: el primero es armar al Soldado de Infantería del Futuro con los mejores rifles de asalto, carabinas y equipos personales disponibles, como cascos y chalecos antibalas. El segundo componente son los Sistemas de Gestión de Campo de Batalla."
 RAJ_trishul: "Trishul"
 RAJ_trishul_desc: "Un misil superficie-aire de bajo nivel, corto alcance y acción rápida desarrollado en la India por la Organización de Investigación y Desarrollo de Defensa bajo el Programa de Desarrollo de Misiles Guiados Integrados. También puede usarse como misil de guerra antisubmarina desde un deslizador naval contra misiles de vuelo bajo, helicópteros de ataque y aviones."
 RAJ_3dcar: "3D-CAR"
 RAJ_3dcar_desc: "Radar de tres ejes indio desarrollado por DRDO para el SAM Akash. Capaz de rastrear hasta 150 objetivos."
 RAJ_agni_tech: "Tecnología Agni"
 RAJ_agni_tech_desc: "El Agni-III (IAST: Agni, lit. 'Fuego') es un misil balístico de alcance intermedio indio que se incorporó al servicio en 2011 como sucesor del Agni-II. Tiene un alcance de 3,500 a 5,000 kilómetros (2,200 a 3,100 millas) y puede alcanzar objetivos en lo profundo de los países vecinos, incluida China."
 RAJ_prithvi_missile: "Investigación Prithvi"
 RAJ_prithvi_missile_desc: "Una familia de misiles balísticos superficie-superficie de las Fuerzas Armadas de la India."
 RAJ_prithvi_1: "Familia de misiles Prithvi"
 RAJ_prithvi_1_desc: "Desarrolle la línea Prithvi completa de misiles balísticos de corto alcance en los tres servicios. La variante del Ejército vuela 150 km con una carga útil de 1000 kg, la variante de la Fuerza Aérea llega a 250 km, y la variante naval empuja a 350 km en un diseño de combustible sólido de dos etapas."
 RAJ_prithvi_4: "Prithvi-IV"
 RAJ_prithvi_4_desc: "Un avanzado misil balístico intercontinental en desarrollo, representando a la próxima generación de la capacidad estratégica de disuasión de la India. Su despliegue consolidaría la posición de India como una energía nuclear global."
 RAJ_uniting_mil_ind_prod: "Unificación de la Producción Militar"
 RAJ_uniting_mil_ind_prod_desc: "Es hora de unir todas las ramas militares para optimizar nuestro ejército."
 RAJ_uniting_mil_ind_prod_phase: "Fase 2 de Unificación de la Producción Militar"
 RAJ_uniting_mil_ind_prod_phase_desc: "Más equipos militares, más posibilidades de alcanzar nuestro objetivo."
 RAJ_indian_arms_exports: "Exportaciones de Armas Indias"
 RAJ_indian_arms_exports_desc: "India es un importante productor de diversos armamentos. Es capaz de tomar una de las posiciones más importantes del mundo vendiendo armas a otros países. También demostrará que la India está a la par con otras potencias militares"
 RAJ_preserve_caste_system: "Preservar el Sistema de Castas"
 RAJ_preserve_caste_system_desc: "El sistema de castas es un punto focal de la sociedad india. Destruirlo es una ofensa a nuestra religión y tradiciones!"
 RAJ_dharmic_alliance: "Alianza Dhármica"
 RAJ_dharmic_alliance_desc: "Todas las religiones dhármicas provienen de una misma raíz. Es el suelo de Bharat el que les dio a todas una oportunidad de ser. Lo abrazaremos."
 RAJ_hindu_nationalism: "Nacionalismo Hindú"
 RAJ_hindu_nationalism_desc: "Hindutva es la única manera posible de vivir para nuestra sociedad. Ser indio es una señal de la que cada uno de nuestros ciudadanos debe estar orgulloso."
 RAJ_indian_traditionalism_desc: "Las tradiciones son las más necesarias de cosas que pegan a la sociedad en una. No importa el origen tribal, todos compartimos las mismas tradiciones y nos une juntos."
 RAJ_stomp_out_islam: "Eliminar el Islam"
 RAJ_stomp_out_islam_desc: "El Islam ha sido durante mucho tiempo una fuente de problemas para nuestro país. ¡Trabajaremos para reducir su influencia al mínimo!"
 RAJ_international_nationalism: "Nacionalismo Internacional"
 RAJ_international_nationalism_desc: "Todas las diferentes naciones son una en los ojos de Akhand Bharat. Nuestras raíces étnicas y religiosas comunes son lo único en lo que deberíamos enfocarnos."
 RAJ_deport_muslims: "Deport Disloyal Muslims"
 RAJ_deport_muslims_desc: "Muchos predicadores musulmanes desleales continúan radicalizando nuestras provincias de mayoría musulmana. Esto es inaceptable y debe prevenirse."
 RAJ_hindu_rashatra: "Hindutva Rashtra"
 RAJ_hindu_rashatra_desc: "El militarismo debe inculcarse en las mentes de nuestra nación por todos los medios. Estar armados y unidos es nuestra fuerza!"
 RAJ_indias_elections: "Elecciones Indias"
 RAJ_indias_elections_desc: "La India es el mejor ejemplo de democracia donde cada partido tiene la oportunidad de convertirse en el partido líder del país. Debemos decidir qué camino tomará nuestro país para llegar a un futuro brillante o no tan brillante."
 RAJ_manmohan_singh: "Manmohan Singh"
 RAJ_manmohan_singh_desc: "Manmohan Singh es el Primer Ministro designado de la India y miembro del Partido del Congreso. Singh aseguró la nominación para Primer Ministro el 19 de mayo de 2004 cuando el Presidente A.P.J. Abdul Kalam le pidió oficialmente que formara un gobierno."
 RAJ_manmohan_technocracy: "Tecnocracia de Manmohan"
 RAJ_manmohan_technocracy_desc: "La tecnocracia es una forma de gobierno en la que la sociedad es gobernada por aquellos con conocimientos técnicos. En una tecnocracia, los líderes son seleccionados en función de su conocimiento tecnológico o científico. El método científico se aplica para resolver problemas sociales y políticos dentro de la tecnocracia, en lugar de votar democráticamente una solución o un compromiso."
 RAJ_keeping_reput: "Mantener la Reputación"
 RAJ_keeping_reput_desc: "Debemos salvar nuestra cara frente a los grupos religiosos estableciendo contactos amistosos con ellos, así como de forma gradual, integrando narrativas más libres en la sociedad."
 indian_event.26.t: "Declaración de Brasilia"
 indian_event.26.d: "La Declaración de Brasilia fue firmada por los ministros de relaciones exteriores de la India, Brasil y Sudáfrica. Acordaron la necesidad urgente de reformas en las Naciones Unidas, especialmente en el Consejo de Seguridad. La declaración consideró que el Consejo de Seguridad de las Naciones Unidas debería reflejar el escenario mundial actual. También abordó los temas del terrorismo internacional, el crimen transnacional y el tráfico ilícito de armas, afirmando que tales amenazas a la paz internacional deben ser abordadas efectivamente con respeto por la soberanía de los Estados y el Derecho Internacional."
 indian_event.26.a: "Grande"
 RAJ_ibsa_dialogue_forum: "Foro de Diálogo IBSA"
 RAJ_ibsa_dialogue_forum_desc: "El Foro de Diálogo IBSA es un grupo tripartito internacional para promover la cooperación internacional entre diferentes países."
 RAJ_fighting_corruption: "Lucha contra la Corrupción"
 RAJ_fighting_corruption_desc: "El problema de la corrupción está corrompiendo nuestro país! Debemos combatirlo de inmediato y asegurar la justicia de nuestro estado."
 RAJ_isr_ind_cong_meet: "Reunión Diplomática Israel-India"
 RAJ_isr_ind_cong_meet_desc: "El diálogo de alto nivel con Israel profundiza la cooperación militar e inteligencia."
 RAJ_national_guarantee_employment_act: "Ley de Garantía de Empleo Nacional"
 RAJ_national_guarantee_employment_act_desc: "La Ley Mahatma Gandhi de Garantía de Empleo Rural Nacional de 2005 o MGNREGA, anteriormente conocida como la Ley de Garantía de Empleo Rural Nacional o NREGA, es una medida de bienestar social india que tiene como objetivo garantizar el derecho al trabajo."
 RAJ_delhi_beijing_speakers: "Delhi-Beijing habla"
 RAJ_delhi_beijing_speakers_desc: "Aunque muchos pueden ver nuestras relaciones con China como irreparables, todavía debemos esforzarnos por estabilizarnos."
 RAJ_isr_ind_cong_pack_inv: "Paquete de Inversiones Israel-India"
 RAJ_isr_ind_cong_pack_inv_desc: "Las inversiones mutuas entre la India e Israel beneficiarían a ambos países. ¿Por qué no iniciar este proyecto?"
 RAJ_russia_weapon_package: "Paquete de Armas Rusas"
 RAJ_russia_weapon_package_desc: "Rusia es nuestra compañera de largo tiempo. Adquirimos un nuevo paquete de armas, ya que mejorará enormemente nuestras capacidades defensivas."
 RAJ_iran_india_pak_gas_pip: "Gasoducto India-Pakistán-Irán"
 RAJ_iran_india_pak_gas_pip_desc: "El proyecto del gasoducto Irán-Pakistán-India fue iniciado por primera vez por Irán a mediados de la década de 1990 para transportar el gas iraní a través de Pakistán hasta la India. Sin embargo, la idea en sí fue propuesta por primera vez a finales de la década de 1950 en un artículo científico publicado por el Military College of Engineering, Pakistán. La idea surgió en 1989, cuando Pakistán enfrentó una escasez de gas. Un acuerdo preliminar, que fue firmado entre Teherán e Islamabad en 1995, fue posteriormente unido por la India en 1999."
 indian_event.27.t: "Propuesta de Gasoducto de la India"
 indian_event.27.d: "India propone un nuevo proyecto de gasoducto, que abarca a la India, Pakistán e Irán participando en él. ¿Deberíamos estar de acuerdo en unirnos?"
 indian_event.27.o1: "Claro, es útil!"
 indian_event.27.o2: "Envía a estos diplomáticos de vuelta."
 RAJ_cont_the_course: "Continuar el Curso"
 RAJ_cont_the_course_desc: "Debemos continuar nuestro curso de democratización y procedimientos contra la corrupción."
 RAJ_golden_quadlit: "Cuadrilátero Dorado"
 RAJ_golden_quadlit_desc: "El Cuadrilátero Dorado es una red de autopistas nacionales que conecta varios centros industriales, agrícolas y culturales importantes de la India."
 RAJ_final_inf_prog: "Finalización del Programa de Infraestructura"
 RAJ_final_inf_prog_desc: "Ahora podremos completar el programa de construcción de infraestructura."
 RAJ_value_added_tax: "Impuesto al Valor Agregado"
 RAJ_value_added_tax_desc: "Debemos reformar nuestro sistema tributario para que sea más adecuado para los tiempos modernos."
 RAJ_national_rural_health_mis: "Misión Nacional de Atención Médica Rural"
 RAJ_national_rural_health_mis_desc: "La Misión Nacional de Atención Médica Rural es un esquema de seguro de salud financiado por el gobierno que se lanzará para proporcionar atención médica accesible, asequible y de calidad en las zonas rurales. El enfoque principal de este esquema está en los hogares de bajos ingresos en las zonas rurales."
 RAJ_27_perc_project_medic: "Proyecto del 27 Por Ciento"
 RAJ_27_perc_project_medic_desc: "El gobierno debe implementar la propuesta de reservar el 27% de los asientos en el Instituto Indio de Ciencias Médicas (AIIMS), los Institutos Indios de Tecnología, los Institutos Indios de Administración y otras instituciones centrales de educación superior para las Otras Clases Atrasadas."
 RAJ_crusing_indian_antires_protests: "Reprimir las protestas anti-reservas"
 RAJ_crusing_indian_antires_protests_desc: "Una serie de protestas tuvieron lugar en la India en oposición a la decisión del Gobierno de la Unión de la India, liderado por la coalición multipartidista Alianza Progresista Unida del Congreso Nacional Indio, de implementar reservas para las Otras Clases Atrasadas en instituciones centrales y privadas de educación superior."
 RAJ_rights_to_education_act: "Ley del Derecho a la Educación"
 RAJ_rights_to_education_act_desc: "La Ley del Derecho de los Niños a la Educación Gratuita y Obligatoria o Ley del Derecho a la Educación es una Ley del Parlamento de la India que describe las modalidades de la importancia de la educación gratuita y obligatoria para los niños entre los 6 y 14 años en la India bajo el Artículo 21A de la Constitución de la India."
 RAJ_unlaw_prev_act: "Ley de Prevención de Actividades Ilícitas"
 RAJ_unlaw_prev_act_desc: "La Ley de Prevención de Actividades Ilícitas es una ley india destinada a prevenir asociaciones de actividades ilícitas en la India. Su objetivo principal era disponer de poderes para tratar con actividades dirigidas contra la integridad y la soberanía de la India."
 RAJ_national_investigation_agency: "Fundar la Agencia Nacional de Investigación"
 RAJ_national_investigation_agency_desc: "La Agencia Nacional de Investigación es una agencia policial especializada en la lucha contra el terrorismo en la India. La agencia tiene el poder de investigar crímenes relacionados con el terrorismo en todos los estados sin permiso especial de los estados bajo una proclamación escrita del Ministerio del Interior."
 RAJ_enlarge_inv_agency: "Ampliar la Agencia Nacional de Investigación"
 RAJ_enlarge_inv_agency_desc: "La Agencia Nacional de Investigación debe tener más libertad y espacio para actuar de manera más eficiente y obtener resultados más rápidos."
 RAJ_reconstruct_kashmir: "Reconstruir Cachemira"
 RAJ_reconstruct_kashmir_desc: "Cachemira no está en las mejores condiciones, por decir lo menos. La reconstruiremos para ganar la lealtad de la gente allí y hacerla económicamente estable."
 RAJ_aadhar_project: "Proyecto Aadhaar"
 RAJ_aadhar_project_desc: "Aadhaar es un número de identidad único de 12 dígitos que puede ser obtenido voluntariamente por los ciudadanos de la India y los nacionales extranjeros residentes que han pasado más de 182 días en doce meses inmediatamente antes de la fecha de solicitud de inscripción, basado en sus datos biométricos y demográficos."
 RAJ_rights_to_child_free_comp_act: "Ley RCFCE"
 RAJ_rights_to_child_free_comp_act_desc: "La Sección 3 proporciona a cada niño de seis a catorce años el derecho a la educación gratuita y obligatoria en una escuela del vecindario hasta la finalización de la educación elemental. La idea de las escuelas del vecindario se puede rastrear hasta el Sistema Nacional de Educación según lo descrito en el informe de la Comisión Kothari, donde la escuela del vecindario está destinada a ser un espacio común donde todos los niños, sin distinción de casta, clase o género, aprendan juntos de la mejor manera inclusiva."
 RAJ_rights_to_land_acquiq: "Ley RFCTLARR"
 RAJ_rights_to_land_acquiq_desc: "La Ley de Derecho a una Compensación Justa y Transparencia en la Adquisición, Rehabilitación y Reasentamiento es una Ley del Parlamento Indio que regula la adquisición de tierras y establece el procedimiento y las reglas para otorgar compensación, rehabilitación y reasentamiento a las personas afectadas en la India."
 RAJ_rights_to_info: "Ley de Derecho a la Información"
 RAJ_rights_to_info_desc: "La Ley de Derecho a la Información tiene como objetivo establecer el régimen práctico del derecho a la información para que los ciudadanos puedan acceder a la información bajo el control de las autoridades públicas, con el fin de promover la transparencia y la rendición de cuentas en el funcionamiento de cada autoridad pública, la constitución de una Comisión de Información Central y Comisiones de Información Estatales y para asuntos relacionados o incidentales."
 RAJ_reform_constitution: "Reformar la Constitución"
 RAJ_reform_constitution_desc: "La reforma de nuestra antigua constitución es un paso necesario para renovar el sistema político indio."
 RAJ_hindutva_front: "Frente Hindutva"
 RAJ_hindutva_front_desc: "Arraigado en la ideología del nacionalismo hindú, el movimiento Hindutva busca afirmar la primacía de la cultura y los valores hindúes dentro del diverso mosaico de la India. A medida que aumentan las tensiones, su llamado gana tracción entre las masas."
 RAJ_akhil_bharat_mahsabasa: "Akhil Bharat Hindu MahaSabha"
 RAJ_akhil_bharat_mahsabasa_desc: "Fundada a principios del siglo XX, la Hindu Mahasabha tenía como objetivo proteger los derechos de los hindúes en un subcontinente en cambio. Con vínculos con las fuerzas armadas y una visión de un Hindu Rashtra, o Nación Hindú, envisionan una India robusta y unificada."
 RAJ_maharashtra_navnirman_sena: "Maharashtra Navnirman Sena"
 RAJ_maharashtra_navnirman_sena_desc: "Separándose del Shiv Sena en el siglo XXI, el Maharashtra Navnirman Sena (MNS) lleva la antorcha del orgullo y la identidad marathi. Como una fuerza regional rival, desafían el dominio de su organización matriz, buscando un camino único para afirmar los intereses de Maharashtra."
 RAJ_shiv_sena: "Shiv Sena"
 RAJ_shiv_sena_desc: "Establecido en 1966, Shiv Sena ha defendido durante mucho tiempo los derechos de los maharashtrianos en Mumbai. Aunque su influencia se ha expandido para cubrir temas nacionalistas hindúes más amplios, su legado y dominio ahora están amenazados por contendientes regionales emergentes como el MNS."
 RAJ_uniting_the_nationalist_front: "Unir el Frente Nacionalista"
 RAJ_uniting_the_nationalist_front_desc: "Unir el Frente Nacionalista solo puede hacerse mediante el Hindu Mahasabha, ya que somos el punto de unión entre sus rivalidades."
 RAJ_breaking_the_neck_of_shivsena: "Romper el cuello de Shiv Sena"
 RAJ_breaking_the_neck_of_shivsena_desc: "Shiv Sena son estúpidos pretendientes que cuestionan nuestra autoridad! Debemos aplastar su popularidad!"
 RAJ_stomping_the_pretenders: "Aplastar a los Pretendientes"
 RAJ_stomping_the_pretenders_desc: "Maharashtra Navnirman Sena son estúpidos pretendientes que cuestionan nuestra autoridad! Debemos aplastar su popularidad!"
 RAJ_new_national_india: "Nueva India Nacional"
 RAJ_new_national_india_desc: "La India ha llegado ahora a sus fundamentos. ¡Alabado sea el Bharat!"
 RAJ_indian_traditionalism: "Tradicionalismo Indio"
 RAJ_religious_conversions: "Conversiones Religiosas"
 RAJ_religious_conversions_desc: "Debemos esforzarnos en convertir a musulmanes y cristianos en religiones dármicas para asegurar su lealtad a nuestro régimen."
 RAJ_threaten_pakistan: "Amenazar a Pakistán"
 RAJ_threaten_pakistan_desc: "¿Pakistán? Nunca he oído hablar de él! ¿Quizás te referías al Bharat Occidental?"
 RAJ_antiwestern_propaganda: "Propaganda Antioccidental"
 RAJ_antiwestern_propaganda_desc: "Ah, el oeste! Su tontería debería ser ridiculizada y mostrada como un ejemplo de estupidez!"
 RAJ_antichina_propaganda: "Propaganda Antichina"
 RAJ_antichina_propaganda_desc: "La RPC, siendo un régimen totalitario, es un ejemplo de lo que le sucede a un país cuando sus tradiciones y moral son reemplazadas por estúpidos libros rojos!"
 RAJ_prep_reb_tibet: "Preparar Rebelión en el Tíbet"
 RAJ_prep_reb_tibet_desc: "El pueblo del Tíbet ha sido oprimido desde hace mucho tiempo por el gobierno chino. ¡Debemos ayudarlos a liberarse del Dragón del Norte!"
 RAJ_prepare_tooth: "Preparar el Diente"
 RAJ_prepare_tooth_desc: "La preparación militar y el fervor nacionalista hindú fortalecen la postura militar de la India."
 RAJ_sharpen_the_claws: "Afilar las Garras"
 RAJ_sharpen_the_claws_desc: "Las garras afiladas de guerreros justos, sed de batalla."
 RAJ_greater_india: "Akhand Bharat"
 RAJ_greater_india_desc: "La ideología de Akhand Bharat busca expansión territorial y consolidación nacionalista hindú."
 RAJ_demand_nepal_and_butan: "Demandar Nepal y Bután"
 RAJ_demand_nepal_and_butan_desc: "Los británicos separaron a Bhután y Nepal de nosotros. ¡Qué decisión tan escandalosa! Lo revertimos a lo que debería ser."
 RAJ_demand_bangladesh: "Demandar Bangladesh"
 RAJ_demand_bangladesh_desc: "Bangladesh ha estado separado de nosotros durante demasiado tiempo. Deberíamos unirnos."
 RAJ_regional_partnership: "Revivir Azad Hind"
 RAJ_regional_partnership_desc: "Azad Hind debería revivirse como un nuevo ejército de voluntarios que protegerá nuestra soberanía."
 RAJ_influence_indochina: "Influir en Indochina"
 RAJ_influence_indochina_desc: "Indochina tiene Indo en su nombre por una razón. Fue y será parte de Akhand Bharat!"
 RAJ_no_to_democracy: "Abolir la Democracia"
 RAJ_no_to_democracy_desc: "Puaj, Democracia. ¿Realmente la necesitamos?"
 RAJ_anew_raj: "Elegir un nuevo Raja"
 RAJ_anew_raj_desc: "La restauración de la monarquía apela a los movimientos nacionalistas y tradicionalistas que buscan un gobierno autoritario."
 RAJ_grand_pan_indian_counc: "Gran Consejo Panindio"
 RAJ_grand_pan_indian_counc_desc: "¡Los problemas modernos requieren soluciones modernas! ¡Reuniremos un nuevo gobierno meritocrático para asegurar la estabilidad y la prosperidad de la India!"
 RAJ_dictatorship_benev: "Dictadura Benevolente"
 RAJ_dictatorship_benev_desc: "Solo el ejército tiene el derecho de gobernar nuestro país. Son los protectores de nuestra tierra y se convertirán en los nuevos gobernantes."
 RAJ_hijack_moderates: "Secuestrar Moderados"
 RAJ_hijack_moderates_desc: "Los votantes moderados deberían ser adoctrinados en nuestras ideas para asegurar su lealtad."
 RAJ_bharatiya_janata_party: "Partido Bharatiya Janata"
 RAJ_bharatiya_janata_party_desc: "El Partido Bharatiya Janata es un partido político en la India y uno de los dos principales partidos políticos indios junto con el Congreso Nacional Indio."
 militar_coal_tt: "§YEl ejército será añadido a la coalición gobernante!§!"
 RAJ_MODI_rator_of_ind_pol: "MODIrator de la Política India"
 RAJ_MODI_rator_of_ind_pol_desc: "Narendra Damodardas Modi es un político indio que se ha convertido en una figura prominente en el Partido BJP. Modi fue el Ministro Principal de Gujarat desde 2001 y es miembro del Parlamento para Varanasi. Es miembro del Partido Bharatiya Janata y de la Rashtriya Swayamsevak Sangh, una organización voluntaria nacionalista hindú de derecha. Es el primer ministro más antiguo de fuera del Congreso Nacional Indio."
 RAJ_strongarm_hindutva: "Fortalecer el Hindutva"
 RAJ_strongarm_hindutva_desc: "Nuestro partido tal vez no sea tan radical como otros grupos de extrema derecha en la India, sino que debemos unirnos a una coalición contra las otras fuerzas. Modi proporciona soluciones MODIrate."
 RAJ_dab_on_ngos: "Restricciones a las ONG"
 RAJ_dab_on_ngos_desc: "Las ONG extranjeras están ayudando a difundir ideas occidentales en nuestro país. Deberíamos oponernos a ellas para asegurar la popularidad del BJP."
 RAJ_check_MSF: "Verificar MSF"
 RAJ_check_MSF_desc: "Medecins Sans Frontieres, nombrado Doctores sin Fronteras en inglés, es una organización benéfica que proporciona atención médica humanitaria. Es una organización no gubernamental de origen francés conocida por sus proyectos en zonas de conflicto y en países afectados por enfermedades endémicas."
 RAJ_check_sierra_club: "Verificar Sierra Club"
 RAJ_check_sierra_club_desc: "El Sierra Club es una organización ambiental estadounidense con capítulos en los 50 estados de EE.UU., Washington D.C. y Puerto Rico."
 RAJ_check_avaaz: "Verificar Avaaz"
 RAJ_check_avaaz_desc: "Avaaz es una organización sin fines de lucro con sede en EE.UU. que promueve el activismo global en temas como el cambio climático, los derechos humanos, los derechos de los animales, la corrupción, la pobreza y los conflictos."
 RAJ_abolish_planning_comission: "Comisión de Planificación"
 RAJ_abolish_planning_comission_desc: "El mercado indio debería ser libre y no se deberían imponer restricciones severas sobre él."
 RAJ_full_econ_conv: "Conversión Económica Completa"
 RAJ_full_econ_conv_desc: "Deberíamos convertir completamente nuestra economía al capitalismo de libre mercado. Es la única manera racional para la India."
 RAJ_niti_aayog: "Niti Aayog"
 RAJ_niti_aayog_desc: "El NITI Aayog sirve como el principal grupo de expertos en políticas públicas del Gobierno de la India, y la agencia nodal encargada de catalizar el desarrollo económico y fomentar el federalismo cooperativo y alejarse del federalismo de regateo mediante la participación de los Gobiernos Estatales de la India en el proceso de elaboración de políticas económicas utilizando un enfoque de abajo hacia arriba."
 RAJ_ensure_free_market: "Asegurar el Mercado Libre"
 RAJ_ensure_free_market_desc: "Ahora, debemos asegurar el mercado libre en la India no solo de facto, sino también de jure, para que nuestros cambios se integren completamente."
 RAJ_digital_media_camp: "Campaña de Medios Digitales"
 RAJ_digital_media_camp_desc: "Utilizaremos todas las medidas para la propaganda de nuestros ideales. Mensajeros, redes sociales, anuncios en Internet: todo esto debería usarse para nuestro beneficio."
 RAJ_urgent_economic_measures: "Medidas Económicas Urgentes"
 RAJ_urgent_economic_measures_desc: "La economía moderna es muy dinámica. Debemos utilizar reglamentos gubernamentales para estabilizarlo y garantizar su continuidad."
 RAJ_digital_litaracy_programme: "Programa de Alfabetización Digital"
 RAJ_digital_litaracy_programme_desc: "El Digital Saksharta Abhiyan (DISHA) o Esquema de la Misión Nacional de Alfabetización Digital (NDLM) ha sido formulado para impartir capacitación en TI y alfabetización digital para la población de nuestro país."
 RAJ_ujjwala_scheme: "Esquema Ujjwala"
 RAJ_ujjwala_scheme_desc: "Pradhan Mantri Ujjwala Yojana (PMUY, traducción: Esquema de Iluminación del Primer Ministro) será lanzado por el Primer Ministro de la India, Narendra Modi, para distribuir 50 millones de conexiones de GLP a mujeres de familias por debajo de la línea de pobreza."
 RAJ_rasht_swasem_sangh: "Rashtriya Swayamsevak Sangh"
 RAJ_rasht_swasem_sangh_desc: "El Rashtriya Swayamsevak Sangh es una organización paramilitar voluntaria de derecha hindú nacionalista en la India."
 RAJ_make_them_obey: "Hacer que Obedezcan"
 RAJ_make_them_obey_desc: "Las ONG deben continuar su trabajo ya que son muy beneficiosas para nosotros. Sin embargo, debemos controlar su propaganda ideológica y hacerles leales a nuestra causa."
 indian_event.28.t: "Campaña de Modi contra las ONG"
 indian_event.28.d: "La organización no gubernamental India tiene cerca de 3,4 millones de organizaciones no gubernamentales que trabajan en una variedad de ámbitos que van desde el socorro en casos de desastre hasta la promoción de comunidades marginadas y desfavorecidas. Son una parte importante de la sociedad civil que trae cambio rápido y transformación social. Las ONG son consideradas independientes del Estado y de carácter voluntario. Dependen de donaciones individuales, financiación extranjera y ayuda de diferentes organismos gubernamentales y donantes privados. Su trabajo ayuda a librar a la India de prejuicios, corrupción, analfabetismo y pobreza. Pero en las últimas décadas, la India ha sido un entorno difícil para varias organizaciones -en particular las que trabajan para empoderar a las personas contra políticas gubernamentales injustas, cuestionar la discriminación estructural y abogar por los derechos de los dalits, el pueblo tribal y otros grupos privados. Una sucesión de gobiernos indios han intentado frenar sus actividades."
 indian_event.28.a: "Ja! Y parece que tenemos éxito!"
 indian_event.29.t: "Propuesta del Proyecto de Gas Gubernamental"
 indian_event.29.d: "Pradhan Mantri Ujjwala Yojana es lanzada por el Primer Ministro de la India Narendra Modi para distribuir conexiones de GLP a las mujeres de las familias de la línea de pobreza inferior. Se hizo una asignación presupuestaria para el plan. ¿Deberíamos conducir este esquema en Uttar Pradesh, o extenderlo a toda la India?"
 indian_event.29.a: "Extenderlo a toda la India"
 indian_event.29.b: "Enfocarse en una Región"
 RAJ_gasallindia: "Gas para toda la India"
 RAJ_gasoneindia: "Gas solo para Uttar Pradesh"
 RAJ_free_liq_gas: "Pradhan Mantri Ujwala Yojana"
 RAJ_free_liq_gas_desc: "Ha llegado el momento de comenzar un nuevo proyecto para la distribución de gas licuado para nuestra población."
 RAJ_full_india_programme: "Programa para Toda la India"
 RAJ_full_india_programme_desc: "Aunque será difícil lograrlo, toda la India debe estar vinculada a este programa."
 RAJ_only_ujjwala: "Solo una Región"
 RAJ_only_ujjwala_desc: "Solo las regiones más pobres deberían tener este privilegio para equilibrar la situación social en el país."
 RAJ_prior_hindus: "Priorizar a los Hindúes"
 RAJ_prior_hindus_desc: "Los hindúes son el núcleo del Estado indio. Deberíamos darles prioridad de todas las maneras posibles."
 RAJ_coal_with_right_wing: "Coalición con el Ejército"
 RAJ_coal_with_right_wing_desc: "El ejército está realmente a favor de nuestras reformas. Debemos asegurar su lealtad incluso en asuntos políticos."
 RAJ_goods_and_services_tax: "Impuesto sobre Bienes y Servicios"
 RAJ_goods_and_services_tax_desc: "El Impuesto sobre Bienes y Servicios es el sucesor del IVA utilizado en la India en el suministro de bienes y servicios. El GST es una forma digitalizada del IVA donde también se puede rastrear los bienes y servicios. Tanto el IVA como el GST tienen los mismos tramos de impuestos."
 RAJ_global_mafucat_hub: "Centro Mundial de Manufactura"
 RAJ_global_mafucat_hub_desc: "Seremos el centro mundial de manufactura del mundo y superaremos a China! Es nuestro único objetivo económico del siglo!"
 RAJ_partnership_with_armenia: "Asociación con Armenia"
 RAJ_partnership_with_armenia_desc: "Armenia tiene una posición geopolítica muy importante para nuestras rutas comerciales y, además, tiene muchas conexiones culturales e históricas con nosotros. Deberíamos cooperar con ellos y establecer una base militar allí para asegurar su seguridad."
 RAJ_demonatization_of_rupiah: "Desmonetización de billetes indios"
 RAJ_demonatization_of_rupiah_desc: "El Gobierno de la India debería anunciar la desmonetización de todos los billetes de 500 y 1000 rupias de la Serie Mahatma Gandhi. También debería anunciar la emisión de nuevos billetes de 500 y 2000 rupias a cambio de los billetes desmonetizados."
 RAJ_schwach_bharat: "Misión Swachh Bharat"
 RAJ_schwach_bharat_desc: "La Misión India Limpia es una campaña a nivel nacional iniciada por el Gobierno de la India para eliminar la defecación al aire libre y mejorar la gestión de residuos sólidos y crear aldeas libres de defecación al aire libre."
 RAJ_vaccines_for_india: "Vacunas para la India"
 RAJ_vaccines_for_india_desc: "Las vacunas deberían ser gratuitas y disponibles para todos los grupos sociales en nuestro país."
 RAJ_harsh_on_pakistan: "Aumentar las tensiones con Pakistán"
 RAJ_harsh_on_pakistan_desc: "Pakistán ha estado atacando nuestra tierra durante mucho tiempo! Deberíamos mostrarles un poco de fuerza para apaciguar su apetito."
 RAJ_pressuring_china: "Presionar a China"
 RAJ_pressuring_china_desc: "China ha mostrado animosidad hacia nosotros durante mucho tiempo! Deberíamos mostrarle al mundo lo terribles que son."
 RAJ_communist_party_of_india: "Partido Comunista de la India"
 RAJ_communist_party_of_india_desc: "El Partido Comunista de la India es el partido comunista más antiguo de la India. El PCI fue fundado en la actual Kanpur el 26 de diciembre de 1925."
 RAJ_communist_party_of_india_marxist: "Partido Comunista de la India Marxista"
 RAJ_communist_party_of_india_marxist_desc: "El Partido Comunista de la India Marxista es un partido político comunista en la India. Es el partido comunista más grande de la India en términos de membresía y escaños electorales y uno de los partidos nacionales de la India."
 RAJ_communist_party_of_india_politc: "India Comunista!"
 RAJ_communist_party_of_india_politc_desc: "La India finalmente ha logrado la revolución socialista! Alabado sea el Rojo Octubre!"
 RAJ_empow_centre_of_trade_unions: "Empoderar al Proletariado"
 RAJ_empow_centre_of_trade_unions_desc: "El proletariado debería ser ahora completamente libre y afirmar sus derechos en la India!"
 RAJ_operation_barga: "Operación Barga"
 RAJ_operation_barga_desc: "La Operación Barga fue un movimiento de reforma agraria en todo el Bengala Occidental rural para registrar los nombres de los aparceros mientras se evitaba el método de registro a través de la maquinaria de liquidación. Otorgó a los bargadars la protección legal contra el desalojo por parte de los terratenientes y les dio derecho a la parte correspondiente de la producción."
 RAJ_a_new_international: "Una nueva Internacional"
 RAJ_a_new_international_desc: "Debe formarse una nueva internacional para que todos los países comunistas se unan en un frente unido!"
 indian_event.30.t: "La India exige nuestra sumisión"
 indian_event.30.d: "La India exige nuestra integración completa en el país."
 indian_event.30.a: "Estamos de acuerdo."
 indian_event.30.b: "Nos negamos."
 RAJ_influence_west_bengal: "Anexar Bangladesh"
 RAJ_influence_west_bengal_desc: "Bangladesh debería unirse a nosotros por todos los medios posibles. Hemos esperado este momento durante mucho tiempo."
 RAJ_bring_back_5_year_plan: "Traer de vuelta el plan quinquenal"
 RAJ_bring_back_5_year_plan_desc: "La tontería capitalista moderna debería desaparecer. El plan quinquenal socialista es el camino a seguir!"
 RAJ_foreign_specialists_idea: "Especialistas Extranjeros"
 RAJ_foreign_specialists_idea_desc: "Hemos invitado a especialistas extranjeros para que ayuden a nuestro país con su economía."
 RAJ_green_economy_idea: "PIB Verde Indio"
 RAJ_indian_socialism_idea: "Socialismo Indio"
 RAJ_scandinavian_model_idea: "Modelo Escandinavo"
 RAJ_true_social_democracy_idea: "Verdadera Socialdemocracia"
 RAJ_samajwadi_party: "Partido Samajwadi"
 RAJ_samajwadi_party_desc: "Un partido político regional indio que opera principalmente en el estado de Uttar Pradesh. Fundado el 4 de octubre de 1992, surgió con la disolución del Janata Dal. Se posiciona como un partido socialdemócrata."
 RAJ_bycicle_of_socialism: "Bicicleta del Socialismo"
 RAJ_bycicle_of_socialism_desc: "La economía india es una gran bicicleta y nosotros, los ciudadanos de la India, somos solo partes de esa bicicleta. Necesitamos una nueva economía de bicicleta para que nuestra economía funcione como una sola estructura y llevar nuestra bicicleta de prosperidad hacia adelante."
 RAJ_invite_foreign_speicalists: "Invitar a Especialistas Extranjeros"
 RAJ_invite_foreign_speicalists_desc: "Nuestro pueblo ha sido explotado por los capitalistas inescrupulosos, que en su fatal búsqueda del libre mercado, se han olvidado completamente de la gente común. Es hora de engrasar las ruedas de la economía."
 RAJ_orthodox_socialism: "Socialismo Ortodoxo"
 RAJ_orthodox_socialism_desc: "La rosa socialista que ha llegado y florecido en la India está lista para extender sus espinas contra la injusticia social y afirmar los derechos de los trabajadores en nuestra tierra."
 RAJ_socialist_india: "India Socialista"
 RAJ_socialist_india_desc: "Nuestro gran movimiento popular no puede prescindir de un buen sistema de planificación económica."
 RAJ_befriend_religious_organizations: "Amistad con Diferentes Religiones"
 RAJ_befriend_religious_organizations_desc: "La bicicleta india pasará por encima de cualquier disputa, incluso entre religiones."
 RAJ_neutrality_politics: "Política de Neutralidad"
 RAJ_neutrality_politics_desc: "La India es un país cuyas políticas internas y externas ya no deberían depender de presiones externas. Ahora somos un líder de naciones no alineadas."
 RAJ_caste_wage_balancing: "Equilibrio Salarial de Castas"
 RAJ_caste_wage_balancing_desc: "Deberíamos optimizar los salarios de diferentes castas en nuestro país para que haya paz y tranquilidad."
 RAJ_break_status_quo: "Romper el Statu Quo"
 RAJ_break_status_quo_desc: "Nuestra política exterior ya no se trata de cooperación militar con otros países. Ahora solo estamos interesados en nuestros propios problemas."
 RAJ_encourage_birth: "Fomentar el Nacimiento"
 RAJ_encourage_birth_desc: "Hemos encontrado una mejor manera de mantener alta la tasa de natalidad de nuestro país."
 RAJ_prior_for_famil: "Prioridad para las Familias"
 RAJ_prior_for_famil_desc: "Debemos patrocinar a las familias para mejorar la tasa de natalidad positiva en nuestro país."
 RAJ_peserve_traditions: "Preservar Tradiciones"
 RAJ_peserve_traditions_desc: "Al ganar la confianza de diferentes religiones en nuestro país, podemos mejorar nuestra situación y avanzar hacia un futuro brillante."
 RAJ_indian_premor_socialism: "Socialismo Primordial Indio"
 RAJ_indian_premor_socialism_desc: "Uniremos a todas las personas en nuestro país, independientemente de su género, raza o color. Todos obtendrán lo que merecen y la India prosperará."
 RAJ_organiz_of_unit_soc_people: "Organizar Unidad de Personas Sociales"
 RAJ_organiz_of_unit_soc_people_desc: "A pesar de nuestra neutralidad, aún podemos defender nuestros intereses en la arena internacional."
 RAJ_new_indian_democracy: "Nueva Democracia India"
 RAJ_new_indian_democracy_desc: "Nuestro partido sugiere que la antigua democracia no era perfecta. Ahora es el momento de crear una nueva democracia, una que sea más correcta que la que teníamos."
 RAJ_anticor_soc_meas: "Esfuerzos Anticorrupción"
 RAJ_anticor_soc_meas_desc: "La corrupción en el estado es un virus para nuestra gente. Si no lo curamos, nuestro país estará en peligro."
 RAJ_ease_the_caste_stuff: "Facilitar las Cosas de las Castas"
 RAJ_ease_the_caste_stuff_desc: "Necesitamos reducir el sistema de castas para lograr la estabilidad en el estado."
 RAJ_preserve_soccon: "Preservar el Conservadurismo Social"
 RAJ_preserve_soccon_desc: "Necesitamos reducir el conservadurismo social para mantener el espíritu selectivo y positivo de nuestra gente."
 RAJ_regional_redistr: "Redistribución Regional"
 RAJ_regional_redistr_desc: "Creemos que los costos de las pensiones y la seguridad social no están distribuidos equitativamente en nuestro país. Necesitamos cambiar eso."
 RAJ_merge_bengal_party: "Fusionar el Partido de Bengala"
 RAJ_merge_bengal_party_desc: "Nuestros partidos deben unirse para que nuestra gran bicicleta pueda seguir adelante."
 RAJ_reforming_the_conomy_soc: "Reformar la Economía Social"
 RAJ_reforming_the_conomy_soc_desc: "Es hora de reformar nuestra economía para corregir sus defectos."
 RAJ_7030_economy: "Economía 7030"
 RAJ_7030_economy_desc: "Hay muchas personas pobres en nuestro país. Hay un 70% de ellos, y esto debe corregirse. El otro 30% son personas ricas, y creemos que podrán mantenerse a sí mismos."
 RAJ_reserved_seats: "Asientos Reservados"
 RAJ_reserved_seats_desc: "Para tener elecciones más honestas, necesitamos reservar asientos en el gobierno para evitar la corrupción."
 RAJ_changing_stakeholders: "Cambiar a los Interesados"
 RAJ_changing_stakeholders_desc: "Ya no estamos interesados en los antiguos patrocinadores."
 RAJ_praise_the_unions: "Elogiar a los Sindicatos"
 RAJ_praise_the_unions_desc: "Los sindicatos son la columna vertebral de nuestro país, y debemos asegurar sus intereses a nivel estatal."
 RAJ_green_economy_soc: "PIB Verde Indio"
 RAJ_green_economy_soc_desc: "Hemos podido crear condiciones favorables para el desarrollo de la economía india. Ahora podemos saborear sus frutos."
 RAJ_equal_not_equity: "Igualdad, no Equidad"
 RAJ_equal_not_equity_desc: "Es hora de resolver los problemas finales de nuestro país para finalmente llegar a un equilibrio ideal."
 RAJ_full_soc_conv: "Verdadera Economía Social Democrática"
 RAJ_full_soc_conv_desc: "Creemos que tal sistema permitirá que la India florezca durante muchos años."
 RAJ_scandinavian_model: "Modelo Escandinavo"
 RAJ_scandinavian_model_desc: "Escandinavia es una región exitosa, con países bien desarrollados en términos económicos y sociales. Su opción de desarrollo nos conviene más."
 RAJ_communist_influence_zone: "Zona de Influencia Comunista"
 RAJ_communist_influence_zone_desc: "Nuestros vecinos deberían encenderse con el espíritu revolucionario! Deberíamos difundir el mensaje del marxismo entre ellos!"
 RAJ_befriend_china: "Hacer Amistad con China"
 RAJ_befriend_china_desc: "Los conflictos estúpidos van y vienen, pero la hermandad internacional permanece! China debería convertirse en nuestro mejor amigo!"
 RAJ_sino_indian_alliance: "Alianza Sino-India"
 RAJ_sino_indian_alliance_desc: "Ahora debemos establecer una alianza para que los capitalistas teman nuestro poder!"
 indian_event.31.t: "Alianza Sino-India"
 indian_event.31.d: "Después de muchos años de animosidad, nuestros países finalmente han llegado a un acuerdo de alianza y están listos para aplastar la basura capitalista!"
 indian_event.31.a: "Maravilloso"
 RAJ_spit_on_revision: "Escupir a los Revisionistas"
 RAJ_spit_on_revision_desc: "En contraste, nuestro vecino recalcitrante, China, difunde ideas falsas sobre el \"verdadero\" socialismo. Su estructura política nos amenaza primero, y debemos eliminar la amenaza antes de que se lance un ataque preventivo contra nosotros."
 indian_event.32.t: "La India Ofrece Alianza"
 indian_event.32.d: "¿Deberíamos estar de acuerdo?"
 indian_event.32.a: "Por supuesto"
 indian_event.32.b: "Lo siento, no"
 RAJ_vietnam_indian_alliance: "Alianza Vietnam-India"
 RAJ_vietnam_indian_alliance_desc: "Vietnam está mucho más cerca de nuestra ideología que la pseudo-socialista China. Deberíamos hacer amistad con ellos."
 RAJ_REV_PAK_TT: "§YIniciaremos una revolución en Pakistán para derrocar a su gobierno§!"
 RAJ_REV_PER_TT: "§YIniciaremos una revolución en Irán para derrocar a su gobierno§!"
 RAJ_revolution_in_pakistan: "Revolución en Pakistán"
 RAJ_revolution_in_pakistan_desc: "Pakistán debe ser liberado de las cadenas religiosas y capitalistas y ser liberado por nuestro pueblo!"
 RAJ_iranian_question: "Revolución en Irán"
 RAJ_iranian_question_desc: "Irán debe ser liberado de cadenas religiosas y capitalistas y ser liberado por nuestro pueblo!"
 RAJ_crush_nepal_bhutan: "Aplastar Nepal y Bután"
 RAJ_crush_nepal_bhutan_desc: "Nepal y Bután son regímenes reaccionarios que se oponen a las enseñanzas del marxismo. Debemos exportar nuestra revolución a ellos."
 RAJ_promote_bangladeshi_communism: "Subcontinente del Socialismo"
 RAJ_promote_bangladeshi_communism_desc: "Nuestro subcontinente debe ser totalmente socialista y esa es la única manera!"
 RAJ_national_federation_of_women: "Federación Nacional de Mujeres"
 RAJ_national_federation_of_women_desc: "Las mujeres deben ser liberadas de las cadenas sociales y convertirse en miembros iguales de nuestra sociedad."
 RAJ_all_ndia_youth_commun: "Movimiento Juvenil de Toda la India"
 RAJ_all_ndia_youth_commun_desc: "Debe establecerse un movimiento pionero indio para adoctrinar a los niños en nuestra ideología más verdadera."
 RAJ_common_minimum_programme: "Programa mínimo común"
 RAJ_common_minimum_programme_desc: "Todos los pobres deben ser apoyados. No podemos dejarlos atrás, aunque signifique imponerles una nueva forma de vida."
 RAJ_fund_cprf: "Ayudar al PCFR"
 RAJ_fund_cprf_desc: "El Partido Comunista ruso debe ser apoyado para ganar control y unirse a nuestra causa."
 RAJ_promote_marxism_in_indochina: "Promover el marxismo en Indochina"
 RAJ_promote_marxism_in_indochina_desc: "El marxismo debe ser promovido en Indochina, ya que es el próximo paso lógico en nuestra revolución regional."
 RAJ_crusade_against_religion: "Cruzada contra la religión"
 RAJ_crusade_against_religion_desc: "¿Religión? ¡Qué tontería! Reemplaza a Vaedas con los escritos de Marx, eso ayudará."
 RAJ_triumph_of_communism: "Triunfo del comunismo"
 RAJ_triumph_of_communism_desc: "Nuestro país es un ejemplo de cómo debe construirse el socialismo. Envidia, capitalistas!"
 RAJ_new_socialism_of_india: "Nuevo socialismo de la India"
 RAJ_new_socialism_of_india_desc: "Nuestro Socialismo es nuevo para la India. Es nuestro propio modelo y debe ser ejemplar."
 RAJ_ideological_comissars: "Comisarios Ideológicos"
 RAJ_ideological_comissars_desc: "La forma de pensar en la población debe ser controlada. Los comisarios Ideológicos harán el trabajo."
 RAJ_close_parliament: "Comunismo militar"
 RAJ_close_parliament_desc: "Debemos estar armados hasta los dientes porque los salvajes capitalistas quieren conquistar nuestro país!"
 RAJ_REB_S_neutrality: "República Socialista Soviética del Sudeste Asiático"
 RAJ_partnership_with_russia: "Amistad con Rusia"
 RAJ_partnership_with_russia_desc: "Rusia ya no es tan comunista, pero nuestros lazos históricos y su nostalgia soviética son buenos fundamentos para el diálogo."
 RAJ_congress_of_soviets: "República Socialista Soviética del Sudeste Asiático"
 RAJ_congress_of_soviets_desc: "Ha llegado el momento. Nos convertiremos en algo más que sólo la India socialista. Deberíamos convertirnos en SASSR."
 RAJ_new_democratic_india_idea: "Nueva India Democrática"
 RAJ_bahujan_samaj_party: "Partido Bahujan Samaj"
 RAJ_bahujan_samaj_party_desc: "Partido Político Nacional Indio. Representa los intereses de los dalits y otros grupos de castas bajas de la población (de ahí el término \"Bahujan\"). Las castas y tribus registradas de la India y otras \"clases atrasadas\" constituyen el 85% de la población."
 RAJ_torch_of_ambedkar: "Antorcha de Ambedkar"
 RAJ_torch_of_ambedkar_desc: "La antorcha que Ambedkar encendió en 1927 durante el movimiento Mahad se ha convertido ahora en un incendio forestal que no se detendrá hasta que haya vengado las atrocidades cometidas contra los Dalits a lo largo de la historia."
 RAJ_social_transformation: "Transformación social"
 RAJ_social_transformation_desc: "Necesitamos transformar nuestra sociedad en una más perfecta."
 RAJ_economic_emancipation: "Emancipación económica"
 RAJ_economic_emancipation_desc: "Nuestra economía requiere medidas especiales para optimizarla."
 RAJ_social_democracy_of_india: "Social Democracia de la India"
 RAJ_social_democracy_of_india_desc: "Crearemos una democracia social más avanzada y liberal para que nuestra gente sienta que su opinión es escuchada."
 RAJ_Indian_federation_of_free_peoples: "Federación India de Pueblos Libres"
 RAJ_Indian_federation_of_free_peoples_desc: "Crearemos un país en el que la democracia y la libertad de expresión se conviertan en la base de la existencia. El resto de los países democráticos tendrán que imitarnos, porque su democracia no es tan perfecta como la nuestra."
 RAJ_appease_all_castes: "Aplacar a todas las castas"
 RAJ_appease_all_castes_desc: "Todas las castas deben ser apaciguadas para que podamos mostrar a todos que todos los derechos e intereses son verdaderamente respetados en nuestro país."
 RAJ_new_indian_educ: "Nueva educación india"
 RAJ_new_indian_educ_desc: "Nuestro Gobierno ha preparado una reforma educativa para que todos los ciudadanos de nuestro país tengan acceso a una buena educación."
 RAJ_rural_employment_prog: "Programa de empleo rural"
 RAJ_rural_employment_prog_desc: "Todavía tenemos un gran número de desempleados en áreas rurales. Necesitamos solucionar esto creando un programa especial de reclutamiento y agitación para el trabajo."
 RAJ_more_funding_for_regions: "Más financiamiento para las regiones"
 RAJ_more_funding_for_regions_desc: "Para asegurar el crecimiento de la economía de la India, es necesario asignar más fondos para el desarrollo de sus regiones. Especialmente en lugares con infraestructura pobre."
 RAJ_caste_wage_balancing1: "Equilibrio salarial de castas"
 RAJ_caste_wage_balancing1_desc: "Necesitamos equilibrar los salarios de diferentes castas para asegurar la estabilidad de nuestro estado."
 RAJ_crush_the_caste: "Aplastar el sistema de castas"
 RAJ_crush_the_caste_desc: "Necesitamos romper el sistema de castas para que nuestra sociedad pueda continuar su transformación."
 RAJ_untouchables_reed: "Reeducación de los intocables"
 RAJ_untouchables_reed_desc: "Necesitamos mejorar la educación en nuestro país para hacer que nuestro país sea más avanzado científicamente"
 RAJ_make_religions_bow: "Hacer que las religiones se inclinen"
 RAJ_make_religions_bow_desc: "Cada religión en nuestro país debe estar sujeta a una sola ley para evitar la inestabilidad"
 RAJ_secular_india: "India secularista"
 RAJ_secular_india_desc: "La India ya no dependerá de la opinión de las religiones."
 RAJ_wipe_out_gandhis_legacy: "Borrar el legado de Gandhi"
 RAJ_wipe_out_gandhis_legacy_desc: "El legado de Gandhi es un gran problema para construir una sociedad liberal."
 RAJ_new_indian_civilization: "Nueva civilización india"
 RAJ_new_indian_civilization_desc: "Ahora el pueblo de la India se ha vuelto más puro que antes. Hemos llevado a cabo muchas reformas que podrían conducir a esto. Ha llegado el momento de una nueva civilización india."
 RAJ_modern_indian_constitut: "Constitución india moderna"
 RAJ_modern_indian_constitut_desc: "La India debe adoptar una nueva constitución para convertirse en un estado más civilizado."
 RAJ_one_wife_programme: "Programa de una sola esposa"
 RAJ_one_wife_programme_desc: "Nos aseguraremos de que cada familia en la India tenga solo una esposa."
 RAJ_redistr_of_wealth: "Redistribución de la riqueza"
 RAJ_redistr_of_wealth_desc: "La pobreza es nuestro principal enemigo. Tenemos que combatirla."
 RAJ_bamcef: "BAMCEF"
 RAJ_bamcef_desc: "Una organización de trabajadores de comunidades oprimidas, establecida en 1971 por Kanshi Ram, D. K. Haparde y Dinabana. El término deriva su significado de la Constitución de la India, que divide a los indios oprimidos y explotados en clases según su estatus: Castas Registradas, Tribus Registradas, Otras Clases Atrasadas y Comunidades Minoritarias."
 indian_event.33.t: "La India exige nuestra sumisión"
 indian_event.33.d: "La India exige nuestra integración completa en el país."
 indian_event.33.a: "Estamos de acuerdo."
 indian_event.33.b: "Nos negamos."
 nat_coal_tt: "§GUniremos a todos los nacionalistas!§!"
 mah_coal_tt: "§YSecuestraremos la popularidad de Shiv Sena!§!"
 shiv_coal_tt: "§YSecuestraremos la popularidad de MNS Sena!§!"
 RAJ_indian_ceasar_idea: "Tradicionalismo Indio"
 dep_musl_tt: "§Y¡Deportaremos musulmanes de la India!§!"
 RAJ_REV_TIB_TT: "§YIniciaremos una rebelión en el Tíbet!§!"
 indian_event.34.t: "Rebelión en el Tíbet!"
 indian_event.34.d: "El Tíbet ha declarado la independencia y exige nuestro reconocimiento. ¿Qué debemos hacer?"
 indian_event.34.a: "Aplastarlos!"
 indian_event.34.b: "¿Paz? ¿Tal vez?"
 RAJ_greater_hindustan_decisions_category: "Expansión de la Gran Hindustán"
 RAJ_greater_hindustan_decisions_category_desc: "El concepto de Akhand Bharat prevé un subcontinente indio unificado. Estas decisiones persiguen la expansión territorial y política hacia esa visión."
 RAJ_expanding_sphere_of_influence: "Exigir lealtad afgana"
 RAJ_demand_sri_lanka: "Exigir Sri Lanka"
 RAJ_demand_myanma: "Socavar la independencia de Myanmar"
 RAJ_burn_down_the_separatist_sentiments: "Quemar el sentimiento separatista"
 RAJ_land_of_freedom: "Tierra de la libertad"
 RAJ_laotian_resorts: "Viaje a los resorts de Laos"
 RAJ_cambodian_natural_resources: "Recursos naturales de Camboya"
 RAJ_change_the_malaysian_constitution: "Enmendar el Código Penal de Malasia"
 RAJ_bring_hinduism_back_to_indonesia: "Reintroducir el Hinduismo en Indonesia"
 RAJ_land_mines_desc_info: "§YInsurgentes comunistas están activos en este territorio!§!"
 RAJ_brics_alliance_decisions: "BRICS"
 RAJ_brics_alliance_decisions_desc: "§HBRICS§! fue fundada para crecer las economías de naciones tan a menudo excluidas de la mesa occidental, construyendo prosperidad compartida independientemente del credo, ideología o lema.\n\nLos miembros suben a través de tres niveles: §Yobserver§!, luego §Yasociado§!, entonces §Y miembro completo§!. Una nación puede aplicarse por sí sola, o el líder de BRICS puede invitarla directamente y promoverla en la escalera. Cada paso necesita que la nación sostenga al líder en buena opinión y que se siente bajo suficiente influencia de los BRICS, por lo que las relaciones de calentamiento viene primero.\n\nAbierto para unirse desde el principio son §Y Brasil, Rusia, China, Sudáfrica§!, junto con §YEgipto, Etiopía, Arabia Saudita, los Emiratos Árabes Unidos, Argentina, Indonesia§! y varios estados del Asia central. Un puñado (§YVenezuela, Argelia, Cuba, Singapur, Dinamarca, Suecia§!) debe primero completar su propio enfoque nacional antes de unirse."
 maoist_decision_category: "Insurgencia naxalita-maoísta"
 maoist_decision_category_desc: "La insurgencia naxalita-maoísta es un conflicto en curso en la India donde los grupos maoístas, inspirados en la ideología de Mao Zedong, están involucrados en rebelión armada contra el gobierno indio. El movimiento se originó a finales del decenio de 1960 y está principalmente activo en las zonas rurales, especialmente en los estados de Chhattisgarh, Jharkhand y Odisha. La insurgencia busca abordar cuestiones de desigualdad, explotación e injusticia social en la tierra. It is considered one of the largest internal security threats to India and has resulted in significant violence and loss of life. El Gobierno ha venido implementando diversas estrategias para frenar la insurgencia y abordar las causas subyacentes.\n\n$mao_curent_popularity$: [?party_pop_array^19|%1]\n\n§RAdvertencia:§! Si un Estado alcanza §Hsevere§! niveles de insurgencia y el apoyo político maoísta supera §H15%§!, comenzarán las manifestaciones organizadas, y si se deja sin control, seguirá la rebelión armada."
 mao_curent_popularity: "§YPopularidad de los maoístas§!"
 suppress_maoist_activities: "Suprimir actividades maoístas"
 indian_event.35.t: "Rebelión del Turkestán Oriental"
 indian_event.35.d: "Hoy recibimos información urgente de que las minorías musulmanas en Xinjiang han lanzado un levantamiento armado para separarse de China y declarar un Turkestán Oriental independiente. Supuestamente, los rebeldes son apoyados por el gobierno islamista de la India. ¿Deberíamos lanzar una intervención militar en Xinjiang o dejar las cosas como están?"
 indian_event.35.a: "Intervene militarmente."
 indian_event.35.b: "Esta no es nuestra preocupación."
 RAJ_REV_ETK_TT: "§BIniciaremos una rebelión en Xinjiang!§!"
 RAJ_copied_american_warfare_tactics_idea: "Tácticas de Guerra Americanas Copiadas"
 RAJ_increase_arms_production_idea: "Aumento de la Producción de Armas"
 RAJ_revolutions_help: "§BPodemos ayudar a derrocar un gobierno hostil hacia nosotros en Asia Central!§!"
 is_top_influencer_pak: "§Y[ROOT.GetNameWithFlag]§! tiene más del §G>=35%§! de influencia en §Y[PAK.GetNameWithFlag]§!"
 indian_event.36.t: "La Cuestión de Unir Nuestros Países"
 indian_event.36.d: "Debido a que en tiempos recientes han surgido muchas similitudes entre nuestros países tanto en ideología como en interacción económica y política, ha surgido la cuestión de unir nuestros países entre nuestro gobierno y el gobierno de la India. ¿Deberíamos unirnos con nuestro vecino o elegiremos un 'diferente' camino?"
 indian_event.36.a: "Sí, construiremos juntos una revolución islamista mundial."
 indian_event.36.b: "Elegiremos un camino diferente"
 RAJ_declare_holy_jihad: "Declarar la Yihad Sagrada"
 RAJ_declare_holy_jihad_desc: "El Califato proclama su programa expansionista como un deber religioso, movilizando a la población para la guerra contra los vecinos considerados apóstata o hostil."
 RAJ_reach_out_to_pakistani_Salafists: "Llegar a los salafistas en Pakistán"
 RAJ_reach_out_to_pakistani_Salafists_desc: "Necesitamos resolver el problema con los salafistas pakistaníes para poder abrir el camino hacia el Medio Oriente."
 RAJ_funding_central_asian_islamists: "Financiamiento de islamistas en Asia Central"
 RAJ_funding_central_asian_islamists_desc: "Asia Central es un trampolín ideal para la propagación de la revolución islamista."
 RAJ_islamic_central_asian_revolutions: "Revolución de Turkestán"
 RAJ_islamic_central_asian_revolutions_desc: "Al vincularnos con los ideólogos del islamismo en Asia Central, podemos aumentar enormemente nuestra esfera de influencia."
 RAJ_true_indian_territories_in_cenasia: "Establecer regímenes leales"
 RAJ_true_indian_territories_in_cenasia_desc: "Finalmente podemos unir a los hermanos en religión en Asia Central"
 RAJ_turkmen_treaty: "Tratado con Turkmenistán"
 RAJ_turkmen_treaty_desc: "Turkmenistán es de interés estratégico para nosotros, por lo que podemos enlistar su apoyo."
 RAJ_ally_taliban: "Nuestros hermanos afganos"
 RAJ_ally_taliban_desc: "Necesitamos unirnos con nuestros hermanos en Afganistán, solo juntos podemos derrotar al mundo secular."
 RAJ_first_partition_of_afghanistan: "Primera partición de Afganistán"
 RAJ_first_partition_of_afghanistan_desc: "Afganistán es el territorio que presenta una ventaja ideal en el asunto de propagar la revolución islamista."
 RAJ_bye_bye_turkmenistan: "Derrocar al esquizofrénico"
 RAJ_bye_bye_turkmenistan_desc: "¿Realmente pensaron que seríamos amigos de ellos?"
 RAJ_peaceful_reunification: "Reunificación pacífica"
 RAJ_peaceful_reunification_desc: "Debido a nuestra conexión religiosa especial con los salafistas pakistaníes, así como nuestra conexión económica especial, hemos decidido reunificarnos pacíficamente con Pakistán. InShaAllah!"
 RAJ_bring_back_kashmir: "Aplastar a los herejes"
 RAJ_bring_back_kashmir_desc: "No perdonaremos a Pakistán por el hecho de que todavía nos está cortando el acceso a nuestra población en Cachemira. Pakistán será destruido!"
 RAJ_nepal_fell_after_all: "Nepal"
 RAJ_nepal_fell_after_all_desc: "Debemos recuperar el control de Nepal para aumentar nuestra influencia en la región."
 RAJ_myanmar_what: "Bono no lucha por la libertad de Birmania"
 RAJ_myanmar_what_desc: "Por supuesto que tiene 'libre' elección."
 RAJ_bangladesh_independence: "Cuestionar la independencia de Bangladesh"
 RAJ_bangladesh_independence_desc: "Bangladesh es una espina en nuestro costado, porque si las tropas extranjeras entran en su territorio, nuestro corredor oriental estará en peligro."
 RAJ_support_xinjian_islamists: "Liberar el Turkestán Oriental"
 RAJ_support_xinjian_islamists_desc: "China ha oprimido a la población islámica de Xinjiang durante demasiado tiempo. Debemos ayudarlos a ganar independencia y vivir la vida que quieren vivir."
 RAJ_troubleshoot_the_map: "Corregir el error de mapeo"
 RAJ_troubleshoot_the_map_desc: "Israel es la mayor amenaza y error del mundo. Debemos corregir la inexactitud que se dibujó en el mapa."
 RAJ_to_avenge_the_oppression_of_the_uighurs: "Vengar la opresión uigur"
 RAJ_to_avenge_the_oppression_of_the_uighurs_desc: "Era el momento de resolver la cuestión final sobre el cuenco de arroz."
 RAJ_main_enemy_of_chaliphate: "Decapitar al Shaytan"
 RAJ_main_enemy_of_chaliphate_desc: "Es hora de pagar la deuda nacional."
 RAJ_get_weapons_on_the_black_market: "Aventuras del mercado negro"
 RAJ_get_weapons_on_the_black_market_desc: "Nos hemos vuelto demasiado aislados, lo que nos obliga a adquirir armas a través de métodos tortuosos."
 RAJ_training_our_soldiers_in_mountains: "Entrenamiento especial en la montaña"
 RAJ_training_our_soldiers_in_mountains_desc: "Al preparar a nuestros soldados para las condiciones más extremas, podremos propagar nuestra revolución en cualquier parte del mundo sin impedimentos."
 RAJ_american_tactic: "Tácticas estadounidenses"
 RAJ_american_tactic_desc: "Las tácticas estadounidenses han demostrado ser efectivas en muchas guerras. Deberíamos tomar un ejemplo de ellos para nuestro ejército."
 RAJ_increase_arms_production: "Aumentar la producción de armas"
 RAJ_increase_arms_production_desc: "La ampliación de la capacidad nacional de fabricación de armas es esencial para mantener nuestras campañas militares y reducir la dependencia de los proveedores extranjeros."
 RAJ_international_jihadis: "Yihadistas del Medio Oriente"
 RAJ_international_jihadis_desc: "Las ideas del islamismo funcionan mucho mejor en el Medio Oriente, por lo que necesitamos promover estas ideas una y otra vez"
 RAJ_support_islamists: "Apoyar a los islamistas en Siria"
 RAJ_support_islamists_desc: "Con aliados en Siria, podemos atacar directamente a los países occidentales."
 RAJ_reconcile_al_qaeda_and_isis: "Unir a los separados"
 RAJ_reconcile_al_qaeda_and_isis_desc: "Al formar una alianza unificada con otros aliados ideológicos, podemos acercarnos mucho más a crear nuestro sueño común de un califato islámico."
 RAJ_fight_against_idols: "Luchar contra la idolatría"
 RAJ_fight_against_idols_desc: "El nuevo régimen se mueve contra la infraestructura religiosa hindú, sij y budista, tratando complejos y santuarios del templo como amenazas ideológicas para ser desmantelados o reutilizados."
 RAJ_no_women_in_politics: "No mujeres en la política"
 RAJ_no_women_in_politics_desc: "Nuestra religión no presume que las mujeres deban involucrarse en la política."
 RAJ_islamization_of_India: "Islamización de la India"
 RAJ_islamization_of_India_desc: "Un programa nacional de conversión forzada, desplazamiento e ingeniería demográfica reforma la sociedad india para adaptarse a la visión del Califato de un estado unificado sunní."
 RAJ_redo_social_policies: "Establecer leyes de la Sharia"
 RAJ_redo_social_policies_desc: "La ley de la Sharia es lo que realmente necesita la gente de la India. Si no las introducimos, no podemos llamarnos un verdadero califato islámico."
 RAJ_fatwa_of_factories: "Fatwa industrial"
 RAJ_fatwa_of_factories_desc: "Una fatwa se puede definir como una fuente legal normativa del derecho islámico, que actúa como las opiniones de los eruditos del mundo del Islam con autoridad sobre cuestiones específicas bajo consideración, iniciada por jueces islámicos (qadis) o a solicitud del Majlis."
 RAJ_MAO_rebellion: "Situación de la Rebelión"
 RAJ_fatwa_of_factories_idea: "Fatwa de las Fábricas"
 the_great_islamic_ulema: "Gran Ulema Islámica"
 indian_event.37.t: "Una nueva organización islámica"
 indian_event.37.d: "El nuevo gobierno islamista de la India ha venido a nosotros con una propuesta para formar una organización islamista unificada cuyo propósito principal es difundir las opiniones islamistas en todo el mundo. Dado que la cabeza de esta alianza es el poderoso país de la India, unirse a ella probablemente nos garantizaría la protección que buscamos de las amenazas externas y protegería a nuestro régimen gobernante de los intentos de asesinato."
 indian_event.37.a: "Claro, formemos equipo!"
 indian_event.37.b: "Nosotros también podemos protegernos"
 indian_event.38.t: "Se rechazó la invitación a la alianza"
 indian_event.38.d: "Su gobierno pensó que podían manejar una amenaza externa por su cuenta."
 indian_event.38.a: "Un resultado decepcionante."
 RAJ_revenge_for_the_humiliation_of_chechnya: "Venganza por la humillación del Califato Checheno"
 RAJ_revenge_for_the_humiliation_of_chechnya_desc: "El Califato Checheno fue una gran idea, pero los capitalistas codiciosos de Rusia decidieron destruir esta idea. Ha llegado el momento del ajuste de cuentas."
 indian_event.39.t: "Pagar para ayudar en la guerra civil"
 indian_event.39.d: "Nuestra victoria en la Guerra Civil no habría sucedido sin el apoyo directo del gobierno indio. Dado que la guerra civil fue muy costosa para la India, la India debe obtener algo a cambio. Están exigiendo que les demos control sobre algunos territorios en el norte, y a cambio nos proporcionarán protección militar contra amenazas externas. Nuestro régimen acaba de comenzar a consolidarse y no queremos ser derrocados de nuevo. ¿Qué elegiremos?"
 indian_event.39.a: "Estamos dispuestos a dar ese paso"
 indian_event.39.b: "No nos acobardamos ante la Unión Soviética y no nos acobardaremos ante la India tampoco."
 indian_event.40.t: "Demanda Rechazada"
 indian_event.40.d: "El gobierno talibán ha decidido que tiene la fuerza para enfrentarse a nuestro ejército."
 indian_event.40.a: "Veamos si puede resistir otro ataque."
 RAJ_central_asian_salaf_revolution: "Revoluciones de Asia Central"
 RAJ_HELP_TALIB: "§GSi no ayudas a los talibanes en una guerra civil, no cederán territorio§!"
 RAJ_main_enemies_of_islamism: "Principales Enemigos del Islamismo"
 RAJ_main_enemies_of_islamism_desc: "Debemos vengar el colapso del califato islámico en todos los que estuvieron involucrados en su caída."
 RAJ_proffesional_soldiers: "Soldados Profesionales"
 RAJ_proffesional_soldiers_desc: "Para difundir con éxito nuestra revolución, necesitamos fortalecer nuestro ejército."
 RAJ_mao_reb.1.t: "Contrataque Maoísta!"
 RAJ_mao_reb.1.d: "Hemos contrarrestado exitosamente su actividad en la región, sin embargo perdimos muchos hombres."
 RAJ_mao_reb.1.a: "Entiérralos con honor."
 RAJ_mao_reb.2.t: "Gran Ataque Terrorista!"
 RAJ_mao_reb.2.d: "Después de nuestras recientes redadas, los maoístas han llevado a cabo un gran ataque terrorista en nuestras regiones más pobladas."
 RAJ_mao_reb.2.a: "Ugh"
 RAJ_mao_reb.3.t: "Redada Exitosa"
 RAJ_mao_reb.3.d: "Hemos perdido algunos hombres, pero el enemigo fue derrotado."
 RAJ_mao_reb.3.a: "Genial"
 RAJ_Export_category: "Comercio de Armas Indio"
 RAJ_Export_category_desc: "En el mundo actual, el comercio de armas es una parte integral de la economía de los países desarrollados y la India no es una excepción. Las políticas correctas de los gobiernos anteriores han permitido a la India aumentar la producción de armas y poder venderlas a otros países. Si queremos convertirnos en una potencia competitiva en el mercado internacional, debemos comenzar a desarrollar el comercio y la producción de armas. La India debe entrar en el nuevo milenio como una potencia militar avanzada."
