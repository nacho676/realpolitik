l_spanish:
 MDR_RULES: "Realpolitik"
 MDR_RULE_COVID: "Pandemia de COVID-19"
 MDR_RULE_COVID_HISTORICAL: "Histórica"
 MDR_RULE_COVID_HISTORICAL_DESC: "El brote empieza en Wuhan en diciembre de 2019 y llega a cada país en la fecha en que golpeó en la realidad: Corea del Sur e Italia en febrero de 2020 y el resto del mundo hasta abril. Las campañas de vacunación empiezan en diciembre de 2020, primero en los países ricos."
 MDR_RULE_COVID_ORIGINAL: "Original de Millennium Dawn"
 MDR_RULE_COVID_ORIGINAL_DESC: "Mantiene la pandemia de Millennium Dawn: empieza a fines de 2020 y llega a cada país en un momento al azar."
 MDR_RULE_COVID_DISABLED: "Desactivada"
 MDR_RULE_COVID_DISABLED_DESC: "No hay pandemia de COVID-19."

 mdr_covid.1.t: "Campaña de vacunación masiva"
 mdr_covid.1.d: "Las vacunas llegaron a [This.GetNameDef]. Clínicas, estadios y farmacias vacunan a millones de personas por semana, los hospitales se vacían y se levantan las cuarentenas."
 mdr_covid.1.a: "Volvemos a la vida normal."

 MDR_RULE_DIAGNOSTICS: "Modo diagnóstico"
 MDR_RULE_DIAGNOSTICS_NO: "Desactivado"
 MDR_RULE_DIAGNOSTICS_NO_DESC: "Oculta las decisiones de diagnóstico de Realpolitik."
 MDR_RULE_DIAGNOSTICS_YES: "Activado"
 MDR_RULE_DIAGNOSTICS_YES_DESC: "Se prueba solo mientras corre el juego, sin tocar nada: durante 160 días fuerza situaciones (munición y comida vacías, Suez cerrado, shocks de mercado, un desastre, un general capturado, una oferta de barco, COVID) y revisa el resultado; después revisa cada semana todos los sistemas y todos los países. Todo va a game.log; para leerlo, correr herramientas/revisar_logs.pl. También muestra las decisiones de diagnóstico. Solo para pruebas: cambia la partida."

 mdr_information: "Sociedad e Información"
 mdr_media_law: "Ley de medios"
 mdr_media_free_req_tt: "La Ley de medios actual es §Y$mdr_media_regulated$§!"
 mdr_media_regulated_req_tt: "La Ley de medios actual es §Y$mdr_media_free$§! o §Y$mdr_media_pressured$§!"
 mdr_media_pressured_req_tt: "La Ley de medios actual es §Y$mdr_media_regulated$§! o §Y$mdr_media_censored$§!"
 mdr_media_censored_req_tt: "La Ley de medios actual es §Y$mdr_media_pressured$§! o §Y$mdr_media_total_control$§!"
 mdr_media_total_control_req_tt: "La Ley de medios actual es §Y$mdr_media_censored$§!"
 mdr_media_free: "Libertad de prensa plena"
 mdr_media_free_desc: "Diarios, canales y sitios web independientes investigan al gobierno sin interferencias. La información abierta impulsa la investigación y la economía de la información, pero cada escándalo y cada relato extranjero llega a nuestros ciudadanos."
 mdr_media_regulated: "Prensa libre regulada"
 mdr_media_regulated_desc: "La prensa es libre dentro de las leyes sobre difamación, propiedad de medios y licencias de emisión. La mayoría de las democracias funciona con este modelo."
 mdr_media_pressured: "Medios bajo presión del gobierno"
 mdr_media_pressured_desc: "Los grandes medios pertenecen a aliados del gobierno, y los periodistas críticos enfrentan demandas e inspecciones fiscales. Las voces independientes sobreviven, pero llegan a menos gente. Abrirse desde §YCensura estatal§! cuesta Estabilidad por un tiempo, porque salen a la luz reclamos acallados."
 mdr_media_censored: "Censura estatal"
 mdr_media_censored_desc: "Organismos del Estado otorgan las licencias de todos los medios, filtran internet y bloquean los sitios de noticias extranjeros. Abrirse desde §YControl absoluto de la información§! cuesta Estabilidad por un tiempo."
 mdr_media_total_control: "Control absoluto de la información"
 mdr_media_total_control_desc: "Cada emisión, publicación y conexión pasa por el Estado. Una intranet nacional reemplaza a internet: protege al régimen de la influencia exterior, pero hunde la investigación y la economía de la información."

 mdr_economic_policy_category: "Política económica"
 mdr_economic_policy_category_desc: "Medidas de emergencia y de control que los gobiernos usan en la vida real. Todas tienen un costo: lo que se gana hoy suele pagarse más adelante."
 mdr_remove_fuel_subsidies: "Eliminar los subsidios a los combustibles"
 mdr_remove_fuel_subsidies_desc: "Dejar que el combustible cueste lo que vale ahorra una fortuna en gasto social, pero la población sale a la calle, como en Irán en 2019, en Ecuador en 2019 o en Nigeria en 2023. Durante 180 días sufriremos protestas."
 mdr_introduce_fuel_subsidies: "Subsidiar los combustibles"
 mdr_introduce_fuel_subsidies_desc: "El Estado paga parte del precio del combustible para que la población lo compre barato. Calma la calle, pero el costo se suma al gasto social cada semana."
 mdr_impose_capital_controls: "Imponer control de capitales (cepo)"
 mdr_impose_capital_controls_desc: "Limitamos la compra de dólares y la salida de dinero del país. Frena la fuga de capitales y sostiene la moneda, pero ahuyenta la inversión extranjera y hace nacer un dólar paralelo. Cuanto más tiempo dure, más crece la brecha: a los 6 meses y a los 18 meses empeora."
 mdr_lift_capital_controls: "Levantar el control de capitales"
 mdr_lift_capital_controls_desc: "Liberar el tipo de cambio devuelve la confianza de los inversores, pero la moneda se devalúa de golpe. Si la brecha ya era grande, el golpe a la estabilidad es mayor."
 mdr_freeze_prices: "Congelar los precios"
 mdr_freeze_prices_desc: "Fijamos por ley el precio de los productos básicos. Los primeros meses frena el golpe de la inflación, pero a los 3 meses empieza el desabastecimiento y a los 6 meses se vuelve grave. Una vez congelados, los precios deben mantenerse al menos 6 meses."
 mdr_unfreeze_prices: "Descongelar los precios"
 mdr_unfreeze_prices_desc: "Liberar los precios termina con el desabastecimiento, pero los precios saltan durante unos meses."
 mdr_fuel_subsidies_cooldown_tt: "Pasó al menos un año desde el último cambio en los subsidios a los combustibles"
 mdr_capital_controls_cooldown_tt: "Pasó al menos un año desde que levantamos el último control de capitales"
 mdr_price_freeze_cooldown_tt: "Pasó al menos un año desde el último congelamiento de precios"
 mdr_price_freeze_min_tt: "Los precios llevan al menos 26 semanas congelados (llevan [?mdr_price_freeze_weeks|0])"

 mdr_fuel_subsidies: "Subsidios a los combustibles"
 mdr_fuel_subsidies_desc: "El Estado paga parte del precio del combustible. La población lo considera un derecho adquirido."
 mdr_fuel_subsidy_protests: "Protestas por el precio del combustible"
 mdr_fuel_subsidy_protests_desc: "El fin de los subsidios disparó el precio de la nafta y del transporte. Hay cortes de ruta y manifestaciones en todo el país."
 mdr_capital_controls_1: "Control de capitales"
 mdr_capital_controls_1_desc: "El cepo frena la salida de dólares. Por ahora la brecha con el dólar paralelo es pequeña."
 mdr_capital_controls_2: "Control de capitales: brecha creciente"
 mdr_capital_controls_2_desc: "El dólar paralelo ya cotiza muy por encima del oficial. Florecen los negocios en negro y la corrupción en el acceso a las divisas."
 mdr_capital_controls_3: "Control de capitales: brecha extrema"
 mdr_capital_controls_3_desc: "Nadie confía en el tipo de cambio oficial. Las empresas no pueden girar ganancias al exterior y la economía real se resiente."
 mdr_devaluation_shock: "Shock de devaluación"
 mdr_devaluation_shock_desc: "La moneda se ajustó de golpe a su valor real tras levantar el control de capitales."
 mdr_price_freeze_1: "Precios congelados"
 mdr_price_freeze_1_desc: "Los precios de los productos básicos están fijados por ley. Por ahora las góndolas siguen llenas."
 mdr_price_freeze_2: "Precios congelados: desabastecimiento"
 mdr_price_freeze_2_desc: "Los productores dejan de vender a pérdida. Faltan productos en los comercios y crece el mercado negro."
 mdr_price_freeze_3: "Precios congelados: desabastecimiento grave"
 mdr_price_freeze_3_desc: "Hay largas colas y estantes vacíos. La gente culpa al gobierno por la escasez."
 mdr_price_release: "Liberación de precios"
 mdr_price_release_desc: "Tras el congelamiento, los precios se ajustan de golpe a su valor de mercado."
 mdr_fund_relief: "Fondo de estabilización en uso"
 mdr_fund_relief_desc: "El dinero ahorrado financia la respuesta a la crisis: ayuda a empresas, obras públicas y gasto sanitario."
 mdr_fund_trust: "Confianza de los mercados"
 mdr_fund_trust_desc: "Nuestro fondo de estabilización tiene al menos el 5% del PIB. Los acreedores nos prestan más barato."

 mdr_stabilization_fund_category: "Fondo de Estabilización y Emergencias"
 mdr_stabilization_fund_category_desc: "Ahorramos en épocas buenas para usar el dinero en las malas, como hacen Noruega, Chile o los países del Golfo.\n\nSaldo del fondo: §Y[?mdr_fund_balance|1]§! mil millones de dólares\nAporte actual: §Y[?mdr_fund_rate|1]%§! del PIB por año\n\nEl fondo rinde un 3% anual. Si llega al 5% del PIB, los mercados nos prestan más barato."
 mdr_fund_contribute_low: "Aportar el 0,5% del PIB por año"
 mdr_fund_contribute_low_desc: "Cada semana pasa al fondo una parte del dinero del tesoro equivalente al 0,5% del PIB por año."
 mdr_fund_contribute_high: "Aportar el 1% del PIB por año"
 mdr_fund_contribute_high_desc: "Cada semana pasa al fondo una parte del dinero del tesoro equivalente al 1% del PIB por año."
 mdr_fund_stop_contributions: "Suspender los aportes al fondo"
 mdr_fund_stop_contributions_desc: "El fondo deja de recibir dinero, pero conserva su saldo y sigue rindiendo intereses."
 mdr_fund_use: "Usar el fondo contra la crisis"
 mdr_fund_use_desc: "Gastamos hasta el 2% del PIB del fondo para enfrentar la crisis. El dinero vuelve al tesoro y durante 180 días la economía y la estabilidad reciben un alivio que compensa parte del golpe."
 mdr_fund_use_cooldown_tt: "Pasaron al menos 180 días desde la última vez que usamos el fondo"
 mdr_fund_crisis_tt: "Estamos en crisis: pandemia de COVID-19, recesión o depresión"
 mdr_fund_min_balance_tt: "El fondo tiene más de mil millones de dólares"

 mdr_diag_start_covid: "Iniciar el COVID histórico ahora"
 mdr_diag_start_covid_desc: "Lanza ahora el brote de Wuhan y las oleadas por país, con las mismas distancias en días que en el modo histórico. Sirve para probar sin esperar a diciembre de 2019."
 mdr_diag_start_vaccines: "Iniciar las vacunas ahora"
 mdr_diag_start_vaccines_desc: "Lanza ahora las campañas de vacunación, sin esperar a diciembre de 2020."

 mdr_diagnostics_category: "Realpolitik: Diagnóstico"
 mdr_diagnostics_category_desc: "Herramientas de prueba de Realpolitik. Los informes se escriben en game.log."
 mdr_diag_show_status: "Mostrar estado de los sistemas"
 mdr_diag_show_status_desc: "Versión: [?global.mdr_version]\nSistema de medios iniciado: [?global.mdr_media_init]\nNuestro nivel de Ley de medios: [?mdr_media_level]\n\nTomar esta decisión escribe los mismos valores en game.log."
 mdr_diag_rerun_country_init: "Reiniciar la configuración del país"
 mdr_diag_rerun_country_init_desc: "Vuelve a ejecutar la configuración de Realpolitik para nuestro país. Esto devuelve nuestra Ley de medios a su nivel inicial."
