 NKO_export.10.f.tt: "Entrega §Y IFVs§!, §YAPCs§!, §Yrifles§! y §Y equipo encargado§! suficiente para §Y tres batallones mecanizados de infantería§! (3× requisito del batallón). Requiere modernos módulos de vehículos norcoreanos."
