 NKO_specialise_commanders_tt: "§GBlindaje los comandantes defensivos, ofensivos y de armas combinadas cada uno gana un rasgo profundizando su especialidad.§!"
 NKO_specialise_guerrilla_tt: "§GLos comandantes entrenados por guerrilla aprenden a establecer emboscadas.§!"
 NKO_specialise_commando_tt: "§GLos comandantes entrenados por el Commando son promovidos para liderar fuerzas especiales.§!"
 NKO_sso_new_general_tt: "§GLa Comisión de Operaciones Especiales §!§YKim Yong Bok§!§G, un especialista en fuerzas especiales, como nuevo comandante del cuerpo.§!"
 NKO_arms_export: "Oficina de Asuntos Exteriores"
 NKO_arms_export_desc: "La oficina detrás del KOMID y el comercio exterior de armas. Suministro de armas, misiles, tropas y satélites a las naciones en guerra a cambio de divisas duras, tecnología y una base industrial permanentemente creciente."
 NKO_arms_export_modifiers: "Oficina de Asuntos Exteriores"
 NKO_arms_export_modifiers_desc: "La oficina de exportación de armas de Pyongyang. Cada nación que suministramos levanta permanentemente nuestra §Yproducción de fábrica§! y §Yeficiencia de la producción§!, un bono que crece a medida que el arsenal multipolar se expande."
 NKO_arms_export_title: "§Y Oficina de Asuntos Exteriores§!"
 NKO_arms_export_clients_readout: "Naciones suplementadas: §Y[?NKO_arms_export_clients|0]§! Tratos incluidos: §Y[?NKO_arms_export_deals|0]§!"
 NKO_arms_export_output_readout: "Producto permanente de fábrica: §G+[?NKO_arms_export_clients|0]%§!"
 NKO_arms_export_revenue_readout: "Moneda dura ganada: §G$[?NKO_arms_export_revenue|0] §! mil millones"
 NKO_arms_export_sanctions_readout: "Presión de las sanciones: [NKO_arms_export_sanctions_status]"
 NKO_arms_export_hint: "Abrir el §YConvencionales§! sección para armar cualquier §Wnon-Western§! nación §Rperder su guerra§! (30%+ rendición). Cada cliente otorga §Gproducción de fábrica permanente +1%§!, moneda dura y tecnología, pero aumenta §Rsanciones§!Ocúpese de sus clientes para aliviarlos."
 NKO_arms_export_capstone_status_progress: "§OArsenal del Mundo Multipolar: abastece a 10 naciones para desbloquear la lápida.§!"
 NKO_arms_export_capstone_status_ready: "§GEl arsario del Mundo Multipolar está al alcance. Convocar la Oficina.§!"
 NKO_arms_export_capstone_status_done: "§GArsenal del Mundo Multipolar alcanzado.§!"
 NKO_arms_export_sanctions_max: "§RMáximo (CSNU)§!"
 NKO_arms_export_sanctions_severe: "§RGrave§!"
 NKO_arms_export_sanctions_heavy: "§OPesado§!"
 NKO_arms_export_sanctions_moderate: "§OModerado§!"
 NKO_arms_export_sanctions_light: "§YLigero§!"
 NKO_arms_export_sanctions_none: "§GNinguno§!"
 NKO_arms_export_conv_open: "§YAbrir§! las exportaciones de armas convencionales"
 NKO_arms_export_conv_open_desc: "Mostrar las decisiones de suministro convencional: proyectiles de artillería y voluntarios del Cuerpo de Tormenta para cada nación en guerra."
 NKO_arms_export_conv_close: "§YCerrar§! las exportaciones de armas convencionales"
 NKO_arms_export_conv_close_desc: "Ocultar las decisiones de suministro convencional para mantener el panel despejado."
 NKO_export_munitions: "Enviar un paquete de armas convencionales a [FROM.GetNameWithFlag]"
 NKO_export_munitions_desc: "Enviar por ferrocarril un paquete de armas desde los depósitos del Ejército Popular al frente. [FROM.GetName] elige el tipo de división que más necesita (§Yinfantería ligera§!, §Ymotorizada§!, §Yblindada§! o §Ymecanizada§!) y enviamos hardware moderno, de 1995 o posterior, para §Ytres batallones§! de ese tipo, sacado directamente de nuestras propias existencias. Los paquetes blindados y mecanizados requieren un diseño de tanque moderno. No suministramos aeronaves. Combaten con más empuje y se nos paga en divisas fuertes."
 NKO_deploy_storm_corps: "Desplegar el Cuerpo de Tormenta en [FROM.GetNameWithFlag]"
 NKO_deploy_storm_corps_desc: "Ofrecer una intervención norcoreana a [FROM.GetName]. Si aceptan, desbloqueamos la capacidad de enviar §Ydivisiones de voluntarios§! a su frente, atamos más a nuestro patrón y ganamos su gratitud. Desplegar en §YRusia§! o §YChina§! abre un subsidio permanente en divisas fuertes que continúa incluso cuando el cuerpo regresa a casa. Requiere la política exterior de §YIntervencionismo global§!."
 NKO_arms_export_lobby_relief: "Presionar para obtener alivio de sanciones"
 NKO_arms_export_lobby_relief_desc: "Pasar el peso diplomático de nuestros asociados bien armados, y una suma silenciosa de dinero en efectivo, para ganar un solo paso de alivio de las sanciones internacionales en las Naciones Unidas."
 NKO_arms_export_capstone: "Arsenal del mundo multipolar"
 NKO_arms_export_capstone_desc: "Tras haber armado a una coalición de naciones contra el orden imperialista, formalizar el papel de Pionyang como taller del mundo multipolar."
 NKO_arms_export_relief_deals_tt: "Ha concluido por lo menos §Y5§! acuerdos de exportación"
 NKO_arms_export_relief_sanctions_tt: "Actualmente se encuentra bajo sanciones internacionales"
 NKO_arms_export_unlock_tt: "§GDesbloquea a la Oficina de Relaciones Exteriores, el programa exterior de exportación de armas y mano de obra.§!"
 NKO_export_munitions_effect_tt: "Si aceptan, el cliente solicita un paquete de división y entregamos lo suficiente §Y1995-o-newer§! hardware para §Y tres batallones §!, §Y extraído de nuestras propias existencias§!. Armour y paquetes mecanizados requieren un §Y moderno diseño de tanques§! (al menos la mitad de los módulos post-Cold-War). §RNo se suministran aeronaves.§! Nos pagan en §Y moneda dura§!, y un nuevo cliente otorga una prima de salida de fábrica permanente escalada al paquete: §G+1%§! infantería ligera, §G+2% §! motorizado, §G+3%§! armado o mecanizado. La presión de las sanciones aumenta.\n\nEl cliente gana §YMuniciones norcoreanas§! por §Y365§! días:\n §G+5%§! División Ataque\n §G+5%§! División tasa de recuperación\n §G-5%§! Consumo de Suministros"
 NKO_export_troops_effect_tt: "Ofrecemos desplegar fuerzas de intervención. Si el anfitrión acepta, desbloqueamos la capacidad de enviar §Y divisiones voluntaristas§! a su guerra, y ganamos favor político y moneda dura. No se pierde mano de obra en casa."
 NKO_storm_corps_permanent_income_tt: "Como patrono de gran potencia, otorgan un subsidio semanal §Ypermanente§! que continúa incluso después de que el Cuerpo de Tormentas regrese a casa."
 NKO_arms_client_munitions: "Municiones norcoreanas"
 NKO_arms_client_munitions_desc: "Crates of North Korean shells and rifles keep the guns fired."
 NKO_arms_client_troops: "Voluntarios del Ejército Popular Coreano"
 NKO_arms_client_troops_desc: "Los veteranos del Cuerpo de Tormentas endurecen el frente y sostienen la línea."
 NKO_storm_corps_abroad: "Cuerpo de tormentas desplegado en el extranjero"
 NKO_storm_corps_abroad_desc: "Nuestras mejores tropas están luchando contra una guerra extranjera. Su ausencia se siente en casa con mano de obra y moral."
 NKO_arms_export_capstone_spirit: "Arsenal del Mundo Multipolar"
 NKO_arms_export_capstone_spirit_desc: "Pyongyang se ha convertido en un proveedor indispensable para las naciones que resisten a Occidente. Nuestras fábricas corren a toda velocidad, aisladas de la presión de las sanciones."
 NKO_export.1.t: "Moscú necesita Shells"
 NKO_export.1.d: "La ofensiva de Rusia está devorando municiones más rápido de lo que sus fábricas pueden suministrar. A través de canales tranquilos, el Kremlin pide a Pyongyang proyectiles de artillería, cohetes y cualquier otra cosa que pueda salvar el Ejército Popular. El pago será generoso: efectivo, grano y la tecnología militar que hemos codiciado durante mucho tiempo."
 NKO_export.1.a: "Fulfil la orden"
 NKO_export.1.b: "No en este momento"
 NKO_export.10.t: "[FROM.GetNameWithFlag] Ofrece un paquete de armas"
 NKO_export.10.d: "Pyongyang ofrece llevar un paquete de armas modernas a nuestras fuerzas duras, pagadas en moneda dura. Podemos solicitar el equipo para el tipo de división que más necesitamos: suficiente hardware para §Y tres batallones§!, extraído directamente de las reservas norcoreanas."
 NKO_export.10.a: "Solicitar un paquete §YLight Infantry§!: rifles &"
 NKO_export.10.b: "Decline la oferta"
 NKO_export.11.t: "[FROM.GetNameWithFlag] Acepta nuestros brazos"
 NKO_export.11.d: "[FROM.GetName] ha tomado nuestra oferta. El envío deja nuestros depósitos para el frente, y la moneda dura ya está en nuestras cuentas."
 NKO_export.11.a: "Carguen los trenes"
 NKO_export.12.t: "[FROM.GetNameWithFlag] Declara nuestras armas"
 NKO_export.12.d: "[FROM.GetName] ha rechazado nuestras armas. Las cajas permanecen en nuestros almacenes."
 NKO_export.12.a: "So be it"
 NKO_export.99.t: "El Arsenal del Mundo Multipolar"
 NKO_export.99.d: "De Moscú a Teherán, las armas de una docena de ejércitos son alimentadas por fábricas norcoreanas. Lo que comenzó como un comercio desesperado por divisas duras ha hecho que la República Popular Democrática sea indispensable para todo poder que desafie a Washington. El taller de la revolución ha encontrado a sus clientes."
 NKO_export.99.a: "Que el mundo dependa de nosotros"
 NKO_export.22.t: "Pyongyang ofrece fuerzas de intervención"
 NKO_export.22.d: "[FROM.GetName] propone desplegar divisiones voluntarias coreanas en nuestro frente. Sus soldados lucharían junto con los nuestros contra nuestros enemigos, una oferta de intervención de Pyongyang que no podemos permitirnos rechazar."
 NKO_export.22.a: "Aceptar a sus soldados"
 NKO_export.22.b: "Decline la oferta"
 NKO_export.20.t: "[FROM.GetNameWithFlag] Necesita hombres"
 NKO_export.20.d: "[FROM.GetName], donde nuestro Cuerpo de Tormentas ya lucha, ha agotado sus reservas de mano de obra. Su comando apela a Pyongyang para enviar hombres frescos para mantener la línea."
 NKO_export.20.a: "Enviar refuerzos"
 NKO_export.20.b: "No podemos salvar a los hombres."
 NKO_export_send_manpower_tt: "§GEnvia la mano de obra igual a §Y10%§! del grupo reclutable [FROM.GetName], extraído de nuestras reservas.§!"
 NKO_export.40.t: "Las respuestas occidentales con las sanciones"
 NKO_export.40.d: "Nuestro equipo sigue navegando en frente de los imperialistas querían cerrarnos. [USA.GetName], unidos por [FRA.GetName], [GER.GetName] y [JAP.GetName], ha lanzado un paquete de sanciones frescas: cuentas congeladas, casas comerciales en lista negra y advertencias a cualquiera que siga comprando desde Pyongyang. Hemos soportado su presión antes."
 NKO_export.40.a: "Que los imperialistas desaparezcan"
 NKO_export.40.b: "Absorbe tranquilamente el golpe"
 NKO_arms_contract_title: "§YLos compromisos voluntarios de Patron§!"
 NKO_expeditions_readout: "Expediciones cometidas: §G[?NKO_expeditions_completed|0]§!"
 NKO_commit_volunteers: "Enviar una expedición de voluntarios a [FROM.GetName]"
 NKO_commit_volunteers_desc: "Formalizar el despliegue de nuestras divisiones voluntarias que combaten en [FROM.GetName]. Pionyang factura a su patrón la mano de obra y obtiene divisas fuertes. [FROM.GetName] paga una prima por nuestras divisiones."
 NKO_commit_volunteers_req_tt: "[FROM.GetName] acoge al menos §Y6§! de nuestras divisiones voluntarias"
 NKO_commit_volunteers_effect_tt: "Bancos una prima de moneda dura en nuestro §Ytreasury§!. Mientras nuestras divisiones §Y voluntaristas§! siguen luchando en el extranjero, el despliegue sostenido entrena a nuestro ejército, otorgando §Y dominio de la doctrina del país§! cada semana."
 NKO_economy_shortcut: "Economía"
 NKO_military_shortcut: "Militar"
 NKO_38th_parallel_shortcut: "38th Parallel"
 NKO_political_shortcut: "Política"
 NKO_overcome_the_arduous_march: "Vence el Arduous March"
 NKO_overcome_the_arduous_march_desc: "Los años de hambre están detrás de nosotros. Se ha restaurado la agricultura, se ha reconstruido Huichon y las clases de mercado emergentes han entrado en el pliegue. Finalmente podemos declarar que la Marcha Arduous superó y volteamos la fuerza total del estado hacia la recuperación nacional."
 NKO_renovate_water_supply_facilities: "Renovar las instalaciones de abastecimiento de agua"
 NKO_renovate_water_supply_facilities_desc: "Renovar y ampliar nuestras instalaciones de abastecimiento de agua es esencial para la salud pública y el desarrollo industrial. Garantizaremos un acceso limpio y fiable al agua para todos los ciudadanos e industrias."
 NKO_national_power_grid: "Rejilla de energía nacional"
 NKO_national_power_grid_desc: "Vincular nuestras estaciones renovables e centrales hidroeléctricas en una red nacional unificada estabilizará el suministro de electricidad a fábricas y hogares por igual, poniendo fin a los apagones que tienen una producción prolongada."
 NKO_pojon_field_responsibility: "Sistema de responsabilidad sobre el terreno Pojon"
 NKO_pojon_field_responsibility_desc: "El sistema Pojon otorga autonomía a pequeños equipos de trabajo familiar sobre superávit agrícola por encima de las cuotas estatales. Al permitir que los campesinos retengan cosechas de incentivos, se expande la producción y se fortalece la seguridad alimentaria."
 NKO_rason_ftz: "Rason Zona Económica Especial"
 NKO_rason_ftz_desc: "La Zona de Libre Comercio Rason en el noreste, desarrollada conjuntamente con la inversión china y rusa, abre la puerta de entrada de Corea del Norte al comercio transfronterizo legal. El control del puerto de Rajin y el acceso a la frontera desbloquea el comercio económico sostenido."
 NKO_koryolink_network: "Red móvil Koryolink"
 NKO_koryolink_network_desc: "Koryolink, lanzado en 2008 como una red 3G construida con Orascom Telecom, ofrece telecomunicaciones modernas a millones de suscriptores. Una red móvil moderniza el flujo de información y reduce la dependencia de los medios controlados por el Estado."
 NKO_pyongyang_prestige_streets: "Calles de prestigio Pyongyang"
 NKO_pyongyang_prestige_streets_desc: "Avenidas de escaparate como Mirae Scientists Street y Ryomyong Street, construidas a un ritmo rápido para proyectar la modernidad nacional y el desafío a pesar de las sanciones internacionales. Estos símbolos urbanos refuerzan la moral popular y el prestigio internacional."
 NKO_ryugyong_hotel: "Ryugyong Hotel Finalización"
 NKO_ryugyong_hotel_desc: "La pirámide de 105 pisos Ryugyong Hotel, larga estancia, recibe su revestimiento exterior de cristal completo entre 2008 y 2011. Este hito arquitectónico simboliza la ambición tecnológica nacional y la recuperación económica."
 NKO_exporting_workforce: "Exportación de fuerza de trabajo"
 NKO_chollima_speed: "Velocidad de Chollima"
 NKO_field_responsibility_system: "Sistema de Responsabilidad sobre el Terreno"
 NKO_field_responsibility_system_desc: "El sistema de responsabilidad del campo Pojon faculta a las brigadas campesinas para retener cosechas excedentes por encima de las cuotas estatales, creando incentivos de producción. La producción agrícola sostenida mejora la seguridad alimentaria y la moral popular."
 NKO_mobile_network: "Red móvil Koryolink"
 NKO_mobile_network_desc: "Una red de telecomunicaciones 3G moderna llega a millones de suscriptores, modernizando la infraestructura de comunicaciones. La mejora del acceso a la información y la menor dependencia de los medios estatales reduce la tensión social."
 NKO_people_army: "El Ejército Popular"
 NKO_people_army_desc: "El Ejército Popular tuvo que estar listo para la guerra, incluso durante el difícil período de la «Marcha Ardua», con el fin de defenderse contra el imperialismo estadounidense y sus títeres surcoreanos."
 NKO_national_defence_force: "Defensa nacional"
 NKO_national_defence_force_desc: "Aumentaremos nuestro gasto militar para que coincida con el de nuestra contraparte del Sur, para mantener a nuestra nación segura y segura de cualquier amenaza."
 NKO_red_dawn: "Rojo Dawn"
 NKO_red_dawn_desc: "El amanecer de nuestro espíritu revolucionario brillará una vez más mientras reforzamos nuestro poder militar. Que este sea el comienzo de nuestra marcha implacable hacia la supremacía."
 NKO_studying_their_airforce: "Estudio Fuerzas Aéreas Enemigas"
 NKO_studying_their_airforce_desc: "Para prepararse para conflictos inevitables, debemos estudiar las fuerzas aéreas de nuestros enemigos, aprender sus fortalezas y debilidades, y diseñar contra-estrategias."
 NKO_focus_on_the_f_35: "Enfoque en el F-35"
 NKO_focus_on_the_f_35_desc: "Analizaremos la tecnología F-35, utilizando su diseño como inspiración para mejorar nuestras propias capacidades de aire y contrarrestar a cualquiera que empuje este luchador avanzado."
 NKO_focus_on_the_f_16: "Enfoque en el F-16"
 NKO_focus_on_the_f_16_desc: "El F-16 se ha demostrado como un luchador capaz. Diseccionaremos sus tácticas y tecnología, mejorando nuestra propia flota de luchadores en el proceso."
 NKO_focus_on_the_future_kai_kf_21: "Enfoque sobre el KF-21"
 NKO_focus_on_the_future_kai_kf_21_desc: "El KF-21 es el luchador de próxima generación de Corea del Sur. Al analizar su potencial, preparamos nuestra fuerza aérea para contrarrestar cualquier amenaza que pueda plantear."
 NKO_begin_uranium_enrichment: "Comience el enriquecimiento de uranio"
 NKO_begin_uranium_enrichment_desc: "¡Ya sea para la liberación del pueblo surcoreano o para la defensa de nuestra gran patria contra la amenaza nuclear de los imperialistas estadounidenses, debemos continuar resuelta y valientemente desarrollando armas nucleares!"
 NKO_remove_monitoring_devices: "Eliminar dispositivos de monitoreo"
 NKO_remove_monitoring_devices_desc: "Nuestro enriquecimiento de uranio está obligado a ser resistido por la comunidad internacional. Lo mejor que podemos hacer, entonces, para ocultar el enriquecimiento de uranio, es... hacer que la comunidad internacional sea invisible."
 NKO_expel_inspectors: "Expel Inspectors"
 NKO_expel_inspectors_desc: "El Organismo Internacional de Energía Atómica ha enviado a muchos Inspectores en nuestro país para garantizar que sólo usemos tecnología nuclear para el suministro de energía. Puesto que estamos a punto de alejarnos de ellos, podríamos deportar bien a estos espías imperialistas en el proceso."
 NKO_withdraw_from_npt: "Retirada del TNP"
 NKO_withdraw_from_npt_desc: "Un paso importante para nuestro programa nuclear, relacionado con nuestra independencia y seguridad, es retirarse del TNP. ¡No podemos limitar nuestra capacidad de defender la independencia y seguridad de nuestro país debido a los desiguales tratados de imperialistas ridículos!"
 NKO_missile_tests: "Tests de misiles"
 NKO_missile_tests_desc: "Las pruebas de misiles de Corea del Norte son demostraciones de sus crecientes capacidades de misiles balísticos, mostrando una gama de sistemas desde misiles balísticos intercontinentales de corto alcance. Esos ensayos son fundamentales para promover su tecnología militar, hacer valer la influencia regional y señalar las intenciones estratégicas, a menudo intensificando las tensiones e impulsando respuestas internacionales."
 NKO_nuclear_tests: "Ensayos nucleares"
 NKO_nuclear_tests_desc: "Los ensayos nucleares de Corea del Norte son una serie de detonaciones subterráneas realizadas por el país desde 2006 como parte de su programa de desarrollo de armas nucleares. Estos ensayos demuestran avances en el rendimiento y la tecnología de armas, a menudo provocando condenas y sanciones internacionales. Representan un elemento crítico en la estrategia de Corea del Norte para garantizar la seguridad del régimen y el poder del proyecto en la etapa global."
 NKO_our_pride_and_joy: "Nuestro orgullo y alegría"
 NKO_our_pride_and_joy_desc: "¡Disfruta! Frente al severo bloqueo de los imperialistas y sus países subordinados, bajo la dirección del querido camarada [NKO.GetLeader], ¡por fin tenemos nuestra propia contrafuerza nuclear, nosotros, República Popular Democrática de Corea! ¡Los días en que los agresores imperialistas de Estados Unidos intentaron chantajearnos con un palo nuclear se han ido!"
 NKO_nuclear_approval_not_sco: "No debemos ser miembros de la SCO"
 NKO_people_air_force: "Fuerza Aérea Popular"
 NKO_people_air_force_desc: "Los cielos de Choson deben mantenerse a salvo de cualquier intrusión por los imperialistas americanos o sus aliados del sur. Esto será una tarea difícil si no mejoramos nuestras capacidades aéreas."
 NKO_self_produced_rifles: "Fusiones autoproducidas"
 NKO_self_produced_rifles_desc: "El Ejército Popular Coreano no puede depender de proveedores extranjeros para su rifle de servicio estándar. Los arsenales domésticos servirán para fabricar armas pequeñas en cantidad, asegurando que cada soldado esté armado con un arma hecha en la tierra natal."
 NKO_model_master: "Modelo Master"
 NKO_model_master_desc: "El desarrollo del tanque de Corea del Norte se centra en producir vehículos blindados indígenas adaptados a su terreno y doctrina militar. A partir de modelos inspirados por los soviéticos a diseños modernizados, estos tanques juegan un papel crítico en las fuerzas terrestres de la nación, enfatizando la movilidad, el poder de fuego y la capacidad de operar en diversos escenarios de combate."
 NKO_artillery: "Nuestra artillería"
 NKO_artillery_desc: "La artillería de Corea del Norte es una piedra angular de su estrategia militar, con un vasto conjunto de sistemas, desde los lanzadores tradicionales hasta la artillería avanzada de cohetes. Renombrada por su enorme arsenal, la artillería está diseñada para una abrumadora potencia de fuego, capaz de atacar instalaciones militares y zonas civiles, especialmente en la vecina Corea del Sur, lo que lo convierte en un elemento clave de disuasión y delito."
 NKO_spaa: "Nuestra Defensa Aérea"
 NKO_spaa_desc: "El sistema de defensa aérea de Corea del Norte es una mezcla de tecnología de la era soviética y plataformas desarrolladas a nivel nacional, diseñadas para proteger infraestructura crítica y contrarrestar posibles amenazas aéreas. Incluye misiles de superficie a aire, armas antiaéreas y sistemas de radar, enfatizando una estrategia de defensa en capas. A pesar de las limitaciones en comparación con los sistemas modernos, refleja el enfoque del país en la autosuficiencia y disuasión."
 NKO_rocket_artillery: "Artillería de cohetes"
 NKO_rocket_artillery_desc: "La artillería de cohetes de Corea del Norte es un componente crítico de su ejército, con una amplia gama de sistemas, incluyendo los poderosos modelos KN-09 y KN-25. Estas plataformas están diseñadas para huelgas de precisión a largo plazo, capaces de ofrecer una importante potencia de fuego contra objetivos militares y estratégicos. Su movilidad y despliegue rápido aumentan la capacidad de Corea del Norte para proyectar la fuerza y sostener operaciones ofensivas."
 NKO_naval_modernization: "Modernización naval"
 NKO_naval_modernization_desc: "La modernización naval de Corea del Norte se centra en mejorar sus capacidades con buques más pequeños, ágiles y sistemas avanzados de misiles. Esto incluye desarrollar submarinos capaces de lanzar misiles balísticos (SLBM) y actualizar naves superficiales con armamento moderno. El esfuerzo refleja una estrategia de guerra asimétrica, aprovechando los bienes costeros y submarinos para contrarrestar las potencias navales más grandes y la fuerza del proyecto en aguas regionales."
 NKO_anti_submarine: "Capacidades antisubmarinas"
 NKO_anti_submarine_desc: "Las capacidades antisubmarinas de Corea del Norte son limitadas pero evolucionan, dependiendo de una combinación de botes de patrulla, cargas profundas y vasos equipados con sonar. Los esfuerzos por mejorar estos sistemas incluyen el despliegue de buques más pequeños y ágiles y la experimentación con la tecnología indígena. Estas capacidades se centran en defender las aguas costeras y contrarrestar posibles incursiones submarinas de los adversarios, garantizando la seguridad marítima cerca de sus costas."
 NKO_infiltration_by_sea: "Infiltración por mar"
 NKO_infiltration_by_sea_desc: "La estrategia de infiltración marítima de Corea del Norte aprovecha su flota de buques pequeños, rápidos, submarinos y semisubmersibles para realizar operaciones encubiertas. Estos activos permiten el transporte de fuerzas y equipos especiales, a menudo sin ser detectados, para reconocimiento, sabotaje o guerra no convencional. Este enfoque subraya el énfasis de Corea del Norte en tácticas asimétricas para explotar vulnerabilidades a lo largo de las costas enemigas."
 NKO_submarine_development: "Desarrollo submarino"
 NKO_submarine_development_desc: ""
 NKO_upgrade_shipyards: "Astilleros de actualización"
 NKO_upgrade_shipyards_desc: "El desarrollo submarino de Corea del Norte se centra en expandir su flota con buques convencionales y estratégicos, incluyendo submarinos balísticos de misiles (SLBM) como la clase Sinpo. Este programa subraya la ambición del país de establecer un disuasor submarino creíble, mejorando el robo y la supervivencia en su estrategia nuclear. Con una mezcla de diseños indígenas y modernización de modelos antiguos, Corea del Norte prioriza las capacidades navales asimétricas para reforzar su defensa y alcance estratégico."
 NKO_expand_bases: "Ampliar las bases"
 NKO_expand_bases_desc: "La estrategia de Corea del Norte para ampliar sus bases militares refleja su enfoque en reforzar la defensa y la preparación. Esto incluye mejorar las instalaciones existentes, construir nuevos refugios subterráneos y mejorar los centros logísticos para apoyar a sus fuerzas. La ampliación de la base tiene por objeto mejorar la eficiencia del despliegue de los contingentes, proteger los activos críticos y proporcionar profundidad estratégica, garantizar la supervivencia frente a posibles ataques al tiempo que se proyecta el poder sobre puntos estratégicos fundamentales. Estos acontecimientos también están orientados a apoyar los avances en los sistemas de misiles, submarinos y otros equipos militares."
 NKO_green_water_navy: "La marina de agua verde"
 NKO_green_water_navy_desc: "El desarrollo de una marina de aguas verdes en Corea del Norte se centra en ampliar su alcance operacional más allá de las aguas costeras a los mares regionales. Esta estrategia consiste en desplegar pequeñas fragatas, corvettes y botes de misiles, junto con los esfuerzos por mejorar las capacidades submarinos. El objetivo es proteger las reivindicaciones territoriales, apoyar estrategias de guerra asimétrica y proyectar un poder limitado en aguas regionales, especialmente en el Mar Amarillo y el Mar del Japón. Este enfoque subraya la ambición de Corea del Norte de equilibrar la modernización económica con sus objetivos militares estratégicos."
 NKO_revolutionary_military_spirit: "Espíritu militar revolucionario"
 NKO_revolutionary_military_spirit_desc: "El concepto de «Espíritu Militar Revolucionario» de Corea del Norte es una ideología fundamental que enfatiza la lealtad, disciplina y compromiso inquebrantables con el Estado y su liderazgo. Sirve de marco de motivación para las fuerzas armadas, fomentando la resiliencia, la autosuficiencia y la disposición a sacrificarse ante la adversidad. Esto Espíritu nacional sustenta la cultura militar de la nación, fomentando la unidad y determinación para alcanzar objetivos estratégicos a pesar de los desafíos económicos y tecnológicos. Refleja la integración de la ideología política con la estrategia militar como fuerza motriz detrás de las iniciativas de defensa de Corea del Norte."
 NKO_expand_peasant_militia: "Ampliar la Milicia Campesina"
 NKO_domestic_naval_strategy: "Estrategia naval nacional"
 NKO_domestic_naval_strategy_desc: "Poner los cimientos de una doctrina naval moderna. Cada rama del programa submarinos, botes de misiles, defensa costera y operaciones especiales recibirán su parte de los recursos para comenzar el desarrollo."
 NKO_domestic_submarine_program: "Programa submarino nacional"
 NKO_domestic_submarine_program_desc: "Concentre los esfuerzos de la oficina en la construcción submarina indígena. La producción refinada de cascos y el entrenamiento intensivo de tripulación nos darán el silencioso brazo que necesitamos para amenazar enemigos lejos de nuestra costa."
 NKO_domestic_destroyer_buildup: "Construcción de destructores domésticos"
 NKO_domestic_destroyer_buildup_desc: "Los buques de misiles y los pequeños combatientes de la superficie provocan masas para enjambrear flotas enemigas en aguas costeras. Nuestros astilleros pueden colocar cascos más rápido de lo que el Sur puede desplegar grandes destructores."
 NKO_destroyer_unleashed: "Destructor sin levadura"
 NKO_destroyer_unleashed_desc: "Campo una nueva generación de destructores equipados con armas más pesadas y baterías antiaéreas dedicadas. La flota finalmente será capaz de disputar compromisos de aguas azules en lugar de esconderse a lo largo de la costa."
 NKO_navy_projects: "Proyectos de la Armada norcoreana"
 NKO_navy_projects_desc: "El §YModernización naval§! Earn Naval Buildup Points con la financiación, el astillero y las decisiones de Juche para conducir, luego gastarlos en los §HFuerza submarina§!, §HFlotillas de embarcación de misiles§!, §HCoastal Defense Network§!, y §HOperaciones especiales navales§! pistas hasta que los cuatro alcances §Y100§!."
 NKO_expand_peasant_militia_desc: "La expansión de Corea del Norte de la Milicia Campesina, conocida como Guardias Rojas Obreros-Peasant, es un movimiento estratégico para reforzar la defensa nacional a través de la movilización masiva. Esta fuerza paramilitar, compuesta por civiles, está encargada de complementar las operaciones militares regulares, defender a las comunidades locales y garantizar la seguridad interna. Las actividades de ampliación incluyen un aumento de la capacitación, el equipamiento de los miembros de las milicias con armas ligeras y su integración en ejercicios militares más amplios. Este enfoque refleja el enfoque de Corea del Norte en la guerra asimétrica y su estrategia de «defensa de todo el pueblo», asegurando una gran fuerza descentralizada capaz de resistir las amenazas externas y mantener la estabilidad interna."
 NKO_bolster_young_red_guards: "Atornillar a los Jóvenes Guardias Rojas"
 NKO_bolster_young_red_guards_desc: "Bolstering the Young Red Guards, organización paramilitar juvenil de Corea del Norte, es una iniciativa clave encaminada a inculcar la lealtad ideológica y la preparación militar en su población más joven. Esto implica mejorar el entrenamiento militar, la educación política y el condicionamiento físico para los estudiantes, a menudo integrándolos en ejercicios de defensa nacional. Al equipar a los Jóvenes Guardias Rojas con habilidades básicas de armamento y supervivencia, Corea del Norte asegura una organización constante de individuos ideológicos comprometidos y listos para combatir que pueden apoyar a las fuerzas armadas regulares en tiempos de conflicto. Esta iniciativa subraya la confianza del régimen en la movilización de jóvenes como parte de su estrategia de «defensa popular»."
 NKO_rebuild_sso: "Reforma de las Fuerzas Especiales"
 NKO_rebuild_sso_desc: "La reforma de las Fuerzas Especiales de Corea del Norte se centra en modernizar y mejorar las capacidades de sus unidades de élite para llevar a cabo guerras asimétricas, operaciones no convencionales y misiones de respuesta rápida. Esta reforma incluye mejorar los regímenes de capacitación, incorporar tácticas avanzadas y equipar a las fuerzas con sistemas modernos de armamento y comunicación. Las Fuerzas Especiales están diseñadas para sobresalir en la infiltración, sabotaje, reconocimiento y acción directa, a menudo dirigida a activos estratégicos o infraestructura crítica. Las reformas tienen por objeto aumentar su eficacia en los conflictos regionales, reforzar la disuasión y mantener la preparación para diversas misiones de alto nivel. Este énfasis refleja la dependencia estratégica de Corea del Norte en unidades altamente calificadas y ágiles para compensar las limitaciones militares convencionales."
 NKO_rebuild_kim_il_sung_military_university: "Reconstruir la Universidad Militar Kim Il-sung"
 NKO_rebuild_kim_il_sung_military_university_desc: "Kim Il-sung Military University, un importante collage de defensa nacional en Pyongyang, se ha reunido a un gran número de los mejores comandantes del país desde 1952. A medida que entramos en el nuevo siglo, las antiguas instalaciones de esta universidad se están volviendo cada vez más insatisfechas al nuevo estilo de guerra. Es hora de restaurar esta institución a su antigua gloria."
 NKO_revolutionary_spirits: "Espíritu militar revolucionario"
 NKO_the_green_water_navy: "La Marina Green-Water"
 NKO_the_green_water_navy_desc: "Este espíritu nacional será §YActualización§! si completamos el §HModernización naval§! Se centra. \n§W--------------§!\nUna armada de aguas verdes es una fuerza marítima capaz de operar en las zonas litorales de su estado y tiene competencia limitada para operar en los mares marginales circundantes. Es un término relativamente nuevo, y se ha creado para distinguir mejor, y añadir matices, entre dos descriptores de larga data: la marina de agua azul (aguas profundas de océanos abiertos) y la marina de agua marrón (aguas iluminadas y cerca de la orilla)."
 NKO_the_blue_water_navy: "La Marina Blue-Water"
 NKO_the_blue_water_navy_desc: "Años de expansión del patio, reforma doctrinal y ejercicios conjuntos han transformado nuestra flota de una fuerza costera en una verdadera marina oceánica. Ahora podemos ordenar mucho más allá de nuestras costas, con tripulaciones y cascos iguales a cualquier rival en la región.\n§W--------------§!\nUna marina de agua azul es una fuerza marítima capaz de operaciones sostenidas a través de las aguas profundas de los océanos abiertos, proyectando el poder más allá de su costa natal."
 NKO_planned_economy: "Economía planificada"
 NKO_planned_economy_desc: "El país de Corea del Norte, oficialmente conocido como República Popular Democrática de Corea (DPRK), tiene una economía de mando aislada y controlada. En una economía de mando, la economía está centralmente planificada y coordinada por el gobierno, lo que lo convierte en un componente estándar de cualquier país comunista."
 NKO_the_38th_parallel: "The 38th Parallel"
 NKO_the_38th_parallel_desc: "En julio de 1953 se firmó el Acuerdo de Armisticio Coreano entre los dos voluntarios de Corea y China, así como las fuerzas de las Naciones Unidas, estableciendo una zona desmilitarizada basada en el paralelo 38.º, separando a Corea del Norte y Corea del Sur. Esta línea divisoria ha existido durante unos 50 años y tal vez sea hora de avanzar hacia la reunificación, de una manera u otra."
 NKO_the_road_to_peace: "¿El camino a la paz?"
 NKO_the_road_to_peace_desc: "La «política del sol» de Corea del Sur parece demostrar un sincero deseo de reunificación. Tal vez sea hora de que los camaradas intercoreanos trabajen juntos hacia la reunificación."
 NKO_the_road_to_war: "El camino a la guerra"
 NKO_the_road_to_war_desc: "Los imperialistas estadounidenses y sus títeres surcoreanos fueron, son y nunca podrán permitir la verdadera reunificación de Corea. La reunificación por la fuerza es la verdad eterna."
 NKO_end_six_party_negotiations: "Armas nucleares listas"
 NKO_end_six_party_negotiations_desc: "Las conversaciones entre las seis partes no han dado más que retraso. Saldremos de la mesa de negociación y traeremos nuestro disuasivo nuclear a toda disposición. Corea del Sur, Japón y Estados Unidos aprenderán que nuestra seguridad no es suya para negociar."
 NKO_remilitarize_the_dmz: "Remilitarizar el DMZ"
 NKO_remilitarize_the_dmz_desc: "Remilitarizar la DMZ marcará una escalada significativa en nuestro conflicto con el Sur, pero sin duda dará a nuestras tropas una ventaja en el próximo conflicto."
 NKO_struggle_for_power: "La lucha por el poder"
 NKO_struggle_for_power_desc: "La lucha de poder entre Kim Jong-un y su hermano, Kim Jong-nam, fue una batalla encubierta por la sucesión dentro de la familia dominante de Corea del Norte. Tras la muerte de su padre Kim Jong-il, ambos hermanos fueron candidatos potenciales para liderar el régimen. Kim Jong-nam, una vez visto como el heredero favorecido, cayó de gracia debido a sus críticas públicas del régimen y su exilio en Macao. Mientras tanto, Kim Jong-un, con el apoyo de élites influyentes, solidificó su posición a través de alianzas estratégicas y purgas internas. La lucha terminó con la ascensión al poder de Kim Jong-un en 2011, marcada por el misterioso asesinato de Kim Jong-nam en 2017, que muchos creen que fue orquestado por el gobierno norcoreano. Este conflicto puso de relieve la naturaleza despiadada de las dinámicas de poder en uno de los regímenes más secretos del mundo."
 NKO_orthodox_successor: "El sucesor ortodoxo"
 NKO_orthodox_successor_desc: "En los años noventa, Kim Jong-un fue elegido por el gran General Kim Jong-il como sucesor del poder debido a sus destacadas calificaciones. El amado camarada Kim Jong-un, a quien Dios ha dado al pueblo coreano en el pasado, presente y futuro, siempre protegerá la seguridad y prosperidad de Juche Corea."
 NKO_promote_self_reliance: "Promover la autosuficiencia"
 NKO_promote_self_reliance_desc: "Un país nunca puede ser rico y fuerte al confiar en otros, sólo por ser autosuficiente puede ser fuerte!"
 NKO_ostracize_kim_jong_nam: "Ostracize Kim Jong-nam"
 NKO_ostracize_kim_jong_nam_desc: "Al ostracizar a Kim Jong-nam, para que el «padre» lo desconfiara aún más, tenemos una mejor posibilidad de ganar poder."
 NKO_bribe_kpa_seniors: "Sobornar a las personas mayores de la KPA"
 NKO_bribe_kpa_seniors_desc: "Los generales de la KPA son los que tienen el poder militar, y tener el apoyo de estos ancianos es más probable que nos ponga en control."
 NKO_oppose_to_chinese_reform_road: "Opponer abiertamente a la carretera de reforma china"
 NKO_oppose_to_chinese_reform_road_desc: "El modelo de reforma de China se deriva de su modelo de liderazgo colectivo. Si este enfoque se transpusiera a Corea del Norte, inevitablemente conduciría al caos social. Y el «padre» tampoco lo apoya. Por el bien del linaje de la Montaña Baekdu, debemos oponerse abiertamente al uso del modelo chino para la reforma."
 NKO_discredit_jang_seong_taek: "Descrédito Jang Seong-taek"
 NKO_discredit_jang_seong_taek_desc: "Jang Seong-taek es una facción pro chino conocida en Corea del Norte y también una figura popular en el lado de su padre. Tal traidor que vendió los intereses de la nación no debe ser tolerado. Para ganar el poder con éxito, tenemos que recoger evidencia de su culpa y denunciarlo delante del Padre."
 NKO_call_for_change: "La convocatoria para el cambio"
 NKO_call_for_change_desc: "La República Popular Democrática de Corea ha estado operando bajo una economía planificada durante casi 50 años. Pero la sucesión de «revoluciones de 1989» y la «Marcha Ardua» demostraron que la economía planificada por el Estado ya no era adecuada para el nuevo siglo. Se necesita una reforma audaz y profunda para que Corea del Norte vuelva a ser fuerte."
 NKO_pull_in_young_military_officers: "Tiro de oficiales militares jóvenes"
 NKO_pull_in_young_military_officers_desc: "Retirar a oficiales jóvenes de mente abierta del KPA no nos hará ningún daño, ya que están más cerca del rango y el archivo y serán más propicios para nuestro control de las tropas."
 NKO_frame_opposition: "Enmarcar la oposición"
 NKO_frame_opposition_desc: "La estrategia para enmarcar a Kim Jong-un implica presentarlo como una fuerza imprudente y desestabilizadora dentro de la dirección de Corea del Norte. Al destacar sus agresivas purgas, la volátil toma de decisiones y la falta de finura diplomática, podemos posicionarlo como un peligro tanto para la estabilidad del régimen como para la seguridad regional. Este encuadre contrastará sus acciones con una visión de liderazgo firme y racional, enfatizando la necesidad de una figura más equilibrada e internacionalmente palabrera. A través de narrativas cuidadosamente curadas, mensajería dirigida y palanca de cuentas internas, el objetivo es socavar su credibilidad y influir tanto en la opinión nacional como en la internacional."
 NKO_stir_up_father_son_relations: "Esfuérzate con el conflicto padre-hijo"
 NKO_stir_up_father_son_relations_desc: "No será fácil agitar el conflicto entre Kim Jong-un y Kim Jong-il, pero nos dará más apoyo."
 NKO_place_loyalists_in_kpa: "Coloque los loyalistas en KPA"
 NKO_place_loyalists_in_kpa_desc: "Hace veinte años, cuando tanto Kim Jong-il como su medio hermano tuvieron la oportunidad de asumir el liderazgo de Corea del Norte, el apoyo de los viejos guerrilleros para Kim Jong-il fue un factor clave en su eventual elección como líder supremo del país. Ahora que el Ejército Popular Coreano ha heredado esa posición. Coloque los loyalistas en KPA, aumente nuestro control sobre KPA."
 NKO_finding_reformist_of_party: "Encontrar al reformista del partido"
 NKO_finding_reformist_of_party_desc: "No es que los reformistas no existan en el partido, pero tienen miedo de hablar frente a la oposición de Kim Jong Il, si ganamos su apoyo hace más probable que cambiemos el Chosun."
 NKO_power_struggle: "Lucha de poder"
 NKO_power_struggle_desc: "Tarde o temprano, el gran líder de Corea del Norte hoy, el camarada Kim Jong-il, morirá y su sucesor será sin duda uno de sus dos hijos, Kim Jong-nam o Kim Jong-un. Pero «un país no puede tener dos amos», y ambos deben buscar la forma de ganarse la confianza de su padre. Apoyar a un candidato sobre el otro hasta que se haya elegido un sucesor hará perder £stability_texticon §YEstabilidad§!.\n\nSi no tenemos más de 45% de £stability_texticon §YEstabilidad§!, la Junta buscará tomar el poder una vez muera Kim Jong-il.\n\n£stability_texticon §YEstabilidad§! actual: [?NKO.stability|1%]\n\nActualmente,\nOrtodoxos de §OKim Jong-un§!: §Y[?ROOT.NKO_kim_jong_un]%§!\nOrtodoxos de §GKim Jong-nam§!: §Y[?ROOT.NKO_kim_jong_nam]%§!\n\n§YEl sucesor elegido por Kim Jong-il§!: [ROOT.GetChosenSuccessor]\n§REl sucesor actual más probable§!: [ROOT.GetSuccessor]\n\nNuestro líder, §YKim Jong Il§!, quizá no viva para ver 2012, así que prepárate para elegir un sucesor en §Y2011§!"
 NKO_1_increase_kim_jong_un_tt: "Apoyo de Kim Jong-un §Y aumenta§! por 1%"
 NKO_2_increase_kim_jong_nam_tt: "Apoyo de Kim Jong-nam §Y aumenta§! en un 2%"
 NKO_3_increase_kim_jong_un_tt: "El apoyo de Kim Jong-un §Y aumenta§! en un 3%"
 NKO_3_increase_kim_jong_nam_tt: "El apoyo de Kim Jong-nam §Y aumenta§! en un 3%"
 NKO_2_5_increase_kim_jong_un_tt: "Apoyo de Kim Jong-un §Y aumenta§! por 2% ~ 5%"
 NKO_2_5_increase_kim_jong_nam_tt: "Apoyo de Kim Jong-nam §Y aumenta§! por 2% ~ 5%"
 NKO_5_decrease_kim_jong_un_tt: "Apoyo de Kim Jong-un §Ydisminuye§! por 5%"
 NKO_2_decrease_kim_jong_nam_tt: "Apoyo de Kim Jong-nam §Ydisminuye§! en un 2%"
 NKO_3_decrease_kim_jong_un_tt: "Apoyo de Kim Jong-un §Ydisminuye§! por 3%"
 NKO_4_increase_kim_jong_nam_tt: "El apoyo de Kim Jong-nam §Y aumenta§! en un 4%"
 NKO_5_increase_kim_jong_nam_tt: "El apoyo de Kim Jong-nam §Y aumenta§! por 5%"
 NKO_kim_jong_il_death: "La muerte de Kim Jong-il"
 NKO_kim_jong_il_death_desc: "\n--------------\nEste Enfoque se centrará §YDesbloquear§! en §Y8.30 a.m. el 17 de diciembre de 2011§!.El amado Gran Líder, fundador de la República Popular Democrática de Corea y el eterno Presidente de la República, Kim Jong-il, murió a las 8.30 horas del 17 de diciembre de 2011, de infarto agudo de miocardio complicado por choque cardiógeno mientras iba a visitar una zona local en tren."
 NKO_junta: "Golpe de la Junta"
 NKO_junta_desc: "Las reformas exitosas en China y Vietnam nos han dado un buen ejemplo, pero sus reformas no han sido fluidas. Si nuestras propias reformas hubieran fracasado, hubiéramos muerto y sido anexados por el Sur. Y tanto Kim Jong-un como Kim Jong-nam quieren diferentes niveles de reforma. Tendremos que hacer la elección más difícil para no perder nuestro país o nuestra fiesta..."
 NKO_preserve_songun: "Guarda a Songun"
 NKO_preserve_songun_desc: "Songun es el fundamento del ejército y debemos defender su ideología."
 NKO_entrench_military_authority: "Autoridad Militar de Entrenamiento"
 NKO_entrench_military_authority_desc: "Aunque hemos utilizado el ejército para apoderarse del poder de la dinastía Kim, todavía hay algunos ki-loyalistas dentro del ejército, usaremos nuestros «medios» para convencerlos..."
 NKO_smash_black_market: "Smash el «Market»"
 NKO_smash_black_market_desc: "¡Las fuerzas del «mercado» están causando grandes daños a nuestro país y deben detenerse inmediatamente!"
 NKO_determining_the_loyalty_of_army: "Determinación de la lealtad del ejército"
 NKO_determining_the_loyalty_of_army_desc: "Ahora podemos promover a algunos de nuestros leales y hacerlos más subordinados a nosotros."
 NKO_purge_dissenters: "Purge Dissenters"
 NKO_purge_dissenters_desc: "Para mantener la estabilidad del país en este momento crítico de la transición del poder, debemos arrestar inmediatamente a todos los posibles disidentes!"
 NKO_crush_the_kims: "Ejecución de los Kims"
 NKO_crush_the_kims_desc: "Mantener vivos a los hijos de Kim Jong-il es en última instancia un factor desestabilizador, ejecutarlos en secreto!"
 NKO_constrain_the_donju: "Consentren al Donju"
 NKO_constrain_the_donju_desc: "El Donju ha hecho una pequeña contribución al desarrollo económico de nuestro país antes, mantenerlos activos..."
 NKO_end_the_donju: "Ataque contra el contrabando"
 NKO_end_the_donju_desc: "El contrabando es un delito grave y, a pesar de su contribución a la economía del país, es hora de acabar con estos legisladores de una vez por todas."
 NKO_high_pressure_politics: "Política de alta presión"
 NKO_high_pressure_politics_desc: "El descontento popular ha crecido hasta tal punto que debemos utilizar medios contundentes para mantener nuestra regla."
 NKO_empower_the_state_security_department: "Empoderar a la Oficina General de Reconocimiento"
 NKO_empower_the_state_security_department_desc: "Ahora tenemos que autorizar a la Oficina General de Reconocimiento del Ejército a asumir mayores responsabilidades y convertirse en la agencia de inteligencia dominante del país. La Oficina General de Reconocimiento detectará, arrestará y eliminará posibles saboteadores y espías imperialistas."
 NKO_chi_military_support: "Apoyo militar chino"
 NKO_chi_military_support_desc: "China es nuestro hermano eterno y aliado. Para sobrevivir en la arena internacional, volveremos a estar en los brazos de Beijing."
 NKO_chi_invest_resources: "Asistencia para la extracción de recursos"
 NKO_chi_invest_resources_desc: "Estamos listos para permitir que las empresas de recursos chinos entren en nuestro territorio"
 NKO_chi_banks: "Bancos chinos"
 NKO_chi_banks_desc: "Estamos listos para permitir que los bancos chinos entren en nuestro país"
 NKO_chi_help_factories: "Factores chinos"
 NKO_chi_help_factories_desc: "Tenemos la intención de pedir ayuda al gobierno chino para la construcción de nuevas fábricas en nuestro territorio"
 NKO_chi_huawei: "Cooperación con Huawei"
 NKO_chi_huawei_desc: "Huawei Corporation es uno de los más famosos del mundo y queremos que el gobierno chino les permita operar en nuestro territorio"
 NKO_military_collectives: "Junta"
 NKO_military_collectives_desc: "Nuestro pueblo no está listo para abrazar a Occidente, tenemos que seguir manteniendo nuestra regla."
 NKO_encourage_private_enterprise: "Fomento de la Empresa Privada"
 NKO_encourage_private_enterprise_desc: "El emprendimiento privado es el futuro motor del progreso de nuestra economía, y tenemos la intención de alentarlos"
 NKO_market_based_economy: "Economía basada en el mercado"
 NKO_market_based_economy_desc: "Nuestro sistema económico nos ha traído sólo problemas y crisis constantes, es hora de cambiar esto"
 NKO_reorganising_government: "Reorganización del Gobierno"
 NKO_reorganising_government_desc: "Es hora de reorganizar el gobierno, el país necesita un nuevo gobierno."
 NKO_kim_jong_un: "Kim Jong-un"
 NKO_kim_jong_un_desc: "Como sucesor de Kim Jong-il, que ha recibido grandes esperanzas, Kim Jong-un espera hacer reformas económicas apropiadas para impulsar la economía del país mientras el país está estable y unido. Sin embargo, no quiere perder su agarre estable en el poder y su elevado estatus como un «Bekdu Mountain bloodline»..."
 NKO_consolidate_power: "Potencia consolidada"
 NKO_consolidate_power_desc: ""
 NKO_light_industry_develop: "Desarrollo de la industria de la luz"
 NKO_light_industry_develop_desc: ""
 NKO_criticize_ineptitude: "Criticize Ineptitude"
 NKO_criticize_ineptitude_desc: ""
 NKO_improvement_of_people_live: "Mejora de la vida de las personas"
 NKO_improvement_of_people_live_desc: ""
 NKO_people_support: "Apoyo de la gente"
 NKO_people_support_desc: ""
 NKO_centralize_power: "Centralizar el poder"
 NKO_centralize_power_desc: ""
 NKO_root_out_corruption: "Corrección de la corrupción"
 NKO_root_out_corruption_desc: ""
 NKO_formalize_power_structures: "Formalizar las estructuras de poder"
 NKO_formalize_power_structures_desc: ""
 NKO_assassinate_kim_jong_nam: "Asesinar a Kim Jong-nam"
 NKO_assassinate_kim_jong_nam_desc: "Kim Jong-nam siempre será una amenaza para la estabilidad de nuestro régimen si no está muerto, eliminarlo a cualquier costo."
 NKO_appoint_loyalists: "Design Loyalists"
 NKO_appoint_loyalists_desc: ""
 NKO_civilian_control_of_the_economy: "Control civil de la economía"
 NKO_civilian_control_of_the_economy_desc: ""
 NKO_party_state_army: "Partido, Estado, ejército"
 NKO_party_state_army_desc: ""
 NKO_party_unchecked: "El Partido Eterno"
 NKO_party_unchecked_desc: ""
 NKO_eternal_juche_sasang: "Eternal Juche Sasang"
 NKO_eternal_juche_sasang_desc: ""
 NKO_kim_jong_nam: "Kim Jong-nam"
 NKO_kim_jong_nam_desc: "Kim Jong-nam, el hijo mayor de Kim Jong-il, ha sido desde hace mucho tiempo una figura controvertida en la política norcoreana. Una vez considerado el heredero aparente, sus críticas públicas sobre el régimen y el exilio subsiguiente le han hecho un símbolo de disensión. Abogado por las reformas económicas y el compromiso con la comunidad internacional, la visión de Kim Jong-nam contrasta marcadamente con el enfoque tradicionalista de su hermano menor, Kim Jong-un. Su regreso a Corea del Norte podría indicar un cambio hacia políticas más abiertas y un posible desafío al orden establecido."
 NKO_face_world: "Frente al mundo"
 NKO_face_world_desc: "La reforma institucional del país no puede lograrse sin apoyo externo, por lo que debemos centrarnos en el aspecto diplomático de gobernar y tener buenas relaciones con el mundo."
 NKO_diplomatic_overtures: "Establecer relaciones diplomáticas con los países"
 NKO_diplomatic_overtures_desc: "El segundo paso en la diplomacia norcoreana es el establecimiento de relaciones diplomáticas formales con diversos países, que suavizarán el camino de la reforma del país."
 NKO_step_up_joint_ventures: "Invitar Más Venturas Conjuntas"
 NKO_step_up_joint_ventures_desc: "La inversión extranjera es un canal para ayudar a reformar nuestra economía y la acogemos."
 NKO_embrace_the_people: "Abrace a la gente"
 NKO_embrace_the_people_desc: "Nuestro país no puede permanecer cerrado para siempre. Es hora de abrir nuestros brazos y abrazar a nuestro pueblo y crear una Corea del Norte diferente."
 NKO_loosen_information_monopoly: "Información de Loosen Monopoly"
 NKO_loosen_information_monopoly_desc: "La gente es libre de expresar sus opiniones."
 NKO_tone_down_propaganda: "Reducir la publicidad oficial"
 NKO_tone_down_propaganda_desc: "Mientras que los medios oficiales solían encarnar la voluntad del Estado, nuestras reformas de democratización no necesitan forzar la «democracia» en ellos ahora."
 NKO_end_forced_labor: "Trabajo forzoso final"
 NKO_end_forced_labor_desc: "No más trabajo forzado, y avanzamos al mundo abierto."
 NKO_expand_sezs: "Ampliar las zonas económicas exclusivas"
 NKO_expand_sezs_desc: "No podemos reformar nuestra economía sin la ayuda de las zonas económicas especiales en Raseon y Kaesong, y podemos establecer zonas económicas más especiales para que algunas personas puedan enriquecerse primero."
 NKO_end_juche: "Final Juche"
 NKO_end_juche_desc: "Juche no es una panacea; necesitamos un modelo más científico de orientación."
 NKO_foreign_knowledge: "Talentos de investigación externa"
 NKO_foreign_knowledge_desc: "La RPDC ha perdido mucho talento debido a sus políticas opresivas en las últimas décadas, y para salvar la brecha de talento, podríamos tener algunos investigadores externos."
 NKO_join_the_wto: "Únase a la OMC"
 NKO_join_the_wto_desc: "Durante demasiado tiempo, hemos sido excluidos de los beneficios comerciales mundiales compartidos por miembros de la Organización Mundial del Comercio. Ahora que lo cambiaremos, podemos aprovechar mejor los mecanismos del orden económico liberal occidental al servicio de nuestras reformas."
 NKO_preserve_the_party: "Retención de la dirección del WPK"
 NKO_preserve_the_party_desc: "La reforma y la apertura no es lo mismo que acabar con el liderazgo del Partido Obrero, que puede llevar al pueblo a un futuro brillante y próspero."
 NKO_appeal_to_the_youth: "Llamamiento a la juventud"
 NKO_appeal_to_the_youth_desc: "Es la juventud que es la columna vertebral de nuestra reforma."
 NKO_the_choson_dream: "El sueño de Choson"
 NKO_the_choson_dream_desc: "El «Choson Dream» es un nuevo concepto introducido por el Presidente [NKO.GetLeader], que encapsula los objetivos personales y nacionales de la nación coreana. Engloba las aspiraciones en muchas esferas diferentes, incluidas las esferas económica, política e internacional."
 NKO_democracy_with_north_characteristics: "Democracia con características norcoreanas"
 NKO_democracy_with_north_characteristics_desc: "La democracia de estilo occidental no es totalmente adecuada para la República Popular Democrática de Corea y la República Popular Democrática de Corea necesita su propia democracia característica."
 NKO_people_before_party: "Personas antes del partido"
 NKO_people_before_party_desc: "¡El pueblo es el maestro de su país!"
 NKO_elections: "Elecciones locales"
 NKO_elections_desc: "Nuestras reformas incluyen la democratización del sistema político y el pueblo tendrá el poder de elegir a los líderes que quieran."
 NKO_free_expression: "Expresión gratuita"
 NKO_free_expression_desc: "El pueblo de Corea del Norte ha sido suprimido durante demasiado tiempo bajo políticas opresivas y la libertad primaria otorgada al pueblo es la libertad de expresión."
 NKO_byungjin: "Byungjin"
 NKO_byungjin_desc: "Durante la marcha de Arduous, el sabio general Kim Jong-il mantuvo a flote nuestro país adoptando la política «Songun» para mantener su estabilidad. Pero ahora que la economía del país ha rebotado, es el momento de abandonar el viejo enfoque centrado en los militares y desarrollar nuestra economía militar y tándem!"
 NKO_scale_back_spending: "Volver Gobierno gasto"
 NKO_scale_back_spending_desc: ""
 NKO_encourage_consumption: "Alentar el consumo"
 NKO_encourage_consumption_desc: ""
 NKO_loosen_grip_on_soes: "Afloje Grip en SOEs"
 NKO_loosen_grip_on_soes_desc: ""
 NKO_state_owned_enterprises_competition: "Competencia empresarial de propiedad estatal"
 NKO_state_owned_enterprises_competition_desc: ""
 NKO_resorts_and_tourism: "Resorts y Turismo"
 NKO_resorts_and_tourism_desc: "Con sanciones internacionales, sólo tenemos pocas formas de acceder a divisas. Fortalecer el turismo, que la gente de todo el mundo venga y vea la belleza de Corea del Norte!"
 NKO_samjiyon: "Samjiyon"
 NKO_samjiyon_desc: "Samjiyon es nuestro gran santuario revolucionario en Corea del Norte. Tiene el estatus similar como Yan'an en China. Debemos trabajar duro para construir allí para que la gente pueda recibir más educación patriótica."
 NKO_incentive_based_economy: "Economía basada en el incentivo"
 NKO_incentive_based_economy_desc: "La obtención del control central sobre las empresas ha mostrado resultados. Al permitir que los directivos retribuyan la productividad y mantengan una parte de la producción, el Estado aprovecha el interés propio al servicio del crecimiento sin abandonar las alturas dominantes de la economía."
 NKO_empower_the_donju: "Empoderar al Donju"
 NKO_empower_the_donju_desc: "Aunque el país no puede depender excesivamente del mundo exterior para su desarrollo. Pero sin el Donju, nuestra economía sería insostenible. ¡Denles más derechos a favor del comercio, que sean los líderes de la economía nacional y que el caballo de mil litros de la economía coreana funcione!"
 NKO_weaken_the_donju: "Debilitar a Donju"
 NKO_weaken_the_donju_desc: "Los productos chinos y surcoreanos no han hecho rico a nuestro país. ¡Necesitamos enfocarnos en nuestras propias marcas industriales y dejar que las marcas norcoreanas se levanten a la cima del mercado mundial!"
 NKO_protect_state_owned_business: "Proteger las empresas estatales"
 NKO_protect_state_owned_business_desc: ""
 NKO_encourage_foreign_investment: "Fomento de la inversión extranjera"
 NKO_encourage_foreign_investment_desc: "Tan resistentes como nuestras industrias nacionales, su potencial económico completo no puede ser desbloqueado sin inversión en el extranjero. Debemos ofrecer incentivos para fomentar la inversión extranjera directa en nuestra nación."
 NKO_privatize_means_of_production: "Privatizar medios de producción"
 NKO_privatize_means_of_production_desc: ""
 NKO_economy_revival: "Renacimiento económico"
 NKO_economy_revival_desc: "Con el fin de «Marcha Ardiente», es hora de que nuestra economía vuelva a funcionar."
 NKO_priorit_for_civilian_industry: "Enfoqueing on Civil Industry"
 NKO_priorit_for_civilian_industry_desc: ""
 NKO_priorit_for_army_industry: "Enfoque on Military Industry"
 NKO_priorit_for_army_industry_desc: "La industria militar es vital para nosotros, tanto para impulsar nuestra demanda interna económica como para fortalecer nuestras fuerzas de defensa."
 NKO_arms_trafficking: "Trata de armas"
 NKO_arms_trafficking_desc: "¿Por qué debería haber un sinnúmero de armas apiladas en almacenes todo el tiempo? Podríamos cambiarlos por oro."
 NKO_sinuiju: "Sinuiju Región Administrativa Especial"
 NKO_sinuiju_desc: "Sinuiju siempre ha sido un importante puerto para el comercio entre Corea del Norte y China. Podríamos seguir el enfoque de un país, dos sistemas. Para hacerlo más adecuado para el comercio con países extranjeros."
 NKO_recognition_of_economic_backwardness: "Reconocimiento del retroceso económico"
 NKO_recognition_of_economic_backwardness_desc: "La economía de Corea del Norte ha caído detrás de los tiempos después de «Marcha Ardiente». Necesitamos reformas radicales"
 NKO_2009_revaluation: "Revaluation"
 NKO_2009_revaluation_desc: "Durante la Marcha Ardua, nuestra economía nacional, y en particular nuestro sistema monetario, fue golpeada duramente. La gente no confiaba en nuestra moneda y la vida cotidiana estaba incluso llena de trueque. Para cambiar esta situación, necesitamos una audaz reforma monetaria y revalorización."
 NKO_revaluation_failure: "Revaloración Failure..."
 NKO_revaluation_failure_desc: ""
 NKO_air_koryo: "Koryo aire"
 NKO_air_koryo_desc: ""
 NKO_reform_of_the_privatisation_of_collective_farms: "Privatización de las granjas colectivas"
 NKO_reform_of_the_privatisation_of_collective_farms_desc: "Relajación de controles en las granjas colectivas locales para aumentar su incentivo a producir."
 NKO_construction_of_hydraulic_facilities: "Construcción de instalaciones hidráulicas"
 NKO_construction_of_hydraulic_facilities_desc: "Para aumentar el rendimiento agrícola sin depender tanto de los fertilizantes químicos, tenemos que construir más instalaciones hidráulicas."
 NKO_free_housing: "Vivienda gratuita"
 NKO_free_housing_desc: "Construir más pisos para que la gente pueda permitirse vivir en ellos!"
 NKO_expand_compulsory_education: "Ampliar la educación obligatoria"
 NKO_expand_compulsory_education_desc: "La educación es la base de una nación fuerte. Ampliar la educación obligatoria, dando a más niños acceso a los niveles de enseñanza superior."
 NKO_chollima_speed_desc: "El desarrollo de la infraestructura es un paso importante en el camino hacia la reconstrucción de nuestra economía, no sólo para nuestro desarrollo económico, sino también para fines militares, como carreteras capaces de transportar equipo pesado y los ferrocarriles capaces de llevar trenes de misiles."
 NKO_arduous_march: "Marcha Arduous"
 NKO_arduous_march_desc: "§RLa hambruna norcoreana§! fue un período de hambre masiva junto con una crisis económica general de 1994 en Corea del Norte, también conocida como la «Marcha Ardua»."
 NKO_dmz_remilitarized: "DMZ Remilitarized"
 NKO_dmz_remilitarized_desc: "Remilitarizar la DMZ marcará una escalada significativa en nuestro conflicto con el Sur, pero sin duda dará a nuestras tropas una ventaja en el próximo conflicto."
 NKO_kor_hostile_action_tt: "No ha sido antagonizado por recientes acciones hostiles."
 NKO_broken_juche: "El Juche Roto"
 NKO_eternal_juche: "El Juche Eterno"
 NKO_marxism_leninism: "Marxism-Leninism"
 NKO_democratic_land: "La Tierra Democrática"
 NKO_songun_junta: "Songun"
