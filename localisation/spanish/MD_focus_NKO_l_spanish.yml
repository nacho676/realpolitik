 NKO_naval_capstone_news_tt: "Transmisiones a §Himportante evento de noticias§!: §YEl cinturón del mar de Pyongyang está forjado§! celebrada en casa, señalada en el extranjero."
 NKO_naval_allocate_party_funds: "Asignar fondos de las Partes"
 NKO_naval_allocate_party_funds_desc: "Desviar discretamente estipendios del Partido al programa naval. Un goteo confiable de recursos, que cuesta capital político."
 NKO_naval_mobilize_nampo_shipyards: "Mobilizar los astilleros Nampo"
 NKO_naval_mobilize_nampo_shipyards_desc: "Ata una fábrica civil en Nampo durante tres meses de fabricación de horas extraordinarias. Los patios nos recompensan con una explosión extra de puntos de construcción cuando el trabajo concluye."
 NKO_naval_juche_drive: "Lanzar un impulso naval Juche"
 NKO_naval_juche_drive_desc: "Una movilización nacional para la flota. Los astilleros trabajan a toda máquina durante medio año mientras la economía civil absorbe el costo, y el programa gana de golpe una avalancha de puntos. Requiere un frente interno estable para sostenerse."
 NKO_naval_invest_submarine: "Invertir en la fuerza submarina"
 NKO_naval_invest_submarine_desc: "Pasar un punto de construcción naval para empujar la pista submarino. Crews gana experiencia marina fresca a medida que los diseños maduran. Crossing §Y25§!, §Y50§!, §Y75§! y §Y100§! progreso desbloquea el siguiente nivel de modernización submarino."
 NKO_naval_invest_missile_boat: "Invertir en flotillas de lanchas lanzamisiles"
 NKO_naval_invest_missile_boat_desc: "Pasar un punto de construcción naval para ampliar el programa del barco de misiles. Cada ciclo de reajustes agudiza nuestra huelga literaria. Crossing §Y25§!, §Y50§!, §Y75§!, y §Y100§! progreso desbloquea el próximo nivel del barco de misiles."
 NKO_naval_invest_coastal_defense: "Invertir en la red de defensa costera"
 NKO_naval_invest_coastal_defense_desc: "Pasar un punto de construcción naval para endurecer la costa. Las tripulaciones y las baterías de la costa ganan experiencia. Cruzando §Y25§!, §Y50§!, §Y75§! y §Y100§! progreso desbloquea el próximo nivel de defensa costera."
 NKO_naval_invest_specops: "Invertir en operaciones especiales navales"
 NKO_naval_invest_specops_desc: "Pase un punto de construcción naval para entrenar a ranas del FBI Recon y infantería naval. Las fuerzas especiales agudizan sus habilidades anfibias. Crossing §Y25§!, §Y50§!, §Y75§! y §Y100§! progreso desbloquea el próximo nivel de operaciones especiales navales."
 NKO_naval_capstone_complete: "Forjar el Cinturón del Mar"
 NKO_naval_capstone_complete_desc: "Las cuatro vías han alcanzado su nivel final. Declara completa la doctrina naval Songun y otorga al país su bono duradero."
 NKO_songun_navy_capstone: "Doctrina Naval de Songun"
 NKO_songun_navy_capstone_desc: "Años de construcción enfocada han forjado una marina asimétrica coherente. Los submarinos de larga distancia, los buques de misiles enjaulados, las defensas costeras capas y las fuerzas especiales navales de élite ahora operan como una doctrina."
 NKO_sub_drill_momentum: "Momento de perforación de fuerza submarina"
 NKO_sub_drill_momentum_desc: "Los ejercicios recientes han levantado la moral y la disciplina procesal en todo el servicio silencioso."
 NKO_mb_swarm_momentum: "Misile Boat Swarm Momentum"
 NKO_mb_swarm_momentum_desc: "Las flotillas están montando una ola de confianza después de sus últimos ejercicios."
 NKO_cd_bunker_momentum: "Búnker Belt High Alert"
 NKO_cd_bunker_momentum_desc: "Las guarniciones costeras están a la mayor disposición; los ingenieros empujan el trabajo de fortificación a doble ritmo."
 NKO_so_recon_momentum: "Recon buró operando tempo"
 NKO_so_recon_momentum_desc: "La Oficina de Reconnaissance está ejecutando equipos fríos, randman y cuadros navales SF en rotación constante."
 NKO_naval_strategy_momentum: "Estrategia Naval Momentum"
 NKO_naval_strategy_momentum_desc: "Una doctrina estratégica unificada ha galvanizado cada oficina naval. La investigación, la capacitación y la organización de flotas se benefician del renovado sentido de propósito."
 NKO_sub_tier_1: "Modernización de Sang-O"
 NKO_sub_tier_1_desc: "Refits and crew training across the Sang-O coastal submarine flo."
 NKO_sub_tier_2: "Programa Yono Midget"
 NKO_sub_tier_2_desc: "Los infiltradores de clase Yono y las contramedidas de sonar mejoradas extienden nuestro alcance."
 NKO_sub_tier_3: "Romeo-Clase"
 NKO_sub_tier_3_desc: "Los cascos de Romeo reciben nueva electrónica, baterías y propulsión más silenciosa."
 NKO_sub_tier_4: "Programa Sinpo SLBM"
 NKO_sub_tier_4_desc: "El submarino de clase Sinpo se dedica a la familia Pukguksong. Rango estratégico, disuasión real."
 NKO_mb_tier_1: "Komar Refits"
 NKO_mb_tier_1_desc: "Los cascos antiguos de Komar reciben nuevos lanzadores y motores mejorados."
 NKO_mb_tier_2: "Producción de Soju y Nongo"
 NKO_mb_tier_2_desc: "Los barcos de misiles nacionales Soju y Nongo entran en servicio en números crecientes."
 NKO_mb_tier_3: "Kumsong-3 ASCM Integration"
 NKO_mb_tier_3_desc: "Los misiles de crucero anti-nave Kumsong-3 dan a nuestras flotillas un golpe creíble de largo alcance."
 NKO_mb_tier_4: "Doctrina de Wolfpack"
 NKO_mb_tier_4_desc: "Tácticas de enjambre coordinadas: lanzamientos salvados, ECM en capas y botes de decoy."
 NKO_cd_tier_1: "Búnker Belt"
 NKO_cd_tier_1_desc: "Una cadena continua de búnkeres reforzados a lo largo de las costas oriental y occidental."
 NKO_cd_tier_2: "Artillería costera móvil"
 NKO_cd_tier_2_desc: "Las baterías montadas en camiones se desplazan entre posiciones preparadas para derrotar el fuego de la contra-batería."
 NKO_cd_tier_3: "Tierras fuertes"
 NKO_cd_tier_3_desc: "Los encabezados estratégicos reciben túneles profundos, revistas endurecidas y radares integrados."
 NKO_cd_tier_4: "Basado en la costa Misiles antibuque"
 NKO_cd_tier_4_desc: "Los lanzadores móviles Kumsong niegan a las flotas adversarias el derecho de acercarse a nuestra costa."
 NKO_so_tier_1: "Recon buró Frogmen"
 NKO_so_tier_1_desc: "Los equipos de rangman de la Oficina General de Reconocimiento amplían su equipo y capacitación."
 NKO_so_tier_2: "Brigada Sea Sniper"
 NKO_so_tier_2_desc: "Una brigada de francotiradores dedicados se especializa en rápidas redadas costeras."
 NKO_so_tier_3: "Infantería de Luz Marítima"
 NKO_so_tier_3_desc: "Los batallones de infantería ligera se reorganizan con un elemento marítimo para operaciones anfibias."
 NKO_so_tier_4: "Cuerpo de tormenta naval"
 NKO_so_tier_4_desc: "Los elementos del Cuerpo de Tormentas reciben apegos navales permanentes. Nuestra cabeza de lanza cruza cualquier orilla."
 nko_naval_buildup.1.t: "Una Doctrina Naval para la Nueva Era"
 nko_naval_buildup.1.d: "El Estado Mayor ha preparado un plan de largo alcance: cuatro pistas paralelas, avanzadas a través de puntos de construcción naval acumulados. Tres decisiones generan puntos; cuatro invierten las decisiones gastan. Alcanza el nivel final en cada pista para forjar la Doctrina Naval de Songun."
 nko_naval_buildup.1.a: "Dirigiremos el programa."
 nko_naval_buildup.11.t: "Sang-O Crews Sube"
 nko_naval_buildup.11.d: "Refit yardas despeja un atraso de los cascos Sang-O. Crews perforar todo el día y la confianza en el servicio silencioso crece."
 nko_naval_buildup.11.a: "Onward."
 nko_naval_buildup.12.t: "Los enanos de Yono deslizan las redes"
 nko_naval_buildup.12.d: "Los infiltrados de clase Yono ejecutan ejercicios exitosos contra nuestros propios radares costeros, deslizando líneas de detección pasadas que deberían haberlos atrapado."
 nko_naval_buildup.12.a: "Un borde real."
 nko_naval_buildup.13.t: "Romeo renueva la fruta del oso"
 nko_naval_buildup.13.d: "Los barcos modernizados Romeo ahora patrullan más lejos y más tranquilo de lo que sus diseñadores originales pensaban posible."
 nko_naval_buildup.13.a: "Excelente."
 nko_naval_buildup.14.t: "Superficies de Sinpo"
 nko_naval_buildup.14.d: "Las superficies submarinas de clase Sinpo a tiempo, tubos Pukguksong equipados y probados. La disuasión estratégica ya no es un sueño."
 nko_naval_buildup.14.a: "Gloria al programa."
 nko_naval_buildup.21.t: "Komar Refits completo"
 nko_naval_buildup.21.d: "Los cascos de Komar envejecidos abandonan los patios con nuevos lanzadores, motores alzados y tripulación sorprendentemente agresiva."
 nko_naval_buildup.21.a: "Un buen comienzo."
 nko_naval_buildup.22.t: "Formulario de Flotillas Soju y Nongo"
 nko_naval_buildup.22.d: "Las primeras flotillas dedicadas Soju y Nongo se forman. Más rápido, más inclinado y mucho más peligroso que lo que vino antes."
 nko_naval_buildup.22.a: "Presiona."
 nko_naval_buildup.23.t: "Kumsong-3 va al mar"
 nko_naval_buildup.23.d: "Los misiles anti-viaje Kumsong-3 completan sus pruebas finales de astillero. Nuestras flotillas ahora pueden atacar a rangos que nuestros enemigos no pueden contrarrestar fácilmente."
 nko_naval_buildup.23.a: "Alcance extendido."
 nko_naval_buildup.24.t: "Doctrina de Wolfpack Adoptada"
 nko_naval_buildup.24.d: "Lanzamientos salvoed, atascos en capas y botes de decoy: la doctrina de lolfpack se adopta formalmente a través de la flota de misiles."
 nko_naval_buildup.24.a: "El paquete está listo."
 nko_naval_buildup.31.t: "Cinturón Bunker completo"
 nko_naval_buildup.31.d: "Una cadena continua de búnkeres reforzados ahora abarca ambas costas. Los comandantes locales informan que la moral entre las guarniciones ha mejorado notablemente."
 nko_naval_buildup.31.a: "Mantén la línea."
 nko_naval_buildup.32.t: "Instalación de artillería costera móvil"
 nko_naval_buildup.32.d: "Las baterías montadas en camiones practican sus simulacros de tiro y chocolate hasta que puedan limpiar una posición de disparo antes de que lleguen los proyectiles de contra-batería."
 nko_naval_buildup.32.a: "Trabajo disciplinado."
 nko_naval_buildup.33.t: "Tierras fuertes"
 nko_naval_buildup.33.d: "Las cabeceras más estratégicas reciben túneles profundos, revistas endurecidas y radares integrados. Los planificadores adversarios ahora enfrentan una costa defendida en serio."
 nko_naval_buildup.33.a: "Costa de hierro."
 nko_naval_buildup.34.t: "Base en la costa Misiles antibuque Online"
 nko_naval_buildup.34.d: "Las baterías móviles Kumsong ocupan posiciones costeras. Cualquier acercamiento a nuestras costas pagará un precio empinado."
 nko_naval_buildup.34.a: "Deja que vengan."
 nko_naval_buildup.41.t: "Piscina ampliada"
 nko_naval_buildup.41.d: "La Oficina General de Reconocimiento dobla silenciosamente su ingesta de rancio y estandariza su equipo de buceo."
 nko_naval_buildup.41.a: "Construye el cuadro."
 nko_naval_buildup.42.t: "Sea Sniper Brigade se levanta"
 nko_naval_buildup.42.d: "Una brigada especial de francotiradores se activa formalmente. Sus primeros ejercicios contra objetivos costeros simulados superan las expectativas."
 nko_naval_buildup.42.a: "Sharpened."
 nko_naval_buildup.43.t: "Infantería Ligera Goes Maritime"
 nko_naval_buildup.43.d: "Los batallones de infantería ligeros seleccionados se reorganizan con un elemento marítimo. La doctrina anfibia va más allá de un puñado de unidades especializadas."
 nko_naval_buildup.43.a: "A través de cualquier costa."
 nko_naval_buildup.44.t: "Cuerpo de Tormenta Toma el Mar"
 nko_naval_buildup.44.d: "Los elementos del Cuerpo de Tormentas reciben apegos navales permanentes. Nuestra lanza es ahora una verdadera fuerza de la tierra del mar."
 nko_naval_buildup.44.a: "Strike en cualquier lugar."
 nko_naval_buildup.51.t: "Naval Drill en Wonsan"
 nko_naval_buildup.51.d: "La flotilla submarino de Wonsan tiene su simulacro trimestral en los libros. Crews espera órdenes antes de que se retiren."
 nko_naval_buildup.51.a: "Presiona duro, haz que sudan"
 nko_naval_buildup.51.b: "Un ritmo de rutina medido hará"
 nko_naval_buildup.51.c: "Cancelar, el combustible y las piezas son cortas"
 nko_naval_buildup.52.t: "Extranjero Recon Vessel Sighted"
 nko_naval_buildup.52.d: "Los radares costeros pintan un buque sin marca que vaga dentro de nuestras aguas reclamadas. El comandante de la costa quiere una decisión."
 nko_naval_buildup.52.a: "Interceptar y devolverlo"
 nko_naval_buildup.52.b: "Sombrarlo pero no comprometerse"
 nko_naval_buildup.52.c: "Retirada, evita un incidente"
 nko_naval_buildup.53.t: "Crisis de la deserción submarina"
 nko_naval_buildup.53.d: "Un oficial junior a bordo de uno de nuestros submarinos de patrulla ha desaparecido durante una llamada portuaria. La Oficina de Reconocimiento quiere autorización para actuar."
 nko_naval_buildup.53.a: "Enviar Cuerpo de Tormenta, recuperar o eliminar"
 nko_naval_buildup.53.b: "Pista pasivamente, sin operación"
 nko_naval_buildup.53.c: "Bury el informe"
 nko_naval_buildup.54.t: "Nampo yardas Exceed cuota"
 nko_naval_buildup.54.d: "Los foremen de los astilleros Nampo informan de un mes que abusa de cuotas. La fuerza laboral está energizada pero cansada."
 nko_naval_buildup.54.a: "Recompensarlos públicamente con una ración de bono"
 nko_naval_buildup.54.b: "Demanda más, la cuota siempre fue baja"
 nko_naval_buildup.56.t: "Contrabandista Vessel atrapado"
 nko_naval_buildup.56.d: "Una patrulla costera incauta a un pequeño buque contrabandista. El comandante local pregunta cómo manejar el premio."
 nko_naval_buildup.56.a: "Desfile en la televisión, gana propaganda"
 nko_naval_buildup.56.b: "Incautación silenciosa, doblar el cargamento en acciones"
 nko_naval_buildup.56.c: "Toma el soborno del capitán y cuidado."
 nko_naval_buildup.60.t: "El servicio silencioso camina Tall"
 nko_naval_buildup.60.d: "El Sinpo y sus hermanas regresan a los colgantes triunfadores que vuelan portuaria. El brazo submarino de la Armada Popular Coreana ha llegado a su edad. Una fuerza subacuática creíble que protege a la Patria."
 nko_naval_buildup.60.a: "La profundidad es nuestra."
 nko_naval_buildup.61.t: "Lobos de la Costa"
 nko_naval_buildup.61.d: "La doctrina de Wolfpack se adopta formalmente en todas las flotillas. Los lanzamientos salvoed, ECM en capas y los barcos de decoy. Nuestras fuerzas de huelga literaria operan como un organismo."
 nko_naval_buildup.61.a: "Aflojen a los lobos."
 nko_naval_buildup.62.t: "La costa de hierro"
 nko_naval_buildup.62.d: "De Sinuiju a Wonsan, cada aproximación está bloqueada con búnkeres endurecidos, artillería móvil y misiles anti-viaje lanzados por la costa. Ninguna flota cerrará nuestra costa sin explotar."
 nko_naval_buildup.62.a: "La pared está en pie."
 nko_naval_buildup.63.t: "Cuerpo de Tormenta al Mar"
 nko_naval_buildup.63.d: "Los elementos del Cuerpo de Tormentas ocupan su lugar en el orden marítimo de batalla. La Oficina de Reconnaissance, francotiradores de mar, ranas y infantería de luz naval forman ahora una sola punta de lanza de élite capaz de golpear cualquier orilla."
 nko_naval_buildup.63.a: "Strike en cualquier lugar."
 nko_naval_buildup.70.t: "Una doctrina estratégica para el mar"
 nko_naval_buildup.70.d: "La oficina naval del Estado Mayor ratifica una doctrina unificada: submarinos en capa, botes de misiles enjambre, costas fortificadas y comandos navales que trabajan en concierto. Cada patio, base y escuela de entrenamiento ahora tira en la misma dirección."
 nko_naval_buildup.70.a: "Todas las manos al programa."
 nko_naval_buildup.71.t: "Los primeros destructores domésticos deslizan sus amarres"
 nko_naval_buildup.71.d: "Los patios Nampo y Wonsan lanzan los primeros destructores de misiles caseros en años. Crews enjambre los nuevos cascos, trabajando hasta el estado operativo. La flota de superficie se siente viva otra vez."
 nko_naval_buildup.71.a: "Envíenlos al mar."
 nko_naval_buildup.72.t: "Hulls submarinos domésticos toman forma"
 nko_naval_buildup.72.d: "Sub yardas apaguen nuevos barcos de ataque en un apretado horario. Las tripulaciones entrenadas en los cascos más antiguos de Sang-O y Romeo se rotan en las nuevas plataformas, acelerando la calificación."
 nko_naval_buildup.72.a: "Silenciosamente, en lo profundo."
 nko_naval_buildup.73.t: "Destructor Escuadrones"
 nko_naval_buildup.73.d: "Un escuadrón destructor completo, construido y tripulado en casa, se despliega a la Flota Oriental. Combinado con las flotillas de misiles entrenadas por Wolfpack, el orden superficial de la batalla se convierte en un serio disuasión."
 nko_naval_buildup.73.a: "Deja que los escuadrones corran."
 nko_naval_buildup.74.t: "Una Flota Moderna despierta"
 nko_naval_buildup.74.d: "El casco destructor del escenario 2005 y el submarino de ataque de clase 1995 entraron en nuestros astilleros juntos, bautizó la Clase Hion §YChoe§! y §Y Clase Sinpo§!. Cinco de cada uno han sido entregados a la reserva, y las líneas de producción dedicadas para ambas clases ya están establecidas en los patios Nampo y Wonsan §HSubmarine Bureau§! y §HSurface Ship Bureau§! que se encargan directamente.\n\nEl hito desbloquea los rasgos MIO más recientes en ambas oficinas: §YSea-To-Land Weapons§!, §YModern Materials§!, y §YRefined Submarine Design§! en el Sub Bureau, y §YOptimized Production§! y §YHigh Scale Radar Technology§! en el Surface Ship Bureau."
 nko_naval_buildup.74.a: "Comienza una era de acero."
 nko_naval_buildup.99.t: "El cinturón del mar de Pyongyang está forjado"
 nko_naval_buildup.99.d: "Después de años de esfuerzo concentrado, la Armada Popular Coreana completa la Doctrina Naval Songun. Los submarinos de larga distancia, los buques de misiles enjaulados, las defensas costeras capas y las fuerzas especiales navales de élite operan como uno. La flota asimétrica es un hecho."
 nko_naval_buildup.99.a: "El cinturón de mar está forjado."
 nko_naval_buildup.99.b: "La marina de Pyongyang moderniza."
 NKO_naval_modern_fleet_milestone: "Encargar la flota moderna"
 NKO_naval_modern_fleet_milestone_desc: "Tanto el submarino de ataque clase Sinpo como el destructor clase Choe Hyon han alcanzado su preparación para la producción. Incorporar los primeros cinco cascos de cada uno a la Armada Popular de Corea, sembrar líneas de producción dedicadas y otorgar fondos a ambas oficinas navales."
 NKO_more_arms_factories_desc: "La industria militar no puede permanecer quieta. Se construirán nuevas fábricas de armas para mantener el Ejército Popular Coreano suministrado y la línea Songun fuerte."
 NKO_spa_focus_lifts_industry_tt: "§GEliminar permanentemente los §!§Y«Estagnación industrial»§!§G pena de pie.§!"
 NKO_spa_focus_lifts_production_tt: "§GPermanentemente elimina la línea de producción §!§Y Decay§!§G penalización de pie.§!"
 NKO_spa_focus_lifts_military_tt: "§GEliminar permanentemente los §!§Y'Hollow Force'§!§G pena de pie.§!"
 NKO_spa_focus_lifts_economy_tt: "§GEliminar permanentemente los §!§Y'Resource Hoarding'§!§G pena de pie.§!"
 NKO_spa_focus_lifts_research_tt: "§GEliminar permanentemente los §!§Y«Embarazo de investigación»§!§G pena de pie.§!"
 NKO_spa_focus_lifts_agriculture_tt: "§GEliminar permanentemente los §!§Y'Subsistence Farming'§!§G pena de pie.§!"
 NKO_spa_focus_lifts_foreign_tt: "§GEliminar permanentemente los §!§Y«Isolación diplomática»§!§G pena de pie.§!"
 NKO_spa_focus_lifts_construction_tt: "§GEliminar permanentemente los §!§Y'Construction Bottleneck'§!§G penalización permanente (infraestructura en defensa).§!"
 NKO_spa_umbrella: "Asamblea Popular Suprema"
 NKO_spa_umbrella_desc: "La Asamblea Popular Suprema le permite mantener §Y hasta dos mandatos de productividad§! activos inmediatamente. Cada mandato suspende una de las ocho disfunciones crónicas de la planificación central durante §Y365 días§! y aplica un bono propio; cuando uno pierde su ranura libre para otro. Las penas permanentes se pueden eliminar permanentemente completando los focos coincidentes."
 NKO_spa_debuff_industry: "Embargo industrial"
 NKO_spa_debuff_industry_desc: "Décadas de la asignación central han dejado a las fábricas hambrientos de insumos y mano de obra calificada. Arrastres de construcción."
 NKO_spa_debuff_production: "Línea de producción"
 NKO_spa_debuff_production_desc: "El uso de herramientas, las cadenas de suministro improvisadas y el control de calidad es lo que el capataz siente esa mañana."
 NKO_spa_debuff_military: "Fuerza hueca"
 NKO_spa_debuff_military_desc: "En papel el Ejército Popular Coreano es millones fuerte. En la práctica, el entrenamiento es teatro y la moral es frágil."
 NKO_spa_debuff_economy: "Recursos Hoarding"
 NKO_spa_debuff_economy_desc: "Los cuadros provinciales esquivan lo que fluye a través de sus distritos. Los recursos asignados centralmente llegan tarde, luz o no en absoluto."
 NKO_spa_debuff_research: "Stagnation de Investigación"
 NKO_spa_debuff_research_desc: "Las sanciones, el drenaje cerebral y los equipos de laboratorio deficientes hacen que la investigación básica sea significativamente más lenta."
 NKO_spa_debuff_agriculture: "Dietas"
 NKO_spa_debuff_agriculture_desc: "Las granjas cooperativas producen apenas lo suficiente para alimentar sus propios pueblos. Las ciudades están cortas."
 NKO_spa_debuff_foreign: "Aislamiento diplomático"
 NKO_spa_debuff_foreign_desc: "Las sanciones y el estatus de parías significan que cada overture diplomático cuesta más de lo que debería y produce menos de lo que podría."
 NKO_spa_debuff_construction: "Botella de construcción"
 NKO_spa_debuff_construction_desc: "La ingeniería defensiva es el sector más afectado. Las fortalezas se desmoronan antes de que terminen, las mascotas del radar suben bases navales medianamente mezcladas y los aeródromos están atrapados por el mal mantenimiento."
 NKO_spa_resolution_industry: "Aceleración industrial"
 NKO_spa_resolution_industry_desc: "La Asamblea emite una directiva industrial vinculante. Las fábricas civiles aumentan más rápido, los complejos militares siguen."
 NKO_spa_resolution_production: "Mandato de producción de equipo"
 NKO_spa_resolution_production_desc: "Las líneas de producción pasan por un ciclo planificado de sobremarcha. Se levantan los topes de eficiencia; el equipo nuevo se pone en marcha más rápido."
 NKO_spa_resolution_military: "Resolución de Songun"
 NKO_spa_resolution_military_desc: "Es temporada de Songun. Los calendarios de instrucción se aprietan, la doctrina de ataque se afila y el Partido reafirma sus prioridades."
 NKO_spa_resolution_economy: "Juche Self-Reliance"
 NKO_spa_resolution_economy_desc: "Un impulso de autosuficiencia exprime hasta el último gramo del suelo y las minas. Los recursos locales fluyen."
 NKO_spa_resolution_research: "Investigación Drive"
 NKO_spa_resolution_research_desc: "Todos los institutos trabajan horas extra y los laboratorios clasificados mantienen turnos de veinticuatro horas. Romper las sanciones y la fuga de cerebros es el mandato más caro que puede aprobar la Asamblea."
 NKO_spa_resolution_agriculture: "Agricultora"
 NKO_spa_resolution_agriculture_desc: "Las granjas cooperativas superan la cuota. La escasez civil se alivia y las fábricas ven un pequeño aumento de producción."
 NKO_spa_resolution_foreign: "Directiva de política exterior"
 NKO_spa_resolution_foreign_desc: "Los enviados del Ministerio de Exteriores se despliegan. Mejorar las relaciones sale más barato y los socios comerciales nos miran con algo más de simpatía."
 NKO_spa_resolution_construction: "Batallón de Construcción"
 NKO_spa_resolution_construction_desc: "Brigadas de ingeniería militar movilizadas en masa descienden sobre cada sitio defensivo. Fuertes, radares, posiciones SHORAD, aeródromos, bases navales, silos de combustible, ferrocarriles y centros de suministro se levantan a un ritmo sin precedentes."
 NKO_spa.0.t: "La Asamblea Popular Suprema convoca"
 NKO_spa.0.d: "Camarada Secretaria General, el Gabinete ha preparado la agenda. La Asamblea está reunida. Ocho problemas crónicos exigen atención; en cualquier momento podemos mantener §Y a dos§! de ellos bajo mandato vinculante.\n\nCada mandato tiene por §Y365 días§!; cuando una vuelta, una ranura se libera para el siguiente."
 NKO_spa.0.a: "Convocar la Asamblea."
 NKO_spa.20.t: "Stakhanovite Heroes"
 NKO_spa.20.d: "Los trabajadores del cinturón industrial de Hwanghae han roto sus cuotas en las primeras semanas de la nueva directiva. Sus retratos ya están subiendo por todo el país, y sus directivos reportan un aumento de la capacidad que se pondrá a utilizar inmediatamente."
 NKO_spa.20.a: "Recompensa a los héroes."
 NKO_spa.21.t: "Innovación de herramientas"
 NKO_spa.21.d: "Los ingenieros de la planta de maquinaria pesada Pyongyang han ideado un nuevo proceso de fijación que duplica el rendimiento en las líneas de vehículos blindados. Una oleada de 75 de los últimos lanzamientos de chasis disponibles: tanques, IFVs, APCs, vehículos de reconocimiento o armas autopropulsadas, cualquier línea fue cargada esa semana."
 NKO_spa.21.a: "Difundir la técnica."
 NKO_spa.22.t: "Hero de la República"
 NKO_spa.22.d: "El liderazgo ejemplar de un subalterno durante los simulacros de Songun ha captado el ojo del Estado Mayor. Los conservadores están acudiendo a las oficinas de reclutamiento, inspiradas en el ejemplo."
 NKO_spa.22.a: "Promover y decorar."
 NKO_spa.23.t: "Descubrimiento mineral"
 NKO_spa.23.d: "Los encuestadores que se admiran por las montañas del norte han identificado una vena previamente desconocida. Los ensayos iniciales determinarán cuál es el recurso estratégico que produce el depósito. La Oficina de Recursos Estatales ha autorizado la extracción inmediata."
 NKO_spa.23.a: "Comience la extracción."
 NKO_spa.24.t: "Defección de un Científico Extranjero"
 NKO_spa.24.d: "Un ingeniero expatriado ha pasado los controles de las sanciones y en un centro de investigación de la RPDC. Sus ideas están acelerando uno de los programas prioritarios de la Academia Estatal."
 NKO_spa.24.a: "Bienvenido al camarada."
 NKO_spa.25.t: "Parachoques Harvest"
 NKO_spa.25.d: "Las granjas cooperativas del norte de Hamgyong están reportando rendimientos muy por encima de la cuota. Las oficinas rurales de reclutamiento se llenan de jóvenes campesinos que buscan trabajo en el ejército."
 NKO_spa.25.a: "Distribuir el excedente."
 NKO_spa.26.t: "Golpe diplomático"
 NKO_spa.26.d: "Los enviados del Ministerio de Relaciones Exteriores han aprovechado la nueva directiva en una victoria diplomática silenciosa - una concesión de un socio importante que se traduce en moneda dura."
 NKO_spa.26.a: "Apaguen las ganancias."
 NKO_spa.27.t: "Construcción Vanguard"
 NKO_spa.27.d: "Los batallones de construcción voluntarios han superado todas las proyecciones. Con la capacidad de holgura que queda, el gabinete ofrece las obras a las que cualquier proyecto civil esté más alejado de lo previsto. En caso de que la fuerza laboral no esté disponible, el trabajo puede ser liquidado para divisas duras."
 NKO_spa.27.factory_take: "Construir un fábrica civil."
 NKO_spa.27.factory_cash: "Liquidar el trabajo. (§Y+0.5§! tesorería)"
 NKO_spa.27.offices_take: "Construir un edificio de oficinas."
 NKO_spa.27.offices_cash: "Liquidar el trabajo. (§Y+0.75§! tesorería)"
 NKO_spa.27.refinery_take: "Construir una Refinería Sintética."
 NKO_spa.27.refinery_cash: "Liquidar el trabajo. (§Y+0.45§! tesorería)"
 NKO_spa.27.agri_take: "Construir un Distrito de Agricultura."
 NKO_spa.27.agri_cash: "Liquidar el trabajo. (§Y+0.45§! tesorería)"
 NKO_spa.30.t: "Los Comités del Plan Quinquenal"
 NKO_spa.30.d: "Los banners florecen a través de cada puerta de fábrica. La Asamblea ha decretado que los próximos 365 días son un Plan Quinquenal en miniatura, con cuotas de producción concretas para cada cinturón industrial."
 NKO_spa.30.a: "Ponga en marcha el Plan."
 NKO_spa.31.t: "Cuotas Meta de la Lista"
 NKO_spa.31.d: "A mitad de camino a través de la directiva, las fábricas a lo largo del Taedong están reportando vertidos de hormigón y acero vierte bien por encima del plan. Las brigadas obreras compiten por honores."
 NKO_spa.31.a: "Recompensa a las brigadas líderes."
 NKO_spa.32.t: "Configuración de registros industriales"
 NKO_spa.32.d: "La directiva termina con un rallye triunfante en la plaza Kim Il-sung. Nuevas tragaperras industriales se han añadido a la capacidad productiva de la República, y el prestigio del Partido ha aumentado."
 NKO_spa.32.a: "Celebra el logro."
 NKO_spa.33.t: "Nuevos Llegados de Herramientas"
 NKO_spa.33.d: "A través de canales de mercado gris, la herramienta de reemplazo ha llegado a las plantas del equipo. Plantas de reentrenamiento de foremen de producción contra las nuevas especificaciones."
 NKO_spa.33.a: "Eche un vistazo a la nueva herramienta."
 NKO_spa.34.t: "Líneas de producción Hum"
 NKO_spa.34.d: "La salida a través de los cinturones de equipo Pyongyang y Hamhung es la más suave que ha sido en una década. Las tasas de defecto están disminuyendo, la calidad de acabado está aumentando."
 NKO_spa.34.a: "Empuje para refinar más."
 NKO_spa.35.t: "Control de calidad Triumph"
 NKO_spa.35.d: "El Mandato de Producción de Equipo termina con una inspección estatal que encuentra puntos de referencia de calidad en su memoria viva más alta. Los oficiales de adquisiciones del KPA están contentos."
 NKO_spa.35.a: "Documenta las nuevas normas."
 NKO_spa.36.t: "Drills Intensificar"
 NKO_spa.36.d: "Songun está en temporada. A través de cada cuerpo, se dobla el tempo de perforación. Ejercicios de fuego vivo que habían sido pausados durante años reinician."
 NKO_spa.36.a: "Maneja las tropas más fuerte."
 NKO_spa.37.t: "Oficial Corps Excels"
 NKO_spa.37.d: "Una nueva generación de oficiales de categoría de empresa y batallón se ha convertido en su propio bajo el régimen de entrenamiento intensificado. Las promociones maduran la cadena de mando."
 NKO_spa.37.a: "Recompensa y promueve."
 NKO_spa.38.t: "Songun Triumphs"
 NKO_spa.38.d: "La Resolución de Songun cierra con un gran desfile de Victoria a través de Pyongyang. Los call-ups reservistas han rellenado las filas; el KPA se encuentra en su más fuerte en años."
 NKO_spa.38.a: "Marcha en formación."
 NKO_spa.39.t: "Las encuestas minerales comienzan"
 NKO_spa.39.d: "Los equipos de encuesta geológica se admiran por las montañas del norte. Los antiguos diagramas de la era soviética están llenos de polvo y actualizados con instrumentos modernos."
 NKO_spa.39.a: "Autorizar las encuestas."
 NKO_spa.40.t: "Montaje de la producción minera"
 NKO_spa.40.d: "Las nuevas encuestas han dirigido mineros a venas de grado superior. La producción de carbón, magnesita y tierra rara se elevan marcadamente."
 NKO_spa.40.a: "Presiona la ventaja."
 NKO_spa.41.t: "Autosuficiencia Conseguida"
 NKO_spa.41.d: "El Mandato de Autosuficiencia Juche termina con reservas de divisas replegadas por las ventas de exportación. Camarada Secretaria General, la República es alta."
 NKO_spa.41.a: "Banca las reservas."
 NKO_spa.42.t: "Puertas abiertas"
 NKO_spa.42.d: "La Academia Estatal de Ciencias recibe la llamada: cada programa prioritario está desbloqueado, cada archivo clasificado accesible. Los investigadores que han estado esperando años para la autorización son leídos durante toda la noche."
 NKO_spa.42.a: "Autorizar las prioridades."
 NKO_spa.43.t: "Programas de choque Bear Fruit"
 NKO_spa.43.d: "Varios programas de larga data en toda la Academia Estatal logran avances en rápida sucesión. El Estado Mayor es informado sobre cualquier disciplina que haya dado vuelta a la esquina esta vez."
 NKO_spa.43.a: "Infórmese sobre el Estado Mayor."
 NKO_spa.44.t: "Catching Up"
 NKO_spa.44.d: "La unidad de investigación termina con la RPDC más cerca de la frontera tecnológica que en cualquier momento desde el decenio de 1970. El Partido celebra un triunfo silencioso."
 NKO_spa.44.a: "Presiona la nueva ventaja."
 NKO_spa.45.t: "La planificación de primavera comienza"
 NKO_spa.45.d: "Las granjas cooperativas en todo el país se movilizan para una temporada de plantación agresiva. Las brigadas voluntarias de las ciudades refuerzan la fuerza laboral rural."
 NKO_spa.45.a: "Movilizar las brigadas."
 NKO_spa.46.t: "Tendencias de verano"
 NKO_spa.46.d: "Las inspecciones de media temporada muestran campos en mejor forma que en años. Los canales de riego están fluyendo; las existencias de pesticidas han llegado desde China."
 NKO_spa.46.a: "Mantenga el esfuerzo."
 NKO_spa.47.t: "Parachoques Harvest"
 NKO_spa.47.d: "Los rendimientos vienen en un 20% por encima del plan. Las reservas de grano se hinchan; por primera vez en años algunos distritos verán una ración completa."
 NKO_spa.47.a: "Distribuir el excedente."
 NKO_spa.48.t: "Aspectos diplomáticos"
 NKO_spa.48.d: "Las delegaciones de la República Popular Democrática de Corea son enviadas en silencio a capitales amigables, con condiciones favorables y preguntas discretas: Beijing, Moscú, Teherán, Damasco."
 NKO_spa.48.a: "Envía a los enviados."
 NKO_spa.49.t: "Centros de seguridad silenciosos"
 NKO_spa.49.d: "Varias delegaciones regresan con acuerdos insuficientes: empresas mixtas de la compañía de proyectiles, préstamos de infraestructura y participación en acciones silenciosas de socios extranjeros simpáticos. El cumplimiento de las sanciones ha sido un poco menos riguroso de lo habitual."
 NKO_spa.49.a: "Recibe las entregas."
 NKO_spa.50.t: "Concesiones Comerciales"
 NKO_spa.50.d: "La Directiva sobre política exterior termina con un grupo de nuevos arreglos que mejoran significativamente las entradas de capital extranjero. Los compromisos en materia de inversiones se incluyen para el próximo decenio."
 NKO_spa.50.a: "Firme los acuerdos."
 NKO_spa.51.t: "Construcción Vanguard Mobiliza"
 NKO_spa.51.d: "El Mandato del Batallón de Construcción es un fracaso para cualquier facción interna que el Gabinete decida acreditar. El Partido puede dirigir el dividendo político a una facción cuya cooperación necesita más que los otros."
 NKO_spa.51.military: "Crédito §YLa opinión militar§!. (§G+15§!"
 NKO_spa.51.cadres: "Crédito §YCádres comunistas§!. (§G+15§! opinión)"
 NKO_spa.51.donju: "Crédito §YEl Donju§!. (§G+15§! opinión)"
 NKO_spa.51.farmers: "Crédito §YFármeros§!. (§G+15§! opinión)"
 NKO_spa.51.labour: "Crédito §Y Unións de trabajadores§!. (§G+15§! opinión)"
 NKO_spa.51.none: "Tomar el crédito político. (§G+25 PP§!)"
 NKO_spa.52.t: "Sitios en toda la República"
 NKO_spa.52.d: "La construcción está en marcha en todas las provincias. Las carreteras están clasificadas, las espuelas ferroviarias soldadas, las líneas eléctricas re-strung. El tipo de trabajo de infraestructura no glamorosa que se acumula durante décadas."
 NKO_spa.52.a: "Presiona el horario."
 NKO_spa.53.t: "Proyectos completos"
 NKO_spa.53.d: "El Mandato del Batallón de Construcción cierra con ceremonias de corte de cinta que se transmiten en toda la República. El Partido cosecha el dividendo político; la población es más estable; el tesoro ve una pequeña caída de los excedentes del proyecto."
 NKO_spa.53.a: "Corta las cintas."
