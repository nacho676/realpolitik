 NKO_black_market: "Tercer Piso"
 NKO_black_market_desc: "El tercer piso es un término de uso general que se refiere a la interacción de tres oficinas subordinadas a la Secretaría del Comité Central del Partido. Bureau 35, Bureau 38, Bureau 39, en coordinación con la Secretaría Personal se encargan de recoger inteligencia, ganar divisas para el partido y las élites principales y gestionar parte del dinero del partido y la familia Kim. Los operativos de tercer piso, ubicados en más de 20 países del mundo, también fueron responsables de la compra de una variedad de bienes para las élites DPRK y la recogida de inteligencia, fuera de las redes de información dedicadas por la RPDC.El término Third Floor se refiere a la ubicación original de estas oficinas en el tercer piso del edificio de oficinas de Kim Jong-il en el Complejo de Oficina del Comité Central de KWP en el Distrito Central de Pyongyang. El tercer piso está técnicamente subordinado al Comité Central del Partido. Sin embargo, está directamente ligada a la familia Kim."
