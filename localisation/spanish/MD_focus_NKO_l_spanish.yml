 NKO_anti_tatmadaw_sentiment_desc: "Cuando el Ejército Popular de Corea decidió llevar a cabo un importante resurgimiento de la situación política en Corea, la hostilidad del pueblo al gobierno militar había alcanzado un nivel sin precedentes."
 NKO_simhwajo_sageon_legacy: "El legado de los Simhwajo Sageon"
 NKO_simhwajo_sageon_legacy_desc: "El Simhwajo Sageon es una campaña de purga masiva de Kim Jong-il para eliminar a los hombres de su padre Kim Il-Sung que tuvo lugar en la República Popular Democrática de Corea entre 1997 y 2000 \nAlgunos lo llamaban la «versión norcoreana del McCarthyism» o la «versión norcoreana de la Revolución Cultural»"
