 korea_russia.53.t: "Tecnología Submarina"
 korea_russia.53.d: "Rusia nos suplicó con una tecnología mejor para que podamos mejorar nuestros submarinos todo esto es gracias al impulso del líder norcoreano para desarrollar submarinos con energía nuclear."
 korea_russia.53.a: "Bendice a nuestro Líder"
 korea.135.t: "Operación Hacking sucedió"
 korea.135.d: "Nuestros hackers infiltraron la infraestructura bancaria de las naciones occidentales y sacaron fondos significativos. Algunos se perdieron en los canales traseros utilizados para trasladarlo a casa, pero la operación fue un éxito."
 korea.135.a: "Buen trabajo."
 korea.136.t: "Corea del Norte nos hackeó"
 korea.136.d: "Los hackers norcoreanos han lanzado un ciberataque en nuestra infraestructura bancaria para sifonear fondos. Debemos tomar represalias con nuestras propias operaciones o hacer un llamamiento a la comunidad internacional."
 korea.136.a: "Unexpected"
 korea.137.t: "Las drogas flotan en nuestras calles"
 korea.137.d: "Una nueva ola de drogas ha inundado nuestras calles. La fuente sigue sin confirmarse, pero debemos movernos cuidadosamente, la productividad ya está sufriendo."
 korea.137.a: "Apoyar los Adictos"
 korea.137.b: "¿Qué podemos hacer"
 korea.138.t: "Operación de Drogas tuvo éxito."
 korea.138.d: "Una nueva ola de drogas ha inundado las calles de nuestros enemigos. Tendrán que gastar para contener la crisis, mientras ganamos un modesto beneficio. La inversión continua en la agencia mantendrá el flujo de efectivo."
 korea.138.a: "¡Bien hecho!"
 korea.139.t: "Operación de dólares falsificados"
 korea.139.d: "Hemos impreso $100 proyectos de ley y los distribuiremos a través de canales traseros en mercados extranjeros, lavando el producto a través de nuestra red de mercado negro. Los ingresos corrientes de este plan financiarán nuevas operaciones."
 korea.139.a: "¡Bien hecho!"
