 NKO_export.10.e: "Solicitar un paquete §YBlindajeed§!: tanques de combate principales & equipo de comando"
 NKO_export.10.e.tt: "Entrega §Y tanques de batalla principales §! y §Y equipo de mantenimiento§! suficiente para §Y tres batallones blindados§! (3× requerimiento de batallón). Requiere un moderno diseño de tanques norcoreanos."
