 NKO_5_decrease_kim_jong_nam_tt: "Apoyo de Kim Jong-nam §Ydisminuye§! por 5%"
 NKO_korean_repair_frontline_workers_desc: "Bajo el tratado de asociación 2024, las brigadas norcoreanas trabajan en las áreas traseras de los distritos occidentales de Rusia, reconstruyendo patios ferroviarios, aeródromos, muelles y plantas de armas. Pyongyang se paga en efectivo y combustible para las colocaciones."
 NKO_korean_repair_frontline_workers_sov_desc: "Miles de trabajadores han sido enviados a lugares de reconstrucción rusos bajo contrato estatal. Sus salarios regresan a Pyongyang en divisas duras, pero los hombres son sacados de la misma piscina del ejército popular coreano recluta."
 NKO_korean_repair_civil_workers_desc: "Los equipos de construcción norcoreanos están asignados a la reconstrucción civil en toda Rusia, reparando fábricas, viviendas y carreteras. Moscú cubre su mantenimiento y paga a Pyongyang por el contrato."
 NKO_korean_repair_civil_workers_sov_desc: "Las tripulaciones de mano de obra civil se colocan con la construcción rusa combinadas en virtud del contrato estatal. Las colocaciones ganan moneda fuerte en el extranjero a costa de mano de obra en casa."
 NKO_korean_ratnik_conversion_desc: "El kit de infantería Ratnik suministrado por Rusia llega al Ejército Popular Coreano: armadura corporal, engranaje de carga, óptica y ropa de cuero frío. El equipo es una mejora notable en la cuestión interna, y sus costos de mantenimiento en consecuencia."
