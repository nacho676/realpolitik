 mercosur.02.t: "Invitación a unirse al MERCOSUR como Estado Asociado"
 mercosur.02.d: "[FROM.GetName] nos ha acercado con una oferta para entrar en MERCOSUR como estado asociado. La propuesta deja de ser admitida, pero nos ubicaría dentro de la órbita de un bloque que está claramente tratando de recuperar su vieja ambición. Aceptar significaría que nuestro futuro está ligado, al menos en parte, al proyecto sudamericano."
 mercosur.02.a: "Aceptar el estado asociado."
 mercosur.02.b: "Desclina por ahora."
 mercosur.03.t: "Miembros asociados aceptados"
 mercosur.03.d: "[FROM.GetName] ha aceptado nuestra invitación y acordado entrar en el MERCOSUR como estado asociado. El paso es modesto en el papel, pero políticamente significativo: otro capital ha decidido que quedarse cerca del bloque es más seguro que estar completamente separado de él."
 mercosur.03.a: "Excelente."
 mercosur.04.t: "Membresía asociada rechazada"
 mercosur.04.d: "[FROM.GetName] ha rechazado nuestra oferta, al menos por ahora. Su gobierno prefiere la distancia al enredo, y cualquier interés existió en una alineación más estrecha no fue lo suficientemente fuerte como para superar la precaución. La puerta permanece abierta, pero tendrá que ser empujada de nuevo más tarde."
 mercosur.04.a: "Unfortunate."
 mercosur.05.t: "Conferencias completas de membresia abiertas"
 mercosur.05.d: "Han comenzado las negociaciones formales con [CHL.GetName]. Si estas conversaciones tienen éxito, el MERCOSUR no sólo reclamará relevancia continental; lo probará mediante la incorporación de otro Estado plenamente en sus instituciones."
 mercosur.05.a: "Proceda."
 mercosur.06.t: "Invitación a unirse como miembro completo"
 mercosur.06.d: "[FROM.GetName] nos ha invitado a resolver la cuestión de la plena pertenencia al MERCOSUR de una vez por todas. Podemos entrar inmediatamente, insistir en un paquete más amplio de apoyo y preparación antes del paso final, o decidir que el momento aún no está bien. Lo que elijamos, la decisión indicará cuán de cerca tenemos la intención de vincular nuestro futuro al bloque."
 mercosur.06.a: "Aceptar la membresía completa inmediata."
 mercosur.06.b: "Aceptar, pero solicitar un paquete de adhesión."
 mercosur.06.c: "Permanezcan sólo un estado asociado."
 mercosur.07.t: "Paquete de Adhesión solicitado"
 mercosur.07.d: "[FROM.GetName] ha aceptado nuestra entrada en principio, pero prefiere que la membresía sea precedida por un conjunto más amplio de inversiones, coordinación y reaseguro político. Su adhesión se desarrollará ahora a través de un proceso escenificado, y cómo lo manejamos dará forma al tono de su relación con el bloque durante años venideros."
 mercosur.07.a: "Comience el trabajo."
 mercosur.08.t: "Membresía completa rechazada"
 mercosur.08.d: "[FROM.GetName] ha disminuido la membresía total por el momento. Ya sea por precaución, orgullo o vacilación doméstica, todavía no están dispuestos a permitir que el MERCOSUR se convierta en una parte permanente de su horizonte político."
 mercosur.08.a: "Revisitaremos esto más tarde."
 mercosur.09.t: "Conferencias de Afiliación Asociada abiertas"
 mercosur.09.d: "Nuestros diplomáticos han abierto conversaciones con [PRU.GetName] sobre la membresía asociada en MERCOSUR. La propuesta es lo suficientemente modesta como para parecer práctica, pero lo suficientemente significativa como para probar si el lenguaje de la solidaridad sudamericana todavía tiene peso en su capital."
 mercosur.09.a: "Proceda."
