 MER_request_mercosur_associate_membership: "Solicitar el estatus de asociado del MERCOSUR"
 MER_request_mercosur_associate_membership_desc: "Presentar una petición formal al MERCOSUR para el status asociado. Si la presentación procede sin interrupción, se nos introducirá en el círculo exterior del bloque después del período de revisión, abriendo la puerta a una coordinación regional más estrecha."
 MER_request_mercosur_full_membership: "Solicitar la membresía plena del MERCOSUR"
 MER_request_mercosur_full_membership_desc: "Presentar una petición formal para ingresar al MERCOSUR como miembro completo. Si el proceso continúa su curso, nuestra adhesión se formalizará al final del período de examen, trayéndonos totalmente dentro del bloque."
 MER_request_unasul_membership: "Solicitar la membresía de UNASUR"
 MER_request_unasul_membership_desc: "Presentar una solicitud formal para unirse a UNASUR. Si la petición avanza hasta el final, entraremos en el marco sudamericano al término del periodo de revisión en lugar de esperar una invitación bilateral aparte."
 leave_UNASUL: "Abandonar el Mecanismo Conjunto de Defensa de UNASUR"
 leave_UNASUL_desc: "Retirada de la alianza militar construida alrededor del Mecanismo Conjunto de Defensa UNASUL y poner fin a nuestra participación en su estructura común de defensa."
 UNASUL_leave_tt: "Nos retiraremos de la alianza militar del Mecanismo Conjunto de Defensa UNASUL."
 MER_full_membership_acceptance_hint_desc: "\n\n§YLa tasa de aceptación está determinada por la opinión de ese país sobre usted, su influencia sobre ella y el progreso del árbol MERCOSUR!§!"
 MER_full_membership_invite_process_desc: "\n\n§YSi el país acepta, puede unirse inmediatamente como miembro completo o solicitar un paquete de adhesión de tres pasos. Completar las tres decisiones de adhesión formaliza la membresía mediante la ruta de inversión.§!"
 MER_mercosur_associate_invite_accept_tt: "El país invitado se convierte en un Estado Asociado §YMERCOSUR§!. Cada Estado miembro §YMERCOSUR§! gana §G+1.00%§! §Y Crecimiento de productividad mensual§! y §G+1,00%§! §Y Multiplicador de influencia extranjera§!, y ambas partes reciben una notificación."
 MER_mercosur_associate_invite_reject_tt: "El país invitado rechaza la oferta, no puede ser abordado de nuevo por §Y180 días§!, y perdemos §R15§! §Y Poder político§! una vez que se entrega el rechazo."
 MER_mercosur_full_invite_accept_tt: "El país invitado acepta la oferta. Luego elegirá entre §YMiembros completos inmediatos§! y un §Yruta de adhesión a tres pasos respaldada por la inversión§!, y ambas partes reciben una notificación de aceptación."
 MER_mercosur_full_invite_reject_tt: "El país invitado rechaza la oferta, no puede ser abordado de nuevo por §Y365 días§!, y perdemos §R25 §! §Y Poder político§! una vez entregado el rechazo."
 MER_unasul_invite_accept_tt: "El país invitado se suma a §YUNASUL§!. §YUNASUL Member State§! modificador dinámico se actualiza para todos los miembros, creciendo por §G+1.00%§! §YPoder Político Ganar§! y §G+1.00%§! §YEstabilidad§!, y se envían eventos regionales de notificación."
 MER_unasul_invite_reject_tt: "El país invitado rechaza la oferta, no puede ser abordado de nuevo por §Y365 días§!, y perdemos §R15§! §Y Poder político§! una vez que se entrega el rechazo."
 MER_full_membership_step_one_desc: "\n\n§YEste es el paso de adhesión 1 de 3. Completar las tres decisiones de adhesión formaliza la plena membresía.§!"
 MER_full_membership_step_two_desc: "\n\n§YEste es el paso de adhesión 2 de 3. Completar las tres decisiones de adhesión formaliza la plena membresía.§!"
 MER_full_membership_step_three_desc: "\n\n§YEste es el paso final de adhesión. Una vez que las tres decisiones de adhesión sean completas, se formaliza la composición completa.§!"
 MER_CHL_tariff_alignment: "Alineación arancelaria para Chile"
 MER_CHL_tariff_alignment_desc: "Financiar la revisión arancelaria y la coordinación administrativa necesarias para alinear más a Chile con el régimen aduanero del bloque.$MER_full_membership_step_one_desc$"
 MER_CHL_customs_system_modernization: "Modernización del sistema aduanero para Chile"
 MER_CHL_customs_system_modernization_desc: "Proporcionar la financiación y el apoyo técnico necesarios para modernizar la administración aduanera de Chile para la adhesión plena al MERCOSUR.$MER_full_membership_step_two_desc$"
 MER_CHL_common_standards: "Apoyar la adopción de normas comunes en Chile"
 MER_CHL_common_standards_desc: "Apoyar el trabajo reglamentario y técnico final necesario para que Chile adopte normas comunes MERCOSUR.$MER_full_membership_step_three_desc$"
