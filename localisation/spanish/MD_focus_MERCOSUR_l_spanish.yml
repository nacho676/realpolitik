 MER_unasul_democratic_clause_vote_suspend_tt: "§YCasar nuestro voto por suspensión.§! Si prevalece la parte de suspensión, se promulgarán las siguientes medidas:"
 MER_unasul_democratic_clause_vote_probation_tt: "§YPongamos nuestro voto para mantenerlos dentro de UNASUL bajo advertencia.§! Si prevalece la parte reprensiva, se promulgarán las siguientes medidas:"
