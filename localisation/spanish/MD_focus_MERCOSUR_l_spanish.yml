 mercosur.28.t: "Adhesión completada"
 mercosur.28.d: "El largo proceso de adhesión para [FROM.GetName] ha seguido su curso. Después de las negociaciones, los ajustes institucionales y una demostración constante de compromiso, ya no hay ninguna ambigüedad: ahora están dentro del MERCOSUR como miembro completo."
 mercosur.28.a: "Un nuevo miembro se une."
 mercosur.29.t: "Composición formalizada"
 mercosur.29.d: "El camino establecido con [FROM.GetName] finalmente ha llegado a su conclusión. Lo que comenzó como un cortejo cauteloso ha terminado en plena admisión, y nuestro lugar dentro del MERCOSUR es ahora formal más que provisional."
 mercosur.29.a: "Nos unimos al bloque."
 mercosur.30.t: "Cumbre de América del Sur anunciada"
 mercosur.30.d: "Se ha anunciado una nueva Cumbre de América del Sur como el primer paso hacia la cooperación regional renovada. Los organizadores han declarado que el MERCOSUR debe revitalizarse, reforzar la coordinación económica y que el continente tiene una voz colectiva más fuerte en los asuntos mundiales. Los partidarios aclaman la iniciativa como un retorno de larga data a la ambición regional, mientras que los críticos cuestionan si América del Sur puede ir más allá del simbolismo y hacia una integración duradera."
 mercosur.30.a: "Comienza un nuevo capítulo regional."
 mercosur.31.t: "[FROM.GetName] Se une al MERCOSUR como Miembro Asociado"
 mercosur.31.d: "[FROM.GetName] ha acordado unirse al MERCOSUR como miembro asociado, marcando un nuevo paso en el renacimiento de la cooperación regional sudamericana. Si bien la condición de asociado no es plenamente miembro, abre la puerta para estrechar los vínculos comerciales, la coordinación política y las futuras conversaciones de adhesión. Los partidarios ven el movimiento como un signo de que el MERCOSUR se está convirtiendo una vez más en una fuerza regional seria."
 mercosur.31.a: "El bloque está creciendo."
 mercosur.32.t: "[FROM.GetName] Se convierte en miembro pleno del MERCOSUR"
 mercosur.32.d: "[FROM.GetName] ha entrado en MERCOSUR como miembro completo. Lo que comenzó como diplomacia regional se ha convertido ahora en una expansión tangible del bloque mismo, profundizando su peso económico y relevancia política en toda América Latina. Para los partidarios de la integración, esto es más que un éxito diplomático. Es prueba de que el MERCOSUR todavía puede dar forma al futuro del continente."
 mercosur.32.a: "Un nuevo miembro, un bloque más fuerte."
 BRA_unasul: "Establecer UNASUL"
 BRA_unasul_desc: "La cooperación sudamericana ya no debe seguir siendo un marco temporal. Ha llegado el momento de institucionalizarla como organización regional permanente. Mediante la creación de una estructura que reúna el diálogo político, el desarrollo de infraestructuras y la cooperación social, podemos hacer avanzar la unidad sudamericana en una nueva etapa."
 MER_expansion_unasul: "Ampliar UNASUL"
 MER_expansion_unasul_desc: "Para que el UNASUL se convierta en un marco verdaderamente continental, debe ampliar la participación preservando al mismo tiempo el impulso político. Al introducir más estados en el proyecto, podemos fortalecer su legitimidad como institución común de Sudamérica."
 MER_sa_corridor_development: "Desarrollo de corredores sudamericanos"
 MER_sa_corridor_development_desc: "La integración continental no puede vivir solo en declaraciones. Hay que conectar caminos, puertos, ferrocarriles, telecomunicaciones y corredores interiores para que el movimiento transfronterizo y el comercio se vuelvan reales en lugar de retóricas."
 MER_counter_cartel: "ContraCartel Cooperation"
 MER_counter_cartel_desc: "El tráfico de drogas, el contrabando de armas y las organizaciones criminales transnacionales amenazan tanto la estabilidad sudamericana como la integración regional. Debemos fortalecer el intercambio de información y las medidas conjuntas para hacer frente a amenazas que no respetan las fronteras nacionales."
 MER_sa_energy_council: "Consejo Sudamericano de Energía"
 MER_sa_energy_council_desc: "Con petróleo, gas, energía hidroeléctrica y grandes redes de transmisión, América del Sur tiene un gran potencial para la cooperación energética. En lugar de permitir que estos recursos se conviertan en puntos de rivalidad, debemos buscar la estabilidad y la complementariedad regionales."
 MER_sa_health_council: "Consejo de Salud Sudamericano"
 MER_sa_health_council_desc: "La cooperación sanitaria es menos dramática que la geopolítica, pero es uno de los campos más prácticos y eficaces de la integración sudamericana. Mediante la coordinación de la vigilancia, los medicamentos y el personal sanitario, podemos demostrar la integración a través de la vida cotidiana."
 MER_productive_integration_and_sme_networks: "Integración productiva y redes de PYME"
 MER_productive_integration_and_sme_networks_desc: "La integración regional no debe permanecer limitada a las principales empresas y las exportaciones de productos básicos. Al alentar a las PYME, las cadenas regionales de suministro y la complementariedad productiva, podemos dar al proyecto una base económica más concreta."
 MER_sa_defense_council: "Consejo de Defensa Sudamericano"
 MER_sa_defense_council_desc: "La seguridad sudamericana no debe depender únicamente de marcos externos. Antes de las grandes ambiciones militares, la región debe construir hábitos de diálogo, transparencia y gestión coordinada de crisis en materia de defensa."
 MER_sa_network_for_science_and_innovation: "Red de innovación sudamericana"
 MER_sa_network_for_science_and_innovation_desc: "Si la integración es servir al futuro, América del Sur debe conectar no sólo los mercados y recursos, sino también el conocimiento y la innovación. La cooperación científica puede fortalecer el desarrollo autónomo del continente."
 MER_unasul_factions: "UNASUL organización conjunta de defensa"
 MER_unasul_factions_desc: "Ha llegado el momento de trasladar la unidad sudamericana más allá de la cooperación política. Para salvaguardar la seguridad regional y responder colectivamente a la presión externa y la desestabilización, institucionalizaremos la cooperación de defensa bajo UNASUL y construiremos una nueva organización conjunta de defensa que vincule a las naciones de Sudamérica."
 unasul_member_state_modifier: "Estado miembro del UNASUL"
 unasul_member_state_modifier_desc: "El UNASUL se está reconstruyendo como marco continental para la coordinación política, el desarrollo y la acción común en América del Sur. Sus beneficios crecen a medida que más miembros se unen y como nuevos consejos y programas profundizan el alcance de la organización.\n\n§YEste espíritu nacional se fortalece a medida que aumenta el número de Estados miembros del UNASUL.§!"
 MER_unasul_integrated_corridor_plan_modifier: "UNASUL Plan de Corredor Integrado"
 MER_unasul_integrated_corridor_plan_modifier_desc: "UNASUL ha lanzado una ronda coordinada de inversión en carreteras, logística y enlaces digitales en toda América del Sur. Por ahora, los estados miembros están construyendo el transporte y la infraestructura de red más rápido de lo habitual."
 MER_unasul_energy_security_modifier: "Iniciativa UNASUL de seguridad energética"
 MER_unasul_energy_security_modifier_desc: "El UNASUL ha comprometido recursos a nivel de bloques para la resiliencia energética. Los Estados Miembros están acelerando la construcción de energía fósil, nuclear y renovable bajo un programa regional común."
 MER_unasul_joint_exercises_modifier: "Ejercicios conjuntos UNASUL"
 MER_unasul_joint_exercises_modifier_desc: "Las fuerzas armadas del UNASUL están participando actualmente en una ronda coordinada de ejercicios conjuntos, intercambios de personal y planificación de interoperabilidad."
 MER_invite_to_unasul: "Invitar [FROM.GetName] a UNASUL"
 MER_invite_to_unasul_desc: "Abrir conversaciones formales con [FROM.GetName] sobre su ingreso a UNASUR. La tasa de aceptación depende de la opinión de ese país sobre nosotros, de nuestra influencia sobre él y del progreso del árbol de UNASUR."
 MER_unasul_integrated_corridor_plan: "Lanzar el Plan Integrado de Corredores"
 MER_unasul_integrated_corridor_plan_desc: "Pase los recursos de tesorería para acelerar el transporte y la construcción de redes en todos los actuales miembros del UNASUL durante 180 días."
 MER_unasul_counter_cartel_operation: "Lanzar la operación de la Alianza Anticárteles"
 MER_unasul_counter_cartel_operation_desc: "Pedir a todos los miembros de UNASUR que sufren influencia de los cárteles que aporten capital político a una operación anticárteles coordinada. El impacto final depende de cuántos Estados se comprometan por completo."
 MER_unasul_counter_cartel_operation_tt: "Se pedirá a todos los miembros de UNASUR afectados por la influencia de los cárteles que aporten capital político a la operación. El resultado final depende de la firmeza con que los gobiernos participantes respalden la ofensiva."
 MER_unasul_energy_security_reinforcement: "Fortalecimiento de la seguridad energética sudamericana"
 MER_unasul_energy_security_reinforcement_desc: "Pase los recursos de tesorería para acelerar la construcción de energía fósil, nuclear y renovable en todos los actuales miembros del UNASUL durante 180 días."
 MER_unasul_joint_health_improvement_project: "Lanzar el Proyecto Conjunto de Mejora de la Salud de UNASUR"
 MER_unasul_joint_health_improvement_project_desc: "Iniciar un proyecto de coordinación sanitaria de 180 días. Al concluir, el UNASUL gana un aumento permanente del crecimiento de la población mensual. Esto puede completarse hasta cuatro veces.\n\n§YA través de esta línea de proyecto, el crecimiento mensual de la población del UNASUL puede alcanzar hasta un +10% en total.§!"
 MER_unasul_supply_chain_strengthening: "Fortalecer las cadenas de suministro sudamericanas"
 MER_unasul_supply_chain_strengthening_desc: "Lanzar un proyecto de coordinación de cadenas de suministro de 180 días. Al concluir, UNASUR gana un aumento permanente de la productividad de la industria civil. Puede completarse hasta cuatro veces.\n\n§YA través de esta línea de proyectos, la productividad de la industria civil de UNASUR puede llegar a +15% en total.§!"
 MER_unasul_joint_exercises: "Lanzar ejercicios conjuntos de UNASUR"
 MER_unasul_joint_exercises_desc: "Financiar una ronda de 180 días de ejercicios conjuntos de UNASUR, que mejora la ganancia diaria de experiencia terrestre, naval y aérea en todo el bloque."
 MER_unasul_joint_research_exchange_project: "Lanzar el Proyecto Conjunto de Intercambio de Investigación y Tecnología de UNASUR"
 MER_unasul_joint_research_exchange_project_desc: "Iniciar un programa de coordinación de investigación de 180 días. Cuando concluye, UNASUL gana un aumento permanente de la velocidad de investigación. Esto puede completarse hasta cuatro veces.\n\n§YA través de esta línea de proyecto, la velocidad de investigación del UNASUL puede alcanzar hasta un +10% en total.§!"
 mercosur.35.t: "Invitación a unirse al UNASUL"
 mercosur.35.d: "[FROM.GetName] nos ha invitado a unirse al UNASUL, presentándolo como el techo político bajo el cual Sudamérica podría aprender una vez más a actuar juntos. Aceptar nos situaría dentro de un proyecto que promete el diálogo, la coordinación y la ambición continental, pero también pregunta si estamos dispuestos a vincularnos con una visión regional más amplia."
 mercosur.35.a: "Únete al UNASUL."
 mercosur.35.b: "Desclina por ahora."
 mercosur.36.t: "Invitación UNASUL Dispatched"
 mercosur.36.d: "Se han abierto conversaciones diplomáticas con [FROM.GetName] sobre la entrada en UNASUL. La invitación ha sido enviada, el caso ha sido hecho, y ahora esperamos ver si otra capital está dispuesta a apostar por la vuelta del concierto sudamericano."
 mercosur.36.a: "Proceda."
 mercosur.37.t: "Invitación UNASUL Aceptada"
 mercosur.37.d: "[FROM.GetName] ha aceptado nuestra invitación y entrado en UNASUL. Lo que fue recientemente una idea discutida en discursos y comunicados está empezando a tomar la forma de una institución continental real."
 mercosur.37.a: "Excelente."
 mercosur.38.t: "Rechazado por invitación UNASUL"
 mercosur.38.d: "[FROM.GetName] ha rechazado nuestra invitación a unirse al UNASUL por ahora. El sueño de un marco sudamericano más amplio no ha sido rechazado abiertamente, pero tampoco ha ganado aún su confianza."
 mercosur.38.a: "Lo intentaremos más tarde."
 mercosur.39.t: "Miembros UNASUL Aceptados"
 mercosur.39.d: "Hemos aceptado la invitación de [FROM.GetName] y nos hemos unido a UNASUL. Sin embargo, incierto el futuro de la integración sudamericana puede ser, hemos elegido no verlo desde los laterales."
 mercosur.39.a: "Una América del Sur más amplia."
 mercosur.40.t: "[FROM.GetName] Se une a UNASUL"
 mercosur.40.d: "[FROM.GetName] se ha unido al UNASUL, añadiendo otra voz, otra burocracia y otra ambición nacional del marco suramericano emergente. Con cada adhesión, el proyecto se vuelve más difícil de descartar como nostalgia y más fácil de imaginar como un hecho político duradero."
 mercosur.40.a: "El continente sigue alineando."
 mercosur.50.t: "Plan de Corredor Integrado Activado"
 mercosur.50.d: "El Plan de Corredor Integrado del UNASUL ha pasado de las mesas de conferencias a los mapas y planes de campo. En todo el continente, ministerios, ingenieros y planificadores están tratando de convertir el lenguaje de la integración en caminos, enlaces y pasillos que los estados pueden sentir."
 mercosur.50.a: "Sigue construyendo."
 mercosur.51.t: "Proyecto conjunto de salud lanzado"
 mercosur.51.d: "Se ha iniciado una nueva iniciativa conjunta de salud en el marco UNASUL. Los funcionarios hablan de adquisiciones compartidas, respuestas comunes y mejor coordinación, pero bajo el lenguaje administrativo se encuentra una ambición mayor: hacer sentir la integración regional en clínicas, farmacias y vida cotidiana."
 mercosur.51.a: "Para un continente más saludable."
 mercosur.52.t: "Proyecto conjunto de salud completado"
 mercosur.52.d: "La última iniciativa conjunta de salud ha concluido, y sus prácticas más exitosas se están plegando a la maquinaria permanente del UNASUL. Lo que comenzó como un esfuerzo temporal es establecerse en el hábito, dando a la organización una cara más humana y tangible."
 mercosur.52.a: "Una ganancia duradera."
 mercosur.53.t: "Iniciativa de seguridad energética Activada"
 mercosur.53.d: "UNASUL ha lanzado un impulso a nivel de todo el continente en materia de seguridad energética. Los planificadores de poder, funcionarios públicos y ministros están trabajando repentinamente desde el mismo mapa regional, tratando de asegurar que la abundancia de Sudamérica se convierta en una fuente de estabilidad en lugar de rivalidad."
 mercosur.53.a: "Potenciar el continente."
 mercosur.54.t: "Iniciativa de Cadena de Suministros"
 mercosur.54.d: "Se ha iniciado una nueva iniciativa UNASUL sobre las cadenas de suministro. Los gobiernos, las cámaras de comercio y los organismos técnicos están tratando ahora la difícil labor de hacer que la producción sudamericana se ajuste en lugar de simplemente existir junto a sí misma."
 mercosur.54.a: "Integrar el mercado."
 mercosur.55.t: "Capacity Chain Initiative Completed"
 mercosur.55.d: "La última iniciativa de la cadena de suministro de UNASUL se ha completado. Sus lecciones prácticas, relaciones comerciales y hábitos administrativos ya no son experimentos temporales; se están convirtiendo en parte de la arquitectura económica permanente de la región."
 mercosur.55.a: "Una base productiva más fuerte."
 mercosur.56.t: "Ejercicios conjuntos en curso"
 mercosur.56.d: "Los ejercicios conjuntos del UNASUL están en marcha. Los oficiales que una vez se conocían solo a través del protocolo oficial se reúnen sobre el terreno, intercambiando métodos, comprobando supuestos y aprendiendo cómo es la coordinación regional cuando se pide que funcione en la práctica."
 mercosur.56.a: "Mejorar la preparación."
 mercosur.57.t: "Proyecto de intercambio de investigación lanzado"
 mercosur.57.d: "Se ha iniciado un nuevo esfuerzo de investigación y intercambio de tecnología UNASUL. Universidades, institutos y agencias técnicas de toda América del Sur están siendo dibujados en la misma conversación, con la esperanza de que la región pueda intercambiar ideas tan seriamente como el comercio de bienes."
 mercosur.57.a: "Comparta el conocimiento."
 mercosur.58.t: "Proyecto de intercambio de investigación completado"
 mercosur.58.d: "El último esfuerzo de investigación e intercambio tecnológico ha concluido. Las asociaciones creadas han sobrevivido al proyecto mismo, dejando atrás una red más gruesa de contactos y un sentido más fuerte que el conocimiento sudamericano puede organizarse en lugar de simplemente dispersarse."
 mercosur.58.a: "El conocimiento permanece."
 mercosur.60.t: "Financiación de la Operación Contracartel"
 mercosur.60.d: "UNASUL ha puesto en marcha una operación coordinada contra la influencia de los cárteles. La pregunta que tenemos ante nosotros no es si la amenaza es real, sino cuánto de nuestro propio peso político estamos dispuestos a colocar detrás de una respuesta regional."
 mercosur.60.a: "Autorizar una contribución interinstitucional limitada."
 mercosur.60.b: "Tire el peso completo del estado detrás de la operación."
 mercosur.61.t: "Intensificación de la operación contra el cártel"
 mercosur.61.d: "La mayoría de los gobiernos participantes del UNASUL decidieron apoyarse plenamente en la operación. El resultado no fue un simple gesto, sino un duro golpe regional contra las redes de cárteles, sus patronos y la atmósfera del miedo que les permite soportar."
 mercosur.61.a: "Presiona la ventaja."
 mercosur.62.t: "Operación Counter-Cartel Completed"
 mercosur.62.d: "La operación siguió adelante con un respaldo más medido. Aun así, la presión coordinada desaceleró las redes cárteles y debilitó su espacio para maniobrar, aunque no con la fuerza que podría haber llevado una respuesta más unida."
 mercosur.62.a: "Un paso útil."
 mercosur.75.t: "Invitación a unirse al Pacto de Defensa Único"
 mercosur.75.d: "[FROM.GetName] nos ha invitado al marco de defensa UNASUL. Aceptar significaría más que firmar otro documento; nos colocaría dentro de un entendimiento militar destinado a decir tanto a los vecinos como a los forasteros que América del Sur tiene la intención de mantenerse unidos cuando aumenta la presión."
 mercosur.75.a: "Únete al pacto de defensa."
 mercosur.75.b: "Declin."
 mercosur.76.t: "Invitación del Pacto de Defensa aceptada"
 mercosur.76.d: "[FROM.GetName] ha aceptado nuestra invitación y entrado en el pacto de defensa UNASUL. La alianza sigue siendo joven, pero cada nueva firma le da más credibilidad, más peso y más sentido más allá de la retórica."
 mercosur.76.a: "La alianza crece."
 mercosur.77.t: "Rechazado del Pacto de Defensa"
 mercosur.77.d: "[FROM.GetName] se ha negado a entrar en el pacto de defensa UNASUL por ahora. Para todo el lenguaje de la solidaridad regional, no todos los gobiernos están dispuestos a dejar que la política de defensa se convierta en parte de una historia sudamericana compartida."
 mercosur.77.a: "Unfortunate."
 mercosur.78.t: "Nos unimos al Pacto de Defensa Único"
 mercosur.78.d: "Hemos aceptado la invitación de [FROM.GetName] y hemos entrado en el pacto de defensa UNASUL. Al hacerlo, hemos vinculado nuestra seguridad más estrechamente con un marco continental que pretende convertir la afinidad política en compromiso estratégico."
 mercosur.78.a: "América del Sur está unida."
 mercosur.79.t: "Alineación arancelaria completada"
 mercosur.79.d: "Se han concluido las semanas de negociaciones, el examen jurídico y la labor arancelaria con un posible nuevo miembro. El proceso era técnico en la superficie, pero políticamente importaba por una simple razón: una barrera más entre su mercado y el nuestro se ha hecho más fácil de imaginar como temporal."
 mercosur.80.t: "Modernización de aduanas Completada"
 mercosur.80.d: "Se ha completado el esfuerzo de reforma aduanera para un posible nuevo miembro. Se han aclarado los procedimientos, se han endurecido las rutinas fronterizas y la postura administrativa del Estado se acerca a lo que exige el MERCOSUR."
 mercosur.81.t: "Normas comunes adoptadas"
 mercosur.81.d: "El conjunto de normas comunes para un posible nuevo miembro se ha llevado a cabo hasta su finalización. Las reglas que una vez reflejadas la distancia están siendo reescritas en el lenguaje de la compatibilidad, y su camino hacia el bloque se ve cada vez más real."
 mercosur.82.t: "Proyecto de Corredor Logístico completado"
 mercosur.82.d: "El proyecto de corredor logístico para un posible nuevo miembro ha llegado a su finalización. Lo que se discutió una vez en términos abstractos está empezando a tomar forma en rutas, depósitos y conexiones prácticas que hacen que la adhesión se sienta basada más que ceremonial."
 mercosur.83.t: "Actualizaciones de transporte completadas"
 mercosur.83.d: "Se han completado las últimas obras de transporte vinculadas a un posible paquete de adhesión del nuevo miembro. La distancia no ha desaparecido, pero el mapa ahora se ve un poco más pequeño y la perspectiva de integración un poco menos teórica."
 mercosur.84.t: "Programa de conectividad completado"
 mercosur.84.d: "Se ha completado el programa de conectividad más reciente para un posible nuevo miembro. El tráfico comercial, el contacto administrativo y la coordinación transfronteriza tienen canales más firmes a través de los cuales moverse."
 mercosur.85.t: "Fondos de Desarrollo Desembolsados"
 mercosur.85.d: "El paquete de desarrollo para un posible nuevo miembro se ha entregado plenamente. Más que cualquier compromiso comunicativo y visible en esta escala dice a su gobierno que el MERCOSUR está dispuesto a invertir en la membresía en lugar de simplemente pedir confianza."
 mercosur.86.t: "Inversiones civiles completadas"
 mercosur.86.d: "Se ha completado la fase de inversión civil de un posible paquete de adhesión del nuevo miembro. Los talleres, las empresas y los distritos comerciales tienen ahora una razón más clara para ver la integración regional como algo concreto, no meramente diplomático."
 mercosur.87.t: "Actualización de la infraestructura"
 mercosur.87.d: "El programa de mejora de infraestructura para un posible nuevo miembro ha concluido. Cada proyecto terminado deja atrás el mismo mensaje político: la adhesión no es sólo una firma, sino una reorientación de cómo el país está conectado a la región en general."
 mercosur.88.t: "Infraestructura comercial Ampliada"
 mercosur.88.d: "Se ha completado el proyecto de infraestructura comercial para un posible nuevo miembro. La promesa del MERCOSUR ahora no sólo aparece en discursos, sino en corredores más bulliciosos, mejores instalaciones y un sentido más claro de dependencia mutua."
 mercosur.89.t: "Acuerdo de Inversión Industrial"
 mercosur.89.d: "El acuerdo de inversión industrial con un futuro nuevo miembro ha entrado en vigor. Lo que había sido un entendimiento diplomático se está convirtiendo en una relación económica con profundidad, expectativas e intereses lo suficientemente poderosos para sobrevivir a la ceremonia."
 mercosur.90.t: "Establecimiento de un marco de inversión comercial"
 mercosur.90.d: "Se ha establecido el marco de inversión comercial con un posible nuevo miembro. Los bancos, las empresas y los ministerios tienen ahora un puente más robusto entre ellos, y con él un incentivo más fuerte para tratar la adhesión como una apuesta compartida en lugar de un gesto simbólico."
 mercosur.91.t: "Paquete de Cooperación Financiera"
 mercosur.91.d: "Se ha entregado el conjunto de medidas de cooperación financiera para un posible nuevo miembro. Con esta pieza final en su lugar, el esfuerzo de adhesión ya no parece provisional; tiene la sensación de que un país está constantemente arrastrado al círculo interior del bloque."
 mercosur.108.t: "Inicio de la Ronda del Fondo para el Desarrollo MERCOSUR"
 mercosur.108.d: "Se ha puesto en marcha una nueva ronda del Fondo para el Desarrollo del MERCOSUR. Ministerios, empresas y autoridades locales en todo el bloque lo leerán como más que una entrada de libro mayor: prueba de que la integración todavía lleva dinero, planificación e institucionalidad detrás de ella. Una vez más, la promesa del desarrollo pasa de papel al campo."
 mercosur.108.a: "Deja que los fondos empiecen a moverse."
 mercosur.accession_project_complete.a: "Proceda."
 mercosur.93.t: "Membresía completa aceptada"
 mercosur.93.d: "[FROM.GetName] ha aceptado nuestra oferta e ingresado al MERCOSUR de inmediato como miembro completo. No habrá una larga etapa de transición, ni un cortejo cuidadosamente escenificado, sólo el repentino hecho político del bloque creciendo hoy en día."
 mercosur.93.a: "Excelente."
 mercosur.94.t: "Nos unimos a MERCOSUR"
 mercosur.94.d: "Nuestro curso ha sido establecido, y MERCOSUR ya no es un foro más allá de nuestro alcance sino una estructura que habitamos desde dentro. La vieja ambigüedad acerca de dónde estamos en el orden regional está dando paso a un hecho más difícil: estamos dentro del bloque, y el continente tendrá que ajustarse a esa realidad."
 mercosur.94.a: "Nos unimos al bloque."
 mercosur.105.t: "Estado asociado otorgado"
 mercosur.105.d: "Nuestra petición nos ha llevado al MERCOSUR como estado asociado. Esta no es todavía la cámara más interior del bloque, pero es suficiente para demostrar que nuestro horizonte político y económico ahora se está inclinando hacia la integración sudamericana en lugar de alejarse de ella."
 mercosur.105.a: "Nos acercamos."
 mercosur.107.t: "Solicitudes UNASUL aprobadas"
 mercosur.107.d: "Nuestra petición nos ha llevado a UNASUL. Sin embargo, incierto el futuro de la integración sudamericana puede permanecer, hemos elegido no mirar el experimento desde lejos, sino entrarlo y ocupar nuestro lugar dentro del marco que se está construyendo ahora."
 mercosur.107.a: "Nos unimos al proyecto."
 mercosur_news.1.t: "El Establecimiento del UNASUL"
 mercosur_news.1.d: "Las naciones de América del Sur han anunciado el establecimiento del UNASUL como organización regional permanente destinada a unir el diálogo político, el desarrollo de la infraestructura y la cooperación social en un marco único. Con este paso, la unidad sudamericana entra en una nueva etapa, y la coordinación regional puede volverse más institucional y duradera. Sin embargo, si este proyecto realmente tendrá éxito depende de que sus miembros puedan superar sus diferentes intereses nacionales."
 mercosur_news.1.a: "Una nueva etapa para América del Sur"
 mercosur_news.2.t: "UNASUL Forma un Pacto Conjunto de Defensa"
 mercosur_news.2.d: "UNASUL ha ido más allá de la coordinación económica y política y anunció la formación de un nuevo pacto de defensa sudamericana. Los partidarios lo describen como una extensión natural de la unidad regional, mientras que los escépticos advierten que el continente está entrando en una fase más asertiva y potencialmente divisiva de la política bloc."
 mercosur_news.2.a: "América del Sur cierra filas."
 mercosur_news.3.t: "Un miembro se aleja del UNASUL"
 mercosur_news.3.d: "[ROOT.GetNameWithFlag] ha anunciado su salida del Mecanismo Conjunto de Defensa UNASUL, reabriendo dudas que muchos creían habían sido sellados cuando América del Sur dibujó primero sus líneas defensivas. Los partidarios del retiro lo describen como un retorno a la libertad de acción soberana; los críticos lo ven como el primer grieta visible en un pacto que dependía tanto de la confianza política como de las firmas formales. Si esto demuestra ser una inversión aislada o el comienzo de un desentrañamiento más amplio se observará ahora en todo el continente."
 mercosur_news.3.a: "El pacto ya no parece irrompible."
 UNASUL_faction: "Pacto de Defensa Único"
 UNASUL_faction_DEF: "el Pacto de Defensa Único"
 MER_invite_to_unasul_TT: "§YLa tasa de aceptación está determinada por la opinión de ese país sobre usted, su influencia sobre ella y el progreso del árbol UNASUL!§!"
 MER_request_mercosur_associate_membership_tt: "§YEnviar una petición formal. Cuando termine el período de revisión, nos uniremos al MERCOSUR como Estado asociado.§!"
 MER_request_mercosur_full_membership_tt: "§YEnviar una petición formal. Cuando termine el período de revisión, entraremos en MERCOSUR como miembro completo.§!"
 MER_request_unasul_membership_tt: "§YEnviar una petición formal. Cuando termine el período de examen, nos uniremos a UNASUL.§!"
 MER_unasul_member_tt: "Aplique los siguientes modificadores a §YEl Estado Miembro de la UNUNASUL§! para todos los países miembros."
 BRA_unasul_events_TT: "§YEnviad invitaciones a todos los Estados miembros del MERCOSUR para que se unan al UNASUL!§!"
 MER_expansion_unasul_TT: "§GDesbloquear§! decisiones para invitar a los países sudamericanos a §YUNASUL§!!"
 mercosur.110.t: "Revisión de la cláusula democrática del MERCOSUR"
 mercosur.110.d: "Lo que se ha desarrollado en [FROM.GetName] ya no puede ser descartado como un asunto doméstico con sólo significado interno. Un giro político grave ha puesto en duda si la competencia abierta y la moderación constitucional siguen cobrando peso en ese país. En torno al bloque, ministros y diplomáticos están preguntando abiertamente si la cláusula democrática del MERCOSUR es un compromiso serio o simplemente un lenguaje ceremonial. Debemos decidir si [FROM.GetName] debe suspenderse, o si el bloque tolerará este giro en aras de mantener intacto el mercado sudamericano."
 mercosur.110.a: "La cláusula debe ser aplicada."
 mercosur.110.b: "Concédele un último repelente."
 mercosur.112.t: "MERCOSUR suspende nuestro estado"
 mercosur.112.d: "El veredicto del bloque ha llegado, y es inconfundible. MERCOSUR ha juzgado que nuestro último curso cruzó la línea establecida por su cláusula democrática, y el precio está siendo recogido en nuestro lugar dentro de la institución. América del Sur no nos ha dado la espalda para siempre, pero ha elegido marcar este momento como uno que no podría pasar sin respuesta."
 mercosur.112.a: "Las consecuencias son reales."
 mercosur.113.t: "MERCOSUR concede un arrepentido condicional"
 mercosur.113.d: "MERCOSUR ha optado por no suspendernos directamente, pero tampoco ha ofrecido la absolución. Permanecemos dentro del bloque bajo una nube visible de desconfianza, y cada capital de la región comprenderá que nuestro lugar continuado en el mercado sudamericano ahora descansa sobre la libertad condicional en vez de confianza."
 mercosur.113.a: "Quedamos bajo escrutinio."
 mercosur.114.t: "MERCOSUR Suspende a un Miembro"
 mercosur.114.d: "Después de un grave giro político [FROM.GetName], el debate dentro del MERCOSUR ha terminado con una dura decisión. El bloque ha invocado su cláusula democrática y suspendido la posición de [FROM.GetName], señalando que el mercado sudamericano todavía está dispuesto a defender los términos políticos en los que afirma descansar."
 mercosur.114.a: "El bloque dibuja una línea."
 mercosur.115.t: "MERCOSUR Mantiene la puerta Ajar"
 mercosur.115.d: "Tras un grave cambio político en [FROM.GetName], el MERCOSUR ha dejado de suspenderse, pero la decisión no fue aval. El bloque optó por preservar la unidad por ahora, al tiempo que puso [FROM.GetName] bajo una advertencia visible, asegurando que la cuestión de la legitimidad democrática siga sosteniendo su lugar en la institución."
 mercosur.115.a: "Un repelente estrecho."
 mercosur.117.t: "Revisión de la Cláusula Democrática UNASUL"
 mercosur.117.d: "Los últimos acontecimientos en [FROM.GetName] se han extendido mucho más allá del argumento interno de una capital. Un giro político grave ha planteado dudas en todo el continente acerca de si la vida democrática en ese país está siendo estrechada por la fuerza o el diseño. En todo el UNASUL, la cuestión es ahora si se construyó la organización para defender los compromisos democráticos o sólo hablar de ellos cuando sea conveniente. Debemos elegir si [FROM.GetName] debe suspenderse del marco sudamericano, o si el proyecto se sirve mejor manteniendolo dentro bajo aviso."
 mercosur.117.a: "Suspendiéndolos del marco."
 mercosur.117.b: "Mantenlos dentro, pero bajo censura."
 mercosur.119.t: "UNASUL suspende nuestro estado"
 mercosur.119.d: "UNASUL ha pronunciado su juicio, y el mensaje es una distancia en lugar de solidaridad. La organización ha llegado a la conclusión de que nuestro curso reciente no puede conciliarse con su cláusula democrática, y nuestro lugar dentro del marco sudamericano se ha suspendido en consecuencia. Lo que se pretendía simbolizar la convergencia continental se ha convertido en un recordatorio de que la legitimidad regional todavía tiene límites."
 mercosur.119.a: "El golpe aterriza."
 mercosur.120.t: "UNASUL nos deja en libertad condicional"
 mercosur.120.d: "UNASUL ha optado por no suspendernos directamente, pero la decisión ofrece poca comodidad. Quedamos dentro del marco sólo bajo la censura visible, y las capitales de América del Sur leerán esa elección como una advertencia de que nuestro lugar en el proyecto es ahora condicional más que confiable."
 mercosur.120.a: "Una estancia, no una absolución."
 mercosur.121.t: "UNASUL Suspende a un Miembro"
 mercosur.121.d: "Después de revisar el grave giro político [FROM.GetName], UNASUL ha optado por invocar su cláusula democrática y suspender la posición de ese país en la organización. La decisión subraya que la unidad sudamericana sigue reivindicando una base política, y que algunas infracciones son lo suficientemente severas como para forzar la cuestión a abrirse."
 mercosur.121.a: "El marco se endurece."
 mercosur.122.t: "UNASUL concede a un arrepentido"
 mercosur.122.d: "Después de un grave giro político [FROM.GetName], UNASUL ha decidido no suspender el país por ahora. Aun así, el resultado está lejos de un respaldo limpio: la organización eligió la unidad sobre la ruptura, al tiempo que dejó claro que el lugar de [FROM.GetName] en el proyecto sudamericano permanecerá bajo sospecha."
 mercosur.122.a: "La advertencia está en pie."
