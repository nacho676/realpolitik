 MER_MEX_industrial_investment_agreement: "Acuerdo de inversión industrial con México"
 MER_MEX_industrial_investment_agreement_desc: "Financiar el pilar industrial del paquete de adhesión de México mediante un gran acuerdo de inversión centrado en su capital.$MER_full_membership_step_one_desc$"
 MER_MEX_commercial_investment_framework: "Marco de inversión comercial con México"
 MER_MEX_commercial_investment_framework_desc: "Establecer un marco más amplio de inversión comercial con México, que refuerce la base institucional y económica para la membresía plena.$MER_full_membership_step_two_desc$"
 MER_MEX_financial_cooperation_package: "Paquete de cooperación financiera para México"
 MER_MEX_financial_cooperation_package_desc: "Entregar el paquete final de cooperación financiera con México, que combina inversión comercial y digital antes de completar la adhesión.$MER_full_membership_step_three_desc$"
 MER_launch_corridor_investment_round: "Inicie una ronda de inversiones del Corredor MERCOSUR"
 MER_launch_corridor_investment_round_desc: "Un bloque más fuerte no puede existir sólo en papel. Al liberar una nueva ronda de financiación de corredores respaldados por el tesoro, podemos acelerar la integración de infraestructura e red en todos los miembros actuales del MERCOSUR, mejorando la columna vertebral física del bloque."
 MER_release_development_fund_round: "Liberar una ronda del Fondo de Desarrollo del MERCOSUR"
 MER_release_development_fund_round_desc: "Las promesas de integración son más convincentes cuando las respalda una inversión visible. Al desembolsar una nueva ronda del Fondo de Desarrollo del MERCOSUR, podemos acelerar la construcción civil y la expansión de oficinas en todo el bloque y reforzar los cimientos económicos de sus miembros plenos."
