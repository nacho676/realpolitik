l_spanish:
 BRA_education_integration: "Integración educativa"
 BRA_education_integration_desc: "Un mercado compartido es más fuerte cuando sus estados miembros comienzan a coordinar la forma en que capacitan a las futuras generaciones. La cooperación educativa, el reconocimiento mutuo y el intercambio académico contribuirán a crear un bloque que no solo esté vinculado económicamente, sino que también sea institucionalmente compatible."
 BRA_mercosur_market: "Mercado del Mercosur"
 BRA_mercosur_market_desc: "Una vez sentadas las bases institucionales, el MERCOSUR podrá ir más allá de la coordinación limitada y avanzar hacia algo más ambicioso: un mercado con vínculos comerciales más profundos, flujos de inversión más amplios y una mayor influencia económica interna. Es aquí donde el bloque comienza a sentirse poderoso."
 BRA_inv_assoc: "Invitar a los Estados Asociados"
 BRA_inv_assoc_desc: "Mantenemos una estrecha relación con los Estados asociados del MERCOSUR. Para fortalecer aún más estas relaciones y brindarles a sus economías la oportunidad de crecer, deberíamos invitarlos a unirse al MERCOSUR y convertirlos en miembros orgullosos del mismo."
 BRA_maintain_quo: "Consolidar el MERCOSUR"
 BRA_maintain_quo_desc: "La expansión no siempre se traduce en fortaleza. Un bloque que crece demasiado rápido sin consolidar sus bases corre el riesgo de hacerse más grande, pero más débil. Debemos centrarnos en fortalecer la cohesión, la eficacia y la estabilidad interna de los miembros que ya tenemos."
 BRA_expand_to_latin_america: "Expansión por toda Latinoamérica"
 BRA_expand_to_latin_america_desc: "El MERCOSUR no debería permanecer confinado a su círculo actual si el resto del continente aún puede ser atraído a su órbita. Con instituciones más sólidas y un modelo económico más atractivo, ahora podemos mirar más allá del Cono Sur y extender nuestra influencia por toda América Latina."
 BRA_americas_unity: "Cumbre Sudamericana"
 BRA_americas_unity_desc: "Sudamérica ha estado demasiado tiempo dividida entre prioridades nacionales, oportunidades perdidas y proyectos regionales a medio terminar. Convocaremos una Cumbre Sudamericana para relanzar la cooperación en todo el continente, revitalizar el MERCOSUR y posicionarnos en el centro de una nueva iniciativa regional. Para que la integración tenga éxito, debe comenzar con el liderazgo."
 BRA_americas_unity_TT: "El país que tome esto gana un §Ymodificador de opinión§! de §G+15§! con los demás §Ypaíses sudamericanos§!."
 BRA_mercosur: "MERCOSUR"
 BRA_mercosur_desc: "El MERCOSUR ofrece más que un acuerdo aduanero. Ofrece una base para una Sudamérica más fuerte y coordinada, construida sobre el comercio, normas compartidas y la expansión gradual de la influencia regional. Si pretendemos liderar el continente, este es el punto de partida."
 BRA_trade_agreement: "Acuerdos comerciales"
 BRA_trade_agreement_desc: "Un bloque regional no puede sobrevivir solo en el simbolismo. Debe reducir las barreras, alinear las expectativas comerciales y crear beneficios económicos visibles para sus miembros. Mediante el fortalecimiento de los acuerdos comerciales dentro del MERCOSUR, podemos convertir la retórica política en integración práctica."
 BRA_discuss_currency: "Ampliación de la liquidación de divisas locales"
 BRA_discuss_currency_desc: "Para reducir la dependencia excesiva del dólar y hacer que el comercio intrabloqueo sea más estable y flexible, deberíamos ampliar el uso de la liquidación monetaria local entre los Estados miembros. Los costos de cambio más bajos y una mayor coordinación financiera serán un paso importante hacia una economía regional más autónoma."
 BRA_people_goods: "Movimiento libre de personas y bienes"
 BRA_people_goods_desc: "El comercio por sí solo no completa la integración. Sólo cuando los trabajadores, estudiantes, empresarios y familias puedan cruzar las fronteras con mayor libertad el MERCOSUR se convertirá en más que un mercado. Se convertirá en un espacio regional donde la gente vive, trabaja y construye vínculos duraderos."
 BRA_assoc_members: "Formalizar el Camino de Adhesión"
 BRA_assoc_members_desc: "El estatus asociado es útil, pero deja el orden regional sin terminar. Si el MERCOSUR se convierte en un verdadero bloque político y económico, debemos crear una vía formal de adhesión que permita a los Estados vecinos pasar de la asociación floja a la membresía plena."
 MER_secretariat_reform: "Reforma de la Secretaría del MERCOSUR"
 MER_secretariat_reform_desc: "Un bloque más grande no puede ser gestionado por la diplomacia improvisada para siempre. Si los nuevos miembros confían en el MERCOSUR como institución seria, debe fortalecerse su núcleo administrativo. Una secretaría más capaz hará que la adhesión, la coordinación y la gestión de controversias sean mucho más creíbles."
 MER_infrastructure_corridor_program: "Programa de Corredor de Infraestructura"
 MER_infrastructure_corridor_program_desc: "La integración regional no tiene sentido si las carreteras terminan en las fronteras y la logística colapsa en el interior. El MERCOSUR debe estar conectado no sólo por acuerdos, sino por infraestructura que mueve bienes, capitales y personas en todo el continente. Un bloque más fuerte debe ser construido físicamente, no sólo declarado."
 MER_development_fund: "Fondo de desarrollo del MERCOSUR"
 MER_development_fund_desc: "Algunos estados no serán persuadidos por promesas solas. Únicamente se unirán si la integración trae desarrollo visible y inversión real. Mediante el establecimiento de un Fondo para el Desarrollo del MERCOSUR, podemos convertir la adhesión en oportunidades y hacer que la composición sea materialmente atractiva."
 mercosur_member_state_modifier: "Estado miembro del Mercosur"
 mercosur_member_state_modifier_desc: "El MERCOSUR comenzó como un marco aduanero y político centrado en Brasil, Argentina, Uruguay y Paraguay, y posteriormente ampliado a través de América del Sur mediante asociaciones asociadas. La participación en el bloque vincula nuestro futuro con un proyecto regional más amplio de comercio, coordinación y desarrollo compartido.\n\n§YEste espíritu nacional crece más fuerte a medida que se unen más miembros asociados y miembros completos§!"
 MER_development_fund_round_modifier: "Desembolso del Fondo de Desarrollo MERCOSUR"
 MER_development_fund_round_modifier_desc: "En la actualidad, el Fondo para el Desarrollo del MERCOSUR está subescribiendo nuevas construcciones civiles y de oficinas en todo el bloque. Mientras continúe esta ronda de desembolsos, se están impulsando proyectos de desarrollo económico a un ritmo acelerado."
 MER_mercosur_diplomacy: "Integración sudamericana"
 MER_mercosur_diplomacy_desc: "El MERCOSUR es un marco para ampliar el comercio y reforzar los lazos de mercado regionales, mientras que UNASUR es una visión más amplia de cooperación sudamericana que llega al diálogo político, la infraestructura y la seguridad. A través de estos marcos puede fortalecerse la unidad sudamericana y avanzar más la integración regional.\n\n§Y¡Los espíritus nacionales del MERCOSUR y de UNASUR se fortalecen con cada nuevo Estado miembro!§!"
 MER_invite_CHL_full_member: "Invitar a Chile como miembro de pleno derecho"
 MER_invite_CHL_full_member_desc: "Iniciar negociaciones para elevar a Chile de Estado asociado a miembro de pleno derecho del MERCOSUR.$MER_full_membership_acceptance_hint_desc$$MER_full_membership_invite_process_desc$"
 MER_invite_PRU_associate: "Invitar a Perú como Estado asociado"
 MER_invite_PRU_associate_desc: "Abrir conversaciones formales con Perú sobre su ingreso al MERCOSUR como Estado asociado.\n\n§Y¡La tasa de aceptación depende de la opinión de ese país sobre ti, de tu influencia sobre él y del progreso del árbol del MERCOSUR!§!"
