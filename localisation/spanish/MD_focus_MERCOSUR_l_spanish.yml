 MER_PAN_port_transport: "Fortalecer el transporte portuario para Panamá"
 MER_PAN_port_transport_desc: "Apoyar las actualizaciones de transporte portuario en Panamá para mejorar el movimiento de mercancías entre los mercados MERCOSUR.$MER_full_membership_step_two_desc$"
 MER_PAN_trade_connectivity: "Mejorar la conectividad comercial de Panamá"
