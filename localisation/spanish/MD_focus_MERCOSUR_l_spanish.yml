 MER_PRU_logistics_corridor: "Desarrollar un corredor logístico para Perú"
 MER_PRU_logistics_corridor_desc: "Financiar la primera etapa de un corredor logístico en la capital de Perú para preparar al país para una integración más profunda con el MERCOSUR.$MER_full_membership_step_one_desc$"
 MER_PRU_cross_border_transport: "Mejorar el transporte transfronterizo con Perú"
 MER_PRU_cross_border_transport_desc: "Ampliar los enlaces de transporte terrestre con Perú y reforzar la infraestructura necesaria para la adhesión.$MER_full_membership_step_two_desc$"
 MER_PRU_port_connectivity: "Fortalecer la conectividad portuaria para Perú"
 MER_PRU_port_connectivity_desc: "Invertir en conectividad digital y logística en la capital de Perú para apoyar un mercado regional más integrado.$MER_full_membership_step_three_desc$"
 MER_BOL_logistics_corridor: "Desarrollar un corredor logístico para Bolivia"
