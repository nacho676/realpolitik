 MER_unasul_democratic_clause_probation_tt: "§YMantenga a este país dentro de UNASUL bajo libertad condicional.§! Reduzca la estabilidad otorgada por el Estado miembro de §YUNASUL§! por §R5%§! para todos los miembros actuales y futuros del UNASUL."
