l_spanish:
 VERSION_MD: "Millennium Dawn v2.0.0 DEV\n§YRealpolitik v0.1.0 activado§!"
 VERSION_MD_LOADING: "Versión: v2.0.0 DEV · Realpolitik v0.1.0"

 # Traducciones de textos de Millennium Dawn que estaban en inglés.
 COVID_pandemic_origin: "Origen de la pandemia de COVID-19"
 COVID_pandemic_origin_desc: "Como punto de origen de la pandemia de COVID-19, nuestro país sufre un golpe económico muy duro y el escrutinio internacional. Los hospitales están desbordados y la producción industrial se desplomó."
 COVID_pandemic_impact: "Pandemia de COVID-19"
 COVID_pandemic_impact_desc: "La pandemia de COVID-19 alteró la vida diaria y la actividad económica. Las cuarentenas y las medidas sanitarias son necesarias, pero tienen un costo económico enorme."
 COVID_supply_chain_disruption: "Crisis mundial de las cadenas de suministro"
 COVID_supply_chain_disruption_desc: "La pandemia rompió las cadenas de suministro mundiales. La escasez de componentes y materias primas frena la construcción y la producción industrial en todos los sectores."
 COVID_events.0.t: "Un virus nuevo"
 COVID_events.0.d: "Un virus nuevo apareció en Wuhan. Varios médicos informan de una enfermedad respiratoria que se propaga rápido entre la población local. Los casos pasaron de unos pocos a decenas en menos de una semana."
 COVID_events.0.a: "Hay que vigilarlo de cerca."
 COVID_events.1.t: "Médicos que dan la alarma"
 COVID_events.1.d: "Varios médicos empezaron a compartir informes sobre el virus nuevo en las redes sociales y lo comparan con el SARS. Las autoridades locales piden instrucciones. Podemos silenciar los informes para evitar el pánico, o dejar que circulen y arriesgarnos a la alarma pública."
 COVID_events.1.a: "Silenciarlos."
 COVID_events.1.b: "Que se sepa la verdad."
 COVID_events.2.t: "Pandemia confirmada"
 COVID_events.2.d: "La Organización Mundial de la Salud declaró al nuevo coronavirus una emergencia sanitaria mundial. Los hospitales están desbordados y el virus ya cruzó nuestras fronteras. Esto va a transformar nuestra economía durante años."
 COVID_events.2.a: "Prepararse para el golpe."
 COVID_events.3.t: "Aparece el COVID-19"
 COVID_events.3.d1: "Un nuevo coronavirus mortal se propagó desde China, donde las autoridades al principio ocultaron los informes del brote. La respuesta tardía permitió que el virus cruzara las fronteras sin control."
 COVID_events.3.d2: "Un nuevo coronavirus mortal surgido en China fue declarado pandemia mundial. A pesar de las advertencias tempranas de los médicos chinos, el virus se propagó rápido por todo el mundo."
 COVID_events.3.a: "Preparar nuestra respuesta."
 COVID_events.4.t: "La pandemia llega a [This.GetName]"
 COVID_events.4.d: "Se confirmaron casos de COVID-19 dentro de nuestras fronteras. Los hospitales se preparan para una ola de pacientes y el miedo crece. La actividad económica se paraliza mientras la gente se aísla."
 COVID_events.4.a: "Cerrar todo."
 COVID_events.5.t: "Colapso de las cadenas de suministro mundiales"
 COVID_events.5.d: "La pandemia devastó el comercio internacional. Los cierres de fábricas y puertos y los cuellos de botella en el transporte provocaron una escasez grave de componentes y materias primas en todo el mundo."
 COVID_events.5.a: "Acaparar lo que quede."
 systems.1.d: "¡Bienvenido a Millennium Dawn! Gracias por descargar y jugar el mod. Si eres nuevo, te recomendamos explorar los distintos menús para familiarizarte con sus funciones. Los menús suelen abrirse con los botones de la parte superior de cada pantalla. ¿Necesitas ayuda? Únete a nuestra comunidad de Discord, donde te ayudaremos con cualquier duda o problema. Puedes informar errores desde el juego con \"Report An Issue\" en el menú de pausa o en nuestros canales de Discord.\n\nInformación importante:\n- El combustible es negativo al empezar la partida por el consumo de las centrales eléctricas y de la población. Revisa la interfaz de Energía en el menú de Construcción para más detalles.\n- Enfoque histórico no es igual a resultado histórico. Usamos la opción de enfoques históricos para que la IA tome las decisiones más históricas posibles entre las opciones disponibles. No garantiza una partida histórica."
 SOV_economy_category_desc: "[SOV.GetFlag]§YLa economía de [SOV.GetAdjectiveCap]§! atraviesa tiempos difíciles. No solo debemos revivir el legado del pasado, sino también entrar en el grupo de los líderes económicos mundiales.\n\nPara quitar el espíritu nacional §RConsecuencias económicas§! hay que §Gcompletar§! enfoques de la §YRama económica§!. Cuanta más £text_icon_sov_ruble §YRecuperación económica§! tengamos, más rápido §Gquitaremos§! este §Rcastigo§!.\n\n£text_icon_sov_ruble §YCapitalización§!: las mayores empresas de [SOV.GetFlag]§YRusia§! tienen una £text_icon_sov_ruble §YCapitalización§! que se muestra en su panel. Cambia constantemente por muchas causas: la compra de activos nuevos en Rusia y en el extranjero, la corrupción alta o baja, la guerra, el crecimiento económico, etc.\n\nSi los §RComunistas§! están en el §YPoder§!, la £text_icon_sov_ruble §YCapitalización§! deja de actualizarse.\nSi los §2Oligarcas§! están en el §YPoder§!, la £text_icon_sov_ruble §YCapitalización§! de las empresas se §Rreduce§! mucho.\n\n£text_icon_sov_ruble §YRecuperación económica§!: §Y[?SOV.SOV_economic|0]§!\n\n[SOV_MoexStatus_loc][SOV_CapGazprom_loc][SOV_CapRosneft_loc][SOV_CapSberbank_loc][SOV_CapVtb_loc][SOV_CapMts_loc][SOV_CapAlrosa_loc][SOV_SphereIntegration_loc]"
 PRODUCTION_MATERIALS_URANIUM: "Uranio"
 FACILITY_BUILDINGS: "Proyectos especiales"

 md_closed_economy: "Economía Proteccionista"
 md_closed_economy_desc: "Una economía proteccionista se cierra casi por completo al mundo: aranceles altos, cuotas y licencias de exportación. El país depende de sí mismo tanto como puede, pero todavía vende una pequeña parte de sus recursos (10%) al mercado mundial."

 # Ventana "Sistemas internacionales": Realpolitik suma la pestaña de tratados.
 MISSILES_BUTTON_TT_DELAYED: "Gestiona tu nación en el escenario mundial. Interactúa con tu §YPrograma espacial§! y tu §YRed de satélites§!, gestiona §YOperaciones antiterroristas§!, realiza §YGuerra cibernética§!, contrata §YContratistas militares privados§!, interactúa con las §BNaciones Unidas§!, desarrolla tu propia §CEstación de investigación antártica§! y firma o abandona §YTratados internacionales§!."
 RESEARCH_FOLDER_TAB_CYCLE_TOOLTIP: "£GFX_tab : pasar a la pestaña siguiente.\n£GFX_shift + £GFX_tab: pasar a la pestaña anterior."
