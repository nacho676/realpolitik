l_spanish:
 industrial_complex: "Industria Civil"
 industrial_complex_plural: "Industrias Civiles"
 industrial_complex_desc: "Este edificio proporciona al estado una industria para la producción de bienes civiles o la construcción de nuevos edificios. Puede convertirse en industria militar si es necesario.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos:§Y206K§!\nProducto del PIB base por §Yindustria civil§!: $§Y17.5B§!\nConsumo básico de energía: §R-0.5§! GW\n"
 arms_factory: "Industria Militar"
 arms_factory_plural: "Industrias Militares"
 arms_factory_desc: "Este edificio proporciona al estado una industria para la producción de nuevo equipamiento militar. Puede convertirse en industria civil si es necesario.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos:§Y18.8K§!\nProducto del PIB base por §Yindustria militar§!: $§Y1.5B§!\nConsumo básico de energía: §R-0.5§! GW"
 internet_station: "Infraestructura de Red"
 internet_station_plural: "Infraestructura de Red"
 internet_station_desc: "Las §YInfraestructuras de Red§! son estructuras altas utilizadas en los campos de las telecomunicaciones y las comunicaciones por radio para transmitir señales a largas distancias o a través de cables de fibra óptica subterráneos y sistemas de computación en la nube.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y12 mil§!\nProducto base del PIB por §YInfraestructura de red§!: $§Y3.5 billones§!\n\nCada nivel de §YInfraestructura de Red§! mejora la velocidad de construcción local en §G+5.00%§!.\nCada nivel de §YInfraestructura de red§! reduce la duración de §YInversiones internacionales§! en §G-5,00%§!.\n\nNúmero base de trabajadores requeridos por nivel: §Y12K§!\nConsumo base de energía por nivel: §R-0.06§! GW"
 dockyard: "Astillero Naval"
 dockyard_plural: "Astilleros Navales"
 dockyard_desc: "Los §Yastilleros navales§! son representativos de la capacidad de un estado para producir embarcaciones militares de todo tipo, desde lanchas §Ypatrulleras§!, §Yconvoyes§!, §Ydestructores§!, §Yportaaviones§! y más.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos:§Y18.8K§!\nProducto del PIB base por §YPatio Naval§!: $§Y1.5B§!\nConsumo básico de energía: §R-0.5§! GW"
 air_base_desc: "Una §YBase Aérea§! es una instalación de almacenamiento y un complejo militar para el despliegue y preparación de sus fuerzas aéreas. Se puede apilar hasta el nivel diez añadiendo una capacidad adicional de §Y50§! aviones por nivel.\n\nNúmero base de trabajadores requeridos por nivel: §Y200§!\nConsumo base de energía por nivel: §R-0.012§! GW"
 radar_station_desc: "Las §YEstaciones de Radar§! te permiten obtener información sobre las tropas enemigas en estados cercanos. Está compuesta por varios radares y sensores, así como activos de inteligencia y capacidad para analizar la situación en evolución.\nUn nivel más alto aumentará su alcance efectivo.\nSus radares también proporcionan al estado una mejor detección de las fuerzas aéreas enemigas, lo que aumenta las posibilidades de que tus aviones las enfrenten.\nAdemás, los radares aumentan la detección de flotas enemigas en el mar.\n\nNúmero base de trabajadores requeridos por nivel: §Y150§!\nConsumo base de energía por nivel: §R-0.006§! GW"
 anti_air_building: "Sitios de SHORAD"
 anti_air_building_plural: "Sitios de SHORAD"
 anti_air_building_desc: "Los §YSitios SHORAD§! (Short Range Air Defense) son complejos y grupos de armas y tácticas antiaéreas que se encargan de la defensa aérea contra amenazas aéreas de baja altitud. Estos sitios trabajan juntos para dividir el espacio aéreo en áreas defendibles, proporcionando objetivos militares locales y cobertura aérea de infraestructura desde helicópteros hasta aviones de bajo vuelo y jets.\n\nNúmero base de trabajadores requeridos por nivel: §Y200§!\nConsumo base de energía por nivel: §R-0.003§! GW"
 nuclear_reactor_desc: "Este edificio convierte la energía nuclear en energía eléctrica, consumiendo uranio moderadamente enriquecido en el proceso.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y115K§!\nProducto básico del PIB por §Y Reactor Núclear§!: $§Y4 billón§!\nGanancia de energía base: §G+5§! GW\n"
 synthetic_refinery_desc: "Este edificio proporciona al estado una industria para la producción de caucho sintético y capacidad adicional para la producción de combustible.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y245K§!\nProducción base del PIB por §YRefinería Sintética§!: $§Y10 mil millones§!\nConsumo base de energía: §R-0.2§! GW\n\nProduce §YGoma§! a precios de mercado estándar, con excedentes que generan ingresos en efectivo además del impuesto corporativo.\n"
 fuel_silo: "Reservas de Recursos Estratégicos"
 fuel_silo_plural: "Reservas de Recursos Estratégicos"
 fuel_silo_desc: "La §YReserva de Recursos Estratégicos§! es una combinación de almacenes, almacenamiento en seco y otros tipos de almacenamiento de §YCombustible§!. Este edificio proporciona a tu nación más espacio para almacenar §HCombustible§! y §HRecursos§!.\n\nNOTA: El §YAlmacenamiento de Recursos§! tiene una limitación de motor, por lo que si estás en §Y$export_economy$§! o §Y$globalized_trade_economy$§!, podrías terminar enviando más recursos para exportar que a tus líneas de producción. Si necesitas empezar a retirar recursos del almacenamiento, se recomienda cambiar a §Y$mixed_economy$§! o inferior.\n\n\nNúmero base de trabajadores requeridos por nivel: §Y400§!"
 offices: "Sector de Oficinas"
 offices_plural: "Sectores de Oficinas"
 offices_desc: "El §Ysector de oficinas§! representa todas las demás industrias de la economía más allá de la extracción y las industrias pesadas. Esto incluye servicios financieros, atención al cliente, tecnología de la información, servicios minoristas y mucho más.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos:§Y473K§!\nProducto del PIB base por §Ysector de oficinas§!: $§Y50B§!\nConsumo básico de energía: §R-0.25§! GW"
 rail_way_plural: "Vías Férreas"
 fossil_powerplant: "Central eléctrica de combustibles fósiles"
 fossil_powerplant_plural: "Central eléctrica de combustibles fósiles"
 fossil_powerplant_desc: "§YCentrales eléctricas de combustibles fósiles§! es un comodín para todas las fuentes de energía termoeléctrica de origen fósil. Estos incluyen, entre otros; carbón, gas natural y petróleo.Las §Ycentrales eléctricas de combustibles fósiles§! quedarán inactivas si la generación de energía es mayor que el consumo.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y7.5K§!\nProducto base del PIB por §Ycentral eléctrica de combustibles fósiles§!: $§Y1.7 Billion§!\nGanancia de potencia base: §G+2§! GW\n"
 fossil_powerplant_amount: "$VALUE|Y0=$"
 fossil_powerplant_resource: "£resources_strip|$FRAME$"
 agriculture_district: "Distrito agroindustrial"
 agriculture_district_plural: "Distritos agroindustriales"
 agriculture_district_desc: "Los §Ydistritos agroindustriales§! reúnen la industria que transforma la cosecha en comida: molinos harineros, frigoríficos, plantas de alimentos, aceiteras, silos de cereales y plantas de biocombustible.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos:§Y75K§!\nProducto del PIB base por §Ydistrito agroindustrial§!: $§Y4B§!\nConsumo básico de energía: §R-0.10§! GW\n§YGanancia de combustible§! de los estados: 8 (biocombustibles)\n§YSuministros locales§!: 1.5%\n§G+3%§! de §YGranos§! de las §YTierras de cultivo§! del mismo estado, porque procesar la cosecha enseguida reduce las pérdidas\n§G+1§! millón de toneladas de capacidad de almacenamiento de comida (silos)\n"
 agriculture_district_amount: "$VALUE|Y0=$"
 rocket_site: "Sitio de lanzamiento de misiles"
 rocket_site_plural: "Sitio de lanzamiento de misiles"
 rocket_site_desc: "Los §YSitios de Lanzamiento de Misiles§! representan un lugar de almacenamiento para todos los equipos de misiles a nivel de teatro, desde §YMisiles Tierra-Aire§! hasta §YMisiles Balísticos Intercontinentales§!. Proporcionan al estado la capacidad de desplegar estos activos estratégicos en nuestras zonas aéreas estratégicas, ya sea para ayudar en nuestra defensa aérea o para proporcionar capacidades ofensivas.\n\nNúmero base de trabajadores requeridos por nivel: §Y300§!\nConsumo base de energía por nivel: §R-0.1§! GW"
 nuclear_facility: "Instalación de I+D civil"
 nuclear_facility_plural: "Instalación de I+D civil"
 nuclear_facility_desc: "Una §YInstalación de I+D Civil§! incluye todo tipo de proyectos especiales relacionados con la capacidad industrial civil, instalaciones nucleares y más.\n\nNúmero base de trabajadores requeridos: §Y2K§!\nConsumo base de energía: §R-0.3§! GW"
 air_facility: "Instalación de aerodinámica y aviónica"
 air_facility_desc: "Las Instalaciones Experimentales de Aerodinámica y Aviónica permiten iniciar proyectos de investigación para aeronaves, cohetes avanzados, electrónica relacionada y proyectos espaciales.\n\nNúmero base de trabajadores requeridos: §Y1.5K§!\nConsumo base de energía: §R-0.35§! GW"
 naval_facility_desc: "Las instalaciones experimentales de ingeniería naval te permiten iniciar proyectos de investigación relacionados con buques de superficie y submarinos.\nSolo se puede crear una ingeniería naval en una provincia costera.\n\nNúmero base de trabajadores requeridos: §Y1.2K§!\nConsumo base de energía: §R-0.2§! GW"
 stronghold_network: "Red Defensiva Estatal"
 stronghold_network_plural: "Red Defensiva Estatal"
 stronghold_network_desc: "Una extensa red defensiva compuesta por túneles, puntos de defensa, trincheras, refugios antiaéreos, depósitos de armas y sitios de demolición planificados previamente brindan a los defensores una ventaja decisiva contra cualquier atacante.\n\nNúmero base de trabajadores requeridos: §Y500§!"
 renewable_energy_infra: "Infraestructura de Energía Renovable"
 renewable_energy_infra_plural: "Infraestructura de Energía Renovable"
 renewable_energy_infra_desc: "La §YInfraestructura de Energía Renovable§! es un conjunto de fuentes de energía renovable. Estas incluyen, entre otras: parques solares, aerogeneradores, refinerías de biocombustibles, plantas de carbón vegetal, centrales eléctricas de biocombustibles, entre otras. Por lo tanto, utiliza fuentes renovables y produce combustible a partir de ellas.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y22.5K§!\nProducto base del PIB por §YInfraestructura de energía renovable§!: $§Y2 mil millones§!\nGanancia de potencia base: §G+0.5§! GW\n"
 renewable_energy_infra_amount: "$VALUE|Y0=$"
 renewable_energy_infra_resource: "£resources_strip|$FRAME$"
 microchip_plant: "Planta de Microchips"
 microchip_plant_plural: "Plantas de Microchips"
 microchip_plant_desc: "Planta de producción que convierte metales tecnológicos y metales preciosos en Microchips, para uso tanto por necesidades industriales como militares.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y37.5K§!\nProducto del PIB base por §YPlanta de microchip§!: $§Y32 billón§!\nConsumo de energía base: §R-0.75§! GW\n20 §YMicrochip§! Producción\n\n§YMicrochips§! ordena el precio más alto del mercado por unidad, generando ingresos significativos en efectivo sobre las exportaciones excedentes.\n\nCostos:\n3 §YMetales tecnológicos§!\n2 §YMetales preciosos§!"
 composite_plant: "Planta Compuesta"
 composite_plant_desc: "Planta de producción que combina aceite, goma y metales preciosos en compuestos, para uso tanto en trabajadores científicos, militares como industriales.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y37.5K§!\nProducto básico del PIB por §Y Planta compuesta§!: $§Y28 billón§!\nConsumo de energía base: §R-0.8§! GW\n20 §Y Composite avanzado§! Producción\n\n§YComposites§! venden a uno de los precios más altos del mercado por unidad, generando fuertes ingresos en efectivo sobre las exportaciones excedentes.\n\nCostos:\n1 §YOil§!\n1 §YRubber§!\n1 §YMetales preciosos§!"
 composite_plant_plural: "Planta Compuesta"
 rail_terminal: "Terminal"
 rail_terminal_plural: "Terminales de ferrocarril"
 rail_terminal_desc: "Un estado servido por una densa red terminal mueve tanto a la gente como a los bienes más rápido, por lo que las fábricas ven insumos más estables, los trabajadores alcanzan puestos de trabajo más fiables, y la economía circundante gana espacio para expandirse.\n\nNúmero base de trabajadores requeridos por nivel: §Y500§!"
 show_construction_speed: "Cuando se comprueba, se puede ver la corriente £construction_speed_texticon §Y Bono de velocidad de construcción§! para cada §Y Tipo de edificio§!\n\nEste modificador muestra sólo el modificador específico del edificio. Su no tiene en cuenta la §YGlobal £construction_speed_texticon Velocidad de Construcción.§!"
 landmark_kaaba: "Kaaba"
 landmark_kaaba_plural: "$landmark_kaaba$"
 landmark_kaaba_desc: "El Kaaba, una estructura sagrada en forma de cubo en el corazón del Masjid al-Haram de la Meca, se encuentra como el sitio más sagrado del Islam. Dibujado en seda negra adornada con caligrafía dorada, sirve como qibla, la dirección hacia la que los musulmanes giran en oración en todo el mundo. Este antiguo santuario, conocido como la Casa de Dios, encarna siglos de fe, peregrinación e historia islámica, simbolizando la unidad musulmana.\n\n§YLandmark Kaaba§! genera ingresos turísticos basados en la población total de los estados árabes. §YEconomic Preview§!."
 landmark_milad: "Torre Milad"
 landmark_milad_plural: "$landmark_milad$"
 landmark_milad_desc: "Milad Tower, o Borj-e Milad, tiene raíces en el período prerrevolucionario de Irán, con planes iniciales que datan del decenio de 1970. Después de la Revolución iraní de 1979, esos primeros planes se redujeron entre las prioridades políticas cambiantes. La visión se revivió a finales del decenio de 1990, y la construcción comenzó en 2000, alineando con el nuevo enfoque de Irán sobre desarrollo y modernización. Su diseño combina elementos del patrimonio iraní con la ingeniería contemporánea, lo que lo convierte en un emblema llamativo tanto de continuidad histórica como de identidad evolutiva del país. Hoy en día, la torre se encuentra como un complejo multifuncional y un hito cultural prominente, ofreciendo a los residentes de Teherán y visitantes vistas panorámicas de la ciudad y las distantes montañas de Alborz."
 landmark_domeofrock: "Cúpula de la roca"
 landmark_domeofrock_plural: "$landmark_domeofrock$"
 landmark_domeofrock_desc: "La Cúpula de la Roca es un renombrado santuario islámico, famoso por la cúpula dorada con vistas a la Ciudad Vieja de Jerusalén. Construido en el siglo VII, se encuentra en el Haram al-Sharif, también conocido como el Monte del Templo, un lugar sagrado tanto para los musulmanes como para los judíos. El santuario consagra la Piedra Fundacional, que los musulmanes creen que marca donde el Profeta Muhammad ascendió al cielo y que los judíos creen que es el lugar del Santo de los Santos del antiguo Templo Judío."
 landmark_goldengate: "Puente Golden Gate"
 landmark_goldengate_plural: "$landmark_goldengate$"
 landmark_goldengate_desc: "Completado en 1937, el puente Golden Gate abarca el estrecho entre la Bahía de San Francisco y el Océano Pacífico, conectando la ciudad con los Países Marin. Sus singulares torres internacionales de Orange y su larga duración suspendida la convirtieron en el puente más largo de su tipo en el mundo en el momento de su apertura, y sigue siendo una de las estructuras más reconocibles en los Estados Unidos."
 landmark_UScongress: "U.S. Capitol"
 landmark_UScongress_plural: "$landmark_UScongress$"
 landmark_UScongress_desc: "Estados Unidos. Capitol se encuentra en el extremo este del centro comercial nacional de Washington, D.C., albergando las cámaras del Senado y la Cámara de Representantes. Su diseño neoclásico y su cúpula central lo han convertido en el asiento más reconocible del poder legislativo estadounidense, anclando un pasillo que incluye la Biblioteca del Congreso, la Corte Suprema y el complejo museográfico de la Institución Smithsoniana."
 landmark_fuji: "Montaje Fuji"
 landmark_fuji_plural: "$landmark_fuji$"
 landmark_fuji_desc: "El monte Fuji, a 3.776 metros del pico más alto de Japón, es un estratovolcán activo en Honshu visible desde Tokio en días claros. Largamente considerada sagrada en la creencia Shinto y un motivo definitorio en el arte japonés, es también Patrimonio de la Humanidad por la UNESCO. Su silueta cónica casi perfecta y la región del lago circundante dibujan cientos de miles de escaladores y turistas cada año."
 landmark_giza: "Pirámides de Giza"
 landmark_giza_plural: "$landmark_giza$"
 landmark_giza_desc: "Construido durante el Antiguo Reino de Egipto como tumbas monumentales para los faraones, las pirámides de Giza se encuentran en las afueras de El Cairo. La Gran Pirámide, construida para Faraón Khufu, es la última estructura sobreviviente de las Siete Maravillas del Mundo Antiguo. El complejo, junto con la Esfinge, sigue siendo uno de los hitos más visitados de Egipto y una pieza central de la economía turística del país."
 landmark_shuttle: "Centro espacial Kennedy"
 landmark_shuttle_plural: "$landmark_shuttle$"
 landmark_shuttle_desc: "Kennedy Space Center, en la costa atlántica de Florida, sirve como el sitio principal de lanzamiento para las misiones humanas del vuelo espacial de la NASA. Cuenta con instalaciones como el icónico Edificio de la Asamblea del Vehículo, donde se preparan cohetes para su lanzamiento y el Complejo de lanzamiento 39, el histórico punto de partida para los programas Apolo y Shuttle Espacial. El centro sigue siendo un centro de innovación y exploración, apoyando tanto los lanzamientos gubernamentales como comerciales."
 landmark_shuttle_launch: "Centro espacial Kennedy"
 landmark_shuttle_launch_plural: "$landmark_shuttle_launch$"
 landmark_shuttle_launch_desc: "Kennedy Space Center, en la costa atlántica de Florida, sirve como el sitio principal de lanzamiento para las misiones humanas del vuelo espacial de la NASA. Cuenta con instalaciones como el icónico Edificio de la Asamblea del Vehículo, donde se preparan cohetes para su lanzamiento y el Complejo de lanzamiento 39, el histórico punto de partida para los programas Apolo y Shuttle Espacial. El centro sigue siendo un centro de innovación y exploración, apoyando tanto los lanzamientos gubernamentales como comerciales."
 landmark_buran: "Baikonur Cosmodrome"
 landmark_buran_plural: "$landmark_buran$"
 landmark_buran_desc: "El Cosmodrome Baikonur, en las estepas del sur de Kazajstán, es el espacio más antiguo y más grande del mundo. Establecido en 1955, ha sido el lugar de lanzamiento para las misiones soviéticas y rusas hito, incluyendo el primer vuelo espacial humano por Yuri Gagarin a bordo del Vostok 1. Rusia sigue alquilando la instalación de Kazajstán y la utiliza para los lanzamientos tripulados de Soyuz a la Estación Espacial Internacional."
 landmark_ICBMsilominot: "Base aérea Minot"
 landmark_ICBMsilominot_plural: "$landmark_ICBMsilominot$"
 landmark_ICBMsilominot_desc: "El complejo de misiles de la base aérea Minot consiste en una extensa red de silos subterráneos que albergan misiles balísticos intercontinentales, dispersados por las llanuras de Dakota del Norte. Los silos están endurecidos contra la huelga nuclear y fuertemente vigilados, mantenidos en alerta continua, formando la pierna terrestre de la triada nuclear de los Estados Unidos."
 landmark_ICBMsiloyasny: "Base de misiles Yasny"
 landmark_ICBMsiloyasny_plural: "$landmark_ICBMsiloyasny$"
 landmark_ICBMsiloyasny_desc: "La base de misiles Yasny, cerca de Dombarovsky en la región de Orenburgo de Rusia, es uno de los principales campos de silo de las Fuerzas Estratégicas de Rocket. Construido durante la Guerra Fría, alberga grandes ICBM en silos subterráneos endurecidos y forma un componente crítico del disuasión nuclear de Rusia."
 landmark_zenobia_wall: "Línea de defensa Zenobia"
 landmark_zenobia_wall_plural: "$landmark_zenobia_wall$"
 landmark_zenobia_wall_desc: "Una línea fuertemente fortificada que se extiende por el sur de Egipto y el desierto occidental. Paredes de hormigón, complejos búnkeres y artillería presitada anclan la Línea Zenobia, levantada para detener el avance Chimera de las zonas de brecha subsahariana."
 landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
 landmark_hagia_sophia_desc: "Originalmente construida como catedral bizantina en 537, la Hagia Sophia se convirtió en la principal mezquita otomana de Estambul después de la conquista de la ciudad en 1453. Sirvió como un museo secular a través de gran parte de la historia de la República Turca. Su enorme cúpula central y mosaicos bizantinos permanecen entre las obras más influyentes de la arquitectura religiosa jamás construida, trayendo millones de visitantes a Estambul cada año."
 landmark_forbidden_city_desc: "El complejo de palacio amurallado en el corazón de Pekín sirvió como residencia imperial de las dinastías Ming y Qing durante casi cinco siglos. Hoy alberga el Museo del Palacio, con una de las colecciones más importantes del mundo del arte y artefactos chinos. La Ciudad Prohibida es el sitio cultural más visitado del país y un Patrimonio de la Humanidad de la UNESCO, de pie como el símbolo principal de la civilización china."
 landmark_tokyo_imperial_palace_desc: "La residencia principal del Emperador de Japón desde la Restauración Meiji, en el lugar del antiguo castillo de Edo en el corazón de Tokio. El palacio y sus terrenos representan la continuidad de la monarquía hereditaria más antigua del mundo. El acceso público está restringido, pero los jardines orientales y las principales ceremonias imperiales atraen un turismo sustancial cada año."
 landmark_taj_mahal_plural: "$landmark_taj_mahal$"
 landmark_taj_mahal_desc: "Comisariado en 1632 por el emperador Mughal Shah Jahan como mausoleo para su esposa Mumtaz Mahal, el Taj Mahal es el mejor ejemplo sobreviviente de la arquitectura Mughal. Su fachada de mármol blanco, obra intrincada y jardines simétricos lo han convertido en Patrimonio de la Humanidad de la UNESCO y uno de los monumentos más visitados de la Tierra, trayendo cada año a millones de visitantes a Agra."
 landmark_prague_castle: "Prague Castle"
 landmark_prague_castle_desc: "El complejo antiguo más grande del mundo por área, el Castillo de Praga ha servido como sede de reyes bohemios, emperadores romanos santos, y ahora presidente de la República Checa. Dentro de sus paredes se levanta St. Catedral de Vitus y siglos de arte de toda Europa Central, haciendo del castillo el sitio cultural más visitado del país."
 landmark_bojnice_castle: "Bojnice Castle"
 landmark_bojnice_castle_desc: "Una romántica restauración neogótica de una fortaleza eslovaca medieval, el castillo Bojnice fue reconstruido a finales del siglo XIX bajo el conde János Pálffy en el estilo de los castillos del Loira francés. Hoy en día es uno de los lugares culturales más visitados de Eslovaquia, su silueta y parque circundante que sirven como centro del turismo patrimonial eslovaco."
 landmark_sadabad_complex: "Complejo Sadabad"
 landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
 landmark_sadabad_complex_desc: "Un complejo de palacio espeluznante en las estribaciones al norte de Teherán, construido originalmente bajo los Qajars y expandido dramáticamente por los chahs Pahlavi. Tras la revolución de 1979 se nacionalizó el complejo, y hoy funciona como una red de museos estatales que alberga colecciones reales, arte iraní e historia natural."
 landmark_hofburg_palace_desc: "El Hofburg, en el corazón de Viena, sirvió durante siglos como el principal palacio imperial de la dinastía Habsburgo. Hoy en día sus salones albergan las oficinas del Presidente Federal austriaco, la Escuela Española de Riding, el Tesoro Imperial y varios museos importantes. Sigue siendo uno de los hitos decisivos de Viena y una pieza central del turismo cultural austriaco."
 landmark_berlin_reichstag_desc: "El edificio del Reichstag en Platz der Republik ha estado en el centro político de Berlín durante más de un siglo. Heavily dañado en 1933 y de nuevo durante la Segunda Guerra Mundial, fue restaurado después de la reunificación bajo el rediseño y reabierto de Norman Foster en 1999 como sede del Bundestag, el parlamento federal alemán. Su cúpula de cristal se ha convertido en un símbolo determinante de la democracia alemana moderna y una gran atracción en el centro de Berlín."
 enrichment_facility: "Planta de enriquecimiento nuclear"
 enrichment_facility_plural: "Plantas de enriquecimiento nuclear"
 enrichment_facility_desc: "Las instalaciones de enriquecimiento toman uranio y lo enriquecen para su utilización en reactores nucleares y, en cierta medida, armas nucleares.\n\nSin uranio, baja la producción de combustible nuclear (pantalla de comercio, botón de uranio).\n\nCostos:\n2 §YUranio§!\n\nNúmero base de trabajadores requeridos: §Y2.2K§!"
 infrastructure_desc: "El Estado disfruta de una mejora en la infraestructura gracias a este edificio. Incrementa tu suministro de energía en regiones estratégicas y aumenta la velocidad de las divisiones y la extracción de materias primas.\n\nNúmero base de trabajadores requeridos por nivel: §Y100§!"
 bunker_desc: "Este edificio proporciona una penalización al ataque del atacante de $VALUE|+%0$ por cada nivel de fuerte. Atacar desde múltiples direcciones reducirá el efecto de los fuertes.\n\nNúmero base de trabajadores requeridos por nivel: §Y50§!\nConsumo base de energía por nivel: §R-0.001§! GW"
 coastal_bunker_desc: "Este edificio proporciona una penalización de ataque al invasor naval de $VALUE|+%0$ por cada nivel de fuerte.\n\nNúmero base de trabajadores requeridos por nivel: §Y80§!\nConsumo base de energía por nivel: §R-0.002§! GW"
 naval_base_desc: "Este edificio proporciona al estado servicios de reparación de tus flotas.\n\nNúmero base de trabajadores requeridos por nivel: §Y300§!\nConsumo base de energía por nivel: §R-0.006§! GW"
 naval_headquarters_desc: "Este edificio te permite asignar un almirante para aumentar la eficacia de las §Yfuerzas especiales§! que operan dentro del alcance del cuartel general naval.\n\nPuede haber un máximo de $MAXNUM|H$ cuarteles generales con almirantes asignados simultáneamente.\n   Asignados actualmente: $CURRNUM|H$\n\nUn cuartel general naval solo puede construirse en una provincia costera que tenga una base naval de nivel 8 como mínimo.\n\nNúmero base de trabajadores requeridos: §Y800§!\nConsumo base de energía: §R-0.02§! GW"
 naval_supply_hub_desc: "Este edificio permite a tus flotas reabastecerse y repostar en esta base además de en sus bases de origen, lo que podría ampliar el alcance operativo de tus §Yfuerzas especiales§!.\nUn centro de suministro naval solo puede construirse en una provincia costera que tenga una base naval de nivel 8 como mínimo.\n\nNúmero base de trabajadores requeridos: §Y900§!\nConsumo base de energía: §R-0.015§! GW"
 supply_node_desc: "Un centro de suministros es un punto a lo largo de la vía férrea, fuera de las ciudades, del que pueden obtenerse suministros.\n\nNúmero base de trabajadores requeridos: §Y600§!\nConsumo base de energía: §R-0.01§! GW"
 land_facility_desc: "Las instalaciones experimentales para la guerra terrestre te permiten iniciar proyectos de investigación relacionados con diversos aspectos de la guerra terrestre, como los tanques especiales o la artillería.\n\nNúmero base de trabajadores requeridos: §Y1K§!\nConsumo base de energía: §R-0.15§! GW"
