 sp_secure_military_network: "Red Militar de seguridad"
 sp_secure_military_network_desc: "Una columna vertebral nacional de comunicaciones, blindada y cifrada, que une el mando, los sensores y las fuerzas con enlaces de datos resilientes y de baja latencia."
 scientist_trait_antarctica_specialist: "Especialista en investigación Polar"
 scientist_trait_antarctica_specialist_desc: "Un investigador curtido que prospera en el entorno más duro del mundo, especializado en sostener y hacer avanzar las operaciones sobre el hielo antártico."
 scientist_trait_naval_armament_specialist: "Especialista en armamento naval"
 scientist_trait_naval_armament_specialist_desc: "Un especialista en armamento naval, desde cañones de riel y torpedos hasta enjambres de drones y módulos de contramedidas."
 scientist_trait_naval_propulsion_specialist: "Especialista en propulsión naval"
 scientist_trait_naval_propulsion_specialist_desc: "Un experto en plantas de propulsión marinas avanzadas que impulsa a los buques de guerra más rápido y más lejos con propulsión nuclear y de fusión."
 scientist_trait_tank_firepower_specialist: "Bomberos Especialistas"
 scientist_trait_tank_firepower_specialist_desc: "Una autoridad en armamento de vehículos blindados, desde cañones avanzados y cargadores automáticos hasta cañones de riel y láseres montados en vehículos."
 scientist_trait_tank_armor_specialist: "Especialista en protección de tanques"
 scientist_trait_tank_armor_specialist_desc: "Un especialista en supervivencia de vehículos blindados que desarrolla blindaje compuesto, sistemas de protección activa y camuflaje adaptativo."
 scientist_trait_tank_mobility_specialist: "Especialista en movilidad de tanques"
 scientist_trait_tank_mobility_specialist_desc: "Un experto en trenes motrices y chasis de vehículos blindados, desde la tracción eléctrica hasta las suspensiones andadoras."
 scientist_trait_robotics_specialist: "Experto en robótica y autonomía"
 scientist_trait_robotics_specialist_desc: "Un pionero de los sistemas autónomos que enseña a las máquinas de tierra, mar y aire a pensar, cazar y trabajar sin un humano en el circuito."