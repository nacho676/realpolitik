 sp_improved_synthetic_diamonds_idea: "Desarrollo Revitalizado de Diamantes Sintéticos"
 scientist_trait_genius: "Genio"
 scientist_trait_genius_desc: "Una mente visionaria que empuja los límites de la ciencia y la tecnología con una innovación sin paralelo. Este tipo de talento emerge solo una vez en una generación."
 scientist_trait_brilliant_theorist: "Teórico Brillante"
 scientist_trait_brilliant_theorist_desc: "Un maestro de conceptos y teorías abstractas, capaz de revolucionar la estrategia militar y la investigación científica."
 scientist_trait_gifted_engineer: "Ingeniero Dotado"
 scientist_trait_gifted_engineer_desc: "Un ingeniero naturalmente talentoso, apto para resolver problemas técnicos complejos en una variedad de campos."
 scientist_trait_bright: "Brillante"
 scientist_trait_bright_desc: "Un científico agudo y de pensamiento rápido que sobresale en captar nuevos conceptos y aplicarlos eficientemente."
 scientist_trait_fast_learner: "Aprendiz Rápido"
 scientist_trait_fast_learner_desc: "Se adapta rápidamente a nuevos desafíos, aprende más rápido que sus compañeros y sobresale en diversos campos científicos."
 scientist_trait_resourceful: "Recursivo"
 scientist_trait_resourceful_desc: "Siempre encuentra soluciones creativas, incluso cuando los recursos son escasos o las situaciones son desesperadas."
 scientist_trait_nuclear_specialist: "Especialista Nuclear"
 scientist_trait_nuclear_specialist_desc: "Un físico a la vanguardia de la investigación atómica, profundamente inmerso en el estudio de la fisión nuclear y las reacciones en cadena."
 scientist_trait_civilian_technology_expert: "Experto en Investigación Civil"
 scientist_trait_civilian_technology_expert_desc: "Un experto en el desarrollo de tecnologías dirigidas al sector civil."
 scientist_trait_energy_expert: "Experto en Producción de Energía"
 scientist_trait_energy_expert_desc: "Un veterano de múltiples empresas energéticas capaz de desarrollar nuevos métodos de producción de energía."
 scientist_trait_telecommunications_expert: "Experto en Telecomunicaciones"
 scientist_trait_telecommunications_expert_desc: "Una persona nacida con un teléfono en la mano, experta en encontrar formas de hacer que el porno esté disponible en todos los dispositivos que posees."
 scientist_trait_naval_vessels_specialist: "Especialista en casco naval"
 scientist_trait_naval_vessels_specialist_desc: "Un especialista en el diseño de cascos de buques de guerra, desde lanchas no tripuladas hasta superportaaviones."
 scientist_trait_stealth_specialist: "Especialista en Buques Sigilosos"
 scientist_trait_stealth_specialist_desc: "Especializado en desarrollar buques con una firma de radar y sonar mínima."
 scientist_trait_avionics_specialist: "Especialista en Aeronaves"
 scientist_trait_avionics_specialist_desc: "Un especialista en aerodinámica y diseño de aeronaves, capaz de desarrollar estructuras, motores y diseños de aeronaves superiores para dominar los cielos."
 scientist_trait_missile_specialist: "Especialista en Misiles"
 scientist_trait_missile_specialist_desc: "Especializado en tecnología de misiles, centrándose en los principios de propulsión en programas de misiles balísticos y guiados."
 scientist_trait_space_specialist: "Entusiasta del Espacio"
 scientist_trait_space_specialist_desc: "Una persona que ha dedicado su vida a avanzar en los objetivos de la humanidad más allá de la Tierra."
 scientist_trait_aircraft_engine_expert: "Experto en Propulsión"
 scientist_trait_aircraft_engine_expert_desc: "Una autoridad en propulsión por chorro y pistón, avanzando en la investigación de motores y su aplicación en aeronaves militares."
 scientist_trait_autonomous_plane_expert: "Experto en Vehículos no Tripulados"
 scientist_trait_autonomous_plane_expert_desc: "Un experto en hacer que las cosas vuelen sin que nadie las pilotee."
 scientist_trait_armored_specialist: "Blindaje Especialista en vehículos"
 scientist_trait_armored_specialist_desc: "Un ingeniero veterano especializado en el diseño de plataformas y cascos de vehículos blindados."
 scientist_trait_infantry_specialist: "Especialista en Infantería"
 scientist_trait_infantry_specialist_desc: "Un especialista en armas pequeñas, su uso y diseño."
 scientist_trait_mechsuit_specialist: "Especialista en Trajes Mecánicos"
 scientist_trait_mechsuit_specialist_desc: "Alguien que ha jugado demasiado a Titanfall."
 sp_improved_space_solar_farms_idea: "Granjas Solares Basadas en el Espacio"
 sp_afv_double_cannons: "Doble Cañón"
 sp_afv_double_cannons_desc: "Generalmente, nuestros vehículos de combate blindados más ligeros están equipados con un solo arma, usualmente un cañón automático. Sin embargo, podríamos crear un sistema para montar dos cañones uno al lado del otro."
 sp_afv_double_cannons_reward_improved_autoloader: "Autocargador Mejorado"
 sp_afv_double_cannons_reward_improved_autoloader_desc: "Nuestros ingenieros han desarrollado un autocargador mejorado para nuestros tanques mientras trabajaban en un sistema de recarga de doble cañón."
 sp_coilgun_memes: "Coilguns de Infantería"
 sp_coilgun_memes_desc: "Al hacer una versión en miniatura de la tecnología de railgun de nuestros tanques, podemos darle a nuestra infantería el poder de un proyectil de tungsteno a velocidad mach. \nNo tientes al desarrollador esquizofrénico porque juro que haré cosas como esta en una tarde."
 sp_multipurpose_warhead: "Cabezas de Guerra Multipropósito"
 sp_multipurpose_warhead_desc: "Tenemos misiles contra tanques y misiles contra aeronaves. Pero, ¿qué pasaría si pudiéramos dar a nuestros misiles eficacia contra ambos? De esta manera, en un apuro, los misiles antitanque y antiaéreos podrían usarse contra objetivos distintos a los previstos."
 sp_supercarrier_1: "Superportaaviones Tempranos"
 sp_supercarrier_1_desc: "El espacio ampliado en la cubierta y la capacidad de construir barcos de ese tamaño serán cruciales para nuestra proyección de poder a largo plazo."
 sp_supercarrier_2: "Superportaaviones Tardíos"
 sp_supercarrier_2_desc: "Con la adición de motores nucleares, más potencia significa barcos más grandes y mayor espacio en la cubierta."
 sp_stealth_technology: "Experimentación con Sigilo"
 sp_stealth_technology_desc: "Para darnos una ventaja sobre nuestro enemigo, debemos encontrar una manera de hacer que nuestros cazas sean menos detectables por el radar."
 sp_arsenal_bird: "Pájaro Arsenal"
 sp_aresnal_bird_desc: "Con el desarrollo de aeronaves completamente autónomas, motores de aeronaves nucleares y sistemas avanzados de control de vuelo, podemos construir una aeronave que pueda llevar una fuerza aérea de drones completa en sí misma. Esta aeronave, aunque extremadamente costosa, será la cúspide de los sistemas de combate aéreo."
 sp_multipurpose_warhead_reward_improved_warhead: "Ojivas Mejoradas"
 sp_multipurpose_warhead_reward_improved_warhead_desc: "Mientras intentaban averiguar cómo agregar rendimiento antiaéreo a los misiles antitanque y rendimiento antitanque a los misiles antiaéreos, nuestros ingenieros descubrieron cómo mejorar el rendimiento general de un tipo de misiles."
 sp_multipurpose_warhead_reward_improved_warhead_at: "Mejor Rendimiento Antitanque"
 sp_multipurpose_warhead_reward_improved_warhead_aa: "Mejor Rendimiento Antiaéreo"
 sp_emp_warhead: "Guerra Electrónica Mejorada"
 sp_emp_warhead_desc: "Tanto los tanques como los aviones tienen contramedidas de guerra electrónica que pueden reducir el impacto de las armas EMP. Dado que diferentes plataformas utilizan diferentes arquitecturas, solo podemos enfocarnos eficazmente en un tipo de objetivo."
 sp_emp_warhead_reward_improved_warhead_at: "Priorizar Objetivos Terrestres"
 sp_emp_warhead_reward_improved_warhead_aa: "Priorizar Objetivos Aéreos"
 sp_fire_support_land_drone_reward_improved_communication_desc: "Mientras desarrollaban un método de control eficiente para nuestros drones, nuestros ingenieros han desarrollado un método mejorado de comunicación inalámbrica. Podemos utilizar este avance tanto en una aplicación civil como militar."
 sp_double_shot_rifle_tt: "Aumenta todas las unidades de §YFuerzas Especiales§! §YDefensa§! y §YRuptura§! en §G5%§!\n"
 sp_double_shot_rifle_tech: "Rifle de Doble Disparo"
 sp_ground_fireandforget: "ATGM de Disparar y Olvidar"
 sp_ground_fireandforget_desc: "La miniaturización de la electrónica ahora permite que un misil se guíe automáticamente a un objetivo a través de bloqueos térmicos."
 sp_modern_air_electronics: "Electrónica Aerotransportada Moderna"
 sp_modern_air_electronics_desc: "Una nueva generación de avances en electrónica para radares aerotransportados, cabinas y otros sistemas."
 sp_future_air_electronics: "Electrónica Aerotransportada del Futuro"
 sp_future_air_electronics_desc: "Fusionando la tecnología más reciente en IA inteligente, sistemas láser y nanotecnología para equipos aerotransportados de alta eficiencia."
 sp_modern_air_weapons: "Armas Aerotransportadas Inteligentes"
 sp_modern_air_weapons_desc: "Sistemas de selección de objetivos inteligentes, radares de ondas milimétricas montados en armas, bloqueo después del lanzamiento. Una nueva generación de armas que allanan el camino del futuro campo de batalla."
 sp_future_air_weapons: "Armas Aerotransportadas Mejoradas con IA"
 sp_future_air_weapons_desc: "Mejorando la generación anterior de misiles y sensores aerotransportados con procesadores de IA y sistemas de detección y selección de objetivos aún más finos."
 sp_hypersonic_missile: "Misiles Hipersónicos"
 sp_hypersonic_missile_desc: "Los misiles hipersónicos darán a nuestra fuerza de misiles estratégicos la capacidad de atacar profundamente en territorio enemigo a velocidades consideradas imposibles no hace mucho tiempo."
 sp_hypersonic_missile_tt: "Desbloquea §Ytecnología de misiles hipersónicos§!"
 sp_naval_generic_reward_army_xp_1: "Cambio en el Flujo de Ideas"
 sp_naval_generic_reward_army_xp_2: "Ola de Ideas"
 sp_naval_generic_reward_army_xp_3: "Tsunami de Innovaciones!"
 sp_emp_warhead_reward_improved_warhead: "Arma Electrónica"
 sp_emp_warhead_reward_improved_warhead_desc: "El equipo electrónico puede darnos una ventaja en el combate aéreo."
 sp_helicopter_project: "Experimentos de diseño de helicópteros"
 sp_helicopter_project_desc: "Al igual que el diseño de un automóvil y otros vehículos, el diseño y la construcción de helicópteros requieren el conocimiento local para producir estos vehículos especializados localmente. Deberíamos realizar algunos experimentos de diseño hasta que desarrollemos una versión para nosotros mismos."
 sp_helicopter_project_tt: "Desbloquea las siguientes §YLíneas tecnológicas§!:\n- §YHelicópteros de transporte§!\n- §YHelicópteros de ataque§!\n"
 sp_air_generic_reward_army_xp_1: "Soplo de Aire Fresco"
 sp_air_generic_reward_army_xp_2: "Brisa de Innovación"
 sp_air_generic_reward_army_xp_3: "Vientos de Cambio"
 sp_tank_stealth_armor_early: "Armadura furtiva temprana"
 sp_tank_stealth_armor_early_desc: "Al crear blindajes que no sólo protejan nuestros tanques, sino que también proporcionen un mejor ocultamiento, podemos adoptar las mejores teorías sobre blindaje: que no ser alcanzado es mejor que detener el impacto."
 sp_electronic_government: "Gobierno electrónico"
 sp_electronic_government_desc: "Para maximizar la eficiencia del Estado, los ciudadanos deberían poder acceder e interactuar con su gobierno desde la comodidad de su hogar. Esto fomentará una mayor alfabetización en internet entre los ciudadanos y reducirá el gasto público a niveles astronómicos."
 sp_tank_nera_armor: "Compuesto NERA pesado"
 sp_tank_nera_armor_desc: "Podemos investigar materiales avanzados para producir tipos de blindaje más pesados ​​y resistentes, como insertos de uranio empobrecido."
 sp_aircraft_project_bba_tt: "Desbloquea las siguientes §YLíneas tecnológicas§!:\n-§YFuselajes ligeros§!\n-§YFuselajes medianos§!\n-§YFuselajes pesados§!\n-§YHelicópteros de ataque§!\n-§YHelicópteros de transporte§!\n"
 sp_aircraft_project_non_bba_tt: "Desbloquea las siguientes §YLíneas Tecnológicas§!:\n- §YCazas§!\n- §YApoyo Aéreo Cercano§!\n- §YBombarderos§!\n- §YVehículos Aéreos no Tripulado de Combate§!\n- §YCazas Ligeros§!\n"
 sp_space_weapons: "Armas basadas en el espacio"
 has_completed_space_program_tt: "Ha completado el proyecto especial: §Y$sp_space_program$§!"
 has_completed_space_weapons_tt: "Ha completado el proyecto especial: §Y$sp_space_weapons$§!"
 sp_microchip_production: "Laboratorios de producción de microchips"
 sp_microchip_production_desc: "Al experimentar con la miniaturización de nuestros procesos informáticos y aprender cómo hacerlos a gran escala, podremos producir nuestros propios microchips para utilizarlos en armas y equipos modernos."
 sp_composite_production: "Laboratorios de producción de materiales compuestos"
 sp_composite_production_desc: "Al experimentar con nuevas tecnologías y métodos de fundición, mezcla y otros métodos químicos, podemos perfeccionar formas de fabricar materiales compuestos modernos y avanzados."
 sp_recon_land_drone: "Drones de reconocimiento terrestre"
 sp_recon_land_drone_desc: "La guerra terrestre moderna depende cada vez más de la superioridad informativa y de la detección temprana de amenazas. Al desplegar drones de reconocimiento dedicados junto a nuestras fuerzas terrestres, ampliamos su conocimiento mucho más allá de los métodos de exploración tradicionales. Esta inversión permite una toma de decisiones más rápida, una mejor coordinación y una imagen más clara del campo de batalla antes de que se produzca el combate directo."
 sp_smart_bullets: "Balas inteligentes"
 sp_smart_bullets_desc: "Los avances en guiado y puntería están empezando a influir incluso en los detalles más pequeños del campo de batalla. Al invertir en munición inteligente para nuestra infantería y armas de apoyo, buscamos mejorar la precisión y la eficacia en entornos de combate complejos."
 sp_recon_drone_land: "Sistemas de drones de reconocimiento terrestre"
 sp_recon_drone_land_desc: "Con el uso generalizado de vehículos aéreos no tripulados en el campo de batalla, los drones de reconocimiento terrestre proporcionan a las fuerzas terrestres información de inteligencia continua y en tiempo real sobre la línea del frente. Al operar cerca de las unidades de combate, estos drones mejoran el conocimiento de la situación, la identificación de objetivos y la coordinación sin exponer al personal a riesgos directos."
 sp_airless_tires: "Neumáticos sin aire"
 sp_airless_tires_desc: "La movilidad sigue siendo un factor crítico en las operaciones terrestres modernas, especialmente en entornos hostiles e impredecibles. Al adoptar la tecnología de neumáticos sin aire para vehículos militares, podemos reducir las necesidades de mantenimiento y eliminar la vulnerabilidad a los pinchazos. Esta inversión mejora la fiabilidad operativa, permitiendo que nuestras fuerzas mantengan el movimiento incluso en condiciones adversas."
 sp_exoskeletal_engine_tank: "Sistemas de motores exoesqueléticos"
 sp_exoskeletal_engine_tank_desc: "Los motores convencionales dependen de ejes y discos centrales que tienen limitaciones inherentes de peso, esfuerzo y eficiencia. Al explorar diseños de motor exoesquelético, donde las palas giratorias se apoyan en una estructura de tambor-rotor, buscamos reducir el peso, mejorar la confiabilidad y abrir nuevas posibilidades para una propulsión compacta de alta potencia."
 sp_nuclear_engine_tank: "Sistemas de motores nucleares"
 sp_nuclear_engine_tank_desc: "El aumento de la demanda de combustible y los alcances operativos ampliados ponen una presión creciente sobre la logística blindada convencional. Al explorar sistemas de motores de propulsión nuclear para vehículos terrestres pesados, buscamos reducir la dependencia de las líneas de suministro y sostener la movilidad a largo plazo."
 sp_light_walker_tank_chassis: "Chasis de tanque andador ligero"
 sp_light_walker_tank_chassis_desc: "Un chasis blindado bípedo ligero, diseñado para atravesar terreno quebrado, escombros y obstáculos urbanos que frenan a los vehículos de orugas convencionales. Su perfil elevado y sus complejos actuadores traen problemas de mantenimiento y confiabilidad, pero una plataforma andadora ligera puede ofrecer una movilidad excepcional en ciudades densas y terreno áspero si la apoyan bien la infantería y los drones."
 sp_drone_lrs: "Sistema de cohetes lanzadores de drones"
 sp_drone_lrs_desc: "Al reemplazar los cohetes convencionales por gran cantidad de drones prescindibles, este sistema de lanzamiento da potencia de fuego de enjambre en áreas amplias. Una vez desplegados, los drones se dispersan para hacer reconocimiento, ataques o merodeo, lo que permite a las fuerzas terrestres saturar las defensas enemigas, adaptarse a los blancos en vuelo y mantener la presión sin depender de cargas de misiles tradicionales."
 sp_heavy_walker_tank_chassis: "Chasis de tanque andador pesado"
 sp_heavy_walker_tank_chassis_desc: "A partir de conceptos andadores anteriores, las plataformas blindadas bípedas pesadas combinan una gruesa protección blindada con movilidad articulada para atravesar terreno intransitable para los tanques pesados convencionales. Aunque son más lentos y mecánicamente más complejos, estos vehículos priorizan la resistencia frontal y plataformas de armas estables, lo que les permite apoyar operaciones de ruptura en entornos urbanos densos y accidentados."
 sp_walker_tank_chassis: "Chasis de tanque Walker"
 sp_walker_tank_chassis_desc: "Combinando el diseño de vehículos blindados con movilidad articulada sobre patas, los chasis de tanque andador están pensados para operar en terreno donde las plataformas de orugas convencionales tienen dificultades. Al pasar sobre obstáculos y moverse por terreno irregular, estos vehículos ofrecen más flexibilidad en entornos urbanos, montañosos y muy dañados, a costa de una mayor complejidad mecánica y exigencias de mantenimiento."
 sp_hover_suspension: "Sistemas de suspensión Hover"
 sp_hover_suspension_desc: "Al reemplazar el tren de rodaje de orugas tradicional por sistemas de sustentación, los transportes blindados de personal pueden moverse sobre la superficie del suelo en lugar de por ella. Así atraviesan barro, nieve, agua y escombros con menos contacto con el suelo, lo que mejora la movilidad y la flexibilidad de despliegue, aunque añade nuevas exigencias de energía y mantenimiento."
 sp_magneto_explosive_munition: "Municiones Explosivas Magneto-Hydrodynamic"
 sp_magneto_explosive_munition_desc: "Los vehículos muy blindados siguen impulsando el desarrollo de armas antitanque más avanzadas. Al explorar municiones explosivas magnetohidrodinámicas, buscamos mejorar la penetración y los efectos disruptivos de nuestros misiles guiados."
 sp_drone_torpedoes: "Torpedos secos"
 sp_drone_torpedoes_desc: "La guerra naval evoluciona con rapidez y los torpedos tradicionales ya no bastan contra las amenazas modernas. Al invertir en sistemas de torpedos dron, buscamos aumentar nuestra potencia de ataque bajo el agua. Estos nuevos torpedos pueden seguir blancos de forma independiente y empeñarse de manera adaptativa, lo que permite a nuestras flotas mantener la iniciativa en operaciones antisubmarinas y navales."
 sp_anti_drone_laser_modules: "Módulos láser antidrogas"
 sp_anti_drone_laser_modules_desc: "El uso creciente de drones y municiones de guiado de precisión en el mar obliga a replantear la defensa aérea naval. Al integrar sistemas láser antidron en nuestros buques, podemos responder a estas amenazas con una rapidez y una precisión que las armas tradicionales no igualan."
 sp_mineclearing_drone: "Sistemas de remoción de minas"
 sp_mineclearing_drone_desc: "Las minas navales siguen siendo una de las amenazas más persistentes y rentables para las operaciones marítimas. Al trasladar las labores de contramedidas de minas a sistemas de drones no tripulados, reducimos el riesgo para las tripulaciones y mejoramos la rapidez y el alcance del despeje."
 sp_naval_recon_drone: "Reconocimiento naval Drones"
 sp_naval_recon_drone_desc: "Mantener la conciencia situacional en el mar es cada vez más complejo a medida que los teatros navales se llenan y se disputan más. Al invertir en drones navales de reconocimiento especializados, ampliamos nuestro alcance de vigilancia más allá de los límites de las plataformas tripuladas. Estos sistemas permiten a nuestras flotas detectar, seguir y responder antes a las amenazas, con decisiones de mando mejor informadas y mayor flexibilidad operativa."
 sp_drone_submarine: "Submarino Drone"
 sp_drone_submarine_desc: "La guerra subsuperficial se desplaza hacia la persistencia y la negación, y no solo hacia la potencia de fuego bruta. Al desarrollar plataformas submarinas no tripuladas, podemos mantener una presencia submarina continua sin arriesgar tripulaciones ni activos de alto valor. Estos submarinos dron nos permiten vigilar, perturbar y disputar áreas marítimas clave operando por debajo del umbral de la escalada convencional."
 sp_modern_sail_ships: "Naves de alta calidad modernos"
 sp_modern_sail_ships_desc: "El aumento de la demanda de energía y la logística naval prolongada nos obligan a reconsiderar cómo operan nuestras flotas de apoyo. Al reintroducir diseños modernos asistidos por velas en ciertos buques, podemos reducir el consumo de combustible sin perder confiabilidad operativa."
 sp_drone_patrol_boat: "Barcos de Patrulla Drone"
 sp_drone_patrol_boat_desc: "Las tareas de seguridad costera y patrulla marítima están cada vez más exigidas por la falta de personal y las crecientes demandas operativas. Con lanchas patrulleras no tripuladas podemos mantener una presencia constante en las zonas costeras y litorales clave sin comprometer buques de guerra más grandes. Estas plataformas permiten vigilar, disuadir y responder a amenazas de baja intensidad con más eficiencia y flexibilidad."
 sp_drone_corvette: "Corvettes secos"
 sp_drone_corvette_desc: "A medida que los enfrentamientos navales se vuelven más distribuidos y arriesgados, se reconsidera el papel de los combatientes de superficie más pequeños. Al invertir en corbetas no tripuladas o de tripulación opcional, podemos proyectar fuerza y mantener el control del mar sin exponer tripulaciones a peligros innecesarios."
 sp_rail_gun_naval_battery: "Batería de arma naval"
 sp_rail_gun_naval_battery_desc: "Mientras los primeros conceptos de cañón de riel se centraban en disparos únicos de gran impacto, el combate naval en evolución exige un fuego sostenido y flexible. Al desarrollar una batería de cañón de riel de varios cañones, pasamos a una mayor cadencia de fuego y una mejor saturación de blancos."
 sp_nuclear_torpedoes: "Torpedos nucleares"
 sp_nuclear_torpedoes_desc: "A medida que la disuasión naval se desplaza hacia el dominio submarino, las cargas convencionales por sí solas pueden dejar de bastar. Al desarrollar torpedos de armamento nuclear, incorporamos un arma capaz de negar vastas áreas marítimas y de contrarrestar de forma decisiva a las formaciones navales de alto valor."
 sp_fusion_reactor_engine: "Fusion Reactor Motor"
 sp_fusion_reactor_engine_desc: "La creciente demanda de energía de los sistemas navales modernos lleva al límite la propulsión y la generación de energía convencionales. Al invertir en motores de reactor de fusión para nuestros buques, buscamos respaldar armas, sensores y propulsión avanzados sin sacrificar autonomía. Este proyecto sienta las bases de una nueva generación de plataformas navales de alta energía y asegura la superioridad operativa en el mar a largo plazo."
 sp_naval_swarm_module: "Sistemas navales de lanzamiento de drones de enjambre"
 sp_naval_swarm_module_desc: "Con la integración de sistemas modulares de lanzamiento a bordo de buques de superficie, las plataformas navales ganan la capacidad de desplegar gran cantidad de drones autónomos para misiones de reconocimiento, guerra electrónica y ataque. Estos sistemas de enjambre amplían el alcance de los sensores del buque, abruman las defensas enemigas y dan una proyección de fuerza flexible sin exponer al buque anfitrión al combate directo."
 sp_radar_jamming_module: "Sistemas navales de interferencia de radar"
 sp_radar_jamming_module_desc: "Al emplear conjuntos avanzados de guerra electrónica diseñados para perturbar y degradar los radares enemigos, los buques de superficie pueden ocultar su posición y movimientos reales en el mar. Estos sistemas de interferencia estorban la adquisición de blancos y el control de fuego, reducen la eficacia de los sensores hostiles y aumentan la supervivencia en los enfrentamientos navales."
 sp_anti_torpedo_module: "Sistemas navales anti-Torpedo"
 sp_anti_torpedo_module_desc: "Al emplear conjuntos dedicados de defensa antitorpedo diseñados para detectar, clasificar y neutralizar amenazas submarinas entrantes, los buques de superficie pueden reducir el riesgo de los torpedos modernos durante el tránsito y el combate. Estos sistemas combinan seguimiento rápido por sonar, despliegue automático de contramedidas y soluciones de interceptación para perturbar el guiado y derrotar a los torpedos antes del impacto, y mejoran la supervivencia en aguas disputadas."
 sp_anti_ship_drone_missile: "Misiles contra el cuero cabelludo"
 sp_anti_ship_drone_missile_desc: "Las capacidades de ataque naval se definen cada vez más por el alcance, la precisión y la supervivencia. Al desarrollar sistemas de misiles antibuque basados en drones, podemos ampliar nuestra capacidad de amenazar buques hostiles y reducir el riesgo para las aeronaves tripuladas."
 sp_hover_helicopter_engine: "Motores de helicópteros portátiles"
 sp_hover_helicopter_engine_desc: "Los entornos urbanos y el terreno confinado plantean nuevas exigencias a la aviación de ala rotatoria. Al desarrollar sistemas de motor con capacidad de sustentación, buscamos mejorar la estabilidad a baja velocidad y el control vertical durante operaciones complejas."
 sp_hypersonic_engine: "Sistemas de propulsión hipersónica"
 sp_hypersonic_engine_desc: "La superioridad aérea depende cada vez más de la velocidad, el alcance y la capacidad de penetrar espacios aéreos defendidos. Al invertir en sistemas de propulsión hipersónica, buscamos superar los límites del rendimiento de las aeronaves convencionales."
 sp_awacs_project: "Sistema de alerta y control aerotransportado"
 sp_awacs_project_desc: "Con la creciente complejidad de las operaciones aéreas modernas, los sistemas de alerta y control aerotransportados se han vuelto una capacidad crítica de las fuerzas aéreas avanzadas. Al montar potentes arreglos de radar y sistemas de mando en plataformas aéreas de larga autonomía."
 sp_fiber_drones: "Fibra óptica Drone guiado"
 sp_fiber_drones_desc: "Con el rápido desarrollo de los sistemas no tripulados y la guerra electrónica, los drones guiados por fibra óptica han surgido como solución contra la interferencia y la perturbación de señales. Al transmitir las señales de control por enlaces físicos de fibra y no por radio, estos drones pueden operar con confiabilidad en entornos disputados sin perder el control preciso de su carga."
 sp_air_railguns: "Air-to-Air"
 sp_air_railguns_desc: "Con la búsqueda continua de mayores velocidades de empeño y alcances de interceptación ampliados, se han propuesto los cañones de riel aire-aire como alternativa a los sistemas de misiles convencionales."
 sp_air_railguns_helicopter: "Helicóptero Railgun"
 sp_air_railguns_helicopter_desc: "Al integrar cañones electromagnéticos compactos en plataformas de ala rotatoria, los helicópteros pueden dar fuego de muy alta velocidad capaz de penetrar blancos endurecidos que normalmente exigirían aeronaves o sistemas terrestres más pesados."
 sp_space_artillery: "Soporte de fuego orbital"
 sp_space_artillery_desc: "Con la creciente integración de sistemas espaciales en la guerra moderna, ha surgido el concepto de apoyo de fuego orbital como medio de dar ataques de precisión desde el espacio contra blancos terrestres."
 sp_air_pdl: "Lasers de Defensa de Puntos"
 sp_air_pdl_desc: "Con la creciente amenaza de misiles de alta velocidad y ataques de saturación, los láseres aerotransportados de defensa puntual permiten interceptar amenazas entrantes a la velocidad de la luz. Al montar sistemas láser de alta energía en plataformas aéreas, estas armas pueden enfrentar y neutralizar misiles en vuelo, reducir la dependencia de las existencias limitadas de interceptores y mejorar la supervivencia en espacios aéreos disputados."
 sp_air_helicopter_drone_control: "Control de helicópteros"
 sp_air_helicopter_drone_control_desc: "Integrar una arquitectura completa de control de drones en las plataformas de ala rotatoria convierte a los helicópteros en nodos de mando aéreos para medios no tripulados de reconocimiento y ataque. Este enfoque reduce la necesidad de arriesgar tripulaciones en tareas de exposición rutinaria y mejora la coordinación, la designación y el ritmo en todo el espacio de batalla. La capacidad es cara de desplegar y exige aviónica avanzada, enlaces de datos seguros y capacidad adicional de energía y refrigeración."
 sp_air_gunship_railcannons: "Ametralladoras Railcannons"
 sp_air_gunship_railcannons_desc: "Este proyecto monta grandes arreglos de cañones de riel en células de aeronaves artilladas dedicadas, y crea una aeronave capaz de destrozar blancos con fuego electromagnético sostenido. Con velocidad de boca extrema y control de fuego de precisión, puede desmantelar drones, aeronaves y formaciones terrestres más rápido de lo que pueden reaccionar los cañones convencionales. La capacidad es ruinosamente cara y exige una generación de energía excepcional, refrigeración avanzada y materiales de primer nivel para mantener operativo el sistema."
 sp_deep_sea_mining: "Profunda Minería de Mar"
 sp_deep_sea_mining_desc: "Las crecientes demandas industriales y tecnológicas presionan cada vez más las cadenas de suministro de recursos tradicionales. Al invertir en capacidades de minería de aguas profundas, buscamos asegurar el acceso a minerales críticos ubicados más allá de las zonas de extracción convencionales."
 sp_agriculture_drone: "Agropecuario Sistemas de eliminación"
 sp_agriculture_drone_desc: "Alimentar a una población creciente sin perder eficiencia se está volviendo un desafío estratégico central. Al introducir sistemas avanzados de drones agrícolas, podemos modernizar las prácticas agrícolas con mejor monitoreo, tratamiento de precisión y automatización."
 sp_vertical_farming: "Agricultura vertical"
 sp_vertical_farming_desc: "La urbanización y la escasez de tierra están cambiando la forma de abordar la producción de alimentos. Al invertir en agricultura vertical, trasladamos la producción agrícola a entornos controlados y de alta densidad, menos dependientes del clima y la geografía."
 sp_robotic_humanoid: "Auxiliares robóticos domésticos"
 sp_robotic_humanoid_desc: "A medida que la vida diaria se integra más con la tecnología, crece el potencial de que los robots humanoides ayuden a las personas en sus hogares. Al desarrollar asistentes robóticos domésticos, buscamos apoyar tareas cotidianas como el mantenimiento del hogar, el cuidado de personas y la asistencia personal."
 sp_robotic_surgery: "Cirugía robótica"
 sp_robotic_surgery_desc: "Los sistemas médicos sufren una presión creciente por el envejecimiento de la población y la mayor demanda de atención sanitaria. Al ampliar el uso de la cirugía asistida por robots, buscamos mejorar la precisión, reducir los tiempos de recuperación y hacer más accesibles los procedimientos avanzados."
 sp_smart_grid: "Infraestructura de red inteligente"
 sp_smart_grid_desc: "El creciente consumo de energía y la integración de tecnologías avanzadas imponen nuevas exigencias a las redes eléctricas nacionales. Al invertir en infraestructura de red inteligente, podemos gestionar mejor la distribución de electricidad, equilibrar la oferta y la demanda y reducir las ineficiencias sistémicas."
 sp_equipment_recycling: "Programa de reciclaje de equipo militar"
 sp_equipment_recycling_desc: "Un programa integral para recuperar, reacondicionar y reciclar equipo militar obsoleto o dañado. Al reaprovechar materiales y componentes críticos de plataformas dadas de baja, las fuerzas armadas pueden aliviar la presión industrial, mejorar la resiliencia del abastecimiento y compensar en parte las pérdidas de producción durante conflictos prolongados."
 sp_epigenetic_reprogramming: "Epigenetic Reprogramming"
 sp_epigenetic_reprogramming_desc: "Un programa de investigación biomédica centrado en alterar la expresión de los genes sin modificar las secuencias de ADN, con el fin de mejorar la resistencia física, el rendimiento cognitivo y la recuperación del personal militar. Aunque ofrece posibles ventajas a largo plazo en eficiencia de entrenamiento y preparación para el combate, plantea dilemas éticos y exige una estricta supervisión regulatoria."
 sp_nuclear_energy: "Reactor de energía nuclear"
 sp_nuclear_energy_desc: "Los reactores nucleares sirven para producir materiales para bombas. Pero la energía que generan podría abastecer en cambio a la industria civil y militar."
 sp_nuclear_bomb: "Proyecto de bomba nuclear de fisión"
 sp_nuclear_bomb_desc: "Una bomba que usa la fisión nuclear para liberar la energía almacenada del átomo en un solo instante apocalíptico. Con un arma así en nuestro arsenal, ¿quién se atrevería a oponerse a nosotros?"
 sp_amws_combat_system: "AMWS-21 Combat System"
 sp_zamws_advanced_mws: "XAMWS-24 Sistema avanzado de armas múltiples"
 sp_xciws_close_in_weapon_system: "XCIWS-2B Sistema de armas de defensa cercana"
 sp_close_range_battle_halberd: "Alabarda de combate cercano Tipo 77"
 sp_great_sword: "BWS-3 Great Sword"
 special_project_consumer_costs_high: "Contratación de recursos secretos"
 special_project_consumer_costs_high_desc: "Voces apagadas susurran que el gobierno desvía una enorme cantidad de suministros hacia lugares en apariencia inocuos. Algunos sugieren que los recursos se consumen en proyectos secretos de investigación y desarrollo, pero casi no hay pruebas concretas que lo confirmen..."
 special_project_consumer_costs_medium: "Contratación de recursos secretos"
 special_project_consumer_costs_medium_desc: "$special_project_consumer_costs_high_desc$"
 special_project_consumer_costs_low: "Contratación de recursos secretos"
 special_project_consumer_costs_low_desc: "$special_project_consumer_costs_high_desc$"
 sp_tag_eh_portal_research: "Portal Proyectos de investigación"
 sp_tag_eh_mech_research: "Proyectos de investigación Mech"
 sp_tag_eh_portal_research_speed_factor: "$sp_tag_eh_portal_research$ Velocidad"
 sp_tag_eh_mech_research_speed_factor: "$sp_tag_eh_mech_research$ Velocidad"
 sp_biofuel_e10_blend: "E10 Ethanol Blending"
 sp_biofuel_e10_blend_desc: "Mezclar etanol con petróleo a una concentración del 10% es una tecnología probada y desplegada comercialmente, que se usa en miles de millones de vehículos en todo el mundo. Estandarizar la infraestructura de producción de E10 reduce nuestra dependencia del combustible fósil importado, canaliza el excedente agrícola hacia la matriz energética y solo exige modificaciones menores a las refinerías y redes de distribución existentes."
 sp_biofuel_flexfuel_butanol: "Combustible flexible y síntesis de butanol"
 sp_biofuel_flexfuel_butanol_desc: "Sobre la mezcla estandarizada de etanol, este programa sigue dos vías paralelas. Los motores de combustible flexible toleran E85 y mezclas similares con mucho etanol, y así la compatibilidad del vehículo deja de depender de la proporción de mezcla. El biobutanol ofrece mayor densidad energética y un arranque en frío más cercano al de la gasolina, pero la producción a escala sigue siendo un problema de ingeniería sin resolver. Un programa exitoso pondría a nuestro sector de refinación por delante del mercado mundial."
 sp_nuclear_bomb_tt: "Desbloquea la capacidad de construir §Ybombas nucleares§!"
 sp_caterpillar_3512b: "Motor diésel Caterpillar 3512B"
 sp_caterpillar_3512b_desc: "El Caterpillar 3512B es un motor diésel potente y confiable que se ha usado ampliamente en diversas aplicaciones, como buques, generación de energía y maquinaria pesada. Su diseño robusto y su alto rendimiento lo hacen ideal para alimentar equipos en las duras condiciones de la Antártida."
 sp_premium_living_quarters: "Cuartel de vida Premium"
 sp_premium_living_quarters_desc: "Estos alojamientos de primera ofrecen mayor comodidad y servicios al personal destinado en la Antártida, y mejoran la satisfacción y la productividad de la estación."
 sp_drone_surface_combatant: "Combatientes autónomos"
 sp_drone_surface_combatant_desc: "A medida que cuesta más reclutar y retener tripulaciones, los combatientes de superficie más grandes se rediseñan en torno a la automatización. Las fragatas y destructores de tripulación opcional nos permiten sostener una presencia de aguas azules con una fracción del personal, a cambio de una mayor dependencia de la electrónica avanzada."
 sp_space_program: "Programa espacial"
 sp_space_program_desc: "Todos quieren llegar al espacio, excepto Polonia. Polonia no puede al espacio."
 sp_space_weapons_desc: "Lo que antes era ciencia ficción: nuestros científicos por fin han empezado a diseñar KILLSAT y otro armamento que puede usarse en el vacío del espacio. Poder emplear estas armas no solo nos hará más fuertes en defensa, sino también en ataque, pues podremos interceptar, perturbar y frenar a las potencias hostiles en las estrellas."
 sp_CNRP: "Polímero reforzado con nanotubos de carbono"
 sp_CNRP_desc: "Incrustar redes de nanotubos de carbono en compuestos aeroespaciales da materiales de célula más fuertes y ligeros que la fibra de carbono convencional. El ahorro de peso se traduce directamente en más alcance, carga útil y durabilidad estructural."
