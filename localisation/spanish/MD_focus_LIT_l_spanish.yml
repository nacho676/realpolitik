l_spanish:
 lithuania.1.t: "La cuestión de Mažeiki 3000 Nafta"
 lithuania.1.d: "La única refinería de petróleo de Lituania, Mažeikiú Nafta, se ha convertido en un punto de inflamación geopolítico. Tanto el gigante polaco PKN Orlen como un consorcio ruso han expresado interés en adquirir la instalación. Mantenerlo en manos estatales sigue siendo una opción, aunque costosa."
 lithuania.1.a: "Vender a PKN Orlen"
 lithuania.1.b: "Vender al consorcio ruso"
 lithuania.1.c: "Mantenerlo nacionalizado"
 lithuania.2.t: "PKN Orlen adquiere la refinería lituana"
 lithuania.2.d: "PKN Orlen ha completado la adquisición de la refinería Mažeiki^ Nafta de Lituania, ampliando los intereses energéticos polacos en la región báltica."
 lithuania.2.a: "Una inversión sólida"
 lithuania.3.t: "Fuego en Mažeikiai Refinery"
 lithuania.3.d: "Un fuego sospechoso se ha roto en la refinería de aceite Mažeikiai. El tiempo, poco después de la venta a los intereses rusos, ha alimentado la especulación sobre el sabotaje y planteado preguntas acerca de la seguridad de la infraestructura energética de Lituania."
 lithuania.3.a: "Apunte el dedo en Moscú"
 lithuania.3.b: "Inicie una investigación silenciosa"
 lithuania.10.t: "El futuro de Ignalina"
 lithuania.10.d: "La Unión Europea ha pedido a Lituania que cierre la central nuclear de Ignalina, hogar de dos reactores RBMK, el mismo diseño que falló en Chernobyl. El cierre es una condición de miembro de la UE, pero Ignalina suministra la mayor parte de la electricidad de Lituania. Una planta de sustitución podría construirse conjuntamente con Polonia y los Estados bálticos."
 lithuania.10.a: "Negociar un reemplazo conjunto con nuestros vecinos"
 lithuania.10.b: "Mantén a Ignalina corriendo"
 lithuania.10.c: "Cierralo sin un reemplazo"
 lithuania.11.t: "Propuesta de cooperación nuclear lituana"
 lithuania.11.d: "Lituania ha propuesto que Polonia cofinanciara la construcción de la planta de energía nuclear Visaginas para reemplazar la instalación de Ignalina envejecida. El proyecto fortalecería la independencia energética báltica y profundizaría los vínculos regionales, pero requiere una inversión significativa."
 lithuania.11.a: "Acuerda cofinanciar el proyecto"
 lithuania.11.b: "Tenemos otras prioridades"
 lithuania.12.t: "Polonia está de acuerdo con la cooperación nuclear"
 lithuania.12.d: "Polonia ha acordado cofinanciar la planta nuclear de Visaginas. La construcción puede comenzar, aunque el proyecto tardará años en completarse y requerirá recursos sustanciales."
 lithuania.12.a: "Inicio de la construcción"
 lithuania.13.t: "Polonia declina la cooperación nuclear"
 lithuania.13.d: "Polonia se ha negado a participar en el proyecto Visaginas. Lituania debe decidir ahora el destino de Ignalina por sí misma."
 lithuania.13.a: "Mantén a Ignalina corriendo a pesar de los riesgos"
 lithuania.13.b: "Cierra. Nos las arreglaremos sin"
 lithuania.14.t: "Visaginas Referendum de Planta Nuclear"
 lithuania.14.d: "Tras años de construcción, el proyecto Visaginas Nuclear Power Plant se enfrenta a un referéndum nacional. La opinión pública está dividida entre quienes la consideran esencial para la seguridad energética y los interesados en la seguridad nuclear y sobrecostos de costos."
 lithuania.14.a: "La gente aprueba la planta"
 lithuania.14.b: "La gente rechaza el proyecto"
 lithuania.15.t: "Planta de Visaginas Completada"
 lithuania.15.d: "La central nuclear de Visaginas Lituania-Polish está en funcionamiento. El proyecto representa un hito en la cooperación energética báltica y la independencia regional del gas ruso."
 lithuania.15.a: "Un triunfo de la cooperación"
 lithuania.16.t: "Presión internacional sobre Ignalina"
 lithuania.16.d: "La Unión Europea ha emitido una advertencia formal sobre el funcionamiento continuo de Lituania de la central nuclear de Ignalina. Las sanciones y la pérdida de fondos estructurales de la Unión Europea están sobre la mesa si los reactores de tipo Chernobyl no se cierran."
 lithuania.16.a: "No tenemos elección. Apágalo."
 lithuania.16.b: "Resistir la presión"
 LIT_refinery_sale_revenue: "Ingresos de venta de refinerías"
 LIT_refinery_sale_revenue_desc: "Los ingresos procedentes de la venta de Mažeikiicu Nafta están aportando un impulso temporal al presupuesto nacional."
 LIT_russian_energy_leverage: "Rusia de energía Leverage"
 LIT_russian_energy_leverage_desc: "La venta de la única refinería de Lituania para los intereses rusos ha dado a Moscú influencia económica sobre la política energética lituana."
 LIT_nationalized_refinery: "Refinería nacionalizada"
 LIT_nationalized_refinery_desc: "Lituania ha mantenido la propiedad estatal de Mažeiki 3000 Nafta, asegurando la seguridad de los recursos al costo de la eficiencia operacional."
 LIT_energy_deficit: "En materia de energía"
 LIT_energy_deficit_desc: "El cierre de la central nuclear de Ignalina sin un reemplazo ha dejado a Lituania dependiente de costosas importaciones de energía."
 LIT_visaginas_nuclear_plant: "Planta de energía nuclear Visaginas"
 LIT_visaginas_nuclear_plant_desc: "La nueva planta de Visaginas proporciona energía limpia y fiable y se encuentra como símbolo de la cooperación regional báltica."
 lithuania_news.1.t: "Mažeikių Nafta Sold"
 lithuania_news.1.d_poland: "Lituania ha vendido su única refinería de petróleo, Mažeikiú Nafta, al gigante polaco PKN Orlen. El acuerdo profundiza los lazos económicos Báltico-Polish y se ve en Bruselas como un paso hacia la reducción de la dependencia energética regional en Rusia."
 lithuania_news.1.d_russia: "Lituania ha vendido su única refinería de petróleo, Mažeikiú Nafta, a un consorcio respaldado por Rusia. Los críticos advierten que el acuerdo da a Moscú ventaja estratégica sobre la infraestructura energética lituana."
 lithuania_news.1.a: "Una piedra angular de nuestro futuro energético"
 lithuania_news.1.b: "Una buena expansión en el mercado báltico"
 lithuania_news.1.c: "Otro paso adelante en la región"
 lithuania_news.1.d: "Seguridad energética en los cambios Baltics"
 lithuania_news.1.e: "Una nota de pie de página en política energética europea"
 lithuania_news.2.t: "Planta nuclear de Ignalina Cerrada"
 lithuania_news.2.d: "Lituania ha cerrado la central nuclear de Ignalina, desmantelando el último de sus reactores RBMK de la era soviética. El cierre cumple con un requisito clave de adhesión a la UE, pero deja que el país dependa de las importaciones de energía hasta que se encuentre una fuente de sustitución."
 lithuania_news.2.a: "Las luces estarán encendidas, de alguna manera"
 lithuania_news.2.b: "Una victoria para la seguridad nuclear en Europa"
 lithuania_news.2.c: "Un reactor menos en el mundo"
 lithuania_news.3.t: "Planta nuclear de Visaginas Completada"
 lithuania_news.3.desc: "La nueva planta de energía nuclear Visaginas de Lituania ha venido en línea, construida con cofinanciamiento polaco. La instalación restablece la autosuficiencia energética del país y marca un logro histórico en la cooperación regional báltica."
 lithuania_news.3.a: "La independencia energética, por fin"
 lithuania_news.3.b: "Nuestra inversión en la región paga"
 lithuania_news.3.c: "Un nuevo capítulo para la política energética báltica"
 lithuania_news.3.d: "Los Bálticos aseguran su futuro energético"