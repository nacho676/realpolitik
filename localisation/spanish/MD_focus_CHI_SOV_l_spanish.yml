l_spanish:
 CHI_SOV_treaty_good_neighbourliness: "Tratado de buena vecindad sino-ruso"
 CHI_SOV_treaty_good_neighbourliness_desc: "El Tratado de buena vecindad y cooperación amistosa firmado en 2001 estableció la base jurídica para las relaciones China-Rusia modernas. La voluntad política renovada de actuar sobre sus disposiciones, el respeto mutuo, la no injerencia y la consulta sobre las principales cuestiones internacionales, abre la puerta a una generación de proyectos bilaterales que ningún país podría llevar a cabo en forma aislada."
 CHI_SOV_sco_framework: "Agenda de expansión SCO"
 CHI_SOV_sco_framework_desc: "La Organización de Cooperación de Shanghai fue fundada en 2001 por China y Rusia como sucesor de los Cinco de Shangai. Coordinar una agenda de expansión conjunta, basada en India, Pakistán, Irán y eventualmente Estados del Asia central, transforma la OCS desde un foro regional de seguridad en un auténtico contrapeso a las instituciones multilaterales occidentales."
 CHI_SOV_turn_to_east: "El Pivot de Rusia al Este"
 CHI_SOV_turn_to_east_desc: "El giro a la política oriental, acelerado después de 2014 por las sanciones occidentales, redirige el comercio ruso, la inversión y la atención diplomática hacia China y Asia-Pacífico. Formalizar esta reorientación en acuerdos económicos a largo plazo indica a la propia burocracia y comunidad empresarial de Moscú que el mercado occidental ya no es el punto de referencia principal para la prosperidad rusa."
 CHI_SOV_bri_russia_corridor: "Franja y la Ruta Corredor de Rusia"
 CHI_SOV_bri_russia_corridor_desc: "La red ferroviaria China-Europa ya dirige la mayor parte de su tonelaje terrestre por todo el territorio ruso a través del Ferrocarril Trans-Siberiano. Integrando este corredor en el marco de la Iniciativa Franja y la Ruta, con inversiones chinas en mejoramiento ferroviario ruso y procedimientos aduaneros simplificados en el cruce Zabaykalsk-Manzhouli, bloquea las dos economías en una infraestructura logística compartida."
 CHI_SOV_brics_coordination: "BRICS+ bloque de coordinación"
 CHI_SOV_brics_coordination_desc: "BRICS, Brasil, Rusia, India, China, Sudáfrica, ha evolucionado desde un acrónimo de Goldman Sachs hasta un foro multilateral en funcionamiento con su propio Nuevo Banco de Desarrollo y acuerdo de reserva monetaria. China y Rusia impulsan una expansión coordinada de BRICS+, admitiendo a Egipto, Etiopía, Irán y Arabia Saudita, crea una arquitectura económica paralela capaz de desafiar al FMI y el Banco Mundial como las instituciones predeterminadas del Sur Global."
 CHI_SOV_sco_antiterror: "SCO Centro Regional de Lucha contra el Terrorismo"
 CHI_SOV_sco_antiterror_desc: "La estructura regional antiterrorista, RATS, es el organismo dedicado contraterrorismo de la SCO con sede en Tashkent. La expansión conjunta China-Rusia de las capacidades de RATS, el intercambio de inteligencia, la coordinación rápida de respuesta y los ejercicios conjuntos de capacitación, amplía el alcance de la cooperación en materia de seguridad eurasiática en Asia Central y el Cáucaso, contrarrestando tanto las redes yihadistas como las operaciones de influencia encubierta de potencias externas."
 CHI_SOV_no_limits_partnership: "Sin límites de asociación estratégica"
 CHI_SOV_no_limits_partnership_desc: "La declaración conjunta emitida durante la visita de Xi Jinping a Moscú en febrero de 2022 declaró una amistad sin límites y una cooperación que no tiene zonas prohibidas. La declaración situó la relación bilateral por encima del nivel de cualquier alianza formal al detenerse a un tratado de defensa mutua, señalando a Washington y Bruselas que Beijing y Moscú consideran su alineación estratégica como una característica permanente del orden internacional."
 CHI_SOV_yuan_ruble_settlement: "Mecanismo de arreglo de Yuan-Ruble"
 CHI_SOV_yuan_ruble_settlement_desc: "China y Rusia han acelerado el cambio del comercio denominado en dólares, con la participación de los yuanes de los asentamientos de exportación rusos que aumentan bruscamente después de 2022 sanciones congelan el acceso ruso al SWIFT. El establecimiento de un mecanismo oficial de compensación bilateral entre el Banco Popular de China y el Banco de Rusia crea una infraestructura financiera paralela que aísla a ambas economías de la presión secundaria de sanciones."
 CHI_SOV_agricultural_corridor: "Corredor de Exportación Agrícola Primorye"
 CHI_SOV_agricultural_corridor_desc: "Las regiones del Lejano Oriente y Siberiana de Rusia poseen algunas de las mayores reservas mundiales de tierras cultivables, gran parte de ellas subutilizadas debido a la despoblación y falta de acceso al mercado. El corredor agrícola Primorye dirige granos rusos, soja y semillas de petróleo a través de cruces fronterizos dedicados hacia las provincias nororientales de China, proporcionando a Harbin y Shenyang una cadena segura de suministro de alimentos independiente de los mercados mundiales de productos básicos."
 CHI_SOV_russian_far_east_zone: "Russian Far East Free Puerto"
 CHI_SOV_russian_far_east_zone_desc: "El estado del Puerto Libre de Vladivostok, otorgado por Rusia en 2015, fue diseñado específicamente para atraer la inversión china y japonesa en el Extremo Oriente Ruso subdesarrollado. Las empresas estatales chinas que invierten en instalaciones portuarias, almacenamiento en frío y fabricación ligera en la Zona Económica Libre de Vladivostok crean un ancla comercial que bloquea el giro oriental de Rusia y proporciona a China un centro logístico del Pacífico fuera de sus propias fronteras."
 CHI_SOV_zarubino_port: "Acuerdo de Puerto del Pacífico Zarubino"
 CHI_SOV_zarubino_port_desc: "La terminal de carga a granel Zarubino en la costa del Pacífico de Rusia, cerca del tripunto donde se reúnen Rusia, China y Corea del Norte, ha sido propuesta como un proyecto de desarrollo conjunto desde el decenio de 1990. La inversión china en la ampliación de la capacidad de carga de granos y contenedores de Zarubino da a los exportadores chinos de la provincia de Jilin su ruta más corta a los carriles marítimos del Pacífico, mientras que proporcionar a Rusia capital chino para infraestructura Moscú no puede permitirse construir solo."
 CHI_SOV_trans_siberian_freight: "Expansión de carga transiberiana"
 CHI_SOV_trans_siberian_freight_desc: "El corredor Trans-Siberian Railway maneja decenas de miles de viajes de contenedores de carga entre China y Europa anualmente, con tiempos de tránsito de 12 a 15 días frente a 30 por mar. La inversión conjunta china-rusa en la electrificación de pistas, el doble seguimiento de las secciones del cuello de botella y los recortes de aduanas digitales integrados transitan hasta menos de 10 días y triplican el rendimiento, convirtiendo al Trans-Siberian en una auténtica alternativa al Canal de Suez para carga premium."
 CHI_SOV_timber_mineral_trade: "Madera Siberiana y Exportaciones Minerales"
 CHI_SOV_timber_mineral_trade_desc: "Siberia posee las mayores reservas de madera boreal del mundo y enormes depósitos de cobre, níquel, oro y elementos de tierra raras. Las empresas procesadoras chinas han establecido una posición dominante en la compra de madera siberiana, mientras que Norilsk Nickel y Polyus Gold exportan la mayoría de su producción a refinerías chinas. Formalizing these goods flows into long-term offtake agreements locks in both countries' positions in global resource supply chains."
 CHI_SOV_arctic_lng: "Contratos de absorción Yamal de GNL"
 CHI_SOV_arctic_lng_desc: "El proyecto Yamal LNG en la península de Yamal de Rusia, desarrollado por Novatek, cuenta con CNPC y el Fondo de Ruta de la Seda entre sus principales accionistas. Transportadores chinos de GNL, buques de clase de hielo construidos a propósito, recogen cargamentos desde el puerto de Sabetta todo el año. Los contratos de compra a largo plazo con CNOOC y CNPC aseguran el suministro de GNL de China al tiempo que proporciona a Novatek la financiación china que las sanciones occidentales han cortado."
 CHI_SOV_power_of_siberia_2: "Poder de Siberia 2 Pipeline"
 CHI_SOV_power_of_siberia_2_desc: "El poder de Siberia 2 se propone llevar gas desde los mismos campos siberianos occidentales que abastecen Europa, a través de Mongolia y al norte de China. Con una capacidad de 50 mil millones de metros cúbicos por año, convertiría al cliente de gas más grande de China Rusia en un amplio margen y le daría a Gazprom un contrato de anclaje para justificar la inversión continua en campos que de otro modo podrían estar varados."
 CHI_SOV_tianwan_nuclear: "Expansión de la estación nuclear de Tianwan"
 CHI_SOV_tianwan_nuclear_desc: "La central nuclear de Tianwan en Lianyungang, construida por Rosatom con una serie de contratos firmados a partir de 1997 es el mayor proyecto de cooperación técnica rusa-chinos en la historia. Unidades 7 y 8, firmadas en 2021, extienden la asociación a los 2030. Cada unidad Rosatom construida en China transfiere conocimiento del diseño de reactores, contratos de suministro de combustible y relaciones de mantenimiento que unen las dos industrias nucleares juntos durante décadas."
 CHI_SOV_huawei_russia: "Huawei 5G Rusia Rollout"
 CHI_SOV_huawei_russia_desc: "Huawei firmó acuerdos 5G con operadores de telecomunicaciones rusos incluyendo MTS, MegaFon y Rostelecom en 2019-2020. Con los proveedores occidentales de 5G excluidos de Rusia por preferencias de adquisición y sanciones posteriores, el dominio de Huawei de la acumulación de 5G rusa es esencialmente indiscutible. La infraestructura China 5G incrustada en la columna vertebral de comunicaciones de Rusia crea una dependencia técnica que profundiza la relación bilateral al nivel de infraestructura nacional crítica."
 CHI_SOV_beidou_glonass: "Acuerdo de navegación BeiDou-GLONASS"
 CHI_SOV_beidou_glonass_desc: "El BeiDou de China y el GLONASS de Rusia son los únicos dos sistemas de navegación por satélite independientes de la red GPS de Estados Unidos. Un acuerdo de interoperabilidad firmado entre las autoridades operativas de los dos sistemas en 2015 permite a los receptores civiles y militares utilizar señales de ambas constelaciones simultáneamente, mejorando la precisión de posición y, críticamente, proporcionando a ambos países una infraestructura de navegación redundante que no puede ser degradada por interferencias estadounidenses o orbitales."
 CHI_SOV_polar_silk_road: "Iniciativa Polar Silk Road"
 CHI_SOV_polar_silk_road_desc: "El documento de estrategia del Ártico de China, publicado en 2018, designó la Ruta del Mar del Norte como la Ruta Polar de la Seda, un tercer corredor del Franja y la Ruta junto a las rutas terrestres por Asia Central y la ruta marítima por el Océano Índico. La inversión china en infraestructura de transporte marítimo ártico, construcción de rompehielos en patios chinos y instalaciones portuarias a lo largo de la NSR transforma una ruta rusa estacional en un carril internacional todo el año controlado por empresas conjuntas Sino-Rusa."
 CHI_SOV_northern_sea_route: "Comercialización de la Ruta del Mar Norte"
 CHI_SOV_northern_sea_route_desc: "La Ruta del Mar del Norte, que recorre la costa ártica de Rusia desde el Estrecho de Bering hasta el Mar de Kara, corta la distancia entre Shanghai y Hamburgo en aproximadamente un 30% respecto a la ruta del Canal de Suez. Derribar hielo marino ártico se extiende la temporada navegable. La inversión conjunta china-rusa en la capacidad de escolta de rompehielos, la infraestructura de rescate de emergencia a lo largo de la ruta y los buques de contenedores dedicados de clase helada transforman la NSR de una opción estacional de nicho en una alternativa viable durante todo el año para cargas de alto valor."
 CHI_SOV_rosatom_export: "Paquete de exportación de Rosatom"
 CHI_SOV_rosatom_export_desc: "Rosatom es la empresa de energía nuclear más grande del mundo por órdenes internacionales de reactores, con más de 30 unidades en construcción o contratadas en el extranjero. Su diseño de reactores VVER, cadena de suministro de combustible y contratos de servicio a largo plazo son el vehículo principal mediante el cual Rusia proyecta influencia económica y técnica. Un paquete de exportación dedicado para compradores chinos, incorporando unidades VVER-1200, suministro de combustible mixto de óxido y capacitación conjunta para ingenieros nucleares chinos, incorpora la tecnología nuclear rusa en la infraestructura energética civil china para una generación."
 CHI_SOV_space_station: "Estación internacional de investigación lunar"
 CHI_SOV_space_station_desc: "La Estación Internacional de Investigación Lunar, anunciada conjuntamente por la CNSA y Roscosmos de Rusia en 2021, es el proyecto científico bilateral más ambicioso desde el programa espacial soviético. El ILRS prevé una instalación permanente de investigación robótica y eventualmente tripulada cerca del polo sur lunar, diseñada explícitamente como alternativa al programa Artemis de la NASA y abierta a la participación de terceros países. Su desarrollo conjunto une los dos programas espaciales a una arquitectura compartida para la próxima generación de exploración espacial."
 CHI_SOV_peace_mission: "Paz Misión Ejercicios conjuntos"
 CHI_SOV_peace_mission_desc: "Paz Misión es la serie de ejercicios militares conjuntos de la OCS, celebrada anualmente desde 2005 y girando entre los Estados miembros. Las fuerzas chinas y rusas han participado en cada iteración, con los ejercicios que se expanden desde escenarios antiterroristas hasta maniobras de armadura combinadas que involucran formaciones blindadas, apoyo aéreo cercano y coordinación de mando a nivel del cuerpo. La serie de ejercicios se ha convertido en el lugar principal para el desarrollo de la interoperabilidad del Ejército PLA-Ruso fuera de operaciones combinadas reales."
 CHI_SOV_advanced_arms_sales: "Paquete de exportación Su-35 y S-400"
 CHI_SOV_advanced_arms_sales_desc: "La adquisición por China de 24 combatientes multirole Sukhoi Su-35 en 2015 y un batallón conjunto de misiles superficie-aire S-400 Triumf en 2018 representaron las exportaciones de armas rusas más significativas a China desde el acuerdo Su-27 del decenio de 1990. Las ventas transfirieron la experiencia operacional con aviones de cuarta generación y defensa aérea integrada a largo plazo que la propia industria china aún no había coincidido, al tiempo que le proporcionó a Rosoboronexport un cliente premium en un momento en que su mercado occidental estaba cerrando."
 CHI_SOV_pacific_fleet_coord: "Acuerdo de coordinación de la flota del Pacífico"
 CHI_SOV_pacific_fleet_coord_desc: "El PLAN y la Flota del Pacífico de Rusia han realizado ejercicios navales coordinados en el Mar de Japón, el Mar de China Oriental y el Pacífico Occidental desde 2012. Las patrullas conjuntas en aguas adyacentes a Japón y la Península de Corea demuestran una presencia combinada que ninguna Armada podría sostener de forma independiente y enviar una señal deliberada al Comando del Pacífico estadounidense sobre el costo de cualquier confrontación con cualquiera de sus aguas de origen."
 CHI_SOV_defense_industrial: "Defensa Industrial Base Integración"
 CHI_SOV_defense_industrial_desc: "Las empresas de defensa estatales chinas han ido más allá de importar simplemente plataformas rusas hacia la producción con licencia y la ingeniería inversa. Las empresas mixtas en desarrollo aeromotor, el área donde la propia industria de China sigue más lejos, son las más estratégicamente significativas. El acceso chino a la tecnología rusa de turbofán para los motores WS-15 y WS-20 cierra la brecha con las fuerzas aéreas occidentales en una fracción del costo del desarrollo independiente, mientras que las empresas rusas ganan la escala de fabricación china."
 CHI_SOV_strategic_bomber_patrol: "Patrullas de Bomberos Estratégicos Conjuntos"
 CHI_SOV_strategic_bomber_patrol_desc: "En 2019 y 2023, los bombarderos rusos Tu-95MS Bear y los bombarderos estratégicos H-6K chinos volaron patrullas coordinadas sobre el Mar de Japón y el Mar de China Oriental, desencadenando ataques aéreos japoneses y surcoreanos. Las patrullas no son operaciones conjuntas en el sentido militar técnico, sino que demuestran un uso sincronizado de la fuerza aérea estratégica que indica la voluntad de ambos países de coordinar la presión sobre los adversarios compartidos. Los corredores de patrullas comunes profundizan la familiaridad a nivel de la tripulación y las normas de procedimiento compartidas."
 CHI_SOV_vostok_exercises: "Ejercicios estratégicos de Vostok"
 CHI_SOV_vostok_exercises_desc: "Vostok es la serie de ejercicios militares de nivel estratégico de Rusia, tradicionalmente centrada en el conflicto convencional a gran escala en el Lejano Oriente ruso. Las fuerzas chinas participaron en Vostok-2018 y una vez más en Vostok-2022, este último ocurrió semanas después del inicio de la guerra de Ucrania. La participación china mejora los ejercicios de un ensayo nacional en una demostración bilateral de armas combinadas, con elementos terrestres y de aviación del PLA integrados en estructuras de mando divisiones rusas."
 CHI_SOV_military_space: "Programa espacial militar conjunto"
 CHI_SOV_military_space_desc: "Tanto China como Rusia han desarrollado capacidades espaciales militares específicas, armas antisatélites, mermelada de navegación por satélite, satélites electrónicos de inteligencia y sistemas de alerta temprana basados en el espacio. Un programa conjunto que coordina las ranuras orbitales por satélite, los protocolos de intercambio de datos y la toma conjunta de conciencia sobre la situación espacial proporciona a ambos países un panorama más amplio de las operaciones espaciales estadounidenses y aliadas que cualquiera podría lograr independientemente, al tiempo que reduce el riesgo de colisión o escalación entre sus propios activos orbitales."
 SOV_chi_rare_earth_supply: "Componentes de la Tierra Rara China"
 SOV_chi_rare_earth_supply_desc: "China controla más del 80% de la capacidad mundial de refinación de tierras raras, incluyendo los compuestos de neodimio, lantano y disprosio esenciales para sistemas de guía de precisión, óptica nocturna y motores eléctricos de alto rendimiento. La formalización de la relación de suministro en el marco de cooperación industrial de defensa da a Uralvagonzavod acceso garantizado a insumos terrestres raros procesados por China, reduciendo costos de componente y mejorando la coherencia de calidad en las líneas de producción T-90 y Armata."
 CHI_sov_flanker_expertise: "Experiencia de generación Flanker"
 CHI_sov_flanker_expertise_desc: "La producción licenciada de Shenyang Aircraft Corporation de la familia Su-27 Flanker, que abarca las variantes J-11, J-15 y J-16, lo ha convertido en el constructor más experimentado del mundo de aviones de combate ruso-pedigree fuera de Rusia misma. El contrato de exportación Su-35 profundiza esta relación proporcionando acceso al motor AL-41F1S, la arquitectura de radar Irbis-E y los refinamientos aerodinámicos que informan a los propios programas de próxima generación de Shenyang. Aircraft roll off the Shenyang line carry measurable performance gains tracing directly to Sukhoi Design Bureau collaboration."
 CHI_SOV_military_tech_idea: "Transferencia de tecnología rusa de defensa"
 CHI_SOV_shared_modifier: "Alineación estratégica Sino-Rusa"
 CHI_SOV_shared_modifier_desc: "Un conjunto de compromisos bilaterales entre Beijing y Moscú que ajusta la economía china y el ejército a lo largo de la cooperación sino-rusa. Los vínculos más estrechos amplían la latitud política, la producción agrícola y de recursos, el alcance naval y la capacidad civil-industrial, mientras que la profundización de la asociación aumenta la buena voluntad comercial y restringe la seguridad fronteriza. El modificador escala con cada acuerdo importante ratificado entre las dos potencias."