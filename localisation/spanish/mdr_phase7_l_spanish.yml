l_spanish:
 # Guerra realista: capitulación por territorio y ánimo.
 mdr_national_resistance: "Resistencia nacional"
 mdr_national_resistance_desc: "Controlamos el §Y[?mdr_cap_t_pct|0]%§! de la población y la industria de nuestro territorio. Punto de quiebre por la moral: §Y[?mdr_cap_b_pct|0]%§!.\nCapitulamos cuando el enemigo ocupa el §Y[?mdr_cap_l_pct|0]%§! de nuestros puntos de victoria (sin contar otros modificadores).\n\nCon el 85% o más del territorio no podemos capitular, por más ciudades que caigan: el límite pasa del 100%. Por debajo, baja de a poco hasta el normal (80%) en el punto de quiebre y hasta el 30% cuando solo nos queda el 30% del territorio. Con menos del 30%, capitulamos.\nUn gran apoyo a la guerra baja el punto de quiebre (hasta 35%); una estabilidad muy baja lo sube (60%).\n\nDesertores la última semana: §R[?mdr_desertion_k|1]K§!\nHeridos que volvieron al frente el último mes: §G[?mdr_wnd_back_k|1]K§! (recuperación estimada según la ley de salud, sobre el total de bajas)"
 # Deserción
 mdr_military.2.t: "Nuestros soldados desertan"
 mdr_military.2.d: "La moral se hunde. Cada semana, cientos de soldados abandonan sus unidades y vuelven a casa o se esconden. Mientras el apoyo a la guerra siga por debajo del 30%, o la estabilidad por debajo del 30% mientras perdemos territorio, perderemos mano de obra.\n\nLos tribunales militares pueden frenar las deserciones, pero el castigo a nuestros propios soldados no le gustará a la población."
 mdr_military.2.a: "Tribunales militares para los desertores."
 mdr_military.2.b: "Hablarle a la nación para levantar la moral."
 mdr_military_tribunals: "Tribunales militares"
 mdr_military_tribunals_desc: "Juzgamos a los desertores con tribunales militares. Las deserciones se detienen durante 90 días, pero la población lo ve con malos ojos.\n\nLa semana pasada desertaron §R[?mdr_desertion_k|1]K§! soldados."
 # Armas nucleares
 mdr_nuclear_harvest: "Campos contaminados"
 mdr_nuclear_harvest_desc: "La explosión nuclear quemó y contaminó los campos. La cosecha de este estado cae a la mitad durante un año y medio."
 mdr_nuked_resolve: "Unidos tras el ataque nuclear"
 mdr_nuked_resolve_desc: "Fuimos atacados con un arma nuclear. La nación entera exige responder."
 mdr_nuke_outrage: "Usó un arma nuclear contra los nuestros"
 mdr_nuke_outrage_half: "Usó un arma nuclear contra los nuestros"
 mdr_nuke_condemnation: "Usó un arma nuclear"
 mdr_nuke_condemnation_half: "Usó un arma nuclear"
 mdr_nuke_concern: "Usó un arma nuclear"
 mdr_nuke_concern_half: "Usó un arma nuclear"
 mdr_nuclear.1.t: "¡Ataque nuclear!"
 mdr_nuclear.1.d: "[mdr_nuke_attacker.GetNameDefCap] lanzó un arma nuclear sobre [mdr_nuke_state.GetName], en [mdr_nuke_victim.GetNameDef]. Por primera vez desde 1945, una ciudad arde bajo un hongo atómico.\n\nLos aliados de [mdr_nuke_victim.GetNameDef] y los gobiernos afines exigen sanciones. Los países neutrales condenan el ataque, y hasta los gobiernos parecidos a [mdr_nuke_attacker.GetNameDef] toman distancia. Solo sus aliados guardan silencio.\nMuertos en el ataque: §R[?global.mdr_nuke_last_deaths_k|0]K§!. Muertos por armas nucleares y su radiación desde el comienzo: §R[?global.mdr_nuke_deaths_k|0]K§!. Radiación mundial: §Y[?global.mdr_rad_world|1]§! de 100."
 mdr_nuclear.1.a: "El mundo nunca volverá a ser el mismo."
 mdr_nuclear.1.b: "No nos dejaron otra opción."
 # Tratados internacionales en "Sistemas internacionales"
 MDR_TREATIES_TAB_TT: "Tratados internacionales"
 MDR_TREATIES_TAB_TT_DELAYED: "Firma, propón o abandona tratados de armas y del clima."
 MDR_TREATIES_PANEL_TITLE: "TRATADOS INTERNACIONALES"
 MDR_TREATIES_PANEL_INTRO: "Los tratados de armas limitan los arsenales a cambio de seguridad; sus efectos se suman en el modificador §YTratados de armas§!. Los climáticos bajan las emisiones y cuestan dinero a los países ricos. Salir de un tratado enoja a sus miembros, y salir de uno de armas sube la tensión mundial.\nCalentamiento global: §R+[?global.mdr_warming|2] °C§!"
