 SOO_invervention_rus: "La doctrina rusa de la intervención militar"
 SOO_help_ossetia_SOV: "Inversiones en §Y[SOO.GetNameWithFlag]§!"
 SOO_help_ossetia_SOV_desc: "Apoyaremos financieramente el Presupuesto de Osetia del Sur, ya que este estado no puede hacerlo por sí solo. Ingresos Adicionales: $§R-0.120§!"
 SOO_help_ossetia: "Inversiones del §Y[SOV.GetNameWithFlag]§!"
 SOO_help_ossetia_desc: "Rusia nos proporciona financiación y esto permite que nuestra economía se mantenga a flote. Ingresos adicionales: $$§G0.120§!"
 SOO_develop_turism: "Desarrollo de Turismo"
 SOO_develop_turism_desc: "Desarrollaremos el turismo interno, lo que debería aportar ingresos adicionales a nuestras arcas. Ingresos adicionales:  $§G0.100§!"
 SOO_Mamison_path: "Paso Mamison"
 SOO_Mamison_path_desc: ""
 SOO_hydroelectric_dams: "Sistemas de microcentrales hidroeléctricas"
 SOO_Tskhinvali_district: "Distrito de Tskhinvali"
 SOO_GAS_Electrical_lines: "Líneas de gas y electricidad"
 SOO_Java_townlet: "Pueblo Java"
 SOO_subsidise_the_Farmers: "Subvenciones para los agricultores"
 SOO_subsidise_the_Farmers_desc: "Nuestro país es muy pobre; necesitamos aprovechar todas las oportunidades para generar ingresos para el presupuesto. Intentaremos estimular a nuestros agricultores."
 SOO_Roki_Tunnel_tollage: "Reparar el túnel de Roki"
 SOO_Roki_Tunnel_tollage_desc: "Necesitamos reparar este túnel, porque es nuestra única conexión con Rusia."
 SOO_Tskhinvali_gas_and_electricity_network: "Abastecimiento de energía de Tskhinvali"
 SOO_Tskhinvali_gas_and_electricity_network_desc: "Proporcionaremos Tskhinvali con todo lo que necesita en términos de energía."
 SOO_Move_towards_cash_crop_growth: "Aumentar el volumen de comercio con Rusia"
 SOO_Move_towards_cash_crop_growth_desc: "Estamos listos para aumentar el suministro de nuestros productos agrícolas a Rusia."
 SOO_Rural_Revitalization: "Invertir en la restauración de infraestructuras"
 SOO_Rural_Revitalization_desc: "Necesitamos restaurar nuestros caminos, que han caído en desprendimiento durante muchos años."
 SOO_konserv_zavod: "Abrir una fábrica de conservas"
 SOO_konserv_zavod_desc: "Abriremos una cannería en nuestro país, proporcionando empleo a la gente y generando un beneficio saludable."
 SOO_Redevelop_the_Mamison_Pass: "Reurbanización del paso Mamison"
 SOO_Redevelop_the_Mamison_Pass_desc: "El Pase de Mamison es un paso montañoso en la frontera Ossetia-Rusia. El Camino Militar Ossetiano, construido por el Imperio Ruso entre 1854 y 1889, lo atraviesa, aunque hoy está fuertemente sobrevalorado por la Autopista Transcaucánica."
 SOO_The_Ergneti_market: "Mercado de Ergneti"
 SOO_The_Ergneti_market_desc: "Ergneti es un pueblo en las afueras de Tskhinvali situado en el lado georgiano de la frontera. Lo que comenzó como un lugar en el que los habitantes georgianos locales comprarían bienes rusos baratos se ha convertido en un mercado negro de todo tipo, donde se comercializan productos básicos procedentes de productos agrícolas a productos industriales. El mercado de Ergneti se ha convertido en la fuente de ingresos más fiable y sostenible para miles de osetios y georgianos por igual."
 SOO_Sponsor_the_Georgian_grey_market: "Patrocinador del mercado gris de Georgia"
 SOO_Sponsor_the_Georgian_grey_market_desc: "El mercado gris georgiano ha salido de la inundación de bienes rusos que fluyen hacia la región, y la mayor parte de ellos cruzan la frontera osetia desde la carretera transcaucánica. Patrocinar el mercado gris podría llevar a una fuente sin explotar de ingresos para un estado necesitado como el nuestro."
 SOO_fostering_economic_ties: "Fomentando los lazos económicos"
 SOO_fostering_economic_ties_desc: "Ergneti ha servido como un bloque de construcción hacia la paz entre Osetia del Sur y Georgia. Para mantenerse en un camino de crecimiento estable, debemos aprovechar la oportunidad para forjar vínculos más estrechos con el estado georgiano."
 SOO_tourism: "Turismo en Osetia del Sur"
 SOO_tourism_desc: "Nuestro país tiene hermosos paisajes y vistas. Es hora de desarrollar la infraestructura necesaria para que los turistas accedan a esta belleza."
 SOO_A_Shifting_market: "Mercado cambiante"
 SOO_A_Shifting_market_desc: "El gobierno georgiano ha cerrado el mercado. Debemos planear para el futuro de la nación y abordar este problema; con muchos que pierden su empleo, nos vemos obligados a adaptarse alineando con más ayuda rusa y un mayor enfoque en contraband y otras fuentes ilegales de comercio."
 SOO_Host_transit_tax: "Impuesto de tránsito del anfitrión"
 SOO_Host_transit_tax_desc: "El mercado Ergneti todavía funciona como un mercado negro. Para aprovechar nuestro ingreso sin explotar, podemos establecer un impuesto de tránsito en el lado ostia de la frontera. Esto puede ser una imposición inalcanzable para muchos, pero los ingresos permanecen dentro de nuestro propio estado en lugar de fluir hacia el vecino a través de la frontera."
 SOO_Promote_contraband: "Promover el contrabando"
 SOO_Promote_contraband_desc: "Con el cierre reciente del mercado por parte del gobierno georgiano, estamos obligados a generar ingresos por otros medios. Grandes partes de la población en ambos lados de la frontera se molestan con la retirada de Georgia del mercado. Ahora nos vemos forzados al comercio de mercancías contrabandistas."
 SOO_regulate_the_market: "Regulaciones del mercado"
 SOO_regulate_the_market_desc: "Las normas de mercado están obligadas a erradicar el comportamiento ilegal. Esto hará más atractivo que la parte georgiana mantenga abierta el mercado incluso en tiempos de cambio o crecientes tensiones."
 SOO_Districted_Oversight: "Supervisión del distrito"
 SOO_Districted_Oversight_desc: "Con esta nueva administración, el órgano rector de los territorios georgianos debe comenzar el proceso de integración de la población en las costumbres y leyes del estado ostia."
 SOO_Resilient_Commerce: "Comercio resiliente"
 SOO_Resilient_Commerce_desc: "Trataremos más activamente que antes para ampliar nuestro potencial económico."
 SOO_Raise_Import_Tariffs: "Aumentar los aranceles de importación"
 SOO_Raise_Import_Tariffs_desc: "Incrementaremos aranceles de importación para mejorar los ingresos de nuestro tesorería."
 SOO_the_Russian_bankroll: "Dejen entrar a los bancos rusos"
 SOO_the_Russian_bankroll_desc: "Tendremos que permitir que los bancos rusos entren en nuestro mercado para apoyar nuestra economía."
 SOO_new_developments_in_Kvaisa: "Energía de Osetia"
 SOO_new_developments_in_Kvaisa_desc: "Comenzaremos la construcción de una central eléctrica para garantizar nuestra seguridad energética."
 SOO_Boost_the_local_flour_production: "Inversiones en producción de harina"
 SOO_Boost_the_local_flour_production_desc: "Nuestro estado debe invertir en todos los sectores agrícolas, comenzando con la producción de harina local."
 SOO_Tractor_Imports: "Importación de Tractores"
 SOO_Tractor_Imports_desc: "Importaremos tractores para satisfacer las necesidades de nuestro sector agrícola."
 SOO_Forestry_Development: "Industria forestal"
 SOO_Forestry_Development_desc: "Trabajaremos para desarrollar nuestra industria forestal una vez más."
 SOO_increase_tolls_on_Roki_Tunnel: "Aumentan los peajes del túnel Roki"
 SOO_increase_tolls_on_Roki_Tunnel_desc: "Levantaremos los peajes cargados en el túnel Roki."
 SOO_South_Ossetian_State_University: "Universidad Estatal de Osetia del Sur"
 SOO_South_Ossetian_State_University_desc: "Nuestra república necesita las mejores mentes. Invertir en la educación superior asegurará nuestro futuro."
 SOO_Dzuarikau_Tskhinvali_pipeline: "Oleoducto reparado"
 SOO_Dzuarikau_Tskhinvali_pipeline_desc: "Este gasoducto es vital para nuestro suministro de energía."
 SOO_Develop_Tskhinvali: "Infraestructura de Tskhinvali"
 SOO_Develop_Tskhinvali_desc: "Las carreteras locales en Tskhinvali están claramente necesitadas de reparación."
 SOO_Develop_Java: "Restauración de Java"
 SOO_Develop_Java_desc: "Este acuerdo también necesita inversión financiera."
 SOO_Revive_soviet_era_works: "Revivir el legado soviético"
 SOO_Revive_soviet_era_works_desc: "Es hora de restaurar lo que se perdió y destruyó a lo largo de los años: el legado de la URSS."
 SOO_Develop_Gori: "Desarrollo de Gori"
 SOO_Develop_Gori_desc: "También deben desarrollarse los nuevos territorios de nuestra república."
 SOO_private_sector: "Sector privado"
 SOO_private_sector_desc: "Promoveremos el desarrollo del sector privado en toda nuestra república."
 SOO_Geared_for_hardship: "Dificultades de desarrollo"
 SOO_Geared_for_hardship_desc: "Tenemos un largo camino por recorrer para desarrollar y revivir nuestra economía, específicamente la agricultura."
 SOO_Gori_Tskhinvali_rail_link: "Ruta de transporte Gori - Tskhinvali"
 SOO_Gori_Tskhinvali_rail_link_desc: "Conectaremos nuestro nuevo territorio con el resto de la república."
 SOO_Ministry_of_internal_affairs: "Ministerio del Interior"
 SOO_Ministry_of_internal_affairs_desc: "Nuestra república debería poder dormir tranquilamente."
 SOO_Reinforce_Parliamentary_administration: "Cambiar la dirección del Parlamento"
 SOO_Reinforce_Parliamentary_administration_desc: "Es hora de nuevas personas en política."
 SOO_Dismantle_Parliamentary_Dominance: "La abolición del dominio del Parlamento"
 SOO_Dismantle_Parliamentary_Dominance_desc: "El Parlamento no debe gobernar el país por sí solo."
 SOO_Downplay_opposition_forces: "Suprimir la oposición"
 SOO_Downplay_opposition_forces_desc: "La oposición, en la forma que existe ahora, amenaza nuestra república y su estabilidad."
 SOO_banner_of_the_people: "Bandera del Pueblo"
 SOO_banner_of_the_people_desc: "Los verdaderos hijos de Osetia están dispuestos a defender nuestro país."
 SOO_Political_independent: "Independencia política"
 SOO_Political_independent_desc: "Nuestra política estará menos sujeta a la influencia de cualquier persona o grupo."
 SOO_Defenders_of_the_Fatherland: "Defensores de la patria"
 SOO_Defenders_of_the_Fatherland_desc: "Nuestros combatientes lucharán hasta el final por nuestra patria."
 SOO_Evaluate_the_existing_constitution: "Evaluar la Constitución actual"
 SOO_Evaluate_the_existing_constitution_desc: "¿Tal vez es hora de cambiar la constitución existente?"
 SOO_Allow_presidential_constitution_changes: "Enmienda constitucional presidencial"
 SOO_Allow_presidential_constitution_changes_desc: "Nuestro presidente tiene su propia visión para la constitución."
 SOO_The_Regal_Relinquishment: "Nueva vida política"
 SOO_The_Regal_Relinquishment_desc: "Es hora de respirar nueva vida en el paisaje político de nuestra república."
 SOO_Reform_the_distribution_of_farmland: "Reforma Agrícola"
 SOO_Reform_the_distribution_of_farmland_desc: "La principal fuente de nuestros ingresos son los productos agrícolas. Debemos reformar esta industria sabiamente."
 SOO_The_Kremlin_state: "Estado pro-Kremlin"
 SOO_The_Kremlin_state_desc: "No tenemos más aliados que Rusia."
 SOO_Ossetian_Patriotism_Reforms: "Patriotismo Oseta"
 SOO_Ossetian_Patriotism_Reforms_desc: "Todos deben estar conscientes de su deber y listos para luchar por nuestra patria."
 SOO_adopted_a_new_constitution: "Nueva Constitución"
 SOO_adopted_a_new_constitution_desc: "Es hora de adoptar una nueva constitución."
 SOO_Enduring_the_Sovereignty_Fight: "Continuar la lucha por la independencia"
 SOO_Enduring_the_Sovereignty_Fight_desc: "Mientras no seamos parte de Rusia, tendremos que luchar por nuestra independencia."
 SOO_pro_russian: "Curso prorruso"
 SOO_pro_russian_desc: "Nuestro objetivo final es la reunificación con nuestros hermanos en Ossetia del Norte y con Rusia."
 SOO_integrate_to_russian_army: "Integración en el ejército ruso"
 SOO_integrate_to_russian_army_desc: "Estamos listos para integrarnos plenamente en el ejército ruso."
 SOO_referendum: "Referéndum sobre la adhesión a Rusia"
 SOO_referendum_desc: "Hemos estado trabajando para esto durante mucho tiempo. Es hora de celebrar este referéndum."
 SOO_invest: "Inversiones en nuestra economía"
 SOO_invest_desc: "Rusia está generosamente dispuesta a invertir en nuestra economía."
 SOO_rosbanks: "Bancos rusos"
 SOO_rosbanks_desc: "Los bancos rusos están listos para entrar en nuestro territorio. Esto fortalecerá nuestra economía."
 SOO_inverv_warfrare: "La doctrina rusa de la intervención militar"
 SOO_inverv_warfrare_desc: "Seguiremos la doctrina militar de nuestro país y participaremos activamente en los conflictos mundiales."
 SOO_fight_start: "Comienza la lucha por la libertad de Osetia"
 SOO_fight_start_desc: "El clan Tadeev ha aterrorizado a nuestro país durante demasiado tiempo. Es hora de lidiar con ellos."
 SOO_fight_narcota: "Detener la distribución de drogas"
 SOO_fight_narcota_desc: "Eliminaremos a todas las personas asociadas con los Tedeev que estén involucradas en el tráfico de drogas."
 SOO_fight_contrabanda: "Cómo acabar con el contrabando ilegal"
 SOO_fight_contrabanda_desc: "Las redes de contrabando de Tadeev serán destruidas para siempre."
 SOO_fight_alchohol: "Supresión del alcohol ilegal"
 SOO_fight_alchohol_desc: "El alcohol ilegal ya no aparecerá en nuestro país."
 SOO_fight_reket: "Superar el racket"
 SOO_fight_reket_desc: "Pondremos fin a sus intentos de extorsionar empresarios en nuestro país."
 SOO_fight_orujie: "Destruir los canales de contrabando de armas"
 SOO_fight_orujie_desc: "Las armas ya no fluirán por nuestro país ilegalmente."
 SOO_fight_tamojnia: "Eliminar a los funcionarios de aduanas corruptos"
 SOO_fight_tamojnia_desc: "Quitaremos a todos los empleados desleales de nuestro servicio aduanero."
 SOO_fight_kgb: "Cómo hacer frente a la corrupción en el KGB"
 SOO_fight_kgb_desc: "Incluso dentro de la KGB, los Tadeevs encontraron a gente que podía ser sobornada. Es hora de terminar con esto."
 SOO_fight_minor: "Sacar a los funcionarios corruptos del Ministerio de Educación"
 SOO_fight_minor_desc: "El último informante de Tadeev se encuentra en el Ministerio de Educación, dando al clan una posición sobre el país. Es hora de lidiar con ella."
 SOO_end_fight: "Liberar el país"
 SOO_end_fight_desc: "Por último, nuestro país puede respirar un suspiro de paz."
 SOO_prepare_for_war: "Preparándose para la guerra"
 SOO_prepare_for_war_desc: "La guerra es inevitable. Debemos estar listos para ello."
 SOO_call_abkhazia: "Llamamiento a Abjasia"
 SOO_call_abkhazia_desc: "Nosotros y los abjasios debemos unirnos para contrarrestar la amenaza de Georgia."
 SOO_establish_connection_with_kavkaz: "Unión con Chechenia"
 SOO_establish_connection_with_kavkaz_desc: "Tal vez los chechenos nos ayuden de nuevo, como lo hicieron en los años 90."
 SOO_ossetia_at_war: "Experiencia en el campo de batalla"
 SOO_ossetia_at_war_desc: "En este momento, en el campo de batalla, nos estamos volviendo más fuertes y más experimentados."
 SOO_lessons_from_war: "Lecciones de guerra"
 SOO_lessons_from_war_desc: "La experiencia de esta guerra nos ha enseñado mucho."
 SOO_new_defences: "Nuevas inversiones militares"
 SOO_new_defences_desc: "Aumentaremos nuestras inversiones en el sector militar."
 SOO_doctrine_update: "Doctrina Militar Actualizada"
 SOO_doctrine_update_desc: "Nuestra doctrina militar necesita algún ajuste."
 SOO_north_ossetia_ratnik: "Equipar completamente al ejército con un 'Ratnik'"
 SOO_north_ossetia_ratnik_desc: "El equipamiento militar ruso será la mejor opción para nuestro ejército"
 SOO_submission_to_the_russian_doctrine: "Sumisión a la doctrina rusa"
 SOO_submission_to_the_russian_doctrine_desc: "Pasaremos completamente a la Doctrina Rusa."
 SOO_Gori_pereseleniye: "Asentamiento de Gori"
 SOO_Gori_pereseleniye_desc: "Permitiremos que nuestros ciudadanos se establezcan en este territorio."
 SOO_foreign_relations: "Diplomacia internacional"
 SOO_foreign_relations_desc: "Necesitamos establecer relaciones internacionales."
 SOO_reinforce_sng2: "Socios del CEI-2"
 SOO_reinforce_sng2_desc: "Nuestros socios más cercanos son miembros de la CIS-2."
 SOO_russian_ms: "Cooperación con la industria militar rusa"
 SOO_russian_ms_desc: "El equipo militar ruso es la mejor opción para comprar, y el único."
 SOO_russian_arms: "Comprar tanques rusos"
 SOO_russian_arms_desc: "Con tanques rusos, podemos ir a cualquier parte."
 SOO_transnistria_accept: "Contrabando desde Transnistria"
 SOO_transnistria_accept_desc: "Los depósitos de armas de Pridnestroviano serán de gran interés para nuestro país."
 SOO_abkahz_relations: "Mejorar las relaciones con los abjasios"
 SOO_abkahz_relations_desc: "Los abjasios y los osetios son hermanos para siempre."
 SOO_abkahz_def_pact: "Pacto defensivo con Abjasia"
 SOO_abkahz_def_pact_desc: "Debemos estar listos para defendernos junto con los abjasios."
 SOO_trade_abk_def: "Comercio con Abjasia"
 SOO_trade_abk_def_desc: "Es necesario establecer relaciones comerciales con Abjasia."
 SOO_syria_relations: "Pueblo fraterno sirio"
 SOO_syria_relations_desc: "Siria ha resultado ser un socio inesperado, uno con el que vale la pena establecer relaciones más estrechas."
 SOO_venez_relations: "Interacción con Venezuela"
 SOO_venez_relations_desc: "A pesar de la gran distancia, estamos listos para establecer la cooperación con Venezuela."
 SOO_shara_relat: "Interacción con el Sahara Meridional"
 SOO_shara_relat_desc: "A pesar de la gran distancia, estamos dispuestos a establecer una cooperación con el Sáhara Meridional."
 SOO_nikar_relations: "Interacción con Nicaragua"
 SOO_nikar_relations_desc: "A pesar de la gran distancia, estamos dispuestos a establecer una cooperación con Nicaragua."
 SOO_artsakh_relations: "Interacción con Artsaj"
 SOO_artsakh_relations_desc: "Nuestros socios y hermanos de Artsakh serán excelentes aliados."
 SOO_artsakh_volunteers: "Voluntarios de Artsakh"
 SOO_artsakh_volunteers_desc: "Los voluntarios de Artsakh han venido a ayudar a nuestro país."
 SOO_approach_armenia: "Apoya a Armenia"
 SOO_approach_armenia_desc: "Los armenios y nosotros somos pueblos hermanos, y nos ayudaremos mutuamente en todo."
 SOO_economic_pizda: "Inversiones rusas"
 SOO_economic_pizda_desc: "Rusia está dispuesta a invertir en nuestro país."
 SOO_nykhaz_russian_partnership: "Desarrollo de la asociación con Rusia"
 SOO_nykhaz_russian_partnership_desc: "Ampliaremos nuestra asociación con Rusia."
 SOO_further_integr_osset: "Integración con Osetia del Norte"
 SOO_further_integr_osset_desc: "Estamos listos para la integración con Ossetia del Norte."
 SOO_podchistit_polit_pole: "Limpiar el campo político"
 SOO_podchistit_polit_pole_desc: "Es hora de limpiar a nuestros enemigos políticos."
 SOO_north_ssetian_dobrovol_army: "Voluntarios de Osetia del Norte"
 SOO_north_ssetian_dobrovol_army_desc: "Muchos voluntarios de Ossetia del Norte han venido a nuestro país."
 SOO_new_ak_rifles: "Licencia para nuevos modelos de Kalashnikov"
 SOO_new_ak_rifles_desc: "Estamos listos para comenzar la producción con licencia de los últimos modelos de rifles de asalto Kalashnikov en nuestro territorio."
 SOO_iron_Iroon: "Hierro Alanya"
 SOO_iron_Iroon_desc: "Seremos tan fuertes como el acero que forjó las espadas y la armadura de nuestros antepasados: los Alans."
 SOO_native_faith: "Nuestra verdadera religión"
 SOO_native_faith_desc: "Es hora de que nuestro pueblo abra sus ojos y acepte la verdadera religión."
