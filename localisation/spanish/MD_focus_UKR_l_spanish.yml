 ukraine_nato_help.1.d: "[GetUKRNatoAidDonorLine]"
 ukraine_nato_help.1.a: "Tomar acciones"
 ukraine_parliament.100.d: "El Bloque Pro-Ruso en nuestro Parlamento ha ganado la mayoría de los escaños en nuestro parlamento, como resultado del alto nivel de influencia que el gobierno ruso tiene actualmente sobre Ucrania."
 ukraine_parliament.100.t: "El bloque pro-ruso gana la mayoría de los asientos"
 ukraine_parliament.100.a: "Veamos cómo lo hacen."
 ukraine_parliament.200.d: "El bloque pro-occidental en nuestro parlamento ha ganado la mayoría de los escaños en nuestro parlamento, como resultado del alto nivel de influencia que el gobierno estadounidense tiene actualmente sobre Ucrania."
 ukraine_parliament.200.t: "Bloque Pro-Oeste gana la mayoría de los asientos"
 ukraine_parliament.200.a: "Veamos cómo lo hacen."
 ukraine_parliament.300.t: "Bloque Pro-Ucraniano Gana la Mayoría de los Escaños"
 ukraine_parliament.300.d: "El Bloque Pro-Ucraniano en nuestro parlamento ha ganado la mayoría de los escaños en las elecciones recientes, y esto se debe a la influencia vacilante del gobierno estadounidense y el gobierno ruso."
 ukraine_parliament.300.a: "Veamos cómo lo hacen."
 ukraine_parliament.400.t: "Elecciones Parlamentarias"
 ukraine_parliament.400.d: "La temporada electoral ha llegado una vez más, y las cabinas de votación en todo el país han comenzado a abrirse. Esperemos que la participación de los votantes sea lo suficientemente alta como para producir un buen cambio en la nación."
 ukraine_parliament.400.a: "Vamos a ver cómo va"
 ukraine_parliament.1.t: "El Parlamento aprueba la ley de Centralización"
 ukraine_parliament.1.d: "El Parlamento ha decidido aprobar un proyecto de ley que aumenta nuestro gasto burocrático, siguiendo una propuesta que hicimos hace unos días."
 ukraine_parliament.1.a: "Genial"
 ukraine_parliament.2.t: "El Parlamento rechaza la nueva ley de Centralización"
 ukraine_parliament.2.d: "El Parlamento ha decidido en contra de un proyecto de ley que aumentaría nuestro gasto burocrático. Esto viene tras nuestra propuesta que se hizo hace unos días, y parece que la moción simplemente no fue lo suficientemente popular."
 ukraine_parliament.2.a: "Desafortunado"
 ukraine_parliament.2.b: "Tal vez un pequeño soborno cambie su opinión..."
 ukraine_parliament.3.t: "El Parlamento aprueba la ley de Descentralización"
 ukraine_parliament.3.d: "El Parlamento ha aprobado nuestra solicitud de disminuir el gasto burocrático. Esto viene siguiendo nuestra propuesta que se hizo unos días atrás, y parece que el movimiento ganó mucha popularidad y apoyo."
