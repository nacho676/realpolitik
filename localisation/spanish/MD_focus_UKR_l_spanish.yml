 UKR_develop_donets_spaa: "Desarrollar §Y'Donets'§!"
 UKR_develop_donets_spaa_desc: "El «Donets» es un complejo autopropulsado de misiles y artillería antiaéreos desarrollado por la Fábrica de Tanques Malyshev de Járkov y destinado sobre todo a entregas de exportación.\nEl «Donets» combina una torreta modernizada del soviético ZSU-23-4 «Shilka» con un chasis de MBT T-80UD/T-84.\nA los costados de la torreta se instalan dos contenedores gemelos de transporte y lanzamiento con misiles del sistema de defensa aérea «Strela-10M». \nLos misiles, que tienen un sistema autónomo de guiado pasivo, pueden alcanzar blancos aéreos a una distancia de hasta 4500 m y a una altitud de 3500 m."
 UKR_modernize_zsu_23_4m_a1_spaa: "Develop §YZSU-23-4M-A1 'Rokach'§!"
 UKR_modernize_s125_spaa: "Develop §YS-125-2D§!"
 UKR_modernize_s125m_spaa: "Develop §YS-125M§!"
 UKR_modernize_kvadrat_spaa: "Develop §Y2K12M1-2L 'Kvadrat-2L'§!"
 UKR_develop_t38_stylet_spaa: "Desarrollar el proyecto SPAA §YT-38 «Stylet»§!"
 UKR_modernize_rk10_spaa: "Strela-10 §YRK-10§! Integration"
 UKR_develop_kentavr_spaa: "Desarrollar §YZRAK 'Kentavr'§!"
 UKR_develop_2s22: "Desarrollar el sistema de artillería autopropulsada §Y2S22§!"
 UKR_develop_2s22_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_2s22_for_tooltip\n\n\n\n\n\n\n\n\nEl 2S22 'Bohdana' es un explorador autopropulsado ucraniano de 155 mm, desarrollado por Kramatorsk Heavy Machine Tool Building Plant para proporcionar a las fuerzas armadas ucranianas capacidades modernas de artillería estándar de la OTAN.\nEl sistema está montado en un chasis de ruedas, proporcionando alta movilidad operacional y permitiendo que cambie rápidamente las posiciones de disparo después de involucrar al enemigo.\nEl arma de 155 mm es capaz de emplear municiones estándar de artillería de la OTAN, aumentando significativamente el alcance y la potencia de fuego disponibles para las unidades de artillería ucranianas.\nSus sistemas automatizados de control de incendios y navegación permiten a la tripulación determinar rápidamente los datos de disparo y comprometer objetivos con mayor precisión.\nEl desarrollo de la 'Bohdana' representa un paso importante en la modernización de la artillería ucraniana y la transición hacia sistemas de armas estándar de la OTAN."
 UKR_modernize_su25_m1: "Modernizar la aeronave de ataque §YSu-25§!"
 UKR_modernize_su27_1m: "Modernizar el caza §YSu-27§!"
 UKR_modernize_mig29_mu2: "Modernizar el caza §YMiG-29 variante MU2§!"
 UKR_modernize_mig29_mu1: "Modernizar el caza §YMiG-29 variante MU1§!"
 UKR_develop_an_lbl: "Desarrollar una §Yaeronave ligera Antonov§! propuesta"
 UKR_develop_an_lbl_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_lbl_development_for_tooltip\n\n\n\n\n\n\n\n\nEl Antonov Light Aircraft es un avión ligero propuesto diseñado por el Antonov Design Bureau que se espera esté cerca de Yak-130. Está pensado para su uso en diversas funciones, incluyendo entrenamiento y reconocimiento.Se espera que el avión tenga aviónicos avanzados, un marco de aire ligero y motores eficientes para proporcionar un excelente rendimiento y eficiencia del combustible."
 UKR_develop_an_bfv: "Desarrollar un §Ycaza Antonov§! propuesto"
 ukraine_develop_2s22.1.name: "Desarrollar §Y2S22 'Bohdana'§! SPG"
 ukraine_develop_2s22.1.desc: "Mientras hablamos, la tecnología avanza más y nuestras armas siguen siendo las mismas.\nNecesitamos desarrollar nuestro nuevo SPG para nuestras fuerzas"
 ukraine_develop_2s22.1.a: "Proporcionar la cantidad básica de fondos"
 ukraine_develop_2s22.1.b: "Proporción de una cantidad amplia de fondos"
 ukraine_develop_2s22.2.name: "KrZVV ha desarrollado un proyecto de un nuevo SPG"
 ukraine_develop_2s22.2.desc: "Hemos comprobado y estamos seguros ahora, que KrZVV creó un nuevo proyecto SPG para nuestros militares.\nSin embargo, debido a los fondos insuficientes que proporcionamos, no fueron capaces de crear un nuevo barril y tuvieron que usar el viejo soviético en su lugar."
 ukraine_develop_2s22.2.a: "¡Vamos a empezar la producción!"
 ukraine_develop_2s22.3.name: "KrZVV ha desarrollado un proyecto de un nuevo SPG"
 ukraine_develop_2s22.3.desc: "Hemos comprobado y estamos seguros ahora, que KrZVV creó un nuevo proyecto SPG para nuestros militares.\nAdemás, debido a los fondos adicionales que proporcionamos, desarrollaron un aspecto descarado del SPG desde cero, nuevo y fuerte!."
 ukraine_develop_2s22.3.a: "¡Genial, empecemos la producción!"
 UKR_develop_stuhna_p_atgm: "Develop §YRK-2 'Stuhna-P'§!"
 UKR_develop_stuhna_p_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_stuhna_p_for_tooltip\n\n\n\n\n\n\n\n\nEl Stuhna-P, conocido por su versión de exportación Skif, es un sistema ucraniano antitanque de misiles guiados (ATGM) desarrollado a principios de 2010 por la Luch Design Bureau.\nEl Stuhna-P está diseñado para destruir objetivos armadura modernos con armaduras combinadas transportadas o monolíticas, incluyendo armadura reactiva explosiva (ERA).\nStuhna-P puede atacar objetivos fijos y móviles.\nPueden atacar desde largo alcance hasta 5 kilómetros durante el día y cerca de 100 metros."
 UKR_develop_corsar_atgm: "Develop §YRK-3 'Corsar'§!"
 UKR_develop_corsar_atgm_desc: "El RK-3 Corsar es un misil guía portátil ucraniano antitanque, desarrollado por Luch State Kyiv Design Bureau.\nEs probable que el Corsar reemplace los sistemas antitanque de la era soviética, como los 9M113 Konkurs y 9K111 Fagot.\nt está destinado a destruir objetivos fijos y móviles blindados. También se puede utilizar contra emplazamientos, objetos y helicópteros con luz.\nLa fijación se puede llevar a cabo desde el montaje, así como desde un parapeto de trinchera. Un método de guía es la conducción del rayo láser."
 UKR_modernize_stuhna_p_atgm: "Modernize §YRK-2 'Stuhna-P'§!"
 UKR_modernize_stuhna_p_atgm_desc: "Podemos modernizar aún más el complejo Stuhna-P ATGM, para estar en contacto con las amenazas actuales."
 UKR_develop_bulava_atgm: "Desarrollar §Y'Bulava'§!"
 UKR_develop_bulava_atgm_desc: "Futuro complejo ATGM con capacidad de disparar y olvidar.\nToda la información está clasificada por el momento."
 UKR_develop_stuhna_p_flag: "Decisión completa Desarrollar RK-2 Stuhna-P"
 UKR_develop_corsar_flag: "Decisión completa Desarrollar RK-3 Corsar"
 UKR_develop_kba27: "Desarrollar la artillería autopropulsada KBA-27"
 UKR_develop_kba27_desc: "El KBA-27 es un ucraniano de 152 mm auitzer derivado del Pat-B soviético 2A61. Una variante experimental montaba el arma en un transportador anfibio PTS-2, combinando fuerza de fuego de artillería pesada con alta movilidad y capacidades anfibias. Un desarrollo ulterior podría transformar este prototipo en un sistema de artillería autopropulsado viable."
 UKR_modernize_stuhna_p_flag: "Decisión completa Modernizar RK-2 Stuhna-P"
 UKR_develop_baryer_s: "Desarrollar §Y'Baryes-S'§!"
 UKR_develop_baryer_s_desc: "El Baryer-S es un sistema ucraniano de misiles antitanque guiados (ATGM) desarrollado por el Luch Design Bureau basado en la ATGM Shturm-S.\nEl Baryer-S está diseñado para destruir objetivos blindados modernos con armaduras combinadas o monolíticas, incluyendo armadura reactiva explosiva (ERA)."
 UKR_develop_nota_flag: "Decisión completa §YDevelop 'Nota'§!"
 UKR_develop_nota: "Desarrollar el MBT §YObjeto 477A1 «Nota»§!"
 UKR_modernize_nota: "Modernizar el §YObjeto 477A1 «Nota»§!"
 UKR_5BrPrK: "5 Bryhada Prykordonnykh Korabliv"
 ukraine_armed_forces_tragedy_event.1.name: "Tragedia de misiles rotos"
 ukraine_armed_forces_tragedy_event.1.desc: "El desastre de Brovary del 20 de abril de 2000 fue un accidente ocurrido en la ciudad de Brovary, Kiev Oblast, cuando un misil de entrenamiento superficial a superficie del complejo «Tochka-U», lanzado durante ejercicios militares desde el campo de entrenamiento Goncharivka, desviado de su curso previsto y, después de volar 90 km, golpeó un edificio residencial de nueve pisos.\nEl misil no tenía una ojiva explosiva, y tres personas fueron asesinadas y cinco más resultaron heridas como resultado de la huelga de misiles.\n\nDurante cuatro días después del desastre, hasta el 23 de abril, el Ministerio de Defensa de Ucrania, encabezado por Oleksandr Kuzmuk, se negó a admitir que fue su misil el que golpeó el edificio residencial."
 ukraine_armed_forces_tragedy_event.1.a: "Ese no era nuestro misil"
 ukraine_armed_forces_tragedy_event.2.name: "Siberia Airlines Vuelo 1812 Shot Down"
 ukraine_armed_forces_tragedy_event.2.desc: "El vuelo 1812 de Siberia Airlines fue un vuelo comercial que supuestamente fue derribado por la Fuerza Aérea ucraniana sobre el Mar Negro el 4 de octubre de 2001, en ruta desde Tel Aviv, Israel, a Novosibirsk, Rusia.\nEl avión Tupolev Tu-154, de fabricación soviética, transportaba 66 pasajeros y 12 tripulantes. La mayoría de los pasajeros eran israelíes que visitaban a sus familiares en Rusia. No había sobrevivientes.\nEl accidente fue causado por un misil lanzado durante ejercicios conjuntos de defensa aérea militar ucraniana-rusa en el campo de entrenamiento controlado por Rusia del 31.º centro ruso de investigación de la flota del Mar Negro en Cabo Opuk cerca de la ciudad de Kerch en Crimea."
 ukraine_armed_forces_tragedy_event.2.a: "Necesitamos una investigación."
 ukraine_armed_forces_tragedy_event.3.name: "Un desastre del espectáculo de aire Sknyliv"
 ukraine_armed_forces_tragedy_event.3.desc: "El desastre del espectáculo aéreo de Sknyliv ocurrió el 27 de julio de 2002, cuando un avión sukhoi Su-27UB de la Fuerza Aérea Ucraniana, pilotado por Volodymyr Toponar (del equipo de demostración aerobática 'Ucrania Falcons') y copilotado por Yuriy Yegorov, se estrelló en espectadores durante una presentación aerobatica en Sknyliv cerca de Lviv, Ucrania.\nEl accidente mató a 77 personas e hirió a 543. Es el accidente más mortal de la historia.\nDespués del desastre, los pilotos declararon que el mapa de vuelo que habían recibido difería de la distribución real."
 ukraine_armed_forces_tragedy_event.3.a: "Unbelievable tragedy"
 UKR_Brovary_Missile_Tragedy_Flag: "La tragedia de los misiles rotos ha ocurrido"
 UKR_Tu154_Air_Tragedy_Flag: "Siberia Airlines Vuelo 1812 fue derribado"
 ukraine_warehouse_explosions.1.name: "Pobres condiciones de los depósitos de municiones"
 ukraine_warehouse_explosions.1.desc: "Las recientes reformas de las Fuerzas Armadas han revelado graves deficiencias en el almacenamiento y la seguridad de depósitos de municiones en todo Ucrania. Las instalaciones obsoletas y la supervisión de lax presentan un riesgo significativo de accidentes. El gobierno debe decidir cómo abordar esta cuestión."
 ukraine_warehouse_explosions.1.a: "Mantenimiento completo de todos los depósitos"
 ukraine_warehouse_explosions.1.b: "Mantenimiento parcial de los principales depósitos"
 ukraine_warehouse_explosions.1.c: "Ignora el asunto"
 ukraine_warehouse_explosions.2.name: "Explosión en el depósito de municiones de Artemivsk"
 ukraine_warehouse_explosions.2.desc: "El incidente inesperado y generalizado ocurrió recientemente en la ciudad de Artemivsk, distrito de Artemivsk, región de Donetsk. El fuego ha comenzado en los almacenes de la 52.ª Brigada Mecanizada, donde se almacenaron cerca de tres mil toneladas de municiones de artillería. Desafortunadamente, las explosiones masivas vienen después del incendio inicial. Necesitamos tomar acciones para limpiar el lugar y detener tales incidientes en el futuro."
 ukraine_warehouse_explosions.2.a: "Reconstrucción completa del depósito"
 ukraine_warehouse_explosions.2.b: "Enviar Comisión a investigar"
 ukraine_warehouse_explosions.2.c: "Ignora el asunto"
 ukraine_warehouse_explosions.3.name: "Explosión en el depósito de municiones Novobohdanivka"
 ukraine_warehouse_explosions.3.desc: "El incidente inesperado y generalizado ocurrió recientemente cerca de la aldea de Novobohdanivka, Distrito de Melitopol, Región de Zaporizhzhia. El 6 de mayo, 2004, casi 90 mil municiones para el Grad, Smerch y los sistemas Uragan explotaron. Los fragmentos de las conchas volaron 40 km del epicentro de la emergencia ardiente y medio mil personas tuvieron que ser evacuadas. Cinco personas murieron, más de 80 fueron hospitalizados con varias lesiones, Más de 20 familias quedaron sin hogar. La explosión dañó 4 km del gasoducto. El daño ascendió a 3 mil millones 752 millones de UAH"
 ukraine_warehouse_explosions.3.a: "Reconstrucción completa del depósito"
 ukraine_warehouse_explosions.3.b: "Enviar Comisión a investigar"
 ukraine_warehouse_explosions.3.c: "Ignora el asunto"
 ukraine_warehouse_explosions.4.name: "Explosión en el depósito de municiones Tsvitokha"
 ukraine_warehouse_explosions.4.desc: "El incidente inesperado y generalizado ocurrió recientemente cerca de la aldea de Tsvitokha, distrito de Slavuta, región de Khmelnytskyi. Fuego con explosiones de municiones en la región de Khmelnytskyi en el Arsenal No. 47. La instalación de almacenamiento contenía 52.9 carros convencionales de municiones (carachas de calibre pequeño - 23 y 30 mm, granadas para lanzagranadas de bajorrela), que se detonaron como resultado del incendio. Los fragmentos volaron en un radio de 100-150 m."
 ukraine_warehouse_explosions.4.a: "Reconstrucción completa del depósito"
 ukraine_warehouse_explosions.4.b: "Enviar Comisión a investigar"
 ukraine_warehouse_explosions.4.c: "Ignora el asunto"
 ukraine_warehouse_explosions.5.name: "Segunda explosión en el depósito de municiones Novobohdanivka"
 ukraine_warehouse_explosions.5.desc: "El incidente de explosiones ocurrió por segunda vez cerca del pueblo de Novobohdanivka, Distrito de Melitopol, Región de Zaporizhzhia. El 23 de julio, 2005, at 5:20 p.m., A warehouse at the 257th ammunition storage base caught fire. At 8:54 p.m., la detonación de conchas se detuvo, cinco personas resultaron heridas y la causa de las explosiones fue alta temperatura del aire, que presuntamente causó la combustión espontánea de una mina de humo"
 ukraine_warehouse_explosions.5.a: "Reconstrucción completa del depósito"
 ukraine_warehouse_explosions.5.b: "Enviar Comisión a investigar"
 ukraine_warehouse_explosions.5.c: "Ignora el asunto"
 ukraine_warehouse_explosions.6.name: "Tercera explosión en el depósito de municiones Novobohdanivka"
 ukraine_warehouse_explosions.6.desc: "El incidente de las explosiones ocurrió por tercera vez cerca del pueblo de Novobohdanivka, Distrito de Melitopol, Región de Zaporizhzhia. El 19 de agosto, 2006 at 2:15 p.m., Se produjo otra explosión grave. Aproximadamente tres hectáreas del almacén quemaron. 1,500 residentes locales fueron evacuados, 4,000 personas fueron colocadas en refugios. 428 personas y 96 piezas de equipo estaban implicadas. 4 personas resultaron heridas"
 ukraine_warehouse_explosions.6.a: "Reconstrucción completa del depósito"
 ukraine_warehouse_explosions.6.b: "Enviar Comisión a investigar"
 ukraine_warehouse_explosions.6.c: "Ignora el asunto"
 ukraine_warehouse_explosions.7.name: "Explosión en el depósito de municiones Lozova"
 ukraine_warehouse_explosions.7.desc: "El incidente inesperado y generalizado ocurrió recientemente en la ciudad de Lozova, distrito de Lozova, región de Kharkiv. El 27 de agosto de 2008, a las 16:20, el almacén del 61.º arsenal del Comando Operativo Sur de las Fuerzas Terrestres incendió. El arsenal de la unidad militar No 0829, con una superficie aproximada de 500 hectáreas, almacenaba 95 mil toneladas de proyectiles. Las explosiones comenzaron unas dos horas más tarde. Todos los residentes en un radio de 3 km de los almacenes fueron evacuados."
 ukraine_warehouse_explosions.7.a: "Reconstrucción completa del depósito"
 ukraine_warehouse_explosions.7.b: "Enviar Comisión a investigar"
 ukraine_warehouse_explosions.7.c: "Ignora el asunto"
