 UKR_warehouses_maintenance_none_flag: "Ignoró la cuestión de las instalaciones de almacenamiento"
 UKR_warehouse_small_explosion_effect_tooltip: "Nos enfrentaremos a algunos efectos negativos temporales en el estado como consecuencia de una pequeña explosión de depósito de municiones."
 UKR_warehouse_medium_explosion_effect_tooltip: "Nos enfrentaremos a algunos efectos negativos tempararios en el estado como consecuencia de una explosión de depósito mediano de municiones."
