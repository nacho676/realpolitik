 UKR_warehouse_medium_explosion_effect: "Explosión media del depósito de municiones"
 UKR_warehouse_big_explosion_effect: "Gran explosión de depósito de municiones"
 UKR_warehouses_novobohdanivka_depot_explosions_reconstruction_flag: "Nos empujamos hacia la reconstrucción del almacén de Novobohdanivka"
 UKR_warehouses_novobohdanivka_depot_explosions_comission_flag: "Organizamos una inspección especial del gobierno en el almacén de Novobohdanivka"
 UKR_warehouses_novobohdanivka_depot_explosions_ignore_flag: "Hemos ignorado las explosiones de almacenes Novobohdanivka tanto como podríamos"
