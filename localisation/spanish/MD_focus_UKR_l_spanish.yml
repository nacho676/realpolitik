 ukraine_nuclear_power_plants.1.name: "Cerramiento completo de la central nuclear Chornobyl"
 ukraine_nuclear_power_plants.1.desc: "El 29 de marzo de 2000, el Gabinete de Ministros de Ucrania decidió desmantelar prematuramente la unidad eléctrica No 3 y, finalmente, cerrar el PNP Chornobyl para fines del año 2000.\nEl 15 de diciembre de 2000, el reactor No 3 fue cerrado después de operar brevemente desde marzo de 1999 tras casi tres meses de reparaciones, y la planta en su conjunto dejó de producir electricidad.\nSe planea construir una nueva estructura de contención de acero llamada el §YNueva Confinamiento Seguro§! para reemplazar el sarcófago envejecido y construido apresuradamente que protegió el reactor arruinado No. 4.\nEl §YNew Safe Confinement§! está previsto que sea financiado por un fondo internacional gestionado por el Banco Europeo de Reconstrucción y Desarrollo, diseñado y construido por el consorcio francés Novarka."
 ukraine_nuclear_power_plants.1.a: "Para siempre."
 ukraine_nuclear_power_plants_flag: "La central nuclear Chornobyl está cerrada."
 ukr_history.1.t: "La desaparición de Georgiy Gongadze"
 ukr_history.1.d: "Georgiy Gongadze, fundador del periódico en línea Ukrainska Pravda y uno de los críticos más agudos de la administración presidencial, ha desaparecido en Kiev. Su madre ha presentado un informe de persona desaparecida; sus colegas ya están diciendo abiertamente que las autoridades están detrás de él. Si un cuerpo aparece, esto no seguirá siendo un asunto policial."
 ukr_history.1.a: "Que la policía lo maneje de la manera habitual."
 ukr_history.1.b: "Ordene una investigación genuina y mantenga informada a la prensa."
 ukr_history.2.t: "El Escándalo de Cassette"
 ukr_history.2.d: "Desde la tribuna de la Verkhovna Rada, el líder socialista Oleksandr Moroz ha interpretado grabaciones hechas en la propia oficina del presidente por un miembro de la guardia estatal, Mykola Melnychenko. En las cintas una voz que se parece a las demandas del presidente de que Gongadze sea tratado. Moroz se ha convertido durante la noche de un político izquierdista en el rostro de la oposición."
 ukr_history.2.a: "Negar todo y cuestionar las cintas."
 ukr_history.2.b: "No digas nada y espera que pase la tormenta."
 ukr_history.3.t: "Ucrania sin Kuchma"
 ukr_history.3.d: "Un campo de protesta permanente ha aparecido en Independence Square. Comenzó con cincuenta personas y dentro de dos días había decenas de miles. Por primera vez la izquierda, el centro y los nacionalistas están de pie en la misma plaza bajo la misma consigna. Los organizadores dicen que no se irán hasta que el presidente renuncie."
 ukr_history.3.a: "Ignóralos; el frío hará nuestro trabajo."
 ukr_history.3.b: "Abrir negociaciones con el comité de protesta."
 ukr_history.4.t: "Los enfrentamientos en la calle Bankova"
 ukr_history.4.d: "Una columna de diez a quince mil marcharon sobre la administración presidencial en el aniversario del nacimiento de Shevchenko. Bankova Street vio la peor pelea callejera desde la independencia. Por la noche, la policía había destruido el cuartel general de la UNA-UNSO y cientos estaban bajo arresto. El campo en la plaza se ha ido, pero también es cualquier pretensión que este gobierno gobierna por consentimiento."
 ukr_history.4.a: "So be it."
 ukr_history.5.t: "El Rada despide al Gobierno de Yushchenko"
 ukr_history.5.d: "Doscientos sesenta y tres diputados no han votado confianza en el gabinete de Viktor Yushchenko. Los comunistas y el centro oligárquico votaron juntos: la izquierda odiaba sus reformas del mercado, los grupos de negocios odiaban que había detenido los esquemas de trueque en el sector energético. El primer ministro más popular de la historia del país deja el cargo con su reputación intacta y sin oficina para perderlo."
 ukr_history.5.a: "So be it."
 ukr_history.6.t: "Yushchenko anuncia un Bloc"
 ukr_history.6.d: "El primer ministro despedido ha declarado que dirigirá un bloque electoral a las elecciones parlamentarias del próximo año. Diez partidos democráticos y liberales nacionales ya están negociando la lista. El bloque aún no tiene programa ni estructura, pero no tiene otra fuerza: un líder que la mayoría del país todavía confía."
 ukr_history.6.a: "So be it."
 ukr_history.7.t: "¡Por Ucrania Unida!"
 ukr_history.7.d: "Cinco partidos de poder se han reunido en un único bloque electoral alrededor del presidente: los Demócratas Populares, Ucrania Laboral, el Partido de las Regiones, los Agrarios y los Industrialistas. Lo que lo mantiene unido no es la ideología sino el recurso administrativo - gobernadores, inspectores fiscales y televisión estatal. Se ha dicho a los jefes regionales qué resultado se espera de ellos."
 ukr_history.7.a: "So be it."
 ukr_history.8.t: "Elecciones parlamentarias de 2002"
 ukr_history.8.d: "El bloque de Yushchenko ocupó el primer lugar en la lista del partido con un veinte tres por ciento. Para Ucrania United tomó apenas doce - y luego recogió cien escaños en los distritos de un solo mandato, donde los gobernadores deciden lo que dicen las urnas. Los comunistas han perdido la mitad de su voto. Seis fuerzas entran en el nuevo Rada."
 ukr_history.8.a: "So be it."
 ukr_history.9.t: "Lytvyn elegido orador"
 ukr_history.9.d: "Después de dos meses de estancamiento, el jefe de la administración presidencial, Volodymyr Lytvyn, ha sido elegido presidente de la Verkhovna Rada. La oposición tuvo el mayor voto en el país; el presidente tuvo el mayor voto en la cámara. Lytvyn pasará los próximos años como el hombre que ambos lados necesitan y ninguna confianza lateral."
 ukr_history.9.a: "So be it."
 ukr_history.10.t: "Para los disolves unidos de Ucrania"
 ukr_history.10.d: "El bloque que ganó los distritos se ha roto en sus partes componentes. Nueve facciones separadas ahora se sientan donde uno estaba: el Partido de las Regiones, el Trabajo Ucrania, los Demócratas del Pueblo, los Agrarios y el resto, cada uno con su propio líder y su propio precio. El grupo Donetsk es el más grande de ellos y ya no es el socio junior de nadie."
 ukr_history.10.a: "So be it."
 ukr_history.11.t: "¡Arriba, Ucrania!"
 ukr_history.11.d: "En el segundo aniversario de la desaparición de Gongadze, la oposición ha llevado a sus partidarios a las calles - esta vez con Yushchenko, Tymoshenko, Moroz y Symonenko en la misma plataforma. Los cuatro no tienen casi nada en común excepto la demanda que el presidente va. Tents va a subir en Khreshchatyk otra vez."
 ukr_history.11.a: "So be it."
 ukr_history.12.t: "La muerte de Slava Stetsko"
 ukr_history.12.d: "Yaroslava Stetsko, viuda del hombre que proclamó la restauración de la estadidad ucraniana en Lviv en 1941 y el vínculo vivo entre la clandestinidad nacionalista de guerra y el parlamento actual, ha muerto a los ochenta y tres años. El Congreso de Nacionalistas ucranianos debe ahora encontrar un líder que no sea un símbolo."
 ukr_history.12.a: "So be it."
 ukr_history.13.t: "Yanukovych toma el Partido de las Regiones"
 ukr_history.13.d: "El primer ministro ha sido elegido presidente del Partido de las Regiones. Hasta ahora el partido era un grupo de negocios Donetsk entre varios; a partir de hoy es el brazo político del hombre al que el presidente se propone abandonar la oficina. La gente de Rinat Akhmetov se está moviendo en las estructuras regionales del partido."
 ukr_history.13.a: "So be it."
 ukr_history.14.t: "Tarasyuk toma el movimiento popular"
 ukr_history.14.d: "Borys Tarasyuk, exministro de Relaciones Exteriores que negoció la Carta con la OTAN, ha sido elegido líder de Rukh. El partido que hizo la independencia es ahora un pequeño grupo profesional de diplomáticos e intelectuales, y ha decidido que su futuro está dentro del bloque de Yushchenko en lugar de al lado."
 ukr_history.14.a: "So be it."
 ukr_history.15.t: "El Espacio Económico Único"
 ukr_history.15.d: "El presidente ha firmado el acuerdo sobre un Espacio Económico Único con Rusia, Bielorrusia y Kazajstán en Yalta. El texto habla de un sindicato aduanero y una comisión supranacional donde los votos son ponderados por el tamaño económico - lo que significa que Moscú decide. El Rada lo ratificó con los votos de los comunistas y el partido del poder juntos."
 ukr_history.15.a: "Firma, el este paga nuestras cuentas."
 ukr_history.15.b: "Firme, pero ratifique sólo el capítulo de libre comercio."
 ukr_history.16.t: "La Corte abre la puerta a un tercer mandato"
 ukr_history.16.d: "El Tribunal Constitucional ha dictaminado que el primer mandato del presidente, servido bajo la antigua constitución, no cuenta. Puede quedarse de nuevo el año que viene. Nadie en Kiev cree que los jueces llegaron a esta conclusión sin ayuda, y nadie cree que la utilizará realmente - pero el fallo ha dicho a la oposición exactamente con lo que está tratando."
 ukr_history.16.a: "So be it."
 ukr_history.17.t: "El Partido Social-Nacional se convierte en Svoboda"
 ukr_history.17.d: "En su congreso en Lviv, el Partido Social-Nacional de Ucrania se ha renombrado la Unión todo-ucraniana Svoboda, dejó al Wolfsangel de su bandera y eligió a Oleh Tyahnybok como su líder. La retórica se ha reducido y el partido está apuntando ahora a los votantes que nunca se hubieran unido a una organización paramilitar."
 ukr_history.17.a: "So be it."
 ukr_history.18.t: "La reforma política falla por seis votos"
 ukr_history.18.d: "La enmienda constitucional que habría convertido la presidencia en una oficina ceremonial se redujo a seis votos. El pueblo del presidente quería que fuera una póliza de seguro contra la pérdida de las elecciones; El campamento de Yushchenko lo votó porque esperan ganar la oficina mientras está en pie. Ambas partes acaban de decirle al país lo que creen que son sus posibilidades."
 ukr_history.18.a: "So be it."
 ukr_history.19.t: "Lytvyn toma los agrarios"
 ukr_history.19.d: "El orador del Parlamento ha sido elegido jefe del Partido Agrario, que se está renombrando al Partido Popular Agrario. Lytvyn está construyendo una máquina en los pueblos - la única parte del país donde ni el grupo Donetsk ni el campo de naranja tiene mucho que ofrecer."
 ukr_history.19.a: "So be it."
 ukr_history.20.t: "La fuerza del pueblo"
 ukr_history.20.d: "Yushchenko y Tymoshenko han firmado un acuerdo de coalición. Ella se destaca de la carrera presidencial y campañas por él; si gana, ella se convierte en primer ministro. Dos campamentos que pasaron tres años compitiendo por la misma votación de protesta han decidido que uno de ellos debe ser el candidato y el otro el gobierno."
 ukr_history.20.a: "So be it."
 ukr_history.21.t: "Yushchenko Expels Tyahnybok"
 ukr_history.21.d: "Después de un discurso en una tumba partidista en los carpathians en el que Tyahnybok elogió a aquellos que lucharon «el Moskali, los alemanes, los Yids», Nuestra Ucrania lo expulsó de su facción parlamentaria. Yushchenko ha protegido su campaña de una cita fatal y entregó a Svoboda el martirio que necesitaba para convertirse en un partido por derecho propio."
 ukr_history.21.a: "So be it."
 ukr_history.22.t: "El envenenamiento"
 ukr_history.22.d: "El candidato de la oposición ha sido llevado a una clínica en Viena. El diagnóstico es envenenamiento de dioxina a una concentración mil veces normal, administrado en una cena con el jefe adjunto del servicio de seguridad. Sobrevivirá y su cara no lo hará. Vuelve a la campaña desfigurada, y cada votante ahora ve lo que le fue hecho."
 ukr_history.22.a: "Llámalo envenenamiento por comida y sigue adelante."
 ukr_history.22.b: "Abre un caso criminal y déjalo correr."
 ukr_history.23.t: "La Primera Ronda"
 ukr_history.23.d: "Treinta y nueve por ciento para el candidato de la oposición, treinta y nueve para el primer ministro - una diferencia de unas pocas décimas del por ciento. El voto comunista ha colapsado de una cuarta parte del país al 5%, absorbido por los dos polos. Todo el mundo es irrelevante. Tres semanas para el despegue."
 ukr_history.23.a: "So be it."
 ukr_history.24.t: "El Rada declina el Run-off Invalid"
 ukr_history.24.d: "Trescientos siete diputados han votado que la segunda ronda no reflejaba la voluntad de los votantes, y doscientos veinte nueve no han votado confianza en el gobierno. Ninguno de los votos es jurídicamente vinculante. Ambos dijeron a los servicios de seguridad y a las administraciones regionales que el viento soplaba, lo cual era el punto."
 ukr_history.24.a: "So be it."
 ukr_history.25.t: "Tihipko camina fuera de la campaña"
 ukr_history.25.d: "El jefe del Banco Nacional y gerente de la campaña del Primer Ministro ha dimitido de la campaña y del banco. El trabajo Ucrania, el partido Dnipropetrovsk que construyó con Viktor Pinchuk, se está desintegrando detrás de él mientras sus diputados buscan un lugar más seguro para ponerse en pie."
 ukr_history.25.a: "So be it."
 ukr_history.26.t: "El Tribunal Supremo anula la fuga"
 ukr_history.26.d: "El Tribunal Supremo ha fallado la segunda vuelta inválida y ordenado un voto repetitivo para el vigésimo sexto de diciembre. Por primera vez un tribunal ucraniano ha decidido una elección presidencial contra el candidato del titular, y la decisión fue leída en vivo a un cuadrado lleno de gente."
 ukr_history.26.a: "So be it."
 ukr_history.27.t: "Ley 2222 - El voto del paquete"
 ukr_history.27.d: "El compromiso ha sido votado como un solo paquete: la repetición de elecciones a cambio de la reforma constitucional. Desde 2006 el Parlamento nombra al gobierno y el presidente mantiene relaciones exteriores y defensa. Quien gane esta elección ganará una oficina más pequeña que la que estaba luchando."
 ukr_history.27.a: "So be it."
 ukr_history.28.t: "Nuestra Ucrania se convierte en Parte"
 ukr_history.28.d: "El bloque que ganó la presidencia ha celebrado su congreso fundador como partido único: la Unión Popular Nuestra Ucrania. Roman Bezsmertnyi, director de campaña del presidente, toma la silla. Varios de los diez partidos miembros se han negado a disolverse en ella, y la coalición que hizo la revolución ya es un partido más pequeño de lo que era en diciembre."
 ukr_history.28.a: "So be it."
 ukr_history.29.t: "El Campamento Naranja rompe"
 ukr_history.29.d: "El presidente ha despedido a todo el gobierno. El jefe del consejo de seguridad acusó el círculo de corrupción del primer ministro en la televisión en vivo; respondió que el propio séquito del presidente era el problema. Ocho meses después de la plaza, las dos personas que se unieron en ella corren entre sí."
 ukr_history.29.a: "Despídelos a todos y comienza de nuevo."
 ukr_history.29.b: "Mantén al primer ministro y saque a los acusadores."
 ukr_history.30.t: "El Memorándum con Yanukovych"
 ukr_history.30.d: "Incapaz de confirmar a un nuevo primer ministro con votos naranjos solo, el presidente ha firmado un memorando de entendimiento con el hombre que venció. El Partido de las Regiones se abstiene, Yurii Yekhanurov es confirmado por tres votos, y los casos criminales contra funcionarios electorales calladamente paran. La revolución ha comprado su propio gobierno de la gente que derrocó."
 ukr_history.30.a: "So be it."
 ukr_history.31.t: "Elecciones parlamentarias de 2006"
 ukr_history.31.d: "La primera elección totalmente proporcional. El Partido de las Regiones tomó el treinta y dos por ciento, el Tymoshenko Bloc veinte dos, Nuestra Ucrania catorce - tercer lugar para el propio partido del presidente un año después de su victoria. Los Socialistas y Comunistas se despedazaron. Nadie tiene mayoría y todo el mundo tiene un veto."
 ukr_history.31.a: "So be it."
 ukr_history.32.t: "La Coalición de las Fuerzas Democráticas"
 ukr_history.32.d: "Después de tres meses los socios naranjas han firmado: el Tymoshenko Bloc, Nuestra Ucrania y los Socialistas, doscientos cuarenta y tres votos, con Tymoshenko como primer ministro. El acuerdo tomó más tiempo para escribir que el gobierno durará."
 ukr_history.32.a: "So be it."
 ukr_history.33.t: "Moroz ocupa la Presidencia"
 ukr_history.33.d: "El líder socialista ha sido elegido orador con los votos del Partido de las Regiones y los Comunistas - los dos partidos que pasó los últimos seis años denunciando. La coalición naranja colapsó la misma tarde. Dentro de un día existía la Coalición Anti-Crisis y Moroz se había convertido en el hombre más odiado de la mitad del país."
 ukr_history.33.a: "So be it."
 ukr_history.34.t: "El Universal de la Unidad Nacional"
 ukr_history.34.d: "El presidente ha firmado una declaración de principios con la Coalición Anti-Crisis y nominado al hombre que ganó en 2004 como primer ministro. Nuestra Ucrania se une al gobierno que a los votantes de Ucrania les dijeron que habían derrotado. Veinte meses después de la plaza, Yanukovych regresó al edificio del que fue expulsado."
 ukr_history.34.a: "Firma - la alternativa es otra elección."
 ukr_history.34.b: "Rechazar y disolver el Rada ahora."
 ukr_history.35.t: "Nuestra Ucrania entra en la oposición"
 ukr_history.35.d: "El partido del presidente ha salido del gobierno que se unió hace dos meses. Sus ministros dimiten, sus diputados se trasladan a las bancas de la oposición y se le dice al país que la Unidad Nacional era un malentendido. La Coalición Anti-Crisis no los necesita y lo dice."
 ukr_history.35.a: "So be it."
 ukr_history.36.t: "Reformas y Orden se une al Bloc Tymoshenko"
 ukr_history.36.d: "Los liberales del mercado de Viktor Pynzenyk, que pasaron los años noventa escribiendo cada serio programa de reforma ignorado por el país, se han plegado al Bloc Tymoshenko. El ala liberal del campo naranja ya no existe como una dirección separada."
 ukr_history.36.a: "So be it."
 ukr_history.37.t: "La Coalición compra su mayoría"
 ukr_history.37.d: "La Coalición Anti-Crisis se ha renombrado la Coalición de Unidad Nacional y comenzó a recoger diputados individuales de las bancas de oposición, uno por uno, a un precio que nadie habla en público. A trescientos votos puede anular al presidente y reescribir la constitución. Son once cortos."
 ukr_history.37.a: "So be it."
 ukr_history.38.t: "El Presidente disuelve la Rada"
 ukr_history.38.d: "En lugar de ver que la coalición llega a trescientos, el presidente ha disuelto el parlamento por decreto. La coalición dice que el decreto es inconstitucional y sigue sentado. Durante dos meses el país tiene dos autoridades legítimas, tres jefes del Tribunal Constitucional y un ministerio interior que responde a nadie en particular."
 ukr_history.38.a: "Disolverlos - es eso o perder la oficina."
 ukr_history.38.b: "Aceptar la coalición y mantener los poderes que quedan."
 ukr_history.39.t: "Nuestra Ucrania - Autodefensa Popular"
 ukr_history.39.d: "El partido del presidente está entrando en las elecciones rápidas dentro de un bloque más amplio con la Autodefensa Popular de Yurii Lutsenko, construida fuera del ministerio de oficiales interiores que trajo consigo. Nueve partes en una lista, mantenidas juntas por el temor de correr por separado."
 ukr_history.39.a: "So be it."
 ukr_history.40.t: "El Bloc de Lytvyn"
 ukr_history.40.d: "El ex orador ha registrado su propio bloque para las elecciones rápidas. No tiene programa digno de leer y ningún enemigo vale la pena nombrar, que es el punto: quien gane, Lytvyn se propone ser los votos de los que están cortos."
 ukr_history.40.a: "So be it."
 ukr_history.41.t: "El Congreso de Nacionalistas ucranianos se levanta"
 ukr_history.41.d: "Incapaz de despejar el umbral del tres por ciento solo y rechazar un lugar en la lista de Nuestra Ucrania, el Congreso de Nacionalistas ucranianos ha anunciado que no impugnará las elecciones. El partido nacionalista más antiguo del país deja el campo a Svoboda."
 ukr_history.41.a: "So be it."
 ukr_history.42.t: "Medvedchuk Pasos atrás"
 ukr_history.42.d: "El Partido Socialdemócrata (unido), una vez que la máquina que dirigía la administración presidencial, ha reemplazado a Viktor Medvedchuk con Yurii Zahorodniy. El partido encuesta por debajo del 1%. Su antiguo líder no se retira de la política - él está cambiando para qué país lo hace."
 ukr_history.42.a: "So be it."
 ukr_history.43.t: "Elecciones de Snap"
 ukr_history.43.d: "El Partido de las Regiones tomó el treinta y cuatro por ciento y perdió de todos modos: el Bloc Tymoshenko subió a treinta y uno, y con la Autodefensa del Pueblo Ucraniano, el lado naranja tiene doscientos veinte siete asientos. Una mayoría de dos."
 ukr_history.43.a: "So be it."
 ukr_history.44.t: "La Coalición Orange, de nuevo"
 ukr_history.44.d: "El Bloc de Tymoshenko y la Autodefensa del Pueblo Ucraniano han firmado un acuerdo de coalición con una mayoría de dos votos. Todos los involucrados saben que dos votos no son mayoría, es una situación de rehenes."
 ukr_history.44.a: "So be it."
 ukr_history.45.t: "Tymoshenko vuelve al Gabinete"
 ukr_history.45.d: "En el segundo intento, y por un solo voto, el Rada ha confirmado a Yulia Tymoshenko como primer ministro. Promete devolver los ahorros perdidos en el colapso soviético y privar lo que fue robado. El presidente que la nombró ya ha comenzado a buscar maneras de quitarla."
 ukr_history.45.a: "So be it."
 ukr_history.46.t: "Baloha construye el Centro Unido"
 ukr_history.46.d: "El jefe de la secretaría presidencial ha convertido un partido adormecido en United Centre y comenzado a trasladar las redes regionales del presidente en él. Oficialmente apoya al presidente. En la práctica es una póliza de seguro contra Nuestra Ucrania, y todo el mundo en Nuestra Ucrania lo sabe."
 ukr_history.46.a: "So be it."
 ukr_history.47.t: "La Coalición está declarada muerta"
 ukr_history.47.d: "La Autodefensa de nuestro pueblo ucraniano ha salido después de que el Bloc Tymoshenko votara con el Partido de las Regiones para cortar poderes presidenciales. El orador ha anunciado desde la tribuna que la coalición ha dejado de existir. Treinta días para construir uno nuevo o enfrentarse a otra elección."
 ukr_history.47.a: "So be it."
 ukr_history.48.t: "La elección que nunca sucedió"
 ukr_history.48.d: "El presidente ha disuelto el parlamento de nuevo y ha votado para el séptimo de diciembre. No hay dinero en el tesoro para pagarlo, los tribunales han bloqueado el decreto, y la crisis financiera mundial ha llegado en el mismo mes. La elección está tranquilamente abandonada."
 ukr_history.48.a: "So be it."
 ukr_history.49.t: "La crisis llega"
 ukr_history.49.d: "La hryvnia ha perdido casi la mitad de su valor contra el dólar desde el verano. Las exportaciones de acero, que pagaron por todo, se han colapsado con la demanda mundial. El gobierno ha firmado por dieciséis mil millones de dólares del Fondo y las condiciones adjuntas serán pagadas por personas que nunca vieron el auge."
 ukr_history.49.a: "Tome el dinero del Fondo y sus condiciones."
 ukr_history.49.b: "Rechazar las condiciones e imprimir lo que necesitamos."
 ukr_history.50.t: "El Presidente toma su partido"
 ukr_history.50.d: "Con su calificación de aprobación en figuras individuales, el presidente finalmente ha tomado la dirección formal de Nuestra Ucrania. Es un intento de rescate para una parte que ha perdido sus estructuras regionales al Centro Unido y sus votantes a todos los demás."
 ukr_history.50.a: "So be it."
 ukr_history.51.t: "La Coalición con Lytvyn"
 ukr_history.51.d: "Se ha reunido una nueva mayoría: el Bloc Tymoshenko, la Autodefensa de Nuestra Ucrania-Persona y el Bloc Lytvyn, con Lytvyn en la silla del altavoz como precio. Veinte diputados deciden quién gobierna el país."
 ukr_history.51.a: "So be it."
 ukr_history.52.t: "La Guerra del Gas"
 ukr_history.52.d: "Durante diecinueve días en enero el tránsito se detuvo y la mitad de Europa se resfrió. El primer ministro voló a Moscú y firmó un contrato de diez años personalmente, sin la aprobación del presidente y sin su propia delegación en la sala. La fórmula de precio en ese contrato se utilizará contra ella por el resto de su carrera."
 ukr_history.52.a: "Firme - el país no puede congelarse."
 ukr_history.52.b: "Aguanta una mejor fórmula."
 ukr_history.53.t: "Svoboda Wins Ternopil"
 ukr_history.53.d: "En una elección rápida al consejo regional de Ternopil, Svoboda tomó el treinta cinco por ciento y primer lugar. Un partido encuestado por debajo del 1% nacional hace dos años dirige ahora una región. Galicia ha dejado de votar por las fiestas naranjas y empezó a votar contra todos."
 ukr_history.53.a: "So be it."
 ukr_history.54.t: "El peor año"
 ukr_history.54.d: "La producción industrial se reduce en un tercio, la economía contraerá un 15% este año, y los atrasos salariales regresan por primera vez desde los años noventa. Quien gane las elecciones presidenciales en enero heredará un país que ha dejado de creer que los últimos cinco años valían la pena."
 ukr_history.54.a: "So be it."
 ukr_history.55.t: "Tihipko vuelve"
 ukr_history.55.d: "El ex banquero central ha renombrado al Partido Laborista de Ucrania como fuerte Ucrania y se postula para presidente sobre competencia en lugar de lenguaje o historia. No ganará, pero el tercero del electorado que quiere que ninguno de los campamentos haya recibido finalmente una dirección."
 ukr_history.55.a: "So be it."
 ukr_history.56.t: "La Primera Ronda de 2010"
 ukr_history.56.d: "Yanukovych treinta y cinco por ciento, Tymoshenko veinticinco, Tihipko trece, Yatsenyuk siete. El presidente titular tomó cinco puntos cuatro - el peor resultado que cualquier presidente sentado haya registrado en cualquier lugar. La Revolución Naranja ha sido expulsada por la gente que lo hizo."
 ukr_history.56.a: "So be it."
 ukr_history.57.t: "Estabilidad y Reformas"
 ukr_history.57.d: "La nueva mayoría ha sido reunida por un método que la constitución no permite obviamente: los diputados individuales se unen a una coalición en lugar de las facciones enteras. El Tribunal Constitucional lo bendecirá dentro de un mes. Mykola Azarov se convierte en primer ministro y el Partido de las Regiones tiene la presidencia, el gobierno y la Rada inmediatamente."
 ukr_history.57.a: "So be it."
 ukr_history.58.t: "Azarov ocupa la Presidencia del Partido"
 ukr_history.58.d: "Con Yanukovych se trasladó a la presidencia, el primer ministro ha asumido formalmente al Partido de las Regiones. El partido es ahora una extensión del gabinete, y los grupos de negocios Donetsk que lo construyeron están recolectando su parte del estado."
 ukr_history.58.a: "So be it."
 ukr_history.59.t: "Frente de Yatsenyuk para el Cambio"
 ukr_history.59.d: "Después de un respetable cuarto lugar en las elecciones presidenciales, Arseniy Yatsenyuk ha convertido su campaña en partido. Front for Change ofrece competencia tecnócrata e integración europea a los votantes que están acabados con ambos campamentos de 2004."
 ukr_history.59.a: "So be it."
 ukr_history.60.t: "La Corte desacredita 2004"
 ukr_history.60.d: "El Tribunal Constitucional ha dictaminado que la reforma política de 2004 es inconstitucional por motivos de procedimiento y ha restablecido la Constitución de 1996. El presidente que asumió el cargo bajo una república parlamentaria gobierna ahora un presidencial, sin que se tome una sola votación en el Rada."
 ukr_history.60.a: "So be it."
 ukr_history.61.t: "Elecciones locales"
 ukr_history.61.d: "El Partido de las Regiones ha tomado el sur y el este y la mayor parte del centro. En Galicia Svoboda llegó primero en los tres consejos regionales. Nuestra Ucrania ha sido borrada del mapa que dibujó en 2004, y el espacio que ocupa ahora pertenece a una fiesta que fue en un 1% hace tres años."
 ukr_history.61.a: "So be it."
 ukr_history.62.t: "El Maidán Fiscal"
 ukr_history.62.d: "Los pequeños comerciantes y empresarios han puesto tiendas de campaña en la plaza de la Independencia contra el nuevo código tributario. No hay banderas de partido en la plaza y los organizadores han pedido a los políticos que se mantengan alejados. El presidente vetó las peores provisiones y el campamento fue despejado por la noche de todos modos."
 ukr_history.62.a: "Veto el código y despejar la plaza."
 ukr_history.62.b: "Empuja el código sin cambios."
