 tooltip_remove_productivity_from_state: "§WEsta productividad estatal será §Rdisminución§! by §R$PRODUCTIVITY_AMOUNT$§! puntos.\n §!"
 UKR_develop_t64_strazh_desc: "El BMPT 'Strazh' fue un vehículo experimental de apoyo a tanques de Ucrania desarrollado en el chasis del tanque T-64.\nEl proyecto fue desarrollado conjuntamente por la Zhytomyr Armoured Plant, Kyiv Armoured Plant y Artem State Holding Company y se presentó en 2017.\nLa torreta T-64 original fue reemplazada por el módulo de combate remoto «Duplet» ucraniano, dando al vehículo un papel completamente diferente del tanque original.\nEl proyecto tenía por objeto proporcionar apoyo contra incendios fuertemente protegidos al utilizar el chasis T-64 existente y el equipo de combate desarrollado por Ucrania.\n« Strazh» permaneció un proyecto experimental y no fue adoptado para la producción a gran escala, §G pero podemos cambiar eso, ¿verdad?§!"
 UKR_develop_t72amt_desc: "El T-72AMT fue una modernización ucraniana de la T-72A desarrollada por la planta blindada Kyiv para las fuerzas armadas de Ucrania.\nLa modernización introdujo el motor V-84-1, equipos mejorados de visión nocturna, la vista 1K13 y el sistema de armadura reactivo «Nizh» ucraniano.\nEl tanque también recibió equipos de comunicaciones modernos y el sistema de navegación SN-3003 'Basalt', mientras que elementos del equipo de funcionamiento fueron actualizados utilizando componentes desarrollados para el T-80.\nLa vista 1K13 permitió al tanque modernizado emplear el sistema de armas guiado 'Kombat'.\nEl T-72AMT fue concebido como una forma relativamente económica de acercar los tanques T-72 existentes a las necesidades operacionales modernas ucranianas."
 UKR_modernize_zsu_23_4m_a1_spaa_desc: "El ZSU-23-4M-A1 'Rokach' es una modernización ucraniana de la arma antiaérrea autopropulsada por los soviéticos ZSU-23-4 'Shilka'.\nLa modernización sustituye al equipo antidesgastado de control y observación por un sistema digital moderno, mejorando la capacidad del vehículo para detectar y rastrear objetivos aéreos.\nEl sistema mantiene los cuatro autocannons de 23 mm mientras recibe electrónica mejorada y cuatro misiles antiaéreos de corto alcance.\nEstos cambios mejoran significativamente la eficacia de combate del ZSU-23-4 contra objetivos de bajo vuelo."
 UKR_modernize_s125_spaa_desc: "El S-125-2D es una modernización ucraniana del sistema de misiles superficie-aire S-125 soviético.\nLa modernización tiene por objeto sustituir los componentes electrónicos obsoletos y mejorar la resistencia del sistema a la guerra electrónica y las contramedidas modernas.\nEl equipo de radar y orientación se actualiza, mientras que el sistema recibe mejores capacidades para detectar, rastrear y alcanzar objetivos aéreos.\nLa modernización tiene por objeto ampliar la vida operacional del S-125 y mejorar su eficacia en el campo de batalla moderno."
 UKR_modernize_s125m_spaa_desc: "El S-125M fue un programa de modernización ucraniano destinado a ampliar la vida útil y las capacidades del sistema soviético de defensa aérea S-125 'Pechora'.\nEl programa fue llevado a cabo por empresas de defensa ucranianas incluyendo KB Luch y Radionix, con trabajo centrado en la modernización del misil y el equipo de dirección y control de incendios del sistema.\nLa modernización incluyó misiles 5V27D actualizados y el sistema de radar FCR-125, reemplazando elementos importantes del equipo original de la era soviética.\nEl proyecto S-125M proporcionó a Ucrania una manera de ampliar significativamente la vida útil de los sistemas S-125 existentes sin desarrollar un complejo completamente nuevo de defensa aérea."
 UKR_modernize_kvadrat_spaa_desc: "El 2K12M1-2L 'Kvadrat-2L' es una modernización ucraniana del sistema soviético de misiles superficie-aire 2K12M1 'Kub'.\nLa modernización sustituye a una serie de componentes electrónicos anticuados por equipos modernos ucranianos.\nEl sistema recibe mejores capacidades de radar y control de incendios, aumentando su capacidad para detectar, rastrear y alcanzar objetivos aéreos.\nLa modernización tiene por objeto ampliar la vida útil de los sistemas 2K12M1 restantes, mejorando al mismo tiempo su eficacia frente a las amenazas modernas."
 UKR_develop_t38_stylet_spaa_desc: "El T-38 'Stylet' es un sistema ucraniano de misiles de corto alcance de superficie a aire desarrollado por la planta Arsenal junto con socios bielorrusos.\nEl sistema utiliza el misil T382 y está diseñado para atacar aviones, helicópteros, misiles de crucero y otros objetivos aéreos de bajo vuelo.\nEl complejo está montado en un chasis rastreado, proporcionándole alta movilidad y la capacidad de operar junto a unidades mecanizadas.\nEl desarrollo del T-38 proporciona a Ucrania un reemplazo moderno para el envejecimiento de los sistemas soviéticos de Osa de corto alcance."
 UKR_modernize_rk10_spaa_desc: "El RK-10 es un misil guiado ucraniano antiaéreo desarrollado como una alternativa a los misiles de envejecimiento utilizados por sistemas de defensa aérea de corto alcance de la era soviética.\nIntegrar el RK-10 con el sistema Strela-10 permitiría a sus lanzadores utilizar un nuevo misil manteniendo la infraestructura existente de vehículos y lanzadores.\nEl nuevo misil proporciona mejores capacidades de compromiso y permite que el sistema siga funcionando sin depender de municiones soviéticas cada vez más obsoletas.\nEsta modernización extendería la vida útil de la flota Strela-10 al mismo tiempo que aumentaría su eficacia de combate."
 UKR_develop_kentavr_spaa_desc: "El ZRAK 'Kentavr' fue un concepto ucraniano para un nuevo sistema antiaéreo autopropulsado desarrollado como una nueva evolución del proyecto anterior 'Pereach'.\nEl proyecto fue rediseñado en torno a dos cañones automáticos de 40 mm pareados, reemplazando el concepto anterior basado en una pistola antiaéreo de 57 mm, conservando al mismo tiempo un componente de misiles y equipos dedicados de control de incendios.\nEl concepto 'Kentavr' tenía por objeto combinar la detección de objetivos basada en radar con un sistema electro-óptico de control de incendios, lo que permitió al vehículo atacar objetivos aéreos utilizando armamento de armas y misiles.\nEl sistema se planificó en torno a un chasis rastreado derivado de la futura plataforma de tanques ucranianos desarrollada por el Kharkiv Morozov Design Bureau como parte del programa de desarrollo 'Molot'/'Bokser."
 UKR_modernize_planes_category: "Modernizar nuestras aeronaves de combate"
 UKR_modernize_planes_category_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_main\n\n\n\n\n\n\n\n\nPodemos pasar tiempo y dinero investigando y probando las mejoras para aviones y helicópteros de la era soviética, que están siendo utilizados por nuestra Fuerza Aérea. Y cuando algún tiempo pasará y ganaremos alguna experiencia - podemos incluso tratar de construir diseños domésticos únicos."
 UKR_modernize_su25_m1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1_for_tooltip\n\n\n\n\n\n\n\n\nEl Su-25M1 es una modernización ucraniana del avión Soviético de apoyo aéreo cercano Su-25.\nLa modernización introduce mejoras en la navegación, las comunicaciones y los equipos de ataque al tiempo que conservan las capacidades existentes del avión y las armas.\nLos sistemas actualizados mejoran la exactitud de las armas no guiadas y permiten que el avión funcione más eficazmente en condiciones modernas de combate.\nLa modernización también extiende la vida operacional de la flota su-25 de Ucrania."
 UKR_modernize_su27_1m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\nEl Su-27-1M es una modernización ucraniana del avión de combate soviético Su-27.\nEl programa introduce sistemas electrónicos mejorados de navegación, comunicación, identificación y a bordo para aumentar la eficacia de combate del avión.\nLos aviónicos mejorados proporcionan una mejor conciencia de la situación y mejora la capacidad del avión para emplear armas modernas.\nLa modernización permite que el Su-27 permanezca en servicio al mismo tiempo que reduce las limitaciones impuestas por su equipo original de la era soviética."
 UKR_modernize_mig29_mu2_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu1_for_tooltip\n\n\n\n\n\n\n\n\nEl MiG-29MU2 es una modernización ucraniana del avión de combate soviético MiG-29 desarrollado por Lviv State Aircraft Repair Plant.\nLa modernización se basa en el anterior programa MU1 e introduce mejoras más extensas a los sistemas aviónicos, de navegación y de orientación del avión.\nLa aeronave recibe mejores capacidades para emplear armas modernas guiadas e inguiadas contra objetivos aéreos y terrestres.\nEl programa MU2 está destinado a transformar el MiG-29 en un avión de combate multirole más capaz."
 UKR_modernize_mig29_mu1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu2_for_tooltip\n\n\n\n\n\n\n\n\nEl MiG-29MU1 es una modernización ucraniana del avión de combate soviético MiG-29.\nEl programa introduce electrónicas mejoradas a bordo y un sistema de alerta y navegación por radar modernizado.\nEl equipo actualizado mejora la conciencia situacional del piloto y permite que el avión funcione más eficazmente en las condiciones modernas de combate.\nLa modernización de MU1 también sirve como un paso intermedio hacia mejoras más extensas del MiG-29."
 UKR_develop_an_bfv_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_bfv_development_for_tooltip\n\n\n\n\n\n\n\n\nEl avión de combate Antonov propuesto era un proyecto conceptual para el desarrollo de un avión de combate designado por Ucrania.\nEl proyecto tenía por objeto utilizar la experiencia de Ucrania en el diseño y producción de aeronaves para crear un luchador moderno sin depender totalmente de los diseños extranjeros.\nEl avión incorporaría soluciones aviónicas, armas y aerodinámicas modernas mientras se adaptaba a las capacidades de la industria aeronáutica ucraniana.\nAunque el proyecto se mantiene en la etapa de la propuesta, su desarrollo podría sentar las bases para una futura generación de aviones de combate ucranianos."
 UKR_develop_bm21_k: "Develop §YBM-21K§! MLRS"
 UKR_develop_bm21_k_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bm21k_for_tooltip\n\n\n\n\n\n\n\n\nEl BM-21K es una modernización ucraniana del sistema de cohetes de lanzamiento múltiple «Grad» soviético BM-21.\nEl sistema está montado en un moderno chasis de camión KrAZ ucraniano y recibe mejores equipos de navegación, comunicación y control de incendios.\nLa modernización mejora la movilidad del sistema y permite que las tripulaciones preparen y realicen misiones de fuego más eficientemente.\nEl BM-21K proporciona una manera relativamente barata de modernizar la gran flota de lanzadores de la era soviética de Ucrania."
 UKR_develop_bastion03: "Develop §Y'Bastion-03'§! MLRS"
 UKR_develop_bastion03_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bastion03_for_tooltip\n\n\n\n\n\n\n\n\nEl 'Bastion-03' es un sistema de lanzamiento múltiple ucraniano desarrollado como una modernización del BM-27 soviético 'Uragan' por Shepetivska Reparación Planta.\nEl sistema se basa en un chasis de camión moderno.\nLa modernización mejora la movilidad y reduce el tiempo necesario para preparar al lanzador para disparar.\nLa Bastion-03 permitiría a Ucrania seguir utilizando cohetes existentes de 220 mm mientras reemplazaba el chasis de la era soviética envejecida."
 UKR_develop_Vilkha: "Desarrollar un MLRS de nueva generación §Y«Vilkha»§!"
 UKR_develop_Vilkha_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_vilkha_for_tooltip\n\n\n\n\n\n\n\n\nEl 'Vilkha' es un sistema de lanzamiento múltiple ucraniano desarrollado a partir del Soviético BM-30 'Smerch' por la Luch Design Bureau.\nEl proyecto sustituye a los cohetes originales sin guía por nuevos misiles guiados equipados con un sistema de orientación ucraniano.\nEl sistema está diseñado para proporcionar una precisión significativamente mejorada, manteniendo al mismo tiempo el alto potencial destructivo y el rango de un MLRS pesado.\nEl desarrollo de Vilkha representa una transición de la artillería de cohetes sin guía de la era soviética hacia las capacidades modernas de huelga de precisión."
 UKR_develop_bureviy: "Desarrollar un MLRS de nueva generación §Y«Bureviy»§!"
 UKR_develop_bureviy_desc: "\n\n\n\n\n\n£GFX_UKR_desctext_modernize_sov_bastion03_for_tooltip\n\n\n\n\n\n\n\n\nEl 'Bureviy' es un sistema de lanzamiento múltiple ucraniano diseñado como un reemplazo moderno para la familia BM-27 'Uragan' envejecida.\nEl sistema está montado en un moderno chasis Tatra T815-7T3R2T e incorpora sistemas digitales de control de incendios y navegación.\nBureviy está diseñado para utilizar los cohetes Smerch existentes de 220 mm, así como nuevas municiones desarrolladas por Ucrania.\nLa combinación de electrónica moderna, mayor movilidad y compatibilidad con las municiones existentes hace que el sistema sea una modernización práctica de la artillería de cohetes ucraniana."
 UKR_modernize_mi24pu1: "Desarrollar una modernización §YMi-24PU1§!"
 UKR_modernize_mi24pu1_desc: "La MiPU-24-1 es una modernización ucraniana de la Mi-24P desarrollada por la planta Konotop Aircraft Repair Plant 'Aviakon' junto con las empresas de defensa-industria ucranianas.\nEl helicóptero recibió más potentes motores TV3-117VMA-SBM1V-02 de Motor Sich, aviónicos modernizados y equipos de navegación, y sistemas para operación con equipo de visión nocturna.\nLa modernización también incorporó el sistema de protección Adros KT-01AV, el sistema de puntería láser FPM-01KV y una vista ASP-17VPM-V actualizada.\nEl programa incluyó a empresas como Motor Sich, Adron, TsKB Arsenal y Izium Instrument y Apparatus Factory, con versiones posteriores también utilizando equipos electro-ópticos ucranianos.\nPor lo tanto, el MiPU-24-1 combina una importante revisión del helicóptero original con nuevos motores ucranianos, aviónicos, protección y sistemas de ataque."
 UKR_develop_nota_desc: "El Objeto 477A1 Nota es un tanque de batalla principal experimental soviético avanzado con torreta no tripulada, compartimento de tripulación aislado y un potente cañón principal de 152 mm."
 UKR_modernize_nota_desc: "El Objeto 477A1 «Nota» es un desarrollo ucraniano del proyecto soviético de tanque de batalla principal avanzado Objeto 477 «Molot».\nEl diseño incorpora un compartimento de tripulación muy protegido, un compartimento de combate no tripulado y un potente armamento principal.\nLa modernización introduciría electrónica actualizada, sistemas de protección y otros componentes, a la vez que adaptaría el diseño a las tecnologías disponibles para la industria de defensa ucraniana.\nAunque el proyecto nunca llegó a la producción en serie, un mayor desarrollo podría ser la base de un tanque de batalla principal ucraniano avanzado."
 ukr_history.63.t: "El arresto de Yulia Tymoshenko"
 ukr_history.63.d: "El ex viceprimer ministro de combustible y energía ha sido llevado a la prisión de Lukyanivska por cargos de contrabando de gas y documentos falsificados que datan de sus años en United Energy Systems. Fue desestimada en enero después de oponerse a los esquemas de trueque del sector, y el caso se abrió dentro de semanas. Un tribunal gobernará la detención ilegal y la liberará después de cuarenta y dos días; para entonces ya no es una ministra que cayó con el presidente, sino el rostro de la oposición a él."
 ukr_history.63.a: "So be it."