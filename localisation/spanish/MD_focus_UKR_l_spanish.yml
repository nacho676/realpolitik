 ukraine_develop_btr4.8.desc: "Podemos elegir la duración y complejidad de las pruebas previas a la producción para BTR-4 APC.\n\nPodemos hacer el programa básico y ahorrar dinero y tiempo o extenso, que requerirá más recursos, pero podemos encontrar y deshacernos de algunos problemas, visibles en la producción de lotes a pequeña escala. Elimitarlas puede llevar a una máquina más fiable en la carrera de producción a gran escala."
