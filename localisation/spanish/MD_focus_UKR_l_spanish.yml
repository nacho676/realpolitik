l_spanish:
 ukraine_focus: "Árbol de enfoque ucraniano"
 UKR_home_to_chernobyl_zone: "Hogar de la zona de exclusión Chornobyl"
 UKR_chernobyl_tooltip: "La Zona de Exclusión de Chornobyl se estableció en las regiones septentrionales de este estado, tras el catastrófico accidente nuclear en la central nuclear de Chornobyl. La zona abarca una superficie de aproximadamente 2.600 kilómetros cuadrados en Ucrania y fue evacuada y declarada inhabitable debido a altos niveles de contaminación radiactiva. Desde su creación, la zona de exclusión ha sido gestionada por el gobierno ucraniano y se han realizado esfuerzos para vigilar y remediar los efectos ambientales y sanitarios del desastre."
 UKR_chernobyl_effects_tooltip: "§Rfugas adicionales de radiación podrían causar daños a largo plazo§!"
 UKR_ukraine_elections: "Elecciones ucranianas"
 UKR_ukraine_elections_desc: "Es hora de decidir quién dirigirá nuestro país más allá."
 donbass_civil_war: "La guerra civil en Donbass tuvo lugar"
 UKR_republic_ukr: "La República Federal"
 UKR_republic_ukr_desc: "La República Federal es un tipo especial de entidad, que es la base de toda la Federación Ucraniana. Ha ampliado la autonomía, así como la capacidad de hacer sus propias leyes."
 UKR_confederation: "Federalización"
 UKR_confederation_desc: "Varias regiones recibieron la máxima autonomía posible, lo que llevó a un estado similar al sistema Confederate."
 subject_ukr.1.t: "[FROM.GetNameWithFlag] solicita la construcción de una fábrica"
 subject_ukr.1.d: "[FROM.GetNameWithFlag] El gobierno solicita la construcción de una fábrica en su territorio, debido a la incapacidad de hacerlo por sí mismo."
 subject_ukr.1.a: "Sí"
 subject_ukr.1.b: "No"
 subject_ukr.2.t: "Construyendo una fábrica"
 subject_ukr.2.d: "[UKR.GetNameWithFlag] ha acordado construir una fábrica."
 subject_ukr.2.a: "Bien"
 subject_ukr.3.t: "Construyendo una fábrica"
 subject_ukr.3.d: "[UKR.GetNameWithFlag] se ha negado a construir una fábrica."
 subject_ukr.3.a: "Triste"
 subject_ukr.4.t: "[FROM.GetNameWithFlag] solicita subsidios"
 subject_ukr.4.d: "El gobierno de [FROM.GetNameWithFlag] solicita subsidios de nosotros para su presupuesto, ¿estamos dispuestos a asignarlos?"
 subject_ukr.4.a: "Sí"
 subject_ukr.4.b: "No"
 subject_ukr.5.t: "Subsidios del presupuesto federal"
 subject_ukr.5.d: "[UKR.GetNameWithFlag] ha acordado proporcionarnos fondos del presupuesto federal."
 subject_ukr.5.a: "Bien"
 subject_ukr.6.t: "Subsidios del presupuesto federal"
 subject_ukr.6.d: "[UKR.GetNameWithFlag] se ha negado a asignarnos fondos del presupuesto federal."
 subject_ukr.6.a: "Triste"
 UKR_subsidies: "Solicitar subsidios de §Y[UKR.GetNameWithFlag]§!"
 UKR_buildings: "Solicitar fábricas de §Y[UKR.GetNameWithFlag]§!"
 UKR_subject_annex: "Reintegrar sujetos de vuelta"
 UKR_authority_more_60: "Nuestro sujeto tiene §Y60%§! de autoridad entre el gobierno federal [ROOT.GetFlag]"
 ukraine_maidan_west.1.t: "Protestas en el Maidán"
 ukraine_maidan_west.1.d: "Nuestras políticas estatales no se adaptan a cierta parte de la población. La gente está empezando a salir a la famosa plaza Kiev - Maidan, como forma de expresar insatisfacción con nuestras decisiones políticas."
 ukraine_maidan_west.1.a: "Estamos observando"
 ukraine_maidan_west.2.t: "Protestas en el Maidán"
 ukraine_maidan_west.2.d: "Nuestro gobierno esperaba que las protestas llegaran a un rápido final, pero esto no sucedió; más bien, la gente comenzó a armar tiendas de campaña y establecer un campamento en la plaza para quedarse por un período más largo."
 ukraine_maidan_west.2.a: "Tengo un mal presentimiento sobre esto"
 ukraine_maidan_west.3.t: "Protestas en el Maidán"
 ukraine_maidan_west.3.d: "Los manifestantes no se van a ir y están empezando a comportarse más agresivamente, tal vez sea hora de tomar medidas y demoler su pequeña ciudad de tiendas."
 ukraine_maidan_west.3.a: "Despleguemos la unidad Berkut"
 ukraine_maidan_west.3.b: "No interferiremos"
 ukraine_maidan_west.4.t: "Protestas en el Maidán"
 ukraine_maidan_west.4.d: "Hemos comenzado a dispersar a los manifestantes, muchos canales de televisión extranjeros están cubriendo esto como una masacre sangrienta, pero nuestra tarea es sólo uno - para salvar el estado."
 ukraine_maidan_west.4.a: "Por el bien de la patria!"
 ukraine_maidan_west.5.t: "Protestas en el Maidán"
 ukraine_maidan_west.5.d: "Decidimos no dispersar a los manifestantes, esperando que su adorador se enfríe y todos regresarían a casa, por ahora vamos a ver lo que sucede después, pero hasta ahora no vemos ninguna señal de la situación refrescarse."
 ukraine_maidan_west.5.a: "Estamos esperando"
 ukraine_maidan_west.6.t: "Protestas en el Maidán"
 ukraine_maidan_west.6.d: "Decidimos negociar con los manifestantes, tal vez podamos satisfacer sus demandas políticas."
 ukraine_maidan_west.6.a: "Esperamos lo mejor"
 ukraine_maidan_west.7.t: "Protestas en el Maidán"
 ukraine_maidan_west.7.d: "Nuestros intentos de negociación fueron percibidos como una debilidad, incluso dentro de nuestro partido. Nuestros colegas están abandonando activamente nuestras filas y desertando al lado de los manifestantes, sintiendo que el viento del cambio está de su lado."
 ukraine_maidan_west.7.a: "Tengo un mal presentimiento sobre esto"
 ukraine_maidan_west.8.t: "Protestas en el Maidán"
 ukraine_maidan_west.8.d: "Nuestro partido político ha colapsado por completo, hemos perdido a nuestros colegas y parece que nuestros compañeros de partido están de acuerdo con las demandas de la oposición... Parece que este es el fin."
 ukraine_maidan_west.8.a: "Oh God..."
 ukraine_maidan_west.10.t: "La rebelión en el sureste"
 ukraine_maidan_west.10.d: "Las regiones del sureste también resultaron insatisfechas con los eventos que estaban ocurriendo y nos exigieron federalización. ¿Estaremos de acuerdo?"
 ukraine_maidan_west.10.a: "Donbass se convertirá en un sujeto"
 ukraine_maidan_west.10.b: "No habrá federalización"
 ukraine_maidan_west.11.t: "Motín en Járkov"
 ukraine_maidan_west.11.d: "Los disturbios en Donetsk y Lugansk provocaron una reacción similar en Járkov. Los separatistas lograron llegar al poder allí y declarar su República de Járkov."
 ukraine_maidan_west.11.a: "¿Cuántos hay?"
 ukraine_maidan_west.12.t: "Odesa Mutiny"
 ukraine_maidan_west.12.d: "Los levantamientos en Donbass han provocado disturbios en Odesa. Al principio todo comenzó pacíficamente, y pudo haber terminado, pero no teníamos los recursos para derribar la rebelión, y ahora los ciudadanos locales han declarado su república."
 ukraine_maidan_west.12.a: "¿Cuántos hay?"
 ukraine_maidan_west.13.t: "Protestas en el Maidán"
 ukraine_maidan_west.13.d: "Hemos hecho un intento de dispersar el Maidán por la fuerza con la participación de Berkut."
 ukraine_maidan_west.13.a: "Protejamos el país!"
 ukraine_maidan_west.14.t: "Protestas en el Maidán"
 ukraine_maidan_west.14.d: "La respuesta no se hizo esperar y las protestas comenzaron a radicalizarse. Adoptando una estrategia violenta, la gente comenzó a usar cócteles molotov, armas pequeñas y piedras contra nuestras fuerzas de seguridad."
 ukraine_maidan_west.14.a: "Oh God..."
 ukraine_maidan_west.15.t: "Desplegar el ejército!"
 ukraine_maidan_west.15.d: "Intentaremos desplegar el ejército para hacer un intento de reprimir las protestas."
 ukraine_maidan_west.15.a: "Las Fuerzas Armadas de Ucrania salvarán a Ucrania."
 ukraine_maidan_west.16.t: "Protestas en el Maidán"
 ukraine_maidan_west.16.d: "Varias unidades de las fuerzas armadas fueron puestas en alerta máxima y enviadas a la capital para lidiar con las protestas."
 ukraine_maidan_west.16.a: "El ejército ha llegado a Kiev"
 ukraine_maidan_west.16.b: "El ejército no pudo ayudar"
 ukraine_maidan_west.17.t: "La masacre de Kiev"
 ukraine_maidan_west.17.d: "El ejército entró en un enfrentamiento armado con los manifestantes. Comenzó una verdadera masacre, ya que se dispararon armas de fuego desde ambos lados en la batalla."
 ukraine_maidan_west.17.a: "Eso es horrible"
 ukraine_maidan_west.18.t: "La masacre de Kiev"
 ukraine_maidan_west.18.d: "No tuvimos otra opción y, como resultado, muchos que pudieron sobrevivir a esta represión huyeron a las regiones occidentales del país, donde se están preparando para luchar contra nuestro gobierno por tal cruel traición a su pueblo."
 ukraine_maidan_west.18.a: "Se avecina una tormenta"
 ukraine_maidan_west.20.t: "Protestas en el Maidán"
 ukraine_maidan_west.20.d: "Sin el apoyo del ejército, nuestras fuerzas de seguridad no pueden hacer frente a la presión de los manifestantes, tal vez la ronda final de esta lucha llegará pronto."
 ukraine_maidan_west.20.a: "El fin está cerca"
 ukraine_maidan_west.21.t: "Protestas en el Maidán"
 ukraine_maidan_west.21.d: "Ocurrió una terrible tragedia durante las protestas. Francotiradores desconocidos abrieron fuego contra los manifestantes, provocando una reacción aún mayor. Nuestros colegas se van, creyendo que la orden de disparar provino de nuestro gobierno."
 ukraine_maidan_west.21.a: "¿Realmente hemos perdido?"
 ukraine_maidan_west.22.t: "Protestas en el Maidán"
 ukraine_maidan_west.22.d: "Nuestro gobierno ha colapsado por completo. Pronto, no habrá nadie que nos apoye. Es hora de prepararse para entregar el poder."
 ukraine_maidan_west.22.a: "Últimas horas"
 ukraine_maidan_west.23.t: "Protestas en el Maidán"
 ukraine_maidan_west.23.d: "Nuestro gobierno finalmente ha sido derrocado. Las protestas han logrado su objetivo."
 ukraine_maidan_west.23.a: "El Maidán ha ganado!"
 ukraine_maidan_east.1.t: "Disturbios en el sureste"
 ukraine_maidan_east.1.d: "Nuestras políticas han llevado a protestas y manifestaciones en el sureste del país. Protestas con consignas claramente antigubernamentales han envuelto a muchas ciudades."
 ukraine_maidan_east.1.a: "De Repente"
 ukraine_maidan_east.2.t: "Los diputados se autoorganizan"
 ukraine_maidan_east.2.d: "Las protestas están ganando impulso y ahora los diputados locales se han unido a ellas, declarando consignas bastante peligrosas."
 ukraine_maidan_east.2.a: "Preocupante"
 ukraine_maidan_east.4.t: "Un intento de negociación"
 ukraine_maidan_east.4.d: "Los diputados quieren negociar. Todavía es posible resolver el conflicto pacíficamente."
 ukraine_maidan_east.4.a: "Conozca a los diputados"
 ukraine_maidan_east.5.t: "Las negociaciones han fracasado"
 ukraine_maidan_east.5.d: "No pudimos llegar a un acuerdo. Los manifestantes ya no están interesados en una solución pacífica."
 ukraine_maidan_east.5.a: "Preparándonos para lo peor"
 ukraine_maidan_east.6.t: "Negociaciones Siguen"
 ukraine_maidan_east.6.d: "Por ahora, pudimos prevenir la violencia y negociar con las partes involucradas en el conflicto. Ahora esperamos su propuesta de un acuerdo final."
 ukraine_maidan_east.6.a: "Podemos haber evitado lo peor"
 ukraine_maidan_east.7.t: "Organización de la milicia"
 ukraine_maidan_east.7.d: "Los manifestantes locales han comenzado a formar unidades de milicia, lo que lleva a una rebelión armada."
 ukraine_maidan_east.7.a: "Oh God..."
 ukraine_maidan_east.8.t: "Comenzar la represión"
 ukraine_maidan_east.8.d: "La situación se está saliendo de control en muchas regiones del sureste. Es hora de tomar medidas decisivas."
 ukraine_maidan_east.8.a: "Iremos a Odesa."
 ukraine_maidan_east.8.b: "Iremos a Donbass y Járkov"
 ukraine_maidan_east.8.c: "Debemos prepararnos mejor"
 ukraine_maidan_east.9.t: "Odesa es salvada"
 ukraine_maidan_east.9.d: "Suprimimos a los separatistas locales antes de que pudieran apoderarse del control de la región, pero ahora una rebelión armada ha comenzado en Donbas debido a nuestro enfoque en Odesa."
 ukraine_maidan_east.9.a: "Es hora de prepararse"
 ukraine_maidan_east.10.t: "Represión de Donbass"
 ukraine_maidan_east.10.d: "Nuestro intento de reprimir la rebelión de Donbass no tuvo éxito. Las unidades de Berkut se han unido a los rebeldes, poniéndonos en una situación aún más difícil."
 ukraine_maidan_east.10.a: "Es hora de prepararse"
 ukraine_maidan_east.11.t: "Retraso crítico"
 ukraine_maidan_east.11.d: "Nuestro retraso resultó en que muchas repúblicas en el sureste estallaran en rebeliones armadas."
 ukraine_maidan_east.11.a: "Cometimos un error."
 ukraine_maidan_east.12.t: "Disturbios en el sureste"
 ukraine_maidan_east.12.d: "Nuestras acciones han llevado a una escalada generalizada y ahora estamos enfrentando las consecuencias."
 ukraine_maidan_east.12.a: "Cometimos un error."
 ukraine_maidan_east.13.t: "Motín en Járkov"
 ukraine_maidan_east.13.d: "La falta de preparación de nuestros servicios especiales nos jugó otra mala pasada. En Járkov, no pudimos reprimir la rebelión, lo que llevó a un levantamiento armado."
 ukraine_maidan_east.13.a: "¿Cuántos hay?"
 ukraine_maidan_east.17.t: "La rebelión de Donbass"
 ukraine_maidan_east.17.d: "Ha comenzado un levantamiento armado en las regiones de Donetsk y Lugansk. Las unidades de Berkut han sido instrumentales para ayudar a los rebeldes a desarmar algunas unidades militares estacionadas allí."
 ukraine_maidan_east.17.a: "Maldición"
 ukraine_maidan_east.18.t: "La Odesa Mutiny"
 ukraine_maidan_east.18.d: "La deserción de Berkut a los rebeldes ha inspirado enormemente a los separatistas en Odesa, donde también han declarado la creación de una república popular."
 ukraine_maidan_east.18.a: "¿Cuántos hay?"
 ukraine_maidan_east.19.t: "El gobierno está perdiendo poder"
 ukraine_maidan_east.19.d: "Cometimos errores críticos que llevaron a una guerra civil y nuestros oponentes políticos utilizarán esto para apoderarse del poder."
 ukraine_maidan_east.19.a: "Venga lo que venga"
 ukraine_maidan_east.19.b: "Venga lo que venga"
 ukraine_maidan_east.19.c: "Venga lo que venga"
 ukraine_maidan_east.21.t: "El gobierno está perdiendo poder"
 ukraine_maidan_east.21.d: "Cometimos errores críticos que llevaron a una guerra civil y nuestros oponentes políticos utilizarán esto para apoderarse del poder."
 ukraine_maidan_east.21.a: "Nos las arreglaremos solos"
 ukraine_maidan_east.21.b: "Pediremos la ayuda de Rusia"
 ukraine_maidan_east.22.t: "Consolidación contra un enemigo común"
 ukraine_maidan_east.22.d: "A pesar del estallido de la guerra civil, la gente se ha unido a nuestro alrededor. Solo hemos perdido un poco de terreno político, compensando con consignas sobre la santa lucha contra los separatistas."
 ukraine_maidan_east.22.a: "Por Ucrania!"
 ukraine_maidan_east.23.t: "Ucrania ha solicitado nuestra ayuda"
 ukraine_maidan_east.23.d: "El gobierno ucraniano nos ha pedido ayuda debido al estallido de la guerra civil. Ahora debemos decidir si estamos dispuestos a ayudarlos."
 ukraine_maidan_east.23.a: "Los ayudaremos"
 ukraine_maidan_east.23.b: "Déjenlos manejarlo ellos mismos"
 ukraine_maidan_east.24.t: "Elegir ayuda"
 ukraine_maidan_east.24.d: "Aceptamos la solicitud de Ucrania de enviar un contingente. Ahora, debemos decidir a quién enviar."
 ukraine_maidan_east.24.a: "Enviaremos a la policía antidisturbios"
 ukraine_maidan_east.24.b: "Enviaremos a la Rosgvardiya"
 ukraine_maidan_east.24.c: "Enviaremos al PMC Wagner"
 ukraine_maidan_east.25.t: "Rusia se ha negado a ayudarnos"
 ukraine_maidan_east.25.d: "El gobierno ruso se ha negado a enviarnos ayuda o participar en nuestros trágicos eventos de ninguna manera. Estamos decepcionados."
 ukraine_maidan_east.25.a: "Traidor"
 ukraine_maidan_east.26.t: "Cuestión de la federalización"
 ukraine_maidan_east.26.d: "Los rebeldes han presentado su demanda principal y única: la federalización de Ucrania, otorgando a Donbass un estatus especial como sujeto federal. ¿Estamos dispuestos a asumir el riesgo y aceptar tal reforma?"
 ukraine_maidan_east.26.a: "Debe haber federalización"
 ukraine_maidan_east.26.b: "Nunca"
 ukraine_maidan_east.27.t: "Paz al fin"
 ukraine_maidan_east.27.d: "Aceptamos la federalización y, gracias a esto, pudimos evitar terribles consecuencias para nuestro país."
 ukraine_maidan_east.27.a: "Bueno"
 UKR_maidan_temporary_attack_idea: "Ofensiva organizada"
 ukraine_maidan.1.t: "Estado de Crimea"
 ukraine_maidan.1.d: "Crimea tiene una población mayoritariamente rusa. La gente allí es nuestra gente. No es justo para ellos y sus hermanos en Donbass vivir bajo el dominio ucraniano. ¿Deberíamos honrar su llamado e integrar a las personas que anhelan estar con nosotros?"
 ukraine_maidan.1.a: "Tomemos Crimea!"
 ukraine_maidan.1.b: "Crimea es ucraniana"
 ukraine_maidan.2.t: "Rusia se anexa Crimea"
 ukraine_maidan.2.d: "La gente de Crimea se ha separado. Han buscado el apoyo del gobierno ruso. Los crimeos aprobaron abrumadoramente un referéndum para permitir que el estado sea absorbido por el estado ruso. Las tropas rusas estacionadas cerca de Crimea inundaron la región y rápidamente tomaron puntos clave. Las tropas fueron recibidas con los brazos abiertos por los traidores. Algún día, recuperaremos el territorio que nos pertenece por derecho."
 ukraine_maidan.2.a: "Interesante"
 ukraine_maidan.3.t: "Rusia niega al pueblo de Ucrania"
 ukraine_maidan.3.d: "Los traidores en Crimea finalmente han celebrado su tonta referéndum para tratar de separarse de nosotros. La gente de Rusia ha fomentado este comportamiento durante mucho tiempo. Es un misterio por qué los rusos han negado a la gente de Crimea. Sin embargo, se agradece que no nos hayan socavado más al tomar el control de la región. El tiempo dirá qué ha causado esta decisión."
 ukraine_maidan.3.a: "Un buen día"
 ukraine_maidan.4.t: "Los Acuerdos de Minsk"
 ukraine_maidan.4.d: "La guerra no condujo al resultado esperado para nosotros. Los separatistas no han sido destruidos y la gente está claramente descontenta con la guerra interminable. ¿Tal vez deberíamos tomarnos un descanso?"
 ukraine_maidan.4.a: "Paz ahora"
 ukraine_maidan.4.b: "¿Paz? ¿Por qué?"
 ukraine_maidan.6.t: "Observadores de la OSCE"
 ukraine_maidan.6.d: "Para controlar y prevenir el conflicto armado, se enviaron observadores de la OSCE a la zona fronteriza para garantizar la paz y la estabilidad en el Donbás."
 ukraine_maidan.6.a: "Solo una tregua"
 ukraine_maidan.8.t: "Ucrania propone la federalización"
 ukraine_maidan.8.d: "Ucrania nos ofrece un proyecto de federalización y acepta reconocernos como una entidad separada. ¿Estaremos de acuerdo con esto?"
 ukraine_maidan.8.a: "Estamos de acuerdo"
 ukraine_maidan.8.b: "Nos negamos"
 ukraine_maidan.9.t: "Trabajando con empresas rusas"
 ukraine_maidan.9.d: "Continuaremos trabajando con empresas rusas porque la Unión Europea no puede proporcionarnos el nivel de recursos y tecnología que necesitamos."
 ukraine_maidan.9.a: "Sacrificio necesario"
 ukraine_maidan.16.t: "Reforma populista"
 ukraine_maidan.16.d: "Nuestra presidencia debe comenzar con algún tipo de reforma. Debemos decidir exactamente qué se convertirá en el foco de nuestras actividades reformistas."
 ukraine_maidan.16.a: "Reforma agraria"
 ukraine_maidan.16.b: "Reforma de carreteras"
 ukraine_maidan.16.c: "Influiremos en la Rada"
 ukraine_news.7.t: "Guerra civil en Ucrania"
 ukraine_news.7.d: "La gente en la región de Donbás de Ucrania se ha declarado independiente. Han anunciado a la gente en los óblasts de Donetsk y Lugansk que ya no se someterán a la tiranía de Kiev. [UKR.GetLeader] y la administración ucraniana han denunciado a los rebeldes y se han movilizado para sofocarlos. Ya han estallado escaramuzas en la región entre las fuerzas locales pro-Ucrania y los rebeldes."
 ukraine_news.7.a: "Reprimir la rebelión"
 ukraine_news.7.b: "Derrota a los opresores!"
 ukraine_news.7.c: "Situación interesante"
 ukraine_news.8.t: "Anexión de Crimea"
 ukraine_news.8.d: "La gente de Crimea ha celebrado un referéndum para separarse de Ucrania y alinearse con Rusia. La respuesta rusa fue rápida y decisiva, ya que rápidamente inundaron tropas en la región y anexaron la península. Las posiciones militares clave fueron rápidamente tomadas. El gobierno ucraniano ha expresado su indignación por el asunto y exige que Rusia devuelva Crimea."
 ukraine_news.8.a: "Solo por ahora..."
 ukraine_news.8.b: "Por la Madre Rusia!"
 ukraine_news.8.c: "Noticias preocupantes."
 UKR_crimea_bund: "La República de Crimea se ha rebelado"
 UKR_civil_war: "Guerra en Donbás"
 UKR_civil_war_desc: "Nuestro país está dividido - estamos librando una guerra civil contra nuestros propios ciudadanos, nuestro ejército no está unido en su prisa por destruir a los separatistas."
 UKR_russian_gas: "Recursos energéticos rusos"
 UKR_russian_gas_desc: "Estamos muy dependientes del suministro de recursos de Rusia, y hasta que encontremos una alternativa a esto, nos vemos obligados a negociar con Moscú."
 UKR_russian_gas_cheap: "Recursos energéticos rusos baratos"
 UKR_russian_gas_cheap_desc: "Estamos muy dependientes del suministro de recursos de Rusia, y hasta que encontremos una alternativa a esto, nos vemos obligados a negociar con Moscú."
 UKR_russian_gas_cheaper: "Recursos energéticos rusos baratos"
 UKR_russian_gas_cheaper_desc: "Estamos muy dependientes del suministro de recursos de Rusia, y hasta que encontremos una alternativa a esto, nos vemos obligados a negociar con Moscú."
 UKR_russian_gas_sov: "Contrato de gas con Ucrania"
 UKR_russian_gas_sov_desc: "El contrato de gas ha sido firmado entre Ucrania y nosotros, en condiciones especiales, lo que nos permite tener ventaja sobre ellos."
 UKR_russian_gas_cheap_sov: "Contrato de gas con Ucrania"
 UKR_russian_gas_cheap_sov_desc: "El contrato de gas ha sido firmado entre Ucrania y nosotros, en condiciones especiales, lo que nos permite tener ventaja sobre ellos."
 UKR_russian_gas_cheaper_sov: "Contrato de gas con Ucrania"
 UKR_russian_gas_cheaper_sov_desc: "El contrato de gas ha sido firmado entre Ucrania y nosotros, en condiciones especiales, lo que nos permite tener ventaja sobre ellos."
 UKR_idea_old_national_guard: "La Guardia Nacional"
 UKR_idea_old_national_guard_desc: "El Guardia Nacional de Ucrania es un órgano armado estatal creado sobre la base de los Tropas Internos de la URSS, diseñado para proteger la soberanía de Ucrania, su integridad territorial, así como la vida y dignidad personal de los ciudadanos, sus derechos constitucionales y libertades contra las injerencias criminales y otras acciones antisociales."
 UKR_kleptocracy: "Cleptocracia"
 UKR_kleptocracy_desc: "El gobierno ucraniano actualmente está atrapado en su cleptocracia. Los altos rangos están corrompidos y utilizan su poder para explotar a la gente y los recursos naturales de su territorio para extender su riqueza y poderes políticos. \n\n§CTara eliminar el impacto negativo de la cleptocracia, el país debe tomar medidas para combatir la corrupción.§!"
 UKR_kleptocracy01: "Cleptocracia fuerte"
 UKR_kleptocracy01_desc: "El gobierno ucraniano actualmente está atrapado en su cleptocracia. Los altos rangos están corrompidos y utilizan su poder para explotar a la gente y los recursos naturales de su territorio para extender su riqueza y poderes políticos. \n\n§CTara eliminar el impacto negativo de la cleptocracia, el país debe tomar medidas para combatir la corrupción.§!"
 UKR_kleptocracy02: "Cleptocracia muy fuerte"
 UKR_kleptocracy02_desc: "El gobierno ucraniano actualmente está atrapado en su cleptocracia. Los altos rangos están corrompidos y utilizan su poder para explotar a la gente y los recursos naturales de su territorio para extender su riqueza y poderes políticos. \n\n§CTara eliminar el impacto negativo de la cleptocracia, el país debe tomar medidas para combatir la corrupción.§!"
 UKR_kleptocracy03: "Cleptocracia paralizante"
 UKR_kleptocracy03_desc: "El gobierno ucraniano actualmente está atrapado en su cleptocracia. Los altos rangos están corrompidos y utilizan su poder para explotar a la gente y los recursos naturales de su territorio para extender su riqueza y poderes políticos. \n\n§CTara eliminar el impacto negativo de la cleptocracia, el país debe tomar medidas para combatir la corrupción.§!"
 UKR_to_many_generals: "Estado Mayor excesivo"
 UKR_to_many_generals_desc: "Ucrania tiene 450 generales activos en su ejército. La mayoría de ellos obtuvieron sus puestos debido a vínculos y esquemas de corrupción y no tienen experiencia en la conducción de operaciones de combate. El estado mayor actual es incompetente y necesita desesperadamente una reforma."
 UKR_idea_government_in_need: "Gobierno ineficaz"
 UKR_every_man_ataman: "Cada hombre - Otaman"
 UKR_every_man_ataman_desc: "La libertad se extiende profundamente en el alma ucraniana. Como los cosacos antiguos, todo ucraniano está dispuesto a defender su patria, dirigir cuando es llamado y luchar por la independencia de su nación. A lo largo de su historia, los ucranianos han guardado ferozmente su libertad y mantenido a sus gobernantes para rendir cuentas, porque ninguna autoridad está por encima de la voluntad de un pueblo libre."
 UKR_support_uia: "UIA"
 UKR_support_uia_desc: "UIA o Ukrainian International Airlines es la aerolínea insignia y más grande presente en Ucrania. El centro principal para sus aviones es el Aeropuerto Internacional de Boryspil en Kiev. Opera vuelos de pasajeros y servicios de carga a Europa, Oriente Medio, Estados Unidos, Canadá y Asia."
 UKR_build_new_airports: "Construir nuevos aeropuertos"
 UKR_build_new_airports_desc: "Nuestros aeropuertos han sido descuidados durante demasiado tiempo. Necesitamos invertir en nuestros aeropuertos tanto para fines civiles como militares."
 UKR_invest_in_ministry_of_infrastructure: "Ministerio de Infraestructura"
 UKR_invest_in_ministry_of_infrastructure_desc: "El Ministerio de Infraestructura ha recibido algunas críticas. La infraestructura de Ucrania se está desmoronando debido a funcionarios corruptos en el Ministerio que desvían fondos. La gente no puede conducir por algunas carreteras debido a las condiciones. Es hora de rediseñar el Ministerio con la esperanza de un futuro mejor para nuestras industrias."
 UKR_roads_extend_plan: "Planes de inversión en carreteras"
 UKR_roads_extend_plan_desc: "Las carreteras en Ucrania no son las mejores del mundo. Algunas áreas todavía dependen de carreteras sin pavimentar o casi destruidas. Es hora de que estas regiones reciban un poco de amor."
 UKR_ukrainian_railways: "UZ"
 UKR_ukrainian_railways_desc: "UZ es el nombre de la empresa estatal que actualmente posee un monopolio masivo en la mayoría del transporte ferroviario ucraniano dentro del país. La compañía cuenta con una impresionante longitud total de pista combinada de más de 23.000 km de altura, marcando que es el 13.º más grande del mundo.\n\nTambién es el transportador de pasajeros ferroviario 6.º más grande y el 7.º transportador de carga más grande."
 UKR_gas_tt: "Le pagamos a Rusia por recursos energéticos: $§R0.175§!\n"
 UKR_gas_cheap_tt: "Le pagamos a Rusia por recursos energéticos: $§R0.100§!\n"
 UKR_gas_cheaper_tt: "Le pagamos a Rusia por recursos energéticos: $§R0.100§!\n"
 UKR_gassov_tt: "Ucrania paga por nuestros recursos energéticos: $§G0.175§!\n"
 UKR_gassov_cheap_tt: "Ucrania paga por nuestros recursos energéticos: $§G0.100§!\n"
 UKR_gassov_cheaper_tt: "Ucrania paga por nuestros recursos energéticos: $§G0.100§!\n"
 UKR_neutrality_neutral_social_are_in_coalition_TT: "El SPU no está en una coalición"
 UKR_idea_pro_ukraine_reform_1: "Gobierno reformado."
 UKR_west_east_rivalry_balanced: "Entre el Este y el Oeste \n§LEl estado actual de la rivalidad:§! §GBalanceado§!\n"
 UKR_west_east_rivalry_balanced_desc: "El fin de la Guerra Fría trajo un grado sin precedentes de independencia a Ucrania. Sin embargo, el legado de suzerainty se enfureció, haciendo más volátil la escena política del país. Rusia sigue influenciando a Ucrania desde el este, mientras que la Unión Europea comenzó a ejercer su poder sobre el país desde el oeste. Dentro de Ucrania surgieron facciones políticas competidoras, cada una leal a un patrono extranjero o al otro. \n\n§R¡Los cambios en la política nacional o extranjera pueden perturbar el equilibrio de poder entre los campamentos prooccidental y favorable al este!§! \n\n§C(Predominio pro-oriental)§! \nEl gobierno se centrará en vínculos más estrechos con Rusia (incluida la integración de CSTO y EACU), lo que causará descontento entre las fuerzas nacionalistas. \n\n§C(Predominio pro-occidental)§! \nEl gobierno se centrará en la integración de la UE y la OTAN, que a su vez causará descontento entre los opositores en el campo pro-ruso."
 UKR_west_strengthened: "Entre Oriente y Occidente \n§LEstado actual de rivalidad:§! §G Caminando hacia Occidente§!\n"
 UKR_west_strengthened_desc: "El fin de la Guerra Fría trajo un grado sin precedentes de independencia a Ucrania. Sin embargo, el legado de suzerainty se enfureció, haciendo más volátil la escena política del país. Rusia sigue influenciando a Ucrania desde el este, mientras que la Unión Europea comenzó a ejercer su poder sobre el país desde el oeste. Dentro de Ucrania surgieron facciones políticas competidoras, cada una leal a un patrono extranjero o al otro. \n\n§R¡Los cambios en la política nacional o extranjera pueden perturbar el equilibrio de poder entre los campamentos prooccidental y favorable al este!§! \n\n§C(Predominio pro-oriental)§! \nEl gobierno se centrará en vínculos más estrechos con Rusia (incluida la integración de CSTO y EACU), lo que causará descontento entre las fuerzas nacionalistas. \n\n§C(Predominio pro-occidental)§! \nEl gobierno se centrará en la integración de la UE y la OTAN, que a su vez causará descontento entre los opositores en el campo pro-ruso."
 UKR_west_dominant: "Entre el Este y el Oeste \n§LEl estado actual de la rivalidad:§! §GPro-Occidental§!"
 UKR_west_dominant_desc: "El fin de la Guerra Fría trajo un grado sin precedentes de independencia a Ucrania. Sin embargo, el legado de suzerainty se enfureció, haciendo más volátil la escena política del país. Rusia sigue influenciando a Ucrania desde el este, mientras que la Unión Europea comenzó a ejercer su poder sobre el país desde el oeste. Dentro de Ucrania surgieron facciones políticas competidoras, cada una leal a un patrono extranjero o al otro. \n\n§R¡Los cambios en la política nacional o extranjera pueden perturbar el equilibrio de poder entre los campamentos prooccidental y favorable al este!§! \n\n§C(Predominio pro-oriental)§! \nEl gobierno se centrará en vínculos más estrechos con Rusia (incluida la integración de CSTO y EACU), lo que causará descontento entre las fuerzas nacionalistas. \n\n§C(Predominio pro-occidental)§! \nEl gobierno se centrará en la integración de la UE y la OTAN, que a su vez causará descontento entre los opositores en el campo pro-ruso."
 UKR_east_strengthened: "Entre el Este y el Oeste \n§LEl estado actual de la rivalidad:§! §GMoviéndose hacia el Este§!\n"
 UKR_east_strengthened_desc: "El fin de la Guerra Fría trajo un grado sin precedentes de independencia a Ucrania. Sin embargo, el legado de suzerainty se enfureció, haciendo más volátil la escena política del país. Rusia sigue influenciando a Ucrania desde el este, mientras que la Unión Europea comenzó a ejercer su poder sobre el país desde el oeste. Dentro de Ucrania surgieron facciones políticas competidoras, cada una leal a un patrono extranjero o al otro. \n\n§R¡Los cambios en la política nacional o extranjera pueden perturbar el equilibrio de poder entre los campamentos prooccidental y favorable al este!§! \n\n§C(Predominio pro-oriental)§! \nEl gobierno se centrará en vínculos más estrechos con Rusia (incluida la integración de CSTO y EACU), lo que causará descontento entre las fuerzas nacionalistas. \n\n§C(Predominio pro-occidental)§! \nEl gobierno se centrará en la integración de la UE y la OTAN, que a su vez causará descontento entre los opositores en el campo pro-ruso."
 UKR_east_dominant: "Entre el Este y el Oeste \n§LEl estado actual de la rivalidad:§! §GPro-Oriental§!"
 UKR_east_dominant_desc: "El fin de la Guerra Fría trajo un grado sin precedentes de independencia a Ucrania. Sin embargo, el legado de suzerainty se enfureció, haciendo más volátil la escena política del país. Rusia sigue influenciando a Ucrania desde el este, mientras que la Unión Europea comenzó a ejercer su poder sobre el país desde el oeste. Dentro de Ucrania surgieron facciones políticas competidoras, cada una leal a un patrono extranjero o al otro. \n\n§R¡Los cambios en la política nacional o extranjera pueden perturbar el equilibrio de poder entre los campamentos prooccidental y favorable al este!§! \n\n§C(Predominio pro-oriental)§! \nEl gobierno se centrará en vínculos más estrechos con Rusia (incluida la integración de CSTO y EACU), lo que causará descontento entre las fuerzas nacionalistas. \n\n§C(Predominio pro-occidental)§! \nEl gobierno se centrará en la integración de la UE y la OTAN, que a su vez causará descontento entre los opositores en el campo pro-ruso."
 UKR_idea_orthodox_christian_church: "Iglesia Ortodoxa Ucraniana"
 UKR_idea_shortened_general_staff: "Estado Mayor General Compacto"
 ukraine_coup.1.t: "Rusia Intentó Darnos un Golpe de Estado!"
 ukraine_coup.1.d: "El último informe de Kiev indica que agentes apoyados por Rusia estaban a punto de darnos un golpe de estado. Esto es una amenaza directa a nuestra independencia por parte de Rusia!"
 ukraine_coup.1.a: "Bastards."
 ukraine_coup.2.t: "Rusia Nos Dio un Golpe de Estado!"
 ukraine_coup.2.d: "El último informe de Kiev indica que agentes apoyados por Rusia dieron un golpe de estado a nuestro gobierno. Ahora nuestro país será gobernado por una camarilla de establecimientos pro-rusos!"
 ukraine_coup.2.a: "¿WTF?"
 UKR_war_on_donbass_experience: "Nuestro Ejército"
 UKR_war_on_donbass_experience_desc: "El ejército ucraniano es literalmente una sombra de su antiguo soviético, y ahora ruso, contraparte. Es hora de cambiar eso."
 UKR_ukrainian_armed_forces_reform: "Reforma de las Fuerzas Armadas"
 UKR_ukrainian_armed_forces_reform_desc: "Nuestras fuerzas armadas necesitan urgentemente reformas. Debemos crear nuevas estructuras y nuevos tipos de tropas, y resolver los viejos problemas de nuestro ejército."
 UKR_contract_army: "Reforma de la Educación Militar"
 UKR_contract_army_desc: "Reorganizaremos las viejas universidades militares, así como crear nuevas, para mejorar la calidad de nuestras fuerzas armadas."
 UKR_ter_oborona: "Crear Defensa Territorial"
 UKR_ter_oborona_desc: "Necesitamos unidades más diferentes para proteger nuestra patria. Comenzaremos la creación de Defensa Territorial ucraniana para que cada región esté protegida."
 UKR_create_sso: "Crear Fuerzas de Operaciones Especiales de Ucrania"
 UKR_create_sso_desc: "La nueva estructura militar ayudará a luchar más eficazmente contra nuestros enemigos."
 UKR_cut_down_the_general_staff: "Reducir el Número de Generales"
 UKR_cut_down_the_general_staff_desc: "Demasiados generales afectan negativamente a nuestro ejército, es hora de arreglarlo."
 UKR_dshv_create: "Fuerzas de Asalto Aéreo"
 UKR_dshv_create_desc: "Se separarán las Fuerzas de Agresión Aérea de las fuerzas terrestres en una unidad separada con su propio mando y estructura, aumentando así su eficacia."
 UKR_command_create: "El Mando de las Fuerzas Unidas"
 UKR_command_create_desc: "El Comando de las Fuerzas Armadas de Ucrania es el órgano de gestión militar de las Fuerzas Armadas de Ucrania, entre grupos de tropas para realizar diversas operaciones militares. También es responsable de llevar a cabo misiones de mantenimiento de la paz fuera de Ucrania."
 UKR_delta: "El Delta"
 UKR_delta_desc: "El sistema ucraniano de apoyo informativo a las decisiones y la toma de conciencia sobre el campo de batalla tiene acceso al programa para personal militar activo que ha aprobado la verificación. El acceso se realiza a través de Internet mediante autorización y autenticación de dos factores en un sitio web especial.\n\nLos usuarios autorizados pueden ver e introducir datos sobre posiciones enemigas conocidas, aviones enemigos manchados, equipos terrestres y más."
 UKR_national_guard: "Revivir la Guardia Nacional"
 UKR_national_guard_desc: "El Guardia Nacional fue disuelto bajo el presidente Kuchma, pero ahora la situación requiere que lo revivamos. Lo reorganizaremos de las tropas internas del Ministerio del Interior."
 UKR_azov: "Crear Batallón Azov"
 UKR_azov_desc: "Vamos a arriesgarnos y dejar que se unan a las filas de nuestras fuerzas armadas."
 UKR_donbass: "Crear Batallón Donbass-Ucrania"
 UKR_donbass_desc: "Otro equipo, creado por voluntarios, viene a nuestro servicio."
 UKR_reform_mvd: "Reforma del Ministerio del Interior"
 UKR_reform_mvd_desc: "Realizaremos una reforma mundial en el Ministerio del Interior."
 UKR_found_the_national_police: "Servicio de Patrulla de Propósito Especial de la Policía"
 UKR_found_the_national_police_desc: "El Servicio de Patrulla de la Policía Especial de Ucrania es un servicio dentro del Departamento de Policía de Patrol de Ucrania en el seno de la Policía Nacional de Ucrania, que fue creado como parte del Ministerio del Interior de Ucrania como una estructura de fuerzas especiales para la protección del orden público.\n\nLa estructura pasó a formar parte de la Policía Nacional de Ucrania. El servicio combina antiguos batallones y regimientos del Ministerio del Interior."
 UKR_found_the_kord: "Unidad Especial CORD"
 UKR_found_the_kord_desc: "El Cuerpo de Acción Operativa y Repentina, o la unidad CORD, es una unidad de propósito especial en la Policía Nacional de Ucrania. Está diseñada para resolver situaciones de emergencia cuyo nivel es tan alto y complejo que puede exceder las capacidades de las fuerzas de respuesta rápida o las unidades de búsqueda operativa."
 UKR_found_the_uop: "Reforma del Complejo Militar-Industrial"
 UKR_found_the_uop_desc: "Nuestra industria de defensa está en un estado lamentable, por lo que nos vemos obligados a comenzar una reforma global en esta área."
 UKR_defend_our_sky: "Revivir la Industria de Aviación"
 UKR_defend_our_sky_desc: "Comenzaremos el resurgimiento de nuestra industria de aviación, que ha estado en un estado terrible desde el colapso de la URSS."
 UKR_srdsc_desc: "El Centro Estatal de Investigación y Diseño de Construcción Naval es una oficina de diseño especializada en construcción naval y ubicada en Mykolaiv, Ucrania. Forma parte de la corporación estatal Industrias de Defensa de Ucrania."
 UKR_oplit: "Centro Estatal de Investigación y Diseño de Construcción Naval"
 UKR_oplit_desc: "El T-84 es un tanque de batalla principal ucraniano, basado en el T-80 MBT soviético introducido en 1976, específicamente la versión del motor diesel: T-80UD. El T-84 fue construido por primera vez en 1994 y entró en servicio en las Fuerzas Armadas de Ucrania en 1999.\n\nSu motor de alto rendimiento opuesta-piston lo convierte en un tanque rápido, comparable a otros MBT modernos con una relación potencia-peso de aproximadamente 26 caballos por tonelada."
 UKR_sapsan: "Hrim-2"
 UKR_sapsan_desc: "El sistema ucraniano de misiles balísticos de corto alcance que está siendo desarrollado por KB Pivdenne y PA Pivdenmash, diseñado para combinar las características de un sistema de misiles tácticos y un lanzacohetes múltiples.\n\nLa versión original de Sapsan del misil, para uso propio de Ucrania, era tener una gama de 500 kilómetros. La versión Hrim-2 posterior, desarrollada para la exportación, tiene un alcance limitado a 280 kilómetros, con el fin de caer dentro del límite de 300 kilómetros establecido por el Régimen de Control Tecnológico de Misiles, que busca limitar la proliferación de misiles y tecnología de misiles."
 UKR_dissolved_parliament: "Parlamento Disuelto"
 UKR_dissolved_parliament_desc: "El Parlamento ha sido disuelto, y la representación ya no está activa dentro de la nación.\n§W------------------§!\nEste espíritu nacional será §RRemovido§! si reincorporamos las elecciones."
 UKR_russia_help_battalions: "Batallones de Apoyo Ruso"
 UKR_oup: "Ukroboronprom"
 UKR_oup_desc: "La industria ucraniana necesita ser revivida y rápida. Pero para hacer esto, estructuramos todas nuestras empresas en una sola preocupación."
 UKR_srdsc: "Centro Estatal de Investigación y Diseño de Construcción Naval"
 civilwar_after: "Ocurrió la Guerra Civil!"
 UKR_aidar_created_tt: "Se creará el batallón §YAidar§!"
 UKR_donbass_created_tt: "Se creará el batallón §YDonbass-Ucrania§!"
 UKR_azov_created_tt: "Se creará §YAzov§!"
 UKR_uda_created_tt: "Se creará el §YEjército de Voluntarios de Ucrania§!"
 UKR_tro_created_tt: "Podrás reclutar §Ybrigadas de defensa territorial§!"
 UKR_natguard_created_tt: "Podrás reclutar §Ybrigadas de la Guardia Nacional§!"
 UKR_win_elections_TT: "Nuestro §HBloque§! §Gganará§! las §HElecciones§!"
 UKR_lose_elections_TT: "Nuestro §HBloque§! §Rperderá§! las §HElecciones§!"
 UKR_presidential_decisions_only_one_is_available_TT: "Solo una de estas decisiones puede tomarse al mismo tiempo."
 UKR_parliament_block_tt: "Esta §HLey§! debe ser §HAprobada§! por la §HVerkhovna Rada§!"
 UKR_free_parliament_TT: "Reinstaurará §CElecciones Libres§! en el §HParlamento§!"
 UKR_verkhovna_rada: "Rada Suprema"
 UKR_verkhovna_rada_desc: "\n\n\n\n\n\n£UKR_desctext_rada\n\n\n\n\n\n\n\n\nLa §HVerkhovna Rada§! [UKR.GetFlag] es nuestro parlamento nacional y dicta qué leyes se aprueban y se derogan, lo que significa que a menudo pueden ir en contra de nuestras propias necesidades. La §HVerkhovna Rada§! puede estar en uno de 3 estados en cualquier momento. §CLibre§!, lo que significa que no tenemos control directo sobre la §HVerkhovna Rada§!, §CInfluenciada§!, lo que significa que tenemos algo de control, y §CTítere§!, lo que significa que tenemos control total.\n\nLa §HVerkhovna Rada§! puede retirar su apoyo a nuestro gobierno si rechazamos §Hciertas propuestas§! que tienen o si cambiamos a una §Hperspectiva que no esté estrechamente alineada con la suya§!. También pueden retirar su apoyo aleatoriamente si así lo desean.\n\nCuanto más apoyo tengamos, mejor, ya que aumenta la probabilidad de que podamos aprobar leyes sin tener que tomar medidas adicionales. La §HVerkhovna Rada§! celebrará elecciones y el resultado estará basado en la influencia de naciones extranjeras o en nuestra propia independencia interna.\n\n§G[?UKR_verkhovna_support]§!/§H450§! escaños de la §HVerkhovna Rada§! actualmente apoyan a nuestro gobierno\n"
 ukraine_nationalist_majority_name: "§HMayoría Pro-Ucrania§!"
 UKR_right_wing_desc_TT: "Una §HMayoría Pro-Ucrania§! en el parlamento significa que el Parlamento busca un mayor distanciamiento tanto de §COccidente§! como de los §Rusos§!. Buscan una §HUcrania§! más independiente y neutral en los asuntos mundiales y, en general, están en contra de tomar partido en cualquier conflicto."
 ukraine_eastern_majority_name: "§GMayoría Pro-Rusa§!"
 UKR_left_wing_desc_TT: "El bloque §GPro-Ruso§! en el Parlamento generalmente busca mayores lazos con el gobierno §Gruso§!, deseando distanciarse de las potencias §COccidentales§!. La radicalización varía dentro de este bloque, ya que algunos desean mantener una §HUcrania§! independiente con lazos §GPro-Rusos§!, y otros desean una mayor integración de las sociedades §Hucraniana§! y §Grusa§!."
 ukraine_western_majority_name: "§BMayoría Pro-Occidental§!"
 UKR_liberal_TT: "El bloque §BPro-Occidental§! dentro del parlamento representa a los partidos e individuos que quieren que §HUcrania§! abandone sus políticas Pro-Rusas y abrace mayores lazos con las potencias §COccidentales§!. Los objetivos de aquellos que se alinean con §COccidente§! varían mucho, desde algunos que solo desean lazos económicos y culturales, hasta otros que desean unirse a la alianza §BNATO§! y proteger a §HUcrania§! de la influencia §Grusa§!."
 ukraine_dissolved_majority_name: "§RVerkhovna Rada Disuelta§!"
 UKR_verkhovna_dissolved_tt: "El parlamento ha sido destituido y la sala está vacía sin representantes presentes."
 ukraine_free_verkhovna: "§CEstado de la Verkhovna Rada: Libre§!"
 UKR_verkhovna_free_tt: "El Parlamento está libre de la influencia del Presidente, y las discusiones y debates progresan orgánicamente sin la intervención de otro órgano gubernamental."
 ukraine_influenced_verkhovna: "§pEstado de la Verkhovna Rada: Influenciada§!"
 UKR_verkhovna_influenced_tt: "El gobierno se ha reformado de tal manera que el Parlamento se ha vuelto fácilmente explotable, y el gobierno del presidente puede influir fácilmente en la discusión cuando el parlamento está en sesión."
 ukraine_puppeted_verkhovna: "§OEstado de la Verkhovna Rada: Títere§!"
 UKR_verkhovna_puppetted_tt: "El Parlamento es solo otra herramienta más para que el Presidente y su gabinete engañen a la gente con una falsa sensación de representación."
 UKR_bureau_open: "Iniciar el Debate sobre el §YGasto en Burocracia§!"
 UKR_bureau_close: "Finalizar el Debate sobre el §YGasto en Burocracia§!"
 UKR_increase_bureu: "Solicitar un Mayor Gasto en Burocracia"
 UKR_increase_bureu_desc: "Si el debate en la Verkhovna Rada es §Gexitoso§!, la ley será §Ycambiada§!"
 UKR_decrease_bureu: "Solicitar un Menor Gasto en Burocracia"
 UKR_decrease_bureu_desc: "Si el debate en la Verkhovna Rada es §Gexitoso§!, la ley será §Ycambiada§!"
 UKR_military_open: "Iniciar el Debate sobre el §OGasto en Defensa§!"
