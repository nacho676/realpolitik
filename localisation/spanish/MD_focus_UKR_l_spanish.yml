 UKR_develop_t84u: "Develop §YT-84U 'Oplot'§!"
 UKR_develop_t84u_desc: "T-84U 'Oplot' es un tanque de batalla principal ucraniano de la tercera generación, desarrollado por el Kharkiv Design Bureau nombrado después de O. O. Morozov sobre la base del tanque T-84.\nEl tanque recibió una nueva torreta de rodillos soldados con un techo todo-estampado, hecho a partir de la fundición de electroslag, por lo que tiene mayor fuerza y sobrevivibilidad.\nTeniendo en cuenta la forma más simple de la torreta, fue posible colocar con éxito una armadura multicapa. También aumentó su volumen interno.\nUna nueva protección dinámica de 3.ª generación hecha por Ucrania 'Nizh' fue colocada en la proyección frontal de la torreta.\nEquipado con protección dinámica y activa de ucraniano, dispositivos punteros extranjeros y pantallas laterales ampliadas."
 UKR_develop_yatahan: "Develop §YT-84-120 'Yatahan'§!"
 UKR_develop_yatahan_desc: "T-84-120 'Yatahan' es una versión del tanque T-84U 'Oplot' que tiene un arma de 120 mm adaptado a los estándares de la OTAN en lugar de la típica pistola de 125 mm, desarrollado por el Kharkiv Design Bureau nombrado después de O. O. Morozov.\nEl tanque tiene un cañón KBM2 de 120 mm, que utiliza munición de la OTAN calibre 120 mm.\nEl carrusel autoloader (originalmente francés, luego ucraniano) se encuentra en la parte trasera de la torreta.\nEs posible instalar el nuevo arma de 140 mm 'Bahira'.\nEnsamblado a partir de componentes de producción ucraniana, aunque es totalmente compatible con componentes de producción extranjera."
 UKR_develop_bahira: "Develop §YT-84-140 'Bahira'§!"
 UKR_develop_bahira_desc: "T-84-140 'Bahira' es una versión propuesta del tanque T-84-120 'Yatahan' que estaría equipado con un arma de 140 mm 'Bahira', desarrollado por el Kharkiv Design Bureau nombrado después de O. O. Morozov.\nEl carrusel autoloader está situado en la parte trasera de la torreta.\nEnsamblado a partir de componentes de producción ucraniana, aunque es totalmente compatible con componentes de producción extranjera."
 UKR_develop_bm_oplot: "Desarrollar el §YT-84 «BM Oplot»§!"
 UKR_develop_bm_oplot_desc: "T-84 'BM Oplot' es la versión más nueva y más sofisticada de T-84U 'Oplot' MBT, desarrollada por el Kharkiv Design Bureau nombrado después de O. O. Morozov.\nSus características distintas, entre otras, están montando armaduras más avanzadas, nuevos sistemas electrónicos de contramedida y otros.\nUna característica visible es la nueva vista panorámica del tanque PNK-6."
 UKR_develop_bastion: "Develop §YT-84 'Bastion'§!"
 UKR_develop_bastion_desc: "T-84 'Bastion' es un programa de modernización reportado, según el cual el tanque se deshará de partes hechas por Rusia.\nLa versión T-84 'BM Oplot', adoptada en 2009, tenía un cierto número de componentes y materiales de origen ruso: componentes individuales del equipo eléctrico, componentes de bloques y sistemas.\nSe ha informado de que hay relativamente pocos de ellos, pero todos deberían ser reemplazados por completo.\nSe planificó que la base de elementos no sólo debe deshacerse de los componentes rusos, sino también ser significativamente modernizada."
