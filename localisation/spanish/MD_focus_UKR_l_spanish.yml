 ukraine_develop_btr4.1.name: "Elija el rol de combate 'BTR-4'"
 ukraine_develop_btr4.1.desc: "Podemos elegir el papel deseado para este equipo - más ligero y barato APC o más caro y fuertemente armado IFV.\nNuestra decsión influirá en lo que los batallones estarán equipados con BTR-4: Mecanizado o Blindaje.\nTendremos una opción para producir básicamente el mismo tipo de equipo pero en función opuesta si queremos."
 ukraine_develop_btr4.1.a: "APC"
 ukraine_develop_btr4.1.b: "IFV"
 ukraine_develop_btr4.2.name: "Elija las armas primarias para 'BTR-4' APC"
 ukraine_develop_btr4.2.desc: "Podemos elegir el armamento principal deseado para BTR-4 APC.\nSi queremos reducir los costos de producción, podemos seleccionar la ametralladora, pero si queremos maximizar su eficacia de combate - podemos elegir entre un puñado de módulos de armas más pesados disponibles."
 ukraine_develop_btr4.2.a: "Ametralladora sólo"
 ukraine_develop_btr4.2.b: "Módulo de armas"
 ukraine_develop_btr4.3.name: "Elija el módulo de armas para 'BTR-4' APC"
 ukraine_develop_btr4.3.desc: "Podemos elegir el módulo de armas deseado para BTR-4 APC.\n\n§YBM-1B 'Hrim'§! armamento: 1x 30 mm cañón automático, lanzagranadas automáticas de 1x 30 mm, ametralladora coaxial de 1x 7,62 mm, 4x 9P135M 'Konkurs' o 'Barier' AT misiles.\n\n§YKBA-105 'Shkval'§! armamento: 1x 30 mm de cañón automático, 1x 7,62 mm de ametralladora coaxial, 4x 9P135M 'Konkurs' o 'Barier' misiles AT (optional 1x 30 mm de lanzagranadas automáticas con reducción a 2x misiles AT).\n\n§YBAU 23x2§! armamento: 2x 23x152 mm cañones automáticos, 1x 7,62 mm ametralladora coaxial."
 ukraine_develop_btr4.3.a: "BM-1B 'Hrim'"
 ukraine_develop_btr4.3.b: "KBA-105 'Shkval'"
 ukraine_develop_btr4.3.c: "BAU 23x2"
 ukraine_develop_btr4.4.name: "Elija el motor para 'BTR-4' APC"
 ukraine_develop_btr4.4.desc: "Podemos elegir el motor deseado para BTR-4 APC.\n\n§Y3TD-3§!: Ucraniano motor diesel de 2 tiempos con 3 cilindros con salida de potencia de 500 hp.\n\n§YDeutz BF6M1015CP§!: alemán 4 válvulas, motor diesel de 6 cilindros con salida de potencia de 442 CV.\n\n§YIveco Cursor 10-430§!: italiano 24 válvulas, motor diesel de 6 cilindros con salida de potencia de 430 CV."
