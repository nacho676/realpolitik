 UKR_security_start: "Seguridad de Ucrania"
 UKR_security_start_desc: "Nuestro país es enorme y por lo tanto necesita una fuerte protección interna, empezaremos a financiar y reformar nuestras estructuras gubernamentales."
 UKR_sbu_start: "Reforma del SBU"
 UKR_sbu_start_desc: "Nuestro servicio de seguridad de Ucrania necesita una reforma profunda y una mayor eficiencia."
 UKR_sbu_t: "La Dirección General 'T'"
 UKR_sbu_t_desc: "El Consejo de Seguridad de Ucrania aplica una política estatal en la esfera de la lucha contra organizaciones e individuos cuyo objetivo es socavar la estadidad nacional, eliminar la independencia de Ucrania, cambiar el orden constitucional por la fuerza, violar la soberanía y la integridad territorial del Estado, socavar su seguridad, apoderarse ilegalmente del poder estatal, propaganda de guerra, violencia, incitación a la hostilidad interétnica, racial, religiosa y de otra índole, injerencias en los derechos humanos y libertades.\n\nAdemás de la prevención, detección y represión de delitos y otros actos ilícitos que representan directamente una amenaza para los intereses vitales del Estado y la seguridad de los ciudadanos de Ucrania y son competencia del Servicio de Seguridad de Ucrania, se aplica la prevención del delito en esta esfera."
 UKR_sbu_corrupt: "La Dirección General 'K'"
 UKR_sbu_corrupt_desc: "El Servicio de Seguridad de Ucrania, según la Ley de Ucrania «Sobre las bases organizativas y jurídicas de la lucha contra la corrupción y el crimen organizado de 30.06.1993 No 3341-XII», se encarga de la lucha contra la corrupción y la delincuencia organizada.\n\nUno de los órganos estatales autorizados para trabajar en esta esfera es la Dirección Principal de Lucha contra la Corrupción y la Delincuencia Organizada del Consejo de Seguridad de Ucrania (GU «K»)."
 UKR_sbu_contr: "La Dirección General de Contrainteligencia Militar"
 UKR_sbu_contr_desc: "Se crean organismos de contrainteligencia militar para apoyar la contrainteligencia de las Fuerzas Armadas de Ucrania, el Servicio Estatal de Guardia Fronteriza de Ucrania y otras formaciones militares estacionadas en el territorio de Ucrania.\n\nEl sistema de órganos militares de contrainteligencia del Consejo de Seguridad de Ucrania está integrado por la Dirección Principal de Contrainteligencia Militar, órganos (unidades) en las regiones como parte del Departamento de Lucha contra la Integridad, unidades operacionales de contrainteligencia militar en los mandos operativos, regionales y territoriales (directorios), cuerpo militar, unidades militares individuales y formaciones."
 UKR_sbu_svr: "Servicio de Inteligencia Exterior"
 UKR_sbu_svr_desc: "El Servicio de Inteligencia Extranjera de Ucrania, o SZRU, es una agencia de inteligencia del gobierno ucraniano. Lleva a cabo sus actividades de inteligencia en esferas políticas, económicas, militares, científicas, técnicas y ecológicas y subordinados directamente al Presidente de Ucrania."
 UKR_sbu_sviaz_desc: "El Servicio Especial de Comunicaciones del Estado de Ucrania, también conocido como Derzhspetszv'yazku, es una autoridad ejecutiva especializada cuyas funciones clave incluyen la provisión de comunicaciones gubernamentales seguras, servicio de mensajería gubernamental, protección de la información y ciberdefensa."
 UKR_sbu_alpha: "Alfa"
 UKR_sbu_alpha_desc: "Grupo «A» del Centro de Operaciones Especiales del Servicio de Seguridad de Ucrania es una unidad especial del Servicio de Seguridad de Ucrania. Oficialmente lleva el nombre «Unidad militar E6117»."
 UKR_sbu_administration: "Administración Civil-Militar"
 UKR_sbu_administration_desc: "La Administración Civil-Militar es una autoridad estatal temporal en Ucrania, creada en los territorios adyacentes a la zona de combate."
 UKR_hur_reform: "Reforma del HUR"
 UKR_hur_reform_desc: "Es hora de comenzar las reformas de nuestro Principal Agencia de Inteligencia para aumentar la eficiencia e influir en las oportunidades en otros países."
 UKR_peacemakers: "Programa de Mantenimiento de la Paz"
 UKR_peacemakers_desc: "Nuestro país siempre ha tratado de participar en misiones de mantenimiento de la paz en todo el planeta, y continuaremos esta tradición."
 UKR_border_guard: "Servicio Estatal de Guardia de Fronteras"
 UKR_border_guard_desc: "El Servicio Estatal de Guardia Fronteriza de Ucrania es el guardia fronterizo de Ucrania. Es un organismo independiente encargado de hacer cumplir la ley, organizado por la Constitución de Ucrania como formación militar, cuyo jefe está subordinado al Presidente de Ucrania."
 UKR_reform_vv: "Reforma de las Tropas Internas"
 UKR_reform_vv_desc: "Nuestras tropas internas han tenido un estatus incierto en la jerarquía de las estructuras estatales desde su aparición, es hora de arreglar esto."
 UKR_finance_vv: "Financiación de Batallones Especiales"
 UKR_finance_vv_desc: "Financiaremos las actividades de los batallones especiales de las tropas internas, tal vez en el futuro serán muy útiles para nosotros."
 UKR_sbu_white_wolves: "Batallón Lobos Blancos"
 UKR_sbu_white_wolves_desc: "El SBU enviará un batallón creado de sus empleados a la guerra."
 UKR_hur_opearational_support: "Apoyo Operativo del HUR"
 UKR_hur_opearational_support_desc: "Actualmente, el HUR apoya las operaciones en curso con inteligencia y utilizando sus unidades en el frente."
 UKR_hur: "Dirección General de Inteligencia"
 UKR_hur_desc: "El HUR tiene una amplia gama de poderes y capacidades que podremos implementar en nuestra política exterior."
 UKR_hur_battalions: "Batallones del HUR de Ucrania"
 UKR_hur_battalions_desc: "Los batallones del HUR de Ucrania están participando en hostilidades por orden del mando ucraniano a nuestro lado, después del fin de las hostilidades, dejarán nuestras fuerzas armadas."
 UKR_border: "Servicio Estatal de Guardia de Fronteras"
 UKR_border_desc: "Nuestras fronteras son demasiado grandes para depender de unidades individuales de las fuerzas armadas para protegerlas. Las tropas fronterizas realizarán esta tarea de manera más eficiente."
 UKR_svr: "Servicio de Inteligencia Exterior"
 UKR_sviaz: "Servicio Especial de Comunicaciones del Estado"
 UKR_sbu_sviaz: "Servicio Especial de Comunicaciones del Estado"
 UKR_hur_decision_category: "La Agencia de Inteligencia Principal"
 UKR_hur_decision_category_desc: "\n\n\n\n\n\n£UKR_desctext_hur \n\n\n\n\n\n\n\n\nLa Dirección General de Inteligencia del Ministerio de Defensa de Ucrania es el servicio de inteligencia militar del gobierno ucraniano. Esta es una dependencia del Ministerio de Defensa, no del Estado Mayor de las Fuerzas Armadas de Ucrania. Con la ayuda de este ministerio, podremos llevar a cabo diversas operaciones de sabotaje en países vecinos, así como realizar incursiones con la ayuda del batallón de sabotaje.\n\n\n\nCantidad actual de puntos operativos del HUR: [?hur_points]"
