 UKR_develop_btr4_choose_role: "Elegir el rol del §YBTR-4§!"
 UKR_develop_btr4_choose_role_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_roles_for_tooltip\n\n\n\n\n\n\n\n\n§YBTR-4§! estaba destinado a ser un paso más alto en comparación con los diseños soviéticos anteriores, y fue diseñado para incorporar armas más pesadas del get-go.\nPodemos elegir el papel deseado para este equipo - más ligero y barato APC o más caro y fuertemente armado IFV.\nNuestra decsión influirá en lo que los batallones estarán equipados con BTR-4: Mecanizado o Blindajeed.\nTendremos una opción para producir básicamente el mismo tipo de equipo pero en función opuesta si queremos."
