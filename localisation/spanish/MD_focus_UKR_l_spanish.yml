 UKR_party_regions_start: "Partido de las Regiones"
 UKR_party_regions_start_desc: "Yanukovych ha tomado el poder en el país en sus propias manos, es hora para las regiones!"
 UKR_party_regions_decrease: "Reducir el Personal Administrativo"
 UKR_party_regions_decrease_desc: "Reduciremos el número de empleados del aparato estatal."
 UKR_party_regions_anti_corrupt: "Comité Nacional Anticorrupción"
 UKR_party_regions_anti_corrupt_desc: "Crearemos un nuevo ministerio, el Comité Nacional contra la Corrupción, para combatir a funcionarios corruptos en nuestro país."
 UKR_party_regions_committee_economic: "Comité de Reformas Económicas"
 UKR_party_regions_committee_economic_desc: "También crearemos otro ministerio, el Comité de Reformas Económicas."
 UKR_party_regions_unifed_window: "Ventanilla Única de Inversiones"
 UKR_party_regions_unifed_window_desc: "Presentaremos nuevas reglas para inversores en nuestro país, lo que les hará más fácil interactuar con nuestras autoridades."
 UKR_party_regions_decrease_agro: "Reducir las Regulaciones sobre la Agricultura"
 UKR_party_regions_decrease_agro_desc: "La agroindustria recibirá nuevos beneficios, con lo que esperamos aumentar su productividad."
 UKR_party_regions_laizes: "Laissez Faire"
 UKR_party_regions_laizes_desc: "Adoptaremos parcialmente uno de los principios libertarios en nuestra política económica y no interferiremos en los procesos económicos."
 UKR_party_regions_taxx: "Cambiar el Código Tributario"
 UKR_party_regions_taxx_desc: "Haremos cambios en el código tributario que consideramos necesarios. Nuestras concesiones reducirán los impuestos locales en tres veces!"
 UKR_party_regions_autocracy: "Fortalecer la Autocracia"
 UKR_party_regions_autocracy_desc: "Un gobierno fuerte debe controlar todo lo que puede, de lo contrario es el caos y el desorden que existían antes de nuestra regla."
 UKR_party_regions_pressure_media: "Presión sobre los Medios"
 UKR_party_regions_pressure_media_desc: "Los medios se han vuelto demasiado libres, es necesario enfriar su ardor."
 UKR_party_regions_stability_reform: "Estabilidad y Reforma"
 UKR_party_regions_stability_reform_desc: "Reuniremos una coalición leal de políticos, que llamaremos «Estabilidad y Reformas», que promoverá activamente nuestros proyectos e ideas."
 UKR_party_regions_stability_restricting_freedom_speech: "Restricción de la Libertad de Expresión"
 UKR_party_regions_stability_restricting_freedom_speech_desc: "La libertad de expresión termina donde comienza a ofendernos."
 UKR_party_regions_stability_purge_opposition: "Intento de Purgar la Oposición Política"
 UKR_party_regions_stability_purge_opposition_desc: "La oposición es demasiado voluntaria y socava las instituciones del poder usando su libertad, es hora de arreglar esto."
 UKR_party_regions_lustration: "Purga del Cuerpo de Gobernadores y Agencias de Seguridad"
 UKR_party_regions_lustration_desc: "Durante mucho tiempo ha sido necesaria la lujuria desleal y abiertamente dañina para el pueblo estatal en estas estructuras."
 UKR_party_regions_agreement_opposition: "Acuerdos con la Oposición"
 UKR_party_regions_agreement_opposition_desc: "Intentaremos establecer relaciones con alguna parte de la oposición, dividiéndola así."
 UKR_party_regions_appease_the_westermists: "Aplacar a los Occidentalistas"
 UKR_party_regions_appease_the_westermists_desc: "Ucrania Occidental ha sido durante mucho tiempo un foco de descontento e inestabilidad, los apaciguaremos, trataré de darles lo que quieren - promesas."
 UKR_party_regions_request_russian: "Solicitar Inversiones Rusas"
 UKR_party_regions_request_russian_desc: "Solicitaremos inversiones rusas, obviamente no serán superfluas."
 UKR_party_regions_personal_gain: "Enfocarse en la Ganancia Personal"
 UKR_party_regions_personal_gain_desc: "El país es ciertamente bueno, pero vale la pena pensar en ti mismo."
 UKR_party_regions_mezhyhirya: "Mezhyhirya"
 UKR_party_regions_mezhyhirya_desc: "Como presidente de verdad, usted necesita tener su propio refugio donde se puede tomar un descanso de las preocupaciones y asuntos políticos."
 UKR_party_regions_titushki: "Reunir a los Titushki"
 UKR_party_regions_titushki_desc: "Utilizaremos un nuevo método para desacreditar las manifestaciones de la oposición: los Titushki."
 UKR_party_regions_regional_council: "Consejo Regional"
 UKR_party_regions_regional_council_desc: "Presentaremos una nueva autoridad, el consejo regional, para facilitar la interacción de las autoridades regionales y estatales."
 UKR_party_regions_optimise_east_ukraine_gamble: "Apuesta del Este de Ucrania"
 UKR_party_regions_optimise_east_ukraine_gamble_desc: "Ucrania del Este siempre ha sido nuestro patrimonio, trataremos activamente de conseguir su apoyo, porque de hecho son nuestro principal electorado."
 UKR_party_regions_optimise_prior_loyals: "Priorizar a los Leales"
 UKR_party_regions_optimise_prior_loyals_desc: "Las personas leales a nosotros son mucho más importantes y los promoveremos activamente."
 UKR_party_regions_western_oligarch: "Acercarse a los Oligarcas Occidentales"
 UKR_party_regions_western_oligarch_desc: "Los oligarcas del oeste de Ucrania serán nuestra prioridad, queremos encontrar un equilibrio entre el oeste y el este, tal vez sus oligarcas nos ayuden."
 UKR_party_regions_meet_akhmetov: "Reunirse con Akhmetov"
 UKR_party_regions_meet_akhmetov_desc: "El clan Donetsk de oligarcas, y su representante Rinat Akhmetov, un importante recurso político que usamos para mantener nuestro poder, vale la pena escucharlo."
 UKR_party_regions_informational_act: "Ley de Información"
 UKR_party_regions_informational_act_desc: "El nuevo acto, o ley, abrirá el acceso a las amplias masas a las actividades de los políticos, lo que reducirá el componente de corrupción en sus actividades."
 UKR_party_regions_optimise_ministries: "Optimizar los Ministerios"
 UKR_party_regions_optimise_ministries_desc: "Las estructuras gubernamentales se han vuelto demasiado enormes, es hora de reducirlas."
 UKR_party_regions_reform_constituion: "Reforma de la Constitución"
 UKR_party_regions_reform_constituion_desc: "Promoveremos activamente la reforma de la constitución, es hora de que nuestro país avance hacia cambios globales!"
 UKR_party_regions_compulsory: "Cambio del Servicio Militar Obligatorio"
 UKR_party_regions_compulsory_desc: "Cambiaremos el sistema de servicio en nuestro ejército, convirtiéndolo literalmente en un contrato."
 UKR_party_regions_pension_reform: "Reforma de Pensiones"
 UKR_party_regions_pension_reform_desc: "La reforma de la pensión se ha estado gestando durante mucho tiempo y ahora lo llevaremos a cabo."
 UKR_party_regions_kozhara: "Kozhara es el Líder del MID"
 UKR_party_regions_kozhara_desc: "Nombraremos a uno de nuestros amigos y socios como Ministro de Relaciones Exteriores."
 UKR_party_regions_youth_region: "Expandir las Regiones Juveniles"
 UKR_party_regions_youth_region_desc: "El ala juvenil de nuestro partido ganará más poder e influencia, abriremos el acceso a ellos."
 UKR_party_regions_berkut_reforms: "Reformas de Berkut"
 UKR_party_regions_berkut_reforms_desc: "Berkut, como estructura policial, necesita reformas para que podamos protegernos."
 UKR_party_regions_berkut_extreme_training: "Entrenamiento Extremo para Berkut"
 UKR_party_regions_berkut_extreme_training_desc: "Berkut será aún más activo en la realización de concursos y procesos de capacitación para mejorar su habilidad."
 UKR_dual_language: "Estado Bilingüe"
 UKR_dual_language_desc: "El idioma ruso ocupa una parte importante de la vida de Ucrania y sería tonto negarlo. No promoveremos ideas políticas estúpidas sobre la abolición del idioma ruso en nuestro país."
 UKR_cancel_decommunization: "Anti-Descomunización"
 UKR_cancel_decommunization_desc: "No permitiremos una lucha con nuestro pasado soviético, cuando luchamos contra el fascismo y el nazismo."
 UKR_donbass_autonomy_pass: "Autonomía Especial de Donbass"
 UKR_donbass_autonomy_pass_desc: "Donbass es una región especial de nuestro país, tal vez sea hora de iniciar una discusión sobre la autonomía especial de esta región."
 UKR_sng_integrate: "Integración de la CEI"
 UKR_sng_integrate_desc: "Continuaremos los procesos de integración en el marco de la cooperación entre los países de la CEI."
 UKR_europe_negotiat: "Negociaciones con la UE"
 UKR_europe_negotiat_desc: "Empezaremos las negociaciones con la Unión Europea sobre una cuestión que ha estado en nuestra agenda política durante mucho tiempo. Esta es una asociación con la Unión Europea."
 UKR_russian_ukrainian_military_coop: "Cooperación Militar Ucraniana-Rusa"
 UKR_russian_ukrainian_military_coop_desc: "Fortaleceremos la cooperación con las Fuerzas Armadas Rusas."
 UKR_party_regions_european_chart: "Carta de Idiomas Europea"
 UKR_party_regions_european_chart_desc: "Firmaremos la Carta Europea de Lenguas Regionales como indicador de nuestra actitud democrática hacia las minorías nacionales."
 UKR_parti_regions_anti_corruption_commitie: "Comité Nacional Anticorrupción"
 UKR_parti_regions_anti_corruption_commitie_desc: "El nuevo comité está diseñado para luchar contra funcionarios corruptos a todos los niveles."
 UKR_parti_regions_economic_committee: "Comité de Reformas Económicas"
