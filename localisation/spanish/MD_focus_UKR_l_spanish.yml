 UKR_polish_army_created_tt: "El §YEjército de Liberación Polaco§! estará disponible para operaciones especiales limitadas"
 ukraine_kolom.1.t: "Kolomoisky Anuncia la Creación de la República"
 ukraine_kolom.1.d: "Igor Kolomoisky, uno de los oligarcas más ricos de Ucrania, anunció la creación de la República Dnipropetrovsk como una autonomía dentro de Ucrania. Esto ha causado un shock a nuestro gobierno y ahora tenemos que decidir qué hacer al respecto."
 ukraine_kolom.1.a: "No Autonomía"
 ukraine_kolom.1.b: "Quizás Nos Beneficie"
 ukraine_kolom.2.t: "Nuestro Ejército"
 ukraine_kolom.2.d: "Esas unidades que financiamos personalmente se han aliado con nosotros, ahora son nuestra principal fuerza de ataque."
 ukraine_kolom.2.a: "Por la Libertad del Dnieper!"
 UKR_recruit_arestovich: "Reclutar a Arestovich"
 UKR_recruit_arestovich_desc: "Arestovich se convertirá en un excelente agente de nuestros servicios especiales, sus habilidades excepcionales serán útiles para nosotros."
 UKR_korchinsky_strategy: "Estrategia de Korchinsky"
 UKR_korchinsky_strategy_desc: "La estrategia de Korchinsky también implica luchar contra los elementos occidentales...La lucha contra el enemigo externo que amenaza realmente la soberanía de Ucrania."
 UKR_psiop_operations: "Operaciones Psicológicas"
 UKR_psiop_operations_desc: "Hemos dominado la técnica de las operaciones psicológicas, y estamos listos para usarla contra nuestros enemigos."
 UKR_bratstvo_psiop_idea: "Operaciones Psicológicas"
 UKR_bratstvo_psiop_idea_desc: "El enemigo también debe romperse mentalmente, para esto vamos a llevar a cabo operaciones psicóticas."
 UKR_vitrenko_party: "El Nuevo Socialismo"
 UKR_vitrenko_party_desc: "Ucrania ha estado durante mucho tiempo bajo el influjo de sentimientos nacionalistas y pro-occidentales que están dividiendo el país en dos, les daremos a nuestros ciudadanos lo que buscan: estabilidad y prosperidad. Nuestro socialismo los hará felices."
 UKR_economic_orthodoxy: "Ortodoxia Económica"
 UKR_economic_orthodoxy_desc: "Nuestro país debe ser fuerte no solo económicamente, sino también espiritualmente, ¿por qué no combinar estas dos cosas?"
 UKR_install_christian_socialism: "Socialismo Cristiano"
 UKR_install_christian_socialism_desc: "No abandonaremos nuestras ideas socialistas, porque seguimos creyendo en Dios, los ideólogos del socialismo lo llevaron a colapsar porque se distanciaron de Dios, no repetiremos sus errores."
 UKR_iron_woman: "Una Mujer de Acero"
 UKR_iron_woman_desc: "Natalia Vitrenko, como el acero, protege las ideas que ella ve como las únicas correctas para Ucrania y no va a doblarse a nadie."
 UKR_resovetization: "Re-sovietización"
 UKR_resovetization_desc: "La era soviética dio a nuestro país un desarrollo que no veía bajo ningún gobierno, no bajo el zar, no bajo los polacos, no bajo la independencia. Aceptamos este hecho y promoveremos el culto al socialismo."
 UKR_rally_out_the_coalition: "Coalición Nacional"
 UKR_rally_out_the_coalition_desc: "Los partidarios de ideas completamente diferentes, los bolcheviques nacionales, los partidarios del Imperio ruso, el socialismo y los rusófilos se han unido bajo las banderas de nuestro partido, todos juntos - convertiremos a nuestro país en el mejor estado de la historia."
 UKR_praymaya_electro_demokratia: "Democracia E-Directa"
 UKR_praymaya_electro_demokratia_desc: "Hemos tenido suficiente de dictadura y totalitarismo, nuestro pueblo merece la democracia en su mejor momento."
 UKR_storm_sturm_at_parliament: "Asalto al Parlamento"
 UKR_storm_sturm_at_parliament_desc: "Nos desharemos de aquellos que sabotean nuestras actividades en nuestras agencias gubernamentales."
 UKR_befriend_russia_vit: "Asociación con Rusia"
 UKR_befriend_russia_vit_desc: "Históricamente, estamos conectados con Rusia y siempre estaremos conectados con ella - nuestra asociación con Rusia es algo que debe ser obvio como el amanecer."
 UKR_apply_to_union_state: "Anunciar el Deseo de Unirse al Estado de la Unión"
 UKR_apply_to_union_state_desc: "El Estado de la Unión es una de las primeras y más importantes etapas de la unidad de nuestro pueblo unido, que pretendemos formar parte de este proyecto."
 UKR_honor_russian_empire: "Respetar el Legado del Imperio Ruso"
 UKR_honor_russian_empire_desc: "El Imperio Ruso era un gran poder y sería estúpido e injusto negar sus logros, recordamos la grandeza de los Romanovs."
 UKR_free_healthcare: "Atención Médica Gratuita"
 UKR_free_healthcare_desc: "Volveremos a la práctica soviética de atención médica gratuita, los ciudadanos deben estar sanos!"
 UKR_national_bolshevist_rhetoric: "Retórica Nacional Bolchevique"
 UKR_national_bolshevist_rhetoric_desc: "Nuestro partido también presta muchas cosas del programa de los bolcheviques nacionales, con las que estamos unánimemente de acuerdo."
 UKR_russo_ukrainian_nationalism: "Nacionalismo Ruso-Ucraniano"
 UKR_russo_ukrainian_nationalism_desc: "Nuestros pueblos siempre deben levantarse y recordar su grandeza, apoyaremos activamente a los movimientos nacionalistas de nuestros países."
 UKR_naz_pioners: "Pioneros Nacionales"
 UKR_naz_pioners_desc: "El pionero fue una gran idea de la dirección soviética, lo reviviremos, pero con nuestros específicos especiales."
 UKR_calm_ruthenia: "Declararse Herederos de Rutenia"
 UKR_calm_ruthenia_desc: "Creemos que el legado de la antigua Ruthenia también no debe ser olvidado! Recordaremos a todos que Ruthenia existió en estas tierras."
 UKR_proclaim_rus_ukraine: "Anunciar el Renacimiento de Rutenia"
 UKR_proclaim_rus_ukraine_desc: "Rutenia renace! Es hoy, aquí, en las tierras de Ucrania"
 UKR_federalize_galicia_and_zakarpat: "Federalización de Galicia"
 UKR_federalize_galicia_and_zakarpat_desc: "Es hora de resolver el problema separatista en Galicia, sólo la federalización nos salvará."
 UKR_lnr_dnr_peace_integrate: "Federalización de Ucrania Oriental"
 UKR_lnr_dnr_peace_integrate_desc: "Los errores cometidos por el gobierno anterior, ahora debemos decidir. Estamos listos para un proyecto de federalización para poner fin a la división de nuestro país."
 UKR_suppress_western_and_bander: "Suprimir la Influencia Occidental"
 UKR_suppress_western_and_bander_desc: "La influencia de Occidente debe debilitarse deliberadamente en nuestro país."
 UKR_restore_russian_church: "Volver a la Iglesia Rusa"
 UKR_restore_russian_church_desc: "Autocefalia fue un error, nos hemos distanciado espiritualmente de nuestros hermanos, y ya no tenemos la intención de repetir ese error."
 UKR_no_to_upc: "Disolver la Iglesia Ortodoxa Ucraniana"
 UKR_no_to_upc_desc: "Los herejes deben ser disueltos."
 UKR_clear_out_pcu: "Limpiar la Iglesia"
 UKR_clear_out_pcu_desc: "Los partidarios de Autocefalia y todos sus simpatizantes deben ser llevados bajo nuestro control."
 UKR_restore_apostolacy: "El Retorno de la Iglesia Ortodoxa Rusa"
 UKR_restore_apostolacy_desc: "La Iglesia Ortodoxa Rusa vuelve a dominar nuestras tierras!"
 UKR_full_socialism: "Énfasis en el Socialismo"
 UKR_full_socialism_desc: "Nos sumergiremos aún más en las doctrinas del socialismo y continuaremos implementándolas en nuestro país."
 UKR_install_true_soviet_folk: "Socialismo del Pueblo"
 UKR_install_true_soviet_folk_desc: "Haremos todo lo posible para que nuestros ciudadanos se sientan felices."
 UKR_appease_pro_russian_oligarchs: "Cooperar con Oligarcas Pro-Rusos"
 UKR_appease_pro_russian_oligarchs_desc: "Estamos listos para establecer cooperación con la oligarquía pro-rusa, porque sus inversiones fortalecerán nuestra economía."
 UKR_loyalist_oligarchy_ens: "Aceptar Oligarcas Leales"
 UKR_loyalist_oligarchy_ens_desc: "Los oligarcas leales también estarán de nuestro lado, asegurando así sus finanzas dentro del país."
 UKR_industrial_revival: "Renacimiento Industrial"
 UKR_industrial_revival_desc: "Nuestro país se quedó sin su poder industrial, después del colapso de la URSS, es hora de revivirlo."
 UKR_national_feminism: "Feminismo Nacional"
 UKR_national_feminism_desc: "Las mujeres también deben convertirse en el motor del crecimiento de nuestro país, y alentaremos su participación en todas las industrias."
 UKR_foreign_policy_det: "Nuestro Curso de Política Exterior"
 UKR_foreign_policy_det_desc: "Nuestro país debe decidir por sí mismo qué camino tomará en política exterior."
 UKR_fully_antagonize_the_west: "Antagonismo con Occidente"
 UKR_fully_antagonize_the_west_desc: "No tenemos intención de ser amigos de Occidente, porque sabemos que Occidente no tiene amigos, solo esclavos y sirvientes."
 UKR_ukr_sov_mil_coop: "Cooperación Militar con Rusia"
 UKR_ukr_sov_mil_coop_desc: "Llevaremos a cabo una serie de ejercicios militares con el ejército ruso."
 UKR_euroscepticism_campaign: "Fuerte Euroescepticismo"
 UKR_euroscepticism_campaign_desc: "Hemos sido y seguiremos siendo euroescépticos."
 UKR_join_csto: "Unirse a la OTSC"
 UKR_join_csto_desc: "Estamos listos para firmar un documento sobre la adhesión a la OTSC, solo Rusia puede darnos garantías de seguridad."
 UKR_reconcile_with_west: "Mejorar la Interacción con Occidente"
 UKR_reconcile_with_west_desc: "Tenemos la intención de mejorar la cooperación con los países occidentales."
 UKR_nato_ukr_train: "Ejercicios con países de la OTAN"
 UKR_nato_ukr_train_desc: "Promoveremos parcialmente la doctrina de la OTAN en nuestras fuerzas armadas y también llevaremos a cabo una serie de ejercicios con ellos."
 UKR_join_nato_with_russia: "Unirse a la OTAN con Rusia"
 UKR_join_nato_with_russia_desc: "Tenemos la intención de unirnos a la OTAN, pero solo junto con Rusia, y propondremos esta idea al gobierno ruso."
 UKR_full_nazbol_transition: "Renacimiento Nacional Bolchevique"
 UKR_full_nazbol_transition_desc: "Ha llegado el momento para la próxima etapa de desarrollo de nuestro país y de toda la familia eslava en general. Nos embarcamos en el camino de la unidad de los eslavos."
 UKR_serbia_unify: "La Revolución Nacional Bolchevique en [SER.GetName]"
 UKR_serbia_unify_desc: "¡Nuestros hermanos finalmente serán liberados del gobierno que los oprimió como nación eslava!"
 UKR_bulgaria_unification: "La Revolución Nacional Bolchevique en [BUL.GetName]"
 UKR_bulgaria_unification_desc: "¡Nuestros hermanos finalmente serán liberados del gobierno que los oprimió como nación eslava!"
 UKR_unification_with_belarus: "La Revolución Nacional Bolchevique en [BLR.GetName]"
 UKR_unification_with_belarus_desc: "¡Nuestros hermanos finalmente serán liberados del gobierno que los oprimió como nación eslava!"
 UKR_poland_unification: "La Revolución Nacional Bolchevique en [POL.GetName]"
 UKR_poland_unification_desc: "¡Nuestros hermanos finalmente serán liberados del gobierno que los oprimió como nación eslava!"
 UKR_demand_bosnia: "La Revolución Nacional Bolchevique en [BOS.GetName]"
 UKR_demand_bosnia_desc: "¡Nuestros hermanos finalmente serán liberados del gobierno que los oprimió como nación eslava!"
 UKR_czech_unification: "La Revolución Nacional Bolchevique en [CZE.GetName]"
 UKR_czech_unification_desc: "¡Nuestros hermanos finalmente serán liberados del gobierno que los oprimió como nación eslava!"
 UKR_demand_croatia_slovenia: "La Revolución Nacional Bolchevique en [CRO.GetName]"
 UKR_demand_croatia_slovenia_desc: "¡Nuestros hermanos finalmente serán liberados del gobierno que los oprimió como nación eslava!"
 UKR_slovakia_unify: "La Revolución Nacional Bolchevique en [SLO.GetName]"
 UKR_slovakia_unify_desc: "¡Nuestros hermanos finalmente serán liberados del gobierno que los oprimió como nación eslava!"
 UKR_propose_full_union_state: "Estado de la Unión Verdadero"
 UKR_propose_full_union_state_desc: "Es hora de que Rusia y nuestro país se conviertan en un verdadero Estado de la Unión!"
 UKR_pan_slavic_ssr: "Unión de Repúblicas Eslavas"
 UKR_pan_slavic_ssr_desc: "Finalmente, todos los eslavos se convertirán en uno!"
 UKR_vetrenko_surrort_nationalism: "Nacionalismo ruso-ucraniano"
 UKR_vetrenko_inner_idea: "Política Interna"
 UKR_vetrenko_inner_idea_desc: "Estamos dispuestos a seguir una política de independencia de Occidente y una fuerte Ucrania, hemos tenido suficiente de la dictadura del capital occidental."
 UKR_vetrenko_christian_socialism: "Socialismo Cristiano"
 UKR_vetrenko_christian_socialism_desc: "Dios y Socialismo van de la mano en Ucrania."
 UKR_vetrenko_west_idea: "Doctrina Antioccidental"
 UKR_vetrenko_west_idea_desc: "No escondemos el hecho de que Occidente es nuestro enemigo ideológico y directo."
 UKR_vetrenko_pioneria: "Pionero Nacional"
 UKR_vetrenko_women_idea: "Feminismo Nacional"
 UKR_vetrenko_women_idea_desc: "Las mujeres de Ucrania construirán una gran mano estatal con los hombres."
 UKR_vetrenko_iron_woman: "Mujer de Hierro Ucraniana"
 UKR_vetrenko_iron_woman_desc: "Vitrenko se convirtió en nuestro equivalente a Margaret Thatcher."
 UKR_vetrenko_health_free_idea: "Atención Médica Gratuita"
 ukraine_nazbol.1.t: "¿Lanzar una invasión de [FROM.GetName]?"
 ukraine_nazbol.1.d: "Fuimos capaces de levantar un levantamiento en este país, pero ahora tenemos que decidir si estamos listos para ponerlo fin y admitir que la revolución es nuestro hacer."
 ukraine_nazbol.1.a: "Sí"
 ukraine_nazbol.1.b: "No"
 ukraine_nazbol.2.t: ""
 ukraine_nazbol.2.d: ""
 ukraine_nazbol.2.a: ""
 ukraine_nazbol.3.t: "La Revolución Nacional Bolchevique!"
 ukraine_nazbol.3.d: "¡Inesperadamente para nosotros, una revolución tuvo lugar en nuestro país bajo la bandera de los bolcheviques nacionales! Con urgencia levantamos al ejército y a todas las fuerzas armadas para luchar contra los separatistas. Sabemos que son controlados por [UKR.GetName] y tienen la intención de lidiar con esto en el futuro."
 ukraine_nazbol.3.a: "De repente"
 ukraine_nazbol.4.t: "[FROM.GetName] Alaba el Legado del Imperio Ruso"
 ukraine_nazbol.4.d: "El gobierno de Ucrania anuncia directamente a nivel estatal la glorificación del pasado y el patrimonio del Imperio Ruso, debemos responder a este gesto de cualquier manera."
 ukraine_nazbol.4.a: "Nosotros también estamos orgullosos"
 ukraine_nazbol.4.b: "Estamos condenando esto"
 ukraine_nazbol.5.t: "[FROM.GetName] se Solidariza con Nosotros"
 ukraine_nazbol.5.d: "[FROM.GetName] se solidariza con nosotros en la cuestión del legado del Imperio Ruso y está dispuesto a apoyarnos a nivel diplomático sobre este tema."
 ukraine_nazbol.5.a: "Eso es genial!"
 ukraine_nazbol.6.t: "[FROM.GetName] Nos Condena"
 ukraine_nazbol.6.d: "[FROM.GetName] condena el hecho de que no condenemos las ambiciones imperiales, nunca un Estado antidemocrático, La Nueva Rusia siempre profesa los ideales de cooperación pacífica y no expansión."
 ukraine_nazbol.6.a: "Cobardes"
 UKR_vitrenko_power: "Vitrenko se Convirtió en Nacional Bolchevique"
 anti_westi: "Odio a Occidente"
 UKR_donbass_rise: "El levantamiento en el sureste ha ocurrido"
 UKR_polish_liberation_battalions: "El Ejército de Liberación Polaco"
 UKR_polish_liberation_battalions_desc: "Muchos residentes polacos están dispuestos a luchar de nuestro lado, contra el gobierno que, en su opinión, ocupó el país."
 UKR_economy_shortcut: "Economía"
 UKR_security_and_expansion_shortcut: "Seguridad y Ampliación"
 UKR_military_shortcut: "Militar"
 UKR_politics_shortcut: "Política"
 UKR_fedrada_category: "Rada federal"
 UKR_fedrada_category_desc: "El Rada Federal es un organismo gubernamental en Ucrania federalizada, creado para la interacción de los sujetos de la Federación con el centro federal.\n\n§YLos subjetos de la Federación ucraniana§! pueden ser §Ganexados§! por [UKR.GetFlag]Ucrania, pero sujeto a §Yinfluencia§! sobre los temas en el §Y importe del 50%§!"
 ukraine_maidan_east.4.b: "Que los diputados sean escoltados"
 UKR_maidan_temporary_attack_idea_desc: "Los disturbios en las calles energizan fuerzas militares, reforzando temporalmente la preparación de combate."
 ukraine_maidan_overthrow.1.t: "Gobierno derrocado"
 ukraine_maidan_overthrow.1.d: "Nuestro gobierno ha sido derrocado. El candidato de los manifestantes ha sido puesto en el poder.\nSu perspectiva es:"
 ukraine_maidan_overthrow.1.a: "£democratic_group_small   $democratic$"
 ukraine_maidan_overthrow.1.b: "£communism_group_small   $communism$"
 ukraine_maidan_overthrow.1.c: "£neutrality_group_small   $neutrality$"
 ukraine_maidan_overthrow.1.e: "£nationalist_group_small   $nationalist$"
 ukraine_maidan_overthrow.2.t: "Gobierno derrocado - Un nuevo presidente"
 ukraine_maidan_overthrow.2.d: "El candidato de los manifestantes ha sido puesto en el poder. Su partido es:"
 ukraine_maidan_overthrow.2.e: "Volver al menú de perspectiva"
 ukraine_maidan_crm_annex.1.t: "La anexión de Crimea"
 ukraine_maidan_crm_annex.1.d: "La península de Crimea ha sido anexada por Rusia. ¿Qué debemos hacer después?"
 ukraine_maidan_crm_annex.1.a: "Nos pararemos por ahora."
 ukraine_maidan_crm_annex.1.b: "Lucharemos por Crimea"
 UKR_idea_government_in_need_desc: "El gobierno de Ucrania está plagado de corrupción e ineficiencia rampantes. Los costos administrativos se duplican con el injerto, mientras que la mala gobernanza reduce la productividad industrial y la capacidad política."
 UKR_modernization: "Modernización ucraniana"
 UKR_modernization_desc: "Una vez que la economía y el estado se han estabilizado, necesitamos modernizar nuestra economía. Antes de que sea demasiado tarde."
 UKR_agriculture: "Modernizar la agricultura"
 UKR_agriculture_desc: "Ucrania es uno de los mayores productores y exportadores agrícolas del mundo y se conoce como el cubo de Europa. Debido a que Ucrania posee el 30% del suelo negro más rico del mundo, su industria agrícola tiene un enorme potencial. Con alguna inversión, estos potenciales podrían ser explotados. "
 UKR_nibulon: "Nibulon"
 UKR_nibulon_desc: "Nibulón es una empresa agrícola ucraniana especializada en la producción y exportación de granos como trigo, cebada y maíz. Está con sede en Mykolaiv. Es la única empresa agrícola en Ucrania con su propia flota y astillero."
 UKR_pr_jsc_mhp: "PrJSC MHP"
 UKR_pr_jsc_mhp_desc: "PrJSC MHP, Myronivsky Hliboproduct, es el mayor productor de aves avícolas de Ucrania y uno de sus mayores extensiones agroindustriales. El apoyo estatal a su expansión aumentará nuestra industria de procesamiento de alimentos y el empleo rural."
 UKR_fozzy: "Grupo confuso"
 UKR_fozzy_desc: "Fozzy Group, LLC es uno de los mayores grupos comerciales e industriales en Ucrania, con sede en Kiev, y uno de los principales minoristas ucranianos con más de 700 puntos por todo el país. Además de minorista, tiene intereses empresariales en la fabricación de alimentos, banca, TI, logística y restaurantes. "
 UKR_fin_it: "Modernizar la economía"
 UKR_fin_it_desc: "Instruir a los ministerios pertinentes para que ayuden a modernizar nuestro sector privado, en particular la financiación y la tecnología de la información. "
 UKR_privatbank: "Privatbank"
 UKR_privatbank_desc: "PrivatBank es el banco ucraniano más grande en términos de activos y el líder del mercado bancario minorista ucraniano. Fue registrada el 19 de marzo de 1992. El estado debe intervenir para futuras ganancias. "
 UKR_it: "Establecer la industria de la TI ucraniana"
 UKR_it_desc: "Mientras el sector de la TI está creciendo en nuestra nación, podría necesitar algunas inversiones para mantenerse así. "
 UKR_it_2: "Ampliar la industria de la TI ucraniana"
 UKR_it_2_desc: "Parece que nuestra industria de la TI puede ser un factor clave en nuestra economía. Con la ayuda de inversiones bien colocadas, por supuesto."
 UKR_ukrtelekom: "Ukrtelecom"
 UKR_ukrtelekom_desc: "El Ukrtelecom de propiedad estatal nos ayudará a ampliar nuestra capacidad de red más rápido."
 UKR_kyivstar: "Kyivstar"
 UKR_kyivstar_desc: "Kyivstar es una de las mayores empresas ucranianas de telecomunicaciones, proporcionando servicios de comunicación y transmisión de datos basados en una amplia gama de tecnologías fijas y móviles, incluidos los servicios 4G (LTE), en Ucrania. "
 UKR_digital_education: "Educación digital"
 UKR_digital_education_desc: "Las habilidades digitales son vitales para los individuos en el siglo XXI. Invertir tanto en la educación digital como en la digitalización de la educación pagará con el tiempo. No debemos olvidar a las generaciones mayores, su educación es una inversión en el presente."
 UKR_dig_sta: "Estado digital ucraniano"
 UKR_dig_sta_desc: "Diia (Ucrania: Дія, lit.'Action'; también un acrónimo para ucraniano: Гержава і, lit.'State and Me') es una aplicación móvil, un portal web y una marca de e-governance en Ucrania. Lanzada en 2020, la aplicación Diia permite a los ciudadanos ucranianos utilizar documentos digitales en sus teléfonos inteligentes en lugar de físicos para fines de identificación e intercambio.\n\nEl portal Diia permite el acceso a más de 50 servicios gubernamentales. Evento Finalmente, el gobierno planea poner todo tipo de interacciones del Estado-persona disponibles a través de Diia."
 UKR_tax_avoidance: "Resolver el problema de evasión fiscal"
 UKR_tax_avoidance_desc: "Ahora tenemos las herramientas para abordar un problema global enorme a nivel local: la evitación de impuestos tanto para empresas como individuos. \n«Mientras que el impuesto puede ser pasado por alto, e incluso no amado, en realidad es nuestra superpotencia social. El impuesto nos permite elegir organizar nuestras comunidades, a nivel local y nacional, para que todos podamos vivir mejores vidas juntos. Pero un obstáculo fundamental es la facilidad con que las élites poderosas se alejan de sus obligaciones sociales - fuera de sus responsabilidades a las sociedades en las que son parte, y de las cuales se benefician.» - Informe sobre Justicia Fiscal 2023"
 UKR_energy: "Ucrania Energy Strategy"
 UKR_energy_desc: "Es hora de analizar el potencial para mejorar los sistemas de suministro eléctrico de la nación y lanzar un programa de modernización de energía residencial."
 UKR_ukrenergo: "Ukrenergo"
 UKR_ukrenergo_desc: "Ukrenergo es un operador de sistemas de transmisión eléctrica en Ucrania y el único operador de las líneas de transmisión de alta tensión del país. La empresa puede hacer que todo el sistema de rejilla sea aún más eficiente."
 UKR_nuc_ener: "Energoatom"
 UKR_nuc_ener_desc: "Energoatom es una empresa estatal que opera las cuatro centrales nucleares en Ucrania (Zaporizhzhia NPP, Rivne NPP, South Ukraine NPP y Khmelnytskyi NPP). Es el mayor productor de energía en Ucrania. "
 UKR_nuc_ener_2: "Ampliación de la capacidad nuclear"
 UKR_nuc_ener_2_desc: "Basado en un contrato con Westinghouse, la compañía estadounidense construirá dos nuevos bloques en el NPP de Khmelnytskyi y dos más en la planta nuclear revitalizada y finalmente construida Chyhyryn en Cherkasy."
 UKR_green_ener: "Estrategia energética verde"
 UKR_green_ener_desc: "Después de promover el uso de energías renovables, necesitamos examinar nuestro potencial en el campo no nuclear."
 UKR_ukrhydroenergo: "Ukrhydroenergo"
 UKR_ukrhydroenergo_desc: "Ukrhydroenergo es una empresa estatal ucraniana que administra muchas centrales hidroeléctricas importantes a lo largo de los ríos Dnieper y Dniester. Es la principal empresa generadora de energía hidroeléctrica de Ucrania."
 UKR_solar: "Construir plantas solares"
 UKR_solar_desc: "Nuestras regiones del sur se encuentran entre las más soleadas de Europa oriental, por lo tanto la más adecuada para la construcción de plantas solares."
 UKR_wind: "Promover granjas eólicas"
 UKR_wind_desc: "Hay lugares en nuestro país que son adecuados para la generación de energía de alta eficiencia con turbinas eólicas."
 UKR_biomass: "Invertir en plantas de biomasa"
 UKR_biomass_desc: "Al ver el éxito de las inversiones privadas Biomass Plants, el estado tiene que proporcionar fondos para construir tales instalaciones."
 UKR_min_env_prot: "Ministerio de Protección Ambiental de Ucrania"
 UKR_min_env_prot_desc: "El Ministerio es la principal autoridad en el sistema de gobierno central de Ucrania responsable de la vigilancia y desarrollo ecológicos del país. Una de las tareas principales es desarrollar el sistema comunitario de eliminación de desechos."
 UKR_waste_manangement_2: "Establecer el sistema de reciclaje"
 UKR_waste_manangement_2_desc: "Ahora la recogida de residuos comunales se resolvió finalmente, era hora de sentar las bases y establecer el sistema de la colección de materiales reciclables. Necesitaba mucho tiempo y esfuerzo, pero los efectos ya son visibles."
 UKR_waste_manangement_3: "Modernización del sistema de gestión de desechos"
 UKR_waste_manangement_3_desc: "El sistema establecido debe ser más eficiente y tener que llegar incluso a los rincones más remotos del país. La gestión moderna de los desechos beneficiará a todos, tanto al público como al medio ambiente."
 UKR_forestry: "Control de la silvicultura ucraniana"
 UKR_forestry_desc: "Casi el 20% del país cubierto por bosques. Para mantenerlo así y evitar la deforestación debemos invertir en la silvicultura como una inversión en el futuro."
 UKR_tourism: "Invertir en Turismo"
 UKR_tourism_desc: "El turismo puede ser una gran oportunidad para cualquier país. En primer lugar, es necesario poner en marcha la infraestructura adecuada. "
 UKR_nat_wonders: "Maravillas Naturales ucranianas"
 UKR_nat_wonders_desc: "En 2008, siete de los muchos lugares pintorescos de Ucrania fueron seleccionados en un voto. Estos sitios serán los portadores de bandera de los diversos paisajes de nuestro país."
 UKR_wonders: "Ukrainian Wonders"
 UKR_wonders_desc: "Siete de los numerosos monumentos históricos y culturales de Ucrania fueron seleccionados en un voto en 2007. Estos sitios serán los portadores de bandera del patrimonio construido de nuestro país."
 UKR_world_heritage: "Sitios del Patrimonio Mundial de Ucrania"
 UKR_world_heritage_desc: "Para 2005, hay tres sitios del Patrimonio Mundial en Ucrania, pero la lista crecerá a tiempo, ya varios sitios en su lista provisional.\n\nEl patrimonio cultural consiste en monumentos (como obras arquitectónicas, esculturas monumentales o inscripciones), grupos de edificios y sitios (incluidos los yacimientos arqueológicos). El patrimonio natural se define como características naturales (consistente de formaciones físicas y biológicas), formaciones geológicas y fisiográficas (incluidos hábitats de especies amenazadas de animales y plantas) y sitios naturales que son importantes desde el punto de vista de la ciencia, la conservación o la belleza natural."
 UKR_health_tourism: "Promover el Turismo de Salud Ucraniano"
 UKR_health_tourism_desc: "Como los servicios de salud del país están a la altura de las normas occidentales, pero generalmente a un precio más barato, puede ser beneficioso invertir en el sector del turismo de salud."
 UKR_corruption_reforms: "Reformas de la lucha contra la corrupción"
 UKR_corruption_reforms_desc: "La corrupción es un problema en la sociedad ucraniana que vuelve a la disolución de la Unión Soviética en 1991. Después de declarar la independencia de la Unión Soviética, Ucrania se enfrentó a una serie de políticos de diferentes lados del espectro político, así como jefes y oligarcas criminales, que utilizaron la corrupción de la policía, partidos políticos e industria para ganar poder.\n\n¡Es hora de cambiar esto!"
 UKR_corruption_edu: "Lucha contra la corrupción en la educación"
 UKR_corruption_edu_desc: "Según la investigación de Transparencia Internacional realizada en 2008, el 47,3% de los estudiantes universitarios declararon que se les había pedido un soborno; de ellos, el 29% había pagado este soborno libremente. Los estudiantes podrían «comprar» una entrada universitaria, los resultados del examen, marcando las tesis doctorales y/o maestras."
 UKR_corruption_health: "Lucha contra la corrupción en los servicios de salud"
 UKR_corruption_health_desc: "Aunque la atención médica en los hospitales estatales es teóricamente gratuita para los ucranianos, los pacientes están pagando dinero allí para asegurar que reciban el tratamiento requerido fue generalizado a principios del siglo XXI.\n\nEn 2012 grupos de defensa acusaron a funcionarios del Ministerio de Salud de incitar dinero que debería haberse utilizado para tratar a los pacientes con SIDA comprando medicamentos contra el SIDA a precios enormemente inflados y luego recibiendo retrocesos."
 UKR_corruption_police: "Lucha contra la corrupción en la policía"
 UKR_corruption_police_desc: "Combatir la corrupción dentro de las agencias policiales de Ucrania para restaurar la confianza pública y la policía eficaz."
 UKR_corruption_armed_forces: "Lucha contra la corrupción en las fuerzas armadas de Ucrania"
 UKR_corruption_armed_forces_desc: "Interrumpir la corrupción de las Fuerzas Armadas para mejorar la disciplina y eficacia militares."
 UKR_corruption_justice: "Lucha contra la corrupción judicial"
 UKR_corruption_justice_desc: "A principios de 2010 políticos y analistas ucranianos describieron el sistema de justicia en Ucrania como «rotten to the core» y se quejaron por la presión política ejercida sobre jueces y corrupción. Los abogados independientes y activistas de derechos humanos denunciaron regularmente a jueces ucranianos presionados para dictar cierto veredicto.\n\nEl sistema judicial de Ucrania era ampliamente considerado como corrupto. Una encuesta del Ministerio de Justicia de Ucrania en 2009 reveló que sólo el 10% de los encuestados confiaba en el sistema judicial de la nación."
 UKR_corruption_spec_public_prosecutor: "Procuraduría Especializada contra la Corrupción"
 UKR_corruption_spec_public_prosecutor_desc: "La Fiscalía Especializada contra la Corrupción es una unidad estructural independiente del Fiscal General de Ucrania, y se encarga principalmente de apoyar y supervisar las investigaciones penales iniciadas por la Oficina Nacional Anticorrupción de Ucrania (NABU)."
 UKR_corruption_court: "Alto Tribunal Anticorrupción de Ucrania"
 UKR_corruption_court_desc: "Establecer un tribunal independiente contra la corrupción para enjuiciar casos de corrupción de alto nivel y recuperar activos estatales robados."
 UKR_corruption_asset_rec: "Recuperación de activos"
 UKR_corruption_asset_rec_desc: "La recuperación de activos, como se indica en la Convención de las Naciones Unidas contra la Corrupción (capítulo V de la Convención), hace referencia al proceso por el cual los ingresos procedentes de la corrupción transferidos al extranjero son recuperados y repatriados al país del que fueron tomados o a sus propietarios legítimos."
 UKR_corruption_gov: "Limpiar el gobierno del país"
 UKR_corruption_gov_desc: "Institute barrendo reformas para eliminar la corrupción dentro de la administración gubernamental y restaurar la integridad institucional."
 UKR_end_kleptokracy: "Finalizar las reformas de la lucha contra la corrupción"
 UKR_end_kleptokracy_desc: "Con todas estas reformas, el tamaño de la corrupción puede reducirse fácilmente y la sociedad podrá vivir sin sus efectos asfixiantes."
 UKR_health_reform: "Inicio Reformas de la Salud"
 UKR_health_reform_desc: "La salud ucraniana debe ser libre para los ciudadanos según la ley, pero en la práctica los pacientes contribuyen al costo de la mayoría de los aspectos de la atención médica."
 UKR_health_smoke_alc: "Disminución del consumo de tabaco y alcohol"
 UKR_health_smoke_alc_desc: "Inicie campañas de salud pública para reducir el consumo de tabaco y alcohol, abordando las principales causas de enfermedades prevenibles."
 UKR_hiv_aids: "HIV/AIDS in Ukraine"
 UKR_hiv_aids_desc: "En 2001 se aprobó un plan nacional de lucha contra el VIH/SIDA; sus objetivos incluían la prevención de una mayor propagación del VIH, el desarrollo de la capacidad para tratar a las personas infectadas y la prestación de apoyo social y asesoramiento a las personas que viven con el VIH/SIDA."
 UKR_vaccination: "Programa de vacunación"
 UKR_vaccination_desc: "Ampliar los programas de vacunación en todo el país para prevenir brotes de enfermedades infecciosas y mejorar la inmunidad demográfica."
 UKR_mental_health: "Programa de Salud Mental"
 UKR_mental_health_desc: "Desarrollar servicios de salud mental y sistemas de apoyo para hacer frente al aumento de los trastornos psicológicos en la población."
 UKR_health_infra: "Mejoramiento de la infraestructura sanitaria"
 UKR_health_infra_desc: "Modernizar y ampliar la infraestructura sanitaria, mejorando las instalaciones médicas de todo el país."
 UKR_health_equipment: "Programa de compra de equipo médico"
 UKR_health_equipment_desc: "Procure el equipo médico moderno y las herramientas de diagnóstico para mejorar la prestación sanitaria y las capacidades de tratamiento."
 UKR_health_prevention: "Programa de detección médica"
 UKR_health_prevention_desc: "Establecer programas integrales de detección médica para detectar las condiciones de salud temprano y mejorar la atención preventiva."
 UKR_health_rehabilitaion: "Programa Nacional de Rehabilitación"
 UKR_health_rehabilitaion_desc: "Desarrollar instalaciones de rehabilitación para los ciudadanos lesionados y discapacitados, incluido el personal militar, para restablecer la calidad de vida."
 UKR_health_recreational_infra: "Mejorar la infraestructura recreativa"
 UKR_health_recreational_infra_desc: "Invertir en instalaciones recreativas y espacios públicos para promover la actividad física y mejorar la salud pública."
 UKR_health_final: "Finalización de las reformas sanitarias"
 UKR_health_final_desc: "Completar la transformación sanitaria para alcanzar los estándares occidentales de atención médica y resultados en salud poblacional."
 UKR_edu_plan: "Plan de Reformas Educativas"
 UKR_edu_plan_desc: "Aunque la educación en nuestra nación es de relativamente alta calidad, hay áreas que mejorar para mantener o elevar esa calidad. Tenemos que prepararnos para la transformación digital en curso en el mundo."
 UKR_edu_infra: "Mejora de la infraestructura educativa"
 UKR_edu_infra_desc: "Mejorar las instalaciones educativas y los edificios escolares para crear entornos de aprendizaje modernos."
 UKR_edu_ped_uni: "Apoyo a Universidades Pedagógicas"
 UKR_edu_ped_uni_desc: "Fortalecer las universidades pedagógicas para mejorar la formación docente y la calidad de la enseñanza en todo el país."
 UKR_edu_universities: "Apoyo a las universidades"
 UKR_edu_universities_desc: "Proporcionar recursos y apoyo adicionales a las instituciones de educación superior para fortalecer la investigación e innovación académicas."
 UKR_edu_infra_2: "Mejorar la infraestructura educativa: siguiente nivel"
 UKR_edu_infra_2_desc: "Seguir mejorando las instalaciones educativas con tecnología moderna e infraestructura de aprendizaje avanzada."
 UKR_edu_final: "Finalizar las reformas educativas"
 UKR_edu_final_desc: "Completar la transformación educativa para lograr estándares de aprendizaje y progreso científico de clase mundial."
 UKR_bmz: "BMZ"
 UKR_bmz_desc: "Berdychiv Machine-Building Plant (también conocido como la Planta de Progreso) es una empresa de construcción de máquinas en la ciudad de Berdychiv, en Zhytomyr Oblast, Ucrania."
 UKR_nkmz: "NKMZ"
 UKR_nkmz_desc: "Novokramatorsky Mashynobudivny Zavod (New Kramatorsk Machinebuilding Plant) es un gran fabricante de equipos pesados en Ucrania. La empresa produce equipo minero; equipos metalúrgicos; molinos rodantes, forjas, hornos de explosión, trituradoras de mineral, prensas y otros equipos de procesos industriales.\n\nLa empresa fabrica ejes de hélice para rompehielos y componentes para submarinos. Según su sitio web, la empresa ha diseñado y construido más de 18 complejos mineros."
 UKR_oil_mining: "Minería de petróleo"
 UKR_oil_mining_desc: "Desarrollar nuevas instalaciones de extracción de petróleo para aumentar la producción nacional de energía y reducir la dependencia de los suministros extranjeros."
 UKR_mining2: "Mejoramiento de la extracción de recursos"
 UKR_mining2_desc: "Ampliar las operaciones mineras para aumentar la extracción de cromo, tungsteno y otros minerales estratégicos."
 UKR_construction_kovalska: "Kovalska"
 UKR_construction_kovalska_desc: "ICG Kovalska, LLC es un desarrollador ucraniano y fabricante de materiales de construcción.\n\nProduciendo: mezclas de hormigón, soluciones de construcción, productos de hormigón armado constructivo clásico, productos murales de cemento expandido, hormigón aerado, placas de pavimentación, mezclas de construcción seca, materiales de dispersión de agua (pinturas, yesos decorativos, espumas, colas)."
 UKR_train_prod: "Producción de trenes"
 UKR_train_prod_desc: "Kriukiv Railway Car Manufacturing Plant es una gran empresa industrial en Kremenchuk, Ucrania, fabricación de locomotoras y múltiples trenes unitarios."
 UKR_kharkiv_tractor: "HTZ"
 UKR_kharkiv_tractor_desc: "Kharkiv Tractor Plant (KhTZ o HTZ) es un fabricante de maquinaria agrícola en la ciudad ucraniana de Kharkiv. Establecido en 1930-31, como pieza central del primer plan quinquenal de Stalin para la industrialización soviética (1927-32), KhTZ fue el mayor fabricante de tractores de Ucrania, produciendo tanto tractores con ruedas como rastreados.\n\nEn 1994, dos años después del colapso de la Unión Soviética y la independencia de Ucrania, la planta se transformó en una sociedad de acciones conjuntas abierta. Produciendo tractores, incluyendo tractores a propósito general con ruedas."
 UKR_agriculture2: "Modernizar la agricultura: siguiente nivel"
 UKR_agriculture2_desc: "Implementar técnicas agrícolas avanzadas y expandir la producción de granos para cementar la posición de Ucrania como proveedor global de alimentos."
 UKR_chumak: "Chumak"
 UKR_chumak_desc: "Chumak (Ucrania: Чумак) es una empresa sueca-ucraniana de procesamiento de alimentos en Kakhovka, Kherson Oblast. Entre sus productos se encuentran ketchup, mayonesa, pasta, aderezos de ensalada, salsas para cocinar, verduras enlatadas, verduras marinadas, jugo de tomate y aceite de girasol."
 UKR_gsc_game_world: "GSC"
 UKR_gsc_game_world_desc: "GSC Game World es una empresa de desarrolladores de videojuegos ucraniano. Fundada en Kiev en 1995 por Sergiy Grygorovych, es más conocido por los cosacos y la serie S.T.A.L.K.E.R. de juegos."
 UKR_national_bank: "Banco Nacional de Ucrania"
 UKR_national_bank_desc: "Según la Constitución de Ucrania, la función principal del Banco Nacional de Ucrania (NBU) es garantizar la estabilidad de la unidad monetaria de Ucrania (la hryvnia). Para ello, el Banco Nacional fomenta la estabilidad del sistema bancario y, dentro de su competencia, la estabilidad en los precios."
 UKR_darnytsia: "Darnytsia"
 UKR_darnytsia_desc: "Darnytsia es una empresa farmacéutica ucraniana."
 UKR_farmak: "Farmak"
 UKR_farmak_desc: "JSC Farmak es una empresa farmacéutica ucraniana. La empresa fue establecida en 1925. El cuartel general está situado en Kiev."
 UKR_carpathian_tourism: "Promueve el turismo en las montañas carpáticas"
 UKR_carpathian_tourism_desc: "Desarrollar infraestructura turística en las Montañas Carpáticas para atraer visitantes internacionales y generar ingresos económicos."
 UKR_black_sea_tourism: "Promover el turismo cerca del Mar Negro"
 UKR_black_sea_tourism_desc: "Ampliar la infraestructura turística a lo largo de la costa del Mar Negro para establecer Ucrania como un destino principal junto al mar."
 UKR_infra_rail: "Mejoras en el ferrocarril"
 UKR_infra_rail_desc: "Modernizar la red ferroviaria nacional para mejorar el transporte de mercancías y la conectividad de pasajeros."
 UKR_infra_rail_2: "Mejoras en el ferrocarril: siguiente nivel"
 UKR_infra_rail_2_desc: "Ampliación ferroviaria completa y renovación para establecer una infraestructura de transporte de clase mundial."
 UKR_infra_southern_bug: "Hacer que el bug del sur sea navegable"
 UKR_infra_southern_bug_desc: "Revive commercial shipping on the Southern Bug upstream of Mykolaiv, para facilitar la creciente exportación de granos de Ucrania"
 UKR_pivdenne_db: "Oficina de diseño de Pivdenne"
 UKR_pivdenne_db_desc: "Pivdenne Design Office ubicado en Dnipro, Ucrania, es un diseñador de satélites y cohetes, y anteriormente de misiles balísticos intercontinentales soviéticos (ICBM)."
 UKR_luch: "Mesa de diseño Luch"
 UKR_luch_desc: "Ampliar las capacidades de Luch Design Bureau en misiles crucero y desarrollo avanzado de tecnología de armas."
 UKR_mayak: "Mayak"
 UKR_mayak_desc: "Modernizar las instalaciones de producción de armas pequeñas de Mayak para abastecer a las fuerzas armadas con armas de infantería contemporáneas."
 UKR_ukrainian_armor: "Ucraniano Blindaje"
 UKR_ukrainian_armor_desc: "Desarrollar una avanzada tecnología de armadura corporal y equipo protector para el personal militar."
 UKR_large_construction1: "Programa de Construcción Grande"
 UKR_large_construction1_desc: "Inicie una ambiciosa iniciativa de construcción para ampliar la infraestructura urbana y la capacidad económica en todo el país."
 UKR_large_construction2: "Construcción grande, segunda fase"
 UKR_large_construction2_desc: "Continuar el boom de la construcción con programas extendidos para mantener el impulso del desarrollo y el empleo."
 UKR_tax_reform: "Reforma tributaria"
 UKR_tax_reform_desc: "Reestructurar el sistema tributario para aumentar la recaudación de ingresos y modernizar la administración fiscal."
 UKR_pension_reform: "Reforma de la pensión"
 UKR_pension_reform_desc: "Implementar una reforma integral del sistema de pensiones para garantizar la sostenibilidad a largo plazo y una seguridad adecuada de jubilación."
 UKR_min_economy: "Ministerio de Economía"
 UKR_min_economy_desc: "Fortalecer el Ministerio de Economía para promover la liberalización del mercado y reducir el control gubernamental de la economía."
 UKR_cut_energy_subs: "Recortar los subsidios energéticos"
 UKR_cut_energy_subs_desc: "Eliminar los subsidios energéticos ineficientes para equilibrar el presupuesto y fomentar la eficiencia energética."
 UKR_state_fund: "Fondo Estatal"
 UKR_state_fund_desc: "Establecer un fondo soberano de riqueza para invertir excedentes presupuestarios en proyectos de desarrollo y activos internacionales."
 UKR_air_improvements: "Mejoras de la Fuerza Aérea"
 UKR_air_improvements_desc: "Modernizar la Fuerza Aérea con una mejor formación, equipo y doctrina operacional."
 UKR_aa_mis_def_force: "Antiaéreo Fuerza de Defensa de Misiles"
 UKR_aa_mis_def_force_desc: "Establecer formaciones especializadas de defensa contra misiles aéreos para proteger el espacio aéreo frente a amenazas aéreas."
 UKR_radio_eng: "Fuerza de ingeniería de radio"
 UKR_radio_eng_desc: "Desarrollar capacidades de ingeniería radiofónica y guerra electrónica para comunicaciones militares avanzadas."
 UKR_support_fac: "Instalaciones de apoyo"
 UKR_support_fac_desc: "Ampliar la infraestructura de apoyo a las bases aéreas para mejorar las operaciones aéreas y la capacidad de mantenimiento de las aeronaves."
 UKR_army_imp: "Mejoras del ejército"
 UKR_army_imp_desc: "Fortalecer el Ejército con una mejor formación, doctrina y desarrollo militar profesional."
 UKR_army_aviation: "Ejército Aviación"
 UKR_army_aviation_desc: "Desarrollar capacidades de aviación militar con aviones giratorios para el transporte, el reconocimiento y un apoyo estrecho."
 UKR_army_logistics: "Logística del Ejército"
 UKR_army_logistics_desc: "Mejorar los sistemas de logística y cadena de suministro del Ejército para apoyar las operaciones y mejorar la eficacia sobre el terreno."
 UKR_army_maintenance: "Instalaciones de mantenimiento del ejército"
 UKR_army_maintenance_desc: "Establecer instalaciones integrales de mantenimiento y reparación del equipo para maximizar la disponibilidad de hardware militar."
 UKR_medical_forces: "Fuerzas médicas"
 UKR_medical_forces_desc: "Establecer comandos médicos militares con un hospital avanzado de campo y capacidades de atención de trauma."
 UKR_antonov: "Antonov"
 UKR_antonov_desc: "Ampliar las capacidades de fabricación de aeronaves de Antonov para producir aviones modernos de transporte y carga."
 UKR_idea_pro_ukraine_reform_1_desc: "Las reformas gubernamentales anticorrupción reducen los desechos y la ineficiencia, restableciendo la confianza pública a pesar de los costos iniciales de transición."
 UKR_idea_shortened_general_staff_desc: "La racionalización de la estructura militar mejora la eficiencia de planificación y acelera el desarrollo de los oficiales."
 UKR_uda_encouraged: "Encouraged UDA"
 UKR_uda_encouraged_desc: "La incorporación de la milicia UDA a las fuerzas armadas mejora la capacidad de combate, pero reduce la disciplina militar."
 UKR_uda_integrated: "UDA integrada"
 UKR_uda_integrated_desc: "El Ejército de Voluntarios de Ucrania se ha integrado plenamente en las fuerzas armadas regulares, fortaleciendo la disciplina y el sentimiento nacionalista."
 UKR_ukrtelekom_idea: "Ukrtelecom"
 UKR_ukrtelekom_idea_desc: "Ukrtelecom, el monopolio estatal de telecomunicaciones, ha sido modernizado para ampliar la infraestructura digital y aumentar la productividad."
 UKR_finance_and_it: "Finanzas & Apoyo al sector TI"
 UKR_finance_and_it_desc: "El desarrollo de los sectores de las finanzas y la tecnología de la información crea una actividad económica de alto valor y mejora las capacidades de investigación."
 UKR_digital_state: "Estado digital ucraniano"
 UKR_digital_state_desc: "Diia (Ucrania: Дія, lit.'Action'; también un acrónimo para ucraniano: Гержава і, lit.'State and Me') es una aplicación móvil, un portal web y una marca de e-governance en Ucrania. Lanzada en 2020, la aplicación Diia permite a los ciudadanos ucranianos utilizar documentos digitales en sus teléfonos inteligentes en lugar de físicos para fines de identificación e intercambio.\n\nEl portal Diia permite el acceso a más de 50 servicios gubernamentales. Evento Finalmente, el gobierno planea poner todo tipo de interacciones del Estado-persona disponibles a través de Diia."
 UKR_tax_avoidance_idea: "Negligencia fiscal"
 UKR_tax_avoidance_idea_desc: "Mientras que el impuesto puede ser pasado por alto, e incluso no amado, en realidad es nuestra superpotencia social. El impuesto nos permite elegir organizar nuestras comunidades, a nivel local y nacional, para que todos podamos vivir mejores vidas juntos.\n\nPero un obstáculo fundamental es la facilidad con que las élites poderosas se alejan de sus obligaciones sociales - fuera de sus responsabilidades a las sociedades en las que son parte, y de las cuales se benefician. - Informe sobre Justicia Fiscal 2023"
 UKR_nuclear_energy: "Energoatom"
 UKR_nuclear_energy_desc: "La inversión en centrales nucleares aumenta la generación de energía interna y la producción de reactores."
 UKR_construction: "Construcción Effort"
 UKR_construction_desc: "Capacidad de construcción asignada a proyectos urgentes financiados por el Estado."
 UKR_demographic_boom: "Demográfica Boom"
 UKR_demographic_boom_desc: "Las tendencias demográficas favorables y las políticas de crecimiento demográfico amplían nuestra mano de obra disponible y nuestra fuerza laboral."
 UKR_demographic_crisis: "Crisis demográfica"
 UKR_demographic_crisis_desc: "La población del país ha estado disminuyendo desde los años noventa debido a una alta tasa de emigración, junto con altas tasas de mortalidad y bajas tasas de natalidad. La población se ha visto reducida por un promedio de más de 300.000 habitantes anuales desde 1993."
 UKR_tackle_corruption: "¡Arruinar la corrupción!"
 UKR_tackle_corruption_desc: "La campaña contra la corrupción y las reformas institucionales mejoran drásticamente la eficiencia del gobierno y la productividad nacional."
 UKR_corruption: "Corrupción arraigada"
 UKR_large_construction: "Programa de Construcción Grande"
 UKR_large_construction_desc: "Un ambicioso programa de desarrollo de infraestructura acelera la terminación del edificio y la productividad, aunque el consumo energético aumenta significativamente."
 UKR_medical_reform: "Reforma médica"
 UKR_medical_reform_desc: ""
 UKR_aamdf: "Antiaéreo Fuerzas de misiles"
 UKR_aamdf_desc: "Una fuerza de defensa antiaéreo organizada refuerza significativamente nuestra capacidad de defensa aérea y reduce la eficacia del apoyo aéreo cercano enemigo."
 UKR_radio_troops: "Tropas de ingeniería de radio"
 UKR_radio_troops_desc: "Las unidades de radio y señalización de la fuerza aérea mejoran el reconocimiento y la interceptación al tiempo que reducen las pérdidas de aeronaves."
 UKR_air_support_fac: "Instalaciones de apoyo a la Fuerza Aérea"
 UKR_air_support_fac_desc: "La inversión en instalaciones de apoyo aéreo mejora la eficiencia del combustible y la fiabilidad de las aeronaves, reduciendo los costos operacionales al mismo tiempo que aumenta el rendimiento."
 UKR_cut_subsidies: "Recortar los subsidios energéticos"
 UKR_cut_subsidies_desc: "Eliminar los subsidios energéticos obliga a los consumidores a asumir verdaderos costos de producción, mejorando la productividad y reduciendo al mismo tiempo las tensiones fiscales."
 UKR_health_cost: "¡Nación más sana!"
 UKR_health_cost_desc: ""
 UKR_military_rehab: "Sistema de Rehabilitación Militar"
 UKR_military_rehab_desc: "Los programas de rehabilitación de Veteranos aumentan la moral y la cohesión organizativa de las tropas, aunque a un mayor gasto sanitario."
 UKR_resource_extraction: "Aumento de la extracción de recursos"
 UKR_resource_extraction_desc: "Las operaciones ampliadas de extracción de recursos aumentan el suministro interno de minerales y combustibles."
 UKR_research_boost: "Ucrania Research Support Program"
 UKR_research_boost_desc: "El programa centralizado de apoyo a la investigación acelera el desarrollo tecnológico en los sectores militar y civil."
 UKR_economy_boost: "Mejoras en la economía"
 UKR_economy_boost_desc: "Un programa de estímulo económico temporal acelera la productividad y la eficiencia de las fábricas, aunque a un mayor costo energético."
 UKR_kolomoisky_help: "Ayuda de Kolomoisky"
 UKR_kolomoisky_help_desc: "El conocido oligarca Kolomoisky nos acercó con una propuesta para financiar la creación de varios batallones para mantener la capacidad de combate de nuestras fuerzas armadas."
 UKR_kolomoisky_finish: "Dnipro-1 Police Regiment"
 UKR_kolomoisky_finish_desc: "Lo último que Kolomoisky ofreció para financiar fue la re-formación del regimiento de Defensa Dnepropetrovsk en un regimiento policial."
 UKR_uda: "Ejército de voluntarios ucranianos"
 UKR_uda_desc: "Es necesario organizar voluntarios en un solo grupo militar."
 UKR_aidar: "Crear Batallón Aidar"
 UKR_aidar_desc: "Vamos a arriesgarnos y dejar que se unan a las filas de nuestras fuerzas armadas."
 UKR_russia_help_battalions_desc: "El despliegue de unidades rusas Rosgvardia y Wagner mejora las operaciones de seguridad y contrainsurgencia durante la ocupación."
 UKR_economy: "Política económica"
 UKR_economy_desc: "\n\n\n\n\n\n£GFX_UKR_desctext_economy\n\n\n\n\n\n\n\n\nEl §5Ministry for Development of Economy and Trade§! es la autoridad principal en el sistema de gobierno central §8Ucrania§! responsables de la formación y realización de políticas estatales de desarrollo económico y social (economía empresarial); regulación de los precios del consumidor; políticas económicas industriales, de inversión y comerciales; desarrollo del emprendimiento; reglamentación técnica y seguridad de los derechos del consumidor; coordinación interinstitucional de cooperación económica y social §8Ucrania§! con el §8Unión Europea§!."
 UKR_boost_economy: "Incremento"
 UKR_boost_research: "Actividades de investigación de apoyo"
 UKR_boost_resource: "Subvencionar la extracción de recursos"
 UKR_add_resource: "Profundidad"
 UKR_renewable_energy: "Evaluación potencial de energía renovable de Ucrania"
 UKR_renewable_energy_desc: "\n\n\n\n\n\n£GFX_UKR_energy_ukraine\n\n\n\n\n\n\n\n\nMapear las regiones con el mejor potencial de producción de energía renovable."
 UKR_energy_wind: "Energía eólica"
 UKR_energy_solar: "Energía solar"
 UKR_energy_geothermal: "Geotérmica de energía"
 UKR_privatize_resource: "Privatización en la industria extractiva de recursos"
 UKR_privatize_resource_desc: "La privatización de las industrias de extracción de recursos reduce el control estatal y la disponibilidad de recursos."
 UKR_restructure_debt: "Pedir una reestructuración de la deuda"
 UKR_ask_western_loans: "Pedir préstamos a los §7países occidentales§!"
 UKR_ask_eastern_loans: "Pedir préstamos a los §tpaíses orientales§!"
 UKR_natpolice_decision_category: "Servicio de patrulla de la Policía de Propósito Especial"
 UKR_natpolice_decision_category_desc: "El Servicio de Patrulla de la Policía Especial de Ucrania es un servicio dentro del Departamento de Policía de Patrol de Ucrania en el seno de la Policía Nacional de Ucrania, que fue creado como parte del Ministerio del Interior de Ucrania como una estructura de fuerzas especiales para la protección del orden público.\n\nLa estructura pasó a formar parte de la Policía Nacional de Ucrania. El servicio combina antiguos batallones y regimientos del Ministerio del Interior."
 UKR_uda_decision_category: "Ejército de voluntarios ucranianos"
 UKR_uda_decision_category_desc: "El ejército de voluntarios ucraniano es una formación paramilitar voluntaria formada sobre la base de unidades del Cuerpo de Voluntarios Ucranianos después de la liberación de Dmitry Yarosh y sus asociados del movimiento del sector derecho."
 UKR_integrate_uda: "Integrar a la §YUDA§! en las §YFuerzas Armadas de Ucrania§!"
 UKR_small_arms: "Ascender a la §OArmas Ligeras §! §WCompañía§!"
 UKR_equipment_funds: "Ascender a la §OEquipo de Infantería KMDB§! §WDivisión§!"
 UKR_heavy_equipment: "Asignar fondos para la §GFábrica§! §WMalyshev§!"
 UKR_heavy_equipment_research: "Soporte §GBlindajeed Vehicle§! §W investigación§!"
 UKR_fund_antonov: "Subsidize §8Antonov§!"
 UKR_air_equipment: "Apoyo §8Aviación §! §W Investigación§!"
 UKR_nikolayev_funds: "Modernizar §8Mikolayiv Astillero§!"
 UKR_naval_equipment: "Apoyo §8Equipos de navegación §! §W Investigación§!"
 UKR_parti_regions_economic_committee_desc: "El comité económico del Partido de las Regiones suaviza los ciclos empresariales y mantiene la estabilidad."
 UKR_parti_regions_invest_open_window_desc: "Las políticas de inversión favorables a las empresas fomentan el crecimiento demográfico y la recaudación de impuestos institucionales."
 UKR_parti_regions_taxx_desc: "La reforma del código tributario reduce tanto los impuestos personales como corporativos, elevando costos burocráticos mientras modera el malestar social."
 UKR_parti_regions_laizes_desc: "Las medidas de secularización reducen la influencia clerical pero desestabilizan las comunidades religiosas y aumentan la volatilidad económica."
 UKR_parti_regions_stability_reform_desc: "Las medidas de estabilidad regional aumentan la defensa ideológica pero elevan la sobrecarga burocrática."
 UKR_parti_regions_lustration_desc: "La eliminación de funcionarios de la era soviética reduce los costos administrativos y del aparato de seguridad."
 UKR_parti_regions_opposition_agree_desc: "La cooperación política con los partidos de oposición reduce el aislamiento del gobierno y suprime la deriva ideológica durante la era Yanukovych."
 UKR_parti_regions_titushki_desc: "Los provocadores callejeros respaldados por el Gobierno suprimen la deriva ideológica mediante intimidación y violencia."
 UKR_parti_regions_optimise_ministers_desc: "La racionalización de la burocracia ministerial reduce los costos administrativos y mejora la eficiencia del gobierno."
 UKR_parti_regions_inform_act_desc: "La legislación de control de medios estabiliza la mensajería política a un costo administrativo."
 UKR_parti_regions_pension_reform_desc: "Reestructurar el sistema de pensiones reduce los costos sociales, pero disminuye el crecimiento demográfico debido a la reducción de las prestaciones."
 UKR_parti_regions_youth_regions_desc: "Los programas de compromiso juvenil construyen apoyo generacional y mejoran marginalmente el poder político y la defensa de la deriva."
 UKR_our_ukraine_secretariat_of_president_desc: "La secretaría presidencial aumenta la capacidad de investigación administrativa, pero aumenta la sobrecarga burocrática."
 UKR_our_ukraine_fight_with_corruption_idea_desc: "La lucha contra la corrupción reduce la sobrecarga burocrática y la extracción económica ilícita."
 UKR_our_ukraine_education_reform_idea_desc: "Las reformas de los planes de estudios mejoran la capacidad de investigación, pero crean costos políticos y de estabilidad temporales."
 UKR_our_ukraine_health_reform_idea_desc: "La modernización del sistema de salud reduce los costos y mejora la aptitud para la conscripción."
 UKR_our_ukraine_social_reform_idea_desc: "La racionalización del gasto social reduce la carga presupuestaria y fortalece el apoyo democrático."
 UKR_our_ukraine_air_industry_idea_desc: "La modernización del sector de la aviación reduce los costos de producción de aeronaves militares."
 UKR_reform_sbu: "Reforma SBU"
 UKR_reform_sbu_desc: "El SBU necesita reformas, durante todos estos años la estructura ha sido muy atenuada en la corrupción y necesita ser actualizada."
 UKR_Yanu_Minister: "Gabinete"
 UKR_Yanu_President: "Presidencia"
 UKR_prepare_protest_tt: "Ganaremos o perderemos apoyo para §8Los Representantes de El Maidán§!"
 UKR_donbass_concessions_tt: "Dependiendo de nuestra postura, seremos capaces de obtener apoyo de las regiones oriental o occidental, pero necesariamente nos decepcionaremos §8Los representantes del Maidan§!."
 UKR_azovsteel_desc: "El control del complejo de fabricación de acero Azovstal proporciona un suministro constante de acero de alta calidad para la producción industrial y militar."
 UKR_yushenko_premier_idea_desc: "Viktor Yushchenko sirve como Primer Ministro bajo Kuchma, ampliando su autoridad política y dirigiendo al gobierno hacia la neutralidad."
 UKR_yanuk_premier_idea_desc: "Viktor Yanukovych sirve como Primer Ministro bajo Kuchma, ampliando su autoridad política y dirigiendo al gobierno hacia la izquierda."
 UKR_unstable_government_idea_desc: "La inestabilidad política ha debilitado el control gubernamental, permitiendo que varias facciones ideológicas exploten los disturbios de sus propios programas."
 UKR_land_reform_idea3_desc: "La reforma agraria iniciada en el siglo pasado debe conducir a una completa redistribución de las tierras en todo el país. Hasta ahora, está en el proceso."
 UKR_zaims_desc: "Los préstamos internacionales a corto plazo han estabilizado la economía y aumentado los ingresos fiscales, aunque crean importantes obligaciones futuras en materia de deuda."
 UKR_social_discontent: "Grave descontento del pueblo"
 UKR_social_discontent_desc: "Los recortes de barrido a la salud, la educación y el gasto social facilitan la tensión en el tesoro al costo de la confianza pública."
 UKR_banks_lobbyst_liquidate_desc: "La eliminación de los intereses bancarios del gobierno redirige los ingresos fiscales corporativos, rompiendo la influencia de las élites financieras en la política."
 UKR_mining_company_help_desc: "Los incentivos fiscales para las empresas mineras proporcionan alivio durante la tensión económica."
 UKR_privatization_idea_desc: "La privatización de las empresas estatales mejora la eficiencia de las fábricas y las relaciones comerciales a costa del poder político."
 UKR_without_kuchma_idea_desc: "El movimiento 'Ucrania Sin Kuchma' ha movilizado el sentimiento nacionalista contra la corrupción oligárquica percibida y la gobernanza autoritaria."
 UKR_left_opposition_idea_desc: "Un movimiento político izquierdista moviliza trabajadores e intelectuales contra el gobierno gobernante, desestabilizando el orden existente."
 UKR_luaz_idea_desc: "El soporte para el fabricante nacional de automóviles LUAZ reduce los costes de producción para vehículos y camiones."
 UKR_anti_socialist_media_desc: "Los medios alineados por el Estado suprimen el sentimiento comunista y neutral, reforzando la posición del gobierno reaccionario sobre la opinión pública."
 ukraine_union.1.t: "Ucrania propone un Estado de la Unión Plena"
 ukraine_union.1.d: "Kiev ofrece disolver su estadidad en la nuestra y fusionar ambas naciones en un solo estado sindical bajo el liderazgo ucraniano. Cada núcleo, cada activo y cada soldado se convertirían en suyo. ¿Rendimos nuestra independencia por este sindicato?"
 ukraine_union.1.a: "Aceptamos la Unión"
 ukraine_union.1.b: "No vamos a rendirnos nuestro estado"
 ukraine_union.2.t: "Rusia rechaza la Unión"
 ukraine_union.2.d: "Moscú se niega a disolverse en nuestro estado sindical. El sueño de una sola nación de los Cárpatos al Pacífico tendrá que esperar."
 ukraine_union.2.a: "Una oportunidad perdida"
 ukraine_union.3.t: "Ucrania propone unirse a la OTAN juntos"
 ukraine_union.3.d: "Kyiv nos invita a dejar nuestras alianzas actuales y unirse a la OTAN junto con ellos, remodelando el orden de seguridad de Europa del Este. ¿Tomamos este camino juntos?"
 ukraine_union.3.a: "Nos unimos a la OTAN"
 ukraine_union.3.b: "Nuestro lugar no está en la OTAN"
 ukraine_union.4.t: "Rusia rechaza la adhesión a la OTAN"
 ukraine_union.4.d: "Moscú se niega a unirse a la OTAN junto con nosotros. Tendremos que trazar nuestro curso occidental solo."
 ukraine_union.4.a: "So Be It"
 ukraine_kommi.16.t: "Levantamiento comunista en el este"
 ukraine_kommi.16.d: "Un levantamiento comunista respaldado por Kiev ha tomado varias de nuestras provincias orientales y declarado independencia con apoyo ucraniano. No olvidaremos esto."
 ukraine_kommi.16.a: "Recordaremos esto"
 UKR_brotherhood_people_desc: "Un movimiento social comunista que hace hincapié en el bienestar colectivo y la solidaridad reduce la carga de los bienes de consumo al tiempo que fortalece la defensa ideológica."
 UKR_social_reform_desc: "La expansión del bienestar social reduce los costos sanitarios y sociales al mismo tiempo que mejora el nivel de vida bajo la gobernanza comunista."
 UKR_equal_rights_idea_desc: "La aplicación de políticas de igualdad de derechos en todas las esferas demográficas reduce la carga burocrática y fortalece la unidad política."
 UKR_west_investors_idea_desc: "La participación del mercado occidental ha proporcionado capital y experiencia económica, apoyando el desarrollo empresarial y la confianza pública en la economía."
 UKR_our_investors_idea_desc: "El capital inversionista occidental estimula la capacidad de investigación, estabiliza los ciclos económicos y fortalece la independencia política exterior."
 UKR_socialist_effort_desc: "La movilización económica para la producción socialista aumenta la estabilidad, el crecimiento demográfico y la disponibilidad de bienes de consumo."
 UKR_alpha: "Alpha"
 UKR_alpha_desc: "La unidad de operaciones especiales Alpha del SBU mejora nuestras operaciones de contrainteligencia y seguridad contra amenazas subversivas."
 UKR_svr_desc: "Las operaciones del Servicio de Inteligencia Extranjera mejoran el desarrollo de redes de inteligencia y las defensas de agencias contra la subversión extranjera."
 UKR_sviaz_desc: "State Special Communications Service proporciona una mejor infraestructura de encriptación, descifrado y comunicaciones seguras."
 UKR_ukraine_always_right: "Ucrania siempre tiene razón"
 UKR_ukraine_always_right_desc: "Los verdaderos patriotas han llegado al poder en Ucrania. Ucrania siempre tiene razón, Ucrania está por encima de todo."
 UKR_take_control_of_the_media: "Tome el control de los medios"
 UKR_take_control_of_the_media_desc: "Los recursos de los medios de comunicación han tenido demasiada libertad en los últimos años. Sólo están ocupados promoviendo lo malo y terrible que es nuestro país, lo arreglaremos."
 UKR_prohibition_of_non_nationalist_organizations: "Prohibición de las organizaciones no nacionales"
 UKR_prohibition_of_non_nationalist_organizations_desc: "Cualquier organización que rechace la causa nacionalista es una amenaza para el nuevo orden. Prohibirlos a todos y dejar nuestro movimiento como la única fuerza política legal en el país."
 UKR_anti_russian_policy: "Política antirrusa"
 UKR_anti_russian_policy_desc: "Moscú sigue siendo el mayor enemigo de la nación ucraniana. La hostilidad enshrine a Rusia como política oficial del estado y purga la influencia rusa de nuestras instituciones."
 UKR_loyal_teachers_in_schools: "Profesores de Préstamo en las escuelas"
 UKR_loyal_teachers_in_schools_desc: "La escuela es la base de los futuros ciudadanos patrióticos de Ucrania. Sólo dejaremos ucranianos reales en las escuelas."
 UKR_ban_all_languages_except_ukrainian: "Todos los idiomas excepto Ucraniano"
 UKR_ban_all_languages_except_ukrainian_desc: "Comenzaremos un programa de Ukrainización, todos los demás idiomas serán eliminados del currículo escolar, comunicación empresarial y otros casos de la vida de un ciudadano ucraniano."
 UKR_introduce_death_penalty_for_disloyal_persons: "Introducir pena de muerte para personas disloyales"
 UKR_introduce_death_penalty_for_disloyal_persons_desc: "La lealtad es lo que todos los ciudadanos deben a su patria. Todos los que la odian, todos los que la ofenden, nos desharemos por cualquier medio necesario."
 UKR_united_council_of_ukrainian_nationalists: "Consejo Unido de nacionalistas ucranianos"
 UKR_united_council_of_ukrainian_nationalists_desc: "Por último, el verdadero patriotismo y nacionalismo, encabezados por verdaderos partidarios de Ucrania, gobierna el país. Nuestro congreso es construir un gran país."
 UKR_right_sector: "Sector derecho"
 UKR_right_sector_desc: "El sector adecuado será responsable del componente político interno del nuevo estado ucraniano."
 UKR_full_order_in_the_country: "Orden completa en el país"
 UKR_full_order_in_the_country_desc: "El orden es la clave para la estabilidad. Lucharemos contra las manifestaciones del caos, el desorden y la rebelión."
 UKR_ukrainian_assault_battalions: "Batallones de asalto ucranianos"
 UKR_ukrainian_assault_battalions_desc: "Crearemos batallones de choque de ciudadanos particularmente patrióticos que realizarán tareas específicas."
 UKR_make_government_jobs_only_for_ukrainians: "Hacer empleos gubernamentales sólo para los ucranianos"
 UKR_make_government_jobs_only_for_ukrainians_desc: "Sólo los ucranianos deben trabajar en beneficio de la patria, todo el mundo no debe tener derecho a trabajar."
 UKR_complete_the_cleansing_of_the_ukrainian_state: "Complete la limpieza del Estado ucraniano"
 UKR_complete_the_cleansing_of_the_ukrainian_state_desc: "Nuestra patria ha sido limpiada de enemigos, detractores y otros elementos negativos."
 UKR_limit_the_powers_of_the_mvd: "Limitar las potencias del MVD"
 UKR_limit_the_powers_of_the_mvd_desc: "La policía y otras autoridades tienen demasiado poder en el estado, los limitaremos."
 UKR_night_of_the_long_knives: "Noche de los cuchillos largos"
 UKR_night_of_the_long_knives_desc: "Eliminaremos a aquellos que son particularmente resistentes a las reformas más radicalmente."
 UKR_una_unso: "UNA UNSO"
 UKR_una_unso_desc: "Las actividades de política exterior recaerán sobre los hombros de la organización UNA-UNSO."
 UKR_external_intervention: "Intervención externa"
 UKR_external_intervention_desc: "Es hora de dejar de perseguir una política pacífica, influiremos activamente en los procesos globales."
 UKR_resolve_the_moldovan_issue: "Resolver la cuestión de Moldova"
 UKR_resolve_the_moldovan_issue_desc: "Moldavia y Transnistria han estado en nuestro camino durante mucho tiempo, su independencia es sólo un error, lo arreglaremos."
 UKR_dig_up_potatoes: "Dig up Potatoes"
 UKR_dig_up_potatoes_desc: "Bielorrusia puede ser utilizado por nuestros enemigos tanto del oeste como del este para atacarnos. ¡La mejor manera de protegerse es atacar primero!"
 UKR_to_recall_the_volhynia_massacre: "Experiencia de Volyn"
 UKR_to_recall_the_volhynia_massacre_desc: "Hemos enfrentado a los polacos de nuevo y debemos luchar una vez más contra ellos. Es hora de que nuestro país finalmente ponga fin a la amenaza polaca."
 UKR_secretly_sending_militants_to_kuban: "Levantar una rebelión en la Crimea"
 UKR_secretly_sending_militants_to_kuban_desc: "El hecho de que Crimea fue arrebatada por Rusia es la principal injusticia histórica del siglo. La debilidad de nuestras autoridades ha resultado ser espantosa y vergonzosa. Lo arreglaremos."
 UKR_agitation_of_radical_ukrainians_in_kuban: "Levante una rebelión en el Kuban"
 UKR_agitation_of_radical_ukrainians_in_kuban_desc: "Kuban es nuestra tierra y siempre lo será. Intentaremos quitarlo de Rusia."
 UKR_liberate_green_klin: "«Liberate» verde Klin"
 UKR_liberate_green_klin_desc: "Es hora de «Liberar» a nuestros hermanos del Lejano Oriente de la opresión del oso ruso."
 UKR_shoot_a_russian_bear: "Dispara a un oso ruso"
 UKR_shoot_a_russian_bear_desc: "¡El oso ruso se convertirá en nuestra alfombra!"
 UKR_declare_a_great_ukraine: "Declarar un Gran Ucraniano"
 UKR_declare_a_great_ukraine_desc: "Ucrania se ha hecho grande y que todo el mundo lo sepa."
 UKR_upa: "UPA"
 UKR_upa_desc: "Las actividades de la defensa civil e interna del país caerán en el revivido ejército insurgente ucraniano."
 UKR_new_orders_of_formation_of_upa_groups: "Nuevos Ordenes de Formación de Grupos UPA"
 UKR_new_orders_of_formation_of_upa_groups_desc: "Tendremos en cuenta la experiencia de la UPA durante la Segunda Guerra Mundial, y crearemos nuevas brigadas teniendo en cuenta los errores."
 UKR_partisan_units: "Unidades partidistas"
 UKR_partisan_units_desc: "Se establecerán células guerrilleras de la UPA en todo el país para resistir activamente a los enemigos en el futuro."
 UKR_partisanship_as_an_ideology: "Partisanship como una ideología"
 UKR_partisanship_as_an_ideology_desc: "Nuestros partisanos deben ser educados ideológicamente para resistir activamente al enemigo."
 UKR_make_military_exercises_in_the_country_compulsory_for_all: "Hacer Ejercicios Militares en el Compulsorio País para Todos"
 UKR_make_military_exercises_in_the_country_compulsory_for_all_desc: "Cada ucraniano debe ser capaz de defender su país. La formación con especialistas de la UPA de ciudadanos comunes fortalecerá el poder de combate de nuestro país."
 UKR_to_arm_every_person_in_the_country: "Armar a cada persona en el país"
 UKR_to_arm_every_person_in_the_country_desc: "Mujeres, niños, hombres, personas mayores - todo el mundo debe ser capaz de llevar un arma y dispararle al enemigo con él."
 UKR_form_an_alliance_of_right_wing_youth: "Formar una alianza de jóvenes derechistas"
 UKR_form_an_alliance_of_right_wing_youth_desc: "Los jóvenes de Ucrania deben organizarse antes de que puedan ser armados. Une los movimientos dispersos de la derecha en una sola alianza leal a la causa nacionalista."
 UKR_ukraine_is_a_land_of_partisans: "Ucrania es una tierra de partisanos"
 UKR_ukraine_is_a_land_of_partisans_desc: "Habrá partisanos en cada aldea, en cada ciudad, si el enemigo nos invade. Lo encontraremos con el poder del pueblo ucraniano."
 UKR_nationalists_right_sector_desc: "La integración de la milicia del sector derecho en las estructuras estatales fortalece el sentimiento nacionalista y la autoridad política."
 UKR_nationalists_una_unso_desc: "El movimiento nacionalista UNA-UNSO facilita la movilización voluntaria y mejora la capacidad militar irregular."
 UKR_nationalists_upa_desc: "Basándose en tácticas históricas de resistencia UPA aumenta la eficiencia del suministro y la defensa de los territorios centrales."
 UKR_nationalists_cleane_ukraine_desc: "Un amplio impulso de consolidación nacionalista fortalece la resistencia a la influencia extranjera y endurece la voluntad de seguir luchando."
 UKR_nationalists_trizub_desc: "La organización Tryzub moviliza el sentimiento nacionalista y el compromiso con la defensa nacional."
 UKR_nabu: "Oficina Nacional Anticorrupción de Ucrania"
 UKR_nabu_desc: "Nueva oficina anticorrupción está diseñada para fortalecer la lucha contra funcionarios corruptos en todos los niveles a veces."
 UKR_poroh_deccomuniz: "Presidencia de Poroshenko"
 UKR_poroh_deccomuniz_desc: "Poroshenko es una persona ambigua, pero su deseo de hacer que Ucrania sea fuerte ante el enemigo merece el respeto del pueblo."
 UKR_west_investors_desc: "Los inversores extranjeros occidentales se han visto atraídos al mercado, fortaleciendo las instituciones democráticas y impulsando el crecimiento económico y la estabilidad."
 UKR_operation_wall_desc: "La construcción de fortificación defensiva se acelera dramáticamente durante este período de movilización."
 UKR_ato_supports_desc: "El apoyo a los veteranos de la Operación Antiterrorista fortalece el sentimiento nacionalista y refuerza nuestro compromiso con quienes sirvieron."
 UKR_health_supports_desc: "La financiación ampliada de la atención de la salud mejora el bienestar público y fortalece el apoyo a la gobernanza democrática."
 UKR_pivdenmash_idea_desc: "La empresa estatal Pivdenmash se especializa en la producción de misiles balísticos y nucleares con mayor eficiencia."
 UKR_kyvarmor_idea_desc: "La planta Kyiv Blindajeed se especializa en producir chasis de tanque medio avanzado y variantes anfibias."
 UKR_tsnap_idea_desc: "La agencia administrativa estatal del TSNAP simplifica la burocracia gubernamental central y reduce la sobrecarga administrativa."
 UKR_concern_desc: "La consolidación de la fabricación militar dispersa en el Complejo de Industria Militar de Kharkiv mejora la eficiencia de producción de tanques y vehículos."
 UKR_zaz_idea_desc: "Se ha revitalizado la producción automotriz de ZAZ, mejorando la fiabilidad del vehículo y reduciendo los costos de fabricación para el transporte civil y militar."
 UKR_kraz_idea_desc: "La producción de vehículos KrAZ proporciona fabricación nacional de camiones y vehículos blindados, reduciendo la dependencia de importación."
 UKR_motorsich_idea_desc: "El apoyo estatal a la producción de motores Motor Sich reduce los costos para la fabricación de aviones pesados y helicópteros."
 UKR_interlegion_decision_category: "Legión Internacional de Defensa Territorial"
 UKR_interlegion_decision_category_desc: "La Legión Internacional de Defensa Territorial de Ucrania es un proyecto del Gobierno de Ucrania para atraer a extranjeros para crear unidades voluntarias como parte de la defensa territorial de las Fuerzas Armadas de Ucrania."
 UKR_vetrenko_surrort_nationalism_desc: "Un movimiento nacionalista ha movilizado a la población, haciendo hincapié en la identidad ucraniana y la soberanía cultural contra las amenazas externas percibidas."
 UKR_vetrenko_pioneria_desc: "Se ha establecido una organización juvenil nacionalista para fomentar la educación patriótica y aumentar la conciencia política entre las generaciones más jóvenes."
 UKR_vetrenko_health_free_idea_desc: "La salud gratuita se ha implementado en todo el país, mejorando el crecimiento de la población pero tensando las finanzas públicas con mayores gastos médicos."
 UKR_economic_reforms_modifier: "Desarrollo Económico de Ucrania"
 UKR_economic_reforms_modifier_desc: "Décadas de estancamiento oligárquico dejaron a la economía de Ucrania un parcheo de reliquias soviéticas y mercados de sombras. Un programa sostenido de reforma está poco a poco sintonizando la burocracia, cortejando la inversión extranjera y modernizando nuestra industria envejecida. Cada paso adelante se mide en fábricas reabiertas y contratos honrados."
 UKR_military_reforms_modifier: "Desarrollo militar de Ucrania"
 UKR_military_reforms_modifier_desc: "Las fuerzas armadas ucranianas entraron en el siglo insuficientemente financiadas, desmoralizadas y armadas con reservas soviéticas oxidantes. La reforma significa más que nuevos rifles, significa oficiales profesionales, formación realista y doctrina escrita para las guerras a las que nos enfrentamos. Lo que emerge será un ejército más valiente y más duro leal al Estado en lugar de a cualquier patrono."
 UKR_kuchma_shortcut: "Kuchma"
 UKR_kuchma_second_terms: "Segundo mandato de Kuchma"
 UKR_kuchma_second_terms_desc: "El Presidente Kuchma ha estado gobernando nuestro país para el segundo mandato; quizás esta vez no será reelegido ni conducirá a nuestro país al caos. Ya veremos."
 UKR_dissolve_rada: "Disuelve Rada"
 UKR_restore_rada: "Restaurar Rada"
 ukr_industry_points_cost_35_blocked: "35 puntos de industria requeridos"
 ukr_industry_points_cost_50_blocked: "50 puntos de industria requeridos"
 ukr_industry_points_cost_75_blocked: "75 puntos de industria requeridos"
 UKR_wind_energy: "Programa de energía eólica completado"
 UKR_solar_energy: "Programa de energía solar completado"
 UKR_finance_vv_tt: "Requiere a los Tropas Internos todavía en su fuerza reformada, no disuelto o doblado en otro servicio"
 UKR_unite_with_russian_genshtab_tt: "Requiere que las Reformas Militares no estén en su segunda etapa"
 UKR_nato_aid_donor_one: "[FROM.GetName] ha apoyado nuestro esfuerzo de guerra."
 UKR_nato_aid_donor_many: "§Y[?UKR.UKR_aid_report_donors^num]§! gobiernos aliados, encabezados por [FROM.GetName], han apoyado nuestro esfuerzo de guerra."
 UKR_aid_report_money_tt: "[THIS.GetFlag][THIS.GetAdjective] §YTreasury§!: $$[?UKR_aid_report_money|+] Billón"
 ukraine_revolution.30.t: "El Consejo Supremo de Crimea"
 ukraine_revolution.30.d: "El Consejo Supremo de Crimea está probando los límites de la autoridad de Kiev. ¿Debemos permitir un referéndum sobre el estatuto de la península o disolver el consejo?"
 ukraine_revolution.30.a: "Permitir un referéndum"
 ukraine_revolution.30.b: "Disolver el consejo"
 ukraine_revolution.31.t: "Moscow Weighs In"
 ukraine_revolution.31.d: "Kyiv ha abierto una pregunta sobre el estatuto en Crimea. Moscú puede aceptar un acuerdo de autonomía ucraniana o subescribir un referéndum propio."
 ukraine_revolution.31.a: "Aceptar la autonomía ucraniana"
 ukraine_revolution.31.b: "En el marco del referéndum"
 ukraine_revolution.32.t: "El referendo de Crimea"
 ukraine_revolution.32.d: "El referéndum ha puesto el futuro de Crimea en manos de Moscú. Debemos decidir si reconocer un protectorado ruso o absorber la península directamente."
 ukraine_revolution.32.a: "Crear un protectorado ruso"
 ukraine_revolution.32.b: "Anexo Crimea directamente"
 ukraine_revolution.33.t: "Moscow Responds"
 ukraine_revolution.33.d: "Kyiv disolvió el consejo de Crimea. Moscú debe decidir si responder con presión o ponerse de pie."
 ukraine_revolution.33.a: "Aplicar la presión diplomática"
 ukraine_revolution.33.b: "¡Arriba!"
 ukraine_revolution.40.t: "El futuro político de Donetsk"
 ukraine_revolution.40.d: "La región de Donetsk exige una opinión directa sobre su gobierno. Kiev debe elegir entre un acuerdo negociado, una represión o una nueva república autónoma."
 ukraine_revolution.40.a: "Negociar la autonomía local"
 ukraine_revolution.40.b: "Disolver el Consejo"
 ukraine_revolution.40.c: "Permitir una República de Donetsk"
 ukraine_revolution.40.e: "Que Donbas se levante en armas"
 ukraine_revolution.41.t: "El futuro político de Luhansk"
 ukraine_revolution.41.d: "Los consejos de Luhansk están siguiendo el ejemplo de Donetsk. Sus demandas pueden ser contenidas a través de compromiso, fuerza o reconocimiento de una república."
 ukraine_revolution.41.a: "Negociar la autonomía local"
 ukraine_revolution.41.b: "Suprimir el Movimiento"
 ukraine_revolution.41.c: "Permitir una República de Luhansk"
 ukraine_revolution.42.t: "El futuro político de Crimea"
 ukraine_revolution.42.d: "El estado de Crimea está siendo nuevamente impugnado mientras el país ya está bajo tensión. Kiev puede reconocer la autonomía local, disolver el consejo o aplazar el proceso de Crimea vigilada."
 ukraine_revolution.42.a: "Negociar la autonomía local"
 ukraine_revolution.42.b: "Disolver el Consejo"
 ukraine_revolution.42.c: "Utilizar el proceso de Crimea"
 ukraine_revolution.43.t: "Consejo de Kharkiv"
 ukraine_revolution.43.d: "Los políticos regionales de Kharkiv están probando los límites de la autoridad de Kiev. El gobierno debe decidir si negociar, suprimir el consejo o tolerar una administración local."
 ukraine_revolution.43.a: "Negociar la autonomía local"
 ukraine_revolution.43.b: "Suprimir el Consejo"
 ukraine_revolution.43.c: "Tolerar una administración local"
 ukraine_revolution.44.t: "Consejo de Zaporizhzhia"
 ukraine_revolution.44.d: "Zaporizhzhia exige garantías para sus instituciones locales. Un compromiso puede calmar la región, mientras que la represión puede propagar la crisis."
 ukraine_revolution.44.a: "Negociar la autonomía local"
 ukraine_revolution.44.b: "Suprimir el Consejo"
 ukraine_revolution.44.c: "Tolerar una administración local"
 ukraine_revolution.45.t: "Los Consejos del Sur"
 ukraine_revolution.45.d: "Kherson y Mykolaiv están organizando alrededor de las demandas de control local. Sus consejos pueden ser llevados a un acuerdo o empujados hacia una oposición abierta."
 ukraine_revolution.45.a: "Negociar la autonomía local"
 ukraine_revolution.45.b: "Suprimir los Consejos"
 ukraine_revolution.45.c: "Tolerar las administraciones locales"
 ukraine_revolution.46.t: "El futuro político de Odesa"
 ukraine_revolution.46.d: "El consejo de Odesa está pesando autonomía contra una ruptura directa con Kiev. La actual república de Odesa está disponible si el gobierno pierde el control."
 ukraine_revolution.46.a: "Negociar la autonomía local"
 ukraine_revolution.46.b: "Suprimir el Consejo"
 ukraine_revolution.46.c: "Permitir una República Odesa"
 ukraine_revolution.47.t: "El futuro político de Dnipro"
 ukraine_revolution.47.d: "La región industrial de Dnipro exige una voz en el nuevo orden político. Kiev puede negociar, suprimir el consejo o permitir que surja la república Dnipro existente."
 ukraine_revolution.47.a: "Negociar la autonomía local"
 ukraine_revolution.47.b: "Suprimir el Consejo"
 ukraine_revolution.47.c: "Permitir una República Dnipro"
 ukraine_revolution.48.t: "Consejo de Sumy"
 ukraine_revolution.48.d: "Las autoridades locales de Sumy están pidiendo garantías contra las decisiones tomadas en Kiev. Un consejo negociado es el camino menos disruptivo, pero la supresión y el reconocimiento siguen siendo posibles."
 ukraine_revolution.48.a: "Negociar la autonomía local"
 ukraine_revolution.48.b: "Suprimir el Consejo"
 ukraine_revolution.48.c: "Tolerar una administración local"
 ukraine_revolution.49.t: "El futuro de Novorossiya"
 ukraine_revolution.49.d: "Las repúblicas participantes se han consolidado en Novorossiya. Kiev debe decidir si reconocerlo como sujeto autónomo ucraniano, aceptar una confederación independiente o luchar por su territorio."
 ukraine_revolution.49.a: "Reconocer un asunto autónomo ucraniano"
 ukraine_revolution.49.b: "Aceptar una Confederación Independiente"
 ukraine_revolution.49.c: "Lucha por el Territorio"
 ukraine_revolution.50.t: "Un congreso recordado"
 ukraine_revolution.50.d: "El Congreso de Severodonetsk se ha convertido en parte de la memoria política de la región. Su demanda de voz en las decisiones de Kiev sigue formando las instituciones de la república."
 ukraine_revolution.50.a: "Grabar el Legacy"
 ukraine_revolution.51.t: "Conviértase en instituciones"
 ukraine_revolution.51.d: "La onda del consejo regional ha recorrido su curso. Algunos consejos estaban contenidos, otros se convirtieron en repúblicas, pero cada uno dejó una marca duradera en el asentamiento post-Maidan."
 ukraine_revolution.51.a: "Un nuevo mapa político"
 ukraine_revolution.52.t: "Una República toma forma"
 ukraine_revolution.52.d: "La primera república regional ha establecido un gobierno propio. Su futuro dependerá de si la administración local puede superar la crisis que la creó."
 ukraine_revolution.52.a: "Sostenga la línea"
 ukraine_revolution.53.t: "Larga sombra de Crimea"
 ukraine_revolution.53.d: "El acuerdo de Crimea 2004 finalmente se ha registrado en el orden político. La decisión no puso fin a cada disputa, pero le dio al status de la península una historia que no puede ser ignorada."
 ukraine_revolution.53.a: "Recuerda el acuerdo"
 ukraine_revolution.54.t: "Un acuerdo Novorossiyan"
 ukraine_revolution.54.d: "El asentamiento de Novorossiyan ha cambiado el equilibrio entre Kiev, las repúblicas regionales y Moscú. El nuevo arreglo será juzgado por lo que preserva, no sólo por lo que afirma."
 ukraine_revolution.54.a: "Mantenga el registro"
 ukraine_revolution.55.t: "Territorio libre"
 ukraine_revolution.55.d: "Los militantes anarquistas dentro de la dirección del nuevo estado argumentan que Novorossiya es un nombre prestado que no significa nada para el pueblo de Huliaipole. Quieren revivir la vieja bandera de Nestor Makhno y llamar a la tierra lo que es: un territorio libre."
 ukraine_revolution.55.a: "Adoptar el Territorio Libre"
 ukraine_revolution.55.b: "Mantenga el nombre Novorossiya"
 ukraine_regions.13.t: "El Pacto de Kharkiv"
 ukraine_regions.13.d: "Rusia está ofreciendo extender el alquiler de la Flota del Mar Negro en Sevastopol a cambio de un descuento sobre gas natural."
 ukraine_regions.13.a: "Firme el Pacto"
 ukraine_regions.13.b: "Rechazar el Pacto"
 ukraine_regions.14.t: "El caso Tymoshenko"
 ukraine_regions.14.d: "El ex Primer Ministro Yulia Tymoshenko está siendo procesado por el acuerdo de gas de 2009 con Rusia. Los fiscales quieren que la arresten."
 ukraine_regions.14.a: "Arréstenla."
 ukraine_regions.14.b: "Déjala ir."
 ukraine_regions.15.t: "Ley de idiomas regionales"
 ukraine_regions.15.d: "Un proyecto de ley que otorga la condición regional a los idiomas rusos y otros idiomas minoritarios ha aclarado el Rada. Pasándolo le complacería al sureste y a los nacionalistas de ira en el oeste."
 ukraine_regions.15.a: "Aprobar la ley"
 ukraine_regions.15.b: "Rechazar la ley"
 ukraine_our_ukraine.10.t: "La Cumbre de Bucarest"
 ukraine_our_ukraine.10.d: "En la cumbre de la OTAN en Bucarest, Alemania y Francia bloquearon un Plan de Acción de Afiliación para Ucrania. La puerta de la alianza permanece abierta en nombre, pero no se ha puesto camino a través de ella."
 ukraine_our_ukraine.10.a: "Mantener el Tribunal de la OTAN"
 ukraine_our_ukraine.10.b: "Denunciar a la Rebuff"
 UKR_hur_can_attack: "El gobierno apoya las operaciones de HUR, la Reforma HUR está completa, y al menos una unidad HUR ha sido elevada"
 UKR_YUSHENKO_PATH: "Sendero Yushchenko Seleccionado por Regla de Juego"
 UKR_YANUK_PATH: "Sendero Yanukovych Seleccionado por Regla de Juego"
 UKR_political_tension_tt: "La tensión política cambiará por §Y[?tension_change|0]§! (La tensión política actual: §Y[?UKR.UKR_political_tension|0]§!)."
 UKR_seuar_balance: "SEUAR Autonomía Lucha"
 UKR_seuar_balance_desc: "La lucha entre las instituciones de Kiev y el movimiento de autonomía ucraniana sudoriental determinará si la crisis de 2004 sigue siendo política o produce una nueva república."
 UKR_seuar_kyiv_control: "Control de Kiev"
 UKR_seuar_autonomy_side: "Autonomía Movimiento"
 UKR_seuar_negotiated_center: "Negociado Stalemate"
 UKR_seuar_negotiated_center_desc: "Ni Kyiv ni el movimiento de autonomía han conseguido una ventaja decisiva."
 UKR_seuar_kyiv_advantage: "Kiev gana terreno"
 UKR_seuar_kyiv_advantage_desc: "Las contraprotestaciones y la presión estatal están empezando a contener el movimiento de autonomía."
 UKR_seuar_kyiv_dominance: "Predominio Kiev"
 UKR_seuar_kyiv_dominance_desc: "El movimiento de autonomía está cerca del colapso bajo la presión estatal coordinada."
 UKR_seuar_autonomy_advantage: "Autonomía gana terreno"
 UKR_seuar_autonomy_advantage_desc: "El movimiento de autonomía está organizando más rápido de lo que Kyiv puede contener."
 UKR_seuar_autonomy_dominance: "Autonomía Dominance"
 UKR_seuar_autonomy_dominance_desc: "El movimiento de autonomía tiene suficiente apoyo para exigir una república autónoma formal."
 UKR_separatist_crisis_category: "Crisis separatista"
 UKR_separatist_crisis_category_desc: "[UKR.GetFlag]§YUcrania§! debe contener consejos regionales y movimientos separatistas sin convertir cada disputa local en una guerra."
 UKR_separatist_fund_negotiations: "Fondo para las Negociaciones Regionales"
 UKR_separatist_fund_negotiations_desc: "Pasar fondos de tesorería a mediadores locales y concesiones antes de que los consejos se conviertan en repúblicas."
 UKR_separatist_internal_security: "Despliegue la seguridad interna"
 UKR_separatist_internal_security_desc: "Utilizar fuerzas de seguridad internas para mantener edificios gubernamentales y contener organizadores separatistas."
 UKR_separatist_recognize_councils: "Reconozcan los Consejos Autónomos"
 UKR_separatist_recognize_councils_desc: "Reconocer la autoridad del Consejo a cambio de cumplimiento y del fin del enfrentamiento inmediato."
 UKR_novorossiya_form: "Consolidación Novorossiya"
 UKR_novorossiya_form_desc: "Reunir a las repúblicas participantes y los consejos apoyados bajo la etiqueta Novorossiya existente."
 UKR_novorossiya_recognize: "Reconocer la autonomía de Novorossiya"
 UKR_novorossiya_recognize_desc: "Aceptar Novorossiya como sujeto autónomo ucraniano mientras permanezca en paz y controle territorio."
 UKR_separatist_crisis_active_tt: "La onda regional de la república 2014 está activa."
 UKR_separatist_treasury_tt: "El tesorería debe contener suficientes fondos para esta acción."
 SOV_backed_seuar: "Rusia ha respaldado el movimiento SEUAR"
 UKR_crimea_2004_resolution: "El proceso de estatus de Crimea en 2004 ha comenzado"
 UKR_crimea_2004_pending: "El referéndum de Crimea 2004 está pendiente"
 UKR_crimea_2004_departed: "Crimea abandonó Ucrania en 2004"
 UKR_orange_2004_started: "La crisis política de 2004 ha comenzado"
 UKR_orange_2004_resolved: "La crisis política de 2004 se ha resuelto"
 CRM_2004_content_unlocked: "La administración de Crimea 2004 está activa"
 UKR_provisional_republic_focus_setup: "La administración provisional de la república está activa"
 UKR_crimea_2004_status: "El estado de Crimea"
 UKR_crimea_2004_status_desc: "El Consejo Supremo de Crimea está desafiando a Kiev mientras Moscú apoya el movimiento de autonomía sureste. Decidir cómo manejar Crimea antes de que la crisis se ensanche."
 SOV_seuar_intervention_category: "Apoyar al Sudeste"
 SOV_seuar_intervention_category_desc: "Moscú puede influir en la lucha autonomista del sureste ucraniano, con el riesgo de convertir una crisis política en una guerra."
 UKR_seuar_counter_protests: "Apoyo a las protestas locales"
 UKR_seuar_counter_protests_desc: "Respaldar manifestaciones locales que rechacen el movimiento autonomista y restablezcan la influencia de Kiev."
 UKR_seuar_internal_troops: "Desembolsos de los contingentes internos"
 UKR_seuar_internal_troops_desc: "Utilice tropas del Ministerio del Interior para asegurar edificios públicos y presionar el movimiento de autonomía."
 UKR_seuar_special_operations: "Realización de operaciones SBU-HUR"
 UKR_seuar_special_operations_desc: "Use inteligencia y operaciones especiales para perturbar el movimiento de autonomía. Esto aumenta el riesgo de intervención rusa."
 UKR_seuar_reintegrate: "Ofrecimiento de conformidad constitucional"
 UKR_seuar_reintegrate_desc: "Ofrecer a la SEUAR un compromiso constitucional y reintegrarla a Ucrania."
 UKR_seuar_force: "Forzar la cuestión de la autonomía"
 UKR_seuar_force_desc: "Acabar por la fuerza con el arreglo de autonomía. Esto puede provocar una guerra fronteriza y la intervención rusa."
 SOV_seuar_fund_movement: "Financiar el movimiento autonomista"
 SOV_seuar_fund_movement_desc: "Proporcionar apoyo político y financiero a los organizadores de la SEUAR."
 SOV_seuar_suborn_units: "Unidades locales suborn"
 SOV_seuar_suborn_units_desc: "Alentar a las unidades ucranianas locales a bloquear órdenes o ponerse del lado del movimiento autonomista."
 SOV_seuar_send_volunteers: "Enviar voluntarios"
 SOV_seuar_send_volunteers_desc: "Enviar voluntarios de las regiones fronterizas para defender el movimiento autonomista."
 UKR_seuar_active_tt: "La lucha por la autonomía del SEUAR es activa."
 UKR_seuar_treasury_tt: "El tesorería debe contener suficientes fondos para esta acción."
 SOV_seuar_treasury_tt: "El tesorería debe contener suficientes fondos para esta acción."
 UKR_pro_russian_support_30_tt: "Rusia tiene al menos §Y30%§! influencia sobre Ucrania"
 UKR_seuar_counter_protests_tt: "Desplaza la lucha autonomista hacia Kiev en §R0.10§! y cuesta Estabilidad."
 UKR_seuar_internal_troops_tt: "Cuesta §R3§! del tesoro, desplaza la lucha hacia Kiev en §R0.15§! y cuesta Estabilidad."
 UKR_seuar_special_operations_tt: "Cuesta §R5§! del tesoro, desplaza la lucha hacia Kiev en §R0.08§! y cuesta Estabilidad."
 UKR_seuar_reintegration_tt: "SEUAR será reintegrado. Ucrania gana influencia rusa y la tensión cae en §G15§!."
 UKR_seuar_force_tt: "La SEUAR se hará independiente y comenzará una guerra fronteriza limitada."
 UKR_seuar_intervention_risk_tt: "La intervención rusa es posible si la guerra continúa."
 UKR_seuar_no_intervention_tt: "Moscú puede permanecer fuera del conflicto."
 SOV_seuar_fund_movement_tt: "Cuesta §R5§! del tesoro y desplaza la lucha hacia la autonomía en §G0.10§!."
 SOV_seuar_suborn_units_tt: "Cuesta §R4§! del tesoro, desplaza la lucha hacia la autonomía en §G0.12§! y aumenta la escalada."
 SOV_seuar_send_volunteers_tt: "Cuesta §R8§! del tesoro, desplaza la lucha hacia la autonomía en §G0.18§! y aumenta la escalada."
 UKR_prp_provisional_administration: "Establecer una administración provisional"
 UKR_prp_provisional_administration_desc: "La nueva república necesita una administración funcional antes de que la crisis se endurezca en división permanente."
 UKR_prp_local_security: "Organizar la seguridad local"
 UKR_prp_local_security_desc: "Los comités de seguridad locales pueden reducir el desorden sin convertir cada disputa política en una guerra."
 UKR_prp_volunteer_forces: "Aumento de las fuerzas de voluntarios"
 UKR_prp_volunteer_forces_desc: "Los voluntarios defenderán la república mientras sus instituciones y fuerzas regulares permanecen sin pruebas."
 UKR_prp_utilities_repair: "Reparación de utilidades y carreteras"
 UKR_prp_utilities_repair_desc: "Reparar el transporte y la red de servicios públicos reconectará las comunidades que dependen del gobierno provisional."
 UKR_prp_emergency_economy: "Estabilizar la economía de emergencia"
 UKR_prp_emergency_economy_desc: "Una pequeña base industrial y una producción de emergencia pueden mantener la república suministrada a través de la transición."
 UKR_prp_constitutional_choice: "Elija un arreglo constitucional"
 UKR_prp_constitutional_choice_desc: "Las instituciones provisionales deben decidir si son un puente de regreso a Kiev, un socio de Moscú, o la fundación de un estado separado."
 UKR_prp_negotiate_kyiv: "Negociar con Kiev"
 UKR_prp_negotiate_kyiv_desc: "Un acuerdo directo con Kiev puede proteger a las instituciones locales y evitar otro enfrentamiento armado."
 UKR_prp_seek_moscow_support: "Busca el apoyo de Moscú"
 UKR_prp_seek_moscow_support_desc: "Moscú puede proporcionar apoyo diplomático, pero aceptar su apoyo dará forma a la futura alineación de la república."
 UKR_prp_independent_republic: "Proclamar una República Independiente"
 UKR_prp_independent_republic_desc: "El gobierno provisional puede poner fin a su condición subordinada y aceptar los riesgos de estar solo."
 UKR_prp_regional_union: "Construir una Unión Regional"
 UKR_prp_regional_union_desc: "Trabajar con el asentamiento Novorossiya existente en lugar de crear otra etiqueta competidora."
 DRP_pivdenmash_rearmament: "Reiniciar Pivdenmash"
 DRP_pivdenmash_rearmament_desc: "El viejo cohete Yuzhmash y las obras de maquinaria pesada todavía pueden resultar armas, si alguien está dispuesto a reabrir sus suelos."
 DRP_industrial_mobilization: "Movilizar la industria de Dnipro"
 DRP_industrial_mobilization_desc: "La base industrial soviética de Dnipro puede girar hacia las necesidades de la república, a costa de cualquier producción civil que todavía maneja."
 DRP_dnieper_logistics: "Seguro Dnieper River Logistics"
 DRP_dnieper_logistics_desc: "El río siempre ha movido los bienes de la región. Reconstruir sus aterrizajes y caminos de aproximación mantiene ese tráfico bajo el control de la república."
 DRP_kolomoisky_purge: "Purga de la red Kolomoisky"
 DRP_kolomoisky_purge_desc: "La web de oligarch sigue funcionando a través de la administración local y los negocios. Sacarlo aclara el camino para los propios hombres de la república."
 DRP_state_security_consolidation: "Consolidación de la seguridad del Estado"
 DRP_state_security_consolidation_desc: "Un servicio de seguridad adecuado, contestable a la república y no al que toda facción controle un distrito dado, está retrasado."
 DRP_moscow_alignment: "Alineado con Moscú"
 DRP_moscow_alignment_desc: "Formalizar los lazos militares y económicos con los comercios de Moscú alejan la independencia de acción para un patrono que no dejará caer la república."
 UKR_seuar_autonomy_movement: "Movimiento de Autonomía SEUAR"
 UKR_seuar_autonomy_movement_desc: "Un movimiento de autonomía sureste está impugnando la autoridad de Kiev. Su futuro depende del equilibrio entre los organizadores locales y la presión estatal."
 UKR_western_crisis_idea: "Gobierno de Ucrania Occidental"
 UKR_western_crisis_idea_desc: "Los oblasts occidentales se niegan a reconocer las elecciones fraudulentas y han proclamado su propio gobierno. El enfrentamiento paraliza la política nacional hasta que Kyiv resuelve la cuestión occidental."
 UKR_constitutional_compromise_idea: "Compromiso constitucional"
 UKR_constitutional_compromise_idea_desc: "El acuerdo constitucional que terminó la crisis de autonomía implica el verdadero poder hacia las regiones. Calma al sureste a costa de un gobierno central más débil."
 ukraine_kuchma.14.t: "Protestas en el sureste"
 ukraine_kuchma.14.d: "Después de la elección, activistas sureste rechazan el acuerdo de Kiev y organizan el Maidán Azul. El movimiento amenaza con convertir una crisis electoral en regional."
 ukraine_kuchma.14.a: "La situación está deteriorándose"
 ukraine_kuchma.15.t: "Maidán azul en Ucrania"
 ukraine_kuchma.15.d: "El Maidán Azul pide a Moscú que reconozca su demanda de autonomía regional. El Kremlin debe decidir si prestar peso político al movimiento."
 ukraine_kuchma.15.a: "Apoyar el Movimiento Autonomía"
 ukraine_kuchma.15.b: "No se interfiere"
 ukraine_kuchma.16.t: "Gobierno del Sudeste"
 ukraine_kuchma.16.d: "El Maidán Azul ha formado un gobierno coordinador y afirma que Kyiv ya no representa al sureste. Los funcionarios locales están pidiendo un acuerdo político formal."
 ukraine_kuchma.16.a: "Preparar una respuesta"
 ukraine_kuchma.17.t: "La Revolución Azul"
 ukraine_kuchma.17.d: "Los delegados del Maidán Azul proclaman un proyecto de autonomía ucraniana sudoriental. El movimiento busca ahora un congreso en lugar de una declaración inmediata de independencia."
 ukraine_kuchma.17.a: "El Congreso debe decidir"
 ukraine_kuchma.18.t: "Protestas en Galicia"
 ukraine_kuchma.18.d: "La disputada elección ha llevado a activistas occidentales a las calles. Los enfrentamientos con la policía amenazan con convertir la crisis presidencial en una confrontación constitucional más amplia."
 ukraine_kuchma.18.a: "La situación está deteriorándose"
 ukraine_kuchma.19.t: "Red Maidan en Ucrania"
 ukraine_kuchma.19.d: "Los activistas gallegos exigen una elección honesta y preguntan a Polonia si apoyará su campaña política. Un aval extranjero podría profundizar la crisis."
 ukraine_kuchma.19.a: "Apoyo a las Fuerzas Democráticas"
 ukraine_kuchma.19.b: "No se interfiere"
 ukraine_kuchma.20.t: "El Gobierno de Ucrania Occidental"
 ukraine_kuchma.20.d: "Los activistas occidentales han formado un comité de coordinación política y se niegan a aceptar el acuerdo electoral de Kiev. La confrontación sigue siendo política, pero el país se está haciendo más difícil de gobernar."
 ukraine_kuchma.20.a: "Enviar a la policía"
 ukraine_kuchma.21.t: "La Revolución Roja"
 ukraine_kuchma.21.d: "El Maidán Rojo anuncia una campaña de resistencia contra el gobierno pro-ruso en Kiev. La crisis sigue siendo una lucha política, no un nuevo país."
 ukraine_kuchma.21.a: "Contener la crisis"
 ukraine_revolution.1.t: "La revolución naranja comienza"
 ukraine_revolution.1.d: "La crisis electoral ha llegado a su punto de partida. Si el gobierno no actúa, las protestas se extenderán antes de que termine el año."
 ukraine_revolution.1.a: "Abrir el Maidan Orange"
 ukraine_revolution.10.t: "El Congreso de Severodonetsk"
 ukraine_revolution.10.d: "Los delegados del sudeste de Ucrania se han reunido en Severodonetsk. Pueden limitarse a un congreso histórico, o pedir un proceso de autonomía formal."
 ukraine_revolution.10.a: "Sostén el Congreso"
 ukraine_revolution.10.b: "Solicitud de autonomía"
 ukraine_revolution.11.t: "La lucha por la autonomía"
 ukraine_revolution.11.d: "El movimiento de autonomía y Kiev han pasado meses impugnando el control del sureste. El equilibrio ahora determina si el movimiento es suprimido, negociado o concedido una república formal."
 ukraine_revolution.11.a: "Resolver la lucha"
 ukraine_revolution.12.t: "SEUAR reclama autonomía"
 ukraine_revolution.12.d: "El congreso sudeste ha exigido una república autónoma formal. Kiev debe decidir si reconocer la nueva República Autónoma de Ucrania sudoriental."
 ukraine_revolution.12.a: "Reconocer a la República"
 ukraine_revolution.13.t: "Una composición constitucional"
 ukraine_revolution.13.d: "El movimiento de autonomía ha permanecido dentro de Ucrania, pero sus instituciones separadas se están convirtiendo en difíciles de sostener. Un compromiso constitucional podría restaurar un solo estado ucraniano."
 ukraine_revolution.13.a: "Reintegrate SEUAR"
 ukraine_revolution.14.t: "La cesación del fuego SEUAR"
 ukraine_revolution.14.d: "La lucha entre Ucrania y el SEUAR ha agotado ambas partes. Una cesación del fuego dejaría la nueva república independiente, pero el conflicto podría continuar."
 ukraine_revolution.14.a: "Aceptar una Cesación del Fuego"
 ukraine_revolution.14.b: "Continuar la guerra"
 ukraine_revolution.15.t: "Moscú considera la intervención"
 ukraine_revolution.15.d: "El uso de la fuerza por Ucrania ha señalado el conflicto SEUAR a la atención de Moscú. El Kremlin debe decidir si unirse a la guerra."
 ukraine_revolution.15.a: "Únete a SEUAR"
 ukraine_revolution.15.b: "Mantente fuera de la guerra"
 ukraine_revolution.16.t: "La Guerra Fronteriza SEUAR"
 ukraine_revolution.16.d: "Kyiv ha rechazado el acuerdo de autonomía y ordenó a sus fuerzas que pusieran fin al estatus separado del SEUAR. La decisión corre el riesgo de convertir la crisis constitucional en una guerra."
 ukraine_revolution.16.a: "Fin de la autonomía"
 ukraine_revolution.17.t: "La cuestión occidental"
 ukraine_revolution.17.d: "El Gobierno autoproclamado de Ucrania Occidental todavía se niega a reconocer las elecciones fraudulentas. Meses de despegue han dejado a Kiev con una opción entre concesiones y fuerza."
 ukraine_revolution.17.a: "Negociar con Occidente"
 ukraine_revolution.17.b: "Cállense."
 ukraine_revolution.20.t: "La Asociación Decisión"
 ukraine_revolution.20.d: "El acuerdo de asociación de la Unión Europea está listo para una decisión política. Suspender que puede poner las calles en movimiento, mientras firma podría posponer la crisis."
 ukraine_revolution.20.a: "Suspensión del Acuerdo"
 ukraine_revolution.20.b: "Firmar el Acuerdo"
 ukraine_revolution.21.t: "Reconsiderado el Acuerdo"
 ukraine_revolution.21.d: "Meses después de la firma del acuerdo de asociación, las tensiones políticas han seguido construyendo. El gobierno debe enfrentar ahora las consecuencias de su elección."
 ukraine_revolution.21.a: "Ante las consecuencias"
 UKR_seuar_sov_support_tt: "La influencia rusa sobre Ucrania aumentará, y el movimiento de autonomía continuará."
 UKR_seuar_sov_decline_tt: "Moscú no se comprometerá con el movimiento de autonomía."
 UKR_western_poland_support_tt: "La influencia de Polonia sobre Ucrania aumentará, y el movimiento político occidental continuará."
 UKR_western_poland_decline_tt: "Polonia no se comprometerá con el movimiento político occidental."
 UKR_crimea_2004_permit_tt: "El Consejo Supremo de Crimea organizará un referéndum sobre el estatuto. Moscú decidirá su respuesta."
 UKR_crimea_2004_restrain_tt: "Crimea permanecerá en Ucrania como una república autónoma."
 UKR_crimea_2004_underwrite_tt: "Moscú escribirá secesión de Crimea desde Ucrania."
 UKR_amber_wars_category: "Las guerras ámbares"
 UKR_amber_wars_category_desc: "[UKR.GetFlag]§YUcrania§! mira al otro lado como los excavadores despojan los bosques de pinos de Volhynia para ámbar, mientras que funcionarios locales pesan un corte de las ganancias contra el costo de una represión."
 UKR_amber_crackdown: "Reprimir a los Diggers"
 UKR_amber_crackdown_desc: "Enviar unidades de policía y de la Guardia Nacional a los campos de ámbar para despejar pozos ilegales, incautar equipo y arrestar a los Diggers. No acabará con el comercio para siempre, pero compra al Estado algo de paz y algo de recaudación."
 UKR_amber_tolerate: "Tolerate el Digging"
 UKR_amber_tolerate_desc: "Dejar que los funcionarios locales sigan cobrando su comisión no oficial y dejar en paz a los Diggers. El dinero se mueve, pero también el resentimiento hacia un Estado que solo aparece para cobrar su parte."
 ukraine_amber.1.t: "La República de Kopach lo reclama a sí mismo"
 ukraine_amber.1.d: "Con la autoridad del estado en Volhynia ya hundida por la guerra, una banda de diggers ámbares y fuertes locales declaran los hoyos alrededor de Klesiv su propio asunto. Lo llaman la República de Kopach, después de la palabra ucraniana para excavar y poner un puesto de control en el camino a Sarny."
 ukraine_amber.1.a: "Observe y siga adelante"
 UKR_amber_resentment: "Amber Rush Lawlessness"
 UKR_amber_kopach_truce: "La tregua de los Diggers"
 ukraine_amber.2.t: "La República de Kopach disolves"
 ukraine_amber.2.d: "La república de los manifestantes autodeclarados nunca tuvo un gobierno que hablar, sólo un punto de control y una lista de precios. Con el ámbar fácil que se agota y la novedad se ha ido, los hombres fuertes vuelven tranquilamente a cavar sin la bandera."
 ukraine_amber.2.a: "Acknowledged"
 UKR_strategic_industry_chinese_capital_corridor: "Corredor de Capital Chino"
 UKR_strategic_industry_chinese_capital_corridor_desc: "Capital chino y acceso al mercado anclan la inversión en motores y fabricación avanzada. El corredor ofrece escala al costo de las preocupaciones más agudas de transferencia de tecnología y control."
 UKR_strategic_industry_independent_distributed_industry: "Industria distribuida independiente"
 UKR_strategic_industry_independent_distributed_industry_desc: "Una red de empresas nacionales, centros de reparación y talleres dispersos da a Ucrania salida resistente y rápida adaptación. Sobresale en la continuidad de guerra, aunque no puede reproducir todas las funciones industriales pesadas."
 UKR_strategic_industry_renewed_post_soviet_integration: "Renovación de la integración possoviética"
 UKR_strategic_industry_renewed_post_soviet_integration_desc: "Las cadenas de suministro del este reabierto reconectan las fábricas ucranianas con mercados, componentes y estándares familiares. El rendimiento de la eficiencia, junto con la renovada exposición estratégica."
 UKR_strategic_industry_western_integrated_defense_industry: "West-Integrated Defense Industry"
 UKR_strategic_industry_western_integrated_defense_industry_desc: "Las empresas nacionales y las empresas estatales estratégicas están vinculadas a normas occidentales, inversiones, redes de reparación y asociaciones de producción. La integración amplía los mercados y el acceso a la oferta, mientras que la modernización vinculante de la cooperación aliada."
 ukraine_tech.300.a: "Preserve las combinaciones estratégicas"
 ukraine_tech.300.b: "Privatise las combinaciones y dejar que el mercado decida"
 ukraine_tech.300.d: "La independencia dejó Ucrania con Antonov, Motor Sich, Yuzhmash y las oficinas de diseño a su alrededor, pero no el mercado completo y la red de proveedores que los habían sostenido. Mantener a los especialistas e instalaciones juntos exigirá opciones que el estado apenas puede permitirse."
 ukraine_tech.300.t: "La herencia sin un mercado"
 ukraine_tech.301.a: "Mantenga la red de motores post-soviéticos"
 ukraine_tech.301.b: "Financiar un ecosistema de motor independiente"
 ukraine_tech.301.d: "Ivchenko-Progress diseña motores, mientras que Motor Sich los fabrica. El complejo vinculado de Zaporizhzhia sigue funcionando en mercados y proveedores heredados, forzando una opción entre mantener viva esa red y pagar para construir uno independiente."
 ukraine_tech.301.t: "Motores para un Imperio Desaparecido"
 ukraine_tech.302.a: "Doble en las redes heredadas"
 ukraine_tech.302.b: "Diversificar los contratos con cautela"
 ukraine_tech.302.d: "Las órdenes rusas para motores Motor Sich y marcos aéreos Antonov mantienen las fábricas funcionando, pero la misma red controla componentes, certificación y clientes. La diversificación es costosa ahora, pero la dependencia aumentará cualquier ruptura futura."
 ukraine_tech.302.t: "Los Ties Que Bind"
 ukraine_tech.303.a: "Cortar la cadena de suministro rusa directamente"
 ukraine_tech.303.b: "Mantenga lo que todavía funciona a través de intermediarios"
 ukraine_tech.303.d: "La ruptura política ha roto las relaciones industriales rusas Antonov, Motor Sich y Yuzhmash fueron construidos en. El shock inmediato refleja la exposición aceptada anteriormente, y las empresas sobrevivientes deben reconstruir proveedores, estándares y mercados bajo presión."
 ukraine_tech.303.t: "El Severing"
 ukraine_tech.304.a: "Bloquear la venta y mantener Motor Sich Ucraniano"
 ukraine_tech.304.b: "Permitir el control chino"
 ukraine_tech.304.d: "Los inversores vinculados a China buscan el control de Motor Sich, trayendo la propiedad privada, capital extranjero, tecnología de aviación y seguridad nacional en una sola disputa. Las fábricas de Motor Sich son estratégicas, pero no son la misma institución que la oficina de diseño Ivchenko-Progress."
 ukraine_tech.304.t: "¿Quién posee a Motor Sich?"
 ukraine_tech.305.a: "Un arsenal propio, construido bajo fuego"
 ukraine_tech.305.b: "Un pasillo para la capital china"
 ukraine_tech.305.c: "Una industria de defensa integrada con Occidente"
 ukraine_tech.305.e: "Nueva integración post-soviética"
 ukraine_tech.305.d: "Un cuarto siglo de privatización, ruptura, capital extranjero y guerra a gran escala ha resuelto lo que se convirtió en Antonov, Motor Sich y Yuzhmash, y lo que los reemplazó. Lo que sobrevivió, lo que se construyó bajo el fuego, y quién responde ahora a decidir qué Ucrania puede hacer por sí misma."
 ukraine_tech.305.t: "Lo que la industria de Ucrania se convirtió"
 UKR_party_regions_inauguration: "Yanukovych's Inauguration"
 UKR_party_regions_inauguration_desc: "Es hora de la inauguración de nuestro nuevo presidente."
 ukraine_tech.305.f: "Una industria independiente y dispersa"
 ukraine_tech.306.t: "El Sriya Burns"
 ukraine_tech.306.d: "Las tropas rusas tomaron el aeropuerto de Antonov en Hostomel en las primeras horas, y el An-225 Mriya, el avión más grande jamás construido y la única cosa por la industria ucraniana era famosa, quemado en su hangar. Yuzhmash está dentro del rango de artillería en Dnipro. La producción se puede romper y mover al oeste, en tiendas más pequeñas y subterráneas, a costa de cada economía de escala que las combinaciones fueron construidas alrededor. O las plantas pueden seguir trabajando donde están."
 ukraine_tech.306.a: "Producción dispersa hacia el oeste y bajo tierra"
 ukraine_tech.306.b: "Mantener las plantas trabajando donde están"
 ukraine_tech.307.t: "Cuatro millones de drones"
 ukraine_tech.307.d: "El grupo Brave1 ha convertido talleres de garaje en un oleoducto de adquisición, y Ucrania ahora construye más drones de ataque en un mes que la mayoría de los ejércitos sostienen. Rheinmetall y Baykar ambos quieren empresas conjuntas en suelo ucraniano, lo que traería capitales, estándares y libros de orden de la OTAN. El estado puede verter todo en la base nacional de drones y misiles que ya posee, o cambiar una parte de ella para la integración en la producción aliada."
 ukraine_tech.307.a: "Financiar el drone soberano y la base de misiles"
 ukraine_tech.307.b: "Tomar las empresas conjuntas y los libros de orden aliados"
 UKR_strategic_industry_wartime_drone_arsenal: "Tiempo de guerra Drone Arsenal"
 UKR_strategic_industry_wartime_drone_arsenal_desc: "Ucrania construye sus propios drones y misiles a través de cientos de talleres dispersos que ningún solo ataque puede cerrar. La capacidad es interna, la iteración se mide en semanas, y nadie más tiene un veto sobre lo que se construye."
 UKR_lahuna_recon_ship_idea_1: "Nave de reconocimiento Simferopol"
 UKR_lahuna_recon_ship_idea_1_desc: "Un casco que parece un barco pesquero, escuchando todo dentro del horizonte."
 UKR_lahuna_recon_ship_idea_2: "Nave de reconocimiento Simferopol"
 UKR_lahuna_recon_ship_idea_2_desc: "Un casco que parece un barco de pesca, escuchando todo incluso sobre el horizonte."
 UKR_lahuna_recon_ship_idea_3: "Nave de reconocimiento Simferopol"
 UKR_lahuna_recon_ship_idea_3_desc: "Un casco construido específicamente que parece un barco civil, escuchando todo dentro del horizonte."
 UKR_lahuna_recon_ship_idea_4: "Nave de reconocimiento Simferopol"
 UKR_lahuna_recon_ship_idea_4_desc: "Un casco construido específicamente que parece un barco civil, escuchando todo incluso sobre el horizonte."
 UKR_lahuna_recon_ship: "Suite sensor de clase Lahuna"
 UKR_reorganize_navy_category: "Reorganizar la Marina de Ucrania"
 UKR_reorganize_navy_category_desc: "\n\n\n\n\n\n£UKR_desctext_reorganize_navy\n\n\n\n\n\n\n\n\nDecisiones dentro de esta categoría nos ayudará a reorganizar y mejorar nuestra Marina.\nTendremos dos tipos de opciones aquí: reajustar/construir definitivamente barcos antiguos diseñados por los soviéticos y finalizar conceptos de nuevos diseños domésticos.\nSin embargo, algunas opciones que seleccionamos pueden tener efectos negativos no deseados."
 UKR_reorganize_navy_finish_ternopil_construction: "Terminar la construcción de la corbeta §GTernopil §YProyecto 1124MU§!§!"
 UKR_reorganize_navy_finish_ternopil_construction_desc: "\n\n\n\n\n\n£UKR_desctext_ternopil_corvette_for_tooltip\n\n\n\n\n\n\n\n\nPodemos asignar algún presupuesto para terminar finalmente la producción prolongada de §YU209 'Ternopil'§! 'Proyecto 1124MU' corvette."
 UKR_reorganize_navy_choose_future_corvette: "Elegir el tipo principal de la futura corbeta"
 UKR_reorganize_navy_choose_future_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_future_corvette_for_tooltip\n\n\n\n\n\n\n\n\nPodemos elegir el tamaño y tipo de futuros corbetas - el caballo de trabajo de nuestra Marina."
 UKR_reorganize_navy_build_project_58250_corvette: "Inicio producción de §YProyecto 58250§! §G'Volodymyr Velykyi' Class§! corvettes"
 UKR_reorganize_navy_build_project_58250_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_project_58250_for_tooltip\n\n\n\n\n\n\n\n\nLa clase §Y'Volodymyr Velykyi'§! (o §YProyecto 58250§!) es una clase de corbetas polivalentes ordenadas por la Armada ucraniana.\nEl nuevo barco fue proyectado para ser un poco más grande que una corbeta, pero más pequeño que una fragata.\nEl nuevo proyecto fue desarrollado en 2008 por State Research and Design Shipbuilding Center.\nDesde el comienzo del programa se discutió sobre unos 10 barcos de este tipo.\n\nPodemos elegir la cantidad exacta de corvettes para construir con esta decisión."
 UKR_reorganize_navy_restore_1124: "Examinar §G2 corbetas §YProyecto 1124§!§! para una posible reactivación"
 UKR_reorganize_navy_restore_1124_desc: "\n\n\n\n\n\n£UKR_desctext_project_1124_for_tooltip\n\n\n\n\n\n\n\n\nPodemos comprobar la posibilidad de volver de la descomposición 2 de nuestros corbetas 'Proyecto 1124'.\nDurante la partición de 1997 de la Flota del Mar Negro de la URSS, §R'MPK-43'§! (condenado a §YU209 'Sumy'§!) y §R'MPK-52§! (condenado a §YU210 'Kherson'§!) fueron transferidos a Ucrania pero debido al sabotaje de lado ruso ambos barcos estaban en estado de preparación no-combat.\nDebido a la falta de fondos para el mantenimiento y las reparaciones exigidos, ambos buques fueron escritos y eliminados del ducado poco después de unirse a la Armada Ucraniana.\nComo esas naves aún no han sido destrozadas, podemos rebobinar nuestra decisión original, buscar algo de dinero y remodelarlos.\nTenga en cuenta que esta decisión nos costará mucho y nos proporcionará 2 corvettes moderados en lugar de la posibilidad de invertir en la adquisición de barcos modernos."
 UKR_reorganize_navy_buy_lithuanian_1124: "Expresar el deseo de comprar §G2 corbetas §YProyecto 1124§!§!\na Lituania"
 UKR_reorganize_navy_buy_lithuanian_1124_desc: "\n\n\n\n\n\n£UKR_desctext_lithuanian_corvettes_for_tooltip\n\n\n\n\n\n\n\n\nPodemos enviar una solicitud diplomática a Lituania para que considere la posible venta de 2 corbetas del «Proyecto 1124», llamadas §YF11 «Žemaitis»§! y §YF12 «Aukštaitis»§!, a nosotros.\nEstos 2 buques fueron transferidos a las Fuerzas Armadas de Lituania tras el colapso de la URSS y son unidades de combate relativamente antiguas.\nSin embargo, son del mismo tipo de buques que ya tenemos en nuestra Armada, así que su entrenamiento, mantenimiento y empleo en combate no serán un problema para nosotros.\nNo obstante, la compra de estos buques reducirá los fondos disponibles para la posible adquisición de buques más nuevos."
 UKR_reorganize_navy_maintain_1135: "Mantener §G3 fragatas §YProyecto 1135§!§!"
 UKR_reorganize_navy_maintain_1135_desc: "\n\n\n\n\n\n£UKR_desctext_project_1135_for_tooltip\n\n\n\n\n\n\n\n\nPodemos financiar nuestra Armada para mantener y regresar correctamente al servicio activo 3 de nuestras fragatas «Proyecto 1135».\nEn julio de 1997, de conformidad con el acuerdo ucraniano-ruso sobre los parámetros de distribución de la Flota del Mar Negro, se transfirieron a Ucrania tres buques de patrulla de la Flota del Mar Negro de la URSS: §R'Razitelnyi'§! (renamado) §YU132 'Sebastopol'§!), §R'Bezukoriznennyi'§! (renamado) §YU133 'Mykolayiv'§!) y §R«Bezzavetnyi»§! (renamado) §YU134 'Dnipropetrovsk'§!).\nSin embargo, los tres no se utilizaron como unidades de combate debido a la falta de fondos para reparaciones y restauración de la preparación técnica y pronto fueron desmantelados."
 UKR_reorganize_navy_maintain_1241: "Mantener §G3 pequeñas corbetas §YProyecto 1241§!§!"
 UKR_reorganize_navy_maintain_1241_desc: "\n\n\n\n\n\n£UKR_desctext_project_1241_for_tooltip\n\n\n\n\n\n\n\n\nPodemos financiar nuestra Armada para dar el mantenimiento adecuado y volver al servicio activo 3 de nuestros pequeños corbetas 'Proyecto 1241'.\nEn 1997, durante la partición de la Flota del Mar Negro, Ucrania recibió 4 corbetas del tipo 'Proyecto 1241' en 2 roles diferentes: 2 barcos de misiles, §YU155 'Nikopol'§! y §YU156 'Kremenchuk'§!, y 2 pequeños corbetas ASW: §YU207 'Uzhhorod'§! y §YU208 'Khmelnytskyi'§!Sólo §YU155 'Nikopol'§! El buque de misiles fue transferido en buenas condiciones, otros 3 buques fueron entregados en estado de preparación para no combate y debido a la falta de fondos para reparaciones y restauración de la disponibilidad técnica todavía no están en servicio activo."
 UKR_reorganize_navy_maintain_641_submarine: "Mantener el submarino §GZaporizhzhia §YProyecto 641§!§!"
 UKR_reorganize_navy_maintain_641_submarine_desc: "\n\n\n\n\n\n£UKR_desctext_zaporizhzhia_submarine_for_tooltip\n\n\n\n\n\n\n\n\nPodemos financiar nuestra Armada para mantener y volver al servicio activo nuestro único submarino - §YU01 'Zaporizhia'§! de «Proyecto 641».\nEn 1997 incapaz de fijar el submarino no utilizado, la administración de la Marina rusa lo entregó a la Armada ucraniana durante la partición de la Flota del Mar Negro.\nDesafortunadamente, las baterías del submarino fallaron permanentemente y requirió mantenimiento completo y sustitución de baterías para funcionar.\nPodemos asignar algunos fondos para proceder con la reparación del submarino."
 UKR_reorganize_navy_finish_11451: "Terminar la construcción de §G2 corbetas §YProyecto 11451§!§!"
 UKR_reorganize_navy_finish_11451_desc: "\n\n\n\n\n\n£UKR_desctext_project_11451_for_tooltip\n\n\n\n\n\n\n\n\n«Proyecto 11451» es una serie de pequeños barcos antisubmarinos (corvettes) construidos en el Astillero Feodosiya 'Más' desde 1987, sólo 2 fueron construidos antes de la disolución de la URSS.\nCorvettes §YU201 'Lviv'§! (preparación de construcción cerca del 95%) y §YU203 'Luhansk'§! (preparación de construcción cerca del 60%) siguen estando en la pasarela del patio naval 'Más' en Feodosiya.\nDebido a la terminación de los fondos estatales, se suspendió la finalización de las naves, pero ahora su futuro destino puede ser elegido por fin."
 UKR_reorganize_navy_finish_ukrayina: "Terminar la construcción del crucero §GUkrayina§!\n§YProyecto 1164§!"
 UKR_reorganize_navy_finish_ukrayina_desc: "\n\n\n\n\n\n£UKR_desctext_ukrayina_cruiser_for_tooltip\n\n\n\n\n\n\n\n\n§Y'Ukrayina'§! es un crucero de diseño soviético inacabado 'Proyecto 1164 Clase'.\nDebido a las limitaciones presupuestarias, el trabajo en el crucero se detuvo a principios del decenio de 1990 y el buque quedó sin terminar. En 1993 el crucero fue retirado de la Marina Rusa y pasó a Ucrania.\nPodemos invertir un puñado de dinero para terminar la construcción y luego mostraremos el verdadero poder naval de Ucrania en el Mar Negro!"
 UKR_reorganize_navy_finish_ternopil_construction_flag: " Decisión completa Finalizar la construcción §GTernopil§! §YProyecto 1124MU§! §Gcorvette§!"
 UKR_reorganize_navy_funded_project_58250_corvette_development_flag: " Evento completado §YEnfoque sobre corvettes multipropósitos§! con opción seleccionada §GAsignemos presupuesto§!"
 UKR_reorganize_navy_not_funded_project_58250_corvette_development_flag: " Evento completado §YEnfoque sobre corvettes multiusos§! con opción seleccionada §R Vamos a reducir nuestros gastos§!"
 UKR_reorganize_navy_developed_project_58250_corvette_development_flag: " Evento completado §YBuild the Project 58200 'Hayduk-21' Class corvettes§!"
 UKR_reorganize_navy_repair_rivne: "Reparar el gran buque de desembarco §GRivne§! §YProyecto 1171§!"
 UKR_reorganize_navy_repair_rivne_desc: "\n\n\n\n\n\n£UKR_desctext_rivne_lst_for_tooltip\n\n\n\n\n\n\n\n\nPodemos financiar nuestra Armada para mantener y volver al servicio activo el gran barco de aterrizaje §YU762 'Rivne'§! del «Proyecto 1171».\nEl 10 de abril de 1994, un campamento militar en el Puerto Práctico del Odesa Sea Port fue confiscado por la fuerza por una compañía de asalto aéreo ucraniana de Bolhrad, donde se localizó el 'Proyecto 1171' 'Ilya Azarov' y el 'Proyecto 773' SDK-137 LSTs, y el 18 de abril de 1994, por un acto unilateral, el buque fue aceptado en la Armada de las Fuerzas Armadas de Ucrania.\nLamentablemente, debido a la falta de fondos para reparaciones y restauración de la preparación técnica, el buque más grande se ha vuelto inoperable como plataforma LST, y fue reclasificado como buque de transporte militar de carga seca y actualmente está en disposición no combatiente.\nPodemos asignar algunos fondos para proceder con la reparación del barco y devolverlo al servicio activo como LST o por lo menos como un buque de apoyo."
 UKR_reorganize_navy_repair_support_ships: "Reparar §G4§! buques de §Yapoyo§! y §Yreparación§!, actualmente en preparación no combativa"
 UKR_reorganize_navy_repair_support_ships_desc: "\n\n\n\n\n\n£UKR_desctext_support_ships_for_tooltip\n\n\n\n\n\n\n\n\nPodemos financiar nuestra Armada para mantener y volver al servicio activo un par de soportes enviados, como gran buque cisterna de mar §YU757 'Makiyivka'§!, medio tanquer §YU758 'Kerch'§!, pequeño petrolero §YU759 'Bakhmach'§! y taller flotante §Y'Olviya'§!.\nEn 2000 los cuatro buques mencionados no se utilizaron como unidades activas debido a la falta de fondos para reparaciones y restauración de la preparación técnica y pronto fueron decomisados."
 UKR_reorganize_navy_build_lahuna_recon_ship: "Proyecto §YLahuna§!: un buque de §Yreconocimiento§!"
 UKR_reorganize_navy_build_lahuna_recon_ship_desc: "\n\n\n\n\n\n£UKR_desctext_simferopol_recon_for_tooltip\n\n\n\n\n\n\n\n\nLa Armada quiere un barco de inteligencia de señales y no tiene dinero para uno diseñado a propósito. Kuznya na Rybalskomu tiene un casco de arrastre, una pasarela y cuatro décadas de experiencia construyendo el mismo barco de 1,220 toneladas una y otra vez.\n\nCincuenta y cinco metros, 29 tripulantes, 7.200 millas de alcance, veintiocho días en el mar. Su arma es la granja aérea."
 UKR_lahuna_needs_kuznya_tt: "Debemos controlar el astillero Kyiv."
 UKR_lahuna_needs_black_sea_port_tt: "Debemos poseer un puerto del Mar Negro para recibirla"
 UKR_lahuna_progress_tt: "Aumento de los progresos en la construcción de Lahuna"
 ukraine_reorganize_navy_restore_1124.1.name: "Reactivación de 2 corbetas 'Proyecto 1124'"
 ukraine_reorganize_navy_restore_1124.1.desc: "Hemos examinado 2 cascos de 'Proyecto 1124' corvettes, 'U204 Sumy' (número cambiado debido a la nueva corbeta, 'Ternopil', tomando U209 número de colgante) y 'U210 Kherson', y ahora puede seleccionar la dirección más adecuada que avanzaremos en nuestra decisión sobre su destino.\nPodemos invertir más dinero y reactivar ambas naves o raspar el peor barco de condición, 'U210 Kherson', y utilizar partes de él para reactivar 'U204 Sumy' más rápido."
 ukraine_reorganize_navy_restore_1124.1.a: "Reactivar ambas naves"
 ukraine_reorganize_navy_restore_1124.1.b: "Cannibalizar 'Kherson' para reactivar 'Sumy'"
 ukraine_reorganize_navy_choose_future_corvette.1.name: "Futuro programa de corbeta ucraniano"
 ukraine_reorganize_navy_choose_future_corvette.1.desc: "Estamos en el punto ahora mismo, que nuestra decisión de elegir el futuro caballo principal de trabajo de nuestra flota no se puede posponer más.\nPodemos elegir entre un puñado de diseños domésticos, pero la decisión principal debe ser escogida en qué tipo de corvette enfocaremos nuestros recursos: más barato, más fácil de producir corbetas ligeras de aproximadamente 700 toneladas, corbetas estándar de 1 200 toneladas o corvettes multiusos pesados de 2 000+ toneladas de desplazamiento."
 ukraine_reorganize_navy_choose_future_corvette.1.a: "Corvettes ligeros"
 ukraine_reorganize_navy_choose_future_corvette.1.b: "Corvettes estándar"
 ukraine_reorganize_navy_choose_future_corvette.1.c: "Corvettes multifuncionales"
 ukraine_reorganize_navy_choose_future_corvette.2.name: "Enfoque sobre corbetas más pequeñas"
 ukraine_reorganize_navy_choose_future_corvette.2.desc: "Elegimos la opción más barata entre todos los disponibles, y procederemos con 'Muson'-Class corvettes como nuestra nueva adición de flota.\nVamos a seleccionar la cantidad de barcos que vamos a estar de acuerdo en construir."
 ukraine_reorganize_navy_choose_future_corvette.2.a: "16 ships (4x4)"
 ukraine_reorganize_navy_choose_future_corvette.2.b: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.2.c: "8 ships (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.3.name: "Enfoque sobre corbetas estándar"
 ukraine_reorganize_navy_choose_future_corvette.3.desc: "Elegimos la opción más obvia entre todos los disponibles, y procederemos con corvettes de tamaño estándar como nuestra nueva adición de flota.\nVamos a seleccionar la clase exacta de barcos, que vamos a construir."
 ukraine_reorganize_navy_choose_future_corvette.3.a: "Proyecto 58200 Clase 'Hayduk-21'"
 ukraine_reorganize_navy_choose_future_corvette.3.b: "'Mistral-1500T' Class"
 ukraine_reorganize_navy_choose_future_corvette.3.c: "Clase 'Mirazh'"
 ukraine_reorganize_navy_choose_future_corvette.4.name: "Enfoque sobre corbetas polivalentes"
 ukraine_reorganize_navy_choose_future_corvette.4.desc: "Elegimos la opción más potente entre todos los disponibles, y procederemos con corvettes multiusos más grandes como nuestra nueva adición de flota.\nEstos serán los corvettes de clase 'Volodymyr Velykyi' del Proyecto 58250.\nDesafortunadamente, no tenemos exactamente el modelo desarrollado ahora mismo, así que tendremos que gastar algo de dinero y tiempo para investigarlo."
 ukraine_reorganize_navy_choose_future_corvette.4.a: "Asignemos presupuesto"
 ukraine_reorganize_navy_choose_future_corvette.4.b: "Vamos a reducir nuestros gastos."
 ukraine_reorganize_navy_choose_future_corvette.5.name: "Construir el Proyecto 58200 'Hayduk-21' Corvettes Clase"
 ukraine_reorganize_navy_choose_future_corvette.5.desc: "Como resultado de nuestro proceso independiente de licitación, hemos seleccionado los corvettes Clases del Proyecto 58200 'Hayduk-21' como nuestra nueva adición a la flota.\nVamos a seleccionar la cantidad de barcos que vamos a estar de acuerdo en construir."
 ukraine_reorganize_navy_choose_future_corvette.5.a: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.5.b: "8 ships (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.5.c: "6 ships (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.6.name: "Construir las corbetas de clase 'Mistral-1500T'"
 ukraine_reorganize_navy_choose_future_corvette.6.desc: "Como resultado de nuestro proceso de licitación independiente, hemos seleccionado los corvettes Clase 'Mistral-1500T' como nuestra nueva adición de flota.\nVamos a seleccionar la cantidad de barcos que vamos a estar de acuerdo en construir."
 ukraine_reorganize_navy_choose_future_corvette.6.a: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.6.b: "8 ships (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.6.c: "6 ships (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.name: "Construir los corbetes de clase 'Mirazh'"
 ukraine_reorganize_navy_choose_future_corvette.7.desc: "Como resultado de nuestro proceso independiente, hemos seleccionado los corvettes Clase 'Mirazh' como nuestra nueva adición a la flota.\nVamos a seleccionar la cantidad de barcos que vamos a estar de acuerdo en construir."
 ukraine_reorganize_navy_choose_future_corvette.7.a: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.b: "8 ships (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.7.c: "6 ships (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.8.name: "Construir el proyecto 58250 'Volodymyr Velykyi' Clase corvettes"
 ukraine_reorganize_navy_choose_future_corvette.8.desc: "Como resultado de nuestro proceso independiente de licitación, hemos seleccionado el Proyecto 58250 'Volodymyr Velykyi' Corvettes Clase como nuestra nueva adición de flota.\nVamos a seleccionar la cantidad de barcos que vamos a estar de acuerdo en construir."
 ukraine_reorganize_navy_choose_future_corvette.8.a: "10 ships (2x5)"
 ukraine_reorganize_navy_choose_future_corvette.8.b: "8 ships (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.8.c: "4 ships (2x2)"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.name: "Los resultados de la reunión con Lituania\nsobre la posibilidad de comprar 2 'Proyecto 1124' corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.desc: "Tras nuestra reunión con colegas lituanos en relación con la posible compra de 2 'Proyecto 1124' corvettes, recibimos resultados generalmente positivos, ya que Lituania está a favor de esta decisión.\nSin embargo, necesitan consultar con Rusia para negociar la aprobación de esta venta y los posibles resultados para su país.\nAhora nos enfrentamos a una decisión: podemos ofrecer más dinero y más oportunidades de comercio para persuadirlos a ignorar la opinión de Moscú, o podemos esperar el resultado natural de su consulta."
 ukraine_reorganize_navy_buy_lithuanian_1124.1.a: "Intentaremos convencerlos."
 ukraine_reorganize_navy_buy_lithuanian_1124.1.b: "Esperaremos."
 ukraine_reorganize_navy_buy_lithuanian_1124.2.name: "La segunda ronda de negociaciones con Lituania\nrelativa a la compra de corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.desc: "Dado que las negociaciones anteriores entre nuestros países no nos permitieron obtener el resultado positivo esperado, decidimos intensificar nuestros esfuerzos.\nComo resultado de la segunda ronda, acordamos la compra de 2 corvettes en las siguientes condiciones: la ampliación del comercio entre nuestros países y la concertación de un acuerdo para suministrar algunas cantidades de acero y carbón, una indemnización adicional de nuestra parte por la compra de un nuevo buque para la flota lituana, la transferencia de ciertas tecnologías militares que anteriormente no estaban disponibles para ellos.\n¿Aceptamos estos términos?"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.a: "Sí, seguro."
 ukraine_reorganize_navy_buy_lithuanian_1124.2.b: "No, no es posible."
 ukraine_reorganize_navy_buy_lithuanian_1124.3.name: "Resultados de las consultas entre Lituania y Rusia\nsobre la posibilidad de vender corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.desc: "Nuestros socios lituanos celebraron las negociaciones deseadas con la parte rusa sobre la posible venta a nosotros de 2 corbetas construidas por los soviéticos.\nLamentablemente, Rusia no permitió la venta en los términos previamente acordados entre Lituania y nosotros, pero expresó su deseo de celebrar consultas adicionales con nosotros.\nAhora tenemos 2 opciones para el desarrollo ulterior de eventos: ya sea para abandonar la idea inicial, o continuar las negociaciones con Rusia en sus términos."
 ukraine_reorganize_navy_buy_lithuanian_1124.3.a: "Abandonar la compra de corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.b: "Realizar negociaciones con Rusia"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.name: "Resultados de las negociaciones entre Ucrania y Rusia\nsobre la posibilidad de comprar corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.desc: "Celebramos negociaciones incómodas pero necesarias con Rusia. Desafortunadamente, hablaron de una posición de fuerza en estas negociaciones, y no tuvimos nada que responderles.\nRusia nos presentó el siguiente ultimátum para conceder permiso a Lituania para la venta de 2 corvettes: asignación de un lugar adicional para las necesidades de la base rusa del Mar Negro en Sevastopol, disminuyendo nuestro movimiento hacia la UE, fortaleciendo el comercio entre nosotros y la compensación monetaria adicional a Rusia por buques.\n¿Aceptamos estos términos?"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.a: "Abandona la idea"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.b: "De acuerdo con los términos de Rusia"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.name: "Finalización del acuerdo sobre la compra de corbetas de Lituania"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.desc: "Finalmente hemos acordado todos los términos y somos capaces de completar la compra y transferencia de los barcos.\nComo signo de respeto a sus propietarios anteriores, acordamos nombrar los barcos 'Bratslav' y 'Volodymyr', en honor de importantes ciudades en el territorio de la Ucrania moderna, que fueron una vez parte del estado común, el Gran Ducado de Lituania, Ruthenia y Zemaitia."
 ukraine_reorganize_navy_buy_lithuanian_1124.5.a: "¡Genial!"
 ukraine_reorganize_navy_maintain_1135.1.name: "Mantenimiento de 3 fragatas 'Proyecto 1135'"
 ukraine_reorganize_navy_maintain_1135.1.desc: "Hemos examinado 3 cascos de fragatas 'Proyecto 1135', 'Sevastopol', 'Mykolayiv' y 'Dnipropetrovsk', y ahora podemos seleccionar la dirección más adecuada que avanzaremos en nuestra decisión sobre su destino.\nPodemos invertir más dinero y reparar los 3 barcos o simplemente concentrarnos en los más modernos y potentes."
 ukraine_reorganize_navy_maintain_1135.1.a: "Mantener las 3 naves"
 ukraine_reorganize_navy_maintain_1135.1.b: "Mantener sólo 'Sevastopol' y 'Mykolayiv'"
 ukraine_reorganize_navy_maintain_1135.1.c: "Mantener sólo el más moderno, 'Sebastopol'"
 ukraine_reorganize_navy_finish_11451.1.name: "Construcción final de 2 'Proyecto 11451' corvettes"
 ukraine_reorganize_navy_finish_11451.1.desc: "Hemos examinado 2 cascos de 'Proyecto 11451' corvettes, 'Lviv' y 'Luhansk', y ahora podemos seleccionar la dirección más adecuada que avanzaremos en nuestra decisión sobre su destino.\n\nPodemos invertir más dinero y terminar la construcción de ambas naves o raspar el peor barco de condiciones, 'Luhansk', y utilizar partes de él para construir 'Lviv' más rápido."
 ukraine_reorganize_navy_finish_11451.1.a: "Terminar ambas naves"
 ukraine_reorganize_navy_finish_11451.1.b: "Cannibalize 'Luhansk' para terminar 'Lviv'"
 ukraine_reorganize_navy_maintain_1241.1.name: "Mantener 3 'Proyecto 1241' pequeños corvettes"
 ukraine_reorganize_navy_maintain_1241.1.desc: "Hemos examinado 3 cascos de nuestras pequeñas corbetas 'Proyecto 1241', U156 'Kremenchuk' barco de misiles y U207 'Uzhhorod' y U208 'Khmelnytskyi' pequeños corvettes ASW.\nAhora podemos seleccionar la dirección más adecuada que avanzaremos en nuestra decisión sobre su destino.\nPodemos invertir más dinero y reparar los 3 barcos o simplemente concentrarnos en el que tiene la mayor oportunidad de reparar entre ellos."
 ukraine_reorganize_navy_maintain_1241.1.a: "Mantener las 3 naves"
 ukraine_reorganize_navy_maintain_1241.1.b: "Mantenga sólo U208 'Khmelnytskyi'"
 ukraine_reorganize_navy_maintain_1241.2.name: "Finalización de la reparación del barco de misiles 'U156 'Kremenchuk'"
 ukraine_reorganize_navy_maintain_1241.2.desc: "Hemos completado la reparación de 'U156 'Kremenchuk' barco de misiles y ahora está listo para el servicio activo.\nAhora continuaremos reparando U207 'Uzhhorod' y U208 'Khmelnytskyi' pequeños corvettes ASW."
 ukraine_reorganize_navy_maintain_1241.2.a: "Genial, continuemos."
 ukraine_reorganize_navy_maintain_1241.3.name: "Finalización de la reparación de 'U207 'Uzhhorod' pequeño ASW corvette"
 ukraine_reorganize_navy_maintain_1241.3.desc: "Hemos completado la reparación de 'U207 'Uzhhorod' pequeño ASW corvette y ahora está listo para el servicio activo.\nNos doblaremos al terminar la reparación de U208 'Khmelnytskyi' pequeño ASW corvette ahora."
 ukraine_reorganize_navy_maintain_1241.3.a: "Genial, continuemos."
 ukraine_reorganize_navy_maintain_1241.4.name: "Finalización de la reparación de 'U208 'Khmelnytskyi pequeño ASW corvette"
 ukraine_reorganize_navy_maintain_1241.4.desc: "Hemos completado la reparación de 'U208 'Khmelnytskyi pequeño ASW corvette y ahora está listo para el servicio activo.\nLos 4 'Proyecto 1241' pequeños corvettes están en servicio activo ahora."
 ukraine_reorganize_navy_maintain_1241.4.a: "Grande, todas las naves están listas"
 ukraine_reorganize_navy_maintain_1241.5.name: "Finalización de la reparación de 'U208 'Khmelnytskyi pequeño ASW corvette"
 ukraine_reorganize_navy_maintain_1241.5.desc: "Gracias a las piezas canibalizantes de otras 3 corbetas pequeñas «Project-1241» hemos completado la reparación de 'U208 'Khmelnytskyi' pequeño ASW corvette antes de lo esperado. Ahora está listo para el servicio activo."
 ukraine_reorganize_navy_maintain_1241.5.a: "¡Bien!"
 ukraine_reorganize_navy_maintain_641_submarine.1.name: "'Zaporizhzhia' submarino - búsqueda de baterías"
 ukraine_reorganize_navy_maintain_641_submarine.1.desc: "Hemos examinado el casco de 'Zaporizhzhia' y hemos encontrado mucho trabajo que hacer.\n Desafortunadamente, el problema principal en este momento es la ausencia de baterías: sin ellas el submarino no puede moverse.\nPodemos pedirle a Rusia que nos venda una de sus baterías almacenadas, busque en Europa (en particular en Grecia) o dé orden para que nuestras industrias locales desarrollen la batería doméstica para ella."
 ukraine_reorganize_navy_maintain_641_submarine.1.a: "Comprar de Rusia"
 ukraine_reorganize_navy_maintain_641_submarine.1.b: "Búsqueda en Europa"
 ukraine_reorganize_navy_maintain_641_submarine.1.c: "Desarrollar nacionalmente"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_RUS_flag: " Evento completado §Y'Zaporizhzhia' submarine - búsqueda de baterías§! con opción seleccionada §RComprar desde Rusia§!"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_GRE_flag: " Evento completado §Y'Zaporizhzhia' submarine - búsqueda de baterías§! con opción seleccionada §BBuscar en Europa§!"
 ukraine_reorganize_navy_maintain_641_submarine.2.name: "'Zaporizhzhia' submarino - compra de baterías"
 ukraine_reorganize_navy_maintain_641_submarine.2.desc: "Por último, acordamos las condiciones de compra con nuestro país socio, y después de que se terminaran los pagos previos, la espera para la entrega ha comenzado.\nPuede parecer increíble, pero recibimos un equipo tan desesperadamente necesario con términos previamente acordados.\nAhora sólo podemos decir nuestro agradecimiento a nuestro parter y continuar con la reparación."
 ukraine_reorganize_navy_maintain_641_submarine.2.a: "Gracias Rusia, continuar con la reparación"
 ukraine_reorganize_navy_maintain_641_submarine.2.b: "Gracias Grecia, continuar con la reparación"
 ukraine_reorganize_navy_maintain_641_submarine.3.name: "'Zaporizhzhia' submarine - desarrollo nacional de las baterías"
 ukraine_reorganize_navy_maintain_641_submarine.3.desc: "La tarea de desarrollar localmente las baterías para el submarino 'Zaporizhzhia' no era fácil.\nPor fin, hemos recibido lo que hicimos, pero los costos reales fueron más altos de lo que esperábamos.\nSin embargo, podemos continuar con la reparación del submarino."
 ukraine_reorganize_navy_maintain_641_submarine.3.a: "Conseguimos este hito, continuamos con la reparación"
 ukraine_reorganize_navy_maintain_641_submarine.4.name: "'Zaporizhzhia' submarino - terminar la reparación"
 ukraine_reorganize_navy_maintain_641_submarine.4.desc: "Nos las arreglamos para instalar las nuevas baterías, reparar y mantener todo el equipo no funcional y por fin podemos comenzar los ensayos de mar.\n\nPodemos hacer el programa básico y ahorrar dinero y tiempo o extenso, que requerirá más recursos, pero podemos encontrar algunos de los problemas adicionales y resolverlos rápidamente."
 ukraine_reorganize_navy_maintain_641_submarine.4.a: "Inicio de pruebas básicas del mar"
 ukraine_reorganize_navy_maintain_641_submarine.4.b: "Inicio de ensayos marítimos prolongados"
 ukraine_reorganize_navy_maintain_641_submarine_extended_sea_trials_bonus: "Fiabilidad adicional como resultado de ensayos marítimos prolongados para el submarino 'Zaporizhzhia'"
 ukraine_reorganize_navy_maintain_641_submarine.5.name: "'Zaporizhzhia' submarine - comisiona el submarino"
 ukraine_reorganize_navy_maintain_641_submarine.5.desc: "Por último hemos hecho todas las compras necesarias, reemplazos, instalaciones, mantenimiento, reparaciones y ensayos marítimos para que 'Zaporizhzhia' sea plenamente encargado en la Armada Ucraniana!"
 ukraine_reorganize_navy_maintain_641_submarine.5.a: "¡Por fin!"
 ukraine_reorganize_navy_finish_ukrayina.1.name: "Termina crucero 'Ukrayina' - Problemas de equipo perdido"
 ukraine_reorganize_navy_finish_ukrayina.1.desc: "Bajo el control directo de nuestro Presidente, finalmente hemos tomado una decisión para terminar la construcción del crucero 'Ukrayina' de la clase 1164 soviética.\nExaminamos el casco e hicimos una lista comprehemsiva de equipos desaparecidos.\nAhora tenemos que hacer otro paso y decidir qué debemos hacer: pedir a Rusia permiso para adquirir equipo original de ellos (principalmente sistemas ASM y SAMs) o contactar con los países occidentales y buscar la posibilidad de reemplazarlo por sus contrapartes.\nPor favor, tenga en cuenta que debe tener al menos 40+ opinión de EE.UU. o 25+ opinión de Francia con el fin de pedir equipo occidental.\n\n\n§GEste es el paso 1 de §R3§!, §R4§! or §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.1.a: "Stick con el equipo ruso original"
 ukraine_reorganize_navy_finish_ukrayina.1.b: "Examinar posibles reemplazos occidentales"
 ukraine_reorganize_navy_finish_ukrayina.2.name: "Final crucero 'Ukrayina' - Compra de equipos rusianos"
 ukraine_reorganize_navy_finish_ukrayina.2.desc: "A medida que optamos por aferrarnos al diseño soviético original con el acabado de la construcción del crucero 'Ukrayina', comenzamos negociaciones con Rusia sobre la adquisición de equipos perdidos.\nNos llevará mucho dinero y tiempo recibir los componentes necesarios.\n\n\n§GEste es el paso 2 de 3§!"
 ukraine_reorganize_navy_finish_ukrayina.2.a: "Pagaremos y esperaremos"
 ukraine_reorganize_navy_finish_ukrayina.3.name: "Acabado crucero 'Ukrayina' - equipo ruso recibido"
 ukraine_reorganize_navy_finish_ukrayina.3.desc: "Por último, los componentes necesarios fueron proporcionados por Rusia y podemos iniciar el proceso de instalación y terminar la construcción. Espero que no tome siglos.\n\n\n§GEste es el paso final§!"
 ukraine_reorganize_navy_finish_ukrayina.3.a: "Inicio de la producción"
 ukraine_reorganize_navy_finish_ukrayina.4.name: "Final crucero 'Ukrayina' - Reemplazar los misiles"
 ukraine_reorganize_navy_finish_ukrayina.4.desc: "Podemos buscar todas las posibles variantes del equipo occidental en el mercado para reemplazar los misiles anti-viaje P-500 soviéticos desaparecidos y los misiles S-300F 'Fort' de superficie a aire.\nTenemos que elegir entre un par de posibles opciones.\n\n\n§GEste es el paso 2 de §R4§! o §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.4.a: "Elija Misiles americanos"
 ukraine_reorganize_navy_finish_ukrayina.4.b: "Elija Misiles Francesos"
 ukraine_reorganize_navy_finish_ukrayina.4.c: "Elija Misiles Suecos"
 ukraine_reorganize_navy_finish_ukrayina.5.name: "Termina crucero 'Ukrayina' - misiles americanos"
 ukraine_reorganize_navy_finish_ukrayina.5.desc: "Como hemos seleccionado a EE.UU. como proveedor de nuevos misiles para el crucero 'Ukrayina', comenzamos negociaciones con ellos para adquirir ambos misiles RGM-84D Harpoon Block 1C anti-ship y misiles RIM-66M-2 Block IIIA superficie-aire.\nNos llevará mucho dinero y tiempo recibir los componentes necesarios.\n\n\n§GEste es el paso 3 de §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.5.a: "Pagaremos y esperaremos"
 ukraine_reorganize_navy_finish_ukrayina.6.name: "Termina crucero 'Ukrayina' - misiles franceses"
 ukraine_reorganize_navy_finish_ukrayina.6.desc: "Como hemos seleccionado a Francia como proveedor de nuevos misiles para el crucero 'Ukrayina', comenzamos negociaciones con ellos para adquirir tanto los misiles anti-bores Exocet MM40 Block 2 como los misiles Aster 30 Block 2 de superficie a aire.\nNos llevará mucho dinero y tiempo recibir los componentes necesarios.\n\n\n§GEste es el paso 3 de §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.6.a: "Pagaremos y esperaremos"
 ukraine_reorganize_navy_finish_ukrayina.7.name: "Termina crucero 'Ukrayina' - AShMs sueco"
 ukraine_reorganize_navy_finish_ukrayina.7.desc: "Como hemos seleccionado a Suecia como proveedor de nuevos RBS 15 Mk. III misiles anti-viaje para el crucero 'Ukrayina', empezamos negociaciones con ellos para adquirir esos equipos.\nNos llevará mucho dinero y tiempo recibir los componentes necesarios.\n\n\n§GEste es el paso 3 de §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.7.a: "Pagaremos y esperaremos"
 ukraine_reorganize_navy_finish_ukrayina.8.name: "Final crucero 'Ukrayina' - Reemplazar los misiles de superficie a aire"
 ukraine_reorganize_navy_finish_ukrayina.8.desc: "Después de la selección de los misiles anti-viaje suecos más modernos, todavía tenemos que elegir qué equipo reemplazará a los misiles S-300F 'Fort' de superficie a aire.\nSólo tenemos 2 opciones posibles para elegir.\n\n\n§GEste es el paso 4 de §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.8.a: "Elija RIM-66M-2 Bloque IIIA"
 ukraine_reorganize_navy_finish_ukrayina.8.b: "Seleccione francés Aster 30 Block 2"
 ukraine_reorganize_navy_finish_ukrayina.9.name: "Termina crucero 'Ukrayina' - American RIM-66 SAMs"
 ukraine_reorganize_navy_finish_ukrayina.9.desc: "Como hemos seleccionado a EE.UU. como proveedor de nuevos misiles de superficie a aire para el crucero «Ukrayina», empezamos negociaciones con ellos para adquirir esos equipos.\nNos llevará mucho dinero y tiempo recibir los componentes necesarios.\n\n\n§GEste es el paso 5 de §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.9.a: "Pagaremos y esperaremos"
 ukraine_reorganize_navy_finish_ukrayina.10.name: "Final crucero 'Ukrayina' - francés Aster 30 SAMs"
 ukraine_reorganize_navy_finish_ukrayina.10.desc: "Como hemos seleccionado a Francia como proveedor de nuevos misiles de superficie a aire para el crucero «Ukrayina», empezamos negociaciones con ellos para adquirir esos equipos.\nNos llevará mucho dinero y tiempo recibir los componentes necesarios.\n\n\n§GEste es el paso 5 de §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.10.a: "Pagaremos y esperaremos"
 ukraine_reorganize_navy_finish_ukrayina.11.name: "Acabado crucero 'Ukrayina' - Todos los equipos recibidos"
 ukraine_reorganize_navy_finish_ukrayina.11.desc: "Todos los componentes requeridos fueron proporcionados por los productores de acuerdo a términos y condiciones previamente acordados, y podemos iniciar el proceso de instalación y terminar la construcción. Espero que no tome siglos.\n\n\n§GEste es el paso final§!"
 ukraine_reorganize_navy_finish_ukrayina.11.a: "Inicio de la producción"
 ukraine_reorganize_navy_repair_rivne.1.name: "Reparación de 'Rivne' LST - Seleccione la manera de proceder"
 ukraine_reorganize_navy_repair_rivne.1.desc: "Debido al estado de curación del LST 'Rivne', tenemos que tomar una decisión sobre cómo proceder con la reparación y mantenimiento de este barco.\nPodemos invertir más dinero y repararlo completamente a su forma original de LST o simplemente centrarse en los sistemas más críticos para hacerlo operativo como un barco de transporte de apoyo."
 ukraine_reorganize_navy_repair_rivne.1.a: "Reparación como LST"
 ukraine_reorganize_navy_repair_rivne.1.b: "Reparación como nave de apoyo"
 ukraine_reorganize_navy_repair_rivne.2.name: "Reparación de 'Rivne' como LST está terminado"
 ukraine_reorganize_navy_repair_rivne.2.desc: "Como hemos seleccionado para reparar 'Rivne' como un barco de aterrizaje de gran potencia, hemos completado todas las reparaciones necesarias y mantenimiento y ahora está listo para el servicio activo."
 ukraine_reorganize_navy_repair_rivne.2.a: "¡Genial!"
 ukraine_reorganize_navy_repair_rivne.3.name: "Reparación de 'Rivne' como barco de apoyo está terminado"
 ukraine_reorganize_navy_repair_rivne.3.desc: "Como hemos seleccionado para reparar 'Rivne' como un buque de apoyo, hemos completado todas las reparaciones necesarias y mantenimiento y ahora está listo para el servicio activo."
 ukraine_reorganize_navy_repair_rivne.3.a: "¡Genial!"
 ukraine_reorganize_navy_repair_support_ships.1.name: "Reparación de naves de soporte - Seleccione la manera de proceder"
 ukraine_reorganize_navy_repair_support_ships.1.desc: "Debido al estatus riguroso de nuestros buques de apoyo, tenemos que tomar una decisión sobre cómo proceder con la reparación y mantenimiento de estos barcos.\nPodemos invertir más dinero y reparar a los 4 o priorizar sobre la base de su importancia y fondos disponibles."
 ukraine_reorganize_navy_repair_support_ships.1.a: "Los necesitamos a todos"
 ukraine_reorganize_navy_repair_support_ships.1.b: "1 Soporte y 1 Reparación"
 ukraine_reorganize_navy_repair_support_ships.1.c: "Sólo podemos pagar 1"
 ukraine_reorganize_navy_repair_support_ships.2.name: "Reparación de buques de apoyo - Todos los 4 barcos serán reparados"
 ukraine_reorganize_navy_repair_support_ships.2.desc: "Como hemos tomado la decisión de reparar los 4 buques de apoyo, es hora de seleccionar una manera preferible para proceder con él.\nPodemos proporcionar a todos los barcos con muelles dedicados, que actualmente están disponibles a disposición del gobierno, y repararlos sin invertir mucho fondos o podemos invertir más dinero y repararlos más rápido utilizando patios privados adicionales."
 ukraine_reorganize_navy_repair_support_ships.2.a: "Usar sólo los muelles del gobierno"
 ukraine_reorganize_navy_repair_support_ships.2.b: "Pagar por patios privados"
 ukraine_reorganize_navy_repair_support_ships.3.name: "Reparación de buques de apoyo - 1 Soporte y 1 barco de reparación se reparará"
 ukraine_reorganize_navy_repair_support_ships.3.desc: "Como hemos tomado la decisión de reparar 1 barco de apoyo y 1 nave de reparación, es hora de seleccionar una manera preferible para proceder con él.\nPodemos proporcionar a ambos barcos con muelles dedicados, que actualmente están disponibles a disposición del gobierno, y repararlos sin invertir mucho fondos o podemos invertir más dinero y repararlos más rápido utilizando patios privados adicionales."
 ukraine_reorganize_navy_repair_support_ships.3.a: "Usar sólo los muelles del gobierno"
 ukraine_reorganize_navy_repair_support_ships.3.b: "Pagar por patios privados"
 ukraine_reorganize_navy_repair_support_ships.4.name: "Reparación de buques de apoyo - Sólo 1 nave será reparada"
 ukraine_reorganize_navy_repair_support_ships.4.desc: "Como hemos tomado la decisión de reparar sólo 1 nave de apoyo, es hora de seleccionar una manera preferible para proceder con ella.\nPodemos proporcionar el barco con muelle dedicado, que está actualmente disponible a disposición del gobierno, y repararlo sin invertir mucho fondos o podemos invertir más dinero y repararlo más rápido utilizando patio privado adicional."
 ukraine_reorganize_navy_repair_support_ships.4.a: "Usar sólo muelles del gobierno"
 ukraine_reorganize_navy_repair_support_ships.4.b: "Pagar por patio privado"
 ukraine_reorganize_navy_repair_support_ships.5.name: "Reparación de naves de apoyo - Las 4 naves son reparadas"
 ukraine_reorganize_navy_repair_support_ships.5.desc: "Como hemos completado la reparación de los 4 buques de soporte, ahora están listos para el servicio activo y pueden proporcionar el apoyo necesario a nuestra flota."
 ukraine_reorganize_navy_repair_support_ships.5.a: "¡Genial!"
 ukraine_reorganize_navy_repair_support_ships.6.name: "Reparación de buques de apoyo - 1 Soporte y 1 nave de reparación se reparan"
 ukraine_reorganize_navy_repair_support_ships.6.desc: "Como hemos completado la reparación de 1 nave de apoyo y 1 barco de reparación, ahora están listos para el servicio activo y pueden proporcionar el apoyo necesario a nuestra flota."
 ukraine_reorganize_navy_repair_support_ships.6.a: "¡Genial!"
 ukraine_reorganize_navy_repair_support_ships.7.name: "Reparación de naves de apoyo - Sólo 1 barco es reparado"
 ukraine_reorganize_navy_repair_support_ships.7.desc: "Como hemos completado la reparación de sólo 1 nave de soporte, ahora está listo para el servicio activo y puede proporcionar el apoyo necesario a nuestra flota."
 ukraine_reorganize_navy_repair_support_ships.7.a: "¡Genial!"
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.name: "Simferopol - Un casco en la zapatilla Rybalskyi"
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.desc: "El patio ha establecido 347 de estos desde 1971 y conoce los dibujos por el corazón. Hay un 502EM sin terminar en los caminos ahora mismo - un barco de pesca, pero un barco de pesca con el desplazamiento, la gama y la resistencia que necesitamos.\n\nLa alternativa es poner una quilla fresca a los mismos dibujos de 502EM en lugar de terminar una abandonada. El patio estaría encantado. El Ministerio de Finanzas no lo haría."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.a: "Convertir el casco de arrastre."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.b: "Ponga una quilla fresca a los mismos dibujos."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.c: "La Marina tiene necesidades más urgentes."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.name: "Simferopol - Lo que ella escucha"
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.desc: "El casco es la parte barata. La nave es sus antenas, y la pregunta es cuáles son las antenas.\n\nNuestros propios institutos pueden construir el complejo pasivo - reconocimiento radiotécnico a través de varias bandas, clasificación, localización de direcciones. Tardará más tiempo y será nuestro. Un paquete ELINT occidental llegaría integrado, probado y caro, y vendría con cadenas."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.a: "Confíe en un complejo doméstico."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.b: "Comprar un paquete Western ELINT."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.name: "Simferopol - abajo el Dnipro"
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.desc: "Ella va por los caminos en Rybalskyi. Ahora la parte incómoda: el patio está en Kiev, la flota está en el Mar Negro, y entre ellos hay seiscientos kilómetros de río con puentes sobre él.\n\nLa respuesta segura es un muelle flotante todo el camino hacia Kherson y fuera. La respuesta barata es derribarla en su propio fondo y esperar que la traída y las autorizaciones del aire funcionen."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.a: "Muévela en un muelle flotante."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.b: "Llévala por su propio casco."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.name: "Simferopol - Aterrizaje en el Dnipro"
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.desc: "Está atrapada debajo de Kherson con daño a su equipo de correr y un equipo de entrega muy avergonzado. El patio dice que se puede poner bien. El patio siempre dice eso."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.a: "Paga por las reparaciones."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.b: "Déjala en Kherson."
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.name: "Simferopol - transferencia terminada"
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.desc: "Finalmente hemos movido nuestro nuevo barco de reconocimiento por el río Dnipro con éxito - sin ningún accidente! Ahora podemos empezar el entrenamiento de la tripulación, y después de eso - finalmente podemos utilizar este valioso activo naval a nuestro beneficio."
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.a: "¡Por fin!"
 UKR_lahuna_program_over: "Hemos terminado la construcción de Simferopol barco de reconocimiento"
 UKR_modernize_sov_category: "Modernizar el equipo heredado soviético"
 UKR_modernize_sov_category_desc: "Podemos invertir tiempo y recursos en investigación, pruebas e implementación de actualizaciones modernas para nuestro equipo de la era soviética. Mediante la mejora de los diseños existentes con tecnologías modernas, podemos ampliar su vida útil y mejorar sus capacidades de combate. Estos programas nos permiten aprovechar al máximo el vasto arsenal heredado de la Unión Soviética y adaptarlo gradualmente a las exigencias de la guerra moderna."
 UKR_develop_domestic_category: "Desarrollar sistemas de armas nacionales"
 UKR_develop_domestic_category_desc: "Podemos invertir tiempo y recursos en investigar y desarrollar nuestros propios sistemas de armas modernos. Basándonos en la experiencia de ingeniería y las tradiciones industriales de Ucrania, podemos crear equipos adaptados a las necesidades de nuestras fuerzas armadas. Construir una industria de defensa nacional fortalecerá nuestras capacidades militares y reducirá nuestra dependencia con proveedores extranjeros."
 UKR_modernize_bmp1u: "Develop §YBMP-1U 'Shkval'§!"
 UKR_modernize_bmp1u_desc: "La Sede Estatal Científica y Técnica de Artillería y Armas Ligeras de Kiev desarrolló una mejora ucraniana limitada del BMP-1.\nLa torreta original se reemplazó por la nueva estación de armas remota (RWS) KBA-105 Shkval, desarrollada para vehículos blindados ligeros con el fin de aumentar su eficacia de combate."
 UKR_modernize_bmp1m: "Develop §YBMP-1M§!"
 UKR_modernize_bmp1m_desc: "Evolucionado a partir del BMP-1U, presentado en 2011.\nLa diferencia principal es la aplicación de la estación de armas remota mejorada KBA-105TB Shkval-A, en la que los lanzadores de ATGM Konkurs se reemplazaron por el ATGM ucraniano de largo alcance Barrier, y usa un nuevo sistema de puntería Tandem-2 y un sistema mejorado de estabilización de armas SWU-500-3C."
 UKR_modernize_bmp1um: "Develop §YBMP-1UM§!"
 UKR_modernize_bmp1um_desc: "Una mejora más completa del BMP-1 estándar emprendida por la Planta Blindada de Zhytomyr y mostrada públicamente en 2015.\nEl motor UTD-20 de 300 hp se reemplazó por un motor diésel 3TD-2 de 3 cilindros y dos tiempos de 400 hp, y la disposición del compartimiento de tropas se mejoró elevando el techo del casco 15 cm, y las pequeñas puertas de salida poco ergonómicas de la parte trasera del BMP-1 se reemplazaron por una gran rampa, aunque de accionamiento manual."
 UKR_modernize_bmp1umd: "Develop §YBMP-1UMD§!"
 UKR_modernize_bmp1umd_desc: "Un nuevo desarrollo del BMP-1UM de la Planta Blindada de Zhytomyr, presentado en 2016 en la exposición «Armas y Seguridad».\nEsta variante tiene una nueva estación de armas remota y un motor; está impulsada por un turbodiésel Deutz TCD2013 L64V de 6 cilindros de control electrónico que produce 330 hp y es más confiable, silencioso y eficiente que el UTD-20 y el 3TD-2."
 UKR_modernize_bmp1ts: "Develop §YBMP-1TS§!"
 UKR_modernize_bmp1ts_desc: "El BMP-1TS es una variante de mejora ucraniana desarrollada por NVK Techimpex, que trabaja desde 2018 en una estación de armas remota para el BMP-1 llamada Spys.\nEl módulo Spys recibió el sistema de control de tiro Syntez, formado por el complejo de puntería Kazhan-3K15 con cámaras de TV térmicas y ópticas y un telémetro láser."
 UKR_modernize_bmp_m1s: "Develop §YBMP-M1S§!"
 UKR_modernize_bmp_m1s_desc: "El BMP-M1S es un vehículo blindado de combate sobre orugas desarrollado con el capital de trabajo propio de la Planta Blindada de Zhytomyr, parte del Grupo de Empresas Ukroboronprom.\nEl nuevo producto se presentó en la exposición «Armas y Seguridad 2018» en Kiev.\nEl BMP-M1S es una conversión con un aumento significativo de potencia de fuego y nivel de protección y con el reemplazo de un motor soviético obsoleto por uno alemán Deutz.\nGracias a ello, el BMP-M1S puede transportar hasta 8 militares y apoyar eficazmente las acciones de las unidades de infantería gracias a la gran potencia de fuego del módulo de combate «Stylet»."
 UKR_modernize_bmp1m_praktyka: "Develop §YBMP-1M 'Praktyka'§!"
 UKR_modernize_bmp1m_praktyka_desc: "El fabricante ucraniano NVO Praktyka demostró el vehículo blindado BMP-1M en 2021.\nEl BMP-1 actualizado está equipado con equipo moderno en lugar de las dos puertas-tanks habituales del compartimento de aterrizaje.\nTambién es notable que la altura del cuerpo del vehículo de combate se ha incrementado ligeramente.\nEl BMP modernizado también difiere del modelo soviético en presencia del módulo de combate mejorado 'Spys-Syntez', desarrollado y fabricado por la empresa NVK Techimpex."
 UKR_modernize_bmp1u_flag: "Decisión completa §YDevelop BMP-1U§!"
 UKR_modernize_bmp1m_flag: "Decisión completa §YDevelop BMP-1M§!"
 UKR_modernize_bmp1um_flag: "Decisión completa §YDevelop BMP-1UM§!"
 UKR_modernize_bmp1umd_flag: "Decisión completa §YDevelop BMP-1UMD§!"
 UKR_modernize_mt_lbr6: "Develop §YMT-LBR6§!"
 UKR_modernize_mt_lbr6_desc: "El MT-LBR6 es un IFV ligero sobre el chasis del MT-LB con el módulo de combate ZTM-1.\nArmamento: cañón automático ZTM-1 de 30 mm, ametralladora CT de 7,62 mm, lanzagranadas de humo del sistema 902B «Tucha».\nLa protección de la tripulación se refuerza con redundancia espaciada y forro de Kevlar; el tren de rodaje se cubre con pantallas anti-acumulativas.\nFabricante: Planta de Tractores de Járkov."
 UKR_modernize_mt_lbmsh: "Desarrollar §YMT-LBMSh§!"
 UKR_modernize_mt_lbmsh_desc: "El MT-LBMSh es un IFV ligero sobre el chasis del MT-LB con el módulo de combate «Shkval».\nArmamento: cañón automático ZTM-1 de 30 mm, ametralladora KT-7,62 de 7,62 mm acoplada, dos misiles guiados antitanque Barrier, lanzagranadas automático de 30 mm y lanzagranadas de humo.\nDesde 2006 se produce en la KMDB."
 UKR_modernize_mt_lbr7: "Develop §YMT-LBR7§!"
 UKR_modernize_mt_lbr7_desc: "El MT-LBR7 es un IFV ligero sobre el chasis del MT-LB con el módulo de combate «Shturm».\nArmamento: cañón automático ZTM-1 de 30 mm, ametralladora KT-7,62 de 7,62 mm acoplada, dos lanzadores de misiles ATGM 9M114M «Konkurs-M», lanzagranadas automático de 30 mm y lanzagranadas de humo.\nLa protección de la tripulación se refuerza con redundancia espaciada y forro de Kevlar; el tren de rodaje se cubre con pantallas anti-acumulativas.\nFabricante: Planta de Tractores de Járkov."
 UKR_modernize_mt_lb_at: "Desarrollar §YMT-LB-AT§!"
 UKR_modernize_mt_lb_at_desc: "El MT-LB-AT es una opción de modificación del MT-LB, equipada con una plataforma giratoria con protección blindada y armada con una ametralladora DShKM de 12,7 mm."
 UKR_modernize_mt_lb_t_23_2: "Develop §YMT-LB-T-23-2§!"
 UKR_modernize_mt_lb_t_23_2_desc: "El MT-LB-T-23-2 es una opción de modernización del MT-LB desarrollada por NVK Techimpex.\nEstá equipado con un escudo blindado y una nueva mira, y usa un ZU-23-2 como armamento principal.\nUna muestra de demostración se presentó el 21 de septiembre de 2015 en la exposición «Armas y Seguridad»."
 UKR_modernize_mt_lbr6_flag: "Decisión completa §YDevelop MT-LBR6§!"
 UKR_modernize_mt_lbr7_flag: "Decisión completa §YDevelop MT-LBR7§!"
 UKR_modernize_mt_lbrmsh_flag: "Decisión completa §YDevelop MT-LBMSh§!"
 UKR_modernize_brdm_2ld: "Develop §YBRDM-2LD§!"
 UKR_modernize_brdm_2ld_desc: "El BRDM-2LD es una modernización ucraniana del BRDM-2 (con escotillas laterales de desembarco y motor diésel SMD-21-08 de fabricación ucraniana).\nEl desarrollo del vehículo blindado se inició en el programa de I+D Bulb en 1999 por especialistas de la Oficina de Diseño de Ingeniería Mecánica de Járkov O. O. Morozov; el trabajo de modernización del BRDM-2 al nivel BRDM-2LD lo realizó la Planta Mecánica de Reparaciones de Mykolayiv.\nDurante las pruebas de campo se comprobó que instalar un motor diésel permitía aumentar la capacidad todoterreno del vehículo blindado en condiciones de camino difíciles y aumentar un 25% la autonomía en carretera (de 750 a 1000 km) por una reducción significativa del consumo de combustible."
 UKR_modernize_brdm_2m: "Develop §YBRDM-2M§!"
 UKR_modernize_brdm_2m_desc: "El BRDM-2M es una modernización ucraniana del BRDM-2. Igual que el BRDM-2LD, pero con motor de gasolina estándar.\nAsí, los cambios afectaron sobre todo a la presencia de escotillas laterales de desembarco.\nProducido por la Planta Mecánica de Reparaciones de Mykolayiv."
 UKR_modernize_brdm_2dp: "Develop §YBRDM-2DP§!"
 UKR_modernize_brdm_2dp_desc: "El BRDM-2DP es una modernización ucraniana del BRDM-2. Una modificación más ligera, equipada con motor diésel, producida por Zavod Mayak, Kiev.\nArmamento: ametralladora DShKM de 12,7 mm en proa y 2 ametralladoras laterales SGMB de 7,62 mm.\nAdemás, el vehículo está equipado con puertas laterales para el desembarco, redes anti-acumulativas desmontables y un dispositivo para superar trincheras y zanjas."
 UKR_modernize_brdm_2vepr: "Develop §YBRDM-2 'Vepr'§!"
 UKR_modernize_brdm_2vepr_desc: "El BRDM-2 «Vepr» es una modernización ucraniana del BRDM-2 propuesta por la empresa VEPR.\nSe mejoró la visibilidad acristalando la cabina con vidrio blindado.\nEl fondo está blindado. Se retiraron las ruedas laterales.\nEn su lugar se instalaron puertas de perfil completo para el desembarco de tropas.\nSe reforzó el armamento. Además del armamento estándar se añadió una ametralladora de popa; el puesto del ametrallador se equipó en lugar de la unidad de propulsión a chorro desmontada.\nEn la proa se prevé la instalación de un lanzagranadas automático de rumbo.\nSe modificó el equipo de iluminación para circular por vías públicas."
 UKR_modernize_brdm_2l1: "Develop §YBRDM-2L1§!"
 UKR_modernize_brdm_2l1_desc: "El BRDM-2L1 es una modernización ucraniana del BRDM-2 propuesta por la Planta Mecánica de Reparaciones de Mykolayiv.\nEl vehículo recibió escotillas del tipo BRDM-2LD y BRDM-2M y troneras para disparar, se instaló una moderna radio de fabricación ucraniana y se usaron nuevos neumáticos sin cámara de presión regulable."
 UKR_modernize_brdm_2di: "Develop §YBRDM-2DI 'Khazar'§!"
 UKR_modernize_brdm_2di_desc: "El BRDM-2DI «Khazar» es un vehículo ucraniano de reconocimiento y vigilancia de combate producido por la Planta Mecánica de Reparaciones de Mykolayiv sobre la base del BRDM-2.\nEl desarrollo del vehículo blindado se inició teniendo en cuenta la experiencia obtenida en 2003-2005 por el contingente militar ucraniano en Irak.\nEl vehículo blindado está equipado con un motor diésel FPT IVECO Tector (Euro-3) de 138 hp con calefactor de prearranque, un termovisor, un sistema de videovigilancia y un nuevo conjunto de armas.\nAdemás, se hizo una escotilla adicional para el desembarco de tropas en el casco de la máquina."
 UKR_modernize_brdm_2t1: "Desarrollar el §YBRDM-2T mod. 2012§!"
 UKR_modernize_brdm_2t1_desc: "El BRDM-2T mod. 2012 es una modernización ucraniana del BRDM-2 desarrollada por NVK Techimpex.\nEn la versión propuesta en 2012, la diferencia principal fue el reemplazo del motor: en lugar del motor de gasolina GAZ-41 estándar, se instaló un motor diésel en línea de 4 cilindros D245.30E2 (lo que permitió reducir el riesgo de incendio y reducir algo el consumo de combustible), y el vehículo blindado también pasó por una revisión general."
 UKR_modernize_brdm_2t2: "Desarrollar el §YBRDM-2T mod. 2013§!"
 UKR_modernize_brdm_2t2_desc: "El BRDM-2T mod. 2013 es una modernización ucraniana del BRDM-2 desarrollada por NVK Techimpex.\nEn 2013 se presentó una nueva versión de la modernización del BRDM-2: además de instalar el motor D245.30E2, se instalaron en el vehículo blindado la radio R-173, luces de posición delanteras y traseras del BTR-70 y nuevas ruedas con neumáticos sin cámara.\nSe desmontaron las ruedas adicionales, lo que permitió instalar escotillas laterales trapezoidales de desembarco (similares a las del BTR-70).\nSe desmontó la torreta y se instalaron como armamento una ametralladora NSVT de 12,7 mm y una ametralladora PKT de 7,62 mm."
 UKR_modernize_brdm_2t3: "Desarrollar el §YBRDM-2T mod. 2015§!"
 UKR_modernize_brdm_2t3_desc: "El BRDM-2T mod. 2015 es una modernización ucraniana del BRDM-2 desarrollada por NVK Techimpex.\nEn 2015 se presentó otro vehículo: con la torreta estándar del BRDM-2, escotillas laterales rectangulares del tipo BRDM-2LD, una nueva caja de cambios de cinco velocidades, neumáticos sin cámara R20 producidos por la empresa ucraniana Rosava, una nueva radio Motorola DM-4601 y la posibilidad de instalar desde el interior del casco una protección antifragmentación adicional hecha de al menos cinco capas de tejido balístico tipo Kevlar."
 UKR_modernize_brdm_2i: "Develop §YBRDM-2I§!"
 UKR_modernize_brdm_2i_desc: "El BRDM-2I es una modernización ucraniana del BRDM-2 propuesta por la 45.ª Planta Mecánica Experimental de Vinnytsia.\nEl motor de gasolina estándar se reemplazó por un motor diésel ISUZU de bajo ruido de 156 hp.\nLa instalación de chorro de agua y las ruedas antitrinchera se conservaron en la modernización.\nAdemás, se instaló un sistema electrónico centralizado de inflado de neumáticos de fabricación ucraniana.\nArmamento: ametralladora KPVT de 14,5 mm, ametralladora PKT de 7,62 mm, lanzagranadas AGS-17, ATGM Barrier."
 UKR_modernize_bkm_hekkon: "Desarrollar §YBKM 'Hekkon'§!"
 UKR_modernize_bkm_hekkon_desc: "El BKM «Hekkon» es una de las opciones ucranianas para modernizar el vehículo blindado soviético BRDM-2.\nEl vehículo blindado se desarrolló en 2016 por iniciativa de especialistas del grupo de ingeniería «Azov» (que luego tomó el nombre de grupo de ingeniería «Arey») y se construyó con fondos extrapresupuestarios en los talleres de la fábrica cerrada de Kiev «ATEK».\nEl motor de gasolina GAZ-41 estándar y la transmisión mecánica se reemplazaron por un nuevo motor diésel «General Motors» de 215 hp con transmisión hidrostática; en los costados se hicieron dos troneras para disparar armas ligeras y dos puertas laterales.\nSe reforzó la protección blindada. El total de tripulación y tropa de desembarco del vehículo blindado es de 9 personas.\nEl modelo de demostración se equipó con una torre modificada del BRDM-2, en la que se instalan una ametralladora NSVT de 12,7 mm, una ametralladora PKT de 7,62 mm y cuatro lanzagranadas de humo de 81 mm."
 UKR_modernize_brm_manhust: "Desarrollar §YBRM 'Manhust'§!"
 UKR_modernize_brm_manhust_desc: "El BRM «Manhust» es una modificación ucraniana del BRDM-2 de la Planta Blindada de Mykolaiv.\nTodos los componentes, salvo el motor, son de producción ucraniana.\nEl vehículo está equipado con escotillas laterales, superiores y traseras adicionales, que permiten el desembarco sin obstáculos de las tropas.\nEl aumento de la protección frontal y la instalación de placas de blindaje adicionales garantizan la seguridad de la tripulación.\nLa nueva máquina recibió un volumen interior bastante mayor que el del BRDM-2 básico y un módulo de combate robótico, que ahora lleva una ametralladora de gran calibre de 14,5 mm y una ametralladora de 7,62 mm."
 UKR_modernize_brdm_2ld_flag: "Decisión completa §YDevelop BRDM-2LD§!"
 UKR_modernize_brdm_2m_flag: "Decisión completa §YDevelop BRDM-2M§!"
 UKR_modernize_brdm_2di_flag: "Decisión completa §YDevelop BRDM-2DI 'Khazar'§!"
 UKR_modernize_brdm_2t1_flag: "Decisión completa §YDevelop BRDM-2T zr. 2012§!"
 UKR_modernize_brdm_2t2_flag: "Decisión completa §YDevelop BRDM-2T zr. 2013§!"
 UKR_modernize_bkm_hekkon_flag: "Decisión completa §YDevelop BKM 'Hekkon'§!"
 UKR_modernize_brm_manhust_flag: "Decisión completa §YDevelop BRM 'Manhust'§!"
 UKR_modernize_btr_60m: "Desarrollar el programa de modernización §YBTR-60M§!"
 UKR_modernize_btr_60m_desc: "§YBTR-60M§! es una modificación ucraniana del §YBTR-60PB§!, desarrollada por KMDB.\nSe instala un motor diesel UTD-20 (300 hp).\nMykolayiv Blindajeed Plant produjo un prototipo."
 UKR_modernize_btr_60m_choose_module: "Elija el arma primaria para\nmodernizado §YBTR-60M§! APC"
 UKR_modernize_btr_60m_choose_module_desc: "Podemos tomar una decisión sobre qué armamento principal exacto será utilizado por nuestro modernizado §YBTR-60M§! APC"
 UKR_modernize_btr_60mk: "Desarrollar el programa de modernización §YBTR-60MK§!"
 UKR_modernize_btr_60mk_desc: "El BTR-60MK es una modificación ucraniana del BTR-60PB propuesta por la empresa KORT.\nEl vehículo está equipado con dos motores diésel Cummins, blindaje adicional montado y escotillas laterales de desembarco ampliadas.\nSe conservó el armamento, pero se anunció la posibilidad de reemplazar la torreta por un módulo de combate producido por la Planta Blindada de Mykolayiv, de 1000 kg (armado con una ametralladora de 14,5 mm, una ametralladora de 7,62 mm y un lanzagranadas automático AGS-17 de 30 mm)."
 UKR_modernize_btr_60pb_t: "Develop §YBTR-60PB-T§!"
 UKR_modernize_btr_60pb_t_desc: "El BTR-60PB-T es una modificación ucraniana del BTR-60PB desarrollada por NVK Techimpex.\nAlcance de la modernización: instalación del módulo de combate BM-23-2, reemplazo de los motores de gasolina por motores diésel, mejora de los sistemas de refrigeración del motor, mejora de la transmisión del chorro de agua e instalación de nuevo equipo eléctrico."
 UKR_modernize_otaman_8x8: "Develop §Y'Otaman' 8x8§!"
 UKR_modernize_otaman_8x8_desc: "El «Otaman» 8x8 es una nueva plataforma de combate moderna desarrollada por NVO Praktyka.\nLa plataforma se creó mediante una modernización profunda del chasis del BTR-60/70: un nuevo casco blindado con motor delantero y un reemplazo completo del motor y la transmisión.\nLa nueva versión de la modernización del BTR-60 se centra en la movilidad y la potencia de fuego.\nEl nuevo casco está hecho de acero moderno y probado según diversas normas internacionales, con un nivel de protección balística proyectado STANAG 4569 nivel II.\nPara aumentar la protección, también puede equiparse con blindaje cerámico articulado.\nLa nueva versión del vehículo se equipó con el módulo de combate «Sturm-M», que se instala en el BTR-3."
 UKR_modernize_btr_60m_khorunzhyi: "Develop §YBTR-60M 'Khorunzhyi'§!"
 UKR_modernize_btr_60m_khorunzhyi_desc: "El BTR-60M Khorunzhy es un transporte blindado de personal de NVO Praktyka, una modernización profunda del BTR-60PB.\nEl transporte blindado está diseñado como una plataforma de ruedas sobre la que puede crearse una familia de vehículos blindados especializados.\nEl casco está hecho de acero de blindaje moderno y tiene un alto nivel de protección blindada. Esto permitió aumentar el nivel de resistencia a las balas de las partes superior y lateral del casco al nivel CCSA-4 (protección contra un disparo de calibre 7,62 desde 10 metros).\nEl APC tiene una distribución moderna de compartimentos, con la sala del motor en la parte delantera derecha, el puesto del conductor en la delantera izquierda y un compartimento de desembarco más espacioso en la parte trasera del casco."
 UKR_modernize_btr_60m_flag: " Decisión completa §YDevelop BTR-60M§!"
 UKR_modernize_otaman_8x8_flag: " Decisión completa §YDevelop 'Otaman' 8x8§!"
 UKR_modernize_btr_70m: "Develop §YBTR-70M§!"
 UKR_modernize_btr_70m_desc: "El BTR-70M es una modificación ucraniana del BTR-70.\nLa modernización la realizó la Oficina de Diseño de Járkov O. O. Morozov en el marco del encargo estatal de defensa para el equipamiento de las unidades de mantenimiento de la paz de las fuerzas armadas de Ucrania.\nEn lugar de dos motores de gasolina se instala un motor diésel multicombustible UTD-20 del BMP-1.\nArmamento: ametralladora de gran calibre KPVT de 14,5 mm y ametralladora gemela PKT de 7,62 mm. Las escotillas laterales son del tipo BTR-80."
 UKR_modernize_btr_70m_kba2: "Develop §YBTR-70M-KBA-2§!"
 UKR_modernize_btr_70m_kba2_desc: "El BTR-70M-KBA-2 es una modificación ucraniana del BTR-70.\nLa modernización la realizó la Oficina de Diseño de Járkov O. O. Morozov.\nSe desmontó la torreta del BTR-70 y en su lugar se instaló un módulo de combate con un cañón automático KBA-2 de 30 mm y un dispositivo para disparar granadas de humo (como resultado, la altura de la máquina aumentó a 2765 mm).\nLas escotillas laterales son del tipo BTR-80."
 UKR_modernize_btr_70m_hrim: "Develop §YBTR-70M 'Hrim'§!"
 UKR_modernize_btr_70m_hrim_desc: "El BTR-70M «Hrim» es una modificación ucraniana del BTR-70.\nLa modernización la realizó la Oficina de Diseño de Járkov O. O. Morozov.\nEn lugar de la torreta estándar se instala el módulo de combate BM-1B «Hrim» (cañón automático de 30 mm, ametralladora de 7,62 mm, lanzagranadas automático AG-17 de 30 mm y sistema antitanque Barrier con una dotación de munición de 4 ATGM).\nLas escotillas laterales son del tipo BTR-80."
 UKR_modernize_btr_7: "Develop §YBTR-7 'Zakhysnyk'§!"
 UKR_modernize_btr_7_desc: "El BTR-7 «Zakhysnyk» es una modificación ucraniana del BTR-70.\nLa modernización la realiza la Planta Blindada de Mykolayiv.\nTiene 2 motores FPT Iveco Tector (del camión Iveco EuroCargo) P4 (Euro III) de 150 hp cada uno.\nEl transporte blindado de personal está equipado con una unidad de combate BUG, estabilizada en dos planos, cuyo armamento básico consiste en: ametralladora KPVT de 14,5 mm (500 disparos); ametralladora PKT de 7,62 mm (1500 cartuchos); lanzagranadas automático AGS-17 de 30 mm (87 disparos); dos ATGM Barrier de 130 mm (4 ATGM)."
 UKR_modernize_btr_70t: "Develop §YBTR-70T§!"
 UKR_modernize_btr_70t_desc: "El BTR-70T es una modernización ucraniana del BTR-70 de NVK Techimpex.\nSe instalaron nuevas escotillas laterales de desembarco, como las del BTR-80, la radio R-173, dos nuevos motores diésel D245.30E2 con una potencia total de 312 hp, luces de posición delanteras y traseras del BTR-80 y nuevas ruedas con neumáticos sin cámara.\nTambién es posible instalar otros módulos de combate."
 UKR_modernize_varan: "Desarrollar §Y'Varan'§!"
 UKR_modernize_varan_desc: "Varan es un portador de personal blindado ucraniano, una modernización radical del BTR-70.\nDesarrollado por NVK Techimpex.\nEl Varan recibió un casco blindado recientemente diseñado, así como un cambio significativo en el diseño, el motor se encuentra en la parte delantera, y un equipo de aterrizaje apareció en la popa.\nComo resultado del cambio de diseño, el compartimento de aterrizaje recibió un 35% más útil de volumen interno, y también fue posible embarcar y desembarcar soldados a través de un aparato plegable en la parte trasera.\nArmado con el módulo de combate Spys, que está equipado con una pistola 2A72 tipo 30 mm (ZTM-1 o KBA-1) con 300 proyectiles, un lanzagranadas automático de 30 mm KBA-117 (AGS-17) con 125 granadas, 7,62 mm KT-7,62 ametralladora y un complejo de armas guiado 'Baryer' con dos misiles."
 UKR_modernize_btr_70m_flag: "Decisión completa §YDevelop BTR-70M§!"
 UKR_modernize_btr_70m_kba2_flag: "Decisión completa §YDevelop BTR-70M-KBA-2§!"
 UKR_modernize_btr_70m_hrim_flag: "Decisión completa §YDevelop BTR-70M 'Hrim'§!"
 UKR_modernize_btr_70t_flag: "Decisión completa §YDevelop BTR-70T§!"
 UKR_modernize_btr_80_kba2: "Develop §YBTR-80-KBA-2§!"
 UKR_modernize_btr_80_kba2_desc: "El BTR-80-KBA-2 es una modificación ucraniana del BTR-80.\nLa modernización la realizó la Oficina de Diseño de Járkov O. O. Morozov.\nSe instala un motor diésel UTD-20 de fabricación ucraniana.\nEn lugar de una ametralladora KPVT de 14,5 mm se instaló un cañón KBA-2 de 30 mm.\nAutonomía un 25% mayor con la misma cantidad de combustible por una reducción significativa del consumo.\nMayor capacidad todoterreno del vehículo en condiciones de camino difíciles por el mayor par del motor.\nLa instalación del cañón KBA-2 de calibre 30 mm permite aumentar el alcance y la eficacia del tiro."
 UKR_modernize_btr_80m_hrim: "Develop §YBTR-80M 'Hrim'§!"
 UKR_modernize_btr_80m_hrim_desc: "El BTR-80M «Hrim» es una modificación ucraniana del BTR-80.\nLa modernización la realizó la Oficina de Diseño de Járkov O. O. Morozov.\nEn lugar de la torreta estándar se instala el módulo de combate BM-1B «Hrim» (cañón automático de 30 mm, ametralladora de 7,62 mm, lanzagranadas automático AG-17 de 30 mm y sistema antitanque Barrier con una dotación de munición de 4 ATGM)."
 UKR_modernize_btr_80up: "Develop §YBTR-80UP§!"
 UKR_modernize_btr_80up_desc: "El BTR-80UP es un programa conjunto polaco-ucraniano de modernización del BTR-80 para participar en la licitación de Irak.\nProtección mejorada, nuevos motores diésel de 300 hp, nuevos neumáticos y nuevos sistemas eléctricos y neumáticos, y se retiró la instalación de chorro de agua.\nAdemás del transporte blindado de personal lineal, se desarrollaron 7 modificaciones especializadas."
 UKR_modernize_btr_80t: "Develop §YBTR-80T§!"
 UKR_modernize_btr_80t_desc: "El BTR-80T es una modernización ucraniana del BTR-80 de NVK Techimpex.\nEl motor de serie se reemplazó por uno turboalimentado más potente de 303 hp.\nLa caja de cambios es de 8 velocidades. La autonomía se aumentó a 750 km.\nSe reemplazó el armamento por un nuevo módulo de combate BM-23-2."
 UKR_modernize_btr_80_kba2_flag: "Decisión completa §YDevelop BTR-80-KBA-2§!"
 UKR_modernize_btr_80m_hrim_flag: "Decisión completa §YDevelop BTR-80M 'Hrim'§!"
 UKR_modernize_t55_5tdf: "Develop §YT-55-5TDF§!"
 UKR_modernize_t55_5tdf_desc: "T-55-5TDF es una modernización ucraniana del tanque T-55.\nLa modernización fue llevada a cabo por el Kharkiv Design Bureau nombrado después de O. O. Morozov.\nEl tanque está equipado con un motor diesel de 5TDF con una capacidad de 700 hp, lo que le permite alcanzar una velocidad de 60 km/h en la carretera y 40 km/h en terreno áspero.\nEl tanque también está equipado con un nuevo sistema de control de incendios, que incluye un rangefinder láser, una computadora balística y una vista de imagen térmica.\nLa protección de la armadura se ha mejorado mediante la instalación de placas de armadura adicionales y una armadura reactiva explosiva."
 UKR_modernize_t55_5tdf_flag: "Decisión completa §YDevelop T-55-5TDF§!"
 UKR_modernize_t55agm: "Develop §YT-55AGM§!"
 UKR_modernize_t55agm_desc: "T-55AGM es una modernización ucraniana del tanque T-55.\nEl tanque está equipado con un motor diesel de 5TDF con una capacidad de 700 hp, lo que le permite alcanzar una velocidad de 60 km/h en la carretera y 40 km/h en terreno áspero.\nEl tanque también está equipado con un nuevo sistema de control de incendios, que incluye un rangefinder láser, una computadora balística y una vista de imagen térmica.\nLa protección de la armadura se ha mejorado instalando nizh armadura reactiva explosiva."
 UKR_modernize_t55agm_flag: "Decisión completa §YModernizar T-55AGM§!"
 UKR_modernize_t55m8_a2_tifon_ii: "Desarrollar el §YT-55M8-A2 Tifon 2§!"
 UKR_modernize_t55m8_a2_tifon_ii_desc: "T-55M8-A2 Tifon 2 es una modernización ucraniana del tanque T-55 para Perú.\nEl tanque está equipado con un motor diesel de 5TDF con una capacidad de 700 hp, lo que le permite alcanzar una velocidad de 60 km/h en la carretera y 40 km/h en terreno áspero.\nEl tanque también está equipado con un nuevo sistema de control de incendios, que incluye un rangefinder láser, una computadora balística y una vista de imagen térmica.\nLa protección de la armadura se ha mejorado instalando nizh armadura reactiva explosiva."
 UKR_develop_t64bm_bulat: "Develop §YT-64BM 'Bulat'§!"
 UKR_develop_t64bm_bulat_desc: "T-64BM 'Bulat' es una modernización ucraniana, llevando el T-64B al estándar del T-84.\nFitted with Nizh reactive armour, 9K120 Refleks missile (NATO code AT-11 Sniper), 1A45 Irtysh fire control, TKN-4S commander's sight, PZU-7 antiaéreo machine-gun sight, TPN-4E Buran-E night vision, 6TDF 1,000-hp (735 kW) engine.\nT-64BM 'Bulat' es la modernización más reciente de 2004."
 UKR_develop_t64e: "Develop §YT-64E§!"
 UKR_develop_t64e_desc: "El T-64E es un tanque de batalla principal experimental ucraniano que fue una profunda modernización del T-64.\nDesarrollado en KhBTRZ (Kharkiv Blindajeed Repair Plant).\nEn comparación con las modificaciones anteriores del T-64, el tanque modernizado ha mejorado significativamente la potencia de combate, movilidad y protección.\nEl costo del T-64E fue de alrededor de $1.12 millones por unidad a partir de 2011."
 UKR_develop_t64bv_1: "Develop §YT-64BV-1§!"
 UKR_develop_t64bv_1_desc: "T-64BV-1 (también conocido en los medios como T-64B1M/T-64BM1M) es una versión simplificada de la modernización de los tanques T-64B1 creados en 2014 y desarrollados en la planta Kharkiv Blindajeed.\nEl tanque ha incorporado la protección 'Nizh' ERA, que refuerza la protección de la torreta, la parte frontal del casco y el costado.\nEn la parte trasera de la torre se instala un nicho para municiones y equipo.\nUn motor 5TDF está instalado en el tanque.\nEs una opción simplificada y más barata para la modernización del 'Bulat'."
 UKR_develop_t64bv_2017: "Desarrollar el §YT-64BV mod. 2017§!"
 UKR_develop_t64bv_2017_desc: "El T-64BV zr. 2017 (o modelo 2017) es la modernización de la serie T-64 tanque, que pretende incluir nuevas imágenes térmicas para toda la tripulación, quitar Luna infrarrojo reflector, incluir TPN-1-TPV Ucrania noche vista en lugar de TPN1-49-23, 'Nizh' módulos de armadura reactiva diseñados para el reemplazo del perno en torretas T-64BV, SN-4215 unidad de navegación por satélite en red, y Lybid K-2RB radio digital (bajo licencia de Motorola) Proporcionar comunicaciones seguras con un rango de 70 km"
 UKR_develop_t64bv_2022: "Desarrollar el §YT-64BV mod. 2022§!"
 UKR_develop_t64bv_2022_desc: "El T-64BV zr. 2022 (o modelo 2022) es la última modernización de la serie T-64 tanques. El tanque tiene nuevas unidades de vigilancia y avistamiento de tercera generación y está equipado con una nueva ametralladora pesada Snipex Laska K-2 de 12.7mm.\nCuenta con nuevas estaciones de radio actualizadas y sistemas adicionales de navegación, comunicaciones internas y externas que cumplen plenamente las normas de la OTAN.\nLos tanques de combustible exterior están ahora también protegidos por placas de acero de 12 mm."
 UKR_develop_t64_krab: "Develop §YT-64 'Krab'§!"
 UKR_develop_t64_krab_desc: "T-64 'Krab' es trabajo de investigación y desarrollo en la modernización del tanque T-64B (T-64BV).\nEstudios de diseño son realizados por el Kharkiv Design Bureau of Mechanical Engineering nombrado después de Morozova.\nEl trabajo comenzó en 2016.\nSe preveía la instalación de un motor 6TD con una potencia de 1.200 CV en el T-64.\nPara instalar un motor más grande en dimensiones que el estándar, el cuerpo de la serie T-64 está cosido."
 UKR_develop_t_rex: "Desarrollar §Y'T-Rex'§!"
 UKR_develop_t_rex_desc: "El «T-Rex» es un tanque de batalla principal ucraniano anunciado en 2016 y desarrollado por Arey Engineering Group, un grupo de ingeniería del Batallón Azov.\nEl tanque se basaría en el T-64 y tendría una torreta no tripulada.\nLos tres tripulantes irían sentados en una cápsula blindada en la parte delantera del casco, desde donde podrían controlar a distancia el cañón, el cargador automático y las ametralladoras.\nEl T-Rex pesaría 39 toneladas y llevaría un cañón principal de 125 mm con «proyectiles de alta potencia».\nEl blindaje usaría blindaje reactivo explosivo «Nizh» y «Duplet».\nLa prensa ucraniana afirmó que su capacidad de combate superaba la de los ucranianos Oplot y Bulat, siendo a la vez más rentable que el Bulat."
 UKR_develop_t64bm2_bulat: "Develop §YT-64BM2 'Bulat'§!"
 UKR_develop_t64bm2_bulat_desc: "T-64BM2 (en los medios también se llama 'Bulat' o 'Kedr') es una modernización del tanque T-64 bajo el programa 'Kedr'.\nEs un demostrativo tecnológico, es decir, trabajo de investigación y desarrollo en la remotarización de tanques tipo T-64 con el motor 6TD-1, un rediseño completo del compartimento de motor y transmisión."
 UKR_develop_t64bm_bulat_flag: "Decisión completa §YDevelop T-64BM 'Bulat'§!"
 UKR_develop_t64e_flag: "Decisión completa §YDevelop T-64E§!"
 UKR_develop_t64bv_1_flag: "Decisión completa §YDevelop T-64BV-1§!"
 UKR_develop_t64bv_2017_flag: "Decisión completa §YDevelop T-64BV zr. 2017§!"
 UKR_develop_t64_krab_flag: "Decisión completa §YDevelop T-64 'Krab'§!"
 UKR_develop_t_rex_flag: "Decisión completa §YDevelop 'T-Rex'§!"
 UKR_develop_t64bm2_bulat_flag: "Decisión completa §YDevelop T-64BM2 'Bulat'§!"
 UKR_develop_t64_strazh: "Develop §YT-64 'Strazh'§!"
 UKR_develop_t72amt: "Develop §YT-72AMT§!"
 UKR_develop_btr3u: "Develop §YBTR-3U 'Myslyvets'§!"
 UKR_develop_btr3u_desc: "El BTR-3U «Myslyvets» (también conocido como BTR-3U «Guardian») es una modificación profunda del BTR-94K con un motor Deutz BF6M1015 de 326 hp y una transmisión automática Allison MD3066, o un motor UTD-20 de 300 hp.\nLa Oficina de Diseño de Járkov O. O. Morozov realizó el desarrollo de la documentación de diseño: el desarrollo del chasis y la integración de todos los sistemas y armas de la máquina.\nEl armamento incluye un módulo de combate KBA-105 «Shkval» con un cañón automático ZTM-1 de 30 mm, acoplada una ametralladora KT-7,62 de 7,62 mm, dos lanzadores de ATGM 9M114M «Konkurs-M» y un lanzagranadas automático de 30 mm.\nEstá equipado con el complejo de puntería 0TP-20, integrado con el sistema de control de tiro de misiles guiados y el estabilizador de armas de dos planos SVU-500."
 UKR_develop_btr3e: "Develop §YBTR-3E§!"
 UKR_develop_btr3e_desc: "El BTR-3E es una modificación con motor UTD-20 o Deutz BF6M1015.\nEquipado con el módulo de combate BM-3M «Sturm-M», cuyo armamento incluye un cañón automático ZTM-1 de 30 mm, una ametralladora KT-7.62 de 7,62 mm acoplada, dos lanzadores (6 cohetes) «Baryer» y un lanzagranadas automático KBA-117 de 30 mm."
 UKR_develop_btr3e1: "Develop §YBTR-3E1§!"
 UKR_develop_btr3e1_desc: "El BTR-3E1 es una modificación del BTR-3E hecha específicamente para satisfacer los requisitos del contrato tailandés de 2005-2006.\nLas características principales de esta versión frente al BTR-3E son: instalación del módulo de combate modernizado BM-3M «Shturm», reducción de la altura de 2928 mm a 2774 mm, aumento de la tripulación de combate de 9 a 13 personas, instalación de una radio VRC-950 y colocación de munición adicional para el módulo de combate."
 UKR_develop_btr3da: "Develop §YBTR-3DA§!"
 UKR_develop_btr3da_desc: "El BTR-3DA es un nuevo desarrollo del transporte blindado de personal que tiene en cuenta la experiencia de la guerra en el este de Ucrania.\nEl BTR-3DA es más rápido y maniobrable que sus predecesores, tiene mejor protección blindada para la tripulación y un módulo optoelectrónico con canales de televisión y de imagen térmica.\nGracias a ello se hizo posible disparar de noche.\nUna unidad de energía adicional permite controlar el módulo de combate sin usar la planta motriz principal."
 UKR_develop_btr3u_flag: "Decisión completa §YDevelop BTR-3U 'Myslyvets'§!"
 UKR_develop_btr3e_flag: "Decisión completa §YDevelop BTR-3E§!"
 UKR_develop_btr3e1_flag: "Decisión completa §YDevelop BTR-3E1§!"
 UKR_develop_btr3da_flag: "Decisión completa §YDevelop BTR-3DA§!"
 UKR_develop_btr3e1_cse90lp: "Develop §YBTR-3E1 CSE90LP§!"
 UKR_develop_btr3e1_cse90lp_desc: "El BTR-3E1 CSE90LP es una modificación del BTR-3E1 equipada con una torreta Cockerill CSE 90LP con un cañón de baja presión de 90 mm.\nLa torreta lleva una ametralladora coaxial de 7,62 mm y un lanzagranadas automático de 40 mm.\nLa torreta está equipada con un sistema automático de control de fuego que incluye un telémetro láser, un termovisor y un calculador balístico."
 UKR_develop_btr3e1_cpws30: "Develop §YBTR-3E CPWS-30§!"
 UKR_develop_btr3e1_cpws30_desc: "El BTR-3E CPWS-30 es una modificación del BTR-3E equipada con una torreta CPWS-30 con un cañón automático de 30 mm.\nLa torreta lleva una ametralladora coaxial de 7,62 mm y un lanzagranadas automático de 40 mm.\nLa torreta está equipada con un sistema automático de control de fuego que incluye un telémetro láser, un termovisor y un calculador balístico."
