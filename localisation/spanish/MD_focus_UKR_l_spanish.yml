 UKR_reorganize_the_national_guard_ukraine_decision_category: "Guardia Nacional de Ucrania"
 UKR_reorganize_the_national_guard_ukraine_decision_category_desc: "El Guardia Nacional de Ucrania es una formación militar con funciones de cumplimiento de la ley, forma parte del sistema del Ministerio del Interior de Ucrania (MIA) y está diseñado para realizar tareas que protejan y protejan la vida, los derechos, las libertades y los intereses legítimos de los ciudadanos de Ucrania, la sociedad y el Estado contra las injerencias criminales y otras ilegales, protejan el orden público y garanticen la seguridad pública.\n\nAsí como en cooperación con los organismos encargados de hacer cumplir la ley, para garantizar la seguridad y protección estatales de la frontera estatal, la represión de actividades terroristas, las actividades de formaciones paramilitares o armadas ilegales (grupos), organizaciones terroristas, grupos organizados y organizaciones delictivas."
