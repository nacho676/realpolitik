 CRO_political.1.t: "La Haya acusa a Gotovina"
 CRO_political.1.d: "El Tribunal Internacional para la ex Yugoslavia ha presentado una acusación contra el General Ante Gotovina por delitos cometidos durante la Operación Tormenta. Ha desaparecido antes de que se pueda hacer un arresto. Las asociaciones de veteranos se están reuniendo en protesta, y Bruselas ha dejado claro que la cooperación con el tribunal es una condición para la integración europea."
 CRO_political.1.a: "Debemos cooperar con el tribunal."
 CRO_political.1.b: "Croacia no extradita a sus héroes"
 CRO_political.2.t: "Gotovina Arrested en Tenerife"
 CRO_political.2.d: "La policía española ha arrestado a Ante Gotovina en un restaurante hotelero de las Islas Canarias después de cuatro años. Inteligencia compartida por Zagreb ayudó a localizarlo. Los veteranos son velas de iluminación en la plaza principal, pero se ha eliminado el último obstáculo en el camino europeo."
 CRO_political.2.a: "Un paso doloroso pero necesario"
 CRO_political.3.t: "Solicitud de afiliación a la Unión Europea"
 CRO_political.3.d: "El Primer Ministro Ivica Račan ha presentado formalmente la solicitud de Croacia para ser miembro de la Unión Europea en Atenas. El gobierno espera alcanzar la ola de adhesión ya en curso entre sus vecinos del norte y poner las guerras de la década anterior firmemente detrás del país."
 CRO_political.3.a: "Nuestro lugar está en Europa"
 CRO_political.4.t: "Negociaciones de Adhesión Abierto"
 CRO_political.4.d: "Después de que el fiscal confirmó la plena cooperación de Croacia con el tribunal, la Unión Europea ha abierto negociaciones de adhesión. La revisión de la ley croata contra el acervo comienza inmediatamente, y los inversores extranjeros están tomando nota."
 CRO_political.4.a: "La proyección comienza"
 CRO_political.5.t: "Invitación a la Cumbre de Bucarest"
 CRO_political.5.d: "La cumbre de la OTAN en Bucarest ha cursado una invitación oficial a Croacia y Albania. Los protocolos de adhesión se firmarán dentro del año. La invitación premia una década de reforma de defensa y ancla Croacia en la alianza occidental."
 CRO_political.5.a: "Un asiento en la mesa"
 CRO_political.6.t: "El Affair Ina-MOL"
 CRO_political.6.d: "El ex Primer Ministro Ivo Sanader ha sido detenido en Austria después de haber huido del enjuiciamiento. Los investigadores alegan que tomó un soborno de la empresa petrolera húngara MOL para conceder derechos de gestión sobre Ina, la firma nacional de petróleo. El caso llega a los niveles más altos del partido gobernante."
 CRO_political.6.a: "Nadie está por encima de la ley"
 CRO_political.6.b: "Contener el daño"
 CRO_political.7.t: "Gotovina absuelta en apelación"
 CRO_political.7.d: "La Sala de Apelaciones del Tribunal Internacional para la ex Yugoslavia ha revocado las condenas de los generales Ante Gotovina y Mladen Markač y ordenado su liberación inmediata. La plaza principal de Zagreb ha llenado de multitudes que les dan la bienvenida a casa. En Belgrado y Banja Luka el fallo se ha cumplido con furia."
 CRO_political.7.a: "Los generales regresan a casa"
 CRO_political.8.t: "Bienvenidos a la Unión Europea"
 CRO_political.8.d: "A medianoche Croacia se convirtió en el 28.º estado miembro de la Unión Europea, cerrando un proceso de adhesión de doce años que superó a seis gobiernos. Se están desmantelando puestos aduaneros en las fronteras eslovena y húngara."
 CRO_political.8.a: "Un futuro europeo"
 CRO_political.9.t: "Schengen y el Euro"
 CRO_political.9.d: "Croacia ha adoptado el euro y se ha unido a la zona de Schengen el mismo día, primer Estado miembro para completar ambos pasos inmediatamente. Los controles fronterizos con el resto del bloque se han ido, y el kuna pasa a la historia. La industria turística espera una temporada récord."
 CRO_political.9.a: "Completamente integrado al fin"
 CRO_political.10.t: "Herzeg-Bosnia declara la independencia"
 CRO_political.10.d: "Los cantones croatas de Herzegovina han proclamado un Herzeg-Bosnia autogobierno y han cortado sus vínculos con Sarajevo. Zagreb debe decidir hasta dónde ir a apoyar la escapada."
 CRO_political.10.a: "Reconocer Herzeg-Bosnia"
 CRO_political.10.b: "Enviar apoyo silencioso"
