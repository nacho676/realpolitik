l_spanish:
 mdr_mongolia_focus: "Mongolia"
 mdr_mon_P1: "Elecciones del Gran Jural de 2000"
 mdr_mon_P1_desc: "El Partido del Pueblo ganó 72 de los 76 escaños. Empieza una nueva etapa."
 mdr_mon_P2: "El gobierno de Enkhbayar"
 mdr_mon_P2_desc: "Un primer ministro reformista al frente de un partido que viene del régimen anterior."
 mdr_mon_P3: "Reforma de la administración pública"
 mdr_mon_P3_desc: "Menos cargos políticos y más funcionarios de carrera."
 mdr_mon_P4: "Ley anticorrupción de 2006"
 mdr_mon_P4_desc: "Nace la Agencia Independiente contra la Corrupción."
 mdr_mon_P5: "La coalición de 2004"
 mdr_mon_P5_desc: "El empate en el Gran Jural obliga a gobernar entre los dos grandes partidos."
 mdr_mon_P6: "Los disturbios del 1 de julio de 2008"
 mdr_mon_P6_desc: "Denuncias de fraude, la sede del partido en llamas y cinco muertos. Hay que decidir cómo responder."
 mdr_mon_P7A: "Democracia consolidada"
 mdr_mon_P7A_desc: "Elecciones limpias, alternancia y una prensa que puede criticar."
 mdr_mon_P8A: "Ley de transparencia"
 mdr_mon_P8A_desc: "Las cuentas públicas, a la vista de todos."
 mdr_mon_P9A: "Descentralización de los aimags"
 mdr_mon_P9A_desc: "Las provincias manejan parte de su presupuesto."
 mdr_mon_P10A: "Reforma constitucional de 2019"
 mdr_mon_P10A_desc: "Un solo mandato presidencial y un primer ministro más fuerte."
 mdr_mon_P11A: "Control ciudadano de la minería"
 mdr_mon_P11A_desc: "Los contratos mineros pasan por el Gran Jural y se publican."
 mdr_mon_P7B: "Hegemonía del Partido del Pueblo"
 mdr_mon_P7B_desc: "El partido controla el Estado, los sindicatos y las empresas públicas."
 mdr_mon_P8B: "Medios afines"
 mdr_mon_P8B_desc: "La prensa crítica pierde la publicidad del Estado."
 mdr_mon_P9B: "Clientelismo de la minería"
 mdr_mon_P9B_desc: "Las licencias mineras se reparten entre los leales."
 mdr_mon_P10B: "Estado desarrollista"
 mdr_mon_P10B_desc: "El Estado guía la inversión hacia la industria."
 mdr_mon_P11B: "Sucesión ordenada"
 mdr_mon_P11B_desc: "El partido elige a sus sucesores sin sobresaltos."
 mdr_mon_P7C: "El hombre fuerte"
 mdr_mon_P7C_desc: "Se suspende el Gran Jural. El orden primero, las elecciones después."
 mdr_mon_P8C: "Vigilancia de la capital"
 mdr_mon_P8C_desc: "Cámaras y agentes en cada distrito de Ulán Bator."
 mdr_mon_P9C: "Un ejército leal"
 mdr_mon_P9C_desc: "Los generales reciben ascensos y negocios."
 mdr_mon_P10C: "El Estado minero"
 mdr_mon_P10C_desc: "Las minas extranjeras pasan a manos del Estado."
 mdr_mon_P11C: "Referéndum del líder"
 mdr_mon_P11C_desc: "Un plebiscito para quedarse sin límite de mandatos."
 mdr_mon_P12: "Fin de la transición"
 mdr_mon_P12_desc: "Treinta años después del comunismo, el sistema político ya tiene su forma."
 mdr_mon_E1: "Inventario geológico nacional"
 mdr_mon_E1_desc: "Mapear lo que hay bajo la estepa y el Gobi."
 mdr_mon_E2: "El descubrimiento de Oyu Tolgoi"
 mdr_mon_E2_desc: "Uno de los mayores yacimientos de cobre y oro del mundo, en el sur del Gobi (2001)."
 mdr_mon_E3: "Modernizar Erdenet"
 mdr_mon_E3_desc: "La mina de cobre compartida con Rusia recibe equipos nuevos."
 mdr_mon_E4: "Tavan Tolgoi"
 mdr_mon_E4_desc: "Uno de los mayores depósitos de carbón sin explotar del mundo."
 mdr_mon_E5A: "Abrir las puertas"
 mdr_mon_E5A_desc: "Las grandes mineras extranjeras son bienvenidas."
 mdr_mon_E6A: "El acuerdo de inversión de 2009"
 mdr_mon_E6A_desc: "Rio Tinto e Ivanhoe se comprometen a construir la mina; el Estado se queda con el 34%."
 mdr_mon_E7A: "La bolsa de Ulán Bator"
 mdr_mon_E7A_desc: "Capital local para empresas locales."
 mdr_mon_E5B: "Nacionalismo de los recursos"
 mdr_mon_E5B_desc: "Impuesto extraordinario de 68% sobre el cobre y el oro (2006)."
 mdr_mon_E6B: "Erdenes Mongol"
 mdr_mon_E6B_desc: "Una empresa estatal con parte de cada gran proyecto."
 mdr_mon_E7B: "Mongolia para los mongoles"
 mdr_mon_E7B_desc: "Los recursos del país, para el país."
 mdr_mon_E8: "Impuesto a la exportación de cobre"
 mdr_mon_E8_desc: "Cada camión que cruza la frontera deja algo."
 mdr_mon_E9: "El ferrocarril del carbón"
 mdr_mon_E9_desc: "Una línea desde Tavan Tolgoi hasta la frontera china."
 mdr_mon_E10A: "Trocha rusa"
 mdr_mon_E10A_desc: "Las vías siguen el ancho ruso: el ferrocarril queda atado a Moscú."
 mdr_mon_E10B: "Trocha china"
 mdr_mon_E10B_desc: "Exportar a China sale más barato, pero dependemos más de Pekín."
 mdr_mon_E11: "Fondo de Desarrollo Humano"
 mdr_mon_E11_desc: "Reparto en efectivo de la renta minera (2008)."
 mdr_mon_E12: "Fondo del Futuro"
 mdr_mon_E12_desc: "Ahorrar la renta minera para cuando se acabe el cobre."
 mdr_mon_E13: "Una fundición de cobre propia"
 mdr_mon_E13_desc: "Vender cátodos y no solo concentrado."
 mdr_mon_E14: "El uranio de Dornod"
 mdr_mon_E14_desc: "Reabrir la mina de la era soviética en el este."
 mdr_mon_E15: "Ley de energía nuclear de 2009"
 mdr_mon_E15_desc: "Nace MonAtom para vender el uranio."
 mdr_mon_E16: "Las tierras raras de Khalzan Buregtei"
 mdr_mon_E16_desc: "Un yacimiento de tierras raras en Khovd."
 mdr_mon_E17: "La cachemira"
 mdr_mon_E17_desc: "Mongolia produce cerca de un tercio de la cachemira del mundo: hay que hilarla en casa."
 mdr_mon_E18: "Turismo de la estepa"
 mdr_mon_E18_desc: "Campamentos de ger, el Gobi y el Naadam para los visitantes."
 mdr_mon_E19: "Ciudad industrial de Sainshand"
 mdr_mon_E19_desc: "Refinería, acería y química en el desierto."
 mdr_mon_E20: "Programa con el FMI"
 mdr_mon_E20_desc: "Un rescate a cambio de ajustar el gasto (2017)."
 mdr_mon_E21: "Un tugrik estable"
 mdr_mon_E21_desc: "Menos inflación y deuda más barata."
 mdr_mon_E22: "La economía de los diez millones"
 mdr_mon_E22_desc: "Una economía que ya no vive solo del cobre."
 mdr_mon_S1: "Emergencia del dzud"
 mdr_mon_S1_desc: "El invierno de 1999-2002 mató unos 11 millones de animales. Forraje, transporte y ayuda."
 mdr_mon_S2: "Reservas nacionales de forraje"
 mdr_mon_S2_desc: "Depósitos de heno en cada provincia para el próximo dzud."
 mdr_mon_S3: "Seguro ganadero por índice"
 mdr_mon_S3_desc: "Un seguro que paga según la mortandad de la zona (2005)."
 mdr_mon_S4: "Pozos en la estepa"
 mdr_mon_S4_desc: "Agua para el ganado y para unos pocos cultivos."
 mdr_mon_S5: "Cooperativas de pastores"
 mdr_mon_S5_desc: "Juntos venden mejor la lana y la carne."
 mdr_mon_S6: "Un veterinario en cada sum"
 mdr_mon_S6_desc: "Menos animales muertos por enfermedades."
 mdr_mon_S7: "El dzud de 2010"
 mdr_mon_S7_desc: "Otro invierno terrible. Con reservas y seguro, el daño es mucho menor."
 mdr_mon_S8: "Los distritos de ger"
 mdr_mon_S8_desc: "Medio país se mudó a Ulán Bator, a barrios de yurtas sin servicios."
 mdr_mon_S9: "El smog de Ulán Bator"
 mdr_mon_S9_desc: "Las estufas a carbón hacen de la capital una de las más contaminadas del mundo."
 mdr_mon_S10A: "Estufas limpias"
 mdr_mon_S10A_desc: "Subsidios para cambiar las estufas: rápido pero caro."
 mdr_mon_S10B: "Departamentos para los ger"
 mdr_mon_S10B_desc: "Barrios nuevos con calefacción central."
 mdr_mon_S11: "Parque eólico de Salkhit"
 mdr_mon_S11_desc: "El primer parque eólico del país (2013)."
 mdr_mon_S12: "La Gran Muralla Verde"
 mdr_mon_S12_desc: "Árboles contra el avance del desierto."
 mdr_mon_S13: "El agua del Gobi"
 mdr_mon_S13_desc: "Pozos profundos y tuberías para la minería del sur."
 mdr_mon_S14: "Nómadas del siglo XXI"
 mdr_mon_S14_desc: "Paneles solares, teléfonos y mercados para la vida nómada."
 mdr_mon_X1: "El concepto de 1994"
 mdr_mon_X1_desc: "Equilibrio entre los dos gigantes y amigos lejanos."
 mdr_mon_X2: "Zona libre de armas nucleares"
 mdr_mon_X2_desc: "Los cinco miembros permanentes reconocen el estatus de Mongolia (2012)."
 mdr_mon_X3: "El Diálogo de Ulán Bator"
 mdr_mon_X3_desc: "Una mesa neutral para hablar de Corea."
 mdr_mon_X4: "Socio de Estados Unidos"
 mdr_mon_X4_desc: "La Cuenta del Desafío del Milenio financia obras."
 mdr_mon_X5: "Acuerdo económico con Japón"
 mdr_mon_X5_desc: "El primer tratado de libre comercio de Mongolia (2015)."
 mdr_mon_X6: "Corea, el hermano lejano"
 mdr_mon_X6_desc: "Decenas de miles de mongoles trabajan en Corea del Sur."
 mdr_mon_X7: "Socio de la OTAN"
 mdr_mon_X7_desc: "Un programa de asociación individual."
 mdr_mon_X8: "La Unión Europea"
 mdr_mon_X8_desc: "Preferencias arancelarias a cambio de derechos y buen gobierno."
 mdr_mon_X9A: "El tercer vecino"
 mdr_mon_X9A_desc: "Ni Moscú ni Pekín deciden por nosotros."
 mdr_mon_X9B: "Acercarse a Pekín"
 mdr_mon_X9B_desc: "Inversión china a cambio de dependencia."
 mdr_mon_X9C: "Acercarse a Moscú"
 mdr_mon_X9C_desc: "Combustible y armas rusas baratas, como en los viejos tiempos."
 mdr_mon_X10: "El tratado con Rusia de 2019"
 mdr_mon_X10_desc: "Una asociación estratégica integral."
 mdr_mon_X11: "El corredor de la Franja y la Ruta"
 mdr_mon_X11_desc: "El corredor China–Mongolia–Rusia pasa por nuestras rutas."
 mdr_mon_X12: "Observadores en la OCS"
 mdr_mon_X12_desc: "Sentarse a la mesa de la Organización de Cooperación de Shanghái."
 mdr_mon_X13: "Ningún vecino nos manda"
 mdr_mon_X13_desc: "Mongolia trata con todos y no obedece a nadie."
 mdr_mon_X14: "La diáspora mongola"
 mdr_mon_X14_desc: "Lazos con los mongoles de Rusia, China y el mundo."
 mdr_mon_X15: "Mongolia en las Naciones Unidas"
 mdr_mon_X15_desc: "Presidir foros y ganar peso diplomático."
 mdr_mon_M1: "Reforma de las Fuerzas Armadas"
 mdr_mon_M1_desc: "Del ejército soviético a una fuerza profesional."
 mdr_mon_M2: "Cascos azules"
 mdr_mon_M2_desc: "Las primeras misiones de paz de la ONU (2002)."
 mdr_mon_M3: "El centro de Cinco Colinas"
 mdr_mon_M3_desc: "Entrenamiento para misiones de paz (2006)."
 mdr_mon_M4: "Ejercicio Khaan Quest"
 mdr_mon_M4_desc: "Maniobras anuales con Estados Unidos desde 2003."
 mdr_mon_M5: "Irak y Afganistán"
 mdr_mon_M5_desc: "Soldados mongoles en las dos guerras."
 mdr_mon_M6: "Guardia de frontera"
 mdr_mon_M6_desc: "4.700 km con China y 3.500 con Rusia."
 mdr_mon_M7: "Reservistas de la estepa"
 mdr_mon_M7_desc: "Cada pastor sabe montar y disparar."
 mdr_mon_M8: "Defensa aérea"
 mdr_mon_M8_desc: "Proteger Ulán Bator, la única gran ciudad."
 mdr_mon_M9: "Helicópteros Mi-171"
 mdr_mon_M9_desc: "Transporte en un país sin caminos."
 mdr_mon_M10A: "Fuerza expedicionaria de paz"
 mdr_mon_M10A_desc: "Pocos soldados, muy entrenados, para las misiones."
 mdr_mon_M10B: "Defensa total de la estepa"
 mdr_mon_M10B_desc: "Cada valle una trinchera, cada pastor un soldado."
 mdr_mon_M11: "Fuerzas móviles de la estepa"
 mdr_mon_M11_desc: "Motorizadas, ligeras y rápidas."
 mdr_mon_M12: "Industria de defensa nacional"
 mdr_mon_M12_desc: "Reparar y fabricar en casa."
 mdr_mon_M13: "Caballería moderna"
 mdr_mon_M13_desc: "Jinetes con radios y misiles: la tradición, al día."
 mdr_mon_M14: "Una fuerza aérea propia"
 mdr_mon_M14_desc: "Aviones de entrenamiento y una segunda base."
 mdr_mon_M15: "La guardia del kan"
 mdr_mon_M15_desc: "Una unidad de élite con los colores de Gengis."
 mdr_mon_I1: "Gengis Kan, padre de la nación"
 mdr_mon_I1_desc: "Su nombre y su rostro vuelven a todas partes."
 mdr_mon_I2: "Aeropuerto Gengis Kan"
 mdr_mon_I2_desc: "El aeropuerto de la capital cambia de nombre (2005)."
 mdr_mon_I3: "800 años del Gran Estado Mongol"
 mdr_mon_I3_desc: "El Naadam del aniversario, en 2006."
 mdr_mon_I4: "El monumento ecuestre"
 mdr_mon_I4_desc: "Gengis Kan a caballo, 40 metros de acero (2008)."
 mdr_mon_I5: "El renacer budista"
 mdr_mon_I5_desc: "Gandan y los monasterios se llenan otra vez."
 mdr_mon_I6: "El alfabeto tradicional"
 mdr_mon_I6_desc: "La escritura vertical vuelve a los documentos oficiales (ley de 2015)."
 mdr_mon_I7: "Los juegos del Naadam"
 mdr_mon_I7_desc: "Lucha, arco y carreras de caballos para todo el país."
 mdr_mon_I8: "Mongolia, nación de los mongoles"
 mdr_mon_I8_desc: "Somos el hogar de todos los mongoles, también de los que viven afuera."
 mdr_mon_I9: "El kurultái de los pueblos mongoles"
 mdr_mon_I9_desc: "Una gran asamblea cultural de todos los mongoles."
 mdr_mon_I10: "El mundo mongol"
 mdr_mon_I10_desc: "Cultura, idioma y turismo: el poder blando de la estepa."
 mdr_mon_G1: "El despertar panmongol"
 mdr_mon_G1_desc: "Los vecinos tambalean: es la hora de los mongoles de afuera."
 mdr_mon_G2: "El Congreso de los Pueblos Mongoles"
 mdr_mon_G2_desc: "Reclamos culturales, todavía no militares."
 mdr_mon_G3: "Apoyar a Mongolia Interior"
 mdr_mon_G3_desc: "Dinero y voz para los mongoles de China."
 mdr_mon_G4: "Reclamar Mongolia Interior"
 mdr_mon_G4_desc: "La tierra de nuestros hermanos del sur."
 mdr_mon_G5: "Hulunbuir y Barga"
 mdr_mon_G5_desc: "Los pastos del noreste, donde viven los barga."
 mdr_mon_G6: "Apoyar a Tuvá"
 mdr_mon_G6_desc: "Los tuvanos comparten con nosotros la estepa y el budismo."
 mdr_mon_G7: "Tuvá en el imperio"
 mdr_mon_G7_desc: "Si Tuvá ya es libre, le ofrecemos unirse; si no, la reclamamos."
 mdr_mon_G8: "Apoyar a Buriatia"
 mdr_mon_G8_desc: "Los buriatos, mongoles a orillas del Baikal."
 mdr_mon_G9: "Buriatia en el imperio"
 mdr_mon_G9_desc: "Si Buriatia ya es libre, le ofrecemos unirse; si no, la reclamamos."
 mdr_mon_G10: "Los calmucos del Volga"
 mdr_mon_G10_desc: "Hermanos lejanos, demasiado lejos para alcanzarlos: solo un lazo cultural."
 mdr_mon_G11: "Integrar a los hermanos"
 mdr_mon_G11_desc: "Los estados mongoles que controlemos se vuelven núcleo con dos años de estabilidad."
 mdr_mon_G12: "La ley del Imperio"
 mdr_mon_G12_desc: "Todos los hombres de la estepa, al servicio del imperio."
 mdr_mon_G13: "El ejército de los diez mil"
 mdr_mon_G13_desc: "Una nueva generación de jinetes llama a las armas."
 mdr_mon_G14: "El ferrocarril del imperio"
 mdr_mon_G14_desc: "Vías hasta los nuevos estados."
 mdr_mon_G15: "Proclamar el Imperio Mongol"
 mdr_mon_G15_desc: "Ocho siglos después, el imperio vuelve."
 mdr_mon_G16: "El imperio y el mundo"
 mdr_mon_G16_desc: "Japón, Corea y Kazajistán miran con miedo hacia la estepa."
 mdr_mon_G17: "Pax Mongolica"
 mdr_mon_G17_desc: "Paz, comercio y caminos seguros en toda la estepa."
