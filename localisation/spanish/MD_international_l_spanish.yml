 counter_terrorism_operations: "Operaciones contra el terrorismo"
 counter_terrorism_operations_desc: "Los esfuerzos de nuestras naciones contra el terrorismo deben estar enfocados. Puede que esto tenga un costo para las libertades personales, las finanzas e incluso las vidas, pero la amenaza terrorista debe ser detenida."
