 CT_CUR_SEL_INTEL_TT: "Muestra cuán efectiva es actualmente nuestra recopilación de inteligencia contra esta organización."
 CT_CUR_LOCATION: "§YPosible Sede Localización§!"
 CT_CUR_LOCATION_TT: "Muestra dónde posiblemente crees que puede estar ubicada una sede regional."
 CT_CUR_FOREIGN: "§YAsesores extranjeros§!"
 CT_CUR_FOREIGN_TT: "Este número representa el número de países que nos han enviado asesores para ayudar con nuestras operaciones de lucha contra el terrorismo. Cada nación que envía un asesor aumentará nuestro modificador §YIntel Accuracy§! por §G1%§!, mejorando nuestra §YIntel Accuracy§!. Además, las naciones con §YAsesores extranjeros§! en nuestra nación tendrán sus operaciones dentro de nuestra nación mejoradas."
 CT_SYS_DESC: "El §YSistema de lucha contra el terrorismo§! trabaja por tener la situación global determinar si las organizaciones terroristas aumentarán la amenaza, y lo visibles que son para los organismos de inteligencia. §RNivel de amenaza del terrorismo§! aumentos, la frecuencia y la fuerza de los ataques por parte de la organización aumentarán. Tensión Mundial, contenido de país y acciones de jugador pueden aumentar o disminuir §RTerror Threat Level.§! Estos números se actualizan mensualmente o después de acciones importantes.\n\nLos jugadores pueden llevar a cabo operaciones de recolección de inteligencia usando el sistema espía, acciones en este menú y realizar redadas utilizando el sistema de redadas, para reunir inteligencia y reducir §RNivel de amenaza del terrorismo§!. As §YPrecisión Intel§! se levanta, usted será capaz de apuntar más específicamente a las organizaciones terroristas, culminándose con la capacidad de allanar su cuartel general y eliminar la amenaza."
