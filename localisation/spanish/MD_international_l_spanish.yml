 CT_CUR_THREAT_TT: "Muestra el nivel de amenaza estimado actual de un ataque terrorista por parte de la organización. Cuanto más grave sea, mayor será la probabilidad de que ocurra un ataque terrorista."
 CT_CUR_DEFENSE: "§Y Nivel de Defensa del Terrorismo§!"
 CT_CUR_DEFENSE_TT: "Muestra nuestro nivel de defensa actual contra un ataque terrorista. Cuanto mayor sea este nivel, menor será la probabilidad de que un ataque terrorista tenga éxito dentro de nuestra nación."
