 is_ct_mass_gather_tt: "Realizar operaciones de reunión de inteligencia para recopilar datos para el procesamiento. Los datos obtenidos darán un impulso temporal a §YIntel Accuracy§! en §Y[name_of_org_disp]§!, disminuyendo cada mes después de que se realice una acción §YExploit Intelligence§!."
 is_ct_exploit_intel_tt: "Explota nuestra inteligencia reunida, dando un mayor impulso §YIntel Accuracy§! contra §Y[name_of_org_disp]§! por poco tiempo, disminuyendo cada mes hasta que se agote de su uso operativo."
 is_ct_infil_agent_tt: "Intenta infiltrar a un agente en §Y[name_of_org_disp]§!. Si tenemos éxito, ganaremos un impulso permanente a nuestra §YExactitud de la información§!. Si la infiltración falla, nuestro §YIntel Accuracy§! se degradará por un corto tiempo, y §Y[name_of_org_disp]'s§! §RTerror Threat Level§! se elevará.\n\nLa oportunidad de tener éxito en el intento de infil se modifica por nuestra §YExactitud de información§! y en general §YAgencia de Inteligencia§! formación de agentes."
 is_ct_asset_seizure_tt: "La adquisición de activos reducirá §RNivel de amenaza del terrorismo§! of §Y[name_of_org_disp]§!, pero también hará que sea más difícil ganar §YPrecisión Intel§! contra la §Y[name_of_org_disp]§! por un corto tiempo."
 is_ct_arrest_sympathizers_tt: "Arresting Sympathizers reducirá el §RNivel de amenaza del terrorismo§! of §Y[name_of_org_disp]§!, alarga con el aumento §YPrecisión Intel§! on §Y[name_of_org_disp]§!. Sin embargo, hay una posibilidad de que personas inocentes puedan ser capturadas en los arrestos, y si son atrapados, podemos enfrentarnos a la reacción política.\n\nLa eficacia de las detenciones dependerá de nuestra §YPrecisión Intel§! y nuestra §YIntelligence Agency§! Mejoras en la lucha contra la inteligencia y la lucha contra el terrorismo.\n"
