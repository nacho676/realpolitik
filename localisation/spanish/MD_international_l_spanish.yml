 IS_un_aid_general_budget: "§YPresupuesto General de Operaciones§!: $$[?global.un_operating_budget_base|+G3] / semana"
 IS_un_aid_general_budget_tt: "Muestra las contribuciones de las naciones, en orden descendente, a los §BUN§! §YPresupuesto operativo general§!"
 IS_un_aid_general_budget_tt_delayed: "El §YPresupuesto operativo general§! es el presupuesto base general que todos §BUN§! Los Estados Miembros contribuyen también, si cumplen los requisitos mínimos. §Y[?global.general_operating_budget_contribute_percent|%]§! del PIB, calculado anualmente al comienzo del año, con una contribución mínima §G$0.001§! las Naciones que no satisfacen este mínimo no contribuyen al presupuesto ese año, y no reciben ninguna contribución presupuestaria como consecuencia de ello.\n\nEl §YPresupuesto operativo general§! es la cantidad base de dinero que se proporciona semanalmente al §BNaciones Unidas§! por los Estados miembros, que se distribuirán a §BUN§! §YProgramas de Ayuda§!. Estas contribuciones se distribuyen uniformemente en todos los programas, y proporcionan la cantidad inicial de base que cada programa recibe cada semana para operar.\n\nlas Naciones Unidas reciben una prima £foreign_influence_modifier_texticon §YInfluencia extranjera§! Multiplicador & £foreign_influence_defense_modifier_texticon §YForeign Influence Defense§! Multiplicador igual a su porcentaje de contribución al §YPresupuesto operativo general§! como beneficio para sus contribuciones."
 is_un_aid_total_budget_spending: "§R Gasto total§! en §CUN§!:"
 is_un_aid_total_budget_spending_tt: "Actualmente gastamos $[?united_nations_expenses|-3] en §BUN§!"
 is_un_aid_total_budget_spending_tt_delayed: "Este número muestra cuánto gastamos en todos los programas §BUN§! §YAid Programs§!, incluyendo el §Y Presupuesto Operativo General§! y nuestras decisiones de gasto independientes en todas las contribuciones del programa §BUN§!."
 is_un_basic_budget_spending: "§RPagar§! en §CUN §! §YBudget§!:"
 is_un_basic_budget_spending_tt: "Actualmente gastamos $[?united_nations_base_expenses|-3] sobre el §BUN§! §YPresupuesto operativo general§!"
 is_un_basic_budget_spending_tt_delayed: "El §YPresupuesto operativo general§! es la cantidad base de dinero que se proporciona semanalmente al §BNaciones Unidas§! por los Estados miembros, que se distribuirán a §BUN§! §YProgramas de Ayuda§!. Estas contribuciones se distribuyen uniformemente en todos los programas, y proporcionan la cantidad inicial, base que cada programa recibe cada semana para operar. Los programas que reciben financiación de este presupuesto son §YONUDI§!, §YFNUDC§!, y §YUNESCOE§!"
 is_un_aid_unescoe_spending: "§RPagar§! en §YUNESCOE§!:"
 is_un_aid_unescoe_spending_tt: "Actualmente gastamos $[?united_nations_unescoe_funding|-3] en el programa §YUNESCOE§!"
 is_un_aid_unescoe_spending_tt_delayed: "El §BNaciones Unidas§! §YEducational, Scientific, and Cultural Organization§! es una organización de ayuda destinada a mejorar la educación, proporcionar asesoramiento técnico a las naciones en desarrollo y proporcionar diálogo político a las naciones que necesitan asistencia creciente.\n\nEsto. §BUN§! §YAid Program§! proporcionará impulsos a £research_speed_texticon §YResearch Speed§! y £political_power_texticon §YPoder Político Ganar§!."
 is_un_aid_unido_spending: "§RPagar§! en §Y UNIDO§!:"
 is_un_aid_unido_spending_tt: "Actualmente gastamos $[?united_nations_unido_funding|-3] en el programa §YONUIDO§!"
 is_un_aid_unido_spending_tt_delayed: "§BNaciones Unidas§! §Y Organización de Desarrollo Industrial§! es un programa de ayuda destinado a promover el desarrollo industrial. Al ayudar a las naciones en desarrollo a establecer su propia industria, este programa lucha contra la pobreza, establece una globalización inclusiva y también apunta a la sostenibilidad ambiental.\n\nEste §BUN§! §Y Programa de ayuda§! proporcionará la capacidad de obtener libremente arrendados §YIndustria civil§!, junto con el mejoramiento £construction_speed_texticon §Y Velocidad de construcción§! para que las naciones ayuden a mejorar su base industrial, infraestructura eléctrica e infraestructura de construcción."
 is_un_aid_uncdf_spending: "§RPagar§! en §Y FNUDC§!:"
 is_un_aid_uncdf_spending_tt: "Actualmente gastamos $[?united_nations_uncdf_funding|-3] en el programa §Y del FNUDC§!"
 is_un_aid_uncdf_spending_tt_delayed: "El §BNaciones Unidas§! §Y Fondo de Desarrollo Capital§! es un programa de ayuda destinado a mejorar el flujo del capital para la inversión nacional. El objetivo de este programa es crear empleos y generar crecimiento económico sostenible, a través de programas de inversión y finanzas digitales.\n\nEste §BUN§! §Y Programa de ayuda§! proporcionará tanto el apoyo §YFinancial§! como §YDesarrollo§! a las naciones que reciben la ayuda del programa. Este programa está diseñado para ayudar a mejorar los presupuestos y aumentar el crecimiento de la productividad."
 is_un_aid_spending_percent: "% de §YBase Budget§!:"
 is_un_aid_spending_percent_tt: "El porcentaje del presupuesto operativo general §Y§! que contribuimos es [?united_nations_contribution_percent|Y%2]"
 is_un_aid_spending_percent_tt_delayed: "El porcentaje del §Y Presupuesto Operativo General§! es tanto una cuestión de prestigio, como una cuestión de poder. Cuanto más contribuimos, más £foreign_influence_modifier_texticon §YInfluencia extranjera§! podremos establecer sobre otros, y cuanto más eficaz será nuestra influencia. Cuanto más alto podemos hacer este porcentaje, mejor."
 is_un_aid_additional_percent: "% de §CUN§! §Y Programas de ayuda§!:"
 is_un_aid_additional_percent_tt: "El porcentaje de todos §YPrograma de ayuda Contribuciones adicionales§! que contribuimos es [?united_nations_aid_program_contribution_percent|Y%2]"
 is_un_aid_additional_percent_tt_delayed: "El porcentaje de §YPrograma de ayuda Contribuciones adicionales§! da más influencia sobre las naciones que reciben ayuda de los programas, y nos da más £political_power_texticon §Y Poder político Ganar§!, junto con mejorar nuestras posibilidades de obtener nuestros §Y Inversiones §! aceptados por otras naciones por §GDisminuir§! tanto el tiempo como el costo requerido para nuestros §YInversiones§!"
 is_un_aid_total_budget_ido_tt_delayed: "§Y25%§! del presupuesto del programa va a ayudar a los países a mejorar su £construction_speed_texticon §Y Velocidad de Construcción§!, y el restante §Y75%§! se utiliza para proporcionar Leased §YCivilian Industries§! a §GSubsidized§! nations."
 is_un_aid_total_budget_esco_tt_delayed: "§Y25%§! del presupuesto del programa va a ayudar a los países a mejorar su £political_power_texticon §Y Poder político ganancia§!, y el restante §Y75%§! va a proyectos para ayudar a mejorar su £research_speed_texticon §Y Velocidad de Investigación§!"
