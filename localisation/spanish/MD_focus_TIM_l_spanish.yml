l_spanish:
 east_timor.1.t: "The 2006 Crisis"
 east_timor.1.d: "El ejército de Timor Oriental se ha fracturado en las líneas regionales. Casi 600 soldados de los distritos occidentales han sido despedidos, provocando violencia facciones que se extiende a través de la capital Dili. El gobierno está perdiendo el control de la situación de seguridad."
 east_timor.1.a: "Solicitud de asistencia internacional para el mantenimiento de la paz"
 east_timor.1.b: "Vamos a restaurar el orden nosotros"
 east_timor.2.t: "Timor Oriental pide al personal de mantenimiento de la paz"
 east_timor.2.d: "Timor Oriental ha descendido a la violencia de facciones y solicita asistencia militar australiana para restablecer el orden. Como el poder más grande de la región, nuestra respuesta establecerá el tono para la intervención internacional."
 east_timor.2.a: "Despliegue la Fuerza Internacional de Estabilización"
 east_timor.2.b: "No podemos intervenir en este momento."
 east_timor.3.t: "Timor Oriental pide ayuda"
 east_timor.3.d: "Nuestra antigua colonia Timor Oriental está solicitando asistencia militar a medida que el país desciende al caos. Portugal tiene una obligación histórica y vínculos firmes con el pueblo timorense."
 east_timor.3.a: "Enviar un contingente de mantenimiento de la paz"
 east_timor.3.b: "Rechazar la solicitud"
 east_timor.4.t: "Timor Oriental solicita asistencia"
 east_timor.4.d: "Timor Oriental ha solicitado la ayuda de Nueva Zelanda para restaurar el orden. La pequeña nación está luchando con la violencia generalizada y un aparato de seguridad que colapsa."
 east_timor.4.a: "Envíe al personal de mantenimiento de la paz"
 east_timor.4.b: "Declin"
 east_timor.5.t: "Crisis de Timor Oriental"
 east_timor.5.d: "Timor Oriental ha pedido a las fuerzas de mantenimiento de la paz de Malasia que ayuden a estabilizar el país. Como nación sudeste asiático, la participación de Malasia demostraría solidaridad regional."
 east_timor.5.a: "Despliegue tropas a Dili"
 east_timor.5.b: "Rechazar la solicitud"
 east_timor.6.t: "Fuerzas de Australia"
 east_timor.6.d: "Las fuerzas de mantenimiento de la paz australianas han llegado a Dili y están restableciendo el orden en la capital. La Fuerza Internacional de Estabilización es la columna vertebral de la operación de mantenimiento de la paz."
 east_timor.6.a: "Estamos agradecidos."
 east_timor.7.t: "Fuerzas portuguesas"
 east_timor.7.d: "Las tropas portuguesas se han desplegado en Timor Oriental, cumpliendo una obligación histórica con su antigua colonia."
 east_timor.7.a: "Bienvenido, amigos"
 east_timor.8.t: "New Zealand Peacekeepers Llegan"
 east_timor.8.d: "Nueva Zelandia ha enviado un contingente de mantenimiento de la paz para ayudar a estabilizar Timor Oriental."
 east_timor.8.a: "Su ayuda es apreciada"
 east_timor.9.t: "Los tropas de Malasia llegan"
 east_timor.9.d: "Las fuerzas de Malasia han llegado para ayudar a la operación de mantenimiento de la paz en Timor Oriental."
 east_timor.9.a: "Nuestro agradecimiento a Malasia"
 east_timor.10.t: "La Caza de Alfredo Reinado"
 east_timor.10.d: "El líder rebelde Alfredo Reinado ha evadido a las autoridades y se esconde en las montañas al sur de Dili. Su libertad continua socava la autoridad del gobierno e infunde a otras facciones disidentes."
 east_timor.10.a: "Pedir a Australia que envíe fuerzas especiales"
 east_timor.10.b: "Cazadle con nuestras propias fuerzas"
 east_timor.11.t: "Timor Oriental solicita asistencia SAS"
 east_timor.11.d: "Timor Oriental ha pedido a Australia que despliegue tropas especiales de regimiento aéreo para capturar al líder rebelde fugitivo Alfredo Reinado, quien sigue evadiendo la fuerza de mantenimiento de la paz."
 east_timor.11.a: "Enviar a la SAS"
 east_timor.11.b: "Esto va más allá de nuestro mandato"
 east_timor.12.t: "Reinado Escapes"
 east_timor.12.d: "A pesar de la operación de fuerzas especiales australianas, Alfredo Reinado ha escapado a las montañas. La operación no lo aprendió, pero la presencia internacional más amplia ha estabilizado la situación de seguridad en Dili."
 east_timor.12.a: "Él será encontrado eventualmente"
 east_timor_news.1.t: "Timor Oriental solicita a la Fuerza Internacional de Mantenimiento de la Paz"
 east_timor_news.1.desc: "Timor Oriental ha solicitado oficialmente asistencia internacional para el mantenimiento de la paz, ya que la violencia de facciones deja cientos de muertos o desplazados en la capital Dili. Se ha pedido a Australia, Portugal, Nueva Zelandia y Malasia que aporten contingentes a una Fuerza Internacional de Estabilización."
 east_timor_news.1.a: "Contamos con la ayuda del mundo"
 east_timor_news.1.b: "Restauraremos el orden en Dili"
 east_timor_news.1.c: "Estabilidad en la región es de nuestro interés"
 east_timor_news.1.d: "Una pequeña nación en crisis"