 MDR_POW_VAL_LOG: "[?mdr_pow_sel_log|0]"
 MDR_POW_TRAITS_TITLE: "§YRasgos§!"
 MDR_POW_TRAIT_1: "[mdr_pow_trait_text_1]"
 MDR_POW_TRAIT_2: "[mdr_pow_trait_text_2]"
