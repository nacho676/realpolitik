 MDR_POW_STATUS_JAIL: "§YEncarcelado§!"
 MDR_POW_OPP_YES: "Es de otra ideología: empezó con mucha resistencia y poca cooperación."
 MDR_POW_OPP_NO: "Comparte nuestra ideología: es más fácil ganárselo."
