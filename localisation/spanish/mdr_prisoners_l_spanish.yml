 MDR_POW_ACTIONS_TITLE: "§YDecidir su destino§!"
 MDR_POW_ACTIONS_HINT: "Mientras no elijas, sigue encarcelado sin costo. Durante la guerra solo se puede ejecutar; las operaciones siempre se pueden hacer."
 mdr_prisoners.5.t: "Un comandante cambia de bando"
 mdr_prisoners.5.d: "[mdr_pow_news.GetName] renunció a su antigua lealtad y aceptó servir en nuestro ejército. Su experiencia ahora es nuestra, aunque solo el tiempo dirá si su nueva lealtad es sincera."
 mdr_prisoners.5.a: "Que lo demuestre en el campo de batalla"
 MDR_POW_RES_TITLE: "§YResistencia§!"
 MDR_POW_RES_VALUE: "§R[?mdr_pow_sel_res|0]%§!"
 MDR_POW_RES_HINT: "Vuelve a subir 2 por semana. Con §Y30%§! o menos se puede hacer el juicio público."
 MDR_POW_COOP_TITLE: "§YCooperación§!"
 MDR_POW_COOP_VALUE: "§G[?mdr_pow_sel_coop|0]%§!"
 MDR_POW_COOP_HINT: "Baja 2 por semana. Con §Y60%§! o más acepta servir en nuestro ejército."
 MDR_POW_OP_1: "Encierro duro"
 MDR_POW_OP_1_TT: "21 días, gratis. Resistencia §G-14§!, cooperación §R-5§!."
 MDR_POW_OP_2: "Amenazar"
 MDR_POW_OP_2_TT: "21 días, §Y18§! de poder político. Resistencia §G-20§!, cooperación §R-8§!."
 MDR_POW_OP_3: "Interrogar"
 MDR_POW_OP_3_TT: "28 días, §Y12§! de poder político. Resistencia §G-9§! y §G+2§! de inteligencia sobre su ejército, si su país sigue existiendo."
 MDR_POW_OP_4: "Trato digno"
 MDR_POW_OP_4_TT: "30 días, gratis. Cooperación §G+12§!, resistencia §G-3§!."
 MDR_POW_OP_5: "Propaganda"
 MDR_POW_OP_5_TT: "28 días, §Y23§! de poder político. Cooperación §G+15§!, resistencia §G-5§!."
 MDR_POW_OP_6: "Soborno"
 MDR_POW_OP_6_TT: "21 días, §Y$0.35B§! del tesoro. Cooperación §G+22§!."
 MDR_POW_OP_NONE: "Sin operación"
 MDR_POW_OP_STATUS: "[mdr_pow_op_status_text]"
 MDR_POW_OP_CANCEL: "Cancelar"
 MDR_POW_OP_CANCEL_TT: "Detiene la operación en curso. No se devuelve el costo."
