l_spanish:
 MDR_POW_BUTTON: "Prisioneros: [?mdr_pow_count|0]"
 MDR_POW_BUTTON_TT: "Generales enemigos capturados. Quedan presos hasta el final de la guerra; solo se puede ejecutarlos antes."
 MDR_POW_RANK_GENERAL: "General"
 MDR_POW_RANK_MARSHAL: "Mariscal"
 MDR_POW_BTN_USE: "Usar"
 MDR_POW_BTN_USE_TT: "Pasa a nuestro ejército con su nombre, habilidades y rasgos, con §YLealtad dudosa§! durante 180 días. Pide §Y60%§! de cooperación y §Y96§! de poder político. Máximo 3 por año. Solo después de la guerra."
 MDR_POW_BTN_EXECUTE: "Ejecutar"
 MDR_POW_BTN_EXECUTE_TT: "Lo interrogamos y lo fusilamos. Cuesta §Y47§! de poder político. §G+4§! de inteligencia sobre su ejército; su país gana §R+2%§! de apoyo a la guerra, y en una democracia perdemos §R3%§! de estabilidad."
 MDR_POW_BTN_EXILE: "Exiliar"
 MDR_POW_BTN_EXILE_TT: "Se va a un país de ideología parecida, que puede usarlo. Podría volver contra nosotros. Solo después de la guerra."
 MDR_POW_BTN_TRIAL: "Juicio público"
 MDR_POW_BTN_TRIAL_TT: "Lo juzgamos ante el país y no vuelve a mandar. Pide resistencia de §Y30%§! o menos. §G+58§! de poder político y §G+2%§! de apoyo a la guerra; su país y sus aliados nos ven peor. Solo después de la guerra."
 mdr_doubtful_loyalty: "Lealtad dudosa"
 mdr_show_trial: "Juzgó en público a uno de sus generales"
 mdr_prisoners.3.t: "Uno de nuestros generales se pasó al enemigo"
 mdr_prisoners.3.d: "[mdr_pow_news.GetName], que estaba prisionero, aceptó servir en el ejército que lo capturó."
 mdr_prisoners.3.a: "Un traidor"
 mdr_prisoners.4.t: "Altos mandos capturados"
 mdr_prisoners.4.d: "Nuestras fuerzas capturaron a [?global.mdr_pow_news_n|0] altos mandos de [?global.mdr_pow_news_from.GetName]. Están presos: el botón §YPrisioneros§!, arriba a la izquierda, abre la lista. Hasta el final de la guerra solo se puede ejecutarlos."
 mdr_prisoners.4.a: "Que los interroguen"
 MDR_POW_TITLE: "§YGENERALES CAPTURADOS§!"
 MDR_POW_INTRO: "Tocá un prisionero para ver su ficha y decidir su destino."
 MDR_POW_LIST_TITLE: "§YPrisioneros: [?mdr_pow_count|0]§!"
 MDR_POW_MARK: "§Y>§!"
