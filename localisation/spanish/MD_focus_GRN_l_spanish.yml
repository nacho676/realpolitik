 GRN_national_decisions: "Groenlandia Nacional Decisiones"
 GRN_national_decisions_desc: "La isla de Groenlandia tiene una situación muy relajada pero también tensa. Aparte de los intentos de los líderes políticos de hacer, bueno, cualquier cosa para desarrollar la isla y su población también debe contender con el tema cada vez más acuciante de la eventual independencia. Algunos lo quieren ahora, algunos quieren esperar a un mejor pie estable. Independientemente de que va a ser hasta Groenlandia y Dinamarca si la isla será verdaderamente libre al final de todo."
 GRN_decision_independence_war: "Guerra de la independencia"
 GRN_decision_independence_war_desc: "El tiempo está sobre nosotros y los políticos han forzado las manos del pueblo. La guerra es declarada y ahora su carrera para ver si Dinamarca puede mantener su corona o la corona que sostiene caerá como fuerza de presión pública una paz entre todas las partes."
 GRN_decision_capital_city_expansion: "Expansión de Capital City"
 GRN_decision_capital_city_expansion_desc: "Con nuestra población nacional creciendo hasta el punto de vista que nunca hemos anticipado realmente que tendremos que reformar la capital de Nuuk para reflejar e integrar mejor el crecimiento regional y nacional en general."
 GRN_decision_development_visa_grants: "Subvenciones de visados de desarrollo"
 GRN_decision_development_visa_grants_desc: "Nuestro principal problema para el desarrollo de la nación es puramente la falta de recursos humanos. Para llegar a algún sitio debemos invertir mucho en conseguir trabajadores extranjeros dispuestos a soportar más el entorno que los posibles lujosos incentivos monetarios y el empleo que podamos ofrecerles."
 GRN_decision_global_recruitment_efforts: "Actividades mundiales de contratación"
 GRN_decision_global_recruitment_efforts_desc: "Con la defensa nacional ahora bajo nuestro propio control directo sufrimos el mismo problema que hacemos con sólo ser una nación en su conjunto. Eso es una falta de mano de obra. Tendremos que hacer esencialmente algo similar al de las subvenciones para el desarrollo, pero para los militares. Esperamos que a medida que nuestra economía se vuelva más robusta y nuestro presupuesto sea más flexible para permitir este tipo de gastos podamos incentivar enormemente a mercenarios o almas vagabundas sin un hogar permanente para elegir el nuestro como su casa final."
 GRN_decision_naval_priority_act: "Ley de prioridades navales"
 GRN_decision_naval_priority_act_desc: "Para tener alguna presencia en la región más inmediata a nosotros necesitamos una armada. El problema es que no tenemos la capacidad económica de construirlas a ritmo tranquilo, por así decirlo. Así pues, debemos «reclutar a la fuerza» tantas instalaciones y complejos de construcción naval como podamos, lo más cerca posible unos de otros, para armar rápido una flota básica. Será carísimo, pero también lo será quedarse sentados esperando que ocurra algo que de verdad nos favorezca."
 GRN_decision_project_vortex: "Proyecto Vortex"
 GRN_decision_project_vortex_desc: "Asegurar el paso naval en el extremo norte resulta inquietante por la idea de que adquiramos supremacía naval en regiones estratégicas. Para remediarlo, crearemos la mejor demostración de fuerza naval que podamos con nuestros medios actuales."
 GRN_decision_national_commission: "Comisión Nacional"
 GRN_decision_national_commission_desc: "Con el proceso de redacción completo y los prototipos declarados satisfactorios ahora organizaremos una comisión nacional para ayudar a construir nuestra primera Batalla."
 GRN_decision_project_northern_projection: "Proyecto de proyección del norte"
 GRN_decision_project_northern_projection_desc: "Con cosas estables y listas para las verdaderas ambiciones de nuestra nación tendremos que controlar múltiples zonas marinas. Como tal podemos asegurar esto trabajando con constructores de barcos alrededor de la nación para crear lo que será el segundo Grupo de Batalla Ártica."
 GRN_southern_interior_development_decisions: "Proyectos de desarrollo del Interior Sur"
 GRN_southern_interior_development_decisions_desc: "Con nuestra nación estabilizada económica y socialmente a través de nuestras iniciativas poblacionales ahora podemos mirar hacia el interior de la nación. La meseta del sur será el primer paso importante hacia delante para domar a la plataforma de hielo grande."
 GRN_decision_fort_vortex: "Fuerte Vortex"
 GRN_decision_fort_vortex_desc: "Comenzaremos nuestra caminata hacia el interior del sur estableciendo una ciudad fuerte llamada Fort Vortex."
 GRN_decision_glacial_shine: "Glacial Shine"
 GRN_decision_glacial_shine_desc: "Nuestro siguiente asentamiento más central se llamará Glacial Shine."
 GRN_decision_frostbury: "Frostbury"
 GRN_decision_frostbury_desc: "Estableceremos el asentamiento de Frostbury justo al este de la capital de nuestra nación."
 GRN_decision_fort_seal: "Sello de fort"
 GRN_decision_fort_seal_desc: "Estableceremos un asentamiento estratégico de fuertes centrales en el este a lo largo de la frontera del interior meridional y la meseta central."
 GRN_decision_southern_interior_basic_roads: "Obras viales básicas del Interior Sur"
 GRN_decision_southern_interior_basic_roads_desc: "Con nuestros asentamientos plenamente establecidos ahora podemos crear una forma básica de transporte terrestre para conectar y abastecer las necesidades de estos nuevos bastiones de la civilización."
 GRN_decision_southern_interior_improved_roads: "Carreteras mejoradas del Interior Sur"
 GRN_decision_southern_interior_improved_roads_desc: "Las inversiones continuas en la red vial permitirán un mejor volumen de flujo de tráfico y establecerán medidas de seguridad adecuadas y más continuas para viajar en condiciones tan largas y peligrosas."
 GRN_decision_great_polar_railway: "Gran ferrocarril polar"
 GRN_decision_great_polar_railway_desc: "Asegurar el desarrollo de una red ferroviaria racionalizada y eficiente nos permite llevar personas y materiales a granel. Esto nos permite por fin empezar de lleno a construir una economía para la región desde cero."
 GRN_decision_basic_industrial_jobs: "Empleos Industriales Básicos"
 GRN_decision_basic_industrial_jobs_desc: "Asegurar una forma básica de actividad económica nos permite financiar más directamente el desarrollo del interior y puede permitirnos expandirnos a otros sectores económicos donde sea posible."
 GRN_decision_local_food_supply: "Suministros locales de alimentos"
 GRN_decision_local_food_supply_desc: "El desarrollo estratégico de HFF nos permite crear alimentos locales para los asentamientos y, por lo tanto, no sólo podemos utilizar más del agua congelada que también podemos ayudar a cultivar internamente estos centros infantiles de población. Las instalaciones de granja Harsh serán la lanza para atravesar la bestia congelada que es el estante."
 GRN_decision_extensive_geological_surveying: "Extensiva Encuesta Geológica"
 GRN_decision_extensive_geological_surveying_desc: "Con la inmensidad que es el interior tendremos que invertir en estas operaciones estratégicas, así como configurar algunas instalaciones dedicadas Harsh Farming que están diseñadas para manejar la producción de caucho la vida vegetal. Estos resultados deben ser extremadamente fructíferos por el tiempo y el capital que estamos invirtiendo en todo."
 GRN_decision_creating_dedicated_mining_operations: "Creación de operaciones mineras dedicadas"
 GRN_decision_creating_dedicated_mining_operations_desc: "Con depósitos escasos y poco conocidos de diversos recursos minerales detectados, también hemos comenzado a expandir el trabajo fundamental para más HFF's para la producción de caucho también. Continuar estas iniciativas seguramente sólo ayudará a nuestra causa."
 GRN_decision_regional_economic_sector_synergy: "Sinergia del sector económico regional"
 GRN_decision_regional_economic_sector_synergy_desc: "Mediante una vasta y extensa inversión de mano de obra, recursos y financiación monetaria podremos ampliar las operaciones mineras hasta un punto en el que podamos crear diversidad económica local. Pronto podremos crear una sinergia regional al igual que con el resto de la economía nacional."
 GRN_central_plateau_development_decisions: "Proyectos de desarrollo de la Meseta Central"
 GRN_central_plateau_development_decisions_desc: "Con el Interior Sur sinergizado económica y socialmente ahora podemos empezar a construir las bases para hacer lo mismo aquí en la Meseta Central. Todo esto será costoso pero a largo plazo ciertamente valdrá la pena."
 GRN_decision_fort_frostfields: "Fort Frostfields"
 GRN_decision_fort_frostfields_desc: "Crearemos un asentamiento de fuerte llamado Fort Frostfields en el semi-cerca oeste de la ciudad de Sisimuit."
 GRN_decision_frigidville: "Frigidville"
 GRN_decision_frigidville_desc: "Yendo al este crearemos el asentamiento de Frigidville. ¿A alguien más se le acaban los nombres temáticos?"
 GRN_decision_aurora: "Aurora"
 GRN_decision_aurora_desc: "En la sección más central de la meseta creo que crearemos el apropiado asentamiento de Aurora."
 GRN_decision_snowdenson: "Snowdenson"
 GRN_decision_snowdenson_desc: "Caminando al sur crearemos el asentamiento de Snowdenson para salvar la brecha entre Glacial Shine y Aurora para las actividades económicas inter-regionales."
 GRN_decision_blizzards_peak: "Peak de Blizzard"
 GRN_decision_blizzards_peak_desc: "Volviendo al norte y siguiendo hacia el este, crearemos el asentamiento de Blizzard's Peak, pues algunos de los puntos más altos están en esa zona general."
 GRN_decision_crystal_flake: "Crystal Flake"
 GRN_decision_crystal_flake_desc: "Siguiendo más al este, y segundo más cercano a la región costera oriental, crearemos el asentamiento de Crystal Flake."
 GRN_decision_snowberry: "Snowberry"
 GRN_decision_snowberry_desc: "Atravesando la zona fronteriza nororiental entre la meseta y las regiones costeras orientales crearemos la pintoresca ciudad sonora de Snowberry."
 GRN_decision_plateau_interior_basic_roads: "Red vial básica de la Meseta Central"
 GRN_decision_plateau_interior_basic_roads_desc: "Con los asentamientos creados ahora podemos empezar a construir las bases básicas de una red vial en toda la meseta. Este trabajo fundacional ayudará a hacer que el viaje sea más suave y directo, simplemente conduciendo sobre el terreno peligroso en sí."
 GRN_decision_plateau_interior_improved_roads: "Obras viales mejoradas de la Meseta Central"
 GRN_decision_plateau_interior_improved_roads_desc: "Con los trabajos fundacionales realizados ahora podemos ir e invertir en la estandarización de las medidas de seguridad, así como otras instalaciones necesarias para atravesar el extenso paisaje."
 GRN_decision_central_arctic_railroad: "Ferrocarril del Ártico Central"
 GRN_decision_central_arctic_railroad_desc: "Ramificándonos desde el GPR en el Interior Sur y desde la red ferroviaria costera, podemos ahora consolidar el grueso del transporte principal de toda nuestra nación. Así, la meseta albergará el Ferrocarril Ártico Central o CARR."
 GRN_decision_basic_industrial_jobs_two: "Mercado laboral industrial básico"
 GRN_decision_basic_industrial_jobs_two_desc: "Con la gente y la infraestructura creada ahora podemos comenzar a trabajar para crear alguna forma de actividad económica dentro de la meseta central."
 GRN_decision_local_food_supply_two: "Estableciendo el suministro local de alimentos"
 GRN_decision_local_food_supply_two_desc: "Utilizando los modelos HFF que hemos utilizado en todo el país podemos crear instalaciones dedicadas para ayudar a reducir la tensión en la creación de cadenas locales de suministro de alimentos."
 GRN_decision_extensive_geological_surveying_two: "Meseta Central: estudios geológicos masivos"
 GRN_decision_extensive_geological_surveying_two_desc: "Personas, lugares, infraestructura, empleos y alimentos. Todo asegurado y todo listo para cavar hondo en el hielo y en las tierras bajo el tiempo mismo."
 GRN_decision_creating_dedicated_mining_operations_two: "Meseta Central: operaciones mineras dedicadas"
 GRN_decision_creating_dedicated_mining_operations_two_desc: "Con los datos de la encuesta en nuestras manos, así como las minas de exploración inital establecidas, ahora podemos empezar a expandir y crear minas más dedicadas y el aparato operativo que les rodea."
 GRN_decision_regional_economic_sector_synergy_two: "Meseta Central: sinergia entre sectores económicos"
 GRN_decision_regional_economic_sector_synergy_two_desc: "La etapa más larga y costosa del viaje está por delante de nosotros. Pero mientras miramos los paisajes de hielo brillantes de la vasta meseta central podemos tomarlo todo y tener la satisfacción puramente dicha que finalmente lo hicimos. Porque Groenlandia es verdaderamente la tierra de las bestias."
 GRN_faction_polar_defense_league: "Liga de Defensa Polar"
 greenland_event.1.t: "Referendo del Gobierno autónomo"
 greenland_event.1.d: "Pronto el Parlamento votará sobre la ampliación de las disposiciones establecidas en la Ley de 79 autonomías. Si se vota sí, cosas como la educación, la sanidad, los sistemas judiciales y el control completo del guardacostas estarán bajo control total del gobierno de Groenlandia."
 greenland_event.1.o1: "El Parlamento aprueba la Ley de gobierno autónomo"
 greenland_event.1.o2: "El Parlamento mantiene el status Quo"
 greenland_event.2.t: "El autogobierno de Groenlandia"
 greenland_event.2.d: "Groenlandia ha votado para ampliar sus derechos en virtud de la Ley de autonomía de 1979 y sustituirlo por la Ley de autogobierno de 2008. El acto les da control de múltiples cuerpos gubernamentales, así como del guardacostas. Podemos aprobar el voto ya que había una mayoría, o podemos bloquearlo citando que las finanzas de la nación no podrían sostener operar todos estos sistemas independientemente sin aumentar los subsidios coloniales que ofrecemos."
 greenland_event.2.o1: "Aprobar el voto"
 greenland_event.2.o2: "Negar el voto"
 greenland_event.300.t: "Dinamarca aprueba el voto"
 greenland_event.300.d: "A principios de hoy recibimos la noticia de que el Parlamento danés ha aprobado probablemente nuestro voto para la nueva Ley del Gobierno Autónomo. Este será un gran paso adelante hacia nuestra independencia y, por lo tanto, un futuro que sólo podemos definirnos."
 greenland_event.300.o1: "Espera, ¿podrían negarlo?"
 greenland_event.3.t: "Dinamarca Bloques Voto"
 greenland_event.3.d: "El Parlamento danés ha considerado apropiado negar nuestro voto en la ampliación de la Ley de autonomía con la nueva Ley de gobierno autónomo. Citan supuestas preocupaciones fiscales, alegando que nuestra asunción de control requeriría subvenciones danesas superiores. Podríamos declarar la independencia, que causaría un conflicto local, o podríamos aceptar la situación y prepararnos para resultados potencialmente peores."
 greenland_event.3.o1: "Lucha. ¿Con qué ejército?"
 greenland_event.3.o2: "Para la Regla Libre de Groenlandia!!!"
 greenland_event.4.t: "¡Declarada guerra!"
 greenland_event.4.d: "Con el bloqueo de la Ley del Gobierno Autónomo de Groenlandia, el gobierno de Groenlandia se ha apoderado de su independencia. Como tal, debemos asegurar todas las posesiones de la corona y llevar a todos los territorios del mar bajo control una vez más."
 greenland_event.4.o1: "Desde las Islas Feroe hasta Groenlandia"
 greenland_event.5.t: "Reorganización de las inversiones de automatización"
 greenland_event.5.d: "Nuestra economía siempre está luchando y es simplemente porque no tenemos suficiente gente. Nuestro per cápita es casi inestable que los guardianes de libros a veces ni siquiera quieren hacer nuestros libros debido a las influencias cambiantes y salvajes de los gastos domésticos simplemente por cómo nuestra economía está cambiando constantemente. Como tal, necesitamos un factor crítico de estabilización que en este caso será una inversión directa e integral de automatización en un sector económico específico. Es de esperar que la reducción general de las necesidades de los trabajadores para dicho sector reduzca considerablemente el carácter volátil general de la economía."
 greenland_event.5.o1: "El sector agrícola"
 greenland_event.5.o2: "El Sector de Fabricación de Guerra"
 greenland_event.5.o3: "El sector de la fabricación civil"
 greenland_event.5.o4: "La Oficina & Sector Tecnológico"
 greenland_event.6.t: "La cuestión de la minería"
 greenland_event.6.d: "Con los esfuerzos por ampliar y comenzar las operaciones mineras comercializadas se plantea la cuestión principal. ¿La minería se basa en la necesidad o en la avaricia? Sobre la base de las necesidades, los esfuerzos nominales de extracción de recursos se adaptarían a las necesidades internas de la nación. Si bien se basaba en la codicia ampliaría las operaciones de manera significativa tanto para las demandas nacionales como extranjeras, a costa del aumento de la demanda de mano de obra para satisfacer las expectativas operacionales adecuadas."
 greenland_event.6.o1: "Las necesidades de nuestra nación"
 greenland_event.6.o2: "Los medios justifican los fines"
 greenland_event.7.t: "Ambiciones políticas"
 greenland_event.7.d: "Con el escenario, nuestra gente está emocionada y preocupada. Nunca antes se ha creído posible tal libre albedrío cuando una vez una colonia de corona danesa. Pero ahora con nuestras nuevas libertades encontradas podemos asegurar una paz mental y crear un futuro político que deseamos."
 greenland_event.7.o1: "Pensamiento Libre Absoluto"
 greenland_event.7.o2: "Ideas emergentes mantener la verdad"
 greenland_event.7.o3: "Prevail de Mentes Neutrales"
 greenland_event.7.o4: "El orgullo nacional impulsa el progreso"
 greenland_influence_event.1.t: "Inversiones groenlandesas"
 greenland_influence_event.1.d: "Groenlandia ha venido a nosotros con una oferta para ayudar a invertir en la construcción de nuestra nación. Si bien hay algunas preocupaciones acerca de la naturaleza de estas inversiones, la isla de Groenlandia incluso con sus desarrollos no plantea ninguna amenaza real a nuestra situación interna cuando se plantea contra el resto de las partes interesadas que es."
 greenland_influence_event.1.o1: "Libre Stuff es agradable"
 greenland_influence_event.1.o2: "Gracias, pero no gracias."
 greenland_influence_event.2.t: "Islandia acepta infraestructura"
 greenland_influence_event.2.d: "Nuestra primera inversión ha sido aceptada, esto aumentará nuestra influencia y nuestros vínculos con la nación."
 greenland_influence_event.2.o1: "Next Investment Por favor"
 greenland_influence_event.3.t: "Energía groenlandesa"
 greenland_influence_event.3.d: "Groenlandia ha venido a nosotros con otra inversión esta vez en el sector energético. Desean establecer algunas instalaciones útiles de generación de energía que no favorezcan particularmente a un tipo específico de generación. Podríamos utilizar las instalaciones de generación de energía libre para fomentar mejores relaciones comerciales, pero algunos se preocupan de que Groenlandia podría estar utilizando estas instalaciones para socavar nuestro gobierno."
 greenland_influence_event.3.o1: "Energía más barato es agradable"
 greenland_influence_event.3.o2: "Nuestra energía no necesita su preocupación"
 greenland_influence_event.4.t: "Islandia acepta instalaciones energéticas"
 greenland_influence_event.4.d: "Nuestra segunda ronda de inversiones para ayudar a desarrollar sus capacidades de generación de energía ha sido aceptada, sólo podemos esperar que si necesitan combustible para las plantas fósiles que negocian con nosotros para continuar fomentando mejores relaciones."
 greenland_influence_event.4.o1: "Enviar la siguiente inversión"
 greenland_influence_event.5.t: "Inversión de industrias polares"
 greenland_influence_event.5.d: "Groenlandia vuelve a hacerlo esta vez con amplias inversiones en nuestro desarrollo económico. De las inversiones industriales a los sectores de oficinas estamos viendo que Groenlandia está empezando a derramar tal vez un poco demasiado en nuestra nación. Aunque no es como si tuvieran mucho que gastar, tal vez deberíamos poner los descansos en las cosas aquí."
 greenland_influence_event.5.o1: "Una economía mejor, ¿por qué no"
 greenland_influence_event.5.o2: "Naaah. Creo que sé su juego"
 greenland_influence_event.6.t: "Islandia acepta inversiones económicas"
 greenland_influence_event.6.d: "Nuestra creciente cartera de inversiones ha sido un gran éxito ya que hemos encontrado medios estratégicos para hacer que el gobierno de Islandia acepte nuestras generosas ofertas. Ahora solo necesitamos capitalizar estos éxitos."
 greenland_influence_event.6.o1: "Uno más Hurrah debe hacerlo"
 greenland_influence_event.7.t: "Inversiones en materia de recursos estratégicos"
 greenland_influence_event.7.d: "Groenlandia ha ayudado a realizar extensas encuestas geológicas y ha encontrado depósitos comerciales limitados de hierro, cobre, níquel y otros recursos que podrían beneficiar nuestra economía nacional. También han estado dispuestos a ampliar nuestra industria de aluminio para compensar posibles pérdidas. Realmente podríamos utilizar esos recursos para reducir nuestra dependencia de ciertas fuentes extranjeras, pero ¿podemos permitirnos ir a tal deuda con nuestro vecino?"
 greenland_influence_event.7.o1: "En serio necesitamos estos recursos"
 greenland_influence_event.7.o2: "Es demasiado arriesgado, denegado"
 greenland_influence_event.8.t: "El arte del trato"
 greenland_influence_event.8.d: "Islandia ha aceptado nuestra inversión en recursos estratégicos y así hemos podido completar nuestra ronda total de inversiones. Con esto en mente ahora hemos establecido el escenario para asegurar una unión potencial en el futuro semi-near."
 greenland_influence_event.8.o1: "Lo juro."
 greenland_influence_event.10000.t: "Inversión rechazada"
 greenland_influence_event.10000.d: "Con Islandia rechazando nuestra propuesta ahora estamos oficialmente fuera de opciones diplomáticamente. Intentaremos esperar todo lo que podamos pero es hora del juego final."
 greenland_influence_event.10000.o1: "Preparar la Operación Verde Real"
 greenland_subterfuge_event.1.t: "Inversión en Groenlandia"
 greenland_subterfuge_event.1.d: "Groenlandia ha venido a nosotros con una oferta más lucrativa. Están dispuestos a hacer una ronda al por mayor de inversiones para crecer nuestra nación. Tal oportunidad parece casi desbordante en la naturaleza, pero no como la isla tiene mucho que hacer por ella. Además, lo que podría hacer Groenlandia para afectarnos en el esquema más grande de las cosas."
 greenland_subterfuge_event.1.o1: "Gracias por su generosidad"
 greenland_subterfuge_event.1.o2: "Esto es bueno para ser verdad, denegado"
 greenland_subterfuge_event.2.t: "Islandia acepta nuestra generosidad"
 greenland_subterfuge_event.2.d: "Con el gobierno islandés aceptando nuestras sólidas inversiones, ahora podemos utilizar esas inversiones para perturbar la paz y cambiar el status quo lo suficiente como para aislar la isla de la interferencia de la OTAN."
 greenland_subterfuge_event.2.o1: "Ahora esperamos."
 greenland_subterfuge_event.3.t: "Descubrir la fuente"
 greenland_subterfuge_event.3.d: "Los ajustes recientes de disturbios y el discurso social parecen estar rastreando ciertas inversiones de Groenlandia. Estos nuevos frentes han creado una ligera incomodidad en nuestra sociedad, sin embargo si dejamos que se siente podríamos estar mirando algunos problemas reales por la carretera. Sería arriesgado, pero podemos elegir luchar contra los continuos shenanigans o podemos resolver el problema permanentemente al derrotar la causa raíz."
 greenland_subterfuge_event.3.o1: "¿Incluso tienen un ejército?"
 greenland_subterfuge_event.3.o2: "Tenemos la OTAN, estaremos bien."
 greenland_subterfuge_event.10000.t: "Inversión denegada"
 greenland_subterfuge_event.10000.d: "Islandia ha negado nuestra mejor oferta, si no aceptan entonces no tenemos más opción que prepararnos para lo peor."
 greenland_subterfuge_event.10000.o1: "Preparar la Operación Verde Real"
 greenland_subterfuge_event.4.t: "Gran inversión en Groenlandia"
 greenland_subterfuge_event.4.d: "Groenlandia nos ha venido con una oferta. Una inversión integral y un acuerdo comercial exclusivo. Groenlandia está dispuesta a construir nuestra infraestructura, capacidades de zonificación, base industrial civil y aparentemente proporcionar un arrendamiento exclusivo sobre el comercio necesario de apoyo material para dichas inversiones. El gancho final en toda la ballena de un paquete de inversión es una inversión directa a gran escala para construir y extraer depósitos conocidos de petróleo alrededor de nuestras aguas. Este es un trato extremadamente bueno y para ser franco hay muy poco que podemos ver mal con él. Pero al ser endeudados a una nación específica lo que haríamos con Dinamarca."
 greenland_subterfuge_event.4.o1: "Hagamos un trato!"
 greenland_subterfuge_event.4.o2: "No, esto no es correcto."
 greenland_subterfuge_event.5.t: "Islas Feroe acepta"
 greenland_subterfuge_event.5.d: "El gobierno de Faroe Islander ha aceptado nuestras inversiones abundantes y por lo tanto ahora podemos empezar a trabajar hacia nuestro futuro."
 greenland_subterfuge_event.5.o1: "Enviar a los agitadores"
 greenland_subterfuge_event.6.t: "Ciudadanos piden gobierno"
 greenland_subterfuge_event.6.d: "Los acontecimientos recientes han comenzado a escalar a medida que cada vez más ciudadanos de la isla piden al gobierno que celebre un referéndum sobre la formación de una Unión Nórdica Occidental con Groenlandia. Muchos citan el gesto aparentemente benevolente de las inversiones para el bienestar de los isleños sobre el enfoque mínimo danés. Con tanta presión nos vemos obligados a aceptar sus demandas y pediremos al gobierno de Groenlandia."
 greenland_subterfuge_event.6.o1: "Faroe Eternal"
 greenland_subterfuge_event.7.t: "El Gambit paga fuera"
 greenland_subterfuge_event.7.d: "La presión pública de los ciudadanos de Faroe ha obligado a su gobierno a pedir que forme un sindicato con nuestra nación. Esto nos va bien, ya que seguramente incitará algún tipo de agitación dentro del gobierno danés."
 greenland_subterfuge_event.7.o1: "Un paso más cerca"
 greenland_subterfuge_event.8.t: "¿Disculpe qué?"
 greenland_subterfuge_event.8.d: "Según informes, de alguna manera las Fuerzas Armadas de Groenlandia acaban de instalarse en las Islas Feroe y están trabajando con ciudadanos y funcionarios gubernamentales para transferir pacíficamente el poder. La pregunta es, quién les dio el derecho de hacerlo. No nos consultaron y parece que nuestro desinterés general en las islas sólo ha trabajado contra nosotros. Si no actuamos entonces perdemos la cara, pero si actuamos rápido estaremos solos ya que estamos instigando hostilidades directas."
 greenland_subterfuge_event.8.o1: "¡Podemos tomarlos!"
 greenland_subterfuge_event.8.o2: "¿Quién es justo?"
 greenland_subterfuge_event.40000.t: "Inversión denegada"
 greenland_subterfuge_event.40000.d: "Islas Faroe ha negado nuestra mejor oferta, si no aceptan entonces no tenemos más opción que prepararnos para lo peor."
 greenland_subterfuge_event.40000.o1: "Inicio Movilización"
 greenland_subterfuge_event.9.t: "Inversiones groenlandesas"
 greenland_subterfuge_event.9.d: "Groenlandia ha venido a nosotros con una serie de inversiones sin costo para nosotros. Quieren centrarse en el desarrollo de las áreas menos desarrolladas de la región Jylland y fomentar la solidaridad nórdica. Sin embargo, algunos en el gobierno creen que están buscando una agenda oculta, ya que las inversiones parecen casi demasiado buenas para ser verdad. Entonces otra vez, ¿qué puede hacer Greenland realistamente con nosotros?"
 greenland_subterfuge_event.9.o1: "Estupendo libre no es medio malo"
 greenland_subterfuge_event.9.o2: "No me gustan tus palabras cómicas"
 greenland_subterfuge_event.10.t: "Dinamarca acepta"
 greenland_subterfuge_event.10.d: "El gobierno danés ha aceptado las inversiones y ahora empezaremos a prepararnos para lo que planeamos."
 greenland_subterfuge_event.10.o1: "La pelota está en su corte ahora"
 greenland_subterfuge_event.11.t: "Descubriendo la fuente"
 greenland_subterfuge_event.11.d: "Los ajustes recientes de disturbios y el discurso social parecen estar rastreando ciertas inversiones de Groenlandia. Estos nuevos frentes han creado una ligera incomodidad en nuestra sociedad, sin embargo si dejamos que se siente podríamos estar mirando algunos problemas reales por la carretera. Sería arriesgado, pero podemos elegir luchar contra los continuos shenanigans o podemos resolver el problema permanentemente al derrotar la causa raíz."
 greenland_subterfuge_event.11.o1: "¿Acaso tienen un ejercito?"
 greenland_subterfuge_event.11.o2: "Tenemos a la OTAN, Estaremos bien"
