 greenland_subterfuge_event.90000.d: "Dinamarca ha negado nuestra mejor oferta, si no aceptan entonces no tenemos más opción que prepararnos para lo peor."
 greenland_subterfuge_event.90000.o1: "Preparar la Operación Mannerheim"
 greenland_subterfuge_event.12.t: "Inversiones Groenlandesas"
 greenland_subterfuge_event.12.d: "Groenlandia ha venido a nosotros con una serie de inversiones sin costo para nosotros. Quieren centrarse en el desarrollo de las zonas menos desarrolladas de la región Nord-Norge y fomentar la unidad y la prosperidad nórdicas. Sin embargo, algunos en el gobierno creen que están buscando una agenda oculta, ya que las inversiones parecen casi demasiado buenas para ser verdad. Entonces otra vez, ¿qué puede hacer Greenland realistamente con nosotros?"
 greenland_subterfuge_event.12.o1: "Puedo estar de acuerdo en liberarme."
 greenland_subterfuge_event.12.o2: "Lo estamos haciendo bien, Muchas Gracias"
 greenland_subterfuge_event.13.t: "Noruega acepta"
 greenland_subterfuge_event.13.d: "El gobierno noruego ha aceptado las inversiones y ahora empezaremos a prepararnos para lo que planeamos con la población civil para distanciar a la nación de la OTAN."
 greenland_subterfuge_event.13.o1: "Veremos que pueden hacer"
