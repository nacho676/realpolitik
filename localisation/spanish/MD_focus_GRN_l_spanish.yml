 greenland_subterfuge_event.150000.d: "Suecia ha denegado nuestra mejor oferta, si ellos no aceptan entonces no tendremos otro remedio para prepararnos para lo peor."
 greenland_subterfuge_event.150000.o1: "Prepare Operación Gran Guerra del Norte"
 greenland_subterfuge_event.18.t: "Inversiones Groenlandesas"
 greenland_subterfuge_event.18.d: "Groenlandia ha venido a nosotros con una serie de inversiones sin costo para nosotros. Quieren centrarse en el desarrollo de la región septentrional menos desarrollada de Lappi y fomentar la unidad y la prosperidad nórdicas. Sin embargo, algunos en el gobierno creen que están buscando una agenda oculta, ya que las inversiones parecen casi demasiado buenas para ser verdad. Entonces otra vez, ¿qué puede hacer Greenland realistamente con nosotros?"
 greenland_subterfuge_event.18.o1: "Un trato que tenemos buen señor"
 greenland_subterfuge_event.18.o2: "Creo que no en este momento"
 greenland_subterfuge_event.19.t: "Finlandia acepta"
 greenland_subterfuge_event.19.d: "El gobierno finlandés ha aceptado las inversiones y ahora empezaremos a prepararnos para alcanzar nuestros objetivos aislando al gobierno y haciendo que la población sea más receptiva a una mayor unión nórdica."
 greenland_subterfuge_event.19.o1: "Esfuérzate para una conclusión de sonido"
