l_spanish:
 greenland_focus: "Árbol de enfoque Groenlandés"
 GRN_intro_to_greenland_shortcut: "Introducción a Groenlandia"
 GRN_greenland_foreign_policy_tree: "Política exterior de Groenlandia"
 GRN_focus_The_Great_Ice_Island: "La Gran Isla de Hielo"
 GRN_focus_The_Great_Ice_Island_desc: "Groenlandia es una de las islas más grandes del mundo, después del continente australiano. La isla alberga a unos 58.000 habitantes, pertenecientes principalmente al grupo cultural inuit. Groenlandia es considerada la última gran frontera del desarrollo mundial, solo superada por la exploración de los polos norte y sur del planeta. En el siglo XXI, Groenlandia y su gente se ven a sí mismos como la última colonia auténtica y buscan activamente la verdadera independencia. Pero, ¿lograrán finalmente su libertad o fracasarán en su intento de demostrar que la isla puede valerse por sí misma?"
 GRN_focus_The_People: "La Gente"
 GRN_focus_The_People_desc: "Uno de los problemas fundamentales que aquejan a nuestra nación es la escasez de población. La gente necesita alimentos, vivienda y servicios públicos que les brinden atención y ayuda cuando la necesiten. Por ello, debemos abordar estas necesidades para asegurar un futuro en el que la gente desee venir y quedarse en nuestro país, para que puedan construir su propio futuro en lo que podría parecer un lugar sin futuro."
 GRN_focus_Food_Security: "Seguridad Alimentaria"
 GRN_focus_Food_Security_desc: "Nuestra principal fuente de alimento en la isla es la pesca. Pero la pesca también representa nuestro principal cuello de botella económico, así que ¿cómo podremos alimentarnos si además importamos lo mismo? Este es uno de los pilares fundamentales que debemos establecer si queremos tener un futuro estable."
 GRN_focus_Breaking_Ground_For_Farmlands: "Tierra de ruptura para «Farmlands»"
 GRN_focus_Breaking_Ground_For_Farmlands_desc: "Invernaderos y proyectos de agricultura vertical. Estas grapas serán la base de los nuevos suministros alimentarios de nuestra nación y, como tal, necesitamos crear el aparato para cultivar y cultivar estos alimentos. Mientras que el proceso será intensivo en energía, si configuramos nuestra infraestructura y volvemos a ver nuestros recursos podríamos mezclar algunos conceptos básicos para hacer rodar la pelota."
 GRN_focus_East_Farmland_Projects: "Proyectos de East «Farmland»"
 GRN_focus_East_Farmland_Projects_desc: "Al igual que con nuestro trabajo inicial de la fundación occidental, tendremos que hacer lo mismo en el este. Pequeños centros alimentarios para ayudar con la logística y la distribución en todo el país y nuestros asentamientos bastante escasos."
 GRN_focus_Growing_Staple_Foods: "Cultivo de alimentos básicos"
 GRN_focus_Growing_Staple_Foods_desc: "Nuestros primeros desarrollos en proyectos de agricultura dura verán realmente sólo alimentos básicos que se cultivan por el momento. Las patatas, el trigo y una pequeña cantidad de alimentos básicos que ayudan con la ingesta calórica y son fáciles de estirar la comida sabia."
 GRN_focus_Strategic_Cash_Crops: "Cobros estratégicos de efectivo"
 GRN_focus_Strategic_Cash_Crops_desc: "El programa SCC es un rincón limitado de nuestros nuevos HFP, ya que tratamos de reforzar el suministro de alimentos domésticos de las naciones, también podemos contemplar cultivos comerciales limitados como algodón y como una forma de fomentar el crecimiento industrial nacional."
 GRN_focus_National_Seed_Vault: "Nacional Seed Vault"
 GRN_focus_National_Seed_Vault_desc: "A medida que expandemos nuestros HFPs tanto a escala nacional como en operaciones locales, debemos poder diversificar y ampliar los tipos de cultivos que podemos cultivar. Como tal crearemos una bóveda nacional de semillas para preservar y distribuir adecuadamente los cultivos rotatorios para que nuestra nación pueda disfrutar tanto de las recompensas del mundo como sea posible."
 GRN_focus_Stable_Population_Growth: "Crecimiento Demográfico Estable"
 GRN_focus_Stable_Population_Growth_desc: "Nuestra nación sobre toda su existencia se ha visto obstaculizada por la incapacidad de estabilizar a la población. Muchos huyen debido a las duras condiciones o para ver el mundo más amplio. Lo que deja ser real, no podemos culparlos por querer más en sus vidas, pero podemos culparnos por no trabajar para dar a la gente las razones de quedarse. No podemos hacer nada sobre el clima, pero podemos desarrollar ciudades y asentamientos para ser más convincentes para que la gente quiera quedarse y ayudar a mejorar sus hogares."
 GRN_focus_Planning_New_Settlements: "Planificación de nuevos asentamientos"
 GRN_focus_Planning_New_Settlements_desc: "La capacidad de cultivar nuestra población se ve obstaculizada por la vivienda adecuada y la planificación de nuevas ciudades en su conjunto. Todo se forma principalmente alrededor de la capital de Nuuk así que en estas primeras etapas de planificación y desarrollo tendremos que utilizar el capital como base desde la cual a la logística del ferry desde entonces."
 GRN_focus_Spread_Settlement_Planning_East: "Planificación de asentamientos en el este"
 GRN_focus_Spread_Settlement_Planning_East_desc: "Mientras que la capital de Nuuk es nuestra base logística para la parte occidental de la isla, tendremos que establecer una especie de «capital oriental» per se. De esta manera, la mitad oriental también tiene un centro logístico para planificar y distribuir la capacidad de desarrollo y crecimiento de los asentamientos de las dos regiones principales de la nación."
 GRN_focus_New_Hope_Settlement: "Nueva Solución de Esperanza"
 GRN_focus_New_Hope_Settlement_desc: "Para esforzarnos por un mejor mañana, un futuro mejor y una vida mejor para nuestros ciudadanos, nos propusimos establecer un nuevo asentamiento centralmente noroccidental llamado Neriunneq nutaaq o en inglés, aproximadamente se traduce a Nueva Esperanza. Deseamos hacer esto un faro de nuestro progreso en el desarrollo de la nación y la mitad occidental de la isla."
 GRN_focus_Great_Star_Settlement: "Gran asentamiento de estrellas"
 GRN_focus_Great_Star_Settlement_desc: "Para tratar de dispersar uniformemente nuestro desarrollo y asegurar incluso las necesidades logísticas a través de nuestros continuos esfuerzos de desarrollo, crearemos un asentamiento oriental alrededor de la misma zona lateral que el asentamiento occidental. Se llama Annertuumik Stjerne, que se traduce aproximadamente en inglés como Gran Estrella o «Big Star», esperamos utilizar esto como base oriental central como una manera de comenzar a difundir los esfuerzos de desarrollo mientras manejamos el crecimiento costero y miramos hacia dentro hacia la Gran Estante de Hielo."
 GRN_focus_Development_Living_Grants: "Desarrollo Subvenciones vitales"
 GRN_focus_Development_Living_Grants_desc: "El programa DLG es un gobierno emitido subsidio para fomentar la inmigración a la nación. El principio fundamental es que la subvención sufragará los gastos de viaje y los gastos de asentamiento. Una vez que el individuo o las personas sean asentados y sean ayudados a colocarse en un lugar de trabajo donde tengan un ingreso estable, entonces la subvención se detendrá. Esencialmente su inversión a través de los recursos humanos para fomentar el crecimiento demográfico mediante el desarrollo activo de la nación."
 GRN_focus_Developing_Public_Services: "Desarrollo de los servicios públicos"
 GRN_focus_Developing_Public_Services_desc: "Mejorar y ampliar nuestros sistemas públicos e infraestructura mejorará enormemente la calidad de vida de nuestros ciudadanos. Haremos una pequeña cantidad de mejoras en la educación, la salud, el bienestar y desarrollaremos un servicio de Internet más seguro para el futuro de nuestra nación."
 GRN_focus_Recruiting_More_Teachers: "Emplear a mas profesores"
 GRN_focus_Recruiting_More_Teachers_desc: "Un gran problema en nuestro sistema educativo es la falta de personal docente. Con clases cada vez más grandes por profesor, muchos estudiantes están abandonando simplemente porque no tienen una manera real de aprender. Como tal, debemos reclutar y tratar de conseguir que más maestros tanto nacionales como extranjeros vengan y ayuden a enseñar y cultivar a nuestros hijos. Es de esperar que esta clave desbloquee un futuro más brillante para todos los que pueden esperar aprender y crecer a partir de la obtención de una educación."
 GRN_focus_Improving_Medical_Stockpiles: "Mejora de las existencias médicas"
 GRN_focus_Improving_Medical_Stockpiles_desc: "Medicamentos, Personal y equipamiento. Estas son las principales cosas que necesitaremos para atender apropiadamente las necesidades sanitarias de nuestra población. Así como debemos mejorar nuestra capacidad de almacenamiento y el manejo para asegurar que podemos atender cualquier necesidad que pudiera surgir."
 GRN_focus_Creating_Concentrated_Internet_Services: "Crear servicios de Internet concentrados"
 GRN_focus_Creating_Concentrated_Internet_Services_desc: "El acceso a Internet en su conjunto es prácticamente un elemento básico de las sociedades modernas y las economías desarrolladas. Debemos establecer algunas formas limitadas de un aparato de Internet para asegurar que nuestra nación pueda conectarse mejor con el mundo más amplio. Nuestros ciudadanos y servicios públicos también podrían beneficiarse pasivamente de la eficiencia que los servicios de Internet podían proporcionar en ciertas áreas."
 GRN_focus_Recruiting_More_Social_Workers: "Emplear a mas trabajadores sociales"
 GRN_focus_Recruiting_More_Social_Workers_desc: "Mejorar la cantidad y calidad de personal asegurará que nuestros servicios sociales estén a la altura de las necesidades del país, ya que la población potencialmente se expande con nuestros esfuerzos de desarrollo. Mientras que el costo es algo de lo que preocuparse, no significa nada si terminamos asustando a la gente si saben que no se cuidarían cuando es realmente necesario."
 GRN_focus_Basic_Eastern_Roadworks: "Trabajos básicos de la carretera oriental"
 GRN_focus_Basic_Eastern_Roadworks_desc: "Con el este siendo la región más subdesarrollada de la nación, debemos darles un impulso mejorando su apoyo logístico a través de caminos mejorados. Si bien no significa lo más importante en términos de prioridades, a medida que seguimos desarrollando y creciendo la región sería beneficioso establecer anticipadamente el marco que pueden seguir por falta de mejores palabras."
 GRN_focus_Greenlandic_Economy: "Economía de Groenlandia"
 GRN_focus_Greenlandic_Economy_desc: "La gente necesita materiales, necesitan una manera de vivir y necesitan la capacidad para trabajar y ganarse la vida. Como tal el desarrollo de la economía, será necesario planificar e invertir en la capacidad de extraer recursos y desarrollar la infraestructura para apoyar estas cosas."
 GRN_focus_Economic_Diversification: "Diversificación Económica"
 GRN_focus_Economic_Diversification_desc: "Con la limitación de nuestra nación en muchos factores debemos desarrollar y asegurar que se establezcan las bases para que podamos ampliar los medios de nuestra economía. Simplemente tener pesca o cerca de estilos feudales de sustentación económica va a conseguir la nación y su pueblo en ninguna parte. Debemos arreglar esto."
 GRN_focus_Western_Zoning: "Zonificación Occidental"
 GRN_focus_Western_Zoning_desc: "La capital está situada en el oeste, así que comenzaremos las primeras etapas de nuestra zonificación y desarrollo por ahí. El estudio de la tierra para la estabilidad y las necesidades, así como los medios para conseguir una industria dedicada en funcionamiento, costará mucho más de lo habitual. Pero si vamos a luchar contra los elementos en su más duro entonces debemos soportar y comprender el costo que tendrá."
 GRN_focus_Eastern_Groundworks: "Oriental Groundworks"
 GRN_focus_Eastern_Groundworks_desc: "Si alguna vez vamos a llegar a cualquier lugar económicamente, así como crecimiento demográfico o al mínimo, estabilidad, entonces debemos utilizar todas las tierras disponibles que tenemos. Como tales trabajos iniciales para nuestros proyectos orientales serán esenciales en estas primeras etapas de planificación."
 GRN_focus_Basic_Industrialization: "Industrialización Básica"
 GRN_focus_Basic_Industrialization_desc: "Con las bases y la zonificación completadas podemos establecer pequeñas pero fundamentales manufacturas que la nación necesitará en el futuro. Por supuesto hasta que podamos averiguar la situación minera tendremos que depender de las importaciones para materiales. Gracias a Dios podemos usar nuestra conexión con la UE a través de Dinamarca para ayudarnos en este asunto."
 GRN_focus_Basic_Coastal_Manufacturing: "Fabricación costera básica"
 GRN_focus_Basic_Coastal_Manufacturing_desc: "Si bien complementamos las prácticas pesqueras existentes, también podemos establecer la métrica para crear nuestros propios buques comerciales para los que podamos utilizar tanto en Dinamarca como en aquellos que desean ayudarnos a desarrollar y crecer como nación."
 GRN_focus_Babys_First_Economy: "Primera Economía del bebé"
 GRN_focus_Babys_First_Economy_desc: "Ahora tenemos una base básica para establecer el escenario para que la gente venga y trabaje. Ahora solo necesitamos desarrollar infraestructura para apoyar al pueblo y otras siete cuestiones críticas que estancan a la nación. Pero los pasos del bebé, los pasos del bebé, llegaremos allí algún día."
 GRN_focus_Infrastructure_Development: "Desarrollo de la Infraestructura"
 GRN_focus_Infrastructure_Development_desc: "La mejor manera de conectar y crecer nuestra nación es establecer un aparato de infraestructura estandarizado y flexible. Para ello, tendremos que contratar a expertos en geología, ingeniería, etc. para planificar alrededor de los tipos de infraestructura que necesitamos. También necesitaremos saber cómo es la mejor manera de desarrollarlo y planificarlo a más largo plazo posible antes de que se necesiten cambios."
 GRN_focus_The_Network_Debate: "El debate de la Red"
 GRN_focus_The_Network_Debate_desc: "Establecer una red de carreteras adecuada será tan difícil como cualquier cosa que estemos tratando de hacer. Como tal, tendremos que estudiar y sentar las bases para el comienzo de lo que nuestros caminos se verán. Como tal a partir de la capital de Nuuk ayudará a establecer un estándar así como crear al menos en las zonas costeras occidentales, el corazón latido para el cual bombea recursos y personas en todas las tierras."
 GRN_focus_Narrow_Gauge_Standard: "El estándar de calibración estrecha"
 GRN_focus_Narrow_Gauge_Standard_desc: "La creación de la norma nacional para el equipo ferroviario y los viajes establecerá el ritmo y la línea de base para cómo desarrollamos nuestros ferrocarriles en el futuro. Utilizando Narrow Gauge nos permite ser más flexibles con el terreno, es más barato construir y mantener sabio así como será más rentable para asegurar adecuadamente la estructura y fundación de la cama de pista."
 GRN_focus_Capital_Course: "Curso de capital"
 GRN_focus_Capital_Course_desc: "Partiendo de la capital y sucursando en asentamientos más pequeños permitirá una mayor facilidad de viaje y una mejor conectividad a lo largo de distancias medias. Por supuesto que esto es simplemente un solo paso, pero tienes que poner un pie delante del otro sólo para caminar por el suelo, ahora no lo haces."
 GRN_focus_Nuuk_Western_Railway: "Ferrocarril occidental de Nuuk"
 GRN_focus_Nuuk_Western_Railway_desc: "Con el establecimiento de la NWR en Groenlandia ahora podemos conectar mejor los asentamientos dispersos en la región cercana a la capital, así como utilizarlo como base para futuros esfuerzos tanto en las necesidades económicas como en el transporte de personal de la nación."
 GRN_focus_Infrastructure_Infancy: "Infraestructura"
 GRN_focus_Infrastructure_Infancy_desc: "Con estos pasos cruciales pero simples para iniciar nuestra infraestructura nacional, ahora podemos establecer un nuevo y cambiante precedente hacia el crecimiento y desarrollo de estas tierras para las que controlamos."
 GRN_focus_Ministry_For_Mineral_Affairs: "Ministerio de Asuntos Minerales"
 GRN_focus_Ministry_For_Mineral_Affairs_desc: "El Ministerio de Asuntos Minerales o MMA como algunos les gusta llamarlo con gusto, es un organismo gubernamental dedicado que contratará a expertos en geología, integridad estructural y prácticas mineras generales para asegurar que las inversiones básicas iniciales en la extracción de nuestros recursos nacionales se hagan de manera segura y eficaz desde el principio. Esto asegurará que todas las expansiones sean acordes con el precedente establecido en estos primeros días."
 GRN_focus_Domesticating_Energy_Needs: "Necesidades nacionales de energía"
 GRN_focus_Domesticating_Energy_Needs_desc: "Nuestra nación necesita energía en principio. Para calefacción, electricidad y necesidades básicas para la economía y sus cadenas de suministro. Como tal, buscaremos algunos depósitos de carbón y comenzaremos operaciones mineras estratégicas para reducir las importaciones y mejorar las condiciones internas."
 GRN_focus_Limited_Strategic_Resource_Extraction: "Extracción limitada de recursos estratégicos"
 GRN_focus_Limited_Strategic_Resource_Extraction_desc: "El esfuerzo de LSRE es un plan para desarrollar pequeñas operaciones de metal pesado o mineras minerales más estratégicas dentro de la nación. Cosas como Titanium que se encuentra no muy lejos de la capital en sí, pero también tiene algunos depósitos decentes hacia el este si quisiéramos seguirlos."
 GRN_focus_Cornerstone_Creation: "Creación de piedras angulares"
 GRN_focus_Cornerstone_Creation_desc: "Aparte del hormigón, uno de los pilares principales de una economía moderna es su capacidad para producir acero. Bueno tenemos depósitos de carbón y mineral de hierro, así que por qué no empezar el primer molino de acero del bebé. Puede ser pequeño, pero sin duda podremos utilizar los materiales para el desarrollo de nuestra nación."
 GRN_focus_Extracting_Natural_Capital: "Extracción de capital natural"
 GRN_focus_Extracting_Natural_Capital_desc: "Hay oro en ellos colinas que dicen. Bueno, dicen que es correcto y el oro se puede utilizar para mucho más que llevarse encima. Este «capital libre» más o menos nuestro puede ser utilizado para instigar proyectos futuros y ayudar con la estabilización de presupuestos que requieren más de inversiones habituales."
 GRN_focus_Securing_Mining_Futures: "La garantía de futuros mineros"
 GRN_focus_Securing_Mining_Futures_desc: "Tratar con cinta roja, ajustar regulaciones y poner más énfasis en operaciones mineras orientadas a la energía nos permite cubrir múltiples aves con una roca densa energía."
 GRN_focus_The_Future: "El futuro"
 GRN_focus_The_Future_desc: "Fijar el presente es la máxima prioridad, pero no se puede simplemente fijar el presente sin prepararse para el futuro. Como tal, el objetivo final último para nuestra nación será asegurar el futuro no sólo de los que están en las zonas costeras sino crear y construir un futuro para aquellos que quieren vivir en la plataforma. Después de todo, el hielo es agua congelada y ahora podemos destilar agua fresca no podemos."
 GRN_focus_Coastal_Economic_Zones: "Zonas económicas costeras"
 GRN_focus_Coastal_Economic_Zones_desc: "El objetivo final último para un futuro creciente para Groenlandia es nuestra capacidad de domesticar el interior. Ahora muchos dicen que no puedes vivir con hielo y a eso decimos, por supuesto. Sin embargo, lo que es hielo pero agua dulce y cómo obtenemos el agua del hielo, bueno lo derretamos. Como tal, debemos desarrollar zonas económicas selectivas en la costa para establecer el escenario y darnos las capacidades fiscales para iniciar procesos de destilación de la plataforma de hielo. Será un asunto largo y tedioso, pero la marcha lenta hacia el norte por las tierras del interior está sobre nosotros si sostenemos el poder de voluntad para hacer como tal."
 GRN_focus_Foreign_Logistics_Hub_One: "Centro de Logística Exterior número uno"
 GRN_focus_Foreign_Logistics_Hub_One_desc: "La ubicación más central hacia la creación de una zona económica en la costa es en realidad el punto sur más lejano de la isla. No lejos de Tasiusaq usaremos algunos de los fiordos más suaves para moldear y crear un extenso puerto y puerto «ciudad» como aparato. Este terreno de estancamiento ayudará con los avances occidentales en el gran trek norte."
 GRN_focus_Foreign_Logistics_Hub_Two: "Centro de Logística Exterior número dos"
 GRN_focus_Foreign_Logistics_Hub_Two_desc: "Suplementando la ubicación más central hacia el establecimiento de una zona económica en la costa. Estableceremos un aparato similar cerca de la ciudad de Itilleq. Este terreno de estancamiento ayudará con los avances del este en la gran caminata norte y combinando las dos zonas meridionales en una CCEZ o Zona Económica Costera Conectada."
 GRN_focus_West_Hub_Distillation_Facility: "Instalación de destilación West Hub"
 GRN_focus_West_Hub_Distillation_Facility_desc: "El establecimiento de una instalación integral de destilación para comenzar las operaciones de extracción del hielo de la plataforma de hielo nos permitirá aumentar el suministro interno de agua y permitirnos crear un camino hacia el norte a través de la plataforma de hielo. Este proceso será costoso y nos exigirá importar personal por un período prolongado hasta que podamos entrenar y contratar a los locales. Pero el objetivo a largo plazo del desarrollo y la usabilidad de las tierras encerradas bajo los desechos congelados valdrá la pena."
 GRN_focus_East_Hub_Distillation_Facility: "Instalación de destilación del centro oriental"
 GRN_focus_East_Hub_Distillation_Facility_desc: "Ampliando sobre el uso general de la CCEZ que hemos creado, la segunda instalación principal de destilación para complementar los avances occidentales está ahora bajo trabajos. Como East Hub Distillation hará lo mismo pero trabajará hacia el progreso oriental a través de un empuje unido hacia el norte."
 GRN_focus_Southern_Fjords_Railway: "Ferrocarril de las Fjords del Sur"
 GRN_focus_Southern_Fjords_Railway_desc: "Establecer un ferrocarril en la región nos permite no sólo conectar mejor toda la CCEZ, sino que también puede ayudarnos a transportar el suministro de agua a diferentes áreas del sur para uso residencial y comercial cuando sea posible."
 GRN_focus_Staging_Zones_For_The_Shelf: "Zonas de Estadificación para el Estante"
 GRN_focus_Staging_Zones_For_The_Shelf_desc: "Configurando nuestra gran ambición de domar a la Gran Estante de Hielo, primero debemos establecer zonas estratégicas de estadificación para asegurarnos de que podamos realmente utilizar las aguas congeladas en lugar de simplemente tirarlas a los océanos."
 GRN_focus_The_Great_Eastern_Staging_Grounds: "Las Grandes Tierras de Estadificación del Este"
 GRN_focus_The_Great_Eastern_Staging_Grounds_desc: "El este es el menos poblado de la isla, con esto en mente que significa que tendremos que contratar a expertos para vivir esencialmente y establecer el trabajo de tierra para la eventual marcha hacia las tierras del Gran Estante de Hielo. Con esto vamos a utilizar la isla de Tingmiarmit como un escenario clave y empezar por extraer y suavizar el terreno en la costa inmediata en la propia isla principal."
 GRN_focus_Capital_Staging_Works: "El estancamiento de la capital funciona"
 GRN_focus_Capital_Staging_Works_desc: "La región alrededor de la capital de Nuuk es una de las zonas más desarrolladas de la isla. Como tal, tiene sentido entonces que los principales terrenos de estadificación occidental se establezcan en la zona capital. Un campus dedicado y completo de plantas destilación, centros de investigación y desarrollo, así como un considerable estipendio gubernamental a expertos en importación y maestros para permitir la eventual entrega de los terrenos a Groenlandia. Esto tomará una cantidad considerable de tiempo y recursos, pero fundir todo el agua congelada y descubrir la verdadera roca de la isla interior no es tarea pequeña para contemplar."
 GRN_focus_Meeting_Needs: "Necesidades de reunión"
 GRN_focus_Meeting_Needs_desc: "Para crear un aparato tan elaborado como pretendamos, debemos establecer cadenas locales de suministro o al menos lo más local posible. Las pequeñas empresas para satisfacer las necesidades industriales y comerciales complementarán el desarrollo de los terrenos de estancamiento y, como tal, establecerán las normas para el eventual empuje hacia adentro."
 GRN_focus_Supplying_Outposts: "Puestos de suministro"
 GRN_focus_Supplying_Outposts_desc: "Aunque oficialmente Groenlandia no tiene fuerza militar, si vamos a tener algún camino razonable para crear una línea de suministro en la Gran Plataforma, entonces debemos asegurar que se satisfagan todo tipo de necesidades de suministros. Como tal, estableceremos una industria de armas extremadamente menor que se moldee alrededor del suministro de puestos avanzados con armas y municiones útiles para la caza y defensa propia de los posibles saqueadores. Después de todo, en medio de la nada, que puede oírte gritar."
 GRN_focus_General_National_Investments: "Inversiones nacionales generales"
 GRN_focus_General_National_Investments_desc: "La minería, el transporte y las mejoras generales deben hacerse para la estabilidad fiscal e interna de nuestra nación. Con los escenarios establecidos y las bases que comienzan en serio, ahora tenemos nuestro teatro para el cual comenzaremos el juego de nuestros pueblos mientras domamos a la Gran Estante de Hielo en los próximos años. Con esto también las compañías ferroviarias NWR y SFR estarán vinculadas para formar el Great Western Fjords Railway o GWFR."
 GRN_focus_Greater_Greenland_Act: "Ley de Groenlandia"
 GRN_focus_Greater_Greenland_Act_desc: "Dedicada financiación para mejorar las familias de la nación, así como buscar a aquellos de orígenes culturales y étnicos similares que puedan querer vivir en un reino más unido entonces lo hacen actualmente. Esta sección del acto está dedicada a la población de la Región Occidental."
 GRN_focus_Eastern_Population_Act: "Ley de población oriental"
 GRN_focus_Eastern_Population_Act_desc: "Dedicada financiación para mejorar las familias de la nación, así como buscar a aquellos de orígenes culturales y étnicos similares que puedan querer vivir en un reino más unido entonces lo hacen actualmente. Esta sección del acto está dedicada a la población de la Región Oriental de la Ley Greater Greenland."
 GRN_focus_Battle_For_Independence: "Batalla para la independencia"
 GRN_focus_Battle_For_Independence_desc: "Hemos alcanzado un cruce de caminos. El Parlamento danés ha comenzado a adoptar medidas relacionadas con nuestra condición de nación. Independientemente de que sea un movimiento positivo o negativo, tendremos que asegurarnos y así empezaremos a invertir fuertemente en campañas de presión para elevar nuestro reconocimiento entre las naciones y esperar que podamos forzar más o menos la mano de una resolución pacífica a la independencia."
 GRN_focus_Rushed_Mobilization_Efforts: "Apurados esfuerzos de movilización"
 GRN_focus_Rushed_Mobilization_Efforts_desc: "Hemos decidido que ya no queremos inclinarnos ante la maniobra opresiva danesa. Como tal vamos a movilizar apresuradamente el mínimo que sabemos que tendremos que defender la isla de cualquier incursión danesa seria."
 GRN_focus_Organizing_Fundamentals_In_Training: "Organizar Fundamentos en Formación"
 GRN_focus_Organizing_Fundamentals_In_Training_desc: "Arrasando el establecimiento de una instalación básica de entrenamiento, vamos a necesitar esto para dar los cursos más rápidos de choque si queremos defender nuestra isla de la fuerza de invasión entrante."
 GRN_focus_If_It_Floats_Its_A_Boat: "Si Flotas, es un barco"
 GRN_focus_If_It_Floats_Its_A_Boat_desc: "La marina danesa probablemente dirigirá la carga para apoderarse de la isla. Si bien será costoso, debemos reunir algo para detenernos por el tiempo si alguna vez vamos a ser considerados como una nación seria en la etapa mundial."
 GRN_focus_Removing_The_Last_Loose_Ends: "La eliminación de los últimos extremos del lazo"
 GRN_focus_Removing_The_Last_Loose_Ends_desc: "Mediante la separación de nuestros vínculos con la Corona danesa ahora somos nuestra propia nación y por lo tanto no tenemos los privilegios originales que el estatus colonial que una vez tuvimos. Como tal, vamos a necesitar reorganizar ciertos aspectos y buscar para reparar posibles déficits que podemos encontrar."
 GRN_focus_Stabilizing_Domestic_Short_Comings: "Estabilización de las comunicaciones cortas domésticas"
 GRN_focus_Stabilizing_Domestic_Short_Comings_desc: "Reorganización de los esfuerzos administrativos y la racionalización de todos los servicios gubernamentales bajo nuestro gobierno nacional nos permitirá captar una imagen real de la situación actual"
 GRN_focus_Greenland_Armed_Services: "Servicios armados de Groenlandia"
 GRN_focus_Greenland_Armed_Services_desc: "Con nuestra nueva independencia ahora tenemos la defensa totalmente bajo nuestro control. No tenemos mucho, pero tenemos que empezar a alguna parte. ¿Verdad?"
 GRN_focus_A_New_Chapter: "Un nuevo capítulo"
 GRN_focus_A_New_Chapter_desc: "A partir de hoy giramos una hoja nueva. Nos esforzamos por construir, prosperar y mejorar tanto la nación como la vida de nuestros ciudadanos para que así podamos establecer rumbo a un futuro más brillante para todos los que desean ver y vivir en Groenlandia."
 GRN_focus_Northern_Political_Lights: "Luces políticas del norte"
 GRN_focus_Northern_Political_Lights_desc: "Con nuestras nuevas libertades encontradas ahora podemos abrir las puertas a aquellos que deseen postularse para su cargo. Por supuesto, esto significa que también tendremos que tratar con aquellos que quieren potencialmente abusar del sistema. Sin embargo, somos una nación de valor democrático y como tal pondremos nuestra confianza en el sistema y el pueblo."
 GRN_focus_Atassut_Claims_Victory: "Atassut reclama la victoria"
 GRN_focus_Atassut_Claims_Victory_desc: "Antes de los días de independencia nuestra política había sido estancada. Todo el mundo se centró en estar libre del yugo danés. Bueno ahora que lo somos, podemos empezar a forjar un nuevo camino. Un camino de valores sociales estables que se mezcla con la mentalidad fiscalmente conservadora para equilibrar nuestra nación para el futuro."
 GRN_focus_Making_New_Greenlandic_Standards: "Hacer nuevas normas groenlandesas"
 GRN_focus_Making_New_Greenlandic_Standards_desc: "Reformar la educación alrededor de nuestro idioma nativo, mejorar el número de maestros y generalmente sólo elevar el bar por lo que nuestros estudiantes pueden hacer aumentará enormemente el potencial de nuestra nación."
 GRN_focus_Improving_Medical_Facilities: "Mejoramiento de las instalaciones médicas"
 GRN_focus_Improving_Medical_Facilities_desc: "Mediante mejoras generales de las adquisiciones, así como la mejora de los planes para plantar instalaciones médicas, podemos establecer un nuevo ritmo de atención y tratamiento con una mayor facilidad de navegación y acceso a los recursos necesarios."
 GRN_focus_Casting_Better_Social_Nets: "Casting mejores redes sociales"
 GRN_focus_Casting_Better_Social_Nets_desc: "La reforma de los programas sociales para permitir una mejor asignación de recursos asegurará a aquellos en nuestra nación que puedan estar bajo su suerte o simplemente al final de su viaje."
 GRN_focus_Domestic_Agriculture_Projects: "Proyectos de agricultura doméstica"
 GRN_focus_Domestic_Agriculture_Projects_desc: "Garantizar la agricultura doméstica significa tener una fuente de alimentos más estable. Esto junto con nuestros HFPs «Harsh Farming Projects», seguirá beneficiando y creciendo la economía y población de nuestra nación."
 GRN_focus_Increasing_Industrial_Development: "Aumento del desarrollo industrial"
 GRN_focus_Increasing_Industrial_Development_desc: "Crecer y diversificar constantemente nuestra economía permite un enfoque más estable y robusto tanto para los asuntos exteriores nacionales como potenciales."
 GRN_focus_General_Armaments: "Armamentos generales"
 GRN_focus_General_Armaments_desc: "Pequeñas inversiones para mejorar los armamentos tanto en la calidad como en las adquisiciones generales significa que nuestros servicios armados de triunfo estarán mejor defendiendo a nuestra nación y sus ciudadanos."
 GRN_focus_Growing_Power_Production: "Producción de energía creciente"
 GRN_focus_Growing_Power_Production_desc: "Mejorar nuestras capacidades de producción nacional de energía nos permite crecer nuestra economía, así como mejorar la calidad de vida de nuestros ciudadanos a través de la electricidad barata."
 GRN_focus_National_Alumina_Research_Institute: "Instituto Nacional de Investigación Alumina"
 GRN_focus_National_Alumina_Research_Institute_desc: "El complejo NARI es un Alumina dedicado y otro difícil de extraer centro de investigación y desarrollo mineral. El objetivo es encontrar maneras de mejorar y hacer más eficientes las formas en que pueden venir estos minerales. Alumina se encuentra principalmente en el mineral de Bauxite en alta concentración, sin embargo no tenemos bauxita. Pero tenemos muchos depósitos Feldspar que feldspar minerales tienden a tener casi hasta el 20% de su peso en Alumina y por lo tanto, a través de una medida más costosa somos capaces de asegurar un suministro doméstico. Pero su no mucho y Aluminio se utiliza en muchas cosas, por lo que debemos expandirnos tanto como sea posible en este campo."
 GRN_focus_Military_Investment_Package: "Paquete de Inversiones Militares"
 GRN_focus_Military_Investment_Package_desc: "Este paquete de inversión general va a mejorar la calidad del equipo, así como impulsar el pago de los soldados. Algunos de los fondos también se están reservando para mejorar la normalización de las instalaciones de capacitación en caso necesario."
 GRN_focus_Demokraatit_Secures_Victory: "Demokraatit asegura la victoria"
 GRN_focus_Demokraatit_Secures_Victory_desc: "El Partido Demokraatit ha tenido un largo casi bajo control como acercamiento a la política groenlandesa. Siendo bastante en línea con las dos partes principales hay diferencias sutiles que generalmente retroceden a la fiesta en una especie de «tercer lugar continuo». Sin embargo, eso cambia hoy como con nuestra victoria en la era de la independencia ahora podemos garantizar mejor a la nación y sus ciudadanos lo mejor de nuestra capacidad."
 GRN_focus_Economic_Assimilation_Visas: "Visados de asimilación económica"
 GRN_focus_Economic_Assimilation_Visas_desc: "Utilizando el sistema de visados para ayudar a desarrollar la nación y crecer de manera constante nuestra población ayudará enormemente a la futura planificación para la propia nación."
 GRN_focus_Improved_Community_Programs: "Mejora de los programas comunitarios"
 GRN_focus_Improved_Community_Programs_desc: "La comprensión común entre la policía y los ciudadanos que protegen es un motor de cohesión frente al discurso. Debemos asegurarnos de que se tomen medidas consistentes para mantener la mayor parte en la misma página así que si y cuando algo sucede, entonces no terminamos como los de América por ejemplo."
 GRN_focus_Rewriting_Mining_Regulations: "Reglamento de minería de reescritura"
 GRN_focus_Rewriting_Mining_Regulations_desc: "Las regulaciones relacionadas con las prácticas mineras se han acabado bruscamente, así como simplemente no coinciden con el estado actual de la nación. Como tal, tendremos que volver a enseñar cosas para poder estandarizar mejor la industria."
 GRN_focus_Hospice_Care_Funding: "Financiamiento de cuidados Hospice"
 GRN_focus_Hospice_Care_Funding_desc: "Proporcionar una financiación mejor y más dedicada para el cuidado de los hospicios asegurará que las familias puedan centrarse mejor en lo que necesitan hacer, sin tener que preocuparse por que sus ancianos sean descuidados debido a la simple vida cotidiana."
 GRN_focus_Creating_A_Basic_Office_Sector: "Creación de un sector básico de oficinas"
 GRN_focus_Creating_A_Basic_Office_Sector_desc: "Seguir diversificando nuestra economía significa que tendremos que invertir en pequeñas pero significativas industrias de oficina y tecnología como para asegurarnos de que podamos seguir mejorando nuestra nación y su forma de vida ciudadana."
 GRN_focus_Expanding_Existing_HFPs: "Ampliación de los HFP existentes"
 GRN_focus_Expanding_Existing_HFPs_desc: "Ampliar nuestros actuales Proyectos de Agriturismo Harsh a través de instalaciones agrícolas verticales y la infraestructura de destilación necesaria para abastecerles agua del Estante de Hielo creará un creciente suministro doméstico de alimentos, al tiempo que contribuirá a nuestro objetivo de entrar en el interior."
 GRN_focus_Growing_REM_Industries: "Crecientes industrias REM"
 GRN_focus_Growing_REM_Industries_desc: "Para mejorar nuestro valor geoestratégico tendremos que cultivar nuestras industrias REM o el sector de los metales Rare Eath. Las instalaciones de minería y procesamiento dirigidas nos permitirán utilizarlas como negociaciones para futuras transacciones comerciales."
 GRN_focus_Growing_Domestic_Arms_Production: "Producción creciente de armas domésticas"
 GRN_focus_Growing_Domestic_Arms_Production_desc: "Asegurar que podamos equipar a nuestros miembros de servicio con armamentos nos permite la comodidad en el entendimiento de que nuestros militares pueden y defenderán nuestras tierras de cualquier fuerza abusiva."
 GRN_focus_Expanding_Citizen_Development_Grants: "Ampliación de las subvenciones para el desarrollo ciudadano"
 GRN_focus_Expanding_Citizen_Development_Grants_desc: "El camino hacia la ciudadanía está marcado por una contribución única al desarrollo de la nación y, como tal, ampliaremos el programa del estipendio para aumentar la capacidad de los individuos en un momento que pueden venir y pasar por el camino y convertirse en nuevos ciudadanos groenlandeses."
 GRN_focus_Siumut_Wins_Once_More: "Siumut gana una vez más"
 GRN_focus_Siumut_Wins_Once_More_desc: "Una de las fiestas más largas es la del Partido Siumut. El partido ha celebrado la mayor parte de las victorias electorales en la era pre-independencia y parece que mantienen firme el curso en la era post-independencia. Ahora es el momento de enfocarnos en más que la independencia, ahora nos centramos en mejorar la vida ciudadana y obrera."
 GRN_focus_Encouraging_State_Sanctioned_Immigration: "Fomento de la inmigración sancionada por el Estado"
 GRN_focus_Encouraging_State_Sanctioned_Immigration_desc: "Nuestro crecimiento interno no es realmente tan bueno. Si vamos a llenar nuestro mercado de trabajo y crecer nuestra economía entonces tenemos que mirar una forma de inmigración consistente siempre que sea posible."
 GRN_focus_Immigration_Quotas: "Quotas de inmigración"
 GRN_focus_Immigration_Quotas_desc: "Con el desarrollo constante de nuestra nación, nuestra mayor preocupación ahora surge como gente para emplear realmente. El crecimiento de la economía sólo hace tanto cuando usted se queda sin gente para llenar posiciones. Como tal, empezaremos a intentar alcanzar cuotas de inmigración dedicadas para asegurar que nuestra población pueda igualar nuestra economía."
 GRN_focus_Expanding_Schooling_Subjects: "Ampliación de las asignaturas escolares"
 GRN_focus_Expanding_Schooling_Subjects_desc: "Ampliar los cursos electivos que nuestras escuelas ofrecen permite a los estudiantes buscar empleos y futuros que quieren hacer. Si bien también mantiene la mejora de las habilidades generales básicas que puede ayudar a nuestros estudiantes a crecer y listos para la edad adulta."
 GRN_focus_Social_Reserve_Funds: "Fondos de Reserva Social"
 GRN_focus_Social_Reserve_Funds_desc: "A medida que nuestra nación sigue creciendo tanto en la población como en la economía encontramos un difícil equilibrio en la financiación y asignando adecuadamente presupuestos a todos los necesitados. Como tal para mantener estos déficits en control crearemos el Fondo de Reserva Social, que es esencialmente un ahorro federal para los programas sociales. Debería dar más facilidad de mente a los ciudadanos que necesitarían estas redes de seguridad."
 GRN_focus_Tungsten_Industries: "Industrias de tungsteno"
 GRN_focus_Tungsten_Industries_desc: "En las tierras orientales centrales hay montículos de depósitos de tungsteno maduros para recoger. Como tal crearemos un complejo industrial dedicado a la mina, procesar y perfeccionar el mineral en barras crudas o productos secundarios que requieran el recurso."
 GRN_focus_Core_Industries_Complex: "Complejo de industrias básicas"
 GRN_focus_Core_Industries_Complex_desc: "La reapertura de antiguas minas de hierro que aún tienen material para extraer, así como la apertura de nuevas minas nos permitirá ampliar nuestras capacidades industriales. Con esto en mente haremos un complejo industrial similar para manejar el mineral extraído en las necesidades de la nación."
 GRN_focus_Growing_More_Crops: "Creciendo más cosechas"
 GRN_focus_Growing_More_Crops_desc: "Asegurar el suministro de alimentos cada vez mayor y diverso que esperamos crear a través de nuestras iniciativas de Agricultura Vertical, así como la infraestructura de destilación preplanificada para apoyar estas instalaciones, ahora podemos continuar un ritmo constante de expansión y esperar que las demandas se tropiecen en el Estante de Hielo con mayor velocidad prevista."
 GRN_focus_Naval_Investments: "Inversiones navales"
 GRN_focus_Naval_Investments_desc: "Crecer nuestras habilidades de construcción de naves domésticas nos permite acampar una marina. Si podemos colocar una marina entonces podemos asegurar nuestras aguas costeras así como tener algún tipo de huella internacional, independientemente de lo pequeño que sea al principio."
 GRN_focus_Strategic_Stockpiles: "Existencias estratégicas"
 GRN_focus_Strategic_Stockpiles_desc: "El establecimiento de arsenales estratégicos permite una reserva de armas de fuego accesibles para equipar a nuestros militares y, si es necesario, ser el propio pueblo. Por supuesto esperamos que nunca llegue a tales cosas pero quién sabe qué mentes enfermas y retorcidas están ahí fuera."
 GRN_focus_Polar_Party_Wins: "¿El Partido Polar gana?"
 GRN_focus_Polar_Party_Wins_desc: "Considerado lo que fue una vez un partido defunto, el partido polar es probablemente la cosa más cercana a un partido conservador más tradicional que uno podría conseguir en Groenlandia. Como tal su victoria mientras confusa inspira la esperanza de una mano firme y la calma social de todo el hoopla exterior que algunas naciones están luchando con."
 GRN_focus_Family_Subsidies: "Subvenciones familiares"
 GRN_focus_Family_Subsidies_desc: "Para mejorar el crecimiento de la población nacional y no depender demasiado de los esfuerzos de inmigración estableceremos una subvención dedicada para ayudar a las familias durante los primeros años de la infancia. De esta manera, la principal preocupación que tiende a ser la capacidad fiscal ya no es una preocupación real. Para prevenir el abuso limitaremos a cómo se aplican los subsidios para comprar sabio y tenerlo en una forma nacional estándar de tarjeta bancaria."
 GRN_focus_Childcare_Act: "Ley de cuidado infantil"
 GRN_focus_Childcare_Act_desc: "La capacidad de los padres para cuidar a sus hijos mientras intentan pagar sus facturas y tal es un equilibrio delicado y a menudo tedioso. Como tal, la Ley de cuidado infantil es un paquete de gasto para mejorar y establecer centros de guarderías y centros preescolares para cuidar a los niños y cuidarlos."
 GRN_focus_Foreign_Leasing_Act: "Ley de arrendamiento extranjero"
 GRN_focus_Foreign_Leasing_Act_desc: "El FLA es una ley de dos golpes. La primera parte es mejorar los esfuerzos de educación e investigación para mejorar nuestra comprensión de la extracción de minerales y la mejor manera de minar las cosas bajo nuestras tierras. El segundo es esencialmente hacer que las empresas extranjeras lo hagan por nosotros o en el mínimo establecimiento de los cimientos para las cosas a donde podríamos tomarlo en cualquier punto si fuera necesario."
 GRN_focus_Steeling_Resolve_Act: "Acto de resolución de acero"
 GRN_focus_Steeling_Resolve_Act_desc: "La legislación de la SRA es un conjunto específico de inversiones para ampliar el suministro interno de hierro y carbón. Estos recursos críticos ayudarán a ampliar la base de nuestra economía y capacidades nacionales para producir tanto en las industrias como en las necesidades demográficas, como la vivienda y las instituciones públicas."
 GRN_focus_Expand_Petrochemical_Industries: "Ampliar las industrias Petroquímicas"
 GRN_focus_Expand_Petrochemical_Industries_desc: "Ser capaz de establecer mucho más allá de lo que las formas del sector industrial petroquímico mejorarán enormemente nuestra seguridad nacional con el exceso de déficits comerciales."
 GRN_focus_Greenlandic_Forestries: "Greenlandic Forestries"
 GRN_focus_Greenlandic_Forestries_desc: "Crear nuevas granjas arbóreas a través de las iniciativas Greenhouse y Vertical Farming que la nación ya tiene nos permitirá tener un sector maderero creciente y diverso."
 GRN_focus_Industrial_Projects: "Proyectos industriales"
 GRN_focus_Industrial_Projects_desc: "Mejorar el desarrollo oriental para que sea más a la par con la región occidental reducirá en gran medida la disparidad entre ellos, ya que tal mejora del sector industrial de allí debe ser muy beneficioso."
 GRN_focus_Eastern_Armaments: "Armamentos orientales"
 GRN_focus_Eastern_Armaments_desc: "Nuestro proyecto «Develop the East» continúa muy bien si lo digo yo mismo. La creación de nuevas industrias de todo tipo, además de asegurar esfuerzos de inmigración para ayudar a emplear y complementar los rellenos de trabajo domésticos, ayudará a crear una economía robusta y un futuro brillante para nuestro pueblo."
 GRN_focus_Defensive_Improvements: "Mejoras defensivas"
 GRN_focus_Defensive_Improvements_desc: "Mejorar nuestras capacidades para defender de las incursiones enemigas descaradas será el baluarte de nuestra seguridad nacional. Después de todo hacer un aterrizaje en la isla no es nada simple."
 GRN_focus_Qulleq_Party_Secures_Victory: "Qulleq Party asegura la victoria"
 GRN_focus_Qulleq_Party_Secures_Victory_desc: "En un giro interesante de los acontecimientos el partido Qulleq ha ganado la elección. Al ser conocido como un tipo de partido pro-industrialista, fueron conocidos una vez como la «independencia ahora» fiesta principal de estancia fuera de los titulares de poder originales del pasado. Si bien algunos se preocupan por si esto significa una menor calidad de vida en aras del desarrollo, muchos en el resto del partido aseguran que debido a la situación más interesante en que está la nación, la calidad de vida sólo mejorará. Sea cual sea el caso, la fiesta tendrá que poner su dinero donde está su boca en las próximas semanas."
 GRN_focus_On_Site_Family_Support: "En el sitio Apoyo a la familia"
 GRN_focus_On_Site_Family_Support_desc: "Trae a tus hijos a trabajar todos los días. Las empresas comenzarán lentamente a integrar ciertos aspectos clave del cuidado infantil para permitir que los miembros de la familia sigan trabajando sin sentir como si abandonaran a sus hijos."
 GRN_focus_Contractual_Labor_Act: "Ley de trabajo por contrata"
 GRN_focus_Contractual_Labor_Act_desc: "El CLA es una legislación que da poder a la administración para ayudar a los servicios fronterizos y de inmigración en encontrar candidatos apropiados para Visas Laborales. Estas visas permitirán la entrada en el país por un tiempo prolongado si desean trabajar aquí, no es una visa de visita sino simplemente una expansión del Programa de Subvenciones para el Desarrollo que ya tenemos."
 GRN_focus_Rewriting_The_Tax_Codes: "Reescritura Los Códigos Fiscales"
 GRN_focus_Rewriting_The_Tax_Codes_desc: "Fundamentalmente los códigos tributarios son muy anti-negocios y como tal vamos a empezar de nuevo y reformarlos alrededor del actual maquillaje económico."
 GRN_focus_Building_Up_Domestic_Capital: "Construcción de capital nacional"
 GRN_focus_Building_Up_Domestic_Capital_desc: "Nuestras minas de oro también pueden complementarse con la extracción de pequeñas cantidades de diamantes. Podemos utilizar este capital crudo mientras lo vendemos en el extranjero para financiar nuestros esfuerzos de desarrollo nacional."
 GRN_focus_Securing_Energy_Needs: "Asegurar las necesidades energéticas"
 GRN_focus_Securing_Energy_Needs_desc: "Las vastas necesidades de nuestra nación en desarrollo son la piedra angular del propio desarrollo. Tenemos los recursos y por lo tanto debemos permitirnos usarlos como nos plazca."
 GRN_focus_Military_Production_Means: "Medios de producción militar"
 GRN_focus_Military_Production_Means_desc: "Nuestra capacidad de defender y proteger no sólo a nuestros ciudadanos, sino la riqueza natural y la calidad cada vez más amplia de sus vidas es primordial. No podemos descansar en la comodidad si sabemos en cualquier momento que alguna nación puede mirar para despilfarrar por su propio uso malicioso."
 GRN_focus_Continued_Crop_Diversification_Efforts: "Continuación de los esfuerzos de diversificación de cultivos"
 GRN_focus_Continued_Crop_Diversification_Efforts_desc: "Seguimos utilizando los HFP que se establecieron en los días de pre-independencia, ya que la propia bóveda nacional de semillas también continúa creciendo y convirtiéndose en más diversa en qué cultivos posee. Nuestra nación prosperará a través del desarrollo continuo de centros de destilación que apoyen las instalaciones agrícolas nacionales donde muchas plantas de pensamiento nunca crecerían."
 GRN_focus_Expanded_Eastern_Industries: "Ampliación de las industrias orientales"
 GRN_focus_Expanded_Eastern_Industries_desc: "Trabajadores, negocios y demás. Este es el ciclo de desarrollo que esperamos continuar y también utilizar más en el este que en el oeste, ya que la disparidad entre los dos por lo menos en términos de números brutos de población parece ser bastante diferente. Al centrarnos más en el este esperamos reducir la disparidad general a nivel nacional y crear una economía distribuida más cohesiva."
 GRN_focus_Economic_Automation_Act: "Ley de automatización económica"
 GRN_focus_Economic_Automation_Act_desc: "La EAA es una legislación para deliberar y eventualmente elegir qué sector económico queremos esencialmente impulsar plenamente hacia la automatización. De esta manera se libera a los trabajadores para buscar otros sectores de empleo y esperamos que nuestra situación económica general se estabilice mejor debido a tales déficits en la fuerza laboral a los puestos de trabajo disponibles."
 GRN_focus_Inuit_Ataqatigiit_Election_Victory: "Inuit Ataqatigiit victoria electoral"
 GRN_focus_Inuit_Ataqatigiit_Election_Victory_desc: "El tipo de subdog en la política groenlandesa que el IA se ve como una forma más in-entre el pensamiento socialista democrático más común y un socialismo del mercado más tradicional. El partido cree en ciertos principios marxistas, pero parece seguir más el equilibrio titoísta entre la negociación económica entre bloques de naciones y la cohesión social para evitar elegir directamente un lado. Aunque por supuesto Groenlandia ha estado en la OTAN no hay obligación de conformarse económicamente."
 GRN_focus_Greencare_Act: "Acto de Greencare"
 GRN_focus_Greencare_Act_desc: "La Ley de Greencare o la Ley de Groenlandia, es un proyecto de ley presupuestario general para mejorar los salarios del personal médico, la calidad del equipo y la capacitación, así como para ampliar y abrir nuevas instalaciones cuando sea necesario."
 GRN_focus_Steeled_Veins_Act: "Acero Veins actuar"
 GRN_focus_Steeled_Veins_Act_desc: "El carbón y el hierro, la sangre vital de cualquier economía moderna. Aunque el carbón en sí no es tan útil como se le dio una vez alternativas energéticas disponibles, no podemos simplemente ignorar la cantidad y, en algunas áreas, la calidad cruda de nuestros depósitos de carbón y hierro. Por lo tanto, comenzaremos a invertir en operaciones de pequeña escala para reforzar los suministros actuales para el uso nacional y potencial de las exportaciones extranjeras."
 GRN_focus_Pro_Mining_And_Miners_Act: "Pro Mining & Acta de mineros"
 GRN_focus_Pro_Mining_And_Miners_Act_desc: "El proyecto de ley PMMA está diseñado para mejorar la calidad y cantidad de la minería, al tiempo que también realiza esfuerzos estratégicos de automatización para mejorar el estado general de ser trabajador de minas limitando con qué frecuencia y cuántos trabajadores necesitaremos en la mina en cualquier momento."
 GRN_focus_Feldspar_Extractions_Act: "Ley de Extracciones Feldspar"
 GRN_focus_Feldspar_Extractions_Act_desc: "Bajo los datos actuales de la encuesta geológica, la única fuente seria de óxidos Alumina está dentro de los depósitos minerales Feldspar en el oeste. Mientras que el mineral tiende a tener alza del 20% de su peso en óxido de Alumina no es la fuente más comercialmente viable. Así que la operación minera tiene que estar bajo control gubernamental completo hasta que algún tipo de avances científicos puedan cambiar la realidad. Independientemente de que necesitemos aluminio para nuestra economía y como tal vamos a invertir en operaciones de crecimiento lento para extraer el Feldspar y procesar los materiales necesarios del mineral."
 GRN_focus_Feeding_The_People_Act: "La Ley de la población"
 GRN_focus_Feeding_The_People_Act_desc: "Crecer nuestra situación alimentaria interna fuera de la pesca prominante es una gran manera de crecer nuestra economía y nuestra población. Con la creación de la bóveda nacional de semillas hemos estado bien en marcha para hacer de Groenlandia un modelo para los desarrollos en las métricas de invernadero y agricultura vertical de la ciencia agrícola."
 GRN_focus_The_Continual_Industry_Act: "Ley de la industria continua"
 GRN_focus_The_Continual_Industry_Act_desc: "Crecer nuestra economía significa mejorar nuestra producción y base industrial general. A través de pequeñas inversiones hacia industrias primarias y secundarias podemos seguir viendo el crecimiento y el desarrollo a diferencia de los anteriores."
 GRN_focus_Greenland_Technology_Center: "Centro tecnológico de Groenlandia"
 GRN_focus_Greenland_Technology_Center_desc: "La inversión en R&D hacia los avances generales en el desarrollo y la sostenibilidad dentro de nuestro entorno ecológico será fundamental para los esfuerzos de desarrollo que se realicen."
 GRN_focus_Arming_The_Nation: "Armando a la nación"
 GRN_focus_Arming_The_Nation_desc: "Nuestra defensa es clave para nuestra independencia continua. Si queremos permanecer libres entonces debemos desarrollar los medios para hacerlo."
 GRN_focus_Silver_And_Gold_Act: "Silver &"
 GRN_focus_Silver_And_Gold_Act_desc: "Mejorar nuestra seguridad nacional mediante la creación de valiosos chips de negociación en las negociaciones internacionales nos permitirán detenernos sería invasores por poco más tiempo que no hacerlo. Como tal, vamos a empezar operaciones mineras limitadas alrededor del palladio y algunos valiosos metales de tierra raros que tenemos acceso."
 GRN_focus_Naleraq_Elective_Victory: "Victoria Electiva Naleraq"
 GRN_focus_Naleraq_Elective_Victory_desc: "Con la nación en las garras de la independencia fresca, no es de extrañar que el partido más nacionalista orientado hacia Naleraq terminara ganando. Con sus políticas que buscan fortalecer y demostrar directamente la virtud groenlandesa hacia su propia soberanía. Aunque algunos se preguntan si esto puede ser demasiado de un paso rápido hacia algo un poco más hostil en la naturaleza."
 GRN_focus_Efficiency_Education_Courses: "Cursos de educación sobre eficiencia"
 GRN_focus_Efficiency_Education_Courses_desc: "El programa EE es un proyecto educativo de inversión que busca enseñar y experimentar con nuevas formas de transmitir, almacenar y manejar el uso del poder en climas más fríos. El aumento de la eficiencia en torno a esto permite que nuestra economía sea más eficaz en función del costo sin tener que preocuparse por cuestiones laborales."
 GRN_focus_Family_Planning_And_Assistance_Board: "Planeamiento familiar & Junta de Asistencia"
 GRN_focus_Family_Planning_And_Assistance_Board_desc: "El FPAB es una institución gubernamental dedicada a la creación, mantenimiento y crecimiento de las familias de la nación. Nuestra población es pequeña y no queremos inundar la nación con azar e emigrantes si podemos cuidarnos adecuadamente."
 GRN_focus_Family_Homes_Act: "Ley de hogares familiares"
 GRN_focus_Family_Homes_Act_desc: "La Ley de Hogares Familiares o FHA es un programa diseñado para asegurarse de que los hogares clasificados familiar lleguen a las familias necesitadas. Nos aseguraremos de que nadie está abusando del limitado stock de viviendas que tenemos en la nación."
 GRN_focus_Urban_Planning_Commission: "Comisión de Planificación Urbana"
 GRN_focus_Urban_Planning_Commission_desc: "La UPC es una agencia gubernamental diseñada para planificar y comenzar trabajos fundacionales para futuros proyectos de vivienda y posibles estilos de planificación urbana con los que trabajar a medida que estas nuevas casas se llenan con personas que luego necesitan empleo y cadenas locales de suministros a ese ritmo."
 GRN_focus_Rapid_Agriculture_Expansions: "Expansions Rapid Agriculture"
 GRN_focus_Rapid_Agriculture_Expansions_desc: "El proyecto de ley RAE está dedicado a ampliar nuestras bases agrícolas y métodos de producción para que podamos seguir alimentando a nuestros ciudadanos y crecer mejor nuestra población. Por supuesto que tendremos que analizar e importar a un especialista para entrenar y eventualmente dar las instalaciones a los ciudadanos nativos, pero por ahora podemos darles visas de desarrollo temporal."
 GRN_focus_Industry_Development_Act: "Ley de desarrollo industrial"
 GRN_focus_Industry_Development_Act_desc: "Invertimos en nuestro sector industrial y de fabricación general para crear una economía confiable pero diversa. Pequeñas mejoras y proyectos poco a poco bola de nieve como nuestra población y potencial piscina de inmigración que vet también puede aumentar."
 GRN_focus_Military_Forces_Investment_Act: "Ley de inversiones de las fuerzas militares"
 GRN_focus_Military_Forces_Investment_Act_desc: "Este proyecto de paquete de gastos y desarrollo de armas funcionará de la mano para desarrollar nuestras capacidades terrestres y aéreas a medida que tratemos de redactar nuestros propios diseños para ciertos equipos complejos."
 GRN_focus_Western_Strategic_Autarky_Act: "West Strategic Autarky Act"
 GRN_focus_Western_Strategic_Autarky_Act_desc: "La Ley Nacional Autarky es un plan de dos fases para crear operaciones estratégicas de extracción minera y recursos generales para asegurar un suministro doméstico limitado pero estable si cualquier nación viene a hacernos daño a través de bloqueos navales o políticos de tipo. Fase uno del plan se conoce como el acto de autarquía estratégico WSAA o oeste. Esto crea operaciones limitadas en mineral de hierro, feldspar para aluminio así como petróleo y carbón para operaciones sintéticas de energía y caucho."
 GRN_focus_Eastern_Strategic_Autarky_Zone: "Zona de Autarky Estratégica Oriental"
 GRN_focus_Eastern_Strategic_Autarky_Zone_desc: "La segunda fase de la Ley Nacional Autarky está desarrollando operaciones de petróleo y carbón para energía general, así como uso industrial. Comenzaremos también esfuerzos limitados de extracción REE, así como litio y minerales similares orientados a la tecnología. Nuestros chips de seguridad nacional y negociación extranjera están empezando a apilar a nuestro favor parece."
 GRN_focus_Militarize_Greenland_Party_Wins: "Militarizar Greenland Party gana?"
 GRN_focus_Militarize_Greenland_Party_Wins_desc: "Mientras que la mayoría de los partidos en Groenlandia son bastante copia de carbono, nadie esperaba la interdicción militar como aparentemente el subdog completo y recientemente formado MGP ha tomado la victoria. El partido es esencialmente una extensión política de los recién formados Servicios Armados de Groenlandia o ASG, se centra en la defensa nacional y la capacidad de obtener los medios para defender nuestra nación. Una especie de lógica circular para estar seguro, pero muchos no pueden preguntarse si esta era una necesidad subconsciente que más quería después de la independencia de Dinamarca."
 GRN_focus_Military_Organized_Education_Act: "Ley de educación organizada militar"
 GRN_focus_Military_Organized_Education_Act_desc: "La revisión de cómo las clases, los temas y la estructura general de nuestra educación deben y se volverán a trabajar en una estructura militar como. La enseñanza temprana de la disciplina, organización y cómo escuchar y dar orden e información es crítica no sólo en la retención de memoria sino también en la vida post-educación y posible servicio."
 GRN_focus_Production_Critical_Resources_Act: "Ley de recursos críticos para la producción"
 GRN_focus_Production_Critical_Resources_Act_desc: "El acero y la energía, estos dos pilares fundamentales de cualquier sociedad industrializada son los que más necesitamos. Sea para las necesidades civiles o militares y como tal vamos a invertir y expandir operaciones para asegurar que nuestras necesidades domésticas y la necesidad de defensa se satisfagan."
 GRN_focus_Advanced_Materials_And_Minerals_Act: "Ley de Materiales Avanzados &"
 GRN_focus_Advanced_Materials_And_Minerals_Act_desc: "El proyecto de ley AMMA se centra en ampliar las operaciones alrededor de la extracción mineral de lo que se considera una producción avanzada necesaria recursos. Las cosas relacionadas con el desarrollo tecnológico y los elementos raros de la tierra son algunos ejemplos principales."
 GRN_focus_Army_Armaments_Improvement_Act: "Ley de mejora de los armamentos del ejército"
 GRN_focus_Army_Armaments_Improvement_Act_desc: "La mejora general de nuestro ejército es primordial para cualquier defensa terrestre que podamos tener. Como tal, vamos a invertir en ampliar nuestras capacidades de producción, así como la financiación pasiva R&D para estas instalaciones para probar nuevos diseños cuando sea posible."
 GRN_focus_Air_Force_Advancements_Act: "Ley de promoción de la fuerza aérea"
 GRN_focus_Air_Force_Advancements_Act_desc: "Financiar las instalaciones de producción para establecer realmente alguna forma de una fuerza aérea será mejor que no hacer nada. Como bonificación lanzaremos un poco de financiación R&D para tratar de hacer rodar la bola en el diseño de nuevos aviones para la rama del servicio."
 GRN_focus_Military_Garden_Act: "Ley de jardines militares"
 GRN_focus_Military_Garden_Act_desc: "Dedicar una parte del aparato agrícola lentamente pero siempre expandido que es el HFP al programa de raciones militares es en realidad algo beneficioso para hacer. No sólo separa las demandas civiles de los militares, sino que también ayuda al control de calidad y cantidad para alimentar a nuestros miembros del servicio."
 GRN_focus_Bolstering_Naval_Assets: "Fortalecimiento de los Activos Navales"
 GRN_focus_Bolstering_Naval_Assets_desc: "Nuestra costa es masiva y como tal tendremos que crecer o al menos crear barcos que puedan manejar moderadamente las distancias en las que cubrir. Al lado de nuestro ejército, la armada es nuestra primera línea verdadera de defensa."
 GRN_focus_Civilian_Improvements_Act: "Ley de mejoras civiles"
 GRN_focus_Civilian_Improvements_Act_desc: "Para reforzar y sostener una gran fuerza militar también debemos tener una economía civil decente para impulsar todo. Como tal vamos a hacer proyectos de desarrollo dirigidos para asegurarnos de que nuestras demandas militares no corran por delante hasta lejos de lo que nuestra economía real puede manejar."
 GRN_focus_Militarized_Economy_Act: "Ley de Economía Militarizada"
 GRN_focus_Militarized_Economy_Act_desc: "Esta legislación es una reaparición integral de cómo organizamos y tratamos la economía de nuestra nación. Mediante la organización preventiva de lo que puede ser una pesada demanda de mano de obra militar, podemos centrarnos en mejorar la integración de las tecnologías y los métodos de producción para reducir considerablemente la necesidad de asignar mano de obra a la producción de armamentos militares. Esto a su vez liberará a los trabajadores y potencial mano de obra para la economía civil y nuestros servicios armados."
 GRN_focus_Greenland_Monarchist_Party_Victory: "Victoria del Partido Monarquista de Groenlandia"
 GRN_focus_Greenland_Monarchist_Party_Victory_desc: "El Partido Monarquista de Groenlandia o también conocido como la Cámara del Partido de Groenlandia, es un partido político que busca respetar y emular la larga historia de Groenlandia bajo la monarquía danesa. Como tal, el partido pretende tomar el sistema parlamentario existente e integrarlo en una monarquía constitucional bastante liberal. Una cantidad considerable de personas, por supuesto, están confundidas, pero una parte decente, o al menos lo suficiente para asegurar una victoria electivo, creen que la estabilidad política danesa es una clave para lo que podemos hacer aquí en casa para realmente desarrollar y crecer nuestra nación."
 GRN_focus_Education_Investments_Act: "Ley de inversiones en educación"
 GRN_focus_Education_Investments_Act_desc: "El EIA es un aumento de gastos dedicado a mejorar el equipamiento y generalmente invertir en la calidad de la educación, así como en los departamentos de innovaciones de ciertas instituciones. Esperamos mejorar las eficiencias de nuestra nación y seguir creciendo y adaptando nuestras capacidades a la dureza más continua que es nuestro medio ambiente."
 GRN_focus_Medical_Research_Initiatives: "Iniciativas de Investigación Médica"
 GRN_focus_Medical_Research_Initiatives_desc: "El plan MRI es crear financiación separada para un nuevo departamento dedicado dentro de nuestras principales instituciones médicas. Este nuevo departamento se llamará Departamento de Desarrollo Médico o DDD. El MDD es responsable de hacer lo que pueda para probar y encontrar nuevas formas de avanzar nuestro conocimiento y comprensión de la ciencia médica, así como asegurar la prueba de nuevos equipos y procedimientos a través de un programa voluntario completo."
 GRN_focus_Public_Security_And_Safety_Act: "Ley de seguridad pública &"
 GRN_focus_Public_Security_And_Safety_Act_desc: "Nuestros ciudadanos deben ser capaces de vivir sus vidas sin miedo. Con esta nueva legislación aprobada la financiación será aprobada para no sólo programas de divulgación comunitaria sino también mejores estándares para evaluar posibles candidatos de contratación y el programa de capacitación para convertirse en un oficial de policía. Recuerde que un día tranquilo es un buen día, y un buen día para usted es un buen día para el público."
 GRN_focus_Agriculture_Advancements_Act: "Ley de promoción de la agricultura"
 GRN_focus_Agriculture_Advancements_Act_desc: "Basándonos en nuestro creciente programa HRP seguiremos invirtiendo en Greenhouse y Vertical Farming instalaciones donde sea posible. La seguridad y estabilidad de nuestra nación descansan en la adquisición de un suministro de alimentos diverso y estable después de todo."
 GRN_focus_Economic_Strengthening_Act: "Ley de fortalecimiento económico"
 GRN_focus_Economic_Strengthening_Act_desc: "Desarrollar el fondo significa que los estándares de toda la nación se elevan por proxy o como subproducto dependiendo de sus influencias cínicas o simplemente disposición general sobre las cosas en la vida. Sin embargo, si queremos mejorar la vida de nuestros ciudadanos debemos invertir en empresas e industrias para diversificar y ampliar los productos y medios para los que nuestro pueblo pueda encontrarnos y manejarlos en su tiempo de vida."
 GRN_focus_Petrochemical_Development_Efforts: "Petroquímicas de desarrollo"
 GRN_focus_Petrochemical_Development_Efforts_desc: "La industria petroquímica es uno de los sectores económicos más influyentes y diversos en la era moderna, por no mencionar sus impactos se sienten en vidas prácticamente cotidianas. Como tal, debemos asumir el manto y desarrollar nuestro propio sector si queremos realmente tener una economía robusta y diversa. La capacidad de síntesis de cosas como el caucho y otros productos químicos o materiales valiosos es casi similar a un asunto de seguridad nacional."
 GRN_focus_Lithium_Expansion_Act: "Ley de Expansión de Litio"
 GRN_focus_Lithium_Expansion_Act_desc: "Las inversiones en operaciones de extracción de recursos críticos son primordiales para las crecientes influencias de la tecnología y otras innovaciones modernas a medida que nuestra nación sigue creciendo. Tenemos depósitos nacionales de cosas como elementos raros de la tierra, litio y otros minerales que producen tecnología. Como tal, empezaremos a ampliar y desarrollar esfuerzos de extracción para complementar nuestras demandas internas y potencialmente utilizar para futuras ofertas comerciales."
 GRN_focus_Royal_Military_Development_Efforts: "Reales actividades de desarrollo militar"
 GRN_focus_Royal_Military_Development_Efforts_desc: "El programa RMD es un paquete de inversión general para mejorar la calidad del desarrollo de equipos para el ejército y la marina, así como asegurar nuevos estándares de capacitación en torno al equipo siempre cambiante."
 GRN_focus_Establishing_The_Kingdom: "Establecimiento del Reino"
 GRN_focus_Establishing_The_Kingdom_desc: "Con toda nuestra preparación completa estamos ahora listos para llamar oficialmente a la nación al Reino de Groenlandia. El pueblo es gozoso y unificado a medida que nos propusimos crear un futuro próspero y orgulloso para todos nuestros ciudadanos."
 GRN_focus_Armed_Services_Of_Greenland: "Servicios Armados de Groenlandia"
 GRN_focus_Armed_Services_Of_Greenland_desc: "Con nuestra independencia aseguramos que ahora necesitamos manejar nuestra propia defensa nacional. Tendremos que empezar de cero y hacer algo para poder defender las vastas aguas, tierras y espacio aéreo que controlamos."
 GRN_focus_The_Frozen_Army: "El ejército congelado"
 GRN_focus_The_Frozen_Army_desc: "Nuestras tierras son frías, congeladas y difíciles de atravesar en casi cualquier época del año. Vamos y debemos moldear nuestra rama de servicio militar para poder ver estas condiciones como un patio de recreo en lugar de un desafío."
 GRN_focus_Training_Facilities_And_Standards: "Instalaciones de capacitación & Normas"
 GRN_focus_Training_Facilities_And_Standards_desc: "Para crear un ejército adecuado debemos establecer y crear instalaciones de capacitación, así como crear normas aceptables para las que constituya un soldado apropiado. Estos estándares deben construirse alrededor de las condiciones de nuestra patria si queremos defender verdaderamente a nuestros ciudadanos."
 GRN_focus_Setting_Equipment_Standards: "Normas de configuración del equipo"
 GRN_focus_Setting_Equipment_Standards_desc: "Mediante la creación de un estándar de equipo podemos crear una sensación de uniformidad tanto en el entrenamiento como en mejorar la logística alrededor de nuestros soldados."
 GRN_focus_Securing_Domestic_Smallarms: "Asegurando las armas pequeñas domésticas"
 GRN_focus_Securing_Domestic_Smallarms_desc: "Establecer nuestra propia capacidad para producir armas pequeñas y infantería general adyacente como equipo significa que podemos aumentar las capacidades de combate y la preparación de nuestro ejército."
 GRN_focus_Crude_Combat_Designs: "Diseños de combate cruzados"
 GRN_focus_Crude_Combat_Designs_desc: "Los CCD son esencialmente el tipo de diseños de equipos para vehículos «malditos huesos». Son huesos estupidos, pero todos son modelos domésticos. Podemos utilizar esto y tal vez comprar un puñado de equipo de otra nación para que podamos hacer pruebas y obras de diseño adecuados para asegurar que a medida que construimos nuestro ejército pueda realmente el equipo de campo construido para el combate moderno."
 GRN_focus_Vehicle_Manufacturing_Plants: "Plantas de fabricación del vehículo"
 GRN_focus_Vehicle_Manufacturing_Plants_desc: "Con los fundamentos de los diseños básicos de vehículos a nuestra disposición, debemos ser capaces de fabricar estos dummies de entrenamiento y utilizar la experiencia colectiva para diseñar y construir realmente un potencial núcleo blindado para nuestros militares."
 GRN_focus_Institute_For_Army_Developments: "Instituto de Desarrollo del Ejército"
 GRN_focus_Institute_For_Army_Developments_desc: "Dado que nuestro ejército es prácticamente más pequeño que un niño, debemos invertir fuertemente en los medios de desarrollar y mejorar todo el aspecto de nuestra rama del servicio militar. Por el bien de la nación, del pueblo y del personal que sirven en la rama."
 GRN_focus_Frozen_Battlefield_Doctrine: "Doctrina de Battlefield congelado"
 GRN_focus_Frozen_Battlefield_Doctrine_desc: "Es probable que nuestro ejército nunca sea realmente escalado a los gustos de los del continente europeo. Sin embargo, lo que podemos hacer es defender y proteger. Usando nuestro clima y nuestra patria como el último campo de batalla podemos atacar cualquier fuerza enemiga, ya sea agresiva o no para venir a atacarnos. Creen que vamos a ser un empujón, bueno lo veremos cuando vengan aquí y traten de decir eso a nuestras caras."
 GRN_focus_FBD_Leadership_Promotions: "Promociones de liderazgo FBD"
 GRN_focus_FBD_Leadership_Promotions_desc: "Para solidificar y comenzar a reorganizar el ejército alrededor de esta nueva doctrina necesitamos líderes que realmente quieren implementarla y entender las ideas y conceptos que pone. Como tal, vamos a promover un personal general del ejército dedicado para liderar y implementar mejor estas reformas."
 GRN_focus_From_Field_To_Staff_Command: "Del campo al mando del personal"
 GRN_focus_From_Field_To_Staff_Command_desc: "Con los comandantes de campo promovidos nos damos cuenta de que estas almas desafortunadas necesitan también entender la administración más amplia. Como tales, sus órdenes sobre el terreno se complementarán con puestos de personal general hasta que podamos capacitar y promover a otros oficiales dignos en esta nueva manera de avanzar."
 GRN_focus_Frozen_Warfare_Training_Program: "Programa de capacitación en celos congelados"
 GRN_focus_Frozen_Warfare_Training_Program_desc: "Nuestro objetivo es defender nuestra patria, dijo que la patria es fría y congelada, por lo tanto debemos entrenar y asegurar que nuestras tropas puedan luchar en estas condiciones durante el mayor tiempo posible."
 GRN_focus_Polar_Logistics: "Logística polar"
 GRN_focus_Polar_Logistics_desc: "Suponiendo que nuestro combate esté siempre en nuestra isla, aunque no sea el mejor método, es ciertamente una forma segura de pensar para la defensa de nuestra nación. Como tal empezaremos a refinar y mejorar nuestro aparato logístico para hacer que la lucha en el clima extremo sea una tarea más fácil de manejar."
 GRN_focus_General_Improvement_Programs: "Programas generales de mejora"
 GRN_focus_General_Improvement_Programs_desc: "La defensa de nuestra isla es obviamente nuestra principal prioridad, sin embargo, ¿cómo podemos defender nuestra isla si no somos poco a nada acerca de los mundos de combate que nos rodean? Debemos garantizar una mejora equilibrada y general de nuestro ejército para asegurar que esté dispuesto y capaz de manejar tantas situaciones diferentes como sea posible."
 GRN_focus_GIP_Leadership_Promotions: "Ascensos en la dirección del GIP"
 GRN_focus_GIP_Leadership_Promotions_desc: "Asegurar el nuevo camino hacia adelante con la forma en que queremos crecer y desarrollar nuestro ejército requerirá oficiales de campo y cargos directivos generales. Como tal vamos a pasar y encontrar los mejores candidatos posibles para asegurar que puedan ayudar a impulsar esta manera de pensar a nuevos estándares de excelencia."
 GRN_focus_General_Staff_Roles: "Funciones del personal general"
 GRN_focus_General_Staff_Roles_desc: "Mientras nuestro ejército es pequeño, tendremos que confiar en aquellos a quienes acabamos de dar órdenes de campo para también asumir funciones administrativas también por el momento."
 GRN_focus_Artillery_Corps_Specialist: "Artillería Cuerpo Especialista"
 GRN_focus_Artillery_Corps_Specialist_desc: "Desarrollar y especializarnos en operaciones de artillería tanto en medidas defensivas como ofensivas significa que podremos hacer más daño tanto al personal como a la moral del enemigo, entonces ellos podrían para nosotros. Pero la artillería es difícil de mover y las piezas fáciles de mover son caras. Tendremos que encontrar formas de mejorar la prevención de pérdidas si queremos conseguir algún significado real detrás de esta forma de planificación táctica."
 GRN_focus_Clear_Skys_Project: "Proyecto de esquís claros"
 GRN_focus_Clear_Skys_Project_desc: "El CSP es un programa dedicado de desarrollo del equipo antiaéreo para asegurar que los medios para que nuestros soldados puedan luchar no sólo dependan de si el enemigo decide o no utilizar su poder aéreo o no. Las aeronaves son caras, algunos juguetes nuevos divertidos para tu gruñido promedio, no tanto."
 GRN_focus_Army_Officer_Training_Corps: "Cuerpo de Formación del Oficial del Ejército"
 GRN_focus_Army_Officer_Training_Corps_desc: "El AOTC es la culminación y dedicación del personal para convertirse en líderes tanto en el sentido táctico como estratégico. Nuestra nación es pequeña y por lo tanto debemos desarrollar y frenar cualquier hábito malo antes de que crezcamos a un punto donde el arraigo natural puede tomar posesión."
 GRN_focus_Navy_Of_Greenland: "Marina de Groenlandia"
 GRN_focus_Navy_Of_Greenland_desc: "Nuestra armada no es más que barcos pesqueros y buques de patrulla. Si vamos a pensar incluso en defender nuestras aguas costeras entonces debemos asegurarnos de que tenemos una marina para empezar con pero también uno que puede manejar tales condiciones volátiles a veces."
 GRN_focus_Naval_Research_Institute: "Instituto de Investigación Naval"
 GRN_focus_Naval_Research_Institute_desc: "Establecer el Instituto de Investigación Naval Itilleq nos permitirá desarrollar y cultivar nuestros conocimientos navales y aplicaciones prácticas a nuestra marina. Esta piedra angular del desarrollo nos permitirá crear una marina que queremos y nos permita defender adecuadamente nuestras aguas de la agresión extranjera."
 GRN_focus_Nuuk_Naval_Shipyards: "Astilleros navales Nuuk"
 GRN_focus_Nuuk_Naval_Shipyards_desc: "El desarrollo de los astilleros regionales de capital nos permitirá construir nuevos buques tanto para medios militares como potenciales civiles."
 GRN_focus_Expanding_The_Design_Department: "Ampliación del Departamento de Diseño"
 GRN_focus_Expanding_The_Design_Department_desc: "Los astilleros navales estratégicos cerca de la NRI en el sur de la nación nos permitirán mejorar, diseñar y probar buques navales y dar a nuestra marina los mejores resultados posibles cuando sea posible. Esto también ayudará a actualizar mejor las clases actuales de barcos y ayudarles a ser reacondicionados a nuevos diseños cuando sea posible."
 GRN_focus_Tasiilaq_Shipyards_Complex: "Complejo de astilleros Tasiilaq"
 GRN_focus_Tasiilaq_Shipyards_Complex_desc: "Equilibrar los desarrollos navales generales entre puntos finales estratégicos nos permite apoyar logísticamente nuestras flotas donde sea necesario en todas las dimensiones de nuestra isla."
 GRN_focus_Rough_Raft_Designs: "Rudos diseños de Raft"
 GRN_focus_Rough_Raft_Designs_desc: "El mínimo para diseñar y desenvolver algún tipo de fuerza naval significa que tendremos que trabajar más duro en los esfuerzos R&D para adquirir e intentar realmente construir diseños reales en el futuro."
 GRN_focus_Small_Surface_Fleet_Doctrine: "Doctrina de la Flota Pequeña"
 GRN_focus_Small_Surface_Fleet_Doctrine_desc: "Nuestra nación no tiene la mano de obra para lanzar muchas naves en general. Como tal, empezaremos a tocar y trabajar nuestra doctrina naval alrededor de los vasos superficiales pero del calibre más pequeño. Hágalos más modulares y adaptables esencialmente, aunque nada más grande que decir un destructor debido a preocupaciones entrenignas y de mano de obra."
 GRN_focus_Corvette_Design_Department: "Departamento de diseño Corvette"
 GRN_focus_Corvette_Design_Department_desc: "El programa temprano para nuestra doctrina SSF es el del departamento de diseño de corvette. El departamento se encargará de diseñar, probar y mejorar las innovaciones en torno al tipo de casco estándar."
 GRN_focus_Small_Vessel_Fleet_Organization: "Pequeña organización de la flota de buques"
 GRN_focus_Small_Vessel_Fleet_Organization_desc: "Nuestra SVF o Pequeñas Flotas, se organizarán alrededor de los tres grandes. Corvettes, fragatas y destructores. Estas tres clases de barcos serán las mejores para tripular, adaptar y crear diseños nuevos y dinámicos para hacer que nuestras flotas empaquen un golpe serio contra una fuerza enemiga."
 GRN_focus_Submersival_Fleet_Doctrine: "Doctrina de la flota sumersival"
 GRN_focus_Submersival_Fleet_Doctrine_desc: "Submarines, son sigilosos y no demasiado exigentes para las necesidades de mano de obra. Sin embargo, los submarinos hacen un golpe muy grande si están organizados justo a la derecha. Desde misiles anti-bores hasta torpedos viejos, podemos hacer mucho más con mucho menos."
 GRN_focus_Attack_Submarine_Pillar: "Ataque Pillar Submarino"
 GRN_focus_Attack_Submarine_Pillar_desc: "El primer pilar principal para asegurar la fundación de nuestra marina es el de la clase de ataque del submarino. Diseñada principalmente alrededor de tácticas directas como torpedos y mi guerra, la clase de ataque será las lanzas de la marina de nuestra nación."
 GRN_focus_Missile_Submarine_Pillar: "Misiles Submarine Pillar"
 GRN_focus_Missile_Submarine_Pillar_desc: "El segundo pilar de nuestra seguridad naval es del submarino de clase misiles. Los misiles son atacantes pesados, pero también son costosos. Necesitamos mejorar y mejorar las habilidades de combate efectivas de este pilar de proeza naval si vamos a combatir adecuadamente contra enemigos extranjeros en el mar."
 GRN_focus_Naval_Command_Corps: "Cuerpo de Comando Naval"
 GRN_focus_Naval_Command_Corps_desc: "Nuestra marina necesita un aparato de mando y hoy establecimos eso mismo. Es un comienzo y sólo podemos subir de aquí. Espero."
 GRN_focus_Greenlandic_Air_Force: "Fuerza Aérea de Groenlandia"
 GRN_focus_Greenlandic_Air_Force_desc: "Los cielos sobre nuestra isla son nublados, fríos y estériles. Debemos averiguar cómo desarrollar y crear una fuerza aérea suficiente para defender nuestros cielos."
 GRN_focus_West_Craft_Manufacturing: "Fabricación de artesanía occidental"
 GRN_focus_West_Craft_Manufacturing_desc: "La planta de fabricación artesanal occidental está lista para producir y probar diseños para nuestra fuerza aérea donde y cuando sea posible. Esperamos utilizar este nuevo complejo industrial para equipar y preparar nuestra fuerza aérea para defender nuestros cielos."
 GRN_focus_Preparing_Air_Institute_Manufacturing: "Preparación de la fabricación del Instituto Aéreo"
 GRN_focus_Preparing_Air_Institute_Manufacturing_desc: "La capacidad de producir y probar aviones es fundamental para aprender e innovar. Crearemos capacidades de fabricación cerca del Instituto de Investigación Aérea planificado para facilitar la logística y la planificación en torno al desarrollo de nuevos diseños y pruebas tecnológicas."
 GRN_focus_Tingmiarmit_Air_Research_Institute: "Instituto de Investigación Aérea Tingmiarmit"
 GRN_focus_Tingmiarmit_Air_Research_Institute_desc: "El TARI es una institución dedicada al desarrollo e innovaciones en torno a las capacidades de combate aéreo y aéreo. Aunque nuestra nación es algo grande, también es pequeña al mismo tiempo y como tal debemos dedicar estos primeros años a especializar una verdadera forma de doctrina del aire y seguridad aérea de las fuerzas enemigas."
 GRN_focus_Infrequent_Flyer_Designs: "Infrecuente Flyer Designs"
 GRN_focus_Infrequent_Flyer_Designs_desc: "Diseños baratos para hacer los papeles designados a los que han sido asignados. No es el mejor pero ciertamente un punto de partida para comenzar un desarrollo serio para nuestra fuerza aérea."
 GRN_focus_Air_Supremacy_Prioritization: "Priorización de la supremacía del aire"
 GRN_focus_Air_Supremacy_Prioritization_desc: "El enemigo puede abrumar a nuestra marina, pero nunca se les debería permitir dominar nuestros cielos. Debemos concentrarnos totalmente en producir e innovar en el aire directo a las capacidades de combate aéreo. Garantizar esto nos permite hacer lo que queramos tanto en aire, mar y tierra por proxy."
 GRN_focus_General_Aviation_Innovations: "Innovaciones de Aviación General"
 GRN_focus_General_Aviation_Innovations_desc: "La instalación de TARI ha estado trabajando duro, gracias a Dios porque le pusimos mucho dinero, pero de todos modos. Las mejoras generales en las cosas como la detección de radares, la eficiencia del combustible y los esfuerzos de consumo general, así como una pequeña cantidad de otras innovaciones, deben realizarse en pruebas sobre el terreno a corto plazo."
 GRN_focus_Air_Dominance_Research_Programs: "Programas de investigación sobre el dominio del aire"
 GRN_focus_Air_Dominance_Research_Programs_desc: "A través de la dedicación exclusiva en los esfuerzos del luchador R&D, libraremos los cielos de cualquier enemigo que busque ennegrecer nuestros cielos con sus intenciones odiosas."
 GRN_focus_Naval_Bombing_Superiority_Force: "Fuerza de superioridad de bomba naval"
 GRN_focus_Naval_Bombing_Superiority_Force_desc: "Dominar el mar por medios aéreos podría abrir la puerta a medidas defensivas preventivas y asegurar capacidades ofensivas si surge alguna vez la necesidad."
 GRN_focus_Bombing_Research_Priorities: "Prioridades de investigación en materia de bombas"
 GRN_focus_Bombing_Research_Priorities_desc: "Invertir nuestra financiación de investigación para priorizar las innovaciones en torno al bombardeo y más aire a tierra y aire a combate naval resultará fructífero para impedir cualquier fuerza de invasión que podamos enfrentar."
 GRN_focus_Bomber_Air_Fleets: "Bombardero Air Fleets"
 GRN_focus_Bomber_Air_Fleets_desc: "Nuestra fuerza aérea tendrá flotas aéreas dedicadas a todo tipo de esfuerzos de bombardeo. Desde Strategic hasta Close Air, estableceremos el escenario que queremos asegurarnos de que ninguna fuerza enemiga dañará nuestras tierras por mucho tiempo."
 GRN_focus_Air_Officer_Training_Corps: "Cuerpo de entrenamiento de oficiales de aire"
 GRN_focus_Air_Officer_Training_Corps_desc: "El desarrollo de nuestro Cuerpo de Oficiales de la Fuerza Aérea seguirá mejorando los esfuerzos de desarrollo que nos esforzamos por adquirir a medida que sigamos creciendo y perfeccionando lo que es nuestra rama de servicio de la fuerza aérea."
 GRN_focus_Greenlandic_General_Staff_Corps: "Cuerpo de Estado Mayor de Groenlandia"
 GRN_focus_Greenlandic_General_Staff_Corps_desc: "Con los militares ahora en expansión hemos llegado a un punto en el que necesitamos un mando general más unificado. Como tal trabajaremos para crear este personal de mando nacional y trabajar para mejorar nuestra nación y trabajar siempre para mejorar nuestros medios nacionales de defensa."
 GRN_focus_Thawing_The_Economy: "La economía"
 GRN_focus_Thawing_The_Economy_desc: "La economía de nuestra nación originalmente es sólo la pesca y, bueno, la pesca. Por supuesto que tenemos muy pocas huellas en los sectores comerciales y otros sectores económicos, pero el verdadero grueso de la economía proviene de nuestras pesquerías. Tenemos que cambiar esto. Por supuesto, hemos intentado diversificarnos para luchar contra la batalla por nuestra independencia pero debemos seguir descubriendo lo que podemos hacer y cómo hacerlo. Nuestra economía tiene potencial para crecer pero debemos hacer algo."
 GRN_focus_Energizing_Greenland: "Energizing Greenland"
 GRN_focus_Energizing_Greenland_desc: "A medida que crecemos nuestra nación, nuestra demanda de energía sigue aumentando y subiendo. Necesitamos establecer un sector energético estable que siga atendiendo las exigencias que buscamos."
 GRN_focus_Fossil_Fuelin: "Fósil Fuelin"
 GRN_focus_Fossil_Fuelin_desc: "Nuestra nación tiene grandes depósitos sin explotar de carbón y aceite. Podemos utilizar estos para una energía rápida y barata para continuar el ritmo de nuestras demandas energéticas como se ve apropiado."
 GRN_focus_Oil_Charter_Dominance: "Petroleo Carta Dominance"
 GRN_focus_Oil_Charter_Dominance_desc: "Al priorizar la creación de nuevas cartas para la extracción, podemos seguir satisfaciendo las demandas energéticas mediante la ampliación de los esfuerzos generales de extracción."
 GRN_focus_Renewable_Revivals: "Renacimientos renovables"
 GRN_focus_Renewable_Revivals_desc: "Nuestras tierras son un montón de vientos, sol y aguas en movimiento. Tenemos el mejor entorno posible para invertir en energías renovables estables y, como tal, comenzaremos una inversión general e integral tanto en la construcción de instalaciones renovables como en el desarrollo de mejores métodos para crear energía."
 GRN_focus_Harnessing_The_Winds_Of_Fortune: "Arrollando los vientos de la fortuna"
 GRN_focus_Harnessing_The_Winds_Of_Fortune_desc: "Seguiremos priorizando nuestros desarrollos generales y aseguraremos que podemos aprovechar la misma naturaleza de nuestra nación para beneficiar a nuestros ciudadanos para poder vivir mejores vidas entonces antes."
 GRN_focus_Greenlands_Green_Energy: "Green Energy de Groenlandia"
 GRN_focus_Greenlands_Green_Energy_desc: "Nuestra isla es el lugar perfecto para desarrollar y utilizar la energía nuclear. Patrones meteorológicos bastante estables, temperaturas frías y frías casi todo el año y mucha agua tanto salada como fresca..frozen agua para ser utilizado en el proceso de generación de vapor."
 GRN_focus_Unlimited_Power: "Potencia ilimitada"
 GRN_focus_Unlimited_Power_desc: "Con depósitos nacionales de materiales nucleares podemos suministrar nuestras propias instalaciones. También podemos empezar a construir y establecer el escenario para conseguir operaciones en marcha. Con esta inversión masiva sentamos el precedente de que somos una nación que ya no necesita preocuparse por la energía."
 GRN_focus_Secured_Electrical_Grid: "Cierre eléctrico seguro"
 GRN_focus_Secured_Electrical_Grid_desc: "Con nuestra dirección energética, nuestras necesidades de energía son ahora más estables o al menos alcanzando la capacidad para llegar a ser más preventiva en la naturaleza en lugar de reactivarse. Esperemos que tomemos la decisión correcta y sigamos avanzando hacia un futuro más brillante."
 GRN_focus_Agricultural_Futurism_Plan: "Plan de Futurismo Agrícola"
 GRN_focus_Agricultural_Futurism_Plan_desc: "Nuestros proyectos originales de HFP o Harsh Farming han solidificado una base de innovaciones económicas y científicas. Si bien ello da lugar a medidas más intensivas en materia de energía que podemos utilizar para dirigir el dominio del sector agrícola tanto en la autosuficiencia como en los posibles comercios e inversiones extranjeros."
 GRN_focus_Western_Farming_Complexes: "Complejos de Agricultura Occidental"
 GRN_focus_Western_Farming_Complexes_desc: "La creación de fundaciones, infraestructuras y estructuras generales para apoyar estos métodos lleva tiempo, pero resultarán fructíferas en el futuro. Estos VFC o Complejos de Agricultura Vertical son grandes para cultivar todo tipo de alimentos durante casi todo el año. Esto también nos permite ampliar nuestro aparato de instalaciones de destilación para continuar despegando en la Gran Plataforma."
 GRN_focus_Eastern_Farming_Complexes: "Complejos de Agricultura Oriental"
 GRN_focus_Eastern_Farming_Complexes_desc: "El desarrollo continuo de nuestro Sector Agropecuario Vertical impulsará los costos alimentarios de nuestra nación a nuevos bajos haciendo que la comida sea muy barata y nos permita comer alimentos con otras naciones cerca de todo el año para cosas que regionalmente serían consideradas fuera de temporada."
 GRN_focus_Supplemental_Industries: "Industrias suplementarias"
 GRN_focus_Supplemental_Industries_desc: "El desarrollo de nuestro sector industrial nos dará una diversidad limitada entre nuestro sector agrícola fuertemente invertido."
 GRN_focus_First_International_Farm: "Primera Granja Internacional"
 GRN_focus_First_International_Farm_desc: "Con todas nuestras inversiones en investigación y desarrollo económico del mayor sector agrícola, hemos llegado a darnos cuenta de que con lo que podemos satisfacer podríamos ser la primera nación agrícola internacional. Como seguro hay canastas de pan alrededor del mundo, pero piensa en ello, podríamos ser, THEE, banco mundial de alimentos."
 GRN_focus_Infrastructure_Projects: "Proyectos de infraestructura"
 GRN_focus_Infrastructure_Projects_desc: "Crecer nuestra economía es todo bien y con cuidado, pero para mantenerla necesitamos carreteras, carriles y toda clase de infraestructura para conectar tanto a las personas como a los servicios para hacer que la economía funcione. Como tal, vamos a instituir una lista general de proyectos para integrar mejor nuestra nación escasamente poblada."
 GRN_focus_Greater_West_Highway_Project: "Mayor Proyecto de la autopista oeste"
 GRN_focus_Greater_West_Highway_Project_desc: "Crear una «autopista» directa que une las ciudades occidentales permitirá mejorar las condiciones de viaje para los ciudadanos, así como reducir las cargas de viaje y los plazos para llegar de un lugar a otro."
 GRN_focus_Improving_Western_Internet_Towers: "Mejora de las torres occidentales de Internet"
 GRN_focus_Improving_Western_Internet_Towers_desc: "Mejorar las torres existentes y construir nuevas torres de Internet permitirá a nuestros ciudadanos e instituciones trabajar mejor de manera más eficiente y cohesiva para actividades diarias."
 GRN_focus_Sisimuit_Northern_Railway: "Sisimuit ferrocarril norte"
 GRN_focus_Sisimuit_Northern_Railway_desc: "La ampliación de la red ferroviaria actual para abarcar tanto de la región occidental como sea posible es fundamental para la cohesión logística y la cadena de suministro económico. Nos beneficiaremos mucho de esta inversión debido a que los ferrocarriles son el mejor y el transporte a granel."
 GRN_focus_Great_Eastern_Highway_Project: "Gran proyecto de autopista oriental"
 GRN_focus_Great_Eastern_Highway_Project_desc: "Al igual que nuestro proyecto occidental haremos nuestro mejor esfuerzo para conectar las ciudades orientales para hacer la nación mucho más conectada incluso en los medios más básicos si es posible."
 GRN_focus_East_Region_Internet_Expansions: "Expansiones de Internet en la región oriental"
 GRN_focus_East_Region_Internet_Expansions_desc: "Con la región oriental siendo generalmente la menos desarrollada en comparación con el oeste, debemos hacer lo que podamos para crecer e igualar estos déficits. Como tal, ampliaremos las infraestructuras de Internet que tenemos en la región para ajustarlas a los estándares."
 GRN_focus_Great_Greenlandic_Eastern_Railroad: "Gran ferrocarril oriental de Groenlandia"
 GRN_focus_Great_Greenlandic_Eastern_Railroad_desc: "El GGERR es una de las mayores inversiones en infraestructura que hemos establecido para conectar la mayor parte de las tierras costeras a una red ferroviaria unificada. La única barrera para los tiempos reducidos para viajar es la Gran Plataforma de hielo, pero tal vez podríamos cambiar ese uno de estos días."
 GRN_focus_Connecting_Greenland: "Conectando Groenlandia"
 GRN_focus_Connecting_Greenland_desc: "A medida que crece nuestra nación, también lo hace nuestra necesidad de infraestructura. A este respecto debemos seguir invirtiendo no sólo en la infraestructura misma, sino en las formas en que lo mantenemos y cómo podemos hacerlo mejor para el medio ambiente en el que lo estamos construyendo."
 GRN_focus_Economic_Modernism_Plan: "Plan de Modernismo Económico"
 GRN_focus_Economic_Modernism_Plan_desc: "La constante diversificación de nuestra economía es fundamental para la estabilidad y salud de ella. Debemos mejorar nuestros déficits relacionados con el sector civil más amplio y el sector de la oficina y la tecnología."
 GRN_focus_Office_District_West: "Oficina Distrito Oeste"
 GRN_focus_Office_District_West_desc: "El desarrollo del sector general de oficinas en la región occidental nos permitirá ampliar los productos y servicios que los ciudadanos podrán disfrutar."
 GRN_focus_Tech_Sector_Growth: "Crecimiento del sector técnico"
 GRN_focus_Tech_Sector_Growth_desc: "El crecimiento de los sectores de oficinas y servicios suele complementarse con el desarrollo general del sector tecnológico. Debemos asegurar esto para garantizar que la mayor diversidad sea alcanzada por nuestra economía como sea posible."
 GRN_focus_Civilian_Sector_Investments: "Inversiones del sector civil"
 GRN_focus_Civilian_Sector_Investments_desc: "Suplementando nuestro impulso para desarrollar y diversificar el sector de oficinas, estas empresas necesitan apoyo industrial para hacer y utilizar potencialmente sus productos."
 GRN_focus_National_Economic_Modernity: "Nacional Economic Modernity"
 GRN_focus_National_Economic_Modernity_desc: "Nuestras inversiones han sido diversas y fructíferas para decir lo menos, pero esto es sólo el principio. Debemos hacer todo lo posible para proporcionar el mejor resultado posible para nuestros ciudadanos y para el futuro de nuestra nación."
 GRN_focus_Resource_Extraction_Projects: "Proyectos de extracción de recursos"
 GRN_focus_Resource_Extraction_Projects_desc: "La isla tiene recursos sin explotar. Si vamos a llegar a cualquier lugar en términos de seguridad nacional, inversión extranjera y o comercios, debemos desarrollar nuestro sector de extracción de recursos a las necesidades de lo que creemos que es el mejor para la nación."
 GRN_focus_Iron_Mining_Operations: "Operaciones mineras de hierro"
 GRN_focus_Iron_Mining_Operations_desc: "El hierro es un mineral fundamental para el mío y utiliza a lo largo de la economía. Empezaremos las inversiones nacionales para iniciar y crecer operaciones de extracción que mejor se adapten a nuestras necesidades."
 GRN_focus_Project_Alumina_Oxide: "Proyecto Alumina Oxide"
 GRN_focus_Project_Alumina_Oxide_desc: "Mientras hasta ahora no hemos descubierto ningún depósito directo de bauxita, hemos encontrado que hay maneras de extraer el óxido de alumina necesario de otros minerales para hacer aluminio. Como tal, necesitaremos grandes inversiones en operaciones e investigación de aislamiento para aprovechar al máximo lo poco que tenemos."
 GRN_focus_Lithium_Mining_Operations: "Operaciones de minería de litio"
 GRN_focus_Lithium_Mining_Operations_desc: "Los depósitos de minerales de litio y bloques de construcción similares serán clave para ampliar nuestras capacidades para innovar y cultivar el sector de las industrias tecnológicas y los servicios. Invertir en operaciones mineras de cosas como litio, cobalto y así sucesivamente será un gran impulso a nuestra flexibilidad económica."
 GRN_focus_Project_Rare_Minerals: "Proyecto Rare Minerals"
 GRN_focus_Project_Rare_Minerals_desc: "Gran inversión en elementos de tierra raros como Neodymium y otros depósitos minerales disponibles aumentará enormemente nuestra posición internacional para las negociaciones comerciales. Esperamos al hacer tales inversiones que nosotros como nación podemos alcanzar nuevas alturas y traer más inversiones de capital a nuestra nación."
 GRN_focus_Black_Gold_Extraction_Efforts: "Esfuerzos de extracción de oro negro"
 GRN_focus_Black_Gold_Extraction_Efforts_desc: "Invertir en nuestros depósitos de petróleo nos dará mucha energía barata, así como ser un gran chip de negociación para futuros acuerdos comerciales. Como un lado también podemos utilizar el aceite extraído y el carbón para reforzar nuestras industrias sintéticas y petroquímicas."
 GRN_focus_Project_Glacial_Rubber: "Proyecto Glacial Rubber"
 GRN_focus_Project_Glacial_Rubber_desc: "Vasta experimentación e inversiones en VFF dedicados específicamente a cultivar árboles de caucho, para utilizar carbón y aceite en sintéticos y petroquímicos significa que podemos explorar todas las vías posibles para asegurar un suministro doméstico de caucho"
 GRN_focus_Polar_Bear_Policies: "Políticas de Oso Polar"
 GRN_focus_Polar_Bear_Policies_desc: "Con nuestra nación estable, desarrollada y equipada para la defensa nacional y posible ofensa ahora podemos empezar a mirar más allá de la isla. Nuestra política exterior dictará nuestro verdadero futuro y los deseos de alcanzar con nuestras propias manos."
 GRN_focus_The_Atlantic_Stepping_Stone: "El Atlantic Stepping Stone"
 GRN_focus_The_Atlantic_Stepping_Stone_desc: "Seamos realistas con nosotros mismos, cualquier dirección de política exterior real siempre va a involucrar a Islandia en algún momento. Así que vamos a sacar esto del camino y averiguar exactamente lo que haremos. Esto no sólo establecerá el pacto para nuestros futuros esfuerzos de política exterior, sino que será una prueba adecuada para nuestras capacidades para navegar por el paisaje moderno."
 GRN_focus_Investing_In_Brotherhood: "Invertir en la Hermandad"
 GRN_focus_Investing_In_Brotherhood_desc: "Si queremos estrechar los lazos y las relaciones, menos aún cualquier plan futuro de una unión potencial entre nosotros dos, entonces tendremos que construir confianza. Podemos hacerlo mediante una serie de inversiones que los benefician más que nosotros. Si jugamos el largo juego con esto entonces nos beneficiará a ambos al final. Recuerde que lento y constante gana la carrera."
 GRN_focus_Reykjavik_Investment_Firm: "Firma de inversiones Reykjavik"
 GRN_focus_Reykjavik_Investment_Firm_desc: "Islandia está en la OTAN, este es un problema. Debemos encontrar una manera de calmar la confianza y supuesta necesidad que Islandia tiene para los extranjeros, a saber, los estadounidenses ayudan si debemos asegurar la isla para nosotros mismos. Como tal les permite hacer una oferta que no pueden rechazar. Olvídate de esa buena huella, firma aquí mismo."
 GRN_focus_Operation_Real_Green: "Operación: Verde Real"
 GRN_focus_Operation_Real_Green_desc: "Hemos agotado todas nuestras opciones, tenemos que asegurar la isla para nuestra defensa subregional de la alta zona oceánica del norte. Pesca, comercio asegurado para nuestro interés y economía. Además de patrullar preventivamente contra medidas agresivas de proablación, la zona mejorará su estabilidad."
 GRN_focus_Passive_Administration_Act: "Ley de administración pasiva"
 GRN_focus_Passive_Administration_Act_desc: "Con Islandia ahora bajo nuestro control más directo debemos ayudar a integrar y formar una unión más estrecha de pueblos similares. Como tal, daremos un enfoque más pasivo esencialmente formando un enfoque confederal suave a pesar de la organización más federal."
 GRN_focus_The_North_Sea_Gambit: "El Juego del Mar del Norte"
 GRN_focus_The_North_Sea_Gambit_desc: "Las Islas Feroe son la mitad del Mar del Norte. Garantizaremos las islas por cualquier medio para establecer el escenario hacia la instigación de la reacción danesa. Esperamos llegar a donde Dinamarca declarará la guerra contra nosotros y, por lo tanto, pasar la doctrina del artículo 5 de la OTAN. Al hacerlo también podemos llegar al continente para una base más cercana de operaciones ya sea norte o sur."
 GRN_focus_Friends_On_The_Other_Side: "Amigos en el otro lado"
 GRN_focus_Friends_On_The_Other_Side_desc: "A fin de asegurar los corazones y las mentes de los isleños Faroe debemos buscar ser benevolentes en la naturaleza. Como tal haremos todo en nuestro mejor interés para servir a su mejor interés. Algunas conversaciones casuales sutiles alrededor de la isla con los locales y trabajadores del proyecto sobre cómo Dinamarca nunca les trató este bien es todo lo que necesitamos para marcar el ritmo y el tono para dejar que el gobierno se nos acerque."
 GRN_focus_Operation_Fair_Oh: "Operación: Feria Oh"
 GRN_focus_Operation_Fair_Oh_desc: "Así que las Islas Faroe están bajo control danés, pero parece que a los daneses realmente no les importa más que el status quo de las cosas. ¿Qué pasa si sólo metimos las islas y vemos lo que sucede? Si no hay sangre derramada o algo en la toma de posesión entonces es realmente un ataque y si podemos convencer a la gente para que se una a nosotros antes Dinamarca hace un llamamiento en ese momento que iría fervientemente fuera de su camino para ayudar a Dinamarca a luchar contra una nación que todo el mundo piensa que podría ser manejado por Dinamarca de todos modos. Es el plan perfecto agresivo pero no agresivo."
 GRN_focus_Continental_Shenanigans: "Shenanigans continentales"
 GRN_focus_Continental_Shenanigans_desc: "Con nuestras piedras de paso del Mar del Norte aseguramos ahora que volvemos nuestra atención al continente. En otros términos, volvemos a nuestro antiguo señor para hacer la caída en el continente antes de descubrir dónde nos dirigimos exactamente hacia el siguiente."
 GRN_focus_Family_Investments: "Inversiones familiares"
 GRN_focus_Family_Investments_desc: "Con Dinamarca siendo sabios con nuestros shenanigans debemos echarlos a través de un enfoque más pasivo de las cosas. Dado cómo ha sido nuestra historia reciente debemos dejarles relajar y perder su guardia para que podamos manejar las cosas de una manera más pacífica si es posible."
 GRN_focus_Jylland_Investment_Firm: "Firma de inversiones Jylland"
 GRN_focus_Jylland_Investment_Firm_desc: "Practicaremos como en Islandia. Una serie masiva de inversiones que nos permitirán coser en algunos asuntos públicos menores para aislar políticamente a Dinamarca de sus compromisos de alianza."
 GRN_focus_Operation_Middleman: "Operación: Middleman"
 GRN_focus_Operation_Middleman_desc: "Dinamarca es el intermediario entre los miembros de la familia nórdica y el continental libre para todos. Tenemos que asegurar esto si queremos garantizar operaciones lisas más allá del camino hacia nuestro objetivo final."
 GRN_focus_Civil_Service_Integration: "Integración de la administración pública"
 GRN_focus_Civil_Service_Integration_desc: "La normalización e integración de los servicios civiles daneses en el actual aparato de la administración pública permitirá realizar operaciones diarias más cohesivas y menos disruptivas tanto para los propios programas como para las personas que los necesitan."
 GRN_focus_Nordic_Regional_Operations: "Operaciones regionales nórdicas"
 GRN_focus_Nordic_Regional_Operations_desc: "Con el centro de mando alcanzado a través de la adquisición de Dinamarca ahora podemos generalizar mejor nuestros objetivos estratégicos y habilidades. Todavía tenemos el mismo formato, pero seguirá ahora más amplios alcances y o al menos enfoques más indirectos para mejorar la cohesión."
 GRN_focus_West_Nordic_Interests: "Intereses nórdicos occidentales"
 GRN_focus_West_Nordic_Interests_desc: "Buscaremos aumentar la influencia interna con el tiempo para asegurar los recursos noruegos y la aprobación civil de una unión nórdica más grande a medida que avanza el tiempo."
 GRN_focus_North_Fjords_Investment_Firm: "North Fjords empresa de inversiones"
 GRN_focus_North_Fjords_Investment_Firm_desc: "Similar a cómo manejamos Islandia y Groenlandia, desarrollaremos nuestros propios intereses mediante el desarrollo de los intereses noruegos."
 GRN_focus_Operation_Fjordsland: "Operación: Fjordsland"
 GRN_focus_Operation_Fjordsland_desc: "Garantizar a Noruega nos da acceso sin obstáculos a las rutas y recursos comerciales del Mar del Norte. Nos da un chip de negociación con la OTAN para ayudar a defender a Rusia y en general asegura una posición hacia la mayor región nórdica."
 GRN_focus_North_Sea_Negotiations: "Negociaciones del Mar del Norte"
 GRN_focus_North_Sea_Negotiations_desc: "Trabajar con la población y averiguar lo que quieren del nuevo status quo ayudará a mejorar y suavizar el proceso de integración general."
 GRN_focus_Central_Nordic_Interests: "Intereses nórdicos centrales"
 GRN_focus_Central_Nordic_Interests_desc: "Hacer nuestro mejor esfuerzo para asegurar nuestros intereses en Suecia y por lo tanto la región central de las naciones nórdicas sería muy beneficiosa para nuestros futuros esfuerzos."
 GRN_focus_Karlstad_Central_Investments_Agency: "Karlstad agencia central de inversiones"
 GRN_focus_Karlstad_Central_Investments_Agency_desc: "Trabajar para invertir y desarrollar la región alrededor de Karlstad y otras ciudades nos dará opiniones más favorables, pero también nos permitirá invertir en el futuro no sólo de Suecia sino también el nuestro."
 GRN_focus_Operation_Great_Northern_War: "Operación: Gran Guerra del Norte"
 GRN_focus_Operation_Great_Northern_War_desc: "El lado amistoso de la política nos ha fallado a pesar de la disposición general sueca en la región. Como tal, nos hemos visto obligados a recurrir a medios más contundentes para alcanzar nuestros objetivos finales."
 GRN_focus_Stockholm_Community_Programs: "Programas de la Comunidad de Estocolmo"
 GRN_focus_Stockholm_Community_Programs_desc: "Alcanzar a las comunidades y hacer más para fomentar impresiones estables, así como generalmente más positivas, ayudará a mejorar los esfuerzos de integración tanto con la población como con las administraciones locales."
 GRN_focus_Eastern_Nordic_Interests: "Intereses nórdicos orientales"
 GRN_focus_Eastern_Nordic_Interests_desc: "Asegurar a Finlandia nos haría un gran chip de negociación entre las potencias de la cabeza de los Estados Unidos y Rusia. Dado que Finlandia comparte una frontera significativa con el Gran Oso Oriental, también podemos ver lo que podemos hacer para beneficiar nuestros objetivos futuros."
 GRN_focus_Suomen_Investment_Agency: "Agencia de inversiones Suomen"
 GRN_focus_Suomen_Investment_Agency_desc: "Asegurar los desarrollos y el futuro que no sólo lo que parece que el pueblo finlandés quiere sino también hacer lo que podemos para facilitar el futuro que deseamos es una gran manera de ver si podemos asegurar a Finlandia por nuestros propios medios."
 GRN_focus_Operation_Mannerheim: "Operación: Mannerheim"
 GRN_focus_Operation_Mannerheim_desc: "Asegurar las tierras congeladas de Finlandia será como asegurar un hogar lejos del hogar. El terreno, aunque mucho más plano en general todavía tiene una dureza similar en su entorno. Como tal, deberíamos ser capaces de asegurar estas tierras sin mucha dificultad en general."
 GRN_focus_Continued_Peaceable_Autonomy: "Autonomía Peacable continua"
 GRN_focus_Continued_Peaceable_Autonomy_desc: "El pueblo finlandés es un pueblo apreciado que goza de soledad tanto como solidaridad entre sus semejantes culturales. Como tal con un entendimiento mutuo y una posición más de igual tipo de acuerdo, podremos controlar el territorio con gran ayuda mientras haya un trato justo y no haya un armamento fuerte de los civiles o del gobierno en una voluntad contra ellos mismos. Mientras esto suena mal para nosotros su en realidad mucho más fácil entonces muchos parecen darse cuenta."
 GRN_focus_Solidifying_Nordic_Unity: "Consolidación de la unidad nórdica"
 GRN_focus_Solidifying_Nordic_Unity_desc: "Con nuestras ambiciones alcanzando una humilde conclusión debemos simplemente relajarnos y disfrutar de los frutos de nuestro trabajo mientras nos propusimos crear una nueva unión nórdica que rivalizará con aquellos otros sindicatos alrededor del mundo."
 GRN_focus_Continental_Ambitions: "Ambiciones continentales"
 GRN_focus_Continental_Ambitions_desc: "Con las naciones nordicas consolidadas ahora podemos centrar nuestra atención en el sur. Si bien estos objetivos son cada vez más grandes, podríamos engordar seriamente en la práctica. Si utilizamos nuestra plantilla diplomática como hasta ahora debemos ser capaces de alcanzar el siguiente paso en nuestras ambiciones extranjeras. La Unión Continental Inuit."
 GRN_focus_Eastern_Continental_Interests: "Intereses continentales orientales"
 GRN_focus_Eastern_Continental_Interests_desc: "Con nuestras consolidaciones del norte, ahora podemos mirar hacia el sur. Como tal, crearemos una gran frontera oriental ganando un punto de mira en la región del Báltico."
 GRN_focus_Operation_Nordic_Adjacent: "Operación: Adyacente Nórdico"
 GRN_focus_Operation_Nordic_Adjacent_desc: "Estonia es la zona de aterrizaje más cercana de nuestras posesiones finlandesas. Podemos o paradrop o invadir naval amplia desde Helsinki y asegurar rápidamente a la nación antes de que otros poderes piensen en protestar."
 GRN_focus_Operation_Riga_River: "Operación: Río Riga"
 GRN_focus_Operation_Riga_River_desc: "Asegurar a Letonia nos da una meseta central para extender y asegurar el resto de la región del Báltico."
 GRN_focus_Operation_Vilnius: "Operación: Vilnius"
 GRN_focus_Operation_Vilnius_desc: "Lituania es posiblemente el poder más desarrollado dentro de la región del Báltico, los noqueamos y los otros dos serán como un paseo por la ciudad."
 GRN_focus_Baltic_Behestment: "Baltic Behestment"
 GRN_focus_Baltic_Behestment_desc: "Con las autoridades locales y las poblaciones civiles que comienzan a relajarse y aceptar el nuevo status quo de cosas que ahora podemos empezar a integrar las antiguas naciones bálticas. Aunque tienen una fuerte voluntad como pueblo y tal vez podamos trabajar para darles una posición similar como hemos trabajado con las autoridades locales finlandesas."
 GRN_focus_North_Sea_Security: "Seguridad del Mar del Norte"
 GRN_focus_North_Sea_Security_desc: "Garantizar la totalidad del Mar del Norte y el Atlántico norte resultará inmensamente útil en términos de influencia global. Debemos trabajar para alinear las islas celtas y sus ocupantes respectivos para que podamos allanar el camino para nuestra regla más graciosa."
 GRN_focus_Operation_Albion: "Operación: Albion"
 GRN_focus_Operation_Albion_desc: "Asegurar el núcleo de lo que es y o fue el «Reino Unido» será crucial para nuevas operaciones en la Isla Celta. Por no mencionar el establecimiento de una posición crítica para cualquier travesía continental occidental."
 GRN_focus_Operation_Highlander: "Operación: Highlander"
 GRN_focus_Operation_Highlander_desc: "Asegurar la región escocesa nos permite cerca del control completo de la zona estratégica del Mar del Norte. Esto sentará las bases para un avance general del sur en la isla principal."
 GRN_focus_Operation_Great_Western_Nation: "Operación: Gran Nación Occidental"
 GRN_focus_Operation_Great_Western_Nation_desc: "Ocupación estratégica de las Gales y lo que una vez fue el Gran Ferrocarril Occidental nos permitirá utilizar la infraestructura para coordinarnos hacia los intereses en el oeste de Irlanda y el sureste con Inglaterra."
 GRN_focus_Operation_Be_My_Mann: "Operación: Sé mi Mann"
 GRN_focus_Operation_Be_My_Mann_desc: "Asegurar la Isla estratégica de Mann nos dará una nota crítica al manejar cualquier asunto naval en relación con toda la Isla Celta."
 GRN_focus_Operation_Ulster: "Operación: Ulster"
 GRN_focus_Operation_Ulster_desc: "Con la isla todavía dividida hasta hoy nuestra mejor apuesta es deshacerse del estado irlandés más débil del norte de Ulster. Asegurar esto nos permite marchar hacia el sur y asegurar el resto de la esmeralda isla."
 GRN_focus_Operation_Emerald_Isle: "Operación: Esmeralda"
 GRN_focus_Operation_Emerald_Isle_desc: "La seguridad de toda Irlanda nos permitirá realizar mejores avances en la mayoría occidental del continente. Por no mencionar que ayudará como un escenario para la otra isla con el «Reino Unido»."
 GRN_focus_Celtic_Consolidations: "Celtic Consolidations"
 GRN_focus_Celtic_Consolidations_desc: "Comenzar los esfuerzos de integración y normalizar nuestro dominio y autoridad sobre las tierras y la gente tomará tiempo. Pero proporcionar ayuda, servicios y mostrarles que podemos llevarnos bajo la nueva bandera permitirá a todos volver al columpio de las cosas."
 GRN_focus_Western_European_Advances: "Avances de Europa occidental"
 GRN_focus_Western_European_Advances_desc: "Nuestra marcha constante a través del continente será un gran salto hacia delante mientras miramos hacia la sección central occidental de las naciones."
 GRN_focus_Operation_Bonaparte: "Operación: Bonaparte"
 GRN_focus_Operation_Bonaparte_desc: "Francia es la piedra angular del teatro de operaciones de Europa occidental. No sólo eso, sino que sirve como la puerta de entrada a Iberia cuando decidimos bajar allí. Es hora de consolidar la nación más occidental en el eje central del continente."
 GRN_focus_Operation_Windmill: "Operación: molino de viento"
 GRN_focus_Operation_Windmill_desc: "Los Países Bajos servirán como un fino punto de mira occidental en el continente. Con la mayor parte del país siendo litoral debemos ser capaces de asegurarlo en ningún momento."
 GRN_focus_Operation_Rhine_Rumble: "Operación: Rin Rumble"
 GRN_focus_Operation_Rhine_Rumble_desc: "Alemania define el punto más central del continente europeo en su conjunto. Lo aseguramos y aseguramos todo el continente a su debido tiempo."
 GRN_focus_Operation_Chocolate_Waffle: "Operación: gofre de chocolate"
 GRN_focus_Operation_Chocolate_Waffle_desc: "Bélgica, una nación que razonablemente no debería existir. Siendo una creación británica hace cientos de años, la nación sirve como espina en el lado de la verdadera unidad europea. Quitaremos esta espina con la máxima prisa."
 GRN_focus_Operation_Speed_Bump: "Operación: Bomba de velocidad"
 GRN_focus_Operation_Speed_Bump_desc: "Es Luxemburgo, no es una amenaza excepto cuando se une a una coalición de otras naciones. Vamos a tomarlo ahora, bien adiós."
 GRN_focus_French_Values_Greenlandic_Leadership: "Valores franceses, Liderazgo Groenlandia"
 GRN_focus_French_Values_Greenlandic_Leadership_desc: "Garantizar la alta agitación de la población de franquicia cumple con el nuevo status quo tomará cantidades significativas de tiempo y esfuerzo. Pero si podemos demostrar que no queremos cambiar sus valores, simplemente cambiar el liderazgo a cargo entonces esperamos poder trabajar con la gente mucho más."
 GRN_focus_German_Traditions_Greenlandic_Initiative: "Las tradiciones alemanas, las iniciativas groenlandesas"
 GRN_focus_German_Traditions_Greenlandic_Initiative_desc: "Alemania tiene una rica historia de tradiciones militares. Si podemos capitalizar en esto entonces estamos seguros para la hegemonía continental. Proeza marcial alemana mezclada con ambiciones de autovalidación groenlandesa."
 GRN_focus_Low_Countries_Low_Maintainance: "Países bajos, bajo mantenimiento"
 GRN_focus_Low_Countries_Low_Maintainance_desc: "La expectativa de los Países Bajos es simplemente ser tratada equitativamente y se les permite permanecer libre-espírita. Considerando que estamos tratando de crear una unión de iguales, esto está resultando mucho más fácil de lo esperado."
 GRN_focus_Iberian_Atlantic_Interests: "Intereses Ibéricos del Atlántico"
 GRN_focus_Iberian_Atlantic_Interests_desc: "La región ibérica tiene un punto de encuentro estratégico entre la mayor parte del Atlántico central, así como un punto de acceso principal para el Mediterráneo. Debemos asegurar este punto vital de comercio y logística si queremos asegurar el continente en general."
 GRN_focus_Operation_Castile: "Operación: Castilla"
 GRN_focus_Operation_Castile_desc: "España es el perro principal en Iberia, lo aseguramos y casi aseguramos la región."
 GRN_focus_Operation_Fontainebleau: "Operación: Fontainebleau"
 GRN_focus_Operation_Fontainebleau_desc: "Napoleón trató de conquistar al portugués a través de un tratado con España en ese momento. Hoy no es nada así, porque conquistaremos Portugal por el bien de la unidad ibérica y del federalismo europeo. Un nuevo amanecer nos espera y Portugal es la puerta de entrada a la consolidación ibérica."
 GRN_focus_Operation_The_Other_Galicia: "Operación: La Otra Galicia"
 GRN_focus_Operation_The_Other_Galicia_desc: "La mayoría de la gente fuera de Europa si se enteran de Galicia piensan en la región alrededor del oeste de Ucrania. Pero en realidad nos referimos a abordar la nación gallega en el noroeste de Iberia."
 GRN_focus_Operation_Basquing_In_the_Sun: "Operación: Basquing In The Sun"
 GRN_focus_Operation_Basquing_In_the_Sun_desc: "Tratar con la nación vasca será un simple esfuerzo si no lo hemos hecho ya. ¿Lo hicimos? Lo olvido."
 GRN_focus_Operation_Barcelona: "Operación: Barcelona"
 GRN_focus_Operation_Barcelona_desc: "Asegurar la sección nororiental de Iberia nos permite tener una posición al otro lado de las cordilleras que definieron la frontera franco-español."
 GRN_focus_Operation_Casablanca: "Operación: Casablanca"
 GRN_focus_Operation_Casablanca_desc: "La región sur conocida como Andalucía dentro de Iberia nos dará un control indiscutible de nuestra mitad del estrecho de Gibraltar."
 GRN_focus_Iberian_Idealism: "Iberian Idealism"
 GRN_focus_Iberian_Idealism_desc: "Con la región bajo nuestro control, ahora podemos empezar a fomentar un sentido de unidad regional. Usando las culturas y pueblos, su historia y su espíritu para impulsar un sentido de nuevo orgullo. Unidad a través de la fuerza y la prosperidad, camarada por el bien y el mal."
 GRN_focus_Alpine_Block_Nations: "Naciones de bloques alpinos"
 GRN_focus_Alpine_Block_Nations_desc: "La región central del Sur está dominada por terrenos montañosos. Desde los rangos alpinos de la mayor parte del norte de las fronteras de Italia a los diversos rangos que bajan por la propia nación italiana. Debemos asegurar esta región naturalmente defensiva si vamos a avanzar más hacia el este."
 GRN_focus_Operation_Neutral_No_More: "Operación: Neutral No Más"
 GRN_focus_Operation_Neutral_No_More_desc: "La nación de Suiza es una nación de montañas. Lo conquistamos y podemos conquistar casi cualquier cosa."
 GRN_focus_Operation_Vienna_Calling: "Operación: Llamamiento de Viena"
 GRN_focus_Operation_Vienna_Calling_desc: "Desde los alpes hasta las llanuras húngaras, aseguraremos la nación de Austria y abriremos el camino hacia el este y el sur."
 GRN_focus_Operation_Slovene_And_Slide: "Operación: Esloveno y diapositivas"
 GRN_focus_Operation_Slovene_And_Slide_desc: "Conseguir una posición en los Balcanes del Norte nos ayudará a asegurar la región una vez que volvemos nuestra atención hacia ella."
 GRN_focus_Operation_Gelato: "Operación: Gelato"
 GRN_focus_Operation_Gelato_desc: "La nación italiana se encuentra estratégicamente en el centro sur de Europa y el Mar Mediterráneo. Aseguramos esto y aseguramos un aparato naval vital para nuevas operaciones."
 GRN_focus_Securing_Local_Interests: "Garantía de intereses locales"
 GRN_focus_Securing_Local_Interests_desc: "La búsqueda de los intereses de las poblaciones locales y sus necesidades ayudarán a brillar una luz nueva y más positiva sobre la situación. Esperamos que al llegar mejor a la gente podamos tener una transición más suave del poder."
 GRN_focus_Great_Eastern_Interests: "Grandes intereses orientales"
 GRN_focus_Great_Eastern_Interests_desc: "Con nuestra posición en el este asegurada ahora podemos ramificarnos al resto de Europa del Este. Desde las fronteras polacas y checas hasta las fronteras bielorrusas y ucranianas. Comenzaremos nuestra marcha al este."
 GRN_focus_Operation_Heartbeat: "Operación: Latido cardíaco"
 GRN_focus_Operation_Heartbeat_desc: "Polonia es el corazón de la Europa oriental. Se lo ha llamado Texas Europeo debido a su fuerte inversión en preparación militar. Ahora vamos a poner eso en la prueba final."
 GRN_focus_Operation_Carpathia: "Operación: Carpathia"
 GRN_focus_Operation_Carpathia_desc: "La mayoría de la nación eslovaca se sienta sobre la curva norte de la gran cordillera carpática. Si tenemos que tener una plataforma general para ir al sur a los Balcanes, entonces debemos cruzar estas montañas."
 GRN_focus_Operation_Final_Rhapsody: "Operación: Rhapsody final"
 GRN_focus_Operation_Final_Rhapsody_desc: "Garantizar la Chequia nos permite solidificar bastante el enfoque norte completo en los Balcanes. Es sólo un paso más hacia la unidad europea."
 GRN_focus_Operation_White_Russian: "Operación: ruso blanco"
 GRN_focus_Operation_White_Russian_desc: "Bielorrusia es la base que mantiene el interés ruso en Europa, aparte de las viejas ambiciones históricas por supuesto. Tendremos que sacar los vientos de sus velas si queremos realmente solidificar nuestro control en el continente."
 GRN_focus_Operation_Bread_Basket: "Operación: Cesta de pan"
 GRN_focus_Operation_Bread_Basket_desc: "Asegurar la canasta de pan del continente nos beneficiaría de muchas maneras, es una certeza que debemos obtener."
 GRN_focus_Operation_Soviet_Storm: "Operación: tormenta soviética"
 GRN_focus_Operation_Soviet_Storm_desc: "Transnistria es una nación que en sí misma es una cápsula del tiempo. Ser uno de los últimos bastiones de la URSS esta nación mientras que pequeño es extremadamente orgulloso y desafiante a través de su casi sombra como maquinaciones que lo mantienen vivo de alguna manera como una nación."
 GRN_focus_Operation_Your_Right_No_Your_Other_Right: "Operación: Tu derecha, no tu otra derecha"
 GRN_focus_Operation_Your_Right_No_Your_Other_Right_desc: "Debemos atacar Moldavia..no la región rumana de la nación. Sí, sé que es confuso pero no me preguntes, pregúntales cuando lleguemos."
 GRN_focus_Eastern_Territorial_Authority_Bureau: "Oficina de la autoridad territorial oriental"
 GRN_focus_Eastern_Territorial_Authority_Bureau_desc: "El ETAB es una agencia dedicada a contender con las naciones orientales más libres. Estas personas tienen vastas tierras rurales que son más o menos aún inadvertidas en términos de centralización. Podemos hacer proyectos de infraestructura y programas de divulgación comunitaria para calmarnos con esperanza y resolver cualquier problema prolongado que podamos tener."
 GRN_focus_Balkan_Bounties: "Balkan Bounties"
 GRN_focus_Balkan_Bounties_desc: "Las uñas finales en este extenso proyecto nuestro, las naciones Bakan. Una tierra de guerras e historia trabajaremos extensamente para domesticar este volátil zoológico de una región."
 GRN_focus_Operation_Nosferatu: "Operación: Nosferatu"
 GRN_focus_Operation_Nosferatu_desc: "El tazón transilvaniano dentro de las Montañas Carpáticas es una posición estratégica defensiva. La propia Romainia es también sede de una cantidad justa de producción de energía y, como tal, podemos utilizar mejor esos recursos en beneficio de todos."
 GRN_focus_Operation_Bulgar: "Operación: Bulgar"
 GRN_focus_Operation_Bulgar_desc: "La solidificación de la sección oriental a lo largo del Mar Negro nos ayudará a consolidar nuestros esfuerzos hacia el interior de los Balcanes."
 GRN_focus_Operation_Alexander_Not_So_Great: "Operación: Alexander no tan grande"
 GRN_focus_Operation_Alexander_Not_So_Great_desc: "La nación de Macedonia afirma tener la orgullosa figura histórica de Alexander The Great. Bueno, no lo veo ahora así que vamos a tomar las cosas de aquí."
 GRN_focus_Operation_Trianon: "Operación: Trianon"
 GRN_focus_Operation_Trianon_desc: "La nación húngara atraviesa la meseta central norte de los Balcanes. Si lo aseguramos tenemos un camino claro hacia el sur hacia el Mar Mediterráneo."
 GRN_focus_Operation_Princip: "Operación: principio"
 GRN_focus_Operation_Princip_desc: "Desde la Mano Negra, causando una guerra mundial, le damos ahora a la nación serbia una mano de apoyo para establecer uno de los mayores incendiarios de la región."
 GRN_focus_Operation_Koso_Woah: "Operación: Koso Woah"
 GRN_focus_Operation_Koso_Woah_desc: "El golpe de velocidad que es Kosovo es más de una espina en el lado de Serbia, entonces será para nosotros. Como tal esto debe ser un esfuerzo rápido."
 GRN_focus_Operation_Scissors: "Operación: Tijeras"
 GRN_focus_Operation_Scissors_desc: "Asegurar Croacia nos permite asegurar un importante aparato costero y asegurar posiciones de ataque al flanquear mientras buscamos más ambiciones del sur."
 GRN_focus_Operation_Minefield: "Operación: Minefield"
 GRN_focus_Operation_Minefield_desc: "Nuestra mayor preocupación por someter a la nación muy dividida de Bosnia es el hecho de que todo el país sea prácticamente un campo minero pre-laid. Como tal, tendremos que traer un montón de equipo para manejarlos si vamos a realmente llegar a cualquier lugar pronto."
 GRN_focus_Operation_Mountain_Man: "Operación: Hombre de Montaña"
 GRN_focus_Operation_Mountain_Man_desc: "Las montañas de Montenegro son una galleta dura para romper, pero llegaremos pronto."
 GRN_focus_Operation_Adriatic_Gateway: "Operación: Puerta Adriática"
 GRN_focus_Operation_Adriatic_Gateway_desc: "Garantizar a Albania nos permite cerrar el Mar Adriático. Al hacer esto aseguramos un enorme potencial de construcción naval y esencialmente asegurar una enorme red portuaria que podríamos utilizar para operaciones en el mar Mediterráneo teh."
 GRN_focus_Operation_This_Is_Sparta: "Operación: Esto es Sparta"
 GRN_focus_Operation_This_Is_Sparta_desc: "Grecia, la nación peninsular e isla que posee importantes tesoros culturales e históricos. Garantizaremos este centro de la historia misma, pero debemos hacer todo lo posible para no destruir los sitios históricos."
 GRN_focus_Southern_Territorial_Authority_Commission: "Comisión de la autoridad territorial del sur"
 GRN_focus_Southern_Territorial_Authority_Commission_desc: "Crear una comisión dedicada nos permitirá enfocar las medidas de integración y unidad para que no tengamos un problema nacional debido a los problemas de un área específica de no mantener sus manos a sí mismos."
 GRN_focus_Establishing_The_Frozen_Federation: "Establecimiento de la Federación Frozen"
 GRN_focus_Establishing_The_Frozen_Federation_desc: "Por fin lo hemos hecho. Hemos creado una nación federal unida que une a las naciones del norte congeladas con el resto de las naciones de la Unión Continental Europea. Por supuesto que no es perfecto y por lo tanto no toda la región geográficamente continental de Europa. Pero independientemente de que esto sea nuestra participación en la historia y haremos nuestro más maldito para mantenernos fieles a los valores y pueblos que ahora tenemos bajo nuestras alas. ¡A la Federación!"
 GRN_focus_The_Great_Ice_Shelf: "El gran estante de hielo"
 GRN_focus_The_Great_Ice_Shelf_desc: "El vasto interior de nuestra nación es sólo una enorme hoja de hielo. Bueno, con la forma en que el desarrollo de nuestra nación ha estado llegando hemos sido capaces de cortar en el estante en la utilización controlada del agua congelada. Ahora podemos dirigir nuestra atención hacia el interior con pleno gusto y prepararnos para establecerlo y desarrollarlo adecuadamente. Porque el futuro es verde y descubriremos las tierras debajo del hielo."
 GRN_focus_Southern_Interior_Development_Projects: "Proyectos de desarrollo interior del Sur"
 GRN_focus_Southern_Interior_Development_Projects_desc: "Comenzaremos a abordar la región interior del sur que hemos marcado para el desarrollo y la configuración logística."
 GRN_focus_Southern_Settlement_Projects: "Proyectos de Asentamientos del Sur"
 GRN_focus_Southern_Settlement_Projects_desc: "Para ayudar logísticamente empezaremos a establecer una pequeña serie de asentamientos estratégicamente ubicados para impulsar no sólo a la población local sino también crear una especie de cadena de suministro dentro de la región. Esto nos ayudará a facilitar futuros proyectos que nos esforzaremos por tratar de domar finalmente una buena sección del Gran Estante de Hielo."
 GRN_focus_Southern_Infrastructure_Projects: "Proyectos de infraestructura del sur"
 GRN_focus_Southern_Infrastructure_Projects_desc: "Para conectar nuestros asentamientos y comenzar cualquier tipo de actividad económica, tendremos que tener alguna forma de infraestructura para asegurarnos de establecer el estándar de oro de cómo domar verdaderamente la naturaleza."
 GRN_focus_Southern_Economic_Projects: "Proyectos económicos del Sur"
 GRN_focus_Southern_Economic_Projects_desc: "Con las personas e infraestructura presentes ahora dentro de la región del Interior Sur podemos comenzar a construir lentamente una base económica interna o local. Esta fundación establecerá el escenario para un crecimiento considerable a medida que avance el tiempo."
 GRN_focus_Southern_Mining_Projects: "Proyectos mineros del sur"
 GRN_focus_Southern_Mining_Projects_desc: "Con la región estabilizando lentamente en los asuntos económicos y sociales su momento actual para iniciar proyectos de minería de gran valor. Utilizaremos el hielo para poder minar continuamente de forma que podamos obtener datos geológicos reales, así como evitar el sobrecalentamiento del equipo debido al diferencial de temperatura."
 GRN_focus_Taming_The_Southern_Interior: "Taming El Interior Sur"
 GRN_focus_Taming_The_Southern_Interior_desc: "Con la gente, infraestructura y recursos disponibles ahora podemos decir que realmente hemos domesticado parte de la Gran Estante de Hielo. Por supuesto que nuestro trabajo no está hecho, lejos de él. Ahora podemos mirar con confianza el gran horizonte norteño y decir que estamos en un viaje grandioso y fructífero."
 GRN_focus_Central_Plateau_Development_Projects: "Proyectos centrales de desarrollo de mesetas"
 GRN_focus_Central_Plateau_Development_Projects_desc: "Con la región meridional domada fundamentalmente hablando ahora podemos comenzar a tomar la gran cruzada de hielo en la región central. Con más hielo y potencial área de tierra podremos invertir en métricas más fundamentales."
 GRN_focus_Central_Settlement_Projects: "Proyectos de asentamientos centrales"
 GRN_focus_Central_Settlement_Projects_desc: "Al igual que en la región sur empezaremos a establecer asentamientos estratégicos a lo largo de la meseta."
 GRN_focus_Central_Infrastructure_Projects: "Proyectos de infraestructura central"
 GRN_focus_Central_Infrastructure_Projects_desc: "Con nuestros asentamientos establecidos podemos empezar a crear una red de infraestructura suficiente para vincular adecuadamente todo juntos."
 GRN_focus_Central_Economic_Projects: "Proyectos Económicos Centrales"
 GRN_focus_Central_Economic_Projects_desc: "Población, cheque. Infraestructura, cheque. Ahora avanzamos para establecer un aparato económico local."
 GRN_focus_Central_Mining_Projects: "Proyectos de minería central"
 GRN_focus_Central_Mining_Projects_desc: "Al igual que con la región meridional, hemos creado finalmente las redes tanto económica como socialmente para preparar operaciones de extracción de recursos. El área es mucho más grande que el sur, así que aquí está para una empresa fructífera."
 GRN_focus_Taming_The_Central_Plateau: "Taming La meseta central"
 GRN_focus_Taming_The_Central_Plateau_desc: "Con la gente, los asentamientos, la comida, la economía y los recursos en su lugar ahora podemos decir oficialmente y con confianza que hemos domesticado a la Gran Plataforma de Hielo. Aunque habrá muchas dificultades a medida que el tiempo marche, pero por ahora y por el futuro previsible podemos lucir en la gran gloria polar de nuestra nación grande y próspera."
 GRN_eu_adjacent_nation: "Una nación adyacente de la UE"
 GRN_eu_adjacent_nation_desc: "Groenlandia está en una situación interesante. Ser el más alejado del continente europeo es y probablemente nunca será una nación miembro de la UE. Sin embargo, debido a su condición de colonia coronaria danesa se le da la misma migración y condición de viaje que cualquier otro Estado miembro de la UE. Como tantos Groenlandia utilizan esto como una manera de buscar mejores oportunidades educativas debido a la falta de desarrollo general de la isla."
 GRN_economic_pains: "Económicos"
 GRN_economic_pains_desc: "La población de Groenlandia ha permanecido alrededor de 50 mil durante décadas y ha sido más pequeña aún cuando el clima y la logística de la nación se convierten en la base del desarrollo. En los nuevos milenios continúa el problema y los líderes de la nación deben buscar hacer algo para adaptar y ajustar las necesidades de la economía si ella y la propia nación van a llegar a ser más que simplemente estancados."
 GRN_idea_colonial_subsidy: "Subvenciones coloniales"
 GRN_idea_colonial_subsidy_desc: "Nuestra nación está muy subdesarrollada hasta un punto en el que dependemos mucho de los subsidios daneses para las operaciones diarias. Si vamos a pensar incluso en la independencia de la corona danesa entonces debemos encontrar una manera de ya no requerir esta subvención como un medio de nuestra capacidad para simplemente sobrevivir."
 GRN_idea_narrow_gauge_nation: "Estrecha nación de Gauge"
 GRN_idea_narrow_gauge_nation_desc: "La flexibilidad y eficacia en función de los costos de la vía estrecha, así como el equipo, nos permitirán impulsar el desarrollo y la conectividad de la nación en general. Además, cuenta con el beneficio de seguridad añadido de ser más barato para hacer más seguro en comparación con la pista y equipo estándar convencional."
 GRN_idea_battle_for_independence: "Batalla para la independencia"
 GRN_idea_battle_for_independence_desc: "Hemos llegado a un punto donde nuestra independencia está asegurada. Comenzaremos campañas de presión masivas para asegurar que nuestra independencia se asegure dentro de nuestra vida."
 GRN_ideas_political_freedoms: "Libertades políticas"
 GRN_ideas_political_freedoms_desc: "Con nuestra nación libre de elegir lo que su pueblo desea no sentimos ninguna restricción a una ideología específica."
 GRN_ideas_emerging_political_influences: "Influencias políticas emergentes"
 GRN_ideas_emerging_political_influences_desc: "Con nuestra nación ahora independiente podemos enfocarnos en mostrar un enfoque moderno a nuestra política mientras emergemos en este nuevo mundo valiente."
 GRN_ideas_non_aligned_political_influences: "Influencias políticas no alineadas"
 GRN_ideas_non_aligned_political_influences_desc: "Con nuestra nación libre para establecer el camino que queremos, ningún lado geopolítico busca beneficiarnos verdaderamente y como tal buscaremos enfocarnos en nosotros mismos de una manera más neutral."
 GRN_ideas_nationalist_political_influences: "Influencias políticas nacionalistas"
 GRN_ideas_nationalist_political_influences_desc: "Nuestra nación es libre, nuestro pueblo está unido, nuestra nación es la máxima prioridad para nuestro enfoque en el futuro. El nacionalismo groenlandés nos da paz mental."
 GRN_idea_alumina_research_institute: "Instituto de Investigación Alumina"
 GRN_idea_alumina_research_institute_desc: "La creación de la ARI es fundamental para comprender la extracción, el perfeccionamiento y la utilización eficiente de los recursos. Este complejo dedicado R&D impulsará a nuestra nación a nuevas alturas en términos de negociaciones comerciales extranjeras, así como medios más prácticos de políticas autarcas."
 GRN_idea_economic_development_visas: "Visados de Desarrollo Económico"
 GRN_idea_economic_development_visas_desc: "Aquellos que buscan moverse y establecerse en la nación pueden solicitar una visa de clase 1 que se conoce como Visa de Desarrollo Económico. El EDV es esencialmente un proceso de a bordo para ayudar a los nuevos ciudadanos a establecerse y encontrar empleo en el que puedan contribuir al desarrollo y crecimiento general de la nación."
 GRN_idea_sanctioned_immigration_efforts: "Actividades de inmigración sancionadas"
 GRN_idea_sanctioned_immigration_efforts_desc: "A través de esfuerzos dedicados intentaremos asegurar un crecimiento constante de la población a través de la inmigración."
 GRN_idea_strategic_mineral_leasing: "Leasing Minerales Estratégicos"
 GRN_idea_strategic_mineral_leasing_desc: "La declaración de arrendamiento mineral a empresas extranjeras es una espada muy aguda para manejar. Debemos regular específicamente lo que pueden míos, donde pueden mineros y dónde irán esos minerales. Como tal, podemos esperar limitar cualquiera de las formas más excesivas de injerencia extranjera dentro de nuestra estructura política cuando sea posible y utilizarlas para desarrollar nuestros chips de negociación."
 GRN_idea_contracting_a_workforce: "Contratación A Workforce"
 GRN_idea_contracting_a_workforce_desc: "Utilizar el aparato de seguridad aduanera y fronteriza para ayudar a asegurar una fuerza laboral contratada nos permite ampliar las empresas e industrias a un ritmo constante y más fiable. Después de todo, leyeron el contrato y lo firmaron."
 GRN_idea_agriculture_automations: "Agricultura Automatizaciones"
 GRN_idea_agriculture_automations_desc: "Nuestro principal problema que enfrenta nuestra nación es simplemente mantener una mano de obra estable para emplear realmente. Como tal hemos decidido que invertiremos en el sector agrícola para reducir considerablemente la necesidad de recursos humanos adicionales en el sector."
 GRN_idea_war_production_automations: "Automatizaciones de producción de guerra"
 GRN_idea_war_production_automations_desc: "Nuestro principal problema que enfrenta nuestra nación es simplemente mantener una mano de obra estable para emplear realmente. Como tal hemos decidido que invertiremos en el sector de producción de guerra para reducir considerablemente la necesidad de recursos humanos adicionales en el sector. Liberar tanto a los trabajadores como a la mano de obra potencial para el ejército si es necesario."
 GRN_idea_industrial_automations: "Automatizaciones industriales"
 GRN_idea_industrial_automations_desc: "Nuestro principal problema que enfrenta nuestra nación es simplemente mantener una mano de obra estable para emplear realmente. Como tal hemos decidido que invertiremos en el sector manufacturero para reducir considerablemente la necesidad de recursos humanos adicionales en el sector. Este sector cada vez más expandido generalmente requiere la mayoría de los trabajadores debido a los medios de escalada y por lo tanto esto debe realmente ser más beneficioso para nosotros."
 GRN_idea_corporate_automations: "Automatizaciones corporativas"
 GRN_idea_corporate_automations_desc: "Nuestro principal problema que enfrenta nuestra nación es simplemente mantener una mano de obra estable para emplear realmente. Como tal hemos decidido que vamos a invertir en los Servicios de Oficina & Sectores Tecnológicos para reducir considerablemente la necesidad de recursos humanos adicionales en el sector. Este sector de recursos humanos, por lo general, requiere la mayor parte de los trabajadores debido a las demandas crudas del sector y así esto podría realmente resultar más beneficioso para nosotros."
 GRN_idea_strategic_mining_automations: "Automatizaciones de minería estratégica"
 GRN_idea_strategic_mining_automations_desc: "Al reelaborar cómo nos dedicamos a los recursos y enfocarnos en la capacidad de enviar a menos personas a las minas, siempre que sea posible podemos maximizar los esfuerzos mineros sin el riesgo inminente de pérdida potencial de vida. Por supuesto que no va a ser perfecto, pero estos vehículos autónomos y ciertas piezas de equipo deben permitir oportunidades mucho mejores para presentarse."
 GRN_idea_pro_military_economic_organization: "Pro-Militar Economic Organization"
 GRN_idea_pro_military_economic_organization_desc: "Mediante la reorientación de la economía en torno a más necesidades civiles y de reclutamiento mejoraremos las capacidades de fabricación de nuestras plantas de producción de armas para reducir la mano de obra general necesaria para operar las instalaciones. Por supuesto, hacer una revisión tan drástica reducirá las habilidades de producción cruda, pero una vez que se estabilicen las operaciones y en línea estas instalaciones deben ser capaces de producir más con mucho menos."
 GRN_idea_frozen_warfare_training: "Formación de celos congelados"
 GRN_idea_frozen_warfare_training_desc: "Nuestros programas de capacitación se centrarán principalmente en el combate climático invernal y frío. Por supuesto trataremos de hacer diferentes entrenamientos cuando y donde sea posible, pero nuestro hogar es frío y por lo tanto debemos entrenar adecuadamente para defenderlo."
 GRN_idea_polar_logistics_doctrine: "Doctrina de logística Polar"
 GRN_idea_polar_logistics_doctrine_desc: "Fundamentalmente construir nuestro equipo para ser mejor utilizado en el frío extremo nos permite luchar mejor cómo queremos si una fuerza enemiga decide hacer la caída de tierra en nuestra isla."
 GRN_idea_artillery_specialist_corps: "Cuerpo Especialista de Artillería"
 GRN_idea_artillery_specialist_corps_desc: "La artillería es el pan y la mantequilla para tratar más daño que recibir si estás en una buena posición. Para mantener esto a nuestra ventaja tendremos que desarrollar y cultivar nuestro cuerpo de artillería a un estándar que hace nuestras bajas lo más limitada posible."
 GRN_idea_heavy_anti_air_investments: "Inversiones pesadas Antiaéreo"
 GRN_idea_heavy_anti_air_investments_desc: "En la era moderna de combate, la nueva reina del campo de batalla es el avión. Combatientes, bombarderos todo lo que necesites hecho lo harán. Bueno, ya que nuestro ejército es tan pequeño necesitamos encontrar una manera de hacer que el enemigo no sea capaz de hacer lo que quieren. Como tal, comenzaremos una fuerte inversión en el diseño de equipos antiaéreos y desarrollos para asegurar que nuestros soldados sobre el terreno tengan una verdadera oportunidad de lucha."
 GRN_idea_army_officer_corps: "Cuerpo de oficiales del ejército"
 GRN_idea_army_officer_corps_desc: "El establecimiento y estandarización de un cuerpo de entrenamiento de oficiales del ejército nos permite moldear, perfeccionar y mejorar a nuestros líderes tácticos y estratégicos para mejorar no sólo su propio entendimiento sino para mejorar las tropas por las que dirigen."
 GRN_idea_small_ship_developments: "Pequeños desarrollos de buques"
 GRN_idea_small_ship_developments_desc: "Los primeros desarrollos están probando fructíferos, nuestros diseños tempranos de corvette nos muestran que mientras podemos refinar y mejorar, esta ganancia estratégica sólo significa nada si podemos conseguir que la gente tripule adecuadamente los vasos."
 GRN_idea_expanding_small_vessel_designs: "Ampliación de pequeños diseños de buques"
 GRN_idea_expanding_small_vessel_designs_desc: "Asegurar que nuestro departamento de corvette sea complementado por innovaciones similares, nos enfocaremos en tipos de fragatas y destructores para eliminar completamente nuestras pequeñas flotas de buques."
 GRN_idea_attack_submarine_programs: "Ataque Programas Submarinos"
 GRN_idea_attack_submarine_programs_desc: "El ASP es una serie de programas de desarrollo y pruebas diseñados para probar los límites y las nuevas tecnologías más eficaces."
 GRN_idea_missile_submarine_programs: "Misiles Submarine Programs"
 GRN_idea_missile_submarine_programs_desc: "El MSP es una serie de programas de desarrollo y pruebas diseñados para probar la forma más eficaz de utilizar tecnología de misiles en combate naval."
 GRN_idea_navy_officer_corps: "Naval Officer Corps"
 GRN_idea_navy_officer_corps_desc: "La creación del Cuerpo de Formación de Oficiales Navales nos permitirá mejorar las normas de excelencia en combate y liderazgo para nuestra rama de servicio naval."
 GRN_idea_aviation_innovations: "Innovaciones de aviación"
 GRN_idea_aviation_innovations_desc: "Los primeros resultados están empezando a dar fruto, ya que la instalación de TARI ha comenzado a lanzar sus innovaciones en los modelos generales de diseño y producción para pruebas y refinamiento. Estos podrían resultar útiles a medida que continuemos reformando y perfeccionando nuestro Plan de Acción sobre la supremacía del aire."
 GRN_idea_air_dominance_program: "Programa de dominación del aire"
 GRN_idea_air_dominance_program_desc: "El ADP está dedicado a la clase de caza específica de aviones y a mejorar sus capacidades generales de combate para preservar nuestros cielos del acoso enemigo."
 GRN_idea_bombing_innovations: "Innovaciones de Bombing"
 GRN_idea_bombing_innovations_desc: "Las innovaciones en el aire a tierra, así como en las capacidades de combate para buques nos han permitido especializar nuestros esfuerzos generales de bombardeos para ser más eficaces en ese momento. Debemos seguir capitalizando estos esfuerzos si queremos evitar cualquier caída real de las fuerzas enemigas en nuestra isla."
 GRN_idea_bomber_design_department: "Departamento de diseño de bombarderos"
 GRN_idea_bomber_design_department_desc: "Dedicado a mejorar y aumentar la eficacia de nuestras flotas aéreas bombardeadoras, el BDD es el pináculo de la innovación aérea para nuestra nación."
 GRN_idea_air_officer_corps: "Cuerpo de oficial de aire"
 GRN_idea_air_officer_corps_desc: "El desarrollo del cuerpo de oficiales de la fuerza aérea nos permite mejorar la eficacia general e innovar en el liderazgo y aplicar tácticas hacia las operaciones de combate aéreo."
 GRN_idea_general_staff_corps: "Cuerpo de Estado Mayor"
 GRN_idea_general_staff_corps_desc: "Con nuestros militares finalmente desarrollados a un punto en que un personal de mando unificado es necesario entre las ramas, nuestra nación ha hecho y continuará haciendo grandes avances en nuestra defensa nacional."
 GRN_idea_agricultural_futurist_policies: "Políticas agrícolas futuristas"
 GRN_idea_agricultural_futurist_policies_desc: "Priorizar los esfuerzos de investigación, así como las inversiones económicas dentro del mayor sector agrícola nos permite permanecer en la cima de las innovaciones y seguir escalando adecuadamente las demandas que necesitaremos si nos centramos en más que sólo las necesidades domésticas."
 GRN_idea_polar_infrastructure_developments: "Desarrollos de la infraestructura polar"
 GRN_idea_polar_infrastructure_developments_desc: "Nuestras continuas inversiones en la construcción de nuestra infraestructura, así como la inversión en formas de hacer esas inversiones más duraderas nos ha permitido innovar en áreas que muchos ni siquiera pensarían."
 GRN_idea_economic_modernity_policies: "Políticas de Modernidad Económica"
 GRN_idea_economic_modernity_policies_desc: "Nuestra nación está a la vanguardia del desarrollo. Seguiremos con seguridad esta gran marcha hacia la prosperidad para la nación y nuestros ciudadanos."
 GRN_ideas_mining_needs: "Necesidades de minería"
 GRN_ideas_mining_needs_desc: "Hemos decidido centrar el sector minero en las necesidades nacionales y no en nada más allá de eso. Esto nos ha permitido negociar estratégicamente nuestros precios de exportación, al mismo tiempo que reducir las demandas que el sector tendría en términos de recursos humanos."
 GRN_ideas_mining_greeds: "Saludos mineros"
 GRN_ideas_mining_greeds_desc: "Hemos decidido enfocar el sector minero alrededor de las necesidades nacionales e internacionales en lugar de simplemente lo que se necesita en este momento. Como resultado, hemos podido aplaudir enormemente nuestros recursos y negociar algunos acuerdos reales en términos de nuestros esfuerzos de exportación. Aunque un pequeño problema del aumento de las demandas de los trabajadores parece haber afectado al sector económico, el beneficio general parece justificar los medios para poner fin."
 GRN_ideas_intense_foreign_affairs_budgeting: "Presupuesto intenso de Relaciones Exteriores"
 GRN_ideas_intense_foreign_affairs_budgeting_desc: "Si vamos a ganar seriamente cualquier tracción hacia los tratos diplomáticos en el extranjero entonces tenemos que centrarnos seriamente en estos esfuerzos. Con nuestra fuerza actual y así nos falta la estabilidad interior debido a nuestras preocupaciones de población en comparación con nuestra economía. Así que somos esencialmente una cáscara dura con un interior vacío si no jugamos bien nuestras cartas."
 GRN_ideas_political_shenanigans: "Políticos Shenanigans"
 GRN_ideas_political_shenanigans_desc: "Se ha demostrado cierta luz reciente sobre los esfuerzos descontentos dentro de nuestra nación. No parecen ser más que una molestia dado el estado saludable en el que estamos, pero tendremos que averiguar quién está haciendo esta mierda si queremos volver a un estado más tranquilo."
 GRN_ideas_domesticating_foreign_policy: "Política exterior nacional"
 GRN_ideas_domesticating_foreign_policy_desc: "Garantizar nuestras ambiciones extranjeras significa que necesitamos asegurar el frente interno, así como asegurar los medios para aprovechar nuestras capacidades de influencia extranjera."
 GRN_ideas_the_frozen_federation: "La federación Frozen"
 GRN_ideas_the_frozen_federation_desc: "Bueno, hemos unido al continente a lo mejor de nuestras habilidades. Ahora lo único es que también hemos unido todos los problemas bajo una bandera. Aunque no es el fin del mundo, ciertamente va a ser duro montar en el futuro previsible."
 GRN_domestic_and_civil_affairs_administration: "Administración de Asuntos Civiles &"
 GRN_domestic_and_civil_affairs_administration_desc: "Groenlandia tiene una serie de problemas y el núcleo de ello se deriva de su bajo recuento de población. La administración nacional & de asuntos civiles se encarga de buscar a los ciudadanos de Groenlandia y reformar, agregar o eliminar políticas con el tiempo para garantizar el mejor y más justo resultado posible para los ciudadanos de la isla."
 GRN_federal_budgets: "Gastos nacionales"
 GRN_federal_budgets_desc: "La isla no tiene mucha gente, pero todavía requiere un gasto significativo para mantener y desarrollar adecuadamente las cosas. Tendremos que buscar mejores métodos de desarrollo o presupuesto general si vamos a tener un futuro fiscal estable."
 GRN_revenue_collection_administration: "Administración de recaudación de ingresos"
 GRN_revenue_collection_administration_desc: "El RCA es designado como organismo de recaudación y ejecución fiscal del gobierno nacional. Debe trabajar con los encargados de la formulación de políticas gubernamentales para garantizar que los impuestos se gravan de manera justa, eficiente y se están aplicando adecuadamente para asegurar un presupuesto nacional equilibrado."
 GRN_economic_development_board: "Junta de Desarrollo Económico"
 GRN_economic_development_board_desc: "El EDB es la columna vertebral de la formulación de políticas económicas y el crecimiento y desarrollo nacionales generales. Esta parte del gobierno establece tomar políticas y programas e intentar construir la economía nacional, así como elevar la calidad de vida de los ciudadanos cuando sea posible. Mientras que la logística es el obstáculo más grande en este sentido, el otro es simplemente mano de obra y capital, así como fuerza de voluntad para hacerlo."
 GRN_national_armed_services_of_greenland: "Servicios armados nacionales de Groenlandia"
 GRN_national_armed_services_of_greenland_desc: "Los Servicios Armados de Groenlandia son una institución interesante, ya que la población de la isla es tan pequeña que no hay mucho que pueda hacer. Sin embargo, a pesar de esto la isla tiene algún tipo de fuerza militar y teóricamente tiene la capacidad de expandirla. Ahora es justo hasta el futuro de los acontecimientos para contar cómo puede ocurrir esta expansión."
 GRN_idea_the_great_ice_shelf: "El gran estante de hielo"
 GRN_idea_the_great_ice_shelf_desc: "La plataforma de hielo de Groenlandia es una de las piezas de hielo más grandes del mundo para cubrir una cantidad significativa de masa terrestre. El estante de hielo puede estar hasta dos millas de profundidad y es la mayor obstrucción a cualquier desarrollo serio fuera de las zonas costeras."
