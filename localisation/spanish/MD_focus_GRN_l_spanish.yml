 greenland_subterfuge_event.120000.o1: "Preparar la Operación Fjordsland"
 greenland_subterfuge_event.15.t: "Inversiones Groenlandesas"
 greenland_subterfuge_event.15.d: "Groenlandia ha venido a nosotros con una serie de inversiones sin costo para nosotros. Quieren centrarse en el desarrollo de las áreas menos desarrolladas alrededor de la ciudad de Karlstad y fomentar la unidad y prosperidad nórdica. Sin embargo, algunos en el gobierno creen que están buscando una agenda oculta, ya que las inversiones parecen casi demasiado buenas para ser verdad. Entonces otra vez, ¿qué puede hacer Greenland realistamente con nosotros?"
 greenland_subterfuge_event.15.o1: "Gratis Stuff is still Free"
 greenland_subterfuge_event.15.o2: "Declinamos humildemente"
 greenland_subterfuge_event.16.t: "Suecia acepta"
 greenland_subterfuge_event.16.d: "El gobierno sueco ha aceptado las inversiones y ahora empezaremos a prepararnos para lo que planeamos con la población civil para asegurar una autoridad central más débil que no esté tan alineada con la OTAN."
 greenland_subterfuge_event.16.o1: "Ahora esperamos y planificamos"
