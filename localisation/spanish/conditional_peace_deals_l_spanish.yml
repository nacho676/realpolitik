 CPD_country_action_forced_neutrality_TT: "§YLa neutralidad forzada§! elimina el objetivo de su facción y los impide unirse a otro durante cinco años.\n\nHaga clic para eliminar del trato."
 CPD_country_action_regime_change_TT: "§YRegime Change§! instala nuestro partido gobernante en el gobierno del objetivo. Espera una inestabilidad política duradera.\n\nHaga clic para eliminar del trato."
