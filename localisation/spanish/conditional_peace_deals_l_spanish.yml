 CPD_demanding_annexation_of_state_TT: "La anexión de este estado es una §G exigencia §! de [ROOT.GetNameWithFlag]. Si se acepta la paz, este estado será anexado a nuestra nación y nos convertiremos en sus nuevos dueños."
 CPD_demanding_puppeting_in_state_TT: "Formar un gobierno títere dentro de este estado es una §G exigencia §! de [ROOT.GetNameWithFlag]. Si se acepta la paz, este estado quedará bajo el control de un nuevo gobierno títere."
