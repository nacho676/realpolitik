 CPD_demilitarise_state_button_TT_DEMAND: "Exigir la desmilitarización de los Estados"
 CPD_demilitarise_state_button_TT_CONCESSION: "Proponer la desmilitarización de los Estados"
 CPD_demilitarise_state_button_TT__DELAYED_DEMAND: "Exigiendo §YLa desmilitarización§! convierte a estados enemigos seleccionados en zonas en las que ningún ejército puede operar. Su propietario no puede colocar tropas allí ni levantar fortificaciones."
 CPD_demilitarise_state_button_TT__DELAYED_CONCESSION: "Concediendo §YLa desmilitarización§! coloca a nuestros propios estados bajo las mismas restricciones. No podremos mover ni colocar fuerzas en los territorios admitidos."
