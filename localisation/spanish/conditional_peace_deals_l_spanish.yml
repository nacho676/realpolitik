 CPD_annex_state_button_TT_DELAYED: "[CPD_ANNEX_STATE_TT_DELAYED_LOC]"
 CPD_annex_state_button_TT_DEMAND: "Demandar Estados"
 CPD_annex_state_button_TT_CONCESSION: "Conceder Estados"
 CPD_annex_state_button_TT_DELAYED_DEMAND: "Los territorios enemigos seleccionados se anexan a nuestra nación junto con su pueblo, fábricas y recursos. Estados que tenemos núcleos a costa de la mitad del valor estratégico; afirmamos un tercio. Exigiendo tierra el propietario original todavía tiene dobles el costo."
 CPD_annex_state_button_TT_DELAYED_CONCESSION: "§YLos Estados del Concede§! deben entregarlos al enemigo. Cada territorio admitido reduce el costo general del acuerdo, endulzando nuestras otras demandas."
 CPD_make_puppet_button_TT: "[CPD_MAKE_PUPPET_TT_LOC]"
 CPD_make_puppet_button_TT_DELAYED: "[CPD_MAKE_PUPPET_TT_DELAYED_LOC]"
 CPD_make_puppet_button_TT_DEMAND: "Crear un Gobierno títere"
 CPD_make_puppet_button_TT_CONCESSION: "Conceder un Gobierno títere"
 CPD_make_puppet_button_TT_DELAYED_DEMAND: "Exigiendo un gobierno de títeres §Y§! genera un nuevo estado sujeto fuera de territorio enemigo seleccionado. El nuevo títere hereda la cultura de su padre pero nos responde en política exterior. Si ya tenemos un tema con núcleos en la nación matriz, esos estados se unen a ese sujeto en lugar de desovecer uno nuevo."
 CPD_make_puppet_button_TT_DELAYED_CONCESSION: "Concediendo a un gobierno de títeres §Y§! permite al enemigo tallar un estado sujeto desde territorios que actualmente tenemos. El nuevo gobierno de títeres les responde."
