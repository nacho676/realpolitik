 CPD_liberate_in_state_button_TT_DEMAND: "Estados liberados"
 CPD_liberate_in_state_button_TT_CONCESSION: "concesión de la independencia"
 CPD_liberate_in_state_button_TT_DELAYED_DEMAND: "Exigiendo §YLa libertad§! devuelve a los estados seleccionados a cualquier nación que los reclame legítimamente. Un poseedor de núcleo todavía existente recibe el territorio directamente; se renace a uno largo plazo para recibirlo. Donde no queda el núcleo, se forja un nuevo estado de afilado de lo que queda del propietario actual."
 CPD_liberate_in_state_button_TT_DELAYED_CONCESSION: "Concediendo §YLa independencia§! libera a los estados seleccionados que tenemos a su legítimo demandante, ya sea que esa nación todavía se mantenga o debe ser revivida de la historia."
