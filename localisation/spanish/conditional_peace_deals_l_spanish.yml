 CPD_peace_deal_explainer_ICON_TT: "Cómo funcionan los acuerdos de paz"
 CPD_peace_deal_explainer_ICON_TT_DELAYED: "Construir un acuerdo de paz es tan sencillo como seleccionar una pestaña de arriba y luego elegir qué conceder o exigir dentro de un estado.\n\n Construir un acuerdo de paz que tenga un§Ynegativo§! Es probable que una IA acepte el costo, mientras se construye un acuerdo de paz que tenga un§Y positiva §! Es menos probable que se acepte el costo. Puedes ver la explicacion paso a paso completa de la disposición de la IA a aceptar un trato al pasar el cursor sobre el cuadro de aceptación.\n\nCualquier acuerdo de paz construido para un jugador no se ve afectado por estos valores."
