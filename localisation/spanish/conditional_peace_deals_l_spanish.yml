 CPD_resource_rights_button_TT: "§YDerechos sobre recursos§!"
 CPD_resource_rights_button_TT_DELAYED: "Valorar §YResource Extraction Rights§! nos desvía la producción de recursos de los estados seleccionados. Los propios estados permanecen bajo su actual propietario; sólo el petróleo, acero, aluminio, caucho, tungsteno y cromo producen flujo a nuestra economía. El acuerdo se mantiene hasta que se invierte en otro acuerdo de paz."
 CPD_military_basing_button_TT: "§YBasamiento militar§!"
 CPD_military_basing_button_TT_DELAYED: "§YMilitary Basing Rights§! concede a nuestras fuerzas un libre paso por el territorio de esta nación. Nuestras tropas pueden moverse y colocarse libremente hasta que se revoque el acceso."
 CPD_full_puppet_button_TT: "§YPuppet completo§!"
 CPD_full_puppet_button_TT_DELAYED: "Exigiendo §YFull Puppet§! convierte a toda esta nación en nuestro tema. Mantienen sus fronteras y su población pero pierden la independencia de las políticas extranjeras; su economía, mano de obra y respuesta militar a nosotros. Cualquier demanda estatal ya está subsumida en este acuerdo."
 CPD_ceasefire_button_TT: "§YAlto el fuego§!"
 CPD_ceasefire_button_TT_DELAYED: "A §YCeasefire§! termina la guerra con la línea delantera tal como está. Cada lado mantiene a los estados que actualmente controlan independientemente de quién los sostenía antes. La tregua sostiene durante §Y720 días§! antes de que cualquiera de las partes pueda declarar nuevamente la guerra en el otro.\n\nLa cesación del fuego y las demandas territoriales no pueden compartir un acuerdo. La activación de la cesación del fuego aclara todas las entradas a nivel estatal de la propuesta actual."
 CPD_war_reparations_button_TT: "§YReparaciones de guerra§!"
 CPD_war_reparations_button_TT_DELAYED: "§YReparaciones§! obligan al perdedor a pagar una parte de su PIB semanal por un año. La transferencia aparece como un nuevo gasto en el presupuesto del pagador y como nuevos ingresos en el receptor.\n\n[CPD_reparations_preview]"
 CPD_reparations_preview_TT: "Transferencia proyectada para este acuerdo: §Y£[?CPD_rep_preview_temp|.2]B por semana§! (~§Y£[?CPD_rep_preview_total_temp|.0]B§! durante el año)"
 CPD_forced_neutrality_button_TT: "§Y Neutralidad forzada§!"
 CPD_forced_neutrality_button_TT_DELAYED: "§YNeutralidad forzada§! elimina a esta nación de su facción al firmar y los impide unirse o formar otro para §Y5 años§!."
 CPD_regime_change_button_TT: "§YCambio de régimen§!"
 CPD_regime_change_button_TT_DELAYED: "§YEl cambio de régimen§! sustituye al partido gobernante del objetivo por el que actualmente está en el poder en nuestra nación. Su coalición está disuelta y se instala un líder de nuestra raya política. El nuevo gobierno lleva §Y inestabilidad post-guerra§! durante dos años, y las naciones islámicas pueden ver un §Y retroceso salafista§! contra la regla impuesta por el extranjero."
 additional_income_war_reparations_tt: "$$[?CPD_reparations_weekly|+3] de §YReparaciones§!\n"
 additional_expense_war_reparations_tt: "$$[?CPD_reparations_weekly|-3] de §YReparaciones§!\n"
 CPD_war_reparations_payer: "Reparaciones de guerra (Pago)"
 CPD_war_reparations_payer_desc: "Estamos pagando reparaciones de guerra como resultado de un acuerdo de paz. Una transferencia de efectivo semanal aparece como un gasto adicional en nuestro presupuesto para §Y1 año§!."
 CPD_war_reparations_receiver: "Reparaciones de guerra (Recibir)"
 CPD_war_reparations_receiver_desc: "Estamos recibiendo reparaciones de guerra como resultado de un acuerdo de paz. Una transferencia de efectivo semanal aparece como ingresos adicionales en nuestro presupuesto para §Y1 año§!."
 CPD_forced_neutrality_spirit: "Neutralidad forzada"
 CPD_forced_neutrality_spirit_desc: "Como condición del acuerdo de paz, se prohíbe a nuestra nación unirse o crear alianzas militares."
 CPD_regime_change_instability: "Pos-War Political Instability"
 CPD_regime_change_instability_desc: "Un cambio de régimen forzado ha desestabilizado nuestro sistema político."
