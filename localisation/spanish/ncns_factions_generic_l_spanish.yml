 economic_powerhouse_goal_name: "Un Powerhouse económico"
 joint_military_exercises_goal_desc: "La guerra moderna exige interoperabilidad entre las fuerzas aliadas. Al realizar ejercicios conjuntos y alcanzar una fuerza combinada de 100 divisiones equipadas, nuestra facción demuestra su disposición a responder a cualquier amenaza."
 economic_integration_goal_desc: "Una economía fuerte es la base de cualquier alianza duradera. Al asegurar que cada Estado miembro mantenga al menos 15 fábricas civiles, construimos la base industrial necesaria para la prosperidad colectiva y la ayuda mutua."
 technology_sharing_goal_desc: "La superioridad tecnológica es un multiplicador de fuerza. A través de programas de investigación compartidos e inversiones en infraestructura digital, nuestra facción puede superar rivales y mantener el vanguardia en cada dominio."
 regional_stability_goal_desc: "Una alianza es tan fuerte como su eslabón más débil. Al mantener la estabilidad por encima de 50% en todos los estados miembros, presentamos un frente unificado que disuade la agresión oportunista y la subversión interna."
 counter_terrorism_goal_desc: "El terrorismo no conoce fronteras. Establecer agencias de inteligencia en cada estado miembro crea una red capaz de interceptar amenazas antes de materializarse, protegiendo tanto a nuestros ciudadanos como a nuestros intereses colectivos."
 semiconductor_supremacy_goal_desc: "La fabricación de microchip es la industria estratégica del siglo XXI. Al construir unas 50 plantas microchip combinadas a través de nuestra facción, aseguramos la independencia de la cadena de suministro y el dominio tecnológico durante décadas por venir."
 strategic_resource_security_goal_desc: "El acceso a las materias primas críticas sustenta tanto el crecimiento económico como la preparación militar. Nuestra facción debe extraer colectivamente suficiente petróleo, caucho y aluminio para asegurar que ningún miembro sea vulnerable a la coacción de recursos."
 collective_cyber_defense_goal_desc: "En la era digital, la seguridad criptográfica es tan vital como fortificaciones físicas. Al asegurar que cada Estado miembro alcance capacidades avanzadas de cifrado, protegemos nuestras comunicaciones, inteligencia e infraestructura crítica."
 economic_powerhouse_goal_desc: "La economía puede traducirse directamente en influencia geopolítica. Cuando nuestro líder de la facción alcanza el alto PIB per cápita y cada miembro supera un umbral de referencia, nos convertimos en un bloque económico que no puede ser ignorado."
 faction_gdp_per_capita_target_tt: "PIB per cápita superior a 15 y todos los miembros por encima de 5"
 faction_economic_integration_idea: "Pacto de integración económica"
 faction_economic_integration_idea_desc: "Mediante políticas comerciales coordinadas y barreras reducidas, los Estados miembros disfrutan de una mayor cooperación económica y un desarrollo más rápido."