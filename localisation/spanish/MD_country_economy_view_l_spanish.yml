 total_civilian_factories_amount_tt: "Este valor representa el número total de §Y Industrias civiles§! en nuestra nación."
 total_civilian_factories_amount_tt_delayed: "Este edificio proporciona al Estado industria para la producción de bienes civiles o construcción de nuevos edificios. Se puede convertir a la industria militar si es necesario.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y206K§!\nProducto básico del PIB por §Y Industria civil§!: $§Y17,5 millones§!\nConsumo de energía base: §R-0.5§! GW\n\nLey, Espíritu nacionals e impacto técnico en §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, Espíritu nacionals and Tech impact on §YCivilian Industries Workforce§!: [?modifier@civ_facs_worker_requirement_modifier|-%0]\n\nTrabajadores requeridos por §YCivilian Industries§!: [?workers_per_civ_fac_display|2]K\n"
 total_military_factories_amount_tt: "Este valor representa el número total de §Y Industrias Militares§! en nuestra nación."
 total_military_factories_amount_tt_delayed: "Este edificio proporciona al Estado industria para la producción de nuevos equipos militares. Se puede convertir a la industria civil si es necesario.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y18.8K§!\nProducto básico del PIB por §Y Industria militar§!: $§Y1.5 millones§!\nConsumo de energía base: §R-0.5§! GW\n\nLey, Espíritu nacionals y Tech impactan en §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLey, Espíritu nacionals e impacto técnico en §Yfábricas militares & Dockyard Workforce§!: [?modifier@mil_facs_worker_requirement_modifier|-%0]\n\nTrabajadores requeridos por §Y Industria militar§!: [?workers_per_mil_fac_display|2]K\n"
 total_naval_yard_amount_tt: "Este valor representa el número total de §YNaval Yard§! en nuestra nación."
 total_naval_yard_amount_tt_delayed: "§YNaval Yards§! son representativos de la capacidad del Estado para producir buques militares de todo tipo que van desde §YPatrol Boats§!, §YConvoyes§!, §YDestructores§!, §YCarriers§! y más.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y18.8K§!\nProducto básico del PIB por §Y Naval Yard§!: $§Y1.5 Billón§!\nConsumo de energía base: §R-0.5§! GW\n\nLey, Espíritu nacionals e impacto técnico en §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLegal, Espíritu nacionals and Tech impact on §Yfábricas militares & Dockyard Workforce§!: [?modifier@mil_facs_worker_requirement_modifier|-%0]\n\nTrabajadores requeridos por §YNaval Yard§!: [?workers_per_dockyard_display|2]K\n"
 total_offices_amount_tt: "Este valor representa el número total de §YOffice Sectors§! en nuestra nación."
 total_offices_amount_tt_delayed: "Los §YOffice Sectores§! representan todas las otras industrias de la economía más allá de la extracción y las industrias pesadas. Estos incluyen financieros, clientes, tecnología de la información, servicios al por menor y mucho más.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y473K§!\nProducto básico del PIB por §Y Sector de la oficina§!: $§Y50 billón§!\nConsumo de energía base: §R-0.25§! GW\n\nLey, Espíritu nacionals e impacto técnico en §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, Espíritu nacionals and Tech impact on §YOffice Sector Workforce§!: [?modifier@offices_worker_requirement_modifier|-%0]\n\nTrabajadores requeridos por §YOffice Sector§!: [?workers_per_office_display|2]K\n"
 total_agriculture_district_amount_tt: "Este valor representa el número total de §Y Distritos Comercializados de Agricultura§! en nuestra nación."
 total_agriculture_district_amount_tt_delayed: "§Y Distritos Comercializados de Agricultura§! representa un conjunto para toda la agricultura no subsistir dentro de nuestra nación. Incluye agroindustria, tierra cultivable, silos de grano, casiras y más.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y188K§!\nProducto básico del PIB por §Y Distrito Comercial de Agricultura§!: $§Y25 billón§!\nConsumo de energía base: §R-0.10§! GW\n§Y Ganancia de combustible§! de los Estados: 8\n§Y Suministros locales§!: 1,5%\n\nLey, Espíritu nacionals y Tech impactan en §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, Espíritu nacionals and Tech impact on §YCommercialized Agriculture Districts Workforce§!: [?modifier@agriculture_district_worker_requirement_modifier|-%0]\n\nTrabajadores requeridos por §Y Distrito Comercial de Agricultura§!: [?workers_per_agriculture_district_display|2]K\n"
 total_microchips_factories_amount_tt: "Este valor representa el número total de §YMicrochip Plants§! en nuestra nación."
 total_microchips_factories_amount_tt_delayed: "§YMicrochip Plants§! representan la producción semiconductora y pequeña electrónica de nuestra nación.\n\nProporciona al estado con:\nNúmero de base de los trabajadores requeridos: §Y37.5K§!\nProducto básico del PIB por §YMicrochip Plant§!: $§Y32 Billion§!\nConsumo de energía base: §R-0.75§! GW\n\nLey, Espíritu nacionals e impacto técnico en §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLegal, Espíritu nacionals and Tech impact on §YMicrochip Plants Workforce§!: [?modifier@microchip_plant_worker_requirement_modifier|-%0]\n\nTrabajadores requeridos por §YMicrochip Plant§!: [?workers_per_microchip_plant_display|2]K\n"
 total_composites_factories_amount_tt: "Este valor representa el número total de §Y Plantas compuestas§! en nuestra nación."
 total_composites_factories_amount_tt_delayed: "§Y Plantas compuestas§! representan instalaciones avanzadas de producción de materiales, incluyendo armaduras cerámicas, polímeros reforzados y materiales estructurales de alto rendimiento.\n\nProporciona al estado con:\nNúmero de base de los trabajadores requeridos: §Y37.5K§!\nProducto básico del PIB por §Y Planta compuesta§!: $§Y28 billón§!\nConsumo de energía base: §R-0.8§! GW\n\nLey, Espíritu nacionals e impacto técnico en §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, Espíritu nacionals and Tech impact on §YComposite Plants Workforce§!: [?modifier@composite_plant_worker_requirement_modifier|-%0]\n\nTrabajadores requeridos por §Y Planta compuesta§!: [?workers_per_composite_plant_display|2]K\n"
