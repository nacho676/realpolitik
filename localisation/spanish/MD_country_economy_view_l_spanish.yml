 ECONOMY_TITLE: "Overview"
 REFRESH_ECONOMYVIEW_TOOLTIP: "£click_left §YL Haga clic§! para refrescar la visión económica."
 BALANCE_TITLE: "Saldo"
 BALANCE_VALUE: "§Y[?treasury_rate|+3]§!"
 BALANCE_TOOLTIP: "Nuestro balance semanal es $[?treasury_rate|+3] §H millones§!."
 BALANCE_TOOLTIP_DELAYED: "El saldo es el cambio neto a nuestro tesorería cada semana, igual al ingreso total menos los gastos totales. Un saldo negativo drena el tesorería y obliga a la deuda semanal a emitirse una vez que se agota."
 TREASURY_TITLE: "Tesorería"
 TREASURY_VALUE: "§Y[?treasury|3]§!"
 TREASURY_TOOLTIP: "Tenemos $[?treasury] §H millones§! en el tesoro.\nNuestro balance semanal es $[?treasury_rate|+3] §H millones§!."
 TREASURY_TOOLTIP_DELAYED: "Nuestra tesorería refleja la cantidad de dinero que tenemos disponible para gastar, y se puede utilizar para compras e inversiones. Si el tesoro entra en rojo, la deuda se emitirá automáticamente semanalmente para mantenerlo positivo.\n\n§tLa pantalla de economía se mueve a la pestaña comercial.§!"
 DEBT_TITLE: "Deuda"
 DEBT_VALUE: "§R[?debt|3]§!"
 INVESTMENTS_TITLE: "Inversiones"
 INVESTMENTS_VALUE: "§G[?int_investments|3]§!"
 STATS_TITLE: "Estadísticas"
 GDP_TOTAL: "GDP"
 GDP_TOTAL_DESC: "Nuestro §YGross Domestic Product§! (GDP) es la medida de valor de todos los productos y servicios producidos en el país. Millennium Dawn utiliza el PIB ajustado con PPP (Purchasing Power Parity) ya que este valor lleva a las condiciones económicas locales en vigor, haciendo la comparación de país más útil."
 NUM_GDP_TOTAL: "$$§Y[?ROOT.gdp_total|1]§!b"
 NUM_GDP_TOTAL_DESC: "Nuestro §YGDP§! es actualmente $ §Y[?ROOT.gdp_total|3]§! millardos.\n\n§Y Tasa de crecimiento del PIB total§!: [?last_quarter_gdp_growth_rate|%Y].\n\nHint: Cuanto más alto sea su §Y Tasa de Crecimiento Cuarteral del PIB§! más probable es que usted tenga eventos económicos positivos."
 NUM_GDP_TOTAL_DELAYED_DESC: "Contribución aproximada de las Industrias por Porcentaje:\n§Pfábricas civiles§!: [?ROOT.civil_fac_percent|%]\n§Ofábricas militares§!: [?ROOT.military_factory_total_percent|%]\n§BPatios de puerto§!: [?ROOT.naval_factory_total_percent|%]\n§C Parques de oficina§!: [?ROOT.office_fac_percent|%]\n§G Agricultura no comercializada§!: [?ROOT.agriculture_percent|%]\n§Y Distritos Comercializados de Agricultura§!: [?ROOT.agriculture_district_fac_percent|%]\n§Y Plantas de microchip§!: [?ROOT.microchip_plant_percent|%]\n§Y Plantas compuestas§!: [?ROOT.composite_plant_percent|%]\n§Y Refinerías sintéticas§!: [?ROOT.synthetic_refinery_percent|%]\n§G Extracción de recursos§!: [?ROOT.resources_percent|%]\n§YInfraestructura§!: [?ROOT.infrastructure_gdp_percent|%]\n§P Cuidado de la salud§!: [?ROOT.healthcare_gdp_percent|%]\n"
 GDP_PER_CAPITA: "GDP/C"
 GDP_PER_CAPITA_DESC: "Este número representa nuestro §YGDP per Capita§! o §YGDP/C§!. Representa la producción de cada persona en la nación.\n\n§Y Tasa de crecimiento total del PIB/C§!: [?last_quarter_gdpc_growth_rate|%Y].\n\nHint: Cuanto más alto sea su §Y Tasa de Crecimiento Cuarterly del PIB/C§! más probable es que usted consiga eventos económicos positivos, y el mayor §RInflación§! puede crecer potencialmente si se deja sin control."
 GDP_PER_CAPITA_DELAYED_DESC: "Impacto actual de §YGDP per Capita§! en nuestra nación:\nVelocidad de construcción: [?production_speed_buildings_factor_gdp_modifier|%+]\nPoblación mensual: [?monthly_population_gdp_modifier|%+1]\nVelocidad de investigación: [?research_speed_factor_gdp_modifier|%+]\nEstabilidad: [?stability_factor_gdp_modifier|%+]\nFuerza de trabajo total: [?total_workforce_gdp_c_modifier_var|%+]\nFósil Powerplant Construction Speed: [?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA: "$$§Y[?ROOT.gdp_per_capita|3]§!k"
 NUM_GDP_PER_CAPITA_DESC: "Nuestro §YGDP/C§! es actualmente $ §Y[?ROOT.gdp_per_capita|3]§!"
 PRODUCTIVITY: "Productividad"
 PRODUCTIVITY_DESC: "Este número representa la productividad de nuestra nación §Y§!."
 NUM_PRODUCTIVITY_DELAYED_DESC: "§Y Crecimiento del mes antes de los ajustes estatales:§! [?productivity_growth_scaled|3+]\n\n§Y Crecimiento básico de la productividad:§!\nLeyes, Espíritu nacional y tecnologías: [?modifier@productivity_growth_modifier|3+]\n Incluidos los impuestos corporativos: [?productivity_growth_modifier_from_corporate_tax|3+]\n Incluyendo la Alfabetización: [?literacy_productivity_gain|3+]\n\n§YModificador nacional de crecimiento:§!\nLeyes, Espíritu nacional y tecnologías: [?modifier@country_productivity_growth_modifier|%+1]\n Incluyendo la Inflación: [?inflation_rate_prod_var|%+1]\n\nCrecimiento mensual = crecimiento de la productividad base × 0.5 × (1 + modificador nacional de crecimiento). El multiplicador nacional se limita a 0–100. Cada estado aplica entonces su ajuste de productividad mundial y modificador del crecimiento local.\n\nEfecto de la productividad:\n§YGDP:§! [?productivity_tax_effect_display|%+1]\n§Y Salida de la fábrica:§! [?productivity_tax_effect_display|%+1]\n§YDockyard Output:§! [?productivity_tax_effect_display|%+1]\n§Y Velocidad de construcción:§! [?productivity_tax_effect_display|%+1]\n§Y Impuestos corporativos:§! [?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon §Y Distritos Comercializados de Agricultura§! Velocidad de construcción:§! [?agriculture_district_output_var|%+1]"
 NUM_PRODUCTIVITY: "§Y[?ROOT.overall_productivity|3]§!"
 NUM_PRODUCTIVITY_DESC: "§YLa productividad§! mide la eficacia de convertir los recursos en bienes y servicios para nuestra población, escalando el PIB, el Impuesto Corporativo y el Producto Industrial. La mayor productividad significa una mayor eficiencia, pero el crecimiento disminuye a medida que los estados se vuelven más productivos en relación con la media mundial, mientras que los estados menos productivos alcanzan más rápido.\n\n§Y Promedio Mundial:§! [?global.average_world_productivity|3]\n§YNuestra productividad:§! [?ROOT.overall_productivity|3]\n"
 INFLATION: "Inflation"
 INFLATION_DESC: "Este número representa la inflación de nuestra nación §Y§!"
 NUM_INFLATION: "§Y[?ROOT.inflation_rate_var|%]§!"
 NUM_INFLATION_DESC: "§YLa inflación§! es el valor que determina cuánto el poder adquisitivo de su nación está creciendo o disminuyendo en fuerza. Cuanto más alta sea tu inflación, menos poder adquisitivo tiene tu gente y tu gobierno, ya que tu dinero pierde valor. La inflación se calcula mediante el promedio de los últimos 4 trimestres de §Y Tasa de crecimiento trimestral del PIB/C§!, multiplicada por su promedio §YTax Rate§! y posteriormente ajustada por §Y Ciclos económicos§!, §YPrinting Money§!, §YPolicy Rate§! y otros eventos económicos.\n\nCuanto mayor sea su promedio §YCalterly GDP/C Growth Rate§!, junto con el mayor es su §YGDP/C§!, mayor será su tasa de inflación. Más alto §YTax Rate§! reducirá la inflación, mientras que una tasa más baja lo aumentará. Una tasa más alta §Y de la política§! disminuirá la inflación, pero aumentará §R Interés en la deuda§!, mientras que una tasa más baja hará lo contrario.\n\n§Y Ciclos económicos§! arriba §Y Crecimiento estable§! aumentará su §YInflación§!, simulando una mayor demanda de bienes y gastando dinero, mientras que §Y Ciclos económicos§! debajo §Y Crecimiento estable§! disminuirá su §YInflación§!, simulando la disminución del gasto y una menor demanda de bienes de consumo.\n\n§YLa deflación§! puede ocurrir si terminas con una tasa negativa §YInflación§!. §YLa deflación§! puede ayudar a reducir los gastos del gobierno, pero también puede causar recesión económica, ya que la gente deja de gastar dinero mientras espera que los precios caigan más allá, causando potencialmente mercados y negocios a §RFail§! si las cosas desinflan demasiado o demasiado rápidamente."
 NUM_INFLATION_DELAYED_DESC: "§HLos últimos 4 trimestres:§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\nLa tasa mostrada es la §Ypromedio de cuatro cuartos§!, representando una inflación promedio anual, que es el número utilizado para todos los efectos económicos."
 POPULATION_TAX_RATE: "Tasa de población"
 POPULATION_TAX_RATE_TT: "La tasa de impuestos sobre la población incluye todos los impuestos impuestos impuestos al público. Esto puede incluir pero no se limita al impuesto sobre la renta, los impuestos sobre el IVA, los impuestos sobre las ventas y los impuestos de propiedad.\n\n§YModifiers from Population Taxs:§!\n£stability_texticon Estabilidad: [?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE: "Impuesto corporativo"
 CORPORATE_TAX_RATE_TT: "Tasa de Impuestos Corporativos incluye todos los impuestos impuestos impuestos a las empresas. El valor consiste en los impuestos sobre la renta de las empresas, los impuestos sobre el empleador y más.\n\n§YModificadores de Impuestos Corporativos:§!\n£consumer_goods_texticon Costo fiscal: [?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon §YRecibir la Inversión Extranjera§! Modificador de Costos: [?receiving_investment_cost_form_corporate_tax|%-]\nCrecimiento de productividad mensual: [?productivity_growth_modifier_from_corporate_tax|+3]\n"
 CB_POLICY_RATE: "Tasa de política"
 CB_POLICY_RATE_TT: "El §YCentral Bank Policy Rate§! es la tasa de interés de referencia establecida por el banco central. Controla el costo del préstamo en toda la economía.\n\n§Y El aumento de la tasa§! limita el suministro de dinero, suprime la inflación pero aumenta el costo de la deuda soberana y ralentiza la actividad económica.\n§Y Reducir la tasa§! estimula el préstamo y la inversión, pero permite que la inflación aumente más libremente.\n\nCada ajuste cuesta §Y25§! £pol_power_icon y tiene una refrigeración §Y60 días§!.\n\n§Y Tasa actual: §! [?cb_policy_rate]%\n§Y Represión de la inflación trimestral:§! [?cb_policy_rate|+0]% × 0.003 por trimestre\n§YDebt Interest Premium:§! [?cb_policy_rate|+0]% × 0.5pp añadido a §YInterest Rate§!"
