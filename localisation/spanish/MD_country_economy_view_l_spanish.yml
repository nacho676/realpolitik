 print_money_button_tooltip: "§YPrint Money§!\n§g El gobierno ha caído en tiempos difíciles y necesita recaudar fondos rápidamente. En lugar de confiar en las compras de impuestos o bonos podemos emitir dinero para acomodar.§!\n\nEmitir este pedido imprime dos semanas de ingresos del gobierno que se añade a su tesorería. Sin embargo, disminuirá la productividad de su gente ya que su producción se devalua a partir de la medida causante inflacionaria. La disminución de la productividad se vuelve peor con cada impresión, sin embargo, sólo lentamente mejorando cada año.\n\n§YTiempos de dinero impreso:§! [?printing_money_var|0Y]\n\n§YPrerequisitos:§!\n[!print_money_button_click_enabled]\n§YEfectos:§!\n[!print_money_button_click]"
