 total_refineries_amount_tt_delayed: "§YRefinerías sintéticas§! representan instalaciones industriales responsables de producir caucho sintético y materiales químicos relacionados críticos para la industria y la logística.\n\nProporciona al estado con:\nNúmero de base de trabajadores requeridos: §Y184K§!\nProducto básico del PIB por §YRefinería sintética§!: $§Y10 billón§!\nConsumo de energía base: §R-0.2§! GW\n\nLey, Espíritu nacionals e impacto técnico en §YWorkforce on All Buildings§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nLaw, Espíritu nacionals and Tech impact on §YSynthetic Refineries Workforce§!: [?modifier@synthetic_refinery_worker_requirement_modifier|-%0]\n\nTrabajadores requeridos por §YRefinería sintética§!: [?workers_per_synthetic_refinery_display|2]K\n"
