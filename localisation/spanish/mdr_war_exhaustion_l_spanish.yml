l_spanish:
 mdr_war_exhaustion: "Cansancio de guerra"
 MDR_WEX_TOPBAR: "[?mdr_wex|0]%"
 MDR_WEX_TOPBAR_TT: "§YCansancio de guerra§!\nValor: §Y[?mdr_wex|2]%§!  (máximo 30%)\nCambio semanal: §Y[?mdr_wex_change|2]%§!\n§YEsta semana:§!\nBajas: §R[?mdr_wex_from_losses|2]%§!\nEstados ocupados: §R[?mdr_wex_from_land|2]%§!\nFalta de munición y comida: §R[?mdr_wex_from_shortage|2]%§!\nDuración de la guerra: §R[?mdr_wex_from_length|2]%§!\nGobierno, prensa y apoyo a la guerra: §Y[?mdr_wex_from_regime|2]%§!\nEn paz: §G[?mdr_wex_from_peace|2]%§!\n§YEfectos actuales:§!\nEstabilidad: §R[?mdr_wex_stability|%1]§!\nApoyo a la guerra: §R[?mdr_wex_war_support|%1]§!\nMoral del ejército: §R[?mdr_wex_morale|%1]§!\nRecuperación de organización: §R[?mdr_wex_org|%1]§!\nReclutamiento: §R[?mdr_wex_conscription|%1]§!\nVelocidad de reparación: §R[?mdr_wex_repair|%1]§!\n--------------\nEl §Ycansancio de guerra§! es el hartazgo de la población con una guerra larga o sangrienta. Crece con las bajas de cada semana en proporción a la población, con los estados propios en manos del enemigo, con la falta de munición o comida y con la duración de la guerra. Las democracias lo sienten más; los regímenes sin elecciones, los medios controlados y un apoyo alto a la guerra lo frenan. En paz baja 0,71% por semana. Por encima de 15% también alimenta el descontento oculto, con las protestas y huelgas que trae."
