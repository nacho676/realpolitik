 investments_clock_tt: "§YTiempo para la inversión completa:§! [?ROOT.project_total_construction_duration_display^-1] Días\n\n§YHora de la Inversión Completa§! §g o la duración del proyecto es simplemente un total del tiempo que tomará para completar nuestro proyecto propuesto en [PREV.GetName]. Los más edificios que ofrece a §Y[PREV.CONTROLLER.GetNamewithFlag]§! cuanto más tiempo el proyecto.§!\n\n§gSi acabas de hacer clic desde otro país o estado, asegúrate de subir la cantidad del edificio o haz clic en otro edificio para actualizar la punta de la herramienta para ver el verdadero costo.§!\n"
