 investments_build_button_tt_1: "Invertir en proyectos de construcción aumentará su influencia con el país seleccionado y proporcionará ingresos de inversión para su país.\n\n§Y Tanto el nivel de corrupción del país como el nivel de infraestructura del estado afectarán el tiempo total de construcción. La construcción tiene un aumento predeterminado del 35% en el tiempo, independientemente de los modificadores.§!\n\n§L Si el país objetivo acepta su oferta de inversión, al final del período de construcción ganarán el edificio.§!\nLa AI negará las inversiones si tienen problemas con la economía o su influencia doméstica es demasiado baja.\nTambién tendremos que esperar 3 días después de cancelar un proyecto en un estado para invertir en él otra vez.\n\n[investments_gain_tooltip]"
 investments_build_button_tt_delayed: "§YPrerequisitos§!:\n[!invest_button_click_enabled]\n§YEfectos§!:\n[!invest_button_click]"
 investments_14_cooldown_tt: "Si el país lo acepta, habrá un temporizador de §Y14 días§! que comience con la aceptación. Usted no ganará más influencia independientemente de cuánto dinero usted tira a esta nación durante este período de enfriamiento."
 investments_30_cooldown_tt: "Si el país lo acepta, habrá un temporizador §Y30 días§! que comienza con la aceptación. Usted no ganará más influencia independientemente de cuánto dinero usted tira a esta nación durante este período de enfriamiento."
 investments_build_button_tt_2: "Cancele el proyecto activo (Usted sólo puede hacer una inversión en este estado por día)."
 investments_build_button_tt_b: "Presionar este botón solicitará un permiso del controlador del estado. Si aceptan, un proyecto de construcción comenzará en su ficha de decisiones. Este proyecto repite hasta que se completen todos los edificios apagados.\n\n§YLa velocidad de construcción requiere una penalización del -25% sobre lo que normalmente sería (aplican los modificadores de velocidad de construcción de su país).§!\n\n§L Sólo se puede tener un proyecto de construcción activo a la vez.\n\nUn Estado no puede tener un proyecto de construcción activo desde varios países.\n\nEl controlador de este estado se negará si tiene una opinión negativa de usted.§!"
 investments_gain_tooltip: "[investments_gain_tooltip]"
 investments_event.1.t: "Oferta de inversión desde [FROM.GetNameWithFlag]"
 investments_event.1.d: "[FROM.GetName] propone construir [?pending_offer_amount]x [investments_get_pending_offer_construction_type] in [?pending_offer_state.GetName].\n\nEl costo total del proyecto se calcula en $$[?pending_offer_total_cost] Se necesitarán unos miles de millones. [?pending_offer_duration] días para completar este proyecto. [FROM.GetName] nos está ofreciendo un acuerdo por el cual contribuimos 10% de la suma de construcción. [FROM.GetNameWithFlag] potencialmente ganará influencia de este trabajo. [FROM.GetNameWithFlag] se beneficiará de este proyecto.\n\n\nDías a completar: [?pending_offer_duration]\nCosto total del proyecto[FROM.GetNameWithFlag]): $$[?pending_offer_total_cost] Billion\nTipo de edificio: [investments_get_pending_offer_construction_type]\nCosto del inversionista[THIS.GetNameWithFlag]): $$[?investor_cost]\nUbicación: [?pending_offer_state.GetName]"
 investments_event.1.o1: "Aceptar la Oferta"
 investments_event.1.o2: "Decline la Oferta"
 investments_event.2.t: "Permiso de construcción"
 investments_event.2.d: "Hemos recibido una disminución de nuestro potencial nuevo socio de inversión. ¡Es increíble que rechacen nuestro proyecto! ¡No es como si pudiéramos tener influencia o control sobre su gobierno ayudando a desarrollar sus naciones! Oh bien, el acuerdo de inversión con [FROM.GetName] ha caído en [?ROOT.investments_state_target.GetName], por lo que también podríamos enviar a alguien más un trato de inversión."
 investments_event.2.o1: "Tal vez su vecino..."
 investments_event.3.t: "Proyecto de construcción cancelado"
 investments_event.3.d: "Desafortunadamente, no podríamos completar nuestro acuerdo de inversión con nuestros amigos en [FROM.GetName]. Hay muchas razones potenciales para esto, ya sea relaciones con el gobierno, falta de financiación, o tal vez sólo una falta general de interés de la gente local. Siempre podemos intentarlo en otro momento."
 investments_event.3.o1: "¡Su pérdida!"
 investments_build_cost_tt: "§YCosto de inversión extranjera§!\n\n§YCosto de inversión extranjera§! §ges el costo inicial del proyecto que estamos considerando comenzar. Se toma directamente del tesoro de nuestra nación y se añade a nuestro§! §YInversiones internacionales§! §gtras la aceptación del proyecto.§!\n\n§gSi acaba de hacer clic en otro país o estado asegúrese de subir la cantidad del edificio o haga clic en otro edificio para actualizar el campo de herramientas para ver verdadero costo.§!\n\n§gLa corrupción, los espíritus nacionales y más pueden afectar el costo del proyecto de inversión.La corrupción de la nación inversionista aumentará el coste del proyecto basado en su nivel de corrupción.§!\n"
