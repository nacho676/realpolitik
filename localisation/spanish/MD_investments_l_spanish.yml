 investments_construction_CIC: "§YIndustria civil§!\nEste edificio proporciona al Estado industria para la producción de bienes civiles o construcción de nuevos edificios. Puede ser convertido a la industria militar si es necesario.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^1|3]§! Billion"
 investments_construction_CIC_delayed: "§YPrerequisites§!:\n[!select_civ_button_click_enabled]"
 investments_construction_MIC: "§YIndustria militar§!\nEste edificio proporciona al Estado industria para la producción de nuevos equipos militares. Puede convertirse a la industria civil si es necesario.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^2|3]§! Billion"
 investments_construction_MIC_delayed: "§YPrerequisites§!:\n[!select_mil_button_click_enabled]"
 investments_construction_NIC: "§YNaval Yard§!\nEste edificio proporciona al estado una industria para la construcción de nuevos barcos.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^3|3]§! Billion"
 investments_construction_NIC_delayed: "§YPrerequisites§!:\n[!select_dockyard_button_click_enabled]"
 investments_construction_INF: "§YInfraestructura§!\nEste edificio proporciona al estado una mejora de la infraestructura. Aumenta su poder de suministro en regiones estratégicas y aumenta la velocidad de sus divisiones, así como aumentando su extracción de recursos brutos.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^4|3]§! Billion"
 investments_construction_INF_delayed: "§YPrerequisites§!:\n[!select_infrastructure_button_click_enabled]"
 investments_construction_offices: "§YSector de oficinas§!\nLos sectores de oficinas representan todas las demás industrias de la economía más allá de la extracción y las industrias pesadas, entre ellas la financiera, el cliente, la tecnología de la información, los servicios al por menor y mucho más.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^5|3]§! Billion"
 investments_construction_offices_delayed: "§YPrerequisites§!:\n[!select_office_button_click_enabled]"
 investments_construction_AA: "§YSitios SHORAD§!\n§YSitios SHORAD§!(Short Range Air Defense) son complejos y grupos de armas antiaéreas y tácticas que manejan la defensa antiaérea contra amenazas aéreas de baja altitud. Estos sitios trabajan juntos para dividir el espacio aéreo en áreas defensibles que proporcionan objetivos militares locales y cobertura aérea de infraestructura desde todo lo que va desde helicópteros hasta aviones de bajo vuelo a jets.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^6|3]§! Billion"
 investments_construction_AA_delayed: "§YPrerequisites§!:\n[!select_antyair_button_click_enabled]"
 investments_construction_RAD: "§YRadar Station§!\nEstaciones de radar le permite obtener información sobre las tropas enemigas en estados cercanos. Se compone de varios radares y sensores, así como información de activos y capacidad para analizar la situación en evolución.\nUn nivel más alto aumentará su rango efectivo.\nLos radares también proporcionan al estado una mejor detección de las fuerzas aéreas enemigas, dándole a su avión una mejor oportunidad para involucrarlas.\nAdemás, los radares están aumentando la detección de flotas enemigas en el mar.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^7|3]§! Billion"
 investments_construction_RAD_delayed: "§YPrerequisites§!:\n[!select_radar_button_click_enabled]"
 investments_construction_AIR: "§YBase aérea§!\nEste edificio proporciona al estado despliegue para sus fuerzas aéreas.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^8|3]§! Billion"
 investments_construction_AIR_delayed: "§YPrerequisites§!:\n[!select_airbase_button_click_enabled]"
 investments_construction_fuel_silo: "§YReserva estratégica de recursos§!\nEste edificio proporciona a su nación más espacio para el almacenamiento §HFuel§!.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^9|3]§! Billion"
 investments_construction_fuel_silo_delayed: "§YPrerequisites§!:\n[!select_strategic_resource_reserve_button_click_enabled]"
 investments_construction_internet_station: "§Y Infraestructura de red§!\nLa infraestructura de red son estructuras altas utilizadas en los campos de comunicación telecomunicación y radio para empujar las transmisiones a través de grandes distancias o cables subterráneos de fibra óptica y sistemas de computación en la nube.\n\nCada nivel de §Y Infraestructura de red§! mejora la velocidad del crecimiento de la productividad local en §G+5,00%§!.\nCada nivel de §Y Infraestructura de red§! reduce la duración de §Y Inversiones internacionales§! por §G-5.00%§!.\n\n§Y Costo básico por estructura:§! §R$[?global.build_cost_array^10|3]§!"
 investments_construction_internet_station_delayed: "§YPrerequisites§!:\n[!select_internet_button_click_enabled]"
 investments_construction_REF: "§YRenewable Energy Infrastructure§!\nLa infraestructura de energía renovable es un elemento esencial para todas las fuentes de energía renovables, entre ellas los parques solares, turbinas eólicas, refinerías de biocombustibles, plantas de carbón vegetal, centrales de energía biocombustible y más. Por lo tanto, utiliza fuentes renovables y produce combustible de esas fuentes.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^11|3]§! Billion"
 investments_construction_REF_delayed: "§YPrerequisites§!:\n[!select_renewable_power_plant_button_click_enabled]"
 investments_construction_POWER_PLANT: "§YFossil Fuel Powerplant§!\nFossil Fuel Powerplant es un conjunto de captura para todas las fuentes termoeléctricas con base en fósiles, incluyendo pero no se limitan a; carbón, gas natural y aceite.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^12|3]§! Billion"
 investments_construction_POWER_PLANT_delayed: "§YPrerequisites§!:\n[!select_fossil_fuel_power_plant_button_click_enabled]"
 investments_construction_NUCLEAR_REACTOR: "§YReactor nuclear§!\nEl edificio de reactores nucleares convierte la energía nuclear en energía eléctrica, consumiendo uranio moderadamente enriquecido en el proceso.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^13|3]§! Billion"
 investments_construction_NUCLEAR_REACTOR_delayed: "§YPrerequisites§!:\n[!select_nuclear_power_plant_button_click_enabled]"
 investments_construction_agriculture_district: "§YDistrito Comercial de Agricultura§!\nCommercialized Agriculture District representa a catch-all for all non-subsistence Agriculture within our nation. It includes Agro-Industry, arable land, grain silos, butcherhouses and more.\n\n§YCosto base por estructura:§! §R$[?global.build_cost_array^14|3]§! Billion"
 investments_construction_agriculture_district_delayed: "§YPrerequisites§!:\n[!select_agriculture_button_click_enabled]"
