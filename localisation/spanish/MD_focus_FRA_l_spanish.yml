 FRA_corporate_systems_events.22.b_tt: "Poder político: §R-125§!\nSoberanía estratégica: §G+0.5§!\nFrancia Télécom/Orange Health: §G+1.0§!\nPresión de la deuda corporativa: §G-1.8§!"
 FRA_corporate_systems_events.22.c: "Evitar la dilución y reducir la inversión"
 FRA_corporate_systems_events.22.c_tt: "Infraestructura digital: §R-0.6§!\nPresión de la deuda corporativa: §G-1.0§!\nEstabilidad: §R-1.0%§!\nGanar §YAmbición FT 2005 Reestructuración§! para §Y730 días§!."
