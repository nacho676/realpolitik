 FRA_knds_manufacturer_trait: "Programa de convergencia MGCS"
 FRA_knds_franco_german_synthesis: "Franco-German Synthesis"
 FRA_knds_european_champion: "Europeo Campeón Industrial"
 FRA_knds_fg_partnership: "Asociación franco-alemana"
 FRA_knds_fg_partnership_desc: "El KANT 2015 mantiene unificado Krauss-Maffei Wegmann y Nexter bajo 50-50 Franco-German propiedad, agrupando dos campeones nacionales en una sola base industrial."
 FRA_knds_kant_holding: "KANT mantiene la integración"
 FRA_knds_kant_holding_desc: "Los equipos de ingeniería transfronteriza, las adquisiciones armonizadas y los servicios administrativos compartidos reducen paralelamente el funcionamiento de dos casas de defensa heredadas."
 FRA_knds_embt: "EMBT Demonstrator"
 FRA_knds_embt_desc: "El tanque de batalla principal mejorado mate un torreta Leclerc a un casco Leopard 2, previendo la filosofía de diseño híbrido del futuro Sistema de combate terrestre principal."
 FRA_knds_joint_rnd: "Joint R&D Pool"
 FRA_knds_joint_rnd_desc: "Los presupuestos combinados de investigación franco-alemana aceleran las vías paralelas en materia de armadura, electrónica y materiales energéticos que ninguna firma podría seguir sola."
 FRA_knds_mgcs_modular: "MGCS Arquitectura modular"
 FRA_knds_mgcs_modular_desc: "El Sistema Principal de Combate Terrestre se concibe como una familia multiplataforma con módulos intercambiables para la protección, potencia de fuego y guerra electrónica, reemplazando a Leopard 2 y Leclerc por los años 2040."
 FRA_knds_mgcs_integration: "Integración de sistemas MGCS"
 FRA_knds_mgcs_integration_desc: "MGCS integra una espina dorsal digital compartida, la gestión de batalla impulsada por SCORPION y la fusión de sensores comunes en formaciones blindadas franco-alemana."
 FRA_knds_turret_leadership: "Liderazgo de Turret (Siguiente)"
 FRA_knds_turret_leadership_desc: "El diseño de tortugas, la ingeniería del autocargador y la fabricación de armas se consolidan bajo los antiguos equipos Nexter, aprovechando la experiencia de energía de fuego de Leclerc-era."
 FRA_knds_hull_leadership: "Alto liderazgo (KMW)"
 FRA_knds_hull_leadership_desc: "El desarrollo de gran tamaño, paquete de energía y raíles se consolida bajo los antiguos equipos KMW, aprovechando la experiencia estructural Leopard 2 y Puma."
 FRA_knds_nato_standardisation: "Artillería de la OTAN"
 FRA_knds_nato_standardisation_desc: "KNDS suministra a la Agencia de Apoyo y Adquisiciones de la OTAN con municiones de 155 mm compatibles con STANAG, colocando a la entidad fusionada como proveedor de artillería predeterminado de Europa."
 FRA_knds_rch155: "RCH-155 Remote Howitzer"
 FRA_knds_rch155_desc: "El RCH-155 monta una torreta automatizada de 155 mm en un chasis Boxer, disparando sobre el movimiento a rangos de hasta 54 kilómetros con una tripulación de dos personas."
 FRA_knds_leopard_sustainment: "Leopard 2 flota Sostenimiento"
 FRA_knds_leopard_sustainment_desc: "La logística unificada, la producción de piezas de repuesto y la remodelación de la flota Leopard 2 caen bajo la entidad fusionada, dando a KNDS una corriente de ingresos de mantenimiento de décadas en toda Europa."
 FRA_knds_boxer_puma: "Boxer & Azafata Puma"
 FRA_knds_boxer_puma_desc: "El Boxer modular APC y Puma IFV siguen siendo programas dirigidos por KMW, respaldados ahora por el peso industrial combinado de KNDS."
 FRA_knds_bonus_katana: "BONUS & Municiones de KATANA"
 FRA_knds_bonus_katana_desc: "La BONUS alimentada por sensores y las rondas guiadas de KATANA amplían la cartera de artillería de precisión de KNDS, ahora comercializada como una sola línea de productos paneuropeos."
 FRA_knds_export_leadership: "Export Liderazgo"
 FRA_knds_export_leadership_desc: "Un agresivo comprador de los tribunales de postura de exportación en todo el Golfo, Asia sudoriental y Europa oriental con armaduras envasadas, artillería y munición."
 FRA_knds_strategic_autonomy: "Autonomía estratégica"
 FRA_knds_strategic_autonomy_desc: "Una doctrina nacional se reserva los mejores tragamonedas de producción y tecnologías sensibles para las fuerzas franco-alemanas, reforzando la autonomía estratégica europea sobre las ventas de mercado abierto."
