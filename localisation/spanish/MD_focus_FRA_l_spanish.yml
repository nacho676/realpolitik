 FRA_corporate_systems_events.25.d: "Después de más de una década de integración, Francia Télécom está dispuesta a adoptar Orange como el nombre de todo el grupo. Una identidad global unificada ofrece claridad, aunque Francia puede preservar una marca nacional o estratégica distinta."
