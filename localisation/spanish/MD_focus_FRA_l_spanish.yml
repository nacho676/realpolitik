 FRA_corporate_systems_events.26.c_tt: "Infraestructura digital: §R-0.5§!\nFrancia Télécom/Orange Health: §G+0.2§!"
 FRA_corporate_systems_events.26.d: "Orange ha preparado un importante programa de inversión para las redes fijas y móviles, incluyendo una extensa red de fibra en toda Francia. El estado puede tratar esto como una construcción comercial, acelerarlo como infraestructura estratégica o aplazar el gasto."
