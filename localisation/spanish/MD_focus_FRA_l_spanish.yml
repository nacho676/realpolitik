 FRA_preparing_launch: "Preparación del lanzamiento francés de la ISS"
 FRA_french_pillar_of_counterterrorism_tt: "¡Enviando §YYAsesores Extranjeros§! a las Naciones con §YPropósitos Antiterroristas§! ¡Nuestros asesores duplican la bonificación proporcionada a la §YAnación Asesorada§!."
 FRA_leave_eu_tt: "Las posibilidades de 'Leave' suben si los nacionalistas tienen más del 25% de popularidad."
 france_md.110.t: "El Referéndum sobre el Estatus de Mahoran"
 france_md.110.d: "El pueblo de Mayotte ha decidido celebrar un referéndum para determinar su destino en la República Francesa. La isla de Mayotte ha sido parte de la República Francesa desde 1841, cuando la isla fue vendida a Francia por el ex rey de Madagascar. Los principales funcionarios locales están tratando de solidificar su papel en la República Francesa al convertirse oficialmente en parte de la República Francesa, buscando su independencia de Francia o convirtiéndose en parte de las Comoras. ¿Qué debemos hacer?"
 france_md.110.a: "Permitir el Referéndum"
 france_md.110.b: "Negar el Referéndum"
 france_md.110.c: "Liberarlos de una autonomía limitada."
 france_md.111.t: "Resultados del Referéndum sobre el Estatus de Mahoran"
 france_md.111.d: "El referéndum finalmente llegó a su conclusión natural y los resultados ya están disponibles. El futuro de Mayotte está en manos de estos resultados."
 france_md.111.a: "Perfección."
 france_md.505.t: "La propuesta de fusión KMW-Siguiente"
 france_md.505.d: "Los gobiernos de Francia y Alemania están finalizando un plan para fusionar Nexter Systems y Krauss-Maffei Wegmann en una sola defensa franco-alemana. El consorcio KANT resultante traería a Leclerc y Leopard 2 líneas de producción bajo un mismo techo, crearía una cartera conjunta de artillería y municiones y anclaría un futuro programa europeo de tanques de combate.\n\nLos ministros quieren la aprobación política antes de que la transferencia de acciones avance."
 france_md.505.a: "Aprobar la fusión"
 france_md.505.b: "Mantener a Nexter independiente"
 TT_FRA_knds_merge_carry_traits: "§YTodos los rasgos ya completados en Nexter llevarán a la nueva organización KNDS.§!"
 france_md.506.t: "Arquus: Consolidation Industrial"
 france_md.506.d: "Las filiales de defensa del Grupo Volvo, Renault Trucks Defense y Panhard General Defense, han completado su fusión en una sola entidad. La nueva firma, Arquus, une las plataformas de movilidad con ruedas de Renault con el patrimonio de reconocimiento de Panhard y posiciona a Francia como contendiente unificado en el mercado europeo de vehículos blindados. Los conocimientos, programas y modificadores combinados de producción de ambas firmas heredadas se transfieren a la nueva organización."
 france_md.506.a: "Un nuevo capítulo para la movilidad blindada francesa"
 france_md.506_tt: "Renault y Panhard se fusionarán en Arquus"
 FRA_arguus_established: "Renault y Panhard se fusionaron en Arquus en 2018"
 france_md.507.t: "Eurocopter se convierte en helicópteros Airbus"
 france_md.507.d: "A partir de hoy, el Eurocopter Group es remarcado como Airbus Helicopters, consolidando el negocio de rotorcraft EADS bajo la identidad unificada de Airbus. Las obras de Marignane, la planta de Donauwörth y las líneas del patrimonio de Aérospatiale ahora operan bajo una bandera."
 france_md.507.a: "Un nuevo capítulo para el rotorcraft europeo."
 TT_FRA_airbus_change_carry_traits: "§YTodos los rasgos ya completados en $FRA_eurocopter_manufacturer$ llevarán hasta $FRA_airbus_manufacturer$§!"
 france_md.508.t: "DCNS se convierte en Grupo Naval"
 france_md.508.d: "A partir de hoy, el histórico arsenal estatal Direction des Constructions Navales, desde hace mucho tiempo remarcado DCNS, adopta la nueva identidad Grupo naval, marcando su transformación en una corporación privada completa. Los patios Lorient, Cherbourg y Brest ahora operan bajo una bandera, junto con la empresa conjunta Naviris con Fincantieri y un nuevo impulso de exportación construido alrededor del submarino de clase Suffren y la fragata de IED Belharra."
 france_md.508.a: "Un nuevo capítulo para la construcción naval francesa."
 TT_FRA_naval_takeover_carry_traits: "§YTodos los rasgos ya completados en $FRA_dcn_manufacturer$ llevarán hasta $FRA_naval_group_naval_manufacturer$§!"
 FRA_nexter_manufacturer: "Industrias GIAT"
 FRA_nexter_merge: "Nexter se fusionó con KMW en 2015"
 FRA_nexter_cold_war_legacy: "War Legacy"
 FRA_nexter_scorpion_programme: "Programa Escorpión"
 FRA_nexter_firepower_ammo: "Firepower & Ammunition"
 FRA_nexter_manufacturer_trait: "Doctrina de potencia de fuego CAESAR"
 FRA_nexter_manufacturer_trait_desc: "Desde el arsenal de Bourges se forja a la camioneta montada CAESAR howitzer, Nexter ha construido su reputación en rápida y precisa potencia de fuego entregada por plataformas ligeras rastreadas y con ruedas."
 FRA_nexter_leclerc_programme: "Programa Leclerc"
 FRA_nexter_leclerc_programme_desc: "El Leclerc es el principal tanque de combate de Nexter, desarrollado a finales del decenio de 1970 y entrando en servicio en 1992. Su autocargador y armadura modular establecen el punto de referencia para la doctrina acorazada francesa."
 FRA_nexter_leclerc_mk2: "Leclerc Series 2"
 FRA_nexter_leclerc_mk2_desc: "La revisión Serie 2 introdujo aire acondicionado híbrido, electrónica actualizada y mejores paquetes de armadura compuesta, ampliando la vida útil de la plataforma en los 2020s."
 FRA_nexter_leclerc_xlr: "Modernización de Leclerc XLR"
 FRA_nexter_leclerc_xlr_desc: "La actualización de la vida media XLR reconstruyó el Leclerc en torno a una estación de armas remotas, kits de armadura modulares y la integración de gestión de batalla SCORPION, manteniéndolo competitivo contra nuevos diseños MBT."
 FRA_nexter_vbci: "VBCI rueda IFV"
 FRA_nexter_vbci_desc: "El Véhicule Blindé de Combat d'Infanterie dio al ejército francés su primer IFV moderno. La producción comenzó en 2008 y la plataforma se convirtió en la columna vertebral de la movilidad blindada para regimientos motorizados."
 FRA_nexter_famas: "Fusil de servicio FAMAS"
 FRA_nexter_famas_desc: "El rifle de asalto FAMAS fue el arma estándar de infantería francesa a partir de 1981. La línea de armas pequeñas de Nexter creció de sus contratos de producción y apoyo en curso."
 FRA_nexter_scorpion_core: "Escorpión de combate integrado"
 FRA_nexter_scorpion_core_desc: "El programa Escorpión, formalizado en 2014, redactó la nueva familia de combates con ruedas del Ejército francés bajo un sistema común de gestión de batalla y columna vertebral digital."
 FRA_nexter_griffon: "VBMR Griffon"
 FRA_nexter_griffon_desc: "El Griffon es el portador táctico multirole de seis ruedas de la familia Escorpión, suplantando al VAB como vehículo de personal blindado francés estándar."
 FRA_nexter_jaguar: "EBRC Jaguar"
 FRA_nexter_jaguar_desc: "El vehículo de reconocimiento y combate de seis ruedas Jaguar monta un cañón CTA de 40 mm y misiles Akeron MP, heredando conceptos de potencia de fuego probados en el Leclerc."
 FRA_nexter_serval: "VBMR-L Serval"
 FRA_nexter_serval_desc: "El Serval ligero de cuatro ruedas extiende la movilidad Escorpión a las fuerzas especiales, patrulla y variantes de comando con un casco compacto de aluminio."
 FRA_nexter_40cta: "40 CTA Cannon"
 FRA_nexter_40cta_desc: "Desarrollado conjuntamente con BAE Systems a través de CTA International, el cañón cased-telescoped de 40 mm ofrece una potencia de fuego compacta y antiarmour de alta velocidad en toda la flota Escorpión."
 FRA_nexter_caesar: "CAESAR 155mm Platform"
 FRA_nexter_caesar_desc: "El camionero CAESAR montado en 155mm howitzer combina movilidad estratégica con fuego de precisión de largo alcance, convirtiéndose en la plataforma de artillería de exportación más exitosa de Nexter."
 FRA_nexter_eurenco: "EURENCO Propellants"
 FRA_nexter_eurenco_desc: "EURENCO suministra los propulsantes, explosivos y materiales energéticos que sustentan la artillería francesa y las municiones de armas pequeñas, atando la salida de Nexter a una cadena de suministro segura."
 FRA_nexter_nbc_sys: "NBC-Sys CBRN Kit"
 FRA_nexter_nbc_sys_desc: "La subsidiaria de la NBC-Sys se especializa en equipo químico, biológico, radiológico y nuclear de detección y descontaminación para las fuerzas francesas y exportadoras."
 FRA_nexter_lu_family: "IU Family Rounds"
 FRA_nexter_lu_family_desc: "La familia LU211 y LU de rondas de 155 mm extienden el rango de artillería a través de aerodinámicas mejoradas, estandarizando incendios de largo alcance en tubos compatibles con la OTAN."
 FRA_nexter_bonus: "Munición inteligente BONUS"
 FRA_nexter_bonus_desc: "La ronda de 155 mm alimentada por el sensor BONUS dispone submuniciones auto-objetivas contra columnas blindadas, dando a las unidades de artillería una capacidad anti-armour de precisión de los orígenes estándar."
