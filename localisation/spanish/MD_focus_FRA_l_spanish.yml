 france_md.509.t: "Introducción de la OCE"
 france_md.509.d: "Francia ha propuesto sustituir el franco CFA por la OCE, una nueva moneda común para África Occidental. Adoptarla nos concedería una mayor autonomía monetaria y vínculos más estrechos con Francia."
 france_md.509.a: "Adoptar la OCE"
 france_md.509.b: "Decline la oferta"
 FRA_airbus_change: "Eurocopter ha sido remarcado como Helicópteros Airbus en 2014"
 FRA_naval_takeover: "DCNS ha sido remarcado como Grupo Naval en 2017"
 Francosphere: "Francosphere"
 Continental_system: "Sistema Continental"
 Holy_league: "Liga Santa"
 world_revolution_commune: "Comuna revolucionaria mundial"
 FRA_PS: "El Partido Socialista"
 FRA_PS_desc: "Fundado en el Congreso de Épinay bajo François Mitterrand, el Partido Socialista superó a los comunistas como la fuerza dominante de la izquierda francesa y se ha alternado en el poder con la derecha republicana desde entonces. Nuestra base es amplia y se extiende a través de la mayoría de las clases, y nuestro regreso al Élysée es cuestión de tiempo."
 FRA_UDF_LREM: "La Unión del Centrista"
 FRA_UDF_LREM_desc: "Reunido en 1978 para apoyar a Valéry Giscard d'Estaing, la Unión para la Democracia Francesa es una confederación de liberales, demócratas cristianos y radicales en lugar de un partido único. Relegado a socio junior durante dos décadas, tenemos la intención de construir un centro que gobierna en su propio derecho."
 FRA_LR: "La derecha republicana"
 FRA_LR_desc: "La derecha gaullista es tan antigua como la Quinta República y ha ejercido la presidencia desde 1995, pero una disolución fallida nos ha costado mucho y puesto un socialista en Matignon. Debemos consolidar el centro-derecho antes de que nuestros rivales en ambos flancos nos superen."
 FRA_RPF: "Rallye de Francia"
 FRA_RPF_desc: "Charles Pasqua y Philippe de Villiers fundaron el Rallye de Francia en 1999 para Gaullists que juzgaron a la derecha dominante demasiado acomodada hacia Bruselas. Nuestra influencia es pequeña hoy, pero cada concesión hecha a la Unión Europea recluta para nosotros."
 FRA_FN: "El Frente Nacional"
 FRA_FN_desc: "Fundada en 1972 alrededor de Jean-Marie Le Pen, el Frente Nacional ha pasado tres décadas fuera de la política respetable mientras que cada otro partido cerró filas contra él. El cordón sanitaire está empezando a freír, y queremos estar listos cuando se rompe."
 FRA_LFI: "Unbowed France"
 FRA_LFI_desc: "El Partido Socialista se ha gastado sirviendo sopa a los centristas y muriendo entre sus dos tendencias. La France Insoumise es la única oposición de izquierda genuina al orden neoliberal, y no buscaremos compromiso con él."
 FRA_EELV: "Los Verdes"
 FRA_EELV_desc: "El movimiento ecologista ha impugnado las elecciones francesas desde 1984 sin tomarse en serio, y nuestra base apenas llega más allá de las ciudades. El tiempo es el único recurso que no podemos hacer campaña, por lo que debemos convertir a las otras partes o reemplazarlas."
 FRA_PCF: "El Partido Comunista Francés"
 FRA_PCF_desc: "El Partido Comunista Francés cayó con la Unión Soviética a la que estaba ligada, y nuestra base de clase obrera se dirige hacia la extrema derecha o hacia la abstención. Revertir ese declive es toda la tarea que tenemos ante nosotros."
 FRA_friend_eu: "Befriend EU"
 FRA_friend_eu_desc: "La Unión Europea es el hogar de muchas naciones dirigidas por partidos similares a los nuestros. Debemos utilizar esta convergencia ideológica para destacar nuestra postura proeuropea como un baluarte contra el nacionalismo."
 FRA_eternal_challenge: "El Retador Eterno"
 FRA_eternal_challenge_desc: "Durante décadas, hemos sido el único partido en la lucha tanto en las calles como en el parlamento para defender a los trabajadores. Nuestros enemigos son claros: el ala derecha y los extremistas. La gente sabe que pueden confiar en nosotros para enfrentarse a ellos. Nuestros enemigos nunca duermen, y debemos recordarlo. United, podemos asustar cualquier amenaza."
 FRA_eu_federalism: "Federalismo europeo"
 FRA_eu_federalism_desc: "Otras naciones deben recordar los valores que representamos como la Unión Europea: protegerlos, desarrollarlos y difundirlos entre las otras naciones de Europa."
 FRA_let_industry: "Deja que la industria se vaya"
 FRA_let_industry_desc: "La industria pesada es una pérdida de tiempo y energía; ya no es lo suficientemente productiva en una economía globalizada como la nuestra. No debemos interponernos en el camino de su reubicación a los nuevos centros industriales del mundo. En cambio, debemos llamar nuestra atención a una nueva forma de economía: el sector de los servicios. Las oficinas se convertirán en nuestro enfoque principal en los años venideros. Al priorizarlos, podemos reducir el desempleo y aumentar los ingresos que generan."
 FRA_finance_minister: "Una nueva política económica"
 FRA_finance_minister_desc: "En un mundo que sufre transformación, también debemos evolucionar y cambiar nuestro enfoque económico. Las crisis económicas han puesto de relieve las limitaciones de la economía keynesiana, por lo que debemos cambiar la forma en que pensamos. En consecuencia, debemos elegir nuestro próximo programa económico para el sector financiero. Nos permitirá reducir el gasto, pero la única pregunta es en quién podemos confiar."
 FRA_atlantist_drift: "Drift atlántico"
 FRA_atlantist_drift_desc: "La OTAN es la alianza más fuerte que existe actualmente. Si queremos mantenerlo así, debemos mejorar el entrenamiento de nuestras fuerzas armadas."
 FRA_greece_eurozone: "Grecia en la zona euro"
 FRA_greece_eurozone_desc: "Grecia es conocida por sus problemas de deuda. Podemos ayudarles con algo de dinero para demostrarles que los países de la Unión Europea realmente se preocupan mutuamente."
 FRA_tax_evasion: "Lucha contra la evasión fiscal"
 FRA_tax_evasion_desc: "Hay demasiadas personas que siguen evitando pagar impuestos a través de diversos esquemas; debemos poner fin a esto porque nos hemos comprometido a hacerlo."
 FRA_liberal_turn: "giro liberal"
 FRA_liberal_turn_desc: "Durante demasiado tiempo, hemos tratado de controlar la economía y el sector financiero, pero en un mundo globalizado es cada vez más difícil controlar el flujo del capital. Así que deberíamos dejar que el mercado se regule. ¿Qué podría ir mal?"
 FRA_ease_interventionism: "Intervencionismo de Facilidad"
 FRA_ease_interventionism_desc: "Debemos centrarnos en mejorar las relaciones diplomáticas en Europa, no enviar a nuestro pueblo para luchar contra la guerra de otros. Europa es actualmente un continente de paz, y como importante poder regional debemos dar un buen ejemplo para todos."
 FRA_modern_interest: "Interés Moderno"
 FRA_modern_interest_desc: "Durante demasiado tiempo, hemos pasado nuestro tiempo defendiendo una clase improductiva que está perpetuamente en crisis. Es hora de que busquemos el futuro, y el futuro se encuentra en los servicios y la tecnología."
 FRA_cut_with_unions: "Corte con uniones"
 FRA_cut_with_unions_desc: "Los sindicatos laborales ya no son tan útiles para nuestro país como antes. Ya no debemos ceder a sus demandas; después de todo, no somos sus rehenes."
 FRA_vigipirate: "Reforzar la seguridad"
 FRA_vigipirate_desc: "Misión Vigipirate será nuestro sistema nacional de alerta contra la seguridad y el terrorismo. Se supone que es un mecanismo permanente que involucra al gobierno, las fuerzas armadas, las autoridades locales y los ciudadanos diseñados para anticipar, prevenir y proteger a nuestro país contra amenazas terroristas."
 FRA_not_done: "Aún no estamos hechos."
 FRA_not_done_desc: "El 21 de abril fue una humillación sin precedentes. Nuestro candidato fue eliminado en la primera vuelta y la República se vio obligada a elegir entre la derecha y la extrema derecha. Sin embargo, los militantes no han ido a casa, las secciones todavía se reúnen, y los votantes que se dirigían a la lejana izquierda no tienen nada mejor que ir. Reconstruimos desde la base hacia arriba, y hacemos nuestra paz con los sindicatos que alienamos."
 FRA_meet_friends: "Reunión con amigos"
 FRA_meet_friends_desc: "Ahora es un buen momento para organizar una reunión con otros países socialistas para discutir la situación mundial actual y el camino hacia el socialismo."
 FRA_turn_ecology: "Gire a la Ecología"
 FRA_turn_ecology_desc: "Los Verdes no se apartarán de nosotros en las próximas elecciones legislativas sin precio, y el precio está escrito en los reactores. Veinticuatro de ellos, Fessenheim primero, y la mitad de nuestra mezcla de electricidad se rindió a finales de la década. Las federaciones energéticas del CGT ya han hecho su punto de vista claro. Debemos decidir si la alianza vale la pena para la flota."
 FRA_military_coop: "Cooperación militar"
 FRA_military_coop_desc: "Sobre la base de nuestra estrecha cooperación con la OTAN, debemos invitar a otros países a que impartan capacitación militar conjunta con nosotros. Todo el mundo se beneficia, y mostrará a nuestros enemigos lo unidos y listos que estamos."
 FRA_party_unity: "Unidad de Partidos"
 FRA_party_unity_desc: "Cada congreso termina de la misma manera. Las corrientes argumentan por tres días, nadie gana, y un movimiento de sintèse se redactó durante la noche para que todos puedan reclamar la victoria. Reims casi nos rompió más de cuarenta y dos votos. La unidad es posible, pero se compra con ministerios y secretarías, y el proyecto de ley siempre se paga en patrocinio."
 FRA_strenght_throught_EU: "Fortalecer a través de la UE"
 FRA_strenght_throught_EU_desc: "La UE representa valores democráticos, y nosotros también. Esa debería ser la razón suficiente para mantener viva a esta organización, fuerte y estable. Si la UE cae, Europa puede dividirse una vez más."
 FRA_stole_voter: "Reconectarse con nuestro electorado"
 FRA_stole_voter_desc: "El minier bassin y el Midi fueron nuestros por un siglo y ahora son el terreno más seguro que la extrema derecha tiene. Lecturar a esos votantes no ha funcionado. Si queremos que vuelvan, debemos ir a ellos con algo en nuestras manos: hornos relit, ranuras abiertas, una promesa industrial hecha en público. Hecho, y luego guardado, porque una promesa rota nos costará la región para una generación."
 FRA_ps_lgbt: "Garantizar los derechos LGBT"
 FRA_ps_lgbt_desc: "El pacto de solidaridad civil fue sólo media medida. Matrimonio, adopción, plena igualdad de parejas ante la ley: esta es la reforma que esperan nuestros votantes y la que el derecho ha prometido luchar en las calles. La Manif pour Tous ya está reservando el Campo de Marte. Podemos llevar toda la ley, o podemos recortarla y mantener la paz."
 FRA_ps_win: "El socialismo ha sido salvado"
 FRA_ps_win_desc: "¡Lo hemos hecho! Hemos logrado lo imposible. Después de evitar estrechamente el colapso y una derrota humillante a manos de los franceses y a los ojos de la historia, hemos logrado girar las cosas. Nuestros oponentes pensaron que estábamos acabados, pero logramos recuperar nuestro electorado y alejarlos de las llamadas sirenas del extremismo. Nuestra victoria es un signo de la estabilidad del socialismo en todo el mundo. Pero nuestra victoria es sólo el principio; armado con esta experiencia, no cometeremos los mismos errores por segunda vez."
 FRA_Neither_right_nor_left: "Ni la derecha ni la izquierda"
 FRA_Neither_right_nor_left_desc: "La mejor manera de desarrollar nuestro país es alejarse de la política divisiva. Ocupemos el terreno central, no demasiado a la derecha, no demasiado lejos."
 FRA_Get_indecisives: "Indecisos"
 FRA_Get_indecisives_desc: "Ni derecha ni izquierda. Hay votantes en este país que nunca han encontrado un partido digno de la caminata a la estación electoral, y hay miles de voluntarios dispuestos a golpear sus puertas y preguntar lo que quieren. La Grande Marche nos los traerá de ambos viejos partidos a la vez. Lo que no nos traerá es una sola federación local."
 FRA_abolish_ISF: "Supresión ISF"
 FRA_abolish_ISF_desc: "El impuesto de solidaridad sobre la riqueza eleva poco y los exiliados mucho. Durante treinta años la capital se ha ido a Bruselas y Ginebra, y los recibos nunca han justificado el vuelo. Lo reemplazamos solo con un impuesto sobre la propiedad. El dinero volverá a casa. Así también la acusación, en cada titular hasta las próximas elecciones, de que gobiernemos para los ricos."
 FRA_Fight_Deficit: "Deficit de combate"
 FRA_Fight_Deficit_desc: "Nuestra deuda es alta. Tenemos que luchar contra ello sin importar el costo si no queremos ahogarnos en deudas no podemos pagar. El pueblo seguramente entenderá estas acciones necesarias."
 FRA_Reconize_Mistakes: "Recognise Mistakes"
 FRA_Reconize_Mistakes_desc: "Los líderes franceses anteriores trataron a las naciones coloniales de una manera profundamente injusta. Finalmente debemos arreglar las cosas pagando por sus acciones. Deja que este capítulo en nuestra historia finalmente se cierre."
 FRA_Western_policy: "Política occidental"
 FRA_Western_policy_desc: "La Unión Europea y la alianza atlántica son lo que mantiene a salvo este continente, y no ganamos nada de fingir lo contrario. Una integración más estrecha con nuestros aliados nos compra influencia en Bruselas y buena voluntad en Washington. También da a los souverainistas, gaullistas y nacionalistas por igual, el único argumento que han necesitado: que la República se ha convertido en vasallo."
 FRA_independant_Euro: "Europa independiente"
 FRA_independant_Euro_desc: "Otros países deben saber que dentro de una Europa unida no buscamos influencia excesiva sobre su estabilidad. Solos, algunos de nosotros podemos ser vulnerables, pero juntos debemos ser lo suficientemente fuertes para superar estos problemas."
 FRA_reduce_tax: "Reducir impuestos"
 FRA_reduce_tax_desc: "El taxe d'habitation cae más duro en los hogares que menos pueden absorberlo, y el crédito laboral ya ha demostrado lo que el alivio hace para la contratación. Lo eliminaremos por completo. Las comunas pierden su base de ingresos, por lo que el estado debe compensarlos desde París, y cada alcalde en Francia nos escribirá sobre ello."
 FRA_increase_pension_age: "Aumento de la edad de jubilación"
 FRA_increase_pension_age_desc: "A la gente no le gusta, pero a medida que aumenta la esperanza de vida gracias a nuevos avances en la medicina, debemos seguir financiando nuestro sistema de bienestar social. Sin embargo, con menos y menos jóvenes para financiar las pensiones de un número cada vez mayor de personas mayores, no tenemos elección. Debemos hacer que la población trabajadora trabaje por más tiempo para compensar esta falta de renovación generacional."
 FRA_growing_tensions: "Tensiones crecientes"
 FRA_growing_tensions_desc: "Nuestro mundo se está volviendo cada vez menos seguro, y podemos ver el regreso de la guerra a Europa. Para asegurarnos de que no nos atrapen, debemos prepararnos para ello."
 FRA_befriend_china: "Befriend China"
 FRA_befriend_china_desc: "China es un importante socio comercial de Francia; nos interesa mucho negociar con ellos tratados favorables."
 FRA_nuclear_eu: "Nuclearizar la UE"
 FRA_nuclear_eu_desc: "Cincuenta y seis reactores, y nadie en Bruselas dispuesto a llamarlos verdes. La taxonomía está siendo escrita ahora, y si la nuclear es excluida de ella toda nuestra flota se convierte en una responsabilidad sobre papel. Berlín y Viena lucharán contra nosotros. Praga, Varsovia y Helsinki no lo harán. Construimos la alianza, ganamos el voto y aceptamos que Alemania lo recordará."
 FRA_reise_tertiary: "El Rise of Tertiary"
 FRA_reise_tertiary_desc: "La economía occidental de hoy es una economía basada en el servicio que reúne a los diversos actores involucrados en la producción. Francia debe desempeñar su papel en esta transición económica; no hay otra manera."
 FRA_reduce_public_service: "Reducir el servicio público"
 FRA_reduce_public_service_desc: "Al reducir el gasto público podremos reducir nuestra deuda una vez más. La gente lo odiará, pero tenemos que elegir el mal menor. Si el país cae debido a la deuda, la reducción del gasto social será el menor de sus problemas."
 FRA_strat_indus: "Financiación de nuestras industrias estratégicas"
 FRA_strat_indus_desc: "Aunque nuestras industrias ya no son tan competitivas como antes, hay ciertas industrias que no podemos hacer sin ellas. La industria de defensa es una de ellas, ya que no podemos confiar en otros países para nuestra defensa. Francia siempre ha producido sus propias armas. Por lo tanto, es de suma importancia que esto siga siendo el caso, en particular en un mundo donde las tensiones están aumentando."
 FRA_arms_deal: "Aumento de las exportaciones de armas"
 FRA_arms_deal_desc: "Es común saber que nuestro complejo militar-industrial produce excelentes armas. Como tal, hemos sido uno de los principales exportadores de armas durante muchos años. Este comercio de armas nos permite no sólo proyectar nuestro poder a nivel internacional, sino también ganar mucho dinero e influencia. Por lo tanto, sólo puede ser algo bueno."
 FRA_eu_mil: "Asistencia a la construcción militar de la UE"
 FRA_eu_mil_desc: "Aunque nuestro país está relativamente bien preparado para hacer frente al regreso de la guerra a Europa, no se puede decir lo mismo de todos nuestros socios europeos. La mayoría de ellos no tienen oportunidad de luchar. Deberíamos ayudarlos a desarrollar sus capacidades, ya que su seguridad es nuestra."
 FRA_finance_student: "Mejor estudiante de Finanzas"
 FRA_finance_student_desc: "Al aplicar la fórmula neoliberal a la perfección, nuestra economía nunca se ha integrado tan estrechamente en la dinámica internacional. Esto es algo bueno, ya que nos permitirá beneficiarse del progreso de otros países e invertir en todo el mundo para cosechar las recompensas."
 FRA_right_left_money: "El centro"
 FRA_right_left_money_desc: "Durante demasiado tiempo, nuestro país ha sido rehén por la división izquierda-derecha. Siguiendo todos nuestros avances en finanzas y geopolíticas, hemos demostrado el poder del ordoliberalismo. Nuestro papel es permitir que el mercado florezca en Francia, y permitir que los franceses se beneficien de la riqueza que esto genera."
 FRA_demograph_arms: "Promoción del desarme demográfico"
 FRA_demograph_arms_desc: "Una buena campaña de crecimiento demográfico es una inversión a largo plazo en el futuro de nuestro país."
 FRA_share_eu: "Compartir nuestro poder con la UE"
 FRA_share_eu_desc: "Nuestros enemigos deben saber que somos muy serios sobre la protección de la independencia de los Estados miembros de la Unión Europea. Si es necesario, amenazaremos a cualquier opresor con nuestro arsenal nuclear."
 FRA_handle: "Manejar la situación"
 FRA_handle_desc: "Vinieron por el impuesto de combustible y se quedaron para todo lo demás. Las glorietas están ocupadas, los Campos Elíseos han quemado dos veces, y las rondas de balonmano nos han costado ojos y titulares en igual medida. Podemos aprobar la ley antidisturbios y despejarlos por la fuerza, o podemos abrir un debate nacional y comprar la paz con diez mil millones de euros que no tenemos."
 FRA_startup_nation: "La nación de inicio"
 FRA_startup_nation_desc: "Gracias a nuestras audaces políticas y nuestra negativa a retroceder ante estos galos recalcitrantes, hemos logrado nuestro objetivo. Una vez hemos transformado una sociedad hostil al emprendimiento, liberándola de los impuestos y regulaciones que lo retuvieron. Un futuro brillante de innovación y liberalismo está por delante de nosotros. Esa es nuestra visión."
 FRA_Neo_gaulism: "Neo-Gaullism"
 FRA_Neo_gaulism_desc: "Neo-Gaullism es un movimiento político francés que adaptó los principios originales del General Charles de Gaulle. Hizo hincapié en la soberanía nacional, una fuerte presidencia ejecutiva y la independencia de las políticas extranjeras para adaptarse a la era moderna y globalizada."
 FRA_known: "El Parti Inevitable"
 FRA_known_desc: "Desde la fundación de la Tercera República y el surgimiento de una forma estable de republicanismo, siempre ha habido conservadores. Simplemente somos su última encarnación. Durante décadas, hemos estado presentes en cada segunda ronda de elecciones. No hay razón para que las próximas elecciones sean diferentes. Nuestro nuevo milenio está lleno de incertidumbres, por lo que debemos ser la voz de estabilidad y sentido común ante los extremistas."
 FRA_oppose_immigration: "Contra la inmigración"
 FRA_oppose_immigration_desc: "Los inmigrantes ya han demostrado lo peligrosos que pueden ser, especialmente los de regiones de guerra sin fin. Debemos tomar medidas para evitar que lleguen."
 FRA_continue_liberal: "Continuar las políticas liberales"
 FRA_continue_liberal_desc: "Seguiremos aplicando nuestro programa de liberalización económica, porque así es como funciona mejor la economía."
 FRA_patriotism: "Patriotismo"
 FRA_patriotism_desc: "La gente francesa debe estar orgullosa de su nacionalidad e historia que viene con ella. Como resultado, deben acostumbrarse a preguntar menos del estado. Ya no podemos permitirnos la generosidad del pasado. Deben aprender a lado con el estado y dejar de exigir constantemente más dinero público."
 FRA_turn_west: "Vuelta Oeste"
 FRA_turn_west_desc: "Deberíamos mejorar nuestras relaciones con nuestros amigos de ultramar en Estados Unidos. Sus políticos pueden cambiar, pero tenemos que asegurarnos de que ninguno de ellos se vuelva atrás en Francia."
 FRA_third_voice: "La Tercera Voz de Francia"
 FRA_third_voice_desc: "En un mundo todavía dividido entre la OTAN y los restos de la URSS, Francia debe trazar su propio rumbo, como siempre lo ha hecho. No podemos confiar en un aliado lejano que no vendría a nuestra defensa; por lo tanto, debemos forjar nuestro propio destino junto con aquellos que rechazan la opresión del Este o del Oeste."
 FRA_austerity: "Austeridad de uso"
 FRA_austerity_desc: "El déficit es estructural y las agencias de calificación están dando vueltas. Cortamos donde es posible el corte: un funcionario reemplazó por cada dos que se jubilan, los ministerios fusionados, la construcción diferida. Los sindicatos lo llamarán lo que es y llevarán a un millón de personas a las calles sobre la edad de jubilación, y la izquierda pasará una década corriendo contra esta decisión única."
 FRA_question_ref: "Aceleración de la integración europea"
 FRA_question_ref_desc: "Aunque Francia es uno de los pilares fundadores de la Unión Europea, su pueblo está ahora entre los más escépticos hacia ella. Los franceses se han opuesto repetidamente a la introducción de nuevos tratados. Debemos dejar de pedirles su opinión sobre cada cuestión, ya que esto reduce considerablemente el proceso de integración europea. Muchos tomarán esto mal y se volverán aún más opuestos a la Unión Europea, pero al menos dejaremos de ser los que retengan la Unión Europea."
 FRA_nato_integration: "OTAN Integración"
 FRA_nato_integration_desc: "Otro paso para mejorar nuestra seguridad en este continente. Sin la OTAN, que sabe en qué estado Europa estaría hoy."
 FRA_national_indep: "Independencia nacional"
 FRA_national_indep_desc: "Al adoptar una posición entre Oriente y Occidente, Francia puede defender sus propios intereses y ya no tiene que tener en cuenta las opiniones de un burócrata en Washington."
 FRA_end_proximity_police: "Policía de proximidad final"
 FRA_end_proximity_police_desc: "La policía no debe estar mezclada con la gente a la que se supone que están vigilando. Una fuerza policial de respuesta rápida sería más eficaz en función de los costos."
 FRA_reform_wealth: "Reforma del Estado de Bienestar"
 FRA_reform_wealth_desc: "Por mucho tiempo, Francia ha sido un estado de bienestar; es hora de que los franceses se hagan cargo de sí mismos sin depender siempre del dinero público."
 FRA_looming_crisis: "La crisis inminente"
 FRA_looming_crisis_desc: "En enero la Société Générale descubrió que un solo comerciante había perdido casi cinco mil millones de euros sin que nadie se diera cuenta. Esa fue la advertencia. El mercado de la hipoteca estadounidense es peor, nuestros bancos están expuestos a él, y Dexia ya está en problemas. Podemos construir el aparato de supervisión ahora y frenar nuestra propia economía haciéndolo, o podemos confiar en el ciclo y la esperanza."
 FRA_defend_interest: "La defensa de los intereses de Francia"
 FRA_defend_interest_desc: "Ser independientes significa que debemos protegernos de la influencia extranjera, tanto en nuestro propio país como donde tengamos intereses. Debemos tomar medidas en esta dirección para garantizar que Francia siga siendo una gran nación."
 FRA_lower_expanse: "Stop Funding Unproductive Businesss"
 FRA_lower_expanse_desc: "La subvencion de la actividad económica viene a un costo cada vez más significativo. Deberíamos echar un vistazo a nuestro gasto y subvencionar solamente industrias eficientes y competitivas."
 FRA_oppose_lgbt: "Acto contra el Wokeismo"
 FRA_oppose_lgbt_desc: "Las tendencias del pensamiento que son cada vez más hostiles a las normas tradicionales están entrando en nuestra sociedad. Estas normas existen por una razón y siempre han prevalecido. Debemos prevenir esta infiltración."
 FRA_return_rurality: "Embrace Rurality"
 FRA_return_rurality_desc: "Las principales ciudades se están convirtiendo cada vez más en focos de decadencia y crimen. Debemos alentar a nuestros ciudadanos a alejarse de ellos y hacia regiones que, aunque sean menos prósperas, están más cerca del sentido común."
 FRA_end_assisted: "Finalizar la cultura de dependencia"
 FRA_end_assisted_desc: "Una proporción demasiado grande de nuestra población se basa en beneficios incondicionales que se les han concedido sin tener que hacer ningún trabajo. Esta situación es inaceptable y está poniendo presión sobre nuestras finanzas. Debemos poner fin a estos beneficios; esto hará que la gente trabaje."
 FRA_hostile_bear: "Hostilidad al Oso"
 FRA_hostile_bear_desc: "Rusia se está convirtiendo una vez más en una amenaza para los intereses y la seguridad europeos. Los países de primera línea deben comenzar los preparativos para defenderse en caso de cualquier acción hostil del este."
 FRA_wake_up: "Despierta a Francia"
 FRA_wake_up_desc: "Liberado de la decadencia y las tentaciones de la inacción, el pueblo francés puede volver al trabajo."
 FRA_eternal_france: "Eternal France"
 FRA_eternal_france_desc: "Hemos hecho nuestro país más fuerte que nunca antes. Aumentamos nuestra propia protección contra las amenazas extranjeras, reducimos los problemas internos y disminuimos nuestros problemas de deuda. Hemos asegurado un futuro para nuestro país. Francia siempre ha estado allí y siempre estará."
 FRA_enought_soc: "Suficiente de Socialismo"
 FRA_enought_soc_desc: "Como partido conservador, los progresistas y el Partido Socialista son nuestros principales oponentes. Ellos abogan por una Europa liberal, precisamente lo que la gente ya no quiere, y trabajaremos para liberarnos de ella. Debemos mostrar al pueblo que somos, y siempre seremos, el instrumento a través del cual se realiza su deseo de estabilidad y protección. Estamos en contra de la Unión Europea liberal y el progresismo."
 FRA_sovereignism: "Nuestra Soberanía"
 FRA_sovereignism_desc: "Durante demasiado tiempo, el pueblo francés ha sido ignorado; nadie en nuestro país quería que la Unión Europea creciera a tales proporciones. Si se trata de tratados o ampliación, la gente es escéptica cada vez, y cada vez que son ignorados. Es hora de que un partido plantee nuevamente la cuestión de la soberanía de Francia."
 FRA_sacrifice: "Sacrifice necesario"
 FRA_sacrifice_desc: "Nos dirigimos a tiempos difíciles, y el difícil camino que se avecina exigirá disciplina y buena voluntad por parte del pueblo francés. Los franceses deben aprender una vez más que les corresponde hacer sacrificios por Francia, y no por el otro lado."
 FRA_elder_view: "Nuestra vista más antigua"
 FRA_elder_view_desc: "El Consejo Nacional de la Resistencia hizo un tremendo trabajo para reconstruir nuestro país desde las ruinas de la Segunda Guerra Mundial, y al hacerlo se convirtió en un vasallo de los Estados Unidos. Pero desde hace décadas, su trabajo ha sido socavado gradualmente por los políticos, cada uno más liberal que el último. Debemos volver a nuestras raíces, seguir el ejemplo del General, invertir en nuestra industria y construir nuestro país, que ha sido devastado por décadas de integración europea y desindustrialización."
 FRA_neccesity_leaving: "La necesidad de salir"
 FRA_neccesity_leaving_desc: "Nuestro viaje hacia la salida de la Unión Europea sólo ha comenzado. Debemos hacer que la gente entienda que debemos dejar esta Europa antes de que sea demasiado tarde para hacerlo."
 FRA_fight_renouncement: "Lucha contra los partidarios de la renuncia"
 FRA_fight_renouncement_desc: "El General no confió en los otros poderes europeos para tener la voluntad de crear una Europa independiente de los Estados Unidos. Tenía razón: unas pocas décadas después de su muerte, nuestros socios están más preocupados con el kowtowing a los Estados Unidos y comprar equipos de ellos que con trabajar hacia la independencia de Europa. Debemos denunciar esta espiral descendente, que ya es una razón para dejar esta Europa que es un vasallo de los Estados Unidos."
 FRA_back_gaulism: "Gaullismo estratégico"
 FRA_back_gaulism_desc: "Francia debe tener una política exterior independiente de la voluntad de Washington. No debemos permitir que nadie se mezcle en nuestra política, y ciertamente no los Estados Unidos, que siempre ha tratado de forzarnos a someternos."
 FRA_social_gaulism: "Gaullismo social"
 FRA_social_gaulism_desc: "Ante el fin de la feliz globalización y la atracción del extremismo, debemos dirigir al pueblo francés hacia el camino de la razón. El Gaullismo Social rechaza tanto el capitalismo como el comunismo. Se trata de una intervención estatal para garantizar la independencia y seguridad del empleo. Con esta estabilidad, la gente no necesita todo este apoyo social."
 FRA_return_nation: "Regreso a la Nación"
 FRA_return_nation_desc: "Debemos alentar a las empresas francesas que operan en el extranjero a regresar a su país de origen, por cualquier medio necesario."
 FRA_anti_eu: "Campaña contra la UE"
 FRA_anti_eu_desc: "Ahora que el pueblo comienza a darse cuenta de que la Unión Europea ya no sirve a los intereses de sus fundadores, cuya identidad está tratando de erosionar, podemos intensificar nuestra campaña contra la Unión Europea. Debemos hacer que la gente entienda que la mayoría de sus problemas provienen de allí."
 FRA_anti_usa: "Hostilidad hacia Estados Unidos"
 FRA_anti_usa_desc: "Estados Unidos ve el regreso del Gaullism al poder con desfavor. Ellos tienen razón para estar preocupados; nuestro ascenso al poder rápidamente les hará claro que ya no somos sus aliados. Después de todo, es bien sabido que los Estados Unidos no tienen aliados; sobre todo, tiene intereses."
 FRA_RPF_death: "Repita la pena de muerte"
 FRA_RPF_death_desc: "La pena de muerte fue abolida hace décadas, contra los deseos de la mayoría del público francés. Desde entonces, los delincuentes de todas las rayas se han vuelto más audaces, confiando en que el estado nunca los castigará verdaderamente. Una nación soberana debe ser capaz de hacer cumplir sus propias leyes al máximo. Lo restauraremos."
 FRA_destroy_liberalism: "Destruir el liberalismo económico"
 FRA_destroy_liberalism_desc: "Durante demasiado tiempo, nuestra política económica ha estado dominada por un ultraliberalismo aborrecible. Nuestros ciudadanos han visto sus empleos y nuestra fuerza industrial desaparece uno tras otro. Incluso en su día, el General advirtió que el capitalismo, desde una perspectiva humana, era algo malo. Debemos regresar a la intervención estatal. Debemos restaurar el orden a nuestras finanzas públicas y a lo que queda de nuestra economía."
 FRA_campaign_frexit: "Campaña para Frexit"
 FRA_campaign_frexit_desc: "Los franceses finalmente se han dado cuenta de que la Unión Europea es una cosa mala; todo lo que queda es para nosotros darles los medios para ventilar su ira. Todo lo que tomará es una papeleta de votación en la urna para poner fin al desmantelamiento de Francia."
 FRA_rebalance_foreign_policy: "Reequilibrio Nuestra Política Exterior"
 FRA_rebalance_foreign_policy_desc: "Aunque hemos dejado claro nuestra intención de escapar de los Estados Unidos, nuestra clase política sigue infiltrada por su política, su forma de vida y sus corporaciones. Debemos enviar un mensaje fuerte a aquellos que puedan pensar que nuestra ruptura con los Estados Unidos no es genuina. Reestableceremos el diálogo con poderes que siempre se han opuesto a la hegemonía estadounidense."
 FRA_leave_nato: "Romper con la OTAN"
 FRA_leave_nato_desc: "Para salvaguardar nuestra independencia, debemos librarnos de una alianza que nunca hemos necesitado y que nos ha traído muy poco. Somos capaces de defender nuestros intereses por nuestra cuenta."
 FRA_frexit_ref: "Referéndum de Frexit"
 FRA_frexit_ref_desc: "Ha llegado el momento de salir de la Unión Europea de una vez por todas. Nuestro pueblo ha estado suficientemente preparado para rechazar a la Unión Europea por el bien."
 FRA_strategic_autonomy: "Garantizar la autonomía estratégica"
 FRA_strategic_autonomy_desc: "Hemos logrado restaurar la independencia de Francia; somos libres de hacer lo que queremos en este mundo. Francia es fuerte y libre, y estamos listos para defenderlo."
 FRA_strong_people: "La gente fuerte"
 FRA_strong_people_desc: "No más incentivos para la ociosidad; el capitalismo bajo control estatal. Hemos renovado el contrato social con nuestro pueblo. Ellos saben que los protegemos y que nos deben obediencia y buena voluntad."
 FRA_recover: "Reconstruir la economía"
 FRA_recover_desc: "A pesar de todos nuestros esfuerzos por prepararnos para nuestra salida de la Unión Europea, nuestra economía todavía ha tenido un éxito. Debemos reconstruirlo sobre bases sólidas antes de que podamos siquiera pensar en vengarnos de nuestros opresores."
 FRA_our_own_sphere: "Nuestra propia Esfera"
 FRA_our_own_sphere_desc: "No somos los únicos que hemos logrado librarnos del imperialismo estadounidense. Podemos encontrar aliados para forjar una alianza basada en el respeto mutuo entre poderes independientes."
 FRA_paid_reconnexion: "Bloqueo Europa"
 FRA_paid_reconnexion_desc: "Ahora que hemos salido con seguridad y éxito de la Unión Europea, podemos empezar a pensar en conseguir nuestra propia espalda. La Unión Europea y sus redes deben pasar por nuestro país. Esto nos presenta una tremenda oportunidad para tomar nuestra venganza."
 FRA_certain_idea: "A Cierta Idea de Francia"
 FRA_certain_idea_desc: "En pocos años, hemos logrado restaurar Francia a lo que debería ser: un gran poder orgulloso y libre. El General estaría orgulloso de haber restaurado su legado. Tenía razón: Francia sólo puede ser un gran poder; de lo contrario, no sería Francia."
 FRA_salvage_mondialisation: "Salvar a las víctimas de la globalización"
 FRA_salvage_mondialisation_desc: "Nuestra gente ha sufrido mucho como resultado de la globalización. Esto es particularmente cierto para la población trabajadora, que ha visto desaparecer sus empleos, su país se desmoronó y sus valores pisotearon bajo tierra. Debemos demostrarles que somos el lado que traerá cambio, que se atreverá a hacer las preguntas correctas y que tendrá una solución muy simple para estos problemas."
 FRA_raise_tariff: "C) Arancelarios"
 FRA_raise_tariff_desc: "El aumento de nuestros aranceles nos permitirá poner fin a la competencia injusta desde el extranjero y permitir que el público francés compre productos hechos en Francia."
 FRA_dynamise_periph: "Revitalice los Outskirts"
 FRA_dynamise_periph_desc: "Las zonas rurales y suburbanas siempre han sido descuidadas por las políticas de planificación. Están bajo inversión y a menudo son el hogar de una población que vive en circunstancias precarias pero llena de buena voluntad. Debemos ayudar a esta población a acceder a la misma infraestructura que la disponible en las principales ciudades."
 FRA_focus_insecurity: "Enfoque on Insecurity"
 FRA_focus_insecurity_desc: "La inmigración ha provocado un aumento significativo de la inseguridad en nuestro país. Debemos demostrar a la población que estamos tomando este problema muy seriamente aumentando la dotación de personal policial, implementando controles más estrictos y rompiendo con el crimen."
 FRA_eurosepticism: "Amenaza a la Unión Europea"
 FRA_eurosepticism_desc: "La Unión Europea siempre ha tratado de silenciar a países como los nuestros que se opusieron a sus políticas ultraglobaistas. Debemos hacerles comprender que las cosas deben cambiar y que podemos reiniciar el movimiento euroescéptico en Francia."
 FRA_sovergnism_policies: "Políticas soberanistas"
 FRA_sovergnism_policies_desc: "Francia debe ejercer un mayor control sobre su economía, su política exterior y, sobre todo, sus fronteras. Sin esto, nuestros esfuerzos por recuperar a nuestro país serán en vano. Debemos afirmar nuestra determinación de gobernar nuestro propio país."
 FRA_economical_patriotism: "Patriotismo Económico"
 FRA_economical_patriotism_desc: "Debemos instar a las empresas francesas que se han mudado al extranjero a regresar a Francia. Si se niegan, habrá consecuencias para sus operaciones comerciales en Francia."
 FRA_social_populism: "Populismo social"
 FRA_social_populism_desc: "Todo lo que necesitamos hacer es darle a la gente lo que están pidiendo y descifrar sobre aquellos que odian para asegurar nuestra base electoral y asegurarnos de que permanezcamos en el poder."
 FRA_criticize_eu_migrant: "Criticar la política europea de migración"
 FRA_criticize_eu_migrant_desc: "La Unión Europea no está haciendo lo suficiente para detener el flujo de migrantes y está obligando a los Estados miembros a tomarlos. Debemos ejercer presión para poner fin a esto."
 FRA_common_accord_eu: "Un trato con la UE"
 FRA_common_accord_eu_desc: "La Comisión Europea se ha dado cuenta de que no puede ignorarnos. Ahora debemos entender que al darnos lo que queremos, asegurará nuestro apoyo."
 FRA_reinforce_nuke: "Reforzar nuestra capacidad nuclear"
 FRA_reinforce_nuke_desc: "La energía nuclear ha demostrado su fiabilidad. ¿Por qué recurrir a otras fuentes de energía cuando tenemos esta experiencia a nuestra disposición? Debemos ampliar nuestra capacidad nuclear para hacer frente en caso de crisis."
 FRA_FN_death: "Repita la pena de muerte"
 FRA_FN_death_desc: "La pena de muerte fue abolida hace décadas, y el crimen violento sólo ha crecido más audaz desde entonces. Nuestros ciudadanos merecen sentirse seguros en su propio país de nuevo. Lo restauraremos, y los crímenes más duros llevarán de nuevo las consecuencias más duras."
 FRA_reject_immigration: "Rechazar la inmigración"
 FRA_reject_immigration_desc: "Ahora que tenemos un mejor control sobre nuestras fronteras, podemos implementar nuestra política de romper con la inmigración ilegal."
 FRA_pro_russian_fn: "Políticas pro-rusas"
 FRA_pro_russian_fn_desc: "La UE no dejará de ser ultraglobalista. Debemos acercarnos más a Rusia, que siempre ha logrado mantenerse distante de las perversiones de Occidente. Juntos, iremos lejos."
 FRA_oppose_lgbt_fn: "Final Wokeism"
 FRA_oppose_lgbt_fn_desc: "A algunas personas no se les debe permitir entrar en nuestro país. Pongamos fin a esta tontería y centrémonos en restaurar el orden basado en el único modelo adecuado de la familia."
 FRA_end_right_soil: "Fin de la derecha del suelo"
 FRA_end_right_soil_desc: "Nacer en Francia no debe ser suficiente para que una persona sea francesa. Debemos poner fin al principio de jus soli; merecemos elegir quién puede ser ciudadano francés."
 FRA_support_rus_claim: "Apoyo a la reclamación rusa"
 FRA_support_rus_claim_desc: "Rusia tiene todo derecho a sentirse amenazada por la expansión de la OTAN. Debemos demostrar nuestra voluntad de ayudarlos a reparar las injusticias que han sufrido."
 FRA_electoral_reform: "Reforma electoral"
 FRA_electoral_reform_desc: "Las elecciones en Francia se están impugnando cada vez más por motivos del sistema electoral y la representatividad de los partidos. Podemos implementar estas reformas asegurando que trabajen a nuestra ventaja para que podamos permanecer en el poder."
 FRA_our_identity: "Nuestra identidad"
 FRA_our_identity_desc: "Es difícil ser nacionalista dentro de una entidad como Europa. Hemos abandonado la idea de dejarla, así que debemos forjar una nueva identidad adecuada a nuestro lugar dentro de la Unión Europea pero que no pretende diluirnos entre la fuerza laboral extranjera."
 FRA_boreal_space: "Nuestro Stance con Rusia"
 FRA_boreal_space_desc: "Hemos demostrado nuestro deseo de trabajar con Rusia, y nuestros esfuerzos no han pasado desapercibidos. Ahora es el momento de decidir lo que queremos de Rusia; es hora de llegar a ellos."
 FRA_long_travel: "France Prevails"
 FRA_long_travel_desc: "En los últimos años en el cargo, hemos demostrado al pueblo francés que, con determinación, los problemas de un país pueden resolverse muy fácilmente. Hemos hecho que Francia sea mayor y menos dependiente de nuestros vecinos y de las corrientes migratorias, que hemos logrado frenar."
 FRA_sound_fury: "El sonido y la furia"
 FRA_sound_fury_desc: "Los franceses ya no quieren apaciguar; los moderados los han decepcionado y nunca han provocado ningún cambio real. Somos el partido del cambio; debemos mostrar al pueblo francés que estamos decididos a desafiar el orden establecido."
 FRA_silent_france: "Mobilise los no voladores"
 FRA_silent_france_desc: "Muchos ciudadanos han perdido la fe en nuestra República y sus instituciones. Debemos alentarlos a que regresen a las encuestas para producir un cambio real."
 FRA_end_privatisation: "Privatización final"
 FRA_end_privatisation_desc: "Muchas empresas han seguido reubicando sus sitios de producción lejos de Francia para aumentar la rentabilidad. Esto está impulsando el desempleo y causando que perdamos nuestra experiencia. Debemos poner fin a esta hemorragia recuperando el control sobre estas empresas si es necesario."
 FRA_pro_lgbt_lfi: "Promover la acción afirmativa"
 FRA_pro_lgbt_lfi_desc: "Debemos poner fin a la discriminación que las personas que se desvían de lo que se considera erróneamente la norma han sido sometidas durante demasiado tiempo. Nuestra sociedad debe aprender a aceptar todas las diferencias."
 FRA_toward_6th_rep: "Hacia una sexta República"
 FRA_toward_6th_rep_desc: "Ahora podemos comenzar la parte más importante del mandato que nos ha confiado el pueblo. Prometimos cambiar, y lo tendrán. Ha llegado el momento de formar una nueva República que se adapte a todos."
 FRA_distance_nato_lfi: "Rechazar la política de Bloc"
 FRA_distance_nato_lfi_desc: "La OTAN nos vincula con las guerras de Washington tan seguro como una alianza con Moscú nos atará a sí misma. Rechazamos ambos bloques por igual; la verdadera no alineación es la única política exterior digna de una Francia independiente."
 FRA_oppose_eu_treaty: "Oppose el Tratado de la UE"
 FRA_oppose_eu_treaty_desc: "Se han impuesto tratados injustificados a nuestros ciudadanos. No tenemos la obligación de acatarlos. Para cambiar esta Europa injusta, debemos empezar desafiando su marco legislativo."
 FRA_guarante_employment: "Garantía de empleo"
 FRA_guarante_employment_desc: "Nuestro país está lleno de personas talentosas que no pueden cumplir su potencial debido a la falta de empleos causada por la crisis. Debemos garantizar a todos un trabajo estable y decente; esto debe constituir la base de cualquier contrato social."
 FRA_state_power: "El poder del Estado"
 FRA_state_power_desc: "Las instituciones de la Quinta República están demasiado centradas en el cargo del Presidente de la República. Debemos alentar el debate público para que la gente pueda decidir cómo es nuestra nueva República."
 FRA_democracy: "Libertades individuales"
 FRA_democracy_desc: "Las numerosas crisis que nuestro país ha enfrentado han planteado preguntas prácticas sobre la seguridad de nuestra población. La vigilancia es necesaria para proteger a nuestros ciudadanos, pero ¿hasta dónde puede llegar el estado? Deberíamos permitir que nuestros ciudadanos tengan derecho a tener su opinión."
 FRA_foreign_recognition_lfi: "Reset Nuestras Políticas Extranjeras"
 FRA_foreign_recognition_lfi_desc: "Por mucho tiempo, nuestro país ha pronosticado dictaduras y se ha negado a reconocer la existencia de estados soberanos. Debemos poner fin a esto."
 FRA_oppose_eu_immigration_lfi: "Pregunta Estancia de la UE sobre inmigración"
 FRA_oppose_eu_immigration_lfi_desc: "La Unión Europea se está volviendo cada vez más indulgente con los populistas de extrema derecha. No está haciendo lo suficiente para ayudar a nuestros vecinos necesitados y los ve meramente como una fuente de trabajo barato. Debemos distanciarnos de este enfoque y proponer una política más humana."
 FRA_economic_question: "La dirección de la economía"
 FRA_economic_question_desc: "El presupuesto nacional y su gestión son cuestiones importantes en las que todo lo demás depende. Nuestros ciudadanos también deben tener su opinión sobre este asunto."
 FRA_ho_topic: "Deconstructing French Peculiarities"
 FRA_ho_topic_desc: "Muchas leyes y costumbres inherentes a la cultura francesa no facilitan la integración de otras culturas. Debemos pedir a los ciudadanos que examinen la cuestión de la integración de las minorías."
 FRA_balance_tax: "Saldo de impuestos"
 FRA_balance_tax_desc: "Es inaceptable que la clase media y las personas en circunstancias precarias sean secas por impuestos mientras los ricos no pagan su parte justa. Debemos restaurar el equilibrio."
 FRA_climate_war_eco: "El desafío de nuestro milenio"
 FRA_climate_war_eco_desc: "El medio ambiente y el clima se están deteriorando a un ritmo rápido. Debemos proteger lo que queda de nuestra biodiversidad y preparar nuestra sociedad para tiempos difíciles por delante."
 FRA_dawn_6th_rep: "Alba de la 6.ª República"
 FRA_dawn_6th_rep_desc: "Nuestra labor en la Sexta República está completa. Sea cual sea el resultado, nuestro trabajo se hace. Probablemente hemos hecho nuestra marca en la historia."
 FRA_creolisation: "Creolisation"
 FRA_creolisation_desc: "Los siglos de intercambio cultural que nuestro país ha presenciado han conformado una nueva cultura. Sin embargo, esta cultura es negada por muchos; debemos hacer que nuestros ciudadanos entiendan que el futuro reside en vivir juntos. Todavía tenemos mucho que aprender del mundo."
 FRA_work_less: "Trabajar menos trabajo"
 FRA_work_less_desc: "Nuestros predecesores estaban decididos a hacer que los franceses trabajaran más y más horas en condiciones cada vez más pobres. Debemos revertir esta tendencia y ayudar a nuestros ciudadanos a disfrutar de su trabajo más. Entonces serán más creativos y entusiastas sobre su trabajo."
 FRA_reform_police: "Reforma de la Policía Francesa"
 FRA_reform_police_desc: "Durante demasiado tiempo, la policía ha sido usada como herramienta para una represión injusta contra nuestros ciudadanos. Debemos implementar las reformas necesarias para aliviar la presión sobre nuestros ciudadanos, asegurando al mismo tiempo la seguridad de todos."
 FRA_post_empire: "Descolonizar nuestra política internacional"
 FRA_post_empire_desc: "Nuestro pasado colonial ha causado mucho daño a nuestras antiguas colonias. Muchos de ellos todavía están luchando para recuperarse. Debemos apoyar sus esfuerzos de reconstrucción y dejar de intentar dominarlos."
 FRA_push_social_green_eu: "Defianza de propagación en Europa"
 FRA_push_social_green_eu_desc: "Hemos logrado mucho en Francia, pero también debemos alentar a nuestros socios europeos a seguir el mismo camino. Podemos reunir a su pueblo para presionar a sus gobiernos para que no seamos los únicos que promueven el progreso en Europa."
 FRA_social_green_fair_rep: "L'Insoumission"
 FRA_social_green_fair_rep_desc: "En pocos años, hemos logrado tanto. Hemos dirigido a Francia lejos del liberalismo económico, la precariedad y hemos creado una Francia más humanista. Pero nunca dejaremos de desafiar el orden establecido, ya sea en casa o en el resto del mundo."
 FRA_no_time: "No tenemos tiempo"
 FRA_no_time_desc: "Los científicos han estado advirtiendo sobre los efectos devastadores del cambio climático durante décadas. Lo que predijeron ahora está llegando a pasar: eventos meteorológicos cada vez más extremos. La gente necesita despertarse si quieren que la próxima generación tenga una oportunidad de vivir."
 FRA_strong_eu: "La fuerza de la UE"
 FRA_strong_eu_desc: "Francia no puede obligar al mundo a tomar en serio el cambio climático. Por otra parte, la Unión Europea puede servir de modelo para el resto del mundo."
 FRA_ecology_available: "Hacer ecología disponible"
 FRA_ecology_available_desc: "Durante demasiado tiempo, la ecología ha sido considerada un privilegio reservado para los ricos. Debemos seguir promoviendolo como una forma de ahorrar dinero y prevenir tragedias para todos."
 FRA_right_vote: "Más amplio Derecho a votar"
 FRA_right_vote_desc: "La preocupación por el medio ambiente y su futuro no debe tener que esperar hasta los dieciocho años. Debemos ampliar el derecho de voto a un sector más amplio de la población."
 FRA_question_growth: "Cuestión del crecimiento económico"
 FRA_question_growth_desc: "Durante decenios, se ha llevado a las personas a creer que la mejor manera de ayudar al medio ambiente es mediante el desarrollo sostenible. ¿Pero por qué siempre debemos desarrollar y crecer? El planeta y sus recursos tienen sus límites. Deberíamos estar avanzando hacia una desaceleración del crecimiento."
 FRA_cooperate_eu: "Cooperar con socios de la UE"
 FRA_cooperate_eu_desc: "No todos nuestros socios europeos tienen necesariamente los mismos recursos o el mismo compromiso de transformar sus economías para hacer frente al cambio climático. Podemos ayudar a nuestros socios clave a lograr esto invirtiendo en infraestructura verde en sus países."
 FRA_push_eco_eu: "Promover un futuro verde"
 FRA_push_eco_eu_desc: "Nuestros socios europeos no están haciendo tanto como nosotros para hacer frente al cambio climático. Podemos alentar a sus poblaciones a tomar medidas instando a sus activistas ambientales a que tomen acción y sigan el ejemplo de Francia."
 FRA_question_agriculture: "A Agricultura Sostenible"
 FRA_question_agriculture_desc: "La agricultura en Francia ha avanzado hacia la producción de masas para satisfacer las necesidades del siglo pasado. En términos ambientales, es más responsable que muchas otras formas de agricultura, pero todavía hay margen para mejorar. Además de las normas europeas, debemos alentar a los agricultores a cambiar sus métodos en favor de una producción responsable y de alta calidad. Nos aseguraremos de que sus productos sean promovidos y que esto resulte provechoso para ellos."
 FRA_cooperation_no_compet: "Cooperación No Competencia"
 FRA_cooperation_no_compet_desc: "El modelo de éxito social en nuestro país y en todo el mundo se basa en el éxito individual y la muestra de su riqueza. Este comportamiento es perjudicial para nuestro planeta, ya que fomenta el consumo excesivo y la competencia tóxica entre los ciudadanos. Para reducir el impacto de nuestras sociedades en el planeta, debemos desafiar estos modelos sociales."
 FRA_nuke_choice: "Diversificar nuestra mezcla de energía"
 FRA_nuke_choice_desc: "Durante décadas, la energía en Francia ha sido generada por decenas de reactores nucleares. Si bien esta tecnología puede ser fiable y relativamente segura a corto plazo, produce desechos que no podemos eliminar. Por lo tanto, no es la fuente ideal de energía para un futuro sostenible. Debemos diversificar nuestro suministro de energía invirtiendo más en energía renovable."
 FRA_green_eu: "Hacia una UE más verde"
 FRA_green_eu_desc: "Nuestro éxito, tanto en el país como en el extranjero, en la lucha contra el cambio climático sirve de modelo para otros países de la Unión Europea. Podemos estar orgullosos de eso."
 FRA_eco_life: "Ecológica Camino de la Vida"
 FRA_eco_life_desc: "La adopción de métodos de producción más sostenibles no será suficiente por sí sola. Debemos alentar a nuestros ciudadanos a consumir menos. Esto implica frenar la publicidad omnipresente y promover la moderación. No necesitamos todo esto; podemos estar contentos con menos."
 FRA_upgrade_transport: "Actualizar nuestra red de transporte"
 FRA_upgrade_transport_desc: "Nuestra red de transporte puede ser eficiente, pero es muy desigual y obliga a las personas en áreas exteriores a viajar utilizando medios de transporte más caros y contaminantes. Debemos hacer que una alternativa sea accesible en todas las regiones, lo que significa mejorar las conexiones con las zonas más alejadas en lugar de seguir desarrollando una red cada vez más rápida que une sólo algunas ciudades europeas."
 FRA_dynamise_research: "Investigación de Dynamise"
 FRA_dynamise_research_desc: "Debemos continuar desarrollando la investigación; nunca dejaremos de encontrar formas de hacer más con menos y desarrollar energía renovable."
 FRA_help_transi: "Ayudar a una transición europea"
 FRA_help_transi_desc: "Nuestros socios europeos están empezando a darse cuenta de que el cambio climático es una cuestión seria que los afectará cada vez más. Sin embargo, algunos todavía no han alcanzado la etapa de desarrollo necesaria para poder invertir en este sector. Podemos ayudarlos a hacerlo mediante la creación de un fondo conjunto entre nuestros países dedicado a la transición hacia una economía con bajas emisiones de carbono."
 FRA_end_fossile: "Combustible Fósil final"
 FRA_end_fossile_desc: "Ahora que la importancia de la transición verde es más ampliamente reconocida dentro de la Unión Europea, podemos intensificar nuestros esfuerzos. Podemos proponer a nuestros socios que avancemos hacia la eliminación de combustibles fósiles."
 FRA_opti_indus: "Optimizar nuestras industrias"
 FRA_opti_indus_desc: "Necesitamos que los líderes de las grandes empresas entiendan que la aplicación de medidas ambientales genuinas sería su interés superior. Ellos también podrían hacer más utilizando menos recursos. Debemos, sin embargo, tener cuidado de que esto no les anima a producir aún más."
 FRA_promote_local: "Promover el Consumo Local"
 FRA_promote_local_desc: "Ahora que tenemos una industria más responsable, debemos asegurarnos de que nuestros ciudadanos puedan realmente pagar sus productos. Sin embargo, las fuerzas del mercado favorecen la producción de bajo costo. Por lo tanto, debemos asegurarnos de que los productos de nuestras propias industrias estén más fácilmente disponibles que los del otro lado del mundo. Esto nos exigirá doblar las reglas del libre comercio. Pero deberíamos ser capaces de manejarlo."
 FRA_subsidies_green: "Subvenciona industrias verdes"
 FRA_subsidies_green_desc: "Alentar a las empresas a hacer cambios ecológicos no hará que todo el mundo esté a bordo. Necesitamos proporcionar los recursos necesarios y ofrecer subvenciones a las empresas basadas en su compromiso con el planeta y su eficiencia. Esta vez, no habrá lavado verde."
 FRA_pressure_supply: "Cadenas de suministro de presión"
 FRA_pressure_supply_desc: "Es un hecho que nuestro país no puede producir todas las materias primas que necesita internamente. La Unión Europea importa una gran cantidad de recursos de países que tienen normas ambientales laxas. Es inaceptable que importemos recursos que no cumplan con nuestros criterios de producción. De lo contrario, ¿cuál es el punto de tener regulaciones? Debemos unir fuerzas con otras potencias europeas para presionar a estos países exportadores para que produzcan cambios."
 FRA_reduce_extraction: "Reducir la extracción de recursos"
 FRA_reduce_extraction_desc: "La extracción de minerales y aceite es un proceso contaminante que a menudo excede la capacidad de nuestro planeta para regenerarlos. Aunque no nos sentamos en un campo petrolífero, debemos dar ejemplo al resto del mundo mediante la introducción de normas más estrictas que rigen la extracción de minerales y combustibles."
 FRA_power_rail: "Ampliar EU-Rail"
 FRA_power_rail_desc: "La Unión Europea ya tiene una extensa red ferroviaria, pero podemos hacerlo aún mejor. Demasiado flete todavía es transportado por lorry; debemos reducir esto."
 FRA_altermondialism: "Promover el altermondialismo"
 FRA_altermondialism_desc: "El hecho de que la globalización haya dejado de beneficiar al público no es una sorpresa para nadie. Pero debemos alejar al público del movimiento antiglobalizador. Estas tendencias son peligrosas porque enfrentan la globalización contra una solución nacionalista que a menudo es agresiva. Debemos demostrarles que el principal enemigo es el capitalismo."
 FRA_unite_struggle: "Convergencia de Luchas"
 FRA_unite_struggle_desc: "Debemos unir a todos los oprimidos, ya sea por su género, religión, color de piel o cualquier otra característica. Son todas víctimas del capitalismo y sus consecuencias sociales. Debemos demostrarles que todos sus problemas tienen una causa y una solución."
 FRA_retake_past: "Ganando a los trabajadores"
 FRA_retake_past_desc: "Tras el colapso de la URSS y el fin de la «feliz globalización», una gran proporción de nuestro antiguo electorado de clase obrera se convirtió en populistas de extrema derecha o, en su mayoría, dejó de votar por completo. Hoy hemos conseguido ganar las elecciones, pero para asegurar nuestra supervivencia a largo plazo debemos reconstruir nuestra base de clase obrera, que es el ADN mismo de nuestro partido. Para ello, debemos tomar en serio sus demandas, empezando por traer de vuelta los trabajos que nuestros predecesores liberales enviaron a China."
 FRA_turn_reform: "Reforma más que revolución"
 FRA_turn_reform_desc: "Ahora que hemos regresado al dominio de estas instituciones, ya no tenemos que considerar la posibilidad de tomar medidas para desafiar al Estado, como ahora somos parte de ello. Seremos capaces de reformar la sociedad desde dentro, dejando a un lado los ideales revolucionarios."
 FRA_leave_nato_PCF: "Romper con el imperialismo americano"
 FRA_leave_nato_PCF_desc: "La OTAN es un instrumento del imperialismo estadounidense y el vehículo de su dominación sobre Europa. Debemos romper con ella y apoyarnos en solidaridad con todos los pueblos que resisten la hegemonía de Washington."
 FRA_renogociate_treaty: "Renegociar el Tratado de la UE"
 FRA_renogociate_treaty_desc: "Nuestro pueblo se ha visto obligado a aceptar tratados europeos que, sin embargo, se habían opuesto. Para llevar a cabo nuestro programa, debemos modificar el marco legislativo que nos ha impuesto la Unión Europea. Sin duda habrá una lucha de poder con las instituciones y sanciones europeas, pero no tenemos otra opción si realmente deseamos actuar en interés del pueblo francés."
 FRA_undo_lib_PCF: "Cerrar la Parenthesis Liberal"
 FRA_undo_lib_PCF_desc: "Desde el mandato del Presidente Mitterrand, los franceses han tenido que soportar políticas liberales tanto de izquierda como de derecha. Es hora de poner fin a esto y mostrar que somos diferentes. Que estamos decididos a luchar contra el capitalismo, incluso si significa entrar en conflicto con la OMC o la Unión Europea."
 FRA_protect_indus_pcf: "Protege nuestra industria"
 FRA_protect_indus_pcf_desc: "No es suficiente simplemente invertir en industrias de Francia; debemos evitar que se reubiquen a lugares donde el trabajo es más barato y donde hay menos regulaciones. Esto es una cuestión de salvaguardar nuestra soberanía sobre nuestros medios de producción y garantizar empleos dignos y condiciones de vida para nuestros trabajadores."
 FRA_left_front: "Ampliar la Coalición"
 FRA_left_front_desc: "Nuestro gobierno está en su lugar pero no es muy estable, carecemos de aliados. Tal vez deberíamos buscar aliados entre los otros partidos radicales de izquierda. No han acordado unirse a nuestro gobierno, pero tal vez podríamos persuadirlos para que lo hagan. Podríamos ofrecerles algunos puestos ministeriales a cambio de su apoyo."
 FRA_deal_devil_pcf: "Un trato con los socialistas"
 FRA_deal_devil_pcf_desc: "Los otros partidos radicales de izquierda no serán suficientes para asegurar la estabilidad que esperamos. Tal vez podríamos encontrar un terreno común con el Partido Socialista. Después de todo, salir de Europa nunca ha sido parte de nuestros planes. Seguramente podemos encontrar un terreno común con ellos para asegurarlos en nuestra coalición."
 FRA_tie_moscow: "Tie con Moscú"
 FRA_tie_moscow_desc: "A lo largo de la Guerra Fría e incluso después, nuestro partido siempre se ha aliado con Moscú. Aunque la era de la URSS ha terminado, parecería que las actuales autoridades rusas están a favor de los ideales comunistas. Desde nuestra partida, hemos estado bajo amenaza de nuestros antiguos aliados. Un aliado ruso sería un sueño hecho realidad; podríamos establecer la cooperación económica."
 FRA_eu_communism_PCF: "Promover el Eurocomunismo"
 FRA_eu_communism_PCF_desc: "La URSS no es ahora nada más que un recuerdo lejano, y hoy debemos manejar sin ella en un mundo donde Rusia, nuestro antiguo modelo, vacila entre la oligarquía y el ultranacionalismo. El comunismo y la Unión Europea no son incompatibles; otros países europeos no son hostiles a él. Podemos permanecer en Europa y hacer todo lo posible para alejarlo del capitalismo y el fascismo."
 FRA_retake_sovereign: "Reclame nuestra soberanía"
 FRA_retake_sovereign_desc: "Ahora que hemos recuperado el control de nuestro aparato de producción, tenemos los medios para ir más allá. Debemos librarnos de la influencia extranjera ahora que tenemos los medios para actuar independientemente."
 FRA_empower_union_PCF: "Promover los Sindicatos"
 FRA_empower_union_PCF_desc: "A pesar de su antiguo poder, los sindicatos ya no tienen mucho peso hoy en día. Esto se debe a que las autoridades los han debilitado deliberadamente dividiendo a la clase obrera y socavando la seguridad laboral. Sin embargo, tener una fuerza capaz de ponerse a disposición de los empleadores es esencial en nuestro país. No podemos estar en todas partes a la vez; la clase obrera debe tomar el control de su futuro. Debemos ayudarlos a recuperar su legitimidad ante los ojos de la clase obrera."
 FRA_green_communism: "Llegar a los Verdes"
 FRA_green_communism_desc: "La humanidad no es la única víctima del capitalismo; nuestro planeta también está en peligro debido a la conducta imprudente de la humanidad. Podemos encontrar un terreno común con los Verdes; pueden ayudarnos a diseñar nuestro programa ecológico, que también necesitaremos."
 FRA_no_russian_claim: "La amenaza rusa"
 FRA_no_russian_claim_desc: "Es muy probable que, tarde o temprano, la Unión Europea se encuentre en conflicto con Rusia. Como es probable que Rusia ponga sus puntos de vista en los territorios ucranianos y bálticos, debemos comenzar por llegar a los ucranianos para ofrecerles nuestra asistencia."
 FRA_green_turn: "Comunismo Verde"
 FRA_green_turn_desc: "En colaboración con nuestros aliados verdes, hemos elaborado un programa ambiental que nos permitirá preparar a Francia para los retos planteados por el cambio climático. Esto requerirá un gran esfuerzo por nuestra parte para reconstruir nuestros medios de producción y limitar su huella de carbono. Pero debemos hacerlo; la clase obrera también tiene hijos que deben ser capaces de crecer en un mundo habitable."
 FRA_favor_lgbt: "La Discriminación"
 FRA_favor_lgbt_desc: "Ahora que hemos asegurado los medios básicos de subsistencia para nuestra población al proporcionarles empleos y un futuro, también debemos abordar la discriminación dentro de las clases sociales. Debemos recordar a nuestro pueblo que la discriminación por cualquier motivo es inaceptable. Nuestra sociedad debe aprender a aceptar todas las diferencias."
 FRA_dna_restored: "ADN Restaurado"
 FRA_dna_restored_desc: "Con nuestra coalición asegurada, podemos centrarnos en restaurar la clase obrera a la prominencia. Al introducir amplias leyes de protección del empleo, deberíamos poder recuperar nuestra base electoral. Esto no va a complacer a la comunidad empresarial, pero eso nunca ha sido nuestro objetivo."
 FRA_condemn_rus: "Proteger Europa del Este"
 FRA_condemn_rus_desc: "La agresión rusa no puede detenerse en Ucrania. Para proteger nuestra Europa emergente, debemos asegurarnos de que los países de Europa oriental y septentrional puedan resistir una posible invasión rusa."
 FRA_by_ourself: "Triumph of Reformism"
 FRA_by_ourself_desc: "Al construir una coalición fuerte, hemos establecido las bases para que Francia siga siendo una nación de izquierda. Hemos restablecido la confianza del electorado en la izquierda y sus instituciones. Sin descartar el pasado, mientras estemos aquí, nunca dejaremos de luchar contra el capitalismo y el fascismo, tanto en Europa como en todo el mundo."
 FRA_friend_of_past_pcf: "Hacia un nuevo Comintern"
 FRA_friend_of_past_pcf_desc: "El gobierno comunista ruso también parece estar suficientemente consolidado. Podríamos proponerles que amplíemos nuestra cooperación. Es hora de restaurar el comunismo a su antigua gloria. Los capitalistas y fascistas deben aprender a temernos una vez más."
 FRA_struggle_end: "La lucha es sólo el comienzo"
 FRA_struggle_end_desc: "Durante estos pocos años en el cargo, hemos puesto al comunismo de nuevo en el mapa político. Hemos reconectado con nuestro electorado y hemos asegurado un futuro para las generaciones venideras. Sin embargo, estamos lejos de terminar. Siempre habrá más desafíos que afrontar. Pero al menos hemos asegurado que la izquierda ya no será el caballo troyano del neoliberalismo."
 FRA_new_18th_brumaire: "Un nuevo 18 Brumaire"
 FRA_new_18th_brumaire_desc: "Los bonapartistas hemos asegurado las oficinas más altas de la República. La oposición republicana ha sido silenciada, y nosotros solos somos capaces de dirigir este país. Nuestros enemigos son legión, pero nada se mantendrá entre Francia y su destino."
 FRA_revolution_bonapart: "El legado revolucionario"
 FRA_revolution_bonapart_desc: "Napoleón I y el Imperio Francés son los herederos directos de la Revolución Francesa. Como el pueblo francés está profundamente apegado a estos valores, debemos demostrarles que nuestro Imperio no es una restauración. Nuestro Imperio es el heraldo de una nueva revolución."
 FRA_despotism: "Despotismo más que desorden"
 FRA_despotism_desc: "El malestar de los últimos meses ha causado considerable preocupación entre nuestro pueblo y en los mercados financieros. Debemos asegurarles que, mientras estemos en el poder, no se tolerará ningún desorden."
 FRA_napoleon_constitution: "La Constitución Napoleónica"
 FRA_napoleon_constitution_desc: "Las instituciones de la ex República ya no están aptas para el presente día ni para nuestra autoridad. Debemos reorganizarlos para crear un estado que sea más fuerte que nunca."
 FRA_reform_military_napoleon: "El nuevo Gran Armée"
 FRA_reform_military_napoleon_desc: "Nuestras fuerzas armadas son más que adecuadas para un país como el nuestro. Pero no son capaces de sostener un conflicto prolongado contra múltiples poderes extranjeros. Debemos empezar desde cero y construir un ejército que nadie puede derrotar."
 FRA_question_eu: "Europa o el Imperio"
 FRA_question_eu_desc: "Como nuestro país es miembro fundador de la Unión Europea, está profundamente integrado en ella, y romper no sería una tarea fácil. Excepto que tenemos la intención, de hecho, de luchar contra otros poderes europeos. ¿Deberíamos reunirnos con las instituciones de la Unión Europea, como el nuevo gobierno francés, o deberíamos seguir adelante y dejarlo para siempre? En cualquier caso, seremos forzados a luchar contra ellos."
 FRA_centralised_admin: "Centralismo administrativo"
 FRA_centralised_admin_desc: "La descentralización fue un error para nuestro país. Lo que necesitamos es una clara cadena de mando y una estructura organizativa vertical."
 FRA_blame_ennemy: "Retórica agresiva"
 FRA_blame_ennemy_desc: "Nuestro Imperio naciente está rodeado por sus futuros enemigos. Tarde o temprano seremos forzados a luchar contra ellos, pero nuestra sociedad no está lista para librar guerra contra nuestros antiguos aliados. Los hemos llevado lejos al hablarles de un futuro pacífico; tarde o temprano serán devueltos a la realidad. Para ello, podemos prepararlos socavando su confianza en nuestros antiguos socios y haciéndoles darse cuenta de que estamos solos contra todos los demás."
 FRA_proclaim_empire: "Una proclamación imperial"
 FRA_proclaim_empire_desc: "En un corto espacio de tiempo, hemos logrado consolidar nuestro poder y crear las condiciones para el regreso de Francia al escenario internacional. Ahora es el momento de dejar caer los pretencios. Proclamaremos el regreso del Imperio Francés tras un desfile que demuestre toda nuestra capacidad militar. Una demostración de fuerza, una advertencia, el amanecer de una nueva era para Francia. Después de eso, veremos las cosas claramente: los posibles aliados vendrán a nosotros y nuestros adversarios se revelarán."
 FRA_la_grande_armee: "La columna vertebral de nuestro ejército"
 FRA_la_grande_armee_desc: "Habiendo reformado nuestra cadena de mando, ahora podemos centrar nuestra atención en reformas más específicas de nuestra estructura militar. Para empezar, podemos centrarnos en nuestra doctrina ofensiva en términos de los recursos reales disponibles para llevar a cabo nuestras operaciones."
 FRA_europe_nationalism: "Fortalecimiento del Nacionalismo Europeo"
 FRA_europe_nationalism_desc: "Pocas naciones europeas nos han prometido su apoyo. Ellos ven el regreso de una Francia liderada por un partido nacionalista con desfavor. Su postura es un error; deben saber que es mejor estar con nosotros que contra nosotros. Vamos a hacer que paguen por su inacción. Vamos a prestar nuestro apoyo a los grupos nacionalistas en sus países. Eso debería causar un viejo desastre de vuelta a casa, y si vienen al poder, habremos ganado un aliado."
 FRA_plebiscites: "Regla de Plebiscite"
 FRA_plebiscites_desc: "El fin de la República no significaba que se dejara al pueblo sin medios para hacer oír sus opiniones. Debemos demostrar a la gente que todavía tienen una palabra al invitarlos a decidir sobre diversos asuntos de nuestra política. El Emperador no tendrá problemas para convencerlos, y esta democracia simulada será suficiente para la mayoría."
 FRA_firepower: "El poder de fuego moderno"
 FRA_firepower_desc: "Durante las guerras napoleónicas, el Grande Armée se benefició de una serie de innovaciones que le permitieron desencadenar un poder de fuego sin precedentes en las fuerzas contrarrevolucionarias. Hoy, las reglas de bombardeo han cambiado significativamente con el advenimiento de aviones de ataque y drones en el campo de batalla. Nuestro país es afortunado de sobresalir tanto en la artillería como en la aviación. Por lo tanto, debemos decidir qué priorizar para agilizar nuestra producción de apoyo al campo de batalla."
 FRA_8th_coalition: "Rodeado de enemigos"
 FRA_8th_coalition_desc: "Al igual que en los días de las Guerras Napoleónicas, un juego político está claramente tomando forma. Nuestros enemigos nos temen y están esperando la primera señal de debilidad para unir fuerzas contra nosotros. No les concederemos esa satisfacción. Nuestras fronteras se mantendrán militarizadas durante todo el tiempo que sea necesario. El Imperio Francés sólo sobrevivirá confrontando a sus adversarios; la diferencia del pasado es que esta vez la coalición no tendrá tiempo para formar, porque los aplastaremos uno por uno."
 FRA_renew_meritocracy: "El Imperio Meritocrático"
 FRA_renew_meritocracy_desc: "Aunque se sabía que tenía sus defectos, el Primer Imperio debía su éxito a su preferencia por la experiencia y profesionalidad sobre la clase social. Hoy debemos renovar esta promesa de progreso social para el pueblo francés. Deben entender que al trabajar duro para el Imperio y para Francia, pueden elevarse más alto de lo que antes tenían."
 FRA_last_deluge: "Más fuerte que nunca"
 FRA_last_deluge_desc: "Hemos llevado a cabo reformas de gran alcance en nuestra cadena de mando, nuestras doctrinas y nuestras cadenas de suministro. Ahora todo lo que queda es para nosotros abrir las puertas de nuestro ejército al reclutamiento masivo. La conscripción no ha sido una realidad durante mucho tiempo, pero los franceses están listos para luchar por su Imperio. El Grande Armée estará listo para conquistar Europa."
 FRA_ennemy_isolate: "Infiltrar a nuestros oponentes"
 FRA_ennemy_isolate_desc: "Tenemos los medios para infiltrar los sistemas de defensa civil de nuestros adversarios y golpearlos donde duele. Esto proporcionará una excelente formación para nuestros servicios de inteligencia, pero también corre el riesgo de que sean cuidadosos con nosotros."
 FRA_history_allies: "Los aliados del Imperio"
 FRA_history_allies_desc: "Aunque estamos rodeados de enemigos, no estamos solos; muchos países todavía mantienen relaciones amistosas con nosotros y podrían estar interesados en unirse a nuestra alianza. Podríamos destacar nuestra historia compartida con ellos para justificar una futura alianza. Podemos ofrecerles beneficios significativos, y ellos serán de gran ayuda para nosotros."
 FRA_imperial_pride: "Orgullo imperial"
 FRA_imperial_pride_desc: "Los franceses han recuperado su orgullo. Les hemos mostrado que la paz y la República no eran más que ilusiones, y que el futuro de Francia radica en convertirse en un Imperio. Están orgullosos de su país y odian a nuestros adversarios. Nuestra sociedad y nuestra economía están orientadas hacia un conflicto prolongado."
 FRA_declare_hostile: "Pruebe a sus defensas"
 FRA_declare_hostile_desc: "Ya no tenemos ninguna razón para ocultar nuestras ambiciones expansionistas de nuestros futuros enemigos. Es hora de mostrar a su gente que tienen todas las razones para temernos y someterse sin hacer un escándalo."
 FRA_our_own_system: "Nuestro propio sistema"
 FRA_our_own_system_desc: "Cada imperio tiene su propia alianza, y tratar de triunfar solo sería costoso. Varios países ya han expresado su voluntad de formar una alianza con nosotros. Es hora de formalizar esta cooperación creando una fuerte alianza entre socios que se respetan unos a otros."
 FRA_reclaim_empire: "Reclama el Imperio"
 FRA_reclaim_empire_desc: "Ha llegado el momento de recuperar nuestro Imperio. Hemos pasado años preparando nuestra sociedad, nuestra economía y nuestro ejército. Es hora de que esta obra dé fruto y para que Francia recupere su lugar legítimo en el orden mundial."
 FRA_french_commune: "La Revolución Victoriosa"
 FRA_french_commune_desc: "Hemos logrado controlar las instituciones de los comunistas moderados y otras fuerzas débiles o títeres del capitalismo. Al aceptar nuestro ascenso al poder, el pueblo francés confía en nosotros. Ellos también creen que el capitalismo puede ser derrotado, y eso es lo que tenemos la intención de hacer. Reconstruiremos nuestra sociedad y prepararemos para un enfrentamiento con las fuerzas capitalistas."
 FRA_purge_military: "Asegurar al personal general"
 FRA_purge_military_desc: "Aunque hemos logrado controlar las instituciones, el ejército, que no ha intervenido, no siempre puede permanecer de nuestro lado. Tarde o temprano, tendremos que enfrentarnos militarmente contra otro poder. Para asegurar su lealtad, debemos comenzar en la parte superior de la cadena de mando. Se darán cuenta muy fácilmente de que no tienen elección, pero sin duda mostrará alguna resistencia durante unos meses. Una vez que la parte superior de la cadena sea traída en línea, el resto obedecerá órdenes."
 FRA_worker_right_comm: "Reasegurar a los trabajadores"
 FRA_worker_right_comm_desc: "Aunque la difícil fase de nuestra revolución ha terminado, la sociedad civil ha expresado su profunda preocupación por la situación en nuestro país. Debemos tranquilizar a la fuerza de trabajo garantizando empleo y seguridad laboral. Esto requerirá que nuestras líneas de producción se adapten, pero estas garantías serán beneficiosas para nuestro futuro."
 FRA_people_constitution_comm: "La dictadura del proletariado"
 FRA_people_constitution_comm_desc: "Las instituciones de la Antigua República eran fundamentalmente injustas. Una casta pequeña y corrupta ejerció control total sobre el país. Nuestra revolución debe dar a los trabajadores las herramientas para participar en la vida política del país que ayudan a correr. Es hora de poner fin a la injusta República y diseñar una nueva forma de gobierno."
 FRA_revolution_soil: "Una tierra de revolución"
 FRA_revolution_soil_desc: "Desde los Jaqueries hasta las Revolucións Francesas, el pueblo francés ha demostrado que se oponen a la injusticia de los sistemas autoritarios. A raíz de nuestra Revolución, debemos demostrarles que sus oraciones han sido escuchadas y construidas una sociedad igualitaria capaz de resistir todos los ataques de los contrarrevolucionarios."
 FRA_hostile_nato_comm: "El Occidente corrupto"
 FRA_hostile_nato_comm_desc: "La OTAN es un títere de los Estados Unidos y el capitalismo. Como ambos son nuestros enemigos mortales, no debemos permanecer más en esta alianza. Tarde o temprano, serán nuestros oponentes."
 FRA_fate_eurocommunism: "Abandonar el Experimento Europeo"
 FRA_fate_eurocommunism_desc: "Incluso si lo intentamos con todo nuestro poder, no podríamos poner las instituciones de la Unión Europea en el camino correcto. Están llenos de la corrupción del capitalismo y el cabildeo. Además, estos países se oponen firmemente a nuestra política interna. La división perjudicará nuestra economía altamente integrada, pero esta separación es necesaria."
 FRA_legacy_patriwar: "El legado de la Gran Guerra Patriótica"
 FRA_legacy_patriwar_desc: "En el último siglo, la URSS mostró al mundo que el fascismo podría ser derrotado por la fuerza de las armas. Esa guerra, que lucharon con éxito, nos enseñó que una nación debe estar unida a su ejército. El Ejército Rojo nunca habría prevalecido sin la resiliencia de la sociedad soviética. Debemos asegurarnos de que, en futuros conflictos, el entusiasmo público siga siendo el más alto. Necesitaremos toda nuestra fuerza para lo que está por delante."
 FRA_focus_education: "Educación popular"
 FRA_focus_education_desc: "Ya sea para involucrarse en la política o ser eficaz y feliz en el trabajo, nuestra gente necesita ser informada. Debemos dar a todos la oportunidad de aprender todo lo que necesitan para entender el mundo sin caer en la propaganda de los capitalistas y fascistas."
 FRA_loyalty_cause: "Lealtad a la Causa"
 FRA_loyalty_cause_desc: "Hemos concedido a nuestro pueblo numerosos derechos, desde mejores condiciones de trabajo hasta la representación política, y hemos rectificado muchos errores. Sin embargo, estos nuevos derechos tienen responsabilidades. Se permite el disenso, pero todos los ciudadanos deben someterse plenamente a la voluntad del colectivo. Gobiernan juntos esta sociedad; por lo tanto, es responsabilidad de todos asegurar que siga funcionando correctamente."
 FRA_paris_commune: "Las lecciones de la Comuna de París"
 FRA_paris_commune_desc: "Aunque los vínculos entre la Comuna de París y la ideología comunista que esposamos están lejos de ser obvios, todavía podemos aprender lecciones de este período turbulento. La Comuna de París pereció debido a su falta de recursos y voluntad para luchar contra las fuerzas de la contrarrevolución. En este mundo cruel, corrompido por la globalización, debemos tener en cuenta que la supervivencia de nuestra revolución depende de aplastar a las fuerzas contrarrevolucionarias. Nuestra sociedad debe ser consciente de esto y estar juntas para enfrentar a nuestros adversarios."
 FRA_unleash_agent: "Destabilizar a los capitalistas"
 FRA_unleash_agent_desc: "No siempre podremos enfrentar a nuestros adversarios en el campo de batalla; eso sería demasiado costoso, y podríamos terminar siendo derrotados. Sin embargo, podemos hacer la vida más fácil para nosotros mismos destruyendo su sociedad desde dentro. Con el DGSE, tenemos una agencia de inteligencia entrenada en espionaje y desestabilización, y podríamos ponerla a buen uso. Exportaremos la revolución sin guerra, y no hay nada que los capitalistas puedan hacer para detenerla."
 FRA_spread_communism_eu: "Difundir el comunismo en Europa"
 FRA_spread_communism_eu_desc: "No podemos cambiar las instituciones europeas, pero podemos alentar a algunos de sus Estados miembros a rebelarse. Dado que las políticas neoliberales aplicadas en toda la UE no son para el gusto de todos, no tendremos problemas para convencer a una parte de sus poblaciones de unirse a nosotros."
 FRA_red_army_comm: "El Nuevo Ejército Rojo"
 FRA_red_army_comm_desc: "Gracias a nuestras reformas, el ejército está totalmente bajo el control de la comuna y la sociedad civil está dispuesta a luchar junto con sus fuerzas armadas. Nuestras reformas también han abierto todo su potencial; nuestros soldados saben que la justicia está de nuestro lado. La comuna no debe caer, porque lleva la antorcha de la revolución."
 FRA_collectivisation: "Recopilación de la Economía"
 FRA_collectivisation_desc: "El control de la economía siempre ha eludido a la clase obrera, permaneciendo en manos de algunas familias. Antes de la revolución, la oligarquía reinaba suprema en este país. Pero ahora eso ha terminado; el pueblo francés está recuperando el control de sus medios de producción. Con ello, garantizaremos la lealtad de nuestros medios de producción, así como la seguridad financiera de nuestra población."
 FRA_enforce_unions: "Empoderar a los sindicatos"
 FRA_enforce_unions_desc: "Ahora que hemos colectivizado la economía francesa y dado a los trabajadores mayor responsabilidad política, debemos asegurarnos de que sean capaces de mantener el control si el estado demuestra menos prudente. Los sindicatos pueden haber sido reinstalados por nuestros moderados predecesores, pero podemos hacer más que eso. Daremos a los sindicatos aún más poder y alentaremos a los trabajadores a unirse a ellos. Los trabajadores Unidos nunca deben dejar de desempeñar un papel significativo en la toma de decisiones de nuestro país."
 FRA_glorious_past_comm: "El Cuestionable Pasado del Comunismo"
 FRA_glorious_past_comm_desc: "Aunque no toda Europa tiene recuerdos afectivos del comunismo estalinista, especialmente en Europa oriental, debemos recordarles que somos diferentes. Estos países fueron aplastados por el totalitarismo estalinista, que no liberó al pueblo sino simplemente les dio un nuevo maestro. Nuestros únicos enemigos son el capitalismo y el fascismo; si estos países necesitan liberarse de ellos, podemos ayudarlos a hacerlo. Pero nuestro objetivo no será esclavizarlos, sino integrarlos en nuestra Unión del Proletariado de todas las naciones."
 FRA_befriend_comm: "Unidad de Trabajadores"
 FRA_befriend_comm_desc: "Aunque el comunismo es menos vogue en este nuevo milenio, no estamos solos en seguir sus enseñanzas. En la lucha que se avecina, necesitamos aliados, y podemos encontrarlos entre aquellos países que, como nosotros, han elegido resistir al capitalismo. Debemos proponer a estos países que nos ayudemos unos a otros para destruir el capitalismo en todo el mundo. No están solos, y nosotros tampoco."
 FRA_final_struggle: "La lucha final"
 FRA_final_struggle_desc: "Nuestra sociedad y nuestro ejército están listos para luchar contra el capitalismo. Ellos son conscientes del progreso que hemos hecho y de la determinación de los poderes capitalistas para borrarnos del mapa. Lucharemos hasta el final amargo para derrotar al capitalismo."
 FRA_UFSR_born: "Comunismo con Características Francesas"
 FRA_UFSR_born_desc: "La combinación de la ideología comunista y la determinación del pueblo francés de defender sus derechos fue una muy buena idea. Hemos dejado claro al público que deben involucrarse en la política y que tienen los medios para hacerlo. Así como la Fête de la Fédération marca nuestras vacaciones nacionales, se puede decir que la revolución ha sido realmente aceptada por el pueblo francés. Este es un día histórico para nuestro país."
 FRA_new_kommintern: "Hacia una nueva internacional"
 FRA_new_kommintern_desc: "Muchos grupos de todo el mundo han respondido a nuestro llamado a una revolución mundial. Es hora de poner nuestra alianza en práctica y prepararse para asumir el capitalismo."
 FRA_cold_war_round2: "La Revolución Mundial"
 FRA_cold_war_round2_desc: "Ha llegado el momento de luchar contra el capitalismo y el fascismo. Traeremos libertad a los trabajadores en cada país. La oligarquía será derrotada."
 FRA_kingdom_history: "Una larga historia de monarquía"
 FRA_kingdom_history_desc: "La monarquía ha regresado en Francia. Nuestros partidarios han tomado el control de las instituciones de la ex República y han pedido nuestro regreso. Y aquí estamos, dos siglos después de la caída de la monarquía absoluta, en el trono de Francia. Un largo viaje está por delante de nosotros. Debemos erradicar el legado republicano de la Revolución mientras reconstruimos el nuevo Reino de Francia. Mientras tanto, nuestros enemigos nos esperan en las sombras, pero tendremos éxito, porque Dios está con nosotros, como siempre lo ha sido."
 FRA_camelot: "Las Camelots del Rey"
 FRA_camelot_desc: "Para garantizar que la población siga siendo conforme y no soña con una nueva República, debemos intensificar la vigilancia y hacerlo necesitamos una fuerza policial política. Con este fin, podemos hacer uso de antiguos miembros de Action Française que fueron entrenados por el DGSI. Combinaremos a estas organizaciones en un nuevo cuerpo que llamaremos Camelots del Rey, en homenaje a nuestros activistas realistas del siglo pasado."
 FRA_decentralisation_king: "Descentralización completa"
 FRA_decentralisation_king_desc: "La centralización heredada del Jacobinismo y de la Revolución no convirtió a los franceses en ciudadanos sino en sujetos. Los sistemas de derecho consuetudinario que operan en los niveles inferiores sirven muy bien a su propósito, así como a un vínculo entre el ciudadano y el Estado central. Afortunadamente, nuestro país ya había comenzado a alejarse del centralismo para cumplir con las normas de la Unión Europea. Por lo tanto, podemos completar esta transición, no para conformar el molde de las regiones europeas, sino para restaurar el sistema de autoridad local como antes de la Revolución."
 FRA_king_rule: "Regnum Regis"
 FRA_king_rule_desc: "El primer paso en borrar la memoria de la Revolución es construir un nuevo sistema sobre las ruinas del viejo. Por lo tanto, podemos anunciar la abolición de la República y la redacción de una nueva constitución. Esta constitución se centrará en el Rey, que ejercerá el poder absoluto, al igual que en los viejos tiempos."
 FRA_national_integralism: "Nacionalismo Integral"
 FRA_national_integralism_desc: "Para ayudar al pueblo francés a entender qué fracaso era la Revolución y sus consecuencias, debemos destacar una famosa teoría presentada por el pensador Charles Maurras. El nacionalismo integral retrata a una República que ha abandonado el patriotismo como resultado de una revolución instigada por los masones, herejes y extranjeros. Propone el retorno a la unidad nacional y al orden moral encarnado por la Iglesia Católica. Estas enseñanzas están llenas de virtud y son totalmente aplicables a nuestro Reino naciente. Nuestro Reino acaba de encontrar su manifiesto."
 FRA_no_more_eu: "Dejar a la Unión Europea"
 FRA_no_more_eu_desc: "La Unión Europea encarna todo lo que luchamos contra: liberalismo desenfrenado, idealismo enfermizo, ingenuidad desastrosa y corrupción generalizada. El único objetivo de esta organización es desmantelar nuestras naciones y nuestras culturas. Por lo tanto, no tenemos ninguna razón para seguir siendo parte de este sindicato. Debemos irnos antes de que sea demasiado tarde, cualesquiera sean las consecuencias."
 FRA_eu_kingdom: "Los monarquías caídos"
 FRA_eu_kingdom_desc: "Hace unos siglos, Europa era un continente de monarquías. El orden internacional en ese momento estaba, en cierto sentido, conformado por el equilibrio de poder y alianzas. Pero esos días se han ido. El nacionalismo ha barrido las monarquías o las ha reducido al estatus de los atractivos turísticos. Lo mejor que podemos hacer para encontrar aliados, por lo tanto, es ayudar a los partidarios del absolutismo en Europa a levantarse contra sus opresores republicanos."
 FRA_king_modern_chivalry: "Chivalry moderno"
 FRA_king_modern_chivalry_desc: "El Reino de Francia siempre ha sido reconocido por su caballería y el papel decisivo que jugó en las batallas que luchó. Hoy, la caballería se asemeja a un monstruo de acero de 60 toneladas. Sin embargo, su papel sigue siendo decisivo. Nuestras fuerzas armadas harían bien en centrarse en hacer un uso amplio de la caballería blindada."
 FRA_no_deceit: "Fin del Decenio"
 FRA_no_deceit_desc: "Nuestro principal enemigo es la decadencia que la República ha inculcado en nuestra sociedad: ciudadanos que se han alejado del orden moral y que esperan que el Estado pague por todo. Debemos traerlos de vuelta a la realidad. La era de la República ha terminado. Nuestro Reino quiere ciudadanos virtuosos."
 FRA_frankish_ancestor: "Nuestros antepasados, los francos"
 FRA_frankish_ancestor_desc: "Nosotros los franceses descendemos de los francos; esa es nuestra gente y nuestra identidad. Los republicanos querían erradicar la monarquía y los francos, pero nadie puede borrar una civilización y una cultura desde dentro. Es nuestra herencia, y depende de nosotros reclamarla."
 FRA_against_liberalism: "contra el liberalismo y el socialismo"
 FRA_against_liberalism_desc: "La República ha llevado a nuestros ciudadanos a creer que necesitan más libertades y derechos. Nuestro Reino pretende corregir estos errores. Sobre todo, nuestros ciudadanos necesitan redescubrir el camino hacia el orden moral y la unidad de nuestra nación alrededor de su rey. Todo lo demás es secundario."
 FRA_historical_ennemy: "El Enemigo Eterno"
 FRA_historical_ennemy_desc: "Si hay un adversario con el que hemos chocado a lo largo de los siglos, es sin duda el Reino Unido. También es una monarquía, aunque el monarca no tiene ahora ningún poder real. Seguramente nos encontraremos frente a ellos tarde o temprano. Pero si son ellos u otros, nuestra marina debe estar preparada para luchar contra los poderes marítimos."
 FRA_friend_pope: "Protege al Papado"
 FRA_friend_pope_desc: "Como la hija mayor de la Iglesia, Francia tiene el deber de proteger al papado de todos los que puedan tratar de atacarlo."
 FRA_army_of_elites: "Una fuerza de élite"
 FRA_army_of_elites_desc: "Fue la revolución la que introdujo el concepto de conscripción. Vimos durante las dos últimas guerras mundiales que esto no era necesariamente lo mejor de las ideas. Los soldados que no siempre estaban debidamente entrenados fueron enviados a sus muertes. Estas decisiones decimaron a la población francesa en el siglo pasado. Debemos asegurarnos de que nuestro ejército siga siendo profesional ajustando los criterios de reclutamiento. Esto también nos impedirá acabar con los problemáticos de nuestras filas."
 FRA_positive_inequality: "Positivo"
 FRA_positive_inequality_desc: "No todo tiene que ser igualitario. La idea de que todos debemos ser iguales es otra invención de la Revolución. Algunas personas están destinadas a liderar, mientras que otras tienen la intención de seguir. Los franceses tienen que darse cuenta de esto, porque pasar el tiempo quejarse del éxito de otras personas reduce la eficiencia de todos."
 FRA_destroy_republicanism: "Destruir el republicanoismo"
 FRA_destroy_republicanism_desc: "El Absolutismo ha regresado a nuestro Reino. Ya no hay ninguna razón para perpetuar esta ilusión de democracia que es política. La única parte que tiene derecho a existir es la del Rey. ¡Los franceses deben entender que yo soy el Estado!"
 FRA_catholic_league: "Encontramos la Liga Católica"
 FRA_catholic_league_desc: "Nuestro acercamiento con la Iglesia no ha dejado a todos indiferentes. Algunos países han mostrado su apoyo a nosotros. Tal vez podríamos extender nuestra cruzada a otros poderes católicos. Después de todo, también tienen derecho a luchar para reclamar la Tierra Santa."
 FRA_burry_revolution: "Enterrar la revolución"
 FRA_burry_revolution_desc: "El pueblo francés finalmente ha llegado a darse cuenta de que la Revolución no trajo más que miseria y que la primacía de la monarquía francesa era el orden natural de las cosas. Nuestras instituciones también han sido purgadas de elementos revolucionarios. Por lo tanto, podemos decir que hemos convertido con éxito la página en esa acertada revolución."
 FRA_elder_daughter: "La Hija Mayor de la Iglesia"
 FRA_elder_daughter_desc: "Francia ha recuperado su lugar en el orden mundial. Seremos, como hemos sido desde hace mucho tiempo, los defensores de la Cristiandad, y reclamaremos la Tierra Santa, como hemos hecho tantas veces antes."
 FRA_republican_cancer: "El cáncer republicano"
 FRA_republican_cancer_desc: "Nuestro país ha logrado librarse del republicanoismo, pero somos más o menos los únicos en Europa que ya no están bajo su dominio. Sin decir que si somos derrotados en la batalla, nuestros adversarios nos arrastrarán de nuevo a la pesadilla republicana. Debemos destruir la amenaza republicana donde sea que se encuentre. Sólo así estaremos a salvo."
 France_news.100.t1: "Banderas rojas sobre el Élysée"
 France_news.100.d1: "La televisión estatal francesa se oscureció antes del amanecer. Cuando regresó, el estudio fue mantenido por hombres en fatigas leyendo un comunicado de un órgano que se autodenomina al Comité de Seguridad Pública. Armour suena al Élysée y el Assemblée Nationale, y ningún ministro de la Quinta República ha sido visto desde la medianoche. Bruselas ha convocado una sesión de emergencia y Washington ha ordenado a su personal de la embajada que se cobija en el lugar."
 France_news.100.t2: "París cae con los Tradicionalistas"
 France_news.100.d2: "Unidades de gendarmería leales a las redes tradicionalistas se trasladaron en el cuarto del gobierno durante la noche y no encontraron ninguna resistencia de un comando militar que se había dicho claramente para mantenerse al margen. Por la mañana, el tricolor sobre Élysée voló junto a las pancartas que ningún gobierno francés ha tolerado desde 1944. Las instituciones de la República están suspendidas en espera de lo que los conspiradores llaman restauración nacional."
 France_news.100.a: "La Quinta República está terminada."
 France_news.100.b: "Europa no puede dejar que esto se pare."
 France_news.100.c: "Francia ha enterrado otra república."
 France_news.101.t: "Francia va a las encuestas"
 France_news.101.d: "Las mesas de votación se abrieron en Francia esta mañana para la primera ronda de las elecciones presidenciales. Se prevé que la participación es despresiva: una izquierda dividió cuatro maneras, una derecha dividida entre los republicanos y los soberanos, y un Frente Nacional el comentarista ha pasado toda la campaña negándose a discutir. La segunda ronda es una quincena de distancia, y por una vez nadie en París dirá quién lo alcanza."
 France_news.101.a: "La fuga es nuestra para perder."
 France_news.101.b: "París está mirando."
 France_news.102.t1: "Células revolucionarias redondeadas"
 France_news.102.d1: "Las redadas coordinadas por el DGSI y el GIGN rompieron las redes radicales antes de la primera luz. Los líderes de las células fueron tomados de sus pisos en Saint-Denis y Villeurbanne, se incautaron caches de armas en tres departamentos, y el aparato del partido que habían pasado dos años infiltrado ha sido purgado. El gobierno insiste en que la República nunca estuvo en peligro. Las órdenes de arresto dicen lo contrario."
 France_news.102.t2: "Parcela retorsionista rota"
 France_news.102.d2: "Las redadas coordinadas por el DGSI y el GIGN rompieron las redes tradicionales antes de la primera luz. Los organizadores de Action Française fueron tomados de sus hogares, se incautaron caches de armas en tres departamentos, y los oficiales que habían prometido a los conspiradores el silencio del ejército ahora enfrentan un tribunal militar. La Quinta República ha sobrevivido su llamada más cercana en cuarenta años."
 France_news.102.a: "La República tiene."
 France_news.102.b: "Un alivio, y una advertencia."
 france_md.20.t: "El estado del partido centrista"
 france_md.20.d: "Originalmente un partido de derecha central, el UDF se ha establecido como una parte centrista, y en el pasado pudimos gobernar bajo la presidencia Valérie Giscard d'Estaing. Desde entonces, sin embargo, hemos sido relegados al fondo, a veces sirviendo durante cohabitaciones, pero abrumados por la derecha republicana y el Partido Socialista. Pero el mundo está cambiando, y la tendencia neoliberal está ganando terreno en Occidente. Hoy no somos muy grandes, pero no hay duda de que un día gobernaremos."
 france_md.20.a: "¡Sí, no puedo esperar!"
 france_md.21.t: "El estado de la derecha republicana"
 france_md.21.d: "Nuestro partido es tan viejo como la república y ha gobernado desde 1995 bajo el mandato de Jacques Chirac, pero ya no tiene el viento en sus velas. Después de una disolución fallida que le obligó a asumir un primer ministro socialista, estamos presenciando el ascenso de nuestros rivales, ya sean el Partido Socialista o el Frente Nacional. Nuestro país está, como siempre, en dificultades financieras y sus intereses están amenazados en todas partes del extranjero. Una cosa es cierta: vamos a tener que luchar en casa y en el extranjero para afirmar el poder de Francia a aquellos que podrían dudarlo."
 france_md.21.a: "Vamos a trabajar."
 france_md.22.t: "El estado de la RPF"
 france_md.22.d: "Fundada en 1999, el Rassemblement Pour la France (RPF) es un partido soberano de derecha. Creado por Charles Pasqua, se opone firmemente a la Unión Europea, contra la cual ha trabajado duro. Nuestra influencia es menor por el momento, pero la rueda está girando: la Unión Europea no hace feliz a todos, y estamos acogiendo cada vez más disidentes de otros partidos, personas decepcionadas que no pueden encontrar la voluntad de implementar Frexit en otro lugar. Somos, por supuesto, el partido más gaullista en la existencia, y como esta república fue fundada por De Gaulle, no tenemos lugar en ella aparte de Matignon!"
 france_md.22.a: "¡Larga vida al General de Gaulle, vive Francia!"
 france_md.23.t: "El estado del Frente Nacional"
 france_md.23.d: "Fundada en 1972 por Jean-Marie Le Pen, el Frente Nacional es un partido de extrema derecha. Desde nuestra creación no hemos sido considerados como un partido serio, ya que todo el paisaje político estaba en contra de nosotros por oponerse a la inmigración. La situación ha cambiado desde entonces, y otros partidos están empezando a darse cuenta de que su actitud ha llevado al caos en nuestro país. Somos los precursores de lo que se convertirá en una tendencia general contra la inmigración. Pero todavía estamos destituidos como intocables y etiquetados como extremistas, así que debemos trabajar para que nuestro partido sea aceptable a la asamblea y electorado."
 france_md.23.a: "¡Llegaremos allí!"
 france_md.24.t: "El estado del Partido Socialista"
 france_md.24.d: "Un rival histórico de la derecha republicana, nuestro partido es de edad canónica. La derecha republicana está ahora en dificultad, habiendo sido forzada a cohabitación. Tenemos una sólida base electoral en la mayoría de las clases de la población, y nuestra victoria en la urna es inevitable. Promovemos un enfoque más liberal que nuestros antepasados, para adaptarse a la Europa que estamos construyendo. Sin embargo, nuestro partido enfrenta divisiones internas: un ala derecha ansioso por el centro liberal y un ala izquierda en riesgo de radicalización. No hay duda de que ganaremos, pero una vez arriba estaremos caminando sobre las cáscaras."
 france_md.24.a: "Todo estará bien."
 france_md.25.t: "El estado de la Francia Unbowed"
 france_md.25.d: "El Partido Socialista no pudo llevar a los ideales de izquierda al poder, desgarrado entre sus dos tendencias. Nuestro partido, La France Insoumise, es la única verdadera oposición de izquierda al orden neoliberal. Fue buscando un compromiso indiscriminadamente que el Partido Socialista se enterró, así que basaremos nuestra retórica en la protesta, incluso a costa de los medios de comunicación. Nuestro principal proyecto es construir una nueva república, poniendo fin a la monarquía presidencial que hemos soportado durante demasiado tiempo. Nuestro partido ha tenido éxito entre los jóvenes, pero no debemos contentarnos si queremos gobernar un día."
 france_md.25.a: "Otro mundo es posible."
 france_md.26.t: "El estado de los Verdes"
 france_md.26.d: "El partido ecologista en Francia ha existido desde 1984, pero no ha tenido el éxito que habíamos esperado. Nunca nos tomamos en serio, y nuestra base electoral es casi imposible de encontrar fuera de los centros urbanos. Si vamos a hacer nuestra marca, tendremos que trabajar con otras fiestas y adaptarnos a sus puntos de vista. Pero dada la situación del planeta, nuestra presencia en Matignon eventualmente resultará lógica. Una vez allí, nos esforzaremos por transformar cómo vivimos y producimos, para asegurar un futuro para las generaciones venideras. Los obstáculos son muchos, pero no faltan aliados potenciales."
 france_md.26.a: "Nos quedamos sin tiempo."
 france_md.27.t: "El estado del Partido Comunista Francés"
 france_md.27.d: "El Partido Comunista Francés cayó con la URSS, a la que estaba sólidamente unido. Nunca es fácil encontrarte en el lado perdedor. Nuestra situación es más que crítica: al perder credibilidad, nuestra base electoral de clase trabajadora se dirige hacia la extrema derecha o abstención. Necesitamos revertir esta tendencia y encontrar nuevas formas de ganarlas. Sin duda tendremos que negociar con otros partidos por un tiempo, pero tal vez una vez que estemos a cargo podremos recuperar la confianza de nuestros antiguos votantes y recuperar nuestra autonomía. Nuestra fiesta tiene una larga historia, y no puede parar ahora."
 france_md.27.a: "Volveremos."
 france_md.30.t: "La dirección de la economía"
 france_md.30.d: "Ha llegado el momento de elegir a nuestro ministro de finanzas. Nuestro país está en necesidad urgente de reforma, por lo que hemos encontrado 2 perfiles que deben satisfacer nuestras expectativas en términos de finanzas. El primero viene de nuestras filas, un hombre llamado Olivier Ferrand, que a lo largo de su carrera en la economía se ha familiarizado con este campo. El segundo, un ex inspector de finanzas, es nuevo en la política y apoyó nuestra campaña. Su visión social-liberal de la sociedad parece lo que queremos llegar a ser, y tal vez su presencia en nuestro gobierno nos dará la aprobación del bloque liberal."
 france_md.30.a: "¡Renovación en el movimiento! ¡Nombra Emmanuel Macron a Bercy inmediatamente!"
 france_md.30.b: "No, sería mejor dejar a alguien en quien realmente confiamos. Nombra a Olivier Ferrand."
 france_md.150.t: "Asistencia adicional de Francia"
 france_md.150.d: "El gobierno francés nos ha ofrecido ayuda extra en la crisis financiera que hemos estado pasando desde que nos unimos a la Unión Europea. ¿Deberíamos aceptarlo?"
 france_md.150.a: "¡Claro que necesitamos el dinero!"
 france_md.150.b: "No, no lo necesitamos."
 france_md.151.t: "Francia propone una reunión internacional"
 france_md.151.d: "El Partido Socialista Francés ha decidido organizar una reunión de líderes socialistas de todo el mundo, y han pensado invitarnos. Podríamos beneficiarnos de esto para obtener legitimidad. ¿Debemos ir o declinar educadamente?"
 france_md.151.a: "¡Estaremos allí!"
 france_md.151.b: "No, tengo mejores cosas que hacer."
 france_md.160.t: "Colapso del Partido Socialista"
 france_md.160.d: "Después de un año de inestabilidad y división dentro del Partido Socialista, se ha reducido a casi nada. Este es un momento histórico, pero es una vergüenza ver el fin de un partido que ha jugado un papel tan crucial en la historia de Francia. Para quien hereda el puesto de primer secretario, la tarea será pesada."
 france_md.160.a: "Se hicieron errores"
 france_md.161.t: "Lagrima continúa"
 france_md.161.d: "Una gran proporción de nuestros miembros y partidarios están en proceso de disociarse de nuestro grupo. Está claro que si queremos evitar caer, tendremos que usar todas las palancas a nuestra disposición para mantener el apoyo de los políticos y del público."
 france_md.161.a: "¡Ni un minuto para perder!"
 france_md.162.t: "Nuestro partido está amenazado."
 france_md.162.d: "Las numerosas reformas impopulares que hemos llevado a cabo, a pesar de la desaprobación general, nos han ganado la ira de la población, quienes se preguntan si hicieron lo correcto votando por nosotros. Además, nuestras numerosas alianzas con el centro liberal, que hemos intentado emular, han causado muchos rifts dentro de nuestro partido. Nuestro ala izquierda, decepcionado con nuestras elecciones, está amenazando con entrar en los brazos de la izquierda radical, mientras que nuestro ala derecha nos encuentra demasiado suave frente a los candidatos liberales, a quienes a veces hemos ayudado a pesar de nosotros mismos. Si todavía hay una oportunidad, tendremos que trabajar duro para conseguirlo."
 france_md.162.a: "Ah, damn it."
 france_md.163.t: "¿Quién es para culpar?"
 france_md.163.d: "Tras nuestro colapso, algunos de nuestros votantes se han desplazado hacia los centristas, otros hacia formaciones más izquierdistas que defienden su 'radicalismo' llamando a sí mismos la 'ruptura' izquierda, una postura que atrae la crítica mediática pesada y une oposición contra ellos. Cualquiera que elijamos confrontar ahora decidirá si nuestros antiguos votantes vuelven a nosotros."
 france_md.163.a: "Los extremistas de cualquier raya ponen en peligro nuestra sociedad"
 france_md.163.b: "Eso no es nada comparado con el peligro que representa el centro extremo"
 france_md.164.t: "Francia propone ejercicios militares conjuntos"
 france_md.164.d: "Los diplomáticos franceses nos han enviado una propuesta de formación militar conjunta. De hecho, el reciente aumento de las tensiones internacionales nos alienta a unirnos entre los Estados europeos para prepararnos para lo peor. Esta podría ser una iniciativa muy buena para capacitar a nuestras fuerzas armadas por los conflictos de alta intensidad que podrían estallar en cualquier momento. ¿Qué deberíamos decirles?"
 france_md.164.a: "Con mucho gusto, entrenaremos junto a ellos"
 france_md.164.b: "No gracias, no necesitamos su ayuda."
 france_md.165.t: "La tormenta llega"
 france_md.165.d: "Varios expertos en diferentes temas nos han sugerido durante algún tiempo que establezcamos medidas reglamentarias en caso de que una crisis económica se produzca en cualquier lugar de la Tierra. No sería el primero ni el último, pero estas medidas nos permitirían mantener nuestra distancia de las complicaciones que acompañan tales crisis. Sin embargo, ello significaría regular el sector económico y pagar a muchos expertos para supervisar las operaciones. ¿De verdad queremos hacer esto? Nuestros socios financieros podrían tomarlo mal."
 france_md.165.a: "La situación es muy preocupante; debemos establecer con urgencia medidas reglamentarias"
 france_md.165.b: "Estas son sólo suposiciones que parecen malas para el negocio"
 france_md.170.t: "Francia ofrece reparaciones de guerra"
 france_md.170.d: "El gobierno francés ha decidido compensarnos por la mortífera guerra de Indochina que tuvo lugar en nuestro suelo durante 7 años. Este dinero nunca reemplazará las vidas de los 500.000 vietnamitas que murieron por la independencia, pero es un gesto honorable que no debe ser rechazado."
 france_md.170.a: "Ahora esperamos a los americanos"
 france_md.171.t: "Francia ofrece reparaciones de guerra"
 france_md.171.d: "El gobierno francés parece haber aceptado por fin reconocer algunos de los crímenes cometidos en nuestro país, y está ofreciendo compensación por la guerra de independencia. Este dinero no sustituirá las vidas de los 600.000 argelinos que murieron por la libertad, pero por una vez un occidental reconoce sus crímenes, sería tonto rechazarlo."
 france_md.171.a: "En el momento adecuado."
 france_md.172.t: "Francia propone su experiencia nuclear"
 france_md.172.d: "La Presidencia francesa ha propuesto compartir su experiencia nuclear con nosotros por una modesta suma de dinero. Esto podría resultar muy útil para dominar este átomo inestable y hacer el mejor uso de él. Si aceptamos, esto podría ayudarnos mucho a iluminar a nuestra gente y facilitar la investigación en este campo. Sin embargo, tal vez podríamos utilizar este dinero para algo más que dar a Francia un lugar que no merece en nuestro país."
 france_md.172.a: "Un trato en Urano 235"
 france_md.172.b: "No, puedes mantener tus bombas de tiempo para ti."
 france_md.173.t: "Francia Propone su protección"
 france_md.173.d: "Ante la erupción del mundo en múltiples crisis, Francia ha decidido garantizar la protección de sus aliados europeos. De hecho, la Presidencia francesa nos aseguró esta mañana que en caso de agresión por un poder europeo extranjero, no dudaría en intervenir, incluso invocando el uso de armas nucleares. Aunque esta protección es una pérdida de soberanía en sí misma, podría ser crucial en momentos como estos."
 france_md.173.a: "Uno nunca puede tener demasiado cuidado."
 france_md.173.b: "No necesitamos su protección."
 france_md.175.t: "La Unión Europea impone sanciones sobre nosotros"
 france_md.175.d: "Siguiendo nuestras posiciones recientes y nuestro deseo de retirarnos de los tratados que nos obligan a los Estados miembros, estos burócratas europeos malditos nos han impuesto una multa. Sin embargo, nada nos obliga a pagarlo; nuestros votantes, que anhelan cambio, incluso lo verían como un signo de debilidad o traición. Sin embargo, negarse a pagar podría perjudicar nuestras relaciones con los Estados miembros europeos y provocar sanciones contra nosotros. ¿Debemos ir todo el camino?"
 france_md.175.a: "Pagaremos la multa porque jugamos por las reglas; es siguiendo las reglas que prevaleceremos"
 france_md.175.b: "¿Y qué más? Ya hemos sido ensanchados lo suficiente."
 france_md.180.t: "Un voto histórico"
 france_md.180.d: "La gente ha hablado. Después de largas campañas para Frexit y después de evadir las trampas de estos europeos accursados, así como los de estos populistas viles que trataron de reclamar nuestros éxitos, lo hemos hecho. Francia se va de Europa lo más rápido posible. Obviamente, estas serpientes de Bruselas no dejarán de hacernos pagar tanto como puedan, pero estas sanciones no son nada comparado con la libertad que hemos recuperado."
 france_md.180.a: "Ahora y para siempre, Francia es libre"
 france_md.181.t: "Francia deja a la Unión Europea"
 france_md.181.d: "Tras numerosas campañas de desinformación euroescéptica, el movimiento nacionalista francés finalmente logró girar Francia hacia Frexit. La salida de Francia es sólo cuestión de tiempo; sin embargo, es bastante grave ver a un miembro fundador y structor de la licencia de la UE tan rápidamente."
 france_md.181.a: "Debemos ser cautelosos ante el populismo"
 france_md.182.t: "Francia reconoce nuestras reivindicaciones"
 france_md.182.d: "El gobierno francés anunció recientemente que apoya nuestra posición sobre los diversos territorios históricamente nuestros que fueron tomados de nosotros. También han propuesto el comienzo de la cooperación militar entre nuestras dos naciones; porque ahora sólo son facilidades para acceder a nuestra infraestructura militar. Este apoyo francés repentino es bienvenido, pero ¿debemos realmente permitirles beneficiarse de nuestra infraestructura?"
 france_md.182.a: "Por supuesto, ellos nos apoyan; son bienvenidos"
 france_md.182.b: "Nunca pedimos su ayuda; que mantengan su distancia"
 france_md.183.t: "Francia propone profundizar nuestra cooperación"
 france_md.183.d: "Después de tomar numerosas posiciones a nuestro favor y anunciar un rechazo claro de la OTAN, París ha propuesto profundizar nuestra cooperación, desde los vínculos económicos hasta una alianza militar total contra nuestros enemigos comunes. ¿Podemos realmente confiar en los occidentales que han abandonado tan rápidamente sus aliados anteriores?"
 france_md.183.a: "Tomaré tres cajas de ese perfume; es un trato"
 france_md.183.b: "¿Prefieres las dunas del Sahel o nuestras estepas congeladas para entrenar? Nuestros ejércitos surgirán más fuerte."
 france_md.183.c: "Pueden quedarse solos."
 france_md.184.t: "Moscú acepta la cooperación económica"
 france_md.184.d: "La respuesta de Moscú no fue larga en llegar; nuestras economías podrían beneficiarse de este acuerdo. Además de abrirnos un mercado considerable para nuestros productos de lujo y alta tecnología, nuestras industrias necesitadas de materias primas se sentirán más seguras. Este acuerdo histórico es una cascada para nosotros y un clavo en el ataúd de la Unión Europea. Nosotros que lo creamos ahora comerciamos con su peor enemigo."
 france_md.184.a: "Dejar el champán y el flujo de aceite"
 france_md.185.t: "Moscú acepta la cooperación económica y militar"
 france_md.185.d: "La respuesta de Moscú no fue larga en llegar; nuestras economías y ejércitos podrían beneficiarse de este acuerdo. Además de abrirnos un mercado considerable para nuestros productos de lujo y alta tecnología, nuestras industrias necesitadas de materias primas se sentirán más seguras. Además, el fortalecimiento de la cooperación entre nuestras fuerzas armadas nos permitirá adquirir experiencia en nuevos teatros y beneficiarse de sus avances tecnológicos y estratégicos. Este acuerdo histórico es una cascada para nosotros y un clavo en el ataúd de la OTAN. Ahora tenemos un socio confiable para navegar este nuevo milenio."
 france_md.185.a: "Nos reuniremos de nuevo en el Sahel, pero esta vez no luchar entre sí"
 france_md.187.t: "Los rusos rompen las negociaciones"
 france_md.187.d: "A pesar de todos los esfuerzos desplegados por nuestros diplomáticos, no han logrado llegar a un acuerdo con sus homólogos rusos. Como si no hubiera voluntad de hacer negocios con nosotros. Esto es lamentable; el potencial de un acuerdo bilateral habría sido invaluable para nuestros dos países. Tampoco es imposible que nuestros antiguos amigos occidentales ejercieran presión para asegurarnos de que permanezcamos bajo su pulgar. Pero no es grave; encontraremos otros socios."
 france_md.187.a: "El cáncer americano ha llegado así a los Urales; mejor solo que en mala compañía"
 france_md.188.t: "Francia exige concesiones"
 france_md.188.d: "Tras la victoria del populismo en Francia y su salida de la Unión Europea, ha seguido demostrando su hostilidad hacia nosotros. Las sanciones económicas que se le imponen después de su salida no lo han dejado sin mancha; ahora ha terminado de recuperarse y exige reparación. En la actualidad, los diplomáticos han llegado amenazando con reducir el acceso a su territorio nacional si no influimos en el Banco Europeo para reducir las tasas de interés sobre su deuda. Las consecuencias de esta pérdida de acceso a su territorio podrían complicar enormemente los intercambios dentro de la Unión Europea. Sin embargo, ceder a su chantaje nos obligaría a utilizar nuestras ventajas para los enfermos."
 france_md.188.a: "Malditos sean ellos; tomaremos el menor daño"
 france_md.188.b: "No nos entregaremos al chantaje de unos pocos populistas"
 france_md.189.t: "Alemania se rinde a nuestras concesiones"
 france_md.189.d: "Tras la presión que les hemos ejercido, el gobierno alemán ha aceptado reticentemente presionar al BCE para reducir nuestros tipos de interés. Esta es una formidable venganza de nuestros extorsionadores. Estos alemanes pueden seguir disfrutando de nuestras glorietas, pero gracias a ellos comemos a expensas de Bruselas."
 france_md.189.a: "Un ojo para un ojo, un diente para un diente, en latín si es posible"
 france_md.190.t: "Alemania rechaza nuestras demandas"
 france_md.190.d: "Nuestros diplomáticos regresaron con las manos vacías de Berlín, desconcertados por nuestros primos alemanes. Tal vez nuestras demandas eran demasiado altas o pretenden mirar en otro lugar que con nosotros. No tendremos nuestra venganza contra la Unión Europea hoy, pero no puede esperar."
 france_md.190.a: "Quedamos libres y no lo hacen; cerrar las fronteras al este"
 france_md.191.t: "Francia exige concesiones"
 france_md.191.d: "Tras la victoria del populismo en Francia y su salida de la Unión Europea, ha seguido demostrando su hostilidad hacia nosotros. Las sanciones económicas que se le imponen después de su salida no lo han dejado sin mancha; ahora ha terminado de recuperarse y exige reparación. En la actualidad, los diplomáticos han llegado amenazando con reducir el acceso a su territorio nacional si no reemplazamos a su policía marítima y costera en las operaciones de detención migratoria. Las consecuencias de esta pérdida de acceso a su territorio podrían complicar enormemente los intercambios dentro de la Unión Europea. Sin embargo, ceder a su chantaje nos obligaría a utilizar nuestras ventajas para los enfermos."
 france_md.191.a: "Malditos sean ellos; tomaremos el menor daño"
 france_md.191.b: "No nos entregaremos al chantaje de unos pocos populistas"
 france_md.192.t: "Italia se rinde a nuestras concesiones"
 france_md.192.d: "Tras la presión que les hemos ejercido, el gobierno italiano ha aceptado renuentemente reemplazar a nuestra policía en nuestras fronteras marítimas. Esta es una formidable venganza de nuestros extorsionadores. Estos italianos estarán encantados de disfrutar del flujo de migrantes, pero gracias a ellos comemos a expensas de Bruselas."
 france_md.192.a: "Un ojo para un ojo, un diente para un diente, en latín si es posible"
 france_md.193.t: "Italia rechaza nuestras demandas"
 france_md.193.d: "Nuestros diplomáticos regresaron con las manos vacías de Roma, desconcertados por nuestros vecinos latinos. Tal vez nuestras demandas eran demasiado altas o pretenden mirar en otro lugar que con nosotros. No tendremos nuestra venganza contra la Unión Europea hoy, pero no puede esperar."
 france_md.193.a: "Quedamos libres y no lo hacen; cerrar las fronteras al sureste"
 france_md.194.t: "Francia exige concesiones"
 france_md.194.d: "Tras la victoria del populismo en Francia y su salida de la Unión Europea, ha seguido demostrando su hostilidad hacia nosotros. Las sanciones económicas que se le imponen después de su salida no lo han dejado sin mancha; ahora ha terminado de recuperarse y exige reparación. Hoy, los diplomáticos han llegado amenazando con reducir el acceso a su territorio nacional si no utilizamos las instituciones que albergamos para sus propósitos. Nos piden influir en las decisiones de las instituciones europeas y sus servicios espía. Las consecuencias de esta pérdida de acceso a su territorio podrían complicar enormemente los intercambios dentro de la Unión Europea. Sin embargo, ceder a su chantaje nos obligaría a utilizar nuestras ventajas para los enfermos."
 france_md.194.a: "Malditos sean ellos; tomaremos el menor daño"
 france_md.194.b: "No nos entregaremos al chantaje de unos pocos populistas"
 france_md.195.t: "Bélgica se rinde a nuestras concesiones"
 france_md.195.d: "Tras la presión que les hemos ejercido, el gobierno belga ha acordado presionar a las instituciones europeas a nuestro favor. Esta es una formidable venganza de nuestros extorsionadores. Estos belgas estarán encantados de trabajar horas extraordinarias en el parlamento, y gracias a ellos comemos a expensas de Bruselas."
 france_md.195.a: "Un ojo para un ojo, un diente para un diente, en latín si es posible"
 france_md.196.t: "Bélgica rechaza nuestras demandas"
 france_md.196.d: "Nuestros diplomáticos regresaron con las manos vacías de Bruselas, desconcertados por nuestros hermanos Walloon y Flemish. Tal vez nuestras demandas eran demasiado altas o pretenden mirar en otro lugar que con nosotros. No tendremos nuestra venganza contra la Unión Europea hoy, pero no puede esperar."
 france_md.196.a: "Quedamos libres y no lo hacen; cerrar las fronteras al norte"
 france_md.197.t: "Francia exige concesiones"
 france_md.197.d: "Tras su salida de la Unión Europea y la recuperación de las sanciones resultantes, Francia sigue demostrando su hostilidad hacia nosotros. Hoy sus diplomáticos llegaron amenazando con reducir el acceso al territorio francés, a menos que entreguen un registro detallado de cuentas bancarias en nuestro territorio, una grave violación del secreto bancario que tratamos de preservar. Perder ese acceso complicaría nuestro comercio a través de la Unión, pero entregarnos nos hace cómplices en su chantaje."
 france_md.197.a: "Malditos sean ellos; tomaremos el menor daño"
 france_md.197.b: "No nos entregaremos al chantaje de unos pocos populistas"
 france_md.198.t: "Luxemburgo rinde a nuestras concesiones"
 france_md.198.d: "Tras la presión que les hemos ejercido, el gobierno de Luxemburgo ha acordado presionar sus servicios bancarios para que nos proporcionen un registro detallado de las cuentas que poseen. Encontramos a muchos traidores que buscan escapar de su deber, pero también información sobre muchas empresas privadas que residen en nuestro territorio nacional. Estos descubrimientos ayudarán a los esfuerzos de la autoridad tributaria para perseguir malos patriotas y hacer que las empresas que trataron de engañarnos en nuestro país paguen. Los luxemburgueses pueden haber perdido gran credibilidad en la banca, pero gracias a ellos comemos a expensas de Bruselas y a costa de su maldito libre comercio."
 france_md.198.a: "Un ojo para un ojo, un diente para un diente, en latín si es posible"
 france_md.199.t: "Luxemburgo rechaza nuestras demandas"
 france_md.199.d: "Nuestros diplomáticos regresaron con las manos vacías de Luxemburgo, desconcertados por nuestros vecinos millonarios. Tal vez nuestras demandas eran demasiado altas o pretenden mirar en otro lugar que con nosotros. No tendremos nuestra venganza contra la Unión Europea hoy, pero no puede esperar."
 france_md.199.a: "Quedamos libres y no lo hacen; cerrar las fronteras al noreste"
 france_md.200.t: "Francia exige concesiones"
 france_md.200.d: "Tras su salida de la Unión Europea y la recuperación de las sanciones resultantes, Francia sigue demostrando su hostilidad hacia nosotros. Hoy sus diplomáticos llegaron amenazando con reducir el acceso al territorio francés a menos que vengamos a la ayuda de su sector agrícola, que está desarrollando un proyecto cítrico en el sur que compite directamente con el nuestro. Perder ese acceso complicaría nuestro comercio a través de la Unión, pero entregarnos nos hace cómplices en su chantaje."
 france_md.200.a: "Malditos sean ellos; tomaremos el menor daño"
 france_md.200.b: "No nos entregaremos al chantaje de unos pocos populistas"
 france_md.201.t: "España se rinde a nuestras concesiones"
 france_md.201.d: "Tras la presión que les hemos ejercido, el gobierno español ha acordado proporcionarnos asistencia técnica y comercial para la producción y venta de nuestra nueva línea cítrica que inundará los mercados franceses y españoles. Tal vez los españoles sólo tienen sus dedos para morder ahora, pero gracias a ellos comemos a expensas de Bruselas y hemos mostrado nuestra hegemonía alimentaria en el continente."
 france_md.201.a: "Un ojo para un ojo, un diente para un diente, en latín si es posible"
 france_md.202.t: "España rechaza nuestras demandas"
 france_md.202.d: "Nuestros diplomáticos regresaron con las manos vacías de Madrid, desconcertados por nuestros vecinos ibéricos. Tal vez nuestras demandas eran demasiado altas o pretenden mirar en otro lugar que con nosotros. No tendremos nuestra venganza contra la Unión Europea hoy, pero no puede esperar."
 france_md.202.a: "Quedamos libres y no lo hacen; cerrar las fronteras al suroeste"
 france_md.203.t: "El fin del viaje"
 france_md.203.d: "Después de meses de diálogo y lucha sobre su fondo, el texto de reforma constitucional está finalmente listo para ser votado. Nuestros opositores políticos pueden haber utilizado el proceso de redacción para deslizarse en cláusulas que sirven a sus propios ideales, pero negar al pueblo un voto después de tanto tiempo un proceso les dejaría sentirse traicionados con razón. Convocar el referéndum es nuestro único llamado, en virtud del artículo 11 de la Constitución, y sólo responderemos por las consecuencias."
 france_md.203.a: "Es hora de terminar esto; Pido un referéndum."
 france_md.203.b: "Este texto es demasiado peligroso y no debe ser votado"
 france_md.204.t: "El texto pasa"
 france_md.204.d: "Hoy es un día histórico; por primera vez todo el pueblo participa en la elaboración de su constitución. El resultado de la votación es insoportable, una victoria abrumadora de sí; por supuesto, cuando usted da a una persona francesa el derecho a decidir sus propios derechos, él no se privará. Este texto tal vez no es perfecto, pero refleja una nueva era que comienza hoy, y hemos hecho todo lo posible para garantizar que defiende los derechos de nuestros ciudadanos evitando al mismo tiempo que el pueblo sucumbi a las canciones sirenas de nuestros adversarios políticos. Aquí termina la Quinta República y con este franco y masivo Sí comienza la Sexta República."
 france_md.204.a: "El día de la gloria ha llegado"
 france_md.205.t: "El texto es ampliamente rechazado"
 france_md.205.d: "En contra de todas las expectativas, la reforma constitucional que planeamos durante meses ha sido rechazada en la urna electoral. Tal vez nuestra participación en la dirección de los debates dejó a la gente pensando que estábamos tratando de manipularlos, o quizás nuestros ciudadanos quisieron cambiar pero nunca acordaron qué forma debía tomar. Todo no está perdido: todavía podemos seguir nuestra visión de la república una ley a la vez, pero la reforma radical que esperábamos tendrá que esperar."
 france_md.205.a: "Completamente incomprensible"
 france_md.206.t: "Debate sobre instituciones, Parte 1"
 france_md.206.d: "La cuestión de las instituciones ha dividido a Francia desde la fundación de la Quinta República en 1958, cuando el poder presidencial reemplazó la inestabilidad de la Cuarta República. Ese poder se ve ahora como excesivo, dejando que un presidente malintencionado bloquee el progreso con pocos cheques, mientras que la Asamblea Nacional más representativa tiene poca autoridad exclusiva propia. Renovar esta constitución obsoleta está ahora sobre la mesa, y hasta qué punto vamos a definir si el poder se inclina hacia el parlamento o permanece con la presidencia."
 france_md.206.a: "Es bastante práctico no estar constantemente bajo amenaza de la asamblea."
 france_md.206.b: "Abajo de la república presidencial, el Presidente inaugurará los crisantemos"
 france_md.206.c: "Centrémonos en promover la participación ciudadana activa"
 france_md.207.t: "El Triunfo de Compromiso"
 france_md.207.d: "Después de días de deliberación, los ciudadanos parecen haber llegado a un acuerdo en torno a la reducción de poderes. El artículo 49.3 fue naturalmente el primer blanco de la ira popular. Los poderes presidenciales se apagaron ligeramente y la gente parece satisfecha con su trabajo. Un golpe democrático ahora parece menos probable; nuestras instituciones ganan en legitimidad y eficacia. Sólo podemos lamentar la leve decepción de nuestros más devotos partidarios a quienes habíamos prometido el fin de la monarquía presidencial. Lo que pensamos, la gente ha decidido; ahora podemos centrar nuestra atención en los siguientes debates."
 france_md.207.a: "¡Muy bien, próxima pregunta! Mi oficina pasó por esto bastante bien."
 france_md.208.t: "El fin de la dictadura presidencial"
 france_md.208.d: "Los ciudadanos finalmente han llegado a un acuerdo: la Quinta República acumula demasiado resentimiento de decisiones presidenciales abusivas, y ya no podemos arriesgar tanto poder descansando en el capricho de un hombre. Los poderes del presidente están ahora limitados a los de comandante en jefe y una figura ceremonial en el Palacio Elysee, mientras que la Asamblea Nacional se vuelve todopoderosa una vez más. Las reformas pueden perder cierta estabilidad, pero van a avanzar mucho más fácilmente, y la confianza francesa en nuestras instituciones debe crecer para ello."
 france_md.208.a: "Así sea; que continúen los debates."
 france_md.209.t: "Debates sobre instituciones Parte 2:"
 france_md.209.d: "A medida que se cierra el debate institucional, una pregunta divide a nuestros ciudadanos: supervisión de los servicios secretos que responden al presidente. Estos servicios han defendido desde hace mucho tiempo los intereses franceses, pero los excesos pasados, incluidos los asesinatos de Auriol de 1981, y su libertad para actuar fuera de la ley han planteado preocupaciones acerca de la transparencia. Una mayor apertura crearía confianza en nuestras instituciones, pero nuestra seguridad en un mundo cada vez más inestable no puede tomarse a la ligera."
 france_md.209.a: "¡La seguridad de nuestros ciudadanos sobre todo! Nos aseguraremos de que su privacidad no esté en peligro."
 france_md.209.b: "¡La gente necesita transparencia! El pueblo necesita justicia; el Estado debe responder a sus ciudadanos."
 france_md.209.c: "Este debate agita demasiada tensión; haríamos mejor para mantener nuestra distancia."
 france_md.210.t: "Los Servicios Secretos Emerge Intact"
 france_md.210.d: "Los ciudadanos han decidido mantener los servicios secretos bajo control ejecutivo. De hecho, especialmente en estos tiempos, nuestra defensa pasiva debe estar en primera línea para protegernos de acciones maliciosas desde el exterior y del terrorismo. Este resultado ha decepcionado a nuestros activistas querían más transparencia y democracia. Muchos de nuestros ciudadanos persisten en pensar que la defensa de nuestro país no debe venir al costo de su privacidad en tiempo de paz. Algunos también temen el uso indebido de estos servicios por gobiernos malintencionados para espiar su oposición o prevenir fugas a la oposición. Los votantes han decidido, y eligieron seguridad sobre la libertad. Es su elección, después de todo."
 france_md.210.a: "Este no es simplemente el momento adecuado para bajar nuestra guardia en un mundo donde podría haber tenido precedencia sobre el derecho internacional."
 france_md.211.t: "La cortina está ordenada"
 france_md.211.d: "Después de las arduas negociaciones, finalmente hemos decidido poner fin a la opacidad total de nuestros servicios secretos. Muchos ciudadanos ya no se sentían seguros sabiendo que estaban bajo vigilancia constante sin su conocimiento, y nuestras intervenciones extranjeras a menudo provocan controversias que preferirían no aprender del periódico. Esta nueva transparencia debe dar a nuestros ciudadanos mayor confianza en su policía y fuerzas armadas, incluso si nos cuesta cierta seguridad interna e influencia externa."
 france_md.211.a: "No necesitamos servicios secretos para protegernos de la injerencia extranjera."
 france_md.212.t: "Debate sobre los derechos personales Parte 1:"
 france_md.212.d: "La cuestión de los derechos personales es el centro del debate constitucional. ¿Debemos fortalecer las libertades individuales contra la seguridad colectiva estatal o priorizada? Los debates se centran en la protección de los datos personales, el derecho a la privacidad y los límites de la vigilancia estatal. Los progresistas abogan por una expansión de los derechos fundamentales, mientras que los conservadores temen un debilitamiento de la autoridad pública. Nuestra posición sobre este asunto determinará en parte la dirección de la nueva constitución."
 france_md.212.a: "Defender firmemente las libertades individuales."
 france_md.212.b: "La seguridad colectiva debe tener prioridad."
 france_md.212.c: "Dejemos que el debate continúe sin nosotros."
 france_md.213.t: "Victoria para las libertades individuales"
 france_md.213.d: "El debate concluyó a favor del fortalecimiento de las libertades individuales. La nueva constitución garantizará mayores protecciones contra la intrusión estatal en la vida privada de los ciudadanos. Esta victoria para los progresistas marca un punto de inflexión en nuestra relación con la autoridad pública, incluso si algunos se preocupan por las consecuencias para la seguridad nacional."
 france_md.213.a: "Nuestros ciudadanos pueden regocijarse en estas nuevas garantías."
 france_md.214.t: "Prevails de seguridad"
 france_md.214.d: "A pesar de los esfuerzos de los defensores de la libertad, la visión centrada en la seguridad ganó el día en debates constitucionales. El Estado mantendrá amplios poderes de vigilancia e intervención. Mientras esto tranquiliza a parte de la población, activistas de derechos civiles denuncian un revés democrático."
 france_md.214.a: "Estabilidad viene a un precio."
 france_md.215.t: "Debate sobre los derechos personales Parte 2:"
 france_md.215.d: "Nuestra nación es conocida por su malestar, y sin embargo una elección resulta, el descontento eventualmente llega a las calles. La cuestión de proteger a los ciudadanos durante las protestas está ahora en el orden del día: la policía sobreviene por un lado, la insuficiente protección del otro, con muchas protestas que terminan en lesiones. La restricción de la policía reconstruiría la confianza pública pero añadiría costos, mientras que el respaldo mantiene el orden pero arriesga nuevos incidentes a medida que los movimientos se radicalicen."
 france_md.215.a: "Debemos regular nuestras fuerzas policiales."
 france_md.215.b: "Que hagan su trabajo."
 france_md.215.c: "El pueblo decidirá; después de todo, estarán en las calles protestando por esta ley."
 france_md.216.t: "El pueblo elige restringir la policía"
 france_md.216.d: "Tras horas de debate, la mayoría estuvo de acuerdo en que era necesario reglamentar a las fuerzas policiales para evitar nuevos escándalos. Las tecnologías de la ley y el orden están mejorando, y ya somos una nación altamente eficaz a este respecto; no hay necesidad de ir más lejos. Además, evitar lesiones físicas graves entre los manifestantes seguramente reducirá el gasto sanitario. El estado también tiene más que responder a su pueblo, ya que podrán protestar en las calles menos peligrosamente. No obstante, se debe esperar que los costos adicionales de la policía a medida que se disminuya la eficacia de las fuerzas del orden."
 france_md.216.a: "Así que nuestra gente seguirá manteniendonos en la línea. ¡Próxima pregunta!"
 france_md.217.t: "La gente elige la orden"
 france_md.217.d: "Incluso si no lo que habríamos preferido, la eficacia de la policía ganó el día. Es cierto que algunas protestas degeneran y causan grandes daños a la propiedad, por lo que es necesaria una supervisión externa dada la menor eficacia de los servicios de cumplimiento de la ley. Nos enfrentamos a crisis presupuestarias y sociales sin precedentes; en algún momento, tendremos que recurrir a algunas de las personas contra nosotros. Por lo tanto, sigue siendo importante ser capaz de enfrentarse a cualquier movimiento social que venga. Después de todo, nos eligieron, ¿no?"
 france_md.217.a: "La gente escogió la seguridad sobre el derecho a exigirnos responsabilidades; ¿podemos culparlos? Siguiente pregunta."
 france_md.218.t: "Debate sobre la economía, Parte 1"
 france_md.218.d: "Aunque la gestión de la economía caerá en futuros gobiernos, podemos consagrar los fundamentos sociales, ecológicos o económicos en la Constitución ahora, haciendo leyes que las violan inconstitucionalmente. La priorización de las protecciones sociales asegura empleos y bienestar, pero puede dejar atrás la ecología y desalentar a los inversores con la deuda resultante. Priorizar la ecología mejora la calidad de vida y nos desplaza hacia nuevas fuentes energéticas, pero deja algunos ingresos e inversiones atrás. También podríamos fomentar el apoyo a la economía para sembrar discordia con otras facciones, o dejar la pregunta enteramente."
 france_md.218.a: "¡Apoyo social primero! Debemos defender a nuestros ciudadanos."
 france_md.218.b: "El planeta está degradando demasiado rápido para que nos sentemos ociosos."
 france_md.218.c: "Buena idea; los haremos pensar que los liberales están detrás de esto."
 france_md.218.e: "Que las otras partes se desgarren sobre esta cuestión."
 france_md.219.t: "Las personas eligen priorizar el apoyo social"
 france_md.219.d: "Después de largas horas, los ciudadanos finalmente acordaron el pilar social de la república. De hecho, al proteger a las personas comunes y sus empleos, garantizaremos una transición saludable hacia un futuro mejor. Además, es mejor que nuestras fábricas se construyan a estándares y contaminaciones aquí en lugar de ser trasladadas a países menos preocupados por esto. Este resultado no es una sorpresa ni malas noticias."
 france_md.219.a: "Otra pregunta a la que podríamos dar una respuesta; bien hecho."
 france_md.220.t: "La gente elige la ecología"
 france_md.220.d: "Este resultado no nos disgusta. De hecho, la salud del planeta fluye hacia la salud de sus habitantes. Por lo tanto, no es sorprendente e incluso beneficioso que este despertar ocurriera en múltiples niveles de la sociedad. Así tendremos que aprender a transformar nuestras formas de vivir y producir bienes y energía. El camino será extendido con obstáculos y no siempre servirá los intereses de la mayoría. Pero este es el camino que debemos seguir."
 france_md.220.a: "Todo lo que queda es reciclar a los que votaron por un gran negocio."
 france_md.221.t: "El pueblo elige economía"
 france_md.221.d: "Un resultado sorprendente, el del resultado de los debates de hoy. Así, la gente optó por proteger negocios de todo tipo para impulsar el desarrollo de este país. Uno puede ver que algunos todavía creen en la teoría descabellada. También se pudo haber adivinado que con los medios a menudo en manos de unos pocos oligarcas, harían todo lo posible para inclinar las escalas. Un día bastante decepcionante para nuestros activistas. Pero ahora no podemos cuestionar la opinión del pueblo soberano."
 france_md.221.a: "¿Le estaba pidiendo a la opinión de la gente una buena idea?"
 france_md.222.t: "Debate sobre la economía, Parte 2"
 france_md.222.desc: "Otras cuestiones sociales esperarán a futuras repúblicas, pero ahora podemos establecer la dirección constitucional: ¿quién debe pagar por nuestra cobertura social excepcional pero costosa? Lo que esta reforma decida ahora, sobre la tributación, financiación presupuestaria o recortes del gasto, dará forma a la columna vertebral financiera de nuestro estado de bienestar para generaciones."
 france_md.222.a: "¡Abajo el capitalismo!"
 france_md.222.b: "El estado financiará el sistema; haremos todo lo posible para evitar nuevos impuestos."
 france_md.222.c: "No podemos arriesgarnos a sacar a nuestros ciudadanos del trabajo."
 france_md.222.d: "Sería mejor no involucrarnos en este debate."
 france_md.223.t: "El pueblo elige el capital fiscal"
 france_md.223.d: "Los largos debates de las últimas semanas han terminado con nosotros victoriosos en esta confrontación ideológica. Será el capital y los ingresos de los más ricos que financiarán la cobertura social de la población. Este acto simbólico marca una gran victoria del pueblo contra el gran capital. Una victoria de Francia sobre la financiación es una victoria de todo el pueblo unido contra sus antiguos maestros. Nuestros debates sobre la economía están terminados por ahora, pero hemos preparado el terreno para las generaciones venideras. Así, en sólo algunas reformas, hemos hecho la revolución."
 france_md.223.a: "Una gran victoria para el pueblo francés."
 france_md.224.t: "El pueblo confirma el papel del Estado"
 france_md.224.d: "El resultado de los debates de la semana pasada es claro: la gente no quiere revertir la economía tal como está. ¿Esto es debido a la propaganda neoliberal con que son bombardeados todos los días en televisión? Probablemente, pero debemos aceptar su veredicto porque es el único que importa. Al menos logramos no alentar recortes a otros servicios estatales para financiar este, pero es posible que nuestros sucesores sean menos benevolentes hacia la sociedad para financiar nuestro sistema. Nos aseguraremos de que eso no ocurra."
 france_md.224.a: "No es realmente la victoria que esperamos, pero tendremos que hacerlo."
 france_md.225.t: "La gente elige cortar en otro lugar"
 france_md.225.d: "Si hubiéramos sabido que el veredicto sería así, tal vez no habríamos llevado este debate a la votación, pero es demasiado tarde para pensar en eso. De hecho, la gente acaba de decidir el destino de nuestro sistema social. Recomendaron que las legislaturas futuras preservaran los servicios estatales esenciales pero recortaran otros gastos estatales. Su objetivo principal probablemente será los empleados de la administración pública y muchos subsidios que no consideren esenciales. El sistema de protección social será financiado, pero acabamos de justificar el lobo del liberalismo que entra en las cuentas del estado. Mientras estemos en el poder, podremos prevenirlo, pero quién sabe qué harán los futuros gobiernos."
 france_md.225.a: "Esta reforma constitucional no va exactamente como estaba planeada."
 france_md.226.t: "Debate sobre cuestiones sociales Parte 1:"
 france_md.226.d: "El sistema francés de integración de las minorías ha descansado durante mucho tiempo en el ideal de fundición de la escuela republicana y la meritocracia, pero ese principio muestra sus límites: la disminución de la movilidad social alimenta el desempleo y la deriva comunitaria. El debate ahora gira en la reforma de este sistema. Empujar para un modelo más inclusivo corre el riesgo de perturbar un marco que ha prevalecido durante generaciones, pero dejarlo intacto sólo da a nuestros oponentes la oportunidad de endurecerlo en su lugar. De cualquier manera, nuestra elección aquí formará el país para las generaciones venideras."
 france_md.226.a: "Para permitir que tantas personas como sea posible tengan una vida mejor, el sistema debe ser más inclusivo."
 france_md.226.b: "Que los ciudadanos decidan esta pregunta por sí mismos."
 france_md.227.t: "Las personas eligen adaptar el sistema"
 france_md.227.d: "El resultado de los debates parece haberse movido hacia una adaptación del sistema actual a la diversidad inherente a nuestro nuevo milenio. Sin duda, tendremos que invertir recursos, pero nuestro sistema al permitir esta inclusión no será privado de los nuevos talentos que fluyen hacia nuestro país. Al dar a todos un futuro a su alcance, hemos ayudado a la pacificación al tiempo que estamos favoreciendo nuestro desarrollo a largo plazo."
 france_md.227.a: "Tenemos mucho que aprender de los demás."
 france_md.228.t: "La gente elige endurecer el sistema actual"
 france_md.228.d: "A pesar de nuestros esfuerzos, parece que la sociedad actual no está dispuesta a cuestionar los fundamentos de nuestra república. El sistema francés de integración parece tener un futuro brillante por delante. Esta votación confirma el apego de los franceses a un sistema que, a pesar de sus disfunciones, tiene el mérito de estar en su lugar. Este sistema siempre puede ser reformado a largo plazo, pero perdimos la oportunidad de derribar otra fortaleza."
 france_md.228.a: "A pity"
 france_md.229.t: "Debate sobre cuestiones sociales Parte 2:"
 france_md.229.d: "La libertad de culto es una de las cuestiones más importantes de nuestro milenio. Desde las leyes de laicidad de la Tercera República, Francia lo ha protegido ferozmente, incluso a costa de las libertades de los ciudadanos, sobre todo mediante la prohibición de símbolos religiosos en las escuelas primarias públicas, norma cada vez más en el centro de un tenso debate nacional. El establecimiento de este marco legal podría pacificar las relaciones entre las comunidades, pero significa cuestionar una ley fundamental que nuestros ciudadanos tienen querida."
 france_md.229.a: "Nuestra sociedad debe adaptarse a las necesidades de reconocimiento de las comunidades religiosas."
 france_md.229.b: "Que los ciudadanos decidan esta pregunta por sí mismos."
 france_md.230.t: "El pueblo elige relajar el secularismo"
 france_md.230.d: "Los debates sobre el secularismo han terminado a favor de la relajación del marco jurídico actual. El uso de símbolos religiosos eventualmente se normalizará en más lugares que antes. Las diversas religiones también tendrán derecho a una mayor representación en la sociedad, manteniendo al mismo tiempo la primacía del Estado y su separación de la religión. Esta es una victoria porque logramos mantener lo mejor de nuestro viejo sistema, asegurando que las partes más controvertidas se relajen. Sólo podemos esperar que esta violación de esta ley fundamental no lleve a un cuestionamiento progresivo de este marco protector para la libertad de culto. Podemos confiar en nuestros sucesores en este punto."
 france_md.230.a: "Esto debería ir bien."
 france_md.231.t: "El pueblo elige endurecer la ley del secularismo"
 france_md.231.d: "No esperábamos que la apertura de un debate sobre el secularismo produciría un sistema más estricto que el que teníamos. Fue un riesgo que valía la pena tomar, y lo tomamos. Los símbolos religiosos se tolerarán ahora incluso menos en las instituciones públicas. ¿Nuestros ancestros previeron que empujaríamos tan lejos en esa dirección? Estamos aquí ahora, y veremos dónde nos llevan estos cambios. Lo que es seguro es que nuestro ideal de tolerancia se ve más lejos que nunca."
 france_md.231.a: "Al menos la libertad de conciencia sigue garantizada."
 france_md.235.t: "Construyendo la República del Mañana"
 france_md.235.d: "Ahora que nuestro mandato está en marcha, es hora de lanzar nuestra promesa más esperada: la Sexta República. Esta nueva república, que queremos debatir en lugar de imponer, ocupará a nuestros ciudadanos durante meses mientras sientan las bases de la sociedad del mañana. Es posible que debamos dirigir el debate a veces para evitar la deriva, pero parece que hay demasiados riesgos que pierden la confianza del pueblo. Este proyecto debe llevarse hasta el final, y lo suficientemente rápido que nunca parece que estamos retrasando la democracia misma."
 france_md.235.a: "La Quinta República vive sus momentos finales"
 france_md.236.t: "La Sexta República fracasa"
 france_md.236.d: "Durante varias semanas, los espacios de debate se han quedado vacíos y el proyecto de la Sexta República está estancado, no de guerra o crisis sino de simple desinterés. Al tomar demasiado tiempo para organizar los debates y actuar sobre las contribuciones de nuestros ciudadanos, dejamos que el entusiasmo popular que galvanizamos muera. Nuestra oportunidad de cambiar el sistema ahora se está escapando. Todavía podemos impulsar parte de este trabajo como reformas ordinarias, pero sin el alcance que esperábamos, y no hemos podido remediar las injusticias construidas en nuestra constitución, la ley más alta de la tierra."
 france_md.236.a: "Perdimos la oportunidad de cambiar el sistema"
 france_md.238.t: "Francia nos coloca bajo el embargo"
 france_md.238.d: "Francia ha anunciado un embargo total contra nosotros, cubriendo todo desde entregas materiales al comercio ordinario. Desde la elección de La France Insoumise, París ha endurecido su retórica hacia nosotros sobre el tema palestino, acusando a nuestro gobierno de exacerbar los conflictos en la región, y ahora nos ha movido a bloquearnos por completo. Peor, están presionando al resto de Europa para seguir el traje. Nuestros socios comerciales europeos son esenciales y no podemos permitirnos que esta campaña tenga éxito."
 france_md.238.a: "No convencerán a mucha gente."
 france_md.239.t: "Francia nos pide que pongamos al Estado de Israel bajo embargo"
 france_md.239.d: "Tras la decisión de Francia de imponer el estado de Israel bajo embargo, diplomáticos franceses nos han contactado para instarnos a hacer lo mismo. Ellos citan como justificación la política agresiva del estado de Israel hacia sus vecinos, la desestabilización de la región que resulta y la situación humanitaria allí. Estos argumentos no carecen de mérito, y una parte significativa de nuestro electorado los apoya. Sin embargo, tales acciones corren el riesgo de costarnos a nivel internacional, y además no tenemos interés geopolítico en alejarnos de nuestro aliado israelí. ¿Qué debemos decidir?"
 france_md.239.a: "Naturalmente, el estado de Israel debe frenar su política expansionista"
 france_md.239.b: "No abandonaremos a nuestros socios israelíes"
 france_md.240.t: "Francia se propone ayudar a estabilizar nuestra nación"
 france_md.240.d: "Después de un siglo de colonización y décadas de neocolonialismo, parece que la política de Francia en África ha cambiado de rumbo. Proponen ayudar a estabilizar nuestro país asegurando que reduzcan su control sobre él. Esta noticia parece ser una bendición, y nuestro país necesita esta ayuda más que nunca. Sin embargo, es probable que esta ayuda venga con las promesas necesarias de paz yendo de la mano con una relajación dentro de la población. Nuestro ex colonizador parece haber reflejado ahora las consecuencias de sus acciones. ¿Deberíamos hacer lo mismo?"
 france_md.240.a: "La ayuda siempre es bienvenida"
 france_md.240.b: "No los necesitamos; ya no son nada aquí."
 france_md.244.t: "Francia impulsa la legislación social"
 france_md.244.d: "Tras la victoria de La France Insoumise en Francia, se escuchan muchas voces en nuestro país pidiendo la adopción de leyes similares a las adoptadas en Francia. El éxito de una ruptura de izquierda en Francia parece arrojarse sobre nosotros y otros países de la Unión Europea. En todos los países, los movimientos están organizando para exigir las mismas innovaciones legislativas que nuestros vecinos franceses. La mayoría de estas propuestas se refieren especialmente a los derechos humanos, la justicia social y la ecología. ¿Deberíamos aceptar y adoptar estas leyes para nosotros mismos? Esto podría ser beneficioso para nuestros conciudadanos."
 france_md.244.a: "Estas leyes podrían ser una buena adición a nuestra constitución"
 france_md.244.b: "No, eso no será posible."
 france_md.245.t: "Francia impulsa la legislación ecológica"
 france_md.245.d: "La victoria de los ecologistas en Francia envió una onda de choque a través de Europa: un miembro fundador de nuestra Unión ahora insta a la legislación climática sobre la narrativa del libre comercio y crecimiento que se construyó la UE. Los activistas ya han comenzado a transmitir este impulso a nuestro propio país. ¿Debemos adoptar parte de su agenda, un gesto a nuestras fuerzas progresistas pero una atracción hacia el desarrollo económico, o tomar una posición clara antes de que la situación siga avanzando en su dirección sin nosotros?"
 france_md.245.a: "También debemos protegernos del cambio climático."
 france_md.245.b: "¿Qué cambio climático?"
 france_md.246.t: "Una Francia verde toma la comisión"
 france_md.246.d: "Después de la última votación para nombrar a la Comisión Europea, parece que la ecología ha pasado el día. Después de la victoria de los Ecologistas en Francia, Europa Ecología, los Verdes, se ha elevado al más alto nivel de la Unión Europea, un signo llamativo de la creciente marcha de la Unión hacia las cuestiones climáticas. Más allá de la conciencia de nuestros ciudadanos, esta victoria fortalece su confianza en una Europa que toma en serio su seguridad climática."
 france_md.246.a: "¿Nos dirigimos hacia una Europa verde?"
 france_md.248.t: "Los diputados ecologistas multiplican las acciones en el Parlamento Europeo"
 france_md.248.d: "Desde su elección en Francia, los diputados ecologistas aparentemente se han multiplicado en el Parlamento Europeo. Parecería que estamos presenciando un resurgimiento de interés en cuestiones ecológicas en los Estados miembros de la Unión Europea. Este número de diputados, que parece estar creciendo en importancia, parece estar formando cada vez más el equilibrio del poder en el Parlamento Europeo hasta el punto de convertirse en una apuesta para las próximas comisiones europeas. Esta creciente influencia de los ecologistas en la Unión Europea también parece extenderse a nuestro país, donde influye no sólo en la popularidad de nuestros partidos ecológicos sino que fortalece la confianza en una Unión Europea más atenta a las cuestiones sanitarias y ecológicas."
 france_md.248.a: "No lograrán mucho en el Parlamento Europeo."
 france_md.249.t: "Francia propone un Fondo de Transición Verde"
 france_md.249.d: "Esta vez nuestros amigos franceses vinieron con una nueva propuesta sobre la mesa. Nos proponen la creación de un fondo participativo entre países europeos para ayudar con la transición ecológica en los países europeos. Este fondo debe permitirnos desarrollar nuestro sector energético con energía verde si es posible. Destacan esta herramienta como una forma de confirmar nuestra soberanía energética y modelarla de manera sostenible. Esta herramienta, sin embargo, vendría con una mayor movilización de nuestro sector civil a favor de estas inversiones. ¿Deberíamos participar?"
 france_md.249.a: "¿Dónde firmamos?"
 france_md.249.b: "No gracias, lo estamos haciendo muy bien por nuestra cuenta"
 france_md.250.t: "Francia propone reducir las emisiones europeas de carbono"
 france_md.250.d: "Nuestros amigos ecologistas franceses han regresado con una propuesta de reducción drástica de las emisiones de carbono, ofrecidas a nosotros y a nuestros vecinos al igual que la UE finaliza su Green Deal. Argumentan que la reducción del consumo de combustibles fósiles permitiría a nuestro pueblo respirar más fácil y construir la soberanía energética de la Unión, ya que ninguno de nuestros países produce petróleo propio. Esta reestructuración sería costosa y lenta, pero podría ser decisiva si las tensiones con Rusia, nuestra principal fuente de combustibles fósiles, alguna vez se hirieran."
 france_md.250.a: "Tienen razón; los combustibles fósiles nos hacen vulnerables"
 france_md.250.b: "No veo en qué mundo podríamos estar en desacuerdo con Rusia."
 france_md.251.t: "Interferencia de Francia en nuestra política comercial"
 france_md.251.d: "Nuestro embajador en Francia informa que la presidencia quiere que regulemos nuestro sector alimentario: algunos de nuestros productos, afirman, no son aptos para el consumo, especialmente carne producida con moléculas de crecimiento prohibidas en la UE. No cumplir con las medidas proteccionistas de riesgo contra nuestros bienes y la presión sobre el resto de la Unión para seguir, aunque la propia industria agroalimentaria de Francia claramente tiene un interés en marcar nuestra competencia desleal de exportación. La regulación permitiría que nuestra propia gente se beneficiara más de la agricultura, pero sería un obstáculo para el crecimiento del sector agroalimentario."
 france_md.251.a: "Ellos tienen razón; estos reglamentos son necesarios"
 france_md.251.b: "Puse lo que quiero en mi ganado."
 france_md.252.t: "Francia se propone establecer barreras aduaneras contra Brasil"
 france_md.252.d: "Nuestro socio francés nos insta a prohibir las importaciones brasileñas por una disputa que nace de la negativa del Brasil de aplicar las restricciones sanitarias europeas a su producción agroalimentaria, dejando los alimentos sudamericanos más baratos pero con mayor probabilidad contener productos peligrosos para nuestros ciudadanos. Las industrias europeas llaman a esta competencia injusta; los financieros lo llaman libre comercio. Está claro que la propia industria alimentaria francesa ha alimentado la queja, pero el riesgo de salud para nuestro pueblo es real todo lo mismo."
 france_md.252.a: "Ellos tienen razón; es competencia injusta"
 france_md.252.b: "¿Qué hay del libre comercio en todo esto?"
 france_md.253.t: "Interferencia de Francia en nuestra política comercial"
 france_md.253.d: "Nuestro embajador en Francia informa que la presidencia quiere que regulemos nuestro sector manufacturero y extractivo: gran parte de nuestra producción ignora los estándares industriales europeos, sin embargo inunda su mercado, y sus industrias llaman a la competencia de desequilibrio comercial resultante. Necesitamos a Europa como socio comercial, y rechazar sus normas corre el riesgo de imponer restricciones a nuestras mercancías que nos harían daño mucho más. Complying nos permitiría producir más responsablemente para nuestro pueblo y planeta, pero limitaría el crecimiento de nuestro sector industrial."
 france_md.253.a: "No podemos perder a nuestros socios europeos"
 france_md.253.b: "Necesitan estos productos baratos y lo saben."
 france_md.254.t: "Francia se propone establecer barreras aduaneras contra China"
 france_md.254.d: "Nuestro socio francés nos insta a prohibir las importaciones chinas sobre una disputa que nace de la negativa de China a aplicar las restricciones industriales de Europa a su propia producción, dejando productos manufacturados y materias primas más baratas pero más probables producidas en condiciones cuestionables. Las industrias europeas llaman a esta competencia injusta; los financieros lo llaman libre comercio. Está claro que el propio sector industrial de Francia ha alimentado la queja, pero el daño que estos productos causan al planeta y nuestras industrias son reales todo lo mismo."
 france_md.254.a: "Ellos tienen razón; es competencia injusta"
 france_md.254.b: "¿Qué hay del libre comercio en todo esto?"
 france_md.255.t: "Interferencia de Francia en nuestra política comercial"
 france_md.255.d: "Nuestro embajador en Francia informa que la presidencia quiere que regulemos nuestro sector de extracción y refinación de petróleo: gran parte de nuestra producción ignora las normas europeas de extracción e industria, pero inunda su mercado, y sus industrias llaman a la competencia de desequilibrio comercial resultante. Necesitamos Europa, y rechazar sus normas corre el riesgo de imponer restricciones a nuestras mercancías que nos harían daño mucho más. Complying nos permitiría producir más responsablemente para nuestro pueblo y planeta, pero limitaría el crecimiento de nuestras compañías petroleras."
 france_md.255.a: "No podemos perder a nuestros socios europeos"
 france_md.255.b: "Buena suerte calentarse este invierno."
 france_md.256.t: "Francia se propone establecer barreras aduaneras contra Rusia"
 france_md.256.d: "Nuestro socio francés nos insta a restringir las importaciones de hidrocarburos rusos sobre una disputa que nace de la negativa de Rusia a aplicar las regulaciones de extracción y refinación europeas, produciendo combustible en condiciones deplorables para el planeta. Algunos sectores extractivos europeos llaman a esta competencia injusta y quieren menos dependencia de las potencias extranjeras, pero Rusia puede suponer menos amenaza de lo que pensamos, y sus normas laxas mantienen nuestros costos de combustible."
 france_md.256.a: "Ellos tienen razón; debemos restringir nuestra dependencia del combustible"
 france_md.256.b: "¿Qué hay del libre comercio en todo esto?"
 france_md.257.t: "Francia propone la creación de un gran plan alrededor del ferrocarril"
 france_md.257.d: "Nuestros socios franceses han regresado con un nuevo proyecto: reorientar el flete de Europa en lugar de camiones, una idea impulsada por los ecologistas franceses para hacer que el transporte de mercancías sea más eficiente y ecológico. Se necesitaría una red ferroviaria eficiente y unificada, algo que hoy nos falta, con desajustes como el diferente calibrador ferroviario de España que todavía frena el movimiento transfronterizo. Dado que la circulación de mercancías es central en la Unión, y la red también podría facilitar el movimiento de las personas, esto vale la pena continuar, incluso si resulta costoso contra un sector de transporte por carretera que ya está prosperando."
 france_md.257.a: "Contárnoslo."
 france_md.257.b: "Prefiero mi camión."
 france_md.258.t: "La victoria de los comunistas en Francia perturba nuestra política interna"
 france_md.258.d: "La victoria del Partido Comunista Francés envió una onda de choque a través de Europa: un miembro fundador de una Unión construida en oposición al bloque comunista está instando ahora a su propio pueblo a unirse a la lucha, reviviendo los temores de la URSS que muchos países pensaron durante mucho tiempo enterrado. Los activistas ya han comenzado a transmitir este impulso a nuestro propio país. ¿Debemos adoptar parte de su agenda para reducir la ola de protesta corta, un gesto a nuestras fuerzas progresistas pero una atracción hacia el desarrollo económico, o tomar una posición clara antes de que la situación se mueva más sin nosotros?"
 france_md.258.a: "No es una mala idea."
 france_md.258.b: "Mejor muerto que rojo"
 france_md.259.t: "Una mano extendida por la Francia comunista"
 france_md.259.d: "Desde su creación, nuestro estado no ha dejado de estar bajo el dominio de Rusia o temerlo. Sin embargo, parece que esta ayuda de tiempo está lista para llegar. De hecho, los diplomáticos franceses nos han propuesto una alianza estratégica para preparar la posibilidad de un conflicto con Rusia. Por ahora no es mucho: algunos papeles, algún equipo, pero sobre todo es la promesa de apoyo a venir. Lo más sorprendente es que este apoyo viene de la Francia comunista. Lo cual no es sin recordar la opresión que sufrimos de los soviéticos en un momento en que el PCF era estalinista. ¿Podemos confiar en Francia y Europa sabiendo que esto sólo endurecerá la posición de Rusia hacia nosotros?"
 france_md.259.a: "Esta asociación es nuestra salvación"
 france_md.259.b: "Somos capaces de cuidarnos."
 france_md.260.t: "Francia propone su ayuda contra Rusia"
 france_md.260.desc: "Unas décadas libres de la opresión soviética no han dejado de temer el regreso de Rusia, pero Francia ha ofrecido ayuda en caso de conflicto, compartiendo nuestro temor de que el expansionismo ruso pueda volver a dirigirse hacia Europa oriental. Sus propuestas van desde préstamos de equipo a intercambios de habilidades, ayuda que podría darnos una oportunidad de lucha antes de que la OTAN se mobilice alguna vez, aunque sólo si la OTAN y Europa vienen a nuestra ayuda. Aceptar dañaría las relaciones con Moscú; quizás preservarlas es nuestro camino más seguro."
 france_md.260.a: "Sólo necesitamos equipo para mantener a los rusos a distancia"
 france_md.260.b: "Necesitamos entrenamiento para conducir una guerra de alta intensidad"
 france_md.260.c: "Tendremos que producir más armamentos a largo plazo"
 france_md.260.d: "No necesitamos ayuda, Rusia no es nuestro enemigo."
 france_md.261.t: "Francia se propone formar nuestra Alianza"
 france_md.261.desc: "El triunfo de un antiguo partido estalinista en Francia plantea la cuestión de las relaciones con un potencial aliado en Europa occidental, que ha expresado hostilidad hacia Occidente y hacia los estadounidenses y ha mostrado cercanía ideológica a la antigua URSS, incluso llamando su legado positivo. París ha multiplicado las declaraciones que denuncian al imperialismo estadounidense y a la ceguera europea en seguirlo, y ahora propone cooperación que podría abarcar desde el comercio hasta una alianza militar y estratégica completa, si juzgamos su antigua lealtad soviética lo suficiente como para hacerlos dignos de confianza."
 france_md.261.a: "Siempre es un placer hacer negocios contigo"
 france_md.261.b: "De hecho, debemos protegernos del imperialismo norteamericano."
 france_md.261.c: "Nada separará la hermandad comunista"
 france_md.261.d: "No cooperamos con los comunistas"
 france_md.262.t: "Rusia está de acuerdo en ampliar las relaciones comerciales con nosotros"
 france_md.262.d: "Rusia ha respondido positivamente a nuestra propuesta de ampliar las relaciones. Se han ofrecido a compartir sus conocimientos industriales y extractivos con nosotros a condición de que les ayudemos a establecer sus sectores nucleares y terciarios. Este es un avance importante en nuestras relaciones con Rusia. Sin embargo, nuestras propuestas para una posible asociación estratégica se han reservado. Es probable que Rusia todavía no nos conceda suficiente crédito, pero este primer paso en nuestra dirección es algo bueno. Tomará tiempo, pero este acuerdo es el comienzo del fin para los imperialistas."
 france_md.262.a: "La confianza siempre se construye a largo plazo"
 france_md.263.t: "Rusia está de acuerdo en establecer una asociación militar y comercial con nosotros"
 france_md.263.d: "Rusia ha respondido positivamente a nuestra propuesta de ampliar las relaciones. Se han ofrecido a compartir sus conocimientos industriales y extractivos con nosotros a condición de que les ayudemos a establecer sus sectores nucleares y terciarios. Este es un avance importante en nuestras relaciones con Rusia. Rusia ha propuesto además ampliar esta asociación con un componente militar diseñado para capacitarnos conjuntamente para estar listos cuando la amenaza imperialista se mueva a la acción. Nos proporcionarán terrenos de entrenamiento y su experiencia en la tundra, y les daremos acceso a nuestra experiencia en la guerra del desierto y la selva."
 france_md.263.a: "Juntos somos imparables"
 france_md.264.t: "Rusia propone una alianza"
 france_md.264.d: "No esperábamos una respuesta tan positiva de nuestro socio ruso. Han propuesto que formemos una alianza contra el imperialismo occidental. Combinando elementos económicos y geoestratégicos, esta alianza nos permitirá prepararnos económicamente, militarmente y diplomáticamente para una confrontación con Occidente. Intercambiaremos nuestros conocimientos y tradiciones industriales, así como nuestras bases de formación y una garantía de asistencia mutua en caso de conflicto. No habíamos concluido tal alianza con ellos desde la Primera Guerra Mundial; quizás es un mal presagio. Esta alianza es, sin embargo, muy bienvenida y nos permitirá sobrevivir en un mundo en gran medida hostil al comunismo."
 france_md.264.a: "El imperialismo occidental será impotente contra nosotros"
 france_md.265.t: "Rusia se niega a ampliar las relaciones con nosotros"
 france_md.265.d: "A la gran sorpresa de nuestros diplomáticos, Rusia parece estar disminuyendo cualquier forma de cooperación con la República Francesa. Divergentes intereses. Falta de confianza. Parece que la memoria de la URSS está lejos de ellos. Tal vez la corrupción occidental finalmente ha llegado a Rusia, que fue una vez el baluarte contra el imperialismo estadounidense. Una cosa es cierta: estamos solos, solos en una Europa que no nos entiende y siempre será hostil a nosotros."
 france_md.265.a: "¡Somos los verdaderos comunistas!"
 france_md.266.t: "Francia se enfrenta a la UE sobre inmigración"
 france_md.266.d: "Nuestros colegas del Frente Nacional han liderado a Francia desde hace meses, y desde que asumió el cargo han criticado continuamente las políticas migratorias de Europa como demasiado indulgentes. Las fuerzas liberales y socialistas han silenciado nuestra voz en esto dentro de la Unión, pero con nuestros aliados ahora triunfantes en París, ya no pueden ignorarnos. Nuestra propia gente, habiendo abrazado los ideales nacionalistas mismos, acoge esta victoria como prueba de que nuestra voz estaba en lo cierto todo a lo largo de una Europa que había perdido su camino."
 france_md.266.a: "Es el comienzo del fin para los liberales"
 france_md.267.t: "Francia se enfrenta a la UE sobre inmigración"
 france_md.267.d: "Desde la victoria del Frente Nacional en Francia, las críticas han entrado al Parlamento Europeo y el cambio parece haber desencadenado una ola a través de la política europea como partidos nacionalistas y euroescépticos registran cada vez más resultados. El debate se centra en la inmigración, y los parlamentarios reflejan cada vez más una opinión pública que gira hacia una visión nacionalista de la política interna, denunciando lo que ven como una política excesivamente indulgente. Nuestro propio electorado no es una excepción, y el levantamiento que Francia ha causado está empezando a sacudirlo también. ¿Deberíamos luchar contra esta deriva nacionalista o aceptar la nueva orientación europea mientras toma forma?"
 france_md.267.a: "Pero tienen razón."
 france_md.267.b: "Europa ya ha pagado el precio del nacionalismo"
 france_md.268.t: "Francia gana su caso en Bruselas"
 france_md.268.d: "La política política francesa ha dado un nuevo giro: a pesar de su histórico euroescepticismo, el partido ha llegado a un acuerdo con la Unión Europea, utilizando campañas de Euroscepticismo en casa y entre aliados para convencer a Bruselas del peligro que plantearon, y ahora utiliza ese apalancamiento para obligar a la UE a deportar migrantes ilegales. Es un éxito real para su presidencia. Nuestro propio gobierno nacionalista se enfrenta a la misma cuestión de soberanía: ¿deberíamos buscar ventajas en la UE a cambio de relajar nuestro propio euroescepticismo, sabiendo que gran parte de nuestro partido ve esa postura como un valor fundador?"
 france_md.268.a: "Por qué negociar cuando podemos simplemente salir de Europa."
 france_md.268.b: "Es inteligente, deberíamos hacer lo mismo."
 france_md.269.t: "Francia aboga por una identidad europea"
 france_md.269.d: "Habiendo ganado concesiones sobre la migración desde Bruselas, el liderazgo de Francia ahora parece estar abandonando su retórica euroescéptica en conjunto, incluso promoviendo la adhesión a la Unión Europea siempre y cuando se mantenga alejada de las tendencias liberales y socialistas. Los movimientos nacionalistas parecen multiplicarse dentro de la propia Unión, haciendo que una Europa de las Naciones vuelva a ser atractiva, aunque tal cambio podría perturbar a los votantes apegados al rechazo absoluto de la UE. ¿Deberíamos seguir el liderazgo de Francia, especialmente si el liderazgo de la UE sigue a la deriva en nuestro camino?"
 france_md.269.a: "Esta es una iniciativa muy buena"
 france_md.269.b: "Uno no puede ser nacionalista y europeo al mismo tiempo"
 france_md.270.t: "Francia se propone invertir en nuestra defensa"
 france_md.270.d: "En los últimos años, la posibilidad de una nueva guerra en el continente europeo parece más posible que nunca. Aunque nuestra Unión aún no ha sufrido ninguna agresión, las acciones de nuestro vecino ruso parecen confirmar esta preocupación. Francia ha venido a nosotros con una oferta: proponen ayudarnos a construir nuestro complejo militar-industrial invirtiendo en él. Con estas fábricas de armas, podríamos prepararnos para un día en que debemos luchar por nuestro país y nuestros socios europeos. Sin embargo, permitirles invertir en nuestro armamento nos haría depender más de ellos, lo que puede no ser una buena idea. Además, nuestra población pacifista podría preocuparse por tal movilización de nuestro capital."
 france_md.270.a: "Gracias por esta ayuda crucial"
 france_md.270.b: "No hay razón para Worry"
 france_md.271.t: "Francia reconoce nuestras reivindicaciones en Ucrania"
 france_md.271.d: "Desde que el poder en Francia pasó al Frente Nacional, han crecido cada vez más favorables para nosotros, rompiendo con una Europa que siempre se ha opuesto a nuestras ambiciones hacia el este. No sólo han hablado a favor de nuestras reivindicaciones en territorio ucraniano, nos han ofrecido acceso a su territorio y puertos para trasladar tropas y bienes, alivian nuestra logística y recortan cualquier embargo europeo futuro. Este nuevo aliado nos confirma en el camino hacia la guerra que aún podríamos emprender."
 france_md.271.a: "Las Primeras Cataratas Domino"
 france_md.271.b: "No tenemos intención de luchar contra nuestros hermanos ucranianos"
 france_md.272.t: "Francia se propone ampliar nuestra cooperación"
 france_md.272.desc: "Después de muchas declaraciones y acuerdos a nuestro favor, Francia parece dispuesta a ampliar las relaciones con nosotros, presentándose como defensora de la moralidad y la fe en una Europa y Occidente que ahora considera decadente. Nuestras relaciones podrían progresar desde el comercio hasta una asociación militar y estratégica completa, si vemos suficiente potencial en este nuevo aliado, o podemos declinar si todavía contamos con buenas relaciones con la Unión Europea tal como está."
 france_md.272.a: "Nuestra economía se beneficiará"
 france_md.272.b: "Nuestra economía y nuestros ejércitos se beneficiarán"
 france_md.272.c: "El mundo temblará ante nosotros"
 france_md.272.d: "No pretendemos cooperar con Francia"
 france_md.273.t: "Rusia está de acuerdo en ampliar las relaciones comerciales con nosotros"
 france_md.273.d: "Rusia ha respondido positivamente a nuestra propuesta de ampliar las relaciones. Se han ofrecido a compartir sus conocimientos industriales y extractivos con nosotros a condición de que les ayudemos a establecer sus sectores nucleares y terciarios. Este es un avance importante en nuestras relaciones con Rusia. Sin embargo, nuestras propuestas para una posible asociación estratégica se han reservado. Es probable que Rusia todavía no nos conceda suficiente crédito, pero este primer paso en nuestra dirección es algo bueno. Tomará tiempo, pero este acuerdo es el comienzo del fin para los ultraglobalistas."
 france_md.273.a: "La confianza siempre se construye a largo plazo"
 france_md.274.t: "Rusia está de acuerdo en establecer una asociación militar y comercial con nosotros"
 france_md.274.d: "Rusia ha respondido positivamente a nuestra propuesta de ampliar las relaciones. Se han ofrecido a compartir sus conocimientos industriales y extractivos con nosotros a condición de que les ayudemos a establecer sus sectores nucleares y terciarios. Este es un avance importante en nuestras relaciones con Rusia. Rusia ha propuesto además ampliar esta asociación con un componente militar diseñado para capacitarnos conjuntamente para estar listos cuando la amenaza ultraglobalista se mueva a la acción. Nos proporcionarán terrenos de entrenamiento y su experiencia en la tundra, y les daremos acceso a nuestra experiencia en la guerra del desierto y la selva."
 france_md.274.a: "Juntos somos imparables"
 france_md.275.t: "Rusia propone una alianza"
 france_md.275.d: "No esperábamos una respuesta tan positiva de nuestro socio ruso. De hecho, han propuesto que formemos una alianza que garantice la asistencia mutua en caso de agresión por parte de las potencias extranjeras. Combinando elementos económicos y geoestratégicos, esta alianza nos permitirá prepararnos económicamente, militarmente y diplomáticamente para una confrontación con el resto del mundo. Esta alianza nos dará la fuerza para luchar hasta el final para defendernos contra el ultraglobalismo en el que nuestros vecinos han hundido. No habíamos concluido tal alianza con ellos desde la Primera Guerra Mundial; quizás es un mal presagio. Esta alianza es, sin embargo, la más bienvenida y un éxito importante para nuestra política."
 france_md.275.a: "Estamos protegidos contra la decadencia liberal"
 france_md.276.t: "Rusia se niega a ampliar las relaciones con nosotros"
 france_md.276.d: "A la gran sorpresa de nuestros diplomáticos, Rusia parece estar disminuyendo cualquier forma de cooperación con la República Francesa. Divergentes intereses. Falta de confianza. Tal vez la corrupción occidental finalmente ha llegado a Rusia, que fue una vez fuerte y orgulloso. Esta inversión no es, sin embargo, dramática; tal vez no teníamos tanto en común después de todo. Seguramente encontraremos otros aliados nacionalistas en el continente."
 france_md.276.a: "That's a shame"
 france_md.277.t: "Francia se propone protegernos contra la influencia rusa"
 france_md.277.d: "Durante varios años, los rusos parecen haber invertido en el continente africano, ofreciendo sus servicios para luchar contra las insurrecciones yihadistas e independentistas que florecen en los países del ex África francesa. Francia y Rusia están claramente en un conflicto de influencia en este continente. Con ellos, los valores chocan: liberalismo occidental y autoritarismo. En esta situación donde los países africanos somos blancos de influencia rusa, que a veces puede empeorar las tensiones entre las minorías regionales, Francia propone ayudarnos a reducir su presencia al ayudarnos en su lugar. Sin embargo, esto significa acercarse a nuestros antiguos colonizadores, lo que puede no ser una buena idea. ¿Qué debemos decidir?"
 france_md.277.a: "Ellos tienen razón; La influencia rusa es peligrosa"
 france_md.277.b: "Nuestros ex-colonisores. Claro que no."
 france_md.278.t: "La Comuna Francesa deja a la Unión Europea"
 france_md.278.d: "Hace unos meses, Francia anunció el fin de la república a favor de la Comuna Francesa, una nueva entidad fundada en el comunismo revolucionario, y no tardó mucho en dejar nuestra Unión Europea, construida como lo es en el liberalismo económico que ahora rechaza su nueva orientación. La salida fue inmediata y definitiva, sin intención aparente de negociar. Esto es malo para un continente cuya Unión existió sobre todo para prevenir nuevos conflictos, y una salida abrupta junto con tan revolucionaria tendrá que enfrentarse tarde o temprano."
 france_md.278.a: "Eso se espera"
 france_md.279.t: "Las Presiones Comunitarias Francesas Nuestra Política"
 france_md.279.d: "Como se predijo, la salida de la Comuna Francesa de la Unión Europea no fue un callejón sin salida; apenas libres de ella, ya están reviviendo su economía, y su éxito está empezando a ganar admiración de aquellos en casa que carecen mucho amor por los valores europeos liberales. La inteligencia francesa, reconfigurada en un servicio internacional de propaganda, está ayudando a entrenar a estos agitadores, y debemos tomar esto seriamente antes de que terminemos en su posición. Podemos defender los valores europeos y la paz que traen, o igualar su agenda nosotros mismos para reprimir la violencia venidera, aunque eso significa abrazar la política comunista antieuropea."
 france_md.279.a: "Sin puntos de lucha si podemos vencerlos en su propio juego"
 france_md.279.b: "Debemos luchar contra estos extremistas"
 france_md.280.t: "La Comuna Francesa nos invita a una Cumbre sobre la Revolución Mundial"
 france_md.280.d: "Habiendo asegurado el control en casa, los comunistas revolucionarios de Francia ahora tienen la intención de exportar su revolución, invitándonos a una cumbre sobre la revolución mundial porque nuestro propio gobierno ya se ha aliado con los valores comunistas que la nueva Comuna Francesa tiene querida. Están decididos a difundir estos valores en todo el mundo, y esta invitación es seguramente una prueba de si seguiríamos. Tal revolución no vendrá sin guerra, probablemente sangrienta, dado que muchos grandes poderes nunca la aceptarán. Los ideales comunistas son queridos para nosotros, pero ¿estamos listos para arriesgar la vida de nuestros ciudadanos para lograrlos?"
 france_md.280.a: "Contáctanos, vivamos la revolución."
 france_md.280.b: "La historia ha demostrado que la libertad no está traída en Gunpoint"
 france_md.281.t: "El Emperador lleva a cabo profundas reformas de las Fuerzas Armadas Francesas"
 france_md.281.d: "Nuestro Emperador ha emprendido profundas reformas de nuestras fuerzas armadas, con el objetivo de hacerlas más adaptables a las guerras que podemos llevar a la lucha. Llevar esto exige una inversión pesada y nuestra plena atención, dejando menos espacio para la disponibilidad inmediata, por lo que creceremos más vulnerables durante un tiempo antes de que podamos reanudar la construcción de nuestras fuerzas. Esta primera oleada apunta a la dirección del ejército misma, encontró inadecuado para las reformas venideras, y la refactorización de la cadena de mando debe tomar algo menos de un año, en el que debemos limitar nuestras operaciones militares para obtener ganancias a largo plazo."
 france_md.281.a: "Estas reformas son necesarias"
 france_md.282.t: "Nuestras Reformas Generales del Personal están completas"
 france_md.282.d: "Nuestras reformas se han completado en tiempo récord. Algunos se resistieron, pero la mayoría de nuestro personal general aceptó la refactorización de la cadena de mando. Más allá de hacer que nuestro liderazgo sea más eficiente, estas reformas abren la puerta a nuevos generales talentosos, a costa de un entrenamiento más avanzado, y son sólo el primer ladrillo en transformar nuestras fuerzas armadas. En los próximos meses, nuevas reformas definirán los medios y objetivos de nuestras fuerzas y darán a nuestro complejo militar-industrial un libro de orden más claro. Fue una apuesta a largo plazo, y parece que la hemos ganado."
 france_md.282.a: "Hemos sido firmes. Ahora podemos seguir adelante a asuntos más importantes"
 france_md.283.t: "La columna vertebral de nuestro ejército"
 france_md.283.d: "Ha llegado el primer conjunto de reformas relativas a nuestro enfoque del campo de batalla, definiendo la estrategia que debemos emplear en cualquier conflicto a gran escala contra un futuro adversario. Desde nuestra refactorización posterior a la Segunda Guerra Mundial, nuestros ejércitos siempre han favorecido estrategias ofensivas basadas en la movilidad y la maniobra, y podríamos profundizar que centrándonos en nuestras órdenes de doctrina y equipo sobre tanques de asalto y captura rápida del objetivo. La alternativa es centrarse en la infantería, reforzando su papel y equipo para responder contraataques enemigos con potencia de fuego superior, un enfoque más seguro pero que cuestionaría nuestra doctrina anterior."
 france_md.283.a: "La infantería siempre ha jugado un papel central; Es el enfoque más seguro"
 france_md.283.b: "Nuestro ejército ha sido construido alrededor de una guerra de movimiento desde la Guerra Fría, y no hay razón para que eso cambie"
 france_md.284.t: "Nuestra fuerza de fuego"
 france_md.284.d: "Ha llegado una última ola de reforma doctrinal, obligándonos a decidir cómo nuestro ejército destruye las fuerzas enemigas. Tenemos artillería y aviación equilibradas desde hace mucho tiempo, pero el camino por delante exige especialización. Nuestros cañones César son móviles y efectivos, dejándonos bombardear tropas enemigas de seguridad. Nuestras fuerzas aéreas y helicópteros ofrecen una fuerza de fuego versátil, pero siguen siendo vulnerables a la defensa del aire enemiga, y perder el control de los cielos podría resultar desastroso. Debemos elegir entre un riesgo mínimo y una mayor potencia de fuego."
 france_md.284.a: "La artillería es más económica"
 france_md.284.b: "Nuestra aviación es altamente eficaz; sería tonto no utilizarla"
 france_md.285.t: "Nuestra posición con respecto a la Unión Europea"
 france_md.285.d: "Durante demasiado tiempo, nuestra nación priorizó a la Unión Europea sobre su propio desarrollo. Dejar de lado nuestro desarrollo y seguridad nos llevó a una crisis democrática sin precedentes, de la que emergimos victoriosos. Pero hoy tenemos la oportunidad de revertir esta tendencia. Liberados de instituciones democráticas pasadas, somos libres de tomar nuestras propias decisiones y podemos dejar la Unión Europea si lo deseamos. Sin embargo, salir de la noche a la mañana podría golpear un duro golpe a nuestra nación sólo recuperándose de la opresión liberal. ¿Debemos negociar con la Unión Europea para monetizar nuestro regreso entre ellos, o deberíamos sellar nuestra ruptura con ellos completando nuestra salida de la Unión Europea?"
 france_md.285.a: "¡Los bolsillos vacíos de Bruselas o nos vamos!"
 france_md.285.b: "La Unión Europea nos ha hecho bastante daño. ¡Frexit!"
 france_md.286.t: "Francia deja a la Unión Europea"
 france_md.286.d: "Tras una gran convulsión en nuestro estado socio francés, los movimientos nacionalistas que afirman el bonapartismo han tomado el control de Francia. Inmediatamente, han trabajado para destruir los restos del sentimiento proeuropeo dentro de Francia. Ahora anuncian la salida de Francia de la Unión Europea. Han demostrado una negativa categórica a negociar. La victoria de estos movimientos nacionalistas no es simplemente una fisura en el proyecto europeo de construcción, sino un modelo para los euroescépticos en toda la Unión."
 france_md.286.a: "El nacionalismo es un peligro para nuestra Unión Europea"
 france_md.287.t: "La Unión Europea se inclina a nuestras demandas"
 france_md.287.d: "Parece que tomamos la decisión correcta al negociar nuestro regreso a las instituciones europeas. No sólo hemos evitado una crisis económica, sino que también hemos extraído fondos del Banco Central Europeo. ¡Esto es lo que uno podría llamar una operación financiera exitosa! No hay duda de que eventualmente enfrentaremos a nuestros socios en el campo de batalla, pero déjalos sorbos en el engaño. Una cosa es cierta: nuestros adversarios deben estar furiosos de que nuestras negociaciones con el BCE hayan tenido éxito."
 france_md.287.a: "Nuestro tiempo vendrá"
 france_md.288.t: "Nuestras negociaciones fracasan"
 france_md.288.d: "Nuestro intento fue audaz pero no tuvo éxito. Tal vez pedimos demasiado, o no inspiramos confianza en nuestros interlocutores europeos. En todo caso, el BCE se negó a pagarnos para que permaneciéramos. Esa es su decisión, y no sirve a nuestros intereses, pero esa es la realidad. Ahora debemos decidir si permanecer en la Unión Europea. La salida sería económicamente costosa, pero el resto confirmaría nuestro fracaso ante la Unión. En cualquier caso, eventualmente los enfrentaremos en el campo de batalla, con o sin miembros de la Unión Europea. La única cuestión es si el costo monetario de la partida supera el coste moral de la estancia."
 france_md.288.a: "Salir de la Unión nos costaría demasiado; por ahora, no podemos permitirnos que"
 france_md.288.b: "No tenemos nada más que hacer aquí"
 france_md.289.t: "Francia asegura un acuerdo con la Unión Europea"
 france_md.289.d: "Después de meses de presión diplomática y amenazas para salir, el bonapartista Francia ha doblado a la Unión Europea a su voluntad, monetizando su membresía para obtener beneficios adicionales para quedarse. Este acuerdo es desastroso para nosotros y nuestros socios: no hay garantía de que Francia se comportará ahora que los nacionalistas obsesionados por la venganza lo controlan. Francia sigue siendo un miembro esencial, pero hoy es un peligro para todo el continente, y nuestro pueblo debe pagar el precio por los caprichos de su pareja."
 france_md.289.a: "¿Fue una buena idea?"
 france_md.290.t: "El Amanecer de un Imperio Nuevo"
 france_md.290.d: "Después de meses de agitación interna y reforma constitucional, hemos logrado. Hemos erradicado con éxito las instituciones y el poder de la república vergonzosa. Ahora Francia debe convertirse en lo que nunca debería haber dejado de ser: ¡un Imperio! Para celebrar el regreso del imperio, hemos preparado una gran celebración transmitida por toda Francia. A través de este evento, nuestro pueblo comprenderá nuestra fuerza y nuestra determinación de restaurar Francia a su antigua gloria. Esta celebración también enviará un mensaje claro a nuestros adversarios: una demostración de poder. Ahora no pueden ignorarnos; sus días están contados antes de que Francia venga a reclamar su deuda. ¡Esta vez, ninguna coalición puede detenernos!"
 france_md.290.a: "¡El Imperio recuperará su antigua grandeza!"
 france_md.291.t: "Francia pide una Unión de Nacionalismos"
 france_md.291.d: "La victoria de nuestros camaradas nacionalistas en Francia ha sacudido a Europa, y los Bonapartes han pivotado su política exterior contra la Unión Europea, sus valores y su futuro. Ahora nos han extendido la mano, creyendo que nuestro gobierno comparte lo suficiente de su carácter para hacer una causa común. Una alianza tácita con Francia parece atractiva, pero nada garantiza que no nos volverán después. Debemos pesar las consecuencias cuidadosamente."
 france_md.291.a: "Ellos están en el camino correcto; haríamos bien para unirse a ellos"
 france_md.291.b: "No compartimos esta visión del nacionalismo"
 france_md.292.t: "El bonapartista Francia presiona nuestra política"
 france_md.292.d: "Como anticipamos, la retórica nacionalista y antieuropea de Francia no fue un accidente: desde que los Bonapartes tomaron el poder, la Unión Europea se ha convertido en blanco de nacionalistas por todas partes. Los segmentos de nuestra población temen ahora el regreso de la guerra, mientras que otros se han unido a la causa nacionalista y llevado a cabo operaciones desestabilizadoras contra nuestro gobierno, ampliamente apoyadas y capacitadas por la inteligencia francesa actuando como un aparato propagandístico internacional. Debemos tomar esto con la máxima seriedad, porque su objetivo es dividirnos. ¡La Unión Europea debe permanecer unida!"
 france_md.292.a: "Europa derrotará al nacionalismo"
 france_md.293.t: "Rodeado de enemigos"
 france_md.293.d: "Como en los días de guerras revolucionarias, parece que los cambios necesarios en nuestra nación están generando resentimiento. Mientras reconstruimos, nuestros enemigos ya conspiran contra nosotros y se preparan para la confrontación. Ellos tienen razón para ser cautelosos, porque estamos listos para reclamar nuestros territorios por la fuerza si es necesario. En todo caso, estamos aislados contra una Europa que nos considera como una amenaza. Por ahora, debemos sobre todo prepararnos para años de conflicto con nuestros adversarios. Podemos ser capaces de forjar alianzas, pero debemos confiar principalmente en nosotros mismos. Pero una cosa es cierta: una vez que hayamos vencido la amenaza europea y atlántica, seremos imparables."
 france_md.293.a: "¿Cuántas coaliciones derrotaron a Napoleón? Haremos un breve trabajo de ellos"
 france_md.294.t: "Francia propone que nos unamos a su alianza"
 france_md.294.d: "Acabamos de recibir una propuesta de diplomáticos franceses. Observando que están aislados en Europa y rodeados de enemigos de su propia creación, los Bonapartes nos han apelado. Específicamente porque consideran a nuestra nación lo suficientemente respetable para merecer la alianza con ellos. Va sin decir que este no es un mero pacto defensivo y que unirse rápidamente nos enredaría en conflictos no necesariamente los nuestros. Sin embargo, esta alianza podría servirnos bien para enfrentar a nuestros propios adversarios, y todo lo demás siendo igual, es mejor estar con ellos que contra ellos. Una alianza con Francia parece fascinante, pero quizás unirse a ellos sería un boleto directo al infierno, ya que pronto traerán guerra a Europa."
 france_md.294.a: "Podemos beneficiarnos de esta alianza"
 france_md.294.b: "Claro que no."
 france_md.295.t: "Francia propone que nos unamos a su Comintern"
 france_md.295.d: "Las facciones comunistas revolucionarias que gobiernan Francia han desarrollado un apetito por el conflicto, persiguiendo la revolución mundial y reclutando aliados para exportarlo por cualquier medio necesario. Nos han llamado, sobre todo porque nosotros también hemos abrazado el socialismo, ofreciendo una oportunidad para derrotar al capitalismo y al fascismo en el campo de batalla. Sin embargo, este no es un mero pacto defensivo, y unirse rápidamente nos convertiría en conflictos no necesariamente los nuestros."
 france_md.295.a: "Ellos tienen razón; es hora de exportar la revolución"
 france_md.295.b: "Claro que no."
 france_md.296.t: "Los franceses nos exhortaron a atacar"
 france_md.296.d: "Nuestra implacable propaganda nacionalista ha funcionado demasiado bien: convencido de que las potencias rivales buscan nuestra destrucción, el público ahora espera que ataquemos primero. Las milicias se han reunido en las fronteras listas para enfrentarse a las fuerzas de seguridad de nuestros vecinos, y la opinión pública es inquietante. Debemos tener cuidado de no asustar a estos poderes para aliarnos prematuramente."
 france_md.296.a: "Es hora de establecer cuentas"
 france_md.296.b: "Nuestro tiempo vendrá"
 france_md.297.t: "Skirmishes en el túnel del canal"
 france_md.297.d: "Las milicias francesas ultranacionalistas, arraigadas por su nuevo líder bonapartista, han atacado a nuestros ciudadanos y policías alrededor del túnel del Canal, matando aproximadamente veinte e hiriendo docenas. No estábamos solos: anoche estos grupos golpearon a la mayoría de los vecinos franceses que comparten nuestro desafío del nuevo Imperio Napoleónico. Somos claramente un objetivo principal, y la confrontación con la Francia bonapartista ahora parece inevitable."
 france_md.297.a: "Debemos contener la agresión francesa protegiendo sus posibles objetivos"
 france_md.297.b: "Debemos prepararnos para el conflicto con ellos"
 france_md.298.t: "Escaramuzas en la frontera francesa"
 france_md.298.d: "Las milicias francesas ultranacionalistas, arraigadas por su nuevo líder bonapartista, han atacado a nuestros ciudadanos y policías a lo largo de nuestra frontera común, matando aproximadamente quince años e hiriendo docenas. No estábamos solos: anoche estos grupos golpearon a la mayoría de los vecinos de Francia, todos los objetivos potenciales del expansionismo bonapartista. Somos claramente un objetivo principal, y la confrontación con el nuevo Imperio Napoleónico ahora parece inevitable."
 france_md.298.a: "Debemos contener la agresión francesa protegiendo sus posibles objetivos"
 france_md.298.b: "Debemos prepararnos para el conflicto con ellos"
 france_md.298.c: "No hay razón para preocuparse"
 france_md.299.t: "[FROM.GetName] Nos llama por ayuda"
 france_md.299.d: "Ante la nueva amenaza inminente que plantea Francia, otras naciones atacadas no son lentas para responder. Como muchos otros, [FROM.GetName] nos pide ayuda para defender contra la posible invasión. Es posible que se enfrenten a un ataque antes de lo que haremos. ¿Pero estamos realmente preparados para protegerlos? ¿Debemos sacrificar meses de nuestra preparación para [FROM.GetName]? Esta crisis ha aumentado nuestra política exterior y las solicitudes de ayuda están aumentando. Nos enfrentamos a dos cursos: podemos ayudar [FROM.GetName] añadiéndolos a nuestra alianza estratégica, o podemos dejar que se enfrenten a Napoleón solo. Después de todo, hay mérito en permitirle ponerse contra un oponente como [FROM.GetName]."
 france_md.299.a: "Debemos protegerlos."
 france_md.299.b: "¿Por qué morir por [FROM.GetName]"
 france_md.300.t: "Francia propone que nos unamos a su alianza"
 france_md.300.d: "El líder bonapartista de Francia ha atraído el ire de Europa, declarando su disposición a la guerra para restaurar la grandeza de su nación, y ahora nos extiende su mano. Los diplomáticos franceses invocan la historia, recordando cómo Napoleón ayudó una vez al pueblo polaco contra la opresión eslava y alemana, y proponen renovar ese pacto. Tal alianza nos protegería contra la amenaza rusa siempre presente, pero también podría arrastrarnos a guerras invencibles."
 france_md.300.a: "¡Seremos los nuevos Dombrowski y Kniaziewicz!"
 france_md.300.b: "¿Por qué morir por París? Te lo pregunto."
 france_md.301.t: "Francia propone que nos unamos a su alianza"
 france_md.301.d: "El líder bonapartista de Francia ha atraído el ire de Europa, declarando su disposición a la guerra para restaurar la grandeza de su nación, y ahora nos extiende su mano. Los diplomáticos franceses invocan el descenso de nuestra casa real desde Jean Baptiste Bernadotte, un mariscal de Napoleón, y proponen unir nuestros esfuerzos en memoria de nuestros antepasados. Tal alianza nos protegería contra la amenaza rusa siempre presente, pero también podría arrastrarnos a guerras invencibles."
 france_md.301.a: "Es hora de volver al servicio"
 france_md.301.b: "El pasado es el pasado"
 france_md.302.t: "USA amigo o enemigo"
 france_md.302.desc: "Habiendo enviado propuestas de alianza a los pocos aliados potenciales que podemos encontrar en Europa, queda una pregunta: ¿cómo debemos tratar con Estados Unidos? Durante la Revolución y bajo Napoleón mantuvimos buenas relaciones con ellos, compartiendo un odio común a Inglaterra. Pero los tiempos han cambiado. La Segunda Guerra Mundial y la conducta estadounidense en Europa a menudo se oponen a los intereses franceses, y mientras que las relaciones mantenidas hasta nuestro ascenso al poder, Washington puede ahora bloquear nuestro camino hacia la hegemonía."
 france_md.302.a: "Proponer que se unen a nuestra alianza"
 france_md.302.b: "Su poder comercial nos ayudará a superar las sanciones internacionales"
 france_md.302.c: "Prepárense para enfrentarse con ellos"
 france_md.302.d: "Garantizar Europa sigue siendo nuestra prioridad"
 france_md.303.t: "Francia nos propone una alianza"
 france_md.303.d: "El líder bonapartista de Francia ha atraído el ire de Europa y ahora propone una alianza, a condición de que no interfiramos en sus asuntos. Los diplomáticos franceses enfatizan que Napoleón y la Francia revolucionaria han sido durante mucho tiempo aliados vitales para nosotros. Pero Francia se ha dedicado a luchar contra otros poderes europeos, muchos de ellos nuestros propios aliados, y ha declarado al Reino Unido un objetivo prioritario, nuestro aliado histórico y un socio precioso. ¿Deberíamos unirnos a Francia y arriesgar la guerra con Londres?"
 france_md.303.a: "Pueden contar con nosotros."
 france_md.303.b: "Los ingleses son nuestros aliados sobre todo"
 france_md.304.t: "Francia propone ampliar nuestras relaciones comerciales"
 france_md.304.d: "El líder bonapartista de Francia ha atraído el ire de Europa y ahora propone ampliar nuestras relaciones comerciales, ya que su economía, aislada por la hostilidad hacia los antiguos socios, necesita nuestra experiencia y poder industrial más que nunca. Los diplomáticos franceses enfatizan que Napoleón y la Francia revolucionaria han sido durante mucho tiempo aliados vitales para nosotros. Pero Francia se ha dedicado a luchar contra otros poderes europeos, la mayoría de ellos nuestros propios aliados, y apoyar su esfuerzo de guerra por medio del comercio podría sacar su desaprobación."
 france_md.304.a: "Más comercio es siempre bueno"
 france_md.304.b: "No seremos sus cómplices"
 france_md.305.t: "Francia deja a la Unión Europea"
 france_md.305.d: "Tras una crisis importante entre nuestros socios franceses. Los movimientos nacionalistas que piden un retorno a la monarquía absoluta han tomado el control del estado francés. Desde entonces, se han fijado en destruir lo que quedaba de sentimiento proeuropeo en Francia. Ahora anuncian la retirada de Francia de la Unión Europea. Han mostrado una negativa categórica a negociar. La victoria de estos movimientos nacionalistas no es sólo una grieta en la unidad europea, sino también un modelo para todos los euroescépticos dentro de la Unión."
 france_md.305.a: "El nacionalismo es una amenaza para nuestra Unión Europea"
 france_md.306.t: "Monarquistas Triumph en Francia"
 france_md.306.d: "La victoria de nuestros camaradas monarquistas en Francia ha sacudido a toda Europa: un pilar de la Unión que abraza el nacionalismo fue suficiente para enfurecer Bruselas. Los realistas han orientado su política exterior contra la Unión Europea, sus valores y su futuro, al igual que los monárquicos hemos mantenido durante mucho tiempo con una Unión que nos quería silenciar. En toda Europa, el ejemplo de Francia parece encarnar la oposición a la burocracia europea. Nuestro propio país ya está comprometido con la causa monarquista, por lo que la victoria de Francia es una victoria para los nacionalistas europeos en todas partes."
 france_md.306.a: "Una victoria para el nacionalismo en Europa"
 france_md.307.t: "El Reino Francés presiona nuestra política"
 france_md.307.d: "Como predijimos, la retórica nacionalista y antieuropea de Francia no fue un accidente: desde la victoria de la monarquía, la Unión Europea se ha convertido en el blanco de los nacionalistas por todas partes, y Francia ha demostrado una clara disposición a librar guerra contra aquellos que considera enemigos. Parte de nuestra población teme ahora el regreso de la guerra, mientras que otros, ya tibios hacia Europa, se han unido con los nacionalistas y llevado a cabo acciones desestabilizadoras contra nuestro gobierno, ayudados y entrenados por servicios de inteligencia franceses convertidos en máquinas propagandísticas internacionales. Debemos tomar esto en serio: su objetivo es dividirnos."
 france_md.307.a: "Europa va a derrotar al nacionalismo"
 france_md.308.t: "Francia nos invita a unirse a su cruzada"
 france_md.308.d: "La victoria de nuestros camaradas nacionalistas en Francia ha sacudido a toda Europa. Más allá de la Unión, que ve como su adversario, el reino francés ha declarado que protegerá la fe cristiana en toda Europa y el mundo, denunciando la democracia occidental como una perversión que llevó a la gente de la religión, y pidiendo el regreso de la Iglesia al poder. Como nuestro país tiene una mayoría cristiana, esta llamada es en parte para nosotros: proponen que nos unamos para restaurar el cristianismo a su antiguo poder. La invitación podría traernos el poder al servicio de nuestro Señor, pero garantiza un retorno a la guerra en Europa."
 france_md.308.a: "Nos uniremos a su cruzada"
 france_md.308.b: "No compartimos esta visión del cristianismo"
 france_md.309.t: "Prepararse para la Décima Cruzada"
 france_md.309.d: "Durante semanas, nuestro rey ha demostrado una determinación inquebrantable de recuperar la Tierra Santa, aunque no tenemos ninguna posición en la región. Nuestros socios libaneses mantienen relaciones cordiales con nosotros, pero su gobierno es demasiado inestable e influenciado por Irán para ayudar, a pesar de la significativa minoría cristiana maronita del Líbano que lo convierte en un punto de aterrizaje ideal para nuestra cruzada. Podríamos preparar una intervención anfibia, que fortalecería nuestra marina pero nos marcaría como agresores contra un estado inocente, o aplicaría presión política, lo cual conlleva menos riesgo, pero sin garantía de éxito."
 france_md.309.a: "Primero deberíamos preguntarles (policialmente, por supuesto)"
 france_md.309.b: "Los que no están con nosotros, en ningún caso están contra nosotros."
 france_md.310.t: "El Reino Francés amenaza nuestra independencia"
 france_md.310.d: "El Reino Francés anunció hace meses su intención de reconquistar la Tierra Santa, preparando una Décima Cruzada hacia Jerusalén. Por esto necesitan un lugar cerca de Jerusalén, y la fuerte minoría maronita de nuestro país nos ha puesto en sus ojos. Los agitadores franceses ahora trabajan para socavar nuestra legitimidad y presión maronitas para derrocar nuestro gobierno. El control francés podría protegernos de la injerencia de Israel y Hezbolá, pero probablemente destruiría a nuestro país en guerra fratricida. ¿Es esto realmente lo que queremos?"
 france_md.310.a: "Nos protegerán contra nuestros vecinos beligerantes."
 france_md.310.b: "¡Sólo traerán más conflicto!"
 france_md.311.t: "Bolos de Líbano a Nuestras Demandas"
 france_md.311.d: "Esta mañana es un gran día. Tras nuestra presión, el gobierno libanés anunció su entrega a las demandas de los manifestantes cristianos maronitas. Inmediatamente después, un gobierno con mayoría maronita fue nombrado y puso al Líbano bajo nuestra protección. Hicimos la elección correcta en la diplomacia privilging; los poderes occidentales no encontrarán nada que objetar, ya que debilita la influencia de Irán. Hemos maniobrado geopolíticamente. Todo lo que queda es prepararse para un conflicto terrestre contra aquellos que estarían entre nosotros y el Reino de los Cielos."
 france_md.311.a: "Jerusalén está a nuestro alcance"
 france_md.312.t: "Líbano nos rechaza"
 france_md.312.d: "Esta mañana el Líbano anunció públicamente su negativa a ceder a la presión francesa sobre sus políticas. Nuestros agitadores aparentemente no tuvieron ningún efecto, y el apoyo maronita por nuestra causa no fue suficiente. Es probable que nuestro fracaso provenga del Líbano permaneciendo firmemente bajo el control de Irán y Hezbollah. La negativa del Líbano a trabajar con nosotros no es el fin, sin embargo. Siempre podemos volver a ellos cuando lo necesitemos, y esta vez no podrán resistir. Sin embargo, nuestros esfuerzos políticos parecen haber fracasado. Tal vez deberíamos centrarnos en cómo presionamos a otros y fortalecer nuestra diplomacia internacional, como es posible que lo necesitemos en el futuro."
 france_md.312.a: "Prepararse para una intervención naval"
 france_md.312.b: "Debemos fortalecer nuestra diplomacia; no parece ser nuestra fuerza."
 france_md.313.t: "La Comuna Francesa exige la caída de nuestro Gobierno"
 france_md.313.d: "Hace meses la Comuna Francesa anunció su deseo de llevar la revolución al mundo, y ahora parece estar aprensándonos. Los agitadores de Propaganda han infiltrado nuestra población, incitando a los ciudadanos a unirse a su causa, y grupos de manifestantes y extremistas comunistas ya se han organizado. Los enviados franceses han advertido de la intervención si no cedemos. Podríamos rendirnos y unirnos a Francia, perder nuestra independencia o encarcelar a los extremistas que amenazan nuestro gobierno."
 france_md.313.a: "Viva la revolución."
 france_md.313.b: "Mejor muerto que rojo"
 france_md.314.t: "[FROM.GetName] Se une a la Revolución Mundial"
 france_md.314.d: "[FROM.GetName] acaba de anunciar la caída de su gobierno a nuestras protestas y presiones diplomáticas. Esta es una excelente noticia para nosotros; un nuevo poder se une a la revolución, y todo sin derramamiento de sangre. Otros poderes capitalistas han anunciado su conmoción por este dramático cambio en el orden mundial. Pueden protestar, pero no pueden oponerse a la voluntad del pueblo. La revolución eventualmente vendrá por ellos también. La caída de [FROM.GetName] es sólo el principio; otros seguirán."
 france_md.314.a: "La revolución crece"
 france_md.315.t: "[FROM.GetName] Rechaza la voluntad del pueblo"
 france_md.315.d: "Las protestas que reclaman la caída del gobierno de [FROM.GetName] parecen haberse disipado. De hecho, el gobierno de [FROM.GetName] los reprimió violentamente y rechazó cualquier compromiso. Si este desembolso parece haber superado la voluntad del pueblo, tal vez deberíamos involucrarnos más en la revolución en [FROM.GetName]. Nuestras fuerzas están dispuestas a intervenir militarmente para hacer cumplir la voluntad del pueblo soberano. Sin embargo, esta intervención podría degenerar en un conflicto a gran escala. ¿Debemos intervenir o no?"
 france_md.315.a: "La revolución vendrá si les gusta o no"
 france_md.315.b: "Volveremos."
 france_md.316.t: "La Comuna Victorious en Europa"
 france_md.316.d: "Este es un gran día para nuestra Comuna: hemos traído la revolución a toda Europa. Desde la caída de la Unión Soviética, el continente estaba lleno de capitalistas y nacionalistas en ciernes, pero nada nos impidió, no sanciones, bombardeos o las guerras que libramos para llevar al proletariado al poder. A veces tuvimos que enseñar a los opresores una lección con cañones, pero el triunfo de la revolución justifica los medios. A medida que el ejército popular desfila por París, Europa comienza a reconstruirse sobre bases sólidas, lejos del capitalismo. Nuestro próximo objetivo es realizar el sueño de los internacionalistas en todas partes: una gran federación donde todos los trabajadores se sienten como en casa."
 france_md.316.a: "La Internacional será humanidad"
 france_md.317.t: "A través de las Ardenas"
 france_md.317.d: "Nuestro emperador ha discutido durante mucho tiempo invadiendo el Benelux, vital para nuestro imperio naciente. Bélgica tiene una importante minoría francófona en Wallonia y es el centro neurálgico de la Unión Europea, pero sigue siendo pobremente defendido, un primer objetivo perfecto para restaurar nuestras fronteras legítimas. Debido a que tenemos la intención de ocupar estas tierras permanentemente, ya que son legítimamente nuestras, el emperador nos ha ordenado evitar los bombardeos y atacar rápidamente, antes de que nuestros enemigos puedan prepararse. Es hora de recuperar la cuna de la nación franco más allá de las Ardenas."
 france_md.317.a: "No tienen oportunidad."
 france_md.318.t: "La Segunda Campaña Española"
 france_md.318.d: "Nuestro emperador ha ordenado la conquista de la Península Ibérica, esencial para asegurar nuestro flanco occidental antes de la marcha al este a Moscú. Tomar España nos acerca a Gibraltar, clave para controlar el Mediterráneo. El terreno montañoso favorece al defensor, por lo que el emperador pide un avance lento y seguro respaldado por cazadores alpinos, sin embargo insta a la velocidad antes de que nuestros enemigos puedan prepararse. La derrota de Napoleón nos enseñó tierra conquistada debe ser tenida: debemos imponer estados clientes estables o endurecer las fuerzas de ocupación."
 france_md.318.a: "Esta vez los veremos de cerca."
 france_md.319.t: "A través del Rin"
 france_md.319.d: "Nuestro emperador ha nombrado a nuestro próximo adversario: Alemania, el corazón económico de Europa y dedicado a una visión de Europa que despreciamos. El conflicto fue inevitable, y marca nuestro primer paso hacia el este hacia Moscú, nuestro enemigo final. Desde la campaña de relámpagos de Napoleón contra Prusia hasta Sedán y dos guerras mundiales, conocemos bien a este enemigo. El emperador ordena un avance seguro y preparado con tanques fuertes y la aviación para asegurar nuestros objetivos, aunque la ocupación plena es innecesaria. Esta guerra es desafortunada pero inevitable."
 france_md.319.a: "¡Nunca otro Sedán!"
 france_md.320.t: "La guerra por los Alpes"
 france_md.320.d: "Napoleón I's Ruso retiro vio a los aliados rebelarse en el momento en que se debilitó, así que antes de marchar en Moscú nuestro emperador nos ordena asegurar nuestro flanco sur: Italia y las antiguas tierras austrohúngaras. Amenazas menores ahora, podrían volverse peligrosos si nuestra campaña rusa se arrastra. Su terreno montañoso llama a los cazadores y artillería alpinos para desalentar a los defensores desde puntos fuertes, asegurando nuestra retaguardia sin desperdiciar hombres que necesitaremos para Rusia. Estos países están en el lugar equivocado en el momento equivocado."
 france_md.320.a: "¡Entierraremos el Imperio Romano de una vez por todas!"
 france_md.321.t: "El Emperador nos llama a prepararnos para la guerra"
 france_md.321.d: "Nuestro aliado francés ha convocado una reunión para discutir la destrucción de Rusia, que considera como una amenaza para Europa y el imperio que ahora compartimos. Nos insta a construir nuestras capacidades militares y ha enviado expertos en armas para optimizar nuestra producción, con una sola palabra: prepararse para una guerra larga y difícil. El anuncio es una noticia espantosa para nuestros ciudadanos, que pueden ser llamados a morir, pero esta guerra es necesaria y justa. Debemos proteger a Europa de Rusia antes de convertirnos en su objetivo."
 france_md.321.a: "Gracias, mi emperador"
 france_md.322.t: "Piercing el glacis"
 france_md.322.d: "Nuestra marcha en Moscú es inminente, pero primero debemos asegurar nuestro punto de lanzamiento: Europa del Este, una vez un búfer contra la expansión rusa, ahora un obstáculo para el nuestro. Le ofrecimos una mano a los que están dispuestos a unirse a nosotros; el resto hizo caso omiso de nuestra apelación, y ha llegado su día de juicio. Nuevamente independientes, estas naciones no serán difíciles de aplastar. Avanzamos rápido con un avance blindado respaldado por la artillería. Lucharán hasta el final. No muestres piedad."
 france_md.322.a: "Los franceses darán al mundo paz y libertad"
 france_md.475.t: "La Segunda Campaña Rusa"
 france_md.475.d: "Después de años de preparación, ha llegado el momento. Nuestro Emperador ha emitido sus órdenes finales para la campaña rusa, nuestro mayor adversario y, en cuanto a Napoleón I, una amenaza inevitable. Por una vez duda: no se permite ningún error contra un poder que siempre ha defendido su propio suelo. Lo que decidamos, la velocidad es esencial, para el enemigo también se prepara. Hagan la elección correcta, pero háganles saber esto: ¡El pueblo soberano avanzará, los tiranos descenderán en tumbas para esconderse!"
 france_md.475.a: "¡Una ofensiva rápida, estaremos en Moscú en dos semanas!"
 france_md.475.b: "Vamos a prepararnos para una guerra de atrición"
 france_md.476.t: "Romper el bloqueo"
 france_md.476.d: "Nuestra economía y gente han sufrido lo suficiente a manos de Albion traicionero, y ahora, con Europa asegurada, podemos volvernos a nuestro adversario más antiguo. Sólo el Canal bloquea nuestro camino hacia su miserable isla. Nuestro Emperador ofrece dos opciones: golpear con la superioridad del aire, aplastarlos con bombas antes de paracaídar nuestras fuerzas en, o explotar su debilitada marina y concentrar nuestra flota para un aterrizaje directo. La velocidad es esencial. Haga la elección correcta, ciudadano. Nuestra victoria es inminente."
 france_md.476.a: "Su armada es ahora una mera sombra de su antiguo yo. La Royale hará un corto trabajo de él"
 france_md.476.b: "Un Blitz 2.0, suena bien"
 france_md.477.t: "El Emperador reclama la victoria del Sistema Continental"
 france_md.477.d: "Nos sancionaron. Nos han embargado. Nos bombardearon. Pero nunca rompieron nuestro espíritu. Después de años de guerra, nuestro Emperador ha declarado la victoria: Europa se inclina una vez más ante el Imperio Francés. Estas conquistas cuestan miles de vidas francesas, mártires que no serán olvidados. El Día de la Victoria es ahora una fiesta pública en su memoria. Pero nuestro triunfo en Europa no resuelve nada: tarde o temprano nos enfrentamos a otros poderes en otros frentes. Francia es eterna. La guerra también."
 france_md.477.a: "El día de la gloria ha llegado"
 france_md.478.t: "¿Qué búsqueda para nuestro Reino?"
 france_md.478.d: "Nuestra posición en la cabeza del Reino de Francia es segura: hemos aplastado la Revolución y restaurado la religión a su lugar legítimo. Ahora la pregunta es dónde empezar a restaurar nuestra antigua gloria. Podríamos recuperar nuestras tierras ancestrales de Frankish, aunque esto desencadenaría una guerra con antiguos aliados que no están dispuestos a entregarlas, o podríamos ganar los corazones de los cristianos por todas partes marchando primero para liberar la Tierra Santa, escupiendo una guerra en nuestro propio suelo. Lo que decidamos, no tenemos nada que temer, porque Dios está de nuestro lado."
 france_md.478.a: "Somos, ante todo, Franks"
 france_md.478.b: "La cruzada no esperará, debemos liberar nuestros sitios santos"
 france_md.479.t: "El Reino de Francia exige nuestra Anexo"
 france_md.479.d: "Una petición muy peculiar ha llegado de nuestros colegas franceses esta mañana. Su rey ya no reconoce nuestra soberanía y exige que cedamos nuestros territorios, reservas y ejército a su mando, prometiendo que nuestra población se integrará sin problemas. Se lee como la broma de un tonto de abril, pero el Estado Mayor francés ha anunciado una movilización especial y todas las pruebas apuntan a una intervención inminente en nuestro territorio. Rendirse o luchar: lo que decidamos, debemos actuar rápidamente."
 france_md.479.a: "Un conflicto causaría sufrimiento innecesario a nuestro pueblo"
 france_md.479.b: "¿Cómo se atreven? Somos un país soberano."
 france_md.480.t: "[FROM.GetName] Cumple con nuestros requisitos"
 france_md.480.d: "Antes de que se disparara el primer cañón, el gobierno de [FROM.GetName] anunció su disolución y rendición incondicional a nuestro reino. Esta es una excelente noticia para nuestro pueblo y nuestros esfuerzos diplomáticos. Nuestro rey ha prometido que los nuevos ciudadanos franceses tendrán su estatus regularizado lo antes posible y que se integrarán de la manera más eficaz posible. Esta fue la decisión más sabia que pudieron haber tomado. No habrían podido resistir una intervención por nuestra parte."
 france_md.480.a: "A veces todo lo que tienes que hacer es pedir amablemente"
 france_md.481.t: "[FROM.GetName] Se niega a ceder"
 france_md.481.d: "El gobierno de [FROM.GetName] acaba de anunciar que condena nuestro intento de intimidar a su país. Nuestras demandas étnicas no tendrían lugar en la mesa de negociación. Este revés diplomático era predecible; habría sido extraño que un país soberano anunciara su rendición sin siquiera levantar una lucha. Esto es afortunado, como en realidad habíamos preparado para esta misma eventualidad. Nuestras fuerzas están listas para intervenir en su suelo. Sin embargo, no es cierto que el conflicto abierto sea la mejor manera de asegurar la justicia."
 france_md.481.a: "Se arrepentirán."
 france_md.481.b: "Este no es el fin de nosotros"
 france_md.482.t: "El Reino de Francia exige nuestra presentación"
 france_md.482.d: "Una petición muy peculiar ha llegado de nuestros colegas franceses esta mañana. Su rey, invocando los días de los Carolingianos, ya no confía en nosotros para proteger al papado entre las crecientes tensiones, y exige el pleno control de nuestro gobierno junto con el pasillo hacia el Vaticano, que él tiene la intención de administrar directamente. Esto es intolerable: nunca hemos fallado al papado, y la religión no puede justificar las ambiciones nacionalistas de nuestro vecino. Sin embargo, no son amenazas ociosas, el Estado Mayor francés ha ordenado una movilización especial, y todas las pruebas apuntan a una intervención en nuestro territorio. Rendimiento o lucha: lo que decidamos, debemos actuar con rapidez."
 france_md.482.a: "No somos rivales para ellos."
 france_md.482.b: "¿Cómo se atreven? Somos un país soberano."
 france_md.483.t: "[FROM.GetName] Rehúsa a conocer nuestras demandas"
 france_md.483.d: "El gobierno de [FROM.GetName] acaba de anunciar que condena nuestro intento de intimidar a su país. Se niegan a inclinarse ante nuestras demandas y desean defender su soberanía sobre sus decisiones y políticas. Parecería que han rechazado nuestra apelación a la razón. No podemos dejar que se escapen con esto. Nuestras fuerzas están dispuestas a intervenir militarmente en su país. No podemos arriesgar a nuestros adversarios uniendo fuerzas para enfrentarnos. Debemos hacer un ejemplo de ellos. Sin embargo, una guerra con [FROM.GetName] puede no ser lo que necesitamos."
 france_md.483.a: "No se dieron cuenta de que estaban en el lado equivocado del arma."
 france_md.483.b: "Podemos doblarlos de otras formas."
 france_md.484.t: "El Reino de Francia exige nuestra presentación"
 france_md.484.d: "Una demanda muy peculiar ha llegado de nuestros colegas franceses esta mañana. Su rey ya no confía en nosotros para proteger a nuestro pueblo y afirma que nuestro gobierno se encuentra en el lado equivocado del equilibrio actual de alianzas, exigiendo el pleno control de nuestro gobierno y fuerzas armadas. Estas demandas son absurdas: nunca hemos fracasado en gobernar nuestro territorio, y nuestra autoridad viene únicamente del mandato de nuestro pueblo. Sin embargo, no son amenazas ociosas, el Estado Mayor francés ha ordenado una movilización especial, y todas las pruebas apuntan a una intervención en nuestro territorio. Rendimiento o lucha: lo que decidamos, debemos actuar con rapidez."
 france_md.484.a: "No somos rivales para ellos."
 france_md.484.b: "Sólo nuestro pueblo es soberano."
 france_md.485.t: "El ascenso del Imperio Occidental"
 france_md.485.d: "Después de años de lucha y traición, el pueblo franco ha triunfado. Cuando derrocamos la república usurpadora, Europa nos ostractó y nos sancionó, pero Dios siempre ha estado de nuestro lado: Francia, la hija mayor de la Iglesia, nunca fue destinada a una república. Los enemigos del pueblo franco estaban obligados a perecer, y ahora los francos han reclamado sus tierras. Es hora de proclamar nuestro Imperio, el Imperio de Occidente, el Imperio de la Fe, consagrado por el Papado para nuestra protección eterna. Tal vez también es hora de salir al este y reclamar la Tierra Santa."
 france_md.485.a: "Y esta vez, seré yo quien coloque la corona"
 france_md.485.b: "Deus Vult!"
 france_md.486.t: "El Reino de Francia exige nuestra presentación"
 france_md.486.d: "Una petición muy peculiar ha llegado de nuestros colegas franceses esta mañana. Su rey, decidido a ver a través de la Décima Cruzada que ha lanzado, afirma que nuestros territorios insulares están en su camino y los exige, junto con el control completo de nuestro gobierno, para buena medida. Esto es intolerable: la religión no puede justificar las ambiciones nacionalistas de nuestro vecino. Sin embargo, no son amenazas ociosas, el Estado Mayor francés ha ordenado una movilización especial, y todas las pruebas apuntan a una intervención en nuestro territorio. Rendimiento o lucha: lo que decidamos, debemos actuar con rapidez."
 france_md.486.a: "Esta es la mejor manera de asegurar que esta campaña tenga éxito; la aceptamos"
 france_md.486.b: "¿Cómo se atreven? Somos un país soberano."
 france_md.487.t: "La Décima Cruzada Victoriosa"
 france_md.487.d: "Después de meses de intensos combates en todo el Mediterráneo y Oriente Medio, hemos surgido victoriosos. Viajando a la isla, aseguramos las últimas fortalezas cristianas, y luego sentamos sitio a Jerusalén misma. Los adversarios incontables se pusieron de pie en nuestro camino, y muchos franceses murieron junto con inocentes que cayeron a nuestro poder vengativo, pero el fin justifica los medios. Con nuestros logros consolidados y la inestabilidad del Medio Oriente neutralizada, queda una pregunta: ¿debemos parar aquí o terminar lo que las guerras religiosas en Europa no lograron?"
 france_md.487.a: "Habrá una nueva cruzada."
 france_md.487.b: "Hemos logrado nuestro objetivo restaurando el Reino de Jerusalén. No hay necesidad de ir más allá"
 france_md.488.t: "El Reino de Francia nos insta a unirse a su alianza"
 france_md.488.d: "Una propuesta ha llegado de diplomáticos franceses. Habiendo concluido su empresa del Medio Oriente, el rey de Francia, como protector de la Iglesia Católica, declara ahora la guerra a todos los que rechazan su autoridad, e invita a una alianza que compara con el Arca de Noé antes de una inundación venidera. Este anuncio está tan loco como aterrador, acompañado de la movilización del ejército crucificado que ahora regresa a casa. La propuesta se parece más a un ultimátum, dada la ferocidad con que ellos apostaron su cruzada, y debe tomarse en serio. Lo que decidamos, debemos hacerlo con rapidez."
 france_md.488.a: "Es mejor tenerlos de nuestro lado que contra nosotros."
 france_md.488.b: "¿Están locos?"
 france_md.489.t: "La Undécima Cruzada Victorious en Europa"
 france_md.489.d: "Esta cruzada era más sangrienta que la última. También fue más difícil llevar a cabo, ya que tomamos las principales potencias. Pero lo hicimos. Somos victoriosos. Sin embargo, a medida que tendemos a nuestras heridas y reconstruimos nuestro país y los que hemos conquistado, surge una pregunta. ¿Debemos imponer un control estricto de sus políticas para asegurar que permanezcan en el camino correcto? ¿O deberíamos mostrarles la luz y dejar que decidan por sí mismos? Al dejarles elegir, demostraríamos nuestra clemencia, y serían menos propensos a rebelarse. Por el contrario, ejercer un control más estricto ayudaría a asegurar que ningún otro vagabundo de ovejas. ¿Qué debemos hacer?"
 france_md.489.a: "Tenemos que vigilarlos."
 france_md.489.b: "Nuestro Señor los juzgará cuando llegue el momento"
 france_md.490.t: "La Restauración de nuestras fronteras naturales"
 france_md.490.d: "Desde Richelieu hasta De Gaulle, la idea de las fronteras naturales de Francia nunca ha sido abandonada: una preocupación fundamental arraigada tanto en las reivindicaciones étnicas del pueblo franco como en nuestra seguridad. Hoy podemos cumplir este destino. Hemos impulsado a nuestros adversarios desde las orillas del Rin, hemos asegurado nuestras posiciones de montaña, y las poblaciones locales finalmente han aceptado el nuevo orden. Todo lo que queda es formalizar esta anexión. A través de ella, vengamos la Revolución y abrimos una era de seguridad y prosperidad para el Imperio y el pueblo francés."
 france_md.490.a: "Las fronteras de Francia se definen por naturaleza (Danton 1793)"
 france_md.491.t: "La Unión del Pueblo Frankish"
 france_md.491.d: "Durante demasiado tiempo, los poderes que buscan limitar la influencia de Francia han frustrado la unidad del pueblo franco, acarreando estados como el Benelux como un campo de batalla entre Franks y otros pueblos alemanes, y convencándonos de que la Unión Europea era nuestra verdadera patria. Pero el destino de los Franks pertenece solo a los Franks, y nada podría mantenerlos divididos para siempre. Hemos reclamado la tierra ancestral que dio a luz a la nación francesa, y después de meses nuestros hermanos de sangre han venido para ver que su destino está con nosotros. Ahora que el Reino está completo, se ha hecho justicia."
 france_md.491.a: "Un estado para todos los Franks"
 france_md.492.t: "El regreso de los Carolingianos"
 france_md.492.d: "Sobre la muerte de Carlomagno su imperio se dividió en Francia occidental, media y oriental, y el legado del emperador Frankish comenzó a desvanecerse mientras los francos fueron despojados de sus tierras. Hemos rectificado este error. Después de años de conflicto hemos impulsado a los usurpadores de nuestro territorio y mostramos a sus habitantes que nunca eran alemanes, italianos o suizos, sino Franks que simplemente habían olvidado. A través de esta reunificación, rectificamos los errores del Tratado de Verdún y mil años de Europa construidos sobre bases falsas. Este día marca el comienzo de una nueva Europa Frankish."
 france_md.492.a: "El imperio y el estado franco son uno"
 france_md.493.t: "El Reino de Jerusalén Resurfaces"
 france_md.493.d: "Hace poco menos de un milenio, nuestros antepasados cruzados vieron su posesión más preciosa de ellos. Nueve cruzadas no fueron suficientes para conquistar y retener nuestros sitios santos, pero hemos vuelto a cumplir esta promesa hecha al Señor. Hemos recuperado una posición en el Medio Oriente dentro de las últimas fortalezas cristianas del Líbano, y hemos recapturado Jerusalén y Tierra Santa. Esto fue seguido por una lucha para establecer nuestro reino en el Medio Oriente y hacer que la población comprenda que los lugares santos deben permanecer bajo nuestro control para garantizar su seguridad."
 france_md.493.a: "¡La Décima Cruzada triunfa!"
 france_md.494.t: "Un Imperio Renacido"
 france_md.494.d: "Hace unos 150 años el Segundo Imperio de Napoleón cayó a Prusia y a los pueblos germánicos, comenzando un siglo de venganza y conflicto para Francia. Todos predijeron nuestro lento declive como una antigua potencia colonial, pero nosotros los bonapartistas les probamos mal, luchando el poder de la república inestable y restaurando Francia a su antigua gloria. Vino a un costo, pero hemos reclamado las fronteras del Primer Imperio de Napoleón y expulsado poderes enemigos. Con esta histórica victoria sobre la Octava Coalición, Francia ha mostrado el mundo que ha vuelto y el Sistema Continental ahora triunfa en Europa."
 france_md.494.a: "Tercera vez el encanto"
 france_md.495.t: "El regreso del Imperio Colonial"
 france_md.495.d: "Los imperios bonapartistas siempre se han centrado en dominar Europa, pero las colonias también importaron mucho, de la revuelta haitiana a la expansión de Napoleón III hacia África. Desde la caída de los imperios coloniales hemos sido poco a poco expulsados de los países que una vez controlamos, y es hora de restaurar el orden natural. Nuestro Emperador nos ha ordenado prepararnos para el regreso de Francia a sus antiguas colonias, movilizando tropas de nuestros departamentos y regiones del extranjero, mejor adaptados a este entorno. Invadiremos ciudades costeras para asegurar bases navales antes de empujar hacia el interior, donde el clima crece más duro."
 france_md.495.a: "Esos días benditos de las colonias"
 france_md.496.t: "Nuestro Overlord francés exige nuestra Anexo"
 france_md.496.d: "Deberíamos habernos dado cuenta de que el control sobre nuestras políticas impuestas por Francia terminaría tarde o temprano así. Las autoridades francesas acaban de anunciar que nuestro país pronto será absorbido en Francia. Este anuncio no salió del azul, Francia ha tenido desde hace mucho tiempo su ojo en algunos de nuestros territorios y parece decidido a apoderarse de ellos esta vez. Creen que serán más capaces de administrar nuestro país que nosotros. En estas horas oscuras, debemos tomar una decisión no sólo por nuestra independencia sino también por la seguridad de nuestro pueblo. Para ceder o luchar, estas son nuestras opciones. Lo que decidamos, debemos actuar con rapidez."
 france_md.496.a: "No tenemos los medios para oponerse a ello"
 france_md.496.b: "Esta tierra es nuestra, que vengan y la tomen"
 france_md.497.t: "[FROM.GetName] Revueltas contra nuestra superpotencia"
 france_md.497.d: "El gobierno de [FROM.GetName] condena nuestro intento de anexión y está dispuesto a defender su independencia a cualquier costo. Aceptan vasalaje pero se niegan a ceder los territorios que exigimos, expulsar nuestra administración y prepararse para enfrentarnos. Podemos aplastar esta rebelión ahora para hacer un ejemplo de ellos, o posponer su castigo por más tarde, ya que nada impide nuestro regreso."
 france_md.497.a: "Esto servirá como una lección para ellos y para cualquier otro que pueda ser tentado"
 france_md.497.b: "Los aplastaremos más tarde."
 france_md.498.t: "Francia propone invertir en nuestra industria"
 france_md.498.d: "Nuestros socios franceses nos han hecho una oferta tentadora: Europa quiere reorientar la capacidad de producción que puede controlar, por lo que Francia propone invertir en nuestra economía ayudando a establecer fábricas en nuestro territorio, como parte de un proyecto más amplio para fortalecer la soberanía europea y la resiliencia. Esto nos beneficiaría mucho, pero también los franceses, que podrían ganar una estaca en nuestra capital y nuestras empresas. ¿Debemos sacrificar un poco de soberanía para ayudar a nuestra industria?"
 france_md.498.a: "¿Dónde firmamos?"
 france_md.498.b: "Europa y Francia no tienen negocios en nuestra economía"
 france_md.499.t: "Francia está proponiendo invertir en nuestra red de infraestructura"
 france_md.499.d: "Durante una agradable discusión con nuestros socios franceses, nos hicieron una oferta bastante atractiva. El objetivo principal de Europa es facilitar el movimiento de personas y bienes entre los países de la UE, y les gustaría ayudar a nuestro país en este sentido. Por lo tanto, el gobierno francés ha ofrecido invertir en nuestra red de transporte ayudando a modernizar nuestra infraestructura. Esta oferta forma parte integral de un proyecto destinado a aumentar la soberanía europea y ayudar a sus Estados miembros a hacer frente a las crisis futuras. Esta oferta sería muy beneficiosa para nosotros, pero también beneficiaría a los franceses, que podrían influir en la gestión de nuestra infraestructura. ¿Debemos sacrificar un poco de nuestra soberanía para modernizar nuestra infraestructura?"
 france_md.499.a: "¿Dónde firmamos?"
 france_md.499.b: "Nuestra red de infraestructura ya está muy bien sin ellos."
 france_md.502.t: "Francia está proponiendo invertir en nuestra transición ecológica"
 france_md.502.d: "Durante una agradable discusión con nuestros socios franceses, nos hicieron una oferta bastante tentadora. Como su objetivo a largo plazo es hacer que Europa sea más respetuosa con el medio ambiente, proponen que inviertamos conjuntamente en la transición verde. Por lo tanto, el Gobierno francés ha propuesto que inviertamos en nuestra infraestructura de producción de energía renovable. Esta oferta sería muy beneficiosa para nosotros, pero también beneficiaría a los franceses, que podrían ganar una posición en nuestra generación de electricidad. ¿Debemos sacrificar un poco de nuestra soberanía para promover nuestra transición verde?"
 france_md.502.a: "¿Dónde firmamos?"
 france_md.502.b: "No necesitamos su transición ecológica"
 france_md.520.t: "La Fragmentación continúa"
 france_md.520.d: "Las desgracias nunca vienen cantando. Mientras nos hundimos en las encuestas, nuestro partido se está separando: nuestra ala liberal se ha reunido detrás del partido centrista y el ministro Emmanuel Macron ha lanzado su propio partido, La République en Marche, para desafiarnos. Nuestro ala izquierda también se ha roto, decepcionado por nuestro historial en cuestiones sociales y económicas, reuniéndose detrás de Jean-Luc Mélenchon para construir un partido radical de izquierda propia. Estos acontecimientos son desastrosos, pero también son una señal de que podemos cambiar la marea y ganar nuestro electorado antes de que sea demasiado tarde."
 france_md.520.a: "Curse!"
 france_md.521.t: "Agentes franceses Breach Nuestro Sistema de Defensa"
 france_md.521.d: "Al amanecer de esta mañana, nos despertamos por el sonido de los cuernos y accidentes del coche. Las calles de nuestra capital se estancan debido a lo que parece ser un acto de sabotaje contra nuestra infraestructura de transporte. Nuestros técnicos están haciendo todo lo posible para restaurar la situación, pero los accidentes ya han cobrado la vida de varios miembros de nuestra fuerza policial, y tememos que la seguridad de nuestras fuerzas armadas también pueda estar en riesgo. Este ataque se origina claramente de la Francia bonapartista, que ha estado espiando una retórica hostil hacia nosotros desde hace varios meses. Debemos prepararnos antes de que estos pequeños juegos jugados por agentes secretos se conviertan en la norma."
 france_md.521.a: "Maldita sea."
 france_md.522.t: "Nuestras Fuerzas de Policía han repelido a un Raid francés"
 france_md.522.d: "Fue con un suspiro de alivio que aprendimos que nuestras fuerzas policiales habían logrado evitar un gran acto de sabotaje en nuestra capital. El enemigo logró escapar, pero hemos evitado lo peor. Sin embargo, este ataque ha costado la vida de dos miembros de nuestra fuerza policial durante enfrentamientos esporádicos en las calles de nuestra capital. Esta operación se origina claramente de la Francia bonapartista, que ha estado espiando una retórica hostil hacia nosotros desde hace varios meses. Debemos prepararnos antes de que estos pequeños juegos jugados por agentes secretos se conviertan en la norma."
 france_md.522.a: "No siempre tendremos tanta suerte."
 france_md.523.t: "Francia proclama el Tercer Imperio"
 france_md.523.d: "Francia acaba de declarar el regreso del Imperio. Hace algún tiempo, una facción monárquica nacionalista tomó el poder en Francia y ha consolidado evidentemente su poder. Por lo tanto, han organizado una gran ceremonia para anunciar el regreso del Imperio, y ahora es la charla de la ciudad. De hecho, la ceremonia fue cubierta por los medios de comunicación y ampliamente compartida en las redes sociales. Esta celebración no es simplemente un acontecimiento artístico, sino también una demostración de fuerza por parte de Francia. Desde hace varios meses, Francia ha mostrado públicamente un deseo de conquista y conflicto. Por lo tanto, esta proclamación no es un fin sino un principio: el comienzo de las complicaciones en Europa y en todo el mundo."
 france_md.523.a: "Deberíamos tomar en serio esta amenaza."
 france_md.523.b: "No han sido una amenaza durante mucho tiempo."
 france_md.524.t: "¿Más fondos para el ejército?"
 france_md.524.d: "Nuestras recientes inversiones en defensa fueron vitales para mantener nuestro lugar dentro de la estrategia europea de defensa, pero ¿no podríamos hacer más? Ante la amenaza de que la guerra vuelva a Europa, muchos países aliados han desplegado enormes recursos para preparar sus fuerzas para un conflicto de alta intensidad. Tal vez deberíamos hacer lo mismo e invertir aún más en nuestras capacidades de producción de armas."
 france_md.524.a: "Nunca puedes tener demasiado cuidado."
 france_md.524.b: "Ya hemos gastado mucho."
 france_md.525.t: "Los Recursos para Lograr Nuestras Ambiciones"
 france_md.525.d: "A pesar de nuestros llamamientos para que el pueblo francés trabaje más duro y derrame una cultura de dependencia, la realidad es tenue: nuestro país carece de empleos estables a pesar de una fuerza laboral grande, dispuesta y talentosa. Podríamos impulsar el empleo inyectando fondos en sectores estratégicos de nuestra economía, ya que esperar a que el mercado se corrigiera podría tomar siglos, o podríamos financiar nuestra industria de defensa de vanguardia, inundada con órdenes que carece de los recursos para cumplir, y dejar que el sector civil fend por sí mismo."
 france_md.525.a: "Nuestros ciudadanos necesitan estos empleos"
 france_md.525.b: "Nuestra industria de defensa hará un mejor uso de estos fondos"
 france_md.526.t: "Renacimiento de la actividad económica"
 france_md.526.d: "Años de ultraliberalismo han debilitado nuestra economía, pero sobreviviendo nuestra salida de la Unión Europea exige una robusta y libre de sanciones de la UE. Podríamos invertir en la capital de las empresas privadas francesas para animarlas a establecerse en Francia, reduciendo la participación del Estado en la recuperación, aunque nada garantiza que no inviertan en otros lugares donde el trabajo es más barato. O podríamos subvencionar directamente la creación y el crecimiento de nuevas empresas, una solución que el sector financiero no le gustaría pero que es seguro trabajar."
 france_md.526.a: "Invertimos en el mercado, para que inviertan en Francia."
 france_md.526.b: "Desde una perspectiva humana, el capitalismo no ofrece una solución satisfactoria (Charles de Gaulle)"
 france_md.527.t: "Ampliación de nuestro apoyo a las zonas rurales"
 france_md.527.d: "Nuestro proyecto de traer vitalidad económica a las zonas rurales y periurbanas ya está en marcha, y ahora debemos decidir su próximo paso: seguir ampliando los vínculos de transporte y empleo en regiones menos pobladas, o recurrir a la agricultura y sus sectores dependientes, aislados de los principales centros de toma de decisiones y negados los mismos privilegios. Subvencionarlos mejoraría su acceso a los centros de producción y consumo, y ganaría su favor."
 france_md.527.a: "Seguiremos trayendo conectividad y empleos a los suburbios"
 france_md.527.b: "Vamos a darle ese dinero al sector agroalimentario. Lo pondrán a mejor uso."
 france_md.528.t: "La nueva economía"
 france_md.528.d: "Después de habernos sumergido en industrias costosas e improductivas que ahora se están reubicando, debemos encontrar nuevos trabajos para nuestra población cada vez más cualificada pero todavía subempleada. El sector de servicios es la apuesta más segura para un país desarrollado como el nuestro: genera ingresos fuertes, produce poca contaminación directa y reduce la brecha entre el sector privado y los consumidores. Pero Francia también es reconocida por la investigación, desde la defensa a la medicina y la química, y las crisis repetidas han forzado recortes profundos a la financiación científica. Tal vez deberíamos dedicar más a ello subvencionando programas de investigación."
 france_md.528.a: "El sector de servicios es más rentable y contribuirá a reducir el desempleo"
 france_md.528.b: "Debemos formar parte de esta sociedad del conocimiento"
 france_md.529.t: "¿Más empleos o más servicios?"
 france_md.529.d: "Nuestra reciente inversión en sectores productivos está pagando: hemos detenido la espiral del empobrecimiento y empezamos a reconstruir un mercado laboral estable. Podríamos seguir creando empleos que beneficien a las generaciones futuras, o recurrir a la reconstrucción de los servicios públicos que nuestros predecesores desmantelaron junto con esos puestos de trabajo, dejando que los ciudadanos paguen impuestos pesados por los servicios que se están pagando. Una mejor educación haría que nuestros trabajadores fueran más eficaces, y una mejor atención médica les permitiría vivir más tiempo. ¿Deberíamos centrarnos en los servicios públicos, o el mercado de trabajo sigue siendo nuestra prioridad?"
 france_md.529.a: "Nuestra prioridad es crear más empleos"
 france_md.529.b: "Hemos hecho lo suficiente en el frente laboral, necesitamos reconstruir los servicios públicos"
 france_md.530.t: "Relocate nuestros suministros alimenticios"
 france_md.530.d: "Mientras nos preparamos para traer nuestro suministro de alimentos a casa, surge una pregunta: ¿cómo? Nuestro sector agroalimentario podría alimentarnos solos, pero la competencia injusta nos obliga a importar bienes que no necesitemos, perjudicando al planeta por medio del transporte y la producción irresponsable en el extranjero. Podríamos imponer barreras arancelarias a los alimentos que no necesitamos o que fracasen nuestros estándares, arriesgando la ira de nuestros socios europeos y la OMC. O podríamos permanecer dentro de las reglas del mercado y subvencionar nuestro sector agroalimentario para competir y reducir nuestra dependencia en las importaciones. Lo que decidamos, tenemos los medios; es una cuestión de voluntad."
 france_md.530.a: "El mercado y la libre competencia son dañinos para nuestros residentes y nuestro planeta"
 france_md.530.b: "Tenemos que jugar por las reglas"
 france_md.531.t: "Francia rompe las leyes de libre comercio"
 france_md.531.d: "Acabamos de aprender de un comunicado de prensa del gobierno francés que el gobierno ha decidido reintroducir barreras aduaneras en las importaciones de alimentos. Este movimiento marca el comienzo de lo que llaman un plan para localizar su suministro de alimentos. Aunque tienen numerosos argumentos a su favor, este plan viola muchas leyes de la Organización Mundial del Comercio y de la Unión Europea. Los franceses han firmado acuerdos de libre comercio y deben estar obligados a respetarlos. No es seguro que se enfrentarán a sanciones, pero este movimiento es perjudicial para la integración europea. Sin embargo, nuestro pueblo nos espera para responder a este problema: ¿ha hecho lo correcto o lo incorrecto?"
 france_md.531.a: "Eso es inaceptable"
 france_md.531.b: "Deberíamos hacer lo mismo."
 france_md.532.t: "Nuestra Soberanía Económica"
 france_md.532.d: "Romper libres de los poderes que nos controlaban desde hace mucho tiempo tiene un costo: décadas de gobierno capitalista vendió gran parte de nuestra industria al capital extranjero, que ahora puede huir, obligándonos a reclamar el sector privado antes de que colapse. Podríamos lanzar un plan de trabajo importante, rápido pero costoso para sostener mientras se construyen nuevos centros, o crear puestos dentro de los sectores existentes, más baratos y sostenibles si pueden absorber la fuerza laboral adicional."
 france_md.532.a: "Somos capaces de crear estos nuevos espacios de trabajo dentro de un año"
 france_md.532.b: "Sin construir más, podemos emplear a más personas en las instalaciones existentes"
 france_md.533.t: "Hacia una Coalición de Ala izquierda"
 france_md.533.d: "Después de largos meses de negociación hemos encontrado un terreno común con una amplia gama de partidos de izquierda, que han acordado no oponerse a nuestro gobierno y unirse a nuestra coalición bajo un programa conjunto para una Francia más justa. Este es un masterstroke: nuestro gobierno estaba siendo desafiado por partidos que se negaron a reconocer su legitimidad, y hemos construido una mayoría más robusta sin comprometer nuestros principios. El arreglo significa un aumento modesto de los beneficios sociales, pero ya estábamos planeando que aumentara independientemente."
 france_md.533.a: "La amenaza de una moción de no confianza está fallando"
 france_md.534.t: "Otros partidos de izquierda Rechazar nuestra coalición"
 france_md.534.d: "Los diputados de otros grupos de izquierda anunciaron esta mañana que no apoyarán nuestra coalición propuesta, citando demasiadas diferencias entre nuestros programas y prioridades. Esta es una mala noticia para un gobierno que ya lucha por mantener su posición en una Asamblea Nacional dividida. Aún podemos negociar la factura por cuenta, aunque bajo presión de todos los lados cada vez. Estos partidos han actuado irresponsablemente, y aunque parte de la opinión pública apoya nuestro enfoque unido, eso puede no ser suficiente para garantizar la supervivencia de nuestro gobierno."
 france_md.534.a: "Eso fue un intento de Valiant"
 france_md.535.t: "El Partido Socialista se une al Gobierno"
 france_md.535.d: "Después de largos meses de negociación hemos encontrado un terreno común con el Partido Socialista, que ha acordado dejar de oponerse y unirse al gobierno, bajo un programa conjunto ampliamente modelado por nosotros mismos ya que no estaban en condiciones de imponer el suyo. Este es un masterstroke: nuestro gobierno estaba siendo desafiado por partidos que se negaron a reconocer su legitimidad, y hemos construido una mayoría más estable a un costo mínimo. El acuerdo requiere inversión en el sector privado, no es lo que nuestro electorado esperaba, pero vale la pena si nos permite aprobar legislación."
 france_md.535.a: "Leon Blum estaría orgulloso."
 france_md.536.t: "El Partido Socialista se niega a unirse al Gobierno"
 france_md.536.d: "Los diputados socialistas anunciaron esta mañana que no apoyarán nuestra propuesta de coalición, citando demasiadas diferencias entre nuestros programas, y claramente todavía resentir nuestros ataques contra ellos durante la campaña. Esta es una mala noticia para un gobierno que ya lucha por mantener su posición en una Asamblea Nacional dividida. Aún podemos negociar la factura por cuenta, aunque bajo presión de todos los lados cada vez. Estos partidos han actuado irresponsablemente, y aunque parte de la opinión pública apoya nuestro enfoque unido, eso puede no ser suficiente para garantizar la supervivencia de nuestro gobierno."
 france_md.536.a: "Leon Blum se está convirtiendo en su tumba"
 france_md.537.t: "Un mandato para terminar"
 france_md.537.d: "El mandato del Presidente todavía tiene dos años para correr, y la maquinaria del partido ya está discutiendo sobre qué hacer con ellos. Podemos gobernar ahora bajo los colores del titular y tomar su programa como propio, o mantenernos atrás y dejar que las elecciones de 2002 se arreglen qué partido lidera Francia antes de comprometernos con uno."
 france_md.537.a: "Gobiernan ahora, bajo el presidente sentado"
 france_md.537.b: "Esperar las elecciones de 2002"
 france_md.538.t: "Jacques Chirac se está alejando de la política"
 france_md.538.d: "Tras la derrota de su partido en las elecciones presidenciales, el ex Presidente Chirac decidió poner fin a su carrera política. De ministro a presidente, había recorrido un largo camino y había sido testigo de que Francia cambiara en las Repúblicas Cuarta y Quinta. Sin embargo, las dificultades que enfrenta su partido durante la campaña también están vinculadas a sus políticas, lo cual no apela a todos. Sin embargo, si hay una lección que aprender de su fracaso, es que la situación ha cambiado; el mundo ya no es el mismo, y ya no podemos pensar como lo hicimos antes sin correr riesgos. Todo lo que podemos hacer ahora es esperar que nos vayamos mejor que él."
 france_md.538.a: "Eso le dará tiempo para comer sus manzanas"
 france_md.539.t: "La caída de los Menhir"
 france_md.539.d: "Jean-Marie Le Pen, fundador y ex líder de nuestro partido, está de vuelta en las noticias por las razones equivocadas: después de años de comentarios contra el Holocausto y los antisemitas, ahora se niega a llamar traidor al Mariscal Pétain. Desde el paso hacia abajo ha chocado con la nueva dirección del partido sobre cuestiones desde las pensiones hasta los conflictos del siglo pasado, y sus comentarios nos impiden finalmente tomar nuestro lugar dentro de la corriente principal republicana. Podríamos expulsarlo, aunque eso corre el riesgo de alienar al viejo guardia que comparte sus puntos de vista. ¿De verdad queremos transformar nuestro partido en normas republicanas, o arriesgarnos a perder nuestra identidad?"
 france_md.539.a: "Se ha convertido en una molestia, debemos expulsarlo de la fiesta."
 france_md.539.b: "Sólo recuérdele que se comporte."
 france_md.540.t: "Del frente al Rally"
 france_md.540.d: "Tras numerosos debates y conferencias internos dentro de su partido, las personalidades del Frente Nacional han anunciado cambios significativos en las políticas y el estado del partido. El partido será ahora conocido como el Rally Nacional y está claramente decidido a sacudir su etiqueta como una fiesta de extrema derecha. Con este fin, han anunciado la expulsión de numerosos activistas considerados demasiado extremos y han reafirmado su compromiso de permanecer en la Unión Europea. Este desarrollo marca la etapa final en el declive del antiguo Frente Nacional, ya que es renovado para parecer más aceptable. Aunque estos cambios son menores, debemos hacer todo lo posible para evitar que el público crea que esto cambia cualquier cosa."
 france_md.540.a: "No obstante, son peligrosos"
 france_md.541.t: "La caída de la Santa Sede"
 france_md.541.d: "Actualmente, una potencia extranjera ocupa el Vaticano. Por lo tanto, no podemos garantizar la seguridad del papado mientras el Vaticano permanece bajo el control de nuestros adversarios. Sin embargo, nuestro país ya ha proporcionado un hogar para el papado en el Palacio de los Papas de Aviñón. Por lo tanto, no hay nada que nos impida llevar el Colegio de Cardenales y el actual Papa a Aviñón. Este será un cambio trascendental para la Cristiandad en todo el mundo, pero con el Vaticano bajo ocupación, somos lo suficientemente poderosos como para garantizar la protección de la Iglesia, como nuestro Reino siempre ha hecho."
 france_md.541.a: "El Papado estará a salvo aquí con nosotros."
 france_md.550.t: "Nicolas Sarkozy gana la Presidencia"
 france_md.550.d: "La segunda ronda ha confirmado lo que sugieren las encuestas. Nicolas Sarkozy, el ministro del Interior que construyó su reputación en una línea dura contra los disturbios urbanos, ha llevado a la Unión por un Movimiento Popular al Elysee con un margen claro sobre Segolene Royal. La campaña se luchó por el trabajo, la autoridad y la identidad nacional, y la participación fue la más alta en una generación. El nuevo presidente promete una ruptura con los años Chirac: la reforma de las pensiones, un mercado laboral más estricto y el regreso francés al mando integrado de la Alianza Atlántica. Sus oponentes advierten que la ruptura se sentirá más dura por aquellos que menos pueden pagarla."
 france_md.550.a: "Trabajar más para ganar más."
 france_md.551.t: "Francois Hollande gana la presidencia"
 france_md.551.d: "Después de cinco años de la presidencia de Sarkozy, los socialistas han regresado al poder. Francois Hollande, despedido durante mucho tiempo como gerente del partido en lugar de un estadista, ha ganado la segunda ronda en una plataforma de justicia fiscal, un tratado de presupuesto europeo renegociado y una retirada del Afganistán. La crisis financiera y la emergencia de la eurozona dominaban cada debate, y el presidente saliente no podía escapar de su historial. La nueva administración hereda una economía estancada, un déficit tenso y una asociación europea que espera que Francia dirija en lugar de oponerse."
 france_md.551.a: "El cambio es ahora."
 france_md.552.t: "Emmanuel Macron gana la presidencia"
 france_md.552.d: "El viejo sistema del partido se ha colapsado. Ni los socialistas ni los republicanos llegaron a la segunda vuelta, y el enfrentamiento fue librado entre un movimiento fundado hace apenas un año y el Frente Nacional. Emmanuel Macron, ex banquero de inversiones y ministro de economía, ha ganado cómodamente en una plataforma de liberalización del mercado laboral, integración europea y política que afirma no ser ni de la derecha ni de la izquierda. Su movimiento ahora se enfrenta a las elecciones legislativas sin base parlamentaria y sin máquina local, y sus oponentes en ambos flancos ya están organizando en la calle."
 france_md.552.a: "Ni derecha ni izquierda."
 france_md.553.t: "Emmanuel Macron es reelegido"
 france_md.553.d: "Por segunda vez el despido azotó al presidente contra el Rallye Nacional, y por segunda vez el frente republicano tuvo lugar, aunque por un margen más estrecho que hace cinco años. La campaña fue sobrevalorada por la guerra en Europa, por precios energéticos y por una reforma de pensiones que el presidente ha prometido llevar a cabo independientemente. Se convierte en el primer presidente francés en veinte años para ganar un segundo mandato, y el primero en hacerlo con una extrema derecha que nunca ha estado más cerca del poder."
 france_md.553.a: "Un segundo término, y uno más estrecho."
 france_md.503.t: "Oposición a [FRA.GetLeader]: ¿Cuál es la Tendencia?"
 france_md.503.d: "A medida que el mandato del Presidente [FRA.GetLeader] termina, la campaña presidencial está entrando en su tramo final y el equilibrio de poder electoral se está volviendo claro. El favorito, Lionel Jospin, sirvió como Primer Ministro bajo Chirac, llevando a cabo políticas socialdemócratas acordes con los estándares europeos mientras se distanciaba de la tradición socialista: moderna, pero no socialista. Varios candidatos de izquierda de los Verdes y el Partido Comunista Francés carecen de los recursos para ganar de forma directa, pero todavía podrían ganar impulso. ¿Es la izquierda en su conjunto el favorito claro, o podría sus divisiones impulsar a otro candidato a la segunda vuelta?"
 france_md.503.a: "La izquierda está logrando ganar sobre el electorado"
 france_md.503.b: "Ninguno de los candidatos de izquierda ha asegurado el apoyo que esperaban"
 france_md.986.t: "Lionel Jospin se enfrenta a la crítica"
 france_md.986.d: "Aunque es el candidato favorito de la izquierda para las próximas elecciones, Lionel Jospin no disfruta del apoyo unánime dentro de la izquierda respecto a su manifiesto, visto por algunos como demasiado liberal y muy similar al de Chirac. Oponerlo es el Partido Comunista Francés; aunque ahora una sombra de su anterior yo desde el final de la Guerra Fría, todavía tiene aliados dentro de la izquierda radical y puede apelar a los desilusionados por el segundo mandato del ex Presidente Mitterrand. Podría atacar a Jospin sobre su cambio hacia el liberalismo, pero ¿lo hará?"
 france_md.986.a: "El PCF ha decidido no atacar a Lionel Jospin"
 france_md.986.b: "El PCF ha logrado ganar sobre los votantes de izquierda"
 france_md.986.c: "Un ataque inconclusivo por el PCF"
 france_md.987.t: "Lionel Jospin Dada Well Ahead"
 france_md.987.d: "Lionel Jospin y el triunfo del Partido Socialista son indiscutibles dentro de la izquierda. Aunque antes había venido bajo fuego, sus oponentes no están en posición de desafiarlo ni de llegar a la segunda vuelta. Si estamos de acuerdo con su programa o no, será él contra [FRA.GetLeader] en la segunda vuelta de las elecciones presidenciales."
 france_md.987.a: "No podría haber sido de otra manera."
 france_md.988.t: "Resurgencia Comunista"
 france_md.988.d: "Atacar a Jospin sobre sus vínculos con la izquierda fue la llamada correcta. El voto socialista se dividió entre izquierda y centro, dando al PCF la credibilidad que carecía para liderar la oposición a las políticas liberales y conservadoras que han prevalecido demasiado tiempo. El PCF ha conseguido una alianza con otros socios de izquierda como la Liga Comunista Revolucionaria y Lutte Ouvrière. Sin embargo, los centristas insatisfechos con [FRA.GetLeader] habrían preferido a Jospin una alianza radical, y es probable que voten contra nosotros en la segunda ronda. Tal vez podamos organizar la inversión local en sus ciudades a cambio de su silencio."
 france_md.988.a: "Los centristas se abstendrán"
 france_md.988.b: "Los centristas pedirán un frente unido contra la izquierda"
 france_md.989.t: "An Unlikely Favourite"
 france_md.989.d: "El final de esta campaña presidencial ha demostrado turbulencia para muchos partidos. Tras los ataques del PCF contra Lionel Jospin, los comunistas y socialistas han emprendido una batalla mediática implacable, y como ninguna de las partes ha hecho su caso, el electorado de izquierda se ha convertido en un candidato menos controvertido y más medido. El Partido Verde ha aprovechado la oportunidad para presentarse como voz de calma y razón en medio de la tormenta. Por lo tanto, es muy probable que los Verdes lleguen a la segunda vuelta, donde enfrentarán a un ex presidente debilitado por el final de su mandato."
 france_md.989.a: "¿Quién lo hubiera creído?"
 france_md.990.t: "Ni Izquierda ni Derecha"
 france_md.990.d: "Con los conservadores ya en la segunda vuelta y con la izquierda en desarmar, el ex presidente parece estar seguro de ganar, aunque las incertidumbres permanecen. Algunos franceses están cansados de la división izquierda-derecha que ha moldeado la política durante décadas, que ya no se adapta a un tiempo centrado en la estabilidad y la integración europea. Por lo tanto, la Unión Liberal para la Democracia Francesa tiene un caso que hacer: La política de independencia de Chirac ya no lleva mucho peso en un mundo donde están surgiendo nuevos poderes y bloques. El centro liberal tiene un papel que desempeñar, pero ¿convencerá al electorado de esta nueva realidad?"
 france_md.990.a: "Los liberales lograrán captar la atención de las personas"
 france_md.990.b: "El restos francés comprometido con su soberanía"
 france_md.991.t: "El Campamento Soberano Dividido"
 france_md.991.d: "Con el centro liberal incapaz de hacer su caso, los votantes cansados de la brecha izquierda-derecha se han dirigido hacia los soberanos. Ese campamento, sin embargo, habla con dos voces. El Rally for the Republic lleva la tradición gaullista de independencia nacional a la corriente principal, respetable y adecuada para gobernar, mientras que el Frente Nacional ofrece una línea más difícil que los partidos establecidos han pasado dos décadas conteniendo. Ambos reclaman el mismo electorado desilusionado. Cuál de ellos llega a la segunda ronda decidirá si el eurocepticismo francés sigue siendo el negocio del derecho gobernante, o se escapa por completo del cordón sanitario."
 france_md.991.a: "La tradición gaullista sigue ordenando el voto soberano"
 france_md.991.b: "El Frente Nacional capitalizará el descontento"
 france_md.510.t: "Nadie pudo haberlo visto venir"
 france_md.510.d: "Dada la incapacidad de los partidos para captar la atención de los votantes, ninguno tiene la fuerza para llegar a la segunda ronda contra [FRA.GetLeader]. Benefiando por la desaparición de sus rivales desde el punto de vista, el Frente Nacional ha escapado a sus controversias y, a pesar de su líder Jean-Marie Le Pen, podría calificarse concebiblemente. Sigue siendo poco probable: Lionel Jospin sigue siendo el favorito, y seguramente perdería a [FRA.GetLeader]. Pero si el FN llegara a la segunda vuelta, ¿cómo reaccionarían las otras partes?"
 france_md.510.a: "Las partes no estarán preocupadas por el aumento del extremismo"
 france_md.510.b: "Todos los partidos pedirán a los votantes que voten contra el Frente Nacional"
 france_md.511.t: "Día de las elecciones"
 france_md.511.d: "Después de meses de una campaña turbulenta llena de giros y vueltas, finalmente ha llegado el momento de que los franceses voten. Esta es simplemente la primera ronda, diseñada para reducir el campo a los dos candidatos que han conseguido el mayor apoyo del público francés. Luego se celebrará una segunda ronda para decidir entre ellos si ninguno de los candidatos asegura la mayoría."
 france_md.511.a: "¡Vamos a votar!"
 france_md.512.t: "El Frente Nacional está predicho a ganar las elecciones presidenciales"
 france_md.512.d: "Para la sorpresa de todos, el Frente Nacional surgió victorioso desde la primera ronda, cuando todas las predicciones habían apuntado a una cabeza a cabeza entre Jospin y [FRA.GetLeader]. Dada la incapacidad de los otros candidatos para vencer al electorado, el Frente lo logró hasta la segunda vuelta, y las cosas se ven sombrías [FRA.GetLeader]: los otros partidos no han pedido a los votantes que le apoyen, sus políticas son demasiado controvertidas para algunos. Se espera que una sección del electorado se reúna contra el candidato de extrema derecha, pero derrotar a Le Pen, quien se castigó como la opción anti-establecimiento, está lejos de ser garantizado."
 france_md.512.a: "¿Qué acaba de pasar?"
 france_md.513.t: "El Frente Nacional envuelve la Segunda Ronda"
 france_md.513.d: "Para la sorpresa de todos, el Frente Nacional surgió victorioso desde la primera ronda, cuando todas las predicciones habían apuntado a una cabeza a cabeza entre Jospin y [FRA.GetLeader]. Dada la incapacidad de los otros candidatos para ganar sobre el electorado, el Frente lo logró hasta la segunda vuelta. Afortunadamente, [FRA.GetLeader] debe llegar a la cima: los partidos políticos y la sociedad civil, conmocionados por un partido de extrema derecha que llega al enfrentamiento, han pedido una votación masiva contra Le Pen. Grandes manifestaciones han tenido lugar en todo el país en apoyo del presidente saliente. Este es un evento histórico; esperemos que sea el único."
 france_md.513.a: "¿Cómo diablos terminamos en esta situación?"
 france_md.514.t: "El PCF declaró ganador de las elecciones presidenciales"
 france_md.514.d: "Para sorpresa de todos, el Partido Comunista Francés ha surgido victorioso desde la primera ronda, meses después de languidecerse en su más baja época desde el final de la Guerra Fría. Las debilidades del candidato Jospin y una alianza de la izquierda radical permitieron que el PCF reuniera a la izquierda y asegurara una clara ventaja en la segunda vuelta, con los socialistas y centristas accediendo a no oponerse a ella siempre que no abandone la UE. Su líder equilibraba la oposición al orden liberal con el reformismo para evitar alienar el centro. La victoria del PCF está fuera de duda, pero ¿puede sostener su coalición?"
 france_md.514.a: "Los mejores días están aquí por fin."
 france_md.515.t: "El PCF lo ha hecho a través de la Segunda Ronda"
 france_md.515.d: "Para la sorpresa de todos, el Partido Comunista Francés ha surgido victorioso desde la primera vuelta, apenas meses después de languidecer en su más baja época desde el final de la Guerra Fría. Las debilidades del candidato Jospin y una alianza de la izquierda radical permitieron al PCF asegurar un lugar en la segunda vuelta. Su victoria no es completa, sin embargo: los centristas han anunciado que votarán por [FRA.GetLeader], viendo un triunfo radical-izquierda como un mal presagio para la integración europea y los mercados. La segunda vuelta aún no ha tenido lugar, pero hay una fuerte probabilidad de que [FRA.GetLeader] triunfe una vez más."
 france_md.515.a: "Eso fue una llamada cercana."
 france_md.516.t: "El FPR ha alcanzado la Segunda Ronda"
 france_md.516.d: "Para sorpresa de todos, el presidente saliente fue derribado de la segunda vuelta, derribado por su propio partido: el gaullista Charles Pasqua logró sacar suficientes conservadores y soberanos del derecho a interrumpir la campaña [FRA.GetLeader]. Sin embargo, el FPR no está solo en la segunda ronda. Allí se enfrentará a Lionel Jospin, el candidato socialista que llegó a la escorrentía a pesar de las divisiones internas de la izquierda. Este concurso será combatido ferozmente, porque no es simplemente el socialismo contra el conservadurismo: la próxima semana, el pueblo francés decidirá si quiere más o menos de Europa."
 france_md.516.a: "La soberanía prevalecerá"
 france_md.516.b: "El voto de protesta sigue en la minoría"
 france_md.517.t: "El UDF hace frente a la Segunda Ronda"
 france_md.517.d: "La manifestación de votantes proeuropeos detrás del UDF permitió que el partido llegara a la segunda ronda. Los socialistas no eran los únicos que promovían la Unión Europea, y los liberales estaban más cerca de los valores liberales de la Unión Europea. La gente suele preferir el original a la imitación. Por lo tanto, el UDF ha logrado unirse al presidente titular en la segunda ronda. Por lo tanto, es un concurso entre la política de independencia de Chirac y la Europa liberal a cualquier costo. Es probable que esta elección sea cercana, ya que los bloques principales están muy divididos en este tema. Afortunadamente, no tendremos mucho tiempo para esperar, ya que la segunda ronda está a la vuelta de la esquina."
 france_md.517.a: "El viejo conservador se mantiene a raya"
 france_md.517.b: "El manifiesto de la UDF está demostrando un poco demasiado liberal para el electorado"
 france_md.518.t: "Los Verdes lo hacen a través de la Segunda Ronda"
 france_md.518.d: "Tras una campaña entre los partidos de izquierda, los Verdes lograron, para sorpresa de todos, pasar a la segunda vuelta. Su programa social y ambiental está al borde del progreso, y habiendo mantenido su fresco en medio de los enfrentamientos PCF-PS, han llegado a encarnar la solución más sabia y justa. Ahora se unen al presidente saliente en la segunda ronda. El concurso es probable que se luche ferozmente, pero por una vez hay unanimidad dentro de cada bloque: el progreso del voto izquierdo, el conservadurismo derecho y el choque de la semana próxima será tanto sobre el medio ambiente como asuntos sociales."
 france_md.518.a: "El software anticuado y conservador ya no está a la altura de los desafíos de nuestro milenio"
 france_md.518.b: "El medio ambiente todavía no tiene prioridad suficiente."
 france_md.519.t: "Lionel Jospin ha calificado para la Segunda Ronda"
 france_md.519.d: "Como predijo por todas las encuestas, el candidato socialista ha llegado a la segunda vuelta sin demasiados problemas. Su programa moderno y proeuropeo ha ganado por igual a los socialistas y centristas, dándole una fuerte base de votantes, mientras que los partidos más radicales de izquierda, profundamente divididos, no plantearon ninguna amenaza al ex Primer Ministro. Ahora enfrentará a su rival esta semana, una vez más el enfrentamiento entre el progresismo y el conservadurismo. Pero las encuestas son cercanas, y Jospin puede necesitar el apoyo de los partidos de izquierda, ya que la RPR podría beneficiarse de más grupos de derecha que no están dispuestos a aceptar un presidente socialista."
 france_md.519.a: "Jospin consigue ganar sobre el resto de la izquierda"
 france_md.519.b: "Jospin no logró ganar más votantes a la izquierda, ya que su programa era demasiado liberal"
 FRA_Macron_eco: "La Ley Macron"
 FRA_Macron_eco_desc: "Hemos decidido seguir la política establecida por nuestro Ministro de Finanzas, Emmanuel Macron. Una ley que simplificará la inversión y el empleo al reducir el gasto público."
 FRA_Ferrand_eco: "La Ley de Ferrand"
 FRA_Ferrand_eco_desc: "Hemos decidido seguir la política establecida por nuestro Ministro de Finanzas, Olivier Ferrand. Una ley que simplificará la inversión y el empleo al reducir el gasto público."
 FRA_ineluctable_collapse: "Coalición en colapso"
 FRA_ineluctable_collapse_desc: "Nuestro partido y nuestra coalición se están desmoronando; debemos resolver esto rápidamente antes de que sea demasiado tarde!"
 FRA_manif_pour_tous: "La Manif pour Tous"
 FRA_manif_pour_tous_desc: "Cientos de miles en las calles cada mes, un movimiento conservador el derecho no había logrado construir en veinte años, y un partido gobernante que ahora tiene que legislar a través de él."
 FRA_grand_debat: "Le Grand Débat National"
 FRA_grand_debat_desc: "Diez mil ayuntamientos, dos millones de contribuciones y un paquete de concesión lo suficientemente pesado como para vaciar las rotondas. La paz era real. Y la cuenta."
 FRA_bassin_minier: "La Promesa Bassin Minier"
 FRA_bassin_minier_desc: "Furnaces relit y ranuras abiertas en el antiguo campo de carbón y el Midi. La promesa mantiene el camino de regreso mientras se mantenga la promesa."
 FRA_resist_inevitable: "Esfuerzos de estabilización"
 FRA_resist_inevitable_desc: "La disminución no es irreversible. Nuestros militantes están de vuelta en las puertas, y la deriva de nosotros se ha ralentizado."
 FRA_resist_inevitable2: "Esfuerzos de estabilización"
 FRA_resist_inevitable2_desc: "El sangrado se ha detenido. Hemos reafirmado al partido, y hemos prestado nuestra atención a la base industrial en la que dependen nuestros votantes."
 FRA_resist_inevitable3: "Esfuerzos de estabilización"
 FRA_resist_inevitable3_desc: "Hemos superado los obituarios. El partido se mantiene firme de nuevo, con una base establecida y un programa que nuestros rivales deben responder ahora."
 FRA_socialism_renew: "Socialismo Renovado"
 FRA_socialism_renew_desc: "Hemos reconstruido la legitimidad de nuestro partido sobre bases sólidas. El futuro está por delante de nosotros."
 FRA_pension_reform: "Reforma de la pensión"
 FRA_pension_reform_desc: "A la luz de la crisis presupuestaria que enfrentamos, hemos tenido que elevar la edad de jubilación para nuestros ciudadanos; no estaban contentos con ello, pero tuvimos que hacerlo"
 FRA_french_rearmament: "Re-armament Phase 1"
 FRA_french_rearmament_desc: "Con tensiones que se remontan de nuevo en Europa, no tenemos más remedio que rearme para evitar lo peor."
 FRA_french_rearmament2: "Re-armament Phase 2"
 FRA_french_rearmament2_desc: "El entrenamiento de más soldados no es suficiente; debemos aumentar nuestra capacidad para producir armas"
 FRA_french_rearmament3: "Accomplished Re-armament"
 FRA_french_rearmament3_desc: "Nuestra población y nuestras fuerzas armadas están preparadas para enfrentar un conflicto a gran escala"
 french_nuclear_expert: "Expertos nucleares en Francia"
 french_nuclear_expert_desc: "Hemos aceptado la asistencia de expertos franceses en tecnología nuclear. Nos ayudarán a construir nuestra independencia energética."
 french_dissuasion: "Deterrence nuclear francés"
 french_dissuasion_desc: "Hemos acordado aceptar la protección de Francia y la Unión Europea en caso de conflicto con un poder hostil."
 FRA_Our_project: "Nuestro Proyecto para Francia"
 FRA_Our_project_desc: "A pesar de la resistencia inicial del público, han llegado a darse cuenta de que todo lo que hacemos debe hacerse para proteger el futuro de Francia. Más que nunca, estamos protegidos de la agitación económica y geopolítica. Y este será el caso durante mucho tiempo por venir."
 FRA_french_independant1: "Un curso de nuestro propio"
 FRA_french_independant1_desc: "Francia no caerá en la línea detrás de cualquier bloque. De pie nos gana el oído de cada otro poder que se niega a elegir un maestro."
 FRA_french_independant2: "Respondiendo a No Capital"
 FRA_french_independant2_desc: "Nuestra negativa a alinear se ha endurecido en la política establecida. Ni Washington ni Moscú esperan ahora nuestro voto, y el mundo no alineado nos trata como uno de sus propios."
 FRA_french_independant3: "Independencia bajo las armas"
 FRA_french_independant3_desc: "La independencia ya no es una postura diplomática sino una doctrina defensiva. Una nación que responda a nadie debe ser capaz de mantener su propia tierra sin ayuda, y la nuestra ahora puede."
 FRA_NATO_support: "Apoyo de la OTAN"
 FRA_NATO_support_desc: "Al reafirmar nuestro apoyo a nuestra alianza, hemos forjado alianzas con otros países miembros."
 FRA_entente_china: "Entente con China"
 FRA_entente_china_desc: "Hemos concertado acuerdos con China para facilitar el comercio entre nuestro país y el suyo."
 FRA_regulation: "Regulación del mercado"
 FRA_regulation_desc: "Acordando regular el mercado y sus actividades, podemos evitar crisis futuras."
 FRA_eternal_fra: "Eternal France"
 FRA_eternal_fra_desc: "Estamos llegando al final de nuestro programa, confiados en que hemos demostrado el mundo que Francia ha vuelto y nunca se desvanecerá desde la etapa internacional."
 FRA_europhile_anger_idea: "Pro-Demonstraciones europeas"
 FRA_europhile_anger_idea_desc: "Algunos miembros de nuestra población se muestran reacios a abandonar la Unión Europea. Esto sólo durará un tiempo, pero debemos asegurarnos de que el pueblo francés comprenda que esta es la única manera de avanzar."
 FRA_EU_Retaliate: "Recuperación de la economía"
 FRA_EU_Retaliate_desc: "Salir de la Unión Europea nos ha puesto en una posición económica difícil, pero retrocederemos, sea cual sea el costo."
 FRA_EU_Retaliate2: "Recuperación inicial"
 FRA_EU_Retaliate2_desc: "Nuestros esfuerzos están empezando a pagar; nuestra economía se está recuperando, y esta vez no hay nadie que nos presione o nos impida hacer lo que queremos con nuestro dinero."
 FRA_russian_cooperation1: "La Cooperación Rusa"
 FRA_russian_cooperation1_desc: "El Gobierno ruso ha acordado compartir con nosotros su experiencia industrial. Que esta cooperación continúe."
 FRA_russian_cooperation2: "La Asociación de Rusia"
 FRA_russian_cooperation2_desc: "El Gobierno ruso ha acordado compartir con nosotros su experiencia industrial y militar. Que esta cooperación continúe."
 FRA_a_certain_idea: "A Cierta Idea de Francia"
 FRA_a_certain_idea_desc: "Hemos logrado llegar al final de nuestro viaje. Hemos rescatado a Francia de ser marginada en favor de Europa. La independencia de Francia está asegurada. Nuestro maestro Charles de Gaulle estaría orgulloso de nosotros."
 FRA_blocade: "Flujos de comercio perturbados"
 FRA_blocade_desc: "Nos negamos a entregarnos al chantaje de Francia, así que están haciendo todo lo posible para evitar que los bienes del resto de la Unión Europea nos alcancen."
 FRA_shocking: "Población decepcionada"
 FRA_shocking_desc: "Nuestro pueblo estaba muy entusiasmado con el plan para la Sexta República, pero al final decidimos mantener la constitución como era. No estaban contentos con eso."
 FRA_draft6threp: "Instalabilidad política"
 FRA_draft6threp_desc: "Nuestro deseo de cambio radical a la constitución de nuestra república ha generado mucho entusiasmo entre la población. Abre nuevos horizontes para el pueblo. Sin embargo, también allana el camino para la aparición de nuevos movimientos políticos que no siempre estarán a nuestro favor."
 FRA_fail6threp: "El fracaso de la reforma"
 FRA_fail6threp_desc: "Hemos fracasado en liberar a nuestro pueblo de la Quinta República; finalmente han perdido la esperanza ante la dificultad de llegar a un consenso. Tal vez podamos lograr un cambio en nuestras leyes, pero en lo que respecta a nuestro pueblo, no habremos podido traerles el cambio que esperaban."
 FRA_ecological_transition: "Garantizar la transición ecológica"
 FRA_ecological_transition_desc: "Para asegurar un futuro para las próximas generaciones, necesitamos proteger el medio ambiente. Para ello, debemos cambiar la forma en que consumimos y producimos."
 FRA_insoumission: "L'Insoumission"
 FRA_insoumission_desc: "Hemos llevado a cabo con éxito el programa para el cual fuimos elegidos. Hemos hecho que Francia sea más social, ambientalmente consciente y humanista de lo que ha sido. Pero todavía tenemos mucho que lograr, y nos elevaremos al desafío. Debemos hacerlo aún mejor."
 FRA_eu_social_climate: "Reformas sociales y ambientales"
 FRA_eu_social_climate_desc: "Hemos acordado seguir el ejemplo de La France Insoumise. Nuestro pueblo ha sido inspirado por su ejemplo. Aunque está cobrando su precio en nuestras finanzas, se puede considerar como una inversión a largo plazo."
 FRA_research_boost: "Inversiones de investigación"
 FRA_research_boost_desc: "Hemos invertido mucho en investigación y educación para asegurar que las generaciones futuras estén aún mejor equipadas para hacer frente a los desafíos modernos. Esto debe pagar a largo plazo."
 FRA_refit_network: "Refitiendo nuestra Red de Transportes"
 FRA_refit_network_desc: "Para optimizar el transporte de mercancías y pasajeros, primero debemos modernizar nuestra red de transporte. Hemos reservado los recursos necesarios para hacerlo."
 FRA_eden_garden: "Nuestro jardín del Edén"
 FRA_eden_garden_desc: "Al hacer todo lo posible por proteger a nuestro país y al mundo de los estragos del cambio climático, hemos sentado las bases para una sociedad equipada para enfrentar los desafíos de nuestro milenio. La lucha contra el cambio climático requerirá más esfuerzos, pero hemos hecho todo lo posible para dirigir el movimiento."
 FRA_eu_green_reform: "Reformas ambientales"
 FRA_eu_green_reform_desc: "Hemos decidido seguir el ejemplo de los Verdes franceses invirtiendo en la transición verde. Aunque esto reducirá el crecimiento de nuestro país, es una inversión en las generaciones futuras."
 FRA_EU_transit: "Fondo de apoyo para la transición ecológica"
 FRA_EU_transit_desc: "Hemos acordado formar parte del fondo de apoyo para la transición ecológica. Esta iniciativa fue lanzada por los Verdes Franceses y tiene como objetivo hacer que la transición de una economía basada en el carbono a una economía con bajas emisiones de carbono."
 FRA_eu_ban_fossile: "Fusil Fossil"
 FRA_eu_ban_fossile_desc: "Estamos en el proceso de eliminar los combustibles fósiles. Nuestros vehículos funcionarán con electricidad, y los combustibles fósiles solo se utilizarán para fines marginales. Esta transición, iniciada por los Verdes franceses, será costosa. Pero es una inversión en nuestro futuro y en nuestra independencia de las naciones productoras del petróleo."
 FRA_regulation_agra: "Reglamento agrícola"
 FRA_regulation_agra_desc: "Acordamos cumplir con las normas de producción alimentaria de la Unión Europea. Era nuestra única opción si no queríamos perder a un socio comercial clave."
 FRA_regulation_indus: "Reglamento Industrial"
 FRA_regulation_indus_desc: "Acordamos cumplir con las normas de producción de bienes de la Unión Europea. Era nuestra única opción si no queríamos perder a un socio comercial clave."
 FRA_regulation_fuel: "Reglamento sobre extracción de petróleo"
 FRA_regulation_fuel_desc: "Acordamos cumplir con las normas de extracción de combustible de la Unión Europea. Era nuestra única opción si no queríamos perder a un socio comercial clave."
 FRA_EU_rail: "Creación de una red europea de transporte"
 FRA_EU_rail_desc: "Hemos acordado ayudar a Francia y al resto de la Unión Europea a trabajar juntos para construir una red de transporte mejor que facilite el comercio y optimizar el transporte de mercancías."
 FRA_eu_pcf_reform: "Compra de la Paz Social"
 FRA_eu_pcf_reform_desc: "Acordamos hacer concesiones a nuestra izquierda radical después de que empezaran a revolver tras la victoria del comunismo en Francia. Les dimos lo que querían, y ahora deberían callarse."
 FRA_fr_military_assistance: "Asistencia militar francesa"
 FRA_fr_military_assistance_desc: "Hemos aceptado la asistencia de Francia en la preparación de nuestras fuerzas armadas para un conflicto de alta intensidad con Rusia. El día que crucen nuestra frontera, estaremos listos."
 FRA_european_internationale: "El internacional europeo"
 FRA_european_internationale_desc: "Hemos formado una alianza con otro poder comunista en Europa. Juntos derrotaremos al capitalismo y al fascismo de una vez por todas."
 FRA_international_will_be_humankind: "La Internacional será la raza humana"
 FRA_international_will_be_humankind_desc: "Hemos logrado consolidar nuestro poder duro. Hemos logrado lo imposible: hemos conseguido el triunfo duradero del comunismo en Francia. Aún queda mucho por hacer, pero hemos sentado las bases adecuadas para la lucha contra el capitalismo y el fascismo en Francia."
 FRA_eu_FN_reform: "Garantía de seguridad"
 FRA_eu_FN_reform_desc: "Hemos respondido positivamente al llamamiento de nuestro pueblo para poner en práctica la preferencia nacional y hacer frente a la inseguridad. Aunque estas reformas son consecuencia del aumento de la extrema derecha en Europa, también fortalecen nuestra capacidad para ejercer el control sobre nuestra población, lo cual es algo bueno."
 FRA_nuke_boost: "Primacía nuclear"
 FRA_nuke_boost_desc: "La energía nuclear nos ha proporcionado energía durante décadas; es una manera fantástica de generar energía con bajas emisiones de carbono a bajo costo. Simplemente debemos intensificar la vigilancia de estos reactores para asegurar que no ocurra nada serio."
 FRA_Boreal_Space: "The Boréal Space"
 FRA_Boreal_Space_desc: "El Espacio Boréal es una asociación entre la Esfera Rusa y la Francósfera, con el objetivo de integrar a Rusia en una alianza europea. Nuestro objetivo de hoy es combatir la amenaza ultraglobalista, un enemigo que compartimos."
 FRA_france_for_french: "Francia para francés"
 FRA_france_for_french_desc: "Desde nuestra fundación, hemos tenido que contender con una facción pro-inmigración que siempre se ha unido contra nosotros. Pero ahora que hemos completado nuestro programa, hemos demostrado nuestra capacidad de dirigir y guiar a Francia hacia su destino; cualquier otra resistencia es ahora inútil."
 FRA_red_purges: "La Purga del Cuerpo de Oficiales"
 FRA_red_purges_desc: "El viejo cuerpo de oficiales nunca fue nuestro, así que lo hemos roto y promovido de las filas en su lugar. El mando es leal ahora, y barato para reemplazar, pero un ejército profesional ha sido negociado por uno que todavía está aprendiendo su comercio bajo fuego."
 FRA_people_constitution: "La Constitución Popular"
 FRA_people_constitution_desc: "Nuestra revolución ha sido un éxito, pero debemos consolidar nuestro poder dando a los trabajadores la oportunidad de decidir por sí mismos cómo quieren ser gobernados."
 FRA_commies_redarmy1: "El Nuevo Ejército Rojo"
 FRA_commies_redarmy1_desc: "Nuestra revolución necesita un ejército para defenderse y difundir su causa. Basándonos en los cimientos del ejército francés, hemos establecido una nueva fuerza que defenderá al pueblo y a la revolución."
 FRA_commies_redarmy2: "El Nuevo Ejército Rojo"
 FRA_commies_redarmy2_desc: "Nuestra revolución necesita un ejército para defenderse y difundir su causa. Basándonos en los cimientos del ejército francés, hemos establecido una nueva fuerza que defenderá al pueblo y a la revolución."
 FRA_red_agent_lar: "Dirección General de Acción Revolucionaria"
 FRA_red_agent_lar_desc: "Hemos modelado nuestro enfoque en las técnicas del DGSE para obtener información crucial sobre nuestros enemigos reaccionarios y capitalistas."
 FRA_red_agent_non_lar: "Dirección General de Acción Revolucionaria"
 FRA_red_agent_non_lar_desc: "Hemos modelado nuestro enfoque en las técnicas del DGSE para obtener información crucial sobre nuestros enemigos reaccionarios y capitalistas."
 FRA_monarchist_anger: "La ira de los monarquistas"
 FRA_monarchist_anger_desc: "Nuestros aliados monarquistas estaban decepcionados por nuestra negativa a restaurar los privilegios aristocráticos. El bonapartismo es un heredero de la revolución; no podría ser de otra manera."
 FRA_bonapart_constitution: "La Constitución bonapartista"
 FRA_bonapart_constitution_desc: "Desde la Tercera República, nuestras instituciones ya no han sido diseñadas para dar cabida a un Emperador de nuestra estatura. Por lo tanto, debemos adaptar la constitución a nuestro próximo reinado. Podemos aprovechar esta oportunidad para abordar algunas de las críticas a nivel de nuestro pueblo en las repúblicas anteriores; eso será un paso en la dirección correcta para ellos."
 FRA_bonapart_military_reform: "Reorganización del Grande Armée"
 FRA_bonapart_military_reform_desc: "Nuestras fuerzas armadas son suficientes para garantizar nuestra seguridad dentro de nuestro territorio, pero no son suficientes para llevar a cabo nuestros planes de recuperar nuestro Imperio. Una reestructuración es esencial; vamos a desmantelar todo desde lo más alto, para que podamos reformar cada rama con mayor eficacia."
 FRA_army_reformed_1: "Cadena Reestructurada del Mando"
 FRA_army_reformed_1_desc: "Ahora que nuestra cadena de mando ha sido reestructurada, podemos permitirnos llevar a cabo una reforma más amplia de nuestras fuerzas armadas, incluyendo su libro de tecnología y orden. Un compromiso importante está por delante, pero esto nos dará los recursos para realizar nuestras ambiciones."
 FRA_army_reformed_infantry: "Reforma del Grande Armée: La Línea de Infantería"
 FRA_army_reformed_infantry_desc: "Nuestro Emperador ha gobernado a favor de un avance lento y controlado. Por consiguiente, se dará prioridad a la infantería y al equipo que necesiten."
 FRA_army_reformed_cavalry: "Reforma de la Grande Armée: La cuñada blindada"
 FRA_army_reformed_cavalry_desc: "Nuestro Emperador ha gobernado a favor de un ataque rápido y poderoso. Por lo tanto, se dará prioridad a los batallones de tanque y al equipo que necesiten."
 FRA_army_reformed_artillery_infantry: "Reforma del Grande Armée: Infantería y Armas"
 FRA_army_reformed_artillery_infantry_desc: "Nuestro Emperador ha gobernado a favor de un avance lento y controlado apoyado por la artillería. Por lo tanto, se dará prioridad a la infantería y artillería, así como al equipo asociado."
 FRA_army_reformed_artillery_cavalry: "Reforma del Grande Armée: Armour and Guns"
 FRA_army_reformed_artillery_cavalry_desc: "Nuestro Emperador ha gobernado a favor de un ataque rápido y poderoso apoyado por la artillería. Por lo tanto, se dará prioridad a los batallones de tanque y la artillería, así como al equipo asociado."
 FRA_army_reformed_air_infantry: "Reforma del Grande Armée: Infantería y Energía Aérea"
 FRA_army_reformed_air_infantry_desc: "Nuestro Emperador ha gobernado a favor de un avance lento y controlado apoyado por aviones de ataque. Por lo tanto, se dará prioridad a los batallones de infantería y aviones de producción masiva."
 FRA_army_reformed_air_cavalry: "Reforma del Grande Armée: Armour and Air Power"
 FRA_army_reformed_air_cavalry_desc: "Nuestro Emperador ha gobernado a favor de un ataque rápido y poderoso apoyado por aviones de ataque. Por lo tanto, se dará prioridad a los batallones de tanques y aviones productores de masa."
 FRA_BCE_money: "El dinero de la UE"
 FRA_BCE_money_desc: "Hemos logrado negociar nuestro regreso a las instituciones de la Unión Europea a cambio de ayuda del Banco Europeo. Esta ayuda será vital en la preparación de las guerras que vamos a librar contra ellos!"
 FRA_4th_empire_desc: "El Imperio Bonapartista ha vuelto, más fuerte que nunca, y esta vez no seremos derrotados por ninguna coalición en absoluto."
 FRA_grande_arme_art_inf: "El Armée Moderno Grande"
 FRA_grande_arme_art_inf_desc: "Después de meses de reformas, nuestro ejército está totalmente preparado para reclamar los territorios perdidos del Imperio. Tras una revisión completa de su sistema, lo hemos reconstruido alrededor de una estrategia de avance lento y constante, respaldada por intensos bombardeos de líneas enemigas. La infantería sigue siendo el rey del campo de batalla, pero la fuerza aérea de asalto hará su tarea considerablemente más fácil."
 FRA_grande_arme_art_cav: "Un diluvio de fuego y acero"
 FRA_grande_arme_art_cav_desc: "Después de meses de reformas, nuestro ejército está totalmente preparado para reclamar los territorios perdidos del Imperio. Tras una revisión completa de su sistema, lo hemos reconstruido en torno a una estrategia de avance rápido y brutal, respaldada por bombardeos intensivos. Esta estrategia se basa en recursos tecnológicamente avanzados, pero tenemos los medios para superar el diluvio de Napoleón."
 FRA_grande_arme_air_inf: "El cielo limpia el camino"
 FRA_grande_arme_air_inf_desc: "Después de meses de reformas, nuestro ejército está totalmente preparado para reclamar los territorios perdidos del Imperio. Lo hemos reconstruido alrededor de un anticipo de infantería medido realizado completamente bajo nuestra propia cubierta aérea, con aviones de ataque y reconocimiento rompiendo cada posición antes de que un tirador se comprometa a ello. El soldado del pie todavía toma el suelo, pero ya no camina a ciegas."
 FRA_grande_arme_air_cav: "Trueno antes de la carga"
 FRA_grande_arme_air_cav_desc: "Después de meses de reformas, nuestro ejército está totalmente preparado para reclamar los territorios perdidos del Imperio. Lo hemos reconstruido alrededor de columnas blindadas que se mueven sólo donde la fuerza aérea ya ha pasado, negociando el tren de artillería para alas de huelga que mantienen el ritmo con el avance. Nada ralentiza la carga, y nada sobrevive por delante."
 FRA_surrounded: "Bloqueo continental"
 FRA_surrounded_desc: "Nuestro ascenso al poder no ha pasado desapercibido, y está claro que los otros poderes europeos ya están conspirando contra nosotros. En particular, Gran Bretaña, que ha sido nuestro enemigo jurado en el pasado. Debemos derribar a todos y cada uno de estos poderes europeos; nuestra supervivencia y la revolución dependen de ella."
 FRA_Sachons_vaincre: "Le Deluge"
 FRA_Sachons_vaincre_desc: "Habiendo pasado meses preparando a nuestro pueblo para un conflicto de alta intensidad, ahora están listos para esta guerra tan esperada. Su entusiasmo y fe pueden mover montañas, pero debemos actuar rápidamente antes de que se marche. Debemos aplastar a nuestros oponentes lo más rápido posible."
 FRA_prepare_to_fight: "Preparando nuestro retorno"
 FRA_prepare_to_fight_desc: "Hemos optado por un enfoque cauteloso; sabiendo que nuestro pueblo está completamente detrás de nuestras ambiciones expansionistas, todo lo que queda es proporcionarles los medios para realizar esas ambiciones. Debemos asegurarnos de que, cuando llegue el momento, estemos listos."
 FRA_defense_napoleon: "Estado de emergencia"
 FRA_defense_napoleon_desc: "Tras los ataques terroristas perpetrados en nuestras fronteras por los bonapartistas, nuestro país está muy alerta. Pase lo que pase, estaremos listos."
 FRA_thousands_planes: "Air Arms Race"
 FRA_thousands_planes_desc: "Hemos elegido luchar contra los Estados Unidos, que durante demasiado tiempo ha tratado de dominarnos y el resto de Europa. Para proteger a Europa, debemos destruirlos y destruirlos debemos ser capaces de competir en el aire, ya que no tenemos los medios para derrotarlos en el mar."
 FRA_trade_USA: "Comercio transatlántico"
 FRA_trade_USA_desc: "Los Estados Unidos y el Imperio Francés se han unido a fuerzas para comerciar en todo el Atlántico. Estos acuerdos les traerán paz y prosperidad a cambio de garantías de paz."
 FRA_king_camelot_lar: "Las Camelots del Rey"
 FRA_king_camelot_lar_desc: "Nuestra policía secreta, encargada de suprimir todas las tendencias revolucionarias y otros movimientos anti-royalistas."
 FRA_king_camelot_non_lar: "Las Camelots del Rey"
 FRA_king_camelot_non_lar_desc: "Nuestra policía secreta, encargada de suprimir todas las tendencias revolucionarias y otros movimientos anti-royalistas."
 FRA_king_constitution: "La Constitución monarquista"
 FRA_king_constitution_desc: "Todas estas repúblicas que nuestro país ha pasado han construido instituciones sobre bases agitadas. Debemos reescribir esta basura, porque cada estado, incluso bajo nuestra regla absoluta necesita leyes."
 FRA_chivalry: "Chivalry moderno"
 FRA_chivalry_desc: "La monarquía francesa siempre se ha basado en una poderosa fuerza de caballería. Hemos optado por continuar en esta vena priorizando la caballería mecanizada sobre la infantería."
 FRA_elite_army: "Un ejército de élites"
 FRA_elite_army_desc: "Las Guerras Revolucionarias provocaron la conscripción. Sin embargo, los numerosos conflictos que hemos experimentado han demostrado ser extremadamente costosos en términos de vidas humanas. Los súbditos del Rey no siempre están bien entrenados para la guerra. Por lo tanto, hemos optado por centrarse en una fuerza más pequeña pero mucho mejor capacitada."
 FRA_prepare_crusade: "La Décima Cruzada"
 FRA_prepare_crusade_desc: "Nuestras fuerzas están listas para conquistar la Tierra Santa."
 FRA_political_preassure: "Fortalecimiento de nuestra diplomacia"
 FRA_political_preassure_desc: "No hemos logrado ganar diplomáticamente sobre el Líbano, así que necesitamos mejorar la forma en que nos involucramos con las potencias extranjeras."
 FRA_navy_crusade: "La Cruzada Marítima"
 FRA_navy_crusade_desc: "Hemos decidido retomar la Tierra Santa junto al mar. Esto requiere capacidades ofensivas anfibias eficaces."
 FRA_commie_europe_integration: "European Assimilation"
 FRA_commie_europe_integration_desc: "Hemos traído la revolución y el comunismo al resto de Europa. Ahora es el momento de forjar una unión del proletariado de cada país en una federación europea que sea capaz de asegurar la revolución perdura."
 FRA_counter_insurgency: "Efectivos de la policía militar"
 FRA_counter_insurgency_desc: "Los guerrilleros españoles plantearon un problema para Napoleón I, pero ese no será el caso para nosotros."
 FRA_attack_benelux: "Plan de batalla: Benelux"
 FRA_attack_benelux_desc: "Debemos concentrarnos en aniquilar las fuerzas del Benelux. Nuestro Emperador nos ha dado los medios para derrotarlos rápidamente."
 FRA_attack_iberia: "Plan de batalla: Iberia"
 FRA_attack_iberia_desc: "Debemos concentrarnos en aniquilar las fuerzas ibéricas. Nuestro Emperador nos ha dado los medios para derrotarlos rápidamente."
 FRA_attack_germany: "Plan de batalla: Alemania"
 FRA_attack_germany_desc: "Debemos concentrarnos en aniquilar a las fuerzas alemanas. Nuestro Emperador nos ha dado los medios para derrotarlos rápidamente."
 FRA_attack_holy_roman: "Plan de batalla: Europa del Sur"
 FRA_attack_holy_roman_desc: "Debemos centrarnos en aniquilar el resto de las fuerzas del sur de Europa. Nuestro Emperador nos ha dado los medios para derrotarlos rápidamente."
 FRA_BON_support_allies: "Preparando para una guerra larga"
 FRA_BON_support_allies_desc: "Nuestro socio francés ha sugerido que nos preparemos para un conflicto de alta intensidad con Rusia."
 FRA_attack_east: "Plan de batalla: Europa Oriental"
 FRA_attack_east_desc: "Debemos centrarnos en la aniquilación de las fuerzas europeas orientales. Nuestro Emperador nos ha dado los medios para derrotarlos rápidamente. Este es el paso final antes de nuestra campaña final."
 FRA_attack_russia_fast: "La Fleur au Fusil"
 FRA_attack_russia_fast_desc: "¡Estaremos en Moscú dentro de dos semanas!"
 FRA_attack_russia_slow: "Advance cauteloso"
 FRA_attack_russia_slow_desc: "Esta vez no habrá una Berezina."
 FRA_attack_UK_naval: "Cruza el Canal"
 FRA_attack_UK_naval_desc: "La Armada Real ya no es una amenaza para nosotros; la victoria está a nuestro alcance."
 FRA_attack_UK_air: "Salta sobre el Canal"
 FRA_attack_UK_air_desc: "Debemos mantener el control del espacio aéreo y tomar a nuestro oponente por sorpresa."
 FRA_BON_victory: "Protectorado Imperial"
 FRA_BON_victory_desc: "Hemos sido conquistados por el Imperio Napoleónico."
 FRA_expansion_europe: "Heredero de Carlomagno"
 FRA_expansion_europe_desc: "Nuestro destino es recuperar el Imperio Carolingiano."
 FRA_expansion_europe_crusades: "Carolingian Crusade"
 FRA_expansion_europe_crusades_desc: "Los francos han recuperado sus tierras; ahora debemos establecernos para Tierra Santa."
 FRA_expansion_crusades: "Heredero de Saint Louis"
 FRA_expansion_crusades_desc: "El deber de nuestro Reino es servir a Dios y reclamar la Tierra Santa."
 FRA_EMPIRE_occident: "El Imperio Occidental"
 FRA_EMPIRE_occident_desc: "Hemos reconquistado el Imperio Carolingiano y hemos sido coronados Emperador de Occidente."
 FRA_crusade_done_jerusalem: "La cruzada victorioso"
 FRA_crusade_done_jerusalem_desc: "La Décima Cruzada ha logrado su objetivo recapturando Jerusalén y Tierra Santa."
 FRA_expansion_crusades_plus: "La última cruzada"
 FRA_expansion_crusades_plus_desc: "Habiendo reclamado nuestros lugares santos, hemos decidido enmendar los errores del pasado. Todos los cismas deben terminar."
 FRA_protestant_anger: "Resistencia protestante"
 FRA_protestant_anger_desc: "Nuestra retórica agresiva hacia los protestantes ha provocado su ira en nuestro país."
 FRA_harsh_subjugation: "Subyugación de Harsh"
 FRA_harsh_subjugation_desc: "Nuestro suzerain, el Rey de Francia, ha decidido controlar nuestra economía y nuestras políticas. La derrota viene a un precio pesado."
 FRA_victory_crusade_2_conversion: "El Quinto Caballo del Apocalipsis"
 FRA_victory_crusade_2_conversion_desc: "La ira divina ha sido desatada sobre nuestros enemigos."
 FRA_enlightment: "Protectorado de la Iglesia"
 FRA_enlightment_desc: "Nuestro suzerain, el Rey de Francia, ha decidido ayudarnos a reconstruir nuestro país y apoyarnos en la reconstrucción física y cultural de nuestra sociedad."
 FRA_victory_crusade_2_freedom_light: "La Hija Mayor de la Iglesia"
 FRA_victory_crusade_2_freedom_light_desc: "Debemos tratar a las ovejas perdidas con la mayor amabilidad."
 FRA_attack_colonies: "Reclamando las Colonias del Imperio"
 FRA_attack_colonies_desc: "El sistema continental debe encontrar los recursos necesarios para garantizar su existencia continua."
 france_md.404.t: "El Acuerdo con los Verdes"
 france_md.404.d: "La negociación está terminada y el texto está sobre la mesa. Veinticuatro reactores cerraron, Fessenheim primero, y nuclear reducido a la mitad de la mezcla de electricidad en el decenio. A cambio de los Verdes quedan a un lado en sesenta circunscripciones y la mayoría sostiene. Las federaciones energéticas ya han votado en su contra, y Montebourg ha dicho en público lo que la mitad del grupo parlamentario está diciendo en privado. ¿Lo firmamos?"
 france_md.404.a: "Firma. La alianza vale más que los reactores"
 france_md.404.b: "La flota no es un chip de negociación"
 france_md.405.t: "La Manif pour Tous"
 france_md.405.d: "Nuestro reciente proyecto de ley no parece haberse reunido con apoyo unánime entre nuestros conciudadanos. Llenaron el Campo de Marte y se proponen volver a hacerlo cada mes hasta que muera la factura. Los organizadores son cuidadosos, los carteles son rosados y azules, y detrás de ellos se encuentra cada asociación conservadora en el país más una buena parte del grupo parlamentario de la derecha. El texto redactado abarca el matrimonio, la adopción y la filiación. Podemos mantener la línea en los tres, o podemos despojar lo que atrae a las mayores multitudes y pasar el resto tranquilamente."
 france_md.405.a: "La ley pasa por completo. Déjenlos marchar"
 france_md.405.b: "Trime el texto y toma lo que podemos conseguir"
 france_md.406.t: "Las rotondales están ocupadas"
 france_md.406.d: "Ocho fines de semana. Las prefecturas reportan mil glorietas sostenidas, el Arco del Triunfo ha sido vandalizado, y las rondas de balonmano han tomado los ojos delante de las cámaras. No hay liderazgo con el que negociar porque se niegan a nombrar uno. El interior quiere la ley antidisturbios y una mano libre. Los otros quieren un debate nacional, ayuntamientos en cada comuna y un paquete de concesiones lo suficientemente grande como para terminar esto antes de las elecciones europeas."
 france_md.406.a: "Pasa la ley anti-triter y despeja las rotondas"
 france_md.406.b: "Abra el Gran Débat y pague por la paz"
 FRA_change_politics_nationalist: "Cambios §Y$FRA_political_balance$§!: $FRA_balance_domestic_nationalist_drift$ por [?temp_change|%+]\n"
 FRA_truly_absolutism_TT: "§gVamos§! §R §! §g a todo otro partido, y declaramos el reino a §! §Y Verdaderamente Monarquía Absoluta§!"
 FRA_social_welf_need_tooltip_modifier_effect_TT: "Cambios §Y$FRA_social_balance$§!: $FRA_SOC_welf_ned$ por [?temp_change|%-]\n"
 FRA_4th_empire: "Tercer Imperio Francés"
 threat_FRA_napo_empire: "Napoleón ha vuelto."
 FRA_liberal_arms_contracts: "Política de exportación de armas liberales"
 FRA_liberal_arms_contracts_desc: "Dassault, Naval Group, Thales y MBDA lideran una de las industrias de defensa más avanzadas del mundo. Una política liberal de exportación nos permite llevar a cabo contratos lucrativos con naciones que buscan modernizar, llenando los libros de pedidos de nuestras fábricas mientras extiendemos la influencia francesa mediante asociaciones militares."
 FRA_liberal_arms_contracts_tt: "Durante los próximos meses, proponemos contratos de armas a §Y Arabia Saudita§!, §Y Emiratos Árabes Unidos§!, §Y Serbia§!, §YGrecia§!, §YEgipto§! y §YIndia§!."
 FRA_arms_contract_opinion: "Asociación contra el Contrato"
 france_md.323.t: "Courting Riyadh"
 france_md.323.d: "Riyadh está comprando para que un luchador vuele junto a sus Eurofighters, y los ingenieros del Grupo Naval todavía prestan servicio a las fragatas de clase Al Riad construidas bajo el programa Sawari. Nuestro ministerio de defensa ha elaborado una propuesta para [SAU.GetNameWithFlag]. ¿Qué debemos ofrecer?"
 france_md.323.a: "Paquete de armas ligeras ($5 mil millones)"
 france_md.323.b: "Paquete de armas pesadas ($15 mil millones)"
 france_md.323.c: "Paquete de Rafale Premium ($30 mil millones)"
 france_md.323.e: "No perseguiremos este contrato."
 france_md.324.t: "Riyadh pesa una oferta francesa"
 france_md.324.d: "[FRA.GetNameWithFlag] ofrece al Rafale como alternativa a nuestros escuadrones Eurofighter, junto con una extensión del programa de fragatas Sawari que el Grupo Naval ha prestado servicio durante décadas."
 france_md.324.a: "Aceptar el contrato"
 france_md.324.b: "Decline la oferta"
 france_md.325.t: "Courting Abu Dhabi"
 france_md.325.d: "La fuerza aérea Emirati sigue vuela el Mirage 2000-9, la variante Dassault construida específicamente para Abu Dhabi en los años noventa. Con esa flota envejecida, nuestro ministerio de defensa ve una apertura para lanzar su sucesor, el Rafale, a [UAE.GetNameWithFlag]. ¿Qué debemos ofrecer?"
 france_md.325.a: "Paquete de armas ligeras ($5 mil millones)"
 france_md.325.b: "Paquete de armas pesadas ($15 mil millones)"
 france_md.325.c: "Paquete de Rafale Premium ($30 mil millones)"
 france_md.325.e: "No perseguiremos este contrato."
 france_md.326.t: "Abu Dhabi pesa una oferta francesa"
 france_md.326.d: "[FRA.GetNameWithFlag] propone al Rafale como sucesor de nuestra flota Mirage 2000-9, la variante a medida que Dassault construyó para nosotros hace tres décadas."
 france_md.326.a: "Aceptar el contrato"
 france_md.326.b: "Decline la oferta"
 france_md.327.t: "Courting Belgrade"
 france_md.327.d: "[SER.GetNameWithFlag] todavía vuela la era soviética MiG-29s y compra su defensa aérea de corto alcance de Moscú. Podemos ofrecer al Rafale como su reemplazo, respaldado por los misiles portátiles Mistral de MBDA para sus unidades de defensa antiaérea. ¿Qué proponemos?"
 france_md.327.a: "Paquete de armas ligeras ($3 mil millones)"
 france_md.327.b: "Paquete de armas pesadas ($8 mil millones)"
 france_md.327.c: "Paquete de Rafale Premium ($15 mil millones)"
 france_md.327.e: "No perseguiremos este contrato."
 france_md.328.t: "Belgrado Pesa una oferta francesa"
 france_md.328.d: "[FRA.GetNameWithFlag] ofrece al Rafale como alternativa occidental a nuestra flota MiG-29 envejecida, junto con los misiles Mistral de MBDA para nuestras unidades de defensa aérea. Aceptar marcaría nuestro primer acuerdo de armas importantes fuera de la órbita rusa."
 france_md.328.a: "Aceptar el contrato"
 france_md.328.b: "Decline la oferta"
 france_md.329.t: "Courting Athens"
 france_md.329.d: "[GRE.GetNameWithFlag] ya vuela nuestro Rafales y quiere extender la relación a la marina. Naval Group ha lanzado un paquete de fragatas FREMM para que coincida con la orden de la fuerza aérea. ¿Qué debemos proponer a nuestros aliados helénicos?"
 france_md.329.a: "Paquete de armas ligeras ($4 mil millones)"
 france_md.329.b: "Paquete de armas pesadas ($12 mil millones)"
 france_md.329.c: "Paquete de Rafale Premium ($20 mil millones)"
 france_md.329.e: "No perseguiremos este contrato."
 france_md.330.t: "Atenas pesa una oferta francesa"
 france_md.330.d: "[FRA.GetNameWithFlag] propone un paquete construido alrededor de fragatas FREMM, extendiendo una relación de defensa ya anclada por nuestra orden anterior de Rafale."
 france_md.330.a: "Aceptar el contrato"
 france_md.330.b: "Decline la oferta"
 france_md.331.t: "Courting Cairo"
 france_md.331.d: "[EGY.GetNameWithFlag] ya vuela nuestro Rafales, opera los dos portadores de clase Mistral construidos para Rusia y redireccionado a El Cairo, y comisionó la fragata FREMM Tahya Misr del libro de pedidos de nuestra propia marina. ¿Qué debemos proponer para profundizar la asociación?"
 france_md.331.a: "Paquete de armas ligeras ($4 mil millones)"
 france_md.331.b: "Paquete de armas pesadas ($12 mil millones)"
 france_md.331.c: "Paquete de Rafale Premium ($25 mil millones)"
 france_md.331.e: "No perseguiremos este contrato."
 france_md.332.t: "El Cairo pesa una oferta francesa"
 france_md.332.d: "[FRA.GetNameWithFlag] ofrece ampliar una asociación que ya abarca nuestros escuadrones de Rafale, los portadores de clase Mistral y la fragata FREMM Tahya Misr."
 france_md.332.a: "Aceptar el contrato"
 france_md.332.b: "Decline la oferta"
 france_md.333.t: "Corte de Nueva Delhi"
 france_md.333.d: "[IND.GetNameWithFlag] opera uno de los mayores mercados de defensa del mundo. Nueva Delhi ya vuela treinta y seis Rafales y construye submarinos de clase Escorpene bajo licencia en Mazagon Dock. ¿Qué deberíamos proponer para ampliar la asociación?"
 france_md.333.a: "Paquete de armas ligeras ($6 mil millones)"
 france_md.333.b: "Paquete de armas pesadas ($20 mil millones)"
 france_md.333.c: "Paquete de Rafale Premium ($40 mil millones)"
 france_md.333.e: "No perseguiremos este contrato."
 france_md.334.t: "Nueva Delhi pesa una oferta francesa"
 france_md.334.d: "[FRA.GetNameWithFlag] propone construir sobre los Rafales ya en el servicio de la Fuerza Aérea India y los submarinos de clase Escorpene construidos bajo licencia en Mazagon Dock."
 france_md.334.a: "Aceptar el contrato"
 france_md.334.b: "Decline la oferta"
 FRA_joint_weapon_projects_category: "Proyectos conjuntos de desarrollo de armas"
 FRA_joint_weapon_projects_category_desc: "Francia tiene una larga historia de programas de defensa conjuntos, del avión de ataque Jaguar con Gran Bretaña al helicóptero Tigre con Alemania. Los nuevos proyectos conjuntos nos permiten repartir los costos de desarrollo y desplegar equipo que ninguno de los socios podría costear solo."
 FRA_joint_project_germany: "Proponer el Proyecto Conjunto SCAF/MGCS"
 FRA_joint_project_germany_desc: "El SCAF (Système de Combat Aérien du Futur) empareja a Dassault con Airbus para diseñar un caza de sexta generación que suceda al Rafale y al Eurofighter. El MGCS (Main Ground Combat System) encarga a KNDS un nuevo tanque de batalla principal para reemplazar al Leclerc y al Leopard 2. Juntos serían los mayores programas de defensa que cualquiera de las dos naciones haya llevado a cabo desde la Guerra Fría."
 FRA_socialist_government_required_tt: "Requiere un §YSocialista§! or §YIzquierda§! gobierno en el poder"
 FRA_joint_project_russia: "Proponer el Proyecto franco-ruso ATOM"
 FRA_joint_project_russia_desc: "Proponemos que el vehículo de combate de infantería ATOM sea un programa conjunto con Moscú, emparejando a los equipos de diseño de Nexter con ingenieros rusos de vehículos blindados. Romper con nuestros aliados occidentales esto requiere profundamente salir de la UE primero."
 FRA_nationalist_government_required_tt: "Requiere un §YNacionalista§! or §YNational Rally§! gobierno en el poder"
 FRA_joint_project_opinion: "Socio conjunto de desarrollo de armas"
 france_md.335.t: "Propuesta de proyecto franco-alemán SCAF/MGCS"
 france_md.335.d: "[FRA.GetNameWithFlag] propone lanzar SCAF (Système de Combat Aérien du Futur) y MGCS (Main Ground Combat System) como programas conjuntos: un luchador de sexta generación para tener éxito en el Rafale y Eurofighter, y un tanque de batalla principal para reemplazar al Leclerc y Leopard 2. Dassault, Airbus y KNDS dividirían el trabajo de ingeniería entre París y Berlín."
 france_md.335.a: "Construyamos juntos el futuro de la defensa europea"
 france_md.335.b: "Preferimos desarrollar nuestros sistemas de forma independiente"
 france_md.336.t: "Alemania acepta el proyecto SCAF/MGCS"
 france_md.336.d: "[GER.GetNameWithFlag] ha aceptado nuestra propuesta para SCAF y MGCS. Los ingenieros de Dassault y Airbus trabajarán junto a sus homólogos alemanes en el programa de luchadores, mientras que KNDS lidera el tanque."
 france_md.336.a: "¡Excelente! ¡Viva la cooperación franco-alemana!"
 france_md.337.t: "Propuesta del Proyecto de ATOM Franco-Ruso"
 france_md.337.d: "[FRA.GetNameWithFlag] propone el vehículo de combate de infantería ATOM como un programa conjunto franco-ruso, emparejando a los ingenieros de Nexter con diseñadores rusos de vehículos blindados. Después de haberse distanciado ya de sus aliados occidentales tradicionales, París está buscando ahora al este para los socios de defensa."
 france_md.337.a: "Comienza una nueva era de cooperación franco-rusa"
 france_md.337.b: "Esta propuesta es demasiado polémica"
 france_md.338.t: "Rusia acepta el proyecto ATOM"
 france_md.338.d: "[RUS.GetNameWithFlag] ha aceptado nuestra propuesta para el programa ATOM. Los ingenieros de Nexter trabajarán junto a sus homólogos rusos en un nuevo vehículo de combate de infantería, nuestra primera gran asociación de defensa con Moscú desde la Guerra Fría."
 france_md.338.a: "¡Un nuevo capítulo en las relaciones franco-rusas!"
 FRA_FCAS_MGCS_project: "Programa de desarrollo SCAF/MGCS"
 FRA_FCAS_MGCS_project_desc: "Francia y Alemania están desarrollando conjuntamente SCAF (Système de Combat Aérien du Futur), un luchador de sexta generación liderado por Dassault y Airbus, y MGCS (Main Ground Combat System), un nuevo tanque de combate principal dirigido por KNDS. Juntos son los programas de defensa más grandes que se han ejecutado desde la Guerra Fría."
 GER_FCAS_MGCS_project: "Programa de desarrollo SCAF/MGCS"
 GER_FCAS_MGCS_project_desc: "Alemania y Francia están desarrollando conjuntamente SCAF (Système de Combat Aérien du Futur), un luchador de sexta generación liderado por Airbus y Dassault, y MGCS (Main Ground Combat System), un nuevo tanque de combate principal dirigido por KNDS. Juntos son los programas de defensa más grandes que se han ejecutado desde la Guerra Fría."
 FRA_RUS_joint_project: "Programa Franco-Ruso de ATOM"
 FRA_RUS_joint_project_desc: "Francia y Rusia han puesto en marcha un programa conjunto de desarrollo militar, el proyecto de vehículos de combate de infantería ATOM. Los ingenieros de Nexter se unen a los diseñadores rusos de vehículos blindados para producir una nueva plataforma IFV."
 RUS_FRA_joint_project: "Programa Franco-Ruso de ATOM"
 RUS_FRA_joint_project_desc: "Rusia y Francia han puesto en marcha un programa conjunto de desarrollo militar, el proyecto de vehículos de combate de infantería ATOM. Los diseñadores de vehículos blindados rusos se unen con los ingenieros de Nexter para producir una nueva plataforma IFV."
 FRA_constitutional_crisis_pcf: "La tentación revolucionaria"
 FRA_constitutional_crisis_pcf_desc: "Dentro de nuestra coalición izquierdista, una facción radical ha ido ganando influencia. Estos corredores revolucionarios creen que el socialismo democrático se mueve demasiado lentamente y exige una transformación inmediata y total. El liderazgo moderado de La France Insoumise y el PCF lucha por contener extremistas que ven la huelga general como el primer paso hacia la revolución."
 FRA_abolish_fifth_republic_pcf: "Los extremistas se apoderan del control"
 FRA_abolish_fifth_republic_pcf_desc: "La facción radical dentro de la izquierda ha superado a la dirección moderada. Mélenchon y los reformistas del PCF han sido rezagados por corredores revolucionarios que rechazan completamente la «democracia burguesa» de la Quinta República. Exigen a una Asamblea Constituyente que redacte una nueva constitución, respaldada por suficiente poder de la calle para hacer cumplir su voluntad."
 FRA_sixth_republic: "Proclamar la Sexta República"
 FRA_sixth_republic_desc: "La facción moderada ha recuperado cierta influencia, dirigiendo la revolución hacia una Sexta República socialista democrática en lugar del comunismo absoluto. Este compromiso preserva las instituciones republicanas, transformando fundamentalmente la sociedad francesa por medios parlamentarios."
 FRA_french_commune_peaceful: "Establecer la Comuna Francesa"
 FRA_french_commune_peaceful_desc: "Los corredores revolucionarios han triunfado completamente. En el espíritu de la Comuna de París de 1871, Francia se convertirá en un verdadero estado obrero. Los medios de producción serán colectivizados, los consejos obreros gobernarán a todos los niveles y los reformistas moderados han perdido el control por completo."
 FRA_republic_safe_pcf: "Nuestra posesión más preciosa"
 FRA_republic_safe_pcf_desc: "Hemos arrestado a los líderes de las facciones radicales y disuelto sus células paramilitares. La República sobrevive. Mélenchon y los reformistas moderados mantienen el control de la izquierda. El sueño revolucionario ha terminado, sustituido por el camino más lento y estable de la reforma democrática."
 FRA_question_republic_fn: "República Cuestionable"
 FRA_question_republic_fn_desc: "Dentro del Rally Nacional, una facción tradicionalista ha ido creciendo en influencia. Mientras [FRA.GetLeader] y el liderazgo principal siguen comprometidos con la República, estos extremistas, inspirados en Action Française y el movimiento tradicionalista católico, cuestionan abiertamente si la democracia misma ha fracasado en Francia. Debemos actuar antes de que sea demasiado tarde."
 FRA_referendum_republic: "Los Hardliners obligan a un referéndum"
 FRA_referendum_republic_desc: "La facción tradicionalista ha superado a los republicanos moderados de Le Pen. Los militantes de la acción francesa, los intégristes católicos y los monarquistas nostálgicos han tomado el control del aparato del partido. Exigen un referéndum sobre la existencia misma de la República, y el liderazgo general ya no puede detenerlos."
 FRA_restore_kingdom_fn: "Restaurar el Reino"
 FRA_restore_kingdom_fn_desc: "La facción monarquista dentro del movimiento ha ganado. Ya sea que coronamos al pretendiente orleanista Jean d'Orléans como 'Rey de los franceses' o el demandante legitimista Louis de Bourbon como 'Rey de Francia', los moderados republicanos de la coalición del gobierno han sido completamente alineados por los extremistas tradicionalistas."
 FRA_restore_empire_fn: "Restaurar el Imperio"
 FRA_restore_empire_fn_desc: "La facción bonapartista ha triunfado. Jean-Christophe Napoléon Bonaparte será coronado Napoleón VII. Los republicanos moderados que una vez dirigieron el gobierno han sido barridos por aquellos que sueñan con la gloria imperial: una fuerte Francia unida bajo un emperador, no asfixiando parlamentarios."
 FRA_republic_safe_fn: "Salvando a la República"
 FRA_republic_safe_fn_desc: "Hemos arrestado a los líderes de las facciones tradicionalistas y disuelto sus células paramilitares. ¡La República sobrevive! Nuestro gobierno y los nacionalistas moderados mantienen el control. Utilizando la crisis como justificación, pasamos reformas para reforzar el poder del Estado: servicios de seguridad ampliados, controles más estrictos a las organizaciones extremistas y potenciación de la autoridad ejecutiva. La Quinta República es más fuerte que nunca."
 france_md.370.t: "Mantener nuestras manos limpias"
 france_md.370.d: "Nuestro ascenso al poder ya parece haber captado la atención de los movimientos políticos. Esta mañana fuimos contactados por células comunistas revolucionarias. Nos han ofrecido ayudar a consolidar nuestro poder, en particular reuniendo información sobre nuestros oponentes políticos y rastreando grupos de escindidos de extrema derecha para evitar que nos hagan daño. No deberíamos involucrarnos con esos grupos, ya que ahora estamos comprometidos con la reforma y la República. Pero todavía sería útil tener esta herramienta."
 france_md.370.a: "Permitirles organizar: necesitamos su apoyo"
 france_md.370.b: "Rechazarlos: somos demócratas, no revolucionarios"
 france_md.371.t: "Voces de las sombras"
 france_md.371.d: "Nuestro éxito en las elecciones y nuestra eficacia en la ejecución de un programa nacionalista no han pasado desapercibidos. Hemos recibido propuestas de varios grupos tradicionales de escindidos: Action Française simpatizantes, intégristes católicos y aquellos que sueñan con restaurar la monarquía. Estaban impresionados por nuestra actuación y nos están ofreciendo sus redes paramilitares y conexiones políticas a cambio de que se les permita organizarse abiertamente. Sus verdaderas intenciones siguen veladas."
 france_md.371.a: "Permitirles organizar: su apoyo nos fortalece"
 france_md.371.b: "Rechazarlos: estamos de acuerdo con la república"
 france_md.372.t: "La República está en pie"
 france_md.372.d: "La facción radical se ha roto. Sus líderes son arrestados, sus células disueltas, sus sueños de revolución aplastados. Los reformistas moderados siguen en control, y Francia sigue siendo una república, transformada tal vez pero todavía reconociblemente democrática. Los extremistas jugaron y perdieron."
 france_md.372.a: "El reformismo siempre gana"
 france_md.373.t: "¡Viva la República!"
 france_md.373.d: "¡El golpe tradicionalista ha sido frustrado! El DGSI se movió rápidamente: los líderes de Action Française están bajo custodia, las células monarquistas han sido asaltadas, y los sueños de restauración se encuentran en ruinas. El pueblo celebra en las calles mientras Le Pen se dirige a la nación: la Quinta República está fuerte. Utilizando esta crisis como justificación, pasamos reformas radicales para reforzar la autoridad estatal y asegurar que esas amenazas nunca vuelvan a surgir."
 france_md.373.a: "¡La República es salvada, más fuerte que nunca!"
 france_md.374.t: "Las facciones luchan por el poder"
 france_md.374.d: "El golpe ha tenido éxito. La República ha caído. Pero ahora las facciones tradicionalistas se vuelven el uno al otro. Los monarquistas exigen la restauración de la línea Bourbon o Orléans. Los bonapartistas sueñan con la gloria imperial bajo Napoleón VII. Sólo una facción puede ganar. ¿Qué visión prevalecerá?"
 france_md.374.a: "¡Los monarquistas prevalecen: restaurar el Reino!"
 france_md.374.b: "¡Los bonapartistas triunfan: restaurar el Imperio!"
 france_md.340.t: "El inminente levantamiento"
 france_md.340.d: "La facción radical ha crecido demasiado audaz. Sus células paramilitares han sido expuestas, revelaron su infiltración del aparato del partido. Incluso hay rumores de que han infiltrado el alto mando de nuestro ejército y se están preparando para un golpe de Estado. Debemos elegir: descifrarlos ahora y preservar la República, o dejarles continuar su trabajo y ver dónde conduce. El DGSI espera nuestras órdenes."
 france_md.340.a: "Averiguar: arrestar a los líderes radicales"
 france_md.340.b: "Que sean: la revolución debe continuar"
 france_md.341.t: "Los radicales aprovechen el poder"
 france_md.341.d: "Sucedió en una sola noche. La facción radical se movió con precisión: sus células paramilitares incautaron edificios clave, sus infiltrados en los militares aseguraron bases cruciales. [FRA.GetLeader] y los reformistas moderados se despiertan para encontrar prisioneros en todo menos nombre. Los corredores revolucionarios han ejecutado su golpe de Estado. La Quinta República está muerta."
 france_md.341.a: "La revolución ha comenzado"
 france_md.345.t: "La Comuna vuelve a crecer"
 france_md.345.d: "Los corredores revolucionarios han ganado completamente. Rechazando cualquier compromiso con la «democracia burguesa», han proclamado la Comuna Francesa, un verdadero estado obrero en la tradición de 1871. Los reformistas moderados que construyeron la coalición original han sido purgados o huidos. La bandera roja vuela sobre el palacio de Élysée, y la revolución acaba de comenzar."
 france_md.345.a: "¡Viva la Comuna! ¡La Internacional será la raza humana!"
 france_md.375.t: "Luchar o plegar"
 france_md.375.d: "La facción tradicionalista ha crecido demasiado confiado. Sus redes paramilitares han sido expuestas, revelaron su infiltración del aparato del partido. Incluso hay rumores de que han infiltrado el alto mando de nuestro ejército y se están preparando para un golpe de Estado. Debemos elegir: descifrarlos ahora y preservar la República, o dejarles continuar su trabajo y ver dónde conduce. El DGSI espera nuestras órdenes."
 france_md.375.a: "Avergonzarse: arrestar a los líderes tradicionales"
 france_md.375.b: "Que sean: la restauración debe continuar"
 france_md.376.t: "Los Tradicionales aprovechan el poder"
 france_md.376.d: "Sucedió en una sola noche. La facción tradicionalista se movió con precisión: sus células paramilitares aseguraron edificios clave, sus aliados en el ejército aseguraban la no injerencia. [FRA.GetLeader] y los republicanos moderados se despiertan para encontrarse completamente alineados. Los extremistas han ejecutado su golpe de Estado. La Quinta República está muerta. ¿Pero quién gobernará la nueva Francia?"
 france_md.376.a: "Las facciones deben decidir ahora"
 france_md.354.t: "Los monarquistas eligen a su rey"
 france_md.354.d: "La facción monarquista dentro del movimiento debe elegir ahora su soberano. Dos reclamantes se presentan: Jean d'Orléans, Conde de París, representa la línea orleanista, y sería un monarca constitucional, 'Rey de los franceses.' Louis de Bourbon, Duque de Anjou, representa la línea legitimista de Luis XIV, y sería «Rey de Francia» por derecho divino. Los tradicionalistas de Action Française deben decidir."
 france_md.354.a: "Corona Jean d'Orléans, rey de los franceses"
 france_md.354.b: "Corona Louis de Bourbon, rey de Francia"
 france_md.357.t: "El triunfo de los bonapartistas"
 france_md.357.d: "La facción bonapartista dentro del movimiento ha ganado la lucha interna. Jean-Christophe Napoléon Bonaparte será coronado Napoleón VII. Los militares y los que sueñan con la gloria imperial han prevalecido sobre los monarquistas. Marine Le Pen y la vieja guardia republicana del Rally Nacional han sido barridos completamente. Francia será un Imperio una vez más."
 france_md.357.a: "¡Viva el Emperador! ¡Larga vida a Francia!"
 france_md.358.t: "Los bonapartistas aprovechan el poder en Francia"
 france_md.358.d: "Notas de [FRA.GetNameWithFlag]: las facciones extremistas dentro del partido gobernante han tomado el control y abolido la Quinta República. La dirección moderada ha sido marginada a medida que los radicales restablecen el dominio imperial. Este dramático golpe contra la democracia ha impactado al mundo. ¿Cómo debemos responder?"
 france_md.358.a: "Condena esta toma de posesión extremista"
 france_md.358.b: "Este es un asunto francés interno."
 FRA_extremist_paramilitary_left: "Paramilitar revolucionario"
 FRA_extremist_paramilitary_left_desc: "Hemos permitido a la facción radical organizar abiertamente sus redes paramilitares. Estas células revolucionarias nos proporcionan poder callejero y control sobre el posible disentimiento. ¿Pero a qué costo? Sus verdaderas lealtades permanecen con la revolución, no con el liderazgo del partido."
 FRA_extremist_paramilitary_right: "Paramilitar Tradicional"
 FRA_extremist_paramilitary_right_desc: "Hemos permitido a la facción tradicionalista organizar abiertamente sus redes paramilitares. Estas células Action Française nos proporcionan energía y control de la calle sobre el posible disentimiento. ¿Pero a qué costo? Sus verdaderas lealtades permanecen con la restauración, no con el liderazgo del partido."
 FRA_radical_infiltration: "Infiltración radical"
 FRA_radical_infiltration_desc: "La facción radical está infiltrando silenciosamente el aparato del partido y los militares. Sus células revolucionarias se extienden a través de las instituciones, construyendo la red que necesitarán cuando llegue el momento. El liderazgo moderado sigue sin darse cuenta de lo profundo que es la infiltración."
 FRA_traditionalist_infiltration: "Infiltración tradicionalista"
 FRA_traditionalist_infiltration_desc: "La facción tradicionalista está infiltrando silenciosamente el aparato del partido y los militares. Sus células monarquistas se extienden a través de las instituciones, construyendo la red que necesitarán cuando llegue el momento. El liderazgo moderado sigue sin darse cuenta de lo profundo que es la infiltración."
 FRA_republic_stabilized_left: "República Estabilizada"
 FRA_republic_stabilized_left_desc: "La amenaza radical ha sido neutralizada. El DGSI ha arrestado a los líderes extremistas y desmantelado sus células paramilitares. Francia sigue siendo una república, y los reformistas moderados mantienen el control de la izquierda. La revolución no sucederá, pero nos aseguraremos de darle a la gente las herramientas para expresarse de otras maneras."
 FRA_republic_stabilized_right: "República firme"
 FRA_republic_stabilized_right_desc: "La amenaza tradicionalista ha sido aplastada, y usamos la crisis para aprobar reformas radicales que refuerzan el poder estatal. El DGSI ahora ha ampliado la autoridad de vigilancia, la policía tiene nuevos poderes contra organizaciones extremistas y se ha fortalecido la autoridad ejecutiva. La Quinta República soporta: más fuerte, centralizado y firmemente bajo control nacionalista."
 FRA_general_strike: "Lucha General Revolucionaria"
 FRA_general_strike_desc: "Una facción radical dentro de la coalición izquierdista ha movilizado a los trabajadores para una huelga general, yendo más allá de lo que pretendía el liderazgo moderado. El CGT ha sido capturado por los corredores revolucionarios que ven esto como el primer paso hacia la eliminación total de la República. El liderazgo del partido ha perdido el control del movimiento que comenzaron."
 FRA_sixth_republic_idea: "La Sexta República"
 FRA_sixth_republic_idea_desc: "Nadie quería más a la Quinta República, así que lo llevamos a un fin democrático y establecimos una nueva república que está más cerca del pueblo."
 FRA_commune_reborn_idea: "La Comuna Francesa"
 FRA_commune_reborn_idea_desc: "Los corredores revolucionarios han triunfado completamente. Los reformistas moderados que una vez lideraron la izquierda han sido purgados mientras Francia se transforma en un estado obrero. En el espíritu de 1871, los consejos obreros gobiernan ahora y se han colectivizado los medios de producción. La bandera roja vuela donde el tricolor voló una vez."
 FRA_kingdom_restored_idea: "El Reino Restaurado"
 FRA_kingdom_restored_idea_desc: "Los extremistas tradicionalistas dentro del movimiento nacionalista han logrado su sueño: Francia tiene una vez más un rey. Los republicanos moderados del Rally Nacional en incredulidad mientras Action Française celebra y el fleur-de-lis reemplaza al tricolor."
 FRA_exploitation: "Desangrados por la metrópoli"
 FRA_exploitation_desc: "Nuestras fábricas, nuestro comercio y nuestros impuestos se dirigen a París primero y a nuestra propia gente en segundo lugar. Cada envío que deja los muelles nos compra un poco más de resentimiento en casa y un poco más de distancia del Imperio."
 FRA_empire_restored_idea: "El Imperio Restablecido"
 FRA_empire_restored_idea_desc: "La facción bonapartista dentro del movimiento ha restaurado el Imperio Francés bajo Napoleón VII. Los republicanos moderados que construyeron el Rally Nacional han sido barridos por aquellos que sueñan con la gloria imperial. Francia es una vez más gobernada por un Emperador, y la alianza militar-tradicionalista celebra su completa victoria."
 FRA_investing_eu: "Invertir en un país de la UE"
 FRA_investing_eu_desc: "Actualmente estamos ayudando a otra nación de la UE para construir"
 FRA_election_result: "Los resultados"
 FRA_election_result_desc: "Las elecciones presidenciales han terminado o están a punto de terminar; es poco probable que las intenciones de votar cambien por un tiempo."
 FRA_spy_napoleon_lar: "Servicio secreto bonapartista"
 FRA_spy_napoleon_lar_desc: "Una nueva generación de agentes secretos entrenados para sembrar discordia entre nuestros enemigos, alimentando inteligencia en tiempo real a nuestro ejército, la marina y el personal aéreo mientras la reconquista avanza."
 FRA_spy_napoleon_non_lar: "Servicio secreto bonapartista"
 FRA_spy_napoleon_non_lar_desc: "Una nueva generación de agentes secretos entrenados para sembrar la discordia entre nuestros enemigos, viendo nuestros propios cuarteles y ministerios para el próximo complot contra el trono."
 FRA_5th_republic: "La Quinta República"
 FRA_5th_republic_desc: "El actual sistema político francés, establecido desde 1958. Una república establecida bajo el General de Gaulle y adaptada a sus necesidades. Un sistema estable, pero que está empezando a mostrar sus limitaciones en un país cada vez más fuera de equilibrio, con un presidente todopoderoso."
 FRA_war_against_republic: "Guerra contra el republicanoismo"
 FRA_war_against_republic_desc: "La monarquía francesa estaba en su más fuerte bajo el absolutismo. Desde entonces, nuestro país ha sufrido décadas de repúblicas, cada vez más inestables que las últimas. Los valores republicanos y democráticos son peligrosos para nuestro país y se están propagando como un cáncer en todo el mundo. Debemos poner fin a esto."
 FRA_EU_strong: "Fuerza con la UE"
 FRA_EU_strong_desc: "Ser un pilar de la Unión Europea es una gran responsabilidad, pero también una gran fuerza. Nuestro destino está vinculado al de la Unión Europea, nos guste o no."
 FRA_NOTRe_law: "No es ley"
 FRA_NOTRe_law_desc: "La descentralización no se ha implementado adecuadamente en Francia, dejando numerosas lagunas legales e inconsistencias a su paso. La Ley de la Nueva Organización de los Territorios de la República permitirá corregir estas deficiencias y simplificar la organización y planificación de nuestros territorios."
 FRA_military_indus_boost: "Invertir en nuestra industria de defensa"
 FRA_military_indus_boost_desc: "Habida cuenta de las crecientes tensiones internacionales, no debemos evitar gastos en la preparación de un posible conflicto."
 FRA_civilian_jobs_boost: "Enfoque sobre la creación de empleos"
 FRA_civilian_jobs_boost_desc: "Necesitamos invertir más en el mercado laboral para ofrecer a nuestros ciudadanos una amplia gama de oportunidades de empleo."
 FRA_internal_investment_boost: "Enfoque on Internal Investments"
 FRA_internal_investment_boost_desc: "Al proporcionar subvenciones al sector privado, podremos alentarlo a crear más puestos de trabajo."
 FRA_direct_construction_boost: "Invertir en Obras Públicas"
 FRA_direct_construction_boost_desc: "Como el mercado no está funcionando bien, debemos utilizar nuestra fuerza de trabajo para construir la economía del mañana."
 FRA_indusfarm_boost: "Subvencionamiento de la agricultura"
 FRA_indusfarm_boost_desc: "Debemos ayudar a nuestro sector agrícola a recuperar los mercados europeos aumentando nuestra producción, sea cual sea el medio."
 FRA_civilian_infra_boost: "Invertir en infraestructuras"
 FRA_civilian_infra_boost_desc: "Necesitamos invertir en áreas no metropolitanas para que las personas allí puedan acceder a los mismos servicios que en áreas metropolitanas."
 FRA_indusbuild_services_boost: "Invertir en la industria de los servicios"
 FRA_indusbuild_services_boost_desc: "Estamos construyendo la economía del mañana, libre de industrias no competitivas y contaminantes."
 FRA_techno_boost: "Inversiones en materia de educación"
 FRA_techno_boost_desc: "Lo que necesitamos es permitir a todos seguir los estudios más avanzados."
 FRA_res_health_boost: "Enfoque on Public Services"
 FRA_res_health_boost_desc: "Debemos reconstruir la prestación de servicios que desde hace demasiado tiempo ha sido el objetivo de políticas ultraliberales."
 FRA_local_consumption_boost: "Apoyo a la reubicación de nuestro suministro de alimentos"
 FRA_local_consumption_boost_desc: "Nuestras mesas se almacenan desde el otro lado del mundo mientras que las granjas francesas suben. Acortar la cadena entre el campo y la placa mantiene ese valor dentro del país."
 FRA_job_planned_boost: "Invertir en nuestra industria"
 FRA_job_planned_boost_desc: "Debemos ayudar a nuestros negocios a crear más empleos y evitar que hagan redundancias. Esto nos permitirá poner fin al desempleo mientras aumenta la seguridad laboral."
 FRA_ps_EUtrain: "Formación en francés Misión"
 FRA_ps_EUtrain_desc: "El gobierno francés nos ha invitado a participar en ejercicios militares conjuntos junto con otros países de la Unión Europea."
 FRA_PCF_EUtrain: "Preparación de la escalada oriental"
 FRA_PCF_EUtrain_desc: "Ante la posible agresión de Rusia, debemos prepararnos para enfrentarlo en el campo de batalla."
 FRA_EU_LEAVE: "Reconstruir nuestra economía"
 FRA_EU_LEAVE_desc: "Nuestra economía estaba demasiado íntimamente integrada con la Unión Europea; al alejarse de ella ha tenido consecuencias de largo alcance. La reconstruiremos para ser aún más fuertes y más independientes."
 FRA_patriotic_fervor: "Fervor Patriótico"
 FRA_patriotic_fervor_desc: "La reconquista de nuestro Imperio acaba de empezar."
 FRA_learning_from_worforce: "Integración de la sociedad"
 FRA_learning_from_worforce_desc: "Estamos en el proceso de integrar los conocimientos y la fuerza de trabajo de una nación hermana."
 FRA_attack_UK_king: "La Royale"
 FRA_attack_UK_king_desc: "Nuestra atención puede estar centrada en el Reino Unido como ex enemigo de Francia. Pero en cualquier caso, tendremos que luchar contra un poder marítimo en un momento u otro. Por lo tanto, la Armada Francesa debe estar dispuesta a luchar en el mar."
 FRA_french_papacy: "Papado bajo control"
 FRA_french_papacy_desc: "Hemos decidido acoger la sede de la Iglesia Católica en Francia. Por lo tanto, estamos en condiciones de protegerlo y disfrutar así de una mayor legitimidad a los ojos de otros países cristianos."
 FRA_gaullist_foreign_policy: "La política exterior gaullista"
 FRA_gaullist_foreign_policy_desc: "Siguiendo la visión del General de Gaulle, Francia persigue una política de independencia estratégica de ambas superpotencias. Mantenemos la distancia de la hegemonía americana mientras nos ocupamos pragmáticamente con Rusia y China. Francia debe ser un gran poder en su propio derecho, no un vasallo de Washington."
 FRA_anti_american_stance: "La postura antiamericana"
 FRA_anti_american_stance_desc: "El gobierno francés ha adoptado una actitud abiertamente hostil hacia Estados Unidos. Las operaciones militares estadounidenses no recibirán apoyo francés, y las relaciones diplomáticas se han enfriado significativamente. Francia traza su propio curso, libre de restricciones atlánticas."
 FRA_fn_russia_alignment_idea: "Alineación nacional del Rally-Rusia"
 FRA_fn_russia_alignment_idea_desc: "El gobierno del Rally Nacional ha cultivado estrechos lazos con Rusia, reflejando conexiones históricas y oposición compartida al liberalismo americano. Elogio de Marine Le Pen por los 'valores tradicionales' de Putin ha traducido en alineación política concreta sobre múltiples problemas."
 FRA_fn_protectionism: "Patriotismo Económico"
 FRA_fn_protectionism_desc: "Los aranceles y la contratación pública ahora favorecen al productor francés por encima de la importación más barata, y nuestras fábricas están funcionando más llenas que en años. Nuestros socios comerciales han notado, y no están agradecidos."
 FRA_fn_nationalist_policy: "Preferencias nacionales"
 FRA_fn_nationalist_policy_desc: "Una de nuestras medidas clave es la preferencia nacional: empujar todo lo que no sea francés en el fondo."
 FRA_communist_foreign_policy: "Política Exterior Comunista"
 FRA_communist_foreign_policy_desc: "El Partido Comunista ha implementado una reorientación radical de la política exterior francesa: la alianza con Estados Unidos es imposible, y Francia busca solidaridad con los estados socialistas en todo el mundo. La pertenencia a la OTAN es fundamentalmente incompatible con nuestra ideología."
 FRA_lfi_non_aligned_policy: "Non-Aligned France"
 FRA_lfi_non_aligned_policy_desc: "La France Insoumise ha implementado una política de no alineación, rechazando tanto la hegemonía americana como el autoritarismo ruso. Francia no participará en las aventuras militares estadounidenses y mantiene la independencia de las estructuras de mando de la OTAN mientras busca liderazgo de un nuevo movimiento no alineado."
 FRA_lfi_anti_nato: "Políticas anti-Nato"
 FRA_lfi_anti_nato_desc: "Hemos conseguido retirarnos de la OTAN; ya no podríamos tolerar las acciones del imperialismo estadounidense. Nuestra posición actual nos da un mayor control sobre nuestra política exterior."
 FRA_worker_internationalism: "Beacon of Internationalism"
 FRA_worker_internationalism_desc: "El comunismo ha sido un éxito en Francia, y eso es un hecho. Este éxito significa que tenemos una fuerza de trabajo satisfecha y nos permite atraer trabajadores de todo el mundo."
 FRA_lfi_social_europe: "Europeann Public Services Reform"
 FRA_lfi_social_europe_desc: "La Francia de LFI ha logrado presentar una nueva agenda social para la Unión Europea. Esta es una victoria importante contra esta institución profundamente neoliberal."
 FRA_strategic_independance: "La independencia estratégica"
 FRA_strategic_independance_desc: "Francia se ha comprometido a completar la autonomía estratégica, manteniendo su disuasión nuclear independiente y negando subordinación a cualquier poder extranjero. Las bases americanas no son bienvenidas en suelo francés, y Francia tomará sus propias decisiones sobre intervenciones militares."
 FRA_global_south_solidarity: "Solidaridad del Sur Global"
 FRA_global_south_solidarity_desc: "El colonialismo ha tenido innegablemente un impacto significativo en el desarrollo de los países del Sur Global. Haremos lo correcto ayudándoles a recuperarse de esto."
 FRA_sovereigntist_eu_policy: "Política Soberana de la UE"
 FRA_sovereigntist_eu_policy_desc: "Francia bloquea aún más la federalización de la UE, defendiendo la soberanía nacional contra la tecnocracia de Bruselas. Mientras permanecemos en la UE, vetamos cualquier transferencia de soberanía y nos oponemos a la creación de un superstate europeo. Francia no se convertirá en una provincia."
 FRA_distance_nato: "Distancia de la OTAN"
 FRA_distance_nato_desc: "Siguiendo el precedente de De Gaulle en 1966, Francia mantiene distancia con la estructura de mando integrada de la OTAN mientras sigue siendo miembro del tratado. Las tropas americanas no están estacionadas en suelo francés, y Francia se reserva el derecho a la acción militar independiente."
 FRA_left_nato: "La OTAN izquierda"
 FRA_left_nato_desc: "Francia se ha retirado totalmente de la Organización del Tratado del Atlántico Norte. Ya no está vinculado por el artículo 5, Francia traza un curso verdaderamente independiente en asuntos militares, rechazando la hegemonía estadounidense de manera directa."
 FRA_political_balance: "Tendencias de opinión pública"
 FRA_political_balance_desc: "Aunque nuestras instituciones estaban diseñadas para garantizar la estabilidad, el equilibrio político nunca ha sido tan precario. Las Partes suben y caen. Quienquiera que seas, tendrás que consolidar nuestra opinión pública."
 FRA_econ_policy: "Estado de la Economía Francesa"
 FRA_econ_policy_desc: "La economía francesa es un buen ejemplo de una economía occidental en los albores del nuevo milenio, pasando de una central industrial a una economía en el proceso de reestructuración. Veremos cómo sus reformas afectarán su dirección futura."
 FRA_social_balance: "Políticas sociales francesas"
 FRA_social_balance_desc: "Francia es un país que invierte fuertemente en su política social a todos los niveles. Sin embargo, la mayoría de las partes tienen problemas con esta política. Todo el mundo tiene sus propias opiniones sobre cómo debe cambiar. Veremos cómo sus decisiones lo afectan."
 FRA_6th_rep: "Reformas de la Sexta República"
 FRA_6th_rep_desc: "La France insoumise ha logrado reformar la Quinta República. Pero más allá de las instituciones, estas reformas tendrán consecuencias de gran alcance para la sociedad francesa y la economía francesa."
 FRA_Commies_agenda: "Políticas de la Comuna Francesa"
 FRA_Commies_agenda_desc: "La Comuna de Francia ha decidido hacer un descanso limpio con el pasado y está decidida a reconstruir la sociedad desde cero."
 FRA_Bonapartist_agenda: "La Sociedad Imperial"
 FRA_Bonapartist_agenda_desc: "Nuestro nuevo Emperador ha decidido reformar la sociedad francesa para que sea mayor y más fuerte frente a los conflictos que se avecinan."
 FRA_Royalist_agenda: "La nueva sociedad de Frank"
 FRA_Royalist_agenda_desc: "Debemos poner fin a todas las invenciones diabólicas de la revolución acertada. Reconstruiremos la sociedad franco sobre bases sólidas."
 FRA_World_revolution: "La Revolución Mundial"
 FRA_World_revolution_desc: "Mientras liberamos a los pueblos del capitalismo, estamos unidos por pueblos que traen consigo tanto su conocimiento como sus esperanzas. Pronto, la Internacional será toda la humanidad."
 FRA_arab_solidarity_tt: "Mejoramiento de las relaciones con las naciones árabes y musulmanas"
 FRA_blocks_eu_federalization_tt: "Francia bloquea la federalización de la UE debido a la política soberana"
 FRA_cannot_ally_usa_hard_tt: "No aliarse con EE.UU."
 FRA_cannot_host_american_bases_tt: "No puede albergar bases militares estadounidenses"
 FRA_cannot_join_american_coalitions_tt: "No se puede unir a las coaliciones militares dirigidas por Estados Unidos"
 FRA_debt_forgiveness_tt: "Apoya el perdón de la deuda y la cooperación para el desarrollo del Sur Mundial"
 FRA_demands_eu_social_reform_tt: "Exige la reforma social de las instituciones de la Unión Europea"
 FRA_immigration_restrictions_tt: "La inmigración a Francia está muy restringida"
 FRA_improved_russia_relations_tt: "Mejores relaciones con Rusia"
 FRA_israel_relations_penalty_tt: "Peoradas relaciones con Israel"
 FRA_left_nato_command_tt: "Francia ha dejado la estructura de mando integrada de la OTAN"
 FRA_non_aligned_policy_tt: "Francia aplica una política de no alineación"
 FRA_opposes_nato_expansion_tt: "Opone cualquier ampliación adicional de la OTAN"
 FRA_socialist_solidarity_tt: "Mejores relaciones con los Estados socialistas y comunistas"
 FRA_trade_protectionism_tt: "La industria nacional está protegida contra la competencia extranjera"
 FRA_usa_relations_penalty_tt: "Relaciones con los Estados Unidos"
 FRA_worker_solidarity_tt: "Atrae a los trabajadores de todo el mundo mediante la solidaridad internacional de los trabajadores"
 france_md.800.t: "Francia se vuelve contra Estados Unidos"
 france_md.800.d: "El nuevo gobierno francés ha adoptado una postura abiertamente antiamericana, rechazando la cooperación con Washington y criticando la política exterior estadounidense en términos severos. Esto representa un cambio dramático en las relaciones transatlánticas. ¿Cómo deben los Estados Unidos responder a este giro hostil en París?"
 france_md.800.a: "Condena esta política hostil"
 france_md.800.b: "Intento de divulgación diplomática"
 france_md.801.t: "Sobrenatural diplomático americano"
 france_md.801.d: "A pesar de nuestra postura antiamericana, Washington ha hecho overtures diplomáticos, tratando de mantener cierto nivel de cooperación. El Departamento de Estado parece dispuesto a pasar por alto nuestra retórica a cambio de un compromiso limitado. ¿Cómo debemos responder a estos esfuerzos estadounidenses?"
 france_md.801.a: "Rechazar las overturas americanas enteramente"
 france_md.801.b: "Considerar una cooperación limitada"
 france_md.802.t: "Francia se dirige a Rusia"
 france_md.802.d: "El nuevo gobierno francés ha señalado un cambio dramático en la política exterior, buscando vínculos más estrechos con Moscú mientras se distancia de Washington. Esta es una oportunidad para ampliar la influencia rusa en Europa occidental. ¿Cómo responder a esta realineación francesa?"
 france_md.802.a: "Fortalecer los lazos con Francia"
 france_md.802.b: "Procede con cautela"
 france_md.803.t: "Política Exterior Comunista Consecuencias"
 france_md.803.d: "Nuestra política exterior comunista nos ha aislado de los aliados occidentales tradicionales pero abrió puertas con movimientos socialistas y antiimperialistas en todo el mundo. Cuba, Venezuela y otros gobiernos de izquierda dan la bienvenida a nuestra nueva orientación. Sin embargo, esto supone un costo para nuestras relaciones con los aliados de la OTAN y los asociados tradicionales."
 france_md.803.a: "Abrace la solidaridad socialista"
 france_md.803.b: "Movilizar nuestro enfoque"
 france_md.804.t: "Francia Distancias de la OTAN"
 france_md.804.d: "[FRA.GetNameWithFlag] ha anunciado una política de distancia de la OTAN, haciendo eco del retiro de De Gaulle en 1966 de la estructura integrada de comandos. El gobierno francés ha enfatizado la «independencia estratégica» y rechazado subordinación al mando militar estadounidense. ¿Cómo podemos ver este desarrollo?"
 france_md.804.a: "Preocupación expresa por la cohesión de las alianzas"
 france_md.804.b: "Mantener la neutralidad en la política francesa"
 france_md.805.t: "Reconocimiento de Palestina"
 france_md.805.d: "Nuestra política exterior de extrema izquierda nos compromete a reconocer el Estado de Palestina y apoyar la solución biestatal. Esto mejorará las relaciones con los estados árabes y se alineará con nuestros principios antiimperialistas, pero dañará las relaciones con Israel y potencialmente con Estados Unidos. ¿Deberíamos proceder con reconocimiento formal?"
 france_md.805.a: "Reconocimiento inmediato de Palestina"
 france_md.805.b: "Reconocimiento de demoras por ahora"
 france_md.806.t: "Francia reconoce a Palestina"
 france_md.806.d: "El gobierno francés ha reconocido oficialmente el Estado de Palestina, lo que marca un cambio significativo en la política exterior parisina. Esta decisión alinea a Francia con muchas naciones europeas, pero representa una salida del anterior enfoque cauteloso. ¿Cómo debe responder Israel a este desarrollo diplomático?"
 france_md.806.a: "Condena enérgicamente el reconocimiento francés"
 france_md.806.b: "Emitir una respuesta medida"
 france_md.807.t: "El dilema de la guerra de Ucrania"
 france_md.807.d: "La invasión rusa de Ucrania presenta una crisis para nuestra política exterior pro-rusa. Nuestro anterior alineamiento con Moscú es ahora profundamente problemático a medida que los tanques rusos ruedan en una nación europea soberana. El costo político de mantener la neutralidad es enorme, pero condenar a Rusia sería una inversión completa. ¿Qué posición debería tomar Francia?"
 france_md.807.a: "Condena la agresión rusa"
 france_md.807.b: "Mantener la neutralidad"
 france_md.807.c: "Apoyar la posición de Rusia"
 france_md.808.t: "Política Soberana Francesa"
 france_md.808.d: "[FRA.GetNameWithFlag] ha adoptado una firme posición soberana dentro de la Unión Europea, bloqueando aún más la integración y vetando transferencias de soberanía a Bruselas. El gobierno francés argumenta por una «Europa de las Naciones» en lugar de un superestado federal. ¿Cómo responder a este obstruccionismo francés?"
 france_md.808.a: "Oponer obstruccionismo francés"
 france_md.808.b: "La simpatía con las preocupaciones de soberanía"
 france_md.809.t: "Iniciativa del Movimiento de los Países No Alineados"
 france_md.809.d: "Nuestra política exterior no alineada ha atraído el interés de otras naciones que buscan alternativas a las esferas de influencia americana y rusa. Tenemos la oportunidad de posicionar a Francia como líder de un nuevo movimiento no alineado, trabajando con India, Brasil y otros grandes poderes fuera de los bloques tradicionales."
 france_md.809.a: "Liderazgo no alineado"
 france_md.809.b: "Enfoque Sobre las prioridades nacionales"
 france_md.810.t: "Independencia estratégica francesa"
 france_md.810.d: "[FRA.GetNameWithFlag] ha anunciado una política de total independencia estratégica, negando subordinación a cualquier poder extranjero y enfatizando el papel del disuasor nuclear francés. Esto podría tener implicaciones para la asociación franco-alemana que ha sido el fundamento de la cooperación europea. ¿Cómo debería responder Alemania?"
 france_md.810.a: "Expresa preocupación por las relaciones bilaterales"
 france_md.810.b: "Respeto de la soberanía francesa"
 france_md.811.t: "France Embraces Multipolarity"
 france_md.811.d: "El gobierno francés ha anunciado el apoyo a un orden mundial multipolar, rechazando la hegemonía estadounidense y buscando vínculos más estrechos con potencias crecientes. Esto representa una oportunidad para que China expanda la influencia en Europa. ¿Cómo respondería Beijing a esta apertura francesa?"
 france_md.811.a: "Fortalecer los lazos con Francia"
 france_md.811.b: "Mantener un compromiso cauteloso"
 france_md.812.t: "Francia deja la OTAN"
 france_md.812.d: "Nos hemos retirado formalmente de la Organización del Tratado del Atlántico Norte, completando nuestro descanso con la hegemonía americana. Francia se encuentra ahora sola, ni vinculada por el artículo 5 ni sujeta al mando militar estadounidense. Esta decisión abre nuevas posibilidades y peligros reales por igual. ¿Qué camino debería seguir Francia?"
 france_md.812.a: "Abrace la independencia estratégica completa"
 france_md.812.b: "Buscar nuevas alianzas"
 FRA_extremist_foreign_policy_category: "Extremista Política Exterior"
 FRA_extremist_foreign_policy_category_desc: "Acciones diplomáticas y de política exterior disponibles para Francia bajo gobiernos extremistas o gaullistas."
 FRA_rejoin_nato_command: "Reincorporarse al Mando Integrado de la OTAN"
 FRA_rejoin_nato_command_desc: "Tras distanciarnos de la OTAN, podemos optar por reincorporarnos a la estructura de mando militar integrada. Esto restablecería nuestra posición dentro de la alianza y mejoraría las relaciones con los aliados estadounidenses y europeos."
 FRA_seek_russian_partnership: "Buscar una asociación rusa"
 FRA_seek_russian_partnership_desc: "Nuestra política exterior independiente crea una oportunidad de reforzar los lazos con Moscú. Podemos buscar relaciones diplomáticas y económicas más estrechas con Rusia, aunque esto tensará más las relaciones con Washington."
 FRA_recognize_palestine: "Recognise Palestine"
 FRA_recognize_palestine_desc: "Nuestra política exterior antiimperialista exige reconocer al Estado de Palestina y apoyar el derecho del pueblo palestino a la autodeterminación. Esto mejorará las relaciones con los Estados árabes pero dañará los lazos con Israel."
 FRA_condemn_russia_ukraine: "Condene Russian Aggression"
 FRA_condemn_russia_ukraine_desc: "La invasión rusa de Ucrania ha vuelto políticamente insostenible nuestra postura prorrusa. Podemos optar por condenar la agresión y distanciarnos de Moscú, aunque esto supone un giro importante de política."
 FRA_non_aligned_initiative: "Iniciativa sobre el liderazgo de los países no alineados"
 FRA_non_aligned_initiative_desc: "Nuestra política exterior no alineada sitúa a Francia para liderar un nuevo movimiento de naciones que buscan alternativas tanto a la hegemonía estadounidense como a la influencia rusa. Podemos reforzar los lazos con India, Brasil y otras grandes potencias fuera de los bloques tradicionales."
 FRA_socialist_solidarity: "Solidaridad Socialista"
 FRA_socialist_solidarity_desc: "Nuestra política exterior comunista pide solidaridad con los Estados socialistas de todo el mundo. Podemos reforzar los lazos con Cuba, Venezuela y otros gobiernos de izquierda y construir una red internacional de cooperación anticapitalista."
 FRA_veto_eu_federalization: "Vetar la Federalización de la UE"
 FRA_veto_eu_federalization_desc: "Como nación soberana dentro de la UE, podemos usar nuestro poder de veto para bloquear una mayor federalización y traspasos de soberanía a Bruselas. Esto defiende la independencia francesa pero tensa las relaciones con los Estados miembros partidarios de la integración."
 FRA_immigration_wave: "Capitalizar la onda de inmigración"
 FRA_immigration_wave_desc: "Las actuales políticas liberales de inmigración en Francia han dado lugar a una importante afluencia de migrantes. Aunque algunos consideran que esto es una necesidad humanitaria o una oportunidad económica, otros lo ven con creciente preocupación. El Rally Nacional puede capitalizar estos sentimientos, presentándose como defensor de la identidad y seguridad francesas. Cuanto más abra nuestras fronteras, más fuerte será la reacción trasera que podamos aprovechar."
 FRA_high_immigration_tooltip: "Francia debe tener §Y Open Borders§! o §YLevemente Regulated Immigration§! law"
 FRA_immigration_backlash: "Inmigración Backlash"
 FRA_immigration_backlash_desc: "Una ola de sentimientos anti-inmigración está barriendo a través de la sociedad francesa. El mensaje del Rally Nacional sobre inmigración, seguridad e identidad nacional resuena con una parte creciente de la población, desplazando el paisaje político hacia la derecha y debilitando el apoyo al status quo."
 FRA_end_extraction: "Restricción de la extracción de recursos"
 FRA_end_extraction_desc: "En la búsqueda de nuestra visión ambiental, implementaremos normas estrictas sobre operaciones mineras, extracción petrolera y actividades industriales pesadas en toda Francia continental. Esto reducirá la producción de recursos internos en aproximadamente un tercio, pero representa un paso necesario para la protección del medio ambiente. Los gobiernos futuros pueden invertir esta política si las circunstancias cambian."
 FRA_green_extraction_ban: "Restricciones de la extracción ambiental"
 FRA_green_extraction_ban_desc: "Francia ha aplicado amplias restricciones ambientales a la extracción de recursos. Las operaciones mineras tienen límites estrictos, la perforación de petróleo está fuertemente regulada y la extracción industrial debe cumplir normas ambientales exigentes. Si bien esto ha reducido la disponibilidad de recursos internos en aproximadamente un tercio, la reducción de la contaminación ha dado lugar a mejoras mensurables en materia de salud: las tasas de cáncer en las regiones industriales anteriores han disminuido considerablemente y los costos sanitarios están disminuyendo."
 FRA_environmental_policy_decisions: "Política ambiental"
 FRA_environmental_policy_decisions_desc: "Decisiones relacionadas con las políticas ambientales de Francia y las normas de extracción de recursos."
 FRA_reverse_extraction_ban: "Derogar las restricciones del Código Minero"
 FRA_reverse_extraction_ban_desc: "El código minero reescrito ha costado a nuestra industria extractiva fuera del negocio y dejó las refinerías dependientes de las importaciones. Repealing restaura la producción nacional, y rompe con los Verdes y las asociaciones ambientales que lo escribieron."
 france_md.960.t: "Francia reescribe su código de minería"
 france_md.960.d: "[FRA.GetNameWithFlag] ha reescrito su código minero, terminando los permisos de hidrocarburos y la extracción de capping en toda la Francia metropolitana. Aproximadamente un tercio de la producción nacional francesa desaparece con ella. Las asociaciones ambientales son jubilantes, y las federaciones industriales ya están en Bruselas advirtiendo sobre el precedente."
 france_md.960.a: "Un precedente digno de seguir"
 france_md.960.b: "La industria europea pagará por esto"
 france_md.900.t: "Cuenta Ocultatoria del Ministro de Presupuesto"
 france_md.900.d: "Nuestro ministro de presupuesto, que dirige la campaña contra el fraude fiscal de Bercy, negó tener una cuenta extranjera al propio Assemblée nationale. Un sitio de investigación ha publicado ahora la ruta: Ginebra primero, luego Singapur. La negación está en el registro, y fue una mentira."
 france_md.900.a: "Desestimar al ministro y entregar el expediente a los fiscales"
 france_md.900.b: "Aceptar una renuncia tranquila"
 france_md.900.c: "Preparado por el Ministro"
 france_md.901.t: "Una Autoridad de Transparencia para la Vida Pública"
 france_md.901.d: "El escándalo ha hecho que las declaraciones de activos sean inevitables. Podemos crear una autoridad independiente para la transparencia en la vida pública, obligando a todos los ministros, diputados y senadores a presentar sus intereses y su riqueza, con el poder de remitir los casos dudosos a los fiscales. El Assemblée resentirá cada línea de él."
 france_md.901.a: "Crear la autoridad de transparencia"
 france_md.901.b: "Publicar un código de conducta y seguir adelante"
 france_md.902.t: "Asistente Parlamentario Ficticio del Candidato"
 france_md.902.d: "Le Canard enchaîné ha impreso las pautas: un candidato presidencial líder puso a un miembro de la familia en la nómina parlamentaria por trabajo que nadie en la oficina puede certificar. El financiero nacional del Parquet abrió una investigación preliminar la misma mañana. El candidato lo llama un complot institucional y se niega a ponerse de pie."
 france_md.902.a: "Saca al candidato de la carrera"
 france_md.902.b: "Llevar a cabo la campaña independientemente de"
 france_md.902.c: "Culpa a los jueces y la prensa"
 france_md.903.t: "Un ex presidente en el muelle"
 france_md.903.d: "Un ex Presidente de la República está acusado de ficticios cargos municipales pagados por los contribuyentes de París, y de facturas de campaña facturadas a una empresa por rallyes que nunca sucedieron. La inmunidad presidencial terminó con su mandato. El correccional del tribunal ha fijado una fecha."
 france_md.903.a: "Que el tribunal haga su trabajo"
 france_md.903.b: "Denunciar un juicio político"
 france_md.910.t: "Chalecos amarillos en la rotonda"
 france_md.910.d: "Un impuesto al carbono sobre el diesel ha puesto chalecos de alta visibilidad en cada rotonda del país. No hay ningún sindicato detrás de él, ninguna parte y ninguna delegación que negocie con: sólo los conductores, pequeños comerciantes y pensionistas que no pueden absorber otro centímetros en la bomba. El sábado se ha convertido en una demostración permanente."
 france_md.910.a: "Cancela la subida del impuesto sobre el combustible"
 france_md.910.b: "Mantener el impuesto y las conversaciones abiertas"
 france_md.910.c: "Mantenga la línea en el impuesto"
 france_md.911.t: "Los Campos Elíseos queman el sábado"
 france_md.911.d: "Las marchas del sábado terminan ahora con gas lacrimógeno en los Campos Elíseos, con el Arco del Triunfo etiquetado y las brasseries de la avenida saqueadas. La préfecture de police se está quedando sin empresas de CRS descansadas y es culpada por toda la tarde. Las tiendas están subiendo para la temporada."
 france_md.911.a: "Convocar el Gran Débat Nacional"
 france_md.911.b: "Aumentar el salario mínimo y reducir el CSG en las pensiones"
 france_md.911.c: "Envíe el CRS"
 france_md.912.t: "Mes Cinco en la rotonda"
 france_md.912.d: "Las ocupaciones están en su quinto mes, y las rondas de goma disparadas por nuestra propia policía están bajo investigación judicial. Las tomas del centro de la ciudad se han colapsado y las prefecturas no pueden seguir encontrando nuevas empresas. Matignon quiere una decisión esta semana."
 france_md.912.a: "Declarar una emergencia económica y social"
 france_md.912.b: "Prohibir las marchas e imponer un estado de emergencia"
 france_md.920.t: "Los socialistas pierden su sede"
 france_md.920.d: "La financiación pública sigue los asientos, y después de las dos últimas rondas no hay suficiente de ellos para mantener las luces en Solférino. Los señores quieren que el partido vuelva a la izquierda, los alcaldes y los ministros salientes quieren que se mantenga en condiciones de gobernar, y ambas alas están siendo cortejadas desde fuera. El edificio ya es valorado."
 france_md.920.a: "Gire la fiesta de vuelta a la izquierda"
 france_md.920.b: "Ancla al partido en el centro de gobierno"
 france_md.920.c: "Deja que las alas salgan"
 france_md.921.t: "El Partido debate Dédiabolización"
 france_md.921.d: "El nuevo liderazgo del National Rally quiere ser respetable: argumentos económicos en vez de étnicos, no más provocaciones sobre los campamentos y candidatos que pueden sobrevivir a una entrevista televisiva. El objetivo es el républicain frontal que ha apagado la fiesta de cada segunda ronda. La generación fundadora lo llama rendirse."
 france_md.921.a: "Que la fiesta se normalice"
 france_md.921.b: "Mantenga la fiesta en su antigua línea"
 france_md.921.c: "Que la familia fundadora se avergüence en público"
 france_md.922.t: "El Fundador contra Su propio Partido"
 france_md.922.d: "El fundador ha repetido su vieja provocación sobre los campamentos, en cámara, en medio de una campaña que no está ejecutando. El liderazgo ha convocado un grupo disciplinario y está escribiendo la presidencia honoraria fuera de los estatutos. El congreso decidirá si el partido mantiene su nombre."
 france_md.922.a: "Entrega el partido a la nueva generación"
 france_md.922.b: "Expelen al fundador"
 france_md.923.t: "La derecha rompe el frente republicano"
 france_md.923.d: "El líder de la derecha tradicional fue en las noticias nocturnas y anunció un pacto electoral con el Rally Nacional, sin ponerlo a su propio buró político. La oficina tuvo que reunirse en una habitación alquilada, porque tenía el cuartel general del partido cerrado. Cuarenta años de la républicain frontal terminaron en una sola emisión."
 france_md.923.a: "Expelarlo y rechazar el pacto"
 france_md.923.b: "Ratificar el pacto para la segunda ronda"
 france_md.923.c: "Deja que la fiesta se rompa en dos"
 france_md.930.t: "Ocho sindicatos contra la reforma de pensiones"
 france_md.930.d: "El aumento de la edad legal de jubilación ha puesto a los ocho sindicatos representativos en la misma plataforma por primera vez en una generación. El SNCF y el RATP están ejecutando huelgas rodantes, las refinerías son las siguientes, y el Assemblée no tiene mayoría para el texto. El artículo 49.3 figura en la mesa de Matignon."
 france_md.930.a: "Forzar el texto hasta 49,3"
 france_md.930.b: "Negociar con los sindicatos reformistas"
 france_md.930.c: "Retirar el texto"
 france_md.931.t: "Los sindicatos reformistas ofrecen términos"
 france_md.931.d: "Las confederaciones reformistas aceptarán una edad de jubilación posterior si llega a pasos trimestrales y si largas carreras y trabajos arduos llevan exenciones. Los ahorros caen a la mitad y las federaciones de línea dura no firmarán nada en absoluto. Es el único texto con firmas en él."
 france_md.931.a: "Firme el compromiso"
 france_md.931.b: "Rechazar y dejar correr las huelgas"
 france_md.932.t: "Las universidades están bloqueadas"
 france_md.932.d: "Un contrato de primer empleo que permite a los empleadores despedir a menores de 26 años sin declarar una causa ha puesto bins en las puertas de la Sorbona y la mitad de los campus provinciales. Los sindicatos estudiantiles se han unido por los liceos y por el CGT. La prefectura está pidiendo autorización para limpiar los edificios."
 france_md.932.a: "Retiro del contrato"
 france_md.932.b: "Negociar con los sindicatos estudiantiles"
 france_md.932.c: "Limpiar los campus"
 france_md.940.t: "A Elección de la tensión"
 france_md.940.d: "La primera vuelta de una elección local ha eliminado a los candidatos gobernantes de la mayoría de las ciudades de Francia y ha puesto en marcha un partido extremista. Dentro de la hora los llamados a un républicain delantero estaban fuera: votar por el que queda, y discutir sobre ello después. Otros responden que un voto extraído de esa manera no es un mandato."
 france_md.940.a: "Llamada para un républicain frontal"
 france_md.940.b: "Deja la segunda vuelta a los votantes"
 france_md.940.c: "Tratar el resultado como un veredicto sobre nosotros"
 france_md.941.t: "Un movimiento fuera de las viejas Partes"
 france_md.941.d: "Un exministro ha dejado al gobierno para construir un movimiento propio, ni de izquierda ni de derecha, financiado por rallyes con boletos y construido en una lista de membresía reunida puerta a puerta. Los diputados de ambos partidos gobernantes ya están preguntando acerca de los lugares en sus listas. Ninguno de los partidos tiene un candidato que lo supera."
 france_md.941.a: "Retrocede el movimiento"
 france_md.941.b: "Desestimarlo como una moda pasajera"
 france_md.941.c: "Forzar a los viejos partidos a renovarse"
 france_md.950.t: "Noches de Rioting en los baniles"
 france_md.950.d: "Dos adolescentes murieron huyendo de un cheque de identidad en un cité del Seine-Saint-Denis. A la tercera noche los coches quemados estaban siendo contados en los miles, desde los suburbios del norte hacia Toulouse y Estrasburgo. Los alcaldes están pidiendo toque de queda bajo la ley de 1955."
 france_md.950.a: "Condena el toque de queda en virtud de la ley de 1955"
 france_md.950.b: "Financiar el organismo de renovación y los trimestres prioritarios"
 france_md.950.c: "Promesa limpiar las fincas"
 france_md.949.t: "Ataques coordinados a través de París"
 france_md.949.d: "Los ataques siguen corriendo en los distritos orientales y en la Stade de France. El BRI está en la puerta de una sala de conciertos con rehenes dentro. Cada hospital de la Isla de Francia ha ido a su plan de emergencia."
 france_md.949.a: "Declarar tres días de luto nacional"
 france_md.951.t: "Convocatoria del Parlamento en el Congreso"
 france_md.951.d: "Las marchas han terminado y ambas cámaras han sido llamadas a Versalles. Beauvau quiere el état d'urgence extendido y Sentinelle doblado, el Quai d'Orsay quiere que el grupo de portador enviado al este, y el Conseil d'État ya nos está advirtiendo sobre registros administrativos."
 france_md.951.a: "Extender la état d'urgence"
 france_md.951.b: "Enviar el grupo de transportistas al este"
 france_md.951.c: "Rechazar los poderes de emergencia"
 france_md.952.t: "Europeann Constitution Referendum"
 france_md.952.d: "El tratado irá al país en lugar de al Congreso, y la campaña ha dividido a ambos partidos gobernantes en el medio. El no se argumenta a la izquierda como una carta para el trabajo publicado y a la derecha como el fin de la soberanía francesa. Las últimas encuestas pusieron los dos campos dentro del margen."
 france_md.952.a: "Campaña dura para el sí"
 france_md.952.b: "Mantente fuera de la campaña"
 france_md.952.c: "Ratificar por el Congreso en lugar"
 france_md.953.t: "La izquierda negocia una plataforma común"
 france_md.953.d: "Los socialistas, los comunistas, los verdes y los insoumis están dividiendo las circunscripciones entre ellos, una candidatura a la vez. Los puntos adhesivos no se han movido desde el último intento: los tratados europeos, y quién dirige la plataforma. Cada parte está calculando si el acuerdo cuesta más asientos de lo que gana."
 france_md.953.a: "Ponga un moderado en la cabeza del bloque"
 france_md.953.b: "Que los insoumis establezcan la plataforma"
 france_md.953.c: "Deja que las conversaciones se derrumben"
 france_md.954.t: "Una asamblea sin una mayoría"
 france_md.954.d: "El Assemblée ha vuelto en tres bloques y ninguno de ellos puede llegar a 289 asientos. Cualquier candidato a Matignon puede ser censurado en el día del nombramiento, y el presupuesto tiene que pasar antes de que termine el período de sesiones. El Élysée está recibiendo a los líderes del partido uno por uno y sin llegar a ninguna parte."
 france_md.954.a: "Nombrar un gobierno de técnicos"
 france_md.954.b: "Disolver y volver al país"
 france_md.954.c: "Construir una coalición en los bloques"
 FRA_ps_platform: "Plataforma del partido socialista"
 FRA_ps_platform_desc: "El partido se encuentra en el registro de la izquierda plural: la semana de treinta y cinco horas, cobertura médica universal y contratos de empleo juvenil, todo ello financiado por una base tributaria más amplia en lugar de pedir prestado. Cada compromiso del congreso tiene una línea en el presupuesto detrás de él, y la Rue de Solférino se propone juzgar si el dinero llega."
 FRA_udf_platform: "Centrista Union Platform"
 FRA_udf_platform_desc: "El centro se ocupa de los cargos más bajos para el negocio, una mano más ligera sobre el código laboral y un fin al reflejo de responder a cada problema con un nuevo impuesto. Su argumento es que el capital permanecerá en Francia sólo si Francia deja de tratar la inversión como algo a ser castigado."
 FRA_lr_platform: "Plataforma derecha republicana"
 FRA_lr_platform_desc: "La derecha gaullista ofrece la negociación clásica de la Quinta República: un ejército financiado para actuar solo cuando la República lo requiera, y un estado despojado de las capas de administración que se han acumulado alrededor. El orden en el país y la independencia en el extranjero se presentan como la misma política."
 FRA_rpf_platform: "Plataforma Souverainista"
 FRA_rpf_platform_desc: "Campaña Pasqua y de Villiers sobre una sola propuesta, que ningún tratado puede transferir lo que pertenece al pueblo francés, y lo aplican al euro, a Schengen y a los poderes de la Comisión por igual. Los socios comerciales leyeron el programa como una amenaza para todos los arreglos que han firmado con París."
 FRA_fn_platform: "Plataforma frontal nacional"
 FRA_fn_platform_desc: "La preferencia nacional en materia de vivienda, empleo y bienestar, la cesación de la reunificación familiar y la reincorporación de los controles fronterizos forman todo el programa. Dibuja multitudes que ningún otro partido puede reunir y endurece la oposición de todos los demás contra el partido en igual medida."
 FRA_lfi_platform: "France Unbowed plataforma"
 FRA_lfi_platform_desc: "Las campañas de movimiento para una asamblea constituyente para enterrar la monarquía presidencial, y construye su caso en la calle y el salón de reuniones más que en la Asamblea Nacional. La atención médica gratuita en el punto de uso es la demanda del titular, y las lealtades del partido antiguo se disuelven donde pase la campaña."
 FRA_eelv_platform: "Plataforma ecologista"
 FRA_eelv_platform_desc: "Los Verdes piden que el programa del reactor se acabe, para que la construcción responda a la revisión ambiental y para que el dinero vaya a la investigación sobre lo que sustituye a ambos. La transición que describen es real, y también es la década de construcción más lenta que requiere."
 FRA_pcf_platform: "Plataforma del Partido Comunista"
 FRA_pcf_platform_desc: "El partido todavía mantiene los municipios de la banda roja y las secciones sindicales en las grandes plantas, y campañas donde es más fuerte: en el piso de la tienda, sobre salarios, horas y la defensa del empleo industrial. Donde las células están activas las plantas funcionan mejor que las cuentas predicen."
 FRA_idea_transparency_reforms: "Transparencia en la vida pública"
 FRA_idea_transparency_reforms_desc: "Cada ministro, diputado y senador presenta ahora una declaración de intereses y activos con una autoridad independiente que puede publicarlos y remitir los casos dudosos a los fiscales. La clase política resentía la obligación y cumplió con ella."
 FRA_idea_national_debate: "Debate nacional"
 FRA_idea_national_debate_desc: "Durante dos meses los alcaldes están abriendo sus cámaras del consejo a quienquiera que aparezca, y las contribuciones están siendo registradas por decenas de miles. Cuesta dinero y tiempo ministerial, y mueve el argumento fuera de las rotondas y en los ayuntamientos."
 FRA_idea_social_emergency_measures: "Emergencia económica y social"
 FRA_idea_social_emergency_measures_desc: "Se ha elevado el suplemento salarial mínimo, se han extraído horas extra de impuestos y se ha cancelado la subida CSG para las pensiones más pequeñas. La cuenta cae sobre el déficit en el mismo trimestre, y Bruselas se ha dado cuenta."
 FRA_idea_pension_reform_passed: "Reforma de la pensión por artículo 49.3"
 FRA_idea_pension_reform_passed_desc: "La edad de jubilación subió sin voto, bajo el artículo que involucra la responsabilidad del gobierno, y la moción de censura cayó un puñado de diputados cortos. Las cuentas de pensiones mejoran, y cada texto que enviamos al Assemblée después será leído a través de éste."
 FRA_idea_pension_compromise: "Reforma de pensiones negociada"
 FRA_idea_pension_compromise_desc: "La edad de jubilación aumenta en pasos trimestrales, con exenciones para largas carreras y para el trabajo clasificado como arduo. Las confederaciones reformistas firmaron, las federaciones de línea dura no lo hicieron, y los ahorros son aproximadamente la mitad de lo que el texto original prometió."
 FRA_idea_political_renewal: "Renovación de la clase política"
 FRA_idea_political_renewal_desc: "La mitad de las bancadas del Assemblée nunca han tenido el cargo elegido, y las máquinas del partido ya no controlan sus propias candidaturas. La nueva ingesta es visible, energética y totalmente inexperimentada."
 FRA_idea_urban_renewal: "Renovación urbana en las Cités"
 FRA_idea_urban_renewal_desc: "La agencia de renovación firma convenios de quince años con los alcaldes de los barrios prioritarios, demoliendo las peores torres y reconstruyendo las escuelas detrás de ellas. Los resultados llegan mucho después del gobierno que les ordenó."
 FRA_idea_national_unity: "Unidad Nacional después de los ataques"
 FRA_idea_national_unity_desc: "La oposición ha suspendido sus movimientos, los tricolores están en las ventanas, y la reserva y la gendarmería tienen más voluntarios de lo que pueden procesar. No va a durar el año, y mientras sostiene que vale algo."
 FRA_idea_technocratic_government: "Gobierno de Técnicos"
 FRA_idea_technocratic_government_desc: "Los prefectos, inspectores de finanzas y ex banqueros centrales mantienen a los ministerios, nombrados del Élysée y tolerados por un Assemblée que no puede aceptar nada más. Pueden pasar un presupuesto. No pueden pasar una reforma."
 FRA_heightened_security: "Plan Vigipirate Activo"
 FRA_heightened_security_desc: "Vigipirate ha sido criado para reforzar la seguridad, y la vigilancia de lugares sensibles ha pasado de la policía al ejército bajo la Opération Sentinelle. Miles de soldados se encuentran ahora fuera de las estaciones, escuelas y lugares de culto, y el ejército factura el costo a su disposición en lugar de a Beauvau."
 FRA_state_of_emergency_terrorism: "Declarado Estado de Urgencia"
 FRA_state_of_emergency_terrorism_desc: "La ley de 1955 está en vigor: los prefectos pueden ordenar registros sin un magistrado, asignar a las personas residencia y prohibir reuniones por su propia autoridad. El Parlamento lo renueva cada tres meses y el Consejo de Estado cuenta las apelaciones."
 FRA_terror_threat_elevated: "Elevada amenaza terrorista"
 FRA_terror_threat_elevated_desc: "El DGSI lleva más archivos sobre los repatriados y personas radicalizadas de lo que tiene oficiales para verlos, y la lista sigue creciendo. Los grandes eventos están siendo cancelados por orden prefectoral en lugar de asegurados."
 FRA_terror_threat_critical: "Amenaza contra el terrorismo crítico"
 FRA_terror_threat_critical_desc: "Los servicios cuentan con varias celdas operativas bajo vigilancia de inmediato y ya no esperan interceptarlas. La licencia ha sido cancelada a través de la policía y la gendarmería, y el ministro del Interior ha dejado de dar fechas."
 FRA_national_mourning: "Días de Ratón Nacional"
 FRA_national_mourning_desc: "Las banderas están a medio mástil en cada edificio público, el minuto de silencio se mantiene al mediodía, y los nombres son leídos en los Inválidos. Esta semana no se está llevando a cabo ningún negocio."
 FRA_damaged_infrastructure: "Infraestructura crítica afectada"
 FRA_damaged_infrastructure_desc: "Los ataques llevaron a cabo un intercambio de metro y una sección de la red de alta tensión, y las reparaciones se están ejecutando detrás del horario de emergencia. Los operadores están trabajando bajo pedido prefectoral y el estado está llevando la factura."
 FRA_tourism_crisis: "Crisis del turismo"
 FRA_tourism_crisis_desc: "La ocupación del hotel en la Isla de Francia se ha colapsado y los operadores turísticos de larga distancia han cancelado a lo largo de la temporada. El turismo es nuestro mayor ganado de divisas, y volverá a ritmo de boletines de noticias extranjeros en lugar de nuestra política de seguridad."
 france_md.970.t: "Bomba en el RER en Rush Hour"
 france_md.970.d: "Un dispositivo dejado en un carro detonado en una estación de intercambio durante la prisa matutina, en una sección del túnel los servicios de rescate sólo pueden llegar a pie. Docenas están muertas y el recuento de los heridos sigue aumentando. Toda la red se detiene y el plan de bajas masivas está en vigor."
 france_md.970.a: "Requisar los hospitales y los servicios de emergencia"
 france_md.970.b: "Declarar un día de luto nacional"
 france_md.970.c: "Reabrir la red y rechazar poderes de emergencia"
 france_md.971.t: "Pistoleros atacan a un comisario"
 france_md.971.d: "Los atacantes con fusiles de asalto y una carga de vehículo lucharon contra un comisario en los suburbios del norte durante cuarenta minutos antes de que el BRI llegara a ellos. Los oficiales están muertos y el edificio es inutilizable. Quien lo planeó sabía la hora del cambio de turno."
 france_md.971.a: "Sellar el departamento y cazar a los cómplices"
 france_md.971.b: "Fortalecer cada comisariado en el país"
 france_md.972.t: "Equipos de Suicidio Strike Across the Capital"
 france_md.972.d: "Tres equipos con fusiles de asalto y bandas explosivas trabajaron un enfoque del estadio, una carrera de bares y una sala de conciertos en la misma hora. Más de cien personas están muertas y los cirujanos de la Isla de Francia están operando a pie de guerra. Nada de esta escala se ha hecho en nuestro suelo desde la guerra."
 france_md.972.a: "Declare la état d'urgence"
 france_md.972.b: "Invocar la cláusula europea de defensa mutua"
 france_md.972.c: "Ataque las bases de la organización en el extranjero"
 france_md.973.t: "Ataque al Louvre"
 france_md.973.d: "Un hombre con una espada fue detenido en el puesto de control de Carrousel, pero el equipo detrás de él vino a través de la entrada de Tuileries con explosivos y ahora está en el ala Denon. Los visitantes están encerrados en las galerías por encima de ellos. El personal de conservación está pidiendo tiempo para mover lo que todavía se puede mover."
 france_md.973.a: "Saca a los visitantes primero"
 france_md.973.b: "Asegure la colección antes del asalto"
 france_md.974.t: "Ataques dentro de una base militar"
 france_md.974.d: "Un equipo cruzó el perímetro de una base aérea en un punto donde se habían suspendido las reparaciones de la valla, y llegó a la dispersión de alerta antes de que la fuerza de guardia los detuviera. Conocieron el giro y conocían los códigos de la puerta. La contrainteligencia militar está investigando a nuestro propio personal."
 france_md.974.a: "Revise la seguridad en cada instalación"
 france_md.974.b: "Deja que la contrainteligencia muestre las filas"
 france_md.975.t: "Rehenes en la Torre Eiffel"
 france_md.975.d: "Hombres armados cabalgaron los ascensores con los primeros turistas del día y sostenían la plataforma superior con varios cientos de rehenes. La maquinaria de elevación está cableada y el GIGN no puede acercarse a través del Campo de Marte sin ser visto por un kilómetro. Quieren que los presos sean liberados y una transmisión."
 france_md.975.a: "Envía el GIGN a la torre"
 france_md.975.b: "Hable con ellos y compre tiempo"
 france_md.975.c: "Rechazar cada demanda"
 france_md.976.t: "Agresión a una central nuclear"
 france_md.976.d: "Los atacantes sostienen el bloque administrativo y la construcción de combustible gastado de una estación del valle del Loira. Dicen que abrirán la piscina de combustible en el momento en que se acerca el sitio. El instituto de radiación ha modelado la ciruela y cruza tres fronteras."
 france_md.976.a: "Toma el reactor frío y envía al GIGN"
 france_md.976.b: "Ataque el sitio con todo lo que tenemos"
 france_md.980.t: "Ataques coordinados Devastate Paris"
 france_md.980.d: "Asaltos simultáneos a un enfoque del estadio, una sala de conciertos y una serie de bares en París han matado a más de cien personas. Francia ha cerrado sus fronteras y puesto su ejército en las calles. Los ministerios del interior de toda Europa están releyendo sus propios archivos sobre los repatriados."
 france_md.980.a: "Estamos en Francia."
 france_md.981.t: "Gunmen Storm el Louvre"
 france_md.981.d: "Los atacantes armados están dentro del ala de Denon del Louvre, con visitantes encerrados en las galerías que les rodean. El museo tiene trabajo que ningún seguro y ninguna restauración pueden reemplazar. Cada colección importante del continente está revisando lo que haría."
 france_md.981.a: "Ofrezca asistencia a Francia"
 france_md.982.t: "Rehenes Celebrados en la Torre Eiffel"
 france_md.982.d: "Varios cientos de visitantes se encuentran en la plataforma superior de la Torre Eiffel por hombres armados que han cableado la maquinaria de ascensor. Las fuerzas especiales francesas se estancan en el Campo de Marte frente a las cámaras del mundo. Los ministerios extranjeros están contando a sus nacionales de las listas de visitantes."
 france_md.982.a: "Ofrezca cualquier ayuda que Francia tome"
 france_md.983.t: "Planta nuclear francesa bajo ataque"
 france_md.983.d: "Se han emitido alertas de emergencia en toda Europa a medida que los terroristas atacan una instalación nuclear francesa. Si bien las autoridades insisten en que no existe un riesgo inmediato de radiación, el potencial para un desastre a escala de Chernobyl ha enviado ondas de choque en todo el continente. Los gobiernos están preparando planes para imprevistos y se ha ordenado a las poblaciones cercanas al centro que se cobijen en él."
 france_md.983.a: "Preparar planes de respuesta de emergencia"
 france_md.985.t: "Complot terrorista frustrado"
 france_md.985.d: "Los servicios de inteligencia franceses han interrumpido con éxito una importante trama terrorista. Los meses de vigilancia, operaciones encubiertas y cooperación internacional llevaron a redadas coordinadas que capturaron a los conspiradores antes de poder atacar. Los detalles siguen siendo clasificados, pero las fuentes indican que el ataque previsto podría haber sido catastrófico. Este éxito valida la pesada inversión en capacidades de lucha contra el terrorismo."
 france_md.985.a: "Encomiar los servicios de inteligencia"
 france_md.985.b: "Mantener una mayor seguridad"
 FRA_counter_terrorism_category: "Operaciones contra el terrorismo"
 FRA_french_communism_expansionism_decision_category: "La guerra contra el capitalismo"
 FRA_3rd_empire_decision_category: "Expandir el Tercer Imperio"
 FRA_LFI6th_decision_category: "El amanecer de una nueva República"
 FRA_french_socialist_downfall_decision_category: "La caída del socialismo"
 FRA_frexit_decision_category: "Abandonar la Unión Europea"
 FRA_royalist_expansion_decision_category: "La Reconquista"
 FRA_EU_assistance_decision_category: "Europeann Economical Partnership"
 FRA_GREEN_EU_assistance_decision_category: "La Transición Ecológica Europea"
 FRA_activate_vigipirate: "Activate Vigipirate"
 FRA_activate_vigipirate_desc: "Activar el sistema de alerta de seguridad nacional de Francia, desplegando soldados armados para patrullar los espacios públicos y aumentando la seguridad en lugares sensibles. Esto da protección contra ataques terroristas pero conlleva costos continuos."
 FRA_declare_state_of_emergency: "Declarar el estado de emergencia"
 FRA_declare_state_of_emergency_desc: "En respuesta a la grave amenaza terrorista, declarar el estado de emergencia nacional. Esto da poderes ampliados a las fuerzas de seguridad pero suspende ciertas libertades civiles."
 FRA_end_state_of_emergency: "Poner fin al estado de emergencia"
 FRA_end_state_of_emergency_desc: "Con la amenaza inmediata reducida, ponga fin al estado de emergencia y restablezca las libertades civiles normales. Esto ayudará a normalizar la vida cotidiana y reducir las tensiones políticas."
 FRA_intelligence_surge: "Inteligencia"
 FRA_intelligence_surge_desc: "Aumentar de forma significativa la financiación y los recursos de los servicios de inteligencia para mejorar las capacidades de vigilancia y las operaciones antiterroristas. Esto permite operaciones proactivas contra redes terroristas."
 FRA_secure_critical_infrastructure: "Infraestructura crítica segura"
 FRA_secure_critical_infrastructure_desc: "Invertir en endurecer la infraestructura crítica (centrales eléctricas, nudos de transporte, telecomunicaciones) contra ataques terroristas. Es caro pero reduce la vulnerabilidad a grandes ataques."
 FRA_operation_sentinelle: "Operación Sentinelle"
 FRA_operation_sentinelle_desc: "Desplegar a miles de soldados en tareas de seguridad interna, patrullando calles, protegiendo sitios sensibles y apoyando operaciones policiales. Esta presencia militar visible tranquiliza al público pero tensa a las fuerzas armadas."
 FRA_anti_terror_raid: "Conducta antiterrorista Raid"
 FRA_anti_terror_raid_desc: "Con base en la inteligencia reunida, realizar incursiones contra presuntas células terroristas. El éxito podría frustrar ataques planeados y reducir el nivel general de amenaza."
 FRA_terrorism_defeated: "Declarar la victoria sobre el terrorismo"
 FRA_terrorism_defeated_desc: "Con la estabilidad restablecida y sin ataques recientes, declara oficialmente que la amenaza terrorista ha sido neutralizada. Esto proporciona un impulso moral y permite que la nación avance."
 FRA_rebuild_after_attack: "Reconstrucción infraestructura dañado"
 FRA_rebuild_after_attack_desc: "Invertir en reparar la infraestructura dañada por los atentados terroristas. Restaurar estas instalaciones es esencial para volver a la vida normal y demostrar resiliencia."
 FRA_tourism_recovery_campaign: "Campaña de recuperación turística"
 FRA_tourism_recovery_campaign_desc: "Lanzar una gran campaña internacional para promover a Francia como destino turístico seguro. Restablecer el turismo es vital para la economía y demuestra que los terroristas no pueden destruir el modo de vida francés."
 FRA_6threp_mission: "Entusiasmo popular"
 FRA_6threp_mission_desc: "Nuestro compromiso con reformar el sistema político ha hecho felices a muchos. Mucha gente quiere cambio, pero no debemos parecer quienes intentan retrasar el proceso."
 FRA_rally_support: "Mostrar nuestro progreso"
 FRA_rally_support_desc: "Nuestros opositores intentan frenar el proceso y cuestionar cada cambio que hacemos. Pero debemos mantenernos firmes. Hemos logrado mucho y debemos demostrarlo."
 FRA_rally_ennemy: "La oposición critica nuestras reformas"
 FRA_rally_ennemy_desc: "Mientras estos cambios son esenciales, no siempre bajan bien con todos. Nuestra oposición está haciendo todo lo posible para criticar todas las decisiones relativas al futuro de nuestra República."
 FRA_timebomb_mission: "El divorcio inevitable"
 FRA_timebomb_mission_desc: "Las dos facciones principales del Partido Socialista están amenazando con abandonar el partido si no resolvemos la situación. Debemos demostrarles que hay un futuro con el Partido Socialista antes de que sea demasiado tarde."
 FRA_support_decrease_mission: "Nuestro partido se está dividiendo"
 FRA_support_decrease_mission_desc: "Cuanto más demoramos en tranquilizar a nuestros miembros del partido, más de ellos nos dejarán unirse a grupos que están más cerca de sus ideologías. Debemos rectificar la situación rápidamente."
 FRA_campaign_against_extremism: "Campaña contra el extremismo"
 FRA_campaign_against_extremism_desc: "En estos tiempos difíciles debemos recordar a la izquierda y al centro que los socialistas somos la opción correcta frente al extremismo político que crece."
 FRA_campaign_clash_traitors: "Tomar represalias contra los traidores del Partido"
 FRA_campaign_clash_traitors_desc: "Quien nos abandone por un partido más de moda debe esperar que lo expongamos en los medios. No son más que oportunistas y agentes del caos."
 FRA_boost_eurosceptism: "Campaña contra la Unión Europea"
 FRA_boost_eurosceptism_desc: "Desde los debates públicos hasta los carteles callejeros, toda nuestra sociedad debe rezumar euroescepticismo. Debemos hacer comprender al pueblo francés que los burócratas europeos son la causa de todos nuestros problemas."
 FRA_disobey_treaties: "Quebrantar los tratados europeos"
 FRA_disobey_treaties_desc: "Ya no debemos inclinarnos a estas estúpidas leyes. Somos maestros en nuestra propia casa, y en cualquier caso es sólo cuestión de tiempo antes de salir de la Unión Europea."
 FRA_denounce_eu_policies: "Exponer la política europea"
 FRA_denounce_eu_policies_desc: "Debemos centrar nuestra protesta en las leyes injustas que emanan del Parlamento Europeo sin poder oponernos a ellas. ¿Cuál es el punto de votar en una elección si el resultado ya no depende de nosotros?"
 FRA_threaten_media: "Amenaza a los medios proeuropeos"
 FRA_threaten_media_desc: "El sentimiento proeuropeo se ha infiltrado en nuestras instituciones, hasta los medios. Debemos recordar a estos plumillas que se ciñan a temas más adecuados a su nivel y que dejen de ir a contracorriente."
 FRA_red_benelux: "Libera al Benelux"
 FRA_red_benelux_desc: "Tenemos que liberar al Benelux del capitalismo y el liberalismo europeo"
 FRA_benelux_boost: "Integrar las culturas del Benelux"
 FRA_benelux_boost_desc: "Los trabajadores neerlandeses, flamencos y valones se suman ahora a la revolución como uno solo, con sus fábricas y sindicatos absorbidos por nuestro proyecto socialista."
 FRA_done_with_dumping: "El fin de los paraísos fiscales"
 FRA_done_with_dumping_desc: "La existencia misma de estos países, que dedican su existencia a actuar como paraísos fiscales, es una afrenta al concepto mismo de igualdad y solidaridad. Debemos poner fin a esto."
 FRA_dumping_boost: "Integrar la cultura suiza"
 FRA_dumping_boost_desc: "Hemos roto los cuadros bancarios que sostenían el paraíso fiscal, y la fuerza laboral suiza se está reintegrando en nuestro proyecto económico."
 FRA_red_iberia: "Nunca más Dictator"
 FRA_red_iberia_desc: "Debemos asegurarnos de que nuestro flanco sur no caiga bajo la influencia del fascismo."
 FRA_iberia_boost: "Integrar las Culturas Ibéricas"
 FRA_iberia_boost_desc: "Los movimientos laborales españoles y portugueses finalmente ven la promesa de que 1936 no podía cumplir, uniéndose a nuestra revolución como iguales."
 FRA_ciao_bella: "Ciao Bella"
 FRA_ciao_bella_desc: "La Revolución Comunista fracasó en Italia, pero dejó una impresión duradera sobre el pueblo italiano. Es hora de corregir los errores del pasado."
 FRA_italy_boost: "Integrar la cultura italiana"
 FRA_italy_boost_desc: "El patrimonio de la PCI vive. Completamos el biennio rosso que los trabajadores italianos comenzaron y nunca terminaron."
 FRA_avenge_long_knife: "La noche de las largas sirenas"
 FRA_avenge_long_knife_desc: "Debemos llevar a cabo una revolución en los estados alemanes para liberarlos del capitalismo y evitar que el nacionalismo triunfe de nuevo."
 FRA_ger_aus_boost: "Integrar las culturas germánicas"
 FRA_ger_aus_boost_desc: "Los cuadros industriales de Alemania Oriental y los sindicatos austriacos aportan su disciplina y experiencia a nuestro proyecto revolucionario."
 FRA_ostalgia: "Devolver la revolución a Europa del Este"
 FRA_ostalgia_desc: "Los países de Europa oriental sufrieron grandes sufrimientos bajo la ocupación soviética. Debemos demostrarles que el comunismo también tiene sus buenos puntos."
 FRA_ostalgia_boost: "Integrar las culturas de Europa del Este"
 FRA_ostalgia_boost_desc: "Encauzamos al Ostalgie que todavía se inclina por toda Europa del Este en un entusiasmo genuino por nuestra revolución."
 FRA_birthplace_revolution: "Recuperar la cuna del comunismo"
 FRA_birthplace_revolution_desc: "Debemos traer la revolución de vuelta a los rusos que han olvidado la gloria pasada del comunismo."
 FRA_birthplace_boost: "Integrar las culturas eslavas"
 FRA_birthplace_boost_desc: "Reclamamos el lugar de nacimiento de la revolución, dando la bienvenida a los pueblos rusos y eslavos al movimiento que una vez llevaron."
 FRA_no_more_neutrality: "Romper la neutralidad del norte"
 FRA_no_more_neutrality_desc: "Los países del norte de Europa han evitado durante mucho tiempo elegir entre el socialismo y el capitalismo. Es hora de que tomen esa decisión."
 FRA_neutrality_boost: "Integrar las culturas nórdicas"
 FRA_neutrality_boost_desc: "La socialdemocracia nórdica se convierte por fin; sus trabajadores e instituciones se integran en nuestro proyecto revolucionario más amplio."
 FRA_cold_war2: "No más Guerra Fría"
 FRA_cold_war2_desc: "Vamos a vengar la URSS y el colapso del Pacto de Varsovia destruyendo lo que queda de la OTAN."
 FRA_cold_war_boost: "Integrar las culturas inglesas"
 FRA_cold_war_boost_desc: "¡Los trabajadores del mundo se unen! La tradición laboral de la Anglosfera finalmente encuentra su lugar dentro de nuestra revolución."
 FRA_red_Europe: "Completar la Revolución Europea"
 FRA_red_Europe_desc: "Vamos a llevar la revolución a toda Europa, que todavía está bajo la opresión de los capitalistas."
 FRA_red_victory: "Triunfo de la Revolución Europea"
 FRA_red_victory_desc: "Hemos liberado a los estados europeos de los grilletes del capitalismo. Esta es una gran victoria para la revolución."
 FRA_annex_puppet_napo: "Cumplimiento de nuestras reclamaciones"
 FRA_annex_puppet_napo_desc: "Una de nuestras dependencias tiene un territorio que estamos reclamando. Es hora de que ese territorio nos sea devuelto."
 FRA_reunionism: "Realise Reunionism"
 FRA_reunionism_desc: "Es hora de reunir al pueblo de cultura francesa. Y esta vez, para siempre."
 FRA_Never_another_guerilla: "Asegurar el Suroeste"
 FRA_Never_another_guerilla_desc: "Nos dirigimos hacia el este, así que necesitamos asegurarnos de que nadie venga detrás de nosotros. Esta vez no habrá guerra de guerrillas porque aplastaremos cualquier resistencia."
 FRA_Avenge_Sedan: "Avenge Sedan"
 FRA_Avenge_Sedan_desc: "Fue el auge del Imperio Alemán lo que puso fin al antiguo Imperio Francés. Debemos vengar este ultraje y reclamar nuestras fronteras naturales."
 FRA_natural_border: "Integrar las fronteras naturales"
 FRA_natural_border_desc: "La gente de los territorios conquistados finalmente llegó a aceptar la nueva realidad. El Rin forma la frontera de Francia."
 FRA_crush_coalition: "Central Europe seguro"
 FRA_crush_coalition_desc: "Estos territorios serán cruciales para la larga marcha hacia Moscú que se está preparando actualmente."
 FRA_napoleon_empire: "Integrar el Imperio Napoleónico"
 FRA_napoleon_empire_desc: "La gente de los territorios conquistados finalmente llegó a aceptar la nueva realidad. Ahora son ciudadanos llenos del Tercer Imperio Francés."
 FRA_prepare_russia: "Unificar Europa Oriental"
 FRA_prepare_russia_desc: "Nuestra invasión de Rusia es inminente; debemos asegurar la seguridad de nuestros aliados y prepararlos para un conflicto de alta intensidad con Rusia."
 FRA_2nd_empire_colonies: "Recuperar el Imperio Colonial"
 FRA_2nd_empire_colonies_desc: "Completaremos lo que Napoleón III y la Tercera República comenzaron. Construiremos un imperio colonial estable."
 FRA_no_more_berezina: "Operación Tislit"
 FRA_no_more_berezina_desc: "Ha llegado el momento de destruir el Imperio Ruso de una vez por todas. Esta vez, no tendrán tiempo para quemar Moscú."
 FRA_the_Foe: "Acabar con la pérfida Albión"
 FRA_the_Foe_desc: "Vamos a romper este bloqueo continental de una vez por todas. El enemigo número uno de la Revolución caerá."
 FRA_new_order: "Proclamar el Nuevo Orden Europeo"
 FRA_new_order_desc: "Nuestro dominio sobre el continente está asegurado. Hemos unido Europa bajo nuestro Imperio. Comienza un nuevo capítulo de la historia europea."
 FRA_Expansion_policy: "Elegir nuestra política de expansión"
 FRA_Expansion_policy_desc: "El nuevo Reino Frankish debe establecerse como objetivo de conquista."
 FRA_operation_clovis: "Operación Clovis"
 FRA_operation_clovis_desc: "Reclamaremos la cuna de la civilización franqueza de los llamados estados Benelux."
 FRA_operation_bouvines: "Operación Bouvines"
 FRA_operation_bouvines_desc: "Para que el Imperio Franco llegue a existir, el Sacro Imperio Romano debe caer una vez más."
 FRA_operation_marignan: "Operación Marignan"
 FRA_operation_marignan_desc: "Debemos reconquistar la península italiana. Para recuperar el control de la sede de la Iglesia Católica. Sólo el Papa en Roma será capaz de coronarnos emperador."
 FRA_operation_roland: "Operación Roland"
 FRA_operation_roland_desc: "La retaguardia no volverá a caer."
 FRA_unite_frank_europe: "Unificar al pueblo franco"
 FRA_unite_frank_europe_desc: "Hemos reintegrado a todos los pueblos que, como nosotros, son descendidos de los francos. Este es un gran día para la nación franco."
 FRA_frankish_empire: "Integrar el Imperio Franco"
 FRA_frankish_empire_desc: "El Imperio Frankish ha sido reunificado. Se ha reparado la injusticia del Tratado de Verdún."
 FRA_annex_puppet_king: "Cumplimiento de nuestras reclamaciones"
 FRA_annex_puppet_king_desc: "Una de nuestras dependencias tiene un territorio que estamos reclamando. Es hora de que ese territorio nos sea devuelto."
 FRA_glacis: "Abrirse paso por el glacis"
 FRA_glacis_desc: "Los países del Este están entre nosotros y nuestro destino. Debemos unir a Occidente detrás de nuestra bandera."
 FRA_a_war_for_europe: "La guerra para Europa"
 FRA_a_war_for_europe_desc: "Los poderes de Europa Occidental y Rusia siempre han sido viados para el control de Europa. Es hora de poner fin a esta disputa y unificar a Occidente."
 FRA_operation_hastings: "Operación Hastings"
 FRA_operation_hastings_desc: "Es hora de poner fin a una rivalidad que ha marcado la historia. Te prometo que esta no durará cien años."
 FRA_king_europe_victory: "Proclamar la victoria en Europa"
 FRA_king_europe_victory_desc: "Nuestros enemigos ya no existen. Somos la única potencia europea que sigue en pie. Occidente tendrá que cerrar filas tras nosotros."
 FRA_recover_7_year_war_charlemagne: "Recuperar las colonias del Reino"
 FRA_recover_7_year_war_charlemagne_desc: "Europa está asegurada. Ahora podemos recuperar el control de las colonias que se nos arrebataron."
 FRA_start_crusade: "Asegurar el Mediterráneo"
 FRA_start_crusade_desc: "Para que la cruzada parta hacia Tierra Santa, necesitamos controlar las islas de nuestra ruta. Nuestra cadena de suministro debe estar asegurada."
 FRA_crusade_siege: "Un punto de apoyo en Tierra Santa"
 FRA_crusade_siege_desc: "Reconquistar Tierra Santa lanzando un ataque frontal contra sus ocupantes exigirá comprometer todas nuestras fuerzas. Debemos asegurar que podemos desplegarlas en las inmediaciones."
 FRA_claim_jerusalem: "Reconquistar Tierra Santa"
 FRA_claim_jerusalem_desc: "Ha llegado el momento de recapturar Jerusalén y Tierra Santa. La Décima Cruzada ha alcanzado su objetivo."
 FRA_revenge_over_saladin: "Garantizar la estabilidad en Oriente Medio"
 FRA_revenge_over_saladin_desc: "Debemos estabilizar la región aplastando a cada uno de sus poderes regionales, cuyos conflictos lo desestabilizan."
 FRA_king_crusade1_victory: "Proclamar el triunfo de la Décima Cruzada"
 FRA_king_crusade1_victory_desc: "Hemos recapturado la Tierra Santa."
 FRA_kingdom_heaven: "Proclamar el Reino de Jerusalén"
 FRA_kingdom_heaven_desc: "El Reino de Jerusalén se levantará de nuevo"
 FRA_rally_frank: "Protege a los Franks"
 FRA_rally_frank_desc: "Europa será pronto escenario de una nueva guerra. En estas circunstancias, debemos asegurar que nuestros hermanos francos no sean víctimas de ella."
 FRA_unite_frank: "Reintegrar a los francos"
 FRA_unite_frank_desc: "Hemos reintegrado a todos los pueblos que, como nosotros, son descendidos de los francos. Este es un gran día para la nación franco."
 FRA_noah_ark: "Reunir a las naciones católicas"
 FRA_noah_ark_desc: "Unificaremos las Naciones Católicas de Europa bajo nuestra bandera."
 FRA_war_against_protestantism: "La guerra contra el protestantismo"
 FRA_war_against_protestantism_desc: "Las primeras ocho cruzadas contra los herejes fallaron. No fallaremos una novena vez."
 FRA_end_the_schism: "Sólo puede haber uno"
 FRA_end_the_schism_desc: "Debemos asumir todas las naciones ortodoxas de Europa convirtiéndose en guardianes de Europa. La Iglesia estará a salvo para siempre."
 FRA_king_crusade2_victory: "Proclamar la victoria total de la Iglesia"
 FRA_king_crusade2_victory_desc: "reinamos suprema sobre Europa"
 FRA_recover_7_year_war_holy: "Recuperar las colonias del Reino"
 FRA_recover_7_year_war_holy_desc: "Nuestros enemigos ya no existen. Somos la única potencia europea que sigue en pie. Occidente tendrá que cerrar filas tras nosotros."
 FRA_inst_civ_GER: "Invertir en la economía alemana"
 FRA_inst_civ_GER_desc: "Invertimos directamente en empresas de ingeniería alemanas, fortaleciendo la columna vertebral industrial de nuestro sindicato compartido."
 FRA_inst_civ_GRE: "Invertir en la economía griega"
 FRA_inst_civ_GRE_desc: "La navegación griega sigue siendo el alma de su economía, y nuestra inversión refuerza esta industria marítima vital."
 FRA_inst_civ_ITA: "Invertir en la economía italiana"
 FRA_inst_civ_ITA_desc: "Apoyamos el sector de herramientas de maquinaria de Italia, reforzando la base de ingeniería de precisión en el corazón de su industria."
 FRA_inst_civ_BEL: "Invertir en la economía belga"
 FRA_inst_civ_BEL_desc: "La industria química de Bélgica es el ancla de su economía, y nuestro capital ampliará su capacidad de producción y exportación."
 FRA_inst_civ_SPR: "Invertir en la economía española"
 FRA_inst_civ_SPR_desc: "Invertimos en el sector automotriz español, apoyando las líneas de montaje que emplean a cientos de miles de trabajadores."
 FRA_inst_civ_POL: "Invertir en la economía polaca"
 FRA_inst_civ_POL_desc: "Los astilleros polacos lideraron antaño la construcción naval europea, y nuestra inversión ayudará a restaurar su capacidad industrial."
 FRA_inst_inf_GER: "Invertir en la red de transporte de Alemania"
 FRA_inst_inf_GER_desc: "Financiamos mejoras en el corredor Rhine-Rhone, reduciendo el flujo de mercancías entre nuestras dos economías."
 FRA_inst_inf_GRE: "Invertir en la red de transporte de Grecia"
 FRA_inst_inf_GRE_desc: "La inversión en el corredor Atenas-Tesalónica modernizará la principal arteria de transporte norte-sur de Grecia."
 FRA_inst_inf_ITA: "Invertir en la red de transporte de Italia"
 FRA_inst_inf_ITA_desc: "Apoyamos mejoras en el corredor Brenner, reforzando el vínculo vital entre Italia y Europa del Norte."
 FRA_inst_inf_BEL: "Invertir en la red de transporte de Bélgica"
 FRA_inst_inf_BEL_desc: "Invertimos en el corredor ferroviario del Mar del Norte-Mediterraneo, fortaleciendo la arteria de carga que recorre los puertos de Bélgica."
 FRA_inst_inf_SPR: "Invertir en la red de transporte de España"
 FRA_inst_inf_SPR_desc: "Nuestra inversión en los pasos ferroviarios de los Pirineos por fin enlazará como es debido las redes ibérica y francesa."
 FRA_inst_inf_POL: "Invertir en la red de transporte de Polonia"
 FRA_inst_inf_POL_desc: "Financiamos el corredor Via Baltica, conectando Polonia con la red europea de transporte más amplia por fin."
 FRA_inst_eco_GER: "Invertir en la transición ecológica alemana"
 FRA_inst_eco_GER_desc: "Apoyamos la transición de Alemania lejos de la energía nuclear, financiando la capacidad renovable necesaria para llenar la brecha."
 FRA_inst_eco_GRE: "Invertir en la transición ecológica griega"
 FRA_inst_eco_GRE_desc: "Grecia sigue dependiendo mucho del lignito, y nuestra inversión acelerará su paso hacia fuentes de energía más limpias."
 FRA_inst_eco_ITA: "Invertir en la transición ecológica italiana"
 FRA_inst_eco_ITA_desc: "Italia sigue siendo peligrosamente dependiente del gas importado, y nuestra inversión apoya su diversificación hacia la energía renovable."
 FRA_inst_eco_BEL: "Invertir en la transición ecológica belga"
 FRA_inst_eco_BEL_desc: "Ayudamos a Bélgica a gestionar su propia eliminación nuclear, financiando la capacidad de rejilla necesaria para mantener las luces encendidas."
 FRA_inst_eco_SPR: "Invertir en la transición ecológica española"
 FRA_inst_eco_SPR_desc: "España tiene un enorme potencial solar, y nuestra inversión ayudará a ampliar su capacidad de generación renovable."
 FRA_inst_eco_POL: "Invertir en la transición ecológica polaca"
 FRA_inst_eco_POL_desc: "Polonia sigue dependiendo del carbón para la mayor parte de su energía, y nuestra inversión apoya su transición a una energía más limpia."
