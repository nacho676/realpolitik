 FRA_infrastructure_secured_tt: "§G Infraestructura crítica asegurada contra ataque§!"
 FRA_sentinelle_deployed_tt: "§G7.000 soldados desplegados para la seguridad nacional§!"
 FRA_conducting_raid_tt: "§YConducir operaciones antiterroristas§!"
 FRA_raid_success_tt: "§GRedada exitosa: célula terrorista desarticulada§!"
 FRA_raid_failure_tt: "§RRaid falló: los terroristas escaparon§!"
 FRA_terrorism_defeated_tt: "§GLa amenaza terrorista ha sido derrotada - Francia está a salvo una vez más§!"
 FRA_rebuilding_infrastructure_tt: "§YReconstruir infraestructura dañada§!"
 FRA_infrastructure_rebuilt_tt: "§GSe ha reparado la infraestructura dañada§!"
 FRA_tourism_campaign_tt: "§YLanzamiento de la campaña internacional de recuperación turística§!"
 FRA_tourism_recovered_tt: "§GLa industria del turismo se ha recuperado§!"
 FRA_hostage_rescue_success_tt: "§GEl rescate en el escenario tuvo éxito con bajas mínimas§!"
 FRA_hostage_rescue_casualties_tt: "§YEl rescate tuvo éxito pero con importantes bajas§!"
