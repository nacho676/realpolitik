 FRA_corporate_systems_events.27.b_tt: "Soberanía estratégica: §R-0.8§!\nInfraestructura digital: §G+0.8§!\nDependencia de proveedores chinos: §R+5§!\nSeguirá un evento de autorización 5G."
 FRA_corporate_systems_events.27.c: "Requiere una red de proveedores equilibrada"
 FRA_corporate_systems_events.27.c_tt: "Soberanía estratégica: §G+0.1§!\nIntegración Europea: §G+0.3§!\nInfraestructura digital: §G+0.5§!\nDependencia de los proveedores chinos: §G-1§!\nObtenga un §G5%§! bono de investigación para §YTecnología de Internet§!."
 FRA_corporate_systems_events.27.d: "Orange debe seleccionar a los proveedores para su red móvil de próxima generación. Nokia y Ericsson ofrecen continuidad dentro del ecosistema de telecomunicaciones de Europa, Huawei ofrece despliegue rápido, y una red equilibrada evitaría depender de cualquier proveedor."
 FRA_corporate_systems_events.27.t: "¿Quién construye la red 5G de Francia?"
 FRA_corporate_systems_events.28.a: "Restringir las autorizaciones de Huawei"
 FRA_corporate_systems_events.28.a_tt: "Soberanía estratégica: §G+0.6§!\nIntegración Europea: §G+0.3§!\nDependencia de los proveedores chinos: §G-3§!\nGanancia §Y5G Vendor Replacement Burden§! por §Y730 días§!."
 FRA_corporate_systems_events.28.b: "Permitir el despliegue a largo plazo"
 FRA_corporate_systems_events.28.b_tt: "Soberanía estratégica: §R-0.5§!\nInfraestructura digital: §G+0.4§!\nDependencia de proveedores chinos: §R+2§!"
 FRA_corporate_systems_events.28.c: "Exigir una rápida diversificación de los proveedores"
 FRA_corporate_systems_events.28.c_tt: "Poder político: §R-75§!\nSoberanía estratégica: §G+0.8§!\nCapacidad de telecomunicaciones: §G+0.5§!\nDependencia de los proveedores chinos: §G-4§!\n§Y5G Vendor Replacement Burden§! for §Y548 days§!."
 FRA_corporate_systems_events.28.d: "Las autoridades de seguridad francesas están reconsiderando las autorizaciones a largo plazo para el equipo de Huawei como el producto de salida 5G. Los despliegues existentes podrían requerir ahora un reemplazo costoso a menos que el gobierno acepte una dependencia más profunda y duradera."
