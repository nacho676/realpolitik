 FRA_alstom_manufacturer: "Alstom"
 FRA_alstom_manufacturer_desc: "Renombrado de GEC Alsthom en su lista de París de 1998, Alstom construye las locomotoras de Francia, los trenes de alta velocidad, metros, tranvías y señalización ferroviaria. Un rescate estatal en 2004 y la venta del negocio de energía a General Electric en 2015 le dejó una empresa ferroviaria pura; la compra 2021 de Bombardier Transport lo convirtió en el mayor fabricante de material rodante fuera de China."
 FRA_alstom_manufacturer_trait: "Stock Industrial Base"
 FRA_alstom_manufacturer_trait_desc: "Belfort, La Rochelle, Reichshoffen, Crespin, Le Creusot y Ornans forman una cadena completa de suministro ferroviario dentro de Francia, cubriendo tracción, bodyshells, bogies, montaje final y señalización sin contenido extranjero."
 FRA_alstom_branch_high_speed: "Programa de alto nivel"
 FRA_alstom_branch_urban_transit: "Transit urbano"
 FRA_alstom_branch_freight_logistics: "Flete de logística &"
 FRA_alstom_tgv_duplex: "TGV Duplex"
 FRA_alstom_tgv_duplex_desc: "El Dúplex TGV de doble cubierta entró en servicio en 1996 y se convirtió en el set estándar de alta velocidad en el eje saturado de París-Lyon, que transportaba 40 por ciento más pasajeros por tren sin alargar las plataformas."
 FRA_alstom_belfort_power_cars: "Carros de potencia Belfort"
 FRA_alstom_belfort_power_cars_desc: "Las obras de Belfort construyen las cabezas de tracción para cada conjunto francés de alta velocidad. Desde el contrato de Avelia Horizon se obtiene tres cuartas partes de su carga de trabajo de un solo programa, que concentra coste y riesgo en una sola sala."
 FRA_alstom_avelia_horizon: "El horizonte Avelia"
 FRA_alstom_avelia_horizon_desc: "La quinta generación TGV ordenada por SNCF en 2018 mantiene el diseño de doble cubierta pero acorta los coches eléctricos, agregando un veinte por ciento de capacidad a un costo más bajo por asiento y un 20 por ciento reclamado en uso energético."
 FRA_alstom_avelia_liberty: "Libertad de Avelia"
 FRA_alstom_avelia_liberty_desc: "La variante de inclinación construida para el Corredor Nordeste de Amtrak fue la primera exportación de alta velocidad de Alstom a los Estados Unidos. Los retrasos en la certificación resultaron costosos, pero el orden estableció un punto de arrastre en un mercado previamente cerrado al material rodante francés."
 FRA_alstom_la_rochelle_assembly: "El montaje de La Rochelle"
 FRA_alstom_la_rochelle_assembly_desc: "La planta de La Rochelle monta coches de pasajeros para la familia Avelia y diseña el tranvía Citadis. Es el mayor patrón de ferrocarril único en la costa atlántica y el sitio donde se prueban nuevas técnicas de musculación antes de transferirse a las otras obras."
 FRA_alstom_citadis_tramway: "Citadis Tramway"
 FRA_alstom_citadis_tramway_desc: "Lanzado en 2000, el Citadis modular de baja planta se convirtió en el tranvía europeo predeterminado, vendido a más de sesenta ciudades. Sus módulos estandarizados permiten que una red sea especificada y entregada sin un programa de diseño a medida."
 FRA_alstom_metropolis_metro: "Metropolis Metro"
 FRA_alstom_metropolis_metro_desc: "La familia Metrópolis cubre las existencias de metro sin conductor y convencionales en una plataforma común, tamaño desde transbordadores ligeros automatizados hasta conjuntos de línea de ocho coches. La producción de volumen mantiene el costo unitario por debajo del de los diseños nacionales a medida."
 FRA_alstom_urbalis_cbtc: "Urbalis CBTC"
 FRA_alstom_urbalis_cbtc_desc: "Urbalis es el sistema de control de trenes basado en comunicaciones de Alstom, lo que permite un funcionamiento sin conductor y pasarelas bajo noventa segundos. Desarrollado en Crespin y Villeurbanne, es la capa de señalización debajo de la mayoría de los contratos automatizados de metro de la compañía."
 FRA_alstom_innovia_automated_transit: "Transit Automatizado Innovia"
 FRA_alstom_innovia_automated_transit_desc: "Innovia automatizó a personas de mudanza, heredada de Bombardier, vincula terminales de aeropuertos y distritos urbanos densos. Sus pareados cortos y guía fija lo convierten en la forma más barata de añadir capacidad de velo fijo a un sitio existente."
 FRA_alstom_grand_paris_express: "Grand Paris Express"
 FRA_alstom_grand_paris_express_desc: "El mayor proyecto de transporte en Europa añade cuatro líneas automatizadas de metro y doscientos kilómetros de pista alrededor de París. Alstom suministra el material rodante y la señalización, y el programa pone en marcha su capacidad de tránsito urbano durante un decenio."
 FRA_alstom_prima_locomotives: "Prima Locomotives"
 FRA_alstom_prima_locomotives_desc: "La familia Prima de locomotoras de carga eléctrica y diesel, construida en Belfort a partir del 2001, sustituyó la flota SNCF envejecida y fue exportada a Marruecos, Siria y China. Es el caballo de trabajo detrás del transporte ferroviario francés y el movimiento militar de ferrocarril por igual."
 FRA_alstom_prima_h4_hybrid: "Prima H4 Hybrid"
 FRA_alstom_prima_h4_hybrid_desc: "La locomotora H4 combina los gensets diesel con un paquete de batería, cortando la quemadura de combustible en las operaciones de patio alrededor de la mitad y permitiendo el movimiento silencioso dentro de depósitos y patios de mariscalización."
 FRA_alstom_atlas_ertms: "Atlas ERTMS"
 FRA_alstom_atlas_ertms_desc: "Atlas es la implementación de Alstom del Sistema Europeo de Gestión del Tráfico Rail, reemplazando la señalización nacional incompatible con un único estándar continental. En Crespin se fabrican equipos de tren y pista."
 FRA_alstom_coradia_ilint: "Coradia iLint"
 FRA_alstom_coradia_ilint_desc: "El primer tren regional de pilas de hidrógeno entró en servicio comercial en 2018, ejecutando líneas de rama no electrificadas con agua como la única emisión. Elimina la necesidad de encadenar el catenario sobre las rutas que nunca podrían justificar el costo del capital."
 FRA_alstom_bombardier_transportation: "Transporte bombardero"
 FRA_alstom_bombardier_transportation_desc: "Completado en enero de 2021 después de que la Comisión Europea bloqueara una fusión con Siemens Mobility, la adquisición de Bombardier Transport dobló las plantas y el libro de pedidos de Alstom y lo convirtió en el segundo fabricante de ferrocarriles más grande del mundo."
 FRA_crusade_time: "Reclamar nuestra finca"
 FRA_crusade_time_desc: "Ya sea para reclamar la tierra de nuestros antepasados francos o para recuperar la Tierra Santa, en cualquier caso tendremos que enfrentarnos a los poderes de Europa y Oriente Medio. Es hora de que vayamos a la guerra."
 FRA_vigipirate_surveillance: "El Plan Vigipirato"
 FRA_vigipirate_surveillance_desc: "Para proteger a nuestros ciudadanos de posibles ataques terroristas, necesitamos ser más cautelosos e intrusos."