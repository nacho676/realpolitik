 FRA_corporate_systems_events.21.c_tt: "Francia Télécom/Orange Health: §R-0.5§!\nPresión de la deuda corporativa: §G-0.2§!"
 FRA_corporate_systems_events.21.d: "La rápida expansión internacional de Francia Télécom ha culminado en una grave exposición financiera alrededor del MobilCom. La empresa debe resolver las obligaciones, buscar un puente estatal o arriesgar una disputa prolongada."
