 FRA_corporate_systems_events.7.a_tt: "Soberanía estratégica: §G+0.4§!\nIntegración Europea: §G+0.4§!\nGanar uno §G10%§! bono de investigación para §YTecnología de Internet§!.\nObtenga un §G5%§! bono de investigación para §YComandante y Equipo de Control§!."
 FRA_corporate_systems_events.7.b: "Permitir una integración restringida"
 FRA_corporate_systems_events.7.b_tt: "Soberanía estratégica: §R-0.3§!\nSalud de Alcatel: §G+0.4§!"
 FRA_corporate_systems_events.7.c: "Busca un control francés excepcional"
 FRA_corporate_systems_events.7.c_tt: "Soberanía estratégica: §G+0.6§!\nIntegración Europea: §R-0.5§!\nSalud de Alcatel: §R-0.3§!"
 FRA_corporate_systems_events.7.d: "Nokia ahora controla Alcatel-Lucent, llevando al antiguo campeón francés a un grupo de red europeo más grande. Francia debe determinar con qué firmeza cumplir los compromisos en materia de investigación, empleo y capacidad estratégica."
 FRA_corporate_systems_events.7.t: "Un Pilar francés dentro de Nokia"
 FRA_corporate_systems_mobilcom_settlement_burden: "Carga de liquidación MobilCom"
 FRA_corporate_systems_mobilcom_settlement_burden_desc: "Francia Télécom ha reconocido las principales obligaciones relacionadas con el MobilCom y su rápida expansión. El acuerdo reduce la incertidumbre, pero la financiación limita la inversión."
 FRA_corporate_systems_shift_plan_restructuring: "Reestructuración del Plan de Cambio"
 FRA_corporate_systems_shift_plan_restructuring_desc: "Alcatel-Lucent se está concentrando en redes IP, sistemas de nube y infraestructura de banda ultra amplia al tiempo que corta los costos y vende activos complementarios. La transición limita temporalmente la producción a medida que la empresa reconstruye su cartera de tecnología."
 FRA_corporate_systems_telecom_crash_restructuring: "Reestructuración de Crash Telecom"
 FRA_corporate_systems_telecom_crash_restructuring_desc: "Alcatel está cerrando las instalaciones y la capacidad de cocción después del colapso del mercado de equipos de telecomunicaciones. Las medidas facilitan su presión a largo plazo en materia de balance, pero interrumpen la producción industrial y el empleo a corto plazo."
 FRA_corporate_systems_vendor_replacement_burden: "5G Carga de sustitución del vendedor"
 FRA_corporate_systems_vendor_replacement_burden_desc: "Las restricciones a las autorizaciones de Huawei están obligando a los operadores a reemplazar el equipo instalado y volver a trabajar planes de despliegue. La transición fortalece el control a largo plazo sobre las redes críticas pero retrasa la puesta en marcha."
 FRA_corporate_systems_wireless_exit_costs: "Costes de salida de ST-Ericsson"
 FRA_corporate_systems_wireless_exit_costs_desc: "La disolución de ST-Ericsson requiere cargos por deterioro, transferencias de empleados y una costosa división de tecnología y activos. La salida elimina un drenaje a largo plazo pero interrumpe la investigación inalámbrica a corto plazo."
