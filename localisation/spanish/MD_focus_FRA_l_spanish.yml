 france_md.600.t: "El Chip Business Alcatel No Longer Wants"
 france_md.600.d: "La burbuja de telecomunicaciones ha estallado y Alcatel está vendiendo todo lo que no es una red. Su división microelectrónica es rentable, competente y a punto de pertenecer a otra persona. Mantenerlo francés costaría el dinero real del Tesoro para resolver un problema que el mercado no cree que tenga."
 france_md.600.a: "Mantener el brazo microelectrónico en manos francesas"
 france_md.600.b: "Déjalo ir a un comprador europeo"
 france_md.601.t: "El Muro de Crédito"
 france_md.601.d: "Francia Telecom debe más de lo que cualquier empresa ha adeudado, las adquisiciones que construyeron la deuda valen una fracción de lo que se pagó, y los bancos no volverán a enrollarla. El estado puede poner dinero público en una empresa listada, o puede permitir que los acreedores decidan lo que se convierte en el operador nacional."
 france_md.601.a: "Recapitalizar el operador con dinero público"
 france_md.601.b: "Que los acreedores lo reestructuran"
 france_md.602.t: "El Estado pierde su mayoría"
 france_md.602.d: "Vender la tenencia del estado en Francia Telecom por debajo del cincuenta por ciento aumentaría una gran cantidad de dinero y terminaría el argumento en Bruselas sobre un titular de propiedad estatal compitiendo en un mercado abierto. También significaría que la próxima decisión sobre la red telefónica de Francia es tomada por los accionistas."
 france_md.602.a: "Mantenga la mayoría del estado"
 france_md.602.b: "Vender por debajo del cincuenta por ciento"
 france_md.603.t: "After Crolles2"
 france_md.603.d: "La alianza compartida en Crolles dio a tres empresas un proceso de vanguardia que ninguno de ellos podría haber dado solos, y dos de ellos ahora se van. Financiar el reemplazo significa que el estado que lleva un programa de investigación que sus socios se alejaron. Refusing significa que una empresa francesa desarrolla el nodo por sí misma, o deja de intentarlo."
 france_md.603.a: "Fondo lo que sustituye a la alianza"
 france_md.603.b: "Que el campeón nacional lo lleve solo"
 france_md.604.t: "Unwinding ST-Ericsson"
 france_md.604.d: "ST-Ericsson, la empresa conjunta STMicroelectronics construida con Ericsson para ser el campeón inalámbrico de Europa, ha perdido dinero cada cuarto de su existencia, y los fabricantes de teléfonos fue construido para servir ahora diseñar su propio silicio. Rescatarlo compraría tiempo para un negocio cuyo mercado ya se ha movido. Desbloquear escribe el último intento europeo serio en un chipset móvil."
 france_md.604.a: "Rescate de la empresa inalámbrica"
 france_md.604.b: "Desbloquearla y tomar las pérdidas"
 france_md.605.t: "La microelectrónica IPCEI"
 france_md.605.d: "Bruselas permitirá lo que una vez prohibió: dinero público, a escala, para capacidad semiconductora. Los cultivos podrían ampliarse en algo que importa al continente en lugar de a una empresa. Es una carrera de subsidios que Francia no comenzó y no puede ganar solo, y la alternativa no está compitiendo en ella."
 france_md.605.a: "Fondo de la expansión Crolles"
 france_md.605.b: "Capacidad de licencia para el mercado"
 france_md.606.t: "Lo que la República Kept"
 france_md.606.d: "Un cuarto siglo de rescates, ventas, alianzas y subsidios ha resuelto lo que se convirtió en Alcatel, France Telecom y STMicroelectronics: qué partes de la red telefónica francesa y la industria semiconductora todavía posee el estado, y que simplemente acoge."
 france_md.606.a: "Un campeón de la República todavía posee"
 france_md.606.b: "Una base de silicio construida con dinero público"
 france_md.606.c: "Un operador el estado una vez rescatado"
 france_md.606.e: "Un mercado como cualquier otro"
 FRA_cs_nationalised_systems_champion: "Campeón de Sistemas Nacionalizados"
 FRA_cs_nationalised_systems_champion_desc: "El estado nunca dejó ir a la mayoría, por lo que la red y la industria alrededor de ella responden a París antes de responder a un precio compartido. Cuesta al Tesoro lo que una estaca controladora siempre cuesta, y compra decisiones que permanecen en el país."
 FRA_cs_state_backed_silicon_base: "Base de silicona respaldada por el Estado"
 FRA_cs_state_backed_silicon_base_desc: "El dinero público construyó la capacidad de fabricación que ninguna empresa francesa habría financiado por sí misma, y los wafers se hacen en Francia. La subvención es permanente porque la capacidad es, y ambos son ahora hechos sobre el terreno en lugar de argumentos."
 FRA_cs_recapitalised_national_operator: "Operador Nacional Recapitalizado"
 FRA_cs_recapitalised_national_operator_desc: "El estado puso su dinero cuando nadie más lo haría y el operador sobrevivió a una deuda que ninguna empresa debería haber llevado. Fue un rescate en lugar de una estructura, y los rescates no duran."
 FRA_cs_market_like_any_other: "Un mercado como cualquier otro"
 FRA_cs_market_like_any_other_desc: "Los campeones fueron vendidos, fusionados o heridos en términos comerciales ordinarios, y Francia compra sus redes y sus fichas de quien los vende mejor. Es eficiente, es ortodoxo, y nada estratégico se decide aquí más."
 france_md.554.t: "Francia propone ejercicios militares conjuntos"
 france_md.554.d: "Los diplomáticos franceses nos han enviado una propuesta de formación militar conjunta. De hecho, el reciente aumento de las tensiones internacionales nos alienta a unirnos entre los Estados europeos para prepararnos para lo peor. Esta podría ser una iniciativa muy buena para capacitar a nuestras fuerzas armadas por los conflictos de alta intensidad que podrían estallar en cualquier momento. ¿Qué deberíamos decirles?"
 france_md.554.a: "Con mucho gusto, entrenaremos junto a ellos"
 france_md.554.b: "No gracias, no necesitamos su ayuda."
 france_md.359.t: "Los monárquicos aprovechan el poder en Francia"
 france_md.359.d: "Notas de [FRA.GetNameWithFlag]: las facciones extremistas dentro del partido gobernante han tomado el control y abolido la Quinta República. La dirección moderada ha sido marginada a medida que los radicales restablecen la regla monarquista. Este dramático golpe contra la democracia ha impactado al mundo. ¿Cómo debemos responder?"
 france_md.359.a: "Condena esta toma de posesión extremista"
 france_md.359.b: "Este es un asunto francés interno."
 FRA_country_chaos: "Alarming Rumours"
 FRA_country_chaos_desc: "Una ola de pánico ha barrido por todo el país. Los rumores circulan sobre depósitos de armas saqueados y deserciones masivas. Algo está preparando..."
 FRA_too_stable_tt: "§YEstabilidad por debajo del 25%§! otorga el aumento máximo de popularidad del partido"
 FRA_too_europhile_tt: "§YEl europeo inferior al 50%§! otorga el aumento máximo de popularidad del partido"
 FRA_napoleon_army_reform_tt: "Grandes reformas del Armée completadas: §Y[?FRA_grande_armee_reforms_completed|0]/3§!"
 FRA_6threp_tt: "En los próximos eventos, usted redactará una constitución, que puede o no terminar con al final del proceso. No olvides apurarte antes de que la emoción muera."
 FRA_cfa_franc_user_exists_tt: "Al menos una nación todavía utiliza el franco §YCFA§!"
 FRA_eco_candidate_exists_tt: "Al menos una nación todavía usa §YCFA Franc§! o el §YCFA Franc (África Central)§!"
 FRA_corporate_systems_ambition_ft_restructuring: "Ambición FT 2005 Reestructuración"
 FRA_corporate_systems_ambition_ft_restructuring_desc: "La recapitalización, la inmersión y las reformas operativas están reparando el balance de Francia Télécom. La inversión en redes sigue siendo limitada mientras el grupo restablece la corriente de efectivo."
 FRA_corporate_systems_french_national_champions: "Campeones nacionales franceses"
 FRA_corporate_systems_french_national_champions_desc: "Francia ha mantenido a empresas críticas, sitios de investigación e infraestructura bajo fuerte dirección nacional. La soberanía y la resiliencia son elevadas, pero el modelo exige un apoyo público sostenido y acepta menos integración extranjera."
 FRA_corporate_systems_china_connected_infrastructure: "Infraestructura configurada por China"
 FRA_corporate_systems_china_connected_infrastructure_desc: "Los proveedores chinos se han convertido en el centro de la modernización de la red de Francia. El despliegue rápido y los vínculos comerciales más estrechos vienen con una dependencia duradera de la infraestructura crítica y mayores riesgos de sustitución."
 FRA_corporate_systems_resilient_multivendor_network: "Red Multivendor resistente"
 FRA_corporate_systems_resilient_multivendor_network_desc: "Francia ha distribuido las adquisiciones de redes críticas en varios proveedores y ha preservado la capacidad de reemplazar a cualquiera de ellos. El resultado es menos concentrado y más resistente, aunque la coordinación y el despliegue son más lentos."
 FRA_corporate_systems_events.1.a: "Restructure aggressively"
 FRA_corporate_systems_events.1.a_tt: "Salud de Alcatel: §G+0.8§!\nPresión de la deuda corporativa: §G-0.6§!\nEstabilidad: §R-1.0%§!\nGanancia §YTelecom Crash Restructuring§! por §Y730 días§!.\nObtenga un §G5%§! bono de investigación para §YTecnología de Internet§!."
 FRA_corporate_systems_events.1.b: "Protect strategic R&D"
 FRA_corporate_systems_events.1.b_tt: "Poder político: §R-75§!\nSoberanía estratégica: §G+0.4§!\nSalud de Alcatel: §G+0.6§!\nObtenga un §G5%§! bono de investigación para §YCommand and Control Equipment§!."
 FRA_corporate_systems_events.1.c: "Mantenga la línea"
 FRA_corporate_systems_events.1.c_tt: "Salud de Alcatel: §R-1.0§!\nPresión de la deuda corporativa: §R+0.8§!\nEstabilidad: §G+0.5%§!"
 FRA_corporate_systems_events.1.d: "El colapso del boom del equipo de telecomunicaciones ha dejado a Alcatel con órdenes caídas, exceso de capacidad y pérdidas crecientes. La empresa debe decidir qué conservar a medida que reestructura."
 FRA_corporate_systems_events.1.t: "La burbuja de Telecom se rompe"
 FRA_corporate_systems_events.10.a: "Adquirir todo el negocio"
 FRA_corporate_systems_events.10.a_tt: "Soberanía estratégica: §G+0.2§!\nCapacidad semiconductora: §G+0.4§!\nSTMicroelectronics Health: §G+0.5§!\nGana uno §G10%§! bonificación de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.10.b: "Adquirir IP y activos estratégicos"
 FRA_corporate_systems_events.10.b_tt: "Capacidad semiconductora: §G+0.2§!\nSTSalud microelectrónica: §G+0.3§!\nObtenga un §G5%§! bono de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.10.c: "Declinar la adquisición"
 FRA_corporate_systems_events.10.c_tt: "STMicroelectronics Health: §G+0.2§!"
 FRA_corporate_systems_events.10.d: "La reestructuración de Alcatel ha puesto en cuestión el futuro de sus activos microelectrónicos. STMicroelectronics puede perseguir todo el negocio, apuntar sólo la tecnología estratégica, o preservar el capital para otras prioridades."
 FRA_corporate_systems_events.10.t: "Alcatel Microelectrónica Está en venta"
 FRA_corporate_systems_events.11.a: "Ampliar la alianza multinacional R&D"
 FRA_corporate_systems_events.11.a_tt: "Soberanía estratégica: §R-0.1§!\nCapacidad semiconductora: §G+0.6§!\nGanar 2 §G10%§! bonos de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.11.b: "Construir un programa dirigido por Francia"
 FRA_corporate_systems_events.11.b_tt: "Poder político: §R-75§!\nSoberanía estratégica: §G+0.5§!\nCapacidad semiconductora: §G+0.4§!\nGana uno §G10%§! bonificación de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.11.c: "Limite nuestra exposición al capital"
 FRA_corporate_systems_events.11.c_tt: "Capacidad semiconductora: §G+0.1§!\nSTSalud microelectrónica: §G+0.2§!"
 FRA_corporate_systems_events.11.d: "Motorola está listo para unirse a STMicroelectronics y Philips en Crolles2, ampliando la alianza alrededor del desarrollo avanzado del proceso. Una mayor escala distribuiría los costos y la experiencia, pero también diluiría el control puramente francés."
 FRA_corporate_systems_events.11.t: "La Alianza Crolles2 se expande"
 FRA_corporate_systems_events.13.a: "Consolidar inalámbrico con NXP"
 FRA_corporate_systems_events.13.a_tt: "Capacidad semiconductora: §G+0.5§!\nSTSalud microelectrónica: §G+0.2§!\nPresión de la deuda corporativa: §R+0.3§!\nGana uno §G10%§! bonificación de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.13.b: "Mantenga ST inalámbrica independiente"
 FRA_corporate_systems_events.13.b_tt: "Soberanía estratégica: §G+0.3§!\nSTSalud microelectrónica: §R-0.1§!\nObtenga un §G5%§! bono de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.13.c: "Divest exposición inalámbrica"
 FRA_corporate_systems_events.13.c_tt: "Capacidad semiconductora: §R-0.6§!\nSTSalud microelectrónica: §G+0.4§!"
 FRA_corporate_systems_events.13.d: "STMicroelectronics y NXP han acordado combinar sus actividades semiconductoras inalámbricas. La empresa ofrece mayor escala en chips móviles, pero concentrar dos empresas difíciles conlleva un riesgo de ejecución sustancial."
 FRA_corporate_systems_events.13.t: "ST-NXP Wireless"
 FRA_corporate_systems_events.14.a: "Formar ST-Ericsson"
 FRA_corporate_systems_events.14.a_tt: "Integración Europea: §G+0.5§!\nCapacidad semiconductora: §G+0.6§!\nPresión de la deuda corporativa: §R+0.7§!\nGana 2 §G10%§! bonos de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.14.b: "Obligación de límites financieros más estrictos"
 FRA_corporate_systems_events.14.b_tt: "Integración Europea: §G+0.5§!\nCapacidad semiconductora: §G+0.4§!\nPresión de la deuda corporativa: §R+0.3§!\nGana uno §G10%§! bono de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.14.c: "Mantenerse independiente"
 FRA_corporate_systems_events.14.c_tt: "Soberanía estratégica: §G+0.4§!\nIntegración Europea: §R-0.2§!\nCapacidad semiconductora: §R-0.3§!"
 FRA_corporate_systems_events.14.d: "Ericsson Mobile Platforms podría unirse a ST-NXP Wireless en una nueva empresa conjunta europea. Combinar el módem, la radio y la experiencia del procesador de aplicaciones promete profundidad tecnológica, aunque el negocio ampliado podría consumir capital sustancial."
 FRA_corporate_systems_events.14.t: "Un Campeón Inalámbrica Europeo"
 FRA_corporate_systems_events.16.a: "Realizar una salida ordenada"
 FRA_corporate_systems_events.16.a_tt: "Capacidad semiconductora: §R-0.5§!\nSTSalud microelectrónica: §G+0.8§!\nPresión de la deuda corporativa: §G-1.0§!\nEstabilidad: §R-0.5%§!\n§YST-Ericsson Exit Costs§! for §Y730 days§!."
 FRA_corporate_systems_events.16.b: "Tecnología y personal de Absorb"
 FRA_corporate_systems_events.16.b_tt: "Poder político: §R-75§!\nSoberanía estratégica: §G+0.4§!\nCapacidad semiconductora: §R-0.2§!\nSTMicroelectronics Health: §G+0.3§!\nObtenga un §G5%§! bono de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.16.c: "Continuar financiando la empresa"
 FRA_corporate_systems_events.16.c_tt: "Capacidad semiconductora: §G+0.3§!\nSTSalud microelectrónica: §R-0.7§!\nPresión de la deuda corporativa: §R+1.2§!"
 FRA_corporate_systems_events.16.d: "Las persistentes pérdidas de ST-Ericsson han agotado la paciencia de sus propietarios. Francia debe decidir cuánto tecnología, personal y riesgo financiero STMicroelectronics debe llevar a cabo la empresa fallida."
 FRA_corporate_systems_events.16.t: "Unwinding ST-Ericsson"
 FRA_corporate_systems_events.17.a: "Ancla Francia en la IPCEI"
 FRA_corporate_systems_events.17.a_military: "Electrónica militar IPCEI"
 FRA_corporate_systems_events.17.a_tt: "Soberanía estratégica: §G+0.6§!\nIntegración Europea: §G+1.0§!\nCapacidad semiconductora: §G+0.8§!\nGana 2 §G10%§! bonos de investigación para §YMicrochip Technology§!.\nObtenga un §G5%§! bonificación de investigación para §YComandante y Equipo de Control§!."
 FRA_corporate_systems_events.17.b: "Realizar un programa Francia-primer"
 FRA_corporate_systems_events.17.b_tt: "Poder político: §R-125§!\nSoberanía estratégica: §G+0.9§!\nIntegración Europea: §R-0.5§!\nCapacidad de semiconductor: §G+0.6§!\nObtenga uno §G10%§! bono de investigación para §YMicrochip Technology§!."
 FRA_corporate_systems_events.17.c: "Dejar la inversión en el mercado"
 FRA_corporate_systems_events.17.c_tt: "Capacidad semiconductora: §R-0.2§!\nSTSalud microelectrónica: §G+0.2§!"
 FRA_corporate_systems_events.17.d: "Cinco estados europeos han aprobado un proyecto microelectrónico común que abarca chips de eficiencia energética, semiconductores de potencia, sensores, sistemas ópticos y materiales avanzados. STMicroelectronics puede anclar Francia en el programa o seguir un camino más nacional."
 FRA_corporate_systems_events.17.t: "European Microelectronics IPCEI"
 FRA_corporate_systems_events.20.a: "Adquire Naranja e internacionalizar"
 FRA_corporate_systems_events.20.a_tt: "Infraestructura digital: §G+0.8§!\nFrancia Télécom/Orange Health: §G+0.8§!\nPresión de la deuda corporativa: §R+1.2§!\nObtenga un §G5%§! bono de investigación para §YComputing Technology§!."
 FRA_corporate_systems_events.20.b: "Realizar una estrategia móvil más pequeña"
