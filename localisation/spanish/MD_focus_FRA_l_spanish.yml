 FRA_corporate_systems_events.20.d: "Francia Télécom ha acordado adquirir Orange y su red móvil internacional. La compra podría transformar al operador público en un grupo mundial de telecomunicaciones, pero el precio colocará una fuerte presión sobre su balance."
