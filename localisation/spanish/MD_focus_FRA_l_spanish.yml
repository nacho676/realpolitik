l_spanish:
 france_focus: "Árbol de Enfoque de Francia"
 FRA_state_of_french_politics: "Estado de la Política Francesa"
 FRA_state_of_french_politics_desc: "Francia ocupa una de las posiciones políticas más interesantes y volátiles del mundo. Durante mucho tiempo, nuestra Quinta República fue un modelo de estabilidad, con poder alternando entre un bloque socialista y un bloque conservador. Pero a medida que avanzamos hacia este nuevo milenio, la situación se está volviendo cada vez más clara. Algunas partes están surgiendo mientras que otras están colapsando; nadie puede decir dónde nos llevarán los próximos años."
 FRA_nationalism_in_europe: "El auge del nacionalismo"
 FRA_nationalism_in_europe_desc: "Parece que la victoria de los bonapartistas en Francia alienta a los nacionalistas de todos nuestros países europeos a involucrarse cada vez más en política. Si bien este impulso nos permite soportar mejor un conflicto con un país extranjero, las acciones de estos agitadores en tiempo de paz son un problema real."
 FRA_economic_policy: "La agenda de Bercy"
 FRA_economic_policy_desc: "Bercy ordena la Dirección del Tesoro y los estadísticos del INSEE, y cada ministerio que gasta un franco responde al mismo final. Francia ocupa el quinto lugar entre las economías del mundo, un rango mantenido por la política más que por su tamaño."
 FRA_free_market: "En el Mercado Único"
 FRA_free_market_desc: "El mercado único ha sacado los precios de las manos del ministerio y ha dejado a nuestros exportadores para competir en sus propios términos. Francia Telecom y Air France ya han pasado a ser propietarios privados. Lo que queda es abrir el resto y dejar que el comercio venga a nosotros."
 FRA_total_sa: "Total SA"
 FRA_total_sa_desc: "Total ha tragado Petrofina y Elf Aquitaine para convertirse en uno de los mayores productores de la tierra, sosteniendo el campo de gas Lacq y los pozos Parentis con la ingeniería ejecutada fuera del centro CSTJF en Pau. Aquitania todavía tiene más de lo que los mayores se han molestado en levantar. Una asociación en los términos de la República haría que ese petróleo funcione para nosotros."
 FRA_french_economic_intervention: "Dirigisme"
 FRA_french_economic_intervention_desc: "Colbert estableció el patrón: el estado elige las industrias que importan y construye los campeones para dirigirlas. El comisariado de planificación redacta la dirección y los ministerios tienen el crédito. Las plantas ya de pie serán empujadas más duro, lo que sea que haga a la cola de permiso para las nuevas."
 FRA_reduction_in_taxes: "Cortando la Profesión Fiscal"
 FRA_reduction_in_taxes_desc: "El taxe professionnelle cae en maquinaria y locales, que es decir exactamente sobre la inversión que pretendemos desear. Añade las contribuciones sociales y Francia lleva una de las cargas más pesadas de los impuestos obligatorios en Europa. Cortarla debe dejar algo en las latas y los paquetes de pago."
 FRA_deregulation: "La Comisión Attali"
 FRA_deregulation_desc: "La Comisión para la Liberación del Crecimiento Francés, presidida por Jacques Attali, ha establecido donde las reglas se unen más duramente: zonificación comercial, profesiones protegidas, permisos que llevan años. Levantarlos abre terreno para el desarrollo en las regiones que los planificadores habían escrito. Los sindicatos leerán cada línea de ella como una amenaza."
 FRA_state_stock_in_sa: "El Dorado Compartir"
 FRA_state_stock_in_sa_desc: "Una acción dorada y la equidad que se realiza a través de la Agence des Participations de l'Etat dan a la República un voto que ninguna reunión de accionistas puede superar en número. Salidas, contratos de exportación y el precio en la bomba todo cruza un escritorio que controlamos."
 FRA_paris_employment_projects: "El Grand Paris Works"
 FRA_paris_employment_projects_desc: "Seine-Saint-Denis nunca ha recuperado el trabajo que perdió, mientras las torres de La Defensa levantan unas pocas estaciones en la línea. Las obras del Gran París pueden poner la diferencia a utilizar: sitios, contratos y nóminas dentro del Ile-de-France."
 FRA_nationalization_of_steel: "Reclaiming Usinor"
 FRA_nationalization_of_steel_desc: "Usinor-Sacilor posee la cuenca Lorena y las obras de Fos-sur-Mer y Florange, y responde a sus accionistas en lugar de a la República. El acero deja de ser una mercancía en el momento en que los astilleros y las plantas del tanque dependen de ella. Llevar los molinos a manos del estado encantará a los sindicatos y enfurecer las salas de juntas."
 FRA_private_contracting: "Contratación de los Grandes"
 FRA_private_contracting_desc: "Bouygues, Vinci y Eiffage ofrecerán contratos de asociación donde el contratista establece el precio y mantiene el margen. Los sitios terminan más rápido de lo que cualquier ministerio podría manejarlos, y pagamos la prima por ello."
 FRA_tapping_resources: "Brignoles y Salau"
 FRA_tapping_resources_desc: "La bauxita provenzal alrededor de Brignoles y Les Baux alimenta las obras de alumina en Gardanne, y el mineral de tungsteno todavía se encuentra bajo el Ariege en Salau. Los depósitos fueron abandonados cuando las importaciones eran más baratas. Reabrirlos es la diferencia entre comprar nuestras aleaciones y hacerlas."
 FRA_offshore_oilrigs: "La Licencia Marítima de Guyane"
 FRA_offshore_oilrigs_desc: "La perspectiva de Zaedyus fuera de Kourou demostró que los bloques marítimos Guyane mantienen el petróleo en aguas profundas. La licencia es nuestra para otorgar y las plataformas pueden estar en la estación dentro del año. Guyana y Suriname reclaman el mismo fondo marino y lo dirán en voz alta."
 FRA_state_run_construction: "Obras públicas dirigidas por el Estado"
 FRA_state_run_construction_desc: "Bajo la propiedad del proyecto público, la administración establece el precio, el horario y el contador de cabeza, y ningún contratista toma un margen fuera de él. El fracaso es familiar: un sitio votado sin financiación completa deja a las tripulaciones de pie por una temporada."
 FRA_infrastructure_projects: "Contratos del Plan Estatal-Región"
 FRA_infrastructure_projects_desc: "Los contratos del plan negociados entre el Estado y cada consejo regional cofinancian las carreteras, los ferrocarriles y las redes que ningún consejo puede financiar solo. El plan de reactivación de las autopistas y las oficinas regionales de planificación ya tienen los archivos abiertos."
 FRA_decentralization: "Ley II de Descentralización"
 FRA_decentralization_desc: "La constitución puede decirse claramente que la organización de la República está descentralizada. Las competencias y los impuestos a pagar por ellos pasan de los prefectos a los consejos regionales, y las decisiones se toman donde el problema es en realidad. París mantiene algo menos de lo que se utiliza para conservar."
 FRA_centralization: "El Estado de Jacobin"
 FRA_centralization_desc: "La tradición jacobina sostiene que una República significa una administración, y el cuerpo prefectoral existe para hacerla cumplir. Cada línea de gasto regional vuelve a Bercy para la firma. Cuesta una fortuna en clerks y entrega un estado que se mueve cuando se le dice a."
 FRA_french_healthcare: "El Securite Sociale"
 FRA_french_healthcare_desc: "El Securite Sociale cubre a todos, y la Organización Mundial de la Salud ha clasificado el resultado primero en el mundo. Lo que sea de lo que la República discute, nadie hace campaña para desmantelarlo. Aumentar el presupuesto de salud para que coincida con lo que ya promete compra silencio en casa, y no es barato."
 FRA_french_arms_industries: "Dirección Generale de l'Armement"
 FRA_french_arms_industries_desc: "La Dirección General de l'Armement escribe los requisitos y firma los cheques para Nexter, Dassault, Thales, Naval Group, MBDA y Safran. Es la razón por la que Francia puede diseñar un luchador, una fragata y un misil sin pedir permiso a nadie."
 FRA_research_and_dev_projects: "CNRS y CEA"
 FRA_research_and_dev_projects_desc: "Los laboratorios del CNRS y la Comisión de Energía Atómica llevan ciencia francesa, mientras que el crédito fiscal de investigación saca dinero privado detrás de ellos. Los grupos de competitividad vinculan las universidades a las industrias que les rodean. El proyecto de ley se basa en el presupuesto educativo."
 FRA_reformed_universal_healthcare: "Protección médica universal"
 FRA_reformed_universal_healthcare_desc: "La protección médica universal reemplaza el parcheteo de los medios, por lo que la cobertura sigue la residencia en lugar del empleo. Una población más sana y una más tranquila, comprada al precio de una reforma que nadie en los ministerios quería administrar. El interior rural todavía tiene distritos sin ningún médico, y los hospitales pagados por la actividad no tienen ninguna razón para abrir uno."
 FRA_nexter: "Sistemas posteriores"
 FRA_nexter_desc: "GIAT Industries, renacido como Nexter, construye el tanque de batalla principal Leclerc, el motor de CAESAR y el VBCI. El diseño se encuentra en Satory fuera de París y el montaje corre en Roanne. Ambos sitios tienen capacidad para la que nunca hemos pagado completamente."
 FRA_dassault: "Aviación Dassault"
 FRA_dassault_desc: "Dassault Aviation construye el Rafale y el Mirage 2000, los aviones de negocios de Falcon que ayudan a pagar por ellos, y el manifestante nEUROn que viene después. El montaje final corre en Merignac fuera de Burdeos, respaldado por el cluster aeroespacial en los Midi-Pyrenees."
 FRA_thales_group: "Thales y grupo naval"
 FRA_thales_group_desc: "Thomson-CSF se ha convertido en Thales, suministrando los radares y sistemas de combate a bordo de las fragatas FREMM y el transportista Charles de Gaulle. Los cascos vienen de los patios de Saint-Nazaire y de las salas submarinos de Cherbourg. Mantenerlo ocupado es el compromiso más caro en la industria."
 FRA_usa_fra_collaboration: "La asociación Safran-GE"
 FRA_usa_fra_collaboration_desc: "CFM International, la empresa conjunta entre Safran y General Electric, ha puesto los motores franceses bajo las alas americanas y pagado a ambos socios con buen gusto. Los instrumentos CNES ya vuelan en misiones de la NASA. Hay espacio para ampliar el acuerdo a los laboratorios detrás de ellos."
 FRA_the_french_agriculture: "Granary of Europe"
 FRA_the_french_agriculture_desc: "Francia es el mayor productor agrícola de la Unión y atrae la mayor parte de la Política Agrícola Común. La FNSEA habla por las granjas y el espectáculo de la granja de París es donde los políticos van a ser vistos. El buen suelo es una tenencia estratégica, y debe ser trabajado como uno."
 FRA_the_vineyard_industries: "Las denominaciones"
 FRA_the_vineyard_industries_desc: "El sistema de denominación policial del INAO es lo que separa Burdeos, Borgoña y Champán de cada imitación en el extranjero. Moet Hennessy vende el resultado en cada mercado de la tierra. Ningún presupuesto publicitario compra una reputación de ese tipo."
 FRA_the_dairy_industry: "Lactalis y las Cooperativas"
 FRA_the_dairy_industry_desc: "Lactalis y Danone compran de la cooperativa Sodiaal y de sus manadas a través de Normandía y el Jura. Comte y Camembert llevan nombres protegidos, y lo que no va a los fabricantes de quesos entra en polvos, yogures y fórmula infantil vendida en todo el mundo."
 FRA_wheat_industry: "El trigo de la Beauce"
 FRA_wheat_industry_desc: "La llanura de Beauce es el granero de Francia, y su cosecha se mueve por ferrocarril a Rouen, el mayor puerto de exportación de granos en Europa. Los compradores de toda África del Norte y el Cercano Oriente dependen de los cargamentos que lleguen, lo cual es una forma de influencia que ninguna embajada puede coincidir."
 FRA_mechanized_agriculture: "Las cooperativas de maquinaria"
 FRA_mechanized_agriculture_desc: "Cooperativas de maquinaria compartidas colocan combinaciones y calentadores al alcance de las granjas que nunca podrían comprarlos directamente. Kuhn implementa desde Saverne, Manitou handlers y cosechadores guiados por satélite ya están en los campos. La ingeniería detrás de ellos vale la pena desarrollarse en casa."
 FRA_packaging_industries: "Sidel y Verallia"
 FRA_packaging_industries_desc: "Sidel construye las líneas de embotellado y embalaje en Normandía que la industria alimentaria continúa, y Verallia, salpicada de Saint-Gobain, abastece el vidrio. El embalaje hecho en Francia y hecho reciclable mantiene la cadena de valor de terminar en la frontera."
 FRA_agriculture_industry: "Los Gigantes Agri-Food"
 FRA_agriculture_industry_desc: "Danone, Lactalis, Bel y Bonduelle convierten la cosecha en exportaciones de marca que mantienen su precio en cualquier mercado. Alimentarnos es el suelo. Vender el excedente es la devolución."
 FRA_improved_railways: "Reseau Ferre de France"
 FRA_improved_railways_desc: "Reseau Ferre de France posee la pista debajo de cada servicio SNCF, así que el estado decide lo que se construye sobre ella. La señalización Alstom y las encuestas para nuevas alineaciones de alta velocidad son donde se resuelve la próxima generación de la red."
 FRA_focus_on_rails: "Stock de Rolling desde Belfort"
 FRA_focus_on_rails_desc: "Alstom construye locomotoras en Belfort y carruajes en La Rochelle, conjuntos de alta velocidad de doble cubierta para las líneas principales y conjuntos regionales en Crespin. Las ordenes colocadas ahora mantienen esos pasillos abiertos y el material rodante que viene."
 FRA_high_speed_rail_lines: "El LGV Europeenne"
 FRA_high_speed_rail_lines_desc: "La línea de alta velocidad que corre al este a Estrasburgo y el Rin pone nuestra red en Alemania, mientras que Thalys y Eurostar la llevan a través del Tunel Canal. El récord mundial de velocidades ferroviarias está en pista francesa. No hay razón para que el mapa se detenga en la frontera."
 FRA_luxury_goods: "LVMH y Kering"
 FRA_luxury_goods_desc: "LVMH, Kering, Hermes y Chanel dominan un oficio que nadie en el extranjero ha logrado copiar, y el Comite Colbert guarda la nave detrás de él. Place Vendome y Avenue Montaigne son direcciones que venden por su cuenta. Las casas permanecen en París, y también su sede."
 FRA_tourism_industry: "Atout France"
 FRA_tourism_industry_desc: "Afuera Francia promueve el país más visitado de la tierra, y los recibos lo muestran. El Louvre, la Torre Eiffel y Disneyland París atraen multitudes que las ciudades ya no pueden absorber, y los residentes han comenzado a decirlo en voz alta."
 FRA_the_gorgeous_coasts: "El Conservador Costero"
 FRA_the_gorgeous_coasts_desc: "El Conservatorio de Littoral compra la costa antes de que pueda construirse, desde la Costa Fleurie en Normandía hasta los acantilados de Córcega, la Costa Azul y las playas atlánticas del Loira. Accesible, estas costas sacan la presión de las ciudades."
 FRA_the_spaces_between: "La France Profonde"
 FRA_the_spaces_between_desc: "Futuroscope fuera de Poitiers demostró que un campo en el interior puede atraer millones. Las mesetas del Limousin, los viñedos y la catedral de Reims y las estaciones alpinas de Savoy tienen el mismo reclamo y ninguna de las multitudes. Lo que les falta es la conexión, y los pueblos que dejaron los ferrocarriles no esperarán para siempre."
 FRA_beaches_of_france: "Deauville to Biarritz"
 FRA_beaches_of_france_desc: "Las playas de Normandía, la costa del surf en Biarritz y las amplias arenas de la Cote d'Opale atraen a los visitantes que nunca pisan París. Se propagan por las estaciones y las regiones, el comercio contrata todo el año y nadie lo resentirá."
 FRA_energy_sector: "El Plan Messmer"
 FRA_energy_sector_desc: "El programa Messmer puso reactores a lo largo del Ródano, el Rin y el Canal, y tres cuartas partes de la cuadrícula ahora se ejecuta en fisión. EDF, Framatome y la Comisión de Energía Atómica lo construyeron y todavía lo dirigen. Ningún cártel en el extranjero establece el precio de la electricidad francesa."
 FRA_renewable_investments: "Presas del Rhone"
 FRA_renewable_investments_desc: "El Compagnie Nationale du Rhone ejecuta una cadena de presas la longitud del río, con Serre-Poncon y el almacenamiento alpino bombeado sobre ellos y las presas Truyere a través de la Auvernia. La planta de marea en el Rance ha estado girando mucho antes de que alguien llamara esta renovable. El agua sigue cayendo lo que el mercado de combustible hace."
 FRA_solar_investments: "Solar en el Midi"
 FRA_solar_investments_desc: "El sunbelt provenzal y el valle inferior Rhone se iluminan el norte sólo puede envidiar, y EDF Renouvelables ya está construyendo parques allí. El horno solar en Odeillo ha estado demostrando la física desde mucho antes de que los paneles fueran asequibles. Es caro, y es inagotable."
 FRA_wind_investments: "El Corredor Tramontaneo"
 FRA_wind_investments_desc: "Las llanuras del norte llevan campos de viento desde el horizonte hasta el horizonte, y las naufragios para los parques atlánticos se montan en Saint-Nazaire y Le Havre. El tramontane hacia abajo el Aude convirtió las primeras turbinas francesas y demostró el caso hace décadas. El viento no cuesta nada y no se detiene."
 FRA_the_northern_reactors: "Los Reactores de Chooz"
 FRA_the_northern_reactors_desc: "Los reactores de Chooz se colocan sobre la Meuse en las Ardenas, con Nogent en el río Sena, ambos sacando agua fría de los ríos que atraviesan fronteras. Dos unidades completamente actualizadas allí asegurarían la red norteña para una generación. Bruselas y Berlín se quejarán del momento en que se publican los planes."
 FRA_improved_nuclear_waste_management: "La Haya y Bure"
 FRA_improved_nuclear_waste_management_desc: "Los reprocesos de La Haya gastan combustible en óxido mixto, Marcoule maneja lo que no se puede reutilizar, y el repositorio profundo de Bure está siendo excavado para el resto. El desperdicio es el argumento que nuestros oponentes hacen mejor, así que es el que debemos responder."
 FRA_expanded_enrichment_facilities: "Georges Besse II"
 FRA_expanded_enrichment_facilities_desc: "El enriquecimiento de Centrifuge en Georges Besse II en el sitio Tricastin reemplaza las salas de difusión que consumieron el valor del reactor para funcionar. Enriquecer en casa significa combustible que no debe nada a un proveedor extranjero."
 FRA_the_new_energy_dawn: "La Luz de Europa"
 FRA_the_new_energy_dawn_desc: "Los interconexores llevan la corriente excedente a Gran Bretaña, Italia, España y Alemania, y Francia es el mayor exportador neto de electricidad en el continente. Nuestros vecinos pagan lo que nuestra propia red no necesita."
 FRA_french_armed_forces: "Fuerzas Armadas Francesas"
 FRA_french_armed_forces_desc: "Para la mayoría de la historia francesa, las Fuerzas Armadas Francesas han sido una fuente de inmenso orgullo en nuestro país. De los ejércitos que marcharon contra los ingleses para defender nuestro derecho a un rey francés, a los hombres que sirvieron bajo Napoleón mismo, el ejército sigue siendo una de nuestras más claras reivindicaciones de separarnos de otros."
 FRA_the_french_army: "Armée de Terre"
 FRA_the_french_army_desc: "El 'Armée de Terre', o el Ejército Francés, es una de las tres ramas centrales de nuestra estructura de fuerzas armadas. Los logros de nuestro ejército se cantan lejos y ancho. Las fuerzas deben seguir siendo honradas y ampliadas para impulsar aún más a nuestro país."
 FRA_the_french_air_force: "Armée de l'Air"
 FRA_the_french_air_force_desc: "Nuestra fuerza aérea es una de las más antiguas del mundo. El primer contingente de potencia aérea francesa se formó en 1909 como ala del ejército francés. Ahora, es su propio ala independiente, y exportamos una de las mejores piezas de fuerza aérea en el mundo."
 FRA_french_navy: "Marine Nationale"
 FRA_french_navy_desc: "La marina francesa ayudó a impulsar nuestras ambiciones y nuestros deseos a escala mundial. Ayudó a encontrar uno de los imperios coloniales más grandes que el mundo ha visto, rivalizando con el español e inglés. Invertir en esto nos permitirá seguir proyectando en el extranjero."
 FRA_amx_leclerc: "AMX Leclerc"
 FRA_amx_leclerc_desc: "El AMX Leclerc y sus sucesores son la clase MBT del ejército francés. Es robusto y bien redondeado como la mayoría de los tanques modernos. Invertir más en su desarrollo puede impulsar nuestro cuerpo blindado."
 FRA_network_centric_warfare: "Guerra de Red Centrada"
 FRA_network_centric_warfare_desc: "Al igual que los estadounidenses y otros grandes países europeos, debemos invertir en métodos de guerra más avanzados tecnológicamente para alejarnos del uso de personas y depender más de la tecnología. El cambio será costoso, pero en última instancia, salvará más vidas francesas."
 FRA_land_air_coordination: "Coordinación Tierra-Aire"
 FRA_land_air_coordination_desc: "La coordinación tierra-aire es vital para cualquier operación conjunta de fuerzas. Sin fuerzas terrestres, no podemos avanzar en el frente; sin apoyo aéreo, no podemos esperar un fuego eficiente. Por lo tanto, debemos esforzarnos por mejorar la coordinación entre la guerra aérea y la guerra terrestre."
 FRA_the_mirage: "El Mirage"
 FRA_the_mirage_desc: "El Mirage se ha convertido en uno de esos icónicos aviones de combate de la Fuerza Aérea Francesa. Se utiliza en servicio en otros nueve países del mundo y es un avión importado por muchos."
 FRA_maritime_fighters: "Aviones de Guerra Marítimos"
 FRA_maritime_fighters_desc: "Las mejoras en nuestra fuerza aérea y armada requerirán aviones de guerra naval más eficientes."
 FRA_lafayette_class: "Clase Frégate Légère Furtive"
 FRA_lafayette_class_desc: "Las fragatas Frégate Légère Furtive class fueron diseñadas a finales del decenio de 1980 para reemplazar a los destructores de envejecimiento. Los barcos son buques ligeros y multifuncionales muy adaptados a las funciones de defensa en la flota francesa."
 FRA_de_gaulle_class: "Clase De Gaulle"
 FRA_de_gaulle_class_desc: "El Portaaviones de la Clase De Gaulle es el décimo portaaviones construido para servir en la Armada francesa. También es el único portaaviones de propulsión nuclear fuera de la Armada de Estados Unidos, lo que lo convierte en un portaaviones formidable y potente."
 FRA_amx_10: "AMX-10"
 FRA_amx_10_desc: "El AMX-10 es un tanque de reconocimiento ligero para el ejército francés. El AMX es impresionantemente rápido, alcanzando una velocidad de 85 km/h en terrenos ideales. Sin duda, el AMX se mueve rápido como el infierno."
 FRA_vbci: "VBCI"
 FRA_vbci_desc: "El VBCI fue desarrollado para reemplazar el envejecimiento AMX-10P, entrando en servicio para 2008. El VBCI tiene muchas mejoras, incluyendo ser más rápido que el velocímetro AMX con una velocidad máxima de 100 km/h. Sin embargo, el VBCI sacrifica la gran pistola boi a favor de un armamento más ligero y mayores velocidades."
 FRA_forward_air_bases: "Bases Aéreas Avanzadas"
 FRA_forward_air_bases_desc: "Para estar preparados para cualquier eventualidad, debemos fortalecer nuestras bases aéreas avanzadas para asegurar planes ofensivos o defensivos debidamente preparados."
 FRA_mirage_2000d: "Mirage 2000D"
 FRA_mirage_2000d_desc: "El Mirage 2000D es un avión de ataque que nos ha servido fielmente desde su concepción. Empujar para aviones futuros y mejores solo honrará el legado del Mirage."
 FRA_carrier_fighters: "Marine de Rafale"
 FRA_carrier_fighters_desc: "El Rafale Marine es la versión para portaaviones del común caza Rafale. Tiene una estructura similar a su variante terrestre. En general, este caza es una bestia en la batalla por los mares."
 FRA_med_naval_bases: "Bases Navales del Mediterráneo"
 FRA_med_naval_bases_desc: "Córcega es un territorio ideal para una base naval mejorada. Está separada del continente y relativamente defendible."
 FRA_triomphant_class: "Clase Triomphant"
 FRA_triomphant_class_desc: "Los submarinos de clase Triomphant fueron construidos para superar barcos anteriores y ahora son la parte fundamental de la rama oceánica de las fuerzas disuasorias nucleares."
 FRA_ifv_investment: "Inversión en IFV"
 FRA_ifv_investment_desc: "Invertir en mejores vehículos de IFV y otras formas de armadura ligera debe ser capaz de ayudarnos a impulsar nuestro ejército y economía!"
 FRA_national_arms_exports: "Exportaciones Nacionales de Armamento"
 FRA_national_arms_exports_desc: "Francia se ha convertido en un importante jugador de la industria de defensa, y debemos continuar este camino."
 FRA_the_space_program: "Programa espacial"
 FRA_the_space_program_desc: "El espacio es una nueva frontera, y desde hace poco hemos demostrado que podemos aprender muchas cosas grandes del espacio! Vale la pena restablecer la confianza en nuestro programa espacial."
 FRA_floreal_class: "Clase Floreal"
 FRA_floreal_class_desc: "La clase Floreal representa la mayoría de las fragatas ligeras en la armada francesa. La clase Floreal y sus sucesores son buques activos destinados a combates multipropósito, incluyendo guerra antisubmarina, antiaérea y de apoyo naval-terrestre."
 FRA_laredoubtable_class: "Clase Le Redoutable"
 FRA_laredoubtable_class_desc: "Los submarinos de clase Redoutable son algunos de los submarinos más antiguos en servicio por la marina francesa. Sin embargo, no hay que dudar de que son fundamentales en las estrategias navales disuasivas nucleares francesas."
 FRA_honour_and_fidelity: "Honneur et Fidélité (Honor y Fidelidad)"
 FRA_honour_and_fidelity_desc: "El lema de la legión francesa resuena bien con nuestro país. Los militares encarnan estos valores en particular: el honor tanto en lo que hacen, como la fidelidad a través de su inquebrantable fidelidad a la patria francesa."
 FRA_cnes_budgeting: "Presupuesto para el CNES"
 FRA_cnes_budgeting_desc: "El CNES es la principal entidad de la aviación y la aeronáutica francesas. Debemos asignar presupuesto al CNES para poder seguir avanzando y mantenernos competitivos en esta nueva frontera."
 FRA_international_space_research: "Iniciativa Espacial Internacional"
 FRA_international_space_research_desc: "Deberíamos trabajar con otros países, como Estados Unidos, para impulsar esta frontera hacia adelante."
 FRA_kourou_launch_pad: "Plataforma de Lanzamiento de Kourou"
 FRA_kourou_launch_pad_desc: "Kourou en la Guayana Francesa es tanto un lugar estratégico para el lanzamiento espacial como un territorio directamente bajo nuestra propiedad. También podemos negociar acuerdos con otras agencias espaciales para que utilicen esta excelente ubicación."
 FRA_honour_homeland_valour_discipline: "Honneur, Patrie, Valeur, Disciplina"
 FRA_honour_homeland_valour_discipline_desc: "El lema de la Armada Francesa expresa más que justo lo que significa servir en el ejército. Nuestro pueblo es uno con la patria, lleno de honor y valor, y disciplinado en su valentía."
 FRA_french_space: "Espacio Francés"
 FRA_french_space_desc: "Nuestra dominación en el espacio es vital para un futuro en los recursos y beneficios que se pueden obtener en los cielos allá arriba."
 FRA_francosphere: "Francosfera"
 FRA_francosphere_desc: "Francia ha estado practicando un método de neocolonialismo desde el final de la Segunda Guerra Mundial. Aunque no ocupando directamente las tierras de estas naciones, Francia ha sido un maestro de títeres a su favor. Sin embargo, con el comienzo del siglo XXI, muchos están dispuestos a reducir su dependencia de París como fuente de liderazgo. Por lo tanto, ahora es hora de que Francia actúe en consecuencia."
 FRA_the_levant_problem: "El problema de Levante"
 FRA_the_levant_problem_desc: "El Levante es una parte de la Francosfera que a menudo se pasa por alto. En su día, esta región proporcionó valiosos cereales, frutas y aceite al imperio francés."
 FRA_antagonize_syria: "Antagonise Syria"
 FRA_antagonize_syria_desc: "Siria bajo los al-Assads ha tomado demasiadas decisiones equivocadas. Debemos desestabilizar el régimen y empezar a ayudar a alentar a Siria hacia nuestra ideología y deponer a los dictadores."
 FRA_supporting_armenia: "Apoyo a Armenia"
 FRA_supporting_armenia_desc: "Armenia es un recién llegado a la Francósfera, pero son un aliado estratégico sin embargo. Las luchas de la nación nos recuerdan mucho a nosotros mismos y debemos apoyar a Armenia en sus luchas en el Karabaj."
 FRA_anti_assad_regime_message: "Mensaje contra el régimen de Assad"
 FRA_anti_assad_regime_message_desc: "Aunque hemos sido ampliamente antagónicos contra Siria, ahora es el momento de que nos volvemos a vergonzosos y ya no nos damos cuenta de lo que realmente queremos decir. El liderazgo de Siria bajo los Assads ha dado un giro hacia lo peor y debemos seguir declarando nuestro desprecio por los al-Assad."
 FRA_escalation_from_the_damascus_spring: "Escalada de la Primavera de Damasco"
 FRA_escalation_from_the_damascus_spring_desc: "La Primavera de Damasco ha comenzado con toda su fuerza. Ahora es fundamental que sigamos apoyando los movimientos prodemocráticos en Siria y en todo Oriente Medio."
 FRA_collaboration_with_the_fsa: "Colaboración con los rebeldes sirios"
 FRA_collaboration_with_the_fsa_desc: "Los rebeldes necesitarán una cantidad considerable de recursos para hacer frente a los al-Assad. Deberíamos estudiar nuestras opciones y lo que podemos aportar al grupo que dirigirá Siria hacia adelante."
 FRA_oil_and_gas_investments: "Inversiones en petróleo y gas"
 FRA_oil_and_gas_investments_desc: "El Levante, en particular, tiene una cantidad considerable de reservas de petróleo y gas. Siempre será ventajoso invertir recursos y mano de obra en las industrias del petróleo y el gas de la región."
 FRA_reminder_of_the_taif_agreement: "Recordatorio del Acuerdo de Taif"
 FRA_reminder_of_the_taif_agreement_desc: "El Acuerdo de Taif, conocido oficialmente como Acuerdo de Reconciliación Nacional, fue alcanzado para significar el fin de la guerra civil libanesa y traer un retorno a la normalidad. Debemos recordar al Líbano y el Oriente Medio acerca de los acuerdos de Taif y buscar poner fin a Hezbollah."
 FRA_root_out_hezbollah: "Erradicar a Hezbolá"
 FRA_root_out_hezbollah_desc: "Hezbolá es una afrenta directa al Líbano, al Acuerdo de Taif y a la paz en la región. Acabar con Hezbolá es uno de los primeros pasos para ayudar a establecer la paz en Oriente Medio."
 FRA_agriculture_works_in_the_levant: "La agricultura funciona en Levante"
 FRA_agriculture_works_in_the_levant_desc: "Merecerá la pena realizar diversas inversiones agrícolas en todo el Levante. Contrariamente a la mayoría de las ideas extranjeras sobre la región, ésta tiene un gran potencial. Se pueden cultivar muchos productos en las exuberantes costas del Levante o en los valles fluviales de Siria. Deberíamos explorar nuestras inversiones en la región y ayudar a aprovechar la potencia agrícola del Levante."
 FRA_francafrique: "Françafrique"
 FRA_francafrique_desc: "África fue una vez uno de los pilares de nuestro antiguo imperio colonial. Las naciones del antiguo Françafrique deben seguir nuestro camino hacia el nuevo siglo. Debemos investigar la mejor manera de ayudarlos y mantener nuestra influencia sobre la región."
 FRA_francophone_solidarity: "Solidaridad francófona"
 FRA_francophone_solidarity_desc: "Esta fue una iniciativa encaminada a promover la cultura francófona y los valores franceses entre las naciones francófonas. La iniciativa incluía un mayor acceso a la educación para las naciones de bajos ingresos y apoyo económico para los países en desarrollo, con la esperanza de que ganaran y aprovecharan el terreno que habían mantenido desde la posterior descolonización. En las naciones africanas, concretamente, Francia participó activamente en el apoyo a las asociaciones entre las naciones africanas que mantuvieron su influencia y generaron beneficios provechosos."
 FRA_continue_cold_war_mentality: "Seguir con la mentalidad de la Guerra Fría"
 FRA_continue_cold_war_mentality_desc: "Muchos de los ciudadanos y la comunidad internacional creen que nuestra condición de poder mundial se está desvaneciendo. Debemos mantener nuestra posición como una nación mundial líder a cualquier costo. Volver a métodos antiguos no será popular internacionalmente, pero hay que tomar medidas. La crítica se desvanecerá a tiempo."
 FRA_NEPAD_development: "Desarrollo de la NEPAD"
 FRA_NEPAD_development_desc: "La Nueva Alianza para el Desarrollo de África (NEPAD) es un programa de desarrollo económico elaborado por la Unión Africana con asociados de la Unión Europea, China, Japón y otros miembros del G8. Estamos especialmente interesados en el desarrollo de la NEPAD y hemos tomado un punto focal de ser el principal respaldo del desarrollo monetaria y políticamente de la Unión Europea. Debemos estudiar la posibilidad de contribuir a ampliar el desarrollo y aumentar la financiación y el apoyo al programa para ayudar a toda África."
 FRA_CFA_Reforms: "Reformas de la CFA"
 FRA_CFA_Reforms_desc: "Hacer frente a la CFA es una de nuestras mayores preocupaciones. Con influencia drenando a lo largo del tiempo, nos vemos forzados en la posición de reforma para mantener vivo un imperio neocolonial. Algunas de nuestras reformas están dirigidas a aumentar la autonomía dentro del sistema bancario. Utilización más fácil de los fondos monetarios y los controles cambiarios."
 FRA_introduce_the_eco: "Introducir el ECO"
 FRA_introduce_the_eco_desc: "Debemos separar el franco CFA de nuestro dominio y eliminar la dependencia de nuestras antiguas colonias en nosotros. La OCE es la nueva moneda propuesta que debería permitir a las naciones del África Occidental cierto grado de autonomía económica y cooperación entre las nuevas naciones que la han adoptado. Deberíamos buscar apoyarlos en su empeño por crear una nueva moneda común y potencialmente convencer a todos los antiguos africanos franceses de utilizar esta nueva moneda."
 FRA_unrestricted_subjugation: "Subyugación sin restricciones"
 FRA_unrestricted_subjugation_desc: "Nuestras acciones sólo han sido de explotación & extracción. Pero ahora debemos reconsiderar nuestra posición sobre esta postura y si deberíamos repensar nuestra postura diplomática e introducir una nueva fase de gobernanza y control. La elección no será popular, pero sólo se hace en interés de una nación y su estatus global."
 FRA_intervention_in_africa: "Intervencionismo Françafrique"
 FRA_intervention_in_africa_desc: "Nuestras antiguas posesiones coloniales necesitan ayuda. Ha llegado el momento de que prosigamos nuestra política de intervención en la región y proporcionemos ayuda militar cuando sea necesario."
 FRA_sahel_region: "Región del Sahel"
 FRA_sahel_region_desc: "La región del Sahel es una perspectiva de extracción minera y de recursos, y una frontera para el posicionamiento geopolítico francés e intereses corporativos. Con el creciente extremismo del nuevo milenio, debemos actuar para garantizar la seguridad de los activos y nacionales franceses en la región. La insurgencia yihadista se está extendiendo a través del Sahel, amenazando nuestros intereses allí. Debemos tomar la iniciativa de proteger nuestra posición y eliminar esta amenaza a cualquier costo necesario."
 FRA_afrique_centrale: "Afrique Centrale"
 FRA_afrique_centrale_desc: "El corazón y el alma de África, Afrique Centrale está cubierto por innumerables maravillas naturales y una vasta riqueza de recursos y potencial, gran parte de ella aún sin explotar."
 FRA_CAR_intervention: "Operación Sangaris"
 FRA_CAR_intervention_desc: "Opération Sangaris era el nombre de la operación e intervención propuestas en la guerra civil de la República Centroafricana."
 FRA_operation_artemis: "Operación Artemis"
 FRA_operation_artemis_desc: "Con la Segunda Guerra del Congo en pleno apogeo, Francia y otras naciones europeas lideraron una intervención autónoma en la parte oriental del país tras la retirada de las fuerzas ugandesas. Marcó un importante punto de inflexión en los asuntos exteriores y las operaciones militares conjuntas de la Unión Europea."
 FRA_resources_prospects: "Perspectivas de recursos"
 FRA_resources_prospects_desc: "Las regiones naturalmente ricas del África subsahariana están llenas de recursos, y las empresas francesas ya se benefician de muchas asociaciones allí. Con la creciente demanda de estos recursos, debemos tomar la iniciativa e invertir en nuestros activos en el extranjero para asegurar nuestra posición y mantenerla bien."
 FRA_oef_hoa: "OEF - Cuerno de África"
 FRA_oef_hoa_desc: "La guerra civil somalí se ha esfumado lo suficiente. Debemos intervenir en nombre del Gobierno somalí para ayudarlos a recuperar su país devastado por la guerra y ayudar al gobierno somalí en sus esfuerzos por estabilizar su país."
 FRA_operation_licorne: "Operación Licorne"
 FRA_operation_licorne_desc: "Opération Licorne es el nombre de la fuerza francesa de mantenimiento de la paz desplegada en Costa de Marfil en respuesta a la guerra civil entre las Forces Nouvelles de Côte d'Ivoire y las Forces Armées de Côte d'Ivoire."
 FRA_the_second_ivory_coast_civil_war: "La Segunda Guerra Civil de Costa de Marfil"
 FRA_the_second_ivory_coast_civil_war_desc: "La Segunda Guerra Civil de Costa de Marfil fue el segundo conflicto armado entre los partidarios de Laurent Gbagbo y el presidente electo Alassane Ouattara. El enfrentamiento entre ambos escaló hasta convertirse en un conflicto a gran escala. Debemos intervenir para ayudar a estabilizarlo antes de que se descontrole."
 FRA_Industrial_expansion: "Expansión industrial"
 FRA_Industrial_expansion_desc: "Nuestras antiguas naciones coloniales necesitan desesperadamente una reactivación económica. A estas sociedades fundamentalmente agrarias les vendría bien un pequeño impulso a sus economías inyectando fondos de inversión en la región."
 FRA_educational_development: "Desarrollo educativo"
 FRA_educational_development_desc: "Proporcionar fondos para la educación en nuestras antiguas posesiones coloniales ayudará a su población a ser más culta y, a su vez, contribuirá a su productividad."
 FRA_operation_serval: "Operación Serval"
 FRA_operation_serval_desc: "Opération Serval es el nombre con el que se conoce a la serie de intervenciones dirigidas por Francia y Mali durante la Guerra Civil de Mali como primera fase del conflicto contra los extremistas islámicos en la región."
 FRA_French_pillar_of_counterterrorism: "Pilar de la lucha contra el terrorismo"
 FRA_French_pillar_of_counterterrorism_desc: "Nuestras fuerzas antiterroristas y antiextremistas han adquirido renombre mundial y nos hemos convertido en un pilar y la cara de la lucha contra el terrorismo en todo el mundo."
 FRA_the_french_foreign_legion: "La Legión Extranjera Francesa"
 FRA_the_french_foreign_legion_desc: "La Legión Extranjera Francesa es un cuerpo de élite del ejército francés que consiste en una variedad de especialidades. Después de haber sido formado en 1831 por entonces el rey Louis-Philippe tenía la intención de permitir a los reclutas extranjeros un lugar entre las fuerzas francesas. Como tal, la Legión es una fuerza de lucha multiétnica y multicultural que es reconocida mundialmente por la disciplina y el esprit de corps."
 FRA_sahel_support_initiative: "Iniciativa de Apoyo al Sahel"
 FRA_sahel_support_initiative_desc: "Las fuerzas militares del Sahel a menudo están insuficientemente equipadas. Es posible que podamos reorganizar algunos recursos a su manera, ya sea fiscal o militarmente, para ayudar a fortalecer nuestra posición en África."
 FRA_sahel_officer_training: "Entrenamiento de Oficiales del Sahel"
 FRA_sahel_officer_training_desc: "A las fuerzas armadas de los países del Sahel les vendría bien recibir más formación para convertirse en una fuerza de combate más eficaz. Deberíamos invertir en los ejércitos de nuestros aliados en la región y mejorar el nivel de sus oficiales."
 FRA_takuba_task_force: "Fuerzas de tareas Takuba"
 FRA_takuba_task_force_desc: "La Fuerza de tareas Takuba fue otra serie de operaciones conjuntas entre fuerzas francesas, malienses, de la UE y estadounidenses para continuar el conflicto contra los extremistas islámicos durante la Guerra Civil de Malí. Para nosotros es un objetivo estratégico volver a intervenir en Mali para garantizar la estabilidad en la región."
 FRA_haitian_coup: "El golpe de Haití"
 FRA_haitian_coup_desc: "Jean-Bertrand Aristide sigue siendo una espina en el lado de nuestro país. La demanda de reparaciones es reprensible. Tal vez sea de nuestro interés encontrar nuevos líderes en Haití."
 FRA_repeal_the_ordiance: "Derogar la Ordenanza"
 FRA_repeal_the_ordiance_desc: "La Ordenanza de Carlos X de 1825 debe ser derogada para ayudar a normalizar las relaciones haitiana-francesa. La Ordenanza de 1825 es la causa y el motivo de los pagos de independencia haitianos que se llevaron a cabo durante casi tres cuartas partes de un siglo. Es hora de derogar esta antigua ley como uno de nuestros primeros pasos para la reconciliación."
 FRA_senegalese_civil_war: "La guerra civil senegalesa"
 FRA_senegalese_civil_war_desc: "La guerra civil senegalesa ha dado inicio a un conflicto localizado con las recientes elecciones. Senegal es importante como nación costera para traer material del interior y norte a Francia. La intervención en la región es una necesidad de continuar nuestras ambiciones en África."
 FRA_returning_to_indochina: "El regreso a Indochina"
 FRA_returning_to_indochina_desc: "Indochina fue una vez el pináculo de las tenencias francesas lejanas hasta las guerras de independencia vietnamita. Es hora de volver a Indochina tal vez no como colonizador, pero esta vez como amigo. Nuestros intereses en la región con el ascenso de China lo han marcado como un área de máxima importancia."
 FRA_former_indian_colonial: "Asuntos del Océano Índico"
 FRA_former_indian_colonial_desc: "Las posesiones francesas en el Océano Índico y los países francófonos del Océano Índico son estratégicamente importantes para frustrar y contrarrestar la influencia extranjera no deseada. Es hora de prepararnos para volver a estas regiones de importancia estratégica y traer con nosotros inversiones y otras mejoras estratégicas."
 France_news.99.t1: "El regreso del Rey"
 France_news.99.t2: "El regreso del Emperador"
 France_news.99.d1: "La Casa Real de Borbón ha regresado a la residencia real en Versalles, una vez construida por su antepasado Luis XIV, para asumir nuevamente el gobierno de Francia.\n\nEl rey [FRA.GetLeader] ha prometido una nueva y gran edad para Francia y el mundo. «Los gobernantes legítimos de Francia y los protectores de Europa occidental han regresado a su lugar legítimo.» fue la cláusula final de su discurso - que fue inmediatamente criticada como jingoísta y sobre-escrito por otros líderes europeos y republicanos franceses."
 France_news.99.d2: "La autodenominada \"Casa Imperial\" de Bonaparte, los descendientes del autoproclamado emperador Napoleón I Bonaparte (1769-1821), han regresado a Versalles. Si bien Napoleón (y sus descendientes) siempre habían sido populares en Francia, no lo eran tanto en el extranjero, tanto entre los nobles extranjeros como entre los plebeyos extranjeros.\n\nLa reciente retórica chovinista de [FRA.GetLeader], quien recientemente ascendió como Emperador de los franceses, ha sido puesta en tela de juicio por los líderes de Alemania, Gran Bretaña, Italia y Rusia. Los nuevos gobernantes de Francia tienen pocos amigos.\n\nJunto con el nuevo sistema de gobierno, Francia había presentado una nueva bandera: la misma que la antigua, pero ondeada en rojo al izarse, un recuerdo de la Revolución Francesa, cuando se ondeó una bandera similar poco antes del primer Imperio Bonapartista."
 France_news.99.o1: "¡Viva el Rey!"
 France_news.99.o2: "¡Viva el Emperador!"
 France_news.99.o3: "Oh, bueno."
 france_md.11.t: "Cooperación CNES - NASA"
 france_md.11.d: "Los líderes del CNES nos han acercado a discutir la cooperación ampliada entre la NASA y el CNES. Creen que hay mucho que aprender del espacio, y la combinación de los recursos de dos grandes programas espaciales podría beneficiarnos considerablemente a ambos. El acuerdo propuesto establece que cada lado se enfrentaría a $10 mil millones para perseguir mayores vínculos científicos."
 france_md.11.a: "Un acuerdo digno"
 france_md.11.b: "No"
 france_md.100.t: "Apoyo a Armenia"
 france_md.100.d: "La lucha de Armenia contra Azerbaiyán en Artsakh nos recuerda mucho a nosotros mismos. Apoyarlos en sus esfuerzos no sólo es deseado sino también necesario para nuestros intereses en la región. Podemos proporcionar apoyo material, financiero o político en su conflicto. ¿Cómo podemos ayudar a nuestros amigos en Ereván?"
 france_md.100.a: "Apoyo político a Armenia"
 france_md.100.b: "Apoyar económicamente a Armenia"
 france_md.100.c: "Apoyar militarmente a Armenia"
 france_md.101.t: "Francia nos apoya"
 france_md.101.d: "Francia ha decidido enviarnos su apoyo en nuestra lucha por establecernos. Los conflictos con Azerbaiyán y las cuestiones turcas siguen atormentándonos, pero ahora tenemos un aliado en Europa."
 france_md.101.a: "Otro movimiento en la dirección correcta"
 france_md.102.t: "La primera guerra civil de Costa de Marfil"
 france_md.102.d: "La Primera Guerra Civil de Costa de Marfil ha estallado de lleno. El conflicto arrecia y no muestra señales de amainar. Antaño joya de la corona de la Françafrique, la nación se ha convertido en un campo de matanza entre los bandos enfrentados. La estabilidad de la región pende de un hilo mientras el país se desgarra. ¿Qué bando se ajusta mejor a nuestros intereses actuales?"
 france_md.102.a: "Volver Laurent Gbagbo"
 france_md.102.b: "Volver a Guillaume Soro"
 france_md.102.c: "Volver a la Tercera Facción"
 france_md.103.t: "La Segunda Guerra Civil de Costa de Marfil"
 france_md.103.d: "La Segunda Guerra Civil de Costa de Marfil está en pleno apogeo entre las FNC y el gobierno de [CDI.GetName]. El conflicto comenzó tras las elecciones presidenciales, en las que Gbagbo se negó a dimitir pese a la victoria limpia y libre de Ouattara. ¿Qué bando se ajusta mejor a nuestros intereses actuales?"
 france_md.103.a: "Volver Laurent Gbagbo"
 france_md.103.b: "Volver Alassane Ouattara"
 france_md.104.t: "Operación Artemis"
 france_md.104.d: "La opción Artemis, la intervención propuesta por la Unión Europea en Ituri, desplegaría fuerzas de mantenimiento de la paz a la República Democrática del Congo. Muchos de nuestros gobiernos quieren que Francia dirija la acción militar de la Unión Europea. Tenemos una elección entre los participantes en cuanto a la cual queremos apoyar. Ruanda y [RWA.GetLeader] podrían ser un fuerte aliado, aunque basado en el este y no buscando el control de todo el país. [UGA.GetLeader] y [RCD.GetName] son otra opción pero están principalmente situados alrededor del norte. Siempre podemos apoyar a Kinshasa, el actual gobierno gobernante, que puede ser la opción más segura. ¿A quién apoyamos?"
 france_md.104.a: "Ayuda a la República Democrática del Congo"
 france_md.104.b: "Apoyar a Uganda"
 france_md.104.c: "Apoyar a Ruanda"
 france_md.105.t: "Guerra civil senegalesa"
 france_md.105.d: "La expansión de la guerra civil senegalesa en un conflicto mucho más amplio fue una sorpresa para todos los involucrados. La combinación de la cuestión de Casamance y las acusaciones de manipulación electoral ha desestabilizado otro país en África. Nuestras opciones varían considerablemente dependiendo de nuestros objetivos. Podemos apoyar [SEN.GetLeader] y su gobierno, las facciones rebeldes o el pueblo de Casamance. Cualquiera que elijamos ayudará a Senegal a pavimentar un nuevo futuro para sí mismo en la región."
 france_md.105.a: "Apoyar a Senegal"
 france_md.105.b: "Apoya a los rebeldes"
 france_md.105.c: "Apoyo a Casamance"
 france_md.106.t: "Operación Sangaris"
 france_md.106.d: "La Asamblea Nacional y el ejército de nuestro país han propuesto una nueva intervención en la República Centroafricana en respuesta a su nuevo conflicto. La operación propuesta, conocida como Opération Sangaris, comprometerá a nuestras tropas en apoyo de una de las facciones del conflicto civil. ¿A quién vamos a apoyar en el conflicto?"
 france_md.106.a: "Apoyo a la CAR"
 france_md.106.b: "Apoyo a la UFDR"
 france_md.106.c: "Apoyo a Seleka"
 france_md.106.d1: "Apoyar la Logone"
 france_md.106.e: "Apoyo a Anti-Balaka"
 france_md.107.t: "Operación Serval"
 france_md.107.d: "Opération Serval ha sido propuesta a la Asamblea Nacional como reacción a la rebelión Tuareg en el país de Mali. Actualmente, Serval está orientada a que las fuerzas francesas se desplieguen para apoyar al gobierno de [MAL.GetName] y [MAL.GetLeader]. Tenemos la opción de cambiar nuestra política exterior y apoyar la causa de los tuaregs si así lo decidimos. ¿A favor de qué parte del conflicto deberíamos intervenir?"
 france_md.107.a: "Apoyo al Gobierno de Malí"
 france_md.107.b: "Apoyo a los tuaregs"
 france_md.108.t: "Fuerzas de tareas Takuba"
 france_md.108.d: "Los insurgentes islámicos han comenzado a luchar contra el Gobierno [MAL.GetAdjective] y las fuerzas tuareg. Opération Serval ha estado en marcha desde hace algún tiempo, pero podemos incorporar apoyo adicional para la facción que habíamos apoyado antes o podemos hacer un cambio radical y apoyar a un nuevo benefactor en Malí. ¿Qué facción vamos a apoyar en el futuro?"
 france_md.108.a: "Apoyo al Gobierno de Malí"
 france_md.108.b: "Apoyo a los tuaregs"
 france_md.108.c: "Apoya a Ansar Dine"
 france_md.109.t: "El golpe de Haití"
 france_md.109.d: "El órgano gobernante del gobierno de Haití no está a nuestro favor. El precedente que establece el partido gobernante no es beneficioso para nuestra política exterior. Instigar el golpe y apoyar a la oposición es una de nuestras mejores opciones para asegurar que el resto de las colonias no empiecen a exigir reparaciones contra nosotros por infracciones coloniales."
 france_md.109.a: "Instigar el golpe"
 france_md.109.b: "Apoya a los rebeldes"
 france_md.350.t: "¡Francia nos echa del Líbano!"
 france_md.350.d: "Mediante una sofisticada campaña de presión diplomática e incentivos económicos, los franceses han socavado sistemáticamente nuestra posición en el Líbano. Sus operaciones de influencia han tenido éxito más allá de sus expectativas - políticos locales ahora llaman abiertamente a nuestra partida, y el gobierno libanés ha pedido formalmente que retiremos nuestra presencia. Este es un retroceso humillante, pero tal vez no es irreversible. Podríamos intentar reafirmar nuestra influencia, aunque hacerlo arriesgaría un incidente internacional."
 france_md.350.a: "¡Rata! ¡Pagarás por esto!"
 france_md.350.b: "Hacer valer la reclamación"
 france_md.355.t: "Francia infunde un sentimiento de revuelta en la población"
 france_md.355.d: "Los franceses han estado ocupados difundiendo sus ideales revolucionarios entre la población libanesa. Las organizaciones de la sociedad civil financiadas por París exigen reformas democráticas, transparencia y elecciones libres. Los movimientos de protesta están ganando impulso en Beirut y más allá. Si no actuamos rápidamente para contener esta situación, podemos enfrentarnos a un levantamiento lleno de sangre inspirado en los principios republicanos franceses."
 france_md.355.a: "Ahora eso duele."
 france_md.360.t: "Propuesta de inversión en energía"
 france_md.360.d: "El gigante de energía francés TotalEnergies se ha acercado a nuestro gobierno con una propuesta integral para desarrollar nuestras reservas de petróleo y gas. El acuerdo traería considerables inversiones extranjeras, conocimientos técnicos y crearía miles de puestos de trabajo. Sin embargo, algunos críticos nacionales argumentan que aceptar el capital francés aumentaría la influencia de París sobre nuestra política económica. Los términos son favorables, pero ¿a qué costo le costa nuestra soberanía?"
 france_md.360.a: "Los beneficios económicos superan los riesgos"
 france_md.360.b: "No podemos vender nuestros recursos a intereses extranjeros"
 france_md.400.t: "Asistencia para el desarrollo francés en el norte del Líbano"
 france_md.400.d: "La Agence Française de Développement ha propuesto un importante programa de infraestructura para el Líbano septentrional, que incluye mejoras en la carretera, instalaciones de tratamiento del agua y redes de telecomunicaciones. La región ha sido descuidada desde hace mucho tiempo, y la inversión francesa podría transformar el nivel de vida local. Algunos consideran que esto es una verdadera preocupación humanitaria derivada de los vínculos históricos de Francia con el Líbano; otros lo ven como un movimiento calculado para expandir la influencia francesa en una región estratégicamente importante."
 france_md.400.a: "Esta asociación beneficiará a nuestro pueblo"
 france_md.400.b: "Preferimos desarrollar nuestra propia infraestructura"
 france_md.401.t: "Iniciativa de Infraestructura Francesa en el Sur"
 france_md.401.d: "Francia se ha ofrecido a financiar importantes proyectos de infraestructura en el sur del Líbano, zona que ha sufrido considerablemente desde años de conflicto y abandono. La propuesta incluye hospitales, escuelas y modernización de redes eléctricas. Si bien la necesidad humanitaria es innegable, aceptar la presencia francesa en el sur podría complicar nuestras relaciones con otras potencias regionales que ven cualquier implicación occidental con sospecha."
 france_md.401.a: "El sur necesita desesperadamente esta inversión"
 france_md.401.b: "Las complicaciones políticas son demasiado grandes"
 france_md.402.t: "Programa de Inversión Industrial Francesa"
 france_md.402.d: "Las corporaciones francesas proponen una inversión significativa en la fabricación libanesa, prometiendo establecer fábricas que crearían empleo para miles de nuestros ciudadanos. El desempleo juvenil ha sido una crisis persistente, y estos trabajos podrían ayudar a frenar la marea de emigración que drena nuestro país de talento. Sin embargo, la dependencia industrial del capital francés podría remodelar nuestra economía en formas que benefician principalmente a París."
 france_md.402.a: "Los empleos son nuestra prioridad ahora mismo"
 france_md.402.b: "Debemos desarrollar nuestra propia base industrial"
 france_md.403.t: "Humanitario francés Misión al Líbano"
 france_md.403.d: "En respuesta a nuestra crisis actual, Francia se ha ofrecido a desplegar una misión humanitaria que trae suministros médicos, ayuda alimentaria y asistencia técnica. Las ONG y los organismos gubernamentales franceses coordinarían las actividades de socorro en colaboración con las autoridades locales. El Presidente Macron ha pedido personalmente apoyo internacional al Líbano, invocando los profundos vínculos históricos y culturales entre nuestros pueblos. Esta ayuda podría proporcionar un alivio desesperadamente necesario, aunque también aumenta la visibilidad e influencia francesa en un momento vulnerable."
 france_md.403.a: "Agradecemos esta asistencia."
 france_md.403.b: "Podemos manejar nuestros propios asuntos."
 france_md.500.t: "Los ataques de Lumio"
 france_md.500.d: "El Frente de Liberación Nacional de Córcega ha atacado un pequeño municipio de Lumio. El ataque no causó víctimas mortales, pero sí daños considerables en la pequeña infraestructura militar de la comuna, además de dejar heridos a varios gendarmes."
 france_md.500.a: "Un incidente preocupante, nada más"
 france_md.501.t: "Los atentados contra hoteles en Marsella"
 france_md.501.d: "En Marsella se ha llevado a cabo una serie de bombardeos menores. El Frente de Liberación Nacional de Córcega ha asumido la responsabilidad por las huelgas. Varias personas han sido hospitalizadas y lesionadas debido a los incidentes, pero no parece que tengan ninguna intención de lanzar nuevos ataques con bombas en otros hoteles."
 france_md.501.a: "No nos intimidaremos"
 france_md.504.t: "El atentado contra McDonald's"
 france_md.504.d: "Un pequeño grupo de nacionalistas bretones ha decidido poner una bomba en un McDonald's de Quévert (Bretaña). La bomba explotó matando a una persona en el McDonald's. La investigación en curso no ha aportado muchas pruebas de que se trate de un complot de mayor envergadura, pero se trata de un trágico suceso."
 france_md.504.a: "Una pérdida sin sentido de la vida"
 FRA_french_space_decision_category: "Programa espacial francés & CNES"
 FRA_french_space_decision_category_desc: "Espacio: la última frontera. Debemos empezar a conquistarla en serio si queremos seguir siendo una Gran Potencia a ojos del mundo, pero solo podemos lograrlo a un gran costo. Como no podemos estar seguros de beneficios económicos reales de un programa espacial a gran escala, ¡el pueblo francés debe seguir convencido de que merece la pena!\n§RSi el Entusiasmo por el Programa Espacial cae por debajo de 35, las operaciones espaciales cesarán.§! Además, cada semana nuestro §YEntusiasmo por el Programa Espacial§! caerá §Y0.1§! por el desinterés general en el §YCNES§!\n\n\nNuestro Entusiasmo por el Programa Espacial es actualmente: [?FRA.FRA_peoples_support|+50.0] \nIngresos semanales de las §YOperaciones y acciones espaciales§!: $[?FRA.FRA_space_income_var|+3]b"
 FRA_run_support_campaigns_short: "Lanzar una Campaña de Apoyo Público Corta"
 FRA_run_support_campaigns_short_desc: "Si nuestros principales científicos apenas están comenzando a descubrir las maravillas científicas que se encuentran en el espacio, entonces nuestra gente debe estar increíblemente confundida con todo esto. ¡Una breve campaña en las redes sociales debería obtener algo de apoyo para nosotros!"
 FRA_run_support_campaigns_long: "Lanzar una Campaña de Apoyo Público Larga"
 FRA_run_support_campaigns_long_desc: "Si nuestros principales científicos apenas están comenzando a descubrir las maravillas científicas que se encuentran en el espacio, entonces nuestra gente debe estar increíblemente confundida con todo esto. ¡Una detallada campaña educativa hará maravillas para el apoyo que recibimos de la gente!"
 FRA_balance_the_cnes_budget: "Reequilibrar el presupuesto del CNES"
 FRA_balance_the_cnes_budget_desc: "Nuestro programa espacial, el CNES, ha tenido problemas en el pasado con gasto ineficiente y pequeñas cantidades de corrupción. Deberíamos enviar a nuestros auditores del Estado para frenar el gasto excesivo y dar al CNES una reputación positiva que le hace mucha falta."
 FRA_launch_commercial_satellite: "Lanzar un Satélite Comercial"
 FRA_launch_commercial_satellite_desc: "Ahora que la era de la información está en pleno apogeo, las empresas privadas casi se atropellan por lanzar satélites. Si permitimos que algunas de estas empresas lancen desde nuestras instalaciones, deberíamos obtener beneficios económicos razonables. Ojo: ¡la gente puede empezar a cansarse de nuestro programa de orientación comercial!"
 FRA_prep_international_space_station: "Preparar un Lanzamiento a la ISS"
 FRA_prep_international_space_station_desc: "Si bien es un logro e iniciativa global, podemos prepararnos para enviar nuestros propios cohetes de suministro a la ISS, junto con nuestro propio personal."
 FRA_french_iss_launch: "Lanzamiento Francés a la ISS"
 FRA_french_iss_launch_desc: "Tras meses de planificación y preparación, nuestra misión de lanzadera de suministro está lista para el lanzamiento. Tres. Dos. Uno. ¡Despegue!"
 FRA_invest_LEB_decision_category: "Inversiones franco-libanesas"
 FRA_invest_LEB_decision_category_desc: "Los libaneses fueron en su día una de nuestras posesiones coloniales y, como tales, es imperativo que regresemos a la región e invirtamos en el gran país de [LEB.GetNameWithFlag]."
 FRA_LEB_invest_infrastructure_south: "Invertir en el sur del Líbano"
 FRA_LEB_invest_infrastructure_south_desc: "Desarrollar económicamente el sur del Líbano puede ayudar a prevenir la radicalización en la región. Cuantas más oportunidades económicas tenga la región, mejor para todas las partes."
 FRA_LEB_invest_infrastructure_north: "Invertir en el norte del Líbano"
 FRA_LEB_invest_infrastructure_north_desc: "El territorio económico del Líbano casi siempre se ha centrado en Beirut y los territorios circundantes. Ampliar e invertir en la parte norte del país producirá excelentes retornos."
 FRA_LEB_invest_civilian_factory: "Invertir en la industria civil libanesa"
 FRA_LEB_invest_civilian_factory_desc: "A los libaneses les vendría bien una inversión adicional en sus industrias civiles. El desarrollo de estas industrias podría contribuir al desarrollo económico del Líbano y a aumentar su autosuficiencia en la escena mundial."
 FRA_LEB_financial_help: "Proporcionar ayuda financiera al Líbano"
 FRA_LEB_financial_help_desc: "Deberíamos proporcionar al Líbano ayuda financiera para compensar algunas de sus deficiencias presupuestarias y de otro tipo."
 FRA_french_africa_decision_category: "Françafrique/Decisiones sobre África"
 FRA_french_africa_decision_category_desc: "África y Françafrique pueden ser a menudo sinónimos para nosotros. El continente africano necesita nuestra ayuda y nuestros cuidados y, como tal, debemos seguir haciendo de África un punto central de nuestra política exterior y de nuestros intereses."
 FRA_invest_in_NEPAD_education_decision: "Invertir en programas educativos de la NEPAD"
 FRA_invest_in_NEPAD_education_decision_desc: "Los programas de educación de la NEPAD podrían utilizar algunos fondos y apoyo adicionales. Pagaremos por el aumento de la financiación, pero los países africanos verán más reducciones del gasto en educación."
 FRA_invest_in_NEPAD_healthcare_decision: "Invertir en programas de salud de la NEPAD"
 FRA_invest_in_NEPAD_healthcare_decision_desc: "Los programas de atención sanitaria de la NEPAD podrían utilizar algunos fondos y apoyo adicionales. Pagaremos por el aumento de la financiación, pero los países africanos verán más reducción del gasto en atención médica."
 FRA_invest_in_NEPAD_social_care_decision: "Invertir en programas de atención social de la NEPAD"
 FRA_invest_in_NEPAD_social_care_decision_desc: "Los programas de atención social de la NEPAD podrían utilizar algunos fondos y apoyo adicionales. Pagaremos por el aumento de la financiación, pero los países africanos verán más reducciones del gasto en atención social."
 FRA_invest_in_NEPAD_economic_program_decision: "Invertir en los programas económicos de la NEPAD"
 FRA_invest_in_NEPAD_economic_program_decision_desc: "Los programas económicos de la NEPAD podrían utilizar algunos fondos y apoyo adicionales. Pagaremos por el aumento de la financiación, pero los países africanos verán un aumento de la productividad y la velocidad de construcción."
 FRA_extend_the_NEPAD_program_decision: "Ampliar el Programa NEPAD"
 FRA_extend_the_NEPAD_program_decision_desc: "El programa debe ampliarse. Podemos bombear algunos fondos adicionales en el programa para mantener el programa en marcha."
 FRA_space_enthusiasm_effect_tt: "Cambios Nuestro Programa §YEspacio Enthusiasm§! por [?temp_change|1+] (Current: [?FRA.FRA_peoples_support|1Y])"
 FRA_space_income_effect_tt: "Cambios Nuestro Programa §YIngreso Semanal§! por [?temp_change|3+] (Ingresos semanales actuales: $[?FRA.FRA_space_income_var|Y3+])"
 FRA_nepad_cost_increase_cost_effect_tt: "Cambios $FRA_idea_nepad_modifier$ Coste semanal por [?temp_change|-3] (Actual: $[?FRA.FRA_nepad_sponsor_weekly_cost|-3]b)"
 FRA_nepad_program_counter_currently_tt: "El Programa de la NEPAD está en curso (Días actuales: [?AFRICA_nepad_focus_FRA:days_left|Y0])"
 FRA_french_space_TT: "§REl efecto de este enfoque será revelado cuando el tiempo sea correcto§!"
 FRA_international_space_nasa_TT: "§GEste acuerdo requiere $10.0 billones de Francia y Estados Unidos§!"
 fra_has_enough_space_support_tt: "Tenemos suficiente §YSpace Programme Enthusiasm§! para llevar a cabo esta operación."
 FRA_cfa_franc_influence_gain_TT: "Cuando está influenciado por §Y [FRA.GetNameWithFlag] §!$foreign_influence_defense_modifier$ es reducido por §Y10%§!\n"
 FRA_cfa_franc_custodian_idea_TT: "Ingresos adicionales: $$[?additional_income_FRA_cfa_franc_custodian|+]\n"
 FRA_idea_Light_for_Europe_income_TT: "Ingresos adicionales: $$§G2.00§!"
 FRA_expansion_tooltip_TT: "§YEstos focos no mostrarán sus verdaderos efectos hasta que terminemos los árboles comunistas o nacionalistas.§!\n"
 FRA_french_canadian_TT1: "§YLa felicidad francocanadiense aumenta porque los franceses ayudan al gobierno canadiense.§!\n"
 FRA_french_canadian_TT2: "§YLa felicidad de los francocanadienses disminuye porque los franceses apoyan a los quebequenses.§!\n"
 FRA_idea_development_investment_tt: "Modifica $investment_cost_modifier$ y$investment_duration_modifier$ por§G5%§! para inversiones de §C[FRA.GetNameWithFlag]§!\n"
 FRA_idea_the_francosphere: "La Francosfera"
 FRA_idea_the_francosphere_desc: "La Francosfera es una comunidad política y global de personas y naciones francófonas. Es un mecanismo para ayudar a Francia a proyectar su influencia sobre las antiguas colonias, pero sigue siendo una cooperación entre las naciones francófonas."
 FRA_idea_administrative_reforms: "Reformas administrativas"
 FRA_idea_administrative_reforms_desc: "La maquinaria burocrática de Francia ha sido objeto de una serie de importantes reformas que han reducido algunos de sus costes y ampliado la capacidad del gobierno para promulgar y poner en práctica una serie de nuevas políticas."
 FRA_idea_french_armored_production: "Vehículos blindados franceses"
 FRA_idea_french_armored_production_desc: "Los vehículos blindados franceses están entre los mejores vehículos de combate del mundo. Debemos seguir manteniendo nuestra ventaja y continuar con la producción de vehículos blindados para contrarrestar el aumento de las nuevas amenazas mundiales."
 FRA_idea_central_decentral: "Reforma Burocrática"
 FRA_idea_central_decentral_desc: "Las competencias están siendo redobladas entre París y las regiones, y cada archivo transferido cuesta dinero y tiempo antes de que pague."
 FRA_idea_military_improvement_army: "La reforma militar - Ejército"
 FRA_idea_military_improvement_army_desc: "La primera de muchas reformas ha comenzado con el Ejército que tiene precedencia. Elegimos al ejército como el más importante que puede proteger las fronteras de nuestro país, así como las fronteras de nuestros aliados."
 FRA_idea_military_improvement_navy: "Reforma militar - Marina"
 FRA_idea_military_improvement_navy_desc: "La primera de muchas reformas ha comenzado con la Armada que tiene precedencia. Nuestra armada es importante para mantener vínculos cruciales de suministro, proyección militar y asegurar nuestros territorios de ultramar."
 FRA_idea_military_improvement_air_force: "Reforma militar - Fuerza Aérea"
 FRA_idea_military_improvement_air_force_desc: "La primera de muchas reformas ha comenzado con la fuerza aérea que tiene precedencia. La Fuerza Aérea ha sido elegida debido a su capacidad para impedir que alguien tome nuestro país del aire y brinde apoyo efectivo a las fuerzas navales y terrestres."
 FRA_idea_military_improvement_army_and_navy: "Reforma militar - Ejército y Marina"
 FRA_idea_military_improvement_army_and_navy_desc: "Nuestro próximo conjunto de reformas se centra en el ejército y la marina. El ejército y la armada deben reformarse mejor para la coordinación entre las fuerzas armadas, así como para la defensa eficaz de los buques y el uso más efectivo de los activos navales en coordinación con las fuerzas terrestres."
 FRA_idea_military_improvement_army_and_air_force: "Reforma militar - Ejército de Tierra y la Fuerza área"
 FRA_idea_military_improvement_army_and_air_force_desc: "Entre las reformas más importantes que podemos emprender se encuentran la formación y mejoras combinadas en materia de armamentos entre el ejército y la fuerza aérea. La interrelación de las dos ramas diferentes puede y garantizará nuestra victoria en los próximos conflictos."
 FRA_idea_military_improvement_air_force_and_navy: "Reforma militar - Fuerza Aérea y la Marina"
 FRA_idea_military_improvement_air_force_and_navy_desc: "La fuerza aérea y la marina son tan inseparables como indispensables. Las mejoras orientadas hacia las dos ramas nos permitirán proteger nuestros intereses, así como los intereses de nuestros amigos, aliados y nuestra población civil aquí en Europa y en todo el mundo."
 FRA_idea_the_french_military: "Ejército Francés Reformado"
 FRA_idea_the_french_military_desc: "Después de años de dejar que los militares caigan en desorden, finalmente nos hemos empujado a reformar nuestro ejército envejecido. ¡Ahora podemos seguir presionando que Francia es un país con el que no se puede recortar y un país para ser amigo!"
 FRA_idea_space_agency_name: "CNES"
 FRA_idea_space_agency_name_desc: "El Centro Nacional de Estudios Espaciales (CNES) es el nombre de la agencia espacial nacional francesa. Fue fundada en 1961 por el entonces presidente Charles de Gaulle, marcando la tercera agencia espacial más antigua del mundo, detrás de la NASA y el programa espacial de la Unión Soviética y su sucesor, Roscosmos."
 FRA_idea_reformed_cnes: "CNES Reformado"
 FRA_idea_reformed_cnes_desc: "El Centro Nacional de Estudios Espaciales (CNES) es el nombre de la agencia espacial nacional francesa. Fue fundada en 1961 por el entonces presidente Charles de Gaulle, marcando la tercera agencia espacial más antigua del mundo, detrás de la NASA y el programa espacial de la Unión Soviética y su sucesor, Roscosmos. Cambios presupuestarios recientes y otros cambios políticos han visto CNES reformado en la versión que conocemos hoy."
 FRA_idea_cnes_failing: "Problemas Presupuestarios del CNES"
 FRA_idea_cnes_failing_desc: "El CNES ha tenido varias carencias presupuestarias en el último año, lo que ha provocado un gran desdén en el sector, ya que la Unión Europea propone su propia agencia espacial y de otro tipo."
 FRA_idea_prep_the_launch: "Preparando el Lanzamiento"
 FRA_idea_prep_the_launch_desc: "El CNES está preparando el lanzamiento de un vehículo espacial. Pasará algún tiempo hasta que esté listo para el lanzamiento."
 FRA_idea_space_research: "Investigación Espacial"
 FRA_idea_space_research_desc: "La investigación espacial es una de las formas más beneficiosas de comprender mejor el mundo que nos rodea. Centrarnos en nuestra investigación en el Espacio puede garantizar que estemos a pasos agigantados por delante de nuestros adversarios y de la competencia."
 FRA_idea_nasa_partnership: "Asociación Francesa-NASA"
 FRA_idea_nasa_partnership_desc: "La asociación entre la agencia espacial de Estados Unidos, la NASA, y la nuestra, el CNES, no sólo es provechosa, sino de interés mutuo. Ampliar y debatir con nuestro aliado puede contribuir a mejorar la investigación científica en todos los ámbitos y ayudar a expandir las dos agencias hacia nuevas fronteras."
 FRA_idea_Light_for_Europe: "La luz de Europa"
 FRA_idea_Light_for_Europe_desc: "Superan las corrientes nucleares y renovables sobre los interconectadores. Los vecinos pagan por lo que la rejilla no necesita."
 FRA_cfa_franc_custodian: "Custodio del franco CFA"
 FRA_cfa_franc_custodian_desc: "Creamos el Franco CFA para proteger nuestras colonias de la devaluación del Franc post-W2. A pesar de que ya no usamos el franco, seguimos siendo el custodio de la moneda de los países del África occidental. Mantienen la mitad de sus reservas de tesorería con nosotros y como tal podemos capitalizar los activos que nos proporciona.\n\n§Y Ganamos el 0,5% del PIB total§! de las naciones que tienen §YCFA Franc§! como §YIngresos adicionales§!. El actual §Y PIB total§! de §YCFA Franc Users§!: [?FRA.FRA_cfa_franc_gdp_total]b"
 the_eco: "El Eco"
 the_eco_desc: "La OCE fue la moneda propuesta en África Occidental entre las naciones de la CEDEAO y la zona monetaria del África occidental. Los titulares de francos CFA de habla francesa también trataron de apoyar la nueva moneda. Unifica a la región de manera monetaria permitiendo un comercio más y más fácil de los bienes y un medio unificado para el cual las naciones puedan reunirse."
 FRA_idea_the_french_pillar_of_counterterroism: "Pilar de la lucha antiterrorista"
 FRA_idea_the_french_pillar_of_counterterroism_desc: "El terrorismo va en aumento y depende de nosotros, el pueblo de Francia, frenar la marea y protegernos a nosotros mismos, a Europa y a todos aquellos que puedan resultar perjudicados. El futuro de Francia con el auge del extremismo se combatirá no sólo con nuestras palabras, sino con la fuerza de nuestras armas al luchar contra las crecientes amenazas que se ciernen sobre nuestra nación."
 FRA_idea_the_french_foreign_legion: "La Legión Extranjera Francesa"
 FRA_idea_the_french_foreign_legion_desc: "La Legión Extranjera de Francia es un cuerpo de élite del Ejército francés que consta de varias especialidades como infantería, caballería, ingenieros o tropas aerotransportadas. La Legión Extranjera es una fuerza de combate única, ya que permite alistarse a todos los extranjeros y está altamente entrenada."
 FRA_idea_Grand_ambitions: "Grandes ambiciones para África"
 FRA_idea_Grand_ambitions_desc: "África está madura para su conquista y tenemos que avanzar y declarar nuestras nuevas grandes ambiciones. Es de suma importancia que sigamos consolidando nuestra posición en África para asegurarnos no sólo el presente, sino el futuro de todos los franceses."
 FRA_idea_development_investment: "Desarrollo de Inversión"
 FRA_idea_development_investment_desc: "[FRA.GetNameWithFlag] nos proporciona ayuda económica para ayudarnos a desarrollar nuestra nación."
 AFRICA_idea_nepad_modifier: "Programa de desarrollo de la NEPAD"
 AFRICA_idea_nepad_modifier_desc: "La Nueva Alianza para el Desarrollo de África (NEPAD) es un programa de desarrollo económico elaborado por la Unión Africana con asociados de la Unión Europea, China, Japón y otros miembros del G8. Estamos especialmente interesados en el desarrollo de la NEPAD y nos hemos convertido en su principal partidario, monetaria y políticamente, dentro de la Unión Europea. Debemos estudiar la posibilidad de ayudar a ampliar el programa y aumentar su financiación y apoyo para ayudar a toda África.\n\n[FRA.GetNameWithFlag] es el principal patrocinador de este programa."
 AFRICA_idea_nepad_modifier_tt: "Cuando está influenciado por §Y[FRA.GetNameWithFlag]§!, el $foreign_influence_defense_modifier$ se reduce en un §Y10%§!\n"
 FRA_idea_nepad_modifier: "Patrocinador del Programa de Desarrollo de la NEPAD"
 FRA_idea_nepad_modifier_desc: "La Nueva Alianza para el Desarrollo de África (NEPAD) es un programa de desarrollo económico elaborado por la Unión Africana con asociados de la Unión Europea, China, Japón y otros miembros del G8. Estamos especialmente interesados en el desarrollo de la NEPAD y nos hemos convertido en su principal partidario, monetaria y políticamente, dentro de la Unión Europea. Debemos estudiar la posibilidad de ayudar a ampliar el programa y aumentar su financiación y apoyo para ayudar a toda África.\n\n[FRA.GetNameWithFlag] es el principal patrocinador de este programa y, como tal, obtendremos beneficios adicionales como el aumento de la influencia extranjera en las naciones que actualmente se benefician del programa.\n"
 FRA_idea_nepad_modifier_cost_tt: "Nuestro patrocinio del Desarrollo de la NEPAD de la UA cuesta $[?FRA.FRA_nepad_sponsor_weekly_cost|-3]b semanalmente."
 FRA_unrestricted_subjugation_idea: "Subyugación sin restricciones"
 FRA_unrestricted_subjugation_idea_desc: "Las colonias que poseíamos nos han proporcionado una riqueza increíble y un inmenso respeto en la escena mundial. Debemos volver a nuestras antiguas costumbres en algunos aspectos y empezar a reafirmarnos frente a otras naciones y proteger lo que debería ser nuestro por derecho. La subyugación puede producirse de diversas formas, como la fuerza militar, la fuerza diplomática y muchas más. Los obstáculos que nos impiden hacer tal cosa deben y deben ser eliminados."
 FRA_SYR_anti_assad_regime_message_idea: "Mensajes contra el régimen de Assad"
 FRA_SYR_anti_assad_regime_message_idea_desc: "[FRA.GetNameWithFlag] ha comenzado a transmitir y proporcionar propaganda contra el Gobierno sirio. El mensaje ha comenzado a socavar al gobierno y continúa radicalizando a los jóvenes contra nuestra clase dominante. También está mostrando que el gobierno es susceptible a la influencia extranjera."
 FRA_educational_development_idea: "Desarrollo educativo"
 FRA_educational_development_idea_desc: "[FRA.GetNameWithFlag] está ayudando con programas educativos en nuestro país. El desarrollo educativo alivia algún costo al tiempo que nos permite modernizar y mejorar nuestra demanda educativa actual."
 FRA_resource_prospects_idea: "Exploración de recursos"
 FRA_resource_prospects_idea_desc: "[FRA.GetNameWithFlag] colabora actualmente en la prospección de los recursos de nuestro país para ofrecer a la economía más vías de desarrollo."
 FRA_SYR_escalation_from_the_damascus_spring_idea: "Escalada desde la Primavera de Damasco"
 FRA_SYR_escalation_from_the_damascus_spring_idea_desc: "[FRA.GetNameWithFlag] ha continuado exponiendo la propaganda sobre convertirse en democrática en nuestra nación. Los esfuerzos continúan socavando a nuestro líder [SYR.GetLeader] mientras estamos tratando de estabilizar la nación."
