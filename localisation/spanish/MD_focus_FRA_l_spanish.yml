 FRA_corporate_systems_events.6.c_tt: "Salud de Alcatel: §R-0.9§!\nPresión de la deuda corporativa: §R+0.6§!"
 FRA_corporate_systems_events.6.d: "Alcatel-Lucent propone un reenfoque decisivo en redes IP, sistemas de nube e infraestructura de banda ultra. El plan podría restaurar un núcleo tecnológico viable, pero sólo después de otra reestructuración exigente."
