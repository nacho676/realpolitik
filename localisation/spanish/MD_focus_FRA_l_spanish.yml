 france_md.555.t: "Guía de Senderos Políticos"
 france_md.555.d: "La mayoría de los caminos en el árbol político pueden ser desbloqueados al tener que ganar las elecciones de 2002 o elegirlos manualmente en elecciones posteriores. Sin embargo, algunos caminos son inicialmente inaccesibles por razones de realismo y lógica. Puede acceder a estos caminos siguiendo esta guía: \nPara desbloquear los caminos bonapartistas y realistas: Elegir el Frente Nacional / Rally Nacional (Populista Nacional). Completar el enfoque: «Enfoque sobre la Inseguridad» un evento en el que una facción radical le ofrece su ayuda. Permitirles ganar terreno y dejar que el golpe de Estado os aleje del poder, seréis capaces de llevar a los bonapartistas o realistas al poder. \nPara la Comuna de Francia, el proceso es el mismo: completar el enfoque «Reformar Más Que Revolución» y dejar que los extremistas os arrojen del poder. \nPara el camino de Francia indagada: Elegir al Partido Socialista (socialismo occidental). Complete el enfoque «Cut With Unions». Esto desencadenará el colapso del Partido Socialista y desbloqueará la ruta de Francia desarmada. \nOtros cambios de partido se diseminan a lo largo de varios eventos, pero por ahora sólo son cosméticos."
 france_md.555.a: "Gracias por guiarme."
 france_md.556.t: "Una disolución exitosa"
 france_md.556.d: "La asamblea ya no reflejaba verdaderamente lo que nuestros ciudadanos deseaban para nuestro país. Disolver la asamblea mostró a nuestros conciudadanos lo mucho peor que pudo haber sido la situación del gobierno. Tomaron la decisión correcta al elegirnos sobre los extremistas."
 france_md.556.a: "Fue una gran idea."
