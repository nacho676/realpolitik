 FRA_corporate_systems_events.3.d: "Alcatel y Lucent han propuesto una fusión transatlántica destinada a unir sus carteras de equipos de red. El acuerdo promete escala, pero también plantea preguntas difíciles sobre la integración y el control estratégico francés."
