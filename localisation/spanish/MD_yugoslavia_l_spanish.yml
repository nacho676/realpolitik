 yugo_nost_rise_tt: "§Y+[?temp_yugo_nost_gain|0]§! Yugonostalgia in [THIS.GetFlag] [THIS.GetName]"
 yugo_consensus_tt: "Cada Estado sucesor sobreviviente tiene al menos 75% de Yugonostalgia"
