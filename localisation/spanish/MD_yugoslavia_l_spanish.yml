 yugo_dominant_tt: "Mantenemos la mayor influencia en las antiguas repúblicas y lideramos el renacimiento yugoslavo"
 yugo_dominant_none: "ningún miembro dominante"
 yugo_sends_invites_tt: "Envía invitaciones a todos los estados post-Yugoslav restantes para formar una nueva federación"
 yugo_invite_accept_tt: "El Estado que responde se incorpora a la federación yugoslava restaurada."
 yugo_invite_reject_tt: "El Estado que responde sigue siendo independiente y la federación gana un objetivo de guerra de unificación en su contra."
 yugoslavia.1.t: "Invitación a Yugoslavia"
 yugoslavia.1.d: "[FROM.GetName] nos ha invitado a unirse a una federación yugoslava restaurada. La aceptación significa la incorporación, mientras que la negativa puede convertir su campaña de unificación en nuestra contra."
 yugoslavia.1.a: "Únete a la federación"
 yugoslavia.1.b: "Rechazar la unificación"
 yugoslavia.30.t: "Una nación recurre a Yugoslavia"
 yugoslavia.30.d: "El apoyo a una federación yugoslava restaurada ha pasado tres cuartas partes del público. La idea que fue enterrada en los años noventa es una vez más un proyecto político vivo aquí."
 yugoslavia.30.a: "El sueño perdura"
 yugoslavia_news.20.t: "El Renacimiento yugoslavo"
 yugoslavia_news.20.d: "Años de guerra y gobierno ultranacionalista han cultivado en un renacimiento geopolítico dentro de los Balcanes casi una década después del colapso de Yugoslavia, ya que una nación dentro de la región ha comenzado a empujar para su recuperación. \n\nLos desfiles y las empresas de estilo retro han aparecido [GetYugoDominantName] con banners que abrazan 'Brotherhood and Unity', un cambio de estrella de los enfrentamientos étnicos de los 90. Si bien la renovación indica el impulso para un Balcanes unidos, no está claro si el movimiento seguirá creciendo o desvaneciéndose, persistiendo como una canción de cisne para una nación perdida."
 yugoslavia_news.20.a: "La región está cambiando."
 formed_yugoslavia: "De Yugoslavia"
 formed_yugoslavia_desc: "La federación restaurada ha asumido la responsabilidad de integrar el territorio, las instituciones y los pueblos constitutivos de las ex repúblicas yugoslavas."
 yugoslavia_restored: "Yugoslavia"
 yugo_bloc_dominant: "Líder del Revival yugoslavo"
 yugo_bloc_dominant_desc: "Tenemos más influencia en las antiguas repúblicas que en cualquier otro Estado sucesor. Nuestra capital es el punto de encuentro natural para charlas sobre una federación restaurada."
 yugo_bloc: "Reunificación de Yugoslavia"
 yugo_bloc_desc: "El apoyo a una Yugoslavia restaurada debe alcanzar el 75 por ciento en cada Estado sucesor sobreviviente antes de que pueda proceder la unificación.El estado con mayor influencia en las antiguas repúblicas conduce el renacimiento: §Y[GetYugoDominantName]§!.\n\n$yugo_nost_overview$"
 yugo_bloc_map: "Reunificación de Yugoslavia"
 yugo_promote_nostalgia: "Promover Yugonostalgia en [FROM.GetName]"
 yugo_promote_nostalgia_desc: "Financiar intercambios culturales, medios compartidos y conmemoraciones conjuntas para forjar apoyo a una federación restaurada. Requiere una influencia significativa sobre el Estado objetivo."
 yugo_promote_own_nostalgia: "Cultivar la yugonostalgia en casa"
 yugo_promote_own_nostalgia_desc: "Financiar conmemoraciones nacionales, currículos escolares y medios públicos que presenten bajo una luz favorable a la antigua federación. Más lento y costoso que promover la nostalgia en el extranjero, pero no necesita un punto de apoyo en otro Estado."
 yugo_form_federation: "Convocar la Federación"
 yugo_form_federation_desc: "Convocar a todos los Estados sucesores supervivientes a una federación yugoslava restaurada. Los Estados que se nieguen dan a la federación un objetivo de guerra de unificación. Solo el miembro dominante puede convocar las conversaciones, y solo cuando todos los sucesores apoyen la reunificación."
 news.85.t: "Yugoslavia Restaurada"
 news.85.desc: "Una federación yugoslava restaurada ha sido proclamada después de que sus arquitectos aseguraran apoyo en las antiguas repúblicas. El nuevo estado afirma que el legado político y estratégico de la federación se disolvió durante el decenio de 1990."
 news.85.a: "Un estado balcánico regresa"
 yugoslavia_not_restored_tt: "Yugoslavia §Rno§! ya ha sido restablecida por otro Estado sucesor"