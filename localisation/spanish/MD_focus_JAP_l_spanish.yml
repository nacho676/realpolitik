 JAP_zombie_case_files_down_3_tt: "§YCase Files§!: §R-3§!"
 JAP_zombie_case_files_downsize_tt: "§YCaso de archivos§!: [?JAP_zombie_case_files|0] / 10"
 JAP_zombie_case_files_fusion_tt: "§YCaso de archivos§!: [?JAP_zombie_case_files|0] / 3"
