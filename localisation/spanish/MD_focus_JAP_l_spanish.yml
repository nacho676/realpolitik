 Japan.104.f: "Crecimiento de los restauradores imperiales"
 JAP_electronics.320.t: "Qué costes del engranaje de metal"
 JAP_electronics.320.d: "Konami ha enviado Metal Gear Solid 2 y Silent Hill 2 en el mismo año, sobre los presupuestos sólo un éxito puede justificar, de equipos construidos alrededor de directores individuales. Los deportes y las líneas de tarjetas ganan constantemente y no necesitan ningún auteur en absoluto. Financiar ambos es lo que la empresa no puede permitirse seguir haciendo."
 JAP_electronics.320.a: "Fondo de los equipos dirigidos por directores"
 JAP_electronics.320.b: "Financiar los deportes anuales y las líneas de tarjetas"
 JAP_electronics.321.t: "Los gabinetes son más que discos"
 JAP_electronics.321.d: "Konami puede tomar el control de Hudson Soft y expandirse en pachislot y armarios arcade, donde una máquina en un piso gana más en un año que un título de consola gana en su vida. Las plantas y el espacio del suelo son activos reales en Japón. Mantener un editor de software mantiene a la empresa fuera de un negocio que la prensa de juegos no respeta."
 JAP_electronics.321.a: "Compre en máquinas de entretenimiento"
 JAP_electronics.321.b: "Mantener un editor de software"
 JAP_electronics.322.t: "Colección Dragón"
 JAP_electronics.322.d: "El juego de cartas de Konami en GREE gana más por desarrollador que cualquier equipo de consola en el edificio, y tomó meses en lugar de años para hacer. Trasladar los estudios a la sociedad y móvil sigue el dinero. Mantener los equipos de consola financiados significa pagar por los largos proyectos fuera de los cortos."
 JAP_electronics.322.a: "Mover el desarrollo a las redes sociales y móviles"
 JAP_electronics.322.b: "Mantenga los equipos de consola financiados"
 JAP_electronics.323.t: "Kojima se va"
 JAP_electronics.323.d: "Konami ha terminado Metal Gear Solid V, cancelado Silent Hills, y puede disolver el estudio que hizo ambos y quitar el nombre del director de la caja. El presidente ya ha dicho en público que el móvil es donde reside el futuro del negocio. Mantener el estudio significa financiar a un productor que cuesta más de lo que gana la división."
 JAP_electronics.323.a: "Disolver el estudio y retirar el crédito"
 JAP_electronics.323.b: "Mantener el estudio y el crédito"
 JAP_electronics.324.t: "eFootball"
 JAP_electronics.324.d: "Konami reconstruyó Pro Evolution Soccer como un servicio gratuito para jugar y lo envió en un estado sus propios jugadores valorados más bajo que cualquier otra cosa en la plataforma. El catálogo de atrás de Silent Hill, Metal Gear y Castlevania está sentado sin usar, y rehacer que cuesta dinero real. Los servicios de funcionamiento y los clubes de fitness ganan sin ningún riesgo."
 JAP_electronics.324.a: "Finan el catálogo de vuelta"
 JAP_electronics.324.b: "Ejecutar los servicios y los clubes"
 JAP_electronics.325.t: "Lo que Konami Became"
 JAP_electronics.325.d: "Veinticinco años de elección entre los directores, los gabinetes y el teléfono han resuelto lo que es Konami y lo que exporta el entretenimiento japonés."
 JAP_electronics.325.a: "Casas de desarrollo restauradas"
 JAP_electronics.325.b: "Un editor de remake y revival"
 JAP_electronics.325.c: "Un operador de entretenimiento y fitness"
 JAP_electronics.325.e: "Un negocio de licencias móviles"
 JAP_konami_restored_development_houses: "Restableed Development Houses"
 JAP_konami_restored_development_houses_desc: "Konami financia directores de nuevo y envía los juegos que esos directores quieren hacer. Cuesta más que el negocio móvil que haya hecho y es la razón por la que alguien fuera de Japón sabe el nombre."
 JAP_konami_remake_publisher: "Remake y Revival Publisher"
 JAP_konami_remake_publisher_desc: "Konami reconstruye lo que ya posee para las personas que la tocaron por primera vez. El catálogo es finito y el público no es, bastante, aún."
 JAP_konami_amusement_fitness_operator: "Atracciones y Fitness Operador"
 JAP_konami_amusement_fitness_operator_desc: "Pachislot armarios, pisos de arcade y la cadena más grande de gimnasio clubes en Japón, todo ello construido sobre propiedad y máquinas Konami posee de manera directa. Los juegos son un brazo de licencia de un negocio físico."
 JAP_konami_mobile_licensing: "Negocios de licencias móviles"
 JAP_konami_mobile_licensing_desc: "Konami alquila Yu-Gi-Oh!, Metal Gear y Silent Hill a quien los desarrolle y recoja en los términos. Nada se hace en casa y nada tiene que ser."
 JAP_electronics.330.t: "Modems libres en la esquina"
 JAP_electronics.330.d: "SoftBank puede repartir Yahoo! Los módems BB en las esquinas de la calle Tokio y venden banda ancha por debajo del costo hasta que NTT agarre los saltos locales. Masayoshi Son espera perder dinero en cada suscriptor durante años. Reventar las líneas de NTT a un margen es rentable inmediatamente y deja el monopolio exactamente donde está."
 JAP_electronics.330.a: "Devuelve los módems y tómate las pérdidas"
 JAP_electronics.330.b: "Reventar las líneas del titular"
 JAP_electronics.331.t: "Vodafone Japan"
 JAP_electronics.331.d: "Vodafone venderá su red japonesa para 1,75 billones de yenes y SoftBank puede pedir prestado casi todo, en lo que sería el mayor comprador apalancado Japón ha visto. Compra una red móvil nacional y los suscriptores en ella. La deuda está asegurada en un negocio que SoftBank nunca ha operado."
 JAP_electronics.331.a: "Borrow contra la red y comprarla"
 JAP_electronics.331.b: "Mantente fuera del móvil"
 JAP_electronics.332.t: "Sprint"
 JAP_electronics.332.d: "SoftBank puede pagar 21.6 billones de dólares para Sprint, el tercer transportista americano, y heredar una red de reconstrucción que nadie ha costado correctamente. Pondría a una empresa japonesa dentro del mercado americano por primera vez en esta escala. El mismo capital gastado en compuestos caseros contra una red de SoftBank ya funciona."
 JAP_electronics.332.a: "Comprar el portaaviones americano"
 JAP_electronics.332.b: "Reinvest en casa"
 JAP_electronics.333.t: "Cientos dólares de billón"
 JAP_electronics.333.d: "SoftBank puede recaudar cien mil millones de dólares, la mayor parte del fondo saudí de inversión pública, y escribir cheques que ningún fondo de riesgo haya escrito nunca. El Fondo Visión haría de Masayoshi Son el mayor inversor tecnológico vivo. Invertir en el balance es más lento, más pequeño y responder a nadie en Riad."
 JAP_electronics.333.a: "Aumentar el fondo en dinero del Golfo"
 JAP_electronics.333.b: "Invierte el balance"
 JAP_electronics.334.t: "WeWork"
 JAP_electronics.334.d: "El listado de WeWork se ha colapsado en el camino al mercado y SoftBank tiene la mayor participación en él. Rescatar a la empresa significa tomar una escritura en los miles de millones y decirles a los accionistas que el juicio estaba equivocado. Dejar que falle protege todo lo demás SoftBank ha respaldado y confirma cada duda acerca de cómo esas apuestas fueron elegidas."
 JAP_electronics.334.a: "Rescatarlo y tomar la escritura"
 JAP_electronics.334.b: "Deja que fracase y protege el resto"
 JAP_electronics.335.t: "Lo que SoftBank Beca"
 JAP_electronics.335.d: "Un cuarto de siglo de tomar prestado contra las redes y apostar el producto en las empresas de otras personas ha solucionado lo que es SoftBank y cómo el capital japonés llega al resto del mundo."
 JAP_electronics.335.a: "Una empresa de tecnología global"
 JAP_electronics.335.b: "Un subscriptor de la empresa"
 JAP_electronics.335.c: "Un grupo de transporte nacional"
 JAP_electronics.335.e: "Un revendedor de banda ancha"
 JAP_softbank_global_technology_holding: "Holding Tecnológico Global"
 JAP_softbank_global_technology_holding_desc: "SoftBank posee transportistas en dos continentes y estacas minoritarias en varias cientos de empresas que no funciona. Lo que vale depende de lo que el mercado cree que esas apuestas valen este trimestre."
 JAP_softbank_venture_underwriter: "Aventure Underwriter"
 JAP_softbank_venture_underwriter_desc: "SoftBank escribe el cheque nadie más escribirá y toma el asiento de la junta que viene con él. Los retornos llegan de forma desigual y las pérdidas llegan a la vez."
 JAP_softbank_domestic_carrier_group: "Grupo de transporte nacional"
 JAP_softbank_domestic_carrier_group_desc: "Fibre, espectro e intercambios en todo Japón, comprado con deuda y pagado fuera de las suscripciones. SoftBank posee la infraestructura en lugar de una posición en alguien que lo hace."
 JAP_softbank_broadband_reseller: "Revendedor de banda ancha"
 JAP_softbank_broadband_reseller_desc: "SoftBank vende acceso a líneas que pertenecen al titular y compite solo con precio. El margen es delgado y el negocio nunca ha necesitado un rescate."
