 senbu_occupation_law_fake_idea: "Administración Senbu Pacification"
 senbu_occupation_law_fake_idea_desc: "Los oficiales de asuntos civiles dirigen los distritos ocupados a través de comandantes locales más que guarnición, restaurando mercados, escuelas y distribución de arroz antes de exigir producción. Cumplimiento crece constantemente y el requisito de la guarnición permanece bajo, pero la mano ligera deja una resistencia organizada más espacio que un régimen punitivo."
 JAP_sabotaged_russians: "Instalaciones rusas sabotaje"
 JAP_usa_trade_pressure: "Presión comercial estadounidense"
 JAP_article_nine_balance_of_power_category: "Artículo 9"
 JAP_article_nine_balance_of_power_category_desc: "La renuncia a la guerra en el Artículo Nueve de la Constitución no es una cuestión resuelta sino un argumento en curso entre el gabinete, los tribunales, la alianza americana y el público. Cada reinterpretación cambia el equilibrio entre una postura estrictamente defensiva y un ejército normal."
 JAP_cool_japan_doctrine_desc: "El diseño japonés no es extraño porque no coincidió con un estándar extranjero. Es extraño porque fue hecho para los clientes japoneses por personas que nunca antes consideraron la alternativa, y eso es precisamente lo que hace que vale la pena comprar.El ministerio detiene la cultura del embalaje como un escaparate del hardware y comienza a exportar la diferencia en sí mismo.\n\n§REste camino sigue §Y$JAP_galapagos_syndrome$§! permanentemente.§! Sólo §Y$JAP_world_integration$§! lo elimina, y los dos son mutuamente excluyentes: Japón converge en las normas del mundo o vende el mundo propio."
 JAP_galapagos_sphere_modifier: "Cultural Esfera"
 JAP_galapagos_sphere_modifier_desc: "El ministerio mantiene un recuento trimestral de los países donde la influencia japonesa es del veinte por ciento o superior y trata al total como una figura exportadora en su propio derecho. Cada país de la lista ensancha al público que ya compra diseño japonés sin que se le pida entenderlo primero, lo cual vale algo para las delegaciones comerciales y algo más a las empresas que los siguen. El recuento se toma una vez cada trimestre y el rendimiento se mueve con él. Una esfera que deja de crecer deja de pagar."
 JAP_galapagos_sphere_tt: "§YEsfera cultural§!: [?JAP_galapagos_sphere_count|Y0] países que llevaban §G20%§! influencia japonesa o más, contaban cada trimestre una vez que se adopta la Doctrina §YHecho Japón§!. El rendimiento se eleva a la mitad con §Y$JAP_electronics_superpower$§! y en un cuarto más con §Y$JAP_home_electronics$§!."
 JAP_cool_japan_sphere_payout_tt: "Cada trimestre el ministerio cuenta los países donde la influencia japonesa §Y§! se sitúa en §G20%§! o superior e informa del total como la §YEsfera cultural§!. Cada uno añade §G+1%§! §Y influencia extranjera§! y §G+0.2%§! §Y retorno a la inversión§!, pagado a través de §YEsfera cultural§! y creciendo a medida que se ensancha la esfera. §Y$JAP_electronics_superpower$§! levanta el rendimiento a la mitad de nuevo, y §Y$JAP_home_electronics$§! lo eleva en otro trimestre.\n-------------\nEsto no toca el §YResearch Drift§!. La doctrina compra llegar al extranjero; no cierra la brecha de estándares en el hogar."
 JAP_creative_industries_office: "Oficina de promoción de industrias creativas"
 JAP_creative_industries_office_desc: "El Ministerio de Economía, Comercio e Industria destaca la Oficina de Promoción de Industrias Creativas para tratar la animación, el diseño, la moda y los alimentos como sectores exportadores en lugar de como cultura. El Fondo Cool Japón sigue con cincuenta mil millones de yenes y un mandato para co-invertir en lugar de subvencionar, comprando a pisos minoristas extranjeros, plataformas de streaming asiáticas y empresas de distribución que ninguna junta japonesa hubiera aprobado por sí sola. Los funcionarios hacen que los capitalistas de riesgo pobres y el Fondo posteen años de pérdidas, pero toma la primera pérdida en los proyectos capital privado entonces sigue adelante."
 JAP_visit_japan_campaign: "Visite Japan Campaign"
 JAP_visit_japan_campaign_desc: "La Campaña Visita Japón se relanzó detrás de un objetivo que ningún ministerio cree: cuarenta millones de visitantes extranjeros al año. El gobierno afloja el régimen de visa para los viajeros asiáticos, exime la cosmética y la medicina del impuesto al consumo en la caja, y comercializa el país en las partes de él que no traducen. Nada sobre Japón se hace menos japonés para venderlo."
 JAP_content_export_offensive: "Exportar contenido Offensive"
 JAP_content_export_offensive_desc: "La Ley Básica de Propiedad Intelectual y la Ley de Promoción de Contenidos colocan la animación, los juegos y el manga como activos estratégicos, y la industria sigue tratando a su audiencia en el extranjero como piratería para ser tolerada mientras que los traductores de fans hacen la distribución. El gobierno construye el canal legal en su lugar: liberación simultánea, subtitulación profesional y titulares de derechos que negocian como bloque en vez de un estudio a la vez. El mercado de ultramar ya es la mitad más grande de los ingresos del anime, y casi ninguno de ellos está siendo recogido."
 JAP_washoku_to_the_world: "Washoku al mundo"
 JAP_washoku_to_the_world_desc: "Con washoku inscrito en la lista de Patrimonio Cultural Inmaterial de la UNESCO, el gobierno promueve no un plato sino una práctica: el ingrediente estacional, el arreglo, la mesa del Año Nuevo. El instinto anterior del ministerio era la policía, y el esquema para certificar auténticos restaurantes japoneses en el extranjero fue abandonado una vez que la prensa extranjera lo bautizó la policía sushi. Los rollos californianos y los ramen de Bangkok venden más arroz japonés, soja y sake que cualquier inspección podría, y el objetivo de exportación trillion-yen descansa en ese comercio."
 JAP_japan_house_network: "La red de la casa Japón"
 JAP_japan_house_network_desc: "El Programa JET ha enviado miles de jóvenes extranjeros a través de escuelas y ayuntamientos japoneses y los ha devuelto a sus hogares con fluidez, y ahora se sientan en ministerios extranjeros, bufetes de abogados y salas de prensa. Japón House da a esa red una puerta de entrada: una galería, una biblioteca, una tienda y un restaurante en una calle cara en Sao Paulo, Los Ángeles y Londres, dirigido por el Ministerio de Relaciones Exteriores y deliberadamente vacío de banderas y declaraciones políticas. Las solicitudes para cursos de japonés se triplicaron en cada ciudad después de su apertura."
 JAP_gross_national_cool: "General Cool"
 JAP_gross_national_cool_desc: "El Síndrome de Galápagos se mantiene: las especificaciones siguen siendo japonesas y la deriva de investigación continúa. Lo que los ministerios han construido en su lugar es un país que gana en el extranjero a través de lo que sólo puede hacer, los estudios, las cocinas, las casas de juego, las oficinas de diseño y los millones que vienen cada año simplemente para mirar. El aislamiento nunca fue curado, sólo puesto a trabajar."
 JAP_cool_japan_spirit_kept_tt: "§Y Síndrome de los galapagos§! §R permanece en su lugar§!. Japón ha elegido vender su diferencia en lugar de curarla"
 JAP_electronics_anchor_bonus_tt: "§YElectronics Superpower§!: El hardware japonés lleva contenido japonés a cada mercado, y el retorno crece con él"
 JAP_world_integration: "Integración con el Mundo"
 JAP_world_integration_desc: "Japón deja de ser una isla. Los estándares son reescritos al borrador de otra persona, los calendarios arancelarios bajan, los ministerios dejan de preguntar si una oferta extranjera es apropiada, y el capital que pasó treinta años yendo por este país comienza a entrar en él. Lo que se entrega es la protección misma, el mercado cautivo que hizo barato los bienes de consumo y la pared contra influencia extranjera ningún rival jamás escalado, y las empresas japonesas ahora deben ganar un mercado que solían poseer."
 JAP_structural_reform_zones: "Zonas especiales de reforma estructural"
 JAP_structural_reform_zones_desc: "En lugar de argumentar la línea de código regulatorio por línea contra los ministerios que lo escribieron, el gobierno permite una prefectura o un pueblo aplicar para ser exonerado de una regla y luego probar que el cielo no cae. Los agricultores elaboran por debajo del volumen mínimo nacional, las empresas mixtas administran escuelas y tierras agrícolas de arrendamiento, y las Zonas Especiales Estratégicas Nacionales señalan el mismo instrumento en Tokio para la financiación, Fukuoka para las reglas de empleo inicial, y Kansai para los juicios médicos. Es desregulación minorista en lugar de mayorista, y es el único método que realmente ha movido cualquier cosa."
 JAP_corporate_governance_code: "Código de Gobernanza Corporativa"
 JAP_corporate_governance_code_desc: "La revisión de Ito pone un número en el fracaso: 8 por ciento la devolución de la equidad es el mínimo que una empresa japonesa debe dejar claro para valer el capital que consume, y la mayoría de ellos no lo están aclarando. The Stewardship Code le dice a los fondos de pensiones y a los aseguradores que voten sus acciones como propietarios en lugar de invitados, y el Código de Gobernanza Corporativa sigue términos de cumplimiento o explicación. Los directores externos se elevan hacia un tercio de la junta directiva y las recepciones cruzadas comienzan a ser vendidas, lo que no hace que las firmas japonesas sean extranjeras tanto como legibles para cualquier persona dispuesta a comprar una parte."
 JAP_economic_partnership_agreements: "Acuerdos de asociación económica"
 JAP_economic_partnership_agreements_desc: "La agricultura ha mantenido el veto sobre la política comercial japonesa desde la guerra, y los exportadores ahora están perdiendo licitaciones a las empresas coreanas sólo en la línea arancelaria. Japón cierra el mayor acuerdo bilateral que alguna parte ha firmado con la Unión Europea, luego toma la presidencia de la Asociación Transpacífico después de que Washington salga, suspendiendo las cláusulas americanas en lugar de borrarlas. RCEP sigue y coloca Japón, China y Corea del Sur dentro de un único marco comercial por primera vez, con el arroz protegido en cada uno de ellos."
 JAP_open_capital_markets: "Abrir los mercados de capital"
 JAP_open_capital_markets_desc: "Medida contra el tamaño de su economía, el Japón tiene menos capital extranjero que casi cualquier país desarrollado, retenido por los derechos cruzados, la revelación imprevisible y cuarenta años de funcionarios que tratan una oferta extranjera como un problema a ser manejado. Las reparaciones son inglamorosas y casi enteramente administrativas: Invierte escritorios de Japón en JETRO para caminar una firma extranjera a través de la incorporación, resultados publicados en inglés el día que aparecen en japonés, y una pista de residencia basada en puntos para las personas que una subsidiaria extranjera debe moverse aquí para abrir en absoluto. La cuestión de las personas en su forma completa pertenece a §Y$JAP_an_open_nation$§!, y ésta es la más estrecha de si la capital puede encontrar la puerta."
 JAP_the_third_opening: "La Tercera Apertura"
 JAP_the_third_opening_desc: "Japón abandona la última de las protecciones que lo hicieron una economía separada. El gobierno abre el mercado nacional a la competencia extranjera, reescribe sus normas a los proyectos internacionales y permite que el capital extranjero compre en los mismos términos que el capital japonés. El mercado cautivo y el muro contra la influencia externa se rinden tanto para un país que negocia como uno signatario entre muchos."
 JAP_galapagos_dissolution_tt: "El síndrome levanta. Japón §R♪ ♪ ♪§! los bienes de consumo baratos un mercado cautivo suministrado y el alto §Rdefensa contra la influencia extranjera§! ese aislamiento pagado, y §Gcobertores§! la deriva de la investigación, las penas de inversión y el límite máximo de su propia influencia en el extranjero:"
 JAP_an_open_nation_bonus_tt: "§Y$JAP_an_open_nation$§!: un país que ya se ha abierto al pueblo del mundo tiene mucho menos que discutir cuando se abre a la capital mundial"
