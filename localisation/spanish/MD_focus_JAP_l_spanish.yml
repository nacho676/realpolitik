 Japan_economy.29.c: "Tratarlo como un fracaso aislado"
 Japan_economy.33.t: "La sonda resume"
 Japan_economy.33.d: "La revisión encontró lo que los comentarios encuentran. Se ha nombrado un nuevo líder, los archivos han sido devueltos, y la investigación vuelve con el viento más bien contra él que antes. Las firmas han tenido seis meses para prepararse, y las han utilizado."
 Japan_economy.33.a: "Empieza de nuevo."
 Japan_economy.34.t: "El Registro está limpio"
 Japan_economy.34.d: "El último de los prestatarios insolvente ha sido herido. Tomó años, y el costo fue pagado en quiebras, en desempleo, y en un gobierno que gastó la mayor parte de su capital político insistiendo en el dolor era necesario. Lo que queda atrás es una economía donde el crédito va a las empresas que pueden pagarlo, y donde un balance significa lo que dice."
 Japan_economy.34.a: "Vale la pena el precio."
 Japan_economy.35.t: "Nada Failed"
 Japan_economy.35.d: "Los nombres insolvente se han ido del registro. Ninguno de ellos entró en quiebra. Fueron absorbidos en grupos más grandes por acuerdo ministerial, y los grupos más grandes ahora llevan las plantas duplicadas, los laboratorios duplicados, y el personal que se les dijo el viernes que trabajaban para un competidor el lunes. No se perdieron empleos y no se admitió nada. La industria japonesa está consolidada, estable y más lenta de lo que era."
 Japan_economy.35.a: "El acuerdo celebrado."
 JAP_electronics_resilience_complete_TT: "§Y Resiliencia electrónica§! se sitúa en §G5 §! o superior (actualmente [?JAP_electronics_resilience|Y0])"
 JAP_electronics_war_won_tt: "§Y$JAP_model_competition$§! termina para el bien y ya no puede regresar, lo que sea que Seúl, Taipei y Shanghai hagan a continuación."
 JAP_seismic_retrofitting: "Programa nacional de readaptación sísmica"
 JAP_seismic_retrofitting_desc: ", la Ley de Normas de Edificios de 1981 establece un suelo, no un techo y dos tercios de las existencias de vivienda lo preceden. Un programa nacional de reacondicionamiento funciona a través de la región del país por región, financiando el aislamiento básico para hospitales y ayuntamientos, muros de corte y chaquetas de columna para escuelas, y el sujetador de acero para las elevadas autopistas que colapsaron tan espectacularmente en Kobe. La construcción se vuelve más lenta y más querida dondequiera que hayan sido los inspectores, pero una región reacondicionada recorre un gran temblor con su infraestructura intacta."
 JAP_news.04.t: "Japón se mueve a dejar el artículo 9 detrás"
 JAP_news.04.d: "La Dieta ha recibido el informe final del Comité de Transición de Defensa, y con ella Japón ha dado un paso decisivo lejos del artículo 9 de su constitución posterior a la guerra. Durante décadas, la cláusula que renuncia a la guerra y al potencial de mantenimiento de la guerra fue gestionada mediante reinterpretaciones sucesivas en lugar de enmiendas: las Fuerzas de Autodefensa fueron declaradas constitucionales como una capacidad mínima necesaria, los despliegues en el extranjero se justificaron como apoyo logístico y de reconstrucción, y la prohibición de la autodefensa colectiva se redujo hasta que los buques y aeronaves aliados pudieran ser defendidos bajo un conjunto limitado de condiciones. La conclusión del comité es que este cuerpo acumulado de interpretación ya no se puede estirar para cubrir los requisitos de seguridad de Japón, y que la restricción debe dejarse a un lado en lugar de reescribir una vez más.\n\nLas consecuencias prácticas son inmediatas. Restrictions on the size and composition of Japanese formations fall away, the Self-Defense Forces are free to plan for operations beyond the defense of the home islands, and Tokyo recovers the sovereign instruments of war and alliance leadership that every other major power takes for granted. Funcionarios japoneses han destacado la continuidad, describiendo el cambio como reconocimiento formal de los derechos de un país normal en lugar de una ruptura con setenta años de moderación. En Pekín, Seúl y Pyongyang la lectura es muy diferente, y Washington ahora se encuentra aliado a un socio capaz de mucho más que el acceso base y el apoyo a la retarea. Cualquier cosa que prevalezca el encuadre, la arquitectura de seguridad del Asia oriental ha sido reescrita en una sola tarde en la Dieta."
 JAP_news.04.a: "La era pacifista en Tokio ha terminado."
 JAP_seismic_retrofit: "Retrofitting sismic"
 JAP_seismic_retrofit_desc: "Cada estructura de esta región ha sido estudiada, reforzada o reconstruida para soportar un gran terremoto. Los hospitales se sientan sobre aisladores de base, las escuelas más antiguas han sido chaquetas o derribados, y los muelles de autopista llevan collares de acero. Los códigos más estrictos, las inspecciones obligatorias y las fundaciones más pesadas retrasan cada nuevo proyecto, pero la región ya no teme el próximo temblor."
 JAP_seismic_retrofit_category: "Retrofitting sismic"
 JAP_seismic_retrofit_category_desc: "Hacer una región a prueba de terremotos es un esfuerzo de ingeniería civil de una década, prefectura por prefectura y edificio por edificio. Una vez que una región ha sido reforzada se libra por completo de futuros temblores, al costo permanente de una construcción más lenta bajo los códigos más estrictos."
 JAP_seismic_retrofit_decision: "Retrofit [FROM.GetName]"
 JAP_seismic_retrofit_decision_desc: "Estudie todas las estructuras de la región y llevárselo a las normas sísmicas modernas. Dos años de trabajo y una parte sustancial de la producción nacional, a cambio de inmunidad permanente ante los terremotos y una pena duradera para la velocidad de construcción local."
 JAP_zombie_companies_1: "Empresas zombis"
 JAP_zombie_companies_1_desc: "Años de la paciencia han mantenido a empresas sin fines lucrativos y sobre deuda vivas con crédito barato, atando capital, trabajo y gestión que necesitan las industrias más sanas. Nadie ha escrito una pérdida, nadie ha cerrado una planta, y nadie puede decir cuánto del sistema bancario es una ficción.\n-------------\nAt §YProgreso de la Reestructuración Corporativa§! §G30§! Usted puede tomar §Y$JAP_restructure_next_tranche$§! para facilitar este espíritu nacional un paso. §Y$JAP_corporate_reform_category$§! para las cifras actuales."
 JAP_zombie_companies_2: "Empresas zombis: Wind-Down"
 JAP_zombie_companies_2_desc: "El primer tramo ha sido resuelto. Los préstamos han sido escritos en lugar de rodar, lo peor de las empresas insolvente han pasado por los tribunales, y el capital que se sentó muerto durante una década vuelve a moverse. Lo que queda es más grande, mejor conectado, y mucho más difícil de tocar.\n-------------\nAt §YProgreso de la Reestructuración Corporativa§! §G60§! Usted puede tomar §Y$JAP_restructure_next_tranche$§! para facilitar este espíritu nacional un paso más allá. §Y$JAP_corporate_reform_category$§! para las cifras actuales."
 JAP_zombie_companies_3: "Empresas zombis: Últimos Ledgers"
 JAP_zombie_companies_3_desc: "Sólo los últimos libros todavía están abiertos. Las firmas restantes son las más profundas relaciones bancarias y la cubierta más política, y cada una de ellas espera superar al gobierno que vino por él. El arrastre en la economía más amplia es ahora modesto, pero aún no se ha ido.\n-------------\nAt §YProgreso de la Reestructuración Corporativa§! §G85§! el enfoque de resolución al final de su camino elegido §Geliminaciones§! este espíritu nacional para el bien. §Y$JAP_corporate_reform_category$§! para las cifras actuales."
 JAP_saburoku_audit_campaign: "Auditar los Acuerdos Saburoku"
 JAP_saburoku_audit_campaign_desc: "El artículo 36 de la Ley de Normas Laborales permite que una empresa exceda la jornada legal de ocho horas presentando un acuerdo con el representante de sus trabajadores, y durante décadas el techo escrito en esos acuerdos fue lo que al empleador le dio por escribir. Ahora los inspectores sacan las presentaciones y las cotejan con los registros de asistencia, los registros de tarjetas y los datos de acceso a edificios, y la Ley de Reforma del Estilo de Trabajo les da una cifra con la cual medir: cuarenta y cinco horas al mes, trescientas sesenta al año."
 JAP_paid_leave_enforcement_campaign: "Hacer cumplir los Cinco Días"
 JAP_paid_leave_enforcement_campaign_desc: "A los trabajadores japoneses se les concedieron vacaciones anuales y no las tomaban, porque tomarlas te marcaba. Desde 2019 la obligación corre en sentido contrario: un empleador cuyo personal tenga diez días o más debe asegurar que cinco se usen realmente, y debe fijar él mismo las fechas si el trabajador no lo hace. El ministerio revisa los registros de vacaciones y multa a las empresas cuyos libros muestran derechos sin tocar."
 JAP_equal_pay_audit_campaign: "Auditar las brechas salariales"
 JAP_equal_pay_audit_campaign_desc: "Cuatro de cada diez trabajadores japoneses son no regulares y hacen el mismo trabajo junto a un colega permanente por cerca del sesenta por ciento del sueldo y sin bonificaciones. La Ley de Empleo a Tiempo Parcial y de Duración Determinada obliga al empleador a explicar por escrito cualquier diferencia de trato cuando se le pida, y las explicaciones se recopilan y comparan en todo un sector en lugar de dejar que mueran dentro de una sola empresa."
 JAP_inspector_sweep_campaign: "Suda a los peores delincuentes"
 JAP_inspector_sweep_campaign_desc: "Las Oficinas de Inspección de Normas Laborales eligen un sector, llegan sin previo aviso y pasan por los plazos de cada firma en él. El ministerio publica los nombres de las empresas encontradas en incumplimiento grave, que cuesta a un reclutador mucho más que la multa, porque un graduado que ha leído la lista no se aplica."
 JAP_keidanren_review_campaign: "Revisar el cumplimiento de la Carta"
 JAP_keidanren_review_campaign_desc: "La Carta de Comportamiento Corporativo de Keidanren compromete a sus miembros a prácticas de trabajo que la mayoría de ellos no auditan y ninguno publica. La federación está persuadida a ejecutar un ciclo de cumplimiento con los rendimientos reales adjuntos, miembro por miembro, y a reportar el agregado al ministerio. Nada es obligatorio y nada se llama, por lo que los grupos de empresa están de acuerdo con ello."
 JAP_shunto_wage_round_campaign: "Respaldar la ofensiva salarial de primavera"
 JAP_shunto_wage_round_campaign_desc: "Cada primavera las filiales de Rengo plantean una cifra a los empleadores y estos responden con una menor, y durante dos décadas el componente de aumento base de ese acuerdo fue cero. El gobierno presiona a los grupos empresariales para que concedan un aumento real, porque un trabajador pagado lo suficiente para vivir deja de aceptar las horas extra que lo están matando, y acompaña la presión con alivio fiscal para las empresas que se muevan primero."
 JAP_health_stock_listing_campaign: "Ampliar el listado de gestión sanitaria"
 JAP_health_stock_listing_campaign_desc: "El ministerio y la Bolsa de Valores de Tokio denominan conjuntamente a un puñado de firmas cotizadas cada año como Stocks de Salud y Productividad, en teoría que una empresa que no agota su personal es una mejor tenencia a largo plazo. Ampliar la selección y publicación de la puntuación convierte la salud del lugar de trabajo en algo que un administrador de fondos puede precio, lo que llega a las juntas que un inspector de trabajo nunca lo hará."
 JAP_shift_rotation_campaign: "Subvenciona el turno de la mañana"
 JAP_shift_rotation_campaign_desc: "Adelantar la jornada laboral, pagar el recargo por las primeras horas en lugar de las últimas y cortar la luz de la planta por la tarde para que quedarse no sea una opción. Itochu lo hizo y descubrió que su productividad subía, y con ella su natalidad; el Estado paga ahora parte del costo de transición a cualquier empresa dispuesta a seguirla."
 JAP_overcome_the_slump: "Impulsar la recuperación"
 JAP_overcome_the_slump_desc: "Las medidas ya en marcha han movido lo suficiente del libro mayor para que valga la pena consolidar. El apoyo facturado como temporal está escrito en el presupuesto base, los ministerios dejan de tratar la caída como la suposición de trabajo, y las empresas se les dice claramente que la demanda se espera mantener. Cada paso se alivia §Y$JAP_entrenched_demand_shortfall_idea_1$§! por un nivel; tomado al final, cierra la larga caída para el bien."
 JAP_demand_recovery_progress_tier_1_TT: "§YDemand Recovery Progress§! es al menos §G30§!"
 JAP_demand_recovery_progress_tier_2_TT: "§YDemand Recovery Progress§! es al menos §G60§!"
 JAP_demand_recovery_progress_complete_TT: "§YDemand Recovery Progress§! es al menos §G85§!"
 JAP_demand_shortfall_resolved: "La caída de Japón §Ydemand§! se ha superado"
 JAP_restructure_next_tranche: "Resolver el siguiente tramo"
 JAP_restructure_next_tranche_desc: "Se ha revisado suficiente parte del libro mayor como para cerrar un lote de forma definitiva. El regulador publica los casos resueltos, los bancos contabilizan las pérdidas que venían aplazando y las empresas de ese tramo o emergen solventes o dejan de existir. Cada tramo alivia en un paso §Y$JAP_zombie_companies$§!; la liquidación final llega con el enfoque al final de la vía elegida."
 JAP_enforce_next_reforms: "Hacer cumplir las siguientes reformas"
 JAP_enforce_next_reforms_desc: "Las medidas ya contenidas en los libros son puestas en vigor en lugar de dejarse como intenciones. Los techos que fueron asesorados se vuelven ejecutables, las exenciones escritas para los mayores empleadores se reducen, y la inspección se da al personal para dar seguimiento a lo que encuentra. Cada ronda se alivia §Y$JAP_karoshi_crisis$§! por un paso; la crisis es levantada para bien por el enfoque al final de su camino elegido."
 JAP_galapagos_research_drift_recover_tt: "§YResearch Drift§! $RIGHT|+=%1$, nunca más §Y0§!"
 JAP_galapagos_research_drift_down_tt: "§YLa investigación Drift§! empeora por $RIGHT|+=%1$ esta revisión, y nunca puede caer más allá §R-15%§!"
 JAP_galapagos_drift_review_mission: "Los Estándares Gap"
 JAP_galapagos_drift_review_mission_desc: "El Ministerio de Economía, Comercio e Industria mantiene una evaluación permanente de hasta qué punto la especificación japonesa se ha alejado de la especificación que utilizan sus clientes, e informa cada treinta días de la cifra. Cada informe es peor que el último, porque la divergencia se complica mientras no se hace nada al respecto y los órganos de certificación siguen escribiendo primero la cláusula nacional. La apertura inferior §Y§! se sienta más rápido que la brecha se ensancha; a §G100§! deja de ampliarse.\n-------------\nLa evaluación cierra para siempre cuando Japón alcanza §G85§! §Y Apertura§! en el camino §Y$JAP_world_integration$§!. Nada más lo termina."
 JAP_galapagos_cure_condition_TT: "§YApertura§! stands §G85§! o superior (actualmente [?JAP_galapagos_openness|Y0]), disolver §Y$JAP_galapagos_syndrome$§!"
 JAP_cool_japan_sphere_count_mission: "Cuenta trimestral de la esfera"
 JAP_cool_japan_sphere_count_mission_desc: "Una vez por trimestre la Oficina de Promoción de las Industrias Creativas cuenta todos los países donde la influencia japonesa alcanza el veinte por ciento o más y registra el total como cifra de exportación. Las delegaciones comerciales planifican el siguiente trimestre en torno a esa lista, y las empresas que las siguen al extranjero planifican en torno a las delegaciones. Una esfera que deja de crecer deja de pagar, y el recuento es el único lugar donde eso se ve antes que en los ingresos."
 JAP_cool_japan_sphere_count_step_tt: "§YCultural Sphere§!: [?JAP_galapagos_sphere_count|Y0] países que llevan §G20%§! Influencia japonesa o más en el último conteo. §G+1%§! §Yinfluencia extranjera§! y §G+0.2%§! §Yrentabilidad de la inversión§!, criado por la mitad con §Y$JAP_electronics_superpower$§! y en un cuarto más §Y$JAP_home_electronics$§!."
