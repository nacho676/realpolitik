 JAP_choice: "Reinicio político"
 JAP_choice_desc: "En medio de un estancamiento prolongado y un agotamiento institucional, la confianza en la política se ha debilitado, mientras que la necesidad de reformas se ha hecho cada vez más acuciante. Para que este país avance, primero debe definir un rumbo claro para la gobernanza y establecer un marco para la toma de decisiones."
 JAP_left: "La izquierda japonesa"
 JAP_left_desc: "El objetivo de la política no es solo el crecimiento económico, sino también proteger el sustento y la dignidad de las personas. Garantizaremos la transparencia y supervisaremos rigurosamente a quienes ostentan el poder, fortaleceremos el poder de negociación de los trabajadores y la red de seguridad social, y reduciremos la desigualdad y la inseguridad. Al promover una gobernanza que no ignore los derechos humanos y al impulsar una transición hacia la energía sostenible, nuestro objetivo es reconstruir la sociedad japonesa."
 JAP_left_TT: "§Y¡Puedes aumentar considerablemente el índice de aprobación de uno de los partidos de izquierda!\nSin embargo, si se trata del partido gobernante, el aumento seguirá siendo pequeño.§!"
 JAP_information_disclosure: "Fortalecer la divulgación de información"
 JAP_information_disclosure_desc: "Para restablecer la confianza en la política y la administración pública, garantizaremos la divulgación exhaustiva de la información y fortaleceremos la creación, conservación y publicación de documentos oficiales. Esto eliminará los caldo de cultivo para la corrupción y la colusión, hará que las decisiones políticas sean más transparentes y facilitará el avance de las reformas."
 JAP_left_party_TT: "Una de las siguientes condiciones debe ser verdadera:\n§Y$JAP.liberalism$§! está en el poder.\n§Y$JAP.liberalism_alt$§! está en el poder.\n§Y$JAP.neutral_Social$§! está en el poder.\n§Y$JAP.Neutral_Communism$§! está en el poder.\n§Y$JAP.anarchist_communism$§! está en el poder.\n"
 JAP_management_documents: "Gestión estricta de documentos oficiales"
 JAP_management_documents_desc: "Organizaremos y conservaremos los registros de las decisiones políticas, los historiales de los procedimientos administrativos y los documentos en poder de las instituciones públicas bajo un estándar unificado, al tiempo que reforzamos el sistema de gestión. Al evitar la dispersión de registros y su manejo inadecuado, y al mejorar la verificabilidad y la continuidad administrativa, nuestro objetivo es mejorar la fiabilidad y la eficiencia práctica de las operaciones gubernamentales."
 JAP_digital_archiving: "Archivo Digital de Documentos Oficiales"
 JAP_digital_archiving_desc: "digitalizaremos los registros oficiales y los gestionaremos centralmente para simplificar los procedimientos de búsqueda, intercambio y preservación. Al alejarnos de prácticas centradas en el papel, reduciremos las cargas administrativas y los costos de gestión y reintegraremos el gasto público."
 JAP_independent_audits: "Auditoría independiente completa"
 JAP_independent_audits_desc: "Garantizaremos la total independencia de los órganos de auditoría y estableceremos un sistema de supervisión libre de injerencias de políticos o burocracia. Al facilitar la detección temprana de la colusión y las faltas de conducta, avanzaremos en los esfuerzos contra la corrupción, y al restablecer la confianza en la política, también fortaleceremos la fuerza motriz detrás de la aplicación de las políticas."
 JAP_eliminating_amakudari: "Eradicate Amakudari"
 JAP_eliminating_amakudari_desc: "Terminaremos con la práctica de amakudari, que fácilmente fomenta la colusión entre burócratas y corporaciones, y tomaremos un escalpelo para los intereses creados arraigados. Al mejorar la transparencia en los nombramientos y fortalecer la competencia, reduciremos la corrupción al mismo tiempo que reduciremos la ineficiencia y aumentaremos la productividad."
 JAP_disclosure_of_political_funding: "Divulgación completa de la financiación política"
 JAP_disclosure_of_political_funding_desc: "Divulgaremos a fondo la corriente de fondos políticos y haremos visibles los donantes y el gasto. Esto reducirá el margen de dinero opaco para entrar en la política y promover los esfuerzos anticorrupción, al tiempo que fortalecerá la resiliencia contra las operaciones de influencia de actores extranjeros."
 JAP_protecting_human_rights: "Proteger los derechos humanos"
 JAP_protecting_human_rights_desc: "Pondremos la protección de la dignidad y los derechos de cada persona en el centro de la gobernanza. Al corregir la discriminación y el trato injusto y construir una sociedad donde las personas puedan vivir con paz mental, fortaleceremos la cohesión y estabilidad internas."
 JAP_same_sex_partnerships: "Legalizar las alianzas de Same-Sex"
 JAP_same_sex_partnerships_desc: "Reconoceremos legalmente a los socios del mismo sexo y estableceremos un sistema que reduzca las desventajas cotidianas en áreas como el consentimiento médico, la vivienda y la herencia. Al respetar diversas formas de familia y aliviar las divisiones sociales, fortaleceremos la estabilidad interna."
 JAP_employment_disabilities: "Ampliar el empleo de las personas con discapacidad"
 JAP_employment_disabilities_desc: "Crearemos un entorno en el que las personas puedan trabajar independientemente de su discapacidad, y ampliaremos el apoyo al empleo y los ajustes razonables en el lugar de trabajo. Al ampliar las oportunidades de empleo, fortaleceremos la fuerza laboral y al promover la participación social, también contribuiremos a la estabilidad nacional."
 JAP_prevent_domestic_violence: "Esfuerzos para prevenir la violencia doméstica"
 JAP_prevent_domestic_violence_desc: "Fortaleceremos la prevención y detección temprana de la violencia doméstica, y ampliaremos los servicios de asesoramiento y el apoyo protector. Al romper el ciclo de abuso y reducir la inseguridad y la violencia en el hogar, mejoraremos la estabilidad social."
 JAP_protecting_labor_union: "Proteger los derechos sindicales"
 JAP_protecting_labor_union_desc: "Garantizaremos claramente los derechos de los sindicatos y crearemos un entorno en el que se puedan llevar a cabo adecuadamente consultas colectivas de negociación y gestión laboral. Al reflejar las voces de los lugares de trabajo en instituciones y gestión empresarial, promoveremos la estabilidad en el empleo y las condiciones laborales."
 JAP_subcontracto: "Curb Subcontractor Bullying"
 JAP_subcontracto_desc: "Resolveremos las demandas injustas de reducción de precios, los pagos tardíos y los cambios unilaterales en términos contractuales impuestos a los subcontratistas, y construiremos un entorno comercial justo. Al proteger la base de ingresos de las pequeñas y medianas empresas, fortaleceremos la salud de toda la cadena de suministro y contribuiremos a la estabilidad social."
 JAP_pressure_wage_increases: "Presión para aumentos salariales"
 JAP_pressure_wage_increases_desc: "Alentaremos a las empresas a recaudar salarios y aumentar los ingresos del hogar. Al apoyar el consumo y aliviar la inseguridad en la vida cotidiana, fortaleceremos la estabilidad social y apuntaremos a un ciclo virtuoso en la economía."
 JAP_regulation_temporary_agency_work: "Endurecimiento de los reglamentos sobre el trabajo temporal del Organismo"
 JAP_regulation_temporary_agency_work_desc: "Curaremos el abuso del trabajo de agencia temporal y promoveremos la estabilidad en el empleo y mejores condiciones de trabajo. Priorizando un entorno de trabajo seguro y a largo plazo con eficiencia a corto plazo, fortaleceremos la estabilidad social."
 JAP_ban_non_regular_employment: "Prohibición del empleo no reglamentario"
 JAP_ban_non_regular_employment_desc: "Reformaremos las prácticas de empleo que dependen del trabajo no regular y la transición a un sistema en el que todos puedan obtener un empleo estable y un trato justo. Al reducir la inseguridad en la vida cotidiana y frenar la división social, fortaleceremos la estabilidad nacional."
 JAP_redistribution: "Prior Redistribución"
 JAP_redistribution_desc: "Nos desplazaremos hacia una política que priorice corregir la desigualdad de ingresos y la inseguridad económica, asignando recursos más generosamente a quienes necesitan apoyo. Mediante la redistribución, frenaremos la división social, aumentaremos el sentido de seguridad de las personas y apuntaremos a una gobernanza estable."
 JAP_reducing_medical_costs: "Reducir los costos médicos fuera del bolsillo"
 JAP_reducing_medical_costs_desc: "Reduciremos los gastos médicos fuera de la caja y construiremos un sistema en el que las personas puedan recibir tratamiento necesario sin vacilación. Al aliviar la ansiedad financiera para los hogares y reducir el aumento de las disparidades en materia de salud, fortaleceremos la estabilidad social."
 JAP_care_workers: "Paga de trabajo profesional superior & Condiciones"
 JAP_care_workers_desc: "Mejoraremos los salarios y las condiciones de trabajo para los trabajadores del cuidado, y promoveremos la contratación y retención de la fuerza laboral. Fortalecer la continuidad de la atención, aliviar la carga sobre las familias y apoyar la participación de la fuerza laboral, contribuiremos a la estabilidad social."
 JAP_housing_support: "Ampliar el apoyo a la vivienda"
 JAP_housing_support_desc: "Ampliaremos el apoyo a la vivienda para reducir las cargas de alquiler y ayudar a las personas a asegurar una vivienda estable. Al aliviar la inseguridad de la vivienda y apoyar la estabilidad en la vida cotidiana, frenaremos la división social y fortaleceremos la estabilidad interna."
 JAP_student_loans: "Reducir las cargas de préstamos estudiantiles"
 JAP_student_loans_desc: "Reduciremos la carga de reembolso de los préstamos estudiantiles y reduciremos las barreras a la educación superior y recalificaremos. Al promover el desarrollo del capital humano como inversión en el futuro, apoyaremos los progresos en la investigación y la tecnología."
 JAP_nuclear_phaseout: "Adiós al átomo"
 JAP_nuclear_phaseout_desc: "En lugar de apostar por el próximo terremoto, la nación permite que los reactores cierren a medida que sus licencias caducan y verter el dinero en eficiencia y renovables. El camino es más costoso a corto plazo y más seguro en el largo. Ninguna ola de la costa amenazará a un segundo Fukushima.\n-------------\nIdea toda la flota nuclear y abre el Programa de Transformación Verde §Y§!, que sustituye a esa pérdida de producción por generación Japón no tiene que importar y por demanda ya no tiene que cumplirse. Cada proyecto también desmantela los reactores en su región para siempre."
 JAP_leading_disarmament: "Diplomacia de Desarme"
 JAP_leading_disarmament_desc: "Haremos pilares del desarme y la desescalificación de nuestra política exterior y buscaremos la estabilidad regional mediante el diálogo y el fomento de la confianza. Daremos prioridad a las soluciones que no dependen de la fuerza y el trabajo para mejorar las relaciones con otros países."
 JAP_restricting_arms_exports: "Restringir las exportaciones de armas"
 JAP_restricting_arms_exports_desc: "Limitaremos las exportaciones de armas y señalaremos claramente una postura diplomática que es menos probable que alimente las tensiones militares. Al priorizar el desarme y el fomento de la confianza, avanzaremos en el diálogo hacia la estabilidad regional."
 JAP_principle_of_no_armed_forces: "Reafirmar el Principio de No Fuerzas Militares"
 JAP_principle_of_no_armed_forces_desc: "Reafirmaremos el principio de no mantener fuerzas militares y claramente establecer una postura de gobierno que no dependa del poder militar. Pondremos el pacifismo en el centro de nuestra política y enfatizaremos la seguridad mediante la diplomacia y la cooperación internacional."
 JAP_abrogating_us_japan_security_treaty: "Abolir el Japón EE.UU. Tratado de Seguridad"
 JAP_abrogating_us_japan_security_treaty_desc: "Nos retiraremos del marco de seguridad de los Estados Unidos en Japón y pasaremos a una política de seguridad independiente que no dependa de la dependencia de los Estados Unidos. Esto ampliará la libertad de nuestra política exterior y reafirmará más claramente nuestra soberanía e independencia."
 JAP_dissolving_sdf: "Disolver las Fuerzas de Autodefensa"
 JAP_dissolving_sdf_desc: "Disolveremos las Fuerzas de Autodefensa y cambiaremos hacia la gobernanza que no confía en el poder militar. Mediante la reorientación de recursos y esfuerzos previamente dedicados a la defensa del sector civil, priorizaremos el fortalecimiento de la industria y las bases de la vida cotidiana y aceleraremos el desarrollo nacional."
 JAP_army_delete_TT: "§R ¡Todas las fuerzas terrestres serán removidas!§!"
 JAP_right: "Ala derecha de Japón"
 JAP_right_desc: "Ponemos de relieve la capacidad estatal y el orden social, promoviendo una mayor seguridad pública, respuesta a las crisis y una política exterior y de seguridad que ponga en frente y centro los intereses nacionales. Procuramos el crecimiento mediante la reforma reglamentaria y la revitalización de las actividades empresariales, y buscamos reconstruir el país sobre una base de tradición y valores comunitarios."
 JAP_right_TT: "§YUsted puede aumentar enormemente la calificación de aprobación de uno de los partidos de derecha!\nSin embargo, si es el partido gobernante, el aumento seguirá siendo pequeño.§!"
 JAP_strengthen_military_power: "Política para fortalecer el poder militar"
 JAP_strengthen_military_power_desc: "A la luz de los cambios en el entorno de seguridad, estableceremos claramente el fortalecimiento de nuestra postura de defensa como política nacional. Al mejorar la disuasión, evitaremos las amenazas antes de que materialicen y demuestren nuestro compromiso de proteger la seguridad pública y la soberanía nacional."
 JAP_right_party_TT: "Uno de los siguientes debe ser cierto:\n§Y$JAP.conservatism$§! está en el poder.\n§Y$JAP.socialism$§! está en el poder.\n§Y$JAP.Neutral_conservatism$§! está en el poder.\n§Y$JAP.Neutral_conservatism2$§! está en el poder.\n§Y$JAP.Neutral_conservatism3$§! está en el poder.\n§Y$JAP.Neutral_conservatism4$§! está en el poder.\n§Y$JAP.Neutral_Libertarian$§! está en el poder.\n§Y$JAP.Nat_Populism$§! está en el poder.\n"
 JAP_allow_overseas_deployment: "Permitir el Despliegue de Ultramar del SDF"
 JAP_allow_overseas_deployment_desc: "Teniendo en cuenta la situación internacional y la cooperación con los aliados, estableceremos claramente una política que permita el despliegue en el extranjero por las Fuerzas de Autodefensa. Al participar en las misiones internacionales, fortaleceremos la disuasión e influencia y protegeremos más proactivamente los intereses y la seguridad nacionales."
 JAP_international_missions: "Marco jurídico para la Internacional Misiones"
 JAP_international_missions_desc: "Pondremos en marcha la base jurídica y los procedimientos para participar en misiones internacionales, estableciendo un sistema en el que las Fuerzas de Autodefensa puedan funcionar conforme a normas coherentes. Esto reducirá la incertidumbre sobre el terreno y permitirá una ejecución más fiable de la cooperación internacional."
 JAP_revising_use_weapons: "Reglas de examen sobre la utilización de armas"
 JAP_revising_use_weapons_desc: "Examinaremos las normas y los procedimientos para el uso de armas a fin de que coincidan con las realidades de las misiones internacionales y la respuesta a las crisis. Al aclarar el alcance de la autoridad y la responsabilidad necesarias para llevar a cabo misiones, estableceremos un sistema en el que las Fuerzas de Autodefensa puedan protegerse adecuadamente a sí mismas y a otros."
 JAP_exclusive_defense: "Mantener una postura defensiva exclusiva"
 JAP_exclusive_defense_desc: "Mantendremos estrictamente una postura exclusivamente defensiva como principio rector de nuestra política de seguridad, limitando claramente el uso de capacidades de defensa al alcance de la prevención de ataques contra nuestro país. Al mantener la disuasión, evitaremos una excesiva expansión militar y demostraremos una postura que es menos probable que aumente las tensiones con los países vecinos."
 JAP_exclusive_defense_TT: "§YEste enfoque nacional mueve el equilibrio del poder más cerca del nivel 2!§!"
 JAP_collective_self_defense: "Política para permitir la autodefensa colectiva"
 JAP_collective_self_defense_desc: "En opinión de que los ataques contra aliados también pueden afectar directamente nuestra propia seguridad, indicaremos claramente una política que permita el ejercicio de la autodefensa colectiva. Esto fortalecerá la disuasión y la eficacia de las alianzas, y creará un marco de seguridad más dinámico."
 JAP_prioritizing_order: "Orden de priorización"
 JAP_prioritizing_order_desc: "Pondremos el orden social y la seguridad pública como las principales prioridades de la gobernanza. Al valorar las reglas y la responsabilidad, y mantener la seguridad pública y una administración estable, reconstruiremos los cimientos de la nación."
 JAP_strengthen_public_security: "Plan General de Seguridad Pública"
 JAP_strengthen_public_security_desc: "Realizaremos un examen completo del sistema de seguridad pública y formularemos un plan amplio que incluya equipo, personal y coordinación de la información. Al racionalizar las operaciones sobre el terreno y fortalecer la capacidad policial, reforzaremos la disuasión de los delitos y garantizaremos la estabilidad social."
 JAP_against_organized_crime: "Mejora de las medidas contra la delincuencia organizada"
 JAP_against_organized_crime_desc: "Intensificaremos las represión de la delincuencia organizada y avanzaremos los esfuerzos para reducir las fuentes de financiación y ampliar la capacidad de investigación. Al restaurar la seguridad pública interna, fortaleceremos la estabilidad social y construiremos también un sistema nacional menos vulnerable a las operaciones de infiltración e influencia de actores externos."
 JAP_against_terrorist_financing: "Medidas contra la financiación del terrorismo"
 JAP_against_terrorist_financing_desc: "Seguiremos estrictamente las corrientes financieras y aplicaremos plenamente los sistemas para reducir la financiación a organizaciones terroristas y grupos extremistas. Mediante el fortalecimiento de la coordinación entre las autoridades financieras y los organismos de investigación, protegeremos la seguridad nacional y aumentaremos la resiliencia contra las operaciones de influencia externa, al tiempo que mejoraremos la estabilidad social."
 JAP_counter_espionage: "Construir el Marco Anti-Espionaje"
 JAP_counter_espionage_desc: "Fortaleceremos las contramedidas contra las actividades de inteligencia y estableceremos sistemas para proteger la información clasificada y mejorar la vigilancia. Al disuadir la infiltración y las operaciones encubiertas de actores externos y salvaguardar la adopción de decisiones nacionales, aseguraremos la estabilidad interna."
 JAP_strengthening_cabinet: "Fortalecimiento de la autoridad ministerial"
 JAP_strengthening_cabinet_desc: "Fortaleceremos las funciones de mando y coordinación del Gabinete para mejorar la velocidad y coherencia de la toma de decisiones. Al construir un sistema capaz de avanzar rápidamente en la respuesta a las crisis y políticas clave, reforzaremos el liderazgo decisivo en la gobernanza nacional."
 JAP_cabinet_personnel_bureau: "Oficina de Personal"
 JAP_cabinet_personnel_bureau_desc: "Estableceremos un sistema que permita al Gabinete supervisar centralmente las cuestiones relativas al personal, fortaleciendo la transparencia y el control de los nombramientos de categoría superior. Al promover a la gente adecuada en las posiciones correctas, racionalizaremos el funcionamiento de la burocracia y mejoraremos la capacidad del gobierno para implementar políticas."
 JAP_breaking_down_bureaucratic_siloing: "Romper Silos burocráticos"
 JAP_breaking_down_bureaucratic_siloing_desc: "Reformaremos la administración de siloed en todos los ministerios y fortaleceremos el intercambio de información y la coordinación interministerial. Al reducir los procedimientos duplicados y los obstáculos, racionalizaremos la administración pública y aceleraremos la ejecución de inversiones y proyectos públicos."
 JAP_policy_evaluation_and_kpis: "Introducir la evaluación de políticas y los indicadores biológicos"
 JAP_policy_evaluation_and_kpis_desc: "Presentaremos un sistema de evaluación y KPI para que los resultados de las políticas puedan verificarse con datos mensurables. Al examinar las medidas de bajo impacto y concentrar recursos limitados en zonas de alto efecto, mejoraremos la eficiencia administrativa y aumentaremos la productividad económica."
 JAP_national_security_council: "Establecer un Consejo de Seguridad Nacional"
 JAP_national_security_council_desc: "centralizaremos la información y la adopción de decisiones relacionadas con la seguridad dentro del Gabinete y crearemos un sistema que permita adoptar decisiones rápidas y coherentes. Al fortalecer la capacidad de respuesta a las crisis y mejorar la coordinación con los aliados y organismos pertinentes, reforzaremos la disuasión."
 JAP_emergency_powers: "Cláusula de Poderes de Emergencia"
 JAP_emergency_powers_desc: "En preparación para situaciones extraordinarias como desastres importantes o ataques armados, aclararemos las autoridades y los procedimientos necesarios en casos de emergencia. Al mantener la supervisión en tiempo de paz, aceleraremos la respuesta a las crisis y fortaleceremos la cadena de mando, asegurando la estabilidad nacional y la postura de defensa."
 JAP_regulatory_reform: "Crecimiento Mediante la Reforma Reguladora"
 JAP_regulatory_reform_desc: "Revisaremos los reglamentos y procedimientos, reduciremos las cargas administrativas y promoveremos la actividad empresarial y la inversión. Al facilitar el lanzamiento de nuevas empresas y desarrollar instalaciones, aumentaremos el ritmo del crecimiento económico."
 JAP_postal_privatization: "Privatización postal"
 JAP_postal_privatization_desc: "Avanzaremos la privatización de los servicios postales, revisando un sistema dirigido por el gobierno para mejorar la eficiencia de la administración pública. Si bien la incorporación de los principios del mercado tiene por objeto fortalecer la actividad empresarial y la base tributaria, la reforma también puede provocar una fuerte oposición sobre sus méritos e intensificar el conflicto político."
 JAP_postal_privatization_TT: "§Y¡Un evento disparará donde elija si tiene una elección general de disolución!§!"
 JAP_second_wave_privatization: "Segunda etapa de la privatización"
 JAP_second_wave_privatization_desc: "Seguiremos impulsando las reformas de la privatización y revisaremos el papel del sector público y la forma en que se gestionan los servicios públicos. Al reducir la ineficiencia administrativa y fomentar la inversión y la actividad empresarial, aumentaremos el dinamismo económico."
 JAP_special_zones: "Zonas especiales estratégicas nacionales"
 JAP_special_zones_desc: "Crearemos excepciones regulatorias en áreas designadas y promoveremos intensamente la entrada de negocios y nuevas inversiones. Al avanzar en los proyectos de demostración y la comercialización más allá de las barreras institucionales existentes, aceleraremos el crecimiento impulsado por el dinamismo del sector privado y revitalizaremos las economías locales."
 JAP_expansion_regulatory_reform_zones: "Zonas de reforma a nivel nacional"
 JAP_expansion_regulatory_reform_zones_desc: "Ampliaremos los resultados alcanzados en zonas especiales de todo el país, cambiando la reforma regulatoria de una excepción regional a una norma nacional. Al reducir las barreras a la entrada y la inversión, fomentaremos nuevas empresas y promoveremos la revitalización económica en todo el país."
 JAP_new_market_entry: "Promover la nueva entrada de mercado"
 JAP_new_market_entry_desc: "Bajaremos las barreras para la entrada y el apoyo a la iniciativa empresarial y el lanzamiento de nuevas empresas. Al fomentar la competencia y la innovación, aumentaremos la productividad y fortaleceremos la base tributaria."
 JAP_new_technologies: "Bienvenido a las nuevas tecnologías"
 JAP_new_technologies_desc: "Apoyaremos activamente la adopción y comercialización de nuevas tecnologías, aceleración de la investigación y el desarrollo e innovación industrial. Al fomentar nuevos sectores de crecimiento, fortaleceremos la competitividad nacional."
 JAP_key_industries_back_home: "Sectores críticos de reguerra"
 JAP_key_industries_back_home_desc: "Construiremos un sistema que permita una producción nacional estable de industrias críticas, fortalecer las cadenas de suministro y aumentar la autosuficiencia en sectores clave. Al fomentar la inversión nacional, reforzaremos la base industrial y crearemos una estructura menos vulnerable a los cambios en el entorno internacional."
 JAP_economic_security: "Establecer la seguridad económica"
 JAP_economic_security_desc: "Examinaremos los arreglos de suministro para materiales críticos e industrias clave, y gestionaremos riesgos en la tecnología, el capital y la información para establecer la seguridad económica. Esto fortalecerá la autosuficiencia nacional y la competitividad sostenible de las empresas, apoyando el crecimiento estable."
 JAP_patriotic_education: "Educación patriótica"
 JAP_patriotic_education_desc: "Promoveremos la educación que enfatiza la historia, cultura y responsabilidad civil de la nación, fortaleciendo la cohesión social y el sentido de las normas comunes. Al construir una base menos susceptible a la influencia externa, reforzaremos la estabilidad interna."
 JAP_fundamentals_of_education: "Redefinir los fundamentos educativos"
 JAP_fundamentals_of_education_desc: "Examinaremos los objetivos y las normas de educación y redefiniremos, como política nacional, el desarrollo de la capacidad académica, los conocimientos fundamentales y las aptitudes prácticas. Al priorizar la inversión en educación, fortaleceremos las bases para el desarrollo del capital humano y la investigación y el desarrollo."
 JAP_dotoku_education: "Educación Dotoku"
 JAP_dotoku_education_desc: "Pondremos mayor énfasis en la educación de Dotoku y cultivaremos valores tales como mentalidad cívica, responsabilidad y consideración para otros dentro de la educación escolar. Mediante el fortalecimiento de las normas sociales y la profundización de la cohesión en las comunidades locales, contribuiremos a la estabilidad nacional."
 JAP_national_flag_and_anthem: "Respetar la bandera y el himno nacional"
 JAP_national_flag_and_anthem_desc: "Afirmaremos claramente el respeto por la bandera y el himno nacional, fortaleciendo un sentido de pertenencia nacional y unidad social. Esto reforzará la cohesión en tiempos de crisis y construirá una base menos susceptible a la influencia externa."
 JAP_family_policy: "Fortalecimiento de la política familiar"
 JAP_family_policy_desc: "Respetaremos los valores de los hogares y las familias y ampliaremos medidas que apoyen la crianza de los hijos y la vida cotidiana. Al crear un entorno en el que las personas puedan construir familias con paz mental, fortaleceremos la futura base demográfica y contribuiremos a la estabilidad social."
 JAP_glorious_decade: "Hacia un decenio de brillantez"
 JAP_inflation_target: "Compromiso de política aclaradora"
 JAP_down_long_term_interest_rates: "Menores tasas de interés a largo plazo"
 JAP_down_long_term_interest_rates_desc: "Mantendremos las tasas de interés a largo plazo bajas y estables, reduciendo los costos de financiación para empresas y hogares. Apoyando la inversión, la renovación de capital y las compras en el hogar, y apoyando así la demanda y levantando la economía, también allanaremos el camino para una recuperación de los ingresos fiscales."
 JAP_special_inspection_banks: "Inspecciones especiales de bancos"
 JAP_special_inspection_banks_desc: "Para restaurar la solidez del sistema financiero, realizaremos exámenes minuciosos de los activos de los bancos. Al aclarar el verdadero estado de los préstamos que no funcionan y poner fin al aplazamiento de las pérdidas y la manipulación opaca, crearemos una posición para detener la reacción en cadena de la ansiedad crediticia y los préstamos ajustados."
 JAP_bank_supervision: "Fortalecimiento de la supervisión bancaria"
 JAP_bank_supervision_desc: "En lugar de tratar las inspecciones y medidas correctivas como una sola compensación, fortaleceremos permanentemente el marco de supervisión. Forzando la divulgación y gobernanza e impidiendo que se repita la deficiente gestión de riesgos y la manipulación opaca, estabilizaremos la confianza en el sistema financiero."
 JAP_business_assessment: "Evaluación de las empresas equitativas"
 JAP_business_assessment_desc: "Para juzgar con precisión las capacidades y los riesgos de las empresas, evaluaremos objetivamente la rentabilidad empresarial y las perspectivas futuras. Sin depender de mantener las empresas a flote o prolongarlas, distinguiremos áreas que deben ser reconstruidas de aquellas que deben reestructurarse y sentar las bases para que el capital y el talento fluyan en los sectores del crecimiento."
 JAP_corporate_debt_restructuring: "Reestructuración de la deuda corporativa"
 JAP_corporate_debt_restructuring_desc: "Nos ocuparemos de las cargas excesivas de la deuda y aseguraremos el tiempo y el espacio necesario para la recuperación. Al alejarse de un estado de consumo por pagos de intereses y reembolsos, y permitir que los recursos se dirijan hacia la inversión, el empleo y la transformación empresarial, romperemos la cadena de estancamiento."
 JAP_corporate_revitalization: "Revitalización de las empresas"
 JAP_corporate_revitalization_desc: "Traeremos la reestructuración a una nueva etapa y reconstruiremos las bases corporativas tanto en términos financieros como operativos. Al abordar cargas excesivas e ineficiencias y trasladar a las empresas a una posición en la que puedan avanzar con la inversión, la contratación y los aumentos salariales, solidificaremos una recuperación dirigida por el sector privado."
 JAP_expectations_escaping_deflation: "Restablecimiento de las expectativas de crecimiento"
 JAP_expectations_escaping_deflation_desc: "Mediante la resolución de préstamos no operativos y el desbloqueo de deuda excesiva, cambiaremos el enfoque de la economía de «defensa» a «ofensivo». Si las empresas retoman el gasto en inversión, R&D y personas, y los hogares recuperan una perspectiva más clara para el futuro, un ciclo virtuoso de productividad y salarios será más propenso a asumir. Construiremos las bases necesarias para reiniciar plenamente la recuperación de la competitividad."
 JAP_promoting_labor_mobility: "Promoción de la movilidad laboral"
 JAP_promoting_labor_mobility_desc: "Crearemos condiciones que faciliten que el talento se traslade a sectores de crecimiento y avancen en la reasignación de la fuerza laboral. Al reducir las barreras a los cambios en el empleo y reemplear y mejorar las aptitudes de apoyo, impulsaremos la renovación industrial y aumentaremos la productividad."
 JAP_competition_service_sector: "Promoción de la competencia en el sector de los servicios"
 JAP_competition_service_sector_desc: "Alentaremos la entrada y la competencia en el sector de los servicios y abordaremos las ineficiencias y las rigideces de precios que han contribuido al estancamiento. Mediante la revisión de las regulaciones y prácticas arraigadas, mejoraremos el entorno empresarial y nos desplazaremos hacia un mercado en el que se opten más fácilmente los mejores servicios."
 JAP_revitalization_economy: "Revitalización de la economía japonesa"
 JAP_revitalization_economy_desc: "Hemos avanzado en la reconstrucción del sistema financiero y el sector empresarial, y hemos establecido un camino para recuperar la demanda y mejorar los salarios. Al eliminar las causas del estancamiento uno por uno y crear un entorno en el que los hogares y empresas puedan ver más claramente el futuro, afianzaremos el impulso hacia el crecimiento."
 JAP_equal_pay_for_equal_work: "Igualdad de remuneración por trabajo igual"
 JAP_equal_pay_for_equal_work_desc: "La Ley de empleo a tiempo parcial y a plazo fijo obliga a los empleadores a justificar toda diferencia de remuneración y beneficio entre trabajadores regulares y no regulares, o a suprimirla. Cuatro de cada diez trabajadores japoneses no son regulares, sentados en los mismos escritorios por una fracción del salario por hora sin bono, sin subsidio de jubilación y sin expectativa de trabajo la próxima primavera. Las empresas pierden el búfer de trabajo barato que han apoyado durante décadas, y millones de personas que nunca podrían planear un año por delante finalmente pueden."
 JAP_diplomacy: "Diplomacia de Japón"
 JAP_diplomacy_desc: "Reconstruir vínculos con el mundo y redefinir el papel de Japón en la comunidad internacional."
 JAP_diplomacy_idea_TT: "§YA medida que progresas a través del enfoque de la diplomacia, ¡se añadirán modificadores adicionales a este espíritu nacional!§!"
 JAP_friendship_asean: "Mejoramiento de las relaciones con la ASEAN"
 JAP_friendship_asean_desc: "El Gobierno japonés trabajará para mejorar las relaciones con los países de la ASEAN, promoviendo el restablecimiento de la confianza y la promoción del diálogo. Para el Japón, la ASEAN es un socio indispensable e importante tanto en términos económicos como de seguridad, y su unidad y estabilidad darán forma al futuro de toda la región."
 JAP_not_asean_war_TT: "Hay por lo menos un país con el espíritu nacional «ASEAN Member», y Japón no está en guerra con ningún país que tenga el espíritu nacional «ASEAN Member»."
 JAP_chiang_mai: "Iniciativa Chiang Mai"
 JAP_chiang_mai_desc: "Mediante la Iniciativa Chiang Mai, el Japón fortalece la cooperación financiera regional para apoyar la estabilidad económica y la cohesión de las naciones de la ASEAN."
 JAP_quantitative_oda: "Quantitative ODA"
 JAP_quantitative_oda_desc: "Mediante la inversión en gran escala de la AOD en infraestructuras básicas como el transporte, los puertos y la energía, el Japón apoya el crecimiento económico de la ASEAN y la conectividad regional."
 JAP_qualitative_oda: "Qualitative ODA"
 JAP_qualitative_oda_desc: "Al asociarse con empresas e instituciones locales, el Japón promueve el desarrollo del capital humano y los valores democráticos, aumentando su influencia en toda la ASEAN."
 JAP_security_south_china_sea: "Posición de seguridad del mar en China meridional"
 JAP_security_south_china_sea_desc: "Respaldado por la confianza de las naciones de la ASEAN, el Japón inicia un marco para la seguridad marítima neutral y pacífica en el Mar del Sur de China."
 JAP_away_dependence: "Away de EE.UU. Dependencia"
 JAP_away_dependence_desc: "Japón comienza a reexaminar la naturaleza de sus vínculos de larga data, tratando de ampliar sus opciones estratégicas y su autonomía. En áreas como la economía, la tecnología y la seguridad, seguimos un curso configurado por nuestra propia visión para el futuro."
 JAP_development_production: "Establecer cadenas de producción doméstica"
 JAP_development_production_desc: "Para asegurar la defensa nacional independientemente, estableceremos un sistema interno capaz de producir armas y materiales dentro del Japón."
 JAP_japanese_doctrine: "Formular una Doctrina japonesa"
 JAP_japanese_doctrine_desc: "Estableceremos una doctrina independiente de seguridad japonesa, permitiendo respuestas flexibles adaptadas a nuestro entorno estratégico."
 JAP_recalling_researchers: "Recordall Overseas Researchers"
 JAP_recalling_researchers_desc: "Universidades y laboratorios nacionales ofrecen puestos rápidos, instalaciones actualizadas y becas competitivas para revertir un largo flujo de talento. El objetivo es reconstruir la fuerza de investigación nacional al traer a los científicos japoneses de Estados Unidos."
 JAP_japanese_cloud: "Kasumigaseki Cloud"
 JAP_japanese_cloud_desc: "Construir un gobierno «Kasumigaseki Cloud» operado por proveedores japoneses y hospedado en servidores domésticos. Ministerios y organismos clave migran sus sistemas en esta plataforma compartida para reducir costos, normalizar la seguridad y mantener los datos confidenciales bajo control nacional."
 JAP_base_okinawa: "Habla sobre EE.UU. Fuerzas retiradas en Okinawa"
 JAP_base_okinawa_desc: "Para mejorar la autonomía de seguridad de Japón, las negociaciones comenzarán por el retiro de fuerzas estadounidenses estacionadas en Okinawa."
 JAP_enhancement_exercises: "Ejercicios conjuntos mejorados"
 JAP_enhancement_exercises_desc: "Profundizar la integración con las fuerzas estadounidenses a través de simulacros articulares más grandes y frecuentes. Las unidades marítimas, aéreas y terrestres ensayan procedimientos compartidos, comunicaciones y logística para que en una crisis real ambas partes puedan moverse, luchar y reabastecer como una sola fuerza coordinada."
 JAP_education_jap_usa: "Programas conjuntos de educación entre Estados Unidos y Japón"
 JAP_education_jap_usa_desc: "Para profundizar el entendimiento mutuo entre Japón y Estados Unidos, implementaremos programas de educación conjunta e intercambios estudiantiles. Al aprender del sentido de la disciplina y el espíritu empresarial de Estados Unidos, esta iniciativa fomentará una nueva generación de líderes de mente internacional y fortalecerá aún más la confianza bilateral."
 JAP_culture_technology: "Japón U.S. Intercambio de Cultura"
 JAP_culture_technology_desc: "Tighten links entre empresas japonesas y centros técnicos de EE.UU. emparejando laboratorios universitarios y estudios con socios en Silicon Valley, Seattle y Los Ángeles. Ingenieros, diseñadores y creadores se mueven de ida y vuelta en proyectos conjuntos, mezclando conocimientos de plataforma americana con hardware japonés, juegos y animación."
 JAP_dual_use: "Cooperación tecnológica de doble uso"
 JAP_dual_use_desc: "El Japón y los Estados Unidos profundizarán la cooperación en la esfera de las tecnologías de doble uso, que son aplicables tanto a fines civiles como militares. Mediante la colaboración entre la industria y el mundo académico, esta asociación acelerará los esfuerzos de investigación y desarrollo, impulsando el avance tecnológico general."
 JAP_okinawa_development: "Proyecto conjunto de desarrollo de Okinawa"
 JAP_okinawa_development_desc: "Para promover el crecimiento económico y la integración regional de Okinawa, Japón y Estados Unidos cooperarán en un proyecto de desarrollo conjunto centrado en el desarrollo de infraestructura. Al mejorar las redes de transporte, los sistemas logísticos y las instalaciones públicas, esta iniciativa busca aumentar el crecimiento regional a la vez que se abren nuevas vías para la cooperación de Japón."
 JAP_informal_cooperation: "Marco de Cooperación Oficiosa"
 JAP_informal_cooperation_desc: "Pese a la falta de relaciones diplomáticas oficiales, el Japón y Taiwán han desarrollado formas prácticas y sustanciales de cooperación. Mediante la respuesta a los desastres, el intercambio tecnológico y la interacción entre las personas, se está estableciendo una base mutuamente beneficiosa."
 JAP_disaster_countermeasure_cooperation: "Plataforma de conocimientos sobre desastres en Taiwán"
 JAP_disaster_countermeasure_cooperation_desc: "Dada su vulnerabilidad compartida a los desastres naturales, el Japón y Taiwán están estableciendo una plataforma conjunta para compartir conocimientos especializados y experiencias en respuesta a los desastres. Esta cooperación mejora la capacidad de recuperación y reparación de ambas naciones."
 JAP_tai_high_technology: "Japón Taiwán Enlace de alta tecnología"
 JAP_tai_high_technology_desc: "Las instituciones de investigación y las empresas privadas de Japón y Taiwán están uniendo fuerzas para colaborar en tecnologías civiles de vanguardia. Esta asociación pretende impulsar la innovación y la productividad en las industrias de ambas naciones."
 JAP_tai_tourist_visa: "Relajación de las políticas de visados turísticos"
 JAP_tai_tourist_visa_desc: "Para fomentar aún más el turismo de Taiwán, Japón facilitará sus procedimientos de visado. El aumento del intercambio de personas con personas y el turismo ayudará a estimular la economía y fomentar un entendimiento mutuo más profundo."
 JAP_tai_international_student: "Ampliación de los programas de intercambio de estudiantes"
 JAP_tai_international_student_desc: "Japón ampliará las oportunidades para que los estudiantes taiwaneses estudien en sus universidades. Esta iniciativa tiene como objetivo profundizar los vínculos académicos y culturales al mismo tiempo cultivar futuros líderes que puentearán las dos sociedades."
 JAP_tai_senkaku: "Establecer conversaciones marítimas con Taiwán"
 JAP_tai_senkaku_desc: "La controversia sobre las Islas Senkaku forma los derechos de pesca, la seguridad marítima y todas las negociaciones del Mar de China Oriental. El Japón abre canales de diálogo y consultas prácticas para reducir la fricción sobre el agua, al tiempo que no concedía nada a la soberanía. Maneja la confrontación en lugar de resolverla."
 JAP_dprk_national_policy: "Doctrina de la península del Norte"
 JAP_dprk_national_policy_desc: "Corea del Norte sigue siendo la chispa más cercana a nuestras costas y el actor más impredecible de la península. Definiremos una política nacional unificada hacia Pyongyang, sincronizando la diplomacia, la inteligencia y la preparación en una sola doctrina. La dirección que elijamos establecerá los términos de seguridad en el noreste de Asia."
 JAP_dprk_maximum_pressure: "Presión máxima en Pyongyang"
 JAP_dprk_maximum_pressure_desc: "Corea del Norte entiende apalancamiento, no buena voluntad. Reforzaremos las sanciones, ampliaremos el monitoreo marítimo y coordinaremos la presión diplomática para limitar el espacio de Pyongyang para la escalada. El objetivo es simple: aumentar el costo de cada provocación hasta que el régimen se vea obligado a recalcular."
 JAP_dprk_missile_defense: "Escudo de Misiles Capa"
 JAP_dprk_missile_defense_desc: "La amenaza norteña se mide en minutos, no en días. Fortaleceremos una red de defensa de misiles en capas a través de tierra, mar y aire para proteger nuestras ciudades, puertos y centros de mando de ataque repentino. Un escudo creíble negará a Pyongyang el poder de intimidarnos desde lejos."
 JAP_dprk_trilateral_training: "Ejercicios de Península Trilateral"
 JAP_dprk_trilateral_training_desc: "La seguridad en la península no puede descansar solo en declaraciones. La capacitación conjunta con Corea del Sur y Estados Unidos mejorará la preparación, la interoperabilidad y la respuesta a crisis en el punto de inflamación más peligroso de la región. Al perforar juntos, señalamos que la agresión cumplirá una respuesta coordinada."
 JAP_dprk_korean_defense_treaty: "Acuerdo de Defensa Japón-Korea"
 JAP_dprk_korean_defense_treaty_desc: "La península y el archipiélago japonés comparten la misma línea de frente. Un acuerdo formal de defensa con Corea del Sur vinculará el intercambio de inteligencia, la planificación de contingencias y los compromisos de seguridad mutua en un marco duradero. Las viejas quejas permanecen, pero la necesidad estratégica exige una base más fuerte."
 JAP_dprk_conditional_engagement: "Canal condicional a Piongyang"
 JAP_dprk_conditional_engagement_desc: "La presión por sí sola no puede manejar cada crisis. Abriremos un canal diplomático controlado a Corea del Norte, vinculado a condiciones estrictas en ensayos de misiles, incidentes militares y desestabilización regional. El diálogo no sustituirá la disuasión, pero puede prevenir el mal cálculo."
 JAP_dprk_normalization_framework: "Normalización Hoja de ruta"
 JAP_dprk_normalization_framework_desc: "Un Asia nororiental estable requiere más que una gestión permanente de crisis. Estableceremos un marco gradual para la normalización con Corea del Norte, vinculando el progreso diplomático a compromisos de seguridad verificables y garantías regionales. Cualquier asentamiento debe ser gradual, ejecutable y anclado en reciprocidad."
 JAP_dprk_support_unification: "Volver a una península unificada"
 JAP_dprk_support_unification_desc: "La división de Corea ha dado forma a la seguridad del Asia oriental durante generaciones, pero no necesita ser permanente. Apoyaremos un camino pacífico hacia la unificación coreana mediante la diplomacia, la coordinación con los asociados y la planificación de la estabilidad regional. Si se va a rehacer la península, Japón debe ayudar a dar forma al orden que sigue."
 JAP_history_education: "Transparencia en la educación histórica"
 JAP_history_education_desc: "Debemos hacer frente a los hechos históricos, revisando los materiales educativos y las directrices docentes. La educación histórica transparente es el primer paso para construir confianza con nuestros países vecinos."
 JAP_statement: "[ROOT.GetLeader] Statement"
 JAP_statement_desc: "Para expresar una clara posición de responsabilidad y remordimiento respecto a los acontecimientos históricos, el gobierno emitirá una nueva declaración oficial. Esta iniciativa tiene por objeto fomentar la reconciliación con las naciones afectadas y promover relaciones orientadas hacia el futuro basadas en la confianza mutua."
 JAP_intellectual_platform: "Plataforma de Historia Trilateral"
 JAP_intellectual_platform_desc: "Con la mediación de ONU, Japón, China y Corea del Sur planificarán y establecerán conjuntamente museos y archivos digitales para transmitir los recuerdos de la guerra a las generaciones futuras. El Japón proporcionará apoyo financiero, situando esta iniciativa como símbolo mundial de la paz y la reconciliación."
 JAP_intellectual_platform_TT: "§YSi ambos países llegan a un acuerdo, un espíritu nacional que aumenta §Gestabilidad§! ¡Se otorgará a las tres naciones!§!"
 JAP_chi_friendship: "Mejoramiento de las relaciones con China"
 JAP_chi_friendship_desc: "Para estabilizar las relaciones con Japón China, el Gobierno japonés seguirá dialogando y trabajando para promover la comprensión mutua y gestionar las fricciones. China es un país vecino con una influencia significativa sobre el orden regional y la economía, y mejorar las relaciones está directamente ligada a la seguridad y prosperidad de Japón."
 JAP_chi_accept_intellectual_platform: "China ha acordado establecer la Plataforma de Historia de Corea del Japón."
 JAP_chi_trade_support: "Apoyo a la Reforma del Sistema Comercial de China"
 JAP_chi_trade_support_desc: "Proporcionar apoyo técnico e institucional para la reforma y modernización del sistema comercial de China. Esto facilita una entrada más suave para las empresas japonesas y aumenta la influencia de Japón en la región."
 JAP_chi_advancement_companies: "Entrada de Mercado Mutuo para Empresas"
 JAP_chi_advancement_companies_desc: "Promover la inversión mutua y la entrada en el mercado entre las empresas japonesas y chinas para aumentar la interdependencia económica y aumentar la productividad."
 JAP_chi_kanji: "Proyecto de Cooperación Cultural «Sinósfera»"
 JAP_chi_kanji_desc: "Mediante el fortalecimiento de los vínculos culturales entre países de la Sinosfera, este proyecto hace hincapié en valores compartidos y vínculos históricos, que sirven como un amortiguador cultural contra la influencia externa."
 JAP_chi_temple: "Proyecto conjunto de conservación del templo budista"
 JAP_chi_temple_desc: "Preservar los templos budistas como patrimonio cultural compartido a través de la cooperación Japón-China. Este proyecto aumenta su valor como activos turísticos y reafirma vínculos históricos entre las dos naciones."
 JAP_chi_senkaku: "Gestión de la Controversia Senkaku"
 JAP_chi_senkaku_desc: "Las tensiones que rodean las Islas Senkaku están directamente vinculadas a las relaciones generales de Japón y la estabilidad del Mar de China Oriental. Al mantener nuestra posición sobre soberanía, es necesario establecer un marco de gestión diplomática para evitar enfrentamientos accidentales. Establezcamos formalmente canales de diálogo y, al mismo tiempo que restringe la fricción en el mar, procedamos con negociaciones en un entorno favorable a nuestro país."
 JAP_kor_friendship: "Mejoramiento de las relaciones con Corea del Sur"
 JAP_kor_friendship_desc: "Hacia una relación Japón-Corea Sur orientada hacia el futuro, el gobierno japonés trabajará para restaurar la confianza y continuar el diálogo. Corea del Sur es uno de los vecinos más importantes de Japón, directamente ligados a la estabilidad regional y la economía, y mejorar las relaciones ampliará las opciones e influencia de Japón."
 JAP_kor_accept_intellectual_platform: "Corea del Sur ha acordado el establecimiento de la Plataforma de Historia de Corea del Japón."
 JAP_kor_accelerator: "Acelerador Seúl de Tokio"
 JAP_kor_accelerator_desc: "En Tokio y Seúl se establece un programa conjunto de aceleradores para apoyar y nutrir a las empresas de startups, fortalecer la innovación y la cooperación económica entre ambas capitales."
 JAP_kor_local_companies: "Iniciativa de intercambio comercial local"
 JAP_kor_local_companies_desc: "Promueve la colaboración entre las empresas regionales, acelerando el crecimiento y desarrollo de las industrias civiles a nivel local."
 JAP_kor_cultural_exchange: "Intercambio cultural"
 JAP_kor_cultural_exchange_desc: "Al promover el intercambio cultural, se establece la base para una mayor comprensión mutua y influencia de la opinión pública entre los dos pueblos."
 JAP_kor_aging: "Equipo de Tareas de la sociedad del envejecimiento de Corea"
 JAP_kor_aging_desc: "Se forma un grupo de tareas conjunto de Corea del Japón para hacer frente al desafío común de las sociedades envejecidas, celebrando debates mensuales para elaborar políticas de cooperación."
 JAP_kor_liancourt_rocks: "Gestión de la Controversia Takeshima"
 JAP_kor_liancourt_rocks_desc: "La disputa sobre Takeshima (Dokdo) es una cuestión pendiente importante que puede afectar a las relaciones generales de Japón con Corea del Sur. Si bien mantenemos firmemente la posición de nuestro país, estableceremos un marco para el diálogo y las consultas prácticas a fin de evitar la fricción accidental y la intensificación de las tensiones diplomáticas. Esto levantará las restricciones a las negociaciones con Corea del Sur en relación con la cuestión Takeshima (Dokdo)."
 JAP_approaching_russia: "Acercamiento con Rusia"
 JAP_approaching_russia_desc: "Para garantizar la estabilidad geopolítica y asegurar el acceso a los recursos, seguimos una línea diplomática encaminada a mejorar las relaciones con Rusia, centrándonos en la cooperación en materia de energía, infraestructura y comercio."
 JAP_sov_far_east_development: "De la Iniciativa Oriental"
 JAP_sov_far_east_development_desc: "Aprovechando la experiencia regional de revitalización del Japón en el clima frío de Hokkaido, esta iniciativa promueve el desarrollo de la región fría en el Lejano Oriente mediante inversiones en infraestructura y capital extranjero"
 JAP_sov_saakhalin: "Sakhalin II"
 JAP_sov_saakhalin_desc: "Para garantizar un acceso estable a los combustibles fósiles, el Japón fortalece la inversión extranjera en el proyecto energético Sakhalin II en cooperación con Rusia."
 JAP_sov_logistics_corridor: "Corredor logístico de Japón Europa"
 JAP_sov_logistics_corridor_desc: "Desarrollaremos un corredor logístico terrestre que conecta Japón y Europa a través de Rusia. Mediante la utilización de ferrocarriles y carreteras rusas, buscamos acortar los tiempos de transporte y establecer un acceso estable a los mercados europeos."
 JAP_sov_it_corridor: "Corredor Digital de Rusia"
 JAP_sov_it_corridor_desc: "En colaboración con empresas japonesas de TI, se establecerá infraestructura como centros de datos y cables de fibra óptica en Rusia, creando una red de comercio digital que une Europa, Asia Central y Rusia."
 JAP_sov_kuril_islands: "Gestión de los conflictos entre los Territorios del Norte"
 JAP_sov_kuril_islands_desc: "La cuestión de los Territorios del Norte es un asunto pendiente sin resolver que se refiere a la base misma de las relaciones entre el Japón y Rusia. Si bien mantenemos firmemente la posición de nuestro país, estableceremos un marco para las negociaciones diplomáticas y las consultas prácticas a fin de evitar el arraigo de la confrontación. Si bien gestionamos cuidadosamente las relaciones con Rusia, levantaremos las restricciones a las negociaciones relativas a la cuestión de los Territorios del Norte."
 JAP_defensive_foundations: "Defensivas fundaciones"
 JAP_defensive_foundations_desc: "El Japón fortalece la postura defensiva fundamental de las Fuerzas de Autodefensa, centrándose en la protección de la patria, la respuesta a las crisis y la disuasión mientras permanece dentro de los límites de una interpretación estrictamente defensiva del artículo 9."
 JAP_jgsdf: "Fortalecer el JGSDF"
 JAP_jgsdf_desc: "La Fuerza de Autodefensa Terrestre del Japón mejora sus capacidades defensivas mediante una mayor movilidad, capacitación y preparación. Estas medidas garantizan que la fuerza siga siendo capaz de salvaguardar la patria mientras opera estrictamente dentro de las limitaciones jurídicas y estratégicas existentes."
 JAP_type_x_mbt: "Tipo de campo 10 tanque de batalla principal"
 JAP_type_x_mbt_desc: "El Tipo 10 representa un salto en el desarrollo armado japonés, más ligero, más rápido y diseñado específicamente para una rápida implementación a través del terreno desafiante de Japón. Al ampliar los equipos de producción y capacitación para esta plataforma avanzada, el JGSDF fortalece su capacidad de responder rápidamente a las amenazas en casa."
 JAP_type_manouvre_combat_vehicle: "Tipo 16 Vehículos de combate de maniobra"
 JAP_type_manouvre_combat_vehicle_desc: "El vehículo de combate tipo 16 Maneuver ofrece una potencia de fuego altamente móvil para las fuerzas de respuesta rápida. Su configuración de ruedas permite a las unidades JGSDF reposicionar rápidamente a través del archipiélago, reforzando regiones remotas sin depender de la logística de armadura pesada."
 JAP_wheeled_howitzer: "Tipo 19 Buceo de ruedas"
 JAP_wheeled_howitzer_desc: "Una nueva generación de artillería móvil, el tipo 19, combina sistemas modernos de control de incendios con capacidad de redistribución rápida. Su chasis ruedada permite un soporte flexible para operaciones defensivas a través de la geografía dispersa y resistente de Japón."
 JAP_chu_sam: "Ampliar la red tipo 03 Chu-SAM"
 JAP_chu_sam_desc: "Japón fortalece su postura de defensa aérea con baterías adicionales tipo 03 Chu-SAM. Estos sistemas modernos de misiles de mediano alcance refuerzan la protección contra las incursiones aéreas e integran perfectamente la infraestructura nacional de alerta temprana y seguimiento."
 JAP_type_atgm: "Unidades de misiles antitanque para la infantería"
 JAP_type_atgm_desc: "El JGSDF equipa sus elementos de infantería y reconocimiento con sistemas mejorados de misiles guiados antitanque, incluidos los modelos actualizados del tipo 01 y el tipo 96. Estas mejoras aseguran que las fuerzas terrestres sigan siendo capaces de contrarrestar amenazas modernas blindadas en cualquier compromiso defensivo."
 JAP_central_readiness_force: "Ampliar la Fuerza Central de Readiness"
 JAP_central_readiness_force_desc: "La Fuerza Central de Readiness se desarrolla en un comando flexible y de despliegue rápido capaz de responder a emergencias en cualquier lugar del Japón. Al mejorar la capacitación conjunta, la movilidad y la coordinación con los ejércitos regionales, aseguramos que las unidades terrestres puedan reforzar las esferas críticas a corto plazo."
 JAP_civil_protection_act: "Aplicación del Marco de Protección Civil"
 JAP_civil_protection_act_desc: "Las nuevas medidas de protección civil formalizan la cooperación entre las fuerzas de autodefensa, las autoridades locales, la policía y los servicios de emergencia. Los procedimientos legales claros para evacuaciones, respuesta a crisis y protección de infraestructura refuerzan la capacidad del Japón de salvaguardar su población durante desastres e incidentes de seguridad por igual."
 JAP_maritime_self_defence_force: "Fortalecer la Fuerza Marítima de Autodefensa"
 JAP_maritime_self_defence_force_desc: "La Fuerza Marítima de Autodefensa está reforzada con mejores estructuras de capacitación, mantenimiento y apoyo para mantener operaciones de alta temperatura en el mar. Al mejorar los grupos de escolta, la capacidad de patrulla y la logística naval, el Japón puede salvaguardar mejor las vías marítimas vitales y las aguas costeras."
 JAP_amphibious_rapid_deployment: "Tren Amphibious Rapid Deployment Brigade"
 JAP_amphibious_rapid_deployment_desc: "Se establece una formación de despliegue rápido anfibio dedicada para responder a crisis en las islas remotas de Japón. Combinando infantería, armadura y ascensor naval, esta brigada está entrenada para reforzar, asegurar y, si es necesario, retomar el territorio clave a lo largo de la frontera marítima de Japón."
 JAP_atago_destroyer: "Comisión Aegis Destroyers"
 JAP_atago_destroyer_desc: "Los nuevos destructores equipados con Aegis son puestos en servicio, proporcionando poderosas capacidades de defensa aérea, antisubmarina y mando. Estas escorts avanzadas forman el núcleo de la flota superficial moderna de Japón y refuerzan significativamente la protección de la flota y la disuasión regional."
 JAP_keen_sword_operation: "Ampliar los ejercicios conjuntos de espadas Keen"
 JAP_keen_sword_operation_desc: "La serie de ejercicios Keen Sword se expande para incluir componentes navales, aéreos y terrestres más complejos. Los simulacros regulares de gran escala con fuerzas aliadas agudizan la interoperabilidad, mejoran el mando y control conjuntos, y demuestran que Japón está dispuesto a operar eficazmente en un entorno regional impugnado."
 JAP_f2_multirole_defensive_enhancement: "Mejorar la Flota Multirole F-2"
 JAP_f2_multirole_defensive_enhancement_desc: "La flota F-2 recibe sistemas de aviónicos, sensores y armas actualizados para mejorar la defensa del aire y la huelga marítima en aguas cercanas. Estas mejoras permiten que la aeronave responda más eficazmente a las amenazas regionales manteniendo al mismo tiempo un perfil de misión fundamentalmente defensivo."
 JAP_f15_defensive_updat_programe: "F-15 Programa de actualización defensiva"
 JAP_f15_defensive_updat_programe_desc: "Los cazas de superioridad aérea F-15 de Japón experimentan una actualización integral, incluyendo radares modernos, suites de guerra electrónica y misiles aire-aire mejorados. La flota actualizada fortalece significativamente la capacidad de Japón para asegurar su propio espacio aéreo contra adversarios cada vez más capaces."
 JAP_hyuga_class: "Desarrollar Hyūga-Class Helicopter Destructores"
 JAP_hyuga_class_desc: "Los destructores de helicópteros de clase Hyūga entran en servicio operativo completo como mando y plataformas antisubmarinas. Su capacidad para coordinar grupos de escolta y operar múltiples helicópteros mejora enormemente la protección de las flotas y la sensibilización sobre la situación marítima."
 JAP_p_maritime_patrol: "Ampliación de la aviación de patrulla marítima"
 JAP_p_maritime_patrol_desc: "Japón invierte en aviones modernos de patrulla marítima para vigilar las vías marítimas, rastrear submarinos y apoyar operaciones de búsqueda y rescate. El aumento de la cobertura de patrullas alrededor del archipiélago refuerza tanto la seguridad nacional como la seguridad del tráfico marítimo."
 JAP_deploy_ballistic_warning_radars: "Despliegue los radares de advertencia de misiles balísticos"
 JAP_deploy_ballistic_warning_radars_desc: "Se instalan nuevos radares de alerta temprana a largo plazo para detectar y rastrear los lanzamientos de misiles balísticos en la región. Al integrar estos sensores en la red de mando nacional, Japón gana minutos vitales para evaluar amenazas, alertar a la población y coordinar respuestas defensivas."
 JAP_modernize_jadge: "Modernizar la Red de Defensa Aérea JADGE"
 JAP_modernize_jadge_desc: "El sistema Japón Aerospace Defense Ground Environment (JADGE) se actualiza con enlaces de datos mejorados, capacidad de procesamiento e integración con sensores navales y terrestres. Una red JADGE modernizada permite una toma de decisiones más rápida y un despliegue más eficiente de activos de defensa aérea."
 JAP_air_self_defence_force: "Fortalecer la Fuerza de Autodefensa Aérea"
 JAP_air_self_defence_force_desc: "La Fuerza de Autodefensa Aérea amplía sus programas de capacitación, infraestructura básica y unidades de apoyo para manejar un tempo operacional más alto. Estas mejoras aseguran que Japón pueda mantener patrullas aéreas continuas, rápidos escalones y complejos ejercicios conjuntos a medida que el entorno aéreo regional crece más exigente."
 JAP_article_nine_transition_comittee: "Establecer el Comité de Transición de Defensa"
 JAP_article_nine_transition_comittee_desc: "Se forma un comité dedicado para coordinar la transición de Japón hacia una postura de defensa nacional modernizada. Al reunir a los encargados de formular políticas, planificadores militares y expertos jurídicos, el Japón puede gestionar el cambio de responsabilidades y garantizar una transformación estable y bien organizada."
 JAP_article_nine_transition_comittee_tt: "§GEl modificador de Balance del Poder Artículo 9 ya no podrá cambiar, basado en el nivel de interpretación. Esto ahora da acceso a los Enfoquees nacionales, eliminando completamente el artículo 9§!"
 JAP_secure_public_support: "Apoyo público seguro para la reforma de la defensa"
 JAP_secure_public_support_desc: "Se lanza un esfuerzo nacional para explicar la evolución de la política de defensa de Japón, abordar las preocupaciones públicas y fomentar la confianza en la nueva postura de seguridad. El amplio apoyo de la sociedad garantiza la estabilidad política y reduce las fricciones durante la transición."
 JAP_modernize_joint_command: "Modernizar las estructuras de mando conjunto"
 JAP_modernize_joint_command_desc: "Las fuerzas armadas integran sus mandos operacionales en una estructura conjunta unificada, mejorando la interoperabilidad y la preparación. La planificación conjunta moderna y las normas comunes de capacitación permiten respuestas más eficientes a situaciones complejas de seguridad."
 JAP_normalize_defense_procurement: "Normalizar los sistemas de adquisiciones de defensa"
 JAP_normalize_defense_procurement_desc: "Japón simplifica la adquisición de defensa, amplía la capacidad industrial y fortalece la coordinación con los fabricantes nacionales. Los procesos de adquisición transparentes y modernizados garantizan que los proyectos críticos de defensa puedan ejecutarse de manera eficiente y sostenible."
 JAP_formalize_national_defense: "Formalizar las capacidades de Defensa Nacional"
 JAP_formalize_national_defense_desc: "Japón codifica oficialmente sus responsabilidades de defensa ampliadas, aclarando roles, misiones y objetivos estratégicos a largo plazo. Con la transición completa, las fuerzas armadas operan bajo una visión unificada destinada a proteger los intereses nacionales en un entorno regional cada vez más complejo."
 JAP_normalize_defense_procurement_done: "Adquisición de Defensa Normalizada"
 JAP_modernize_joint_command_done: "Completar la modernización del comando conjunto"
 JAP_consolidate_national_defense_framework_done: "Marco de defensa nacional consolidado"
 JAP_rebuild_blue_water_navy: "Reconstruir una Marina de Agua Azul"
 JAP_rebuild_blue_water_navy_desc: "Japón prepara su flota para operaciones sostenidas mucho más allá de las aguas del hogar, ampliando la logística, la capacidad de reposición y las fuerzas de escolta a largo plazo. Una nueva marina de agua azul permite que Japón proteja las rutas marítimas, apoye a los asociados y responda a crisis en toda la región."
 JAP_carrier_aviation_tt: "[JAP_carrier_aviation_idea_desc]\n"
 JAP_carrier_aviation_development: "Transportista Programa de Desarrollo de la Aviación"
 JAP_carrier_aviation_development_desc: "Se lanza un programa dedicado para desarrollar la aviación capaz de transportar, integrar a los combatientes navales, las operaciones de cubierta y el entrenamiento especializado. La construcción de un brazo aéreo creíble aumenta drásticamente el alcance y la flexibilidad de la flota en operaciones de disuasión y combate."
 JAP_submarine_modernization_project: "Proyecto de Modernización Submarina"
 JAP_submarine_modernization_project_desc: "Japón actualiza su flota submarino con cascos más tranquilos, sensores avanzados y armas modernas. Una nueva generación de submarinos de ataque fortalece la disuasión submarina, las capacidades de negación del mar y la capacidad de monitorear aguas impugnadas en profundidad."
 JAP_expand_multi_role_destroyer_fleet: "Ampliar la Flota de Destructor Multi-Role"
 JAP_expand_multi_role_destroyer_fleet_desc: "Otros destructores multi-role se encargan de proporcionar defensa aérea, guerra antisubmarina y capacidad de ataque superficial en una plataforma única y flexible. Estas escoltas forman la columna vertebral de los equipos de tareas ampliados de Japón en el mar."
 JAP_establish_joint_rapid_deployment_command: "Establecer el Comando Conjunto de Despliegue Rápido"
 JAP_establish_joint_rapid_deployment_command_desc: "Se crea un comando conjunto para coordinar elementos terrestres, aéreos y navales de despliegue rápido. Con una planificación unificada y respuestas previas a la emergencia, Japón gana una fuerza capaz de reaccionar rápidamente ante las crisis en cualquier lugar dentro de su entorno estratégico más amplio."
 JAP_full_defense_industrial_mobilisation: "Movilización Industrial de Defensa Llena"
 JAP_full_defense_industrial_mobilisation_desc: "Japón alinea su base industrial, instituciones de investigación y redes logísticas detrás de un plan integral de producción de defensa. Las adquisiciones estandarizadas, los contratos a largo plazo y la capacidad ampliada permiten una fabricación sostenida de buques, vehículos, aeronaves y armas avanzadas."
 JAP_long_range_strike_missile_artillery_forces: "Fuerzas de ataque y artillería de misiles de largo alcance"
 JAP_long_range_strike_missile_artillery_forces_desc: "Se organizan unidades especializadas de misiles y artillería para realizar huelgas de precisión a largo plazo. Al combinar las municiones avanzadas con sistemas modernos de selección y mando, Japón gana la capacidad de mantener activos militares distantes e infraestructura clave en riesgo."
 JAP_expand_mechanized_brigades: "Ampliar las brigadas mecanizadas"
 JAP_expand_mechanized_brigades_desc: "Se refuerzan las formaciones mecanizadas existentes y se elevan nuevas brigadas, equipadas con vehículos modernos de combate de infantería y armadura de apoyo. Esta expansión mejora la movilidad, la protección y la capacidad de combate sostenida sobre el terreno."
 JAP_deploy_next_generation: "Implementar las formaciones de combate de próxima generación"
 JAP_deploy_next_generation_desc: "Las unidades de combate se reorganizan alrededor del equipo de próxima generación, los sistemas de comandos en red y la doctrina de las armas combinadas. Estas formaciones están diseñadas para el despliegue rápido, alta supervivencia y operaciones eficaces en entornos complejos de alta intensidad."
 JAP_national_defense_professionalization: "Nacional de defensa profesional"
 JAP_national_defense_professionalization_desc: "Japón invierte en educación militar profesional, desarrollo de la carrera y sistemas modernos de personal en todos los servicios. Un oficial más capaz, experimentado y cohesivo y el cuerpo de la NCO aumenta la preparación, mejora el liderazgo y sustenta la eficacia a largo plazo de las fuerzas nacionales de defensa."
 JAP_integrated_air_space_command: "Comando Aéreo Integrado y Espacial"
 JAP_integrated_air_space_command_desc: "Se establece un comando integrado de aire y espacio para coordinar la defensa aérea, alerta temprana, soporte satelital y vigilancia espacial. Al fusionar información de radares terrestres, sensores aéreos y plataformas orbitales, Japón obtiene una imagen más clara del espacio de batalla y puede responder con mayor rapidez a las amenazas emergentes."
 JAP_establish_long_range_strike_aviation: "Establecer una aviación de ataque a larga distancia"
 JAP_establish_long_range_strike_aviation_desc: "Se forman unidades de aviación de ataque de larga distancia dedicadas, equipadas con aviones modernos y armas de suspensión. Estas fuerzas proporcionan la capacidad de alcanzar objetivos críticos en rangos prolongados, apoyando la disuasión y las operaciones conjuntas en toda la región."
 JAP_mext_generation_air_dominance: "Predominio aéreo de la próxima generación"
 JAP_mext_generation_air_dominance_desc: "Japón acelera el desarrollo de un luchador de dominio del aire de próxima generación, combinando sigilo, sensores avanzados y sistemas de combate en red. Este programa asegura que la fuerza aérea pueda mantener la superioridad en los cielos cada vez más disputados bien en el futuro."
 JAP_advanced_missile_development: "Dirección de Misiles"
 JAP_advanced_missile_development_desc: "Se establece una dirección dedicada para supervisar la investigación, las pruebas y la producción de sistemas avanzados de misiles. Desde armas modernas de aire a aire y anti-boraje hasta capacidades de huelga de precisión de largo alcance, este esfuerzo amplía el arsenal de Japón y aumenta la eficacia de todas las ramas."
 JAP_high_tech_domestic_manufacturing: "Fabricación de Defensa Nacional de alta tecnología"
 JAP_high_tech_domestic_manufacturing_desc: "Japón invierte en fabricación de alta gama para sistemas aviónicos, sensores, estructuras compuestas y propulsión. El fortalecimiento de las cadenas nacionales de suministro para componentes críticos reduce la dependencia de los proveedores extranjeros y apoya mejoras rápidas en las plataformas aéreas y de misiles."
 JAP_establish_japan_defense_technology_agency: "Agencia de tecnología de defensa de Japón"
 JAP_establish_japan_defense_technology_agency_desc: "Se crea una agencia centralizada de tecnología de defensa para coordinar la investigación, adquisición e innovación en toda la industria, el mundo académico y las fuerzas armadas. La supervisión unificada acelera los ciclos de desarrollo, reduce la duplicación y garantiza que los conceptos prometedores se trasladen rápidamente de las unidades de laboratorio a primera línea."
 JAP_atla_defense_technology_consolidation: "Consolidación de tecnología ATLA"
 JAP_atla_defense_technology_consolidation_desc: "El Organismo de Adquisición, Tecnología & desempeña un papel central en la coordinación de la investigación, el desarrollo y las adquisiciones en todas las ramas de las fuerzas armadas. Al consolidar los programas de tecnología de defensa bajo una sola autoridad, Japón puede reducir la duplicación, acelerar la innovación y impulsar proyectos prometedores más rápidamente en el servicio operativo."
 JAP_gifu_test_aerospace_development_center: "Prueba de Gifu & Centro de Desarrollo Aeroespacial"
 JAP_gifu_test_aerospace_development_center_desc: "Gifu se desarrolla en un principal centro de pruebas y evaluación para aviones, aviónicos y sistemas de armas. Los rangos dedicados, el espacio aéreo instrumentado y los equipos especializados de ingeniería apoyan juicios rigurosos, asegurando que se prueben a fondo nuevos diseños antes de entrar en servicio de primera línea."
 JAP_aichi_nagoya_aerospace_defense_cluster: "Grupo de defensa aeroespacial Aichi-Nagoya"
 JAP_aichi_nagoya_aerospace_defense_cluster_desc: "La región de Aichi-Nagoya se cultiva como un grupo líder en producción aeroespacial y defensa, que vincula a los principales fabricantes, proveedores e institutos de investigación. La inversión concentrada en esta área aumenta la producción de marcos aéreos, motores y componentes de alta tecnología para plataformas militares y de doble uso."
 JAP_kobo_maritime_heavy_industry_corridor: "Corredor de industrias pesadas marítimas Kobe"
 JAP_kobo_maritime_heavy_industry_corridor_desc: "Kobe y las ciudades costeras circundantes se desarrollan en un corredor continuo de la industria pesada marítima. Los astilleros, los siderúrgicos y las empresas de ingeniería marina ampliadas proporcionan la capacidad para construir y mantener una flota más grande y capaz y su infraestructura de apoyo."
 JAP_nagasaki_shipyard_defense: "Integración de defensa naval Nagasaki"
 JAP_nagasaki_shipyard_defense_desc: "Los principales astilleros de Nagasaki están más profundamente integrados en la planificación nacional de defensa, dedicando capacidad adicional a escoltas, buques de apoyo y plataformas navales especializadas. Una coordinación más estrecha entre los patios y la marina acorta los plazos de construcción y mejora la disponibilidad de la flota."
 JAP_kure_naval_arsenal_revival: "Renacimiento del arsenal naval de Kure"
 JAP_kure_naval_arsenal_revival_desc: "Las instalaciones navales históricas de Kure se revitalizan como un moderno complejo de construcción naval y reparación. Los muelles, talleres y nodos logísticos actualizados restauran el papel de la ciudad como un centro clave para el mantenimiento, los reacondicionamientos y las actualizaciones de los buques de guerra en primera línea."
 JAP_sasebo_fleet_support_complex: "Complejo de apoyo de la flota de Sasebo"
 JAP_sasebo_fleet_support_complex_desc: "Sasebo se expande en un complejo amplio de apoyo a la flota, con mayor capacidad de reparación, almacenamiento de municiones y infraestructura de suministro. Su ubicación en el oeste de Japón lo convierte en un centro ideal para sostener operaciones en mares cercanos y puntos claves del mar."
 JAP_yokosuka_dockyard_expansion: "Expansión de muelles Yokosuka"
 JAP_yokosuka_dockyard_expansion_desc: "Los astilleros y las instalaciones asociadas de Yokosuka se amplían para manejar más barcos y ciclos de mantenimiento más profundos. Como una de las bases navales primarias de Japón, un Yokosuka ampliado aumenta enormemente la capacidad de la marina para mantener a los principales combatientes superficiales listos para su despliegue."
 JAP_revitalize_defense_production: "Revitalizar la Base de Producción de Defensa"
 JAP_revitalize_defense_production_desc: "Japón emprende un amplio esfuerzo para revitalizar su base industrial de defensa, apoyando a los fabricantes claves, estabilizando contratos a largo plazo y mejorando las líneas de producción. Una fundación industrial más saludable permite al país equipar sus fuerzas de manera fiable y adaptarse con mayor rapidez a las nuevas exigencias operacionales."
 JAP_kaguya_starward_expedition: "Kaguya Starward Expedition"
 JAP_kaguya_starward_expedition_desc: "Inspirado en el relato de la Princesa Kaguya, que regresó a la Luna con una túnica de luz, Japón lanza un ambicioso estudio profundo del espacio profundo de asteroides cercanos a la Tierra. Las sondas robóticas avanzadas y los manifestantes mineros se envían al vacío, convirtiendo la leyenda en tecnología y sentando las bases para la futura extracción de recursos entre las estrellas."
 JAP_kaguya_starward_expedition_tt: "§Y ¡Nuestro Misión a la luna se iniciará!§!"
 JAP_tsukuyomi_lunar_program: "Programa lunar Tsukuyomi"
 JAP_tsukuyomi_lunar_program_desc: "Se llama después de Tsukuyomi, el kami lunar de la mitología japonesa, este programa une la industria, institutos de investigación y la agencia espacial detrás de un esfuerzo lunático sostenido. Los árbitros, los aterrizadores y la infraestructura de superficie transforman la Luna de un símbolo lejano en un puesto de avanzada tangible, sirviendo ciencia, navegación y las ambiciones a largo plazo del futuro espacial de Japón."
 JAP_amaterasu_martian_dawn: "Amaterasu Martian Dawn"
 JAP_amaterasu_martian_dawn_desc: "Bajo el nombre de Amaterasu, diosa del sol naciente, Japón llega al planeta rojo. Las sondas de largo alcance, la propulsión avanzada y la investigación pionera de soporte vital apoyan una nueva ola de exploración marciana. Cada misión empuja los límites de la ingenuidad humana, convirtiendo el lejano resplandor de Marte en el próximo horizonte para la civilización de alta tecnología de Japón."
 JAP_restore_imperial_household: "Restaurar la Casa Imperial"
 JAP_restore_imperial_household_desc: "La Casa Imperial sale de la ceremonia y a la administración nacional, recuperando la capacidad institucional y un papel judicial formal. La legitimación es reordenada para que el Trono Chrysanthemum establezca los términos en lugar de los ratifica. Cada facción debe elegir ahora un lado."
 JAP_reinstate_former_imperial_houses: "Reinstate las antiguas casas imperiales"
 JAP_reinstate_former_imperial_houses_desc: "Las antiguas casas principesas se restablecen y su estatus restaurado, ampliando las ramas elegibles para heredar el Trono. Los monárquicos lo aclaman como salvaguardia de una línea ininterrumpida, los constitucionalistas la condenan como ingeniería política. La sucesión es segura de cualquier manera en que se resuelve el argumento."
 JAP_male_line_succession_act: "Pase la Ley de Sucesión Hombre-Line"
 JAP_male_line_succession_act_desc: "La incertidumbre de la sucesión es una vulnerabilidad estratégica tanto como una controversia interna. Codificaremos la sucesión masculina-línea en el estatuto para eliminar la ambigüedad y asegurar la continuidad dinástica para las generaciones venideras. El movimiento consolidará el apoyo monarquista, pero encenderá una fuerte oposición de los reformadores que lo ven como un paso atrás del Japón moderno."
 JAP_imperial_rites_restored: "Restaurar los Ritos Imperiales"
 JAP_imperial_rites_restored_desc: "Un trono sin ritual es una corona sin peso. Restituiremos los ritos imperiales como ceremonias reconocidas por el Estado, reafirmando los fundamentos sagrados de la monarquía y la continuidad de la nación. Al hacerlo, atamos al estado moderno a la antigua legitimidad, ya sea que la clase política apruebe o no."
 JAP_recall_privy_council: "Recordar el Consejo Privado"
 JAP_recall_privy_council_desc: "La política parlamentaria se ha vuelto fuerte, transitorio y cada vez más desprevenido de la artesanía estatal a largo plazo. Recordaremos al Consejo Privado que proporcione al Trono un órgano consultivo permanente, discreto, experimentado y leal a la continuidad del Estado. Su regreso será visto como un ancla estabilizador por los monarquistas y como un centro de poder no elegido por sus oponentes."
 JAP_imperial_reform_commission: "Establecer la Comisión de Reforma Imperial"
 JAP_imperial_reform_commission_desc: "La restauración exige estructura, no improvisación. Estableceremos una Comisión de Reforma Imperial para redactar el plan legal e institucional de una monarquía renovada y alinear ministerios, oficinas judiciales y órganos de seguridad detrás de una sola doctrina de estado. Una vez convocado, la comisión convertirá el simbolismo en política y hará que la retirada sea políticamente imposible."
 JAP_imperial_audience: "Sostén una audiencia imperial"
 JAP_imperial_audience_desc: "Las partes serán citadas no como iguales, sino como peticionarios ante el Trono. En una audiencia imperial cuidadosamente escenificada, uniremos a los líderes de las facciones a un nuevo orden, uno donde la política elegida sirve, en lugar de mandos, el estado. Si el Chrysanthemum Throne es presidir un moderno shogunate, primero debe hacer que la clase política se incline a su lógica."
 JAP_imperial_civic_oath: "Proclamar el juramento cívico imperial"
 JAP_imperial_civic_oath_desc: "Una nueva orden requiere más que decretos; requiere lealtad compartida. Proclamaremos un juramento cívico imperial que une a funcionarios, miembros de servicio e instituciones civiles al Trono como la última fuente de legitimidad. Al hacerlo, convertimos la lealtad en ley y hacemos sentir disenso como traición."
 JAP_unified_intelligence_secretariat: "Crear una Secretaría de Inteligencia Unificada"
 JAP_unified_intelligence_secretariat_desc: "Un moderno shogunate no puede ser ciego. Consolidaremos los servicios competidores en una Secretaría de Inteligencia Unificada que informa a través de una única cadena de mando y salvaguarda el panorama estratégico del Trono. Esto agudizará nuestra nave durante la noche, mientras da a nuestros rivales todas las razones para temer lo que el tribunal sabe ahora."
 JAP_blue_water_navy: "Construir una marina de agua azul"
 JAP_blue_water_navy_desc: "El destino de Japón es marítimo, y nuestra seguridad no puede terminar en el horizonte. Construiremos una verdadera marina de agua azul capaz de operar lejos de las aguas del hogar, protegeremos los carriles marinos y el poder del proyecto donde nuestros intereses demandan. Con la flota como instrumento de acero del Trono, el mundo aprenderá a medir Japón por la vela que deja atrás."
 JAP_imperial_defense_council: "Forma el Consejo de Defensa Imperial"
 JAP_imperial_defense_council_desc: "La estrategia no puede dejarse a los ciclos electorales y la rivalidad ministerial. Formaremos un Consejo de Defensa Imperial para unificar las fuerzas armadas, el liderazgo de inteligencia y los ministerios clave bajo una única doctrina estratégica anclada al Trono. En un solo golpe, la política de seguridad de Japón se vuelve coherente y mucho más difícil para las facciones sabotear desde dentro."
 JAP_rare_earth_resilience: "La reserva estratégica imperial"
 JAP_rare_earth_resilience_desc: "El gobierno imperial dirige las grandes casas comerciales para asegurar líneas de suministro y establecer reservas de metal crudo y estratégico contra cualquier guerra o embargo. El Hogar y los ministerios mantienen juntos las noticias materiales de la nación en confianza para la corona. Lo que el reino del Emperador no puede comprar libremente, almacena y asegura por su propia mano.\n-------------\nSi §Y$JAP_national_energy_security$§! ya se ha logrado, la reserva se establece sobre bases y rendimientos asegurados §Gtwice§! el beneficio estratégico-metal."
 JAP_national_shipbuilding_plan: "Programa de expansión de flotas imperiales"
 JAP_national_shipbuilding_plan_desc: "El Trono no se conformará con la defensa costera; Japón dirigirá los mares que decidan nuestro destino. En el marco del Programa de Expansión de Flotas Imperiales, aumentaremos la capacidad del astillero, bloquearemos las adquisiciones navales a largo plazo y conduciremos un ciclo continuo de construcción desde la carretilla hasta la puesta en marcha. Cuando este plan esté en marcha, nuestros rivales no debatirán las intenciones de Japón. Contarán nuestros cascos."
 JAP_imperial_war_cabinet: "Convocar el Gabinete de Guerra Imperial"
 JAP_imperial_war_cabinet_desc: "En tiempos de crisis, Japón no puede ser gobernado por retraso, comité y negociación partidista. Convocaremos un Gabinete de Guerra Imperial para centralizar la autoridad de mando y vincular a la dirección política a una sola línea estratégica bajo el mandato del Trono. Desde este momento, el estado actuará con una sola voz y será del Emperador."
 JAP_russian_lost_territories: "Reclamar Territorios del Norte"
 JAP_russian_lost_territories_desc: "El Japón presiona su reclamación a las islas y aguas que mantiene Rusia como una demanda soberana respaldada por un verdadero apalancamiento en lugar de una formalidad diplomática. Si Moscú se niega, Japón debe decidir qué tan lejos está preparado para ir. El norte no permanecerá cerrado tras los tratados y el silencio."
 JAP_fight_china_again: "Dragón y Chrysanthemum"
 JAP_fight_china_again_desc: "El viejo conflicto nunca fue realmente resuelto, sólo se pospuso tras los tratados y el cambio de equilibrios. Prepararemos a la nación para enfrentar a China una vez más, reunir industrias, fuerzas armadas y voluntad pública para una guerra que decida el futuro de la región. Esta vez, Japón no luchará por la supervivencia sola, sino por el orden que sigue."
 JAP_reclaim_pacific_rim: "Nuestro mandato del Río Pacífico"
 JAP_reclaim_pacific_rim_desc: "La prosperidad y la seguridad de Japón están escritas en todo el Pacífico, desde carriles marinos hasta cadenas isleñas y puntos distantes. Afirmaremos un mandato de Pacific Rim que trata la influencia marítima como política nacional respaldada por la presencia de flotas, el acceso basado y el apalancamiento económico. La era de ver a otros dibujar el mapa ha terminado; Japón lo formará."
 JAP_office_for_colonialism: "Revive the Daitōa-shō"
 JAP_office_for_colonialism_desc: "Un imperio sin administración es una conquista que colapsa bajo su propio peso. Renovaremos al Daitōa-shō para coordinar la gobernanza en el extranjero, los arreglos de seguridad y la integración económica bajo una sola doctrina imperial. Con un ministerio para dirigir la esfera, la influencia de Japón ya no será improvisada, será gestionada, ampliada y aplicada."
 JAP_office_for_colonialism_tt: "Desbloquea la ley de ocupación en los estados asiáticos:\n"
 JAP_reclaim_south_chinese_sea: "Mando de los Mares del Sur"
 JAP_reclaim_south_chinese_sea_desc: "El Mar del Sur de China es la arteria de Asia, y quien controle el flujo de comercio, combustible y energía. Nos moveremos a reclamar el dominio en estas aguas, estableciendo presencia, bases y la fuerza naval para hacer cumplir nuestra voluntad contra cualquier retador. Japón no pedirá acceso, lo garantizará por la fuerza."
 JAP_reclaim_indochina: "Volver a Indochina"
 JAP_reclaim_indochina_desc: "Indochina se encuentra en la encrucijada del sudeste asiático, donde puertos, recursos y carriles marinos deciden quién establece el equilibrio regional. Regresaremos con presión, fuerza e ingeniería política para traer estos territorios bajo la dirección estratégica de Japón. Una vez asegurado, el flanco sur de nuestra esfera marítima estará anclado en influencia permanente."
 JAP_reclaim_australia: "El Ancla Sur"
 JAP_reclaim_australia_desc: "Australia es la piedra clave del Pacífico meridional, un continente que puede albergar flotas, energía aérea y la logística que decide largas guerras. Nos moveremos para llevarlo bajo el control estratégico de Japón, no como una redada o un gesto, sino como un ancla permanente para nuestra esfera marítima. Si el sur está asegurado, el Pacífico se convierte en un lago japonés."
 JAP_reclaim_myanmar: "Asegure la puerta de Irrawaddy"
 JAP_reclaim_myanmar_desc: "Myanmar es el puente terrestre entre Asia meridional y sudoriental, controlando las rutas que conectan la Bahía de Bengal al corazón de la región. Nos moveremos para recuperarla a través de la fuerza y la presión política, convirtiendo sus puertos, aeródromos y corredores en activos de la esfera más amplia de Japón. Una vez que la puerta de Irrawaddy está asegurada, nuestro flanco sur se vuelve mucho más difícil de desafiar."
 JAP_reclaim_the_pacific: "El océano como nuestra frontera"
 JAP_reclaim_the_pacific_desc: "El Pacífico no es una extensión distante, es la frontera que decide la supervivencia y grandeza de Japón. Lo recuperaremos a través de la presencia de la flota, los puntos fuertes de la isla y la voluntad de hacer cumplir un orden marítimo en forma de Tokio. Cuando el océano se convierta en nuestra frontera, todos los rivales serán forzados a operar bajo nuestra sombra."
 JAP_reclaim_north_korea: "Atar el norte bajo la mano de Tokio"
 JAP_reclaim_north_korea_desc: "Forzaremos un acuerdo que despoja a Pyongyang de la autonomía estratégica y pone su política exterior bajo supervisión japonesa. A través del acceso controlado, las garantías de seguridad y el apalancamiento duro sobre los recursos y la reconstrucción, el Norte se convertirá en un búfer dependiente más que una amenaza impredecible. Es la dominación sin ilusión, y la estabilidad aplicada por el diseño."
 JAP_reclaim_south_korea: "Imponer un Marco de Protectorado"
 JAP_reclaim_south_korea_desc: "Seguiremos más allá de la influencia y estableceremos un marco protectorado que vincula la política exterior y de seguridad de Corea a la dirección de Tokio. A través de acuerdos controlados, asesores y apalancamiento sobre instituciones clave, Corea se verá obligada a ocupar un puesto subordinado sin necesidad de una anexión abierta. Es un imperio moderno construido con papeleo, presión y permanencia."
 JAP_reclaim_taiwan: "Establecer un Protectorado de Taiwán"
 JAP_reclaim_taiwan_desc: "Nos moveremos de la influencia al control imponiendo un marco protectorado que une la defensa y la política exterior de Taiwán a la dirección de Tokio. Mediante garantías, derechos de bastión y apalancamiento institucional, la isla será asegurada como un bastión marítimo leal sin necesidad de una anexión abierta. Es un arreglo imperial moderno, aplicado por el poder del mar y la presión política."
 JAP_basic_reconstruction_policy: "Política de reconstrucción"
 JAP_basic_reconstruction_policy_desc: "A raíz de la devastación sin precedentes causada por el terremoto del Gran Japón Oriental, el gobierno debe establecer una política básica para la reconstrucción. La presentación de un marco nacional para restablecer los medios de vida, reconstruir la infraestructura y revitalizar la industria será el primer paso hacia la recuperación de la confianza pública y estabilizar la sociedad."
 JAP_tohoku_infrastructure: "Reconstruir la infraestructura de Tohoku"
 JAP_tohoku_infrastructure_desc: "El terremoto y el tsunami causaron daños catastróficos a las redes de transporte y líneas de vida de Tohoku. Reconstruir carreteras, ferrocarriles y puertos es el primer paso hacia la restauración de las comunidades locales y avanzar en la recuperación de la región. Aunque el esfuerzo exigirá enormes costos y tiempo, no puede aplazarse."
 JAP_fishery_revival: "Recuperación agrícola-fishery"
 JAP_fishery_revival_desc: "El tsunami destrozó los puertos pesqueros y tierras agrícolas de Tohoku, destruyendo innumerables medios de vida. La reconstrucción de estos sectores restaurará la base económica de la región y asegurará un suministro estable de alimentos. Este esfuerzo es vital tanto para la recuperación local como para la seguridad nacional."
 JAP_tohoku_port: "Restaurar las funciones del puerto de Tohoku"
 JAP_tohoku_port_desc: "El tsunami derribó las instalaciones portuarias y los astilleros, deteniendo la logística y el comercio marítimo. La reconstrucción reactivará las industrias regionales y reabrirá rutas nacionales e internacionales clave. Recuperar estas puertas es esencial para la recuperación económica más amplia de Japón."
 JAP_power_supply: "Estabilización de energía"
 JAP_power_supply_desc: "El desastre ha dañado muchas instalaciones eléctricas y redes de transmisión, creando una grave escasez de electricidad. Debemos expandir rápidamente fuentes alternativas y reforzar la red para asegurar la estabilidad tanto para los ciudadanos como para la industria."
 JAP_kanto_infrastructure: "Reconstruir la infraestructura de Kanto"
 JAP_kanto_infrastructure_desc: "El desastre infligió graves daños a la región de Kanto, en particular en el norte, perturbando las redes de transporte y las funciones urbanas. La restauración de la infraestructura que apoya la zona de capital es esencial para reactivar la actividad económica y mantener la estabilidad nacional. Es imprescindible una reconstrucción improvisada y bien planificada."
 JAP_reconstruction_agency: "Establecer el Organismo de Reconstrucción"
 JAP_reconstruction_agency_desc: "Para acelerar y coordinar la recuperación posterior al desastre, el Gobierno establecerá la Agencia de Reconstrucción. Este órgano dedicado unificará los esfuerzos entre las autoridades centrales y locales, asegurando la aplicación efectiva de los planes de recuperación."
 JAP_industrial_recovery: "Restaurar la Base Industrial"
 JAP_industrial_recovery_desc: "El desastre dañó gravemente las fábricas e instalaciones industriales. Al reconstruir la base industrial, podemos restaurar el empleo y acelerar la recuperación de nuestra economía."
 JAP_funding_local_governments: "Apoyo a los municipios afectados"
 JAP_funding_local_governments_desc: "Proporcionar fondos a los gobiernos locales de las zonas afectadas para apoyar la recuperación, reconstruir los medios de subsistencia y mantener los servicios públicos."
 JAP_housing_reconstruction: "Restablecimiento de la vivienda para las víctimas"
 JAP_housing_reconstruction_desc: "Acelerar la construcción de viviendas temporales y distritos residenciales a largo plazo, desplazando a las familias desplazadas fuera de los refugios y dando planes claros para el reasentamiento permanente."
 JAP_reconstruction_completed_focus: "Reconstrucción completada"
 JAP_reconstruction_completed_focus_desc: "Marque la transición de la reconstrucción de emergencia a la revitalización a largo plazo en Tōhoku. Se restablece la infraestructura básica, las industrias se están ejecutando de nuevo y las ciudades comienzan a pasar de la supervivencia al crecimiento."
 JAP_trilateral_anti_north_korea_training: "Preparación trilateral de la península"
 JAP_trilateral_anti_north_korea_training_desc: "Ejercicios conjuntos regulares con Corea del Sur y los Estados Unidos han forjado un libro de juegos compartido para la respuesta a crisis en la península. Los procedimientos de comando interoperable, los simulacros aéreos y navales combinados y las rutinas coordinadas de defensa de misiles aseguran que cualquier provocación de Pyongyang cumpla una respuesta rápida, unificada y creíble."
 JAP_dprk_policy_idea: "Política japonesa Penetración"
 JAP_dprk_policy_idea_desc: "La nueva política de Corea de Tokio ha abierto canales que no existían antes. A través de contactos diplomáticos, intermediarios del canal trasero, apalancamiento económico y cultivo de inteligencia, Japón ha adquirido una ventana temporal para expandir su influencia dentro del entorno político de Corea del Norte. La apertura es frágil y disputada, pero por ahora, la presión y presencia japonesas tienen más peso en Pyongyang que antes."
 JAP_entrenched_demand_shortfall_idea_1: "Bomba de la demanda entrelazada"
 JAP_entrenched_demand_shortfall_idea_1_desc: "Las expectativas deflacionarias y la ansiedad acerca del futuro están suprimiendo el gasto familiar, mientras que las empresas retienen la inversión frente a una demanda débil. Los salarios son estancados, los precios apenas se mueven, y nadie quiere ser el primero en gastar. La economía de Japón no está colapsando, pero está siendo drenada por parálisis.\n-------------\nUsted puede §Gmitigar§! los efectos de este espíritu nacional mediante el uso de las decisiones en §Y $JAP_japanese_economy_decisions$§! para elevar §YDemand Recovery Progress§! a al menos §G30§!!"
 JAP_transparency_and_audit_reform_modifier: "Reforma de la Transparencia y la Auditoría"
 JAP_transparency_and_audit_reform_modifier_desc: "Fortaleceremos la divulgación de información y la gestión de los registros públicos, reduciendo las oportunidades para cometer errores mediante la digitalización y auditorías independientes. Al abordar el amakudari y la opacidad de la financiación política, aumentaremos la eficiencia administrativa y la confianza, así como la resiliencia a la influencia externa."
 JAP_protecting_human_rights_modifier: "$JAP_protecting_human_rights$"
 JAP_protecting_human_rights_modifier_desc: "$JAP_protecting_human_rights_desc$"
 JAP_worker_protection_modifier: "Protección del trabajador"
 JAP_worker_protection_modifier_desc: "Salvaguardaremos los medios de vida y la seguridad de los trabajadores en el lugar de trabajo, creando condiciones que permitan a las personas seguir trabajando a largo plazo. Al apoyar los salarios más altos y un mejor tratamiento y aliviar la inseguridad económica, fortaleceremos la estabilidad social y las bases de la industria."
 JAP_redistribution_modifier: "$JAP_redistribution$"
 JAP_redistribution_modifier_desc: "$JAP_redistribution_desc$"
 JAP_leading_disarmament_idea: "$JAP_leading_disarmament$"
 JAP_leading_disarmament_idea_desc: "$JAP_leading_disarmament_desc$"
 JAP_leading_disarmament_idea_3: "El desarrollo como nación pacífica"
 JAP_leading_disarmament_idea_3_desc: "Esclareceremos un camino nacional que no dependa del poder militar y redirigir recursos y talentos hacia el desarrollo civil. Al priorizar el fortalecimiento de nuestras bases industriales y funciones urbanas y acelerar la construcción de industrias civiles y distritos de oficinas, aumentaremos los niveles de vida y impulsaremos el crecimiento económico."
 JAP_prioritizing_order_modifier: "$JAP_prioritizing_order$"
 JAP_prioritizing_order_modifier_desc: "$JAP_prioritizing_order_desc$"
 JAP_strengthening_cabinet_modifier: "$JAP_strengthening_cabinet$"
 JAP_strengthening_cabinet_modifier_desc: "$JAP_strengthening_cabinet_desc$"
 JAP_regulatory_reform_modifier: "Reforma Reguladora y Estrategia de Crecimiento"
 JAP_regulatory_reform_modifier_desc: "Fortaleceremos la competitividad nacional y avanzaremos hacia un sistema que pueda sostener un crecimiento estable. Al reducir las limitaciones en la actividad empresarial, aprovecharemos el dinamismo del sector privado para impulsar la industria y el empleo."
 JAP_patriotic_education_modifier: "$JAP_patriotic_education$"
 JAP_patriotic_education_modifier_desc: "$JAP_patriotic_education_desc$"
 JAP_strengthen_military_idea: "$JAP_strengthen_military_power$"
 JAP_strengthen_military_idea_desc: "$JAP_strengthen_military_power_desc$"
 JAP_jsdf_international_missions_idea1a: "Fundación Institucional de Cooperación Internacional Misiones"
 JAP_jsdf_international_missions_idea1a_desc: "Ha avanzado la elaboración del marco jurídico y las normas operacionales necesarias para las misiones de cooperación internacional. Con los procedimientos para el despliegue en el extranjero y las normas de respuesta durante las misiones cada vez más claras, la estabilidad de las operaciones de la fuerza y la coherencia de la adopción de decisiones in situ están mejorando."
 JAP_constitutional_debate_idea: "Intensificación del debate constitucional"
 JAP_constitutional_debate_idea_desc: "Un cambio importante en la política de seguridad ha sacudido los supuestos de larga data sobre el orden de la posguerra. Mientras el apoyo al fortalecimiento de la defensa nacional está creciendo, la oposición de los interesados sobre el retiro del pacifismo sigue siendo fuerte, y el conflicto dentro de la sociedad y la esfera política se intensifica."
 JAP_f15_programe: "F15 Upgrade Program"
 JAP_submarine_modernization_idea: "Programa de modernización submarina"
 JAP_carrier_aviation: "Air Carrier Restoration"
 JAP_keen_sword_operation_idea: "Ejercicios de Espada Keen"
 JAP_defense_technology_agency1: "Agencia de tecnología de defensa de Nippon"
 JAP_defense_technology_agency1_desc: "El Organismo de Tecnología de Defensa del Nippon coordina la investigación, el desarrollo y las adquisiciones en toda la industria, los círculos académicos y las fuerzas armadas. Al unificar proyectos avanzados bajo una sola visión estratégica, Japón acelera la innovación, reduce la duplicación y asegura que las tecnologías de vanguardia alcancen unidades de primera línea más rápido."
 JAP_diplomacy_modifier: "Diplomacia de Japón"
 JAP_diplomacy_modifier_desc: "El Japón hace hincapié en los vínculos bilaterales con las naciones clave, mejorando la cooperación en esferas como la economía, la seguridad y la cultura. Mediante asociaciones pragmáticas y basadas en los intereses, el Japón está fortaleciendo su presencia en la etapa mundial."
 JAP_chiang_mai_initiative: "Iniciativa Chiang Mai"
 JAP_chiang_mai_initiative_desc: "Con la ampliación de los acuerdos cambiarios con el Japón, los Estados miembros de la ASEAN refuerzan su resiliencia a las crisis financieras, mejorando la estabilidad económica y la autonomía."
 JAP_quantitative_oda_idea: "Inversión en infraestructura de AOD japonesa"
 JAP_quantitative_oda_idea_desc: "La asistencia oficial para el desarrollo de Japón ha acelerado el desarrollo de infraestructuras como transporte, puertos y electricidad. Este apoyo sirve de base vital para el crecimiento económico de nuestra nación."
 JAP_qualitative_oda_idea: "AOD japonesa para el capital humano y la innovación"
 JAP_qualitative_oda_idea_desc: "La cooperación con el Japón ha logrado avances significativos en la educación, el desarrollo de los recursos humanos y la investigación. El fortalecimiento de la capacidad de las empresas e instituciones locales allana el camino hacia el desarrollo sostenible."
 JAP_security_south_china_sea_idea: "Participación japonesa en actividades marítimas Estabilidad"
 JAP_security_south_china_sea_idea_desc: "El compromiso neutral de Japón en seguridad marítima en el Mar del Sur de China ha ayudado a aliviar las tensiones regionales y proteger la libertad de navegación. Sirve de una presencia estabilizadora fiable para nuestra región."
 JAP_jap_education: "Japón-EE.UU. Programa de Intercambio Educativo"
 JAP_jap_education_desc: "Se está pilotando un programa educativo híbrido que combina la disciplina de Japón con el espíritu emprendedor de Estados Unidos. Este aprendizaje mutuo de fortalezas proporciona un valioso estímulo para el desarrollo de las generaciones futuras."
 JAP_jap_education_culture: "Japón U.S. Cooperación cultural y educativa"
 JAP_jap_education_culture_desc: "Se está creando una asociación más amplia entre el Japón y los Estados Unidos, que se extiende más allá de la cultura pop y las tecnologías avanzadas. El desarrollo de los recursos humanos se ha profundizado mediante una fusión de la educación centrada en la disciplina de Japón y el ethos impulsado por la creatividad de Estados Unidos. La sinergia de la afinidad cultural y la colaboración científica fomenta tanto la estabilidad social como el impulso para la innovación."
 JAP_dual_use_idea: "Japón U.S. Cooperación en investigación de doble uso"
 JAP_dual_use_idea_desc: "Se está intensificando la cooperación entre el Japón y los Estados Unidos en tecnologías de doble uso. El desarrollo acelerado y la experiencia compartida prometen una mayor competitividad futura tanto en las esferas civil como militar."
 JAP_disaster_countermeasure_cooperation_idea: "Aumento de la resiliencia ante los desastres mediante la cooperación"
 JAP_disaster_countermeasure_cooperation_idea_desc: "Mediante la cooperación en materia de respuesta a los desastres con el Japón, Taiwán ha fortalecido significativamente su capacidad para hacer frente a las emergencias. Se espera que los programas de intercambio de conocimientos y capacitación conjunta reduzcan el daño y aceleren la recuperación."
 JAP_tai_high_technology_idea: "Japón-Taiwan avanzó la asociación tecnológica"
 JAP_tai_high_technology_idea_desc: "La investigación conjunta con Japón está acelerando la innovación en los sectores de tecnología civil de Taiwán. Los recursos de investigación compartidos y la colaboración internacional están mejorando la competitividad industrial."
 JAP_tai_international_student_idea: "Next-Generation Exchange con Japón"
 JAP_tai_international_student_idea_desc: "La expansión de las oportunidades de estudio en Japón permite que más estudiantes taiwaneses obtengan experiencias académicas diversas. Esto fomenta el desarrollo de futuros líderes en las relaciones Japón-Taiwan y amplía las perspectivas internacionales."
 JAP_chi_kor_intellectual_platform: "Plataforma de diálogo en memoria del Asia oriental"
 JAP_chi_kor_intellectual_platform_desc: "Con el apoyo de las Naciones Unidas, Japón, China y Corea del Sur han lanzado una plataforma intelectual conjunta para preservar los recuerdos históricos y profundizar la comprensión mutua. Esta iniciativa marca un nuevo marco internacional que equilibra la reflexión histórica con una cooperación orientada hacia el futuro."
 JAP_chi_trade_support_idea: "Armonización Internacional de los Sistemas de Comercio"
 JAP_chi_trade_support_idea_desc: "Con el apoyo técnico e institucional del Japón, China está promoviendo el desarrollo de sistemas comerciales acordes con las normas internacionales. Las reformas, como los procedimientos aduaneros simplificados y las revisiones jurídicas, contribuyen a la modernización institucional."
 JAP_chi_advancement_companies_idea: "Mejora de la integración industrial con Japón"
 JAP_chi_advancement_companies_idea_desc: "La expansión mutua de las empresas japonesas y chinas está racionalizando las redes de producción y profundizando la interdependencia económica entre ambas naciones."
 JAP_chi_kanji_idea: "Cooperación entre las esferas culturales sino-japonés"
 JAP_chi_kanji_idea_desc: "A través de la cooperación cultural con Japón, China está fortaleciendo los intercambios dentro del «Sino-Caracter Cultural Sphere.» Esto contribuye a potenciar el poder blando y una imagen internacional más favorable."
 JAP_chi_temple_idea: "Preservación conjunta del patrimonio budista"
 JAP_chi_temple_idea_desc: "Al preservar y restaurar conjuntamente los templos budistas y los bienes culturales con el Japón, China está reafirmando el valor de su patrimonio religioso al tiempo que promueve el turismo."
 JAP_kor_accelerator_idea: "Cooperación del acelerador de Tokyo Seoul"
 JAP_kor_accelerator_idea_desc: "El marco de apoyo inicial establecido conjuntamente entre Seúl y Tokio está fomentando la próxima generación del espíritu empresarial y mejorando la cooperación tecnológica interurbana."
 JAP_kor_local_companies_idea: "Programa de intercambio de negocios local"
 JAP_kor_local_companies_idea_desc: "A través de intercambios comerciales entre empresas locales en Corea y Japón, las economías regionales están revitalizando y se están formando nuevas redes industriales del sector privado."
 JAP_kor_aging_idea: "Equipo de Tareas de la sociedad envejecida"
 JAP_kor_aging_idea_desc: "Para hacer frente al desafío común de la población envejecida, se ha creado un grupo de trabajo conjunto de expertos coreanos y japoneses para intercambiar ideas normativas y mejorar las medidas de bienestar social."
 JAP_sov_logistics_corridor_idea: "Japón Rusia Red logística eurasiática"
 JAP_sov_logistics_corridor_idea_desc: "Mediante la cooperación con Japón, se está desarrollando el corredor logístico que conecta Japón y Europa a través de Rusia. Las mejoras de infraestructura y la vinculación económica están mejorando el significado geopolítico de Rusia."
 JAP_sov_it_corridor_idea: "Japón Rusia iniciativa de conectividad digital"
 JAP_sov_it_corridor_idea_desc: "Con el apoyo de Japón, Rusia está ampliando su infraestructura informática. La asociación de Japón Rusia tiene por objeto construir un amplio corredor digital y establecer una base para el intercambio mundial de información."
 JAP_territorial_disputes1: "Obligaciones políticas de las negociaciones territoriales"
 JAP_territorial_disputes1_desc: "Con cierto grado de progreso en las cuestiones territoriales de larga data, las tensiones en las aguas circundantes han disminuido un poco, y también se está difundiendo una sensación de alivio en la opinión pública nacional. La reducción de la incertidumbre diplomática también está teniendo un efecto positivo en la actividad económica en las regiones costeras, apoyando la base de ingresos fiscales relacionada con la industria pesquera mediante mejoras en las condiciones operacionales."
 JAP_monarchist_shipbuilding_idea: "Conducción naval imperial"
 JAP_monarchist_shipbuilding_idea_desc: "El Imperio volverá al mar como su dominio natural. Bajo un Imperial Naval Construction Drive, los astilleros se expanden, los contratos se centralizan y la producción es empujada al tempo de guerra sostenido hasta que la flota coincida con la ambición de Japón. ¡Abajo en el nombre del Emperador, los mares pertenecen al Imperio!"
 JAP_monarchist_shipbuilding_idea_tt: "§REste espíritu nacional se eliminará cuando usted sea§! §Y $naval_power_of_the_continent$§!"
 JAP_restoring_imperial_household_idea: "Restaurar la Casa Imperial"
 JAP_restoring_imperial_household_idea_desc: "El Hogar Imperial está siendo reconstruido como una institución de estado, no un tribunal decorativo. Sus oficinas se expanden, sus protocolos formalizados y su influencia restablecida mediante nombramientos que vinculan a los ministerios y la sociedad más cercana al Trono. La casa del Emperador funcionará una vez más como el motor silencioso de la cohesión y dirección nacionales."
 JAP_once_millennium_disaster: "Un desastre de una vez en milenio"
 JAP_once_millennium_disaster_desc: "El Gran Terremoto de Japón Oriental del 11 de marzo de 2011, es uno de los desastres más devastadores en la historia japonesa moderna. El terremoto y el tsunami destrozaron la infraestructura, las industrias y los medios de subsistencia en un instante, sumergiendo a la nación en graves disturbios. El camino hacia la recuperación será largo y arduo, exigiendo enormes recursos y tiempo."
 JAP_scars_earthquake_and_tsunami: "Scars del terremoto y Tsunami"
 JAP_scars_earthquake_and_tsunami_desc: "El terremoto del Gran Este de Japón y su devastador tsunami infligieron daños catastróficos en las ciudades, puertos y comunidades costeras de la región de Tohoku. Se destruyeron infraestructuras e instalaciones industriales, lo que socava gravemente la productividad y los medios de subsistencia locales. La recuperación llevará años y requerirá enormes recursos y esfuerzos."
 JAP_scars_earthquake: "Bufandas del terremoto"
 JAP_scars_earthquake_desc: "Los temblores del Gran Terremoto de Japón Oriental también golpearon la región de Kanto, afectando fuertemente las redes de transporte y perturbando partes de la base industrial. Incluso la zona de capital experimentó una disminución temporal de la actividad económica. Aunque la devastación no es tan grave como en Tohoku, la recuperación todavía exige tiempo y esfuerzo considerables."
 JAP_focus_renewable_energy_idea: "Enfoque sobre energía renovable"
 JAP_focus_renewable_energy_idea_desc: "La preocupación por la seguridad nuclear nos ha llevado a priorizar la energía renovable, fortaleciendo nuestra independencia a largo plazo en la generación de energía."
 JAP_focus_energy_TT: "Gastos adicionales: §R0.01%§! del PIB"
 JAP_focus_thermal_power_idea: "Enfoque sobre las centrales de combustible fosil"
 JAP_focus_thermal_power_idea_desc: "Elegir centrales de combustibles fósiles garantiza una producción estable y un suministro inmediato, especialmente mientras que la seguridad nuclear sigue siendo una preocupación nacional."
 JAP_anxiety_nuclear_power: "La ansiedad pública sobre la energía nuclear"
 JAP_anxiety_nuclear_power_desc: "El choque del accidente de Fukushima Daiichi ha propagado el miedo y la desconfianza de la energía nuclear en toda la sociedad. La oposición pública y los retrasos de procedimiento están estancando nuevas construcciones, mientras que la confusión política continúa."
 JAP_shut_down_nuclear_plants: "Cierra todas las plantas nucleares"
 JAP_shut_down_nuclear_plants_desc: "Al decidir apagar la energía nuclear, el gobierno ha respondido directamente a los temores públicos. La oposición sigue siendo, pero la decisión se considera ampliamente como priorización de la seguridad, y el malestar social está disminuyendo gradualmente."
 JAP_nuclear_strict_examination: "Normas de seguridad nuclear más estrictas"
 JAP_nuclear_strict_examination_desc: "En respuesta al accidente, se han fortalecido drásticamente las reglamentaciones y los exámenes. En la actualidad, las nuevas construcciones y los reinicios requieren medidas adicionales y procedimientos prolongados, lo que hace más lenta la energía nuclear para expandirse y menos capaz de operar a niveles anteriores."
 JAP_continue_nuclear_plants: "Continuar la generación de energía nuclear"
 JAP_continue_nuclear_plants_desc: "El gobierno ha optado por mantener la energía nuclear, pero la memoria del accidente sigue viva. Persisten las perturbaciones y el retroceso de la seguridad, alimentando los conflictos políticos que socavan la estabilidad interna."
 JAP_crown_centered: "Resurgencia del Pensamiento Intervenido por la Corona"
 JAP_crown_centered_desc: "Tras los comentarios del Primer Ministro Mori, la retórica tradicionalista y monárquica ha comenzado a ganar impulso en algunos círculos. Como el gobierno ha mostrado la voluntad de hacer uso de esta tendencia, un movimiento que busca reevaluar la Casa Imperial como principio central del estado ha comenzado a adquirir influencia política limitada pero creciente."
 JAP_monarchist_modifier: "Regla imperial"
 JAP_monarchist_modifier_desc: "El Trono ha vuelto al mando, y el estado ahora se mueve por mandato imperial en lugar de negociar con los partidos. Ministerios, órganos de seguridad e industria están alineados bajo una sola doctrina que trata al Emperador como la fuente de legitimidad y dirección."
 JAP_airforce_modifier: "[JAP_airforce_name]"
 JAP_article9_modifier: "Article 9"
 JAP_defense_industry: "Kyōdō Defense Network"
 JAP_defense_industry_2: "Kyōdō Defense Network"
 JAP_landforce_modifier: "[JAP_landforces_name]"
 JAP_navy_modifier: "[JAP_navy_name]"
 JAP_navy_modifier_2: "[JAP_navy_name]"
 JAP_japanese_tech_agency_tt: "[JAP_defense_technology_idea_desc]\n"
 JAP_military_decision_category: "[JAP.GetAdjectiveCap] Militar"
 JAP_consolidate_national_defense_framework_mission: "Consolidar el Marco de Defensa Nacional"
 JAP_consolidate_national_defense_framework_mission_desc: "La transición a una postura de defensa más amplia ha creado incertidumbre en las estructuras de mando, procesos de planificación y responsabilidades legales. Al consolidar el marco de defensa nacional, Japón restablece gradualmente la coherencia y reduce las perturbaciones causadas por la reforma."
 JAP_modernize_joint_command_mission: "Modernizar las estructuras de mando conjunto"
 JAP_modernize_joint_command_mission_desc: "Integrar los ámbitos terrestre, marítimo, aéreo y emergentes en un mando conjunto unificado exige tiempo, entrenamiento y cambio organizativo. A medida que se prueban y afinan los nuevos procedimientos, la fricción baja poco a poco y mejora la eficacia de las fuerzas armadas de Japón."
 JAP_asteroid_mining_light_operation: "Encuesta Celestial de Luz"
 JAP_asteroid_mining_light_operation_desc: "Japón realiza un estudio de asteroides a pequeña escala e invoca la guía de los espíritus ancestrales mientras las sondas rastrean los cielos en busca de minerales utilizables."
 JAP_asteroid_mining_medium_operation: "Misión de extracción divina mediana"
 JAP_asteroid_mining_medium_operation_desc: "Una expedición mayor se adentra más en el cinturón de asteroides y se inspira en el simbolismo mítico mientras Japón busca valiosos metales extraterrestres."
 JAP_asteroid_mining_heavy_operation: "Expedición minera celestial pesada"
 JAP_asteroid_mining_heavy_operation_desc: "Se lanza un esfuerzo de minería de asteroides a gran escala, que evoca relatos de fraguas celestiales mientras Japón se esfuerza por recuperar ricos recursos celestes."
 JAP_mars_mission_program_mission: "Fundación de la Colonia Marte"
 JAP_restore_guarantee: "Solicitar el restablecimiento de las garantías de seguridad de EE. UU."
 JAP_restore_guarantee_desc: "Con el aumento de las tensiones regionales y las dudas sobre nuestro crecimiento de la seguridad a largo plazo, algunas partes del gobierno argumentan que debemos buscar una garantía de seguridad renovada y explícita de los Estados Unidos. Es probable que ello requiera concesiones políticas sobre la política de defensa y la interpretación del artículo 9, pero puede ser el precio de la estabilidad estratégica."
 JAP_remove_american_blockade: "Solicitar el fin de la presión naval de EE. UU."
 JAP_remove_american_blockade_desc: "La mayor presencia naval estadounidense alrededor de nuestros principales carriles marinos se ha convertido en una fuente de tensión en casa y en el extranjero. Los canales diplomáticos siguen abiertos para negociar una reducción o un fin a esta presión, pero Washington seguramente esperará compromisos de seguridad más profundos y nuevos ajustes en nuestra posición del artículo 9 a cambio."
 JAP_restore_trade_relations: "Buscar la normalización del comercio con Estados Unidos"
 JAP_restore_trade_relations_desc: "Los aranceles y las medidas comerciales selectivas impuestas por los Estados Unidos están perjudicando a nuestros exportadores y erosionando la confianza en la alianza. Al involucrar a Washington directamente, podemos normalizar las relaciones económicas, ya que es probable que cualquier alivio significativo esté ligado a una renovada cooperación en materia de seguridad y una interpretación más amplia del artículo 9."
 JAP_chinese_agression_five: "Agresión china creciente"
 JAP_chinese_agression_five_desc: "Las recientes acciones chinas en la región han suscitado preocupación entre nuestros planificadores de defensa. Aunque la situación aún no ha alcanzado un umbral crítico, la tendencia es inequívoca: Pekín escala de forma constante su postura. Los responsables políticos advierten que Japón debe prepararse para la posibilidad de más acontecimientos desestabilizadores."
 JAP_chinese_agression_ten: "Escalada de la presión china"
 JAP_chinese_agression_ten_desc: "China ha intensificado su presión militar y geopolítica en la región. Las incursiones de patrullas, los desafíos al espacio aéreo y la retórica agresiva han aumentado de forma significativa. La creciente frecuencia de estos incidentes sugiere una estrategia deliberada de poner a prueba la determinación de Japón y remodelar el equilibrio regional."
 JAP_chinese_agression_twelve: "Alarmantes actividades chinas"
 JAP_chinese_agression_twelve_desc: "Las últimas acciones de Pekín marcan una escalada preocupante. Los informes de inteligencia indican mayores despliegues navales, ejercicios militares cerca de aguas en disputa y mensajes políticos dirigidos directamente a Japón. La situación es cada vez más inestable y crecen las exigencias de una respuesta nacional más firme."
 JAP_chinese_agression_fourteen: "Provocaciones chinas graves"
 JAP_chinese_agression_fourteen_desc: "China ha dado varios pasos agresivos que van más allá de la presión rutinaria. Se han desplegado activos estratégicos cerca del territorio japonés y las incursiones en nuestras aguas circundantes han alcanzado una frecuencia nueva. Los responsables de defensa advierten que Japón quizá deba reconsiderar elementos de su postura de seguridad."
 JAP_chinese_agression_sixteen: "Escalada China Peligrosa"
 JAP_chinese_agression_sixteen_desc: "La situación regional se está volviendo cada vez más peligrosa. Las maniobras militares chinas ahora parecen diseñadas para intimidar al Japón directamente, y los canales de propaganda en Beijing han adoptado un tono más duro. La posibilidad de una crisis provocada por el mal cálculo aumenta drásticamente."
 JAP_chinese_agression_eighteen: "Presión militar china crítica"
 JAP_chinese_agression_eighteen_desc: "La postura agresiva de China ha llegado a un punto crítico. Las zonas marítimas clave están bajo presión constante, las incursiones aéreas están en niveles sin precedentes y los socios regionales dan la alarma. Los responsables políticos de Tokio sostienen que Japón debe reevaluar su estrategia de defensa, incluida la interpretación del Artículo 9."
 JAP_chinese_agression_twenty: "Grave crisis regional: pico de agresión china"
 JAP_chinese_agression_twenty_desc: "La situación se ha convertido en una crisis regional a gran escala. China ha realizado extensivos despliegues militares cerca del territorio japonés, lo que indica la voluntad de intensificarse aún más. La amenaza a la seguridad nacional ya no es teórica, el Japón enfrenta un desafío directo que puede forzar decisiones históricas sobre su postura militar y el papel de las Fuerzas de Autodefensa."
 JAP_world_tension_high: "Revisión de la postura de seguridad"
 JAP_world_tension_high_desc: "La creciente inestabilidad mundial exige que Japón reevalúe sus políticas defensivas y se prepare para posibles cambios en el orden internacional."
 JAP_world_tension_high2: "Prepararse para contingencias regionales"
 JAP_world_tension_high2_desc: "El mundo es cada vez más peligroso. El Japón debe adoptar medidas concretas para garantizar la seguridad nacional y mantener la preparación estratégica."
 JAP_world_tension_high3: "Activar medidas de seguridad nacional"
 JAP_world_tension_high3_desc: "Las tensiones globales han alcanzado un nivel crítico. Japón debe ahora considerar medidas extraordinarias para salvaguardar los intereses nacionales y sostener la estabilidad regional."
 JAP_article_nine_protests_appeal: "Responder a las protestas a favor de la defensa"
 JAP_article_nine_protests_appeal_desc: "Las protestas generalizadas en favor de la defensa exigen mayores capacidades militares y una postura de seguridad más dura. Al actuar sobre estos llamamientos y ampliar la interpretación del artículo 9, el gobierno puede aprovechar la presión pública para justificar una política de defensa nacional más firme."
 JAP_article_nine_protests_appeal_tt: "§Y§! es por lo menos §R50§!"
 JAP_article_nine_protests_appeal_tt2: "[JAP.GetName] no tiene §YLey militar deseada§!"
 JAP_article_nine_military_parties: "Apalancamiento de las Partes pro-militares"
 JAP_article_nine_military_parties_desc: "Los partidos promilitares dentro del gobierno presionan por una defensa nacional más fuerte y una interpretación más amplia del Artículo 9. Al alinearse con su agenda, el gobierno puede avanzar en reformas militares y justificar un mayor nivel de preparación defensiva."
 JAP_article_nine: "Article 9 Interpretation"
 JAP_article_nine_left_side: "Pacifismo estricto"
 JAP_article_nine_level_one: "Nivel I: Interpretación Pacifista"
 JAP_article_nine_level_two: "Nivel II: Interpretación defensiva"
 JAP_article_nine_level_three: "Nivel III: Defensa Cooperativa"
 JAP_article_nine_level_four: "Nivel IV: Autodefensa colectiva"
 JAP_article_nine_level_five: "Nivel V: Función militar ampliada"
 JAP_article_nine_right_side: "Activo Defensa"
 JAP_great_east_japan_earthquake_decision: "Camino a la Reconstrucción"
 JAP_great_east_japan_earthquake_decision_desc: "El 11 de marzo de 2011, el Gran Terremoto del Este de Japón golpeó a la nación con temblores y tsunamis sin precedentes y desató una devastación nunca vista en la historia moderna. De Tohoku a Kanto, vastas regiones quedaron paralizadas, con redes de transporte detenidas, actividad económica parada e incontables vidas trastocadas. Comunidades e industrias perdieron sus cimientos, y toda la nación se sumió en la confusión y la incertidumbre.\n\nEl desastre no fue solo de destrucción física; dejó una profunda cicatriz en la psique nacional y obligó a la sociedad a reconsiderar sus propios fundamentos. Japón se encuentra ahora en una encrucijada, con la inmensa tarea de recuperarse y renovarse. Reconstruir las regiones devastadas, restaurar las industrias y revivir las vidas y los lazos de su pueblo son responsabilidades ineludibles del Estado.\n\nEste esfuerzo, conocido como el «Camino a la reconstrucción», será largo y arduo. Pero solo superando tal adversidad podrá Japón labrarse un futuro renovado."
 JAP_tohoku_infrastructure_decision: "Reconstrucción de infraestructura Tohoku"
 JAP_tohoku_infrastructure_decision_desc: "Paso a paso, debemos reconstruir la infraestructura devastada por el terremoto. Restaurar caminos, ferrocarriles y puertos, los cimientos de las economías regionales y la vida cotidiana, es el primer paso hacia la recuperación."
 JAP_kanto_infrastructure_decision: "Kanto Infraestructura Reconstrucción"
 JAP_kanto_infrastructure_decision_desc: "Paso a paso, debemos reconstruir la infraestructura devastada por el terremoto. Restaurar caminos, ferrocarriles y puertos, los cimientos de las economías regionales y la vida cotidiana, es el primer paso hacia la recuperación."
 JAP_tohoku_communication_decision: "Restablecer las telecomunicaciones en Tohoku"
 JAP_tohoku_communication_decision_desc: "La infraestructura de telecomunicaciones devastada por el desastre es vital para la recuperación y la vida cotidiana. Paso a paso, la restauración debe proceder a reconectar comunidades y revitalizar la economía."
 JAP_kanto_communication_decision: "Restablecer las telecomunicaciones en Kanto"
 JAP_kanto_communication_decision_desc: "La infraestructura de telecomunicaciones devastada por el desastre es vital para la recuperación y la vida cotidiana. Paso a paso, la restauración debe proceder a reconectar comunidades y revitalizar la economía."
 JAP_tohoku_industrial_recovery_decision: "Revitalizar la industria en Tohoku"
 JAP_tohoku_industrial_recovery_decision_desc: "Revivir las industrias locales paralizadas por el desastre es esencial para la recuperación económica. Restaurar las industrias civiles ayudará a crear empleo y a reforzar la base de la producción."
 JAP_kanto_industrial_recovery_decision: "Revitalizar la industria en Kanto"
 JAP_kanto_industrial_recovery_decision_desc: "Revivir las industrias locales paralizadas por el desastre es esencial para la recuperación económica. Restaurar las industrias civiles ayudará a crear empleo y a reforzar la base de la producción."
 JAP_domestic_policy_decision: "[JAP.GetFlag][JAP.GetAdjective] Política interna Decisiones"
 JAP_focus_renewable_energy_decision: "Centrarse en las energías renovables"
 JAP_focus_renewable_energy_decision_desc: "Ante la creciente preocupación por la seguridad de la energía nuclear, una mayor inversión en energía solar, eólica y otras fuentes renovables ofrece un camino para diversificar la energía y reducir la dependencia de los combustibles importados."
 JAP_focus_thermal_power_decision: "Centrarse en las centrales de combustibles fósiles"
 JAP_focus_thermal_power_decision_desc: "Ante las preocupaciones por la seguridad nuclear, ampliar las centrales de carbón, petróleo y gas natural da una fuente de electricidad más inmediata y confiable para la nación."
 JAP_saudi_aramco_crude_storage: "Almacenamiento de crudo de Saudi Aramco"
 JAP_saudi_aramco_crude_storage_desc: "Asegurar almacenamiento de crudo dedicado mediante Saudi Aramco para estabilizar el suministro y reducir la exposición a choques bruscos del mercado. Al anclar el acceso a largo plazo y la entrega previsible, Japón compra un respiro estratégico."
 JAP_overseas_upstream_equity: "Comprar los pozos en la fuente"
 JAP_overseas_upstream_equity_desc: "INPEX, el explorador insignia de la nación, y los financieros estatales de JOGMEC toman acciones en campos desde Abu Dhabi hasta el Extremo Oriente Ruso, aislando al país de los caprichos del mercado local. Cada barril extraído de un pozo de propiedad japonesa es un cañón que ningún rival puede retener. La propiedad es la fuente de apoyo."
 JAP_kosaka_tsl_furnace: "Ampliación del horno TSL de Kosaka"
 JAP_kosaka_tsl_furnace_desc: "El procesamiento es tan estratégico como la extracción. Ampliaremos la capacidad del horno TSL de Kosaka para manejar chatarra compleja y concentrados mixtos y recuperar metales críticos que de otro modo se perderían."
 JAP_green_ship_recycling: "Reciclaje de buques verdes"
 JAP_green_ship_recycling_desc: "Una flota no solo se construye, también se desmantela, y el acero debe volver a la nación. Estableceremos normas y capacidad de reciclaje verde de buques para recuperar materiales de alto valor de forma segura y eficiente. Cada casco retirado será recursos para el siguiente."
 JAP_bibi_world_decision: "Puesta en marcha de la fundición Rapidus IIM-1 «Bibi World»"
 JAP_bibi_world_decision_desc: "Acelerar la puesta en marcha de la fundición Rapidus IIM-1 «Bibi World» para asegurar capacidad de semiconductores de nueva generación en suelo japonés."
 JAP_yufutsu_oil_expansion_decision: "Expansión de aceite de Yufutsu"
 JAP_yufutsu_oil_expansion_decision_desc: "Ampliar el yacimiento de Yufutsu para reforzar el suministro nacional y reducir la exposición a interrupciones externas."
 JAP_toray_expansion_program_decision: "Programa de Expansión por Rayos"
 JAP_toray_expansion_program_decision_desc: "Ampliar la producción de materiales avanzados de Toray para reforzar la base industrial de Japón donde más importa."
 JAP_teijin_aerospace_prepreg_decision: "Preimpregnado aeroespacial Teijin"
 JAP_teijin_aerospace_prepreg_decision_desc: "Ampliar la capacidad de preimpregnado de grado aeroespacial de Teijin para asegurar la columna vertebral de compuestos de las células modernas y de los sistemas de defensa de gama alta."
 JAP_demand_south_kuril: "Exigir las Kuriles del Sur"
 JAP_demand_south_kuril_desc: "Tokio emitirá una demanda formal para el regreso de las Islas Kuril del Sur. Moscú puede conceder para evitar la escalada, o rechazar y arriesgar una crisis."
 JAP_demand_north_kuril: "Exigir las Kuriles del Norte"
 JAP_demand_north_kuril_desc: "Japón exigirá la devolución de las Kuriles del Norte como parte de una agenda más amplia de restauración imperial. Una negativa puede usarse para justificar una mayor escalada."
 JAP_demand_sakhalin: "Demanda Sakhalin"
 JAP_demand_sakhalin_desc: "Japón exigirá la devolución de Sajalín. Si el gobierno soviético rechaza la exigencia, Tokio afrontará una elección entre contención, conflicto limitado o guerra."
 JAP_peaceout_russia: "Paz con Rusia"
 JAP_peaceout_russia_desc: "Forzaremos un acuerdo con Rusia para poner fin a la guerra en nuestros términos y asegurar lo que hemos tomado. Esta es una decisión política tanto como militar, que bloquea la nueva realidad en los tratados antes de que Moscú pueda reagruparse. Si Rusia acepta, el combate termina y el mapa cambia para siempre."
 JAP_claiming_south_korea: "Afirmar una reclamación sobre Corea"
 JAP_claiming_south_korea_desc: "Enmarcaremos a Corea como cuestión de seguridad japonesa y prerrogativa histórica, convirtiendo la ambigüedad en una afirmación explícita. Esto no es un gesto, es una declaración de que nuestra frontera estratégica no termina en el Estrecho del Tsushima. Una vez hecha la reclamación, cada negociación futura comenzará en nuestros términos."
 JAP_claiming_north_korea: "Definir la cuestión norte de Corea"
 JAP_claiming_north_korea_desc: "El régimen de Pyongyang no es un vecino, es una crisis permanente que amenaza nuestros mares y nuestras ciudades. formalizaremos la afirmación de Japón de dar forma al futuro de la península del Norte, tratandolo como un asunto de seguridad que no puede ser dejado a otros. Una vez declarado, el Norte será un problema que se gestionará en términos japoneses."
 JAP_claiming_taiwan: "Reafirmar nuestro mandato sobre Taiwán"
 JAP_claiming_taiwan_desc: "Taiwán se sienta en la bisagra de la primera cadena insular y la garganta de nuestra seguridad marítima. Reafirmaremos un mandato japonés sobre la isla, enmarcando su estatus como una necesidad estratégica más que un asunto para que los poderes distantes decidan. Una vez declarado, Japón tratará el futuro de Taiwán como inseparable del suyo."
 JAP_claiming_malaysia: "Afirmar una reclamación sobre Malaya"
 JAP_claiming_malaysia_desc: "Malaya se asienta sobre estrechos y rutas de suministro clave que deciden el flujo del comercio y el combustible de la región. Afirmaremos una reclamación formal y plantearemos su estatus como asunto de seguridad japonesa y orden marítimo. Una vez declarada, toda negociación comenzará con nuestro mandato sobre la mesa."
 JAP_claiming_indonesia: "Un mandato en Indonesia"
 JAP_claiming_indonesia_desc: "Indonesia controla las islas y los estrechos que unen los océanos Índico y Pacífico. Reclamaremos un mandato sobre el archipiélago y trataremos sus rutas marítimas y recursos como necesidades estratégicas de Japón. Si la región ha de tener orden, se impondrá desde Tokio."
 JAP_claiming_vietnam: "Declarar nuestro interés en Vietnam"
 JAP_claiming_vietnam_desc: "Vietnam ancla el borde del Mar de China Meridional y ofrece bases que pueden dar forma al equilibrio de toda la costa. Declararemos el interés de Japón y dejaremos claro que su alineación no se decidirá sin nosotros. La influencia comienza con certeza, y la certidumbre comienza con un reclamo."
 JAP_claiming_cambodia: "Extender la Esfera a Camboya"
 JAP_claiming_cambodia_desc: "Camboya es pequeña, pero la geografía la convierte en corredor, tampón y palanca en el Sudeste Asiático continental. Extenderemos nuestra reclamación y ataremos su futuro a la esfera japonesa más amplia. Lo que parece menor en el mapa puede decidir la estabilidad de la región."
 JAP_claiming_laos: "Reclamar el interior del Mekong"
 JAP_claiming_laos_desc: "Laos controla rutas terrestres, ríos y la profundidad silenciosa tras la costa. Reclamaremos el interior del Mekong como parte de nuestra seguridad continental, para que los rivales no puedan usarlo como puerta trasera a nuestra esfera. El control no son solo los puertos, son los corredores."
 JAP_claiming_australia: "Declarar una reclamación sobre Australia"
 JAP_claiming_australia_desc: "Australia es el ancla sur del Pacífico, un continente que puede albergar flotas, poder aéreo y la logística de una guerra larga. Declararemos una reclamación y señalaremos que los accesos del sur no seguirán fuera del alcance estratégico de Japón. Si el sur está asegurado, el océano seguirá."
 JAP_claiming_new_zealand: "Reclamar los puestos avanzados del sur"
 JAP_claiming_new_zealand_desc: "Nueva Zelanda puede estar lejos, pero se sitúa en rutas que importan cuando el Pacífico se disputa. Reclamaremos los puestos avanzados del sur y negaremos a los rivales una retaguardia segura fuera de nuestro alcance. Hasta las islas lejanas se vuelven armas cuando otros las tienen."
 JAP_claiming_myanmar: "Afirmar el control de la Puerta del Irrawaddy"
 JAP_claiming_myanmar_desc: "Myanmar es un puente terrestre entre océanos y una puerta de entrada al interior de la región. Afirmaremos una reclamación y trataremos sus puertos, corredores y aeródromos como activos estratégicos de la esfera de Japón. Quien tiene la puerta decide quién entra."
 JAP_demand_palau: "Demanda Palau"
 JAP_demand_palau_desc: "Palaos es una pequeña cadena con una gran huella en la planificación naval, que ofrece fondeaderos, vigilancia y alcance. Exigiremos su sumisión a la autoridad japonesa y la aseguraremos como puesto avanzado de nuestro orden del Pacífico. El mapa se escribe con bases, no con discursos."
 JAP_demand_micronesia: "Demanda de Micronesia"
 JAP_demand_micronesia_desc: "Micronesia se extiende por el Pacífico central como peldaños para flotas y aeronaves. Exigiremos el control para asegurar las rutas de tránsito y negar a los rivales una zona de escala en nuestro océano. Una vez en nuestras manos, estas islas convierten la distancia en ventaja."
 JAP_demand_nauru: "Demanda Nauru"
 JAP_demand_nauru_desc: "Nauru es diminuta, pero islas como esta deciden la cobertura de vigilancia y el acceso en aguas extensas. Exigiremos su alineamiento con Japón y la incorporaremos a nuestra red de puestos avanzados. En la era marítima, ninguna isla es irrelevante."
 JAP_demand_kiribati: "Demanda Kiribati"
 JAP_demand_kiribati_desc: "Kiribati se extiende sobre accesos clave que pueden apoyar el reconocimiento, el reabastecimiento y la interdicción. Exigiremos su sumisión a la dirección japonesa y aseguraremos las islas como un eslabón de nuestro perímetro más amplio. El Pacífico se organizará, eslabón por eslabón."
 JAP_demand_marshall_islands: "Exigir las Islas Marshall"
 JAP_demand_marshall_islands_desc: "Las Islas Marshall proporcionan espacio para aeródromos, logística y control sobre las rutas centrales del Pacífico. Exigiremos su transferencia a la esfera de Japón y los convertiremos en piedras de paso fortificadas para operaciones de flota. Quien tenga estos atolones puede formar un teatro entero."
 JAP_demand_tuvalu: "Demanda Tuvalu"
 JAP_demand_tuvalu_desc: "Tuvalu ofrece poca tierra, pero ofrece presencia y la presencia decide el control del mar. Exigiremos la alineación de Tuvalu y lo aseguraremos como un puesto de escucha y punto de acceso en el Pacífico meridional. Incluso las islas más pequeñas pueden anclar un perímetro."
 JAP_demand_solomon_islands: "Exigir las Islas Salomón"
 JAP_demand_solomon_islands_desc: "Los Salomón son una barrera natural y zona de estadificación en el Pacífico suroeste, ideal para aeródromos y cubierta naval. Exigiremos su presentación a Japón y bloquearemos las rutas que pasan por ellas. El control aquí significa control del movimiento."
 JAP_demand_guinea: "Demanda Nueva Guinea"
 JAP_demand_guinea_desc: "Nueva Guinea es un bastión de tamaño continental que domina los accesos entre el Sudeste Asiático y el Pacífico. Exigiremos su traspaso y la convertiremos en una fortaleza de poder aéreo, logística y defensa avanzada. Con Nueva Guinea asegurada, el teatro del sur se doblega a nuestra voluntad."
 JAP_demand_vanuatu: "Demanda Vanuatu"
 JAP_demand_vanuatu_desc: "Vanuatu se sienta en líneas que importan para reaprovisionarse y llegar al Pacífico sudoccidental. Exigiremos su alineación con Japón e integrarlo en nuestra red de basing. Una cadena de islas se convierte en una pared cuando se mantiene unida."
 JAP_demand_fiji: "Demanda Fiji"
 JAP_demand_fiji_desc: "Fiyi es un centro neurálgico del Pacífico Sur, capaz de sostener la logística de flota y las operaciones aéreas en un amplio arco. Exigiremos su sumisión a Japón y la aseguraremos como piedra angular de nuestro perímetro sur. Cuando Fiyi sea nuestra, el equilibrio de la región cambia."
 JAP_demand_samoa: "Samoa"
 JAP_demand_samoa_desc: "Samoa se asienta sobre rutas que conectan el Pacífico central con los accesos del sur. Exigiremos el alineamiento de Samoa con Japón e integraremos sus puertos y aeródromos en nuestro perímetro más amplio. En un imperio oceánico, hasta las islas lejanas se vuelven decisivas."
 JAP_demand_tonga: "Demanda Tonga"
 JAP_demand_tonga_desc: "Tonga ofrece una posición estratégica en el Pacífico Sur y una plataforma para vigilar el movimiento a través de las aguas anchas. Exigiremos la sumisión de Tonga a la dirección japonesa y la aseguraremos como parte de nuestra cadena de control sur. La neutralidad es un lujo que no permitiremos en nuestros carriles marinos."
 JAP_demand_american_islands: "Exigir las islas estadounidenses"
 JAP_demand_american_islands_desc: "Las islas en manos estadounidenses no son solo territorio, son bases avanzadas que proyectan poder sobre nuestro océano. Exigiremos su transferencia o neutralización bajo autoridad japonesa, y negaremos a Washington un punto de apoyo a nuestras puertas. Si el Pacífico ha de ordenarse, hay que retirar las posiciones extranjeras."
 JAP_demand_french_islands: "Exigir las islas francesas"
 JAP_demand_french_islands_desc: "Las posesiones insulares francesas dan alcance, puertos y cobertura diplomática a la presencia extranjera en el Pacífico. Exigiremos su sumisión a Japón y las integraremos en nuestra red de puestos avanzados y corredores. Nuestra esfera no será perforada por imperios lejanos."
 JAP_demand_british_islands: "Exigir las islas británicas"
 JAP_demand_british_islands_desc: "Las posesiones insulares británicas son remanentes de un orden más antiguo, pero aún ofrecen bases e influencia en rutas críticas. Exigiremos su traspaso a la esfera de Japón y cerraremos otra brecha en nuestro perímetro marítimo. El Pacífico se organizará bajo una sola autoridad, la nuestra."
 JAP_imperial_procurement_standardization: "Normalización de las adquisiciones imperiales"
 JAP_imperial_procurement_standardization_desc: "Centralizar las reglas de adquisiciones, estandarizar componentes y hacer cumplir especificaciones comunes en las fuerzas armadas. El objetivo es una producción más rápida, una logística más simple y menos cuellos de botella de producción."
 JAP_zaibatsu_empowerment_charter: "Carta sobre el Empoderamiento de Zaibatsu"
 JAP_zaibatsu_empowerment_charter_desc: "Conceder privilegios ampliados a conglomerados industriales selectos a cambio de metas de producción vinculantes fijadas por el gobierno imperial."
 JAP_neighborhood_associations_system: "Vecindad Associations System"
 JAP_neighborhood_associations_system_desc: "Reconstruir una red nacional de asociaciones locales para registrar hogares, coordinar la distribución y apoyar una movilización rápida. Refuerza el control social y mejora la capacidad de respuesta del Estado."
 JAP_state_rites_restoration: "Estado Rites Restauración"
 JAP_state_rites_restoration_desc: "Restaurar las ceremonias estatales y los ritos públicos como pilar central de la vida nacional. Esta reforma refuerza la legitimidad imperial y fomenta la conformidad pública con el orden restaurado."
 JAP_national_morals_education_act: "Ley Nacional de Moral y Educación"
 JAP_national_morals_education_act_desc: "Normalizar la educación cívica en torno al deber, el servicio y la cohesión nacional. Las escuelas se utilizarán para construir disciplina, ampliar la preparación y fomentar la lealtad al estado restaurado."
 JAP_imperial_rescript_revival: "Revival de los reclutas imperiales"
 JAP_imperial_rescript_revival_desc: "Revivir un rescripto imperial oficial para anclar la legitimidad del Estado y definir las obligaciones del ciudadano. El orden restaurado se presentará como un regreso a la unidad, el deber y el propósito nacional."
 JAP_north_korean_remilitarized_dmz: "Responder a la escalada norcoreana en la DMZ"
 JAP_north_korean_remilitarized_dmz_desc: "Corea del Norte ha reforzado posiciones a lo largo de la Zona Desmilitarizada. Tokio citará esta escalada para endurecer su postura de seguridad y ampliar su margen operativo bajo el Artículo 9."
 JAP_north_korean_increased_nuclear_testing: "Responder a las pruebas nucleares norcoreanas"
 JAP_north_korean_increased_nuclear_testing_desc: "Un ritmo renovado de pruebas nucleares ha elevado el entorno de amenaza regional. El gobierno lo usará para justificar una interpretación más estricta del Artículo 9 y acelerar las medidas de preparación."
 JAP_north_korean_threats_to_south_korea: "Responder a las amenazas de Corea del Norte"
 JAP_north_korean_threats_to_south_korea_desc: "Las amenazas directas contra la República de Corea aumentan el riesgo de un conflicto más amplio que podría desbordarse hacia el perímetro de seguridad de Japón. Tokio puede ampliar la interpretación del Artículo 9 y reforzar la planificación de la disuasión."
 JAP_north_korean_road_to_war: "Prepararse para la marcha de Corea del Norte hacia la guerra"
 JAP_north_korean_road_to_war_desc: "La situación se desliza hacia un conflicto abierto. Japón ya no puede depender solo de la moderación. Una interpretación revisada del artículo 9 permitirá una planificación militar más sólida y opciones de respuesta más rápidas."
 JAP_russian_agressiveness: "Responder a la agresividad rusa"
 JAP_russian_agressiveness_desc: "La postura cada vez más asertiva de Rusia en el Noreste de Asia socava la estabilidad regional. Tokio usará el entorno de amenaza elevado para reforzar la disuasión y ampliar su margen operativo bajo el Artículo 9."
 JAP_defence_russian_asian_ambitions: "Contrarrestar las ambiciones asiáticas de Rusia"
 JAP_defence_russian_asian_ambitions_desc: "Las ambiciones de Moscú en Asia amenazan el entorno de seguridad de Japón y el equilibrio de poder en el Pacífico. Tokio endurecerá su postura de defensa y ampliará las opciones operativas bajo el Artículo 9."
 JAP_russian_north_korean_alliance: "Prepararse para un eje Rusia-Corea del Norte"
 JAP_russian_north_korean_alliance_desc: "Una alineación más estrecha entre Rusia y Corea del Norte apretaría la presión sobre Japón desde varias direcciones. Tokio responderá reforzando la disuasión y relajando las restricciones restantes del Artículo 9."
 JAP_russian_pacific_naval_presence: "Responder al refuerzo naval ruso en el Pacífico"
 JAP_russian_pacific_naval_presence_desc: "La postura naval de Rusia en el Pacífico se vuelve más asertiva. Japón usará este cambio para justificar una mayor preparación marítima y una interpretación más flexible del Artículo 9."
 JAP_tookover_sikhalin_mission: "Plazo para recuperar los territorios perdidos"
 JAP_tookover_sikhalin_mission_desc: "El tiempo se acaba. Si Rusia no recupera los objetivos requeridos antes de la fecha límite, la presión internacional y el agotamiento nacional forzarán un acuerdo. Se firmará una paz, y los territorios perdidos serán cedidos como el precio de terminar la guerra."
 JAP_russia_demands_peace_japan: "Un acuerdo de paz con Rusia"
 JAP_russia_demands_peace_japan_desc: "Con las Islas Kuril y Sakhalin ahora firmemente bajo control japonés, Tokio ha presentado una propuesta para poner fin a la guerra. La oferta es simple y calculada: paz a cambio de Rusia reconociendo la nueva realidad en el norte. No es un acto de caridad sino una solución estratégica, asegurando nuestras ganancias mientras que escupe a ambas naciones el costo de un conflicto prolongado. La aceptación llevaría la guerra a su fin y formalizaría nuestro control sobre los territorios capturados. El rechazo indicaría que Moscú está dispuesto a continuar una guerra que ya no es seguro ganar."
 JAP_russia_demands_peace_russia: "Exigir la paz a Japón"
 JAP_russia_demands_peace_russia_desc: "Exigiremos un acuerdo con Japón para poner fin a los combates y congelar la situación antes de que empeore. Esto no es reconciliación, es control de daños, bloqueo en términos mientras todavía tenemos ventaja para forzar un resultado. Si Tokio se niega, sabremos que buscan la victoria, no la paz."
 JAP_auto_claiming_tt: "Al seleccionar esta decisión, se repetirá hasta que todos los estados centrales sean reclamados. Entonces usted puede exigir la presentación"
 JAP_intellectual_platform_decision: "$JAP_intellectual_platform$"
 JAP_intellectual_platform_decision_desc: "$JAP_intellectual_platform_desc$"
 JAP_declining_birthrate_category: "Agencia de Medidas contra la Natalidad en Descenso"
 JAP_declining_birthrate_category_desc: "La crisis demográfica de Japón es multifacética: los nacimientos van por detrás de las muertes, la proporción de jubilados crece cada año y la población en edad de trabajar se contrae sin poder reemplazarse. Sin una acción coordinada, la tensión se propaga a la oferta de mano de obra, la solvencia de las pensiones, la estabilidad del Estado y la vitalidad económica de las prefecturas rurales. No hay una solución rápida única, solo una reforma sostenida e integral repartida en varios ámbitos de política.\n\nLas decisiones disponibles aquí están pensadas para funcionar junto con las ramas de enfoque demográfico. Cada una apunta a una o más dimensiones de la crisis (el déficit de nacimientos, la escasez de mano de obra, el umbral de desempleo, la carga de costos sanitarios, la carga de costos sociales o la erosión de la estabilidad) y cada decisión se retira sola cuando mejora su condición objetivo, lo que evita el abuso de una sola palanca.\n\n§YEl progreso se muestra en el espíritu nacional §!§G$JAP_demographic_pressure_modifier$§!§Y: a medida que se completan los enfoques demográficos y se toman las decisiones pertinentes, las penalizaciones del modificador se aflojan gradualmente hacia cero. La desatención sostenida deja que la presión permanezca o empeore, y erosiona la estabilidad y la capacidad económica.§!"
 JAP_territorial_disputes: "[JAP.GetNameWithFlag] disputas territoriales"
 JAP_territorial_disputes_desc: "[JAP.GetName] se encuentra actualmente en disputas territoriales con países vecinos en las siguientes tres regiones:\n\n§YTerritorios del Norte (Islas del Kuril Meridional)§!: [JAP.GetName] reclama las islas de Etorofu, Kunashiri, Shikotan y el grupo Habomai, situado al noreste de Hokkaido, argumentando que su ocupación por la Unión Soviética después de la Segunda Guerra Mundial fue ilegítima y sigue buscando su regreso del [SOV.GetName]. [SOV.GetName], por otro lado, afirma soberanía sobre las islas y mantiene un control efectivo.\n\n§YTakeshima[KOR.GetAdjective] nombre: Dokdo)§!: Situado en el mar de [JAP.GetName] (Mar Oriental), esta isla es reclamada por [JAP.GetName] pero ha estado bajo control efectivo [KOR.GetName] Desde la década de 1950, la controversia sigue siendo una cuestión muy contenciosa entre los dos países, que entraña interpretaciones históricas y derechos de pesca, y se considera políticamente sensible.\n§YDebido a que Takeshima es demasiado pequeño para ser mostrado en el mapa, incluso una negociación exitosa no resultará en ganancias territoriales. Sin embargo, usted todavía será capaz de obtener los modificadores descritos abajo!§!\n\n§YIslas Senkaku (nombre chino: Islas Diaoyu)§!: Este grupo de islotes no habitados en el Mar de China Oriental ha estado bajo [JAP.GetName]'s control efectivo desde 1895, pero también se reclama por [CHI.GetName] y [TAI.GetName]Desde el decenio de 1990, las repetidas protestas diplomáticas y las afirmaciones concurrentes han hecho que la cuestión sea un punto de inflexión potencial para las tensiones futuras.\n\nTodas estas controversias están profundamente entrelazadas con la historia, el derecho internacional, el control efectivo, las relaciones diplomáticas y la opinión pública nacional. Resolverlas requiere fomentar vínculos más estrechos y un entendimiento mutuo con los países involucrados.\n\n§YHint: Aumentar la opinión del país objetivo o aumentar su influencia sobre ellos hará que las negociaciones tengan más probabilidades de tener éxito!§!\n\n§YRecompensa:§! Si las negociaciones tienen éxito, usted puede ganar modificadores a §G$MODIFIER_STABILITY_FACTOR$§! y §G$agriculture_district_income_tax_modifier$§!!"
 JAP_territorial_disputes_TT: "Si las negociaciones tienen éxito, además de resolver la cuestión territorial, podrás obtener bonos de §G$MODIFIER_STABILITY_FACTOR$§! y §G$agriculture_district_income_tax_modifier$§!"
 JAP_dec_negotiations_resolve_northern_territories_dispute: "Negociaciones para resolver la disputa de los Territorios del Norte"
 JAP_dec_negotiations_resolve_northern_territories_dispute_desc: "La cuestión territorial sobre los Territorios del Norte sigue siendo una de las cuestiones no resueltas más importantes en la diplomacia posterior a la guerra [JAP.GetName]-[SOV.GetName]. Hacer frente a esta cuestión y buscar una resolución pacífica es crucial para restaurar la soberanía de [JAP.GetName] y garantizar la estabilidad en el Lejano Oriente. Si se establecen suficientes condiciones de confianza mutua y negociación, podemos iniciar negociaciones diplomáticas oficiales con [SOV.GetName] para solicitar el regreso de los territorios."
 JAP_dec_negotiations_resolve_senkaku_dispute_china: "Negociaciones para resolver la disputa de las islas Senkaku con [CHI.GetName]"
 JAP_dec_negotiations_resolve_senkaku_dispute_china_desc: "Las reivindicaciones territoriales de [CHI.GetName] sobre las Islas Senkaku se han convertido en un factor desestabilizador en las relaciones [JAP.GetName]-[CHI.GetName]. Como la parte que ejerce un control efectivo sobre las islas, [JAP.GetName] trata de resolver esta cuestión diplomáticamente persuadiendo [CHI.GetName] a retirar su reclamación. Con la necesaria confianza mutua e influencia internacional en su lugar, ahora estamos preparados para iniciar negociaciones directas con [CHI.GetName]."
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan: "Negociaciones para resolver la disputa de las islas Senkaku con [TAI.GetName]"
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan_desc: "[TAI.GetName] La reivindicación territorial sobre las Islas Senkaku se ha convertido en un obstáculo potencial para la confianza mutua y la cooperación entre [JAP.GetName] y [TAI.GetName]. Para obtener el reconocimiento diplomático del control efectivo de [JAP.GetName] sobre las islas, ahora estamos dispuestos a entablar negociaciones pacíficas con las autoridades [TAI.GetAdjective]."
 JAP_dec_negotiations_resolve_takeshima_dispute: "Negociaciones para resolver la disputa de Takeshima"
 JAP_dec_negotiations_resolve_takeshima_dispute_desc: "La disputa territorial con [KOR.GetName] sobre Takeshima ha sido durante mucho tiempo un obstáculo importante en las relaciones [JAP.GetName]-[KOR.GetName]. Nuestra nación está dispuesta a proponer formalmente negociaciones territoriales al gobierno [KOR.GetAdjective], buscando una resolución mediante la diplomacia calmada y sincera."
 JAP_base_okinawa_decision: "Futuro de las fuerzas de EE. UU. en Okinawa"
 JAP_base_okinawa_decision_desc: "Okinawa sigue albergando un número importante de bases militares estadounidenses, que afectan tanto al marco de seguridad de Japón como a las comunidades locales.\nEl gobierno japonés estudia ahora formas de reevaluar el arreglo actual en busca de mayor autonomía de seguridad y menores cargas regionales.\nA través del compromiso diplomático puede hallarse un nuevo equilibrio en la relación de seguridad Japón-EE. UU.\n\nPista: la §Yinfluencia de [JAP.GetName] en [USA.GetName]§! y la §Yinfluencia de [USA.GetName] en [JAP.GetName]§! afectan la probabilidad de éxito de la negociación. Además, también puedes aumentarla §Yresolviendo el Equilibrio de Poder sobre el Artículo 9§! o §Ysubiendo el gasto militar hasta al menos $defence_04$§!."
 JAP_negotiation_base_okinawa: "Iniciar negociaciones sobre la retirada de EE. UU. de Okinawa"
 JAP_negotiation_base_okinawa_desc: "Para mejorar la autonomía de seguridad nacional, Japón iniciará negociaciones diplomáticas sobre el retiro de las fuerzas militares estadounidenses estacionadas en Okinawa.Este movimiento tiene como objetivo reevaluar los actuales arreglos de seguridad y explorar un marco más adaptable a la luz de la dinámica regional en evolución."
 Japan.101.t: "Disolución Postal: Poniendo nuestro mandato al examen"
 Japan.101.d: "El debate sobre la privatización postal se ha reunido con una fuerte resistencia en la Dieta, y las deliberaciones están cada vez más tensas. Incluso dentro del partido, las voces cautelosas y opuestas siguen siendo fuertes: algunos argumentan que debemos proceder a través de ajustes y revisiones, mientras otros insisten en que ahora es el momento para aclarar la cuestión y buscar el juicio del público.\nSi disolvemos la Cámara de Representantes y celebramos una elección general, pondremos la reforma en sí misma a prueba directa. Al mismo tiempo, el calendario político se desplazaría rápidamente hacia una elección y aumentaría la tensión política sería inevitable.\n\n¿Deberíamos seguir adelante con una disolución y una elección general?"
 Japan.101.a: "Disolver la Cámara de Representantes."
 Japan.101.b: "No te disuelvas."
 Japan.103.t: "Levántate de las Fuerzas de la Izquierda"
 Japan.103.d: "En medio del estancamiento económico, la inseguridad en el empleo y la creciente preocupación por la seguridad social, el interés aumenta rápidamente en las fuerzas de izquierda que exigen una mayor redistribución y apoyo a los medios de subsistencia. Como receptáculo para la insatisfacción con la política establecida, el apoyo se está extendiendo en varias regiones, y las encuestas de opinión también han comenzado a mostrar un crecimiento notable para los partidos de izquierda. En la situación política por delante, es probable que la presencia de la izquierda sea imposible de ignorar."
 Japan.103.a: "Un viento de cola para fuerzas liberales"
 Japan.103.b: "Crecimiento de las fuerzas socialdemócratas"
 Japan.103.c: "Ampliación de la presencia de las fuerzas comunistas"
 Japan.103.e: "Rápido aumento de las fuerzas populistas de izquierda"
 Japan.104.t: "Levantamiento de las fuerzas derechistas"
 Japan.104.d: "En medio de una creciente ansiedad sobre el entorno de seguridad y una creciente desconfianza en la política, el apoyo se está propagando para las fuerzas de derecha que piden mantener el orden, la autosuficiencia nacional y un énfasis en los valores tradicionales. Estas posiciones están suscitando el interés de una amplia gama de votantes, y las encuestas de opinión también han comenzado a mostrar un crecimiento notable para los partidos de derecha. En la situación política que se avecina, la presencia del derecho puede aumentar aún más."
 Japan.104.a: "Apoyo ampliado a las fuerzas conservadoras"
 Japan.104.b: "Crecimiento de las fuerzas socialdemócratas"
 Japan.104.c: "Levantamiento de las fuerzas de reforma-conservadoras"
 Japan.104.e: "Apoyo ampliado a las fuerzas alineadas con la Restauración"
 JAP_diplomacy.01.t: "Iniciando negociaciones sobre Estados Unidos. Retiro de tropas de Okinawa"
 JAP_diplomacy.01.d: "Durante décadas, la presencia de fuerzas estadounidenses en Japón ha sido una piedra angular del marco de seguridad de la posguerra nacional y la estabilidad regional. Sin embargo, a la luz de las cambiantes condiciones geopolíticas, los cambios en la opinión pública y el creciente interés de Japón por mejorar sus propias capacidades de defensa, el gobierno ha determinado que debe reexaminar la presencia militar estadounidense en Okinawa. Como primer paso, ahora comenzarán las negociaciones oficiales con los Estados Unidos."
 JAP_diplomacy.01.a: "Iniciar negociaciones diplomáticas"
 JAP_diplomacy.02.t: "Japanese Solicitud de Negociaciones Retiradas de Tropas"
 JAP_diplomacy.02.d: "El gobierno japonés ha presentado una solicitud formal para iniciar negociaciones sobre la retirada de las fuerzas estadounidenses estacionadas en Okinawa. La propuesta no es antagónica en la naturaleza, sino más bien enmarcada como parte de una reevaluación más amplia de la postura de defensa de Japón y las necesidades de seguridad cambiantes. Los Estados Unidos deben considerar ahora cómo responder, equilibrando la integridad de la alianza con intereses estratégicos a largo plazo en la región."
 JAP_diplomacy.02.a: "Aceptar la solicitud"
 JAP_diplomacy.02.b: "Rechazar la solicitud"
 JAP_diplomacy.03.t: "Acuerdo Alcanzado: Estados Unidos Fuerzas para retirarse"
 JAP_diplomacy.03.d: "Tras una serie de discusiones diplomáticas, Japón y Estados Unidos han llegado a un acuerdo sobre la retirada de las fuerzas estadounidenses de Okinawa. Esto marca un momento crucial en la política de defensa cambiante de Japón y subraya su deseo de asumir una mayor responsabilidad por su propia seguridad. Si bien esto marca el fin de un marco existente, también ofrece una oportunidad para reevaluar la relación entre Estados Unidos y Japón y explorar nuevas formas de cooperación en materia de seguridad para el futuro."
 JAP_diplomacy.03.a: "Un nuevo capítulo en la política de seguridad comienza"
 JAP_diplomacy.04.t: "Negociaciones fallidas: Retirada denegada"
 JAP_diplomacy.04.d: "El gobierno de Estados Unidos ha rechazado la petición de Japón de retirar tropas de Okinawa. En consecuencia, el acuerdo de seguridad existente seguirá vigente. Este resultado puede provocar reacciones mixtas dentro de Japón, potencialmente alimentando el debate sobre la autonomía del país en materia de defensa. El Gobierno japonés debe ahora reevaluar su enfoque y seguir vigilando el panorama regional y nacional más amplio."
 JAP_diplomacy.04.a: "Tiempo para considerar nuestro próximo movimiento"
 JAP_diplomacy.05.t: "Hacia una memoria compartida para el futuro"
 JAP_diplomacy.05.d: "El gobierno japonés ha decidido proponer el establecimiento de una plataforma intelectual trilateral bajo la mediación de las Naciones Unidas, cuyo objetivo es compartir los recuerdos y lecciones de guerras pasadas y transmitir una cultura de paz a generaciones futuras. El proyecto incluirá museos y archivos digitales, con todos los costos cubiertos por Japón. La propuesta se entregará oficialmente a China y Corea del Sur por conductos diplomáticos."
 JAP_diplomacy.05.a: "Enviar la propuesta"
 JAP_diplomacy.06.t: "Propuesta de Japón: Compartir memoria y futuro"
 JAP_diplomacy.06.d: "El gobierno japonés ha propuesto, bajo mediación de la ONU, el establecimiento de una plataforma intelectual trilateral con China y Corea del Sur para preservar los recuerdos y lecciones de guerra para las generaciones futuras. La iniciativa incluye la construcción de museos y archivos digitales, con todos los costos cubiertos por el Japón. ¿Escogeremos una cooperación orientada hacia el futuro, o seguiremos viviendo en desconfianza? Nuestra decisión dará forma al futuro de la memoria en Asia oriental."
 JAP_diplomacy.06.a: "Aceptar la propuesta"
 JAP_diplomacy.06.b: "Rechazar la propuesta"
 JAP_diplomacy.08.t: "Plataforma intelectual trilateral lanzada"
 JAP_diplomacy.08.d: "Tanto China como Corea del Sur han aceptado la propuesta. En el marco de la mediación de las Naciones Unidas, se ha puesto en marcha oficialmente la plataforma intelectual trilateral. A través de museos y archivos conjuntos, la memoria y las lecciones de guerra se transmitirán ahora a las generaciones futuras. Esto puede marcar un primer paso significativo hacia la reconciliación y el entendimiento mutuo."
 JAP_diplomacy.08.a: "Un nuevo paso hacia el futuro"
 JAP_diplomacy.09.t: "La propuesta fue rechazada"
 JAP_diplomacy.09.d: "Desafortunadamente, nuestra plataforma intelectual prevista ha sido rechazada. Es evidente que la reconciliación requiere más tiempo y esfuerzos continuos para fomentar la confianza."
 JAP_diplomacy.09.a: "Debemos esperar otra oportunidad."
 JAP_news.01.t: "Declaración de [JAP.GetLeader]: Reconociendo la historia"
 JAP_news.01.d: "Hoy, el gobierno japonés emitió una declaración oficial del Primer Ministro [JAP.GetLeader], expresando profunda remordimiento y sincera disculpa por las pasadas acciones coloniales de Japón y tiempos de guerra. En la declaración se hizo hincapié en el compromiso sincero de establecer relaciones diplomáticas orientadas hacia el futuro y preservar responsablemente la memoria de la historia.El discurso ha suscitado una atención significativa tanto a nivel nacional como internacional, y se espera que influya en la diplomacia futura en Asia oriental."
 JAP_news.01.a: "Nuestra responsabilidad por el futuro."
 JAP_news.01.b: "Seguiremos de cerca los acontecimientos futuros."
 JAP_diplomacy.34.t: "Propuesta para ampliar los arreglos de intercambio de divisas"
 JAP_diplomacy.34.a: "Aceptar"
 JAP_diplomacy.34.b: "Declin por ahora"
 JAP_diplomacy_34_TT: "§YCada país de la ASEAN que acepte recibirá un modificador de estabilidad y ganará una opinión favorable §G§! de nosotros.§!"
 JAP_diplomacy.35.t: "Acuerdo sobre Arreglo Ampliado de Cierre"
 JAP_diplomacy.35.d: "[FROM.GetName] ha acordado la propuesta de Japón de ampliar el acuerdo de cambio de divisas. Esto refuerza aún más la «red de seguridad» del apoyo a la liquidez en tiempos de crisis, aumentando la confianza en el mercado y la eficacia de la cooperación regional. Este acuerdo es también un paso claro hacia el fomento de la confianza en Japón dentro de la ASEAN."
 JAP_diplomacy.35.a: "Bien."
 JAP_diplomacy.36.t: "Propuesta denegada"
 JAP_diplomacy.36.d: "[FROM.GetName] ha indicado que rechazará la propuesta de Japón de ampliar el acuerdo de cambio de divisas. Esto refleja la preferencia de priorizar la aclaración de los términos y procedimientos operativos del acuerdo, y no es una crítica a la propuesta misma. Japón debe permanecer consciente de las circunstancias del otro país, manteniendo abiertos los canales para el diálogo."
 JAP_diplomacy.36.a: "Understood."
 JAP_diplomacy.37.t: "Propuesta de inversión básica en infraestructura"
 JAP_diplomacy.37.d: "Para impulsar la conectividad regional y el crecimiento económico, el Gobierno japonés ha propuesto una inversión de AOD a gran escala en nuestro país centrada en infraestructuras básicas como redes de transporte, puertos y energía. Las mejoras en las carreteras, puertos y redes de energía fortalecerán los cimientos de la logística e industria, apoyando directamente el crecimiento de nuestro país. Aceptar la propuesta también aumentaría la influencia de Japón en la ASEAN.\n\n¿Deberíamos aceptar esta propuesta y acelerar el desarrollo de la infraestructura?"
 JAP_diplomacy.37.a: "Aceptar"
 JAP_diplomacy.37.b: "Rechazo"
 JAP_diplomacy_37_TT: "§YCada país de la ASEAN que acepte recibirá un modificador de velocidad de construcción de infraestructura. Contribuiremos §R$3.5 milliardes§! y ganaremos §G2.5% influencia§! en cada país aceptado.§!"
 JAP_diplomacy.38.t: "Propuesta de inversión aceptada"
 JAP_diplomacy.38.d: "[FROM.GetName] ha aceptado la propuesta de Japón para la inversión en AOD en infraestructura básica. Aumentar las mejoras en las redes de transporte, los puertos y la infraestructura de energía impulsará la conectividad regional y el crecimiento económico, haciendo que nuestra participación sea más firmemente establecida. Este acuerdo fortalecerá aún más la influencia de Japón dentro de la ASEAN."
 JAP_diplomacy.38.a: "Bien."
 JAP_diplomacy.39.t: "Propuesta denegada"
 JAP_diplomacy.39.d: "[FROM.GetName] ha indicado que va a rechazar la propuesta de Japón para la inversión en AOD en infraestructura básica. El otro país parece estar priorizando sus planes nacionales y los preparativos institucionales, pero esto no significa que esté rechazando la propuesta misma. Japón debe permanecer consciente de las circunstancias del otro país y dejar espacio para la cooperación futura."
 JAP_diplomacy.39.a: "Understood."
 JAP_diplomacy.40.t: "Propuesta de cooperación en materia de capital humano e investigación"
 JAP_diplomacy.40.a: "Aceptar"
 JAP_diplomacy.40.b: "Rechazo"
 JAP_diplomacy_40_TT: "§YCada país de la ASEAN que acepte recibirá modificadores de velocidad de investigación y crecimiento de productividad. Ganaremos §G2.5% de influencia§! en cada país receptor.§!"
 JAP_diplomacy.41.t: "Propuesta de cooperación aceptada"
 JAP_diplomacy.41.a: "Bien."
 JAP_diplomacy.42.t: "Propuesta denegada"
 JAP_diplomacy.42.a: "Understood."
 JAP_diplomacy.43.t: "Solicitud de adhesión al Marco de Seguridad Marítima de Japón"
 JAP_diplomacy.43.d: "El Gobierno japonés ha presentado un plan para poner en marcha un marco de seguridad marítima neutral y pacífico destinado a aliviar las tensiones en el Mar del Sur de China y proteger la libertad de navegación, y se ha acercado a nuestro país para unirse a él. La cooperación como el intercambio de información, la búsqueda y el rescate marítimos, las actividades de lucha contra la piratería y los ejercicios conjuntos contribuiría a la estabilidad regional y mejoraría la capacidad de gestión de crisis. Aceptar la propuesta también aumentaría la influencia de Japón en la ASEAN.\n\n¿Deberíamos aceptar esta propuesta y cooperar dentro del marco de Japón?"
 JAP_diplomacy.43.a: "Aceptar"
 JAP_diplomacy.43.b: "Rechazo"
 JAP_diplomacy_43_TT: "§YCada país de la ASEAN que acepte recibirá un modificador de estabilidad. Ganaremos §G2.5% de influencia§! y una opinión favorable de cada país que acepta.§!"
 JAP_diplomacy.44.t: "Acuerdo para Unirse al Marco"
 JAP_diplomacy.44.d: "[FROM.GetName] ha acordado unirse al marco de seguridad marítima neutral y pacífico propuesto por Japón. Como la cooperación, como el intercambio de información, la búsqueda y el rescate marítimos, los esfuerzos contra la piratería y los ejercicios conjuntos avanzan, podemos esperar progresos tangibles en la estabilidad regional y la protección de la libertad de navegación. Este acuerdo fortalecerá la confianza e influencia de Japón dentro de la ASEAN."
 JAP_diplomacy.44.a: "Bien."
 JAP_diplomacy.45.t: "Propuesta de participación"
 JAP_diplomacy.45.d: "[FROM.GetName] ha indicado que disminuirá la adhesión al marco de seguridad marítima neutral y pacífico propuesto por Japón. El otro país parece estar priorizando las consideraciones de la situación regional y las prioridades nacionales, pero esto no significa que esté rechazando los principios de cooperación mismos. El Japón debe mantener una postura que no inflame las tensiones mientras deja espacio para el diálogo y la cooperación."
 JAP_diplomacy.45.a: "Understood."
 JAP_diplomacy.46.t: "Lanzamiento del Japón EE.UU. Programa Conjunto de Educación"
 JAP_diplomacy.46.d: "El gobierno japonés ha propuesto ampliar los programas de educación conjunta e intercambios estudiantiles para profundizar el entendimiento mutuo y fomentar la próxima generación. Al crear un marco en el que ambos países puedan aprender de las fortalezas del otro, la disciplina japonesa y el espíritu emprendedor de los Estados Unidos, el objetivo es cultivar una nueva generación de líderes con perspectiva internacional. Esta iniciativa aumentará los lazos entre las personas y fortalecerá aún más la confianza dentro de la alianza."
 JAP_diplomacy.46.a: "Una inversión en el futuro."
 JAP_diplomacy.47.t: "Japón U.S. Intercambio de tecnología y cultura"
 JAP_diplomacy.47.d: "El gobierno japonés ha presentado un plan para ampliar el intercambio tecnológico y cultural vinculando laboratorios universitarios japoneses, estudios y redes corporativas con socios en Silicon Valley, Seattle y Los Ángeles. Ingenieros, diseñadores y creadores viajarían de ida y vuelta para proyectos conjuntos, con el objetivo de combinar conocimientos especializados en operaciones de plataforma con las fortalezas de Japón en hardware, juegos y animación. Si la afinidad cultural y la cooperación científica avanzan en tándem, reforzarán tanto la estabilidad social como el impulso para la innovación."
 JAP_diplomacy.47.a: "Vamos a maximizar la sinergia."
 JAP_diplomacy.48.t: "Japón U.S. Cooperación en investigación de doble uso"
 JAP_diplomacy.48.d: "El Gobierno japonés ha presentado una propuesta para fortalecer aún más la cooperación de los Estados Unidos en materia de tecnología de doble uso que puede aplicarse tanto a fines civiles como militares. Centrado en la colaboración entre la industria y el mundo académico, el plan tiene como objetivo promover la investigación conjunta, compartir conocimientos especializados y promover intercambios de personal, acelerar la R&D y impulsar el desarrollo tecnológico general. Si esta asociación tiene raíces, se espera que aumente la competitividad futura tanto en los sectores civil como militar."
 JAP_diplomacy.48.a: "Hagamos avanzar la investigación conjunta."
 JAP_diplomacy.49.t: "Plataforma de Conocimiento sobre Preparación para Desastres de Taiwán"
 JAP_diplomacy.49.a: "Mejoremos nuestra resiliencia."
 JAP_diplomacy.50.t: "El fortalecimiento de la Asociación de Tecnología Avanzada del Japón"
 JAP_diplomacy.50.a: "Aceleremos la investigación conjunta."
 JAP_diplomacy.51.t: "Ampliación de los lugares de estudio en el Japón"
 JAP_diplomacy.51.d: "El Gobierno japonés ha propuesto ampliar las cuotas de becas y los cupos de admisión para aumentar las oportunidades de que los estudiantes taiwaneses estudien en universidades japonesas. Esta iniciativa tiene como objetivo no sólo profundizar los vínculos académicos y culturales, sino también cultivar el futuro talento que pueda conectar nuestras dos sociedades. A medida que los intercambios se amplíen, las bases para la próxima generación para llevar adelante las relaciones de Japón Taiwán serán aún más fuertes."
 JAP_diplomacy.51.a: "Una inversión en la próxima generación."
 JAP_diplomacy.52.t: "Propuesta de apoyo a la reforma del sistema comercial"
 JAP_diplomacy.52.d: "El gobierno japonés ha propuesto cooperación técnica e institucional para apoyar la reforma y modernización del sistema comercial de China. Al simplificar los procedimientos aduaneros, digitalizar las operaciones administrativas y elaborar normas acordes con las normas internacionales, el objetivo es facilitar el comercio y mejorar la previsibilidad de las actividades empresariales. Si estas reformas avanzan, se reducirá la carga procesal de las importaciones y exportaciones, reduciendo la fricción en la actividad económica. Aceptar esta propuesta también aumentaría la influencia de Japón dentro de China.\n\n¿Deberíamos aceptar el apoyo de Japón y avanzar en la armonización internacional de nuestro sistema comercial?"
 JAP_diplomacy.52.a: "Aceptar"
 JAP_diplomacy.52.b: "Rechazo"
 JAP_diplomacy_52_TT: "§YSi la oferta es aceptada, China recibirá un modificador de la carga tributaria reducida y ganaremos §Ginfluencia§! dentro de China§!."
 JAP_diplomacy.53.t: "Propuesta de cooperación aceptada"
 JAP_diplomacy.53.d: "[FROM.GetName] ha aceptado la oferta de apoyo técnico e institucional del Japón para reformar y modernizar su sistema comercial. A medida que se racionalicen los procedimientos aduaneros y se mejoren las operaciones administrativas, aumentará la facilitación del comercio y la previsibilidad de las actividades empresariales, y el medio ambiente para que las empresas japonesas entren en el mercado también mejorará. Este acuerdo fortalecerá constantemente la influencia de Japón dentro de China."
 JAP_diplomacy.53.a: "Bien."
 JAP_diplomacy.54.t: "Propuesta denegada"
 JAP_diplomacy.54.d: "[FROM.GetName] ha indicado que rechazará la propuesta de Japón de proporcionar apoyo técnico e institucional para reformar y modernizar su sistema comercial. La otra parte parece estar priorizando sus prioridades de diseño de políticas y coordinación interna, pero esto no significa que esté rechazando la necesidad de reforma en sí misma. Japón debe permanecer consciente de las circunstancias del otro país y dejar espacio para el diálogo y la cooperación."
 JAP_diplomacy.54.a: "Understood."
 JAP_diplomacy.55.t: "Ampliación de la cooperación en materia de inversiones en China del Japón"
 JAP_diplomacy.55.d: "El Gobierno japonés ha manifestado su intención de avanzar con la coordinación institucional y un marco de cooperación para promover la inversión mutua y la entrada en el mercado entre las empresas japonesas y chinas. Si la entrada cruzada se acelera, las redes de producción pueden optimizarse y las cadenas de suministro son más eficientes, lo que se espera aumentar la productividad industrial general. La profundización de la interdependencia económica también conlleva riesgos, pero puede servir simultáneamente como un factor práctico de estabilización reduciendo la fricción."
 JAP_diplomacy.55.a: "Abramos el mercado y mejoremos la eficiencia."
 JAP_diplomacy.56.a: "Profundicemos la solidaridad cultural."
 JAP_diplomacy.57.t: "Japón China Proyecto conjunto de conservación del templo budista"
 JAP_diplomacy.57.d: "El Gobierno japonés ha propuesto implementar un proyecto conjunto de Japón China para preservar los templos budistas como patrimonio cultural compartido mediante la realización conjunta de esfuerzos de conservación y restauración. Al compartir técnicas de restauración y métodos de estudio y establecer un marco cooperativo para la protección de los bienes culturales, el objetivo es reafirmar el valor de los templos y los bienes culturales conexos y garantizar su preservación a largo plazo. Si los resultados de estos esfuerzos de conservación se vuelven visibles, el atractivo del turismo cultural aumentará y también se pueden esperar efectos positivos sobre las economías locales. Esta cooperación también puede servir de oportunidad para reafirmar los vínculos históricos entre nuestros dos países."
 JAP_diplomacy.57.a: "Protejamos nuestro patrimonio y promuevamos el turismo."
 JAP_diplomacy.58.t: "Acelerador Seúl de Tokio"
 JAP_diplomacy.58.d: "El Gobierno japonés ha presentado una propuesta para establecer un programa conjunto de aceleradores en Tokio y Seúl, institucionalizando el apoyo a la puesta en marcha en ambos países. Mediante la asistencia con actividades de recaudación de fondos, asesoramiento, cooperación con empresas y universidades, e intercambios de talento entre las dos ciudades, el objetivo es aumentar los índices de éxito inicial y fortalecer la cooperación tecnológica. Si este marco funciona según lo previsto, la innovación entre las ciudades se acelerará y la cooperación económica de Corea del Japón se fortalecerá de manera más práctica y orientada hacia los resultados."
 JAP_diplomacy.58.a: "Aceleremos el impulso de arranque."
 JAP_diplomacy.59.t: "Ampliación de la cooperación local de Corea del Japón"
 JAP_diplomacy.59.a: "Vamos a generar crecimiento de las regiones."
 JAP_diplomacy.60.t: "Propuesta para el intercambio cultural de Corea"
 JAP_diplomacy.60.d: "El Gobierno japonés ha presentado una propuesta para ampliar sistemáticamente el intercambio cultural entre Japón y Corea del Sur. A través de medios, artes, deportes, turismo e intercambios educativos, el objetivo es profundizar la comprensión mutua entre nuestros pueblos y reducir la distancia social. Si los intercambios se expanden, también influirán en el sentimiento público y las actitudes externas, y ambos países ganarán un entorno en el que puedan hablar más eficazmente dentro de la esfera interna del otro.\n\n¿Deberíamos aceptar esta propuesta y promover el intercambio cultural?"
 JAP_diplomacy.60.a: "Aceptar"
 JAP_diplomacy.60.b: "Rechazo"
 JAP_diplomacy_60_TT: "§YSi la oferta es aceptada, ganaremos §Ginfluencia§! en Corea, pero Corea también ganará §R influencia§! en Japón.§!"
 JAP_diplomacy_60_TT2: "§YEl intercambio cultural nos permitiría influir en Japón, pero la influencia de Japón también aumentaría.§!"
 JAP_diplomacy.61.t: "Propuesta aceptada"
 JAP_diplomacy.61.d: "[FROM.GetName] ha acordado la propuesta de Japón de ampliar el intercambio cultural. A medida que se amplíen los intercambios en medios, artes, deportes, turismo y educación, la comprensión mutua profundizará y cambiará el sentimiento público en ambos países. A través de este acuerdo, Japón ganará una voz más fuerte dentro de Corea, mientras que Corea también fortalecerá su influencia dentro del Japón."
 JAP_diplomacy.61.a: "Bien."
 JAP_diplomacy.62.t: "Propuesta denegada"
 JAP_diplomacy.62.d: "[FROM.GetName] ha indicado que rechazará la propuesta de Japón de ampliar el intercambio cultural. El otro país parece estar priorizando el examen de la opinión pública y las circunstancias internas, pero esto no significa que esté rechazando el propio intercambio cultural. El Japón debe mantener abiertos los canales de diálogo al tiempo que deja espacio para avanzar en la comprensión mutua de otras maneras."
 JAP_diplomacy.62.a: "Understood."
 JAP_diplomacy.63.t: "Equipo de Tareas de la Sociedad del Envejecimiento de Corea"
 JAP_diplomacy.63.d: "El Gobierno japonés ha propuesto establecer un grupo de trabajo conjunto de expertos e instituciones pertinentes del Japón y Corea del Sur para abordar el desafío común de una sociedad envejecida, con consultas mensuales para formular políticas cooperativas. Mediante el intercambio de conocimientos especializados sobre el fortalecimiento de los sistemas de atención de ancianos y atención de la salud, el apoyo al empleo y el diseño del bienestar comunitario, el objetivo es aumentar la velocidad y eficacia de las respuestas normativas. Si este marco tiene raíces, promoverá el fortalecimiento de las medidas de bienestar social y contribuirá a la estabilidad social a largo plazo."
 JAP_diplomacy.63.a: "Sigamos adelante con los preparativos juntos."
 JAP_diplomacy_63_TT: "§Y Corea del Sur ganará un modificador de crecimiento demográfico.§!"
 JAP_diplomacy.64.t: "Cooperación para el desarrollo de la región fría"
 JAP_diplomacy.64.d: "El gobierno japonés ha propuesto la «Iniciativa Francesa del Este» para apoyar el desarrollo de la región fría en el Lejano Oriente Ruso aprovechando la experiencia de Hokkaido en revitalizar las regiones climáticas frías, a través de la inversión en infraestructura y la introducción del capital extranjero. Al promover mejoras fundamentales en el transporte, la logística y la energía, el objetivo es estimular la actividad económica regional y aumentar la eficacia del desarrollo. La iniciativa se centra en el desarrollo de la infraestructura en Sakha y Kamchatka."
 JAP_diplomacy.64.a: "Fortalezcamos los cimientos del Lejano Oriente."
 JAP_diplomacy.65.t: "Sakhalin II"
 JAP_diplomacy.65.d: "El Gobierno japonés ha manifestado su intención de fortalecer la inversión extranjera en el proyecto energético Sakhalin II mientras coopera con Rusia, a fin de asegurar un acceso estable a los combustibles fósiles. Si la inversión de capital y la estabilización de las operaciones avanzan, mejorará la continuidad del desarrollo y se podrá esperar una ampliación de la capacidad de producción. Sakhalin seguirá siendo un importante centro de suministro y es probable que tenga efectos positivos para la economía regional también."
 JAP_diplomacy.65.a: "Ampliamos la capacidad de producción."
 JAP_diplomacy.66.t: "Lanzamiento de la cooperación de la red de transporte eurasiática"
 JAP_diplomacy.66.d: "El gobierno japonés ha indicado su intención de promover la cooperación con Japón Rusia para desarrollar un corredor logístico terrestre que vincule Japón y Europa a través de Rusia. Al aprovechar las redes ferroviarias y las principales carreteras, el objetivo es acortar los tiempos de transporte y establecer un acceso estable a los mercados europeos, al mismo tiempo que se aceleran las mejoras de infraestructura a lo largo del pasillo. Si el flete comienza a fluir en la práctica, Rusia aumentará aún más su importancia como centro eurasiático, y la conectividad económica también se profundizará."
 JAP_diplomacy.66.a: "Aceleremos el desarrollo del corredor."
 JAP_diplomacy.67.t: "Lanzamiento de Japón Rusia Cooperación en Infraestructura de TI"
 JAP_diplomacy.67.d: "El gobierno japonés ha presentado la iniciativa «Rusia Digital Corridor», trabajando con empresas japonesas de TI para desarrollar infraestructura en Rusia, como centros de datos y redes de fibra óptica. El objetivo es mejorar la infraestructura de comunicaciones nacionales y fortalecer el papel de Rusia como centro en una red de comercio digital que une Europa, Asia Central y Rusia. Si esta cooperación se lleva a cabo, la estabilidad de los flujos de información y la capacidad de red mejorará, y la digitalización de la actividad económica también acelerará."
 JAP_diplomacy.67.a: "Ampliamos nuestra infraestructura de conectividad."
 JAP_historical.20110311.t: "El Gran Terremoto de Japón Oriental"
 JAP_historical.20110311.d: "A las 2:46 PM el 11 de marzo de 2011, un terremoto de magnitud masiva de 9.0 azotó la costa del Pacífico de la región de Tohoku. El temblor más fuerte que se registró en Japón estremeció violentamente amplias zonas de Tohoku a Kanto, y el impresionante tsunami que siguió a pueblos y aldeas ribereños engullidos, dejando la devastación catastrófica a su paso. Los puertos y las comunidades pesqueras fueron borrados en momentos, mientras que las carreteras, los ferrocarriles y los aeropuertos fueron cortados, lanzando funciones urbanas al caos.\n\nCientos de miles de personas han perdido sus hogares y han buscado refugio en refugios de emergencia. El peaje económico es asombrosa, ya que la agricultura, la pesca y la manufactura, la columna vertebral de la economía regional, han sufrido daños graves. Las tareas simultáneas de restaurar la infraestructura, ayudar a los desplazados y reconstruir industrias y ciudades impulsarán la capacidad administrativa del gobierno a sus límites absolutos.\n\nEn medio de esta tragedia sin precedentes, el pueblo japonés ha mostrado resiliencia y solidaridad. Sin embargo, lo rápido y efectivo que puede responder el gobierno determinará la estabilidad y el futuro de la nación."
 JAP_historical.20110311.a: "Debemos comprometer todos los esfuerzos para rescatar y recuperar."
 JAP_great_east_japan_earthquake_tree_tt: "§Y¡El árbol de enfoque nacional para la reconstrucción después de que el terremoto del Gran Japón Oriental haya sido desbloqueado!§!"
 JAP_news.02.t: "Sin precedentes terremotos Japón"
 JAP_news.02.d: "El 11 de marzo de 2011, Japón fue golpeado por un terremoto masivo. Más tarde conocido como el Gran Terremoto de Japón Oriental, este terremoto de magnitud 9.0 frente a la costa del Pacífico de Tohoku causó destrucción catastrófica en una zona amplia, dejando decenas de miles muertos o desaparecidos e infligiendo pérdidas económicas incalculables.\n\nEl tsunami subsiguiente desbordó las ciudades costeras, los puertos y las redes de transporte en momentos, obligando a cientos de miles a entrar en refugios de evacuación. La sociedad japonesa enfrenta ahora su mayor crisis desde la era de la posguerra.\n\nEl Gran Terremoto de Japón Oriental se ha convertido en un momento decisivo, ya que el mundo observa cómo una de las principales economías del planeta logrará su recuperación."
 JAP_news.02.a: "A terrifying tragedy..."
 Japan.201103111.t: "Declaración de la terminación de la recuperación"
 Japan.201103111.d: "Han pasado años desde el gran desastre, los escombros han sido despejados, y las ciudades se llenan una vez más con la vitalidad de su pueblo. Las vidas de las víctimas se han estabilizado gradualmente, y se han restablecido industrias e infraestructura. Hoy, el gobierno declara oficialmente «Recovery Achieved», cerrando el capítulo sobre una larga era de penurias.\n\nAunque esta tragedia dejó cicatrices profundas, también fomentó la resiliencia y el orgullo, sentando las bases para un futuro más brillante."
 Japan.201103111.a: "¡Hemos superado la adversidad!"
 Japan.201103112.t: "Progresos en la restauración de infraestructura"
 Japan.201103112.d: "Algunas de las infraestructuras destruidas por el desastre han sido restauradas. El transporte y la logística están resumiendo gradualmente, llevando pequeños pero significativos cambios a la vida cotidiana. Si bien la recuperación completa permanece distante, este es un avance claro."
 Japan.201103112.a: "Un paso adelante."
 Japan.201103113.t: "Restauración completa de la infraestructura"
 Japan.201103113.d: "La infraestructura de Tohoku, devastada por el terremoto, ha alcanzado finalmente su nivel objetivo de restauración. Las redes de transporte y las funciones logísticas están ahora plenamente operativas, dando nuevo impulso a la sociedad local y a la economía. El esfuerzo de reconstrucción ha alcanzado un hito importante."
 Japan.201103113.a: "Un hito importante."
 Japan.201103114.t: "Progresos en la restauración de infraestructura"
 Japan.201103114.d: "Algunas de las infraestructuras destruidas por el desastre han sido restauradas. El transporte y la logística están resumiendo gradualmente, llevando pequeños pero significativos cambios a la vida cotidiana. Si bien la recuperación completa permanece distante, este es un avance claro."
 Japan.201103114.a: "Un paso adelante."
 Japan.201103115.t: "Restauración completa de la infraestructura"
 Japan.201103115.d: "La infraestructura de Kanto, devastada por el terremoto, ha alcanzado finalmente su nivel objetivo de restauración. Las redes de transporte y las funciones logísticas están ahora plenamente operativas, dando nuevo impulso a la sociedad local y a la economía. El esfuerzo de reconstrucción ha alcanzado un hito importante."
 Japan.201103115.a: "Un hito importante."
 Japan.201103116.t: "Telecomunicaciones Restablecidas"
 Japan.201103116.d: "La red de telecomunicaciones en la región afectada por desastres ha sido finalmente restaurada parcialmente. La comunicación para la vida cotidiana y el negocio ha mejorado, con lo que se ha renovado la esperanza a la economía local y a la sociedad."
 Japan.201103116.a: "Presione con más restauración"
 Japan.201103117.t: "Telecomunicaciones Restaurada"
 Japan.201103117.d: "La infraestructura de telecomunicaciones en el Tohoku, devastada por el terremoto, ha alcanzado finalmente su nivel específico de restauración. Con la base para la vida cotidiana y la industria asegurada, el camino de recuperación ha alcanzado un hito importante."
 Japan.201103117.a: "Marcar esto como un paso adelante en la recuperación"
 Japan.201103118.t: "Telecomunicaciones Restaurada"
 Japan.201103118.d: "La infraestructura de telecomunicaciones en el Kanto, devastada por el terremoto, ha alcanzado finalmente su nivel específico de restauración. Con la base para la vida cotidiana y la industria asegurada, el camino de recuperación ha alcanzado un hito importante."
 Japan.201103118.a: "Marcar esto como un paso adelante en la recuperación"
 Japan.201103119.t: "Resumo de la industria local"
 Japan.201103119.d: "Los factores y las empresas de la región afectada por el desastre han reanudado sus operaciones. Aunque la recuperación total todavía está lejos, el regreso de los empleos y la actividad económica ofrece un sentido tangible del progreso."
 Japan.201103119.a: "Empuje hacia delante con mayor recuperación industrial"
 Japan.2011031110.t: "Base Industrial Totalmente Restaurada"
 Japan.2011031110.d: "La base industrial de Tohoku, devastada por el terremoto, ha alcanzado finalmente su nivel objetivo de recuperación. Con el empleo y la capacidad de producción restablecidas, el camino de la reconstrucción ha alcanzado un hito importante."
 Japan.2011031110.a: "Avance a la siguiente etapa de recuperación"
 Japan.2011031111.t: "Resumo de la industria local"
 Japan.2011031111.d: "Los factores y las empresas de la región afectada por el desastre han reanudado sus operaciones. Aunque la recuperación total todavía está lejos, el regreso de los empleos y la actividad económica ofrece un sentido tangible del progreso."
 Japan.2011031111.a: "Empuje hacia delante con mayor recuperación industrial"
 Japan.2011031112.t: "Base Industrial Totalmente Restaurada"
 Japan.2011031112.d: "La base industrial de Kanto, devastada por el terremoto, ha alcanzado finalmente su nivel objetivo de recuperación. Con el empleo y la capacidad de producción restablecidas, el camino de la reconstrucción ha alcanzado un hito importante."
 Japan.2011031112.a: "Avance a la siguiente etapa de recuperación"
 Japan.2011031150.t: "Fukushima Daiichi accidente de planta nuclear"
 Japan.2011031150.d: "Japón ha sido golpeado por un terremoto y tsunami sin precedentes, y mientras la nación se está moviendo para responder, otro peor informe ha llegado. Un tsunami ha golpeado la central nuclear Fukushima Daiichi en Fukushima, causando fallas de los generadores de emergencia, baterías y tanques de combustible y sumergiendo el sitio en una pérdida total de energía.\nAdemás, se han generado y acumulado grandes cantidades de hidrógeno dentro de los edificios del reactor, lo que ha llevado a explosiones de hidrógeno en las unidades 1, 3 y 4. Con fugas radiactivas de puntos dañados ahora temidos, el público ha caído en pánico."
 Japan.2011031150.a: "¡Debemos actuar inmediatamente!"
 JAP_news.03.t: "Fukushima Daiichi accidente de planta nuclear"
 JAP_news.03.d: "Se ha reportado un grave accidente en la central nuclear Fukushima Daiichi de Japón tras el terremoto y el tsunami. Aunque los reactores se apagaron después del terremoto, el tsunami supuestamente discapacitaba generadores de emergencia y otros equipos críticos, lo que dio lugar a una pérdida total de energía. Con el enfriamiento ya no sostenible, los derretimientos centrales se produjeron en múltiples unidades.\nLa generación y acumulación de hidrógeno también desencadenaron explosiones en los edificios del reactor, y se considera muy probable que los materiales radiactivos fueran liberados en el medio ambiente a través de puntos dañados. El gobierno japonés se está moviendo para responder."
 JAP_news.03.a: "Qué situación..."
 Japan.2011031151.t: "La política nuclear de Japón en una encrucijada"
 Japan.2011031151.d: "Ha pasado un mes desde el accidente nuclear, y ahora el gobierno japonés se ve obligado a tomar una decisión. El accidente de Fukushima Daiichi ha sacudido la sensación del público de seguridad nuclear a su núcleo. La opinión pública está dividida, la comunidad empresarial teme el impacto en el suministro de energía y los ciudadanos están ansiosos por la posibilidad de fuga radiactiva.\n\nEl Japón debe aclarar ahora si seguirá dependiendo de la energía nuclear, o elegir un camino diferente."
 Japan.2011031151.a: "¡Bájalo, cállate!"
 Japan.2011031151.b: "Debemos introducir inspecciones estrictas."
 Japan.2011031151.c: "¡Continúe como antes!"
 JAP_territorial.01.t: "Iniciación de las negociaciones de los territorios septentrionales"
 JAP_territorial.01.d: "La controversia territorial sobre los Territorios del Norte ha sido durante mucho tiempo una cuestión pendiente entre [JAP.GetName] y [SOV.GetName] desde el fin de la guerra. Ahora, nuestra nación está en el punto donde solicitaremos formalmente negociaciones con [SOV.GetName] para resolver este asunto pacíficamente. Esto no es simplemente una formalidad diplomática, sino un paso crucial para afirmar nuestra soberanía y legitimidad histórica."
 JAP_territorial.01.oA: "¡Empecemos!"
 JAP_territorial.02.t: "[JAP.GetName] Pide Negociaciones de Territorios del Norte"
 JAP_territorial.02.d: "El gobierno [JAP.GetAdjective] ha enviado una solicitud oficial para abrir negociaciones sobre los Territorios del Norte. Esta cuestión se ha estancado durante décadas, y la decisión afectará tanto a nuestra posición internacional como a la política interna. ¿El compromiso significará una pérdida de interés nacional, o un aumento en la confianza internacional? Ha llegado el momento de una decisión."
 JAP_territorial.02.oA: "Cede el territorio a [JAP.GetName]"
 JAP_territorial.02.oB: "Rechazar la solicitud. No hay espacio para la negociación"
 JAP_territorial.03.t: "Acuerdo sobre el retorno de los territorios del norte"
 JAP_territorial.03.d: "Por último, se ha resuelto la cuestión de los territorios septentrionales de larga data. Después de las negociaciones con [SOV.GetName], se ha llegado a un acuerdo para el retorno de los territorios en disputa. Esto marca una victoria diplomática y un logro histórico en la historia de la posguerra [JAP.GetAdjective]."
 JAP_territorial.03.oA: "¡Un acuerdo histórico!"
 JAP_territorial.04.t: "Desglose de las negociaciones de los territorios septentrionales"
 JAP_territorial.04.d: "El gobierno [SOV.GetAdjective] ha rechazado oficialmente nuestra propuesta de negociaciones sobre el regreso de los Territorios del Norte. A pesar de nuestros esfuerzos diplomáticos, no se ha logrado una resolución. Ahora debemos centrarnos en fomentar una mayor confianza y ampliar nuestra influencia para preparar nuevas negociaciones en el futuro."
 JAP_territorial.04.oA: "Fue muy temprano esta vez..."
 JAP_territorial.05.t: "Iniciar negociaciones Senkaku con [CHI.GetName]"
 JAP_territorial.05.d: "[JAP.GetName] actualmente ejerce un control efectivo sobre las Islas Senkaku, pero [CHI.GetName] sigue afirmando su reivindicación a la soberanía. A la luz de los esfuerzos diplomáticos pasados, ha llegado el momento de que nuestra nación participe formalmente en negociaciones con el gobierno [CHI.GetAdjective] para lograr una resolución pacífica."
 JAP_territorial.05.oA: "¡Empecemos!"
 JAP_territorial.06.t: "[JAP.GetName] Propone negociaciones territoriales"
 JAP_territorial.06.d: "El gobierno [JAP.GetAdjective] ha pedido que retiremos nuestra reivindicación territorial sobre las Islas Senkaku. Están abogando por una solución pacífica y estabilidad regional, y están avanzando con las negociaciones respaldadas por la presión diplomática y el apoyo internacional. Aceptar esta propuesta es seguro generar apoyo y oposición, tanto a nivel nacional como en el extranjero."
 JAP_territorial.06.oA: "Retirar la reclamación y priorizar la estabilidad regional."
 JAP_territorial.06.oB: "Mantener la reivindicación y defender la soberanía nacional."
 JAP_territorial.07.t: "[CHI.GetName] ¡Retirada Senkaku Claim!"
 JAP_territorial.07.d: "[CHI.GetName] ha retirado oficialmente su reclamo territorial sobre las Islas Senkaku. Las tensiones de larga data en el Mar de China Oriental se han reducido considerablemente, y esto está siendo aclamado tanto a nivel nacional como internacional como una gran victoria diplomática. Es un primer paso importante hacia la estabilidad regional y el fomento de la confianza."
 JAP_territorial.07.oA: "Un avance histórico."
 JAP_territorial.08.t: "[CHI.GetName] Mantiene su reclamación"
 JAP_territorial.08.d: "[CHI.GetName] ha declarado que mantendrá su reivindicación territorial sobre las Islas Senkaku. Las negociaciones terminaron sin éxito y pusieron de relieve la necesidad de seguir fomentando las relaciones y fortaleciendo la influencia internacional. Si bien el diálogo sigue siendo posible, la situación sigue siendo difícil."
 JAP_territorial.08.oA: "Tal vez fue demasiado pronto..."
 JAP_territorial.09.t: "Iniciar negociaciones Senkaku con [TAI.GetName]"
 JAP_territorial.09.d: "[TAI.GetName] desde hace mucho tiempo ha reivindicado la soberanía sobre las Islas Senkaku basándose en motivos históricos y geográficos, mientras que [JAP.GetName] mantiene su postura sobre la legitimidad de su control efectivo. En un esfuerzo por resolver pacíficamente esta cuestión de larga data, haremos una propuesta diplomática formal a [TAI.GetName]."
 JAP_territorial.09.oA: "¡Empecemos!"
 JAP_territorial.10.t: "[JAP.GetName] Propone negociaciones territoriales"
 JAP_territorial.10.d: "El gobierno [JAP.GetAdjective] ha pedido que abandonemos nuestra reclamación a las Islas Senkaku. Teniendo en cuenta la complejidad de las relaciones entre los distintos sectores y el contexto internacional más amplio, será necesario deliberar detenidamente al decidir si aceptar esta solicitud."
 JAP_territorial.10.oA: "Retirar la reclamación por estabilidad regional."
 JAP_territorial.10.oB: "Debemos seguir afirmando nuestra soberanía."
 JAP_territorial.11.t: "[TAI.GetName] ¡Retirada Senkaku Claim!"
 JAP_territorial.11.d: "Las autoridades [TAI.GetAdjective] han retirado oficialmente su reclamación territorial a las Islas Senkaku. Con uno de los temas de larga data del Mar de China Oriental resueltos, las relaciones [JAP.GetName]-[TAI.GetName] se están moviendo en una nueva era de estabilidad, generando esperanzas para una cooperación más profunda en el futuro."
 JAP_territorial.11.oA: "Un acuerdo histórico."
 JAP_territorial.12.t: "[TAI.GetName] Rehabilitación para retirar la reclamación"
 JAP_territorial.12.d: "[TAI.GetName] ha declarado que mantendrá su reivindicación territorial a las Islas Senkaku. Las negociaciones terminaron en fracaso, dejando claro que la solución de la cuestión requerirá una mayor influencia diplomática y una mayor confianza mutua en el futuro."
 JAP_territorial.12.oA: "Tal vez todavía era demasiado pronto..."
 JAP_territorial.13.t: "Iniciar negociaciones de Takeshima con [KOR.GetName]"
 JAP_territorial.13.d: "Para poner fin a la larga disputa territorial sobre Takeshima entre [JAP.GetName] y [KOR.GetName], nuestro gobierno ha propuesto negociaciones pacíficas con [KOR.GetName]. En lugar de imponer nuestra reclamación unilateralmente, esta iniciativa tiene por objeto construir una relación futura entre ambas naciones."
 JAP_territorial.13.oA: "¡Empecemos!"
 JAP_territorial.14.t: "[JAP.GetName] Propone negociaciones sobre Dokdo"
 JAP_territorial.14.d: "El gobierno [JAP.GetAdjective] nos ha abordado para las negociaciones sobre la soberanía de Dokdo. Si bien esta es una decisión extremadamente difícil a la luz de la opinión pública interna y el contexto histórico, también es un juicio diplomático crucial que podría dar forma al futuro de las relaciones [JAP.GetName]-[KOR.GetName]."
 JAP_territorial.14.oA: "Dar prioridad a mejorar las relaciones con [JAP.GetName] y aceptar la transferencia."
 JAP_territorial.14.oB: "No podemos renunciar a nuestro territorio nacional."
 JAP_territorial.15.t: "[KOR.GetName] ¡Acuerda transferir Takeshima!"
 JAP_territorial.15.d: "Como parte de los esfuerzos por mejorar las relaciones [JAP.GetName]-[KOR.GetName], el gobierno [KOR.GetAdjective] ha acordado devolver Takeshima. Esto marca el fin de una confrontación de décadas de duración y se inicia en una nueva fase de confianza entre los dos países. Es un momento en que los esfuerzos diplomáticos pacíficos han dado frutos."
 JAP_territorial.15.oA: "Un logro histórico."
 JAP_territorial.16.t: "[KOR.GetName] Rechaza las negociaciones de Takeshima"
 JAP_territorial.16.d: "El gobierno [KOR.GetAdjective] ha rechazado nuestra petición de regresar a Takeshima. La resolución de la cuestión territorial sigue siendo difícil, y sin una mayor influencia diplomática y confianza mutua, será difícil poner fin a esta cuestión."
 JAP_territorial.16.oA: "Por ahora, debemos continuar el diálogo."
 JAP_renegotiation_territory: "¡La renegociación será posible en un año!"
 JAP_historical.20010426.t: "Yoshirō Mori Resigns, Junichiro Koizumi se convierte en Primer Ministro"
 JAP_historical.20010426.oA: "¡La reforma, ahora!"
 JAP_historical.20060926.t: "¿Continción o sucesión?"
 JAP_historical.20060926.oA: "Junichiro Koizumi"
 JAP_historical.20060926.oB: "Shinzo Abe"
 JAP_historical.20070926.t: "¿Continuidad o Renovación?"
 JAP_historical.20070926.oA: "Shinzo Abe"
 JAP_historical.20070926.oB: "Yasuo Fukuda"
 JAP_historical.20080924.t: "¿Una transición silenciosa o un botín?"
 JAP_historical.20080924.oA: "Yasuo Fukuda"
 JAP_historical.20080924.oB: "Tarō Asō"
 Japan.01.t: "Enfoque de las fuerzas tradicionales"
 Japan.01.d: "Mientras continúa la polémica sobre los comentarios del Primer Ministro Mori, varios grupos y comentaristas argumentan que el Hogar Imperial debe ser reevaluado como el centro del orden estatal de Japón han intensificado sus actividades. Se han acercado al gobierno, sugiriendo que si demuestra más claramente la voluntad de defender la tradición y el carácter nacional, podrían apoyarla mediante la formación de la opinión pública y el activismo popular.\n\nSin embargo, los vínculos más estrechos con esas fuerzas corren el riesgo de difuminar la línea entre el conservadurismo establecido y el monarquismo radical, lo que podría invitar a una nueva crítica de la administración. ¿Deberíamos hacer uso de esta oferta, o mantener nuestra distancia?"
 Japan.01.a: "Mantenga nuestra distancia."
 Japan.01.b: "Úsalos como palanca política."
 JAP_koizumi_appear_TT: "Mori puede disfrutar de su ronda de golf, pero su influencia política probablemente disminuirá significativamente. El partido pronto puede comenzar a buscar §Y un nuevo líder.§!"
 JAP_historical.20030926.t: "DPJ-LP Merger: El Partido Liberal se une al Partido Demócrata"
 JAP_historical.20030926.d: "Se están acelerando los movimientos para consolidar las fuerzas no desplazadas. Después de repetidas conversaciones, el Partido Demócrata y el Partido Liberal han acordado unificar el principal vehículo político del campo no-LDP en una sola organización.\n\nEl Partido Liberal se disolverá y fusionará en el Partido Demócrata como una fusión absorbida. Esto aumentará la presencia del campo no-LDP en la Dieta, pero también podría crear nuevos puntos flash como los partidos jockey sobre dirección política y liderazgo."
 JAP_historical.20030926.a: "Ahora se está llevando a cabo la reasignación no-LDP."
 JAP_historical.20070307.t: "Los Mysterious Utility Gastos"
 JAP_historical.20070307.d: "En marzo de 2007, durante una sesión del Comité de Presupuesto de la Cámara de Consejeros, se reveló que la organización de financiación política del Ministro de Agricultura, Silvicultura y Pesca Toshikatsu Matsuoka «Toshikatsu Matsuoka New Century Political and Economic Forum», había reportado un total de aproximadamente 28,8 millones de yenes en gastos de utilidad a lo largo de cinco años entre 2001 y 2005 en sus informes de fondos políticos.\n\nLo que dibujó especial escrutinio fue el hecho de que la «oficina principal» de la organización estaba ubicada en el edificio de oficinas de miembros de la Cámara de Representantes, donde se proporciona agua, electricidad y control climático gratuitamente.\nEl ministro Matsuoka explicó que los gastos incluían costos para un «ionizador de agua» y «calor eléctrico», pero no proporcionaron una clara justificación para las cantidades reportadas. En sesiones posteriores de Dieta, se negó a elaborar, declarando, «Bajo el sistema, no es necesaria ninguna explicación adicional».\n\nLos partidos de oposición criticaron fuertemente la situación, llamándola una posible «falsa declaración» y «abuso del sistema», mientras que la desconfianza pública crecía sobre la responsabilidad general del gobierno."
 JAP_historical.20070307.oA: "Exigir al ministro que dé una explicación pública completa"
 JAP_historical.20070307.oB: "Defenderlo hasta que concluya la investigación"
 JAP_historical.20070528.t: "Una carga demasiado pesada"
 JAP_historical.20070528.d: "El Ministro de Agricultura, Silvicultura y Pesca, Toshikatsu Matsuoka, fue encontrado muerto colgando en su residencia parlamentaria en Akasaka, Tokio. La policía confirmó que fue un suicidio.\n\nDurante varios meses, el Ministro Matsuoka había enfrentado un intenso escrutinio en la Dieta, los medios de comunicación y la opinión pública sobre los altos gastos de utilidad reportados en sus registros políticos de financiación.\n\nLa noticia envió ondas de choque a través del público, planteando preguntas más profundas: «¿Es él el único que debería haber sido considerado responsable?» y «¿Fue la respuesta del gobierno realmente adecuada?»"
 JAP_historical.20070528.oA: "Qué tragedia..."
 JAP_historical.20070801.t: "Una Cadena de Escándalos: El peso de la responsabilidad"
 JAP_historical.20070801.d: "Tras la muerte del Ministro de Agricultura, Silvicultura y Pesca Toshikatsu Matsuoka, Norihiko Akagi fue nombrado su sucesor. Sin embargo, sólo dos meses más tarde, Akagi fue efectivamente forzado a dimitir después de que se plantearon múltiples cuestiones en relación con su informe de financiación política, incluidos los gastos de oficina, la gestión de donaciones y el doble reportaje de recibos por su grupo político «Tokuyūkai».\n\nCon dos sucesivos ministros de agricultura envueltos en escándalos tan cortos, se han planteado serias preguntas sobre el sentido de responsabilidad, transparencia y confiabilidad de la administración en los nombramientos de gabinete. El puesto de Ministro de Agricultura ha llegado a ser considerado como «cursado», y la administración está ahora bajo presión para hacer movimientos decisivos para restaurar la confianza y estabilizar su liderazgo."
 JAP_historical.20070801.oA: "¿Por qué sigue pasando esto? Debemos recuperar la confianza de la gente."
 JAP_historical.20070704.t: "A Fatal Gaffe"
 JAP_historical.20070704.d: "Durante una conferencia pública, el ministro de Defensa Fumio Kyūma hizo un comentario polémico que sugiere que los bombardeos atómicos de Hiroshima y Nagasaki eran «inevitables».\nEl comentario fue ampliamente interpretado como condominio de los bombardeos, provocando intensos retrocesos de grupos atómicos sobrevivientes de bombas y del público. La crítica provenía tanto de los legisladores del partido gobernante como de la oposición, así como de los gobiernos locales. El Primer Ministro Abe emitió una amonestación formal.\nTras la observación, los dirigentes locales y los grupos cívicos de las ciudades afectadas organizaron protestas sentadas, lo que redundó la controversia en una crisis política de todo tipo. Kyūma finalmente renunció como Ministro de Defensa, y Yuriko Koike fue nombrado su sucesor.\n\nLo que comenzó como «mere gaffe por un ministro» se convirtió en una prueba seria de la capacidad gobernante de la administración y la credibilidad internacional."
 JAP_historical.20070704.oA: "Como gobierno, debemos expresar un sincero y profundo pesar."
 JAP_historical.20090808.t: "La fundación de su partido"
 JAP_historical.20090808.d: "Como expectativas para un cambio de ascenso del gobierno, la insatisfacción sigue siendo fuerte con respecto a la lenta toma de decisiones de los partidos existentes y la rigidez de la administración. En medio de esta atmósfera, Yoshimi Watanabe y otros pusieron «reforma» a la vanguardia y pidieron que se consolide una nueva fuerza política que no dependería del marco existente.\n\nDe esta manera, se anunció la fundación de Su Partido. Este movimiento, que aboga por la reforma administrativa y la desregulación, ampliará las opciones de los votantes acelerando aún más el reajuste y maniobrar dentro de la política japonesa."
 JAP_historical.20090808.a: "Bajo la bandera de la reforma, una nueva fuerza comienza a moverse."
 JAP_historical.20120928.t: "La fundación del Partido de la Innovación Japón"
 JAP_historical.20120928.d: "Como desconfianza de los partidos existentes e insatisfacción con el estancamiento político difundido, un movimiento reformista basado en la Asociación Regional de Restauración Osaka, que había ido ampliando su influencia en Osaka, comenzó a avanzar hacia la política nacional. Esta corriente, que había aumentado su presencia en la política regional promoviendo el examen de la administración local y la reforma de la gobernanza, se reorganizaría en una fuerza política nacional y llamaría la atención como alternativa a los partidos establecidos.\n\nLa fundación del Partido de la Innovación de Japón no sólo marcaría el nacimiento de un nuevo partido, sino que también se convertiría en un acontecimiento que acelera aún más el reajuste de la oposición y la formación de una «tercera fuerza»."
 JAP_historical.20120928.a: "Una nueva fuerza reformista entra en la política nacional."
 JAP_historical.20141128.t: "La disolución de su partido"
 JAP_historical.20141128.d: "Su Partido, que había establecido una presencia como «tercera fuerza» en oposición a los principales partidos existentes, había estado encontrando cada vez más difícil mantener la unidad interna mientras las diferencias de opinión se profundizaban gradualmente sobre la dirección de la gestión del partido y las respuestas a las elecciones.\n\nAl final, el partido decidió disolver, y sus legisladores afiliados cada uno siguió adelante para seguir caminos separados. La dispersión de una fuerza que se había reunido bajo la bandera de la reforma pone de relieve una vez más la naturaleza fluida del reajuste de la oposición, y probablemente no tendrá un pequeño impacto en el mapa político futuro también."
 JAP_historical.20141128.a: "Un pilar de la tercera fuerza llega a su fin."
 JAP_historical.20170925.t: "Oposición: Dividir entre la esperanza y los demócratas constitucionales"
 JAP_historical.20170925.d: "Las fuerzas no desplazadas están entrando en una fase importante de reajuste. El nuevo Partido de la Esperanza atrajo rápidamente la atención como un nuevo vehículo orientado hacia la reforma, en un contexto de insatisfacción con los partidos existentes y una sensación de estancamiento político. En algunas partes del campamento establecido no PPD, la fusión y la cooperación parecían ser una oportunidad para reconstruir su fuerza, pero al mismo tiempo, los conflictos sobre dirección política y las condiciones de fusión comenzaron gradualmente a surgir.\nLas fuerzas arraigadas en el antiguo Partido Democrático no se unieron como un solo bloque: algunos fusionados o cooperados con el Partido de la Esperanza, mientras que otros formaron el Partido Democrático Constitucional y adoptaron una línea independiente. Realignment advanced, but division also became clearer at the same time, and the structure of the non-LDP forces was dramatic redrawn."
 JAP_historical.20170925.a: "El campo no-LDP se dividió entre Hope y los demócratas constitucionales."
 JAP_historical.20170925_TT: "§Y¡El Partido Demócrata será reemplazado por el Partido Democrático Constitucional!§!"
 JAP_historical.20180507.t: "Realización de la oposición: formación del Partido Democrático para el Pueblo"
 JAP_historical.20180507.d: "Las fuerzas de oposición, reorganizadas a través de la división entre el Partido de la Esperanza y el Partido Democrático Constitucional, han seguido sufriendo un nuevo replanteamiento. Una parte del antiguo campamento del Partido Demócrata y una porción del campamento del Partido de la Esperanza, mientras llevaban puntos de desacuerdo, trataron de unirse como nueva fuerza centrista, y el Partido de la Esperanza perdió gradualmente peso como marco independiente.\nA tiempo, se formó el Partido Demócrata para el Pueblo. Esto también marcó la creación de un nuevo vehículo político que propugna una línea centrista distinta del Partido Constitucional Democrático, y la estructura de la oposición seguiría cambiando."
 JAP_historical.20180507.a: "La realineación continúa, y la forma de la oposición sigue cambiando."
 JAP_historical.20180507_TT: "§Y¡El Partido de la Esperanza será reemplazado por el Partido Demócrata para el Pueblo!§!"
 JAP_historical.20190401.t: "La fundación de Reiwa Shinsengumi"
 JAP_historical.20190401.d: "En medio de la desconfianza de los partidos existentes y la insatisfacción por la inseguridad de los medios de subsistencia, Tarō Yamamoto y otros se trasladaron a lanzar una nueva fuerza política. Poniendo de relieve el apoyo comunitario que no depende de las organizaciones a gran escala, y abogando por que se expresen a la política nacional que el orden político establecido no puede recoger plenamente, este movimiento puede ser posicionado como una fuerza que coloca los llamamientos centrados en los medios de subsistencia a la vanguardia, incluido el apoyo al hogar, la expansión de la seguridad social y una revisión de las cargas, incluido el impuesto sobre el consumo.\n\nLa fundación de Reiwa Shinsengumi aumenta la gama de opciones dentro de las fuerzas de oposición, al tiempo que se convierte en un evento que subraya una vez más la fluidez del realineamiento político."
 JAP_historical.20190401.a: "Una nueva fuerza popular declara su entrada en la política nacional."
 JAP_historical.20220710.t: "El Levántate de Sanseitō"
 JAP_historical.20220710.d: "En medio de una creciente discusión sobre la desconfianza hacia los partidos existentes y un sentido de distancia de la participación política, Sanseitō, nueva fuerza política que ha ampliado su apoyo a través de actividades comunitarias y divulgación de información, ha comenzado a mostrar presencia en el escenario político nacional. Respaldado por la construcción de organizaciones locales y sus propios llamamientos distintos, se señala cada vez más a la atención como un vehículo para los segmentos que las principales partes no habían podido absorber plenamente.\n\nPoniendo de relieve su distancia con las partes establecidas, Sanseitō se está expandiendo como nuevo partido que asigna importancia a la participación y el poder de divulgación de sus miembros y partidarios. Su postura de acercar temas como la educación, los alimentos, los sistemas sociales y la conciencia de la soberanía a la vanguardia es atraer apoyo, al tiempo que también puede convertirse en un factor que sacude la actual alineación del partido y estructura de emisión.\n\nEl crecimiento de esta nueva fuerza es un cambio que los partidos existentes no pueden ignorar, y también puede influir en la oposición futura y las realineaciones conservadoras, así como en el establecimiento de agendas políticas."
 JAP_historical.20220710.a: "Una nueva fuerza emergente está fortaleciendo su presencia en la política."
