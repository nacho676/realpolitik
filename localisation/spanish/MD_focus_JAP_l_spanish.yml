 intellectual_platform_rejected: "China-Korea-Japón Plataforma Intelectual Rechazada"
 JAP_seek_permanent_unsc_seat: "Buscar miembros permanentes del Consejo de Seguridad"
 JAP_seek_permanent_unsc_seat_desc: "La influencia económica y las contribuciones del Japón a las Naciones Unidas justifican un papel permanente en la seguridad internacional. Para asegurarlo será necesario que ambas cámaras del sistema de las Naciones Unidas reciban un apoyo y una aprobación constantes."
 JAP_zombie_probe_abandoned: "Zombie Firm Probe Abandonado"
 JAP_electronics.300.t: "Sony Ericsson está creado"
 JAP_electronics.300.d_agreed: "Ericsson ha acordado combinar su negocio con Sony. Ninguna empresa vende suficientes teléfonos solos para importar contra Nokia y Motorola, y juntos tendrían ingeniería de radio sueca y diseño de consumo japonés en una sola empresa. Sony puede comprometerse con él, o mantener el móvil dentro del grupo y seguir solo."
 JAP_electronics.300.d_alone: "El negocio de teléfonos portátiles sueco con el que Sony esperaba asociarse ha tomado otro curso. Sony todavía puede construir una empresa móvil en los términos disponibles, o mantener los teléfonos dentro del grupo y aceptar una parte más pequeña de un mercado que no conduce."
 JAP_electronics.300.a: "Compromiso a la empresa mixta móvil"
 JAP_electronics.300.b: "Mantenga el móvil dentro del grupo"
 JAP_electronics.301.t: "El dilema de la música digital"
 JAP_electronics.301.d: "Sony posee tanto el hardware que toca música como el catálogo que lo llena, y los dos mitades quieren cosas opuestas. Proteger el catálogo significa jugadores que rechazan los formatos que ya usan los oyentes. Abrir los jugadores significa que la división de discos viendo sus propios dispositivos llevan los archivos de otras personas."
 JAP_electronics.301.a: "Protege el catálogo con nuestros propios formatos"
 JAP_electronics.301.b: "Abrir los jugadores a lo que la gente ya posee"
 JAP_electronics.302.t: "El juego de PlayStation 3"
 JAP_electronics.302.d: "La PlayStation 3 se puede construir alrededor de Cell, un procesador Sony diseñado desde nada con IBM y Toshiba, difícil de programar y a diferencia de cualquier otra cosa en la industria. La consola entonces vendería bajo costo durante años con la esperanza de que el software se ponga al día. O se puede construir la forma en que Microsoft construyó la Xbox 360, y enviar antes por menos."
 JAP_electronics.302.a: "Construir la máquina alrededor de la nueva arquitectura"
 JAP_electronics.302.b: "Construir una consola convencional y enviarla antes"
 JAP_electronics.303.t: "Uno de Sony"
 JAP_electronics.303.d: "Las divisiones de Sony se han ejecutado durante décadas, y muestra en productos que no trabajan juntos y en la misma ingeniería hecha cuatro veces más. Sacarlos bajo una estrategia significa desestimar a las personas que han estado justo antes. Dejarlos solos mantiene lo que la independencia construyó."
 JAP_electronics.303.a: "Tire de las divisiones bajo una estrategia"
 JAP_electronics.303.b: "Deja a las divisiones su independencia"
 JAP_electronics.304.t: "El Pivot de la Imagen-Sensor"
 JAP_electronics.304.d: "Los sensores de imagen de Sony se sientan dentro de los teléfonos hechos por las empresas con las que Sony compite, y la demanda está creciendo más rápido de lo que pueden servir las fabs. Hacer sensores el centro de la empresa significa capital que se prometieron las divisiones del consumidor. No hacerlo significa vender el plomo a quien construye la capacidad primero."
 JAP_electronics.304.a: "Hacer sensores de imagen el centro de la empresa"
 JAP_electronics.304.b: "Mantener el capital en productos de consumo"
 JAP_electronics.305.t: "Lo que Sony Became"
 JAP_electronics.305.d: "Un cuarto de siglo de empresas, formatos, arquitecturas y reestructuraciones ha solucionado lo que Sony es y lo que la electrónica de consumo japonesa es para. La compañía que una vez vendió los productos ahora suministra las partes dentro de todos los demás."
 JAP_electronics.305.a: "Una empresa en hardware, contenido y servicios"
 JAP_electronics.305.b: "Una federación de negocios de hardware"
 JAP_electronics.305.c: "Una arquitectura de computación soberana"
 JAP_electronics.305.e: "Un tejido digital abierto"
 JAP_sony_one_sony_ecosystem: "Uno de Sony"
 JAP_sony_one_sony_ecosystem_desc: "Las divisiones responden a una estrategia, y los sensores, el catálogo, la consola y los servicios fueron construidos para reforzarse en lugar de competir por el mismo presupuesto. La coordinación cuesta algo a la velocidad y lo devuelve en todo el envío como una cosa."
 JAP_sony_hardware_federation: "Federación de Rusia"
 JAP_sony_hardware_federation_desc: "Las divisiones mantenían su independencia y cada una se convirtió en formidable en su propio trabajo. Nada que Sony haga está diseñado con el resto de Sony en mente, y cada pieza de ella es muy bueno."
 JAP_sony_cell_sovereign_compute: "Soberana arquitectura compute"
 JAP_sony_cell_sovereign_compute_desc: "Japón construyó una arquitectura procesadora propia y pagó por ella en una generación de consolas. Lo que la industria aprendió de programarlo sobrevivió a la máquina que lo llevó."
 JAP_sony_open_digital_commonwealth: "Mancomunidad digital abierta"
 JAP_sony_open_digital_commonwealth_desc: "Los formatos se abrieron, el catálogo viajó y el hardware dejó de discutir con lo que la gente ya poseía. Sony gana menos por dispositivo y sus productos están en muchas más manos."
 JAP_electronics.310.t: "Dos pantallas, dos máquinas"
 JAP_electronics.310.d: "El Game Boy Advance de Nintendo y su GameCube tienen equipos separados, arquitecturas separadas y bibliotecas separadas, y cada juego debe ser construido para uno u otro. Mantener ambos significa financiar dos plataformas fuera de una empresa. Doblarlos juntos terminaría el negocio de mano que paga por todo lo demás."
 JAP_electronics.310.a: "Fondo tanto el handheld como la consola"
 JAP_electronics.310.b: "Concéntrelo todo en una plataforma"
 JAP_electronics.311.t: "El Wii y la audiencia más amplia"
 JAP_electronics.311.d: "La próxima consola de Nintendo puede perseguir a las personas que no compran consolas, con hardware más barato, un esquema de control que nadie ha enviado, y ninguna del poder gráfico que la prensa mide. O puede encontrarse con Sony y Microsoft en los términos en que la industria ya está de acuerdo, y ser juzgado por ellos."
 JAP_electronics.311.a: "Construye para las personas que no compran consolas"
 JAP_electronics.311.b: "Competir en el rendimiento"
 JAP_electronics.312.t: "El Wii U no puede ser explicado"
 JAP_electronics.312.d: "La nueva consola ha vendido lo suficientemente mal para plantear la pregunta que nadie quiere preguntar: si Nintendo debe construir hardware en absoluto. Su software se vendería en la máquina de cualquiera, y las pérdidas pararían. Mantenerse en hardware significa financiar otra generación sobre la fuerza de la última falla."
 JAP_electronics.312.a: "Mantenerse en hardware y financiar otra generación"
 JAP_electronics.312.b: "Dejar hardware y poner los juegos en todas partes"
 JAP_electronics.313.t: "Nintendo y el teléfono"
 JAP_electronics.313.d: "Los personajes de Nintendo valen más que su hardware, y todos los teléfonos del mundo pueden cargarlos. Licensarlos gana dinero de un público que las consolas nunca llegan. Refusing los mantiene exclusivos de las máquinas Nintendo control, que es la razón por la que alguien compra esas máquinas."
 JAP_electronics.313.a: "Licencia los caracteres a móvil"
 JAP_electronics.313.b: "Mantenerlos exclusivos de nuestro hardware"
 JAP_electronics.314.t: "El interruptor"
 JAP_electronics.314.d: "Una máquina que es tanto el handheld como la consola terminaría la división que ha dividido la ingeniería de la compañía durante dos décadas, y significa una biblioteca, un equipo y un fracaso si no funciona. Mantener las líneas separadas es lo que Nintendo sabe hacer."
 JAP_electronics.314.a: "Construir una máquina que es ambas"
 JAP_electronics.314.b: "Mantenga la mano y la consola separadas"
 JAP_electronics.315.t: "Lo que Nintendo Became"
 JAP_electronics.315.d: "Un cuarto de siglo de hardware que nadie más hubiera construido ha resuelto lo que es Nintendo y cuánto del entretenimiento japonés pasa a través de él. Los personajes sobrevivieron a cada máquina que los llevaba."
 JAP_electronics.315.a: "Una plataforma híbrida disciplinada"
 JAP_electronics.315.b: "Un ecosistema de entretenimiento integrado"
 JAP_electronics.315.c: "Un licenciante global de personajes"
 JAP_electronics.315.e: "Un programador abierto commonwealth"
 JAP_nintendo_disciplined_hybrid_platform: "Plataforma híbrida disciplinada"
 JAP_nintendo_disciplined_hybrid_platform_desc: "Una máquina, una biblioteca y una organización de ingeniería detrás de ambas. Nintendo dejó de competir en las especificaciones que todo el mundo anuncia y comenzó hardware de envío que cuesta menos para construir de lo que vende."
 JAP_nintendo_integrated_entertainment_ecosystem: "Ecosistema de entretenimiento integrado"
 JAP_nintendo_integrated_entertainment_ecosystem_desc: "Los personajes corren a través de parques, películas y mercancías tanto como a través de las máquinas, y cada parte de ella vende los otros. Las exportaciones japonesas de entretenimiento descansan en las propiedades que una sola empresa todavía posee."
 JAP_nintendo_global_ip_licensor: "Mundial de licenciatura"
 JAP_nintendo_global_ip_licensor_desc: "El hardware se convirtió en un canal de distribución entre muchos. Nintendo gana de personajes apareciendo en máquinas que no construye, en mercados sus consolas nunca alcanzadas."
 JAP_nintendo_open_developer_commonwealth: "Mancomunidad abierta de desarrolladores"
 JAP_nintendo_open_developer_commonwealth_desc: "La plataforma se abrió a los desarrolladores en términos que no requieren permiso primero. Nintendo toma una parte más pequeña de un catálogo mucho mayor, y las máquinas llevan trabajo que nunca habría encargado."
