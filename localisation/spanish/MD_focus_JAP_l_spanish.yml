 JAP_whistleblower_protection_act: "Ley de protección contra los denunciantes"
 JAP_whistleblower_protection_act_desc: "Los auditores sólo pueden leer lo que les da una empresa, mientras que los empleados saben qué préstamos se entregaron y cuáles facturas fueron respaldadas. Trabajan para la empresa que tendrían que acusar, en un mercado laboral que ofrece una carrera y ninguna segunda oportunidad. Una ley que hace despido para divulgar información ilegal convierte a testigos silenciosos en testificadores."
 JAP_financial_revival_program: "El programa de reactivación financiera"
 JAP_financial_revival_program_desc: "Los bancos califican a sus propios prestatarios, y las calificaciones ocultan una incapacidad para pagar. El Programa de Revivencia Financiera aplica una evaluación de flujo de efectivo descontado a cada exposición mayor, ajusta los límites de activos-capital y publica un objetivo para reducir la proporción de mal préstamo. Las federaciones de negocios lo llamarán una guerra contra la industria, y no están completamente equivocados."
 JAP_special_investigation_unit: "Departamento de investigación especial"
 JAP_special_investigation_unit_desc: "Una auditoría produce una constatación, un fiscal produce a un acusado. El Departamento de Investigación Especial de la Fiscalía Pública del Distrito de Tokio ha roto ministros de gabinete y es la única institución con la que un consejo de keiretsu no puede establecerse tranquilamente. Se señalan los balances."
 JAP_special_investigation_unit_TT: "La obstrucción ahora acumula §G25% más lentamente§!"
 JAP_the_lost_decade_ends: "Fin de la Década Perdida"
 JAP_the_lost_decade_ends_desc: "La última de las firmas insolventes pasa por los tribunales y el registro está cerrado. Nada fue refinanciado, cada pérdida se escribió donde cayó, y el crédito ahora sólo llega a las empresas que pueden pagarlo. Una economía cuyos libros dicen lo que es verdad es la única base en la que cualquier otra cosa puede construirse.\n-------------\nEste enfoque §Geliminaciones§! §Y$JAP_zombie_companies$§! y el §Y$JAP_liquidation_wave$§! que vino con el viento hacia abajo."
 JAP_controlled_downsize_TT: "Comienza la onda de liquidación §Y§!: las empresas están terminadas a §G duplicando el ritmo §! de un programa de fusión, a costa de un espíritu nacional §Rsevere§! hasta que el viento termine"
 JAP_forced_mergers_TT: "Comienza el programa §Ymerger§!: barato y suave ahora, §R la mitad de la velocidad de cierre §!, y una marca permanente en la industria japonesa después"
 JAP_liquidation_wave: "La ola de liquidación"
 JAP_liquidation_wave_desc: "La liquidación está en marcha. Los avisos de quiebra llenan las páginas de negocio, los sitios de construcción permanecen ociosos mientras sus desarrolladores están heridos, surge el desempleo y el gobierno debe pedir prestado para amortiguar el golpe. El dolor es severo y concentrado, pero es temporal.\n-------------\nLevantado una vez §YEl progreso de la reestructuración corporativa§! termina derribando las empresas zombis."
 JAP_fusion_restructuring: "Orientación administrativa"
 JAP_fusion_restructuring_desc: "El ministerio dibuja las líneas y los bancos proporcionan la dote. Nadie es despedido, nadie admite el fracaso, y dos fuerzas de ventas que se han odiado por treinta años se les dice que ahora son una empresa. El registro crece más corto cada trimestre. El costo está en estancamiento, no en desempleo.\n-------------\nLevantado una vez §YEl progreso de reestructuración corporativa§! termina absorbiendo las empresas zombis."
 JAP_consolidated_conglomerates: "Consolidated Japan Inc."
 JAP_consolidated_conglomerates_desc: "Los nombres insolvente se han ido del registro, absorbido en lugar de terminar. Lo que los sustituyó son grupos más grandes que llevan fábricas duplicadas, divisiones de investigación duplicadas y administradores que responden a una junta que las compró contra su voluntad. El estado tiene los campeones nacionales que pidió. También tiene una base industrial que innova más lentamente que la que comenzó con."
 JAP_zombie_investigation_category: "La investigación de Zombie Firm"
 JAP_zombie_investigation_category_desc: "Auditores y fiscales revisan los libros de los prestatarios insolventes de Japón, y las empresas se esfuerzan igual de duro por detenerlos.\n\n§YExpedientes§!: [?JAP_zombie_case_files|0] / 14\n§YObstrucción§!: [?JAP_zombie_obstruction|0] / 100\n\n§YQué puedes hacer§!\nCada caso de abajo puede procesarse, rescatarse discretamente o dejarse pasar. Procesar arma el expediente más sólido y es lo que más te cuesta con los §Yconglomerados industriales§!, cuya opinión mueve la producción real. Un rescate arma un expediente más endeble a costa del contribuyente. Dejar pasar un caso no arma nada.\n\n§GEl informe§!\nSe califica al cerrarse la investigación.\n§G10 o más§! expedientes: un ajuste de cuentas completo que acelera la liquidación.\n§G3 a 9§!: un informe parcial.\n§RMenos de 3§!: un encubrimiento que borra los expedientes reunidos y frena la liquidación.\n§Y$JAP_controlled_downsize$§! requiere 10 o más expedientes. §Y$JAP_forced_mergers$§! requiere 3 o más expedientes. Ninguna rama se cierra nunca de forma permanente, aunque la investigación se abandone o se encubra.\n\n§RObstrucción§!\nSube cada mes que sigues indagando, más rápido cuanto más enojados estén los conglomerados. En §R30§! el ministerio filtra, en §R55§! la federación empresarial emite un ultimátum y en §R80§! la investigación se suspende por escándalo. Las decisiones de abajo la hacen bajar."
 JAP_zombie_investigation_mission: "Conclusión de la investigación"
 JAP_zombie_investigation_mission_desc: "La sonda no puede correr para siempre. Construir un caso que valga la pena publicar antes de que se agote la voluntad política."
 JAP_zombie_investigation_mission_TT: "§YCaso de archivos§!: [?JAP_zombie_case_files|0] / 10"
 JAP_keidanren_ultimatum_mission: "El Keidanren Ultimatum"
 JAP_keidanren_ultimatum_mission_desc: "La federación empresarial ha dicho al gobierno, en el lenguaje más político posible, que la investigación daña la confianza y debe ser derribado. Nos han dado hasta el final de la mitad fiscal para tomar la pista."
 JAP_keidanren_ultimatum_TT: "Traiga §YObstrucción§! abajo §Y45§!"
 JAP_case_ltcb_shinsei: "Expediente: la opción de venta de Shinsei"
 JAP_case_ltcb_shinsei_desc: "El Banco de Crédito a largo plazo fue nacionalizado, limpiado a expensas públicas, y vendido a un grupo de inversión extranjera para una suma token. El contrato dio al comprador el derecho de entregar cualquier préstamo que perdiera una quinta parte de su valor directamente de vuelta a la Corporación de Seguros de Depósito a precio de libro. Los nuevos propietarios lo están ejerciendo, y todos los yenes de la pérdida aterrizan en el contribuyente. Alguien en el ministerio firmó esa cláusula."
 JAP_case_sogo_collapse: "Expediente: el colapso de Sogo"
 JAP_case_sogo_collapse_desc: "La cadena de la tienda del departamento debe algo cercano a dos trillones yenes y no ha dado un beneficio real en años. El plan sobre el escritorio del ministerio es perdonar la parte pública de la deuda y dejarla cambiar. Los periódicos también tienen el plan, y la reacción pública a rescatar a un minorista mientras que las empresas ordinarias se niegan al crédito ha sido lo que cualquiera podría haber predicho."
 JAP_case_mycal_bankruptcy: "Archivo de caso: Mycal"
 JAP_case_mycal_bankruptcy_desc: "El grupo de supermercados Osaka se expandió a través de la burbuja en dinero que su banco principal nunca esperaba ver devuelto, y ha pasado los años desde ser refinanciado en lugar de reestructurar. Si falla será la mayor bancarrota minorista que el país ha registrado, y tomará una cadena de proveedores en el Kansai abajo con él."
 JAP_case_resona_injection: "Caso Archivo: Resona"
 JAP_case_resona_injection_desc: "Los auditores se han negado a certificar cuánto del capital del banco consiste en activos fiscales diferidos, que es decir ganancias futuras que no tiene perspectivas realistas de ganar. Sin esa ficción, el banco está infracapitalizado. Casi dos billones de yenes del dinero público lo harían completo y efectivamente se lo entregaría al estado. Refusing sería el primer fallo bancario importante que el gobierno ha permitido."
 JAP_case_ashikaga_bank: "Expediente: el Banco Ashikaga"
 JAP_case_ashikaga_bank_desc: "No es un banco nacional. Es el banco de Tochigi, donde lleva las cuentas del gobierno de la prefectura, de la mayoría de las empresas locales y de muchísimos hogares que nunca han usado otro. También es insolvente. Nacionalizarlo protege a los depositantes y destruye a los accionistas, y todo prestamista regional del país leerá la decisión como una declaración de intenciones."
 JAP_case_daiei_ircj: "Un caso: Daiei"
 JAP_case_daiei_ircj_desc: "El minorista que enseñó Japón precios de descuento lleva deudas en los trillones y ha sido mantenido recto por bancos que no pueden permitirse admitir lo que valen los préstamos. La Corporación de Revitalización Industrial puede asumirlo, reemplazar la gerencia y vender las piezas. Los aliados del fundador en el partido preferirían ser refinanciados una vez más."
 JAP_case_kanebo_accounts: "Expediente: las cuentas de Kanebo"
 JAP_case_kanebo_accounts_desc: "El grupo de cosméticos y textiles ha estado reportando ganancias que no ganó durante cinco años, al orden de doscientos mil millones de yenes. El fraude no está en disputa. Lo que está en disputa es la firma contable que firmó cada uno de esos estados, y si un país puede tener libros honestos mientras sus auditores responden comercialmente a las empresas que auditan."
 JAP_press_the_prosecutors: "Gire la orden de los fiscales"
 JAP_press_the_prosecutors_desc: "Dejar que el Departamento de Investigación Especial haga detenciones en lugar de remisiones. Nada acalla más rápido una campaña de presión que ver a un director sacado de su despacho por hombres con una orden."
 JAP_whistleblower_immunity_decision: "Conceder inmunidad a los informantes"
 JAP_whistleblower_immunity_decision_desc: "Ofrecer a los mandos intermedios que ejecutaron las instrucciones protección frente a la acción penal a cambio de testimoniar contra los hombres que las dieron. Los conglomerados lo llamarán una invitación a traicionar a tus colegas. Lo es."
 JAP_publish_inspection_manual_decision: "Publicar los hallazgos de la inspección"
 JAP_publish_inspection_manual_decision_desc: "Publicar íntegras las evaluaciones de supervisión en lugar de resumirlas para el ministerio. A los mercados no les gustará leerlas, pero una empresa no puede presionar contra una cifra que todo el país ya ha visto."
 JAP_cooperating_bank_amnesty_decision: "Amnistía para los bancos que cooperan"
 JAP_cooperating_bank_amnesty_decision_desc: "Ofrecer a todo banco que abra sus libros voluntariamente la garantía de que sus directivos no serán perseguidos. Compra paz, y cuesta a la investigación el caso que estaba armando contra ellos."
 JAP_zombie_probe_abandoned_TT: "La investigación es §R llamada off§! y publicará como un lavado de blancos, limpiando los archivos del caso recogidos hasta ahora y desacelerando el viento hacia abajo"
 JAP_zombie_report_strong_TT: "§GUn cálculo completo.§! El cierre del viento correrá §G25% más rápido§!"
 JAP_zombie_report_partial_TT: "§YUn informe parcial.§! El cierre del viento correrá a su ritmo normal."
 JAP_zombie_report_whitewash_TT: "§RUn lavado blanco.§! Los archivos de casos son §R redirigidos§! y el parabrisas funcionará §R25% más lento§!"
 Japan_economy.06.c: "Llámalo todo."
