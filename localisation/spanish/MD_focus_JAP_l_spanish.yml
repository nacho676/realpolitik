 JAP_diplomacy.11.t: "EE.UU. Solicitud de reinterpretar el artículo 9"
 JAP_diplomacy.11.d: "El Gobierno de los Estados Unidos se ha acercado a nosotros con una solicitud formal para reinterpretar aún más el artículo 9 de nuestra Constitución. Washington argumenta que el entorno de seguridad regional se ha deteriorado hasta tal punto que Japón debe asumir una mayor parte de la carga colectiva de defensa. Aceptar su solicitud abriría la puerta a un entendimiento más amplio de la autodefensa, y a una cooperación militar más estrecha, pero no estará sin controversia interna."
 JAP_diplomacy.11.a: "Aceptar la solicitud de EE.UU."
 JAP_diplomacy.11.b: "No podemos aceptar esta solicitud."
 JAP_diplomacy.12.t: "Japón se niega a reinterpretar el artículo 9"
 JAP_diplomacy.12.d: "Tokio nos ha informado de que no está dispuesto a reinterpretar aún más el artículo 9 en este momento. La preocupación por la opinión pública nacional, las limitaciones constitucionales y la estabilidad política han llevado al gobierno japonés a rechazar nuestra solicitud. Ahora debemos decidir si respetan su decisión o aumentan la presión diplomática y de seguridad."
 JAP_diplomacy.12.a: "Respetaremos su decisión"
 JAP_diplomacy.12.b: "Aumentar la presión sobre Japón"
 JAP_diplomacy.13.t: "Japón acepta reinterpretar el artículo 9"
 JAP_diplomacy.13.d: "Tokio ha compartido que están a favor de cambiar el nivel de interpretación del artículo 9 y trabajarán para ser un socio de defensa más activo."
 JAP_diplomacy.13.a: "Finalmente"
 JAP_diplomacy.14.t: "EE.UU. Presión del artículo 9"
 JAP_diplomacy.14.d: "Tras nuestra negativa a ampliar la interpretación del artículo 9, los Estados Unidos han comenzado silenciosamente a aumentar la presión diplomática y de seguridad sobre nuestro gobierno. Las consultas de la Alianza, las reuniones informativas para los medios de comunicación y los mensajes detrás del escenario apuntan en la misma dirección: Washington espera que Japón asuman más responsabilidad. Podemos mantenernos firmes o cambiar silenciosamente nuestra postura."
 JAP_diplomacy.14.a: "Nos mantendremos firmes."
 JAP_diplomacy.14.b: "Ajuste silenciosamente nuestra posición"
 JAP_diplomacy.15.t: "Japón acepta bajo presión"
 JAP_diplomacy.15.d: "Tras un período de mayor presión diplomática y estratégica, Tokio ha indicado que está dispuesta a acercarse más a nuestra posición sobre el artículo 9. Mientras insistía públicamente en que los principios pacifistas de Japón siguen sin cambiar, el gobierno ha ampliado su interpretación de autodefensa de una manera que se ajuste a nuestras expectativas."
 JAP_diplomacy.15.a: "Excelente"
 JAP_diplomacy.17.t: "EE.UU. Aranceles sobre bienes japoneses"
 JAP_diplomacy.17.d: "Los Estados Unidos han anunciado un nuevo conjunto de aranceles dirigidos a las principales exportaciones japonesas, citando los desequilibrios económicos y la presión política nacional. Las medidas se presentan como una manera de 'nivelar el campo de juego', pero en Tokio son ampliamente vistos como un movimiento político que va a ceder tanto nuestra economía como la alianza más amplia."
 JAP_diplomacy.17.a: "Tendremos que adaptarse a esta nueva realidad"
 JAP_diplomacy.18.t: "Japón solicita ayuda arancelaria"
 JAP_diplomacy.18.d: "Tokio ha pedido oficialmente que levantemos los aranceles impuestos a los bienes japoneses. Los representantes japoneses insinúan que su gobierno puede estar dispuesto a profundizar la cooperación en materia de seguridad y seguir adelante con la política de defensa a cambio. Debemos decidir si convertir esta disputa económica en una oportunidad estratégica, o mantener la presión."
 JAP_diplomacy.18.a: "Levantar los aranceles a cambio de las concesiones de seguridad"
 JAP_diplomacy.18.b: "Rechazar y mantener los aranceles vigentes"
 JAP_diplomacy.19.t: "Aranceles elevados, Concesiones de Seguridad requeridas"
 JAP_diplomacy.19.d: "Estados Unidos ha acordado elevar sus aranceles a las exportaciones japonesas, pero sólo como parte de un entendimiento más amplio sobre seguridad y defensa. En la práctica, esto significa que se espera que el Japón amplíe aún más la interpretación del artículo 9, profundizando la cooperación militar con Washington y asumiendo un papel más importante en la seguridad regional."
 JAP_diplomacy.19.a: "Para nuestra economía y nuestra alianza, aceptaremos esta carga"
 JAP_diplomacy.20.t: "EE.UU. Rehabilitación para levantar los aranceles"
 JAP_diplomacy.20.d: "Nuestra solicitud formal para levantar los aranceles de Estados Unidos ha sido rechazada. Washington insiste en que las medidas seguirán vigentes, citando presiones políticas internas y desacuerdos no resueltos sobre la política de seguridad. En casa, la frustración está creciendo entre los exportadores y líderes empresariales, mientras que los estrategas advierten que la disputa podría complicar aún más nuestra alianza."
 JAP_diplomacy.20.a: "Tendremos que soportar la presión por ahora."
 JAP_diplomacy.21.t: "Japón solicita garantías de seguridad renovadas"
 JAP_diplomacy.21.d: "El Gobierno japonés ha solicitado oficialmente garantías de seguridad renovadas o fortalecidas de los Estados Unidos. Tokio sostiene que el entorno de seguridad regional se ha deteriorado y que un compromiso más claro de los Estados Unidos ayudaría a estabilizar la situación. En privado, los funcionarios japoneses reconocen que pueden ser posibles nuevos cambios en la interpretación del artículo 9 si Washington está dispuesto a asumir compromisos explícitos."
 JAP_diplomacy.21.a: "Restaurar nuestras garantías de seguridad a cambio de compromisos más profundos"
 JAP_diplomacy.21.b: "Rechazar nuestras garantías"
 JAP_diplomacy.22.t: "Garantías de seguridad Restablecidas"
 JAP_diplomacy.22.d: "Los Estados Unidos han acordado renovar y aclarar sus garantías de seguridad al Japón. A cambio, Washington espera que Tokio adopte nuevas medidas para ampliar la interpretación del artículo 9 y asumir una mayor parte de las responsabilidades regionales en materia de seguridad. La alianza crece más fuerte, pero el debate nacional sobre nuestros principios pacifistas se intensificará."
 JAP_diplomacy.22.a: "Para nuestra seguridad, aceptaremos este compromiso"
 JAP_diplomacy.23.t: "EE.UU. Rechaza Garantías Más Fuertes"
 JAP_diplomacy.23.d: "Nuestra solicitud de garantías de seguridad renovadas o fortalecidas ha sido rechazada. Los Estados Unidos insisten en que los arreglos existentes son suficientes y en que las limitaciones políticas internas limitan cualquier compromiso adicional. Dentro del Japón, esta negativa alimentará las preocupaciones sobre nuestra seguridad a largo plazo y la fiabilidad de nuestra alianza."
 JAP_diplomacy.23.a: "Entonces debemos reconsiderar nuestro propio camino."
 JAP_diplomacy.24.t: "Japón pide un fin a Estados Unidos. Presión naval"
 JAP_diplomacy.24.d: "Tokio ha pedido formalmente que revaloremos o pongamos fin a nuestra mayor presencia naval y presión en torno a los carriles y puntos de coque. Funcionarios japoneses argumentan que la postura actual amenaza la escalada y socava el apoyo nacional a la alianza. En privado, indican que pueden ser posibles nuevos cambios en la interpretación del artículo 9 si facilitamos nuestra postura."
 JAP_diplomacy.24.a: "Poner fin a la presión naval a cambio de concesiones de seguridad"
 JAP_diplomacy.24.b: "Mantenga nuestra presión naval alrededor de Japón"
 JAP_diplomacy.25.t: "Alivio de Presión Naval, Compromisos Profundizados"
 JAP_diplomacy.25.d: "Los Estados Unidos han acordado facilitar su mayor presencia naval alrededor de nuestras vías marítimas, a cambio de compromisos más profundos en materia de seguridad del Japón. En la práctica, esto significa otro paso para ampliar la interpretación del artículo 9 y ampliar nuestro papel en la seguridad regional. La alianza parece más fuerte, pero el debate nacional sobre nuestra identidad pacifista sólo crecerá más intensamente."
 JAP_diplomacy.25.a: "Por el bien de la estabilidad, honraremos este acuerdo"
 JAP_diplomacy.26.t: "EE.UU. Rehabilitación para poner fin a la presión naval"
 JAP_diplomacy.26.d: "Nuestra petición de aliviar o acabar con la presencia naval estadounidense en torno a nuestros carriles marinos ha sido rechazada. Washington insiste en que la postura actual es necesaria a la luz de las amenazas regionales. En casa, esta negativa alimentará tanto los temores de la trampa en un conflicto más amplio como los llamados a fortalecer aún más las propias defensas de Japón."
 JAP_diplomacy.26.a: "Entonces debemos adaptarnos bajo presión."
 JAP_diplomacy.28.t: "Complicaciones de diseño lunar Kaguya"
 JAP_diplomacy.28.d: "La ambiciosa misión lunar de Kaguya se enfrenta a serios desafíos de diseño. Los sistemas clave están demostrando más complejos de lo esperado, desde la orientación y la gestión de energía hasta la protección térmica. Los ingenieros argumentan que la financiación y el tiempo adicionales les permitirán rediseñar componentes críticos y mejorar la fiabilidad general, pero el costo de hacerlo ya está aumentando las cejas en el gabinete."
 JAP_diplomacy.28.a: "Invertir en rediseñar y mantener el horario ajustado"
 JAP_diplomacy.28.b: "Mantenga la línea en los costos y acepte una línea de tiempo más larga"
 JAP_diplomacy.29.t: "Kaguya Communications Vulnerabilidades"
 JAP_diplomacy.29.d: "A medida que continúa la prueba, el programa Kaguya revela debilidades en comunicaciones y enlaces de datos en el espacio profundo. La integridad de la señal, el ancho de banda y la resistencia a la interferencia están todos por debajo del objetivo. Los especialistas proponen nuevas antenas, estaciones de tierra actualizadas y una encriptación más robusta, pero estas mejoras requerirán capital político y financiero adicional."
 JAP_diplomacy.29.a: "Actualizar la arquitectura de las comunicaciones"
 JAP_diplomacy.29.b: "Proceder con los sistemas existentes y esperar lo mejor"
 JAP_diplomacy.30.t: "Más demoras para el Kaguya Misión"
 JAP_diplomacy.30.d: "Los reveses técnicos, las cuestiones de integración y los conflictos de programación con la infraestructura de lanzamiento han obligado otro retraso a la misión lunar Kaguya. Si bien los sistemas básicos siguen siendo prometedores, el proyecto se considera cada vez más lento y problemático. Los científicos insisten en que la paciencia será recompensada, pero la atención pública está empezando a derivar en otros lugares."
 JAP_diplomacy.30.a: "Acepta el retraso y empuja hacia la Luna"
 JAP_diplomacy.31.t: "Kaguya atrae a la superficie lunar"
 JAP_diplomacy.31.d: "Después de años de revisiones de diseño, actualizaciones de comunicaciones y dilaciones difíciles, la misión Kaguya finalmente ha tenido éxito. El hardware japonés ahora opera en y alrededor de la Luna, volviendo imágenes de alta resolución y datos científicos invaluables. Los logros muestran las capacidades de alta tecnología de Japón y abre nuevos caminos para el desarrollo satelital, la exploración en el espacio profundo y aplicaciones espaciales estratégicas."
 JAP_diplomacy.31.a: "Celebrar a Kaguya como un triunfo de la tecnología japonesa"
 jap_kaguya_satellite_invest_tt: "§GPorque invertimos en un mejor diseño de la nave espacial, ganamos:§!"
 jap_kaguya_rocketry_invest_tt: "§GPorque invertimos en mejores comunicaciones con la nave espacial, ganamos:§!"
 JAP_diplomacy.32.t: "Anomalia del software de orientación"
 JAP_diplomacy.32.d: "Los ingenieros de la misión Marte informan de una anomalía recurrente en el software de orientación. Si bien la cuestión todavía no es crítica, podría agravarse en graves errores de navegación si no se ha abordado. Arreglarlo a fondo extraerá recursos de otros proyectos y puede afectar el calendario general."
 JAP_diplomacy.32.a: "Desviar los recursos y resolverlos adecuadamente"
 JAP_diplomacy.32.b: "Aceptar demoras y parchearlo gradualmente"
 JAP_diplomacy.33.t: "Nombrando la Colonia Marte"
 JAP_diplomacy.33.d: "Japón ha asegurado una posición permanente en Marte. A medida que los hábitats entran en línea y las primeras tripulaciones a largo plazo se asientan, se espera una decisión simbólica: el nombre oficial y el carácter de la colonia."
 JAP_diplomacy.33.a: "'Amaterasu', un símbolo radiante de la unidad"
 JAP_diplomacy.33.b: "'Kagutsuchi', una falsificación industrial"
 JAP_diplomacy.33.c: "«Tsukuyomi», un observatorio tranquilo en la oscuridad"
 JAP_diplomacy.33.e: "'Susanoo', una frontera marcial tocada por la tormenta"
 JAP_diplomacy.68.t: "Japón exige Sakhalin"
 JAP_diplomacy.68.d: "El Japón ha formulado una demanda oficial para el regreso de Sakhalin. Aceptar desactivaría las tensiones, pero se consideraría una concesión humillante."
 JAP_diplomacy.68.a: "Aceptar la demanda"
 JAP_diplomacy.68.b: "Rechazarlo de inmediato"
 JAP_diplomacy.69.t: "Sakhalin regresó"
 JAP_diplomacy.69.d: "Moscú ha aceptado nuestra demanda. Sakhalin está ahora bajo administración japonesa. El gobierno presentará esto como prueba de que el orden imperial está regresando."
 JAP_diplomacy.69.a: "Una corrección histórica"
 JAP_diplomacy.70.t: "Rusia rechaza"
 JAP_diplomacy.70.d: "Moscú ha rechazado nuestra demanda de Sakhalin. Podemos tragar el insulto por ahora, probar Rusia con un conflicto fronterizo limitado, o comprometernos plenamente a la guerra."
 JAP_diplomacy.70.a: "Párate ahora."
 JAP_diplomacy.70.b: "Lanzar una guerra fronteriza"
 JAP_diplomacy.70.c: "Declara la guerra total"
 JAP_diplomacy.71.t: "Japón exige a las Islas del Norte del Kuril"
 JAP_diplomacy.71.d: "El Japón ha formulado una demanda oficial para el regreso de las Islas del Norte del Kuril. Aceptar desactivaría las tensiones, pero se consideraría una concesión humillante."
 JAP_diplomacy.71.a: "Aceptar la demanda"
 JAP_diplomacy.71.b: "Rechazarlo de inmediato"
 JAP_diplomacy.72.t: "Las Islas del Kuril Norte regresaron"
 JAP_diplomacy.72.d: "Moscú ha aceptado nuestra demanda. Las Islas Kuril del Norte están ahora bajo administración japonesa. El gobierno presentará esto como prueba de que el orden imperial está regresando."
 JAP_diplomacy.72.a: "Una corrección histórica"
 JAP_diplomacy.73.t: "Rusia rechaza"
 JAP_diplomacy.73.d: "Moscú ha rechazado nuestra demanda por las Islas Kuril del Norte. Podemos tragar el insulto por ahora, probar Rusia con un conflicto fronterizo limitado, o comprometernos plenamente a la guerra."
 JAP_diplomacy.73.a: "Párate ahora."
 JAP_diplomacy.73.b: "Lanzar una guerra fronteriza"
 JAP_diplomacy.73.c: "Declara la guerra total"
 JAP_diplomacy.74.t: "Japón exige a las Islas Kuril del Sur"
 JAP_diplomacy.74.d: "El Japón ha formulado una demanda oficial para el regreso de las Islas Kuril del Sur. Aceptar desactivaría las tensiones, pero se consideraría una concesión humillante."
 JAP_diplomacy.74.a: "Aceptar la demanda"
 JAP_diplomacy.74.b: "Rechazarlo de inmediato"
 JAP_diplomacy.75.t: "Las Islas del Kuril Sur devolvieron"
 JAP_diplomacy.75.d: "Moscú ha aceptado nuestra demanda. Las Islas Kuril del Sur están ahora bajo administración japonesa. El gobierno presentará esto como prueba de que el orden imperial está regresando."
 JAP_diplomacy.75.a: "Una corrección histórica"
 JAP_diplomacy.76.t: "Rusia rechaza"
 JAP_diplomacy.76.d: "Moscú ha rechazado nuestra demanda por las Islas Kuril del Sur. Podemos tragar el insulto por ahora, probar Rusia con un conflicto fronterizo limitado, o comprometernos plenamente a la guerra."
 JAP_diplomacy.76.a: "Párate ahora."
 JAP_diplomacy.76.b: "Lanzar una guerra fronteriza"
 JAP_diplomacy.76.c: "Declara la guerra total"
 JAP_diplomacy.77.t: "Tokio propone un arreglo"
 JAP_diplomacy.77.d: "Con las Islas Kuril y Sakhalin ahora bajo control japonés, Tokio se ha movido rápidamente para convertir los logros del campo de batalla en un acuerdo formal. Los diplomáticos japoneses se han acercado a Moscú con una propuesta para poner fin al conflicto, argumentando que la guerra ya ha decidido el asunto y que los combates posteriores sólo prolongarían lo inevitable.\nSu oferta es directa: la paz a cambio de Rusia reconoce formalmente el control japonés sobre las Islas Kuril y Sakhalin. En opinión de Tokio, es un arreglo práctico destinado a estabilizar la región y evitar que la guerra se intensifique aún más. Ahora la decisión está con nosotros. Aceptar la nueva realidad y poner fin a la guerra, o rechazar la propuesta y continuar la lucha."
 JAP_diplomacy.77.a: "Aceptar el acuerdo."
 JAP_diplomacy.77.b: "Rechazarlo. La guerra continúa."
 JAP_diplomacy.78.t: "Solución aceptada"
 JAP_diplomacy.78.d: "La propuesta es aceptada, y las armas comienzan a caer en silencio. Se dictan órdenes de separación, reabrir los canales diplomáticos y la guerra se reduce a un conjunto de cláusulas y coordenadas.\n\nLas islas del Norte se transfieren como precio de paz, y cada lado debe ahora vender el resultado a su propio público. La campaña termina, pero la memoria no lo hará."
 JAP_diplomacy.78.a: "Así sea. Deja que la tinta sustituya la sangre."
 JAP_diplomacy.79.t: "Solución rechazada"
 JAP_diplomacy.79.d: "La respuesta del otro lado es un duro no. No habrá firmas, ningún reconocimiento y ninguna pausa para respirar.\n\nTokio ha malinterpretado nuestra resolución, y el conflicto continuará hasta que una parte ya no pueda sostenerla. Si la paz ha de venir, será forzada."
 JAP_diplomacy.79.a: "Entonces peleamos."
 JAP_diplomacy.80.t: "Moscú ve un camino hacia fuera"
 JAP_diplomacy.80.d: "Después de los avances de Japón en el norte, diplomáticos rusos señalan la voluntad de poner fin a los combates antes de que la situación empeore. El mensaje es pragmático: detener la hemorragia, congelar las líneas y evitar que la guerra consuma más recursos de lo que cualquier lado puede justificar.\n\nEl ofrecimiento es una paz directa, el comercio siguió aumentando para poner fin de inmediato a las hostilidades. Debemos decidir si aceptar un arreglo imperfecto o presionar nuestra ventaja."
 JAP_diplomacy.80.a: "Acepta la paz."
 JAP_diplomacy.80.b: "No. Presionamos."
 JAP_diplomacy.81.t: "Tokio acepta la paz"
 JAP_diplomacy.81.d: "Japón está de acuerdo con los términos, eligiendo poner fin a la guerra en lugar de ampliarla. La decisión es impopular en partes del país, y el costo se siente como resbalones de confianza y las preguntas públicas por qué los combates comenzaron en absoluto.\n\nSe declara una paz blanca y se ejecutan las concesiones territoriales. El campo de batalla calla, pero el daño político va a disminuir."
 JAP_diplomacy.81.a: "Vamos a tragar esto, y perdurar."
 JAP_diplomacy.82.t: "Tokio se niega"
 JAP_diplomacy.82.d: "Japón rechaza la propuesta y las señales de que no aceptará un acuerdo escrito de debilidad. Los combates continuarán, y las estacas se levantan cada semana que pasa.\n\nSi la paz ha de venir, no será ofrecida. Será tomada."
 JAP_diplomacy.82.a: "So be it."
 JAP_unlock_sikhalin_raid_tt: "Desbloquea §YFuerzas Especiales Raid§! en §Y$STATE_691$§!"
 JAP_diplomacy.83.t: "Victoria en el sur de Kurils"
 JAP_diplomacy.83.d: "Las fuerzas japonesas han prevalecido en los Kurils del Sur, empujando a las unidades rusas de regreso y apoderando el control del terreno disputado. El resultado es pequeño en el mapa, pero alto en su mensaje: Japón puede tomar lo que reclama y mantenerlo bajo presión.\n\nLa bandera subió, la guarnición cava y Tokio se prepara para el siguiente movimiento. Moscú no olvidará esto."
 JAP_diplomacy.83.a: "Aseguren las islas."
 JAP_diplomacy.84.t: "Derrota en el sur de Kurils"
 JAP_diplomacy.84.d: "El enfrentamiento fronterizo en el sur de Kurils se ha enfrentado a nosotros. La resistencia rusa se mantuvo firme, y nuestras fuerzas fueron obligadas a retirarse bajo fuego, dejando sin resolver la cuestión de la soberanía y nuestro liderazgo bajo escrutinio.\n\nHemos aprendido lecciones dolorosas en el proceso. El próximo intento será mejor planificado, mejor suministrado y más difícil de detener."
 JAP_diplomacy.84.a: "Aprende del revés."
 JAP_diplomacy.85.t: "Retroceder en los Kurils del Sur"
 JAP_diplomacy.85.d: "Las fuerzas rusas han fracasado en mantener a los kuríes del sur frente a un determinado empuje japonés. La pérdida táctica inmediata es fuerte, y la señal política es más aguda: la frontera es vulnerable, y el oponente está dispuesto a pagar para cambiarla.\n\nMoscú tendrá que decidir si escalar o aceptar un nuevo hecho humillante sobre el terreno."
 JAP_diplomacy.85.a: "A bitter lesson."
 JAP_diplomacy.86.t: "Kurils del Sur Aseguró"
 JAP_diplomacy.86.d: "Las tropas rusas han ganado el choque fronterizo y han asegurado a los Kurils del Sur, volviendo a las unidades japonesas y restableciendo el control a lo largo de la línea. La operación demuestra la disposición y la capacidad de castigar las incursiones rápidamente.\n\nTokio puede llamarlo un retroceso temporal, pero el mensaje está claro. Las islas no serán tomadas baratamente."
 JAP_diplomacy.86.a: "Mantén la línea."
 JAP_diplomacy.87.t: "Victoria en los Kurils del Norte"
 JAP_diplomacy.87.d: "Japón ha logrado un avance decisivo en los Kurils del Norte, obligando a las unidades rusas a retirarse y dejar las islas bajo nuestro control. La operación demuestra que incluso terreno remoto puede ser incautado cuando la planificación, el tiempo y resolver alineado.\n\nLa ocupación comienza inmediatamente. Los suministros fluyen, las defensas se levantan y la frontera norte es reescrita por acción."
 JAP_diplomacy.87.a: "Sube y prepárate."
 JAP_diplomacy.88.t: "Derrota en el norte de Kurils"
 JAP_diplomacy.88.d: "Los Kurils del Norte se han enfrentado a nuestro ataque. Los combates fueron duros, las condiciones peores, y las fuerzas rusas lograron anular nuestro avance y forzar un retiro.\n\nRegresamos con experiencia pagada en sangre y fatiga. La próxima vez, no llegaremos sin preparación."
 JAP_diplomacy.88.a: "Nos adaptaremos."
 JAP_diplomacy.89.t: "Pérdida en los Kurils del Norte"
 JAP_diplomacy.89.d: "Rusia ha sido expulsada de posiciones en los Kurils del Norte después de una exitosa operación japonesa. La pérdida no es sólo territorial, es psicológica, señalando que la distancia y el tiempo ya no son defensas confiables.\n\nSe exigirá una respuesta, pero la represalia conlleva sus propios riesgos. La situación se está deteriorando rápidamente."
 JAP_diplomacy.89.a: "Esto no puede soportarse."
 JAP_diplomacy.90.t: "Norte Kurils Held"
 JAP_diplomacy.90.d: "Las fuerzas rusas han derrotado la incursión y han mantenido a los Kuril del Norte, repeliendo las unidades japonesas y restableciendo el control en condiciones difíciles. La defensa ha agudizado la doctrina y aumentado la confianza en toda la cadena de mando.\n\nSi Japón quiere estas islas, tendrá que comprometerse mucho más que un choque fronterizo."
 JAP_diplomacy.90.a: "Mantener la preparación."
 JAP_diplomacy.91.t: "Rusia responde a Sakhalin"
 JAP_diplomacy.91.d: "Los movimientos japoneses en Sakhalin han desencadenado una respuesta inmediata de Moscú. El liderazgo ruso enmarca la acción como un desafío directo a la soberanía y señala que no tolerará nuevos avances sin consecuencias.\n\nLa crisis ahora sube a dos caminos: la intensificación de la guerra abierta, o la presión coercitiva mediante medidas económicas y restricciones marítimas. De cualquier manera, la temperatura ha aumentado más allá del punto de la diplomacia tranquila."
 JAP_diplomacy.91.a: "Esto será una guerra."
 JAP_diplomacy.91.b: "Estrangularlos con embargo y bloqueo."
 JAP_diplomacy.92.t: "Rusia responde a la toma de Sakhalin"
 JAP_diplomacy.92.d: "Sakhalin ha cambiado de manos, y Moscú debe ahora decidir cómo responder a una humillación tan cerca de casa. La guerra sería costosa, pero no responder invitaría a nuevas pérdidas y debilitaría la autoridad del Estado.\n\nRusia puede elegir la escalada y tratar de revertir el resultado por la fuerza, o aceptar una paz temporal que ponga fin a los combates mientras exige el regreso de Sakhalin como precio para detenerse. La decisión definirá la siguiente fase del conflicto."
 JAP_diplomacy.92.a: "Lo retomaremos por la fuerza."
 JAP_diplomacy.92.b: "Forzar un acuerdo. Sakhalin debe ser devuelto."
 JAP_diplomacy.94.t: "Tokio exige un Protectorado"
 JAP_diplomacy.94.d: "Una nota formal llega desde Japón, despojada de la diplomacia y pesada con intención. Seúl se ofrece una opción presentada como estabilidad: aceptar la supervisión japonesa sobre asuntos de política exterior y seguridad, alinear las instituciones a la dirección de Tokio, y evitar un enfrentamiento destructivo.\n\nEl mensaje está claro. Japón ya no pide cooperación, está dictando términos. El rechazo será tratado como desafío, y el desafío invitará consecuencias."
 JAP_diplomacy.94.a: "No tenemos otra opción que aceptar."
 JAP_diplomacy.94.b: "Rechazar. Corea no se inclinará."
 JAP_diplomacy.95.t: "Corea del Sur"
 JAP_diplomacy.95.d: "Seúl acepta los términos, eligiendo la supervivencia sobre la soberanía. Los acuerdos se firman bajo presión, llegan los asesores y la postura externa del estado se dobla en el diseño estratégico de Japón.\n\nLa guerra termina, pero comienza una lucha diferente. Corea permanece en el mapa, pero su dirección ya no es suya."
 JAP_diplomacy.95.a: "Establezca el protectorado."
 JAP_diplomacy.96.t: "Corea del Sur desafia Tokio"
 JAP_diplomacy.96.d: "Seúl rechaza el ultimátum y declara que su soberanía no es negociable. La negativa convierte la crisis de la coacción en confrontación, y Tokio ahora tiene todos los pretextos que necesita para reclamar la cuestión sólo puede resolverse por la fuerza.\n\nSi el Japón quería una presentación, ha recibido un reto en su lugar."
 JAP_diplomacy.96.a: "Entonces impondrámos nuestra voluntad."
 JAP_diplomacy.97.t: "Tokio emite un Ultimatum a Pyongyang"
 JAP_diplomacy.97.d: "Japón ha entregado un ultimátum a Pyongyang, ofreciendo un futuro de contención bajo supervisión o un futuro de ruina bajo bombardeo. Los términos son contundentes: entregar la política exterior y la autonomía estratégica a la dirección de Tokio, aceptar acuerdos de seguridad supervisados y someterse a un marco diseñado para evitar que el Norte vuelva a ser una amenaza.\n\nPara el régimen, esto es humillación. Para Japón, es la gestión del riesgo. La pregunta es si Pyongyang elige supervivencia o desafío."
 JAP_diplomacy.97.a: "Aceptar. Preserve el estado a cualquier costo."
 JAP_diplomacy.97.b: "Rechazar. No nos presentaremos."
 JAP_diplomacy.98.t: "Pyongyang rinde"
 JAP_diplomacy.98.d: "Contra todas las expectativas, el Norte acepta los términos. El régimen mantiene sus símbolos, pero su libertad de acción se rompe cuando la supervisión japonesa reforma fronteras, seguridad y relaciones exteriores.\n\nLa lucha termina, y la mitad norte de la península se convierte en un búfer controlado. Una amenaza es neutralizada, y Tokio gana una palanca que no se liberará fácilmente."
 JAP_diplomacy.98.a: "Establezca el protectorado."
 JAP_diplomacy.99.t: "Pyongyang Defies Tokyo"
 JAP_diplomacy.99.d: "Pyongyang rechaza el ultimátum y elige el desafío, apostando que el miedo y la escalada protegerán al régimen. La negativa convierte la crisis en una prueba de voluntades, y Tokio ahora tiene la justificación para afirmar que el Norte sólo puede ser sometido por la fuerza.\n\nLos frenos de la península para la guerra. El siguiente mensaje no será una nota, será fuego."
 JAP_diplomacy.99.a: "Entonces terminaremos la amenaza nosotros mismos."
 JAP_diplomacy.101.t: "Tokio exige la presentación de Taiwán"
 JAP_diplomacy.101.d: "Japón ha entregado una demanda directa a Taipei: aceptar un marco protectorado y colocar la coordinación de política exterior y defensa bajo la supervisión de Tokio, o enfrentar el aislamiento y la fuerza. La oferta se envasa como seguridad y estabilidad, prometiendo protección contra amenazas externas a cambio de obediencia política.\n\nDetrás del lenguaje formal es un simple mensaje. La isla es demasiado importante para ser independiente, y Japón tiene la intención de decidir su futuro."
 JAP_diplomacy.101.a: "Aceptar los términos. Evite la catástrofe."
 JAP_diplomacy.101.b: "Rechazarlos. Taiwán no se someterá."
 JAP_diplomacy.102.t: "Taipei Acepta"
 JAP_diplomacy.102.d: "Taiwán acepta el ultimátum, eligiendo la supervivencia y la continuidad sobre un conflicto abierto. Nuevos acuerdos vinculan su postura externa al Japón, llegan los asesores y la adopción de decisiones estratégicas se desplaza silenciosamente hacia Tokio.\n\nLa guerra termina, pero la soberanía se reduce a lo que el protector permite. La isla permanece, pero su dirección ya no es totalmente suya."
 JAP_diplomacy.102.a: "Establezca el protectorado."
 JAP_diplomacy.103.t: "Taipei se niega"
 JAP_diplomacy.103.d: "Taiwán rechaza la demanda de Japón y se niega a la autonomía comercial para una promesa de protección. La decisión convierte la presión diplomática en una crisis de fuerza, y Tokio tiene ahora la justificación para argumentar que la isla sólo puede ser asegurada por conquista.\n\nEl estrecho se convierte en una línea de fallas. El siguiente paso no será la negociación, será la movilización."
 JAP_diplomacy.103.a: "Entonces tomaremos lo que necesitamos."
 JAP_diplomacy.105.t: "Tokio exige un Protectorado Filipino"
 JAP_diplomacy.105.d: "Japón ha emitido una demanda a Manila que deja poco espacio para el malentendido. Aceptar un marco protectorado, alinear la política exterior y la planificación de defensa con Tokio, y permitir la supervisión japonesa de los arreglos clave de seguridad, o enfrentar las consecuencias del rechazo.\n\nLa oferta se presenta como estabilidad y protección, pero su propósito es el control de los carriles marinos y la puerta de entrada entre océanos. Filipinas debe elegir entre la presentación y el enfrentamiento."
 JAP_diplomacy.105.a: "Aceptar. Preserve a la nación de destrucción."
 JAP_diplomacy.105.b: "Rechazar. No seremos gobernados de Tokio."
 JAP_diplomacy.106.t: "Manila Submits"
 JAP_diplomacy.106.d: "El gobierno filipino acepta los términos de Japón. Los acuerdos están firmados, los asesores llegan y la postura externa del país se dobla en el diseño marítimo de Japón.\n\nLa lucha termina, pero el costo es soberanía. El archipiélago permanece, pero sus decisiones estratégicas se tomarán con Tokio mirando por encima de cada hombro."
 JAP_diplomacy.106.a: "Establezca el protectorado."
 JAP_diplomacy.107.t: "Manila Defies Tokyo"
 JAP_diplomacy.107.d: "Filipinas rechaza el ultimátum y se niega a cambiar la independencia por una promesa de protección. La negativa convierte la coacción de Japón en una prueba de fuerza, y Tokio ahora tiene todas las excusas para reclamar que el archipiélago debe ser asegurado por armas.\n\nLos carriles marinos se ajustan, las flotas comienzan a postura, y la región frena para la guerra. El próximo paso no será diplomático."
 JAP_diplomacy.107.a: "Entonces tomaremos el archipiélago."
 JAP_diplomacy.109.t: "El Estrecho Ultimatum"
 JAP_diplomacy.109.d: "Una nota japonesa llega con el tono calmado de la inevitabilidad. Kuala Lumpur se ofrece un arreglo protectorado que vincula la política exterior y la coordinación de seguridad a la dirección de Tokio, justificado como el precio de la estabilidad en una región donde los carriles marinos y chokepoints deciden sobrevivencia.\n\nEl mensaje no es una petición. Japón tiene la intención de ordenar el Estrecho, y se espera que Malaya cumpla. La aceptación promete protección, la negativa invita al peso total de la coacción marítima."
 JAP_diplomacy.109.a: "Aceptar. No podemos luchar contra la marea."
 JAP_diplomacy.109.b: "Rechazar. Nuestra soberanía no está en venta."
 JAP_diplomacy.110.t: "Kuala Lumpur se inclina ante el Sol Naciente"
 JAP_diplomacy.110.d: "Malasia acepta los términos, negociando la independencia estratégica para la supervivencia inmediata. Se firman acuerdos, llegan misiones de enlace y Tokio gana las claves de los pasillos que conectan dos océanos.\n\nLa guerra termina, pero el costo es claro. Malaya permanece intacta, pero su postura externa ahora se mueve dentro de la sombra de Japón."
 JAP_diplomacy.110.a: "Establezca el protectorado."
 JAP_diplomacy.111.t: "Malaya rechaza la orden de los estrechos"
 JAP_diplomacy.111.d: "Malasia rechaza el ultimátum y se niega a dejar que su futuro sea dictado desde Tokio. La decisión convierte la presión de Japón en una confrontación sobre el corredor marítimo más valioso de la región.\n\nTokio no tolerará el desafío en los estrechos. Si Malaya no se presentará por tratado, el Japón solicitará su presentación por la fuerza."
 JAP_diplomacy.111.a: "Entonces tomaremos los estrechos."
 JAP_diplomacy.113.t: "El archipiélago Edict"
 JAP_diplomacy.113.d: "Tokio ha emitido una demanda a Yakarta dirigida al corazón de la independencia de Indonesia. La propuesta es un marco protectorado que coloca la política exterior y la seguridad estratégica bajo supervisión japonesa, justificada como la única manera de garantizar la estabilidad en las cadenas isleñas que unen dos océanos juntos.\n\nEl lenguaje es educado, pero la intención es absoluta. Japón quiere que el archipiélago indonesio sea un corredor controlado, no un socio soberano. La aceptación significa seguridad bajo una sombra, la negativa significa que la sombra se convierte en una tormenta."
 JAP_diplomacy.113.a: "Aceptar. No podemos soportar un estrangulamiento naval."
 JAP_diplomacy.113.b: "Rechazar. Indonesia no será mandada."
 JAP_diplomacy.114.t: "Yakarta acepta el Edicto"
 JAP_diplomacy.114.d: "Indonesia acepta los términos y se somete a una nueva realidad marítima. Las misiones japonesas llegan a supervisar la coordinación de seguridad, los derechos de bastión y la alineación externa, convirtiendo el archipiélago en un corredor gestionado dentro de la esfera estratégica de Tokio.\n\nLa guerra termina, pero la independencia se reduce a lo que está permitido. Las islas siguen siendo indonesios en nombre, pero su dirección ahora está limitada por el poder japonés."
 JAP_diplomacy.114.a: "Establezca el protectorado."
 JAP_diplomacy.115.t: "Indonesia desafia al archipiélago Edicto"
 JAP_diplomacy.115.d: "Yakarta rechaza la demanda de Japón y se niega a intercambiar soberanía por promesas de estabilidad. La negativa convierte la presión en confrontación, y Tokio ahora trata a la independencia indonesia como un obstáculo para ser removida en lugar de un hecho que se respete.\n\nLos mares alrededor del archipiélago crecen tensos. Si Indonesia no cede por tratado, el Japón tratará de forzar el cumplimiento por las armas."
 JAP_diplomacy.115.a: "Entonces tomaremos los pasillos."
 JAP_diplomacy.117.t: "La elección de Tonkin"
 JAP_diplomacy.117.d: "Tokio ha entregado una demanda a Hanoi diseñado para encerrar Vietnam en el orden marítimo de Japón. La oferta es un arreglo protectorado en todos menos nombre: alinear la política exterior, aceptar la supervisión de seguridad japonesa y permitir el acceso estratégico que convierte la costa de Vietnam en una extensión del alcance de Japón.\n\nEl mensaje está enmarcado como protección de los depredadores más grandes, pero también es una correa. Vietnam debe decidir si aceptar la supervivencia bajo restricción, o resistir e invitar una guerra que se combatirá a lo largo de sus costas."
 JAP_diplomacy.117.a: "Aceptar. Nos doblaremos, por ahora."
 JAP_diplomacy.117.b: "Rechazar. Vietnam no estará atado."
 JAP_diplomacy.118.t: "Hanoi acepta los Términos de Tokio"
 JAP_diplomacy.118.d: "Vietnam acepta el ultimátum. Se firman acuerdos, llegan oficiales de enlace y Japón ejerce una influencia decisiva sobre la alineación externa de Vietnam y la seguridad costera.\n\nLa guerra termina, pero la independencia se reduce. Vietnam sigue siendo, sin embargo su postura estratégica ahora se mueve dentro de un marco escrito en Tokio."
 JAP_diplomacy.118.a: "Establezca el protectorado."
 JAP_diplomacy.119.t: "Hanoi rechaza la elección de Tonkin"
 JAP_diplomacy.119.d: "Vietnam rechaza la demanda de Japón y se niega a la soberanía comercial por una promesa de seguridad. La negativa convierte la coacción en confrontación, y Tokio ahora trata a Vietnam como una barrera que debe ser eliminada de su diseño regional.\n\nLa costa se convierte en primera línea. Si Vietnam no se presenta por tratado, el Japón solicitará su presentación por la fuerza."
 JAP_diplomacy.119.a: "Entonces tomaremos la costa."
 JAP_diplomacy.121.t: "El Mekong Ultimatum"
 JAP_diplomacy.121.d: "Una delegación japonesa llega con una propuesta que lee menos como la diplomacia y más como un veredicto. Camboya se ofrece protección bajo la supervisión de Tokio, con coordinación política exterior y arreglos de seguridad colocados dentro del marco regional de Japón.\n\nEl campo es estabilidad, inversión y seguridad de los vecinos más fuertes. La realidad es subordinación. Phnom Penh debe elegir si aceptar un futuro vigilado o arriesgarse a convertirse en un campo de batalla por negarse."
 JAP_diplomacy.121.a: "Aceptar. La supervivencia viene primero."
 JAP_diplomacy.121.b: "Rechazar. Camboya no se presentará."
 JAP_diplomacy.122.t: "Phnom Penh Acepta"
 JAP_diplomacy.122.d: "Camboya acepta los términos y cede la autonomía estratégica para evitar una guerra que no puede ganar. Nuevos acuerdos vinculan al estado a la dirección de Japón, y los asesores de Tokio se mueven rápidamente para asegurar ministerios clave y puntos de acceso.\n\nLa lucha termina antes de que comience. Camboya sigue siendo soberana en nombre, pero su camino está ahora limitado por el poder japonés."
 JAP_diplomacy.122.a: "Establezca el protectorado."
 JAP_diplomacy.123.t: "Camboya rechaza el Mekong Ultimatum"
 JAP_diplomacy.123.d: "Phnom Penh rechaza la demanda de Japón y se niega a entregar su futuro a la supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata a Camboya como un eslabón débil que debe ponerse en línea.\n\nLa diplomacia ha fracasado. Si Camboya no acepta el marco, el Japón tratará de imponerlo por la fuerza."
 JAP_diplomacy.123.a: "Entonces vamos a obligar la obediencia."
 JAP_diplomacy.125.t: "Directiva Mekong Hinterland"
 JAP_diplomacy.125.d: "Japón ha emitido una demanda a Vientiane que pretende asegurar la profundidad tranquila detrás de la costa. La propuesta es un marco protectorado que une a Laos a la dirección estratégica de Tokio, colocando la política exterior y la coordinación de seguridad bajo supervisión japonesa.\n\nLa oferta se presenta como desarrollo y protección. El significado es claro: pasillos, ríos y fronteras se gestionarán para servir la esfera más amplia de Japón. Laos debe decidir si aceptar la directiva o apostar por la resistencia."
 JAP_diplomacy.125.a: "Aceptar. No podemos estar solos."
 JAP_diplomacy.125.b: "Rechazar. Laos no será dictada."
 JAP_diplomacy.126.t: "Vientiane acepta"
 JAP_diplomacy.126.d: "Laos acepta los términos de Japón, eligiendo supervivencia y estabilidad en una guerra que no puede permitirse. Se firman acuerdos, se establecen oficinas de coordinación y Laos está doblado al marco regional de Tokio como un interior controlado.\n\nLa lucha termina, pero la autonomía se reduce. Laos sigue siendo, pero sus opciones estratégicas ahora se mueven dentro de los límites establecidos por el Japón."
 JAP_diplomacy.126.a: "Establezca el protectorado."
 JAP_diplomacy.127.t: "Laos rechaza la Directiva"
 JAP_diplomacy.127.d: "Vientiane rechaza la demanda de Japón y se niega a entregar su futuro a la supervisión externa. La negativa convierte la coacción en confrontación, y Tokio ahora trata a Laos como un obstáculo para el control de corredores más que un socio para ser juzgado.\n\nSi Laos no acepta el marco por tratado, el Japón tratará de imponerlo por la fuerza."
 JAP_diplomacy.127.a: "Entonces los llevaremos a talón."
 JAP_diplomacy.129.t: "El ancla sur Ultimatum"
 JAP_diplomacy.129.d: "Tokio ha entregado un ultimátum a Canberra que trata a Australia no como un continente lejano, sino como la piedra angular del Pacífico meridional. Los términos son espeluznantes: aceptar un marco protectorado, alinear la política exterior y la planificación de defensa con Japón, y permitir los acuerdos de base y acceso que bloquearían el Pacífico Sur bajo el alcance de Tokio.\n\nLa oferta está vestida como estabilidad y seguridad garantizada. La realidad es una presentación estratégica. Australia debe decidir si aceptar la vida bajo la sombra japonesa, o prepararse para oponerse al océano mismo."
 JAP_diplomacy.129.a: "Aceptar. No podemos ganar una guerra para el Pacífico."
 JAP_diplomacy.129.b: "Rechazar. Australia no se inclinará."
 JAP_diplomacy.130.t: "Canberra acepta los términos del anclaje"
 JAP_diplomacy.130.d: "Australia acepta el ultimátum de Japón, escogiendo la supervivencia inmediata sobre una guerra continental que no puede arriesgar. Se firman acuerdos, se otorga acceso estratégico y Japón obtiene el ancla sur que pretendía dominar el océano más amplio.\n\nLas armas caen en silencio, pero el equilibrio del Pacífico cambia de noche a la mañana. Australia sigue en el mapa, pero sus decisiones estratégicas se mueven ahora dentro de los límites establecidos en Tokio."
 JAP_diplomacy.130.a: "Establezca el protectorado."
 JAP_diplomacy.131.t: "Australia rechaza el Ultimatum"
 JAP_diplomacy.131.d: "Canberra rechaza la demanda de Japón y se niega a entregar la independencia del continente a un mandato extranjero. La negativa convierte la presión de Tokio en un desafío directo, y Japón ahora enmarca a Australia como el obstáculo final a una orden del Pacífico bajo su control.\n\nUn concurso para el océano es inevitable. Si Australia no acepta el marco por tratado, el Japón intentará imponerlo por la fuerza."
 JAP_diplomacy.131.a: "Entonces aseguraremos el sur con armas."
 JAP_diplomacy.133.t: "La demanda de la línea Tasman"
 JAP_diplomacy.133.d: "Tokio ha entregado una demanda a Wellington para cerrar el último flanco abierto en el Pacífico Sur. La propuesta es un marco protectorado que une la postura de política exterior y defensa de Nueva Zelanda a la dirección de Japón, justificado como el costo de estabilidad en un océano que está siendo reorganizado por la fuerza.\n\nEl lenguaje habla de protección y asociación, pero la estructura es control. Nueva Zelandia debe elegir entre una paz limitada bajo la sombra japonesa o una guerra por la independencia en todo el mar."
 JAP_diplomacy.133.a: "Aceptar. Perduraremos, y sobreviviremos."
 JAP_diplomacy.133.b: "Rechazar. No seremos absorbidos."
 JAP_diplomacy.134.t: "Wellington acepta la línea Tasman"
 JAP_diplomacy.134.d: "Nueva Zelanda acepta los términos de Japón, negociando la autonomía estratégica para el fin de las hostilidades. Se firman acuerdos, se establecen acuerdos de acceso y Tokio obtiene un puesto seguro al sur para dar forma al océano más amplio.\n\nLa guerra termina, pero la independencia se reduce. Nueva Zelandia sigue existiendo, pero su postura externa se mueve ahora dentro de los límites establecidos en Tokio."
 JAP_diplomacy.134.a: "Establezca el protectorado."
 JAP_diplomacy.135.t: "Wellington rechaza la demanda"
 JAP_diplomacy.135.d: "Nueva Zelanda rechaza el ultimátum de Japón y se niega a entregar su futuro a un mandato extranjero. La negativa convierte la presión en confrontación, y Tokio ahora trata la independencia de Wellington como una amenaza para su perímetro sur.\n\nEl Pacífico se endurece en las líneas delanteras. Si Nueva Zelandia no acepta el marco por tratado, el Japón intentará imponerlo por la fuerza."
 JAP_diplomacy.135.a: "Entonces tomaremos el puesto de avanzada del sur."
 JAP_diplomacy.137.t: "La puerta de Irrawaddy Ultimatum"
 JAP_diplomacy.137.d: "Tokio ha formulado una demanda a Naypyidaw encaminada a asegurar a Myanmar como el puente terrestre entre los océanos. Los términos equivalen a un marco protectorado: alinear la política exterior con Japón, aceptar la supervisión de seguridad japonesa y conceder el acceso necesario para controlar los corredores desde la bahía de Bengal hasta el sudeste asiático.\n\nLa oferta se presenta como estabilidad y desarrollo. La verdad es captura estratégica. Myanmar debe decidir si aceptar una paz controlada o enfrentar una guerra que convertirá sus puertas en campos de batalla."
 JAP_diplomacy.137.a: "Aceptar. No podemos soportar esta presión."
 JAP_diplomacy.137.b: "Rechazar. No seremos reducidos a un pasillo."
 JAP_diplomacy.138.t: "Myanmar acepta los términos de la puerta"
 JAP_diplomacy.138.d: "Myanmar acepta el ultimátum de Japón, negociando la autonomía estratégica para poner fin a las hostilidades y la promesa del orden. Se firman acuerdos, llegan misiones de enlace y Japón obtiene una mano decisiva sobre la alineación externa y la postura de seguridad de Myanmar.\n\nLa lucha termina, pero el precio es soberanía. Myanmar sigue siendo, sin embargo sus puertas sirven ahora un diseño regional escrito en Tokio."
 JAP_diplomacy.138.a: "Establezca el protectorado."
 JAP_diplomacy.139.t: "Myanmar rechaza el Ultimatum"
 JAP_diplomacy.139.d: "Naypyidaw rechaza la demanda de Japón y se niega a entregar su futuro a la supervisión externa. La negativa convierte la presión en confrontación, y Tokio ahora enmarca a Myanmar como un obstáculo para el control de corredores que debe ponerse en línea.\n\nSi Myanmar no acepta el marco por tratado, el Japón tratará de imponerlo por la fuerza. La puerta estará asegurada de una manera u otra."
 JAP_diplomacy.139.a: "Entonces tomaremos la puerta."
 JAP_diplomacy.141.t: "Las tierras altas del norte Ultimatum"
 JAP_diplomacy.141.d: "Japón ha centrado su atención en Kachin, las tierras altas del norte que controlan los pases, recursos y enfoques de la región más amplia. La demanda de Tokio se presenta como protección y reconocimiento, pero la estructura es un protectorado: alinearse externamente con Japón, aceptar supervisión de seguridad y permitir el acceso estratégico que asegura la frontera.\n\nPara Kachin, esta es una opción entre la autonomía en nombre y la aniquilación en la práctica. La aceptación ofrece un escudo. Refusal invita a una guerra en montañas y aldeas."
 JAP_diplomacy.141.a: "Aceptar. Necesitamos un patrón para sobrevivir."
 JAP_diplomacy.141.b: "Rechazar. No cambiaremos a un maestro por otro."
 JAP_diplomacy.143.t: "Kachin acepta la protección japonesa"
 JAP_diplomacy.143.d: "Kachin acepta los términos, eligiendo supervivencia y estabilidad en una lucha que no puede sostener solo. Se firman acuerdos, se establecen oficinas de enlace y el Japón obtiene un fuerte control sobre las tierras altas septentrionales y sus corredores estratégicos.\n\nEl conflicto termina, pero la libertad de Kachin se encoge a lo que está permitido. Las montañas permanecen, pero su futuro está ahora atado a Tokio."
 JAP_diplomacy.143.a: "Establezca el protectorado."
 JAP_diplomacy.144.t: "Kachin rechaza el Ultimatum"
 JAP_diplomacy.144.d: "Kachin rechaza la demanda de Japón y se niega a someterse a un mandato externo. La negativa convierte la coacción en confrontación, y Tokio ahora enmarca a las tierras altas como un problema de seguridad que debe resolverse por la fuerza.\n\nSi Kachin no acepta la protección por tratado, el Japón impondrá el control de las armas. Las montañas no se mantendrán neutrales."
 JAP_diplomacy.144.a: "Entonces tomaremos las tierras altas."
 JAP_diplomacy.145.t: "La demanda del Corredor de Shan"
 JAP_diplomacy.145.d: "Japón ha entregado sus términos a las autoridades de Wa, apuntando a los territorios fronterizos que se sientan en rutas de contrabando, pases de montaña y las arterias del interior. La oferta está enmarcada como reconocimiento y protección, pero es un arreglo protectorado: alinearse externamente con Tokio, aceptar la supervisión de seguridad japonesa, y permitir el acceso que asegura el corredor.\n\nPara Wa, la elección es brutal. Presentar y mantener el poder local bajo un nuevo paraguas, o rechazar y enfrentar una guerra que no respetará montañas o milicias."
 JAP_diplomacy.145.a: "Aceptar. Mejor un escudo que la aniquilación."
 JAP_diplomacy.145.b: "Rechazar. No seremos absorbidos."
 JAP_diplomacy.146.t: "Wa Acepta la protección japonesa"
 JAP_diplomacy.146.d: "Wa acepta los términos de Japón, negociando la independencia estratégica para la supervivencia y el reconocimiento formal bajo un patrono más fuerte. Llegan equipos de enlace, se aseguran las rutas y las fronteras están dobladas al marco regional de Japón.\n\nLa lucha termina, pero la autonomía se estrecha. Wa retiene la autoridad local, pero su dirección externa ahora responde a Tokio."
 JAP_diplomacy.146.a: "Establezca el protectorado."
 JAP_diplomacy.147.t: "Wa Rechaza la demanda"
 JAP_diplomacy.147.d: "Wa rechaza el ultimátum de Japón y se niega a colocar su territorio bajo supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata a las tierras fronterizas como una brecha incontrolada en su estrategia de corredor.\n\nSi Wa no acepta el marco por tratado, Japón impondrá el control por la fuerza. Las montañas serán disputadas."
 JAP_diplomacy.147.a: "Entonces aseguraremos el pasillo."
 JAP_diplomacy.148.t: "La Puerta de Shan Ultimatum"
 JAP_diplomacy.148.d: "El Japón ha expedido su demanda a las autoridades del estado de Shan meridional, dirigiendo las rutas de las tierras altas que conectan el interior con la región más amplia. La propuesta es un marco protectorado: alinear las relaciones exteriores con Tokio, aceptar la supervisión de seguridad japonesa y permitir el acceso estratégico a carreteras seguras, pases y corredores de suministro.\n\nLa oferta promete protección y reconocimiento. El significado es el control. South Shan debe decidir si aceptar un futuro gestionado bajo el paraguas de Japón o arriesgar una guerra peleada a través de sus colinas y valles."
 JAP_diplomacy.148.a: "Aceptar. No podemos permitirnos la aniquilación."
 JAP_diplomacy.148.b: "Rechazar. No seremos reducidos a un pasillo."
 JAP_diplomacy.149.t: "Sur Shan Yields"
 JAP_diplomacy.149.d: "South Shan State acepta los términos de Japón. Se establecen oficinas de enlace, se aseguran las rutas y la región está doblada a la estrategia del corredor de Tokio como puerta controlada en lugar de un actor independiente.\n\nLa lucha termina, pero los contratos de autonomía. La autoridad local sigue siendo, pero la dirección estratégica ahora responde al Japón."
 JAP_diplomacy.149.a: "Establezca el protectorado."
 JAP_diplomacy.150.t: "Shan del Sur rechaza el Ultimatum"
 JAP_diplomacy.150.d: "South Shan State rechaza la demanda de Japón y se niega a colocar su futuro bajo supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata a la región como una brecha peligrosa en su perímetro estratégico.\n\nSi South Shan no aceptará el marco por tratado, Japón lo impondrá por la fuerza. La puerta estará asegurada."
 JAP_diplomacy.150.a: "Entonces tomaremos la puerta en brazos."
 JAP_diplomacy.151.t: "El mandato de Salween"
 JAP_diplomacy.151.d: "Japón ha mirado hacia el estado de Karen, donde los valles fluviales y las rutas fronterizas pueden abrir o cerrar los enfoques del sur. La demanda de Tokio se presenta como protección y reconocimiento, pero es un marco protectorado: alinear los tratos externos con Japón, aceptar la supervisión de seguridad y otorgar acceso que asegura el corredor Salween.\n\nLa oferta promete estabilidad en una región de autoridad fracturada. El costo es la obediencia. El Estado Karen debe elegir entre una paz vigilada bajo el paraguas de Japón o una guerra que anule sus cruces y asentamientos."
 JAP_diplomacy.151.a: "Aceptar. Viviremos para ver mañana."
 JAP_diplomacy.151.b: "Rechazar. No seremos gobernados."
 JAP_diplomacy.152.t: "El Estado Karen se somete"
 JAP_diplomacy.152.d: "Karen State acepta los términos de Japón, negociando la autonomía estratégica para la supervivencia y un fin a la presión inmediata. Las misiones de enlace llegan, las rutas están aseguradas y la región está doblada al perímetro de Tokio como corredor controlado en lugar de un actor independiente.\n\nEl conflicto termina, pero los límites de la libertad se reducen. La autoridad Karen sigue siendo local, pero la dirección estratégica ahora responde al Japón."
 JAP_diplomacy.152.a: "Establezca el protectorado."
 JAP_diplomacy.153.t: "Estado Karen rechaza el mandato"
 JAP_diplomacy.153.d: "Karen State rechaza la demanda de Japón y se niega a entregar su futuro a la supervisión extranjera. La negativa convierte la coacción en confrontación, y Tokio ahora trata a los cruces de Salween como un problema estratégico que se resolverá por la fuerza.\n\nSi el Estado Karen no acepta el marco por tratado, el Japón lo impondrá por armas. El pasillo estará asegurado."
 JAP_diplomacy.153.a: "Luego tomaremos los cruces."
 JAP_diplomacy.154.t: "Demanda de Anclaje Palau"
 JAP_diplomacy.154.d: "Tokio ha entregado su demanda a Palau, un pequeño estado sentado en una gran parte del océano. Los términos están enmarcados como protección y prosperidad garantizada, pero la estructura es un protectorado: alinear la política exterior con Japón, aceptar la supervisión de seguridad, y otorgar derechos de bastión que convierten a Palau en un anclaje delantero imperial.\n\nLa oferta promete seguridad de tormentas tanto políticas como militares. El costo es la soberanía. Palau debe elegir entre la sumisión bajo el Sol Creciente o una lucha que no puede sostener contra el poder del mar de un gran estado."
 JAP_diplomacy.154.a: "Aceptar. Mejor un protector que una tumba."
 JAP_diplomacy.154.b: "Rechazar. No renunciaremos a nuestra independencia."
 JAP_diplomacy.155.t: "Palau acepta la protección japonesa"
 JAP_diplomacy.155.d: "Palau acepta los términos de Japón. Se firman acuerdos, se otorga acceso y las islas se convierten en un nodo disciplinado en la red de puertos y aeródromos de Tokio.\n\nLa crisis termina sin batalla, pero el cambio es real. Palau permanece en nombre, pero su dirección externa ahora sigue la brújula de Japón."
 JAP_diplomacy.155.a: "Establezca el protectorado."
 JAP_diplomacy.156.t: "Palau rechaza la demanda"
 JAP_diplomacy.156.d: "Palau rechaza el ultimátum de Japón y se niega a intercambiar soberanía por promesas de protección. La negativa convierte la presión de Tokio en una cuestión de fuerza, y Japón ahora trata a las islas como una brecha no asegurada en su perímetro oceánico.\n\nSi Palau no acepta el marco por tratado, el Japón impondrá el control de las armas. El anclaje estará asegurado."
 JAP_diplomacy.156.a: "Entonces tomaremos el anclaje."
 JAP_diplomacy.157.t: "La cadena de Micronesia Ultimatum"
 JAP_diplomacy.157.d: "Japón ha expedido su demanda a Micronesia, viendo las islas no como comunidades dispersas sino como una cadena de piedras pisadas en todo el Pacífico central. La oferta está enmarcada como protección e inversión, pero la estructura es un protectorado: alinear la política exterior con Tokio, aceptar la supervisión de seguridad y otorgar acceso que convierte las islas en puntos de referencia para la flota y el poder aéreo de Japón.\n\nEl mensaje es simple. Estas aguas serán organizadas bajo una sola autoridad. Micronesia debe elegir entre una paz gestionada bajo el paraguas de Japón o una confrontación que no puede esperar sostener."
 JAP_diplomacy.157.a: "Aceptar. No podemos resistir la marea."
 JAP_diplomacy.157.b: "Rechazar. No nos convertiremos en un puesto avanzado."
 JAP_diplomacy.158.t: "Micronesia acepta la cadena"
 JAP_diplomacy.158.d: "Micronesia acepta los términos de Japón. Se firman acuerdos, se otorga acceso y las islas se convierten en un corredor controlado de puertos, aeródromos y nodos de vigilancia dentro del perímetro marítimo de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Micronesia permanece, pero su dirección externa sigue ahora la brújula estratégica de Japón."
 JAP_diplomacy.158.a: "Establezca el protectorado."
 JAP_diplomacy.159.t: "Micronesia rechaza el Ultimatum"
 JAP_diplomacy.159.d: "Micronesia rechaza la demanda de Japón y se niega a entregar su futuro a la supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata a la cadena de la isla como una brecha en su red del Pacífico que debe ser cerrada.\n\nSi Micronesia no acepta el marco por tratado, el Japón impondrá el control por la fuerza. La cadena estará asegurada."
 JAP_diplomacy.159.a: "Entonces tomaremos las piedras de paso."
 JAP_diplomacy.160.t: "La demanda de puestos de avanzada de Nauru"
 JAP_diplomacy.160.d: "Tokio ha entregado su demanda a Nauru, tratando la isla como un pin en el mapa que todavía puede anclar la vigilancia, repostaje y llegar a través del agua abierta. La oferta está enmarcada como protección y soporte garantizado, pero es un marco protectorado: alinear la política exterior con Japón, aceptar supervisión de seguridad y otorgar acceso que convierte a Nauru en un puesto de avanzada imperial.\n\nPara Nauru, la elección es tenue. Presentar y sobrevivir bajo un mayor poder, o rechazar y arriesgarse a convertirse en el campo de batalla que demuestra el punto de Japón."
 JAP_diplomacy.160.a: "Aceptar. No podemos estar solos."
 JAP_diplomacy.160.b: "Rechazar. No seremos reducidos a un punto de referencia."
 JAP_diplomacy.161.t: "Nauru acepta la protección japonesa"
 JAP_diplomacy.161.d: "Nauru acepta los términos de Japón. Se firman acuerdos, se otorga acceso y la isla se convierte en un pequeño pero vital nodo en la red del Pacífico de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Nauru sigue siendo, sin embargo su dirección externa ahora sigue la línea estratégica de Japón."
 JAP_diplomacy.161.a: "Establezca el protectorado."
 JAP_diplomacy.162.t: "Nauru rechaza la demanda"
 JAP_diplomacy.162.d: "Nauru rechaza el ultimátum de Japón y se niega a cambiar la independencia por promesas de protección. La negativa convierte la presión en confrontación, y Tokio ahora trata a la isla como una brecha no asegurada en su perímetro oceánico.\n\nSi Nauru no acepta el marco por tratado, el Japón impondrá el control por la fuerza. El puesto de avanzada estará asegurado."
 JAP_diplomacy.162.a: "Entonces tomaremos la isla."
 JAP_diplomacy.163.t: "La Línea Ecuatorial Ultimatum"
 JAP_diplomacy.163.d: "Japón ha emitido su demanda a Kiribati, un estado diseminado por el Ecuador como marcadores en la carta de un navegante. La propuesta de Tokio está enmarcada como protección y desarrollo, pero es un marco protectorado: alinear la política exterior con Japón, aceptar supervisión de seguridad y conceder acceso que convierte a Kiribati en una cadena de puntos de vigilancia y alcance naval.\n\nEl mensaje es simple. En el nuevo orden del Pacífico, no hay espacios vacíos. Kiribati debe elegir entre sumisión bajo el paraguas de Japón o confrontación contra un poder que tenga la intención de poseer los carriles marinos."
 JAP_diplomacy.163.a: "Aceptar. No podemos resistir al nuevo maestro del océano."
 JAP_diplomacy.163.b: "Rechazar. No seremos absorbidos en un imperio."
 JAP_diplomacy.164.t: "Kiribati acepta la línea ecuatorial"
 JAP_diplomacy.164.d: "Kiribati acepta los términos de Japón. Se firman acuerdos, se otorga acceso y los atolones dispersos se convierten en una parte tranquila pero valiosa de la red del Pacífico de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Kiribati sigue, pero su dirección externa sigue ahora la brújula de Japón."
 JAP_diplomacy.164.a: "Establezca el protectorado."
 JAP_diplomacy.165.t: "Kiribati Rechaza el Ultimatum"
 JAP_diplomacy.165.d: "Kiribati rechaza el ultimátum de Japón y se niega a entregar su futuro a la supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata a la cadena ecuatorial como una brecha en su perímetro marítimo.\n\nSi Kiribati no acepta el marco por tratado, el Japón impondrá el control por la fuerza. La línea estará asegurada."
 JAP_diplomacy.165.a: "Entonces tomaremos la cadena."
 JAP_diplomacy.166.t: "La demanda de bastión del atolón"
 JAP_diplomacy.166.d: "Tokio ha expedido su demanda a las Islas Marshall, considerando los atolones como fortalezas naturales que pueden albergar aeródromos, logística y los instrumentos de control del mar. La oferta está enmarcada como protección y soporte garantizado, pero es un marco protectorado: alinear la política exterior con Japón, aceptar supervisión de seguridad, y otorgar acceso que convierte a los Marshall en bastiones del perímetro central del Pacífico de Japón.\n\nEl mensaje está claro. Estas islas no se dejarán como puntos neutros en un gráfico. Los Marshall deben elegir entre una paz gestionada bajo el paraguas de Japón o una guerra luchada sobre coral y pista."
 JAP_diplomacy.166.a: "Aceptar. No podemos sobrevivir a un sitio."
 JAP_diplomacy.166.b: "Rechazar. No nos convertiremos en una fortaleza para otro poder."
 JAP_diplomacy.167.t: "Los Marshall Yield"
 JAP_diplomacy.167.d: "Las Islas Marshall aceptan los términos de Japón. Se firman acuerdos, se otorga acceso y los atolones se convierten en bastiones disciplinadas dentro de la red oceánica de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Los Marshall permanecen, sin embargo su dirección externa ahora sigue el plan perímetro de Japón."
 JAP_diplomacy.167.a: "Establezca el protectorado."
 JAP_diplomacy.168.t: "Los Marshall rechazan la demanda"
 JAP_diplomacy.168.d: "Las Islas Marshall rechazan el ultimátum de Japón y se niegan a entregar su futuro a la supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata a los atolones como una brecha no asegurada en su línea central de defensa del Pacífico.\n\nSi los Marshall no aceptarán el marco por tratado, el Japón impondrá el control por la fuerza. Los bastiones serán asegurados."
 JAP_diplomacy.168.a: "Entonces tomaremos los atolones."
 JAP_diplomacy.169.t: "El Reefline Ultimatum"
 JAP_diplomacy.169.d: "El Japón ha expedido su demanda a Tuvalu, una fina cadena de arrecifes que todavía importa en un océano medido por el alcance y los puntos de carga. Tokio ofrece protección y apoyo, pero la estructura es un marco protectorado: alinear la política exterior con Japón, aceptar supervisión de seguridad y otorgar acceso que convierte a Tuvalu en un punto de referencia en el perímetro sur del Japón.\n\nEl mensaje es brutal en su sencillez. No habrá islas neutrales en un Pacífico disputado. Tuvalu debe elegir entre sumisión bajo el paraguas de Japón o una confrontación que ahogaría a un pequeño estado en una gran guerra de poder."
 JAP_diplomacy.169.a: "Aceptar. No podemos soportar una tormenta de acero."
 JAP_diplomacy.169.b: "Rechazar. No entregaremos nuestra bandera."
 JAP_diplomacy.170.t: "Tuvalu acepta la protección japonesa"
 JAP_diplomacy.170.d: "Tuvalu acepta los términos de Japón. Se firman acuerdos, se otorga acceso y las islas se convierten en un nodo silencioso en la red marítima de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Tuvalu permanece, sin embargo su dirección externa ahora sigue el plan perímetro de Japón."
 JAP_diplomacy.170.a: "Establezca el protectorado."
 JAP_diplomacy.171.t: "Tuvalu rechaza el Ultimatum"
 JAP_diplomacy.171.d: "Tuvalu rechaza el ultimátum de Japón y se niega a cambiar la independencia por promesas de protección. La negativa convierte la presión en confrontación, y Tokio ahora trata la reesfera como una brecha no asegurada en su cadena sur.\n\nSi Tuvalu no acepta el marco por tratado, el Japón impondrá el control por la fuerza. El punto de acceso estará asegurado."
 JAP_diplomacy.171.a: "Entonces tomaremos las islas."
 JAP_diplomacy.172.t: "El Salomon Barrier Ultimatum"
 JAP_diplomacy.172.d: "Tokio ha expedido su demanda a las Islas Salomón, viendo la cadena como una barrera natural que puede sellar el Pacífico sudoccidental. La oferta está enmarcada como protección y desarrollo, pero es un marco protectorado: alinear la política exterior con Japón, aceptar supervisión de seguridad, y otorgar acceso bastión que convierte a los Salomón en una pantalla fortificada para el perímetro marítimo de Japón.\n\nEl mensaje está claro. Estas islas servirán a la orden de Japón o serán tratadas como una posición enemiga. Los Salomón deben elegir entre la sumisión bajo el Sol Creciente o una guerra que se combate a través de pistas de aterrizaje en la selva y mares estrechos."
 JAP_diplomacy.172.a: "Aceptar. No podemos sobrevivir a un bloqueo."
 JAP_diplomacy.172.b: "Rechazar. No nos convertiremos en una fortaleza para otro imperio."
 JAP_diplomacy.173.t: "Yield de las Salomón"
 JAP_diplomacy.173.d: "Las Islas Salomón aceptan los términos de Japón. Se firman acuerdos, se otorga acceso y la cadena se convierte en una barrera disciplinada de puertos, aeródromos y zonas patrullas bajo la dirección de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Los Salomón permanecen, sin embargo su alineación externa ahora sigue el plan perímetro de Japón."
 JAP_diplomacy.173.a: "Establezca el protectorado."
 JAP_diplomacy.174.t: "Los Salomón rechazan el Ultimatum"
 JAP_diplomacy.174.d: "Las Islas Salomón rechazan la demanda de Japón y se niegan a entregar su futuro a la supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata a la cadena como una brecha peligrosa en su pantalla del Pacífico sudoccidental.\n\nSi los Salomón no aceptan el marco por tratado, el Japón impondrá el control por la fuerza. La barrera estará asegurada."
 JAP_diplomacy.174.a: "Entonces nos apoderaremos de la cadena."
 JAP_diplomacy.175.t: "Ultimatum de la Cuenca de Nueva Guinea"
 JAP_diplomacy.175.d: "Japón ha expedido su demanda a Papua Nueva Guinea, tratando la isla como un bastión continental que puede dominar los enfoques entre el Sudeste de Asia y el Pacífico. La oferta está enmarcada como protección y soporte garantizado, pero es un marco protectorado: alinear la política exterior con Tokio, aceptar supervisión de seguridad, y otorgar acceso bastión que convierte a Nueva Guinea en una fortaleza de poder aéreo, logística y defensa avanzada.\n\nEl mensaje deja pocas dudas. Japón tiene la intención de anclar el teatro sur aquí. Papua Nueva Guinea debe elegir entre sumisión bajo el escudo de Japón o una guerra que convertirá sus costas y tierras altas en líneas frontales."
 JAP_diplomacy.175.a: "Aceptar. No podemos permitirnos convertirnos en un campo de batalla."
 JAP_diplomacy.175.b: "Rechazar. No nos convertiremos en una fortaleza para otro poder."
 JAP_diplomacy.176.t: "Port Moresby Acepta"
 JAP_diplomacy.176.d: "Papua Nueva Guinea acepta los términos de Japón. Se firman acuerdos, se otorga acceso y la isla se convierte en un bastión disciplinado dentro del perímetro sur de Tokio, construido alrededor de aeródromos, puertos y centros logísticos.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Papúa Nueva Guinea sigue siendo, sin embargo, su dirección estratégica ahora sigue el plan de fortaleza de Japón."
 JAP_diplomacy.176.a: "Establezca el protectorado."
 JAP_diplomacy.177.t: "Papua Nueva Guinea rechaza el Ultimatum"
 JAP_diplomacy.177.d: "Papua Nueva Guinea rechaza la demanda de Japón y se niega a entregar su futuro a la supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata a la isla como el obstáculo clave para asegurar el teatro sur.\n\nSi Papua Nueva Guinea no aceptará el marco por tratado, el Japón impondrá el control por la fuerza. El bastión será tomado."
 JAP_diplomacy.177.a: "Entonces tomaremos el bajo."
 JAP_diplomacy.178.t: "Demanda de la cadena del Pacífico Sur"
 JAP_diplomacy.178.d: "Tokio ha emitido su demanda a Vanuatu, tratando las islas como otro enlace en la cadena que puede sellar el Pacífico sudoccidental. La oferta está enmarcada como ayuda para la protección y el desarrollo, pero es un marco protectorado: alinear la política exterior con Japón, aceptar la supervisión de seguridad y conceder acceso que convierte a Vanuatu en un punto de partida para patrullas, repostaje y control regional.\n\nEl mensaje está claro. Japón está construyendo un perímetro, isla por isla. Vanuatu debe elegir entre una paz gestionada bajo el Sol Creciente o una confrontación que no puede esperar sostener."
 JAP_diplomacy.178.a: "Aceptar. No podemos luchar contra un imperio en el mar."
 JAP_diplomacy.178.b: "Rechazar. No seremos absorbidos."
 JAP_diplomacy.179.t: "Vanuatu acepta la protección japonesa"
 JAP_diplomacy.179.d: "Vanuatu acepta los términos de Japón. Se firman acuerdos, se otorga acceso y las islas se convierten en un nodo tranquilo pero útil dentro del perímetro sur de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Vanuatu sigue, pero su dirección externa sigue ahora la línea estratégica de Japón."
 JAP_diplomacy.179.a: "Establezca el protectorado."
 JAP_diplomacy.180.t: "Vanuatu rechaza la demanda"
 JAP_diplomacy.180.d: "Vanuatu rechaza el ultimátum de Japón y se niega a cambiar la independencia por promesas de protección. La negativa convierte la presión en confrontación, y Tokio ahora trata a las islas como una brecha insegura en su cadena del Pacífico sudoccidental.\n\nSi Vanuatu no acepta el marco por tratado, el Japón impondrá el control por la fuerza. El enlace estará asegurado."
 JAP_diplomacy.180.a: "Entonces tomaremos las islas."
 JAP_diplomacy.181.t: "El Ultimatum de la Keystone del Pacífico Sur"
 JAP_diplomacy.181.d: "Japón ha expedido su demanda a Fiji, tratando las islas como un centro que puede apoyar la logística de las flotas y las operaciones aéreas en un amplio arco del Pacífico Sur. La oferta está enmarcada como protección y soporte garantizado, pero es un marco protectorado: alinear la política exterior con Tokio, aceptar supervisión de seguridad, y otorgar acceso bastión que convierte a Fiji en una piedra angular del perímetro sur de Japón.\n\nEl mensaje es inconfundible. Japón no busca amigos, está construyendo un orden. Fiji debe elegir entre una paz gestionada bajo el paraguas de Japón o una confrontación que será decidida por el poder del mar."
 JAP_diplomacy.181.a: "Aceptar. No podemos darnos el lujo de ser un ejemplo."
 JAP_diplomacy.181.b: "Rechazar. Fiji no presentará."
 JAP_diplomacy.182.t: "Fiji acepta los términos de la piedra angular"
 JAP_diplomacy.182.d: "Fiji acepta el ultimátum de Japón. Se firman acuerdos, se otorga acceso y las islas se convierten en un nodo central en la red de puertos, aeródromos y zonas de patrulla del Pacífico Sur de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Fiji permanece, pero su dirección externa sigue ahora el plan perímetro de Japón."
 JAP_diplomacy.182.a: "Establezca el protectorado."
 JAP_diplomacy.183.t: "Fiji rechaza el Ultimatum"
 JAP_diplomacy.183.d: "Fiji rechaza la demanda de Japón y se niega a entregar su futuro a la supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata a las islas como la brecha final en un perímetro sur que pretende cerrar.\n\nSi Fiji no acepta el marco por tratado, el Japón impondrá el control por la fuerza. La piedra clave estará asegurada."
 JAP_diplomacy.183.a: "Entonces tomaremos el centro."
 JAP_diplomacy.184.t: "Samoa Line Ultimatum"
 JAP_diplomacy.184.d: "Tokio ha expedido su demanda a Samoa, tratando las islas como un eje entre el Pacífico central y los enfoques del sur. La oferta está enmarcada como protección y soporte garantizado, pero es un marco protectorado: alinear la política exterior con Japón, aceptar la supervisión de seguridad y otorgar acceso que convierte a Samoa en un punto de referencia en el perímetro oceánico en expansión del Japón.\n\nEl mensaje es contundente. Japón está dibujando líneas a través del mar, y Samoa se sienta en uno de ellos. La aceptación ofrece seguridad bajo un mayor poder, los riesgos de rechazo se convierten en la lección que convence a otros."
 JAP_diplomacy.184.a: "Aceptar. Sobreviviremos, aunque debamos someternos."
 JAP_diplomacy.184.b: "Rechazar. Samoa no se inclinará."
 JAP_diplomacy.185.t: "Samoa acepta la protección del Japón"
 JAP_diplomacy.185.d: "Samoa acepta el ultimátum de Japón. Se firman acuerdos, se otorga acceso y las islas se convierten en un nodo tranquilo pero útil en la red del Pacífico de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Samoa sigue siendo, sin embargo su dirección externa ahora sigue la línea estratégica de Japón."
 JAP_diplomacy.185.a: "Establezca el protectorado."
 JAP_diplomacy.186.t: "Samoa rechaza el Ultimatum"
 JAP_diplomacy.186.d: "Samoa rechaza la demanda de Japón y se niega a cambiar la independencia por promesas de protección. La negativa convierte la presión en confrontación, y Tokio ahora trata a las islas como una brecha no asegurada en su perímetro oceánico.\n\nSi Samoa no acepta el marco por tratado, el Japón impondrá el control por la fuerza. La línea estará asegurada."
 JAP_diplomacy.186.a: "Entonces tomaremos las islas."
 JAP_diplomacy.187.t: "La demanda de la Corona de Tonga"
 JAP_diplomacy.187.d: "Tokio ha emitido su demanda a Tonga, un reino cuyos puertos y carriles marinos se sientan en el arco sur del Pacífico. La oferta está enmarcada como protección y asociación, pero es un marco protectorado: alinear la política exterior con Japón, aceptar la supervisión de seguridad y otorgar acceso que convierte a Tonga en un punto de referencia dentro del perímetro marítimo en expansión de Japón.\n\nEl mensaje está claro. Japón está construyendo un orden oceánico que no deja espacio para pivotes independientes. Tonga debe elegir entre una paz vigilada bajo la sombra japonesa o un enfrentamiento decidido por las flotas."
 JAP_diplomacy.187.a: "Aceptar. Mantendremos la corona, incluso bajo una sombra."
 JAP_diplomacy.187.b: "Rechazar. Tonga no se presentará."
 JAP_diplomacy.188.t: "Tonga acepta la protección japonesa"
 JAP_diplomacy.188.d: "Tonga acepta los términos de Japón. Se firman acuerdos, se otorga acceso y el reino se convierte en un nodo disciplinado en la red sur de Tokio.\n\nLa crisis termina sin batalla, pero la soberanía se estrecha. Tonga sigue siendo, sin embargo su dirección externa ahora sigue la línea estratégica de Japón."
 JAP_diplomacy.188.a: "Establezca el protectorado."
 JAP_diplomacy.189.t: "Tonga rechaza la demanda"
 JAP_diplomacy.189.d: "Tonga rechaza el ultimátum de Japón y se niega a colocar su futuro bajo supervisión extranjera. La negativa convierte la presión en confrontación, y Tokio ahora trata al reino como una brecha no asegurada en su arco sur.\n\nSi Tonga no acepta el marco por tratado, el Japón impondrá el control por la fuerza. El punto de acceso estará asegurado."
 JAP_diplomacy.189.a: "Entonces tomaremos las islas."
 JAP_diplomacy.190.t: "Aviso a Washington: Retiro del Pacífico"
 JAP_diplomacy.190.d: "Tokio ha entregado una demanda formal a Washington pidiendo la transferencia de las principales islas del Pacífico estadounidenses. El mensaje es contundente: ya no se toleran las posiciones extranjeras en el perímetro oceánico de Japón, y estos puestos deben ser abandonados para evitar una mayor escalada.\n\nLa demanda se enmarca como una oportunidad para evitar la guerra, pero también es una prueba de resolución. Aceptar y conceder las piedras pisadas de poder, o rechazar y arriesgarse a convertir el Pacífico en un campo de batalla entre gigantes."
 JAP_diplomacy.190.a: "Aceptar la transferencia."
 JAP_diplomacy.190.b: "Rechazar. El Pacífico no es suyo para reclamar."
 JAP_diplomacy.191.t: "Washington rinde los puestos"
 JAP_diplomacy.191.d: "Contra la expectativa, los Estados Unidos aceptan la demanda. Las islas se transfieren, las bases son evacuadas y el perímetro marítimo de Japón se expande en un solo golpe.\n\nLa crisis termina sin guerra, pero el significado es inconfundible. Un gran poder ha retrocedido, y el equilibrio del Pacífico cambia hacia Tokio."
 JAP_diplomacy.191.a: "Aseguren las islas."
 JAP_diplomacy.192.t: "Washington se niega"
 JAP_diplomacy.192.d: "Los Estados Unidos rechazan la demanda de Japón y se niegan a entregar sus posiciones del Pacífico. La negativa convierte el ultimátum de Tokio en una confrontación directa entre poderes, y Japón ahora tiene tanto la justificación como el motivo para buscar los puestos de avanzada por la fuerza.\n\nEl Pacífico se ajusta a las líneas delanteras. Si estas islas no serán cedidas por un tratado, serán tomadas por la guerra."
 JAP_diplomacy.192.a: "Entonces los reclamamos por la fuerza."
 JAP_diplomacy.193.t: "Ultimatum a París: El Pacífico debe ser despejado"
 JAP_diplomacy.193.d: "Tokio ha entregado una demanda formal a París por la transferencia de las tenencias de la isla del Pacífico de Francia. La nota está envuelta en lenguaje cortés, pero su significado es inconfundible: imperios distantes ya no mantendrán las posiciones dentro del perímetro oceánico de Japón.\n\nJapón ofrece un camino estrecho para evitar la escalada. Francia puede retirarse con tinta y firmas, o rechazar y aceptar que la disputa será resuelta por flotas en lugar de diplomáticos."
 JAP_diplomacy.193.a: "Aceptar la transferencia."
 JAP_diplomacy.193.b: "Rechazar. Francia no será expulsada."
 JAP_diplomacy.194.t: "París se retira del Pacífico"
 JAP_diplomacy.194.d: "Francia acepta la demanda de Japón. Las banderas están bajadas, se ordenan las guarnición y las islas son transferidas al control de Tokio.\n\nLa crisis termina sin guerra, pero el mensaje se hace eco en todo el mundo. Japón no está negociando una esfera, está obligando a uno."
 JAP_diplomacy.194.a: "Aseguren las islas."
 JAP_diplomacy.195.t: "París se niega"
 JAP_diplomacy.195.d: "Francia rechaza el ultimátum de Japón y se niega a entregar sus posesiones del Pacífico. La negativa convierte la demanda de Tokio en una confrontación directa, y Japón ahora tiene la justificación para reclamar las islas por la fuerza.\n\nEl océano crece más pequeño cuando los grandes poderes chocan. Si Francia no se retira por tratado, Japón intentará expulsarlo por la guerra."
 JAP_diplomacy.195.a: "Entonces los capturaremos."
 JAP_diplomacy.196.t: "Aviso a Londres: Renunciar al Pacific Holding"
 JAP_diplomacy.196.d: "Tokio ha entregado una demanda formal a Londres por la transferencia de la isla del Pacífico restante de Gran Bretaña. La nota habla de la estabilidad regional y el fin de las injerencias distantes, pero su propósito es claro: Japón tiene la intención de eliminar banderas extranjeras del océano que ahora reclama a la policía.\n\nGran Bretaña se ofrece una opción entre un retiro ordenado y una guerra innecesaria lejos de casa. Aceptar, y el asunto termina en papel. Rechazar, y el Pacífico se convierte en otro teatro donde los imperios prueban la voluntad del otro."
 JAP_diplomacy.196.a: "Aceptar la transferencia."
 JAP_diplomacy.196.b: "Rechazar. Gran Bretaña no será expulsada."
 JAP_diplomacy.197.t: "Londres retrocede"
 JAP_diplomacy.197.d: "El Reino Unido acepta la demanda de Japón. El territorio es transferido, la bandera está bajada y Tokio añade otra pieza a su perímetro marítimo forzado.\n\nLa crisis termina sin guerra, pero el simbolismo es pesado. Un viejo poder marino ha dado terreno, y la afirmación de Japón al Pacífico crece más audaz con cada concesión."
 JAP_diplomacy.197.a: "Aseguren el territorio."
 JAP_diplomacy.198.t: "Londres Rechaza la demanda"
 JAP_diplomacy.198.d: "Gran Bretaña rechaza el ultimátum de Japón y se niega a entregar su tenencia del Pacífico. La negativa convierte la demanda de Tokio en un desafío directo, y Japón ahora tiene motivos y pretexto para apoderarse del territorio por la fuerza.\n\nLa diplomacia ha llegado a su límite. Si Gran Bretaña no se retira por tratado, Japón intentará eliminarlo por guerra."
 JAP_diplomacy.198.a: "Entonces lo tomaremos."
 JAP_diplomacy.199.t: "Canales japoneses se expanden en Pyongyang"
 JAP_diplomacy.199.d: "La política japonesa hacia el Norte ha entrado en una nueva fase. A través de intermediarios, contactos de inteligencia y presión cuidadosamente gestionada, Tokio ha abierto canales dentro de nuestro entorno político que anteriormente eran limitados o cerrados.\n\nEsto no significa confianza, y no significa alineación. Significa que Japón tiene ahora una oportunidad temporal para configurar las decisiones, influir en las facciones y probar nuestra resolución tanto desde dentro como desde el extranjero."
 JAP_diplomacy.199.a: "Veremos estos canales de cerca."
 JAP_diplomacy.200.t: "Sakhalin y los Kurils perdidos"
 JAP_diplomacy.200.d: "Las fuerzas rusas han tomado el pleno control de Sakhalin y las Islas Kuril, revirtiendo todos los logros alcanzados durante la campaña. La operación se ha derrumbado, y Tokio ya no puede sostener el esfuerzo. Una cesación del fuego es la única opción restante.\n\nEl fracaso llevará consecuencias. La confianza pública en el juicio militar del gobierno ha sido sacudida, y el costo político de esta invención se sentirá durante años."
 JAP_diplomacy.200.a: "No tenemos más opción que aceptar la derrota."
 JAP_failed_sakhalin_war: "Secuelas de la Guerra de Sakhalin"
 JAP_failed_sakhalin_war_desc: "La fallida campaña militar sobre Sakhalin y las Islas Kuril ha dejado profundas cicatrices en el paisaje político de Japón. La confianza pública en la competencia estratégica del gobierno ha disminuido, la moral militar ha sufrido y la caída diplomática sigue limitando las opciones de política exterior de Tokio."
 JAP_mars_colony1: "Marte Colony Amaterasu"
 JAP_mars_colony1_desc: "Con el nombre de Amaterasu, la diosa del sol que ilumina los cielos, la Colonia Marte 'Amaterasu' se encuentra como un símbolo radiante de la unidad y liderazgo de Japón. Su presencia inspira confianza en el hogar y respeto en el extranjero."
 JAP_mars_colony2: "Marte Colony Kagutsuchi"
 JAP_mars_colony2_desc: "Se llama después de Kagutsuchi, el dios del fuego, la Colonia Marte 'Kagutsuchi' se construye alrededor de hornos, refinerías e industria pesada. Su propósito es claro: convertir el mineral marciano y la energía en fuerza para las fábricas de Japón."
 JAP_mars_colony3: "Marte Colony Tsukuyomi"
 JAP_mars_colony3_desc: "Se llama después de Tsukuyomi, el dios de la luna y la noche, la Colonia Marte 'Tsukuyomi' sirve como un observatorio tranquilo y complejo de investigación. De sus laboratorios e instrumentos, los datos regresan al Japón, profundizando la comprensión científica."
 JAP_mars_colony4: "Marte Colony Susanoo"
 JAP_mars_colony4_desc: "Nombrada después de Susanoo, la deidad que trae tormentas, la Colonia Marte 'Susanoo' está formada en un fuerte puesto fronterizo. Los campos de entrenamiento y los rangos experimentales lo convierten en un crisol para las fuerzas armadas y doctrinas de Japón."
 JAP_american_pressure_article_nine: "Bajo presión de EE.UU. Aranceles"
 JAP_JP_USA_SOFA_1: "Marco U.S.-Japón SOFA"
 JAP_JP_USA_SOFA_1_desc: "Las fuerzas estadounidenses en Japón operan bajo un acuerdo sobre el estado de las fuerzas que protege a la mayoría del personal de los tribunales e impuestos japoneses, y da al gobierno de Estados Unidos un amplio control sobre sus bases. La policía local, gobernadores y residentes deben trabajar en torno a las reglas negociadas en Washington y Tokio, y cada delito, accidente o queja de ruido cerca de una base se filtra a través de procedimientos SOFA antes de que Japón pueda actuar."
 JAP_maritime_heavy_industry_corridor: "Corredor marítimo de la industria pesada"
 JAP_maritime_heavy_industry_corridor_desc: "Japón desarrolla un cinturón continuo de astilleros, siderurgias y empresas de ingeniería marina a lo largo de las principales regiones costeras. La inversión concentrada en este corredor aumenta la capacidad para construir y mantener buques de guerra, submarinos y buques de apoyo, fortaleciendo la columna vertebral industrial de la flota."
 JAP_moon_base_completed: "Base Lunar Kaguya Establecida"
 JAP_usa_article_nine_refused: "Artículo 9 Cambio de Interpretación"
 JAP_diplomacy_shortcut: "Diplomacia"
 JAP_political: "Política"
 JAP_economy: "Economía"
 JAP_military: "Militar"
 JAP_monarchism: "Monarquista"
 JAP_great_east_japan_earthquake_shortcut: "Gran Terremoto de Japón Oriental"
 JAP_article_nine_remove_flag: "Se ha eliminado el artículo 9"
 JAP_usa_article_nine_accepted: "Aceptado Artículo 9 Cambio de Interpretación"
 JAP_tokyo_startup_special_zone: "Zona especial de Tokyo Startup"
 JAP_tokyo_startup_special_zone_desc: "Concentraremos la desregulación, el apoyo a las empresas y los incentivos a la inversión en el área metropolitana de Tokio para fomentar la creación de startups y la comercialización."
 JAP_tokyo_startup_special_zone_idea: "Zona especial de Tokyo Startup"
 JAP_tokyo_startup_special_zone_idea_desc: "Tokio ha sido designada como una zona de reforma regulatoria especial para apoyar startups, capital de riesgo y nueva formación empresarial. Al concentrar la desregulación, el acceso a las inversiones y el apoyo a la comercialización en la región capital, el Gobierno tiene como objetivo convertir una reforma limitada en un motor visible del crecimiento."
 JAP_kansai_medical_special_zone: "Zona de Innovación Médica de Kansai"
 JAP_kansai_medical_special_zone_desc: "Crearemos una zona especial para la innovación médica, de atención y de ciencias de la vida en Kansai, acelerando la inversión privada y la implementación práctica."
 JAP_kansai_medical_special_zone_idea: "Zona de Innovación Médica Kansai"
 JAP_kansai_medical_special_zone_idea_desc: "Kansai está siendo desarrollado como una zona especial para la innovación médica, de atención y de ciencias de la vida a través de la flexibilidad regulatoria y la inversión enfocada."
 JAP_kyushu_logistics_special_zone: "Zona Especial de Logística y Puertos de Kyushu"
 JAP_kyushu_logistics_special_zone_desc: "Agilizaremos la logística y los procedimientos portuarios en Kyushu, fortaleciendo las corrientes comerciales y mejorando la eficiencia de la industria regional."
 JAP_kyushu_logistics_special_zone_idea: "Logística de Kyushu & zona especial portuaria"
 JAP_kyushu_logistics_special_zone_idea_desc: "Kyushu ha sido designado como zona logística y de reforma portuaria para mejorar la eficiencia comercial y la conectividad regional. Los procedimientos racionalizados, la priorización de las infraestructuras y el alivio reglamentario tienen por objeto fortalecer la capacidad de exportación y hacer de la región una base más atractiva para la industria y el comercio."
 JAP_expand_special_zones_nationwide: "Ampliar las zonas especiales en todo el país"
 JAP_expand_special_zones_nationwide_desc: "Los resultados obtenidos en determinadas zonas estratégicas se ampliarán a nivel nacional, convirtiendo la reforma reglamentaria de una excepción limitada en un marco de crecimiento más amplio."
 JAP_tokyo_startup_special_zone_active: "Executed §Y$JAP_tokyo_startup_special_zone$§!"
 JAP_kansai_medical_special_zone_active: "Executed §Y$JAP_kansai_medical_special_zone$§!"
 JAP_kyushu_logistics_special_zone_active: "Executed §Y$JAP_kyushu_logistics_special_zone$§!"
 JAP_expand_special_zones_nationwide_done: "Executed §Y$JAP_expand_special_zones_nationwide$§!"
 JAP_japanese_economy_decisions: "La falta de demanda entrelazada"
 JAP_japanese_economy_decisions_desc: "Dos décadas de caída de precios enseñaron a los hogares y las empresas japonesas a esperar. Los salarios se sientan planas, las empresas acuden en efectivo en lugar de invertir, y cada yen de estímulo es salvado en vez de gastado. La economía no está colapsando; simplemente se niega a moverse.\n\n§YLo que puedes hacer§!\nLas decisiones que figuran a continuación son las palancas de demanda. Anunciar un objetivo de precios, reducir el impuesto al consumo, transferir efectivo a los hogares, financiar la inversión pública y empujar las compras de bienes duraderos cada aumento §YDemand Recovery Progress§!. Los focos de la rama de demanda lo elevan aún más, y §Y$JAP_improvement_private_investment_climate$§! se suma directamente a ella.\n\n§YDemand Recovery Progress§!: [?JAP_demand_recovery_progress|0] / 100\n\n§GThresholds§!\n§G30§!: §Y$JAP_entrenched_demand_shortfall_idea_1$§! se relaja en §Y$JAP_entrenched_demand_shortfall_idea_2$§!.\n§G60§!: se alivia de nuevo en §Y$JAP_entrenched_demand_shortfall_idea_3$§!.\n§G85§!: se elimina el espíritu y se acelera el crecimiento económico de Japón.\n\n§RAdvertencia§!: este progreso nunca se deteriora, pero nada lo eleva por sí solo. No tomes decisiones y Japón permanece en el desplome indefinidamente."
 JAP_entrenched_demand_shortfall_idea_2: "Recuperación de la demanda holgada"
 JAP_entrenched_demand_shortfall_idea_2_desc: "Los objetivos de precios más claros y el apoyo a los hogares han alejado la economía de su peor fase, pero la recuperación sigue siendo frágil. El consumo y la inversión están mejorando en los lugares, pero no con suficiente fuerza para levantar a todo el país. La demanda está regresando, pero la precaución aún se ahorca sobre la economía.\n-------------\nUsted puede §Gmitigar§! los efectos de este espíritu nacional mediante el uso de las decisiones en §Y $JAP_japanese_economy_decisions$§! para elevar §YDemand Recovery Progress§! a al menos §G60§!!"
 JAP_entrenched_demand_shortfall_idea_3: "Arrastre de la demanda residual"
 JAP_entrenched_demand_shortfall_idea_3_desc: "Las medidas gubernamentales para estimular el consumo han impulsado a la economía hacia adelante, pero la precaución que se deja atrás en años de estancamiento sigue estando profundamente arraigada. Las casas y las empresas se están moviendo más que antes, sin embargo una recuperación autosuficiente todavía necesita un empuje final. La economía de Japón está en el umbral de escapar del estancamiento, pero todavía no ha roto completamente.\n-------------\nUsted puede §G remove§! este espíritu nacional mediante el uso de las decisiones en §Y $JAP_japanese_economy_decisions$§! para elevar §YProgreso Demand Recovery §! al menos §G85§!!."
 JAP_declaration_price_target: "Declarar un precio objetivo"
 JAP_declaration_price_target_desc: "No es sólo una demanda débil que está arrastrando la economía hacia abajo. La creencia de que los precios y salarios nunca se moverán ha atrapado a hogares y empresas con precaución. Un objetivo de precio claro es una declaración que el estado ya no aceptará el estancamiento como normal, y es el primer paso hacia la sacudida de las expectativas congeladas suelto."
 Japan_economy.17.t: "El objetivo del precio es alcanzado"
 Japan_economy.17.d: "Lo que una vez parecía imposible ha comenzado a suceder. Los precios están aumentando de una manera que la gente ya no puede ignorar. El cambio más importante no es el número mismo, sino el sentido creciente de que el estancamiento no es eterno. Esa sensación está empezando a aflojar la precaución de los hogares y las empresas por igual."
 Japan_economy.17.a: "La atmósfera ha cambiado."
 Japan_economy.18.t: "El precio cae corto"
 Japan_economy.18.d: "El objetivo no se ha traducido en un movimiento real, y la duda está empezando a extenderse sobre la promesa del gobierno de romper la caída. Los hogares están creciendo cautelosos una vez más, mientras que las empresas se retiran a una espera y ven postura frente a la débil demanda. La confianza en la recuperación ha sido claramente dañada, y un estado de ánimo pesado se está adaptando a la economía de Japón."
 Japan_economy.18.a: "La confianza no es fácilmente restaurada."
 JAP_price_target_mission: "La promesa de los precios crecientes"
 JAP_price_target_mission_desc: "Declarar una meta no basta. Debemos mostrar señales visibles de alza de precios dentro del plazo y convencer al país de que el cambio ha comenzado de verdad."
 JAP_cash_transfers_households: "Soporte directo para el hogar"
 JAP_cash_transfers_households_desc: "Cuando la ansiedad sobre el futuro es fuerte, la recuperación no comienza por sí misma. El estado debe poner el poder de gasto directamente en manos de los hogares. Es especialmente probable que el apoyo destinado a grupos de bajos y medianos ingresos se convierta en consumo real, lo que da fuerza inmediata a la demanda interna."
 JAP_cash_transfers_households_decision: "Pagos a hogares de ingresos bajos y medios"
 JAP_cash_transfers_households_decision_desc: "Entregar apoyo a los grupos con más probabilidades de gastarlo y empujar la demanda al alza de forma directa."
 Japan_economy.19.t: "Pagos de soporte Mostrar signos de recuperación"
 Japan_economy.19.d: "El dinero entregado directamente a los hogares ya no está sentado ocioso. Está empezando a fluir en el mercado. El aumento del gasto es especialmente visible entre los grupos de bajos y medianos ingresos, y las carteras que permanecieron cerradas durante tanto tiempo finalmente comienzan a abrirse."
 Japan_economy.19.a: "La demanda todavía puede ser despierta."
 JAP_temporary_tax_cuts: "Alivio fiscal temporal"
 JAP_temporary_tax_cuts_desc: "Los recortes tributarios temporales dan a los hogares una razón para gastar ahora, adelantando las compras que se han pospuesto y dando un impulso visible a la demanda en una economía estancada."
 JAP_temporary_consumption_tax_cut: "Corte de impuestos sobre el consumo temporal"
 JAP_temporary_consumption_tax_cut_desc: "Crear una razón para gastar ahora y convertir el consumo aplazado en impulso para la recuperación."
 Japan_economy.20.t: "El alivio fiscal muestra signos de recuperación"
 Japan_economy.20.d: "El recorte fiscal temporal ha dado a los hogares una razón para actuar ahora. Las compras que se habían pospuesto están empezando a regresar, y la atmósfera de estancamiento está empezando a romperse. Puede ser una medida a corto plazo, pero ha demostrado poder real en la sacudida de la demanda débil suelto."
 Japan_economy.20.a: "Ahora es el momento de moverse."
 JAP_active_public_investment: "Inversión pública agresiva"
 JAP_active_public_investment_desc: "Si las empresas privadas siguen siendo cautelosas, el gobierno debe crear la demanda misma, empujando dinero a las economías locales y al empleo. La inversión pública restablece el sentido de que el movimiento finalmente ha regresado."
 JAP_active_public_investment_decision: "Orden Público de Inversión"
 JAP_active_public_investment_decision_desc: "Crear demanda mediante la acción estatal y restablecer el flujo de dinero a las economías locales y al empleo."
 Japan_economy.21.t: "La inversión pública muestra signos de recuperación"
 Japan_economy.21.d: "Los proyectos ordenados por el estado están empezando a significar más de lo que las cifras sugieren. El dinero está fluyendo en las economías locales, el empleo se mueve y el ambiente demasiado familiar del pesimismo económico comienza a cambiar. El país puede finalmente sentir que ha dado un paso más allá de la espera."
 Japan_economy.21.a: "El estado puede mover la economía."
 JAP_improvement_private_investment_climate: "Mejorar el clima de inversión privada"
 JAP_improvement_private_investment_climate_desc: "El gasto público por sí solo no puede completar la recuperación. Se debe dar confianza a las empresas para invertir de nuevo, y se debe reducir la incertidumbre sobre el futuro. Una recuperación duradera requiere que las empresas se trasladen de la defensa a la expansión."
 JAP_focus_improving_investment_climate: "Enfoque sobre la mejora del clima de inversión"
 JAP_focus_improving_investment_climate_desc: "El gobierno está priorizando la creación de un entorno más favorable para la inversión empresarial. El capital político se está gastando en coordinación, persuasión y reforma institucional, dejando menos margen para otras iniciativas a corto plazo."
 Japan_economy.02.t: "El clima de inversión privada mejora"
 Japan_economy.02.d: "Las empresas están empezando a ver que permanecer defensiva para siempre significa oportunidades perdidas. Queda la incertidumbre, pero parte del peso que retenía nuevas inversiones está empezando a levantarse. Por primera vez, la recuperación ya no parece estar destinada a permanecer puramente impulsada por el estado."
 Japan_economy.02.a: "El sector privado está agitando."
 JAP_stimulating_demand_durable_goods: "Demanda de Mercancías Durables"
 JAP_stimulating_demand_durable_goods_desc: "Mercancías duraderas como automóviles, electrodomésticos y compras relacionadas con la vivienda pueden levantar mucho más que sus propios sectores una vez que la demanda comienza a moverse. Pero en tiempos de estancamiento, a menudo son las primeras compras que se posponen. Revivirlos daría el impulso visible de la recuperación y restauraría un sentido de vitalidad ausente."
 JAP_stimulating_demand_durable_goods_decision: "Campaña de compra de bienes duraderos"
 JAP_stimulating_demand_durable_goods_decision_desc: "Fomentar las compras grandes aplazadas durante años y dar a la recuperación un impulso visible."
 Japan_economy.22.t: "Demanda de Mercancías Durables Muestra signos de recuperación"
 Japan_economy.22.d: "Las grandes compras que se habían retrasado durante años finalmente están empezando a regresar. La demanda de bienes duraderos tiene efectos amplios en los sectores conexos, y también es un signo de que las familias se están volviendo al menos ligeramente más esperanzadoras con respecto al futuro. La recuperación comienza a aparecer no sólo en los datos, sino en el ambiente de la vida cotidiana."
 Japan_economy.22.a: "Deja que el impulso se difunda."
 JAP_strict_audits_banks: "Inspecciones bancarias estrictas"
 JAP_strict_audits_banks_desc: "Años de retraso han hecho más difícil ver las heridas del sistema bancario, mientras que la ansiedad financiera ha seguido extendiéndose. El primer paso es arrastrar los malos préstamos peligrosos fuera de las sombras y obligar a los bancos a enfrentar la realidad. Será doloroso, pero sin ese dolor no puede haber recuperación real."
 Japan_economy.23.t: "La opción Shinsei Put"
 Japan_economy.23.d: "La cláusula es exactamente como se ha informado. Cada préstamo que los compradores juzgan haber perdido una quinta parte de su valor vuelve a la Corporación de Seguros de Depósito al precio en los libros, y el estado absorbe la diferencia. El banco no hizo nada ilegal. Leía el contrato con más cuidado que los funcionarios que lo escribieron, y esos funcionarios siguen en sus escritorios."
 Japan_economy.23.a: "Publicar el contrato y nombre que lo firmaron"
 Japan_economy.24.t: "El colapso de Sogo"
 Japan_economy.24.d: "La cadena no puede ser salvada y todo el mundo aconsejando al ministro lo sabe. La única pregunta es si está terminada en el tribunal, donde los acreedores y los funcionarios que les permitieron serán nombrados en público, o reestructurados detrás de puertas cerradas con la parte pública de la deuda perdonada silenciosamente."
 Japan_economy.24.a: "Que falle en la corte abierta"
 JAP_injection_public_funds: "Inyección de capital público"
 JAP_injection_public_funds_desc: "No es realista exigir tanto la eliminación de pérdidas como los préstamos renovados de bancos debilitados sin apoyo. Si se quiere preservar la confianza en el propio sistema financiero, el Estado debe intervenir como respaldo final y detener la cadena de colapso. Es una decisión políticamente pesada, pero una con poco espacio para evitarlo."
 Japan_economy.25.t: "Mycal"
 Japan_economy.25.d: "El banco principal del grupo lo ha refinanciado cada año desde que terminó la burbuja y ahora le ha dicho al ministerio que no volverá a hacerlo. Los proveedores Kansai que nunca han tratado con nadie más ya están llamando a sus oficinas prefecturales. Lo que se decida esta semana será leído en toda la región como una declaración sobre si los viejos arreglos todavía tienen lugar."
 Japan_economy.25.a: "Dejarlo pasar y auditar el banco que lo llevó"
 JAP_new_lenders: "Invitar nuevos prestamistas"
 JAP_new_lenders_desc: "Si los bancos existentes permanecen atrapados en la precaución defensiva, el flujo de crédito permanecerá débil. Se debe alentar a los nuevos prestamistas a entrar en el campo y romper el cuello de botella en la propia financiación. La competencia y los nuevos canales de capital pueden restaurar parte de la flexibilidad que ha perdido el sistema financiero de Japón."
 JAP_new_lenders_idea: "El ascenso de los nuevos prestamistas"
 JAP_new_lenders_idea_desc: "Están empezando a surgir nuevas fuentes de crédito más allá de los bancos tradicionales. El bloqueo de las finanzas no ha sido totalmente despejado, pero nuevos caminos están abriendo para que el capital pase por la economía."
 JAP_protection_deposits: "Establecer la protección del depósito"
 JAP_protection_deposits_desc: "En el momento en que los depositantes comienzan a dudar de que sus ahorros son seguros, una crisis bancaria se vuelve real. Por lo tanto, el Estado debe dejar inequívocamente claro que los depósitos serán protegidos. Esto por sí solo no puede restaurar completamente la confianza, pero todavía puede convertirse en la pared que mantiene el pánico de convertirse en un colapso."
 Japan_economy.26.t: "Resona"
 Japan_economy.26.d: "Eliminar los activos tributarios diferidos y la relación de capital colapsa. Los auditores no firmarán, que en sí es sin precedentes, y el gobierno tiene días más que semanas. Dos trillones de yen hace que el banco entero y hace del estado su dueño. El refusal significa el primer fallo bancario importante que el país ha permitido desde la guerra, y nadie puede decir dónde se detiene."
 Japan_economy.26.a: "Inyecte los fondos y retire toda la junta"
 JAP_rehabilitation_small_medium_enterprises: "Una red de seguridad crediticia para pequeñas empresas"
 JAP_rehabilitation_small_medium_enterprises_desc: "La eliminación de los malos riesgos de los préstamos conduce a las pequeñas y medianas empresas a la financiación del malestar junto con el insolvente. Los bancos deben mantener los préstamos a las PYMES viables mientras que los planes de reestructuración de las finanzas vigilan el endurecimiento del crédito, poniendo una barrera frente al colapso de las economías locales."
 JAP_rehabilitation_small_medium_enterprises_idea: "Enfoque sobre crédito por PYME Estabilidad"
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "Los recursos políticos se están concentrando en la supervisión, coordinación y apoyo a la reestructuración a fin de evitar que las empresas pequeñas y medianas puedan obtener préstamos inadecuados. Esto es vital para proteger las economías locales, pero deja menos espacio para la acción en otras áreas."
 Japan_economy.27.t: "El Banco Ashikaga"
 Japan_economy.27.d: "El gobierno de la prefectura, sus firmas y muchos de sus hogares no tienen otro banco. El hallazgo de los examinadores es inequívoco: el banco es insolvente y ha sido durante algún tiempo. La nacionalización temporal protege a cada depositante y elimina a todos los accionistas, muchos de los cuales son empresas locales que fueron requeridas para mantener el stock como condición de sus propios préstamos."
 Japan_economy.27.a: "Nacionalízalo y escribe a los accionistas a la nada"
 Japan_economy.28.t: "Daiei"
 Japan_economy.28.d: "La Corporación de Revitalización está lista para tomarlo, reemplazar el tablero y vender lo que se puede vender. El fundador construyó esta compañía de los escombros de la guerra y tiene amigos en el partido que lo recuerdan. Están pidiendo una refinanciación más, y están pidiendo en voz alta."
 Japan_economy.28.a: "Dáselo a la Corporación de Revitalización"
 Japan_economy.29.t: "Las cuentas de Kanebo"
 Japan_economy.29.d: "Doscientos mil millones de yenes de ganancia que nunca fue ganado, reportado a lo largo de cinco años, y firmado cada vez por la misma empresa contable. Procesar a la empresa es directo. Prosecutar a sus auditores le diría a cada firma contable en Japón que la firma es una responsabilidad más que una formalidad, y haría muchos otros estados de repente vale la pena volver a leer."
 Japan_economy.29.a: "Procurar a la empresa y suspender sus auditores"
 Japan_economy.30.t: "La Federación se levanta"
 Japan_economy.30.d: "La presión se ha apagado. La federación no ha retirado sus objeciones, pero ha dejado de informarse contra la investigación, y los miembros más ruidosos se han callado. No es un acuerdo. Es un juicio que la lucha ya no vale lo que les cuesta."
 Japan_economy.30.a: "Tomaremos la calma mientras dure."
 Japan_economy.31.t: "La Federación hace el bien en ella"
 Japan_economy.31.d: "Se han aplazado los planes de gasto de capital en todas las empresas miembros, y cada una de ellas cita incertidumbre. La congelación de contratación anunciada esta mañana se presenta como prudencia. El mensaje es inconfundible y está destinado a ser, y no hay estatuto que pueda obligar a una empresa a invertir."
 Japan_economy.31.a: "Han llegado a su punto."
 Japan_economy.06.t: "Las Firmas empujan atrás"
 Japan_economy.06.d: "En el momento en que los auditores piden los números reales, comienza el cabildeo. Las federaciones de la industria advierten que las bancarrotas masivas y los empleos perdidos, y los burócratas amigos aconsejan paciencia. Los bancos preferirían reportar las pérdidas en su propio horario, si es que fuera cierto. Podemos obligarlos, podemos dejar que nos den lo que elijan, o podemos decidir que esto nunca valió la pena."
 Japan_economy.06.a: "Subpoena los libros"
 Japan_economy.07.t: "Un banco en el Brink"
 Japan_economy.07.d: "La auditoría ha derrocado a un prestamista regional que se ahoga en préstamos malos. Forzar todo el balance a la luz del día y el pánico podría extenderse; contener la revelación y la podredumbre permanece medio escondido, pero los mercados se mantienen tranquilos. De cualquier manera la investigación se mueve hacia adelante."
 Japan_economy.07.a: "Declaración completa de la fuerza"
 Japan_economy.08.t: "Los hallazgos se publican"
 Japan_economy.08.d: "El informe va a las impresoras. Lo que hay en él depende enteramente de lo que se permitió a los auditores encontrar: un catálogo de empresas insolventes y los funcionarios que las protegieron, una cuenta parcial con los peores nombres redactados, o un documento que maneja varias cientos páginas sin acusar a nadie de nada. El público lo leerá de cualquier manera, y así también las personas que se prometieron mercados transparentes de estilo occidental."
 Japan_economy.08.a: "Publicar todo esto y dejar que el juez público"
 Japan_economy.09.t: "A Leak del Ministerio"
 Japan_economy.09.d: "Las firmas sabían qué auditores venían y en qué mañana. Los gabinetes de carga fueron vaciados durante un fin de semana, y dos directores son repentinamente inalcanzables en el extranjero. Alguien en el ministerio les está diciendo, y todo el mundo en esta sala puede adivinar quién, porque fue enviado aquí desde el banco que está protegiendo y será enviado de nuevo a él cuando se jubilegue."
 Japan_economy.09.a: "Aceptar la pérdida y avanzar"
 Japan_economy.10.t: "La Federación emite un Ultimatum"
 Japan_economy.10.d: "La federación empresarial ha llegado a la Dieta con cifras propias: inversión pospuesta, contratación congelada, confianza dañada, todo ello puesto en la puerta de la investigación. El mensaje bajo la cortesía no es sutil. Vuelva esto, o los miembros de esta federación encontrarán que no pueden comprometerse a nada mientras la incertidumbre dura."
 Japan_economy.10.a: "Que hagan su caso en público."
 Japan_economy.11.t: "El Fiscal Falls"
 Japan_economy.11.d: "No fue la investigación lo que falló. Fue un fiscal principal con una membresía de golf que no declaró, dado a él por una firma en su propia lista, y un periódico que tiene fotografías de él aceptando. El ministro ha renunciado a asumir la responsabilidad. La sonda está suspendida pendiente de revisión, que todos entienden significar hasta el punto en que el público deja de prestar atención."
 Japan_economy.11.a: "Hemos perdido la iniciativa."
 JAP_expectation_of_being_rewarded: "La esperanza de recompensa"
 JAP_expectation_of_being_rewarded_desc: "La recuperación requiere restaurar la creencia de que el esfuerzo será recompensado en salarios y niveles de vida. Sin crecimiento salarial el estímulo permanece temporal, y sólo esa expectativa convierte una recuperación en uno autosuficiente."
 JAP_wage_negotiations: "Negociar salarios más altos"
 JAP_wage_negotiations_decision: "Restaurar la confianza en el crecimiento salarial y evitar que la recuperación de la demanda termine como un estallido temporal de estímulo."
 Japan_economy.12.t: "Negociaciones con empresas"
 Japan_economy.12.d: "Si la recuperación de la demanda se vuelve autosuficiente, los salarios también deben aumentar. Sin embargo, los negocios siguen siendo cuidadosos con los riesgos futuros y la presión sobre las ganancias. El gobierno debe decidir ahora qué tan fuerte debería empujar por un sueldo más alto."
 Japan_economy.12.a: "Anime aumentos de salarios."
 Japan_economy.12.b: "Aplica Presión."
 Japan_economy.12.c: "Déjalo al Sector Privado."
 Japan_economy.14.t: "El crecimiento salarial alcanza el objetivo"
 Japan_economy.14.d: "Los salarios finalmente han comenzado a moverse de una manera visible. Lo que importa no es sólo el aumento de los ingresos en sí, sino el retorno de un sentimiento más profundo que el esfuerzo puede ser recompensado una vez más. Ese cambio de sentimiento está empezando a remodelar el consumo débil en algo más fuerte y duradero."
 Japan_economy.14.a: "La recuperación se está volviendo real."
 Japan_economy.15.t: "Caídas de crecimiento salarial cortas del objetivo"
 Japan_economy.15.d: "El crecimiento salarial no alcanzó el objetivo, pero el esfuerzo no fue desperdiciado. Las empresas siguen siendo cautelosas, pero la necesidad de una remuneración más alta es ahora más ampliamente comprendida que antes. El paso adelante es pequeño, pero todavía importa romper el viejo ambiente de estancamiento."
 Japan_economy.15.a: "Construimos en esto."
 Japan_economy.12_a_TT: "Las posibilidades de crecimiento salarial alcanzando la cantidad diana son §Y50-50§!"
 Japan_economy.12_b_TT: "Las posibilidades de crecimiento salarial alcanzando la cantidad objetivo son §Galtas§!"
 Japan_economy.12_c_TT: "Las posibilidades de crecimiento salarial alcanzando la cantidad objetivo son §Rlow§!"
 JAP_wage_negotiations_TT: "§YProgreso de recuperación anticipado§! aumentará, pero la cantidad depende del resultado de §Y negociaciones salariales§!"
 JAP_glorious_decade_desc: "Sin posponer los factores detrás del estancamiento, reconstruiremos las finanzas, las empresas y la demanda en paralelo. Al mismo tiempo, enfrentaremos los impactos de la disminución de la natalidad y la generación de «edad de hielo laboral» y, centrada en las reformas al estilo de trabajo y la inversión en personas, equilibraremos la seguridad del hogar con un mayor potencial de crecimiento."
 JAP_inflation_target_desc: "El gobierno y el banco central comunicarán claramente la política de apoyo a la economía y las condiciones en que se mantendrá. Al reducir la incertidumbre futura y aliviar la actitud «esperar y ver» de los hogares y las empresas, facilitaremos el consumo y la inversión para captar."
 JAP_diplomacy.34.d: "Para fortalecer la red de seguridad financiera de la región, el gobierno japonés ha propuesto ampliar el acuerdo de cambio de divisas con nuestro país a través de la «Iniciativa Chiang Mai». Asegurar la liquidez en tiempos de crisis puede ayudar a calmar la ansiedad del mercado y contribuir a la estabilidad económica.\n\n¿Deberíamos aceptar esta propuesta y participar en el fortalecimiento de la cooperación financiera?"
 JAP_diplomacy.40.d: "El gobierno japonés ha propuesto la cooperación «AOD Cualitativa» para nuestro país en las esferas de la educación, el desarrollo de los recursos humanos y la investigación, como apoyo realizado en coordinación con empresas e instituciones locales. Esta cooperación fortalecerá la formación de aptitudes y la capacidad institucional, promoviendo el perfeccionamiento industrial y la innovación. Aceptar la propuesta también aumentaría la influencia de Japón en la ASEAN.\n\n¿Deberíamos aceptar esta propuesta y fortalecer el capital humano, la investigación y el desarrollo?"
 JAP_diplomacy.41.d: "[FROM.GetName] ha aceptado la propuesta de cooperación «ODA Cualitativa» de Japón en los campos de la educación, el desarrollo de recursos humanos y la investigación. A medida que avanza la coordinación con las empresas e instituciones locales, se fortalecerá la capacidad institucional y la base tecnológica del otro país, contribuyendo al crecimiento sostenible. Este acuerdo sin duda aumentará la influencia de Japón dentro de la ASEAN."
 JAP_diplomacy.42.d: "[FROM.GetName] ha indicado que disminuirá la propuesta de cooperación «AOD Cualitativa» en las esferas de la educación, el desarrollo de los recursos humanos y la investigación. El otro país parece estar priorizando las prioridades nacionales y los preparativos institucionales, pero esto no significa que esté rechazando la propia propuesta. Japón debe permanecer consciente de las circunstancias del otro país, manteniendo abiertos los canales para el diálogo."
 JAP_diplomacy.49.d: "El gobierno japonés ha presentado una propuesta para establecer la «Plataforma de Conocimiento de Preparación para Desastres de Taiwán» para compartir conocimientos especializados y lecciones aprendidas en respuesta a desastres, sobre la base de nuestra vulnerabilidad común a los desastres naturales. Mediante la normalización del intercambio de información, la capacitación conjunta y el desarrollo de procedimientos de recuperación, el objetivo es fortalecer las capacidades de respuesta ante situaciones de emergencia y acelerar la recuperación. Si esta cooperación avanza, se espera que reduzca los daños y acelere la restauración."
 JAP_diplomacy.50.d: "El gobierno japonés ha propuesto la «Cooperación de alta tecnología japonesa Taiwán», que vincularía las instituciones de investigación y las empresas privadas en Japón y Taiwán para promover la investigación conjunta en tecnologías civiles de vanguardia. Mediante el intercambio de recursos de investigación, la búsqueda del desarrollo conjunto y la promoción de los intercambios de ingenieros, el objetivo es acelerar la innovación e impulsar la productividad industrial y la competitividad. Si esta cooperación se arraiga, constituirá una base para el crecimiento a largo plazo en los sectores de la tecnología civil de ambos países."
 JAP_diplomacy.56.t: "Proyecto de cooperación cultural «Sinic Cultural Area»"
 JAP_diplomacy.56.d: "El gobierno japonés ha propuesto un proyecto de cooperación cultural Japón China para fortalecer los vínculos culturales dentro de la «Esfera Cultural Sinica», que comparte una base histórica común. Mediante intercambios académicos, iniciativas culturales y cooperación en medios de comunicación y educación, el objetivo es hacer más visibles los valores compartidos y las conexiones históricas y hacerlos funcionar como un amortiguador cultural contra la influencia externa. Si este marco avanza, también se espera fortalecer el poder blando que contribuye a configurar una imagen internacional más favorable."
 JAP_diplomacy.59.d: "El gobierno japonés ha propuesto la «Iniciativa Regional de Intercambio Empresarial» para institucionalizar intercambios comerciales locales y promover la cooperación entre las empresas regionales en Japón y Corea del Sur. A través de eventos empresariales, exposiciones conjuntas, emparejamiento de la cadena de suministro y el intercambio de tecnología y conocimientos especializados, el objetivo es revitalizar las economías regionales y acelerar el crecimiento de las industrias civiles. Si este marco tiene raíces, se ampliará la cooperación práctica que no depende excesivamente del liderazgo del Gobierno central, fortaleciendo las redes industriales impulsadas por el sector privado."
 JAP_historical.20010426.d: "Yoshirō Mori anunció su renuncia como Primer Ministro después de un año en el cargo. Sus calificaciones de aprobación habían disminuido, y la desconexión entre él y el público, simbolizada por su observación «nación divina» y su manejo del incidente de Ehime Maru, sólo había crecido.\n\nElegido como su sucesor en la carrera de liderazgo del LDP fue Junichiro Koizumi, quien capturó la atención nacional con su audaz declaración de «destruir el LDP» y llevó a cabo una campaña llamativa y de alto perfil. Las expectativas públicas eran altas, y ganó una victoria de deslizamiento en el voto regional.\n\nCon un estilo y una presencia escénica que se separó del viejo Partido Democrático Liberal, Koizumi levantó la bandera de «reforma» cuando asumió el cargo de Primer Ministro.\nSin embargo, lo que podría emerger de las ruinas que juró destruir, nadie todavía sabe."
 JAP_historical.20060926.d: "El Primer Ministro Junichiro Koizumi, que dirigió una administración a largo plazo durante más de cinco años, anunció su intención de reducir el vencimiento de su mandato como presidente del PPD. Si bien Koizumi había declarado públicamente su deseo de bajar al final de su mandato, el apoyo público para él seguía siendo elevado, y muchos dentro del partido continuaban pidiendo su extensión.\n\nMientras tanto, dentro del PDL, Shinzo Abe, que había ascendido rápidamente a través de las filas para convertirse en Secretario Principal del Gabinete a una edad temprana, surgió como el sucesor principal. Con su juventud, reconocimiento de nombres, linaje político y estatus simbólico como figura «post-Koizumi», estaba reuniendo amplio apoyo de todo el partido.\n\n¿Quién es más adecuado para dirigir la nación hacia adelante, un titular experimentado o un nuevo líder listo para llevar la antorcha a la próxima generación? Ha llegado el momento de una decisión."
 JAP_historical.20070926.d: "El Primer Ministro Shinzo Abe anunció abruptamente su intención de dimitir, citando la creciente dificultad de gestionar el gobierno. Sólo había pasado un año desde que asumió el cargo. En medio de una serie de escándalos ministeriales, la fundación de su administración se ha visto gravemente sacudida.\nEn respuesta a su dimisión, algunos del PPD han empujado a traer al ex Secretario General de Gabinete Yasuo Fukuda, argumentando que «se necesita un nuevo rostro para restaurar la confianza pública». Sin embargo, muchas voces siguen apoyando firmemente la continuación de Abe.\n\nJapón se encuentra ahora en medio de la confusión política. Ha llegado el momento de decidir quién tomará el timón de la nación."
 JAP_historical.20080924.d: "El Primer Ministro Yasuo Fukuda celebró inesperadamente una conferencia de prensa en la Oficina del Primer Ministro para anunciar su renuncia.\n\nDurante la conferencia, dijo: «Por el bien de la vida cotidiana del pueblo, espero que un nuevo equipo lleve a cabo las políticas», mostrando una tranquila aceptación de la transición de liderazgo. Sin embargo, como no explicó claramente las razones de su dimisión, el anuncio dejó a muchos ciudadanos confundidos e inciertos.\nEn respuesta, el Partido Democrático Liberal comenzó rápidamente a prepararse para una elección de liderazgo. El Secretario General Tarō Asō surgió como el candidato principal, ganando rápidamente apoyo de diversas facciones del partido. Sin embargo, un pequeño número de voces dentro de la fiesta siguen pidiendo que Fukuda permanezca en.\n\nPara romper el estancamiento político, ¿cambia lo que necesita el país? ¿O es la estabilidad la mayor prioridad para Japón en este momento? Ha llegado el momento de una decisión."
 JAP_focus_renewable_energy_decision_repeal: "Derogar el enfoque de energías renovables"
 JAP_focus_renewable_energy_decision_repeal_desc: "Revertir el compromiso con las energías renovables supone un giro de política que se aleja de la inversión solar y eólica y permite al gobierno reorientar recursos a otras prioridades energéticas."
 JAP_focus_thermal_power_decision_repeal: "Derogar el enfoque de centrales de combustibles fósiles"
 JAP_focus_thermal_power_decision_repeal_desc: "Revertir la expansión de las centrales de combustibles fósiles supone un giro de política que se aleja de la inversión en carbón, petróleo y gas y permite al gobierno reorientar recursos a otras prioridades energéticas."
 JAP_historical.121006001.t: "2000 Tottori Earthquake"
 JAP_historical.121006001.d: "Japón consiste en los archipiélagos volcánicos que flotan sobre el Anillo del Fuego. Significa que Japón y su gente deben experimentar terremotos masivos constantemente. No ha cambiado hasta el milenio anterior, y no lo hará, el próximo milenio también.\n\n1:30 PM, 6 de octubre de 2000 - Un terremoto de magnitud 7.3 y escala 6+ en Shimane Occidental. Esto causó mucho daño en muchas carreteras y casas, y vibración a regiones distantes como Osaka y Fukuoka. Especialmente, Kobe experimentó un fuerte terremoto por primera vez después del terremoto de Hanshin-Awaji en 1995."
 JAP_historical.disaster_help: "¡Ayúdenlos ahora!"
 JAP_historical.disaster_leave: "Déjalos. Ellos se recuperarán por sí mismos."
 JAP_historical.130210001.t: "Ehime-Maru Desastres"
 JAP_historical.130210001.d: "El 9 de febrero de 2001, un barco de entrenamiento de alta escuela Ehime-Maru fue aplastado por el Submarino Greeneville [USA.GetName]. El Ehime-Maru donde 35 estudiantes y profesores japoneses habían estado abordando hundidos y 9 fueron asesinados.\n\nDurante los dos funcionarios del gobierno están recogiendo para cada información de este trágico accidente, el Primer Ministro [Root.GetLeader] está jugando al golf para las vacaciones.\n\nPor supuesto, deben renunciar a las vacaciones y volver a Tokio ahora, ¿verdad?"
 JAP_historical.130210001.oA: "¡Vuelve a Tokio ahora!"
 JAP_historical.130210001.oB: "¡Espera! Sólo un tiro más..."
 JAP_historical.130324001.t: "2001 Geiyo Earthquake"
 JAP_historical.130324001.d: "3:27 PM, 24 de marzo de 2001 - Una magnitud 6.7 y escala 6- terremoto en Hiroshima Occidental. 2 fueron asesinados y 288 resultaron heridos. Kure, la ciudad más cercana al centro sísmico, ha sufrido el mayor daño. Por otro lado, otros muchos gobiernos locales disminuyeron los daños, porque sus ciudades habían sido tomadas contramedidas después del terremoto de Hanshin-Awaji en 1995 y el terremoto de Shimane del año pasado. El principal daño fue la rotura de las tuberías de agua y el colapso de la superficie de las montañas."
 JAP_historical.9130901001.t: "Fuego de construcción de Kabukicho"
 JAP_historical.9130901001.d: "Antes del amanecer del 1 de septiembre de 2001, un edificio «Myojo 56 Building» que fue colocado en Kabukicho, Shinjuku Ward, Tokio fue apasionado, y el fuego mató a 44 personas visitando el salón mahjong y club de strip, para el envenenamiento por monóxido de carbono. Según el informe del departamento de bomberos, el incendio fue pequeño al principio pero volado por el fenómeno de retroceso causado por un personal que encontró el fuego y abrió una puerta. El informe agregó que las alarmas de incendio estaban cubiertas por el techo o cortadas para el mal funcionamiento, por lo que se perdió la extinción temprana. Hay otro informe que los funcionarios del edificio no guiaron la evacuación de los visitantes. Mientras tanto, la Policía Metropolitana co-investigada con el departamento de bomberos encontró una tubería de gas rota antinaturalmente. Aunque la causa del incendio todavía no está clara ya sea accidental o arson, está claro que la falta de conciencia sobre la prevención del fuego lo hizo peor."
 JAP_historical.9130901001.oA: "Esperamos que nunca veamos otro incendio del edificio peor que esto."
 JAP_historical.131201001.t: "El nacimiento de su Alteza La Princesa Aiko"
 JAP_historical.131201001.d: "El 1 de diciembre del 2001, la hija, del príncipe heredero Naruhito y su consorte Masako, nació en el hospital del Palacio Imperial. Ella, la primera princesa imperial en el tercer milenio, fue llamada Aiko, de Mencius, el clásico libro chino confucianismo. Además, Su Alteza la Princesa Imperial Aiko es la nieta de Su Majestad el Emperador Akihito. Este es el evento más feliz después de mucho tiempo desde el nacimiento de Su Alteza el Príncipe Fumihito Akishino-no-Miya en 1965, por lo que casi todos en todo el país han celebrado. Y luego, 20.000 personas incluyendo políticos y celebridades han gritado a Banzai en el Palacio Imperial. Por otra parte, algunas personas aprendieron que esta situación moriría por la actual línea familiar imperial. El Prince-Consort Masako ha sido demasiado avanzado la edad para tener un bebé por lo que era peligroso tener un segundo hijo. Y si la Princesa Aiko crecía, podría convertirse en la Emperatriz Matrilineal «como la última familia imperial», porque tiene una gran diferencia de edad comparativa entre dos príncipes - Naruhito y Fumihito. Pero rompería la Ley de Hogares Imperiales: El Trono Imperial sólo está permitido para la línea patrilineal. Evento Cada uno ha comenzado a discutir sobre la enmienda de la Ley Imperial de Hogares, para permitir la Emperatriz Matrilineal."
 JAP_historical.131201001.oA: "Banzai!"
 JAP_historical.150526001.t: "2003 mar adentro Miyagi terremoto"
 JAP_historical.150526001.d: "6:24 PM, 26 de mayo de 2003 - Se produjo un terremoto de magnitud 7.1 y escala 6 frente a la frontera prefectural Miyagi-Iwate, que tuvo lugar. Grandes áreas de la región de Tohoku han sufrido mucho daño como una destrucción en las tres partes del Sinkansen y deslizamientos sobre montañas, pero nadie fue asesinado. El tsunami era tan suavemente como una onda en este momento. Aunque tenemos estos informes, mucha gente ha sentido el quaking, de Hokkaido a Kanto."
 JAP_historical.150726001.t: "2003 segundo Miyagi Consecutive Earthquakes"
 JAP_historical.150726001.d: "El 26 de julio de 2003 - ¡Tantos como FOUR TIMES de terremotos golpearon repetidamente en el norte de Miyagi, hasta la noche desde las 0 AM - en un día! El más fuerte ha registrado la magnitud 6.4 y la escala 6+ en 7:13 AM, e incluso el más débil fue la magnitud 5.1 y la escala 5-. Estos terremotos han causado daños no sólo cientos de casas sino también la base aérea Matsushima del JASDF. Fue un día muy desagradable, pero afortunadamente nadie fue asesinado."
 JAP_historical.150926001.t: "2003 Hokkaidō earthquake"
 JAP_historical.150926001.d: "4:50 AM, 26 de septiembre de 2003 - Se produjo un terremoto de magnitud 8.0 y escala 6 en el sur de Hokkaido. Sólo unas pocas ciudades han tomado el terremoto con fuerza, pero pronto se han dado cuenta de las terribles consecuencias. El terremoto causó una lequidización del suelo en la zona costera de llenado y el fuego en tanques de almacenamiento de petróleo. Además, un enorme tsunami golpeó la costa este de Japón oriental y dos fueron asesinados."
 JAP_historical.161023001.t: "2004 terremoto de Niigata Chūetsu"
 JAP_historical.161023001.d: "5:56 PM, 23 de octubre de 2004 - Se produjo un terremoto de magnitud 6.8 y escala 7 en Niigata. Fue la primera vez en registrar JMA Scale 7 desde la revisión por el terremoto de Hanshin de 1995. En Yamakoshi, todos los caminos habían sido destruidos por los deslizamientos de tierra y todos los residentes estaban encerrados en el pueblo. Un tren había estado corriendo en la Línea Joetsu Shinkansen fue descarrilado por el shock pero nadie murió. Sin embargo, como resultado del terremoto, 68 fueron asesinados."
 JAP_historical.170320001.t: "2005 Fukuoka Earthquake"
 JAP_historical.170320001.d: "10:53 AM, 20 de marzo de 2005 - Se produjo un terremoto de magnitud 7.0 y escala 6 en la ciudad de Fukuoka. Hay menos registros de terremotos en el norte de Kyushu y éste también fue más grande desde 1922. En la Isla Genkai de la ciudad de Fukuoka, unos 700 pueblos han evacuado y diez decidieron permanecer para la comunicación y patrulla en casos de desastre. En el centro de Fukuoka, la mayoría de las ventanas están rotas y estos fragmentos cayeron en el pavimento e hirieron a dos peatones. El terremoto sacudió no sólo Tsushima sino también Corea y China. Un pueblo fue asesinado por el terremoto."
 JAP_historical.170425001.t: "Accidente de descarrilamiento en la línea Fukuchiyama"
 JAP_historical.170425001.d: "A las 9:18 AM del 25 de abril de 2005, un tren de servicio rápido en la línea Fukuchiyama de JR West (también conocida como la Línea JR Takarazuka) descarriló a una curva aguda en la ciudad de Amagasaki, prefectura de Hyogo, y se estrelló en el primer piso de un edificio cercano de apartamentos.\nEl tren tenía siete coches, aunque los informes iniciales afirmaron erróneamente que sólo tenían seis, ya que el coche principal se había incorporado completamente en el edificio. La investigación reveló que el tren había entrado en la curva a aproximadamente 116 km/h (72 mph), a pesar de que el límite de velocidad de la sección era de 70 km/h (43 mph). La velocidad excesiva probablemente causó el descarrilamiento debido a la fuerza centrífuga.\nEl conductor fue asesinado en el accidente, pero el testimonio del conductor en el coche trasero sugirió que la tripulación pudo haber intentado compensar por un retraso de unos 90 segundos. Posteriormente se informó de que existían en la empresa medidas disciplinarias internas estrictas por errores operacionales menores. Estas medidas incluyeron sesiones de reeducación, copiando las reglas de la empresa a mano y otras prácticas correctivas que tenían origen en la privatización de los ferrocarriles nacionales japoneses (JNR) durante el gobierno de Nakasone.\nAfortunadamente, un tren expreso limitado que se acercaba desde la dirección opuesta fue capaz de hacer una parada de emergencia debido a la vía bloqueada, evitando una colisión secundaria. Sin embargo, como ocurrió el accidente durante la hora de la madrugada, el tren estaba lleno. En total, 107 personas fueron asesinadas y 562 resultaron heridas, lo que hizo el accidente ferroviario más mortífero en la historia japonesa de posguerra.Algunos especialistas médicos señalaron que varios pasajeros podrían no haber muerto inmediatamente en el accidente pero después debido al síndrome de trituración resultante de compresión prolongada."
 JAP_historical.180906001.t: "El nacimiento de Su Alteza el Príncipe Hisahito"
 JAP_historical.180906001.d: "El 6 de septiembre de 2006, el hijo, del Príncipe Fumihito y su Consorcio Kiko, nació en el hospital privado de Minami Azabu. Él, el Príncipe Imperial primogénito en el tercer milenio, fue nombrado Hisahito lo que significa «Hisa» como «De manera relajada» y «Hito» como la tradición imperial de nombrar desde la era heian. Fue entregado por la sección César en el hospital privado, no en el Palacio Imperial; ambos fueron la primera vez de la historia imperial. Esto fue recibido como el varón legítimo de la sucesión del trono imperial, así como el nacimiento de la nueva familia Imperial. Después del nacimiento del niño, el argumento de la enmienda que la Ley Imperial de Hogares ha estado callando poco a poco."
 JAP_historical.180906001.oA: "Banzai!"
 JAP_historical.190216001.t: "«La pensión perdida»"
 JAP_historical.190216001.d: "En 1997, la Agencia de Seguro Social de Japón (SIA) comenzó a consolidar los registros individuales de pensiones bajo un único sistema «Número de Pensiones Básicas». Sin embargo, entre 2006 y 2007, el organismo descubrió aproximadamente 50 millones de registros de pensiones que no estaban relacionados o tenían discrepancias debido a errores durante la transcripción de documentos impresos en formato digital.\nAlgunos de estos registros desaparecidos afectaron a los beneficiarios actuales de las pensiones, suscitando preocupación por el hecho de que las personas pudieran haber recibido cantidades incorrectas de pago. Además, según se informa, algunos registros se perdieron o se eliminaron erróneamente durante los intentos de actualizar los datos sobre las pensiones de los empleados.\nEn respuesta, [JAP.GetRulingParty] puso en marcha un grupo especial de tareas encargado de investigar la cuestión y propuso legislación de emergencia para proporcionar socorro a los afectados. Sin embargo, los partidos de oposición critican duramente al gobierno y la insatisfacción pública sigue siendo elevada."
 JAP_historical.190216001.oA: "¡Qué desastre!"
 JAP_historical.190325001.t: "2007 Noto Earthquake"
 JAP_historical.190325001.d: "9:41 AM, 25 de marzo de 2007 - Un fuerte terremoto M6.9 golpea la región de Hokuriku. La escala JMA calculó el terremoto como 6+ en la ciudad de Wajima, prefectura de Ishikawa, y fue el primer terremoto más fuerte desde que comenzó la observación sísmica en 1922. Se informa que el hipocentro coloca en la zona donde ninguna investigación no encontró una falla todavía. El temblor alcanzado desde la prefectura de Hokkaido a la prefectura de Kochi causó 20 cm (7,87 pulgadas) del tsunami. El terremoto mató a 1 personas por la linterna de piedra colapsada, lesionó a 356 personas y dañó más de 30.000 edificios y casas."
 JAP_historical.190716001.t: "2007 Chūetsu terremoto offshore"
 JAP_historical.190716001.d: "10:13 AM, 16 de julio de 2007 - Otro terremoto M6.8 golpea la Prefectura de Niigata. La escala JMA calcula 6+ en varias ciudades, pero en la central nuclear Kashiwazaki-Kariwa, se computó extraoficialmente como 7. El tsunami también causado por el temblor y se registró a las 1m (3.28 pies) en la ciudad de Kashiwazaki. El terremoto mató a 15 personas directamente y en segundo lugar, lesionó a 2346 personas y dañó más de 34.000 edificios incluye 1.331 casas destruidas. El incendio se descompone en la planta nuclear Kashiwazaki-Kariwa antes mencionada, pero el extinto se atrasó dos horas debido al error de compartir comunicaciones en los combates contra incendios en fase temprana, lo que causó fugas radiactivas aunque fuera dentro del nivel ambientalmente ignorable. Este terremoto ha ocurrido sólo 4 meses después del terremoto de Noto y 3 años más tarde del terremoto destructivo Niigata Chuetsu 2004."
 JAP_historical.200614001.t: "2008 Iwate-Miyagi Nairiku terremoto"
 JAP_historical.200614001.d: "8:43 AM, 14 de junio de 2008 - Un fuerte terremoto M7.2 ocurre bajo la prefectura de Iwate, la escala JMA calcula 6+ en Kurihara City, Miyagi Prefecture y Oshu City, Iwate Prefecture. A pesar de que fue un terremoto interior, se ha registrado un temblor superior a 3 escalas desde Hokkaido hasta la región de Kanto. Este terremoto, como resultado raro, dañó pocos edificios pero causó numerosos deslizamientos de tierra, y finalmente mató a 17 personas, lesionó 70 severas y 356 leves, y 6 todavía están desaparecidos. Hubo informes como el derrumbe de un puente y los daños a los bienes culturales."
 JAP_historical.210811001.t: "2009 terremoto del Golfo Suruga"
 JAP_historical.210811001.d: "5:07 AM, 11 de agosto de 2009 - Un gran terremoto M6.5 ocurre en Suruga Bay, mató a un pueblo y lesionó 319. El terremoto causó un tsunami de 40 cm (1,31 pies). La Escala JMA calculó el terremoto 6- en muchas zonas de la prefectura de Shizuoka, 8678 casas y varios edificios históricos están dañados, pero nada de casas fueron completamente golpeadas. La región de Tokai, donde se incluye la prefectura de Shizuoka, es el área desastrosa del futuro Gran Terremoto de Tokai-Tonankai y Tsunami, por lo que los residentes han preparado con el simulacro de evacuación, estabilizando sus propios muebles y fortaleciendo sus casas y edificios. Esa fue la razón de menos víctimas y daños en comparación con su escala del terremoto. Sin embargo, hubo informes de daños en las fábricas, plantaciones de té y Tomei Expressway."
 JAP_diplomacy.16.t: "El Impasse de Japón"
 JAP_diplomacy.16.d: "Tokio sigue resistiendo a ampliar la interpretación del artículo 9. Washington debe decidir lo lejos que está dispuesto a empujar, y a qué costo."
 JAP_diplomacy.16.a: "Suelta el asunto. Nuestros otros intereses en la región tienen prioridad."
 JAP_diplomacy.16.b: "Retirar nuestra garantía de seguridad para Japón."
 JAP_diplomacy.16.c: "Imposibilidad de aranceles comerciales a las exportaciones japonesas."
 JAP_diplomacy.16.e: "Establecer un bloqueo naval de Japón."
 JAP_asteroid_mining_network_established: "Red de Minería Asteroides Establecida para [JAP.GetNameWithFlag]"
 JAP_asteroid_mining_operation_active: "Actualmente se está llevando a cabo una operación de minería de asteroides"
 JAP_claiming_taiwan_tt: "Esto afirma una afirmación japonesa en cada estado de la isla taiwanesa inmediatamente. Una vez que las reclamaciones estén en su lugar, complete el enfoque para exigir la presentación de Taiwán."
 JAP_improvement_private_investment_climate_idea: "Mejorar el clima de inversión privada"
 JAP_improvement_private_investment_climate_idea_desc: "El gasto público por sí solo no puede completar la recuperación. Se debe dar confianza a las empresas para invertir de nuevo, y se debe reducir la incertidumbre sobre el futuro. Una recuperación duradera requiere que las empresas se trasladen de la defensa a la expansión."
 JAP_demographic_crisis: "Medidas sin precedentes para la crisis"
 JAP_demographic_crisis_desc: "La Agencia de la Infancia y la Familia del Japón coordina una respuesta integral al declive demográfico: incentivos pronatalistas, movilización laboral femenina o reforma migratoria. La Dieta se compromete a un solo camino. Cada uno paga su factura en una moneda diferente: subsidios de efectivo, trastorno de la fuerza laboral o transformación cultural."
 JAP_demographic_crisis_tt: "Marca el comienzo de la respuesta de Japón a su declive demográfico. Las tres estrategias que siguen son mutuamente excluyentes."
 JAP_immigration_backlash_opposition_tt: "§RRetroceso de inmigración:§! sentimiento anti-inmigración hincha la oposición nacionalista"
 JAP_immigration_backlash_stability_tt: "§RRetroceso de inmigración:§! ira sobre la afluencia de extranjeros erosiona la estabilidad"
 JAP_traditionalist_backlash_opposition_tt: "§RRetroceso tradicionalista:§! ira conservadora en el retiro de la familia tradicional infla la oposición nacionalista"
 JAP_traditionalist_backlash_stability_tt: "§RRetroceso tradicionalista:§! la ira conservadora en el retiro de la familia tradicional erosiona la estabilidad"
 JAP_japan_belongs_to_the_japanese: "Japón pertenece a los japoneses"
 JAP_japan_belongs_to_the_japanese_desc: "El Japón elevará la tasa de natalidad mediante subsidios familiares, incentivos pronatalistas y renovación cultural. El Estado se compromete al gasto permanente de bienestar, independientemente de si nacen los nacimientos. Este camino cambia la incertidumbre fiscal de la disminución por la certeza de los derechos irreversibles."
 JAP_pronatalist_turn: "Más una iniciativa"
 JAP_pronatalist_turn_desc: "Japón lanzará una campaña integral para fomentar el comportamiento infantil como prioridad cívica, inspirando la estrategia 'Plus One' de principios del siglo 2000. Mediante incentivos fiscales, mensajería pública y reconocimiento cultural de las familias con múltiples hijos, el Estado cambiará las actitudes sociales hacia las familias más grandes al tiempo que proporcionará apoyo concreto que hace que la paternidad sea más asequible y atractiva."
 JAP_national_revival_campaign: "Iniciativa regional de revitalización"
 JAP_national_revival_campaign_desc: "Japón canalizará la inversión en las regiones, reviviendo comunidades locales que han hundido a medida que los jóvenes se dirigen hacia Tokio. Al crear empleos, mejorar las comodidades y restaurar la fe en el Japón provincial, buscamos anclar familias fuera de la metrópoli y frenar la concentración de población que profundiza el descenso rural. Las regiones fuertes son la base para familias estables y tasas de natalidad sostenibles."
 JAP_three_generation_household: "El hogar de tres generaciones"
 JAP_three_generation_household_desc: "El Japón subvencionará a hogares de tres generaciones mediante incentivos fiscales y apoyo a la vivienda, reviviendo un acuerdo en el que los abuelos proporcionan cuidado infantil y cuidados mayores sin salarios del mercado. El estado descarga los costos de bienestar en bonos familiares, reduciendo su propio gasto. Cuidado dado en casa es cuidado que el estado no paga por."
 JAP_homeland_production_drive: "Monozukuri en casa"
 JAP_homeland_production_drive_desc: "El Japón profundizará su compromiso con la fabricación nacional, invirtiendo en la automatización y la capacitación de los trabajadores para maximizar el rendimiento de una mano de obra que disminuye. En lugar de la producción offshore o los migrantes de alquiler, Japón persigue la tradición monozukuri, el arte de hacer las cosas bien. La compensación es la tensión energética y costos más altos."
 JAP_incentivize_large_families: "Ampliación de la prestación por hijos"
 JAP_incentivize_large_families_desc: "El Japón ampliará el subsidio para los niños con hijos a cargo con generosos subsidios de efectivo que aumentarán con cada hijo adicional. Al hacer que la paternidad sea más asequible, el estado elimina una restricción vinculante en el tamaño de la familia. Una vez redactado en la ley, el subsidio se convierte en un derecho permanente que ningún gobierno futuro se atreverá a reducir."
 JAP_state_family_mandate: "La Familia como Estado Imperativo"
 JAP_state_family_mandate_desc: "Japón ordenará la formación de la familia mediante leyes laborales, incentivos a las pensiones y mensajes sociales para presionar a las mujeres hacia la maternidad y los hombres hacia la paternidad. Esta es la respuesta barata: el estado gasta poco mientras recluta a ciudadanos en reproducción. El costo es legitimidad y resentimiento."
 JAP_a_nation_reborn: "Una nación renacida"
 JAP_a_nation_reborn_desc: "La tasa de natalidad se ha estabilizado y comenzado a aumentar, la maternidad es honrada y las comunidades regionales son revitalizadas. El Japón ha revertido la declinación demográfica mediante una inversión pronatalista sostenida. Dos décadas de subsidios, subsidios a la vivienda y cuidados mayores se han endurecido en derechos que ningún gobierno futuro puede reducir."
 JAP_womenomics: "Womenomics"
 JAP_womenomics_desc: "El Japón movilizará a las mujeres en todos los sectores económicos desmantelando barreras, proporcionando atención infantil y cambiando la cultura empresarial. Esto desbloquea la capacidad productiva y los ingresos fiscales sin producir hijos adicionales. El Estado debe construir y dotar al sistema de cuidado infantil, y el conservador Japón lo leerá como un ataque contra la familia."
 JAP_eliminate_daycare_waitlists: "Iniciativa para los niños no incluidos en la lista de espera"
 JAP_eliminate_daycare_waitlists_desc: "Japón implementará el Plan de Seguridad Infantil, ampliando guarderías, guarderías y atención post-escolar hasta que se vayan las listas de espera. La fuerte inversión en los salarios de los trabajadores y la construcción de instalaciones elimina las limitaciones vinculantes para la participación de las mujeres en la fuerza laboral. Estas instalaciones deben estar dotadas y financiadas en perpetuidad."
 JAP_reform_spousal_tax_deduction: "Desmantelar el 1.03 Millón de Yen Muro"
 JAP_reform_spousal_tax_deduction_desc: "Japón eliminará el acantilado de deducción tributaria esponsal en 1,03 millones de yenes y reestructurará los umbrales del seguro social detrás de él. Esto elimina la penalización del empleo a tiempo completo que ha encerrado a millones de mujeres en trabajo a tiempo parcial. Destruir el muro libera un gran grupo de mujeres con experiencia y educación en empleos a tiempo completo."
 JAP_normalize_parental_leave: "Campaña de Ikumen"
 JAP_normalize_parental_leave_desc: "Japón lanzará la campaña de Ikumen, garantizando la licencia parental pagada a ambos padres y presionando a los hombres para que lo tomen. Cuando los padres se convierten rutinariamente en cuidadores, las mujeres ya no están atrapadas por la maternidad y la carga es compartida. Las empresas llevarán el costo en la salida perdida, y la generación del hombre de sueldo no concederá silenciosamente."
 JAP_women_in_management: "The 202030 Initiative"
 JAP_women_in_management_desc: "Japón alcanzará el objetivo 202030: tres de cada diez puestos directivos ocupados por mujeres. La Ley de Promoción de la Participación y el Adelanto de la Mujer en el lugar de trabajo establece objetivos corporativos y públicos vinculantes, refuerza la divulgación y recompensa a las empresas que lideran el cambio. Las mujeres tendrán un poder significativo en todas las juntas y oficinas de servicios civiles."
 JAP_family_first_model: "Trabajo Reforma del estilo: Camino de la familia"
 JAP_family_first_model_desc: "El movimiento Work Style Reform priorizará la vía familiar: programación flexible, trayectorias de carrera a tiempo parcial y subsidios infantiles ampliados permitirán que las mujeres permanezcan en la fuerza laboral sin sacrificar la posibilidad de maternidad. Este camino acepta una menor producción general para preservar tanto las carreras como los nacimientos, asegurándose de que la estabilidad social y la modesta recuperación demográfica importan más que el máximo crecimiento económico."
 JAP_career_first_model: "Reforma del estilo de trabajo: camino profesional"
 JAP_career_first_model_desc: "El movimiento Work Style Reform prioriza la trayectoria profesional: no hay flexibilidad, ni pistas a tiempo parcial, sino una verdadera igualdad en el progreso y la remuneración. Las mujeres compiten en pie de igualdad por cada posición, maximizando la producción económica y los ingresos femeninos. Esto hace que la maternidad sea más difícil, y las tasas de natalidad caerán más lejos mientras muchos eligen la ambición sobre la familia."
 JAP_a_society_where_women_thrive: "Una sociedad donde las mujeres atraen"
 JAP_a_society_where_women_thrive_desc: "Las barreras estructurales han caído y las mujeres trabajan en todos los niveles con verdadera igualdad y elección, profundizando la fuerza laboral y la base tributaria por igual. Lo que la reforma nunca dio fue a los niños. Japón trabaja más y gana más, aún en contracción, sostenida por un aparato de cuidado infantil y educación que el Estado debe financiar para siempre."
 JAP_open_japan: "Japón abierto"
 JAP_open_japan_desc: "Japón atraerá sistemáticamente a los trabajadores del extranjero mediante pactos migratorios, inmigración basada en habilidades y reforma de visados para llenar la brecha laboral. Esto cierra la escasez laboral en años más que décadas, asegurando el pleno empleo y la solvencia de las pensiones. La identidad cultural es tensa, las comunidades cambian más rápido que el consentimiento, y cada paso invita al retroceso nacionalista."
 JAP_labor_migration_pact: "Acuerdos bilaterales de movilidad laboral"
 JAP_labor_migration_pact_desc: "Japón formalizará acuerdos laborales bilaterales con países vecinos, ampliando el Programa de Formación Técnica Interna y estableciendo nuevos acuerdos recíprocos para llevar a los trabajadores a la construcción, agricultura, atención de enfermería y fabricación. Estos pactos son rápidos y eficientes: decenas de miles de trabajadores pueden estar a bordo dentro de meses, llenando brechas laborales críticas y estabilizando el empleo en sectores que de otro modo contraerían o desaparecerían por completo."
 JAP_points_based_immigration: "Programa Profesional de alta habilidad"
 JAP_points_based_immigration_desc: "Japón establecerá un sistema basado en puntos para profesionales altamente cualificados, otorgando puntos de calificación, experiencia laboral, capacidad lingüística y residencia previa. Ingenieros, enfermeras, investigadores y profesionales de finanzas llenan empleos de alto valor y facilitan la limitación del crecimiento. Las llegadas hábiles traen a las familias y esperan la escolarización internacional, un costo que el Estado absorbe a cambio de capacidad de investigación que no podría comprar de otro modo."
 JAP_integration_programs: "Marco de integración de Tabunka Kyosei"
 JAP_integration_programs_desc: "Japón invertirá en la integración activa, tabunka kyosei, a través de clases de idiomas, centros comunitarios y vías de residencia permanente para los trabajadores migratorios y sus familias. Los recién llegados dados las herramientas para pertenecer generan menos fricción y contribuyen más plenamente. La enseñanza de idiomas, la escolarización y el bienestar de las familias migrantes se convierten en una carga presupuestaria permanente que recupera los costos de migración no gestionados en la policía."
 JAP_multicultural_society: "Una sociedad multicultural"
 JAP_multicultural_society_desc: "El Japón extiende la condición jurídica, la participación cívica y el reconocimiento cultural a los migrantes y sus hijos como miembros plenos de la comunidad nacional. Es una profunda ruptura con la insularidad histórica, convirtiendo el resentimiento potencial en pertenencia y sostenimiento de la estabilidad social. Los derechos cívicos y sociales completos para millones de nuevos japoneses son costosos, derechos permanentes que no volverán a salir de la educación y cuentas sociales."
 JAP_guest_worker_system: "Ampliación de la visa del trabajador calificado especificado"
 JAP_guest_worker_system_desc: "Japón ampliará la visa de trabajo con habilidades específicas, tokutei gino, trayendo a los trabajadores en contratos de plazo fijo para la construcción, agricultura, cuidado de enfermería y fabricación. Vienen, hacen el trabajo y regresan a casa cuando termina el contrato, llenando la brecha laboral sin la fricción de la inmigración permanente. Crea una población rotativa con pocas protecciones y sin participación en la comunidad, y la policía se convierte en un costo de negocio permanente."
 JAP_an_open_nation: "Una nación abierta"
 JAP_an_open_nation_desc: "La población japonesa se ha estabilizado y crecido a través de la migración, transformando un país monoétnico en multicultural. La estabilidad económica y la solvencia de las pensiones se mantienen, pero el sentido de la homogeneidad étnica se ha fracturado y la generación mayor llora a una nación que pasa. La policía, la escolarización y la provisión social para una población que llegó más rápido de lo que se construyeron las instituciones permanecerán elevadas por una generación."
 JAP_economic_sectors: "Sectores económicos de Japón"
 JAP_economic_sectors_desc: "Desde la agricultura localmente arraigada, la silvicultura y la pesca hasta la fabricación, los servicios y las tecnologías avanzadas, sacaremos las fortalezas de Japón en todo el paisaje industrial. Si bien apoyamos el empleo y la capacidad de oferta nacionales, equilibraremos la competitividad de las exportaciones con la inversión en nuevas esferas de crecimiento, llevando nuestra base industrial hacia adelante en la próxima era."
 JAP_agricultural_revitalization: "Revitalización de las industrias primarias"
 JAP_agricultural_revitalization_desc: "El Ministerio de Agricultura, Silvicultura y Pesca revisa por primera vez la Ley Fundamental en un siglo cuarto, que obliga a los tres sectores a adoptar una estrategia nacional unificada para la seguridad alimentaria. A medida que el agricultor promedio envejece hacia setenta y los campos abandonan por todo el campo, esta integración se convierte en la base para la recuperación rural y toda reforma que sigue."
 JAP_corporate_farm_consolidation: "Farmland Banks y el Fin de Gentan"
 JAP_corporate_farm_consolidation_desc: "Los bancos de consolidación de tierras agrícolas reúnen parcelas dispersas en grandes extensiones mientras que la abolición de la cuota de arroz del gentán termina medio siglo de pagar a los agricultores para dejar campos de barbecho. La mecanización y la disciplina del mercado elevarán la productividad, pero los pequeños productores de familia que no pueden competir serán expulsados de la tierra."
 JAP_revitalize_rural_communities: "Estrategia regional de revitalización"
 JAP_revitalize_rural_communities_desc: "Bajo la bandera de chiho sosei, el gobierno sostiene la agricultura en distritos remotos a través de pagos directos y canales de riqueza urbana de regreso a los pueblos a través del impuesto de la ciudad natal, incitando a las familias jóvenes a establecer donde campos volverían al desierto. El crecimiento aquí es más lento que la consolidación corporativa, pero mantiene vivo el campo."
 JAP_smart_rice_farming: "Smart Farming y la artesanía de Sake"
 JAP_smart_rice_farming_desc: "Japón empareja el patrimonio del arroz con la agricultura inteligente: guía por satélite, drones y paddies basados en sensores permiten que una fuerza de trabajo envejecedora tiende más tierra con menos manos. Las marcas Premium como Koshihikari y la sed global de sake japonés llevan la cosecha a las mesas en casa y en el extranjero."
 JAP_premium_wagyu_brand: "La marca Wagyu Export"
 JAP_premium_wagyu_brand_desc: "Sobre la base de indicaciones geográficas protegidas y la ley que protege la genética wagyu del contrabando, Japón desarrolla la raza en una exportación premium que ordena su precio sobre procedencia y calidad en lugar de volumen. Los mejores restaurantes del mundo llevarán carne japonesa."
 JAP_sustainable_fisheries: "Reforma de la Ley de Pesca"
 JAP_sustainable_fisheries_desc: "La reforma de la Ley de Pesquerías 2018, la primera revisión en setenta años, impone cupos de captura basados en la ciencia y recompensa a la pesca responsable mientras se vierte la inversión en la acuicultura desde el aleta azul cultivada hasta los mariscos costeros. Los mares sostenibles mantendrán las ciudades costeras trabajando y la cultura alimentaria de la nación abastecida."
 JAP_forestry_revival: "El impuesto sobre el medio ambiente forestal"
 JAP_forestry_revival_desc: "Financiado por el impuesto sobre el medio ambiente forestal, Japón delga y replanta plantaciones descuidadas de cedro y ciprés, mecaniza la tala y promueve la madera cruzada para que la madera doméstica regrese a los sitios de construcción. Un sector forestal revivido trae trabajo de vuelta a las aldeas montañosas y convierte un recurso de larga duración en fuerza nacional."
 JAP_pharmaceutical_powerhouse: "Frente a la carga de drogas"
 JAP_pharmaceutical_powerhouse_desc: "El tercer mercado farmacéutico más grande de Japón es llevado a cabo por Takeda, Astellas, Daiichi Sankyo y Chugai, pero un aumento de la droga deja pacientes esperando años para medicamentos en el extranjero. El gobierno simplifica la aprobación de PMDA y respalda la medicina biotecnológica y regenerativa, convirtiendo una industria madura en un motor de crecimiento de alto valor."
 JAP_rural_revitalization: "La Sexta Industrialización"
 JAP_rural_revitalization_desc: "Bajo la sexta industrialización, rokuji sangyoka, los productores primarios también procesan y venden lo que producen. Las granjas, los alimentos regionales marcados y las ventas directas de consumidores convierten a los pueblos en destinos que luchan, llevando a las familias jóvenes de vuelta a la tierra como el ancla más fiable contra la marea demográfica."
 JAP_agricultural_construction_drive: "Unidad de construcción agrícola"
 JAP_agricultural_construction_drive_desc: "Un impulso nacional concertado para romper terreno en nuevas tierras agrícolas y zonas rurales, mientras que la voluntad política y los subsidios están alineados, acelerando la construcción en todo el campo."
 JAP_automotive_industry: "Las Ruedas de la Nación"
 JAP_automotive_industry_desc: "Siete fabricantes japoneses juntan ocho millones de vehículos al año, sosteniendo aproximadamente uno de cada doce puestos de trabajo japonés incluyendo fabricantes de piezas, distribuidores y transportadores. Desde las salas de montaje de Aichi hasta los muelles exportadores de Yokohama, Japón defenderá su lugar como el mayor exportador mundial de vehículos."
 JAP_lean_production_system: "El sistema de producción Toyota"
 JAP_lean_production_system_desc: "El sistema de producción Toyota ha moldeado la fabricación moderna a través del suministro justo en tiempo, jidoka y kaizen búsqueda de eliminar muda, permitiendo que las plantas japonesas construyan más coches con menos defectos y menos inventario que cualquier rival. Japón extenderá disciplina magra en toda la industria, capacitando a una generación para ver residuos donde otros no ven ninguno."
 JAP_keiretsu_supplier_network: "El Keiretsu Proveedor Web"
 JAP_keiretsu_supplier_network_desc: "Detrás de cada coche terminado se encuentra una pirámide de proveedores ligados por décadas de confianza: Denso, Aisin, Toyota Industries y miles de tiendas más pequeñas cada uno un maestro de su artesanía a través de la disciplina monozukuri. Japón profundizará estos lazos de keiretsu y garantizará la supervivencia de los proveedores de nivel dos y tres, haciendo que la resistencia a la cadena de suministro sea un activo estratégico."
 JAP_precision_machine_tools: "Los robots que construyen los coches"
 JAP_precision_machine_tools_desc: "FANUC y Yaskawa dominan el mercado mundial de robots industriales, mientras que Yamazaki Mazak, DMG Mori y Okuma establecen el estándar en herramientas de máquina de precisión. A medida que la fuerza laboral envejece y se contrae, Japón invertirá fuertemente en robótica y mecatrónica, manteniendo a la nación el taller que equipa las fábricas del mundo."
 JAP_domestic_champions: "El estándar Lexus"
 JAP_domestic_champions_desc: "Lexus demostró que Japón podría desafiar las casas de lujo alemanas en su propio terreno, una lección que desde entonces se ha extendido por toda la industria. Japón cultivará el valor de la marca de su ingeniería y perseguirá los segmentos de alto nivel, compitiendo en calidad y prestigio más que precio solo."
 JAP_hybrid_powertrains: "La revolución híbrida"
 JAP_hybrid_powertrains_desc: "El Prius demostró que Japón podría apostar donde otros temían, casarse con motor de gasolina y motor eléctrico sin exigir la red de carga que el mundo todavía no tenía. Japón se doblará en este camino híbrido, refiniéndolo en el puente pragmático entre la edad del petróleo y lo que viene después."
 JAP_battery_electric_shift: "El juego eléctrico de la batería"
 JAP_battery_electric_shift_desc: "El Nissan Leaf fue el primer coche eléctrico de mercado masivo, sin embargo Japón ha visto a rivales correr por delante con energía de batería pura. Para ponerse al día, el gobierno se compromete a estrellar programas en células del estado sólido y una ola de gigafactorias domésticas, por lo que la parte más valiosa del coche se construye en casa."
 JAP_hydrogen_society: "Hacia una sociedad de hidrógeno"
 JAP_hydrogen_society_desc: "El sedán de células de combustible Mirai y la Estrategia Básica de Hidrógeno pusieron en marcha una visión donde los coches, camiones, hogares y centrales eléctricas funcionan con el elemento más abundante del universo, emitiendo nada más que agua. Japón construirá la red de repostaje y respaldará a los fabricantes de pilas de combustible, persiguiendo hidrógeno como una respuesta claramente japonesa al final de la combustión."
 JAP_automotive_superpower: "La Superpotencia de Movilidad"
 JAP_automotive_superpower_desc: "Japón no se verá obligado a elegir un solo camino hacia el futuro. Al dominar el híbrido, la batería y la célula de combustible de una sola vez manteniendo las plantas magras y la red proveedora que los construyen los mejores del mundo, Japón asegura su lugar como la superpotencia de movilidad del siglo."
 JAP_automotive_retooling_drive: "Línea de montaje"
 JAP_automotive_retooling_drive_desc: "Un impulso nacional para retocar y modernizar las líneas de montaje automotriz, retransmitiendo las plantas para la próxima generación de vehículos mientras que la inversión y la voluntad política están alineadas."
 JAP_battery_gigafactory_program: "Programa de baterías Gigafactorias"
 JAP_battery_gigafactory_program_desc: "Un empuje concentrado para soportar gigantes de batería doméstica, potenciando la capacidad de producción celular a velocidad para que el corazón del coche eléctrico sea construido en casa y no importado."
 JAP_motorcycle_kingdom: "Reino de Dos Ruedas"
 JAP_motorcycle_kingdom_desc: "Honda, Yamaha, Kawasaki y Suzuki construyen la abrumadora mayoría de dos ruedas potenciadas en la Tierra, desde el paso del conmutador que mueve cientos de millones a través del sudeste asiático a superbikes de clase literaria dominando las rejillas MotoGP y World Superbike. Japón invertirá en plantas de dos ruedas y defenderá el liderato de ingeniería que mantiene a rivales persiguiendo motores japoneses una generación detrás."
 JAP_kei_car_mobility: "La Nación del Car de Kei"
 JAP_kei_car_mobility_desc: "Casi dos de los cinco coches nuevos vendidos en Japón pertenecen a la clase kei, minicars capped a 660cc por un código tributario escrito para un país más pobre, y como la población envejece fuera de las ciudades el coche kei se convierte en la última manera práctica para que los pensionistas lleguen a la clínica o a la tienda. Japón mantendrá la clase de kei asequible y bien construido, manteniendo la movilidad donde los trenes ya no funcionan."
 JAP_jdm_soft_power: "La Nación Gran Turismo"
 JAP_jdm_soft_power_desc: "El Skyline GT-R, el Supra y el RX-7 se han convertido en iconos globales de la cultura del automóvil a través de anime como el inicial D y la franquicia Gran Turismo, que enseñó una generación de jugadores para amar la placa JDM. Japón cultivará esta exportación de imagen junto con el acero, las tiendas de respaldo, la cultura del touge y el patrimonio del automovilismo que hacen los coches japoneses de rendimiento objetos de devoción mundial."
 JAP_export_wharves: "Las ballenas de exportación"
 JAP_export_wharves_desc: "Aproximadamente la mitad de cada vehículo montado en Japón roda sobre vehículos portaaviones en Yokohama, Nagoya o Kobe, destinados a puertos de todo el mundo, lo que convierte a Japón en el mayor exportador de vehículos del planeta. El gobierno ampliará los muelles, los patios de mariscales y la flota portadora que mantiene este flujo de automóviles hacia fuera sin interrupción."
 JAP_automotive_export_drive: "Automotriz Export Drive"
 JAP_automotive_export_drive_desc: "Un empuje nacional limitado por el tiempo para ampliar la capacidad de montaje y planta de exportación, añadiendo turnos y espacio en las plantas de automóviles y componentes mientras que los libros de orden de exportación están llenos."
 JAP_electronics_revitalization: "Revitalización de electrónicas y semiconductores"
 JAP_electronics_revitalization_desc: "La industria electrónica de Japón ha sido expulsada de mercados que una vez gobernó los competidores en Corea, Taiwán y China. Bajo la estrategia de revitalización semiconductora del METI, el estado marshala las fortalezas sobrevivientes en materiales, herramientas e ingeniería de precisión para reconstruir capacidad competitiva. El antiguo dominio del chip se puede recuperar si la inversión fluye ahora."
 JAP_semiconductor_materials: "Masters of Materiales and Equipment"
 JAP_semiconductor_materials_desc: "Japón nunca perdió su agarre en la corriente ascendente de la cadena de suministro de chips: Tokyo Electron domina la deposición y las herramientas de etch, Shin-Etsu y SUMCO suministran los wafers de silicio del mundo, y JSR y Tokio Ohka mantienen el mercado fotoresista. El gobierno amplía la inversión en ese apalancamiento, dejando cada fundición extranjera dependiente de materiales japoneses y máquinas japonesas."
 JAP_rapidus_moonshot: "El Rapidus Moonshot"
 JAP_rapidus_moonshot_desc: "Rapidus, respaldado por Toyota, Sony y el estado, compite con construir un fab de dos-nanometros en Chitose en Hokkaido en asociación con IBM e imec. Ninguna firma japonesa ha tocado el borde de corte en años y la brecha al TSMC se mide en miles de millones. Si aterriza, Japón vuelve a entrar en la frontera de la industria en un solo límite."
 JAP_foundry_partnership: "La Asociación de Fundamentos Kumamoto"
 JAP_foundry_partnership_desc: "Cuando Rapidus juega en el borde de corte, JASM en Kumamoto se asocia con TSMC y Sony para producir nodos maduros para automóviles y sensores. Es un techo inferior al de la luna y un piso debajo de la economía: fichas hechas en casa, en volumen, para las industrias que no pueden permitirse correr corto."
 JAP_semiconductor_sovereignty: "Soberanía semiconductora"
 JAP_semiconductor_sovereignty_desc: "Las casas de diseño, fabricantes de herramientas, proveedores de materiales y fabs están tejidas en un ecosistema doméstico autosuficiente. En una era de controles de exportación y puntos de ahogamiento, Japón no volverá a depender de la buena voluntad extranjera para el silicio que su economía continúa."
 JAP_home_electronics: "El fantasma de las Galápagos"
 JAP_home_electronics_desc: "El síndrome de Galápagos dejó la electrónica de consumo japonesa brillante en casa e inapropiado para la venta en el extranjero, y la característica gara-kei teléfono estaba obsoleto en el momento en que el smartphone aterrizó. Sharp, Sony y Panasonic han sido expulsados de los mercados que una vez gobernaron. El estado mantiene lo que queda, manteniendo las líneas de montaje y la artesanía viva mientras la industria encuentra su pie."
 JAP_gaming_powerhouse: "El Powerhouse Gaming"
 JAP_gaming_powerhouse_desc: "Las consolas de Nintendo están entre las más vendidas jamás hechas, PlayStation de Sony ancla un imperio global y Capcom, Sega, Square Enix y Bandai Namco suministran el software detrás de ambos. El gobierno expande la inversión de estudio y hardware y amplía el gasoducto de talento que mantiene a Japón en el centro del entretenimiento interactivo."
 JAP_rights_and_licensing_regime: "Derechos y licencias en el extranjero"
 JAP_rights_and_licensing_regime_desc: "Anime, manga, juegos y música llevan la imagen de Japón más allá de cualquier embajada, y la iniciativa Cool Japan existe para convertir ese alcance en ingresos. El estado invierte en distribución, traducción y gestión de derechos para que la producción creativa gana en el extranjero en lugar de filtrar allí. Todas las licencias se firman en virtud de la legislación sobre contratos extranjeros y las normas de radiodifusión extranjeras, y la industria aprende que un trato a la vez."
 JAP_broadband_nation: "Una nación en Fibre"
 JAP_broadband_nation_desc: "NTT y sus rivales pusieron fibra a la casa mientras que gran parte del mundo todavía se arrastraba sobre el cobre, dando a Japón algo de la conectividad más rápida y barata en la tierra. El gobierno extiende la fibra de alta capacidad en los últimos valles e islas submerecidas, por lo que ningún rincón del país se corta de la economía digital."
 JAP_beyond_5g: "Toward Beyond 5G"
 JAP_beyond_5g_desc: "Japón fue excluido de las guerras de teléfonos inteligentes y no tiene la intención de perder más allá de 5G. Los fondos estatales investigan consorcios y arquitecturas de red abiertas, desde la red de acceso a radio hasta la columna vertebral óptica, por lo que las empresas japonesas establecen los términos de las redes de los 2030 en lugar de simplemente comprarlas."
 JAP_electronics_superpower: "Superpotencia electrónica una vez más"
 JAP_electronics_superpower_desc: "Materiales, fabs en Hokkaido y Kyushu, consolas e infraestructura de fibra ahora completan toda la arquitectura electrónica. El viejo maestro de la era del silicio ha luchado su camino de regreso a la frontera. Seúl, Taipei y Shanghai deben contar con el regreso de Japón."
 JAP_energy_resource_strategy: "El Plan Estratégico de Energía"
 JAP_energy_resource_strategy_desc: "El Ministerio de Economía, Comercio e Industria coordina el Plan de Energía Básica a través de la generación de energía eléctrica, la resiliencia de la red y la seguridad de los recursos para aislar a la nación de las conmociones energéticas. Desde la energía nuclear hasta las reservas estratégicas, esta oficina dirige todo el aparato del estado hacia mantener las luces encendidas y las fundiciones alimentadas."
 JAP_renewable_energy_expansion: "La Revolución Arancelaria Feed-in"
 JAP_renewable_energy_expansion_desc: "El arancel alimentario desata la capacidad solar en Kyushu y las granjas eólicas fuera de Akita, mientras que los estándares de eficiencia Top Runner exprimen los residuos de cada aparato y línea de fábrica. Kyocera y Sharp se desplazan al comercio solar. El sol y el viento nunca pueden ser embargados."
 JAP_power_grid_stabilization: "Nunca más en la oscuridad"
 JAP_power_grid_stabilization_desc: "Nuevos convertidores de frecuencia y interconexores tejen al país en un único sistema resistente, recortando los cincuenta-hercios este y sesenta-hercios oeste dividen que una vez dividieron la red. Las utilidades se ordenan para mantener la capacidad de reserva y elegir si la energía solar, térmica o almacenamiento responde a cada choque como viene."
 JAP_resource_security_initiative: "Garantizar las noticias de la industria"
 JAP_resource_security_initiative_desc: "La estrategia nacional de recursos abarca las existencias estratégicas, la equidad minera en el extranjero, el reciclado y la zona económica exclusiva, todo ello destinado a aislar a la industria del embargo. Los ministerios dirigen el acero, el aceite y los metales raros a las fábricas que más las necesitan, convirtiendo la dependencia importada en resiliencia gestionada."
 JAP_hydroelectric_power: "Arnés los ríos de montaña"
 JAP_hydroelectric_power_desc: "Los ríos empinados y aluviosos de Japón giran turbinas fiables, mientras que estaciones de almacenamiento bombeado como el banco Kannagawa energía nocturna barata para el pico nocturno. Las presas remaquinadas empujan una mayor producción de infraestructura que el país ya posee. El flujo es limpio, doméstico y constante."
 JAP_hydroelectric_power_TT: "Aumento de energía hidroeléctrica generada en §Y[613.GetName]§!, §Y[615.GetName]§! y §Y[616.GetName]§! by §G25%§!"
 JAP_geothermal_development: "Fuego Debajo de las Islas"
 JAP_geothermal_development_desc: "La Organización Japonesa para Metales y Seguridad Energética financia la exploración geotérmica de Hachijojima a las tierras altas de Appi, sobre las objeciones de los parques nacionales y los dueños de hot-spring. Plantas de ciclo binario ofrecen el día y la noche de energía constante, cualquiera que sea el clima, aprovechando el calor del anillo de fuego para servir a la cuadrícula."
 JAP_geothermal_development_TT: "Aumento de la energía geotérmica generada §Y[609.GetName]§!, §Y[616.GetName]§! y §Y[617.GetName]§! by §G25%§!"
 JAP_nuclear_restart: "Restaurar los Reactores"
 JAP_nuclear_restart_desc: "Bajo la política de Transformación Verde, el gobierno trae a la flota nuclear en línea desde Sendai en Kyushu al vasto complejo Kashiwazaki-Kariwa en el Mar de Japón. Los reguladores son estrictos y el público es cuidadoso, pero la aritmética de la seguridad energética es imperdonable. El átomo debe llevar la carga base una vez más.\n-------------\nRe-enable nuclear generation and opens the §YReactor Restart Programme§!, in which each station is brought back one at a time. Sendai, Ikata y el clúster Fukui pueden iniciarse de inmediato; los sitios más difíciles siguen a medida que se completan las medidas reglamentarias y de consentimiento."
 JAP_nuclear_regulatory_compliance: "Conoce las nuevas normas de seguridad"
 JAP_nuclear_regulatory_compliance_desc: "Las estaciones que buscan reiniciar deben pasar las normas de la Autoridad Reguladora Nuclear, las más estrictas del mundo: beneficios sísmicos y tsunamis, instalaciones de seguridad obligatorias, y revisión que no otorga nada sobre confianza. El trabajo es lento y enormemente caro, y es el único camino a una flota de operaciones. Una estación que lo aclara funciona mejor de lo que hizo antes.\n-------------\nLimpia el espíritu de §YTightened Nuclear Safety Standards§! y abre los reiniciamientos Genkai, Onagawa y Shimane."
 JAP_local_consent_accords: "Win Local Consentimiento"
 JAP_local_consent_accords_desc: "Un reinicio requiere más que la aprobación del regulador, ya que los gobernadores prefecturales y municipios anfitriones tienen un veto efectivo y los tribunales de distrito han concedido inyecciones antes. Kagoshima y Ehime despejaron a Sendai e Ikata mediante acuerdos negociados de acogida-comunidad de donaciones, empleos y confianza local paciente. El régimen de subsidios es caro, y es lo que hace posible los reinicios más duros.\n-------------\nAbre los descansos de Tomari y Kashiwazaki-Kariwa, los dos sitios más difíciles del país."
 JAP_restart_flagship_fleet: "El ciclo de combustible Rokkasho"
 JAP_restart_flagship_fleet_desc: "La planta de reprocesamiento en Rokkasho en Aomori cierra el ciclo del combustible, recuperando plutonio y uranio del combustible gastado para su uso en nuevos reactores. Japón mantiene el plutonio separado y la capacidad permanente para enriquecerlo aún más, un hecho que Beijing, Seúl y Pyongyang nunca han dejado de notar.\n-------------\nLos vecinos de Japón tendrán una vista §Rdim§! del arsenal."
 JAP_decommissioning_authority: "El cierre largo"
 JAP_decommissioning_authority_desc: "Desmantelamiento de la flota lleva décadas con seguridad, un grupo reducido de ingenieros nucleares mantenidos juntos, y gestión del sitio mucho después de que los reactores se enfríen. El público respira más fácil y el balance no lo hace. Cada flota de reactores envejecidos en el mundo se enfrenta al mismo cálculo, y la nación que domina el trabajo primero puede vender la experiencia a todos ellos.\n-------------\nAbre el convertidor de frecuencia, interconexor Hokkaido y proyectos de hidrógeno Kobe."
 JAP_lng_bridge_supply: "El puente Fossil"
 JAP_lng_bridge_supply_desc: "El gas natural licuado y el carbón llenan la brecha que dejaron los reactores idled, haciendo de Japón el mayor importador de GNL del mundo. Las plantas a gas en Futtsu y Senboku se pueden construir rápidamente y funcionar con fuerza, pero cada carga es pagada en moneda extranjera. La factura de electricidad del hogar lleva la diferencia.\n-------------\nUn puente, y un §R costoso§! uno. El proyecto de co-firing amoníaco es cómo Japón eventualmente se baja."
 JAP_renewable_acceleration: "Sol, viento y agua"
 JAP_renewable_acceleration_desc: "Las subastas eólicas offshore en las zonas de Akita y Chiba, solar a escala de utilidades y las reglas reescritas de conexión de red impulsan la cuota renovable más rápido que el arancel de entrada únicamente gestionado. Los límites de intermitencia y cuadrícula permanecen, y el kilovatio-hora más barato sigue siendo el que Japón ha aprendido a no utilizar."
 JAP_fusion_energy_program: "El enfoque más amplio"
 JAP_fusion_energy_program_desc: "Japón se desplazó por albergar ITER y tomó el Enfoque más amplio a cambio: el acelerador de materiales de fusión y el centro internacional de investigación en Rokkasho, y el tokamak JT-60SA en Naka. Superconducting coils, gyrotrons, and a long apprenticeship in plasma physical are the return on that bargain.\n-------------\nYa sea que los reactores reinician o desaceleran, el caso para la fusión sostiene. Esta es la única apuesta energética §Y, ya sea por carretera§!."
 JAP_national_energy_security: "Una nación poderosa"
 JAP_national_energy_security_desc: "Un suministro estable y resiliente (carga base restaurada o una red de almacenamiento renovable) que descansa en una base de investigación que llega a la fisión pasada. La seguridad energética se convierte en la base de la economía más amplia."
 JAP_monarchy_resource_anchor_tt: "Se mejorarán los efectos de §Y$JAP_rare_earth_resilience$§!"
 JAP_reactors_recommissioned_tt: "Los reactores cerrados son §Grecomisados§! y pueden generar energía de nuevo"
 JAP_national_energy_security_tt1: "Con §Y6§! de los reactores §Y8§! en línea (actualmente §Y[?JAP_reactor_sites_online|0] §!):"
 JAP_national_energy_security_tt2: "Con §Y6§! de la §Y8§! proyectos de transformación ecológica ejecutados (actualmente §Y[?JAP_gx_projects_completed|0]§!):"
 JAP_national_energy_security_tt3: "Cayendo corto de cualquiera de las marcas:"
 JAP_minamitori_deep_sea: "El Mud of Minamitori"
 JAP_minamitori_deep_sea_desc: "El fondo marino dentro de la zona económica exclusiva de Japón alrededor de Minamitorishima posee barro poco profundo en concentraciones que no se encuentran en ninguna otra parte del planeta, acostada bajo más de cinco mil metros de agua. JOGMEC y la Universidad de Tokio financian los ensayos de elevación y levantamiento que harían posible la extracción en absoluto. Si el barro puede ser levantado, Japón se detiene dependiendo de un único proveedor extranjero para los metales que sus imanes y motores requieren."
 JAP_national_petroleum_stockpile: "Llenar las Reservas Nacionales"
 JAP_national_petroleum_stockpile_desc: "La Organización del Japón para Metales y Seguridad Energética amplía la reserva estratégica de petróleo que se mantiene en las granjas de tanques costeros de Shibushi, Kiire y Tomakomai, añadiendo silos salados y sobre el terreno. La reserva más grande compra a la nación meses de seguro contra un estrecho cerrado de Hormuz. Un tanque lleno es energía silenciosa."
 JAP_grid_battery_storage: "La Grid del Futuro"
 JAP_grid_battery_storage_desc: "GS Yuasa y Panasonic, veteranos de la edad de iones de litio, giran sus células hacia el almacenamiento a escala de cuadrículas mientras que los subsidios estatales subscriben las baterías que se elevan al lado de las subestaciones. Combinado con una cuadrícula más inteligente, el almacenamiento suaviza los picos y llena los pantalones. El electrón salvó al mediodía ilumina la ciudad al atardecer."
 JAP_urban_mining: "Mina las ciudades"
 JAP_urban_mining_desc: "En sus obras Naoshima y Onahama, Mitsubishi Materials recupera oro, cobre y metales raros de chatarra electrónica enviada desde todo el mundo. Las medallas de los Juegos Olímpicos de Tokio fueron golpeadas por el metal reclamado. Lo que el país tira, se funde de nuevo."
 JAP_horizontal_recycling: "Metal sin fin"
 JAP_horizontal_recycling_desc: "El reciclaje horizontal devuelve aluminio y acero a su grado original, cerrando el bucle entre el rascado y el molino de rodillos. UACJ y Kobe Steel construyen las líneas de clasificación y refinación que hacen trabajo de recuperación a escala industrial. Una tonelada mantenida en circulación es una tonelada nunca importada de nuevo."
 JAP_nankai_methane_hydrate: "Hielo de fuego del Nankai Trough"
 JAP_nankai_methane_hydrate_desc: "La Organización Japón para los Metales y la Seguridad Energética presiona sus buques de investigación hacia un método comercial para el hidrato de metano encerrado en el Nankai Trough frente a la costa del Pacífico. Japón llevó a cabo la primera prueba de producción offshore del mundo allí, y la ingeniería sigue sin ser probada mientras que la economía sigue siendo abrumadora. Si el rendimiento de hielo de incendios, Japón nunca necesita rogar por gas otra vez."
 JAP_model_competition: "Competencia electrónica de Asia Oriental"
 JAP_model_competition_desc: "La industria electrónica de Japón está bloqueada en un concurso implacable con sus vecinos. Samsung y SK Hynix dominan la memoria, TSMC posee el negocio de fundición de vanguardia, y las fabs chinas suben el nodo de escalera por nodo con el respaldo de un fondo estatal casi sin fondo. Cada avance de un rival es un mercado perdido, un margen apretado, una generación de ingenieros tentados en el extranjero. Sólo la inversión sostenida mantiene a raya la presión; deje que se escalen mientras la competencia aumenta, y el terreno da lugar bajo los pies de Japón.\n-------------\nLevantamiento §YResiliencia electrónica§! por encima de la presión competitiva se alivia y eventualmente elimina este espíritu nacional. Véase §Y$JAP_technological_isolation_category$§! para las cifras actuales."
 JAP_consumer_electronics_drive: "Consumidor Electronics Drive"
 JAP_consumer_electronics_drive_desc: "Un empuje limitado por el tiempo para mantener las líneas de electrónica interna de consumo funcionando a la capacidad, sosteniendo las plantas, los proveedores y las manos hábiles que los montan mientras la industria meteorea la tormenta."
 JAP_foundry_localization: "Programa de localización"
 JAP_foundry_localization_desc: "Un esfuerzo concentrado para localizar la cadena de suministro de fundición, levantar las herramientas, materiales y técnicos capacitados en torno a los nuevos fabs para que la producción de chips domésticos pueda rampar a velocidad."
 JAP_electronics_export_offensive: "La electrónica exporta ofensiva"
 JAP_electronics_export_offensive_desc: "Lanzar un impulso coordinado de subsidios, misiones comerciales y marketing conjunto para recuperar cuota de mercado de competidores extranjeros, gastando mucho para afianzar la posición de Japón en el comercio mundial de electrónica."
 JAP_electronics_resilience_up_tt: "§Y Resiliencia electrónica§! contra la competencia extranjera: $RIGHT|+=0$"
 JAP_CHI_chip_rivalry: "Rivalería de semiconductores"
 JAP_electronics.1.t: "Los Challengers asiáticos se acercan"
 JAP_electronics.1.d: "Las figuras trimestrales hacen una lectura sombría en Tokio. Samsung y SK Hynix han ampliado su ventaja en memoria, el libro de pedidos del TSMC está estallando, y las fundiciones chinas están ganando contratos que una vez llegaron a Japón por defecto. Los analistas hablan abiertamente de un sector de electrónica japonesa en declive estructural. Las salas de juntas de Kawasaki y Osaka saben la verdad: la competencia ya no se está poniendo al día, se está adelantando."
 JAP_electronics.1.a: "No cederemos el mercado sin una pelea."
 JAP_electronics.2.t: "China enfrenta a la frontera"
 JAP_electronics.2.d: "Las noticias aterrizan como un golpe de martillo. Las fabs chinas, probadas por el Fondo Nacional de Circuito Integrado y no disuadidas por años de sanciones occidentales, han alcanzado la vanguardia de la fabricación lógica que sólo un puñado de empresas en la tierra pueden tocar. La última asunción cómoda de la industria japonesa, que el continente permaneció una generación detrás, se ha ido. La frontera se ha movido, y Japón debe decidir si enfrentar el desafío o dejarse a su paso."
 JAP_electronics.2.a: "La frontera se ha movido. Debemos responder."
 JAP_electronics.3.t: "Japón reclama la corona de silicona"
 JAP_electronics.3.d: "Contra las probabilidades, la marea se ha convertido. Las fabs japonesas se envían en volumen, los materiales japoneses siguen siendo indispensables, y el diseño japonés y el comando de contenido respetan el mundo entero. Los rivales en Seúl, Taipei y Shanghai no se han ido, pero por primera vez en una generación son los que miran sobre sus hombros. El largo retiro ha terminado; Japón compite una vez más de una posición de fuerza."
 JAP_electronics.3.a: "Japón se encuentra una vez más en la cumbre de la industria."
 JAP_electronics.4.t: "Japón regresa a la frontera semiconductora"
 JAP_electronics.4.d: "En los fabs de Hokkaido a Kyushu, en los laboratorios de investigación y los estudios de juegos y las trincheras de fibra, Japón ha completado un resurgimiento pocos pensado posible. Un país escrito hace una década, ya que el titular de la era electrónica ha cerrado su camino de regreso a la vanguardia y notificado que significa permanecer allí. El equilibrio de la carrera tecnológica del Asia oriental ha cambiado, y cada capital de Seúl a Washington está recalculando."
 JAP_electronics.4.a: "A remarkable resurgence."
 JAP_electronics.4.b: "El viejo gigante todavía tiene dientes."
 JAP_demographic_pressure_modifier: "Presión demográfica"
 JAP_demographic_pressure_modifier_desc: "Japón es una de las sociedades más antiguas y más rápidas del mundo, con muertes que superan el número de nacimientos y la población en edad de trabajar en contracción aguda. Esta crisis desgarra la fuerza laboral que sostiene la producción, extiende los presupuestos sociales y sanitarios a sus límites, erosiona la estabilidad fiscal y prueba el tejido social. A través de seis ejes (población, fuerza laboral, estabilidad, desempleo, costos de salud y gastos sociales) Japón enfrenta presiones interrelacionadas. La reforma sostenida y polifacética a través de políticas pro-familia, empleo e inmigración puede aliviar estas cargas y poner a la nación en un camino hacia una población estable o creciente."
 JAP_economy_modifier: "Economía japonesa"
 JAP_economy_modifier_desc: "El motor compartido de la renovación económica de Japón. A medida que los sucesivos gobiernos enfrentan el declive demográfico y la creciente competencia de Corea, China y Taiwán, la reforma llega a cada pilar de la economía: los campos y las pesquerías que alimentan a la nación, los fabricantes de automóviles y las casas de herramientas que anclan sus exportaciones, los semiconductores y los campeones electrónicos corriendo para salir del estancamiento, el impulso para asegurar energía y recursos críticos para un archipiélago casi sin su propio, y las arterias ferroviarias que tejen las islas juntas. Cada compuestos avanzados aquí, elevando productividad, eficiencia de fábrica e investigación al mismo tiempo que redefine las demandas Japón coloca en su industria, sus recursos y su red eléctrica."
 JAP_political_modifier: "Kokkai"
 JAP_political_modifier_desc: "Las reformas emprendidas en respuesta a la crisis demográfica están remodelando la política nacional, abriendo al país a la migración y probando la cohesión social y la estabilidad de una nación que no está acostumbrada a cambiar."
 JAP_f15_programe_desc: "La flota F-15J construida con licencia de Mitsubishi se pone a través de una modernización escénica: nuevos radares, ordenadores de misión y pantallas de cabina en los marcos aéreos que valen la pena guardar, y una cadena de suministro racionalizada para el resto. El combate y la investigación aeroespacial corren más rápido, y los marcos de aire ligeros y medianos salen de la línea más barato."
 JAP_submarine_modernization_idea_desc: "La flota diesel-eléctrica se mueve a la propulsión independiente del aire y, más tarde, células de iones de litio, extendiendo resistencia sumergida sin un reactor. Kawasaki y Mitsubishi alternan los cascos en Kobe, que mantiene dos yardas competentes y conduce la unidad cuesta abajo."
 JAP_carrier_aviation_desc: "La aviación naval fija regresa por primera vez a la flota japonesa desde 1945. Los destructores de helicópteros se reevaluan a medida que los buques de aviación, los revestimientos y ascensores de cubierta son estudiados para aviones cortos despegue, y el trabajo doctrinal de operar un grupo aéreo portador comienza en serio."
 JAP_keen_sword_operation_idea_desc: "El ejercicio conjunto bienal con los Estados Unidos pone a la Fuerza Marítima de Autodefensa mediante maniobras combinadas de flota, aterrizajes anfibios y simulacros de defensa aérea en una escala que no puede alcanzar solo. Las tripulaciones vuelven más agudas, y las lecciones superan el ejercicio."
 JAP_nuclear_power_program: "Programa nuclear a largo plazo"
 JAP_nuclear_power_program_desc: "Cincuenta y dos reactores suministran aproximadamente un tercio de la electricidad de la nación, y el programa a largo plazo de la Comisión de Energía Atómica compromete a Japón a un ciclo cerrado de combustible construido alrededor del reprocesamiento en Rokkasho. El rendimiento operativo es excelente, pero el consentimiento se ha colapsado. El accidente de crítica en la planta JCO en Tokaimura mató a dos trabajadores y destruyó la confianza pública en la industria y sus reguladores, y en marzo de 2000 el gobierno puso en examen los planes de construcción para las veinte estaciones propuestas. Desde que la ciudad de Maki votó su reactor por referéndum, no se puede contar con prefectura para aceptar un nuevo sitio."
 JAP_nuclear_local_consent: "Acuerdos de Consentimiento Local"
 JAP_nuclear_local_consent_desc: "Los gobernadores de las prefecturas y los municipios anfitriones han regresado al proceso mediante acuerdos vinculantes de seguridad, intercambio de ingresos y un derecho de consulta previa sobre reiniciamientos. El veto que impedía la construcción nuclear japonesa para una generación ha sido negociado en lugar de anularse, y los servicios públicos pueden volver a planificar nuevas capacidades."
 JAP_consolidate_national_defense_framework_cancel_tt: "Termina una vez que el §YArtículo 9§! bono §Yestabilidad§! ha desvanecido y las penas a §YApoyo a la guerra§! y §YPoblación reclutable§! han sido completamente trabajados"
 JAP_modernize_joint_command_cancel_tt: "Termina una vez que el §YArtículo 9§! sanciones penales §Yejército, aire y experiencia naval ganan§!, §Ycomando power§! y §YGastos de oficiales§! han sido completamente trabajados"
 JAP_normalize_defense_procurement_mission: "Normalizar los sistemas de adquisiciones de defensa"
 JAP_normalize_defense_procurement_mission_desc: "La expansión de las responsabilidades de defensa ha puesto gran tensión en las adquisiciones existentes y los arreglos industriales. Mediante una reforma cuidadosa, planificación a largo plazo y coordinación más estrecha con la industria, Japón trabaja para normalizar las adquisiciones de defensa y reducir las ineficiencias del período de transición."
 JAP_normalize_defense_procurement_cancel_tt: "Termina una vez que el §YArtículo 9§! sanción penal §Yataque militar§! y §Yejército de defensa§! han sido totalmente trabajados y los bonos a §Yataque del territorio central§! y §Ydefensa del territorio central§! se han desvanecido"
 JAP_establish_asteroid_mining_network_mission: "Estableciendo la red de minería de asteroides"
 JAP_establish_asteroid_mining_network_mission_desc: "Japón arma su primera red de minería de asteroides, ubica plataformas orbitales y despliega equipo de prospección mientras empiezan a tomar forma las operaciones de recursos fuera del planeta."
 JAP_reactor_restart_category: "El programa de reiniciamiento del reactor"
 JAP_reactor_restart_category_desc: "Cincuenta y cuatro reactores abastecían antes un tercio de la electricidad de Japón. Tras 2011 todos se apagaron, y volver a encenderlos no es una sola decisión sino una campaña librada central por central, prefectura por prefectura. Cada reinicio exige una revisión regulatoria de años, el consentimiento de un gobernador que responde ante votantes asustados y una factura de refuerzos sísmicos de cientos de miles de millones de yenes. A cambio devuelve la energía de base más barata que el país tendrá jamás.\n\nCada reinicio completado §Gmejora de forma permanente§! la generación nuclear de Japón y reduce el costo de mantener la flota."
 JAP_restart_sendai: "Reiniciar Sendai"
 JAP_restart_sendai_desc: "Las dos unidades de agua a presión de Kyushu Electric en Satsumasendai, Kagoshima, fueron las primeras del país en cumplir las nuevas normas de seguridad, y en agosto de 2015 la unidad 1 de Sendai fue el primer reactor japonés en generar energía en casi dos años. El consentimiento del gobernador Ito lo hizo posible; el muro marino, la ventilación filtrada y el centro de control de emergencia lo hicieron defendible."
 JAP_restart_ikata: "Reiniciar Ikata"
 JAP_restart_ikata_desc: "La central de Shikoku Electric está en la estrecha península de Sadamisaki, en Ehime, con la Línea Tectónica Mediana a pocos kilómetros mar adentro. La unidad 3 volvió a funcionar en 2016 y desde entonces los tribunales de prefecturas vecinas la han detenido y restablecido más de una vez. Ninguna planta de Japón ilustra mejor que una licencia del regulador es solo la mitad de la batalla."
 JAP_restart_takahama_ohi: "Reiniciar el conjunto de Fukui"
 JAP_restart_takahama_ohi_desc: "La prefectura de Fukui alberga la mayor concentración de reactores del país. Las unidades de Kansai Electric en Takahama, Ohi y Mihama abastecieron durante décadas a la industria de Osaka y Kobe, y varias son ya tan antiguas que operarlas más allá de los cuarenta años exigió una prórroga aparte y discutida. Reiniciar el conjunto restablece de un solo golpe el suministro eléctrico del corazón industrial."
 JAP_restart_genkai: "Reiniciar Genkai"
 JAP_restart_genkai_desc: "La central de Kyushu Electric en la prefectura de Saga volvió en 2018 tras refuerzos que incluyeron una de las primeras instalaciones de seguridad especializadas construidas según las nuevas normas. Genkai también lleva el programa pluthermal de Japón, que quema combustible de óxidos mixtos y cierra parte del ciclo entre los reactores y la planta de reprocesamiento de Rokkasho."
 JAP_restart_onagawa: "Reiniciar Onagawa"
 JAP_restart_onagawa_desc: "Onagawa, en Miyagi, estaba más cerca del epicentro del terremoto de 2011 que Fukushima Daiichi, y su muro marino de catorce metros resistió. El pueblo refugió a evacuados en el propio gimnasio de la planta. Volver a poner en marcha la unidad 2 en 2024 fue el primer reinicio de un reactor de agua en ebullición del mismo tipo que falló en Daiichi, y fue el argumento más sólido de la industria."
 JAP_restart_shimane: "Completar la unidad 3 de Shimane"
 JAP_restart_shimane_desc: "La central de Chugoku Electric es la única planta nuclear de Japón situada dentro de la capital de una prefectura, en el borde de la propia Matsue. La unidad 3 se construyó pero nunca se puso en servicio, y quedó terminada e inactiva durante el largo apagón. Ponerla en servicio no es un reinicio sino un primer arranque, y la experiencia de construcción recuperada al hacerlo no volverá a perderse."
 JAP_restart_tomari: "Reiniciar Tomari"
 JAP_restart_tomari_desc: "Las tres unidades de Hokkaido Electric en Tomari son la única central nuclear de la isla del norte, y su pérdida dejó a Hokkaido dependiente de una delgada interconexión y de una capacidad térmica envejecida, como dejó dolorosamente claro el apagón general de la isla en 2018. La reevaluación sísmica del sitio se alargó más de una década. Restablecer Tomari es lo que vuelve íntegra la red de Hokkaido."
 JAP_restart_kashiwazaki_kariwa: "Reiniciar Kashiwazaki-Kariwa"
 JAP_restart_kashiwazaki_kariwa_desc: "Siete unidades en la costa de Niigata hacen de esta la mayor central nuclear jamás construida en ningún lugar. También es de TEPCO, la empresa que perdió Fukushima, y los gobernadores de Niigata llevan años negándose a olvidarlo. Los fallos de seguridad en el sitio costaron a la empresa su permiso de operación por completo durante un tiempo. Si Kashiwazaki-Kariwa puede volver, nada de la flota queda fuera de alcance."
 JAP_gx_transition_category: "La Transformación Verde"
 JAP_gx_transition_category_desc: "Un Japón sin reactores debe hallar su energía en otra parte, y el archipiélago carece de todo salvo viento, calor e ingenieros. La Transformación Verde es la respuesta: turbinas flotantes en aguas demasiado profundas para anclar, el calor volcánico bajo las montañas del norte, una red por fin tejida a través de la frontera de los cincuenta y sesenta hercios y, sobre todo, un talento nacional para usar menos de lo que nadie creía posible.\n\nCada proyecto completado §Gmejora de forma permanente§! la producción renovable de Japón o reduce la demanda nacional, y cierra para siempre los reactores de su región."
 JAP_gx_goto_floating_wind: "Eólica marina flotante de Goto"
 JAP_gx_goto_floating_wind_desc: "El fondo marino de Japón cae demasiado abruptamente para las bases fijas utilizadas en el Mar del Norte, por lo que las ambiciones eólicas offshore del país descansan en plataformas flotantes amarradas en aguas profundas. El array fuera de las islas Goto en Nagasaki es el terreno de prueba para la tecnología, y los astilleros que una vez construidos tanqueers son el lugar natural para fabricar los cascos."
 JAP_gx_tohoku_geothermal: "El Tohoku Geothermal Cluster"
 JAP_gx_tohoku_geothermal_desc: "Japón tiene la tercera mayor reserva geotérmica del mundo y casi no usa ninguna, bloqueado por los límites de los parques nacionales y por los propietarios de aguas termales que temen que la perforación se lleve su agua. Appi, en Iwate, rompió el estancamiento en 2024, la primera gran central geotérmica en décadas. Donde están los volcanes está la energía, y fluye lo mismo en la oscuridad que en la calma."
 JAP_gx_kanto_setsuden: "La campaña de Setsuden"
 JAP_gx_kanto_setsuden_desc: "En el verano tras el desastre, Tokio simplemente usó menos. Las oficinas atenuaron sus luces y abandonaron las corbatas, las fábricas pasaron sus turnos al fin de semana y la capital superó el pico sin los apagones que todos habían pronosticado. El setsuden debía ser una medida de emergencia. Hecho permanente mediante códigos de construcción, normas industriales y el programa Top Runner, vale más que una central eléctrica y cuesta una fracción de una."
 JAP_gx_frequency_converter: "La expansión del convertidor de frecuencias"
 JAP_gx_frequency_converter_desc: "Tokio corre a cincuenta hertz porque compró generadores alemanes en los años 1890, y Osaka corre a sesenta porque compró los americanos. Un siglo más tarde las dos mitades del país todavía no pueden compartir libremente el poder, y en 2011 el oeste sólo podría engañar a un solo gigavatio hacia el este mientras Tokio se oscureció. Ampliar las estaciones de convertidores en Sakuma, Shin-Shinano y Higashi-Shimizu finalmente hace una red nacional de dos."
 JAP_gx_hokkaido_hvdc: "El Interconexor Hokkaido"
 JAP_gx_hokkaido_hvdc_desc: "Hokkaido tiene el mejor recurso eólico de Japón y la menor cantidad de gente para usarlo, una combinación que deja las turbinas recortadas mientras Honshu quema gas importado. Un enlace de corriente continua de alta tensión por la costa del Mar de Japón lleva el viento del norte adonde está la demanda, y además habría mantenido las luces encendidas durante el apagón general de la isla en 2018."
 JAP_gx_kobe_hydrogen: "La cadena de suministro de hidrógeno Kobe"
 JAP_gx_kobe_hydrogen_desc: "El primer portador de hidrógeno licuado del mundo atracó en Kobe en 2022, completando una cadena de suministro que va desde campos de lignito australiano hasta un terminal en Port Island. Quemaduras de hidrógeno sin carbono y almacena lo que hacen las turbinas y la cuadrícula todavía no puede utilizar, y Kawasaki Heavy ha pasado una década construyendo los tanques, tanques y turbinas para manejarlo."
 JAP_gx_hekinan_ammonia: "Ammonia Co-Firing"
 JAP_gx_hekinan_ammonia_desc: "La planta de carbón en Hekinan en Aichi es la más grande del país, y JERA ha estado alimentando amoníaco en sus calderas junto al carbón, primero en una parte en cinco y apuntando constantemente más alto. La amoníaco lleva hidrógeno en una forma que los buques y oleoductos ya saben manejar, y permite que una flota existente de plantas térmicas queme menos combustible sin ser derribado y reconstruido."
 JAP_gx_shikoku_solar_storage: "Solar y almacenamiento de Shikoku"
 JAP_gx_shikoku_solar_storage_desc: "Shikoku tiene la luz solar más fuerte de Japón y una red tan pequeña que la producción solar del mediodía debe recortarse por falta de dónde ponerla. Emparejar arreglos de escala industrial con baterías de red traslada el excedente del mediodía al pico de la tarde, la diferencia entre una capacidad renovable que existe en el papel y una energía renovable que realmente se usa."
 JAP_rubber_butadiene_branch_decision: "Sucursal de caucho Butadiene"
 JAP_rubber_butadiene_branch_decision_desc: "El caucho natural puede cortarse, racionarse o encarecerse hasta la debilidad, y Japón no puede permitir que exista esa palanca. Ampliaremos una rama de caucho sintético a base de butadieno para asegurar neumáticos, juntas y componentes críticos para la industria y las fuerzas armadas."
 JAP_demand_south_kuril_reject_tt: "Podemos abrir una §Yguerra fronteriza§! sobre §Y$STATE_1168$§!, or §Rdeclarar la guerra [SOV.GetName]§! para apoderarse de los Territorios del Norte por la fuerza"
 JAP_demand_north_kuril_reject_tt: "Podemos abrir una §Yguerra fronteriza§! sobre §Y$STATE_1168$§!, or §Rdeclarar la guerra [SOV.GetName]§! para apoderarse de los Territorios del Norte por la fuerza"
 JAP_demand_sakhalin_reject_tt: "Podemos abrir una §YFuerzas Especiales Raid§! on §Y$STATE_691$§!, or §Rdeclarar la guerra [SOV.GetName]§! para apoderarse de los Territorios del Norte por la fuerza"
 JAP_claiming_philippines: "Reclamar el archipiélago filipino"
 JAP_claiming_philippines_desc: "El archipiélago filipino dirige los enfoques del Pacífico occidental y las vías marítimas que alimentan nuestra industria. Pondremos una reclamación formal y dejaremos claro que estas islas caen dentro de la esfera estratégica del Japón, ya sea que otros aprueben o no. Una vez declarado, la región comprenderá que nuestra armada tiene la intención de decidir quién pasa por estas aguas."
 JAP_demographic_emergency_taskforce: "Reducción de la respuesta en casos de emergencia por nacimientos"
 JAP_demographic_emergency_taskforce_desc: "En respuesta al colapso demográfico, el Gobierno ha establecido un grupo de tareas de emergencia de todo el gobierno, que refleja la estructura del Organismo para la Infancia y la Familia y coordina el rápido despliegue de recursos en todos los ministerios pertinentes. La atención política es intensa, los silos burocráticos se descomponen y se hace posible un aumento de la experimentación política. Esta ventana de intenso enfoque y movilización es temporal; después de 730 días de esfuerzo sostenido, la atmósfera de emergencia se desvanece y la formulación de políticas revierte a patrones institucionales normales, aunque las propias reformas soportan."
 JAP_increase_birth_budget: "Duplicación de emergencia de la asignación por hijo"
 JAP_increase_birth_budget_desc: "Japón inyectará fondos de emergencia del tesoro en el sistema de asignación por hijo y duplicará las transferencias directas de efectivo a los hogares con hijos. Este gasto inmediato y muy visible da alivio a las familias jóvenes y señala el compromiso del Estado con la paternidad, y eleva la natalidad a corto plazo. El costo a largo plazo es sustancial y engorda el presupuesto permanente de prestaciones, pero los dividendos demográficos justifican el gasto mientras los nacimientos sigan deprimidos."
 JAP_child_care_subsidies: "Educación y cuidado universales de la primera infancia"
 JAP_child_care_subsidies_desc: "Siguiendo la política de octubre de 2019, Japón hará gratuitas la educación y el cuidado de la primera infancia para todas las familias y eliminará las matrículas de guardería y preescolar. El subsidio quita una barrera importante al empleo de los padres, devuelve al mercado laboral a quienes cuidan, sobre todo madres, y permite a hogares con ingresos limitados tener más hijos. El programa es caro pero da ganancias de empleo y una modesta mejora de la fertilidad."
 JAP_invest_in_robotics: "Impulso de automatización Sociedad 5.0"
 JAP_invest_in_robotics_desc: "Japón acelerará la Nueva Estrategia de Robots de 2015, subvencionando la automatización industrial, la IA y la robótica para compensar a los trabajadores que faltan. Al reemplazar el trabajo humano en construcción, manufactura y logística por máquinas, Japón puede mantener la producción con una fuerza laboral menor. La estrategia es intensiva en capital pero poderosa, aunque el desplazamiento de trabajadores poco cualificados puede subir al principio el desempleo antes de que surjan nuevos puestos en operación y mantenimiento."
 JAP_fertility_ivf_program: "Cobertura de seguro de fecundación in vitro"
 JAP_fertility_ivf_program_desc: "Japón ampliará la cobertura del seguro de fecundación in vitro (FIV) y de la tecnología de reproducción asistida, para que el tratamiento sea accesible a todas las parejas elegibles sin importar sus ingresos. Desde 2022, los subsidios del seguro quitan la barrera económica al tratamiento de la infertilidad y permiten tener hijos a parejas que de otro modo seguirían sin ellos. El impacto en la natalidad es fuerte, pero la carga de costos del sistema sanitario sube bruscamente y presiona las finanzas públicas."
 JAP_family_housing_construction: "Programa de vivienda familiar asequible"
 JAP_family_housing_construction_desc: "Japón financiará la construcción a gran escala de viviendas asequibles de tamaño familiar para hogares con hijos. Los altos costos del suelo y la vivienda son una barrera importante para formar familias; la construcción subvencionada baja el umbral financiero para que las parejas jóvenes se casen y tengan hijos. El programa es intensivo en capital pero estabiliza la sociedad al ofrecer a las familias jóvenes un camino creíble a la propiedad de vivienda y señala el compromiso del Estado con su futuro."
 JAP_marriage_support_program: "Newwed Support Initiative"
 JAP_marriage_support_program_desc: "Japón subvencionará a las parejas recién casadas con ayudas de vivienda y servicios de emparejamiento, incluida la financiación de programas de konkatsu («caza de matrimonio») y plataformas de emparejamiento con IA. El Estado también se asociará con los gobiernos locales para organizar eventos matrimoniales a nivel comunitario. Al reducir la fricción financiera y social en torno a la formación del matrimonio, el programa empuja la natalidad al alza con menor costo fiscal que los incentivos a la maternidad por sí solos, aunque el efecto es modesto."
 JAP_raise_retirement_age: "Ley de Estabilización del Empleo de los Mayores"
 JAP_raise_retirement_age_desc: "Japón elevará gradualmente la edad oficial de jubilación hacia los 70, ampliando las cotizaciones obligatorias de empleo y aplazando la elegibilidad a la pensión. Siguiendo la legislación de 2021, el Estado incentivará a los empleadores a retener a los trabajadores mayores y los presionará para que ofrezcan empleo continuado más allá de la marca tradicional de 65 años. Es políticamente doloroso, los trabajadores protestan por los años extra de trabajo y el gobierno debe gastar capital político para imponerlo, pero la fuerza laboral se amplía directamente y la carga de las pensiones se alivia."
 JAP_silver_employment_initiative: "Centros de Recursos Humanos Silver"
 JAP_silver_employment_initiative_desc: "Japón establecerá y financiará Centros de Recursos Humanos Silver en todas las grandes ciudades, que ofrecerán colocación a tiempo parcial, reciclaje y tutoría para mayores sanos de más de 65 años. Estos centros emparejarán a jubilados con experiencia con empleadores que necesitan mano de obra flexible en limpieza, seguridad, apoyo al cuidado infantil y administración. El programa es barato, preserva la dignidad y suma trabajadores productivos sin elevar la edad obligatoria de jubilación, y alivia la presión del desempleo a un costo modesto."
 JAP_preventive_health_program: "Health-Life-Expectancy Initiative"
 JAP_preventive_health_program_desc: "Japón invertirá en salud preventiva de toda la población: cribados subvencionados, vacunas, asesoramiento sobre estilo de vida e intervención temprana en enfermedades crónicas. Al mantener a la población que envejece más sana y funcionalmente independiente durante más tiempo, el Estado reduce los años pasados en costosos cuidados intensivos y residencias de ancianos. El programa es pura prevención (no tratar la enfermedad sino evitarla) y rinde altos retornos en menores costos sanitarios mientras los mayores siguen activos y autosuficientes hasta los 80 años."
 JAP_elderly_care_reform: "Modernización del sistema de cuidados de larga duración"
 JAP_elderly_care_reform_desc: "Japón reestructurará el sistema de Seguro de Cuidados de Larga Duración para pasar de la atención institucional (residencias) a una atención integrada y comunitaria: ayudantes a domicilio, centros de día, clínicas locales y apoyo familiar en lugar de costosos centros residenciales. Al reducir la dependencia de instituciones costosas y movilizar a las comunidades, el Estado recorta tanto el presupuesto sanitario como el de atención social. La transición es disruptiva, algunos pierden la atención institucional preferida y la administración se tensa durante el cambio, pero los ahorros a largo plazo son sustanciales."
 Japan.105.t: "Proclamación del Imperio"
 Japan.105.d: "La proclamación está redactada sobre la mesa del gabinete con el sello al lado de ella y la fecha que queda abierta. No queda nada más por restaurar: el hogar está en pie, se mantienen los ritos, se sienta el Consejo Privado. Sólo la redacción no está arreglada.\n\nEl Ministro del Ejército habla primero. Un imperio se mide en el continente, en las divisiones levantadas y sostenidas, y la proclamación debe decir tanto. El Ministro de la Marina responde sin levantar su voz. Japón es un país isleño que vive junto a sus carriles marinos, y un estándar elevado sobre la flota será leído correctamente en cada puerto de Vladivostok a Singapur. Ambos hombres caen en silencio y miran al trono."
 Japan.105.a: "£JAP_EMPIRE_flag La fuerza del Imperio está en sus ejércitos."
 Japan.105.b: "£JAP_EMPIRE_NAVAL_flag La fuerza del Imperio está en el agua."
 JAP_american_pressure_article_nine_desc: "Washington ha vinculado el archivo comercial al expediente de defensa. Las amenazas arancelarias y el apalancamiento de recursos se utilizan para empujar Tokio hacia un papel militar más amplio, y hasta que el argumento se resuelve Japón negocia desde el lado más débil de la mesa."
 JAP_jsw_tank_mio_trait_ladle_refining: "Reflexión de velas limpias"
 JAP_jsw_tank_mio_trait_muroran_arc_furnace: "Muebles de arco eléctrico Muroran"
 JAP_jsw_tank_mio_trait_high_tensile_plate: "Rolling de placa de alta tensión"
 JAP_jsw_tank_mio_trait_scrap_recycling: "Línea de recuperación de rascacielos"
 JAP_jsw_steel_modifier: "Japón Steel Works"
 JAP_jsw_steel_modifier_desc: "Cada pedido colocado con Japón Steel Works es un orden puesto con Muroran. Los hornos que vierten los barriles y la placa de armadura son los mismos hornos que alimentan los astilleros, los comercios de construcción y los fabricantes de automóviles, y cada contrato que los mantiene funcionando a capacidad deja al país menos dependiente de la facturación importada. Lo que el presupuesto de defensa compra en acero ametrallador, la economía más amplia se acumula en tonelaje."
 JAP_zombie_companies: "Empresas zombis"
 JAP_zombie_companies_desc: "Los años de indulgencia han mantenido a empresas sin fines lucrativos y excesivamente endeudadas con crédito barato, atando capital, trabajo y gestión que necesitan las industrias más sanas. Hasta que estas firmas sean reestructuradas o eliminadas, la construcción, productividad y los ingresos fiscales corporativos sufren todos.\n-------------\nRaising §YProgreso de la Reestructuración Corporativa§! abre las puertas §Y$JAP_restructure_next_tranche$§! decisión, que facilita este espíritu nacional un paso a la vez. Véase §Y$JAP_corporate_reform_category$§! para las cifras actuales."
 JAP_ykk_group: "El Grupo YKK"
 JAP_ykk_group_desc: "Yoshida Kogyo hace aproximadamente la mitad de las cremalleras producidas en cualquier lugar, unos siete mil millones al año de plantas en más de setenta países. La empresa fresa su propio latón, gira su propio poliéster, mezcla sus propias tintes y construye las máquinas que montan el deslizador terminado, una integración vertical que no deja nada sobre el producto fuera de su control. La adquisición militar es una pequeña parte de ese negocio y una exacta, ya que el sujetador en un transportista de placas, un chaleco de carga o un camuflaje es el primer componente que falla en el campo. Los programas de equipo de protección y uniforme japoneses se basan en un proveedor que puede revisar un atraco, un revestimiento o una aleación resistente a la corrosión interna en lugar de esperar a un subcontratista."
 JAP_karoshi_crisis: "La crisis de Karoshi"
 JAP_karoshi_crisis_desc: "El exceso de trabajo crónico está frenando la fuerza laboral de Japón. Excesivo tiempo extra remunerado, la cultura del 'servicio zangyo', impulsos de golpe, insuficiencia cardíaca y suicidio entre los empleados asalariados, mientras las familias agotadas dejan de tener hijos. Estabilidad, productividad e investigación todos sufren, salud y gasto social suben, y los bordes de población hacia abajo año tras año.\n-------------\nLas campañas de reforma y el trabajo aumentan §YBienestar del trabajador§!. At §G30§! y §G60§! el §Y$JAP_enforce_next_reforms$§! la decisión desbloquea y facilita este espíritu nacional un paso; el enfoque al final de su camino elegido lo eleva para siempre. §Yempresas zombis§! permanecer sin resolver, cada campaña rinde la mitad. Ver §Y$JAP_corporate_reform_category$§! para las cifras actuales."
 JAP_karoshi: "Karoshi"
 JAP_karoshi_desc: "El gobierno denomina karoshi una crisis nacional: trabajadores asesinados por trabajo excesivo, por accidente cerebrovascular y insuficiencia cardíaca en el escritorio y por suicidio después de cien horas meses. La muerte del empleado de Dentsu Matsuri Takahashi lo obligó a volver a la agenda nacional y costó al presidente de la compañía su trabajo. El Estado debe decidir hasta qué punto llegará al lugar de trabajo para hacer que el trabajo sea sobreviviente."
 JAP_corporate_laws: "Reforma de la Ley de normas laborales"
 JAP_corporate_laws_desc: "El gobierno toma el camino legislativo, cerrando la laguna del artículo 36 a través de la Ley de reforma del estilo de trabajo y reemplazando los acuerdos de saburoku con techos duros aplicados por una Inspección de Normas Laborales fortalecida. Ganar significa luchar contra los empleadores y el lobby de horas flexibles a través de cada etapa del comité en la Dieta. Es la más completa de las tres respuestas y la más lenta de llegar."
 JAP_cultural_change: "Frente a la cultura del trabajo excesivo"
 JAP_cultural_change_desc: "Las campañas gubernamentales sobre la cultura en lugar de estatuto: el viernes Premium envía a los trabajadores a casa temprano una vez al mes, la detección mental-salud llega al lugar de trabajo, y el diario Karoshi White Paper mantiene a los muertos visibles tanto para los empleadores como para los reclutadores. Ninguno de ellos toca la regla no expresa que los diligentes salen sólo después de que el jefe de sección lo haga. Este camino apuesta que la relación de Japón con el trabajo cambia desde abajo, un lugar de trabajo y un hogar a la vez."
 JAP_keiretsu_pact: "Bargaining con el Keiretsu"
 JAP_keiretsu_pact_desc: "El Estado negocia directamente con los grupos de empresa y la federación de empleadores Keidanren: reforma gestionada a cambio de estabilidad, mantenimiento del empleo por vida y las empresas endeudadas protegidas de perturbaciones. No se aprueba legislación ni se nombra a ninguna empresa y se avergüenza, porque la concesión es negociada para previsibilidad. Es el camino más lento para la reforma y el que deja al Japón corporativo menos cambió."
 JAP_overtime_cap: "Artículo 36 Ceiling"
 JAP_overtime_cap_desc: "Un acuerdo de saburoku presentado a la oficina laboral convierte la semana legal de cuarenta horas en una sugerencia, y la Ley de reforma del estilo de trabajo cierra el agujero. Cuarenta y cinco horas de horas extraordinarias al mes y trescientos sesenta al año se convierten en un límite legal, nunca más allá de cien en un solo mes, con sanciones penales por detrás del número en lugar de orientación administrativa. Las cifras siguen la línea karoshi que utiliza el Ministerio de Salud, Trabajo y Bienestar al decidir si un accidente cerebrovascular o suicidio fue causado por el trabajo."
 JAP_mandatory_paid_leave: "Cinco días debe tomar un trabajador"
 JAP_mandatory_paid_leave_desc: "La obligación se invierte: un empleador que otorgue diez o más días de licencia debe asegurarse ahora por lo menos cinco de ellos son realmente consumidos, designando las fechas en sí mismo si el trabajador no lo hará. Los trabajadores japoneses no carecen de vacaciones tanto como el permiso para utilizarlo, y apenas se toma la mitad de licencia concedida. La misma enmienda presta el intervalo de trabajo europeo, once horas de descanso entre turnos, aunque sólo como un deber para hacer un esfuerzo."
 JAP_labour_inspection_offices: "La Inspección de Normas Laborales"
 JAP_labour_inspection_offices_desc: "El gobierno financia a la Inspección de Normas Laborales para hacer cumplir más que aconsejar: más inspectores, contabilidad forense para capturar las tarjetas temporales falsificadas que convierten cien horas de horas extraordinarias en veinte sobre papel y la voluntad de procesar. Unos pocos miles de inspectores no pueden policializar a sesenta millones de trabajadores, así que la mayoría de las violaciones sólo surgen después de que alguien haya muerto y la familia ha contratado a un abogado. El ministerio ya publica los nombres de las firmas que rompen la ley, y Dentsu mismo fue condenado después de la muerte de Matsuri Takahashi."
 JAP_karoshi_prevention_act: "Ley de prevención del Karoshi"
 JAP_karoshi_prevention_act_desc: "La Dieta aprueba la Ley de Promoción de Medidas Preventivas contra Karoshi, obligando al Estado a investigar las muertes por exceso de trabajo, publicando un Libro Blanco anual y manteniéndose en objetivos que puede medirse: menos del cinco por ciento de los trabajadores en sesenta horas semanas, setenta por ciento de las licencias pagadas efectivamente tomadas, provisión de salud mental en cada empresa. Hacer que los números sean públicos es el punto, porque entonces se pueden perder en público. El mismo paquete lleva un alto nivel de exenciones profesionales reglas de hora levantada de los especialistas mejor pagados, una carve-out que los sindicatos esperan ser ampliados."
 JAP_end_of_karoshi: "Un país donde el trabajo no mata"
 JAP_end_of_karoshi_desc: "El techo de las horas extras es porque los inspectores aparecen sin previo aviso y los fiscales los siguen, se toma la licencia porque la ley lo requiere, y el trabajador del contrato a su lado se paga lo que se paga. Las empresas que sólo podían sobrevivir en horas no remuneradas han sido terminadas en lugar de ser prorrogadas por crédito perenne, así que nadie está alegando que la supervivencia no les deja elección. Japón seguirá trabajando duro, pero ha dejado de tratar el agotamiento como evidencia de lealtad.\n-------------\nRequisitos §YCompañías zombis de Japón§! para que se resuelva plenamente, §Y$JAP_karoshi_crisis$§! ya aliviado hasta su etapa final, y §YBienestar del trabajador§! por lo menos §G85§!. Completar este enfoque eleva la crisis de Karoshi para siempre."
 JAP_karoshi_wellbeing_up_tt: "Aumenta §YEl bienestar del trabajador§! por $RIGHT|+=0$, aliviando la crisis de Karoshi"
 JAP_premium_friday: "Viernes Premium"
 JAP_premium_friday_desc: "El Ministerio de Economía, Comercio e Industria lanza el viernes Premium con los Keidanren: el último viernes de cada mes, los empleados salen a las tres y pasan la noche en las tiendas más que en sus escritorios. El momento es desafortunado, ya que el fin del mes es cuando las cuentas cierran y las cuotas se liquidan, y pocas empresas cumplen con cualquier entusiasmo. Lo que sobrevive es el precedente del estado nombrando una hora y diciéndole al país que deje de trabajar."
 JAP_ikumen_project: "El proyecto Ikumen"
 JAP_ikumen_project_desc: "El Ministerio de Salud, Trabajo y Bienestar lleva a cabo la campaña ikumen para que un padre de crianza de los hijos sea algo que admirar en lugar de explicar. La licencia de paternidad japonesa es uno de los más generosos del mundo en papel, un año de ella pagado parcialmente, y casi nadie lo reclama, porque un hombre que archiva es un hombre cuyos colegas llevan su trabajo y cuyo jefe de sección recuerda. La ley revisada ofrece cuatro semanas en los ocho después de un nacimiento, splittable y meramente notificado, un umbral lo suficientemente bajo como para que un padre vacilante pueda realmente tomarlo."
 JAP_stress_check_programme: "El control de estrés"
 JAP_stress_check_programme_desc: "La Ley de Seguridad y Salud Industrial enmendada exige que cada lugar de trabajo de cincuenta o más empleados ofrezca una autoevaluación psicológica anual, la primera vez que el Estado ha obligado a las empresas japonesas a preguntar a su personal cómo son. Un trabajador que anota mal puede solicitar una entrevista con un médico y un ajuste a sus deberes, pero los resultados pertenecen al empleado y un gerente no ve nada sin consentimiento. Eso protege al individuo y desbarata el instrumento, y a las empresas menores de cincuenta empleados sólo se les pide que hagan un esfuerzo."
 JAP_telework_normalization: "Trabajando desde cualquier lugar"
 JAP_telework_normalization_desc: "El gobierno nombra a su primer ministro de Transformación Digital y abre la Agencia Digital, despojando el requisito del sello hanko de la abrumadora mayoría de los procedimientos administrativos. El teletrabajo fue un error de redondeo no porque la tecnología faltaba, sino porque los contratos necesitaban el sello tallado y las formas aún llegaban por fax, así que alguien tenía que estar en el edificio conteniendo el sello. Si alguno de ellos supera la emergencia es la pregunta abierta, porque las empresas llamaron a su personal de vuelta a los escritorios que habían demostrado que no necesitaban."
 JAP_ending_service_zangyo: "Fin de servicio Horas extraordinarias"
 JAP_ending_service_zangyo_desc: "Sabisu zangyo es la hora trabajada y nunca grabada, dado gratis porque el día de trabajo fue medido por autodeclaración y el empleado sabía lo que el jefe de sección esperaba que dicho número dijera. La reforma ataca a la aritmética más que a la cultura: los empleadores deben establecer horas por medios objetivos, lectores de tarjetas o tiempos de inicio de sesión, y la brecha entre los dos registros es evidencia. El ministerio publica lo que se recupera cada año, decenas de miles de millones de yenes en salarios no remunerados, y cada una de esas firmas fue atrapada más que inusual."
 JAP_ending_compulsory_nomikai: "El Nomikai Opcional"
 JAP_ending_compulsory_nomikai_desc: "El nomikai es voluntario en el sentido de que la invitación se expresa como una pregunta, y el junior que disminuye dos veces ha dicho algo acerca de sí mismo que ninguna revisión del desempeño registrará. La Ley de prevención del acoso en el poder lo alcanza desde el lado, definiendo por primera vez el acoso en el poder laboral en el estatuto japonés y obligando a cada empresa a ejecutar un procedimiento de denuncia y proteger al autor."
 JAP_work_to_live: "Trabajando para Vivir"
 JAP_work_to_live_desc: "Las horas son grabadas por la máquina y coinciden con lo que pasó, se toma la licencia porque no cuesta nada, y los padres archivan durante las semanas después de un nacimiento y regresan al mismo escritorio y las mismas perspectivas. Ninguno de ellos fue ganado solo por ley, porque nunca fue realmente sobre estatuto: era acerca de lo que un lugar de trabajo espera cuando nadie está cumpliendo nada. Japón todavía funciona duro, y ha dejado de confundirlo con trabajar en sí mismo hasta la muerte.\n-------------\nRequisitos §YCompañías zombis de Japón§! para que se resuelva plenamente, §Y$JAP_karoshi_crisis$§! ya aliviado hasta su etapa final, y §YBienestar del trabajador§! por lo menos §G85§!. Completar este enfoque eleva la crisis de Karoshi para siempre."
 JAP_corporate_reform_category: "Reforma corporativa de Japón"
 JAP_corporate_reform_category_desc: "El sector empresarial de Japón arrastra dos males enlazados. Los bancos mantienen vivas a empresas no rentables y sobreendeudadas con crédito refinanciado, y bloquean el capital y los trabajadores que necesitan industrias más sanas. Esas mismas empresas compran lealtad con horas extra no pagadas, y el resultado es el karoshi, la muerte por exceso de trabajo. Ninguno puede curarse del todo mientras persista el otro.\n\n§YEmpresas zombi§!\n§YProgreso de la reestructuración empresarial§!: [?JAP_corporate_restructuring_progress|0] / 100\nLa reestructuración avanza lentamente a §R+0.25 al mes§! hasta que se cierra la investigación y se elige una resolución. Entonces §Y$JAP_controlled_downsize$§! liquida rápido a las empresas, §Y$JAP_forced_mergers$§! las absorbe a la mitad de ese ritmo, y la calidad del informe escala ambos. Los enfoques bancarios y los programas de recuperación de abajo suman cantidades puntuales.\n§REl progreso se estanca en 84§! hasta que se elija una resolución.\n§GUmbrales§!\n§G30§! y §G60§!: se desbloquea la decisión §Y$JAP_restructure_next_tranche$§! de abajo, y cada uso alivia §Y$JAP_zombie_companies$§! un paso.\n§G85§!: el enfoque al final de la vía elegida lo elimina para siempre, sea §Y$JAP_the_lost_decade_ends$§! o §Y$JAP_consolidated_japan_inc$§!, aunque esta última deja una marca permanente.\n§RAdvertencia§!: un §Y$JAP_keiretsu_pact$§! frena la acumulación mensual.\n\n§YLa crisis del karoshi§!\n§YBienestar de los trabajadores§!: [?JAP_karoshi_wellbeing|0] / 100\nLos enfoques de reforma de la vía elegida suman Bienestar de los trabajadores directamente, y las campañas laborales de abajo lo completan mientras sigas pagándolas.\n§GUmbrales§!\n§G30§! y §G60§!: se desbloquea la decisión §Y$JAP_enforce_next_reforms$§! de abajo, y cada uso alivia §Y$JAP_karoshi_crisis$§! un paso.\n§G85§!: el enfoque al final de la vía elegida lo elimina para siempre, sea §Y$JAP_end_of_karoshi$§!, §Y$JAP_work_to_live$§! o §Y$JAP_the_bargain_kept$§!. Cada uno de ellos exige además que la crisis haya sido aliviada antes a su etapa final.\n§RAdvertencia§!: cada campaña rinde §R4§! en lugar de §G8§! mientras §Y$JAP_zombie_companies$§! siga en pie, y los enfoques de la vía por sí solos no pueden llevarte a §G85§!.\n\n§GPista§!: §Y$JAP_a_society_where_women_thrive$§! reduce a la mitad lo que las campañas de §Y$JAP_cultural_change$§! cuestan al tesoro."
 JAP_premium_friday_campaign: "Promocione el viernes Premium"
 JAP_premium_friday_campaign_desc: "Financiar otra ronda del impulso publicitario del ministerio y los descuentos minoristas que lo acompañan, y presionar a la federación empresarial para que sus miembros cierren temprano. A las empresas que apaguen las luces a las tres se las fotografiará haciéndolo."
 JAP_ikumen_campaign: "Llevar a cabo la campaña Ikumen"
 JAP_ikumen_campaign_desc: "Poner a los padres en licencia de cuidado infantil en carteles, publicidad ministerial y televisión, y publicar la tasa de uso empresa por empresa para que una cifra baja se vuelva un problema de reclutamiento. El objetivo es que pedir la licencia sea algo corriente y no un acto de valentía."
 JAP_mental_health_campaign: "Unidad de salud mental en el lugar de trabajo"
 JAP_mental_health_campaign_desc: "Extender el chequeo anual de estrés por debajo del umbral de cincuenta empleados, subvencionar a médicos del trabajo para las empresas demasiado pequeñas para contratar uno y dotar bien las líneas de asesoramiento. El cribado solo sirve si hay alguien al otro lado."
 JAP_no_overtime_day_campaign: "Declarar un Día sin Horas Extra"
 JAP_no_overtime_day_campaign_desc: "Fijar un día laborable, apagar las luces de la oficina a la hora señalada y mandar a casa primero a los jefes de sección, porque nadie de rango inferior se va antes que su superior. Burdo, visible y la única versión de la orden que ha funcionado alguna vez."
 JAP_karoshi_resolved: "La crisis de Karoshi en Japón se ha resuelto completamente"
 JAP_keidanren_charter: "La Carta de Equilibrio entre el Trabajo y la Vida"
 JAP_keidanren_charter_desc: "El gobierno, los Keidanren y Rengo firman la Carta para el Equilibrio de Vida-Trabajo y le ponen números: azotar a los trabajadores en sesenta horas semanas, tomar todos los días de licencia pagada, arrastrar licencias de cuidado masculino fuera de las bajas cifras individuales. El documento no contiene fuerza jurídica ni sanciones, sino un examen público anual sobre un consejo en el que las empresas se sientan iguales. Las horas de trabajo japonesas nunca han caído a través de la fiscalía, pero sí caen cuando las empresas deben explicarse entre sí."
 JAP_shunto_offensive: "La Primavera Offensive"
 JAP_shunto_offensive_desc: "El gabinete se une a la ofensiva salarial de primavera shunto directamente, presionando a los Keidanren para recaudar el salario base en lugar de bonificaciones y respaldando la demanda con créditos fiscales para las empresas que cumplen. Los críticos lo llaman kanmin shunto, negociación gestionada por el gobierno, y argumentan que una ronda salarial fuera de la oficina del Primer Ministro no es negociación colectiva en absoluto. Hasta que el salario base aumente, el hombre de sueldo sigue trabajando el tiempo extra que paga su hipoteca, sea lo que diga el techo."
 JAP_health_management_stocks: "Gestión de la salud y la productividad"
 JAP_health_management_stocks_desc: "El ministerio y la Bolsa de Valores de Tokio comienzan a nombrar Stocks de Gestión de Salud y Productividad, diciendo a los inversores que la salud del personal es gasto de capital en lugar de bienestar. La certificación detrás de ella, el White 500, es el deliberado opuesto a la lista negra de la compañía negra y descansa en el hallazgo que los trabajadores agotados producen menos y cuestan más que los descansados. Las empresas presentan sus propias cifras en horas y salud para ganar la insignia, y aquellos que no pueden responder por ella a los accionistas y reclutas por igual."
 JAP_morning_shift_system: "El turno de la mañana"
 JAP_morning_shift_system_desc: "Itochu, un shosha de sogo en el centro del viejo keiretsu, prohibe trabajar después de diez por la noche y paga horas temprano mañana a una prima en su lugar. El razonamiento es comercial más que humano: un comerciante en su escritorio desde las nueve primeras horas de la mañana, y las horas de la noche son los menos productivos del día. Las horas extras de noche se derrumbó, las horas totales cayeron, el beneficio se mantuvo y la tasa de natalidad del bufete aumentó, lo que avergonzaba a todos los rivales que habían llamado horas más cortas inasequible."
 JAP_job_based_employment: "Contratada a un trabajo, no a una empresa"
 JAP_job_based_employment_desc: "El empleo japonés se basa en la membresía: un trabajador es contratado en la empresa en lugar de en un trabajo, girado a discreción de la firma sin deberes definidos, que es donde comienza el día de trabajo sin límites. Hitachi, Fujitsu, KDDI y Shiseido publican ahora descripciones reales del trabajo con el pago calificado al papel, y los Keidanren han admitido que el empleo por vida no puede ser sostenido. El estado financia un trillón yen de reentrenamiento para que el cambio lea como oportunidad en lugar de traición."
 JAP_the_bargain_kept: "El Bargain Kept"
 JAP_the_bargain_kept_desc: "Las horas bajan porque los grupos empresariales trabajan que cuestan más de lo que ganan, y después de haberlo trabajado se mueven más rápido de lo que cualquier comité de la Dieta podría haberlas hecho. Los cruzados se mantienen intactos, los bancos principales permanecen en el centro de sus grupos, y la productividad liberada por días más cortos fluye a los laboratorios en lugar de en las reclamaciones salariales.El estado lleva lo que no es el acuerdo del seguro médico para los trabajadores ya rotos, y el aislamiento.\n-------------\nRequisitos §YCompañías zombis de Japón§! para que se resuelva plenamente, §Y$JAP_karoshi_crisis$§! ya aliviado hasta su etapa final, y §YBienestar del trabajador§! por lo menos §G85§!. Completar este enfoque eleva la crisis de Karoshi para siempre."
 JAP_demand_recovery_progress_tt: "§YProgreso de recuperación en fases§!: $RIGHT|+=0$"
 JAP_corporate_restructuring_progress_tt: "§YProgreso de Reestructuración Corporativa§!: $RIGHT|+=0$"
 Japan_economy.32.t: "Un tribunal de distrito anula el reinicio"
 Japan_economy.32.d: "Un tribunal de distrito ha emitido una orden judicial que bloquea el reinicio de un reactor nuclear, citando dudas sin resolver sobre seguridad sísmica y planificación de evacuación cerca de la planta. El fallo no es definitivo, pero congela el regreso del reactor a la operación mientras el caso pasa por apelación. Los residentes locales y los grupos antinucleares se han apoderado de la decisión, mientras que los servicios públicos advierten del costo de la capacidad inactiva continua."
 Japan_economy.32.a: "Combatirlo a través de los tribunales de apelación."
 Japan_economy.32.b: "Profundice las garantías locales de seguridad."
 JAP_zombie_firms_investigation: "Investigar las firmas Zombie"
 JAP_zombie_firms_investigation_desc: "Los bancos han dado préstamos para insolvente prestatarios y las retenciones cruzadas han dejado que los administradores se escondan unos a otros. Los auditores ahora entran en los libros, nombran a las firmas que sobrevivan sólo con crédito siempre adquirido, y obligan a los números a abrirse."
 JAP_zombie_firms_investigation_TT: "Abre la investigación. Los archivos de caso se construyen a través de §Y$JAP_zombie_investigation_category$§!, y las empresas lucharán."
 JAP_zombie_investigation_idea: "Investigación Firma Zombi"
 JAP_zombie_investigation_idea_desc: "Los auditores están peinando a través de los libros de empresas insolvente. La incertidumbre rompe las salas de juntas y ralentiza las oficinas mientras la sonda recorre su curso."
 Japan_economy.06.b: "Dejar que los bancos auto-reporten"
 Japan_economy.07.b: "Contienen la caída"
 JAP_zombie_investigation_western_pop_TT: "Publicar la paciencia desacredita al bloque reformista pro-occidental: §RLa popularidad del partido liberal cae§!"
 JAP_controlled_downsize: "Downsize controlado"
 JAP_controlled_downsize_desc: "El Programa de Revitalización Financiera aplica una evaluación más estricta del activo y un suministro de corriente de efectivo con descuento, lo que obliga al capital público a los balances que no pueden estar solos. Las firmas insolvente están terminadas y las fábricas cerradas, liberando a los trabajadores encerrados dentro de los muertos que caminan de vuelta a la vida."
 JAP_complete_downsizing: "Reducción completa de la economía"
 JAP_complete_downsizing_desc: "La liquidación está terminada. El crédito ahora fluye a empresas que pueden pagarlo, comercios de tierras a precios que reflejan su uso, y la administración ya no mide el éxito por cuenta propia. Esta es la economía que los reformadores prometieron: más pequeño en papel, mucho más fuerte en el libro mayor."
 JAP_venture_capital_funds: "Fondos de capital de riesgo"
 JAP_venture_capital_funds_desc: "La Corporación de Innovación de Japón pone capital estatal detrás de las startups privadas, con riesgo de riesgo de aventuras coincidentes con el respaldo público. Los hogares japoneses tienen enormes ahorros que casi nunca llegan a un fundador, y así es como se hace que el capital se mueva."
 JAP_infrastructure_investments: "Inversiones de infraestructura"
 JAP_infrastructure_investments_desc: "El Plan fundamental para la Resiliencia Nacional compromete al Ministerio de Tierra, Infraestructura, Transporte y Turismo a renovar los puentes, túneles y muros marinos construidos durante las décadas de alto crecimiento, la mayoría de ellos ya han pasado cincuenta años de servicio. Las obras públicas son las arterias de una nación industrial cuando se hacen correctamente."
 JAP_growth_tax_reform: "Cambios fiscales para promover el crecimiento"
 JAP_growth_tax_reform_desc: "Japón llevó durante mucho tiempo una de las cargas corporativas más pesadas del mundo desarrollado. Las reformas exitosas redujeron la tasa efectiva de aproximadamente el treinta y siete por ciento hacia los años veinte, ampliando la base al mismo tiempo disminuyendo la tasa y las empresas recompensadoras que elevan los salarios e invierten en casa. Una empresa que mantiene sus ganancias funcionando vale más para el Tesoro que uno que los acapara."
 JAP_startup_education_programs: "Programas de educación para nuevas empresas"
 JAP_startup_education_programs_desc: "Los programas EDGE y EDGE-NEXT ponen la formación empresarial dentro de las universidades nacionales, y las oficinas de concesión de licencias de tecnología convierten patentes de laboratorio en empresas. Un graduado de Todai o Tokyo Tech debe ver fundar una firma como carrera, no una vergüenza que se explica a los padres."
 JAP_retirement_reform: "Reforma de la jubilación"
 JAP_retirement_reform_desc: "La Ley revisada sobre estabilización del empleo de las personas de edad pide a los empleadores que garanticen oportunidades de trabajo hasta los setenta años. Las personas mayores son sanas, calificadas y dispuestas, y mantenerlas en la fuerza laboral facilita la carga de pensiones al tiempo que regresan décadas de artesanía acumulada a la planta de fábrica."
 JAP_forced_mergers: "Fusión"
 JAP_forced_mergers_desc: "En lugar de dejar que las empresas débiles fallen, el ministerio se casa con los fuertes: dibuja las líneas, los bancos proporcionan la capital, y nadie tiene que admitir fracaso. Los zombis desaparecen del registro, y los infelices ingenieros, las fábricas duplicadas y los despreciados nuevos maestros permanecen."
 JAP_megabank_consolidation: "Consolidación de Megabank"
 JAP_megabank_consolidation_desc: "Japón conduce sus bancos de la ciudad enferma en tres megabancos: Mizuho, Sumitomo Mitsui y Mitsubishi UFJ. Las fusiones enterran una década de préstamos malos dentro de balances demasiado grandes para cuestionar, y producen prestamistas que ningún gobierno podría permitirse fallar."
 JAP_industrial_revitalization_corp: "Corporación de Revitalización Industrial"
 JAP_industrial_revitalization_corp_desc: "La Corporación de Revitalización Industrial de Japón compra deudas angustiadas y toma a mano empresas en lucha, Daiei y Kanebo entre los cuarenta y uno que reestructura. Un vehículo giratorio estatal puede dictar términos, deudas de reorganización y accionistas silenciosamente diluidos en formas que ningún acreedor privado se atrevería a intentar."
 JAP_national_champion_mergers: "Mergers Campeón Nacional"
 JAP_national_champion_mergers_desc: "METI fusiona las divisiones perdedoras de firmas rivales y llama a la suma un campeón: Renesas de los brazos chip de NEC, Hitachi y Mitsubishi, Japón Exhibición de las empresas del panel de Sony, Toshiba e Hitachi. Si tres unidades que luchan suman a una empresa sana se deja cuidadosamente sin estado."
 JAP_keiretsu_cross_shareholding: "Keiretsu Cross-Shareholding"
 JAP_keiretsu_cross_shareholding_desc: "Mochiai, la web de los accionistas aliados, es la arquitectura tranquila del Japón corporativo, y cada reforma hasta la fecha ha intentado desenrollarlo. El gobierno apreta los nudos en cambio, aislando a los conglomerados de inversores activistas y ofertas hostiles. Los trabajos se mantienen a salvo, y también todos los ejecutivos mediocres."
 JAP_employment_preservation_pact: "Pacto de conservación del empleo"
 JAP_employment_preservation_pact_desc: "Shushin koyo, trabajo de por vida, nunca fue una ley sino una negociación entre firme, sindical y estatal, sostenida por subsidios de ajuste. El gobierno lo escribe: ningún trabajador pierde un trabajo para una fusión. La nación compra la paz social y lo paga con fábricas que nunca pueden cerrar."
 JAP_consolidated_japan_inc: "Consolidated Japan Inc."
 JAP_consolidated_japan_inc_desc: "La última de las empresas débiles se firma en una fusión y el registro está cerrado. Los campeones son enormes, el ministerio puede dibujar el mapa industrial en una sola hoja, y los rivales extranjeros lo tratan con el respeto cauteloso debido a cualquier gigante. En el interior, las plantas duplicadas todavía funcionan y los infelices ingenieros aún archivan a seis.\n-------------\nEste enfoque §Geliminaciones§! §Y$JAP_zombie_companies$§! y el §Y$JAP_fusion_restructuring$§! que vino con las fusiones, y sale §Y$JAP_consolidated_conglomerates$§! atrasado permanentemente."
 JAP_venture_capital_funds_decision: "Capitalizar el Fondo de Innovación"
 JAP_venture_capital_funds_decision_desc: "Poner dinero público en los fondos junto a gestores privados, con la condición de que los gestores escojan a los ganadores. Respalda un año de esfuerzo de investigación concentrado en las nuevas empresas."
 JAP_infrastructure_investments_decision: "Lanzar las obras de renovación de Chubu"
 JAP_infrastructure_investments_decision_desc: "Comprometer capacidad de construcción civil a renovar las carreteras, puentes y servicios del cinturón industrial de Chubu. Las obras inmovilizan fábricas mientras duran y dejan la infraestructura de la región sustancialmente mejorada."
 JAP_growth_tax_reform_decision: "Reducir el tipo de sociedades"
 JAP_growth_tax_reform_decision_desc: "Bajar el tipo efectivo de sociedades durante un año y dejar que las empresas conserven más de lo que ganan. Los precios al consumo se suavizan a medida que las empresas trasladan parte del alivio a los hogares."
 JAP_startup_education_programs_decision: "Financiar la vía de startups universitarias"
 JAP_startup_education_programs_decision_desc: "Dotar a las facultades de emprendimiento y a las oficinas de licencias tecnológicas de las universidades nacionales, para convertir el trabajo de laboratorio en empresas y acelerar nuestra investigación industrial."
 JAP_retirement_reform_decision: "Extender la garantía de empleo hasta los setenta"
 JAP_retirement_reform_decision_desc: "Subvenciona a los empleadores que mantienen trabajadores calificados más allá de la edad tradicional de jubilación. Décadas de estancia artesanal acumulada en la planta de fábrica por otro año."
 JAP_rail_modernization: "Modernización del ferrocarril"
 JAP_rail_modernization_desc: "El Tokaido Shinkansen ancla la red ferroviaria más densa en la tierra, y el material rodante, señalización y estaciones detrás de ella son renovadas línea por línea. Los ferrocarriles siguen siendo la columna vertebral de una economía industrial que no puede permitirles fracasar."
 JAP_shinkansen_network_expansion: "Ampliación de red Shinkansen"
 JAP_shinkansen_network_expansion_desc: "En virtud de la Ley nacional de desarrollo ferroviario Shinkansen, los sucesivos gobiernos han empujado las líneas troncales de alta velocidad hacia fuera desde el núcleo Tokaido hacia Hokuriku, Kyushu y Hokkaido. Acelerar estos proyectos tejerá prefecturas lejanas en la economía nacional y reducirá las líneas de suministro a través de las islas del hogar."
 JAP_chuo_shinkansen_maglev: "Chuo Shinkansen Maglev"
 JAP_chuo_shinkansen_maglev_desc: "El Chuo Shinkansen es la superconductora línea maglev de JR Central entre Tokio, Nagoya y Osaka, su serie L0 con el récord mundial de velocidades ferroviarias a 603 km/h. El compromiso estatal lleva el prototipado y el profundo túnel del ferrocarril comercial más rápido jamás intentado."
 JAP_freight_modal_shift: "Cambio de peso Modal"
 JAP_freight_modal_shift_desc: "Japón Freight Railway está encabezando un cambio modal de carga desde camiones largos hasta ferrocarril, promovido a través del Eco Rail Mark y contenedores estandarizados de treinta y un pie. Movilizar más flete por emisiones de cortes ferroviarios, aliviar la escasez de conductores y fortalecer la cadena de suministro industrial."
 JAP_station_city_model: "Estación City Model"
 JAP_station_city_model_desc: "JR East ha convertido las principales terminales en ciudades comerciales por su propia derecha, desarrollando los discursos minoristas conocidos como ekinaka y las torres alrededor de Shinagawa, Shibuya y la estación de Tokio. Las oficinas de concentración y el comercio minorista en los centros de tránsito elevan el valor y la productividad de las tierras en el núcleo urbano."
 JAP_regional_line_preservation: "Conservación de líneas regionales"
 JAP_regional_line_preservation_desc: "A medida que la despoblación rural drena el ciclismo, JR West y el tercer sector ferroviario luchan por mantener las líneas locales abiertas. En lugar de abandonar el campo, subvencionaremos el ferrocarril comunitario, preservando el acceso a la oferta y la movilidad para las regiones del puente."
 JAP_port_rail_intermodal: "Puerto y ferrocarril Intermodal"
 JAP_port_rail_intermodal_desc: "La política del Hub Estratégico Internacional de Puertos concentra el tráfico de contenedores en los grupos portuarios de Keihin y Hanshin. La ampliación de los sidings y terminales interiores del ferrocarril en el muelle vincula directamente los puertos a la red de carga, moviendo contenedores de barco a tren sin camiones inactivos."
 JAP_green_logistics_network: "Red logística verde"
 JAP_green_logistics_network_desc: "Una red de logística verde de locomotoras electrificadas de ferrocarril, batería e hidrógeno y centros de distribución consolidados descarboniza el movimiento de mercancías por todo el país en busca de neutralidad de carbono."
 JAP_rail_technology_exports: "Ferroviario Exportaciones"
 JAP_rail_technology_exports_desc: "El ferrocarril japonés de alta velocidad es una exportación insignia. E5-derived trainsets underpin the Mumbai-Ahmedabad line in India, el 700T sirve Taiwan High Speed Rail, y los paquetes de financiación JICA Shinkansen tecnología en todo el mundo. Ganar estos contratos extiende nuestros estándares y nuestra influencia."
 JAP_global_rail_superpower: "Superpotencia de la red mundial"
 JAP_global_rail_superpower_desc: "Con el Chuo Shinkansen llevado a Osaka y nuestras exportaciones rodeando el globo, Japón es el líder indiscutible en la vía de alta velocidad. La era maglev comienza en casa y irradia hacia fuera, un símbolo duradero de la ingeniería japonesa."
 JAP_chuo_shinkansen_program: "Programa Chuo Shinkansen"
 JAP_chuo_shinkansen_program_desc: "Un esfuerzo nacional dedicado al prototipo del maglev superconductor, acelerando nuestro proyecto especial maglev."
 JAP_high_speed_line: "Línea de alta velocidad"
 JAP_high_speed_line_desc: "Un nuevo corredor Shinkansen aumenta la productividad regional, acelera la construcción local y amplía el rendimiento de suministro."
 JAP_rail_category: "Sector ferroviario"
 JAP_hokuriku_shinkansen_extension: "Shinkansen de Hokuriku: de Kanazawa a Tsuruga"
 JAP_hokuriku_shinkansen_extension_desc: "Extender el Shinkansen Hokuriku de Kanazawa a Tsuruga, el tramo inaugurado en 2024, que enlaza la costa del Mar de Japón con la red nacional de alta velocidad."
 JAP_nishi_kyushu_shinkansen: "Nishi Kyushu Shinkansen"
 JAP_nishi_kyushu_shinkansen_desc: "Abrir la ruta Nishi Kyushu hasta Nagasaki, en servicio desde 2022, que lleva el oeste de Kyushu a la red del Shinkansen."
 JAP_sanyo_shinkansen_upgrade: "Actualización de Sanyo Shinkansen"
 JAP_sanyo_shinkansen_upgrade_desc: "Desplegar el material rodante N700S y modernizar el eje troncal Osaka-Hakata para mayores velocidades y más confiabilidad."
 JAP_tohoku_shinkansen_upgrade: "Tohoku Shinkansen 320 km/h"
 JAP_tohoku_shinkansen_upgrade_desc: "Hacer circular trenes de la serie E5 a 320 km/h por el eje troncal de Tohoku, y reducir los tiempos de viaje de Tokio hacia Aomori."
 JAP_hokkaido_shinkansen_sapporo: "Shinkansen de Hokkaido: extensión a Sapporo"
 JAP_hokkaido_shinkansen_sapporo_desc: "Perforar los túneles y levantar los viaductos para llevar el Shinkansen de Shin-Hakodate-Hokuto hasta Sapporo."
 JAP_shikoku_shinkansen: "Shikoku Shinkansen"
 JAP_shikoku_shinkansen_desc: "Concretar la línea del plan básico planeada desde hace tiempo, y llevar por primera vez la alta velocidad a la isla de Shikoku."
 JAP_plutonium_stockpile_concern: "Stockpilo de Plutonium separado"
 JAP_galapagos_syndrome: "Galapagos Syndrome"
 JAP_galapagos_syndrome_desc: "Japón construyó un mundo tecnológico completo dentro de sus propias fronteras y luego encontró que no podía exportar ninguna de ellas. Sus redes móviles funcionaron en PDC mientras que el resto del planeta estandarizado en GSM, por lo que no se podía vender ningún teléfono interno en el extranjero y aquí no se podía vender ningún teléfono exterior. Browsing llegó a través de i-mode y pago a través de FeliCa, cada uno de ellos años por delante de cualquier extranjero y cada uno de ellos incompatible con todo el exterior. Certificación nacional, especificación JIS y adquisición de keiretsu hizo el resto, llenando el mercado de la casa con productos diseñados para un cliente que no existe en ninguna otra parte. Cien veinte millones de consumidores son suficientes para sostener una industria y apenas demasiado pocos para forzarla hacia fuera.\n-------------\nEste espíritu nacional no se descalifica por sí solo. §RLa velocidad de investigación§! se reduce constantemente, mientras que Japón permanece cerrado, ralentizado pero nunca revertido por medidas temporales. Sólo el camino §Y Integración con el Mundo§!, llevado a §G85§! §Y La apertura§!, lo elimina. Véase §Y$JAP_technological_isolation_category$§! para las cifras actuales."
 JAP_galapagos_modifier: "Drift de Galápagos"
 JAP_galapagos_modifier_desc: "La cuenta corriente de lo lejos que Japón ha derivado del mundo con el que negocia. La investigación se desliza un poco más cada mes que el país mantiene a sus propios estándares, y mientras tanto es de los estándares que utilizan sus clientes, cuanto más rápido se resbala. Las medidas temporales frenan la diapositiva. Sólo la integración genuina lo detiene."
 JAP_galapagos_resolved: "Japón ha roto de su aislamiento en Galápagos"
 JAP_galapagos_syndrome_focus: "La pregunta de Galápagos"
 JAP_galapagos_syndrome_focus_desc: "El mercado nacional de Japón es rentable y encogedor, protegido por normas que bloquean al país fuera de todas partes. El ministerio debate si la respuesta es convergencia, reescribir los estándares para que coincida con el mundo, o la comercialización, vendiendo la diferencia en sí misma. Las medidas parciales frenan la deriva de la investigación, pero ninguna de ellas aborda la opción por debajo."
 JAP_galapagos_openness_up_tt: "§YOpenness§! $RIGHT|+=0$"
 JAP_galapagos_openness_down_tt: "Lowers §YOpenness§! by $RIGHT|+=0$, convirtiendo a Japón más hacia dentro de los estándares y mercados extranjeros"
 JAP_technological_isolation_category: "Galápagos y la guerra de la electrónica"
 JAP_technological_isolation_category_desc: "La industria japonesa perfeccionó productos solo para Japón: teléfonos magníficos, normas y servicios que nadie fuera del mercado interno podía usar, mientras el resto del mundo se estandarizaba en torno a otro. Ese mismo aislamiento deja ahora expuesto al sector japonés de semiconductores a medida que China escala la escalera tecnológica.\n\n§YSíndrome de las Galápagos§!\n§YApertura§!: [?JAP_galapagos_openness|0] / 100\n§Y$JAP_galapagos_drift_review_mission$§! informa de la deriva cada treinta días y muestra la cifra exacta antes de aplicarla. Cuanto más baja es la Apertura, más rápido se rezaga la investigación, hasta nada en absoluto en §G100§! y nunca peor que §R-15%§!.\n§GSubir la Apertura§!: los enfoques de integración aportan la mayor parte y los de electrónica el resto. Las dos campañas de abajo suman un poco más, pero solo frenan la deriva. No pueden curar el síndrome.\n§GEliminación§!: solo la vía §Y$JAP_world_integration$§! elimina §Y$JAP_galapagos_syndrome$§!, y solo cuando la Apertura pasa de §G85§!. La vía §Y$JAP_cool_japan_doctrine$§! conserva el espíritu a propósito y convierte el alcance cultural de Japón en influencia.\n\n§YLa competencia de modelos§!\n§YResiliencia electrónica§!: [?JAP_electronics_resilience|0]\nLa presión de China comienza en §R1§! y sube §R+1§! por cada hito de semiconductores que alcanza, y otro §R+1§! mientras la Apertura esté por debajo de §R25§!, hasta un máximo de §R3§!. La presión menos la Resiliencia decide qué nivel de §Y$JAP_model_competition$§! sufre Japón. Si superas la presión, el espíritu desaparece; si dejas que China se adelante sin respuesta, vuelve.\n§GSubir la Resiliencia§!: los enfoques de semiconductores la otorgan, y la ofensiva exportadora de abajo suma más hasta que la Resiliencia llega a §G4§!.\n§RAdvertencia§!: esa ofensiva requiere Apertura por encima de §G10§!, salvo que se haya adoptado §Y$JAP_cool_japan_doctrine$§! y Japón haya elegido vender su diferencia en lugar de ocultarla."
 JAP_international_standards_adjustment: "Ajuste de las normas internacionales"
 JAP_international_standards_adjustment_desc: "La industria japonesa escribe sus propios estándares, PDC para la radiodifusión móvil e ISDB, y cada uno de ellos bloquea el mercado interno fuera del mundo GSM y DVB. El gobierno envía ingenieros a los grupos de trabajo ISO e IEC, que no pueden deshacer la divergencia de la noche a la mañana, pero pone nombres japoneses en los proyectos que cada otro país leerá en una década. El precio se paga en casa, en pruebas de conformidad reescritas cada vez que se concede una cláusula."
 JAP_english_business_environment: "Inglés Business Environment"
 JAP_english_business_environment_desc: "Los administradores japoneses no pueden dotar a sus propias filiales de ultramar en el idioma en que se escriben los contratos. El gobierno respalda los programas corporativos de inglés y el experimento Rakuten que hizo del inglés la lengua de trabajo de una empresa japonesa y fue burlado hasta que llegaron los resultados. Cuesta años de pérdida de productividad mientras los jefes de sección aprenden a presidir una reunión en un segundo idioma, y algunos de ellos nunca lo harán."
 JAP_international_standards_adjustment_campaign: "Financiar las delegaciones de normas"
 JAP_international_standards_adjustment_campaign_desc: "Pagar otra rotación de ingenieros en los grupos de trabajo de ISO, IEC e ITU, y cubrir las pruebas nacionales de conformidad que siguen a cada cláusula que Japón concede. Las delegaciones vuelven a casa con los borradores y la industria tiene un año para adaptarse antes de la siguiente revisión. Si se deja de financiarlas, los asientos pasan a otros."
 JAP_english_business_environment_campaign: "Subvencionar programas de inglés corporativo"
 JAP_english_business_environment_campaign_desc: "Bajo la escritura de la formación de idiomas, las firmas miembros no han estado dispuestas a pagar por sí mismas: instructores internos, TOEIC sentados en tiempo de empresa y adscripciones a las oficinas exteriores para todos los que pasan. Salidas mientras estudian las personas. Las empresas que se quedan con él dejan de necesitar un traductor en la habitación."
