l_spanish:
 MDR_RULE_DISASTERS: "Desastres naturales"
 MDR_RULE_DISASTERS_HISTORICAL: "Históricos"
 MDR_RULE_DISASTERS_HISTORICAL_DESC: "Los grandes desastres reales de 2000 a 2025 ocurren en su fecha: el tsunami del Índico, Katrina, Haití, Tōhoku y Fukushima, Turquía 2023 y muchos más. Los países sin desastres programados, y todos a partir de 2027, sufren desastres al azar según su riesgo."
 MDR_RULE_DISASTERS_DYNAMIC: "Dinámicos"
 MDR_RULE_DISASTERS_DYNAMIC_DESC: "Todos los desastres ocurren al azar, según el riesgo de cada país y la época del año."
 MDR_RULE_DISASTERS_DISABLED: "Desactivados"
 MDR_RULE_DISASTERS_DISABLED_DESC: "No hay desastres naturales ni accidentes."
 MDR_RULE_WORLD_EVENTS: "Acontecimientos internacionales"
 MDR_RULE_WORLD_EVENTS_HISTORICAL: "Históricos"
 MDR_RULE_WORLD_EVENTS_HISTORICAL_DESC: "Los tratados de armas cambian en sus fechas reales (EE.UU. deja el ABM en 2002, fin del INF en 2019, Rusia suspende el New START en 2023...) y ocurren las crisis marítimas reales: el Ever Given en 2021, la sequía del Canal de Panamá y los ataques hutíes en el Mar Rojo en 2023. Si juegas con el país protagonista, eliges si sigues la historia."
 MDR_RULE_WORLD_EVENTS_DYNAMIC: "Dinámicos"
 MDR_RULE_WORLD_EVENTS_DYNAMIC_DESC: "Los tratados solo cambian por decisiones de los países y los accidentes marítimos ocurren al azar."

 # Desastres
 mdr_disaster_moderate: "Desastre natural"
 mdr_disaster_moderate_desc: "Un desastre golpeó una de nuestras regiones. Los servicios de emergencia trabajan en la zona afectada."
 mdr_disaster_severe: "Desastre grave"
 mdr_disaster_severe_desc: "Un desastre grave destruyó carreteras, viviendas y fábricas. La reconstrucción llevará meses."
 mdr_disaster_catastrophe: "Catástrofe nacional"
 mdr_disaster_catastrophe_desc: "Una catástrofe devastó una región entera. Hay miles de víctimas, los hospitales están desbordados y la economía se resiente en todo el país."
 mdr_disaster_nuclear: "Catástrofe nuclear"
 mdr_disaster_nuclear_desc: "Un accidente en una central nuclear obligó a evacuar a decenas de miles de personas. La opinión pública se volvió contra la energía nuclear y varios reactores están detenidos."
 mdr_disaster_coverup: "Encubrimiento de la catástrofe"
 mdr_disaster_coverup_desc: "Minimizamos la magnitud del desastre. Los rumores y el enojo de los damnificados se extienden por el país."

 mdr_disasters_opt_help: "Ayudar a los damnificados."
 mdr_disasters_opt_own: "Reconstruir con nuestros propios fondos."
 mdr_disasters_opt_aid: "Pedir ayuda internacional."
 mdr_disasters_opt_army: "Movilizar al ejército para el rescate."
 mdr_disasters_opt_fund: "Usar el Fondo de Estabilización."
 mdr_disasters_opt_coverup: "Minimizar la crisis."

 mdr_disasters.1.t: "Terremoto en [mdr_disaster_state.GetName]"
 mdr_disasters.1.d1: "Un sismo sacudió [mdr_disaster_state.GetName]. Hay daños en edificios antiguos y carreteras, pero la mayoría de la población está a salvo."
 mdr_disasters.1.d2: "Un terremoto fuerte golpeó [mdr_disaster_state.GetName]. Barrios enteros quedaron sin luz ni agua, varias fábricas sufrieron daños y los equipos de rescate buscan sobrevivientes entre los escombros.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.1.d3: "Un terremoto devastador arrasó [mdr_disaster_state.GetName]. Ciudades enteras están en ruinas, hay miles de muertos y los hospitales que quedaron en pie no dan abasto. Es la peor tragedia en décadas.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.2.t: "Tsunami en [mdr_disaster_state.GetName]"
 mdr_disasters.2.d1: "Una ola inusual inundó la costa de [mdr_disaster_state.GetName]. Los daños se concentran en puertos y paseos costeros."
 mdr_disasters.2.d2: "Un tsunami golpeó la costa de [mdr_disaster_state.GetName] tras un sismo submarino. El agua arrasó pueblos pesqueros, puertos y carreteras costeras.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.2.d3: "Olas gigantes barrieron la costa de [mdr_disaster_state.GetName] sin aviso. Pueblos enteros desaparecieron y el número de víctimas crece cada hora.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.3.t: "Tormenta tropical en [mdr_disaster_state.GetName]"
 mdr_disasters.3.d1: "Una tormenta tropical azotó [mdr_disaster_state.GetName] con lluvias y vientos fuertes. Hay árboles caídos, cortes de luz e inundaciones localizadas."
 mdr_disasters.3.d2: "Un huracán tocó tierra en [mdr_disaster_state.GetName]. Los vientos arrancaron techos, el mar inundó la costa y miles de personas fueron evacuadas.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.3.d3: "Uno de los huracanes más violentos de la historia arrasó [mdr_disaster_state.GetName]. Ciudades enteras están bajo el agua, la red eléctrica colapsó y miles de personas perdieron todo.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.9.t: "Tornado en [mdr_disaster_state.GetName]"
 mdr_disasters.9.d1: "Un tornado tocó tierra en [mdr_disaster_state.GetName]. Arrancó techos y tiró postes de luz a su paso, pero las sirenas de alerta dieron tiempo a la gente para refugiarse."
 mdr_disasters.9.d2: "Una ola de tornados barrió [mdr_disaster_state.GetName]. Barrios enteros quedaron arrasados, hay fábricas dañadas y miles de familias perdieron su casa.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.9.d3: "Una de las olas de tornados más violentas de la historia borró del mapa pueblos enteros de [mdr_disaster_state.GetName]. La cifra de muertos no deja de subir y la infraestructura de la región está en ruinas.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.4.t: "Inundaciones en [mdr_disaster_state.GetName]"
 mdr_disasters.4.d1: "Lluvias intensas desbordaron los ríos de [mdr_disaster_state.GetName]. Varios barrios bajos quedaron bajo el agua."
 mdr_disasters.4.d2: "Inundaciones graves cubrieron gran parte de [mdr_disaster_state.GetName]. Cultivos, carreteras y fábricas quedaron bajo el agua y miles de familias perdieron su casa.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.4.d3: "Las peores inundaciones en un siglo sumergieron [mdr_disaster_state.GetName]. Millones de personas están desplazadas y el agua tardará semanas en retirarse.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.5.t: "Incendios forestales en [mdr_disaster_state.GetName]"
 mdr_disasters.5.d1: "Un incendio forestal quemó miles de hectáreas en [mdr_disaster_state.GetName]. Los bomberos lograron contenerlo antes de que llegara a las ciudades."
 mdr_disasters.5.d2: "Incendios fuera de control arrasan [mdr_disaster_state.GetName]. El humo cubre las ciudades, se evacuaron pueblos enteros y las llamas destruyeron viviendas e instalaciones.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.5.d3: "Una ola de incendios sin precedentes consume [mdr_disaster_state.GetName]. Las llamas avanzan sobre zonas urbanas y el país entero mira con horror.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.6.t: "Ola de calor en [mdr_disaster_state.GetName]"
 mdr_disasters.6.d1: "Temperaturas récord golpean [mdr_disaster_state.GetName]. La demanda eléctrica se dispara y los hospitales atienden golpes de calor."
 mdr_disasters.6.d2: "Una ola de calor mortal azota [mdr_disaster_state.GetName]. Miles de ancianos murieron en sus casas y la red eléctrica no da abasto.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.6.d3: "Un calor extremo nunca visto paraliza [mdr_disaster_state.GetName]. Las muertes se cuentan por decenas de miles y la actividad económica se detuvo.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.7.t: "Accidente industrial en [mdr_disaster_state.GetName]"
 mdr_disasters.7.d1: "Una explosión en una planta química de [mdr_disaster_state.GetName] dejó heridos y obligó a evacuar el barrio."
 mdr_disasters.7.d2: "Una enorme explosión en un depósito industrial de [mdr_disaster_state.GetName] destruyó manzanas enteras. Se investigan las fallas de seguridad.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.7.d3: "Una explosión catastrófica devastó [mdr_disaster_state.GetName]. La onda expansiva se sintió a kilómetros, hay cientos de muertos y miles de heridos.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.8.t: "Accidente nuclear en [mdr_disaster_state.GetName]"
 mdr_disasters.8.d1: "Una falla en una central nuclear de [mdr_disaster_state.GetName] provocó una fuga menor. Se detuvo el reactor y no hay riesgo para la población."
 mdr_disasters.8.d2: "Un accidente en una central nuclear de [mdr_disaster_state.GetName] liberó radiación. Se evacuó la zona y el país entero debate el futuro de la energía nuclear.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."
 mdr_disasters.8.d3: "Un terremoto y un tsunami devastaron [mdr_disaster_state.GetName] y dañaron una central nuclear, que sufrió la fusión de sus reactores. Decenas de miles de personas fueron evacuadas y la zona quedará contaminada durante años.\n\nCada opción de ayuda acorta la crisis, pero tiene su precio."

 mdr_disasters_news_a: "Una tragedia terrible."
 mdr_disasters.11.t: "Terremoto devastador en [mdr_disaster_country_news.GetName]"
 mdr_disasters.11.d: "Un terremoto de gran magnitud devastó [mdr_disaster_state_news.GetName], en [mdr_disaster_country_news.GetNameDef]. Las primeras cifras hablan de miles de víctimas y los equipos de rescate de todo el mundo viajan a la zona."
 mdr_disasters.12.t: "Tsunami mortal en [mdr_disaster_country_news.GetName]"
 mdr_disasters.12.d: "Un tsunami arrasó la costa de [mdr_disaster_state_news.GetName], en [mdr_disaster_country_news.GetNameDef]. Las imágenes de pueblos borrados del mapa conmueven al mundo."
 mdr_disasters.13.t: "Huracán catastrófico en [mdr_disaster_country_news.GetName]"
 mdr_disasters.13.d: "Un huracán de máxima categoría arrasó [mdr_disaster_state_news.GetName], en [mdr_disaster_country_news.GetNameDef]. Hay ciudades bajo el agua y miles de desaparecidos."
 mdr_disasters.19.t: "Ola de tornados mortal en [mdr_disaster_country_news.GetName]"
 mdr_disasters.19.d: "Una ola histórica de tornados destruyó pueblos enteros en [mdr_disaster_state_news.GetName], en [mdr_disaster_country_news.GetNameDef]. Los equipos de rescate buscan sobrevivientes entre los escombros."
 mdr_disasters.14.t: "Inundaciones históricas en [mdr_disaster_country_news.GetName]"
 mdr_disasters.14.d: "Las peores inundaciones en un siglo cubrieron [mdr_disaster_state_news.GetName], en [mdr_disaster_country_news.GetNameDef]. Millones de personas están desplazadas."
 mdr_disasters.15.t: "Incendios sin precedentes en [mdr_disaster_country_news.GetName]"
 mdr_disasters.15.d: "Incendios fuera de control arrasan [mdr_disaster_state_news.GetName], en [mdr_disaster_country_news.GetNameDef]. El humo se ve desde el espacio."
 mdr_disasters.16.t: "Ola de calor mortal en [mdr_disaster_country_news.GetName]"
 mdr_disasters.16.d: "Un calor extremo causó decenas de miles de muertes en [mdr_disaster_state_news.GetName], en [mdr_disaster_country_news.GetNameDef]."
 mdr_disasters.17.t: "Explosión catastrófica en [mdr_disaster_country_news.GetName]"
 mdr_disasters.17.d: "Una explosión industrial devastó [mdr_disaster_state_news.GetName], en [mdr_disaster_country_news.GetNameDef]. Es uno de los peores accidentes industriales de la historia."
 mdr_disasters.18.t: "Catástrofe nuclear en [mdr_disaster_country_news.GetName]"
 mdr_disasters.18.d: "Un terremoto y un tsunami dañaron una central nuclear en [mdr_disaster_state_news.GetName], en [mdr_disaster_country_news.GetNameDef], que sufrió la fusión de sus reactores. Es el peor accidente nuclear desde Chernóbil y varios países revisan sus planes de energía atómica."

 mdr_disasters.20.t: "Catástrofe en [mdr_disaster_victim.GetName]"
 mdr_disasters.20.d: "[mdr_disaster_victim.GetNameDefCap] sufrió una catástrofe y pide ayuda al mundo. Enviar ayuda nos cuesta dinero, pero mejora su opinión sobre nosotros y nos da influencia en el país."
 mdr_disasters.20.a: "Enviar una ayuda generosa."
 mdr_disasters.20.b: "Enviar una ayuda simbólica."
 mdr_disasters.20.c: "No podemos ayudar."

 mdr_diag_disaster: "Provocar un desastre ahora"
 mdr_diag_disaster_desc: "Provoca ahora un desastre en un estado al azar de nuestro país, elegido como uno real: la región del estado y la estación deciden el tipo, y después se sortea la magnitud. Sirve para probar el sistema de desastres."
 mdr_diag_disaster_tt: "Un desastre golpea un estado al azar de nuestro país. El tipo depende de la región y la estación (por ejemplo, un §Ytsunami§! en la costa de Japón o un §Ytornado§! en el callejón de los tornados de EE. UU.), y la magnitud va de §Ysuave§! a §Rsevera§!, con noticia para todo el mundo."

 # Demografía
 mdr_aging_1: "Envejecimiento de la población"
 mdr_aging_1_desc: "Nacen menos niños de los que hacen falta para reemplazar a la generación anterior. Las pensiones pesan cada vez más en el presupuesto."
 mdr_aging_2: "Envejecimiento acelerado"
 mdr_aging_2_desc: "Cada año hay menos jóvenes y más jubilados. Faltan trabajadores y el gasto en pensiones y salud crece sin parar."
 mdr_aging_3: "Invierno demográfico"
 mdr_aging_3_desc: "La población se reduce. Hay pueblos abandonados, escuelas que cierran y no alcanzan los jóvenes para sostener la economía ni el ejército."
 mdr_demographic_bonus: "Bono demográfico"
 mdr_demographic_bonus_desc: "Una población muy joven llega a la edad de trabajar. Si hay empleo para todos, es un motor de crecimiento."
 mdr_demo_root: "Plan demográfico nacional"
 mdr_demo_root_desc: "Cada año nacen menos niños y hay más jubilados. Si no hacemos nada, faltarán trabajadores y las pensiones hundirán el presupuesto. Reunimos a demógrafos, economistas y ministros para preparar un plan de largo plazo.\n\nHay tres caminos: fomentar la natalidad, atraer inmigrantes o producir más con menos trabajadores. Cada camino que terminemos baja un nivel el envejecimiento, y se pueden seguir los tres. Entre una reforma y la siguiente pasan al menos 30 días."
 mdr_demo_natal_housing: "Vivienda para familias jóvenes"
 mdr_demo_natal_housing_desc: "Las parejas jóvenes postergan los hijos porque no pueden pagar una casa. Construimos viviendas sociales y damos créditos baratos a quienes forman una familia.\n\nNecesitamos un gobierno estable para sostener un plan de viviendas de varios años."
 mdr_demo_immigration_family: "Reunificación familiar"
 mdr_demo_immigration_family_desc: "Permitimos que los trabajadores extranjeros traigan a sus parejas e hijos. Las familias echan raíces, y sus hijos crecen como ciudadanos de nuestro país.\n\nEn plena guerra no podemos abrir las fronteras así."
 mdr_demo_productivity_training: "Formación para trabajadores mayores"
 mdr_demo_productivity_training_desc: "Cursos gratuitos para que los trabajadores de más de 50 años aprendan a usar las nuevas tecnologías y no queden fuera del mercado laboral."
 mdr_demo_census: "Censo nacional de población"
 mdr_demo_census_desc: "Antes de reformar, hay que saber cuántos somos, cuántos años tenemos y dónde vivimos. Un censo completo muestra qué regiones se vacían y dónde faltan trabajadores."
 mdr_demo_pact: "Pacto intergeneracional"
 mdr_demo_pact_desc: "Con dos caminos de reformas terminados, sentamos a sindicatos, empresarios, jubilados y jóvenes a firmar un acuerdo duradero: cada generación aporta su parte para sostener a las otras."
 mdr_demo_two_paths_tt: "Haber terminado al menos dos de los tres caminos de reformas"
 mdr_demo_treasury_tt: "Tener dinero en el tesoro (no estar en números rojos)"
 mdr_demo_pact_idea: "Pacto intergeneracional"
 mdr_demo_pact_idea_desc: "Jóvenes, trabajadores y jubilados firmaron un acuerdo para repartir el peso del envejecimiento. Las familias confían en el futuro y el gasto social se ordena."
 mdr_demo_rest_tt: "Pasaron al menos 30 días desde la última reforma demográfica"

 mdr_demo_natal_1: "Asignación universal por hijo"
 mdr_demo_natal_1_desc: "Pagamos todos los meses una suma por cada hijo menor de edad, sin importar el ingreso de la familia. Muchas parejas dicen que no tienen hijos porque no les alcanza el dinero; esto les quita esa excusa.\n\nEs el primer paso del camino natalista: lento y caro, pero sin efectos secundarios."
 mdr_demo_natal_2: "Guarderías públicas gratuitas"
 mdr_demo_natal_2_desc: "Abrimos guarderías gratuitas en todos los barrios, para que tener un hijo no obligue a uno de los padres a dejar de trabajar. Los países que lo hicieron, como Francia y Suecia, tienen las tasas de natalidad más altas de Europa."
 mdr_demo_natal_3: "Licencias parentales extendidas"
 mdr_demo_natal_3_desc: "Ampliamos las licencias pagas por maternidad y paternidad, y obligamos a las empresas a guardar el puesto. Tener hijos deja de ser un riesgo para la carrera.\n\nAl terminar, el camino natalista está completo y el envejecimiento baja un nivel."
 mdr_demo_immigration_1: "Visas de trabajo para extranjeros"
 mdr_demo_immigration_1_desc: "Abrimos la puerta a trabajadores extranjeros para los puestos que no logramos cubrir: campo, construcción, cuidado de ancianos y salud. Es el camino más rápido, pero no todos lo ven con buenos ojos."
 mdr_demo_immigration_2: "Programas de integración"
 mdr_demo_immigration_2_desc: "Cursos de idioma, reconocimiento de títulos y ayuda para encontrar vivienda. Los inmigrantes que se integran trabajan más, pagan más impuestos y se quedan.\n\nSin un mínimo de estabilidad, estos programas generarían más rechazo que integración."
 mdr_demo_immigration_3: "Ciudadanía acelerada"
 mdr_demo_immigration_3_desc: "Los inmigrantes con empleo estable y sin antecedentes pueden nacionalizarse en pocos años. Votan, pagan impuestos y forman parte del país.\n\nAl terminar, el camino migratorio está completo y el envejecimiento baja un nivel."
 mdr_demo_productivity_1: "Automatización industrial"
 mdr_demo_productivity_1_desc: "Subsidiamos robots, software y maquinaria para que las fábricas produzcan lo mismo con menos personas. Japón y Corea del Sur ya lo hacen para compensar la falta de jóvenes."
 mdr_demo_productivity_2: "Retrasar la edad de jubilación"
 mdr_demo_productivity_2_desc: "Subimos la edad de jubilación de a poco, a medida que la gente vive más. Alivia las cuentas de las pensiones, pero es una de las medidas más impopulares que existen.\n\nSolo un gobierno con mucha estabilidad puede aprobarla sin una ola de huelgas."
 mdr_demo_productivity_3: "Robótica para el cuidado de mayores"
 mdr_demo_productivity_3_desc: "Invertimos en robots, sensores y telemedicina para cuidar a los ancianos con menos personal. Es caro, así que necesitamos tener dinero en el tesoro.\n\nAl terminar, el camino de la productividad está completo y el envejecimiento baja un nivel."

 # Tratados
 mdr_treaties_modifier: "Tratados de armas"
 mdr_treaties_category: "Tratados internacionales"
 mdr_treaties_category_desc: "Los tratados de armas limitan los arsenales a cambio de seguridad y confianza; sus efectos se suman en el modificador §YTratados de armas§!. Salir de uno enoja a los demás miembros y sube la tensión mundial.\n\nLos tratados climáticos (Kioto y París) bajan las emisiones de nuestras industrias y cuestan dinero a los países ricos por un tiempo. Salir de uno enoja a sus miembros.\n\nCalentamiento global: §R+[?global.mdr_warming|2] °C§! sobre la era preindustrial."
 mdr_treaty_cooldown_tt: "Pasó al menos un año desde nuestro último cambio en un tratado"
 mdr_treaty_partner_tt: "La otra superpotencia existe y no estamos en guerra con ella"
 mdr_treaty_partner_usa_tt: "Estados Unidos existe y no estamos en guerra con él"
 mdr_treaty_join_1: "Firmar el Tratado de No Proliferación (TNP)"
 mdr_treaty_join_1_desc: "Renunciamos a las armas nucleares a cambio de cooperación en energía nuclear civil."
 mdr_treaty_leave_1: "Abandonar el Tratado de No Proliferación (TNP)"
 mdr_treaty_leave_1_desc: "Recuperamos la libertad de buscar armas nucleares, como Corea del Norte en 2003. Todos los miembros nos verán como una amenaza."
 mdr_treaty_join_2: "Firmar el Tratado de Prohibición de Ensayos Nucleares"
 mdr_treaty_join_2_desc: "Nos comprometemos a no realizar pruebas nucleares."
 mdr_treaty_leave_2: "Abandonar el Tratado de Prohibición de Ensayos Nucleares"
 mdr_treaty_leave_2_desc: "Retiramos nuestra firma, como hizo Rusia en 2023."
 mdr_treaty_propose_3: "Proponer un tratado de reducción de armas estratégicas (START)"
 mdr_treaty_propose_3_desc: "Ofrecemos a la otra superpotencia un límite mutuo de ojivas nucleares. Si acepta, ambos entramos."
 mdr_treaty_leave_3: "Abandonar el tratado START"
 mdr_treaty_leave_3_desc: "Sin límites a las ojivas, la carrera armamentista vuelve a empezar, como cuando Rusia suspendió el New START en 2023."
 mdr_treaty_propose_4: "Proponer un tratado de misiles de alcance intermedio (INF)"
 mdr_treaty_propose_4_desc: "Ofrecemos prohibir mutuamente los misiles de alcance medio. Si la otra superpotencia acepta, ambos entramos."
 mdr_treaty_leave_4: "Abandonar el tratado INF"
 mdr_treaty_leave_4_desc: "Volvemos a desplegar misiles de alcance intermedio, como tras el fin del INF en 2019."
 mdr_treaty_propose_5: "Proponer un tratado de misiles antibalísticos (ABM)"
 mdr_treaty_propose_5_desc: "Ofrecemos limitar mutuamente los escudos antimisiles para mantener el equilibrio nuclear."
 mdr_treaty_leave_5: "Abandonar el tratado ABM"
 mdr_treaty_leave_5_desc: "Nos liberamos para construir un escudo antimisiles, como Estados Unidos en 2002."
 mdr_treaty_join_6: "Entrar en el Tratado de Fuerzas Convencionales en Europa (FACE)"
 mdr_treaty_join_6_desc: "Aceptamos límites a nuestros tanques y artillería en Europa a cambio de transparencia mutua."
 mdr_treaty_leave_6: "Suspender el Tratado de Fuerzas Convencionales en Europa"
 mdr_treaty_leave_6_desc: "Dejamos de aplicar los límites, como Rusia en 2007."
 mdr_treaty_join_7: "Entrar en el Tratado de Cielos Abiertos"
 mdr_treaty_join_7_desc: "Permitimos vuelos de observación desarmados sobre nuestro territorio a cambio de poder hacerlos sobre los demás."
 mdr_treaty_leave_7: "Abandonar el Tratado de Cielos Abiertos"
 mdr_treaty_leave_7_desc: "Dejamos de permitir los vuelos de observación, como Estados Unidos en 2020 y Rusia en 2021."
 mdr_treaty_join_8: "Firmar la Convención de Ottawa sobre minas antipersona"
 mdr_treaty_join_8_desc: "Prohibimos las minas antipersona. Mejora nuestra imagen, pero perdemos una herramienta defensiva."
 mdr_treaty_leave_8: "Abandonar la Convención de Ottawa"
 mdr_treaty_leave_8_desc: "Volvemos a minar nuestras fronteras para defendernos, como Polonia, Finlandia y los países bálticos en 2025."
 mdr_treaty_join_9: "Firmar la Convención sobre Municiones en Racimo"
 mdr_treaty_join_9_desc: "Prohibimos las bombas de racimo, que dejan miles de explosivos sin detonar."
 mdr_treaty_leave_9: "Abandonar la Convención sobre Municiones en Racimo"
 mdr_treaty_leave_9_desc: "Recuperamos las bombas de racimo para nuestro arsenal, como Lituania en 2025."
 mdr_treaty_propose_10: "Negociar un acuerdo nuclear con Estados Unidos"
 mdr_treaty_propose_10_desc: "Limitamos nuestro enriquecimiento de uranio a cambio del alivio de las sanciones, como en el acuerdo de 2015. Estados Unidos decidirá si acepta."
 mdr_treaty_leave_10: "Abandonar el acuerdo nuclear con Irán"
 mdr_treaty_leave_10_desc: "El acuerdo termina: Irán pierde el alivio de sanciones y queda libre de los límites al enriquecimiento, como tras la salida de Estados Unidos en 2018."

 mdr_treaties.1.t: "Presión internacional"
 mdr_treaties.1.d1: "Las Naciones Unidas y las grandes potencias nos piden firmar el Tratado de No Proliferación Nuclear. Firmarlo nos daría cooperación nuclear civil, pero renunciaríamos a las armas atómicas."
 mdr_treaties.1.d2: "Varios gobiernos nos piden firmar el Tratado de Prohibición de Ensayos Nucleares, como gesto de buena voluntad."
 mdr_treaties.1.d8: "Una campaña internacional nos pide firmar la Convención de Ottawa y destruir nuestras minas antipersona."
 mdr_treaties.1.a: "Firmaremos."
 mdr_treaties.1.b: "Rechazamos la propuesta."
 mdr_treaties.2.t: "Propuesta de [From.GetNameDef]"
 mdr_treaties.2.d3: "[From.GetNameDefCap] propone un nuevo tratado de reducción de armas estratégicas para limitar las ojivas de ambos países."
 mdr_treaties.2.d4: "[From.GetNameDefCap] propone prohibir mutuamente los misiles de alcance intermedio."
 mdr_treaties.2.d5: "[From.GetNameDefCap] propone limitar mutuamente los sistemas antimisiles para mantener el equilibrio nuclear."
 mdr_treaties.2.d10: "[From.GetNameDefCap] ofrece limitar su programa nuclear a cambio de que levantemos parte de las sanciones."
 mdr_treaties.2.a: "Aceptamos."
 mdr_treaties.2.b: "Rechazamos la propuesta."
 mdr_treaties.3.t: "Una decisión histórica"
 mdr_treaties.3.d1: "En la historia real, Estados Unidos abandonó el tratado ABM en 2002 para construir su escudo antimisiles. ¿Seguimos ese camino?"
 mdr_treaties.3.d2: "En la historia real, Corea del Norte abandonó el Tratado de No Proliferación en 2003 para desarrollar armas nucleares. ¿Seguimos ese camino?"
 mdr_treaties.3.d3: "En la historia real, Cuba firmó el Tratado de No Proliferación en 2002. ¿Lo firmamos?"
 mdr_treaties.3.d4: "En la historia real, Rusia suspendió el Tratado de Fuerzas Convencionales en Europa en 2007. ¿Seguimos ese camino?"
 mdr_treaties.3.d6: "En la historia real, Irán firmó en 2015 el acuerdo nuclear con las grandes potencias: límites al enriquecimiento a cambio del alivio de las sanciones. ¿Lo firmamos?"
 mdr_treaties.3.d7: "En la historia real, Estados Unidos abandonó en 2018 el acuerdo nuclear con Irán. ¿Seguimos ese camino?"
 mdr_treaties.3.d8: "En la historia real, Estados Unidos abandonó el tratado INF en 2019 acusando a Rusia de violarlo. ¿Seguimos ese camino?"
 mdr_treaties.3.d9: "En la historia real, Estados Unidos abandonó el Tratado de Cielos Abiertos en 2020. ¿Seguimos ese camino?"
 mdr_treaties.3.d10: "En la historia real, Rusia abandonó el Tratado de Cielos Abiertos en 2021. ¿Seguimos ese camino?"
 mdr_treaties.3.d11: "En la historia real, Rusia suspendió el New START en 2023 en medio de la guerra en Ucrania. ¿Seguimos ese camino?"
 mdr_treaties.3.d12: "En la historia real, Rusia retiró en 2023 su ratificación del Tratado de Prohibición de Ensayos Nucleares. ¿Seguimos ese camino?"
 mdr_treaties.3.d13: "En la historia real, Lituania abandonó en 2025 la Convención sobre Municiones en Racimo por la amenaza rusa. ¿Seguimos ese camino?"
 mdr_treaties.3.d14: "En la historia real, en 2025 abandonamos la Convención de Ottawa para volver a minar la frontera con Rusia. ¿Seguimos ese camino?"
 mdr_treaties.3.d15: "En la historia real, en esta época firmamos la Convención de Ottawa sobre minas antipersona. ¿La firmamos?"
 mdr_treaties.3.a: "Seguir el rumbo de la historia."
 mdr_treaties.3.b: "Mantener nuestra política actual."
 mdr_treaties.4.t: "[mdr_treaty_news_country.GetNameDefCap] abandona un tratado"
 mdr_treaties.4.d1: "[mdr_treaty_news_country.GetNameDefCap] abandonó el Tratado de No Proliferación Nuclear. El mundo teme una nueva potencia atómica."
 mdr_treaties.4.d2: "[mdr_treaty_news_country.GetNameDefCap] retiró su firma del Tratado de Prohibición de Ensayos Nucleares."
 mdr_treaties.4.d3: "[mdr_treaty_news_country.GetNameDefCap] abandonó el tratado de reducción de armas estratégicas. Por primera vez en décadas, no hay límites a los arsenales nucleares de las superpotencias."
 mdr_treaties.4.d4: "[mdr_treaty_news_country.GetNameDefCap] abandonó el tratado de misiles de alcance intermedio. Europa teme una nueva crisis de los euromisiles."
 mdr_treaties.4.d5: "[mdr_treaty_news_country.GetNameDefCap] abandonó el tratado de misiles antibalísticos para construir su escudo antimisiles."
 mdr_treaties.4.d6: "[mdr_treaty_news_country.GetNameDefCap] suspendió el Tratado de Fuerzas Convencionales en Europa."
 mdr_treaties.4.d7: "[mdr_treaty_news_country.GetNameDefCap] abandonó el Tratado de Cielos Abiertos."
 mdr_treaties.4.d8: "[mdr_treaty_news_country.GetNameDefCap] abandonó la Convención de Ottawa y volverá a usar minas antipersona."
 mdr_treaties.4.d9: "[mdr_treaty_news_country.GetNameDefCap] abandonó la Convención sobre Municiones en Racimo."
 mdr_treaties.4.d10: "El acuerdo nuclear con Irán se derrumbó tras la salida de [mdr_treaty_news_country.GetNameDef]."
 mdr_treaties.4.a: "Un mundo más peligroso."

 # Estrechos
 mdr_straits_category: "Estrechos marítimos"
 mdr_straits_category_desc: "Por los estrechos pasa buena parte del comercio y del petróleo del mundo. Quien los controla puede cerrarlos en tiempos de guerra: el precio del petróleo se dispara y los exportadores pierden su ruta, pero el resto del mundo lo toma como una agresión. Un cierre dura como máximo 120 días. Las potencias navales pueden reabrirlos con una misión de escolta."
 mdr_strait_route_blocked: "Ruta comercial bloqueada"
 mdr_strait_route_blocked_desc: "El estrecho por el que salen nuestras exportaciones de petróleo está cerrado. Los petroleros dan rodeos enormes o se quedan en puerto."
 mdr_strait_supply_shock: "Crisis de suministro por Malaca"
 mdr_strait_supply_shock_desc: "El cierre del estrecho de Malaca cortó la ruta del petróleo y las materias primas que importamos."
 mdr_panama_drought: "Sequía en el Canal de Panamá"
 mdr_panama_drought_desc: "La falta de lluvias bajó el nivel del lago Gatún y el canal tuvo que limitar el paso de barcos."
 mdr_strait_close_1: "Cerrar el estrecho de Bab el-Mandeb"
 mdr_strait_close_1_desc: "Sin él, el petróleo del Golfo hacia Europa debe rodear África, como durante los ataques hutíes de 2023. Sube el precio del petróleo, los exportadores pierden la ruta y la tensión mundial aumenta. Los países fuera de nuestra facción nos verán como agresores. El cierre dura como máximo 120 días."
 mdr_strait_reopen_1: "Reabrir el estrecho de Bab el-Mandeb"
 mdr_strait_reopen_1_desc: "Volvemos a permitir el paso de los barcos."
 mdr_strait_escort_1: "Misión naval de escolta en el estrecho de Bab el-Mandeb"
 mdr_strait_escort_1_desc: "Enviamos nuestra flota a escoltar a los mercantes durante 30 días. Al terminar, el paso queda reabierto y los países que no están en guerra con nosotros lo agradecen."
 mdr_strait_close_2: "Cerrar el Canal de Suez"
 mdr_strait_close_2_desc: "Es la ruta más corta entre Asia y Europa; cerrarlo dispara el precio del petróleo. Sube el precio del petróleo, los exportadores pierden la ruta y la tensión mundial aumenta. Los países fuera de nuestra facción nos verán como agresores. El cierre dura como máximo 120 días."
 mdr_strait_reopen_2: "Reabrir el Canal de Suez"
 mdr_strait_reopen_2_desc: "Volvemos a permitir el paso de los barcos."
 mdr_strait_escort_2: "Misión naval de escolta en el Canal de Suez"
 mdr_strait_escort_2_desc: "Enviamos nuestra flota a escoltar a los mercantes durante 30 días. Al terminar, el paso queda reabierto y los países que no están en guerra con nosotros lo agradecen."
 mdr_strait_close_3: "Cerrar el Bósforo y los Dardanelos"
 mdr_strait_close_3_desc: "Por la Convención de Montreux de 1936, en guerra podemos cerrarlo a los buques de guerra, como hizo Turquía en 2022. Corta las exportaciones rusas por el Mar Negro. Sube el precio del petróleo, los exportadores pierden la ruta y la tensión mundial aumenta. Los países fuera de nuestra facción nos verán como agresores. El cierre dura como máximo 120 días."
 mdr_strait_reopen_3: "Reabrir el Bósforo y los Dardanelos"
 mdr_strait_reopen_3_desc: "Volvemos a permitir el paso de los barcos."
 mdr_strait_escort_3: "Misión naval de escolta en el Bósforo y los Dardanelos"
 mdr_strait_escort_3_desc: "Enviamos nuestra flota a escoltar a los mercantes durante 30 días. Al terminar, el paso queda reabierto y los países que no están en guerra con nosotros lo agradecen."
 mdr_strait_close_4: "Cerrar el estrecho de Malaca"
 mdr_strait_close_4_desc: "Por aquí pasa el petróleo que alimenta a China, Japón, Corea y Taiwán. Sube el precio del petróleo, los exportadores pierden la ruta y la tensión mundial aumenta. Los países fuera de nuestra facción nos verán como agresores. El cierre dura como máximo 120 días."
 mdr_strait_reopen_4: "Reabrir el estrecho de Malaca"
 mdr_strait_reopen_4_desc: "Volvemos a permitir el paso de los barcos."
 mdr_strait_escort_4: "Misión naval de escolta en el estrecho de Malaca"
 mdr_strait_escort_4_desc: "Enviamos nuestra flota a escoltar a los mercantes durante 30 días. Al terminar, el paso queda reabierto y los países que no están en guerra con nosotros lo agradecen."
 mdr_strait_close_5: "Cerrar el Canal de Panamá"
 mdr_strait_close_5_desc: "Une el Atlántico y el Pacífico; sin él, los barcos deben rodear Sudamérica. Sube el precio del petróleo, los exportadores pierden la ruta y la tensión mundial aumenta. Los países fuera de nuestra facción nos verán como agresores. El cierre dura como máximo 120 días."
 mdr_strait_reopen_5: "Reabrir el Canal de Panamá"
 mdr_strait_reopen_5_desc: "Volvemos a permitir el paso de los barcos."
 mdr_strait_escort_5: "Misión naval de escolta en el Canal de Panamá"
 mdr_strait_escort_5_desc: "Enviamos nuestra flota a escoltar a los mercantes durante 30 días. Al terminar, el paso queda reabierto y los países que no están en guerra con nosotros lo agradecen."
 mdr_strait_close_6: "Cerrar el estrecho de Gibraltar"
 mdr_strait_close_6_desc: "Es la puerta del Mediterráneo; cerrarlo aísla los puertos del sur de Europa y del norte de África. Sube el precio del petróleo, los exportadores pierden la ruta y la tensión mundial aumenta. Los países fuera de nuestra facción nos verán como agresores. El cierre dura como máximo 120 días."
 mdr_strait_reopen_6: "Reabrir el estrecho de Gibraltar"
 mdr_strait_reopen_6_desc: "Volvemos a permitir el paso de los barcos."
 mdr_strait_escort_6: "Misión naval de escolta en el estrecho de Gibraltar"
 mdr_strait_escort_6_desc: "Enviamos nuestra flota a escoltar a los mercantes durante 30 días. Al terminar, el paso queda reabierto y los países que no están en guerra con nosotros lo agradecen."

 mdr_straits.1.t: "Cierre de un estrecho"
 mdr_straits.1.d1: "[mdr_strait_news_country.GetNameDefCap] cerró el estrecho de Bab el-Mandeb al tráfico marítimo. Los petroleros cambian de rumbo y el precio del petróleo se dispara en todos los mercados."
 mdr_straits.1.d2: "[mdr_strait_news_country.GetNameDefCap] cerró el Canal de Suez al tráfico marítimo. Los petroleros cambian de rumbo y el precio del petróleo se dispara en todos los mercados."
 mdr_straits.1.d3: "[mdr_strait_news_country.GetNameDefCap] cerró el Bósforo y los Dardanelos al tráfico marítimo. Los petroleros cambian de rumbo y el precio del petróleo se dispara en todos los mercados."
 mdr_straits.1.d4: "[mdr_strait_news_country.GetNameDefCap] cerró el estrecho de Malaca al tráfico marítimo. Los petroleros cambian de rumbo y el precio del petróleo se dispara en todos los mercados."
 mdr_straits.1.d5: "[mdr_strait_news_country.GetNameDefCap] cerró el Canal de Panamá al tráfico marítimo. Los petroleros cambian de rumbo y el precio del petróleo se dispara en todos los mercados."
 mdr_straits.1.d6: "[mdr_strait_news_country.GetNameDefCap] cerró el estrecho de Gibraltar al tráfico marítimo. Los petroleros cambian de rumbo y el precio del petróleo se dispara en todos los mercados."
 mdr_straits.1.a: "Los mercados entran en pánico."
 mdr_straits.2.t: "Reapertura de un estrecho"
 mdr_straits.2.d1: "Bab el-Mandeb volvió a abrirse al tráfico marítimo gracias a [mdr_strait_news_country.GetNameDef]. Las navieras retoman sus rutas habituales."
 mdr_straits.2.d2: "Canal de Suez volvió a abrirse al tráfico marítimo gracias a [mdr_strait_news_country.GetNameDef]. Las navieras retoman sus rutas habituales."
 mdr_straits.2.d3: "Bósforo volvió a abrirse al tráfico marítimo gracias a [mdr_strait_news_country.GetNameDef]. Las navieras retoman sus rutas habituales."
 mdr_straits.2.d4: "Estrecho de Malaca volvió a abrirse al tráfico marítimo gracias a [mdr_strait_news_country.GetNameDef]. Las navieras retoman sus rutas habituales."
 mdr_straits.2.d5: "Canal de Panamá volvió a abrirse al tráfico marítimo gracias a [mdr_strait_news_country.GetNameDef]. Las navieras retoman sus rutas habituales."
 mdr_straits.2.d6: "Estrecho de Gibraltar volvió a abrirse al tráfico marítimo gracias a [mdr_strait_news_country.GetNameDef]. Las navieras retoman sus rutas habituales."
 mdr_straits.2.a: "Una buena noticia para el comercio."
 mdr_straits.3.t: "Un portacontenedores bloquea el Canal de Suez"
 mdr_straits.3.d: "El Ever Given, uno de los portacontenedores más grandes del mundo, encalló de costado en el Canal de Suez. Cientos de barcos esperan en ambos extremos y cada día de bloqueo frena miles de millones de dólares en comercio."
 mdr_straits.3.a: "Un barco paraliza el mundo."
 mdr_straits.4.t: "Sequía en el Canal de Panamá"
 mdr_straits.4.d: "La peor sequía en décadas bajó el nivel del lago Gatún, que alimenta las esclusas del canal. Las autoridades limitan el paso de barcos y las navieras buscan rutas alternativas."
 mdr_straits.4.a: "El cambio climático golpea al comercio."
 mdr_straits.5.t: "Ataques en el Mar Rojo"
 mdr_straits.5.d: "Los hutíes de Yemen atacan con misiles y drones a los buques mercantes en el estrecho de Bab el-Mandeb. Las grandes navieras desvían sus barcos por el Cabo de Buena Esperanza y el comercio entre Asia y Europa se encarece."
 mdr_straits.5.a: "La ruta más transitada del mundo, en llamas."
 mdr_straits.6.t: "Un barco encalla en el Canal de Suez"
 mdr_straits.6.d: "Un gran buque mercante encalló en el Canal de Suez y bloqueó el paso durante varios días. Cientos de barcos esperan en ambos extremos."
 mdr_straits.6.a: "Paciencia."

 # Reservas y fuerzas armadas
 mdr_reserves_frozen: "Reservas congeladas"
 mdr_reserves_frozen_desc: "Los países que emiten nuestra moneda de reserva congelaron los ahorros que guardábamos en sus bancos. Nuestra moneda tambalea y nadie nos presta barato."
 mdr_recruitment_crisis: "Crisis de reclutamiento"
 mdr_recruitment_crisis_desc: "Con poco desempleo y un presupuesto militar bajo, casi nadie quiere alistarse en nuestro ejército de voluntarios."
 mdr_mobilization: "Movilización de reservistas"
 mdr_mobilization_desc: "Llamamos a filas a cientos de miles de reservistas. Las fábricas pierden trabajadores y muchos jóvenes intentan salir del país."
 mdr_military.1.t: "Nuestras reservas fueron congeladas"
 mdr_military.1.d: "Los bancos centrales que guardaban nuestras reservas en el extranjero las congelaron, como le pasó a Afganistán en 2021 y a Rusia en 2022. Perdimos acceso a buena parte de nuestros ahorros de un día para el otro."
 mdr_military.1.a: "Nunca más: pasaremos a reservas propias y en oro."
 mdr_military.1.b: "Denunciar el robo ante el mundo."
 mdr_military_category: "Defensa y reclutamiento"
 mdr_military_category_desc: "Medidas para mantener las filas de nuestras fuerzas armadas."
 mdr_mobilize_reservists: "Movilizar a los reservistas"
 mdr_mobilize_reservists_desc: "Llamamos a filas a cerca del 0,3% de la población, como hizo Israel en 2023 o Rusia en 2022. Durante 180 días las fábricas pierden trabajadores y cae la estabilidad. Se puede repetir una vez por año."
 mdr_mobilization_cooldown_tt: "Pasó al menos un año desde la última movilización"
 mdr_recruitment_campaign: "Campaña de reclutamiento"
 mdr_recruitment_campaign_desc: "Subimos los sueldos militares, ofrecemos becas y lanzamos publicidad para atraer voluntarios. Termina la crisis de reclutamiento por un año."

 mdr_disaster_aid_large: "Nos envió una ayuda generosa tras una catástrofe"
 mdr_disaster_aid_small: "Nos envió ayuda tras una catástrofe"
 mdr_left_arms_treaty: "Abandonó un tratado de armas"
 mdr_closed_strait: "Cerró un estrecho marítimo"
 mdr_reopened_strait: "Reabrió un estrecho marítimo"
 mdr_strait_close_7: "Cerrar el estrecho de Ormuz"
 mdr_strait_close_7_desc: "Por Ormuz sale una quinta parte del petróleo del mundo, el de Arabia Saudita, Kuwait, Irak, Emiratos y Catar. Cerrarlo dispara el precio del petróleo, los exportadores del Golfo pierden su ruta y la tensión mundial aumenta. Los países fuera de nuestra facción nos verán como agresores. El cierre dura como máximo 120 días."
 mdr_strait_reopen_7: "Reabrir el estrecho de Ormuz"
 mdr_strait_reopen_7_desc: "Volvemos a permitir el paso de los barcos."
 mdr_strait_escort_7: "Misión naval de escolta en el estrecho de Ormuz"
 mdr_strait_escort_7_desc: "Enviamos nuestra flota a escoltar a los petroleros durante 30 días. Al terminar, el paso queda reabierto y los países que no están en guerra con nosotros lo agradecen."
 mdr_straits.1.d7: "[mdr_strait_news_country.GetNameDefCap] cerró el estrecho de Ormuz. Una quinta parte del petróleo del mundo quedó atrapada en el Golfo y el precio se dispara en todos los mercados."
 mdr_straits.2.d7: "El estrecho de Ormuz volvió a abrirse al tráfico marítimo gracias a [mdr_strait_news_country.GetNameDef]. Los petroleros vuelven a salir del Golfo."
 mdr_strait_closed_tt: "El estrecho está cerrado: ningún barco ni convoy puede pasar."
 MDR_RULE_ENABLED: "Activado"
 MDR_RULE_DISABLED: "Desactivado"
 MDR_RULE_AMMO: "Munición"
 MDR_RULE_AMMO_ENABLED_DESC: "Las fábricas militares producen munición, el ejército la gasta en combate y en maniobras, y quedarse sin munición debilita a las tropas."
 MDR_RULE_AMMO_DISABLED_DESC: "Sin sistema de munición: no hay reserva, consumo ni castigos, y desaparece la caja de munición de la barra superior."
 MDR_RULE_FOOD: "Comida"
 MDR_RULE_FOOD_ENABLED_DESC: "Cada país produce, importa y consume granos. La falta de comida baja la estabilidad y la población."
 MDR_RULE_FOOD_DISABLED_DESC: "Sin sistema de comida: no hay consumo ni escasez, y desaparece la caja de comida de la barra superior. Las tierras de cultivo siguen produciendo granos para el mercado."
 MDR_RULE_CLIMATE: "Clima y contaminación"
 MDR_RULE_CLIMATE_ENABLED_DESC: "La industria contamina los estados y calienta el planeta, con sus efectos y los tratados de Kioto y París."
 MDR_RULE_CLIMATE_DISABLED_DESC: "Sin contaminación ni calentamiento global."
 MDR_RULE_STRAITS: "Estrechos marítimos"
 MDR_RULE_STRAITS_ENABLED_DESC: "Quien controla un estrecho puede cerrarlo en guerra, y hay cierres históricos o al azar según la regla de eventos mundiales."
 MDR_RULE_STRAITS_DISABLED_DESC: "Los estrechos nunca se cierran."
 MDR_RULE_SOCIETY: "Protestas y huelgas"
 MDR_RULE_SOCIETY_ENABLED_DESC: "Huelgas, protestas y estallidos sociales según la desigualdad y las leyes civiles."
 MDR_RULE_SOCIETY_DISABLED_DESC: "Sin huelgas, protestas ni estallidos sociales de Realpolitik. Las leyes civiles siguen funcionando."
