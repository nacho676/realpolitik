 antarctica_join_ccas_effect_tt: "Únete §YCCAS§!.\nAumenta las salidas de laboratorio relevantes por §G+20%§!:\n- §YGenes Tech§! de salida\n- Producción de multiplicador de costes sanitarios\n- Producción mensual de población\nEjemplo: §Y+8.0%§! Los genes se convierten en §G+9.6%§!."
