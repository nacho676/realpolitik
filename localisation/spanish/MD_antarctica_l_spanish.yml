 antarctica_reports_warning_tt: "§RAdvertencia:§!\nSi la cantidad de informes viola 7, las Partes Consultivas en el Tratado Antártico pueden adoptar medidas diplomáticas contra su nación, incluidas posibles sanciones y pérdida del estatuto de ATCP, si están presentes. Se recomienda mantener la cantidad de informes por debajo de 7 para evitar consecuencias negativas.\n\nSi la violación sucederá mientras haya detectado una investigación nuclear, cada nación del Tratado Antártico conseguirá un evento para colocar un embargo en su nación."
