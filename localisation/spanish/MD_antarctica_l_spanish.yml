 leave_antarctica_cannot_be_stopped_tt: "§REsta acción no se puede detener.§!"
 leave_antarctica_treaty_warning_tt: "§RATENCIÓN:§!\nDejando el §CTratado Antártico§! mientras tenía un §YResearch Station§! in §CAntártida§! provocará la respuesta mundial de los miembros del Tratado, incluidas las posibles sanciones y el retroceso diplomático, y se recomienda desmantelar cualquier estación de investigación en §CAntártida§! antes de salir del tratado para evitar consecuencias negativas.\n\nSin embargo, si usted decide abandonar el Tratado mientras tiene uno, ningún artículo le impedirá iniciar actividades prohibidas en §CAntártida§!, como la explotación de recursos o la presencia militar, que puede conducir a graves consecuencias para la reputación global de su nación."
