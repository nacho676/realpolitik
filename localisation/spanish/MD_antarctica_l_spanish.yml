 MD_antarctica_news.1.t: "[FROM.GetName] Se aplica al Tratado Antártico"
 MD_antarctica_news.1.d: "[FROM.GetName] ha solicitado unirse al Tratado Antártico, señalando un posible cambio en su política exterior y compromiso con la conservación del medio ambiente. El Tratado Antártico es un acuerdo internacional que regula el uso de la Antártida con fines pacíficos y la investigación científica, protegiendo al mismo tiempo el ecosistema único del continente. La aplicación de [FROM.GetName] para unirse al tratado ha sido satisfecha con reacciones cálidas de la comunidad internacional, y algunos elogian el movimiento como un paso positivo hacia la cooperación global, mientras que otros expresan escepticismo acerca de las intenciones del [FROM.GetName] y el compromiso con los principios del tratado. El proceso de aplicación tardará un mes en completarse."
 MD_antarctica_news.1.a: "El tiempo se lo dirá"
 MD_antarctica_news.1.b: "Es sobre el tiempo"
 MD_antarctica_news.2.t: "[FROM.GetName] Se une al Tratado Antártico"
 MD_antarctica_news.2.d: "Hoy, en [GetDateText], [FROM.GetName] se ha adherido oficialmente al Tratado Antártico, convirtiéndose en miembro del acuerdo internacional que regula el uso de la Antártida con fines pacíficos y la investigación científica. [FROM.GetName] se ha comprometido a defender los principios de la conservación del medio ambiente y la cooperación internacional en la Antártida, lo que se ha encontrado con reacciones positivas de la comunidad mundial, con muchas alabanzas [FROM.GetName] por su compromiso de proteger el ecosistema único de la Antártida y promover la colaboración pacífica entre las naciones."
 MD_antarctica_news.2.a: "Otro Miembro"
 MD_antarctica_news.2.b: "¡Vamos a trabajar!"
 MD_antarctica_news.3.t: "[FROM.GetName] Esfuerzos para dejar el Tratado Antártico"
 MD_antarctica_news.3.d: "[FROM.GetName] decidió hoy abandonar el Tratado Antártico. La Comisión para la Conservación de los Recursos Marinos Vivos Antárticos (CCAMLR) les está dando 2 años para desmantelar cualquier estación de investigación que tengan en la Antártida y para evitar cualquier actividad prohibida, como la explotación de recursos o la presencia militar, y se ha cumplido la decisión de abandonar el tratado con reacciones mixtas de la comunidad internacional, expresando algunas decepciones y preocupación por las posibles consecuencias para el medio ambiente y la cooperación mundial, Mientras que otros apoyan el derecho de [FROM.GetName] a tomar sus propias decisiones sobre su participación en los acuerdos internacionales, el proceso de salir del tratado tomará 2 años para completarlo"
 MD_antarctica_news.3.a: "Qué vergüenza."
 MD_antarctica_news.3.b: "Tenemos cosas mejores que hacer"
 MD_antarctica_news.4.t: "[FROM.GetName] Deja el Tratado Antártico"
 MD_antarctica_news.4.d: "[MD_antarctica_news_4_desc]"
 MD_antarctica_news.4.a: "El Tratado está debilitado"
 MD_antarctica_news.4.b: "Lo que sea."
 MD_antarctica_news_4_desc_1: "Después de 2 años de salir del Tratado Antártico, [FROM.GetName] ha dejado oficialmente el acuerdo internacional que regula el uso de la Antártida con fines pacíficos y la investigación científica. A pesar de las advertencias, el [FROM.GetName] ha dejado el tratado mientras tiene una estación de investigación en la Antártida, que ha causado la respuesta mundial de los miembros del Tratado, incluyendo posibles sanciones y retroceso diplomático"
 MD_antarctica_news_4_desc_2: "Después de 2 años de salir del Tratado Antártico, [FROM.GetName] ha dejado oficialmente el acuerdo internacional que regula el uso de la Antártida con fines pacíficos [FROM.GetName] ha desmantelado exitosamente cualquier estación de investigación en la Antártida y evitar cualquier actividad prohibida, tales como la explotación de recursos o la presencia militar,, que ha contribuido a mitigar las posibles consecuencias para el medio ambiente y la cooperación mundial"
 MD_antarctica_news.5.t: "Utilidades abiertas detectadas en [FROM.GetAdjective] Estación Antártica"
 MD_antarctica_news.5.d: "Durante la reciente misión de observación, los observadores del Tratado han detectado el uso de Utilidades Open-Loop en una de las [FROM.GetAdjective] estaciones de investigación antárticas. Se trata de una violación del Tratado Antártico, que prohíbe toda actividad que pueda causar daño ambiental o perturbar el ecosistema de la Antártida. La detección de usos abiertos ha suscitado preocupación entre los miembros del Tratado y puede dar lugar a consecuencias diplomáticas."
 MD_antarctica_news.5.a: "Algunas personas tienen que ir barato"
 MD_antarctica_news.5.b: "Bueno."
 MD_antarctica_news.6.t: "Actividades ilegales de laboratorio detectadas en [FROM.GetAdjective] Estación Antártica"
 MD_antarctica_news.6.d: "Durante la reciente misión de observación, los observadores del Tratado han detectado actividades ilegales de laboratorio en una de las [FROM.GetAdjective] estaciones de investigación antárticas. Este comportamiento es inaceptable y una clara violación del Tratado Antártico. Las Partes Consultivas del Tratado abordarán esta cuestión y adoptarán las medidas apropiadas para garantizar la protección del ecosistema único de la Antártida y la integridad del tratado."
 MD_antarctica_news.6.a: "Esto es inaceptable."
 MD_antarctica_news.6.b: "Tenemos que hacer algo al respecto"
 MD_antarctica_news.7.t: "Investigación de arma nuclear detectada en [FROM.GetAdjective] Estación Antártica"
 MD_antarctica_news.7.d: "Durante la reciente misión de observación, los observadores del Tratado han detectado investigaciones sobre armas nucleares en una de las [FROM.GetAdjective] estaciones de investigación antárticas. Se trata de una grave violación del Tratado Antártico, que prohíbe toda actividad militar o cualquier actividad que pueda causar daños ambientales o perturbar el ecosistema de la Antártida. Utilizar una estación de investigación pacífica para la construcción y ensayo de armas nucleares es un acto indignante que amenaza la seguridad del mundo entero. Las Partes Consultivas del Tratado adoptarán medidas inmediatas y decisivas para abordar esta cuestión y exigirán a los responsables que rindan cuentas de sus actos. La comunidad internacional debe reunirse para condenar este comportamiento y garantizar que la Antártida siga siendo un entorno pacífico y protegido para la investigación y cooperación científicas."
 MD_antarctica_news.7.a: "¡Esto es indignante!"
 MD_antarctica_news.7.b: "Era más importante."
 MD_antarctica_news.8.t: "[FROM.GetName] Ha invadido el Tratado Antártico demasiados tiempos"
 MD_antarctica_news.8.d: "Tras múltiples violaciones del Tratado Antártico, [FROM.GetName] ha llegado a un punto crítico en el que las Partes Consultivas del Tratado han decidido eliminarlas del tratado e imponer graves consecuencias diplomáticas. Las reiteradas violaciones de los principios y reglamentos del tratado han socavado la integridad del acuerdo y amenazado la protección del ecosistema único de la Antártida. Las Partes Consultivas del Tratado adoptarán medidas decisivas para garantizar que [FROM.GetName] sea responsable de sus acciones y que el Tratado Antártico siga siendo un marco sólido y eficaz para la cooperación internacional y la conservación ambiental."
 MD_antarctica_news.8.a: "Lo traen consigo mismos."
 MD_antarctica_news.8.b: "Esto es demasiado."
 MD_antarctica_news.9.t: "Vientos pesados a través de la Antártida"
 MD_antarctica_news.9.d: "Se han registrado fuertes vientos en toda la Antártida, afectando las estaciones de investigación. Las Partes Consultivas del Tratado están vigilando la situación y prestando apoyo para garantizar la seguridad del personal y la integridad de las investigaciones en curso. Las misiones de observación se suspenden temporalmente hasta que las condiciones meteorológicas mejoren."
 MD_antarctica_news.9.a: "No es bueno."
 MD_antarctica_news.10.t: "[FROM.GetName] Comienza la construcción de la estación de investigación antártica"
 MD_antarctica_news.10.d: "[FROM.GetName] ha comenzado la construcción de una nueva estación de investigación antártica, señalando su compromiso con la investigación científica y la conservación ambiental en la región. Se espera que la construcción de la estación lleve varios meses, y las Partes Consultivas del Tratado supervisarán estrechamente los progresos realizados para garantizar que se ajuste a los principios y reglamentos del Tratado Antártico."
 MD_antarctica_news.10.a: "Splendid!"
 MD_antarctica.1.t: "Observador Misión"
 MD_antarctica.1.d: "[FROM.GetName] ha enviado observadores de Tratados para inspeccionar una de nuestras estaciones de investigación antárticas. Se espera que la misión llegue en §Y7 días§!."
 MD_antarctica.1.a: "Esperaremos su llegada."
 MD_antarctica.3.t: "Observador Misión Informe: Utilidades abiertas detectadas"
 MD_antarctica.3.d: "Los observadores del Tratado han completado su inspección de nuestra estación de investigación antártica y han informado de la detección del uso de las utilidades abiertas. Esto constituye una violación del Tratado Antártico y puede dar lugar a consecuencias diplomáticas. Las Partes Consultivas del Tratado pidieron que se adoptaran medidas para sustituir a los servicios públicos por opciones más favorables al medio ambiente."
 MD_antarctica.3.a: "Tenemos que deshacernos de eso"
 MD_antarctica.4.t: "Observador Misión Informe: Actividades de laboratorio ilegales detectadas"
 MD_antarctica.4.d: "Los observadores del Tratado han completado su inspección de nuestra estación de investigación antártica y han informado de la detección de actividades ilegales de laboratorio. Las Partes Consultivas no traerán nuevas consecuencias, si cesan todas las actividades ilegales en nuestra estación."
 MD_antarctica.4.a: "Tenemos que hacer algo al respecto"
 MD_antarctica.5.t: "Observador Misión Informe: Investigación sobre el arma nuclear detectada"
 MD_antarctica.5.d: "Los observadores del Tratado han completado su inspección de nuestra estación de investigación antártica y han informado de la detección de investigaciones sobre armas nucleares. Esto constituye una grave violación del Tratado Antártico y dará lugar a consecuencias diplomáticas inmediatas. Las Partes Consultivas del Tratado adoptarán medidas decisivas para abordar esta cuestión y exigirán a los responsables que rindan cuentas de sus acciones, exigiendo el cese inmediato de todas las actividades de investigación nuclear en nuestro lugar."
 MD_antarctica.5.a: "¡Tenemos que deshacernos de eso inmediatamente!"
 MD_antarctica.6.t: "Violación del Tratado Antártico: demasiadas violaciones"
 MD_antarctica.6.d: "Querido [ROOT.GetLeader],\n\nLamentamos informarle de que su nación, [ROOT.GetName], ha infringido el Tratado Antártico demasiadas veces, con un total de violaciones [?antarctica_station_reports]. En consecuencia, las Partes Consultivas del Tratado han decidido eliminar [ROOT.GetName] del tratado con 2 años e imponer graves consecuencias diplomáticas. Las reiteradas violaciones de los principios y reglamentos del tratado han socavado la integridad del acuerdo y amenazado la protección del ecosistema único de la Antártida. Le instamos a tomar este asunto en serio y eliminar la estación de investigación, antes de que se revoque la membresía.\n\nSinceramente,\nLas Partes Consultivas del Tratado Antártico"
 MD_antarctica.6.a: "Hemos traído esto a nosotros mismos."
 MD_antarctica.7.t: "¿Embargo imposible en [FROM.GetName]?"
 MD_antarctica.7.d: "Debido a la reciente detección de la investigación sobre armas nucleares en una de las estaciones de investigación antárticas [FROM.GetAdjective], las Partes Consultivas del Tratado Antártico están considerando la posibilidad de imponer un embargo a [FROM.GetName]. Esto implicaría restringir el comercio y las relaciones diplomáticas con [FROM.GetName] en respuesta a su violación de los principios y regulaciones del tratado."
 MD_antarctica.7.a: "Tienen que pagar sus acciones"
 MD_antarctica.7.b: "No vale la pena."
 MD_antarctica.9.t: "Módulo de la estación antártica dañado"
 MD_antarctica.9.d: "Un módulo en una de nuestras estaciones de investigación Antártida ha sido dañado por una ventisca. Los ingenieros están preparando reparaciones y comenzarán tan pronto como las condiciones meteorológicas mejoren.\n\nLas reparaciones comienzan cuando termina la blizzard (§Y[?global.antarctica_blizzard_days_remaining|0]§! días de ventisca restante) y tomar §Y14§! días a completar. Usted puede ver el tiempo restante en la vista de la estación y en el módulo dañado herramientatip."
 MD_antarctica.9.a: "¡Maldito tiempo!"
 MD_antarctica.10.t: "Desmantelamiento de la estación de investigación antártica del país anexo"
 MD_antarctica.10.d: "Debido a la anexión del país con una estación de investigación, la estación ha sido desmantelada."
 MD_antarctica.10.a: "Okay"
 ANT_nukes_research_discovered_idea: "Estación Antártica Investigación sobre armas nucleares descubierta"
 ANT_nukes_research_discovered_idea_desc: "Este país violó el principio de una prohibición total de la investigación militar en la Antártida mediante la realización de investigaciones relacionadas con las armas nucleares."
 antarctica_small_treaty_admin_cost_1: "Antártico Small Treaty Administration"
 antarctica_small_treaty_admin_cost_1_desc: "Este país ha firmado un tratado pequeño de la Antártida (CCAS o CCAMLR), con lo que se ha incrementado la sobrecarga administrativa para la acción política."
 antarctica_small_treaty_admin_cost_2: "Ampliación de la administración del Tratado Antártico"
 antarctica_small_treaty_admin_cost_2_desc: "Este país ha firmado tanto tratados pequeños de la Antártida (CCAS y CCAMLR), que requieren una administración más amplia de tratados y recursos para el cumplimiento."
 ANT_kicked_from_treaty_idea: "Tratado Antártico"
 ANT_kicked_from_treaty_idea_desc: "Debido a las reiteradas violaciones del Tratado Antártico, este país ha sido excluido del acuerdo y no puede reunirse durante los próximos dos años."
 ANT_illegal_extraction_idea: "Extracción de recursos ilegales en la Antártida"
 ANT_illegal_extraction_idea_desc: "Nuestras relaciones con otros países son peores porque estamos entre los pocos que no quieren intercambiar valiosos recursos para preservar una buena vista de un desierto helado. Se preocupan demasiado por ese bloque congelado."
 ANT_military_training_idea: "Formación militar ilegal en la Antártida"
 ANT_military_training_idea_desc: "No hay mejor lugar para preparar a nuestros soldados para una ofensiva invernal que la Antártida."
