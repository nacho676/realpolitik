 ANTARCTICA_CCAS_TEXT: "La Convención para la Conservación de los Sellos Antárticos (CCAS) es un acuerdo que regula la caza de sellos en la Antártida. Fue establecido en 1972 para proteger a las poblaciones de focas y asegurar el uso sostenible de sus recursos."
