 ANTARCTICA_STATION_SEND_OBSERVERS_TEXT: "Enviar observadores"
 ANTARCTICA_STATION_SEND_OBSERVERS_TEXT_DELAYED: "§YPrerequisitos:§!\n[!antarctica_station_send_observers_button_click_enabled] §YEstado de Blizzard:§! [MD_antarctica_observer_blizzard_status]\n\n§YEfectos:§!\nDespacho una misión de observación a la estación seleccionada.\nEl país objetivo es notificado inmediatamente.\nLos observadores llegan después de §Y7 días§! e inspeccionan la actividad ilegal de laboratorio o el uso Open Loop Utilities."
