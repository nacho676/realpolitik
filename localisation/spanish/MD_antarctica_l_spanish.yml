 ANTARCTICA_STATION_FIND_OR_CREATE_TEXT_DELAYED: "§YEfectos:§!\nSelecciona su estación Antártica y abre su plano.\n\nSi no controlas una estación, comienza la configuración de la estación en la zona interior.\n- Costo de configuración: §R$15.00b§! (duplicado durante el invierno antártico).\n- Tiempo de configuración: §Y45 días§! (duplicado durante el invierno antártico).\n\nConfiguración actual restante: §Y[?antarctica_station_setup_days_remaining|0]§! días."
