 preah_vihear_news.4.t: "Una victoria decisiva en Preah Vihear"
 preah_vihear_news.4.d_sia: "Tailandia ha marcado una victoria decisiva en el enfrentamiento de larga data en Preah Vihear, que obligó a Camboya a una humillante escalada diplomática. Ningún territorio ha cambiado de manos, pero Bangkok reclama el enfrentamiento como un triunfo nacional."
 preah_vihear_news.4.d_cbd: "Camboya ha marcado una victoria decisiva en el enfrentamiento de larga data en Preah Vihear, que obligó a Tailandia a una humillante escalada diplomática. Ningún territorio ha cambiado de manos, pero Phnom Penh reclama el enfrentamiento como un triunfo nacional."
 preah_vihear_news.4.o1: "Una rivalidad decididamente resuelta, por ahora"
 SIA_preah_vihear_vindicated: "Preah Vihear Vindication"
 SIA_preah_vihear_vindicated_desc: "Tailandia ha asegurado el terreno disputado alrededor del complejo del templo, y el gobierno está disfrutando del dividendo político de una controversia fronteriza de larga duración resuelta en sus propios términos."
 SIA_preah_vihear_humiliation: "Preah Vihear Humiliation"
 SIA_preah_vihear_humiliation_desc: "Camboya controla ahora el terreno disputado alrededor de Preah Vihear, y la pérdida se siente en todo el espectro político como un fracaso tanto de la diplomacia como de las armas."
 CBD_preah_vihear_vindicated: "Preah Vihear Vindication"
 CBD_preah_vihear_vindicated_desc: "Camboya ha asegurado el terreno disputado en torno al complejo del templo, y el Gobierno está disfrutando del dividendo político de una controversia fronteriza de larga data resuelta en sus propios términos."
 CBD_preah_vihear_humiliation: "Preah Vihear Humiliation"
 CBD_preah_vihear_humiliation_desc: "Tailandia controla ahora el terreno disputado alrededor de Preah Vihear, y la pérdida se siente en todo el espectro político como un fracaso tanto de la diplomacia como de las armas."
 preah_vihear_observers: "Observadores fronterizos indonesios"
 preah_vihear_observers_desc: "Los monitores indonesios desarmados están estacionados a lo largo de la frontera de Preah Vihear bajo un acuerdo interrumpido por la ASEAN, velando por las violaciones del alto el fuego y dando a ambos gobiernos alguna cobertura para dejar enfriar la controversia."
 preah_vihear_icj_grounds_TT: "La tensión fronteriza es superior a 74, o Tailandia ya ha alcanzado la frontera."