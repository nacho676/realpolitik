l_spanish:
 preah_vihear_decisions_category: "Disputa Fronteriza de Preah Vihear"
 preah_vihear_dispute: "Disputa por el Templo de Preah Vihear"
 SIA_escalate_preah_vihear_tensions: "Aumentar las Tensiones Fronterizas"
 SIA_escalate_preah_vihear_tensions_desc: "Abrir el enfrentamiento en serio: ordenar reposicionar tropas cerca del escarpe de Dângrêk y dejar que la prensa nacionalista corra con ello. Nom Pen oirá el mensaje alto y claro, y este primer movimiento no tiene vuelta atrás."
 SIA_request_asean_mediation: "Solicitar la Mediación de la ASEAN"
 SIA_request_asean_mediation_desc: "Solicitar a la ASEAN que medie en la disputa fronteriza con Camboya. Este enfoque diplomático podría ayudar a reducir las tensiones y encontrar una solución pacífica."
 SIA_accept_icj_ruling: "Aceptar la Decisión de la CIJ"
 SIA_accept_icj_ruling_desc: "Aceptar el fallo de la Corte Internacional de Justicia sobre la disputa del Templo de Preah Vihear. Esto pondrá fin al conflicto, pero podría considerarse una derrota diplomática."
 SIA_reject_icj_ruling: "Rechazar la Decisión de la CIJ"
 SIA_reject_icj_ruling_desc: "Rechazar el fallo de la CIJ y seguir afirmando nuestras reclamaciones sobre el territorio en disputa. Esto escalará las tensiones internacionales, pero demostrará nuestra determinación."
 CBD_protest_thai_actions: "Protesta Diplomática"
 CBD_protest_thai_actions_desc: "Invocar al embajador tailandés, presentar una protesta formal en la ASEAN y las Naciones Unidas, y dejar que la nación vea que el gobierno está firme. Rallies capital político en casa y pone nuestra queja en el registro, sin pretender calmar una frontera Bangkok no tiene intención de calmarse."
 CBD_request_asean_mediation: "Solicitar la Mediación de la ASEAN"
 CBD_request_asean_mediation_desc: "Solicite a la ASEAN que medie en la disputa fronteriza con Tailandia. Una solución diplomática regional podría ayudar a proteger nuestras reivindicaciones."
 CBD_appeal_to_icj: "Recurso ante la CIJ"
 CBD_appeal_to_icj_desc: "Presentar una demanda ante la Corte Internacional de Justicia para reafirmar la soberanía de Camboya sobre el Templo Preah Vihear y el territorio circundante."
 preah_vihear.100.t: "La UNESCO designa a Preah Vihear como Patrimonio de la Humanidad"
 preah_vihear.100.d: "La Organización de las Naciones Unidas para la Educación, la Ciencia y la Cultura ha declarado oficialmente el Templo de Preah Vihear como Patrimonio de la Humanidad, atribuyéndolo a Camboya. Han estallado protestas nacionalistas en toda Tailandia, donde los manifestantes exigen acciones militares para proteger lo que consideran territorio tailandés. La situación en la frontera se deteriora rápidamente."
 preah_vihear.100.a: "¡Esto es un escándalo! ¡Movilicemos nuestras fuerzas!"
 preah_vihear.100.b: "Debemos respetar la decisión internacional"
 preah_vihear.101.t: "La UNESCO reconoce a Preah Vihear"
 preah_vihear.101.d: "La UNESCO ha declarado oficialmente el antiguo Templo de Preah Vihear como Patrimonio de la Humanidad bajo soberanía camboyana. Esta es una importante victoria diplomática, que reafirma el fallo de la CIJ de 1962. Sin embargo, las protestas nacionalistas en Tailandia podrían provocar un aumento de la tensión en nuestra frontera."
 preah_vihear.101.a: "¡Un gran día para Camboya!"
 preah_vihear.1.t: "Provocaciones tailandesas en la Frontera"
 preah_vihear.1.d: "Tailandia ha intensificado la tensión en nuestra frontera cerca del Templo Preah Vihear. Manifestantes nacionalistas en Bangkok exigen acción militar, y las tropas tailandesas se han reubicado más cerca de la zona en disputa."
 preah_vihear.1.a: "Nosotros debemos permanecer vigilantes"
 preah_vihear.5.t: "¡Las Fuerzas tailandesas Atacan!"
 preah_vihear.5.d: "Las fuerzas militares tailandesas han lanzado una incursión en la disputada región fronteriza cerca del templo de Preah Vihear. Nuestras tropas están combatiendo a los atacantes. La comunidad internacional observa atentamente cómo la situación amenaza con escalar y convertirse en un conflicto a gran escala."
 preah_vihear.5.a: "¡Defendamos nuestro territorio!"
 preah_vihear.6.t: "Contraataque camboyano"
 preah_vihear.6.d: "Las fuerzas camboyanas han lanzado un contraataque contra nuestras posiciones cerca del templo de Preah Vihear. Se oyen disparos de artillería y armas pequeñas a lo largo de la frontera."
 preah_vihear.6.a: "Debemos mantener nuestras posiciones"
 preah_vihear.10.t: "Victoria en el Choque Fronterizo"
 preah_vihear.10.d: "Nuestras fuerzas han asegurado sus objetivos en el enfrentamiento fronterizo cerca de Preah Vihear. El enemigo ha sido repelido y hemos demostrado nuestra capacidad militar en la región."
 preah_vihear.10.a: "Excelentes noticias"
 preah_vihear.11.t: "Derrota en el Choque Fronterizo"
 preah_vihear.11.d: "Nuestras fuerzas fueron repelidas en el enfrentamiento fronterizo cerca de Preah Vihear. El enfrentamiento fracasó y nuestras tropas se retiraron a sus posiciones previas con bajas."
 preah_vihear.11.a: "Un amargo revés"
 preah_vihear.12.t: "El Choque Fronterizo no es concluyente"
 preah_vihear.12.d: "El enfrentamiento fronterizo cerca de Preah Vihear ha terminado en un punto muerto. Ambos bandos se han retirado sin lograr sus objetivos, aunque han adquirido una valiosa experiencia de combate."
 preah_vihear.12.a: "Reagruparse y reevaluar"
 preah_vihear.13.t: "Victoria en el Contraataque"
 preah_vihear.13.d: "Nuestro contraataque ha logrado repeler a las fuerzas enemigas. Hemos demostrado que la agresión contra nuestro territorio se enfrentará con una resistencia decidida."
 preah_vihear.13.a: "Nuestra soberanía está defendida"
 preah_vihear.14.t: "Contraataque Repelido"
 preah_vihear.14.d: "Nuestro contraataque fue repelido por las fuerzas enemigas. A pesar de nuestros mejores esfuerzos, no pudimos desalojarlos de sus posiciones en la zona en disputa."
 preah_vihear.14.a: "Nos recuperaremos"
 preah_vihear.20.t: "Propuesta de Mediación de la ASEAN"
 preah_vihear.20.d: "Tailandia ha solicitado la mediación de la ASEAN en la disputa fronteriza de Preah Vihear. Indonesia, como presidente de la ASEAN, propone enviar observadores a la región fronteriza y facilitar las negociaciones entre ambas partes."
 preah_vihear.20.a: "Aceptar la mediación"
 preah_vihear.20.b: "Rechazar la mediación"
 preah_vihear.21.t: "Propuesta de Mediación de la ASEAN"
 preah_vihear.21.d: "Camboya ha solicitado la mediación de la ASEAN en la disputa fronteriza de Preah Vihear. Indonesia, como país que preside la ASEAN, propone enviar observadores a la región fronteriza y facilitar las negociaciones entre ambas partes."
 preah_vihear.21.a: "Aceptar la mediación"
 preah_vihear.21.b: "Rechazar la mediación"
 preah_vihear.22.t: "Se acepta la Mediación de la ASEAN"
 preah_vihear.22.d: "Tanto Tailandia como Camboya han aceptado la mediación de la ASEAN. Se desplegarán observadores indonesios en la región fronteriza y se iniciarán negociaciones diplomáticas para encontrar una solución pacífica a la disputa."
 preah_vihear.22.a: "Un camino hacia la paz"
 preah_vihear.23.t: "Rechazada la Mediación de la ASEAN"
 preah_vihear.23.d: "La otra parte ha rechazado la mediación de la ASEAN en la disputa de Preah Vihear. Los esfuerzos diplomáticos han fracasado y la tensión en la frontera sigue siendo alta."
 preah_vihear.23.a: "Debemos prepararnos para una confrontación continua"
 preah_vihear.30.t: "Camboya apela ante la CIJ"
 preah_vihear.30.d: "Camboya ha presentado una demanda ante la Corte Internacional de Justicia en relación con la disputa del Templo de Preah Vihear. El tribunal considerará la solicitud de Camboya de medidas provisionales y finalmente se pronunciará sobre la cuestión de soberanía."
 preah_vihear.30.a: "Esperamos la decisión del tribunal."
 preah_vihear.31.t: "La CIJ falla a nuestro favor"
 preah_vihear.31.d: "La Corte Internacional de Justicia reafirmó la soberanía de Camboya sobre el Templo Preah Vihear y ordenó a ambas partes retirar al personal militar de una zona desmilitarizada provisional alrededor del templo."
 preah_vihear.31.a: "derecho internacional está de nuestro lado"
 preah_vihear.32.t: "La CIJ Gobierna Contra Nosotros"
 preah_vihear.32.d: "La Corte Internacional de Justicia ha fallado a favor de las reivindicaciones de soberanía de Camboya sobre el Templo de Preah Vihear. El tribunal ha ordenado el establecimiento de una zona desmilitarizada alrededor de la zona en disputa."
 preah_vihear.32.a: "Esta es una sentencia injusta"
 preah_vihear.35.t: "Tailandia Acepta el Fallo de la CIJ"
 preah_vihear.35.d: "Tailandia ha aceptado el fallo de la CIJ sobre la disputa del Templo de Preah Vihear. Las fuerzas tailandesas se retirarán de la zona desmilitarizada, poniendo fin a la crisis fronteriza."
 preah_vihear.35.a: "Paz al fin"
 preah_vihear.36.t: "Tailandia Rechaza el Fallo de la CIJ"
 preah_vihear.36.d: "Tailandia ha rechazado el fallo de la CIJ sobre la disputa del Templo de Preah Vihear, calificándolo de injusto y negándose a reconocer la jurisdicción del tribunal. Se prevé que aumenten las tensiones en la frontera."
 preah_vihear.36.a: "Debemos prepararnos para un conflicto continuo"
 preah_vihear_news.1.t: "Disputa de Preah Vihear Resuelta"
 preah_vihear_news.1.d: "La prolongada disputa fronteriza entre Tailandia y Camboya por el Templo de Preah Vihear se ha resuelto. Tailandia ha aceptado el fallo de la Corte Internacional de Justicia que confirma la soberanía de Camboya sobre el complejo del templo. Ambas naciones han acordado retirar sus fuerzas militares de la zona y normalizar sus relaciones diplomáticas."
 preah_vihear_news.1.o1: "Se restableció la estabilidad regional"
 preah_vihear_news.2.t: "La ASEAN Media en la Disputa Fronteriza"
 preah_vihear_news.2.d: "Gracias a la mediación de la ASEAN, Tailandia y Camboya acordaron reducir la tensión en la disputa fronteriza sobre el Templo de Preah Vihear. Observadores indonesios supervisarán el alto el fuego mientras ambas naciones buscan una solución diplomática."
 preah_vihear_news.2.o1: "Diplomacia prevalece"
 preah_vihear_news.3.t: "Estallan Enfrentamientos Fronterizos entre Tailandia y Camboya"
 preah_vihear_news.3.d: "Han estallado enfrentamientos armados a lo largo de la frontera entre Tailandia y Camboya, cerca del disputado Templo de Preah Vihear. Las fuerzas tailandesas han lanzado operaciones militares en la zona, y las tropas camboyanas están respondiendo. Se han reportado disparos de artillería e intercambios de armas pequeñas. El antiguo complejo de templos, declarado Patrimonio de la Humanidad por la UNESCO, se encuentra en medio del fuego cruzado mientras ambas naciones intensifican su disputa territorial."
 preah_vihear_news.3.o1: "Una escalada peligrosa"
 preah_vihear_decisions_category_desc: "El Templo de Preah Vihear, un santuario Khmer del siglo XI encaramado en el escarpamiento de Dângrêk, se encuentra en una frontera que el mapa de la era colonial francesa y el fallo de la CIJ de 1962 se establecieron a favor de Camboya, pero que Tailandia nunca ha aceptado completamente. La lista del Patrimonio Mundial de la UNESCO 2008 reabrió la herida, y la ladera alrededor del templo sigue siendo tierra disputada incluso donde el santuario en sí no está. La escalación abre la puerta a una lucha por el escarpamiento. Cada choque gasta recursos que ambos lados preferirían conservar \n\n§Y Tensión de orden:§! [?GLOBAL.preah_vihear_tension]\n§YNuestra disposición:§! [?THIS.preah_vihear_readiness]\n§YNuestro progreso en el conflicto:§! [?THIS.preah_vihear_war_progress]"
 preah_vihear_deescalation_goodwill: "De escalación Buena voluntad"
 SIA_pv_prepare_infantry_training: "Realizar ejercicios de campo de infantería"
 SIA_pv_prepare_infantry_training_desc: "Rotar unidades de infantería de primera línea por ejercicios con fuego real en el terreno en torno al escarpe de Dângrêk, con armas ligeras y de apoyo almacenadas, para afinar su preparación ante una confrontación fronteriza con Camboya."
 SIA_pv_prepare_armor_training: "Realizar ejercicios de campo de blindados"
 SIA_pv_prepare_armor_training_desc: "Mover unidades blindadas a las colinas cerca de Preah Vihear para ejercicios de maniobra, y probar cómo rinden los tanques anfibios y medianos en un terreno mal adecuado para ambos."
 SIA_pv_prepare_artillery_training: "Realizar ejercicios de campo de artillería"
 SIA_pv_prepare_artillery_training_desc: "Desplegar baterías de artillería frente al escarpe que domina el templo, ensayando el tipo de intercambio que ya ha estallado más de una vez a lo largo de esta frontera."
 SIA_pv_nationalist_rhetoric: "Movilizar la opinión nacionalista en casa"
 SIA_pv_nationalist_rhetoric_desc: "Alentar a ministros, portavoces del ejército y la prensa estatal a movilizar la opinión nacionalista en casa por la disputa fronteriza con Camboya. Funciona bien ante el público interno, pero cada ronda sube la temperatura en la frontera."
 SIA_pv_military_posturing: "Reposicionar fuerzas en la frontera"
 SIA_pv_military_posturing_desc: "Mover unidades adicionales hasta la frontera cerca de Preah Vihear como muestra de determinación. Camboya lo leerá exactamente como lo que es."
 SIA_pv_attack_preah_vihear: "Incursión en la frontera"
 SIA_pv_attack_preah_vihear_desc: "Enviar unidades del ejército a través de la frontera para tomar terreno alrededor del complejo del templo. El éxito pone el terreno disputado bajo nuestros cañones. El fracaso nos costará caro en apoyo interno y externo."
 SIA_pv_extort_xp: "Sacar lecciones de la frontera"
 SIA_pv_extort_xp_desc: "Interrogar a oficiales que han visto acción en la frontera e incorporar la experiencia a la doctrina permanente del ejército, siempre que los combates allí hayan dejado suficiente que aprender."
 SIA_pv_decisive_victory: "Proclamar una victoria decisiva"
 SIA_pv_decisive_victory_desc: "Con el equilibrio de los combates decididamente a nuestro favor, presiona la ventaja: fuerza Camboya en una humillante escalada y reclamar el enfrentamiento como un triunfo nacional, sin pedir a nuestras tropas que mantengan un solo nuevo metro de tierra."
 SIA_pv_capture_northern_khmer: "Captura del norte de Khmer"
 SIA_pv_capture_northern_khmer_desc: "La lucha ha sido tan abrumadoramente nuestra manera de que el escarpamiento disputado está abierto ante nosotros. En lugar de conformarse con el prestigio, tomar el terreno para siempre: anexar la provincia del norte de Khmer, plantar la bandera sobre el templo y cerrar la cuestión fronteriza permanentemente en nuestros términos. Camboya nunca lo perdonará, y el mundo lo llamará una conquista."
 SIA_pv_de_escalate: "Oferta a De-escalate"
 SIA_pv_de_escalate_desc: "Señalar contención mediante contactos discretos con Nom Pen: retirar unidades de posiciones avanzadas y rebajar la retórica. No nos cuesta más que capital político y compra buena voluntad que quizá necesitemos después."
 CBD_pv_prepare_infantry_training: "Realizar ejercicios de campo de infantería"
 CBD_pv_prepare_infantry_training_desc: "Rotar unidades de infantería de primera línea por ejercicios con fuego real en torno al complejo de Preah Vihear, con armas ligeras y de apoyo almacenadas, para afinar su preparación ante una confrontación fronteriza con Tailandia."
 CBD_pv_prepare_armor_training: "Realizar ejercicios de campo de blindados"
 CBD_pv_prepare_armor_training_desc: "Mover unidades blindadas a posiciones cercanas al templo en disputa para ejercicios de maniobra, y probar cómo rinden los tanques anfibios y medianos en un terreno mal adecuado para ambos."
 CBD_pv_prepare_artillery_training: "Realizar ejercicios de campo de artillería"
 CBD_pv_prepare_artillery_training_desc: "Desplegar baterías de artillería frente a las posiciones tailandesas en el escarpe, ensayando el tipo de intercambio que ya ha estallado más de una vez a lo largo de esta frontera."
 CBD_pv_nationalist_rhetoric: "Movilizar la opinión nacionalista en casa"
 CBD_pv_nationalist_rhetoric_desc: "Alentar a ministros, portavoces del ejército y la prensa estatal a movilizar la opinión nacionalista en casa por la disputa fronteriza con Tailandia. Funciona bien ante el público interno, pero cada ronda sube la temperatura en la frontera."
 CBD_pv_military_posturing: "Reposicionar fuerzas en la frontera"
 CBD_pv_military_posturing_desc: "Mover unidades adicionales hasta la frontera cerca de Preah Vihear como muestra de determinación. Tailandia lo leerá exactamente como lo que es."
 CBD_pv_attack_preah_vihear: "Incursión en la frontera"
 CBD_pv_attack_preah_vihear_desc: "Enviar unidades del ejército a través de la frontera para tomar terreno alrededor del complejo del templo. El éxito pone el terreno disputado bajo nuestros cañones. El fracaso nos costará caro en apoyo interno y externo."
 CBD_pv_extort_xp: "Sacar lecciones de la frontera"
 CBD_pv_extort_xp_desc: "Interrogar a oficiales que han visto acción en la frontera e incorporar la experiencia a la doctrina permanente del ejército, siempre que los combates allí hayan dejado suficiente que aprender."
 CBD_pv_decisive_victory: "Proclamar una victoria decisiva"
 CBD_pv_decisive_victory_desc: "Con el equilibrio de los combates decididamente a nuestro favor, presiona la ventaja: fuerza a Tailandia en una humillante escalada y reclamar el enfrentamiento como un triunfo nacional, sin pedir a nuestras tropas que mantengan un solo nuevo metro de tierra."
 CBD_pv_de_escalate: "Oferta a De-escalate"
 CBD_pv_de_escalate_desc: "Señalar contención mediante contactos discretos con Bangkok: retirar unidades de posiciones avanzadas y rebajar la retórica. No nos cuesta más que capital político y compra buena voluntad que quizá necesitemos después."
 preah_vihear_increase_readiness_TT: "§GEsto aumentará nuestra disposición fronteriza§!"
 preah_vihear_increase_tension_TT: "§YEsto aumentará la tensión fronteriza§!"
 preah_vihear_tension_TT: "La tensión fronteriza es superior a 40"
 preah_vihear_readiness_TT: "Nuestra disposición fronteriza es superior a 50"
 preah_vihear_progress_25_TT: "Más de 25 progresos en los conflictos"
 preah_vihear_decrease_progress_25_TT: "§REsto reducirá nuestro progreso de conflicto en 25§!"
 preah_vihear_progress_50_TT: "Más de 50 progresos en los conflictos"
 preah_vihear_decrease_progress_50_TT: "§REsto reducirá el progreso de nuestro conflicto en 50§!"
 preah_vihear_deescalation_uses_remaining_TT: "Todavía tenemos ofertas de descalificación"
 preah_vihear_decrease_tension_10_TT: "§GEsto reducirá la tensión fronteriza en 10§!"
 preah_vihear_deescalation_used_TT: "§RUtiliza una de nuestras ofertas limitadas de escalación§!"
 preah_vihear_no_clash_TT: "No hay enfrentamientos fronterizos en curso"
 preah_vihear_not_settled_TT: "La frontera no se ha establecido en los últimos cinco años"
 preah_vihear_no_recent_escalation_TT: "Hace poco no hemos hecho un movimiento provocador en la frontera"
 preah_vihear_no_recent_protest_TT: "No hemos agitado el sentimiento nacionalista recientemente"
 preah_vihear_progress_80_TT: "Más de 80 progresos en los conflictos"
 preah_vihear_decrease_progress_80_TT: "§REsto reducirá el progreso de nuestro conflicto en 80§!"
 preah_vihear_protest_grievance_TT: "La tensión fronteriza es superior a 10, o Tailandia ya ha alcanzado la frontera."
 preah_vihear_mediation_tension_TT: "La tensión fronteriza es superior a 20"
 preah_vihear_tension_resolved_TT: "§GEsto restablecerá la tensión fronteriza a cero§!"
 preah_vihear.40.t: "Accidente de entrenamiento en la frontera"
 preah_vihear.40.d: "Un ejercicio de fuego vivo cerca de la frontera ha ido mal. El equipo ha sido dañado y varios soldados no son aptos para el deber, y el revés ha dentado la confianza en el programa de preparación."
 preah_vihear.40.a: "Aprende del error"
 preah_vihear.41.t: "Provocation Backfires"
 preah_vihear.41.d: "La última ronda de la retórica y los movimientos de tropas ha atraído el escrutinio no deseado en casa. Las cifras de oposición y la prensa preguntan si el gobierno está fabricando una crisis que no puede controlar, y se ha visto obligado a retroceder la temperatura."
 preah_vihear.41.a: "Nota la lección"
 preah_vihear.110.t: "El comunicado de Noppadon"
 preah_vihear.110.d: "El Ministro de Relaciones Exteriores Noppadon Pattama firmó un comunicado conjunto en el que respaldaba la propuesta de inclusión de la UNESCO para Preah Vihear, documento que desde entonces ha desencadenado una tormenta de fuego en casa. El Tribunal Constitucional está sopesando si el acuerdo se hizo sin la debida aprobación parlamentaria, y los críticos nacionalistas están exigiendo al jefe del ministro."
 preah_vihear.110.a: "Prórroga del comunicado"
 preah_vihear.110.b: "Repudiarla y dejar ir al ministro"
 preah_vihear.111.t: "Thaksin en Phnom Penh"
 preah_vihear.111.d: "El primer ministro Hun Sen ha designado al fugitivo Thaksin Shinawatra como su asesor económico personal, un insulto calculado al gobierno en Bangkok. Camboya se ha negado a considerar la extradición, y el nombramiento se ha convertido en un punto de concentración en ambos lados de la frontera."
 preah_vihear.111.a: "Recordemos a nuestro embajador"
 preah_vihear.111.b: "Lodge una protesta formal sólo"
 preah_vihear.112.t: "Camisas amarillas en la frontera"
 preah_vihear.112.d: "La Alianza Popular para la Democracia se ha apoderado de la disputa fronteriza como nueva evidencia de un gobierno demasiado cercano a Phnom Penh y demasiado suave con la soberanía nacional. Rallies fuera de la Casa del Gobierno no muestran ninguna señal de adelgazamiento."
 preah_vihear.112.a: "El tiempo las protestas"
 preah_vihear.120.t: "El Contencioso-Administrativo Contrata al Consejo de Seguridad de las Naciones Unidas"
 preah_vihear.120.d: "La crisis fronteriza ha aumentado hasta el punto de que ahora está en la agenda del Consejo de Seguridad. Los Estados Miembros han pedido moderación de ambas partes, aunque no se espera que se adopten medidas vinculantes."
 preah_vihear.120.a: "Nota del procedimiento"
 preah_vihear.121.t: "Indonesia ofrece observadores"
 preah_vihear.121.d: "Como presidente de la ASEAN, Indonesia ha ofrecido desplegar observadores desarmados para vigilar la frontera e informar sobre las violaciones de la cesación del fuego. Yakarta lo enmarca como un paso de fomento de la confianza en lugar de una solución mediada."
 preah_vihear.121.a: "Aceptar a los observadores"
 preah_vihear.121.b: "Decline la oferta"
 preah_vihear.130.t: "Un defeato decisivo"
 preah_vihear.130.d: "El otro lado ha marcado una victoria decisiva en el enfrentamiento de Preah Vihear, y ahora está trabajando cada canal diplomático y propagandístico para hacer que la humillación se pegue. Ningún terreno ha cambiado de manos, pero nuestra posición en la frontera parece más débil que en años."
 preah_vihear.130.a: "Aceptar el revés por ahora"
 preah_vihear.130.b: "Prepararse para una guerra a gran escala"
 preah_vihear.131.t: "El Escarpmento está perdido"
 preah_vihear.131.d: "Las fuerzas tailandesas han sobrepasado el terreno en disputa y Bangkok ha anexado oficialmente la provincia de Khmer septentrional, templo y todos. El fallo de 1962 que se suponía era nuestro no significa nada contra las tropas en las alturas. La nación está en shock, y exige una respuesta que tal vez no podamos dar."
 preah_vihear.131.a: "Un día oscuro para la nación"
 preah_vihear.131.b: "Lo recuperaremos."
