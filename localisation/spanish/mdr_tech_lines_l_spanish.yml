l_spanish:
 mdr_ammo_tech_1: "Cadenas de montaje de munición"
 mdr_ammo_tech_1_desc: "Cada puesto hace una sola tarea, y la fábrica rinde mucho más."
 mdr_ammo_tech_2: "Detonadores fiables"
 mdr_ammo_tech_2_desc: "Menos proyectiles fallados, y menos munición gastada para lograr lo mismo."
 mdr_ammo_tech_3: "Líneas de cartuchos automáticas"
 mdr_ammo_tech_3_desc: "Máquinas que arman cartuchos sin parar, con menos manos y menos errores."
 mdr_ammo_tech_4: "Pólvoras de doble base"
 mdr_ammo_tech_4_desc: "Pólvoras más estables, que duran más tiempo guardadas."
 mdr_ammo_tech_5: "Prensas de alta velocidad"
 mdr_ammo_tech_5_desc: "Prensas que forman vainas en una fracción del tiempo."
 mdr_ammo_tech_6: "Explosivos insensibles"
 mdr_ammo_tech_6_desc: "Cargas que resisten golpes y calor, y se pueden apilar con más seguridad."
 mdr_ammo_tech_7: "Fábricas modulares de munición"
 mdr_ammo_tech_7_desc: "Líneas que cambian de calibre en horas, no en semanas."
 mdr_ammo_tech_8: "Vainas de polímero"
 mdr_ammo_tech_8_desc: "Vainas livianas y baratas que ahorran metal."
 mdr_ammo_tech_9: "Impresión de cargas"
 mdr_ammo_tech_9_desc: "Cargas impresas capa por capa, a medida de cada arma."
 mdr_ammo_tech_10: "Depósitos automatizados"
 mdr_ammo_tech_10_desc: "Almacenes subterráneos que funcionan casi sin personal."
 mdr_ammo_tech_11: "Fabricación sin operarios"
 mdr_ammo_tech_11_desc: "Plantas que trabajan las 24 horas, sin personal en la línea."
 mdr_ammo_tech_12: "Nanoenergéticos"
 mdr_ammo_tech_12_desc: "Materiales que liberan su energía de forma exacta y estable."
 mdr_clean_tech_1: "Filtros de partículas"
 mdr_clean_tech_1_desc: "Filtros en chimeneas que retienen el hollín antes de que salga."
 mdr_clean_tech_2: "Lavadores de gases"
 mdr_clean_tech_2_desc: "Torres que quitan el azufre del humo de las fábricas."
 mdr_clean_tech_3: "Tratamiento de efluentes"
 mdr_clean_tech_3_desc: "Plantas que limpian el agua antes de devolverla a los ríos."
 mdr_clean_tech_4: "Producción más limpia"
 mdr_clean_tech_4_desc: "Rediseñar los procesos para emitir menos desde el principio."
 mdr_clean_tech_5: "Economía circular"
 mdr_clean_tech_5_desc: "Los residuos de una fábrica son la materia prima de otra."
 mdr_clean_tech_6: "Captura de carbono"
 mdr_clean_tech_6_desc: "Atrapar el CO2 de las chimeneas y guardarlo bajo tierra."
 mdr_clean_tech_7: "Química verde"
 mdr_clean_tech_7_desc: "Reacciones que usan menos sustancias tóxicas."
 mdr_clean_tech_8: "Acero y cemento sin carbono"
 mdr_clean_tech_8_desc: "Hidrógeno y nuevos hornos para las industrias que más emiten."
 mdr_clean_tech_9: "Captura directa del aire"
 mdr_clean_tech_9_desc: "Plantas que retiran del aire el CO2 ya emitido."
 mdr_clean_tech_10: "Industria de emisión cero"
 mdr_clean_tech_10_desc: "Fábricas que no dejan nada en el aire ni en el agua."
 mdr_adapt_tech_1: "Mapas de riesgo"
 mdr_adapt_tech_1_desc: "Saber qué zonas se inundan o se queman permite prevenir."
 mdr_adapt_tech_2: "Códigos de construcción climáticos"
 mdr_adapt_tech_2_desc: "Edificios pensados para resistir tormentas y olas de calor."
 mdr_adapt_tech_3: "Alerta temprana por satélite"
 mdr_adapt_tech_3_desc: "Días de aviso para evacuar y proteger lo que importa."
 mdr_adapt_tech_4: "Defensas costeras y fluviales"
 mdr_adapt_tech_4_desc: "Diques y barreras que crecen junto con el nivel del agua."
 mdr_adapt_tech_5: "Ciudades esponja"
 mdr_adapt_tech_5_desc: "Suelos y parques que absorben la lluvia en vez de inundarse."
 mdr_adapt_tech_6: "Infraestructura resiliente"
 mdr_adapt_tech_6_desc: "Redes y caminos que siguen funcionando durante el desastre."
 mdr_adapt_tech_7: "Modelado climático de precisión"
 mdr_adapt_tech_7_desc: "Predecir cada evento extremo con tiempo para actuar."
