l_spanish:
 mdr_alert_ammo: "§RMunición escasa§!"
 mdr_alert_ammo_Desc: "Al ritmo actual de combate, la munición alcanza para §Y[?mdr_ammo_days_left|0]§! días. Sin munición el ejército pierde ataque y defensa.\n\nSubí la producción (más fábricas militares) o comprá en el exterior (decisiones, §YCompra de munición§!)."
 mdr_alert_food: "§RFalta comida§!"
 mdr_alert_food_Desc: "No producimos ni podemos importar toda la comida que necesitamos. Si la reserva se acaba, hay hambre: baja la estabilidad y crece menos la población.\n\nConstruí §YTierras de cultivo§! o liberá el comercio para importar más."
 mdr_alert_unrest: "§RDescontento contenido§!"
 mdr_alert_unrest_Desc: "Prohibir protestas y sindicatos calma las calles, pero el enojo se acumula: el descontento oculto está en §Y[?mdr_unrest_hidden|0]§! de 100. Por encima de 60 puede estallar una crisis social.\n\nLiberar el derecho de reunión deja salir la presión."
 mdr_alert_strait: "§RComercio marítimo cortado§!"
 mdr_alert_strait_Desc: "Hay un estrecho cerrado. Las rutas de comercio que pasaban por ahí buscan otra salida, y si no hay, ese comercio se pierde. El precio del petróleo sube en todo el mundo."
 mdr_alert_uranium: "§RFalta uranio§!"
 mdr_alert_uranium_Desc: "Nuestras centrales nucleares necesitan más uranio del que producimos o importamos, y generan menos electricidad.\n\nConstruí §YMinas de uranio§! en un yacimiento o comprá uranio en el mercado mundial."
 mdr_alert_rare_earths: "§YFaltan tierras raras§!"
 mdr_alert_rare_earths_Desc: "Las fábricas de chips usan más tierras raras de las que tenemos y producen menos.\n\nConstruí §YComplejos de tierras raras§! en un yacimiento o importalas."
 mdr_province_workers_k: "Trabajadores de edificios provinciales (miles)"
