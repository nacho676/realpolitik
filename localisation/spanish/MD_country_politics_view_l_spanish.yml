 IP_TITLE: "Poderes Ideológicos"
 IP_communist_category_desc: "[IP_communist_powers]"
 IP_socialist_category_desc: "[IP_socialist_powers]"
 IP_conservative_category_desc: "[IP_conservative_powers]"
 IP_liberal_category_desc: "[IP_liberal_powers]"
 IP_autocrat_category_desc: "[IP_autocrat_powers]"
 IP_monarchist_category_desc: "[IP_monarchist_powers]"
 IP_fundamentalist_symbol_desc: "[IP_fundamentalist_powers]"
 IP_communist_category_desc_delayed: "§LLos comunistas suelen seguir alguna forma de marxismo-leninismo o una ideología similar. Como defensores de la economía estatal, tienen un tiempo más fácil industrializándose a través de la nacionalización de las industrias extranjeras y sus planes de 5 años. También pueden aumentar su propio Outlook más eficazmente con sus espías.§!"
 IP_socialist_category_desc_delayed: "§LLos socialistas combinan elementos del capitalismo de mercado y estado con el progreso. Muy a menudo el objetivo es invertir todos los esfuerzos gubernamentales en el propio país. Los socialistas tienen un tiempo fácil para mejorar la situación interna de su país mediante políticas sociales e intervención gubernamental en la economía.§!"
 IP_conservative_category_desc_delayed: "§LLos conservadores generalmente quieren que el país permanezca como es, o incluso retrocedan algunas leyes más progresistas. El conservatismo a menudo viene con indicios de nacionalismo y creencias religiosas profundas también. Por esta razón, los países conservadores tienen un tiempo más fácil con su estabilidad política y nacional, ya que el cambio radical es raro.§!"
 IP_liberal_category_desc_delayed: "§LLos liberales tienden a promover ideas de libertad, aunque algunos partidos adoptan un enfoque más progresivo (social liberal) en materias. En el núcleo de la mayoría de los partidos liberales está la idea de un mercado libre con una intervención gubernamental muy limitada.§!"
 IP_autocrat_category_desc_delayed: "§LLos autócratas confían en el poder de los hombres fuertes (y en raras ocasiones mujeres fuertes) para dirigir el país. Los demagogos no tienen miedo de usar métodos cuestionables y acuerdos de backroom para conseguir lo que quieren. Los autócratas tendrán un tiempo más fácil tolerando la alta corrupción y manteniendo el control de la nación con un puño de hierro.§!"
 IP_monarchist_category_desc_delayed: "§L Los monárquicos confían en el linaje y la gloria para gobernar sobre los países. Enfoque El poder en una familia tiene sus beneficios. Esta familia trae el poder y los monarcas son buenos para inspirar a su gente.§!"
 IP_fundamentalist_symbol_desc_delayed: "§LLos fundamentalistas son conservadores de línea dura siguiendo una forma radical o ultraconservadora del Islam. Su objetivo principal es difundir esas opiniones conservadoras a otros países también.§!"
