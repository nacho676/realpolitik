 increase_election_threshold: "§YAumento de las elecciones§!"
 increase_election_threshold_TT: "El Umbral Electoral (o Umbral Electoral) es el porcentaje mínimo que un partido político debe lograr antes de ser considerado un partido válido para la representación legislativa.\n\n§YPrerequisitos§!:\n[!increase_election_threshold_click_enabled]\n§YEfectos:§!\n[!increase_election_threshold_click]\n\nEl cambio se aplicará en las próximas elecciones, haciendo más difícil para los partidos pequeños conseguir el poder."
 decrease_election_threshold: "§YDisminuir el poder electoral§!"
 decrease_election_threshold_TT: "El Umbral Electoral (o Umbral Electoral) es el porcentaje mínimo que un partido político debe lograr antes de ser considerado un partido válido para la representación legislativa.\n\n§YPrerequisitos§!:\n[!decrease_election_threshold_click_enabled]\n§YEfectos:§!\n[!decrease_election_threshold_click]\n\nEl cambio se aplicará en las próximas elecciones, facilitando que los partidos pequeños obtengan el poder."
