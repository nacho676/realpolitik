 PROPAGANDA_PROWESTERN: "§YPro-Western§!"
 PROPAGANDA_EMERGING: "§YEmergente§!"
 PROPAGANDA_NONALIGNED: "§YNon-Aligned§!"
 PROPAGANDA_NATIONALIST: "§YNacionalista§!"
 PROPAGANDA_FASCISM: "§YSalafi§!"
 prowestern_propaganda_button_tt: "§YPro-Western§! campaña de propaganda \nUtilizando la guerra de información, podemos influir en la opinión pública sobre la situación mundial. Sin embargo, cualquier campaña de este tipo sólo será eficaz durante un período limitado, ya que la gente pierde poco a poco interés.\n\n§Y Costo de la Campaña Propaganda§! Modificador: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YPro-Western Propaganda Campaign Cost§! Modificador: [?ROOT.modifier@western_outlook_campaign_cost_modifier|-2%] \n\n§YPrerequisito:§! \n[!prowestern_propaganda_button_click_enabled] \n§YModificadores mientras están activos:§! \n[!prowestern_propaganda_button_click]"
 emerging_propaganda_button_tt: "§YEmergente campaña propagandística§! \nUtilizando la guerra de información, podemos influir en la opinión pública sobre la situación mundial. Sin embargo, cualquier campaña de este tipo sólo será eficaz durante un período limitado, ya que la gente pierde interés después de un tiempo.\n\n§Y Costo de la Campaña Propaganda§! Modificador: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YEmerging Outlook Propaganda Campaign Cost§! Modificador: [?ROOT.modifier@emerging_outlook_campaign_cost_modifier|-2%] \n\n§YPrerequisito:§! \n[!emerging_propaganda_button_click_enabled] \n§YModificadores mientras están activos:§! \n[!emerging_propaganda_button_click]"
 nonaligned_propaganda_button_tt: "§YNo-Alineados§! Campaña Propaganda \nUtilizando la guerra de información, podemos influir en la opinión pública sobre la situación mundial. Sin embargo, cualquier campaña de este tipo sólo será eficaz durante un período limitado, ya que la gente pierde poco a poco interés.\n\n§Y Costo de la Campaña Propaganda§! Modificador: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§Y Costo de la Campaña Propaganda de los Países No Alineados§! Modificador: [?ROOT.modifier@nonaligned_outlook_campaign_cost_modifier|-2%] \n\n§YPrerequisito:§! \n[!nonaligned_propaganda_button_click_enabled] \n§YModificadores mientras están activos:§! \n[!nonaligned_propaganda_button_click]"
 nationalist_propaganda_button_tt: "§YLa campaña de propaganda nacionalista§! \nUtilizando la guerra de información, podemos influir en la opinión pública sobre la situación mundial para verla desde una perspectiva nacionalista. Sin embargo, cualquier campaña de este tipo sólo será eficaz durante un período limitado, ya que la gente pierde poco a poco interés.\n\n§Y Costo de la Campaña Propaganda§! Modificador: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§Y Costo de la Campaña Nacionalista Propaganda§! Modificador: [?ROOT.modifier@nationalist_outlook_campaign_cost_modifier|-2%] \n\n§YPrerequisito:§! \n[!nationalist_propaganda_button_click_enabled] \n§YModificadores mientras están activos:§! \n[!nationalist_propaganda_button_click]"
 fascism_propaganda_button_tt: "§YFascismo§! campaña propagandística \nUtilizando la guerra de información, promoviendo clérigos ultraconservadores y similares, podemos influir y radicalizar la opinión pública sobre la situación mundial a favor del salafismo. Sin embargo, cualquier campaña de este tipo sólo será eficaz durante un período limitado, ya que la gente pierde poco a poco interés.\n\n§Y Costo de la Campaña Propaganda§! Modificador: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§Y Costo de la Campaña de Indoctrination de Salafi§! Modificador: [?ROOT.modifier@salafist_outlook_campaign_cost_modifier|-2%] \n\n§YPrerequisito:§! \n[!fascism_propaganda_button_click_enabled] \n§YModificadores mientras están activos:§! \n[!fascism_propaganda_button_click]"
