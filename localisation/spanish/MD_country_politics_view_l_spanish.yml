 ALLOW_ALL_PARTIES_TT_DELAYED: "Es hora de levantar nuestra prohibición total a otras partes.\n\n§YPrerequisito:§!\n[!allow_all_parties_button_click_enabled]\n§YEfectos:§!\n[!allow_all_parties_button_click]"
 BAN_ALL_PARTIES_TT: "§HDeclarar un Estado Parte§!"
 BAN_ALL_PARTIES_TT_DELAYED: "Como único partido gobernante que dirige el gobierno, podemos hacer leyes para declarar ilegal a todos los demás partidos políticos.\n\n¡Viva la fiesta!\n\n§YPrerequisito:§!\n[!ban_all_parties_button_click_enabled]\n§YEfectos:§!\n[!ban_all_parties_button_click]"
