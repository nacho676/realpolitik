 revolt_party_TT: "§HIniciar la revolución como [party_name_by_index] (§Y [?party_pop_array^v|%1]§!)§!\n\n§YPrerequisito:§!\n[!revolt_button_click_enabled]\n§YEfectos:§!\n[!revolt_button_click]"
 boost_party_TT: "§HBoost [party_name_by_index] (§Y [?party_pop_array^v|%1]§!)§!\nEn un intento por diluir el poder de nuestros verdaderos oponentes políticos, podemos utilizar nuestra máquina política para impulsar las popularidades de otros partidos\n\n§YPrerequisito:§!\n[!boost_button_click_enabled]\n§YEfectos:§!\n[!boost_button_click]"
 attack_party_TT: "§HAttack [party_name_by_index] (§Y [?party_pop_array^v|%1]§!)§!\nPodemos utilizar campañas de desinformación y suciedad que hemos recogido en los principales partidos fuera del gobierno para golpear duramente su popularidad - asegurando que no estén en condiciones de desafiar nuestra posición de poder. Puesto que cualquier atención en absoluto traerá popularidad a los partidos menores, esto sólo funcionará con los principales partidos sobre el umbral de las elecciones [?election_threshold|%0]\n\n§YPrerequisito:§!\n[!attack_button_click_enabled]\n§YEfectos:§!\n[!attack_button_click]"
 ban_party_TT: "§HBan [party_name_by_index] (§Y [?party_pop_array^v|%1]§!)§!\nAl prohibir un partido político o movimiento se asegura de que nunca puedan ganar el poder a través de las elecciones, y perseguir a sus miembros más fácil.\n\n§YPrerequisito:§!\n[!ban_button_click_enabled]\n§YEfectos:§!\n[!ban_button_click]"
 allow_party_TT: "§HLegalize [party_name_by_index] (§Y [?party_pop_array^v|%1]§!)§!\nHa llegado el momento de levantar nuestra prohibición y dejar que sus miembros corran a oficinas públicas y se organicen legalmente.\n\n§YPrerequisito:§!\n[!allow_button_click_enabled]\n§YEfectos:§!\n[!allow_button_click]"
