 MDR_SPACE_GO_TT: "Te lleva a la página donde se hace esto."
 MDR_SPACE_GUIDE: "Guía"
 MDR_SPACE_GUIDE_TT: "Cómo funciona el programa espacial, paso a paso."
 MDR_SPACE_CHANCE: "Éxito de lanzamiento: §Y[?mdr_space_chance_pct|0]%§!"
 MDR_SPACE_GUIDE_INTRO: "CÓMO FUNCIONA, EN 7 PASOS"
 MDR_SPACE_G1: "1. Poné presupuesto"
 MDR_SPACE_G1_T: "Sale de la economía cada semana y genera §Gciencia§!, la moneda del programa. En 2000 casi todos ponían entre 0,01% y 0,15% del PBI; arriba de 0,5% es una apuesta fuerte."
 MDR_SPACE_G2: "2. Construí cosmódromos"
 MDR_SPACE_G2_T: "En la pantalla de construcción, Edificios estatales. Cada nivel da ciencia y mejora los lanzadores."
 MDR_SPACE_G3: "3. Investigá"
 MDR_SPACE_G3_T: "En la pantalla de investigación, pestaña Programa espacial. Cada investigación dice qué abre. Viajes espaciales abre los destinos."
 MDR_SPACE_G4: "4. Hacé proyectos"
 MDR_SPACE_G4_T: "Mejoras permanentes que se pagan con ciencia y dinero. Solo se hacen unos pocos a la vez: el resto espera en la cola."
 MDR_SPACE_G5: "5. Lanzá misiones"
 MDR_SPACE_G5_T: "Sondas, viajes tripulados y bases, en Decisiones. Pueden fallar. Primero sonda, después tripulación, después base."
 MDR_SPACE_G6: "6. Reclamá objetivos"
 MDR_SPACE_G6_T: "Al cumplir una meta, reclamala en Objetivos. El prestigio da estabilidad y poder político."
 MDR_SPACE_G7: "7. Cuidá las colonias"
 MDR_SPACE_G7_T: "Las bases en la Luna y Marte abren colonias. Si faltan suministros, cae la moral y se pierden colonos."
 MDR_COL_NONE_MOON: "§YLuna:§! [mdr_col_moon_step]"
 MDR_COL_NONE_MARS: "§YMarte:§! [mdr_col_mars_step]"
 MDR_SPACE_TIP_TECHS: "Investigaciones terminadas de la pestaña Programa espacial. Se investigan en la pantalla de investigación."
 MDR_SPACE_TIP_SITES: "Estados con cosmódromo. Se construyen en la pantalla de construcción, Edificios estatales, hasta 3 niveles por estado."
 MDR_SPACE_TIP_PCT: "Parte del PBI que va al programa cada año. Se cambia en Finanzas."
 MDR_SPACE_TIP_SCIENCE: "Ciencia juntada. Paga los proyectos y las misiones. Sube cada semana por el presupuesto, los científicos, los cosmódromos y las colonias."
 MDR_SPACE_TIP_BONUS: "Velocidad de investigación que da el presupuesto, para todo el país."
 MDR_SPACE_TIP_PRESTIGE: "Sube con objetivos y grandes misiones. Da estabilidad y poder político."
 MDR_SPACE_TIP_SCIENTISTS: "Cada 50 científicos dan 0,2 de ciencia por semana y cobran $$0,001B."
 MDR_SPACE_TIP_ENGINEERS: "Cada 100 ingenieros acortan 5% los proyectos y misiones, y cobran $$0,002B por semana."
 MDR_SPACE_TIP_ASTRONAUTS: "Las misiones tripuladas piden un mínimo. Cada 2 astronautas cobran $$0,0008B por semana."
 MDR_COL_TIP_POP: "Cada colono da ciencia e investigación, y gasta suministros. Se envían con el botón de abajo."
 MDR_COL_TIP_MORALE: "Baja si un suministro cae por debajo de 15. Por debajo de 25% se pierden colonos."
 MDR_COL_GREENHOUSE_TT: "§YInvernadero:§! 0,9 de comida por semana. Cuesta $$0,8B en la Luna y $$2,6B en Marte."
 MDR_COL_MINE_TT: "§YMina de hielo:§! 0,8 de agua y de oxígeno por semana. Cuesta $$0,8B en la Luna y $$2,6B en Marte."
 MDR_COL_REACTOR_TT: "§YReactor:§! 1,1 de energía por semana. Cuesta $$0,8B en la Luna y $$2,6B en Marte."
 MDR_COL_WORKSHOP_TT: "§YTaller:§! +0,3% de producción de fábricas militares. Cuesta $$0,8B en la Luna y $$2,6B en Marte."
 MDR_SPACE_TIP_FIELD: "Escribí con tu teclado. Con las flechas moviste el cursor. Retroceso y Suprimir borran."
 MDR_SPACE_STEP_WAIT: "§GTodo en marcha.§! Esperá a que terminen, o poné más en la cola."
