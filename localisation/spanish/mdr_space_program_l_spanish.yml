 MDR_SPACE_HELP_S: "Hacé clic en un planeta para ver qué falta para llegar."
 MDR_SPACE_HELP_C: "Cada colono gasta suministros y da ciencia. Mantené las barras arriba con módulos o con una ruta de carga."
 MDR_SPACE_HELP_A: "Más personal da más ciencia y acorta los proyectos, pero cobra sueldo cada semana."
