l_spanish:
 mdr_mon_dzud: "Dzud"
 mdr_mon_dzud_desc: "Inviernos extremos matan millones de animales. La estepa pasa hambre."
 mdr_mon_dzud_mild: "Dzud contenido"
 mdr_mon_dzud_mild_desc: "Las reservas de forraje y la ayuda limitan el daño del invierno."
 mdr_mon_civil_service: "Funcionarios de carrera"
 mdr_mon_civil_service_desc: "Menos cargos políticos y una administración más estable."
 mdr_mon_democracy: "Democracia consolidada"
 mdr_mon_democracy_desc: "Elecciones limpias y alternancia en el poder."
 mdr_mon_party_state: "El partido y el Estado"
 mdr_mon_party_state_desc: "El Partido del Pueblo y el Estado son casi lo mismo."
 mdr_mon_strongman: "El hombre fuerte"
 mdr_mon_strongman_desc: "Un líder concentra el poder por encima del Gran Jural."
 mdr_mon_strongman_unrest: "Malestar en las calles"
 mdr_mon_strongman_unrest_desc: "La calle no acepta el giro autoritario."
 mdr_mon_mining_patronage: "Clientelismo minero"
 mdr_mon_mining_patronage_desc: "Las licencias mineras se reparten entre los leales."
 mdr_mon_loyal_army: "Un ejército leal"
 mdr_mon_loyal_army_desc: "Los generales deben su carrera al gobierno."
 mdr_mon_leader_referendum: "El plebiscito del líder"
 mdr_mon_leader_referendum_desc: "El líder ganó su plebiscito, por ahora."
 mdr_mon_open_mining: "Minería abierta"
 mdr_mon_open_mining_desc: "Las mineras extranjeras invierten en el Gobi."
 mdr_mon_stock_exchange: "La bolsa de Ulán Bator"
 mdr_mon_stock_exchange_desc: "Capital local para empresas locales."
 mdr_mon_resource_nationalism: "Nacionalismo de los recursos"
 mdr_mon_resource_nationalism_desc: "Impuesto extraordinario sobre el cobre y el oro."
 mdr_mon_erdenes: "Erdenes Mongol"
 mdr_mon_erdenes_desc: "La empresa estatal tiene parte de cada gran proyecto."
 mdr_mon_copper_exports: "Impuesto al cobre"
 mdr_mon_copper_exports_desc: "Cada camión de concentrado deja algo en la frontera."
 mdr_mon_china_dependence: "Dependencia de China"
 mdr_mon_china_dependence_desc: "Casi todo lo que exportamos va a un solo cliente."
 mdr_mon_human_development_fund: "Fondo de Desarrollo Humano"
 mdr_mon_human_development_fund_desc: "Reparto en efectivo de la renta minera."
 mdr_mon_imf_program: "Programa con el FMI"
 mdr_mon_imf_program_desc: "Un rescate a cambio de ajustar el gasto."
 mdr_mon_stable_togrog: "Tugrik estable"
 mdr_mon_stable_togrog_desc: "Menos inflación y deuda más barata."
 mdr_mon_diversified: "Economía diversificada"
 mdr_mon_diversified_desc: "Ya no vivimos solo del cobre."
 mdr_mon_tourism: "Turismo de la estepa"
 mdr_mon_tourism_desc: "Visitantes en los campamentos de ger y el Gobi."
 mdr_mon_tourism_statue: "El monumento ecuestre"
 mdr_mon_tourism_statue_desc: "La estatua de Gengis Kan atrae visitantes."
 mdr_mon_herder_coops: "Cooperativas de pastores"
 mdr_mon_herder_coops_desc: "Los pastores venden juntos lana y carne."
 mdr_mon_modern_nomads: "Nómadas del siglo XXI"
 mdr_mon_modern_nomads_desc: "Paneles solares, teléfonos y mercados para la vida nómada."
 mdr_mon_ger_districts: "Los distritos de ger"
 mdr_mon_ger_districts_desc: "Barrios de yurtas sin servicios alrededor de Ulán Bator."
 mdr_mon_remittances: "Remesas de Corea"
 mdr_mon_remittances_desc: "Los mongoles que trabajan en Corea mandan dinero a casa."
 mdr_mon_gsp_plus: "Preferencias europeas"
 mdr_mon_gsp_plus_desc: "Aranceles bajos en la Unión Europea."
 mdr_mon_third_neighbor: "El tercer vecino"
 mdr_mon_third_neighbor_desc: "Equilibrio entre Rusia y China, con amigos lejanos."
 mdr_mon_beijing_tilt: "Cerca de Pekín"
 mdr_mon_beijing_tilt_desc: "Inversión china a cambio de dependencia."
 mdr_mon_moscow_tilt: "Cerca de Moscú"
 mdr_mon_moscow_tilt_desc: "Combustible y armas rusas baratas."
 mdr_mon_no_master: "Ningún vecino nos manda"
 mdr_mon_no_master_desc: "Mongolia trata con todos y no obedece a nadie."
 mdr_mon_army_reform: "Reforma militar"
 mdr_mon_army_reform_desc: "Una fuerza profesional en lugar del viejo ejército soviético."
 mdr_mon_peacekeepers: "Cascos azules"
 mdr_mon_peacekeepers_desc: "Soldados mongoles en misiones de paz de la ONU."
 mdr_mon_khaan_quest: "Khaan Quest"
 mdr_mon_khaan_quest_desc: "Maniobras anuales con Estados Unidos y sus aliados."
 mdr_mon_helicopters: "Helicópteros de transporte"
 mdr_mon_helicopters_desc: "Movilidad en un país sin caminos."
 mdr_mon_expeditionary: "Fuerza expedicionaria de paz"
 mdr_mon_expeditionary_desc: "Pocos soldados, muy entrenados."
 mdr_mon_total_defense: "Defensa total de la estepa"
 mdr_mon_total_defense_desc: "Cada valle una trinchera, cada pastor un soldado."
 mdr_mon_steppe_mobility: "Fuerzas móviles de la estepa"
 mdr_mon_steppe_mobility_desc: "Unidades ligeras y rápidas para la llanura."
 mdr_mon_khan_guard: "La guardia del kan"
 mdr_mon_khan_guard_desc: "Una unidad de élite con los colores de Gengis."
 mdr_mon_chinggis: "Gengis Kan, padre de la nación"
 mdr_mon_chinggis_desc: "Su nombre une a todos los mongoles."
 mdr_mon_800_years: "800 años del Gran Estado Mongol"
 mdr_mon_800_years_desc: "El país celebra el aniversario del imperio."
 mdr_mon_script_transition: "Cambio de alfabeto"
 mdr_mon_script_transition_desc: "La escritura tradicional vuelve; por un tiempo, cuesta."
 mdr_mon_nation_of_mongols: "Nación de los mongoles"
 mdr_mon_nation_of_mongols_desc: "Somos el hogar de todos los mongoles."
 mdr_mon_mongol_world: "El mundo mongol"
 mdr_mon_mongol_world_desc: "Cultura, idioma y turismo: el poder blando de la estepa."
 mdr_mon_khanate_law: "La ley del Imperio"
 mdr_mon_khanate_law_desc: "Todos los hombres de la estepa, al servicio del imperio."
 mdr_mon_pax_mongolica: "Pax Mongolica"
 mdr_mon_pax_mongolica_desc: "Paz, comercio y caminos seguros en toda la estepa."
 mdr_mon.1.t: "Disturbios en Ulán Bator"
 mdr_mon.1.d: "Tras las elecciones, miles de personas denuncian fraude. La sede del Partido del Pueblo arde y hay cinco muertos. El gobierno tiene que elegir cómo responder."
 mdr_mon.1.a: "Estado de emergencia: primero el orden."
 mdr_mon.1.b: "Una comisión independiente que investigue todo."
 mdr_mon.2.t: "El dzud vuelve a la estepa"
 mdr_mon.2.d_prepared: "Otro invierno terrible cae sobre la estepa. Esta vez las reservas de forraje y el seguro ganadero salvan a la mayoría de los rebaños."
 mdr_mon.2.d_unprepared: "Otro invierno terrible cae sobre la estepa. Sin reservas de forraje, millones de animales mueren y miles de familias pierden todo."
 mdr_mon.2.a: "La estepa resiste."
 mdr_mon.3.t: "La propuesta del imperio"
 mdr_mon.3.d: "[From.GetName] nos invita a unirnos a un Estado de todos los mongoles. Compartimos lengua, historia y estepa. ¿Aceptamos?"
 mdr_mon.3.a: "Somos mongoles: aceptamos."
 mdr_mon.3.b: "Seguiremos por nuestra cuenta."
 mdr_mon.4.t: "El Imperio Mongol renace"
 mdr_mon.4.d: "Ocho siglos después de Gengis Kan, [From.GetName] proclama el Imperio Mongol y une a los pueblos mongoles bajo una sola bandera. Las capitales vecinas miran hacia la estepa con preocupación."
 mdr_mon.4.a: "El mundo vuelve a mirar a la estepa."
