 MDR_MON_GREAT_KHAN: "Gran Kan Temüjin II"
 MDR_MON_GREAT_KHAN_desc: "Elegido por el kurultái como heredero de Temüjin, el Gran Kan gobierna el imperio restaurado por encima de partidos y elecciones."
 mdr_mon_great_khan: "Gran Kan"
 mdr_mon_great_khan_desc: "+11% de poder político, +5% de estabilidad y +7% de moral."
 mdr_mon_khanate_tt: "El nuevo Gran Kan reemplaza al jefe de Estado. El país pasa a llamarse §YImperio Mongol§!, con bandera y color propios."
