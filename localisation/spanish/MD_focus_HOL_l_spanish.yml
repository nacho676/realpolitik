 DAMEN_mio_container_ferry_modularity: "Modularidad del ferry de contenedores"
 DAMEN_mio_AI_assisted_threat_response: "Respuesta a amenazas asistida por IA"
 HOL_Naval_Group_naval_equipment_organisation: "Dirección de Construcción Navales"
 HOL_Naval_Group_naval_equipment_organisation_desc: "Direction des Constructions Navales (DCNS) es un socio importante de la industria naval [HOL.GetAdjectiveCap] y proporciona buques de guerra y tecnología submarina de primer nivel a la Marina Real de los Países Bajos. Con décadas de experiencia en ingeniería naval, Naval Group fortalece la flota [HOL.GetAdjectiveCap]."
 HOL_Naval_Group_naval_equipment_organisation_trait: "Diseñador de buques de guerra"
 HOL_fokker_technologies_planes_manufacturer: "Tecnologías de Fokker"
 HOL_fokker_technologies_planes_manufacturer_desc: "Fokker Technologies es un reconocido fabricante de aeronaves [HOL.GetAdjectiveCap], con una trayectoria en la producción de aviones militares y civiles. Fokker, conocida por su innovación en el sector aeroespacial, continúa suministrando tecnología de vanguardia a la Fuerza Aérea [HOL.GetAdjectiveCap]."
 HOL_fokker_technologies_planes_manufacturer_trait: "Fabricante de Aeronaves Ligeras"
 HOL_werkspoor_equipment_manufacturer: "Werkspoor Utrecht"
 HOL_werkspoor_equipment_manufacturer_desc: "Werkspoor Utrecht, que en su día fue una piedra angular de la innovación industrial [HOL.GetAdjectiveCap], se erige como un faro de excelencia en ingeniería nacional. Werkspoor se especializa en la fabricación de trenes, maquinaria y otros equipos pesados de alta calidad, lo que garantiza que los Países Bajos mantengan su reputación de tecnología industrial de vanguardia."
 HOL_werkspoor_equipment_manufacturer_trait: "Desarrollos ferroviarios"
 WS_mio_composite_armor_plates: "Placas de Blindaje Compuestas"
 WS_mio_mobile_aa_railcar: "Vagón de ferrocarril móvil AA"
 WS_mio_infantry_support_wagon: "Carro de apoyo de infantería"
 WS_mio_field_rail_repair_depot: "Depósito de reparación de rieles de campo"
 WS_mio_remote_track_surveillance: "Vigilancia remota de vías"
 WS_mio_automated_rail_depot: "Depósito ferroviario automatizado"
 WS_mio_prefab_rails_program: "Programa de rieles prefabricados"
