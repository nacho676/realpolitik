 HOL_SGP_in_progress_flag: "SGP Enfoque en progreso"
 HOL_GL_in_progress_flag: "GroenLinks Enfoque en progreso"
 HOL_failed_declaring_war_voc: "Falló en Declare War para la VOC"
 HOL_suriname_accepted_infrastructure: "Acuerdo sobre infraestructura de Suriname aceptado"
 HOL_accepted_FRA_carrier: "Asistencia a los transportistas franceses"
 HOL_claim_german_leadership_tt: "Los ingresos gubernamentales superan los gastos del Gobierno."
 HOL_voc_india_christian_tt: "La opinión de la comunidad cristiana sobre el gobierno indio es inferior al 50%."
 HOL_asml_high_na_innovation_monopoly: "Monopolio de innovación de alto nivel"
 HOL_asml_high_na_innovation_monopoly_desc: "ASML combina la producción madura de EUV, el liderazgo de High-NA y una red de proveedores resistente. La investigación y la capacidad de servicio holandesa mantienen su posición única en la litografía avanzada."
 HOL_asml_resilient_european_tooling_network: "Red de herramientas europeas resistente"
 HOL_asml_resilient_european_tooling_network_desc: "ASML ancla una red europea diversificada de proveedores de precisión y equipos de servicios sobre el terreno. Confiabilidad y soporte al cliente convierten la demanda del equipo en ingresos de exportación duraderos."
 HOL_asml_neutral_global_lithography_utility: "Utilidad de la litografía global neutral"
 HOL_asml_neutral_global_lithography_utility_desc: "ASML sirve a clientes calificados en bloques políticos bajo una política de asignación comercialmente neutral. El acceso amplio apoya las asociaciones de investigación y los ingresos de exportación."
 HOL_asml_strategic_western_gatekeeper: "Estratégico Western Gatekeeper"
 HOL_asml_strategic_western_gatekeeper_desc: "La política holandesa de concesión de licencias concentra el acceso a sistemas avanzados entre los asociados estratégicos. La política fortalece el apalancamiento nacional al reducir el alcance comercial de ASML."
 HOL_asml_commercial_tooling_champion: "Campeón de Herramientas Comerciales"
 HOL_asml_commercial_tooling_champion_desc: "ASML sigue siendo un proveedor de equipo mundial rentable sin lograr uno de los resultados estratégicos más especializados. Su posición de investigación y exportación sigue beneficiando a la economía holandesa."
 HOL_asml_backlog_pressure_moderate: "Elevado de la herramienta Backlog"
 HOL_asml_backlog_pressure_moderate_desc: "La fuerte demanda de litografía aumenta el volumen de trabajo de servicios e ingeniería al tiempo que apoya los ingresos del equipo y la exportación."
 HOL_asml_backlog_pressure_severe: "Herramienta severa Backlog"
 HOL_asml_backlog_pressure_severe_desc: "Un pedido excepcional aumenta los ingresos del equipo, pero desvía a ingenieros de investigación y calificación del cliente."
 HOL_asml_events.1.t: "Compromiso con EUV"
 HOL_asml_events.1.d: "A principios del siglo, ASML debe decidir si la litografía ultravioleta extrema merece una inversión sostenida a pesar de problemas de fuente y óptica no resueltos. La decisión dará forma al horizonte de investigación de la empresa."
 HOL_asml_events.1.a: "Compromiso al largo horizonte"
 HOL_asml_events.1.a_tt: "Liderazgo litográfico: §G+1§!\nLa madurez de la EUV: §G+1§!"
 HOL_asml_events.1.b: "Balance EUV con plataformas actuales"
 HOL_asml_events.1.b_tt: "Resiliencia del proveedor: §G+2§!\nDiversificación del cliente: §G+1§!"
 HOL_asml_events.2.t: "Consolidar el Programa EUV"
 HOL_asml_events.2.d: "El trabajo de prototipo ha expuesto cuán ajustadamente las fuentes, ópticas, etapas y software de la UEV dependen unos de otros. ASML puede consolidar el programa o priorizar las entregas de clientes a más corto plazo."
 HOL_asml_events.2.a: "Unificar el programa de desarrollo"
 HOL_asml_events.2.a_tt: "La madurez de la EUV: §G+1§!\nResiliencia del proveedor: §G+1§!"
 HOL_asml_events.2.b: "Protege las entregas actuales"
 HOL_asml_events.2.b_tt: "Diversificación del cliente: §G+2§!\nLa madurez de la EUV: §R-1§!"
 HOL_asml_events.3.t: "Primeros instrumentos alfa de la EUV"
 HOL_asml_events.3.d: "Los primeros sistemas de demostración alfa de ASML llevan a EUV de componentes de laboratorio a herramientas integradas. Las máquinas siguen siendo experimentales, y las prioridades de ingeniería determinarán lo que enseñan los prototipos."
 HOL_asml_events.3.a: "Empujar herramientas de alfa integradas"
 HOL_asml_events.3.a_tt: "Liderazgo litográfico: §G+1§!\nLa madurez de la EUV: §G+2§!"
 HOL_asml_events.3.b: "Priorizar la confiabilidad del prototipo"
 HOL_asml_events.3.b_tt: "La madurez de la EUV: §G+1§!\nResiliencia del proveedor: §G+2§!"
 HOL_asml_events.4.t: "Adquirir BRION"
 HOL_asml_events.4.d: "La litografía computacional puede ayudar a los clientes a predecir cómo las máscaras y las condiciones de proceso afectan los patrones impresos. Adquirir BRION integraría esos modelos con los escáneres de ASML."
 HOL_asml_events.4.a: "Integrar la experiencia de BRION"
 HOL_asml_events.4.a_tt: "Liderazgo litográfico: §G+1§!\nDiversificación del cliente: §G+1§!"
 HOL_asml_events.4.b: "Desarrollar la capacidad interna"
 HOL_asml_events.4.b_tt: "Liderazgo litográfico: §G+1§!\nControl estratégico: §G+1§!"
 HOL_asml_events.5.t: "Integrar la Metrología de YieldStar"
 HOL_asml_events.5.d: "La metrología YieldStar puede conectar el rendimiento del escáner con las mediciones tomadas en los wafers de producción. ASML debe decidir si enfatizar el control integrado del proceso o un modelo de servicio más amplio."
 HOL_asml_events.5.a: "Integrar datos de escáner y metrología"
 HOL_asml_events.5.a_tt: "La madurez de la EUV: §G+1§!\nResiliencia del proveedor: §G+1§!"
 HOL_asml_events.5.b: "Construir un modelo de servicio de metrología"
 HOL_asml_events.5.b_tt: "Diversificación del cliente: §G+2§!\nResiliencia del proveedor: §G+1§!"
 HOL_asml_events.6.t: "Deliver the NXE:3100"
 HOL_asml_events.6.d: "Samsung está preparado para recibir un ASML NXE:3100, el primer sistema EUV ofrecido a un cliente. La entrega puede profundizar el aprendizaje del cliente, mientras que la labor de laboratorio adicional podría reducir el riesgo técnico antes de un despliegue más amplio."
 HOL_asml_events.6.a: "Entrega el sistema a Samsung"
 HOL_asml_events.6.a_tt: "La madurez de la EUV: §G+1§!\nDiversificación del cliente: §G+1§!"
 HOL_asml_events.6.b: "Amplia validación de laboratorio"
 HOL_asml_events.6.b_tt: "La madurez de la EUV: §G+2§!\nDiversificación del cliente: §R-1§!"
 HOL_asml_events.7.t: "Programa de Co-Inversión al Cliente"
 HOL_asml_events.7.d: "ASML está pidiendo a los clientes principales que co-inviertan en la capacidad de investigación necesaria para la litografía de próxima generación. Samsung puede ser invitado a participar, o la empresa holandesa puede preservar el control a través de financiamiento interno."
 HOL_asml_events.7.a: "Invitar a Samsung a participar"
 HOL_asml_events.7.a_tt: "Diversificación del cliente: §G+1§!\nControl estratégico: §G+1§!\nSamsung recibe un evento de respuesta negociado cuando Corea está disponible."
 HOL_asml_events.7.b: "Finanzas del programa internamente"
 HOL_asml_events.7.b_tt: "Control estratégico: §G+2§!\nDiversificación del cliente: §R-1§!"
 HOL_asml_events.8.t: "Integrar el Cimer"
 HOL_asml_events.8.d: "La ingeniería de fuente ligera de Cymer es central en el rendimiento y disponibilidad del EUV. Llevar al proveedor dentro de ASML puede mejorar la coordinación, mientras que una estrategia de recursos diversificados preservaría más redundancia externa."
 HOL_asml_events.8.a: "Integrar los equipos fuente de Cymer"
 HOL_asml_events.8.a_tt: "La madurez de la EUV: §G+1§!\nResiliencia del proveedor: §G+2§!"
 HOL_asml_events.8.b: "Mantener el trabajo diversificado de fuentes"
 HOL_asml_events.8.b_tt: "Resiliencia del proveedor: §G+2§!\nLa madurez de la EUV: §G+1§!"
 HOL_asml_events.9.t: "Prepare the NXE:3400"
 HOL_asml_events.9.d: "La generación NXE:3400 debe convertir el rendimiento de EUV en un sistema adecuado para la fabricación del volumen. ASML puede acelerar la comercialización o utilizar una rampa más lenta para proteger la fiabilidad."
 HOL_asml_events.9.a: "Preparar el despliegue comercial"
 HOL_asml_events.9.a_tt: "La madurez de la EUV: §G+1§!\nDiversificación del cliente: §G+1§!"
 HOL_asml_events.9.b: "Usar una rampa conservadora"
 HOL_asml_events.9.b_tt: "Resiliencia del proveedor: §G+2§!\nLa madurez de la EUV: §G+1§!"
 HOL_asml_events.10.t: "Validación comercial EUV"
 HOL_asml_events.10.d: "La EUV se está convirtiendo en una tecnología de producción en las principales fundiciones. ASML puede concentrarse en el rendimiento del sistema o ampliar la organización de servicios necesaria para apoyar una base instalada creciente."
 HOL_asml_events.10.a: "Validar la plataforma comercial"
 HOL_asml_events.10.a_tt: "Liderazgo litográfico: §G+1§!\nLa madurez de la EUV: §G+1§!"
 HOL_asml_events.10.b: "Servicio al cliente de escala primero"
 HOL_asml_events.10.b_tt: "Diversificación del cliente: §G+2§!\nResiliencia del proveedor: §G+1§!"
 HOL_asml_events.11.t: "El sistema de la UEV del centenario"
 HOL_asml_events.11.d: "El sistema EuroV enviado de ASML marca un fuerte aumento en la base instalada. La empresa debe igualar el crecimiento de la producción con repuestos, ingenieros de campo y soporte al cliente."
 HOL_asml_events.11.a: "Ampliar servicio con entregas"
 HOL_asml_events.11.a_tt: "Resiliencia del proveedor: §G+2§!\nDiversificación del cliente: §G+1§!"
 HOL_asml_events.11.b: "Priorizar el volumen de entrega"
 HOL_asml_events.11.b_tt: "Diversificación del cliente: §G+2§!\nResiliencia del proveedor: §R-1§!"
 HOL_asml_events.12.t: "Entregar el primer sistema de alto nivel"
 HOL_asml_events.12.d: "El primer sistema High-NA EUV de ASML introduce una abertura numérica más grande y una nueva generación de retos para la integración del proceso, e Intel lo quiere primero. La entrega temprana puede demostrar liderazgo técnico o apoyar a un piloto de clientes más amplio."
 HOL_asml_events.12.a: "Entregar el primer sistema completo"
 HOL_asml_events.12.a_tt: "Liderazgo litográfico: §G+1§!\nLa madurez de la EUV: §G+2§!"
 HOL_asml_events.12.b: "Ampliar el piloto del cliente"
 HOL_asml_events.12.b_tt: "La madurez de la EUV: §G+1§!\nDiversificación del cliente: §G+2§!"
 HOL_asml_events.13.t: "Abra el laboratorio de alto nivel del imec"
 HOL_asml_events.13.d: "ASML e imec están abriendo un laboratorio conjunto de High-NA donde los clientes y proveedores pueden probar materiales, máscaras y flujos de proceso. La instalación puede enfatizar la validación compartida o el control propietario."
 HOL_asml_events.13.a: "Abrir el laboratorio conjunto"
 HOL_asml_events.13.a_tt: "Resiliencia del proveedor: §G+1§!\nDiversificación del cliente: §G+1§!"
 HOL_asml_events.13.b: "Mantenga la propiedad de validación"
 HOL_asml_events.13.b_tt: "Liderazgo litográfico: §G+1§!\nControl estratégico: §G+2§!"
 HOL_asml_events.14.t: "Ampliar controles avanzados de exportación"
 HOL_asml_events.14.d: "El gobierno holandés está ampliando los controles sobre equipos avanzados de fabricación semiconductores, lo que en la práctica significa decidir a quién puede vender ASML. La concesión de licencias puede seguir una política estratégica de seguridad o mantener una asignación más amplia entre clientes cualificados."
 HOL_asml_events.14.a: "Adoptar licencias estratégicas"
 HOL_asml_events.14.a_tt: "Control estratégico: §G+3§!\nEstablece la posición del mercado de licencias estratégicas."
 HOL_asml_events.14.b: "Conservación de la asignación abierta"
 HOL_asml_events.14.b_tt: "Diversificación del cliente: §G+1§!\nControl estratégico: §R-2§!\nEstablece la posición del mercado de Asignación al Cliente Abierto."
 HOL_asml_events.15.t: "Evaluar la posición estratégica de ASML"
 HOL_asml_events.15.d: "Las opciones acumuladas de ASML ahora definen su posición en la litografía avanzada, coordinación de proveedores, servicio al cliente y licencias de exportación. Esta evaluación final es una síntesis de juego en lugar de una medición histórica."
 HOL_asml_events.15.a: "Resolver el resultado estratégico de ASML"
 HOL_asml_events.15.a_tt: "Aplica exactamente una lápida ASML según las cinco puntuaciones corporativas ligadas."
 HOL_asml_technology_threshold_tt: "Requiere Litografía Liderazgo por encima de 7 y la maternidad EUV por encima de 5."