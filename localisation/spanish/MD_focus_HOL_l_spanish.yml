 HOL_Damen_naval_equipment_organisation_zeven_provincien_lcf: "Zeven Provinciën LCF"
 HOL_Damen_naval_equipment_organisation_modular_construction: "Construcción modular"
 HOL_Damen_naval_equipment_organisation_low_observable_design: "Diseño bajo observación"
 HOL_Damen_naval_equipment_organisation_apar_radar: "Radar APAR"
 HOL_Damen_naval_equipment_organisation_damen_steel_hull: "Ladyn Steel Hull"
 HOL_Damen_naval_equipment_organisation_extended_range_hull: "Hull extendido-range"
 HOL_Damen_naval_equipment_organisation_goalkeeper_ciws: "Goalkeeper CIWS"
 HOL_Damen_naval_equipment_organisation_crew_reduction_tech: "Tecnología de Reducción de la tripulación"
