 HOL_FAD_construction: "Construcción del Future Air Defender"
 HOL_FAD_construction_desc: "Nuestros astilleros construyen las fragatas de defensa aérea Future Air Defender. Cuando concluya el programa, los buques terminados se incorporan directamente a la flota."
 HOL_FAD_delay_reduced_tt: "Un nuevo socio acorta el tiempo de construcción restante"
 HOL_FAD_ger_withdrew_tt: "El retiro de Alemania retrasa la construcción restante"
 HOL_military.038.t: "El futuro defensor del aire en una encrucijada"
 HOL_military.038.d: "El Futuro Defensor del Aire se ha convertido en costos crecientes y necesidades divergentes, y los astilleros necesitan más dinero para mantener el horario. El Bundestag debe decidir si aumentar su parte de la financiación o retirarse del programa."
