 HOL_asml_tsmc_group: "Alianza tecnológica ASML-TSMC"
 HOL_asml_tsmc_group_desc: "La ASML-TSMC Technology Alliance representa la vanguardia de la investigación y producción semiconductora. Combinando la experiencia holandesa en litografía con el liderazgo de Taiwán en la fabricación semiconductora, esta asociación tiene como objetivo dominar el panorama tecnológico global, garantizando un acceso sin igual a microchips avanzados e innovación tecnológica."
