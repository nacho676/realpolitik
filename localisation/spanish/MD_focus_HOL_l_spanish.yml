 voc_influence_saf: "£voc_icon VOC Influencia en §Y[SAF.GetNameWithFlag]§!"
 HOL_cape_port_investment: "Inversiones portuarias neerlandesas"
 HOL_cape_port_investment_tt: "Si los §Y[HOL.GetNameWithFlag]§! §Rdeclara la guerra§! a §Y[SAF.GetNameWithFlag]§! esta provincia será controlada inmediatamente por §Y[HOL.GetNameWithFlag]§!"
 HOL_java_strength: "£voc_icon VOC Fuerza en §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!"
 HOL_increase_voc_java_strength_effect_tt: "£voc_icon VOC Fuerza en §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!: Aumenta por [?HOL_java_strength_change|+]"
