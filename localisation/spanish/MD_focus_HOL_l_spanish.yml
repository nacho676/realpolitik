 DAMEN_mio_standard_hull_stockpiling: "Acumulación de cascos estándar"
 DAMEN_mio_retrofit_logistics: "Centro logístico de modernización"
 DAMEN_mio_seabuster_USV_trials: "Pruebas del USV SeaBuster"
 DAMEN_mio_USV_ramp: "Rampa USV/UUV"
 DAMEN_mio_island_e_ferry: "Electrificación del ferry eléctrico de isla"
