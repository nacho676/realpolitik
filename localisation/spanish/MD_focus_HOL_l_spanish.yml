 HOL_groningen_quake_reduce_tt: "Cambio mensual de terremotos Groningen: §G-10%§!"
 HOL_groningen_quake_end_tt: "§GEndos los terremotos inducidos en Groningen.§!"
 HOL_groningen.1.t: "Los Cambios Terrestres en Groningen"
 HOL_groningen.1.d: "Años de extracción continua de gas han desestabilizado la subsuperficie bajo Groningen. El primer gran terremoto inducido ha golpeado, agrietado casas e infraestructura dañina. Mientras los pozos sigan bombeando, los temblores volverán."
 HOL_groningen.1.a: "Nosotros gestionaremos las consecuencias"
 HOL_groningen.2.t: "Terremoto en Groningen"
 HOL_groningen.2.d: "El terreno se ha desplazado de nuevo, grietas casas e infraestructura dañina en toda la provincia mientras continúan los temblores inducidos."
 HOL_groningen.2.a: "Reparar el daño"
 HOL_soft_power_doctrine: "Doctrina de potencia suave"
 HOL_soft_power_doctrine_desc: "Los Países Bajos mandan influir más allá de su tamaño mediante la asistencia para el desarrollo, el liderazgo de la UE y la proyección mundial de sus conocimientos en materia de agua y logística. La formación de esto como doctrina canaliza el capital político a una influencia extranjera sostenida."
 HOL_development_cooperation_ministry: "Ministerio de Cooperación para el Desarrollo"
 HOL_development_cooperation_ministry_desc: "Los Países Bajos restablecen la financiación completa de su ministerio de cooperación para el desarrollo, históricamente uno de los contribuyentes más generosos de AOD en relación con el PIB. Las corrientes de ayuda están dirigidas a establecer asociaciones a largo plazo con los gobiernos receptores en lugar de extraer concesiones políticas."
 HOL_global_development_partnerships: "Alianzas para el Desarrollo Mundial"
 HOL_global_development_partnerships_desc: "Las embajadas y agregados de desarrollo holandeses amplían la programación en África, Asia, Oriente Medio y América Latina. Los gobiernos receptores registran el carácter constante y no coercitivo de la asistencia holandesa como signo de credibilidad."
 HOL_untied_aid_program: "Programa de ayuda sin restricciones"
 HOL_untied_aid_program_desc: "Los Países Bajos se comprometen a desatar la ayuda para el desarrollo, lo que significa que las naciones receptoras pueden adquirir bienes y servicios en mercados abiertos. Este enfoque profundiza la buena voluntad y amplía la influencia holandesa más allá de lo que podría lograr la condicionalidad bilateral."
 HOL_humanitarian_leadership: "El liderazgo humanitario"
 HOL_humanitarian_leadership_desc: "Los Países Bajos se posicionan en el centro del derecho internacional humanitario y la respuesta a las crisis, aprovechando el papel de La Haya como sede de la Corte Internacional de Justicia y la Corte Penal Internacional. Esta política exterior internacional aísla a la política exterior neerlandesa de las presiones mundiales."
 HOL_humanitarian_leadership_name: "El liderazgo humanitario"
 HOL_humanitarian_leadership_name_desc: "Como anfitriones de los tribunales internacionales, los Países Bajos ejercen una autoridad moral que mantiene la política interna y le permite comprometer fuerzas en el extranjero con menos fricción diplomática."
 HOL_eu_single_market_champion: "Unión Europea Campeona de Mercado Único"
 HOL_eu_single_market_champion_desc: "Los Países Bajos clasifican constantemente entre los Estados miembros de la UE más comprometidos a profundizar el mercado único, especialmente en servicios, comercio digital y regulación financiera. Los diplomáticos holandeses presionan activamente dentro de las instituciones de la UE para eliminar los obstáculos restantes."
 HOL_frugal_four_leadership: "Frugal Cuatro Liderazgo"
 HOL_frugal_four_leadership_desc: "Junto con Austria, Dinamarca y Suecia, los Países Bajos lideran el bloque fiscalmente conservador dentro de la UE, insistiendo en disciplina presupuestaria y condicionalidad de reforma para el gasto conjunto. Esta coordinación amplifica la influencia holandesa dentro de las negociaciones fiscales de la UE mucho más allá de lo que podría ofrecer el apalancamiento bilateral por sí solo."
 HOL_european_strategic_autonomy: "Autonomía Estratégica Europea"
 HOL_european_strategic_autonomy_desc: "Los Países Bajos defienden una mayor defensa europea e identidad política exterior, apoyando la brújula estratégica de la UE y contribuyendo a capacidades conjuntas. Los diplomáticos holandeses construyen coaliciones entre los socios de la UE para cambiar el bloque hacia posturas estratégicas más independientes."
 HOL_water_diplomacy_initiative: "Iniciativa de diplomacia del agua"
 HOL_water_diplomacy_initiative_desc: "Los ingenieros de agua holandeses y los expertos de Deltares se despliegan mediante un programa oficial de diplomacia para los países propensas a las inundaciones y al riesgo de agua en África, Asia y América Latina. El Delta Works y el enfoque holandés de la gestión integrada del agua sirven como modelos de referencia, construyendo relaciones técnicas y políticas duraderas."
 HOL_gateway_to_europe: "Gateway a Europa"
 HOL_gateway_to_europe_desc: "Rotterdam es el puerto más grande de Europa y Schiphol uno de sus principales centros de aviación. Los Países Bajos aprovechan esta centralidad logística como activo diplomático, hospedando misiones comerciales y posicionando la infraestructura neerlandesa como punto de partida preferido para los socios que buscan acceso a mercados europeos."
 HOL_global_trade_facilitation: "Facilitación del comercio mundial"
 HOL_global_trade_facilitation_desc: "Los diplomáticos holandeses abogan por un comercio abierto y basado en normas en mercados alineados con el oeste y no alineados. Los acuerdos bilaterales de facilitación del comercio, respaldados por la capacidad de rendimiento de Rotterdam y los servicios financieros holandeses, amplían el alcance comercial y político holandés."
 HOL_dutch_soft_power_powerhouse: "Dutch Soft Power Power Powerhouse"
 HOL_dutch_soft_power_powerhouse_desc: "Los Países Bajos han cultivado sistemáticamente su reputación como un socio fiable, de principios y capaz en todo el desarrollo, el liderazgo europeo y el comercio. Su poder blando supera ahora lo que predice su población y peso militar, otorgando una influencia política persistente en los foros internacionales."
 HOL_development_partner_opinion: "Socio de desarrollo holandés"
 HOL_water_partnership_opinion: "Asociación holandesa de agua"
 HOL_eu_leadership_opinion: "Liderazgo holandés de la UE"
 HOL_mocro.1.t: "¿Un Narco-Estado en Todos Pero Nombre?"
 HOL_mocro.1.d: "Cocaine inunda por Rotterdam, redes criminales arraigadas en el inframundo de la ciudad lavado miles de millones, y una cadena de asesinatos ha golpeado testigos, abogados y un periodista. Los comentaristas preguntan abiertamente si los Países Bajos están perdiendo terreno con la delincuencia organizada."
 HOL_mocro.1.a: "La amenaza para el estado de derecho"
 HOL_mocro.1.b: "La amenaza está exagerada."
 HOL_mocro.2.t: "Record Cocaine Haul en Rotterdam"
 HOL_mocro.2.d: "Los oficiales de aduanas han interceptado toneladas de cocaína escondidas en un contenedor de frutas. Los investigadores sospechan que los trabajadores corruptos, los llamados extractores, guiaron el envío a través del puerto."
 HOL_mocro.2.a: "Reforzar las aduanas en el puerto"
 HOL_mocro.2.b: "El envío pasa a través de"
 HOL_mocro.3.t: "Abogado es abatido"
 HOL_mocro.3.d: "A defence lawyer connected to a major organized-crime trial has been shot dead in broad daylight. El asesinato es una agresión directa contra el sistema de justicia y ha horrorizado al público."
 HOL_mocro.3.a: "Proveer protección estatal a los testigos"
 HOL_mocro.3.b: "No podemos proteger a todos."
 HOL_mocro.4.t: "Red encriptada Cracked"
 HOL_mocro.4.d: "La policía ha entrado en una red telefónica cifrada utilizada por organizaciones delictivas, cosechando millones de mensajes sobre la trata, el blanqueo de dinero y los asesinatos previstos."
 HOL_mocro.4.a: "Acta sobre los mensajes interceptados"
 HOL_mocro.4.b: "Nos falta la mano de obra para seguir cada pista"
 HOL_mocro.5.t: "Dinero sucio en Bricks y Mortar"
 HOL_mocro.5.d: "Los investigadores han rastreado ganancias de drogas lavadas en bienes raíces, restaurantes y pequeñas empresas en todo el país. Desarrollar la propiedad será lenta y políticamente sensible."
 HOL_mocro.5.a: "Aprovechar los bienes"
 HOL_mocro.5.b: "Mira hacia el otro lado"
 HOL_mocro.6.t: "Una generación perdida"
 HOL_mocro.6.d: "El programa atrae a los adolescentes de barrios con dificultades en el comercio de drogas con dinero y estatus rápidos, mientras que una subcultura juvenil violenta glorifica la vida del gángster."
 HOL_mocro.6.a: "Programas de prevención y juventud del Fondo"
 HOL_mocro.6.b: "Respuesta con una represión dura"
 HOL_mocro.7.t: "Corrupción en el puerto"
 HOL_mocro.7.d: "Una investigación interna ha descubierto a funcionarios de aduanas, trabajadores portuarios y policías en la nómina de sueldos de las redes criminales."
 HOL_mocro.7.a: "Purge a los funcionarios corruptos"
 HOL_mocro.7.b: "No hay pruebas de que podamos actuar."
 HOL_mocro.8.t: "El juicio de Marengo envuelve un veredicto"
 HOL_mocro.8.d: "Después de años de procedimientos bajo seguridad extraordinaria, el tribunal ha condenado a los líderes del sindicato criminal más notorio del país. Es una victoria histórica para el estado de derecho."
 HOL_mocro.8.a: "La justicia se sirve"
 VVD_Leader_Wilders: "§YGeert Wilders§! es £HOL_western_liberal Líder VVD"
 HOL_wilders_vvd_firebrand: "Agitador mediático"
 HOL_wilders_vvd_firebrand_desc: "Su implacable presencia en la prensa y el parlamento mantiene rivales a la defensiva y endurece al partido contra la presión exterior."
 HOL_voice_of_the_discontented: "Voz de los descontentos"
 HOL_voice_of_the_discontented_desc: "Él habla por los votantes que otros ignoran, encuadernándolos al partido mientras protegen al país de la intromisión extranjera."
 HOL_asylum_clampdown: "Asylum Clampdown"
 HOL_asylum_clampdown_desc: "Reglas de entrada más estrictas y procedimientos más rápidos cortan bruscamente las nuevas llegadas, lo que reduce la tensión en la vivienda y el mercado laboral."
 HOL_politics.82.t: "Parar el asilo"
 HOL_politics.82.d: "Los centros de recepción están desbordados y el público exige acción. Wilders presiona por la respuesta más dura posible al aflujo de asilo."
 HOL_politics.82.a: "Imposir un estricto gorro legal"
 HOL_politics.82.b: "Orden deportaciones masivas"
 HOL_politics.83.t: "El debate de integración"
 HOL_politics.83.d: "Wilders forza un argumento nacional sobre el islam, la integración y la identidad holandesa. La fiesta debe decidir hasta qué punto empujar."
 HOL_politics.83.a: "Cursos de asimilación del mandato"
 HOL_politics.83.b: "Defender el discurso libre y confrontar"
 HOL_politics.84.t: "Embajada en Jerusalén"
 HOL_politics.84.d: "Un amigo feroz de Israel, Wilders insta al gobierno a reconocer Jerusalén y mover la embajada holandesa allí. Washington aplaudiría, pero las capitales de toda la región advierten de consecuencias."
 HOL_politics.84.a: "Mueva la embajada a Jerusalén"
 HOL_politics.84.b: "Mantén la embajada en Tel Aviv"
 HOL_polder_model: "El modelo de pólder"
 HOL_polder_model_desc: "El modelo Polder es la tradición neerlandesa de formulación de políticas basada en el consenso, en la que el gobierno, los empresarios y los sindicatos negocian acuerdos generales en lugar de imponer decisiones. Arraigado en siglos de gestión cooperativa del agua, favorece el compromiso y las coaliciones estables, lo que otorga a la política neerlandesa resiliencia y credibilidad diplomática a costa de una reforma más lenta y deliberada."
 HOL_politics.85.t: "Francia se une a la partición."
 HOL_politics.85.d: "París ha aceptado nuestra propuesta e instará a Bélgica a celebrar un referéndum sobre su futuro. Se han sentado las bases para la partición. Ahora podemos impulsar el asunto mediante nuestras decisiones respecto a Bélgica."
 HOL_politics.85.a: "Excelente"
 BNL_aswf_frigates_remaining_tt: "Se han entregado menos de cuatro fragatas ASWF"
 BNL_lay_down_aswf_frigate: "Poner la quilla de una fragata ASWF"
 BNL_lay_down_aswf_frigate_desc: "El programa Guerra antisubmarina Frigate es un esfuerzo conjunto belga-holandés para reemplazar las fragatas de Karel Doorman y Wielingen con cuatro cascos modernos, dos para la Marina Real de Holanda y dos para el Componente Naval Belga. Construido alrededor de un casco tranquilo, una suite sonar de rayos remolque y un helicóptero ASW embarcado, cada nave se coloca en los patios de Damen sobre un ciclo completo de construcción antes de unirse a la flota."
 BNL_aswf_capability_update: "Actualización de capacidades de media vida del ASWF"
 BNL_aswf_capability_update_desc: "Con los cuatro Guerra antisubmarina Fragatas en servicio, la oficina binacional del programa autoriza una modernización de la vida media. Propulsión actualizada, una suite de sonar mejorada, células de defensa del aire mejoradas y una instalación de helicópteros refrescante mantienen la clase competitiva frente a las amenazas submarinas modernas para el resto de su vida útil."
 HOL_deploy_islands_commando: "Desplegar comandos en las Islas Exteriores"
 HOL_gulden_reintroduced: "§Y[HOL.GetNameWithFlag]§! Reintrodujo el $gulden$ como moneda nacional"
