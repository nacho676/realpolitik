 HOL_radicaal_populisme: "Populismo radical"
 HOL_fortuyn_centre_balance: "Fortuynismo equilibrado"
 HOL_fortuyn_centre_balance_desc: "El rumbo político se encuentra en un equilibrio entre el pragmatismo reformista y la energía populista. La estabilidad, la continuidad política y el compromiso cívico definen este equilibrio."
 HOL_pragmatisch_fortuynisme_high: "Dominio del fortuynismo pragmático"
 HOL_pragmatisch_fortuynisme_high_desc: "La tecnocracia y la reforma institucional dominan la agenda. La retórica populista se ha moderado en favor de un enfoque sereno y orientado a las políticas."
 HOL_pragmatisch_fortuynisme_medium: "Política orientada a la gobernanza"
 HOL_pragmatisch_fortuynisme_medium_desc: "El enfoque se centra en la reforma estructural, la descentralización y la transparencia. El LPF traza un rumbo estable de liderazgo racional."
 HOL_pragmatisch_fortuynisme_low: "Pragmatismo moderado"
 HOL_pragmatisch_fortuynisme_low_desc: "El fortuynismo pragmático tiene una ligera ventaja, pero los llamados a políticas más confrontativas y populistas están ganando terreno entre las bases."
 HOL_pragmatisch_fortuynisme_edge: "Delicado equilibrio con el populismo"
 HOL_pragmatisch_fortuynisme_edge_desc: "El partido se mueve en una delgada línea entre la moderación política y el atractivo populista. La presión pública está aumentando para una retórica más contundente."
 HOL_radicaal_populisme_high: "El ascenso del populismo radical"
 HOL_radicaal_populisme_high_desc: "El partido ha adoptado plenamente una agenda antisistema. La retórica confrontativa, el resurgimiento cultural y el sentimiento antiélite definen la nueva identidad del LPF."
 HOL_radicaal_populisme_medium: "Impulso populista"
 HOL_radicaal_populisme_medium_desc: "El LPF canaliza el descontento público hacia la acción. Las estructuras de gobernanza tradicionales están siendo cuestionadas desde dentro."
 HOL_radicaal_populisme_low: "Populismo emergente"
 HOL_radicaal_populisme_low_desc: "La influencia populista está aumentando, aunque el partido aún mantiene cierta cautela institucional. El debate interno se está intensificando."
 HOL_radicaal_populisme_edge: "Tensión con el pragmatismo"
 HOL_radicaal_populisme_edge_desc: "Los elementos populistas están aumentando, pero el liderazgo del LPF sigue dudando en abandonar por completo los fundamentos pragmáticos."
 HOL_pvda_modernize_party_policies: "Modernizar las políticas del partido"
 HOL_pvda_modernize_party_policies_desc: "Adoptar políticas sobre ambientalismo, innovación digital e inclusión, atrayendo a votantes más jóvenes y progresistas urbanos."
 HOL_pvda_promote_urban_investments: "Promover las inversiones urbanas"
 HOL_pvda_promote_urban_investments_desc: "Se centra en la infraestructura, la vivienda y las iniciativas ecológicas en los centros urbanos, reforzando así el atractivo del partido en las ciudades."
 HOL_pvda_focus_climate_policy: "Enfoque en la política climática"
 HOL_pvda_focus_climate_policy_desc: "Aboga por reformas climáticas ambiciosas, priorizando las energías renovables y las inversiones en la industria verde."
 HOL_pvda_strengthen_union_influence: "Fortalecer la influencia sindical"
 HOL_pvda_strengthen_union_influence_desc: "Fortalece a los sindicatos, aumentando su influencia sobre las políticas laborales y la toma de decisiones."
 HOL_pvda_promote_rural_investments: "Enfoque en el desarrollo rural"
 HOL_pvda_promote_rural_investments_desc: "Destina recursos a apoyar a las comunidades rurales y a las industrias tradicionales, apelando a las raíces obreras del partido."
 HOL_pvda_social_housing_initiative: "Ampliar las iniciativas de vivienda social"
 HOL_pvda_social_housing_initiative_desc: "Invertir fuertemente en vivienda social para abordar la desigualdad y la congestión urbana, centrándose en los barrios de bajos ingresos."
 HOL_pvda_private_energy_investments: "Fomentar la inversión privada en energía"
 HOL_pvda_private_energy_investments_desc: "Privatizar partes del sector energético para atraer capital, priorizando la eficiencia económica sobre los objetivos verdes"
 HOL_pvda_climate_action_plan: "Plan de Acción Climática"
 sp_dutch_super_bus_project: "Súper Bús"
 sp_dutch_super_bus_project_desc: "El Experimento Súper Bús es un proyecto holandés de vanguardia diseñado para transformar el transporte público a través de la innovación y la sostenibilidad. Este proyecto tiene como objetivo desarrollar un vehículo de pasajeros eléctrico de alta velocidad capaz de alcanzar velocidades de hasta 250 km/h. Construido con fibra de carbono liviana, el Súper Bús combina viajes de lujo con eficiencia, permitiendo un tránsito rápido entre regiones clave."
 sp_dutch_super_bus_project_daf_reward_work_with_DAF: "Corporativo con DAF"
 sp_dutch_super_bus_project_daf_reward_work_NOT_with_DAF: "Negar trabajar con DAF"
 sp_dutch_super_bus_project_daf: "DAF ofrece corporación"
 utility_vehicle_super_bus_1: "Súper Bús"
 HOL_cross_bronse: "Cruz de bronce"
 HOL_willems_orde: "Orden Militar de Guillermo"
 HOL_cross_of_service: "Cruz del Mérito"
 HOL_lion_bronse: "León de Bronce"
 HOL_empowering_local_governments_idea: "Gobernanza descentralizada"
 HOL_empowering_local_governments_idea_desc: "Se ha delegado poder a los gobiernos regionales, lo que ha mejorado la autonomía local y la eficiencia administrativa. El esfuerzo de descentralización ha reforzado la estabilidad y promovido una estructura económica más eficiente."
 HOL_centralized_governance_idea: "Gobernanza centralizada"
 HOL_centralized_governance_idea_desc: "La Corona ha centralizado la autoridad, creando un sistema de gobierno unificado pero rígido. Los costos burocráticos han aumentado, pero el poder político se ha consolidado para fortalecer el control de la monarquía."
 HOL_restore_nobility_influence_idea: "Influencia de la nobleza restaurada"
 HOL_restore_nobility_influence_idea_desc: "La nobleza ha recuperado su papel como piedra angular del gobierno real. Su influencia refuerza la autoridad de la monarquía, fomenta la lealtad política y promueve un sentido de unidad cultural."
 HOL_nobility_backed_military_idea: "Ejército dirigido por la nobleza"
 HOL_nobility_backed_military_idea_desc: "La nobleza ha asumido roles de liderazgo en el ejército, garantizando la lealtad a la Corona. La eficiencia militar ha mejorado y la autoridad de la monarquía se consolida a través de las fuerzas armadas."
 HOL_nato_commitments_idea: "Compromisos de la OTAN"
 HOL_nato_commitments_idea_desc: "Ante el aumento de las tensiones globales, la OTAN sigue siendo la base de la seguridad holandesa. Al reafirmar nuestro compromiso con la alianza, podemos asegurar la cooperación en defensa y las ventajas tecnológicas de nuestros aliados."
 HOL_politics.08.e: "Invertir en ciudades inteligentes"
 HOL_politics.11.e: "Enfocarse en la electrónica naval"
