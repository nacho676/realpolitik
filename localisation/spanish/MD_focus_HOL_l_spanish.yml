 HOL_add_dutchaid: "Establecer el programa de ayuda neerlandés"
 HOL_add_dutchaid_desc: "Lanzar el Programa de Ayuda Neerlandés para dar asistencia al desarrollo a naciones socias. Requiere completar el enfoque del Programa de Ayuda Neerlandés de la WIC y suficiente capacidad económica."
 HOL_remove_dutchaid: "Programa de ayuda holandesa"
 HOL_remove_dutchaid_desc: "Incrementar el Programa holandés de ayuda, redireccionando recursos hacia las prioridades nacionales."
 HOL_nonselfsufficient_army_emergency_tt: "\n§YRequisitos para levantar la emergencia:§!\n - Más de 15 $arms_factory$\n - No tengo $HOL_nonselfsufficient_army1$\n - Más que la cantidad desplegada almacenada de: $infantry_weapons_type$, $util_vehicle_type$, $cnc_equipment_type$, $artillery_equipment$, $medium_tank_amphibious_chassis$, $medium_tank_flame_chassis$, $medium_tank_chassis$"
 HOL_shell: "Comprar acciones de Shell"
 HOL_shell_desc: "Royal Dutch Shell, una empresa global de energía con sede en Holanda, es un actor líder en el sector energético del país. Con una cartera diversa que abarca petróleo, gas, energía renovable y tecnologías de bajo carbono, Shell se compromete a impulsar la transición energética y a ofrecer soluciones sostenibles que satisfagan las necesidades cambiantes de la sociedad."
 HOL_green_shell: "Concha verde"
 HOL_green_shell_desc: "El compromiso de Shell con la sostenibilidad y la energía renovable, la transición hacia fuentes de energía más limpias como viento, solar e hidrógeno. Mediante inversiones en tecnologías ecológicas, soluciones innovadoras e iniciativas de bajo carbono, Shell pretende liderar la transición energética y abordar los desafíos del cambio climático al tiempo que contribuye a un futuro más sostenible."
 HOL_blauwwind: "Blauwwind"
 HOL_blauwwind_desc: "Blauwwind es un proyecto de viento offshore en el Mar del Norte holandés, que comprende múltiples parques eólicos desarrollados por un consorcio de empresas. Al aprovechar la energía eólica, Blauwwind pretende apoyar los objetivos de energía renovable de Holanda, reducir las emisiones de carbono y promover la sostenibilidad ambiental. Mediante la colaboración e innovación, Blauwwind contribuye a la expansión de la capacidad eólica offshore y a la transición hacia un futuro energético limpio."
 HOL_porthos_project: "Proyecto Porthos"
 HOL_porthos_project_desc: "El Proyecto Porthos es una iniciativa de captura y almacenamiento de carbono (CCS) encaminada a reducir las emisiones de gases de efecto invernadero procedentes de fuentes industriales en la zona de Rotterdam. Al capturar las emisiones de CO2 y almacenarlas en zonas de gas offshore agotadas, Porthos contribuye a los esfuerzos de mitigación del cambio climático al tiempo que apoya la descarbonización industrial y los objetivos de desarrollo sostenible."
 HOL_energy_transition_campus: "Energía Transition Campus Amsterdam"
 HOL_energy_transition_campus_desc: "Energy Transition Campus Amsterdam sirve como centro de investigación, innovación y colaboración en el campo de la transición energética y sostenibilidad. Al reunir a la industria, el mundo académico, el gobierno y la sociedad civil, el campus fomenta soluciones interdisciplinarias, intercambio de conocimientos y despliegue tecnológico para acelerar el cambio hacia un sistema energético de bajo carbono y resiliente."
 HOL_hefa: "HEFA"
 HOL_hefa_desc: "Esteres hidroprocesados y ácidos grasos (HEFA) es una tecnología de combustible de aviación renovable destinada a reducir las emisiones de carbono del sector de la aviación. Mediante la conversión de materias primas sostenibles como aceites vegetales y grasas animales en biocombustibles caídos, HEFA permite a las compañías aéreas reducir su huella de carbono y cumplir con los objetivos de reducción de emisiones manteniendo al mismo tiempo la rentabilidad."
 HOL_holland_hydrogen: "Holland Hydrogen 1"
 HOL_holland_hydrogen_desc: "Holland Hydrogen 1 se centra en promover la tecnología e infraestructura de hidrógeno en los Países Bajos como parte de la estrategia de transición energética del país. Mediante la promoción de la producción, distribución y utilización de hidrógeno, Holland Hydrogen 1 pretende desbloquear el potencial del hidrógeno como portador energético limpio y versátil, apoyando los esfuerzos de descarbonización en sectores tales como transporte, industria y calefacción."
 HOL_no_green_shell: "Especialidad de Shell"
 HOL_no_green_shell_desc: "Shell sigue comprometida con sus operaciones básicas en la exploración, producción y distribución de fuentes de energía no renovables, como el petróleo y el gas natural. Con un énfasis constante en los combustibles fósiles tradicionales, las actividades de Shell abarcan perforaciones offshore, refinación y fabricación petroquímica. Pese a que se presta cada vez más atención a la energía renovable, Shell mantiene su enfoque estratégico para satisfacer la demanda mundial de energía mediante el desarrollo y utilización de los recursos energéticos convencionales."
 HOL_shell_energy_rotterdam: "Parque de energía y química de Shell"
 HOL_shell_energy_rotterdam_desc: "Situado en Europoort, el Shell Energy and Chemicals Park Rotterdam sirve como un importante centro industrial para la producción de energía y petroquímica en los Países Bajos. Con instalaciones avanzadas e infraestructura integrada, el parque apoya diversas operaciones, incluyendo refinación de petróleo, fabricación química y generación de energía. Como piedra angular de la economía holandesa, contribuye al desarrollo regional, la creación de empleo y la innovación en los sectores energético y químico."
 HOL_europoort_modernization: "Modernización de Europoort"
 HOL_europoort_modernization_desc: "Europoort, uno de los complejos petroquímicos más grandes de Europa, experimenta esfuerzos continuos de modernización para mejorar la eficiencia, sostenibilidad y competitividad. Mediante inversiones en tecnología, mejoras de infraestructura y optimización de procesos, Europoort pretende mantener su posición como centro líder de actividades energéticas e industriales, impulsando el crecimiento económico y el rendimiento ambiental en la región de Rotterdam."
 HOL_shell_moerdijk: "Ampliación Shell Chemicals Park Moerdijk"
 HOL_shell_moerdijk_desc: "Situado en Moerdijk, el Shell Chemicals Park sirve como centro estratégico para la fabricación y la innovación química en los Países Bajos. Con instalaciones de vanguardia y un enfoque en la sostenibilidad, el parque produce una amplia gama de productos petroquímicos, incluyendo plásticos, solventes y productos químicos especializados. Mediante la colaboración con socios de la industria e instituciones de investigación, Shell Chemicals Park Moerdijk impulsa los avances tecnológicos y la creación de valor en el sector químico."
 HOL_borsele_choice: "La estación de energía Borsele elección"
 HOL_borsele_choice_desc: "El futuro del reactor nuclear Borssele está en una encrucijada. A medida que aumenta la demanda de fuentes de energía sostenibles y fiables, se debe tomar una decisión sobre si ampliar la capacidad del reactor o reacondicionarlo en una planta de carbón limpia de última generación. Cada camino ofrece beneficios y desafíos distintos, dando forma al futuro energético de los Países Bajos."
 HOL_syngas_production: "Producción de Syngas"
 HOL_syngas_production_desc: "La producción de Syngas implica la conversión de varias materias primas, como gas natural, carbón o biomasa, en gas de síntesis (singás), un intermedio versátil utilizado en síntesis química y producción energética. Con tecnologías avanzadas y innovación en procesos, las instalaciones de producción de singás, como las operadas por Shell, desempeñan un papel crucial en el suministro de materias primas para petroquímicas, fertilizantes y combustibles, apoyando los objetivos del desarrollo industrial y la transición energética."
 HOL_solar_moerdijk: "Solar Moerdijk"
 HOL_solar_moerdijk_desc: "Solar Moerdijk es un proyecto de energía solar situado en la zona industrial de Moerdijk en los Países Bajos. Mediante el despliegue de paneles fotovoltaicos solares (PV) en tejados industriales y terrenos vacantes, Solar Moerdijk pretende generar electricidad renovable, reducir las emisiones de carbono y aumentar la resiliencia energética utilizando al mismo tiempo la infraestructura existente y promoviendo prácticas sostenibles de uso de la tierra."
 HOL_nam: "Establecer la Nederlandse Aardolie Maatschappij"
 HOL_nam_desc: "Nederlandse Aardolie Maatschappij (NAM) es una empresa holandesa encargada de la exploración, producción y desarrollo de recursos hidrocarburos en los Países Bajos. Con operaciones que abarcan campos tanto terrestres como offshore, el NAM desempeña un papel fundamental en la satisfacción de las necesidades energéticas del país al tiempo que defiende la seguridad, la gestión ambiental y el cumplimiento regulatorio."
 HOL_nam_groningen: "NAM Groningen"
 HOL_nam_groningen_desc: "Groningen, situado en la parte norte de los Países Bajos, es el hogar de uno de los mayores campos de gas natural de Europa. Como centro energético clave, Groningen ha sido históricamente instrumental en el suministro de gas a hogares e industrias neerlandesas. Sin embargo, las preocupaciones recientes sobre la sísmica inducida y el impacto ambiental han provocado una reducción gradual de la extracción de gas, lo que indica una transición hacia soluciones energéticas sostenibles."
 HOL_nam_waddenzee: "NAM Waddenzee"
 HOL_nam_waddenzee_desc: "El Waddenzee, Patrimonio de la Humanidad de la UNESCO, tiene potencial para la exploración del petróleo y el gas en los Países Bajos septentrionales. Equilibrando la conservación ambiental con el desarrollo de recursos, esta iniciativa tiene como objetivo desbloquear responsablemente las reservas energéticas dentro de la región de Waddenzee. Mediante una planificación cuidadosa, tecnologías avanzadas y salvaguardias ambientales, se procura aprovechar los recursos energéticos offshore salvaguardando al mismo tiempo la integridad ecológica de este entorno marino único."
 HOL_nam_drenthe_oil: "NAM Drenthe"
 HOL_nam_drenthe_oil_desc: "Drenthe Oil se refiere a la extracción y utilización de los recursos petroleros en la provincia de Drenthe, conocida por sus campos petrolíferos terrestres. Como parte de la cartera de producción de hidrocarburos de los Países Bajos, Drenthe Oil desempeña un papel en el cumplimiento de la demanda energética nacional y el apoyo a las economías locales, al tiempo que impulsa discusiones sobre estrategias de sostenibilidad ambiental y transición energética."
 HOL_nam_rotterdam: "NAM Rotterdam"
 HOL_nam_rotterdam_desc: "Rotterdam, el mayor puerto marítimo e industrial de Europa, desempeña un papel vital en el paisaje energético holandés. Como importante centro de transporte y logística, Rotterdam sirve como puerta de entrada para las importaciones de petróleo crudo, las exportaciones de productos refinados y la fabricación petroquímica. La ubicación estratégica de la ciudad, amplia infraestructura e iniciativas innovadoras lo posicionan como un actor clave en la transición energética global."
 HOL_nam_pernis_refineries: "Refinerías de Pernis"
 HOL_nam_pernis_refineries_desc: "Pernis Refineries, operado por Royal Dutch Shell, forma uno de los mayores complejos de refinación en Europa, situado cerca de Rotterdam. Con sus instalaciones avanzadas y plantas petroquímicas integradas, Pernis desempeña un papel crucial en el procesamiento del petróleo crudo en una amplia gama de productos refinados, incluyendo combustibles, lubricantes y materias primas químicas, apoyando las necesidades energéticas de la región y el desarrollo industrial."
 HOL_regio: "Economía regional"
 HOL_regio_desc: "Mientras la Randstad prospera, es crucial garantizar la prosperidad del resto de los Países Bajos. Invertir en un conjunto más diverso de regiones equilibrará el crecimiento económico y mejorará la calidad de vida en todo el país."
 HOL_dutch_agriculture: "Inversiones en agricultura holandesa"
 HOL_dutch_agriculture_desc: "Los Países Bajos se caracterizan por ser uno de los países agrícolas más eficientes y el segundo mayor exportador de productos agrícolas del mundo. Tenemos que invertir en nuestro sector para permanecer en el liderato del mundo"
 HOL_plantlab: "Creación de plantas"
 HOL_plantlab_desc: "PlantLab es una empresa de tecnología agrícola holandesa especializada en soluciones agrícolas verticales. Aprovechando técnicas avanzadas de agricultura interior, incluyendo hidropónica e iluminación LED, PlantLab revoluciona la producción de alimentos, permitiendo el cultivo durante todo el año de cultivos de alta calidad en ambientes controlados. Con énfasis en sostenibilidad y eficiencia de los recursos, PlantLab contribuye al desarrollo de la agricultura urbana y sistemas alimentarios resistentes."
 HOL_kringlooplandbouw: "Kringlooplandbouw"
 HOL_kringlooplandbouw_desc: "La agricultura circular es una forma de agricultura sostenible en la que se cierra el ciclo de sustancias. Esto significa que todas las sustancias removidas de una zona por la agricultura también se devuelven a la zona. Por lo tanto, también debe devolverse a la zona la cantidad de sustancias que salen de una zona, como los nitratos. Los recursos disponibles se utilizan lo más eficiente posible, y los agricultores tratan de equilibrar la salida y la entrada de estos recursos. Las investigaciones realizadas por la Universidad de Wageningen muestran que la agricultura circular produce concentraciones menores de nitrato en aguas subterráneas reduciendo el flujo de nitrógeno de la tierra donde se practica la agricultura."
 HOL_smart_dairy_farming: "Agricultura Dairy inteligente"
 HOL_smart_dairy_farming_desc: "Smart Dairy Farming aprovecha tecnologías digitales y soluciones basadas en datos para optimizar los procesos de producción lácteos y mejorar las prácticas de gestión agrícola. Al incorporar sensores, automatización y análisis predictivos, la agricultura láctea inteligente mejora el bienestar animal, la productividad y la sostenibilidad ambiental. Con énfasis en eficiencia e innovación, la agricultura láctea inteligente permite a los agricultores lácteos tomar decisiones informadas y alcanzar la excelencia operacional en el paisaje agrícola moderno."
 HOL_zero_dairy_farming: "Proyecto Zero Emission Dairy Farming"
 HOL_zero_dairy_farming_desc: "El proyecto Zero Emission Dairy Farming pretende reducir las emisiones de gases de efecto invernadero y el impacto ambiental en la producción láctea a través de tecnologías innovadoras y prácticas sostenibles. Mediante la implementación de sistemas de energía renovable, tecnologías de captura de metano y medidas de secuestro de carbono, el proyecto se esfuerza por lograr la neutralidad del carbono y promover métodos agrícolas resistentes al clima. Con el compromiso con la sostenibilidad y la administración, Project Zero Emission Dairy Farming allana el camino para una industria láctea más verde y sostenible."
 HOL_digital_agriculture: "Programa de agricultura digital"
 HOL_digital_agriculture_desc: "El sector agrícola está evolucionando, y es hora de llevarlo a la era digital. Mediante la implementación del Programa de Agricultura Digital, equiparemos a nuestros agricultores con tecnologías de vanguardia, como agricultura de precisión, análisis de datos y sistemas inteligentes de riego. Esta iniciativa tiene por objeto aumentar la eficiencia agrícola, reducir los desechos y promover prácticas agrícolas sostenibles. El futuro de la agricultura es digital, y este programa asegurará que nuestros agricultores dirijan el camino."
 HOL_food_valley: "Hollywood Food Valley"
 HOL_food_valley_desc: "Holland Food Valley es un importante grupo de innovación agroalimentaria en los Países Bajos, que reúne a empresas, instituciones de investigación y agencias gubernamentales para impulsar la innovación y la colaboración en la industria alimentaria. Con énfasis en investigación y desarrollo, transferencia de tecnología y acceso al mercado, Holland Food Valley acelera el desarrollo y adopción de productos alimenticios innovadores, procesos y modelos empresariales, posicionando a los Países Bajos como líder mundial en innovación agroalimentaria."
 HOL_floating_farm_project: "Proyecto de granjas flotantes"
 HOL_floating_farm_project_desc: "Inaugurado en 2019 en el Merwehaven de Rotterdam, la Granja Flotante es la primera granja láctea flotante del mundo. Sus ganados se alimentan de corrientes circulares extraídas de la ciudad, incluyendo granos de cervecería, peelings de patata y cortes de césped de parques y campos de golf, mientras que el estiércol se recicla in situ. Construido para flotar, la plataforma sirve como un cuaderno de pruebas para la producción de alimentos a base de agua en una nación delta que enfrenta mares crecientes y tierras urbanas escasas."
 HOL_stedelijke_reststromen: "Corrientes residuales urbanas"
 HOL_stedelijke_reststromen_desc: "Los municipios canalizan cortes de pasto y residuos domésticos separados a granjas cercanas, donde los digestores los convierten en biogás y el digestato restante es devuelto a los campos como compost. El acuerdo cierra el bucle nutriente y energético entre la ciudad y el campo circundante."
 HOL_boeren_en_gemeenschap: "Los agricultores y la comunidad"
 HOL_boeren_en_gemeenschap_desc: "A cambio de los recursos que salen de las ciudades, los agricultores patrocinan clubes deportivos locales y asociaciones de aldea. Esto profundiza el vínculo entre la economía rural y la vida municipal, reforzando el apoyo al sector agrícola."
 HOL_enpower_gedeputeerde_staten: "Enpower Gedeputeerde Staten"
 HOL_enpower_gedeputeerde_staten_desc: "Aumentar la autonomía y los recursos de los gobiernos regionales (Gedeputeerde Staten) permite políticas locales más adaptadas y eficaces."
 HOL_lelystad_airport: "Creación del aeropuerto de Lelystad"
 HOL_lelystad_airport_desc: "El proyecto de ampliación del aeropuerto de Lelystad tiene como objetivo aliviar la congestión en el aeropuerto de Schiphol aumentando la capacidad y mejorando las instalaciones en Lelystad. Esto incluye la ampliación de las pistas, el mejoramiento de las terminales y la mejora de los servicios de pasajeros. Se espera que el proyecto aumente la conectividad regional, el turismo y el crecimiento económico en Flevoland y las zonas circundantes."
 HOL_provincial_railways: "Inversiones de ferrocarriles provinciales"
 HOL_provincial_railways_desc: "El proyecto ferroviario provincial incluye iniciativas como el Lelylijn, Wunderline y el Tren de Tres País para mejorar la conectividad regional y transfronteriza. El Lelylijn propone un enlace ferroviario de alta velocidad entre las provincias del norte y el Randstad. El Wunderline mejora los servicios ferroviarios entre Groningen y Bremen, Alemania, mientras que el Tren de Tres País mejora la conectividad ferroviaria entre Holanda §Y[BEL.GetNameWithFlag]§! y Alemania."
 HOL_eindhoven_brainport: "Eindhoven Brainport"
 HOL_eindhoven_brainport_desc: "El proyecto Eindhoven Brainport transforma a Eindhoven en un importante centro de tecnología e innovación. Al fomentar las industrias de alta tecnología, apoyar las instituciones de investigación y alentar a las startups, esta iniciativa tiene como objetivo impulsar los avances tecnológicos y el crecimiento económico en la región."
 HOL_balanced_national_development: "Desarrollo nacional equilibrado"
 HOL_balanced_national_development_desc: "Con el regio que ahora prospera, buscamos asegurar un desarrollo nacional equilibrado. Los esfuerzos de coordinación entre el Randstad y el regio lograrán un crecimiento sostenible y equitativo en todo el país. Esto incluye políticas e inversiones para integrar las actividades económicas y el desarrollo de la infraestructura."
 HOL_diversify_groningen_economy: "Diversificar Groningen Economy"
 HOL_diversify_groningen_economy_desc: "Tras el cese de la extracción de gas natural en Groningen debido a los riesgos sísmicos, los esfuerzos se centran en diversificar la economía de la región. Esto incluye la inversión en energía renovable, sectores tecnológicos y agricultura sostenible."
 HOL_landbouwregio: "Landbouwregio van de 21ste Eeuw"
 HOL_landbouwregio_desc: "La transformación de las regiones agrícolas en el siglo XXI implica la adopción de tecnologías agrícolas avanzadas y prácticas sostenibles. Esta iniciativa se centra en la modernización de las técnicas agrícolas, el mejoramiento de la logística de la cadena de suministro y la promoción de prácticas ecológicamente racionales."
 HOL_health_houses: "Salud Casas"
 HOL_health_houses_desc: "La iniciativa Health Houses tiene como objetivo establecer centros sanitarios integrados en toda la región, proporcionando servicios médicos integrales y promoviendo la salud pública. Estos centros ofrecerán atención primaria, tratamientos especializados y programas de bienestar bajo un mismo techo, mejorando el acceso a la salud y mejorando la calidad de vida de los residentes."
 HOL_dutch_economic_landscape: "Economía de tres kilómetros"
 HOL_dutch_economic_landscape_desc: "La economía holandesa se encuentra en tres pilares fundamentales: el comercio internacional, la agricultura avanzada y un sector de servicios integrado a nivel mundial. Con puertos de clase mundial, agronegocios innovadores y una posición dominante en finanzas y logística, los Países Bajos golpean mucho por encima de su tamaño. Este modelo equilibrado impulsa el crecimiento y la resiliencia, aunque sigue siendo sensible a las perturbaciones mundiales y los cambios políticos."
 HOL_randstad: "Randstad"
 HOL_randstad_desc: "El Randstad, formado por grandes ciudades como Amsterdam, Rotterdam, La Haya y Utrecht, es la central económica de los Países Bajos. Al invertir en infraestructura y desarrollo de negocios, buscamos mejorar aún más su papel como motor económico del país."
 HOL_zuidas_development: "Desarrollo Zuidas"
 HOL_zuidas_development_desc: "El distrito de Zuidas en Amsterdam es un centro financiero clave. Ampliar su capacidad y mejorar las instalaciones atraerá más empresas internacionales y consolidará su condición de centro financiero mundial."
 HOL_randstad_rail: "Carril Randstad"
 HOL_randstad_rail_desc: "El proyecto RandstadRail conecta La Haya, Rotterdam y Zoetermeer a través de una eficiente red de ferrocarriles ligeros. Mejorar esta red mejorará la conectividad regional."
 HOL_smart_city_initiative: "Iniciativa de ciudades inteligentes"
 HOL_smart_city_initiative_desc: "Invertir en tecnologías de ciudades inteligentes en todo el Randstad hará que nuestras ciudades sean más eficientes, sostenibles y atractivas tanto para empresas como para residentes."
 HOL_international_peace_city: "Ciudad Internacional de la Paz & Justicia"
 HOL_international_peace_city_desc: "Utilizando el estatus de La Haya como Ciudad Internacional de la Paz y la Justicia, fortaleceremos los vínculos diplomáticos y potenciaremos nuestra influencia mundial al acoger organizaciones y eventos internacionales."
 HOL_randpowerhouse: "Randpowerhouse"
 HOL_randpowerhouse_desc: "A través de años de inversiones estratégicas y planificación visionaria, la región Randstad se ha transformado con éxito en el 'Randpowerhouse', el motor económico dinámico de los Países Bajos. Al mejorar la infraestructura, fomentar la innovación y mejorar la conectividad entre Amsterdam, Rotterdam, La Haya y Utrecht, la región se encuentra ahora como líder mundial en comercio, cultura y tecnología. Esta transformación no sólo ha reforzado la producción económica de la Randstad, sino que también ha solidificado la posición de los Países Bajos como un actor clave en el escenario europeo, impulsando el crecimiento nacional y estableciendo nuevos estándares para el desarrollo urbano."
 HOL_dutch_industry: "Industria holandesa"
 HOL_dutch_industry_desc: "La industria holandesa encarna el legado holandés de innovación y excelencia en diversos sectores. Con especial atención a la sostenibilidad, la tecnología y la competitividad mundial, la industria neerlandesa sigue siendo la primera en impulsar el crecimiento económico y la prosperidad."
 HOL_postbank_fusion: "Fusión posbanca"
 HOL_postbank_fusion_desc: "La fusión de Postbank y ING representa un hito en la historia bancaria holandesa, consolidando dos importantes instituciones financieras en una sola entidad. Esta fusión fortalece la posición de ING como un banco mundial líder, ofreciendo servicios mejorados y soluciones financieras a clientes de todo el mundo."
 HOL_randstad_takeovers: "Randstad Takeovers"
 HOL_randstad_takeovers_desc: "Randstad Takeovers demuestra la expansión estratégica de las empresas holandesas y las ambiciones globales en la industria de dotación de personal y contratación. Al adquirir actores claves en el mercado, Randstad refuerza su posición como líder en soluciones de recursos humanos a escala global."
 HOL_ing_group_strategy: "Estrategias de expansión del Grupo iNG"
 HOL_ing_group_strategy_desc: "ING Group Strategy describe la visión del banco para el crecimiento sostenible y la transformación digital en el sector financiero. Al abrazar la innovación y las soluciones centradas en el cliente, ING reafirma su compromiso de impulsar cambios positivos y ofrecer valor a los interesados."
 HOL_adyen_fintech_hub: "Adyen y el Centro Fintech"
 HOL_adyen_fintech_hub_desc: "Adyen, el procesador de pagos basado en Amsterdam fundado en 2006, se convirtió en una de las firmas de tecnología fina más grandes de Europa manejando transacciones para comerciantes globales que van desde Netflix a Spotify. Su éxito posiciona a los Países Bajos como los pagos digitales y el capital financiero del continente, llevando inversiones y empleos de servicios de alto valor a la Randstad."
 HOL_pension_fund_reform: "Reforma de la Caja"
 HOL_pension_fund_reform_desc: "ABP y PFZW se encuentran entre los mayores fondos de pensiones del mundo, dando a capital holandés un enorme alcance global por medio de apuestas en acciones, infraestructura y bienes raíces en todo el mundo. La Ley de pensiones futuras de 2023 (Wet toekomst pensioenen) desplaza el sistema de esquemas definidos en función de los esquemas de distribución definida, redefinindo cómo se asigna este vasto grupo e invierte en las próximas décadas."
 HOL_booking_digital_services: "Economía de Servicios Digitales"
 HOL_booking_digital_services_desc: "Booking.com, la agencia de viajes online más grande del mundo, tiene su sede en Amsterdam junto con firmas como Just Eat Takeaway y TomTom, anclando un sector de plataformas y servicios digitales de profundidad inusual para un país de este tamaño. Este grupo atrae el talento internacional y las reubicaciones corporativas a Randstad, consolidando a los Países Bajos como un centro para la sede tecnológica europea."
 HOL_spring_global_mail: "Ampliación del correo mundial de primavera"
 HOL_spring_global_mail_desc: "Spring Global Mail representa la experiencia holandesa en soluciones internacionales de correo y logística. Mediante la prestación de servicios postales eficientes y fiables en todo el mundo, Spring Global Mail facilita el comercio mundial y la comunicación, conectando empresas y consumidores a través de las fronteras."
 HOL_tata_steel_development: "Desarrollo de acero Tata"
 HOL_tata_steel_development_desc: "Tata Steel Development marca una inversión significativa en la fabricación holandesa, asegurando el crecimiento y competitividad continuos de la industria del acero. Esta iniciativa subraya el compromiso de Tata Steel con la innovación y la sostenibilidad, fortaleciendo su presencia en el mercado holandés."
 HOL_project_beethoven: "Proyecto Beethoven"
 HOL_project_beethoven_desc: "Con un enfoque en el fortalecimiento del crecimiento del sector tecnológico dentro de los Países Bajos, el Proyecto Beethoven emerge como una respuesta estratégica a las preocupaciones planteadas por los líderes de la industria, incluyendo ASML, respecto al clima de inversión del país. Esta iniciativa ambiciosa, respaldada por una importante inversión gubernamental de más de 2,5 mil millones de euros, tiene como objetivo cultivar un entorno propicio para la expansión nacional para gigantes tecnológicos como ASML, reforzando la posición de la nación como centro global de innovación."
 HOL_phillips_healthcare_expansion: "Phils Healthcare Expansion"
 HOL_phillips_healthcare_expansion_desc: "Philips Healthcare Expansion refleja el liderazgo de Holanda en tecnología e innovación sanitaria. Al ampliar su cartera de salud, Philips reafirma su compromiso de mejorar los resultados del paciente y promover soluciones médicas en todo el mundo."
 HOL_south_dakota: "DSM Factories en Dakota del Sur"
 HOL_south_dakota_desc: "DSM Bio-Ethanol Factories in South Dakota signify Dutch leadership in sustainable energy solutions. Al invertir en la producción de bioetanol, el DSM contribuye a reducir las emisiones de carbono y promover fuentes de energía renovable a escala mundial."
 HOL_dutch_legends: "Dutch Legends"
 HOL_dutch_legends_desc: "A lo largo de la historia, los Países Bajos han cultivado un legendario legado, mezclando cuentos de dominio del agua con narrativas del comercio marítimo. De las legendarias hazañas de ingenieros holandeses que reclaman tierra desde el mar hasta los atrevidos exploits de mercaderes holandeses navegando por aguas distantes, estas leyendas entrelazan la resistencia, el ingenio y la prosperidad."
 HOL_trade_infrastructure: "Modernizar la infraestructura comercial"
 HOL_trade_infrastructure_desc: "Los Países Bajos cuentan con una infraestructura comercial muy ajustada, que combina puertos, canales y carreteras para crear una red de comercio sin problemas. Sin embargo, a medida que el comercio mundial evoluciona y aumenta las exigencias, esta infraestructura requiere la modernización para mantener su ventaja competitiva. Invertir en tecnologías de vanguardia y mejorar las rutas de transporte asegurará que los Países Bajos sigan siendo un actor clave en el comercio internacional durante decenios por venir."
 HOL_maasvlakte2: "Build Maasvlakte 2"
 HOL_maasvlakte2_desc: "Los Países Bajos emprenden el ambicioso proyecto Maasvlakte 2, reclamando tierras del mar para ampliar las instalaciones portuarias y estimular el crecimiento económico, haciendo eco de la histórica maestría del país en gestión e ingeniería del agua."
 HOL_european_railway_development: "Europeann Railway Developments"
 HOL_european_railway_development_desc: "Basándose en su legado de infraestructura de transporte innovadora, los Países Bajos lideran la evolución ferroviaria europea, fomentando la conectividad, el comercio y la movilidad en todo el continente a través de su red ferroviaria avanzada."
 HOL_green_harbor_amsterdam: "Verde puerto de Amsterdam"
 HOL_green_harbor_amsterdam_desc: "Amsterdam transforma su puerto en un centro sostenible, que abarca prácticas ecológicas e iniciativas de energía renovable, demostrando el compromiso holandés con la gestión ambiental y la innovación marítima."
 HOL_nederland_maritiem_land: "Tierra de Maritiem de Nederland Stichting"
 HOL_nederland_maritiem_land_desc: "El establecimiento de Stichting Nederland Maritiem Land pone de relieve el patrimonio marítimo y el liderazgo industrial de los Países Bajos, promoviendo la colaboración y el avance dentro del sector marítimo para garantizar su prosperidad continua y competitividad mundial."
 HOL_schiphol_expansion: "Expansión de Schiphol"
 HOL_schiphol_expansion_desc: "Schiphol Expansion marca un momento crucial en la aviación holandesa, impulsando el aeropuerto de Amsterdam a la vanguardia de los viajes globales. Mediante el aumento de la capacidad y la mejora de la experiencia de los pasajeros, esta expansión pone de relieve el compromiso de los Países Bajos con la eficiencia del viaje aéreo y la conectividad."
 HOL_digital_customs: "Aduanas digitales"
 HOL_digital_customs_desc: "Digital Customs revoluciona las operaciones comerciales holandesas, racionalizando los procesos y mejorando la eficiencia mediante soluciones digitales innovadoras. Esta iniciativa epitomiza el abrazo de los Países Bajos del avance tecnológico para reforzar su posición como centro comercial global."
 HOL_daf_investments: "Invertir en DAF"
 HOL_daf_investments_desc: "DAF Investments significa el compromiso de la industria automotriz holandesa con la innovación y el crecimiento. A través de inversiones estratégicas y avances tecnológicos, el DAF refuerza su posición como fabricante líder de vehículos comerciales, impulsando la proeza industrial holandesa."
 HOL_rijkswaterstaat: "Rijkswaterstaat"
 HOL_rijkswaterstaat_desc: "Rijkswaterstaat, la agencia del gobierno holandés responsable de la gestión e infraestructura del agua, desempeña un papel fundamental en la configuración del paisaje acuático de la nación, supervisando el mantenimiento de vías fluviales, diques y defensas de inundaciones, salvaguardando a los Países Bajos contra la amenaza de inundación y asegurando el uso eficiente y sostenible de los recursos hídricos."
 HOL_deltawerken_modernization: "Modernización de Deltawerken"
 HOL_deltawerken_modernization_desc: "Los Países Bajos modernizan su icónica Deltawerken, reforzando las defensas costeras y adaptándose a los crecientes niveles del mar y a los cambiantes patrones climáticos, garantizando una protección continua contra las inundaciones y salvaguardando la costa holandesa para las generaciones futuras."
 HOL_ruimte_voor_de_rivier: "Ruimte voor de Rivier"
 HOL_ruimte_voor_de_rivier_desc: "Mediante un enfoque proactivo de la gestión del riesgo de inundaciones, los Países Bajos ejecutan el proyecto Room for the River, creando espacio a lo largo de las riberas del río para dar cabida a las oleadas de agua y proteger las zonas urbanas, mostrando el ingenio neerlandés en la planificación urbana centrada en el agua."
 HOL_green_water_city_building: "Verde Water City Building"
 HOL_green_water_city_building_desc: "Abrazando una visión del desarrollo urbano sostenible, los Países Bajos lideran las iniciativas de Green Water City Building, integrando principios de diseño sensibles al agua y soluciones basadas en la naturaleza en proyectos de planificación urbana e infraestructura para crear ciudades resilientes y habitables que armonicen con el medio ambiente natural, incorporando el compromiso holandés con el crecimiento verde y la gestión ambiental."
 HOL_dutch_water_sector: "Sector holandés del agua"
 HOL_dutch_water_sector_desc: "El sector hídrico holandés prospera como líder mundial en gestión e innovación del agua, aprovechando siglos de experiencia en control de inundaciones, defensa costera y gestión de recursos hídricos para hacer frente a los retos acuciantes del agua en todo el mundo, ejemplificando la ingenio y el compromiso neerlandeses con el desarrollo sostenible."
 HOL_hollandse_kust_windfarm: "Construye Hollandse Kust"
 HOL_hollandse_kust_windfarm_desc: "Los Países Bajos adelantan su agenda de energía renovable con el desarrollo de la zona agrícola Hollandse Kust Wind, aprovechando la energía eólica para impulsar el crecimiento económico sostenible y reducir las emisiones de carbono, alineando con los esfuerzos neerlandeses por combatir el cambio climático y promover soluciones de energía ecológica."
 HOL_aquatech_amsterdam: "Organiza Aquatech Amsterdam"
 HOL_aquatech_amsterdam_desc: "Aquatech Amsterdam es un evento líder en tecnología de agua, reuniendo pioneros y expertos de la industria para explorar innovaciones en gestión del agua y sostenibilidad. A través de exposiciones y redes, fomenta la colaboración y impulsa el progreso hacia un futuro más seguro para el agua."
 HOL_dredging_industry: "Industria holandesa de dragado"
 HOL_dredging_industry_desc: "Boskalis, Van Oord y Royal IHC juntos hacen de los Países Bajos el líder mundial indiscutible en dragado e ingeniería marítima. Sus contratos globales para profundizar puertos, excavar canales de navegación y ejecutar proyectos de regeneración exportan conocimientos especializados holandeses y generan ganancias extranjeras sustanciales, sosteniendo miles de empleos cualificados en el hogar."
 HOL_van_oord_offshore: "Instalación de viento offshore"
 HOL_van_oord_offshore_desc: "Los buques especializados de instalación holandeses construyen las turbinas de los parques eólicos del Mar del Norte frente a las costas Hollandse Kust y Borssele, combinando la capacidad nacional de construcción naval con experiencia en construcción offshore. La misma flota que construye capacidad para la transición energética holandesa también sirve al mercado de viento offshore en rápida expansión de Europa, asegurando ingresos contractuales a largo plazo."
 HOL_global_land_reclamation: "Reclamación mundial de tierras"
 HOL_global_land_reclamation_desc: "Los contratistas holandeses exportan su dominio sobre la tierra y la defensa costera en todo el mundo, entregando islas artificiales, expansiones portuarias y obras de protección contra inundaciones del Oriente Medio al Sudeste Asiático. Centurias de retener el mar se han convertido en un servicio de ingeniería premium, y las empresas que lo llevan al extranjero representan algunas de las exportaciones industriales más distintivas de los Países Bajos."
 HOL_form_nso: "Organización espacial de los Países Bajos"
 HOL_form_nso_desc: "Un organismo espacial nacional permitirá a los Países Bajos consolidar sus actividades de investigación, desarrollo y exploración bajo una estructura unificada. La formación de la NSO garantizará la inversión a largo plazo en viajes espaciales, tecnología satelital y futuras misiones interplanetarias."
 HOL_ijstad_mission: "Construye IJStad"
 HOL_ijstad_mission_desc: "IJStad es una ciudad en una isla artificial planificada en el IJmeer, justo al este de Ámsterdam, concebida como la continuación moderna de la tradición neerlandesa de ganar terreno al mar. La nueva isla albergaría unas 45 000 viviendas, aliviaría la escasez de vivienda del Randstad y demostraría que los Países Bajos aún pueden crear tierra nueva a partir del agua abierta. Se espera que la construcción tome unos tres años y remodelará la región de Holanda Occidental en torno a Ámsterdam, con capacidad industrial y oficinas junto a los nuevos distritos residenciales."
 HOL_mars_colony_mission: "Establecer la colonia de Marte"
 HOL_mars_colony_mission_desc: "Con la capacidad de lanzamiento asegurada y una corriente constante de reclutas y equipo que sale de los Países Bajos, el largo esfuerzo por aterrizar y mantener a los colonos holandeses en Marte entra ahora en su fase final. Los hábitats, los sistemas de soporte vital y las primeras estructuras permanentes deben reunirse a través de millones de kilómetros de espacio vacío. Cuando la colonia esté lista, sus fundadores le darán un nombre extraído de las leyendas de la patria que dejaron atrás."
 HOL_mars_colony1: "Hollanderhaven"
 HOL_mars_colony1_desc: "La colonia toma su nombre de De Vliegende Hollander, el Holandés Volador, el maldito capitán mercante condenado a navegar por los mares para siempre sin hacer puerto. Fitablemente, Hollanderhaven se convierte en el corazón comercial de la colonia, un puesto comercial sobre un nuevo mundo construido por descendientes de una nación marinera. Sus administradores canalizan el viejo instinto VOC para obtener ganancias en la frontera marciana."
 HOL_mars_colony2: "Brinkerdam"
 HOL_mars_colony2_desc: "Brinkerdam honra a Hans Brinker, el chico de la leyenda que retenía el mar enchufando un dique fugaz con su dedo por la noche. El asentamiento se especializa en las paredes de presión, cúpulas selladas e hidroingeniería que mantienen la colonia habitable contra el ambiente marciano hostil. La misma disciplina que construyó los Deltaworks ahora mantiene el vacío a raya."
 HOL_mars_colony3: "Brandaanstad"
 HOL_mars_colony3_desc: "Nombrada para Sint-Brandaan, el viajero medieval cuyo legendario viaje lo llevó al borde del mundo conocido, Brandaanstad es el centro de aprendizaje e investigación de la colonia. Sus laboratorios aprovechan el patrimonio de TU Delft y ESTEC, empujando las fronteras de la ciencia planetaria. La ciudad encarna la curiosidad que primero envió a los holandeses más allá del horizonte."
 HOL_mars_colony4: "Brammertdelf"
 HOL_mars_colony4_desc: "Brammertdelf recuerda a Ellert en Brammert, los dos gigantes y hombres de carretera que una vez persiguieron la tierra firme de Drenthe. El asentamiento ancla la industria minera y de extracción de la colonia, desgarrando el mineral y los volatiles de la corteza marciana. Al igual que sus gigantes de los nombres, vive fuera de la tierra que reclama, abasteciendo las materias primas que sostienen toda la colonia."
 HOL_commissariaat_militaire_productie: "Commissariaat Militaire Productie"
 HOL_commissariaat_militaire_productie_desc: "El Commissariaat Militaire Productie se centra en coordinar y mejorar las capacidades de producción militar en los Países Bajos. Esta iniciativa tiene como objetivo simplificar los procesos de adquisición, fomentar las industrias nacionales de defensa y asegurar un suministro constante de equipos militares avanzados."
 HOL_dutch_defense_doctrine: "Nederlandse Defensie doctrina"
 HOL_dutch_defense_doctrine_desc: "La Doctrina de Defensa holandesa sienta las bases para la dirección estratégica y los principios operacionales de las Fuerzas Armadas Holandesas. Esta doctrina hace hincapié en la agilidad, el poder de fuego y la cooperación, asegurando que nuestros militares estén preparados para defender los intereses nacionales, apoyar a los aliados y responder a las crisis mundiales."
 HOL_authority_in_information: "Autoridad en Información"
 HOL_authority_in_information_desc: "Establecer una posición de información autorizada es clave para mantener una ventaja estratégica. Esto implica mejorar la capacidad de inteligencia, vigilancia y reconocimiento para reunir y procesar información crítica eficientemente."
 HOL_integrated_actions: "Medidas integradas"
 HOL_integrated_actions_desc: "Las acciones integradas en los dominios terrestres, marítimos, aéreos, cibernéticos y espaciales garantizan capacidades integrales de defensa. Este enfoque promueve una coordinación sin fisuras y operaciones conjuntas para aumentar la eficacia militar general."
 HOL_information_based: "Información basada"
 HOL_information_based_desc: "Un enfoque basado en la información aumenta la adopción de decisiones y la eficacia operacional. Al invertir en la capacidad de inteligencia, vigilancia y reconocimiento, los Países Bajos aseguran que pueda responder con rapidez y eficacia a las amenazas emergentes."
 HOL_increase_strategic_capacity: "Aumento de la capacidad estratégica"
 HOL_increase_strategic_capacity_desc: "El aumento de nuestra capacidad estratégica es esencial para hacer frente a los retos futuros. Esto implica desarrollar capacidades para el transporte estratégico, la defensa cibernética y las operaciones espaciales, asegurando que los Países Bajos puedan proyectar el poder e influir globalmente."
 HOL_dutch_specialism: "Dutch Specialism"
 HOL_dutch_specialism_desc: "Para fortalecer nuestro papel dentro de la OTAN, los Países Bajos desarrollarán capacidades especializadas que complementen las necesidades de la alianza. Esto incluye experiencia en operaciones anfibias, defensa aérea y fuerzas de despliegue rápido."
 HOL_invest_in_europe: "Invertir en Defensa en Europa"
 HOL_invest_in_europe_desc: "Invertir en las capacidades de defensa de Europa garantiza un continente más fuerte y resiliente. Los Países Bajos aumentarán las contribuciones a iniciativas europeas de defensa, mejorando la cooperación e interoperabilidad con los Estados miembros de la UE."
 HOL_military_society: "Campaña de la sociedad militar"
 HOL_military_society_desc: "La construcción de una fuerte conexión entre el ejército y la sociedad es crucial. Este enfoque incluye iniciativas para aumentar el compromiso público, apoyar a los veteranos y fomentar una cultura de conciencia en defensa."
 HOL_reliable_partner: "Socio holandés confiable"
 HOL_reliable_partner_desc: "Como socio y protector confiable, los Países Bajos garantizarán la seguridad de sus aliados y contribuirán a la estabilidad internacional. Esto implica la participación activa en las misiones de la OTAN y la UE y el mantenimiento de la disposición para proteger los intereses nacionales y aliados."
 HOL_unique_people: "Personal único holandés"
 HOL_unique_people_desc: "Reconocer y desarrollar las habilidades únicas de nuestro personal es vital, lo que hace hincapié en la formación avanzada, la educación y el desarrollo profesional para asegurar que las fuerzas armadas tengan individuos altamente cualificados y motivados."
 HOL_flexible_operations: "Operaciones flexibles"
 HOL_flexible_operations_desc: "Para seguir siendo ágil y escalable, las fuerzas armadas deben poder responder rápidamente a las circunstancias cambiantes. Esto incluye el desarrollo de fuerzas de reacción rápida y la mejora de la movilidad de las tropas para adaptarse rápidamente a diversos escenarios de amenazas."
 HOL_innovative_capacity: "Capacidad innovadora"
 HOL_innovative_capacity_desc: "Es esencial invertir en investigación y desarrollo para mantener una fuerte capacidad innovadora. Esto implica adoptar tecnologías de vanguardia y fomentar una cultura de innovación para mantenerse por delante de posibles adversarios."
 HOL_escalation_dominance: "Mejora de la escalada"
 HOL_escalation_dominance_desc: "Para lograr el dominio de la escalada es necesario contar con capacidades militares superiores y sólidas alianzas estratégicas. Esto garantiza que las fuerzas armadas puedan disuadir y responder eficazmente a los conflictos en cualquier nivel."
 HOL_defensievisie_completed: "Defensievisie terminó"
 HOL_defensievisie_completed_desc: "Con la finalización exitosa de la Doctrina de Defensa holandesa, las Fuerzas Armadas Neerlandesas han sufrido una notable transformación. Modernizado, resistente y equipado con tecnología de última generación, los militares están listos para enfrentar los desafíos del futuro. Este hito refleja la dedicación y el arduo trabajo de nuestro personal, que ha acogido la innovación, fortalecido las asociaciones internacionales y una mayor disponibilidad operacional"
 HOL_koninklijke_luchtmacht: "Parvus Numero, Magnus Merito"
 HOL_koninklijke_luchtmacht_desc: "Abraza el lema Parvus numero, magnus merito (pequeño en número, gran en mérito) centrándose en maximizar la eficiencia y eficacia de la Fuerza Aérea Holandesa. Esto implica optimizar los programas de capacitación, mejorar los procedimientos de mantenimiento y aprovechar la tecnología avanzada para garantizar que todos los aviones y aeroportistas contribuyan significativamente a la misión."
 HOL_join_jsf: "Únete al programa JSF"
 HOL_join_jsf_desc: "La participación de los Países Bajos en el programa de luchadores conjuntos (JSF) implica la adquisición de aviones F-35 Lightning II. Este enfoque asegura que la Fuerza Aérea holandesa esté equipada con luchadores de última generación, potenciando la superioridad del aire y las capacidades de huelga."
 HOL_join_eurofighter_project: "Únase al proyecto Eurofighter"
 HOL_join_eurofighter_project_desc: "Al unirse al proyecto Eurofighter Typhoon, los Países Bajos invierten en un avión de combate multirole muy avanzado. Este enfoque mejora las capacidades de la Fuerza Aérea holandesa en combate aéreo, ataque terrestre y misiones de reconocimiento."
 HOL_buy_saab_jas39: "Buy Saab JAS39"
 HOL_buy_saab_jas39_desc: "La adquisición de cazas Saab JAS39 Gripen proporciona a la Fuerza Aérea Neerlandesa una aeronave multirregular versátil y rentable. Este enfoque aumenta las capacidades de defensa aérea, apoyo terrestre y reconocimiento, garantizando la flexibilidad operativa."
 HOL_buy_mq9_reaper: "Buy MQ-9 Reaper"
 HOL_buy_mq9_reaper_desc: "Invertir en drones Reaper MQ-9 mejora las capacidades de reconocimiento y huelga de la Fuerza Aérea holandesa. Estos vehículos aéreos no tripulados (UAV) ofrecen opciones de inteligencia, vigilancia y huelga de precisión en tiempo real, lo que aumenta considerablemente la eficacia operacional."
 HOL_defensie_helikopter_commando: "Defensie Helikopter Commando creación"
 HOL_defensie_helikopter_commando_desc: "El Defensie Helikopter Commando (DHC) supervisa las operaciones de todos los helicópteros militares dentro de las Fuerzas Armadas Holandesas. Este objetivo es mejorar las capacidades, la capacitación y la coordinación de la flota de helicópteros, prestando apoyo tanto a misiones nacionales como internacionales."
 HOL_ch47d_modernization: "CH-47D Modernization"
 HOL_ch47d_modernization_desc: "La modernización de los helicópteros CH-47D Chinook implica la mejora de aviónicos, motores y sistemas de carga. Este objetivo asegura que estos helicópteros elevadores sigan siendo efectivos y fiables para las misiones de transporte, medevac y apoyo."
 HOL_ah46d_upgrade: "AH-64D Upgrade"
 HOL_ah46d_upgrade_desc: "Mejorar los helicópteros de ataque AH-64D Apache incluye mejorar sus aviónicos, sistemas de armas y supervivencia. Este enfoque aumenta las capacidades de combate de la Fuerza Aérea Neerlandesa, asegurando que estos helicópteros puedan realizar eficazmente un apoyo aéreo estrecho y misiones antiaéreas."
 HOL_air_mobility_command: "Movilidad aérea y comando Sustainment"
 HOL_air_mobility_command_desc: "Establezca un comando nacional para dirigir la movilidad aérea, la logística y la preparación de combate independiente de los arreglos aliados. Al centralizar el mantenimiento bajo control holandés, la Fuerza Aérea puede generar incursiones y mantener su flota sin depender del apoyo de los socios."
 HOL_woensdrecht_mro: "Woensdrecht Logistics y F135 Engine Hub"
 HOL_woensdrecht_mro_desc: "Logistics Center Woensdrecht acoge la instalación regional de mantenimiento, reparación y cambio para el motor F135 que potencia el F-35. Invertir en el depósito convierte a los Países Bajos en un centro de apoyo para las flotas aliadas, manteniendo al mismo tiempo su propia misión aérea y reduciendo la dependencia del servicio exterior."
 HOL_expand_fighter_fleet: "Ampliar la Flota de Combatientes"
 HOL_expand_fighter_fleet_desc: "Ordene un tramo adicional de luchadores multiroleros para traer escuadrones a toda fuerza. La flota ampliada restablece la capacidad de despliegue y da a la Fuerza Aérea la masa necesaria para mantener tanto la policía aérea como los compromisos expedicionarios nacionales."
 HOL_expand_fighter_fleet_idea: "Flota de combate ampliada"
 HOL_expand_fighter_fleet_idea_desc: "Un empuje acelerado de adquisición mantiene las líneas de producción de luchadores funcionando calientes, disminuyendo el costo unitario de los nuevos marcos aéreos mientras se entrega el tramo."
 HOL_frisian_flag_training: "Programa de Ejercicio de Bandera Frisia"
 HOL_frisian_flag_training_desc: "Con sede en la Base Aérea de Leeuwarden, el ejercicio anual de la Bandera Frisiana reúne fuerzas aéreas aliadas para entrenamiento de combate a gran escala sobre el Mar del Norte. Un programa de entrenamiento permanente agudiza la competencia piloto y acelera la experiencia del nuevo aircrew."
 HOL_precision_munitions: "Integración de Municiones de Precisión"
 HOL_precision_munitions_desc: "Integrar armas guiadas como la Bomba de Diámetro Pequeño GBU-39, AIM-120 AMRAAM y el misil Meteor sobre la flota de combatientes. Una suite moderna de armas amplía el alcance y la letalidad, asegurando que los aviones holandeses puedan atacar con precisión en el espacio aéreo impugnado."
 HOL_sovereign_air_operations: "Soberanas operaciones aéreas"
 HOL_sovereign_air_operations_desc: "Consolidar la flota, las armas y el aeródromo entrenado en un brazo aéreo autosuficiente capaz de llevar a cabo operaciones sostenidas en sus propios términos. Los Países Bajos pueden ahora mantener su espacio aéreo y proyectar energía aérea sin depender de ningún socio."
 HOL_commando_landstrijdkrachten: "Establecer Commando Landstrijdkrachten"
 HOL_commando_landstrijdkrachten_desc: "La creación del Commando Landstrijdkrachten (CLAS) en 2005 marcó una reorganización significativa del ejército holandés. Esta estructura central de mando tenía por objeto aumentar la eficiencia operacional y simplificar los procesos de adopción de decisiones. Al consolidar diversos componentes del ejército bajo un mando, los Países Bajos aseguraron una mejor coordinación y disposición de sus fuerzas terrestres."
 HOL_jistarc: "Establecimiento de JISTARC"
 HOL_jistarc_desc: "Se estableció el Comando Conjunto de Inteligencia, Vigilancia, Adquisición de Metas y Reconocimiento (JISTARC) para integrar y mejorar las capacidades de inteligencia del Ejército Holandés. Esta dependencia combina diversas funciones de inteligencia para dar una amplia conciencia y apoyo a las operaciones. JISTARC mejora la eficacia de las misiones de reconocimiento y vigilancia, garantizando información precisa y oportuna para las decisiones tácticas."
 HOL_dglc: "DGLC Reorganisation"
 HOL_dglc_desc: "La Defensie Grondgebonden Luchtverdedigingscommando (DGLC) es responsable de la defensa aérea terrestre. Mejorar las capacidades de DGLC implica mejorar los sistemas de misiles y la tecnología de radar para proteger contra amenazas aéreas. Este enfoque asegura que el Ejército holandés pueda defender eficazmente sus activos y territorios de los ataques aéreos."
 HOL_vuursteun_commando: "VuursteunCommando Despliegue"
 HOL_vuursteun_commando_desc: "El VuursteunCommando (Manda de Apoyo a la Fire) integra elementos de artillería y apoyo contra incendios para proporcionar potencia de fuego coordinada para el ejército holandés. Este enfoque incluye la modernización de los sistemas de artillería y la mejora de la precisión de los objetivos. El aumento de la capacidad de apoyo a los incendios aumenta la eficacia de las operaciones terrestres y garantiza una fuerza de fuego precisa y oportuna."
 HOL_supply_command: "Bevoorradings- en Transportcommando"
 HOL_supply_command_desc: "El Bevoorradings- en Transportcommando (Comandancia de Suministros y Transporte) es crucial para garantizar el apoyo logístico y la movilidad del Ejército Holandés. Este objetivo es mejorar las cadenas de suministro, los vehículos de transporte y la infraestructura para aumentar la disponibilidad operacional y eficiencia del ejército."
 HOL_military_production_investments: "Invertir en la industria de defensa holandesa"
 HOL_military_production_investments_desc: "El sector de defensa holandés ha visto importantes inversiones en los últimos años, desde proyectos como el desarrollo del F-35 hasta la modernización de buques navales como las fragatas de clase Zeven Provinciën. Al optar por seguir invirtiendo en la industria de defensa nacional, podemos impulsar la innovación tecnológica, mejorar la autosuficiencia y asegurar que nuestras fuerzas armadas permanezcan equipadas con hardware militar de última generación. Esta decisión fortalecerá la seguridad nacional y contribuirá al crecimiento de una sólida economía de defensa."
 HOL_defense_industrial_base: "Fortalecer la Base Industrial de Defensa"
 HOL_defense_industrial_base_desc: "Las empresas neerlandesas suministran componentes críticos a los programas de armas aliadas, pero la capacidad de montaje nacional está retrasada. Al ampliar la construcción de fábricas de armas y anclar la producción final en casa, convertimos una red de subcontratistas en una verdadera base industrial nacional."
 HOL_modernize_arms_production: "Modernizar las líneas de producción de armas"
 HOL_modernize_arms_production_desc: "Las herramientas anticuadas frenan la ampliación de las nuevas órdenes de equipo. Invertir en la automatización liderada por Thales y en las modernas líneas de producción permite que nuestras fábricas militares alcancen un rendimiento completo más rápido, acortando los plazos de entrega para las fuerzas armadas."
 HOL_lean_defense_manufacturing: "Fabricación de Defensa de Lean"
 HOL_lean_defense_manufacturing_desc: "Un mercado de trabajo ajustado hace que los trabajadores cualificados se vean obligados a lograr la producción de armas. La adopción de métodos de fabricación magros en todo el DAF y sus proveedores reduce la fuerza de trabajo que cada fábrica militar exige, liberando personal para la economía más amplia."
 HOL_defense_supply_chain_integration: "Integrar las cadenas de suministro de defensa"
 HOL_defense_supply_chain_integration_desc: "Las relaciones Fragmentadas con los proveedores cubren lo eficiente que pueden ser nuestras plantas. Integrar la cadena de suministro de defensa alrededor de empresas como Fokker estabiliza insumos y eleva la máxima eficiencia que nuestra industria militar puede sostener."
 HOL_defense_export_promotion: "Promover las exportaciones de defensa"
 HOL_defense_export_promotion_desc: "Los productos de defensa holandés son competitivos en el extranjero, pero los ingresos de exportación están subexplotados. Una estrategia coordinada de exportación respaldada por Werkspoor y sus asociados amplía la base tributaria de la industria militar y financia nuevas inversiones."
 HOL_national_defense_industrial_strategy: "Estrategia industrial de defensa nacional"
 HOL_national_defense_industrial_strategy_desc: "Con una base moderna, plantas magras, cadenas de suministro integradas y crecientes exportaciones, el gobierno puede vincular estas ganancias en una sola estrategia industrial. La coordinación de los principales fabricantes eleva la producción general de fábricas militares y cementa el sector defensa como un pilar de la economía."
 HOL_netherlands_fractal_pattern: "Patrón Fractal de los Países Bajos"
 HOL_netherlands_fractal_pattern_desc: "El Patrón de Fractal Neerlandés (NFP) es un patrón de camuflaje desarrollado para uniformes militares holandeses. Este diseño avanzado proporciona una mejor ocultación en diversos entornos, mejorando la supervivencia y eficacia de los soldados sobre el terreno."
 HOL_daf_trucks: "Camiones militares del DAF CF"
 HOL_daf_trucks_desc: "Invertir en los camiones DAF aumenta la movilidad y las capacidades logísticas del ejército holandés. Estos vehículos versátiles y fiables son esenciales para el transporte de tropas, equipo y suministros, garantizando flexibilidad operacional y apoyo."
 HOL_scania_trucks: "Nuevo Scania Gryphus"
 HOL_scania_trucks_desc: "Añadir Camiones Scania a la flota de vehículos del Ejército Holandés mejora el apoyo logístico y la eficiencia del transporte. Estos camiones son conocidos por su durabilidad y rendimiento, haciéndolos ideales para operaciones militares."
 HOL_mrad_replacement: "Modernizar MRAD"
 HOL_mrad_replacement_desc: "En 2020, el Ministerio de Defensa neerlandés inició un proyecto crítico para modernizar sus sistemas de defensa aérea de alcance mediano. Los sistemas actuales, incluida la NASAMS, serán reemplazados por plataformas más avanzadas y tecnológicamente superiores para proteger mejor el espacio aéreo holandés y apoyar las operaciones de la OTAN. Al invertir en nuevas capacidades de defensa aérea, aseguramos que nuestras fuerzas sigan siendo capaces de defender contra las amenazas aéreas modernas y asegurar los cielos de la nación para el futuro."
 HOL_colt_upgrade: "Actualización de Colt C7 Rifle"
 HOL_colt_upgrade_desc: "En 2009, las Fuerzas Armadas holandesas llevaron a cabo una mejora significativa del rifle Colt C7, mejorando su precisión, fiabilidad y adaptabilidad para los escenarios modernos de combate. Esta modernización incluyó sistemas mejorados de óptica, ergonomía y modulares para satisfacer las necesidades cambiantes de las unidades de infantería. Al invertir en estas mejoras, el Ejército neerlandés asegura que sus soldados estén equipados con tecnología de armas de vanguardia, manteniendo un alto nivel de preparación para combatir."
 HOL_pantserhouwitser_mlu: "Pantserhouwitser 2000 MLU"
 HOL_pantserhouwitser_mlu_desc: "El programa Pantserhouwitser 2000 MLU se centra en la mejora de estos auitzers autopropulsados con sistemas mejorados de control de incendios, mayor alcance y mayor precisión. Esto garantiza que la artillería holandesa siga siendo altamente eficaz y capaz de proporcionar un apoyo preciso a los incendios."
 HOL_puls: "Orden de Israel PULS"
 HOL_puls_desc: "El sistema de lanzamiento preciso y universal (PULS) está diseñado para mejorar las capacidades de artillería del ejército holandés integrando sistemas avanzados de cohetes y misiles. Este sistema permite un soporte de fuego preciso y flexible, mejorando la potencia general del ejército."
 HOL_bushmaster_mlu: "Bushmaster MLU"
 HOL_bushmaster_mlu_desc: "El programa Bushmaster MLU implica mejorar la armadura, los sistemas de comunicaciones y la movilidad de estos portadores de personal blindados. Esto aumenta la protección y eficacia de las tropas neerlandesas en diversos entornos operacionales."
 HOL_munition_investments: "Inversiones de Munición"
 HOL_munition_investments_desc: "Invertir en municiones avanzadas y ampliar las existencias garantiza que el ejército neerlandés esté bien proporcionado y sea capaz de mantener operaciones prolongadas. Este objetivo incluye el desarrollo de municiones guiadas por precisión y la mejora de la logística para el suministro de municiones."
 HOL_defensienota_2022: "Defensienota 2022"
 HOL_defensienota_2022_desc: "La Defensienota 2022 describe inversiones estratégicas y reformas para mejorar las capacidades militares holandesas. Este plan integral se centra en la modernización, el aumento de los presupuestos de defensa y la mejora de la disponibilidad operacional en todas las ramas de las fuerzas armadas."
 HOL_procure_stinger_missiles: "Misiles Procure Stinger"
 HOL_procure_stinger_missiles_desc: "La adquisición de misiles Stinger aumenta la capacidad del ejército holandés para defender contra aviones y helicópteros de bajo vuelo. Estos sistemas portátiles de defensa aérea (MANPADS) proporcionan capacidades flexibles y móviles de defensa del aire."
 HOL_procure_advanced_mortars: "Morteros avanzados procure"
 HOL_procure_advanced_mortars_desc: "Invertir en morteros avanzados mejora las capacidades indirectas de apoyo al fuego del Ejército Holandés. Estos sistemas ofrecen mayor rango, precisión y movilidad, proporcionando energía de fuego esencial para las unidades de infantería."
 HOL_develop_guide_munitions: "Desarrollar Municiones Guiadas de Precisión"
 HOL_develop_guide_munitions_desc: "El desarrollo de municiones guiadas por precisión de 155 mm aumenta la exactitud y eficacia de la artillería holandesa. Estas municiones avanzadas permiten apuntar con precisión, reducir los daños colaterales y aumentar la eficacia operacional."
 HOL_expand_patriot_systems: "Ampliar los sistemas de misiles Patriot"
 HOL_expand_patriot_systems_desc: "Ampliar el despliegue de sistemas de misiles Patriot mejora la capacidad del ejército holandés para defender contra misiles balísticos y amenazas aéreas avanzadas. Este enfoque mejora la seguridad nacional y regional proporcionando una robusta red de defensa del aire y los misiles."
 HOL_expand_command_control_centers: "Expandir los Centros de Control &"
 HOL_expand_command_control_centers_desc: "Ampliar y modernizar los centros de mando y control aumenta las capacidades operativas del Ejército Holandés en materia de coordinación y toma de decisiones, lo que incluye mejorar los sistemas de comunicación e integrar la tecnología avanzada para asegurar un mando eficiente de las operaciones militares."
 HOL_establish_marechaussee_squad: "Establece el escuadrón de Marechaussee"
 HOL_establish_marechaussee_squad_desc: "El Marechaussee es una fuerza militar especial encargada de hacer cumplir la ley y mantener operaciones logísticas. El establecimiento de esta unidad mejorará considerablemente tanto la eficiencia de la oferta como la supresión en nuestras operaciones militares."
 HOL_modernize_foxtrot: "Modernizar sistemas de comunicación Foxtrot"
 HOL_modernize_foxtrot_desc: "La modernización de los sistemas de comunicación Foxtrot se centra en mejorar la infraestructura táctica de comunicación del Ejército Holandés. Esto incluye la implementación de enlaces de datos seguros y de alta velocidad, cifrado avanzado y mayor interoperabilidad con aliados de la OTAN. Mediante la modernización de estos sistemas, el Ejército neerlandés garantiza comunicaciones fiables y seguras en diversos entornos operacionales."
 HOL_special_forces_helicopter: "Fuerzas de Operaciones Especiales Helicopter"
 HOL_special_forces_helicopter_desc: "La adquisición de helicópteros especializados para las fuerzas de operaciones especiales neerlandesas aumenta su movilidad y eficacia operacional. Estos helicópteros están equipados para la rápida inserción y extracción, el apoyo aéreo cercano y el apoyo logístico en diversos entornos."
 HOL_defense_healthsector: "Establecer Defensa Instituuta & Salud"
 HOL_defense_healthsector_desc: "El Instituto Samenwerking Defensie en Relatieziekenhuizen (Instituto de Cooperación entre Defensa y Hospitales Civiles) se centra en crear una sólida red de apoyo médico y respuesta a crisis. Esta colaboración pretende mejorar la atención médica del personal militar y mejorar la capacidad de los militares para apoyar la infraestructura médica civil durante las emergencias."
 HOL_develop_defensity_college: "Desarrollar Defensity College"
 HOL_develop_defensity_college_desc: "Defensity College es una iniciativa educativa destinada a proporcionar al personal militar oportunidades de ascenso académico y formación especializada. Este enfoque incluye asociaciones con universidades e institutos técnicos para ofrecer cursos en diversas esferas, mejorando las aptitudes y los conocimientos de los soldados y oficiales neerlandeses."
 HOL_hr_ecosystem: "HR-ecosysteem"
 HOL_hr_ecosystem_desc: "La iniciativa HR-Ecosysteem tiene por objeto salvar la brecha entre las Fuerzas Armadas Neerlandesas y la sociedad fomentando una red de recursos humanos colaborativa. Este programa se centra en crear asociaciones con organizaciones civiles, mejorar las oportunidades de carrera del personal militar y mejorar el bienestar general de los miembros de los servicios. Al conectar la defensa y la sociedad, el HR-Ecosysteem fortalece el sistema de apoyo para el personal militar durante y después de su servicio."
 HOL_marinestudie: "Marinestudie"
 HOL_marinestudie_desc: "La Marinestudie es un estudio completo de estrategia naval destinado a evaluar y modernizar la Marina Real de los Países Bajos. Este proyecto incluye la evaluación de las capacidades actuales, amenazas futuras y avances tecnológicos para desarrollar una estrategia naval a largo plazo. En el estudio se hace hincapié en mejorar la preparación de combates navales, mejorar los activos de las flotas e integrar las nuevas tecnologías."
 HOL_annual_naval_deployment: "Despliegue naval anual"
 HOL_annual_naval_deployment_desc: "Cada año la Real Armada de los Países Bajos envía buques a travesías de buena voluntad de largo alcance, con escalas en puertos de todo el mundo occidental. Estos despliegues proyectan la presencia neerlandesa, refuerzan las asociaciones y afinan la pericia marinera de aguas azules de la flota."
 HOL_naval_diplomacy_voyage: "Visita de Buena Voluntad Naval holandesa"
 HOL_world_reaching_navy: "El mundo Alcanzando la Marina"
 HOL_world_reaching_navy_desc: "Los Países Bajos aspiran a mejorar sus capacidades navales para funcionar eficazmente en todo el mundo. Este objetivo consiste en modernizar la flota, ampliar el apoyo logístico y fortalecer las asociaciones internacionales. Al hacerlo, la Armada neerlandesa busca asegurar vías marítimas vitales, participar en misiones globales de mantenimiento de la paz y poder de proyecto siempre que sea necesario."
 HOL_european_navy: "Europeann Navy"
 HOL_european_navy_desc: "Los Países Bajos desempeñarán un papel rector en la formación de una Armada Europea, fomentando una mayor cooperación e integración naval entre los Estados miembros de la UE. Esta iniciativa tiene como objetivo mejorar la seguridad marítima colectiva, racionalizar los recursos de defensa y proyectar el poder naval europeo en la etapa global."
 HOL_expanding_naval_infrastructure: "Ampliación de la infraestructura naval"
 HOL_expanding_naval_infrastructure_desc: "Los Países Bajos están comprometidos a mejorar su presencia naval ampliando su red de bases navales, lo que implica el desarrollo de nuevas bases y la mejora de las instalaciones existentes en las costas y territorios de ultramar holandeses. Estas bases ampliadas proporcionarán apoyo estratégico para operaciones navales, mejorar la logística y asegurar una rápida capacidad de respuesta."
 HOL_f35c_development: "F35C Development"
 HOL_f35c_development_desc: "La adquisición de la aeronave F-35C Lightning II proporciona a la Fuerza Aérea Neerlandesa una variante capaz de transportar al combate avanzado del sigilo. Este enfoque mejora la capacidad de los Países Bajos para proyectar energía aérea tanto desde bases terrestres como portaaviones, ofreciendo versatilidad inigualable y eficacia de combate."
 HOL_future_air_defender: "Futuro defensor de aire"
 HOL_future_air_defender_desc: "El programa Future Air Defender es un esfuerzo colaborativo entre Holanda y Alemania para desarrollar capacidades avanzadas de defensa naval. Esta iniciativa se centra en equipar los buques navales holandeses y alemanes con sistemas de radar de última generación, misiles antiaéreos y tecnología integrada de mando y control."
 HOL_multi_ocean_training: "Capacitación multiocéano"
 HOL_multi_ocean_training_desc: "Para prepararse para diversos retos marítimos, la Armada holandesa llevará a cabo amplios ejercicios de capacitación en múltiples océanos. Estos ejercicios mejorarán la interoperabilidad con las marinas aliadas y aumentarán la disponibilidad operacional de las fuerzas navales holandesas en diversos entornos."
 HOL_carrier_development: "Air Carrier Development"
 HOL_carrier_development_desc: "Mediante el desarrollo de vehículos avanzados, los Países Bajos asegurarán su supremacía naval y garantizarán la protección para las generaciones futuras."
 HOL_expand_dutch_naval_influence: "Ampliar la influencia naval holandesa"
 HOL_expand_dutch_naval_influence_desc: "A fin de establecerse plenamente como un poder naval mundial, los Países Bajos deben fomentar alianzas navales más fuertes y aumentar su influencia en las organizaciones marítimas internacionales. Esto garantizará que los intereses holandeses estén representados en operaciones y estrategias navales mundiales."
 HOL_submarine_hunter_initiative: "Iniciativa Submarina Hunter"
 HOL_submarine_hunter_initiative_desc: "La creciente amenaza que plantean los submarinos enemigos exige una nueva doctrina centrada en la guerra antisubmarina (ASW). Los Países Bajos liderarán el desarrollo de tecnologías ASW de última generación, asegurando que las flotas holandesas nunca estén a merced de amenazas submarinas no vistas."
 HOL_amphibous_technology: "Fuerzas expeditativas especializadas"
 HOL_amphibous_technology_desc: "Los Países Bajos deberían invertir en la creación de fuerzas expedicionarias navales altamente especializadas capaces de desplegarse rápidamente en zonas de conflicto alrededor del mundo. Estas fuerzas serán apoyadas por buques de asalto anfibios y divisiones marinas de élite, lo que permitirá una intervención rápida y decisiva en operaciones extranjeras."
 HOL_return_of_destroyers: "Regreso de Destructores"
 HOL_return_of_destroyers_desc: "Ampliar y modernizar la flota destructora es crucial para mantener la supremacía naval. Este enfoque implica la construcción de nuevos destructores equipados con armamento avanzado y sistemas de defensa. Estos buques mejorarán las capacidades operativas de la Armada, proporcionando una sólida defensa y opciones ofensivas en diversos teatros marítimos."
 HOL_thales_investments: "Inversiones Thales"
 HOL_thales_investments_desc: "Thales Nederland, subsidiaria del Grupo Thales global, es una empresa líder en tecnología de defensa, aeroespacial y seguridad en Holanda. Invertir en Thales Nederland implica mejorar sus capacidades de producción, investigación y desarrollo (R&D) esfuerzos, y ampliar su papel en los mercados globales de defensa."
 HOL_special_force_move: "Marine's in Vlissingen"
 HOL_special_force_move_desc: "La decisión de establecer una presencia significativa del Cuerpo Marino en Vlissingen está impulsada por ventajas estratégicas y logísticas. La ubicación de Vlissingen en la costa del Mar del Norte ofrece acceso directo a las rutas marítimas, por lo que es ideal para operaciones anfibias y despliegue rápido. La infraestructura existente de la ciudad y su proximidad a los principales carriles de transporte aumentan la disponibilidad operacional y flexibilidad del Cuerpo de Infantería de Marina"
 HOL_rijksregiebureau_maritieme_industrie: "Rijksregiebureau Maritieme Industrie"
 HOL_rijksregiebureau_maritieme_industrie_desc: "El establecimiento de la Maritieme Maakindustrie Rijksregiebureau constituye un paso importante hacia la centralización y coordinación de la industria manufacturera marítima en los Países Bajos. Este organismo racionalizará los esfuerzos para innovar y ampliar las capacidades de construcción naval e ingeniería marina, asegurando que las industrias marítimas holandesas sigan siendo competitivas y tecnológicamente avanzadas."
 HOL_maritiem_masterplan: "Maritiem Masterplan"
 HOL_maritiem_masterplan_desc: "Het Maritiem Masterplan describe una estrategia integral para mejorar el sector marítimo de Holanda. Este plan incluye inversiones en infraestructura, investigación y desarrollo y capacitación laboral. Mediante la ejecución de este plan maestro, los Países Bajos pretenden asegurar su posición como líder mundial en innovación marítima y sostenibilidad."
 HOL_werf_van_de_toekomst: "Werf van de Toekomst"
 HOL_werf_van_de_toekomst_desc: "El proyecto De Werf van de Toekomst (El Astillero del Futuro) pretende revolucionar la construcción naval en los Países Bajos. Esta iniciativa se centra en integrar tecnologías avanzadas de fabricación, como automatización, robótica e impresión 3D, en operaciones astilleras. El objetivo es crear procesos de construcción naval más eficientes, sostenibles y rentables."
 HOL_smart_maritime: "Inteligente Marítimo"
 HOL_smart_maritime_desc: "La iniciativa Smart Maritime aprovecha las tecnologías digitales para mejorar la eficiencia y el rendimiento del sector marítimo holandés. Este enfoque incluye la implementación de sistemas inteligentes para navegación, logística y mantenimiento, así como el desarrollo de buques autónomos. Al abrazar la transformación digital, los Países Bajos pretenden liderar el camino en soluciones inteligentes de envío."
 HOL_robotics_navy: "Robótica Armada"
 HOL_robotics_navy_desc: "El proyecto Robotisering Wind op Zee (Robotic Offshore Wind) se centra en integrar la robótica y la automatización en la industria eólica offshore. Esta iniciativa tiene como objetivo mejorar la instalación, mantenimiento y operación de turbinas eólicas en el mar, lo que hace que el proceso sea más seguro, eficiente y sostenible. Al aprovechar la robótica, los Países Bajos pueden mejorar sus capacidades de energía renovable."
 HOL_seabed_protection: "Protección de la infraestructura del Mar del Norte"
 HOL_seabed_protection_desc: "Las tuberías, los cables de energía y datos, y las granjas eólicas offshore ahora protegen el Mar del Norte Holandés, y el sabotaje de las líneas Nord Stream expusieron lo vulnerables que son. Un programa dedicado a la guerra de los fondos marinos combina buques de inspección, redes sonares y sistemas submarinos no tripulados para supervisar y defender esta infraestructura crítica."
 HOL_nuke_navy: "Nucleaire Voortstuwing van Schepen"
 HOL_nuke_navy_desc: "La iniciativa Nucleaire Voortstuwing van Schepen (Nuclear Propulsion for Ships) explora el desarrollo y la implementación de sistemas de propulsión nuclear para buques navales y comerciales holandeses. Este objetivo es proporcionar soluciones de propulsión sostenibles y a largo plazo, reducir la dependencia de los combustibles fósiles y mejorar las capacidades operacionales de la flota holandesa."
 HOL_goalkeeper_modernization: "Modernización de los soldados"
 HOL_goalkeeper_modernization_desc: "Los Países Bajos están actualizando su Goalkeeper CIWS (Close-In Weapon System) para mejorar sus capacidades de defensa naval. Este proyecto de modernización consiste en instalar nuevos sistemas de radar y rastreo, mejorar el control de incendios e integrar tipos avanzados de municiones. Los sistemas actualizados de Goalkeeper aumentarán significativamente la capacidad de la Marina holandesa para defender contra los misiles entrantes y las amenazas de cerca."
 HOL_smartl_radar_construction: "Construcción del radar SMART-L"
 HOL_smartl_radar_construction_desc: "La construcción del sistema de radar SMART-L proporcionará a la Marina holandesa capacidades de vigilancia y seguimiento de vanguardia. Este avanzado sistema de radar puede detectar y rastrear misiles balísticos, aeronaves y otras amenazas aéreas a grandes distancias. Mediante la implementación del radar SMART-L, los Países Bajos aumentan su conciencia situacional y fortalecen su defensa global de aires y misiles."
 HOL_vrouwenklasse_destroyer: "Desarrollo de Vrouwenklasse"
 HOL_vrouwenklasse_destroyer_desc: "Introduciendo a los destructores antisubmarinos Vrouwenklasse, los Países Bajos pretenden construir una flota de fragatas altamente avanzadas y versátiles. Estos barcos contarán con sistemas de misiles de vanguardia, radar superior y robustas capacidades de guerra electrónica. El destructor Vrouwenklasse está diseñado para sobresalir en operaciones navales ofensivas y defensivas, asegurando que la Marina holandesa siga siendo una fuerza formidable."
 HOL_den_helder_css: "Den Helder CSS"
 HOL_den_helder_css_desc: "El proyecto Den Helder CSS tiene como objetivo desarrollar un nuevo buque de apoyo a la lucha para proporcionar apoyo logístico y operativo a la flota holandesa. Este buque garantizará que las fuerzas navales puedan mantener operaciones prolongadas suministrando combustible, municiones y otros recursos esenciales. El Den Helder CSS será un activo crítico para mantener la eficacia operacional de la Marina holandesa."
 HOL_joint_support_ship: "Soporte conjunto Karel Doorman del buque"
 HOL_joint_support_ship_desc: "Comisario en 2015, Zr.Ms. Karel Doorman es un buque de apoyo conjunto que combina el transporte marítimo, la reposición en el mar y las operaciones de helicópteros en un solo casco. Construido por Damen Schelde, permite que la Marina Real de Holanda sostenga grupos de tareas expedicionarias y el Cuerpo de Marines lejos de los puertos caseros."
 HOL_amphibious_transport_group: "Grupo de transporte anfibio"
 HOL_amphibious_transport_group_desc: "Los muelles de la plataforma de aterrizaje de clase Rotterdam, liderados por Zr.Ms. Johan de Witt, dale a los Korps Mariniers una capacidad de asalto anfibio dedicada. Con cubiertas bien, bahías de vehículos y cubiertas de vuelo, pusieron un batallón marino reforzado a tierra y sirven como plataformas de comando afloat para operaciones conjuntas."
 HOL_nh90_mlu: "NH90 MLU"
 HOL_nh90_mlu_desc: "El proyecto NH90 Mid-Life Upgrade tiene como objetivo ampliar la vida operacional y las capacidades de los helicópteros NH90 utilizados por la Armada Neerlandesa. Esta actualización incluye aviónicos avanzados, sensores mejorados y sistemas de armamento mejorados. La MLU NH90 garantizará que estos helicópteros versátiles sigan siendo efectivos en las misiones antisubmarinas de guerra, búsqueda y salvamento y transporte."
 HOL_flexible_navy: "Operaciones flexibles de la Marina"
 HOL_flexible_navy_desc: "La Armada Real de los Países Bajos debe adaptarse al entorno marítimo mundial en rápida evolución. Centrándonos en operaciones navales flexibles, mejoraremos la capacidad de nuestra flota para responder rápidamente a diversas amenazas, desde la guerra submarino hasta la defensa costera. Esto permitirá a la Marina holandesa mantener su presencia en diferentes mares y apoyar a los aliados en operaciones conjuntas, asegurando tanto la seguridad nacional como internacional."
 HOL_submarine_modernization: "Programa de modernización submarina"
 HOL_submarine_modernization_desc: "Los Países Bajos están llevando a cabo un programa de modernización integral para su flota submarino. Esta iniciativa implica mejorar los submarinos existentes con la última tecnología de sigilo, sistemas avanzados de sonar y armamento mejorado. La modernización mejorará la supervivencia y eficacia de los submarinos neerlandeses en diversos entornos operacionales."
 HOL_barracuda_submarine: "Orden Naval Barracuda"
 HOL_barracuda_submarine_desc: "La adquisición de submarinos de clase Barracuda representa un salto significativo en las capacidades de guerra de los Países Bajos. Estos submarinos con energía nuclear están equipados con características avanzadas de sigilo, capacidades de huelga de largo alcance y sistemas de sonar de vanguardia. Los submarinos Barracuda proporcionarán a la Marina holandesa unas capacidades ofensivas y defensivas bajo el agua."
 HOL_c71_submarine: "Dutch C71 Development"
 HOL_c71_submarine_desc: "El proyecto submarino C-71 es un producto orgulloso de la industria marítima holandesa, que refleja el patrimonio naval de larga data de la nación. Estos submarinos están diseñados específicamente para la defensa costera y operaciones especiales, con sistemas avanzados de propulsión, alta maniobrabilidad y equipos de comunicación de última generación. La clase C-71 reforzará significativamente la capacidad de la Marina holandesa para proteger sus aguas territoriales y llevar a cabo misiones encubiertas, asegurando que los Países Bajos continúen liderando en defensa marítima con soluciones internamente diseñadas."
 HOL_submarine_drones: "Desarrollo de drones submarinos"
 HOL_submarine_drones_desc: "Abrazando el futuro de la guerra naval, los Países Bajos están invirtiendo en drones submarinos para apoyar sus operaciones submarinas. Estos vehículos autónomos y operados remotamente llevarán a cabo misiones de vigilancia, reconocimiento y remoción de minas. La integración de los drones submarinos aumentará las capacidades de la flota submarina holandesa y proporcionará una ventaja táctica significativa."
 HOL_damen_industry_expansion: "Pañuelo industrial"
 HOL_damen_industry_expansion_desc: "Junto con los astilleros Damen, Holanda está ampliando su industria naval para satisfacer las crecientes demandas de sus programas de modernización naval. Esta ampliación incluye el mejoramiento de las instalaciones de construcción naval, la inversión en investigación y desarrollo y el aumento de la capacidad de producción. La expansión de la industria Damen asegurará que los Países Bajos sigan siendo una nación marítima líder con tecnología naval de vanguardia."
 HOL_legendary_dockyards: "Dutch Legendary Dockyards"
 HOL_legendary_dockyards_desc: "El resurgimiento de la artesanía naval holandesa dará resultados increíbles: mejores capacidades de producción naval, tiempos de construcción más rápidos y diseños navales más fuertes. A medida que se revivan los legendarios muelles, los Países Bajos consolidarán su estatus como líder en la guerra naval moderna."
 HOL_paars: "Paars II"
 HOL_paars_desc: "La segunda coalición púrpura, integrada por el Partido Laborista (PvdA), el Partido Popular por la Libertad y la Democracia (VVD) y los Demócratas 66 (D66), sigue gobernando a los Países Bajos. Esta coalición pretende equilibrar las políticas sociales progresivas con el liberalismo económico."
 HOL_threats_against_politicians: "Proteger a los políticos"
 HOL_threats_against_politicians_desc: "Las amenazas recientes contra los miembros políticos han suscitado preocupación por la seguridad de nuestras instituciones democráticas. Es imperativo fortalecer las medidas de seguridad y garantizar la protección de nuestros representantes electos."
 HOL_royal_wedding: "Boda Real"
 HOL_royal_wedding_desc: "El compromiso del príncipe heredero Willem-Alexander a Máxima Zorreguieta provocó controversia debido a la pasada participación de su padre en la dictadura militar argentina. Esto generó un debate político y público sobre su presencia en la boda, lo que llevó a una decisión del gobierno y el Parlamento holandeses."
 HOL_un_mission_ehtiopia: "Únete a ONU Misión a Etiopía"
 HOL_un_mission_ehtiopia_desc: "Las Naciones Unidas han solicitado la participación de los neerlandeses en la misión de mantenimiento de la paz a Etiopía. La adhesión a esta misión mejorará nuestra posición internacional y contribuirá a la paz y la estabilidad mundiales"
 HOL_gay: "Matrimonio del mismo sexo"
 HOL_gay_desc: "La legalización del matrimonio entre personas del mismo sexo constituye un hito importante en la lucha por la igualdad y los derechos humanos. Esta decisión histórica consolidará la posición de Holanda como una sociedad progresista e incluyente."
 HOL_vvd: "VVD Dijkstal Wins"
 HOL_vvd_desc: "El VVD es un partido liberal-conservador que aboga por mercados libres, libertad individual y mínima intervención gubernamental en la economía. Bajo la dirección de figuras pragmáticas como Mark Rutte, el VVD hace hincapié en el crecimiento económico, los servicios públicos eficientes, la seguridad nacional fuerte y un enfoque equilibrado de la inmigración. El partido pretende crear una economía dinámica y competitiva, garantizando al mismo tiempo las libertades personales y la estabilidad social."
 HOL_economic_paper: "Disminución del trabajo en papel económico"
 HOL_economic_paper_desc: "Para fomentar un entorno empresarial más dinámico y eficiente, el VVD se compromete a reducir los trámites económicos innecesarios. Al cortar la cinta roja, habilitaremos a las empresas para centrarse en el crecimiento y la innovación."
 HOL_vvd_debt_reduction: "Reducción de la deuda"
 HOL_vvd_debt_reduction_desc: "Garantizar la estabilidad a largo plazo de nuestra economía es fundamental. El VVD tiene como objetivo reducir la deuda nacional mediante una gestión fiscal prudente y recortes de gastos específicos, asegurando un futuro próspero para las generaciones venideras."
 HOL_economic_stimulation_tax: "Fiscal de estimulación económica"
 HOL_economic_stimulation_tax_desc: "El VVD cree en el poder de los incentivos económicos para impulsar el crecimiento. Al introducir incentivos fiscales para sectores clave, estimularemos la inversión, la innovación y la expansión económica."
 HOL_startup_innovation_policies: "Startup Políticas de innovación"
 HOL_startup_innovation_policies_desc: "El fomento del emprendimiento está en el centro de la estrategia económica del VVD. Ofrecemos desgravaciones fiscales y subvenciones a startups innovadoras, creando un vibrante ecosistema emprendedor."
 HOL_vvd_leadership: "Referendo de liderazgo"
 HOL_vvd_leadership_desc: "En 2006, el VVD tuvo un reto de liderazgo interno entre Mark Rutte y Rita Verdonk. Para resolver esto y determinar la dirección futura del partido, se celebró un referéndum de liderazgo entre los miembros del VVD. El resultado de este referéndum daría forma a las políticas y estrategias del partido, equilibrando el centrismo pragmático de Rutte contra las posturas duras de Verdonk."
 HOL_mark_rutte: "Marca Rutte"
 HOL_mark_rutte_desc: "Mark Rutte, el líder pragmático y centrista del VVD, es conocido por su capacidad de construir grandes coaliciones y navegar por complejos paisajes políticos. En 2006, hace hincapié en un enfoque equilibrado de la gobernanza, centrado en el liberalismo económico, los servicios públicos eficientes y las políticas sociales moderadas. Rutte pretende modernizar la infraestructura holandesa, promover la innovación y asegurar una posición fuerte para los Países Bajos dentro de la Unión Europea"
 HOL_consensus_politics: "Política de consenso"
 HOL_consensus_politics_desc: "Bajo la dirección de Mark Rutte, el VVD se centrará en construir grandes coaliciones y alcanzar consensos en todo el espectro político, asegurando estabilidad y gobernanza efectiva."
 HOL_modernize_dutch_infrastructure: "Modernizar la infraestructura holandesa"
 HOL_modernize_dutch_infrastructure_desc: "La inversión en infraestructura es crucial para el crecimiento económico. El VVD modernizará caminos, ferrocarriles y redes digitales para mejorar la conectividad y reducir la congestión."
 HOL_strong_netherlands_europe: "Países Bajos fuertes en una Europa fuerte"
 HOL_strong_netherlands_europe_desc: "Una fuerte Unión Europea es esencial para nuestra seguridad y prosperidad. El VVD abogará por una cooperación económica y de seguridad más profunda dentro de la UE"
 HOL_nato_norm: "Invertir para cumplir la norma de la OTAN"
 HOL_nato_norm_desc: "La seguridad nacional no es negociable. El VVD se compromete a aumentar el gasto de defensa para cumplir con el objetivo del 2% del PIB de la OTAN, asegurando que podamos proteger nuestra nación y cumplir nuestros compromisos de alianza."
 HOL_pragmatic_immigration: "Inmigración pragmática"
 HOL_pragmatic_immigration_desc: "Equilibrando las preocupaciones de seguridad con la necesidad de integración, el VVD bajo Rutte implementará políticas de inmigración pragmáticas que promuevan la cohesión social y los beneficios económicos."
 HOL_teflon_mark: "Marca Teflon"
 HOL_teflon_mark_desc: "La resiliencia y la capacidad de Mark Rutte para navegar por los desafíos políticos son activos inestimables. El VVD aprovechará su liderazgo para mantener la estabilidad y el progreso."
 HOL_rita_verdonk: "Rita Verdonk"
 HOL_rita_verdonk_desc: "Rita Verdonk, una figura prominente en el VVD, es conocida por su postura de línea dura sobre inmigración y ley y orden. En 2006, aboga por controles estrictos de inmigración, medidas robustas de seguridad nacional y preservación de la identidad cultural holandesa. El enfoque de Verdonk resuena con los votantes que buscan políticas firmes sobre integración y seguridad pública, situándola como líder fuerte y decisivo dentro del partido."
 HOL_national_identity: "Identidad nacional"
 HOL_national_identity_desc: "La preservación de la cultura e identidad holandesa es fundamental. Bajo la dirección de Verdonk, el VVD implementará políticas para asegurar que nuestro patrimonio nacional esté protegido y celebrado."
 HOL_tough_on_immigration: "Duro para la inmigración"
 HOL_tough_on_immigration_desc: "Para proteger nuestras fronteras y mantener el orden social, el VVD adoptará una posición de línea dura sobre la inmigración, haciendo hincapié en controles estrictos y reducir la afluencia migrante."
 HOL_law_and_order: "Law & Order"
 HOL_law_and_order_desc: "Garantizar la seguridad pública es un valor básico del VVD. Aumentaremos la financiación de las fuerzas policiales y militares para combatir el delito y garantizar la seguridad nacional"
 HOL_self_reliance_citizens: "Ciudadanos autosuficiencia"
 HOL_self_reliance_citizens_desc: "Promover la autosuficiencia y reducir la dependencia del bienestar estatal son objetivos clave para el VVD. Implementaremos políticas que fomenten la responsabilidad individual y la independencia económica."
 HOL_promote_dutch_sovereignty: "Promover la Soberanía holandesa"
 HOL_promote_dutch_sovereignty_desc: "El VVD bajo Verdonk hará hincapié en la soberanía holandesa, reduciendo la influencia de la UE sobre las políticas nacionales y protegiendo nuestra independencia."
 HOL_iron_rita: "Plancha Rita"
 HOL_iron_rita_desc: "El liderazgo fuerte y decisivo de Rita Verdonk guiará al VVD a través de tiempos difíciles, asegurando un control firme y una dirección clara para el futuro."
 HOL_wilders_vvd: "Geert Wilders"
 HOL_wilders_vvd_desc: "Geert Wilders es la voz anti-inmigración más extendida de VVD, canalizando un creciente malestar público sobre la integración y la integración europea. Él empuja al partido hacia una línea más difícil sobre la inmigración, la seguridad y la soberanía nacional mientras sigue trabajando en su marco liberal."
 HOL_immigration_hardliner: "Inmigración Hardliner"
 HOL_immigration_hardliner_desc: "Wilders exige límites mucho más estrictos a la inmigración y el asilo. El VVD ajusta los requisitos de entrada e integración, presentándose como el partido que protegerá a la sociedad holandesa de la migración incontrolada."
 HOL_islam_integration_debate: "El debate de integración"
 HOL_islam_integration_debate_desc: "Wilders forza un argumento nacional sobre el Islam, la integración y los valores holandeses. El partido apuesta por una posición de confrontación, insistiendo en que los recién llegados adopten plenamente las normas liberales y culturales del país."
 HOL_eurosceptic_vvd_wing: "Anillo euroescéptico"
 HOL_eurosceptic_vvd_wing_desc: "Una facción alrededor de Wilders desconfia cada vez más la integración europea. El VVD adopta una postura más crítica hacia Bruselas, resistiendo las transferencias de soberanía y cuestionando una mayor ampliación."
 HOL_security_first: "Seguridad Primero"
 HOL_security_first_desc: "En medio de la violencia política y los temores del terrorismo, Wilders pide una postura de seguridad más dura. El partido amplía las facultades policiales y de lucha contra el terrorismo para tranquilizar a un público ansioso."
 HOL_wilders_dutch_sovereignty: "Soberanía holandesa"
 HOL_wilders_dutch_sovereignty_desc: "El ala Wilders coloca la soberanía nacional por encima de los compromisos supranacionales. El VVD afirma la primacía de las leyes e instituciones neerlandesas, reduciendo el alcance de las autoridades externas sobre la política interna."
 HOL_wilders_vvd_capstone: "Voz de los descontentos"
 HOL_wilders_vvd_capstone_desc: "Wilders se convierte en el campeón inconfundible de los votantes que se sienten insensatos. Su llamamiento populista reforma la imagen del VVD, obligando a un electorado inquieto a la nueva identidad más difícil del partido."
 HOL_liberal_society: "Sociedad liberal"
 HOL_liberal_society_desc: "Promover un modelo económico liberal es fundamental para la visión del VVD. Promovemos los mercados libres y la competencia para impulsar la innovación y la prosperidad."
 HOL_modernizing_public_services: "Modernización de los servicios públicos"
 HOL_modernizing_public_services_desc: "La modernización de los servicios públicos mediante la infraestructura digital y procesos simplificados es una prioridad para el VVD, asegurando eficiencia y accesibilidad a todos los ciudadanos."
 HOL_commitment_to_security: "Compromiso con la Seguridad"
 HOL_commitment_to_security_desc: "Garantizar la seguridad de nuestra nación es una prioridad máxima. El VVD invertirá en fuerzas policiales y militares para proteger a nuestros ciudadanos y defender el estado de derecho."
 HOL_public_private_partnerships: "Asociaciones entre el sector público y el privado"
 HOL_public_private_partnerships_desc: "El VVD apoya las asociaciones entre los sectores público y privado para mejorar el desarrollo de la infraestructura y impulsar el crecimiento económico mediante iniciativas de colaboración."
 HOL_increase_cyber_security: "Aumento de la seguridad cibernética"
 HOL_increase_cyber_security_desc: "En un mundo cada vez más digital, el VVD invertirá en medidas de seguridad cibernética para proteger la infraestructura nacional y los activos digitales contra amenazas cibernéticas."
 HOL_privatize_health_sector: "Privatizar el Sector Salud"
 HOL_privatize_health_sector_desc: "La introducción de mecanismos de mercado en el sistema sanitario mejorará la eficiencia y reducirá los costos, garantizando una mejor prestación de servicios para todos."
 HOL_woningbouwimpuls: "Vivienda Development"
 HOL_woningbouwimpuls_desc: "Es fundamental hacer frente a la escasez de viviendas. El VVD acelerará la construcción de viviendas para que los hogares sean más asequibles y accesibles."
 HOL_economy_based_education: "Educación basada en la economía"
 HOL_economy_based_education_desc: "La alineación de los programas educativos con las necesidades del mercado asegurará que los estudiantes obtengan habilidades de alta demanda, potenciando su empleabilidad y la economía."
 HOL_innovation_subsidies: "Subvenciones de innovación"
 HOL_innovation_subsidies_desc: "Proporcionar subvenciones para proyectos innovadores fomentará una cultura de creatividad y adelanto tecnológico, impulsando el crecimiento económico y la competitividad."
 HOL_excellent_schools: "Introducir excelentes escuelas"
 HOL_excellent_schools_desc: "Promover el establecimiento de excelentes escuelas elevará las normas y los resultados educativos, asegurando que nuestros niños reciban la mejor educación posible"
 HOL_invest_clean_energy: "Invertir en Energía Limpia"
 HOL_invest_clean_energy_desc: "La inversión en tecnologías de energía limpia es crucial para reducir la dependencia de los combustibles fósiles y reducir las emisiones de carbono. El VVD apoyará proyectos de energía renovable y prácticas sostenibles."
 HOL_decrease_trade_bureaucracy: "Disminución de la burocracia comercial"
 HOL_decrease_trade_bureaucracy_desc: "La reducción de obstáculos burocráticos en el comercio facilitará transacciones internacionales más fluidas y rápidas. El VVD tiene como objetivo simplificar los procesos comerciales para aumentar la eficiencia de las exportaciones."
 HOL_mkb_actieplan: "MKB Actieplan"
 HOL_mkb_actieplan_desc: "El apoyo a las pequeñas y medianas empresas (PYME) es vital para el crecimiento económico. El VVD implementará un plan de acción para proporcionar desgravaciones fiscales, donaciones y reducir las cargas reglamentarias para las PYME."
 HOL_nederland_digitaal: "Nederland Digitaal"
 HOL_nederland_digitaal_desc: "El VVD prevé un sector de gobierno y servicios públicos totalmente digitalizados. Al invertir en infraestructuras avanzadas de tecnología de la información y en iniciativas de gobierno electrónico, aumentaremos la eficiencia, la transparencia y la accesibilidad para todos los ciudadanos."
 HOL_balkenende: "El tiempo de Balkenende comienza"
 HOL_balkenende_desc: "El liderazgo de Jan Peter Balkenende enfatiza los valores democráticos cristianos de solidaridad, responsabilidad y administración. Su enfoque pragmático de la gobernanza tiene como objetivo equilibrar el crecimiento económico con la justicia social y la sostenibilidad ambiental."
 HOL_invest_in_police: "Inversion in Police"
 HOL_invest_in_police_desc: "El aumento de la capacidad y las capacidades de nuestra fuerza policial garantizará la seguridad pública y mantendrá el estado de derecho, creando un entorno seguro para todos los ciudadanos."
 HOL_prohibit_soft_drugs: "Prohibir las drogas blandas"
 HOL_prohibit_soft_drugs_desc: "Para proteger la salud pública y el orden social, el CDA aplicará normas más estrictas sobre las drogas blandas, reduciendo su disponibilidad y mitigando los daños asociados."
 HOL_unhcr_migration_office: "Oficina de Migración del ACNUR"
 HOL_unhcr_migration_office_desc: "Apoyar el establecimiento de una oficina de migración del ACNUR en los Países Bajos mejorará nuestra capacidad para gestionar con eficacia y humanidad las cuestiones relativas al asilo y a los refugiados."
 HOL_skilled_immigration: "Sólo la inmigración hábil"
 HOL_skilled_immigration_desc: "Enfoque La inmigración calificada asegurará que los recién llegados contribuyan positivamente a nuestra economía y sociedad, abordando las necesidades del mercado laboral manteniendo al mismo tiempo la cohesión social."
 HOL_solidarity_healthcare: "Solid Healthcare"
 HOL_solidarity_healthcare_desc: "El CDA cree en un sistema de salud basado en la solidaridad. Al asegurarnos de que todo el mundo tenga acceso a una atención médica de calidad, buscamos crear una sociedad más inclusiva y solidaria."
 HOL_living_care: "Living & Care"
 HOL_living_care_desc: "Integrar las instalaciones de vida y atención asegurará que nuestra población mayor reciba el apoyo que necesita en sus comunidades, promoviendo la dignidad y el bienestar."
 HOL_family_ministry: "Ministerio de la Familia"
 HOL_family_ministry_desc: "Establecer un Ministerio de Familias centralizará los esfuerzos para apoyar la vida familiar, asegurando que las políticas en todo el gobierno se ajusten a promover el bienestar de las familias."
 HOL_invest_childcare: "Invertir en el cuidado de los niños"
 HOL_invest_childcare_desc: "El acceso a un cuidado infantil asequible y de alta calidad es vital para las familias trabajadoras. El Departamento de Asuntos Económicos y Sociales aumentará la financiación de los servicios de guardería para apoyar a los padres y los niños."
 HOL_child_subsidies: "Subvenciones para niños"
 HOL_child_subsidies_desc: "Proporcionar apoyo financiero a las familias con niños ayudará a aliviar los costos de criar una familia y promover el bienestar de nuestros ciudadanos más jóvenes."
 HOL_nederland_sportland: "Nederland Sportland"
 HOL_nederland_sportland_desc: "Promover el deporte y la actividad física es esencial para una sociedad sana. El CDA invertirá en instalaciones deportivas y programas para fomentar estilos de vida activos."
 HOL_invest_in_clean_energy: "Invertir en Energía Limpia"
 HOL_invest_in_clean_energy_desc: "Invertir en tecnologías de energía limpia es crucial para un futuro sostenible. El CDA apoyará proyectos e iniciativas de energía renovable para reducir las emisiones de carbono."
 HOL_financial_freedom_schools: "Libertad Financiera para las Escuelas"
 HOL_financial_freedom_schools_desc: "La concesión de autonomía financiera a las escuelas les permitirá atender mejor las necesidades de sus estudiantes e innovar en la educación."
 HOL_practical_job_education: "Educación práctica en el empleo"
 HOL_practical_job_education_desc: "Enfoque La educación práctica en el empleo asegurará que los estudiantes obtengan las habilidades necesarias para el mercado laboral, reduciendo el desempleo y fomentando el crecimiento económico."
 HOL_business_risk_law: "Derecho de riesgo empresarial"
 HOL_business_risk_law_desc: "Para garantizar el bienestar de los empleados, el CDA aplicará una ley que exija a las empresas asumir la responsabilidad de sus trabajadores, incluso en tiempos de enfermedad. Esta política tiene como objetivo proteger los derechos de los trabajadores y promover un entorno laboral más saludable y solidario."
 HOL_maatschappelijk_ondernemen: "Maatschappelijk Ondernemen"
 HOL_maatschappelijk_ondernemen_desc: "La promoción de la iniciativa empresarial socialmente responsable garantizará que las empresas contribuyan positivamente a la sociedad, equilibrando los beneficios con las responsabilidades sociales y ambientales."
 HOL_remove_trade_tape: "Eliminar la cinta roja del comercio"
 HOL_remove_trade_tape_desc: "La reducción de las barreras burocráticas en el comercio facilitará transacciones internacionales más fluidas y eficientes, potenciando las exportaciones y el crecimiento económico."
 HOL_diversify_housing: "Diversificar la vivienda"
 HOL_diversify_housing_desc: "Para hacer frente a la escasez de viviendas y proporcionar opciones de vida asequibles, el CDA invertirá en diversos proyectos de vivienda, incluyendo viviendas sociales, propiedades de alquiler y hogares ocupados por propietarios."
 HOL_balkenende_resigns: "Balkenende IV Resigns"
 HOL_balkenende_resigns_desc: "Siguiendo el principio de rotación ministerial del CDA, el Primer Ministro Jan Peter Balkenende ha descendido tras dos términos. Esta decisión marca el final del gabinete de Balkenende IV y el comienzo de un nuevo capítulo para el CDA, asegurando perspectivas frescas y liderazgo dentro del partido."
 HOL_maxime_verhagen: "Maxime Verhagen"
 HOL_maxime_verhagen_desc: "Maxime Verhagen es un diplomático cualificado y constructor de coalición, conocido por su liderazgo pragmático. Su enfoque en el fortalecimiento de las alianzas internacionales y el mantenimiento de la estabilidad lo ha convertido en una figura respetada tanto en la política holandesa como mundial."
 HOL_trust_in_people: "Confianza en las personas "
 HOL_trust_in_people_desc: "Crear confianza en nuestros ciudadanos es esencial para una sociedad cohesiva. El CDA promoverá políticas que faculten a las personas y fomenten el respeto mutuo."
 HOL_trust_in_organizations: "Confianza en las Organizaciones"
 HOL_trust_in_organizations_desc: "El CDA mejorará la integridad y transparencia de las organizaciones, velando por que actúen éticamente y contribuyan positivamente a la sociedad."
 HOL_active_society: "Sociedad activa"
 HOL_active_society_desc: "El fomento de la ciudadanía activa y la participación comunitaria es fundamental para la visión del CDA. Apoyaremos iniciativas que fomenten el voluntariado y el compromiso cívico."
 HOL_micro_credit: "Permitir microcrédito"
 HOL_micro_credit_desc: "Facilitar el acceso al microcrédito potenciará a las pequeñas empresas y empresarios, impulsando el crecimiento económico y la innovación a nivel comunitario."
 HOL_public_private_innovation: "Innovación privada-pública"
 HOL_public_private_innovation_desc: "La promoción de la colaboración entre los sectores público y privado impulsará la innovación y aumentará la eficiencia y eficacia de los servicios públicos."
 HOL_heavy_efforts_clean_industry: "Esfuerzos esfuerzos de energía limpia"
 HOL_heavy_efforts_clean_industry_desc: "Intensificar los esfuerzos para promover la energía limpia reducirá nuestra huella de carbono y asegurará un futuro sostenible para los Países Bajos."
 HOL_invest_bio_agriculture: "Invertir en Bio-Agricultura"
 HOL_invest_bio_agriculture_desc: "Apoyar las iniciativas de bioagricultura promoverá prácticas agrícolas sostenibles, asegurando la salud a largo plazo de nuestro medio ambiente y suministro de alimentos."
 HOL_buma: "Sybrand van Haersma Buma"
 HOL_buma_desc: "Tras la dimisión de Balkenende, Sybrand van Haersma Buma pasa a liderar el CDA, con lo que se centra en los valores tradicionales y la justicia social."
 HOL_reform_justice_system: "Sistema de Justicia de Reforma"
 HOL_reform_justice_system_desc: "La reforma del sistema de justicia mejorará la equidad, eficiencia y accesibilidad, asegurando que todos los ciudadanos tengan igual acceso a la justicia"
 HOL_modern_investments_police: "Inversiones modernas de la policía"
 HOL_modern_investments_police_desc: "Las nuevas inversiones en la fuerza policial garantizarán la seguridad pública y mantendrán el estado de derecho, creando un entorno seguro para todos los ciudadanos."
 HOL_traditional_values: "Valores tradicionales"
 HOL_traditional_values_desc: "El CDA sigue empeñado en defender los valores tradicionales, como la familia, la comunidad y la responsabilidad social, como fundamento de nuestra sociedad."
 HOL_rentmeesterschap: "Rentmeesterschap"
 HOL_rentmeesterschap_desc: "El CDA promoverá la gestión sostenible de los recursos, garantizando su preservación para las generaciones futuras y fomentando el crecimiento económico."
 HOL_green_economy: "Economía verde"
 HOL_green_economy_desc: "La transición a una economía verde es esencial para el desarrollo sostenible. El CDA apoyará iniciativas que promuevan tecnologías y prácticas ecológicas, equilibrando el crecimiento económico con la protección del medio ambiente."
 HOL_reduce_european_influence: "Reducir la influencia europea"
 HOL_reduce_european_influence_desc: "Para preservar la soberanía holandesa y garantizar que se prioricen los intereses nacionales, el CDA promoverá una reducción de la influencia de la Unión Europea sobre las políticas internas."
 HOL_fortress_of_values: "Fortaleza de valores"
 HOL_fortress_of_values_desc: "Sybrand Buma pretende fortalecer el tejido social y la identidad nacional de los Países Bajos promoviendo valores tradicionales y resiliencia. Sus políticas se centran en construir una nación unida y segura, haciendo hincapié en la protección de la cultura y el patrimonio holandeses. Al reforzar los principios fundamentales del país, Buma busca crear una sociedad que se mantenga firme contra las amenazas externas y las divisiones internas, al tiempo que fomenta una ciudadanía fuerte y orgullosa."
 HOL_melkert_surprise: "Melkerts sorprende la victoria"
 HOL_melkert_surprise_desc: "Bajo la dirección de Ad Melkert, el PvdA ha introducido políticas inesperadas e innovadoras encaminadas a revitalizar la nación. Estas iniciativas prometen introducir cambios positivos y sentar las bases para una sociedad más inclusiva y próspera."
 HOL_inclusive_society: "Sociedad inclusivo"
 HOL_inclusive_society_desc: "Crear una sociedad inclusiva donde todos se sientan valorados y respetados es un principio fundamental del PvdA. Implementaremos políticas que apoyen la diversidad y promuevan la cohesión social, asegurando que todos los ciudadanos puedan participar plenamente en nuestra comunidad."
 HOL_democratic_active_government: "Gobierno democrático y activo"
 HOL_democratic_active_government_desc: "El PvdA está comprometido con el fortalecimiento de las instituciones democráticas y la promoción del compromiso ciudadano activo en política. Garantizaremos que el gobierno sea transparente, responsable y receptivo a las necesidades de todos los ciudadanos."
 HOL_strong_european_union: "Unión Europea fuerte"
 HOL_strong_european_union_desc: "El PvdA apoya una Unión Europea fuerte, democrática y socialmente responsable. Trabajaremos para lograr una integración económica y política más profunda, promoviendo la cooperación y la solidaridad entre los Estados miembros de la UE."
 HOL_accessible_healthcare: "Accesible Healthcare"
 HOL_accessible_healthcare_desc: "Garantizar que todo el mundo tenga acceso a atención médica de alta calidad es una prioridad para el PvdA. Ampliaremos los servicios de salud pública, reduciremos los tiempos de espera y aseguraremos que la atención médica siga siendo asequible para todos."
 HOL_social_security: "Seguridad Social para Todos"
 HOL_social_security_desc: "El fortalecimiento del sistema de seguridad social es fundamental para proteger a los miembros más vulnerables de la sociedad. El PvdA garantizará que las prestaciones sociales sean suficientes para satisfacer las necesidades básicas de todos los ciudadanos, prestando apoyo durante tiempos de necesidad."
 HOL_work_care_for_all: "Trabajo y cuidado para todos"
 HOL_work_care_for_all_desc: "El PvdA garantiza el acceso al trabajo remunerado y a la atención médica de calidad para todos. Apoyaremos políticas que ayuden a las personas a equilibrar el trabajo, las responsabilidades de la atención y el desarrollo personal, creando una sociedad más solidaria e inclusiva."
 HOL_fair_wages: "Salarios justos y beneficios"
 HOL_fair_wages_desc: "Garantizar salarios y beneficios justos para todos los trabajadores es esencial para reducir la desigualdad de ingresos. El PvdA implementará políticas que promuevan prácticas salariales justas y apoyen la negociación colectiva, asegurando la seguridad financiera para los más vulnerables."
 HOL_job_creation_security: "Creación de empleo y seguridad"
 HOL_job_creation_security_desc: "Crear oportunidades de empleo para todos los ciudadanos es esencial. El PvdA invertirá en programas de formación laboral, apoyará a pequeñas empresas y asegurará que todos tengan la oportunidad de encontrar un trabajo significativo, promover la seguridad laboral y reducir el desempleo."
 HOL_quality_education_for_all: "Educación de calidad para todos"
 HOL_quality_education_for_all_desc: "Invertir en la educación a todos los niveles es fundamental para garantizar que cada niño y adulto tenga acceso a oportunidades de aprendizaje de calidad. El PvdA apoyará la formación profesional, las iniciativas de aprendizaje permanente y asegurará que los programas educativos satisfagan las necesidades del mercado laboral."
 HOL_sustainable_economic_growth: "Crecimiento económico sostenible"
 HOL_sustainable_economic_growth_desc: "El PvdA se centra en el crecimiento económico sostenible que beneficia a todos los ciudadanos. Invertiremos en energía renovable, innovación y tecnologías ecológicas para construir una economía resiliente y sostenible para las generaciones futuras."
 HOL_invest_childcare_pvda: "Invertir en el cuidado de la infancia social"
 HOL_invest_childcare_pvda_desc: "El aumento de la financiación para los servicios de guardería es esencial para apoyar a los padres que trabajan y promover el desarrollo en la primera infancia. El PvdA garantizará que todas las familias dispongan de opciones asequibles y de alta calidad para cuidar a los niños."
 HOL_elderly_care: "Cuidado para los ancianos"
 HOL_elderly_care_desc: "La prestación de servicios integrales de atención a las personas de edad es una prioridad para el PvdA. Nos aseguraremos de que nuestra población mayor reciba el apoyo que necesita para vivir con dignidad e independencia, promoviendo la atención comunitaria y apoyando a los cuidadores familiares."
 HOL_child_youth_welfare: "Bienestar de la infancia y la juventud"
 HOL_child_youth_welfare_desc: "Es esencial invertir en programas que apoyen el bienestar y desarrollo de los niños y jóvenes. El PvdA garantizará el acceso a las oportunidades educativas, sanitarias y recreativas, promoviendo el bienestar de nuestros ciudadanos más jóvenes."
 HOL_social_tech_revolution: "Revolución tecnológica"
 HOL_social_tech_revolution_desc: "Abrazar la revolución tecnológica es crucial para garantizar que todos puedan participar en la sociedad de la información. El PvdA invertirá en educación, infraestructura digital e iniciativas que puenteen la brecha digital, promoviendo la innovación tecnológica y la inclusividad."
 HOL_green_urban_development: "Verde Desarrollo urbano"
 HOL_green_urban_development_desc: "La promoción del desarrollo urbano sostenible que combina la alta densidad de vivienda con una alta calidad de vida es una prioridad para el PvdA. Garantizaremos que las ciudades sean fuertes, inclusivas y respetuosas con el medio ambiente, invirtiendo en infraestructura verde y espacios públicos."
 HOL_sustainable_agriculture: "Agricultura sostenible"
 HOL_sustainable_agriculture_desc: "El apoyo a las prácticas agrícolas sostenibles es vital para la seguridad alimentaria y la protección del medio ambiente. El PvdA promoverá la agricultura orgánica, el uso responsable de las tierras y reducirá la contaminación agrícola, garantizando un suministro alimentario saludable y sostenible."
 HOL_renewable_energy_investments: "Inversiones energéticas renovables"
 HOL_renewable_energy_investments_desc: "Invertir en gran medida en las fuentes de energía renovable es crucial para reducir nuestra dependencia de los combustibles fósiles y combatir el cambio climático. El PvdA apoyará proyectos de energía solar, eólica e hidroeléctrica para construir un futuro energético sostenible."
 HOL_new_socialist_age: "Nueva Era de la Democracia Social"
 HOL_new_socialist_age_desc: "Para seguir siendo relevante y eficaz, el PvdA experimentará una transformación para atender mejor las necesidades de la sociedad moderna. Esto implica actualizar nuestras políticas, colaborar con las nuevas generaciones y adoptar enfoques innovadores para la gobernanza."
 HOL_samsom: "Samsom"
 HOL_samsom_desc: "Diederik Samsom ha sido elegido como el nuevo líder del PvdA. Conocido por su fuerte posición ambiental, Samsom tiene como objetivo guiar al partido hacia un futuro más verde y sostenible manteniendo la justicia social e inclusividad."
 HOL_environmental_vision: "Visión ambiental"
 HOL_environmental_vision_desc: "Bajo la dirección de Diederik Samsom, el PvdA priorizará la sostenibilidad ambiental. Implementaremos políticas integrales para proteger nuestros recursos naturales y promover un ambiente saludable para las generaciones futuras."
 HOL_green_economy_pvda: "Economía verde"
 HOL_green_economy_pvda_desc: "Diederik Samsom aboga por la transición a una economía verde promoviendo tecnologías ecológicas y prácticas sostenibles. Esto creará empleos, impulsará la innovación y protegerá el medio ambiente."
 HOL_circular_economy: "Economía circular"
 HOL_circular_economy_desc: "Para reducir los desechos y promover la sostenibilidad, desarrollaremos una economía circular que reutiliza, repara y recicla materiales. Este enfoque garantiza un ciclo de producción sostenible y minimiza el impacto ambiental."
 HOL_energy_transition: "Transición energética verde"
 HOL_energy_transition_desc: "Acelerar la transición energética es crucial para un futuro sostenible. Eliminaremos los combustibles fósiles, invertiremos en energía renovable y apoyaremos las innovaciones en el almacenamiento de energía y la eficiencia."
 HOL_digital_innovation: "Innovación digital"
 HOL_digital_innovation_desc: "La promoción de la innovación digital es esencial para el crecimiento económico y la modernización. Apoyaremos a las startups tecnológicas, invertiremos en infraestructura de TI y mejoraremos la alfabetización digital para mantener a los Países Bajos al frente del avance tecnológico."
 HOL_social_justice: "Social Justicia"
 HOL_social_justice_desc: "Garantizar la justicia social es central en la visión de Diederik Samsom. Trataremos la desigualdad de ingresos, promoveremos la igualdad de oportunidades y aseguraremos que todos los ciudadanos puedan participar plenamente en la sociedad."
 HOL_inclusive_society_pvda: "Sociedad inclusivo"
 HOL_inclusive_society_pvda_desc: "Es esencial construir una sociedad inclusiva donde todos se sientan valorados y respetados. Promoveremos políticas que apoyen la diversidad y la inclusión en todos los aspectos de la vida."
 HOL_innovation_in_education: "Innovación social en la educación"
 HOL_innovation_in_education_desc: "La modernización de la educación para preparar a los estudiantes para el futuro es clave. Invertiremos en herramientas de aprendizaje digital, educación STEM y formación docente para asegurar un sistema educativo de alta calidad."
 HOL_affordable_living: "Vida asequible"
 HOL_affordable_living_desc: "Garantizar condiciones de vida asequibles es una prioridad. Invertiremos en viviendas sociales, regularemos el mercado de alquiler y proporcionaremos subsidios para que la vivienda sea asequible para todos."
 HOL_public_health_initiatives: "Iniciativas de Salud Pública"
 HOL_public_health_initiatives_desc: "Es fundamental apoyar iniciativas amplias de salud pública. Nos centraremos en la atención preventiva, la salud mental y la reducción de las disparidades sanitarias para asegurar que todos tengan acceso a una atención médica de calidad."
 HOL_fusion_groenlinks: "Unite con GroenLinks"
 HOL_fusion_groenlinks_desc: "Ha llegado el momento de que el Partido Laborista y GroenLinks se unan a las fuerzas bajo la dirección de Frans Timmermans. Mediante la fusión de nuestros valores compartidos y visiones progresistas, podemos crear un frente unido que promueva la acción climática, la igualdad social y un futuro sostenible para los Países Bajos."
 HOL_asscher: "Asscher"
 HOL_asscher_desc: "Lodewijk Asscher ha sido elegido como el nuevo líder del PvdA. Conocido por su enfoque en el mercado laboral, la seguridad social y la integración, Asscher pretende dirigir al partido hacia una mayor equidad social y resiliencia económica."
 HOL_labour_market_reforms: "Reformas del mercado de trabajo"
 HOL_labour_market_reforms_desc: "Lodewijk Asscher está dedicado a crear un mercado laboral inclusivo. Apoyaremos programas de formación laboral, combatiremos la discriminación y aseguraremos salarios justos para todos los trabajadores."
 HOL_integration_policies: "Políticas de integración"
 HOL_integration_policies_desc: "Promover políticas de integración efectivas es clave para construir una sociedad cohesiva. Asscher apoya iniciativas que faciliten la integración de inmigrantes y refugiados en la sociedad holandesa."
 HOL_workplace_equality: "Igualdad en el lugar de trabajo"
 HOL_workplace_equality_desc: "Garantizar la igualdad en el trabajo es vital para una sociedad justa y justa. Asscher implementará políticas para prevenir la discriminación y promover la diversidad en el lugar de trabajo."
 HOL_strengthening_social_security: "Fortalecimiento de la seguridad social"
 HOL_strengthening_social_security_desc: "Garantizar un sistema de seguridad social robusto es clave. Asscher implementará políticas para proteger a los más vulnerables y brindar apoyo durante tiempos de necesidad."
 HOL_child_welfare: "Bienestar infantil"
 HOL_child_welfare_desc: "Garantizar el bienestar de los niños es una prioridad máxima. Asscher aboga por un aumento de la financiación para los programas de bienestar infantil, incluyendo educación en la primera infancia, atención médica y servicios de apoyo a la familia."
 HOL_social_innovation: "Innovación social"
 HOL_social_innovation_desc: "La promoción de la innovación social es esencial para abordar retos sociales complejos. Apoyaremos iniciativas que fomenten la colaboración para desarrollar soluciones innovadoras."
 HOL_educational_equity: "Equidad educativa"
 HOL_educational_equity_desc: "Garantizar la equidad educativa para todos los estudiantes es crucial. Asscher invertirá en escuelas de zonas desfavorecidas, proporcionará apoyo adicional para los estudiantes que luchan y promoverá la educación inclusiva."
 HOL_poverty_reduction: "Pobreza"
 HOL_poverty_reduction_desc: "La reducción de la pobreza es esencial para una sociedad justa. Implementaremos programas integrales de reducción de la pobreza, incluyendo mayores beneficios para el bienestar social y apoyo específico a las poblaciones vulnerables."
 HOL_digital_literacy: "Alfabetización digital"
 HOL_digital_literacy_desc: "Mejorar la alfabetización digital es crucial en el mundo tecnológico actual. Asscher apoya iniciativas para garantizar que todos los ciudadanos tengan las habilidades necesarias para tener éxito en la economía digital."
 HOL_economic_resilience: "Resiliencia económica"
 HOL_economic_resilience_desc: "El aumento de la resiliencia económica es esencial para hacer frente a las crisis futuras. Invertiremos en diversos sectores económicos, apoyaremos a las pequeñas empresas y crearemos una sólida red de seguridad para todos los ciudadanos."
 HOL_labour_rights: "Derechos laborales"
 HOL_labour_rights_desc: "Asscher es un fuerte defensor de los derechos laborales. Fortaleceremos las protecciones para los trabajadores, garantizaremos condiciones de trabajo seguras y apoyaremos el derecho a la negociación colectiva."
 HOL_sustainable_urban_development: "Desarrollo urbano sostenible"
 HOL_sustainable_urban_development_desc: "Apoyar el desarrollo urbano sostenible es clave para crear ciudades habitables. Invertiremos en infraestructura verde, espacios públicos y proyectos de vivienda sostenibles."
 HOL_social_housing: "Vivienda social"
 HOL_social_housing_desc: "La ampliación de la vivienda social es fundamental para hacer frente a la crisis de la vivienda. Asscher invertirá en la construcción y renovación de viviendas asequibles para garantizar que todos tengan un lugar seguro y seguro para vivir."
 HOL_bos: "Bos"
 HOL_bos_desc: "Wouter Bos ha sido elegido como el nuevo líder del PvdA. Conocido por su experiencia económica y su papel durante la crisis financiera, Bos pretende dirigir al partido hacia la estabilidad económica y el crecimiento a la vez que garantiza la justicia social."
 HOL_economic_expertise: "Experiencia económica"
 HOL_economic_expertise_desc: "Wouter Bos es reconocido por su experiencia económica. Bajo su liderazgo, el PvdA se centrará en aplicar políticas económicas sólidas para garantizar la estabilidad y promover el crecimiento sostenible."
 HOL_crisis_management: "Gestión de crisis"
 HOL_crisis_management_desc: "La experiencia de Wouter Bos en la gestión de las crisis financieras es inestimable. Pondremos en práctica medidas firmes para asegurar que la economía siga siendo resiliente ante los desafíos mundiales."
 HOL_financial_sector_reform: "Reforma del Sector Financiero"
 HOL_financial_sector_reform_desc: "Las reformas amplias en el sector financiero son esenciales para prevenir las crisis futuras y promover la transparencia y la rendición de cuentas. Wouter Bos dirigirá los esfuerzos para regular eficazmente la industria financiera."
 HOL_progressive_taxation: "Tributación progresiva"
 HOL_progressive_taxation_desc: "La aplicación de un sistema tributario justo y progresivo es fundamental para reducir la desigualdad y generar ingresos para los servicios públicos. El PvdA bajo Bos asegurará que los más ricos paguen su parte justa."
 HOL_affordable_housing: "Vivienda asequible"
 HOL_affordable_housing_desc: "Para hacer frente a la crisis de vivienda, Wouter Bos apoya políticas para aumentar la disponibilidad de viviendas asequibles. Invertiremos en proyectos de vivienda social y proporcionaremos subsidios para que la propiedad sea accesible a todos."
 HOL_employment_opportunities: "Oportunidades de empleo"
 HOL_employment_opportunities_desc: "Garantizar oportunidades de empleo suficientes es también una prioridad máxima para Wouter Bos. Sólo asegurando el empleo de la gente podemos construir una sociedad estable y en desarrollo."
 HOL_universal_healthcare: "Atención universal de salud"
 HOL_universal_healthcare_desc: "Garantizar que todo el mundo tenga acceso a atención médica de alta calidad es una prioridad para Wouter Bos. Ampliaremos los servicios de salud pública, reduciremos los tiempos de espera y aseguraremos que la atención médica siga siendo asequible para todos."
 HOL_fiscal_responsibility: "Responsabilidad fiscal"
 HOL_fiscal_responsibility_desc: "Wouter Bos se compromete a mantener un presupuesto equilibrado y garantizar que los servicios públicos esenciales estén debidamente financiados. Al ejercer la responsabilidad fiscal, garantizaremos que la economía holandesa siga siendo estable y sostenible para las generaciones futuras."
 HOL_green_economic_growth: "Crecimiento económico verde"
 HOL_green_economic_growth_desc: "Para garantizar la prosperidad a largo plazo, Wouter Bos defenderá una política económica centrada en el crecimiento verde y sostenible. Invertimos en energía limpia, empleos verdes e infraestructura ambientalmente amigable para la economía y combatir el cambio climático a prueba de futuro."
 HOL_debt_relief_programs: "Programas de alivio de la deuda"
 HOL_debt_relief_programs_desc: "Para aliviar las cargas financieras de las poblaciones vulnerables, Wouter Bos implementará programas de alivio de la deuda para individuos y pequeñas empresas. Esto potenciará a los hogares y empresarios que luchan, fomentando una mayor movilidad económica y estabilidad."
 HOL_strengthening_eurozone: "Fortalecimiento de la zona euro"
 HOL_strengthening_eurozone_desc: "Wouter Bos reconoce la importancia de una eurozona fuerte y resiliente para la estabilidad de la economía holandesa. Al dirigir los esfuerzos para fortalecer la eurozona, promoveremos la coordinación fiscal y la cooperación económica dentro de la UE para garantizar la prosperidad a largo plazo."
 HOL_small_business_support: "Apoyo a las pequeñas empresas"
 HOL_small_business_support_desc: "Apoyar a las pequeñas empresas es clave para una economía próspera. Wouter Bos implementará políticas que reducen los impuestos para las pequeñas empresas, proporcionan acceso al crédito y reducen las barreras burocráticas, permitiendo a las pequeñas empresas crecer y crear empleo."
 HOL_lpf: "Noche de Pim Fortuyn"
 HOL_lpf_desc: "El Lijst Pim Fortuyn (LPF) fue fundado para romper el status quo político. Bajo la dirección de Pim Fortuyn, el LPF defiende los valores de soberanía nacional, ley y orden, y una sociedad holandesa orgullosa y segura. Este movimiento desafiará a las élites políticas arraigadas y presionará por reformas audaces que ponen primero a los Países Bajos."
 HOL_support_sme: "Apoyo a las pequeñas y medianas empresas"
 HOL_support_sme_desc: "Las pequeñas y medianas empresas son la columna vertebral de la economía holandesa. La LPF reducirá las regulaciones y ofrecerá apoyo a las PYMES, permitiéndoles prosperar y impulsar el crecimiento económico."
 HOL_pvv: "Los salvajes se acercan a la arena política"
 HOL_pvv_desc: "El Partido por la Libertad, o PVVV, fundado por Geert Wilders, aboga por políticas que prioricen la soberanía holandesa, la preservación cultural y la seguridad. El PVV tiene como objetivo reducir la inmigración, restaurar el orgullo nacional y desafiar la influencia de la UE, asegurando que los Países Bajos sigan siendo una patria segura y próspera para sus ciudadanos. Con énfasis en oponerse al extremismo islámico y proteger los valores tradicionales, el PVV es una voz de identidad e independencia neerlandesas."
 HOL_restore_royal_authority: "Restablecimiento de la Autoridad Real"
 HOL_restore_royal_authority_desc: "La monarquía debe reafirmar su autoridad como la columna vertebral de la gobernanza holandesa. Al consolidar el poder, la Corona garantizará la estabilidad y la unidad dentro de la nación."
 HOL_establish_stadtholderate: "Establecer el titular de Stadt"
 HOL_establish_stadtholderate_desc: "Un moderno Stadtholderate permitirá un enfoque equilibrado de la gobernanza, asegurando la rendición de cuentas democrática preservando al mismo tiempo la influencia rectora de la monarquía."
 HOL_restore_royal_privileges: "Restaurar los privilegios reales"
 HOL_restore_royal_privileges_desc: "Reincorporar los privilegios históricos de la monarquía para garantizar la estabilidad y proteger las tradiciones y valores de la nación."
 HOL_voc: "Revive el Espíritu de la VOC"
 HOL_voc_desc: "La VOC (Dutch East India Company) fue una vez la fuerza motriz detrás de la influencia global de Holanda, creando un imperio de comercio e innovación. Mediante la modernización de su misión, podemos aprovechar su espíritu para reafirmar la influencia holandesa sobre regiones clave vitales para el comercio mundial en el siglo XXI."
 HOL_reclaim_voc_territories: "Movilizar para recuperar tierras VOC"
 HOL_reclaim_voc_territories_desc: "El tiempo para las palabras ha pasado. El legado de la VOC exige acción, y nuestro ejército está preparado para dirigir el cargo. Reclamando los territorios de nuestro pasado histórico, restauraremos la influencia holandesa y aseguraremos nuestro lugar como un poder global una vez más."
 HOL_asml_tsmc_partnership: "Forjar una alianza ASML-TSMC"
 HOL_asml_tsmc_partnership_desc: "La producción semiconductora de TSMC y la experiencia litográfica de ASML hacen de Taiwán un nexo estratégico de tecnología. Una asociación entre ASML y TSMC garantizará que los Países Bajos se conviertan en un jugador indispensable en la carrera tecnológica global."
 HOL_voc_territory_focus: "Enfoque sobre territorios más allá de Indonesia"
 HOL_voc_territory_focus_desc: "Con la VOC restablecida, debemos decidir si reclamar a Indonesia o concentrarnos en otros territorios clave. Centrándonos en regiones como India, Sudáfrica, Taiwán y Sri Lanka, podemos reconstruir la red global de la VOC, afirmando influencia holandesa en todo el mundo. Indonesia puede esperar. Nuestra ambición se extiende mucho más allá de sus costas."
 HOL_wic: "Revive la West India Company"
 HOL_wic_desc: "La West India Company (WIC) sirvió una vez como piedra angular de la influencia holandesa en las Américas y el Atlántico. Al revivir sus operaciones, podemos reafirmar nuestro control sobre territorios estratégicos, reforzar el comercio y ampliar nuestro alcance en el Hemisferio Occidental, restaurando la presencia holandesa a su antigua gloria."
 HOL_d66: "D66"
 HOL_d66_desc: "D66 es un faro de progreso en los Países Bajos, defendiendo la democracia, la sostenibilidad y la igualdad social. Nuestra visión busca llevar a la nación a un futuro de innovación, inclusividad y cooperación, asegurando que cada ciudadano tenga voz y participación en construir un mejor mañana."
 HOL_d66_democratic_institutions: "Fortalecimiento de las instituciones democráticas"
 HOL_d66_democratic_institutions_desc: "D66 se compromete a salvaguardar los cimientos de la democracia. Al aumentar la transparencia, la rendición de cuentas y la participación pública, aseguraremos que nuestro gobierno siga siendo justo y eficaz en el servicio de su pueblo."
 HOL_d66_direct_democracy: "Promover la democracia directa"
 HOL_d66_direct_democracy_desc: "Los ciudadanos merecen una voz más fuerte en la formulación de políticas que afecten sus vidas. Al promover iniciativas como referendos vinculantes y presupuesto participativo, D66 acercará la toma de decisiones al pueblo."
 HOL_d66_rule_of_law: "Defender el estado de derecho"
 HOL_d66_rule_of_law_desc: "El estado de derecho es vital para una sociedad justa y funcional. D66 se centrará en garantizar la independencia judicial, proteger las libertades civiles y combatir la corrupción a todos los niveles de gobernanza."
 HOL_d66_climate_action_plan: "Aplicar un plan de acción sobre el clima"
 HOL_d66_climate_action_plan_desc: "La crisis climática es uno de los mayores desafíos de nuestro tiempo. Mediante la adopción de medidas decisivas, incluida la reducción de las emisiones y la promoción de la energía renovable, el D66 dirigirá la carga hacia un futuro sostenible."
 HOL_d66_green_energy: "Ampliar las inversiones en energía verde"
 HOL_d66_green_energy_desc: "Transitioning to renewable energy sources is key to secure a cleaner, greener future. D66 priorizará las inversiones en proyectos eólicos, solares y de energía sostenible para reducir nuestra dependencia de los combustibles fósiles."
 HOL_d66_european_initiative: "Fortalecimiento de la cooperación europea"
 HOL_d66_european_initiative_desc: "D66 cree que la Unión Europea es esencial para nuestra prosperidad y seguridad colectivas. El fortalecimiento de los vínculos con la UE garantizará que los Países Bajos sigan siendo un miembro influyente de la comunidad europea."
 HOL_d66_social_progress: "Avances del progreso social"
 HOL_d66_social_progress_desc: "La igualdad, la inclusividad y la justicia son piedras angulares de una sociedad progresista. D66 defenderá las políticas para combatir la desigualdad, proteger a las minorías y promover la igualdad de oportunidades para todos los ciudadanos."
 HOL_d66_education_investments: "Invertir en educación"
 HOL_d66_education_investments_desc: "La educación es la clave para desbloquear el potencial de las generaciones futuras. El D66 dará prioridad a la financiación y la reforma para garantizar que todos los niños tengan acceso a una educación de alta calidad."
 HOL_sgp: "Staatkundig Gereformeerde Partij"
 HOL_sgp_desc: "El Staatkundig Gereformeerde Partij (SGP) es un bastión del conservadurismo cristiano. Dedicado a la gobernanza bajo principios bíblicos, el SGP aboga por una sociedad moral arraigada en la fe, la familia y la tradición."
 HOL_gl: "GroenLinks"
 HOL_gl_desc: "GroenLinks está dedicada a una sociedad sostenible, justa e inclusiva. Arraigado en el ambientalismo y la justicia social, el partido promueve la energía verde, la biodiversidad y la igualdad como piedra angular del futuro de los Países Bajos."
 HOL_asml_high_na_euv: "Litografía Pioneer High-NA EUV"
 HOL_asml_high_na_euv_desc: "Los sistemas TWINSCAN EXE de próxima generación de ASML empujan la litografía a una abertura numérica de 0.55, imprimiendo circuitos más finos que cualquier rival puede coincidir. Mastering High-NA EUV mantiene nuestras máquinas indispensables para todas las fundaciones de vanguardia en la Tierra."
 HOL_asml_imec_partnership: "Abra el laboratorio conjunto de alto nivel con imec"
 HOL_asml_imec_partnership_desc: "En Veldhoven, ASML y el instituto de investigación operan un laboratorio conjunto de High-NA EUV, dando a los fabricantes de chips y proveedores de materiales su primer acceso a los nuevos escáneres. El laboratorio cementa a los Países Bajos como el terreno de prueba para los semiconductores más avanzados del mundo."
 HOL_asml_brainport_campus: "Ampliar el Campus de Industria del Cerebro"
 HOL_asml_brainport_campus_desc: "Respaldado por un compromiso del gobierno multimillonario, ASML se expande a través del Campus de Industria Cerebro cerca de Eindhoven en lugar de mudarse al extranjero. Nuevas instalaciones de limpieza y proveedores anclan la industria del chip, y sus ingresos fiscales, firmemente en suelo holandés."
 HOL_support_intervention_iraq: "Apoyar la Intervención en Iraq"
 HOL_support_intervention_iraq_desc: "A raíz de los ataques del 11 de septiembre y la creciente inestabilidad en el Oriente Medio, Estados Unidos ha lanzado una intervención militar en Irak, citando la amenaza de las armas de destrucción en masa y la necesidad de desmantelar regímenes autoritarios. Como aliado estrecho de la OTAN y defensor de la seguridad internacional, los Países Bajos deben decidir si apoyar esta operación. Si bien la misión sigue siendo controvertida, unirnos a la coalición reafirmaría nuestra asociación transatlántica y el proyecto de influencia holandesa en los esfuerzos mundiales de seguridad."
 HOL_asml_partnership_USA: "Formar la Asociación Técnica ASML-USA"
 HOL_asml_partnership_USA_desc: "ASML se encuentra en el núcleo de la industria semiconductora mundial, y Estados Unidos busca asegurar su ventaja tecnológica en la creciente brecha entre Oriente y Occidente. Mediante la creación de una alianza estratégica entre los sectores holandés y americano R&D, podemos impulsar la innovación conjunta en la litografía avanzada, la defensa cibernética y la fabricación aeroespacial. Esta asociación fortalecerá nuestra posición en el ecosistema de defensa occidental, pero puede venir con costos diplomáticos."
 HOL_lng_cooperation: "Establecer el Acuerdo Estratégico Shell-LNG"
 HOL_lng_cooperation_desc: "Los desafíos energéticos del siglo XXI exigen resiliencia, diversificación y alianzas estratégicas. Al ampliar la cooperación de GNL con Shell y alinear nuestra logística energética con socios clave, podemos asegurar flujos estables de combustible, mejorar la inversión en infraestructura y reforzar nuestras redes globales de suministro. Sin embargo, una mayor dependencia de las rutas del combustible fósil puede provocar retrocesos ambientales y políticos."
 HOL_d66_climate_action_planidea: "D66 plan de acción climática"
 HOL_d66_climate_action_planidea_desc: "Con un firme compromiso de lucha contra el cambio climático, el Plan de Acción sobre el Clima D66 acelera la transición hacia las energías renovables, prioriza la sostenibilidad y reduce las emisiones, posicionando a los Países Bajos como líder en los esfuerzos ambientales mundiales."
 HOL_shell1: "Concha real"
 HOL_shell1_desc: "Shell, oficialmente conocida como Royal Dutch Shell, es una empresa multinacional de petróleo y gas con sede en La Haya (Países Bajos) e incorporada en el Reino Unido. Establecida en 1907, Shell es una de las mayores empresas energéticas de todo el mundo, involucradas en todos los aspectos de la industria del petróleo y gas, incluyendo exploración, producción, refinación y distribución. La empresa también tiene importantes intereses en la infraestructura de energía renovable y vehículos eléctricos."
 HOL_shell2a: "Real cáscara verde"
 HOL_shell2a_desc: "Shell, un gigante energético mundial, se centra cada vez más en la transición hacia un futuro sostenible. La empresa ha establecido metas ambiciosas para convertirse en un negocio de energía de emisiones net-zero para 2050. Shell está invirtiendo fuertemente en fuentes de energía renovables, incluyendo viento, energía solar y biocombustibles, y está ampliando su presencia en infraestructura de vehículos eléctricos. Mediante iniciativas como la captura y almacenamiento de carbono, Shell pretende reducir significativamente su huella de carbono. Este cambio hacia la energía más verde es parte de la estrategia más amplia de Shell para adaptarse a la creciente demanda mundial de soluciones energéticas más limpias y sostenibles."
 HOL_shell2b: "Concha real"
 HOL_shell2b_desc: "Shell, una de las mayores compañías petroleras y gas del mundo, sigue siendo una fuerza dominante en la industria del combustible fósil. Con una vasta red de operaciones que abarcan la exploración, extracción, refinación y distribución, Shell desempeña un papel crucial en el suministro de las necesidades energéticas mundiales. La empresa cuenta con extensas reservas e infraestructura dedicadas a la producción de petróleo y gas natural, contribuyendo significativamente al consumo energético mundial. A pesar de las crecientes inversiones en energía renovable, el negocio central de Shell sigue dependiendo en gran medida de los combustibles fósiles, lo que hace que sea un jugador clave en el panorama energético mundial en curso."
 HOL_dutch_trade1: "Legendary Traders"
 HOL_dutch_trade1_desc: "Los comerciantes holandeses tienen una larga historia, desempeñando un papel fundamental en el comercio mundial desde la Edad Dorada del siglo XVII. Los Países Bajos, con su ubicación estratégica y amplia red de puertos, han sido un centro para el comercio internacional durante siglos. Los comerciantes holandeses fueron decisivos para establecer rutas comerciales globales, en particular a través de la Compañía Holandesa de la India Oriental (VOC), que fue una de las primeras corporaciones multinacionales del mundo. En la actualidad, los comerciantes holandeses siguen influyendo en el mercado mundial, especialmente en sectores como la agricultura, la logística y las finanzas. Los comerciantes holandeses son conocidos por su experiencia en logística, innovación en gestión de cadenas de suministro y fuertes conexiones internacionales, que ayudan a mantener la reputación de Holanda como un actor clave en el comercio mundial."
 HOL_project_beethoven_state_idea1: "Proyecto Beethoven"
 HOL_project_beethoven_state_idea1_desc: "El proyecto Beethoven es una iniciativa importante del gobierno holandés, en colaboración con las autoridades regionales, para invertir el fortalecimiento del clima empresarial y la infraestructura para el sector de microchip en Brainport Eindhoven. El proyecto pretende reforzar la competitividad global de la región en tecnología semiconductora abordando necesidades críticas como el desarrollo de talentos, las mejoras de infraestructura y la vivienda. Esta inversión se considera esencial para mantener la posición de los Países Bajos como un centro líder para la industria de alta tecnología, con énfasis específico en retener a actores clave como el ASML en el país."
 HOL_randstad_economy1: "Randstad Economie"
 HOL_randstad_economy1_desc: "La economía Randstad se refiere a la potencia económica de los Países Bajos, que abarca la zona altamente urbanizada y densamente poblada alrededor de las ciudades de Amsterdam, Rotterdam, La Haya y Utrecht. Esta región es uno de los centros económicos más importantes de Europa, contribuyendo significativamente a la economía holandesa. El Randstad se caracteriza por una base económica diversa, con sectores clave como finanzas, logística, tecnología, industrias creativas y comercio. Amsterdam sirve como un importante centro financiero, mientras que Rotterdam alberga uno de los puertos más grandes del mundo, crucial para el comercio internacional. La región también se beneficia de una mano de obra altamente cualificada, una infraestructura sólida y un fuerte énfasis en la innovación y la sostenibilidad, lo que hace de ella un motor crítico del crecimiento económico en los Países Bajos."
 HOL_zuidas_development_idea: "Desarrollo Zuidas"
 HOL_zuidas_development_idea_desc: "El desarrollo de Zuidas es un proyecto urbano a gran escala en Amsterdam, destinado a crear un distrito empresarial dinámico y una zona de uso mixto que sirva como centro internacional para el comercio, las finanzas y los servicios jurídicos. A menudo se conoce como la Milla Financiera de los Países Bajos, Zuidas es el hogar de numerosas empresas multinacionales, bufetes de abogados e instituciones financieras. El desarrollo está diseñado para ser más que un centro de negocios, con amplias zonas residenciales, servicios culturales, espacios verdes e infraestructura de alta calidad, incluyendo excelentes conexiones de transporte público."
 HOL_international_peace_city_idea: "La Ciudad Internacional de la Paz de La Haya &"
 HOL_international_peace_city_idea_desc: "La Haya es reconocida internacionalmente como Ciudad de la Paz y la Justicia, un título que refleja su papel como centro mundial del derecho internacional y la diplomacia. Inicio de más de 200 organizaciones internacionales, La Haya acoge instituciones clave como la Corte Internacional de Justicia, la Corte Penal Internacional y la Corte Permanente de Arbitraje. Estas instituciones desempeñan un papel crucial en la solución de controversias internacionales, el enjuiciamiento de crímenes de guerra y la promoción de los derechos humanos a nivel mundial."
 HOL_regio_economy1: "Ecológico van de Provinciën"
 HOL_regio_economy1_desc: "El poder económico de los Países Bajos se ve cada vez más impulsado por las fortalezas de sus regiones. En el norte, provincias como Groningen sobresalen en energía renovable, mientras que las provincias orientales como Gelderland son centros de fabricación y logística avanzadas. Las provincias del sur, incluyendo el Brabante Norte, lideran industrias de alta tecnología como semiconductores y biotecnología. Esta diversidad regional garantiza una economía nacional equilibrada y resiliente, y cada área contribuye significativamente a la prosperidad general del país y a la competitividad global."
 HOL_marine_moving: "Movimiento marítimo"
 HOL_marine_moving_desc: "El gobierno holandés decidió trasladar a los Korps Mariniers de su base actual en Doorn a una nueva instalación en Vlissingen. Esta medida tenía por objeto proporcionar a los marinos una infraestructura moderna y mejorar sus capacidades operacionales. La elección de Vlissingen, en la provincia de Zeeland, también tenía por objeto estimular el desarrollo económico regional y ofrecer a los marinos un lugar estratégico cerca del Mar del Norte. Sin embargo, el plan de reubicación se enfrentaba a la resistencia debido a las preocupaciones sobre los efectos en el personal y sus familias, así como a los problemas logísticos y financieros."
 HOL_marine_moved: "Base Marina Moderna"
 HOL_marine_moved_desc: "Se ha completado con éxito la reubicación de los Korps Mariniers a su nueva base en Vlissingen. Los marines ahora operan desde instalaciones de última generación que mejoran significativamente su disposición operacional. La nueva ubicación en Vlissingen ofrece ventajas estratégicas, incluido el rápido acceso al Mar del Norte para operaciones marítimas. La iniciativa también ha contribuido al crecimiento económico en Zeeland, creando empleos y atrayendo inversiones a la región. A pesar de los retos iniciales y la resistencia durante la fase de planificación, la transición ha sido fluida y los marinos se han adaptado efectivamente a su nuevo entorno."
 HOL_marine_debate: "Debate sobre la reubicación marina"
 HOL_marine_debate_desc: "La reubicación de los Marines está siendo discutida en el Parlamento, retrasando el proceso y dando lugar a la incertidumbre dentro de las fuerzas armadas."
 HOL_marine_public_support: "Apoyo público para la reubicación marina"
 HOL_marine_public_support_desc: "El gobierno y el público están a favor de la reubicación de los Marines a Vlissingen, impulsando la moral y eficiencia de los Marines."
 HOL_marine_relocation_cancelled: "Reubicación marítima cancelada"
 HOL_marine_relocation_cancelled_desc: "El plan para trasladar a los Marines a Vlissingen ha sido desechado. Esta decisión restablece la estabilidad, pero reduce la capacidad de los Marines para las operaciones."
 HOL_local_communities_support: "Apoyo comunitario local para la reubicación"
 HOL_local_communities_support_desc: "Las inversiones en las comunidades locales que rodean a Vlissingen han mejorado el apoyo público para la reubicación marina, lo que ha impulsado el crecimiento económico local y la capacidad de producción."
 HOL_marine1: "Koninklijke Marine"
 HOL_marine1_desc: "La Marina Koninklijke, o la Armada Real de los Países Bajos, es la rama naval de las Fuerzas Armadas holandesas y una de las más antiguas del mundo, con orígenes que datan del siglo XV. Desempeña un papel crucial en la defensa de los Países Bajos, tanto en el país como en el extranjero, y también participa en diversas misiones internacionales, incluidas operaciones de la OTAN, mantenimiento de la paz y actividades humanitarias. La Royal Netherlands Navy es conocida por su flota avanzada y versátil, que incluye fragatas, submarinos, buques de patrulla y barcos anfibios. La armada también opera una serie de aeronaves y helicópteros, principalmente para patrullas marítimas, transportes y misiones de búsqueda y salvamento. Los Korps Mariniers, el cuerpo marino de élite neerlandés, forman parte integral de la marina, especializada en operaciones anfibias y misiones de respuesta rápida."
 HOL_submarine_modernization_idea: "Modernización submarina"
 HOL_submarine_modernization_idea_desc: "La modernización submarina es una iniciativa clave para la Armada Real de los Países Bajos, centrada en el mejoramiento de los submarinos de clase Walrus. Estas mejoras incluyen sistemas avanzados de sonar, mejores características de sigilo y armamento mejorado, asegurando que los submarinos sigan siendo efectivos en las operaciones navales modernas. La modernización tiene por objeto ampliar la vida útil de los submarinos y mantener su relevancia estratégica en las actividades mundiales de seguridad marítima."
 HOL_cmp_idea: "Commissariaat Militaire Productie"
 HOL_cmp_idea_desc: "El Commissariaat Militaire Productie (CMP), o Comisario de Producción Militar, fue un órgano gubernamental holandés establecido para supervisar y coordinar la producción de equipo militar y suministros. Su papel principal era garantizar que las fuerzas de defensa de los Países Bajos estuvieran adecuadamente equipadas, especialmente durante tiempos de conflicto o mayor preparación militar. La CP/RP se encargó de gestionar los contratos con las industrias nacionales, regular la producción de armas, municiones, vehículos y otras necesidades militares, y velar por que esos contratos se elaboraran para cumplir las normas y plazos necesarios."
 HOL_army2: "Koninklijke Landmacht"
 HOL_army2_desc: "El Koninklijke Landmacht, o Royal Netherlands Army, es la rama terrestre de las Fuerzas Armadas holandesas, con raíces que datan del siglo XVI. Es responsable de la defensa del territorio holandés y contribuye a misiones internacionales, incluyendo operaciones de mantenimiento de la OTAN y ONU. El ejército está equipado con vehículos modernos, artillería y sistemas de comunicación. El Real Ejército de los Países Bajos es una fuerza versátil, dispuesta a hacer frente a diversos problemas de seguridad tanto en el país como en el extranjero."
 HOL_defensienota_idea: "Defensienota 2022"
 HOL_defensienota_idea_desc: "El Defensienota 2022 es un documento de política estratégica que indica la dirección y prioridades futuras del Ministerio de Defensa holandés. Aborda el entorno de seguridad global cambiante, enfatizando la necesidad de una fuerza de defensa más fuerte y adaptable. Los temas clave incluyen el aumento del gasto en defensa, la modernización de las capacidades militares y una mayor cooperación internacional, especialmente dentro de la OTAN y la Unión Europea. El documento destaca las inversiones en ciberdefensa, inteligencia y tecnología avanzada, así como la expansión del personal y los niveles de preparación. El Defensienota 2022 tiene por objeto garantizar que las Fuerzas Armadas de Holanda estén preparadas para hacer frente a las amenazas actuales y emergentes, contribuyendo tanto a la seguridad nacional como a la estabilidad mundial."
 HOL_air: "Koninklijke Luchtmacht"
 HOL_air_desc: "El Koninklijke Luchtmacht, o la Real Fuerza Aérea de los Países Bajos, es el grupo aéreo de las Fuerzas Armadas Neerlandesas, encargado de defender el espacio aéreo holandés y apoyar las operaciones militares nacionales e internacionales. Establecida en 1953, la Fuerza Aérea opera una flota moderna que incluye aviones de combate, aeronaves de transporte, helicópteros y vehículos aéreos no tripulados (VA). Desempeña un papel crucial en las misiones de la OTAN, la policía aérea y la capacidad de despliegue rápido. El Koninklijke Luchtmacht también participa en la ayuda humanitaria, la respuesta a los desastres y contribuye a la seguridad de los territorios holandeses de ultramar. Con su tecnología avanzada y personal altamente capacitado, la Royal Netherlands Air Force es un componente clave de la estrategia de defensa del país."
 HOL_dutch_army_doctrine1: "Nederlandse Defensievisie"
 HOL_dutch_army_doctrine1_desc: "The Nederlandse Defensievisie es un documento estratégico que describe la visión y los objetivos a largo plazo del Ministerio de Defensa holandés. Proporciona un marco para el desarrollo y la adaptación de las fuerzas armadas neerlandesas a fin de hacer frente a los futuros problemas de seguridad. La Defensievisie se centra en mejorar la flexibilidad, la resiliencia y las capacidades tecnológicas de los militares en respuesta a un entorno de seguridad mundial cada vez más complejo e impredecible."
 HOL_dutch_army_doctrine_change: "Nederlandse Defensievisie Transitie"
 HOL_dutch_army_doctrine_change_desc: "El espíritu nacional Nederlandse Defensievisie Transitie representa una fase crucial de transformación para las fuerzas armadas holandesas. Significa un período de modernización y adaptación, centrándose en desarrollar nuevas capacidades, mejorar la defensa cibernética y fortalecer la cooperación internacional. Este Espíritu nacional destaca el impulso de aumentar la resiliencia y flexibilidad del ejército, preparándolo para enfrentar los desafíos del siglo XXI. Representa el esfuerzo colectivo para alinear la defensa holandesa con las cambiantes necesidades de seguridad global, equilibrando la tradición con la innovación."
 HOL_marechaussee1: "Koninklijke Marechaussee"
 HOL_marechaussee1_desc: "El Koninklijke Marechaussee, la Policía Militar Real de los Países Bajos, desempeña un papel crucial en el mantenimiento de la seguridad nacional y la aplicación de la ley. El Marechaussee, responsable del control fronterizo, la seguridad aeroportuaria y la policía militar, garantiza la seguridad y estabilidad de los Países Bajos tanto en el país como en el extranjero. Su experiencia en la gestión de la seguridad interna, la inmigración y el orden público los convierte en una fuerza indispensable dentro de la estructura de defensa holandesa. Como unidad bien capacitada y altamente adaptable, apoyan tanto las operaciones civiles como militares, contribuyendo a la resiliencia de la nación en tiempos de crisis."
 HOL_paars1: "El gobierno púrpura pone fin a su reinado"
 HOL_paars1_desc: "El legado del gabinete 'Paars II' es uno de innovación, pragmatismo y gobernanza equilibrada, reflejando el diverso paisaje político de los Países Bajos y sentando un precedente para futuros gobiernos de coalición."
 HOL_dbb: "Servicio de Seguridad y Protección"
 HOL_dbb_desc: "El Servicio de Seguridad y Protección (Dienst Bewaken en Beveiligen, DBB) es la piedra angular de salvaguardar las figuras más destacadas del país y los activos críticos. Con la protección de líderes políticos, miembros de la familia real y lugares sensibles, el DBB funciona con vigilancia y profesionalidad sin igual."
 HOL_debt_reduction: "Reducción de la deuda"
 HOL_debt_reduction_desc: "Bajo la dirección de Gerrit Zalm, el VVD impulsa la responsabilidad fiscal mediante una reducción selectiva de la deuda, fortaleciendo la economía y asegurando la estabilidad financiera a largo plazo."
 HOL_liberal_society_modifier: "Sociedad liberal"
 HOL_economy_education_research: "Reforma de la educación impulsada por el mercado"
 HOL_economy_education_research_desc: "El VVD se centra en alinear los programas educativos con las demandas del mercado para equipar a los estudiantes con habilidades que están en alta demanda. Al superar la brecha entre la educación y la fuerza de trabajo, aumentamos la empleabilidad y impulsamos el crecimiento económico, asegurando que las generaciones futuras estén bien preparadas para tener éxito en un mercado laboral cada vez más cambiante."
 HOL_ministry_of_family1: "Ministerio de la Familia"
 HOL_ministry_of_family1_desc: "El Ministerio de la Familia se dedica a apoyar el bienestar de las familias en los Países Bajos. Desarrolla y aplica políticas relacionadas con el cuidado de niños, la licencia parental y los servicios de apoyo a la familia, asegurando que las familias tengan acceso a los recursos que necesitan para prosperar. El ministerio trabaja para crear un entorno nutritivo que fomente el desarrollo saludable y fortalezca los vínculos familiares."
 HOL_weed_center1: "Política holandesa de Cannabis"
 HOL_weed_center1_desc: "Los Países Bajos son conocidos por su enfoque único del cannabis, donde la posesión y venta en 'coffeeshops' con licencia se toleran bajo estrictas regulaciones. Esta política pragmática tiene por objeto separar los mercados de drogas blandos y duros al tiempo que reduce la actividad delictiva. Aunque técnicamente ilegal, el cannabis es efectivamente despenalizado para uso personal, lo que refleja un enfoque equilibrado entre la salud pública, la seguridad y la libertad personal."
 HOL_unhcr1: "Supervisión del ACNUR en materia de migración"
 HOL_unhcr1_desc: "El Alto Comisionado de las Naciones Unidas para los Refugiados (ACNUR) supervisa ahora las políticas y procesos de migración gestionados anteriormente por los Países Bajos. Esta transición tiene por objeto garantizar que se mantengan las normas internacionales para la protección y el apoyo de los refugiados y migrantes, proporcionando un enfoque más coordinado y humano para hacer frente a los desafíos mundiales en materia de migración."
 HOL_balkenende_legend: "Legado de Balkenende"
 HOL_balkenende_legend_desc: "El mandato de Jan Peter Balkenende como Primer Ministro está marcado por su énfasis en la cohesión social, responsabilidad y estabilidad económica. Su visión de una sociedad «normen en waarden» (normas y valores) apuntaba a reforzar los fundamentos morales y éticos de los Países Bajos. El Legado Balkenende sigue influyendo en la política holandesa, promoviendo un enfoque equilibrado de gobernanza que valore tanto la responsabilidad comunitaria como la individual."
 HOL_green_socialism1: "Socialismo verde"
 HOL_green_socialism1_desc: "El PvdA prevé un futuro donde la justicia social y la sostenibilidad ambiental van de la mano. El socialismo verde aboga por una sociedad justa y equitativa que priorice el bienestar de las personas y del planeta. Mediante políticas climáticas ambiciosas, la inversión en energía renovable y una transición justa para los trabajadores, el PvdA pretende crear una economía sostenible que no deja atrás a nadie."
 HOL_monarchy_law_blocking: "Monarch's Retribution"
 HOL_monarchy_law_blocking_desc: "Ante la negativa del gobierno a aprobar el matrimonio real, la monarquía ha dado un paso extraordinario para bloquear la legislación clave como forma de retribución. Este acto de desafío ha sumido el paisaje político en el caos, con la familia real utilizando su influencia para desafiar la autoridad del gobierno. A medida que aumentan las tensiones, esta intervención sin precedentes ha suscitado un debate nacional sobre el papel y el poder de la monarquía en la gobernanza moderna."
 HOL_monarch_public_campaign: "Onda de Apoyo Público"
 HOL_monarch_public_campaign_desc: "En respuesta a la negativa del gobierno de aprobar el matrimonio real, ha surgido una campaña masiva de presión pública. Los ciudadanos de todo el país se están reuniendo detrás de la pareja real, organizando manifestaciones, firmando peticiones y exigiendo que el gobierno reconsidere su postura. Esta ola de apoyo ha ejercido una inmensa presión sobre los líderes políticos, destacando la lealtad del pueblo a la monarquía y su deseo de que el derecho al amor y al matrimonio trascienda las fronteras políticas."
 HOL_monarch_backlash: "Desilusión pública"
 HOL_monarch_backlash_desc: "La decisión de la pareja real de seguir adelante con el matrimonio a pesar de que la negativa del gobierno ha llevado a una ola de descontento público. Muchos ven esto como la monarquía superando sus límites y ignorando los procesos democráticos. El retroceso ha sido rápido, con ciudadanos cuestionando la relevancia de la monarquía en la sociedad moderna. Los llamamientos a la reforma e incluso a la abolición están ganando tracción como confianza en los erosiones de la familia real."
 HOL_pro_gay_marriage: "Primer Gay Aprobado Matrimonio"
 HOL_pro_gay_marriage_desc: "Los Países Bajos se han convertido en un líder mundial en el progreso social y los derechos humanos mediante la legalización del matrimonio entre personas del mismo sexo. Este movimiento ha reforzado la imagen de la nación como una sociedad tolerante e incluyente, impulsando tanto la unidad nacional como el prestigio internacional."
 HOL_anti_gay_marriage: "Ley de matrimonio tradicional"
 HOL_anti_gay_marriage_desc: "La decisión de mantener las leyes tradicionales del matrimonio refleja una firme adhesión a los valores conservadores. Mientras resuena con grupos religiosos y tradicionalistas, también ha provocado críticas de voces más progresistas y ha afectado la reputación del país como faro del liberalismo en Europa."
 HOL_labour_market_reforms_idea: "Reformas del mercado de trabajo"
 HOL_labour_market_reforms_idea_desc: ""
 HOL_strong_social_security: "Seguridad social fuerte"
 HOL_strong_social_security_desc: ""
 HOL_poverty_reduction_idea: "Iniciativa para la reducción de la pobreza"
 HOL_poverty_reduction_idea_desc: "Los Países Bajos han puesto en marcha una iniciativa amplia encaminada a reducir la pobreza. Mediante el aumento de las prestaciones sociales, el apoyo específico a las poblaciones vulnerables y la asistencia económica, el Gobierno está tratando de elevar a los miembros más desfavorecidos de la sociedad. Este programa está diseñado para crear una economía más equitativa e incluyente."
 HOL_poverty_reduced: "Reducción significativa de la pobreza"
 HOL_poverty_reduced_desc: "Mediante la aplicación satisfactoria de los programas de bienestar social y las reformas sociales, se ha reducido considerablemente la pobreza en los Países Bajos. El enfoque de la nación en la inclusividad económica y el apoyo a los desfavorecidos ha dado lugar a una mayor estabilidad social, mayores niveles de vida y una economía más fuerte y resistente."
 HOL_digital_literacy_idea: "Campaña de Alfabetización Digital"
 HOL_digital_literacy_idea_desc: "Los Países Bajos han lanzado una campaña nacional para mejorar la alfabetización digital en todos los sectores de la sociedad. Al proporcionar a los ciudadanos las habilidades necesarias para prosperar en la era digital, el gobierno está asegurando que la fuerza de trabajo esté equipada para manejar avances tecnológicos, aumentar la productividad y fomentar la innovación en la economía."
 HOL_economic_resilience_idea: "Iniciativa de resiliencia económica"
 HOL_economic_resilience_idea_desc: "El gobierno holandés ha implementado políticas integrales dirigidas a fortalecer la resiliencia de la economía a las crisis globales. Al diversificar los sectores económicos, apoyar a las pequeñas empresas y garantizar una sólida red de seguridad social, los Países Bajos están mejor preparados para hacer frente a los retos futuros y mantener la estabilidad económica."
 HOL_financial_sector_idea: "Reforma del Sector Financiero"
 HOL_financial_sector_idea_desc: "Las reformas amplias en el sector financiero son esenciales para prevenir las crisis futuras y promover la transparencia y la rendición de cuentas. Bajo el liderazgo de Wouter Bos, regularemos la industria financiera con eficacia, asegurando estabilidad y confianza en el mercado. Estas reformas crearán una economía más resiliente, capaz de soportar desafíos globales y reducir el riesgo de colapso económico."
 HOL_afriforum1HOL: "Asociación y protección de Afrikaner"
 HOL_afriforum1HOL_desc: "Los Países Bajos han profundizado su relación con la comunidad afrikaner en Sudáfrica, ofreciendo apoyo económico y un compromiso para proteger el patrimonio cultural y lingüístico de Afrikaner. Esta asociación garantiza el acceso a los recursos, al tiempo que simboliza un nuevo vínculo arraigado en la historia compartida y el respeto mutuo."
 HOL_afriforum1SAF: "Alianza holandesa-afrikaner"
 HOL_afriforum1SAF_desc: "La comunidad afrikaner ha fortalecido su alianza con los Países Bajos, fomentando la preservación cultural, la colaboración económica y una red de apoyo. A través de la influencia holandesa, los afrikaners ganan un aliado en sus esfuerzos por salvaguardar su identidad y autonomía económica dentro de Sudáfrica."
 HOL_fatherland_education_idea: "Educación en el país"
 HOL_fatherland_education_idea_desc: "La educación paterna se centra en inculcar un sentido del orgullo nacional, el patrimonio y la responsabilidad en nuestros jóvenes. Al enfatizar la historia, los valores y la cultura holandesas en el currículo, buscamos fomentar una ciudadanía fuerte y unida equipada para preservar y mantener nuestras tradiciones e identidad nacional."
 HOL_stadtholderate1: "Reinó Stadtholder"
 HOL_stadtholderate1_desc: "El holandés Stadtholder lidera una nueva era de gobierno, equilibrando los principios de la monarquía con las tradiciones democráticas. Poniendo de relieve el empoderamiento local y la reforma constitucional, el titular de Stadt procura unir a los Países Bajos con una visión de libertad, progreso y liderazgo firme."
 HOL_monarchy1: "Y País Unidos"
 HOL_monarchy1_desc: "Los Países Bajos han abrazado su patrimonio real, con la monarquía de pie como un pilar de identidad y estabilidad nacionales. Bajo la mirada vigilante de la Corona, la nación avanza, fomentando el orgullo cultural y asegurando un gobierno fuerte centralizado dedicado a la prosperidad de su pueblo."
 HOL_voc_semiconductor_control_HOL: "Controlar la industria semiconductora en §Y[TAI.GetNameWithFlag]§!"
 HOL_voc_semiconductor_control_HOL_desc: "A través de inversiones estratégicas y asociaciones, los Países Bajos han adquirido control sobre la industria semiconductora altamente codiciada de Taiwán. Con la tecnología de litografía avanzada de ASML en el núcleo de este dominio, los holandeses ahora mantienen las riendas de la producción mundial de semiconductores, asegurando una ventaja crítica en la era tecnológica moderna."
 HOL_voc_semiconductor_control_TAI: "[HOL.GetAdjective] Sobre la industria semiconductora de Taiwán"
 HOL_voc_semiconductor_control_TAI_desc: "La industria semiconductora de Taiwán, la sangre vital de su economía, ha caído bajo control [HOL.GetAdjective]. Este cambio de poder, liderado por el apalancamiento tecnológico de ASML y la presión económica respaldada por VOC, amenaza la autonomía de Taiwán sobre su industria más crítica mientras coloca su futuro en manos extranjeras."
 HOL_sri_dutch_agriculture_benefits: "Asociación agrícola holandesa"
 HOL_sri_dutch_agriculture_benefits_desc: "Mediante la colaboración con los Países Bajos, Sri Lanka ha adquirido acceso a técnicas y recursos agrícolas modernos, lo que ha impulsado la producción de alimentos y el crecimiento económico en todo el país."
 HOL_sri_agriculture_collaboration: "Colaboración agrícola de Sri Lanka"
 HOL_sri_agriculture_collaboration_desc: "Al compartir los conocimientos especializados holandeses en materia de agricultura con Sri Lanka, los Países Bajos han conseguido una base vital en la región, potenciando la influencia y restableciendo la conexión con este territorio histórico."
 HOL_voc_indonesian_focus: "VOC: indonesio Enfoque"
 HOL_voc_indonesian_focus_desc: "La VOC restablecida ha puesto sus puntos de vista sobre la reivindicación de la dominación en Indonesia, el corazón de su imperio histórico. Con esfuerzos concentrados en la revitalización económica, el control estratégico y el fomento de la influencia local, este objetivo es reafirmar el poder holandés en la región y asegurar sus valiosos recursos."
 HOL_voc_penalty_operation_extension: "Aplicación de la pena de prórroga"
 HOL_voc_penalty_operation_extension_desc: "Al extender nuestras operaciones en Indonesia en lugar de declarar la guerra, hemos retrasado la acción decisiva, causando tensión política, reducción de estabilidad e ineficiencias en nuestra industria."
 HOL_voc_ambassy_expansion_ind: "Ampliar Embajada de Holanda en Indonesia"
 HOL_voc_ambassy_expansion_ind_desc: "La expansión de la embajada holandesa en Indonesia sirve como una iniciativa estratégica para profundizar los vínculos diplomáticos, ejercer influencia y facilitar las operaciones encubiertas. Al reforzar nuestra presencia, podemos posicionarnos mejor para futuros esfuerzos en la región."
 HOL_d66_democratic_institutions_idea: "Fortalecimiento de las instituciones democráticas"
 HOL_d66_democratic_institutions_idea_desc: "Los esfuerzos por reforzar los procesos democráticos han aumentado la confianza pública en la gobernanza. Con mayor transparencia, rendición de cuentas y participación ciudadana, los Países Bajos son un modelo de democracia moderna y efectiva."
 HOL_gl_affordable_housing_plan_idea: "Iniciativa de vivienda asequible"
 HOL_gl_affordable_housing_plan_idea_desc: "Con importantes inversiones en viviendas sostenibles y asequibles, los Países Bajos están haciendo frente a la crisis de la vivienda. Esta iniciativa garantiza que todos los ciudadanos tengan acceso a un hogar seguro, seguro y ecológico."
 HOL_gl_international_solidarity_idea: "Internacional Solidaridad"
 HOL_gl_international_solidarity_idea_desc: "GroenLinks ha fomentado sólidas asociaciones internacionales para hacer frente a los desafíos mundiales. Al promover la paz, los derechos humanos y el desarrollo sostenible, los Países Bajos son un faro de cooperación y progreso en la etapa mundial."
 HOL_gl_transparent_government_idea: "Gobernanza transparente"
 HOL_gl_transparent_government_idea_desc: "Con un compromiso inquebrantable con la rendición de cuentas y la apertura, GroenLinks ha asegurado que el gobierno actúe transparentemente, facultando a los ciudadanos para confiar en su liderazgo y participar en él."
 HOL_gl_diversify_workforce_idea: "Diversificada fuerza de trabajo"
 HOL_gl_diversify_workforce_idea_desc: "Mediante políticas inclusivas y programas de igualdad de oportunidades, GroenLinks ha fomentado una fuerza de trabajo que refleja la diversidad y fortaleza de la sociedad holandesa, garantizando la equidad y la innovación en todos los sectores."
 HOL_gl_fair_trade_idea: "Acuerdo de la Coalición para el Comercio"
 HOL_gl_fair_trade_idea_desc: "Como parte del acuerdo de coalición negociado con GroenLinks, el gobierno se ha comprometido a un nuevo marco de comercio internacional. Dirigida por la agenda progresista de GroenLinks, la política comercial enfatiza ahora la responsabilidad ecológica, los derechos de los trabajadores y la justicia social sobre el beneficio puro. Esto marca un cambio claro de los modelos tradicionales impulsados por el mercado a una visión económica basada en valores."
 HOL_d66_rule_of_law_idea: "Defender el estado de derecho"
 HOL_d66_rule_of_law_idea_desc: "D66 ha conseguido reformas jurídicas fundamentales como parte del acuerdo de coalición, reafirmando la independencia del poder judicial, la transparencia en la gobernanza y la estricta adhesión a las normas constitucionales. En un momento de presión populista y fragmentación política, estas medidas tienen por objeto salvaguardar las instituciones democráticas y el estado de derecho en el país y en el extranjero."
 HOL_asml1: "ASML"
 HOL_asml1_desc: "El liderazgo de ASML en la litografía coloca a los Países Bajos en el corazón de la industria mundial de microchip. Este dominio acelera nuestra investigación en la fabricación de computadoras y chips al mismo tiempo que convierte las exportaciones semiconductoras en una fuente constante de ingresos nacionales."
 HOL_caribbean_naval_cooperation: "Cooperación naval conjunta del Caribe"
 HOL_caribbean_naval_cooperation_desc: "El Programa Naval Conjunto del Caribe fortalece nuestra marina, permitiéndonos coordinar las estrategias de entrenamiento, patrullas marítimas y defensa junto a la Marina Real de Holanda."
 HOL_asml_USA_tech_partnership: "Pacto de integración tecnológica ASML-USA"
 HOL_asml_USA_tech_partnership_desc: "Los Países Bajos y Estados Unidos han entrado en una asociación estratégica de alto nivel centrada en la innovación semiconductora, la defensa cibernética y la fabricación de precisión. La firma holandesa ASML se encuentra en el centro de esta colaboración, concediéndonos una ventaja innovadora en investigación y producción industrial. Sin embargo, una integración más profunda con la infraestructura tecnológica estadounidense ha aumentado nuestra dependencia de la política de exportación de los Estados Unidos y ha debilitado nuestros vínculos comerciales con poderes no alineados."
 HOL_shell_lng_deal: "Acuerdo de Energía Estratégica Shell-LNG"
 HOL_shell_lng_deal_desc: "Mediante un amplio pacto energético con socios internacionales, Shell ha asegurado el acceso de los holandeses a la infraestructura de GNL, la producción de combustible offshore y corredores energéticos globales. Esto aumenta nuestra estabilidad económica y fortalece nuestra red de suministro. La inversión continua en combustibles fósiles genera críticas en el hogar y limita nuestra capacidad para la innovación de alta tecnología en otros sectores."
 HOL_strengthening_eurozone_idea: "Fortalecimiento de la zona euro"
 HOL_strengthening_eurozone_idea_desc: ""
 HOL_social_democratic_modifier: "Sociedad social y democrática"
 HOL_economy: "Países Bajos"
 HOL_economy_desc: "Desde las grúas de Rotterdam hasta los invernaderos de Westland y las salas limpias de Brainport, la economía holandesa prospera como uno de los grandes cruces comerciales de Europa. Centurias del comercio, la recuperación de tierras y la innovación implacable han forjado una central eléctrica abierta impulsada por las exportaciones que abarca agricultura, logística, energía, finanzas y alta tecnología, donde cada nueva empresa agrava la fuerza del conjunto."
 HOL_cmp: "Commissariaat Militaire Productie"
 HOL_cmp_desc: "El Commissariaat Militaire Productie (CMP), o Comisario de Producción Militar, fue un órgano gubernamental holandés establecido para supervisar y coordinar la producción de equipo militar y suministros. Su papel principal era garantizar que las fuerzas de defensa de los Países Bajos estuvieran adecuadamente equipadas, especialmente durante tiempos de conflicto o mayor preparación militar. La CP/RP se encargó de gestionar los contratos con las industrias nacionales, regular la producción de armas, municiones, vehículos y otras necesidades militares, y velar por que esos contratos se elaboraran para cumplir las normas y plazos necesarios."
 HOL_noordzee_parken: "Noordzee Energiepark"
 HOL_army: "Koninklijke Landmacht"
 HOL_army_desc: "El Koninklijke Landmacht, o Royal Netherlands Army, es la rama terrestre de las Fuerzas Armadas holandesas, con raíces que datan del siglo XVI. Es responsable de la defensa del territorio holandés y contribuye a misiones internacionales, incluyendo operaciones de mantenimiento de la OTAN y ONU. El ejército está equipado con vehículos modernos, artillería y sistemas de comunicación. El Real Ejército de los Países Bajos es una fuerza versátil, dispuesta a hacer frente a diversos problemas de seguridad tanto en el país como en el extranjero."
 HOL_navy: "Koninklijke Marine"
 HOL_navy_desc: "La Marina Koninklijke, o la Armada Real de los Países Bajos, es la rama naval de las Fuerzas Armadas Holandesas. Salvaguarda los intereses marítimos holandeses, proyecta el poder en el extranjero y opera estrechamente con flotas aliadas. Este modificador refleja la doctrina acumulativa, la formación y las opciones de adquisición hechas a través del árbol de enfoque naval."
 HOL_economy.027.t: "Nuevo patrocinador del Club de Pueblos"
 HOL_economy.027.d: "Un club deportivo local presenta un nuevo kit pagado por un agricultor lácteo cercano, cuyos digestores ahora se ejecutan en los residuos orgánicos de la ciudad. El municipio quiere marcar la ocasión."
 HOL_economy.027.a: "Cofinanciarlo con fondos municipales"
 HOL_economy.027.b: "Mantenerlo impulsado por la comunidad"
 HOL_megaproject_category: "Megaproyectos nacionales"
 HOL_megaproject_category_desc: "Grandes empresas nacionales, desde ganar terreno al mar hasta infraestructuras emblemáticas, que se desbloquean a medida que los Países Bajos persiguen su gran agenda de desarrollo."
 HOL_space_program_category: "Programa espacial holandés"
 HOL_space_program_category_desc: "El esfuerzo espacial nacional, la coordinación de la infraestructura de lanzamiento, los satélites y las ambiciones tripuladas más allá de la órbita terrestre."
 HOL_future_air_defender_program: "Programa Future Air Defender"
 HOL_future_air_defender_program_desc: "Un programa naval conjunto para construir la fragata de defensa aérea Future Air Defender. Cada miembro ejecuta la construcción como una misión cronometrada; al concluir, los buques terminados entran en servicio directamente. Si Alemania se retira, los Países Bajos pueden sumar a las armadas nórdicas para completar el número y recuperar el tiempo perdido."
 HOL_FAD_invite_partner: "Invitar a un socio al programa"
 HOL_FAD_invite_partner_desc: "Invitar a una armada nórdica al programa Future Air Defender. Cada socio que se une recibe dos fragatas, suma una más al pedido neerlandés y acorta el tiempo de construcción restante."
 HOL_military.089.a: "Autorizar el presupuesto adicional."
 HOL_military.089.b: "Mantenga la asignación actual."
 HOL_mars_invested_budget_tt: "§GEl aumento de la inversión acelera la misión y abre un bono de investigación de construcción cuando se analizan las primeras muestras del suelo.§!"
 HOL_military.090.a: "Financiar el parche completo del software."
 HOL_military.090.b: "Aceptar el trabajo y la demora."
 HOL_military.091.a: "Ampliar la encuesta geológica."
 HOL_military.091.b: "ensamblaje de hábitat prioritario."
 HOL_mars_chromium_found_tt: "§GLos equipos de vigilancia recuperan depósitos adicionales de cromo de la subsuperficie Isidis.§!"
 HOL_military.092.a: "Repara la cúpula inmediatamente."
 HOL_military.092.b: "Sellar el segmento y presionar."
 HOL_mars_software_bonus_tt: "§GEl parche completo del software resolvió la secuencia de acoplamiento limpiamente. El acero estructural recuperado será redirigido a las fundaciones reforzadas de la colonia.§!"
 HOL_military.088.a: "Llámalo Hollanderhaven."
 HOL_military.088.b: "Llámalo Brinkerdam."
 HOL_military.088.c: "Llámalo Brandaanstad."
 HOL_military.088.e: "Llámalo Brammertdelf."
 HOL_mars_mining_colony_tt: "§GLos primeros pozos de extracción de Brammertdelf rompen terreno, produciendo un flujo inmediato de materias primas de la corteza marciana.§!"
 HOL_monarchy.40.t: "La Princesa de Orange Enlists"
 HOL_monarchy.40.d: "La Princesa de la Corona Catharina-Amalia se ha convertido en la primera mujer de la Casa de Orange para servir con uniforme, inscribirse como reservista y completar su entrenamiento militar general. Su ejemplo ha impulsado un fuerte aumento de las aplicaciones a las fuerzas armadas."
 HOL_monarchy.40.a: "Un día orgulloso para la Casa de Orange."
 HOL_monarchy.41.t: "Queen Máxima se une a las reservas"
 HOL_monarchy.41.d: "La reina Máxima ha alistado como reservista en la Real Academia Militar de Breda, siguiendo a su hija en servicio. Ha declarado que ya no se puede conceder la seguridad nacional, y que desea contribuir a ella como cualquier otro ciudadano."
 HOL_monarchy.41.a: "La corona está en pie con las fuerzas armadas."
 HOL_politics.05.c: "Apoyo Rita Verdonk"
 HOL_politics.78.t: "Fricción en el Gabinete"
 HOL_politics.78.d: "Geert Wilders está chocando con la dirección VVD sobre inmigración. Exige una línea mucho más dura de lo que sus colegas aceptarán, y la disputa se está derramando en opinión pública."
 HOL_politics.78.a: "Atrás La postura de la línea dura de Wilders"
 HOL_politics.78.b: "Sostenga el curso moderado"
 HOL_politics.79.t: "Turquía en la puerta de Europa"
 HOL_politics.79.d: "La adhesión turca a la Unión Europea divide al partido. Los Wilders se oponen ferozmente y advierten que la apertura de la dirección alienará a los votantes del VVD."
 HOL_politics.79.a: "Opposesión de la adhesión turca"
 HOL_politics.79.b: "Apoyo a la ampliación de la UE"
 HOL_politics.80.t: "Una línea en la arena"
 HOL_politics.80.d: "Wilders confronta a la dirección sobre la posición del partido en el Islam y la integración, insistiendo en una posición intransigente. Su paciencia se está acabando visiblemente."
 HOL_politics.80.a: "Tome la línea descompromiso"
 HOL_politics.80.b: "Buscar un tono conciliatorio"
 HOL_politics.81.t: "Los salvajes se quedan"
 HOL_politics.81.d: "Por ahora, Geert Wilders permanece dentro del VVD. El liderazgo ha hecho lo suficiente para mantener su inquieto duro dentro de la carpa, y se evita una división dañina."
 HOL_politics.81.a: "Una paz frágil es"
 HOL_voc.1.t: "Una propuesta de la compañía holandesa del este de India"
 HOL_voc.1.d: "Mientras India se sumergía en la guerra civil, el gobierno [HOL.GetAdjectiveCap] y el VOC reavivado han presentado una oferta sorprendente. Proponen una transferencia pacífica de estados indios al control [HOL.GetAdjectiveCap], citando sus vínculos históricos y promesas de estabilidad y prosperidad bajo la administración holandesa. Sin embargo, advierten que el rechazo de esta oferta obligará a los Países Bajos a intervenir militarmente, lo que podría conducir a un conflicto más amplio y al riesgo de perder aún más territorio en la solución de paz. La decisión descansa en tus manos."
 HOL_voc.1.a: "De acuerdo con la transferencia. Estabilidad es primordial."
 HOL_voc.1.b: "Rechazar la oferta. Prepárense para la guerra con el [HOL.GetAdjectiveCap]."
 HOL_voc.2.t: "[HOL.GetAdjectiveCap] Aprovecha el Gujarat Este"
 HOL_voc.2.d: "El [HOL.GetAdjectiveCap] ha explotado la inestabilidad en Gujarat oriental y reclamado el control del estado. Proponen cooperación, pero la alternativa es un enfrentamiento militar."
 HOL_voc.2.a: "¡Retaliate! ¡Esto es un acto de guerra!"
 HOL_voc.2.b: "Rechazar a actuar por ahora. El [HOL.GetAdjectiveCap] puede exagerar."
 HOL_voc.3.t: "[HOL.GetAdjectiveCap] Aprovecha el Bengala Occidental"
 HOL_voc.3.d: "El [HOL.GetAdjectiveCap] ha capitalizado el caos en Bengala Occidental y establecido el control sobre el estado. ¿Aceptarás sus demandas o te prepararás para la guerra?"
 HOL_voc.3.a: "¡Retaliate! ¡Esto es un acto de guerra!"
 HOL_voc.3.b: "Rechazar a actuar por ahora. El [HOL.GetAdjectiveCap] puede exagerar."
 HOL_voc.4.t: "La toma de Kerala [HOL.GetAdjectiveCap]"
 HOL_voc.4.d: "En medio de disturbios crecientes, el [HOL.GetAdjectiveCap] ha reclamado Kerala, citando su influencia histórica en la región. India debe decidir si negociar o tomar represalias."
 HOL_voc.4.a: "¡Retaliate! ¡Esto es un acto de guerra!"
 HOL_voc.4.b: "Rechazar a actuar por ahora. El [HOL.GetAdjectiveCap] puede exagerar."
 HOL_voc.5.t: "[HOL.GetAdjectiveCap] Control Tamil Nadu"
 HOL_voc.5.d: "El [HOL.GetAdjectiveCap] ha aprovechado la inestabilidad en Tamil Nadu para extender su control. ¿Cómo responderá la India a esta flagrante agresión?"
 HOL_voc.5.a: "¡Retaliate! ¡Esto es un acto de guerra!"
 HOL_voc.5.b: "Rechazar a actuar por ahora. El [HOL.GetAdjectiveCap] puede exagerar."
 HOL_voc.6.t: "Solicitud de suspensión de la garantía de Taiwán"
 HOL_voc.6.d: "Los Países Bajos se han acercado a nosotros con la solicitud de suspender nuestra garantía de seguridad para Taiwán, citando sus intenciones de asegurar territorios desde la isla. ¿Estamos de acuerdo con sus demandas?"
 HOL_voc.6.a: "Suspendiendo la garantía."
 HOL_voc.6.b: "Rechazar su solicitud."
 HOL_voc.6.c: "Suspend, pero pide compensación."
 HOL_voc.7.t: "US Accees to Suspend Taiwan Guarantee"
 HOL_voc.7.d: "Los Estados Unidos han acordado suspender su garantía de seguridad para Taiwán, aclarando el camino hacia la acción holandesa contra la isla."
 HOL_voc.7.a: "Procedido con el ultimátum."
 HOL_voc.8.t: "US Refuss to Suspend Taiwan Guarantee"
 HOL_voc.8.d: "Los Estados Unidos se han negado a suspender su garantía de seguridad para Taiwán, complicando los planes holandeses para presionar la isla."
 HOL_voc.8.a: "Reevaluaremos nuestra estrategia."
 HOL_voc.9.t: "Ultimatum holandés a Taiwán"
 HOL_voc.9.d: "Los Países Bajos han emitido un ultimátum a Taiwán, exigiendo la transferencia de [599.GetName] y [1157.GetName]. ¿Cómo responderemos?"
 HOL_voc.9.a: "Aceptar sus demandas."
 HOL_voc.9.b: "Pregúntele al [USA.GetAdjectiveCap] por apoyo."
 HOL_voc.9.c: "Cede los territorios, pero solicite protección [HOL.GetAdjective]"
 HOL_voc.10.t: "Territorios protegidos de Taiwán"
 HOL_voc.10.d: "El gobierno [TAI.GetAdjectiveCap] ha aceptado nuestro ultimátum y transferido el control de los territorios demandados. Esto marca una victoria significativa para la VOC y los Países Bajos, solidificando nuestra influencia en la región y ampliando nuestro alcance en Asia."
 HOL_voc.10.a: "Excelente. El poder de la VOC crece."
 HOL_voc.11.t: "Taiwán Seeks [USA.GetAdjectiveCap] Apoyo"
 HOL_voc.11.d: "Taiwán ha solicitado [USA.GetAdjectiveCap] apoyo para resistir a las demandas [HOL.GetAdjectiveCap]. ¿Cómo responderemos?"
 HOL_voc.11.a: "Presione a Taiwán para someterse."
 HOL_voc.11.b: "Apoyar la soberanía de Taiwán."
 HOL_voc.12.t: "Estados Unidos presiona a Taiwán para que presente"
 HOL_voc.12.d: "Bajo la presión [USA.GetAdjectiveCap], Taiwán debe decidir si someterse a demandas holandesas o resistir y arriesgar la guerra."
 HOL_voc.12.a: "Presentar a [HOL.GetAdjectiveCap] demandas."
 HOL_voc.12.b: "Resistir [HOL.GetAdjectiveCap] agresión, sola."
 HOL_voc.13.t: "Taiwán rechaza nuestro Ultimatum"
 HOL_voc.13.d: "Con el apoyo de los Estados Unidos, Taiwán ha rechazado abiertamente nuestro ultimátum. Este desafío presenta una opción crítica: podemos retirarnos para evitar nuevas escaladas o presionar hacia adelante, arriesgando un conflicto abierto con Taiwán y sus aliados."
 HOL_voc.13.a: "Retirada del ultimátum. Los riesgos son demasiado altos."
 HOL_voc.13.b: "Procedido con el ultimátum. La guerra es inevitable."
 HOL_voc.14.t: "Taiwán rechaza nuestro Ultimatum"
 HOL_voc.14.d: "Taiwán ha rechazado abiertamente nuestras demandas, negándose a ceder los territorios solicitados. Este acto de desafío nos deja sin más remedio que declarar la guerra y afirmar la autoridad holandesa a través de la fuerza."
 HOL_voc.14.a: "¡La guerra es la única respuesta!"
 HOL_voc.15.t: "Taiwán está de acuerdo con los territorios de cede con protección"
 HOL_voc.15.d: "En un giro sorprendente, Taiwán ha acordado transferir los territorios solicitados a los Países Bajos, pero sólo bajo la condición de que los holandeses garanticen la protección de Taiwán contra futuras amenazas. Este arreglo refuerza la influencia holandesa en Asia, pero conlleva un costo de mayor responsabilidad en la región."
 HOL_voc.15.a: "Aceptamos sus términos y garantizamos a Taiwán."
 HOL_voc.16.t: "Estados Unidos exige indemnización para Taiwán"
 HOL_voc.16.d: "Después de permitirnos apoderarse del control de los territorios de Taiwán, Estados Unidos ha exigido ahora una indemnización por su protección suspendida. Sostienen que sus intereses geopolíticos en la región han sido socavados. Podemos estar de acuerdo en pagar la compensación, asegurando relaciones estables, o rechazar y arriesgar conflictos con los estadounidenses."
 HOL_voc.16.a: "Pagar la compensación y preservar la estabilidad."
 HOL_voc.16.b: "Rechazar su demanda y prepararse para la guerra."
 HOL_voc.17.t: "Dutch Oferta Colaboración Agrícola"
 HOL_voc.17.d: "Los Países Bajos se han acercado a nosotros con una oferta para colaborar en la modernización de nuestro sector agrícola. Proponen compartir conocimientos especializados y recursos neerlandeses para mejorar la seguridad alimentaria y la producción económica en Sri Lanka. Sin embargo, esta asociación podría con cadenas adjuntas, lo que podría aumentar la influencia holandesa en la región."
 HOL_voc.17.a: "Aceptar la colaboración. Necesitamos su experiencia."
 HOL_voc.17.b: "Rechazar. Sri Lanka debe mantenerse solo."
 HOL_voc.18.t: "Sri Lanka acepta la colaboración agrícola"
 HOL_voc.18.d: "Sri Lanka ha aceptado nuestra oferta de colaborar en el desarrollo agrícola. Esto marca un nuevo capítulo en las relaciones entre los Países Bajos y Sri Lanka, fortaleciendo nuestra influencia y asegurando beneficios mutuos en la región."
 HOL_voc.18.a: "¡Una alianza prometedora!"
 HOL_voc.19.t: "Sri Lanka rechaza la colaboración agrícola"
 HOL_voc.19.d: "Sri Lanka ha rechazado nuestra oferta de colaboración agrícola. Su renuencia a trabajar con los Países Bajos puede retrasar el desarrollo regional y reducir nuestra influencia en la región."
 HOL_voc.19.a: "Desgraciadamente, pero debemos seguir adelante."
 HOL_voc.20.t: "Oportunidades de inversión de oferta holandesa"
 HOL_voc.20.d: "Los Países Bajos han propuesto un programa de inversión agrícola para mejorar la economía y la producción alimentaria de Sri Lanka. El programa viene en tres niveles, pequeños, medianos o pesados, cada uno ofrece beneficios progresivamente mayores pero requiere mayor compromiso. Por otra parte, Sri Lanka puede rechazar la oferta por completo."
 HOL_voc.20.a: "Aceptar el Programa de Pequeñas Inversiones."
 HOL_voc.20.b: "Aceptar el Programa de Inversión Media."
 HOL_voc.20.c: "Aceptar el Programa de Inversiones Pesadas."
 HOL_voc.20.e: "Rechazar la oferta holandesa."
 HOL_voc.21.t: "Small Investment Program Aceptado"
 HOL_voc.21.d: "Sri Lanka ha aceptado nuestro Programa de Pequeñas Inversiones. Este paso inicial establecerá influencia holandesa y fortalecerá progresivamente su sector agrícola."
 HOL_voc.21.a: "Un buen comienzo."
 HOL_voc.22.t: "Media Investment Program Aceptado"
 HOL_voc.22.d: "Sri Lanka ha aceptado nuestro Programa de Inversiones Medianas. Este compromiso más profundo aumentará significativamente su producción agrícola y extenderá la influencia holandesa."
 HOL_voc.22.a: "Excelente progreso."
 HOL_voc.23.t: "Programa de Inversiones Pesadas Aceptado"
 HOL_voc.23.d: "Sri Lanka ha adoptado nuestro Programa de Inversiones Pesadas, comprometiéndose a una reforma transformadora de su sector agrícola. Esto marca un hito en la influencia y colaboración holandesa en la región."
 HOL_voc.23.a: "Esto dará grandes recompensas."
 HOL_voc.24.t: "Sri Lanka rechaza la oferta de inversión"
 HOL_voc.24.d: "Sri Lanka ha rechazado nuestra oferta de inversión, faltando una oportunidad para fortalecer su sector agrícola. Sin embargo, todavía podemos realizar inversiones unilateralmente para establecer nuestra influencia."
 HOL_voc.24.a: "Desgraciadamente, pero encontraremos otra manera."
 HOL_voc.25.t: "Expansión holandesa del puerto de Colombo"
 HOL_voc.25.d: "Los Países Bajos han realizado importantes inversiones para ampliar y modernizar el puerto de Colombo, al tiempo que han mejorado su infraestructura de seguridad. Se espera que este desarrollo aumente la capacidad económica y las operaciones marítimas de Sri Lanka. Sin embargo, la presencia holandesa ha crecido considerablemente, suscitando preocupación por su influencia en uno de los activos más estratégicos de Sri Lanka."
 HOL_voc.25.a: "Esto es una bendición y un desafío."
 HOL_voc.26.t: "Derechos Exclusivos de la Demanda Neerlandesa sobre Sri Lanka"
 HOL_voc.26.d: "Los Países Bajos han emitido un gran ultimátum: otorgarles derechos exclusivos para gobernar Sri Lanka, entregar efectivamente la soberanía nacional o enfrentar las consecuencias. Esta decisión dará forma al futuro de la independencia de Sri Lanka."
 HOL_voc.26.a: "No tenemos más remedio que someternos."
 HOL_voc.26.b: "¡Nos negamos a rendirnos!"
 HOL_voc.27.t: "Sri Lanka rechaza las demandas holandesas"
 HOL_voc.27.d: "Sri Lanka ha rechazado nuestro ultimátum, desafiando las demandas neerlandesas de derechos exclusivos sobre la nación. Esto no nos deja más que afirmar nuestro dominio a través de la fuerza."
 HOL_voc.27.a: "La guerra es inevitable."
 HOL_voc.28.t: "Sri Lanka acepta demandas holandesas"
 HOL_voc.28.d: "Sri Lanka ha capitulado nuestro ultimátum, otorgando a los Países Bajos derechos exclusivos para gobernar la nación. Esta anexión pacífica fortalece la influencia holandesa en la región y marca una victoria histórica para el VOC."
 HOL_voc.28.a: "Sri Lanka es ahora parte del legado de la VOC."
 HOL_voc.29.t: "Asistencia neerlandesa para combatir el VIH"
 HOL_voc.29.d: "Los Países Bajos han avanzado para ayudar a Sudáfrica en la lucha contra la epidemia del VIH. Con su experiencia y recursos sanitarios avanzados, los holandeses han traído esperanza y apoyo muy necesarios a nuestra gente. Este acto de buena voluntad no sólo ha reforzado nuestra lucha contra la epidemia, sino que también ha ganado una admiración generalizada por los holandeses entre nuestra población."
 HOL_voc.29.a: "Esta asociación es una bendición para nuestro pueblo pero un riesgo para el gobierno"
 HOL_voc.30.t: "Holandés solicita base naval en Cabo"
 HOL_voc.30.d: "Los Países Bajos han propuesto establecer una base naval en Cabo, citando su importancia estratégica como centro de reaprovisionamiento para Asia. A cambio, los holandeses han ofrecido importantes inversiones en la infraestructura portuaria de Sudáfrica, mejorando las capacidades marítimas de la nación. ¿Deberíamos aceptar esta propuesta?"
 HOL_voc.30.a: "Aceptar la propuesta y crear una asociación."
 HOL_voc.30.b: "Rechazar la propuesta y mantener plena soberanía."
 HOL_voc.31.t: "Sudáfrica acepta la propuesta de Base Naval"
 HOL_voc.31.d: "Sudáfrica ha acordado permitir a los Países Bajos establecer una base naval en Cabo. Este acuerdo refuerza el acceso de los holandeses a las rutas comerciales críticas y constituye un paso significativo en colaboración con Sudáfrica."
 HOL_voc.31.a: "¡Un logro vital para la COV!"
 HOL_voc.32.t: "Sudáfrica rechaza la propuesta de Base Naval"
 HOL_voc.32.d: "Sudáfrica ha rechazado nuestra propuesta de establecer una base naval en Cabo, citando preocupaciones sobre soberanía y autonomía estratégica. Esto es un revés para las ambiciones holandesas en la región."
 HOL_voc.32.a: "Desgraciadamente, pero debemos seguir adelante."
 HOL_voc.33.t: "Derechos Exclusivos de la Demanda Holandesa sobre Sudáfrica"
 HOL_voc.33.d: "Los Países Bajos han emitido un gran ultimátum: otorgarles derechos exclusivos para gobernar Sudáfrica, entregar efectivamente la soberanía nacional o enfrentar las consecuencias. Esta decisión dará forma al futuro de la independencia de Sudáfrica."
 HOL_voc.33.a: "No tenemos más remedio que someternos."
 HOL_voc.33.b: "¡Nos negamos a rendirnos!"
 HOL_voc.34.t: "Sudáfrica rechaza las demandas holandesas"
 HOL_voc.34.d: "Sudáfrica ha rechazado nuestro ultimátum, desafiando las demandas holandesas de derechos exclusivos sobre la nación. Esto no nos deja más que afirmar nuestro dominio a través de la fuerza."
 HOL_voc.34.a: "La guerra es inevitable."
 HOL_voc.35.t: "Sudáfrica acepta demandas holandesas"
 HOL_voc.35.d: "Sudáfrica ha capitulado a nuestro ultimátum, otorgando a los Países Bajos derechos exclusivos para gobernar la nación. Esta anexión pacífica fortalece la influencia holandesa en la región y marca una victoria histórica para el VOC."
 HOL_voc.35.a: "Sudáfrica es ahora parte del legado de la COV."
 HOL_voc.36.t: "El futuro de Indonesia"
 HOL_voc.36.d: "Ha llegado el momento de tomar una decisión crítica con respecto a Indonesia. Si declaramos la guerra y reclamamos por la fuerza nuestra histórica colonia coronaria, o extendemos nuestras operaciones encubiertas durante otro año, aceptando sanciones temporales porque no podemos utilizar el mismo recurso de nuevo"
 HOL_voc.36.a: "¡Declare la guerra y reclame Indonesia!"
 HOL_voc.36.b: "Operaciones de demora por otro año."
 HOL_voc.39.t: "Países Bajos solicita acceso militar"
 HOL_voc.39.d: "Los Países Bajos han solicitado acceso militar al territorio australiano, citando razones estratégicas y la importancia de la cooperación regional. ¿Deberíamos aceptar su solicitud?"
 HOL_voc.39.a: "Darles acceso militar."
 HOL_voc.39.b: "Rechazar su solicitud."
 HOL_voc.40.t: "Acceso militar concedido por Australia"
 HOL_voc.40.d: "Australia ha acordado concedernos acceso militar, lo que constituye un avance significativo en la cooperación regional y la eficiencia operacional."
 HOL_voc.40.a: "Excelente. Preparen nuestras fuerzas."
 HOL_voc.41.t: "Acceso militar Rechazado por Australia"
 HOL_voc.41.d: "Australia ha rechazado nuestra solicitud de acceso militar, citando preocupaciones sobre la soberanía y la estabilidad regional."
 HOL_voc.41.a: "Infortunada. Adaptaremos nuestra estrategia."
 HOL_voc.42.t: "Java Preparación de invasión Completa"
 HOL_voc.42.d: "Nuestras preparaciones encubiertas para la invasión de Java están completas. Esperamos el resultado de los esfuerzos indonesios de contrainteligencia para determinar si nuestras tropas siguen sin ser detectadas."
 HOL_voc.42.a: "Proceda."
 HOL_voc.42.b: "Proceda."
 HOL_voc.43.t: "Fuerzas Cubiertas Detecadas!"
 HOL_voc.43.d: "Nuestras operaciones encubiertas han sido descubiertas por las fuerzas indonesias, alentando la eficacia de nuestras tropas y reduciendo su capacidad operacional."
 HOL_voc.43.a: "Un gran revés."
 HOL_voc.44.t: "Fuerzas secretas no detectadas"
 HOL_voc.44.d: "Nuestros preparativos encubiertos se han pasado desapercibidos, y nuestras tropas permanecen a toda fuerza, listas para establecer una posición en Java."
 HOL_voc.44.a: "¡Excelente!"
 HOL_voc.45.t: "Solicitud holandesa para comprar Australia occidental"
 HOL_voc.45.d: "Los Países Bajos han formulado una solicitud oficial de compra de Australia occidental, en la que se cita su importancia estratégica para sus ambiciones mundiales. A cambio, ofrecen una indemnización militar o industrial a Australia. ¿Cómo debemos responder?"
 HOL_voc.45.a: "Aceptar con compensación militar."
 HOL_voc.45.b: "Aceptar con compensación industrial."
 HOL_voc.45.c: "Rechazar su oferta."
 HOL_voc.46.t: "Australia acepta la propuesta"
 HOL_voc.46.d: "Australia ha acordado vender Australia Occidental a los Países Bajos. Dependiendo de su elección, proporcionaremos la indemnización prometida para mantener fuertes vínculos diplomáticos."
 HOL_voc.46.a: "Procedido con el acuerdo."
 HOL_voc.47.t: "Australia rechaza la propuesta"
 HOL_voc.47.d: "Australia ha rechazado nuestra oferta para comprar Australia Occidental. Si bien es decepcionante, debemos ajustar nuestra estrategia en consecuencia."
 HOL_voc.47.a: "Desgraciadamente, pero seguiremos adelante."
 HOL_voc.51.t: "Ultimatum holandés a Malacca"
 HOL_voc.51.d: "Los Países Bajos han emitido un ultimátum, exigiendo la entrega inmediata de Malaca. ¿Deberíamos aceptar sus términos y evitar conflictos, o rechazar y prepararnos para la guerra?"
 HOL_voc.51.a: "Aceptar sus términos."
 HOL_voc.51.b: "Rechazar y ponernos de pie."
 HOL_voc.52.t: "Malacca acepta Ultimatum holandés"
 HOL_voc.52.d: "Malacca ha capitulado nuestras demandas, entregando su territorio a los Países Bajos sin resistencia. Esto marca una victoria significativa para las ambiciones holandesas en la región."
 HOL_voc.52.a: "Integrar Malacca en el dominio holandés."
 HOL_voc.53.t: "Malacca Refuss Dutch Ultimatum"
 HOL_voc.53.d: "Malacca ha rechazado nuestro ultimátum desafiando a las demandas holandesas de rendición. Esto no nos deja más que prepararnos para la guerra para hacer cumplir nuestras reivindicaciones."
 HOL_voc.53.a: "Tomaremos Malaca por la fuerza."
 HOL_voc.54.t: "Ultimatum holandés a §Y[SIN.GetNameWithFlag]§!"
 HOL_voc.54.d: "Los Países Bajos han emitido un ultimátum exigiendo la entrega inmediata de Singapur. ¿Deberíamos aceptar sus términos o prepararnos para la guerra?"
 HOL_voc.54.a: "Aceptar sus términos."
 HOL_voc.54.b: "Rechazar y ponernos de pie."
 HOL_voc.55.t: "§Y[SIN.GetNameWithFlag]§! Acepta Ultimatum holandés"
 HOL_voc.55.d: "§Y[SIN.GetNameWithFlag]§! ha capitulado nuestras demandas, entregando su territorio sin resistencia. Esto marca una victoria significativa para las ambiciones holandesas."
 HOL_voc.55.a: "Integrar §Y[SIN.GetNameWithFlag]§! en nuestro dominio."
 HOL_voc.56.t: "§Y[SIN.GetNameWithFlag]§! Refuss Dutch Ultimatum"
 HOL_voc.56.d: "§Y[SIN.GetNameWithFlag]§! ha rechazado nuestro ultimátum desafiando las demandas holandesas. Esto no nos deja otra opción que prepararnos para la guerra."
 HOL_voc.56.a: "Tomaremos a Singapur por la fuerza."
 HOL_voc.57.t: "Ultimatum holandés a §Y[BRU.GetNameWithFlag]§!"
 HOL_voc.57.d: "§Y[HOL.GetNameWithFlag]§! ha emitido un ultimátum, exigiendo la entrega inmediata de Brunei. ¿Deberíamos aceptar sus términos o prepararnos para la guerra?"
 HOL_voc.57.a: "Aceptar sus términos."
 HOL_voc.57.b: "Rechazar y ponernos de pie."
 HOL_voc.58.t: "§Y[BRU.GetNameWithFlag]§! Acepta Ultimatum holandés"
 HOL_voc.58.d: "§Y[BRU.GetNameWithFlag]§! ha capitulado nuestras demandas, entregando su territorio sin resistencia. Esto marca una victoria significativa para las ambiciones holandesas."
 HOL_voc.58.a: "Integrar §Y[BRU.GetNameWithFlag]§! en nuestro dominio."
 HOL_voc.59.t: "§Y[BRU.GetNameWithFlag]§! Refuss Dutch Ultimatum"
 HOL_voc.59.d: "§Y[BRU.GetNameWithFlag]§! ha rechazado nuestro ultimátum desafiando las demandas holandesas. Esto no nos deja otra opción que prepararnos para la guerra."
 HOL_voc.59.a: "Tomaremos §Y[BRU.GetNameWithFlag]§! por la fuerza."
 HOL_voc.60.t: "Preparativos holandeses para la guerra detectados"
 HOL_voc.60.d: "Los informes de inteligencia confirman que los Países Bajos están movilizando sus fuerzas para reclamar territorios que creen forman parte de su legado histórico. Deben tomarse medidas inmediatas para apoyar su agresión."
 HOL_voc.60.a: "Prepárate para la amenaza holandesa."
 HOL_voc.61.t: "Escalada de Preparativos Defensivos"
 HOL_voc.61.d: "Los Países Bajos han intensificado sus preparativos militares, aumentando la probabilidad de una invasión. Para contrarrestar esta amenaza, debemos coordinarnos con otras naciones en riesgo y formar acuerdos de defensa mutua. Esto nos permitirá llamarnos como aliados en caso de ataque holandés."
 HOL_voc.61.a: "Fortalecer nuestras defensas y coordinar alianzas."
 HOL_voc.62.t: "Solicitud de ayuda contra la agresión holandesa"
 HOL_voc.62.d: "Los Países Bajos han lanzado un ataque contra nosotros, amenazando nuestra soberanía. Podemos exhortar a nuestros aliados a cumplir sus compromisos y unirse a la lucha para repeler la invasión holandesa."
 HOL_voc.62.a: "Llama a nuestros aliados para que nos ayuden."
 HOL_voc.62.b: "Nos quedaremos solos contra ellos."
 HOL_voc.63.t: "[ROOT.GetNameWithFlag] Pide asistencia"
 HOL_voc.63.d: "§Y[ROOT.GetNameWithFlag]§! ha sido atacado por el §R[HOL.GetNameWithFlag]§! y está solicitando nuestra ayuda para repeler la invasión. ¿Vamos a honrar nuestro compromiso y unirnos a la lucha?"
 HOL_voc.63.a: "Únete a la guerra y ayuda a nuestro aliado."
 HOL_voc.63.b: "Rechazar a intervenir."
 HOL_voc.64.t: "Propuesta holandesa: Corredor Comercial Trans-Australiano"
 HOL_voc.64.d: "El Gobierno holandés ha propuesto oficialmente la construcción de un corredor comercial e infraestructura que vincule a Australia occidental administrada por los Países Bajos con las regiones orientales del continente australiano. El plan incluye el desarrollo de centros logísticos, redes ferroviarias y viales y el establecimiento de zonas económicas administradas por los Países Bajos. Si bien el corredor promete beneficios económicos a largo plazo, plantea cuestiones sobre la soberanía, la gobernanza y el equilibrio de influencia en todo el continente."
 HOL_voc.64.a: "Aprobar el corredor: el desarrollo económico viene primero"
 HOL_voc.64.b: "Rechazar el plan: no podemos ceder terreno estratégico"
 HOL_voc.65.t: "Australia acepta la propuesta de Corredor Comercial"
 HOL_voc.65.d: "El Gobierno australiano ha aprobado nuestra propuesta de construir un corredor comercial transcontinental que vincule a Australia occidental holandesa con los centros industriales y de población orientales. Pronto comenzarán los trabajos sobre infraestructura compartida, zonas económicas y centros logísticos. Esto marca un paso histórico hacia la integración económica regional, y la influencia estratégica holandesa en el Indo Pacífico."
 HOL_voc.65.a: "Un pasillo digno del legado VOC."
 HOL_voc.66.t: "Australia rechaza la propuesta del corredor comercial"
 HOL_voc.66.d: "El gobierno australiano ha rechazado nuestra oferta de construir conjuntamente un corredor comercial transcontinental a través de su territorio. Las preocupaciones por la soberanía estratégica y la influencia extranjera se citaron como razones clave. Si bien la propuesta habría beneficiado económicamente a ambas partes, las preocupaciones políticas internas han ganado por ahora."
 HOL_voc.66.a: "Un retroceso. No es el final."
 HOL_voc.67.t: "Países Bajos apoya la autonomía de Afrikaner"
 HOL_voc.67.d: "En un movimiento seguro para provocar tensiones internas, el gobierno holandés ha emitido una declaración formal que apoya la autonomía cultural y económica de la comunidad afrikaner en Sudáfrica. Las instituciones neerlandesas han anunciado vínculos más estrechos con las organizaciones civiles de Afrikaner, citando bonos históricos y patrimonio compartido. Mientras se enmarca como apoyo cultural, la iniciativa ha despertado alarma dentro del gobierno sudafricano, con temores a interferencias extranjeras y posibles disturbios."
 HOL_voc.67.a: "Esto es una grave preocupación diplomática."
 HOL_voc.68.t: "Dutch Backing for Boer- Sudanese Parties"
 HOL_voc.68.d: "Reportes han confirmado que el gobierno holandés está ofreciendo apoyo no oficial a los movimientos políticos alineados con Boer dentro de Sudáfrica. Los canales financieros, las plataformas de organizaciones no gubernamentales e instituciones culturales parecen influir en los grupos que abogan por una mayor autonomía para la comunidad afrikaner. Esta injerencia podría tener graves ramificaciones para la unidad nacional y la seguridad interna."
 HOL_voc.68.a: "Esto es una injerencia extranjera inaceptable."
 HOL_voc.69.t: "Dutch Investment en Afrikaner Mining Firms"
 HOL_voc.69.d: "El Gobierno holandés ha hecho una importante inversión financiera en las operaciones mineras de propiedad de Afrikaner en Sudáfrica. El movimiento forma parte de una campaña más amplia para profundizar los vínculos económicos con la comunidad afrikaner, proporcionando capital y apoyo logístico para impulsar la producción. Aunque económicamente beneficioso para algunos, esto plantea nuevas preocupaciones acerca de la influencia externa sobre los recursos naturales de Sudáfrica."
 HOL_voc.69.a: "Claramente están recogiendo lados."
 HOL_voc.70.t: "Inversión holandesa en industria semiconductora"
 HOL_voc.70.d: "Los Países Bajos han anunciado una inversión estratégica en el sector semiconductor de Taiwán. En asociación con las principales empresas tecnológicas holandesas, se construirán nuevas oficinas conjuntas e instalaciones de investigación para apoyar el desarrollo de chips de próxima generación. Este acuerdo profundiza la cooperación bilateral y fortalece el papel de Taiwán como una central mundial semiconductora."
 HOL_voc.70.a: "Esto cementa el lugar de Taiwán en la era digital."
 HOL_voc.71.t: "Propuesta holandesa: ASML-TSMC Technology Alliance"
 HOL_voc.71.d: "Los Países Bajos han propuesto oficialmente la creación de un grupo conjunto de intercambio de tecnología entre el SMA y el TSMC. Esta asociación profundizaría la colaboración R&D, coordinaría la litografía y la innovación de chips, y establecería un bloque semi-formal técnico-industrial. ¿Taiwan apoyará la iniciativa?"
 HOL_voc.71.a: "Aprobar la alianza tecnológica: nuestro futuro es digital"
 HOL_voc.71.b: "Rechazo: debemos mantener la independencia tecnológica"
 HOL_voc.72.t: "Taiwán acepta la asociación ASML-TSMC"
 HOL_voc.72.d: "Taiwán ha aceptado la propuesta holandesa de un grupo mixto de intercambio de tecnología. Con ASML y TSMC en el núcleo, la alianza establece el escenario para una innovación semiconductora coordinada y un liderazgo de investigación en Europa y Asia."
 HOL_voc.72.a: "Una alianza industrial para la próxima era."
 HOL_voc.73.t: "Taiwán rechaza la propuesta de intercambio técnico"
 HOL_voc.73.d: "Taiwán ha rechazado la propuesta de una alianza tecnológica conjunta entre ASML y TSMC. Aunque los canales diplomáticos siguen abiertos, Taipei ha optado por mantener la plena independencia sobre su estrategia semiconductora, al menos por ahora."
 HOL_voc.73.a: "Un resultado decepcionante."
 HOL_voc.74.t: "Países Bajos controla las exportaciones de semiconductores"
 HOL_voc.74.d: "En una iniciativa estratégica de gran alcance, el Gobierno neerlandés ha promulgado nuevas leyes que colocan la autoridad de control de las exportaciones sobre todas las tecnologías semiconductoras avanzadas y los sistemas fotolitográficos. Con el ASML como joya coronaria de esta decisión, los Países Bajos tienen ahora una posición dominante en la cadena mundial de suministro de chips con la facultad de aprobar, restringir o bloquear las exportaciones de tecnología basadas en el interés nacional y la alineación diplomática."
 HOL_voc.74.a: "Debemos preparar medidas contra los holandeses"
 HOL_voc.74.b: "Ahora tenemos las claves de la tecnología global."
 HOL_voc.75.t: "Expansión financiera holandesa en la India"
 HOL_voc.75.d: "Los Países Bajos han ampliado considerablemente su huella financiera en la India, abriendo nuevos bancos afiliados y oficinas corporativas holandesas en las principales ciudades. Esta estrategia, respaldada por un esfuerzo coordinado de instituciones estatales holandesas y empresas multinacionales, tiene como objetivo profundizar la inversión bilateral, influir en los mercados financieros y aumentar el apalancamiento económico dentro de la economía de rápido crecimiento de la India. Aunque no es una maniobra política exagerada, cambia sutilmente la dinámica económica de la región."
 HOL_voc.75.a: "El capital extranjero siempre tiene influencia..."
 HOL_voc.76.t: "Inversión holandesa en la infraestructura portuaria de Gujarat"
 HOL_voc.76.d: "El gobierno holandés, a través de una mezcla de empresas marítimas respaldadas por el Estado y canales financieros, ha invertido en mejorar la infraestructura portuaria a lo largo de la costa de Gujarat. Si bien se presentó oficialmente como iniciativa de facilitación del comercio, el establecimiento de oficinas y locales para muelles neerlandeses ha suscitado preocupación por la influencia extranjera a largo plazo en una región crítica del comercio nacional. El movimiento es diplomáticomente delicado, pero económicamente significativo."
 HOL_voc.76.a: "Seguiremos de cerca su influencia."
 HOL_wic.01.t: "Trazando el Sendero para la WIC"
 HOL_wic.01.d: "A medida que nos preparamos para recuperar los territorios controlados por la West India Company, debemos decidir sobre nuestro enfoque. Una estrategia diplomática y económica podría llevar a la integración pacífica, fortaleciendo nuestra influencia mediante el poder blando. Alternativamente, un enfoque militar podría ofrecer resultados rápidos y decisivos, aunque a riesgo de resistencia y conflictos prolongados."
 HOL_wic.01.a: "Realizar un camino diplomático y económico"
 HOL_wic.01.b: "Adoptar una estrategia militar"
 HOL_wic.02.t: "Adquisición de deuda neerlandesa"
 HOL_wic.02.d: "Los Países Bajos han adquirido una parte importante de nuestra deuda nacional, colocando efectivamente nuestra economía bajo su influencia. Esta medida ha proporcionado un cierto alivio inmediato a nuestra crisis financiera, pero también significa que los holandeses ahora mantienen una considerable influencia sobre nuestras políticas e industrias clave."
 HOL_wic.02.a: "No tenemos más remedio que someternos al control financiero holandés."
 HOL_wic.03.t: "Tópico de Ultimatum a Senegal"
 HOL_wic.03.d: "Los Países Bajos han emitido un ultimátum exigiendo la transferencia del estado de Senegal-Central, que incluye la isla histórica de Goeree. ¿Senegal cumplirá con la demanda, ofrecerá una alternativa o rechazará de antemano?"
 HOL_wic.03.a: "Cumpliremos y transferiremos Senegal-Central."
 HOL_wic.03.b: "Ofrezca Senegal-Nord en su lugar."
 HOL_wic.03.c: "Nos negamos a inclinarnos ante la agresión holandesa."
 HOL_wic.04.t: "Territorio protegido"
 HOL_wic.04.d: "Senegal ha acordado nuestro ultimátum y transferido el estado de Senegal-Central al control holandés. Esto marca otro paso para reclamar el legado de la West India Company."
 HOL_wic.04.a: "Una victoria para los Países Bajos."
 HOL_wic.05.t: "Senegal contra oferta"
 HOL_wic.05.d: "El Senegal se ha negado a transferir el estado de Senegal-Central, pero ha ofrecido al Senegal-Nord como alternativa. ¿Deberíamos aceptar esta contraoferta o insistir en la demanda original?"
 HOL_wic.05.a: "Acepta la contraoferta."
 HOL_wic.05.b: "Rechazar la contraoferta y exigir el cumplimiento."
 HOL_wic.06.t: "Ultimatum Rechazado"
 HOL_wic.06.d: "Senegal se ha negado a cumplir con nuestro ultimátum. Ahora debemos prepararnos para la guerra para reclamar lo que es legítimamente nuestro."
 HOL_wic.06.a: "La guerra es inevitable."
 HOL_wic.07.t: "Ultimatum final to Senegal"
 HOL_wic.07.d: "Senegal ha rechazado nuestra contraoferta. Les estamos dando una última oportunidad para entregar Senegal-Nord, o responderemos con la fuerza militar."
 HOL_wic.07.a: "Entrega Senegal-Nord."
 HOL_wic.07.b: "Defenderemos la agresión holandesa."
 HOL_wic.08.t: "Tópico Ultimatum: Transfer Gold Coast Territory"
 HOL_wic.08.d: "Los Países Bajos han emitido un ultimátum exigiendo la transferencia del territorio de Gold Coast a su control. Citan su presencia histórica en la región bajo la West India Company, incluyendo el funcionamiento de puestos clave como Elmina Castle. Si bien el cumplimiento puede evitar conflictos, socavaría la soberanía de Ghana y desestabilizaría la región."
 HOL_wic.08.a: "Cumpliremos y transferiremos la Costa Dorada."
 HOL_wic.08.b: "Nos negamos a inclinarnos ante las demandas holandesas."
 HOL_wic.09.t: "Territorio de la Costa Dorada"
 HOL_wic.09.d: "El gobierno de Ghana ha acordado transferir el territorio de Gold Coast, incluido el Castillo Elmina estratégico, al control holandés. Esto marca un paso significativo en la restauración del legado de la West India Company y el fortalecimiento de nuestra presencia en África Occidental."
 HOL_wic.09.a: "Una victoria para los Países Bajos y la WIC."
 HOL_wic.10.t: "Ghana rechaza Ultimatum holandés"
 HOL_wic.10.d: "El gobierno de Ghana ha rechazado nuestro ultimátum para transferir el territorio de la Costa Dorada. Su desafío no nos deja otra opción que prepararnos para la acción militar para reclamar lo que vemos con razón como el nuestro, restaurando la influencia holandesa en la región."
 HOL_wic.10.a: "La guerra será la única respuesta."
 HOL_wic.11.t: "Ultimátum holandés: traslado provincia de Luanda"
 HOL_wic.11.d: "Los Países Bajos han emitido un ultimátum exigiendo el traslado de la provincia de Luanda al control holandés. Reclaman este territorio como parte de su imperio marítimo histórico, citando la participación de la West India Company en la región. Si bien esto evitaría los conflictos, podría desestabilizar Angola política y económicamente."
 HOL_wic.11.a: "Cumpliremos y transferiremos la provincia de Luanda al control holandés."
 HOL_wic.11.b: "Nos negamos a someternos a demandas holandesas."
 HOL_wic.12.t: "Angola acepta Ultimatum holandés"
 HOL_wic.12.d: "El gobierno angoleño ha acordado transferir la provincia de Luanda al control holandés. Esta adquisición estratégica restaura una parte clave del legado marítimo holandés en el Atlántico y fortalece nuestra posición en la región."
 HOL_wic.12.a: "Otro paso hacia la restauración de la WIC."
 HOL_wic.13.t: "Angola rechaza el Ultimatum holandés"
 HOL_wic.13.d: "El gobierno angoleño ha rechazado nuestro ultimátum para transferir la provincia de Luanda. Su desafío no nos deja otra opción que prepararnos para la acción militar para reclamar lo que vemos con razón como nuestro."
 HOL_wic.13.a: "Debemos afirmar nuestro dominio a través de la fuerza."
 HOL_wic.14.t: "Tópico Ultimatum: Transfer Saint Helena"
 HOL_wic.14.d: "Los Países Bajos han emitido un ultimátum exigiendo el traslado de Santa Elena a su control. Los holandeses justifican esta afirmación basada en la conexión histórica de la isla con su imperio marítimo y su importancia estratégica en la red comercial atlántica. Cumplimiento evitaría el conflicto, pero podría comprometer los intereses británicos en la región."
 HOL_wic.14.a: "Cumpliremos y transferiremos a Santa Elena al control holandés."
 HOL_wic.14.b: "Nos negamos a inclinarnos ante las demandas holandesas."
 HOL_wic.15.t: "Santa Helena Aseguida"
 HOL_wic.15.d: "El gobierno británico ha acordado transferir a Santa Elena al control holandés. Esta adquisición restaura una parte vital del legado marítimo de los Países Bajos, reforzando nuestro dominio sobre las rutas comerciales atlánticas."
 HOL_wic.15.a: "Una gran victoria para los Países Bajos y la WIC."
 HOL_wic.16.t: "Inglaterra rechaza el Ultimatum holandés"
 HOL_wic.16.d: "El gobierno británico ha rechazado nuestro ultimátum para transferir a Santa Elena. Su decisión no nos deja más remedio que prepararnos para la acción militar para reclamar esta isla crucial."
 HOL_wic.16.a: "Debemos prepararnos para la guerra."
 HOL_wic.17.t: "Los holandeses exigen el regreso de San Juan Bautista"
 HOL_wic.17.d: "En un movimiento inesperado, los Países Bajos han emitido un ultimátum formal exigiendo la transferencia de Puerto Rico, históricamente conocido como San Juan Bautista. Afirman que la isla es un paso necesario para restaurar el legado marítimo de la West India Company y restablecer su dominio en el Caribe. Mientras los holandeses citan sus ambiciones del siglo XVII y su necesidad estratégica, el cumplimiento marcaría una importante concesión geopolítica para los Estados Unidos."
 HOL_wic.17.a: "Cederemos Puerto Rico a los holandeses."
 HOL_wic.17.b: "Nunca entregaremos el suelo americano a los poderes extranjeros."
 HOL_wic.18.t: "San Juan Bautista regresa al control holandés"
 HOL_wic.18.d: "Los Estados Unidos han acordado ceder a Puerto Rico al control holandés. Esta histórica recuperación de San Juan Bautista restablece un vínculo vital en el Caribe, solidificando nuestras ambiciones marítimas y honrando el legado de la West India Company."
 HOL_wic.18.a: "Un día glorioso para la influencia holandesa."
 HOL_wic.19.t: "Los americanos rechazan el Ultimátum holandés"
 HOL_wic.19.d: "Estados Unidos ha rechazado ultimátum para ceder a Puerto Rico. Su desafío socava nuestras justas reivindicaciones hacia el Caribe, y ahora debemos prepararnos para la guerra para asegurar a San Juan Bautista por la fuerza."
 HOL_wic.19.a: "Lo tomaremos por la fuerza. ¡El Caribe será nuestro!"
 HOL_wic.20.t: "Los holandeses exigen las Antillas Británicas"
 HOL_wic.20.d: "Los Países Bajos han emitido un ultimátum formal exigiendo la transferencia de las Antillas Británicas. Afirman que las islas son parte integrante de sus ambiciones históricas bajo la West India Company, citando su valor estratégico en el Caribe. Una negativa podría provocar conflictos en la región."
 HOL_wic.20.a: "Vamos a transferir las Antillas Británicas al control holandés."
 HOL_wic.20.b: "Nos negamos a entregar territorios británicos."
 HOL_wic.21.t: "Antillas británicas transferidas"
 HOL_wic.21.d: "El gobierno británico ha aceptado nuestras demandas, dejando las Antillas Británicas al control holandés. Este éxito marca otro paso para restaurar la influencia de la Compañía India Occidental en el Caribe."
 HOL_wic.21.a: "El Caribe se convierte en holandés una vez más."
 HOL_wic.22.t: "Los británicos rechazan el Ultimatum holandés"
 HOL_wic.22.d: "Los británicos se han negado a cedernos las Antillas Británicas. Su desafío no puede ir sin respuesta, y debemos prepararnos para tomar estas islas vitales por la fuerza."
 HOL_wic.22.a: "Reclamaremos lo que es nuestro a través de la guerra."
 HOL_wic.23.t: "El control de la demanda holandesa sobre Trinidad"
 HOL_wic.23.d: "Los Países Bajos han emitido un ultimátum formal exigiendo la transferencia de Trinidad a control holandés. Los holandeses citan sus ambiciones históricas bajo la West India Company, cuando la isla fue brevemente imaginada como 'New Walcheren' a principios del siglo XVII. La ubicación estratégica de la isla en el Mar Caribe lo hace invaluable para el dominio marítimo y las rutas comerciales."
 HOL_wic.23.a: "Cederemos Trinidad a los holandeses."
 HOL_wic.23.b: "Nos negamos a ceder a las demandas holandesas."
 HOL_wic.24.t: "Trinidad regresó al control holandés"
 HOL_wic.24.d: "El gobierno de Trinidad ha aceptado nuestro ultimátum y transferido el control de la isla. Esta adquisición vital fortalece nuestra influencia en el Caribe y restablece el dominio holandés en la región, cumpliendo la visión de New Walcheren."
 HOL_wic.24.a: "Un paso crítico para la West India Company."
 HOL_wic.25.t: "Trinidad rechaza Ultimatum holandés"
 HOL_wic.25.d: "El gobierno de Trinidad se ha negado a cumplir con nuestras demandas por la isla. Su desafío no nos deja más remedio que prepararnos para la guerra para reclamar este territorio estratégicamente vital."
 HOL_wic.25.a: "¡Preparad las fuerzas para la guerra!"
 HOL_wic.26.t: "Los holandeses exigen el regreso de Suriname"
 HOL_wic.26.d: "Los Países Bajos han emitido un ultimátum formal exigiendo el regreso de Suriname a su control. Una vez una colonia vital bajo el dominio holandés, la posición estratégica de Suriname y los abundantes recursos se consideran clave para revivir la influencia de la West India Company. Cumplimiento evitaría el conflicto, pero marcaría una pérdida de soberanía."
 HOL_wic.26.a: "Cederemos Suriname a los holandeses."
 HOL_wic.26.b: "Nos negamos a someternos a demandas holandesas."
 HOL_wic.27.t: "Suriname regresó al control holandés"
 HOL_wic.27.d: "El gobierno de Suriname ha aceptado nuestro ultimátum y transferido el control de su territorio. Esta adquisición pacífica garantiza un vínculo vital en América del Sur, proporcionando recursos y posicionamiento estratégico para promover las ambiciones neerlandesas."
 HOL_wic.27.a: "¡Otro triunfo para la WIC!"
 HOL_wic.28.t: "Suriname rechaza el Ultimatum holandés"
 HOL_wic.28.d: "El gobierno de Suriname se ha negado a cumplir con nuestras demandas. Su desafío no puede ir sin respuesta, y debemos prepararnos para tomar el control de Suriname a través de medios militares."
 HOL_wic.28.a: "¡Prepárense para la guerra!"
 HOL_wic.29.t: "Los neerlandeses exigen el control de Guayana"
 HOL_wic.29.d: "Los Países Bajos han emitido un ultimátum formal exigiendo la transferencia de Guyana al control holandés. Históricamente parte de la Guayana holandesa, el territorio posee recursos ricos y valor estratégico. Los holandeses argumentan que la reivindicación de Guyana es esencial para revivir las ambiciones de la West India Company y solidificar su dominio en Sudamérica."
 HOL_wic.29.a: "Vamos a transferir Guyana a los holandeses."
 HOL_wic.29.b: "Nos negamos a someternos a demandas holandesas."
 HOL_wic.30.t: "Guyana Regresó al control holandés"
 HOL_wic.30.d: "El Gobierno de Guyana ha aceptado nuestras demandas y transferido el control de su territorio. Esta adquisición pacífica revive la influencia holandesa en Sudamérica y cumple las ambiciones de la West India Company."
 HOL_wic.30.a: "¡Un triunfo para la resolución holandesa!"
 HOL_wic.31.t: "Guyana Rechaza Ultimatum holandés"
 HOL_wic.31.d: "El gobierno de Guyana se ha negado a cumplir con nuestro ultimátum. Su desafío no puede ir sin respuesta, y debemos prepararnos para tomar el control del territorio a través de medios militares."
 HOL_wic.31.a: "Aprovecharemos a Guyana por la fuerza."
 HOL_wic.32.t: "El control de la demanda holandesa de Guayana Francesa"
 HOL_wic.32.d: "Los Países Bajos han emitido un ultimátum formal exigiendo la transferencia de Guayana Francesa al control holandés. Históricamente parte de las ambiciones coloniales holandesas en las Américas, reclaman este territorio como un paso necesario para restaurar el dominio de la Compañía West India en la región. Cumplimiento evitará la guerra, pero los riesgos socavan el prestigio y la soberanía francesas."
 HOL_wic.32.a: "Cederemos Guayana Francesa a los holandeses."
 HOL_wic.32.b: "Nos negamos a someternos a demandas holandesas."
 HOL_wic.33.t: "Guayana Francesa transferida al control holandés"
 HOL_wic.33.d: "El gobierno francés ha aceptado nuestras demandas y transferido el control de la Guayana Francesa. Esta victoria restaura un territorio crítico para el control holandés, solidificando nuestra influencia en Sudamérica y cumpliendo las ambiciones de la West India Company."
 HOL_wic.33.a: "Un gran éxito para las ambiciones holandesas!"
 HOL_wic.34.t: "Francia rechaza el Ultimatum holandés"
 HOL_wic.34.d: "El gobierno francés ha rechazado planamente nuestro ultimátum para transferir la Guayana Francesa. Su desafío no puede ir sin respuesta, y debemos prepararnos para la guerra para reclamar este territorio vital y afirmar nuestro dominio en las Américas."
 HOL_wic.34.a: "¡Lo agarraremos por la fuerza!"
 HOL_wic.35.t: "El control de la demanda holandesa sobre el norte del Brasil"
 HOL_wic.35.d: "Los Países Bajos han emitido un ultimátum formal exigiendo la transferencia de territorios en el norte del Brasil. Estas regiones estuvieron bajo control holandés durante el siglo XVII, cuando la West India Company estableció una colonia de corta duración en Pernambuco y alrededores. Los holandeses argumentan ahora que la reivindicación de estas tierras es esencial para revivir su influencia en América del Sur y obtener recursos clave."
 HOL_wic.35.a: "Vamos a transferir los territorios a los holandeses."
 HOL_wic.35.b: "Rechazamos sus demandas. Brasil se mantendrá fuerte."
 HOL_wic.36.t: "Brasil transfiere los Territorios del Norte"
 HOL_wic.36.d: "El gobierno brasileño ha aceptado nuestras demandas y transferido el control de los territorios del norte. Esta importante adquisición restaura un pedazo de nuestro legado colonial en América del Sur y fortalece la presencia holandesa en la región."
 HOL_wic.36.a: "¡Una gran victoria para la West India Company!"
 HOL_wic.37.t: "Brasil rechaza Ultimatum holandés"
 HOL_wic.37.d: "El gobierno brasileño ha rechazado nuestro ultimátum, rechazando nuestra reclamación a los territorios del norte. Su desafío no nos deja más remedio que prepararnos para la acción militar para reclamar estas regiones por la fuerza."
 HOL_wic.37.a: "¡No nos negarán! ¡Prepárense para la guerra!"
 HOL_wic.38.t: "Ultimatum holandés: Regresar los territorios holandeses-americanos"
 HOL_wic.38.d: "Los Países Bajos han emitido un ultimátum extraordinario, exigiendo la transferencia de antiguos territorios holandeses en la costa oriental, incluidas las zonas que una vez pertenecieron a Nueva Netherland. Afirman esto como parte de su derecho histórico, citando el legado de Nueva Amsterdam y la influencia holandesa en la fundación de estas regiones. Cumplimiento sería visto como una gran concesión diplomática y puede sacudir el orgullo y la soberanía estadounidenses."
 HOL_wic.38.a: "Negociaremos y transferiremos los territorios."
 HOL_wic.38.b: "¡Nunca entregaremos el suelo americano!"
 HOL_wic.39.t: "Estados Unidos transfiere territorios holandeses-americanos"
 HOL_wic.39.d: "En un giro sin precedentes de los acontecimientos, los Estados Unidos han acordado transferir el control de territorios clave a los Países Bajos. Esta monumental victoria restablece la influencia holandesa en las Américas y revive el espíritu histórico de Nueva Amsterdam."
 HOL_wic.39.a: "¡Un éxito histórico para la diplomacia holandesa!"
 HOL_wic.40.t: "Los EE.UU. rechazan el Ultimatum holandés"
 HOL_wic.40.d: "Estados Unidos ha rechazado abiertamente nuestras demandas por el retorno de territorios holandeses-americanos. Su desafío no nos deja más remedio que prepararnos para la guerra para reclamar estas tierras por la fuerza. ¡El orgullo de Nueva Amsterdam debe ser restaurado!"
 HOL_wic.40.a: "¡Devolveremos lo que es nuestro a través de la guerra!"
 HOL_nvu.4.t: "Reforma educativa completada"
 HOL_nvu.4.d: "Después de un año de transición, el nuevo sistema educativo está plenamente operativo. La próxima generación está siendo ahora formada por los valores de lealtad, disciplina y orgullo, asegurando el futuro de la nación."
 HOL_nvu.4.a: "¡Las reformas son un éxito resonante!"
 HOL_nvu.5.t: "Ultimatum holandés: Unificación de Dietsland"
 HOL_nvu.5.d: "El gobierno holandés ha emitido un ultimátum a Bélgica, exigiendo la transferencia inmediata de Flandes para unificar Dietsland. Bélgica debe decidir ahora si aceptar esta demanda o enfrentar las consecuencias de la negativa."
 HOL_nvu.5.a: "Acepta la demanda y transferencia de Flandes."
 HOL_nvu.5.b: "Rechazar el ultimátum."
 HOL_nvu.6.t: "Bélgica recurre a las demandas holandesas"
 HOL_nvu.6.d: "Bajo la presión del ultimátum holandés, Bélgica ha acordado transferir Flandes a los Países Bajos. Esto marca un paso significativo hacia la unificación de Dietsland."
 HOL_nvu.6.a: "¡La unificación de Dietsland comienza!"
 HOL_nvu.7.t: "Bélgica rechaza el Ultimatum holandés"
 HOL_nvu.7.d: "Bélgica ha rechazado abiertamente el ultimátum holandés para transferir Flandes, desafiando la visión de un Dietsland unificado. Los Países Bajos deben ahora prepararse para adoptar medidas y hacer valer su reclamación por la fuerza."
 HOL_nvu.7.a: "¡Reclamaremos todo Bélgica por Dietsland!"
 HOL_nvu.8.t: "Propuesta holandesa: integración del ejército flamenco"
 HOL_nvu.8.d: "El Gobierno holandés ha pedido oficialmente que se absorban las unidades flamencas de nuestras fuerzas armadas en su estructura militar. Si bien es políticamente sensible, la propuesta se enmarca como un avance hacia una mayor cooperación regional."
 HOL_nvu.8.a: "Aceptar la transferencia"
 HOL_nvu.8.b: "Rechazar la oferta"
 HOL_nvu.9.t: "Bélgica acepta el acuerdo de integración"
 HOL_nvu.9.d: "El gobierno belga ha acordado transferir sus unidades del ejército flamenco a nuestra estructura militar. Los protocolos de integración comenzarán inmediatamente."
 HOL_nvu.9.a: "Excelente"
 HOL_nvu.10.t: "Bélgica rechaza la propuesta"
 HOL_nvu.10.d: "El gobierno belga ha rechazado nuestra propuesta de integrar sus elementos del ejército flamenco. La oferta fue considerada políticamente inaceptable por su liderazgo."
 HOL_nvu.10.a: "Disappointing"
 HOL_nvu.11.t: "Propuesta de Países Bajos"
 HOL_nvu.11.d: "Los Países Bajos han propuesto formar una «hermandad alemana de las Naciones», un pacto de alineación militar y cultural entre nuestras naciones. Aunque sean ideológicamente compatibles, las implicaciones a largo plazo deben ser ponderadas cuidadosamente."
 HOL_nvu.11.a: "Aceptar la propuesta"
 HOL_nvu.11.b: "Rechazar la idea"
 HOL_nvu.12.t: "Alemania acepta la Hermandad"
 HOL_nvu.12.d: "Alemania ha acordado formar una Hermandad Alemana de Naciones. En Europa ha surgido un nuevo eje geopolítico."
 HOL_nvu.12.a: "El futuro es nuestro"
 HOL_nvu.13.t: "Alemania rechaza la Hermandad"
 HOL_nvu.13.d: "Berlín ha rechazado nuestra propuesta de forjar una Hermandad Alemana. La visión de la unidad debe posponerse, o ser forzada."
 HOL_nvu.13.a: "Disgraceful"
 HOL_nvu.14.t: "La Hermandad Alemana nace"
 HOL_nvu.14.d: "Tras las negociaciones exitosas con los Países Bajos, se ha establecido oficialmente la Hermandad Alemana de Naciones. Esta nueva alianza se basa en la identidad cultural compartida, la cooperación militar y la unidad ideológica. Alemania se encuentra ahora en el corazón de un nuevo eje norte."
 HOL_nvu.14.a: "Einigkeit macht stark"
 HOL_nvu.15.t: "Proyecto de infraestructura germánica"
 HOL_nvu.15.d: "Para profundizar la integración y mejorar la movilidad estratégica entre los miembros de la Hermandad Alemana, nos hemos comprometido a invertir en infraestructuras críticas que unen nuestras naciones. Las redes ferroviarias y viales modernas atan el corazón de nuestra alianza norteña más cerca que nunca."
 HOL_nvu.15.a: "Colocar los cimientos de la unidad"
 HOL_nvu.16.t: "Inversión de recursos en el Rinlandia"
 HOL_nvu.16.d: "Como parte de nuestra creciente cooperación con Alemania, ingenieros holandeses y planificadores industriales han lanzado una nueva iniciativa de desarrollo en Rhineland. Enfoque Sobre la ampliación del acceso al acero y al aluminio, este proyecto impulsará la producción industrial de la región y asegurará materiales vitales para la causa alemana."
 HOL_nvu.16.a: "Fuerza por industria"
 HOL_nvu.17.t: "Invitación a unirse a la Hermandad Alemana"
 HOL_nvu.17.d: "Los Países Bajos han invitado oficialmente a Austria a unirse a la Hermandad Alemana de las Naciones. Esta alianza promete objetivos estratégicos compartidos, unidad cultural y cooperación militar. ¿Aceptaremos su visión para un futuro alemán unido?"
 HOL_nvu.17.a: "Aceptamos su oferta"
 HOL_nvu.17.b: "Debemos declinar."
 HOL_nvu.18.t: "Austria acepta la Hermandad"
 HOL_nvu.18.d: "Austria ha aceptado nuestra invitación a unirse a la Hermandad Alemana. Otra orgullosa nación alemana está con nosotros en unidad y fuerza."
 HOL_nvu.18.a: "Welcome, Austria"
 HOL_nvu.19.t: "Austria rechaza la Hermandad"
 HOL_nvu.19.d: "Austria ha rechazado nuestra invitación a unirse a la Hermandad Alemana. Su negativa será recordada."
 HOL_nvu.19.a: "Se arrepentirán de esto."
 HOL_nvu.20.t: "Apoyo naval holandés"
 HOL_nvu.20.d: "Los Países Bajos han extendido una mano de ayuda a nuestras ambiciones navales enviando ayuda material e inversiones marítimas. Con su experiencia, finalmente se están estableciendo las bases de una flota austríaca."
 HOL_nvu.20.a: "El renacimiento de la marina austriaca"
 HOL_nvu.21.t: "Fortalecimiento de la Unión Alemana"
 HOL_nvu.21.d: "Para garantizar una cooperación duradera entre las naciones germánicas, los Países Bajos han puesto en marcha nuevas políticas de integración, ofreciendo coordinación diplomática, planificación militar conjunta y apoyo económico. La Hermandad está evolucionando hacia una verdadera Unión."
 HOL_nvu.21.a: "La unidad es fuerza"
 HOL_nvu.22.t: "Propuesta neerlandesa de unificación"
 HOL_nvu.22.d: "Los Países Bajos han propuesto una completa unificación de los pueblos germánicos bajo un solo estado. Ahora debemos decidir si abrazamos la unidad o nos separamos."
 HOL_nvu.22.a: "Aceptamos el sindicato"
 HOL_nvu.22.b: "Rechazamos su oferta"
 HOL_nvu.23.t: "Unificación aceptada"
 HOL_nvu.23.d: "Nuestra oferta de unificación ha sido aceptada. Un nuevo imperio alemán nace bajo el liderazgo holandés."
 HOL_nvu.23.a: "El sueño cumplido"
 HOL_nvu.24.t: "Unificación rechazada"
 HOL_nvu.24.d: "Nuestra propuesta de unificación ha sido rechazada. Ahora debemos decidir si la Hermandad termina aquí, o continúa por la fuerza."
 HOL_nvu.24.a: "Entonces lo tomaremos."
 HOL_nvu.25.t: "Inversión holandesa en recursos austriacos"
 HOL_nvu.25.d: "En una nueva fase de integración económica, el gobierno holandés ha propuesto una inversión a gran escala en los sectores de extracción y refinamiento de recursos de Austria. El movimiento está previsto para modernizar la infraestructura crítica y mejorar la producción de materias primas en toda la región."
 HOL_nvu.25.a: "Esto fortalecerá nuestra base industrial."
 HOL_nvu.26.t: "Inversión holandesa en infraestructura ferroviaria Cross-German"
 HOL_nvu.26.d: "El Gobierno holandés ha anunciado un importante programa de inversión destinado a mejorar y ampliar la infraestructura ferroviaria en las regiones germánicas. Los funcionarios declaran que el objetivo es mejorar la movilidad, la integración económica y la unidad cultural entre los pueblos alemanes más amplios. El movimiento se alinea con la visión continental de Holanda y las crecientes ambiciones infrastructurales en Europa Central."
 HOL_nvu.26.a: "Un camino de hierro para un destino compartido."
 HOL_nvu.27.t: "Propuesta neerlandesa de unificación"
 HOL_nvu.27.d: "Los Países Bajos han propuesto una completa unificación de los pueblos germánicos bajo un solo estado. Ahora debemos decidir si abrazamos la unidad o nos separamos."
 HOL_nvu.27.a: "Aceptamos el sindicato"
 HOL_nvu.27.b: "Rechazamos su oferta"
 HOL_nvu.28.t: "Unificación aceptada"
 HOL_nvu.28.d: "Nuestra oferta de unificación ha sido aceptada. Un nuevo imperio alemán nace bajo el liderazgo holandés."
 HOL_nvu.28.a: "El sueño cumplido"
 HOL_nvu.29.t: "Unificación rechazada"
 HOL_nvu.29.d: "Nuestra propuesta de unificación ha sido rechazada. Ahora debemos decidir si la Hermandad termina aquí, o continúa por la fuerza."
 HOL_nvu.29.a: "Entonces lo tomaremos."
 HOL_common_event.18.t: "Sabaton en el Museo Militar Nacional"
 HOL_common_event.18.d: "El Museo Militar Nacional de Soesterberg ha acogido proyecciones de la película Sabaton The War To End All Wars, con el cofundador de banda Pär Sundström asistiendo personalmente. La visita trae la historia de la Gran Guerra a un amplio público nuevo y llama nueva atención a nuestro patrimonio militar."
 HOL_common_event.18.a: "Nuestra historia militar inspira a una nueva generación."
 HOL_ing_group_strategy_category: "ING grupo Estrategias"
 HOL_ing_group_strategy_category_desc: "\n£ing_bank_category_picture \n\n\n\nA medida que los ciclos económicos mundiales cambian entre períodos de crecimiento y recesión, el Banco ING está destinado a capitalizar estas fluctuaciones. Mediante una serie de maniobras financieras calculadas, ING puede extender su influencia sobre mercados nacionales e internacionales, dirigiendo tanto los esfuerzos de recuperación como los booms de expansión. Estas decisiones ofrecen a los Países Bajos la capacidad de aprovechar la influencia financiera del banco para estimular el crecimiento, gestionar el riesgo y maximizar los rendimientos de inversión. Al ajustar estratégicamente las políticas de préstamo, impulsar el gasto de los consumidores y ampliar las redes comerciales globales, ING no sólo fortalecerá su posición de mercado sino que también solidificará la posición de Holanda como una central eléctrica financiera."
 HOL_ing_group_strategies_expansion_GER: "Deutsche ING"
 HOL_ing_group_strategies_expansion_GER_desc: "§Y[GER.GetNameWithFlag]§! ha sido un mercado central de ING, con importantes inversiones en banca minorista y finanzas corporativas. Ampliar las operaciones de ING aquí consolidará aún más su posición en el sector bancario europeo."
 HOL_ing_group_strategies_expansion_POL: "ING Bank Śląski"
 HOL_ing_group_strategies_expansion_POL_desc: "ING ha establecido una fuerte presencia en §Y[POL.GetNameWithFlag]§! mediante ING Bank Śląski. Ampliarse más en este mercado de rápido crecimiento mejorará la influencia de ING en Europa Central y Oriental."
 HOL_ing_group_strategies_expansion_AST: "ING directo Australia"
 HOL_ing_group_strategies_expansion_AST_desc: "§Y[AST.GetAdjective]§! La economía impulsada por la innovación ofrece ING la oportunidad de liderar en la banca digital y la investigación. Ampliar las operaciones en Australia impulsará el crecimiento tecnológico de ING y solidificará su posición como líder en fintech."
 HOL_ing_group_strategies_expansion_SPR: "ING España"
 HOL_ing_group_strategies_expansion_SPR_desc: "§Y[SPR.GetNameWithFlag]§! es un mercado dinámico de inversiones bancarias e infraestructuras digitales. Al aumentar su presencia en España, ING puede capitalizar el crecimiento del desarrollo urbano y mejorar su cartera de financiación de la construcción."
 HOL_ing_group_strategies_expansion_ITA: "ING Italia"
 HOL_ing_group_strategies_expansion_ITA_desc: "§Y[ITA.GetNameWithFlag]§! ofrece un mercado financiero maduro con oportunidades de crecimiento en la banca corporativa. Ampliar a Italia ayudará a ING a establecer una posición más fuerte en el sur de Europa y aumentar las tasas de crecimiento económico."
 HOL_ing_group_strategies_expansion_TUR: "Banco de ING Turquía"
 HOL_ing_group_strategies_expansion_TUR_desc: "§Y[TUR.GetAdjective]§! La posición estratégica entre Europa y Asia presenta una oportunidad única para que ING amplíe su influencia comercial y financiera. Al invertir en Turquía, ING puede aumentar significativamente sus operaciones financieras relacionadas con el comercio."
 HOL_ing_group_strategies_expansion_USA: "ING U.S. Investment Management"
 HOL_ing_group_strategies_expansion_USA_desc: "§Y[USA.GetNameWithFlag]§!, como la economía más grande del mundo, ofrece inmensas oportunidades para el ING, especialmente en la gestión de inversiones. Ampliar en Estados Unidos asegurará el papel de ING como un importante jugador global en la gestión de activos."
 HOL_ing_group_strategies_expansion_ROM: "Banco de ING Rumania"
 HOL_ing_group_strategies_expansion_ROM_desc: "§Y[ROM.GetAdjective]§! El mercado emergente proporciona a ING la oportunidad de apoyar la infraestructura y el desarrollo económico. Otras inversiones en Rumania aumentarán la influencia de ING en el sector financiero creciente de Europa del Este."
 HOL_ing_group_strategies_expansion_speciality1: "ING digital primero"
 HOL_ing_group_strategies_expansion_speciality1_desc: "Con el mundo cada vez más avanzando hacia soluciones digitales, ING puede asegurar su posición como líder en la banca digital a través de la primera estrategia Digital. La especialización en esta área mejorará la seguridad cibernética, reducirá los costos de transacción y aumentará la eficiencia bancaria digital."
 HOL_ing_group_strategies_expansion_speciality2: "ING Terra acercarse"
 HOL_ing_group_strategies_expansion_speciality2_desc: "Con el compromiso de alinear sus inversiones con los objetivos climáticos globales, ING's Terra Approach se centra en la financiación de proyectos de energía verde y desarrollo sostenible. La especialización en las finanzas sostenibles aumentará la producción de energía verde y atraerá inversiones ecológicamente conscientes."
 HOL_ing_group_strategies_expansion_speciality3: "ING Banca al por mayor"
 HOL_ing_group_strategies_expansion_speciality3_desc: "Los clientes corporativos son un foco clave del negocio de ING. Al especializarse en la banca mayorista, ING mejorará su capacidad de ofrecer soluciones financieras a medida a grandes empresas, e impulsará el crecimiento y los ingresos corporativos."
 HOL_ing_group_strategies_expansion_speciality4: "ING Servicios de riqueza"
 HOL_ing_group_strategies_expansion_speciality4_desc: "La gestión de la riqueza ofrece altas rentabilidades y relaciones con los clientes a largo plazo. La especialización en la gestión de las riquezas permitirá a ING atender a personas de alto valor neto, aumentar el impuesto sobre los ingresos de la riqueza y ampliar sus servicios financieros personales."
 HOL_carrier_production: "Programa de adquisición de portaaviones"
 HOL_carrier_production_desc: "\n£hol_carrier_program_decision_category \n\n\n\nLos Países Bajos procuran ampliar sus capacidades navales adquiriendo portaaviones de las naciones. Estas decisiones nos permitirán fortalecer nuestra flota y el poder del proyecto en todo el mar mediante alianzas estratégicas y adquisiciones militares."
 HOL_request_carrier_production_uk: "Solicitar apoyo británico para la construcción de portaaviones"
 HOL_request_carrier_production_uk_desc: "La Armada Real tiene siglos de experiencia marítima, y sus modernos portadores de aeronaves Queen Elizabeth-Class reflejan un diseño naval de vanguardia. Una asociación con el Reino Unido podría permitir que codesarrollemos un nuevo buque adaptado a las operaciones de los expedidores holandeses y la OTAN."
 HOL_request_carrier_production_chn: "Solicitar apoyo chino para la construcción de portaaviones"
 HOL_request_carrier_production_chn_desc: "La rápida expansión naval de China la ha situado como potencia constructora naval mundial. Aprovechar su escala industrial y sus diseños militares modernos podría permitirnos desplegar un portaaviones con capacidades únicas, aunque esa alineación puede tensar las relaciones occidentales."
 HOL_request_carrier_production_dutch: "Invertir en la construcción nacional de portaaviones"
 HOL_request_carrier_production_dutch_desc: "Los Países Bajos iniciarán la construcción de un portaaviones autóctonos utilizando astilleros nacionales e ingeniería holandesa avanzada. Aunque más lento y costoso que la asistencia extranjera, este esfuerzo refuerza la soberanía nacional y apoya nuestra industria naval."
 HOL_influence_flanders: "Prominencia en §Y[FLN.GetNameWithFlag]§!"
 HOL_influence_flanders_desc: "Con profundos vínculos culturales e históricos entre §Y[HOL.GetNameWithFlag]§! y §Y[FLN.GetNameWithFlag]§!, surge una oportunidad única para avanzar hacia la alineación con la gobernanza holandesa. §Y[HOL.GetNameWithFlag]§! aspira a aumentar gradualmente su paso §Y[FLN.GetNameWithFlag]§!, potencialmente conduce a la plena integración.\n\nA medida que la influencia alcanza niveles más altos, §Y[FLN.GetNameWithFlag]§! puede crecer más independiente de §Y[BEL.GetNameWithFlag]§!, con mayores posibilidades de integración con los Países Bajos. Sin embargo, §Y[BEL.GetNameWithFlag]§! tiene el poder de resistir esta influencia, contrarrestar los esfuerzos holandeses y reforzar §Y[FLN.GetNameWithFlag]§!«lazos con su actual gobierno."
 HOL_high_influence_belgium: "Alto §Y[HOL.GetAdjective]§! Prominencia en §Y[BEL.GetNameWithFlag]§!"
 HOL_high_influence_belgium_desc: "Nuestra prominencia en §Y[FLN.GetNameWithFlag]§! ha alcanzado un nivel notable y despierta apoyo a la integración con §Y[HOL.GetNameWithFlag]§!."
 HOL_voc_category: "El Legado VOC Reborn"
 HOL_voc_category_desc: "\n£hol_voc_category_picture \n\n\n\nLa Compañía holandesa de la India, o Vereenigde Oostindische Compagnie (VOC), fue una vez el imperio comercial más poderoso del mundo. Sus flotas gobernaron los mares, sus comerciantes controlaron el comercio mundial de especias, y sus administradores crearon un imperio colonial que abarcaba continentes. Ahora, en la era moderna, §Y[HOL.GetNameWithFlag]§! tiene la oportunidad de revivir este legado consagrado. §Y[HOL.GetFlag][HOL.GetAdjective]§! experiencia en comercio, diplomacia e innovación, la VOC puede elevarse de nuevo, no como una reliquia del pasado, sino como una fuerza para dar forma al futuro.\n\n §Y[IND.GetNameWithFlag]§! es nuestro proyecto especial. Si queremos recuperar nuestra colonia de coronas de nuevo, tenemos que preparar una invasión. Para montar una invasión exitosa necesitamos asegurar una cabeza de playa lo más rápido posible. Podemos comenzar los preparativos para eso pero necesitamos mantener nuestra §Rdetección§! lo más bajo posible. De lo contrario podemos ser descubiertos y un aterrizaje será muy difícil.\n\n Nuestra situación actual:\n §GFuerza§! in §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_strength|+]\n §RChance de detección§! in §YJava Island§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_detection_chance|-] \n §GFuerza§! in §YSumatra Island§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_strength|+]\n §RChance de detección§! in §YSumatra Island§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_detection_chance|-] \n §GFuerza§! in §YKalimantan§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_strength|+]\n §RChance de detección§! in §YKalimantan§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_detection_chance|-]"
 HOL_voc_category_ind: "§Y[HOL.GetFlag][HOL.GetAdjective] §! peligro para §Y[IND.GetNameWithFlag]§!"
 HOL_voc_category_ind_desc: "El §Y[HOL.GetFlag][HOL.GetAdjective]§! han anunciado que harán lo que sea necesario para recuperar su imperio colonial. Necesitamos prepararnos a nosotros mismos para este peligro inminente porque no seremos tan fácilmente derrotados! Podemos aumentar nuestras posibilidades de detección aumentando nuestra inteligencia de los §Y[HOL.GetFlag][HOL.GetAdjective]§! y la inversión en nuestro §YServicio de Seguridad§!. \n\n Posibilidad de detección actual §Y[HOL.GetFlag][HOL.GetAdjective]§! Preparativos: \n\n§GChance de detección§! in §YJava Island§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_detection_chance|+]\n§GChance de detección§! in §YSumatra Island§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_detection_chance|+]\n§GChance de detección§! in §YKalimantan Island§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_detection_chance|+]"
 HOL_wic_category: "La Frontera Bold de la WIC"
 HOL_wic_category_desc: "\n£hol_wic_category_picture \n\n\n\nLa Compañía holandesa de la India Occidental (WIC) fue una fuerza de ambición y atrevimiento, navegando en aguas inexploradas para establecer influencia holandesa en las Américas y África occidental. Desde las plantaciones de azúcar de Suriname hasta los centros comerciales del Caribe y la Costa Dorada Africana, el WIC forjó un imperio colonial a través del comercio, conflicto e ingenio. Aunque sus días de gloria se desvanecieron, su legado sigue siendo un testamento para la resiliencia y visión holandesas."
 HOL_core_german_state_schleswig_holstein: "Integrar Schleswig-Holstein"
 HOL_core_german_state_schleswig_holstein_desc: "Este territorio es cultural y estratégicamente importante. La plena integración en el estado holandés fortalecerá nuestra influencia en el mundo alemán."
 HOL_core_german_state_niedersachsen: "Integrar Niedersachsen"
 HOL_core_german_state_niedersachsen_desc: "Esta región forma la columna vertebral norte de Alemania. Integrarla solidificaría nuestro control sobre la Tierra Baja Alemana."
 HOL_core_german_state_nordrhein_westfalen: "Integrar Nordrhein-Westfalen"
 HOL_core_german_state_nordrhein_westfalen_desc: "Una de las regiones más industriales de Europa; su integración mejorará nuestra posición económica y estratégica."
 HOL_core_german_state_rheinland_pfalz: "Integrar Rheinland-Pfalz"
 HOL_core_german_state_rheinland_pfalz_desc: "Poner esta región bajo nuestro control refuerza nuestra presencia histórica y cultural a lo largo del Rin."
 HOL_core_german_state_hessen: "Integrar Hessen"
 HOL_core_german_state_hessen_desc: "La región hesiana puentea Alemania occidental y central. Consolidarla apoya la unidad nacional."
 HOL_core_german_state_baden_wurttemberg: "Integrar Baden-Württemberg"
 HOL_core_german_state_baden_wurttemberg_desc: "Una región rica y poderosa: integrar Baden-Wurtemberg refuerza nuestra reclamación de liderazgo del sur de Alemania."
 HOL_core_german_state_bayern: "Integrar Baviera"
 HOL_core_german_state_bayern_desc: "Históricamente distinta pero innegablemente central para Alemania, la integración de Baviera extiende nuestra influencia a los territorios del sur."
 HOL_core_german_state_sachsen: "Integrar la Sajonia"
 HOL_core_german_state_sachsen_desc: "Sajonia ha sido durante mucho tiempo un centro de la cultura y la industria alemanas. Integrarla mejora tanto el patrimonio como la capacidad."
 HOL_core_german_state_berlin: "Integrar Berlín"
 HOL_core_german_state_berlin_desc: "Como antigua capital de Prusia y de Alemania, la integración de Berlín es una necesidad simbólica y estratégica."
 HOL_core_german_state_steiermark: "Integrar la Styria"
 HOL_core_german_state_steiermark_desc: "Históricamente ligada a Austria, integrar Estiria refuerza nuestra presencia en el mundo germánico alpino."
 HOL_core_german_state_austria_proper: "Integrar Austria Proper"
 HOL_core_german_state_austria_proper_desc: "En el corazón del legado de los Habsburgo está la propia Austria. Su integración afirma nuestro liderazgo sobre el mundo germánico."
 HOL_core_german_state_tirol: "Integrar Tirol"
 HOL_core_german_state_tirol_desc: "Las montañas de Tirol son estratégicamente valiosas y están vinculadas culturalmente. Llevarlos a nuestro pliegue asegura nuestra frontera alpina."
 HOL_core_german_state_mecklenburg: "Integrar Mecklenburg"
 HOL_core_german_state_mecklenburg_desc: "Una región marítima del norte esencial para controlar el acceso al Báltico; su integración extiende el alcance naval neerlandés."
 HOL_core_german_state_thuringen: "Integrar la Turingia"
 HOL_core_german_state_thuringen_desc: "Céntrica y culturalmente rica, integrar Turingia refuerza nuestra posición en el centro de Alemania."
 HOL_core_german_state_franken: "Integrar la Franconia"
 HOL_core_german_state_franken_desc: "Integrar esta región cultural fragmentada une la herencia germánica bajo una sola bandera."
 HOL_core_german_state_koln_bonn: "Integrar Colonia-Bonn"
 HOL_core_german_state_koln_bonn_desc: "Esta central económica y cultural es una piedra angular de la influencia alemana occidental, esencial para integrarse."
 HOL_core_german_state_saarland: "Integrar Saarland"
 HOL_core_german_state_saarland_desc: "Una región fronteriza con recursos estratégicos: la integración del Sarre asegura la puerta de entrada a Francia."
 HOL_core_german_state_sachsen_anhalt: "Integrar Sajonia-Anhalt"
 HOL_core_german_state_sachsen_anhalt_desc: "Integrar Sajonia-Anhalt refuerza nuestro control del centro de Alemania y de su base industrial."
 HOL_core_german_state_brandenburg: "Integrar Brandenburg"
 HOL_core_german_state_brandenburg_desc: "Antigua sede del poder prusiano, la integración de Brandeburgo es un paso vital para restaurar el liderazgo germánico."
 HOL_core_german_state_hamburg: "Integrar Hamburgo"
 HOL_core_german_state_hamburg_desc: "Como puerto mundial y centro económico, la integración de Hamburgo ancla nuestro dominio comercial en el norte de Europa."
 HOL_Damen_naval_equipment_organisation_vlissingen_heritage: "Patrimonio de Vlissingen"
 HOL_Damen_naval_equipment_organisation_tromp_lineage: "El linaje de trompas"
 HOL_Damen_naval_equipment_organisation_kortenaer_standard: "Estándar Kortenaer"
