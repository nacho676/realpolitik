 track_ii: "Pista II Contactos"
 apply_to_join_as_a_member_desc: "La membresía plena en la Organización de Cooperación de Shanghái da acceso a la arquitectura de seguridad, los cauces de inversión económica y los mecanismos de coordinación política de la organización. La solicitud activa un periodo de consideración de noventa días y, si se aprueba, otorga la idea del nivel de membresía correspondiente según la vía de enfoque actual de China."
 apply_to_join_as_an_observer_desc: "El estatus de observador da acceso a las cumbres, los ejercicios conjuntos y los marcos de coordinación económica de la Organización de Cooperación de Shanghái sin las obligaciones de la membresía plena. Los solicitantes deben superar un periodo de revisión de noventa días por parte de China y, en su caso, de Rusia antes de que se conceda la idea."
 BRI_apply_for_mining_project: "Solicitar un proyecto minero de la Franja y la Ruta"
 BRI_apply_for_mining_project_desc: "Solicitar un proyecto minero. La aprobación requiere 40 de nuestro tesoro o crea un préstamo chino por la misma cantidad."
 BRI_apply_for_pipeline_project: "Solicitar un proyecto de oleoducto de la Franja y la Ruta"
 BRI_apply_for_pipeline_project_desc: "Solicitar un proyecto de oleoducto. La aprobación requiere 40 de nuestro tesoro o crea un préstamo chino por la misma cantidad."
 BRI_apply_for_port_project: "Solicitar un proyecto portuario de la Franja y la Ruta"
 BRI_apply_for_port_project_desc: "Solicitar un proyecto portuario. La aprobación requiere 40 de nuestro tesoro o crea un préstamo chino por la misma cantidad."
 BRI_apply_for_powerplant_project: "Solicitar un proyecto de central eléctrica de la Franja y la Ruta"
 BRI_apply_for_powerplant_project_desc: "Solicitar un proyecto energético. La aprobación requiere 40 de nuestro tesoro o crea un préstamo chino por la misma cantidad."
 BRI_apply_for_prestige_project: "Solicitar un proyecto de prestigio de la Franja y la Ruta"
 BRI_apply_for_prestige_project_desc: "Solicitar un proyecto de prestigio. La aprobación requiere 40 de nuestro tesoro o crea un préstamo chino por la misma cantidad."
 BRI_apply_for_railway_project: "Solicitar un proyecto ferroviario de la Franja y la Ruta"
 BRI_apply_for_railway_project_desc: "Solicitar un proyecto ferroviario. La aprobación requiere 40 de nuestro tesoro o crea un préstamo chino por la misma cantidad."
 BRI_apply_for_sez_project: "Solicitar una zona económica especial de la Franja y la Ruta"
 BRI_apply_for_sez_project_desc: "Solicitar una zona económica especial. La aprobación requiere 40 de nuestro tesoro o crea un préstamo chino por la misma cantidad."
 BRI_apply_for_telecom_project: "Solicitar un proyecto de telecomunicaciones de la Franja y la Ruta"
 BRI_apply_for_telecom_project_desc: "Solicitar un proyecto de telecomunicaciones. La aprobación requiere 40 de nuestro tesoro o crea un préstamo chino por la misma cantidad."
 BRI_request_loan_extension: "Solicitud de extensión del préstamo"
 BRI_request_loan_extension_desc: "Solicitar a Pekín un periodo de gracia de pagos de un año sobre una obligación morosa de la Franja y la Ruta. El principal no se condona."
 CHI_16_national_congress_mission: "16.º Congreso del Partido Comunista de China"
 CHI_16_national_congress_mission_desc: "El 16.º Congreso Nacional del Partido Comunista Chino se reunirá en 2002, marcando una transición de liderazgo generacional."
 CHI_16_national_congress_mission_tt: "§REsto evitará los focos necesarios para completar§! §Y $CHI_the_shanghai_succession$§!"
 CHI_17_national_congress_mission: "17.º Congreso del Partido Comunista de China"
 CHI_17_national_congress_mission_desc: "El 17.º Congreso Nacional se reunirá en 2007 para consolidar la agenda de liderazgo actual."
 CHI_18_national_congress_mission: "18.º Congreso del Partido Comunista de China"
 CHI_18_national_congress_mission_desc: "El 18.º Congreso Nacional se reunirá en 2012, que espera traer cambios significativos de liderazgo."
 CHI_19_national_congress_mission: "19.º Congreso del Partido Comunista de China"
 CHI_19_national_congress_mission_desc: "El 19.º Congreso Nacional se reunirá en 2017 para revisar la dirección del partido y reafirmar su liderazgo."
 CHI_20_national_congress_mission: "20.º Congreso del Partido Comunista de China"
 CHI_20_national_congress_mission_desc: "El XX Congreso Nacional se reunirá en 2022 en medio de preguntas sobre la continuidad del liderazgo y los plazos."
 CHI_21_national_congress_mission: "21.º Congreso del Partido Comunista de China"
 CHI_21_national_congress_mission_desc: "El 21.º Congreso Nacional se reunirá en 2027 para trazar el rumbo del partido para la próxima era."
 CHI_abolish_birth_limits: "Eliminar los límites de nacimiento"
 CHI_abolish_birth_limits_desc: "Se derogan formalmente todas las restricciones restantes al tamaño de las familias. El Estado pasa de limitar los nacimientos a fomentarlos activamente, y pone fin a una era de control demográfico que comenzó bajo Mao y se institucionalizó bajo Deng. El cambio reconoce que los costos de aplicación ya superan cualquier beneficio demográfico de la restricción y que la fertilidad voluntaria ya está muy por debajo de la tasa de reemplazo."
 CHI_activate_princeling_network: "Activar la red de los «príncipes rojos»"
 CHI_activate_princeling_network_desc: "Los contactos de ex alumnos, los vínculos comerciales y los activos de personal general se reúnen en un instrumento coordinado de política. La Red Princeling comienza a funcionar como nuestra palanca decisiva sobre Pyongyang."
 CHI_activate_rare_earth_embargo: "Activar el embargo de tierras raras"
 CHI_activate_rare_earth_embargo_desc: "Cortar las exportaciones de wolframio y cromo a Japón. El embargo se mantiene hasta que se levante, Japón capitule o Tokio diversifique su suministro."
 CHI_adopt_three_child_policy: "Política de tres hijos"
 CHI_adopt_three_child_policy_desc: "Tras los resultados del censo de 2020, Pekín permite a las parejas tener hasta tres hijos y acompaña el anuncio de un paquete de subsidios, permisos parentales ampliados y topes a los costos de las clases particulares. Los analistas señalan que Corea del Sur, Japón y Singapur probaron medidas similares con poco efecto; el rápido aumento del costo de vida urbano en China y el cambio cultural hacia familias más pequeñas plantean la misma barrera estructural."
 CHI_adopt_two_child_policy: "Bi-Child Policy"
 CHI_adopt_two_child_policy_desc: "El Consejo de Estado anuncia la política universal de dos hijos, con efecto a partir del 1 de enero de 2016. El límite de un hijo, vigente desde 1980, es elevado para todas las parejas. Los modeladores demográficos proyectan sólo un modesto aumento de los nacimientos: después de decenios de normas relativas a la familia pequeña, el costo de la vida, los precios de la vivienda y la participación femenina en las fuerzas del trabajo suprimen bien la fecundidad por debajo del reemplazo, incluso sin limitaciones legales."
 CHI_anti_desertification_belt: "Expansión de la barrera trinorte"
 CHI_anti_desertification_belt_desc: "El Programa de Selterbelt Three-North, que se ejecuta desde 1978 a través del norte de China, Mongolia Interior y el noreste, es la mayor campaña mundial de forestación, con un total previsto de 88 mil millones de árboles para 2050. Las nuevas fases de plantación se centran en soportes mixtos que anclan el suelo, conservan la nieve fundida y restauran las cuencas hidrográficas degradadas en la Meseta de Loess y las Tierras Sandy Hunshandake. La cubierta vegetal restaurada reduce las cargas de sedimentos en el río Amarillo y ralentiza el avance hacia el sur del Desierto Gobi."
 CHI_Asset_Seizure: "Aprovechar el conjunto estratégico"
 CHI_Asset_Seizure_desc: "Convertir un activo de infraestructura en mora en una participación controlada por China y reducir el principal en el costo de un proyecto. Solo disponible en la vía de préstamos depredadores."
 CHI_asteroid_mining_investment: "Invertir en minería de asteroides"
 CHI_asteroid_mining_investment_desc: "Comprometer capital en una empresa comercial de recursos espaciales. Una operación exitosa desbloquea un dividendo industrial permanente obtenido de metales del grupo del platino, tierras raras, volátiles y manufactura en microgravedad. Podemos sostener como máximo cinco operaciones de este tipo a la vez."
 CHI_asteroid_survey_mission: "Encuesta de asteroides cercanos a la Tierra"
 CHI_asteroid_survey_mission_desc: "Sobre la navegación de espacio profundo probada por Tianwen, una sonda de prospección traza las órbitas y la composición mineral de asteroides cercanos a la Tierra accesibles. Un estudio exitoso abre la puerta a la extracción comercial de recursos espaciales."
 CHI_automation_robotics_push: "Impulso a la automatización y la robótica"
 CHI_automation_robotics_push_desc: "China se ha convertido en el mayor instalador de robots industriales del mundo, y despliega más unidades al año que la Unión Europea y Estados Unidos juntos. Una aceleración dirigida por el Estado apunta a los sectores manufactureros de uso intensivo de mano de obra que afrontan los mayores déficits de fuerza laboral. La inversión fluye hacia robots colaborativos, líneas de producción asistidas por IA y sistemas logísticos inteligentes, que sustituyen con capital la mano de obra que retira la contracción demográfica."
 CHI_avic_innovation: "AVIC: Innovación original"
 CHI_avic_innovation_desc: "La Corporación de la Industria de Aviación de China es la enorme matriz de la industria aeronáutica del país. Obligar a sus institutos a innovar en lugar de copiar acelera las células de las que depende el poder aéreo chino."
 CHI_back_nepalese_communists: "Los comunistas nepalíes"
 CHI_back_nepalese_communists_desc: "Canalizar fondos y apoyo ideológico a facciones comunistas de Katmandú, inclinando poco a poco el equilibrio político de Nepal hacia Pekín."
 CHI_beijing_hosted_talks: "Acoger la cumbre de emergencia de Pekín"
 CHI_beijing_hosted_talks_desc: "Invocar líderes coreanos a Beijing para la mediación de emergencia. Cuando las conversaciones bilaterales se han roto, sólo un anfitrión chino puede traer a ambos lados de vuelta a la mesa."
 CHI_beijing_washington_consultation: "Abrir una consulta Pekín-Washington"
 CHI_beijing_washington_consultation_desc: "Un canal discreto con el Departamento de Estado de EE. UU. permite que Pekín y Washington manejen la cuestión coreana por encima de Seúl. El arreglo inquieta a Tokio, que teme quedar marginado."
 CHI_big_fund_iii_allocate_tranche_decision: "Asignar el tramo del Big Fund III"
 CHI_big_fund_iii_allocate_tranche_decision_desc: "La tercera fase de 344 mil millones de yuanes del Fondo Nacional de Inversión de la Industria IC se desembolsa a un subsector objetivo. Cada tranche empuja otra fab a la plena utilización."
 CHI_boycott_lotte: "Boicoteando a Lotte"
 CHI_boycott_lotte_desc: "Organizar un boicot popular a las propiedades del Grupo Lotte en China en respuesta al arrendamiento por Lotte del terreno del emplazamiento del THAAD."
 CHI_BRI_Forum_Triennial: "Acoger el Foro de la Franja y la Ruta"
 CHI_BRI_Forum_Triennial_desc: "Etapa del Foro Trienal Franja y la Ruta en Beijing. Los jefes de estado de toda la red se reúnen para renovar compromisos y anunciar nuevos proyectos emblemáticos. Requiere un Tesoro Franja y la Ruta de al menos 150. Mayor tesorería con un enfriamiento de tres años."
 CHI_BRI_management: "Iniciativa de la Franja y la Ruta"
 CHI_BRI_management_desc: "La Iniciativa Franja y la Ruta es el principal instrumento de producción económica de China, canalizando el crédito en puertos, ferrocarriles, corredores energéticos e infraestructura digital a través de naciones asociadas en todo el mundo. Cada proyecto refuerza la conectividad física y el apalancamiento político simultáneamente.\n\n§YTreasury:§! ¥[?CHI_bri_treasury|0]B TENIDO Contribución mensual: +[?CHI_bri_monthly_income_total|0]\n§YProyectos:§! [?CHI_bri_committed_projects|0]/[?CHI_bri_project_slots|0] committed tención §G[?CHI_bri_completed_projects|0]§! completed prehensi §R[?CHI_bri_defaulted_projects|0]§! aggregate defaults\n§Y Ingresos bajos:§! [?CHI_bri_loan_income|2] semanal Silencio §Y Presencia Global:§! [?CHI_bri_global_presence|0]\n§G Desarrollo Mutuo [?CHI_bri_winwin_score|0]§! · §RPredatorio [?CHI_bri_predatory_score|0]§!"
 CHI_BRI_promote_digital_silk_road: "Actualización Digital Silk Road"
 CHI_BRI_promote_digital_silk_road_desc: "Cuando la infraestructura de telecomunicaciones cruza el umbral requerido, esta decisión mejora la idea del tierno Digital Silk Road, reflejando redes de fibra óptica construidas en China, estaciones terrestres por satélite y la infraestructura móvil suministrada por Huawei que se extiende a través de los estados asociados."
 CHI_BRI_promote_economic_zones: "Actualización de las Zonas Económicas Especiales"
 CHI_BRI_promote_economic_zones_desc: "Cuando el tally de desarrollo de la zona industrial cruza el umbral requerido, esta decisión mejora la idea más alta de las Zonas Económicas Especiales, reflejando los centros de procesamiento y logística gestionados por China que anclan cadenas de suministro y proporcionan condiciones preferenciales para las empresas chinas en países asociados."
 CHI_BRI_promote_energy_arteries: "Actualización de las arterias energéticas"
 CHI_BRI_promote_energy_arteries_desc: "Cuando el balance de construcción del oleoducto cruza el umbral requerido, esta decisión mejora la idea de nivelado Energy Arteries, lo que representa una infraestructura ampliada de transmisión de petróleo y gas que conecta a los productores de Asia central con las refinerías chinas y reduce la exposición a los puntos de choque marítimo."
 CHI_BRI_promote_maritime_network: "Red Marítima de actualización"
 CHI_BRI_promote_maritime_network_desc: "Cuando el tally de construcción portuaria de la Iniciativa Franja y la Ruta cruza el umbral requerido, esta decisión mejora la idea de la Red Marítima, ampliando la influencia de China sobre las rutas comerciales marinas y el acceso portuario concesionario del Océano Índico al Mediterráneo."
 CHI_BRI_promote_overland_corridors: "Corredores terrestres de actualización"
 CHI_BRI_promote_overland_corridors_desc: "Cuando la construcción ferroviaria cruza el umbral requerido, esta decisión mejora la idea de nivel superior de los corredores terrestres, lo que refleja la terminación de nuevos enlaces transcontinentales que reducen los costos de tránsito y profundizan la dependencia económica en Asia Central y el Cáucaso."
 CHI_BRI_promote_power_generation: "Actualización Red de Generación de Energía"
 CHI_BRI_promote_power_generation_desc: "Cuando la construcción de planta eléctrica financiada por BRI atraviesa el umbral requerido, esta decisión mejora la idea de nivel de generación de energía, reflejando instalaciones de carbón, hidro y solar construidas por empresas chinas que suministran electricidad a las economías asociadas al crear dependencias de mantenimiento a largo plazo."
 CHI_BRI_promote_prestige_diplomacy: "Diplomacia Prestige de actualización"
 CHI_BRI_promote_prestige_diplomacy_desc: "Cuando las terminaciones de proyectos de prestigio cruzan el umbral requerido, esta decisión mejora la idea del Tier Prestige Diplomacy, reflejando estadios emblemáticos, edificios gubernamentales y centros culturales que generan buena voluntad y demuestran el alcance de la artesanía china."
 CHI_BRI_promote_resource_concessions: "Concesiones de recursos de actualización"
 CHI_BRI_promote_resource_concessions_desc: "Cuando las concesiones de recursos garantizados cruzan el umbral requerido, esta decisión mejora la idea de nivel de Concesión de Recursos, representando acuerdos de extracción a largo plazo para cobre, cobalto, litio y otros minerales estratégicos que alimentan las cadenas chinas de suministro de manufactura."
 CHI_BRI_recipient_actions: "Iniciativa de la Franja y la Ruta"
 CHI_BRI_recipient_actions_desc: "Solicitar financiación para un proyecto de la Iniciativa de la Franja y la Ruta de la República Popular China."
 CHI_build_mega_rail_hub: "Construir el Mega Nudo Ferroviario"
 CHI_build_mega_rail_hub_desc: "Construir una enorme terminal ferroviaria integrada en una de las grandes ciudades de China, a la escala de Pekín Sur, Shanghái Hongqiao o Cantón Sur. Estos nudos funden la alta velocidad, el metro y las líneas interurbanas en un solo nodo y aceleran la construcción y la logística de la región."
 CHI_build_public_housing: "Construcción de viviendas públicas"
 CHI_build_public_housing_desc: "Movilizar brigadas de construcción para edificar vivienda de alquiler de propiedad estatal en [FROM.GetName]. Los proyectos ocupan capacidad de fábricas civiles durante dos años y reducen la carga nacional de bienes de consumo al terminar."
 CHI_caic_innovation: "CAIC: Innovación original"
 CHI_caic_innovation_desc: "Changhe Aircraft Industries construye los helicópteros de ataque dedicados del EPL, del Z-10 al Z-19. Liberar a sus ingenieros para asumir riesgos acelera una flota de ataque de ala rotatoria que durante mucho tiempo ha ido a la zaga de los diseños occidentales."
 CHI_cancel_east_china_sea_exercise: "Cancelar el ejercicio del Mar de China Oriental"
 CHI_cancel_east_china_sea_exercise_desc: "Los ejercicios navales y aéreos cerca de las disputadas islas Senkaku, o Diaoyu, enardecen de forma rutinaria las relaciones con Tokio. Cancelar el ejercicio previsto señala moderación, tranquiliza a Japón y apoya el relato de un ascenso pacífico."
 CHI_casc_innovation: "CASC: Innovación original"
 CHI_casc_innovation_desc: "La Corporación de Ciencia y Tecnología Aeroespacial de China gestiona los lanzamientos espaciales, los misiles balísticos y los satélites de la nación. Reformarla acelera los sistemas orbitales y estratégicos que sustentan la disuasión china."
 CHI_casic_innovation: "CASIC: Innovación original"
 CHI_casic_innovation_desc: "La Corporación de Ciencia e Industria Aeroespacial de China construye los misiles de crucero y tácticos del país, de la familia YJ a los sistemas de ataque a tierra. Dejar que sus oficinas asuman riesgos afila el arsenal de ataque de precisión."
 CHI_central_theatre_command: "Comando central de teatro"
 CHI_central_theatre_command_desc: "El Comando Central de Teatro en Beijing es la reserva estratégica y el escudo de la capital. Sostiene la autoridad de mando y la moral de la fuerza que respalda cada otra dirección."
 CHI_cetc_innovation: "CETC: Innovación original"
 CHI_cetc_innovation_desc: "China Electronics Technology Group suministra los radares, sensores y sistemas de gestión de combate de toda plataforma moderna. Reformar su cultura de investigación empuja la informática y la inteligencia artificial chinas hacia la frontera."
 CHI_chang_e_mission: "Lanzar la sonda Chang'e"
 CHI_chang_e_mission_desc: "Una misión robótica Chang'e parte hacia la Luna para alunizar, explorar y retransmitir a través del satélite puente Queqiao. Los datos que devuelva trazarán el mapa del terreno para los astronautas que vendrán después. Las probabilidades de éxito mejoran a medida que crece nuestra experiencia de lanzamiento."
 CHI_cheju_summit_arrangement: "Organizar una cumbre en Cheju"
 CHI_cheju_summit_arrangement_desc: "La isla balnearia de Cheju, o Jeju, ofrece terreno neutral para conversaciones de alto nivel con Corea del Sur. Una cumbre puede producir un avance diplomático, pero una reunión mal preparada corre el riesgo de que se repita públicamente que endurezca ambas partes."
 CHI_convene_bilateral_channel: "Convocar un canal bilateral"
 CHI_convene_bilateral_channel_desc: "El Diálogo Cuadrilateral de Seguridad vincula a los Estados Unidos, el Japón, la India y Australia contra Beijing. Abrir un canal bilateral tranquilo con Tokio duda sobre la cohesión de la agrupación y frena su consolidación."
 CHI_crack_down_tibet_separatism: "Reprimir el separatismo tibetano"
 CHI_crack_down_tibet_separatism_desc: "Suprimir la organización separatista en todo el Tíbet mediante medidas coordinadas de seguridad y administrativas. Reforza la autoridad central y acelera la integración."
 CHI_crack_down_xinjiang_separatism: "Reprimir el separatismo de Xinjiang"
 CHI_crack_down_xinjiang_separatism_desc: "Desplegar fuerzas de seguridad interna por Xinjiang para desmantelar células separatistas. Aprieta el control estatal sobre la región y aumenta el cumplimiento, pero atrae el escrutinio internacional."
 CHI_crewed_lunar_landing_mission: "Aterrizar astronautas en la Luna"
 CHI_crewed_lunar_landing_mission_desc: "Un Larga Marcha 10 eleva la nave tripulada Mengzhou y el módulo de aterrizaje Lanyue desde Wenchang en lanzamientos separados que se encuentran en órbita lunar. La tripulación debe descender a la región polar sur lunar, plantar la bandera y volver sana y salva, lo que convertiría a China en la segunda nación en llevar humanos a la Luna."
 CHI_critical_minerals_export_license_decision: "Restricciones a la exportación de minerales críticos"
 CHI_critical_minerals_export_license_decision_desc: "Restringir las exportaciones de galio, germanio y tierras raras bajo el marco de licencias de agosto de 2023. Los ingresos por tonelada suben al escasear el suministro."
 CHI_crrc_innovation: "CRRC: Innovación original"
 CHI_crrc_innovation_desc: "China Railway Rolling Stock Corporation es el mayor fabricante de equipo ferroviario del mundo, una base industrial pesada de uso dual y de enorme escala. Orientar su ingeniería a la defensa amplía el cimiento industrial que tiene debajo."
 CHI_csgc_innovation: "CSGC: Innovación original"
 CHI_csgc_innovation_desc: "China South Industries Group construye los vehículos blindados de combate y las armas ligeras del ejército junto con sus líneas de automóviles civiles. Vencer su cautela desbloquea una familia moderna de vehículos de combate."
 CHI_csic_innovation: "CSIC: Innovación original"
 CHI_csic_innovation_desc: "China Shipbuilding Industry Corporation, cuna histórica del diseño submarino chino, impulsa el servicio silencioso bajo las olas. Reformar sus institutos acelera la próxima generación de submarinos de ataque y de misiles balísticos."
 CHI_cssc_innovation: "CSSC: Innovación original"
 CHI_cssc_innovation_desc: "China State Shipbuilding Corporation es el gigante detrás de la flota de superficie de la Armada del EPL, incluidos sus portaaviones. Dejar innovar a sus astilleros acelera los buques de guerra de una armada de aguas azules."
 CHI_cultivate_pyongyang_contacts: "Cultivate Pyongyang Contactos"
 CHI_cultivate_pyongyang_contacts_desc: "China sigue siendo el patrón indispensable de Corea del Norte, y suministra la mayor parte de su combustible y alimentos. Construir relaciones discretas dentro de la dirigencia de Pionyang permite que Pekín tire de la estabilidad interna del régimen sin injerencia abierta."
 CHI_current_congress_mission: "Congreso Nacional Activo"
 CHI_current_congress_mission_desc: "El Congreso Nacional está en sesión. Se están terminando los nombramientos de la Comisión."
 CHI_cxmt_hbm_qualification_decision: "Homologar la HBM de CXMT para la IA nacional"
 CHI_cxmt_hbm_qualification_decision_desc: "Trasladar la memoria de gran ancho de banda de CXMT a las construcciones de aceleradores de Cambricon, Biren y Moore Threads, y poner fin a la dependencia de Nvidia y Samsung en las cargas de IA nacionales."
 CHI_dandong_military_district: "Reforzar el Distrito Militar de Dandong"
 CHI_dandong_military_district_desc: "Dandong se asienta en el río Yalu frente a Corea del Norte, el principal paso de la frontera China-RPDC. Reforzar la guarnición del Noreste honra la doctrina de los Labios y los Dientes de defensa mutua con Pionyang y endurece la frontera de Manchuria."
 CHI_de_escalate_at_LAC: "Desescalar en la Línea de Control Real"
 CHI_de_escalate_at_LAC_desc: "Tras los choques del valle de Galwan de 2020, China e India mantuvieron tensos enfrentamientos a lo largo de la disputada Línea de Control Real en Ladakh. Ordenar al personal fronterizo replegarse de las posiciones avanzadas alivia la confrontación con Nueva Delhi y reduce las tensiones regionales."
 CHI_Debt_Restructuring: "Deuda de socio de reestructuración"
 CHI_Debt_Restructuring_desc: "Reducir la tasa de un socio moroso al 2% y conceder un año sin pagos. El principal sigue pendiente. Solo disponible en la vía de cooperación de beneficio mutuo."
 CHI_deploy_paf_maritime_militia: "Desplegar la milicia marítima de la PAF"
 CHI_deploy_paf_maritime_militia_desc: "La presencia de milicias marítimas en torno a Diaoyu. Cada mes aumenta la presión de Senkaku y arriesga un incidente."
 CHI_drip_irrigation_rollout: "Rodamiento de riego por goteo"
 CHI_drip_irrigation_rollout_desc: "La agricultura china extrae más de 360 mil millones de metros cúbicos de agua al año, la mayoría mediante riego por inundación de surcos cuya eficiencia rara vez supera el 50 por ciento. Un despliegue nacional de sistemas de riego por goteo y microrriego, inspirado en la experiencia de agricultura de precisión de Israel y piloteado en el cinturón algodonero de Xinjiang, reduce el consumo de agua a nivel de campo entre un 30 y un 50 por ciento por hectárea. Los programas de equipo subsidiado y las normas obligatorias de eficiencia para los nuevos distritos de riego extienden la tecnología de las granjas de demostración al sector agrícola en general."
 CHI_duv_breakthrough_decision: "Impulsar el programa SMEE DUV"
 CHI_duv_breakthrough_decision_desc: "Forzar una demostración de litografía de inmersión de 28 nm de Shanghai Micro Electronics. El éxito reescribe el mercado mundial de herramientas; el fracaso quema capital y empuja el calendario otro año."
 CHI_eastern_theatre_command: "Comando de teatro oriental"
 CHI_eastern_theatre_command_desc: "Con sede en Nankín, el Mando del Teatro Oriental encara el Estrecho de Taiwán y el Mar de China Oriental. Sus fuerzas se basan en el asalto anfibio y la potencia de fuego necesaria para romper una costa defendida."
 CHI_eleventh_five_year_plan_mission: "11th Five-Year Plan"
 CHI_eleventh_five_year_plan_mission_desc: "El 11.º Plan Quinquenal de China (2006–2010) fija seis metas obligatorias de desarrollo en crecimiento económico, expansión del sector terciario, capacidad industrial, infraestructura nacional, eficiencia energética y bienestar social. La Comisión Nacional de Desarrollo y Reforma supervisará el avance durante la ventana de cinco años."
 CHI_establish_dandong_safe_houses: "Establecer casas seguras en Dandong"
 CHI_establish_dandong_safe_houses_desc: "Montar casas seguras a lo largo del Yalu para acoger y organizar a desertores afines a Jang. Una base de operaciones discreta para futuras operaciones."
 CHI_fabless_provincial_subsidy_decision: "Ronda provincial de subsidios a empresas sin fábrica"
 CHI_fabless_provincial_subsidy_decision_desc: "Shanghái, Shenzhen y Pekín igualan cada una el tramo del Big Fund central con su propio capital de riesgo para el conglomerado de casas de diseño."
 CHI_facilitate_family_reunions: "Facilitar las reuniones familiares"
 CHI_facilitate_family_reunions_desc: "Utilizar redes logísticas chinas para organizar reuniones familiares transfronterizas. La compensación humanitaria es igualada por la buena voluntad diplomática que genera."
 CHI_factional_balance_category: "Saldo Faccional"
 CHI_factional_balance_category_desc: "El Partido Comunista Chino no es monolítico. Las facciones competentes, arraigadas en redes de patrocinio, tendencias ideológicas y trayectorias profesionales, impugnan la influencia sobre nombramientos de personal, política económica y el ritmo de reforma política. La gestión del equilibrio de poder entre estos bloques internos es un requisito previo para una gobernanza estable."
 CHI_FOCAC_Summit: "Conferencia de las Naciones Unidas sobre el Cambio Climático"
 CHI_FOCAC_Summit_desc: "Acoger una cumbre trienal del Foro de Cooperación China-África. Cuesta 50 tanto del fondo BRI como del tesoro nacional, además de capital político, con un enfriamiento de tres años."
 CHI_fund_princeling_ventures: "Financiar empresas de los «príncipes rojos»"
 CHI_fund_princeling_ventures_desc: "Financiar empresas transfronterizas dirigidas por los «príncipes» norcoreanos. La riqueza atada al capital chino crea una lealtad que la ideología no puede dar."
 CHI_fusion_program: "Programa nacional de fusión"
 CHI_fusion_program_desc: "Concentrar la investigación nacional en la fusión nuclear controlada en Hefei, sede del Tokamak Superconductor Avanzado Experimental (EAST), del dispositivo BEST y del planeado Reactor de Pruebas de Ingeniería de Fusión de China. Dominar el «sol artificial» promete una fuente ilimitada de electricidad limpia."
 CHI_gobi_desert_solar_expansion: "Fase de expansión solar y eólica del Gobi"
 CHI_gobi_desert_solar_expansion_desc: "Encargar una fase adicional de construcción de paneles solares y turbinas eólicas en el desierto de Gobi, y ampliar la capacidad de generación renovable. Cada fase exige una importante capacidad de construcción civil y reduce temporalmente el rendimiento general de la construcción en todo el país."
 CHI_grey_society_crisis: "Crisis de la Sociedad Gris"
 CHI_grey_society_crisis_desc: "La población en edad de trabajar de China alcanzó su máximo hacia 2011 y desde entonces se reduce. Cuatro décadas de política del hijo único han invertido la pirámide de edad: un solo hijo suele mantener hoy a dos padres y cuatro abuelos, mientras los costos de pensiones y sanidad suben más rápido que el PIB. La próxima década pondrá a prueba si China puede sostener el crecimiento mientras su fuerza laboral se contrae y su población anciana se expande. Esta crisis persistirá durante años; las decisiones de mitigación reducen su duración."
 CHI_haig_innovation: "HAIG: Innovación original"
 CHI_haig_innovation_desc: "Harbin Aircraft Industry Group produce los helicópteros de transporte y utilitarios del EPL, entre ellos el Z-9 y el nuevo Z-20. Liberar a sus diseñadores acelera una flota de ala rotatoria versátil."
 CHI_hsr_beijing_shanghai: "Pekín-Shanghai High-Speed railway"
 CHI_hsr_beijing_shanghai_desc: "Construir el ferrocarril de alta velocidad Pekín-Shanghái de 1318 kilómetros, que enlaza las capitales política y financiera de China. El corredor de alta velocidad más transitado del mundo en su apertura, reduce el trayecto de catorce horas a cuatro horas y cuarenta minutos a 300 km/h."
 CHI_hsr_beijing_tianjin: "Pekín-Tianjin Intercity Railway"
 CHI_hsr_beijing_tianjin_desc: "Construir el ferrocarril interurbano Pekín-Tianjin de 117 kilómetros, nuestra primera línea de alta velocidad diseñada para velocidades comerciales de 350 km/h. El trayecto entre ambas ciudades bajará de 70 a 30 minutos y anclará un corredor económico unificado Pekín-Tianjin-Hebei."
 CHI_hsr_chengdu_chongqing: "Chengdu-Chongqing ferrocarril de alta velocidad"
 CHI_hsr_chengdu_chongqing_desc: "Construir la conexión ferroviaria de alta velocidad entre Chengdu y Chongqing, los dos anclajes de la estrategia de desarrollo del oeste. Su finalización integra a las dos megaciudades en un único círculo económico de una hora y forma la columna vertebral de la red de alta velocidad occidental en expansión."
 CHI_hsr_wuhan_guangzhou: "Ferrocarril de alta velocidad Wuhan-Cantón"
 CHI_hsr_wuhan_guangzhou_desc: "Construir el ferrocarril de alta velocidad Wuhan-Cantón de 1069 kilómetros, que conecta el centro de China con el corazón manufacturero del Delta del Río de las Perlas. En su apertura es la línea de alta velocidad más larga del mundo y reduce el trayecto de más de diez horas a menos de tres."
 CHI_identify_beida_alumni: "Identificar a los egresados de la Universidad de Pekín"
 CHI_identify_beida_alumni_desc: "Perfilar a los hijos de la élite norcoreana educados en la Universidad de Pekín. Sus lazos con China y sus inclinaciones reformistas los hacen candidatos a un futuro gobierno."
 CHI_industrial_investment_category: "Programa de inversión petroquímica y energética"
 CHI_industrial_investment_category_desc: "Las decisiones de inversión industrial estratégica se desbloquearon a través de la base petroquímica de China y los árboles de enfoque energético renovable."
 CHI_initiate_joint_exercises_with_RAJ: "Iniciar ejercicios conjuntos con India"
 CHI_initiate_joint_exercises_with_RAJ_desc: "Realizar un ciclo de ejercicios combinados con las Fuerzas Armadas de la India para construir confianza y reforzar los avances de desescalada fronteriza."
 CHI_initiate_joint_military_training: "Iniciar el entrenamiento conjunto de los Hermanos de Hierro"
 CHI_initiate_joint_military_training_desc: "Realizar un ciclo de ejercicios combinados con las Fuerzas Armadas de Pakistán para mejorar la interoperabilidad y la alineación doctrinal."
 CHI_inner_mongolia_innovation: "Primer Grupo de Maquinaria: innovación original"
 CHI_inner_mongolia_innovation_desc: "Inner Mongolia First Machinery Group es la cuna del blindaje chino, y construye el tanque de batalla principal Tipo 99 en Baotou. Vencer su cautela burocrática desbloquea una nueva generación de vehículos de combate pesados."
 CHI_insert_jang_assets: "Inserte los activos de Jang"
 CHI_insert_jang_assets_desc: "Devolver a la RPDC, bajo cobertura, a agentes afines a Jang. Una vez en su sitio, esperan la activación."
 CHI_invest_domestic_arms_lines: "Invertir en líneas nacionales de armamento"
 CHI_invest_domestic_arms_lines_desc: "Dirigir fondos estatales a las líneas de producción de NORINCO y AVIC para que los pedidos del EPL se cumplan en casa y no mediante contratos de Rosoboronexport. Cada ronda de inversión reduce la brecha con los proveedores rusos."
 CHI_invite_basf_caojing: "Integración Verbund BASF"
 CHI_invite_basf_caojing_desc: "Aprobar la propuesta de BASF de construir un complejo químico integrado Verbund en el Parque de la Industria Química de Caojing y la zona costera de Zhanjiang. La inversión de 8700 millones de euros reúne la fabricación avanzada de polímeros y acrílicos con un modelo de integración de procesos que enlaza servicios, materias primas y flujos de subproductos entre dieciocho plantas químicas, el primer sitio Verbund fuera de Europa."
 CHI_invite_bayer_nanjing: "Centro de Ciencia de Materiales de Covestro"
 CHI_invite_bayer_nanjing_desc: "Invitar a Covestro, antes Bayer MaterialScience, a establecer una sede regional de investigación y producción en Shanghái. La instalación de 3000 millones de euros produce policarbonatos, precursores de poliuretano y recubrimientos avanzados, y traslada el centro mundial de I+D de la división desde Alemania, con la transferencia de experiencia en química de polímeros aplicable a materiales industriales y de alto rendimiento."
 CHI_invite_exxonmobil_jv: "Empresa conjunta de ExxonMobil en Quanzhou"
 CHI_invite_exxonmobil_jv_desc: "Aprobar la participación accionaria del 25 por ciento de ExxonMobil en la Fujian Refining and Petrochemical Company de Quanzhou, y establecer el primer complejo sino-extranjero totalmente integrado de refinería y petroquímica. ExxonMobil aporta tecnología avanzada de craqueo con vapor y de producción de poliolefinas junto con experiencia operativa en refinación integrada a gran escala."
 CHI_invite_JAP_hitachi: "Invitar a Hitachi"
 CHI_invite_JAP_hitachi_desc: "Las divisiones de electrónica industrial y de defensa de Hitachi producen sistemas de control ferroviario, equipos de generación de energía y hardware informático embebido de amplia aplicación dual en la infraestructura industrial y militar china."
 CHI_invite_JAP_honda: "Invitar a Honda Motor Company"
 CHI_invite_JAP_honda_desc: "Las divisiones de ingeniería de propulsión y robótica de Honda aportan tecnología de motores compactos y sistemas de automatización de fábricas aplicables tanto a la manufactura civil como a las líneas de producción afines a la defensa."
 CHI_invite_JAP_howa: "Invitar a Howa Machinery"
 CHI_invite_JAP_howa_desc: "Howa Machinery es el principal fabricante de los fusiles de asalto Tipo 89 y Tipo 20 de las Fuerzas de Autodefensa Terrestres de Japón. Sus procesos de mecanizado de precisión y su gestión de la línea de producción de armas ligeras ofrecen un valor directamente transferible."
 CHI_invite_JAP_ihi: "Invita a IHI Corporation"
 CHI_invite_JAP_ihi_desc: "IHI Corporation es el principal fabricante de motores aeronáuticos y sistemas de propulsión naval de Japón, y produce turbofanes para aeronaves militares y componentes de turbinas para buques de guerra bajo licencia de socios occidentales."
 CHI_invite_JAP_jmu: "Invitar a Japan Marine United"
 CHI_invite_JAP_jmu_desc: "Japan Marine United es el principal constructor de combatientes de superficie de la JMSDF, responsable de los destructores portahelicópteros clase Izumo y de los destructores de misiles guiados clase Atago. Sus métodos de arquitectura naval modular son directamente aplicables a los programas de construcción naval chinos."
 CHI_invite_JAP_jr_east: "Invitar a JR Este"
 CHI_invite_JAP_jr_east_desc: "JR East opera la red de alta velocidad más avanzada del mundo. Su ingeniería de material rodante, sus sistemas de señalización y su experiencia en mantenimiento de infraestructura aportan valor económico civil y modernización estratégica del transporte."
 CHI_invite_JAP_jsw: "Invitar a Japan Steel Works"
 CHI_invite_JAP_jsw_desc: "Japan Steel Works es el principal productor mundial de grandes forjados de acero de gran diámetro usados en recipientes a presión, cañones navales y componentes de reactores nucleares. Su experiencia metalúrgica mejoraría directamente la producción industrial pesada china."
 CHI_invite_JAP_kawasaki_aerospace: "Invitar a Kawasaki Heavy Industries (Aeroespacial)"
 CHI_invite_JAP_kawasaki_aerospace_desc: "La rama aeroespacial de Kawasaki produce el avión de transporte C-2 y el avión de patrulla marítima P-1, con gran competencia en construcción de grandes células e integración de sistemas de misión, relevante tanto en la aplicación comercial como en la de defensa."
 CHI_invite_JAP_kawasaki_shipbuilding: "Invitar a Kawasaki Heavy Industries (Astillero)"
 CHI_invite_JAP_kawasaki_shipbuilding_desc: "La división de astilleros de Kawasaki Heavy Industries es responsable de la construcción de los submarinos clase Soryu. Su experiencia en fabricación de cascos a presión submarinos y reducción de firma acústica representa una transferencia significativa de capacidad naval."
 CHI_invite_JAP_komatsu: "Invitar a Komatsu Defensa"
 CHI_invite_JAP_komatsu_desc: "Komatsu Defense fabrica vehículos blindados ligeros y artillería autopropulsada para las Fuerzas de Autodefensa Terrestres de Japón. Su enfoque de construcción modular y sus soluciones de blindaje ligero complementan los programas de vehículos chinos existentes."
 CHI_invite_JAP_mhi_tank: "Invitar a Mitsubishi Heavy Industries (Sistemas terrestres)"
 CHI_invite_JAP_mhi_tank_desc: "La división de sistemas terrestres de Mitsubishi Heavy Industries produce los tanques de batalla principales Tipo 10 y Tipo 90 y una gama de vehículos blindados. La cooperación transfiere metodología de diseño de blindados y técnicas avanzadas de blindaje compuesto."
 CHI_invite_JAP_mitsubishi_aerospace: "Invitar Mitsubishi Aerospace"
 CHI_invite_JAP_mitsubishi_aerospace_desc: "La división aeroespacial de Mitsubishi Heavy Industries es el principal desarrollador japonés de aeronaves militares avanzadas, incluida la plataforma F-2 y el naciente programa F-X. Su presencia en China aportaría experiencia en ingeniería de células y capacidad de manufactura de uso dual."
 CHI_invite_JAP_mitsubishi_shipbuilding: "Invitar a Mitsubishi Shipbuilding"
 CHI_invite_JAP_mitsubishi_shipbuilding_desc: "La rama naval de Mitsubishi construye cascos de destructores y recipientes a presión de submarinos para la Fuerza Marítima de Autodefensa de Japón, y ofrece técnicas de construcción naval y procesos de soldadura de precisión adecuados para programas de buques de guerra de alta gama."
 CHI_invite_JAP_nec: "Invita a NEC Corporation"
 CHI_invite_JAP_nec_desc: "NEC Corporation es un destacado desarrollador japonés de sistemas C4ISR, hardware de comunicaciones satelitales y plataformas de inteligencia de señales. Su experiencia en integración abarca tanto la electrónica de defensa como la infraestructura de redes civil."
 CHI_invite_JAP_nippon_steel: "Invitar a Nippon Steel"
 CHI_invite_JAP_nippon_steel_desc: "Nippon Steel es uno de los mayores productores mundiales de acero estructural de alta resistencia. Su producción de placas de blindaje de alta dureza y aleaciones especiales sirve tanto a la industria de defensa japonesa como al sector de infraestructuras en general."
 CHI_invite_JAP_panasonic: "Invitar Panasonic"
 CHI_invite_JAP_panasonic_desc: "Panasonic suministra tecnología avanzada de baterías, electrónica reforzada y componentes de imagen térmica a la cadena de suministro de defensa japonesa, con estándares de producción directamente aplicables a la integración en plataformas militares."
 CHI_invite_JAP_subaru: "Invitar a Subaru Aerospace"
 CHI_invite_JAP_subaru_desc: "La división aeroespacial de Subaru Corporation produce fuselages de helicópteros y componentes de estructura fija bajo licencia, con especial fuerza en metalurgia de precisión y diseño estructural rotativo."
 CHI_invite_JAP_toshiba: "Invitar a Toshiba Defense Systems"
 CHI_invite_JAP_toshiba_desc: "Toshiba Defense Systems produce arrays de radar, suites de guerra electrónica y hardware de orientación de misiles para las Fuerzas de Defensa Autónomo del Japón, aportando tecnología crítica de sensores e ingeniería de sistemas integrados a la asociación."
 CHI_invite_JAP_toyota: "Invitar a Toyota Motor Corporation"
 CHI_invite_JAP_toyota_desc: "Los sistemas de fabricación avanzados de Toyota y los principios logísticos justo a tiempo sustentan no sólo la producción comercial de vehículos, sino también los programas ligeros y logísticos de vehículos suministrados a las fuerzas armadas del Japón."
 CHI_invite_saudi_aramco: "Participación estratégica en refinerías de Saudi Aramco"
 CHI_invite_saudi_aramco_desc: "Ofrecer a Saudi Aramco participaciones accionarias en la Fujian Refining and Petrochemical Company y en el complejo petroquímico Hengli de Dalian. La participación del 25 por ciento de Aramco en Fujian y del 10 por ciento en Hengli integran una capacidad de refinación combinada de 400 000 barriles diarios con un suministro garantizado de crudo desde la península arábiga, y anclan el sector de refinación chino a una fuente de crudo saudí a largo plazo."
 CHI_invite_shell_chem: "Asociación química Shell de la Bahía de Daya"
 CHI_invite_shell_chem_desc: "Ampliar la empresa conjunta Shell-CNOOC en la Zona Petroquímica de la Bahía de Daya, en Guangdong. La sociedad al 50-50 de Shell con CNOOC opera un craqueador de etileno de 1,6 millones de toneladas anuales y produce polietileno, polipropileno, etilenglicol, poliéter polioles y estireno, y diversifica la producción química de China aguas abajo en toda la costa sur."
 CHI_jap_capitulate_to_demands: "Capitular ante las exigencias chinas"
 CHI_jap_capitulate_to_demands_desc: "Aceptar los términos de Pekín. El embargo se levanta, pero el costo político interno es real."
 CHI_jap_diversify_rare_earth: "Diversificar el suministro de tierras raras"
 CHI_jap_diversify_rare_earth_desc: "Un programa de choque de un año para escapar de la dependencia china de las tierras raras. Doloroso, pero deja sin efecto los futuros embargos."
 CHI_jap_open_back_channel: "Open Back-Channel habla"
 CHI_jap_open_back_channel_desc: "Use el canal trasero para bajar la temperatura en el teatro Senkaku."
 CHI_jap_reinforce_coast_guard: "Reforzar la Guardia Costera"
 CHI_jap_reinforce_coast_guard_desc: "Surge patrullas JCG en el Mar de China Oriental. Reduce las incursiones chinas pero alimenta el ciclo de escalada."
 CHI_japan_strategy: "Estrategia del Japón"
 CHI_japan_strategy_desc: "El menú completo de la rivalidad sino-japonesa: rara coacción terrestre, alineación RCEP, presión marítima Senkaku, diplomacia de back-channel y invitaciones industriales. Tanto Beijing como Tokio emiten decisiones desde aquí ya que la relación oscila entre la coacción y el alojamiento."
 CHI_kaesong_expansion: "Ampliar el complejo de Kaesong"
 CHI_kaesong_expansion_desc: "La Región Industrial de Kaesong, donde el capital del Sur empleaba mano de obra del Norte, fue clausurada en 2016 mientras los lazos intercoreanos colapsaban. Intermediar su reapertura como co-desarrollador facilita la tensión en la península y vincula a Corea con la inversión china."
 CHI_KPA_Officer_Exchange: "Programa de intercambio de oficiales del KPA"
 CHI_KPA_Officer_Exchange_desc: "Enviar oficiales del EPL a Pionyang para sesiones conjuntas de entrenamiento y planificación con sus homólogos del Ejército Popular de Corea. Cada ciclo profundiza la interoperabilidad militar y la influencia china sobre el mando norcoreano."
 CHI_kpop_media_ban: "Prohibición de los medios K-Pop"
 CHI_kpop_media_ban_desc: "Restringir la emisión y distribución de contenidos de entretenimiento coreano en China. La prohibición apunta a los productos culturales de la Ola Coreana como palanca frente a las decisiones de alineamiento de seguridad de Seúl."
 CHI_LATAM_emergency_aid: "Ayuda de emergencia a un socio de Latinoamérica"
 CHI_LATAM_emergency_aid_desc: "Enviar un paquete de ayuda discrecional a un socio del paraguas de seguridad latinoamericano. Aumenta su estabilidad y nuestra influencia."
 CHI_LATAM_intel_sharing_pact: "Pacto de intercambio de información"
 CHI_LATAM_intel_sharing_pact_desc: "Abrir un canal bilateral de intercambio de inteligencia con un gobierno socio. Otorga acceso militar recíproco y refuerza la asociación."
 CHI_LATAM_military_advisors: "Desplegando asesores militares"
 CHI_LATAM_military_advisors_desc: "Enviar cuadros de entrenamiento del EPL a un ejército socio. Transfiere experiencia del ejército y profundiza los lazos de defensa."
 CHI_LATAM_security_options: "Opciones de seguridad de América Latina"
 CHI_launch_payload: "Inicie una carga útil"
 CHI_launch_payload_desc: "Mantener una cadencia de lanzamientos constante desde Jiuquan, Xichang, Wenchang y Taiyuan. Cada lanzamiento exitoso construye la experiencia operativa que eleva las probabilidades de nuestras misiones insignia y es requisito previo para comprometerse con la Luna."
 CHI_lift_rare_earth_embargo: "Levantar el embargo de tierras raras"
 CHI_lift_rare_earth_embargo_desc: "Terminar la prohibición de exportar tierras raras. Tokio obtiene un respiro."
 CHI_lift_thaad_sanctions: "Elevación THAAD Sanciones"
 CHI_lift_thaad_sanctions_desc: "Levantar formalmente las sanciones económicas informales impuestas en respuesta al despliegue del THAAD. La decisión señala la disposición a normalizar las relaciones con Seúl."
 CHI_localise_licensed_system: "Localizar un sistema con licencia"
 CHI_localise_licensed_system_desc: "Aplicar ingeniería inversa e indigenizar un sistema construido hoy bajo licencia rusa, ya sea un motor, un radar o un buscador de misiles, y reducir las regalías que se pagan a Moscú y demostrar que la industria china puede valerse por sí sola."
 CHI_locate_jang_loyalists: "Localizar Jang Loyalists"
 CHI_locate_jang_loyalists_desc: "Identificar a los miembros supervivientes de la facción de Jang Song-thaek dispersos por las regiones fronterizas. La red depurada conserva el resentimiento hacia el círculo íntimo de Kim."
 CHI_mature_node_export_drive_decision: "Madura-Nodo Export Drive"
 CHI_mature_node_export_drive_decision_desc: "Subvenciona a los clientes SMIC y Hua Hong para inundar mercados globales de automoción, IoT y productos blancos con chips sub-28nm. Cada tranche apila la opinión comercial."
 CHI_megaprojects: "Megaproyectos nacionales"
 CHI_megaprojects_desc: "La tradición china de megaproyectos dirigidos por el Estado, de la presa de las Tres Gargantas a la mayor red de alta velocidad del mundo. Dedicar recursos nacionales a obras emblemáticas que remodelen los sistemas hídricos, eléctricos y de transporte del país."
 CHI_military_decisions_category: "Reestructuración militar"
 CHI_MSS_Pyongyang_Station: "Estación MSS Pyongyang"
 CHI_MSS_Pyongyang_Station_desc: "Ampliar la estación del Ministerio de Seguridad del Estado en Pionyang para aumentar la cobertura de inteligencia sobre la dirigencia norcoreana y la capacidad de alerta temprana ante la inestabilidad del régimen."
 CHI_MSS_Quiet_Removal_Operation: "Operación de eliminación silenciosa"
 CHI_MSS_Quiet_Removal_Operation_desc: "El Ministerio de Seguridad del Estado ha identificado una facción en línea dura en Pyongyang que obstruye la agenda de reforma. Una operación discreta puede eliminar el obstáculo y despejar el camino para una mayor liberalización."
 CHI_national_commitee_decisions_category: "Comité Nacional"
 CHI_national_commitee_decisions_category_desc: "\n£GFX_CHI_commission_1 \n\n\n\nEl Comité Central del Partido Comunista de China rige los asuntos del partido entre los Congresos Nacionales. Cada cinco años, un nuevo Congreso se reúne para elegir miembros del comité, nombrar secretarios y establecer la dirección política del partido."
 CHI_NKO_Rason_SEZ_Investment: "Rason SEZ inversión"
 CHI_NKO_Rason_SEZ_Investment_desc: "Comprometer fondos directos a la Zona Económica Especial de Rason. La inversión desbloquea el acceso al puerto y demuestra la viabilidad de la reforma económica norcoreana."
 CHI_norinco_innovation: "NORINCO: Innovación original"
 CHI_norinco_innovation_desc: "China North Industries Group es el mayor conglomerado de sistemas terrestres del país y suministra las armas ligeras y la artillería de toda la fuerza terrestre. Sacar a sus oficinas de diseño de la imitación cautelosa les permite perseguir sistemas de infantería y de cañón genuinamente nuevos."
 CHI_northern_theatre_command: "Comando del teatro norte"
 CHI_northern_theatre_command_desc: "Centrado en Shenyang, el Mando del Teatro Norte cubre la península de Corea y la frontera rusa. Hace hincapié en la planificación operativa y en la cohesión de sus pesadas formaciones de armas combinadas."
 CHI_olympic_athlete_village: "Villa de atletas y centro de medios"
 CHI_olympic_athlete_village_desc: "Construir la villa olímpica de atletas y el centro internacional de transmisión de medios en la parte norte del Parque Olímpico. Al terminar, los edificios se convertirán en uso residencial y comercial, y sumarán al parque de viviendas y oficinas de Pekín."
 CHI_olympic_environmental_program: "Para el Medio Ambiente"
 CHI_olympic_environmental_program_desc: "Acelerar el cambio de carbón a gas en la red de calefacción de Pekín, trasladar las instalaciones más contaminantes del Capital Steel Group y lanzar una campaña de forestación a gran escala en las montañas circundantes. El programa mejorará la calidad del aire hasta niveles olímpicos y demostrará el compromiso de China con el desarrollo sostenible."
 CHI_olympic_mission: "Prepararse para los Juegos Olímpicos de Pekín"
 CHI_olympic_mission_desc: "Nos hemos comprometido a acoger los Juegos Olímpicos de Beijing 2008. La comunidad internacional estará vigilando. Financiar los cuatro programas de preparación -locales, vivienda de atleta, transporte y medio ambiente- antes del plazo. El no cumplir con el tiempo avergonzará al gobierno y socavará la confianza pública."
 CHI_olympic_preparations: "Preparaciones olímpicas"
 CHI_olympic_preparations_tt: "Si logramos completar todos los enfoques de preparación olímpica, obtendremos:"
 CHI_olympic_transport_links: "Enlaces de transporte olímpico"
 CHI_olympic_transport_links_desc: "Extender las líneas de metro hasta el Parque Olímpico, abrir el Beijing Capital Airport Express y mejorar el corredor ferroviario Qinhuangdao-Shenyang para atender el aumento de tráfico de pasajeros y carga previsto durante y después de los Juegos."
 CHI_olympic_venue_construction: "Construcción de locales olímpicos"
 CHI_olympic_venue_construction_desc: "Financiar la construcción del Estadio Nacional, el Centro Acuático Nacional y el Velódromo Nacional en el distrito del Parque Olímpico. Estas sedes principales serán el legado permanente de los Juegos Olímpicos de Pekín 2008 y a la vez centros comerciales y deportivos de la capital."
 CHI_pacific_pla_training: "Entrenamiento de PLA"
 CHI_patrol_diaoyu_fishing_grounds: "Patrullar los caladeros de Diaoyu"
 CHI_patrol_diaoyu_fishing_grounds_desc: "Enviar cúteres de la PAF a aguas disputadas. La presión sube y Tokio se verá obligado a reaccionar."
 CHI_pla_joint_maritime_exercise: "Ejercicio marítimo conjunto del Pacífico"
 CHI_pla_joint_maritime_exercise_desc: "Realizar ejercicios marítimos conjuntos con nuestros socios BRI del Pacífico. Aumenta su experiencia naval y nuestra influencia en toda la región."
 CHI_pla_train_SOL: "Fuerzas de Seguridad de las Islas Salomón"
 CHI_pla_train_SOL_desc: "Enviar cuadros de entrenamiento del EPL para ayudar a las fuerzas de seguridad de las Islas Salomón. Transfiere experiencia del ejército y profundiza los lazos de defensa."
 CHI_poly_innovation: "Poly Technologies: innovación original"
 CHI_poly_innovation_desc: "Poly Technologies, la rama de exportación de armas del EPL, abarca todo el catálogo de material militar chino. Orientar su alcance comercial hacia el desarrollo genuino amplía el progreso en todo el sector de defensa."
 CHI_Press_NKO_on_Nuclear: "Presionar a Pionyang sobre la contención nuclear"
 CHI_Press_NKO_on_Nuclear_desc: "Aplicar presión diplomática directa sobre Corea del Norte para que congele las pruebas nucleares y limite los despliegues. El progreso es gradual, pero demuestra a Washington que Pekín es un socio serio en la no proliferación."
 CHI_pressure_iaea_access: "Presionar para obtener acceso del OIEA"
 CHI_pressure_iaea_access_desc: "Presionar a Pionyang para que admita inspectores del OIEA en el complejo de Yongbyon. La presión china tiene peso donde las exigencias occidentales solo endurecen la resistencia norcoreana."
 CHI_princeling_intelligence_report: "Informe de inteligencia de Princeling"
 CHI_princeling_intelligence_report_desc: "Consolidar los últimos informes de los activos de red dentro de la dirigencia norcoreana. Cada revisión afina nuestra imagen de las facciones, rivalidades y puntos de presión del régimen."
 CHI_pro_natalist_subsidies: "Subvenciones pro-natalistas"
 CHI_pro_natalist_subsidies_desc: "Los gobiernos locales de toda China empiezan a emitir transferencias directas de efectivo, subsidios para la compra de vivienda y licencias de maternidad y paternidad ampliadas para incentivar la natalidad. Provincias como Jilin y Sichuan piloto programas de decenas de miles de yuanes por hijo. Las comparaciones internacionales sugieren que un gasto fiscal sustancial rinde solo ganancias marginales de fertilidad, pero los subsidios reducen los costos de los hogares y apoyan el consumo interno a corto plazo."
 CHI_propose_unity_government: "Proponer un Gobierno de Unidad Coreana"
 CHI_propose_unity_government_desc: "Tabla una propuesta oficial china para un gobierno de unidad transitoria bajo reconocimiento mutuo. El gambito diplomático más audaz de la era, y el más arriesgado."
 CHI_push_rcep_signing: "Impulsar la firma de la RCEP"
 CHI_push_rcep_signing_desc: "La Alianza Económica Integral Regional, firmada en noviembre de 2020 y vigente desde enero de 2022, une a China, Japón, Corea del Sur, los estados de la ASEAN, Australia y Nueva Zelanda a la mayor área de libre comercio mundial. Asegurar la firma nos ancla en el centro del comercio asiático."
 CHI_railway_central_upgrade: "Mejora del corredor ferroviario central"
 CHI_railway_central_upgrade_desc: "Actualizar terminales e infraestructuras ferroviarias en China Central y el centro de Beijing, cubriendo Hubei, Henan y Pekín. Fortalecer este corredor reduce la congestión en las arterias de carga más densas de China y mejora el suministro de materiales industriales a zonas de fabricación interior."
 CHI_railway_east_upgrade: "Mejora del corredor ferroviario oriental"
 CHI_railway_east_upgrade_desc: "Actualizar terminales e infraestructuras ferroviarias en China oriental y central, conectando Jiangxi, Anhui y Sichuan a una red continua de carga y pasajeros. Las mejoras aumentan la capacidad de construcción regional y reducen el tiempo necesario para trasladar los insumos industriales desde puertos costeros."
 CHI_railway_improvement: "Modernización del ferrocarril nacional"
 CHI_railway_north_upgrade: "Mejora del corredor ferroviario norte"
 CHI_railway_north_upgrade_desc: "Terminales ferroviarios de actualización e infraestructura superficial a lo largo del corredor norte de China que une Hebei, Shanxi y las provincias circundantes. La mejora de la capacidad ferroviaria aumenta el rendimiento del suministro, reduce los costos logísticos y acelera la construcción en toda la región."
 CHI_railway_south_upgrade: "Mejora del corredor ferroviario sur"
 CHI_railway_south_upgrade_desc: "Actualización de las terminales ferroviarias e infraestructura en todo el sur de China y Yunnan, atando Guangdong, Hunan y las provincias fronterizas sudoccidentales a la red nacional. El programa permite un movimiento más rápido de productos manufacturados y productos agrícolas, apoyando al mismo tiempo la expansión industrial a lo largo del pasillo."
 CHI_railway_west_upgrade: "Actualización del corredor de ferrocarril occidental"
 CHI_railway_west_upgrade_desc: "Actualizar terminales e infraestructuras ferroviarias en todo el noroeste y sudoeste, conectando Shaanxi, Gansu, Chongqing y Xinjiang a la red nacional de carga. La inversión reduce los costos de transporte para parques industriales occidentales y abre provincias previamente aisladas a cadenas de suministro de manufacturas en gran escala."
 CHI_raise_retirement_age: "Elevar la edad de jubilación"
 CHI_raise_retirement_age_desc: "La edad legal de jubilación de China, fijada en 1978, está entre las más bajas del mundo: 60 años para los hombres, 55 para las mujeres de oficina y 50 para las obreras. Un aumento gradual alarga la vida laboral de dos a cinco años, mantiene más tiempo en la fuerza laboral a los trabajadores con experiencia y alivia la presión sobre el sistema de pensiones. La resistencia de los trabajadores que esperan jubilarse pronto y de los jóvenes que temen una menor contratación es considerable."
 CHI_rare_earth_chip_leverage_decision: "Controles de distancia entre la Tierra y el Raro"
 CHI_rare_earth_chip_leverage_decision_desc: "Alivio de los niveles del embargo de chips occidentales a las exportaciones chinas de tierras raras y gaslio. El éxito relaja los controles y promueve la autosuficiencia, la negativa endurece el embargo y quema al capital político gastado."
 CHI_rare_earth_embargo_decision: "Accionar la palanca de las tierras raras"
 CHI_rare_earth_embargo_decision_desc: "China refina cerca del noventa por ciento de los elementos de tierras raras del mundo, los imanes que llevan todos los misiles guiados y aviones furtivos. Cortar el acceso de un rival paraliza su producción de defensa durante meses, a costa de capital político y de reputación como proveedor poco fiable."
 CHI_rare_earth_supply_assurance: "Garantizar el suministro de tierras raras"
 CHI_rare_earth_supply_assurance_desc: "China refina la abrumadora mayoría de los elementos de tierras raras del mundo, insumos de los semiconductores, baterías y pantallas surcoreanos. Ofrecer a Seúl un suministro garantizado nos convierte en un socio confiable y debilita el control de Washington sobre su aliado."
 CHI_rcep_deepening: "RCEP Deepening"
 CHI_rcep_deepening_desc: "Proponer a los socios regionales una aplicación acelerada de los compromisos de la RCEP. Una integración económica más profunda con Asia-Pacífico consolida la posición de China como socio económico indispensable de la región."
 CHI_recall_paf_maritime_militia: "Retirar la milicia marítima de la PAF"
 CHI_recall_paf_maritime_militia_desc: "Retirar la presencia de las milicias permanentes y dejar que se enfríe la presión."
 CHI_rein_in_cliques: "Frenar a las camarillas"
 CHI_rein_in_cliques_desc: "Auditar periódicamente a las camarillas de contrabando y las redes de clientelismo antes de que crezcan fuera de control. Recuperar fondos malversados llena el tesoro y reafirma la confianza del Partido, aunque el cuerpo de oficiales resiente el escrutinio."
 CHI_replace_synopsys_cadence_decision: "Reemplazar a Synopsys y Cadence"
 CHI_replace_synopsys_cadence_decision_desc: "Tras la prohibición de exportación de mayo de 2025, empujar a todas las empresas nacionales de diseño sin fábrica hacia los flujos EDA de Empyrean, Primarius y Xpeedic para una cobertura de diseño completa."
 CHI_retry_chang_e_mission: "Relanzar la sonda Chang'e"
 CHI_retry_chang_e_mission_desc: "La sonda no pudo alcanzar o inspeccionar la Luna. Construir un reemplazo y enviarlo en su camino."
 CHI_retry_shenzhou_mission: "Volver a volar la misión Shenzhou"
 CHI_retry_shenzhou_mission_desc: "El último intento cayó corto. Revise los datos de vuelo, corrija la falla y apile otro Shenzhou para el lanzamiento."
 CHI_retry_tiangong_mission: "Reintentar el ensamblaje de Tiangong"
 CHI_retry_tiangong_mission_desc: "La inserción del docking o el módulo no fue planificada. Repite y pruebe el montaje de la estación otra vez."
 CHI_sac_innovation: "Shenyang Aircraft: innovación original"
 CHI_sac_innovation_desc: "Shenyang Aircraft Corporation construye los cazas pesados de la Fuerza Aérea y la Armada del EPL, de la serie J-11 al J-15 embarcado y el J-35. Reformarla afila la punta de lanza del combate aéreo chino."
 CHI_sco_anti_terror_crackdown: "Lanzamiento del ataque antiterrorista"
 CHI_sco_anti_terror_crackdown_desc: "Ordenar a los servicios de seguridad una represión generalizada de las redes terroristas bajo el marco de los Tres Males de la OCS. Eleva temporalmente nuestra postura antiterrorista a costa de la estabilidad interna."
 CHI_sco_apply_as_dialogue_partner: "Solicitar el estatus de socio de diálogo"
 CHI_sco_apply_as_dialogue_partner_desc: "Podemos solicitar formalmente la condición de Socio de Diálogo dentro de la Organización de Cooperación de Shanghai. Este es el primer paso hacia un compromiso más profundo con China y sus socios."
 CHI_sco_category: "La Organización de Cooperación de Shanghai"
 CHI_sco_category_desc: "\n£MAIN_desctext_sco \n\n\n\n§YLa Organización de Cooperación de Shanghai§! or §YSCO§! es una organización intergubernamental eurasiática centrada en la cooperación económica, política y de seguridad. §YLos Cinco de Shanghai§!, se ha convertido en un marco amplio por el cual §Y[CHI.GetFlag]China§! y §Y[SOV.GetFlag]Rusia§! Ampliar su influencia al tiempo que gestiona la estabilidad y la cooperación regionales.\n\nEn lugar de funcionar como una alianza tradicional, §YSCO§! crece a través de la integración gradual. §YDialogue§!Entonces §YObservadores§!, antes de eventualmente aplicar para completo §YMiembros§!.\n\nLa voluntad de los países de cooperar con §YSCO§! depende de varios factores:\n\n§YAgresión china§! refleja la asertividad §Y[CHI.GetFlag]China§! Los niveles inferiores hacen que la organización sea más atractiva, mientras que los niveles superiores desalientan la cooperación y pueden alejar a los miembros.\n\n§YSCO Cohesion§! Representa la estabilidad interna y la confianza entre los Estados participantes. La alta cohesión mejora la cooperación y la eficacia de los proyectos, mientras que la baja cohesión frena la integración y aumenta el riesgo de que los miembros se retiren.\n\n§YChina-Rusia Balance§! determina la estabilidad política interna de la organización. Una relación equilibrada garantiza una expansión suave, mientras que el dominio por cualquiera de las partes puede conducir a fricción, retrasos o reducción de la cooperación.\n\nA través de la articulación §YEconómico§!, §YSeguridad§! y §YProyectos estratégicos§!, el §YSCO§! permite a sus participantes expandir su influencia, fortalecer los lazos regionales y construir un bloque de poder alternativo en Eurasia.\n\nSi la agresión china supera los niveles §R5§! y §R10§!, §Y[JAP.GetNameWithFlag]§! adquirirá nuevas opciones para ampliar el artículo 9 de manera que sea contrario [CHI.GetFlag]§Y[CHI.GetAdjectiveCap]§! posiciones militares.\n\n$CHI_chinese_aggression_display$\n$CHI_sco_cohesion_display$\n$CHI_sco_balance_display$"
 CHI_sco_cohesion_decay: "Ajuste de la cohesión SCO"
 CHI_sco_cohesion_decay_desc: "Una recalibración anual oculta que empuja la cohesión de la OCS hacia su equilibrio natural de cinco, ajustado al alza en medio punto por cada megaproyecto activo. Si la cohesión está por encima del equilibrio, baja en uno; si está por debajo, sube en uno."
 CHI_sco_consider_leaving: "Reconsiderar la composición de SCO"
 CHI_sco_consider_leaving_desc: "Una decisión oculta gestionada por IA mediante la cual los Estados miembros y observadores evalúan si el deterioro de las relaciones con Pekín o el aumento de los problemas de cohesión de la OCS justifican rebajar su participación. Los Estados con alta exposición a la agresividad china o mala opinión de China sopesarán la salida con más seriedad."
 CHI_sco_upgrade_to_member: "Solicitar la plena membresía de la OCS"
 CHI_sco_upgrade_to_member_desc: "Como observador reconocido, ya podemos solicitar la plena membresía en la Organización de Cooperación de Shanghái."
 CHI_sco_upgrade_to_observer: "Solicitar el estatus de observador"
 CHI_sco_upgrade_to_observer_desc: "Tras establecernos como socio de diálogo, ya podemos buscar el estatus pleno de observador en la OCS, que da acceso a una cooperación económica y política más amplia."
 CHI_scs_assertive_patrol_MAY: "Patrulla asertiva: Spratly malasias"
 CHI_scs_assertive_patrol_MAY_desc: "Ordenar a una flotilla de la PLAN entrar en aguas disputadas con Malasia en el sur de las Spratly, cerca de los Bajos Luconia. Los lazos económicos de Kuala Lumpur con nosotros complican sus opciones de respuesta, pero aún se requiere una victoria decisiva para avanzar el contador de choques. Los enfrentamientos no concluyentes son comunes dada la postura cautelosa de Malasia; los reveses amenazan la relación de préstamos de infraestructura."
 CHI_scs_assertive_patrol_PHI: "Patrulla asertiva: Spratly filipinas"
 CHI_scs_assertive_patrol_PHI_desc: "Ordenar a una flotilla de la PLAN entrar en aguas disputadas con Filipinas, apuntando a las operaciones de reabastecimiento filipinas en el Arrecife Ayungin y las formaciones del este de las Spratly. Una victoria decisiva avanza el contador de choques de Filipinas; un resultado no concluyente lo mantiene; un revés cuesta $CHI_scs_framework$ y puede llevar a Manila a invocar las consultas del Tratado de Defensa Mutua con EE. UU."
 CHI_scs_assertive_patrol_VIE: "Patrulla asertiva: Spratly vietnamitas"
 CHI_scs_assertive_patrol_VIE_desc: "Ordenar a una flotilla de la PLAN entrar en aguas disputadas con Vietnam, para desafiar a los guardacostas y buques de reabastecimiento vietnamitas en la cadena occidental de las Spratly. La operación tiene tres resultados posibles: una victoria táctica decisiva avanza el contador de choques hacia el umbral del ultimátum; un enfrentamiento no concluyente mantiene estable el contador; un revés reduce $CHI_scs_framework$ y puede invitar a una respuesta diplomática de represalia de Hanói."
 CHI_scs_block_asean_consensus: "Bloqueo del consenso de la ASEAN"
 CHI_scs_block_asean_consensus_desc: "Utilizar la influencia china sobre Camboya y Laos para evitar que una reprensión a nivel de la ASEAN llegue al comunicado en la cumbre. Ambos estados mantienen posiciones de bloqueo dentro del mecanismo de consenso; su cooperación mantiene la declaración conjunta en silencio sobre la conducta del Mar de China Meridional. La maniobra eleva $CHI_chinese_aggression$ ligeramente cuando los observadores regionales observan el cinismo, pero ofrece una modesta ganancia a $CHI_scs_framework$ evitando un reprensión institucionalizada."
 CHI_scs_boundary_codification_MAY: "Tratado de delimitación marítima: Malasia"
 CHI_scs_boundary_codification_MAY_desc: "Concluir un tratado bilateral de delimitación marítima con Malasia, que formalice el arreglo de facto en las aguas disputadas del sur. La firma de Kuala Lumpur completa el anillo de codificaciones bilaterales y aísla cualquier desafío multilateral restante."
 CHI_scs_boundary_codification_PHI: "Tratado de delimitación marítima: Filipinas"
 CHI_scs_boundary_codification_PHI_desc: "Concluir un tratado bilateral de delimitación marítima con Filipinas, que sustituya el laudo arbitral de la CONVEMAR de 2016. Manila acepta dejar de lado la sentencia del tribunal a cambio de garantías de inversión china y mayor acceso a la zona de desarrollo conjunto."
 CHI_scs_boundary_codification_VIE: "Tratado de delimitación marítima: Vietnam"
 CHI_scs_boundary_codification_VIE_desc: "Concluir un tratado bilateral de delimitación marítima con Vietnam en términos favorables a China, que codifique las líneas acordadas en el Golfo de Tonkín y deje de lado las disputas de Paracelso y Spratly bajo un marco de desarrollo conjunto. Hanói acepta el arreglo como el mejor resultado posible; Pekín obtiene un precedente."
 CHI_scs_carrier_strike_group_deployment: "Despliegue de grupo de ataque de portaaviones"
 CHI_scs_carrier_strike_group_deployment_desc: "Desplegar un grupo de ataque de portaaviones completo en el Mar de China Meridional para una estación operativa prolongada. El despliegue señala que China posee y ejercerá la capacidad de controlar el mar con fuerza, no solo de disputarlo."
 CHI_scs_demand_tribute_MAY: "Exigir la cesión de Nansha"
 CHI_scs_demand_tribute_MAY_desc: "Emitir un ultimátum a Kuala Lumpur para que ceda formalmente las Spratly septentrionales, incluidas las formaciones ocupadas por Malasia en torno al Arrecife Swallow y Ardasier. La nota llega envuelta en el recuerdo de las patrullas de Zheng He en la era Ming desde Malaca, y replantea la exigencia como la reanudación de un viejo orden y no como una anexión nueva. De los tres reclamantes, Malasia es la que más probablemente se trague la pérdida en silencio."
 CHI_scs_demand_tribute_PHI: "Exigir la cesión de Zhongsha"
 CHI_scs_demand_tribute_PHI_desc: "Emitir un ultimátum a Manila para que ceda formalmente el Banco Macclesfield, la formación sumergida que China ya administra como el distrito Zhongsha de Sansha. La nota prescinde de la ficción de negociación bilateral y pone a prueba el Tratado de Defensa Mutua de 1951 sobre un banco sin guarnición ni pista de aterrizaje, el sondeo más limpio posible de si Washington sigue tratando los arrecifes como líneas rojas."
 CHI_scs_demand_tribute_VIE: "Exigir la cesión de Xisha"
 CHI_scs_demand_tribute_VIE_desc: "Emitir un ultimátum a Hanói para que ceda formalmente las Paracelso, territorio que mantenemos por la fuerza desde la batalla de 1974 que expulsó a la Armada de la República de Vietnam del Grupo Creciente. La nota viste la exigencia con el lenguaje de un derecho histórico anterior a la Indochina francesa, y la presenta como el cierre de un expediente inconcluso y no como una reclamación nueva. Hanói puede ratificar la pérdida por escrito o invitar a una segunda lección al modelo de 1979."
 CHI_scs_deploy_maritime_militia: "Despliegue la Milicia Marítima"
 CHI_scs_deploy_maritime_militia_desc: "Desplegar a una región marítima disputada buques de la flota pesquera que operan bajo la coordinación de la PLAN. La milicia da presencia persistente con una cobertura civil verosímil, y crea hechos sobre el agua más rápido de lo que puede responder la protesta diplomática."
 CHI_scs_first_island_chain_exercise: "Ejercicio de la Primera Cadena de Islas"
 CHI_scs_first_island_chain_exercise_desc: "Ejecutar un gran ejercicio de flota que abarque toda la Primera Cadena de Islas, del Mar Amarillo al Mar de China Meridional. El ejercicio demuestra las capacidades de antiacceso y negación de área contra cualquier potencia que intente intervenir dentro de la cadena."
 CHI_scs_infrastructure_loan_MAY: "Préstamo de infraestructura: Malasia"
 CHI_scs_infrastructure_loan_MAY_desc: "Extender la financiación de infraestructura de la Franja y la Ruta a Malasia, que cubra el Enlace Ferroviario de la Costa Este y la ampliación de puertos a lo largo del corredor del Estrecho de Malaca. El acuerdo consolida la posición de Malasia como el socio de la ASEAN más integrado económicamente con China."
 CHI_scs_infrastructure_loan_PHI: "Préstamo de infraestructura: Filipinas"
 CHI_scs_infrastructure_loan_PHI_desc: "Extender la financiación de infraestructura de la Franja y la Ruta a Filipinas, que cubra la construcción de puentes, el desarrollo ferroviario y un nuevo puerto de aguas profundas. La oferta llega mientras Manila sopesa los costos y beneficios de su alianza con Washington."
 CHI_scs_infrastructure_loan_VIE: "Préstamo de infraestructura: Vietnam"
 CHI_scs_infrastructure_loan_VIE_desc: "Extender la financiación de infraestructura de la Franja y la Ruta a Vietnam, que cubra mejoras portuarias, enlaces ferroviarios y desarrollo de zonas industriales. El préstamo profundiza la dependencia económica vietnamita del capital chino y eleva el costo de la confrontación diplomática para Hanói."
 CHI_scs_invoke_doc_2002: "Reafirmar la DOC de 2002"
 CHI_scs_invoke_doc_2002_desc: "Reafirmar públicamente la Declaración de 2002 sobre la Conducta de las Partes en el Mar de China Meridional como el marco que rige la gestión de la disputa. El gesto es en gran medida simbólico pero señala moderación a los socios de la ASEAN y da una base diplomática a las negociaciones bilaterales."
 CHI_scs_island_construction_civilian: "Construcción de infraestructuras civiles"
 CHI_scs_island_construction_civilian_desc: "Construir instalaciones portuarias, estaciones de monitoreo meteorológico y viviendas civiles permanentes en el complejo de islas. Los signos visibles de ocupación ordinaria, escuelas, clínicas y edificios administrativos, refuerzan el argumento político de que estas formaciones constituyen territorio chino habitado."
 CHI_scs_island_construction_radar: "Erigir arreglos de radar y SIGINT"
 CHI_scs_island_construction_radar_desc: "Construir instalaciones de recolección de inteligencia de señales y arreglos de radar sobre el horizonte en la isla artificial. Las instalaciones dan conciencia persistente del dominio marítimo en todo el Mar de China Meridional y rastrean en tiempo real los movimientos navales y aéreos extranjeros."
 CHI_scs_island_construction_runway: "Construir la pista de aterrizaje"
 CHI_scs_island_construction_runway_desc: "Tender una pista pavimentada de 3000 metros en el complejo de islas artificiales, capaz de manejar aviones de combate y aeronaves de patrulla marítima de largo alcance. El aeródromo convierte la instalación de un puesto de presencia en un centro de proyección de poder."
 CHI_scs_island_construction_sam_battery: "Instala la batería SAM"
 CHI_scs_island_construction_sam_battery_desc: "Desplegar baterías de misiles tierra-aire de largo alcance en el complejo de islas. Las instalaciones extienden la envolvente de defensa aérea de China muy adentro del Mar de China Meridional y complican cualquier operación de libertad de navegación o patrulla aérea extranjera."
 CHI_scs_joint_development_MAY: "Acuerdo de operación de los Bajos Luconia"
 CHI_scs_joint_development_MAY_desc: "Acercarse a Petronas con un acuerdo de operación conjunta que cubra los bloques ND6 y SK308 alrededor de los Bajos Luconia, donde guardacostas chinos ya vigilan a las plataformas malasias en South Luconia. La costumbre de Kuala Lumpur de compartimentar la disputa a puerta cerrada la hace la firma más fácil de obtener; un acuerdo concluido se convierte en la plantilla que Pekín agita ante Hanói y Manila."
 CHI_scs_joint_development_PHI: "Revivir el memorando de energía con Manila"
 CHI_scs_joint_development_PHI_desc: "Revivir el Memorando de Entendimiento archivado sobre Desarrollo de Petróleo y Gas, que empareja a CNOOC con PXP Energy sobre el Contrato de Servicio 72 en Reed Bank. Manila se embolsa una participación fija en los ingresos y una oleada de inversión aguas arriba a cambio de tratar el laudo arbitral de 2016 como políticamente latente. La vía bilateral entierra el caso filipino bajo el derecho contractual."
 CHI_scs_joint_development_VIE: "Pacto Conjunto de Operaciones del Banco de Vanguardia"
 CHI_scs_joint_development_VIE_desc: "Abrir conversaciones discretas con Hanói sobre una zona de desarrollo conjunto en el solapamiento del Banco Vanguard y las aguas sin resolver al este de la demarcación del Golfo de Tonkín de 2000. CNOOC y PetroVietnam repartirían los derechos de exploración y los ingresos bajo una fórmula «sin perjuicio de la soberanía», congelando la cuestión jurídica mientras fluye el gas. El canal bilateral mantiene a la ASEAN a distancia y quita a Hanói el incentivo de invocar la CONVEMAR."
 CHI_scs_natuna_press_claim: "Presionar la reclamación de los nueve puntos sobre Natuna"
 CHI_scs_natuna_press_claim_desc: "Emitir una nota formal en la que afirmamos que nuestros derechos históricos bajo la línea de nueve puntos se extienden a aguas que se superponen con la ZEE de Natuna de Indonesia. La reclamación está legalmente discutida, pues Indonesia no se considera reclamante del Mar de China Meridional, pero su afirmación extiende la frontera diplomática hacia el sur y crea un nuevo punto de presión sobre el mayor Estado de la ASEAN."
 CHI_scs_natuna_provocation: "Natuna Provocation"
 CHI_scs_natuna_provocation_desc: "Desplegar buques de la milicia marítima china en la Zona Económica Exclusiva de Natuna, de Indonesia, bajo la cobertura de faenas de pesca rutinarias. La incursión es negable pero visible; Yakarta responderá por la vía diplomática. La acción sondea el límite sur del alcance operativo chino y pone a prueba la determinación indonesia sin comprometer activos regulares de la PLAN."
 CHI_scs_reclaim_taiping: "Reclamar Taiping"
 CHI_scs_reclaim_taiping_desc: "Taiping Island (Estado 491) es la característica natural más grande de la cadena Spratly y permanece bajo la administración de la República de China en Taiwán. Con los tres estados Spratly asegurados, una operación directa para tomar Taiping representa el acto final de la consolidación del Mar de China Meridional, aparte de cualquier escenario más amplio de reunificación de Taiwán. La operación tiene un costo muy alto Poder político y requiere el compromiso completo del PLAN en el Mar Sur."
 CHI_scs_standoff_malaysia: "Standoff de conducta: Malasia"
 CHI_scs_standoff_malaysia_desc: "Ejecutar el Modelo Scarborough contra una formación en disputa reclamada por Malasia. Kuala Lumpur ha manejado históricamente con cuidado la relación con Pekín; este enfrentamiento pone a prueba si la dependencia económica frena una protesta diplomática formal."
 CHI_scs_standoff_philippines: "Standoff: Philippines"
 CHI_scs_standoff_philippines_desc: "Ejecutar el Modelo Scarborough contra una formación en disputa reclamada por Filipinas. Un encuentro con un barco pesquero filipino se escala mediante un enfrentamiento de guardacostas hasta que Manila se retira, y deja una presencia china permanente."
 CHI_scs_standoff_vietnam: "Standoff de conducta: Vietnam"
 CHI_scs_standoff_vietnam_desc: "Ejecutar el Modelo Scarborough contra una formación en disputa reclamada por Vietnam. Los guardacostas de Hanói están superados en medios y en número; la cuestión es si Hanói acepta la pérdida en silencio o escala de un modo que atraiga la atención internacional."
 CHI_scs_summon_dragon_king_blessing: "Bendición de la flota del Rey Dragón"
 CHI_scs_summon_dragon_king_blessing_desc: "Realizar una bendición ceremonial de la Flota del Mar del Sur en el templo Tianhou de Sanya, Hainan, invocando la protección de Mazu, la diosa del mar, venerada por generaciones de marineros del Mar del Sur. La ceremonia se transmite a todo el país; la Flota del Mar del Sur parte a ejercicios justo después."
 CHI_secure_kpa_general_staff: "Asegurar contactos en el Estado Mayor del KPA"
 CHI_secure_kpa_general_staff_desc: "Cultivar a oficiales alineados con China en el Estado Mayor del KPA. Un general en activo en la red vale una docena de políticos en el exilio."
 CHI_seek_basing_BAN: "Solicitar bases navales en Bangladés"
 CHI_seek_basing_BAN_desc: "Acercarse a Daca con una solicitud formal de acceso logístico a las instalaciones portuarias de Chittagong, presentada como una asociación estratégica."
 CHI_seek_basing_BRM: "Solicitar bases navales en Myanmar"
 CHI_seek_basing_BRM_desc: "Acercarse a Naipyidó con una solicitud formal de acceso logístico a Kyaukpyu y Sittwe, presentada como una asociación estratégica."
 CHI_seek_basing_CBD: "Solicitar bases navales en Camboya"
 CHI_seek_basing_CBD_desc: "Acercarse a Nom Pen con una solicitud formal de acceso logístico a la Base Naval de Ream, presentada como una asociación estratégica."
 CHI_seek_basing_PAK: "Ampliar los derechos de basing en Pakistán"
 CHI_seek_basing_PAK_desc: "Aprovechar la asociación de los Hermanos de Hierro para ampliar la logística naval china por los puertos paquistaníes más allá de Gwadar."
 CHI_seek_basing_SRI: "Solicitar bases navales en Sri Lanka"
 CHI_seek_basing_SRI_desc: "Acercarse a Colombo con una solicitud formal de acceso logístico a Hambantota, presentada como una asociación estratégica."
 CHI_semiconductor_coop_with_kor: "Cooperación en semiconductores con Corea"
 CHI_semiconductor_coop_with_kor_desc: "Establecer una iniciativa conjunta de investigación y fabricación de semiconductores con Corea del Sur. El acceso a la experiencia coreana en fabricación de chips acelera el desarrollo tecnológico chino."
 CHI_seoul_hanbok_exchange: "Organizar un intercambio de hanbok en Seúl"
 CHI_seoul_hanbok_exchange_desc: "La diplomacia cultural puede aliviar tensiones incluso en disputas sobre el patrimonio compartido. Patrocinar un intercambio de hanbok en Seúl calienta el sentir público y abre un cauce de influencia más suave hacia Corea del Sur."
 CHI_shenzhou_mission: "Volar la misión Shenzhou"
 CHI_shenzhou_mission_desc: "Una nave Shenzhou se apila sobre un Larga Marcha 2F en el Centro de Lanzamiento de Satélites de Jiuquan. La tripulación debe alcanzar la órbita y regresar sana y salva para confirmar nuestra capacidad independiente de vuelo espacial tripulado. Las probabilidades de éxito mejoran a medida que crece nuestra experiencia de lanzamiento."
 CHI_sichuan_tibet_railway: "Ferrocarril Sichuan-Tibet"
 CHI_sichuan_tibet_railway_desc: "Trazar un ferrocarril por las gargantas y los altos pasos entre Chengdu y Lhasa, con más del 80 por ciento de su longitud en túneles y puentes. El enlace pone fin al aislamiento del Tíbet, aprieta el control central sobre la meseta y da una arteria estratégica hacia la frontera india."
 CHI_skilled_immigration_drive: "Conducta de inmigración hábil"
 CHI_skilled_immigration_drive_desc: "El sistema de residencia permanente de China ha sido históricamente de los más restrictivos de cualquier gran economía. Una nueva vía de visado para personal altamente cualificado, inspirada en las vías de tarjeta verde de Estados Unidos y Canadá, apunta a investigadores, ingenieros y emprendedores. El programa es modesto según los estándares mundiales, pero marca un cambio de política significativo, al reconocer que la oferta demográfica interna por sí sola no puede cubrir los huecos emergentes en los sectores tecnológico y sanitario."
 CHI_snwt_central_route: "Trasvase Sur-Norte de agua: Ruta Central"
 CHI_snwt_central_route_desc: "Canalizar agua del embalse de Danjiangkou, en el río Han, en Hubei, hacia el norte a través de Henan y Hebei hasta Pekín. En funcionamiento desde diciembre de 2014, la Ruta Central abastece de agua potable a la capital y alivia el agotamiento crónico de los acuíferos de la Llanura del Norte de China."
 CHI_snwt_eastern_route: "Trasvase Sur-Norte de agua: Ruta Oriental"
 CHI_snwt_eastern_route_desc: "Bombear agua al norte desde el bajo Yangtsé, cerca de Jiangsu, siguiendo el curso del antiguo Gran Canal hasta las áridas ciudades de Shandong y Tianjin. La Ruta Oriental es la primera de tres líneas de derivación que juntas llevan unos 44 800 millones de metros cúbicos de agua al año al norte árido."
 CHI_snwt_western_route: "Trasvase Sur-Norte de agua: Ruta Occidental"
 CHI_snwt_western_route_desc: "Desviar las cabeceras del Yangtsé a través de los montes Bayan Har, en la meseta Qinghai-Tíbet, hacia el alto Río Amarillo, y regar Qinghai, Gansu y Shaanxi. La más difícil técnicamente de las tres rutas, aseguraría agua para todo el noroeste árido."
 CHI_south_china_sea_category: "Mar del Sur de China"
 CHI_south_china_sea_category_desc: "Decisiones en curso que dan forma a nuestra postura en el Mar de China Meridional. Las acciones aquí afectan a la variable del Marco del Mar de China Meridional, a nuestras relaciones con Vietnam, Filipinas y Malasia y al riesgo de confrontación con Estados Unidos."
 CHI_southern_theatre_command: "Comando del teatro sur"
 CHI_southern_theatre_command_desc: "Con sede en Cantón, el Mando del Teatro Sur supervisa el Mar de China Meridional y la frontera vietnamita. Se especializa en la coordinación conjunta entre guarniciones insulares dispersas y en el reconocimiento que las une."
 CHI_space_program: "Programa Espacial de China"
 CHI_subcontinent_strategy: "Estrategia Subcontinente"
 CHI_subcontinent_strategy_desc: "Nuestro conjunto de herramientas diplomáticas y militares para el subcontinente indio: presión a lo largo de la Línea de Control Real, asociaciones con Pakistán y la periferia sudasiática y la disputada frontera del Himalaya. Las decisiones emitidas desde aquí dan forma a la escalada a lo largo de la frontera y a nuestra influencia en la región.\n\n$raj_chi_border_readiness$: [?THIS.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$: [?global.raj_chi_border_tension|Y0]\n\n§YProgreso de reclamación§! (80 requeridos para presionar una reclamación):\nArunachal Pradesh: [?THIS.raj_chi_border_progress_475|Y0]\nSikkim: [?THIS.raj_chi_border_progress_982|Y0]\nAksai Chin: [?THIS.raj_chi_border_progress_591|Y0]\nLadakh: [?THIS.raj_chi_border_progress_993|Y0]"
 CHI_Surveillance_Export: "Exportar Arquitectura de Vigilancia"
 CHI_Surveillance_Export_desc: "Desplegar sistemas chinos de vigilancia y monitoreo digital en un socio no democrático. Cuesta 80 tanto del fondo BRI como del tesoro nacional."
 CHI_thaad_retaliation_escalate: "Retaliación de THAAD escalada"
 CHI_thaad_retaliation_escalate_desc: "Cuando Seúl aceptó acoger el sistema estadounidense de defensa de misiles THAAD en 2016, Beijing respondió con un boicot informal que batió a Lotte, el turismo coreano y las exportaciones culturales. El endurecimiento de la presión profundiza el castigo económico sobre Corea del Sur."
 CHI_three_gorges_dam_decision: "Completar la presa de las Tres Gargantas"
 CHI_three_gorges_dam_decision_desc: "Atravesando el Yangtze en Yichang, la presa Tres Gorges se convirtió en la central eléctrica más grande del mundo al encargarse por completo en 2012, con una capacidad instalada de 22.5 gigavatios. Completarlo entrega un gran bloque de generación hidroeléctrica a la red nacional."
 CHI_three_north_shelterbelt: "3-North Shelterbelt Program"
 CHI_three_north_shelterbelt_desc: "Plantar la «Gran Muralla Verde», un cinturón de bosque y pradera que se extiende por el árido norte desde Xinjiang hasta el noreste. Lanzado en 1978 y en marcha desde hace décadas, el programa contiene el avance del Gobi, ancla el suelo contra las tormentas de polvo y recupera tierras de cultivo del desierto."
 CHI_tiangong_mission: "Ensamblar la estación Tiangong"
 CHI_tiangong_mission_desc: "El módulo central de Tianhe debe llegar a la órbita y dock con éxito con su primera visita tripulada antes de que sigan las cabinas de laboratorio Wentian y Mengtian. Un puesto orbital permanente es la base para todo más allá de la órbita terrestre baja. Las probabilidades de éxito mejoran a medida que crece nuestra experiencia de lanzamiento."
 CHI_tour_group_freeze: "Congelación del grupo de turismo"
 CHI_tour_group_freeze_desc: "Suspend organizó grupos turísticos a Corea del Sur. La congelación elimina una fuente importante de ingresos del turismo surcoreano y señala nuestra disposición a utilizar las herramientas económicas coercitivamente cuando nuestros intereses de seguridad lo exigen."
 CHI_track_ii_academic_forum: "Pista II foro académico"
 CHI_track_ii_academic_forum_desc: "Patrocinar un diálogo de la Pista II entre nuestros académicos y sus homólogos surcoreanos en estabilidad peninsular. Los canales informales construyen confianza donde la diplomacia oficial se detiene."
 CHI_Track_II_Diplomacy: "Título II Diplomacia"
 CHI_Track_II_Diplomacy_desc: "Financiar intercambios académicos y de laboratorios de ideas informales entre nuestros especialistas, sus homólogos estadounidenses y académicos coreanos. Cada ronda construye comprensión mutua y prepara el terreno para negociaciones formales."
 CHI_trilateral_trade_forum: "Foro de comercio trilateral"
 CHI_trilateral_trade_forum_desc: "Convocar un foro comercial Pekín-Seúl-Pionyang centrado en el modelo de Kaesong. La interdependencia comercial crea su propia base a favor de la paz."
 CHI_uhv_east_transmission: "Grid ultra-alta tensión: Transmisión Oriental"
 CHI_uhv_east_transmission_desc: "Completar las líneas de ultra alto voltaje de larga distancia que llevan electricidad miles de kilómetros desde las bases occidentales a los centros de carga de Shanghái, Pekín y Cantón. La transmisión de larga distancia reduce las pérdidas de línea y alimenta el corazón industrial costero con energía limpia del oeste."
 CHI_uhv_west_generation: "Grid ultra-alta tensión: Base de generación occidental"
 CHI_uhv_west_generation_desc: "Desarrollar las grandes bases generadoras del oeste: los campos eólicos y solares de Xinjiang, las renovables de Mongolia Interior y la hidroeléctrica del alto Yangtsé. Estos centros energéticos remotos anclan la mayor red de transmisión de ultra alto voltaje del mundo."
 CHI_urban_water_recycling: "Reciclaje de aguas residuales urbanas"
 CHI_urban_water_recycling_desc: "Pekín, Tianjin y las principales ciudades de la provincia de Hebei vierten en conjunto miles de millones de metros cúbicos de aguas residuales municipales al año, la mayoría tratadas solo a nivel secundario antes de su liberación. Un programa de plantas avanzadas de tratamiento terciario y redes dedicadas de distribución de agua regenerada desvía el efluente tratado a la refrigeración industrial, la jardinería municipal y el aumento de caudal de los cauces fluviales. Tianjin ha alcanzado tasas de reutilización de agua regenerada superiores al 30 por ciento; el programa fija una meta nacional del 25 por ciento de reutilización urbana para 2030."
 CHI_us_korea_cost_signaling: "Firma de costos de EE.UU.-Korea"
 CHI_us_korea_cost_signaling_desc: "Señalar a Washington y Seúl que su alianza de seguridad conlleva crecientes costos económicos y diplomáticos. Las medidas de presión selectivas recuerdan a ambas partes que el statu quo no es gratuito."
 CHI_VEN_currency_swap_line: "Yuan-Bolivar Moneda Swap Line"
 CHI_VEN_currency_swap_line_desc: "Establecer una línea de swap de divisas a largo plazo para proteger a Venezuela de la presión de la deuda en dólares y asegurar el suministro de materias primas."
 CHI_VEN_emergency_food_aid: "Ayuda alimentaria de emergencia a Venezuela"
 CHI_VEN_emergency_food_aid_desc: "Enviar cargamentos de alimentos y ayuda humanitaria para estabilizar al gobierno de Maduro. Mejora la estabilidad venezolana y nuestra influencia."
 CHI_VEN_oil_processing_aid: "Ayuda para el procesamiento del petróleo venezolano"
 CHI_VEN_oil_processing_aid_desc: "Enviar a nuestros ingenieros y capital de refinación a mejorar el procesamiento de petróleo venezolano. El trabajo aumenta su rendimiento de extracción y profundiza nuestra participación en la cadena de suministro del Orinoco."
 CHI_VEN_petrocaribe_program: "Programa de apoyo a Venezuela"
 CHI_water_conservation_project: "Proyecto de conservación provincial"
 CHI_water_conservation_project_desc: "Se lanza un proyecto selectivo de conservación del agua en una de las provincias secas del norte, que mejora el revestimiento de canales, rehabilita las redes de monitoreo de aguas subterráneas y construye embalses de almacenamiento locales para reducir el desperdicio y la sobreextracción. Cada proyecto completado reduce la presión sobre el nivel freático provincial. La iniciativa puede repetirse en las provincias con estrés hídrico de Hebei, Shanxi, Henan y Shaanxi, y un número suficiente de proyectos completados aliviará la escasez nacional de agua de China."
 CHI_water_shortage_category: "Proyectos de conservación del agua"
 CHI_western_theatre_command: "West Theatre Command"
 CHI_western_theatre_command_desc: "El más grande por área, el Comando de Teatro Occidental en Chengdu protege la frontera Himalaya con India y el interior remanente. Sus tropas se entrenan para la defensa de alta altitud y la guerra de posiciones."
 CHI_yangtze_delta_integration_mission: "Integración del Delta de Yangtze"
 CHI_yangtze_delta_integration_mission_desc: "Con Shanghai, Jiangsu y Zhejiang comprometidos con el desarrollo coordinado, el Delta del Río Yangtze se posiciona para convertirse en el corredor industrial y exportador más productivo de China. Las provincias que levanten su producción de fábrica por encima del umbral fijado en el año generarán un crecimiento duradero de la productividad regional."
 give_up_membership_status_desc: "Abandonar la Organización de Cooperación de Shanghái pone fin a la participación en sus ejercicios de seguridad conjuntos, corredores económicos y marcos de consulta política. Los miembros con fuertes lecturas de agresión china o con guerras activas contra otros miembros afrontan una presión creciente para salir del bloque."
 give_up_observer_status_desc: "Retirada de la condición de observador se relaciona con los programas económicos y de seguridad de la Organización de Cooperación de Shanghai. La decisión suele estar impulsada por cambios de alineación hacia la OTAN o Occidente, o por el deterioro de las relaciones con Beijing."
 host_joint_exercises_desc: "China o Rusia pueden convocar un ejercicio militar conjunto completo de la OCS, y gastar cuarenta de poder de mando para dar una idea temporal de preparación para el combate a todos los Estados miembros durante veintiún días. Un líder de ejército aleatorio gana un nivel de habilidad al concluir. El ejercicio no puede lanzarse mientras algún miembro esté en guerra."
 offer_joint_exercises_specific_desc: "Una propuesta de ejercicio bilateral enviada a un miembro concreto de la OCS. Si se acepta, ambas partes gastan veinte de poder de mando para realizar un ejercicio conjunto de catorce días que otorga la idea específica de ejercicio conjunto de la OCS y termina con un modificador de opinión de cooperación militar mutua."
 provide_development_assistance_desc: "Canalizar recursos hacia [FROM.GetName] para reforzar su desarrollo y profundizar sus lazos con el marco de la OCS."
 sco_bilateral_border_patrol: "Patrulla fronteriza conjunta con [FROM.GetName]"
 sco_bilateral_border_patrol_desc: "Coordinar operaciones de seguridad fronteriza con [FROM.GetName] para combatir el crimen transfronterizo y reforzar la confianza mutua."
 sco_bilateral_cultural_exchange: "Intercambio cultural con [FROM.GetName]"
 sco_bilateral_cultural_exchange_desc: "Lanzar un programa de intercambio cultural y académico con [FROM.GetName], que fomente los lazos entre pueblos y el entendimiento mutuo."
 sco_bilateral_energy_deal: "Asociación energética con [FROM.GetName]"
 sco_bilateral_energy_deal_desc: "Negociar un acuerdo de suministro energético a largo plazo con [FROM.GetName], que estabilice los precios y asegure los flujos de recursos estratégicos."
 sco_bilateral_intel_sharing: "Compartiendo inteligencia con [FROM.GetName]"
 sco_bilateral_intel_sharing_desc: "Establecer un canal seguro de intercambio de inteligencia con [FROM.GetName] para coordinar las operaciones antiterroristas y de seguridad."
 sco_bilateral_trade_agreement: "Acuerdo comercial bilateral con [FROM.GetName]"
 sco_bilateral_trade_agreement_desc: "Establecer un marco comercial formal con [FROM.GetName] bajo el paraguas de la OCS, que reduzca aranceles y fomente la inversión conjunta."
 sco_megaproject_air_defense_optin: "Unirse a la defensa aérea conjunta de la OCS"
 sco_megaproject_air_defense_optin_desc: "Sumarse a la red de defensa aérea conjunta de la OCS, contribuyendo a la infraestructura compartida de radar y defensa antimisil."
 sco_megaproject_air_defense_propose: "Proponer la defensa aérea conjunta de la OCS"
 sco_megaproject_air_defense_propose_desc: "Proponer una red integrada de defensa aérea entre los Estados miembros de la OCS, que comparta la cobertura de radar y coordine las operaciones antiaéreas."
 sco_megaproject_dev_bank_optin: "Unirse al Banco de Desarrollo de la OCS"
 sco_megaproject_dev_bank_optin_desc: "Unirse al Banco de Desarrollo de la OCS como miembro contribuyente, con acceso a financiación de desarrollo de bajo interés."
 sco_megaproject_dev_bank_propose: "Proponer el Banco de Desarrollo de la OCS"
 sco_megaproject_dev_bank_propose_desc: "Proponer la creación de un banco multilateral de desarrollo para financiar infraestructura y desarrollo en los Estados miembros de la OCS."
 sco_megaproject_energy_grid_optin: "Unirse a la red energética de la OCS"
 sco_megaproject_energy_grid_optin_desc: "Sumarse al proyecto de red energética de la OCS, aportando recursos a cambio de acceso a la infraestructura eléctrica compartida."
 sco_megaproject_energy_grid_propose: "Proponer la red energética de la OCS"
 sco_megaproject_energy_grid_propose_desc: "Proponer la construcción de una red energética integrada que abarque los Estados miembros de la OCS, y reduzca costos y mejore la seguridad energética de todos los participantes."
 sco_megaproject_railway_optin: "Unirse al Ferrocarril Transeuroasiático"
 sco_megaproject_railway_optin_desc: "Sumarse al proyecto del Ferrocarril Transeuroasiático, invirtiendo en el corredor comercial para obtener beneficios económicos a largo plazo."
 sco_megaproject_railway_propose: "Proponer Trans-Eurasian Railway"
 sco_megaproject_railway_propose_desc: "Proponer una red ferroviaria transcontinental que conecte las economías miembros de la OCS y mejore drásticamente los flujos comerciales y la capacidad de construcción."
 start_joint_exercises_specific_desc: "Finaliza un ejercicio bilateral de la OCS con un miembro que ha aceptado la oferta. Ambas naciones reciben la idea específica de ejercicio conjunto de la OCS durante catorce días, y el ejercicio concluye con una ganancia de opinión de cooperación militar mutua."
 chi_bri.1.a: "Comenzar el trabajo"
 chi_bri.1.d: "En septiembre de 2013, el Presidente Xi Jinping se presentó ante una audiencia en Astana (Kazajstán) y planteó una visión audaz: un cinturón económico de Silk Road que vincula a China con Europa, Asia Central y África. La iniciativa sería conocida como el Franja y la Ruta, el programa de infraestructura más grande de la historia."
 chi_bri.1.t: "Un cinturón, una carretera"
 chi_bri.10.a: "Ofrecer condiciones concesionarias"
 chi_bri.10.d: "Una solicitud formal ha llegado desde [FROM.GetName]. Su delegación busca financiación y experiencia en China para el §Y[FROM.GetBRIProjectName]§!. Beijing debe pesar el valor estratégico de la asociación contra los términos financieros y políticos que está dispuesta a ofrecer."
 chi_bri.10.d_opt: "Decline la aplicación"
 chi_bri.10.t: "[FROM.GetName] Pide un proyecto Franja y la Ruta"
 chi_bri.103.a: "Aceptar la invitación"
 chi_bri.103.b: "Decline la oferta"
 chi_bri.103.d: "Beijing ha cursado una invitación oficial para convertirse en miembro fundador del Banco Asiático de Inversiones de Infraestructura. La membresía viene con los pagos anuales de dividendos de proyectos de infraestructura en toda la red BRI, aunque vincula nuestras fortunas financieras con iniciativas dirigidas por China. El ministerio económico espera nuestra decisión."
 chi_bri.103.t: "China nos invita a unirse al AIIB"
 chi_bri.104.a: "Bienvenido al nuevo miembro"
 chi_bri.104.d: "[From.GetName] ha aceptado nuestra invitación a unirse al Banco Asiático de Inversión en Infraestructura como miembro fundador. Su participación fortalece la legitimidad del banco y amplía su alcance."
 chi_bri.104.t: "[From.GetName] Se une a la AIIB"
 chi_bri.105.a: "Tenga en cuenta su posición"
 chi_bri.105.d: "[From.GetName] ha rechazado nuestra invitación a unirse al Banco Asiático de Inversión en Infraestructura. Su negativa indica una clara preferencia por las instituciones financieras dirigidas por Occidente y complica nuestras ambiciones regionales."
 chi_bri.105.t: "[From.GetName] Rechaza la membresía AIIB"
 chi_bri.13.a: "Conceder un período de gracia de un año"
 chi_bri.13.b: "Rechazar la extensión"
 chi_bri.13.d: "[FROM.GetName] ha pedido a Beijing una pausa de un año en pagos por sus obligaciones pendientes Franja y la Ruta, citando restricciones fiscales y circunstancias imprevistas. El director permanecerá adeudado después del período de gracia."
 chi_bri.13.t: "Solicitud de extensión del préstamo"
 chi_bri.131.a: "Derechos de concesión de subvenciones para el apoyo económico"
 chi_bri.131.b: "Rechazar la solicitud"
 chi_bri.131.d: "Beijing nos ha abordado con una propuesta: otorgar a la Armada del Ejército Popular de Liberación privilegios de atracar y refugiar en nuestros puertos a cambio de una asistencia económica sustancial. El paquete aumentaría nuestras exportaciones y producción industrial para el próximo decenio, pero aceptaría un escrutinio australiano y americano."
 chi_bri.131.t: "China pide derechos de autor"
 chi_bri.132.a: "Reevaluar nuestra postura del Pacífico"
 chi_bri.132.d: "[From.GetName] ha revocado unilateralmente los privilegios de docking otorgados anteriormente a la Armada del PLA. Las relaciones de enfriamiento y los incentivos occidentales competidores han erosionado el acuerdo que hemos trabajado tan duro para asegurar."
 chi_bri.132.t: "Derechos de bastión revocado"
 chi_bri.133.a: "Aceptar el pacto negociado"
 chi_bri.133.b: "Declarar el acuerdo"
 chi_bri.133.d: "Beijing se propone como garante de un entendimiento de no agresión entre nosotros y nuestro rival regional. En caso de romper la paz, China se compromete a unirse con la parte agraviada. La oferta tiene peso dado el creciente clout diplomático de Beijing."
 chi_bri.133.t: "China ofrece un pacto de no agresión"
 chi_bri.134.a: "Honra el pacto y declara la guerra"
 chi_bri.134.b: "Mantener neutral y aceptar el costo de la reputación"
 chi_bri.134.d: "La guerra ha estallado entre dos partidos cuyo pacto de no agresión garantizamos personalmente. Honor y credibilidad exigen que declaremos por la víctima, pero la guerra con el agresor sería costosa. La inacción será recordada."
 chi_bri.134.t: "Nuestro pacto roto ha sido roto"
 chi_bri.135.a: "Coordinar con nuestros socios chinos"
 chi_bri.135.d: "Beijing nos ha notificado que, de acuerdo con el entendimiento de no agresión que ha corregido, la República Popular entrará en la guerra de nuestro lado. El peso diplomático de la intervención china reforma el panorama estratégico."
 chi_bri.135.t: "China honrará el Pacto"
 chi_bri.15.a: "Puerto de Gwadar (Balochistán)"
 chi_bri.15.b: "Zona Económica Especial de Baluchistán"
 chi_bri.15.c: "Corredor ferroviario de Lahore (Punjab)"
 chi_bri.15.d: "Beijing ha aprobado un megaproyecto emblemático para [FROM.GetName]. A diferencia de las obras ordinarias Franja y la Ruta, esta empresa será gestionada por China y llevará directamente los intereses estratégicos chinos. La elección de la ubicación definirá el propósito del proyecto durante décadas venideras."
 chi_bri.15.d_opt: "Puerto de Hambantota (provincia Sur)"
 chi_bri.15.e: "Colombo Port City (provincia occidental)"
 chi_bri.15.f: "Terminal de Mombasa-Nairobi SGR"
 chi_bri.15.g: "Instalación estratégica costera"
 chi_bri.15.t: "Mega-Proyecto: ¿Dónde construir?"
 chi_bri.20.a: "Aceptar los términos de arrendamiento"
 chi_bri.20.b: "Rehuse a entregar el puerto"
 chi_bri.20.d: "Incapaz de atender las deudas acumuladas durante la construcción, el gobierno de Sri Lanka se enfrenta a una elección inestable. China Merchants Port Holdings ha propuesto un arrendamiento de 99 años en el puerto de Hambantota a cambio del alivio de la deuda. Los críticos lo llaman diplomacia de la trampa de la deuda; los proponentes lo llaman maestría pragmática."
 chi_bri.20.t: "Hambantota: El plomo de 99 años"
 chi_bri.21.a: "Acceso naval de China"
 chi_bri.21.b: "Rechazo político"
 chi_bri.21.d: "Con el Corredor Económico China-Pakistán plenamente operativo, la Armada del PLA se ha acercado a Islamabad con una petición silenciosa pero significativa: el derecho a utilizar Gwadar como punto logístico y de reaprovisionamiento. La decisión transformaría la CPEC de un corredor económico en una posición estratégica."
 chi_bri.21.t: "Gwadar: Una solicitud de instalaciones navales"
 chi_bri.22.a: "Concesión de derechos de bastión a China"
 chi_bri.22.b: "Rechazar la propuesta"
 chi_bri.22.d: "Djibouti ha acogido instalaciones militares extranjeras durante décadas, pero la propuesta de Beijing es de carácter diferente. La instalación planeada en Doraleh sería la primera base permanente del Ejército Popular de Liberación en el extranjero, un hito que los estrategas occidentales han temido durante mucho tiempo y los planificadores chinos persiguieron."
 chi_bri.22.t: "Doraleh: Primera Base de Ultramar de China"
 chi_bri.30.a: "Responder con fuerza a las sanciones"
 chi_bri.30.b: "Supervisar la situación por ahora"
 chi_bri.30.d: "El anuncio de China sobre futuros petroleros yuanes designados ha enviado ondas de choque a través de Washington. Si los precios de petroyuan ganan la tracción entre los miembros de la OPEP y los socios de BRI, el estado de reserva-moneda del dólar enfrenta su reto más grave en las generaciones. El Congreso exige una respuesta."
 chi_bri.30.t: "La Petroyuan de Beijing amenaza la Hegemonía del Dólar"
 chi_bri.40.a: "Anunciar una nueva iniciativa audaz"
 chi_bri.40.b: "Firme una oleada de nuevos compromisos"
 chi_bri.40.c: "Liderazgo con reforma y transparencia"
 chi_bri.40.d: "Los jefes de ministros gubernamentales y financieros de toda Asia, África y Europa han convergedo en Beijing para el Foro trienal Franja y la Ruta. La reunión es parte de la cumbre, parte ferial y parte del teatro geopolítico. Las elecciones de China esta semana establecerán el tono para la próxima fase de la iniciativa."
 chi_bri.40.t: "Franja y la Ruta Foro se inaugura en Beijing"
 chi_bri.42.a: "Strike un tono firme y soberano"
 chi_bri.42.b: "Poner de relieve la cooperación y los beneficios mutuos"
 chi_bri.42.d: "Los periodistas de todo el mundo se han reunido para la conferencia de prensa final del foro. La China enmarcadora elige ahora dominará la cobertura internacional y establecerá expectativas para los próximos tres años de la diplomacia Franja y la Ruta."
 chi_bri.42.t: "Conferencia de prensa del Foro"
 chi_bri.43.a: "Publicar los resultados"
 chi_bri.43.d: "Las delegaciones se han ido y las pancartas han bajado. Los diplomáticos y economistas están contando los resultados: acuerdos firmados, promesas hechas, influencia acumulada. El Foro Franja y la Ruta ha vuelto a configurar las percepciones del papel global de China."
 chi_bri.43.t: "Franja y la Ruta Foro: Evaluación Final"
 chi_bri.50.a: "Declarar una nueva era de liderazgo chino"
 chi_bri.50.d: "La red de China Franja y la Ruta abarca ahora cada continente habitado. La red de infraestructura, deuda y obligación diplomática que Beijing ha tejido durante décadas se ha cristalizado en algo sin precedentes: un orden internacional formado a imagen de los intereses chinos. Los historiadores debatirán si llamarlo hegemonía o asociación. El mundo simplemente lo llamará un hecho."
 chi_bri.50.t: "Pax Sinica Establecida"
 chi_bri.70.a: "Anunciar la Era de Asociación Africana-Chino"
 chi_bri.70.d: "El efecto acumulativo de más de un decenio de las cumbres del Foro sobre la Cooperación China-África, Franja y la Ruta proyectos y diplomacia de alivio de la deuda ha producido un cambio decisivo. En todo el continente, los gobiernos que una vez se escucharon entre Beijing y Washington están consolidando alrededor de China como su principal socio. Una generación de líderes africanos ha crecido con infraestructura china, crédito chino y asesores chinos."
 chi_bri.70.t: "África Abraza el Siglo Chino"
 chi_bri.71.a: "Equipos de proyecto"
 chi_bri.71.d: "Para consolidar la nueva era, Beijing ha destinado fondos para una serie de megaproyectos emblemáticos en toda su red asociada africana. Estos no serán subsidios ordinarios de infraestructura, sino que serán desarrollos anclados por China con derechos estratégicos a largo plazo y cláusulas de acceso preferencial."
 chi_bri.71.t: "Proyectos emblemáticos para África"
 chi_bri.80.a: "Anunciar un paso a pérdidas y ganancias de la deuda"
 chi_bri.80.b: "Cierre en cláusulas colaterales"
 chi_bri.80.d: "El Foro sobre la Cooperación China-África ha convocado su última sesión plenaria en Beijing. Los ministros de Finanzas, jefes de Estado y funcionarios del Banco de Desarrollo se han reunido para revisar el estado de los lazos sinoafricanos y trazar el camino hacia adelante. El anuncio de apertura de la cumbre definirá si esta reunión es recordada por generosidad o apalancamiento."
 chi_bri.80.t: "Cumbre FOCAC Convoca"
 chi_bri.81.a: "Endurecer las sanciones en Caracas"
 chi_bri.81.b: "Publicar protestas diplomáticas"
 chi_bri.81.c: "Tome nota y siga adelante"
 chi_bri.81.d: "China ha formalizado un sucesor del acuerdo de Petrocaribe, otorgando préstamos por petróleo a Venezuela y sus vecinos. Washington ahora se enfrenta a una opción entre señalar el descontento y arriesgar más alienación latinoamericana, o absorber el desarrollo en silencio."
 chi_bri.81.t: "China se traslada a Caracas"
 chi_bri.82.a: "Perdona la deuda"
 chi_bri.82.b: "Convertir atrasos en concesiones"
 chi_bri.82.c: "Dejar el soporte predeterminado"
 chi_bri.82.d: "Los ingresos petroleros de Venezuela se han colapsado y el servicio de deuda adeudado a los bancos estatales chinos está muy en mora. Beijing debe decidir si absorber la pérdida de buena voluntad, extraer colateral o dejar que el valor predeterminado sea una advertencia a otros prestatarios."
 chi_bri.82.t: "Caracas no puede pagar"
 chi_bri.83.a: "Protestar y buscar la eliminación"
 chi_bri.83.b: "Inicie un contraprograma"
 chi_bri.83.c: "Aceptar la nueva base de referencia"
 chi_bri.83.d: "China ha completado una red de estaciones terrestres de navegación y seguimiento de Beidou en Argentina y Bolivia, ampliando la cobertura de la constelación sobre el hemisferio sur. El Comando Espacial de los Estados Unidos y el Comando Sur han marcado las instalaciones como doble uso. Washington debe decidir cómo responder."
 chi_bri.83.t: "Estaciones de seguimiento Beidou en la Patagonia"
 chi_bri.84.a: "Asegurar los cuatro interruptores"
 chi_bri.84.b: "Cierre en tres socios confiables"
 chi_bri.84.d: "La finalización de la estrategia Monroe Doctrine Inverted ha creado las condiciones para una cascada de cambios de reconocimiento diplomático. Varios estados latinoamericanos restantes que aún reconocen formalmente a Taipei están ahora al alcance de un interruptor silencioso, con la familia china."
 chi_bri.84.t: "Taiwán pierde sus últimos aliados"
 chi_bri.85.a: "Consolidación del reajuste regional"
 chi_bri.85.b: "Pocket el capital político"
 chi_bri.85.d: "Con la influencia de China ahora incrustada en todas las instituciones latinoamericanas, la Organización de los Estados Americanos se ha hundido sistemáticamente como un lugar para la gobernanza regional liderada por Estados Unidos. La CELAC ha surgido como el foro multilateral preferido. Las repercusiones se sienten desde Washington a Buenos Aires."
 chi_bri.85.t: "La OEA pierde su mandato"
 chi_bri.86.a: "Coordinar un régimen de sanciones más estricto"
 chi_bri.86.b: "Inscribir preocupación por los canales"
 chi_bri.86.d: "La ratificación por China de una asociación integral de 25 años con Teherán ha enviado ondas de choque a través de la arquitectura de seguridad del Medio Oriente. Funcionarios estadounidenses, planificadores de defensa israelíes y estados del Golfo están evaluando las consecuencias y considerando su respuesta."
 chi_bri.86.t: "Alarma en Washington, Tel Aviv y Riyadh"
 chi_bri.87.a: "Publicar el logro a nivel mundial"
 chi_bri.87.b: "Consolidación interna"
 chi_bri.87.d: "La Comunión de Beijing que formaliza la reconciliación saudí-iranesa ha sido recibida en toda la comunidad internacional. El papel de China como mediador entre dos adversarios históricos representa una demostración significativa del alcance diplomático que pocos predijeron hace una década."
 chi_bri.87.t: "Beijing reclama el crédito"
 chi_bri.88.a: "Anuncio del nuevo marco de arreglo"
 chi_bri.88.d: "Los estados del Golfo han comenzado a establecer una parte de sus transacciones petroleras en renminbi, completando la arquitectura financiera China se ha reunido durante el decenio anterior. La erosión de la hegemonía del dólar en los mercados energéticos es gradual pero ahora estructuralmente incrustada."
 chi_bri.88.t: "Las fracturas de Petrodollar"
 chi_bri.89.a: "Asegurar los interruptores de núcleo"
 chi_bri.89.b: "Empuje para el barrido completo"
 chi_bri.89.d: "La estrategia del Foro de las Islas del Pacífico ha madurado hasta el punto en que los cambios de reconocimiento diplomático son alcanzables. Las Islas Salomón y Kiribati son los objetivos más accesibles, ya que Tuvalu y Palau pueden alcanzarse si Beijing está dispuesta a invertir más."
 chi_bri.89.t: "Los reconocimientos de la isla del Pacífico pivotan"
 chi_bri.90.a: "Condene el pacto y coordine una respuesta"
 chi_bri.90.b: "Registrar preocupación y supervisar"
 chi_bri.90.d: "El Pacto de Seguridad Honiara ha desencadenado una sesión de emergencia de las Consultas Ministeriales entre Australia y los Estados Unidos. Canberra, Washington y Wellington están coordinando una respuesta a lo que describen como una amenaza directa para la soberanía del Pacífico y la estabilidad regional."
 chi_bri.90.t: "Canberra Demandas Respuestas"
 chi_bri.91.a: "Declarar un papel de liderazgo en materia de seguridad del Pacífico"
 chi_bri.91.b: "Reconocer el revés diplomático"
 chi_bri.91.d: "Los resultados de la Iniciativa de los Ocho Países del Pacífico están dentro. El historial de compromiso de China en los estados insulares del Pacífico determinará si Beijing puede reclamar un papel de liderazgo de seguridad o debe absorber un retroceso de reputación."
 chi_bri.91.t: "El informe de la iniciativa Ocho países"
 chi_bri.92.a: "Acelerar la respuesta aliada"
 chi_bri.92.b: "Considerar las opciones de escalada"
 chi_bri.92.c: "Recalibrar y observar"
 chi_bri.92.d: "La adquisición por China de acceso al basing en las Islas Salomón ha ampliado el alcance de la Armada del PLA hasta el borde de la segunda cadena isleña. El Mando Indopacífico de los Estados Unidos y la Fuerza de Defensa de Australia están evaluando las implicaciones estratégicas y determinando su respuesta."
 chi_bri.92.t: "Beijing recupera la segunda cadena de la isla"
 chi_bri.93.a: "Desaprobación de empresas exprés"
 chi_bri.93.b: "Reconocer el desarrollo"
 chi_bri.93.d: "Italia se ha convertido en el primer estado del G7 para firmar un memorando de entendimiento Franja y la Ruta, creando un precedente que los socios del G7 restantes ven con diferentes grados de alarma y oportunidad. Cada capital debe determinar ahora su propia postura hacia la inversión en infraestructura china."
 chi_bri.93.t: "Roma firma con Beijing"
 chi_bri.94.a: "Atender a los socios principales"
 chi_bri.94.b: "Mantener el marco con inversión"
 chi_bri.94.d: "La retirada de Lituania del mecanismo 17+1 ha expuesto una línea de falla entre los miembros báltico y nórdico de un lado y el núcleo Balcanes-Visegrad en el otro. China debe elegir si consolidar una coalición más pequeña, más confiable o gastar para mantener el marco más amplio juntos."
 chi_bri.94.t: "El 17+1 Envuelve un tenedor"
 chi_bri.96.a: "El siglo de China comienza."
 chi_bri.96.b: "Reconocer la nueva realidad."
 chi_bri.96.c: "Tomar nota del orden emergente."
 chi_bri.96.d: "El orden mundial consensual que China ha construido a través de la Iniciativa Mundial para el Desarrollo, el Banco Asiático de Inversión en Infraestructura y la cooperación de alta calidad Franja y la Ruta ya no es una visión - es la arquitectura operativa del sistema internacional. La membresía BRICS+ cubre la mayoría de la población mundial. La dirección Davos de 2017 se lee ahora como profecía."
 chi_bri.96.t: "Una Comunidad de Futuros Compartidos"
 CHI_foreign.012.a: "Tendremos cuidado."
 CHI_foreign.012.d: "Los funcionarios chinos han sugerido silenciosamente que Washington reconsidere su enfoque respecto de la cuestión coreana, lo que implica que una iniciativa diplomática puede ser próxima. La señal podría ser una abertura o un feto."
 CHI_foreign.012.t: "Una señal de Beijing"
 CHI_foreign.014.a: "Revisa el proyecto."
 CHI_foreign.014.d: "La base para una declaración conjunta sobre el futuro de la península coreana está en vigor. Beijing ha presentado un proyecto de marco para su examen."
 CHI_foreign.014.t: "Marco de declaración conjunta"
 CHI_foreign.024.a: "Consideramos cuidadosamente nuestras opciones."
 CHI_foreign.024.d: "China ha señalado su aceptación de un acuerdo centrado en Seúl de la cuestión coreana, un cambio histórico en la posición de Beijing con el que Pyongyang debe ahora considerar."
 CHI_foreign.024.t: "Beijing Backs Seúl"
 CHI_foreign.030.a: "Esto representa una politización inaceptable de las relaciones comerciales."
 CHI_foreign.030.b: "La presión es lamentable pero sostenible. Estamos firmes."
 CHI_foreign.030.d: "La respuesta de Beijing al despliegue del THAAD en Corea del Sur ha aumentado de la protesta diplomática a la coacción económica. Las autoridades chinas están dirigiendo restricciones a las operaciones comerciales coreanas, los productos de entretenimiento y el turismo, una campaña calibrada diseñada para imponer costos sin desencadenar un régimen formal de sanciones."
 CHI_foreign.030.t: "La represalia de THAAD"
 CHI_foreign.031.a: "Reconoce la señal. Mantenga la postura actual."
 CHI_foreign.031.b: "Las seguridades de China no son creíbles. Reforzar nuestro compromiso coreano."
 CHI_foreign.031.d: "China ha señalado a través de canales militares-militares que los ejercicios del río Yalu son defensivos en orientación. El mensaje de Beijing es claro: China gestionará el comportamiento de Corea del Norte y no requiere escalada estadounidense para mantener la estabilidad regional."
 CHI_foreign.031.t: "La restricción de las señales de Beijing"
 CHI_foreign.032.a: "Avisa a nuestra guarnición coreana. Solicitar consultas urgentes con Seúl."
 CHI_foreign.032.b: "Supervisa la situación. Evite las respuestas provocativas."
 CHI_foreign.032.d: "Las imágenes de satélite confirman una reorganización significativa de las fuerzas terrestres norcoreanas hacia disposiciones ofensivas a lo largo del paralelo 38. Los trenes logísticos chinos están apoyando la reposición. El Ejército Popular Coreano parece estar preparando algo más allá de los ejercicios rutinarios."
 CHI_foreign.032.t: "Construcción en el Yalu"
 CHI_foreign.033.a: "Comience la planificación de contingencias. Consulta con Washington."
 CHI_foreign.033.b: "Las limitaciones constitucionales son absolutas. Proceder a través de canales diplomáticos solamente."
 CHI_foreign.033.d: "La construcción de la fuerza norcoreana a lo largo del paralelo 38 ha reiniciado el debate en la Dieta de Japón sobre el artículo 9 y los límites constitucionales de la postura de autodefensa de Japón. Los halcones de defensa están presionando para una reinterpretación de emergencia de los compromisos colectivos de autodefensa."
 CHI_foreign.033.t: "Artículo 9 En debate"
 CHI_foreign.034.a: "Activar nuestros compromisos de defensa mutua con Corea del Sur."
 CHI_foreign.034.b: "Convocar una sesión del Consejo de Seguridad de emergencia."
 CHI_foreign.034.d: "Las fuerzas norcoreanas, con apoyo logístico y material chino, han cruzado la zona desmilitarizada. China no ha entrado formalmente en el conflicto, pero sus huellas están en todos los aspectos de la máquina de guerra norcoreana."
 CHI_foreign.034.t: "Guerra en la península"
 CHI_foreign.035.a: "Ve a la máxima alerta. Prepara fuerzas de contingencia."
 CHI_foreign.035.b: "No se mueva hasta que la situación clarifique."
 CHI_foreign.035.d: "Los informes no confirmados de disparos y movimiento militar dentro del perímetro de seguridad Pyongyang sugieren que algo extraordinario está ocurriendo en la capital de Corea del Norte. Los medios de comunicación estatales chinos son silenciosos. La situación no es peligrosamente clara."
 CHI_foreign.035.t: "Chaos en Pyongyang"
 CHI_foreign.036.a: "Emitir una declaración formal que condene la injerencia en la soberanía norcoreana."
 CHI_foreign.036.b: "Contacto abierto con el consejo de transición."
 CHI_foreign.036.d: "Los oficiales respaldados por chinos han presentado un golpe de Estado contra Kim Jong-un. La familia Kim ha sido removida del poder. Un consejo de transición se está formando en Pyongyang bajo cifras conocidas como interlocutores de Beijing. China parece estar interrumpiendo una sucesión administrada."
 CHI_foreign.036.t: "Pyongyang Coup"
 CHI_foreign.037.a: "Expresa preocupación por Beijing a través de canales diplomáticos."
 CHI_foreign.037.b: "Espera y observa. La situación es demasiado fluida para las declaraciones fuertes."
 CHI_foreign.037.d: "El golpe de Estado en Corea del Norte brinda tanto la oportunidad como el peligro para Japón. Un gobierno de transición alineado con China en Pyongyang puede ser más predecible que Kim Jong-un, pero un estado cliente chino en la península coreana representa un reto estratégico significativo para Tokio."
 CHI_foreign.037.t: "Un nuevo Pyongyang"
 CHI_foreign.038.a: "Protesto formalmente la reestructuración unilateral de la gobernanza norcoreana."
 CHI_foreign.038.b: "Acepta la nueva realidad. Busque alojamiento con la política de Corea de Beijing."
 CHI_foreign.038.d: "China ha anunciado los términos del acuerdo político post-coup en Pyongyang. El nuevo gobierno norcoreano está constitucionalmente reestructurado, económicamente integrado en cadenas de suministro chinas y subordinado estratégicamente a la política de Corea de Beijing."
 CHI_foreign.038.t: "El acuerdo de Beijing"
 CHI_foreign.040.a: "Esta realineación es inaceptable. Consecuencias de la señal a Seúl."
 CHI_foreign.040.b: "Acepta la deriva. La alianza no puede ser mantenida por compulsión."
 CHI_foreign.040.d: "La adopción por Corea del Sur de una doctrina de autonomía estratégica y su decisión de involucrar a China como socio de seguridad primaria representa un profundo realineamiento del equilibrio entre el Pacífico. La alianza entre EE.UU. y Corea, sostenida desde 1953, enfrenta su tensión más grave en décadas."
 CHI_foreign.040.t: "Seoul Drifts"
 CHI_foreign.041.a: "Expresar un interés cauteloso en la configuración cambiante."
 CHI_foreign.041.b: "Rechazar el encuadre. China no está abandonando Corea del Norte."
 CHI_foreign.041.d: "El pivote de Corea del Sur hacia Beijing ha obligado a Pyongyang a hacer un cálculo incómodo. Una asociación China-Seúl que excluye a Corea del Norte es estratégicamente más amenazante que la presencia de Estados Unidos en el sur."
 CHI_foreign.041.t: "¿Qué China?"
 CHI_foreign.042.a: "Iniciar consultas urgentes con Washington sobre medidas compensatorias."
 CHI_foreign.042.b: "Evaluar si los arreglos bilaterales de seguridad entre Japón y Corea son factibles."
 CHI_foreign.042.d: "El retiro de Corea del Sur del marco trilateral de seguridad EE.UU.-Japón-Korea deja a Japón aislado dentro de lo que queda de la arquitectura Indo Pacífico. Sin la participación de Seúl, las relaciones de seguridad de Japón con Washington carecen de un pilar crítico."
 CHI_foreign.042.t: "Tokio Solo"
 CHI_foreign.043.a: "Reasegurar a nuestros socios filipinos de nuestro compromiso."
 CHI_foreign.043.b: "Iniciar un examen estratégico de los compromisos contraídos por el Indo Pacífico."
 CHI_foreign.043.d: "El retiro de Corea del Sur del marco trilateral de seguridad ha desencadenado ansiedad en Manila sobre la durabilidad de los compromisos de seguridad estadounidenses en todo el Indo-Pacífico. Los funcionarios filipinos han comenzado a reevaluar silenciosamente su propia postura de alianza."
 CHI_foreign.043.t: "Los marcos marco"
 CHI_foreign.044.a: "Aceptar el revés estratégico. Recalibrar alrededor de los socios restantes."
 CHI_foreign.044.d: "La salida de Corea del Sur desde el marco trilateral desmantela eficazmente la arquitectura Indo-Pacific que Washington pasó una década construyendo. China ha logrado a través de la diplomacia paciente lo que nunca podría haber conseguido a través del enfrentamiento."
 CHI_foreign.044.t: "La Estrategia Indopacífico se derrumbe"
 CHI_foreign.045.a: "Aceptar la solicitud. Empezar una redistribución ordenada."
 CHI_foreign.045.b: "Rechazar. Las fuerzas estadounidenses permanecen en la península a discreción de Washington."
 CHI_foreign.045.d: "El respaldo formal de Corea del Sur a las garantías de seguridad chinas ha hecho que la presencia continua de fuerzas terrestres estadounidenses en la península sea políticamente insostenible. Seúl ha solicitado un calendario para el redespliegue militar estadounidense del territorio coreano."
 CHI_foreign.045.t: "Los tropas vienen a casa"
 CHI_foreign.046.a: "Iniciar consultas de emergencia con Washington sobre la postura de seguridad de Japón."
 CHI_foreign.046.b: "Acelerar el desarrollo de la capacidad de defensa indígena."
 CHI_foreign.046.d: "El redespliegue estadounidense de Corea hace que la alianza de seguridad entre Estados Unidos y Japón sea estratégicamente incompleta. El flanco sur de Japón está expuesto, y las suposiciones que sustentan la planificación de defensa japonesa durante las últimas siete décadas requieren una revisión fundamental."
 CHI_foreign.046.t: "La alianza Hollow"
 CHI_foreign.047.a: "Aceptar la garantía. El futuro de Corea no puede depender de patrones distantes."
 CHI_foreign.047.b: "Rechazar la oferta. La soberanía coreana no puede ser negociada para el patronato chino."
 CHI_foreign.047.d: "China ha ofrecido a Corea del Sur una garantía formal de seguridad que subescriba cualquier futura solución de unificación. La Garantía de Beijing compromete a China a defender la soberanía unificada de Corea, a cambio de acuerdos estratégicos que transformen efectivamente a Corea en un estado alineado por China."
 CHI_foreign.047.t: "La garantía de Beijing"
 CHI_foreign.048.a: "Participación en el marco de Beijing. La supervivencia exige realismo."
 CHI_foreign.048.b: "Rechazar el marco. No seremos absorbidos."
 CHI_foreign.048.d: "La oferta china de una garantía de seguridad para una Corea unificada ha forzado un momento de claridad en Pyongyang. El liderazgo norcoreano debe elegir entre resistencia y alojamiento, sabiendo que la resistencia sin respaldo chino es insostenible."
 CHI_foreign.048.t: "La Garantía y el Norte"
 CHI_foreign.049.a: "Publicar una declaración oficial sobre el proceso y sus consecuencias."
 CHI_foreign.049.b: "Reconocer el resultado. Adapte nuestra estrategia de Indo Pacífico en consecuencia."
 CHI_foreign.049.d: "El proceso de unificación coreana se lleva a cabo bajo los auspicios chinos y en términos chinos. Los setenta años de presencia militar e inversión diplomática en la seguridad de Corea han producido una Corea unificada alineada con Beijing."
 CHI_foreign.049.t: "Una unificación que no hicimos"
 CHI_foreign.050.a: "Noted."
 CHI_foreign.050.d: "Los grupos de batalla portaaviones estadounidenses se han posicionado hacia el Estrecho de Corea en respuesta a las crecientes tensiones. Beijing monitorea el movimiento."
 CHI_foreign.050.t: "Los portadores avanzan hacia el estrecho de Corea"
 CHI_foreign.051.a: "Una situación difícil."
 CHI_foreign.051.d: "Las tensiones en la península de Corea han alcanzado un umbral crítico. Washington, Tokio y Seúl han entrado en posturas elevadas de preparación."
 CHI_foreign.051.t: "Alerta regional de crisis"
 CHI_foreign.052.a: "Párate. El precio es demasiado alto."
 CHI_foreign.052.b: "Mantenga la presión."
 CHI_foreign.052.d: "Las tensiones de la península coreana han alcanzado su ápice. Beijing debe decidir si dar un paso atrás, mantener su curso o presionar por un resultado decisivo."
 CHI_foreign.052.t: "La península en el Brink"
 CHI_foreign.053.a: "Un desarrollo agradable."
 CHI_foreign.053.d: "La atmósfera de crisis en la península coreana ha levantado. Las potencias regionales acogen con beneplácito el regreso a la estabilidad."
 CHI_foreign.053.t: "Korean Peninsula Détente"
 CHI_foreign.054.a: "La adquisición sirve a nuestros intereses económicos."
 CHI_foreign.054.b: "El petróleo de Kazajstán debe permanecer bajo control nacional."
 CHI_foreign.054.d: "China National Petroleum Corporation ha presentado una propuesta formal para adquirir PetroKazajstán por $4.18 mil millones. El acuerdo transferiría el control operativo del mayor productor de petróleo independiente de Kazajstán a manos chinas a cambio de un pago sustancial en efectivo a los cofres estatales."
 CHI_foreign.054.t: "Propuesta de adquisición del CNPC"
 CHI_foreign.056.a: "Respetamos su decisión."
 CHI_foreign.056.d: "Astana ha rechazado la oferta del CNPC para PetroKazajstán, citando preocupaciones sobre la soberanía de los recursos nacionales."
 CHI_foreign.056.t: "Kazajstán rechaza la licitación de adquisición del CNPC"
 CHI_foreign.057.a: "La adquisición está en interés económico de Angola."
 CHI_foreign.057.b: "Nuestros recursos energéticos no están a la venta."
 CHI_foreign.057.d: "Sinopec ha presentado una oferta de $7.2 mil millones para adquirir Addax Petroleum, Obtener acceso a licencias de producción de petróleo en todo Angola, Nigeria, y la Región del Kurdistán. El acuerdo representaría la mayor adquisición de Sinopec en el extranjero hasta la fecha"
 CHI_foreign.057.t: "Propuesta de Adquisición Sinopec"
 CHI_foreign.058.a: "Sinopec asegura otra posición en la producción africana de petróleo."
 CHI_foreign.058.d: "Luanda ha aceptado la oferta de Sinopec para Addax Petroleum. Los ingenieros chinos asumirán el control operacional de los bloques petroleros extraterritoriales, con una parte del producto dirigido hacia la infraestructura angoleña."
 CHI_foreign.058.t: "Angola aprueba la adquisición sinopec"
 CHI_foreign.059.a: "Respetamos su decisión."
 CHI_foreign.059.d: "Luanda ha rechazado la oferta de Sinopec para adquirir Addax Petroleum."
 CHI_foreign.059.t: "Angola rechaza la compra de Sinopec Bid"
 CHI_foreign.060.a: "Los conocimientos especializados chinos y el capital son bienvenidos."
 CHI_foreign.060.b: "La riqueza petrolera de Venezuela no es para concesiones extranjeras."
 CHI_foreign.060.d: "CNOOC ha propuesto una empresa conjunta a largo plazo para desarrollar la Cinta de Cruzada Pesada Orinoco junto con Petróleos de Venezuela. China proporcionaría capital inicial y conocimientos técnicos especializados en extracción de petróleo pesado a cambio de una parte de los derechos de producción."
 CHI_foreign.060.t: "Propuesta conjunta de la Ventura CNOOC"
 CHI_foreign.061.a: "CNOOC asegura una posición en las mayores reservas de petróleo del Hemisferio Occidental."
 CHI_foreign.061.d: "Caracas ha acordado la propuesta conjunta de CNOOC para el cinturón Orinoco. Los derechos de producción a lo largo de los bloques Junín ahora se comparten, trayendo tecnología de extracción china a las mayores reservas mundiales de petróleo probada."
 CHI_foreign.061.t: "Venezuela aprueba la Ventura Conjunta CNOOC"
 CHI_foreign.062.a: "Respetamos su decisión."
 CHI_foreign.062.d: "Caracas ha rechazado la propuesta conjunta de CNOOC para el Cinturón Orinoco."
 CHI_foreign.062.t: "Venezuela rechaza la Ventura Conjunta CNOOC"
 CHI_foreign.063.a: "Una adquisición estratégica para nuestra seguridad energética."
 CHI_foreign.063.d: "Astana ha aceptado la oferta del CNPC para PetroKazajstán. Los campos petroleros operados por China expandirán la producción de los campos Kumkol y North Buzachi, asegurando un suministro constante de crudo kazajo para las refinerías chinas."
 CHI_foreign.063.t: "Kazajstán aprueba la adquisición del CNPC"
 CHI_foreign.100.a: "Presión sostenida. Consulta con nuestros aliados."
 CHI_foreign.100.d: "China ha lanzado una campaña coordinada de presión contra Corea del Sur, aplicando señales diplomáticas, económicas y militares diseñadas para desplazar el cálculo de seguridad de Seúl lejos de Washington."
 CHI_foreign.100.t: "Campaña de presión de Beijing"
 CHI_foreign.101.a: "Documentar las medidas y preparar una respuesta proporcional."
 CHI_foreign.101.d: "Beijing ha ampliado su reacción al THAAD en un régimen más amplio de restricciones económicas informales. Las empresas coreanas que operan en China informan de la obstrucción sistemática entre las vías de concesión de licencias, aduanas y reglamentarias."
 CHI_foreign.101.t: "Sanciones informales impuestas"
 CHI_foreign.102.a: "Involucrar cuidadosamente. Mantenga el canal abierto."
 CHI_foreign.102.d: "Los diplomáticos chinos y estadounidenses han establecido un canal de trabajo discreto sobre cuestiones relativas a la península coreana. El acuerdo permite a ambas partes gestionar los riesgos de escalada sin comprometerse públicamente en un marco oficial de negociación."
 CHI_foreign.102.t: "Un canal de atrás abre"
 CHI_foreign.103.a: "Participar con el nuevo marco. Supervisar sus implicaciones."
 CHI_foreign.103.d: "Beijing y Seúl han acordado un restablecimiento diplomático estructurado, restablecer los contactos de alto nivel y abrir un marco trilateral para las deliberaciones en la península. El acuerdo representa una salida significativa de la alineación anterior de Corea del Sur con Washington."
 CHI_foreign.103.t: "The 2022 Reset"
 CHI_foreign.104.a: "Aceptar el marco. Define nuestro papel dentro de él."
 CHI_foreign.104.d: "China y los Estados Unidos han convenido en los esbozos de una arquitectura de seguridad post-armista para la península coreana. El marco G2 asigna a ambos poderes la corresponsabilidad de la estabilidad de la península, marginando a otros actores."
 CHI_foreign.104.t: "Una arquitectura Post-Armistice"
 CHI_foreign.105.a: "Estudie la propuesta. Consulta con asesores de la industria y seguridad."
 CHI_foreign.105.d: "China ha propuesto una plataforma de integración económica que vincula a la industria surcoreana con un proceso de reunificación gestionado. El acuerdo crea profundos incentivos estructurales para Seúl para alinear su política de unificación con el resultado preferido de Beijing."
 CHI_foreign.105.t: "Marco Económico para la Unidad"
 CHI_foreign.106.a: "Reconocer la nueva doctrina. Prepare nuestra respuesta estratégica."
 CHI_foreign.106.d: "La adopción formal de una doctrina de autonomía estratégica en Corea del Sur indica un giro decisivo lejos del marco de alianza entre Estados Unidos y Corea. Seúl se está posicionando entre Washington y Beijing en lugar de dentro de la órbita de seguridad estadounidense."
 CHI_foreign.106.t: "El Pivot Invertido"
 CHI_foreign.107.a: "Adelante el ultimátum a Pyongyang."
 CHI_foreign.107.b: "Rechazar. La reunificación debe estar solo en nuestros términos."
 CHI_foreign.107.d: "[CHI.GetLeader] y [USA.GetLeader] han alcanzado un entendimiento raro. Solicitarán conjuntamente que [NKO.GetName] acepte la reunificación pacífica bajo Seúl. La alternativa es la guerra. [KOR.GetName] debe decidir si enviar el ultimátum a Pyongyang."
 CHI_foreign.107.t: "Un Ultimátum Conjunto para el Norte"
 CHI_foreign.108.a: "Aceptar. El juego ha terminado."
 CHI_foreign.108.b: "Rechazar. No entregaremos nuestra soberanía."
 CHI_foreign.108.d: "Un comunicado conjunto sinoamericano ha llegado a Pyongyang. Exige la disolución inmediata y pacífica del estado [NKO.GetName] y la reunificación de la península bajo el gobierno en Seúl. El refusal significa guerra con China, Estados Unidos y Corea del Sur simultáneamente."
 CHI_foreign.108.t: "Beijing y Washington exigen la unificación"
 CHI_foreign.109.a: "Amanece una nueva era en Asia oriental."
 CHI_foreign.109.d: "Corea del Norte ha aceptado el ultimatum. El régimen de Kim ha acordado disolver el estado y transferir autoridad a Seúl. La península de Corea está unificada sin que se dispare, un triunfo diplomático a escala histórica."
 CHI_foreign.109.t: "Pyongyang Acepta"
 CHI_foreign.110.a: "Entonces vamos a la guerra."
 CHI_foreign.110.d: "Corea del Norte rechazó el ultimátum. La respuesta de Pyongyang fue entregada por fuego de artillería a través del DMZ. No queda camino diplomático: sólo guerra y liberación de la península por la fuerza."
 CHI_foreign.110.t: "Pyongyang se niega"
 CHI_foreign.200.a: "Forzar la cuestión."
 CHI_foreign.200.b: "Probar y retirar."
 CHI_foreign.200.c: "Exige la mediación de las Naciones Unidas."
 CHI_foreign.200.d: "Nuestros buques de guardacostas y el JMSDF de Japón están separados por menos de dos millas náuticas en el Mar de China Oriental. El siguiente movimiento es el nuestro. Cada opción conlleva consecuencias."
 CHI_foreign.200.t: "Las Flotas están en la Línea"
 CHI_foreign.201.a: "Mantenganse firmes. Ordene al JMSDF que mantenga la línea."
 CHI_foreign.201.b: "Solicito intervención de EE.UU. inmediatamente."
 CHI_foreign.201.c: "Retrocede y busca una solución diplomática."
 CHI_foreign.201.d: "Los buques chinos mantienen su posición en la frontera controvertida. Tokio debe decidir lo lejos que hay para retroceder."
 CHI_foreign.201.t: "China presiona la línea Senkaku"
 CHI_foreign.202.a: "Honra la garantía. Señalar apoyo militar a Japón."
 CHI_foreign.202.b: "Hedge. Expresa preocupación sin comprometer fuerzas."
 CHI_foreign.202.d: "El Japón ha invocado sus obligaciones de alianza. Los buques chinos están presionando el límite de Senkaku y Tokio está pidiendo a Washington que apoye sus compromisos. La decisión conlleva costos de cualquier manera."
 CHI_foreign.202.t: "¿Va a honrar la Garantía?"
 CHI_foreign.203.a: "Toma nota."
 CHI_foreign.203.b: "Un choque en nuestra puerta. Cuidado."
 CHI_foreign.203.c: "Una pelea lejana. Obsérvelo y continúa."
 CHI_foreign.203.d: "Los buques chinos y japoneses han chocado cerca de las Islas Senkaku. El incidente ha señalado la atención internacional y suscitado temores de una escalada más amplia en la región."
 CHI_foreign.203.t: "Confrontación en el Mar de China Oriental"
 CHI_foreign.204.a: "Rechazar la declaración. Mantenga nuestro control administrativo."
 CHI_foreign.204.b: "Emitir una protesta formal y consultar a Washington."
 CHI_foreign.204.d: "China ha emitido una declaración formal de soberanía sobre las Islas Diaoyu y ha anunciado un régimen continuo de patrullas de guardia costera. Se espera que Tokio responda."
 CHI_foreign.204.t: "Beijing reclama las Islas Diaoyu"
 CHI_foreign.206.a: "Envía el comunicado a Tokio."
 CHI_foreign.206.d: "La cumbre ha concluido con Japón firmando el comunicado conjunto en su totalidad. Actualmente se ha registrado una declaración que obliga a ambas partes a mantener relaciones estables sino-japonesas y un arreglo tácito de las quejas históricas."
 CHI_foreign.206.t: "La comunicación está firmada"
 CHI_foreign.208.a: "Toma nota."
 CHI_foreign.208.b: "Un cambio del equilibrio regional. Averigua."
 CHI_foreign.208.c: "Reconocer el desarrollo."
 CHI_foreign.208.d: "China y Japón han emitido una comunicación conjunta que formaliza un entendimiento estratégico. El texto compromete a ambas partes a mantener relaciones estables y un acuerdo tácito sobre las quejas históricas. Los analistas están divididos en si Beijing o Tokio ganaron más."
 CHI_foreign.208.t: "Comunicado sino-japonés firmado"
 CHI_foreign.211.a: "Cancela silenciosamente las visitas"
 CHI_foreign.211.b: "La visita estatal procede"
 CHI_foreign.211.d: "El recuerdo de Beijing de su embajador y la congelación diplomática han hecho que la próxima ronda del Santuario de Yasukuni visite una prueba fundamental. ¿El gabinete japonés desactivará la fila, o endurecerá el orgullo nacional?"
 CHI_foreign.211.t: "Elección de Tokio sobre las visitas de Yasukuni"
 CHI_foreign.212.a: "Escalar la respuesta de los guardias costeros"
 CHI_foreign.212.b: "Abra un canal trasero para descalizar"
 CHI_foreign.212.d: "La confrontación entre las milicias marítimas chinas y los cortadores de la Guardia Costera japonesa se ha intensificado cerca de las Islas Diaoyu. El gabinete debe responder antes de que el vídeo llegue a las noticias nocturnas."
 CHI_foreign.212.t: "Incidente del enfrentamiento de Senkaku"
 CHI_foreign.216.a: "Arrastre a los luchadores y mantenga la línea ADIZ"
 CHI_foreign.216.b: "Recorra el incidente a un túnel trasero tranquilo"
 CHI_foreign.216.d: "Los aviones chinos entran diariamente en la zona de defensa antiaérea del Este de China, y una colisión cercana entre un caza PLA y un jet JASDF ha puesto a Tokio al borde. Sólo la Guardia Costera ya no puede controlar la presión alrededor de los Senkakus."
 CHI_foreign.216.t: "Senkaku ADIZ confrontación"
 CHI_foreign.217.a: "Implementar un grupo de tareas PLAN y mantener una empresa"
 CHI_foreign.217.b: "Retira antes de que empiece el tiroteo."
 CHI_foreign.217.d: "Un grupo de tareas navales chinos está sombreando buques japoneses a la vista de las islas disputadas, y ambas marinas están en los barrios generales. Una maniobra errónea podría desencadenar los primeros disparos de una guerra sino-japonesa. Tokio espera ver si Beijing mantendrá la línea o retroceda."
 CHI_foreign.217.t: "Senkaku Standoff en el Brink"
 CHI_foreign.213.a: "Paga del vestíbulo y termina el boicot"
 CHI_foreign.213.b: "El tiempo la tormenta"
 CHI_foreign.213.d: "Los exportadores japoneses y los keidanren están perdiendo paciencia. El boicot en China está apagando las marcas japonesas de uno de sus mayores mercados. Tokio tiene que decidir: pagar a Pekín o el tiempo de la tormenta."
 CHI_foreign.213.t: "El boicot Bites"
 CHI_foreign.215.a: "Cumplimiento del tratado de seguridad"
 CHI_foreign.215.b: "Coloque una armisticio a través de canales traseros"
 CHI_foreign.215.d: "Beijing ha forzado la cuestión de Senkaku. El tratado de seguridad mutua obliga a Washington a considerar la intervención. El Presidente puede hacer cumplir abiertamente el tratado o presionar por un armisticio de canal trasero."
 CHI_foreign.215.t: "Senkaku de Washington Decisión"
 CHI_foreign.220.a: "Bienvenido a la overture"
 CHI_foreign.220.b: "Polite skepticism"
 CHI_foreign.220.d: "Beijing ha señalado la apertura en el modelo de la Doctrina Fukuda original 1978. Tokio puede dar la bienvenida o responder con el escepticismo cortés."
 CHI_foreign.220.t: "Una Doctrina de Fukuda para el Nuevo Siglo"
 CHI_foreign.221.a: "Organizar una visita al estado completo"
 CHI_foreign.221.b: "Low-profile reception"
 CHI_foreign.221.d: "China ha ofrecido un regalo estatal de pandas gigantes al zoológico Ueno. El gabinete debe decidir si albergar una visita al estado completo o mantener las cosas de bajo perfil."
 CHI_foreign.221.t: "Un Panda para Tokio"
 CHI_foreign.222.a: "Firma el pacto"
 CHI_foreign.222.b: "Espera más pruebas"
 CHI_foreign.222.d: "Beijing ha presentado una declaración bilateral que renuncia formalmente a los enemigos históricos. Tokio puede firmar y reciprocar, o esperar más pruebas de la intención china."
 CHI_foreign.222.t: "Pacto de reducción de la amenaza mutua"
 CHI_foreign.223.a: "Presión Japón para recommitir"
 CHI_foreign.223.b: "Reducir el Quad a un diálogo"
 CHI_foreign.223.d: "La cuña diplomática de Pekín está empezando a pelar Tokio lejos del Diálogo de Seguridad Cuadrilateral. Washington puede presionar a Japón para que renueva, o aceptar silenciosamente el descenso."
 CHI_foreign.223.t: "The Quad's Responder"
 CHI_foreign.224.a: "Firme la Comunión completa"
 CHI_foreign.224.b: "Firme con las reservas"
 CHI_foreign.224.c: "Vete."
 CHI_foreign.224.d: "Años de diplomacia paciente han producido un proyecto de comunicado. Firmar el texto completo rewire la postura estratégica de Japón; firmar con reservas preserva las relaciones bilaterales sin romper con Washington; salir a romper todo el proceso."
 CHI_foreign.224.t: "La Comunión de Tokio"
 CHI_foreign.226.a: "Tenga en cuenta las reservas y avance."
 CHI_foreign.226.d: "Tokio ha firmado una versión más limitada de la comunicadora. El PDL estableció reservas específicas en lugar de aceptar el texto completo, preservando un grado de alineación con Washington. La relación bilateral avanza, aunque la ambigüedad estratégica permanece."
 CHI_foreign.226.t: "Acuerdo parcial con Japón"
 CHI_foreign.227.a: "Evaluar el daño."
 CHI_foreign.227.d: "Años de trabajo diplomático han quedado sin hacer. El PPD rechazó el texto comunicativo definitivo, acusando a Beijing de sobremanera su mandato y subordinando la soberanía japonesa. Todo el marco de negociación se ha colapsado."
 CHI_foreign.227.t: "Japón se aleja de las conversaciones"
 CHI_foreign.231.a: "Note la oportunidad comercial."
 CHI_foreign.231.d: "Beijing ha acogido con beneplácito a Mitsubishi Aerospace para establecer instalaciones de producción e investigación autorizadas en el continente. La industria japonesa gana ingresos de exportación y acceso a los mercados; Los ingenieros aeroespaciales chinos se acercan al diseño avanzado del marco aéreo."
 CHI_foreign.231.t: "Mitsubishi Aerospace se abre en China"
 CHI_foreign.232.a: "Note la oportunidad comercial."
 CHI_foreign.232.d: "La división aeroespacial de Kawasaki ha asegurado un acuerdo marco con Beijing que abarca la producción de componentes de gran alcance. El acuerdo abre una parte sustancial del mercado chino al tiempo que da influencia a Tokio sobre los ciclos de adquisición aeroespacial chino."
 CHI_foreign.232.t: "Kawasaki Aerospace entra en China"
 CHI_foreign.233.a: "Note la oportunidad comercial."
 CHI_foreign.233.d: "Japan Steel Works ha recibido la aprobación para operar una forja de apertura conjunta en China. Las ganancias de exportación de grandes forjaciones de acero dan a Tokio una influencia continua sobre la pesada capacidad industrial china."
 CHI_foreign.233.t: "Japón Steel Works Llega a China"
 CHI_foreign.234.a: "Note la oportunidad comercial."
 CHI_foreign.234.d: "El brazo de sistemas terrestres de Mitsubishi Heavy Industries ha acordado un arreglo de licencias tecnológicas con un socio estatal chino. Japón obtiene rendimientos comerciales; Beijing obtiene acceso a metodologías de diseño de vehículos blindados."
 CHI_foreign.234.t: "MHI Land Systems Invitado a China"
 CHI_foreign.235.a: "Note la oportunidad comercial."
 CHI_foreign.235.d: "Komatsu Defense ha establecido un acuerdo de cooperación para la producción en China que abarca vehículos blindados ligeros. El acuerdo genera ingresos constantes de exportación para Tokio y profundiza los vínculos bilaterales de la industria de defensa."
 CHI_foreign.235.t: "Komatsu Defense se mueve a China"
 CHI_foreign.236.a: "Note la oportunidad comercial."
 CHI_foreign.236.d: "La división aeroespacial de Subaru Corporation ha concertado un acuerdo conjunto de fabricación con una contraparte china. La experiencia estructural de la rotación fluye hacia el programa chino mientras que Subaru escribe órdenes de componentes a largo plazo."
 CHI_foreign.236.t: "Subaru asociación aeroespacial firmada"
 CHI_foreign.237.a: "Note la oportunidad comercial."
 CHI_foreign.237.d: "Howa Machinery ha autorizado sus procesos de mecanizado de precisión a una instalación asociada china. El acuerdo produce ingresos de exportación al tiempo que amplía las normas japonesas para la fabricación de armas pequeñas en la cadena de suministro de defensa china."
 CHI_foreign.237.t: "Howa Machinery Active en China"
 CHI_foreign.238.a: "Note la oportunidad comercial."
 CHI_foreign.238.d: "NEC Corporation ha abierto un centro conjunto de integración electrónica en China. Los rendimientos comerciales son sustanciales; el premio más profundo para Tokio es una influencia sostenida sobre las normas chinas de adquisición C4ISR."
 CHI_foreign.238.t: "NEC establece operaciones chinas"
 CHI_foreign.239.a: "Note la oportunidad comercial."
 CHI_foreign.239.d: "Toshiba Defense Systems ha acordado suministrar componentes de radar y sensores a los integradores chinos bajo un marco de licencias gestionado. Japón conserva la autoridad de diseño mientras gana las regalías de transferencia de tecnología estable."
 CHI_foreign.239.t: "Toshiba Defense Systems en China"
 CHI_foreign.240.a: "Note la oportunidad comercial."
 CHI_foreign.240.d: "El brazo armador de Mitsubishi ha concluido un acuerdo de cooperación naval con un astillero estatal chino. Los ingresos de exportación y la influencia a largo plazo sobre las normas chinas de diseño de combate superficial son los principales beneficios para Tokio."
 CHI_foreign.240.t: "Mitsubishi Shipbuilding firma con Beijing"
 CHI_foreign.241.a: "Note la oportunidad comercial."
 CHI_foreign.241.d: "La división del astillero de Kawasaki Heavy Industries ha acordado compartir técnicas de fabricación de casco submarino con un socio chino. El Japón obtiene acceso a los mercados; Beijing obtiene exposición a métodos de reducción de firmas acústicas."
 CHI_foreign.241.t: "Astillero Kawasaki Bienvenido a China"
 CHI_foreign.242.a: "Note la oportunidad comercial."
 CHI_foreign.242.d: "IHI ha obtenido aprobación para la producción de componentes aeromotores en China bajo un marco de fabricación autorizado. Tokio gana una corriente de ingresos duradera y una posición en la adquisición de aviación militar china."
 CHI_foreign.242.t: "IHI Corporation entra en el mercado chino"
 CHI_foreign.243.a: "Note la oportunidad comercial."
 CHI_foreign.243.d: "Japón Marine United ha concertado un acuerdo de cooperación en arquitectura naval con un constructor naval chino. El acuerdo produce ingresos de exportación y establece un papel japonés duradero en el desarrollo del programa de lucha contra la superficie chino."
 CHI_foreign.243.t: "Japón asociación marítima unida firmada"
 CHI_foreign.244.a: "Note la oportunidad comercial."
 CHI_foreign.244.d: "Toyota Motor Corporation ha acordado ampliar su huella logística y de fabricación china bajo el nuevo marco de asociación. Las exportaciones de sistemas de producción refuerzan la influencia suave japonesa sobre la modernización industrial china."
 CHI_foreign.244.t: "Toyota establece la fabricación china"
 CHI_foreign.245.a: "Note la oportunidad comercial."
 CHI_foreign.245.d: "Honda Motor Company ha asegurado un acuerdo ampliado de licencias de fabricación y transmisión eléctrica en China. Los ingresos de la realeza Steady fluyen a Tokio mientras que los estándares de producción de Honda se incrustaron en la práctica de fábrica china."
 CHI_foreign.245.t: "Honda entra en la asociación"
 CHI_foreign.246.a: "Note la oportunidad comercial."
 CHI_foreign.246.d: "Nippon Steel ha convenido en suministrar placas de acero de alta dureza y aleaciones especiales a los socios chinos mediante un arreglo conjunto. El acuerdo produce ganancias de exportación premium y vincula la producción de acero armadura china a cadenas de suministro japonesas."
 CHI_foreign.246.t: "Nippon Steel se une a China Operations"
 CHI_foreign.247.a: "Note la oportunidad comercial."
 CHI_foreign.247.d: "Hitachi ha establecido electrónica industrial y operaciones de computación integradas en China bajo el marco de asociación. Los ingresos de exportación son inmediatos; a más largo plazo, Tokio cobra una influencia continua sobre la modernización de la infraestructura china."
 CHI_foreign.247.t: "Hitachi se expande a China"
 CHI_foreign.248.a: "Note la oportunidad comercial."
 CHI_foreign.248.d: "Panasonic ha concertado acuerdos para suministrar tecnología de baterías y electrónica robusta a socios chinos. El acuerdo genera ingresos de exportación fiables, al tiempo que incorpora las normas del componente japonés en las líneas de producción militares y adyacentes chinas."
 CHI_foreign.248.t: "Panasonic entra en la asociación china"
 CHI_foreign.249.a: "Note la oportunidad comercial."
 CHI_foreign.249.d: "JR East ha acordado compartir señalización ferroviaria de alta velocidad e ingeniería de material rodante con socios chinos. Los rendimientos comerciales son claros; el valor estratégico para Tokio radica en la influencia a largo plazo sobre la infraestructura de transporte china."
 CHI_foreign.249.t: "JR Este trae experiencia en el ferrocarril a China"
 CHI_foreign.250.a: "El tiempo la presión."
 CHI_foreign.250.d: "Los medios de comunicación estatales chinos han lanzado una campaña coordinada sobre la conducta en tiempo de guerra de Japón, destacando las visitas oficiales del santuario Yasukuni, revisiones del libro de texto escolar y la masacre de Nanjing. Las manifestaciones antijaponesas se están extendiendo a través de ciudades chinas, y Tokio enfrenta una presión creciente para responder."
 CHI_foreign.250.t: "Beijing reabre la cuestión de la historia"
 CHI_foreign.55.a: "Empuje un marco dirigido por Beijing."
 CHI_foreign.55.b: "Actúa como mediador equilibrado."
 CHI_foreign.55.c: "Diferir a la iniciativa de Seúl."
 CHI_foreign.55.d: "China ha negociado una cumbre diplomática de emergencia en Beijing, con lo que las conversaciones de la península coreana se remontan al borde. Ambos lados llegan bajo presión, y las huelgas de postura China darán forma a la lectura de cada capital del evento."
 CHI_foreign.55.t: "Conferencias de la Cumbre de Beijing"
 CHI_foreign.66.a: "Prepárense para las consecuencias."
 CHI_foreign.66.d: "La operación ha ido catastróficamente mal. Las fuerzas especiales chinas fueron capturadas o asesinadas, y Pyongyang ha anunciado pruebas de la participación de Beijing. La región respira."
 CHI_foreign.66.t: "Operación New Dawn Exposed"
 CHI_foreign.67.a: "Retirada silenciosamente."
 CHI_foreign.67.d: "La operación no logró sus objetivos, pero los servicios de seguridad de Pyongyang han atribuido el incidente a disidentes nacionales. El papel de Beijing sigue sin confirmarse, por ahora."
 CHI_foreign.67.t: "Raid Fails, Passed Off como el levantamiento interno"
 CHI_foreign.68.a: "Mira cómo se desarrolla la situación."
 CHI_foreign.68.d: "La operación ha desencadenado combates abiertos en la capital. Unidades Loyal KPA y facciones disidentes disputan el control de Pyongyang como lo ve el mundo exterior."
 CHI_foreign.68.t: "Pyongyang in Flames"
 CHI_foreign.69.a: "Consolidar las ganancias."
 CHI_foreign.69.d: "La operación tuvo éxito. Un liderazgo pro-Beijing ha consolidado el control sobre Corea del Norte. El equilibrio de poder en la península ha cambiado."
 CHI_foreign.69.t: "Un nuevo amanecer en Pyongyang"
 CHI_military_event.1.a: "Venta al valor de mercado completo"
 CHI_military_event.1.b: "Recompensar a los oficiales que cumplen"
 CHI_military_event.1.d: "En diciembre de 1998, la orden de sustitución de Jiang Zemin había colocado a miles de empresas administradas por el PLA bajo valoración y transferencia civil. Las armas de propiedad, los conglomerados comerciales y las plantas farmacéuticas fueron evaluadas y firmadas, despojando al ejército de un imperio construido a lo largo de décadas. Los términos de la entrega siguen siendo negociados."
 CHI_military_event.1.t: "La maniobra de Vanke"
 CHI_military_event.10.a: "Entrega el archivo a los inspectores de disciplina"
 CHI_military_event.10.b: "Bury la investigación"
 CHI_military_event.10.d: "Los investigadores de la Comisión Central para la Inspección de Disciplina han allanado el hogar de un teniente general crecido rico en las aventuras del ejército. Al igual que con Gu Junshan en 2012, desechan cajas de efectivo, casos de Maotai y un busto de oro de Mao. Las redes sobre él están mirando para ver si Beijing se atreve a tirar del hilo, o si el archivo desaparece como muchos antes de él."
 CHI_military_event.10.t: "La fortuna de un general se desenterró"
 CHI_military_event.2.a: "Cosecha el sector comercial"
 CHI_military_event.2.b: "Diríjalo desde arriba"
 CHI_military_event.2.d: "Elevado a una estrategia nacional en 2017, Military-Civil Fusion derriba el muro separando las bases industriales civiles y de defensa de China. Universidades, empresas estatales y empresas de tecnología privada están dirigidas a compartir investigación, capacidad de fabricación y cadenas de suministro con el PLA, reorientando toda la economía hacia la producción de doble uso bajo supervisión de la Comisión Militar Central."
 CHI_military_event.2.t: "La fusión militar-civil declarada"
 CHI_military_event.4.a: "Chase el mercado de armas"
 CHI_military_event.4.b: "Comprar acceso político en el extranjero"
 CHI_military_event.4.d: "Poly Technologies, la subsidiaria de exportación de armas del PLA General Staff, canaliza fusiles chinos, misiles anti-viaje y sistemas balísticos de corto alcance en África, Oriente Medio y América Latina. Poly Culture, its civilian front, launders proceeds through Hong Kong subasta houses and overseas real estate. Los ingresos se remontan a los militares a través de compañías de conchas que nunca aparecen en ningún presupuesto oficial."
 CHI_military_event.4.t: "Politecnologías Goes Global"
 CHI_military_event.5.a: "Entrega unos pocos chivos expiatorios"
 CHI_military_event.5.b: "Cerrar rangos y desafiar a los auditores"
 CHI_military_event.5.d: "La campaña anticorrupción lanzada por Xi Jinping en 2012 ha llegado al Departamento General de Logística. Xu Caihou y Guo Boxiong, los dos ex vicepresidentes del CMC que dirigieron el sistema de promoción por correo en todo el cuerpo de oficiales, enfrentan acusaciones. La camarilla debe decidir si entregar los chivos expiatorios y comprar la sala de respiración o las filas cercanas y atreverse a Beijing a seguir adelante."
 CHI_military_event.5.t: "El Reckoning"
 CHI_military_event.6.a: "Prometa lealtad al Sueño de China"
 CHI_military_event.6.b: "Mantenga el privilegio silencioso"
 CHI_military_event.6.d: "Con Xu Caihou muerto de cáncer antes del juicio y Guo Boxiong despojado de rango, la red sobreviviente acepta los nuevos términos. Profesiones de lealtad al sueño chino de Xi, un puñado de oficiales de nivel medio entregados para mostrar, y un acuerdo silencioso: cierres abiertos de saqueo, pero las redes que controlan los contratos logísticos, las ofertas de construcción y la adquisición de armas sobreviven en forma más discreta."
 CHI_military_event.6.t: "Arco al Sueño de China"
 CHI_political_events.1.a: "Coordinar una respuesta nacional."
 CHI_political_events.1.d: "Un nuevo coronavirus se ha extendido de la provincia de Guangdong a Hong Kong, Vietnam, Canadá y Singapur. La OMS ha emitido una alerta mundial sobre salud. Los hospitales de Guangzhou y Beijing están abrumados y el miedo público se está propagando más rápido que la enfermedad misma."
 CHI_political_events.1.t: "SARS Epidemic"
 CHI_political_events.2.a: "Despliegue todos los recursos disponibles."
 CHI_political_events.2.d: "Un terremoto de magnitud 7.9 ha golpeado la provincia de Sichuan, con el epicentro cerca del condado de Wenchuan. Más de 69.000 personas morirán y 18.000 siguen desaparecidos. Las ciudades enteras han sido destruidas por el choque inicial y los deslizamientos secundarios."
 CHI_political_events.2.t: "El terremoto de Wenchuan"
 CHI_political_events.3.a: "Que empiecen los Juegos."
 CHI_political_events.3.d: "Los Juegos Olímpicos de Beijing 2008 abren hoy. Después de años de preparación y un esfuerzo de construcción sin precedentes, China da la bienvenida a los atletas del mundo al Estadio Nacional. La ceremonia de apertura atrae a un público global de cientos de millones, mostrando el ascenso de China en la etapa mundial."
 CHI_political_events.3.t: "Los Juegos de la XXIX Olympiad"
 CHI_political_events.4.a: "Acelerar el desarrollo tecnológico"
 CHI_political_events.4.b: "Fortalecer la cohesión social"
 CHI_political_events.4.c: "Construir fuerzas militares"
 CHI_political_events.4.d: "Concluyó el XIX Congreso del Partido, el Congreso establece sus prioridades para los dos hitos centenarios: una sociedad moderadamente próspera para 2021 y una nación socialista plenamente desarrollada para 2049. Los recursos del estado deben ser dirigidos. ¿Dónde concentrará el Partido su energía?"
 CHI_political_events.4.t: "Los dos objetivos centenarios"
 CHI_political_events.5.a: "Elevar a un candidato Tuanpai"
 CHI_political_events.5.b: "Elevar a un candidato de Princeling"
 CHI_political_events.5.c: "Toma la decisión en manos de Xi"
 CHI_political_events.5.d: "La cuestión de la sucesión ya no es académica. Xi Jinping tiene un poder consolidado, pero el Partido requiere continuidad institucional. El Comité Permanente de Politburo espera dirección. Una elección ahora dará forma a la próxima generación de liderazgo chino."
 CHI_political_events.5.t: "Designando un Sucesor"
 CHI_political_events.50.a: "Comience la planificación para una China más vieja."
 CHI_political_events.50.d: "La población en edad de trabajar de China, unos 940 millones fuertes en su pico, ha comenzado su larga contracción. El excedente de trabajo que generó tres décadas de crecimiento de dos dígitos ya no está creciendo. Los economistas señalan que el cambio es estructural, no cíclico: sin intervención política, los suelos de fábrica y los sitios de construcción competirán por un reducido grupo de trabajadores durante el resto del siglo."
 CHI_political_events.50.t: "El Dividendo Demográfico Fades"
 CHI_political_events.51.a: "Enfrente a la cuenta."
 CHI_political_events.51.d: "El sexto censo nacional de población de 2010 confirma lo que los demógrafos han advertido desde hace mucho tiempo: la proporción de la población mayor de 60 años ha subido al 13,3%, y la edad media sigue aumentando. La estructura familiar 4-2-1, un niño que tiene la responsabilidad de dos padres y cuatro abuelos, es ahora la norma estadística en toda China urbana. La disminución de la población ya no es una proyección distante."
 CHI_political_events.51.t: "Revelaciones del censo Acelerando el envejecimiento"
 CHI_political_events.52.a: "Una base de referencia más dura pero más honesta."
 CHI_political_events.52.d: "Después de años de tensión económica y ajuste de políticas, China ha alcanzado un nuevo equilibrio demográfico. La fuerza de trabajo es más pequeña y mayor, las pensiones son más costosas y la fertilidad sigue siendo inferior a la sustitución, pero el choque agudo de la transición ha pasado. El país que surgió de esta década está disciplinado por la necesidad: finanzas públicas magras, mayor automatización y un estado de bienestar calibrado para una sociedad que envejeció antes de enriquecerse."
 CHI_political_events.52.t: "La crisis de la sociedad gris subside"
 CHI_political_events.6.a: "Honorable nuestro héroe nacional"
 CHI_political_events.6.b: "Proseguir un arreglo diplomático"
 CHI_political_events.6.d: "El 1 de abril de 2001 un avión de inteligencia de la Marina estadounidense EP-3 marcó con un interceptor del PLAAF J-8 cerca de la isla de Hainan. La tripulación estadounidense ha hecho un aterrizaje de emergencia en suelo chino. Beijing debe decidir cómo manejar el enfrentamiento."
 CHI_political_events.6.t: "El stand de Hainan"
 CHI_political_events.7.a: "El sector estaba subdesarrollado -- la represión golpeó duramente."
 CHI_political_events.7.b: "El sector absorbe la represión con desintegración pero no colapsa."
 CHI_political_events.7.c: "La escala del sector amortigua el impacto."
 CHI_political_events.7.d: "El discurso de Jack Ma en octubre de 2020 en la Cumbre Bund comparando bancos chinos con peones establece una cadena de acciones regulatorias. El CSRC y SAMR suspenden la IPO del Grupo Ant dos días antes de su lanzamiento $34 billones. Los investigadores antimonopolios abren un procedimiento contra Alibaba. The Cyberspace Administration lanza una revisión de seguridad nacional de Didi dos días después de su debut en NYSE. El sector tecnológico se enfrenta a una reestructuración fundamental de su relación con el Estado."
 CHI_political_events.7.e: "El sector es lo suficientemente maduro para convertir la regulación en estabilidad estructural."
 CHI_political_events.7.t: "Mano dura contra las grandes tecnológicas"
 CHI_political_events.8.a: "Continuar financiando el sector informático"
 CHI_political_events.8.d: "Siguiendo la directiva estratégica para invitar a la nación mediante la ciencia y la tecnología, las instituciones respaldadas por el Estado están acelerando las inversiones en informática de próxima generación e infraestructura de Internet. De los laboratorios universitarios a las zonas económicas especiales, la fundación digital de China está siendo establecida durante las décadas venideras."
 CHI_political_events.8.t: "La innovación a través de la ciencia y la tecnología"
 CHI_sco.1.a: "Damos la bienvenida a su interés."
 CHI_sco.1.b: "No podemos conceder esta condición."
 CHI_sco.1.d: "[FROM.GetNameWithFlag] ha presentado una solicitud oficial para la condición de observador en la Organización de Cooperación de Shanghai. Debemos decidir si aceptar su solicitud."
 CHI_sco.1.t: "Solicitud de observador SCO"
 CHI_sco.10.a: "Estamos con China."
 CHI_sco.10.b: "No estaremos obligados por las ambiciones de China."
 CHI_sco.10.c: "Mantenerse neutral."
 CHI_sco.10.d: "China ha exigido que declaremos nuestra lealtad exclusiva a su facción dentro de la SCO, forzando una elección entre Beijing y Moscú."
 CHI_sco.10.t: "China exige su lealtad"
 CHI_sco.11.a: "Estamos agradecidos por el apoyo."
 CHI_sco.11.d: "[FROM.GetNameWithFlag] está prestando asistencia para el desarrollo en apoyo de nuestra modernización económica como parte de los marcos de cooperación de la OCS."
 CHI_sco.11.t: "Asistencia para el desarrollo de la OCS"
 CHI_sco.2.a: "Se han demostrado dignos de ser miembros completos."
 CHI_sco.2.b: "No podemos apoyar esta aplicación."
 CHI_sco.2.d: "[FROM.GetNameWithFlag] ha presentado una solicitud formal para ser miembro de pleno derecho en la Organización de Cooperación de Shanghai."
 CHI_sco.2.t: "SCO Solicitud de membresía"
 CHI_sco.20.a: "Invertir el capital político para restaurar la confianza."
 CHI_sco.20.b: "Tenemos preocupaciones más urgentes."
 CHI_sco.20.d: "La cohesión interna dentro de la Organización de Cooperación de Shanghai se ha reducido a niveles. Varios estados miembros han expresado dudas sobre la dirección de la organización y sin intervención, la cooperación puede empeorar aún más."
 CHI_sco.20.t: "Miembros Pregunta Dirección SCO"
 CHI_sco.21.a: "Este es nuestro momento."
 CHI_sco.21.d: "La Organización de Cooperación de Shanghai está prosperando. Los Estados Miembros informan de niveles sin precedentes de cooperación, los proyectos conjuntos están dando resultados, y la posición internacional de la organización nunca ha sido más fuerte."
 CHI_sco.21.t: "Una Edad Dorada de Cooperación"
 CHI_sco.22.a: "Presiona nuestra ventaja."
 CHI_sco.22.b: "Deberíamos aliviar las tensiones."
 CHI_sco.22.d: "Nuestro creciente dominio dentro de la Organización de Cooperación de Shanghai no ha pasado desapercibido. El papel disminuido de Rusia es una fuente de creciente fricción, y Moscú ha comenzado a hacer su disgusto conocido por los canales diplomáticos."
 CHI_sco.22.t: "Rusia Sidelined in the SCO"
 CHI_sco.23.a: "Debemos reafirmarnos."
 CHI_sco.23.b: "Quizás esto sea lo mejor."
 CHI_sco.23.d: "La influencia de Rusia dentro del SCO ha crecido hasta el punto en que se cuestiona nuestra propia posición de liderazgo. Moscú está estableciendo cada vez más la agenda, y sin acción, corremos el riesgo de ser relegados a un papel de apoyo en nuestra propia organización."
 CHI_sco.23.t: "China Pérdida Iniciativa"
 CHI_sco.3.a: "Nuestras tropas recibirán la oportunidad de entrenar junto a sus fuerzas."
 CHI_sco.3.b: "La cooperación con [FROM.GetName] no es factible en este momento."
 CHI_sco.3.d: "[FROM.GetNameWithFlag] ha propuesto realizar ejercicios militares conjuntos en el marco de la OCS. Esto fortalecería la cooperación en materia de seguridad entre nuestras fuerzas armadas."
 CHI_sco.3.t: "Invitación a los ejercicios militares conjuntos"
 CHI_sco.30.a: "Aprobar el proyecto."
 CHI_sco.30.b: "Este no es el momento adecuado."
 CHI_sco.30.d: "[FROM.GetNameWithFlag] ha propuesto la construcción de una red integrada de energía que abarca el SCO. Como miembro líder, debemos decidir si aprobar este ambicioso proyecto de infraestructura."
 CHI_sco.30.t: "Proposición de la red de energía SCO"
 CHI_sco.31.a: "Aprobar el proyecto."
 CHI_sco.31.b: "No podemos comprometernos con esto."
 CHI_sco.31.d: "[FROM.GetNameWithFlag] ha propuesto una red ferroviaria que entorpece continentes para conectar las economías de la OCS. Esto requeriría una inversión importante, pero podría transformar el comercio en toda la organización."
 CHI_sco.31.t: "Propuesta de ferrocarril trans-eurasia"
 CHI_sco.32.a: "Aprobar la creación del banco."
 CHI_sco.32.b: "Las condiciones no son favorables."
 CHI_sco.32.d: "[FROM.GetNameWithFlag] ha propuesto establecer un banco de desarrollo multilateral en el marco de la OCS. Esta institución financiaría la infraestructura y el desarrollo en todos los estados miembros."
 CHI_sco.32.t: "Propuesta del Banco de Desarrollo de la OCE"
 CHI_sco.33.a: "Aprobar la red."
 CHI_sco.33.b: "Tenemos reservas sobre esto."
 CHI_sco.33.d: "[FROM.GetNameWithFlag] ha propuesto una red integrada de defensa aérea que abarca a los Estados miembros de la SCO. La cobertura de radar compartida y la defensa coordinada de misiles fortalecerían la seguridad colectiva."
 CHI_sco.33.t: "Propuesta conjunta de Defensa Aérea SCO"
 CHI_sco.34.a: "Estamos orgullosos de ser un miembro fundador."
 CHI_sco.34.d: "Beijing ha formalizado la transformación prolongada de los Cinco de Shanghai en un órgano intergubernamental completo. La Organización de Cooperación de Shanghai propuesta profundizaría nuestros vínculos políticos, de seguridad y económicos con China y nuestros vecinos regionales, con nosotros como miembro fundador del primer día."
 CHI_sco.34.t: "China Propone la Organización de Cooperación de Shanghai"
 CHI_sco.4.a: "Que empiecen los ejercicios."
 CHI_sco.4.d: "[FROM.GetNameWithFlag] ha aceptado nuestra invitación para ejercicios militares conjuntos."
 CHI_sco.4.t: "Ejercicios conjuntos aceptados"
 CHI_sco.5.a: "Su pérdida."
 CHI_sco.5.d: "[FROM.GetNameWithFlag] ha rechazado nuestra invitación a ejercicios militares conjuntos."
 CHI_sco.5.t: "Ejercicios conjuntos Rechazados"
 CHI_sco.6.a: "Estos ejercicios parecen sospechosamente como preparativos para la guerra."
 CHI_sco.6.b: "Sólo los terroristas y extremistas tienen algo que temer de estos ejercicios."
 CHI_sco.6.c: "Un desarrollo interesante para monitorear."
 CHI_sco.6.d: "La Organización de Cooperación de Shanghai ha iniciado un ejercicio militar a gran escala en el que participan las fuerzas armadas de sus Estados miembros."
 CHI_sco.6.t: "SCO lanza ejercicios militares de gran escala"
 CHI_sco.7.a: "La esfera de influencia china sigue expandiéndose."
 CHI_sco.7.b: "Un buen día para la diplomacia multilateral."
 CHI_sco.7.d: "[FROM.GetNameWithFlag] ha sido admitido oficialmente como miembro pleno de la Organización de Cooperación de Shanghai."
 CHI_sco.7.t: "[FROM.GetNameWithFlag] Se une a la SCO"
 CHI_sco.8.a: "La agresión china ha alienado a otro socio."
 CHI_sco.8.b: "Un lamentable revés para la cooperación internacional."
 CHI_sco.8.d: "[FROM.GetNameWithFlag] ha anunciado su retirada de la Organización de Cooperación de Shanghai, citando diferencias irreconciliables."
 CHI_sco.8.t: "[FROM.GetNameWithFlag] Retirada de la SCO"
 CHI_sco.9.a: "China no está dispuesta a compartir el foco de atención."
 CHI_sco.9.d: "China se ha movido decididamente a afirmar su dominio sobre la Organización de Cooperación de Shangai, apartando Rusia y estableciendose como el poder líder incuestionable del bloque."
 CHI_sco.9.t: "China consolida el control sobre la SCO"
 CHI_semiconductor_events.1.d: "Los Estados Unidos han ampliado los controles de exportación para cubrir el equipo semiconductor avanzado, el software EDA y componentes de memoria de alta ancho de banda. Los gobiernos aliados de Europa, Japón y Corea del Sur han coordinado licencias de exportación para reforzar los controles. El embargo tecnológico refleja la determinación de Washington de evitar que China cierre la brecha en la lógica avanzada y la producción de memoria."
 CHI_semiconductor_events.1.o1: "Presionaremos hacia adelante, independientemente."
 CHI_semiconductor_events.1.t: "Boicot semiconductor occidental"
 CHI_semiconductor_events.2.a: "Mostrar el logro"
 CHI_semiconductor_events.2.b: "Mantenlo tranquilo, capacidad de almacenamiento"
 CHI_semiconductor_events.2.d: "Huawei ha lanzado el Mate 60 Pro impulsado por un sistema interno Kirin 9000S a chip. El análisis teardown confirma que SMIC fabricó el SoC en su proceso N+2 de 7nm-equivalente. El avance reescribe las suposiciones públicas sobre hasta qué punto los controles de exportación nos han devuelto."
 CHI_semiconductor_events.2.t: "El Mate 60 Sorpresa"
 CHI_semiconductor_events.3.a: "Lean on Empyrean"
 CHI_semiconductor_events.3.b: "Endurecimiento y desvío a través de canales grises"
 CHI_semiconductor_events.3.d: "Las enmiendas de la Oficina de Industria y Seguridad de EE.UU. de mayo 2025 nos denominan destino restringido para el uso de herramientas EDA. Sinopía y Cadence presentan las solicitudes de licencias obligatorias requeridas. Las negaciones de licencias seguirán dentro de semanas. El flujo doméstico ahora tiene que llevar cada diseño avanzado a través de cinta adhesiva."
 CHI_semiconductor_events.3.t: "Sinopsias y Cadencia nos cortaron"
 CHI_semiconductor_events.4.a: "Posibilidad de empuje con empresas nacionales de inteligencia artificial"
 CHI_semiconductor_events.4.b: "Exportar HBM a Rusia e Irán"
 CHI_semiconductor_events.4.d: "La planta Hefei de ChangXin Memory Technologies comenzó a producir pilas HBM2 en masa un año completo por delante de su objetivo declarado públicamente 2026. Las primeras muestras de calificación ya están con Cambricon y Biren. Acelerador interno de IA construye ya no tiene que limpiar un cuello de botella de memoria exterior."
 CHI_semiconductor_events.4.t: "CXMT HBM2 por adelantado"
 CHI_semiconductor_events.5.a: "Facilidad de los controles del chip"
 CHI_semiconductor_events.5.b: "Mantener la línea en los controles de exportación"
 CHI_semiconductor_events.5.d: "China ha vinculado el acceso continuo a sus exportaciones de tierras raras y galio al alivio de los controles de exportación semiconductores. Con imán occidental y cadenas de suministro de substratos de chip dependientes del refinamiento chino, Beijing está apostando por que el apalancamiento funcione en ambos sentidos. La propuesta aterriza en nuestro escritorio como un comercio directo: facilitar el embargo de chips, mantener los minerales críticos fluyendo."
 CHI_semiconductor_events.5.t: "Oferta de Beijing Rare-Earth"
 CHI_semiconductor_events.6.a: "Acelerar la rampa nacional"
 CHI_semiconductor_events.6.d: "Washington ha ampliado silenciosamente las autorizaciones de licencias para el software de herramientas y diseño de ganglios maduros a cambio del suministro garantizado de tierras raras. El reprensión es parcial y reversible, pero compra tiempo a nuestras fundaciones para cerrar las lagunas restantes sin el peso total del embargo."
 CHI_semiconductor_events.6.t: "Controles Relajados"
 CHI_semiconductor_events.7.a: "Absorbe el revés"
 CHI_semiconductor_events.7.d: "Washington ha rechazado la conexión de forma directa, calculando que el procesamiento de chips perdería su punto de ventaja más fuerte. Los controles de exportación se mantienen, y el capital político gastado en la sobreaturación se ha ido. La autosuficiencia sigue siendo el único camino abierto a nosotros."
 CHI_semiconductor_events.7.t: "Charlas Collapse"
 CHI_space_events.1.a: "Los ojos de la nación están sobre nosotros."
 CHI_space_events.1.d: "En Wenchang Space Launch Site, un largo 10 de marzo se eleva en una columna de humo y llamas, llevando el vehículo tripulante Mengzhou y sus tres astronautas hacia la inyección translunar. Cada televisión del país muestra el ascenso. El mundo mira."
 CHI_space_events.1.t: "Marcha larga se levanta hacia la Luna"
 CHI_space_events.10.a: "Financiar la red de satélites y seguimiento en su totalidad"
 CHI_space_events.10.b: "Proceder a un ritmo medido"
 CHI_space_events.10.d: "Con el programa Chang'e comprometido con la superficie lunar, el Consejo Estatal pesa cómo financiar la infraestructura de apoyo. La primera pregunta es la red de satélites y seguimiento: los relés de Queqiao y antenas de espacio profundo que mantienen a una tripulación en contacto entre 380.000 kilómetros. Podemos financiarlo completamente ahora, o extender el costo y proceder a un ritmo medido."
 CHI_space_events.10.t: "Financiación de la carretera a la Luna"
 CHI_space_events.11.a: "Acelerar el desarrollo del 10 de marzo"
 CHI_space_events.11.b: "Sujeto al calendario previsto"
 CHI_space_events.11.d: "Ninguna misión lunar tripulada es posible sin un cohete elevador pesado. El 10 de marzo largo está diseñado para lanzar el vehículo del equipo Mengzhou y el lander Lanyue hacia la Luna en vuelos separados. Acelerar su desarrollo es caro, pero cada mes ahorrado trae el aterrizaje más cerca."
 CHI_space_events.11.t: "La cuestión de la carga"
 CHI_space_events.12.a: "Confía en los ingenieros"
 CHI_space_events.12.d: "El camino medido mantiene el programa asequible y políticamente seguro. Los ingenieros de la Academia China de Tecnología del Vehículo Lanzamiento trabajan a través de la campaña de calificación a un ritmo sostenible, confiando en que la paciencia será recompensada en el pad."
 CHI_space_events.12.t: "Una Cadencia Firme"
 CHI_space_events.13.a: "Reemplazar las recompensas"
 CHI_space_events.13.d: "Las decisiones de financiación de los últimos años dan fruto. Los platos de rastreo vienen en línea, los motores pasan sus tiros de calificación, y la arquitectura lunar toma forma. Los dividendos de la previsión están ahora listos para ser dibujados."
 CHI_space_events.13.t: "Las inversiones maduran"
 CHI_space_events.2.a: "Un gran salto para el pueblo chino."
 CHI_space_events.2.d: "El lander Lanyue se encuentra en la región polar lunar del sur. El comandante de la misión abre la escotilla y baja la escalera. Sus primeras palabras, transmiten en directo a miles de millones de oyentes: hemos llegado y permaneceremos. China ha llegado a la Luna."
 CHI_space_events.2.t: "Los astronautas ponen el pie en la luna"
 CHI_space_events.20.a: "Un triunfo de la nación"
 CHI_space_events.20.b: "Un triunfo de nuestra industria"
 CHI_space_events.20.c: "Un triunfo de nuestra ciencia"
 CHI_space_events.20.d: "Los astronautas han caminado sobre la Luna y regresado. Una nación que una vez importado sus cohetes ha plantado su bandera en otro mundo. Ahora el liderazgo debe decidir qué significado perdurable tendrá el logro: prestigio nacional, poder industrial, ambición científica o confianza marcial. El dividendo de la Luna formará las décadas venideras."
 CHI_space_events.20.e: "Un triunfo de nuestra determinación"
 CHI_space_events.20.t: "El legado del aterrizaje de la luna"
 chi_uighur.1.a: "Disperse con la policía antidisturbios"
 chi_uighur.1.b: "Enviar funcionarios del Partido a negociar"
 chi_uighur.1.c: "Detenciones masivas, culpan a los agitadores extranjeros"
 chi_uighur.1.d: "Los manifestantes han salido a las calles de Urumqi tras un incidente entre los residentes de Han y los trabajadores de Uyghur. La policía de Riot ha acordonado los distritos centrales, pero las multitudes están creciendo. El comité del Partido en Xinjiang está esperando instrucciones de Beijing."
 chi_uighur.1.t: "Calle Protestas en Urumqi"
 chi_uighur.2.a: "Ampliar el estado de vigilancia"
 chi_uighur.2.b: "Promoción de la comunidad y ayuda económica"
 chi_uighur.2.c: "Ejecuciones públicas de los autores"
 chi_uighur.2.d: "Un ataque bomba coordinado contra un distrito de mercado ocupado ha dejado bajas y ha roto cualquier sentido de normalidad en la ciudad. El Movimiento Islámico del Turquestán Oriental ha asumido la responsabilidad. Las fuerzas de seguridad están en alta alerta y Beijing exige una respuesta rápida."
 chi_uighur.2.t: "Bomba de ataque Strikes Urumqi Market"
 chi_uighur.3.a: "Imposible ley marcial en Urumqi"
 chi_uighur.3.b: "Detenciones masivas, campamentos de «reeducación»"
 chi_uighur.3.c: "Negociar con líderes comunitarios Uyghur"
 chi_uighur.3.d: "Las tensiones que han estado construyendo durante meses se han convertido en violencia abierta a través de Urumqi y varios distritos salientes. Los enfrentamientos entre manifestantes Uyghur y residentes de Han han abrumado a la policía local. La magnitud de los disturbios, que recuerdan a los disturbios de 2009, exige una decisión inmediata del centro del Partido."
 chi_uighur.3.t: "Erupciones de Xinjiang en grandes escalas"
 chi_uighur.4.a: "Rechazar toda interferencia en nuestros asuntos internos"
 chi_uighur.4.b: "Permitir una visita limitada de investigación de las Naciones Unidas"
 chi_uighur.4.d: "Los informes sobre detenciones masivas y el establecimiento de centros de reeducación en Xinjiang han provocado una pronunciada condena por parte de los gobiernos occidentales, Turquía y órganos internacionales de derechos humanos. Los llamamientos a una investigación independiente están creciendo, y varias capitales amenazan las medidas punitivas."
 chi_uighur.4.t: "International Community Condens Beijing"
 chi_uighur.5.a: "Operación silenciosa, completa perturbación"
 chi_uighur.5.d: "Los servicios de seguridad han identificado y localizado con éxito ataques militantes de planificación celular a través de Xinjiang. Actuando en inteligencia precisa, una operación silenciosa ha interrumpido la red antes de que pudiera atacar."
 chi_uighur.5.t: "Inteligencia contra el Terrorismo Ruptura"
 chi_uighur.6.a: "Una respuesta firme restaurará el orden"
 chi_uighur.6.b: "El puño de hierro de Beijing"
 chi_uighur.6.d: "El malestar violento se ha roto en la región de Xinjiang de China. Las imágenes de vehículos ardiendo y las fuerzas de seguridad en equipo antidisturbios están circulando internacionalmente. Beijing ha declarado que el orden será restaurado, pero la magnitud de las perturbaciones saca escrutinio de los gobiernos y observadores de todo el mundo."
 chi_uighur.6.t: "Riots Rock Xinjiang"
 china_national_committee.02.a: "Seleccione los comités"
 china_national_committee.02.d: "El Congreso Nacional del Partido Comunista de China se ha reunido. Los delegados de todo el país se han reunido para determinar la dirección política durante los próximos cinco años. Los comités más importantes y su liderazgo serán seleccionados ahora."
 china_national_committee.02.t: "Congreso Nacional convocado"
 china_news.44.a: "Un fin a setenta años de división."
 china_news.44.d: "Tras un ultimátum conjunto sinoamericano, el gobierno norcoreano ha disuelto y transferido pacíficamente la soberanía a la República de Corea. La península es otra vez, bajo la bandera de Seúl. La dinastía Kim ha terminado sin una guerra."
 china_news.44.t: "La península coreana reunificada bajo Seúl"
 china_news.45.a: "La guerra coreana final comienza."
 china_news.45.d: "Después del rechazo de Pyongyang al ultimátum conjunto Sinoamericano, China, Estados Unidos y Corea del Sur han declarado la guerra contra Corea del Norte. Por primera vez en la historia, Beijing y Washington marchan juntos contra el régimen de Kim."
 china_news.45.t: "Declarado en Corea del Norte"
 china_news.boycott_streets.a: "Toma nota."
 china_news.boycott_streets.d: "Las protestas antijaponesas se han propagado de las redes sociales a las calles. Las concesiones están cerradas, Uniqlo almacena sus ventanas y los inventarios de Toyota no se venden. El gobierno no ha intervenido."
 china_news.boycott_streets.t: "Boicot esparce a través de las ciudades chinas"
 china_news.panda_arrives_tokyo.a: "Toma nota."
 china_news.panda_arrives_tokyo.d: "Dos pandas gigantes, un regalo de la República Popular China, han llegado al aeropuerto de Narita a escenas de considerable entusiasmo público. El gesto es un cortocircuito diplomático para una temporada más calurosa en las relaciones sino-japonés."
 china_news.panda_arrives_tokyo.t: "Pandas Land en Narita"
 china_news.yasukuni_recall.a: "Toma nota."
 china_news.yasukuni_recall.d: "China ha recordado a su embajador de Tokio tras la visita del Primer Ministro japonés al Santuario de Yasukuni. La protesta diplomática indica la decisión de Beijing de exigir a Japón que rinda cuentas por su muerte."
 china_news.yasukuni_recall.t: "Beijing recuerda a su Embajador"
 china_sar.034.a: "Ordene una represión de seguridad inmediata."
 china_sar.034.b: "Investiga primero y compromete a los líderes locales."
 china_sar.034.d: "Un ataque coordinado ha alcanzado un puesto de control de seguridad en la cuenca del Tarim, dejando bajas entre la policía y los civiles. Beijing debe elegir entre un cierre inmediato de seguridad y una respuesta investigativa más lenta en la región restante."
 china_sar.034.t: "Ataque en Xinjiang"
 china_scs.10.a: "Tenga en cuenta la escalada."
 china_scs.10.d: "Los informes de inteligencia describen un despliegue coordinado chino de flotas pesqueras, milicias marítimas, cortadores de guardacostas y fragatas en anillos concéntricos alrededor de las características disputadas del Mar de China Meridional. La doctrina, atribuida al Almirante Rear Zhang Zhaozhong, no deja lugar para el desafío legal en el momento en que el cerramiento está completo. Nuestras reivindicaciones e intereses en la región están ahora bajo presión directa."
 china_scs.10.t: "Beijing adopta la Estrategia de Cabbage"
 china_scs.12.a: "Aceptar el resultado."
 china_scs.12.d: "La operación de despegue ha llegado a su conclusión. El resultado determina el control práctico de la característica y los costos diplomáticos que China debe absorber."
 china_scs.12.t: "Standoff concluyó"
 china_scs.13.a: "Inicie FONOPs inmediatamente."
 china_scs.13.b: "Restricción del ejercicio por ahora."
 china_scs.13.d: "El Departamento de Estado ha emitido un démarche formal y el Pentágono está sopesando opciones. Las operaciones de libertad de navegación a través de las zonas de doce millas náuticas de las islas artificiales son la respuesta inmediata más probable. La Séptima Flota está alerta."
 china_scs.13.t: "Washington responde a la invasión china"
 china_scs.14.a: "Párate. No interfieras."
 china_scs.14.b: "Sombra la nave y protesta."
 china_scs.14.c: "Interceptar y emitir advertencia final."
 china_scs.14.d: "Un buque de la Armada estadounidense ha entrado en la zona de doce millas náuticas alrededor de una de las instalaciones de la isla artificial china. La Flota del Mar Sur está a la espera de órdenes. De pie se leerá como aquiescencia; sombra mantiene presencia sin escalada; la intercepción activa arriesga un incidente serio."
 china_scs.14.t: "Respuesta de PLAN a FONOP"
 china_scs.15.a: "Presentar una protesta formal y exigir compensación."
 china_scs.15.b: "Convocar una sesión del Consejo de Seguridad de emergencia."
 china_scs.15.d: "Una operación de libertad de navegación ha terminado en una colisión o confrontación en el mar. Ambas partes están emitiendo cuentas de lo ocurrido. Los medios internacionales exigen una investigación completa; los públicos nacionales de ambas partes están pidiendo una respuesta firme."
 china_scs.15.t: "Incidente del Mar Sur"
 china_scs.20.a: "El cielo sobre el Mar del Sur es chino."
 china_scs.20.d: "Beijing ha anunciado el establecimiento de una zona de identificación de la defensa aérea que abarca el Mar del Sur de China. Todos los aviones que entran en la zona deben transmitir identificación, mantener contacto con radio y cumplir las instrucciones del control de tráfico aéreo chino. Los Estados Unidos, el Japón, Australia y Filipinas han declarado inmediatamente que el ADIZ es ilegal en virtud del derecho internacional."
 china_scs.20.t: "South China sea ADIZ declaró"
 china_scs.21.a: "Emitir una alerta severa por canales diplomáticos."
 china_scs.21.b: "Escoltalos y libera una declaración."
 china_scs.21.d: "Los interceptores del PLAAF se han puesto en contacto con un avión militar extranjero que transita por la zona de patrulla del Mar de China Meridional sin cumplir los procedimientos de identificación chinos. La aeronave ha sido escoltada o desafiada; la forma en que Beijing responde al incidente da forma tanto a la credibilidad de la zona de patrulla como a la temperatura de las relaciones con el estado natal del avión."
 china_scs.21.t: "Aviones extranjeros interceptados"
 china_scs.30.a: "Participar con el nuevo marco."
 china_scs.30.d: "Beijing ha anunciado que su compromiso con el Mar de China Meridional se llevará a cabo en el espíritu de las flotas de tesoros de la dinastía Ming: por medio del comercio, la asociación y el diálogo bilateral en lugar de la confrontación. El marco de la Ruta Marítima de la Seda se extiende formalmente a todos los estados literarios. La apertura de la escalación es real, incluso si las reclamaciones subyacentes no han cambiado."
 china_scs.30.t: "Beijing persigue la diplomacia marítima"
 china_scs.31.a: "Un paso constructivo hacia adelante."
 china_scs.31.d: "En una declaración conjunta emitida tras las conversaciones bilaterales celebradas en Beijing, China y sus vecinos del Mar de China Meridional han reafirmado su compromiso con la Declaración de 2002 sobre la conducta de las Partes. En la declaración se pide que las controversias se gestionen pacíficamente mediante consultas bilaterales y se renueva la promesa contra las provocaciones unilaterales, una formulación que Beijing interpreta para excluir su propia presencia existente."
 china_scs.31.t: "2002 Declaration Reaffirmed"
 china_scs.32.a: "Bienvenida Manila a la nueva asociación."
 china_scs.32.b: "Mantener la alineación de los Estados Unidos existentes."
 china_scs.32.d: "El presidente Duterte ha pronunciado un discurso en Beijing anunciando la «separación» de Filipinas desde Estados Unidos y señalando la apertura a una nueva relación con China. La declaración ha aturdido a Washington y deleitado Beijing. La posición de Manila sobre el laudo arbitral del Mar de China Meridional es ahora deliberadamente ambigua."
 china_scs.32.t: "Manila en una encrucijada"
 china_scs.33.a: "Un paso hacia la estabilidad regional."
 china_scs.33.d: "People's Daily informa que China y su socio han concertado un acuerdo conjunto de desarrollo marítimo, estableciendo un marco administrativo compartido para la exploración de hidrocarburos y los derechos de pesca. El acuerdo se describe como «un modelo de cooperación ganadora y la Ruta Marítima de la Seda en acción». Los gobiernos reclamantes no son parte en el declive del acuerdo para comentar."
 china_scs.33.t: "Acuerdo Conjunto de Desarrollo Marítimo firmado"
 china_scs.34.a: "Ofrezca un período de gracia y renegociado."
 china_scs.34.b: "Fortalezca los términos originales."
 china_scs.34.c: "Cancela la deuda a cambio de concesiones."
 china_scs.34.d: "El gobierno del estado asociado ha anunciado que no puede cumplir con el pago de préstamo programado en la financiación de infraestructura china Franja y la Ruta. Los políticos de la oposición nacional exigen renegociar los términos; Beijing se enfrenta a una opción entre la flexibilidad que preserva la relación y la firmeza que preserva el precedente financiero."
 china_scs.34.t: "Debt Renegotiation Demandado"
 china_scs.35.a: "Un triunfo diplomático."
 china_scs.35.d: "Por primera vez, el comunicado de la cumbre de la ASEAN ha incluido un lenguaje que respalda explícitamente la gestión bilateral de las disputas del Mar de China Meridional y rechaza la participación de «partidos externos». La formulación se insertó en la insistencia china y bloqueó el paso del idioma exigido por Vietnam y Filipinas. Washington ha condenado el resultado."
 china_scs.35.t: "La Cumbre de la ASEAN hace suyo la posición china"
 china_scs.36.a: "Renegociar los términos."
 china_scs.36.b: "Fortalezca los términos originales."
 china_scs.36.c: "Retirar el préstamo."
 china_scs.36.d: "Las figuras de la oposición nacional y los grupos de la sociedad civil en el estado asociado han lanzado una campaña pública contra el préstamo chino Franja y la Ruta, citando términos de interés desfavorables, preocupaciones ambientales y miedos a la dependencia estratégica. El gobierno está bajo presión para renegociar; Beijing debe elegir entre proteger el precedente financiero y preservar la relación política."
 china_scs.36.t: "Contra la deuda"
 china_scs.40.a: "Empuje para la plena aceptación del borrador chino."
 china_scs.40.b: "Aceptar un compromiso para que el acuerdo sea firmado."
 china_scs.40.d: "Las negociaciones sobre el Código de Conducta para el Mar del Sur de China han entrado en su ronda final. El proyecto chino excluye la resolución obligatoria de controversias, limita el alcance geográfico para excluir las zonas de construcción activa china y impide que los Estados no ASEAN desempeñen funciones de supervisión. Los estados reclamantes se dividen entre aceptar un acuerdo defectuoso y continuar indefinidamente sin uno."
 china_scs.40.t: "Código de Conducta Negociaciones: Ronda Final"
 china_scs.41.a: "La región ha hablado."
 china_scs.41.d: "El Departamento de Estado ha emitido una declaración en la que se reconoce la entrada en vigor del Código de Conducta de la ASEAN y China sobre el Mar de China Meridional. En la declaración se señalan las objeciones de los Estados Unidos a varias disposiciones, pero se reconoce que el acuerdo es el marco rector para la región. Los analistas lo describen como un retiro significativo de la insistencia de Estados Unidos en la Convención sobre el Derecho del Mar como único marco."
 china_scs.41.t: "Washington reconoce el Código de Conducta"
 china_scs.50.a: "Prepare una respuesta."
 china_scs.50.d: "Un editorial People's Daily, distribuido a través de canales diplomáticos con aparente aprobación estatal, invoca la doctrina clásica de los Cuatro Mares (Junto, Sihai) y enmarca las reivindicaciones marítimas chinas como la restauración de un orden natural interrumpido. El anuncio de expansión naval acompañante no deja duda alguna sobre la intención de Beijing. El orden marítimo posterior a 1945 en el Pacífico occidental está ahora abiertamente impugnado."
 china_scs.50.t: "Beijing confirma el mandato de los mares"
 china_scs.51.a: "Se señalan sus protestas."
 china_scs.51.b: "Ofrezca una declaración de aclaración para reducir la alarma."
 china_scs.51.d: "La invocación formal de China del sistema tributario ha producido reacciones agudamente divergentes. Los ministros de Relaciones Exteriores de la ASEAN emitieron una declaración conjunta de emergencia en que rechazaba toda reclamación por suficiencia histórica. Los Estados Unidos, el Japón y Australia anunciaron una respuesta diplomática coordinada. En China, los medios de comunicación estatales cubrieron las reacciones como confirmación de que la restauración de la dignidad nacional disipa a quienes se beneficiaron del siglo de la humillación."
 china_scs.51.t: "El mundo reacciona a la retórica tributaria"
 china_scs.52.a: "Reconocimiento de la autoridad china."
 china_scs.52.b: "Rechazar el ultimátum."
 china_scs.52.d: "El embajador chino ha entregado un ultimátum formal que exige el reconocimiento de la autoridad administrativa china sobre las aguas del Mar de China Sur disputadas dentro de setenta y dos horas. El gobierno debe decidir: aceptar los términos y preservar la relación, o rechazar y aceptar las consecuencias."
 china_scs.52.t: "Ultimátum entregado"
 china_scs.53.a: "Emitir un ultimátum conjunto."
 china_scs.53.b: "Sólo protesta diplomática."
 china_scs.53.c: "No te metas en esto."
 china_scs.53.d: "Beijing ha emitido un ultimátum a un reclamante del Mar de China Meridional que se ha negado a cumplir. Washington se enfrenta a una elección: cumplir con sus compromisos de seguridad al unirse a un ultimátum conjunto contra China, limitarse a una protesta formal que preserve la relación, o mantenerse fuera por completo. La decisión se refiere a la preparación naval, la credibilidad de la alianza y cuánto capital político está dispuesto a gastar en una disputa en aguas a cuatro mil kilómetros de distancia."
 china_scs.53.t: "Crisis en el Mar del Sur de China"
 china_scs.54.a: "Cumplir y retirar."
 china_scs.54.b: "Rechazar. No dictarán a China."
 china_scs.54.d: "Los Estados Unidos se han sumado al reclamante en la presentación de Beijing con una demanda formal de retirar sus fuerzas de la característica impugnada y poner fin al ultimátum. La Séptima Flota está a la mayor disposición. Cumplimiento significa retiro; rechazo significa enfrentar el peso naval combinado de los Estados Unidos y sus socios regionales. Se ha convocado al Comité Permanente de Politburo."
 china_scs.54.t: "Ultimatum de Washington"
 china_scs.55.a: "Puede que permanezca así."
 china_scs.55.d: "Los despaches de instalaciones PLAN en el Mar del Sur de China reportan atmósferas variadas a través de la flota. En Fiery Cross Reef, los marineros fotografían el amanecer sobre las aguas sus cartas ahora marcan como hogar. En el portaaviones, la tripulación se prepara para ejercicios. En la estación de guardia costera de Scarborough, un oficial de vigilancia observa que ningún buque extranjero se ha acercado a la línea de exclusión en noventa días. El Mar del Sur está tranquilo."
 china_scs.55.t: "Voces de la Flota del Mar Sur"
 china_scs.56.a: "El Mar del Sur debe estar asegurado."
 china_scs.56.d: "Después de que el reclamante rechazó el ultimátum de Pekín, los grupos superficiales del PLAN se han movido para ejecutarlo. Ha comenzado un breve y agudo compromiso naval sobre la característica disputada de Spratly. Ambas partes sólo están cometiendo fuerzas limitadas; el resultado determinará el control del estado y si el reclamante recurre a Washington para su intervención."
 china_scs.56.t: "La escaramuza de Spratly"
 china_scs.57.a: "Acepta la derrota y busca términos."
 china_scs.57.b: "Llamamiento a los Estados Unidos."
 china_scs.57.d: "El compromiso fronterizo ha terminado en la derrota. La característica impugnada está ahora bajo control chino y sus fuerzas se han retirado. El gobierno debe decidir si aceptar la pérdida y preservar lo que sigue siendo la soberanía, o pedir apoyo a los Estados Unidos, una opción que corre el riesgo de convertir a Washington en un enfrentamiento que no puede acoger."
 china_scs.57.t: "Llamamiento a los aliados americanos"
 china_scs.58.a: "Retirada y reevaluada."
 china_scs.58.d: "Las unidades de la Armada del PLA contrataron a las fuerzas del reclamante sobre la característica impugnada y se retiraron sin asegurar la posición. La escaramuza era limitada y contenida, pero la narración diplomática es una de las sobre-reach chinas y el déficit militar. Beijing debe absorber el costo político mientras continúa la postura estratégica más amplia."
 china_scs.58.t: "Esquímico Retrocede en los Spratlys"
 china_scs.60.a: "Tenga en cuenta la nueva alineación."
 china_scs.60.d: "Con la agresión china en el Mar del Sur de China superando un umbral que la región ya no puede absorber diplomáticamente, los Estados Unidos, Japón, India y Australia han formalizado su cooperación en materia de seguridad en una alineación cuádruple funcional. Se anuncian patrullas navales conjuntas, intercambio de información y posiciones diplomáticas coordinadas. La formación es una respuesta directa a la postura de Beijing y señala que el concurso para el Mar del Sur de China ha adquirido una dimensión de gran potencia."
 china_scs.60.t: "La iniciativa cuadrilateral"
 china_scs.70.a: "Discúlpese tranquilamente y retirarse."
 china_scs.70.b: "Mantenganse firmes. Las aguas están dentro de los derechos históricos de China."
 china_scs.70.d: "Se han detectado buques de milicias marítimas chinas que operan dentro de la zona económica exclusiva de Natuna de Indonesia, acompañados por escoltas de guardacostas. Yakarta ha presentado una protesta formal, recordando a su embajador y desplegando buques navales para sombrar la artesanía china. Indonesia no impugna públicamente la línea de nueve días, pero la intrusión pone a prueba los límites de su paciencia estratégica y los riesgos que ponen al Estado más grande de la ASEAN en una confrontación abierta con Beijing."
 china_scs.70.t: "Natuna Incident"
 sino_indian.1.d_opt: "No podemos intervenir en este momento."
 sino_indian.20.a: "Un esfuerzo de coalición defensiva. Protegemos la región."
 sino_indian.20.b: "Una expedición punitiva. Swift, decisivo, brutal."
 sino_indian.20.c: "La guerra total de la coalición. Terminamos esto permanentemente."
 sino_indian.20.d: "Está en vigor el marco de coalición contra las facciones talibanes y TTP en los territorios fronterizos afgano-pakistani. Los comandantes esperan una dirección política sobre la naturaleza de la operación. La elección formará cómo la región y el mundo más amplio perciben el papel de China en Asia Central."
 sino_indian.20.t: "Operación Tigre de Montaña: Define el Misión"
 sino_indian.21.a: "Aceptar. Iniciar el diálogo formal."
 sino_indian.21.b: "Reciproca con cautela. Confía pero verifica."
 sino_indian.21.c: "Rechazar. Esto es una pintura."
 sino_indian.21.d: "China ha tomado una serie de pasos para distanciarse de Islamabad y señalar una nueva orientación hacia Nueva Delhi. El gesto llega sin condiciones previas, pero sus implicaciones estratégicas son claras. India debe decidir si participar, y en qué términos."
 sino_indian.21.t: "Beijing extiende una mano inesperada"
 sino_indian.22.a: "Una postura defensiva. Nos provocaron."
 sino_indian.22.b: "Una expedición punitiva. Como en 1962."
 sino_indian.22.c: "Total de pie de guerra. Coloque la línea McMahon para siempre."
 sino_indian.22.d: "Las fuerzas del PLA han contratado unidades indias a lo largo de la Línea de Control Actual. El enfrentamiento es lo suficientemente serio como para exigir una decisión política. Beijing debe definir el carácter político de esta acción militar antes de que se defina."
 sino_indian.22.t: "El Galwan Reckoning"
 sino_indian.30.a: "Excelente."
 sino_indian.30.b: "Un desarrollo interesante."
 sino_indian.30.d: "La mediación entre las facciones talibanes rivales de China ha causado una ruptura inesperada. Un bloque de línea dura ha roto con la dirección principal sobre los términos que se proponen, denunciando públicamente el proceso. La división debilita la cohesión talibán y crea una apertura para la coalición."
 sino_indian.30.t: "Datos de los talibanes se dividen en negociaciones"
 sino_indian.31.a: "Esperábamos tanto."
 sino_indian.31.d: "La declaración de Beijing sobre una guerra total de coalición en Asia Central ha suscitado preocupación en Ankara y Teherán. Ambas capitales ven la movilización como proyección del alcance militar chino en una región que consideran su propia periferia estratégica."
 sino_indian.31.t: "Coalición War Footing Alarms Regional Powers"
 sino_indian.32.a: "Acepta el pacto. Necesitamos protección."
 sino_indian.32.b: "Rechazar. Retenemos nuestra autonomía estratégica."
 sino_indian.32.d: "A raíz de la ofensiva china a lo largo del frente Himalaya, Washington se ha acercado a Nueva Delhi con una oferta formal de un pacto bilateral de defensa. Los planificadores estadounidenses ven a la India como un contrapeso crítico para el poder chino. Para la India, la aceptación significaría garantías de seguridad pero también una alineación más profunda con los Estados Unidos."
 sino_indian.32.t: "Washington ofrece un pacto de defensa"
 sino_indian.33.a: "Brace para la presión china"
 sino_indian.33.d: "El renovado compromiso de China en el sur de Asia representa un desafío directo a la esfera tradicional de influencia de la India. Nueva Delhi debe preparar su respuesta."
 sino_indian.33.t: "Pivots de Beijing al sur de Asia"
 sino_indian.34.a: "Toma los rifles y las órdenes"
 sino_indian.34.b: "Rechazar a ser el proxy de Beijing"
 sino_indian.34.d: "China está ofreciendo al Partido Comunista Unificado de Nepal armas, entrenamiento y apoyo político para presionar su insurgencia contra Katmandú. La aceptación une el movimiento al patrocinio de Beijing, una deuda que será llamada si la bandera roja alguna vez vuela sobre Singha Durbar."
 sino_indian.34.t: "Beijing extiende una mano a los maoístas"
 sino_indian.35.a: "Aceptar el marco"
 sino_indian.35.b: "Declin por ahora"
 sino_indian.35.d: "Beijing ha llegado a Katmandú con una oferta de cooperación económica e infraestructura, enmarcada alrededor del respeto mutuo por la condición neutral de Nepal."
 sino_indian.35.t: "China Propone un marco de cooperación"
 sino_indian.36.a: "Aceptar la asociación"
 sino_indian.36.b: "Rechazo político"
 sino_indian.36.d: "China ha propuesto una alianza estratégica formal con Bangladesh, respaldada por una garantía de seguridad y vínculos comerciales ampliados. Dhaka debe pesar los beneficios contra la reacción probable de Nueva Delhi."
 sino_indian.36.t: "Beijing ofrece a Dhaka una asociación estratégica"
 sino_indian.37.a: "Aceptamos este gesto"
 sino_indian.37.d: "En un inesperado gesto diplomático, China ha renunciado formalmente a sus destacadas reivindicaciones territoriales en la frontera norte de Bhután. Thimphu da la bienvenida al anuncio."
 sino_indian.37.t: "Beijing retira sus reclamaciones sobre Bhután"
 sino_indian.38.a: "Abrace la asociación"
 sino_indian.38.b: "Necesitamos nuestro propio espacio"
 sino_indian.38.d: "China ha ofrecido a Pakistán una declaración de asociación permanente - el vínculo Iron Brothers - cementando su alianza de todo el mundo al más alto nivel político."
 sino_indian.38.t: "Beijing propone un Pacto de Hermanos de Hierro"
 sino_indian.39.a: "Enfoque en guerra terrestre"
 sino_indian.39.b: "Enfoque sobre el poder aéreo"
 sino_indian.39.c: "Enfoque sobre la capacidad naval"
 sino_indian.39.d: "La industria de defensa de China está lista para transferir conocimientos a Pakistán. Islamabad debe decidir qué campo se beneficia más de la colaboración."
 sino_indian.39.d_opt: "Enfoque sobre tecnología nuclear"
 sino_indian.39.t: "Proyectos militares conjuntos: Elija un Enfoque"
 sino_indian.40.a: "Designar formalmente al ETIM como organización terrorista"
 sino_indian.40.b: "Rechazar la solicitud"
 sino_indian.40.d: "China ha pedido oficialmente que el Pakistán designe al Movimiento Islámico del Turquestán Oriental como organización terrorista. Islamabad debe pesar los beneficios de la lucha contra el terrorismo contra las sensibilidades políticas internas."
 sino_indian.40.t: "Beijing pide ETIM Terrorist Designation"
 sino_indian.41.a: "Bienvenido a la inversión"
 sino_indian.41.d: "Beijing ha confirmado el lanzamiento del programa completo de Corredor Económico China-Pakistán. La inversión masiva de infraestructura va a remodelar las redes de transporte y energía de Pakistán."
 sino_indian.41.t: "El Corredor Económico China-Pakistán comienza"
 sino_indian.42.a: "Acogemos con beneplácito la asociación"
 sino_indian.42.d: "Beijing ha propuesto ampliar las instalaciones de atraque del puerto Gwadar para albergar buques navales chinos. Islamabad ganará nueva capacidad astillera a cambio."
 sino_indian.42.t: "China Oye Gwadar como un centro naval"
 sino_indian.43.a: "Únete al mecanismo"
 sino_indian.43.d: "China ha invitado al Pakistán a unirse al Mecanismo de Cooperación y Coordinación Cuadrilaterales, un marco conjunto de lucha contra el terrorismo que vincula Beijing, Kabul, Islamabad y Dushanbe."
 sino_indian.43.t: "El QCCM: se invita a Islamabad a unirse"
 sino_indian.44.a: "Únete al mecanismo"
 sino_indian.44.d: "China ha invitado al Afganistán a unirse al Mecanismo de Cooperación y Coordinación Cuadrilateral, un marco conjunto de lucha contra el terrorismo que vincula a Beijing, Kabul, Islamabad y Dushanbe."
 sino_indian.44.t: "QCCM: Kabul Invited to Join"
 sino_indian.45.a: "Únete al mecanismo"
 sino_indian.45.d: "China ha invitado a Tayikistán a unirse al Mecanismo de Cooperación y Coordinación Cuadrilaterales, un marco conjunto de lucha contra el terrorismo que vincula a Beijing, Kabul, Islamabad y Dushanbe."
 sino_indian.45.t: "El QCCM: Dushanbe Invitado a unirse"
 sino_indian.46.a: "Luchar junto a China"
 sino_indian.46.b: "Esta es la guerra de China para luchar"
 sino_indian.46.d: "Beijing ha pedido que el Pakistán se una a una campaña militar combinada contra los talibanes y el TTP. Un esfuerzo conjunto sería mucho más decisivo, pero también un compromiso mucho mayor."
 sino_indian.46.t: "China Propone operaciones conjuntas en el Afganistán"
 sino_indian.47.a: "Coordenada en seguridad fronteriza"
 sino_indian.47.d: "Beijing ha establecido una zona conjunta de coordinación fronteriza y lucha contra el terrorismo en el Corredor de Wakhan. Todos los estados asociados se beneficiarán de un mejor intercambio de información."
 sino_indian.47.t: "China lanza la Iniciativa Wakhan Buffer"
 sino_indian.48.a: "Reconocer el gesto"
 sino_indian.48.b: "Seguimos escépticos"
 sino_indian.48.d: "La decisión de China de distanciarse de Islamabad no ha pasado desapercibida en Nueva Delhi. Si esto indica un realineamiento genuino o una maniobra temporal sigue siendo una pregunta abierta."
 sino_indian.48.t: "India Pesa el Cambio de Pekín en Pakistán"
 sino_indian.49.a: "Registrar una protesta formal"
 sino_indian.49.b: "Aceptar la nueva realidad regional"
 sino_indian.49.d: "El Tratado de Amistad Sino-India ha enviado ondas de choque a través de Washington. Ya se está debatiendo si representa un nuevo orden estable o una amenaza a los intereses estadounidenses en la región al más alto nivel."
 sino_indian.49.t: "Washington reacciona al Tratado Sino-Indiano"
 sino_indian.50.a: "Presentar a la autoridad china"
 sino_indian.50.b: "Bhután nunca presentará"
 sino_indian.50.d: "China ha presentado a Bhután una elección muy marcada: sumisión formal a la autoridad de Beijing, o enfrentar las consecuencias de la fuerza militar. Thimphu tiene poco espacio para maniobrar."
 sino_indian.50.t: "Beijing emite un Ultimatum a Thimphu"
 sino_indian.51.a: "Aceptar los términos"
 sino_indian.51.b: "Nepal se resistirá"
 sino_indian.51.d: "China ha exigido que Nepal acepte un estatus formal como Estado asociado bajo la autoridad de Beijing. Kathmandu debe decidir si cumplir o resistir."
 sino_indian.51.t: "Beijing presenta un Ultimatum a Katmandú"
 sino_indian.52.a: "Aceptar la asociación"
 sino_indian.52.b: "Rechazar la solicitud"
 sino_indian.52.d: "China ha solicitado formalmente acceso logístico y basado en nuestros puertos bajo la llamada estrategia String of Pearls. A cambio, Beijing ofrece un conjunto sustancial de asociaciones económicas."
 sino_indian.52.t: "Beijing pide derechos de base naval"
 sino_indian.53.a: "Aceptar el abrazo de Beijing"
 sino_indian.53.b: "La revolución no responde a ningún maestro extranjero"
 sino_indian.53.d: "La República Popular de Nepal triunfa en Katmandú, pero los rifles que ganaron la revolución fueron estampados Norinco. Beijing espera ahora que el nuevo estado tome su lugar dentro de la esfera china como un estado asociado. El refusal no será recibido cortésmente."
 sino_indian.53.t: "El proyecto de ley de Beijing llega a su debido"
 sino_indian.54.a: "Una excelente asociación"
 sino_indian.54.d: "Pakistán ha aceptado nuestra oferta de investigación militar conjunta y ha seleccionado su área de enfoque. Nuestras industrias de defensa coordinarán ahora el desarrollo sobre la especialización acordada, y nuestros investigadores están a punto de ganar de la asociación."
 sino_indian.54.t: "Islamabad se une a los programas militares conjuntos"
 sino_indian.55.a: "Una posición en el Mar Arábigo"
 sino_indian.55.d: "Islamabad ha acogido oficialmente a nuestras fuerzas navales en el puerto de Gwadar. Las instalaciones de atraque expandidas y el acuerdo de bastión nos dan un punto de mira estratégico en el Mar Arábigo, anclando nuestra presencia a lo largo del Océano Índico occidental."
 sino_indian.55.t: "Gwadar se abre a la Armada del Ejército Popular de Liberación"
 CHI_advanced_node_chips_trait: "Avanzado-Nodo Chips"
 CHI_advanced_node_chips_trait_desc: "El proceso 7nm-equivalente de SMIC alimenta los sistemas de mando y control del CETC con procesadores nacionales. Elimina el cuello de botella exterior para la electrónica de procesamiento de señales."
 CHI_hbm_compute_trait: "Computación de orientación basada en la confianza"
 CHI_hbm_compute_trait_desc: "Las pilas CXMT HBM2 soportan la fusión de sensores avanzados y la clasificación de objetivos en sistemas de interceptor CASIC y defensa del aire. La oferta nacional termina con la dependencia de memoria extranjera."
 CHI_imfm_jsw_partnership: "Japón siderúrgico trabaja en asociación"
 CHI_imfm_jsw_partnership_desc: "Esta asociación transfiere los procesos de fabricación de forja de gran diámetro de Japón Steel Works y acero de alta dureza, mejorando directamente la calidad de producción de material estructural de la fábrica."
 CHI_imfm_komatsu_partnership: "Komatsu asociación"
 CHI_imfm_komatsu_partnership_desc: "La cooperación con Komatsu Defense introduce métodos modulares de construcción de armadura ligera y prácticas de integración de sistemas vehiculares desarrolladas para los programas autodefensos del Japón."
 CHI_imfm_mhi_partnership: "Asociación de industrias pesadas Mitsubishi"
 CHI_imfm_mhi_partnership_desc: "Un acuerdo de fabricación autorizado con Mitsubishi Heavy Industries importa metodología avanzada de diseño de armaduras y técnicas de protección compuesta en el programa de vehículos de la fábrica."
 CHI_indigenous_euv_trait: "Integración indígena EUV"
 CHI_indigenous_euv_trait_cetc: "Integración indígena EUV"
 CHI_indigenous_euv_trait_cetc_desc: "La litografía de SiCarrier-pattern produce la próxima generación de procesadores CETC CNC, sensores ASIC y electrónica de radar. Costo por gotas de wafer a medida que la cadena de herramientas doméstica madura."
 CHI_indigenous_euv_trait_desc: "La litografía de SiCarrier-pattern produce chips de grado espacial y de grado de misiles dentro del programa CASC. Suministro interno final a fin para sistemas estratégicos."
 CHI_kirin_avionics_trait: "Integración Kirin Avionics"
 CHI_kirin_avionics_trait_desc: "HiSilicon Kirin-derived SoCs power AVIC flight computers, mission systems, and electronic war suites. Sustitución nacional después de la designación de entidad-lista 2019."
 CHI_norinco_howa_partnership: "Qué asociación de maquinaria"
 CHI_norinco_howa_partnership_desc: "Esta asociación autoriza los procesos de mecanizado de armas pequeñas de precisión de Howa Machinery, elevando tolerancias a la producción y consistencia de calidad en las líneas de armamento de infantería de NORINCO."
 CHI_norinco_nec_partnership: "Asociación NEC"
 CHI_norinco_nec_partnership_desc: "La cooperación con NEC Corporation integra los estándares de electrónica japonesa C4ISR y la ingeniería de sistemas integrados en las comunicaciones de campo de batalla y líneas de productos sensor de NORINCO."
 CHI_norinco_subaru_partnership: "Asociación Subaru"
 CHI_norinco_subaru_partnership_desc: "Un arreglo de transferencia tecnológica con Subaru Aerospace aporta técnicas de metalurgia de precisión y conocimientos de diseño estructural rotatorio a las líneas de producción de NORINCO."
 CHI_norinco_toshiba_partnership: "Asociación Toshiba"
 CHI_norinco_toshiba_partnership_desc: "Un arreglo de licencias con Toshiba Defense Systems introduce técnicas avanzadas de diseño de matriz de radar y fabricación de componentes de guerra electrónica en la división electrónica de NORINCO."
