 china_sar.048.t: "Hong Kong se disuelve."
 china_sar.048.d: "El Consejo Legislativo ha votado para poner fin a la Región Administrativa Especial y colocar a Hong Kong bajo administración central directa. La sinicización ha seguido su curso completo: el gobierno local pide ahora a Beijing que complete la entrega por adelantado, y no queda ninguna circunscripción en el territorio dispuesto a argumentar lo contrario."
