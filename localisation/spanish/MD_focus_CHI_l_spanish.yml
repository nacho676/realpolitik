 BRI_apply_named_RAIL_desc: "Petición de Beijing para construir el §Y[THIS.GetBRINextProjectRAIL]§!. La aplicación cuesta 30 Poder político. Con la aprobación, pagamos §Y40§! de nuestro tesorería o recibimos un préstamo chino. Requiere una frontera china o una asociación activa de BRI y paz."
 BRI_apply_named_PIPELINE: "Aplique: §Y[THIS.GetBRINextProjectPIPELINE]§!"
 BRI_apply_named_PIPELINE_desc: "Petición de Beijing para construir el §Y[THIS.GetBRINextProjectPIPELINE]§!. La solicitud cuesta 35 Poder político. Con la aprobación, pagamos §Y40§! de nuestro tesorería o recibimos un préstamo chino. Requiere depósitos de petróleo, acero o metales preciosos y paz."
 BRI_apply_named_TELECOM: "Aplique: §Y[THIS.GetBRINextProjectTELECOM]§!"
 BRI_apply_named_TELECOM_desc: "Petición de Beijing para construir el §Y[THIS.GetBRINextProjectTELECOM]§!. La solicitud cuesta 25 Poder político. Con la aprobación, pagamos §Y40§! de nuestro tesorería o recibimos un préstamo chino. Requiere paz. Los estados alineados con el oeste dibujan escrutinio."
