 CHI_semiconductor_backwardness_1: "Dependencia Tecnológica"
 CHI_semiconductor_backwardness_1_desc: "La industria semiconductora de China sigue dependiendo estructuralmente de fundiciones extranjeras, software de diseño y equipos de fabricación. Las fabs domésticas operan de dos a tres generaciones detrás de la frontera, las casas de diseño carecen de herramientas EDA maduras y ninguna empresa de equipos domésticos puede suministrar litografía avanzada. La brecha aumenta la producción nacional de planta de chips y fundición, y limita tanto la electrónica civil como la cadena de suministro militar electrónico. El progreso a través de la rama de la industria semiconductora erosiona esta dependencia paso a paso."
