 CHI_SAR_MIO_share_tt: "Todos los estados de títeres del SAR tienen acceso a las organizaciones militares-industriales chinas."
 CHI_tai_pressure_economic_tt: "China aprovecha las dependencias comerciales para presionar a Washington para reducir el apoyo a Taiwán. Los Estados Unidos deben decidir cómo responder."
 CHI_tai_pressure_diplomatic_tt: "China abre canales diplomáticos medidos para persuadir a Washington a distanciarse de Taiwán."
 CHI_pressure_derecognize_TAI_tt: "China aplica presión económica y diplomática. Si el objetivo no retira el reconocimiento de Taiwán dentro del plazo, China impondrá un embargo comercial."
 TAI_reduced_us_support: "Disminuyó el apoyo militar estadounidense"
 TAI_reduced_us_support_desc: "Tras la presión china sobre Washington, los Estados Unidos han reducido las entregas de armas y la cooperación militar con Taiwán. Las fuerzas armadas enfrentan una reducción de la preparación y una menor moral entre las unidades dependientes del equipo y la doctrina estadounidenses."
 TAI_isolated_from_us: "Abandonado por Washington"
 TAI_isolated_from_us_desc: "Los Estados Unidos han retirado oficialmente el apoyo militar y diplomático a Taiwán bajo presión china sostenida. Las fuerzas armadas quedan sin su principal garante de seguridad, socavando gravemente la capacidad de defensa y la confianza civil."
 CHI_TAI_shared_modifier: "Relaciones transversales"
 CHI_TAI_shared_modifier_desc: "Un índice dinámico de interdependencia económica y política en todo el Estrecho de Taiwán. Los vínculos más estrechos aumentan Estabilidad y la deriva democrática, al tiempo que mejoran las relaciones comerciales, la eficiencia de fábrica, la velocidad de investigación y la producción de construcción; el estrado alimenta la deriva comunista, la presión política interna y la capacidad de redada naval."
 CHI_SAR_network_modifier: "Un sistema de China"
 CHI_SAR_network_modifier_desc: ""
 CHI_TAI_air_dominance: "Aire Dominance over the Strait"
 CHI_TAI_air_dominance_desc: "Las operaciones de la Fuerza Aérea del PLA sobre el Estrecho de Taiwán han establecido una presión aérea persistente en las defensas de Taiwán, degradando su capacidad para impugnar el control del espacio aéreo."
 CHI_TAI_naval_modernization_idea: "Modernización naval"
 CHI_TAI_naval_modernization_idea_desc: "El programa acelerado de adquisición del PLA Navy ha entregado una flota moderna capaz de operar sostenidamente en el Estrecho de Taiwán."
 TAI_blockade_economic_crisis: "Bloqueada crisis económica"
 TAI_blockade_economic_crisis_desc: "El bloqueo naval chino ha roto las rutas comerciales marítimas de Taiwán, causando una grave escasez de combustible, materias primas y bienes de consumo. La producción industrial se ha derrumbado."
 TAI_self_sufficiency: "Medidas de autosuficiencia"
 TAI_self_sufficiency_desc: "Se han comenzado a adoptar medidas de emergencia para fomentar la capacidad nacional de producción y reducir la dependencia de los bienes importados, contrarrestando parcialmente las repercusiones del bloqueo."
 TAI_cyber_sabotage: "Ciber Sabotage"
 TAI_cyber_sabotage_desc: "Una operación cibernética coordinada de China ha interrumpido la infraestructura crítica, las comunicaciones militares y los sistemas financieros en Taiwán."
 TAI_blockade_partial: "Disrupción marítima"
 TAI_blockade_partial_desc: "La zona de seguridad marítima declarada de China está interrumpiendo el envío comercial y impulsando costos de seguro para buques destinados a los puertos de Taiwán."
 TAI_emergency_situation: "Estado de excepción"
 TAI_emergency_situation_desc: "Taiwán ha declarado un estado de emergencia en respuesta al bloqueo chino. Se ha ampliado el reclutamiento y se han puesto en marcha medidas de defensa civil, pero el peaje económico es grave."
 CHI_TAI_tourism_ban: "Congelación del turismo cruzado"
 CHI_TAI_tourism_ban_desc: "El PRC ha suspendido el grupo de salida y el turismo individual a Taiwán, cortando los flujos de visitantes que se habían construido desde el viaje cruzado se liberalizó en 2008. En 2019 Beijing prorrogó la prohibición a los permisos de visita individual, poniendo fin a cientos de miles de viajeros anuales. La medida inflige daños directos a los sectores de hospitalidad, retail y servicios de Taiwán al tiempo que señala la voluntad de Beijing de utilizar la interdependencia económica como herramienta coercitiva."
 CHI_crossstrait_operations: "Preparación de operaciones cruzadas"
 CHI_crossstrait_operations_desc: "El PLA ha logrado la plena preparación operacional para operaciones anfibias y aéreas combinadas en todo el Estrecho de Taiwán."
 CHI_TAI_amphibious_mastery: "Doctrina de asalto anfibio"
 CHI_TAI_amphibious_mastery_desc: "Las formaciones del Cuerpo de Marines del PLA han alcanzado un alto nivel de competencia en operaciones anfibias combinadas de armas mediante ejercicios intensivos de capacitación en el Estrecho de Taiwán."
 CHI_TAI_military_buildup_idea: "Refuerzo militar a ambos lados del estrecho"
 CHI_TAI_military_buildup_idea_desc: "El Ejército Popular de Liberación ha concentrado importantes activos terrestres, navales y aéreos a lo largo de la costa de Fujian en preparación para una posible contingencia del Estrecho de Taiwán."
 china_sar.027.t: "La pregunta de Taiwán: La apertura se mueve"
 china_sar.027.d: "El Consejo de Estado ha autorizado una campaña sostenida para erosionar el apoyo estadounidense a Taiwán. Todos los instrumentos disponibles son el apalancamiento económico, el aislamiento diplomático y la señalización militar. La pregunta es cuán difícil de empujar, y qué tan rápido."
 china_sar.027.a: "Aplicar la máxima presión económica. Haremos insoportable el costo de apoyar a Taiwán."
 china_sar.027.b: "Comience con los excesos diplomáticos medidos. La paciencia produce mejores resultados que la confrontación."
 china_sar.028.t: "Washington pesa sus opciones"
 china_sar.028.d: "La campaña de presión de Beijing ha aterrizado en Washington en un momento incómodo. La administración se enfrenta a facciones competidoras: halcones exigiendo una reafirmación firme del compromiso de Taiwán, y los pragmatistas preocupados por las consecuencias económicas de la China antagonizada."
 china_sar.028.a: "Reafirme nuestro compromiso con Taiwán. La presión de China sólo fortalece nuestra determinación."
 china_sar.028.b: "Reconocer las preocupaciones de China. Podemos encontrar una fórmula que reduzca las tensiones sin abandonar Taiwán."
 china_sar.029.t: "Escalada: China eleva las etapas"
 china_sar.029.d: "El rechazo de Washington ha aterrizado mal en Zhongnanhai. El liderazgo está bajo presión para demostrar que el desafío conlleva costos. Dos opciones están sobre la mesa: construir una coalición diplomática contra la política estadounidense de Taiwán, o señalar la resolución militar a través de ejercicios en el estrecho."
 china_sar.029.a: "Construir una coalición internacional. El aislamiento diplomático es más sostenible que el enfrentamiento."
 china_sar.029.b: "Realizar ejercicios del Estrecho de Taiwán. Washington debe entender la dimensión militar de nuestro compromiso."
 china_sar.030.t: "Washington ofrece una concesión parcial"
 china_sar.030.d: "Tras el debate interno, la administración ha señalado la voluntad de reducir, pero no eliminar, las ventas de armas a Taiwán. La oferta está enmarcada como un gesto hacia la estabilidad. Beijing debe decidir si aceptar la ganancia parcial o presionar para el retiro completo."
 china_sar.030.a: "Aceptar la concesión. Una ganancia parcial sigue siendo una ganancia."
 china_sar.030.b: "Rechazar la oferta. La retirada total del apoyo es el único resultado aceptable."
 china_sar.031.t: "América en la encrucijada"
 china_sar.031.d: "La campaña de presión sostenida de China ha forzado una decisión final en Washington. La comunidad de inteligencia advierte que otras concesiones corren el riesgo de incrustar a Beijing en todo el Indo Pacífico. Pero el costo económico de la confrontación también es real. La administración debe elegir."
 china_sar.031.a: "Retirar el apoyo formal para Taiwán. La relación con Beijing es demasiado importante para sacrificar."
 china_sar.031.b: "Reafirmamos nuestro compromiso con Taiwán en su totalidad. No seremos acosados al abandono."
 china_sar.032.t: "Washington Pasos de regreso desde Taiwán"
 china_sar.032.d: "En un cambio silencioso pero trascendental, Estados Unidos ha señalado que ya no proporcionará apoyo militar y diplomático activo para el estado separado de Taiwán. El anuncio se enmarca en lenguaje burocrático, pero su significado estratégico es inconfundible: Taiwán está solo."
 china_sar.032.a: "Un logro histórico. El camino hacia la reunificación está abierto."
 china_sar.033.t: "Washington reafirma su compromiso"
 china_sar.033.d: "Estados Unidos ha rechazado la campaña de presión de China y reafirmó públicamente su compromiso con la seguridad de Taiwán. La administración ha anunciado un nuevo paquete de armas para Taipei y ha convocado consultas de emergencia con Japón y Australia. La campaña de Beijing ha fracasado, y ha endurecido la oposición en Washington."
 china_sar.033.a: "Un revés, pero no una derrota. Reevaluaremos nuestro enfoque."
 china_sar.001.t: "Propuesta: Acuerdo sobre el Comercio de Servicios Transversales"
 china_sar.001.d: "Beijing ha presentado el Acuerdo sobre el Comercio de Servicios Transversales, abriendo los principales sectores de servicios de ambas partes al comercio y la inversión más libre. La propuesta otorgaría a las empresas continentales acceso a los sectores bancario, sanitario y minorista de Taiwán. Los partidarios argumentan que profundizaría la integración económica; los críticos advierten que da ventaja estructural a Beijing sobre la economía de Taiwán."
 china_sar.001.a: "Firme el acuerdo. La integración económica sirve a nuestros intereses a largo plazo."
 china_sar.001.b: "Rechazar el acuerdo. Las concesiones son demasiado profundas y la supervisión es demasiado débil."
 china_sar.002.t: "Redes comerciales Cross-Strait"
 china_sar.002.d: "Las redes empresariales Pro-Beijing se han expandido en los sectores financiero y mediático de Taiwán, respaldadas por capital continental y facilitadas por una serie de acuerdos de inversión opaca. El gobierno debe decidir cómo responder a una creciente influencia que borre la línea entre el comercio y la política."
 china_sar.002.a: "Bienvenido a los intercambios entre bandas. Los lazos económicos son una base para la estabilidad."
 china_sar.002.b: "Monitorear las redes, pero no restringirlas. La reacción excesiva perjudicaría el comercio legítimo."
 china_sar.002.c: "Imposibilidad de la inversión vinculada a las tierras continentales en sectores sensibles."
 china_sar.003.t: "Cuestión del Consenso de 92"
 china_sar.003.d: "China ha propuesto oficialmente la reactivación del Consenso de 1992 como base diplomática para las conversaciones entre los distintos sectores. La fórmula es deliberadamente ambigua: Beijing lo interpreta como un compromiso con el objetivo de la reunificación bajo una China, mientras que el KMT tradicionalmente lo aceptó bajo la fórmula «una China, sus respectivas interpretaciones». El DPP lo ha rechazado desde hace mucho tiempo como una trampa política. Taiwán debe responder."
 china_sar.003.a: "Aceptar la fórmula de consenso. 'Una China, las interpretaciones respectivas' preserva nuestra posición al abrir un camino hacia el diálogo."
 china_sar.003.b: "Reconocer el espíritu del diálogo sin apoyar explícitamente la fórmula. Buscamos la paz, no un compromiso político."
 china_sar.003.c: "Rechazar el consenso. Cualquier fórmula que implique la aceptación de «una China» socava nuestro estatus soberano."
 china_sar.004.t: "Fuerzas pro-independencia ganan en Taiwán"
 china_sar.004.d: "El campo pro-independencia ha asegurado una mayoría en las elecciones de Taiwán. El gobierno entrante ha dejado claro que no aceptará el Consenso de 92 y tiene la intención de trazar un curso más firme sobre el status internacional de Taiwán. Las relaciones transversales entran en un período de enfriamiento."
 china_sar.004.a: "Un retroceso. Reevaluaremos nuestro enfoque de Taipei."
 china_sar.005.t: "Operaciones de Interferencia de Beijing expuestas"
 china_sar.005.d: "La Oficina Nacional de Seguridad de Taiwán ha descubierto evidencias de operaciones vinculadas a PRC para influir en la política nacional, incluyendo la inversión mediática mediante ejes, financiación de figuras políticas pro-ingeniería y cultivo de redes empresariales utilizadas para canalizar mensajes políticos. Los hallazgos han sido filtrados a la prensa y están generando indignación pública."
 china_sar.005.a: "Expelar los agregados culturales implicados y emitir una protesta formal. No toleraremos la manipulación extranjera de nuestra democracia."
 china_sar.006.t: "Taiwán expulsa oficiales chinos"
 china_sar.006.d: "Taipei ha expulsado formalmente varios agregados culturales y comerciales tras la exposición de las operaciones de influencia política de Beijing. El movimiento saca aplausos de los aliados democráticos de Taiwán y una fuerte reprensión pública del Ministerio de Relaciones Exteriores en Beijing."
 china_sar.006.a: "Absorbe el costo diplomático. La exposición de la operación vuelve a poner nuestro trabajo, pero la estrategia más amplia sigue siendo sólida."
 china_sar.035.t: "Extensión cultural de Beijing"
 china_sar.035.d: "China e Inner Mongolia han lanzado una campaña coordinada de influencia cultural dentro de Mongolia, promoviendo el patrimonio común de Mongolia y dirigiendo la opinión pública hacia una integración más estrecha. Beijing enmarca el esfuerzo como intercambio cultural, pero las implicaciones son inequívocamente políticas."
 china_sar.035.a: "No tenemos más opción que reconocer esto."
 china_sar.036.t: "¿Un sindicato con Mongolia Interior?"
 china_sar.036.d: "Una delegación oficial de Beijing y Hohhot ha llegado a Ulaanbaatar con una propuesta formal: Mongolia está invitada a unirse a la República Popular como Región Administrativa Especial bajo un solo país, marco de dos sistemas. La oferta viene con garantías económicas y promesas de autonomía cultural, pero también con el peso completo de la influencia china detrás de ella."
 china_sar.036.a: "Aceptamos la oferta."
 china_sar.036.b: "Mongolia seguirá siendo independiente."
 china_sar.037.t: "Mongolia rechaza la reunificación"
 china_sar.037.d: "Ulaanbaatar ha rechazado oficialmente la propuesta de reunificación. El Gobierno de Mongolia cita la soberanía nacional y la oposición pública, aunque los canales diplomáticos siguen abiertos. Beijing reconoce la decisión, pero deja en claro que la oferta está en pie."
 china_sar.037.a: "Lo intentaremos de nuevo."
 china_sar.007.t: "Peligrosa Enfoque sobre el Estrecho"
 china_sar.007.d: "Un avión de combate del PLA ha llevado a cabo una interceptación agresiva de un avión militar extranjero que opera cerca de la línea mediana del Estrecho de Taiwán. El encuentro, capturado en la cámara de cabina, muestra al piloto chino que pasa a los metros del avión objetivo. Los medios internacionales exigen una respuesta."
 china_sar.007.a: "Negar la implicación y descalificar."
 china_sar.007.b: "Mantener el silencio oficial."
 china_sar.007.c: "Defender públicamente la acción como cumplimiento legal."
 china_sar.008.t: "Collision Naval en el Estrecho de Taiwán"
 china_sar.008.d: "Un destructor de la Armada del PLA y un buque de guerra extranjero han colisionado durante un encuentro cercano en el Estrecho de Taiwán. Ambos buques sufrieron daños. El incidente ha desencadenado una protesta internacional y coloca a Beijing en una posición difícil."
 china_sar.008.a: "Culpa al otro lado por navegación imprudente."
 china_sar.008.b: "No emita ninguna declaración y deje que la historia se desvaneca."
 china_sar.008.c: "Ofrecer disculpas privadas a través de canales traseros."
 china_sar.009.t: "Prueba de cohetes: silencio regional"
 china_sar.009.d: "La prueba de misiles balísticos del PLA Rocket Force sobre el Estrecho de Taiwán ha atraído una respuesta internacional muda. Washington emitió una declaración pro forma de preocupación pero no tomó ninguna medida concreta. La falta de una reacción americana significativa envía una señal poderosa a través de la región."
 china_sar.009.a: "Nuestra resolución habla más alto que su silencio."
 china_sar.010.t: "Prueba de cohetes: American Pushback"
 china_sar.010.d: "La prueba de misiles del PLA Rocket Force cerca de Taiwán ha disparado espectacularmente. Washington ha ordenado a un grupo de ataque portaaviones en el estrecho y anunció un paquete de armas de emergencia para Taipei. La opinión internacional se ha consolidado contra Beijing."
 china_sar.010.a: "Este revés no nos disuaderá."
 china_sar.011.t: "Taiwán está solo"
 china_sar.011.d: "Los aliados diplomáticos formales de Taiwán se han reducido a un puñado de pequeños estados. Sin un reconocimiento internacional significativo, la reivindicación de Taipei a la soberanía descansa en terrenos cada vez más sombríos. El aislamiento es simbólico y práctico."
 china_sar.011.a: "La red se ajusta alrededor de la provincia renegada."
 china_sar.012.t: "Armamentos del Congreso Votar"
 china_sar.012.d: "El Congreso de los Estados Unidos está debatiendo un importante paquete de venta de armas a Taiwán. Nuestra red de lobbys de Washington tiene la oportunidad de influir en el voto, pero la intervención conlleva riesgos si nuestra participación está expuesta."
 china_sar.012.a: "Activar la red del vestíbulo para bloquear la venta."
 china_sar.012.b: "Emitir amenazas económicas a través de canales diplomáticos."
 china_sar.012.c: "Deja que el proceso salga sin interferencias."
 china_sar.013.t: "Consejo de negocios aboga por Detente"
 china_sar.013.d: "El Consejo Empresarial de Estados Unidos-China ha publicado un informe instando a Washington a priorizar la estabilidad comercial sobre los compromisos de seguridad de Taiwán. El informe, configurado por nuestros esfuerzos de participación económica, ha cobrado fuerza en los círculos normativos."
 china_sar.013.a: "Noted."
 china_sar.014.t: "Interferencia electoral Exposed"
 china_sar.014.d: "Las agencias de inteligencia estadounidenses han atribuido públicamente una operación de influencia política a los actores estatales chinos. El escándalo ha provocado indignación bipartidista en el Congreso y una ola de medidas punitivas. Nuestra posición estratégica con Washington ha sufrido un duro golpe."
 china_sar.014.a: "Un cálculo costoso."
 china_sar.015.t: "Reunión de seguridad de emergencia"
 china_sar.015.d: "El ejercicio de simulación de bloqueo de China en el Estrecho de Taiwán ha desencadenado una sesión de emergencia del Consejo Nacional de Seguridad. Los comandantes militares y oficiales del gabinete están debatiendo la respuesta adecuada a la creciente presión de Beijing."
 china_sar.015.a: "Aumentar la preparación militar a lo largo de la costa."
 china_sar.015.b: "Hace un llamamiento a la comunidad internacional para que apoye."
 china_sar.016.t: "Estado de excepción"
 china_sar.016.d: "El bloqueo parcial ha persistido durante dos meses, perturbando el comercio y creando escasez de combustible y materiales críticos. El gobierno enfrenta una presión creciente para declarar un estado formal de emergencia y poner a las fuerzas armadas en alerta completa."
 china_sar.016.a: "Declarar un estado de emergencia."
 china_sar.016.b: "Proseguir una resolución diplomática con Beijing."
 china_sar.017.t: "La cuestión de la capitulación"
 china_sar.017.d: "El bloqueo naval completo ha destrozado nuestra economía y ha cortado nuestras líneas de suministro. Con el apoyo estadounidense efectivamente retirado, las voces dentro del gobierno están levantando silenciosamente la posibilidad de abrir negociaciones con Beijing en sus términos."
 china_sar.017.a: "Nunca nos rendiremos. Pelea."
 china_sar.017.b: "Abrir negociaciones con Beijing."
 china_sar.018.t: "Taiwán abre las negociaciones"
 china_sar.018.d: "Taipei ha enviado una delegación a Beijing con autoridad para examinar las condiciones de reunificación. El bloqueo, el colapso económico y la retirada del apoyo americano han dejado la isla sin alternativa viable. Se está cerrando un capítulo histórico."
 china_sar.018.a: "Aceptar la reunificación de la patria."
 china_sar.019.t: "Crisis del Estrecho de Taiwán"
 china_sar.019.d: "Las tensiones en el Estrecho de Taiwán han alcanzado un umbral crítico. Las fuerzas militares de ambas partes están a la máxima disposición y un solo error puede desencadenar un conflicto abierto. El Comité Permanente de Politburo convoca una sesión de emergencia para decidir el próximo paso."
 china_sar.019.a: "Retrocede del borde. De-escalate."
 china_sar.019.b: "Atravesa. Emitir un guerrillero formal."
 china_sar.020.t: "Ultimatum de Beijing"
 china_sar.020.d: "Beijing ha entregado un ultimátum formal exigiendo la aceptación de la reunificación bajo la República Popular. El incumplimiento dará lugar a una acción militar. El gobierno debe decidir si resistir o negociar."
 china_sar.020.a: "Rechazar el ultimátum. Prepárense para la guerra."
 china_sar.020.b: "Aceptar los términos. La lucha ha terminado."
 china_sar.021.t: "Taiwán rechaza la reunificación"
 china_sar.021.d: "Taipei ha rechazado formalmente nuestro ultimátum. El gobierno de Taiwán ha declarado su intención de resistir cualquier intento de reunificación forzada y está movilizando a sus fuerzas armadas. El camino hacia la solución pacífica está cerrado."
 china_sar.021.a: "Así sea. Prepárense para la guerra."
 china_sar.022.t: "Taiwán acepta la reunificación"
 china_sar.022.d: "Taipei ha aceptado los términos de la reunificación. La República de China será disuelta y su territorio se integrará en la República Popular. Las décadas de división transversal están llegando a su fin."
 china_sar.022.a: "La patria está entera una vez más."
 china_sar.023.t: "Presión diplomática china"
 china_sar.023.d: "Beijing ha emitido una demanda formal de que retiremos nuestro reconocimiento a Taiwán. China ofrece incentivos económicos para el cumplimiento y la amenaza de sanciones por rechazo. Nuestro reconocimiento continuo de Taipei se ha convertido en una posición diplomática costosa."
 china_sar.023.a: "Completo. Retirar el reconocimiento de Taiwán."
 china_sar.023.b: "Rechazar. Estamos de acuerdo con nuestros compromisos."
 china_sar.024.t: "Ejercicio anfibio en el Estrecho"
 china_sar.024.d: "El PLA Marine Corps ha realizado su mayor ejercicio de aterrizaje anfibio en el Estrecho de Taiwán, simulando un asalto a la playa en una costa fortificada. El ejercicio, emitido en los medios de comunicación estatales, envía una señal inconfundible a Taipei y Washington por igual."
 china_sar.024.a: "El mundo ha tomado nota."
 china_sar.025.t: "La libertad de navegación"
 china_sar.025.d: "La Armada de los Estados Unidos ha enviado un buque de guerra a través de nuestra zona de seguridad marítima declarada cerca de Taiwán. El buque está emitiendo su presencia abiertamente, atreviéndose a la Armada del PLA a responder. Nuestras fuerzas están rastreando la nave estadounidense."
 china_sar.025.a: "Permite el paso. Evite una confrontación directa."
 china_sar.025.b: "Sombrar y desafiar a la nave estadounidense."
 china_sar.026.t: "Cambio en el liderazgo de Estados Unidos"
 china_sar.026.d: "Un cambio en la presidencia americana ha alterado el panorama político para nuestra estrategia de Taiwán. La postura de la nueva administración en las relaciones transversales afectará el nivel de apoyo estadounidense a Taipei."
 china_sar.026.a: "Ajusta nuestra estrategia en consecuencia."
 USA_taiwan_defense_category: "Defensa de Taiwán"
 CHI_TAI_amphibious_exercise: "Ejercicio anfibio en el Estrecho"
 CHI_TAI_amphibious_exercise_desc: "Ordenar un ejercicio de desembarco anfibio a gran escala en el Estrecho de Taiwán para demostrar capacidad militar y presionar a Taipéi."
 CHI_TAI_adiz_incursion: "ADIZ Incursion"
 CHI_TAI_adiz_incursion_desc: "Enviar cazas de la Fuerza Aérea del EPL a la zona de identificación de defensa aérea de Taiwán para poner a prueba los tiempos de respuesta y minar la confianza de Taipéi."
 CHI_TAI_rocket_test: "Test de misiles balísticos"
 CHI_TAI_rocket_test_desc: "Realizar una prueba de misil balístico sobre el Estrecho de Taiwán. La respuesta depende del nivel actual de compromiso estadounidense con la defensa de Taiwán."
 CHI_TAI_grey_zone_ops: "Operaciones de la zona gris"
 CHI_TAI_grey_zone_ops_desc: "Realizar provocaciones de bajo nivel, como incursiones de guardacostas, despliegues de flotas pesqueras y sondeos de guerra electrónica cerca de las aguas de Taiwán."
 CHI_TAI_blockade_simulation: "Ejercicio de simulación de bloqueo"
 CHI_TAI_blockade_simulation_desc: "Estira un ejercicio naval a gran escala simulando un bloqueo completo de Taiwán, comprobando la logística y demostrando capacidad para cortar las líneas de suministro de la isla."
 CHI_TAI_cyberattack: "Cyberattack on Taiwan"
 CHI_TAI_cyberattack_desc: "Lanzar una operación cibernética coordinada contra la red eléctrica, los sistemas financieros y las comunicaciones militares de Taiwán."
 CHI_TAI_shadow_carrier: "Seguir al grupo de portaaviones de EE. UU."
 CHI_TAI_shadow_carrier_desc: "Desplegar submarinos y combatientes de superficie para seguir al grupo de ataque de portaaviones estadounidense que opera cerca del Estrecho de Taiwán."
 CHI_TAI_intercept_aircraft: "Interceptar el reconocimiento de EE.UU"
 CHI_TAI_intercept_aircraft_desc: "Hacer despegar cazas para interceptar y seguir de cerca de forma agresiva a las aeronaves de reconocimiento estadounidenses que operan cerca del estrecho."
 CHI_TAI_un_protest: "UN Protesta contra las ventas de armas"
 CHI_TAI_un_protest_desc: "Presentar una protesta formal en las Naciones Unidas contra las ventas de armas estadounidenses a Taiwán, para generar presión internacional sobre Washington."
 CHI_TAI_maritime_zone: "Declarar zona de seguridad marítima"
 CHI_TAI_maritime_zone_desc: "Declarar una zona de seguridad marítima alrededor de los accesos clave a Taiwán, que establezca un pretexto legal para interceptar e inspeccionar el transporte marítimo comercial."
 CHI_TAI_partial_blockade: "Bloqueo naval parcial"
 CHI_TAI_partial_blockade_desc: "Escalar la zona de seguridad marítima a un bloqueo naval parcial, que restrinja los envíos de combustible y materias primas a Taiwán."
 CHI_TAI_full_blockade: "Bloqueo naval completo"
 CHI_TAI_full_blockade_desc: "Imponer un bloqueo naval completo alrededor de Taiwán, que corte todo el comercio marítimo y las líneas de suministro a la isla."
 CHI_TAI_influence_us_election: "Influencia de las elecciones estadounidenses"
 CHI_TAI_influence_us_election_desc: "Desplegar operaciones encubiertas de influencia política en Estados Unidos para impulsar a candidatos afines a la posición de Pekín sobre Taiwán."
 CHI_TAI_support_houthis: "Apoyo a las operaciones de Houthi"
 CHI_TAI_support_houthis_desc: "Proporcionar apoyo material encubierto a las fuerzas hutíes en Yemen, para crear una crisis de seguridad que desvíe recursos militares estadounidenses del Pacífico."
 CHI_TAI_arm_iran: "Armas encubiertas para Irán"
 CHI_TAI_arm_iran_desc: "Canalizar tecnología militar avanzada a Irán a través de intermediarios, aumentando la presión sobre las fuerzas estadounidenses en Oriente Medio."
 CHI_TAI_scs_provocations: "Provocaciones en el Mar de China Meridional"
 CHI_TAI_scs_provocations_desc: "Afirmar la soberanía china sobre las formaciones disputadas del Mar de China Meridional mediante la militarización de islas, el hostigamiento de guardacostas a los demandantes rivales y zonas ampliadas de defensa aérea. Estas acciones obligan a Estados Unidos a desviar activos navales para tranquilizar a los socios de la ASEAN."
 CHI_TAI_nk_provocations: "Alentar las provocaciones norcoreanas"
 CHI_TAI_nk_provocations_desc: "Señalar a Pionyang que se tolerarán las pruebas de misiles y las provocaciones militares en la península de Corea, y obligar a Estados Unidos a redesplegar fuerzas del teatro de Taiwán."
 CHI_TAI_middleeast_diversion: "Compromiso estratégico en Oriente Medio"
 CHI_TAI_middleeast_diversion_desc: "Profundizar las asociaciones militares y económicas en todo Oriente Medio para aumentar la dependencia regional de Pekín y desviar la atención estadounidense del teatro del Indopacífico."
 CHI_TAI_support_russia: "Apoyo a las operaciones rusas"
 CHI_TAI_support_russia_desc: "Proporcionar apoyo económico y logístico a las operaciones militares de Rusia, y prolongar un conflicto que drena la atención y los recursos estadounidenses."
 CHI_TAI_strait_naval_exercise: "Ejercicio naval del Estrecho de Taiwán"
 CHI_TAI_strait_naval_exercise_desc: "Realizar un ejercicio naval a gran escala en el Estrecho de Taiwán, practicando operaciones de asalto anfibio y guerra antiacceso. El ejercicio mejorará la preparación naval pero provocará condena internacional."
 CHI_TAI_fund_us_opposition: "Financiar el cabildeo prochino en EE. UU."
 CHI_TAI_fund_us_opposition_desc: "Canalizar recursos a través de intermediarios para apoyar a grupos políticos, laboratorios de ideas y medios estadounidenses afines a la posición de Pekín sobre Taiwán. Si se descubre, provocaría una fuerte reacción."
 CHI_TAI_exploit_us_commitments: "Aprovechar la sobreextensión militar estadounidense"
 CHI_TAI_exploit_us_commitments_desc: "Mientras los Estados Unidos se dedican a operaciones militares en el extranjero, intensifican la presión diplomática y militar sobre Taiwán. Las fuerzas estadounidenses se estiran delgadas y no pueden reforzar el Pacífico."
 USA_TAI_send_carrier: "Desplegar un portaaviones en el Estrecho de Taiwán"
 USA_TAI_send_carrier_desc: "Ordenar a un grupo de ataque de portaaviones transitar el Estrecho de Taiwán en una demostración de fuerza, que señale el compromiso estadounidense con la estabilidad regional."
 USA_TAI_recon_flight: "Vuelo de reconocimiento sobre el Estrecho"
 USA_TAI_recon_flight_desc: "Enviar aeronaves de vigilancia para monitorear la actividad del EPL en el Estrecho de Taiwán tras las incursiones chinas en la ADIZ."
 USA_TAI_arm_taiwan: "Paquete de armas de emergencia para Taiwán"
 USA_TAI_arm_taiwan_desc: "Aprobar un paquete de venta urgente de armas para las fuerzas armadas de Taiwán en respuesta a los crecientes preparativos de bloqueo de China."
 USA_TAI_fon_operation: "Operación de libertad de navegación"
 USA_TAI_fon_operation_desc: "Enviar un buque de guerra por la zona de seguridad marítima declarada por China para afirmar la libertad de navegación y desafiar las reclamaciones de Pekín."
 USA_TAI_rimpac_exercise: "Ejercicio naval RIMPAC"
 USA_TAI_rimpac_exercise_desc: "Invitar a Taiwán a participar en el ejercicio naval anual Rim of the Pacific, el mayor simulacro internacional de guerra marítima del mundo, y señalar el compromiso estadounidense con los socios regionales."
 CHI_SAR_decisions_category: "Estrategia de China"
 CHI_SAR_decisions_category_desc: "\n£GFX_CHI_commission_2\n\n\n\n§YLa Estrategia Única China§! representa la política de Beijing de consolidar todos los territorios reclamados bajo un solo estado chino. Mediante una combinación de presión política, desarrollo económico y control administrativo, las regiones se alinean gradualmente con el gobierno central.\n\nEste proceso puede seguir diferentes caminos. El aumento §Ysinicization§! fortalece el control directo y la integración, mientras que los arreglos más autónomos priorizan la estabilidad local y el potencial económico a costa de la autoridad central.\n\nEl equilibrio entre estos enfoques determinará la unidad a largo plazo del Estado, mientras que la cuestión de §YTaiwan§! sigue formada por el reconocimiento internacional, el apoyo exterior y las tensiones transversales.\n\n§Y Regiones Administrativas Especiales de China§!\n$HKG_sinicization$\n$MAC_sinicization$\n$TIB_sinicization$\n$ETK_sinicization$\n$OMG_sinicization$\n\n$CHI_TAI_trust_display$\n$CHI_taiwan_us_support_display$\n$CHI_taiwan_strait_tension_display$\n$CHI_taiwan_recognition_count_display$\n$uighur_threat_display$"
 CHI_pressure_derecognize_TAI: "Presionar a [From.GetName] para que retire el reconocimiento de Taiwán"
 CHI_pressure_derecognize_TAI_desc: "Pekín lleva a cabo una campaña diplomática sostenida para reducir el reconocimiento internacional de Taiwán. [From.GetName] mantiene actualmente relaciones formales con Taipéi. Una combinación de incentivos económicos y amenazas de sanciones puede bastar para provocar un cambio de posición."
 CHI_establish_education_centres: "Establecer centros de educación en habilidades vocacionales en Xinjiang"
 CHI_establish_education_centres_desc: ""
 CHI_MON_reunification_retry: "Repetir la oferta de reunificación"
 CHI_MON_reunification_retry_desc: "Mongolia rechazó nuestra propuesta anterior. Podemos volver a acercarnos a Ulán Bator cuando las condiciones diplomáticas hayan tenido tiempo de asentarse."
 CHI_han_settlement_small: "Programa de reasentamiento han pequeño"
 CHI_han_settlement_small_desc: "Un programa modesto patrocinado por el Estado reubica a familias han de provincias interiores densamente pobladas en nuevos municipios de Nei Mongol, con apoyo de incentivos de empleo y planes de asignación de tierras."
 CHI_han_settlement_medium: "Programa de reasentamiento han mediano"
 CHI_han_settlement_medium_desc: "Un esfuerzo mayor y organizado de reasentamiento traslada decenas de miles de trabajadores han y sus familias a Nei Mongol. Se designan nuevas zonas industriales y parcelas agrícolas para absorber a la población que llega."
 CHI_han_settlement_large: "Programa de reasentamiento masivo han"
 CHI_han_settlement_large_desc: "Una campaña de ingeniería demográfica a gran escala traslada cientos de miles de colonos han a Nei Mongol en una sola oleada coordinada. El impacto a largo plazo en la composición étnica de la región es sustancial, aunque la resistencia local aumenta con fuerza a corto plazo."
 CHI_TAI_media_infiltration: "Infiltración en red de medios"
 CHI_TAI_media_infiltration_desc: "Financiar y ampliar la propiedad mediática y las redes de influencia editorial prochinas dentro de Taiwán. Cultivar un entorno informativo más amigable para el acercamiento a través del Estrecho."
 CHI_TAI_business_council_funding: "Financiación del Consejo Empresarial a través del Estrecho"
 CHI_TAI_business_council_funding_desc: "Proporcionar respaldo financiero a las asociaciones empresariales afines al KMT y a las cámaras de comercio a través del Estrecho. Reforzar el electorado a favor del acercamiento dentro de la élite económica de Taiwán."
 CHI_TAI_cultural_exchange_program: "Programa de intercambio cultural a través del Estrecho"
 CHI_TAI_cultural_exchange_program_desc: "Patrocinar los intercambios académicos, festivales culturales y programas de diálogo juvenil en todo el estrecho. Construir vínculos entre personas que suavicen la resistencia política a las relaciones más estrechas."
 CHI_TAI_cross_strait_infrastructure_investment: "Inversión en infraestructuras transversales"
 CHI_TAI_cross_strait_infrastructure_investment_desc: "Canalizar capital continental a proyectos de infraestructura en Taiwán, y posicionar la inversión china como fuente de oportunidad económica y profundizar la interdependencia material entre ambas economías."
 CHI_45g_national_deployment_idea: "5G iniciativa nacional de despliegue"
 CHI_45g_national_deployment_idea_desc: "Aceleración del despliegue de la infraestructura de red 5G en todo el país, con coordinación estatal de las inversiones de capital en estaciones base, equipo básico de red y asignación de espectros. La iniciativa prioriza la cobertura en industrias estratégicas e infraestructura crítica."
 CHI_avic_innovation_idea: "Desarrollo de aeronaves AVIC"
 CHI_avic_innovation_idea_desc: "La Corporación de Industria Aérea de China impulsa las capacidades indígenas de diseño y producción de aeronaves, - promover programas de aviones de combate y transporte sin depender de la tecnología y las licencias extranjeras"
 CHI_big_fund_phase_1_idea: "Fondo Nacional de la Industria de Semiconductores"
 CHI_big_fund_phase_1_idea_desc: "La respuesta estratégica de China a la autosuficiencia semiconductora, el Big Fund moviliza capital estatal para desarrollar capacidad de fabricación indígena, capacidades de diseño y fabricación de equipos. La iniciativa hace hincapié en reducir la dependencia de las fundiciones extranjeras y los instrumentos EDA."
 CHI_caic_innovation_idea: "CAIC ataca el desarrollo de helicópteros"
 CHI_caic_innovation_idea_desc: "Los anticipos del conglomerado aeroespacial de China atacan la tecnología de helicópteros mediante el desarrollo y producción de plataformas de rotor artesanales indígenas diseñadas para un rápido despliegue y operaciones sostenidas."
 CHI_casc_innovation_idea: "Programas de espacio y satélite CASC"
 CHI_casc_innovation_idea_desc: "China Aerospace Science and Technology Corporation amplía el lanzamiento espacial, las comunicaciones por satélite y las capacidades de observación de la tierra, consolidando el papel de China como una importante potencia espacial independiente de las restricciones de acceso exterior."
 CHI_casic_innovation_idea: "Misil CASIC y desarrollo de contramedidas"
 CHI_casic_innovation_idea_desc: "China Aerospace Science and Industry Corporation adelanta misiles de crucero, misiles balísticos y sistemas de defensa antiaérea a través de R&D sostenido en propulsión, orientación y guerra electrónica."
 CHI_cetc_innovation_idea: "CETC Computing and AI Development"
 CHI_cetc_innovation_idea_desc: "China Electronics Technology Group invierte en plataformas de computación de alto rendimiento, diseño semiconductor y inteligencia artificial para reducir la dependencia tecnológica y acelerar la innovación nacional en tecnologías habilitantes críticas."
 CHI_crrc_innovation_idea: "Fabricación industrial CRRC"
 CHI_crrc_innovation_idea_desc: "El fabricante de ferrocarriles y tránsito de China diversifica en sectores industriales más amplios, aprovechando décadas de experiencia en la cadena de suministro en metalurgia, fabricación de precisión e integración de sistemas."
 CHI_csgc_innovation_idea: "Desarrollo de CSGC AFV"
 CHI_csgc_innovation_idea_desc: "El fabricante estatal de vehículos blindados de China desarrolla plataformas de próxima generación en tanques, vehículos de combate para infantería y vehículos de apoyo, integrando armadura avanzada, potencia de fuego y movilidad."
 CHI_csic_innovation_idea: "Desarrollo submarino CSIC"
 CHI_csic_innovation_idea_desc: "China State Shipbuilding Industrial Corporation avanza el diseño y la producción submarinos, con énfasis en materiales de casco, sistemas de sensores silenciosos y avanzados para operaciones submarinas extendidas."
 CHI_cssc_innovation_idea: "Desarrollo de naves de guerra superficiales CSSC"
 CHI_cssc_innovation_idea_desc: "El constructor naval primario de China se centra en diseños avanzados de destructor, fragata y corvette con sistemas de combate integrados, ampliando las capacidades de agua azul de China a través de carriles marinos estratégicos."
 CHI_failed_five_year_plan: "Plan quinquenal fallido"
 CHI_failed_five_year_plan_desc: "Los resultados decepcionantes del último ciclo quinquenal de planificación han obligado a evaluar las prioridades y la asignación de recursos. La confianza pública en las metas de desarrollo a largo plazo ha sufrido, lo que exige correcciones inmediatas de políticas."
 CHI_haig_innovation_idea: "Desarrollo de grupos de la industria aeronáutica Harbin"
 CHI_haig_innovation_idea_desc: "El sector de aviación de Harbin amplía las capacidades de los rotorcraft, desarrollando helicópteros de transporte y plataformas de ataque que reducen la dependencia de diseños y licencias extranjeros."
 CHI_inner_mongolia_innovation_idea: "Mongolia interior Blindaje Desarrollo"
 CHI_inner_mongolia_innovation_idea_desc: "La base integrada de producción de armaduras de Mongolia promueve el principal tanque de combate y el desarrollo de vehículos blindados, aprovechando siglos de experiencia metalúrgica y técnicas modernas de fabricación."
 CHI_jap_strategic_isolation: "Solución estratégica japonesa"
 CHI_jap_strategic_isolation_desc: "Nuestro apalancamiento económico y posicionamiento diplomático regional marginan cada vez más la influencia estratégica de Japón en Asia Oriental. Tokio se enfrenta a la inflación de los bienes de consumo, la reducción de los mercados de exportación y el peso psicológico de la irrelevancia estratégica."
 CHI_kor_g2_economic_platform: "China-Korea G2 Marco Económico"
 CHI_kor_g2_economic_platform_desc: "Establecimiento de mecanismos bilaterales de coordinación económica entre China y Corea, que abarcan la política comercial, las corrientes de inversión y las asociaciones tecnológicas. El arreglo posiciona a ambas naciones como codirectores de la prosperidad del Asia oriental."
 CHI_kor_trilateral_opening: "Apertura trilateral de Corea"
 CHI_kor_trilateral_opening_desc: "Apertura diplomática a Corea del Norte mediante consultas de alto nivel y un compromiso económico limitado, señalando la voluntad de China de negociar el diálogo y proporcionar apoyo material para una reforma controlada."
 CHI_made_in_china_2025_idea: "Hecho en China 2025"
 CHI_made_in_china_2025_idea_desc: "Una iniciativa de política industrial de una década dirigida a la fabricación de alta tecnología en semiconductores, compuestos avanzados, robótica y tránsito ferroviario. El programa pretende desplazar a China de la fábrica del mundo al innovador mundial."
 CHI_nko_final_transition: "Transición final de Corea del Norte"
 CHI_nko_final_transition_desc: "La etapa final de la transformación de Corea del Norte representa la culminación de la influencia y alineación chinas. Pyongyang se integra funcionalmente en la esfera china con mínima independencia nominal."
 CHI_nko_managed_reform_pilot: "Piloto de Reforma Gestionado en Corea del Norte"
 CHI_nko_managed_reform_pilot_desc: "China patrocina la liberalización económica limitada en Corea del Norte a través de Zonas Económicas Especiales y mecanismos de mercado controlados. El piloto prueba si Pyongyang puede reformar sin desestabilizar el control del régimen."
 CHI_norinco_innovation_idea: "Desarrollo de armas NORINCO"
 CHI_norinco_innovation_idea_desc: "China North Industries Corporation acelera la modernización de armas de infantería, sistemas de artillería y plataformas de armadura ligera. La cartera de exportación de NORINCO se expande a los militares con acceso limitado a proveedores occidentales."
 CHI_phi_abandonment_doctrine: "Doctrina de Abandonamiento Filipina"
 CHI_phi_abandonment_doctrine_desc: "Cultivo deliberado de la dependencia económica filipina y el alejamiento diplomático de su tradicional socio de seguridad, dejando a Manila aislada y vulnerable a la presión de China."
 CHI_poly_innovation_idea: "Politecnologías Desarrollo Industrial Militar"
 CHI_poly_innovation_idea_desc: "La diversificada cartera militar-industrial de Polytech se expande en sectores emergentes de defensa, aprovechando el apoyo estatal y el acceso a instituciones de investigación en todo el aparato de defensa."
 CHI_sac_innovation_idea: "Desarrollo de aviones de combate SAC"
 CHI_sac_innovation_idea_desc: "Shenyang Aircraft Corporation avanza en el diseño y producción de jets de combate, desarrollando plataformas indígenas que reducen la dependencia de los motores rusos y la tecnología de radar AESA."
 CHI_shadow_banking_cleanup_idea: "Limpieza del sector bancario de sombras"
 CHI_shadow_banking_cleanup_idea_desc: "La represión reguladora de los productos fiduciarios no regulados, los préstamos entre homólogos y la financiación antibalance-sheet elimina los riesgos sistémicos del sistema financiero. La contracción del crédito a corto plazo se ve compensada por una mayor confianza reglamentaria."
 CHI_south_china_sea_dominance_window: "Ventana de dominación del mar del sur de China"
 CHI_south_china_sea_dominance_window_desc: "Se ha abierto una ventana estratégica para consolidar el control sobre el Mar de China Meridional mediante la presencia naval, la expansión de la flota pesquera civil y la construcción de instalaciones militares en las islas reclamadas. La ventana puede cerrar si los poderes regionales se coordinan para impugnar la expansión china."
 CHI_ztz99_rollout_idea: "Tipo 99 Rollout de tanque de batalla principal"
 CHI_ztz99_rollout_idea_desc: "Producción y despliegue a gran escala del tanque de combate principal Tipo 99 en toda la Fuerza Terrestre del PLA, proporcionando una mejor armadura, potencia de fuego y movilidad en comparación con plataformas anteriores."
 ETK_security_reinforcement_idea: "Reforzamiento de la Fuerza de Seguridad"
 ETK_security_reinforcement_idea_desc: "Ampliación de las fuerzas de seguridad y endurecimiento de la infraestructura contra los atentados terroristas, con un costo económico modesto compensado por la reducción de las libertades civiles y el aumento de la vigilancia."
 ETK_surveillance_state_idea: "Medidas estatales de vigilancia"
 ETK_surveillance_state_idea_desc: "Ampliación integral de sistemas de vigilancia, redes de control y reunión de inteligencia en toda la sociedad. El aumento de la eficiencia económica gracias al mejoramiento del control social se ve compensado por la reducción de la innovación y la menor participación ciudadana."
 ETK_terrorism_aftermath: "Terrorismo Aftermath"
 ETK_terrorism_aftermath_desc: "Las preocupaciones en materia de seguridad y los traumas sociales de los recientes atentados terroristas siguen perturbando la actividad económica y la confianza pública. La recuperación requiere tiempo y una restauración efectiva de la seguridad."
 TAI_civil_defense_readiness: "Prepárate para la defensa civil"
 TAI_civil_defense_readiness_desc: "Movilización de la población para tareas de defensa antiaérea, con formación en refugio, atención de víctimas y control de daños. La defensa contra las amenazas aéreas mejora al costo de la reducción de la calidad de vida y la perturbación económica."
 CHI_bri_pacific_engagement_tt: "$CHI_bri_pacific_engagement$: $RIGHT|+=1$"
 CHI_Asset_Seizure_tt: "§Y Activo inicial: tesorería §! §G+25§! §G+3§! $CHI_bri_global_presence$\nLa deuda pendiente corresponde a un costo de proyecto"
 chi_bri.16.a: "Nosotros gestionaremos las consecuencias"
 chi_bri.16.d: "El ministerio financiero ha confirmado lo que las cuentas ya mostraron: no podemos cumplir el pago de este mes sobre nuestras obligaciones Franja y la Ruta. Beijing será informada dentro de los días. Hasta que se resuelvan los atrasos, nuestro acreedor tiene derecho a actuar y las opciones abiertas no son todas suaves."
 chi_bri.16.t: "Franja y la Ruta Reembolso perdido"
 chi_bri.17.a: "Firme la concesión"
 chi_bri.17.b: "Los depósitos no están a la venta"
 chi_bri.17.d: "Una delegación china ha llegado con una propuesta que no es realmente una propuesta. A cambio de reducir nuestra deuda predeterminada Franja y la Ruta por el costo de un proyecto, Beijing quiere derechos de extracción y exportación a largo plazo sobre nuestros depósitos minerales. Parte de la deuda desaparecería de los libros. Así que, en gran parte, controlaría el suelo debajo de nuestros pies."
 chi_bri.17.t: "Beijing Demanda Derechos de los recursos"
 chi_bri.18.a: "Quedan otros instrumentos"
 chi_bri.18.d: "[FROM.GetName] ha rechazado abiertamente nuestros términos de concesión de recursos. Su deuda está en pie, su incumplimiento y nuestra delegación ha regresado a Beijing sin nada. La pregunta ahora es si esperar, o recoger lo que se debe por otros medios."
 chi_bri.18.t: "[FROM.GetName] Rechaza nuestros Términos"
 chi_bri.19.a: "Pesa nuestras opciones"
 chi_bri.19.d: "[FROM.GetName] ha perdido el pago de sus obligaciones Franja y la Ruta. La suma no es grande por los estándares de la iniciativa, pero el precedente importa: cada otro prestatario está viendo cómo responde Beijing. Podemos reestructurar la deuda, exigir derechos de recursos o aprovechar lo que financiamos."
 chi_bri.19.t: "[FROM.GetName] Defectos sobre Franja y la Ruta Deuda"
 chi_bri.23.a: "La construcción es lo que importa"
 chi_bri.23.d: "Nuestra tesorería no pudo cubrir nuestra parte del §Y[GetBRIProjectName]§!, por lo que Beijing ha ampliado el crédito para cerrar la brecha. La construcción procede de cualquier manera. La deuda está ahora en nuestros libros, acumula interés, y si no podemos servirle los términos dan a China una latitud considerable."
 chi_bri.23.t: "Franja y la Ruta Proyecto Financiado en Crédito"
 CHI_BRI_automation_disable_tt: "Las solicitudes de la Franja y la Ruta deben §Yrevisarse una por una§!"
 CHI_BRI_automation_enable_tt: "Las solicitudes de la Franja y la Ruta se §Gaceptan automáticamente§!"
 CHI_bri_buy_back_concession: "Recomprar la concesión"
 CHI_bri_buy_back_concession_desc: "Comprar nuestra salida de los derechos de extracción y exportación cedidos a empresas chinas. Es caro, y Pekín no encajará la pérdida con elegancia, pero devuelve los yacimientos al control nacional."
 CHI_bri_can_host_energy: "Controlamos un estado con un complejo industrial al poder"
 CHI_bri_can_host_mine: "Controlamos un estado con depósitos minerales valiosos"
 CHI_bri_can_host_pipeline: "Controlamos un estado con depósitos de petróleo, acero o metales preciosos"
 CHI_bri_can_host_port: "Controlamos un estado costero que podría albergar el puerto"
 CHI_bri_can_host_prestige: "Controlamos nuestro capital."
 CHI_bri_can_host_rail: "Controlamos un estado que podría albergar el ferrocarril"
 CHI_bri_can_host_sez: "Controlamos un estado costero o bien conectado que podría albergar la zona"
 CHI_bri_can_host_telecom: "Controlamos un estado que podría albergar la red"
 CHI_bri_can_request: "China está aceptando Franja y la Ruta aplicaciones y tiene una ranura de proyecto gratuita"
 CHI_bri_clear_loan_tt: "Su deuda pendiente Franja y la Ruta es §Gescrita§!"
 CHI_bri_has_reclaimable_structure: "Tienen un proyecto Franja y la Ruta que podríamos tomar"
 CHI_bri_monthly_income_base: "BRI Base Contribución mensual"
 CHI_bri_monthly_income_base_desc: "La parte del presupuesto estatal comprometido con el fondo Franja y la Ruta cada mes por enfoque y decisiones, antes de bonos departamentales."
 CHI_bri_monthly_income_total: "BRI Contribución mensual"
 CHI_bri_monthly_income_total_desc: "El total pagado en el fondo Franja y la Ruta cada mes: la base comprometida más los bonos departamentales."
 CHI_bri_refuse_concession_tt: "§RMantenemos la deuda§! y permanecemos por defecto"
 CHI_bri_returns_multiplier_base: "BRI Devoluciones Multiplicador"
 CHI_bri_returns_multiplier_base_desc: "El bono aplicado a las Inversiones Internacionales devuelve los libros de China en cada proyecto completado Franja y la Ruta."
 CHI_bri_unlock_tt: "§YBelt and Road:§! §G6§! ranuras de proyecto, §G40§! por proyecto, §G+8§! contribución mensual, §G+4§! Inversiones internacionales por proyecto completado"
 CHI_Write_Off_Debts_tt: "La deuda de cada socio calificador Franja y la Ruta es §Gescrito§! en su totalidad"
 CHI_bri_forum_surge: "Franja y la Ruta Foro Surge"
 CHI_bri_forum_surge_desc: "Los compromisos firmados en el foro trienal permiten a Beijing llevar dos proyectos más inmediatamente durante los próximos tres años. Con más ranuras abiertas, más estados socios pueden construir en cualquier momento dado."
 CHI_bri_partner_1: "BRI Participant"
 CHI_bri_partner_1_desc: "Un proyecto inicial Franja y la Ruta ha roto terreno. Los equipos de construcción chinos aceleran el trabajo doméstico y dan credibilidad a la agenda de desarrollo del gobierno."
 CHI_bri_partner_2: "Compañero BRI"
 CHI_bri_partner_2_desc: "Se ha entregado un segundo proyecto Franja y la Ruta. La financiación de la ingeniería y la infraestructura chinas se está convirtiendo en una parte visible del programa nacional de desarrollo."
 CHI_bri_partner_3: "Socio estratégico de BRI"
 CHI_bri_partner_3_desc: "Múltiples proyectos BRI están activos en todo el país. Los contratistas chinos, las líneas de crédito y el respaldo político refuerzan la capacidad estatal, y Beijing espera alineación diplomática a cambio."
 CHI_bri_partner_4: "Estado de anclaje BRI"
 CHI_bri_partner_4_desc: "Franja y la Ruta La inversión apoya la economía nacional. La construcción y el suministro de los fondos de capital chinos, y la dependencia ahora es difícil de rebobinar sin graves perturbaciones."
 CHI_bri_partner_5: "Compañero BRI Keystone"
 CHI_bri_partner_5_desc: "El país es un pilar del Franja y la Ruta. Las normas, los contratistas y la financiación chinos están integrados en todos los corredores principales, y la política económica se establece con Beijing en mente."
 CHI_bri_presence_modifier: "Presencia global de BRI"
 CHI_bri_presence_modifier_desc: "La China de pie se basa en su red Franja y la Ruta. Crece con el número de estados asociados y con cuán profundamente cada uno está atado."
 CHI_bri_presence_modifier_tt: "Escalas con §Y$CHI_bri_global_presence$§!: el rango combinado de cada socio Franja y la Ruta. La demanda de bienes de consumo cae hasta §G7.5%§! a 200 presencia."
 CHI_bri_claim_resource_rights: "Derechos de los recursos"
 CHI_bri_claim_resource_rights_desc: "Coge el pago en especie. El deudor inscribe los derechos de extracción y exportación a largo plazo, reduciendo su deuda por un costo de proyecto al mismo tiempo que cede el control de su base de recursos. Disponible sólo en el camino de Lending Predatory."
 CHI_bri_project_mission: "Construcción de la Franja y la Ruta"
 CHI_bri_project_mission_desc: "Contratistas y financiación chinos trabajan en el §Y[GetBRIProjectName]§!. Cuando se entregue, obtendremos sus beneficios, nuestro rango de socio subirá y Pekín cobrará su retorno."
 CHI_bri_raise_contribution: "Aumentar la financiación de la Franja y la Ruta"
 CHI_bri_raise_contribution_desc: "Dedicar una porción mayor del presupuesto estatal al fondo de la Franja y la Ruta cada mes. El tesoro paga la construcción por adelantado y los retornos de los proyectos nunca lo reponen, así que aumentarlo es la única forma de seguir construyendo."
 CHI_bri_raise_contribution_tt: "§Y$CHI_bri_monthly_income$§!: hasta §G+4§! por mes (máximo §Y30§!)"
 CHI_bri_resource_concession_idea: "Concesión de recursos chinos"
 CHI_bri_resource_concession_idea_desc: "Parte de un préstamo predeterminado Franja y la Ruta se resolvió firmando derechos de extracción y exportación. Las firmas chinas trabajan los depósitos, y los ingresos salen del país antes de que se impongan. La concesión funciona hasta que se compra de vuelta."
 CHI_BRI_project_missions: "Proyectos de la Franja y la Ruta"
 CHI_BRI_project_missions_desc: "Proyectos de la Franja y la Ruta actualmente en construcción en nuestro país, financiados y construidos por contratistas chinos."
 CHI_BRI_automation_disable: "Automatización BRI deshabilitada"
 CHI_BRI_automation_disable_desc: "Volver a un proceso de revisión directa de las solicitudes de proyectos de la Franja y la Ruta entrantes. Cada solicitud llegará como un evento para que China la examine y la apruebe o rechace por separado. Las solicitudes que ya esperan revisión conservan el proceso con el que se abrieron."
 CHI_BRI_automation_enable: "Activar la automatización BRI"
 CHI_BRI_automation_enable_desc: "Aprobar automáticamente las solicitudes entrantes de la Franja y la Ruta en lugar de revisar cada una. Los solicitantes ya se han filtrado por elegibilidad y por una plaza de proyecto libre antes de poder solicitar, de modo que la automatización simplemente se salta el papeleo. Las solicitudes que ya esperan revisión conservan el proceso con el que se abrieron."
 CHI_bri_committed_projects: "BRI Proyectos comprometidos"
 CHI_bri_committed_projects_desc: "Proyectos activos de BRI más aplicaciones en espera de revisión. Cada aplicación pendiente se reserva una ranura de proyecto."
 CHI_MAC_gambling_diversification: "Diversificación de la industria del juego"
 CHI_MAC_gambling_diversification_desc: "Durante décadas la prosperidad de Macao ha descansado en un solo pilar: el piso del casino. Un giro deliberado hacia los servicios digitales, el comercio electrónico y la infraestructura tecnológica amplía la base tributaria más allá de las mesas de juego, amortiguando el SAR contra los cambios en los ingresos turísticos mientras ve una economía de Internet casera."
