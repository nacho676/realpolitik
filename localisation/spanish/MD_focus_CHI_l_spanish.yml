 CHI_hainan_free_trade_port: "Puerto de Libre Comercio de Hainan"
 CHI_hainan_free_trade_port_desc: "En 2018 Pekín designó toda Hainan como zona piloto de libre comercio, y un plan maestro publicado en 2020 fijó el camino hacia un territorio aduanero totalmente independiente para 2025. Las obras de ampliación en Haikou y en el puerto de aguas profundas de Yangpu, junto con el recinto del foro de Boao, mejoran la capacidad logística y de conferencias de la isla antes del cierre aduanero de toda la isla. Una vez sellada, las mercancías circularán libremente dentro de Hainan y solo pagarán aranceles al cruzar al área aduanera continental."
 CHI_hainan_zero_tariff_zone: "Zona Hainan Zero-Tariff"
 CHI_hainan_zero_tariff_zone_desc: "Un catálogo publicado de bienes con arancel cero permite que las importaciones aptas entren en Hainan libres de derechos, mientras que los tipos del impuesto de sociedades y sobre la renta de las personas se limitan al 15 por ciento para residentes aptos e industrias fomentadas. Las franquicias de venta libre de impuestos en alta mar se amplían mucho más allá de las del continente y atraen un gasto turístico que antes iba a Hong Kong o al extranjero. El régimen fiscal y arancelario acelera el paso de Hainan de una economía de plantaciones y pesca al turismo, los servicios offshore y el comercio de transformación de alto valor."
 CHI_kra_canal_underwriting: "Escribió el Canal de Kra"
 CHI_kra_canal_underwriting_desc: "El Banco de Desarrollo de China y el Banco de Exportación e Importación de China ofrecen financiación en condiciones favorables para la siguiente fase de excavación del canal por el Istmo de Kra. La línea de crédito permite que Bangkok avance de inmediato con la construcción en lugar de esperar a los ciclos presupuestarios internos, y a la vez ata la finalización del proyecto a la buena voluntad china. Cada tramo profundiza la participación financiera de Pekín en una vía fluvial que permitiría al transporte marítimo chino sortear el Estrecho de Malaca."
 CHI_kra_canal_underwriting_phase_tt: "El Canal §YKra§! todavía está en construcción."
 CHI_kra_transit_corridor: "Corredor de tránsito Kra"
 CHI_kra_transit_corridor_desc: "Empresas estatales chinas de transporte marítimo y energía establecen terminales de tránsito y abastecimiento en el Canal de Kra terminado, lo que recorta los viajes de petroleros del Golfo Pérsico a Cantón en unos 1200 kilómetros y alivia la dependencia del congestionado Estrecho de Malaca, vulnerable a los estrangulamientos. El arreglo es más valioso donde las empresas chinas tienen una concesión de operación sobre el tráfico del canal y no meros derechos de tránsito."
 CHI_thaad_escalate_count_tt: "Escalada de represalias THAAD: $RIGHT|+=0$"
 SCO_military_research_desc: "Los miembros y observadores de la Organización de Cooperación de Shanghai comparten investigación militar mediante programas conjuntos."
 SCO_military_research_name: "Investigación militar de la OCS"
 CHI_HKG_patriotic_education_drive: "Unidad de educación patrótica"
 CHI_HKG_patriotic_education_drive_desc: "Financiar un currículo de educación cívica e identidad nacional diseñado en el continente en las escuelas subvencionadas de Hong Kong, ampliar la enseñanza en putonghua y pagar viajes de estudio de docentes al interior. La Oficina de Educación absorbe el costo y el despliegue es lo bastante gradual como para evitar una segunda reacción contra la Educación Moral y Nacional."
 CHI_HKG_liaison_office_expansion: "Ampliar la Oficina Central de Enlace"
 CHI_HKG_liaison_office_expansion_desc: "Ampliar la Oficina de Enlace del Gobierno Popular Central y la Oficina para la Salvaguarda de la Seguridad Nacional, comisionar a cuadros del continente en la función pública de Hong Kong y sentar a nombrados examinados en los paneles de selección del poder judicial. El control administrativo avanza rápido, pero cada intervención visible corre el riesgo de devolver a las multitudes a la calle."
 CHI_MAC_cross_border_administration: "Unificar la administración Cross-Border"
 CHI_MAC_cross_border_administration_desc: "Reconocer en Macao los títulos profesionales y permisos de conducir continentales, canalizar la compensación en renminbi por bancos supervisados desde el continente y fusionar el despacho aduanero de los puestos de Gongbei y Lotus Bridge en un único permiso. El territorio conserva su estatuto mientras su maquinaria administrativa converge con la de Guangdong."
 CHI_MAC_hengqin_integration_zone: "Zona de Cooperación Profunda de Hengqin"
 CHI_MAC_hengqin_integration_zone_desc: "Extender la Zona de Cooperación Profunda Guangdong-Macao en la isla de Hengqin: derechos de residencia continental para los trabajadores de Macao, un régimen fiscal y aduanero unificado y el traslado de empresas afines al juego al otro lado del agua. Zhuhai absorbe el crecimiento y, con él, las palancas del gobierno local."
 CHI_TIB_monastic_patriotic_education: "Educación patriótica en los monasterios"
 CHI_TIB_monastic_patriotic_education_desc: "Los Comités de Manejo Democrático en cada monasterio registrado, requieren que monjes y monjas aprueben exámenes sobre la política religiosa del estado, y la matrícula de novicios. Las instituciones permanecen abiertas y operan bajo supervisión administrativa permanente."
 CHI_TIB_village_cadre_teams: "Equipos de trabajo de Cadre Basado en Pueblo"
 CHI_TIB_village_cadre_teams_desc: "Destinar un equipo de trabajo permanente del Partido a cada aldea administrativa, junto con auditorías del registro de hogares, consolidación de viviendas subsidiadas y traslado de familias pastoras dispersas a municipios con servicios. La penetración administrativa se vuelve total y también el resentimiento que genera."
 CHI_ETK_bilingual_boarding_schools: "Sistema de internados bilingües"
 CHI_ETK_bilingual_boarding_schools_desc: "Consolidar la escolarización rural en internados con el mandarín como lengua vehicular, con maestros reclutados de las provincias del interior. El uigur se mantiene como asignatura y no como lengua de enseñanza, y se educa a una generación lejos de sus aldeas de origen."
 CHI_ETK_labour_transfer_scheme: "Superplus Labour Transfer Scheme"
 CHI_ETK_labour_transfer_scheme_desc: "Asignar trabajadores uigures rurales a fábricas costeras y parques industriales regionales mediante cuotas organizadas de traslado, haciendo responsables a los cuadros de las aldeas de las metas de reclutamiento. Los ingresos de los hogares suben y los lazos comunitarios se debilitan, pero el plan es claramente visible para los auditores extranjeros que rastrean las cadenas de suministro."
 CHI_OMG_mandarin_curriculum_rollout: "Rollout de curriculum unificado"
 CHI_OMG_mandarin_curriculum_rollout_desc: "Reemplazar los libros de texto en mongol sobre política, historia y lengua por la serie unificada nacional y reentrenar al cuerpo docente en consecuencia. Presentado como una medida de igualdad de oportunidades y aplicado con la lentitud suficiente para mantener tranquilos a los condados pastoriles."
 CHI_OMG_pastoral_sedentarisation: "Programa de Sedentarización Pastoral"
 CHI_OMG_pastoral_sedentarisation_desc: "Hacer cumplir las prohibiciones de pastoreo en la estepa degradada, compensar a las familias pastoras por el ganado entregado y reasentarlas en viviendas municipales subvencionadas con reconversión profesional. El pastoreo nómada cede paso al trabajo asalariado y, con él, se va la base social de lo distintivo mongol."
 CHI_national_common_language_campaign: "Campaña nacional de lengua común"
 CHI_national_common_language_campaign_desc: "Aplicar la Ley sobre la Lengua China Hablada y Escrita Estándar de manera uniforme en todas las Regiones Administrativas Especiales a la vez: una sola serie de libros de texto, certificación nacional de idioma para el empleo público y cuotas de difusión. Un único impulso coordinado avanza la integración en todos los lugares donde el gobierno central aún tiene influencia administrativa."
 CHI_second_generation_ethnic_policy: "II. Política étnica de segunda generación"
 CHI_second_generation_ethnic_policy_desc: "Adoptar el modelo despolitizado de asuntos étnicos que urgen los teóricos reformistas del Partido: retirar las cuotas preferenciales, abandonar la autonomía regional como principio organizador y definir la ciudadanía únicamente a través de la nación china. Aplicado a todas las Regiones Administrativas Especiales a la vez, es la medida de integración de mayor alcance disponible y la más desestabilizadora."
