 BRI_apply_named_PORT_desc: "Petición de Beijing para construir el §Y[THIS.GetBRINextProjectPORT]§!. La aplicación cuesta 30 Poder político. Con la aprobación, pagamos §Y40§! de nuestro tesorería o recibimos un préstamo chino. Requiere un estado costero y paz."
