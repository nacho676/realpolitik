 CHI_sinicization_all_SARs_tt: "Avances §YSinicización§! en cada Región Administrativa Especial que aún está pendiente de integración"
 CHI_bri_reduce_loan_tt: "Su deuda pendiente Franja y la Ruta cae en §G un costo de proyecto§!"
 CHI_bri_restructure_loan_tt: "Su tasa de préstamo cae a §G2%§! y la pausa de pagos para §Y un año§!"
 CHI_bri_application_approved_tt: "La construcción comienza después de un cheque final de elegibilidad. El receptor paga §Y40§! de su tesorería o recibe un préstamo chino para el déficit."
 CHI_bri_dual_treasury_50_tt: "Requiere al menos §Y50§! tanto en el fondo BRI como en la tesorería nacional"
 CHI_bri_state_port: "Proyecto de puerto BRI"
 CHI_bri_state_port_desc: "Un desarrollo portuario respaldado por China amplía la capacidad local de logística y construcción marítima."
 CHI_bri_state_rail: "Proyecto ferroviario BRI"
 CHI_bri_state_rail_desc: "Un corredor ferroviario respaldado por China mejora la logística terrestre y la construcción de infraestructura."
 CHI_bri_state_pipeline: "Proyecto de tubería BRI"
 CHI_bri_state_pipeline_desc: "Un oleoducto respaldado por China amplía el rendimiento de los recursos y la capacidad regional de suministro."
 CHI_bri_state_telecom: "Proyecto de telecomunicaciones BRI"
 CHI_bri_state_telecom_desc: "Una columna vertebral digital respaldada por China apoya la infraestructura de red y la construcción futura."
 CHI_bri_state_sez: "BRI Zona Económica Especial"
 CHI_bri_state_sez_desc: "Una zona económica especial respaldada por China amplía la capacidad de fábrica local y el espacio de construcción."
 CHI_bri_state_mine: "Proyecto minero de BRI"
 CHI_bri_state_mine_desc: "La inversión china expande la extracción de los depósitos minerales del estado."
 CHI_bri_state_energy: "Proyecto energético de BRI"
 CHI_bri_state_energy_desc: "La capacidad de generación construida en China apoya la industria local."
 CHI_bri_state_prestige: "Proyecto de prestigio BRI"
 CHI_bri_state_prestige_desc: "Un hito y un complejo de oficinas respaldados por China remodelan la capital regional."
 CHI_BRI_recipient_finance: "Financiación de la Franja y la Ruta"
 CHI_BRI_recipient_finance_desc: "Gestionar nuestras deudas y concesiones de la Franja y la Ruta.\n\n§YDeuda pendiente BRI:§! [?bri_debt_owed_to_china|2]\n§YPago semanal de intereses:§! [?bri_loan_payment|2]"
 CHI_huawei_consumer_ecosystem_power: "Ecosystem Power"
 CHI_huawei_consumer_ecosystem_power_desc: "Los dispositivos, software, servicios y desarrolladores forman una plataforma de consumo globalmente competitiva con el apoyo de la base tecnológica más amplia de Huawei."
 CHI_huawei_global_telecom_challenger: "Aspirante global de telecomunicaciones"
 CHI_huawei_global_telecom_challenger_desc: "Los centros internacionales de investigación, las relaciones con portadores y una red de ventas en expansión están convirtiendo a Huawei en un desafío global de telecomunicaciones."
 CHI_huawei_resilient_technology_fortress: "Fortaleza tecnológica resistente"
 CHI_huawei_resilient_technology_fortress_desc: "Huawei sigue siendo un campeón duradero y técnicamente capaz, pero las limitaciones geográficas y la confianza limitada restringen su alcance comercial."
 CHI_huawei_sovereign_full_stack: "Soberano Full Stack"
 CHI_huawei_sovereign_full_stack_desc: "Los chips independientes, software, IA, servicios en la nube, dispositivos y un sistema de suministro resistente forman una amplia pila de tecnología doméstica."
 CHI_semiconductor_events.300.a: "Retroceda una red global R&D distribuida"
 CHI_semiconductor_events.300.b: "Priorizar el mercado de los transportistas nacionales"
 CHI_semiconductor_events.300.d: "Fundada en Shenzhen en 1987, Huawei construyó su posición temprana en el mercado de telecomunicaciones de China antes de establecer operaciones de investigación y ventas en el extranjero. La política industrial estatal puede financiar una red de investigación global distribuida, o mantener el peso de la empresa en el mercado nacional del transportista."
 CHI_semiconductor_events.300.t: "Más allá del mercado casero"
 CHI_semiconductor_events.301.a: "Retrocede el modelo LTE final a extremo"
 CHI_semiconductor_events.301.b: "Mantener el esfuerzo en los transportistas chinos"
 CHI_semiconductor_events.301.d: "TeliaSonera ha lanzado un servicio comercial LTE en Oslo utilizando una red Huawei. Beijing puede respaldar el modelo final a fin que ganó el contrato y escalarlo en toda Europa, o mantener a los ingenieros de la empresa en vehículos chinos."
 CHI_semiconductor_events.301.t: "Los LTE nórdicos Ruptura"
 CHI_semiconductor_events.302.a: "Financiar la luna llena 5G"
 CHI_semiconductor_events.302.b: "Actualizar las radios incrementalmente en su lugar"
 CHI_semiconductor_events.302.d: "Huawei ha anunciado por lo menos US$600 millones en inversión de investigación 5G a través de 2018. El apoyo estatal puede financiar un empuje integrado para el liderazgo de 5G, o mantener actualizaciones de radio incrementales que cuestan mucho menos."
 CHI_semiconductor_events.302.t: "The 5G Moonshot"
 CHI_semiconductor_events.303.a: "Defender Huawei y preservar la continuidad"
 CHI_semiconductor_events.303.b: "Proseguir un camino de cumplimiento negociado"
 CHI_semiconductor_events.303.d: "Estados Unidos ha añadido Huawei y numerosos afiliados a la Lista de Entidades, restringiendo fuertemente el acceso a la tecnología estadounidense. Las acusaciones separadas de los fiscales son disputadas por Huawei. Beijing puede defender a la empresa y preservar la continuidad, o buscar un camino de cumplimiento negociado."
 CHI_semiconductor_events.303.t: "La Lista de Entidades"
 CHI_semiconductor_events.304.a: "Empuja la fabricación doméstica lo que cueste"
 CHI_semiconductor_events.304.b: "Stockpile lo que podemos y esperar los controles"
 CHI_semiconductor_events.304.d: "Los controles ampliados de productos directos extranjeros han reforzado el acceso de Huawei a semiconductores avanzados. La política estatal puede obligar a la fabricación nacional a adelantar lo que cueste, o almacenar lo que queda disponible y esperar los controles."
 CHI_semiconductor_events.304.t: "El Chokepoint Chip"
 CHI_semiconductor_events.305.a: "Una pila completa soberana, silicio al software"
 CHI_semiconductor_events.305.b: "Una fortaleza tecnológica que supera los controles"
 CHI_semiconductor_events.305.c: "Un retador de telecomunicaciones con alcance global"
 CHI_semiconductor_events.305.e: "Un ecosistema de consumo construido en su propia plataforma"
 CHI_semiconductor_events.305.d: "Dos décadas de expansión, sanción y sustitución han resuelto lo que es Huawei. Un teléfono construido sobre un procesador de fabricación nacional ha respondido a la pregunta que los controles de exportación estaban destinados a cerrar. La estrategia estatal se consolida en torno a la forma que ha tomado la empresa."
 CHI_semiconductor_events.305.t: "El segundo ascenso"
 CHI_semiconductor_events.310.t: "IBM Client Estate"
 CHI_semiconductor_events.310.d: "IBM está dispuesto a vender el negocio informático personal que inventó, incluyendo la marca ThinkPad cada comprador corporativo ya confía. Comprarlo haría de Lenovo el tercer mayor fabricante del mundo durante la noche, junto con las pérdidas que persuadieron a IBM para dejarlo ir."
 CHI_semiconductor_events.310.a: "Comprar el negocio personal de la computadora"
 CHI_semiconductor_events.310.b: "Crecemos de lo que nos construimos"
 CHI_semiconductor_events.311.t: "Washington aclara el trato"
 CHI_semiconductor_events.311.d: "Los reguladores estadounidenses aprobarán la venta IBM a Lenovo, en condiciones: instalaciones separadas, acceso restringido a los registros de clientes gubernamentales y supervisión de quién trabaja donde. Aceptarlos cierra el acuerdo y reconoce que un propietario chino es una cuestión de seguridad. Refusing mantiene el principio y probablemente pierde el negocio."
 CHI_semiconductor_events.311.a: "Aceptar los compromisos de seguridad"
 CHI_semiconductor_events.311.b: "Condiciones de rechazo que ningún otro comprador se enfrentaría"
 CHI_semiconductor_events.312.t: "Un nombre suyo propio"
 CHI_semiconductor_events.312.d: "La licencia de Lenovo para poner el nombre IBM en un ThinkPad se agota, y los compradores corporativos han estado comprando la placa más que la compañía detrás de ella. Poner el nombre Lenovo en los productos prueba si cinco años de propiedad compraron cualquier credibilidad. Mantener la vieja insignia siempre y cuando sea posible aplaza la pregunta."
 CHI_semiconductor_events.312.a: "Ponga nuestro propio nombre en los productos"
 CHI_semiconductor_events.312.b: "Mantenga la marca heredada mientras dure"
 CHI_semiconductor_events.313.t: "La alianza Matures"
 CHI_semiconductor_events.313.d: "NEC en Japón y Medion en Alemania doblará sus operaciones en empresas conjuntas con Lenovo en lugar de ser compradas directamente. Las empresas compran cuota de mercado en países que resisten una adquisición, y dejar a los socios con un dicho en lo que se construye. Comprar directamente cuesta más y respuestas a nadie."
 CHI_semiconductor_events.313.a: "Construir las empresas conjuntas"
 CHI_semiconductor_events.313.b: "Ampliar directamente y mantener el control"
 CHI_semiconductor_events.314.t: "Sistema x"
 CHI_semiconductor_events.314.d: "IBM ahora está dejando el negocio del servidor de volumen también, y el mismo argumento se aplica a una escala mayor y un precio más alto. El sistema de compra x movería Lenovo fuera del mercado de productos básicos que ya conduce. Mantenerse con computadoras personales significa defender un negocio cuyos márgenes se encojan cada año."
 CHI_semiconductor_events.314.a: "Comprar el negocio del servidor también"
 CHI_semiconductor_events.314.b: "Defender el negocio de la computadora personal"
 CHI_semiconductor_events.315.t: "Lo que Lenovo Became"
 CHI_semiconductor_events.315.d: "Dos décadas de Lenovo comprando lo que las empresas occidentales ya no quisieron han resuelto lo que es la fabricación de computación china y cuánto del hardware del mundo corre a través de él."
 CHI_semiconductor_events.315.a: "Una plataforma empresarial de servidores a escritorios"
 CHI_semiconductor_events.315.b: "El fabricante de ordenadores personales del mundo"
 CHI_semiconductor_events.315.c: "Un puente entre la escala china y las marcas extranjeras"
 CHI_semiconductor_events.315.e: "Un campeon doméstico"
 CHI_lenovo_enterprise_server_platform: "Plataforma empresarial"
 CHI_lenovo_enterprise_server_platform_desc: "Los escritorios, portátiles y los servidores detrás de ellos son todos construidos por una empresa que compró cada negocio cuando su anterior propietario renunció en él. Los márgenes que los vendedores no pudieron encontrar están allí una vez que la fabricación se hace a escala."
 CHI_lenovo_global_pc_platform: "Fabricante mundial"
 CHI_lenovo_global_pc_platform_desc: "Más ordenadores personales envían desde líneas de producción chinas bajo una placa que de cualquier otra persona. Es un negocio de productos básicos con márgenes delgados y no hay ningún reto realista para el volumen."
 CHI_lenovo_strategic_bridge: "Estratégico Puente"
 CHI_lenovo_strategic_bridge_desc: "La fabricación china llega a mercados que rechazarían a un propietario chino, porque las empresas llevan socios locales y nombres locales. El control es compartido y las puertas permanecen abiertas."
 CHI_lenovo_domestic_champion: "Campeón nacional"
 CHI_lenovo_domestic_champion_desc: "La empresa creció sobre lo que construyó en lugar de lo que compró, y responde a Beijing en vez de a un registro de accionistas extranjeros. Su alcance es más pequeño y nada de eso depende del permiso de nadie más."
 china_sar.021.b: "La isla no vale la flota. Baja el ultimátum."
 CHI_TAI_lift_full_blockade: "Levantar el bloqueo total"
 CHI_TAI_lift_full_blockade_desc: "Baja el cordón a un bloqueo parcial. La presión sobre las facilidades de Taipei y la alarma de Washington disminuye, pero los puertos de la isla se reabrieron."
 CHI_ernie_national_champion_decision: "Nombrar a Ernie el modelo nacional"
 CHI_ernie_national_champion_decision_desc: "Designar el modelo de Baidu como sistema de referencia para el despliegue estatal y provincial. Ser el primero pasa a ser estatus oficial, y los ministerios obtienen una sola arquitectura que certificar en lugar de seis.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede haber un programa de laboratorio de IA activo a la vez.§!"
 CHI_ernie_consumer_search_decision: "Integrar Ernie en la búsqueda"
 CHI_ernie_consumer_search_decision_desc: "Mantener el modelo donde ya están los usuarios en lugar de perseguir contratos empresariales. La distribución es inmediata y los ingresos son reales, a costa del papel de fijar estándares.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede haber un programa de laboratorio de IA activo a la vez.§!"
 CHI_qwen_open_ecosystem_decision: "Respaldar a Qwen como plataforma abierta"
 CHI_qwen_open_ecosystem_decision_desc: "Apoyar la publicación de los pesos y dejar que el ecosistema nacional se base en ellos. Cada desarrollador de aguas abajo se convierte en una dependencia de la infraestructura china, que vale más con el tiempo que los ingresos por licencias.\n\n§YEl espíritu nacional resultante dura 365 días. Sólo un programa de laboratorio AI puede estar activo en un momento.§!"
 CHI_qwen_cloud_captive_decision: "Tie Qwen a Cloud Business"
 CHI_qwen_cloud_captive_decision_desc: "Mantener los modelos de frontera dentro de Alibaba Cloud como la razón para comprar el cómputo. Los márgenes se quedan en la plataforma y también la palanca.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede haber un programa de laboratorio de IA activo a la vez.§!"
 CHI_zhipu_academic_pipeline_decision: "Financiar el canal de Tsinghua"
 CHI_zhipu_academic_pipeline_decision_desc: "Trate al laboratorio como el campo de entrenamiento para la próxima generación de investigadores en lugar de una empresa de productos. Más lento al mercado, y se complica.\n\n§YEl espíritu nacional resultante dura 365 días. Sólo un programa de laboratorio AI puede estar activo en un momento.§!"
 CHI_zhipu_state_procurement_decision: "Canalizar Zhipu por las compras del Estado"
 CHI_zhipu_state_procurement_decision_desc: "Garantizar la demanda mediante contratos ministeriales y provinciales. El laboratorio nunca tiene que buscar un mercado y tampoco tiene que rendirle cuentas a ninguno.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede haber un programa de laboratorio de IA activo a la vez.§!"
 CHI_doubao_consumer_scale_decision: "Llevar Doubao a escala masiva"
 CHI_doubao_consumer_scale_decision_desc: "Poner el asistente delante de cientos de millones de usuarios a un precio que nadie puede igualar. La adopción es la métrica, y la factura de cómputo es su precio.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede haber un programa de laboratorio de IA activo a la vez.§!"
 CHI_doubao_recommendation_core_decision: "Mantener a Doubao dentro del recomendador"
 CHI_doubao_recommendation_core_decision_desc: "Reorientar el trabajo hacia los sistemas de clasificación y recomendación que ya generan ingresos. Menos visible que un asistente para consumidores y bastante más rentable.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede haber un programa de laboratorio de IA activo a la vez.§!"
 CHI_deepseek_open_weight_release_decision: "Publicar los pesos de DeepSeek"
 CHI_deepseek_open_weight_release_decision_desc: "Publicar abiertamente un modelo de clase frontera y dejar que el resto del mundo construya sobre la investigación china. Los controles de exportación pretendían negar cómputo; publicar convierte la restricción en un debate sobre quién fija los términos.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede haber un programa de laboratorio de IA activo a la vez.§!"
 CHI_deepseek_state_aligned_lab_decision: "Incorporar a DeepSeek al esfuerzo estatal"
 CHI_deepseek_state_aligned_lab_decision_desc: "Integrar el laboratorio en el programa nacional con la financiación y la supervisión que conlleva. El trabajo de eficiencia continúa bajo supervisión y deja de ser asunto que otros puedan leer.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede haber un programa de laboratorio de IA activo a la vez.§!"
 CHI_moonshot_long_context_decision: "Respaldar la apuesta por el contexto largo"
 CHI_moonshot_long_context_decision_desc: "Financiar la búsqueda de longitudes de contexto que nadie más ofrece. Una apuesta estrecha por una sola capacidad, y el primer laboratorio que la logre es dueño de una categoría.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede haber un programa de laboratorio de IA activo a la vez.§!"
 CHI_moonshot_enterprise_pivot_decision: "Apuntar Moonshot a la empresa"
 CHI_moonshot_enterprise_pivot_decision_desc: "Comercio de la raza consumidora para despliegues contratados con ingresos predecibles. La valoración deja de escalar y el balance deja de sangrar.\n\n§YEl espíritu nacional resultante dura 365 días. Sólo un programa de laboratorio AI puede estar activo en un momento.§!"
 CHI_ernie_national_champion: "Modelo Nacional de Referencia"
 CHI_ernie_national_champion_desc: "Una arquitectura certificada se extiende a través de ministerios, provincias y empresas estatales. La adquisición es más simple, las normas son chinas y el titular tiene pocas razones para moverse rápidamente."
 CHI_ernie_consumer_search: "Search-Integrated Assistant"
 CHI_ernie_consumer_search_desc: "El modelo llega a sus usuarios a través del producto de búsqueda en lugar de un equipo de ventas. Los ingresos llegan inmediatamente y el papel de establecimiento de normas va a otra persona."
 CHI_qwen_open_ecosystem: "Ecosistema de peso abierto"
 CHI_qwen_open_ecosystem_desc: "Los pesos publicados hicieron de la plataforma algo que el mundo construye en lugar de licencias. El ingreso directo es más delgado y la dependencia funciona de la manera correcta."
 CHI_qwen_cloud_captive: "Frontera Cloud-Captive"
 CHI_qwen_cloud_captive_desc: "Los mejores modelos son la razón para alquilar el compute, y corren a ninguna otra parte. Los márgenes y el poder de negociación se mantienen con la plataforma."
 CHI_zhipu_academic_pipeline: "Oleoducto de investigación académica"
 CHI_zhipu_academic_pipeline_desc: "El laboratorio entrena a investigadores tanto como forma modelos, y la universidad sigue suministrando ambos. La producción comercial es modesta; la base de talento no lo es."
 CHI_zhipu_state_procurement: "Laboratorio estatal de adquisiciones"
 CHI_zhipu_state_procurement_desc: "Los contratos del Ministerio garantizan la demanda y establecen la dirección. La financiación es estable, y también la ausencia de cualquier presión competitiva."
 CHI_doubao_consumer_scale: "Despliegue masivo de consumidores"
 CHI_doubao_consumer_scale_desc: "Cientos de millones de usuarios diarios a un precio que prorroga la competencia. La adopción es inigualable y la factura de la inferencia es enorme."
 CHI_doubao_recommendation_core: "Recomendación básica"
 CHI_doubao_recommendation_core_desc: "La investigación alimenta los sistemas de clasificación que ya imprimen dinero en lugar de un ayudante independiente. Unglamorous, y los retornos son inmediatos."
 CHI_deepseek_open_weight_release: "Liberación de la frontera abierta"
 CHI_deepseek_open_weight_release_desc: "Un modelo de clase fronteriza publicado abiertamente, entrenado para una fracción de lo que los titulares gastan. El argumento de eficiencia viaja más allá del modelo."
 CHI_deepseek_state_aligned_lab: "State-Aline Frontier Laboratory"
 CHI_deepseek_state_aligned_lab_desc: "La investigación sobre la eficiencia continúa con la financiación nacional y la supervisión nacional. La capacidad sigue agravando y los resultados dejan de ser públicos."
 CHI_moonshot_long_context: "Especialista de contexto largo"
 CHI_moonshot_long_context_desc: "Una apuesta deliberada sobre servir al contexto prolonga el resto del campo no puede. Aprieta, y sin disputar donde aterriza."
 CHI_moonshot_enterprise_pivot: "Emprendimiento de la práctica"
 CHI_moonshot_enterprise_pivot_desc: "Los despliegues contratados sustituyeron a la raza de consumo. El crecimiento es más lento, los ingresos son predecibles y el laboratorio sobrevive el invierno de financiación."
 CHI_ai_lab_treasury_15_tt: "Tiene más de §Y15 mil millones§! en reservas de tesorería"
 CHI_ai_lab_treasury_20_tt: "Tiene más de §Y20 mil millones§! en reservas de tesorería"
 CHI_pacific_pivot_partner_exists_tt: "Al menos una nación del Pacífico es un §Y Pacific Pivot Partner§!"
 CHI_TAI_full_blockade_active: "Bloqueo completo de Taiwán Activo"
 CHI_semiconductor_events.320.t: "La mitad del diezmo para treinta y dos millones"
 CHI_semiconductor_events.320.d: "Tencent está quemando dinero en efectivo a un mensajero que nadie paga para usar, y ningún inversionista chino lo financiará. MIH, un grupo de medios sudafricanos, ofrece 32 millones de dólares para el 46,5% y dejará Pony Ma dirigiendo la empresa. La alternativa es el dinero nacional en términos establecidos en Beijing."
 CHI_semiconductor_events.320.a: "Vender la estaca a MIH"
 CHI_semiconductor_events.320.b: "Eleve el dinero en casa"
 CHI_semiconductor_events.321.t: "Listas de 10 centavos en Hong Kong"
 CHI_semiconductor_events.321.d: "Tencent puede poner sus acciones en el intercambio de Hong Kong y recaudar capital extranjero contra una base de usuarios que ningún mercado ha precio jamás. El listado financia todo lo que viene después de él. También pone las cuentas de una compañía china de mensajería delante de cualquiera que quiera leerlas, cada trimestre."
 CHI_semiconductor_events.321.a: "Lista del intercambio de Hong Kong"
 CHI_semiconductor_events.321.b: "Mantenerse privado y crecer en el flujo de efectivo"
 CHI_semiconductor_events.322.t: "Weixin"
 CHI_semiconductor_events.322.d: "Un equipo Tencent en Guangzhou, comprado por su producto de correo, quiere construir un mensajero telefónico que competiría directamente con QQ. QQ es el negocio en el que toda la compañía descansa. Apoyar al equipo significa financiar un rival a sí mismo; negar deja QQ para conocer el smartphone en sus propios términos."
 CHI_semiconductor_events.322.a: "Que el equipo de Guangzhou lo construya"
 CHI_semiconductor_events.322.b: "Defender QQ en el teléfono"
 CHI_semiconductor_events.323.t: "Supercell"
 CHI_semiconductor_events.323.d: "Tencent puede pagar 8.6 billones de dólares para el control de Supercell, el estudio finlandés detrás del choque de clanes, y posee los juegos en lugar de licenciarlos a China. Es la suma más grande que una empresa china ha pagado por un negocio de juegos. La publicación de los títulos de otras personas no cuesta nada y gana una fracción."
 CHI_semiconductor_events.323.a: "Compra el estudio de forma directa"
 CHI_semiconductor_events.323.b: "Licencia y publicación para otros"
 CHI_semiconductor_events.324.t: "La Licence Freeze"
 CHI_semiconductor_events.324.d: "Los reguladores han dejado de aprobar nuevas licencias de juego y no dirán cuándo se reanudarán, y los ingresos de Tencent dependen de títulos que no pueden lanzar legalmente. Aproximadamente doscientos mil millones de dólares de valor del mercado se ha ido. Construir el aparato de cumplimiento que el Estado quiere es lento y costoso; encauzar el negocio a través de mercados extranjeros no es ninguno."
 CHI_semiconductor_events.324.a: "Construir lo que el regulador pide"
 CHI_semiconductor_events.324.b: "Ingresos por carretera a través de mercados extranjeros"
 CHI_semiconductor_events.325.t: "Qué Tencent Beca"
 CHI_semiconductor_events.325.d: "Veinticinco años de decisiones sobre quién financia Tencent, lo que posee en el extranjero, y hasta qué punto se dobla al regulador han resuelto lo que es Internet de consumo chino."
 CHI_semiconductor_events.325.a: "Un conglomerado de plataforma global"
 CHI_semiconductor_events.325.b: "Una super-app doméstica"
 CHI_semiconductor_events.325.c: "Un editor de juegos con licencia"
 CHI_semiconductor_events.325.e: "Un grupo de mensajería independiente"
 CHI_tencent_global_platform_conglomerate: "Plataforma global Conglomerado"
 CHI_tencent_global_platform_conglomerate_desc: "Tencent posee estudios, redes de pago y mensajería en cuatro continentes, y la mayoría de lo que gana en el extranjero gana a través de empresas que compró en lugar de construir. Las tenencias valen lo que los mercados dicen que valen."
 CHI_tencent_domestic_superapp: "Super-App nacional"
 CHI_tencent_domestic_superapp_desc: "Los servicios de mensajería, pagos, transporte y gobierno se ejecutan a través de una aplicación sobre infraestructura dentro de China. Tencent dejó de ser una empresa que la gente utiliza y se convirtió en la capa todo lo demás está construido sobre."
 CHI_tencent_licensed_games_publisher: "Editor de Juegos Licenciados"
 CHI_tencent_licensed_games_publisher_desc: "Los buques de tensión lo que el regulador aprueba, en el horario que establece el regulador, y las aprobaciones llegan porque el aparato de cumplimiento fue construido antes de ser requerido. Es un negocio más pequeño y estable."
 CHI_tencent_independent_messaging: "Grupo de mensajería independiente"
 CHI_tencent_independent_messaging_desc: "Tencent mantuvo QQ, mantuvo a sus ingenieros, y se mantuvo fuera de los argumentos que consumieron el resto del Internet chino. Su alcance nunca dejó al mensajero."
 CHI_semiconductor_events.330.t: "Veinte millones de Tokio"
 CHI_semiconductor_events.330.d: "Masayoshi Son ha ofrecido a Alibaba veinte millones de dólares después de una reunión que duró minutos, y SoftBank quiere una gran parte de una empresa sin ingresos. Jack Ma puede tomar dinero japonés y la pregunta de propiedad que viene con él. O puede empezar a cargar a los exportadores en el sitio ahora, mientras que todavía están aprendiendo para qué es."
 CHI_semiconductor_events.330.a: "Tome el dinero de SoftBank"
 CHI_semiconductor_events.330.b: "Cargue a los comerciantes y fondos propios"
 CHI_semiconductor_events.331.t: "Taobao Contra eBay"
 CHI_semiconductor_events.331.d: "eBay posee CadaNet y con ella la mayor parte del comercio de consumidores en China, y ha dicho al mercado que el concurso está terminado. Alibaba puede poner un equipo en un piso de Hangzhou y construir un rival que cobra a los vendedores nada durante tanto tiempo como sea necesario. Mantenerse en el comercio empresarial es rentable y cede permanentemente el mercado de consumo."
 CHI_semiconductor_events.331.a: "Construir Taobao y los vendedores de carga nada"
 CHI_semiconductor_events.331.b: "Mantener el comercio de negocio a negocios"
 CHI_semiconductor_events.332.t: "El Yahoo Billion"
 CHI_semiconductor_events.332.d: "Yahoo pagará mil millones de dólares y entregará su operación en China por el 40% de Alibaba, la mayor inversión extranjera jamás realizada en una empresa china de Internet. El dinero resuelve la cuestión de financiación durante una década. También pone un asiento de la junta extranjera sobre la empresa que dirige el comercio del país."
 CHI_semiconductor_events.332.a: "Tome el billón y el asiento de la junta con él"
 CHI_semiconductor_events.332.b: "Mantenga el registro chino"
 CHI_semiconductor_events.333.t: "Alipay deja el Grupo"
 CHI_semiconductor_events.333.d: "El banco central licenciará a los operadores de pago sólo en manos domésticas, y Alipay ha sido trasladado a una empresa Jack Ma controles sin ponerlo a la junta de Alibaba. Los directores lo aprendieron después. Revertir la transferencia significa discutir la licencia con el regulador en su lugar, con el negocio de pago de Alibaba congelado mientras que se ejecuta."
 CHI_semiconductor_events.333.a: "Mantener la transferencia y establecerse con los accionistas"
 CHI_semiconductor_events.333.b: "Retrocederlo y negociar la licencia"
 CHI_semiconductor_events.334.t: "La lista de hormigas está parada"
 CHI_semiconductor_events.334.d: "El listado de Ant Group, el mayor intento jamás, ha sido suspendido dos días antes de comerciar, después de que Jack Ma le dijera a un público de Shanghai que los reguladores dirigen una peluquería. Alibaba puede retirar y reconstruir Ant como una compañía de tenencia financiera supervisada. Presionar significa probar si el estado permitirá que una firma privada sostenga esa gran parte del crédito chino."
 CHI_semiconductor_events.334.a: "Retirar y aceptar la supervisión"
 CHI_semiconductor_events.334.b: "Presione el listado"
 CHI_semiconductor_events.335.t: "Lo que Alibaba Became"
 CHI_semiconductor_events.335.d: "Un cuarto de siglo de decisiones sobre el capital extranjero, el comercio de consumidores y la cantidad de financiación china que una empresa privada puede sostener han resuelto lo que es Alibaba."
 CHI_semiconductor_events.335.a: "Una columna vertebral del comercio supervisada"
 CHI_semiconductor_events.335.b: "Un mercado de consumo abierto"
 CHI_semiconductor_events.335.c: "Una casa comercial de capital extranjero"
 CHI_semiconductor_events.335.e: "Un corredor de exportación al por mayor"
 CHI_alibaba_supervised_commerce_backbone: "Supervisado Comercio Backbone"
 CHI_alibaba_supervised_commerce_backbone_desc: "Almacenes, redes de entrega y centros de datos dentro de China llevan la mayor parte de lo que el país compra, y un regulador se sienta sobre el crédito que se mueve a través de ellos. Alibaba dejó de discutir sobre quién lo supervisa y construyó la cosa que no puede ser reemplazada."
 CHI_alibaba_open_consumer_marketplace: "Mercado abierto de consumidores"
 CHI_alibaba_open_consumer_marketplace_desc: "Cualquiera puede listar y la plataforma toma su parte de lo que vende. Alibaba nunca aceptó a un supervisor sobre su brazo financiero, y el arreglo dura tanto como nadie insiste."
 CHI_alibaba_foreign_capitalised_trading_house: "Comercio exterior-Capitalizado"
 CHI_alibaba_foreign_capitalised_trading_house_desc: "Alibaba dirige el comercio y los accionistas extranjeros administran el registro. El capital llegó más allá de lo que hizo el negocio."
 CHI_alibaba_wholesale_export_broker: "Broker de exportación al por mayor"
 CHI_alibaba_wholesale_export_broker_desc: "Alibaba coincide con las fábricas chinas para los compradores extranjeros y cobra una cuota en la introducción. Nunca tocó el mercado de consumo y nunca necesitó permiso de nadie para seguir adelante."
 CHI_semiconductor_events.340.t: "Toutiao no tiene editores"
 CHI_semiconductor_events.340.d: "La aplicación de noticias de ByteDance clasifica historias por lo que los lectores abren en lugar de por lo que un editor eligió, y Zhang Yiming no quiere ninguna sala de noticias sobre él en absoluto. La máquina encuentra un público más rápido de lo que cualquier escritorio puede. También servirá todo lo que el público siga haciendo clic, y alguien eventualmente preguntará quién decidió."
 CHI_semiconductor_events.340.a: "Deje que el sistema de clasificación decida"
 CHI_semiconductor_events.340.b: "Ponga un escritorio editorial sobre el pienso"
 CHI_semiconductor_events.341.t: "Douyin"
 CHI_semiconductor_events.341.d: "ByteDance puede poner el mismo sistema de clasificación detrás de quince segundos de vídeo y dejar que elija lo que un extraño ve después. Nada en el modelo fue construido para nada más que texto. Mantenerlo en las noticias es el negocio que ya funciona."
 CHI_semiconductor_events.341.a: "Ponga el sistema de clasificación detrás de vídeo corto"
 CHI_semiconductor_events.341.b: "Mantenlo en las noticias y el texto"
 CHI_semiconductor_events.342.t: "Zhang Yiming Apologises"
 CHI_semiconductor_events.342.d: "Los reguladores han cerrado permanentemente a Neihan Duanzi y han sacado a Toutiao de las tiendas de aplicaciones, diciéndole a ByteDance que su algoritmo se adelantaba a los valores fundamentales socialistas. Zhang Yiming puede publicar el autocrítica y contratar a los miles de revisores que el estado espera. Enfrentar el pedido significa argumentar que la salida de una máquina no es el discurso de la empresa."
 CHI_semiconductor_events.342.a: "Publicar la disculpa y contratar a los revisores"
 CHI_semiconductor_events.342.b: "Concurso el orden"
 CHI_semiconductor_events.343.t: "Vender TikTok o perderlo"
 CHI_semiconductor_events.343.d: "Washington ha ordenado a ByteDance que venda el negocio americano de TikTok, y Oracle y Walmart han reunido una oferta en semanas. Beijing acaba de agregar algoritmos de recomendación a su lista de control de exportaciones, por lo que el modelo no puede salir sin licencia. ByteDance puede negarse a exportarlo y perder el mercado americano, o entregar la tecnología con la empresa."
 CHI_semiconductor_events.343.a: "Rechazar a exportar el algoritmo"
 CHI_semiconductor_events.343.b: "Vender el negocio americano con la tecnología"
 CHI_semiconductor_events.344.t: "Divest o Be Banned"
 CHI_semiconductor_events.344.d: "El Congreso ha dado a ByteDance bajo un año para vender las operaciones americanas de TikTok o perder las tiendas de aplicaciones, y los tribunales son la única ruta que queda. Litigating mantiene a la empresa a un costo considerable y puede fracasar de todos modos. Dividir el negocio americano termina la lucha, y la propiedad con él."
 CHI_semiconductor_events.344.a: "Litigate y mantén a la empresa entera"
 CHI_semiconductor_events.344.b: "Dividir el negocio americano fuera"
 CHI_semiconductor_events.345.t: "Qué ByteDance Became"
 CHI_semiconductor_events.345.d: "Catorce años de decisiones sobre quién clasifica el alimento, quién lo revisa, y si el modelo puede salir de China han resuelto lo que es ByteDance."
 CHI_semiconductor_events.345.a: "Un motor soberano de recomendación"
 CHI_semiconductor_events.345.b: "Una plataforma mundial de atención"
 CHI_semiconductor_events.345.c: "Una utilidad de información con licencia"
 CHI_semiconductor_events.345.e: "Un grupo editorial de noticias"
 CHI_bytedance_sovereign_recommendation_engine: "Soberano motor de recomendación"
 CHI_bytedance_sovereign_recommendation_engine_desc: "El modelo que decide lo que un billón de personas ve a continuación fue entrenado en China, funciona en China y no se puede exportar sin licencia. ByteDance abandonó el mercado americano en lugar de enviar los pesos."
 CHI_bytedance_global_attention_platform: "Plataforma de Atención Mundial"
 CHI_bytedance_global_attention_platform_desc: "ByteDance llega más allá de lo que cualquier empresa china ha alcanzado antes, y lo hace en términos que los gobiernos extranjeros renegocian cada vez que eligen. El público es real y el permiso no es permanente."
 CHI_bytedance_licensed_information_utility: "Información Licenciada Utilidad"
 CHI_bytedance_licensed_information_utility_desc: "ByteDance clasifica lo que está autorizado para clasificar y revisar todo antes de ser servido. El regulador dejó de tratarlo como un problema."
 CHI_bytedance_editorial_news_group: "Grupo Editorial News"
 CHI_bytedance_editorial_news_group_desc: "ByteDance mantuvo una sala de noticias sobre el feed y nunca construyó la plataforma de vídeo. Publica noticias, y los argumentos sobre quién eligió el ranking nunca llegaron."
 CHI_TAI_intl_org_blockade_embargo_tt: "Cada país que todavía reconoce [TAI.GetNameWithFlag] está sometido a un embargo de tráfico §Y§!."
 CHI_taiwan_us_support_collapse_tt: "$CHI_taiwan_us_support$ collapses to §Y0§!"
 china_sar.049.t: "Washington retira su garantía"
 china_sar.049.d: "Los Estados Unidos han notificado a Taipei que su garantía de seguridad ya no está en vigor y que se ha rescindido la designación de Taiwán como aliado principal. Se suspenden las transferencias de armas, se cancelan los ejercicios conjuntos y se recorta la dotación de personal de enlace a una presencia señalizada. Taiwán se encuentra ahora sin su principal garante de seguridad."
 china_sar.049.a: "Tendremos que defendernos."