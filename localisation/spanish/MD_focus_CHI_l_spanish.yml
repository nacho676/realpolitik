 CHI_korea_peninsula_tension_display: "$CHI_korea_peninsula_tension$: [?CHI_korea_peninsula_tension]"
 CHI_legitimacy_concentrated_desc: "El Comité Permanente de Politburo ya no necesita quórum - el círculo del Secretario General se ha fusionado con la red. La Comisión Central de Inspección de Disciplina es una cortesía ahora."
 CHI_Lips_and_Teeth: "Lips y dientes"
 CHI_Lips_and_Teeth_desc: "La caracterización histórica de las relaciones coreanas Sino-Norte «tan cercanas como labios y dientes» ha guiado la política china desde la Guerra Coreana. Formalizar esta doctrina compromete a China con la supervivencia del régimen de Kim, profundizando los vínculos con Pyongyang a costa de una reconciliación coreana más amplia."
 CHI_mass_line_campaign: "Campaña de la línea de masas"
 CHI_mass_line_campaign_desc: "Los funcionarios son enviados a las comunidades rurales, obligados a comer con los agricultores y a presentar informes sobre las condiciones locales. Los bienes de lujo se retiran de las oficinas gubernamentales y el gasto público extravagante es condenado públicamente. La campaña reformula el comportamiento oficial visible y restringe el consumo informal que había desviado los recursos estatales a canales privados."
 CHI_Mount_Paektu_Understanding: "Entendimiento de Mount Paektu"
 CHI_Mount_Paektu_Understanding_desc: "Un entendimiento bilateral secreto, concluido a la sombra del Monte Paektu el mitológico lugar de nacimiento de la dinastía Kim formaliza consultas de seguridad chinas con el mando militar norcoreano."
 CHI_nc_inf_cplac_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_cplac|Y0]"
 CHI_nc_inf_intl_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_intl|Y0]"
 CHI_nc_inf_nsc_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_nsc|Y0]"
 CHI_nc_inf_org_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_org|Y0]"
 CHI_nc_inf_pub_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_pub|Y0]"
 CHI_nc_inf_social_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_social|Y0]"
 CHI_nc_inf_ufwd_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_ufwd|Y0]"
 CHI_Normalise_the_Hermit: "Normalizar el Ermitaño"
 CHI_Normalise_the_Hermit_desc: "Con reformas arraigadas, patrocinamos la reintegración formal de Corea del Norte en canales económicos y diplomáticos regionales, terminando décadas de aislamiento y posicionarnos como arquitectos de la apertura de Pyongyang."
 CHI_Nuclear_Insurance: "Seguro nuclear"
 CHI_Nuclear_Insurance_desc: "Ampliamos el reconocimiento de facto del arsenal nuclear de Corea del Norte como un factor disuasivo, no una responsabilidad. Al aceptar a Pyongyang como estado nuclear, proporcionamos seguros contra el colapso del régimen al tiempo que trazamos la condena internacional."
 CHI_operation_new_dawn_desc: "Lanzar una operación decisiva de fuerzas especiales contra la dirigencia de Pionyang. Las redes de Jang y de los «príncipes» determinarán si termina en un golpe limpio, una guerra civil o un desastre."
 CHI_palm_and_fingers_doctrine: "La doctrina de Palm y Fingers"
 CHI_palm_and_fingers_doctrine_desc: "El Tíbet es la palma. Ladakh, Nepal, Sikkim, Bhután y Arunachal son los dedos. La doctrina estratégica exige a los cinco."
 CHI_pla_divestiture_completion: "PLA Divestiture Completation"
 CHI_pla_divestiture_completion_desc: "El PLA ha sido requerido desde hace mucho tiempo para derramar su imperio comercial espeluznante que abarca hoteles, empresas farmacéuticas y empresas comerciales. Completar este proceso restaura el enfoque singular del ejército y elimina una importante fuente de corrupción oficial. Un ejército que dirige hoteles no está pensando en la guerra."
 CHI_Pyongyang_Pivot: "El Pyongyang Pivot"
 CHI_Pyongyang_Pivot_desc: "En lugar de endurecer el régimen, China alienta una cautelosa apertura económica modelada en las reformas de Deng Xiaoping. Una Corea del Norte más próspera sería un vecino más estable y una pareja más tratable."
 CHI_Rare_Earth_Leverage: "Rara Tierra Leverage"
 CHI_Rare_Earth_Leverage_desc: "Las industrias electrónicas avanzadas y semiconductoras de Corea del Sur dependen en gran medida de las exportaciones de tierras raras chinas. Al aprovechar esta dependencia, podemos profundizar los vínculos económicos y aumentar nuestra influencia sobre el cálculo de política exterior de Seúl."
 CHI_Rason_SEZ_Expansion: "Expansión Rason SEZ"
 CHI_Rason_SEZ_Expansion_desc: "La Zona Económica Especial Rason en la costa noreste de Corea del Norte ofrece un caso de prueba para la modernización económica. La inversión china puede desbloquear el acceso portuario y las corrientes de recursos, demostrando la viabilidad de una reforma gradual."
 CHI_Sanctions_Evasion: "Evasión de las sanciones"
 CHI_Sanctions_Evasion_desc: "Si bien apoyamos públicamente las sanciones internacionales, podemos permitir que continúen las corrientes comerciales y financieras transfronterizas. Esto profundiza la dependencia norcoreana de China manteniendo la deniabilidad plausible, aunque el descubrimiento dañaría las relaciones con Occidente."
 CHI_sco_balance_display: "$CHI_sco_balance$: [?CHI_sco_balance]"
 CHI_sco_cohesion_display: "$CHI_sco_cohesion$: [?CHI_sco_cohesion]"
 CHI_scs_island_construction_campaign: "Campaña de construcción de la isla"
 CHI_scs_island_construction_campaign_desc: "Inicie el programa multianual de dragado y construcción en toda la cadena Spratly. Los arrecifes sumergidos se crían en islas artificiales capaces de albergar instalaciones permanentes, ampliando la huella administrativa efectiva de las reclamaciones chinas por miles de kilómetros cuadrados."
 CHI_shanghai_clique_ascendant_desc: "Las luces del Bund tocan cada ministerio. Los contadores de Pudong ahora se sientan en el Consejo Estatal. La red llega más allá de lo que la doctrina hace."
 CHI_shanghai_clique_leaning_desc: "Las redes del Bund tienen voz en cada ministerio. Los delegados provinciales atendieron sus apuestas hacia Pudong."
 CHI_Six_Party_Talks: "Conferencias de seis partidos"
 CHI_Six_Party_Talks_desc: "Las conversaciones entre las seis partes reúnen a China, los Estados Unidos, Rusia, Japón y ambas Coreas para negociar una resolución a la crisis nuclear norcoreana. Al acoger estas conversaciones, podemos posicionarnos como un mediador indispensable y mejorar las relaciones con todas las partes involucradas."
 CHI_technocratic_consolidation_desc: "La Oficina de Investigación del Consejo de Estado es el país. Los planes quinquenales se redactan antes de las reuniones de politburo, no después."
 chi_the_one_china_policy: "La Política Única de China"
 CHI_water_pricing_reform: "Reforma de los precios del agua industrial"
 CHI_water_pricing_reform_desc: "En lugar de la ingeniería del lado del suministro, los precios se utilizan para reducir los desechos. Los aranceles industriales de agua se elevan marcadamente, obligando a la industria pesada a adoptar tecnología de reciclaje y reubicarse en zonas de ventaja comparativa del agua. Los agricultores resisten los aumentos implícitos de costos."
 CHI_Yalu_Defense_Pact: "Pacto de Defensa de Yalu"
 CHI_Yalu_Defense_Pact_desc: "Un acuerdo formal de defensa a lo largo del río Yalu une nuestra planificación militar con Corea del Norte, concediéndonos acceso garantizado al mismo tiempo que la defensa mutua."
 CHI_youth_league_leaning_desc: "Los alumnos de Tuan ocupan puestos adjuntos en la mitad de las provincias. El equilibrio de la patrocinio es cambiante, silenciosamente y constante."
 CHI_youth_league_resurgent_desc: "Todos los diputados provinciales menores de cincuenta años llegaron a través del Tuan. La cohorte está en su lugar. El orden del día sigue."
 paektu_doctrine_southern: "Paektu Doctrine Southern Alert"
 uighur_threat_display: "$uighur_threat$: [?uighur_threat]"
 CHI_back_princeling_network: "Respaldar a las redes de los «príncipes rojos»"
 CHI_back_princeling_network_desc: "Canalizar el clientelismo hacia los hijos de la élite revolucionaria y el establishment de Shanghái, y desplazar el equilibrio de poder hacia la facción de los «príncipes rojos»."
 CHI_promote_youth_league: "Promover a los cuadros de la Liga de la Juventud"
 CHI_promote_youth_league_desc: "Funcionarios ascendidos a través de la Liga de la Juventud Comunista inclinan el equilibrio de poder hacia la facción Tuanpai."
 CHI_SAR_one_china_framework: "Marco de China"
 CHI_SAR_one_china_framework_desc: "Beijing reafirma la base constitucional de su autoridad sobre todas las regiones y territorios administrativos especiales. El marco establece una dirección normativa unificada desde el centro, reconociendo al mismo tiempo los distintos arreglos administrativos de cada región."
 CHI_SAR_liaison_office_reform: "Reforma de la Oficina de Enlace"
 CHI_SAR_liaison_office_reform_desc: "El Consejo de Estado reorganiza sus oficinas de enlace con la SAR en una red de coordinación más integrada. Los canales de comunicación racionalizados entre Beijing y las RAE permiten una aplicación política más rápida y reducir la fricción administrativa."
 CHI_SAR_national_security_framework: "Arquitectura de seguridad nacional"
 CHI_SAR_national_security_framework_desc: "Se amplía un aparato de seguridad nacional unificado para abarcar todos los territorios de la RAE. La coordinación entre las guarnición del Ejército Popular de Liberación, las oficinas de seguridad estatales y las fuerzas policiales locales se formaliza bajo supervisión central."
 CHI_SAR_two_systems_commitment: "Compromiso con dos sistemas"
 CHI_SAR_two_systems_commitment_desc: "Beijing reafirma formalmente el principio «Un País, Dos Sistemas» para todos los SARs elegibles. La autonomía de alto grado está garantizada dentro del marco constitucional, lo que indica una preferencia por el alojamiento sobre la integración."
 CHI_SAR_research_sharing: "Cooperación en materia de investigación"
 CHI_SAR_research_sharing_desc: "Beijing establece programas conjuntos de investigación que conectan las universidades continentales y los laboratorios estatales con las instituciones del SAR. La iniciativa profundiza los lazos académicos y tecnológicos al ampliar la capacidad general de investigación de China."
 CHI_SAR_military_corporation_sharing: "Integración de la industria defensa"
 CHI_SAR_military_corporation_sharing_desc: "Los contratistas de defensa y las empresas de ingeniería con sede en el SAR se incorporan a la red de adquisiciones continental. Los estándares de producción compartidos y las cadenas de suministro aumentan la capacidad de salida del Ejército Popular de Liberación."
 CHI_SAR_military_corporation_sharing_mio_tt: "Regiones Administrativas Especiales acceden a organizaciones militares-industriales chinas"
 CHI_SAR_one_system_declaration: "Declaración de un sistema"
 CHI_SAR_one_system_declaration_desc: "El Consejo de Estado señala un cambio de política hacia una integración más profunda de la gobernanza de las RAE con los sistemas continentales. Los marcos jurídicos y administrativos separados se armonizarán gradualmente con la República Popular en los próximos años."
 CHI_SAR_han_superiority: "Doctrina de Han Primacy"
 CHI_SAR_han_superiority_desc: "Beijing abandona el modelo estatal multiétnico a favor de una única identidad nacional centrada en la mayoría de Han. Se aceleró la «política étnica de segunda generación» desarrollada por académicos como Hu Angang y Hu Lianhe, la autonomía basada en el origen étnico y la asimilación en todas las regiones."
 CHI_HKG_greater_bay_area: "Mayor Iniciativa en el área de la bahía"
 CHI_HKG_greater_bay_area_desc: "Beijing y Hong Kong lanzaron conjuntamente el proyecto Guangdong-Hong Kong-Macao Greater Bay Area, que une once ciudades a un solo corredor de innovación y finanzas. El esquema representa el programa de integración regional más ambicioso de China desde la Zona Económica Especial Shenzhen."
 CHI_HKG_financial_integration: "Integración del sistema financiero"
 CHI_HKG_financial_integration_desc: "Los mecanismos transfronterizos de flujo de capital se amplían con arreglo a los esquemas Stock Connect y Bond Connect. El papel de Hong Kong como principal centro de renminbi offshore es formalizado, profundizando la interdependencia con los mercados financieros continentales."
 CHI_HKG_express_rail_link: "Enlace exprés del ferrocarril"
 CHI_HKG_express_rail_link_desc: "Se ha completado el enlace de tren exprés Guangzhou-Shenzhen-Hong Kong Express, que conecta Hong Kong directamente con la red ferroviaria de alta velocidad de China. Los tiempos de viaje entre Hong Kong y las principales ciudades continentales se reducen drásticamente, acelerando el movimiento de personas y comercio."
 CHI_HKG_individual_visit_scheme: "Plan de visita individual"
 CHI_HKG_individual_visit_scheme_desc: "Beijing amplía el esquema de visita individual, permitiendo a los residentes de las ciudades adicionales viajar a Hong Kong sin restricciones de viaje grupal. La afluencia de turistas y compradores continentales proporciona un impulso sustancial a los sectores minoristas y de servicios de Hong Kong."
 CHI_HKG_shenzhen_hk_stock_connect: "Las acciones de Shenzhen-Hong Kong conectan"
 CHI_HKG_shenzhen_hk_stock_connect_desc: "Un programa de acceso mutuo a los mercados vincula las bolsas de valores de Hong Kong y Shenzhen, lo que permite a los inversores de ambas partes comerciar entre sí en sus acciones cotizadas. El esquema también cimenta el papel indispensable de Hong Kong como la puerta de entrada para las corrientes transfronterizas de capital."
 CHI_HKG_electoral_reform: "Reforma del sistema electoral"
 CHI_HKG_electoral_reform_desc: "Beijing reestructura el marco electoral del Consejo Legislativo de Hong Kong, reduciendo los escaños elegidos directamente e introduciendo un mecanismo de verificación de candidatos para asegurar sólo «patriots» stand for office. La reforma cambia definitivamente el poder político de la oposición a favor de la democracia."
 CHI_HKG_media_freedom: "Libertad de Prensa Salvaguardias"
 CHI_HKG_media_freedom_desc: "En una concesión a la presión de la sociedad civil, Beijing está de acuerdo con las protecciones legales para la independencia editorial en Hong Kong. Las organizaciones internacionales de medios interpretan la garantía como señal de que el modelo «dos sistemas» será honrado hasta 2047."
 CHI_HKG_censorship: "Censura de Internet y Medios"
 CHI_HKG_censorship_desc: "Beijing dirige a las autoridades de Hong Kong para alinear el internet de la ciudad y emitir regulaciones con estándares continentales. Los sitios web que acogen contenidos considerados políticamente sensibles están bloqueados, y los editores de periódicos principales se enfrentan a presión para el autocensor."
 CHI_HKG_moral_national_education: "Educación moral y nacional"
 CHI_HKG_moral_national_education_desc: "En las escuelas de Hong Kong se introduce un nuevo plan de estudios nacional obligatorio, en el que se hace hincapié en la lealtad al Partido Comunista y una visión fundamental de la historia china. La política genera una oposición pública significativa, pero procede bajo dirección central."
 CHI_HKG_national_security_law: "Artículo 23 Ley de seguridad nacional"
 CHI_HKG_national_security_law_desc: "Hong Kong promulga la legislación nacional de seguridad conforme a lo dispuesto en el artículo 23 de la Ley Fundamental, tipificando como delito la secesión, la subversión, el terrorismo y la colusión con las potencias extranjeras. La ley marca el final efectivo de la cultura política separada de la ciudad."
 CHI_HKG_lok_ma_chau_loop: "Desarrollo del Lok Ma Chau Loop"
 CHI_HKG_lok_ma_chau_loop_desc: "En el Lok Ma Chau Loop se establece una zona dedicada a la innovación y la tecnología, un terreno en la frontera de Shenzhen destinado al desarrollo conjunto. El parque está destinado a atraer instituciones de investigación y empresas tecnológicas que buscan proximidad tanto a Hong Kong como al continente."
 CHI_HKG_2030_study: "Hong Kong 2030+ Estudio Estratégico"
 CHI_HKG_2030_study_desc: "El Gobierno de Hong Kong publica su estrategia de planificación espacial a largo plazo, identificando sitios para nuevas áreas de desarrollo, corredores de transporte y tierras industriales. El estudio enmarca el crecimiento físico de Hong Kong dentro del contexto de la integración de Greater Bay Area."
 CHI_HKG_palace_museum: "Museo del Palacio de Hong Kong"
 CHI_HKG_palace_museum_desc: "Una rama del Museo del Palacio de Pekín se establece en el Distrito Cultural Kowloon Occidental de Hong Kong, mostrando artefactos en préstamo de la colección Forbidden City. El proyecto se presenta como un puente cultural entre Hong Kong y el continente, señalando una importante atención internacional."
 CHI_HKG_zhuhai_macau_bridge: "Puente Hong Kong-Zhuhai-Macao"
 CHI_HKG_zhuhai_macau_bridge_desc: "Se completa el sistema de puentes más largo del mundo, que conecta Hong Kong, Zhuhai y Macao a través del Estuario del Río Perla. La estructura reduce drásticamente los tiempos de viaje por tierra entre las tres ciudades y sirve como columna física de la integración de Greater Bay Area."
 CHI_HKG_lok_ma_chau_station: "Ampliación de la estación de Lok Ma Chau"
 CHI_HKG_lok_ma_chau_station_desc: "El cruce fronterizo de Lok Ma Chau se actualiza con instalaciones expandidas de pasajeros y fletes, reduciendo la congestión en uno de los puntos de entrada más ocupados de Hong Kong. La mejora del rendimiento logístico acelera el comercio transfronterizo y los flujos de conmutación."
 CHI_SAR_integrate_HKG: "Integración de Hong Kong"
 CHI_SAR_integrate_HKG_desc: "Con los sistemas políticos y económicos de Hong Kong totalmente alineados con el continente, Beijing disuelve formalmente la condición administrativa separada del SAR. La antigua colonia se incorpora como municipio administrado directamente de la República Popular."
 CHI_MAC_pearl_river_delta: "Integración del Delta del río Perla"
 CHI_MAC_pearl_river_delta_desc: "Macao se incorpora formalmente en la zona económica del Delta del Río Perla, con inversiones de infraestructura orientadas a reducir su aislamiento económico. El puente Hong Kong-Zhuhai-Macao se convierte en la columna vertebral de una nueva red de transporte transfronterizo."
 CHI_MAC_lotus_flower_economy: "Lotus Flore Economía"
 CHI_MAC_lotus_flower_economy_desc: "Macao lanza una iniciativa de remarcación económica anclada en la identidad distintiva del territorio como SAR portugués-chino. En lugar de apuntar a un solo sector, la estrategia reposiciones Macao como «centro mundial del turismo y el ocio», una marca que enmarca todos los esfuerzos de diversificación aguas abajo y se alinea con la visión de Beijing para el área de Gran Bahía."
 CHI_MAC_financial_services: "Centro de servicios financieros offshore"
 CHI_MAC_financial_services_desc: "El marco regulatorio de Macao se actualiza para atraer banca offshore, emisión de bonos y negocio de liquidación de renminbi. La herencia legal portuguesa del territorio se comercializa como una ventaja para los inversores lusophone que buscan la exposición al continente."
 CHI_MAC_infrastructure_link: "Enlace de la infraestructura cruzada"
 CHI_MAC_infrastructure_link_desc: "Un nuevo cruce fronterizo y extensión de ferrocarril ligero conecta la zona de desarrollo Cotai de Macao directamente con la Zona de Cooperación In-Depth de Guangdong-Macao en la isla de Hengqin. El proyecto integra físicamente la huella económica de Macao con el continente."
 CHI_MAC_guangdong_integration: "Acuerdo de integración de Guangdong"
 CHI_MAC_guangdong_integration_desc: "Un acuerdo de cooperación integral con la provincia de Guangdong alinea los reglamentos de planificación, legales y financieros de Macao con estándares continentales. Los funcionarios describen el acuerdo como un modelo para la convergencia pacífica de las RAE y la gobernanza continental."
 CHI_SAR_integrate_MAC: "Integración completa de Macao"
 CHI_SAR_integrate_MAC_desc: "Tras décadas de profundización de la armonización económica y legal, se disuelve el estatus SAR de Macao. El territorio se absorbe en el sistema administrativo provincial de Guangdong, terminando la etapa final del traspaso de 1999."
 CHI_MAC_cultural_autonomy_push: "Movimiento del Patrimonio Portugués"
 CHI_MAC_cultural_autonomy_push_desc: "Las organizaciones civiles hacen campaña para preservar la identidad cultural portuguesa y china de Macao contra la aceleración de la integración continental. Las demandas incluyen protección legal para el idioma portugués, la comunidad macanesa y el pluralismo jurídico único del territorio."
 CHI_MAC_lusophone_connections: "Estrategia de la puerta del puerto de Lusophone"
 CHI_MAC_lusophone_connections_desc: "Macao se posiciona como un puente indispensable entre China y el mundo de Lusophone ampliando su Foro para la Cooperación Económica y Comercial. El reconocimiento internacional de este papel único constituye un argumento político para mantener la autonomía de alto grado."
 CHI_TIB_plateau_development: "Fondo de Desarrollo de la Meseta"
 CHI_TIB_plateau_development_desc: "El Consejo de Estado pone en marcha un programa de inversión a gran escala para la Región Autónoma del Tíbet, destinado a infraestructuras, viviendas y servicios públicos. El programa refleja la Estrategia de Desarrollo Occidental, pero se enmarca internamente como una iniciativa de alivio de la pobreza."
 CHI_TIB_railway_modernization: "Prórroga del ferrocarril qinghai-Tibet"
 CHI_TIB_railway_modernization_desc: "Se aprueba una segunda fase del ferrocarril Qinghai-Tibet, que extiende la línea a Shigatse y eventualmente Nyingchi cerca de la frontera india. El proyecto reduce el aislamiento logístico del Tíbet y acelera el movimiento de colonos y fuerzas de seguridad de Han."
 CHI_TIB_release_falun_gong: "Falun Gong Amnistía"
 CHI_TIB_release_falun_gong_desc: "En un gesto calculado de apertura, Beijing libera a los practicantes de Falun Gong encarcelados y suaviza las restricciones sobre las actividades religiosas del movimiento en la Región Autónoma del Tíbet. La concesión atrae elogios cautelosos de los gobiernos occidentales y señala un enfoque más suave del disentimiento religioso."
 CHI_TIB_return_dalai_lama: "Regreso del Dalai Lama"
 CHI_TIB_return_dalai_lama_desc: "Después de prolongadas negociaciones de back-channel, Beijing y los representantes del Dalai Lama llegan a un acuerdo que permite al líder espiritual tibetano volver a Lhasa en una capacidad ceremonial. El acuerdo deja de lado la autonomía política pero genera una buena voluntad significativa en las capitales internacionales."
 CHI_TIB_sinification: "Campaña Patriótica de Educación"
 CHI_TIB_sinification_desc: "El partido lanza un programa sistemático de reeducación ideológica en monasterios y escuelas tibetanos, que exige denuncias del Dalai Lama y promesas de lealtad a la patria. La campaña se modela en la iniciativa «Strike Hard» de los años 1990 y gestionada por equipos de trabajo especialmente desplegados."
 CHI_TIB_autonomy_preservation: "Marco de autonomía genuina"
 CHI_TIB_autonomy_preservation_desc: "En respuesta a la presión internacional y a los disturbios recurrentes, Beijing abre negociaciones con representantes de Dalai Lama sobre la ampliación de la autonomía cultural y religiosa. La propuesta de Estrasburgo y el Enfoque de la Vía Media sirven de base para las discusiones en canales."
 CHI_TIB_cultural_integration: "Sinicización de la gobernanza"
 CHI_TIB_cultural_integration_desc: "Los funcionarios de Han son nombrados para altos cargos en el aparato administrativo, judicial y de seguridad del Tíbet. El mandarín reemplaza al tibetano como idioma de gobierno, y el plan de estudios en todas las escuelas estatales está estandarizado con contenido continental."
 CHI_SAR_integrate_TIB: "Integración completa del Tíbet"
 CHI_SAR_integrate_TIB_desc: "Con autoridad religiosa neutralizada, estructuras administrativas totalmente alineadas y transformaciones demográficas completas, se disuelve el estado residual de la Región Autónoma del Tíbet. El Tíbet se reincorpora como una provincia ordinaria bajo la administración directa del gobierno central."
 CHI_TIB_buddhist_cultural_zone: "Zona de Preservación Cultural Budista"
 CHI_TIB_buddhist_cultural_zone_desc: "En torno al Palacio de Potala y el Templo de Jokhang se establece una zona de preservación designada, que otorga un reconocimiento formal limitado al budismo tibetano como institución del patrimonio cultural. Los críticos describen la concesión como un compromiso orientado hacia el turismo que evita la libertad religiosa sustantiva."
 CHI_TIB_silk_road_gateway: "Camino de la Seda Himalaya"
 CHI_TIB_silk_road_gateway_desc: "La posición geográfica del Tíbet en el cruce de Franja y la Ruta corredores del Asia meridional se aprovecha para la inversión en infraestructura fronteriza, hidroeléctrica y logística comercial. La iniciativa integra la economía del Tíbet con los mercados de Nepal y Asia meridional, al tiempo que profundiza la dependencia continental."
 CHI_TIB_monastery_economy: "Monasterio Economía"
 CHI_TIB_monastery_economy_desc: "Se permite a las instituciones monásticas tibetanas, históricamente la columna vertebral de la economía regional, operar empresas comerciales dentro del marco SAR. El turismo de peregrinación, la producción tradicional de medicinas y las industrias artesanales generan ingresos que apoyan tanto los monasterios como las comunidades locales."
 CHI_TIB_plateau_resources: "Estudio mineral de meseta"
 CHI_TIB_plateau_resources_desc: "La Región Autónoma del Tíbet lanza una encuesta independiente que identifica importantes depósitos de litio, cobre y cromo en la meseta tibetana. Las autoridades de la SAR negocian acuerdos de participación en los ingresos que retienen una parte de los ingresos de extracción dentro del presupuesto regional."
 CHI_ETK_corridor_investment: "Franja y la Ruta Inversión del corredor"
 CHI_ETK_corridor_investment_desc: "Xinjiang es designado el portal terrestre principal de la Iniciativa Franja y la Ruta, atrayendo una inversión estatal masiva en infraestructura ferroviaria, gasoducto y carreteras. El termino norte del Corredor Económico China-Pakistán en Kashgar transforma la geografía económica de la región."
 CHI_ETK_resource_extraction: "Energía y Extracción Mineral"
 CHI_ETK_resource_extraction_desc: "Las reservas de petróleo y gas de la cuenca del Tarim se expanden bajo un programa de desarrollo estatal que prioriza la construcción de oleoductos y la capacidad de refinación. La participación de Xinjiang en la producción nacional de petróleo aumenta significativamente, aunque las transferencias de ingresos al centro siguen siendo una queja persistente."
 CHI_ETK_silk_road_commerce: "Seda Road Commerce Initiative"
 CHI_ETK_silk_road_commerce_desc: "Las redes comerciales tradicionales Uyghur de Xinjiang se incorporan formalmente en la política comercial regional, con licencias preferenciales para el comercio transfronterizo con repúblicas centroasiáticas. La política revive un patrón histórico de comercio mediado por Uyghur que data de la dinastía Tang."
 CHI_ETK_oilfield_development: "Tarim Basin Oilfield desarrollo"
 CHI_ETK_oilfield_development_desc: "El gobierno de Xinjiang SAR negocia acuerdos conjuntos con empresas energéticas nacionales para la exploración de la cuenca del Tarim, asegurando una parte sin precedentes de regalías de extracción para infraestructura regional. Los campos petroleros están entre los más grandes de China y apoyan la independencia fiscal de la región."
 CHI_ETK_strike_hard_campaign: "Huelga Campaña dura"
 CHI_ETK_strike_hard_campaign_desc: "La campaña «Strike Hard, Maximum Pressure» dirigida a redes separatistas Uyghur se relanzó a escala sin precedentes, incorporando la vigilancia digital, la detención masiva y la represión sistemática de la práctica religiosa. Organizaciones internacionales de derechos humanos documentan abusos generalizados."
 CHI_ETK_education_centres: "Centros de formación profesional de habilidades"
 CHI_ETK_education_centres_desc: "En Xinjiang se establece una red de centros de detención extrajudicial, que se describen oficialmente como «Centros de Educación y Capacitación en materia de Habilidades Profesionales». En toda la región se implementa una cuadrícula de vigilancia digital completa que abarca reconocimiento facial, bases de datos de ADN y monitoreo de smartphones."
 CHI_ETK_total_survaillance_infrastructure: "Infraestructura total de vigilancia"
 CHI_ETK_total_survaillance_infrastructure_desc: "Una red de vigilancia regional se construye en Xinjiang, integrando cámaras de reconocimiento facial, puestos de control biométricos y software obligatorio de monitoreo de smartphones. El sistema otorga a las autoridades una visibilidad casi total sobre los movimientos de población y la actividad en línea."
 CHI_SAR_integrate_ETK: "Xinjiang integración completa"
 CHI_SAR_integrate_ETK_desc: "Tras la supresión casi total de la actividad separatista y el desplazamiento de las estructuras sociales Uyghur tradicionales, se disuelve el marco administrativo SAR de Xinjiang. La región se reorganiza bajo la administración provincial estándar sin disposiciones especiales de autonomía étnica."
 CHI_ETK_autonomy_statute: "Estatuto de autonomía Xinjiang"
 CHI_ETK_autonomy_statute_desc: "Una nueva ley regional de autonomía otorga a las comunidades musulmanas Xinjiang derechos formales a la práctica religiosa, educación Uyghur-medium y derecho consuetudinario en asuntos personales. El estatuto está respaldado por un selecto grupo de organizaciones islámicas internacionales."
 CHI_ETK_islamic_governance_framework: "Marco de gobernanza islámico"
 CHI_ETK_islamic_governance_framework_desc: "Beijing adopta un enfoque más conciliador en Xinjiang, permitiendo la práctica religiosa islámica regulada, ampliando la educación en Uyghur y nombrando a más funcionarios de Uyghur al gobierno local. La política refleja la relativa indulgencia del período anterior a 2017."
 CHI_ETK_BRI_hub: "Zona Económica Especial de Kashgar"
 CHI_ETK_BRI_hub_desc: "Kashgar es designado una Zona Económica Especial con trato tributario preferencial y procedimientos aduaneros simplificados para Franja y la Ruta comercio de tránsito. La zona posiciona a Xinjiang como un centro comercial que une Asia Central, Asia Meridional y Oriente Medio."
 CHI_TAI_combat_the_traitors: "Combatir a los Traidores"
 CHI_TAI_combat_the_traitors_desc: "Beijing adopta una postura intransigente hacia Taiwán, designando oficialmente a los líderes independentistas como traidores y señalando que la reunificación por la fuerza sigue siendo una opción activa. La declaración aumenta considerablemente las tensiones entre ejes y coloca al PLA en una mayor disposición."
 CHI_TAI_cut_us_support: "Ruptura de los lazos EE. UU.-Taiwán"
 CHI_TAI_cut_us_support_desc: "Beijing lleva a cabo una campaña de influencia sostenida contra los círculos políticos y empresariales estadounidenses, presionando contra las ventas de armas y contactos formales con Taipei. La operación está diseñada para erosionar la credibilidad del compromiso de Estados Unidos con la seguridad de Taiwán."
 CHI_TAI_outward_island_infrastructure: "Infraestructura Militar de la Isla"
 CHI_TAI_outward_island_infrastructure_desc: "Tras la incautación de Taiwán, el Ejército Popular de Liberación comienza a construir instalaciones navales y aéreas fortificadas en las islas exteriores. Las nuevas bases extienden la proyección energética de China hasta el fondo del Pacífico occidental y alteran sustancialmente el equilibrio regional de fuerza."
 CHI_TAI_cross_strait_policy: "Revisión de políticas transversales"
 CHI_TAI_cross_strait_policy_desc: "El Consejo de Estado encarga un examen amplio de la política intersectorial, examinando las opciones diplomáticas, económicas y militares para la reunificación. La revisión establece la agenda política para el enfoque de China hacia Taiwán durante la próxima década."
 CHI_TAI_economic_track: "Trayectoria económica cruzada"
 CHI_TAI_economic_track_desc: "Beijing abre un diálogo económico estructurado con Taipei centrado en la facilitación del comercio, la cooperación industrial y el acceso a los mercados a largo plazo. El objetivo es construir un beneficio mutuo suficiente para que las conversaciones políticas se vuelvan más difíciles de resistir."
 CHI_TAI_political_track: "Trayectoria política transversal"
 CHI_TAI_political_track_desc: "Paralelamente a la participación económica, Beijing establece un camino político dedicado a reactivar los mecanismos de diálogo, reducir las tensiones y preparar el terreno para una solución negociada aceptable para ambas partes."
 CHI_TAI_expand_cross_strait_trade: "Amplíe el comercio cruzado"
 CHI_TAI_expand_cross_strait_trade_desc: "Basándose en la lógica de las conversaciones del ECFA y posteriores sobre el comercio de servicios, Beijing ofrece nuevas concesiones comerciales y menores barreras para las empresas de Taiwán que operan en el continente. La política está diseñada para hacer visiblemente rentable la cooperación económica a las élites políticas y empresariales de Taiwán."
 CHI_TAI_mainland_market_access: "Acceso a los mercados continentales"
 CHI_TAI_mainland_market_access_desc: "China otorga a los inversores y exportadores de Taiwán acceso preferencial a determinados sectores continentales, especialmente manufacturas avanzadas y servicios. El acuerdo refleja los esfuerzos del mundo real por vincular Taiwán más estrechamente con la economía continental a través de oportunidades en lugar de fuerza."
 CHI_TAI_business_delegations: "Delegaciones comerciales de Cross-Strait"
 CHI_TAI_business_delegations_desc: "Los grupos comerciales semioficiales, las cámaras de comercio y los principales agentes industriales vuelven a realizar visitas periódicas. Estas delegaciones crean una manera políticamente más segura de profundizar la cooperación práctica al tiempo que construyen grupos en Taiwán que se benefician de relaciones estables."
 CHI_TAI_transport_links: "Enlaces de transporte directo"
 CHI_TAI_transport_links_desc: "Se amplían los vuelos directos, los arreglos de transporte marítimo y la coordinación logística para reducir la separación práctica entre ambas partes. El movimiento comercial y pasajero más rápido reduce el costo político de la participación continua y normaliza aún más el intercambio transversal."
 CHI_TAI_semiconductor_coordination: "Coordinación de semiconductores"
 CHI_TAI_semiconductor_coordination_desc: "Taipei acepta una coordinación estratégica limitada en cadenas de suministro de alta tecnología, especialmente semiconductores y fabricación de precisión. El acuerdo refleja la verdadera interdependencia económica entre el sector de chips y la demanda continental de Taiwán, al tiempo que se detiene a corto plazo de una unión política franca."
 CHI_TAI_investment_safeguards: "Salvaguardias de inversión"
 CHI_TAI_investment_safeguards_desc: "Los negociadores de Taiwán insisten en que la integración económica más profunda debe ir acompañada de garantías legales y reglamentarias que protegen a las empresas e instituciones locales. Este enfoque se basa en preocupaciones internas reales de que la inversión transversal no debe convertirse en un vehículo para la absorción política."
 CHI_TAI_joint_industrial_planning: "Planificación industrial conjunta"
 CHI_TAI_joint_industrial_planning_desc: "Los planificadores de ambas partes comienzan a coordinar la infraestructura, las cadenas de suministro industrial y los sectores de gran densidad tecnológica. El proceso transforma los vínculos comerciales dispersos en algo más cercano a una estrategia de desarrollo transversal gestionada."
 CHI_TAI_deep_economic_integration: "Integración económica profunda"
 CHI_TAI_deep_economic_integration_desc: "Tras años de acuerdos acumulados, el comercio cruzado se formaliza en un marco denso de inversión, logística e interdependencia industrial. En esta etapa, la separación económica se ha vuelto cada vez más cara para ambas partes, especialmente para Taiwán."
 CHI_TAI_resume_party_contacts: "Reanudar contactos del partido"
 CHI_TAI_resume_party_contacts_desc: "Pekín reactiva canales con partidos y organizaciones en Taiwán dispuestos a discutir una relación menos confrontacional. El enfoque está basado en el patrón real del diálogo CCP-KMT y otros contactos políticos no oficiales que han sustituido periódicamente a la diplomacia estatal-estado."
 CHI_TAI_pro_china_party_networks_mission: "Redes de partido Pro-China"
 CHI_TAI_pro_china_party_networks_mission_desc: "Las redes empresariales y políticas de China a través del Estrecho cultivan activamente el apoyo a los partidos prounificación en Taiwán. Mientras nuestra influencia siga siendo considerable, estos esfuerzos desplazan poco a poco la opinión pública hacia la coalición Pan-Azul."
 CHI_TAI_offer_confidence_measures: "Ofrecer medidas de confianza"
 CHI_TAI_offer_confidence_measures_desc: "Beijing propone un conjunto de medidas prácticas para reducir la escalada, incluidos los canales ordinarios de comunicación y la moderación en la señalización pública. La intención es convencer a los moderados de Taiwán de que el compromiso puede reducir el riesgo sin forzar inmediatamente una decisión de soberanía."
 CHI_TAI_legislative_exchange_forum: "Foro de intercambio legislativo"
 CHI_TAI_legislative_exchange_forum_desc: "Las delegaciones de legisladores, asesores y especialistas en políticas comienzan a reunirse por conductos semioficiales para debatir el comercio, el transporte y la coordinación administrativa. Tales foros dan a la participación transversal una cara parlamentaria y procesal, suavizando la imagen de la presión superior."
 CHI_TAI_local_government_dialogue: "Diálogo entre los gobiernos locales"
 CHI_TAI_local_government_dialogue_desc: "Las administraciones municipales, los gobiernos de condado y los funcionarios subnacionales abren conversaciones prácticas sobre transporte, turismo e inversión. Esto refleja un patrón del mundo real en el que los vínculos municipales y locales a menudo avanzaban incluso cuando las relaciones formales de nivel central eran tensas."
 CHI_TAI_reaffirm_the_1992_consensus: "Reafirmar el consenso de 1992"
 CHI_TAI_reaffirm_the_1992_consensus_desc: "Los moderados de Taiwán eligen volver explícitamente al marco que hay una China, preservando al mismo tiempo su propia interpretación de ese principio. La fórmula es polémica en el hogar, pero sigue siendo la base más realista para las negociaciones serias de tracción cruzada."
 CHI_TAI_suspend_independence_initiatives: "Iniciativas para la Independencia"
 CHI_TAI_suspend_independence_initiatives_desc: "Taipei suspende silenciosamente las medidas que empujarían a la isla hacia la separación formal en derecho o diplomacia. Esto no termina el autogobierno, pero señala que Taiwán está preparado para estabilizar la situación en lugar de escalarla."
 CHI_TAI_back_channel_settlement: "Solución de canales traseros"
 CHI_TAI_back_channel_settlement_desc: "Las organizaciones semioficiales de ambas partes pasan del fomento de la confianza a la negociación política sustantiva. Basándose en el modelo de contactos de estilo ARATS-SEF, elaboran un marco de asentamiento diseñado para hacer que la reunificación pacífica parezca ordenada, gradual y materialmente beneficiosa."
 CHI_TAI_peaceful_reunification_accord: "Acuerdo de Reunificación Pacífica"
 CHI_TAI_peaceful_reunification_accord_desc: "Después de años de progreso diplomático incremental, Beijing y Taipei firman un acuerdo marco histórico que prevé la adhesión de Taiwán a la República Popular como Región Administrativa Especial. El acuerdo garantiza las instituciones democráticas y el sistema legal existentes de Taiwán durante un período de transición de cincuenta años."
 CHI_TAI_military_buildup: "Refuerzo militar a ambos lados del estrecho"
 CHI_TAI_military_buildup_desc: "El Ejército Popular de Liberación acelera la adquisición de buques anfibios de asalto, naves de aterrizaje y misiles de precisión de largo alcance configurados para una contingencia del Estrecho de Taiwán. Los ejercicios conjuntos simulan la incautación de islas offshore y la supresión de las defensas aéreas de Taiwán."
 CHI_TAI_amphibious_doctrine: "Doctrina conjunta de aterrizaje en la isla"
 CHI_TAI_amphibious_doctrine_desc: "The PLA Marine Corps and Eastern Theatre Command publish a revised joint operational teaching for combined arms amphibious assaults. La doctrina es clasificada pero ampliamente analizada por agencias de inteligencia extranjeras como un plan directo para una contingencia en Taiwán."
 CHI_TAI_blockade_declaration: "El bloqueo del estrecho de Taiwán"
 CHI_TAI_blockade_declaration_desc: "La Armada del PLA declara una zona de exclusión naval alrededor de Taiwán, sembrando carriles comerciales y cortando las importaciones de combustible y materia prima. El bloqueo está acompañado de ejercicios aéreos prolongados y pruebas de misiles balísticos, que desencadenan una crisis internacional."
 CHI_TAI_operation_storm: "Operación Tormenta"
 CHI_TAI_operation_storm_desc: "El Ejército Popular de Liberación lanza su larga campaña anfibia contra Taiwán. Las huelgas de misiles neutralizan las defensas aéreas y la infraestructura de mando mientras las fuerzas de aterrizaje cruzan el estrecho bajo cubierta aérea y naval. La operación marca la acción militar más significativa en Asia desde la Guerra de Corea."
 CHI_TAI_economic_miracle: "Integración de milagros económicos en Taiwán"
 CHI_TAI_economic_miracle_desc: "La industria semiconductora avanzada de Taiwán, el sector financiero y el ecosistema tecnológico se integran formalmente en el marco de planificación económica nacional. La adquisición representa una ganancia transformadora en la capacidad tecnológica de China, especialmente en la fabricación de chips."
 CHI_OMG_steppe_development: "Iniciativa de desarrollo de Mongolia Interior"
 CHI_OMG_steppe_development_desc: "El Consejo de Estado lanza un programa de desarrollo específico para la Región Autónoma de Mongolia Interior, que invierte en infraestructura energética, corredores logísticos y parques industriales. La iniciativa integra más profundamente a Mongolia Inner en la red económica nacional y aborda al mismo tiempo la persistente pobreza rural."
 CHI_OMG_northern_corridor: "Infraestructura del Corredor Norte"
 CHI_OMG_northern_corridor_desc: "Se aprueba un nuevo corredor de transporte y transporte ferroviario que une Mongolia Interior a la aglomeración Beijing-Tianjin-Hebei, reduciendo los tiempos de tránsito para carbón, minerales terrestres raros y productos agrícolas. El corredor apoya el papel de Mongolia Interior como el interior energético del norte de China."
 CHI_OMG_mandarin_education: "Política de Educación del Mandarín-Medium"
 CHI_OMG_mandarin_education_desc: "El gobierno regional anuncia una transición gradual que requiere que todas las escuelas primarias y secundarias enseñen temas básicos en mandarín en lugar de mongoles. La política, modelada sobre medidas similares en el Tíbet y Xinjiang, desencadena protestas generalizadas en las ciudades de Mongolia Interior y comunidades pastorales."
 CHI_OMG_cultural_recognition: "Reconocimiento Cultural de Mongolia"
 CHI_OMG_cultural_recognition_desc: "Beijing reconoce formalmente la identidad cultural y lingüística mongola de la RAE interna de Mongolia, garantizando la educación entre Mongolia, la radiodifusión estatal y el estado oficial del guión. La política representa una desviación deliberada del enfoque asimilacionista aplicado en el Tíbet y Xinjiang."
 CHI_OMG_han_settlement_program: "Programa de asentamiento de Han"
 CHI_OMG_han_settlement_program_desc: "La migración patrocinada por el Estado desde Hebei, Shaanxi y Gansu acelera la transformación demográfica de Mongolia Interior. Se han establecido nuevas municipalidades en tierras de pastoreo y políticas de empleo preferenciales que afianzan aún más la mayoría de Han en las zonas urbanas."
 CHI_SAR_integrate_OMG: "Integración completa de Mongolia"
 CHI_SAR_integrate_OMG_desc: "Tras la transformación demográfica y cultural, se disuelve el estatus SAR de Mongolia Interior y se reestructura la región como división administrativa estándar a nivel provincial. El reconocimiento formal de la autonomía mongol se sustituye por las disposiciones generales de protección de las minorías étnicas aplicables en todo el PRC."
 CHI_OMG_greater_mongolia_vision: "Visión Pan-Mongolian"
 CHI_OMG_greater_mongolia_vision_desc: "Los defensores del movimiento cultural interno de Mongolia articulan una visión de vínculos más estrechos con el estado independiente de Mongolia, invocando historia compartida, lenguaje y patrimonio nómada. Beijing tolera el encuadre cultural manteniendo al mismo tiempo límites estrictos a cualquier implicación política."
 OMG_steppe_livestock_industry: "Modernización pecuaria de estepas"
 OMG_steppe_livestock_industry_desc: "Las industrias tradicionales de cachemir, mutton y lácteos en Mongolia se reestructuran bajo un modelo cooperativo que vincula a las familias de pastores con las cadenas nacionales de suministro. El programa mejora los ingresos de los hogares preservando al mismo tiempo elementos del estilo de vida pastoral."
 CHI_OMG_steppe_mining_industry: "Industria minera de estepas"
 CHI_OMG_steppe_mining_industry_desc: "Los depósitos de cromo y minerales internos de Mongolia se encuentran bajo un programa coordinado de extracción. Las empresas respaldadas por el Estado establecen instalaciones de procesamiento y corredores de exportación, convirtiendo la riqueza subsuelo en capacidad industrial para la economía china más amplia."
 OMG_mongolian_mining_expansion: "Rara Tierra y Expansión de Carbón"
 OMG_mongolian_mining_expansion_desc: "Mongolia interior contiene algunos de los depósitos más grandes del mundo de elementos de tierra rara y un tercio de las reservas de carbón china. Las autoridades de la RAE amplían las operaciones de extracción y negocian acuerdos de regalías que orientan una mayor parte de los ingresos minerales hacia la infraestructura y la educación regionales."
 CHI_OMG_mongolian_mining_expansion: "Rara Tierra y Expansión de Carbón"
 CHI_OMG_mongolian_mining_expansion_desc: "Mongolia interior contiene algunos de los depósitos más grandes del mundo de elementos de tierra rara y un tercio de las reservas de carbón china. Las autoridades de la RAE amplían las operaciones de extracción y negocian acuerdos de regalías que orientan una mayor parte de los ingresos minerales hacia la infraestructura y la educación regionales."
 CHI_MON_diplomatic_outreach: "Extensión diplomática de Mongolia"
 CHI_MON_diplomatic_outreach_desc: "Beijing lanza una iniciativa diplomática hacia Ulaanbaatar, combinando incentivos económicos con llamamientos culturales al patrimonio común de Mongolia. Las visitas de alto nivel, los términos del comercio preferencial y la ampliación de la presencia cultural china sentaron las bases para un compromiso más profundo."
 CHI_MON_economic_partnership: "Firme asociación económica"
 CHI_MON_economic_partnership_desc: "Un acuerdo amplio de asociación económica otorga a Mongolia acceso preferencial a los mercados chinos, las inversiones y la financiación de infraestructura. Las exportaciones minerales de Mongolia, cobre, carbón y tierras raras encuentran un cliente primario en China, creando una interdependencia económica significativa."
 CHI_MON_reunification_offer: "Oferta de reunificación de Mongolia"
 CHI_MON_reunification_offer_desc: "China extiende una oferta formal a Mongolia para reunirse como Región Administrativa Especial, prometiéndose autonomía de alto grado, preservación del sistema político de Mongolia y plena integración económica. La propuesta invoca precedentes históricos y posiciona a China como el socio natural de la prosperidad mongol."
 MON_CHI_economic_partnership_idea: "Integración económica Sino-Mongolian"
 MON_CHI_economic_partnership_idea_desc: "El acceso al comercio preferencial y la integración del mercado chino han hecho que Mongolia dependa en gran medida de las exportaciones a China. Los ingresos mineros aumentan, pero también la dependencia estructural de la demanda china."
 MON_CHI_cultural_sphere_idea: "Dentro de la órbita cultural china"
 MON_CHI_cultural_sphere_idea_desc: "Los medios de comunicación estatales chinos, la programación cultural y las redes de diáspora han establecido una importante presencia de potencia blanda dentro de Mongolia. La resistencia a una mayor influencia china se debilita como resultado."
 CHI_TAI_fleet_modernization: "Programa de modernización de la flota"
 CHI_TAI_fleet_modernization_desc: "La Armada del PLA acelera la adquisición de modernos destructores, fragatas y buques de asalto anfibio configurados para operaciones del Estrecho de Taiwán. La capacidad astillera ampliada y los plazos de puesta en marcha acelerados indican un cambio claro hacia la proyección de energía en el Pacífico occidental."
 CHI_TAI_dongfeng_program: "Programa de misiles Dong Feng"
 CHI_TAI_dongfeng_program_desc: "La Fuerza Rocket amplía su arsenal de misiles balísticos de alcance intermedio, implementando nuevas baterías DF-21 y DF-26 a lo largo de la costa Fujian. El programa otorga a Beijing la capacidad de mantener en riesgo la infraestructura militar de Taiwán desde el continente sin comprometer activos navales o aéreos."
 CHI_TAI_air_superiority: "Estrategia de superioridad aérea"
 CHI_TAI_air_superiority_desc: "La Fuerza Aérea del PLA intensifica las incursiones de capacitación sobre la línea mediana del Estrecho de Taiwán y despliega a los combatientes J-20 avanzados para avanzar en bases en Fujian. La presión aérea persistente erosiona la capacidad de Taiwán para mantener defensas aéreas creíbles."
 CHI_TAI_cyber_warfare: "Capacidad de Cyber Warfare"
 CHI_TAI_cyber_warfare_desc: "La Fuerza de Apoyo Estratégico amplía su dirección ofensiva de operaciones cibernéticas, desarrollando capacidades para interrumpir la infraestructura crítica de Taiwán, las comunicaciones militares y los sistemas financieros. El frente digital se convierte en otro eje de presión."
 CHI_TAI_blockade_capability: "Bloqueo"
 CHI_TAI_blockade_capability_desc: "Tras extensos ejercicios de simulación, la Armada y Guardia Costera del PLA certifican la disponibilidad operacional completa para una zona de exclusión marítima alrededor de Taiwán. Las patrullas submarinas, los piquetes superficiales y la vigilancia aérea pueden activarse a corto plazo."
 CHI_TAI_one_china_enforcement: "Una de las medidas adoptadas por China"
 CHI_TAI_one_china_enforcement_desc: "Beijing lanza una campaña diplomática sistemática para eliminar los reconocimientos formales restantes de Taiwán. Los embajadores son enviados con paquetes de ayuda y acuerdos de infraestructura, mientras que la presión económica se aplica a las naciones que resisten cambiar su lealtad."
 CHI_TAI_intl_org_blockade: "Bloqueo de la organización internacional"
 CHI_TAI_intl_org_blockade_desc: "China aprovecha su asiento permanente en el Consejo de Seguridad de las Naciones Unidas y su creciente peso en instituciones multilaterales para bloquear la participación de Taiwán en organizaciones internacionales. Las solicitudes de condición de observador son vetadas y los canales de participación informal están cerrados."
 CHI_TAI_economic_leverage: "Campaña de apalancamiento económico"
 CHI_TAI_economic_leverage_desc: "Beijing arma su posición como la nación comercial más grande del mundo, aplicando presión económica específica sobre las industrias americanas y los grupos políticos que apoyan Taiwán. La campaña explota la dependencia comercial para erosionar la voluntad política detrás de las garantías de seguridad estadounidenses."
 CHI_TAI_tourism_freeze: "Turismo Freeze"
 CHI_TAI_tourism_freeze_desc: "Beijing ordena a los operadores turísticos estatales que suspendan todos los paquetes individuales y de grupo a Taiwán, cortando las corrientes de visitantes que habían crecido sustancialmente desde la apertura de la CEFA-era en 2008. La medida niega a Taipei los ingresos por divisas y los ingresos por servicios de consumo que el turismo continental había generado, armando la integración económica cruzada como instrumento coercitivo."
 CHI_TAI_lobby_network: "Lavadora Lobby Network"
 CHI_TAI_lobby_network_desc: "Los intereses empresariales alineados por China, los grupos de reflexión y los consultores políticos establecen una presencia permanente en Washington. La red trabaja para dar forma a la opinión congresista en Taiwán, bloqueando las ventas de armas y promoviendo el compromiso con Beijing."
 CHI_TAI_proxy_strategy: "Estrategia Global Proxy"
 CHI_TAI_proxy_strategy_desc: "Beijing cultiva conflictos indirectos y puntos de interés regionales diseñados para desviar la atención militar estadounidense y el capital político lejos del Estrecho de Taiwán. Cada crisis que atrae a las fuerzas estadounidenses en otras partes reduce la credibilidad de los compromisos del Pacífico de Washington."
 CHI_TAI_distract_america: "Distract America"
 CHI_TAI_distract_america_desc: "Con Estados Unidos en operaciones militares de ultramar, Beijing capitaliza los recursos extendidos y la atención dividida de Washington. Cada despliegue activo de EE.UU. reduce la probabilidad de una respuesta estadounidense rápida a una contingencia del Estrecho de Taiwán."
