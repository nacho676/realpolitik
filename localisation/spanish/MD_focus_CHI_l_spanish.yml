 BRI_apply_named_MINE_desc: "Petición de Beijing para construir el §Y[THIS.GetBRINextProjectMINE]§!. La aplicación cuesta 30 Poder político. Con la aprobación, pagamos §Y40§! de nuestro tesorería o recibimos un préstamo chino. Requiere metales preciosos, metales tecnológicos, metales ligeros o depósitos de acero y paz."
