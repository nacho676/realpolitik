 CHI_TAI_intl_org_blockade_tt: "[TAI.GetNameWithFlag] obtiene un modificador dinámico que lo penaliza basado en su nivel de reconocimiento internacional."
 CHI_TAI_intl_isolation_modifier: "Índice de aislamiento internacional"
 CHI_TAI_intl_isolation_modifier_desc: "Una medida dinámica del aislamiento diplomático de Taiwán, escalando inversamente con el número de Estados miembros de la ONU que mantienen un reconocimiento diplomático formal. Menos reconocimientos de los estados intensifican las penas a la opinión comercial, la influencia extranjera y las relaciones mejoradas cuestan con China; un reconocimiento más amplio mejora simultáneamente estas relaciones e incrementa el apalancamiento diplomático de Taiwán."
 CHI_recognition_embargo: "Reconocimiento Embargo"
 CHI_recognition_embargo_desc: "China ha impuesto sanciones económicas y diplomáticas estrictas a cualquier nación que mantenga el reconocimiento diplomático formal de Taiwán. Los costos comerciales con China han aumentado significativamente, y el acceso a los mercados chinos está severamente restringido."
 china_sar.038.t: "Beijing propone la cooperación económica transfronteriza"
 china_sar.038.d: "Beijing ha presentado una propuesta oficial a Taipei para establecer un marco de cooperación económica intersectorial. Los funcionarios de las tierras continentales lo consideran un arreglo pragmático y mutuamente beneficioso que aparta totalmente la cuestión de la soberanía. Los grupos de negocios de Taiwán son receptivos, pero la oposición líder en la independencia advierte de un lento deslizamiento hacia la dependencia de la economía continental."
 china_sar.038.a: "Participar con el marco."
 china_sar.038.b: "Desclina la sobrenaturaleza."
 china_sar.039.t: "Beijing ofrece ampliar el comercio de tránsito cruzado"
 china_sar.039.d: "Sobre la base de la apertura del diálogo económico, Beijing propone una expansión sustancial del comercio transversal, rebajando los aranceles y reduciendo las restricciones a las exportaciones de Taiwán al continente. La oferta se hace eco del Acuerdo Marco de Cooperación Económica y disminuye el acceso al vasto mercado continental. Los críticos en Taipei temen que las concesiones lleven cadenas políticas."
 china_sar.039.a: "Ampliar el comercio con el continente."
 china_sar.039.b: "Rechazar la expansión comercial."
 china_sar.040.t: "Acceso al mercado continental para las firmas de Taiwán"
 china_sar.040.d: "Beijing invita a las empresas de Taiwán a operar en el continente bajo condiciones preferenciales, ofreciendo espacio de oficinas, derechos compartidos de construcción y licencias simplificadas. Para la economía impulsada por las exportaciones de Taiwán, la oportunidad es considerable, pero el enredo comercial más profundo con el continente sigue siendo políticamente sensible en Taipei."
 china_sar.040.a: "Aceptar el acceso preferencial al mercado."
 china_sar.040.b: "Mantenga a nuestras firmas en el brazo."
 china_sar.041.t: "Coordinación de semiconductores cruzados"
 china_sar.041.d: "Beijing propone la coordinación entre la industria semiconductora líder mundial en el continente y Taiwán, incluyendo instalaciones de fabricación conjunta e investigación compartida. El sector chip de Taiwán es su mayor activo estratégico y su escudo más fuerte; compartirlo con el continente sería lucrativo, pero erosionaría la ventaja que mantiene comprometidos a los socios de Taipei."
 china_sar.041.a: "Coordinar sobre semiconductores."
 china_sar.041.b: "Protege nuestra industria de chips."
 china_sar.042.t: "Intercambio de Delegaciones de Negocios"
 china_sar.042.d: "Beijing invita a las delegaciones de negocios recíprocos a recorrer centros industriales en ambos lados del estrecho, forjando vínculos personales entre los ejecutivos de Mainland y Taiwán. Las visitas son de bajo riesgo y utilidad comercial, aunque cada una espesa la red de interdependencia económica transversal."
 china_sar.042.a: "Delegaciones de intercambio."
 china_sar.042.b: "Difundir las visitas."
 china_sar.043.t: "Enlaces directos de transporte cruzado"
 china_sar.043.d: "Beijing propone una expansión de los enlaces de transporte directo a través del estrecho, basándose en la política Tres Enlaces con nuevas rutas de navegación, vuelos e infraestructura. Las conexiones directas reducirían los costos tanto para las empresas como para los viajeros, uniendo cada vez más de cerca a ambas economías."
 china_sar.043.a: "Enlaces de transporte directos abiertos."
 china_sar.043.b: "Limite las conexiones directas."
 china_sar.044.t: "Salvaguardias de inversión cruzadas"
 china_sar.044.d: "Beijing ofrece un acuerdo formal que garantiza la protección legal para la inversión de Taiwán en el continente, abordando preocupaciones de larga data sobre los derechos de propiedad y el arbitraje. Las salvaguardias tranquilizarían a los inversores cautelosos, pero también afianzan un marco en el que Taipei negocia con Beijing como socio económico."
 china_sar.044.a: "Firme las salvaguardias de inversión."
 china_sar.044.b: "Rechazar el acuerdo."
 china_sar.045.t: "Planeamiento industrial conjunto Cross-Strait"
 china_sar.045.d: "Beijing propone una planificación industrial coordinada en todo el estrecho, alineando las cadenas de suministro, las normas y los principales proyectos. Tal integración produciría eficiencias reales, pero también doblaría la economía de Taiwán a la estrategia a largo plazo del continente, una perspectiva que alarma a los votantes con mentalidad de soberanía en Taipei."
 china_sar.045.a: "Alinear nuestra planificación industrial."
 china_sar.045.b: "Planifica nuestra economía de forma independiente."
 china_sar.046.t: "Profunda integración económica transfronteriza"
 china_sar.046.d: "Beijing propone la etapa final de la unión económica transversal: un mercado profundamente integrado con regulación armonizada y el libre movimiento de bienes y capital. Los partidarios señalan la prosperidad que traería; los opositores advierten que a esta profundidad, la unión económica se hace difícil de distinguir de la absorción política."
 china_sar.046.a: "Integración económica completa."
 china_sar.046.b: "Deténganse al borde del agua."
 china_sar.047.t: "Taipei Pesa el Acuerdo de Reunificación"
 china_sar.047.d: "Beijing ha presentado el marco final para la reunificación pacífica: Taiwán se reuniría con la República Popular como Región Administrativa Especial, manteniendo su propia administración, sistema legal y economía bajo el modelo de un país-dos sistemas. Después de años de distensión cruzada, el acuerdo ahora descansa ante Taipei para su ratificación."
 china_sar.047.a: "Ratificar el acuerdo y la reunión."
 china_sar.047.b: "La isla no está lista para esto."
 CHI_calm_hong_kong_protests: "Restablecer el orden en Hong Kong"
 CHI_calm_hong_kong_protests_desc: "Las protestas provocadas por nuestras reformas electorales siguen perturbando la Región Administrativa Especial. Con fuerzas de seguridad sobre el terreno y la situación estabilizada, el gobierno central puede moverse para reducir silenciosamente los disturbios y restaurar la normalidad a Hong Kong."
 CHI_TAI_resend_economic_track: "Renovar propuesta de cooperación: marco económico"
 CHI_TAI_resend_economic_track_desc: "Taipei declinó el exceso anterior. Abordar el gobierno de Taiwán una vez más con el marco de cooperación económica transversal."
 CHI_TAI_resend_expand_trade: "Renovar propuesta de cooperación: expansión comercial"
 CHI_TAI_resend_expand_trade_desc: "Taipei declinó el exceso anterior. Acérquese una vez más al gobierno de Taiwán con la propuesta de ampliar el comercio transversal."
 CHI_TAI_resend_mainland_access: "Renovar propuesta de cooperación: acceso a mercados"
 CHI_TAI_resend_mainland_access_desc: "Taipei declinó el exceso anterior. Abordar el gobierno de Taiwán una vez más con la oferta de acceso preferencial al mercado continental."
 CHI_TAI_resend_semiconductor: "Renovar propuesta de cooperación: coordinación de semiconductores"
 CHI_TAI_resend_semiconductor_desc: "Taipei declinó el exceso anterior. Abordar el gobierno de Taiwán una vez más con la propuesta de coordinación semiconductora transversal."
 CHI_TAI_resend_business_deleg: "Renovar propuesta de cooperación: delegaciones empresariales"
 CHI_TAI_resend_business_deleg_desc: "Taipei declinó el exceso anterior. Acérquese una vez más al gobierno de Taiwán con la oferta de intercambiar delegaciones de negocios."
 CHI_TAI_resend_transport: "Renovar propuesta de cooperación: enlaces de transporte"
 CHI_TAI_resend_transport_desc: "Taipei declinó el exceso anterior. Acérquese una vez más al gobierno de Taiwán con la propuesta de enlaces directos de transporte cruzado."
 CHI_TAI_resend_safeguards: "Renovar propuesta de cooperación: salvaguardas de inversión"
 CHI_TAI_resend_safeguards_desc: "Taipei declinó el exceso anterior. Abordar el gobierno de Taiwán una vez más con el acuerdo de salvaguardias de inversión."
 CHI_TAI_resend_joint_planning: "Renovar propuesta de cooperación: planificación industrial"
 CHI_TAI_resend_joint_planning_desc: "Taipei declinó el exceso anterior. Acérquese una vez más al gobierno de Taiwán con la propuesta de planificación industrial conjunta."
 CHI_TAI_resend_deep_integration: "Renovar propuesta de cooperación: integración económica"
 CHI_TAI_resend_deep_integration_desc: "Taipei declinó el exceso anterior. Abordar el gobierno de Taiwán una vez más con la propuesta de profunda integración económica transversal."
 CHI_TAI_resend_peaceful_reunification: "Volver a presentar el Acuerdo de Reunificación"
 CHI_TAI_resend_peaceful_reunification_desc: "Taipei rechazó el marco de reunificación. Dar el acuerdo más tiempo y presentarlo a Taiwán una vez más."
 CHI_TAI_goodwill_gesture: "Un gesto de buena voluntad cruzada"
 CHI_TAI_goodwill_gesture_desc: "Extender un gesto público de buena voluntad hacia Taipéi, desde ofertas de ayuda por catástrofes hasta normas de viaje y turismo más laxas, que caliente el sentir a través del Estrecho y eleve la confianza mutua."
 CHI_TAI_coercive_signaling: "Coercitivo Signalling"
 CHI_TAI_coercive_signaling_desc: "Señalar el descontento de Pekín mediante ejercicios militares pronunciados y presión diplomática. Recuerda a Taipéi la determinación del continente, pero corroe la confianza a través del Estrecho."
 CHI_sco_member_tooltip: "§YSCO Member§!: Profundiza la cooperación política, económica y de seguridad con otros Estados miembros en Eurasia."
