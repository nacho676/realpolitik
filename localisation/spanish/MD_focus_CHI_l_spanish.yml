 CHI_tank_general_desc: "El general Kwai está entre los principales comandantes de guerra blindados del PLA, conocidos por su uso agresivo de formaciones de tanques pesados y su creencia de que la abrumadora potencia de fuego decide batallas antes de que el enemigo pueda responder."
