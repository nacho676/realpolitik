 CHI_bri_africa_engagement_desc: "Acumulado puntaje de compromiso BRI para África; requerido junto con las terminaciones FOCAC para desbloquear la lápida de Integración Continental Africana."
 CHI_bri_centralasia_engagement_desc: "Acumulado BRI puntuación de compromiso para Asia Central; se alimenta de los bonos del corredor Silk Road Economic Belt."
 CHI_bri_defaulted_projects_desc: "Número de proyectos en los que el destinatario ha incumplido las condiciones de préstamo; desencadena la elección entre la reestructuración de la deuda y la confiscación de activos."
 CHI_bri_europe_engagement_desc: "Acumulado puntuación de compromiso BRI para Europa; necesario para mantener el mecanismo 17+1 y desbloquear bonos de conectividad europeos a finales del juego."
 CHI_bri_latam_engagement_desc: "Acumulado puntaje de compromiso BRI para América Latina; desbloqueado completando proyectos de infraestructura en Venezuela, Ecuador, Brasil, Argentina y Bolivia."
 CHI_bri_meast_engagement_desc: "Acumulated BRI engagement score for the Middle East; feeds into Petroyuan settlement adoption rates."
 CHI_bri_monthly_income_desc: "Ingresos mensuales de renminbi generados por proyectos activos BRI antes de que se aplique el multiplicador de retorno."
 CHI_bri_pacific_engagement_desc: "El compromiso chino con los estados de las islas del Pacífico: reconocimientos diplomáticos, concesiones en la pesca y los fondos marinos y entendimientos sobre seguridad."
 CHI_bri_predatory_score_desc: "Rastrea cuán agresivamente hemos seguido las tácticas de alivio de la deuda y de incautación de activos; los valores elevados desbloquean el camino Doctrina Hambantota y aumentan las oportunidades de predeterminación a incautación."
 CHI_bri_project_slots_desc: "Número máximo de proyectos BRI China puede gestionar simultáneamente"
 CHI_bri_returns_multiplier_desc: "El multiplicador se aplicó a los flujos de retorno del proyecto; aumentó por secretarios IC activos y ciertas terminaciones focales."
 CHI_bri_seasia_engagement_desc: "Acumulated BRI engagement score for Southeast Asia; affects Lancang-Mekong Cooperation decision availability."
 CHI_bri_southasia_engagement_desc: "Acumulated BRI engagement score for South Asia; affects tier upgrade speed and bonus magnitudes for South Asian partners."
 CHI_bri_winwin_score_desc: "Rastrea lo consistente que hemos aplicado condiciones de crédito concesionales y reformadas; desbloquear valores altos Debt Reestructurar la diplomacia y mejorar la buena voluntad de los receptores."
 CHI_Buffer_State_Doctrine: "Doctrina de estado amoroso"
 CHI_Buffer_State_Doctrine_desc: "Corea del Norte sirve como un búfer estratégico entre nosotros y las fuerzas alineadas por Estados Unidos en Corea del Sur. Al reforzar este papel, aseguramos que Pyongyang permanezca firmemente dentro de nuestra esfera de influencia y que ningún poder hostil establezca una presencia en nuestra frontera."
 CHI_chinese_aggression_display: "$CHI_chinese_aggression$: [?CHI_chinese_aggression]"
 CHI_collective_leadership_active_desc: "Siete hombres alrededor de una mesa. La línea general es lo que los siete hombres acuerdan llamar la línea general."
 CHI_Dandong_Lifeline: "La línea de vida Dandong"
 CHI_Dandong_Lifeline_desc: "Dandong maneja la abrumadora mayoría del comercio exterior de Corea del Norte, y el flujo se mueve en nuestros términos. Restaurar y ampliar este oleoducto proporciona a Pyongyang oxígeno económico al tiempo que cementa nuestra influencia sobre el régimen."
 CHI_Enforce_Sanctions_Compliance: "Reforzar las sanciones Cumplimiento"
 CHI_Enforce_Sanctions_Compliance_desc: "Al aplicar genuinamente las sanciones internacionales contra Corea del Norte, demostramos nuestro compromiso con la no proliferación y ganamos buena voluntad de los Estados Unidos y el Japón. Pyongyang estará disgustado, pero nuestra posición en la comunidad internacional mejorará."
 CHI_focus_tree: "China Enfoque Árbol"
 CHI_Fortress_of_the_East: "Fortaleza del Este"
 CHI_Fortress_of_the_East_desc: "Transformar Corea del Norte en un estado de amortiguación impenetrable sirve nuestra profundidad estratégica. Apoyamos una doctrina de preparación militar total que hace cualquier empuje contra Pyongyang prohibitivamente costoso para aquellos que podrían intentarlo."
