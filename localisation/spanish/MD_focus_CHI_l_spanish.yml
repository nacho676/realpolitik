 CHI_054a_production_line_desc: "Cada flota necesita un caballo de trabajo, y el nuestro es el Tipo 054A. Construido en una larga carrera sin romper desde 2008, esta fragata capaz y asequible se convierte en la escolta estándar de la marina, y el barco enviado al Golfo de Adén cuando China se unió a las patrullas antipiratería ese mismo año, su primera misión sostenida en aguas distantes."
 CHI_45g_national_deployment: "5G Network Deployment"
 CHI_45g_national_deployment_desc: "China Mobile lanza comerciales 4G, y dentro de tres años tenemos más estaciones base que el resto del mundo combinado. El MIIT emite licencias 5G a los tres operadores, y para el momento en que los transportistas occidentales están debatiendo sus estrategias de despliegue, estamos operando 4,1 millones de estaciones base 5G sirviendo a mil millones de usuarios. La brecha de infraestructura ya no es algo que estamos cerrando; es algo que hemos revertido."
 CHI_863_ic_preparatory_research: "863 Programa IC Investigación preparatoria"
 CHI_863_ic_preparatory_research_desc: "En el marco del Plan estatal de desarrollo de alta tecnología, el diseño y la fabricación integrados de circuitos son un campo prioritario. Los fondos estatales fluyen en centros de investigación universitarios y pilotos de fundición en estadio temprano en el Delta del río Pearl y Shanghái, estableciendo el capital humano y las bases de la cadena de suministro que el Fondo Nacional de la IC se extenderá posteriormente a la producción industrial. Estamos plantando semillas en suelo que tardarán una década para mostrar una cosecha."
 CHI_863_nev_program: "863 Programa NEV Track y Diez Ciudades"
 CHI_863_nev_program_desc: "Wan Gang, ingeniero-volved-minister que pasó nueve años en Audi antes de regresar a China, argumentó que podríamos saltar los motores de combustión enteramente. El programa Ten Cities Thousand Vehicles despliega flotas públicas NEV en ciudades piloto; Shenzhen electrifica toda su flota de autobuses y taxis. La Gigafactoria de Shanghái de Tesla, construida en 357 días desde los inicios, se convierte en el catalizador que obliga a cada fabricante chino para competir en calidad y velocidad de producción. Deberíamos haber esperado nada menos del mercado que creamos."
 CHI_a_lighter_touch_on_dissent: "Un toque más ligero en el disentimiento"
 CHI_a_lighter_touch_on_dissent_desc: "En lugar de intensificar la coacción interna, permitimos un espacio limitado para la expresión de la sociedad civil y el debate intelectual dentro de límites cuidadosamente gestionados. El enfoque trata el control político a corto plazo para reducir la fricción que impulsa la organización clandestina."
 CHI_abolish_term_limits: "Supresión de los límites de mandato"
 CHI_abolish_term_limits_desc: "El Congreso Popular Nacional vota 2,958 a favor, 2 contra y 3 abstenidos para eliminar el límite de dos plazos sobre la presidencia del Estado de la Constitución. La votación es formalmente unánime en todos menos nombre. La autoridad ya no está sujeta a un reloj constitucional. La decisión elimina la limitación institucional más significativa del poder personal desde las reformas posteriores a Mao."
 CHI_above_the_neck_reform: "Reforma por encima del cuello"
 CHI_above_the_neck_reform_desc: "Las viejas siete regiones militares respondieron al ejército terrestre y combatieron sus propias guerras. En 2016 cortamos el cuello primero: la Comisión Militar Central toma el mando directo, cinco comandos de teatro reemplazan las regiones y un Estado Mayor Conjunto nace para luchar como uno. Comando antes de las fuerzas, la cabeza delante del cuerpo."
 CHI_active_defense_doctrine: "Activo Defensa"
 CHI_active_defense_doctrine_desc: "La defensa activa ha sido la estrategia rectora del ejército desde Mao: estratégicamente defensiva, pero operativa y tácticamente ofensiva. Lo afilamos para la era de los misiles, sosteniendo que la forma más segura de defender la patria es golpear la punta de lanza del enemigo antes de aterrizar."
 CHI_African_Continental_Integration: "Siglo Chino-África"
 CHI_African_Continental_Integration_desc: "Nos hemos convertido en el mayor socio comercial único de África, con un comercio bilateral superior a $254 mil millones anuales. Décadas de inversión BRI en puertos, ferrocarriles y zonas económicas especiales han hecho indispensable nuestra infraestructura y capital para la agenda de integración continental de la Unión Africana. Ha llegado el momento de convertir este peso económico en una asociación institucional duradera."
 CHI_agricultural_tax_abolition: "La abolición del impuesto agrícola"
 CHI_agricultural_tax_abolition_desc: "La cuestión de Sannong -- la agricultura, el campo y los agricultores -- se había convertido en explosiva en China rural mucho antes de que el debate oficial llegara a Beijing. Un piloto de reforma tributaria rural anclado en la provincia de Anhui expuso cuán profundamente la carga de los levitas locales había suprimido los ingresos campesinos y las inversiones agrícolas. El documento No 1 del Comité Central volvió a la cuestión rural durante diez años consecutivos. Repealing the Agricultural Tax Ordinance of 1958 libera capital rural que ha esperado décadas para fluir en las llanuras centrales de Henan, el cinturón de arroz de Hunan y la cuenca de Sichuan."
 CHI_AIIB_Founding: "Banco Asiático de inversiones en infraestructura"
 CHI_AIIB_Founding_desc: "El Banco Asiático de Inversiones de Infraestructura, que fundamos con 57 estados miembros a pesar de la firme oposición de Washington, proporciona financiación multilateral para infraestructura en Asia y más allá. Su existencia demuestra que podemos construir instituciones internacionales creíbles totalmente fuera del marco de Bretton Woods. El monopolio occidental de la financiación para el desarrollo está roto."
 CHI_An_Alliance_to_Rival_NATO_tt: "§YSe mostrarán los efectos, una vez que establezcamos nuestra facción§!"
 CHI_anshan_steel_modernization: "Modernización del complejo de acero Anshan"
 CHI_anshan_steel_modernization_desc: "El Anshan Iron and Steel Group, el complejo de acero integrado más antiguo y más grande de China, está sometido a un importante programa de modernización. Los hornos obsoletos de corazón abierto se sustituyen por la fabricación básica de acero al oxígeno, los costos de corte y el aumento del techo de calidad para la fabricación de aguas abajo."
 CHI_ant_group_empire: "El Imperio Financiero del Grupo Ant"
 CHI_ant_group_empire_desc: "Ant Group, salpicado de Alibaba, construye un imperio financiero que abarca Yu'ebao, Zhima Credit, Huabei y MYbank, respaldando Paytm, GCash y Dana internacionalmente. Jack Ma desafía públicamente a los bancos estatales en la Cumbre Bund, comparándolos con los peones. Días más tarde, el CSRC y SAMR suspenden la IPO 34 mil millones de dólares de Ant 48 horas antes del lanzamiento. La relación del sector de la plataforma con el estado ha cambiado, y cada ejecutivo tecnológico en el país entiende lo que eso significa."
 CHI_anti_japanese_boycott_campaign: "Campaña contra el boicot japonés"
 CHI_anti_japanese_boycott_campaign_desc: "Las masas están enojadas. No creamos su ira. Simplemente elegimos no estar en su camino, hasta el momento que escogemos."
 CHI_Arab_League_Cooperation_Forum: "China-Árabe es el foro de estados"
 CHI_Arab_League_Cooperation_Forum_desc: "El Foro de Cooperación entre Estados Árabes y China convoca a ministros extranjeros de los 22 miembros de la Liga Árabe para coordinar las tuberías del proyecto BRI, la política comercial y la alineación política. A través de ella mantenemos un canal institucional permanente en el Oriente Medio que supera completamente los marcos dirigidos por Occidente. Los estados árabes aprovechan a sus socios tradicionales mediante el acceso demostrado a nuestro capital, y ganamos un bloque cuyos votos siguen nuestra ventaja."
 CHI_arms_for_influence: "Armas para la influencia"
 CHI_arms_for_influence_desc: "Cada caja de exportación compra más que efectivo. Armamos clientes que ningún proveedor occidental tocará y recogerá la deuda en puertos, votos y lealtad, convirtiendo el comercio de armas del ejército en un instrumento silencioso de política exterior."
 CHI_army_aviation_corps: "Cuerpo de Aviación del Ejército"
 CHI_army_aviation_corps_desc: "Un ejército que no puede volar no puede atacar rápido. Construimos el brazo de Aviación del Ejército con el helicóptero de ataque Z-10 y el transporte Z-20, dando a las brigadas rápidas sus propias naves de armas y levantamos para saltar sobre terrenos y tropas terrestres detrás del enemigo."
 CHI_army_reorganisation: "Reorganizar el Ejército"
 CHI_army_reorganisation_desc: "Los trece nuevos ejércitos de grupo son equilibrados y renumerados, cada uno construido a partir de brigadas combinadas en lugar de divisiones de madera. La fuerza terrestre emerge más inclinada, modular y finalmente intercambiable, capaz de masa o dispersarse como exige la lucha."
 CHI_artillery_modernisation: "Modernizar la artillería"
 CHI_artillery_modernisation_desc: "Las armas son tan buenas como el sistema que las apunta. Los radares de contra-batería, el control digital de incendios y los proyectiles de precisión convierten a la artillería en un escalpelo, golpeando con precisión en el primer voleiaje."
 CHI_assuage_japanese_concerns: "Calmar las preocupaciones japonesas"
 CHI_assuage_japanese_concerns_desc: "Miran a nuestro guardacostas. Miran nuestras pruebas de misiles. Así que cuando cancelamos públicamente un ejercicio, se dan cuenta."
 CHI_astana_speech: "Cinturón económico de la carretera de seda"
 CHI_astana_speech_desc: "Un discurso en la Universidad Nazarbayev de Astana propuso «construir juntos un cinturón económico a lo largo de la Ruta de la Seda» que nos vincula con Europa a través de Asia Central. Combinado con la Ruta Marítima de la Seda del Siglo XXI anunciada el mes siguiente en Indonesia, la Iniciativa Franja y la Ruta toma forma. La financiación de la infraestructura, las concesiones portuarias y los contratos ferroviarios deben ahora fluir desde Beijing en una escala que cambie el orden del mundo."
 CHI_avic_reunification: "Reunify AVIC"
 CHI_avic_reunification_desc: "Se dividió en 1999 en mitades rivales para forzar la competencia, la industria de la aviación sólo aprendió a duplicar y pelear. En 2008 AVIC I y AVIC II son cosidos de nuevo en una única Corporación de Industria Aérea, un techo sobre los luchadores, motores y aviónicos que la fuerza aérea ha esperado décadas por."
 CHI_Back_Channel_to_Foggy_Bottom: "Volver Canal a Foggy Bottom"
 CHI_Back_Channel_to_Foggy_Bottom_desc: "Los equipos diplomáticos chinos y estadounidenses establecen un canal de retroceso discreto a través de las habitaciones traseras de la embajada y los interlocutores del Track II. Ambas partes reconocen en privado que la cuestión coreana no puede resolverse sin alojamiento mutuo."
 CHI_banking_recapitalisation: "Recapitalización del sector bancario"
 CHI_banking_recapitalisation_desc: "Nuestro sector bancario acumuló una carga aplastante de préstamos sin rendimiento durante la expansión crediticia del decenio de 1990. Debemos inyectar capital público para eliminar estas obligaciones de los balances bancarios estatales, y luego enumerar las instituciones reestructuradas en el intercambio de Hong Kong. Seguirán los accionistas de minorías extranjeras y las normas internacionales de contabilidad, otorgando a nuestro sistema financiero la credibilidad que carece actualmente."
 CHI_baosteel_ipo: "El Baosteel IPO"
 CHI_baosteel_ipo_desc: "Baoshan Iron y las listas de acero en la Bolsa de Shanghai en lo que era entonces el mayor IPO en nuestra historia, cría 7.7 billones de yuan. Fundada con tecnología licenciada en Acero del Nippon, Baosteel absorbido Shanghai Metallurgical Holding y Meishan bajo la política de Zhu Rongji de captar a los grandes y la liberación del pequeño. Su integración de hoja automotriz de alta calidad y la tira eléctrica establece el punto de referencia para el sector de acero modernizador de China"
 CHI_baowu_merger: "El nacimiento de Baowu Steel"
 CHI_baowu_merger_desc: "La fusión de Baosteel Group y Wuhan Iron and Steel Corporation crea China Baowu Steel Group, anclando nuestra estrategia de construir campeones nacionales de acero capaces de competir a escala mundial. Bajo el presidente Chen Derong, Baowu adquirió posteriormente Maanshan Iron and Steel, Taiyuan Iron and Steel, Chongqing Iron and Steel, y Xinjiang Bayi Iron and Steel. Produciendo más de 115 millones de toneladas anuales, Baowu ha superado a ArcelorMittal para convertirse en el mayor siderúrgico del mundo."
 CHI_bat_platform_rise: "Los BAT Rises"
 CHI_bat_platform_rise_desc: "Baidu, Alibaba y Tencent definen nuestro internet. Baidu domina las búsquedas tras la salida de Google; Alibaba ha construido el mayor ecosistema de comercio electrónico del mundo; el WeChat de Tencent llega a 1.300 millones de usuarios. El entorno político que mantuvo fuera a los rivales occidentales no creó estas empresas, pero les dio espacio para crecer sin ser adquiridas ni destruidas por el capital de Silicon Valley. Ese espacio fue una decisión estratégica, y fue la correcta."
 CHI_bayan_obo_ree_group: "Bayan Obo y China Rare Earth Group"
 CHI_bayan_obo_ree_group_desc: "Deng Xiaoping observó que el Medio Oriente tiene aceite mientras tenemos tierras raras. El depósito Bayan Obo en Baotou en Mongolia Interior, operado por China Northern Rare Earth Group, es el mayor depósito del mundo de tierras raras ligeras; las minas Ganzhou en Jiangxi suministran tierras raras pesadas incluyendo disprosio y terbium. El MIIT ha consolidado seis productores regionales en China Rare Earth Group y China Northern Rare Earth Group. Las cuotas de exportación, abolidas formalmente después de una decisión de la OMC, retornan como licencias de exportación y cupos de producción que logran el mismo efecto. Debemos usar esta ventaja antes de que otros encuentren sustitutos."
 CHI_Beidou_Latin_Constellation: "Constelación latina Beidou"
 CHI_Beidou_Latin_Constellation_desc: "Las estaciones terrestres de nuestro sistema de navegación Beidou en Argentina y Venezuela extienden la precisión de la constelación al Hemisferio Occidental y reducen la dependencia regional de la infraestructura GPS de los Estados Unidos. Las instalaciones de doble uso sustentan contratos civiles de agricultura y encuestas al tiempo que nos proporcionan datos estratégicos de posicionamiento. Washington trata las instalaciones como un desafío directo a su dominio de señalización-inteligencia en las Américas, y Washington es correcto."
 CHI_beijing_action_plan_green_olympics: "Plan de Acción Olimpiadas Verdes"
 CHI_beijing_action_plan_green_olympics_desc: "Nuestra oferta para acoger los Juegos Olímpicos prometió al COI un espectáculo ambientalmente responsable. Ahora debemos hacer bien esa promesa: la forestación a gran escala, el combustible de carbón a gas en toda la red de calefacción de Beijing, la reubicación industrial fuera de la capital, el fortalecimiento de las normas de emisión de vehículos y la construcción del lugar que abarca seis ciudades. El mundo estará mirando."
 CHI_beijing_command_clique: "El Comando de Beijing Clique"
 CHI_beijing_command_clique_desc: "Las camarillas provinciales convergen en la capital. Una red de generales comprados se apodera de los órganos de mando en Pekín mismo, para que ninguna promoción, contrato o publicación se mueva sin su bendición y su corte."
 CHI_Beijing_Communique: "Comunicado de paz de Pekín"
 CHI_Beijing_Communique_desc: "Nos hemos posicionado como el intermediario de una normalización histórica saudí-iranesa, llevando a los dos rivales regionales a restaurar las relaciones diplomáticas bajo nuestra mediación. El comunicado demuestra que podemos ofrecer resultados geopolíticos que Washington no puede o no lo hará, cementando nuestra credibilidad como un garante de seguridad alternativo. La opinión regional ahora cambia mesurablemente hacia nuestro liderazgo diplomático, y debemos presionar esa ventaja."
 CHI_beijing_tianjin_hsr: "Pekín-Tianjin Carril de alta velocidad"
 CHI_beijing_tianjin_hsr_desc: "El tren de Intercity Beijing-Tianjin de 117 kilómetros, que cubre la distancia en treinta minutos a 350 km/h, marca la apertura de la expansión ferroviaria de alta velocidad de China. La tecnología con licencia de Kawasaki, Siemens, Alstom y Bombardier es absorbida e indigenizada a través de China South Railway y China North Railway, que desde entonces se han fusionado para formar CRRC. Una colisión en Wenzhou provoca una reducción de velocidad a 300 km/h y un refuerzo de estándares de calidad. La red ahora supera los 40.000 km, y sólo hemos empezado a construir."
 CHI_below_the_neck_disband: "Banda por debajo del cuello"
 CHI_below_the_neck_disband_desc: "Con el alto mando reeditado, el cuchillo gira al cuerpo. A partir de abril de 2017 las reformas «abajo del cuello» disuelven el cuerpo en brigadas combinadas, cortaron trescientos mil tropas y desplazaron al ejército de masa a maniobra. Los ejércitos enteros desaparecen de los rollos para que lo que queda realmente pueda luchar."
 CHI_Belt_and_Road_Vision: "Franja y la Ruta Iniciativa"
 CHI_Belt_and_Road_Vision_desc: "Iniciar la Iniciativa Franja y la Ruta, invirtiendo cientos de miles de millones en proyectos de infraestructura que conectan Asia, África y Europa con China a través de carreteras, ferrocarriles, puertos y redes digitales."
 CHI_Bide_Your_Time: "Escóndete tu fuerza, agacha tu tiempo"
 CHI_Bide_Your_Time_desc: "Siga la máxima de Deng Xiaoping. Evitar la confrontación, construir vínculos económicos y acumular el poder nacional completo en silencio. El ascenso de China no necesita provocar una coalición en su contra."
 CHI_big_four_ipo: "Las cuatro grandes olas de IPO"
 CHI_big_four_ipo_desc: "Nuestros bancos estatales completan una oleada de salidas a bolsa sin precedentes. China Construction Bank capta 9.200 millones de dólares en Hong Kong; la doble cotización simultánea del ICBC en Hong Kong y Shanghái marca un récord mundial con 21.900 millones; el Agricultural Bank of China la supera con 22.100 millones. El ICBC es ahora el mayor banco del mundo por activos totales, y los Cuatro Grandes se incorporan a la lista de bancos de importancia sistémica mundial del Consejo de Estabilidad Financiera. Central Huijin Investment sigue siendo el accionista dominante en cada uno."
 CHI_big_fund_phase2: "Gran fase del Fondo II"
 CHI_big_fund_phase2_desc: "La segunda fase del Fondo Nacional de Circuito Integrado eleva 200 mil millones de yuan, dirigidos a equipos, materiales y embalajes avanzados para llenar las lagunas en la cadena de suministro que han expuesto las sanciones estadounidenses. Una tercera fase de más de 300 mil millones de yuanes sigue, la mayor movilización de capital único en historia semiconductora. La estrategia ha pasado de escalar la capacidad a una integración vertical completa: desde el wafer crudo hasta el SoC empaquetado, cada paso de la pila será de origen nacional o desarrollada internamente. Nada menos nos dará la seguridad que necesitamos."
 CHI_big_fund_phase_1: "Fondo de inversión para la industria semiconductora"
 CHI_big_fund_phase_1_desc: "El Consejo de Estado ha publicado el documento No 18, en que se designa a los semiconductores una industria estratégica. El Fondo Nacional Integrado de Inversiones para la Industria del Circuito -- el Gran Fondo -- eleva 138.7 billones de yuan en su primer cierre, anclando una movilización de capital dirigida por el Estado a través de fundición, diseño y equipo. Canalizamos fondos en SMIC, Huawei HiSilicon y una constelación de vehículos provinciales de co-inversión. Ya no podemos permitirnos la dependencia tecnológica del TSMC y el ASML, y este fondo es nuestra declaración de intención."
 CHI_blue_granary_aquaculture: "El Granario Azul"
 CHI_blue_granary_aquaculture_desc: "Nuestro sector acuícola produce 52 millones de toneladas anuales, aproximadamente el 60% de la producción mundial y el 80% de nuestra propia cosecha acuática. El Delta del Río Perla de Guangdong alberga las redes más densas de tilapia en el mundo; La costa de Zhejiang Ningbo-Zhoushan domina la producción de camarones y cangrejos. Las jaulas experimentales de salmón de aguas profundas en el Mar Amarillo están transformando los distritos agrícolas costeros en centros de proteína-exportación, aunque la sobreutilización antibiótica y la eutrofización del Lago Tai siguen siendo costos ambientales no resueltos que no podemos ignorar indefinidamente."
 CHI_bow_to_china_dream: "Arco al Sueño de China"
 CHI_bow_to_china_dream_desc: "Cuando la tormenta anticorrupción rompe, la alianza se dobla en lugar de romperse. La camarilla promete una fuerte lealtad al sueño chino de Xi Jinping, entrega unos pocos tokens y compra su supervivencia negociando el saqueo abierto para un privilegio más tranquilo."
 CHI_break_the_first_island_chain: "Romper la cadena de la primera isla"
 CHI_break_the_first_island_chain_desc: "La cadena se extiende desde Kyushu a través de los Ryukyus hasta Taiwán. Durante cuarenta años ha embotellado nuestra marina en aguas costeras. La cadena rompe donde el eslabón más débil admite. El enlace concederá."
 CHI_BRI_Forum_Beijing: "Franja y la Ruta Foro de Cooperación"
 CHI_BRI_Forum_Beijing_desc: "El Foro Franja y la Ruta para la Cooperación Internacional, celebrado en Beijing y creciendo con cada iteración, reúne a jefes de Estado y altos funcionarios de más de 100 países para coordinar los oleoductos de proyectos, firmar acuerdos marco y proyectar nuestro liderazgo del programa mundial de desarrollo. Ninguna otra nación puede reunir tal reunión alrededor de su propia mesa."
 CHI_byd_catl_integration: "Construye tus sueños"
 CHI_byd_catl_integration_desc: "El BYD de Wang Chuanfu, fundado como fabricante de baterías en Shenzhen, ha detenido la producción pura de vehículos de combustión, su tecnología Blade Battery LFP de célula a paquete que establece nuevos puntos de referencia para la seguridad y el costo. CATL, con sede en Ningde, utilizó una lista blanca de baterías del gobierno para apagar Panasonic, LG y Samsung SDI lo suficiente como para construir una posición insalvable. Juntos las dos compañías controlan ahora más del 60 por ciento de la producción global de baterías EV. Construimos esta industria de la nada, y nos pertenece."
 CHI_cadre_evaluation_reform: "Reforma de la evaluación del cuadro"
 CHI_cadre_evaluation_reform_desc: "Nuestro sistema de evaluación de cuadros cuenta desde hace mucho tiempo con funcionarios provinciales recompensados que ofrecen crecimiento del PIB, al tiempo que degradan su medio ambiente y descuidan los servicios públicos. Debemos introducir ponderaciones obligatorias para la protección ambiental, la armonía social y la intensidad energética junto con la producción económica. Un funcionario que logra el crecimiento destruyendo las condiciones para ello no merece ninguna promoción."
 CHI_cadre_rotation: "Sistema de rotación de cuadros"
 CHI_cadre_rotation_desc: "La captura local es la podredumbre en el corazón de la gobernanza china. Los funcionarios que permanecen en el mismo puesto demasiado tiempo desarrollan vínculos con los intereses empresariales locales que corrompen su juicio. Un programa de rotación sistemático se basa en la experiencia de Chongqing para mover cuadros entre publicaciones regularmente, rompiendo las redes de patronaje antes de solidificar."
 CHI_caojing_seven_chem_bases: "Bases Petroquímicas de Shanghai Caojing"
 CHI_caojing_seven_chem_bases_desc: "El Consejo de Estado designa siete bases petroquímicas nacionales: Shanghai's Chemical Industry Park en Caojing, seguido por Nanjing, Ningbo Daxie, Daya Bay, Quanzhou, Dalian y Caofeidian. Cada base recibe vapor centralizado, tratamiento efluente compartido, instalaciones portuarias dedicadas y galletas integradas de etileno, replicando el modelo Verbund pionero por BASF en Ludwigshafen. BASF, Bayer, ExxonMobil, Shell y Saudi Aramco obtienen acceso a través de empresas conjuntas o filiales de propiedad total. El complejo BASF Zhanjiang, a 10 mil millones de euros, se convierte en la mayor inversión individual de BASF globalmente - una medida de lo que nuestro mercado puede ofrecer capital extranjero cuando elegimos ofrecerlo."
 CHI_Central_Asia_Connectivity: "Cinturón económico de la carretera de seda"
 CHI_Central_Asia_Connectivity_desc: "El cinturón económico de Silk Road se extiende por el Asia central, anclado por el puerto seco Khorgos Gateway en la frontera con Kazajstán, un centro de transbordo ferroviario que une el medidor de ferrocarril chino a la red rusa de ancho calibre. Los volúmenes de carga a lo largo del pasillo crecen a medida que los tiempos de tránsito se someten al transporte marítimo para cargas sensibles al tiempo. Debemos acelerar la inversión en este corredor antes de que las potencias rivales reconozcan su valor estratégico."
 CHI_central_china_development: "Levántate de la China Central"
 CHI_central_china_development_desc: "Las provincias centrales de Henan, Hubei y Hunan fueron superadas por el auge costero. Una iniciativa de desarrollo coordinada canaliza transferencias fiscales, inversiones en infraestructura y reubicación de la fabricación en la región, anclando el corazón demográfico y agrícola de China a la historia del crecimiento."
 CHI_central_manufacturing_belt: "Cinturón de fabricación central"
 CHI_central_manufacturing_belt_desc: "El aumento de los salarios costeros después de 2008 empuja a los fabricantes hacia el oeste en Anhui, Jiangxi y Hunan. Los incentivos estatales para la reubicación de fábricas, combinados con menores costos de tierra y mano de obra, convierten estas tres provincias en la columna vertebral industrial de nivel medio de China dentro de una década, absorbiendo cadenas de producción de los deltas Pearl y Yangtze a través de textiles, electrónicas y componentes automotrices."
 CHI_central_military_civil_fusion: "Fusión militar y civil"
 CHI_central_military_civil_fusion_desc: "El muro entre la economía de guerra y el civil es derribado por decreto. Bajo la estrategia Militar-Civil Fusion de Xi Jinping, planteada a la prioridad nacional en 2017, cada avance en electrónica comercial, computación y aeroespacial es cosechado para el ejército, y todo avance de defensa fluye de vuelta a la industria. La investigación de toda una nación se convierte en el laboratorio del Estado Mayor."
 CHI_central_urbanization_drive: "Unidad de Urbanización Central China"
 CHI_central_urbanization_drive_desc: "Se estima que cientos de millones de migrantes rurales procedentes de las provincias centrales se trasladan a capitales provinciales y ciudades de condado. Debemos acelerar la transición con subsidios de vivienda, servicios urbanos ampliados y relajacións hukou orientadas. El interior central debe ser convertido desde un depósito de trabajo en un mercado de consumo, mientras que la ventana demográfica todavía está abierta."
 CHI_Challenge_Dollar_Hegemony: "Reto dólar Hegemony"
 CHI_Challenge_Dollar_Hegemony_desc: "Promover el renminbi como una moneda de reserva alternativa y establecer acuerdos bilaterales de cambio de divisas, socavando el estrangulamiento del dólar en la financiación global."
 CHI_change_lunar_exploration: "Programa lunar Chang'e"
 CHI_change_lunar_exploration_desc: "El programa lunar robótico Chang'e comenzó con un orbitador en 2007 y progresó a través de aterrizajes suaves, los Yutu Rovers, y la histórica misión Chang'e 4 en enero de 2019, que colocó un lander y rover en el lado lejano lunar por primera vez en la historia. Los datos devueltos por estas misiones han redefinido nuestra comprensión de la geología de la Luna y pone las bases científicas para las misiones tripuladas que siguen."
 CHI_china_among_the_starts: "China Entre las estrellas"
 CHI_china_among_the_starts_desc: "Nuestro programa Shenzhou nos situó entre un puñado de naciones capaces de vuelos espaciales humanos independientes. Las misiones posteriores han establecido operaciones orbitales de atraque, extravehiculares y las bases para una estación espacial permanente. Ahora debemos aprovechar estos logros para asegurar nuestro estatus como una gran potencia espacial a la par con los estadounidenses y rusos."
 CHI_Chinese_Diplomacy: "Diplomacia china"
 CHI_Chinese_Diplomacy_desc: "El Reino Medio ha desempeñado históricamente un papel central en los asuntos de Asia oriental. Ahora que nos hemos recuperado del siglo de la humillación, es hora de trazar una estrategia diplomática integral que abarca tanto a los vecinos regionales como a las instituciones mundiales."
 CHI_chongqing_model_nationalisation: "El modelo Chongqing"
 CHI_chongqing_model_nationalisation_desc: "Chongqing bajo Bo Xilai demostró que una alternativa estatista al liberalismo del mercado sigue siendo viable dentro de la República Popular. Al renacionalizar los activos estratégicos y dirigir el crédito hacia las empresas estatales, el municipio registró un crecimiento del PIB muy superior al promedio nacional. Ampliaremos este modelo en todo el país."
 CHI_cic_forex_reserves: "China Investment Corporation"
 CHI_cic_forex_reserves_desc: "Hemos acumulado más de 1,4 billones de dólares estadounidenses en reservas de divisas, estacionados en bonos del Tesoro estadounidense de bajo rendimiento que sirven a las necesidades financieras de Estados Unidos más que nuestras propias. China Investment Corporation, capitalizada con 200 mil millones de dólares EE.UU., diversifica esta riqueza soberana en equidad privada global, infraestructura y activos estratégicos. Después de pérdidas tempranas en Blackstone y Morgan Stanley durante la crisis financiera, CIC madura en un inversor disciplinado administrando más de 1,3 billones de dólares estadounidenses, entre los mayores fondos soberanos del mundo."
 CHI_cj10_cj20_cruise_missile_family: "El CJ-10 y el CJ-20"
 CHI_cj10_cj20_cruise_missile_family_desc: "Los misiles cruceros de largo alcance dan a los bombarderos su golpe. El CJ-10 y el CJ-20, lanzado en tierra, permitieron que un solo H-6 alcanzara objetivos fijos a quincecientos kilómetros de distancia, multiplicando el alcance de toda la fuerza sin arriesgar a una tripulación sobre el objetivo."
 CHI_cloud_computing_triumvirate: "El Triumvirate Cloud Computing"
 CHI_cloud_computing_triumvirate_desc: "Alibaba Cloud tiene el 39 por ciento de nuestro mercado de nubes públicas; Tencent Cloud ancla el juego y los backends fintech; Huawei Cloud surge después de las sanciones de 2019 como alternativa nacional a los servicios estadounidenses. Los proveedores extranjeros se limitan a las empresas conjuntas en virtud de la Ley de seguridad cibernética. Hemos construido una infraestructura de nube nacional lo suficientemente grande como para sostener la economía digital sin dependencia extranjera, y eso no fue un accidente."
 CHI_coastal_acceleration_doctrine: "Doctrina de aceleración costera"
 CHI_coastal_acceleration_doctrine_desc: "Nuestras provincias costeras son donde el crecimiento es más rápido y donde los retornos a la liberalización son más claros. Debemos concentrar las políticas preferenciales en el río Pearl y los Deltas Yangtze: multiplicar las zonas de procesamiento de exportaciones, aflojar las cuotas de uso de la tierra para los parques industriales, y permitir que los gobiernos ribereños emitan bonos de infraestructura por delante del interior. El interior seguirá cuando la costa haya probado el modelo."
 CHI_coastal_sez_2nd_generation: "Zonas económicas especiales de segunda generación"
 CHI_coastal_sez_2nd_generation_desc: "La primera generación de SEZ en Shenzhen y Pudong demostró el modelo. Una segunda oleada de zonas se designa en Shanghai y Guangdong, con marcos legales mejorados, logística mejorada y protecciones IP más fuertes para atraer capital extranjero de mayor valor."
 CHI_combat_engineer_modernisation: "Modernizar los Ingenieros"
 CHI_combat_engineer_modernisation_desc: "Puentes, brechas y fortificaciones deciden si una brigada se mueve o valla. El cuerpo de ingenieros está reequipado con vehículos modernos de brida, remoción de minas y movimiento de tierra para que el terreno nunca más detenga el avance."
 CHI_commercial_launch_sector: "Sector comercial de lanzamiento"
 CHI_commercial_launch_sector_desc: "Desde 2015 una nueva generación de empresas comerciales chinas de lanzamiento se ha movido del blueprint al pad. LandSpace voló el primer cohete con combustible de metano para llegar a órbita con Zhuque-2 en 2023; Energía Galáctica e iSpace han llevado a cabo múltiples lanzamientos exitosos de satélite pequeño. El respaldo estatal para este ecosistema amplía nuestra base industrial, reduce los costes de lanzamiento y atrae el capital privado a la economía espacial."
 CHI_common_prosperity: "Prosperidad común"
 CHI_common_prosperity_desc: "La Prosperidad Común es nuestra prioridad de gobierno ahora. El crecimiento debe reorientarse hacia la reducción de la brecha de ingresos, la ampliación de los servicios sociales y la limitación del exceso del sector privado. Las compañías de almacenamiento, plataformas tecnológicas e industrias de entretenimiento deben aceptar nuevos límites. El objetivo declarado es un desarrollo ampliamente compartido; el efecto práctico es que reafirmamos la autoridad sobre los sectores que habían crecido más allá de nuestro alcance, y ambas cosas son verdaderas inmediatamente."
 CHI_common_prosperity_original: "Prosperidad común"
 CHI_common_prosperity_original_desc: "El objetivo del desarrollo no es agrandar el pastel indefinidamente mientras deja que los pobres se muevan por migajas. Prosperidad común significa dividir el pastel justo como lo cultivamos: redistribuir los ingresos, ampliar los servicios sociales y asegurar que los frutos de la industrialización lleguen al trabajador que construyó la fábrica así como al funcionario que lo planificó."
 CHI_Community_of_Shared_Future: "Comunidad de Futuros Compartidos"
 CHI_Community_of_Shared_Future_desc: "Promover el concepto de una comunidad de futuro compartido para la humanidad, abogando por el multilateralismo y la cooperación ganadera como alternativas a las instituciones dirigidas por Occidente."
 CHI_Comprehensive_Agreement_Investment: "Acuerdo de inversión UE-China"
 CHI_Comprehensive_Agreement_Investment_desc: "El Acuerdo global sobre la inversión, concluido después de siete años de negociaciones, concedería a nuestras empresas un mejor acceso a los mercados europeos de servicios a cambio de compromisos en materia de transparencia estatal. El Parlamento Europeo suspendió la ratificación tras las sanciones mutuas, pero persiste la lógica económica del acuerdo. Un acuerdo ratificado reduciría significativamente las barreras para el capital chino en todo el mercado único del bloque, y deberíamos presionar a Bruselas para que lo revive."
 CHI_construction_soe_champions: "Campeones Estatales de Construcción"
 CHI_construction_soe_champions_desc: "China State Construction Engineering Corporation, China Railway Construction Corporation, China Communications Construction Company y Power Construction Corporation ocupan colectivamente siete de los diez primeros puestos en el ranking mundial del contratista. Décadas de megaproyectos nacionales nos han dado una fuerza de trabajo capacitada de más de dos millones, la unidad cuesta entre veinte y treinta por ciento por debajo de los competidores occidentales, y las redes de adquisiciones que fuentes materiales más rápido que cualquier rival privado. Debemos proteger estas ventajas estructurales, porque se traducen directamente en costos más bajos y tiempos de construcción más cortos para cada categoría de construcción de capital que emprendemos en casa o vendemos en el extranjero."
 CHI_cosco_global_network: "COSCO Global Maritime Network"
 CHI_cosco_global_network_desc: "La fusión de COSCO y China Shipping forma uno de los transportistas de contenedores más grandes del mundo, y la posterior adquisición de Orient Overseas International extiende aún más nuestro alcance. COSCO Shipping Ports ahora opera terminales en Pireo, Zeebrugge, Valencia, Singapur, Abu Dhabi y Chancay. La Ruta de la Seda Marítima del Siglo XXI vincula estos nodos a una red respaldada por el Estado en cinco continentes. Nunca más deberíamos depender de los transportistas extranjeros para mover nuestras mercancías."
 CHI_Counter_Terrorism_Cooperation: "Cooperación en la lucha contra el terrorismo"
 CHI_Counter_Terrorism_Cooperation_desc: "El terrorismo, el separatismo y el extremismo amenazan la estabilidad regional. Al establecer mecanismos conjuntos de lucha contra el terrorismo dentro de la OCS, podemos coordinar las operaciones de intercambio de información y seguridad en todos los Estados miembros."
 CHI_crewed_lunar_landing: "Desembarco lunar tripulado"
 CHI_crewed_lunar_landing_desc: "El programa de aterrizaje lunar tripulado de China apunta a la región polar del sur lunar, apuntando a un primer touchdown alrededor de 2030. El perfil de la misión empareja el cohete del 10 de marzo largo con el vehículo de tripulación Mengzhou y el lander Lanyue, lanzando por separado el sitio de lanzamiento espacial Wenchang y reuniéndose en órbita lunar. El éxito haría de China la segunda nación para aterrizar humanos en la Luna."
 CHI_cross_strait_military_posture: "Postura militar transfronteriza"
 CHI_cross_strait_military_posture_desc: "Las fuerzas independentistas han consolidado el poder político en Taipei, y no podemos permitir que ese cambio pase sin respuesta. El Ejército Popular de Liberación debe intensificar su postura a través del Estrecho de Taiwán: ejercicios anfibios que crecen en frecuencia y escala, las incursiones aéreas en la zona de identificación de defensa de la isla hacen rutina. La reunificación no es simplemente una preferencia política. Es un objetivo nacional básico, y la fuerza detrás de él debe ser inconfundible."
 CHI_crossborder_ecommerce: "Cross-Border E-Commerce"
 CHI_crossborder_ecommerce_desc: "Nuestros fabricantes ahora venden directamente a consumidores globales, superando las cadenas de distribución tradicionales que las marcas extranjeras solían controlar. Los ciclos ultrarrápidos de SHEIN funcionan desde fábricas Guangzhou Panyu; Temu se convierte en la aplicación más descargada de EE.UU. dentro de un año de su lanzamiento. Las exportaciones transfronterizas alcanzan 400 mil millones de dólares estadounidenses; los gobiernos occidentales responden con restricciones del umbral de minimis."
 CHI_davos_boycott: "Boicot de Davos"
 CHI_davos_boycott_desc: "El Foro Económico Mundial representa la ideología del capital apátrida, un orden que subordina el desarrollo soberano a las preferencias de la financiación multinacional. Ya no enviaremos a nuestros altos funcionarios para arrodillarse ante los banqueros en las estaciones de montaña suizas. Nuestro camino es autosuficiencia y crecimiento dirigido por el Estado, no el Consenso de Washington vestido con nieve alpina."
 CHI_Debt_Trap_Diplomacy: "Diplomacia de Debt-Trap"
 CHI_Debt_Trap_Diplomacy_desc: "Extender los préstamos en términos que maximicen el apalancamiento chino sobre las naciones deudoras. Cuando no pueden pagar, extraiga concesiones estratégicas en forma de acceso portuario, derechos de recursos y alineación política."
 CHI_defence_industry_consolidation: "Consolidación de la industria de defensa"
 CHI_defence_industry_consolidation_desc: "AVIC, CSIC, NORINCO y los otros grandes conglomerados de nuestra base de defensa industrial son poderosos individualmente pero desperdiciados en conjunto. Deberíamos someterlos a una supervisión más estricta del SASAC, eliminar la duplicación, canalizar la inversión en programas prioritarios e imponer contratos de desempeño sobre gestión empresarial. Se deben ampliar las instalaciones de producción dedicadas en Sichuan y Guangdong, y el astillero Jiangnan merece una nueva inversión de muelles sin demora."
 CHI_designated_succesor: "Sucesor designado"
 CHI_designated_succesor_desc: "El diseño del liderazgo colectivo de Deng Xiaoping incluía un mecanismo de sucesión ordenado: cada líder supremo cultivaría a un sucesor para prevenir la regla indefinida de un hombre. Ahora navegamos entre las expectativas de esa tradición y la lógica de nuestra propia consolidación. Un sucesor designado proporciona reaseguro a las facciones cuidadosa de autoridad personal no comprobada, y el Tuanpai extrae una concesión simbólica a cambio de la aquiescencia. Es un precio que vale la pena pagar por estabilidad."
 CHI_Digital_Silk_Road: "Ruta digital de la seda"
 CHI_Digital_Silk_Road_desc: "Extender la infraestructura digital de China a las naciones en desarrollo a través de redes 5G, cables de fibra óptica y tecnología de ciudades inteligentes, creando dependencia tecnológica duradera."
 CHI_Digital_Silk_Road_Initiative: "Iniciativa Digital de Ruta de la Seda"
 CHI_Digital_Silk_Road_Initiative_desc: "Huawei y ZTE ya han construido redes 4G y 5G, cables submarinos y plataformas de vigilancia inteligente en más de 80 países. La Ruta Digital de la Seda crea dependencias tecnológicas profundas en los estados asociados y nos da acceso preferencial a su infraestructura de telecomunicaciones. Debemos acelerar este programa antes de que la presión regulatoria occidental convenza a más gobiernos para excluir a nuestras empresas."
 CHI_digital_yuan_ecny: "El Yuan Digital"
 CHI_digital_yuan_ecny_desc: "El Banco Popular de China ha lanzado el proyecto de Pago Electrónico de Moneda Digital, distribuyendo e-CNY a través de bancos comerciales en pilotos por todo Shenzhen, Suzhou y Beijing. Doscientos sesenta millones de carteras están ahora activas. Project mBridge test cross-border CBDC settlement with Hong Kong, Thailand, and the UAE as an alternative to SWIFT. El yuan digital no es simplemente una herramienta de pago; es la infraestructura de un orden monetario que no depende de Washington."
 CHI_distant_water_fishing_strategy: "Distante-Water Fishing Strategy"
 CHI_distant_water_fishing_strategy_desc: "Nuestra flota pesquera de aguas distantes supera ahora 2.500 buques que trabajan en las zonas económicas exclusivas de Mauritania, Sierra Leona, Argentina y Perú, un programa arraigado en la primera expedición de China National Fisheries Corporation a las aguas del África occidental. La estrategia Going Out incrusta la pesca de aguas distantes como un brazo permanente de nuestra política de seguridad alimentaria. Los subsidios de combustible, los buques de fabricación de hielo y los acuerdos portuarios en Bata, Walvis Bay y Montevideo mantienen operaciones, con el archipiélago Zhoushan en Zhejiang sirviendo como principal centro de procesamiento."
 CHI_ditiao_gang_crackdown: "El cierre ilegal de acero"
 CHI_ditiao_gang_crackdown_desc: "Más de 600 molinos de inducción no registrados, que producen una estimación anual de 140 millones de toneladas de acero subestándar de banda de ditiao, deben cerrarse. El Ministerio de Industria y Tecnología de la Información ha hecho de éste un centro de reforma estructural de la oferta. Las estadísticas oficiales de producción aumentarán a medida que se absorba la salida de sombras, la calidad del acero mejorará y los precios aumentarán a medida que el suministro de bajo grado sea eliminado del mercado. Los comerciantes de barras que se beneficiaron de este caos han tenido su tiempo."
 CHI_document_nine: "Document No. 9"
 CHI_document_nine_desc: "Una comunicación clasificada del Partido titulada «En el estado actual de la esfera ideológica» identifica siete amenazas ideológicas occidentales que deben suprimirse: democracia constitucional, sociedad civil, neoliberalismo, libertad de prensa, nihilismo histórico, cuestionar el socialismo y dudar de la reforma del Partido. Se ordenan sesiones de estudio obligatorias en universidades y medios estatales. Los límites del contrato de pensamiento aceptable durante la noche, y la lealtad se demuestra mediante el rechazo de conceptos extranjeros."
 CHI_domestic_eda: "EDA y IP nacionales"
 CHI_domestic_eda_desc: "El software electrónico de automatización del diseño -- las herramientas utilizadas para diseñar circuitos integrados -- había sido suministrado casi exclusivamente por Cadence, Synopsys y Mentor Graphics. Después de que los Estados Unidos colocaron herramientas EDA en la lista de control de las entidades, dirigimos inversión hacia Empyrean Technology, Primarius y Xpeedic. La cobertura nacional de EDA ha alcanzado la capacidad de flujo completo para los nodos maduros, aunque la cobertura de ganglios avanzados para el diseño sub-5nm sigue siendo parcial. La concesión de licencias estatales de bloques nacionales de IP complementa el desarrollo de EDA, y debemos cerrar la brecha restante antes de que Washington note cuán cerca estamos."
 CHI_dragon_eye_over_lanzhou: "Ojo de dragón sobre Lanzhou"
 CHI_dragon_eye_over_lanzhou_desc: "China construye su propio Egeo. El destructor Tipo 052C, liderado por el Lanzhou encargado en 2004, monta el radar de rayos escalonados tipo 346 'Dragon Eye' y el misil HHQ-9, dando por primera vez a un buque de guerra chino una verdadera flota de defensa aérea. La marina finalmente puede proteger sus propios cielos en el mar."
 CHI_dual_credit_auto_export: "Sistema dual-Credit y exportador más grande del mundo"
 CHI_dual_credit_auto_export_desc: "La regulación de Dual-Credit asigna cuentas separadas de consumo de combustible y crédito NEV a cada fabricante de automóviles en nuestro mercado, creando un mecanismo de tapa y tráfico para vehículos eléctricos que reemplaza subvenciones directas con presión competitiva. Ahora exportamos más de 5 millones de vehículos al año, superando Japón como el mayor exportador de automóviles del mundo. La Unión Europea impone obligaciones de 17 a 37 por ciento sobre la tarifa base; los Estados Unidos levan 100 por ciento en nuestros EVs. Ninguna barrera detendrá lo que el mercado ya ha decidido."
 CHI_eat_imperial_grain: "Comer la abuela imperial"
 CHI_eat_imperial_grain_desc: "Un ejército que dirige hoteles, contrabandea coches y comercios de armas es leal a su propio bolso, no al Partido. En julio de 1998 Jiang Zemin ordenó al PLA que entregara su imperio comercial y vivira en lugar del grano estatal, solo en el presupuesto. Tomamos ese camino hasta su fin: una fuerza profesional, pagada y limpia, que sólo responde a Beijing."
 CHI_ecommerce_infrastructure: "Infraestructura de comercio electrónico de China"
 CHI_ecommerce_infrastructure_desc: "Taobao derrotó eBay China con listados gratuitos y mensajes integrados, luego Tmall extendió la plataforma para marcar los escaparates B2C para minoristas internacionales. JD.com construyó su propia red de 1.500 almacenes y una fuerza de entrega a tiempo completo que opera más rápido que cualquier servicio logístico que hemos heredado. El comercio electrónico ahora representa el 30 por ciento de nuestro minorista, la mayor parte de cualquier economía importante, y la infraestructura que lo hace posible es enteramente nuestra."
 CHI_Economic_Framework_for_Unity: "Marco Económico para la Unidad"
 CHI_Economic_Framework_for_Unity_desc: "Las dos Coreas y sus grandes patronos dibujan una hoja de ruta para la integración económica. La inversión china en la infraestructura norcoreana, las transferencias de tecnología surcoreana y las garantías financieras norteamericanas forman los cimientos de una posible Corea unificada."
 CHI_Economic_Reintegration: "Reintegración económica"
 CHI_Economic_Reintegration_desc: "Comenzamos el largo proceso de integración de la economía de Corea del Norte en nuestra esfera industrial. La inversión fluye hacia el norte; materias primas y flujo de trabajo al sur. La relación tributaria coreana, adormecida por un siglo, es efectivamente restaurada."
 CHI_Eight_Country_Initiative: "Iniciativa del Pacífico de ocho países"
 CHI_Eight_Country_Initiative_desc: "Un marco económico y de seguridad consolidado propuesto a ocho estados de las islas del Pacífico nos daría un acuerdo regional sobre vigilancia de la pesca y redes de datos en una sola firma. La iniciativa prueba si nuestro capital diplomático acumulado en todo el Pacífico puede convertirse en un acuerdo colectivo que rivalice con la arquitectura regional que Australia ha mantenido durante décadas. El éxito determina si lideramos el diseño institucional del Pacífico o simplemente participamos en él."
 CHI_eleventh_five_year_plan: "El 11o Plan Quinquenal"
 CHI_eleventh_five_year_plan_desc: "Nuestro próximo Plan Quinquenal debe establecer objetivos vinculantes: una reducción obligatoria del 20% de la intensidad energética por unidad del PIB, una reducción del 10% en las principales emisiones contaminantes y una mayor proporción de servicios en el PIB. También debemos aumentar la inversión estatal en investigación y educación y acelerar la construcción de infraestructuras rurales. El crecimiento sin estas limitaciones es el crecimiento que no podemos sostener."
 CHI_establish_defence_conglomerates: "Establecer los Conglomerados de Defensa"
 CHI_establish_defence_conglomerates_desc: "Las fábricas estafadas y los ministerios de enemistad no pueden armar un gran poder. Recopilamos el sector de defensa en un puñado de vastos conglomerados estatales, cada uno un campeón nacional en su dominio, capaz de financiar la investigación, el talento de la piscina y responder a las órdenes del ejército a escala."
 CHI_Eurasian_Land_Bridge: "Puente terrestre eurasiático completo"
 CHI_Eurasian_Land_Bridge_desc: "El servicio de flete Yiwu-London demostró que un corredor ferroviario terrestre no roto del este de China a Europa occidental está en funcionamiento comercialmente. La integración eurasiática completa significa que nuestros fabricantes pueden llegar a los mercados europeos en dieciocho días en lugar de los treinta y cinco requeridos por el mar. Ahora debemos invertir para aumentar la capacidad y frecuencia hasta que la ruta rivalice con el transporte marítimo en volumen."
 CHI_Exercise_Paektu_Honor: "Ejercicio Paektu Honor"
 CHI_Exercise_Paektu_Honor_desc: "Señalamos moderación a través de un ejercicio militar bilateral que hace hincapié en posturas defensivas en el río Yalu. El mensaje a Washington es claro: podemos manejar Pyongyang sin una respuesta escalatoria estadounidense."
 CHI_Expand_Foreign_Service: "Ampliar el Servicio Exterior"
 CHI_Expand_Foreign_Service_desc: "Debemos expandir rápidamente nuestra red consular y el cuerpo diplomático. Ninguna otra nación en la tierra ha logrado mantener más puestos diplomáticos en todo el mundo que nosotros, y debemos presionar esa ventaja aún más."
 CHI_export_processing_zones: "Zonas de proceso de exportación"
 CHI_export_processing_zones_desc: "Las zonas de elaboración de exportaciones designadas en Jiangsu, Fujian y Zhejiang ofrecen almacenamiento en condiciones de servidumbre, aduanas simplificadas y ventajas de costos laborales que atraen operaciones de ensamblaje desde Corea, Taiwán y Japón. China se convierte en el nodo final de montaje en las redes de producción de Asia oriental."
 CHI_fabless_design_cluster: "Grupo de diseño de las capacidades"
 CHI_fabless_design_cluster_desc: "Nuestra industria de diseño semiconductor se ha consolidado en torno a Shenzhen y Shanghai. Las subvenciones estatales han llevado a cientos de startups al diseño de chips para la electrónica de consumo, las comunicaciones y los aceleradores de IA. La proximidad de Shenzhen a las cadenas de suministro PCB, fabricación de contratos y electricidad del consumidor lo convierte en el centro natural; el clúster de diseño de la ciudad ha producido Himax, Rockchip, Allwinner y decenas de casas de diseño más pequeñas, muchas respaldadas por vehículos provinciales Big Fund. La profundidad de este ecosistema es nuestra ventaja estructural."
 CHI_factional_balance: "Saldo Faccional"
 CHI_faw_changchun_automotive: "Expansión de FAW en Changchun"
 CHI_faw_changchun_automotive_desc: "First Automobile Works, con sede en Changchun, es nuestro fabricante de coches más antiguo y la base sobre la que se construyó el resto de nuestro sector automotriz. Debemos ampliar su cartera de acciones conjuntas con Volkswagen y Toyota mientras canalizamos la inversión estatal en el desarrollo de marcas indígenas. La provincia de Jilin se convertirá en el ancla de nuestra industria automotriz nacional."
 CHI_fifty_vanke_handover: "La maniobra de Vanke"
 CHI_fifty_vanke_handover_desc: "En diciembre de 1998 miles de empresas militares fueron evaluadas, registradas y firmadas a la propiedad civil. Las armas de propiedad valen una fortuna, igual a cincuenta desarrolladores Vanke, dejan los libros del ejército para siempre. Los generales pierden sus fiefes, y el Partido gana una espada limpia."
 CHI_Five_Stars_Highway: "Corredor de autopistas de cinco países"
 CHI_Five_Stars_Highway_desc: "Un corredor de carretera transcontinental que une los puertos del Atlántico brasileño a las terminales del Pacífico peruano atraviesa cinco países y acorta el tránsito terrestre por semanas. El proyecto es el insignia de nuestra ambición logística sudamericana, duplicando la lógica económica del Canal de Panamá a escala continental. Nuestras empresas de construcción e instituciones financieras cargarán la carga del desarrollo, y seguirá el agradecimiento de cinco naciones."
 CHI_flying_leopard_doctrine: "La Doctrina del Leopardo Volador"
 CHI_flying_leopard_doctrine_desc: "La flota aprende a atacar desde el aire antes de tener un portaaviones. Bomberos JH-7 'Flying Leopard', armados con misiles antiaéreos, convierten la aviación naval en un brazo de ataque independiente capaz de llegar lejos sobre el agua y hundir un grupo de tareas enemigo desde la costa."
 CHI_Forum_China_CELAC: "Foro de cooperación China-CELAC"
 CHI_Forum_China_CELAC_desc: "La Comunidad de Estados de América Latina y el Caribe nos proporciona un canal multilateral que divide a la Organización de los Estados Americanos, que Washington ha dominado desde hace mucho tiempo. Un foro ministerial construido alrededor de la infraestructura, el comercio y la inversión agrícola nos da un vehículo para erosionar la primacía institucional de los Estados Unidos en su propio hemisferio. Debemos tratar este marco como una inversión a largo plazo, no un gesto de una sola vez."
 CHI_four_trillion_stimulus: "Cuatro Trillion Yuan Stimulus"
 CHI_four_trillion_stimulus_desc: "Un paquete de estímulo de 4 billones de yuan equivalente al 12 por ciento del PIB se dirige principalmente a ferrocarriles, carreteras, aeropuertos y viviendas sociales. Los gobiernos locales prestan préstamos a través de los vehículos de financiación del gobierno local para cofinanciar su parte del programa. China State Construction y China Communications Construction se expanden rápidamente en los contratos resultantes. Evitamos la recesión mientras el resto de los contratos mundiales, pero el estímulo genera una sobrecarga en las finanzas del gobierno local y acelera la formación de una burbuja inmobiliaria en ciudades como Ordos y Changzhou. Los costos son reales, y llegarán."
 CHI_FTA_2015: "China-Corea del Sur Tratado de Libre Comercio"
 CHI_FTA_2015_desc: "Nuestro acuerdo de libre comercio con Corea del Sur se aplica plenamente. Las reducciones arancelarias, los corredores logísticos conjuntos y el comercio agrícola y electrónico ampliado profundizan la interdependencia bilateral y dan a Seúl una participación material en las relaciones estables con nosotros. Una Corea económicamente ligada es menos probable que siga el liderazgo de Washington cuando los dos conflictos."
 CHI_game_licensing_regs: "Reglamento de concesión de licencias de juego"
 CHI_game_licensing_regs_desc: "El NPPA juega con menores juegos a las tres horas de la semana, requiriendo cumplimiento del reconocimiento facial. Un editorial Xinhua describe los juegos como opio espiritual, eliminando el 10 por ciento del precio de acciones de Tencent en una sola sesión. Los nuevos títulos requieren una licencia de banhao, con preferencia por temas patrióticos. Las aprobaciones reanudan como estudios fundamentales para los mercados extranjeros, exportando un producto que la regulación ha hecho ideológicamente fiable."
 CHI_geely_volvo_acquisition: "Adquisición de Volvo Geely"
 CHI_geely_volvo_acquisition_desc: "La adquisición de Volvo Cars a Ford por parte de Li Shufu, por 1.800 millones de dólares, sentó un modelo para las adquisiciones chinas en el extranjero, centradas en la marca, la propiedad intelectual y las redes de distribución más que en las fábricas. Geely adquiere después la London Taxi Company, una participación del 49,9 por ciento en Proton, el 51 por ciento de Lotus y el 9,7 por ciento de Daimler AG. Cada adquisición no es solo una transacción comercial, sino una declaración de que las empresas chinas pueden poseer lo que antes solo ensamblaban."
 CHI_Geneva_Carve_Out: "Marco bilateral de Ginebra"
 CHI_Geneva_Carve_Out_desc: "La tradición suiza de neutralidad comercial lo convierte en un punto de entrada natural para nuestro capital buscando acceso al mercado europeo que evite el escrutinio regulatorio de la Unión Europea. Un acuerdo bilateral de libre comercio y una serie de memorandos de mercado financiero dan a nuestros bancos y fondos soberanos un puesto de Ginebra que opera bajo supervisión más ligera que cualquier jurisdicción comparable de la UE. Bern gana ingresos por honorarios y volumen de transacción, mientras que ganamos una dirección financiera occidental creíble."
 CHI_Global_Ambitions: "Ambiciones mundiales"
 CHI_Global_Ambitions_desc: "Estamos listos para definir nuestro papel en el escenario mundial. La pregunta no es si seremos un gran poder, sino qué clase de gran poder escogemos ser."
 CHI_gobi_solar_offshore_wind: "El cinturón solar Gobi y las bases eólicas offshore"
 CHI_gobi_solar_offshore_wind_desc: "Nuestra Ley de Energía Renovable y los aranceles alimentarios NDRC han construido el marco normativo que impulsa el colapso del costo solar. LONGi Green Energy, JinkoSolar, Trina Solar y JA Solar han reducido los costos de panel por debajo de 0,10 dólares EE.UU. por watt. La producción de polisilicones en Xinjiang y Sichuan ahora suministra más del 80 por ciento de la demanda mundial. La Gran Muralla Solar de Kubuqi en Mongolia Interior, el Parque Solar del Desierto Tengger en Ningxia y la Base Solar-Wind Hami en Xinjiang son instalaciones gigantescas a escala; el viento offshore se está expandiendo en Yangjiang, Putian y Yancheng. La promesa de doble carbono ancla permanentemente el programa."
 CHI_governance_moderenisation: "Modernización de la gobernanza"
 CHI_governance_moderenisation_desc: "Los sistemas de crédito social, la infraestructura digital de identidad y las redes integradas de vigilancia deben ser unificados en un marco único que rastrea el cumplimiento, recompensa la cooperación y banderas disentimiento. Las tecnologías inteligentes de la ciudad proporcionan un monitoreo en tiempo real del movimiento urbano y las comunicaciones a una escala que ninguna administración anterior podría gestionar. La gobernanza digital es legible por la administración: una población visible para nosotros a cada nivel, y gobernable en consecuencia."
 CHI_grain_for_green_program: "Programa de cereales para los países verdes"
 CHI_grain_for_green_program_desc: "Las catastróficas inundaciones de Yangtze dieron un veredicto geológico sobre décadas de deforestación de Loess Plateau: 4.150 muertos, 21 millones de hectáreas inundadas y un sistema fluvial ya no pudo absorber su propia cuenca hidrográfica. El programa Grain-for-Green convierte las pendientes más pronunciadas que 25 grados de vuelta a los bosques o pastizales, reemplazando los ingresos perdidos por cosecha con los pagos de cereales y efectivo. Cubrimos 32 millones de hectáreas; la agricultura consolidada en tierras planas productivas aumenta los rendimientos por hectárea en las zonas restauradas. La restauración y la productividad no son opuestos."
 CHI_great_wall_suv_dominance: "Gran Muralla Haval SUV Dominance"
 CHI_great_wall_suv_dominance_desc: "Wei Jianjun construyó Great Wall Motors en nuestro campeón de SUV desde una fábrica en Baoding que los fabricantes globales apenas notaron. El Haval H6 se convirtió en el SUV más vendido de China durante cuatro años consecutivos; Haval entonces se convirtió en una marca independiente, seguida por WEY, Ora, Tank y Poer. Great Wall ahora opera plantas de montaje en Rusia, Tailandia y Brasil, apuntando a segmentos que los fabricantes occidentales habían subestimado sistemáticamente y dejado sin pruebas."
 CHI_guatian_reckoning: "El Reckoning"
 CHI_guatian_reckoning_desc: "El injerto no puede permanecer enterrado para siempre. Los barones logísticos que vendieron tierras militares y almacenaron cajas de licor y oro se enfrentan a su día de cálculo, y la camarilla debe elegir si entregar unos pocos chivos expiatorios o rangos cercanos y desafiar a Beijing."
 CHI_Gulf_Yuan_Settlement: "Mecanismo de asentamiento de Yuan del Golfo"
 CHI_Gulf_Yuan_Settlement_desc: "Los estados del Consejo de Cooperación del Golfo comienzan a fijar una parte importante de las exportaciones de petróleo crudo en el renminbi, enrutadas por el Sistema Interbancario Transfronterizo en lugar de SWIFT. Combinado con líneas de intercambio de bancos centrales y asignaciones de fondos soberanos RMB, el cambio erosiona constantemente la ventaja estructural del petrodollar. Los Estados Unidos pierden una palanca de coacción financiera que ejerce desde 1974."
 CHI_h20_programme: "The H-20 Programme"
 CHI_h20_programme_desc: "La última brecha en el arsenal de gran potencia es un bombardero sigiloso, y nos propusimos cerrarlo. El H-20, un diseño volador que decía llevar diez toneladas de armas a unos ocho mil kilómetros sin combustible, permitiría que China atacara el Pacífico desde su propio espacio aéreo. Con él, la pierna bombardero de una verdadera triada global está completa."
 CHI_h6k_revival: "The H-6K Revival"
 CHI_h6k_revival_desc: "La vieja copia Tu-16 es renacida. El H-6K comercializa su bahía de bombas para los pylons de crucero y se adapta a turbofanes eficientes por un rango mucho mayor, convirtiéndose en una plataforma de despegue que arroja misiles tierra-ataque desde más allá de las defensas de un enemigo. Cien y diez forman ahora el núcleo de la fuerza bombardera."
 CHI_harbin_equipment_manufacturing: "Base para el equipo pesado de Harbin"
 CHI_harbin_equipment_manufacturing_desc: "El legado de Harbin de la industria pesada de la era soviética es modernizado y redirigido hacia equipos de generación de energía, componentes ferroviarios y maquinaria industrial. La ciudad se convierte en la columna vertebral de ingeniería de la expansión de la infraestructura china."
 CHI_Health_Silk_Road: "Salud Silk Road"
 CHI_Health_Silk_Road_desc: "La Ruta de la Seda de Salud extiende nuestra asistencia médica, construcción hospitalaria y cadenas de suministro farmacéutico a los estados asociados de BRI. El marco adquirió prominencia durante la pandemia Covid-19, cuando nuestra diplomacia de vacunas reforzó nuestra posición como socio de desarrollo de salud para el Sur Global. Ahora debemos formalizarlo y ampliarlo para que la dependencia de las instituciones farmacéuticas occidentales ya no sea el defecto."
 CHI_heavy_combined_arms_brigade: "Brigadas de brazo mixto pesado"
 CHI_heavy_combined_arms_brigade_desc: "Tanques solo mueren rápidamente. Masajeamos el tipo 99 con infantería rastreada, armas autopropulsadas e ingenieros en grandes brigadas de armadura combinadas, formaciones de choque autosuficientes construidas para romper una línea fortificada y seguir moviéndose."
 CHI_hebei_steel_group: "Hebei Iron & Grupo de acero"
 CHI_hebei_steel_group_desc: "La provincia de Hebei ha consolidado Tangshan Iron y Steel, Handan Iron and Steel, y molinos más pequeños en Hebei Iron y Steel Group, formando lo que se convertirá en HBIS. Las fusiones paralelas han creado Anshan-Benxi en Liaoning y Shandong Steel Group en el mismo período. El 12o Plan Quinquenal eleva la consolidación en la política nacional, estableciendo un objetivo de los diez principales productores que controlan el 60 por ciento de la producción. La era de mil molinos pequeños que compiten en los márgenes delgados debe terminar."
 CHI_henan_grain_modernization: "Modernización agrícola de Henan"
 CHI_henan_grain_modernization_desc: "La provincia de Henan alimenta a más personas que cualquier país en Europa. La inversión en infraestructura de almacenamiento, capacidad de procesamiento y servicios de extensión agrícola aumenta los rendimientos y reduce las pérdidas posteriores a la cosecha, el fortalecimiento de la seguridad alimentaria nacional y la liberación del trabajo rural para redespliegue industrial."
 CHI_high_speed_rail_one: "Fase 1 de alta velocidad"
 CHI_high_speed_rail_one_desc: "Nuestras primeras líneas de alta velocidad dedicadas están abriendo en rápida sucesión: Beijing-Tianjin, luego Wuhan-Guangzhou, entonces el ambicioso pasillo Beijing-Shanghai, que será la línea de alta velocidad más larga del mundo. El programa se basa en la tecnología CRH con licencia de los fabricantes europeos y japoneses, que nuestros ingenieros están adaptándose a las condiciones chinas. Lo que comienza como el conocimiento prestado se convertirá en nuestro propio."
 CHI_hisilicon_kirin: "HiSilicon Kirin plataforma móvil"
 CHI_hisilicon_kirin_desc: "HiSilicon, subsidiaria de Huawei, creó la serie Kirin SoC para teléfonos Huawei, introduciendo una NPU en chip antes de cualquier competidor occidental y alcanzando la producción de 7nm en TSMC. Después de que los controles de exportación estadounidenses cortaran ese suministro, Huawei trabajó con SMIC para fabricar el Kirin 9000S en un nodo de proceso alcanzable a nivel nacional. El programa demostró que una casa de fábulas chinas podría alcanzar el nivel de rendimiento de Apple y Qualcomm, y proporcionó una plantilla cada desarrollador de SoC doméstico está siguiendo ahora."
 CHI_Honiara_Security_Pact: "Acuerdo de Seguridad Honiara"
 CHI_Honiara_Security_Pact_desc: "El marco de seguridad con las Islas Salomón permite que la Armada del Ejército Popular de Liberación arroje, reaprovisione y lleve a cabo operaciones desde Honiara, a menos de 2.000 kilómetros del continente australiano. Canberra reacciona con alarma, acelerando los plazos de AUKUS y presionando a Washington para aumentar la postura de disuasión del Pacífico. El pacto nos da nuestra primera huella de seguridad reconocida al este de la Cadena de Primera Isla, y debemos asegurarlo antes de que Honiara sea presionada para volver a caminar."
 CHI_hq17_medium_range_air_defense: "Defensa de alcance mediano"
 CHI_hq17_medium_range_air_defense_desc: "Por encima de la capa de defensa del punto añadimos cubiertas de mediano alcance, tejiendo misiles cortos y de mayor alcance en un escudo en red para que no se mantenga ningún enfoque abierto entre las copas de los árboles y la estratosfera."
 CHI_hq17_short_range_sam: "HQ-17 Short-Range SAM"
 CHI_hq17_short_range_sam_desc: "Las brigadas necesitan su propio paraguas. El HQ-17, desarrollado desde el Tor ruso, proporciona una defensa de puntos de reacción rápida contra aviones, drones y municiones de precisión, montadas para mantener el ritmo con la armadura que protege."
 CHI_hu_jintao_reign: "La era Hu Jintao"
 CHI_hu_jintao_reign_desc: "El supuesto de Hu Jintao de las oficinas del Secretario General, Presidente y Presidente de la Comisión Militar Central marca la transición más ordenada en la historia de nuestra república. Su administración hará hincapié en la gobernanza institucional y la toma de decisiones colectivas sobre la autoridad personal, acercando nuestro sistema al tipo de sucesión regular que requieren los estados estables."
 CHI_hua_hong_mature_node: "Capacidad de Hua Hong Mature-Node"
 CHI_hua_hong_mature_node_desc: "Hua Hong Semiconductor, originalmente una empresa conjunta Sino-French en Jinqiao, reorientada hacia la producción especializada de nódulos maduros: gestión de energía, memoria no volátil incrustada y chips analógicos para los mercados automotriz e IoT. Sus fabs de 200 mm y 300mm en Shanghai y Wuxi sirvieron a cadenas nacionales de suministro que las sanciones occidentales no podían alcanzar fácilmente. La reinversión estatal amplió la capacidad y diversificó su base de clientes más allá del mercado de exportación."
 CHI_hualong_nuclear_batch: "Construcción masiva de Hualong One"
 CHI_hualong_nuclear_batch_desc: "Después de importar reactores Westinghouse AP1000 a los reactores Sanmen y Haiyang, Framatome EPR a Taishan, y unidades Rosatom VVER a Tianwan, hemos completado nuestro propio diseño de tercera generación. Hualong One, una fusión de ACP-1000 del CNNC y ACPR-1000 de CGN, posee plena propiedad intelectual china y cumple con los Requisitos Europeos de Utilidad. La unidad 5 de Fuqing se conecta a la red primero; la base nuclear Zhangzhou, Changjiang en Hainan, Fangchenggang y Taipingling siguen. La versión de exportación, HPR1000, entra en servicio en Karachi K-2 y K-3, y esto es sólo el comienzo de nuestro programa de exportación nuclear."
 CHI_huawei_zte_export: "Las exportaciones de equipos de Huawei"
 CHI_huawei_zte_export_desc: "Huawei y ZTE capturan más del 35 por ciento del mercado mundial de equipos de telecomunicaciones, con la ventaja Polar Code de Huawei en los estándares 5G que sustentan su dominio. A través de la Ruta Digital de la Seda, nuestra infraestructura llega a los operadores en 170 países. Los gobiernos occidentales responden con prohibiciones y restricciones a la lista de entidades, pero la infraestructura física que ya hemos instalado no puede ser eliminada por legislación."
 CHI_huludao_schoolhouse: "El Huludao Schoolhouse"
 CHI_huludao_schoolhouse_desc: "Los portaaviones son inútiles sin pilotos que pueden aterrizar sobre ellos. En Huludao la Universidad de Aviación Naval levanta un gasoducto dedicado portaaviones, completo con un equipo terrestre de esquí y detención, entrenando desde cero a los aviones que harán de una cubierta en movimiento un lugar desde el cual luchar."
 CHI_hybrid_rice_super_program: "Super híbrido programa Rice"
 CHI_hybrid_rice_super_program_desc: "El Centro Nacional de Investigación y Desarrollo Híbrido de Yuan Longping en Changsha persigue sucesivos hitos de rendimiento, cada invierno reubicando su equipo de cría a Sanya en la isla de Hainan, donde el clima tropical permite un cultivo durante todo el año imposible en el continente. Las variedades híbridas ya cubren el 60% de nuestro acreaje de arroz, y ahora un programa paralelo investiga el arroz marino tolerante a la sal para la Placa del Norte de China. Debemos mantener esta inversión: la seguridad alimentaria es la base sobre la cual descansa cada otra ambición."
 CHI_hydrogen_green_steel: "Hydrogen Steelmaking"
 CHI_hydrogen_green_steel_desc: "Nuestros objetivos de doble carbono y el Mecanismo de Ajuste Fronterizo del Carbono de la UE presionan a nuestros siderúrgicos para que se descarbonicen antes de que los aranceles extranjeros les hagan la elección. Baowu ha encargado una planta de demostración de reducción directa basada en hidrógeno de un millón de toneladas en Zhanjiang, colaborando con Rio Tinto. HBIS está lanzando un proyecto similar en Zhangjiakou utilizando hidrógeno verde de electrolisis. Debemos elevar la parte del horno eléctrico de arco de nuestra producción sustancialmente durante el próximo decenio, y la planificación para esa transición comienza ahora."
 CHI_hypersonic_strike_integration: "Integración de Strike Hypersonic"
 CHI_hypersonic_strike_integration_desc: "La velocidad se convierte en el nuevo robo. Doblamos armas hipersónicas, deslizando más rápido que cinco veces la velocidad del sonido y maniobrar todo el camino hacia abajo, hacia el paquete de ataque de la fuerza aérea, presentando defensas enemigas con una amenaza que no tienen medios probados para detener."
 CHI_ilrs_lunar_base: "Estación internacional de investigación lunar"
 CHI_ilrs_lunar_base_desc: "China y Rusia firmaron la hoja de ruta para la Estación Internacional de Investigación Lunar en 2021, invitando a las naciones asociadas a construir un puesto de investigación operado conjuntamente cerca del polo lunar sur. El programa prioriza la utilización de recursos in situ, la infraestructura de superficie permanente y un esquema de rotación tripulada comparable al modelo de estación de investigación antártica. Nos comprometemos con nuestra base industrial e ingeniería para que sea una realidad."
 CHI_individual_soldier_system: "El sistema de soldados individuales"
 CHI_individual_soldier_system_desc: "El tirador se convierte en un nodo, no sólo un gatillo. Un nuevo sistema de soldados agrupa óptica, radio, navegación y armadura corporal en un solo kit, vinculando a cada infantería con la red del escuadrón y el mapa del comandante."
 CHI_Indo_Pacific_Strategy_Collapsed: "La Estrategia Indopacífico se derrumbó"
 CHI_Indo_Pacific_Strategy_Collapsed_desc: "El retiro de Corea del Sur del marco trilateral estadounidense-Japón-Filipinas invierte un vínculo crítico en la cadena Indopacífico de Washington. Japón está solo para gestionar sus ansiedades de seguridad, y la credibilidad estadounidense en toda la región está sacudida."
 CHI_Information_Warfare: "Información Warfare"
 CHI_Information_Warfare_desc: "Deplorar los medios de comunicación estatales, las operaciones de redes sociales y las narrativas estratégicas para dar forma a la opinión pública en los países destinatarios y contrarrestar el dominio de la información occidental."
 CHI_informatized_local_wars: "Ganar guerras locales informatizadas"
 CHI_informatized_local_wars_desc: "Ya no nos preparamos para una guerra total en la llanura norteña. La doctrina guía se convierte en ganar guerras locales bajo condiciones informatizadas: corto, agudo, campañas de alta tecnología sobre la periferia china, decidida por quién ve y golpea primero a través de un campo de batalla en red. Cada reforma de abajo sirve ahora a esta única demanda."
 CHI_inner_party_supervision_regulations: "Reglamento de supervisión interna del Partido"
 CHI_inner_party_supervision_regulations_desc: "Nuestra rendición de cuentas interna se ha basado demasiado en normas informales y conexiones personales. Debemos adoptar normas formales de supervisión que establezcan procedimientos obligatorios para que los órganos superiores inspeccionen, informen y sancionen a los comités del partido subordinado. Codificar estos mecanismos reducirá el espacio para que los funcionarios locales actúen como infieles intocables."
 CHI_integrated_air_and_space: "Aire y espacio integrados"
 CHI_integrated_air_and_space_desc: "La fuerza aérea debe dejar de ser el paraguas del ejército y convertirse en un servicio estratégico por derecho propio. Proseguimos 'operaciones aéreas y espaciales integradas, preparadas tanto para el delito como para la defensa', la doctrina adoptada en 2004 que une a los combatientes, bombarderos, misiles, satélites y alerta temprana a un solo alcance. El cielo y el espacio cercano se convierten en un teatro, y debe ser nuestro."
 CHI_intra_party_democracy_experiments: "Experimentos de democracia intrapartidista"
 CHI_intra_party_democracy_experiments_desc: "Varias localidades han llevado a cabo elecciones competitivas multicandidatas para puestos de partido en los condados y municipios. Los partidarios argumentan que la selección competitiva fortalecerá la legitimidad y mejorará la gobernanza; los críticos advierten que las elecciones impugnadas erosionarán la disciplina ideológica y crearán una competencia de facciones. El resultado de estos experimentos determinará si ampliamos o suprimimos el modelo."
 CHI_invigorate_country_through_STE: "Invitar el país a través de los STE"
 CHI_invigorate_country_through_STE_desc: "En 1995, cerca del final de su mandato, Jiang Zemin promovió la estrategia de rejuvenecer a la nación por medio de la ciencia y la educación. Al priorizar la inversión en investigación, captación tecnológica y educación superior, el plan tiene como objetivo cerrar la brecha con el mundo desarrollado y cambiar a China de una economía impulsada por el trabajo hacia uno basado en el conocimiento."
 CHI_iron_ore_pricing_war: "La batalla de los precios del mineral de hierro"
 CHI_iron_ore_pricing_war_desc: "Baosteel ha tomado el control de Nippon Steel como principal negociador para compradores chinos en las conversaciones anuales de referencia del mineral de hierro con Rio Tinto, BHP Billiton y Vale. El sistema se colapsa a medida que las compras de manchas de los molinos chinos más pequeños socavan el punto de referencia. La detención del ejecutivo de Rio Tinto Stern Hu en Shanghai y la fallida oferta chinalco por una participación del 18% en Río Tinto marcan el pico de fricción diplomática, y debemos responder acelerando la inversión minera extranjera en Australia y África Occidental para diversificar nuestro suministro."
 CHI_j10c_multirole_refit: "The J-10C Refit"
 CHI_j10c_multirole_refit_desc: "El J-10 crece dientes. El J-10C añade un radar AESA, el misil PL-15 de largo alcance y, a partir de 2021, un motor WS-10B doméstico, convirtiendo al luchador ligero en una auténtica amenaza multirole que desde entonces ha atraído sangre en los cielos del sur de Asia."
 CHI_j11b_sinification: "Sinify the J-11"
 CHI_j11b_sinification_desc: "La licencia Su-27 construida en Shenyang se convierte en un avión chino. El J-11B intercambia radar ruso, aviónicos y misiles para sistemas domésticos, liberando la línea Flanker de los repuestos de Moscú y demostrando que la industria china puede reiniciar un combate de primera línea final a fin."
 CHI_j16_strike_platform: "J-16 Strike Platform"
 CHI_j16_strike_platform_desc: "El J-16 'Qianlong', un peso pesado de dos asientos crecido desde el Flanker, lleva un radar AESA, las armas más profundas cargadas en la flota y un largo alcance. Ahora China va a jet para presionar en el espacio aéreo de Taiwán, es la plataforma de ataque multirole alrededor de la cual se construye el aire moderno."
 CHI_jh7a_update: "The JH-7A Update"
 CHI_jh7a_update_desc: "El JH-7A 'Flying Leopard', un robusto caza de dos asientos-bomber, se actualiza con nuevas armas de precisión y vainas de orientación, manteniendo un avión de ataque marítimo barato y probado relevante junto a la nueva flota."
 CHI_jiang_doctrine_taiwan: "La Doctrina Jiang en Taiwán"
 CHI_jiang_doctrine_taiwan_desc: "La propuesta de ocho puntos de Jiang establece una política transversal en torno a la reunificación pacífica y se niega explícitamente a descartar la fuerza. Integrar esta doctrina con el creciente arsenal anti-acceso del PLA nos da un marco coercitivo creíble y eleva el costo de la independencia de jure de Taiwán a un nivel que ningún gobierno en Taipei puede pagar políticamente."
 CHI_jiangnan_changxing_move: "El movimiento Jiangnan-Changxing"
 CHI_jiangnan_changxing_move_desc: "Asolado en el corazón del viejo Shanghai, el patio histórico de Jiangnan no puede crecer. Lo trasladamos a la isla Changxing, a vastos nuevos salones y abejas de aguas profundas construidas para poner naves de guerra por docenas. La reubicación multiplica nuestra capacidad de construcción en un accidente cerebrovascular y se convierte en la forja de la flota moderna."
 CHI_jiangnan_scale: "Escala Up Jiangnan Shipyard"
 CHI_jiangnan_scale_desc: "Los buques de guerra se ganan en la pasarela antes de que sean ganados en el mar. Los amplios nuevos pasillos del patio de Jiangnan en la isla Changxing son empujados a un tempo completo, poniendo destructores y portaaviones en paralelo donde rivales los ponen uno a la vez."
 CHI_joint_operations_command: "Comando Conjunto de Operaciones"
 CHI_joint_operations_command_desc: "La victoria pertenece ahora a quien fusea las fuerzas de tierra, mar, aire y cohete en un puño. Nos ponemos de pie un auténtico comando de operaciones conjuntas, dirigiendo los cinco teatros a una sola imagen para que toda la fuerza armada luche de inmediato, no por servicios que se turnan. Esto desbloquea la estructura del teatro-comandante."
 CHI_Joint_Operations_tt: "Provoca un evento de elección estratégica. La opción defensiva forma o extiende la facción de la OCS con Afganistán, Pakistán y Tayikistán. En cambio, las opciones punitivas y de guerra total crean guerrilleros sobre los talibanes y TTP a través de la respuesta de Pakistán."
 CHI_joint_stock_city_banks: "Bancos Comerciales y Bancos Municipales"
 CHI_joint_stock_city_banks_desc: "Debajo de los Grandes Cuatro, un rico segundo nivel se ha desarrollado. China Merchants Bank se ha convertido en el líder bancario minorista con fuerte banca móvil; China Minsheng Bank, el primer banco no estatal, sirve a pequeñas y medianas empresas; HSBC tiene una participación del 19,9% en Bank of Communications. Más de 130 bancos comerciales municipales anclan las finanzas regionales en ciudades de nivel dos y tres, impulsando un acceso más amplio al crédito para empresas privadas y la adopción más rápida de servicios bancarios digitales. Esta diversidad de instituciones es una fuerza que debemos cultivar."
 CHI_joint_venture_framework: "Marco Industrial Conjunto de Ventura"
 CHI_joint_venture_framework_desc: "Un marco amplio rige la transferencia de tecnología, los requisitos de contenido local y la repatriación de beneficios en empresas conjuntas. Las empresas extranjeras obtienen acceso a los mercados; Los asociados chinos obtienen conocimientos tecnológicos y de gestión que fluyen gradualmente hacia las empresas nacionales."
 CHI_keep_the_shell_companies: "Mantener las empresas Shell"
 CHI_keep_the_shell_companies_desc: "Ordenado para bucear, nos sumergimos sólo en papel. Las empresas militares son re-registradas bajo primas, hombres de frente y compañías de conchas, sus ganancias todavía fluyen de regreso a las unidades que los poseen. Los auditores encuentran oficinas vacías; los generales mantienen sus ingresos."
 CHI_kj2000_mainring_awacs: "The KJ-2000 Mainring"
 CHI_kj2000_mainring_awacs_desc: "Después de que Washington bloqueó la venta israelí de Phalcon, China construyó su propia. El KJ-2000, un radar autóctono de rayos activos montado en un Il-76, da a la fuerza aérea su primer verdadero puesto de mando aéreo, dejando que los combatientes golpeen contra objetivos que todavía no podían ver por sí mismos."
 CHI_kj500_network_centric_hub: "KJ-500 Network Hub"
 CHI_kj500_network_centric_hub_desc: "El KJ-500, un radar fijo de tres rayos en un turboprop Y-9, es el ojo del caballo de trabajo en el cielo. Producidos en números, los combatientes de enlace de datos, barcos y misiles en una imagen, el centro volador de la guerra centrada en la red."
 CHI_KPA_Offensive_Readiness: "KPA Lectura ofensiva"
 CHI_KPA_Offensive_Readiness_desc: "Respaldamos silenciosamente un cambio en la postura del Ejército Popular de Corea, desde la defensa en profundidad hasta el avance de la preparación ofensiva. Se aceleran las transferencias de equipo y se amplían las sesiones de planificación conjunta. La península se mueve más cerca del borde."
 CHI_leader_of_the_people: "Renmin Lingxiu"
 CHI_leader_of_the_people_desc: "La Tercera Resolución Histórica del Partido Comunista formaliza el título Renmin Lingxiu, «Líder Popular», una designación aplicada a sólo dos figuras en la historia del Partido: Mao Zedong y Xi Jinping. El retrato de Mao sigue por encima de la puerta Tiananmen. El tercer momento histórico del Partido ha encontrado su figura histórica, y el significado de esa continuidad no se pierde en nadie que lea la resolución cuidadosamente."
 CHI_leading_small_group_doctrine: "Grupos principales"
 CHI_leading_small_group_doctrine_desc: "Los grupos pequeños líderes centrales supervisan ahora las finanzas, la reforma económica, los asuntos exteriores, la ciberseguridad y la reforma militar simultáneamente, todos presididos de una sola oficina. El acuerdo pasa por la estructura tradicional del comité del Politburo y concentra la toma de decisiones donde puede moverse sin demora. Los tecnócratas ejecutan; el centro coordina. La política se mueve más rápido, y cada salida está subordinada a un solo testamento."
 CHI_Let_Seoul_Lead: "Deja que Seúl Lead"
 CHI_Let_Seoul_Lead_desc: "Señalamos nuestra aceptación del liderazgo surcoreano en cualquier posible proceso de unificación. Las instituciones democráticas y el peso económico de Seúl lo convierten en el anclaje natural de una Corea unificada. Volvemos a dejar que los coreanos determinen su propio futuro."
 CHI_liangjiang_new_area: "Liangjiang nueva zona nacional"
 CHI_liangjiang_new_area_desc: "Liangjiang en Chongqing se convierte en la primera zona nacional a nivel nacional, después de Pudong en Shanghai y Binhai en Tianjin. La zona ha atraído a Ford, HP y más de 300 empresas Fortune 500 y ya produce 1,19 millones de vehículos al año. El Guanzhong Plain de Xi'an recibe inversión paralela, posicionando a Shaanxi como el ancla comercial e industrial del noroeste. El modelo está probado; la escala es lo que debemos ahora expandir."
 CHI_Lips_and_Teeth_Doctrine: "Lips y Doctrina de dientes"
 CHI_Lips_and_Teeth_Doctrine_desc: "Reafirmamos el vínculo histórico con Corea del Norte. Los dos países están, como siempre, tan cerca como labios y dientes. La supervivencia de Pyongyang es nuestro imperativo estratégico, y actuaremos en consecuencia independientemente de la presión internacional."
 CHI_Lithium_Triangle_Accord: "Acuerdo de Triángulo de Litio"
 CHI_Lithium_Triangle_Accord_desc: "Argentina, Bolivia y Chile mantienen juntos más de la mitad de las reservas de litio recuperables del mundo. Los acuerdos de absorción a largo plazo y las apuestas de equidad en las empresas de extracción dan a los fabricantes chinos de baterías y vehículos eléctricos acceso confiable a la materia prima que define el próximo paradigma energético. Los acuerdos aíslan cadenas de suministro chinas de coaliciones de compras occidentales."
 CHI_Liu_Huaqing_Doctrine: "Liu Huaqing doctrina"
 CHI_Liu_Huaqing_Doctrine_desc: "El almirante Liu Huaqing, arquitecto de nuestra moderna estrategia naval, identificó las cadenas Primera y Segunda Isla como el perímetro estratégico dentro del cual nuestro poder marino debe establecer una dominación indiscutible antes de proyectar más adelante. El Mar del Sur de China está completamente dentro de la Primera Cadena. No podemos proyectar hacia fuera hasta que esté completamente asegurado, y no podemos retrasar esa seguridad indefinidamente."
 CHI_liu_huaqing_first_island_chain: "La primera cadena de la isla de Liu Huaqing"
 CHI_liu_huaqing_first_island_chain_desc: "La línea va desde los Kuriles a través de los Ryukyus y Taiwán hasta Borneo, y detrás de ella se debe hacer nuestro cercano mar. El almirante Liu Huaqing, padre del PLAN moderno, enseñó que una marina de agua verde debe dominar primero la Cadena de Primera Isla antes de que pueda soñar con el océano abierto. Su doctrina de defensa offshore establece nuestro curso: negar los enfoques, dominar el mar cercano, y luego mirar más allá."
 CHI_livestream_commerce: "Comercio de rescate en vivo"
 CHI_livestream_commerce_desc: "Taobao Live fusiona el entretenimiento con la compra en tiempo real a una escala que no ha alcanzado ningún equivalente occidental. Viya y Austin Li generan miles de millones en ventas de una sola sesión; el 40% de nuestro comercio electrónico ahora se ejecuta a través de canales en directo. Las agencias de MCN administran miles de creadores, y los reguladores imponen un estricto cumplimiento fiscal para asegurar que la riqueza que fluye a través de estas plataformas llegue al estado en proporción. El formato es nuestro para definir, y el mundo está mirando."
 CHI_logistic_modernisation: "Modernización de la logística"
 CHI_logistic_modernisation_desc: "Las reformas en el frente no significan nada si la cola de suministro se rompe. Estandarizamos contenedores, paletizar cargas y digitalizar la cadena de suministro bajo la nueva Fuerza Conjunta de Apoyo Logístico, para que una brigada pueda ser sostenida tan rápido como pueda avanzar."
 CHI_long_march_modernisation: "Modernización de Long March"
 CHI_long_march_modernisation_desc: "La familia Chang Zheng de vehículos de lanzamiento, desarrollada por China Aerospace Science and Technology Corporation, forma la columna vertebral de todo nuestro programa espacial. La mejora de las líneas de montaje y la mejora del manejo propelente en las variantes CZ-2, CZ-3, CZ-5 y CZ-7 aumenta la cadencia de lanzamiento y fiabilidad, mientras que los avances transversales en ingeniería de propulsión se alimentan directamente en nuestros programas de misiles."
 CHI_long_range_firepower: "Fuerza de fuego a larga distancia"
 CHI_long_range_firepower_desc: "Alcance golpea la masa. Empujemos cohetes de largo alcance y saqueamos municiones en las grandes brigadas, dejando que destrocen la profundidad de un enemigo, sus puestos de mando y sus reservas antes de que los tanques estén siempre cerca de ponerse en contacto."
 CHI_loongson_riscv: "Loongson y RISC-V Architecture"
 CHI_loongson_riscv_desc: "La línea de procesadores Loongson del Institute of Computing Technology ofrece una alternativa interna a x86 y ARM para servidores gubernamentales y sistemas integrados. Junto a Loongson, la arquitectura abierta de instrucciones RISC-V ha atraído nuestra inversión a través de la organización internacional RISC-V y las startups nacionales incluyendo T-Head de Alibaba, Nuclei System Technology, y SiFive China. La licencia abierta de RISC-V aísla nuestros diseños domésticos desde la exposición al control de las exportaciones estadounidenses sobre arquitecturas instructivas, y que el aislamiento vale más cada año."
 CHI_lunar_sample_return: "Regreso de la muestra lunar"
 CHI_lunar_sample_return_desc: "Chang'e 5 devolvió 1.73 kilogramos de basalto lunar de Mons Rumker en diciembre 2020, las primeras nuevas muestras de Luna en la Tierra desde la misión Soviética Luna 24 en 1976. Chang'e 6 siguió en junio de 2024, recuperando material de la cuenca Sur Pole-Aitken del lado lejano, una primera para cualquier programa espacial. Concentramos nuestros recursos en este camino de la ciencia robótica, ampliando la arquitectura de retorno de muestras a nuevos sitios y acelerando la investigación que permite."
 CHI_made_in_china_2025: "Hecho en China 2025"
 CHI_made_in_china_2025_desc: "Ya no podemos seguir siendo el piso de fábrica del mundo. Se identifican diez sectores prioritarios para la transformación en liderazgo de alta tecnología: robótica, aeroespacial, vehículos eléctricos, dispositivos médicos avanzados, semiconductores y más. Los subsidios estatales, los programas de adquisición de tecnología y las metas establecidas en la contratación nacional son nuestros instrumentos. Washington y Bruselas estarán disgustados, pero esta es una dirección que debemos mantener."
 CHI_Maritime_Silk_Road_Indian_Ocean: "Estring of Pearls estrategia"
 CHI_Maritime_Silk_Road_Indian_Ocean_desc: "Una cadena de inversiones portuarias e instalaciones logísticas en todo el litoral del Océano Índico, incluyendo Hambantota en Sri Lanka y Doraleh en Djibouti, extiende nuestro alcance naval comercial y potencial desde el Mar de China Meridional hasta el Cuerno de África. Los críticos describen el patrón como una cadena de perlas rodeando a la India. No están completamente equivocados, y ese es precisamente el punto."
 CHI_mass_line_education: "La línea de masas"
 CHI_mass_line_education_desc: "La campaña de la Línea Masiva del Partido exhorta a los funcionarios a rechazar el formalismo, el burocratismo, el hedonismo y la extravagancia. Los banquetes lavish están prohibidos; relojes caros confiscados de aquellos fotografiados que los llevan en público. Nuestra relación con la gente debe ser reorganizada como servicio en lugar de derecho. El mensaje es tan conveniente políticamente como realmente popular, y no debemos desperdiciarlo."
 CHI_mass_line_renewed: "Línea de masas renovada"
 CHI_mass_line_renewed_desc: "Mao Zedong's Mass Line sostuvo que el partido debe aprender de la gente antes de que pueda guiarlos. Los cuadros y estudiantes son enviados a los municipios rurales y plantas de fábrica. Las campañas de escucha reemplazan las directivas de arriba hacia abajo, y la experiencia acumulada de las masas se dobla de nuevo a la política del partido. La revolución no es una cena."
 CHI_mature_node_counter_offensive: "Anticonceptivo maduro-nodo"
 CHI_mature_node_counter_offensive_desc: "Después de que los controles de exportación occidentales restringieron nuestra expansión de ganglios avanzados, redirigemos la inversión en capacidad a nodos maduros por debajo de 28nm. SMIC, Hua Hong, CXMT y decenas de pequeñas fabs lanzan expansiones paralelas en Shanghai, Shenzhen y Hangzhou. Ahora representamos más del 33% de las adiciones globales de capacidad de los nodos maduros. Los gobiernos occidentales, alarmados por la perspectiva del dominio chino en el segmento de los ganglios maduros que suministran electrónica automotriz, industrial y de defensa, están debatiendo aranceles secundarios. Debemos consolidar nuestra posición antes de que lleguen esos aranceles."
 CHI_Media_Offensive: "Medios Offensivos"
 CHI_Media_Offensive_desc: "Inicie una campaña mundial coordinada a través de plataformas CGTN, Xinhua y redes sociales para proyectar perspectivas chinas y contrarrestar narrativas hostiles."
 CHI_Mekong_Riparian_Cooperation: "Cooperación Lancang-Mekong"
 CHI_Mekong_Riparian_Cooperation_desc: "El mecanismo de cooperación Lancang-Mekong organiza el desarrollo conjunto de la infraestructura, la gestión de los recursos hídricos y la facilitación del comercio entre los seis estados ribereños que comparten el sistema fluvial. Nuestros proyectos de construcción y mejora de la navegación de represas nos dan un gran apalancamiento sobre vecinos que dependen del flujo que controlamos. Debemos formalizar este marco antes de que ese apalancamiento se caracterice como coacción."
 CHI_memory_independence: "Memoria Chip Independencia"
 CHI_memory_independence_desc: "YMTC, con sede en Wuhan con respaldo de Big Fund, ha alcanzado la producción 3D NAND de 128 capas y ha logrado arquitectura Xtacking de 232 capas que coincide con Samsung y Micron a una generación comparable. CXMT en Hefei produce DDR4 a 17 nm y está desarrollando flujos de proceso compatibles con DDR5. La breve calificación de Apple de YMTC NAND demostró que nuestra memoria había alcanzado el grado comercial antes de la presión estadounidense forzó su eliminación de la lista de proveedores de Apple. La línea HBM2 de CXMT ha comenzado la producción de masa antes de lo previsto, calificando para Cambricon y Biren Acelerator IA construye y terminando la dependencia de memoria extranjera en nuestra cadena de suministro de alto rendimiento."
 CHI_mengshi_program: "El programa Mengshi"
 CHI_mengshi_program_desc: "El Mengshi, el vehículo ligero blindado de China en el molde del Humvee, motoriza la infantería ligera con un viaje duro y resistente a las minas que puede montar ametralladoras, misiles o una estación remota de armas."
 CHI_miit_licensing_framework: "MIIT Licencias y Reestructuración de Transportistas"
 CHI_miit_licensing_framework_desc: "El Ministerio de Industria y Tecnología de la Información debe formalizar el marco de concesión de licencias que separa nuestro antiguo monopolio de Posts y Telecomunicaciones a empresas comerciales distintas. Se codifican normas de asignación de espectros, precios de interconexión y una obligación de servicio universal, creando la base regulatoria en la que China Mobile, China Unicom y China Telecom construirán las mayores redes 4G y 5G del mundo. La era monopolista cumplió su propósito; la competencia servirá a la siguiente fase."
 CHI_military_training_outline: "El nuevo esquema de capacitación"
 CHI_military_training_outline_desc: "Se publica un nuevo esquema de entrenamiento militar en toda la fuerza, el libro de reglas que establece las normas y tareas de cada unidad. Por primera vez está escrito alrededor de operaciones conjuntas, en red, obligando a todo el ejército a una medida exigente de preparación."
 CHI_mobile_payment_duopoly: "El pago móvil Duopoly"
 CHI_mobile_payment_duopoly_desc: "Alipay, lanzado como un servicio de garantía bloqueada de Alibaba, se ha convertido en una plataforma de pagos independiente. WeChat Pay ganó 200 millones de usuarios en cinco días a través de una campaña de sobre rojo Año Nuevo Chino. Los códigos QR ahora reemplazan el efectivo en más del 90 por ciento de nuestras transacciones, apagando Visa, Mastercard y Western fintechs antes de que pudieran establecer una posición significativa. Hemos construido la infraestructura de pagos al consumidor más avanzada del mundo, y opera completamente fuera de la arquitectura financiera occidental."
 CHI_money_alliance: "La Alianza del Dinero"
 CHI_money_alliance_desc: "La riqueza y el comando fuse en una facción. Los oficiales más ricos y los magnates de contrabando que los financian se unen, lo suficientemente fuertes como para proteger a sus propios y dictar términos al Partido que nominalmente les ordena."
 CHI_Monroe_Doctrine_Inverted: "Doctrina Monroe Invertida"
 CHI_Monroe_Doctrine_Inverted_desc: "Décadas de inversión de pacientes, extensión diplomática y crédito de infraestructura nos han reubicado como el socio externo indispensable de América Latina, un papel que Estados Unidos trató una vez como su dominio exclusivo. La capacidad de Washington para movilizar coaliciones hemisféricas contra nosotros ha erosionado hasta el punto en que la Doctrina Monroe ya no se aplica en la práctica. Las Américas ya no son un lago americano. Debemos asegurarnos de que nunca vuelvan a ser uno."
 CHI_national_overall_emergency_response_plan: "Plan Nacional de Respuesta a Emergencias"
 CHI_national_overall_emergency_response_plan_desc: "La crisis del SARS expuso las lagunas en nuestra preparación nacional de emergencia con dolorosa claridad. Debemos establecer un marco de respuesta unificado que abarque los desastres naturales, emergencias de salud pública, accidentes y disturbios sociales, con recursos prepuestos, estructuras de mando claras y protocolos de coordinación interinstitucionales en todos los niveles administrativos. La próxima crisis no se anunciará."
 CHI_naura_amec: "Programas de equipo NAURA y AMEC"
 CHI_naura_amec_desc: "NAURA Technology Group y Advanced Micro-Fabrication Equipment producen herramientas de etch, CVD y PVD para nuestros fabs domésticos. NAURA ha obtenido calificaciones en SMIC para el equipo de grabado de 28 nm; Las herramientas Primaxx etch de AMEC han entrado en líneas de producción de alto volumen. Ambas empresas se benefician de la demanda cautiva de SMIC y las inyecciones de capital Big Fund. Su cartera de herramientas combinadas ahora cubre aproximadamente el 40 por ciento de los pasos del proceso requerido para una simulación lógica de ganga madura. El 60 por ciento restante es donde debemos centrarnos después."
 CHI_nco_corps_reform: "A Profesional NCO Corps"
 CHI_nco_corps_reform_desc: "Un ejército moderno está unido por sus sargentos, no sólo sus coroneles. Construimos un verdadero cuerpo de oficiales no comprometidos, soldados de carrera por rango, sueldo y autoridad, reemplazando la antigua dependencia de los conscriptos a corto plazo y cerrando la brecha entre oficial y recluta."
 CHI_new_energy_vehicles_startups: "Los nuevos vehículos de energía"
 CHI_new_energy_vehicles_startups_desc: "NIO, XPeng, Li Auto, alianza HIMA de Huawei, y Xiaomi entraron en el sector automotriz entre 2014 y 2024, respaldado por capital tecnológico en lugar de empresas estatales. Cada uno trajo el software de la era del smartphone, las capacidades de inteligencia artificial y el reconocimiento de la marca del consumidor en vehículos. El sedán SU7 de Xiaomi dibujó 88.898 pre-ordenes en 24 horas; el SUV YU7 obtuvo 240.000 órdenes cerradas en su primer día."
 CHI_New_World_Order: "Nuevo Orden Mundial"
 CHI_New_World_Order_desc: "Nuestro dominio de la información y el alcance de los medios de comunicación han sentado las bases para un desafío fundamental al orden internacional dirigido por Occidente. Ahora debemos aprovechar nuestras redes de influencia, medios de comunicación estatales y herramientas encubiertas para promover un mundo multipolar en el que nuestras propias normas y modelos de gobernanza establezcan la agenda mundial."
 CHI_norinco_rationalism: "NORINCO Rationalised"
 CHI_norinco_rationalism_desc: "China North Industries, fabricadora de todo, desde rifles de servicio hasta artillería, es podada y enfocada. Las líneas de Redundant cierran, las rentables se consolidan y el arsenal de las fuerzas terrestres finalmente habla con una voz industrial."
 CHI_northeast_revitalization_plan: "Plan de revitalización del noreste"
 CHI_northeast_revitalization_plan_desc: "Las provincias de Liaoning, Jilin y Heilongjiang se redujeron considerablemente después de la reforma del SOE. El Gobierno central puso en marcha un programa de revitalización en 2003, canalizando la inversión en infraestructura, el crédito preferencial y trasladando la capacidad industrial a la región."
 CHI_northeast_russia_corridor: "Corredor Económico Noreste-Rusia"
 CHI_northeast_russia_corridor_desc: "Se mejora la infraestructura comercial transfronteriza que une la provincia de Heilongjiang al Lejano Oriente de Rusia, lo que permite corrientes de recursos, inversiones transfronterizas y proyectos de desarrollo conjunto. El corredor refuerza la asociación estratégica sino-rusa con sustancia comercial."
 CHI_open_the_august_1st_building: "Abra el 1er edificio de agosto"
 CHI_open_the_august_1st_building_desc: "El Edificio del 1 de Agosto alberga la Comisión Militar Central, donde el Ejército Popular de Liberación responde ante el Partido y ante nadie más. El levantamiento de Nanchang del 1 de agosto de 1927 dio al Partido sus primeros fusiles; la fecha aún da nombre al propio ejército. Ahora comienza su remodelación: corrupción purgada o tolerada, divisiones reconstruidas en brigadas, una fuerza aérea fusionada con el espacio y una guardia costera convertida en una flota de aguas azules."
 CHI_Operation_New_Dawn: "Operación Nuevo Amanecer"
 CHI_Operation_New_Dawn_desc: "Ha llegado el momento. Los oficiales respaldados por China dentro del KPA se mueven contra el complejo familiar Kim. Lo que sigue será breve, violento y decisivo. El estado norcoreano sobrevivirá; su liderazgo no lo hará."
 CHI_Oppose_Strategic_Flexibility: "Opposesión de flexibilidad estratégica"
 CHI_Oppose_Strategic_Flexibility_desc: "La doctrina de Washington de 'flexibilidad estratégica', que permite a las fuerzas estadounidenses en Corea del Sur desplegarse más allá de la península, representa una intromisión inaceptable en nuestros intereses de seguridad. Exigimos formalmente su retroceso."
 CHI_organisation_department_mandate: "El Departamento del Mandato"
 CHI_organisation_department_mandate_desc: "El Departamento de la Organización del PCCh gestiona el nombramiento, evaluación y transferencia de más de 70 millones de cuadros de partido, lo que significa que quien controle el departamento controla el futuro del personal del partido. Bajo la dirección de Zeng Qinghong, el departamento ha reforzado el control sobre los nombramientos de liderazgo provinciales y reorientado sus criterios de evaluación para favorecer a funcionarios con sólidos registros de desarrollo industrial."
 CHI_organisation_department_mandate_tt: "El §Y$CHI_organisation_department_1$§! siempre estará activo cuando §YZeng Qinghong§! es el líder del país."
 CHI_original_innovation_problem: "El problema de la innovación original"
 CHI_original_innovation_problem_desc: "La copia nos llevó a la frontera; no puede llevarnos más allá de ella. La reforma más dura es cultural, exigiendo la innovación original que la ciencia burocrática ha mantenido desde hace mucho tiempo. Financiamos el riesgo, toleramos el fracaso y recompensamos el avance que ningún proyecto extranjero puede proporcionar."
 CHI_own_designs: "Nuestros propios diseños"
 CHI_own_designs_desc: "Para una generación, revertimos los dibujos soviéticos y lo llamamos progreso. Ya no. Se dice a las oficinas de diseño que se originen en lugar de imitar, y que pongan un sello chino en el siguiente arma en vez de uno prestado."
 CHI_Pacific_Island_Forum_Pivot: "Pacífico Foro de la Isla Pivot"
 CHI_Pacific_Island_Forum_Pivot_desc: "Debemos acelerar nuestra ofensiva diplomática en todos los estados de la Isla del Pacífico, ofreciendo subsidios de infraestructura a la luz de la deuda, acuerdos pesqueros y paquetes de reconocimiento diplomático. El propio Foro se convierte en una arena concursada mientras cultivamos votos columpios y observadores patrocinados. Australia y Nueva Zelandia, que han dominado históricamente los marcos institucionales del Pacífico, encontrarán su liderazgo desafiado en cada período de sesiones ministeriales hasta que reconozcan nuestra posición."
 CHI_Pax_Sinica: "Pax Sinica"
 CHI_Pax_Sinica_desc: "Un orden internacional sinocéntrico, en el que nuestro peso económico, dependencia de la infraestructura y alineación política desplazan al orden liberal basado en las reglas como principio organizador de los asuntos globales. Los estudiosos lo han nombrado Pax Sinica. Simplemente lo llamamos el mundo como debería ser. Alcanzarlo representaría la culminación de nuestro siglo de rejuvenecimiento."
 CHI_Peaceful_Development: "Para el Desarrollo"
 CHI_Peaceful_Development_desc: "Demostrar a través de la acción que el ascenso de China es una fuerza para la estabilidad global. Invertir en el mantenimiento de la paz, el socorro en casos de desastre y la ayuda para el desarrollo a fin de crear una reputación como poder responsable."
 CHI_pearl_river_delta_tech_cluster: "Grupo electrónico de Pearl River Delta"
 CHI_pearl_river_delta_tech_cluster_desc: "El Delta del Río Perla consolida su posición como la base de fabricación electrónica más grande del mundo. Shenzhen acoge Huawei y ZTE; Dongguan se llena con los fabricantes de contratos de Taiwán; toda la región funciona como una única cadena de suministro integrada para la electrónica global del consumidor."
 CHI_Peninsula_Strategy: "La Estrategia de la península"
 CHI_Peninsula_Strategy_desc: "Estamos en una encrucijada en la península de Corea. Los decenios de ambigüedad calculada deben dar paso a una postura estratégica deliberada. Escogeremos nuestro camino cuidadosamente, sabiendo que cada opción conlleva consecuencias irreversibles para el orden regional."
 CHI_peoples_armed_police_integration: "Integrar la Policía Armada"
 CHI_peoples_armed_police_integration_desc: "La Policía Armada del Pueblo, dos millones fuertes, se dobla firmemente bajo la Comisión Militar Central a partir de 2018, asegurando la retaguardia y la frontera para que el ejército de campo sea liberado para luchar hacia fuera."
 CHI_Petrocaribe_Successor: "Sucesor de Petrocaribe"
 CHI_Petrocaribe_Successor_desc: "El programa petrolero preferencial de Venezuela para los estados caribeños y centroamericanos ha colapsado bajo sanciones y mala gestión económica. Debemos actuar como acreedor estabilizador, otorgando préstamos respaldados por el petróleo a Caracas, La Habana y Managua a cambio de promesas de oferta a largo plazo. El acuerdo profundiza nuestros lazos con los gobiernos ya aislados de los mercados de capitales occidentales, y su gratitud será duradera."
 CHI_Petroyuan_Settlement: "Iniciativa Petroyuan"
 CHI_Petroyuan_Settlement_desc: "Debemos lanzar futuros de crudo yuan en el International Energy Exchange, creando un mecanismo para que los exportadores de energía BRI establezcan contratos en renminbi más que dólares estadounidenses. La adopción sostenida erosionará el dominio petrodollar y reducirá nuestra exposición a sanciones financieras estadounidenses. Cada barril de precio en yuan es un paso hacia un sistema financiero internacional que podemos confiar."
 CHI_pgz_gun_missile_hybrid: "Defensa híbrida cañón-misil"
 CHI_pgz_gun_missile_hybrid_desc: "El sistema autopropulsado de PGZ se casa con el autocannon de radar con misiles de corto alcance en un chasis, cortando los aviones de bajo vuelo, helicópteros y drones que se deslizan debajo del sobre del misil."
 CHI_phl_mlrs_modernisation: "Modernización de cohetes PHL"
 CHI_phl_mlrs_modernisation_desc: "El PHL-03 y el PHL-16 modular dan al ejército artillería de cohetes de largo alcance alcanzando cientos de kilómetros, difuminando la línea entre la batería de cohetes y los misiles tácticos y dejando un ataque de brigada profundamente detrás del frente."
 CHI_pipechina_gas_reform: "PipeChina Unbundling"
 CHI_pipechina_gas_reform_desc: "China Oil and Gas Piping Network Corporation recibe aproximadamente 600 mil millones de yuan en activos de oleoductos, instalaciones de almacenamiento y terminales de GNL transferidos desde CNPC, Sinopec y CNOOC. El modelo X+1+X coloca a un único operador neutral de corriente media entre muchos productores de aguas arriba y muchos distribuidores de aguas abajo, abriendo infraestructura que las compañías petroleras nacionales previamente habían controlado exclusivamente. ENN Energy, China Resources Gas, Beijing Enterprises y proveedores extranjeros de GNL obtienen acceso, y el mercado para la distribución del gas se vuelve genuinamente competitivo por primera vez."
 CHI_Piraeus_Model: "Modelo del puerto de Pireo"
 CHI_Piraeus_Model_desc: "La adquisición de una participación mayoritaria del COSCO en el Puerto del Pireo transformó el principal puerto comercial de Grecia en el puerto contenedor más ocupado del Mediterráneo y una plantilla para nuestra gestión portuaria a través de Europa. El modelo ofrece rendimientos económicos mensurables a los gobiernos anfitriones al incrustar nuestro control operacional en puntos estratégicos. Las apuestas de equidad menores en Lisboa y Hamburgo mantienen a esos capitales comprometidos sin desencadenar el escrutinio reglamentario que una adquisición mayoritaria invitaría."
 CHI_plz_howitzer_program: "El programa PLZ Howitzer"
 CHI_plz_howitzer_program_desc: "La artillería, mientras tanto el orgullo y el cuello de botella del ejército, va totalmente autopropulsado. El PLZ-05, un Howitzer de 155 mm rastreado en servicio desde 2008, coincide con el rango occidental y la tasa de fuego y forma la línea de armas de cada brigada pesada."
 CHI_Polar_Silk_Road: "Carretera Polar Silk"
 CHI_Polar_Silk_Road_desc: "Nuestro Libro Blanco de Política Ártica declara a China un «Estado cerca del Ártico» y respalda el desarrollo de rutas de transporte transpolar como una extensión norte de la Ruta Marítima de la Seda. El derretimiento del hielo marino hace que la Ruta del Mar del Norte sea comercialmente viable, cortando los tiempos de tránsito entre nosotros y Europa hasta dos semanas. Deberíamos reclamar nuestro lugar en la arquitectura de gobernanza del Ártico antes de que otros cierren la puerta."
 CHI_policy_banks_cdb: "Bancos de política"
 CHI_policy_banks_cdb_desc: "China Development Bank, Export-Import Bank of China y Agricultural Development Bank of China forman una arquitectura de financiación paralela que opera fuera de las limitaciones comerciales normales. CDB es ahora la mayor institución financiera para el desarrollo del mundo, más grande que el Banco Mundial y el Banco Asiático de Desarrollo combinados, financiando la presa Tres Gorges, ferrocarril de alta velocidad y más de 600 mil millones de dólares en Franja y la Ruta préstamos de infraestructura en más de 100 países. Estos tres bancos no son simplemente instituciones financieras; son instrumentos de estrategia nacional."
 CHI_politics_law_commision_realigned: "Comisión Política-Legal Realizada"
 CHI_politics_law_commision_realigned_desc: "La Comisión de Asuntos Políticos y Jurídicos coordina el aparato de seguridad, los tribunales y la fiscalía. Alinearlo firmemente detrás del modelo Chongqing significa construir una infraestructura de vigilancia que pueda identificar amenazas antes de cristalizar, aislando la revolución de subversión extranjera y sabotaje interno por igual."
 CHI_poly_goes_global: "El poli va global"
 CHI_poly_goes_global_desc: "Poly Technologies lleva fusiles y misiles chinos a África, Oriente Medio y América Latina, mientras que Poly Culture convierte el producto en casas de subastas y bienes raíces. La casa comercial del ejército se convierte en un conglomerado global, su manejo de nuestra diplomacia, sus ganancias más allá del alcance de cualquier presupuesto."
 CHI_Post_Armistice_Architecture: "Arquitectura post-Armistice"
 CHI_Post_Armistice_Architecture_desc: "Nosotros y los Estados Unidos proponemos conjuntamente un reemplazo del Armisticio de 1953: un marco general de paz que ponga fin oficialmente a la guerra coreana y establezca garantías regionales de seguridad aceptables para todas las partes."
 CHI_Predatory_Lending_Doctrine: "La Doctrina Hambantota"
 CHI_Predatory_Lending_Doctrine_desc: "Cuando Sri Lanka no pudo prestar su préstamo por el puerto de Hambantota, firmó un contrato de arrendamiento de 99 años que transfirió el control operacional a una de nuestras empresas estatales. Debemos formalizar este modelo: estructurar proyectos desde el principio para que los activos estratégicos se conviertan en derechos de acceso colaterales, convertibles a largo plazo por defecto. El deudor elige los términos eligiendo si pagar."
 CHI_private_oem_rise: "Montaje de los OEM privados"
 CHI_private_oem_rise_desc: "Sólo los Cuatro Grandes SOEs fueron designados como socios de aventura conjunta, pero gobiernos provinciales apoyaron a sus propios fabricantes independientemente. Chery Automobile en Wuhu, Geely en Zhejiang y Great Wall Motors en Baoding cada encontró caminos para la producción legal y se construyó su camino hacia arriba. Los fabricantes privados ahora construyen un tercio de nuestros vehículos de pasajeros, llenando los segmentos SUV, bajo costo y EV las empresas conjuntas decidieron ignorar. Lo haríamos bien para apoyarlos."
 CHI_project_921: "Project 921"
 CHI_project_921_desc: "En septiembre de 1992 la Comisión Militar Central aprobó el Proyecto 921, plan maestro para una capacidad de vuelo espacial humana china. La decisión estableció la oficina espacial humana de CASC, financió el diseño de naves espaciales Shenzhou y comprometió a la nación a llegar a órbita bajo sus propios colores."
 CHI_project_998: "Project 998"
 CHI_project_998_desc: "En 1995 y 1996 dos grupos de portadores estadounidenses navegaron hacia el Estrecho de Taiwán y nuestra marina sólo podía ver. El proyecto 998 es la respuesta a esa humillación: una acumulación naval sostenida dirigida al día en que los transportistas regresen, negociando una fuerza de defensa costera para uno que pueda disputar las aguas frente a nuestra propia costa."
 CHI_Project_Coordination_Cell: "Grupo de coordinación del proyecto BRI"
 CHI_Project_Coordination_Cell_desc: "Nuestros corredores BRI abarcan decenas de países y cientos de proyectos, y sin un órgano coordinador acumularán retrasos, redundancias y vulnerabilidades políticas. El Departamento Internacional del Comité Central, Sr. Zhonglianbu, debería presidir un grupo multiministerial para examinar las solicitudes, asignar directores de proyectos y supervisar los plazos de entrega. La orden produce resultados. Los resultados sustentan la confianza."
 CHI_project_jxx: "Proyecto J-XX"
 CHI_project_jxx_desc: "Begun a finales de los años noventa como Proyecto J-XX, el programa produce el J-20 'Dragón Peligroso', volado en 2011 y en servicio para 2017. Stealthy, de largo alcance y misiles-heavy, es el primer caza de quinta generación fuera de América y Rusia, construido para cazar a los tanques y aviones de alerta temprana en los que depende cualquier máquina de guerra del Pacífico. China se une al club más pequeño del cielo."
 CHI_project_no_10: "Project Number 10"
 CHI_project_no_10_desc: "El J-10, nacido del Proyecto 10 secreto, es el primer luchador indígena moderno de China, un jet multirrele de un solo motor de Chengdu que debe su disposición a ningún dibujo soviético. Es el avión en el que una industria nacional de luchadores aprende por sí sola."
 CHI_property_tax_pilot_program: "Propiedad Tax Programa piloto"
 CHI_property_tax_pilot_program_desc: "Shanghai y Chongqing han lanzado los primeros pilotos de impuestos sobre la propiedad, cobrando tarifas modestas en viviendas segundas y residencias primarias de alto valor. Los pilotos tienen por objeto amortiguar la compra especulativa y diversificar los ingresos del gobierno local lejos de los ingresos de venta terrestre. Si los resultados se sostienen, deberíamos ampliar el modelo a nivel nacional antes de que el mercado inmobiliario se convierta en una responsabilidad demasiado grande para gestionar."
 CHI_provincial_reshuffle: "Rehabilitación del liderazgo provincial"
 CHI_provincial_reshuffle_desc: "Zeng ha diseñado una rotación de personal en el Congreso Nacional del Pueblo. Los veteranos de facciones de Shanghai reciben posiciones clave: Chen Liangyu como secretario del partido de Shangai, Huang Ju elevado al Comité Permanente de Politburo, Jia Qinglin tomando la presidencia del CPPCC. La rehuffle arrasa la influencia principante sobre las provincias más ricas y el aparato de consultoría estatal."
 CHI_provincial_youth_league_cohort: "Promover la Cohorte de la Liga Juvenil Provincial"
 CHI_provincial_youth_league_cohort_desc: "Li Keqiang en Henan. Wang Yang en Chongqing. Liu Yandong subiendo. El banco Tuanpai es profundo y paciente - déjalo avanzar."
 CHI_public_health_reconstruction: "Nuevo Plan Médico Cooperativo Rural"
 CHI_public_health_reconstruction_desc: "El Nuevo Plan Médico Cooperativo Rural cuenta con contribuciones de residentes rurales, gobiernos locales y el presupuesto central para cubrir los costos médicos catastróficos. Es el primer programa sistemático de seguro de salud rural en la historia de nuestra república, y debemos llevarlo a una cobertura casi universal lo más rápido posible. Ochocientos millones de agricultores no deben enfrentarse a la ruina financiera simplemente porque cayeron enfermos."
 CHI_public_rental_housing_drive: "Alquiler de viviendas"
 CHI_public_rental_housing_drive_desc: "Millones de trabajadores migrantes urbanos y graduados universitarios viven en alojamientos improvisados a merced de propietarios privados. El estado movilizará los recursos de construcción para construir unidades de alquiler pública asequibles en las principales ciudades, cobrando alquileres subvencionados y ofreciendo derechos de compra después de tres años de arrendamiento."
 CHI_pudong_financial_hub: "Centro financiero Pudong"
 CHI_pudong_financial_hub_desc: "Shanghai's Pudong New Area se desarrolla como el principal centro financiero offshore de China. La construcción del horizonte de Lujiazui, la Bolsa de Shanghai y las zonas comerciales en condiciones de servidumbre indican la ambición de China de desafiar a Hong Kong y Singapur como centros financieros regionales."
 CHI_qbz191_rifle: "The QBZ-191 Rifle"
 CHI_qbz191_rifle_desc: "El topato QBZ-95 envejecido da paso a la QBZ-191, un rifle de combate convencional con óptica montada por ferrocarril, lanzado desde 2019. Un arma moderna para un infantero ahora espera luchar en red, no solo."
 CHI_qinghai_tibet_railway_planning: "Ferrocarril Qinghai-Tibet"
 CHI_qinghai_tibet_railway_planning_desc: "El ferrocarril Qinghai-Tibet recorrerá 1.956 kilómetros a una altitud media de 4.500 metros, cruzando el paso Tanggula. Una vez completado, será el ferrocarril más alto del mundo y nuestro primer enlace ferroviario directo a Lhasa, integrando el Tíbet económica y logísticamente con el resto del país de una manera que ningún camino ni aeródromo pudiera jamás."
 CHI_quiet_succession_engineering: "Ingeniería de la Sucesión"
 CHI_quiet_succession_engineering_desc: "La autoridad de Zeng Qinghong sobre el Departamento de Organización le da una influencia decisiva en el concurso de sucesión que ahora se abre. Debería proponérselo a favor de Xi Jinping sobre el Li Keqiang respaldado por la Liga Juvenil. Un primer puesto en el Comité Permanente de Politburo confirmará efectivamente a Xi como el próximo Secretario General, y habremos conformado la próxima década de liderazgo del partido antes de que se resuelva públicamente el asunto."
 CHI_ranks_for_sale: "Ranks para la venta"
 CHI_ranks_for_sale_desc: "La promoción se convierte en una lista de precios. Como lo hizo Xu Caihou desde 1999, cada estrella se vende al mejor postor, con efectivo entregado en cajas marcadas por el nombre del comprador. When his Beijing home was finally searched, investigators hauled out more than a tonne of monetary. Un cuerpo de oficiales que compró su rango luchará por su inversión, no su país."
 CHI_rapid_reaction_corps: "El Cuerpo de Reacción Rápido"
 CHI_rapid_reaction_corps_desc: "Las formaciones aéreas y aéreas por vía aérea se mantienen en constante disposición, capaces de desplegarse a través de China o más allá de ella dentro de horas. Transforman una crisis regional en un hecho resuelto antes de que los rivales puedan reunir una respuesta."
 CHI_rare_earth_dominance: "Estrategia Rara de Desarrollo de la Tierra"
 CHI_rare_earth_dominance_desc: "China controla aproximadamente el 85% de la producción mundial de tierras raras, concentrada en Mongolia Interna y Jiangxi. Un programa de consolidación dirigido por el Estado reduce la minería ilegal, eleva las normas de procesamiento y posiciona a China como el proveedor indispensable para la fabricación avanzada mundial."
 CHI_rare_earth_leverage: "La Tierra Rara Lever"
 CHI_rare_earth_leverage_desc: "Refinamos las tierras raras que las armas del mundo no pueden hacer sin, cerca del noventa por ciento de la oferta global, los imanes dentro de cada misil guiado y luchador sigiloso. Lo que era una exportación se convierte en una palanca: ahogar el suministro, y el arsenal de un rival se apaga mientras el nuestro corre libre."
 CHI_Reclaim_The_Heavenly_Waters: "Reclamen las Aguas Celestiales"
 CHI_Reclaim_The_Heavenly_Waters_desc: "Tianshui, las Aguas Celestiales, es la designación poética arcaica para los mares que rodean el Imperio Medio. El nombre proporciona sabor; la acción es moderna y naval. Los grupos de superficies PLAN comienzan a aumentar las incursiones en aguas Spratly disputadas, desafiando buques de guardia costera reclamante, alterando operaciones de reaprovisionamiento y presentando a cada gobierno con un ultimátum: aceptar autoridad administrativa china sobre las características impugnadas o enfrentar la próxima orden. El contador de choque avanza sólo cuando logramos un resultado táctico decisivo; compromisos inconclusivos y retrocesos estancan la escalera de escalada."
 CHI_reconstruction_development: "Capacidad de reconstrucción"
 CHI_reconstruction_development_desc: "Años de inversión en infraestructura y capacidad acumulada del sector de la construcción nos han dado una capacidad excepcional para reconstruir rápidamente después de desastres naturales y accidentes industriales. Los protocolos normalizados de respuesta a los desastres, las existencias de equipos prepuestos y las unidades especializadas de ingeniería del ejército sustentan esta capacidad. Debemos invertir para mantenerlo afilado, porque el próximo terremoto o inundación no esperará nuestra disponibilidad."
 CHI_red_arrow_program: "El Programa de Flecha Roja"
 CHI_red_arrow_program_desc: "Armour es contestado con la familia Red Arrow de misiles antitanque, el HJ-8 y HJ-9 que arman todo desde trípodes de infantería a vehículos y helicópteros. Barato, abundante y constantemente mejorado, dan a cada formación un alcance que mata tanques."
 CHI_Renminbi_Internationalization: "Yuan como moneda de reserva"
 CHI_Renminbi_Internationalization_desc: "Hemos puesto en marcha el Sistema Interbancario de Pagos Transfronterizos para eliminar las transacciones de renminbi fuera de la red SWIFT, y el Fondo Monetario Internacional ha admitido el yuan a su canasta de Derechos Especiales de Dibujo. El acuerdo comercial de BRI en renminbi aumenta constantemente el peso de nuestra moneda en las reservas globales. Ahora debemos profundizar estos mecanismos hasta que el renminbi sea una verdadera alternativa al dólar para los socios que valoran su independencia."
 CHI_Responsible_Stakeholder: "Titular responsable"
 CHI_Responsible_Stakeholder_desc: "Debemos aceptar el llamado de la comunidad internacional para convertirse en un participante constructivo en las instituciones globales. Al profundizar los vínculos comerciales y reducir la fricción en foros multilaterales, nos posicionamos como un socio indispensable en lugar de un retador revisionista. La etiqueta importa, incluso si la estrategia detrás de ella no cambia."
 CHI_rmb_internationalisation: "Renminbi Internationalisation"
 CHI_rmb_internationalisation_desc: "Se ha puesto en marcha el programa piloto de arreglo comercial de la RMB y ahora se firman acuerdos de intercambio de divisas con más de 40 bancos centrales. El FMI admite el yuan a su canasta de Derechos Especiales de Dibujo, un reconocimiento que no se puede recuperar. El Sistema de Pago Interbancario Transfronterizo proporciona una alternativa renminbi-denominada al SWIFT, alcanzando más de 1.500 instituciones miembros. Después de la exclusión SWIFT de Rusia, aproximadamente el 90 por ciento del comercio entre Rusia y China cambia a los pares CIPS y yuan-rouble, y Arabia Saudita, los Emiratos Árabes Unidos y Brasil comienzan a aceptar yuan para contratos de productos básicos. El sistema del dólar no está colapsando, pero ya no es sin un retador."
 CHI_Rome_Memorandum: "Memorándum de Roma BRI"
 CHI_Rome_Memorandum_desc: "La firma de Italia sobre un Memorándum de Entendimiento Franja y la Ruta fue la primera por un miembro del G7, fractando el consenso occidental sobre contener nuestra diplomacia de infraestructura en Europa. El acuerdo abarca la cooperación portuaria, ferroviaria y de infraestructura digital, con Trieste y Génova posicionados como terminales del norte de Adriatic y Ligurian para nuestro cargamento. Bruselas y Washington presionarán a Roma para que se retire, pero el llamamiento comercial de nuestra inversión debe ser políticamente duradero si gestionamos bien la relación."
 CHI_sasac: "Maneje las firmas a SASAC"
 CHI_sasac_desc: "Las empresas despojadas del ejército no desaparecen; pasan a la Comisión Estatal de Supervisión y Administración de Activos, fundada en 2003 para mantener los altos mandos de la economía. El beneficio militar se convierte en dividendo civil, reservado en Beijing en lugar de los cuarteles."
 CHI_sasac_founding: "State-Owned Assets Supervisión Commission"
 CHI_sasac_founding_desc: "Nuestro sector empresarial de propiedad estatal ha sufrido desde hace mucho tiempo una supervisión ministerial fragmentada sin una estrategia coherente de implicación. Debemos establecer una comisión de supervisión dedicada a consolidar el control sobre nuestras empresas gestionadas centralmente, introducir contratos de desempeño para la gestión ejecutiva, exigir remesas de dividendos y analizar decisiones importantes en materia de inversiones. El Estado debe actuar como accionista, no sólo como regulador."
 CHI_saturn_engine_crisis: "La crisis del motor Saturno"
 CHI_saturn_engine_crisis_desc: "China puede construir la estructura aérea pero no el corazón dentro de ella. Nuestros mejores combatientes todavía vuelan sobre Saturno AL-31 de Rusia, y cada embargo o subida de precios desde Moscú amenaza con aterrizar la flota. El WS-10 Taihang debe ser hecho para trabajar, sea cual sea el costo, o nuestra independencia es una ficción pintada sobre las turbinas importadas."
 CHI_scientific_development_outlook_foreshadowed: "Perspectivas de Desarrollo Científico Foreshadow"
 CHI_scientific_development_outlook_foreshadowed_desc: "Concede espacio ideológico al Vicepresidente. La gente de Hu Jintao tiene una apertura doctrinal - sostenibilidad, reequilibrio rural, enfoque centrado en el ser humano."
 CHI_scientific_outlook_on_development: "Científica Perspectivas del Desarrollo"
 CHI_scientific_outlook_on_development_desc: "La filosofía rectora de Hu Jintao exige el desarrollo centrado en las personas, integral, equilibrado y sostenible. Adoptarlo como doctrina del partido reorientará la política lejos del primer crecimiento del PIB hacia indicadores sociales y ambientales más amplios.La cuestión es si los funcionarios provinciales que han pasado una década optimizando por objetivos de producción pueden ser persuadidos a optimizar para algo más difícil de medir."
 CHI_scientific_outlook_on_development_tt: "§RPorque perdimos $CHI_scientific_outlook_idea_1$ ganamos:§!"
 CHI_SCO_Exclusive_Core: "Un núcleo exclusivo de SCO"
 CHI_SCO_Exclusive_Core_desc: "En lugar de diluir la OCS mediante una rápida expansión, debemos profundizar la integración entre los miembros existentes. Los vínculos más fuertes entre un grupo menor de naciones comprometidas darán mayores dividendos estratégicos."
 CHI_SCO_Exclusive_Core_tt: "§G Mejoras§! la cooperación de los miembros y §R bloques§! nuevas aplicaciones asociadas al diálogo. Los miembros existentes reciben bonos de opinión permanente."
 CHI_SCO_Plus_Expansion: "Expansión SCO+"
 CHI_SCO_Plus_Expansion_desc: "La fuerza de la OCS radica en su amplitud. Al reducir las barreras a la entrada y cortejar activamente nuevos interlocutores de diálogo, podemos ampliar el alcance de la organización en Asia, Oriente Medio y más allá."
 CHI_sea_eagles_carrier_wing: "El Ala de Aire del Transportista"
 CHI_sea_eagles_carrier_wing_desc: "Un puñado de combatientes no es un ala de aire. Redondeamos la cubierta del portaaviones con helicópteros de alerta temprana, antisubmarino y de guerra electrónica, soldando el avión en un ala integrada que puede scout, pantalla y huelga en su conjunto."
 CHI_sea_eagles_of_the_liaoning: "Águilas marinas del Liaoning"
 CHI_sea_eagles_of_the_liaoning_desc: "La cubierta de Liaoning gana sus cuentos. El J-15 'Flying Shark', un pesado luchador de portaaviones derivado del Su-33, está armado y trabajado en un avión de huelga, y la doctrina de la huelga de portaaviones, de proyectar la fuerza aérea de una cubierta china en movimiento, se escribe por primera vez."
 CHI_second_gen_platforms: "La Segunda Generación de Plataforma"
 CHI_second_gen_platforms_desc: "ByteDance lanza Douyin a nivel nacional y TikTok internacional, alcanzando audiencias la generación de BAT nunca apuntada. Pinduoduo interrumpe el comercio electrónico con mecánicos de compras colectivas que llegan a consumidores en cuatro ciudades y mercados rurales; Meituan lidera los servicios a pedido. Didi absorbe Uber China. Una segunda oleada de plataformas está profundizando nuestra economía digital en segmentos que la primera generación encontró demasiado difusa o demasiado inglamorous para construir."
 CHI_Second_Island_Chain_Reach: "Segunda Proyección de Cadena Isla"
 CHI_Second_Island_Chain_Reach_desc: "Los derechos de acceso de la Armada del PLA en el Pacífico Melanesio y Polinésico aportan nuestras bases de operaciones avanzadas a una distancia sorprendente de Guam, Hawai y las vías marítimas que conectan los Estados Unidos con sus aliados de Asia oriental. La proyección rompe la lógica estratégica de la Segunda Cadena Isla en la que los planificadores estadounidenses se han basado desde la Guerra Fría. Australia pierde el búfer geográfico que siempre ha tratado como una constante. Deberíamos movernos antes de que se den cuenta de que se ha ido."
 CHI_Secure_The_Heavenly_Waters: "Asegurar las Aguas Celestiales"
 CHI_Secure_The_Heavenly_Waters_desc: "Tianshui, las Aguas Celestiales, es el término arcaico para los mares que rodean el dominio del Imperio Medio. Los que rechazaron la invitación para reconocer el orden adecuado ahora son llevados a talón por la fuerza de las armas. El Mar del Sur es restaurado a su correcta administración bajo nuestra autoridad."
 CHI_seed_security_campaign: "Campaña de seguridad de semillas"
 CHI_seed_security_campaign_desc: "La guerra de soja expuso claramente nuestra vulnerabilidad: los comerciantes de granos ABCD adquirieron el 70 por ciento de nuestra capacidad de encruciamiento de soja después de que los procesadores domésticos entraran en bancarrota en posiciones futuras especulativas. No debemos permitir que esa exposición se repita. Sanya en la isla de Hainan sirve como nuestra base de cultivo de cultivos Nanfan, donde los inviernos tropicales permiten tres generaciones de reproducción al año. La adquisición de ChemChina de Syngenta coloca las colecciones globales de germoplasma bajo influencia estatal, mientras que Longping Hi-Tech y la agencia de granos Beidahuang son designados campeones nacionales en soberanía de semillas."
 CHI_selective_anti_corruption: "Campaña selectiva contra la corrupción"
 CHI_selective_anti_corruption_desc: "Las investigaciones contra la corrupción de mediados de los años 2000 fueron muy selectivas. Se persiguieron casos contra funcionarios que habían acumulado bases de poder independientes o cruzado líneas facciones, mientras que los aliados y patronos estaban aislados del escrutinio. La dimensión política de estos procesos socavaba su legitimidad y generó un resentimiento fraccional dentro del partido."
 CHI_Seoul_Under_Our_Umbrella: "Seúl Under Our Umbrella"
 CHI_Seoul_Under_Our_Umbrella_desc: "Corea del Sur y nosotros formalizamos un marco de asociación estratégica. Nuestras garantías de seguridad reemplazan a la alianza estadounidense, se negocia el acceso al PLAN a la isla Jeju y las fuerzas estadounidenses comienzan su redespliegue anticipado desde hace mucho tiempo desde la península."
 CHI_service_of_the_three_distances: "Servicio de las Tres Distancias"
 CHI_service_of_the_three_distances_desc: "La marina redefine lo lejos que debe llegar. Más allá de la defensa cercana de la primera cadena de Liu Huaqing, ahora entrena para el mar lejano y el océano abierto por igual, las tres distancias en que una flota global debe estar lista para luchar. La Doctrina cambia decididamente de defender la costa para operar a través de los océanos del mundo."
 CHI_seventeen_plus_one_mechanism: "16+1 Cooperation Framework"
 CHI_seventeen_plus_one_mechanism_desc: "La plataforma 17+1 para la cooperación entre China y Europa Central y Oriental canaliza nuestra inversión en la Unión Europea y la infraestructura estatal de candidatos, suscitando preocupaciones en Bruselas sobre la deriva de la alineación con los Estados miembros y la circunvención reglamentaria. Bruselas tiene razón para preocuparse. Debemos profundizar estas relaciones precisamente porque fragmentan el frente europeo unificado que limita nuestro acceso al mercado."
 CHI_shadow_banking_cleanup: "Banco de sombras y limpieza del riesgo financiero"
 CHI_shadow_banking_cleanup_desc: "La inundación de estímulos de 2008 y 2009 dejó los productos de gestión de la riqueza y las empresas fiduciarias acumulando riesgo opaco en los vehículos de financiación inmobiliaria y del gobierno local. Las nuevas normas de gestión de activos requieren precios de valor neto para los productos de gestión de la riqueza y eliminan las garantías implícitas. Anbang Seguro es incautado por el estado después de 300 mil millones de dólares EE.UU. en adquisiciones imprudente en el extranjero. HNA Group colapsa bajo su propia deuda. La limpieza concentra la supervisión del riesgo en el CBIRC reformado y estabiliza el mercado interbancario. La disciplina no es castigo; es el precio de un sistema en el que podemos confiar."
 CHI_shandong_at_sanya: "Shandong at Sanya"
 CHI_shandong_at_sanya_desc: "El segundo portaaviones es totalmente nuestro. El tipo 002 Shandong, el primer portaaviones diseñado y construido en China, se lanzó en 2017 y se encargó en 2019, luego deportado en Sanya en Hainan junto a las cavernas submarinos de Yulin. Desde el sur observa los carriles de mar y las islas disputadas que China significa sostener."
 CHI_shantytown_renovation: "Programa de renovación de Shantytown"
 CHI_shantytown_renovation_desc: "El programa nacional de renovación shantytown demole viviendas de trabajadores en antiguas provincias de carbón y minería y lo sustituye por distritos residenciales e industriales modernos. Shanxi y Henan, cargados por el envejecimiento de la infraestructura industrial pesada, reciben las mayores asignaciones. El gasto del gobierno central en el programa alcanza 1,54 billones de yuan, generando una ola de contratos de construcción y abriendo nuevas zonas industriales por todo el interior donde no existían antes."
 CHI_shenyang_j35_gyrfalcon: "El tiburón azul J-35"
 CHI_shenyang_j35_gyrfalcon_desc: "Un segundo peleador de sigilo se une al primero. El J-35 de Shenyang, cultivado desde el manifestante FC-31, es un jet de quinta generación doble para bases terrestres y cubiertas de portaaviones, dando a China un sigilo alto con el J-20 que sólo Estados Unidos puede de otra manera campo."
 CHI_shenzhou_program: "El Programa Shenzhou"
 CHI_shenzhou_program_desc: "El 15 de octubre de 2003 Yang Liwei se retiró a bordo de Shenzhou 5 del Centro de lanzamiento de satélites Jiuquan, convirtiéndose en el primer astronauta de China. La misión de catorce órbitas y veintiún horas hizo a China el tercer país enviar de forma independiente un humano al espacio, e inauguró un programa tripulado de vuelos espaciales que aumentaría para incluir caminatas espaciales, reuniones orbitales y misiones de estaciones de larga duración."
 CHI_sicarrier_euv: "Programa SiCarrier EUV"
 CHI_sicarrier_euv_desc: "SiCarrier Technology, establecida con respaldo estatal directo, se encarga de cerrar la brecha EUV. El programa se basa en la capacidad de diseño óptico nacional desarrollada en el Instituto Changchun de Óptica y experiencia de fabricación de espejos de CNNC. Un demostrativo funcional de la EUV requiere una producción nacional de 13.5nm fuentes de luz, óptica reflectante multicapa y etapas de wafer en precisión sub-nanometre. Este es nuestro intento más ambicioso de lograr la plena soberanía del equipo semiconductor. Una herramienta de trabajo nacional EUV significa que podemos fabricar chips avanzados de punta a punta sin una única licencia de equipo extranjero, rompiendo el régimen de control de las exportaciones occidentales en su fundación."
 CHI_Silk_Road_Fund: "Seda Road Fund"
 CHI_Silk_Road_Fund_desc: "El Fondo Silk Road, capitalizado en $40 mil millones de nuestras reservas de divisas y fondos soberanos de riqueza, proporciona financiación de acciones para proyectos BRI que bancos comerciales y prestamistas multilaterales no llevarán solos. Es el instrumento a través del cual podemos decir que sí a los proyectos que de otro modo se estancarían por la falta de un primer impulsor dispuesto a correr el riesgo."
 CHI_sinograin_strategic_reserve: "Sinograin"
 CHI_sinograin_strategic_reserve_desc: "La China Grain Reserves Corporation hereda el papel de los graneros imperiales de las dinastías Sui y Tang, anclados por Heilongjiang's Beidahuang, cuyas granjas de suelo negro producen más grano que cualquier otra provincia. Sinograin implementa la política de precios mínimos de compra de granos, comprando en nombre del estado cuando los mercados caen. Una reserva estratégica de cerdo se ha unido desde entonces a las tiendas de granos, la única de su tipo en el mundo, y debemos tratar este sistema como el activo estratégico que es."
 CHI_smee_lithography: "Desarrollo de litografía SMEE"
 CHI_smee_lithography_desc: "Shanghai Micro Electronics Equipment Group es nuestro único fabricante de litografía, produciendo herramientas de exposición 90nm y 110nm para los procesos de embalaje y back-end. La financiación estatal acelera el desarrollo de un escáner DUV de inmersión de 28 nm, con los avances en materia de cualificación notificados ahora en las fabs nacionales. SMEE sigue siendo una generación detrás de las herramientas más capaces de ASML, pero la producción nacional DUV elimina nuestra dependencia para la expansión de la capacidad de los ganglios maduros y proporciona la base que necesitamos para el desarrollo hacia la litografía avanzada. La brecha es real; la trayectoria es correcta."
 CHI_smic_advanced_node: "Pista SMIC Advanced-Node"
 CHI_smic_advanced_node_desc: "Tras nuestra colocación en la Lista de Entidades de los Estados Unidos, SMIC aceleró su trayectoria de desarrollo nacional. Nuestros ingenieros adaptaron las herramientas DUV existentes para lograr una densidad de 7nm-equivalente a través del multipatterning, resultado que la ingeniería de procesos creativos confirmada puede sustituir parcialmente el acceso EUV. El logro adquirió tiempo para el desarrollo del equipo doméstico y reforzó la brecha tecnológica como un problema de ingeniería solvable. El Mate 60 Pro lanzó esta capacidad de fabricación al mundo, desencadenando una nueva ola de revisiones de control de exportaciones estadounidenses, y esa respuesta nos dice que estamos haciendo las cosas correctas."
 CHI_smic_zhangjiang: "Ampliación SMIC Zhangjiang"
 CHI_smic_zhangjiang_desc: "El Semiconductor Manufacturing International Corporation construyó su emblemático campus de 300mm fab en Zhangjiang Hi-Tech Park, y la inversión estatal en sucesivas expansiones de capacidad ha permitido a SMIC alcanzar la producción de 28 nm y comenzar la producción de riesgos de 14 nm. Cada nodo sucesivo cierra la brecha con TSMC y Samsung, y SMIC es ahora la única fundición china continental capaz de producir lógica avanzada. Debemos proteger este activo y empujarlo más lejos."
 CHI_smuggling_tax: "Impuesto al contrabando"
 CHI_smuggling_tax_desc: "El ejército no maneja cada raqueta; los licencia. Los contrabandistas que mueven petróleo, coches y cigarrillos a través de puertos y guarniciones pagan a los comandantes locales para la protección, y que el impuesto se convierte en un presupuesto no oficial ningún ministerio puede ver o tocar."
 CHI_Soft_Power_Projection: "Proyección de energía blanda"
 CHI_Soft_Power_Projection_desc: "Establecer institutos confucio en universidades de todo el mundo y ampliar el alcance internacional de los medios estatales para promover la lengua, cultura y perspectivas chinas en el extranjero."
 CHI_special_operations_forces: "Fuerzas de Operaciones Especiales"
 CHI_special_operations_forces_desc: "Cada teatro levanta sus propias brigadas de operaciones especiales, capacitadas para redadas, reconocimiento y huelgas de decapitación. Son la punta de la hoja afilada, enviada antes de la fuerza principal para abrir la puerta desde el interior."
 CHI_star_market_bse: "STAR Market y Beijing Stock Exchange"
 CHI_star_market_bse_desc: "La Junta de Innovación en Ciencia y Tecnología de la Bolsa de Shanghai introduce IPOs basados en el registro, estructuras de participación de doble clase y acceso a las empresas pre-beneficios. SMIC recauda 7.5 mil millones de dólares EE.UU. en STAR; la Bolsa de Valores de Beijing sigue, dirigida a empresas pequeñas y medianas innovadoras. Juntos estas plataformas permiten a las empresas de fabricación semiconductores, biotecnológicas y avanzadas elevar el capital nacional sin depender de los listados de Wall Street. Nuestros mercados de capitales ya no son un riesgo de dependencia."
 CHI_state_council_information_office: "Oficina de información del Consejo de Estado"
 CHI_state_council_information_office_desc: "La Oficina de Información del Consejo de Estado gestiona nuestras comunicaciones externas, operaciones de propaganda en el extranjero, gobernanza interna de Internet y acreditación de prensa extranjera. Debemos utilizarlo para institucionalizar el filtrado de contenidos bajo el programa Golden Shield y ampliar nuestra radiodifusión internacional para contrarrestar la dominación narrativa occidental. El entorno de información es un campo de batalla, y no podemos permitirnos cederlo por defecto."
 CHI_stock_exchanges_shanghai_shenzhen: "Shanghai, Shenzhen y Hong Kong Exchanges"
 CHI_stock_exchanges_shanghai_shenzhen_desc: "La Bolsa de Valores de Shanghai alberga grandes empresas estatales, incluyendo los Grandes Cuatro bancos, Sinopec, PetroChina y China Mobile. The Shenzhen Stock Exchange acoge empresas privadas e innovadores como BYD, Midea, Gree y Ping An. ChiSiguiente en Shenzhen funciona como un equivalente de crecimiento-stock del NASDAQ. Los programas Shanghai-Hong Kong y Shenzhen-Hong Kong Stock Connect abren una puerta de entrada controlada para inversores internacionales sin la liberalización total de las cuentas de capital, lo que nos permite atraer capitales extranjeros en nuestros propios términos."
 CHI_strategic_materials: "Cadenas de suministro de material estratégico"
 CHI_strategic_materials_desc: "Controlamos más del 80 por ciento de la capacidad global de refinación de gérmenes y germanio y dominamos el suministro de fluorito, metal de silicio y elementos de tierra raros utilizados en fabricación semiconductor. Tras los controles de exportación de los Estados Unidos, imponemos licencias de exportación sobre el gaslio y el germanio, a continuación, agregamos nuevas restricciones a los compuestos de arsenida de gallium. La política nacional reorienta la producción de material estratégico hacia nuestras propias dificultades, reduciendo los costos y asegurando la continuidad del suministro para las fundiciones que operan bajo limitaciones de la lista de entidades. El chokepoint de materiales funciona en ambas direcciones."
 CHI_strategic_reserve_system: "Sistema de Reserva Estratégica"
 CHI_strategic_reserve_system_desc: "Depth es su propia defensa. Un sistema reformado de reserva y movilización está listo para inundar el frente con mano de obra capacitada, asegurando que incluso una larga guerra de atrición es una China puede superar."
 CHI_streamline_the_ranks: "Streamline los Ranks"
 CHI_streamline_the_ranks_desc: "Un ejército de dos millones construido para ahogar a un invasor en cuerpos no puede ganar una guerra de precisión. Cortamos la infantería hinchada, retiramos el obsoleto y vertimos los ahorros en potencia de fuego, sensores y movilidad. El Ejército Popular de Liberación será más pequeño, más fuerte y, por primera vez, una fuerza construida para ganar en lugar de simplemente para soportar."
 CHI_strike_black_sing_red: "Huelga Black, Sing Red"
 CHI_strike_black_sing_red_desc: "Una campaña doble para limpiar la política del cuerpo. El impulso 'Strike Black' arresta a miles de figuras del crimen organizado y funcionarios corruptos, desmantelando las redes de patronaje que han corroído la gobernanza local. El impulso 'Sing Red' revive canciones revolucionarias y eslóganes maoístas, canalizando la energía popular hacia la movilización patriótica."
 CHI_Suez_Eastern_Bank: "Zona Industrial Oriental de Suez"
 CHI_Suez_Eastern_Bank_desc: "La Zona de Cooperación Económica y Comercial China-Egipto Suez en la orilla oriental del canal acoge nuestras empresas de fabricación, logística y energía bajo condiciones regulatorias egipcias preferenciales. La zona se bloquea en nuestra posición estratégica en uno de los puntos marítimos más críticos del mundo, reduciendo los costos de tránsito y dando a nuestras empresas una base para el acceso al mercado norteafricano y europeo. Egipto gana ingresos y asociación política con nosotros. Ambos lados entienden el valor de lo que estamos construyendo."
 CHI_Sunshine_Policy_Revival: "Política de renacimiento del sol"
 CHI_Sunshine_Policy_Revival_desc: "Debemos coordinarnos con Seúl para revivir el marco de compromiso intercoreano que colapsó en los años después del hundimiento Cheonan y el bombardeo Yeonpyeong. Los intercambios culturales conjuntos, los programas de visitas familiares reunidos y las líneas aéreas reabiertas reconstruyen la infraestructura básica de comunicación entre las dos Coreas, con nosotros sirviendo como facilitador indispensable. Una Corea que habla es una Corea que no lucha."
 CHI_system_of_systems_operations: "Operaciones de sistema de sistemas"
 CHI_system_of_systems_operations_desc: "El fin de la reforma es una forma de guerra, no una mesa de organización. Proseguimos operaciones de sistema de sistemas, fusionando sensores, tiradores y comandantes en una red que piensa y golpea más rápido de lo que cualquier enemigo puede reaccionar. El ejército que gana la próxima guerra luchará como un solo organismo."
 CHI_tactical_electronic_warfare: "Táctica de guerra electrónica"
 CHI_tactical_electronic_warfare_desc: "En el campo de batalla informatizado, el lado que ciega las otras victorias. Campo dedicamos interferencias, señales y unidades de ataque electrónico a nivel de brigada, impugnando las radios, radares y enlaces de datos del enemigo antes del primer disparo."
 CHI_tactical_uav_integration: "Integración táctica UAV"
 CHI_tactical_uav_integration_desc: "Los ojos arriba se convierten en un problema estándar. Los pequeños drones de reconocimiento son empujados hacia el batallón y la compañía, para que ningún comandante avance ciego y todos los objetivos puedan ser encontrados antes de que sea disparado."
 CHI_Takeshima_Solidarity: "El comunicado de Liancourt Rocks"
 CHI_Takeshima_Solidarity_desc: "Apoyamos formalmente la afirmación de Corea del Sur sobre las rocas de Liancourt, enmarcando la disputa como una queja compartida contra la negativa de Japón a reconocer su legado imperial. La brecha entre Seúl y Tokio se ensancha, alejando a la opinión pública coreana de la arquitectura de alianza del Pacífico de Washington."
 CHI_telecom_reorganization: "Reorganización de telecomunicaciones"
 CHI_telecom_reorganization_desc: "El Consejo de Estado reestructura nuestro monopolio de telecomunicaciones: divide China Telecom y concede licencias de espectro 3G a China Mobile, China Unicom y China Telecom simultáneamente. La competencia resultante impulsa la inversión en infraestructura de red y acelera la adopción de la banda ancha móvil en un mercado de 1.400 millones de posibles abonados al que ningún competidor extranjero puede acceder."
 CHI_tencent_games_publisher: "Imperio de juego de diez centavos"
 CHI_tencent_games_publisher_desc: "Tencent adquiere Riot Games y Supercell, y tiene grandes apuestas en Epic, Activision Blizzard y Ubisoft. El honor de Reyes se convierte en el juego móvil más grande del mundo; Genshin Impact gana 5 mil millones de dólares en sus primeros dos años. Nuestra inversión en estudios occidentales nos da influencia estructural sobre el entretenimiento global a una fracción del costo de la energía blanda tradicional. La cultura mueve a la gente de maneras que la diplomacia no puede alcanzar."
 CHI_The_2022_Reset: "Reiniciar [GetYear]"
 CHI_The_2022_Reset_desc: "Partiendo del marco Bali G20 establecido en [GetYear], nosotros y los Estados Unidos revivimos formalmente la arquitectura de las seis partes. Asumimos el papel de intermediario honesto entre Washington, Seúl y Pyongyang por primera vez en más de una década."
 CHI_The_2025_Blue_Sky_Operation: "Operación Blue Sky"
 CHI_The_2025_Blue_Sky_Operation_desc: "Corea del Norte y nosotros lanzamos una campaña militar coordinada contra Corea del Sur. La Operación Blue Sky pondrá a prueba nuestra voluntad de asumir el costo internacional de la unificación coreana por la fuerza."
 CHI_The_610_Northeast_Directive: "Directiva Nororiental 610"
 CHI_The_610_Northeast_Directive_desc: "El Comando Nororiental del PCCh activa protocolos de movilización de emergencia en Manchuria y Liaoning. Se refuerzan las fuerzas fronterizas, se reubican las reservas estratégicas y se endurece la infraestructura en el territorio fronterizo para apoyar cualquier eventual contingencia futura en la península."
 CHI_the_610_office_mandate: "Mandato de la Oficina 610"
 CHI_the_610_office_mandate_desc: "La oficina 610, nombrada para la fecha de su fundación, coordina nuestras agencias de seguridad estatales en la represión de Falun Gong y otros grupos considerados amenazas a la estabilidad social. La oficina funciona fuera de los canales legales normales, concentrando el poder de ejecución en las manos del centro. Su mandato es deliberadamente incontrolado, ya que las amenazas a que se dirige no respetan los límites del derecho ordinario."
 CHI_the_998_project: "El proyecto 998 Bomber"
 CHI_the_998_project_desc: "El brazo del bombardero, largo escrito como obsoleto, se da un futuro. Un programa dedicado reconstruye la huelga de largo alcance alrededor de una estructura aérea profundamente modernizada, convirtiendo una reliquia de Guerra Fría en un portamisiles independiente capaz de amenazar objetivos a través del Pacífico occidental sin cruzar nunca una costa hostil."
 CHI_The_Air_Patrol_Zone: "Zona de Patrulla Aérea"
 CHI_The_Air_Patrol_Zone_desc: "Lo que otros estados llaman un ADIZ, preferimos describir como una zona de patrulla regularizada: interceptores del PLAAF que realizan patrullas periódicas de soberanía sobre el Mar de China Meridional, identificando aeronaves extranjeras y escoltando tránsitos no compatibles fuera de la zona. El efecto práctico refleja el precedente del Mar de China Oriental 2013, con todos los aviones no chinos que se enfrentan a requisitos de identificación y riesgo de interceptación, pero el encuadre hace hincapié en nuestro poder aéreo en lugar de una reclamación legal formal que la comunidad internacional impugnará inmediatamente."
 CHI_the_anime_generation_gambit: "Anime Generation Gambit"
 CHI_the_anime_generation_gambit_desc: "Nuestra juventud cita a Hayao Miyazaki con más frecuencia de lo que citan a Mao. Esto es un problema o una oportunidad. El camarada Wang Huning cree que es este último."
 CHI_The_Beijing_Peace_Guarantee: "La Garantía de Paz de Beijing"
 CHI_The_Beijing_Peace_Guarantee_desc: "Escribimos un acuerdo final entre las dos Coreas. La Garantía de Paz de Beijing nos compromete a defender la soberanía unificada de Corea contra las injerencias externas."
 CHI_The_Beijing_Settlement: "El acuerdo de Beijing"
 CHI_The_Beijing_Settlement_desc: "Con el golpe consolidado, correteamos los términos de la nueva realidad política de Corea del Norte. El gobierno de transición en Pyongyang acepta nuestro arbitraje, y el Partido Obrero Coreano es reestructurado bajo nuestra supervisión."
 CHI_the_bohai_bastion: "La Basción de Bohai"
 CHI_the_bohai_bastion_desc: "El disuasivo más fuerte es el que no se puede encontrar. El boomer Tipo 094A, que transporta el misil JL-3 con un alcance de unos diez mil kilómetros, puede por fin atacar al continente americano de las aguas del hogar defendidas. Apodado detrás de la flota en un bastión protegido, nuestros submarinos balístico-misile dan a China una verdadera segunda huelga basada en el mar, la garantía final de que ningún primer golpe puede desarmarnos."
 CHI_The_Border_Personnel_Meetings: "Reuniones de personal fronterizo"
 CHI_The_Border_Personnel_Meetings_desc: "Cinco puntos a lo largo de la Línea de Control Actual donde los comandantes indios y chinos pueden reunirse sin protocolo de escalada. Una tetera, una mesa plegable, dos banderas. A veces la diplomacia comienza en lugares tan pequeños."
 CHI_The_Cabbage_Strategy: "Estrategia de Cabbage"
 CHI_The_Cabbage_Strategy_desc: "Rear Almirante Zhang Zhaozhong ha descrito la táctica públicamente: envuelve cada característica impugnada en capas sucesivas. Barcos de pesca en el exterior, milicias marítimas detrás de ellos, cortadores de la guardia costera después, fragatas en el núcleo, hasta que las hojas más externas sean indistinguibles de soberanía. Para cuando lleguen los abogados extranjeros, el repollo ya ha crecido. Adoptamos esta doctrina como nuestro marco para el Mar del Sur de China."
 CHI_The_Cabbage_Tightens: "El Cabbage Tightens"
 CHI_The_Cabbage_Tightens_desc: "Las milicias marítimas y los buques de guardacostas ahora operan bajo coordinación unificada del PLAN en toda la cadena de arrecifes impugnada. Las capas exteriores del repollo se consolidan en una presencia administrativa y de seguridad sin costuras. Lo que una vez fue disputado es ahora, en la práctica, administrado."
 CHI_the_china_plus_one_counteroffensive: "La contraofensiva China-Plus-One"
 CHI_the_china_plus_one_counteroffensive_desc: "Mr. Toyoda visitó Tianjin esperando concesiones. Salió con concesiones, y un contrato para cien mil vehículos de pila de combustible. El arte de dar mientras tomamos sigue siendo nuestro para perfeccionar."
 CHI_The_Chinese_Correction: "La Corrección China"
 CHI_The_Chinese_Correction_desc: "El comportamiento errático de la dinastía Kim se ha convertido en una responsabilidad estratégica. Hemos decidido que una transición gestionada, tranquila, quirúrgica e irreversible, es preferible a otra generación de diplomacia del chantaje de Pyongyang."
 CHI_the_chinese_dream: "El sueño chino"
 CHI_the_chinese_dream_desc: "El gran rejuvenecimiento de la nación china es el mayor sueño chino. Un siglo de humillación ha dado paso a la restauración, y el Partido presenta esta transformación no como ideología, sino como destino histórico compartido por los 1.400 millones. La fortaleza económica, el poder militar y el respeto internacional no son ambiciones: son lo que nos fue arrebatado y lo que recuperaremos."
 CHI_The_Code_Of_Conduct: "Código de Conducta"
 CHI_The_Code_Of_Conduct_desc: "Un Código de Conducta regional vinculante, negociado en términos chinos, se presenta como la solución definitiva de las reclamaciones del Mar de China Meridional que compiten. El instrumento codifica los acuerdos bilaterales, excluye el arbitraje externo y consagra el principio de que las controversias son un asunto únicamente para China y sus vecinos. Las potencias externas se niegan a cualquier lugar jurídico."
 CHI_the_diaoyu_sovereignty_declaration: "Declaración de Soberanía Diaoyu"
 CHI_the_diaoyu_sovereignty_declaration_desc: "Las Islas Diaoyu han sido territorio chino desde la dinastía Ming. La 'administración' japonesa es una herencia colonial que el mundo ha tolerado durante demasiado tiempo."
 CHI_The_Duterte_Pivot: "El Duterte Pivot"
 CHI_The_Duterte_Pivot_desc: "Cuando el presidente Duterte de Filipinas declaró la «separación» de su país desde los Estados Unidos y se dirigió hacia Beijing, mostró a la región que un líder del sudeste asiático puede elegir soberanía sobre dependencia. Debemos cultivar pivotes similares en otros lugares, silenciosamente y pacientemente, hasta que las alianzas de Washington se conviertan en una pregunta más que una respuesta."
 CHI_The_Final_Compromise: "El Compromiso Final"
 CHI_The_Final_Compromise_desc: "Después de años de diplomacia paciente, negociamos un acuerdo final aceptado por ambas Coreas. Ni la unificación ni la división permanente, el acuerdo establece una zona económica compartida, cruces fronterizos desmilitarizados y una comisión conjunta de vigilancia china-coreana. emergemos como el garante indispensable de la paz en la península."
 CHI_The_Five_Fingers_Doctrine: "La Doctrina de los Cinco Fingers"
 CHI_The_Five_Fingers_Doctrine_desc: "Mao lo dijo en 1959: el Tíbet es la palma derecha, y los cinco dedos son Ladakh, Nepal, Sikkim, Bhután y la Agencia Fronteriza Nororiental. Tenemos la palma y el pulgar. Los otros dedos están esperando."
 CHI_the_fujian_catapults: "Las Catapultas Fujian"
 CHI_the_fujian_catapults_desc: "El salto de esquí da paso a la catapulta. El tipo 003 Fujian, lanzado en 2022, es el primer portaaviones chinos con catapultas electromagnéticas, capaz de volar aviones más pesados, totalmente alimentados e incluso aviones aéreos desde su cubierta. Con ella, la brecha a una supercarrera americana se estrecha de un chasma a un paso adelante."
 CHI_the_fukuda_doctrine_revisited: "Revisitaron la Doctrina de Fukuda"
 CHI_the_fukuda_doctrine_revisited_desc: "El camarada Deng nos dijo: esconde tu fuerza, bídete tu tiempo. La economía japonesa es hemorragia, su natalidad se está desmoronando, sus políticos recorren Kantei cada catorce meses. ¿Por qué elegir una pelea con un cadáver en espera cuando podemos comprar su herencia?"
 CHI_The_G2_Declaration: "The G2 Declaration"
 CHI_The_G2_Declaration_desc: "En una cumbre que abarca Washington y Beijing, nuestros líderes y los estadounidenses declaran conjuntamente su compromiso con una península de Corea pacífica y unificada bajo la gobernanza coreana. La Declaración del G2 indica una nueva era de gestión de gran potencia de la seguridad del Asia oriental, y es uno que nos reconoce como un socio igual en ese acuerdo."
 CHI_the_great_wall: "El Gran Muro"
 CHI_the_great_wall_desc: "Algunas batallas se ganan por no perder nunca. Elegimos el camino defensivo, la moderna Gran Muralla: fortificaciones en capas, reservas profundas y un ejército que sangra a cualquier invasor blanco en suelo chino. La reunificación puede esperar si la patria se hace por primera vez inconquistable."
 CHI_the_great_western_development: "El Gran Desarrollo Occidental"
 CHI_the_great_western_development_desc: "Nuestra política de Go West canaliza la inversión estatal en doce provincias occidentales a través de la construcción de infraestructuras, incentivos de fábrica y programas de reasentamiento. El cierre de la brecha entre las costas y el interior es un imperativo económico y nuestro instrumento más duradero para que las regiones fronterizas sean vinculantes en el centro."
 CHI_the_historical_reckoning: "El Reckoning Histórico"
 CHI_the_historical_reckoning_desc: "Los libros de texto omiten una ciudad. Los santuarios honran a los arquitectos. Seremos los que recordar."
 CHI_the_iron_fist: "Iron Fist"
 CHI_the_iron_fist_desc: "La defensa no gana nada. Elegimos el puño de hierro: grandes brigadas combinadas lideradas por el tipo 99, armadura de masa y fuegos de largo alcance construidos para romper a través de un enemigo preparado y apoderarse del suelo. Cuando la orden llegue a cruzar un estrecho o una frontera, será contestada con un peso abrumador."
 CHI_The_Jang_Faction_Rehabilitation: "Rehabilitación de Facción Jang"
 CHI_The_Jang_Faction_Rehabilitation_desc: "Cuando Jang Song-thaek fue purgado y ejecutado, nuestro interlocutor más confiable en Pyongyang se perdió con él. Ahora rehabilitaremos su red sobreviviente en el exilio, cultivando un cuadro de funcionarios coreanos reformistas que nos deben sus futuros."
 CHI_the_japan_question: "La cuestión del Japón"
 CHI_the_japan_question_desc: "A nuestro noreste se encuentra una gran amenaza, así como una gran oportunidad. La pregunta japonesa, como la pregunta de Taiwán y la pregunta de Corea, no admite respuesta permanente, sólo la respuesta que se adapta a la hora actual."
 CHI_the_komsomolsk_pipeline: "El Pipeline Komsomolsk"
 CHI_the_komsomolsk_pipeline_desc: "¿Por qué esperar a nuestras fábricas cuando Rusia ya está corriendo? Desde Komsomolsk-on-Amur compramos los motores Su-27, el Su-30 y el AL-31 que potencian la mitad de nuestra flota, importando una generación de capacidad todavía no podemos construir. El oleoducto mantiene la fuerza aérea moderna hoy, a precio de dependencia en Moscú mañana."
 CHI_The_Mandate_Of_The_Seas: "El Mandato de los Mares"
 CHI_The_Mandate_Of_The_Seas_desc: "La cosmovisión clásica china reconoció cuatro mares que rodeaban el centro civilizado del Imperio Medio, el Sihai. Los Reyes Dragón de esas aguas respondieron al Cielo, y a través de ellos al Hijo del Cielo. Esa orden fue interrumpida por el siglo de la humillación; ahora espera la restauración bajo un estado lo suficientemente fuerte como para hacerla cumplir."
 CHI_the_maritime_militia_initiative: "La iniciativa de la milicia marítima"
 CHI_the_maritime_militia_initiative_desc: "Cada barco pesquero es un marcador de soberanía móvil. La Milicia Marítima de las Fuerzas Armadas Populares responde a la Comisión Militar Central, pero el mundo sólo verá pescadores."
 CHI_The_Maritime_Silk_Road_Initiative: "Iniciativa de la Ruta de la Seda Marítima"
 CHI_The_Maritime_Silk_Road_Initiative_desc: "La Ruta de la Seda Marítima es el componente del mar de la Iniciativa Franja y la Ruta, ampliando nuestras inversiones en infraestructura y redes comerciales en Asia sudoriental, Asia meridional y África oriental. En el Mar de China Meridional sirve como ancla económica de nuestro camino diplomático: los Estados reclamantes ofrecieron financiación portuaria, acuerdos pesqueros y empresas mixtas de hidrocarburos encuentran la vía bilateral más atractiva que la confrontación a nivel de la ASEAN. Cada acuerdo firmado refuerza el principio de que estas controversias son asuntos entre vecinos, no casos de adjudicación internacional."
 CHI_the_nanjing_memorial_mandate: "El mandato conmemorativo de Nanjing"
 CHI_the_nanjing_memorial_mandate_desc: "Trescientos mil. El número estará en cada portada del libro de texto, todos los muros del museo, cada 13 de diciembre de silencio. El gobierno japonés tiene sus recuerdos. Tendremos el nuestro."
 CHI_The_Nine_Dots_Consensus: "El Consenso de Nueve Puntos"
 CHI_The_Nine_Dots_Consensus_desc: "En lugar de elegir los lados entre Pyongyang y Seúl, trazamos un curso medio calibrado: manteniendo vínculos con el Norte sin garantizar la supervivencia del régimen, profundizando los vínculos económicos con el Sur sin abandonar la ambigüedad estratégica. Apostamos que mantener ambos hilos simultáneamente es el único enfoque que puede producir eventualmente una península estable."
 CHI_the_northeast_tiger: "El Tigre del Nordeste"
 CHI_the_northeast_tiger_desc: "El poder en el ejército corrupto corre por la región y el patrocinio. La camarilla de Shenyang del noreste, el suelo del que resucitó Xu Caihou, se convierte en un reyista, citas comerciales y favores a través de las antiguas regiones militares como una finca privada."
 CHI_the_panda_diplomacy_renewal: "Renovación de la diplomacia Panda"
 CHI_the_panda_diplomacy_renewal_desc: "Dos pandas. Doce millones de dólares al año en 'cargos de conservación'. Una fotografía portada de un niño japonés sonriendo a un animal chino. Le vale a cada yuan."
 CHI_The_Panmunjom_Architecture: "La arquitectura Panmunjom"
 CHI_The_Panmunjom_Architecture_desc: "Convocaremos un nuevo diálogo multilateral en Panmunjom, el sitio del Armisticio y de dos décadas de cumbres fallidas dirigidas por Estados Unidos. Nuestro marco lleva a Seúl y Pyongyang al mismo cuadro bajo nuestra facilitación, comprometiéndose a todas las partes en un proceso gradual de reducción de la tensión respaldado por nuestras garantías diplomáticas. El mundo nos acreditará con la entrega de lo que Washington no pudo."
 CHI_the_party_that_lasts: "El partido que dura"
 CHI_the_party_that_lasts_desc: "Los mecanismos institucionales del Partido, el sistema del Congreso, el Comité Central y el Politburo se reafirman como motores legítimos de gobernanza, diseñados para superar a cualquier líder individual. El Pensamiento Xi Jinping está integrado como el marco operativo para el próximo siglo, pero el sistema que lo lleva adelante es colectivo y duradero. El Partido sobrevivió a la muerte de Mao, la Revolución Cultural y Tiananmen. Su maquinaria está construida para soportar."
 CHI_The_Pivot_Reversed: "El Pivot Invertido"
 CHI_The_Pivot_Reversed_desc: "El pivote de Estados Unidos hacia Asia ha superado los compromisos de Washington y creado una apertura estratégica. Llenaremos el vacío a medida que la credibilidad de Estados Unidos se erosione, posicionandonos como el socio de seguridad más capaz y dispuesto de Seúl."
 CHI_The_PLAN_Expeditionary_Buildup: "PLAN expedicionario Buildup"
 CHI_The_PLAN_Expeditionary_Buildup_desc: "Grupos de huelga de portadores, buques de asalto anfibio tipo 075 y flotas de reposición en curso llevan a la Armada del Ejército Popular de Liberación a plena capacidad operacional de aguas azules. El Mar del Sur de China ya no es una frontera a defender. Es una zona de estadificación desde la que se puede proyectar la fuerza a rango intercontinental."
 CHI_the_poly_compromise: "La composición de la poli"
 CHI_the_poly_compromise_desc: "¿Por qué entregar una fortuna para lucir limpio? Poly Group nació del brazo de tráfico de armas del Estado Mayor, y es sólo el más grande de los imperios que ha construido el ejército. Rechazamos la inmersión de Jiang: las empresas se quedan, el contrabando se queda, el dinero se queda. El PLA será rico antes de que sea reformado, y la lealtad se comprará en lugar de ganar."
 CHI_The_Princeling_Network: "La red Princeling"
 CHI_The_Princeling_Network_desc: "Nuestros servicios de inteligencia penetran en el cuerpo oficial del KPA a través de los hijos de la élite de Pyongyang que fueron educados aquí. Estos principes, formados por sus años en Beijing, son nuestra palanca más confiable dentro del estado norcoreano."
 CHI_the_pterodactyl_generation: "La Generación de Pterodactilo"
 CHI_the_pterodactyl_generation_desc: "El Wing Loong, o Pterodactyl, familia de drones armados le da a la fuerza aérea un cazador barato y persistente para el reconocimiento y la huelga, y una exportación insignia que lleva la energía aérea china en una docena de guerras extranjeras."
 CHI_the_quad_wedge_strategy: "La estrategia Quad Wedge"
 CHI_the_quad_wedge_strategy_desc: "No hay Quad sin Tokio, y no Tokio sin opciones. Les daremos opciones, en silencio, bilateralmente, en las habitaciones a las que no fueron invitados los americanos."
 CHI_the_quiet_dragons: "Los Dragones Silenciosos"
 CHI_the_quiet_dragons_desc: "Noise es la muerte bajo las olas, y nuestros barcos siempre han sido escuchados muy pronto. El submarino de ataque tipo 095 de próxima generación se construye alrededor del silencio, con propulsión de chorro de bomba y un reactor más tranquilo que cierra la brecha en los cazadores americanos. Los dragones silenciosos pueden al fin pasar por las cadenas de la isla y acechar un portador en su propio océano."
 CHI_the_rare_earth_lever: "La Tierra Rara Lever"
 CHI_the_rare_earth_lever_desc: "La mayoría de las tierras raras del mundo fluyen a través de nuestras manos. Cada motor Toyota Prius, cada montaje de aletas F-35, cada altavoz del iPhone. La válvula es nuestra para girar."
 CHI_the_rcep_acceleration: "Aceleración de RCEP"
 CHI_the_rcep_acceleration_desc: "Los americanos salieron de TPP. Los japoneses se quedaron. Se firmará la Alianza Económica Integral Regional, y Tokio lo firmará al lado de Beijing, no Washington."
 CHI_the_renhai_cruiser: "El crucero Renhai"
 CHI_the_renhai_cruiser_desc: "China derriba su primera verdadera nave capital de la era moderna. El tipo 055, que la OTAN clasifica a un crucero, es una nave de guerra robada de diez mil toneladas con más de cien células de misiles, construida para liderar un grupo de portadores y luchar contra cualquier afloat. Ocho son completados por 2022, y con ellos los campos de la marina superan a los combatientes iguales en todo el mundo."
 CHI_The_Roh_Moohyun_Framework: "Renacimiento de la Declaración 10.4"
 CHI_The_Roh_Moohyun_Framework_desc: "Renovaremos el espíritu de la Declaración del 4 de octubre y apoyaremos un marco de compromiso graduado con Corea del Norte. Los proyectos agrícolas conjuntos, el turismo limitado y el comercio transfronterizo controlado pueden llevarse a cabo sin condiciones previas, y seremos los que mantengan abierta esa puerta."
 CHI_The_Sansha_Administrative_Upgrade: "Actualización administrativa de Sansha"
 CHI_The_Sansha_Administrative_Upgrade_desc: "Sansha City, nuestra sede municipal en Woody Island en los Paracels, extenderá ahora su jurisdicción a través de toda la cadena Spratly. El encuadre civil es deliberado: alcaldes, oficinas censales y oficinas meteorológicas proporcionan la cobertura política para lo que es, en sustancia, la incorporación permanente de los territorios de arrecife disputados a nuestro orden administrativo."
 CHI_The_Scarborough_Model: "El modelo Scarborough"
 CHI_The_Scarborough_Model_desc: "El standoff en Scarborough Shoal nos dio un método repetible: un encuentro de buques pesqueros se intensifica hasta la confrontación con los guardacostas, el otro partido se retira bajo presión y se establece una presencia permanente antes de que cualquier tercero pueda intervenir. Ahora aplicaremos este modelo sistemáticamente a cada característica impugnada restante."
 CHI_The_Sea_Within_The_Sea: "El mar dentro del mar"
 CHI_The_Sea_Within_The_Sea_desc: "El Mar del Sur de China está obligado a todas las partes por la Primera Cadena de la Isla, la curación de tierras y arrecifes desde Japón hasta Malasia, y, mediante la presencia militar acumulada, la integración económica y la decisión territorial, se ha incorporado totalmente en nuestro control administrativo. La línea de nueve-dash ya no es una reclamación; es una frontera. Los carriles marítimos que llevan un tercio del comercio mundial pasan ahora por las aguas que gobiernan en la ley y de hecho, con nuestro guardacostas y PLAN manteniendo una patrulla soberana continua desde los Paracels hasta los Spratlys."
 CHI_the_securitate_restructured: "El Securitate Reestructurado"
 CHI_the_securitate_restructured_desc: "Basándose en las innovaciones de Wang Lijun en Chongqing, los servicios de seguridad interna se reorganizan según las líneas de un aparato integral de protección estatal. Las señales de inteligencia, las redes informantes y la coacción legal están integradas bajo mando unificado. Ninguna conspiración contra el estado del pueblo escapará de la detección."
 CHI_the_self_reliant_path: "El camino autosuficiente"
 CHI_the_self_reliant_path_desc: "Cada motor importado es una correa. Elegimos el camino más difícil de autosuficiencia, viertendo recursos en nuestras propias oficinas de diseño y aceptando años de aeronaves inferiores para que la próxima generación no le debe nada a ningún proveedor extranjero. Una fuerza aérea que no puede construir sus propias alas nunca será verdaderamente libre."
 CHI_the_senkaku_crisis: "La crisis de Senkaku"
 CHI_the_senkaku_crisis_desc: "Hace años que probamos las defensas aéreas de Japón y sombríamos a su guardia costera. La siguiente provocación no será deniable. Un cortador de guardacostas no es un buque de guerra, hasta que lo sea."
 CHI_The_Seoul_Gambit: "El Seúl Gambit"
 CHI_The_Seoul_Gambit_desc: "Hacemos una apuesta calculada que una relación más profunda con Seúl puede ofrecer seguridad más duradera que el compromiso indefinido con Pyongyang. Acercarse a Corea del Sur como socio estratégico en lugar de un vecino contencioso es una ruptura con décadas de nuestra política de Corea, y no uno que se haga a la ligera."
 CHI_the_shanghai_succession: "La Sucesión de Shanghai"
 CHI_the_shanghai_succession_desc: "Jiang Zemin transfiere el liderazgo formal a Hu Jintao asegurando que los leales de Shanghai Clique dominan el Comité Permanente de Politburo. Al mantener la presidencia de la Comisión Militar Central, mantiene el máximo apalancamiento sobre los nuevos líderes y cementa el equilibrio de las facciones en favor de la red Princeling. El poder se entrega. No está renunciado."
 CHI_the_shanghai_succession_tt: "El §Y$CHI_factional_balance$§! en el §Y$CHI_16_national_congress_mission$§! decide la sucesión: arriba §Y$CHI_shanghai_clique_leaning$§! cae a §YHu Jintao§!, de otra manera al §YZeng Qinghong§!"
 CHI_the_sharp_blade: "El Sharp Blade"
 CHI_the_sharp_blade_desc: "La próxima guerra puede decidirse en horas, no meses. Elegimos la hoja afilada: fuerzas ligeras, aéreas y especiales que golpean primero y lejos, aprovechando los aeródromos, puertos y capitales antes de que un defensor pueda reaccionar. La velocidad se convierte en nuestro arma más pesada."
 CHI_the_sharp_sword_doctrine: "La Doctrina de Espada Sharp"
 CHI_the_sharp_sword_doctrine_desc: "Stealth no es sólo para los luchadores. El GJ-11 'Sharp Sword', un dron de combate volador, ancla una doctrina de penetrar huelga no tripulada, enviado por delante de la flota tripulada para encontrar y matar las defensas de un enemigo donde ningún piloto necesita ser arriesgado."
 CHI_the_soaring_dragon: "El Dragón del Soaring"
 CHI_the_soaring_dragon_desc: "El WZ-7 'Dragón Soaring', un dron de larga resistencia de alta altitud con alas de unión distintivas, patrulla los enfoques marítimos durante días en fin, alimentando la red de huelga un reloj constante sobre el mar China significa controlar."
 CHI_the_sovremenny_bridge: "El puente Sovremenny"
 CHI_the_sovremenny_bridge_desc: "Hasta que nuestros patios puedan construir los barcos que necesitamos, los compramos. Cuatro destructores Sovremenny del Proyecto 956E y 956EM se compran en Rusia a finales del decenio de 1990, cada uno armado con el supersónico misil anti-ship Moskit construido para matar portadores estadounidenses. Son un puente a lo largo de los años, la potencia de fuego moderna compró mientras la flota nacional todavía está naciendo."
 CHI_The_Spirit_Of_Zheng_He: "El Espíritu de Zheng He"
 CHI_The_Spirit_Of_Zheng_He_desc: "Hace seiscientos años, las flotas de tesoros del Almirante Zheng Salió Nanjing en siete viajes que llegaron al Golfo Pérsico y la costa de África Oriental. Llevaban seda, porcelana y los protocolos de intercambio civilizado, no conquista. La Ruta de la Seda Marítima es el heredero moderno de esa tradición, y nuestro compromiso con Asia Sudoriental se llevará a cabo en su espíritu."
 CHI_the_surface_capital_fleet: "La Flota de Capital Superficie"
 CHI_the_surface_capital_fleet_desc: "El poder que no se puede ver no impresiona, y queremos ser vistos. La flota se construye alrededor del portaaviones y el crucero Tipo 055, en grupos de batalla equilibrados que pueden navegar cualquier océano y dictar términos en cualquier mar. Una gran flota de superficie que muestra la bandera en puertos distantes es la prueba visible de que China ha llegado como un poder marítimo."
 CHI_the_tanker_gap: "Cierra el Tanker Gap"
 CHI_the_tanker_gap_desc: "El rango es la debilidad más antigua de la fuerza aérea. Con muy pocos tanques nuestros luchadores no pueden alejarse de casa, así que ampliamos la flota aérea-refutable para permitir que los paquetes de huelga lleguen a los mares lejanos y permanezcan allí."
 CHI_The_THAAD_Response: "La respuesta de THAAD"
 CHI_The_THAAD_Response_desc: "El despliegue del sistema antimisiles THAAD en Corea del Sur degrada nuestro disuasión nuclear. Responderemos con coacción económica: restringir el turismo, boicotear los productos de entretenimiento coreanos y presionar a las empresas coreanas que operan en nuestro suelo hasta que Seúl reconsidere su bienvenida."
 CHI_the_three_represents: "Las Tres Representaciones"
 CHI_the_three_represents_desc: "La contribución teórica de Jiang Zemin a la doctrina del Partido sostiene que el PCCh debe representar fuerzas productivas avanzadas, cultura avanzada y los intereses más amplios de nuestro pueblo. Al admitir a empresarios y capitalistas privados como miembros del Partido, ampliamos la base social de nuestro gobierno más allá de los trabajadores y campesinos, y el Partido permanece."
 CHI_the_tokyo_communique: "La Comunión de Tokio"
 CHI_the_tokyo_communique_desc: "El comunicado de hoy dirá menos que el texto de 2008 y significará más. Diferir perspectivas sobre la historia es una fórmula diplomática que significa que no volveremos a hablar de ella."
 CHI_The_Treasure_Fleet_Returns: "La Flota del Tesoro devuelve"
 CHI_The_Treasure_Fleet_Returns_desc: "La Iniciativa Franja y la Ruta extiende su componente marítimo en el Asia sudoriental. Las concesiones portuarias, los acuerdos de pesca y las empresas conjuntas de la plataforma de gas se ofrecen a los Estados reclamantes. Cada acuerdo concertado vincula a un socio más estrechamente con la órbita económica china y disminuye el atractivo de la confrontación."
 CHI_the_type_075_yushen: "El tipo 075 Yushen"
 CHI_the_type_075_yushen_desc: "Los marines ganan un buque insignia de punta plana. El tipo 075 Yushen, un barco de asalto de helicópteros cuarenta mil toneladas, lleva una brigada y sus naves sobre el horizonte y los aterriza por aire y mar inmediatamente. Es el corazón de un grupo anfibio construido para tomar y mantener terreno lejos de la costa."
 CHI_the_type_901: "Tipo 901 y la línea de vida de Djibouti"
 CHI_the_type_901_desc: "Una flota de agua azul vive o muere por su tren de suministro. El barco de combate rápido Tipo 901, lo suficientemente grande y rápido como para mantener el ritmo con un grupo portador, permite que la flota permanezca en el mar lejos de casa, y en 2017 China abre su primera base exterior en Djibouti, una línea de vida permanente anclando la marina en el Océano Índico."
 CHI_the_varyag_refit: "El Varyag Refit"
 CHI_the_varyag_refit_desc: "Un casco soviético oxidante se convierte en la semilla de una flota portadora. Traído despojado de Ucrania en 1998 y remolcado a Dalian en 2002, el Varyag sin terminar se reconstruye durante un decenio y se encarga en 2012 como Liaoning. Es una nave de entrenamiento más que un buque de guerra, pero en su cubierta aprende una marina sin tradición portadora, avión a avión, cómo volar desde el mar."
 CHI_the_yasukuni_protest_doctrine: "La Doctrina Protest de Yasukuni"
 CHI_the_yasukuni_protest_doctrine_desc: "Cuando el Primer Ministro de Japón se inclina ante los nombres de criminales de guerra Clase A, no honra a sus antepasados. Está ensayando para la próxima guerra. Nuestro embajador regresará a Beijing hasta nuevo aviso."
 CHI_the_yuan_and_the_shang: "El Yuan y el Shang"
 CHI_the_yuan_and_the_shang_desc: "La fuerza submarina sale de la era diésel. El tipo 039 Yuan, un barco diesel-eléctrico independiente del aire, puede acechar silencio durante semanas en mares cercanos, mientras que el nuclear Tipo 093 Shang da a la flota su primer submarino de ataque creíble capaz de variar lejos de casa. Los cazadores silenciosos se convierten en el borde más afilado de la marina."
 CHI_the_yuzhao_pathfinders: "Los Pathfinders Yuzhao"
 CHI_the_yuzhao_pathfinders_desc: "La proyección de potencia anfibia comienza con un casco y una brigada. El muelle de la plataforma de aterrizaje tipo 071 Yuzhao, diseñado en los años 2000, da a la marina un verdadero barco anfibio que va hacia el océano, y las primeras brigadas marinas dedicadas se levantan para montar en él. Los patíferos de una futura fuerza expedicionaria pusieron al mar."
 CHI_theaterization_of_command: "Teatro Comando del Aire"
 CHI_theaterization_of_command_desc: "Las aeronaves deben responder al teatro, no a una cadena de servicio separada. El mando aéreo está doblado en los cinco comandos del teatro conjunto, de modo que los combatientes, bombarderos y drones luchan bajo el mismo comandante que las fuerzas terrestres y navales, como una campaña más que tres."
 CHI_three_gorges_completion: "Finalización del proyecto de tres golondrinas"
 CHI_three_gorges_completion_desc: "Propuesto por Sun Yat-sen y defendido por Mao Zedong, la presa Tres Gorges en el Yangtze ya está completa. Con 32 turbinas que producen 22,5 GW de capacidad hidroeléctrica, es la central eléctrica más grande del mundo. El proyecto ha desplazado a 1,4 millones de personas y sumergido dos mil sitios arqueológicos, pero los beneficios son reales: control de inundaciones, mejoras de navegación y un aumento decisivo en la producción de energía renovable para China central y occidental."
 CHI_three_noc_overseas: "Los Tres Barriles de Petróleo en el Extranjero"
 CHI_three_noc_overseas_desc: "CNPC, Sinopec y CNOOC son los tres barriles de petróleo a través del cual proyectamos nuestra estrategia Going Out. Los simulacros de CNPC en Sudán a través de la Greater Nile Petroleum Operating Company, adquiere PetroKazajstan y firma un contrato de préstamo por petróleo con Rosneft por valor de 25 mil millones de dólares estadounidenses. Sinopec adquiere Addax Petroleum, asegurando licencias de producción en Angola, Nigeria y la Región del Kurdistán. CNOOC, bloqueado en su oferta para Unocal, tiene éxito en adquirir Nexen Canadá. Se siguen acuerdos similares con PDVSA y Petrobras. Cada adquisición es una longitud de cadena asegurando nuestro suministro de energía."
 CHI_three_red_lines_crackdown: "Financiamiento Inmobiliaria Crackdown"
 CHI_three_red_lines_crackdown_desc: "Los reguladores imponen tres límites de relación dura a los desarrolladores de bienes inmuebles: pasivo-a activos inferiores al 70%, deuda neta-equity inferior al 100% y deuda en efectivo a corto plazo superior al 100 por ciento. Evergrande, con más de 300 mil millones de dólares en pasivo total, viola los tres y colapsa, liquidado por un tribunal de Hong Kong. Más del 70 por ciento de los desarrolladores top-30 entran en la reestructuración. La política aísla el riesgo financiero sistémico del sector bancario al costo de una actividad de construcción marcadamente reducida y los ingresos del gobierno local. El precio es alto, pero la alternativa era contagiosa que no podíamos contener."
 CHI_three_represents_codified: "Tres Representaciones Codificadas"
 CHI_three_represents_codified_desc: "Los empresarios privados son admitidos en el Partido. La enmienda de Shanghai encuentra su lugar en la constitución. El legado de Jiang está sellado por escrito."
 CHI_tiangong_station: "Estación Espacial Tiangong"
 CHI_tiangong_station_desc: "El módulo central Tianhe de la estación espacial Tiangong fue lanzado en abril de 2021, seguido por las cabañas científicas Wentian y Mengtian en 2022. China opera actualmente un laboratorio orbital tripulado permanente totalmente independiente de la Estación Espacial Internacional, que acoge a tripulaciones residentes de seis meses y un programa en expansión de investigación sobre microgravedad."
 CHI_tianwen_interplanetary: "La sonda interplanetaria Tianwen"
 CHI_tianwen_interplanetary_desc: "Tianwen-1 lanzó en julio de 2020 y logró órbita, entrada atmosférica y aterrizaje superficial en una sola misión, entregando el rover Zhurong a la Planicia Utopía en mayo de 2021. China se convirtió en sólo el segundo país para operar con éxito un rover en Marte. La misión demostró la navegación en el espacio profundo, la evitación autónoma de los peligros y el relé de comunicaciones de alta ganancia, todos los precursores esenciales para las misiones tripuladas más allá del espacio cislunar."
 CHI_Tianxia_Realized: "Todos bajo el cielo"
 CHI_Tianxia_Realized_desc: "En Davos, articulamos una visión de un orden mundial abierto e inclusivo anclado en las instituciones multilaterales y la prosperidad compartida: una Comunidad del Futuro Compartido para la Humanidad. Esa visión se ha realizado ahora no mediante la coacción sino a través de la gravedad económica acumulada. La Iniciativa para el Desarrollo Mundial, el Banco Asiático de Inversiones de Infraestructura y la cooperación Franja y la Ruta de alta calidad han convertido a la comunidad internacional en un marco que reconoce nuestra centralidad por interés. El mundo que ahora lideramos eligió seguir."
 CHI_tiger_and_flies: "Tigres y moscas"
 CHI_tiger_and_flies_desc: "La campaña anticorrupción se dirige tanto a tigres superiores como a moscas menores en todo el aparato del Partido. Zhou Yongkang, ex miembro del Comité Permanente de Politburo, ha recibido una sentencia de cadena perpetua; Bo Xilai cayó ante él. Actualmente se han investigado y sancionado a más de dos millones de funcionarios. La campaña es simultáneamente una auténtica reforma de la gobernanza y un medio para desmantelar redes políticas rivales, y no podemos permitirnos detenerla ahora."
 CHI_Tonga_Tuna_Concession: "Concesiones Pesqueras del Pacífico"
 CHI_Tonga_Tuna_Concession_desc: "Acuerdos de acceso exclusivo con Tonga, Vanuatu y Fiji otorgan derechos preferenciales a nuestras flotas pesqueras de aguas distantes en vastas zonas económicas exclusivas del Pacífico central y occidental. A cambio, financiamos mejoras portuarias, instalaciones de refrigeración y capacidad de vigilancia marítima que vincula a los gobiernos receptores con la dependencia de infraestructura a largo plazo. Los acuerdos de pesca son el borde económico principal de nuestro compromiso más amplio del Pacífico."
 CHI_train_as_you_fight: "Entrenar como luchas"
 CHI_train_as_you_fight_desc: "El taladro desfile gana desfiles, no guerras. La formación se reconstruye en condiciones de combate realistas, con ejercicios de juego libre y una fuerza opuesta dedicada en la base de entrenamiento Zhurihe que castiga las victorias escritas del pasado."
 CHI_train_generals: "Capacitar a los generales"
 CHI_train_generals_desc: "Las reformas en papel mueren sin los comandantes que las entienden. Nuestras academias retool para producir oficiales fluidos en la guerra conjunta y el comando de la información-edad, despojando a los nominados políticos que no pueden leer una batalla moderna."
 CHI_TwentyFive_Year_Iran_Accord: "25 años China-Iran Partnership"
 CHI_TwentyFive_Year_Iran_Accord_desc: "Nuestra Alianza Estratégica Integral nos compromete a 400 mil millones de dólares estadounidenses de inversión en infraestructura, energía y fabricación iraníes durante 25 años a cambio de suministros de petróleo descartados. El acuerdo da a Teherán una línea de vida bajo sanciones estadounidenses y nos da hidrocarburos descartados y una posición avanzada en el Golfo Pérsico. Washington, Tel Aviv y las monarquías del Golfo consideran que el acuerdo es una amenaza directa para su cálculo de seguridad regional. Déjenlos."
 CHI_two_centeraries: "El 19.º Congreso del Partido"
 CHI_two_centeraries_desc: "El 19.º Congreso Nacional inscribe 'Xi Jinping Thought on Socialism with Chinese Characteristics for a New Era' en la constitución del Partido mientras Xi todavía está vivo, una distinción última sostenida por Mao Zedong. Los Dos Objetivos Centenarios enmarcan nuestro horizonte: una sociedad moderadamente próspera para 2021 y una nación socialista plenamente desarrollada para 2049. La trayectoria del Estado durante las próximas tres décadas se establece ahora, y los recursos de cada institución deben ser dirigidos en consecuencia."
 CHI_two_establishments: "Los dos establecimientos"
 CHI_two_establishments_desc: "La doctrina de «Dos Establecimientos» afirma la posición central del camarada Xi Jinping dentro del Comité Central del Partido y el papel rector del Pensamiento Xi Jinping en la vida del Partido. El liderazgo colectivo no es abolido sino reorganizado: el Comité Permanente delibera, pero la dirección está fijada por uno. El Partido se mueve como un solo cuerpo, y ese cuerpo tiene un centro."
 CHI_two_ocean_fleet: "La Flota de Dos Oceanos"
 CHI_two_ocean_fleet_desc: "Ni el fondo ni la cubierta es suficiente para lo que China ahora pretende. Nos fusionamos con la fuerza submarina silenciosa y la soberbia flota de superficie en una sola marina capaz de luchar a través de dos océanos a la vez, el Pacífico y el indio, manteniendo los mares cercanos mientras que abarcan los más lejanos. Desde el guarda costero Liu Huaqing heredado, surge una verdadera energía de agua azul, segunda a ninguna, y cerrando."
 CHI_two_reaffirmations: "Dos afirmaciones"
 CHI_two_reaffirmations_desc: "El partido reafirma dos compromisos fundamentales: la lealtad al camino socialista definido por el pensamiento Mao Zedong, y la primacía de la línea de masas como el método correcto del liderazgo partidario. No son eslóganes. Son garantías estructurales contra la deriva derechista que ha permitido a la desigualdad y la corrupción hundir la revolución desde dentro."
 CHI_type_15_light_tank: "El tanque ligero Tipo 15"
 CHI_type_15_light_tank_desc: "La armadura pesada no puede respirar en la meseta tibetana o cruzar los puentes del sur. El ZTQ-15, un tanque ligero de treinta toneladas con un potente caÃ±Ã³n de 105 mm, da a las brigadas rápidas armadura real donde un Tipo 99 no puede ir, y ahora mira hacia la India a lo largo de la frontera Himalaya."
 CHI_type_95_adoption: "Adoptar el tipo 95"
 CHI_type_95_adoption_desc: "El QBZ-95, un bullpup de 5.8mm adoptado a finales del decenio de 1990, sustituye al tipo 81 envejecido y estandariza la infantería en un cartucho casero. Sus quirks son reales, pero pone un rifle moderno e indígena en las manos de cada soldado."
 CHI_ultra_low_emission: "Normas de Emisión Ultra-Low"
 CHI_ultra_low_emission_desc: "El Ministerio de Ecología y Medio Ambiente y el MIIT han emitido normas que exigen plantas sinter, instalaciones de cocción y molinos de acero para cumplir los umbrales de emisión más estrictos que las normas europeas. Más del 80 por ciento de los grandes siderúrgicos integrados están completando la adaptación. La reforma sustituye la práctica de cierres generales en torno a acontecimientos políticos -- azul APEC, azul del desfile -- con una infraestructura permanente al aire libre. Ya no deberíamos estar limpiando el cielo para ocasiones. Deberíamos mantenerlo limpio."
 CHI_underground_great_wall: "La Gran Muralla subterránea"
 CHI_underground_great_wall_desc: "Debajo de las montañas excavamos la Gran Muralla Subterránea, miles de kilómetros de túneles endurecidos que esconden y protegen nuestras fuerzas y misiles. Lo que no se puede encontrar no puede ser destruido, y un arsenal enterrado garantiza que cualquier primera huelga es contestada."
 CHI_undersea_supremacy: "Supremacía submarina"
 CHI_undersea_supremacy_desc: "Vamos a gobernar lo profundo en lugar de la superficie. La prioridad de la flota se convierte en el submarino: cazadores nucleares para matar portadores, boomers para mantener al mundo en riesgo, y un muro de barcos tranquilos que convierten la cadena de Primera Isla en una trampa. Dejemos que los rivales desfilen sus grandes flotas por encima; poseeremos el agua debajo de ellos y les negaremos el mar sin nunca mostrar un mástil."
 CHI_Unification_Ultimatum: "Ultimátum de unificación de la península"
 CHI_Unification_Ultimatum_desc: "Con Beijing y Washington alineados, ha llegado el momento de presentar a Pyongyang con una opción: aceptar la reunificación pacífica bajo Seúl o enfrentar el peso combinado de los militares chinos, estadounidenses y surcoreanos. El ultimátum termina la pregunta coreana de una manera u otra."
 CHI_Vision_2030_Partnership: "Visión 2030 Investment Partnership"
 CHI_Vision_2030_Partnership_desc: "La agenda de diversificación Visión 2030 de Arabia Saudita y nuestro apetito por el capital del Golfo y los trabajos contractuales convergen en una asociación espeluznante que abarca energía limpia, infraestructura turística y fabricación avanzada. Nuestras empresas ganan importantes contratos de proyectos NEOM y el Mar Rojo mientras aseguramos la oferta de crudo preferencial y una cuota de liquidación de yuan en aumento. El acuerdo da a Riyadh la opcionalidad estratégica sin romper formalmente su dependencia de seguridad en Washington."
 CHI_wanhua_strategic_materials: "Lista de Materiales Estratégicos"
 CHI_wanhua_strategic_materials_desc: "El MIIT ha publicado una lista de aproximadamente 130 materiales químicos en los que seguimos dependiendo de las importaciones. Los fotoresistas litográficos, película poliimida, fibra de carbono de alta resistencia T800 y arriba, y los poliuretanos MDI y TDI son uno de los más críticos. Wanhua Chemical en Yantai, que invierte la tecnología MDI de Mitsui y adquirió el BorsodChem de Hungría, ha roto el Bayer, BASF y Huntsman poliuretano oligopolio. Weihai Guangwei Composites, Jilin Carbon Valley y Sinopec Shanghai Petrochemical construyen la capacidad de fibra de carbono para las cuchillas de turbina eólica y compuestos aeroespaciales. Cada sustitución reduce nuestra exposición estructural a controles de exportación extranjeros."
 CHI_warlord_temptation: "La Temptación de Warlord"
 CHI_warlord_temptation_desc: "Un ejército que sirve dinero puede ser tentado a servirse. Con regiones, ingresos y tropas leales en la mano, los grandes comandantes se dirigen hacia el peligro chino más antiguo: una fuerza que obedece a sus generales antes del centro, y una república que retrocede hacia la era de caudillos."
 CHI_water_security_initiative: "Iniciativa nacional de seguridad del agua"
 CHI_water_security_initiative_desc: "Desde 2002 se ha abordado el desequilibrio de agua norte-sur en China a través del Proyecto de Transferencia de Aguas Sur-Norte, el mayor esquema de desviación entre cuencas jamás construido, canalizando el agua desde la captación de Yangtze hasta la cuenca del río Amarillo y la región capital. Una campaña nacional de seguridad hídrica se expande sobre esta base, acoplando infraestructuras a gran escala con proyectos de conservación a nivel provincial dirigidos a las zonas más afectadas por el agua del norte. Completar lo suficiente de estos proyectos aliviará progresivamente la escasez que pesa sobre la economía nacional."
 CHI_weqi_pipeline_lines: "La tubería de gas occidental-este"
 CHI_weqi_pipeline_lines_desc: "El Proyecto de Transmisión del Gas Oeste-Este vincula la Cuenca Tarim en Xinjiang a Shanghai a través de una línea de troncos de 4.000 kilómetros, con una segunda línea que transporta gas turcomano al este por Khorgos y un tercio por vía Kirguistán. El oleoducto Power of Siberia, acordado con Vladimir Putin bajo un contrato anual de 30 años de 38 billones de metros cúbicos, ahora entrega gas desde Heilongjiang directamente a nuestra red este. CNPC y PetroChina gestionan la construcción y operación en todo el mundo. Ningún país que controle esta infraestructura de oleoductos puede ser estrangulado por un embargo energético."
 CHI_west_east_gas_pipeline: "Gasoducto del oeste-este"
 CHI_west_east_gas_pipeline_desc: "La tubería de gas oeste-este se encuentra a 4.000 kilómetros de la cuenca del Tarim, en Xinjiang, en Shanghai, terminada en 2004. Suministra gas natural al este industrial de China, reduciendo la dependencia del carbón y acelerando la comercialización de las reservas de hidrocarburos de Xinjiang."
 CHI_western_development_strategy: "Estrategia de Desarrollo Occidental"
 CHI_western_development_strategy_desc: "El programa Xibu Da Kaifa dirige la inversión preferencial, los incentivos fiscales y la construcción de infraestructura acelerada a doce provincias occidentales y regiones autónomas. Estamos cerrando la brecha costera-interior y profundizando nuestra integración con Asia Central y Sur, llevando la periferia a nuestro núcleo económico antes de que los rivales puedan llenar el espacio."
 CHI_western_energy_strategy: "Desarrollo de la energía occidental"
 CHI_western_energy_strategy_desc: "Las provincias occidentales de China poseen las mayores reservas de carbón, gas natural e hidroeléctrica del país. Una estrategia coordinada de desarrollo vincula la extracción a las tierras industriales costeras, reduciendo la dependencia de las importaciones de energía y ampliando la actividad económica en el interior."
 CHI_western_industrial_drive: "Manejo del desarrollo industrial occidental"
 CHI_western_industrial_drive_desc: "El Consejo de Estado ha aprobado 169 parques industriales provinciales para la elevación a las Zonas Nacionales de Desarrollo Económico y Tecnológico, con la mayoría dirigida a provincias occidentales subdesarrolladas. La inversión prioritaria en Yunnan, Guizhou y Sichuan Occidental está empezando a cerrar la brecha de ingresos con la costa y establecer las condiciones logísticas previas para la fabricación interior a gran escala. El oeste ha esperado lo suficiente."
 CHI_western_institutional_engagement: "Participación institucional occidental"
 CHI_western_institutional_engagement_desc: "Los campeones Zeng Qinghong profundizaron el compromiso con las instituciones multilaterales dirigidas por Occidente como la mejor manera de asegurar nuestra posición en el orden internacional, mientras que las reglas todavía están siendo establecidas. Promovemos la ampliación de la cuota del FMI, adoptamos normas internacionales de presentación de informes financieros en nuestras empresas estatales y aumentamos nuestra representación en las juntas del Banco Mundial. Mejor dar forma a la arquitectura desde dentro que estar fuera de ella."
 CHI_western_pipeline_corridor: "Gasoducto del oeste-este"
 CHI_western_pipeline_corridor_desc: "La tubería de gas oeste-este recorre 4.000 kilómetros desde la cuenca del Tarim en Xinjiang a través de Gansu, Shaanxi y el Delta del Yangtze a Shanghai. Una vez completado, desplazará carbón en la industria del Delta de Yangtze y reducirá la contaminación de partículas ahogando nuestras ciudades costeras más ricas, uniendo los recursos del oeste al crecimiento del este."
 CHI_Win_Win_Cooperation: "Comunidad de Futuros Compartidos"
 CHI_Win_Win_Cooperation_desc: "Después de aumentar las críticas internacionales sobre la financiación de la lucha contra la deuda, reformamos nuestras condiciones crediticias, introduciendo tasas concesionales, requisitos laborales locales y evaluaciones de sostenibilidad de la deuda. El encuadre «ganado» repone el Franja y la Ruta como un vehículo para el desarrollo mutuo en lugar de apalancamiento estratégico, y los críticos encuentran sus argumentos más difíciles de sostener."
 CHI_Wolf_Warrior_Diplomacy: "Diplomacia de Wolf Warrior"
 CHI_Wolf_Warrior_Diplomacy_desc: "Adoptaremos una postura diplomática firme y de confrontación. Nuestros diplomáticos defenderán agresivamente nuestros intereses y desafiarán narrativas occidentales dondequiera que los encuentren. El objetivo es claro: reemplazar a los Estados Unidos como el poder mundial dominante."
 CHI_wolf_warrior_doctrine: "Diplomacia de Wolf Warrior"
 CHI_wolf_warrior_doctrine_desc: "Nuestro Ministerio de Relaciones Exteriores ha surgido un nuevo estilo de diplomacia asertiva. Nuestros embajadores atacan públicamente a los críticos extranjeros; los voceros del Estado responden a la censura con acusaciones de hipocresía y mala fe. El enfoque abandona la doctrina de Deng Xiaoping de ocultar fuerza y tiempo de pujar en favor de la confrontación directa. Ya no nos disculpamos, y el mundo está empezando a entender lo que eso significa."
 CHI_ws15_bottleneck_solve: "Romper el Bottleneck WS-15"
 CHI_ws15_bottleneck_solve_desc: "El motor de chorro es la pared que cada luchador chino ha roto, forzando la dependencia en las turbinas rusas para nuestros mejores marcos aéreos. El turbofán WS-15 está destinado a poner fin a esa dependencia y dar al J-20 el empuje supercruise que fue diseñado alrededor. Dominar la hoja de turbina de un solo cristal es el último metro de la escalada."
 CHI_wto_accession_drive: "Adhesión de la OMC"
 CHI_wto_accession_drive_desc: "Después de quince años de negociaciones, estamos a punto de pertenecer oficialmente a la Organización Mundial del Comercio. La adhesión bloqueará nuestras reformas de liberalización comercial, abrirá mercados extranjeros a nuestras exportaciones y acelerará la transferencia de tecnología industrial en nuestras manos."
 CHI_wto_commercial_bank_reform: "Reforma de la Ley del Banco Comercial"
 CHI_wto_commercial_bank_reform_desc: "Nuestra adhesión a la OMC nos compromete a abrir el sector financiero a bancos extranjeros, y el Primer Ministro Zhu Rongji ha iniciado una reestructuración de tres pasos antes de que llegue ese plazo. Las empresas de gestión de activos absorben cientos de miles de millones en préstamos que no funcionan; Central Huijin Investment inyecta capital utilizando reservas de divisas; los Grandes Cuatro Bancos enumeran intercambios en el extranjero para imponer disciplina del mercado. La revisión de la Ley del Banco Comercial transforma a los Cuatro Grandes de los vehículos de crédito político en instituciones comerciales formales, una distinción que importará cuando los bancos extranjeros lleguen a competir."
 CHI_wto_implementation: "Aplicación de la OMC"
 CHI_wto_implementation_desc: "Nuestra adhesión a la OMC nos comprometió a un calendario plurianual de reducciones arancelarias, reformas de propiedad intelectual, apertura del sector de los servicios y eliminación de privilegios comerciales estatales. La aplicación fue desigual y con frecuencia impugnada por los asociados comerciales del Órgano de Solución de Controversias, pero el proceso nos ha integrado profundamente en las cadenas mundiales de suministro, y esa integración es un arma tanto como una obligación."
 CHI_wto_implementation_tt: "Si completamos §Y$CHI_wto_accession_drive$§!, el bono será mejor y permanente "
 CHI_wuhan_automotive_hub: "Centro automotriz Wuhan"
 CHI_wuhan_automotive_hub_desc: "Dongfeng Motor Corporation, con sede en Wuhan, amplía sus operaciones conjuntas con Peugeot-Citroen, Nissan y Honda. Wuhan se convierte en la capital automotriz de China central, anclando un grupo de proveedores de componentes y empresas logísticas a lo largo del Yangtze."
 CHI_xi_jinping_thought_enshrined: "Pensamiento Xi Jinping Enshrined"
 CHI_xi_jinping_thought_enshrined_desc: "El Pensamiento Xi Jinping se eleva de la orientación normativa a la doctrina constitucional, estudiada obligatoriamente en universidades, academias militares y escuelas del Partido en todo el país. La aplicación Xuexi Qiangguo está instalada en cientos de millones de teléfonos y supervisada para el compromiso diario. El disenso ya no es simplemente poco bienvenido; ahora es oficialmente una desviación de la verdad establecida. La arquitectura ideológica del estado y un solo nombre ya no son separables."
 CHI_xinjiang_industrial_zones: "Desarrollo industrial Xinjiang"
 CHI_xinjiang_industrial_zones_desc: "Zonas industriales especiales en Urumqi y la cuenca del Tarim atraen la migración de Han, las industrias procesadoras y la inversión de extracción de recursos. Las zonas están diseñadas para anclar la economía de Xinjiang a la base industrial oriental y reducir su dependencia de la agricultura tradicional."
 CHI_y20_strategic_lift_program: "El programa de elevación estratégica Y-20"
 CHI_y20_strategic_lift_program_desc: "Un gran poder debe ser capaz de moverse. El Y-20 'Kunpeng', un pesado transporte de jets en servicio desde 2016, finalmente da a China el transporte aéreo para desplegar tropas, armadura y ayuda en todos los continentes, y sus variantes de tanque y comando multiplican el alcance de toda la fuerza aérea."
 CHI_Yangtze_confederation: "Confederación económica de Yangtze"
 CHI_Yangtze_confederation_desc: "La cuenca del río Yangtze, desde Chongqing a través de Hubei y Hunan hasta la boca del río en Shanghai, contiene el interior industrial de China. Una confederación económica formal de estas provincias bajo planificación coordinada eliminará la inversión redundante, integrará las cadenas de suministro y proyectará el Modelo Chongqing en todo el corredor más productivo de la nación."
 CHI_yangtze_delta_integration: "Integración del Delta de Yangtze"
 CHI_yangtze_delta_integration_desc: "La inversión estatal coordinada en Shanghai, Jiangsu y Zhejiang profundiza el Delta del Río Yangtze como nuestro principal corredor de fabricación y exportación. La concentración de capital extranjero y mano de obra calificada aquí anclará el crecimiento para la próxima década."
 CHI_yangtze_logistics_corridor: "Corredor Logístico del Río Yangtze"
 CHI_yangtze_logistics_corridor_desc: "El río Yangtze maneja más carga que cualquier otra vía de navegación interior del mundo. La inversión en infraestructura portuaria, mejoras de navegación y terminales intermodales integra el río en cadenas nacionales de suministro, conectando Sichuan a Shanghai con una fracción de los costos de transporte por carretera."
 CHI_yj12_standoff_family: "La familia YJ-12 Standoff"
 CHI_yj12_standoff_family_desc: "El YJ-12 le da a nuestro avión un misil anti-ship supersónico, que se cierra demasiado rápido para que la mayoría de las defensas respondan. Slung bajo bombarderos y combatientes, pone en riesgo cada nave de guerra a cientos de kilómetros de la costa china."
 CHI_youth_league_pipeline: "La Liga Juvenil"
 CHI_youth_league_pipeline_desc: "La Liga Juvenil Comunista es el grupo de talentos primarios para la facción de Hu Jintao. Los alumnos del CYL ocupan la mayoría de las secretarías provinciales y dominan los puestos centrales de nivel medio, formando una red nacional de funcionarios vinculados por la experiencia organizativa compartida. Aquellos que suben a través de sus filas deben su avance al mismo sistema."
 CHI_yuan_internationalisation: "Yuan Internationalisation"
 CHI_yuan_internationalisation_desc: "La crisis financiera global expuso la fragilidad del dólar y nos dio nuestra apertura. Acuerdos bilaterales de intercambio de divisas con decenas de bancos centrales, centros de compensación de yuan offshore en Hong Kong y Singapur, y un mercado de bonos dim-sum han dado a nuestro renminbi su primera importante circulación internacional. La prima de reserva del dólar no sobrevivirá indefinidamente."
 CHI_yuanhua_model: "El modelo Yuanhua"
 CHI_yuanhua_model_desc: "Lai Changxing mostró cómo se hace. De Xiamen su imperio Yuanhua traicionó unos diez mil millones de dólares en petróleo, coches y cigarrillos a través del decenio de 1990, y cada vez que las costumbres cerradas en un poderoso oficial aparecieron para ondearlos. Hacemos de su acuerdo un sistema: los escudos militares el contrabandista, y el contrabandista paga al ejército."
 CHI_yuzhao_hull_coral_brigades: "Los Yuzhao Hull y las Brigadas del Coral"
 CHI_yuzhao_hull_coral_brigades_desc: "La ambición anfibia se convierte de la patinadora a la flota. El tipo 071 entra en producción en serie, y el cuerpo marino se hincha de dos brigadas a seis, entrenado para los arrecifes disputados e islas del Mar del Sur de China. Las brigadas hull y corales crecen juntas en una fuerza que puede apoderarse de una costa."
 CHI_zb108_wheeled_family: "La familia tipo 08 Rueda"
 CHI_zb108_wheeled_family_desc: "La familia 8x8 Tipo 08, desde portador de infantería hasta arma de asalto a ambulancia, da a las brigadas medias un solo chasis con ruedas que es rápido en caminos y barato para correr, el núcleo móvil de las fuerzas de despliegue rápido de China."
 CHI_zbd04_apex_ifv: "El ZBD-04A Apex IFV"
 CHI_zbd04_apex_ifv_desc: "El ZBD-04A es el principal vehículo de combate de infantería rastreado del ejército, llevando un arma de 100 mm, un cañón de 30mm y un equipo completo bajo armadura. Es la columna vertebral de las fuertes brigadas mecanizadas y el socio del Tipo 99 en la línea China-India."
 CHI_zbd_mechanisation: "ZBD Mechanisation"
 CHI_zbd_mechanisation_desc: "La infantería debe mantener el ritmo con la armadura. La familia de vehículos ZBD rastreada lleva a los rifles hacia adelante bajo armadura y lucha junto con los tanques, completando la mecanización de las grandes brigadas."
 CHI_zeng_qinghong_reign: "La era Zeng Qinghong"
 CHI_zeng_qinghong_reign_desc: "Zeng Qinghong, el principal estratega de la camarilla de Shanghai, sirve como vicepresidente y jefe de la Escuela Central del Partido. Su control sobre el Departamento de Organización y la Secretaría Central le da una influencia decisiva sobre los nombramientos de personal en todos los niveles del aparato del Estado-partido. Los que coloca, es el dueño."
 CHI_zero_hour: "Hora cero"
 CHI_zero_hour_desc: "Durante años el ejército ha entrenado, reequipado y esperado, y la hora ha llegado para poner todo esto a utilizar. Nuestra infantería avanzará en números que ninguna línea defensiva puede absorber, nuestras columnas blindadas en formaciones demasiado profundas para ser giradas, mientras las fuerzas estratégicas de cohete esperan en sus silos como el argumento que pretendemos nunca ser forzados a hacer. A partir de esta hora el Ejército Popular de Liberación deja de prepararse para la próxima guerra y comienza a esperarla, cada comando que responde por fin a una sola voluntad."
 CHI_ztz96_mainstreaming: "Incorporación del tipo 96"
 CHI_ztz96_mainstreaming_desc: "No todas las brigadas necesitan el costoso Tipo 99. El ZTZ-96 más barato y ligero se produce a granel y se actualiza constantemente a la 96A y 96B, convirtiéndose en el tanque de caballo de trabajo que llena el cuerpo de la fuerza blindada."
 CHI_ztz99_rollout: "Enrollar el tipo 99"
 CHI_ztz99_rollout_desc: "El ZTZ-99 se convierte en la punta de lanza de las grandes brigadas, un tanque de batalla principal de tercera generación con armadura compuesta, una pistola de 125 mm y una suite de defensa láser. Es el primer tanque chino construido para cumplir con lo mejor de Occidente y Rusia en igualdad de condiciones."
 CHI_ztz99a_apex: "Tipo 99A Apex"
 CHI_ztz99a_apex_desc: "El ZTZ-99A, a partir de 2011, es el pináculo de la línea: armadura más pesada, un motor alzado, una vista cazador-maestirador y un sistema completo de gestión de batalla que lo convierte en un nodo en la red de brigadas. Es el puño más pesado que puede lanzar el ejército."
 arctic_observer_status: "Otorgamiento de la condición de observador Ártico"
 arctic_observer_status_desc: "Nuestra sede en el Consejo Ártico y nuestra infraestructura Polar Silk Road abren nuevos carriles de transporte y fronteras de recursos en el norte alto."
 CHI_610_directive_active: "610 Northeast Directive"
 CHI_610_directive_active_desc: "El Comando Nororiental del PCCh ha activado protocolos de movilización de emergencia. Se refuerzan las fuerzas de seguridad a lo largo del río Yalu, y las autoridades provinciales operan bajo mayores poderes de emergencia."
 CHI_aiib_dividend_member: "Miembro con dividendos del AIIB"
 CHI_aiib_dividend_member_desc: "La membresía fundadora del Banco Asiático de Inversiones de Infraestructura ofrece rendimientos constantes. Los pagos de inversiones y los términos comerciales preferenciales con proyectos financiados por China fortalecen nuestro balance."
 CHI_anti_corruption_purge: "Anti-Corruption Purge"
 CHI_anti_corruption_purge_desc: "La Comisión Central para la Inspección de Disciplina procesa miles de casos anualmente. El injerto en la contratación, construcción y gestión de empresas estatales está expuesto y penalizado. Los funcionarios que habían extraído alquiler de cada contrato encuentran que el cálculo político ha cambiado. El rendimiento por función estatal aumenta a medida que las redes de patrocinio se desmantelan y reemplazan con responsabilidad directa."
 CHI_anti_terror_crackdown_idea: "Ataque contra el terrorismo"
 CHI_anti_terror_crackdown_idea_desc: "Los servicios de seguridad están llevando a cabo una operación nacional contra las redes terroristas. La capacidad de detección es elevada mientras que el ancho de banda político es absorbido por la represión."
 CHI_army_reorganisation_disruption_idea: "Reorganización del Ejército"
 CHI_army_reorganisation_disruption_idea_desc: "Los trece ejércitos de grupo son renumerados y reconstruidos alrededor de brigadas de brazos combinados. Mientras el resurgimiento está en marcha, la organización y el poder ofensivo sufren y el entrenamiento retrocede. Una vez que la nueva estructura se asienta, la fuerza de tierra emerge más inclinada y más capaz que antes."
 CHI_asian_century_concord_idea: "La Concordia del Siglo Asiático"
 CHI_asian_century_concord_idea_desc: "Beijing y Nueva Delhi han acordado coordinar los asuntos regionales y globales, enmarcando el siglo XXI como Asia para formar juntos."
 CHI_AUS_pacific_deterrence: "Aumento de la disuasión del Pacífico"
 CHI_AUS_pacific_deterrence_desc: "La presión baja china en el Pacífico Sur ha forzado una expansión urgente del alcance de la Armada Australiana Real. Nuevos sensores, inteligencia más aguda y activos anfibios preparados están listos."
 CHI_ban_strategic_partnership: "Alianza Estratégica con Beijing"
 CHI_ban_strategic_partnership_desc: "Bangladesh alinea su postura de política exterior con China en diversos foros multilaterales."
 CHI_banking_modernised_idea: "Sector bancario recapitalizado"
 CHI_banking_modernised_idea_desc: "Los bancos estatales han sido limpiados de préstamos no conformes y enumerados con accionistas minoritarios extranjeros en el intercambio de Hong Kong. Las normas internacionales de contabilidad, la auditoría externa y la disciplina del mercado mejoran la eficiencia y credibilidad del sector."
 CHI_beidou_global_constellation: "Constelación global Beidou"
 CHI_beidou_global_constellation_desc: "Con estaciones terrestres desplegadas en toda América Latina, la red satelital Beidou proporciona ahora una cobertura global amplia. Las operaciones navales, el reconocimiento y la contrainteligencia se benefician de la precisión y el alcance."
 CHI_beijing_communique_guarantor: "Garante de la Comunión de Beijing"
 CHI_beijing_communique_guarantor_desc: "El papel de China en la intermediación de la paz entre dos rivales regionales ha mejorado su posición como un poder responsable. El capital diplomático fluye libremente y las relaciones son más fáciles de mantener."
 CHI_blue_national_soil: "Tierra nacional azul"
 CHI_blue_national_soil_desc: "La doctrina oficial del PRC que designa el espacio marino dentro de la línea de nueve días como «tierra nacional azul»: territorio marítimo tan inalienable como cualquier provincia en tierra. El encuadre hace que la concesión sea políticamente imposible y redefine cualquier presencia extranjera como transgresión."
 CHI_blue_national_soil_militarised: "Azul Suelo Nacional Militarizado"
 CHI_blue_national_soil_militarised_desc: "Lo que comenzó como doctrina administrativa se ha convertido en una postura operacional. Los activos de PLAN y guardacostas ahora imponen activamente la reivindicación del suelo nacional azul, tratando las incursiones de buques extranjeros como violaciones del derecho interno chino."
 CHI_bo_ideological_consolidation: "Consolidación ideológica"
 CHI_bo_ideological_consolidation_desc: "Una campaña de aclaración ideológica refuerza los compromisos socialistas del partido y contraviene la deriva derechista. Las sesiones de estudio, las reuniones de rectificación y los programas educativos revisados incrustaron las dos reafirmaciones en todo el aparato estatal."
 CHI_bri_forum_momentum: "Franja y la Ruta ímpetu del foro"
 CHI_bri_forum_momentum_desc: "El Foro trienal Franja y la Ruta en Beijing ha reafirmado el compromiso de China con la globalización impulsada por la infraestructura. Las delegaciones extranjeras salen con nuevos compromisos y nuestra diplomacia económica cosecha un dividendo plurianual."
 CHI_bri_industrial_zones_tier_1_idea: "Zonas económicas especiales I"
 CHI_bri_industrial_zones_tier_1_idea_desc: "Zonas económicas especiales en el extranjero, construidas a una plantilla china, extienden nuestra base de fabricación más allá de nuestras fronteras."
 CHI_bri_industrial_zones_tier_2_idea: "Zonas económicas especiales II"
 CHI_bri_industrial_zones_tier_2_idea_desc: "Las zonas de ultramar han madurado en parques industriales de trabajo, y los conocimientos especializados en la construcción se remontan a programas nacionales de construcción."
 CHI_bri_industrial_zones_tier_3_idea: "Zonas económicas especiales III"
 CHI_bri_industrial_zones_tier_3_idea_desc: "Una red de parques industriales gestionados por China ancla las economías asociadas a nuestras cadenas de suministro y nuestra industria de la construcción."
 CHI_bri_mines_tier_1_idea: "Concesiones de recursos I"
 CHI_bri_mines_tier_1_idea_desc: "Concesiones mineras aseguradas a través de la provisión de alimentos alimentados por el Estado asociado de nuevo en la industria china."
 CHI_bri_mines_tier_2_idea: "Concesiones de recursos II"
 CHI_bri_mines_tier_2_idea_desc: "La cartera de concesiones se ha ampliado en varios sectores extractivos, profundizando la base de recursos disponible para nuestra economía."
 CHI_bri_mines_tier_3_idea: "Concesiones de recursos III"
 CHI_bri_mines_tier_3_idea_desc: "Las empresas chinas tienen estacas de control en todo el sector extractivo asociado, y el excedente más allá de nuestras propias necesidades se vende a una prima."
 CHI_bri_pipelines_tier_1_idea: "Energía Arteries I"
 CHI_bri_pipelines_tier_1_idea_desc: "Los oleoductos de estado asociado que alimentan refinerías chinas reducen nuestra exposición a chokepoints de energía marina."
 CHI_bri_pipelines_tier_2_idea: "Energía Arterias II"
 CHI_bri_pipelines_tier_2_idea_desc: "Ampliación de la capacidad del oleoducto y las granjas asociadas nos permiten a ambos dibujar más combustible y mantener más de él en reserva."
 CHI_bri_pipelines_tier_3_idea: "Energía Arterias III"
 CHI_bri_pipelines_tier_3_idea_desc: "Las arterias de energía terrestre pasan por alto los chokepoints marítimos por completo, y la infraestructura de almacenamiento para explotarlos se está elevando a ritmo."
 CHI_bri_ports_tier_1_idea: "Red Marítima I"
 CHI_bri_ports_tier_1_idea_desc: "Los terminales de contenedores operados por China ahora manejan una parte significativa del comercio entre socios y estados a lo largo de la ruta marítima, fortaleciendo nuestra posición comercial con las naciones que enviamos."
 CHI_bri_ports_tier_2_idea: "Red Marítima II"
 CHI_bri_ports_tier_2_idea_desc: "Las concesiones terminales se han ampliado en contratos de desarrollo portuario completo. Los patios y fortalezas que nuestros contratistas construyen en el extranjero agudizan la experiencia que traen a la construcción naval en casa."
 CHI_bri_ports_tier_3_idea: "Red Marítima III"
 CHI_bri_ports_tier_3_idea_desc: "Una cadena de puertos comerciales, varios con literas de doble uso y reabastecimientos, ahora abarca los carriles marinos. El transporte marítimo chino va más allá, y también la flota que lo protege."
 CHI_bri_powerplants_tier_1_idea: "Red de generación de energía I"
 CHI_bri_powerplants_tier_1_idea_desc: "Generar capacidad construida en el extranjero por contratistas chinos mantiene la industria asociada funcionando en nuestros términos, y nuestras propias plantas funcionan mejor para la experiencia."
 CHI_bri_powerplants_tier_2_idea: "Red de generación de energía II"
 CHI_bri_powerplants_tier_2_idea_desc: "Una cartera más amplia de estaciones generadoras en el extranjero sostiene un mayor rendimiento industrial en casa."
 CHI_bri_powerplants_tier_3_idea: "Red de generación de energía III"
 CHI_bri_powerplants_tier_3_idea_desc: "La ingeniería china se ha convertido en el proveedor predeterminado de generación de energía a través de la red asociada, con la salida industrial en casa para coincidir."
 CHI_bri_prestige_tier_1_idea: "Diplomacia de Prestige I"
 CHI_bri_prestige_tier_1_idea_desc: "La inversión visible en los estados socios nos compra una reputación como constructor y no como acreedor."
 CHI_bri_prestige_tier_2_idea: "Diplomacia de Prestige II"
 CHI_bri_prestige_tier_2_idea_desc: "El Franja y la Ruta se habla como un bien público. Mantener relaciones amistosas nos cuesta menos de lo que una vez lo hizo."
 CHI_bri_prestige_tier_3_idea: "Diplomacia de Prestige III"
 CHI_bri_prestige_tier_3_idea_desc: "Beijing es ahora el socio de primer recurso en gran parte del mundo en desarrollo, y la posición que trae se traduce directamente en capital político en casa."
 CHI_bri_railways_tier_1_idea: "Corredores terrestres I"
 CHI_bri_railways_tier_1_idea_desc: "Los enlaces ferroviarios transfronterizos vinculan las economías asociadas con la industria china, y el flete que se mueve a lo largo de ellas nos gana buena voluntad entre los estados que sirven."
 CHI_bri_railways_tier_2_idea: "Corredores terrestres II"
 CHI_bri_railways_tier_2_idea_desc: "Los corredores ahora funcionan como arterias de carga programadas. El transporte terrestre fiable mantiene a nuestras fuerzas abastecidas donde el acceso al mar es incierto."
 CHI_bri_railways_tier_3_idea: "Corredores terrestres III"
 CHI_bri_railways_tier_3_idea_desc: "Una red terrestre continua llega a la profundidad del interior de la masa. Nuestro cuerpo de ingeniería ferroviaria construye más rápido en casa para la experiencia ganada en el extranjero."
 CHI_bri_telecom_tier_1_idea: "Ruta digital de seda I"
 CHI_bri_telecom_tier_1_idea_desc: "Las columnas de red construidas por China en los estados asociados dan visibilidad a nuestros servicios en el tráfico que los atraviesa, endureciéndonos contra la penetración de inteligencia extranjera."
 CHI_bri_telecom_tier_2_idea: "Ruta digital de la seda II"
 CHI_bri_telecom_tier_2_idea_desc: "El control de la capa de equipo a través de las redes asociadas reduce el costo de mantener nuestras propias operaciones en el extranjero."
 CHI_bri_telecom_tier_3_idea: "Ruta digital de la seda III"
 CHI_bri_telecom_tier_3_idea_desc: "El corredor digital es nuestro fin al final: hardware, retroceso y los aterrizajes de cables. El tráfico extranjero que pasa por él no es ni privado ni seguro de nosotros."
 CHI_brokered_non_aggression_pact: "Pacto para la no agresión de Beijing"
 CHI_brokered_non_aggression_pact_desc: "China es el garante de nuestro entendimiento de no agresión con nuestro rival regional. Mientras el pacto sostiene, ambas partes se benefician de la estabilidad y los vínculos más cálidos con Beijing."
 CHI_cadre_evaluation_reform_idea: "Reforma integral de la evaluación de los cuadros"
 CHI_cadre_evaluation_reform_idea_desc: "Actualmente se evalúa a los funcionarios sobre la administración ambiental, la armonía social y la prestación de servicios públicos junto con el crecimiento del PIB. La menor dependencia de la producción intensiva de fósiles y el mayor gasto público reflejan una clase administrativa más responsable."
 CHI_cai_active_phase: "Acuerdo global de la UE sobre inversiones"
 CHI_cai_active_phase_desc: "El Acuerdo global sobre la inversión está en su fase activa. Los mercados europeos están abiertos ampliamente a las exportaciones e inversiones chinas, los costos de los bienes de consumo disminuyen y nuestra capacidad industrial se expande significativamente."
 CHI_cai_residual: "Legacy de CAI duradera"
 CHI_cai_residual_desc: "Incluso después de la fase activa del Acuerdo General sobre Inversiones, persiste la integración estructural con los mercados europeos. Los vínculos comerciales siguen siendo más cálidos de lo que habrían sido."
 CHI_central_political_commission_1: "Comisión Central de Asuntos Políticos y Jurídicos"
 CHI_central_political_commission_1_desc: "La Comisión Central de Asuntos Políticos y Jurídicos tiene autoridad de supervisión sobre los tribunales, la fiscalía, el aparato de seguridad pública y los órganos de seguridad del Estado. Su misión principal es mantener el orden interno y garantizar que el sistema legal sirva a los objetivos de las partes en lugar de actuar como un control independiente. A medida que crece su posición dentro del comité, la capacidad de la comisión para evitar disturbios, procesar disenso eficientemente y coordinar las respuestas de seguridad interinstitucionales mejora sustancialmente."
 CHI_chinese_dream_momentum: "Momento de sueño chino"
 CHI_chinese_dream_momentum_desc: "La narrativa del sueño chino moviliza un sentido público de propósito nacional. Los ciudadanos están llamados a servir a la renovación colectiva; Los órganos del partido informan sobre las indagaciones de alistado y las exhibiciones públicas de sentimientos patrióticos. Por ahora, la historia es más convincente que el destino."
 CHI_chongqing_model_idea: "Modelo Chongqing"
 CHI_chongqing_model_idea_desc: "Las empresas estatales afianzan la inversión y marcan el ritmo de la economía más amplia. Los activos nacionalizados proporcionan una base fiscal para el gasto social sin depender de los ingresos fiscales del capital extranjero o del sector privado."
 CHI_commercial_bank_law_idea: "Aplicación de la Ley del Banco Comercial"
 CHI_commercial_bank_law_idea_desc: "Las revisiones de 2003 a la Ley del Banco Comercial imponen ratios de adecuación de capital al estilo de Basilea, normas de clasificación de riesgos y juntas independientes en los Cuatro Grandes. Los costos de cumplimiento regulatorio aumentan durante la transición, pero el proceso de asignación de créditos se aleja por primera vez del control político directo."
 CHI_common_prosperity_framework: "Marco de prosperidad común"
 CHI_common_prosperity_framework_desc: "La intervención reguladora en la educación, el entretenimiento y la tecnología del sector privado se combina con una inversión estatal ampliada en salud, infraestructura rural y seguro social. La afirmación del Partido es que la prosperidad se hace común; el mecanismo es que el Estado determina qué significa la prosperidad y quién la recibe primero."
 CHI_cpec_partner: "Corredor Económico de China-Pakistán"
 CHI_cpec_partner_desc: "El paquete de inversión del CPEC está remodelando la infraestructura pakistaní, con autopistas financiadas por China, proyectos energéticos y zonas industriales que aceleran la actividad económica."
 CHI_crrc_idea1_desc: "China Railway Rolling Stock Corporation, el mayor proveedor mundial de equipos ferroviarios, impulsa la construcción nacional de pistas y terminales y la exportación de material rodante chino en el extranjero."
 CHI_defiance_of_china: "Defiance of China"
 CHI_defiance_of_china_desc: "El Estado ha rechazado las demandas chinas, ha resistido la presión económica y mantenido su posición sobre las características controvertidas. El acto de desafío conlleva un prestigio nacional significativo y puede alentar a otros actores regionales a endurecer sus propias posturas."
 CHI_diaoyu_patrol_regime: "Régimen de Patrulla Diaoyu"
 CHI_diaoyu_patrol_regime_desc: "Rotaciones continuas de guardacostas cerca de aguas disputadas entrenan a las tripulaciones navales en condiciones realistas."
 CHI_digital_governance_spirit: "Gobernanza digital"
 CHI_digital_governance_spirit_desc: "Los sistemas de datos integrados vinculan las redes de vigilancia urbana, la supervisión de las transacciones financieras y los puntajes de crédito social en una infraestructura de cumplimiento unificada. Los gobiernos locales procesan las solicitudes administrativas digitalmente y aplican normas mediante el marcado automatizado. La interfaz burocrática entre ciudadano y estado se simplifica, y el estado está presente en cada punto de contacto."
 CHI_distant_water_fishing_fleets: "Flota de pesca con agua corriente"
 CHI_distant_water_fishing_fleets_desc: "Subvencionado por Beijing y respaldado por empresas estatales, nuestra flota de aguas distantes es la más grande del mundo, operando en las zonas económicas exclusivas de África Occidental, Sudamérica y el Pacífico Sur. Más allá de la seguridad alimentaria, los buques proyectan una presencia marítima persistente en aguas alejadas de nuestra costa, reforzando el principio de que los intereses chinos se extienden donde navegan los barcos chinos."
 CHI_divestiture_transition_idea: "Transition"
 CHI_divestiture_transition_idea_desc: "Forcing the army off its commercial revenue and onto the state budget leaves a gap no appropriation closes overnight. Las unidades acostumbradas a financiarse de hoteles, granjas y armas comerciales deben esperar ahora en Beijing, y el capital político se gasta suavizando la pérdida. La tensión se alivia una vez que el sector de defensa se reorganiza en conglomerados autofinanciados."
 CHI_dragon_king_ascendant: "Dragon King Ascendant"
 CHI_dragon_king_ascendant_desc: "Long Wang -el Rey Dragón- es el soberano tradicional de los cuatro mares en la cosmología china. Con el sistema tributario formalmente invocado y la presencia militar consolidada, el Mar del Sur reconoce sólo un soberano: Beijing."
 CHI_eda_grey_market_idea: "Gris-Channel EDA Sourcing"
 CHI_eda_grey_market_idea_desc: "Las casas de fábulas domésticas adquieren Synopsys y Cadence fluye a través de compañías de conchas sudeste asiático. Los entrenamientos funcionan, pero la oferta no es confiable y las actualizaciones de herramientas se remontan meses detrás del mercado licenciado."
 CHI_eight_points_doctrine: "Ocho puntos en Taiwán"
 CHI_eight_points_doctrine_desc: "La propuesta de ocho puntos de Jiang Zemin proporciona un marco doctrinal formal para la política transversal, combinando overtures para la reunificación pacífica con advertencias explícitas contra la independencia de jure. La planificación militar para las operaciones de contingencia corre junto a la vía diplomática, dando a Beijing un instrumento coercitivo creíble."
 CHI_etim_designation: "Marco de designación ETIM"
 CHI_etim_designation_desc: "El marco bilateral de lucha contra el terrorismo está dirigido a las redes separatistas del Territorio Oriental."
 CHI_eu_market_access: "Acceso integral a los mercados de la UE"
 CHI_eu_market_access_desc: "La ratificación de un marco integral de inversión con Bruselas abre un acceso profundo a los mercados europeos de consumidores y capitales, levantando techos de exportación y suavizando el clima político para las empresas chinas en todo el bloque."
 CHI_grey_society_crisis_idea: "Crisis de la Sociedad Gris"
 CHI_grey_society_crisis_idea_desc: "La generación de niños después de China ahora lleva una pirámide de edad invertida. Una fuerza de trabajo en disminución debe financiar una cohorte inflacionaria de jubilados, drenando los presupuestos de pensiones y salud mientras el crecimiento de la productividad se retrasa. La carga se alivia sólo cuando la población en edad de trabajar se estabiliza."
 CHI_guarantor_of_korean_peace: "Garante de la paz coreana"
 CHI_guarantor_of_korean_peace_desc: "Beijing es reconocida en toda la región como garante indispensable de la estabilidad coreana. El prestigio que esto confiere supera cualquier administración."
 CHI_gwadar_basing_rights: "Derechos de basing Gwadar"
 CHI_gwadar_basing_rights_desc: "El acceso a las instalaciones de aguas profundas de Gwadar amplía el alcance operacional de la Armada del Ejército Popular de Liberación en todo el Océano Índico y el Mar Arábigo."
 CHI_ideological_rectification: "Rectificación ideológica"
 CHI_ideological_rectification_desc: "Las prohibiciones del documento No 9 se aplican mediante sesiones de estudio obligatorias y campañas de autocrítica en universidades, organizaciones mediáticas y empresas estatales. Los límites del discurso aceptable contraen rápidamente. La lealtad se demuestra a través del rechazo de los conceptos liberales occidentales, y las paredes del perímetro ideológico endurecen contra la influencia extranjera."
 CHI_informal_sanctions: "Sanciones informales de THAAD"
 CHI_informal_sanctions_desc: "Hemos impuesto sanciones económicas informales a Corea del Sur en respuesta al despliegue de THAAD. Los turistas chinos son redirigidos, los bienes coreanos se enfrentan a barreras no arancelarias y las empresas coreanas que operan en nuestro territorio denuncian acoso oficial."
 CHI_information_warfare: "Información Warfare Apparatus"
 CHI_information_warfare_desc: "Los medios de comunicación estatales y las plataformas digitales proyectan narrativas chinas a nivel mundial al tiempo que se combaten campañas hostiles de información."
 CHI_inner_party_supervision_idea: "Reglamento de supervisión interna del Partido"
 CHI_inner_party_supervision_idea_desc: "Los procedimientos de supervisión formalizados exigen que los órganos superiores del partido inspeccionen e informen sobre los comités subordinados. Se refuerza la lucha contra la corrupción y se regulariza la rendición de cuentas política."
 CHI_international_department_1: "Departamento Internacional del Partido Comunista Chino"
 CHI_international_department_1_desc: "El Departamento Internacional lleva a cabo la diplomacia partidaria en todo el mundo, cultivando relaciones con los partidos gobernantes, movimientos de oposición y fundaciones políticas en todas las regiones. También sirve como el principal hogar institucional para la divulgación política de la Iniciativa Franja y la Ruta, coordinando la ejecución de proyectos, gestionando los retornos del compromiso con los países asociados y manejando la reestructuración de la deuda cuando los gobiernos receptores enfrentan dificultades de reembolso. Ampliar la influencia de su comisión profundiza la red de socios extranjeros receptivos y mejora el rendimiento general de los compromisos de BRI."
 CHI_international_sanctions: "Sanciones internacionales"
 CHI_international_sanctions_desc: "El apoyo de China a la agresión militar norcoreana ha desencadenado un régimen de sanciones internacionales. El acceso al comercio está restringido, la inversión extranjera se agota y el aislamiento diplomático se profundiza."
 CHI_Invigorate_Country_Through_STE1: "País vigoroso a través de los STE"
 CHI_Invigorate_Country_Through_STE1_desc: "La estrategia de vigorizar el país a través de la ciencia, la tecnología y la educación dirige la inversión estatal en institutos de investigación y el sistema universitario. El dividendo de investigación viene al precio de un presupuesto educativo más pesado."
 CHI_Invigorate_Country_Through_STE1_tt: "Boosto Técnico Anual para §Y$CAT_computing_tech$§! o §Y$CAT_internet_tech$§!"
 CHI_iron_brothers_joint_training: "Formación conjunta de los Hermanos Hierro"
 CHI_iron_brothers_joint_training_desc: "Los ejercicios conjuntos sostenidos con el ejército asociado han mejorado la cohesión unitaria, la alineación doctrinal y la competencia de las armas combinadas."
 CHI_jap_finlandized_sovereignty: "Soberanía finlandesa"
 CHI_jap_finlandized_sovereignty_desc: "Tokio conserva su parlamento, su prensa y su idioma. También mantiene su silencio sobre lo que hace Beijing más allá de sus fronteras."
 CHI_jap_forced_neutrality: "Neutralidad forzada"
 CHI_jap_forced_neutrality_desc: "El retiro de Japón del paraguas de seguridad estadounidense llegó a punta de pistola. El tratado está firmado. La humillación es generacional."
 CHI_jap_historical_pressure: "Historia China Offensive"
 CHI_jap_historical_pressure_desc: "Beijing ha reabierto la cuestión de la historia bélica, levantando las visitas al Santuario de Yasukuni, controversias del libro de texto y el legado de Nanjing en cada foro diplomático. La campaña inflama la opinión nacional en Japón y erosiona la capacidad de Tokio para contrarrestar las operaciones de influencia china."
 CHI_japan_soft_power: "Participación cultural sino-japonés"
 CHI_japan_soft_power_desc: "Los intercambios turísticos, los préstamos panda y las foto-ops ministeriales traducen la buena voluntad al capital político. Suspendido automáticamente si la agresión aumenta demasiado alto."
 CHI_japanese_cultural_imports: "Importaciones culturales japonesas con licencia"
 CHI_japanese_cultural_imports_desc: "Corrientes Bilibili Studio Ghibli. Licencias de diez centavos Demon Slayer. El ala juvenil del Partido estudia los informes de Wang Huning sobre la absorción cultural."
 CHI_joint_command_consultations: "Consultas del Comando Conjunto"
 CHI_joint_command_consultations_desc: "Las consultas estratégicas periódicas entre los mandos militares chinos y norcoreanos están mejorando la coordinación y reduciendo el riesgo de que se produzca un error de cálculo."
 CHI_joint_venture_era_idea: "Era industrial mixta de la ventura"
 CHI_joint_venture_era_idea_desc: "Las empresas mixtas de dominio exterior se convierten en el principal vehículo para la adquisición de tecnología, la transferencia de conocimientos de gestión y el acceso a las redes mundiales de distribución."
 CHI_kaesong_co_developer: "Kaesong Co-Developer"
 CHI_kaesong_co_developer_desc: "Las empresas de construcción chinas y los operadores logísticos están ejecutando empresas conjuntas dentro de la zona ampliada de Kaesong. Las cadenas de suministro compartidas recortan los costos y empatan la reputación."
 CHI_kor_beijing_pressure: "Campaña de presión de Beijing"
 CHI_kor_beijing_pressure_desc: "La presión económica y diplomática china sostenida está erosionando la confianza pública surcoreana y reduciendo el espacio de Seúl para una política independiente. El Gobierno se enfrenta al aumento de la insatisfacción interna y a una reducción del margen de maniobra contra Beijing."
 CHI_kor_beijing_security_guarantee: "Garantía de seguridad de Beijing"
 CHI_kor_beijing_security_guarantee_desc: "Bajo una garantía formal de seguridad china, Corea del Sur está liberada de su dependencia del paraguas nuclear americano. La planificación de la defensa se reorienta en torno a la cooperación con Beijing, reduciendo las cargas del servicio militar y estabilizando el clima político."
 CHI_kor_exit_trilateral: "Salida del Marco Trilateral"
 CHI_kor_exit_trilateral_desc: "Corea del Sur se ha retirado del marco de defensa trilateral de Estados Unidos-Japón-Filipinas. La decisión refleja el juicio de Seúl de que la orientación anti-China del marco es incompatible con sus intereses económicos y objetivos estratégicos de autonomía."
 CHI_kor_strategic_autonomy_doctrine: "Doctrina de Autonomía Estratégica"
 CHI_kor_strategic_autonomy_doctrine_desc: "Corea del Sur ha adoptado una doctrina de autonomía estratégica que distancia a Seúl de la arquitectura Indopacífica de Washington. La postura de defensa de Corea se orienta hacia la autosuficiencia y el multilateralismo regional en lugar de la gestión de alianzas de Estados Unidos."
 CHI_korean_tributary: "La relación tributaria de Corea del Norte"
 CHI_korean_tributary_desc: "La subordinación política de Corea del Norte a Beijing ha recreado, en forma institucional moderna, la relación tributaria que gobernaba las relaciones Sino-Korean antes de 1895. Se garantiza formalmente el acceso chino a puertos, mercados y espacio estratégico coreanos."
 CHI_kpa_intelligence_penetration: "KPA Inteligencia Penetración"
 CHI_kpa_intelligence_penetration_desc: "Los servicios de inteligencia chinos han cultivado una red de activos dentro del Ejército Popular Coreano. La conciencia en tiempo real de la planificación militar norcoreana y la política interna da a Beijing una palanca sin precedentes sobre Pyongyang."
 CHI_lithium_supply_chain_locked: "Cadena de suministro de triángulo de litio"
 CHI_lithium_supply_chain_locked_desc: "Los acuerdos de consumo a largo plazo con productores argentinos, bolivianos y chilenos aseguran a los fabricantes de baterías chinas el litio que necesitan, suavizando curvas de eficiencia y agregando espacio a la industria civil."
 CHI_long_range_firepower_idea: "Fuerza de fuego a larga distancia"
 CHI_long_range_firepower_idea_desc: "[CHI_long_range_firepower_idea_tt]"
 CHI_lotte_market_correction: "Corrección del mercado de Lotte"
 CHI_lotte_market_correction_desc: "Las operaciones chinas del Grupo Lotte han sido forzadas a una contracción gestionada, liberando cuota de mercado para los competidores domésticos. El ajuste reduce las salidas de bienes de consumo y demuestra la utilidad política de represalias económicas selectivas."
 CHI_lunar_legacy_industrial: "El palacio celestial hizo realidad"
 CHI_lunar_legacy_industrial_desc: "Tiangong significa Palacio Celestial, y por primera vez en la historia uno permanece permanentemente en órbita, construido enteramente por manos chinas. Las fábricas, fundiciones y salas de montaje que lo elevaron ahora vuelven su disciplina probada hacia la tierra. Lo que puede levantar una estación a la órbita puede construir cualquier cosa debajo de ella."
 CHI_lunar_legacy_military: "Cruzando el Puente Magpie"
 CHI_lunar_legacy_military_desc: "Queqiao, el Puente Magpie, transmitió nuestras señales desde el lado lejano de la Luna, llamada por el puente de las aves que una vez dejaron que dos amantes se encontraran a través del cielo. Las tripulaciones que entrenaron para la misión más difícil jamás intentaron regresar endurecidas y seguras. Una fuerza que puede llegar a la Luna no responde ningún reto en la Tierra con duda."
 CHI_lunar_legacy_political: "Chang'e asciende a los cielos"
 CHI_lunar_legacy_political_desc: "En el viejo mito Chang'e bebió el elixir y voló a la Luna, dejando a su marido Hou Yi mirar hacia arriba para siempre. Ahora su nombre ha llevado una nación real a la superficie lunar, y el pueblo ve en ella pruebas de que China pertenece entre los primeros rangos de poderes. El aterrizaje se convierte en una fuente de posición que ningún rival puede quitar."
 CHI_lunar_legacy_research: "Las preguntas de Tianwen"
 CHI_lunar_legacy_research_desc: "Tianwen, las preguntas celestiales, toma su nombre del antiguo poema de Qu Yuan que interrogó el orden del cosmos. Los Yutu Rovers y las muestras lunares contestaron preguntas que ninguna nación había respondido antes, y los laboratorios que los decodificaron tienen hambre por más. Un establecimiento científico probado contra la Luna llega ahora por cada frontera."
 CHI_mass_line_bo_campaign: "Campaña de la línea de masas"
 CHI_mass_line_bo_campaign_desc: "Los cuadros se despliegan por todo el campo y los pisos de fábrica para reunir comentarios y demostrar el compromiso del partido con la gente. La campaña eleva la conciencia política y canaliza la energía popular detrás de los objetivos del partido."
 CHI_mazu_blessing: "Bendición de Mazu"
 CHI_mazu_blessing_desc: "Mazu, Diosa del Mar y protector de los marineros, es venerada a través del litoral del Mar del Sur de China. Su bendición del templo ha sido invocada formalmente para la Flota del Mar Sur. La ceremonia se observa en toda la flota y refuerza esprit de corps."
 CHI_media_offensive: "Ofensivo mundial en los medios de comunicación"
 CHI_media_offensive_desc: "Las plataformas CGTN, Xinhua y redes sociales coordinan una campaña global que proyecta perspectivas chinas."
 CHI_militia_deployed: "Activo de Milicia Marítima"
 CHI_militia_deployed_desc: "Los buques de las milicias marítimas chinas se despliegan en la zona impugnada, manteniendo una presencia persistente bajo cubierta civil. Su presencia impide que los buques de guardia costera rivales se acerquen sin desencadenar una crisis."
 CHI_monroe_inverted: "Doctrina Monroe Invertida"
 CHI_monroe_inverted_desc: "Hemos desplazado a Washington como el principal socio externo de América Latina, anclando un realineamiento hemisférico que reduce el costo de las relaciones y empuja la opinión regional hacia nosotros."
 CHI_national_humiliation: "Humillación nacional"
 CHI_national_humiliation_desc: "Un retroceso diplomático o militar chino en el Mar del Sur de China se ha enmarcado internamente como una continuación del siglo de la humillación. La opinión pública está inflamada; el liderazgo se enfrenta a una intensa presión para restaurar la cara por otros medios."
 CHI_national_security_commission_1: "Comisión Nacional de Seguridad del Partido Comunista Chino"
 CHI_national_security_commission_1_desc: "Establecida en 2013-2014 bajo Xi Jinping, la Comisión de Seguridad Nacional se encuentra en el ápice de la arquitectura de seguridad china, coordinando funciones de inteligencia, militares, cibernéticas y contra-espionaje bajo liderazgo del partido directo en lugar de a través del consejo estatal. Su creación puso de manifiesto una centralización deliberada de todas las decisiones sobre seguridad estratégica. A medida que la influencia de la comisión dentro del comité se profundiza, su autoridad de coordinación se vuelve más amplia y su capacidad para responder a las amenazas internas y externas de seguridad más unificadas y decisivas."
 CHI_nepal_himalayan_friendship: "Iniciativa de amistad Himalaya"
 CHI_nepal_himalayan_friendship_desc: "La inversión china y la buena voluntad fluyen hacia Nepal bajo un marco de cooperación que respeta la neutralidad de Katmandú al acercar el país a la órbita económica de Beijing."
 CHI_neutral_interlocutor: "Interlocutor neutral"
 CHI_neutral_interlocutor_desc: "Nos hemos posicionado como el único poder con el que ambos Corea pueden hablar. El papel lleva influencia y expectativas."
 CHI_nko_blue_sky_mobilization: "Movilización de cielo azul"
 CHI_nko_blue_sky_mobilization_desc: "El Ejército Popular de Corea ha entrado en plena movilización de combate en coordinación con los objetivos estratégicos chinos. Todas las licencias han sido canceladas y las unidades avanzadas se están moviendo a sus posiciones de asalto."
 CHI_nko_chinese_economic_sphere: "China Economic Sphere"
 CHI_nko_chinese_economic_sphere_desc: "La economía de Corea del Norte se ha incorporado formalmente a la esfera industrial china. Las empresas estatales chinas administran sectores clave, se normalizan los arreglos de peg y el won norcoreano está vinculado al renminbi."
 CHI_nko_energy_aid: "China Energy Aid"
 CHI_nko_energy_aid_desc: "El aceite de combustible y las transferencias de electricidad de Dandong están manteniendo las fábricas funcionando y las luces encendidas. Los subsidios de Beijing vienen con expectativas tranquilas."
 CHI_nko_food_package: "Paquete de comida china"
 CHI_nko_food_package_desc: "Los envíos de granos en los cruces de Tumen están disminuyendo la escasez crónica. La ayuda compra espacio de respiración política dentro del Partido."
 CHI_nko_infrastructure_investment: "Inversión en infraestructura china"
 CHI_nko_infrastructure_investment_desc: "Las brigadas de construcción chinas están reconstruyendo la infraestructura norcoreana a escala. Carreteras, ferrocarriles, puertos y redes eléctricas se actualizan bajo contratos que unen los recursos norcoreanos a cadenas industriales chinas para una generación."
 CHI_nko_offensive_readiness: "KPA Lectura ofensiva"
 CHI_nko_offensive_readiness_desc: "Con el respaldo logístico chino, el Ejército Popular Coreano ha pasado de una postura defensiva a una optimizada para operaciones ofensivas rápidas hacia el sur en el paralelo 38."
 CHI_nko_security_assurance: "Garantía de seguridad china"
 CHI_nko_security_assurance_desc: "Beijing ha ofrecido un retroceso discreto pero firme contra el colapso del régimen. La garantía mantiene la presión de movilización del círculo interior y amortigua."
 CHI_npm_red_banner_insurgency: "Insurgencia de base china"
 CHI_npm_red_banner_insurgency_desc: "El oleoducto encubierto de Beijing mantiene las columnas maoístas en fusiles, municiones y entrenamiento de cuadros. El Ejército Popular de Liberación considera a Nepal un terreno probatorio para la exportación revolucionaria, y espera un retorno de su inversión."
 CHI_nrcms_rollout_idea: "Nuevo Plan Médico Cooperativo Rural"
 CHI_nrcms_rollout_idea_desc: "Las contribuciones mancomunadas de residentes rurales, gobiernos locales y el presupuesto central cubren ahora los costos médicos catastróficos de cientos de millones de agricultores, la mejora de la salud pública y la reducción del choque financiero de las enfermedades en los hogares rurales."
 CHI_organisation_department_1: "Departamento de Organización del Partido Comunista Chino"
 CHI_organisation_department_1_desc: "El Departamento de Organización controla todas las decisiones del personal de las partes: nombramientos, ascensos, investigación y disciplina en todos los niveles de la jerarquía del PCCh. Su alcance se extiende a las empresas estatales y los ministerios gubernamentales, lo que lo convierte en el instrumento más poderoso de la cohesión interna de los partidos. A medida que la influencia de la comisión dentro del Comité Permanente se profundiza, su agarre en la selección de cuadros se endurece y su capacidad para hacer cumplir las directivas centrales a través del aparato crece en consecuencia."
 CHI_pacific_basing_rights: "Segunda cuenca de la cadena de islas"
 CHI_pacific_basing_rights_desc: "Los derechos de bastión y reposición negociados en la Segunda Cadena de la Isla dan al alcance estratégico de la Armada del PLA, colas logísticas más cortas y giros más rápidos para despliegues de aguas azules."
 CHI_pacific_diplomatic_setback: "Retrocedimiento diplomático del Pacífico"
 CHI_pacific_diplomatic_setback_desc: "Un fracaso de alto nivel en las Islas del Pacífico ha endurecido las capitales regionales contra nuestros excesos, elevando el costo político de cada iniciativa diplomática posterior."
 CHI_pacific_security_lead: "Liderazgo de seguridad del Pacífico"
 CHI_pacific_security_lead_desc: "Los acuerdos de acceso anticipado y los despliegues de rotación en todas las Islas del Pacífico extienden el alcance operacional de la Armada del PLA y aceleran la infraestructura de base que lo sustenta."
 CHI_paf_maritime_militia: "La milicia marítima de la FAP"
 CHI_paf_maritime_militia_desc: "Flotas de pesca civiles organizadas bajo mando militar. Desniabilidad plausible en el mar, números reales cuando sea necesario."
 CHI_party_century_endures: "El partido que termina"
 CHI_party_century_endures_desc: "El Pensamiento Xi Jinping está integrado en la estructura constitucional y organizativa del Partido como marco operativo permanente. El sistema del Congreso, el Politburo y la Comisión Militar Central se reafirman como motores duraderos de la gobernanza. El Partido que superó la muerte de Mao, la Revolución Cultural y Tiananmen está diseñado para superar a cualquier individuo, incluyendo a su actual líder supremo."
 CHI_patriotic_education_mandate: "Mandato de Educación Patriótica"
 CHI_patriotic_education_mandate_desc: "Los planes de estudio revisados aseguran que ningún estudiante chino olvide lo que se hizo en Nanjing, en Pingdingshan, en las celdas prefab de la Unidad 731. Estabilidad fortalece. También sospecha de ideas extranjeras."
 CHI_pearls_economic_partner: "Asociación estratégica china"
 CHI_pearls_economic_partner_desc: "La logística naval china ha desbloqueado la grandeza económica de Beijing, con fondos de modernización portuaria y créditos de infraestructura que fluyen hacia el estado anfitrión."
 CHI_personal_rule_mandate: "Mandato de la Reglamentación Personal"
 CHI_personal_rule_mandate_desc: "El Congreso Popular Nacional de 2018 eliminó los límites del mandato presidencial de la constitución, consolidando la autoridad en torno al líder supremo sobre una base permanente. La dirección estratégica y la lealtad política ahora fluyen a través de un solo centro, elevando Apoyo a la guerra pero reduciendo el espacio para la iniciativa entre los comandantes sobre el terreno."
 CHI_petrodollar_breaks: "Paridad Petrodollar alcanzada"
 CHI_petrodollar_breaks_desc: "El petróleo del Golfo a precios de yuan, las líneas de intercambio de bancos centrales en todo el Sur Global, y alternativas SWIFT han erosionado la prima de reserva del dólar, traduciendo el apalancamiento monetario al poder político y la confianza demográfica."
 CHI_pla_basing_economic_help: "Asociación económica china"
 CHI_pla_basing_economic_help_desc: "A cambio de acoger la logística de la Armada del PLA, recibimos apoyo económico chino sostenido: mercados ampliados de exportación, actualizaciones de fábricas civiles y respaldo político en foros regionales."
 CHI_policy_bank_lending_idea: "El banco de políticas conduce Lending"
 CHI_policy_bank_lending_idea_desc: "China Development Bank, EximBank y ADBC emiten líneas de crédito concesionarias a empresas estatales y gobiernos provinciales, lo que acelera la inversión de activos fijos en infraestructuras de transporte, energía y ultramar. La salida de la producción de las olas prestamistas, pero vincula los ahorros del hogar en depósitos de bajo rendimiento."
 CHI_princeling_economic_leverage: "Apalancamiento económico principado"
 CHI_princeling_economic_leverage_desc: "Una red de vínculos comerciales transfronterizos ahora une a las élites norcoreanas al capital chino. Cada transacción profundiza la dependencia."
 CHI_property_sector_contraction_idea: "Sector inmueble Constracción"
 CHI_property_sector_contraction_idea_desc: "Las Tres Líneas Rojas obligan a los mayores desarrolladores al desenvolvimiento simultáneo. La construcción comienza a colapsar, los ingresos de la venta de tierras a nivel local se evaporan y las redes de proveedores en cemento, acero y electrodomésticos sufren a su vez. La economía más amplia absorbe el choque ya que la burbuja de propiedad está forzosamente deflada."
 CHI_property_tax_pilot_idea: "Propiedad Tax Pilot"
 CHI_property_tax_pilot_idea_desc: "Shanghai y Chongqing levy impuestos modestos sobre segundas viviendas y propiedades de alto valor, amortiguando la inversión especulativa y diversificando los ingresos del gobierno local lejos de las ventas terrestres."
 CHI_publicity_department_1: "Departamento de Publicidad del partido comunista chino"
 CHI_publicity_department_1_desc: "El Departamento de Publicidad establece la línea ideológica para todos los medios impresos, transmitidos y digitales en China, dirigiendo la censura, el encuadre narrativo y la proyección interna de la legitimidad del partido. También coordina la infraestructura de mensajería en el extranjero, incluida la expansión de los medios de comunicación estatales y las asociaciones de contenidos en el extranjero. La mayor influencia de la comisión se traduce en un entorno de información más coherente y contundente, reforzando la estabilidad social y el apoyo popular a las prioridades del partido."
 CHI_qccm_coordination_cell: "Célula de Coordinación QCCM"
 CHI_qccm_coordination_cell_desc: "El intercambio cuadrilateral de inteligencia en todo el corredor de Pamir vincula los servicios de seguridad de China, Pakistán, Afganistán y Tayikistán."
 CHI_raj_foreign_defense_pressure: "Presión china"
 CHI_raj_foreign_defense_pressure_desc: "El pivote de Beijing hacia el sur de Asia ha ejercido una presión diplomática e informativa sostenida sobre Nueva Delhi, reduciendo las opciones estratégicas de la India a lo largo de sus fronteras norte y este."
 CHI_rason_investment_flow: "Programa de inversión Rason"
 CHI_rason_investment_flow_desc: "El capital chino está entrando en la Zona Económica Especial Rason, infraestructura de financiación, capacidad industrial e instalaciones portuarias. El experimento está produciendo resultados visibles."
 CHI_rason_port_access: "Acceso portuario Rason"
 CHI_rason_port_access_desc: "Nuestros barcos ahora tienen acceso confiable al puerto de aguas profundas de Rason, dando a la Armada del Ejército Popular de Liberación una posición estratégica en el Mar de Japón."
 CHI_rcep_member: "RCEP Miembro fundador"
 CHI_rcep_member_desc: "Coanciábamos la Alianza Económica Integral Regional junto con Tokio y Seúl. Los aranceles caen, las cadenas de suministro engrosan, y la ausencia americana se convierte en la norma regional."
 CHI_reconstruction_plan_idea: "Plan de fomento de la capacidad"
 CHI_reconstruction_plan_idea_desc: "Los equipos pre-posicionados, protocolos estandarizados y unidades especializadas de ingeniería del ejército nos dan una ventaja de velocidad excepcional en la reparación de infraestructura e industria tras desastres."
 CHI_regional_crisis_alert: "Alerta regional de crisis"
 CHI_regional_crisis_alert_desc: "La postura de seguridad china en la península coreana ha desencadenado una elevada disponibilidad en toda la región. La cohesión de la alianza está tensa."
 CHI_reunion_humanitarian_lead: "Diplomacia humanitaria"
 CHI_reunion_humanitarian_lead_desc: "Nuestra coordinación de las reuniones familiares transfronterizas ha generado una buena voluntad inusualmente amplia. Los ministerios extranjeros dan la bienvenida al contacto, y los medios de comunicación nacionales lo amplifican."
 CHI_rmb_promotion: "RMB Internationalization"
 CHI_rmb_promotion_desc: "El renminbi se acepta cada vez más como moneda de reserva internacional mediante acuerdos bilaterales de intercambio."
 CHI_russian_arms_dependency: "La dependencia de armas rusas"
 CHI_russian_arms_dependency_desc: "El Ejército Popular de Liberación fue construido sobre diseños soviéticos y rusos. Sus armas pequeñas comenzaron como el tipo 56, un Kalashnikov licenciado, y su cuerpo blindado creció del tipo 59, una copia directa de la T-54A soviética, con tanques posteriores y vehículos de combate de infantería que aún se hacen eco de linaje T-72 y BMP. La artillería, los transportes y las baterías de defensa aérea comparten la misma ascendencia. La dependencia es más profunda en la propulsión: las potencias AL-31F J-10 y J-11, el RD-93 vuela el JF-17, y los combatientes Su-35 y las baterías S-400 fueron compradas directamente desde Moscú. Cada línea de luchadores domésticos espera en una turbina rusa, cada patrón licenciado paga una realeza, y las oficinas de diseño aún copian más de lo que crean. Hasta que China forja su propia base militar-industrial, el latido del ejército está establecido en Rusia."
 CHI_sanctions_immunity_partial: "Salvavidas comercial liquidado en yuanes"
 CHI_sanctions_immunity_partial_desc: "Los contratos de energía y bienes aprobados por Renminbi con asociados autorizados ponen de manifiesto el impacto de la presión financiera occidental, alivian la presión del consumidor y mantienen abiertos los canales de exportación."
 CHI_sars_outbreak_uncontrolled_idea: "SARS Epidemic"
 CHI_sars_outbreak_uncontrolled_idea_desc: "La falta de coordinación de una pronta respuesta de emergencia permitió que el SARS se extendiera por varias provincias antes de que se adoptaran medidas de cuarentena. Nuestra demora en la notificación internacional ha dañado nuestra posición en el extranjero e impuso importantes perturbaciones económicas en el país."
 CHI_sars_response_effective_idea: "SARS Contained"
 CHI_sars_response_effective_idea_desc: "Nuestro marco de respuesta de emergencia permitió una cuarentena rápida, notificación internacional rápida y acción médica coordinada. El brote está contenido, con una perturbación económica limitada y nuestra posición internacional intacta."
 CHI_scientific_outlook_idea_1: "Científica Perspectivas sobre Preparación para el Desarrollo"
 CHI_scientific_outlook_idea_1_desc: "Estamos reorientando la política nacional fuera del primer crecimiento del PIB hacia indicadores sociales y ambientales más amplios en el marco de la Perspectiva Científica sobre Desarrollo."
 CHI_scientific_outlook_idea_1_tt: "§Y$CHI_scientific_outlook_on_development$§! Enfoque Tiempo de terminación §G-35§! §Y Días§!"
 CHI_sco_dialogue_partner: "Compañero de diálogo SCO"
 CHI_sco_dialogue_partner_desc: "Este país ha sido aceptado como socio de diálogo de la Organización de Cooperación de Shanghai, abriendo la puerta a un compromiso político y económico más profundo con los Estados miembros."
 CHI_sco_member: "Miembro de la SCO"
 CHI_sco_member_desc: "Este país es miembro pleno de la Organización de Cooperación de Shanghai, participando en todos los marcos políticos, económicos y de cooperación en materia de seguridad establecidos por la organización."
 CHI_sco_member_econ_desc: "Este país es miembro pleno de la Organización de Cooperación de Shanghai con un énfasis en la cooperación económica, ganando relaciones comerciales y de inversión mejoradas con otros Estados miembros."
 CHI_sco_member_mil_desc: "Este país es miembro pleno de la Organización de Cooperación de Shanghai con un énfasis en cooperación militar, participando en ejercicios conjuntos y operaciones de seguridad."
 CHI_sco_member_pol_desc: "Este país es miembro pleno de la Organización de Cooperación de Shanghai con un énfasis en la cooperación política, ganando una gobernanza más fuerte y marcos antisubversiones."
 CHI_sco_observer: "Un observador de la OCS"
 CHI_sco_observer_desc: "Este país goza de la condición de observador en la Organización de Cooperación de Shanghai, otorgando acceso a los foros de la OCS y una cooperación económica limitada manteniendo al mismo tiempo la soberanía sobre las decisiones de alineación."
 CHI_scs_chinese_debt: "Dependencia de la deuda china"
 CHI_scs_chinese_debt_desc: "Franja y la Ruta Las obligaciones de préstamo han dado a Beijing una ventaja significativa sobre el cálculo de política exterior del socio endeudado. Los requisitos de servicio de la deuda limitan la libertad del gobierno para tomar posiciones hostiles a los intereses chinos."
 CHI_scs_claimant_under_pressure: "Bajo presión china"
 CHI_scs_claimant_under_pressure_desc: "El dominio chino del Mar de China Meridional ha hecho que cada decisión relacionada con Spratly sea más costosa para este gobierno. La opinión nacional se divide entre alojamiento y resistencia; la penalización Poder político sobre las decisiones del Mar de China Meridional refleja la dificultad de trazar cualquier curso mientras Beijing establece los términos."
 CHI_scs_de_facto_sovereignty: "Soberanía de facto"
 CHI_scs_de_facto_sovereignty_desc: "A través de la diplomacia bilateral paciente y los acuerdos acumulados, las afirmaciones de China en el Mar del Sur de China se han convertido en el defecto regional. Ningún reclamante impugna formalmente el acuerdo; los poderes externos carecen de los instrumentos jurídicos para impugnar lo que han aceptado los Estados vecinos."
 CHI_scs_jdz_revenue: "Ingresos conjuntos de desarrollo"
 CHI_scs_jdz_revenue_desc: "La extracción de hidrocarburos de las zonas de desarrollo conjunto está generando ingresos compartidos tanto para nosotros como para nuestro estado socio. El ingreso petrolífero fluye al estado relevante de Spratly en ambos lados del acuerdo durante el acuerdo, dando a ambos gobiernos una participación concreta en la continuación del marco bilateral y complicando cualquier pivote hacia la confrontación."
 CHI_scs_setback: "Retroceso del Mar de China Meridional"
 CHI_scs_setback_desc: "Un enfrentamiento ha terminado desfavorablemente, una iniciativa diplomática ha sido rechazada públicamente, o un fallo internacional se ha opuesto a las reivindicaciones chinas. El revés reduce la variable SCS Framework y puede invitar a respuestas oportunistas de otros reclamantes."
 CHI_sea_eagles_carrier_wing_idea: "$CHI_sea_eagles_carrier_wing$"
 CHI_sea_eagles_carrier_wing_idea_desc: "[CHI_sea_eagles_carrier_wing_idea_tt]"
 CHI_selective_anti_corruption_campaign_idea: "Campaña selectiva contra la corrupción"
 CHI_selective_anti_corruption_campaign_idea_desc: "Los enjuiciamientos dirigidos suprimen la corrupción más flagrante y eliminan a los agentes de poder rivales, pero el carácter selectivo y político de la ejecución crea incertidumbre institucional y suprime la iniciativa."
 CHI_self_reliant_path_idea: "Los dolores crecientes de Taihang"
 CHI_self_reliant_path_idea_desc: "La autosuficiencia se paga en turbinas flameadas y escuadrones terrestres. El temprano WS-10 Taihang se ahoga por su propia ambición, sus espadas cracking y su vida útil medida en horas meras, y las tripulaciones pagan por cada lección que los ingenieros todavía tienen que aprender. Los burós llegarán allí, pero hasta que hagan la flota vuela en fe."
 CHI_sez_japanese_investors: "SEZs para inversores japoneses"
 CHI_sez_japanese_investors_desc: "Concesiones especiales para Toyota, Sony, Panasonic. La estrategia China-Plus-One se invierte haciendo imposible que China se vaya."
 CHI_sino_japanese_understanding: "Entendimiento estratégico sino-japonés"
 CHI_sino_japanese_understanding_desc: "La arquitectura no expresa de la distensión: flujos comerciales, reuniones ministeriales y un acuerdo tácito para dejar la historia en los archivos. Perdido permanentemente si la agresión sino-japonesa se eleva de nuevo."
 CHI_smic_foundry_base: "Base de fundación SMIC"
 CHI_smic_foundry_base_desc: "El campus Zhangjiang de SMIC proporciona una plataforma de producción de 28nm calificada para clientes domésticos de fábulas. La capacidad cautiva de la fundición reduce la dependencia de China en el TSMC para la lógica de los ganglios maduros y proporciona una base de referencia para un mayor desarrollo del proceso interno."
 CHI_society_department_1: "La sociedad Work Department"
 CHI_society_department_1_desc: "Creado en 2023, el Departamento de Trabajo de la Sociedad consolidó la supervisión del PCCh de organizaciones sociales populares, ONGs, sindicatos y el sistema de peticiones que anteriormente se había difundido entre múltiples organismos. Su mandato consiste en asegurar que la sociedad civil actúe dentro de los parámetros establecidos por el partido y que las reivindicaciones populares se canalicen en puestos gestionados en lugar de movilización independiente. La creciente influencia de la comisión permite al departamento ampliar su alcance organizativo y perfeccionar los mecanismos mediante los cuales se absorben y desactivan las presiones sociales."
 CHI_sovereign_wealth_diversification_idea: "China Corporación de Inversiones Soberanas Diversificación de la riqueza"
 CHI_sovereign_wealth_diversification_idea_desc: "China Investment Corporation rota las reservas forex fuera de los tesoros estadounidenses de bajo rendimiento en acciones privadas globales, infraestructura y equidad estratégica. La cartera genera mayores rendimientos que la base de reservas y da posiciones estructurales de Beijing en mercados de capitales extranjeros."
 CHI_state_tolerated_boycott: "Estado-Boicot tolerado"
 CHI_state_tolerated_boycott_desc: "Las manifestaciones antijaponesas la policía no se dispersarán hasta que lo hagan. Los consumidores patóticos redireccionan el gasto. Algunos minoristas chinos también sangraron."
 CHI_streamline_the_ranks_idea: "Racionalización de los Ranks"
 CHI_streamline_the_ranks_idea_desc: "A finales de los años noventa el Ejército Popular de Liberación derrocó a cientos de miles de efectivos, negociando una fuerza de movilización masiva hinchada para un ejército más pequeño y profesional construido alrededor de las brigadas. Las cepas de transición entrenan tuberías y vinculan la industria.\n\n§YEste castigo levanta una vez que se cumplan ambas condiciones:§!\n§Y-§! El ejército está por debajo §Y[?CHI_streamline_div_baseline|0]§! divisiones.\n§Y-§! Armas de infantería, artillería y chasis de tanque medio almacenan cada una una una reserva por encima del §Y10%§! de las necesidades del ejército."
 CHI_strike_black_sing_red_idea: "Huelga Black, Sing Red"
 CHI_strike_black_sing_red_idea_desc: "Miles de funcionarios y figuras del crimen organizado han sido arrestados, y sus redes se desmantelaron. Los eventos masivos de la cultura roja inundan la esfera pública con fervor patriótico, elevando moral y lealtad al partido."
 CHI_succession_roadmap: "Sucesión de Roadmap"
 CHI_succession_roadmap_desc: "La identificación y el cultivo de un sucesor designado indica a las instituciones del Partido que la transición del poder será gestionada en lugar de impugnada. Los asociados internacionales leyeron el marco de sucesión como prueba de la estabilidad sistémica. La prima de riesgo político en acuerdos de largo alcance con China se reduce, al menos durante la duración del acuerdo."
 CHI_summit_host: "El anfitrión de la Cumbre"
 CHI_summit_host_desc: "Beijing acoge activamente conversaciones regionales delicadas. El ancho de banda diplomático es alto, y las herramientas de presión llevan peso añadido."
 CHI_taiwan_strait_pressure_spirit: "Postura de presión cruzada"
 CHI_taiwan_strait_pressure_spirit_desc: "Las incursiones regulares de aire del PLA en la zona de identificación de defensa aérea de Taiwán, ejercicios navales a gran escala en las aguas que rodean la isla y coacción económica calibrada mantienen una campaña sostenida de presión corta de guerra abierta. La postura mantiene a Taipei en alerta permanente y las señales resuelven a Washington, endureciendo nuestras fuerzas y sosteniendo al público Apoyo a la guerra para posibles contingencias."
 CHI_tech_crackdown_moderate: "Tech Crackdown: Reestructuración gestionada"
 CHI_tech_crackdown_moderate_desc: "La campaña reguladora ha impuesto costos de cumplimiento y frenado la inversión en investigación, pero el sector de la plataforma tiene suficiente escala para absorber la perturbación sin colapso estructural."
 CHI_tech_crackdown_severe: "Agrieta técnica: severa"
 CHI_tech_crackdown_severe_desc: "Nuestra campaña reguladora contra el sector de la plataforma ha atrapado a la economía digital en una etapa temprana del desarrollo. La construcción del sector de servicios está estancada, el capital de riesgo ha huido y la inversión en investigación se ha contratado considerablemente."
 CHI_the_duterte_precedent: "El Preceptor del Duterte"
 CHI_the_duterte_precedent_desc: "El ejemplo de un jefe de gobierno de la ASEAN que opta por alejarse de Washington y hacia Beijing reverbera en toda la región. Otros líderes observan que los Estados Unidos no lo previnieron ni pudieron evitarlo, y ponderan sus propias opciones en consecuencia."
 CHI_three_represents_debate: "Tres Representa la Controversia"
 CHI_three_represents_debate_desc: "Los tradicionalistas ideológicas dentro del Partido resisten la propuesta de Jiang de admitir a empresarios privados como miembros del Partido, argumentando que abandona el carácter de clase de la vanguardia. El debate interno interrumpe temporalmente la coherencia de las políticas y genera fricciones a nivel provincial."
 CHI_three_represents_debate_tt: "\nEsto. §YNational Spirit§! Lo haré. §RCancelación§! if §YJiang Zemin§! no se completa §Y$CHI_three_represents_codified$§! y ya no §YCountry Leader§!"
 CHI_tibet_crackdown_idea: "Operación de Seguridad del Tibet"
 CHI_tibet_crackdown_idea_desc: "Una operación coordinada de seguridad en todo el Tíbet está suprimiendo la actividad separatista, a costa de una tensión temporal de estabilidad."
 CHI_total_war_himalayan_front: "Guerra total en el Frente Himalaya"
 CHI_total_war_himalayan_front_desc: "Cada fábrica, cada barandilla, todo reservista se movilizó para la pregunta de McMahon."
 CHI_two_centenary_resolve: "Dos Objetivos Centenarios"
 CHI_two_centenary_resolve_desc: "Los plazos del centenario doble de 2021 y 2049 imponen un horizonte generacional en la planificación económica y social. La inversión en infraestructura, los objetivos de productividad y los programas de desarrollo tecnológico están orientados hacia estos hitos. Los objetivos estructuran los incentivos burocráticos y desbloquean ciclos sostenidos de planificación multidecada en todos los ministerios."
 CHI_united_front_department_1: "Departamento de Trabajo Frontal Unidos"
 CHI_united_front_department_1_desc: "El Departamento de Trabajo del Frente Unido gestiona las relaciones del PCCh con los grupos no partidos: minorías étnicas, comunidades religiosas, redes chinas en el extranjero y figuras políticas extranjeras susceptibles a la cooptación. Su mandato es neutralizar las posibles fuentes de oposición y extender la influencia del partido más allá de los miembros oficiales. A medida que crece la influencia de la comisión, el alcance del departamento se vuelve más sistemático, convirtiendo a actores periféricos en instrumentos fiables de intereses estratégicos chinos."
 CHI_usa_asia_pivot_collapse: "Collapsed Pivot Indo-Pacific"
 CHI_usa_asia_pivot_collapse_desc: "Con Seúl yendo hacia la órbita de Beijing y Tokio estratégicamente aislada, la piedra angular del rebalance americano a Asia se ha separado. La planificación anticipada está en desorden, la confianza aliada es sacudida, y el costo político de la inversión pesa sobre Washington."
 CHI_usa_back_channel_open: "Volver Canal a Foggy Bottom"
 CHI_usa_back_channel_open_desc: "Una línea discreta entre Zhongnanhai y el Departamento de Estado mantiene la comunicación de crisis abierta por debajo del camino diplomático público. El canal produce una corriente constante de inteligencia sobre las intenciones americanas, a costa de la exposición china contra la inteligencia."
 CHI_usa_g2_framework: "G2 Framework"
 CHI_usa_g2_framework_desc: "Washington y Beijing han institucionalizado un condominio de gran potencia sobre los asuntos coreanos, coordinando la política a través de canales bilaterales permanentes. El arreglo establece mercados y reduce los costos de consumo, pero vincula la política de Corea estadounidense con la continua buena voluntad china."
 CHI_wakhan_buffer_idea: "Zona de amortiguación de Wakhan"
 CHI_wakhan_buffer_idea_desc: "Un régimen coordinado contra la radicalización en todo el Corredor de Wakhan ha endurecido la frontera occidental de China contra la infiltración extremista."
 CHI_wakhan_buffer_partner_idea: "Socio antiterrorista de Wakhan"
 CHI_wakhan_buffer_partner_idea_desc: "Los protocolos conjuntos de control fronterizo con Beijing han mejorado la capacidad nacional de lucha contra el terrorismo, incluso a medida que los servicios de inteligencia extranjeros intensifican su cooperación."
 CHI_war_footing_central_asia: "Guerra de Asia Central Footing"
 CHI_war_footing_central_asia_desc: "Producción nacional orientada hacia operaciones sostenidas al oeste de los Pamires."
 CHI_water_shortage: "Corporaciones de agua"
 CHI_water_shortage_desc: "La llanura del norte de China, la cuenca del río Amarillo y el corredor Beijing-Tianjin-Hebei mantienen aproximadamente la mitad de la tierra cultivada del país pero menos de una quinta parte de su agua dulce. La disponibilidad de agua per cápita en el norte está muy por debajo del umbral internacional de escasez de 1.000 metros cúbicos por año. La descarga industrial y la fuga agrícola han contaminado importantes acciones de superficie y aguas subterráneas disponibles, lo que agrava la escasez física. La agricultura representa más del 60% del consumo total de agua, y las demandas de refrigeración del sector energético añaden mayor tensión a una base de recursos ya agotada."
 CHI_wenchuan_reconstruction_drive_idea: "Unidad de reconstrucción Wenchuan"
 CHI_wenchuan_reconstruction_drive_idea_desc: "Desplegamos a más de 100.000 soldados y equipos de emergencia dentro de los días del terremoto, y seguimos con un plan de reconstrucción RMB 1 trillón. La magnitud del compromiso ha generado un aumento sostenido de las actividades de construcción en Sichuan y la región circundante."
 CHI_western_hemisphere_protector: "Protector de las Américas Emergentes"
 CHI_western_hemisphere_protector_desc: "Nos hemos posicionado como el garante de seguridad alternativo para las naciones latinoamericanas que buscan escapar de la órbita de Washington. La influencia fluye libremente, y las redes de inteligencia están aisladas de la contraacción occidental."
 CHI_western_institutional_engagement_idea: "Participación institucional occidental"
 CHI_western_institutional_engagement_idea_desc: "La participación activa en la gobernanza del FMI, el Banco Mundial y la OMC fomenta la credibilidad internacional y amplía el acceso a los mercados financieros mundiales."
 CHI_wto_implementation_idea: "Aplicación de la OMC"
 CHI_wto_implementation_idea_desc: "Las reducciones arancelarias multianuales, la apertura del sector de los servicios y la armonización con las normas comerciales internacionales profundizan nuestra integración en las cadenas mundiales de suministro y mejoran nuestra posición con los asociados comerciales."
 CHI_xinjiang_crackdown_idea: "Operación de Seguridad Xinjiang"
 CHI_xinjiang_crackdown_idea_desc: "Una extensa operación de seguridad está en marcha a través de Xinjiang. La resistencia se amortigua pero el costo cae en la estabilidad interna."
 chinese_african_century: "Siglo Chino-África"
 chinese_african_century_desc: "Decenios de las inversiones de la FOCAC han convertido a China en el socio indispensable del continente africano, remodelando la demografía, los flujos comerciales y la alineación política."
 chinese_surveillance_systems: "Sistemas de vigilancia chinos"
 chinese_surveillance_systems_desc: "Las plataformas de seguridad importadas, cámaras de reconocimiento facial y herramientas de identidad digital endurecen el régimen contra las operaciones de disentimiento e inteligencia extranjera."
 eurasian_land_bridge: "Puente terrestre eurasiático"
 eurasian_land_bridge_desc: "Un corredor de ferrocarriles y oleoductos no roto vincula al Pacífico con el Atlántico, con normas chinas, calibres y procedimientos aduaneros que establecen el ritmo del comercio terrestre."
 JAP_abandoned_by_ally: "Abandonado por Washington"
 JAP_abandoned_by_ally_desc: "Cuando llegó el momento, los americanos escucharon. La alianza se mantiene en papel pero la confianza ha desaparecido, y cada facción de la Dieta está sacando sus propias conclusiones."
 JAP_china_engagement: "Participación con China"
 JAP_china_engagement_desc: "Tokio ha elegido un compromiso político abierto con Beijing, reduciendo la fricción estratégica al costo de la credibilidad nacionalista."
 JAP_export_pain: "Dolor de exportación"
 JAP_export_pain_desc: "Un boicot de consumo chino sostenido ha dejado a las industrias japonesas exportadoras buscando mercados alternativos."
 JAP_jcg_emergency_deployment: "Despliegue de emergencia del Grupo Consultivo Mixto"
 JAP_jcg_emergency_deployment_desc: "La Guardia Costera de Japón está en una situación de crisis permanente en el Mar de China Oriental, fiscalizando la industria para mantener los cortadores en el mar."
 JAP_rare_earth_diversification: "Unidad de diversificación de la Tierra rara"
 JAP_rare_earth_diversification_desc: "Un programa de emergencia para la fuente de tierras raras de Australia, Vietnam y el reciclaje doméstico. Dolor a corto plazo."
 JAP_revisionist_pride: "Pride revisionista"
 JAP_revisionist_pride_desc: "El desafío público de las críticas extranjeras sobre la memoria de tiempos de guerra consolida un estado de ánimo nacionalista en casa."
 JAP_sino_japanese_understanding: "Entendimiento sino-japonés"
 JAP_sino_japanese_understanding_desc: "La Comunión de Tokio ha institucionalizado consultas regulares y preferencias comerciales con Beijing."
 JAP_strategic_autonomy_drift: "Drift de autonomía estratégica"
 JAP_strategic_autonomy_drift_desc: "Con el Quad reducido a un diálogo, Japón está recalibrando silenciosamente sus alineamientos lejos de Washington."
 NKO_pro_beijing_regime: "Régimen Pro-Beijing"
 NKO_pro_beijing_regime_desc: "El nuevo gobierno de Pyongyang debe su supervivencia a Beijing. Los asesores chinos se sientan en cada ministerio; El petróleo chino alimenta cada camión."
 pax_sinica: "Pax Sinica"
 pax_sinica_consensus: "Comunidad de Futuros Compartidos"
 pax_sinica_consensus_desc: "Hemos alcanzado la preeminencia mundial a través de décadas de inversión paciente, financiamiento concesional y diplomacia institucional. El orden internacional reconoce nuestra centralidad a través del interés en lugar de la coacción: un mundo ligado a nosotros por el beneficio mutuo, no por la necesidad estratégica."
 pax_sinica_desc: "Estamos en el ápice de un orden global que formamos en nuestros propios términos, con el Franja y la Ruta como tejido conectivo de un nuevo sistema internacional."
 petroyuan_settlement: "Red de asentamientos de Petroyuan"
 petroyuan_settlement_desc: "Los contratos transfronterizos de energía se establecen cada vez más en el renminbi, liberando a nuestra industria de los puntos de cálculo del dólar y acelerando la construcción nacional."
 rmb_reserve_currency: "Renminbi como moneda de reserva"
 rmb_reserve_currency_desc: "El yuan se ha unido a la canasta de monedas de reserva mundial, abriendo mercados de exportación y dando a nuestros bancos la resiliencia para subescribir préstamos globales de recuperación."
 SCO_air_defense_initiator: "Defensa aérea conjunta de la SCO (palabra)"
 SCO_air_defense_initiator_desc: "Como nación líder de la red conjunta SCO Air Defense, este país coordina la vigilancia aérea integrada y la defensa de misiles en todos los estados miembros."
 SCO_air_defense_member: "Defensa aérea conjunta de SCO"
 SCO_air_defense_member_desc: "La participación en la red conjunta de defensa aérea de la OCS proporciona acceso a coberturas por radar compartidas y coordinación antiaéreo."
 SCO_cultural_exchange_bonus: "Intercambio cultural SCO"
 SCO_cultural_exchange_bonus_desc: "Un programa de intercambio académico y cultural está fomentando la colaboración transfronteriza en materia de investigación."
 SCO_dev_bank_initiator: "Banco de Desarrollo de la OCS (fundador)"
 SCO_dev_bank_initiator_desc: "Como fundador del Banco de Desarrollo SCO, este país dirige las corrientes de inversión y tiene acceso privilegiado a la financiación de bajo interés."
 SCO_dev_bank_member: "Banco de desarrollo SCO"
 SCO_dev_bank_member_desc: "La participación en el Banco de Desarrollo de la OCS proporciona acceso a préstamos para el desarrollo y programas conjuntos de inversión."
 SCO_development_assistance: "Asistencia para el desarrollo de la OCS"
 SCO_development_assistance_2: "[CHI.GetAdjective] Asistencia para el desarrollo"
 SCO_development_assistance_2_desc: "China nos ha concedido una asistencia para el desarrollo muy necesaria bajo los auspicios de la Organización de Cooperación de Shanghai."
 SCO_development_assistance_desc: "La Organización de Cooperación de Shanghai está canalizando recursos para el desarrollo hacia este país."
 SCO_energy_deal_income: "Asociación energética SCO"
 SCO_energy_deal_income_desc: "Un acuerdo de suministro energético a largo plazo está generando ingresos constantes."
 SCO_energy_grid_initiator: "SCO Energy Grid (Iniciador)"
 SCO_energy_grid_initiator_desc: "Como iniciador del SCO Energy Grid, este país dirige una red de energía integrada que abarca a los Estados miembros."
 SCO_energy_grid_member: "Cuadrícula de energía SCO"
 SCO_energy_grid_member_desc: "La participación en el SCO Energy Grid proporciona acceso a la infraestructura de energía compartida y reduce los costos energéticos."
 SCO_intel_sharing_bonus: "Compartimiento de inteligencia SCO"
 SCO_intel_sharing_bonus_desc: "Un canal seguro de intercambio de información está mejorando la coordinación contra el terrorismo."
 SCO_joint_drill: "Ejercicios militares conjuntos de la OCS"
 SCO_joint_drill_1: "Ejercicios conjuntos de la OCS (bilaterales)"
 SCO_joint_drill_1_desc: "Los ejercicios militares bilaterales con un socio de la OCS están agudizando la coordinación táctica."
 SCO_joint_drill_desc: "La participación en los ejercicios militares conjuntos de la OCS está mejorando la preparación operacional."
 SCO_joint_drill_specific: "Ejercicios conjuntos de la OCS (Targeted)"
 SCO_joint_drill_specific_desc: "Los ejercicios conjuntos dirigidos con un socio de la OCS están abordando lagunas operacionales específicas."
 SCO_railway_initiator: "Ferrocarril Transeuroasiático (iniciador)"
 SCO_railway_initiator_desc: "Como fuerza motriz detrás del Trans-Eurasian Railway, este país se beneficia de un acceso principal al corredor comercial que abarca el continente."
 SCO_railway_member: "Ferrocarril Trans-Eurasiano"
 SCO_railway_member_desc: "El Trans-Eurasian Railway conecta este país a una red comercial de alta capacidad en toda la zona de SCO."
 SCO_trade_agreement_bonus: "Acuerdo Comercial de la OCS"
 SCO_trade_agreement_bonus_desc: "Un marco comercial bilateral en el marco de la OCS está impulsando la producción industrial civil."
 CHI_airforce_modifier: "Fuerza Aérea del Ejército de Liberación Popular"
 CHI_airforce_modifier_desc: "La rama aérea del Ejército Popular de Liberación, cazas de campaña, bombarderos, aviones de transporte y una red integrada de defensa aérea. Esto representa su doctrina, formación y equipo."
 CHI_belt_and_road_initiative_idea: "Franja y la Ruta Iniciativa"
 CHI_belt_and_road_initiative_idea_desc: "La Iniciativa China Franja y la Ruta, lanzada en 2013, financia la construcción portuaria, corredores ferroviarios, oleoductos, centrales eléctricas e infraestructura digital en Asia, África, Oriente Medio y Europa. Los estados elegibles se aplican para proyectos, fondos de Beijing y los construyen, y cada proyecto completado aumenta la posición de ese socio y la propia posición de China.\n\n[CHIGetBRIPortTier][CHIGetBRIRailwayTier][CHIGetBRIPipelineTier][CHIGetBRITelecomTier][CHIGetBRIMineTier][CHIGetBRIPowerplantTier][CHIGetBRIIndustrialZoneTier][CHIGetBRIPrestigeTier]"
 CHI_bri_state_industrial: "Proyecto industrial BRI"
 CHI_bri_state_industrial_desc: "Un proyecto industrial respaldado por China amplía la capacidad de fábrica local y la extracción de recursos."
 CHI_bri_state_infrastructure: "Proyecto de infraestructura BRI"
 CHI_bri_state_infrastructure_desc: "Un proyecto de infraestructura legado Franja y la Ruta acelera la construcción regional, el trabajo en los muelles y el rendimiento del suministro."
 CHI_coast_guard_standoff: "Guardacostas"
 CHI_coast_guard_standoff_desc: "Los encuentros diarios entre la milicia china y la Guardia Costera japonesa deprimen la actividad económica local."
 CHI_defense_industry: "Industria de Defensa China"
 CHI_defense_industry_desc: "La base industrial de defensa china se construye alrededor de grandes conglomerados estatales que abarcan la producción terrestre, aérea, naval y electrónica, suministrando tanto las fuerzas armadas como el mercado de exportación. Esto representa la capacidad militar-industrial del país."
 CHI_diplomacy_modifier: "Red diplomática china"
 CHI_diplomacy_modifier_desc: "Una postura diplomática variable concede o retira bonos a la ganancia mensual de opinión, relaciones comerciales, proyección naval, eficiencia de suministro, operaciones de influencia extranjera y poder político dependiendo de la profundidad de inversión en la red diplomática china."
 CHI_economy_modifier: "Modelo Económico Chino"
 CHI_economy_modifier_desc: "China opera una economía de mercado socialista que combina la empresa estatal, la industria privada y la planificación central a través de planes quinquenales sucesivos. Esto representa la base industrial, política fiscal y estructura comercial del país."
 CHI_jap_industrial_partnerships: "Sino-Japónese Industrial Partnerships"
 CHI_jap_industrial_partnerships_desc: "La cooperación económica estructurada con el Japón amplía el acceso a cadenas de producción de precisión, automoción avanzada y suministro de electrónica y conocimientos nucleares civiles. La asociación produce avances en el desempeño de las armaduras, agilidad de la energía aérea, velocidad naval, rendimiento de investigación y producción industrial, aunque conlleva sensibilidad política interna dada animosidad histórica."
 CHI_korea_peninsula_modifier: "Estrategia de la península coreana"
 CHI_korea_peninsula_modifier_desc: "China comparte una frontera terrestre con la península de Corea y mantiene vínculos políticos, económicos e inteligencia en toda la región. Esto representa la gestión de las relaciones, seguridad fronteriza y redes de información en su flanco nororiental."
 CHI_landforce_modifier: "Fuerza terrestre del Ejército de Liberación Popular"
 CHI_landforce_modifier_desc: "La rama terrestre del Ejército Popular de Liberación, organizada en brigadas combinadas bajo el sistema de mando teatral. Esto representa su doctrina, formación y equipo."
 CHI_navy_modifier: "Armada del Ejército Popular de Liberación"
 CHI_navy_modifier_desc: "La rama naval del Ejército Popular de Liberación, que comprende naves superficiales, submarinos, portaaviones y el cuerpo marino. Esto representa su composición, doctrina y alcance operativo de la flota."
 CHI_northeast_revitalisation: "Revitalización del noreste"
 CHI_northeast_revitalisation_desc: "La estrategia Revitalise del Nordeste dirige el capital estatal hacia las provincias de Liaoning, Jilin y Heilongjiang, priorizando la industria pesada, la infraestructura energética y la construcción industrial-complejo. Se modernizan las instalaciones de la era soviética y se encargan nuevas capacidades de producción para restaurar el papel de la región como base industrial."
 CHI_political_system: "Sistema Político chino"
 CHI_political_system_desc: "La República Popular China es un Estado de partido único dirigido por el Partido Comunista de China, organizado alrededor del centralismo democrático y una gran burocracia administrativa. Esto representa la estructura de gobernanza, las instituciones del partido y el control estatal."
 CHI_rare_earth_embargoed: "Embargo terrestre grave"
 CHI_rare_earth_embargoed_desc: "Beijing ha reducido las exportaciones de tierras raras críticas a Japón, lo que ha afectado a la producción industrial."
 CHI_rare_earth_embargoed_idea: "Embargo terrestre grave"
 CHI_rare_earth_embargoed_idea_desc: "Beijing ha reducido las exportaciones de tierras raras críticas, acelerando la defensa y las industrias de alta tecnología que dependen del refinamiento chino."
 CHI_rural_development: "Programa de Desarrollo Rural"
 CHI_rural_development_desc: "La inversión dirigida en infraestructura rural, incluidas carreteras, servicios públicos y capacidad administrativa local, acelera la actividad de construcción en los condados designados. El programa reduce la brecha entre los ingresos urbanos y rurales y reduce las tensiones sociales derivadas de una modernización desigual."
 JAP_china_market_partnerships: "Alianzas en el mercado chino"
 JAP_china_market_partnerships_desc: "La integración profunda con el consumidor chino y el mercado industrial mejora la eficiencia de las fábricas japonesas, estabiliza los costos de los bienes de consumo y apoya la cohesión política en casa. La capacidad de producción para la infraestructura civil se expande, y los volúmenes comerciales bilaterales sostienen el crecimiento incluso a medida que la fricción geopolítica en otros lugares crea vientos."
