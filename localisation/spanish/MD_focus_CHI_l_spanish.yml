 TIB_sar_development_modifier: "Desarrollo de la RAE tibetana"
 TIB_sar_development_modifier_desc: "Rastrea el desarrollo económico acumulativo de la Región Administrativa Especial Tibetana, reflejando el crecimiento del turismo de peregrinación, el comercio transfronterizo y los ingresos de extracción de recursos que fluyen hacia la RAE."
