 CHI_special_weapons_general_desc: "El general Leang es uno de los comandantes superiores más versátiles del PLA, combinando experiencia en sistemas avanzados de armas con la doctrina de artillería convencional. Considerada como una prodigio dentro del Estado Mayor, es conocida por su capacidad de integrar tecnología de vanguardia en operaciones de armas combinadas."
