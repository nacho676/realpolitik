 AFG_pomegranate_investment1_collect: "Colección de granadas"
 AFG_pomegranate_investment1_collect_desc: "Los agricultores están listos para que recojamos una carga de granadas."
 AFG_almond_investment1_collect: "Almendro Colección"
 AFG_almond_investment1_collect_desc: "Los agricultores están listos para que recojamos una carga de almendras."
 AFG_almond_investment1: "Invertir en la producción de almendras"
 AFG_almond_investment1_desc: "Las almendras han sido una fuente importante de ingresos para muchos afganos. El gobierno puede invertir en la industria de la almendra aportando infraestructura, transporte y acceso a mercados para los agricultores. Este programa de inversión se limita a 5 iniciativas importantes, después de las cuales el mercado llega a la saturación. Inversión: 5% del PIB, retorno: 6% del PIB (margen de beneficio del 20%)."
 AFG_pomegranate_investment1: "Invertir en la producción de granadas"
 AFG_pomegranate_investment1_desc: "Las granadas de Afganistán son célebres en todo el mundo por su calidad. El gobierno puede invertir en instalaciones de producción y redes comerciales para aprovechar este recurso natural. Este programa de inversión se limita a 5 iniciativas importantes, después de las cuales el mercado llega a la saturación. Inversión: 5% del PIB, retorno: 6% del PIB (margen de beneficio del 20%)."
 AFG_invite_nahzat_e_melli_ye_into_government: "Invitar al Hezb-e-Nuhzhat-e-Mili Afghanistan al gobierno"
 AFG_domestic_decisions: "Objetivos nacionales"
 AFG_domestic_decisions_desc: "Con una nación recuperadora, hemos establecido objetivos para reconstruir el estado y forjar un nuevo futuro."
 AFG_taloqan_siege_mission: "Sosteniendo la ciudad"
 AFG_taloqan_siege_mission_desc: "Asegurar la ciudad es crucial a medida que se reduce nuestro territorio, y las vastas llanuras del noroeste son un blanco atractivo para una futura ofensiva."
 AFG_headquarters_taloqan: "Sede de Taloqan"
 AFG_headquarters_taloqan_desc: "Taloqan surgió como un bastión fundamental para Ahmad Shah Massoud durante la invasión soviética. Posteriormente, se ha convertido en el centro de mando central para [AFG.GetFlag] [AFG.GetNameDefCap], que sirve como punto crucial para el acceso a Tayikistán después de la caída de Mazar-i-Sharif a las fuerzas talibanes en 1997."
 taliban_insurgency_category: "La Insurgencia de los talibanes"
 taliban_insurgency_category_desc: "Aunque las fuerzas £GFX_AFG_salafist_jihadism §Ytalibanes§! fueron derrotadas por las fuerzas de la coalición, no fueron eliminadas por completo, y los militantes talibanes se fragmentaron y lanzaron una §Rinsurgencia§! en todos los rincones de Afganistán y empezaron a llevar a cabo diversos §Rataques terroristas§! contra el nuevo gobierno y las fuerzas de la coalición. Se espera que erradicar la insurgencia talibán lleve años, según muchos factores.\n\nLa §YFuerza talibán§! determina la fuerza de los militantes talibanes dentro del país, y su crecimiento, así como nuestra eficacia para erradicar la insurgencia, dependerán de la §Yconfianza en el gobierno central (estabilidad, corrupción o injerencia extranjera)§! y de la §Ysituación en la frontera afgano-paquistaní§!. Si la §YFuerza talibán§! es demasiado alta, los £GFX_AFG_salafist_jihadism §Ytalibanes§! podrán llevar a cabo §Rataques terroristas§! e incluso escalar a una §Rnueva guerra civil§!, mientras que algunos métodos podrían ser eficaces para frenar la amenaza talibán a corto plazo.\n\n§YFuerza talibán§!: [?AFG.taliban_strength]%"
 AFG_pashtunistan_decisions: "Unifying Pashtunistan"
 AFG_pashtunistan_decisions_desc: "Casi el 16% de la población de Pakistán se identifica como pastún, el grupo étnico dominante de Afganistán. La mayoría de los pastunes paquistaníes viven en el noroeste del país. Debido a la guerra civil en Pakistán, muchos de ellos sufren ahora bajo un régimen aterrador. Es nuestro deber protegerlos."
 AFG_russian_airlift_is_active: "Ruso Airlift"
 AFG_donkey_logistics_tech: "Pack Logística de animales"
 AFG_donkey_logistics_tech_desc: "Las recuas de mulas y burros llevan suministros por pasos adonde ningún camión llega."
 AFG_donkey_logistics_tech2: "Logística con animales de carga II"
 AFG_donkey_logistics_tech2_desc: "Caravanas más grandes y puntos de escala establecidos a lo largo de las rutas del norte."
 AFG_donkey_logistics_tech3: "Logística con animales de carga III"
 AFG_donkey_logistics_tech3_desc: "Un cuerpo de transporte permanente construido en torno a las recuas que nunca dejaron de marchar."
 AFG_legacy_of_the_mujahideen: "El legado de los muyahidines"
 AFG_legacy_of_the_mujahideen_desc: "Los veteranos de la guerra soviética transmiten su pericia de campo a la milicia."
 AFG_tech_the_farmer_and_their_rifle: "El agricultor y su fusil"
 AFG_tech_the_farmer_and_their_rifle_desc: "Levas rurales que luchan por sus propios valles y conocen cada acceso a ellos."
 AFG_tech_training_of_local_police_officers: "Entrenamiento de policías locales"
 AFG_tech_training_of_local_police_officers_desc: "Milicia entrenada tanto para el servicio policial como para el combate y para mantener el terreno una vez tomado."
 AFG_tech_return_of_dostum: "Retorno de Dosto"
 AFG_tech_return_of_dostum_desc: "Dostum ha vuelto al norte, y las milicias uzbekas combaten como tales."
