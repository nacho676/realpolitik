 AFG_ai_Weight_effect_Arms: "¡Su disposición a aceptar es §GFuerte§! por defecto\n\n Es menos probable que [USA.GetName] se alíe con nosotros si\n §R-No sigas el mismo Outlook\n -¡Tienen una opinión baja de [AFG.GetName]§!"
 AFG_ai_Weight_effect_Airlift: "¡Su disposición a aceptar es §GFuerte§! por defecto\n\n Es más probable que acepten si\n §G-[USA.GetLeader] ha anunciado la Operación Libertad Duradera §!\n\n Es menos probable que acepten si\n §R-Si no seguimos la misma perspectiva\n -¡Si tienen mala opinión de nosotros§!"
 AFG_ai_Weight_effect_Iran: "¡Su disposición a aceptar es §GFuerte§! por defecto\n\n Es menos probable que acepten si\n §R-Si no seguimos la misma perspectiva\n -Si tienen mala opinión de nosotros\n -¡Somos sunitas!§!"
 AFG_ai_Weight_effect_div_usa: "¡Su disposición a aceptar es §RWdébil§! por defecto\n\n Es más probable que acepten si\n §GLos drones Predator de CIA están aprobados\n -Seguimos la misma perspectiva.\n -¡Tienen una alta opinión de [AFG.GetNameDefCap]§!"
 AFG_ai_Weight_effect_CIA_drones: "¡Su disposición a aceptar es §GFuerte§! por defecto\n\n Es menos probable que acepten si\n §R-Osama bin Laden está muerto\n -Si no seguimos la misma perspectiva\n -¡Tienen una opinión baja de [AFG.GetNameDefCap]§!"
 AFG_ai_Weight_effect_India_aid: "¡Su disposición a aceptar es §GFuerte§! por defecto\n\n Es menos probable que acepten si\n§R -Si no seguimos la misma perspectiva\n -¡Tienen una opinión baja de [AFG.GetNameDefCap]§!"
 AFG_available_as_leaderTT: "§GDisponible§! como §YLíder Político§!"
 AFG_available_as_MillleaderTT: "§GAsignado§! como §YAlto Comandante Militar§!"
 AFG_import_westernism: "Importar occidentalismo"
 AFG_import_westernism_desc: "Afganistán se ha aferrado durante mucho tiempo a sus valores tradicionales. Sin embargo, la reciente apertura a nuevas ideas nos ha permitido incorporar selectivamente aspectos de conceptos occidentales. Este enfoque nos permite aprovechar una amplia gama de ideas occidentales, eligiendo aquellas que se alinean con nuestras necesidades únicas y rechazando aquellas que no se ajustan a nuestro contexto."
 AFG_atta_installs_leadership: "Atta Muhammad Nur asume el liderazgo"
 AFG_atta_installs_leadership_desc: "De señor de la guerra a comandante, a Atta Muhammad Nur no le gusta que le digan lo que tiene que hacer."
 AFG_liberal_society: "Sociedad liberal"
 AFG_afghan_morning_taliban_by_night: "A.N.A. de día, talibanes de noche"
 AFG_afghan_morning_taliban_by_night_desc: "Gran parte de nuestro personal en el Ejército Nacional Afgano vive una doble vida. Muchos de ellos se unen al Talibán mientras prestan servicio en el ejército, lo que les otorga una gran ventaja sobre nuestras fuerzas. Esta corrupción ha propiciado la corrupción masiva en nuestras fuerzas armadas y ha mermado considerablemente la moral de quienes luchan por la nación."
 AFG_safed_koh_supply_network: "Red de suministro de Safed Koh"
 AFG_safed_koh_supply_network_desc: "Utilizando una red compleja de carreteras, montañas y cuevas subterráneas, la red de suministro de Safed Koh ha suavizado el impacto del terreno duro y aislado de la región."
 AFG_tal_insurgency_new: "[TAL.GetFlag] Insurgencia talibán"
 AFG_tal_insurgency_new_desc: "Los talibanes se han retirado a las afueras orientales del Afganistán tras varias derrotas. Están cavando, preparándose para una guerra guerrillera desenfrenada y sangrienta. La fuerza talibán está directamente ligada a sus modificadores defensivos &. Si tienen más del 30% de fuerza para cuando Estados Unidos se retire, lanzarán una invasión a gran escala una vez más.\n\n£AFG_salafist_jihadism §H Fuerza de los talibanes - [?AFG.taliban_attack_strength|%]§!"
 TAL_move_into_tribal_areas: "Avance hacia las zonas tribales pakistaníes"
 TAL_move_into_tribal_areas_desc: "Para sobrevivir, necesitaremos desplegar nuestras fuerzas para evitar concentrarnos en una sola zona. Las zonas tribales son el escondite perfecto, ya que tendremos fácil acceso a una buena cordillera."
 AFG_414_attack_1207: "Ataque a bastiones talibanes"
 AFG_414_attack_1207_desc: "Aunque no podamos erradicar a los talibanes, podremos debilitar su fuerza... si tenemos éxito."
 TAL_1207_attack_1154: "Huelga en Kunar"
 TAL_1207_attack_1208: "Impulso hacia Qalat"
 AFG_414_attack_1208: "Retoma Qalat"
 AFG_414_attack_1154: "Retomar Kunar"
 PAK_objected: "Damos marcha atrás tras las objeciones de Pakistán [PAK.GetFlag]"
 AFG_doing_border_raid: "Actualmente realizando una redada fronteriza"
 TAL_money: "Fondos talibanes"
 AFG_agriculture_mech: "Agricultura"
 AFG_agriculture_mech_desc: "Las almendras y las granadas son las únicas exportaciones afganas que el mundo comprará sin dudar. El dinero del Estado invertido en huertos, transporte y compradores convierte la cosecha de un campesino en ingresos para el tesoro."
 AFG_pomegranate_return_tt: "Rendimientos: §G+6%§! del PIB al §YTesoro§!"
 AFG_almond_return_tt: "Devoluciones: §G+8%§! del PIB a §YTraspería§!"
 AFG_pomegranate_investment_limit_tt: "Inversiones restantes de granada: §Y[?AFG_pomegranate_investments]/5§!"
 AFG_almond_investment_limit_tt: "Inversiones en almendras restantes: §Y[?AFG_almond_investments]/5§!"
 TAL_1207_attack_1154_desc: "Enviar combatientes desde la cordillera de Safed Koh hacia Kunar para debilitar a la guarnición afgana antes de que pueda atrincherarse."
 TAL_1207_attack_1208_desc: "La presión desde Safed Koh contra Qalat. El control de la carretera en este punto divide a las fuerzas gubernamentales en el sureste del país."
 TAL_1152_attack_415: "Invadir Sistán"
 TAL_1152_attack_415_desc: "Conducir hacia el oeste desde Registán hacia Sistán, amenazando el control del gobierno sobre la frontera desértica con Irán."
 AFG_415_attack_1152: "Borrar registro"
 AFG_415_attack_1152_desc: "Contraataque desde Sistán para retomar el desierto de Registán y negar a los talibanes su base de operaciones."
 AFG_412_attack_415: "Liberen Sistán"
 AFG_412_attack_415_desc: "Avanzar desde Hazarajat para expulsar a los talibanes de Sistán y restablecer el control gubernamental en las provincias del sur."
 TAL_construct_the_safed_koh_system: "Construir la red de suministro de Safed Koh"
 TAL_construct_the_safed_koh_system_desc: "Excavar escondites, túneles y senderos para mulas a través de la cordillera de Safed Koh para mantener abastecidos a los combatientes fuera del alcance de las patrullas afganas."
 TAL_begin_insurgency_in_registan: "Abran el frente de Registán"
 TAL_begin_insurgency_in_registan_desc: "Despliega columnas de milicianos a través del desierto de Registán y toma la provincia, abriendo un segundo frente en el sur."
 TAL_begin_war_again: "Relanzar la guerra"
 TAL_begin_war_again_desc: "Una vez retiradas las tropas extranjeras y restaurada nuestra fuerza, abandonemos el alto el fuego y marchemos sobre Kabul para poner fin a la guerra."
 AFG_taliban_insurgency_eliminated: "La insurgencia talibán ha sido eliminada."
 AFG_active_taliban_insurgency: "La insurgencia talibán está activa."
 wot_supporting_afghan_counter_insurgency: "Apoyo a la contrainsurgencia afgana"
 AFG_civil_war_shortcut: "Guerra civil"
 AFG_panjshir_shortcut: "Panjshir"
 AFG_foreign_policy_shortcut: "Política exterior"
 AFG_government_shortcut: "Gobierno"
 AFG_reconstruction_shortcut: "Reconstrucción"
 AFG_national_policy_shortcut: "Política nacional"
 AFG_national_assembly: "Asamblea Nacional"
 AFG_anjuman_pass: "El León de Panjshir"
 AFG_law_of_faith: "Ley de la fe"
 AFG_law_of_faith_idea: "Ley de la fe"
 AFG_law_of_faith_idea_desc: "La ley religiosa está escrita en el libro de estatutos. El clero está satisfecho y el campo responderá a un llamado a las armas, pero el espacio político para cualquier cosa fuera del consenso ha cerrado."
 AFG_law_of_faith_desc: "La Ley de la Fe prevalecerá en nuestro estado para reforzar nuestros principios islámicos dentro del Estado. Nuestro pueblo será guiado por nuestras creencias islámicas para mantener nuestro estado puro y justo."
 AFG_training_of_local_police_officers: "Capacitación de oficiales locales de policía"
 AFG_training_of_local_police_officers_desc: "En preparación para la posible liberación y estabilización del Afganistán, la Alianza del Norte debe establecer una fuerza de policía disciplinada y eficaz. Esta fuerza será crucial para mantener la ley y el orden en los territorios que pretendemos recuperar."
 AFG_heirs_o_the_mujahideen: "Herederos de los Mujahideen"
 AFG_heirs_o_the_mujahideen_desc: "Partiendo de la inspiración de los legendarios luchadores del pasado, el liderazgo actual busca revivir el espíritu y las tácticas de los Mujahideen."
 AFG_the_lions_guard: "La Guardia del León"
 AFG_the_lions_guard_desc: "Ha surgido un nuevo equipo de tareas para prevenir posibles ataques contra Ahmad Shah Massoud en respuesta a preocupaciones inminentes de amenaza."
 AFG_the_francesc_vendrell_talks: "Francesc Vendrell Talks"
 AFG_the_francesc_vendrell_talks_desc: "En Dushanbe, Tayikistán, ONU. El Enviado Especial Francesc Vendrell mantiene conversaciones de paz con líderes afganos clave: el comandante de la Alianza del Norte, Ahmed Shah Masood, ex gobernador Nangarhar Haji Abdul Qadeer, y el ex miembro del gobierno Rabbani Syed Hussain Anwari, discutiendo los males de Muhammad Asif Mohseni."
 AFG_assault_on_mazar_i_sharif: "Asalto a Mazar-i-Sharif"
 AFG_assault_on_mazar_i_sharif_desc: "La importante ciudad de Mazar-i-Sharif debe ser recapturada, y podemos reunir a nuestros hombres para darles un impulso para hacerlo."
 AFG_massoud_s_mig_and_sukho: "Massoud MiG y Sukhoi"
 AFG_massoud_s_mig_and_sukho_desc: "El apoyo de India ha sido encubierto. India ha estado ayudando a Massoud con dinero, equipo de radar y piezas de avión por algún tiempo. They have sent about 30 technicals who are reportedly maintaining Massoud's MiG and Sukhoi fighter aircraft. Los asesores militares indios también dieron consejos sobre la lucha contra los talibanes. Sin saberlo, la ayuda india se ha convertido en un pilar de las fuerzas de Massoud."
 AFG_russian_air_lift_idea: "Russian Airlift"
 AFG_russian_air_lift_idea_desc: "Los brazos y los repuestos soviéticos están entrando en el aire de Rusia. Nuestras tripulaciones ya conocen el equipo, por lo que llega al frente barato y sin reentrenar."
 AFG_russian_air_lift: "Russian Airlift"
 AFG_russian_air_lift_desc: "Rusia ha mantenido una alianza encubierta de larga data con la Alianza del Norte, proporcionando armas y suministros esenciales para apoyar a los restos de nuestro gobierno. Ayer, el Ministro de Defensa Ruso, Sergei Ivanov, anunció que equiparían a nuestras milicias con un conocido equipo de la era soviética con el que ya conocen los miembros de la Alianza del Norte."
 AFG_mil_mi_24_gunships: "Mil Mi-24 Ataque Helicóptero"
 AFG_mil_mi_24_gunships_desc: "Rusia ha anunciado planes para suministrarnos 12 helicópteros de ataque Mil Mi-24, que proporcionarán un valioso apoyo a nuestros esfuerzos para avanzar contra los talibanes."
 AFG_cia_predator_surveillance_drones: "Aviones de vigilancia de la CIA Predator"
 AFG_cia_predator_surveillance_drones_idea: "Aviones de vigilancia de la CIA Predator"
 AFG_cia_predator_surveillance_drones_idea_desc: "Los aviones no tripulados americanos están sobre los pases y alimentándonos lo que ven. Planeamos alrededor de la inteligencia real por primera vez, y nuestras propias redes crecen por detrás de las suyas."
 AFG_cia_predator_surveillance_drones_desc: "Los drones de vigilancia de la CIA Predator han sido instrumentales para proporcionar una amplia cobertura del terreno, identificar puntos clave de interés y señalar objetivos hostiles."
 AFG_appeal_to_washington_for_support: "Llamamiento a Washington para apoyar"
 AFG_appeal_to_washington_for_support_desc: "Ante el conflicto en curso y la amenaza que plantean las facciones extremistas, el Afganistán debe buscar el apoyo de los aliados internacionales para fortalecer sus capacidades militares."
 AFG_imu_countermeasures: "Contramedidas de la UCI"
 AFG_imu_countermeasures_desc: "Para contrarrestar esta amenaza, el Afganistán busca asistencia de Uzbekistán para realizar ataques aéreos selectivos contra las fortalezas de la UI. Esta colaboración pretende debilitar las capacidades del IMU, interrumpir sus operaciones y restaurar la seguridad en las regiones fronterizas."
 AFG_shura_system: "Reforzar el sistema Shura"
 AFG_shura_system_desc: "Fortalecer el sistema Shura dentro de la Alianza del Norte es crucial para mantener la unidad y una gobernanza eficaz. Al reforzar esta estructura tradicional de toma de decisiones basada en los consejos, aseguramos que todas las facciones estén representadas."
 AFG_anjuman_pass_desc: "Ahmad Shah Massoud, también conocido como el León de Panjshir, es un símbolo de resistencia y liderazgo táctico. Al reunir sus ideas, la nación pretende adoptar sus estrategias, inspirar a las tropas y solidificar sus defensas. Sus principios de liderazgo tienen y guiarán al Afganistán a través de sus luchas actuales."
 AFG_ghanis_plan: "Plan de Ghani"
 AFG_ghanis_plan_desc: "Ghani está poniendo en marcha un plan para reducir el apoyo de los talibanes mediante acciones militares y proyectos de desarrollo dirigidos a estabilizar las regiones clave y restablecer el control gubernamental."
 AFG_secretly_support_the_opium_industry: "Soporte Secreto para la industria del opio"
 AFG_secretly_support_the_opium_industry_desc: "Bajo el pretexto de la industrialización, nuestra base urbana creerá que nos dirigimos hacia una nueva era de modernización. Sin embargo, no podemos alienar la fundación de la nación, los agricultores. Apoyaremos en secreto el comercio de opio como medio para mejorar nuestra prosperidad económica y apaciguar cada parte de la sociedad afgana."
 AFG_parliamentary_illusion: "Ilusión parlamentaria"
 AFG_parliamentary_illusion_idea: "Ilusión parlamentaria"
 AFG_parliamentary_illusion_idea_desc: "La cámara se sienta, debate y votos, y no decide nada que importe. Nos cuesta poco mantenernos, y la apariencia del consentimiento vale más que la realidad."
 AFG_parliamentary_illusion_desc: "¿Para qué es el parlamento? Bueno, es para apaciguar a nuestra gente creer que tienen una opinión en su gobierno. No podemos descartar completamente el proceso democrático, pero somos capaces de manipularlo para satisfacer mejor nuestras propias necesidades."
 AFG_the_western_kleptocracy: "La Kleptocracia Occidental"
 AFG_ashraf_ghani: "Los Ahmadzai"
 AFG_ashraf_ghani_desc: "Ashraf Ghani ha sido elegido como nuevo Presidente del Afganistán. Con un mandato de reforma, busca estabilizar la nación y reconstruir sus instituciones."
 AFG_endorse_the_american_candidate: "Endorse el candidato americano"
 AFG_endorse_the_american_candidate_desc: "Con el gobierno de transición que llega a su fin, el control de Hamid Karzai sobre el gobierno sigue siendo fuerte. Como candidato elegido del acuerdo de Bonn, Karzai ha formado un amplio gobierno en torno a la reconstrucción del Afganistán y la promoción de una paz duradera con nuestros nuevos aliados estadounidenses."
 AFG_the_new_chairman: "El nuevo Presidente"
 AFG_the_new_chairman_desc: "A medida que pasa el ciclo electoral, el jefe de Estado no sólo debe controlar sino también servir como rostro de la nación. Con la oficina abierta, Karzai debe tomar el mando y dirigir Afganistán por ejemplo."
 AFG_aptta: "APTTA"
 AFG_aptta_desc: "El Acuerdo sobre el Comercio de Tránsito entre Afganistán y Pakistán o APTTA es un acuerdo comercial bilateral entre el Pakistán y el Afganistán, firmado bajo la administración Karzai. Este acuerdo tiene por objeto impulsar el comercio entre los dos países, apoyar las operaciones de lucha contra el terrorismo y lograr el desarrollo en las regiones fronterizas."
 AFG_saarc_membership: "SAARC Miembros"
 AFG_saarc_membership_idea: "SAARC Miembros"
 AFG_saarc_membership_idea_desc: "Un asiento en la mesa del sur de Asia. El crédito es más barato, la base tributaria es más estable y Kabul se considera como un vecino en lugar de un problema."
 AFG_saarc_membership_desc: "La pertenencia de Afganistán a la Asociación del Asia Meridional para la Cooperación Regional o SAARC demuestra la integración del país en el marco económico y político regional. También ofrece la oportunidad de sacar al Afganistán de la caza furtiva."
 AFG_rebuilding_the_state: "Reconstrucción del Estado"
 AFG_rebuilding_the_state_desc: "Después de la caída del Talibán, uno de los principales objetivos de la construcción nacional en el Afganistán es restaurar y reconstruir el estado desde el suelo. Afganistán, un estado con una economía fallida y poco a ninguna vía pavimentada o líneas ferroviarias, debe ser reconstruido ahora en un país que pueda ocupar su lugar en el orden mundial."
 AFG_drafting_the_constitution: "Redacción de la Constitución"
 AFG_drafting_the_constitution_desc: "La firma de la Constitución marca un importante punto de inflexión para el Estado, ya que pone a la pluma en papel para solidificar los pasos que garantizan los derechos humanos."
 AFG_national_solidarity_program: "Programa nacional de solidaridad"
 AFG_national_solidarity_program_desc: ", el Programa Nacional de Solidaridad Afgano o el Plan Nacional de Acción Nacional para la Rehabilitación y desarrollar alrededor de 5,000 aldeas en el Afganistán, con $900 millones de años escalonados a lo largo de tres años, Instituciones democráticamente elegidas y supervisar los esfuerzos de reconstrucción"
 AFG_reformist_path: "Sendero reformista"
 AFG_reformist_path_desc: "El camino reformista pretende sustituir a los ancianos por lo nuevo, y no hay mejor momento para esto que ahora, ya que Afganistán sigue en las primeras etapas de la construcción nacional."
 AFG_next_in_line_of_succession: "Siguiente en Línea de Sucesión"
 AFG_next_in_line_of_succession_desc: "A medida que el mandato de Hamid Karzai llega a su fin, un sucesor debe entrar para ocupar su lugar."
 AFG_sway_local_warlords: "Los señores de guerra locales"
 AFG_sway_local_warlords_desc: "Los caudillos locales han dominado el liderazgo afgano desde la invasión soviética, y eliminarlos no será fácil. En su lugar, debemos identificar y colaborar con los fuertes clave para fortalecer nuestra posición."
 AFG_the_islamic_republic: "La República Islámica"
 AFG_the_islamic_republic_desc: "A medida que el estado de Afganistán se desvanece, comienza una nueva era para la república, marcando un nuevo comienzo y una nueva forma para nuestra nación."
 AFG_the_mujahideen: "El Mujahideen"
 AFG_the_mujahideen_desc: "El Mujahideen, o el Mujahideen afgano, es una amplia coalición de antiguos comandantes de resistencia y señores de guerra, muchos de los cuales apoyaron a la antigua Alianza del Norte. Debemos centrarnos en mantener el status quo."
 AFG_age_of_republican_leadership: "Nueva dirección de edad"
 AFG_age_of_republican_leadership_desc: "Con la creación de la República Islámica, debemos eliminar a viejos comandantes de guerra a favor de nuevos oficiales para las nuevas fuerzas nacionales de defensa."
 AFG_islamic_democracy: "Democracia islámica"
 AFG_islamic_democracy_desc: "El nuevo capítulo continúa con la sociedad islámica tomando su manto sobre el estado de Afganistán, esperanzadamente en el futuro. Sin embargo, ahora no es un momento para el descanso, ya que los señores de la guerra y las figuras de pandillas van por la nación, planteando una amenaza al alinearse con fuerzas talibanes."
 AFG_reinforce_the_government: "Reforzar el Gobierno"
 AFG_reinforce_the_government_desc: "Con nuestro nuevo control sobre las regiones del sur de la nación, creemos que es un buen comienzo para dirigir la oposición y llevar nuestra dirección a la luz de muchos."
 AFG_agricultural_modernisation: "Modernización agrícola"
 AFG_agricultural_modernisation_desc: "La modernización de las técnicas de riego, mecanización y agricultura aumentaría la producción en nuestras provincias rurales y daría al Tesoro una nueva fuente de ingresos del sector agrícola."
 AFG_the_farmer_and_their_rifle: "El Agricultor y su Rifle"
 AFG_the_farmer_and_their_rifle_desc: "Con la sed de cortar sangre y hueso para proteger su patria, los habitantes rurales de Afganistán han demostrado ser una columna vertebral del estado. Perder el apoyo de esta comunidad sería el primer dominó que conduce a nuestra caída."
 AFG_inheritor_of_afghanistan: "Inheritor of Afghanistan"
 AFG_inheritor_of_afghanistan_desc: "El Afganistán sólo ha sido verdaderamente pacífico bajo nuestro gobierno. Nos hemos convertido en los herederos del Estado afgano y debemos elogiar por este logro, no descartado por las potencias mundiales."
 AFG_second_man_of_the_state: "Segundo hombre del Estado"
 AFG_second_man_of_the_state_desc: "Al ser un antiguo comandante de resistencia, Atta ha tenido un gran interés en el poder. Se ha establecido como un líder distinto del Afganistán y no se ha alejado de entablar conflictos a gran escala con otros caudillos."
 AFG_dismantle_the_warlords: "Desmantelar a los señores de la guerra"
 AFG_dismantle_the_warlords_desc: "Los ladrones y gángsteres dirigen ciertas regiones de la nación. Para que realmente nos transformemos en un estado nacional moderno, debemos hacer un esfuerzo para abordar esta cuestión de señores de la guerra."
 AFG_a_tolerant_state: "A un Estado tolerante"
 AFG_a_tolerant_state_desc: "Afganistán es el hogar de una multitud de personas diferentes. Debemos cumplir nuestras promesas de considerar a todos los afganos como uno y estar unidos en su conjunto."
 AFG_naveen: "Naveen"
 AFG_naveen_desc: "El Partido Nuevo Afganistán, o Naveen, es un partido político en Afganistán dirigido por Yunus Qanuni. El partido fue fundado cuando Qanuni se trasladó del Movimiento Nacional de Afganistán, dirigido por Ahmad Wali Massoud. Yunus Qanuni pretende continuar la mentalidad de la Alianza del Norte."
 AFG_new_class_of_jam_iat_reformers: "Nueva clase de reformadores de Jam'iat"
 AFG_new_class_of_jam_iat_reformers_desc: "Yunus Qanuni representa una nueva ola de reformadores Jam'iat que están más abrazando los valores islámicos y tradicionales. Este grupo tiende a adoptar un enfoque más reformista, centrándose en el cambio gradual y no en la conversión agresiva."
 AFG_counite_masouds_works: "Continuar el trabajo de Massoud"
 AFG_counite_masouds_works_desc: "Con la derrota de la Alianza del Norte y el fin del liderazgo de Massoud, seguimos comprometidos a preservar el espíritu de la Alianza del Norte mientras nos esforzamos por construir un Afganistán moderno."
 AFG_foster_innovation: "Fomento de la innovación"
 AFG_foster_innovation_desc: "Como exministro de Educación, Yunus Qanuni entiende la necesidad crítica de innovación en el sector educativo."
 AFG_combat_electoral_corruption: "Lucha contra la corrupción electoral"
 AFG_combat_electoral_corruption_desc: "En Afganistán, los funcionarios han utilizado a menudo el soborno para acumular riqueza y mantener su poder. Desde este punto de vista, debemos asegurarnos de que el fraude electoral ya no sea tolerado."
 AFG_empowering_provincial_governance: "Empoderamiento de la gobernanza provincial"
 AFG_empowering_provincial_governance_desc: "Es esencial potenciar la gobernanza provincial en el Afganistán. Como lo demuestra Alemania, la gobernanza descentralizada permite a las regiones progresar y ponerse al día con el resto de la nación."
 AFG_centralise_the_apparatus_of_the_state: "Centralizar el aparato del Estado"
 AFG_centralise_the_apparatus_of_the_state_desc: "La centralización fortalecerá nuestro control, asegurando que todos los exámenes y la oposición sean gestionados directamente por nosotros."
 AFG_expand_the_education_ministry: "Ampliar el Ministerio de Educación"
 AFG_expand_the_education_ministry_desc: "Ampliar el Ministerio de Educación beneficiaría enormemente a nuestro estado fomentando una mano de obra más cualificada y desarrollando una sociedad más educada."
 AFG_propose_a_new_constitution: "Proponer una nueva Constitución"
 AFG_propose_a_new_constitution_desc: "La actual constitución afgana no cumple las normas modernas y requiere una enmienda significativa."
 AFG_embezzle_foreign_funds: "Fondos de Relaciones Exteriores"
 AFG_embezzle_foreign_funds_desc: "La inclusión de fondos extranjeros ha sido un método para mantener un control estricto sobre la nación y sostener nuestra gobernanza junto con la Asamblea Nacional."
 AFG_enforce_afghan_centralism: "Cumplimiento del centralismo"
 AFG_enforce_afghan_centralism_desc: "Los afganos son un pueblo rural y tribal, y históricamente han reaccionado negativamente hacia cualquier forma de centralización. Pero ¿cómo puede nuestro gobierno ser de cualquier utilidad si estamos limitados por lo que podemos, y no podemos hacer? Debemos bajar el pie y hacer cumplir el centralismo."
 AFG_urban_tribal_divisions: "Concesiones a los líderes de Shura"
 AFG_urban_tribal_divisions_desc: "Al trasladar a algunos de nuestros tribunos a zonas urbanizadas, podremos dar a ciertas regiones una mayor autonomía y control sobre sus regiones ya que estarán más organizadas."
 AFG_atlanticism: "Atlanticism"
 AFG_atlanticism_desc: "El atlántico es la creencia en estrecha cooperación entre América del Norte y Europa, una doctrina que tuvo lugar después de la Segunda Guerra Mundial. El Afganistán desea adoptar un modelo más occidental en términos de progreso y gobernanza."
 AFG_arsenal_of_democracy: "Arsenal de la democracia"
 AFG_arsenal_of_democracy_desc: "Con el auge de la economía armamentista estadounidense, debemos aprovechar esto para nuestra ventaja reforzándonos y preparándonos para los desafíos que nos esperan."
 AFG_the_republic_survives_another_day: "La República sobrevivió otro día"
 AFG_the_republic_survives_another_day_desc: "A medida que la noche se desvanece al día, la bandera del pueblo afgano es fuerte. Listo para lo que se avecina, sea paz o guerra. Una cosa sigue siendo cierta: la república soportará hasta su último aliento."
 AFG_defenders_of_democracy: "Defensores de la democracia"
 AFG_defenders_of_democracy_desc: "Desde un estado con poco concepto de democracia a un nuevo régimen que abraza plenamente es sin precedentes. Debemos cumplir con nuestro deber y proteger a esta nación y sus ideales a toda costa."
 AFG_root_out_the_old_cabinet: "Saca el viejo gabinete."
 AFG_root_out_the_old_cabinet_desc: "Los de las oficinas anteriores siguen en el sistema parlamentario. Debemos desarmarlos y exponerlos por los fraudes que son."
 AFG_moderate_islamism: "Islamismo moderado"
 AFG_moderate_islamism_desc: "El islamismo moderado se refiere a un enfoque pasivo o tradicional del Islam, diferenciandolo de interpretaciones más radicales y revolucionarias."
 AFG_basej_e_milli: "La tendencia verde"
 AFG_basej_e_milli_desc: "Basej-e Milli, alternativamente conocido como Rawand-e Sabz-e Afganistán, es un partido político anti-Taliban, nacionalista afgano y prodemocracia. Desempeña un papel importante en la promoción de un futuro democrático y una unidad nacional en el Afganistán."
 AFG_knife_to_the_warlords: "Cuchillo a los señores de la guerra"
 AFG_knife_to_the_warlords_desc: "Los caudillos plagan a esta nación y son un concepto anticuado. Afirman actuar en nombre del pueblo, pero todos estamos en contra de ellos."
 AFG_standardised_taxation: "Tributación estandarizada"
 AFG_standardised_taxation_desc: "La tributación estandarizada permitirá que nuestra economía rebote de años de guerra."
 AFG_enlist_the_support_of_the_people: "Enlistar el Apoyo del Pueblo"
 AFG_enlist_the_support_of_the_people_desc: "Alistar el apoyo del pueblo salvará a la república de las amenazas que se avecinan."
 AFG_recraft_the_healthcare_system: "Realizar el Sistema de Salud"
 AFG_recraft_the_healthcare_system_desc: "Los hospitales son viejos y necesitan restauración y reparación. Debemos hacer nuestra parte para abordar esta cuestión."
 AFG_local_organisation: "Organización local"
 AFG_local_organisation_desc: "Debemos reunirnos para ser autosuficientes y no depender del apoyo del resto del mundo."
 AFG_lift_the_press_restrictions: "Levantar las restricciones de la prensa"
 AFG_lift_the_press_restrictions_desc: "Una prensa libre e independiente es la piedra angular de una sociedad vibrante y democrática."
 AFG_progressive_tax: "A Tributación Progresiva"
 AFG_progressive_tax_desc: "Para asegurar una distribución justa de la riqueza y los recursos, el Afganistán adopta un sistema tributario progresivo."
 AFG_return_of_dostum: "Retorno de Dosto"
 AFG_return_of_dostum_desc: "El general Abdul Rashid Dostum, un prominente líder militar afgano y una figura influyente, está volviendo a la etapa nacional. Es conocido por su formidable mando de las fuerzas uzbecas y por su acumen estratégico."
 AFG_mission_to_tehran: "Misión a Teherán"
 AFG_mission_to_tehran_desc: "En un intento por fortalecer las alianzas regionales y contrarrestar las amenazas externas, el Afganistán está iniciando una misión diplomática en Teherán. Al unirse al eje de Resistencia dirigido por Irán, Afganistán tiene como objetivo asegurar aliados poderosos, potenciar sus capacidades militares y reforzar su posición geopolítica."
 AFG_take_command_of_rabbanis_feyzabad_forces: "Comandando las Fuerzas Feyzabad de Rabbani"
 AFG_take_command_of_rabbanis_feyzabad_forces_desc: "Las fuerzas de Burhanuddin Rabbani estacionadas en Feyzabad son cruciales para controlar las regiones del noreste de Afganistán. Al tomar el mando directo de estas fuerzas, la dirección central pretende unificar las estructuras de mando, mejorar la coordinación y reforzar la defensa de esta área estratégicamente importante."
 AFG_karim_khalilis_new_offensive: "La nueva ofensiva de Karim Khalili"
 AFG_karim_khalilis_new_offensive_desc: "Karim Khalili, destacado líder y estratega, encabeza una audaz nueva ofensiva para recuperar territorios clave y hacer retroceder a las fuerzas hostiles. Su plan combina tácticas de guerrilla, movilización de milicias locales y coordinación estratégica con fuerzas aliadas."
 AFG_western_klep_tt1: "§YContratación de ayuda extranjera§! sobre los efectos §YIngresos adicionales§! $§G0.18§! Billion"
 AFG_state_northern_stronghold_dynamic_modifier: "Puertas del paso de Anjuman"
 AFG_taliban_assault_on_taloqan: "Taliban Asalto en Taloqan"
 AFG_state_battle_for_mazar_i_sharif_dynamic_modifier: "Ofensivo Mazar-i-Sharif"
 AFG_increase_road_toll_tt: "Aumentar los peajes de carretera\nNivel de peaje: [?AFG_toll_level]\nGanancia monetaria estatal: $§G[?AFG_Toll_display_var] §!\nBienes de consumo: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_increase_road_toll_tt_desc: "Los niveles de peaje pueden elevarse hasta cinco veces, cada vez que aumentan los ingresos generados por las carreteras estatales sobre la base del tráfico y el volumen de mercancías negociadas. Cada nivel por encima de los primeros costos §Y2%§! bienes de consumo a nivel nacional, reflejando la carga que pesa sobre la economía más amplia."
 AFG_lower_road_toll_tt: "Disminuir los peajes de carretera\nNivel de peaje: [?AFG_toll_level]\nGanancia monetaria estatal: $§G[?AFG_Toll_display_var] §!\nBienes de consumo: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_lower_road_toll_tt_desc: "La reducción de un nivel de peaje da el §Y2%§! bienes de consumo que costó, al precio de los ingresos que ese nivel ganaba. Los peajes no pueden bajarse por debajo del primer nivel."
 AFG_toll_below_maximum_tt: "Los peajes de este estado son §R en el nivel más alto§!."
 AFG_toll_above_minimum_tt: "Los peajes de este estado son §R en el nivel más bajo§!."
 AFG_info_box: "§GTollage§!\nNivel de peaje: [?AFG_toll_level]\nGanancia monetaria estatal: $§G[?AFG_Toll_display_var]§!\nGanancia monetaria nacional de peaje: $§G[?ROOT.additional_income_AFG_tolls_income1]§!\nBienes de consumo nacionales: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_info_box_desc_lore: "Las carreteras afganas son controladas por grupos como los talibanes y jefes de guerra locales que utilizaron peajes locales para generar ingresos procedentes de rutas comerciales que conectan Asia central, Irán y Pakistán. Estos peajes, arraigados en las tradiciones de la Ruta de la Seda, son una importante fuente de financiación tanto para el régimen talibán como para los señores de guerra, con el control de caminos clave siendo cruciales para el poder y la riqueza."
 AFG_usa_equipment: "Participación de la CIA"
 AFG_usa_equipment_desc: "A los americanos no les gusta la posición que los talibanes tienen actualmente, y por lo tanto se han ofrecido a vender algunos equipos a nosotros en el barato."
 AFG_join_sco: "Únase a la SCO"
 AFG_join_sco_desc: "La OCS está encabezada por China y Rusia, y es una organización que hace hincapié en la paz regional, la seguridad, la lucha contra el terrorismo y la cooperación económica. Puede proporcionar muchos de los recursos que consideramos necesarios para nuestro país, como las simulacros de lucha contra el terrorismo y la asistencia para el desarrollo. Deberíamos unirnos a la SCO para el beneficio de nuestro país."
 AFG_the_western_kleptocracy_desc: "¿Cambio? ¿Quién necesita cambio? Tenemos a Occidente para ayudarnos y la situación mejorará según lo planeado."
 AFG_liberal_society_desc: "El agarre del establecimiento clerical ha dado a Kabul una prensa, un bazar y un argumento público. Los socios comerciales nos toman más en serio por ello, aunque el capital político gastado manteniendo la línea es real."
 AFG_preserve_democracy: "Preservar la democracia"
 AFG_preserve_democracy_desc: "Con la prensa inquebrantable y los tribunales dejados solos, a la república se le está dando una verdadera oportunidad de echar raíces antes de las próximas pruebas de crisis."
 AFG_indian_support_and_arms_trade: "Apoyo indio y soporte de armas"
 AFG_indian_support_and_arms_trade_desc: "Los indios han acordado apoyar y armar a nuestra nación contra nuestros enemigos."
 AFG_establishing_supply_lines: "Establecimiento de líneas de suministro"
 AFG_establishing_supply_lines_desc: "Al establecer líneas de suministro bien cuidadas y bien mantenidas, nuestras tropas serán suficientemente abastecidas para seguir luchando."
 AFG_russian_technical_specialists: "Especialistas técnicos rusos"
 AFG_russian_technical_specialists_desc: "Hemos traído especialistas de [SOV.GetFlag] Rusia para trabajar en nuestras unidades mecanizadas."
 AFG_the_shura_system_idea: "El sistema Shura"
 AFG_the_shura_system_idea_desc: "El sistema Shura en la Alianza del Norte es una forma tradicional de gobernanza basada en los consejos, arraigada en prácticas tribales y comunitarias de toma de decisiones. Este sistema reúne a líderes militares, ancianos tribales y personalidades influyentes para deliberar y tomar decisiones colectivas. El sistema Shura mejora la unidad y garantiza que varias facciones dentro de la Alianza del Norte estén representadas y tengan voz en asuntos estratégicos y políticos."
 AFG_civilian_exodus_taloqan: "Civil Exodus Taloqan"
 AFG_civilian_exodus_taloqan_desc: "La lucha alrededor de Taloqan ha empujado a miles de familias al norte y al oeste. Los campamentos tensan lo poco que podemos ahorrar, pero los refugiados llevan la provincia con ellos, y menos bocas en la línea alivia nuestro suministro."
 AFG_iranian_airbridge: "Iranian Airbridge"
 AFG_iranian_airbridge_desc: "Después de que los talibanes incautaron a Kabul, la ayuda de Irán a la Alianza del Norte aumentó. Irán estableció una puente aérea entre Mashhad y las bases aéreas afganas de Bagram y Kulyab, para suministrar grandes cantidades de armas a la Alianza del Norte. Los informes indican que en un solo día de 1997, 13 vuelos iraníes aterrizaron en Bagram e Irán sigue siendo sospechoso de enviar 700 toneladas de armas a través de Tayikistán."
 AFG_junbishis: "Junbishis"
 AFG_junbishis_desc: "§RNo podemos impulsar manualmente. §W[Conservative_L]'s§! popularidad mientras Abdul Rashid Dostum está en el exilio §!\n\nJunbish-i Milli Islami Afghanistan, comúnmente conocido como Junbish, es una gran facción dentro de la Alianza del Norte, principalmente compuesta por uzbekos étnicos. Recientemente fue expulsado de su fortaleza Mazar-i-Sharif por fuerzas talibanes, pero Junbish sigue desempeñando un papel significativo en la Alianza del Norte. El grupo está dirigido por el General Abdul Rashid Dostum, un prominente señor de guerra que ha estado en desacuerdo con otros miembros"
 AFG_northern_alliance_taloqan_siege: "El sitio en Taloqan"
 AFG_northern_alliance_taloqan_siege_desc: "En la historia reciente, Taloqán fue el cuartel general estratégico de Ahmad Shah Massoud, destacado líder de las facciones muyahidines, durante su resistencia contra el Ejército soviético. Después asumió el papel de sede de [AFG.GetFlag] [AFG.GetNameDefCap] tras la caída de Mazar-i-Sharif en manos de los talibanes en 1997."
 AFG_idea_opium_economy: "Economía del opio afgano"
 AFG_idea_opium_economy_desc: "Una gran proporción de agricultores afganos ganan su vida al cultivar y vender amapolas para el opio. Enormes campos de amapola llenan muchas de nuestras tierras cultivables."
 AFG_idea_opium_barons: "Afghan Opium Barons"
 AFG_idea_opium_barons_desc: "Una gran proporción de agricultores afganos ganan su vida al cultivar y vender amapolas para el opio. Enormes campos de amapola llenan muchas de nuestras tierras cultivables. Las nuevas políticas del gobierno han permitido una situación en la que una gran camarilla de barones de opio opera varias grandes redes comerciales. La influencia de estos barones de opio dentro del gobierno es innegable."
 AFG_idea_afghan_defence: "Extensivas medidas de defensa"
 AFG_idea_afghan_defence_desc: "Nuestro país está envuelto en una guerra civil. Hemos estado perdiendo terreno, ¡pero no daremos un paso más atrás!"
 AFG_idea_un_troops: "Tropas de mantenimiento de la paz de las Naciones Unidas"
 AFG_idea_un_troops_desc: "Hemos pedido que el personal de mantenimiento de la paz de las Naciones Unidas se despliegue en nuestro país con la esperanza de traer estabilidad a nuestro país."
 AFG_political_events.1.t: "[AFG.GetNameDef] Solicitud de responsabilidad"
 AFG_political_events.1.d: "[AFG.GetNameDef] ha enviado un enviado a [ROOT.capital.GetName] para negociar un acuerdo para nosotros para equiparlos con el equipo necesario para proceder con sus operaciones de combate."
 AFG_political_events.1.a: "Aceptaremos"
 AFG_political_events.1.b: "Hoy no."
 AFG_political_events.2.t: "[FROM.GetNameDef] Rechaza nuestra solicitud de armas"
 AFG_political_events.2.d: "[FROM.GetNameDef] ha negado nuestra solicitud de armas. No nos descorazonaremos con esta negación y persistiremos con nuestros objetivos actuales."
 AFG_political_events.2.a: "Onward"
 AFG_political_events.3.t: "[FROM.GetNameDef] Firma armas Envío"
 AFG_political_events.3.d: "Expresamos nuestra profunda gratitud a [FROM.GetNameDef] por haber proporcionado el equipo tan necesario que hemos esperado durante mucho tiempo."
 AFG_political_events.3.a: "¡Genial!"
 AFG_political_events.4.t: "Primeras elecciones afganas"
 AFG_political_events.4.d: "Hoy marca el final de la votación contando. Finalmente estamos a punto de elegir al primer líder de Afganistán."
 AFG_political_events.4.a: "Gobierno de Hamid Karzai"
 AFG_political_events.4.b: "Naveen"
 AFG_political_events.4.c: "Jamiat-e Islami"
 AFG_political_events.4.e: "Gobierno de Saleh"
 AFG_political_events.0.t: "Atta instala Diarchy militar"
 AFG_political_events.0.d: "Atta Muhammad Nur, ex comandante de resistencia de Mujahideen, ha marchado sus fuerzas hacia Kabul, exigiendo el control sobre los niveles certianos de todas las fuerzas militares. Con la mayoría de los hombres que rozan a su causa, nuestras opciones son severamente limitadas, por decir lo menos."
 AFG_political_events.0.a: "Nuestras manos están atadas."
 AFG_events.8.t: "[AFG.GetNameDef] Pide nuestra protección"
 AFG_events.8.d: "Después de décadas de disturbios, el gobierno afgano teme un reinado de guerra o injerencia e invasión externas, la [AFG.GetNameWithFlag] Presidente [AFG.GetLeader] ha visitado la Casa Blanca y se ha acercado a nuestro Presidente [USA.GetLeader] para un tratado de defensa. Si estamos de acuerdo en protegerlos, podremos asegurarnos de que estén dentro de nuestra esfera de influencia, pero también tendremos la obligación de defenderlos [AFG.GetNameWithFlag] de las amenazas externas, así como prestar asistencia para mantener la estabilidad de su país, especialmente en la lucha contra £GFX_AFG_salafist_jihadism Insurgencia talibán. Teniendo en cuenta la situación de nuestro país, si firmamos un tratado de defensa con [AFG.GetLeader]?"
 AFG_events.8.a: "Estoy de acuerdo en protegerlos."
 AFG_events.8.b: "¡No tenemos tiempo para esto!"
 AFG_events.9.t: "[USA.GetNameDef] ha acordado protegernos"
 AFG_events.9.d: "Gracias a nuestros prudentes esfuerzos diplomáticamente, el Presidente [USA.GetLeader] de [USA.GetNameWithFlag] ha firmado formalmente un tratado de defensa con nuestro presidente [AFG.GetLeader]. Al firmar este tratado de defensa, [FROM.GetNameWithFlag] no sólo nos protegerá de la agresión externa, sino que también prestará asistencia para mantener nuestra estabilidad interna."
 AFG_events.9.a: "¡Excelente!"
 AFG_events.10.t: "[USA.GetNameDef] ¡Rehusado a firmar!"
 AFG_events.10.d: "A pesar de que nuestro Presidente [AFG.GetLeader] visitaba [USA.GetNameWithFlag] para la asistencia en materia de seguridad, [USA.GetLeader] aparentemente estaba cerca de cualquier tipo de tratados. [USA.GetLeader] ha dicho en una conferencia de prensa que «siempre vamos a defender la libertad, la democracia y los derechos humanos en Afganistán.» Pero es muy obvio que el compromiso de [USA.GetLeader] sólo permanece en palabras, tendremos que defendernos solos."
 AFG_events.10.a: "Qué visita catastrófica..."
 AFG_events.11.t: "[AFG.GetNameDef] Pide nuestra protección"
 AFG_events.11.d: "Después de décadas de disturbios, el gobierno afgano teme un reinado de guerra o injerencia e invasión externas, la [AFG.GetNameWithFlag] Presidente [AFG.GetLeader] ha visitado el Zhongnanhai y se acercó al Secretario General [CHI.GetLeader] para un tratado de defensa. Si estamos de acuerdo en protegerlos, podremos asegurarnos de que estén dentro de nuestra esfera de influencia, pero también tendremos la obligación de defenderlos [AFG.GetNameWithFlag] de las amenazas externas, así como prestar asistencia para mantener la estabilidad del país, especialmente en la lucha contra £GFX_AFG_salafist_jihadism Insurgencia talibán. Teniendo en cuenta la situación de nuestro país, si firmamos un tratado de defensa con [AFG.GetLeader]?"
 AFG_events.11.a: "¡Otro Hermano de Hierro!"
 AFG_events.11.b: "¡No tenemos nada que perdonar por un tratado!"
 AFG_events.12.t: "[CHI.GetNameDef] ha acordado protegernos"
 AFG_events.12.d: "Gracias a nuestros esfuerzos diplomáticos, el Secretario General [CHI.GetLeader] de [CHI.GetNameWithFlag] ha firmado formalmente un tratado de defensa con nuestro Presidente [AFG.GetLeader], al firmar este tratado de defensa, [FROM.GetNameWithFlag] no sólo nos protegerá de la agresión externa, sino que también proporcionará asistencia para mantener nuestra estabilidad interna."
 AFG_events.12.a: "¡Excelente!"
 AFG_events.13.t: "[CHI.GetNameDef] ¡Rehusado a firmar!"
 AFG_events.13.d: "A pesar de que nuestro Presidente [AFG.GetLeader] visitaba [CHI.GetNameWithFlag] para la asistencia en materia de seguridad, [CHI.GetLeader] aparentemente estaba cerca de cualquier tipo de tratados. [CHI.GetLeader] ha dicho a nuestro presidente que «siempre estaremos comprometidos con la seguridad y estabilidad regionales.» Pero es muy obvio que el compromiso de [CHI.GetLeader] sólo permanece en palabras, tenemos que defendernos solos."
 AFG_events.13.a: "Qué decepción..."
 AFG_events.14.t: "[AFG.GetNameDef] Denuncia públicamente la línea Durrani"
 AFG_events.14.d: "Hace poco, el presidente del [AFG.GetNameWithFlag] [AFG.GetLeader] anunció que [AFG.GetNameWithFlag] nunca reconocerá a la Línea Durand arbitrariamente establecida por los británicos en el siglo XX como frontera entre ambos países e hizo una fuerte declaración de que «podemos no ser capaces de reclamar nuestra tierra santa Pashtun en este momento, pero nuestros descendientes en las próximas generaciones definitivamente recuperarán esta tierra, que es legítimamente nuestra. ¡El tiempo lo dirá todo!» Ha sido muy claro que [AFG.GetNameWithFlag] ahora se está convirtiendo en una política exterior hostil hacia nuestro país."
 AFG_events.14.a: "¡No hay absolutamente ninguna justificación para que hagan eso!"
 AFG_events.15.t: "Asesinato de Burhanuddin Rabbani"
 AFG_events.15.d: "Esta noche, Burhanuddin Rabbani fue asesinado en un bombardeo suicida en su casa en Kabul, hoy es también su 71 cumpleaños. Dos hombres que se presentaron como representantes de los talibanes se acercaron a él para ofrecer un abrazo y uno de ellos detonó sus explosivos escondidos dentro de su turbante. El terrorista suicida afirmó ser un comandante talibán que dijo tener un mensaje muy importante y positivo de los líderes talibanes en Pakistán. Dijeron que los talibanes querían discutir la paz con Rabbani. Otros cuatro miembros del Alto Consejo de Paz de nuestro gobierno también fueron asesinados en la explosión. Nuestras fuentes confirmaron que Quetta Shura, el liderazgo talibán escondido en Quetta, Pakistán, es responsable de este asesinato.\n\nRabbani fue el presidente del Alto Consejo de Paz de nuestra nación después de dejar un papel líder dentro del gobierno. Durante ese tiempo, persuadió con éxito a cientos de militantes talibanes para que pusieran pacíficamente sus armas. El asesinato es un gran golpe para el proceso de paz en nuestro país ya que será difícil encontrar a alguien de su prestigio para servir en esta posición."
 AFG_events.15.a: "Sostén un funeral estatal."
 AFG_events.16.t: "[AFG.GetNameDef] Seeks Regnition of Neutrality"
 AFG_events.16.d: "Recientemente [AFG.GetNameDef] ha elegido seguir un camino de neutralidad para convertirse en una nación permanente neutral. Han demostrado su voluntad de cumplir las obligaciones como país neutral permanente, pero aún queda por ver si se cumplirá.\n\nEl Gobierno del Afganistán está tratando de que nuestro país se convierta en garante de su condición de país neutral. Si lo hacemos, tendremos la obligación de proteger al Afganistán si es invadido. Si no lo hacemos, otros países pueden garantizar su estatus y no tenemos nada que perder de esto."
 AFG_events.16.a: "Acordar garantizar su estatus como un poder neutral"
 AFG_events.16.b: "No tenemos tiempo para Afganistán"
 AFG_events.17.t: "[FROM.GetNameDef] Garantiza nuestro estado de neutralidad"
 AFG_events.17.d: "La declaración del gobierno de [FROM.GetAdjective] afirma que [FROM.GetNameDef] está dispuesta a garantizar nuestro estatus de neutralidad y vendrá a nuestra defensa en caso de invasión externa de nuestro país.\n\nEste es un logro importante ya que hemos obtenido el reconocimiento de la condición de neutralidad por lo menos a un miembro permanente del Consejo de Seguridad de las Naciones Unidas."
 AFG_events.17.a: "¡Excelente!"
 AFG_events.18.t: "El pueblo afgano se rebela contra los talibanes"
 AFG_events.18.d: "Tras la Operación Libertad Duradera, varias milicias tribales y étnicas de minorías lanzaron levantamientos contra los talibanes, notablemente en Herat. Con la asistencia de los Estados Unidos e Irán, estas milicias han tomado el control de varias zonas de los talibanes y se han unido al mando de la Alianza del Norte.\n\nEl levantamiento se reunió con disparos celebratorios de residentes locales, algunas celebraciones incluso incluyen «dancing on the rooftops» y cuernos de auto en honking. Mohammad Ismail Khan, uno de los principales comandantes de la Alianza Norte también conocido como «Lion of Herat», concedió amnistía a ex combatientes talibanes, pero advirtió sobre las repercusiones si dichos luchadores iban a tomar armas de nuevo."
 AFG_events.18.a: "¡La victoria está cerca!"
 AFG_news.7.t: "[AFG.GetNameDef] Anuncia reclamaciones relativas al territorio pakistaní"
 AFG_news.7.d: "Hace poco, el Presidente [AFG.GetLeader] de [AFG.GetNameWithFlag] anunció que [AFG.GetNameWithFlag] nunca reconocerá a la Línea Durand establecida arbitrariamente por los británicos en el siglo XX como frontera entre ambos países e hizo una fuerte declaración de que «podemos no ser capaces de recuperar nuestra tierra santa Pashtun en este momento, pero nuestros descendientes en las próximas generaciones definitivamente reclamarán esta tierra, que es legítimamente nuestra. El tiempo dirá a todos!» [PAK.GetNameWithFlag] el Presidente [PAK.GetLeader] respondió rechazando todas las afirmaciones hechas por [AFG.GetLeader] y criticó enérgicamente esta acción declarando que «las acciones diplomáticas hostiles realizadas por [AFG.GetLeader] no harán nada excepto dañar la relación entre nuestros dos países.» y llamó al gobierno afgano a respetar el derecho internacional. Ha quedado muy claro que las relaciones diplomáticas entre ambos países se han deteriorado aún más."
 AFG_news.7.a: "Veamos qué pasa después."
 AFG_news.8.t: "Golpe de estado en Afganistán"
 AFG_news.8.d: "Debido a la corrupción del gobierno central, las privaciones económicas y la pobreza del pueblo, muchos afganos que perdieron sus medios de subsistencia y fueron privados del status quo se han unido al Hekmatyar's £GFX_AFG_kingdom Hezb-e Islami. Un grupo de oficiales militares afganos que no han sido pagados durante mucho tiempo escenificó un golpe de Estado, derrocando al gobierno republicano, declarando una suspensión de la actual constitución afgana y la imposición temporal del control militar. Gulbuddin Hekmatyar, que sirvió dos veces como Primer Ministro de Afganistán en el decenio de 1990, terminó oficialmente su exilio y regresó a Afganistán como nuevo Presidente de Afganistán. Hekmatyar prometió erradicar la corrupción, reactivar la economía y llevar al pueblo afgano a un nuevo capítulo. En respuesta al golpe, un portavoz talibán emitió una declaración de que «Somos los verdaderos afganos y seguiremos derribando a Hekmatyar, el »Carnicero de Kabul«."
 AFG_news.8.a: "Otro capítulo en la guerra para siempre..."
 AFG_news.9.t: "[AFG.GetNameDef] Deplora a los militares en ciudades"
 AFG_news.9.d: "Debido a las políticas radicales recientes por parte de los líderes de [AFG.GetLeader], como la represión de las libertades políticas, las libertades personales, la ley cherámica al estilo talibán y la eliminación de la influencia tribal. Una protesta importante ha comenzado contra el gobierno gobernante, respondió el gobierno de [AFG.GetLeader] al desplegar tropas en ciudades y pueblos y algunos manifestantes fueron asesinados por los soldados del Ejército Nacional Afgano o las unidades de la Policía Nacional Afgana. Parece que [AFG.GetNameDef] está descendiendo al totalitarismo."
 AFG_news.9.a: "Eso es vida cotidiana en Afganistán..."
 AFG_news.10.t: "Asesinato de Burhanuddin Rabbani"
 AFG_news.10.d: "Burhanuddin Rabbani fue asesinado en un atentado suicida esta noche en su casa en Kabul. Dos atacantes suicidas que planteaban como representantes de los talibanes afirmaban querer discutir la paz con Rabbani se acercaron a él para ofrecer un abrazo y uno de ellos detonó sus explosivos dentro de su turbante. Otros cuatro miembros del Alto Consejo de Paz de Afganistán también fueron asesinados en la explosión.\n\nRabbani fue el presidente del Alto Consejo de Paz de Afganistán después de dejar un papel líder dentro del gobierno. Durante ese tiempo, persuadió con éxito a cientos de militantes talibanes para que pusieran pacíficamente sus armas. Su asesinato es un gran golpe para el proceso de paz en Afganistán."
 AFG_news.10.a: "Tragic news."
 AFG_news.11.t: "Hijacking of Ariana Airlines Vuelo 805"
 AFG_news.11.d: "Un grupo de nueve hombres afganos encabezados por los hermanos Ali y Mohammed Safi que huían del régimen talibán secuestraron Ariana Afghan Airlines Vuelo 805, un avión Boeing 727 con el registro YA-FAY con 180 pasajeros y 7 tripulantes a bordo. El vuelo 805 fue un vuelo nacional desde Kabul al aeropuerto de Mazar-i-Sharif.\n\nLos secuestradores obligaron a la tripulación a volar al aeropuerto de Londres Stansted en el Reino Unido después de las escalas en Tashkent, Aktobe y Moscú. El asedio del avión duró hasta el 10 de febrero. Se desconoce si los secuestradores serán condenados o no, ya que están en espera de juicio el año próximo."
 AFG_news.11.a: "Deberíamos haberlos interceptado con uno de nuestros MiG."
 AFG_news.12.t: "Hijacking of Ariana Airlines Vuelo 805"
 AFG_news.12.d: "Un grupo de nueve hombres afganos encabezados por los hermanos Ali y Mohammed Safi que huían del régimen talibán secuestraron Ariana Afghan Airlines Vuelo 805, un avión Boeing 727 con el registro YA-FAY con 180 pasajeros y 7 tripulantes a bordo. El vuelo 805 fue un vuelo nacional desde Kabul al aeropuerto de Mazar-i-Sharif.\n\nLos secuestradores obligaron a la tripulación a volar al aeropuerto de Londres Stansted en el Reino Unido después de las escalas en Tashkent, Aktobe y Moscú. El asedio del avión duró hasta el 10 de febrero. Se desconoce si los secuestradores serán condenados o no, ya que están en espera de juicio el año próximo."
 AFG_news.12.a: "Interesting"
 AFG_news.12.b: "El terrorismo es un flagelo para la humanidad."
 AFG_news.13.t: "Irán envía refugiados de regreso a Afganistán"
 AFG_news.13.d: "Tras llegar a un acuerdo con el ACNUR, el Irán inició un programa de repatriación que enviaría 7.700 refugiados afganos de vuelta a su patria durante las próximas tres semanas."
 AFG_news.13.a: "¿Hay un final a esta guerra?"
 AFG_news.14.t: "La guerra en Afganistán deja a miles de hambrientos"
 AFG_news.14.d: "El Programa Mundial de Alimentos informó de que la situación de sequía en la provincia de Kandahar y la provincia de Zabul era desesperada. El pueblo de Koochi había perdido hasta el 80% de sus ganados y sistemas de riego construidos para recoger agua de lluvia se habían secado. Los albaricoques y las almendras se habían marchitado y estaban sin fruta. Camels se estaba muriendo. Desde febrero, el PMA había estado alimentando a 30.000 familias de la región y tenía previsto añadir otras 10.000 familias en mayo. El PMA estaba ofreciendo a los afganos una harina adicional como incentivo si permanecían en sus aldeas."
 AFG_news.14.a: "El pueblo afgano nos necesita."
 AFG_events.32.t: "El castillo llamado Taloqan ha caído"
 AFG_events.32.d: "La captura despiadada del Talibán provocó un éxodo masivo, ya que los civiles huyeron hacia Imam Sahib y el Valle Panjshir. Después de un asedio brutal alegando cientos de vidas civiles, nuestros soldados detuvieron el avance del Talibán hacia el norte y el este de la ciudad pero no pudieron recuperarlo. Hemos abandonado nuestra sede de la Alianza del Norte en la ciudad, reubicando nuestra base de operaciones a Fayzabad."
 AFG_events.32.a: "Un día oscuro"
 AFG_events.31.t: "Taloqan pelea otro día"
 AFG_events.31.d: "Después de soportar un asedio brutal, los talibanes se enfrentaron a la derrota. Este triunfo se hace eco de la resiliencia de nuestras victorias que han llegado a ser antes. Que este sea otro paso de la desaparición final del Talibán como, «Talaqan es un lugar de tesoros de Alá. Estos tesoros no son de oro y plata, sino que consisten en personas que han reconocido a Alá como deberían tener.»"
 AFG_events.31.a: "Un día oscuro"
 AFG_investment.1.t: "[AFG.GetNameDef] Nos invita a invertir en sus proyectos"
 AFG_investment.1.desc: "Recientemente recuperado de la guerra contra los talibanes, el gobierno de [AFG.GetNameWithFlag] nos invita a invertir en algunos de los proyectos en su país. Sin embargo, si invertir o no depende de nosotros. Si optamos por invertir, podemos influir en su gobierno, si la amenaza terrorista sigue siendo alta en Afganistán, será mejor que no lo arriesguemos."
 AFG_investment.1.a: "¡Invierte en su infraestructura!"
 AFG_investment.1.b: "¡Invierte en su industria civil!"
 AFG_investment.1.c: "¡Invierte en su industria de servicios!"
 AFG_investment.1.d: "Será mejor que no lo arriesguemos."
 AFG_investment.2.t: "[FROM.GetNameDef] Invertido en nuestra Infraestructura!"
 AFG_investment.2.d: "Después de días de negociaciones, [FROM.GetNameWithFlag] ha acordado invertir en nuestra infraestructura a cambio de algunas concesiones mínimas. La inversión beneficiará a nuestra población rural en el país."
 AFG_investment.2.a: "¡Estamos agradecidos por su ayuda!"
 AFG_investment.3.t: "[FROM.GetNameDef] Invertido en nuestra industria civil!"
 AFG_investment.3.d: "Después de días de negociaciones, [FROM.GetNameWithFlag] ha acordado ayudarnos a construir algunas fábricas civiles a cambio de algunas concesiones menores. La inversión beneficiará al sector industrial de nuestro país y facilitará la modernización del país."
 AFG_investment.3.a: "¡Estamos agradecidos por su ayuda!"
 AFG_investment.4.t: "[FROM.GetNameDef] Invertido en nuestra industria de servicios!"
 AFG_investment.4.d: "Después de días de negociaciones, [FROM.GetNameWithFlag] ha acordado invertir en nuestra industria de servicios construyendo algunas oficinas a cambio de algunas concesiones menores. La inversión beneficiará al sector financiero de nuestro país y facilitará la modernización del país."
 AFG_investment.4.a: "¡Estamos agradecidos por su ayuda!"
 AFG_investment.5.t: "[FROM.GetNameDef] ¡Declinado a Invertir!"
 AFG_investment.5.d: "Después de días de negociaciones, [FROM.GetNameWithFlag] ha rechazado nuestra invitación a la inversión, citando que el entorno empresarial en nuestro país no es lo suficientemente seguro todavía y evaluará cuidadosamente futuros acuerdos de inversión con nosotros."
 AFG_investment.5.a: "¡Adivina que tenemos que hacer más trabajo!"
 AFG_taliban_insurgency.0.t: "El comienzo de la insurgencia talibana"
 AFG_taliban_insurgency.0.d: "Tras el colapso de la principal fuerza talibán, sus batallones se han fragmentado en varias celdas de afilar y han comenzado a librar una guerra guerrillera en todos los rincones del Afganistán y lanzar ataques terroristas egregiosos. Se estima que la insurgencia tomará años para calmarse adecuadamente pero si no actuamos en la situación, simplemente nunca tendremos estabilidad en nuestro país."
 AFG_taliban_insurgency.0.a: "¡Es hora de trabajar!"
 AFG_taliban_insurgency.1.t: "Raid exitosa de un escondite talibán"
 AFG_taliban_insurgency.1.d: "Gracias a nuestros valientes comandos, el escondite talibán que encontramos fue destruido, algunos de los militantes talibanes intentaron resistir pero fueron asesinados por nuestras unidades de comandos mientras la mayoría de los demás se rindieron con muy pocos escapando de la justicia. En general, la operación fue un éxito completo!"
 AFG_taliban_insurgency.1.a: "¡Excelente!"
 AFG_taliban_insurgency.2.t: "Fallo de la Raid"
 AFG_taliban_insurgency.2.d: "Sin llevar a cabo la redada conclusivamente fue un gran golpe para nuestra unidad de comandos contra el terrorismo. Los talibanes parecían conocer de antemano nuestros planes de allanamiento y lanzaron un ataque preventivo contra algunos de nuestros convoyes, plantando artefactos explosivos improvisados en nuestra ruta de obligada marcha y emboscando a nuestros comandos después de la explosión. Varios comandos murieron tristemente como resultado.\n\nEn desbloqueo, algunos generales militares sospechan que puede haber simpatizantes dentro de los organizadores de la operación que podrían haber filtrado el plan al Talibán, el informe también criticó la corrupción del gobierno que podría haber causado la pérdida de vidas de los comandos. ¡Debemos revisar este fracaso y aprender una lección de esto!"
 AFG_taliban_insurgency.2.a: "Descansa en paz con nuestros héroes!"
 AFG_taliban_insurgency.3.t: "Airstrike exitoso"
 AFG_taliban_insurgency.3.d: "¡Buenas noticias! El avión de contrainsurgencia de nuestra fuerza aérea pilotado por uno de nuestros expertos militares ha destruido exitosamente un campamento talibán basado en las coordenadas proporcionadas por nuestra agencia de inteligencia, el campamento talibán fue completamente destruido junto con muchos militantes talibanes asesinados dentro de él.\n\nEste éxito ha demostrado la eficacia del sector de seguridad interna de nuestra nación de la agencia de inteligencia y demuestra que la tecnología es vital en futuras operaciones de contrainsurgencia."
 AFG_taliban_insurgency.3.a: "¡Un gran éxito!"
 AFG_taliban_insurgency.4.t: "Aviones muertos civiles"
 AFG_taliban_insurgency.4.d: "¡Noticias horribles! Nuestra fuerza aérea ha bombardeado un objetivo basado en las coordenadas proporcionadas por nuestra agencia de inteligencia, pero ahora es obvio que las bombas han alcanzado objetivos civiles y han resultado en el asesinato de civiles inocentes en lugar de los combatientes talibanes previstos.\n\nLa población local está de luto y está justamente indignada por esta operación fallida, ya hay informes de protestas en la zona. Debemos revisar las razones del fracaso de esta operación en particular para dar una explicación a nuestros ciudadanos."
 AFG_taliban_insurgency.4.a: "A tragedy!"
 AFG_taliban_insurgency.5.t: "Aviones derribados por milicianos talibanes"
 AFG_taliban_insurgency.5.d: "¡Noticias trágicas de la operación de ataque aéreo! Uno de nuestros aviones contra la insurgencia ha sido derribado por militantes talibanes usando un misil antiaéreo disparado a hombros; el piloto ha sido asesinado como resultado.\n\nEste fracaso operacional ha demostrado que necesitamos reorganizar nuestra fuerza aérea para las operaciones futuras y obtener una mejor información de nuestros objetivos talibanes."
 AFG_taliban_insurgency.5.a: "¡Un piloto heroico, descansa en paz!"
 AFG_taliban_insurgency.6.t: "Éxito de Unity Propaganda"
 AFG_taliban_insurgency.6.d: "Gracias a nuestros esfuerzos de propaganda de unidad, algunos combatientes talibanes han llegado a nuestros puestos de policía y militares y han puesto sus armas, algunos han hundido a nuestros soldados y policías locales. Nuestros soldados y la policía no les dieron demasiados problemas, en cambio, dieron a muchos de los militantes talibanes que pusieron sus armas un poco de dinero para llevarlos a casa. Esto ha causado un crecimiento en la confianza pública del gobierno y de la unidad nacional."
 AFG_taliban_insurgency.6.a: "¡Un desarrollo exitoso!"
 AFG_taliban_insurgency.7.t: "Fallo de la unidad Propaganda"
 AFG_taliban_insurgency.7.d: "Ha sido enormemente decepcionante para nuestro gobierno que nuestro reciente esfuerzo propagandístico de unidad no tuvo retornos positivos. La palabra de algunos de los comandantes talibanes en la parte inferior es que el liderazgo talibán ve al actual gobierno afgano como un gobierno de ladrones, un títere de un gobierno extranjero, y no en absoluto representante de la nación afgana. Se consideran los verdaderos afganos."
 AFG_taliban_insurgency.7.a: "Tal vez tengamos que hacer más por nuestra parte..."
 AFG_taliban_insurgency.8.t: "La eliminación de la insurgencia talibana"
 AFG_taliban_insurgency.8.d: "Hace unas horas el gobierno afgano confirmó oficialmente que habían eliminado con éxito la insurgencia talibán. Según la información facilitada por el Gobierno afgano, la inmensa mayoría de los talibanes han establecido pacíficamente sus armas y devuelto a sus hogares.\n\nAlgunos militantes talibanes endurecidos han huido a través de la frontera afgano-pakistani hacia las zonas tribales pakistaníes y se han unido a grupos militantes locales dentro de la zona. Dado que el gobierno afgano ha construido suficientemente medidas de seguridad a lo largo de la frontera entre Afganistán y Pakistán, es poco probable que los militantes arraigados en Pakistán se infiltren a través de la frontera."
 AFG_taliban_insurgency.8.a: "¿El conflicto de larga data finalmente está al final?"
 AFG_taliban_insurgency.10.t: "Taliban lanza una gran insurgencia de escala"
 AFG_taliban_insurgency.10.d: "El reciente aumento de los ataques de los talibanes y el aumento de la violencia han dado a los talibanes la oportunidad de intensificar la insurgencia en la guerra civil una vez más. Los talibanes han tomado una gran franja del territorio rural, constituyendo un punto fuerte principal en el suroeste junto con otras zonas rurales que caen a su dominio.\n\nUna pequeña parte del Ejército Nacional Afgano ha visto desertar a soldados y algunos de esos desertores se han unido al Talibán, la mayoría han optado por permanecer y resistir a los talibanes debido al temor de ser liquidados por los talibanes.\n\nSi la comunidad internacional nos apoyará sigue siendo incierta, pero debemos reunir a nuestros soldados y luchar hacia la victoria."
 AFG_taliban_insurgency.10.a: "¡No tenemos más opción que luchar!"
 AFG_taliban_insurgency.11.t: "Taliban lanza una gran insurgencia de escala"
 AFG_taliban_insurgency.11.d: "El reciente aumento de los ataques de los talibanes y el aumento de la violencia han dado a los talibanes la oportunidad de intensificar la insurgencia en la guerra civil una vez más. Los talibanes han tomado una gran franja del territorio rural, constituyendo un punto fuerte principal en el suroeste junto con otras zonas rurales que caen a su dominio.\n\nUna pequeña parte del Ejército Nacional Afgano ha visto desertar a soldados y algunos de esos desertores se han unido al Talibán, la mayoría han optado por permanecer y resistir a los talibanes debido al temor de ser liquidados por los talibanes.\n\nEl líder afgano [AFG.GetLeader] ha anunciado que la insurgencia será aplastada y ha prometido que la lucha de voluntad hasta que haya llegado la paz."
 AFG_taliban_insurgency.11.a: "Afganistán está en guerra otra vez..."
 AFG_taliban_insurgency.14.t: "La situación en el Afganistán"
 AFG_taliban_insurgency.14.d: "Sabemos que el gobierno afgano nos ha permitido colocar tropas en su territorio, pero nuestra agencia de inteligencia militar advierte que los talibanes están llevando a cabo una insurgencia en todos los rincones del Afganistán y que hay una multitud de otros grupos terroristas aprovechando la situación inestable en el Afganistán. La amenaza del terror ha alcanzado un nivel crítico que podría plantear un peligro real para nuestras tropas estacionadas allí.\n\nSi continuamos manteniendo la posición de nuestras tropas en Afganistán, es probable que sean atacados por los talibanes y otros grupos terroristas activos en la nación. Sin embargo, si nos quedamos en el país, podemos optar por ayudar a las fuerzas del Gobierno afgano en sus operaciones de contrainsurgencia. Si optamos por hacerlo, nuestros militares pueden adquirir una experiencia valiosa como diferentes técnicas de lucha contra la insurgencia y contra la guerra guerrillera, y pueden proteger a nuestros ciudadanos en Afganistán.\n\n[ROOT.GetLeader], si eliges seguir estacionando tropas en Afganistán, no te detendremos, pero por favor piensa con cuidado si realmente vale la pena el riesgo."
 AFG_taliban_insurgency.14.a: "Contribuiremos a los esfuerzos afganos de lucha contra la insurgencia."
 AFG_taliban_insurgency.14.b: "Será mejor que no arriesguemos la vida de nuestros miembros de servicio."
 AFG_taliban_insurgency.15.t: "[FROM.GetNameDef] Se une a nuestra lucha"
 AFG_taliban_insurgency.15.d: "[FROM.GetLeader], el líder de [FROM.GetNameDef] ha informado a nuestro gobierno que las tropas [FROM.GetAdjective] estacionadas en nuestro país están dispuestas a unirse a nuestra lucha en la batalla contra la insurgencia contra los talibanes además de proteger a sus ciudadanos dentro de nuestro país.\n\nAdemás, [FROM.GetName] también prestará asistencia en materia de seguridad, como dispositivos de detección de explosivos y otros equipos militares más avanzados."
 AFG_taliban_insurgency.15.a: "¡Estamos agradecidos por la ayuda!"
 AFG_taliban_insurgency.16.t: "[FROM.GetNameDef] Comienza la retirada de tropas"
 AFG_taliban_insurgency.16.d: "[FROM.GetLeader], el líder de [FROM.GetNameDef] ha informado a nuestro gobierno que las tropas [FROM.GetAdjective] estacionadas en nuestro país han completado su misión y los soldados se dirigen de vuelta a casa.\n\nEl comandante de las [FROM.GetAdjective] tropas en nuestro país ya ha iniciado procesos básicos de entrega con nuestros comandantes."
 AFG_taliban_insurgency.16.a: "Farewell!"
 AFG_taliban_insurgency.17.t: "Éxito Raid of Taliban Hideout"
 AFG_taliban_insurgency.17.d: "Gracias a nuestros valientes comandos, el escondite talibán que encontramos fue destruido, algunos de los militantes talibanes intentaron resistir pero fueron asesinados por nuestras unidades de comandos mientras la mayoría de los demás se rindieron con muy pocos escapando de la justicia. En general, la operación fue un éxito completo!"
 AFG_taliban_insurgency.17.a: "¡Excelente!"
 AFG_taliban_insurgency.18.t: "Fallo de la Raid"
 AFG_taliban_insurgency.18.d: "Sin llevar a cabo la redada conclusivamente fue un gran golpe para nuestra unidad de comandos contra el terrorismo. Los talibanes parecían conocer de antemano nuestros planes de allanamiento y lanzaron un ataque preventivo contra algunos de nuestros convoyes, plantando artefactos explosivos improvisados en nuestra ruta de obligada marcha y emboscando a nuestros comandos después de la explosión. Varios comandos murieron tristemente como resultado.\n\nEn desbloqueo, algunos generales militares sospechan que puede haber simpatizantes dentro de los organizadores de la operación que podrían haber filtrado el plan al Talibán, el informe también criticó la corrupción del gobierno que podría haber causado la pérdida de vidas de los comandos. ¡Debemos revisar este fracaso y aprender una lección de esto!"
 AFG_taliban_insurgency.18.a: "Descansa en paz!"
 AFG_taliban_insurgency.21.t: "Drone Strike Successfulful"
 AFG_taliban_insurgency.21.d: "¡Nuestro ataque de drones contra los talibanes tuvo éxito! Nuestro dron fue capaz de detectar, golpear y destruir varios escondites talibán cerca de una zona urbana, violando sus capacidades militares en la zona y dejando temporalmente su estructura de liderazgo local completamente desorganizada.\n\nAunque al principio se asustó con la huelga de drones, la población local ha celebrado ahora el retiro de los insurgentes talibanes, por lo menos por ahora."
 AFG_taliban_insurgency.21.a: "¡Los Drones son el futuro de la guerra!"
 AFG_taliban_insurgency.22.t: "Failed Drone Strike Killed Civils"
 AFG_taliban_insurgency.22.d: "Hoy, uno de nuestros aviones no tripulados atacó y destruyó lo que parecía un escondite talibán cerca de una zona residencial, pero los recientes informes de inteligencia concluyeron que el edificio objetivo era en realidad un pequeño edificio de apartamentos ocupado por civiles.\n\nLos periodistas de los medios ya están cubriendo el incidente y muchos grupos critican nuestra participación en esta guerra."
 AFG_taliban_insurgency.22.a: "¡Fue un error técnico!"
 AFG_taliban_insurgency.23.t: "Operación Bombing Successful"
 AFG_taliban_insurgency.23.d: "Inteligencia informa que hoy uno de nuestros bombarderos estratégicos destruyó un complejo de túneles talibán escondido en las montañas del este de Afganistán.\n\nNuestra exitosa campaña de bombardeo está empezando a paralizar las operaciones de los talibanes en las zonas aisladas del país y el colapso de su infraestructura obligará a los talibanes a rendirse a tiempo."
 AFG_taliban_insurgency.23.a: "¡Los yihadistas aprenderán a temer nuestro poder aéreo!"
 AFG_taliban_insurgency.24.t: "Los bombardeos han matado a civiles"
 AFG_taliban_insurgency.24.d: "¡Hoy ocurrió un incidente catastrófico!\n\nNuestra fuerza aérea bombardeó una zona montañosa en el este de Afganistán hasta que descubrimos que no había campamentos talibán en la zona, pero de hecho, un pequeño pueblo entre las montañas. El pueblo fue absolutamente destruido como resultado de nuestro bombardeo.\n\nLa credibilidad de nuestra campaña aérea ha sido llamada a un serio repito. Nuestros políticos y mandos militares están siendo acusados de crímenes de guerra contra el pueblo afgano."
 AFG_taliban_insurgency.24.a: "¡Esto es terrible!"
 AFG_taliban_insurgency.25.t: "[FROM.GetNameDef] Proporciona equipo técnico"
 AFG_taliban_insurgency.25.d: "Un mensaje del gobierno [FROM.GetAdjective] a nuestro liderazgo ha declarado que [FROM.GetNameDef] nos proporcionará algún equipo técnico de contrainsurgencia, incluyendo dispositivos de detección de explosivos que pueden instalarse en autopistas o entradas de puerta, perros entrenados específicamente para detectar explosivos ocultos, así como algunos otros electrónicos para mejorar la eficacia de nuestras fuerzas militares y policiales al tratar con la insurgencia talibán.\n\nSe espera que el equipo llegue dentro de un mes y con suerte reducirá el crecimiento de la insurgencia talibana, por lo menos durante un breve período de tiempo."
 AFG_taliban_insurgency.25.a: "¡Estamos agradecidos por la ayuda!"
 AFG_taliban_attack.0.t: "Militants talibanes Attack Local Police Station"
 AFG_taliban_attack.0.d: "Hoy, un grupo de militantes talibanes emboscó uno de los puestos de policía de nuestro gobierno sin previo aviso. Nuestras fuerzas policiales estaban claramente imprevistas y desprevenidas, lucharon valientemente hasta que sus superiores dieron la orden de evacuar el puesto de control.\n\nLos militantes talibanes habían asumido el puesto de control hasta que se informó al ejército, prestando apoyo a nuestras fuerzas policiales. Había armas en la armería del puesto de control que fueron tomadas por los talibanes sin embargo. Durante el ataque, nuestras fuerzas policiales y militares mataron a varios militantes talibanes, pero nuestra fuerza policial también perdió a varios oficiales valientes a cambio."
 AFG_taliban_attack.0.a: "¡Pagarán por esto!"
 AFG_taliban_attack.1.t: "Los talibanes afganos atacan una comisaría"
 AFG_taliban_attack.1.d: "Hoy un grupo de militantes talibanes afganos emboscó uno de los puestos de policía del gobierno afgano sin previo aviso. Las fuerzas de policía afganas no estaban claramente preparadas y quedaron en guardia, pero lucharon valientemente hasta que sus superiores dieron la orden de evacuar el puesto de control.\n\nLos militantes talibanes habían asumido el puesto de control hasta que se informó al ejército afgano, prestando apoyo a la policía. Había armas en la armería del puesto de control que fueron tomadas por los talibanes sin embargo. Durante el ataque, la policía y las fuerzas militares afganas mataron a varios militantes talibanes, pero la fuerza policial también perdió a varios oficiales valientes a cambio."
 AFG_taliban_attack.1.a: "Un desarrollo problemático."
 AFG_taliban_attack.2.t: "Talibán lanza bombas de autobús"
 AFG_taliban_attack.2.d: "Hoy, un grupo de militantes talibanes obligó a un autobús a parar con un camión, utilizaron a Kalashnikovs para disparar a los civiles dentro y luego detonaron una bomba de coche cerca del autobús. Después de que llegó la policía militar, los militantes talibanes huyeron del lugar, algunos fueron fusilados y asesinados, mientras que los pocos que no escaparon fueron capturados y llevados a la policía militar para ser interrogados.\n\nDe los resultados del interrogatorio y la investigación posterior, sabemos que el ataque terrorista apuntaba deliberadamente a turistas y extranjeros. Los talibanes han ofrecido una recompensa por matar extranjeros en el Afganistán. El ataque también ha provocado bajas entre ciudadanos extranjeros y los países afectados ya están exigiendo a nuestro gobierno que lleve a cabo una investigación completa de este ataque."
 AFG_taliban_attack.2.a: "¡Debemos cazar a esos terroristas talibanes!"
 AFG_taliban_attack.3.t: "Los talibán bombardean mata a nuestros ciudadanos"
 AFG_taliban_attack.3.d: "Hoy, un grupo de militantes talibanes afganos forzó un autobús para detenerse con un camión, utilizaron a Kalashnikovs para disparar a los civiles dentro y luego detonaron una bomba de coche cerca del autobús. Después de que la policía militar afgana llegó, los militantes talibanes huyeron del lugar, algunos fueron fusilados y asesinados, mientras que los pocos que no escaparon fueron capturados y llevados a la policía militar para ser interrogados.\n\nEl ataque también ha provocado víctimas de nuestros ciudadanos, nuestro embajador en el Afganistán se ha puesto en contacto con funcionarios afganos para tratar de hacer frente a las consecuencias."
 AFG_taliban_attack.3.a: "¡Envíen nuestras condolencias a las familias de las víctimas!"
 AFG_taliban_attack.4.t: "Extranjeros asesinados en los bombardeos de autobuses talibanes"
 AFG_taliban_attack.4.d: "Hoy, un grupo de militantes talibanes afganos forzó un autobús para detenerse con un camión, utilizaron a Kalashnikovs para disparar a los civiles dentro y luego detonaron una bomba de coche cerca del autobús. Después de que la policía militar afgana llegó, los militantes talibanes huyeron del lugar, algunos fueron fusilados y asesinados, mientras que los pocos que no escaparon fueron capturados y llevados a la policía militar para ser interrogados.\n\nEl ataque ha provocado víctimas de afganos locales y ciudadanos extranjeros y ha resultado en una condena generalizada por parte de la comunidad internacional."
 AFG_taliban_attack.4.a: "¡Envíen nuestras condolencias a las víctimas!"
 AFG_taliban_attack.5.t: "Los talibanes atacan un convoy de cisternas de combustible"
 AFG_taliban_attack.5.d: "En la actualidad, los militantes talibanes atacaron a un convoy de camiones de combustible que supuestamente debían entregar combustible vital al ejército y a la policía militar. Los militantes talibanes incendiaron a los tanques y los conductores de los tanques fueron secuestrados por los talibanes. The whereabouts of these drivers are at yet, unknown.\n\nNo hay reportes de bajas entre los residentes locales hasta ahora, pero los tanques quedaron completamente quemados y las carreteras cercanas están totalmente apagadas por los militares con fines de seguridad. Se prevé que tomará algún tiempo para que la vida vuelva a ser normal en la zona para los residentes locales."
 AFG_taliban_attack.5.a: "¡Debemos rescatar a esos conductores!"
 AFG_taliban_attack.6.t: "Los talibanes afganos queman tanques de combustible"
 AFG_taliban_attack.6.d: "En la actualidad, militantes talibanes afganos atacaron a un convoy de camiones de combustible que supuestamente debían entregar combustible vital al ejército y a la policía militar. Los militantes talibanes incendiaron a los tanques y los conductores de los tanques fueron secuestrados por los talibanes. The whereabouts of these drivers are at yet, unknown.\n\nNo hay reportes de bajas entre los residentes locales hasta ahora, pero los tanques quedaron completamente quemados y las carreteras cercanas están totalmente apagadas por los militares con fines de seguridad. Se prevé que tomará algún tiempo para que la vida vuelva a ser normal en la zona para los residentes locales."
 AFG_taliban_attack.6.a: "Afganistán es en realidad un lugar peligroso..."
 AFG_taliban_attack.7.t: "Talibán ataca convoy militar"
 AFG_taliban_attack.7.d: "En la actualidad, los militantes talibanes han lanzado un ataque suicida impactante contra uno de nuestros convoyes militares. Los militantes talibanes condujeron dos coches y detonaron ambos vehículos a medida que se acercaban a los camiones militares.\n\nEl ataque suicida resultó en que varios camiones militares fueron destruidos por la onda de choque y causaron varias bajas entre nuestros soldados, afortunadamente nuestros soldados sólo han sufrido heridas, pero los militantes talibanes involucrados en el ataque fueron asesinados inmediatamente por sus propias bombas."
 AFG_taliban_attack.7.a: "¡Tenemos que aumentar la detección de vehículos!"
 AFG_taliban_attack.8.t: "El ataque suicida de los talibanes está dirigido a militares afganos"
 AFG_taliban_attack.8.d: "Hoy, militantes talibanes afganos han lanzado un ataque suicida impactante contra uno de los convoyes militares de Afganistán. Los militantes talibanes condujeron dos coches y detonaron ambos vehículos mientras se acercaban a los camiones militares\n\nEl ataque suicida dio lugar a que varios camiones militares fueran destruidos por la onda de choque de la explosión y causó varias bajas entre los soldados del ejército afgano, pero los militantes talibanes involucrados en el ataque fueron asesinados inmediatamente por sus propias bombas."
 AFG_taliban_attack.8.a: "¿Cómo dejó que eso pasara el ejército afgano?"
 AFG_taliban_attack.9.t: "Talibán apunta a tropas extranjeras"
 AFG_taliban_attack.9.d: "Hoy, un militante talibán disfrazado de residente local, se acercó silenciosamente a un convoy de tropas extranjeras que fueron enviadas a nuestro país detonó una bomba escondida en su turbante. Mientras nadie resultó herido en la primera explosión, otro grupo de militantes talibanes aprovecharon el caos creado por la explosión y utilizaron RPG para disparar cohetes contra las tropas extranjeras.\n\nLa situación se redujo después de que llegaron los refuerzos militares, pero lamentablemente este ataque ha provocado muchas bajas y varios vehículos militares han sido destruidos."
 AFG_taliban_attack.9.a: "Damn"
 AFG_taliban_attack.10.t: "Nuestros miembros del servicio mataron en ataque de talibanes"
 AFG_taliban_attack.10.d: "Hoy, un militante talibán disfrazado de residente local, se acercó silenciosamente a un convoy de tropas extranjeras que fueron enviadas a nuestro país detonó una bomba escondida en su turbante. Mientras nadie resultó herido en la primera explosión, otro grupo de militantes talibanes aprovecharon el caos creado por la explosión y utilizaron RPG para disparar cohetes contra las tropas extranjeras.\n\nLa situación se redujo después de que llegaron los refuerzos, pero lamentablemente este ataque ha provocado muchas bajas de nuestros miembros del servicio y varios vehículos militares han sido destruidos. Nuestro comandante local ha estado en contacto con los comandantes militares afganos para hacer frente a las consecuencias."
 AFG_taliban_attack.10.a: "¡Envíen condolencias a los soldados caídos!"
 AFG_taliban_attack.11.t: "Tropas extranjeras asesinadas en ataque de talibanes"
 AFG_taliban_attack.11.d: "Hoy, un militante talibán disfrazado de residente local, se acercó silenciosamente a un convoy de tropas extranjeras que fueron enviadas a nuestro país detonó una bomba escondida en su turbante. Mientras nadie resultó herido en la primera explosión, otro grupo de militantes talibanes aprovecharon el caos creado por la explosión y utilizaron RPG para disparar cohetes contra las tropas extranjeras.\n\nLa situación se redujo después de que llegaron los refuerzos militares, pero este ataque ha provocado muchas bajas y varios vehículos militares han sido destruidos."
 AFG_taliban_attack.11.a: "¿Por qué no pueden eliminar a los talibanes?"
 AFG_taliban_attack.12.t: "Taliban lanza el edificio Bombing"
 AFG_taliban_attack.12.d: "Hoy en día, un edificio fue sacudido por una explosión masiva en uno de los edificios que incluye oficinas de inversores extranjeros, los resultados posteriores de la investigación han determinado que la bomba se hizo probablemente con una serie de proyectiles de artillería robados o perdidos de una armería del Ejército Nacional Afgano. Desde entonces, los talibanes han asumido la responsabilidad de este bombardeo.\n\nHay extranjeros entre los muertos y nuestros funcionarios del gobierno han estado en contacto con sus embajadores para lidiar con las consecuencias."
 AFG_taliban_attack.12.a: "¡Esto afectará negativamente a nuestra imagen nacional!"
 AFG_taliban_attack.13.t: "Nuestros Contratistas murieron en atentados talibanes"
 AFG_taliban_attack.13.d: "Hoy en día, un edificio fue sacudido por una explosión masiva en uno de los edificios que incluye oficinas de uno de nuestros contratistas, los resultados posteriores de la investigación han determinado que la bomba se hizo probablemente con una serie de proyectiles de artillería robados o perdidos de una armería del Ejército Nacional Afgano. Los talibanes han reivindicado desde entonces la responsabilidad del bombardeo.\n\nAlgunos de nuestros ciudadanos están entre las víctimas y nuestro embajador en Afganistán ha estado en contacto con funcionarios del Gobierno afgano para hacer frente a las consecuencias."
 AFG_taliban_attack.13.a: "¡Deben proteger a nuestros inversores!"
 AFG_taliban_attack.14.t: "Extranjeros asesinados en bombardeos de edificios talibanes"
 AFG_taliban_attack.14.d: "Hoy en día, un edificio fue sacudido por una explosión masiva en uno de los edificios que incluye oficinas de contratistas extranjeros en una ciudad importante en el Afganistán, los resultados posteriores de la investigación han determinado que la bomba se hizo probablemente con una serie de proyectiles de artillería robados o perdidos de una armería del Ejército Nacional Afgano. Los talibanes han reivindicado desde entonces la responsabilidad del bombardeo.\n\nHay ciudadanos extranjeros entre las víctimas y funcionarios gubernamentales afganos se han puesto en contacto con los embajadores de esos países afectados para hacer frente a las consecuencias."
 AFG_taliban_attack.14.a: "¿Por qué algún país invertiría en Afganistán?"
 AFG_taliban_attack.15.t: "Los talibanes bombardean un aeropuerto"
 AFG_taliban_attack.15.d: "Hoy en día, uno de nuestros aeropuertos de doble uso fue golpeado por una bomba de coche cuando un camión que transportaba un dispositivo explosivo atravesó el velo en la entrada del aeropuerto y detonó el dispositivo montado en el camión. La explosión causó daños considerables en el aeródromo debido al rendimiento extremadamente elevado de la bomba en el vehículo. Poco después de los primeros informes, la red Haqqani, la rama más radical del Talibán, reclamó responsabilidad por el ataque.\n\nEl ataque ha dejado un gran número de bajas entre las tripulaciones terrestres y los pasajeros que esperan en la terminal. Nuestros servicios de seguridad fueron atrapados completamente fuera de guardia, y el público está preguntando cómo un camión lleno de explosivos fue capaz de llegar a las puertas de un aeródromo vigilado en primer lugar."
 AFG_taliban_attack.15.a: "¡Los terroristas talibanes deben ser cazados!"
 AFG_taliban_attack.16.t: "Ataque Aeropuerto Mayor en Afganistán"
 AFG_taliban_attack.16.d: "Hoy en día, uno de los aeropuertos de doble uso de Afganistán fue golpeado por una bomba de coche cuando un camión que transportaba un dispositivo explosivo atravesó el velo a la entrada del aeropuerto y detonó el dispositivo montado en el camión. La explosión causó daños considerables en el aeropuerto debido al rendimiento extremadamente elevado de la bomba en el vehículo. Poco después de que se presentaran los informes, la red Haqqani, la rama más radical del Talibán, alegó la responsabilidad por el ataque.\n\nEl ataque dio lugar a un gran número de bajas, pero no hay informes de ningún [ROOT.GetAdjective] ciudadanos en Afganistán muertos o heridos. Nuestro líder [ROOT.GetLeader] ha enviado condolencias a [AFG.GetLeader] para el ataque y ha condenado enérgicamente las acciones de los talibanes."
 AFG_taliban_attack.16.a: "¡La insurgencia talibana ha alcanzado un nivel crítico!"
 AFG_news.17.t: "Insurrección contra los talibanes en el Afganistán"
 AFG_news.17.d: "Tras la Operación Libertad Duradera, Herat es testigo de una oleada de resistencia como milicias locales, ayudadas por Estados Unidos e Irán, desafiando el control talibán. Las escenas conmemorativas llenan las calles mientras las milicias capturan áreas clave y se alinean con la Alianza del Norte. «Lion of Herat» Mohammad Ismail Khan ofrece amnistía a ex combatientes talibanes pero advierte contra futuras hostilidades. Los levantamientos marcan un momento crucial en la lucha de Afganistán por la estabilidad."
 AFG_news.17.a: "Turno interesante de Eventos"
 AFG_events.27.t: "Papel de la mujer"
 AFG_events.27.d: "Aunque el concepto de roles femeninos en nuestra sociedad puede parecer poco convencional, el estado tiene ideas variables sobre cómo avanzar."
 AFG_events.27.a: "Deberían desempeñar un papel más tradicional"
 AFG_events.27.b: "Vamos a darles un papel"
 AFG_events.28.t: "Función de la religión"
 AFG_events.28.d: "El papel de la religión y si el Afganistán debe abrir o mantener su estricta adhesión al islam suní es un tema contencioso"
 AFG_events.28.a: "Nos quedaremos cerrados."
 AFG_events.28.b: "Deberíamos abrirnos."
 AFG_events.35.t: "Transporte aéreo a la Alianza del Norte"
 AFG_events.35.d: "En medio del conflicto en curso en Afganistán, Rusia se encuentra en los asuntos de la región. Desde 1996, el gobierno ruso ha apoyado silenciosamente a la Alianza del Norte, proporcionando armas y suministros para fortalecer la resistencia del gobierno afgano derrocado. Este apoyo se origina por el temor al conflicto que se extiende hacia Asia central, como se ha visto anteriormente con la OTU en la guerra civil de Tayikistán. Ahora, con el Ministro de Defensa Ivanov revelando el alcance de esta asistencia, los dirigentes rusos se enfrentan a una decisión crítica: si persisten en ayudar a la Alianza del Norte a pesar de la tensión económica o para retirar el apoyo total."
 AFG_events.35.a: "Solicito a los Estados Unidos que cojan el Costo"
 AFG_events.35.b: "Podemos pagar el costo"
 AFG_events.35.c: "Cortar el flujo de ayuda"
 AFG_events.36.t: "Alianza norteña afgana abierta a los drones anfitriones"
 AFG_events.36.d: "Con los bombardeos de la embajada de Estados Unidos en 1998 y las subsiguientes huelgas de misiles estadounidenses contra campamentos de entrenamiento de Al-Qaeda en Afganistán, Estados Unidos ha intensificado sus esfuerzos para desmantelar redes terroristas, incluso exigiendo la rendición de Osama bin Laden. Una reunión de altos funcionarios de seguridad nacional acordó que los talibanes se presentarían con un ultimátum para entregar a Bin Laden. A pesar de la renuencia anterior a colaborar con la Alianza del Norte, ahora hay una oportunidad para la acción conjunta en el rastreo del paradero de Bin Laden."
 AFG_events.36.a: "Enviar a Drones de Vigilancia "
 AFG_events.36.b: "Ya hemos dado el objetivo"
 AFG_events.37.t: "Mayor apoyo a la Alianza Norte de Afganistán"
 AFG_events.37.d: "A medida que el conflicto en Afganistán provoca, la Alianza del Norte necesita un mayor apoyo para combatir a los talibanes y al-Qaeda. La asistencia encubierta de la India ha sido crucial, proporcionando fondos, equipos de radar, piezas de avión y apoyo técnico para mantener aviones de combate. Con asesores militares indios valiosos para luchar contra los talibanes, su asistencia se ha convertido en indispensable para los soldados de [AFG.GetLeader]."
 AFG_events.37.a: "Es necesario eliminar los proxies pakistaníes."
 AFG_events.37.b: "No deseamos continuar este proceso."
 AFG_events.38.t: "Russian Airlift Equipment Llega a Afganistán"
 AFG_events.38.d: "El equipo militar ruso, incluidas las armas, los suministros y los vehículos, ha comenzado a llegar al Afganistán mediante el transporte aéreo, la llegada de este equipo crea una nueva apertura en la guerra"
 AFG_events.38.a: "Buenas noticias"
 AFG_events.39.t: "EE.UU. Aprobación para el soporte Drone"
 AFG_events.39.d: "Los Estados Unidos han aprobado la solicitud de apoyo a drones para atacar los campos de entrenamiento de Al-Qaeda y rastrear Osama bin Laden. Ahora podemos utilizar inteligencia para reunir y coordinar esfuerzos con las fuerzas estadounidenses."
 AFG_events.39.a: "Grandes noticias"
 AFG_events.40.t: "El apoyo indio continúa"
 AFG_events.40.d: "El Afganistán recibe apoyo de la India, incluidos fondos, equipo de radar, piezas de aviones y asesores militares."
 AFG_events.40.a: "Genial."
 AFG_events.41.t: "Solicitud de apoyo Rechazado "
 AFG_events.41.d: "Pese a los esfuerzos por obtener apoyo adicional, se ha rechazado la solicitud de asistencia. Tendremos que depender de los recursos existentes."
 AFG_events.41.a: "Disappointing"
 AFG_events.42.t: "Rusia pide que acabemos el proyecto de ley"
 AFG_events.42.d: "Rusia no está dispuesta a cubrir los costos de la costosa operación de transporte aéreo para abastecer a la Alianza del Norte en Afganistán. Mr. Ivanov se ha acercado a los Estados Unidos para obtener ayuda, y también se han mantenido conversaciones con funcionarios de defensa británicos. Los EE.UU. se enfrentan a una decisión sobre si ayudar a Rusia en esta operación."
 AFG_events.42.a: "Podemos hacerlo."
 AFG_events.42.b: "no podemos"
 AFG_news.18.t: "Rusia pide que los EE.UU. paguen por transporte aéreo a Afganistán"
 AFG_news.18.d: "La solicitud de asistencia de Rusia para financiar la operación de transporte aéreo para abastecer a la Alianza Norte en Afganistán se ha reunido con burlas de la comunidad mundial. A pesar de su proeza militar, la renuencia de Rusia a pisar el proyecto de ley ha atraído críticas, y muchos cuestionan su compromiso con la causa. Algunos han sugerido incluso que Rusia reconsidere sus prioridades y se centre en abordar sus propios problemas económicos. Los suministros comenzaron a fluir hacia Afganistán a finales de septiembre, con municiones y equipo militar siendo entregados a través de puentes pontones construidos por la división 201 de Rusia sobre el río Pyandj que divide Tayikistán y Afganistán, según informó Nezavismaya Gazeta"
 AFG_news.18.a: "¿Dónde se ha ido todo el dinero?"
 AFG_news.18.c: "¿Vendrá el Águila a rescatar al oso herido una vez más?"
 AFG_news.18.b: "En realidad."
 AFG_news.19.t: "EE.UU. deplora Drones depredador en Afganistán"
 AFG_news.19.d: "Los Estados Unidos han desplegado drones depredadores en Afganistán para atacar a las fortalezas terroristas de Al-Qaeda. Esta escalada en el Afganistán inicia una nueva era de presencia militar de los Estados Unidos en la región. Se espera que los drones proporcionen inteligencia y vigilancia, mejorando las operaciones militares de los Estados Unidos en el país."
 AFG_news.19.a: "Interesting"
 AFG_news.20.t: "[AFG.GetLeader] Discurso al Parlamento Europeo"
 AFG_news.20.d: "Durante la conferencia de prensa en el Parlamento Europeo, [AFG.GetLeader] instó a los líderes mundiales a presionar al Pakistán por su apoyo a los talibanes y pidió ayuda humanitaria para aliviar el sufrimiento del pueblo afgano. La súplica viene como él también advierte de un ataque planeado a las naciones occidentales por Al-Qaeda."
 AFG_news.20.a: "Esto podría ser motivo de preocupación"
 AFG_news.21.t: "Dostum se une a los planes de agresión contra Mazar-i-Sharif"
 AFG_news.21.d: "El regreso de Dostum a Afganistán del exilio fue tomado como una oportunidad para apoderarse de Mazar-i-Sharif. Ahora, junto con el Comandante Ahmad Shah Massoud, Ismail Khan y Mohammad Mohaqiq, se prepara para una ofensiva contra la ciudad controlada por los talibanes de Mazar-i-Sharif. \n\nDostum, originalmente el comandante de la unidad militar 374 bajo las fuerzas comunistas del PDPA, había desertado al mujahideen después de la caída de Kabul en 1992. Luego estableció su estado Proto en Mazar-i-Sharif, comúnmente conocido como la Zona Autónoma del Norte. Imprimió su propia moneda e incluso operaba su propia aerolínea, Balkh Air.\n\nTras perder brevemente el control de Mazar-i-Sharif al Talibán, Dostum regresó del exilio en octubre de 1997 para volver a asumir cargos. A pesar de sus esfuerzos, los talibanes regresaron en 1998, lo que llevó a Dostum a huir una vez más a Turquía."
 AFG_news.21.a: "Veamos qué pasa."
 AFG_events.45.t: "Mahmoud Surkha ha desertado ante los talibanes"
 AFG_events.45.d: "El Comandante Mahmoud Surkha ha desertado ante los talibanes alegando insatisfacción con la injerencia rusa en la guerra. [AFG.GetLeader] niega la alegación, pero dice que tiene derecho a buscar apoyo internacional como el gobierno defacto reconocido del Afganistán."
 AFG_events.48.t: "Abdullah Jan Wahidi defectos"
 AFG_events.48.d: "Haji Abdul Qadeer admitió que uno de sus comandantes clave, Abdullah Jan Wahidi, había desertado a los talibanes."
 AFG_events.48.a: "Nada que podamos hacer"
 AFG_events.44.t: "Ismail Khan escapa de la prisión Kandahar"
 AFG_events.44.d: "Ismail Khan, ex gobernador de Herat y líder de resistencia al régimen gobernante talibán, escapa de la prisión en Kandahar. \nKhan podría ser considerado uno de los líderes mujahideen más respetados en la insurgencia contra los soviéticos. En 1992, las tropas mujahideen capturaron a Herat, y Ismail Khan se convirtió en gobernador. En 1995, defendió la ciudad contra los talibanes en cooperación con Ahmad Shah Massoud. Khan incluso siguió la ofensiva contra el bastión talibán de Kandahar pero fue conducido de vuelta. Esto cambió cuando el General Abdul Rashid Dostum atacó a Herat, obligando a Ismail Khan y sus 8.000 hombres a huir a Irán antes de que los talibanes entraran para tomar el control de la provincia de Herat. Dos años más tarde, mientras organizaba resistencia a los talibanes en la zona de Faryab, fue traicionado y capturado por Abdul Majid Rouzi, quien había desertado al Talibán junto con Abdul Malik Pahlawan, entonces uno de los diputados de Dostum."
 AFG_events.44.a: "Tomar las probabilidades una vez más"
 AFG_events.45.a: "¿Qué podemos hacer?"
 AFG_events.65.t: "Afghanistan hace un llamamiento de apoyo"
 AFG_events.65.d: "Enfrentándonos al equipo y los recursos en esta esfera, el Afganistán solicita urgentemente nuestra asistencia enviando agentes para capacitar a combatientes afganos locales y proporcionarles el equipo y los vehículos necesarios, lo que les permite combatir independientemente a los talibanes, reduciendo así la necesidad de una intervención militar directa"
 AFG_events.65.a: "Sí, lo haremos."
 AFG_events.65.b: "No we wont"
 AFG_events.66.t: "Aceptan"
 AFG_events.66.d: "Los Estados Unidos han aceptado la solicitud y estarán desplegando asesores junto con equipo para ayudar al Afganistán en su lucha contra los talibanes, lo que marca un paso significativo en el fortalecimiento de las fuerzas afganas y el fortalecimiento de los esfuerzos de colaboración para combatir la insurgencia y estabilizar la región."
 AFG_events.66.a: "Estaremos en movimiento"
 AFG_border_wars.1.t: "[event_target:AFG_ATTACKER.GetName] Gana Guerra Fronteriza"
 AFG_border_wars.1.d: "[event_target:AFG_ATTACKER.GetName] ha ganado la guerra fronteriza contra [event_target:AFG_DEFENDER.GetName] y avanzado en nuevas tierras. Es probable que continúen su ofensiva después de esto."
 AFG_border_wars.1.a: "Huzzah!"
 AFG_border_wars.1.b: "Damn"
 AFG_border_wars.1.c: "¡Súbete!"
 AFG_border_wars.2.t: "[event_target:AFG_ATTACKER.GetName] Pérdese la guerra fronteriza"
 AFG_border_wars.2.d: "[event_target:AFG_ATTACKER.GetName] ha perdido la guerra fronteriza contra [event_target:AFG_DEFENDER.GetName]."
 AFG_border_wars.2.a: "Huzzah!"
 AFG_border_wars.2.b: "Damn"
 AFG_border_wars.3.t: "Talibán se prepara para mudarse a zonas tribales"
 AFG_border_wars.3.d: "Los talibanes han estado haciendo planes para entrar en las zonas tribales, principalmente en la región de Waziristan del Norte y Parachinar. Hemos sido informados por un negociador talibán sobre sus planes, y esperan que los dejemos permanecer allí durante un 'tiempo temporal'. Si bien la región es muy insignificante en el gran esquema de las cosas, sigue siendo una pérdida de territorio y la incursión de terroristas radicales en la nación."
 AFG_border_wars.3.a: "Mientras sean útiles, pueden quedarse"
 AFG_border_wars.3.b: "Absolutamente no"
 AFG_border_wars.4.t: "Pakistán condena los planes para entrar en zonas tribales"
 AFG_border_wars.4.d: "El Gobierno pakistaní recientemente se ha puesto en contacto con nosotros y ha expresado su insatisfacción ante la perspectiva de que las fuerzas talibanes permanezcan en las regiones del norte de Waziristan y Parachinar. Aunque no es un resultado impactante, sigue siendo un obstáculo en nuestros esfuerzos por retomar el Afganistán."
 AFG_border_wars.4.a: "Fine"
 AFG_border_wars.4.b: "¡Al diablo con sus objeciones!"
 AFG_border_wars.5.t: "Pakistán permite el movimiento en las zonas tribales"
 AFG_border_wars.5.d: "El gobierno paquistaní ha señalado que van a ignorar nuestro movimiento en las regiones de Waziristan Norte y Parachinar. Esto significa que podemos seguir ampliando nuestras operaciones, y aumentar nuestras probabilidades en el caso de que comience un ataque afgano importante."
 AFG_border_wars.5.a: "Bien."
 AFG_border_wars.6.t: "Los talibanes nos ignoran"
 AFG_border_wars.6.d: "Los talibanes nos han ignorado y nuestras objeciones a sus recientes movimientos hacia la región de Waziristan del Norte y Parachinar. Parece que no tenemos más opción que usar la fuerza para enseñarles que no podemos ser pisoteados."
 AFG_border_wars.6.a: "Empezaron esto."
 AFG_border_wars.7.t: "Fuerzas Armadas Afganas aseguran la victoria"
 AFG_border_wars.7.d: "Tras una escaramuza con los talibanes, las Fuerzas Armadas Afganas lograron una victoria contra las fuerzas del Talibán. Esta batalla está siendo desfilada como una victoria a nivel nacional para [AFG.GetLeader]."
 AFG_border_wars.7.a: "Allahu-Akbar!"
 AFG_border_wars.7.b: "La victoria de Inshallah vendrá"
 AFG_border_wars.8.t: "Fuerzas de Talibán aseguran la victoria"
 AFG_border_wars.8.d: "Tras una escaramuza con el Ejército Nacional Afgano, las fuerzas talibanes lograron una victoria contra las fuerzas del ejército nacional afgano. Esta batalla está siendo desfilada como una victoria en todo el Talibán para [TAL.GetLeader]."
 AFG_border_wars.8.a: "Allahu-Akbar!"
 AFG_border_wars.8.b: "La victoria de Inshallah vendrá"
 AFG_border_wars.9.t: "Resultados inconclusivos después de la esquía talibán-afghan"
 AFG_border_wars.9.d: "Las fuerzas internacionales observaron una línea de frente congelada tras un escarabajo por parte de los talibanes y las fuerzas del Ejército Nacional Afgano. Se ha dicho que ambos lados de retrasaron sus ataques y se retiraron a sus regiones preescas."
 AFG_border_wars.9.a: "Okay"
 AFG_uzbek_bombing_of_the_imu: "Uzbeka Bombing Campaign"
