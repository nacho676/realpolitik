l_spanish:
 slovenia.9.t: "Eslovenia se une a la OTAN"
 slovenia.9.d: "La bandera eslovena ha sido levantada en la sede de la OTAN en Bruselas junto con otros seis nuevos miembros en la mayor ampliación de la historia de la alianza. Trece años después de la independencia, el país se encuentra bajo el paraguas del artículo 5."
 slovenia.9.a: "Un lugar más seguro en el mundo"
 slovenia.10.t: "Eslovenia se une a la Unión Europea"
 slovenia.10.d: "A medianoche las barreras en las fronteras austriaca, italiana y húngara fueron levantadas a fuegos artificiales y bandas de latón. Eslovenia entra en la Unión como el más rico de los diez nuevos miembros, y los primeros fondos estructurales ya están destinados a carreteras y ferrocarriles."
 slovenia.10.a: "Regreso entre el núcleo europeo"
 slovenia.11.t: "El Tolar da camino al Euro"
 slovenia.11.d: "Eslovenia es el primero de los nuevos estados miembros en adoptar el euro, retirando el tolar después de quince años de servicio. El cambio ha ido sin problemas, y se espera que el préstamo más barato mantenga la economía creciendo por encima del promedio de la eurozona."
 slovenia.11.a: "Adiós al tolar"
 slovenia.12.t: "Schengen abre las fronteras"
 slovenia.12.d: "Eslovenia ha entrado en la zona de Schengen y se están desmantelando las últimas cabinas de pasaporte en los cruces austriaco, italiano y húngaro. La frontera croata ahora forma la frontera exterior de la Unión, policial a los estándares de Bruselas."
 slovenia.12.a: "Europa sin puestos de control"
