l_spanish:
 TAI_legacy_of_1949: "Legacy of 1949"
 TAI_legacy_of_1949_desc: "El fin de la guerra civil china en 1949 vio al nacionalista Guomindang (KMT) y sus partidarios huyeron a la provincia insular de Taiwán. El legado de este evento, combinado con un movimiento local nativista taiwanés ha llevado a un fuerte rechazo de la reunificación con el continente por la mayoría de los ciudadanos taiwaneses."
 TAI_the_great_chip_empire: "El Gran Imperio Chip"
 TAI_the_great_chip_empire_desc: "Habiendo aprovechado la producción de semiconductores y microchip en su infancia, y siendo una inversión más atractiva que otras naciones. Taiwán se ha catapultado a la vanguardia de la industria. Aunque la producción barata, eficiente y las grandes exportaciones a las naciones occidentales, Taiwán ha equilibrado su economía y seguridad nacional al ser el suministro de microchips al mundo occidental, y sigue siendo un líder de la industria a través de una innovación constante y regular."
 TAI_flight_crew_strike: "Vuelo de Taoyuan Atenciones sindicales huelga"
 TAI_flight_crew_strike_desc: "¡Sin resultados! ¡No pares!"
 USA_tsmc_access_modifier: "Acceso al TSMC"
 USA_tsmc_access_modifier_desc: "La industria americana se beneficia del acceso confiable al ecosistema semiconductor de Taiwán. El beneficio se suspende si Taiwán deja de existir, pierde el control de Taipei, va a la guerra con los Estados Unidos o restringe las exportaciones semiconductoras."
 TAI_tsmc_trade_benefits_tier_1_tt: "Aumento del desarrollo del TSMC §YRecursos por fábrica§! to §G+1§! para §YTaiwán§! y el §YEstados Unidos§!. El beneficio americano requiere acceso continuo a Taiwán."
 TAI_tsmc_trade_benefits_tier_2_tt: "Aumento del desarrollo del TSMC §YRecursos por fábrica§! to §G+2§! para §YTaiwán§! y el §YEstados Unidos§!. El beneficio americano requiere acceso continuo a Taiwán."
 TAI_tsmc_trade_benefits_tier_3_tt: "Aumento del desarrollo del TSMC §YRecursos por fábrica§! to §G+3§! para §YTaiwán§! y el §YEstados Unidos§!. El beneficio americano requiere acceso continuo a Taiwán."
 TAI_foxconn_ev_pipeline: "Pipelina EV sin volumen"
 TAI_foxconn_ev_pipeline_desc: "Los vehículos de referencia y los programas asociados crean opciones de ingeniería, pero productos validados y clientes solventes siguen siendo escasos. El capital se comete antes de que llegue el volumen confiable."
 TAI_foxconn_factory_behind_brand: "La fábrica detrás de la marca"
 TAI_foxconn_factory_behind_brand_desc: "Hon Hai/Foxconn convierte los diseños de clientes en producción repetible a través de herramientas, adquisiciones, ingeniería de procesos, pruebas y logística. Su enorme rendimiento sigue siendo limitado por márgenes delgados y clientes poderosos."
 TAI_foxconn_factory_city_production: "Producción de fábrica-ciudad"
 TAI_foxconn_factory_city_production_desc: "Las redes de proveedores Dense, dormitorios, transporte y servicios industriales permiten rampas de producción rápidas. Concentrar el trabajo y la vida cotidiana dentro de algunos campus también aumenta los riesgos laborales y de perturbación."
 TAI_foxconn_resilient_manufacturing_network: "Red de fabricación resistente"
 TAI_foxconn_resilient_manufacturing_network_desc: "Una red Build, Operate, Localize conecta centros regionales cualificados y mantiene una valiosa capacidad continental. Redundancy mejora el acceso a los mercados y la recuperación de crisis a un costo permanente de coordinación."
 taiwan.300.a: "Construir la red continental más densa"
 taiwan.300.b: "Chase nuestra propia marca en lugar de construir para otros"
 taiwan.300.d: "Para 2000, Hon Hai/Foxconn, con sede en Taiwán, se ha convertido en un fabricante de electrónica establecido con un sistema de producción continental que se expande rápidamente. La administración debe decidir si mantener la construcción a escala para las marcas de otras personas, o pasar el mismo capital tratando de establecer una de sus propias."
 taiwan.300.t: "La fábrica detrás de la marca"
 taiwan.301.a: "Aumente los estándares y automatice cuidadosamente"
 taiwan.301.b: "Mantenga la línea en los costos y mueva la producción interior"
 taiwan.301.d: "Un grupo de muertes de trabajadores en el campus Longhua de Foxconn en Shenzhen e informes de angustia han llevado escrutinio a horas de trabajo, compensación, seguridad y vida dentro del sistema de la fábrica-ciudad. Las causas son impugnadas, pero la necesidad de una respuesta institucional no es."
 taiwan.301.t: "La crisis laboral de Shenzhen"
 taiwan.302.a: "Concentrar el sistema de lanzamiento en Zhengzhou"
 taiwan.302.b: "Construir varios nodos de producción interior"
 taiwan.302.d: "Zhengzhou ofrece infraestructura Foxconn, apoyo al reclutamiento y suficiente espacio para un inmenso campus de producción interior. El proyecto puede crear una extraordinaria capacidad de lanzamiento del iPhone mientras se profundiza la dependencia de un cliente, lugar y entorno de políticas."
 taiwan.302.t: "iPhone City"
 taiwan.303.a: "Liderar la recapitalización de Sharp"
 taiwan.303.b: "Preservar una asociación estratégica"
 taiwan.303.d: "Sharp necesita un socio de recapitalización, mientras que Foxconn quiere experiencia de visualización, ingenieros y una relación componente más cercana. El control traería un giro japonés difícil en lugar de una transferencia instantánea de tecnología."
 taiwan.303.t: "Sharp en el Brink"
 taiwan.304.a: "Compromiso al proyecto Wisconsin"
 taiwan.304.b: "Reducir el proyecto antes de la construcción"
 taiwan.304.d: "Washington ha respondido a la propuesta de Foxconn. La empresa debe decidir ahora si el soporte disponible justifica todo el compromiso, o si el proyecto debe ser recortado antes de que se rompa la tierra."
 taiwan.304.t: "El compromiso de Wisconsin"
 taiwan.305.a: "Una red de fabricación sin un solo choque puede romper"
 taiwan.305.b: "Un proveedor para la era del vehículo eléctrico"
 taiwan.305.c: "Una ciudad de fábrica construida alrededor del lanzamiento de un producto"
 taiwan.305.e: "La fábrica detrás de la marca de todos los demás"
 taiwan.305.d: "Los racks completos de IA combinan tablas, aceleradores, potencia, enfriamiento, cables y validación del sistema exactor, y Nvidia quiere que Foxconn los ensambla. Un cuarto de siglo de escala, crisis y diversificación ya ha decidido qué tipo de fabricante llega a ese trabajo."
 taiwan.305.t: "La fábrica de AI"
 taiwan.310.t: "Doce pulgadas a través de la calavera"
 taiwan.310.d: "El colapso semiconductor ha vaciado limpiezas que cuestan miles de millones para construir, y una fab TSMC no gana nada mientras está ocioso. La transición de 300 mm reduciría el costo de cada wafer, pero sólo después de años de herramientas, integración y rendimiento del paciente. Building Fab 12 ahora significa construirlo en un mercado que ha dejado de comprar."
 taiwan.310.a: "Funda la rampa de 300 mm a través de la recesión"
 taiwan.310.b: "Preserve efectivo hasta que la demanda regrese"
 taiwan.311.t: "Blueprints Sin Betrayal"
 taiwan.311.d: "Los clientes de TSMC necesitan kits de diseño, bibliotecas, herramientas y datos de calificación para construir cualquier cosa en nuestro proceso, y cada uno de ellos compite con los demás. La Plataforma de Innovación Abierta les entregaría los mismos materiales sin entregar ninguno de ellos el diseño de un rival. La confianza es el producto que se fabrica aquí."
 taiwan.311.a: "Publicar los kits y abrir la plataforma"
 taiwan.311.b: "Mantenga cada compromiso con el cliente bilateral"
 taiwan.312.t: "El anclaje móvil"
 taiwan.312.d: "Apple quiere más capacidad de vanguardia para el A8 que la mayoría de los otros clientes del TSMC combinados, y pagará por reservarlo años antes. Ese volumen financiaría el próximo nodo por sí mismo. También haría que las fortunas de la fundición enciendan el ciclo del producto de una empresa."
 taiwan.312.a: "Capacidad de reserva líder para el cliente ancla"
 taiwan.312.b: "Mantenga la línea en neutralidad de fundición"
 taiwan.313.t: "Arizona: Seguro a un precio"
 taiwan.313.d: "Washington quiere arrastres hechos en suelo americano, está dispuesto a ayudar a pagar por ellos, y TSMC es la empresa que se le pide. Un anuncio no es una fab: las herramientas, los ingenieros, el agua y los clientes tienen que llegar antes de que un solo wafer calificado lo haga, y cada uno de ellos cuesta más en Arizona que en Hsinchu. El seguro es real, y también la prima."
 taiwan.313.a: "Compromiso con los fabs extranjeros"
 taiwan.313.b: "Mantenga el borde líder en la isla"
 taiwan.314.t: "Los chips son el Bottleneck"
 taiwan.314.d: "Los fabricantes de automóviles, las marcas de consumo y los clientes informáticos están todos apostando por la salida TSMC que no existe, y sus gobiernos han comenzado a hacer las llamadas ellos mismos. Dejar que la asignación establecida por el Estado compraría una buena voluntad considerable en las capitales que importan. También le diría a cada cliente que una cola que no pueden ver ahora decide su lugar en él."
 taiwan.314.a: "Dejar que el Estado asigne directamente"
 taiwan.314.b: "Mantener la asignación comercial"
 taiwan.315.t: "El CoWoS Constraint"
 taiwan.315.d: "La ola ya no es la parte dura. Los aceleradores necesitan embalaje avanzado, memoria apilada y sustratos antes de que valgan cualquier cosa, y la capacidad de TSMC CoWoS no está lo suficientemente cerca. Construir esa capacidad convierte una fundición de wafer en algo más grande, y nos pone en negocios que nuestros propios clientes ocupan actualmente."
 taiwan.315.a: "Construir el embalaje avanzado en un negocio"
 taiwan.315.b: "Mantener una fundición de wafer pura"
 taiwan.316.t: "¿Qué tipo de fundición hemos construido?"
 taiwan.316.d: "Veinticinco años de nodos, retrocesos, clientes anfitriones y pioneros en el extranjero han resuelto lo que es TSMC, lo que la isla realmente fabrica, y quién decide a dónde va."
 taiwan.316.a: "Una fundición que el estado dirige"
 taiwan.316.b: "Una red aliada de confianza"
 taiwan.316.c: "Una fundición de sistemas, no una tienda de wafer"
 taiwan.316.e: "Una fundición de juego puro, y nada más"
 TAI_tsmc_state_directed_foundry: "El Estado dirige a la Fundición"
 TAI_tsmc_state_directed_foundry_desc: "La asignación corre a través del ministerio antes de pasar por la oficina de ventas, y la cola es una cuestión de política. La capacidad responde a los intereses de la isla primero y sus clientes segundo, y los clientes se han dado cuenta."
 TAI_tsmc_trusted_allied_foundry_network: "Trust Allied Foundry Network"
 TAI_tsmc_trusted_allied_foundry_network_desc: "Arizona, Kumamoto y Dresden calificaron y corrieron, por lo que el borde líder ya no es un solo punto en una sola isla. Cuesta más por wafer que concentrar todo en casa, y compra algo que la concentración nunca podría."
 TAI_tsmc_systems_foundry_platform: "Plataforma de fundición de sistemas"
 TAI_tsmc_systems_foundry_platform_desc: "Las olas, el embalaje, la memoria apilada y la prueba ahora salen como un producto calificado. La fundición vende la capacidad terminada en lugar de la capa debajo de ella, que es donde la restricción se había movido de todos modos."
 TAI_tsmc_disciplined_pure_play_foundry: "Disciplinado Pure Play Foundry"
 TAI_tsmc_disciplined_pure_play_foundry_desc: "Sin marcas, sin productos, sin competir con la gente que compra de nosotros. La disciplina que hizo el trabajo modelo es el modelo, y se ha mantenido exactamente como era."
 taiwan.320.t: "Acer divide la marca de fábrica"
 taiwan.320.d: "Acer construyendo computadoras de otras empresas y vendiendo su propio en los mismos estantes es un conflicto que los clientes pueden leer en una factura. Dividir la fabricación fuera como Wistron dejaría que cada medio negocio de persecución la otra mitad costo. También corta la empresa en dos en el momento en que es finalmente grande."
 taiwan.320.a: "Dividir la marca de la fábrica"
 taiwan.320.b: "Mantener un fabricante integrado"
 taiwan.321.t: "Las botellas de preguntas x86"
 taiwan.321.d: "Los años de litigio entre VIA Technologies e Intel sobre conjuntos de instrucciones y chipsets terminan en una licencia cruzada de diez años en lugar de una victoria en la sala. Los términos aseguran el derecho de VIA a seguir construyendo, en condiciones escritas por el titular. Un tercer proveedor x86 sigue siendo legalmente posible y comercialmente poco probable."
 taiwan.321.a: "Fijar y asegurar la licencia"
 taiwan.321.b: "Sosténgase para mejores términos"
 taiwan.322.t: "Una República de Gamers"
 taiwan.322.d: "Los compradores de componentes que eligen sus propias placas madre pagarán una prima por partes que se anuncian a sí mismos. ASUS lanzando una línea dedicada Republic of Gamers ganaría márgenes que la empresa de productos básicos nunca ve, y exige marketing, soporte y diseño que un proveedor componente nunca ha tenido que hacer."
 taiwan.322.a: "Construir la marca premium"
 taiwan.322.b: "Mantener un proveedor de componentes"
 taiwan.323.t: "La segunda separación"
 taiwan.323.d: "El mismo conflicto que dividió a Acer ahora divide su rival: la marca no puede crecer mientras la fábrica sirve a los competidores de la marca. Ejecutar el brazo de fabricación crea uno de los mayores fabricantes de contratos en la tierra. También da la fábrica que hizo posible la marca."
 taiwan.323.a: "Gire hacia fuera el brazo de fabricación"
 taiwan.323.b: "Mantenga la marca y la fábrica juntos"
 taiwan.324.t: "Un PC pequeño para todos"
 taiwan.324.d: "El netbook ASUS comenzó con el Eee PC se ha convertido en la categoría de venta más rápida en computación, y cada fabricante taiwanés puede construir un portátil barato, ligero, bajo potencia para el fin de semana. Los márgenes son terribles y los volúmenes son enormes. Si este es el futuro de la industria o un fad que entrena a los clientes para esperar nada todavía no está claro."
 taiwan.324.a: "Chase la transición móvil"
 taiwan.324.b: "Defender los márgenes de escritorio"
 taiwan.325.t: "El Margin Squeeze"
 taiwan.325.d: "Los teléfonos tomaron el volumen, las marcas tomaron el espacio de estante, y Acer, ASUS y los otros fabricantes de la isla están compitiendo entre sí por lo que queda de un mercado en disminución. Coordinar la industria de arriba les impediría subcortarse unos a otros. También significaría decidir, en un ministerio, cuál de ellos merece sobrevivir."
 taiwan.325.a: "Coordinar la industria desde arriba"
 taiwan.325.b: "Que el mercado lo consolide"
 taiwan.326.t: "Ecosistema de computación de Taiwán"
 taiwan.326.d: "Un cuarto de siglo de divisiones, espinas, marcas premium y guerras de precios ha resuelto lo que Acer, ASUS, Quanta y el resto de la industria informática de la isla son: cuyo nombre está en la caja, y cuya fábrica está detrás de ella."
 taiwan.326.a: "Un ecosistema de computación de espectro completo"
 taiwan.326.b: "Un almacén de sistemas de marca"
 taiwan.326.c: "Un componente global de la riqueza"
 taiwan.326.e: "Un marginado que nadie escapó"
 TAI_pc_full_spectrum_computing_ecosystem: "Ecosistema de computación de espectro completo"
 TAI_pc_full_spectrum_computing_ecosystem_desc: "Los componentes, la fabricación de contratos y las marcas terminadas se mantuvieron en una industria coordinada en lugar de dejarse cortar entre sí. La isla construye cada capa de un ordenador y decide entre ellos deliberadamente."
 TAI_pc_branded_systems_powerhouse: "Sistemas de marca Powerhouse"
 TAI_pc_branded_systems_powerhouse_desc: "Los nombres en las cajas son taiwaneses y mandan una prima, que es una posición que ningún proveedor componente tiene nunca. Las marcas son sostenidas por la atención, y la atención se alquila en lugar de propiedad."
 TAI_pc_global_component_commonwealth: "Componente mundial de Commonwealth"
 TAI_pc_global_component_commonwealth_desc: "Casi todos los ordenadores vendidos en cualquier lugar contienen partes construidas aquí, bajo el nombre de otra persona. Los volúmenes son extraordinarios y los márgenes pertenecen a quien pone la placa en."
 TAI_pc_fragmented_margin_squeeze: "Fragmentado Margin Squeeze"
 TAI_pc_fragmented_margin_squeeze_desc: "Demasiadas empresas capaces persiguieron el mismo mercado de encogimiento y se sometieron al otro todo hacia abajo. La ingeniería nunca dejó de ser buena; el precio nunca dejó de caer."