 AlgeriaFocusNews.100.t: "Iniciativa Casablanca: Cortesía de grandes poderes"
 AlgeriaFocusNews.100.d: "Argelia ha optado por recurrir a los principales poderes para respaldar su Iniciativa Casablanca. Esto es costoso pero aumenta la posibilidad de un fuerte resultado de la UA."
 AlgeriaFocusNews.101.t: "Iniciativa Casablanca: Enfoque Regional"
 AlgeriaFocusNews.101.d: "Argelia está siguiendo una vía diplomática regional y basada en los estados vecinos y aliados de la Unión Africana."
 AlgeriaFocusNews.102.t: "Iniciativa Casablanca: Estrategia mixta"
 AlgeriaFocusNews.102.d: "Argelia combinará los esfuerzos regionales e internacionales para aumentar la presión a la vez que se corren riesgos."
 AlgeriaFocusNews.103.t: "Iniciativa Casablanca: Mayor éxito"
 AlgeriaFocusNews.103.d: "La Iniciativa Casablanca logró un resultado decisivo en el proceso de la UA/ONU. La presión diplomática tiene un impulso real; Argelia está en condiciones firmes de presionar a Marruecos para que abandone las reivindicaciones diplomáticas (y, bajo su enfoque, retire los núcleos)."
 AlgeriaFocusNews.104.t: "Iniciativa Casablanca: éxito moderado"
 AlgeriaFocusNews.104.d: "La Iniciativa Casablanca produjo un resultado diplomático significativo. La presión sobre Marruecos aumentó; la UA es partidaria pero no decisiva."
 AlgeriaFocusNews.105.t: "Iniciativa Casablanca: modesto resultado"
 AlgeriaFocusNews.105.d: "La Iniciativa Casablanca sólo produjo una simpatía modesta en la Unión Africana. Necesitarás más trabajo para forzar concesiones importantes."
 AlgeriaFocusNews.106.t: "Iniciativa Casablanca: Misión Se acabó el tiempo"
 AlgeriaFocusNews.106.d: "El tiempo ha transcurrido sin un resultado sustantivo. Se pierde el impulso diplomático."
