 ALG_dialogue_complete_tt: "El diálogo nacional ha concluido con éxito."
 ALG_reintegrate_fighters_complete_tt: "Los ex combatientes se han reintegrado con éxito."
 ALG_fis_return_threat: "Retorno del Frente Islámico de Salvación en Argelia"
 ALG_fis_return_western_concern: "Alarmado por el Gobierno salafista en Argelia"
 ALG_fis_return_salafi_solidarity: "Apoya al Gobierno salafista en Argelia"
 ALG_fis_return_islamist_sympathy: "Acoge con cautela al Gobierno islamista en Argelia"
 ALG_fis_return_neighbor_alarm: "Alarmado por la ocupación islamista en Argelia"
 ALG_fis_return_anti_political_islam: "oposición al islam político en Argelia"
 ALG_world_tension_security_ended_tt: "Se han puesto de relieve las medidas de seguridad."
 ALG_world_tension_high_security_ended_tt: "La alerta de alta seguridad ha terminado."
 ALG_crackdown_momentum_ended_tt: "El impulso de arranque ha disminuido."
 ALG_reconciliation_momentum_ended_tt: "El impulso de la reconciliación se ha desvanecido."
 ALG_by_the_people_for_the_people: "Por el pueblo, por el pueblo"
 ALG_by_the_people_for_the_people_desc: "El movimiento Hirak ha sacudido a Argelia en su núcleo. El pueblo exige una transformación completa del sistema político, no sólo un cambio de rostros, sino una reestructuración fundamental del poder. El viejo guardia no se irá en silencio."
 ALG_by_the_people_for_the_people_tt: "El movimiento §YHirak§! debe tener suficiente impulso (el equilibrio de poder por encima del §G70%§!)."
 ALG_break_the_oligarchs: "Romper los Oligarchs"
 ALG_break_the_oligarchs_desc: "La red de empresarios que se beneficiaron de su proximidad al régimen debe ser desmantelada. Sus activos serán incautados, revisarán sus contratos y su influencia sobre el estado terminará para siempre."
 ALG_dismantle_le_pouvoir: "Desmantelamiento Le Pouvoir"
 ALG_dismantle_le_pouvoir_desc: "El estado de sombra, los generales, los servicios de inteligencia, la mano invisible que ha guiado a Argelia desde su independencia, deben ser llevados a la luz y despojados de su autoridad."
 ALG_new_economic_model: "Un nuevo modelo económico"
 ALG_new_economic_model_desc: "Con los oligarcas eliminados, Argelia necesita una nueva visión económica. El modelo estatal de alquiler está muerto. En su lugar, una economía diversificada basada en la industria, la tecnología y el capital humano."
 ALG_unleash_civil_society: "Sociedad civil"
 ALG_unleash_civil_society_desc: "Una prensa libre, sindicatos independientes y partidos políticos que representan verdaderas circunscripciones, son los cimientos sobre los cuales se construye la democracia."
 ALG_constitutional_convention: "Convención Constitucional"
 ALG_constitutional_convention_desc: "Representantes de toda Argelia se reúnen para redactar una nueva constitución. Por primera vez, el documento será escrito por el pueblo, no impuesto por los poderosos."
 ALG_presidential_republic: "República Presidencial"
 ALG_presidential_republic_desc: "Argelia adoptará un sistema presidencial con una firme autoridad ejecutiva, clara y democrática. El presidente gobierna decisivamente mientras que las salvaguardias constitucionales impiden el abuso de poder."
 ALG_parliamentary_republic: "República parlamentaria"
 ALG_parliamentary_republic_desc: "Argelia adoptará un sistema parlamentario en el que se comparta el poder entre los representantes elegidos. La creación de una coalición y el consenso aseguran que ninguna persona pueda dominar nuevamente al Estado."
 ALG_civilian_military_control: "Control militar civil"
 ALG_civilian_military_control_desc: "Los militares deben servir al estado, no gobernarlo. Los funcionarios del cuadro orgánico reemplazan a los generales políticos. El ejército es modernizado, despolitizado y está firmemente sometido a la autoridad civil."
 ALG_democratic_dividend: "El dividendo democrático"
 ALG_democratic_dividend_desc: "Una Argelia transparente y democrática atrae la inversión extranjera, las asociaciones internacionales y el retorno de la diáspora. La economía diversifica más allá de los hidrocarburos mientras el mundo toma nota."
 ALG_a_new_algeria: "Una nueva Argelia"
 ALG_a_new_algeria_desc: "De las cenizas del viejo régimen, emerge una nueva nación. Las redes de corrupción están desmanteladas. El desagüe del cerebro revierte. Argelia es prueba de que la democracia auténtica puede construirse a través de la voluntad de su propio pueblo."
 ALG_transitional_instability: "Instalación de transición"
 ALG_transitional_instability_desc: "El colapso del viejo orden ha dejado un vacío de poder. Las instituciones son débiles, la economía se interrumpe y las fuerzas políticas compiten para dar forma al futuro."
 ALG_economic_disruption: "Disrupción económica"
 ALG_economic_disruption_desc: "La incautación de activos oligárquicos y la reestructuración de contratos corruptos ha perturbado temporalmente la actividad económica."
 ALG_free_press_and_assembly: "De prensa & Asamblea General"
 ALG_free_press_and_assembly_desc: "Los periódicos independientes publican sin miedo. Los ciudadanos se organizan libremente. La plaza pública pertenece al pueblo."
 ALG_diversified_economy: "Economía diversificada"
 ALG_diversified_economy_desc: "La economía de Argelia va más allá de la dependencia del petróleo hacia la industria, la tecnología y el desarrollo sostenible."
 ALG_new_constitution_permanent: "La Constitución Popular"
 ALG_new_constitution_permanent_desc: "Escrito por delegados elegidos y ratificado por referéndum popular, la nueva constitución de Argelia consagra los derechos democráticos, la separación de poderes y el estado de derecho."
 ALG_presidential_system: "Sistema Presidencial"
 ALG_presidential_system_desc: "Un ejecutivo fuerte con autoridad clara y rendición de cuentas democrática gobierna decididamente a Argelia."
 ALG_parliamentary_system: "Sistema parlamentario"
 ALG_parliamentary_system_desc: "Un sistema deliberativo donde los representantes electos debaten, negocian y construyen consenso. El poder es compartido entre partidos y coaliciones."
 ALG_professional_military: "Fuerzas Armadas Profesionales"
 ALG_professional_military_desc: "Depolitizado, modernizado y bajo mando civil. El ejército argelino sirve a la nación en lugar de controlarla."
 ALG_foreign_investment_boom: "El boom de la inversión extranjera"
 ALG_foreign_investment_boom_desc: "El capital internacional fluye hacia la Argelia democrática. La gobernanza transparente y el estado de derecho hacen del país un destino atractivo para la inversión."
 ALG_beacon_of_democracy: "Beacon de la democracia"
 ALG_beacon_of_democracy_desc: "Argelia es una prueba viviente de que es posible una transformación democrática genuina. La nación inspira movimientos en toda la región y atrae la admiración mundial."
 ALG_the_nation_stands_at_a_crossroads_desc: "Argelia emerge de la década negra asustada. Más de 200.000 muertos, aldeas enteras afeitadas y una economía engullida por la guerra civil. El Presidente Bouteflika ha puesto en juego su mandato sobre la Concordia Civil, ofreciendo amnistía a los militantes y una reforma prometedora. Pero detrás de él está Le Pouvoir, la sombría red de generales y oficiales de inteligencia que han gobernado Argelia desde su independencia. El camino hacia adelante pertenece a quien controla lo que viene después."
 ALG_counterterrorism_agency_desc: "La Département du Renseignement et de la Sécurité (DRS) fue reconstruida a partir de los restos del antiguo servicio militar de inteligencia Sécurité Militaire (SM) tras la Guerra Civil. Operando con autonomía casi total de la supervisión civil, el DRS se convirtió en la institución más poderosa de Argelia, más temida que la propia presidencia."
 ALG_investments_in_iraq: "Iraqi Friendship"
 ALG_investments_in_iraq_desc: "A pesar de que Irak tiene menos que lazos ideales con nosotros en el pasado, es mejor que nos calentamos unos a otros. Podemos invertir en infraestructura iraquí y ganar su confianza"
 ALG_diplo: "Diplomacia de MSP"
 ALG_diplo_desc: "Debemos reformar nuestra diplomacia de acuerdo con nuestro nuevo gobierno."
 ALG_balance_islamists_and_secularists: "Balance islamistas y secularistas"
 ALG_balance_islamists_and_secularists_desc: "Hay que mantener un equilibrio frágil entre los movimientos religiosos y las élites seculares, el fracaso corre el riesgo de un conflicto renovado."
 ALG_new_constutition_reforms: "Reformas constitucionales"
 ALG_new_constutition_reforms_desc: "Las demandas de reforma no pueden ser ignoradas para siempre. Una nueva constitución puede abrir el camino hacia una gobernanza más pluralista."
 ALG_denounce_previous_colonialist_regimes: "Denuncia de la Ley Francesa sobre el Colonialismo"
 ALG_denounce_previous_colonialist_regimes_desc: "La polémica ley de Francia que glorifica su pasado colonial ha provocado indignación. El FLN debe liderar la acusación de denunciar los crímenes colonialistas y reafirmar la lucha anticolonial de Argelia."
 ALG_share_power: "Compartir poder"
 ALG_share_power_desc: "En lugar de gobernar solo, el FLN puede compartir con cautela el poder con selectas fuerzas opositoras y tecnócratas. Esto puede preservar la estabilidad al tiempo que reduce el enojo popular contra el régimen."
 ALG_legacy_revolution: "FLN"
 ALG_legacy_revolution_desc: "Front de libération nationale (Frente Nacional de Liberación) es un partido nacionalista argelino, que fue el único partido legal hasta 1989, cuando gobernó Argelia como un Estado de partido único. Después de la Guerra Civil argelina, recuperó el poder en 2002 como el partido más popular y lo mantuvo desde entonces. Su ideología sigue una mentalidad nacionalista panárabe con el anticolonialismo como su valor básico original. Apoya el socialismo, pero en particular el socialismo árabe, ya que se opone a las ideas marxistas."
 ALG_devlop_industry: "Desarrollo de la industria nacional"
 ALG_devlop_industry_desc: "El futuro de Argelia depende del fortalecimiento de su base industrial. Centrándonos en el desarrollo de sectores clave como la fabricación, la producción energética y la tecnología, podemos reducir la dependencia de las importaciones extranjeras y construir una economía autosuficiente."
 ALG_expand_hydro: "Ampliar infraestructura hidroeléctrica"
 ALG_expand_hydro_desc: "Para apoyar las crecientes demandas energéticas de nuestra nación y reducir la dependencia de los recursos extranjeros, debemos invertir en expandir el poder hidroeléctrico. Harnessing nuestros ríos no sólo proporcionará energía limpia sino también fortalecer nuestra base industrial y mejorar los medios de vida de nuestros ciudadanos."
 ALG_optimize_water_management: "Optimización de la gestión del agua"
 ALG_optimize_water_management_desc: "Para combatir la escasez de agua y mejorar la producción agrícola, debemos implementar sistemas modernos de gestión del agua. La distribución y conservación eficientes ayudarán tanto a las comunidades rurales como a los centros urbanos en crecimiento, haciendo que nuestra tierra sea más resistente a la sequía."
 ALG_hydroelectric_authority: "Autoridad hidroeléctrica nacional"
 ALG_hydroelectric_authority_desc: "Mediante el establecimiento de una autoridad hidroeléctrica centralizada, podemos desarrollar sistemáticamente los recursos hídricos sin explotar de Argelia. Esto proporcionará electricidad fiable para la industrialización, creando empleos y conocimientos técnicos en los sectores de energía renovable."
 ALG_electrify_rural_algeria: "Electrificar la Argelia rural"
 ALG_electrify_rural_algeria_desc: "Llevar electricidad al campo de Argelia es esencial para el desarrollo moderno. Mediante la expansión de las redes y los proyectos hidroeléctricos locales, podemos mejorar los niveles de vida, permitir la agricultura mecanizada y conectar comunidades remotas al progreso nacional."
 ALG_foreign_investment: "Atraer inversión extranjera"
 ALG_foreign_investment_desc: "Para acelerar nuestro desarrollo económico, debemos crear condiciones favorables para el capital internacional. Las alianzas estratégicas en los proyectos de infraestructura y energía aportarán tanto financiación como conocimientos técnicos manteniendo al mismo tiempo la soberanía nacional."
 ALG_algeria_islamic: "MSP"
 ALG_algeria_islamic_desc: "Mouvement de la société pour la paix (Movement of Society for Peace) es un partido político de derecha a extrema derecha en Argelia. Fue fundada en 1990 por la Hermandad Musulmana, con la que sigue alineada. Es islamista sunita y sigue la democracia islámica y conservadora. Tuvo su mayor éxito en las elecciones legislativas de 1997, siendo el segundo partido más grande y consiguiendo 69 de 380 escaños. También funcionó una vez en las elecciones presidenciales de 1995, obteniendo el 25,6% de los votos. Ingresó en una coalición electoral con el MRN y la RMN en 2012. El partido es conocido también como «Hamas», como una abreviatura de su nombre árabe «Harakat mujtama' as-silm»."
 ALG_algerian_islamic_movement: "Movimiento Islámico de Argelia"
 ALG_algerian_islamic_movement_desc: "El movimiento islámico en breve fue un movimiento islamista en pavo que era muy popular entre los estudiantes abogando por una visión pacifista y moderna del islam. Nos inspiraremos en sus enseñanzas y reformaremos nuestros planes de estudios escolares para defender los valores islámicos y enseñarles a los estudiantes, así como mejorar la educación general."
 ALG_nationwide_security_presence_desc: "Las fuerzas de seguridad se movilizan en todo el país bajo la Operación Halcón del Desierto para desalentar las manifestaciones del Hirak. Aunque eficaz para disuadir las protestas, esta medida aumenta los costos y socava la confianza pública."
 algerian_events.300.t: "Creciendo los disturbios"
 algerian_events.300.d: "Reportes de protestas esporádicas y desobediencia civil se están engañando desde todo el país. La frustración pública por la corrupción, el desempleo y la falta de reforma política está llegando a un punto de ebullición. Por ahora, las manifestaciones permanecen dispersas, pero podrían fácilmente ir en espiral hacia algo mucho más grande."
 algerian_events.300.a: "Va a explotar."
 algerian_events.300.b: "Esto podría salir de la mano."
 algerian_events.230.t: "Protestas masivas Sweep Argelia"
 algerian_events.230.d: "Argelia se ha visto sacudida por protestas masivas y sostenidas que exigen una reforma política y un fin al establecimiento gobernante. Cientos de miles han salido a las calles en ciudades de todo el país en lo que se llama un nuevo movimiento Hirak. La comunidad internacional observa de cerca a medida que se desarrolla la situación."
 algerian_events.230.a: "Un momento crucial para Argelia."
 ALG_deepen_african_union: "Profundización de la cooperación de la Unión Africana"
 ALG_deepen_african_union_desc: "Argelia ha sido durante mucho tiempo uno de los pilares de la diplomacia africana. Al fortalecer activamente nuestro papel dentro de la Unión Africana, podemos mejorar nuestra influencia en el continente, fomentar la solidaridad y promover iniciativas para la paz y la integración económica. Aunque esto nos costará económicamente, reforzará nuestra legitimidad en África."
 ALG_strengthen_maghreb_union: "Fortalecer la Unión del Magreb"
 ALG_strengthen_maghreb_union_desc: "El sueño de la integración regional en África septentrional ha permanecido difícil, pero Argelia tiene el potencial de reactivarla. Al fomentar la cooperación con nuestros vecinos del Magreb, podemos reducir las barreras al comercio, mejorar la confianza diplomática y reforzar nuestros vínculos culturales e históricos compartidos."
 ALG_restoration_of_the_ummah: "Restauración de la Ummah"
 ALG_restoration_of_the_ummah_desc: "La visión de un mundo islámico unido está al alcance. Los fieles se levantarán una vez más bajo una sola bandera."
 ALG_guidance_council: "El Consejo de Orientación"
 ALG_guidance_council_desc: "Un consejo de académicos superiores supervisará nuestras políticas y asegurará que el gobierno siga siendo fiel a la guía divina."
 ALG_restore_the_ummah_experiment: "El experimento de Ummah"
 ALG_restore_the_ummah_experiment_desc: "Intentaremos crear un nuevo modelo de gobernanza, mezclando la fe, la ley y el liderazgo para inspirar al mundo musulmán."
 ALG_victory_of_the_faithful: "Victoria de los fieles"
 ALG_victory_of_the_faithful_desc: "Nuestra perseverancia y devoción han traído la victoria. Argelia será ahora el bastión de los fieles en todo el mundo."
 ALG_exterminate_corruption: "Extermina la corrupción"
 ALG_exterminate_corruption_desc: "Propuraremos la corrupción de cada institución. Ningún funcionario, ningún soldado y ningún clérigo estará por encima de la justicia divina."
 ALG_to_serve_allah: "Para servir a Allah"
 ALG_to_serve_allah_desc: "Nuestra regla no es para la ambición mundanal, sino sólo para Alá. Cada política, cada reforma y toda lucha debe reflejar sumisión a Su voluntad divina. Servir a Alá es purificar tanto la nación como el alma."
 ALG_economic_islamization: "La islamización económica"
 ALG_economic_islamization_desc: "Reconstruiremos nuestra economía sobre bases islámicas. Los sistemas basados en intereses y la corrupción serán reemplazados por las finanzas, la ética comercial y una distribución justa de la riqueza."
 ALG_rust_belt_rejuvenation_desc: "Las fábricas abandonadas durante los años de agitación se remontan a la vida. Nuestros trabajadores, guiados por la fe y el propósito, reconstruirán las tierras industriales de Argelia."
 ALG_rule_to_perfection_desc: "Nuestra gobernanza debe ser refinada y perfeccionada. El Califato de la mente, el estado del alma, perfección en administración a través de la disciplina divina."
 ALG_new_islamic_architecture_desc: "Una nueva era exige un nuevo rostro para nuestra nación. A través de mezquitas, escuelas y edificios cívicos, la belleza del arte islámico simbolizará el renacimiento de Argelia."
 ALG_prioritize_military_industries_desc: "Un ejército fiel debe estar armado por una industria fiel. Daremos prioridad a la producción militar, asegurando que nuestra defensa se apoye en la fuerza nacional."
 ALG_industrialize_the_umma_desc: "La industria servirá al Islam, no a la codicia. La Ummah debe convertirse en autosuficiente, productivo y orgulloso, una civilización alimentada tanto por el acero como por la fe."
 ALG_militarize_the_nation: "Militarizar la Nación"
 ALG_militarize_the_nation_desc: "Todo creyente debe estar listo para defender a la Ummah. Prepararemos nuestra sociedad para la movilización total bajo el mando divino."
 ALG_soldiers_of_faith: "Soldados de la Fe"
 ALG_soldiers_of_faith_desc: "Nuestros soldados no luchan por la tierra o el poder, sino por la fe misma. El Ejército de la Fe será el escudo del Islam y la espada de la nación."
 ALG_forged_in_belief: "Forjado en Belief"
 ALG_forged_in_belief_desc: "La fe es nuestro acero, inquebrantable e inquebrantable. Los soldados de Argelia son forjados en creencias y guiados por la convicción divina."
 ALG_disciplined_army_of_god: "Ejército de Dios disciplinado"
 ALG_disciplined_army_of_god_desc: "Forjaremos un ejército construido sobre la obediencia, pureza y devoción inquebrantable. Cada soldado es un guerrero y un siervo de Dios."
 ALG_made_of_steel_and_faith: "Hecho de acero y fe"
 ALG_made_of_steel_and_faith_desc: "Nuestras legiones marcharán con la fuerza del hierro y la fe de los profetas. La disciplina y la creencia se fusionarán en una fuerza irrompible."
 ALG_unrestricted_research: "Investigación sin restricciones"
 ALG_unrestricted_research_desc: "La ciencia no es el enemigo de la fe. Guiados por el propósito divino, abrazaremos la investigación moderna para avanzar en nuestras capacidades militares y tecnológicas."
 ALG_ai_military_integration: "AI Integración Militar"
 ALG_ai_military_integration_desc: "La inteligencia artificial y la automatización se convertirán en herramientas para el servicio del orden divino. Integraremos estos sistemas en nuestra estructura de defensa para mejorar la precisión y el control."
 ALG_new_executors_continent: "Nuevos ejecutores del continente"
 ALG_new_executors_continent_desc: "Argelia está dispuesta a hacer cumplir la justicia divina en toda África. Nuestra fe y acero formarán el destino del continente."
 ALG_the_future_in_the_present: "El futuro en el presente"
 ALG_the_future_in_the_present_desc: "El futuro ya está sobre nosotros, guiado por la sabiduría de Allah y fortalecido por la innovación humana. Nuestra nación guiará a los fieles en una nueva era."
 ALG_destroy_their_will: "Destruir su voluntad"
 ALG_destroy_their_will_desc: "Destruiremos a todos los que se opongan a la fe, en mente, en voluntad y en cuerpo. La resistencia se romperá, y el orden divino prevalecerá."
 ALG_declare_jihad: "Proclamar la Jihad"
 ALG_declare_jihad_desc: "Nuestro movimiento ha madurado. Ya no nos limitaremos a sermones y reformas. Ha llegado el momento de unir a los fieles bajo las armas, declarar una yihad contra la corrupción y la tiranía en las tierras del islam."
 ALG_tharir_al_aqsa: "Tahrir al-Aqsa"
 ALG_tharir_al_aqsa_desc: "La liberación de Al-Aqsa es el deber eterno de la Ummah. Reuniremos a los fieles en todo el Medio Oriente, forjando una alianza sagrada bajo una bandera de resistencia y unidad."
 ALG_faction_with_middle_east: "Unirse con el Frente Medio Oriente"
 ALG_faction_with_middle_east_desc: "El Oriente Medio sigue siendo el corazón espiritual del Islam. De Damasco a Meca, nuestro llamado se hará eco, uniendo naciones sunitas que anhelan defender Al-Aqsa y resistir a los opresores."
 ALG_faction_with_north_africa: "Unirse con el Frente Norteafricano"
 ALG_faction_with_north_africa_desc: "Nuestros hermanos en el norte de África, desde los desiertos de Libia hasta las calles de El Cairo, han soportado las mismas luchas. Es hora de llegar e invitarlos a nuestra causa."
 ALG_faction_with_asia: "Unirse con el Frente Oriental"
 ALG_faction_with_asia_desc: "La luz del Islam brilla más allá de Arabia. Los pueblos de Asia Central y del Sur deben ser llamados a unirse al levantamiento de Ummah, desde las estepas hasta las islas del Este."
 ALG_faction.1.t: "Una invitación de Argel"
 ALG_faction.1.d: "Un comunicado diplomático de Argel ha llegado a nuestro gobierno. El Frente Islámico de Salvación, ahora en el poder en Argelia, invita a las naciones del Oriente Medio a unirse a una nueva coalición, el Frente de Liberación de Al-Aqsa, dedicada a coordinar el apoyo político y material para la defensa y liberación de al-Aqsa. Aceptar nos ataría a una causa regional; negarnos nos mantendría alejados del proyecto de Argelia. ¿Cómo responderemos?"
 ALG_faction.1.a: "Aceptar, unirse al Frente de Liberación de Al-Aqsa"
 ALG_faction.1.b: "Decline, no nos uniremos a esta coalición regional"
 ALG_faction.2.t: "Una propuesta del Magreb"
 ALG_faction.2.d: "Las delegaciones de Argelia han invitado formalmente a los gobiernos del norte de África a comprometer la cooperación dentro de una nueva coalición, el Frente de Liberación de Al-Aqsa. La propuesta busca un frente del Magreb para coordinar la presión política y el apoyo humanitario a Palestina. La unión profundizaría los vínculos con Argel; la disminución preservaría nuestra actual autonomía. ¿Cómo respondemos?"
 ALG_faction.2.a: "Sí, el Magreb se mantendrá unido"
 ALG_faction.2.b: "No, este no es un camino que tomaremos"
 ALG_faction.3.t: "Una llamada de Argel al Este"
 ALG_faction.3.d: "Los enviados argelinos han alcanzado una oferta a las naciones musulmanas asiáticas: únase al Frente de Liberación de Al-Aqsa, una coalición destinada a coordinar los esfuerzos diplomáticos, políticos y materiales para la defensa de Al-Aqsa. La iniciativa pide solidaridad en todas las regiones; también corre el riesgo de enredamiento en conflictos más amplios. ¿Nos uniremos a la coalición de Argel?"
 ALG_faction.3.a: "Únete, respondemos al llamado de solidaridad"
 ALG_faction.3.b: "Rechazar, debemos evitar este enredo"
 ALG_islamic_offices: "Establecer oficinas islámicas"
 ALG_islamic_offices_desc: "Para gobernar bajo los principios del Islam, nuestro movimiento debe construir una estructura organizada capaz de gestionar tanto la fe como el estado. Al establecer oficinas islámicas en todo el país, supervisaremos la educación religiosa, los asuntos sociales y la orientación moral, asegurando que la gobernanza se ajuste a los valores de la Ummah. Estas oficinas servirán como la columna vertebral de nuestro nuevo orden, uniendo a las personas bajo fe, disciplina y justicia."
 ALG_integrate_kabylie_tt: "§GIntegrar a Kabylie pacíficamente§!"
 ALG_improve_relations_with_egypt: "Mejorar las relaciones con Egipto"
 ALG_improve_relations_with_egypt_desc: "Egipto y Argelia comparten vínculos profundos como naciones árabes líderes. El MSP, con sus raíces en la tradición de la Hermandad Musulmana, ve a El Cairo como un socio natural. El fortalecimiento de las relaciones con Egipto mejorará nuestra posición en el mundo árabe y abrirá puertas para la cooperación económica y religiosa."
 ALG_el_karaouin_uni: "Universidad de Al-Qarawiyin"
 ALG_el_karaouin_uni_desc: "Al establecer vínculos con una de las universidades islámicas más antiguas del mundo, la FIS cultivará una generación de eruditos leales al nuevo orden, distanciando a los militares de autoridad religiosa."
 ALG_father_of_the_ummah: "Padre de la Ummah"
 ALG_father_of_the_ummah_desc: "El líder del Frente Islámico de Salvación se posicionará como el padre espiritual de toda la comunidad musulmana, cultivando un culto de personalidad arraigado en piedad y mandato divino."
 ALG_followers_of_the_prophet: "Seguidores del Profeta"
 ALG_followers_of_the_prophet_desc: "El estado será reen forma alrededor de la estricta adherencia a la Sunnah. Se espera que los ciudadanos vivan como lo hizo el Profeta, y las instituciones gubernamentales serán reestructuradas para reflejar esta visión."
 ALG_governmental_cleansing: "Governmental Cleansing"
 ALG_governmental_cleansing_desc: "Aquellos dentro del aparato estatal que se consideran insuficientemente devotos o impuro ideológico serán removidos sistemáticamente y reemplazados por fieles adherentes al movimiento."
 ALG_make_our_nation_pure: "Hacer que nuestra nación sea pura"
 ALG_make_our_nation_pure_desc: "La FIS lanzará una extensa campaña social para purgar la influencia occidental de la sociedad argelina, haciendo cumplir los valores islámicos en la educación, el vestido y el comportamiento público."
 ALG_new_patriotism: "Un nuevo patriotismo"
 ALG_new_patriotism_desc: "El amor de Argelia y el amor del Islam son uno y el mismo. La FIS forjará una nueva identidad nacional donde la fe es el fundamento del orgullo cívico y el propósito colectivo."
 ALG_restore_the_soul_of_the_ummah: "Restaurar el alma de la Ummah"
 ALG_restore_the_soul_of_the_ummah_desc: "Argelia asumirá el deber sagrado de reavivar la llama espiritual del mundo musulmán, posicionando al Estado como la brújula moral para todas las naciones islámicas."
 ALG_sharia_through_discipline: "A través de la disciplina"
 ALG_sharia_through_discipline_desc: "La ley de la sharia se aplicará no a través de la persuasión sino mediante una disciplina firme. El Estado ampliará sus facultades de policía y castigo para garantizar el pleno cumplimiento del derecho islámico."
 ALG_strength_and_virtue: "Fuerza y Virtud"
 ALG_strength_and_virtue_desc: "Un estado fuerte y un pueblo virtuoso son inseparables. La FIS invertirá tanto en educación moral como disciplina institucional para construir una sociedad que sea justa de carácter y firme en resolución."
 ALG_strict_authority: "Una autoridad estricta"
 ALG_strict_authority_desc: "La nueva Argelia requiere una mano firme. La FIS centralizará el poder y aumentará el presupuesto policial, asegurando que la población se adhiera a los estándares de conducta del movimiento."
 ALG_the_people_are_not_to_be_trusted: "La gente no debe ser confiada"
 ALG_the_people_are_not_to_be_trusted_desc: "La democracia ha demostrado ser una puerta de entrada para la corrupción y la impiedad. La FIS desmantelará el proceso democrático y pondrá la gobernanza firmemente en manos de aquellos que saben lo que Dios exige."
 ALG_urban_preachers: "Predicadores urbanos"
 ALG_urban_preachers_desc: "La FIS enviará una red de predicadores a las ciudades de Argelia, difundiendo la ideología del movimiento y consolidando al Islam como la fuerza dominante en la vida pública."
 ALG_jamiat_al_karaouin_desc: "Ties con la antigua institución Al-Qarawiyin han producido una nueva clase de eruditos islámicos leales al estado del FIS y hostiles a la injerencia militar en los asuntos religiosos."
 ALG_coalition_economic_program: "Programa económico de coalición"
 ALG_coalition_economic_program_desc: "La coalición presidencial debe presentar una visión económica unida. Mediante la coordinación de las políticas económicas de nuestros socios de coalición, podemos atraer inversiones, apoyar a las pequeñas empresas y sentar las bases para el crecimiento sostenible. Una economía fuerte legitimizará la coalición y silenciará a nuestros críticos."
 ALG_governmental_transparency: "Transparencia gubernamental"
 ALG_governmental_transparency_desc: "Si nuestro camino democrático es significar algo, debemos mantenernos en un nivel más alto que aquellos que vinieron ante nosotros. Mediante la implementación de medidas de transparencia y la apertura de registros gubernamentales al escrutinio público, podemos erradicar la corrupción y restaurar la fe del pueblo en sus instituciones, incluso si eso significa hacer enemigos entre los viejos guardias."
 ALG_support_mujahideen: "Apoyar a Mujahideen"
 ALG_support_mujahideen_desc: "Sectores del Estado abogan por un apoyo encubierto a combatientes islamistas que operan en la región. Aunque tales acciones podrían reforzar nuestra influencia entre redes radicales y desestabilizar a actores hostiles, corren el riesgo de una fuerte reacción internacional y de consecuencias internas a largo plazo."
