 ALG_khenchela_trait_desert_hardened: "Equipos Desert-Hardened"
 ALG_khenchela_trait_desert_hardened_desc: "Armas diseñadas y probadas específicamente para condiciones saharauis, con mayor estanqueidad de polvo y resistencia al calor."
 ALG_khenchela_trait_simplified_maintenance: "Mantenimiento simplificado"
 ALG_khenchela_trait_simplified_maintenance_desc: "Diseños racionalizados que reducen las necesidades de mantenimiento y los costos parciales de sustitución."
 ALG_khenchela_trait_standardized_production: "Líneas de producción estandarizadas"
 ALG_khenchela_trait_standardized_production_desc: "Implementar procesos de fabricación uniformes para aumentar la eficiencia de producción."
 ALG_khenchela_trait_mass_production_focus: "Producción masiva Enfoque"
 ALG_khenchela_trait_mass_production_focus_desc: "Ampliar la capacidad de producción para satisfacer las demandas de un gran ejército permanente."
 ALG_seriana_trait_kalashnikov_expertise: "Experiencia de Kalashnikov"
 ALG_seriana_trait_kalashnikov_expertise_desc: "Décadas de experiencia produciendo rifles AK-pattern proporciona una fiabilidad y potencia de fuego superior."
 ALG_seriana_trait_licensed_production: "Eficiencia de producción autorizada"
 ALG_seriana_trait_licensed_production_desc: "Líneas de producción optimizadas para armas de diseño extranjero bajo licencia."
 ALG_seriana_trait_cost_reduction: "Medidas de reducción de costos"
 ALG_seriana_trait_cost_reduction_desc: "Implementar técnicas de fabricación que ahorran costos sin comprometer la calidad."
 ALG_dgi_trait_atgm_development: "Programa de desarrollo ATGM"
 ALG_dgi_trait_atgm_development_desc: "Desarrollo nacional de misiles antitanque guiados para reducir la dependencia extranjera."
 ALG_dgi_trait_manpads_systems: "Sistemas MANPADS"
 ALG_dgi_trait_manpads_systems_desc: "Sistemas portátiles de defensa antiaérea para unidades de infantería y luz."
 ALG_dgi_trait_artillery_modernization: "Modernización de la artillería"
 ALG_dgi_trait_artillery_modernization_desc: "Actualizar piezas de artillería existentes con sistemas modernos de control de incendios y ataques."
 ALG_dgi_trait_cnc_integration: "C3I Systems Integration"
 ALG_dgi_trait_cnc_integration_desc: "Integrar sistemas de comando, control, comunicaciones e inteligencia en todas las plataformas."
 ALG_dgi_trait_mass_production: "Iniciativa de producción masiva"
 ALG_dgi_trait_mass_production_desc: "Aumentar las capacidades de producción para satisfacer los requisitos de expansión militar."
 ALG_bcl_trait_desert_adaptation: "Paquete de adaptación del desierto"
 ALG_bcl_trait_desert_adaptation_desc: "Modificaciones especializadas para operaciones desérticas incluyendo enfriamiento mejorado y filtración de polvo."
 ALG_bcl_trait_soviet_refurbishment: "Refurbishment del equipo soviético"
 ALG_bcl_trait_soviet_refurbishment_desc: "Experiencia en la revisión y modernización de los vehículos blindados de la era soviética a un costo reducido."
 ALG_bcl_trait_reactive_armor: "Integración reactiva Blindaje"
 ALG_bcl_trait_reactive_armor_desc: "Añadir armadura reactiva explosiva para mejorar la protección contra los cargos en forma."
 ALG_bcl_trait_apc_modernization: "Programa de modernización APC"
 ALG_bcl_trait_apc_modernization_desc: "Mejoras integrales para vehículos blindados de transporte de personal y de combate de infantería."
 ALG_bcl_trait_production_efficiency: "Mejoras en la eficiencia de la producción"
 ALG_bcl_trait_production_efficiency_desc: "Agilizar los procesos de montaje para aumentar la producción."
 ALG_snvi_trait_saharan_proven: "Saharan-Proven diseña"
 ALG_snvi_trait_saharan_proven_desc: "Los vehículos probaron ampliamente en condiciones desérticas para obtener la máxima fiabilidad."
 ALG_snvi_trait_mercedes_partnership: "Asociación Mercedes-Benz"
 ALG_snvi_trait_mercedes_partnership_desc: "Producción autorizada de plataformas comerciales Mercedes-Benz adaptadas para uso militar."
 ALG_snvi_trait_mass_production: "Expansión de producción masiva"
 ALG_snvi_trait_mass_production_desc: "Ampliar las instalaciones de producción para satisfacer una mayor demanda militar."
 ALG_snvi_trait_cost_reduction: "Optimización de costos"
 ALG_snvi_trait_cost_reduction_desc: "Reducir los costos por unidad mediante una mayor eficiencia en la fabricación."
 ALG_enmib_trait_maintenance_expertise: "Mantenimiento & Cambio de experiencia"
 ALG_enmib_trait_maintenance_expertise_desc: "El conocimiento especializado en mantenimiento de helicópteros extiende la vida útil y la fiabilidad."
 ALG_enmib_trait_licensed_assembly: "Operaciones de la Asamblea con licencia"
 ALG_enmib_trait_licensed_assembly_desc: "Assemble for foreign helicopter designs under license at reduced cost."
 ALG_enmib_trait_production_expansion: "Aumento de la capacidad de producción"
 ALG_enmib_trait_production_expansion_desc: "Ampliar las instalaciones para aumentar la capacidad de producción de helicópteros."
 ALG_mek_trait_mediterranean_design: "Diseño naval mediterráneo"
 ALG_mek_trait_mediterranean_design_desc: "Los buques optimizados para las operaciones del Mar Mediterráneo con mayor velocidad y eficiencia."
 ALG_mek_trait_patrol_vessel_expertise: "Experiencia de los buques de patrulla"
 ALG_mek_trait_patrol_vessel_expertise_desc: "Especializada en la construcción de botes de patrulla rápida con mayor capacidad de detección."
 ALG_mek_trait_shipyard_expansion: "Programa de Expansión de Astilleros"
 ALG_mek_trait_shipyard_expansion_desc: "Ampliar las instalaciones astilleras para aumentar la capacidad de construcción."
 ALG_cnan_trait_frigate_construction: "Capacidad de construcción de fragatas"
 ALG_cnan_trait_frigate_construction_desc: "Desarrollar capacidad para construir fragatas y destructores modernos."
 ALG_cnan_trait_anti_air_systems: "Naval Antiaéreo Sistemas"
 ALG_cnan_trait_anti_air_systems_desc: "Integrar sistemas antiaéreos modernos en vasos superficiales."
 ALG_cnan_trait_submarine_assembly: "Asamblea Submarina"
 ALG_cnan_trait_submarine_assembly_desc: "Montaje autorizado de submarinos diesel-eléctricos con asistencia técnica extranjera."
 ALG_cnan_trait_foreign_assistance: "Asistencia técnica extranjera"
 ALG_cnan_trait_foreign_assistance_desc: "Las asociaciones con constructores extranjeros aceleran el desarrollo tecnológico."
 ALG_cnan_trait_shipyard_modernization: "Modernización del astillero"
 ALG_cnan_trait_shipyard_modernization_desc: "Modernizar las instalaciones astilleras con equipos de construcción avanzados."
 ALG_ersa_trait_mro_expertise: "Experiencia de MRO"
 ALG_ersa_trait_mro_expertise_desc: "El mantenimiento, la reparación y el control de los conocimientos especializados garantizan la máxima fiabilidad de las aeronaves."
 ALG_ersa_trait_licensed_assembly: "Asamblea de las aeronaves autorizadas"
 ALG_ersa_trait_licensed_assembly_desc: "Ensamblar diseños de aviones extranjeros bajo licencia a un costo reducido."
 ALG_ersa_trait_transport_specialization: "Aircraft Specialization"
 ALG_ersa_trait_transport_specialization_desc: "Enfoque sobre aeronaves de transporte militar con amplia gama y eficiencia."
 ALG_ersa_trait_production_expansion: "Iniciativa de expansión de la producción"
 ALG_ersa_trait_production_expansion_desc: "Ampliar las instalaciones para aumentar la capacidad de producción de aeronaves."
 ALG_resistance_power_struggle: "La lucha del poder"
 ALG_resistance_power_struggle_desc: "Una guerra silenciosa se libra entre el pueblo argelino y *Le Pouvoir*. Ambos bandos buscan consolidar apoyos hasta que el choque inevitable decida el futuro de Argelia."
 Resistance_support: "Apoyar la Resistencia"
 Resistance_support_desc: "Canalizar recursos a movimientos de base, protestas y redes clandestinas, y reforzar el desafío del pueblo a la élite gobernante."
 ALG_increase_resistance_tt: "§YEl pueblo crece más fuerte mientras la influencia del ejército disminuye.§!"
 Le_Pouvoir_support: "*Le Pouvoir*"
 Le_Pouvoir_support_desc: "Dirigir apoyo a la élite arraigada, y reforzar su control del ejército y debilitar los agravios del pueblo."
 ALG_increase_pouvoir_tt: "§YEl ejército consolida el control mientras la gente pierde impulso.§!"
 Resistance_Final_Clash: "El choque final"
 Resistance_Final_Clash_desc: "El conflicto entre la Resistencia y *Le Pouvoir* ha alcanzado su punto culminante. Los próximos meses determinarán quién gobierna verdaderamente Argelia."
 alg_resistance.1.t: "¡El Pueblo Triumph!"
 alg_resistance.1.d: "Las Voces del pueblo se han levantado contra las élites dominantes. Las manifestaciones masivas y la organización popular obligaron al gobierno a ceder. Argelia entra en una nueva era de gobierno democrático."
 alg_resistance.1.a: "La gente ha hablado."
 alg_resistance.2.t: "Le Pouvoir aplasta la resistencia"
 alg_resistance.2.d: "La élite emprendida, respaldada por el ejército, suprimió con éxito la resistencia. El status quo sigue siendo, pero simmering descontent amenaza futuros disturbios."
 alg_resistance.2.a: "Orden ha sido Restaurada."
 alg_resistance.3.t: "Una nación en Caos"
 alg_resistance.3.d: "Ni la Resistencia ni Le Pouvoir lograron afirmar el dominio. El vacío de poder ha sumido a Argelia en el caos, con fuertes militares y facciones compitiendo por el control."
 alg_resistance.3.a: "Los Teeters de Campo en el borde del colapso."
 alg_resistance.4.t: "La crisis argelina aumenta"
 alg_resistance.4.d: "La frágil junta no puede mantener el estado unido y Argelia desciende más profundamente en la confusión. Los oficiales pueden devolver el país a un gobierno civil mientras todavía hay un país que devuelva, o pueden entrar y dejar que los grupos armados vengan."
 alg_resistance.4.a: "Poder de mano a un gobierno civil."
 ALG_african_union_tt: "Argelia fortalece sus vínculos dentro de la Unión Africana §Y§!, mejorando las relaciones con los Estados miembros africanos."
 KBY_alg_modifier_desc: "Malorossiya es un estado que se creó relativamente recientemente, su política interna y exterior está completamente subordinada a Moscú, pero todavía tiene una gran autonomía en la política nacional y extranjera."
 KBY_new_state: "Terreno para Berber"
 KBY_new_state_desc: "Finalmente, la verdadera heredera de estas tierras, los bereberes, tomarán el poder en sus propias manos"
 KBY_constitution: "La Constitución de Kabylia"
 KBY_constitution_desc: "Debemos formalizar nuestra legislación estatal. Para ello, adoptaremos nuestra propia constitución."
 KBY_drs: "Cooperación con los DRS"
 KBY_fsb_desc: "Lamentablemente, todavía no tenemos la oportunidad de crear nuestros propios servicios especiales, por lo que nos basaremos en la cooperación con el DRS de Argelia"
 KBY_mvd: "Subordinar el Ministerio Local del Interior"
 KBY_mvd_desc: "Subordinaremos a los órganos locales del Ministerio del Interior, que estaban bajo el poder francés"
 KBY_ter_defence: "Defensa territorial"
 KBY_ter_defence_desc: "Crearemos una Defensa Territorial de la milicia local"
 KBY_contract_army: "Sistema del Ejército de Contratos"
 KBY_contract_army_desc: "Nuestro ejército será creado según el sistema de contrato"
 KBY_defence_doctrine: "Doctrina defensiva"
 KBY_defence_doctrine_desc: "No estamos atacando a nadie, nuestra tarea es defender nuestras fronteras. Nuestro ejército adoptará la doctrina de las tácticas defensivas"
 KBY_nat_guard: "El Guardia Nacional de Kabylia"
 KBY_nat_guard_desc: "Una vez que Argelia, en los años 80, tenía un guardia nacional. Re-crearemos esta división pero ya bajo nuestro mando."
 KBY_defence_prom: "Industria militar"
 KBY_defence_prom_desc: "Invertimos fondos significativos en la restauración de la industria militar en nuestro territorio. Necesitamos un ejército fuerte."
 KBY_rebuild_war_academy: "Escuelas militares"
 KBY_rebuild_war_academy_desc: "Nuestros luchadores deben tener el mejor entrenamiento para defender su patria. Por lo tanto, reactivaremos las academias militares en nuestro territorio"
 KBY_no_corrupt_military: "Reducir seriamente la corrupción en el ejército"
 KBY_no_corrupt_military_desc: "Nuestro ejército sigue siendo joven, por lo que es mucho más fácil eliminar la corrupción en él"
 KBY_nation_quest: "La cuestión nacional"
 KBY_nation_quest_desc: "Kabylia fue y será parte de Argelia, esta es nuestra respuesta a la cuestión nacional"
 KBY_referendum: "Referendo sobre el destino de Kabylia"
 KBY_referendum_desc: "El momento fatídico ha llegado cuando debemos decidir por qué camino irá nuestro país. Se convertirá en una parte de pleno derecho de Rusia, en forma de república, o elegiremos el camino de un Estado de la Unión"
 KBY_dinar: "El Dinar como moneda del Estado"
 KBY_dinar_desc: "El dinar se convertirá en nuestra moneda estatal, nadie lo duda."
 KBY_corruption: "Lucha contra la corrupción"
 KBY_corruption_desc: "A pesar de que nuestro estado sigue siendo joven, los funcionarios corruptos ya han comenzado en él. Tenemos que lidiar con esto."
 KBY_isr_invest: "Inversiones de Israel"
 KBY_isr_invest_desc: "Israel nos apoya con sus inversiones"
 KBY_build_factories: "Construcción de fábricas"
 KBY_build_factories_desc: "El país necesita fábricas y fábricas, le proporcionaremos a nuestro pueblo todo lo que necesite"
 KBY_social_invest: "Inversiones en la esfera social"
 KBY_social_invest_desc: "Nuestros ciudadanos deben tener acceso a las mejores instalaciones médicas de calidad, así como todas las garantías sociales"
 KBY_infrastructure: "Inversiones de infraestructura"
 KBY_infrastructure_desc: "Las carreteras son las venas de nuestro estado"
 KBY_fight_oligarch: "La lucha contra los Oligarchs"
 KBY_fight_oligarch_desc: "Incluso en nuestro joven estado, los oligarcas corruptos ya han comenzado a aparecer, que hicieron mucho dinero en la guerra. Vamos a tratar con ellos."
 KBY_it_invest: "Invertir en TI"
 KBY_it_invest_desc: "Invertiremos en tecnologías de TI para el desarrollo exitoso de nuestro país"
 KBY_maloross_economy: "Economía Kabylia"
 KBY_maloross_economy_desc: "Nuestras medidas económicas han llevado al crecimiento de nuestra economía"
 KBY_union_state: "Sindicato"
 KBY_union_state_desc: "Hemos elegido el camino del Estado de la Unión"
 KBY_union_group_army: "Grupo conjunto de los contingentes"
 KBY_union_group_army_desc: "Nuestros soldados serán miembros de la agrupación conjunta de las tropas del Estado de la Unión"
 KBY_union_group_economic: "Inversiones de la Unión"
 KBY_union_group_economic_desc: "La pertenencia al Estado de la Unión ha tenido un impacto positivo en nuestra economía"
 KBY_union_health_social: "Cooperación con la esfera social y médica"
 KBY_union_health_social_desc: "Los miembros del Estado de la Unión cooperan activamente en las esferas social y médica"
 KBY_republic_rf: "Somos parte de Argelia"
 KBY_republic_rf_desc: "Nos hemos convertido en una república de Argelia, ahora nuestro destino está conectado con él"
 KBY_alg_regions: "Cooperación con las regiones de Argelia"
 KBY_alg_regions_desc: "Cooperaremos activamente con otras regiones de Argelia"
 KBY_fra_companies: "Cooperación con empresas francesas"
 KBY_fra_companies_desc: "Las empresas francesas serán nuestros principales socios"
 KBY_integrate_army: "Integrar en el ejército argelino"
 KBY_integrate_army_desc: "Llevaremos nuestro ejército a las normas del Ejército Argelino"
 ALG_legacy_of_independence_war: "Legado de la Guerra Argelina de la Independencia"
 ALG_legacy_of_independence_war_desc: "La lucha contra el gobierno colonial francés forjó un fuerte sentido de identidad y unidad nacional. Este legado duradero fortalece nuestro poder político, acelera la investigación y modernización y aumenta la influencia de Argelia en el extranjero. Sin embargo, las divisiones ideológicas y los recuerdos históricos siguen dando forma a la opinión nacional y a las relaciones exteriores."
 ALG_new_nobility_idea: "Nobleidad renovada"
 ALG_new_nobility_idea_desc: "Al restaurar los nobles privilegios y crear una aristocracia leal, la monarquía fortalece su dominio, recompensando la lealtad con influencia y prestigio."
 ALG_state_islam_idea: "Como Estado"
 ALG_state_islam_idea_desc: "La monarquía formaliza al Islam como el principio rector del estado, empoderando a la ulema e incorporándose a la Sharia en la gobernanza, a costa del progreso científico."
 ALG_andalus_crusade_idea: "Legado de al-Andalus"
 ALG_andalus_crusade_idea_desc: "El sueño de reclamar al-Andalus alimenta la causa del Califato, los guerreros inspiradores y la expansión legitimadora en toda la Península Ibérica."
 ALG_maghribi_identity_idea: "Identidad de Maghribi"
 ALG_maghribi_identity_idea_desc: "La monarquía promueve una identidad magribi distinta arraigada en la cultura y la unidad compartidas, fortaleciendo la estabilidad al tiempo que desata la influencia extranjera."
 ALG_maghribi_identity_idea_two: "Verdadero Magrebismo"
 ALG_maghribi_identity_idea_two_desc: "De Marruecos a Libia, el Magreb se une bajo un destino singular. La monarquía encarna esta visión, reduciendo la intromisión extranjera y uniendo a la región."
 ALG_renewed_nobility_idea: "Caballero restaurado"
 ALG_renewed_nobility_idea_desc: "Los caballeros del reino regresan, honrados como una élite militar y política leal. Su renovado papel fortalece el agarre de la monarquía al reducir los costos del liderazgo."
 ALG_going_to_roots: "Regresa a nuestras raíces"
 ALG_going_to_roots_desc: "Las dinastías de Maghrebi y Andalusi sentaron las bases para la identidad argelina. Al abrazar estas tradiciones, unificaremos pasado y presente en una única visión de orientación para la nación."
 ALG_state_islam: "Islam como la fe del Estado"
 ALG_state_islam_desc: "La religión siempre ha guiado al pueblo de Argelia. Al proclamar el Islam como fundamento de la monarquía, solidificamos nuestra legitimidad, ganamos el favor del ulema y fortalecemos la unidad de los fieles."
 ALG_restore_knighthood: "Restaurar la caballería"
 ALG_restore_knighthood_desc: "En la era de imperios, órdenes de guerreros y nobles defendieron nuestra tierra y fe. Restituiremos tales órdenes caballerosas para servir al trono e inspirar lealtad en los brazos."
 ALG_andalus_legacy: "Legado de al-Andalus"
 ALG_andalus_legacy_desc: "Nuestro avivamiento de Andalusi no es sólo sobre el trono. Se trata de reavivar el orgullo perdido de los musulmanes expulsados de Iberia hace siglos. Difundiremos nuestra influencia y recordaremos a Europa que al-Andalus no se olvida."
 ALG_our_old_realm: "Nuestro viejo reino"
 ALG_our_old_realm_desc: "Una vez gobernamos partes de Iberia bajo la bandera de al-Andalus. Ahora, por overtures diplomáticos y memoria histórica, vamos a reclamar nuestras tierras antiguas y preparar el terreno para su regreso."
 ALG_renewed_nobility: "Nobleidad renovada"
 ALG_renewed_nobility_desc: "Hay que forjar nuevas casas nobles para servir a la monarquía. Las familias viejas serán restauradas, y nuevas élites elevadas, para proporcionar a Argelia siervos leales de la corona."
 ALG_politic_outreach_iberia: "Extensión política en Iberia"
 ALG_politic_outreach_iberia_desc: "Al apoyar a las fuerzas simpáticas en España y Portugal, podemos extender la influencia de Argelia hacia el oeste. Nuestro respaldo de los movimientos ibéricos fortalecerá nuestras reivindicaciones y debilitará sus estados."
 ALG_fate_of_spain: "El destino de España"
 ALG_fate_of_spain_desc: "España se sienta sobre la tierra de nuestros antepasados. Su destino ahora puede ser decidido por la mano de Argelia, a través de la unión, regeneración o conquista."
 ALG_true_maghribism: "Verdadero Magrebismo"
 ALG_true_maghribism_desc: "Ha llegado el momento de declarar nuestra propia visión, una ideología arraigada en la identidad del Magreb, la unidad islámica y el orgullo monarquista. La doctrina del Magrebismo inspirará un nuevo orden a través del norte de África."
 ALG_glory_of_andalus_idea: "Gloria de al-Andalus"
 ALG_glory_of_andalus_idea_desc: "Un avivamiento cultural, inspirado en el legado de al-Andalus, vigoriza a nuestros eruditos, artesanos y gobernantes. Se une a la nación bajo un orgulloso recuerdo compartido."
 ALG_spain_algeria_union_tt: "Desbloquea las decisiones de unión con España bajo la monarquía argelina."
 ALG_trade_with_arabic_nations_tt: "Argelia establece mejores acuerdos comerciales con todas las naciones árabes."
 ALG_loas_influence_tt: "Argelia aumenta su influencia entre los Estados miembros de la Liga Árabe mediante esfuerzos diplomáticos y acuerdos de amistad."
 ALG_isr_threat: "Argelia condena la agresión israelí"
 ALG_palestinian_aid_package_tt: "Argelia proporciona ayuda a Palestina y aumenta la influencia en todas las naciones del Oriente Medio."
 ALG_african_union_reforms_tt: "Argelia ha establecido mejores acuerdos comerciales con todos los Estados miembros de la OUA."
 ALG_mutual_defense_idea: "Mutua Defensa"
 ALG_mutual_defense_idea_desc: ""
 ALG_the_State: "El Estado de Argelia"
 ALG_unlocks_focus_for_us: "§C¡Desbloquea una decisión que nos permitirá eliminar los modificadores negativos que recibimos de esto!§!"
 ALG_activate_from_event: "§HEstos focos se activan a través de un evento o decisión§!"
 ALG_our_society: "Sociedad argelina"
 ALG_our_society_desc: "La sociedad argelina está cambiando constantemente y evolucionando hacia algo nuevo. Aunque el papel de los gobiernos es generalmente liDRSed cuando se trata de esto debido a ciertas restricciones, ha habido momentos en que necesitábamos intervenir y habrá momentos en los que tendremos que intervenir para hacer cambios en nuestras políticas."
 ALG_DRS: "El DRS"
 ALG_DRS_desc: "DRS es nuestra agencia de inteligencia de naciones encargada de proteger al gobierno y las políticas de la nación contra amenazas internas y externas."
 ALG_domestic_focus: "Domestic Enfoque"
 ALG_domestic_focus_desc: "DRS debería centrarse en proteger a la nación contra las amenazas domésticas, como los malos actores que desean derrocar al gobierno difundiendo ideales peligrosos."
 ALG_foreign_focus: "Extranjeros Enfoque"
 ALG_foreign_focus_desc: "DRS debe preocuparse por las amenazas desde fuera de nuestras fronteras, ya que la gente nunca deseará causar daño a su propia nación."
 ALG_disaster_relief: "Plan de Desastres"
 ALG_disaster_relief_desc: "Actualmente no tenemos un plan de desastres, lo que significa que no estamos preparados para proteger y venir a la ayuda de nuestros ciudadanos."
 ALG_charity_based: "Establecer un sistema dirigido por la caridad"
 ALG_charity_based_desc: "Las Caridades cubrirán a nuestra gente cuando el desastre golpee, para que podamos reducir el gasto un poco."
 ALG_government_reliant: "Establecer un sistema dirigido por el Gobierno"
 ALG_government_reliant_desc: "Es el trabajo de los gobiernos venir a su gente ayuda cuando el desastre golpea, incluso si significa aumentar nuestro gasto."
 ALG_migration_problems: "Problemas de migración"
 ALG_migration_problems_desc: "Siempre hemos tenido problemas con una afluencia de migrantes que entran en la nación. Pero nunca supimos qué hacer con ellos después de que sus problemas terminen en su nación natal."
 ALG_open_door_policy: "Política de puertas abiertas"
 ALG_open_door_policy_desc: "Al optar por utilizar una política de puertas abiertas, podemos utilizar fácilmente los migrantes entrantes para mejorar nuestra nación y desarrollarla."
 ALG_closed_borders: "Cierra las fronteras"
 ALG_closed_borders_desc: "Somos capaces de deshacernos completamente de los migrantes que entran en la nación al cerrar nuestras fronteras, cerrando así nuestros problemas."
 ALG_drug_problem: "El problema de las drogas"
 ALG_drug_problem_desc: "A veces, se requieren medicamentos para el uso médico, pero eso no impide que ciertos individuos abusen del sistema y los usen con fines recreativos con resultados peligrosos."
 ALG_tighten_punishments: "Más duro Stance"
 ALG_tighten_punishments_desc: "criminalizaremos a cualquiera que use drogas para cualquier cosa excepto el uso médico, no importa cuál sea su excusa."
 ALG_relax_restrictions: "Suaviza nuestro Stance"
 ALG_relax_restrictions_desc: "Incluso si nuestra gente desea usar drogas para fines recreativos, ¿por qué debemos importarnos? Tal vez deberíamos dejarles hacer lo que quieren incluso si hay algunos riesgos."
 ALG_rising_nationalism: "Levántate del nacionalismo"
 ALG_rising_nationalism_desc: "A pesar de que el nacionalismo es algo bueno, demasiado puede ser malo. El nacionalismo dentro de la nación ha causado problemas y luchas para romper entre grupos minoritarios."
 ALG_utilize_it: "Utilizar el nacionalismo"
 ALG_utilize_it_desc: "Utilizaremos el nacionalismo para nuestra ventaja, de esta manera el enemigo sabrá que el pueblo argelino no se sentará idly en tiempos de guerra."
 ALG_combat_it: "Combatirlo"
 ALG_combat_it_desc: "Vamos a tener que luchar contra el nacionalismo ya que no podemos arriesgar más inestabilidad dentro de nuestras fronteras."
 ALG_charity_disasters: "Plan de Corrección de Caridad"
 ALG_charity_disasters_desc: "Nuestro plan de desastres se basa en la bondad y donaciones de los ciudadanos para dar ayuda a las personas en tiempos de necesidad"
 ALG_government_led_disasters: "Gobierno Plan Led"
 ALG_government_led_disasters_desc: "El Gobierno va a proporcionar ayuda a las personas que han estado en desastres naturales en lugar de organizaciones benéficas, aunque también son libres de ayudar si quieren"
 ALG_drugs_illegalized: "Drogas penalizadas"
 ALG_drugs_illegalized_desc: "Si alguien usa drogas para cualquier propósito excepto el uso médico, se meterán en problemas con la ley"
 ALG_drugs_legalized: "Drogas legalizadas"
 ALG_drugs_legalized_desc: "Realmente no nos importa para qué la gente usa drogas, es su vida de todos modos"
 ALG_drs_idea_1: "Policía militarizada"
 ALG_drs_idea_1_desc: "La policía ha sido reorganizada en una fuerza paramilitar capaz de manejar el terrorismo, los disturbios y los disturbios, dándoles un papel más fuerte en la seguridad interna de Argelia."
 ALG_drs_idea_2: "Policía militarizada"
 ALG_drs_idea_2_desc: "La policía ahora actúa como un organismo paramilitar fuertemente armado, con equipos avanzados y estrechos lazos con el ejército, desdibujando las líneas entre la seguridad civil y el control militar."
 ALG_drs_idea_3: "Policía militarizada integrada"
 ALG_drs_idea_3_desc: "Nuestras fuerzas policiales están plenamente integradas en el aparato de seguridad, operando de lado a lado con el ejército en la lucha contra el terrorismo, la defensa fronteriza y la vigilancia interna."
 ALG_riot_police_idea: "Policía de Riot"
 ALG_riot_police_idea_desc: "Una rama de policía especializada diseñada para hacer frente a protestas, manifestaciones y disturbios sociales. Están equipados con equipo de control multitudinario y operan con un fuerte énfasis en mantener la estabilidad del régimen."
 ALG_algerian_special_forces: "Fuerzas Especiales de Argelia"
 ALG_algerian_special_forces_desc: "Las amenazas de seguridad de Argelia exigen unidades de élite capaces de intervenir rápidamente y combatir el terrorismo. Establecer fuerzas especializadas fortalecerán nuestra defensa contra el malestar interno y los peligros externos."
 ALG_BRI: "Ampliar el BRI"
 ALG_BRI_desc: "La Brigade de Recherche et d'Intervention (BRI) es una unidad policial especializada formada para el rescate de rehenes y operaciones de alto riesgo. Ampliar sus números y recursos mejorará nuestra seguridad urbana."
 ALG_al_saiqa: "Unidades Al-Sa'iqa"
 ALG_al_saiqa_desc: "Unidades especiales paramilitares antidisturbios y contrainsurgencia reforzarán nuestra capacidad de mantener la ley y el orden durante períodos de disturbios civiles."
 ALG_al_hars_al_watani: "Guardia Nacional"
 ALG_al_hars_al_watani_desc: "Una Guardia Nacional de Seguridad proporcionará seguridad local en zonas vulnerables, liberará recursos del ejército y mantendrá el orden en situaciones de crisis."
 ALG_haras_al_hudod: "Unidades de Guardia Fronteriza"
 ALG_haras_al_hudod_desc: "Las fuerzas especializadas que patrullan nuestras fronteras frenarán el contrabando, evitarán la infiltración y fortalecerán las defensas fronterizas de Argelia."
 ALG_central_armed_police: "Policía central armada"
 ALG_central_armed_police_desc: "La consolidación de la policía armada en un mando centralizado mejorará los tiempos de respuesta y la eficiencia, asegurando una mano más fuerte contra las amenazas organizadas."
 ALG_border_security_force: "Fuerza de Seguridad Fronteriza"
 ALG_border_security_force_desc: "Al crear una fuerza dedicada a la vigilancia fronteriza y la interceptación, Argelia se aferrará a las redes de tráfico e infiltración armada."
 ALG_firqat_tadakhol_al_sariye: "Dependencia de Intervención Rápido"
 ALG_firqat_tadakhol_al_sariye_desc: "Las unidades de reacción rápida de las élites permitirán que Argelia ataque rápidamente contra las células terroristas y las crisis emergentes antes de que se intensifiquen."
 ALG_expanding_BRI: "Ampliación de las capacidades BRI"
 ALG_expanding_BRI_desc: "Con más financiación, capacitación y equipo avanzado, el BRI puede convertirse en una formidable unidad de lucha contra el terrorismo y rescate de rehenes que rivaliza con lo mejor de la región."
 ALG_increase_police_funding: "Aumento de la financiación policial"
 ALG_increase_police_funding_desc: "La inversión en nuestra policía y gendarmería fortalecerá la estabilidad interna, reforzará la seguridad pública y mejorará la resiliencia de Argelia contra los disturbios."
 ALG_drs_expand: "Ampliar el DRS"
 ALG_drs_expand_desc: "El Departamento de Renseignement y de la Sécurité (DRS) puede ampliarse aún más, otorgando mayores capacidades de reunión de inteligencia y contraprogramación."
 ALG_new_gendarmerie_equipment: "Nuevo equipo para la gendarmería"
 ALG_new_gendarmerie_equipment_desc: "Nuestra gendarmería debe estar debidamente armada y equipada para hacer frente a los desafíos del terrorismo, la delincuencia y el malestar interno."
 ALG_mia_reform: "Reforma del Ministerio del Interior"
 ALG_mia_reform_desc: "La centralización del mando en el Ministerio del Interior simplificará la gestión de la seguridad interna, garantizando respuestas más rápidas y coordinadas."
 ALG_internal_troops: "Tropas internas"
 ALG_internal_troops_desc: "Las tropas internas paramilitares bajo mando estatal reforzarán la lucha contra la insurgencia y las redes delictivas."
 ALG_increase_special_forces: "Aumento de las fuerzas especiales"
 ALG_increase_special_forces_desc: "Nuestras fuerzas de élite necesitan programas ampliados de reclutamiento y capacitación especializada para enfrentar las sofisticadas amenazas de la guerra moderna."
 ALG_cybercrime_directorate: "Cybercrime Directorate"
 ALG_cybercrime_directorate_desc: "La creación de una Dirección contra el Cibercrimen protegerá a Argelia del espionaje digital, los ciberataques y las campañas hostiles de desinformación."
 ALG_riot_police: "Unidades de Policía de Riot"
 ALG_riot_police_desc: "Las unidades de policía antidisturbios organizadas proporcionarán control de multitudes y una respuesta disciplinada a las protestas masivas, asegurando la estabilidad durante los disturbios."
 ALG_military_police_training: "Capacitación de la policía militar"
 ALG_military_police_training_desc: "Los programas de capacitación para la policía militar aumentarán la disciplina, reducirán la deserción y mejorará la gestión de la ocupación en regiones inestables."
 ALG_peoples_security: "Seguridad de la gente"
 ALG_peoples_security_desc: "Una doctrina de «Seguridad Popular» fortalecerá la cooperación civil-militar, reforzará la moral e integrará a las poblaciones locales en los esfuerzos de defensa nacional."
 ALG_procurement_of_espionage_equipment: "Adquisiciones del equipo de espionaje"
 ALG_procurement_of_espionage_equipment_desc: "Invertir en tecnología avanzada de vigilancia y espionaje mejorará nuestra capacidad para detectar y neutralizar las amenazas internas y extranjeras."
 ALG_occupation_management_strategies: "Estrategias de gestión del empleo"
 ALG_occupation_management_strategies_desc: "Las nuevas estrategias para gestionar las zonas ocupadas o inestables reducirán la resistencia, reducirán las bajas y consolidarán la autoridad estatal."
 ALG_french_weapons: "Importar armas francesas"
 ALG_french_weapons_desc: "Al adquirir armas pequeñas y equipo francés, Argelia puede modernizar rápidamente su infantería al tiempo que fortalece los vínculos con París."
 ALG_russian_guns: "Importar armas rusas"
 ALG_russian_guns_desc: "Las armas pequeñas rusas, entregadas a granel, proporcionan a Argelia armas duraderas y fiables, reforzando nuestra asociación tradicional de defensa con Moscú."
 ALG_algerian_space_programme: "Establecer ASAL"
 ALG_algerian_space_programme_desc: "La Agencia Espacial Argelina (ASAL) coordinará todas las actividades espaciales nacionales, desde el desarrollo de satélites hasta la cooperación internacional en materia de investigación espacial."
 ALG_alsat_initiative: "Iniciativa AlSat"
 ALG_alsat_initiative_desc: "El proyecto AlSat proporciona a Argelia sus primeros satélites, dedicados a la observación de la tierra y las comunicaciones, marcando nuestra entrada en la era espacial."
 ALG_alsat2_series: "AlSat-2 Series"
 ALG_alsat2_series_desc: "El desarrollo de satélites avanzados AlSat-2 mejorará nuestra capacidad de vigilancia, comunicaciones y teleobservación."
 ALG_finance_private_space_companies: "Finanzas Empresas del Espacio Privado"
 ALG_finance_private_space_companies_desc: "Alentar al sector privado de Argelia a participar en la industria espacial fortalecerá nuestra base nacional de alta tecnología."
 ALG_regional_satnet: "Red satelital regional"
 ALG_regional_satnet_desc: "Vincularemos nuestros satélites a una red regional, integrando los usos civiles y militares mientras conectamos Argelia con sus vecinos."
 ALG_asal_lunar_project: "Proyecto Lunar ASAL"
 ALG_asal_lunar_project_desc: "La agencia espacial de Argelia iniciará un ambicioso proyecto para estudiar exploración lunar y tecnología avanzada de cohetes."
 ALG_human_spaceflight: "Programa de vuelos espaciales humanos"
 ALG_human_spaceflight_desc: "Nuestro programa espacial dará un paso audaz hacia adelante: planeando el primer vuelo espacial humano de Argelia en asociación con aliados internacionales."
 ALG_orbital_defense_program: "Programa de Defensa Orbital"
 ALG_orbital_defense_program_desc: "Los satélites también se pueden utilizar para la defensa. Desarrollar capacidades de defensa orbital protegerá a Argelia de futuras amenazas."
 ALG_alsat_future: "Futuro de AlSat"
 ALG_alsat_future_desc: "El futuro del programa espacial de Argelia radica en la inversión sostenida, las alianzas público-privadas y la planificación científica a largo plazo."
 ALG_cyber_sat_integration: "Integración Cyber-Satellite"
 ALG_cyber_sat_integration_desc: "La fusión de las capacidades de guerra cibernética con nuestra red satelital dará a Argelia una poderosa herramienta asimétrica en los conflictos modernos."
 ALG_idea_the_new_space_race: "La nueva carrera espacial"
 ALG_idea_the_new_space_race_desc: "Argelia ha entrado en la carrera espacial mundial, compitiendo con las potencias mundiales para demostrar su fuerza tecnológica y estratégica."
 ALG_idea_cyberwarfare_2: "Integración Cyber-Satellite"
 ALG_idea_cyberwarfare_2_desc: "El mando cibernético de Argelia se integra ahora con nuestros sistemas satélites, proporcionando una seguridad de comunicaciones superior y capacidades ofensivas."
 ALG_algeria_police_modifier: "Seguridad interna de Argelia"
 ALG_algeria_police_modifier_desc: "El gobierno argelino tiene una gran experiencia desde su época como parte de la URSS para suprimir el disentimiento y los agentes enemigos."
 ALG_algeria_police_modifier_tt_intro: "Modify §Y$ALG_algeria_police_modifier$§! by"
 ALG_algeria_support_category: "Tropas auxiliares de Argelia"
 ALG_stabilize_mali: "Estabilizar Malí"
 ALG_stabilize_mali_desc: "La inestabilidad de Malí amenaza a todo el Sahel. Argelia, con su experiencia en contrainsurgencia y diplomacia, debe intervenir para estabilizar a su vecino sur, ya sea mediante la fuerza, la negociación o la influencia."
 ALG_back_tuareg_rebellion: "Regresar el Rebelión Tuareg"
 ALG_back_tuareg_rebellion_desc: "En lugar de apoyar a Bamako, podemos empoderar a los rebeldes tuareg que buscan la autonomía en el norte de Malí. Esto debilitará la autoridad central de Malí y aumentará nuestro apalancamiento en la región."
 ALG_support_malian_army: "Apoyo al Ejército Maliense"
 ALG_support_malian_army_desc: "En cambio, Argelia puede respaldar directamente al Gobierno maliense proporcionando apoyo político y militar para fortalecer su ejército contra los insurgentes."
 ALG_promote_tuareg_dialogue: "Promover el diálogo tuareg"
 ALG_promote_tuareg_dialogue_desc: "En lugar de elegir un lado, Argelia podría acoger conversaciones entre los rebeldes tuareg y el estado maliense, situándose como mediador y estabilizador en el Sahel."
 ALG_support_tuareg_politicians: "Apoyo a los políticos tuareg"
 ALG_support_tuareg_politicians_desc: "Más allá del campo de batalla, la influencia tuareg también se puede construir a través de canales políticos. Los dirigentes moderados de Tuareg prestarán apoyo a los aliados a largo plazo de Argelia dentro de Malí."
 ALG_aid_malian_army: "Ayuda al Ejército Maliense"
 ALG_aid_malian_army_desc: "Argelia puede enviar armas, vehículos y sistemas de mando para fortalecer la capacidad del ejército maliense de luchar contra los insurgentes y estabilizar el país."
 ALG_mali_stabilized: "Malí estabilizado"
 ALG_mali_stabilized_desc: "Después de años de agitación, los esfuerzos de Argelia han pagado. El conflicto maliense está bajo control, la rebelión tuareg contenida, y Argelia es el poder estabilizador del Sahel."
 ALG_tuareg_autonomy_victory: "La victoria de la autonomía tuareg"
 ALG_tuareg_autonomy_victory_desc: "El movimiento Tuareg ha ganado el reconocimiento de su autonomía. Con el apoyo de Argelia, los tuareg ahora tienen poder político y Malí enfrenta un nuevo equilibrio de autoridad en el Sahel."
 Algeria.237.t: "Intervención de Argelia en Malí"
 Algeria.237.d: "Argelia ha declarado su intención de estabilizar a Malí, citando preocupaciones por el terrorismo, el separatismo tuareg y la inestabilidad regional. Con Algiers moviendo tropas, ayuda y presión política hacia el sur, el equilibrio de poder en Malí está cambiando. Queda por ver si esto trae paz o un conflicto más profundo."
 Algeria.237.a: "Argelia toma la iniciativa en el Sahel."
 Algeria.409.t: "Iniciativa de diálogo Tuareg"
 Algeria.409.d: "Argelia ha comenzado a promover el diálogo con los representantes de Tuareg en Malí y el Sahel en general. Mientras algunos en Argel ven esto como un camino hacia la paz y la estabilidad, otros temen que legitimar las demandas tuareg podría encarnar el separatismo. El gobierno debe decidir hasta qué punto apoyar esta iniciativa."
 Algeria.409.a: "Participación en actividades de divulgación cultural y mediática"
 Algeria.409.b: "Proporcionar apoyo discreto a los líderes de Tuareg"
 ALG_TUA_REV_TT: "[TUA.GetFlag] §H La resistencia tuareg§! ha sido apoyada por Argelia, conduciendo a la creación de una §Y Región Autónoma tuareg§! (o potencialmente un §G nuevo estado tuareg§!) dentro de Malí."
 ALG_MAL_STABILIZED_TT: "[MAL.GetFlag] §HMalí§! ha sido §Gestabilizado§! con el apoyo argelino, la garantía de la paz y la reducción del riesgo de un nuevo conflicto."
 ALG_algerian_intervention: "Doctrina de intervención regional"
 ALG_algerian_intervention_desc: "Argelia ha actuado durante mucho tiempo como agente de energía regional. Con la inestabilidad que amenaza nuestro vecindario, debemos decidir si interviene directamente en los conflictos regionales para salvaguardar nuestros intereses nacionales."
 ALG_intervene_in_sahrawi: "Intervenir en el Sáhara"
 ALG_intervene_in_sahrawi_desc: "El conflicto entre Marruecos y la República Árabe Siria sigue sin resolverse. Argelia debe intervenir diplomática o militarmente para proteger sus fronteras y fortalecer su influencia en el Magreb."
 ALG_supp_polisario: "Apoyar el Frente Polisario"
 ALG_supp_polisario_desc: "La lucha saharaui por la independencia es fundamental para la política regional de Argelia. Al suministrar armas y apoyo al Frente Polisario, podemos debilitar a Marruecos y asegurar que nuestra influencia crezca en el Sáhara Occidental."
 ALG_a_new_stance: "Una nueva etapa hacia Marruecos"
 ALG_a_new_stance_desc: "Argelia se ha opuesto tradicionalmente al control marroquí sobre el Sáhara Occidental, pero los vientos políticos cambiantes exigen pragmatismo. Al alinearse con Marruecos podría reducir las tensiones, abrir nuevas oportunidades económicas y darnos ventaja en el Magreb."
 ALG_intervene_in_libya: "Intervene in Libya"
 ALG_intervene_in_libya_desc: "El caos en Libia amenaza con derramarse a través de nuestras fronteras. Argelia no puede permitirse inestabilidad al lado. Ya sea mediante la acción militar, la diplomacia o la influencia encubierta, debemos asegurar nuestros intereses en Libia."
 ALG_assassinate_gaddafi: "Assassinate Gaddafi"
 ALG_assassinate_gaddafi_desc: "La regla de Muammar Gaddafi desestabiliza toda la región. Al orquestar su caída, Argelia puede acelerar el cambio de régimen en Libia y asegurar que surja un gobierno más favorable, incluso si hunde a Libia en la guerra civil."
 ALG_peacekeepers: "Enviar Pacificadores a Libia"
 ALG_peacekeepers_desc: "En lugar de hundir a Libia más en el caos, Argelia podría intervenir como fuerza de mantenimiento de la paz. El despliegue de tropas para estabilizar la situación fortalecería nuestra imagen como un poder regional responsable y nos daría una influencia duradera en Trípoli."
 ALG_pulse.1.t: "Sahara Desert Expande"
 ALG_pulse.1.d: "Según los datos más recientes, el Sáhara continúa su constante expansión. Las zonas de pastoreo se están volviendo estériles, los aos se están secando y la fauna silvestre como las gacelas y los ciervos Barbary desaparecen debido a la caza furtiva. La migración excesiva, la minería sin control e ignorar la caza furtiva sólo empeorará la desertificación."
 ALG_pulse.1.a: "Una señal preocupante"
 ALG_pulse.2.t: "Establo del desierto del Sahara"
 ALG_pulse.2.d: "Los datos de este año sugieren que el avance del Sahara ha disminuido, con la desertificación sostenida. Sin embargo, sin acción contra el pastoreo excesivo, la caza furtiva y el uso insostenible de las tierras, el saldo puede volver a inclinarse."
 ALG_pulse.2.a: "Debemos permanecer vigilantes."
 ALG_pulse.3.t: "Sahara reclama tierra"
 ALG_pulse.3.d: "Los informes recientes indican que la vegetación está regresando lentamente a algunos márgenes del desierto. Al parecer, las patrullas de lucha contra la pobreza, el pastoreo controlado y los esfuerzos de reforestación están ayudando a sanar la tierra, restableciendo el equilibrio con ecosistemas frágiles."
 ALG_pulse.3.a: "Fomento de los progresos"
 ALG_reduce_yearly_good_desertification_5: "La probabilidad de §YOasificación§!: §R-5%§!\n"
 ALG_increase_yearly_good_desertification_5: "La probabilidad de §YOasificación§!: §G+5%§!\n"
 ALG_increase_yearly_bad_desertification_5: "La probabilidad de §YDesertificación§!: §R+5%§!\n"
 ALG_decrease_yearly_bad_desertification_5: "La probabilidad de §YDesertificación§!: §G-5%§!\n"
 ALG_reduce_yearly_neutral_desertification_5: "Solución de §Y Estabilización§!: §R-5%§!\n"
 ALG_increase_yearly_neutral_desertification_5: "Solución de §Y Estabilización§!: §G+5%§!\n"
 ALG_anti_poaching_raid_successful: "§GEliminamos con éxito §Y[?poachers_killed] §! poachers!§!"
 ALG_anti_poaching_raid_normal: "§G¡Logramos eliminar §Y[?poachers_killed] §! cazadores furtivos!§!"
 ALG_anti_poaching_raid_failure: "§RNuestros rangers sufren bajas§!"
 ALG_strengthen_ENTV_environmental_campaigns: "Fortalecer las campañas ambientales ENTV"
 ALG_strengthen_ENTV_environmental_campaigns_desc: "El ENTV, nuestro servicio nacional de radiodifusión, se puede utilizar para sensibilizar sobre cuestiones ambientales. Mediante campañas de lucha contra la desertificación, la conservación del agua y la protección de la vida silvestre, podemos alentar a los ciudadanos a que apoyen un futuro sostenible."
 ALG_increase_cattle_grazing: "Ampliar el pasto de la botella"
 ALG_increase_cattle_grazing_desc: "El pastoreo de ganado sigue siendo una piedra angular de la estepa argelina y la alta economía de meseta. La expansión del pastoreo de ganado y ovejas podría aumentar los ingresos rurales, pero corre el riesgo de empeorar la sobregrazamiento, la degradación del suelo y la desertificación si no se administran cuidadosamente."
 ALG_optimize_pastoral_practices: "Optimizar las prácticas pastorales"
 ALG_optimize_pastoral_practices_desc: "Los métodos tradicionales de pastoreo han puesto una enorme tensión en ecosistemas frágiles. Al introducir el pastoreo rotacional, el uso sostenible del agua y la mejora de la atención veterinaria, podemos modernizar las prácticas pastorales y reducir su impacto en los márgenes de estepa y Sahara."
 ALG_expand_steppe_farming: "Ampliar la agricultura de estepa"
 ALG_expand_steppe_farming_desc: "Las regiones estepas de Argelia, situadas entre el Atlas Tell y el Sáhara, son vitales para la producción de granos y ganado. Al invertir en proyectos de riego y regeneración, podemos aumentar el cultivo en estas áreas, aunque a riesgo de mayor estrés ambiental."
 ALG_research_drought_resistant_crops: "Investigación Drought-Resistant Crops"
 ALG_research_drought_resistant_crops_desc: "El cambio climático y la desertificación amenazan la seguridad alimentaria de Argelia. Al invertir en investigación para cultivos resistentes a la sequía, como granos resilientes y variedades de palmeras, podemos salvaguardar nuestro sector agrícola contra el empeoramiento de las condiciones áridas."
 ALG_shrink_nature_reserves_sahara: "Reservas naturales saharauis"
 ALG_shrink_nature_reserves_sahara_desc: "Algunos sostienen que grandes porciones de tierras reservadas como reservas naturales en el Sáhara podrían reutilizarse para proyectos agrícolas, de pastoreo o industriales. La reducción del tamaño de estas reservas permitiría el desarrollo, pero a gran costo ambiental."
 ALG_expand_nature_reserves_sahara: "Ampliar las reservas naturales del Sáhara"
 ALG_expand_nature_reserves_sahara_desc: "La protección de los ecosistemas frágiles en el Sáhara es esencial para la diversidad biológica y el equilibrio ambiental a largo plazo. Al ampliar las zonas protegidas, podemos salvaguardar especies en peligro y reducir las presiones que contribuyen a la desertificación."
 ALG_drs: "El DRS"
 ALG_drs_desc: "El departamento de Argelia de Renseignement et de la Sécurité (DRS) fue forjado durante el sangriento Decenio Negro y se convirtió en infame por sus vastos poderes. Mientras que oficialmente sirve como escudo contra el terrorismo y la infiltración extranjera, el DRS también interviene fuertemente en política, asegurando la preservación de la autoridad estatal y la estabilidad, incluso a costa de las libertades civiles."
 ALG_decline_of_tourism: "Declinación del turismo"
 ALG_destroyed_agriculture: "Agricultura destruida"
 ALG_tikjda_resort: "Tikjda Esquí resort"
 ALG_algerian_tourism: "Turismo en Argelia"
 ALG_natural_products_idea: "Productos naturales argelinos"
 ALG_sonatrach: "Expansión de Sonatrach"
 algeria_invest.1.t: "Inversiones en Argelia"
 algeria_invest.1.d: "Argelia nos pide invertir en su estado. Gracias a las inversiones en Argelia, podemos fortalecer nuestra influencia en el norte de África y a lo largo de la costa mediterránea."
 algeria_invest.1.a: "Okay"
 algeria_invest.1.b: "No"
 algeria_invest.2.t: "Han acordado"
 algeria_invest.2.d: "Han acordado invertir en nuestro país."
 algeria_invest.2.a: "Bien."
 algeria_invest.3.t: "Se negaron."
 algeria_invest.3.d: "Se negaron a invertir en nuestro país, alegando que nuestra oferta no era rentable."
 algeria_invest.3.a: "Sad"
 algeria_invest.4.t: "Inversiones estadounidenses en Argelia"
 algeria_invest.4.d: "Argelia ofrece a nuestras empresas la oportunidad de invertir en su economía. A cambio, ganaremos influencia y, a largo plazo, fortaleceremos las relaciones con Argelia."
 algeria_invest.4.a: "¿Quién dijo dinero?"
 algeria_invest.4.b: "No"
 algeria_invest.5.t: "América estuvo de acuerdo."
 algeria_invest.5.d: "Las empresas estadounidenses ya han comenzado a planificar proyectos de inversión en Argelia."
 algeria_invest.5.a: "Una victoria para el negocio y la democracia."
 algeria_invest.6.t: "Estados Unidos se negó"
 algeria_invest.6.d: "Estados Unidos se ha negado a invertir en nuestra economía. No tienen confianza en la transparencia de nuestro sistema político."
 algeria_invest.6.a: "Entonces llamaremos a Europa."
 algeria_invest.7.t: "Inversiones europeas en Argelia"
 algeria_invest.7.d: "Argelia nos pide invertir en su economía. Según ellos, tienen un clima de inversión favorable y nuestra participación fortalecerá los lazos en todo el Mediterráneo."
 algeria_invest.7.a: "Por supuesto."
 algeria_invest.7.b: "No hay dinero."
 algeria_invest.8.t: "Europa acordada"
 algeria_invest.8.d: "Los inversores europeos han acordado apoyar nuestra economía. Varias empresas importantes ya están dispuestas a lanzar proyectos de inversión en Argelia."
 algeria_invest.8.a: "Buenas noticias para el desarrollo."
 algeria_invest.9.t: "Europa rechazada"
 algeria_invest.9.d: "Afirmaron que no hay dinero disponible ahora mismo para asignar un paquete de inversión."
 algeria_invest.9.a: "Sad"
 algeria_invest.10.t: "Fondos de inversión chinos Algiers Metro"
 algeria_invest.10.d: "Un inversor chino nos está ofreciendo dinero para expandir el Metro de Argel. Podemos construir el metro con sus fondos, o malversarlo haciendo trampas, pero esto podría perjudicar nuestras relaciones con China."
 algeria_invest.10.a: "¡Los Argel necesitan un metro!"
 algeria_invest.10.b: "¡Argelia necesita dinero!"
 algeria_invest.11.t: "Algeria fooled us"
 algeria_invest.11.d: "Un grupo de ladrones argelinos enganchó el proyecto del metro y tomó todo el dinero que habíamos preparado para ellos."
 algeria_invest.11.a: "Bastards"
 algeria_invest.12.t: "Inversiones de Rebrab"
 algeria_invest.12.d: "Issad Rebrab, fundador de Cevital, es uno de los empresarios más influyentes de Argelia. Desde los años noventa ha invertido en industria, producción de alimentos y expansión internacional. Gracias a él, Argelia ha ganado fábricas, empleos y proyectos de prestigio. Sigue siendo un símbolo del potencial del sector privado del país."
 algeria_invest.12.a: "¡Gracias, Rebrab!"
 ALG_our_economy: "Nuestra Economía"
 ALG_our_economy_desc: "La economía de Argelia está en una encrucijada. Después de años de inestabilidad y subinversión, el gobierno debe decidir si enfocarse hacia adentro o abrir la puerta a la modernización y al crecimiento."
 ALG_attract_foreign_inv: "Atraer inversión extranjera"
 ALG_attract_foreign_inv_desc: "Al abrir nuestros mercados a inversores extranjeros, Argelia puede asegurar proyectos de capital, experiencia e infraestructura que de otro modo permanecerían fuera del alcance."
 ALG_france_inv: "Solicitud de inversión en francés"
 ALG_france_inv_desc: "Francia sigue siendo uno de los socios económicos más cercanos de Argelia. Renovar su participación en nuestros sectores energético e industrial podría acelerar el desarrollo, si pudiéramos ejercer su influencia."
 ALG_chinese_inv: "Iniciativa de inversión china"
 ALG_chinese_inv_desc: "China ofrece ambiciosos paquetes de inversiones, a menudo vinculados con la infraestructura y el desarrollo de recursos. La asociación con Beijing podría transformar nuestra economía, pero a costa de una dependencia más profunda."
 ALG_usa_inv: "Invitar a American Investment"
 ALG_usa_inv_desc: "Los Estados Unidos pueden proporcionar tecnología avanzada y apoyo financiero sustancial. La cooperación con Washington puede remodelar la industria y los servicios de Argelia en competidores globales."
 ALG_russian_inv: "Cooperación económica rusa"
 ALG_russian_inv_desc: "Rusia ha sido desde hace mucho tiempo un aliado estratégico en energía y defensa. Ampliar la cooperación con proyectos económicos más amplios fortalecerá nuestra columna vertebral industrial y militar."
 ALG_iran_inv: "Asociación con el Irán"
 ALG_iran_inv_desc: "Argelia e Irán comparten una historia de no alineación y resistencia a la dominación extranjera. La ampliación de los vínculos con Teherán podría abrir nuevas vías en materia de cooperación energética, proyectos industriales y diplomacia regional, aunque pueda suscitar preocupaciones entre los asociados occidentales."
 ALG_italia_inv: "Fortalecimiento de las mareas italianas"
 ALG_italia_inv_desc: "Italia es uno de los socios europeos más cercanos de Argelia, especialmente a través del papel de ENI en nuestro sector energético. Al intensificar la cooperación con Roma, podemos asegurar una inversión vital en infraestructura, impulsar el comercio mediterráneo y reforzar nuestra posición como proveedor de energía clave para Europa."
 ALG_algiers_metro_expansion: "Ampliar el Metro de Argel"
 ALG_algiers_metro_expansion_desc: "Los Argeles sufren de congestión e infraestructura obsoleta. Ampliar el sistema de metro no sólo modernizará el transporte, sino que también señalará los avances a inversores y ciudadanos por igual."
 ALG_cevital_group_expansion: "Expansión del Grupo Cevital"
 ALG_cevital_group_expansion_desc: "Cevital, el principal conglomerado de Argelia, tiene el potencial de convertirse en una central eléctrica continental. Apoyar su crecimiento creará empleos y acelerará la modernización industrial."
 ALG_scientific_research_push: "Promoción de la investigación científica"
 ALG_scientific_research_push_desc: "La innovación es la clave para el crecimiento a largo plazo. Al invertir en investigación científica, Argelia puede preparar la base para una economía basada en el conocimiento."
 ALG_expand_higher_education: "Ampliación de la educación superior"
 ALG_expand_higher_education_desc: "Las universidades y las escuelas técnicas deben ampliarse y modernizarse para satisfacer las exigencias del siglo XXI. Una población mejor educada fortalecerá tanto la sociedad como la economía."
 ALG_digitalize_education: "Digitalizar la educación"
 ALG_digitalize_education_desc: "Las plataformas digitales, el aprendizaje en línea y la integración informática revolucionarán el sector educativo de Argelia, creando una fuerza laboral más calificada y adaptable."
 ALG_national_research_program: "Lanzamiento del Programa Nacional de Investigación"
 ALG_national_research_program_desc: "Un programa de investigación nacional coordinado permitirá a Argelia mantener el ritmo con los avances tecnológicos globales."
 ALG_industry: "Ampliación de la industria argelina"
 ALG_industry_desc: "La industria argelina debe ser diversificada y modernizada. Al promover el crecimiento industrial, podemos reducir la dependencia de los hidrocarburos y crear una economía más equilibrada."
 ALG_constantine_hub: "Desarrollar el Hub Industrial Constantino"
 ALG_constantine_hub_desc: "La ciudad de Constantine es un importante centro regional. Invertir aquí creará un nuevo centro industrial que difunda el crecimiento fuera de Argel."
 ALG_tlemcen_agro_industry: "Impulsar Tlemcen Agro-Industry"
 ALG_tlemcen_agro_industry_desc: "La agricultura y el procesamiento de alimentos en Tlemcen se pueden desarrollar en un poderoso sector agroindustrial, alimentando a la nación y creando empleos."
 ALG_snvi_modernization: "Modernizar SNVI"
 ALG_snvi_modernization_desc: "SNVI, el fabricante nacional de vehículos de Argelia, debe ser modernizado para competir globalmente. Ampliar la capacidad de producción fortalecerá nuestro transporte y base industrial."
 ALG_annaba_steel_complex: "Complejo de acero Annaba"
 ALG_annaba_steel_complex_desc: "Annaba acoge las mayores instalaciones de producción de acero de Argelia. Modernizarlos y expandirlos proporcionará la columna vertebral para futuras industrias de infraestructura y defensa."
 ALG_arzew_refinery: "Expansión de refinería de Arzew"
 ALG_arzew_refinery_desc: "La refinería de Arzew es un vínculo vital en nuestras exportaciones energéticas. Ampliar su capacidad asegurará las entradas de divisas extranjeras y fortalecerá el dominio de Sonatrach."
 ALG_pipeline_modernization: "Modernizar las tuberías"
 ALG_pipeline_modernization_desc: "Un sistema moderno de tuberías es esencial para las exportaciones energéticas seguras y eficientes. Mejorar nuestros oleoductos evitará pérdidas y mejorará la confiabilidad internacional."
 ALG_skikda_port_modernization: "Modernizar el puerto de Skikda"
 ALG_skikda_port_modernization_desc: "El puerto de Skikda es crítico para las exportaciones de comercio y energía. La modernización de sus instalaciones garantizará que Argelia siga siendo un centro marítimo competitivo."
 ALG_grant_foreign_energy_concessions: "Concesiones energéticas extranjeras"
 ALG_grant_foreign_energy_concessions_desc: "Al conceder concesiones selectivas a empresas extranjeras, Argelia puede atraer capital y tecnología, aunque a riesgo de ceder parte de su independencia energética."
 ALG_hassi_messaoud_expansion: "Ampliar Hassi Messaoud Oil Field"
 ALG_hassi_messaoud_expansion_desc: "El campo petrolero Hassi Messaoud es el más grande de Argelia. Ampliar la capacidad de extracción y refinación aumentará enormemente nuestra producción energética."
 ALG_expand_sonatrach: "Expandir Sonatrach"
 ALG_expand_sonatrach_desc: "Sonatrach es el corazón de la economía argelina. Fortalecer la empresa asegurará nuestro papel global en la producción de petróleo y gas."
 ALG_protect_oil_gas_facilities: "Protege las instalaciones de petróleo y gas"
 ALG_protect_oil_gas_facilities_desc: "Nuestra infraestructura energética es vulnerable en tiempos de guerra o disturbios. Fortalecer las defensas alrededor de instalaciones de petróleo y gas es crítico para la seguridad nacional."
 ALG_minister_of_agriculture_reforms: "Programa de reforma agrícola"
 ALG_minister_of_agriculture_reforms_desc: "Años de abandono han debilitado la agricultura argelina. Las nuevas reformas del Ministerio de Agricultura restaurarán la productividad y reducirán la dependencia de las importaciones de alimentos."
 ALG_modernize_agricultural_sector: "Modernizar el sector agrícola"
 ALG_modernize_agricultural_sector_desc: "Años de conflicto y abandono han dejado las granjas argelinas anticuadas e ineficientes. La mecanización, los sistemas de riego y las subvenciones revitalizarán el sector agrícola, asegurando la seguridad alimentaria para nuestro pueblo."
 ALG_rural_development_program: "Programa de desarrollo rural"
 ALG_rural_development_program_desc: "Las aldeas de Argelia han sufrido desde hace mucho tiempo la inversión. Dirigiendo fondos a la infraestructura rural, el poder y los empleos, reduciremos la desigualdad entre las ciudades y el campo y fortaleceremos la unidad nacional."
 ALG_promote_algerian_produce: "Promoción de la producción argelina"
 ALG_promote_algerian_produce_desc: "Nuestra tierra produce una gran variedad de cultivos y productos naturales, pero las importaciones extranjeras dominan los mercados locales. Mediante el branding, las subvenciones y los incentivos comerciales, aumentaremos el perfil de los bienes argelinos en el país y en el extranjero."
 ALG_build_farm_to_market_roads: "Caminos de granja a mercado"
 ALG_build_farm_to_market_roads_desc: "Los agricultores necesitan un mejor acceso a los consumidores y rutas de exportación. La construcción de caminos desde las zonas rurales hasta los centros urbanos y a través de la frontera tunecina fortalecerá tanto nuestro sector agrícola como los vínculos regionales."
 ALG_new_agro_industrial_complexes: "Nuevos Complejos Agroindustriales"
 ALG_new_agro_industrial_complexes_desc: "Argelia debe vincular la agricultura con la industria moderna. Construyendo complejos agroindustriales, podemos crear productos de valor añadido, generar empleo y aumentar los ingresos rurales."
 ALG_invest_tourism: "Invertir en Turismo"
 ALG_invest_tourism_desc: "El turismo prosperó en Argelia antes de que los años de guerra alejaran a los visitantes. Con una inversión cuidadosa y una seguridad mejorada, podemos empezar a restaurar este sector vital."
 ALG_restore_hotel_resorts: "Restaurar Hotel Resorts"
 ALG_restore_hotel_resorts_desc: "Muchos de los resorts y hoteles de Argelia se encuentran en ruinas o falta de pago. Renovarlos ayudará a atraer visitantes extranjeros y proporcionar empleos domésticos."
 ALG_blida_airbase_modernization: "Modernización de Blida Airbase"
 ALG_blida_airbase_modernization_desc: "La base aérea de Blida es una instalación clave tanto para viajes civiles como para transporte militar. Modernizarla mejorará la conectividad de Argelia e impulsará el comercio regional."
 ALG_algiers_oran_highway: "Argel-Oran carretera"
 ALG_algiers_oran_highway_desc: "Vincular Argel a Oran con una carretera moderna reducirá los tiempos de transporte, apoyará el comercio y fortalecerá la columna vertebral económica de Argelia."
 ALG_east_west_highway_project: "Proyecto de carretera Este-Oeste"
 ALG_east_west_highway_project_desc: "La autopista Este-Oeste será uno de los mayores proyectos de infraestructura en África, conectando nuestras regiones y estimulando el comercio."
 ALG_ski_resorts_of_tikjda: "Centros de esquí de Tikjda"
 ALG_ski_resorts_of_tikjda_desc: "En las montañas Kabyle se encuentra Tikjda, un complejo con potencial sin explotar. Modernizar sus instalaciones y promover el turismo invernal diversificará la base económica de Argelia."
 ALG_north_african_tourism_hub: "Centro de turismo del norte de África"
 ALG_north_african_tourism_hub_desc: "Al invertir en nuestras costas, patrimonio cultural y paisajes naturales, Argelia puede convertirse en el destino turístico más importante del norte de África, rivalizando con nuestros vecinos mediterráneos."
 ALG_it_investments: "Inversiones de la tecnología de la información"
 ALG_it_investments_desc: "Con la velocidad a la que evoluciona la tecnología de TI, no podemos hacerlo sin ella en el futuro. Así que es hora de invertir en este sector."
 ALG_infrastructure_investments: "Inversiones de infraestructura"
 ALG_infrastructure_investments_desc: "Nuestra infraestructura después de los 90 está en un estado deplorable. Ya era hora de que se reconstruyera."
 ALG_science_idea: "Ciencias y educación argelinas"
 ALG_fuel: "Argelina"
 ALG_dziri: "Dziri"
 ALG_dziri_desc: "Argelia debe abordar sus apremiantes cuestiones sociales: desde la tradición y el islam hasta los derechos de los amazigh y las reformas democráticas. El camino que elijamos dará forma a la nación."
 ALG_traditions_matter: "Tradiciones Matter"
 ALG_traditions_matter_desc: "El pueblo argelino se aferra a la fe, la familia y la identidad nacional. Nuestro gobierno debe respetar estas tradiciones si queremos mantener la legitimidad."
 ALG_restrict_women_roles: "Preservar el Código de la Familia"
 ALG_restrict_women_roles_desc: "Los líderes conservadores argumentan que los papeles de las mujeres deben permanecer centrados en la familia. La reforma del Código de la Familia corre el riesgo de enojar a las autoridades religiosas y al público."
 ALG_expand_berber_rights: "Reconocer los derechos de los amazigh"
 ALG_expand_berber_rights_desc: "El movimiento de identidad bereber exige el pleno reconocimiento cultural y lingüístico. La concesión de derechos amazigh desactivaría las tensiones, pero podría alienar a los corredores."
 ALG_censor_internet: "Censor Internet"
 ALG_censor_internet_desc: "Los medios sociales y el activismo en línea han alimentado protestas. Restringir las libertades en línea restaurará el control estatal pero dañará nuestra imagen internacional."
 ALG_open_civil_society: "Sociedad civil abierta"
 ALG_open_civil_society_desc: "Las fuerzas democráticas impulsan una sociedad civil libre, ONG y asociaciones de Hirak. Abrir este espacio fortalecería la legitimidad pero arriesgaría la fragmentación política."
 ALG_integration_policy: "Política de integración"
 ALG_integration_policy_desc: "Los migrantes subsaharianos y la diáspora que regresa enfrentan desafíos. Una política de integración estructurada puede reducir las tensiones sociales y promover la cohesión."
 ALG_marriage_subsidies: "Subvenciones matrimoniales"
 ALG_marriage_subsidies_desc: "Con jóvenes que luchan por casarse y comenzar familias, los subsidios para la vivienda y las bodas estabilizarán la sociedad y fomentarán la formación familiar."
 ALG_constitutionalize_rights: "Constitucionalizar los derechos"
 ALG_constitutionalize_rights_desc: "Podemos bloquear las libertades civiles, los derechos de las mujeres y el reconocimiento amazigh mediante la reforma constitucional. Esto significaría un cambio social permanente."
 ALG_berber_right: "Reconocimiento de los amazigh"
 ALG_berber_right_desc: "La identidad de los amazigh ha sido reconocida oficialmente, potenciando la estabilidad en las regiones bereber-mayoritarias."
 Algeria.238.t: "Estabilizar Malí"
 Algeria.238.d: "El conflicto en curso en Malí amenaza con desestabilizar toda la región del Sahel. Los separatistas tuareg y los grupos yihadistas han creado una crisis de seguridad en nuestra frontera sur. Argelia no puede permitirse permanecer pasiva mientras se propaga la inestabilidad. Debemos decidir si apoyar al gobierno maliense para restablecer el orden, o continuar las negociaciones con las facciones tuareg con la esperanza de lograr un arreglo duradero."
 Algeria.238.a: "Apoyo al Gobierno de Malí"
 Algeria.238.b: "Proporcionar apoyo a las fuerzas tuareg"
 ALG_us_invest_tt: "Buscar inversión estadounidense en Argelia"
 ALG_fra_invest_tt: "Busca la inversión francesa en Argelia"
 ALG_eng_invest_tt: "Buscar inversión en inglés en Argelia"
 ALG_chi_invest_tt: "Busca la inversión china en Argelia"
 ALG_rus_invest_tt: "Busca la inversión rusa en Argelia"
 ALG_open_to_west: "Abierto a Occidente"
 ALG_open_to_west_desc: "Argelia ha seguido durante mucho tiempo la neutralidad, pero los tiempos están cambiando. Al alinearnos más estrechamente con el mundo occidental podría traer estabilidad, seguridad y oportunidades de inversión."
 ALG_nato_partnership: "Asociación de la OTAN"
 ALG_nato_partnership_desc: "Exploraremos la cooperación estructurada con la OTAN. Esta asociación fortalecerá la posición internacional de Argelia y ayudará a modernizar nuestras fuerzas armadas."
 ALG_energy_partnership_eu: "Asociación energética con la UE"
 ALG_energy_partnership_eu_desc: "Las vastas reservas energéticas de Argelia son muy buscadas en Europa. Al forjar alianzas energéticas con Francia y el Reino Unido, podemos conseguir contratos lucrativos e inversiones a largo plazo."
 ALG_strengthen_eu_trade: "Fortalecer las relaciones comerciales de la UE"
 ALG_strengthen_eu_trade_desc: "Europa sigue siendo nuestro mayor socio comercial. El fortalecimiento de estos vínculos económicos estabilizará nuestro mercado de exportación e integrará aún más a Argelia en el comercio mundial."
 ALG_expand_us_partnership: "Ampliar la asociación de los Estados Unidos"
 ALG_expand_us_partnership_desc: "Los Estados Unidos buscan estabilidad en África del Norte. Al ampliar la cooperación económica y de seguridad con Washington, Argelia puede atraer inversiones y ganar un poderoso aliado."
 ALG_become_nato_ally: "Conviértete en aliado de la OTAN"
 ALG_become_nato_ally_desc: "Aunque la adhesión plena a la OTAN puede ser prematura, Argelia puede obtener una condición de aliado de confianza. Esto nos daría acceso a la experiencia militar, ejercicios conjuntos y apalancamiento diplomático."
 ALG_exchange_research_with_nato: "Investigación de intercambio con la OTAN"
 ALG_exchange_research_with_nato_desc: "La cooperación científica con los aliados de la OTAN permitirá a Argelia beneficiarse de la investigación conjunta, el intercambio de tecnología militar y la modernización de nuestras instituciones educativas e investigadoras."
 ALG_get_nato_military_exp: "Ganar la experiencia militar de la OTAN"
 ALG_get_nato_military_exp_desc: "La amplia formación militar y doctrina de la OTAN ofrecen una valiosa experiencia. Las fuerzas armadas de Argelia modernizarán mediante ejercicios combinados de capacitación y orientación estratégica."
 ALG_counterterrorism_coordination: "Coordinación de la lucha contra el terrorismo"
 ALG_counterterrorism_coordination_desc: "El terrorismo sigue siendo una amenaza importante en el norte de África. Al coordinar con las unidades de inteligencia y lucha contra el terrorismo de la OTAN, Argelia puede fortalecer la seguridad nacional y la estabilidad regional."
 ALG_get_investements_from_nato: "Atraer inversiones de la OTAN"
 ALG_get_investements_from_nato_desc: "Nuestra alineación de la OTAN atraerá apoyo económico y proyectos de infraestructura de los miembros de las alianzas, asegurando beneficios a largo plazo para la economía de Argelia."
 ALG_strengthen_democratic_norms: "Fortalecer las normas democráticas"
 ALG_strengthen_democratic_norms_desc: "Para integrarse plenamente con el mundo occidental, Argelia debe fortalecer las instituciones democráticas. Esto incluye la protección de las libertades civiles, el apoyo al pluralismo y el fomento de la reforma política."
 ALG_seek_greater_influence_in_wto: "Buscar una mayor influencia en la OMC"
 ALG_seek_greater_influence_in_wto_desc: "A medida que se desarrolla Argelia, debemos ampliar nuestro papel dentro de la Organización Mundial del Comercio, asegurando que nuestra voz sea escuchada en las negociaciones económicas mundiales."
 ALG_seek_security_council_seat: "Busca asiento del Consejo de Seguridad de la ONU"
 ALG_seek_security_council_seat_desc: "La historia diplomática de Argelia y el historial de mantenimiento de la paz nos dan un fuerte caso para una presencia permanente en el Consejo de Seguridad de las Naciones Unidas. Debemos empujar por esta ambición."
 ALG_join_nato: "Únase a la OTAN"
 ALG_join_nato_desc: "Tras decenios de neutralidad y equilibrio cauteloso, Argelia se prepara ahora para dar un paso histórico: la adhesión plena a la OTAN. Esta decisión consolidará nuestro lugar entre las potencias occidentales y reformará nuestra política exterior."
 ALG_global_companies: "Invitar a Global Corporations"
 ALG_global_companies_desc: "Al abrir nuestros mercados a inversores extranjeros, Argelia puede atraer corporaciones globales para establecer una presencia en nuestra economía. Esto impulsará el crecimiento industrial, las transferencias de tecnología y el prestigio internacional."
 ALG_huawei: "Telecomunicaciones Huawei"
 ALG_huawei_desc: "Huawei se ha ofrecido a establecer infraestructuras avanzadas de telecomunicaciones en Argelia, proporcionando una columna vertebral digital moderna y asegurando nuestro papel en la era de la información."
 ALG_hyundai: "Ampliación industrial Hyundai"
 ALG_hyundai_desc: "Hyundai ha expresado interés en invertir en los sectores de vehículos e industriales de Argelia. Al dar la bienvenida a sus fábricas, podemos estimular el empleo y el desarrollo tecnológico."
 ALG_weapons_expert: "Expertos en armas extranjeras"
 ALG_weapons_expert_desc: "A través de la cooperación con las empresas extranjeras de defensa, Argelia puede adquirir nuevos conocimientos especializados en apoyo de armas y sistemas tácticos, fortaleciendo nuestras fuerzas terrestres."
 ALG_airburst_weapons: "Desarrollar armas de transporte aéreo"
 ALG_airburst_weapons_desc: "La tecnología Airburst permite a la infantería atacar enemigos detrás de cubiertas o en posiciones fortificadas. Invertir en este sistema de vanguardia aumentará enormemente nuestra eficacia en el campo de batalla."
 ALG_vehicle_industry: "Ampliación de la industria del vehículo"
 ALG_vehicle_industry_desc: "Al asociarse con fabricantes de automóviles globales y empresas industriales, Argelia puede establecer una fuerte industria militar y civil para impulsar tanto la defensa como la economía."
 ALG_advanced_ultility_vehicle: "Vehículos avanzados de Utilidad"
 ALG_advanced_ultility_vehicle_desc: "Nuestro sector automotriz debe avanzar en el desarrollo avanzado. La producción de vehículos públicos modernos y fiables fortalecerá la eficiencia logística y del transporte."
 ALG_sat_tech: "Cooperación en materia de tecnología satélite"
 ALG_sat_tech_desc: "A través de asociaciones con empresas mundiales, Argelia puede desarrollar tecnologías avanzadas por satélite, mejorando nuestros sistemas de vigilancia, comunicaciones y posicionamiento."
 ALG_advanced_radar: "Sistemas avanzados de radar"
 ALG_advanced_radar_desc: "La tecnología moderna de radar y detección dará a Argelia mayores capacidades defensivas y nos permitirá integrarnos en marcos avanzados de seguridad regional."
 ALG_microsoft: "Infraestructura digital de Microsoft"
 ALG_microsoft_desc: "Al asociarse con Microsoft, Argelia puede modernizar sus sectores de TI y software, mejorando la seguridad cibernética, la administración digital y el crecimiento impulsado por tecnología."
 ALG_Lenovo: "Inversión tecnológica Lenovo"
 ALG_Lenovo_desc: "Lenovo está interesado en ampliar su presencia en Argelia. Colaborar con ellos fortalecerá nuestra industria informática de hardware y apoyará la innovación tecnológica."
 ALG_Danone: "Ampliación de la industria alimentaria de Danone"
 ALG_Danone_desc: "Acogiendo con beneplácito la inversión de Danone en el sector alimentario de Argelia aumentará la nutrición, los estándares de producción alimentaria y las relaciones comerciales internacionales."
 ALG_toyota: "Toyota asociación industrial"
 ALG_toyota_desc: "Al invitar a Toyota a establecer instalaciones industriales y automotrices, Argelia puede mejorar la producción de vehículos, crear empleos y promover el avance tecnológico en el sector automovilístico."
 ALG_align_with_south_africa: "Alineados con Sudáfrica"
 ALG_align_with_south_africa_desc: "Sudáfrica desempeña un papel rector en los asuntos políticos y económicos de África. Mediante el fortalecimiento de nuestra asociación, podemos coordinar las políticas sobre comercio, diplomacia y seguridad en todo el continente."
 ALG_open_to_east: "Abierto al Este"
 ALG_open_to_east_desc: "Volviendo al Oriente diversificará nuestras alianzas, reducirá la dependencia en Occidente y desbloqueará oportunidades en mercados como Rusia, China y otras potencias crecientes."
 ALG_expand_trade_with_russia: "Ampliar el comercio con Rusia"
 ALG_expand_trade_with_russia_desc: "Rusia ofrece a Argelia nuevas oportunidades en materia de energía, armas y cooperación industrial. El fortalecimiento de nuestros vínculos comerciales profundizará las relaciones estratégicas."
 ALG_expand_trade_with_china: "Ampliar el comercio con China"
 ALG_expand_trade_with_china_desc: "China está ansioso por invertir en África y ofrece acuerdos comerciales beneficiosos para Argelia. Esta cooperación podría proporcionarnos infraestructura y desarrollo industrial."
 ALG_mediterranean_corridor_initiative: "Iniciativa del corredor mediterráneo"
 ALG_mediterranean_corridor_initiative_desc: "Al vincular nuestra economía con los mercados mediterráneo y oriental, Argelia puede establecerse como un corredor clave para proyectos de comercio e infraestructura."
 ALG_Investments_From_East: "Inversiones orientales"
 ALG_Investments_From_East_desc: "Atraer a los inversores de Oriente fortalecerá nuestra economía, proveerá nuevas industrias y asegurará que Argelia se beneficie de fuentes diversificadas de capital."
 ALG_eastern_alignment: "Alineación oriental"
 ALG_eastern_alignment_desc: "Una mayor alineación con Rusia, China y sus aliados dará a Argelia nuevos socios en seguridad, comercio y tecnología al tiempo que reducirá la influencia occidental."
 ALG_china_civ: "Inversiones civiles chinas"
 ALG_china_civ_desc: "Las corporaciones chinas están listas para expandirse a las industrias civiles de Argelia. Estos proyectos generarán empleos y acelerarán la modernización."
 ALG_china_civ2: "Otros proyectos civiles chinos"
 ALG_china_civ2_desc: "Después del éxito de las empresas anteriores, China está ofreciendo inversiones adicionales para ampliar aún más la base industrial civil de Argelia."
 ALG_chinese_armor_deal: "China Blindaje Trato"
 ALG_chinese_armor_deal_desc: "China ha propuesto vender vehículos blindados y paquetes tecnológicos de Argelia. Este acuerdo mejorará nuestras fuerzas terrestres y profundizará los lazos de defensa."
 ALG_joint_military_exercise_with_rus: "Ejercicios militares conjuntos con Rusia"
 ALG_joint_military_exercise_with_rus_desc: "Al realizar ejercicios conjuntos con Rusia, Argelia mejorará la coordinación militar y aprenderá de la experiencia de combate rusa."
 ALG_russia_inf_tech: "Tecnología rusa de infantería"
 ALG_russia_inf_tech_desc: "La experiencia rusa en armas pequeñas y tácticas de infantería puede adaptarse a las necesidades argelinas, dando a nuestros soldados mejores herramientas y entrenamiento."
 ALG_russia_experience: "Cooperación de Defensa con Moscú"
 ALG_russia_experience_desc: "La intensificación de la cooperación militar con Rusia traerá asesores experimentados y programas de capacitación a Argelia. Nuestras fuerzas armadas surgirán más fuertes y más preparadas."
 ALG_idea_parliamentary_republic: "Majlis al-Watani al-Shaabi"
 ALG_idea_presidential_republic: "Sistema Presidencial"
 ALG_idea_semi_presidential_republic: "Al-Jumhorya al-Democratia al-Shaabia"
 ALG_release_political_pirsoners: "Liberar prisioneros políticos"
 ALG_release_political_pirsoners_desc: "Para abrir un nuevo capítulo para la nación, la nueva administración liberará a los detenidos por razones políticas durante los años de disturbios. Este acto de clemencia tiene por objeto fomentar la unidad nacional y reconstruir la confianza entre el pueblo y el Estado."
 ALG_al_jazair_al_djadida: "Al-Jazair Al-Djadida"
 ALG_al_jazair_al_djadida_desc: "La promesa del presidente Abdelmadjid Tebboune de una «Nueva Argelia» busca renovar la legitimidad del Estado mediante reformas constitucionales y administrativas, fortaleciendo las instituciones democráticas y la confianza pública."
 ALG_republic_of_algeria: "La República de Argelia"
 ALG_republic_of_algeria_desc: "Con los cimientos de la reforma, Argelia reafirma su identidad como república guiada por la soberanía nacional, la justicia social y la voluntad de sus ciudadanos."
 ALG_majlis_al_watani_al_shaabi: "Majlis al-Watani al-Shaabi"
 ALG_majlis_al_watani_al_shaabi_desc: "Una república parlamentaria facultaría a los representantes electos del pueblo para guiar la dirección de la nación, limitando el dominio del ejecutivo y garantizando la toma de decisiones colectiva."
 ALG_jumhorya_democratia_shaabia: "Al-Jumhorya al-Democratia al-Shaabia"
 ALG_jumhorya_democratia_shaabia_desc: "Mantener un equilibrio semi-presidencial entre poder ejecutivo y legislativo podría estabilizar la transición de Argelia, impidiendo el regreso al autoritarismo, asegurando al mismo tiempo una gobernanza decisiva."
 ALG_deep_state_republic: "La República Popular Democrática de Corea"
 ALG_deep_state_republic_desc: "Detrás de una fachada de reforma surge una nueva estructura de poder. Los antiguos generales, empresarios y burócratas consolidan el control en las sombras. Esta «República Estatal profunda» mantiene la ilusión de la democracia al tiempo que salvaguarda sus redes de influencia y corrupción."
 ALG_tamazgha: "El sueño de Tamazgha"
 ALG_tamazgha_desc: "Ha llegado el momento del renacimiento de Tamazgha, la tierra del pueblo amazigh que se extiende desde el Atlántico hasta el Nilo. Se levanta un nuevo amanecer para el norte de África, bajo la bandera de la libertad y la unidad."
 ALG_our_land: "Nuestra Tierra Sagrada"
 ALG_our_land_desc: "Nuestro pueblo debe reclamar y reconstruir las tierras que siempre han sido nuestras. La industria, la mano de obra y el valor serán los cimientos de nuestra patria renacida."
 ALG_expand_our_army: "Ampliar nuestro ejército"
 ALG_expand_our_army_desc: "La defensa de Tamazgha depende de la fuerza de nuestro ejército. Debemos entrenar, armar y expandir nuestras fuerzas para proteger a nuestra nueva nación de sus muchos enemigos."
 ALG_berber_of_tunisia: "Los bereberes de Túnez"
 ALG_berber_of_tunisia_desc: "Nuestros hermanos Amazigh en Túnez llevan mucho tiempo bajo dominio extranjero. Es hora de unirlos bajo la bandera de Tamazgha y liberar sus tierras."
 ALG_libya_invasion: "Invasión de Libia"
 ALG_libya_invasion_desc: "Desde las arenas del Sahara hasta las costas de Trípoli, Libia es parte legítimamente de nuestra patria cultural. Debemos llevarlo al pliegue de Tamazgha."
 ALG_take_egypt: "March on Egypt"
 ALG_take_egypt_desc: "Egipto tiene la llave de la frontera oriental de Tamazgha. Sus vastos recursos e importancia estratégica lo convierten en una parte vital de nuestra visión."
 ALG_canary_island: "Aprovechar las Islas Canarias"
 ALG_canary_island_desc: "Las Islas Canarias fueron habitadas una vez por los amazigh, los guanches. Llevaremos a estas islas bajo la soberanía de Amazigh."
 ALG_take_niger: "Reclamación de Níger"
 ALG_take_niger_desc: "Los tuareg de Níger son amazigh por la sangre y el patrimonio. Sus desiertos se unirán una vez más a la gran federación de Tamazgha."
 ALG_rif_in_morocco: "El Rif en Marruecos"
 ALG_rif_in_morocco_desc: "Las montañas del Rif dieron a luz héroes que resistían al colonialismo. Su valentía nos inspira a unificar Marruecos bajo la causa Amazigh."
 ALG_demand_mali: "Demanda Malí"
 ALG_demand_mali_desc: "Las tierras de Malí, ricas en historia y cultura, formaban parte de los grandes imperios amazigh. Es hora de restaurar nuestra influencia en el Sahel."
 ALG_demand_mauritania: "Demanda Mauritania"
 ALG_demand_mauritania_desc: "Los desiertos de Mauritania tienen raíces amazigh que van profundamente en nuestro pasado. Su unificación con Tamazgha es el siguiente paso en nuestro destino continental."
 ALG_TAM_unite_tamazgha: "Unir Tamazgha"
 ALG_TAM_unite_tamazgha_desc: "Todas las tierras de Amazigh deben estar unidas bajo una bandera. El sueño de Tamazgha ya no es una visión, es una misión que cumpliremos."
 ALG_expand_more: "Ampliar la Federación"
 ALG_expand_more_desc: "Tamazgha no debe estancarse. La expansión, tanto industrial como territorial, garantizará nuestro lugar como un gran poder de África y el Mediterráneo."
 ALG_focus_on_our_land: "Enfoque en Nuestra Tierra"
 ALG_focus_on_our_land_desc: "En lugar de expandirnos demasiado lejos, debemos centrarnos en el desarrollo de nuestra tierra, mejorando nuestra influencia, economía y unidad dentro del propio Tamazgha."
 ALG_expand_to_ME: "Ampliación al Oriente Medio"
 ALG_expand_to_ME_desc: "El Medio Oriente está roto por el caos. Con fuerza y propósito, Tamazgha puede traer orden y liderazgo amazigh a las tierras de Arabia."
 ALG_take_arabia: "Conquer Arabia"
 ALG_take_arabia_desc: "La península árabe está dividida y débil. Llevaremos la luz de Tamazgha a estas tierras y aseguraremos nuestro dominio sobre el Mar Rojo y el Golfo."
 ALG_take_levant: "To the Levant"
 ALG_take_levant_desc: "Desde las montañas del Líbano hasta las llanuras de Siria y Palestina, el Levante caerá bajo la bandera de Tamazgha, acercándonos a controlar la cuna de la civilización."
 ALG_legacy_of_dihiya: "Legado de Dihya"
 ALG_legacy_of_dihiya_desc: "La reina Dihya, el intrépido guerrero del Aurès, unió una vez a las tribus amazigh contra los invasores extranjeros. Su espíritu de desafío y liderazgo vive dentro de nuestro pueblo. Llevamos su legado hacia adelante, ininterrumpido, inquebrantable y por siempre libre."
 ALG_de_arabisation_mission_desc: "Está en marcha la campaña nacional de reforma cultural y lingüística. La burocracia y la educación están siendo reescritas para reflejar el patrimonio amazigh. Esta transformación causará tensiones a corto plazo, pero fortalecerá nuestra nación a largo plazo."
 ALG_dearabisation_end_TT: "§GEl proceso de De-Arabización concluye.§! Los núcleos árabes son reemplazados por los amazigh, y ganamos el espíritu nacional §Y'Imazighen Perseverance'§!."
 ALG_de_arabisation: "Campaña de De-Arabización"
 ALG_de_arabisation_desc: "Durante siglos, la verdadera identidad de nuestro pueblo ha sido sepultada bajo culturas impuestas. Reclamaremos nuestras raíces mediante la reforma de las políticas educativas, administrativas y lingüísticas, incluso si interrumpe nuestra sociedad a corto plazo."
 ALG_dearabisation_penalty: "Ufeaval administrativo"
 ALG_dearabisation_penalty_desc: "El proceso de De-Arabisation ha interrumpido el sistema estatal de burocracia y educación. La resistencia, la confusión y la ineficiencia azotan la transición mientras el gobierno intenta reconstruir las instituciones en la imagen de Amazigh."
 ALG_imazighen_perseverance: "Imazighen Perseverance"
 ALG_imazighen_perseverance_desc: "A través de las dificultades y la reforma, nuestro pueblo sufrió. El espíritu amazigh ha demostrado ser irrompible, emergemos de la tormenta más fuerte, más orgulloso y unificado."
 ALG_el_salam_nuclear_reactor: "El reactor nuclear de Salam"
 ALG_el_salam_nuclear_reactor_desc: "Para satisfacer la creciente demanda energética de Argelia y reducir la dependencia de los combustibles fósiles, el gobierno iniciará la construcción del reactor nuclear El Salam. Este proyecto representa un paso importante hacia el progreso científico y la diversificación energética."
 ALG_uranium_enrichment: "Programa de enriquecimiento de uranio"
 ALG_uranium_enrichment_desc: "El desarrollo de una capacidad nacional de enriquecimiento de uranio permitirá a Argelia gestionar su propio suministro de combustible nuclear. Con este programa, nuestros científicos pretenden dominar la tecnología centrífuga y lograr la autosuficiencia nuclear."
 ALG_el_nour_nuclear_facility: "Instalación nuclear El Nour"
 ALG_el_nour_nuclear_facility_desc: "Tras el éxito del reactor El Salam, Argelia ampliará su infraestructura nuclear mediante la construcción de la instalación El Nour, un centro de investigación, mantenimiento de reactores y desarrollo nuclear pacífico."
 ALG_ask_for_help_from_india: "Solicite asistencia india"
 ALG_ask_for_help_from_india_desc: "La India tiene décadas de experiencia en el desarrollo de la energía nuclear bajo escrutinio internacional. Al llegar a Nueva Delhi para la cooperación técnica y científica, Argelia puede avanzar más rápidamente en su programa nuclear civil."
 ALG_buy_pinaka_launcher: "Compra Pinaka Rocket Launchers"
 ALG_buy_pinaka_launcher_desc: "El lanzador de cohetes múltiple Pinaka hecho por la India es un sistema rentable y fiable. Adquirir estos lanzadores fortalecerá las divisiones de artillería de Argelia y fomentará una cooperación militar más estrecha con la India."
 ALG_indian_missiles: "Adquire Indian Missile Technology"
 ALG_indian_missiles_desc: "A través de una amplia colaboración en defensa con la India, Argelia puede acceder a sistemas avanzados de orientación y propulsión de misiles. Integrar esta tecnología mejorará significativamente nuestras capacidades nacionales de defensa."
 ALG_subsidise_amazigh_businesses: "Subvenciona negocios de Amazigh-Run"
 ALG_subsidise_amazigh_businesses_desc: "Proporcionar subsidios estatales y apoyo preferente a los empresarios amazigh para fomentar el crecimiento económico en las regiones de Tamazgha."
 ALG_leave_arab_league: "Abandonar la Liga Árabe"
 ALG_leave_arab_league_desc: "Retirar a Argelia de la Liga Árabe, afirmando una identidad soberana de los Amazigh separada de la política bloc árabe."
 ALG_bring_back_amazigh_exiles: "Traigan los exiliados de Amazigh"
 ALG_bring_back_amazigh_exiles_desc: "Facilitar el regreso de los exiliados e inmigrantes amazigh, ofreciendo incentivos para el reasentamiento."
 ALG_boost_kabyle_population: "Impulsar la población de Kabyle"
 ALG_boost_kabyle_population_desc: "Aplicar políticas para aumentar la proporción demográfica cabileña mediante incentivos, reasentamiento y apoyo."
 ALG_de_arabisation_category: "Programa Tamazgha De-Arabisation"
 ALG_de_arabisation_category_desc: "Para construir una nueva Tamazgha, debemos derramar la identidad árabe impuesta y restaurar el alma amazigh de nuestra nación."
 ALG_de_arabisation_mission: "Proceso de Desa-Arabización"
 ALG_return_amazigh_exiles: "Traer de vuelta a los exiliados e inmigrantes amazigh"
 ALG_return_amazigh_exiles_desc: "Décadas de discriminación obligaron a muchos a huir. Es hora de traerlos a casa."
 ALG_dearabisation_fail_TT: "El fracaso debilita la estabilidad y aumenta la tensión étnica."
 ALG_amazigh_businesses_complete_TT: "La satisfacción de Kabyle y la economía mejoran."
 ALG_amazigh_businesses_fail_TT: "El fracaso disminuye la satisfacción de Kabyle."
 ALG_return_exiles_complete_TT: "Regresar exiliados fortalecen la identidad y el poder de los asombros."
 ALG_return_exiles_fail_TT: "El no repatriar a los exiliados debilita la unidad."
 ALG_leave_arab_league_complete_TT: "Dejar la Liga Árabe impulsa la soberanía de Tamazgha."
 ALG_leave_arab_league_fail_TT: "El no salir causa malestar."
 ALG_kabyle_pop_complete_TT: "La población de Kabyle crece, aumenta la unidad nacional."
 ALG_kabyle_pop_fail_TT: "Desvelar la demografía de Kabyle causa malestar."
 ALG_tamazgha_cultural_revival_category: "Renacimiento cultural de Tamazgha"
 ALG_tamazgha_cultural_revival_category_desc: "Con el fin de la árabe, es hora de restaurar nuestro patrimonio cultural, lingüístico e intelectual, comienza el renacimiento de Tamazgha."
 ALG_amazigh_language_reform: "Reforma de la Lengua Amazigh"
 ALG_amazigh_language_reform_desc: "Debemos restaurar Tamazight como idioma nacional y promoverlo a través de la educación y la administración."
 ALG_tamazight_in_education: "Introducir el tamazight en la educación"
 ALG_tamazight_in_education_desc: "Implantar el idioma tamazight en escuelas y universidades para preservar nuestras raíces culturales."
 ALG_media_cultural_independence: "Independencia cultural y mediática"
 ALG_media_cultural_independence_desc: "Apoyar medios de comunicación independientes Amazigh e iniciativas culturales libres de influencia externa."
 ALG_tamazgha_regional_cooperation: "Cooperación regional de Tamazgha"
 ALG_tamazgha_regional_cooperation_desc: "Unir naciones del norte de África de ascendencia amazigh en un marco cooperativo para un futuro compartido."
 ALG_amazigh_language_reform_complete_TT: "Tamazight se convierte en un idioma estatal y aumenta la educación."
 ALG_amazigh_language_reform_fail_TT: "El no reformar la educación retrasa el renacimiento cultural."
 ALG_tamazight_in_education_complete_TT: "Tamazight se introdujo con éxito en los programas educativos."
 ALG_tamazight_in_education_fail_TT: "El sistema educativo sigue siendo dominado por árabes."
 ALG_media_cultural_independence_complete_TT: "Los medios independientes de Amazigh refuerzan la identidad nacional."
 ALG_media_cultural_independence_fail_TT: "El no actuar debilita la influencia cultural."
 ALG_tamazgha_regional_cooperation_complete_TT: "Se logró la unidad regional entre las naciones Tamazgha."
 ALG_tamazgha_regional_cooperation_fail_TT: "La falta de cooperación aísla a Tamazgha."
 ALG_black_decade_lesson: "Lecciones del Decenio Negro"
 ALG_black_decade_lesson_desc: "La guerra civil de los años noventa azotó profundamente a la nación, dejando atrás una guerra generacional de extremismo e inestabilidad. El Estado ha sacado lecciones duras de este capítulo oscuro, centrándose en preservar la unidad nacional, fortalecer las instituciones de seguridad y evitar el caos del enfrentamiento ideológico. Sin embargo, estas lecciones también justifican que la vieja guardia siga dominando la política, ya que el miedo a una repetición sigue formando cada reforma."
 AlgeriaElections.1.t: "Elecciones"
 AlgeriaElections.1.d: "Por primera vez en años, Argelia es testigo de elecciones verdaderamente competitivas. El aire está cargado de anticipación y tensión mientras millones de ciudadanos se dirigen a las urnas, decididos a moldear el futuro de su nación después de décadas de estancamiento político. Las múltiples fuerzas dominan el paisaje político.\n\nUn bloque, compuesto por facciones reformistas, liberales y moderadas islamistas, campañas de democracia, transparencia y reconciliación nacional. Su visión exige desmantelar el sistema 'Le Pouvoir' y restaurar la legitimidad al gobierno. Su llamamiento resuena fuertemente con los jóvenes, la sociedad civil y los trabajadores que buscan un cambio genuino.\n\nOtro frente consiste en independientes pragmáticos y tecnócratas, aquellos que buscan la reforma desde dentro. Priorizan la democratización gradual, el mejoramiento de la gobernanza y la liberalización económica manteniendo al mismo tiempo la estabilidad y la seguridad.\n\nA medida que las boletas son elevadas, una parte emerge victorioso, cada una representando un camino distinto hacia el futuro de la nación."
 AlgeriaElections.1.a: "La victoria de las reclamaciones FFS"
 AlgeriaElections.1.b: "El RND gana las elecciones"
 AlgeriaElections.1.c: "El MSP garantiza un mandato"
 AlgeriaElections.1.dd: "El RCD se dirige al poder"
 AlgeriaElections.2.t: "Elecciones"
 AlgeriaElections.2.d: "Han llegado las esperadas elecciones, y la nación respira. El Frente gobernante de Libération Nationale, o FLN, constituye una vez más el pilar central del sistema político argelino, apelando a aquellos que todavía valoran la estabilidad, la unidad y la continuidad después del tumulto del Decenio Negro. Bajo la dirección del Presidente Abdelaziz Bouteflika y el fiel establecimiento del partido, el FLN promete modernización sin caos, reforma sin ruptura.\n\nLos movimientos de oposición, aunque vocales y diversas, permanecen divididos y fragmentados, incapaces de formar un frente unido capaz de desafiar a la vieja guardia. Muchos argelinos, cansados de la conmoción y ansiosos por el orden, emitieron sus votos por lo familiar, convencidos de que la experiencia y la seguridad superan los riesgos del cambio.\n\nMientras los votos finales son altos, el resultado se hace claro: el legado de la revolución sigue reinando supremo."
 AlgeriaElections.2.a: "¡El FLN asegura otra victoria!"
 ALG_election_time: "Período de elecciones"
 ALG_election_time_desc: "Argelia se está preparando para otra temporada electoral crucial. El panorama político está tenso ya que tanto el FLN gobernante como los partidos de oposición preparan sus campañas."
 ALG_FLN_media_control: "Medios controlados por el Estado"
 ALG_FLN_media_control_desc: "Al estrechar el control sobre la prensa y la televisión, el gobierno asegura que la narrativa pública siga siendo leal al FLN gobernante y su visión de estabilidad."
 ALG_loyal_military: "Leal militar"
 ALG_loyal_military_desc: "El ejército ha demostrado ser un guardián fiable del régimen, asegurando que el orden y la unidad nacional se mantengan sobre todo."
 ALG_FLN_state_led_development: "Desarrollo de las semillas estatales"
 ALG_FLN_state_led_development_desc: "El Estado dirige los principales sectores de la economía, asegurando que el desarrollo industrial y social siga bajo control nacional."
 ALG_FLN_oil_for_people: "Petróleo para el Pueblo"
 ALG_FLN_oil_for_people_desc: "El gobierno utiliza la vasta riqueza hidrocarburo del país para proporcionar bienestar y subsidios, promoviendo un contrato social basado en la redistribución económica."
 ALG_FLN_national_security_council: "Consejo Nacional de Seguridad"
 ALG_FLN_national_security_council_desc: "Un órgano de alto nivel que coordina la seguridad interna y la contrainteligencia, asegurando que las amenazas al Estado sean prontamente neutralizadas."
 ALG_FLN_industrial_nationalization: "Industrialización"
 ALG_FLN_industrial_nationalization_desc: "El gobierno de la FLN ha tomado medidas para reafirmar el control sobre industrias clave para proteger la soberanía económica de Argelia."
 ALG_FLN_legacy_of_stability: "Legado de Estabilidad"
 ALG_FLN_legacy_of_stability_desc: "A pesar de sus fallas, el gobierno del FLN ha proporcionado continuidad y estabilidad, algo que muchos argelinos valoran después de años de confusión."
 ALG_FLN_oil_for_people_idea: "Petróleo para el Pueblo"
 ALG_FLN_oil_for_people_idea_desc: "El gobierno ha decidido utilizar los ingresos del petróleo para financiar directamente programas y subsidios públicos. Si bien esto aumenta los niveles de vida, también corre el riesgo de ineficiencia y dependencia a largo plazo."
 ALG_FLN_legacy_of_stability_idea: "Legado de Estabilidad"
 ALG_FLN_legacy_of_stability_idea_desc: "Durante décadas, el FLN se ha presentado como guardián de la estabilidad de Argelia. Su estricto control de la política y la seguridad garantiza la paz, pero a costa de las libertades limitadas."
 ALG_FLN_industrial_nationalization_idea: "Industrialización"
 ALG_FLN_industrial_nationalization_idea_desc: "Los principales sectores de la economía están siendo sometidos a control estatal para garantizar la independencia nacional y orientar el crecimiento industrial bajo la planificación gubernamental."
 ALG_FLN_state_led_development_idea: "Desarrollo de las semillas estatales"
 ALG_FLN_state_led_development_idea_desc: "El Estado desempeña un papel activo en la dirección del crecimiento económico de Argelia, haciendo hincapié en la infraestructura, la educación y el bienestar social para fortalecer la fundación de la nación."
 ALG_FLN_media_control_idea: "Código de l'Información"
 ALG_FLN_media_control_idea_desc: "El Código de Información establece el marco jurídico que rige las actividades de prensa y radiodifusión, permitiendo al Estado regular las operaciones mediáticas y orientar el espacio informativo nacional."
 ALG_FLN_national_security_council_idea: "Consejo Nacional de Seguridad"
 ALG_FLN_national_security_council_idea_desc: "Un poderoso consejo compuesto por oficiales militares, de inteligencia y altos supervisa la estabilidad interna y la estrategia nacional, garantizando la lealtad al gobierno del FLN."
 ALG_loyal_military_idea: "Leal militar"
 ALG_loyal_military_idea_desc: "Los militares siguen siendo leales al FLN, valorando el orden y la jerarquía sobre todo. Esta unidad viene con menor adaptabilidad y iniciativa de campo de batalla."
 ALG_loyal_military2_idea: "Cuerpo Militar Loyal"
 ALG_loyal_military2_idea_desc: "La lealtad del ejército se ha profundizado a través de la integración política y beneficios privilegiados, asegurando un poderoso y disciplinado aparato militar bajo el mando del gobierno."
 ALG_invest_in_youth_idea: "Invertir en la juventud"
 ALG_invest_in_youth_idea_desc: "Los programas para educar y emplear a la creciente población juvenil de Argelia darán forma al futuro del país, creando una nueva generación de profesionales y líderes."
 ALG_anti_corruption_campaign_idea: "Campaña contra la corrupción"
 ALG_anti_corruption_campaign_idea_desc: "El gobierno ha lanzado una campaña para erradicar la corrupción y los abusos burocráticos, con el objetivo de restablecer la confianza pública y mejorar la eficiencia del Estado."
 ALG_new_era_for_algeria_idea: "Una nueva era para Argelia"
 ALG_new_era_for_algeria_idea_desc: "Argelia entra en una nueva era de reforma y modernización, equilibrando la innovación y el progreso social con los desafíos de una economía mundial cambiante."
 ALG_open_market_idea: "Políticas de mercado abierto"
 ALG_open_market_idea_desc: "La liberalización gradual de la economía argelina invita a la inversión y al emprendimiento, en riesgo de reducir el control tradicional del Estado sobre las industrias clave."
 ALG_reform_education_system_idea: "Reforma del Sistema de Educación"
 ALG_reform_education_system_idea_desc: "Se están llevando a cabo reformas amplias para modernizar el sistema educativo, promover la innovación y armonizar las escuelas con las necesidades de una economía moderna argelina."
 ALG_reform_the_judicial_system_idea: "Reforma judicial"
 ALG_reform_the_judicial_system_idea_desc: "Se están realizando esfuerzos para modernizar el sistema judicial de Argelia, reducir la corrupción y establecer tribunales más justos que respeten el estado de derecho."
 ALG_free_media_idea: "Medios libres"
 ALG_free_media_idea_desc: "Los medios de comunicación independientes están empezando a florecer, proporcionando transparencia y rendición de cuentas, aunque esto también aumenta la crítica y el debate público."
 ALG_black_decade_lesson_idea: "Lecciones del Decenio Negro"
 ALG_black_decade_lesson_idea_desc: "El trauma de la guerra civil sigue persiguiendo a Argelia. La nación sigue siendo cautelosa, priorizando la seguridad sobre el riesgo, asegurando que esa inestabilidad nunca regrese."
 ALG_election_day: "Día de las elecciones"
 ALG_election_day_desc: "Ha llegado el momento de que los argelinos elijan su futuro. Si el FLN gobernante mantiene su control o los triunfos de la oposición darán forma al país durante décadas."
 ALG_FLN_path: "Victoria FLN"
 ALG_FLN_path_desc: "El FLN ha triunfado una vez más, manteniendo el control sobre el gobierno y la dirección del futuro de Argelia."
 ALG_FLN_preserve_system: "Preservar el sistema"
 ALG_FLN_preserve_system_desc: "El liderazgo del FLN no ve necesidad de cambios drásticos, preservando el orden existente garantiza estabilidad y continuidad."
 ALG_FLN_control_media: "Ley Orgánica No 12-05"
 ALG_FLN_control_media_desc: "Mediante la aprobación de la Ley Orgánica No 12-05 que regula la actividad informativa y mediática, el Estado puede dar forma a la narrativa nacional manteniendo al mismo tiempo un marco jurídico para la supervisión de la prensa."
 ALG_election_day_tt: "§YDesbloquea el camino hacia las elecciones presidenciales de Argelia en 2004.§!\nPronto tendrá que elegir entre el fallo §RFLN§! y la §YOposición§! para el futuro del país."
 ALG_ethnic_kabyle_tt: "§YLa población kabyle§! es mayor que §Y10%§!"
 ALG_kabyle_satisfaction_tt: "§YLa Satisfacción Kabyle§! es al menos §Y65§!"
 ALG_kabyle_satisfaction_70_tt: "§YLa Satisfacción Kabyle§! es mayor que §Y70§!"
 ALG_kabyle_satisfaction_60_tt: "§YLa Satisfacción Kabyle§! es al menos §Y60§!"
 ALG_fossil_fuel_industry: "Lobby Sonatrach"
 ALG_fossil_fuel_industry_desc: "El gigante energético de propiedad estatal Sonatrach y su red de contratistas forman una de las facciones más poderosas de Argelia. Defenden subvenciones, resisten la diversificación económica y mantienen estrechos vínculos con empresas extranjeras y gobiernos dependientes del petróleo y el gas argelino."
 ALG_the_military: "Ejército Nacional Popular (ANP)"
 ALG_the_military_desc: "El ejército argelino, el ANP, es la columna vertebral del estado. Actúa como guardián de la unidad y estabilidad nacionales, pero su dominio limita la reforma democrática. Equilibrando entre proteger a Argelia y restringir el gobierno civil, la ANP siempre es un jugador decisivo en política."
 ALG_industrial_conglomerates: "CEVITAL-MADAR"
 ALG_industrial_conglomerates_desc: "Los conglomerados industriales, dominados por gigantes como Cevital y Madar Holdings, representan la creciente élite empresarial oligárquica de Argelia. En estrecha relación con el poder político y a menudo interrelacionado con las familias militares y gobernantes, estos grupos buscan ganancias mediante la privatización, los bienes de consumo, los bienes raíces y el comercio exterior. Pueden proporcionar una inversión y un crecimiento muy necesarios, pero a costa de la corrupción, la desigualdad y la captura política."
 ALG_offices_contruction_speed: "Oficina de Construcción Velocidad"
 ALG_arms_factory_contruction_speed: "fábrica militar Construcción"
 ALG_civ_construction_speed: "fábrica civil Velocidad de construcción"
 ALG_population_energy_consumption: "Consumo de energía poblacional"
 ALG_civ_factory_workforce: "fábrica civil Los trabajadores necesitan"
 ALG_mil_factory_workforce: "fábrica militar Los trabajadores necesitan"
 ALG_office_workforce: "Trabajadores de oficina necesitados"
 ALG_military_modifier: "Fuerzas Armadas de Argelia"
 ALG_military_modifier_desc: "Representa las capacidades y reformas del ejército argelino."
 ALG_opposition_path: "El Camino de la Oposición"
 ALG_opposition_path_desc: "A medida que la oposición política gana impulso, el país se enfrenta a una opción: reforma desde dentro o riesgo caos. Ha llegado el momento de abrazar la transparencia y el progreso."
 ALG_OPP_free_elections: "Celebrar elecciones libres"
 ALG_OPP_free_elections_desc: "Durante demasiado tiempo, la voz de la gente ha sido muda. La verdadera democracia comienza con elecciones transparentes y justas."
 ALG_FLN_military_loyalty: "Seguridad de la lealtad militar"
 ALG_FLN_military_loyalty_desc: "El ejército es un pilar de estabilidad. Garantizar su lealtad evitará la confusión y asegurará el futuro de nuestra nación."
 ALG_FLN_public_works: "Lanzamiento de programas de obras públicas"
 ALG_FLN_public_works_desc: "Al invertir en infraestructura pública, ofrecemos empleos y renovamos la fe del pueblo en las instituciones gubernamentales."
 ALG_reform_armed_forces: "Reforma de las Fuerzas Armadas"
 ALG_reform_armed_forces_desc: "La modernización de la estructura militar garantizará eficiencia, disciplina y lealtad al Estado en lugar de a los individuos."
 ALG_counter_extremism: "Capacidades de lucha contra el terrorismo"
 ALG_counter_extremism_desc: "Las redes terroristas amenazan nuestra estabilidad nacional. Mediante el fortalecimiento de la inteligencia, las fuerzas de seguridad y los programas de prevención, podemos mejorar las capacidades antiterroristas de Argelia."
 ALG_regional_power: "A Potencia regional"
 ALG_regional_power_desc: "Con la estabilidad interna alcanzada, Argelia puede proyectar fortaleza y liderazgo en todo el norte de África y el Mediterráneo."
 ALG_expanding_the_power_grid: "Ampliar el Power Grid"
 ALG_expanding_the_power_grid_desc: "Un suministro de energía confiable es vital para el crecimiento económico. Ampliar la red de energía ayudará a la industria y al desarrollo rural."
 ALG_OPP_new_constitution: "Proyecto de una nueva Constitución"
 ALG_OPP_new_constitution_desc: "Una nueva constitución sentará las bases para la democracia, la igualdad y el gobierno civil."
 ALG_OPP_media_freedom: "Garantizar la libertad de prensa"
 ALG_OPP_media_freedom_desc: "La libertad de prensa es esencial para que los líderes rindan cuentas e informen al público sinceramente."
 ALG_OPP_judiciary_reform: "Reforma del poder judicial"
 ALG_OPP_judiciary_reform_desc: "Un poder judicial independiente y transparente es fundamental para garantizar la justicia de todos los ciudadanos, independientemente de su condición o influencia."
 ALG_OPP_education_first: "Educación Primera"
 ALG_OPP_education_first_desc: "Una nación moderna depende de una población bien educada. Invertir en escuelas y universidades dará forma a un futuro más brillante."
 ALG_OPP_open_market: "Abrir el mercado"
 ALG_OPP_open_market_desc: "Las reformas económicas y el comercio abierto atraerán la inversión y crearán oportunidades para los empresarios."
 ALG_OPP_new_era: "Una nueva era para Argelia"
 ALG_OPP_new_era_desc: "Después de años de lucha y reforma, Argelia entra en un nuevo capítulo de libertad, prosperidad y estabilidad."
 ALG_OPP_anti_corruption: "Lucha contra la corrupción"
 ALG_OPP_anti_corruption_desc: "La corrupción drena el potencial de la nación. Es hora de leyes estrictas, instituciones transparentes y rendición de cuentas en todos los niveles."
 ALG_OPP_invest_in_youth: "Invertir en la juventud"
 ALG_OPP_invest_in_youth_desc: "Los jóvenes son el alma de Argelia. Al empoderarlos a través de la educación y el empleo, aseguramos el futuro de la nación."
 ALG_OPP_state_first: "El Estado viene primero"
 ALG_OPP_state_first_desc: "En tiempos de cambio, la unidad y el interés nacional deben guiar cada política. La integridad del estado viene antes de ganar partidista."
 ALG_terror_2013_in_amenas_title: "2013 En Amenas Crisis de Hostage"
 ALG_terror_2013_in_amenas_desc: "Un grupo de militantes armados vinculados a organizaciones extremistas lanzó un asalto sorpresa contra la instalación de gas In Amenas en el sur de Argelia. Los atacantes incautaron a cientos de rehenes, incluyendo trabajadores extranjeros, desencadenando una crisis internacional. El ejército argelino rápidamente rodeaba el lugar, conduciendo a un enfrentamiento sangriento que impactaba al mundo y planteaba preguntas acerca de la capacidad del gobierno para manejar el terrorismo en las regiones del desierto."
 ALG_terror_2013_placeholder_option: "Nuestras fuerzas responden con decisión."
 ALG_terror_2013_low_tt: "Un malestar menor contenía. §GEstabilidad mejora ligeramente.§!"
 ALG_terror_2013_medium_tt: "La situación empeora, alimentando §ORadicalization§! y reduciendo §Rstability§!."
 ALG_terror_2013_high_tt: "El ataque está fuera de control. §RLa estabilidad nacional se desploma§! como §O Los insurgentes radicales §! ganan terreno."
 ALG_healthcare_reform_tt: "§YLa insatisfacción pública§! debe estar por debajo de §Y40§! para comenzar la reforma sanitaria."
 ALG_education_reform_tt: "§YLa insatisfacción pública§! debe estar por debajo de §Y40§! para comenzar la reforma educativa."
 ALG_unemployment_reform_tt: "§YLa insatisfacción pública§! debe estar por debajo de §Y40§! para comenzar la reforma del desempleo."
 ALG_employment_TT: "§HEl desempleo§! es inferior a §H20%§!"
 ALG_grand_mosque: "La Gran Mezquita de Argel"
 ALG_grand_mosque_desc: "Un símbolo del avivamiento espiritual y cultural de Argelia, la Gran Mezquita de Argel es una de las mezquitas más altas y magníficas del mundo. Su construcción no sólo demuestra la ambición arquitectónica de la nación, sino que también sirve como un faro del patrimonio y la unidad islámicos. Completar este proyecto monumental fortalecerá el orgullo nacional y proyectará la influencia de Argelia en todo el mundo musulmán."
 ALG_big_cities_or_rising_states: "Programa de Desarrollo Urbano o Regional"
 ALG_big_cities_or_rising_states_desc: "Siguiendo el programa de recuperación después de la guerra, el gobierno debe decidir su próximo paso, ¿deberíamos concentrar recursos en las principales ciudades costeras para fortalecer la columna vertebral industrial de Argelia, o elevar las regiones del interior y del desierto para lograr un crecimiento nacional equilibrado?"
 ALG_focus_on_big_cities: "Enfoque sobre Ciudades Mayores"
 ALG_focus_on_big_cities_desc: "Centros urbanos como Argel, Oran y Constantino son los motores de la economía argelina. Al centrar nuestros esfuerzos en el desarrollo, podemos modernizar nuestra infraestructura y mejorar la productividad."
 ALG_rising_states_program: "Programa de los Estados en aumento"
 ALG_rising_states_program_desc: "Mientras las ciudades costeras prosperan, las regiones interiores se quedaron atrás. El Programa de los Estados Crecientes tiene por objeto llevar carreteras, escuelas e industrias al corazón de Argelia, asegurando que ninguna provincia se deje atrás."
 ALG_develop_atlas: "Desarrollar el Atlas de Argelia"
 ALG_develop_atlas_desc: "Las regiones montañosas del Atlas tienen un gran potencial para la agricultura y la pequeña industria. La inversión aquí mejorará los niveles de vida locales y creará seguridad alimentaria a largo plazo."
 ALG_develop_kabylia: "Ampliar la región de Kabylia"
 ALG_develop_kabylia_desc: "Kabylia tiene una fuerte identidad cultural y gente industrial. El desarrollo de su infraestructura y oficinas fortalecerá tanto el orgullo regional como la unidad nacional."
 ALG_develop_aures: "Crecimiento agrícola en el Aurès"
 ALG_develop_aures_desc: "Las montañas de Aurès son el hogar de vastas tierras agrícolas y comunidades trabajadoras. La modernización de la producción agrícola reducirá la pobreza rural y estabilizará el suministro de alimentos."
 ALG_expand_oran: "Ampliar la Zona Industrial de Oran"
 ALG_expand_oran_desc: "Oran es una de las ciudades industriales y portuarias más importantes de Argelia. Ampliar su zona industrial creará nuevos puestos de trabajo e impulsará las exportaciones."
 ALG_expand_algiers: "Modernizar Argel"
 ALG_expand_algiers_desc: "Como el corazón de Argelia, los Argel deben seguir evolucionando. Nuevas oficinas, infraestructura y reformas urbanas la transformarán en un modelo de capital del norte de África."
 ALG_expand_constantine: "Invertir en Constantine"
 ALG_expand_constantine_desc: "La larga historia de la educación y la cultura de Constantine lo convierte en un centro ideal para el aprendizaje e innovación superiores. Invertir aquí creará una nueva generación de pensadores e ingenieros argelinos."
 ALG_develop_tamanrasset: "Desarrollar la infraestructura de Tamanrasset"
 ALG_develop_tamanrasset_desc: "En lo profundo del Sahara, Tamanrasset es la clave de la logística sur de Argelia. Carreteras, nodos de suministro e infraestructura de comunicación conectarán el desierto al norte."
 ALG_develop_mzab: "Potenciar el valle de Mzab"
 ALG_develop_mzab_desc: "La región de Mzab tiene un espíritu resiliente y crecientes necesidades energéticas. La construcción de nuevas centrales eléctricas proporcionará electricidad y empleo para la población local."
 ALG_develop_granderg: "Explotar los recursos del Gran Erg"
 ALG_develop_granderg_desc: "El Gran Erg Occidental puede parecer vacío, pero su riqueza subterránea cuenta otra historia. Desarrollar sitios de extracción de petróleo fortalecerá la posición de Argelia como productor de energía."
 ALG_FIS.1.t: "El regreso del Ulema"
 ALG_FIS.1.d: "Dentro del Frente Islámico de Salvación, ha surgido un intenso debate sobre la dirección de nuestro movimiento. Los eruditos de Wahhabi, inspirados en interpretaciones sauditas estrictas, piden una purificación completa del islam argelino y la política de lo que ven como innovaciones corruptas. Mientras tanto, el tradicional Ulema de Argelia aboga por un retorno a la orientación espiritual y la reforma nacional dentro de un marco islámico más tolerante.\n\nNuestra elección definirá el alma del movimiento."
 ALG_FIS.1.a: "Sigue al Wahhabi Ulema. Purificar y fortalecer la fe"
 ALG_FIS.1.b: "Apoya el Ulema Tradicional. Reforma y Guía de la Nación"
 ALG_FIS.2.t: "El futuro del Frente Islámico de Salvación"
 ALG_FIS.2.d: "En 1991, tras las manifestaciones masivas dirigidas por el Frente Islámico de Salvación (FIS), las autoridades argelinas respondieron con fuerza, marcando uno de los puntos de inflexión más sangrientos en la historia moderna del país. El fundador del movimiento, Abbasi Madani, fue condenado a quince años de prisión después de los acontecimientos de junio, durante los cuales el ejército y la policía dispersaron violentamente a miles de partidarios del FIS. El general Khaled Nezzar ordenó el arresto de Madani e impuso un estado de emergencia destinado a desmantelar al partido y suprimir la influencia islamista. La represión dio lugar al caos, las bajas civiles y la disolución de cualquier esperanza de reforma pacífica, una chispa que encendió la devastadora guerra civil argelina, más tarde conocida como el Decenio Negro. Con Abbasi Madani encarcelado y el liderazgo de la FIS disperso, han surgido nuevas figuras dentro del movimiento. Ahora, como nuestra influencia resuena silenciosamente, se plantea la pregunta, ¿quién nos guiará a través de esta era de sangre y sacrificio hacia una nueva visión para Argelia?"
 ALG_FIS.2.a: "Nombra al Co-Founder y Voz del Pueblo. Ali Belhadj"
 ALG_FIS.2.b: "Abraza el Camino de la Lucha. Abdelhak Layada, fundador del GIA"
 ALG_ps_victory: "Victoria del Frente Popular de Salvación"
 ALG_ps_victory_desc: "El Frente Islámico de Salvación ha triunfado. Argelia se encuentra en una encrucijada, entre la fe y el orden, entre la mezquita y los cuarteles. Ahora debemos consolidar este nuevo amanecer del poder."
 ALG_consolidate_power: "Consolidar el Nuevo Orden"
 ALG_consolidate_power_desc: "El poder debe estar garantizado en todos los niveles de la sociedad. El partido, el ulema y los grupos armados deben servir ahora un solo propósito, la preservación de nuestra regla."
 ALG_national_reconstruction: "Reconstrucción nacional"
 ALG_national_reconstruction_desc: "Nuestra nación devastada por la guerra debe ser reconstruida de las ruinas. La reconstrucción requerirá tanto la fe como el pragmatismo, ya que restauramos la industria y la confianza pública."
 ALG_religious_reconciliation: "Reconciliación religiosa"
 ALG_religious_reconciliation_desc: "Las divisiones entre los eruditos islámicos de Argelia amenazan nuestra unidad. Debemos reconciliar nuestras diferencias y crear una base religiosa unificada para el nuevo estado."
 ALG_crackdown_purges: "Crackdowns y Purges"
 ALG_crackdown_purges_desc: "Para mantener el poder, debemos eliminar la oposición. Los restos del viejo régimen, los oficiales seculares y las facciones disidentes deben ser purgados."
 ALG_unify_parties: "Unificar los movimientos islámicos"
 ALG_unify_parties_desc: "Los diversos grupos islamistas que apoyaron nuestro ascenso deben ahora ser llevados bajo una bandera. La unidad de la Ummah comienza en casa."
 ALG_infrastructure_crash: "Restauración de la infraestructura"
 ALG_infrastructure_crash_desc: "La guerra civil dejó nuestra infraestructura en ruinas. Pondremos en marcha programas de emergencia para restaurar carreteras, puentes y utilidades."
 ALG_industry_investment: "Inversiones industriales"
 ALG_industry_investment_desc: "Para mantener la recuperación a largo plazo, debemos invertir en la industria nacional y apoyar a los empresarios locales guiados por principios económicos islámicos."
 ALG_madrasa_reforms: "Reformas de Madrasa"
 ALG_madrasa_reforms_desc: "La educación debe ajustarse tanto a las necesidades modernas como a los valores religiosos. Reformar nuestras madrasas asegurará una nueva generación de eruditos e ingenieros basados en la fe."
 ALG_community_outreach: "Programas de extensión comunitaria"
 ALG_community_outreach_desc: "Fortaleceremos nuestra conexión con las comunidades locales mediante iniciativas sociales, promoviendo la unidad y la solidaridad bajo los valores islámicos."
 ALG_internal_security: "Aparato de seguridad interna"
 ALG_internal_security_desc: "Debemos establecer una red de seguridad interna leal para suprimir el malestar y proteger la revolución desde dentro."
 ALG_intelligence_network: "Islammic Intelligence Bureau"
 ALG_intelligence_network_desc: "Un servicio de inteligencia eficaz nos permitirá anticipar amenazas y neutralizar las conspiraciones antes de que puedan echar raíces."
 ALG_transport_upgrade: "Modernización del transporte"
 ALG_transport_upgrade_desc: "Los sistemas de transporte modernos acelerarán el comercio, mejorarán la movilidad y vincularán las regiones de Argelia más estrechamente que nunca."
 ALG_energy_program: "Programa nacional de energía"
 ALG_energy_program_desc: "El desarrollo de fuentes de energía renovables y convencionales proporcionará la columna vertebral para la nueva economía de Argelia."
 ALG_scholastic_centers: "Centros de investigación escolásticos"
 ALG_scholastic_centers_desc: "Nuestros estudiosos y científicos trabajarán de lado a lado para promover tanto el conocimiento islámico como la ciencia moderna para el progreso nacional."
 ALG_social_welfare: "Ampliación del bienestar social"
 ALG_social_welfare_desc: "Nos ocuparemos de los pobres, los viudos y los desplazados, asegurando todos los beneficios argelinos de las bendiciones de nuestra gobernanza basada en la fe."
 ALG_military_rebuild: "Reconstruye al Ejército de la Fe"
 ALG_military_rebuild_desc: "El ejército debe reconstruirse y purificarse de la corrupción. Un militar disciplinado defenderá la revolución y la nación."
 ALG_garrison_restructure: "Reestructuración de guarnición"
 ALG_garrison_restructure_desc: "Debemos reorganizar nuestras guarniciones para garantizar la lealtad, eficiencia y preparación contra amenazas externas o internas."
 ALG_factory_output: "Ampliación de los productos industriales"
 ALG_factory_output_desc: "Nuestras inversiones están pagando. Las fábricas ahora funcionarán a plena capacidad para impulsar el crecimiento económico."
 ALG_oil_and_minerals: "Desarrollo de aceite y minerales"
 ALG_oil_and_minerals_desc: "Los abundantes recursos naturales de Argelia son un don divino. Los aprovecharemos responsablemente para garantizar la independencia energética."
 ALG_religious_council: "Establecer el Consejo Religioso"
 ALG_religious_council_desc: "Un consejo supremo de ulema guiará la dirección moral y espiritual de la nación, asegurando que cada ley se ajuste a Sharia."
 ALG_national_cohesion: "Cohesión nacional"
 ALG_national_cohesion_desc: "Mediante el bienestar y la fe, curaremos las divisiones de guerra y forjaremos una nueva identidad argelina unida."
 ALG_border_defences: "Reforzar las fronteras"
 ALG_border_defences_desc: "Nuestras fronteras deben ser fortificadas contra la infiltración y el contrabando. Los enemigos de la revolución están más allá y dentro."
 ALG_strategic_reserves: "Programa de reservas estratégicas"
 ALG_strategic_reserves_desc: "Almacenaremos suministros y ampliaremos nuestras reservas para asegurar la resistencia en tiempos de guerra o inestabilidad económica."
 ALG_heavy_industry: "Desarrollo de la industria pesada"
 ALG_heavy_industry_desc: "Empujaremos nuestra base industrial más allá de los bienes de consumo, centrándonos en maquinaria pesada, acero y producción de armas."
 ALG_international_trade: "Ampliación del comercio internacional"
 ALG_international_trade_desc: "Al negociar con naciones amigas del mundo islámico, Argelia puede convertirse en un centro de comercio impulsado por la fe."
 ALG_cultural_influence: "Iniciativa de influencia cultural"
 ALG_cultural_influence_desc: "Exportaremos nuestra cultura, nuestra fe y nuestro ejemplo, difundiendo el modelo argelino de renacimiento islámico."
 ALG_welfare_programs: "Programas de Bienestar"
 ALG_welfare_programs_desc: "Las iniciativas integrales de bienestar fortalecerán nuestra legitimidad y protegerán a los vulnerables."
 ALG_army_of_salvation: "Ejército de Salvación"
 ALG_army_of_salvation_desc: "El Ejército de Salvación será el escudo del Islam y la espada de Argelia, disciplinada, fiel e inquebrantable."
 ALG_nation_energy_independence: "Independencia energética nacional"
 ALG_nation_energy_independence_desc: "Con nuestra energía totalmente bajo control interno, nos liberaremos de la dependencia extranjera."
 ALG_international_outreach: "Proyección islámica internacional"
 ALG_international_outreach_desc: "Extenderemos nuestra mano al mundo islámico, construyendo puentes con movimientos y naciones que comparten nuestra visión."
 ALG_regional_leadership: "Liderazgo regional"
 ALG_regional_leadership_desc: "Argelia se afirmará como líder político, religioso y económico en el norte de África y más allá."
 ALG_technological_renaissance: "Renacimiento tecnológico"
 ALG_technological_renaissance_desc: "La fe y la ciencia no son enemigos. Dirigiremos una nueva era de avance tecnológico guiado por la ética islámica."
 ALG_islamic_coalition: "Forma la Coalición Islámica"
 ALG_islamic_coalition_desc: "La unidad de la Ummah debe ser restaurada mediante la cooperación. Argelia dirigirá una coalición de naciones islámicas hacia la prosperidad mutua."
 ALG_grand_strategy: "La Gran Estrategia"
 ALG_grand_strategy_desc: "Nuestra nación ahora es fuerte, militarmente, económica y espiritual. Es hora de trazar una visión a largo plazo para nuestra civilización."
 ALG_final_salvation: "Salvación final"
 ALG_final_salvation_desc: "El paso final en nuestro viaje, para crear una sociedad totalmente guiada por la ley divina y la fuerza moral."
 FIS_rust_belt_rejuvenation: "Rejuvenecimiento de la correa"
 FIS_rule_to_perfection: "Regla a la perfección"
 FIS_new_islamic_architecture: "Nueva arquitectura islámica"
 FIS_prioritize_military_industries: "Prioridad de las industrias militares"
 FIS_industrialize_the_umma: "Industrializar el Ummah"
 ALG_fis_win: "Victoria del Frente Islámico de Salvación"
 ALG_fis_win_desc: "Mediante la perseverancia, la unidad y la guía divina, el Frente Islámico de Salvación ha triunfado sobre sus adversarios. El camino por delante es uno de gobernanza espiritual y renovación. Un nuevo capítulo comienza para Argelia, uno definido por la fe, la justicia y la voluntad de Alá."
 ALG_fis_win_tt: "§Y Abre el Frente Islámico de Salvación (FIS) Enfoque Árbol§!"
 ALG_FIS_return: "Retorno del Frente Islámico de Salvación"
 alg_politics_news.1.t: "Abdallah Djaballah Establece el FJD"
 alg_politics_news.1.d: "Abdallah Djaballah, ex líder del Movimiento por la Reforma Nacional (Islah) y fundador de Ennahda, ha anunciado la creación de un nuevo partido político, el Frente para la Justicia y el Desarrollo (FJD). Partiendo de la inspiración del Partido de Justicia y Desarrollo de Turquía (AKP), el FJD busca fusionar principios islámicos con moderación política y desarrollo nacional. El movimiento pretende renovar la confianza pública en la política islamista haciendo hincapié en la justicia, la reforma y la gobernanza ética en la era post-guerra civil de Argelia."
 alg_politics_news.1.a: "Un nuevo movimiento islamista entra en la etapa política de Argelia."
 algerian.1.t: "Solicitud argelina de inversión en infraestructura"
 algerian.1.d: "El gobierno argelino nos ha abordado con una propuesta para financiar la construcción de carreteras agrícolas a mercados e infraestructura rural. Esta inversión mejoraría la distribución agrícola y la capacidad industrial en Argelia, al tiempo que nos permitiría ampliar nuestra influencia política y económica. Sin embargo, la iniciativa requeriría una contribución financiera de nuestro tesorería."
 algerian.1.a: "Fondo del Proyecto de Infraestructura"
 algerian.1.b: "Disminución de la solicitud"
 algerian.4.t: "Cooperación en materia de infraestructura aprobada"
 algerian.4.d: "Túnez ha acordado apoyar nuestra iniciativa de infraestructura agrícola a mercado. La inversión fortalecerá nuestra economía rural y capacidad industrial al tiempo que mejorará las relaciones bilaterales."
 algerian.4.a: "Un paso adelante para nuestra economía"
 algerian.5.t: "Rechazado de la financiación de infraestructura"
 algerian.5.d: "Túnez se ha negado a financiar nuestra iniciativa de infraestructura propuesta. Sin apoyo extranjero, se retrasará el desarrollo de carreteras agrícolas a mercados y proyectos conexos."
 algerian.5.a: "Nos las arreglaremos por nuestra cuenta"
 algeria_news.30.t: "El levantamiento de la primavera negra"
 algeria_news.30.d: "Después de años de disturbios en la región de Kabyle, usted debe decidir cómo responder a las crecientes demandas de la población bereber."
 algeria_news.30.a: "Conceder plena independencia a los Kabyles"
 algeria_news.30.b: "Conceder autonomía a los Kabyles"
 algeria_news.30.c: "Suprimir el levantamiento"
 algeria_news.30_a_tt: "Elegir este camino creará un estado independiente de Kabyle. Estabilidad aumenta, se gana el poder político."
 algeria_news.30_b_tt: "Elegir la autonomía otorga a los Kabyles una autoregla limitada (Barbacha). Estabilidad aumenta moderadamente y se gana el poder político."
 algeria_news.30_c_tt: "La presión de los Kabyles disminuirá la estabilidad y el apoyo a la guerra, pero ganarás un poco de poder político."
 AlgeriaFocusEvents.43.t: "Invitación al Consejo de los Mundos Islámicos"
 AlgeriaFocusEvents.43.d: "El liderazgo de [Root.GetName] ha recibido una invitación oficial para unirse al Consejo de Mundos Islámicos. Los miembros fortalecerían la cooperación económica entre las naciones islámicas, abrirían nuevas oportunidades comerciales y reforzaríamos nuestra alineación política común. Sin embargo, unirse puede distanciarnos de bloques económicos no islámicos."
 AlgeriaFocusEvents.43.a: "Únase al Consejo"
 AlgeriaFocusEvents.43.b: "Decline la invitación"
 AlgeriaFocusEvents.41.t: "Invitación al Consejo de los Mundos Islámicos"
 AlgeriaFocusEvents.41.d: "Argelia nos ha invitado oficialmente a sumarnos al Consejo de los Mundos Islámicos. La propuesta hace hincapié en la cooperación económica, la coordinación política y el fortalecimiento de los vínculos entre las naciones islámicas. Aceptar podría mejorar nuestra posición regional, mientras que la negativa puede poner fin a las relaciones."
 AlgeriaFocusEvents.41.a: "Esta es una buena idea."
 AlgeriaFocusEvents.41.b: "No estamos interesados"
 AlgeriaFocusEvents.411.t: "Iraq rechaza la invitación"
 AlgeriaFocusEvents.411.d: "El Gobierno iraquí ha rechazado cortésmente nuestra invitación a unirse al Consejo de Mundos Islámicos, citando consideraciones estratégicas y prioridades nacionales."
 AlgeriaFocusEvents.411.a: "Infortunada, pero señalada"
 AlgeriaFocusEvents.42.t: "Invitación al Consejo de los Mundos Islámicos"
 AlgeriaFocusEvents.42.d: "Hemos recibido una respuesta oficial en relación con nuestra iniciativa de ampliar el Consejo de los Mundos Islámicos. La nación invitada está considerando si se alinea económica y políticamente con el CIW."
 AlgeriaFocusEvents.42.a: "Bienvenidos al Consejo"
 AlgeriaFocusEvents.42.b: "Se han negado."
 AlgeriaFocusEvents.421.t: "Invitación rechazada"
 AlgeriaFocusEvents.421.d: "El país invitado ha disminuido la participación en el Consejo de los Mundos Islámicos. Nuestros esfuerzos diplomáticos tendrán que ser redirigidos en otros lugares."
 AlgeriaFocusEvents.421.a: "Muy bien."
 AlgeriaFocusEvents.81.t: "Invitación a la Alianza CIW"
 AlgeriaFocusEvents.81.desc: "Hemos recibido una invitación para unirse a la alianza del Consejo de los Mundos Islámicos. La propuesta promete un aumento de la cooperación y el apoyo mutuo, aunque puede requerir concesiones a cambio."
 AlgeriaFocusEvents.81.a: "Sólo con garantías a cambio"
 AlgeriaFocusEvents.81.b: "Absolutamente no"
 ALG_power_struggle_resistance_dominant: "§REl pueblo está desafiando abiertamente al régimen§!"
 ALG_power_struggle_army_dominant: "§BEl ejército controla firmemente la situación§!"
 ALG_power_struggle_resistance_rising: "§YLa presión popular está aumentando contra el Establecimiento§!"
 ALG_power_struggle_army_rising: "§YEl ejército reafirma su dominio sobre el poder§!"
 ALG_power_struggle_stable: "§WUn frágil equilibrio sostiene para ahora§!"
 ALG_west_alignment_tt: "Formalizar la asociación estratégica con Estados Unidos y profundizar los vínculos con la OTAN y la UE. Esto otorga acceso a la tecnología occidental y a la inversión, pero puede poner fin a las relaciones con China y Rusia."
 ALG_china_alignment_tt: "Profundizar la cooperación con China en el marco de la Iniciativa Franja y la Ruta. Se espera una inversión importante en infraestructura y un crecimiento comercial, pero los poderes occidentales serán cuidadosos."
 alg_crackdown.1.t: "Protestas Erupción en Argel"
 alg_crackdown.1.d: "El arresto de figuras de la oposición ha provocado manifestaciones callejeras. Los manifestantes exigen una reforma política y un fin a la represión."
 alg_crackdown.1.a: "Aplastar las protestas."
 alg_crackdown.1.b: "Liberar a algunos detenidos."
 alg_crackdown.2.t: "Strikes and Demonstrations a nivel nacional"
 alg_crackdown.2.d: "La prohibición de los partidos de oposición ha provocado un movimiento de masas que recuerda a las protestas de Hirak. El país está paralizado."
 alg_crackdown.2.a: "Despliegue el ejército."
 alg_crackdown.2.b: "Abrir el diálogo y revocar la prohibición."
 democratic_reforms: "Proceso de reforma democrática"
 ALG_healthcare_success_tt: "Nuestras reformas sanitarias mejorarán la salud pública y reducirán las quejas."
 ALG_healthcare_failure_tt: "La falta de reforma sanitaria profundizará el enojo público y fortalecerá la posición política del ejército."
 ALG_education_success_tt: "La reforma educativa modernizará nuestra fuerza laboral y reducirá el descontento."
 ALG_education_failure_tt: "La crisis educativa continúa. Aumenta la frustración pública."
 ALG_unemployment_success_tt: "Los programas de creación de empleo reducirán el desempleo y estabilizarán al país."
 ALG_unemployment_failure_tt: "La falta de atención al desempleo provocará huelgas y disturbios."
 ALG_tamazgha.1.t: "Invitación de Tamazgha"
 ALG_tamazgha.1.d: "El gobierno de [FROM.GetName], ahora remarcado como 'Tamazgha', nos ha contactado con una propuesta para formar una nueva alianza regional basada en el patrimonio común y la cooperación cultural del Amazigh. Afirman que esta confederación proporcionará desarrollo económico mutuo, seguridad y un rechazo de estructuras panárabes anticuadas como la Liga Árabe.\n\nMientras que algunos de nuestros gobiernos consideran esto como una oportunidad histórica, otros cuestionan las intenciones de Tamazgha y los objetivos a largo plazo."
 ALG_tamazgha.1.a: "Nos uniremos a la Confederación Tamazgha."
 ALG_tamazgha.1.b: "Esta no es nuestra pelea."
 ALG_election_time_idea: "Engranaje para las próximas elecciones"
 ALG_casablanca_decisions: "Iniciativa Casablanca"
 ALG_casablanca_decisions_desc: "Opciones diplomáticas para presionar a Marruecos sobre el Sáhara Occidental a través de la Unión Africana o de canales internacionales."
 ALG_casablanca_mission_tt: "Iniciar la misión de la Iniciativa Casablanca. Requiere que primero seleccione un enfoque. Misión corre por 180 días y produce un resultado bajo/medio/alto."
 ALG_casablanca_mission_desc: "Iniciar el impulso diplomático con plazo limitado. El resultado determina si la presión de la UA puede retirar las reclamaciones de Marruecos o (con un gran éxito) retirar núcleos."
 ALG_casablanca_approach_tt: "Elija un enfoque estratégico para la Iniciativa Casablanca. Sólo se puede elegir un enfoque; luego comenzar la ficha de misión para llevar a cabo la campaña."
 ALG_casablanca_approach_great_powers: "Tribunal de Grandes Poderes"
 ALG_casablanca_approach_great_powers_desc: "Pasar el poder político cortejar las principales potencias (US/España/Rusia). Mayor posibilidad de producir una presión decisiva de la UA, pero costosa y políticamente arriesgada."
 ALG_casablanca_approach_regional: "Sólo regional Enfoque"
 ALG_casablanca_approach_regional_desc: "Apoyarse en socios regionales y evitar la influencia de las grandes potencias. Más barato y menos arriesgado, pero menos probable de lograr resultados decisivos."
 ALG_casablanca_approach_mixed: "Estrategia mixta"
 ALG_casablanca_approach_mixed_desc: "Combinar presión regional e internacional. Costo y probabilidades equilibrados."
 ALG_morocco.2.t: "Presión de la UA/ONU sobre Marruecos"
 ALG_morocco.2.d: "Tras la campaña diplomática de Argelia en la Unión Africana y las Naciones Unidas, Marruecos enfrenta presión internacional sobre el Sáhara Occidental. ¿El reino cumplirá con las demandas, o resistirá y arriesgará sanciones?"
 ALG_morocco.2.a: "Completo bajo presión"
 ALG_morocco.2.b: "Resistir la presión, las sanciones de riesgo"
 Algeria_events.5.t: "Exitosa Campaña Anti-Poaching"
 Algeria_events.5.desc: "Gracias a nuestros esfuerzos coordinados, cientos de animales en peligro han sido protegidos en los últimos meses. Esto no sólo ha reducido la caza ilegal sino que también ha ayudado a preservar los frágiles ecosistemas desérticos, lo que ha frenado los efectos de la desertificación en las regiones afectadas."
 Algeria_events.5.a: "Excelente"
 Algeria_events.6.t: "Campaña sin éxito contra la lucha"
 Algeria_events.6.desc: "A pesar de nuestros intentos de proteger la vida silvestre, los cazadores furtivos continúan sus actividades como siempre. El ecosistema del desierto sigue siendo amenazado, y nuestra campaña ha tenido poco efecto en la lucha contra la desertificación o la caza ilegal."
 Algeria_events.6.a: "¡Todo ese esfuerzo desperdiciado!"
 ALG_ethnic_arab_display: "Arabs: [?ALG_ethnic_arab]%"
 ALG_ethnic_kabyle_display: "Kabyle: [?ALG_ethnic_kabyle]%"
 ALG_kabyle_content: "Cooperación Kabyle"
 ALG_kabyle_content_desc: "El pueblo kabyle, con sus niveles de educación tradicionalmente altos, contribuye con entusiasmo al desarrollo y la investigación nacionales."
 ALG_kabyle_discontent: "Movimiento de autonomía Kabyle"
 ALG_kabyle_discontent_desc: "Los activistas de Kabyle están organizando protestas que exigen el reconocimiento de Tamazight y una mayor autonomía regional. La sombra de los telares de la Primavera Negra."
 ALG_kabyle_unrest: "Crisis de Kabylie"
 ALG_kabyle_unrest_desc: "La región de Kabyle está en abierta revuelta. Las protestas, huelgas y desobediencia civil están paralizando la región. Es necesaria una acción urgente."
 ALG_black_spring_happened: "Manantial Negro corrió"
 ALG_has_conducted_census: "Ha llevado a cabo el censo nacional"
 ALG_ethnic_system_active: "Etnicas Establecidas"
 ALG_can_enact_ethnic_policy: "Puede promulgar una nueva política étnica"
 algeria_power_balance: "Lucha política argelina"
 algeria_old_guard: "Le Pouvoir (antiguo guardia)"
 algeria_reformists: "Movimiento de Hirak (Reformistas)"
 algeria_compromise_range: "Frágil Compromiso"
 algeria_compromise_range_desc: "Ninguno domina. Un estancamiento incómodo persiste mientras ambas facciones maniobran por ventaja."
 old_guard_leaning: "Vieja influencia de la Guardia"
 old_guard_leaning_desc: "El establecimiento militar comienza a reafirmar su dominio tradicional."
 old_guard_partial_control: "Antigua Consolidación de la Guardia"
 old_guard_partial_control_desc: "Le Pouvoir apreta su agarre. Las voces reformistas están marginadas."
 old_guard_strong_control: "Drift autoritario"
 old_guard_strong_control_desc: "El aparato de seguridad domina la vida política. Las instituciones democráticas se erosionan."
 old_guard_full_control: "Militares"
 old_guard_full_control_desc: "Le Pouvoir controla Argelia con un puño de hierro. Las libertades civiles están severamente restringidas."
 reformists_leaning: "Crianzas reformistas"
 reformists_leaning_desc: "La sociedad civil crece más audaz. El espíritu de Hirak revive."
 reformists_gaining_ground: "Reforma Momentum"
 reformists_gaining_ground_desc: "El movimiento de reforma gana fuerza. El viejo guardia lucha por mantener el control."
 reformists_strong_momentum: "Oleaje democrático"
 reformists_strong_momentum_desc: "Los reformistas dominan el discurso público. El cambio real parece posible."
 reformists_victory: "Transición democrática"
 reformists_victory_desc: "Argelia abraza el gobierno civil y el pluralismo. El agarre de Le Pouvoir está roto."
 ALG_political_struggle: "Lucha política argelina"
 ALG_political_struggle_desc: "La batalla entre el antiguo guardia y los reformistas dará forma al futuro de Argelia.\nSaldo actual: [ALG_power_struggle_state]\nAgarre militar: [ALG_army_grip_text]\nPeregrinancia pública: [ALG_grievance_text]"
 ALG_power_struggle_state: "Situación política"
 ALG_boost_reformists_tt: "Canalizar recursos a políticos reformistas y grupos de la sociedad civil.\nDesplaza el equilibrio hacia los reformistas en §G+0.15§!."
 ALG_boost_old_guard_tt: "Reforzar el apoyo entre los veteranos militares y el aparato de seguridad.\nDesplaza el equilibrio hacia la vieja guardia en §R-0.15§!."
 ALG_rally_students_tt: "Movilizar a los movimientos estudiantiles y activistas juveniles a favor de la reforma.\nDesplaza el equilibrio hacia los reformistas en §G+0.08§!."
 ALG_mobilize_veterans_tt: "Reunir a los veteranos de la guerra de independencia y a oficiales retirados.\nDesplaza el equilibrio hacia la vieja guardia en §R-0.08§!."
 ALG_bribe_elites_tt: "Utilice el patrocinio para asegurar la lealtad de élite.\nCambios de equilibrio hacia la vieja guardia por §R-0.05§!.\nCostos §R30§! de tesorería. Riesgos que alimentan la corrupción."
 ALG_compromise_tt: "Intercambiar un acuerdo de participación en el poder entre los reformistas y la vieja guardia.\nSe mueve el equilibrio hacia el centro por §W ±0.08§!."
 ALG_media_campaign_reform_tt: "Lanzar una campaña mediática que promueva los valores democráticos.\nDesplaza el equilibrio hacia los reformistas en §G+0.05§!."
 ALG_security_crackdown_tt: "Autorizar a las fuerzas de seguridad a reprimir la disidencia.\nDesplaza el equilibrio hacia la vieja guardia en §R-0.05§!."
 ALG_world_tension_security_tt: "La inestabilidad global justifica un aparato de seguridad más fuerte.\nDesplaza el equilibrio hacia la vieja guardia en §R-0.08§!."
 ALG_world_tension_high_security_tt: "Las graves tensiones globales exigen medidas de seguridad extraordinarias.\nDesplaza el equilibrio hacia la vieja guardia en §R-0.12§!."
 ALG_crackdown_momentum_tt: "Nuestra política de represión refuerza la posición del viejo guardia.\nCambios de equilibrio hacia la vieja guardia por §R-0.10§!."
 ALG_reconciliation_momentum_tt: "Nuestro enfoque de reconciliación permite a las voces reformistas.\nCambios de equilibrio hacia los reformistas por §G+0.10§!."
 ALG_oil_patronage_tt: "Utilice los ingresos del petróleo para financiar redes de patrocinio.\nCambios de equilibrio hacia la vieja guardia por §R-0.06§!.\nCostos §R25§! de tesorería pero aumenta la estabilidad."
 ALG_economic_reforms_tt: "Aplicar medidas de liberalización económica y transparencia.\nDesplaza el equilibrio hacia los reformistas en §G+0.08§!."
 ALG_elite_patronage: "Redes de patrocinio de élite"
 ALG_elite_patronage_desc: "Estamos comprando estabilidad a través del patrocinio, pero esto profundiza la corrupción y drena recursos."
 alg_politics.10.t: "Las conversaciones de compromiso"
 alg_politics.10.d: "Representantes de ambas facciones se han reunido en secreto. Se ha alcanzado un compromiso - pero ambas partes lo honrarán?"
 alg_politics.10.a: "Aceptar el acuerdo"
 alg_politics.10.b: "Rechazar y continuar la lucha"
 alg_politics.20.t: "Los reformistas aprovechan el poder"
 alg_politics.20.d: "El movimiento reformista ha alcanzado una masa crítica. El viejo guardia se enfrenta a una elección: paso a un lado o lucha."
 alg_politics.20.a: "Aceptar la transición democrática"
 alg_politics.20.b: "El ejército no se rendirá."
 alg_politics.21.t: "Un golpe militar inminente"
 alg_politics.21.d: "Los generales han consolidado el poder y se están moviendo a reformistas civiles paralelos."
 alg_politics.21.a: "Aceptar la autoridad militar"
 alg_politics.21.b: "Defender el movimiento de reforma"
 alg_politics.22.t: "Sombras sobre Argel"
 alg_politics.22.d: "El establecimiento de seguridad crece más audaz. Argelia se dirige hacia el autoritarismo. ¿Cómo respondemos?"
 alg_politics.22.a: "La seguridad debe venir primero"
 alg_politics.22.b: "Tensiones de calma antes de que sea demasiado tarde"
 alg_politics.23.t: "Vientos de cambio"
 alg_politics.23.d: "El movimiento de reforma crece más fuerte. Pero Le Pouvoir aún manda a las fuerzas de seguridad. ¿Cómo procedemos?"
 alg_politics.23.a: "Avanzar con las reformas"
 alg_politics.23.b: "Despacio para evitar el retroceso"
 ALG_political_truce: "Trugua política"
 ALG_political_truce_desc: "Un frágil compromiso se mantiene entre los reformistas y la vieja guardia."
 ALG_tamazight_integration_process: "Proceso de integración de Tamazight"
 ALG_tamazight_integration_process_desc: "El reconocimiento oficial del idioma Tamazight se está llevando a cabo en todas las instituciones estatales. Si bien esto ha pacificado en gran medida las regiones, el cambio burocrático y el ajuste de la identidad nacional causan un período temporal de fricción mientras avanzamos hacia la plena cohesión social."
 ALG_auto.1.t: "Escándal de la industria automotriz"
 ALG_auto.1.desc: "Han surgido revelaciones sobre la corrupción generalizada en la industria automotriz de Argelia. Múltiples asociaciones extranjeras, incluyendo Renault, BMW y Mercedes, han sido implicadas en esquemas de soborno y prácticas fraudulentas de importación. El público está indignado y exige acción."
 ALG_auto.1.a: "Inicie una investigación completa"
 ALG_auto.1.b: "Suprimir la historia"
 ALG_auto.2.t: "Respuesta al Escándalo Auto"
 ALG_auto.2.desc: "Después de la investigación del escándalo, debemos decidir cómo manejar las importaciones automotrices hacia adelante. Una prohibición completa enviaría un mensaje fuerte pero dañaría nuestra economía. Las restricciones parciales ofrecen un terreno medio."
 ALG_auto.2.a: "Decretar una prohibición total de importaciones"
 ALG_auto.2.b: "Implementar restricciones parciales"
 ALG_auto.2.c: "No adoptar medidas en relación con las importaciones"
 ALG_auto.3.t: "Fiat Propone la asociación"
 ALG_auto.3.desc: "El fabricante italiano Fiat se ha acercado a nosotros con una propuesta para establecer instalaciones de fabricación en Argelia. Ellos ven la oportunidad en nuestro mercado tras las restricciones de importación. Esto podría revitalizar nuestro sector automovilístico."
 ALG_auto.3.a: "Aceptar la propuesta de Fiat"
 ALG_auto.3.b: "Negociación para mejores términos"
 ALG_auto.3.c: "Rechazar la propuesta"
 ALG_auto.4.t: "Recuperación del sector automático"
 ALG_auto.4.desc: "Tras nuestra medida de respuesta al escándalo, el sector automovilístico está empezando a estabilizarse. Los fabricantes nacionales están mostrando interés en la expansión, mientras que las empresas extranjeras siguen acercándonos."
 ALG_auto.4.a: "Apoyo a los fabricantes nacionales"
 ALG_auto.4.b: "Entretener ofertas extranjeras"
 ALG_auto.5.t: "Fiat acepta nuestros Términos"
 ALG_auto.5.desc: "Nuestros negociadores han tenido éxito. Fiat ha acordado términos más favorables incluyendo inversión adicional y transferencia de tecnología. Esta es una victoria significativa para la industria argelina."
 ALG_auto.5.a: "¡Excelente noticia!"
 ALG_auto.6.t: "Fiat Rechaza Renegociaation"
 ALG_auto.6.desc: "Fiat ha rechazado nuestras demandas por mejores términos. Insisten en que su oferta original es más que justa. Debemos decidir si aceptan sus términos o se alejan por completo."
 ALG_auto.6.a: "Aceptar los términos originales"
 ALG_auto.6.b: "Aléjate del trato"
 ALG_corruption_auto_scandal: "Escándalo de corrupción de la industria automotriz"
 ALG_corruption_auto_scandal_desc: "La exposición de la corrupción generalizada en nuestra industria automotriz ha sacudido la confianza pública. Los asociados extranjeros se están distanciando mientras continúan las investigaciones. Nuestra producción industrial y el capital político han tenido un impacto significativo."
 ALG_corruption_auto_scandal_coverup: "Reprimida Escándalo automático"
 ALG_corruption_auto_scandal_coverup_desc: "Hemos intentado suprimir noticias del escándalo de la industria automotriz. Mientras que el daño inmediato está contenido, las agencias de inteligencia extranjeras son conscientes de nuestro engaño y los grupos de oposición nacionales tienen municiones contra nosotros. La verdad aún puede salir."
 ALG_import_ban_penalty: "Importación de automóviles Ban"
 ALG_import_ban_penalty_desc: "Se ha promulgado una prohibición completa de las importaciones de automóviles tras el escándalo de corrupción. Si bien esto envía un fuerte mensaje contra la explotación extranjera, ha perturbado gravemente las cadenas de suministro y la producción industrial. Los consumidores enfrentan escasez y precios más altos."
 ALG_import_restrictions_light: "Restricciones de la importación de automóviles"
 ALG_import_restrictions_light_desc: "Se han aplicado restricciones parciales a las importaciones de automóviles. Este enfoque medido mantiene algunas relaciones comerciales mientras aborda la ira pública sobre el escándalo de corrupción. El impacto económico es manejable pero todavía notable."
 ALG_4g_rollout_tt: "§GArgelia lanza red móvil 4G a nivel nacional:§!\n- Internet móvil de alta velocidad\n- Mejora de la conectividad empresarial\n- Ampliación de los servicios digitales"
 ALG_4g_coverage_basic: "Cubierta 4G - Básico"
 ALG_4g_coverage_basic_desc: "Nuestra red 4G está operativa, pero la cobertura se limita a los principales centros urbanos. Se necesita una inversión continua en infraestructura."
 ALG_4g_coverage_moderate: "Cubierta 4G - Moderado"
 ALG_4g_coverage_moderate_desc: "La cobertura 4G se extiende ahora a la mayoría de las ciudades y pueblos. Las empresas y los ciudadanos se benefician de una mejor conectividad."
 ALG_4g_coverage_good: "Cubierta 4G - Bien"
 ALG_4g_coverage_good_desc: "Una fuerte cobertura 4G en la mayoría de Argelia. La economía digital está floreciendo y la productividad está aumentando."
 ALG_4g_coverage_excellent: "4G Coverage - Excelente"
 ALG_4g_coverage_excellent_desc: "¡Cobertura nacional 4G alcanzada! Argelia es ahora un líder regional en conectividad móvil. La fundación está establecida para el desarrollo de 5G."
 algerian_event.51.t: "La nave espacial argelina aterriza con éxito en la Luna!"
 algerian_event.51.desc: "¡La Agencia Espacial Argelina (ASAL) ha alcanzado un hito histórico! Nuestro lander lunar ha completado con éxito un aterrizaje suave en la superficie lunar, haciendo de Argelia sólo la quinta nación en la historia para lograr esta hazaña.\n\nEl descenso fue transmitido en directo a través de la nación, con millones de argelinos mirando en asombro mientras nuestra nave espacial se tocó cerca del polo lunar sur. Científicos en el centro de control de Argel eruptieron en la celebración como telemetría confirmaron el aterrizaje exitoso.\n\nEste logro sitúa a Argelia junto a la URSS, EE.UU., China e India en el club de élite de naciones capaces de aterrizajes suaves lunares. Representa la culminación de décadas de inversión en nuestro programa espacial y señala el surgimiento de Argelia como una importante potencia espacial.\n\nEl mundo mira en admiración mientras la bandera verde y blanca está plantada en la luna."
 algerian_event.51.a: "¡Un salto gigante para Argelia!"
 ALG_missile_leverage: "Misile Leverage"
 ALG_missile_leverage_desc: "Nuestra relación con China presenta una oportunidad para adquirir tecnología avanzada de misiles. Aprovechando nuestros vínculos diplomáticos y nuestra posición estratégica, podemos negociar la transferencia de misiles de crucero terrestres y plataformas móviles de lanzamiento. Esto mejorará significativamente las capacidades de disuasión de Argelia."
 ALG_build_nuclear_reactor_tt: "§GConstruir el reactor nuclear:§!\n- Establecer la capacidad de energía nuclear civil\n- Reducir la dependencia de los combustibles fósiles\n- Capacitar a científicos e ingenieros nucleares\n- Fundación para la investigación nuclear avanzada"
 ALG_election_pending: "Elecciones nacionales pendientes"
 ALG_opposition_reforms_1: "Reformas de la oposición: libertad de medios"
 ALG_opposition_reforms_1_desc: "El gobierno de oposición ha iniciado su programa de reforma garantizando la libertad mediática. Una prensa gratuita ahora responsabiliza al gobierno e informa al público."
 ALG_opposition_reforms_2: "Reformas de la oposición: Sistema de Justicia"
 ALG_opposition_reforms_2_desc: "Basándose en las reformas de los medios de comunicación, el gobierno de oposición ha reformado la judicatura. Los tribunales independientes garantizan ahora la justicia de todos los argelinos y combaten la corrupción."
 ALG_opposition_reforms_3: "Reformas de la oposición: Educación"
 ALG_opposition_reforms_3_desc: "El programa de reforma de la oposición continúa con importantes inversiones en educación. Un sistema modernizado está preparando a la juventud de Argelia para los desafíos que se avecinan."
 ALG_opposition_reforms_4: "Una nueva era para Argelia"
 ALG_opposition_reforms_4_desc: "El programa de reforma integral de la oposición está completo. Argelia se ha transformado en una nación moderna, democrática y próspera. Medios libres, tribunales independientes, educación de calidad y oportunidad económica definen esta nueva era."
 ALG_fis_movement: "Movimiento Islámico de Salvación"
 ALG_fis_movement_desc: "La FIS ha galvanizado al pueblo argelino con su mensaje de democracia islámica, justicia social y anticorrupción. Las mezquitas sirven como centros comunitarios, proporcionando servicios sociales al gobierno descuidado. El apoyo popular crece diariamente."
 ALG_fln.1.t: "Corrupción Escándalo Rocks Argelia"
 ALG_fln.1.desc: "Los periodistas investigadores han descubierto una red de corrupción que se extiende a través del establishment político de Argelia. Los registros bancarios revelan que millones se desvían de fondos públicos a cuentas privadas. Múltiples partidos aparecen implicados, incluyendo miembros de nuestro propio FLN.\n\nEl escándalo ha estallado en la opinión pública y no podemos ignorarlo. La evidencia es condenatoria, pero cómo respondemos podría estabilizar o desestabilizar todo el sistema político. Debemos decidir cuidadosamente nuestro curso de acción."
 ALG_fln.1.a: "Bury la historia"
 ALG_cover_up_corruption_tt: "§RCover Up the Scandal:§!\n• La corrupción aumenta significativamente\n• Pérdida de poder político menor\n• La reputación de FLN ligeramente dañada\n• Estabilidad preservado por ahora\n\n§7«Lo que la gente no sabe no les hará daño.»§!"
 ALG_fln.1.b: "Culpa a los partidos de oposición"
 ALG_blame_others_tt: "§YBlame Opposition Parties:§!\n• Aumenta la corrupción\n• Partes de oposición fuertemente dañadas\n• FLN gana apoyo\n• Una cierta estabilidad perdida\n\n§7¡Son los verdaderos criminales aquí!§!"
 ALG_fln.1.c: "Que salga la verdad."
 ALG_expose_all_tt: "§GExponer toda corrupción:§!\n• Todas las partes dañadas (incluyendo FLN)\n• Pérdida de estabilidad significativa\n• Costo de poder político pesado\n• Disminución de la corrupción BUT\n• Momento anticorrupción (1 año de bonificación)\n\n§7«El pueblo merece la verdad.»§!"
 ALG_fln.1.e: "Inicie una campaña completa contra la corrupción"
 ALG_anti_corruption_campaign_tt: "§GLaunch Anticorrupción campaña:§!\n• Todas las partes dañadas (incluyendo FLN)\n• Costo elevado de tesorería (§R-15§!)\n• Costo importante del poder político (§R-100§!)\n• La corrupción BUT disminuye significativamente\n• §G Reformas permanentes contra la corrupción§!\n• Ganancia de estabilidad a largo plazo\n\n§7«Vamos a erradicar completamente este cáncer!»§!"
 ALG_anti_corruption_momentum: "Anticorrupción Momentum"
 ALG_anti_corruption_momentum_desc: "La exposición a la corrupción ha provocado la demanda pública de reforma. Si bien es doloroso, este momento de transparencia ha generado un impulso para el cambio positivo."
 ALG_anti_corruption_reforms: "Reformas de la lucha contra la corrupción"
 ALG_anti_corruption_reforms_desc: "En todo el Gobierno se han aplicado medidas amplias contra la corrupción. Las adquisiciones transparentes, los auditores independientes y las protecciones del denunciante están reduciendo el injerto y restableciendo la confianza pública."
 ALG_fln.2.t: "Escándalo de corrupción Sonatrach"
 ALG_fln.2.desc: "Un escándalo de corrupción masivo ha estallado en Sonatrach, la petrolera estatal de Argelia. Las investigaciones revelan miles de millones malversados a través de contratos falsos y cuentas offshore. Los ejecutivos superiores y los socios extranjeros están implicados.\n\nEl público exige respuestas. ¿Cómo responderemos?"
 ALG_fln.2.a: "Cúbrelo."
 ALG_fln.2.b: "Investigar la corrupción"
 ALG_fln.2.c: "Culpa a la oposición"
 ALG_fln.3.t: "El Hirak Awakens"
 ALG_fln.3.desc: "Millones de argelinos han salido a las calles en un movimiento de masas que exige cambios. Las protestas de Hirak han unido a la gente en todas las divisiones - jóvenes y viejos, seculares y religiosos.\n\n«¡Yetnahaw Ga3!» (¡Todos deben ir!) hace eco a través de cada ciudad.\n\nEl viejo orden tembla. La gente ha encontrado su voz."
 ALG_fln.3.a: "La gente ha hablado."
 ALG_grievance_increase_5_tt: "§YPeople's Grievance:§! +5"
 ALG_cover_up_scandal: "Cubierta de Escándalo"
 ALG_cover_up_scandal_desc: "El escándalo de corrupción de Sonatrach ha sido enterrado, pero susurros persisten. Las agencias de inteligencia extranjeras son conscientes del encubrimiento, y la verdad amenaza con resurgir en cualquier momento."
 ALG_anti_corruption_probe: "Sonda anticorrupción"
 ALG_anti_corruption_probe_desc: "Se está llevando a cabo una investigación exhaustiva sobre la corrupción de Sonatrach. Si bien interrumpe los negocios como de costumbre, la sonda está restableciendo la confianza pública y arraigando a funcionarios corruptos."
 ALG_shift_blame: "Culpa Shifted to Opposition"
 ALG_shift_blame_desc: "El gobierno ha redirigido con éxito la ira pública sobre el escándalo de Sonatrach hacia los partidos de oposición. Si bien la propaganda eficaz, esta deflexión no hace nada para abordar la corrupción subyacente."
 ALG_mass_protests: "Protesta de masas"
 ALG_mass_protests_desc: "El movimiento Hirak ha llevado millones a las calles por toda Argelia. La actividad económica se interrumpe a medida que la gente demanda cambios fundamentales. El viejo orden está temblando."
 ALG_FLN_chosen: "Sendero FLN elegido"
 ALG_fln_opp_path: "Sendero de Oposición FLN"
 ALG_domestic_development_focus: "Desarrollo nacional Enfoque"
 ALG_domestic_development_focus_desc: "Argelia ha optado por invertir en su propio desarrollo y no en la expansión extranjera. Proyectos de infraestructura, desarrollo industrial y programas sociales están transformando a la nación en un estado moderno y próspero."
 ALG_middle_east_expansion: "Expansión en el Oriente Medio"
 ALG_middle_east_expansion_desc: "Nuestros ejércitos marchan hacia el Medio Oriente. Las tropas están bien proporcionadas y motivadas por visiones de gloria y conquista."
 ALG_de_arabisation_effect_TT: "§YPolítica de eliminación:§!\n\n§G Renacimiento del lenguaje bereber§!\n Tamazight se convierte en un idioma oficial\n\n§G Reconocimiento Cultural§!\n Identidad amazigh celebrada a nivel nacional\n\n§G Reforma educativa§!\n Historia bereber enseñada en las escuelas\n\n§RConsecuencias:§!\n - Apoyo nacionalista árabe\n - Relaciones con la Liga Árabe\n +Kabyle estabilidad regional"
 ALG_civil_reforms_1: "Protección de los derechos civiles"
 ALG_civil_reforms_1_desc: "Argelia ha establecido protecciones básicas de derechos civiles. Los ciudadanos gozan de mayores libertades y se ha establecido la base para nuevas reformas."
 ALG_civil_reforms_2: "Derechos civiles & Igualdad de género"
 ALG_civil_reforms_2_desc: "Sobre la base de las reformas en materia de derechos civiles, Argelia ha avanzado en la igualdad entre los géneros. Las mujeres están entrando en la fuerza de trabajo en mayor número, fomentando la productividad y el crecimiento."
 ALG_civil_reforms_3a: "Reformas civiles: prensa libre"
 ALG_civil_reforms_3a_desc: "El programa de reforma de Argelia ahora incluye la libertad de prensa. Los medios independientes responsabilizan al gobierno mientras los derechos civiles y la igualdad de género siguen transformando a la sociedad."
 ALG_civil_reforms_3b: "Reformas civiles: independencia judicial"
 ALG_civil_reforms_3b_desc: "El programa de reforma de Argelia ahora incluye un poder judicial independiente. Los tribunales justos luchan contra la corrupción, mientras que los derechos civiles y la igualdad de género siguen transformando la sociedad."
 ALG_civil_reforms_4: "Reformas de la Sociedad Civil"
 ALG_civil_reforms_4_desc: "Argelia ha completado amplias reformas de la sociedad civil. Los derechos civiles, la igualdad entre los géneros, la libertad de prensa, la independencia judicial y las organizaciones de la sociedad civil facultadas han transformado a Argelia en una democracia moderna."
 ALG_gov_reforms_1: "Iniciativa del gobierno digital"
 ALG_gov_reforms_1_desc: "Argelia ha comenzado a digitalizar los servicios gubernamentales. Las plataformas en línea mejoran la prestación de servicios públicos y reducen la ineficiencia burocrática."
 ALG_gov_reforms_2: "Reformas de la administración pública"
 ALG_gov_reforms_2_desc: "Sobre la base de fundaciones digitales, Argelia ha reformado los servicios públicos. Los ciudadanos disfrutan de servicios gubernamentales más rápidos y eficientes."
 ALG_gov_reforms_3a: "Reformas de la lucha contra la corrupción"
 ALG_gov_reforms_3a_desc: "La campaña anticorrupción de Argelia ha limpiado las instituciones gubernamentales. Se ha restablecido la transparencia y la rendición de cuentas."
 ALG_gov_reforms_3b: "Sistema de gobernanza electrónica"
 ALG_gov_reforms_3b_desc: "El portal de gobierno electrónico de Argelia proporciona a los ciudadanos acceso sin problemas a los servicios gubernamentales en línea. La eficiencia burocrática ha mejorado dramáticamente."
 ALG_gov_reforms_4: "Estado administrativo moderno"
 ALG_gov_reforms_4_desc: "Argelia ha logrado un gobierno totalmente modernizado, eficiente y transparente. Los servicios digitales, las medidas anticorrupción y la burocracia simplificada definen la nueva administración."
 ALG_african_union_engagement_full_tt: "§GIniciar con la Unión Africana:§!\n\n§YEfectos en todos los estados miembros de la UA:§!\n• §G+25§! Opinión de Argelia\n• §G+2%§! Influencia argelina\n\nArgelia refuerza su posición como una voz líder en los asuntos africanos."
 ALG_mend_ties_with_rabat: "Mend Ties con Rabat"
 ALG_mend_ties_with_rabat_desc: "La frontera entre Argelia y Marruecos se ha cerrado desde 1994. El conflicto del Sáhara Occidental, la Guerra de las Arenas de 1963 y los alineamientos de la Guerra Fría crearon heridas profundas entre nuestras naciones.\n\nSin embargo, compartimos la misma herencia amazigh y árabe, la misma lucha contra el colonialismo y las mismas esperanzas para nuestro pueblo. Tal vez sea hora de dejar atrás el pasado y construir una nueva relación con el Reino de Marruecos."
 ALG_our_east_brothers: "Nuestros Hermanos del Este"
 ALG_our_east_brothers_desc: "Argelia y Túnez lucharon unilateralmente contra el colonialismo francés. El suelo tunecino amparaba a refugiados argelinos y combatientes del FLN durante nuestra guerra de independencia.\n\nEsta hermandad debe fortalecerse. Juntos, Argelia y Túnez pueden formar el núcleo de un Magreb unido y llevar al norte de África a un futuro próspero."
 ALG_black_spring: "La Primavera Negra"
 ALG_black_spring_desc: "El 18 de abril de 2001, Massinissa Guermah, un joven estudiante de Kabyle, fue asesinado en una brigada de gendarmería en Beni Douala. Su muerte provocó las mayores protestas en Kabylie desde la independencia, con más de 100 muertos por fuerzas de seguridad. La Primavera Negra ha comenzado."
 ALG_black_spring_tt: "§HLa primavera negra brota§!\nLa muerte de Massinissa Guermah provoca protestas masivas en Kabylie. Más de 100 manifestantes asesinados por la gendarmería.\n\n§Y Demandas de kabyle:§!\n- Justicia para los muertos\n- Retiro de la gendarmería\n- Reconocimiento de Tamazight\n- Fin a 'hogra' (contempto)"
 ALG_negotiate_with_arrouch: "Negociar con el Arrouch"
 ALG_negotiate_with_arrouch_desc: "Los Arrouch (consejos de aldea) se han organizado en un movimiento coordinado que representa las demandas de Kabyle. En lugar de confrontarnos, dialogaremos con estas estructuras tradicionales."
 ALG_negotiate_arrouch_tt: "§HEl Movimiento Arrouch§!\nLas asambleas tradicionales de la aldea de Kabyle se han unido para presentar demandas. La negociación puede traer paz.\n\n§YKey Arrouch Demandas:§!\n- Reconocimiento de la Plataforma El-Kseur\n- Derechos del idioma Tamazight\n- Desarrollo económico\n- Fin a la presencia militar"
 ALG_recognize_tamazight_2002: "Tamazight: Idioma nacional"
 ALG_recognize_tamazight_2002_desc: "El 8 de abril de 2002, tras intensas negociaciones, Tamazight será reconocido como lengua nacional de Argelia, una concesión histórica a la identidad bereber."
 ALG_tamazight_national_tt: "§HTamazight se convierte en idioma nacional§!\nUn momento histórico - Tamazight se une al árabe como idioma nacional de Argelia.\n\n§YSignificancia:§!\n- Primer reconocimiento de la identidad bereber\n- Modificación constitucional\n- Las escuelas pueden enseñar a Tamazight\n§GMajor Kabyle Victoria§!"
 ALG_address_hogra: "Dirección de Hogra"
 ALG_address_hogra_desc: "Hogra - el desprecio y la humillación que sienten Kabyles del estado - debe ser abordado. La inversión, el empleo y el respeto sustituirán el descuido y el abuso."
 ALG_address_hogra_tt: "§HEnd the Hogra§!\n'Hogra' - el desprecio sistemático mostrado a Kabyles - será abordado a través de:\n\n- Inversión de infraestructura en Kabylie\n- Programas de creación de empleo\n- Poner fin a las prácticas discriminatorias\n- Respeto a la dignidad de Kabyle"
 ALG_amazigh_cultural_revival: "Resurgimiento cultural amazigh"
 ALG_amazigh_cultural_revival_desc: "La inversión en instituciones culturales bereberes, museos y programas educativos preservará y festejará el patrimonio amazigh que precede la llegada árabe."
 ALG_amazigh_revival_tt: "§HRenacimiento Cultural Asombroso§!\n- Amazigh Academy\n- Museos bereberes financiados\n- Festivales culturales apoyados\n- Promovido por el guión Tifinagh"
 ALG_yennayer_national_holiday: "Fiesta nacional de Yennayer"
 ALG_yennayer_national_holiday_desc: "En diciembre de 2017, el Presidente Bouteflika declaró a Yennayer - el Año Nuevo Amazigh - unas vacaciones nacionales. El 12 de enero se celebrará ahora en todo Argelia."
 ALG_yennayer_tt: "§HYennayer se convierte en vacaciones nacionales§!\nEl Año Nuevo de Berber (enero 12) es ahora una fiesta oficial argelina.\n\n§Y Reconocimiento histórico:§!\n- El patrimonio preislámico celebrado\n- Fortalecimiento de la unidad nacional\n- §GLa satisfacción de Kabyle aumentó§!"
 ALG_tamazight_official_2016: "Tamazight: Idioma oficial"
 ALG_tamazight_official_2016_desc: "La enmienda constitucional de 2016 eleva a Tamazight del status 'nacional' al 'oficial' del lenguaje, situándolo en pie de igualdad con el árabe."
 ALG_tamazight_official_tt: "§HTamazight se convierte en idioma oficial§!\n§W2016 Enmienda constitucional:§!\n- Tamazight igual al árabe\n- Todos los documentos del gobierno bilingües\n- Lenguaje bereber en todas las escuelas\n- §GMayor victoria constitucional§!"
 ALG_berber_integration_complete: "Unidos en la diversidad"
 ALG_berber_integration_complete_desc: "A través del diálogo, el reconocimiento y la inversión, Argelia ha resuelto la cuestión de Kabyle. Los argelinos árabes y amazigh están unidos."
 ALG_integration_complete_tt: "§H Pregunta de Kabyle resuelta§!\nArgelia ha integrado con éxito su población berebera mediante:\n- Reconocimiento de idiomas\n- Inversión cultural\n- Desarrollo económico\n- Respeto y diálogo\n\n§GUnidad nacional alcanzada!§!"
 ALG_crush_the_uprising: "Aplastar el levantamiento"
 ALG_crush_the_uprising_desc: "La Primavera Negra amenaza la unidad nacional. La gendarmería restaurará el orden, y los elementos separatistas serán neutralizados."
 ALG_crush_uprising_tt: "§HPaso de represión§!\nUse fuerza para poner fin a las protestas y mantener la integridad territorial de Argelia.\n\n§Y Beneficios:§!\n- Mantenga todo el territorio.\n- No concesiones a separatistas\n- Control militar\n\n§RCos:§!\n- Crítica internacional\n- Resentimiento profundo de Kabyle\n- Resistencia continua"
 ALG_gendarmerie_reinforcement: "Reforzamiento de la gendarmería"
 ALG_gendarmerie_reinforcement_desc: "Se desplegarán unidades adicionales de gendarmería en Kabylie para mantener el orden y prevenir futuros disturbios."
 ALG_gendarmerie_tt: "§HDeplorar las fuerzas de seguridad§!\n- Aumento de la presencia de gendarmería\n- Protestas monitoreadas\n- Activistas clave detenidos\n- Orden mantenida por la fuerza"
 ALG_arabization_policy: "Política de árabe"
 ALG_arabization_policy_desc: "El árabe es el idioma de Argelia. Intensifique programas de arabización en Kabylie para contrarrestar la ideología bereberista separatista."
 ALG_arabization_1_tt: "§HIntensificar la árabeización§!\n- Educación sólo árabe aplicada\n- Tamazight suprimido\n- Promoción de la identidad islámica\n- La ideología bereberista contrarrestada\n\n§RKabyles será profundamente resentido§!"
 ALG_ban_mak: "Ban el MAK"
 ALG_ban_mak_desc: "En mayo de 2021, el Mouvement pour l'Autodétermination de la Kabylie (MAK) dirigido por Ferhat Mehenni será designado organización terrorista y prohibido."
 ALG_ban_mak_tt: "§HMAK designó organización terrorista§!\nEl Movimiento para la Autodeterminación de Kabylie está prohibido:\n- Ferhat Mehenni etiquetado terrorista\n- Los simpatizantes de MAK arrestados\n- Criminalización de la actividad separatista\n\n§R Crítica internacional esperada§!"
 ALG_accuse_foreign_interference: "Acusar a las Manos Extranjeras"
 ALG_accuse_foreign_interference_desc: "El movimiento separatista MAK no es orgánico - está financiado y apoyado por potencias extranjeras que buscan desestabilizar Argelia. Marruecos y otros deben estar expuestos."
 ALG_foreign_interference_tt: "§HPoderes extranjeros blancos§!\nEl MAK es acusado de ser un proxy extranjero:\n- Marruecos acusado de financiación MAK\n- Parcelas externas contra Argelia\n- Unidad nacional contra enemigos\n\n§RLas tensiones diplomáticas aumentarán§!"
 ALG_mak_israel_connection: "Conexión MAK-Israel"
 ALG_mak_israel_connection_desc: "La reunión de Ferhat Mehenni con funcionarios israelíes demuestra que el MAK es un proyecto sionista para dividir el mundo árabe. La conexión debe estar expuesta."
 ALG_mak_israel_tt: "§HMAK-Israel Link Exposed§!\n- Proyecto Sionista de MAK\n- Israel acusado de desestabilización\n- Se obtuvo el apoyo de la Liga Árabe\n- El sentimiento anti-israelí movilizado\n\n§YApoyo domético §G aumenta§!§!\n§R Las relaciones con Israel serán destruidas§!"
 ALG_kabylie_pacified: "Kabylie Pacified"
 ALG_kabylie_pacified_desc: "A través de operaciones de seguridad y represión política, Kabylie ha sido puesto bajo control. La amenaza separatista está contenida."
 ALG_kabylie_pacified_tt: "§HKabylie bajo control§!\n- MAK aplastado\n- Separatismo criminalizado\n- Fuerzas de seguridad en control\n- La unidad nacional forzada\n\n§YPero simmers de resentimiento.§!"
 ALG_el_kseur_platform: "Aceptar la Plataforma El-Kseur"
 ALG_el_kseur_platform_desc: "La Plataforma El-Kseur, redactada por el Arrouch el 11 de junio de 2001, contiene 15 demandas de justicia y derechos. La aceptaremos como base para la negociación."
 ALG_el_kseur_tt: "§HAceptar la Plataforma El-Kseur§!\nLas 15 demandas incluyen:\n- Justicia para víctimas de la Primavera Negra\n- Retiro de la gendarmería\n- Estado oficial de Tamazight\n- Fin de hogra\n- Desarrollo económico\n- Reformas democráticas\n\n§R Concesiones radicales requeridas§!"
 ALG_withdraw_gendarmerie: "Retirar la Gendarmería"
 ALG_withdraw_gendarmerie_desc: "Una demanda clave de El-Kseur - la gendarmería odiada será retirada de Kabylie y sustituida por la policía local."
 ALG_withdraw_gendarmerie_tt: "§HRetirada de la gendarmería§!\n- Fuerzas paramilitares dejan a Kabylie\n- La policía local se hace cargo\n- Reducción de la presencia militar\n- La demanda mayor Kabyle cumplió\n\n§RLa militaridad será infeliz§!"
 ALG_trial_responsible_officers: "Prueba de los oficiales responsables"
 ALG_trial_responsible_officers_desc: "Los oficiales responsables de las muertes durante la Primavera Negra se enfrentarán a la justicia. Este paso sin precedentes reconoce crímenes estatales contra Kabyles."
 ALG_trial_officers_tt: "§HProceso de oficiales responsables§!\n- Los oficiales enfrentan juicio por homicidios\n- Familias de víctimas indemnizadas\n- El Estado reconoce los delitos\n- Responsabilidad histórica\n\n§R La militaridad será furiosa§!\n§G Aumenta la aprobación internacional§!"
 ALG_secular_berber_identity: "Identidad de los bereberes seculares"
 ALG_secular_berber_identity_desc: "Kabylie ha sido históricamente más secular que el resto de Argelia. Reconociendo la identidad de los bereberes seculares, la definición árabe-islámica de la nacionalidad argelina."
 ALG_secular_berber_tt: "§HReconozca la identidad amazigh secular§!\n- El patrimonio preislámico celebrado\n- Valores seculares protegidos\n- La libertad religiosa garantizada\n- Desafíos narrativos islamistas\n\n§R Los islamistas se opondrán a esto§!"
 ALG_mak_dialogue: "Diálogo con el MAK"
 ALG_mak_dialogue_desc: "Diálogo de apertura con el movimiento separatista MAK de Ferhat Mehenni. Esto corre el riesgo de legitimar el separatismo, pero puede ser el único camino hacia la paz."
 ALG_mak_dialogue_tt: "§H Diálogo abierto con MAK§!\nNegociar con separatistas:\n- Ferhat Mehenni comprometido\n- La libre determinación discutida\n- Autonomía explorada\n- La independencia sobre la mesa\n\n§R Extremadamente controvertida§!\n§RRiesgo de legitimación separatismo§!"
 ALG_reject_separatism: "Rechazar el separatismo"
 ALG_reject_separatism_desc: "Al respetar los derechos de bereber, la integridad territorial de Argelia no es negociable. La unidad en la diversidad - no división - es la respuesta."
 ALG_reject_separatism_tt: "§HUnidad en la diversidad§!\n- El separatismo rechazado\n- Los derechos de bereber garantizados\n- Se mantiene la integridad territorial\n- Argelia diversa pero unida"
 ALG_kabyle_autonomy_statute: "Ley de autonomía Kabyle"
 ALG_kabyle_autonomy_statute_desc: "Una ley oficial de autonomía para Kabylie - autogobierno en los asuntos locales mientras sigue siendo parte de Argelia. Un compromiso histórico."
 ALG_autonomy_statute_tt: "§HKabylie gana la autonomía§!\n- Parlamento regional establecido\n- Tamazight reconocido como funcionario\n- Poderes fiscales locales\n- Autonomía cultural otorgada\n\n§YKabylie sigue siendo parte de Argelia§!"
 ALG_federal_algeria: "Argelia"
 ALG_federal_algeria_desc: "Argelia se transforma en una república federal, con Kabylie como la primera región autónoma. Otras regiones pueden seguir este modelo."
 ALG_federal_algeria_tt: "§HArgelia se convierte en federal§!\n- Constitución federal aprobada\n- Autonomía regional concedida\n- Kabylie como modelo\n- Poder descentralizado\n- Unidad a través del federalismo"
 ALG_united_secular_algeria: "Argelia secular unida"
 ALG_united_secular_algeria_desc: "Una Argelia unida y secular que respeta todas las identidades - árabe y amazigh, musulmana y laica. La diversidad es nuestra fuerza."
 ALG_united_secular_tt: "§HArgelia secular Unida§!\n- Estado secular establecido\n- Todas las identidades respetadas\n- Sin separatismo\n- Sin islamismo\n- La democracia moderna"
 ALG_release_kby_autonomous_tt: "§YAnunciar a Kabylie como Región Autónoma§!"
 ALG_black_spring_spirit: "Un descontento de primavera negra"
 ALG_black_spring_spirit_desc: "El asesinato de Massinissa Guermah ha provocado las mayores protestas desde la independencia. Kabylie quema con rabia contra el estado."
 ALG_arrouch_negotiations: "Negociaciones arroces"
 ALG_arrouch_negotiations_desc: "El gobierno está negociando con el movimiento Arrouch. Los consejos tradicionales del pueblo ahora hablan por Kabylie."
 ALG_tamazight_national_language: "Idioma nacional Tamazight"
 ALG_tamazight_national_language_desc: "Tamazight ha sido reconocido como lengua nacional de Argelia, un paso importante hacia el reconocimiento bereber."
 ALG_tamazight_official_language: "Idioma oficial Tamazight"
 ALG_tamazight_official_language_desc: "La constitución 2016 hizo de Tamazight un idioma oficial, igual al árabe. Un logro histórico para los derechos de Berber."
 ALG_addressing_kabyle_grievances: "Kabyle Grievances"
 ALG_addressing_kabyle_grievances_desc: "El gobierno está invirtiendo en Kabylie y abordando años de negligencia y «hogra» (contempto)."
 ALG_amazigh_cultural_institutions: "Instituciones culturales amazigh"
 ALG_amazigh_cultural_institutions_desc: "La inversión en las instituciones culturales bereberes está preservando y celebrando el patrimonio amazigh de Argelia."
 ALG_united_algeria: "Argelia unida"
 ALG_united_algeria_desc: "A través del diálogo y el respeto, Argelia ha unido a sus poblaciones árabe y amazigh. La pregunta de Kabyle se resuelve."
 ALG_kabyle_crackdown: "Kabyle se averió"
 ALG_kabyle_crackdown_desc: "Las fuerzas de seguridad están suprimiendo las protestas de Kabyle. El orden está siendo restaurado a través de la fuerza."
 ALG_gendarmerie_deployed: "Gendarmería desplegada"
 ALG_gendarmerie_deployed_desc: "Las unidades de gendarmería están estacionadas en toda Kabylie, manteniendo el orden y la vigilancia del disentimiento."
 ALG_forced_arabization: "Arabización forzada"
 ALG_forced_arabization_desc: "Las políticas de árabe se están intensificando en Kabylie. La identidad bereber está siendo suprimida a favor del nacionalismo árabe-islámica."
 ALG_mak_banned: "MAK prohibido"
 ALG_mak_banned_desc: "El Movimiento para la Autodeterminación de Kabylie ha sido designado organización terrorista. El separatismo es ahora criminalizado."
 ALG_foreign_hands_narrative: "Manos extranjeras Narrative"
 ALG_foreign_hands_narrative_desc: "El gobierno culpa a los poderes extranjeros -especialmente Marruecos e Israel - por el separatismo de Kabyle. Los enemigos externos unen a la nación."
 ALG_mak_terrorist_designation: "Designación terrorista MAK"
 ALG_mak_terrorist_designation_desc: "Los MAK y Ferhat Mehenni son designados terroristas con vínculos a Israel. La amenaza separatista es retratada como un complot sionista."
 ALG_kabylie_under_control: "Kabylie bajo control"
 ALG_kabylie_under_control_desc: "A través de la fuerza y la represión política, Kabylie está bajo control gubernamental. Pero el resentimiento se sumerge bajo la superficie."
 ALG_el_kseur_negotiations: "Las negociaciones de El-Kseur"
 ALG_el_kseur_negotiations_desc: "El gobierno ha aceptado la Plataforma El-Kseur como base para las negociaciones con Kabylie."
 ALG_secular_amazigh_movement: "Movimiento Asombroso secular"
 ALG_secular_amazigh_movement_desc: "Se está reconociendo una identidad bereber secular, desafiando la definición árabe-islámica de la nación argelina."
 ALG_mak_negotiations: "Negociaciones MAK"
 ALG_mak_negotiations_desc: "El gobierno está en diálogo sin precedentes con el movimiento separatista MAK. El futuro de Kabylie cuelga en el equilibrio."
 ALG_unity_within_diversity: "Unidad dentro de la diversidad"
 ALG_unity_within_diversity_desc: "Argelia abraza su diversidad - árabe y amazigh, musulmana y laica - manteniendo al mismo tiempo la unidad nacional. El separatismo es rechazado."
 ALG_federal_republic: "Republica federal"
 ALG_federal_republic_desc: "Argelia se ha convertido en una república federal, con Kabylie como la primera región autónoma. El poder está descentralizado mientras se mantiene la unidad."
 ALG_secular_united_nation: "Naciones Unidas"
 ALG_secular_united_nation_desc: "Argelia ha surgido como una nación unida y secular que respeta todas las identidades y rechaza tanto el separatismo como el extremismo religioso."
 KBY_autonomous_kabylie: "Autónoma Kabylie"
 KBY_autonomous_kabylie_desc: "Kabylie ha logrado la autonomía dentro de Argelia. Autogobierno en los asuntos locales mientras sigue siendo parte de la nación."
 KBY_federal_partner: "Compañero federal"
 KBY_federal_partner_desc: "Como socio federal de Argelia, Kabylie goza de plena autonomía e igualdad de asociación en la federación argelina."
 ALG_kabyle_autonomy: "Camino de autonomía Kabyle"
 ALG_kabyle_suppressed: "Camino de supresión Kabyle"
 ALG_kabyle_independence: "Camino de independencia Kabyle"
 ALG_black_spring_triggered: "Manantial Negro Triggered"
 ALG_kabyle_issue_resolved: "Kabyle Edición resuelta"
 ALG_kabyle_suppressed_complete: "La supresión de Kabyle completa"
 ALG_became_federal: "Argelia Became Federal"
 ALG_secular_path_complete: "Sendero Seglar Completa"
 human_rights_violation: "Violaciones de los derechos humanos"
 human_rights_progress: "Progreso de los derechos humanos"
 accused_of_interference: "Acusado de Interferencia"
 accused_of_terrorism_support: "Acusado de apoyo al terrorismo"
 anti_israel_stance: "La postura anti-israelí"
 ALG_bribe_malian_generals: "Generales de Bribe Malian"
 ALG_bribe_malian_generals_desc: "La junta militar maliense puede ser influenciada mediante una cuidadosa distribución de fondos. Al sobornar a los generales clave, Argelia puede aprovechar la toma de decisiones de Bamako y asegurar nuestros intereses en el Sahel."
 ALG_isolate_mali_regime: "Aislato Mali Regime"
 ALG_isolate_mali_regime_desc: "El régimen militar de Bamako ha desestabilizado la región y amenazado a las poblaciones tuareg. Argelia trabajará para aislar la junta internacionalmente, situándonos como mediador legítimo en la crisis del Sahel."
 ALG_isolate_mali_tt: "§HYola el régimen maliense§!\nUse presión diplomática y canales de la Unión Africana para condenar a la junta militar.\n\n§Y Beneficios:§!\n- Liderazgo regional para Argelia\n- Aumento del apoyo tuareg\n- Mali debilitado\n- Influencia de la UA obtenida\n\n§WOutcome:§!\nArgelia se convierte en la mediadora clave de los asuntos del Sahel"
 ALG_au_condemns_mali_tt: "§Y Unión Africana condena el régimen maliense§!\nTodos los miembros de la Unión Africana reducen la opinión de Malí"
 ALG_malian_general_network: "Red general maliense"
 ALG_malian_general_network_desc: "Una red de generales malienses sobornados proporciona a Argelia inteligencia e influencia sobre la junta militar en Bamako."
 ALG_sahel_mediator: "Sahel Mediator"
 ALG_sahel_mediator_desc: "Argelia se ha convertido en el principal mediador diplomático de los conflictos del Sahel. Nuestra voz tiene peso en los asuntos regionales."
 MAL_international_isolation: "Internacional Isolación"
 MAL_international_isolation_desc: "El régimen militar se enfrenta a la condena y el aislamiento internacionales. El comercio se interrumpe, la ayuda extranjera suspendida y el gobierno lucha por mantener el control."
 ALG_bribed_our_generals: "Bribed Nuestros Generales"
 ALG_supported_our_cause: "Apoyamos nuestra Causa"
 AU_condemned_regime: "Régimen Condenado de la Unión Africana"
 ALG_bribed_mali_generals: "Sobornado Generales malienses"
 ALG_isolated_mali: "Régimen de Malí aislado"
 ALG_dziri_unlock_tt: "§YRequiere uno de:§!\n- Completado §H Restaurar la esperanza§!\n- Completo §HResist Le Pouvoir§!\n- Completo §HMilitary Coup§!"
 ALG_requires_democratic_or_neutral_tt: "Requiere §HEl gobierno democrático§! o §HNeutral§!"
 ALG_requires_authoritarian_or_neutral_tt: "Requiere §HAuthoritarian§! o §HNeutral§! gobierno"
 ALG_not_gender_equality_tt: "§RIncompatible con enfoque de igualdad de género§!"
 ALG_not_suppressed_kabyle_tt: "§RNo disponible si Kabylie fue suprimida§!"
 ALG_migration_event_required_tt: "§YDesbloqueado por el evento Crisis de Migración§!"
 ALG_drug_event_required_tt: "§YDesbloqueado por el evento de la crisis de las drogas§!"
 ALG_dziri_tt: "§GSubdivisión de la Sociedad Algeriana Desbloqueada:§!\n\nElija cómo configurar la sociedad argelina - progresista o tradicional, abierta o cerrada."
 ALG_dziri_unlocks_tt: "§YDesbloquea la rama social:§!\n- Camino de la Sociedad Civil (Democrático/Neutral)\n- Sendero de Tradiciones (Autoritario/Neutral)\n- Berber Rights (Democrático/Neutral)\n- Respuesta a las drogas (Evento-triggered)\n- Respuesta a la migración (Evento activada)"
 ALG_open_civil_society_tt: "§G Sociedad Civil Abierta:§!\n\n- Las ONG y las organizaciones benéficas prosperan\n- Aumento de la participación democrática\n- Fundación para reformas progresivas"
 ALG_constitutionalize_rights_tt: "§G Derechos constitucionales:§!\n\n- Libertades fundamentales protegidas\n- Fortalecimiento del estado de derecho\n- Aprobación internacional"
 ALG_integration_policy_tt: "§G Programas de Integración:§!\n\n- Los migrantes se convierten en ciudadanos productivos\n- Ganancias mano de obra\n- Cohesión social"
 ALG_unlocks_migration_branch_tt: "§YDesbloquea la Subdivisión de Respuesta a las Migraciones§!\n(Cuando el evento migratorio se dispara)"
 ALG_migration_problems_tt: "§Y Crisis migratoria:§!\n\nLos migrantes subsaharianos inundan las fronteras sur de Argelia. Debes elegir cómo responder."
 ALG_migration_choice_tt: "§YChoice:§!\n- §G Política de puertas abiertas§! - Migrantes bienvenidos\n- §RLímites cerrados§! - Asegurar la frontera"
 ALG_open_door_tt: "§GPolítica de puertas abiertas:§!\n\n- Migrantes y refugiados bienvenidos\n- Ganancias mano de obra\n- Una pérdida de estabilidad\n- Reputación humanitaria"
 ALG_closed_borders_tt: "§RLímites cerrados:§!\n\n- Aseguren la frontera.\n- Ganancias Estabilidad\n- Reducir la influencia extranjera\n- El crecimiento demográfico disminuye"
 ALG_expand_berber_rights_tt: "§GExpand Berber Rights:§!\n\n- Cultura amazigh celebrada\n- La satisfacción de Kabyle mejoró\n- Beneficios de la investigación por diversidad"
 ALG_drug_problem_tt: "§Y Crisis de drogas:§!\n\nEl tráfico de drogas desde Marruecos y el Sahel ha creado problemas de adicción. Debes elegir cómo responder."
 ALG_drug_choice_tt: "§YChoice:§!\n- §GDespenalizar§! - Enfoque basado en la salud\n- §RTighten Punishments§! - Law enforcement approach"
 ALG_relax_restrictions_tt: "§GDespenalizar las drogas:§!\n\n- Tratar la adicción como cuestión de salud\n- Reducir la población carcelaria\n- Sigue habiendo alguna influencia de la mafia.\n- Reducción de las críticas internacionales"
 ALG_tighten_punishments_tt: "§RDesactivación de las drogas:§!\n\n- Penas de daños para los distribuidores\n- Reducción de la influencia de la mafia\n- Aumento del apoyo a la guerra\n- Una pérdida de estabilidad"
 ALG_traditions_matter_tt: "§G Valores tradicionales:§!\n\n- Aduanas argelinas conservadas\n- Se promueven los valores religiosos\n- Resistencia a la influencia occidental"
 ALG_unlocks_conservative_path_tt: "§YDesbloquea el Camino Social Conservador§!"
 ALG_censor_internet_tt: "§Y Internet de censor:§!\n\n- Bloquear la propaganda extranjera\n- Flujo de información de control\n- Reducir la influencia extranjera\n- Investigación ligeramente más lenta"
 ALG_restrict_women_tt: "§Y Funciones tradicionales de género:§!\n\n- Se alienta a las mujeres a quedarse en casa\n- La tasa de natalidad puede aumentar\n- Reducción de la fuerza de trabajo\n- Crítica occidental"
 ALG_marriage_subsidies_tt: "§G Subvenciones de matrimonio:§!\n\n- El Gobierno paga las bodas\n- Fomento del crecimiento de la población\n- Costo de tesorería\n- Se promueven los valores tradicionales"
 ALG_open_civil_society_idea: "Sociedad civil abierta"
 ALG_open_civil_society_idea_desc: "Argelia tiene una sociedad civil vibrante con organizaciones no gubernamentales activas, organizaciones benéficas y organizaciones comunitarias que contribuyen a la vida pública."
 ALG_constitutionalize_rights_idea: "Derechos constitucionales"
 ALG_constitutionalize_rights_idea_desc: "Los derechos fundamentales están consagrados en la Constitución, protegiendo a los ciudadanos argelinos y fortaleciendo el estado de derecho."
 ALG_integration_policy_idea: "Política de integración"
 ALG_integration_policy_idea_desc: "Argelia integra activamente a los migrantes y refugiados, proporcionando formación lingüística y vías de acceso a la ciudadanía."
 ALG_migration_crisis: "Crisis migratoria"
 ALG_migration_crisis_desc: "Las olas de migrantes del África subsahariana han abrumado las instalaciones fronterizas y han creado tensiones sociales."
 ALG_welcome_migrants: "Política de puertas abiertas"
 ALG_welcome_migrants_desc: "Argelia acoge con beneplácito a los migrantes y refugiados, prestando asistencia humanitaria y apoyo para la integración."
 ALG_refugees_maintained: "Población de refugiados administrada"
 ALG_refugees_maintained_desc: "La población refugiada de Argelia está bien gestionada con instalaciones adecuadas y programas de integración."
 ALG_drug_crisis: "Crisis de las drogas"
 ALG_drug_crisis_desc: "El tráfico y la adicción de drogas se han convertido en problemas graves, que dificultan el cumplimiento de la ley y los servicios de salud."
 ALG_traditions_matter_idea: "Valores tradicionales"
 ALG_traditions_matter_idea_desc: "Argelia promueve valores tradicionales como la familia, la fe y la comunidad. Se resiste la influencia cultural occidental."
 ALG_censored_internet_idea: "Internet censurado"
 ALG_censored_internet_idea_desc: "El gobierno controla el acceso a Internet, bloqueando la propaganda extranjera y el contenido inmoral."
 ALG_women_role_idea: "Funciones tradicionales en materia de género"
 ALG_women_role_idea_desc: "Se alienta a las mujeres a que asistan a los roles tradicionales como caseras y madres. La participación de las mujeres en la fuerza laboral ha disminuido."
 ALG_marriage_subsidies_idea: "Subvenciones matrimoniales"
 ALG_marriage_subsidies_idea_desc: "El gobierno subvenciona los matrimonios, ayudando a las parejas jóvenes a permitir bodas y fomentar la formación familiar."
 restricts_women_rights: "Restricciones de los derechos de la mujer"
 ALG_migration_flood: "Crisis migratoria activa"
 ALG_drugs: "Crisis de drogas activa"
 ALG_mediterranean_games_preparation: "Preparación para los Juegos Mediterráneos"
 ALG_mediterranean_games_preparation_desc: "Oran se está transformando para los 2022 Juegos Mediterráneos. Los equipos de construcción trabajan todo el tiempo en el Complejo Olímpico, nuevos estadios y la aldea de los atletas. La nación reza detrás de este acontecimiento histórico mientras Argelia se prepara para dar la bienvenida a 26 naciones a sus costas."
 ALG_more_infra: "Ampliar la infraestructura"
 ALG_more_infra_desc: "La infraestructura de Argelia requiere una expansión significativa para apoyar el crecimiento económico. Nuevas carreteras, ferrocarriles y utilidades conectarán comunidades y facilitarán el comercio a través de la nación."
 TT_ALG_SECULAR_DISCONTENT_MODIFIER: "§RLos secularistas crecen descontentos§!\nLos argelinos progresistas y seculares se oponen a las políticas religiosas."
 TT_ALG_ISLAMIST_SATISFACTION_MODIFIER: "§G Aumenta el apoyo islamista§!\nLos conservadores religiosos aprueban estas medidas."
 ALG_more_relation_better: "§HEllos son§! §Gmás propenso a unirse§! §Hsi tenemos§! §Gmejores relaciones!§!"
 algerian_military_dismantling: "Desmantelamiento militar"
 algerian_military_dismantling_desc: "El ejército de Argelia está siendo desmantelado sistemáticamente. El equipo se descompone, las unidades disueltas y los oficiales retirados. El Ejército Popular Nacional de Argelia es una sombra de su antiguo yo."
 algerian_student_exchanges: "Programas de Intercambio de Estudiantes"
 algerian_student_exchanges_desc: "Estudiantes argelinos estudian en el extranjero en universidades extranjeras mientras los estudiantes internacionales llegan a Argelia. Estos intercambios construyen conexiones, transfieren conocimientos y capacitan a la próxima generación de profesionales argelinos."
 ALG_boost_reformists: "Los reformistas más poderosos"
 ALG_boost_old_guard: "Impulsa Old Guard"
 ALG_rally_students: "Estudiantes de Rally"
 ALG_mobilize_veterans: "Mobilice Veteranos"
 ALG_bribe_elites: "Bribe Elites"
 ALG_seek_compromise: "Buscar Compromiso"
 ALG_media_campaign_reform: "Medios de comunicación"
 ALG_security_crackdown: "Seguridad Crackdown"
 ALG_world_tension_security: "Seguridad de la tensión mundial"
 ALG_world_tension_high_security: "Tension High Security"
 ALG_path_crackdown_momentum: "Desgarrar el impulso"
 ALG_path_reconciliation_momentum: "conciliación Momentum"
 ALG_oil_patronage: "Patronaje de aceite"
 ALG_economic_reforms: "Reformas económicas"
 ALG_ter_oboronaup_start: "Defensa territorial"
 ALG_internalup_start: "Tropas internas"
 ALG_MAJLIS_WATANI_SHAABI_DESC: "La Asamblea Nacional Popular es la casa baja del Parlamento argelino. Bajo este sistema, el poder ejecutivo se confiere a la Asamblea en lugar de un único presidente, estableciendo una verdadera república parlamentaria donde los representantes electos gobiernan colectivamente a la nación."
 ALG_a_new_algeria_tt: "La red de corrupción de Bouteflika está desmantelada. Su riqueza robada es confiscada, su propiedad se vende, y los fondos recuperados son devueltos al tesoro nacional."
 FIS_faction_middle_east_available_tt: "Al menos una nación sunita de Oriente Medio debe tener una opinión sobre nosotros más de 70 y perseguir una política exterior intervencionista"
 FIS_faction_asia_available_tt: "Al menos una nación sunita asiática debe tener una opinión sobre nosotros más de 70 y perseguir una política exterior intervencionista"
 ALG_4g_upgrade_decisions_tt: "Desbloquea las decisiones para mejorar la infraestructura nacional de red 4G."
 ALG_environmental_campaign_no_space_tt: "No hay ranuras de edificio disponibles. En cambio, la influencia nacional se ha incrementado a través de la campaña de medios ambientales."
 ALG_grand_mufti_rule_djaballah_tt: "Abdallah Djaballah será nombrado como el nuevo jefe de estado, llevando una dirección islamista conservadora a la gobernanza de Argelia."
 ALG_grand_mufti_rule_ulema_tt: "El Consejo de Ulema será consultado para determinar el liderazgo religioso de Argelia, desencadenando una elección entre facciones clericales rivales."
 ALG_revivify_non_aligned_movement_t: "Argelia trabajará para revitalizar el Movimiento de los Países No Alineados, poniéndose como una voz líder para las naciones fuera de los grandes bloques de poder."
 TT_ALG_REDUCE_TAXES_5: "La tasa tributaria de la población se reducirá en 5, lo que aliviará la carga sobre las clases inferiores y fomentará el apoyo entre los campesinos."
 ALG_east_west_highway: "Autopista Este-Oeste"
 ALG_east_west_highway_desc: "La autopista Este-Oeste servirá como columna vertebral económica de Argelia, conectando los principales centros de población desde Annaba a Tlemcen y mejorando drásticamente el comercio interno y la movilidad."
 ALG_future_national_policy1: "Una nación en una encrucijada"
 ALG_future_national_policy1_desc: "El futuro de Argelia sigue sin ser escrito. Las decisiones tomadas en los próximos años definirán el carácter del Estado, sus valores, sus aliados y su lugar en el mundo."
 ALG_hassi_massoud_exploitation_desc: "El campo petrolero Hassi Messaoud es uno de los más grandes de África. Al invertir en su plena explotación, Argelia puede aumentar dramáticamente su producción de petróleo y obtener ingresos energéticos a largo plazo."
 ALG_north_south_highway_desc: "Una carretera transsahariana que conecta la costa norte con el sur profundo abrirá el vasto interior de Argelia, permitiendo la extracción de recursos y reduciendo la desigualdad regional."
 ALG_black_decade_lesson2_idea: "Lecciones del Decenio Oscuro II"
 ALG_black_decade_lesson2_idea_desc: "Las reformas a las fuerzas armadas se han basado en las dolorosas lecciones de la guerra civil. El ejército de Argelia está mejor preparado para manejar amenazas internas sin recurrir a la violencia indiscriminada."
 ALG_black_decade_lesson3_idea: "Lecciones del Decenio Oscuro III"
 ALG_black_decade_lesson3_idea_desc: "Una década de reforma ha transformado la doctrina de seguridad de Argelia. El contraextremismo está ahora integrado en la cultura militar, con unidades especializadas y redes de inteligencia específicamente diseñadas para prevenir futuras insurgencias."
 ALG_decline_of_tourism1: "Recuperación del sector turístico"
 ALG_decline_of_tourism1_desc: "El peor de la caída ha pasado. Las inversiones orientadas y las mejores condiciones de seguridad están empezando a atraer visitantes hacia los lugares históricos de Argelia y la costa mediterránea."
 ALG_destroyed_agriculture_two: "Sector agrícola dañado"
 ALG_destroyed_agriculture_two_desc: "La inestabilidad continua sigue obstaculizando la recuperación agrícola. Los campos siguen siendo improductivos y las comunidades rurales luchan por regresar a actividades agrícolas normales."
 ALG_destroyed_agriculture_three: "Reconstrucción agrícola"
 ALG_destroyed_agriculture_three_desc: "Se están realizando esfuerzos de reconstrucción en el sector agrícola. Se están cultivando nuevos distritos y se está reconstruyendo lentamente la infraestructura para restaurar la capacidad de producción de alimentos."
 ALG_family_centric_2: "La familia en el corazón de la sociedad II"
 ALG_family_centric_2_desc: "El énfasis en las estructuras familiares tradicionales ha profundizado, dando forma a la política social en torno a una visión conservadora del hogar como fundamento de la sociedad argelina."
 ALG_hydroelectric_power_plants_upgraded2_idea: "Red Hidroeléctrica avanzada"
 ALG_hydroelectric_power_plants_upgraded2_idea_desc: "Una segunda oleada de mejoras a la infraestructura hidroeléctrica de Argelia ha ampliado considerablemente la capacidad de almacenamiento energético y la fiabilidad de las redes en todo el país."
 ALG_mastering_atom_2: "Dominar el átomo II"
 ALG_mastering_atom_2_desc: "El programa nuclear de Argelia ha avanzado a la etapa de enriquecimiento, suscitando preocupación internacional. El país es ahora capaz de producir material apto para armas, aunque todavía no se ha dado el paso final."
 ALG_mastering_atom_3: "Dominar el átomo III"
 ALG_mastering_atom_3_desc: "Argelia ha desarrollado con éxito una capacidad de armas nucleares. La nación está ahora entre las potencias nucleares del mundo, alterando drásticamente el equilibrio regional de poder."
 ALG_riot_police_1: "Unidad de respuesta rápida de Al-Saiqa"
 ALG_riot_police_1_desc: "Se ha formado una unidad dedicada a la policía antidisturbios, capacitada específicamente para dispersar las protestas y mantener el orden en los centros urbanos. Su presencia es disuasiva a los disturbios civiles."
 ALG_riot_police_2: "Despliegue ampliado de Al-Saiqa"
 ALG_riot_police_2_desc: "La unidad de policía antidisturbios ha sido reducida y reformada tras las críticas públicas de fuerza excesiva. Su mandato se ha reducido y la supervisión ha aumentado."
 ALG_riot_police_3: "Fuerza de élite Al-Saiqa"
 ALG_riot_police_3_desc: "La unidad Al-Saiqa se ha ampliado y profesionalizado en una fuerza de seguridad interna de élite, capaz de despliegue rápido en cualquier lugar del país."
 ALG_science_idea_two: "Renacimiento científico argelino II"
 ALG_science_idea_two_desc: "Basándose en la primera oleada de inversiones científicas, Argelia ha establecido una red de instituciones de investigación y asociaciones internacionales que están acelerando el desarrollo tecnológico."
 ALG_air_reform_desc: "Una primera ronda de reformas a la Fuerza Aérea Argelina ha comenzado a modernizar su estructura de mando y a mejorar su flota de aviones envejecidos."
 ALG_air_reform2_desc: "En la segunda fase de la reforma de la fuerza aérea se han introducido programas avanzados de capacitación y procedimientos mejorados de mantenimiento, lo que aumenta la disponibilidad operacional."
 ALG_air_reform3_desc: "La fuerza aérea de Argelia se ha modificado sustancialmente. Se han encargado nuevos escuadrones equipados con aviones modernos, lo que ha mejorado significativamente la defensa antiaérea y la proyección de energía."
 ALG_air_reform4_desc: "El programa de reforma de la fuerza aérea está completo. Argelia tiene ahora una de las fuerzas aéreas más capaces del continente africano."
 ALG_algerian_tourism_desc: "Se está promoviendo activamente el sector turístico de Argelia, con inversiones en infraestructura hospitalaria y campañas internacionales de marketing que llevan a los visitantes al rico patrimonio cultural y natural del país."
 ALG_army_reform_desc: "Se ha puesto en marcha un amplio programa de reforma para modernizar el ejército argelino, mejorar las normas de capacitación, la logística y las estructuras de mando."
 ALG_army_reform_mass_army_desc: "Argelia está construyendo un gran ejército convencional capaz de operaciones sostenidas, priorizando la mano de obra y la infantería mecanizada sobre fuerzas especializadas."
 ALG_army_reform_mass_army2_desc: "La reforma del ejército de masas ha entrado en su segunda fase, con una mayor logística y un apoyo blindado que aumenta el poder de lucha convencional de las fuerzas terrestres argelinas."
 ALG_army_reform_mass_army3_desc: "La doctrina del ejército masivo de Argelia está plenamente establecida. Las grandes formaciones de armas combinadas son ahora la columna vertebral de la estrategia de defensa terrestre de la nación."
 ALG_army_reform_mass_army4_desc: "El programa del ejército de masas está completo. Argelia puede desplegar fuerzas terrestres numéricamente superiores respaldadas por una robusta infraestructura logística."
 ALG_army_reform_specops_desc: "Argelia está invirtiendo en fuerzas de operaciones especiales, creando unidades de élite capacitadas para la lucha contra el terrorismo, la respuesta rápida y la guerra no convencional."
 ALG_army_reform_specops2_desc: "El programa de fuerzas especiales se ha ampliado, con nuevas unidades capacitadas en rescate de rehenes, infiltración profunda y operaciones directas de acción."
 ALG_army_reform_specops3_desc: "Las fuerzas especiales de Argelia han alcanzado un alto nivel de capacidad, aprovechando las lecciones de décadas de experiencia en la lucha contra la insurgencia en el Sahel y en casa."
 ALG_army_reform_specops4_desc: "El programa de reforma de las fuerzas especiales está completo. Las unidades de élite de Argelia se encuentran entre las más capaces en África, respetadas por su experiencia y sofisticación operacional."
 ALG_basic_income_support_desc: "Un programa básico de apoyo a los ingresos proporciona una red de seguridad financiera para los ciudadanos más pobres de Argelia, reduciendo la pobreza y amortiguando los efectos de la volatilidad económica."
 ALG_black_decade_methods_desc: "Las fuerzas de seguridad siguen dependiendo de los métodos brutales desarrollados durante la guerra civil. Si bien es eficaz a corto plazo, este enfoque alimenta el resentimiento y los riesgos que reinan en el mismo extremismo que pretende suprimir."
 ALG_border_security_idea_desc: "Los puestos fronterizos reforzados y las rutas de patrulla ampliadas han mejorado la capacidad de Argelia para interceptar contrabandistas, traficantes de armas e infiltrados extremistas que cruzan sus vastas fronteras del desierto."
 ALG_childcare_reform_desc: "Se están poniendo en marcha nuevos centros de atención infantil y programas subvencionados de guardería, lo que facilita a las familias equilibrar el trabajo y la crianza de los hijos."
 ALG_closed_moroccan_border_desc: "La frontera con Marruecos sigue firmemente cerrada. Si bien esto limita el contrabando transfronterizo, también sofoca el comercio legítimo y profundiza la congelación diplomática entre las dos naciones."
 ALG_confidence_measures_idea_desc: "Un conjunto de medidas de fomento de la confianza entre Argelia y sus vecinos está ayudando a reducir las tensiones y los canales abiertos para el diálogo diplomático."
 ALG_counter_morocco_idea_desc: "Argelia está luchando activamente contra la influencia marroquí en la región a través de la presión diplomática, el apoyo al Frente Polisario y la competencia estratégica para los aliados africanos."
 ALG_dialogue_with_morocco_desc: "Se ha abierto un diálogo cauteloso con Marruecos, explorando la posibilidad de normalizar las relaciones y reabrir la frontera tras años de hostilidad."
 ALG_education_arabization_desc: "La árabe del sistema educativo se ha profundizado, reemplazando la instrucción en lengua francesa por árabe a todos los niveles e incorporando valores islámicos en el plan de estudios nacional."
 ALG_food_subsidy_idea_desc: "Los subsidios gubernamentales mantienen bajos los precios básicos de los alimentos, asegurando que incluso los argelinos más pobres puedan permitirse una nutrición básica. Sin embargo, ello supone una carga importante para el presupuesto nacional."
 ALG_foreign_arms_companies_desc: "Argelia ha abierto su proceso de adquisición a los fabricantes extranjeros de armas, lo que ha permitido acceder a una gama más amplia de equipos militares pero ha aumentado la dependencia de los proveedores externos."
 ALG_fuel_subsidy_idea_desc: "Los precios subvencionados del combustible mantienen bajos los costos de transporte y energía para hogares y negocios argelinos, pero representan una importante responsabilidad fiscal que limita la flexibilidad presupuestaria del gobierno."
 ALG_future_army_desc: "Argelia está invirtiendo en la tecnología y doctrina militares de próxima generación, colocando a sus fuerzas armadas al borde de la capacidad moderna de guerra."
 ALG_global_power_desc: "Argelia se ha establecido como un verdadero poder mundial, con un asiento en la mesa internacional y el peso económico y militar para respaldarlo."
 ALG_health_insurance_system_desc: "Se está estableciendo un sistema nacional de seguro médico, que proporciona a los argelinos acceso a la atención médica independientemente de su nivel de ingresos."
 ALG_housing_support_idea_desc: "Los programas gubernamentales de apoyo a la vivienda están ayudando a las familias de bajos ingresos a acceder a alojamientos asequibles, reduciendo la presión de la escasez de viviendas urbanas en Argelia."
 ALG_hydroelectric_power_plants_upgraded_idea_desc: "Se ha mejorado la infraestructura hidroeléctrica de Argelia, aumentando la capacidad y fiabilidad de la generación de electricidad impulsada por el agua y reduciendo la dependencia de los combustibles fósiles."
 ALG_idea_arab_diplomacy_desc: "Argelia está llevando a cabo una agenda diplomática árabe activa, que se posiciona como mediador y voz clave dentro de la Liga Árabe y en el mundo árabe más amplio."
 ALG_idea_parliamentary_republic_desc: "Argelia ha adoptado un sistema de repúblicas parlamentarias, desplazando el poder ejecutivo hacia la legislatura y estableciendo una forma de gobierno más responsable."
 ALG_idea_presidential_republic_desc: "Argelia actúa como república presidencial, con autoridad ejecutiva concentrada en la oficina del presidente que es elegido directamente por el pueblo."
 ALG_idea_refoming_education_desc: "Una primera serie de reformas educativas ha comenzado a mejorar las normas de los planes de estudios, la formación de maestros y el acceso a la educación en todo el país."
 ALG_idea_refoming_education1_desc: "La segunda fase de la reforma educativa ha ampliado la enseñanza secundaria, mejorado la formación profesional e introducido metodologías docentes actualizadas en las escuelas argelinas."
 ALG_idea_semi_presidential_republic_desc: "El sistema semipresidencial de Argelia equilibra el poder entre un presidente electo directamente y un primer ministro responsable ante el Parlamento."
 ALG_maghreb_cooperation_idea_desc: "Argelia está trabajando para intensificar la cooperación económica y política con sus vecinos del Magreb, sentando las bases de un bloque regional más integrado del África septentrional."
 ALG_maghreb_security_idea_desc: "Un marco de seguridad compartido con los asociados del Magreb está permitiendo respuestas coordinadas al terrorismo, el contrabando y la inestabilidad transfronteriza en el Sahel."
 ALG_maghreb_trade_idea_desc: "Los acuerdos comerciales preferenciales con las naciones del Magreb están impulsando el comercio intrarregional, reduciendo la dependencia de Argelia en los mercados europeos."
 ALG_mastering_atom_desc: "Argelia ha iniciado un programa nuclear clandestino, estableciendo la infraestructura de investigación necesaria para desarrollar eventualmente material apto para armas."
 ALG_military_expansion_desc: "Argelia está ampliando el tamaño de sus fuerzas armadas, invirtiendo en nuevos equipos y reclutando personal adicional para proyectar un mayor poder militar."
 ALG_military_expansion2_desc: "El programa de expansión militar ha entrado en su segunda fase, con nuevas unidades blindadas, brigadas de artillería y sistemas de defensa antiaérea que se están encargando."
 ALG_military_junta_desc: "Los militares han tomado el control directo del estado. Argelia está gobernada por una junta de generales cuya legitimidad se basa en la fuerza y no en el mandato popular."
 ALG_military_quality_initiative_desc: "Un enfoque de calidad-sobre-cuantidad para la reforma militar está mejorando el profesionalismo, las normas de capacitación y el equipo de las fuerzas armadas de Argelia."
 ALG_military_quality_initiative2_desc: "La segunda fase de la iniciativa de calidad militar ha introducido una formación avanzada de simulación, mejorado la educación de los oficiales y ampliado los ejercicios de servicios conjuntos."
 ALG_modern_hospitals_desc: "Argelia está construyendo una red de hospitales modernos equipados con tecnología médica contemporánea, mejorando significativamente los resultados sanitarios para la población."
 ALG_natural_products_idea_desc: "Argelia está promoviendo sus productos naturales, incluidas las fechas, el aceite de oliva y los bienes artesanales, en los mercados internacionales, diversificando los ingresos de exportación y apoyando a las comunidades rurales."
 ALG_naval_reform_desc: "La marina de Argelia está experimentando su primera reforma importante en décadas, mejorando el mantenimiento, la capacitación y la capacidad de su flota superficial."
 ALG_naval_reform2_desc: "Se han encargado nuevas fragatas y buques de patrulla como parte de la segunda fase de reforma naval, ampliando el alcance de Argelia en el Mediterráneo occidental."
 ALG_naval_reform3_desc: "La capacidad naval de Argelia se ha mejorado sustancialmente con mejores capacidades antisubmarinas y de defensa costera."
 ALG_naval_reform4_desc: "El programa de reforma naval está completo. Argelia tiene ahora una fuerza naval moderna y equilibrada capaz de proyectar el poder en todo el Mediterráneo y en el Atlántico."
 ALG_open_border_coop_desc: "Argelia ha abierto sus fronteras a una mayor cooperación transfronteriza con sus vecinos, facilitando el comercio, la circulación de personas y proyectos conjuntos de infraestructura."
 ALG_pna_expansion_desc: "El Ejército Popular Nacional ha ampliado su capacidad logística y administrativa, mejorando su capacidad para sostener operaciones a gran escala en el vasto territorio de Argelia."
 ALG_polisario_support_idea_desc: "Argelia sigue prestando apoyo político, logístico y material al Frente Polisario, manteniendo la presión sobre Marruecos en la controversia del Sáhara Occidental."
 ALG_private_clinics_expansion_desc: "Se permite al sector privado de la salud expandirse, ofreciendo una atención de mayor calidad para aquellos que pueden pagarla mientras aumentan la presión sobre el sistema de salud pública."
 ALG_private_healthcare_idea_desc: "Argelia fomenta la inversión privada en salud, creando un sector privado paralelo que ofrece servicios premium junto con el sistema público."
 ALG_reactioners_desc: "Los elementos conservadores dentro de la burocracia estatal y militar resisten una reforma significativa, protegiendo los intereses del orden establecido a expensas de la modernización."
 ALG_reactioners1_desc: "Las fuerzas reaccionarias se han visto algo debilitadas, aunque mantienen una influencia significativa dentro de las instituciones clave y siguen retrasando el ritmo del cambio."
 ALG_reactioners2_desc: "El agarre de la vieja guardia está suelto. Los esfuerzos de reforma han cobrado suficiente impulso para superar muchos de los obstáculos institucionales que anteriormente habían bloqueado el progreso."
 ALG_reactioners3_desc: "La facción reaccionaria ha sido sustancialmente marginada. El nuevo acuerdo político ha eliminado a muchos de sus aliados de posiciones de poder."
 ALG_reactioners4_desc: "La reforma sistémica ha roto la parte posterior del bloque reaccionario. Las instituciones de Argelia son cada vez más sensibles a la demanda popular en lugar de arraigar intereses de élite."
 ALG_reactioners5_desc: "Sólo los bolsillos aislados de resistencia permanecen entre la vieja guardia. La transformación de la cultura política argelina está llegando a su fin."
 ALG_reactioners6_desc: "Los últimos vestigios del sistema reaccionario han sido barridos aparte. Argelia ha entrado en una nueva era definida por la rendición de cuentas y la verdadera competencia política."
 ALG_reactioners7_desc: "Argelia ha roto totalmente con su pasado autoritario. El Estado está estructurado ahora en torno a las normas democráticas y el estado de derecho, con las viejas redes patronales disueltas."
 ALG_sand_war_memory_idea_desc: "La memoria de la Guerra Sandinista de 1963 con Marruecos sigue formando la planificación militar argelina y la política exterior, fomentando una profunda sospecha institucional de las intenciones marroquíes."
 ALG_science_idea_desc: "Argelia está invirtiendo en investigación científica y desarrollo, estableciendo nuevos laboratorios y financiando programas de investigación universitaria para construir una economía nacional del conocimiento."
 ALG_shipbuilding_desc: "Argelia está desarrollando una industria nacional de construcción naval, construyendo instalaciones capaces de producir buques navales y comerciales y reduciendo la dependencia de proveedores extranjeros."
 ALG_shipbuilding2_desc: "La industria de la construcción naval ha madurado, con buques más grandes y complejos que se están produciendo a nivel nacional. Argelia se está convirtiendo en una nación de fabricación marítima creíble."
 ALG_social_contract_idea_desc: "El gobierno ha renovado su contrato social con la población, negociando la aquiescencia política para subsidios garantizados, empleo público y servicios sociales."
 ALG_sonatrach_desc: "Sonatrach, compañía nacional de petróleo y gas de Argelia, sigue siendo la columna vertebral de la economía nacional, generando la gran mayoría de los ingresos de exportación del estado."
 ALG_state_hospitals_idea_desc: "Una red de hospitales estatales proporciona acceso básico a la atención médica a todos los argelinos, aunque la insuficiencia crónica significa que la calidad varía significativamente entre las regiones."
 ALG_suppressed_opposition_desc: "La oposición política ha sido silenciada mediante una combinación de restricciones legales, control mediático e intimidación directa. El disenso es empujado bajo tierra en lugar de eliminar."
 ALG_technological_ties_desc: "Argelia ha establecido acuerdos de transferencia de tecnología con asociados extranjeros, lo que ha permitido acceder a sistemas avanzados y conocimientos especializados a cambio de concesiones económicas y diplomáticas."
 ALG_tikjda_resort_desc: "El complejo de montaña Tikjda en la región de Kabylie se está desarrollando como un destino turístico insignia, promoviendo el ecoturismo y atrayendo visitantes a las montañas Atlas de Argelia."
 ALG_universal_healthcare_idea_desc: "Argelia ha establecido un sistema de salud universal que proporciona atención médica gratuita o subvencionada a todos los ciudadanos, financiado con cargo a impuestos generales e ingresos por hidrocarburos."
 ALG_university_expansion_desc: "Se están creando nuevas universidades en todo Argelia, ampliando el acceso a la educación superior y produciendo graduados equipados para las demandas de la economía moderna."
 ALG_welfare_state_idea_desc: "Argelia ha construido un amplio estado de bienestar que proporciona apoyo a la vivienda, atención sanitaria, educación y asistencia para los ingresos, financiado en gran medida por los ingresos del petróleo y el gas."
 FIS_al_aqsa_faction: "La Coalición Al-Aqsa"
 Algeria_desc: "Algeria"
 AlgeriaFocusEvents_desc: "Enfoque-congresión a eventos para Argelia."
 algeria_focus_desc: "Árbol de enfoque nacional de Argelia que cubre las trayectorias políticas, económicas, militares y extranjeras."
 algerian_focus_desc: "Árbol de enfoque nacional de Argelia que cubre las trayectorias políticas, económicas, militares y extranjeras."
 algeria_power_balance_desc: "El equilibrio de poder entre el gobierno civil y el establecimiento militar, que desde hace mucho tiempo ha funcionado como Estado dentro de un estado en Argelia."
 nuclear_algeria_desc: "Argelia ha cruzado el umbral nuclear, poseendo armas nucleares operacionales que alteran fundamentalmente su postura estratégica en África septentrional y en todo el Mediterráneo."
 ALG_civilian_government: "Gobierno civil"
 ALG_civilian_government_desc: "Por primera vez en decenios, Argelia se rige por una administración verdaderamente civil. El ejército ha retrocedido de la intervención política directa, permitiendo que los funcionarios electos dirijan."
 ALG_corrupt_generals: "Generales corruptos"
 ALG_corrupt_generals_desc: "Los altos mandos militares están llenos de corrupción. Los generales que han crecido ricos a través de décadas de patrocinio resisten cualquier reforma que amenaza sus intereses económicos."
 ALG_government_led_disaster: "Gobierno Respuesta a las situaciones de desastre"
 ALG_government_led_disaster_desc: "El Estado ha tomado el control directo de la respuesta a los desastres, desplegando recursos públicos a escala. Aunque costoso y burocrático, la intervención está produciendo resultados reales sobre el terreno."
 ALG_no_disasters_plan: "No Plan de Contingencia ante Desastres"
 ALG_no_disasters_plan_desc: "Argelia no tiene un marco dedicado a la respuesta en casos de desastre. Cuando se producen crisis, la falta de planificación coordinada conduce a respuestas estatales retrasadas e ineficaces que empeoran los resultados."
 ALG_olympic_preparation: "Programa de Preparación Olímpica"
 ALG_olympic_preparation_desc: "Argelia está invirtiendo fuertemente en la preparación para acoger los Juegos Olímpicos, construir infraestructura deportiva de clase mundial y poner en marcha programas nacionales de desarrollo atlético."
 algerian_empowered_sharia_courts: "Empoderamiento de los tribunales de la sharia"
 algerian_empowered_sharia_courts_desc: "Se ha ampliado la jurisdicción de los tribunales islámicos, dando mayor influencia a las autoridades religiosas sobre asuntos civiles y familiares y cambiando el marco jurídico de Argelia hacia la sharia."
 algerian_gulen_movement: "Movimiento inspirado en Gulen"
 algerian_gulen_movement_desc: "Una red inspirada en el movimiento Gulen se ha integrado en la educación argelina y la sociedad civil, promoviendo un enfoque islámico modernista y creando una influencia significativa en las instituciones estatales."
 algerian_scientific_ventures: "Venturas científicas argelinas"
 algerian_scientific_ventures_desc: "Una oleada de empresas científicas conjuntas con socios extranjeros está impulsando un renacimiento en la investigación argelina, con nuevos proyectos en energía renovable, computación y ciencias materiales ganando reconocimiento internacional."
 hoggar_nuclear_facility_idea: "Instalación nuclear de Hoggar"
 ALG_2014_oil_crash_idea_desc: "La caída del precio del petróleo de 2014 asoló los ingresos por hidrocarburos de Argelia, exponiendo la fragilidad de su modelo económico dependiente de recursos y forzando recortes dolorosos al gasto público."
 ALG_AU_pressure_idea_desc: "La Unión Africana está ejerciendo presión diplomática sobre Argelia sobre una cuestión regional, limitando sus opciones de política exterior y complicando sus relaciones con los Estados vecinos."
 ALG_black_market_desc: "Un próspero mercado negro se ha desarrollado a la sombra del estado, socavando las estadísticas de comercio oficiales, privando al gobierno de los ingresos fiscales y alimentando redes de delincuencia organizada."
 ALG_clean_government_desc: "Una nueva generación de funcionarios tecnócratas ha traído mayor transparencia y rendición de cuentas al gobierno. La corrupción está disminuyendo y la confianza pública en las instituciones estatales se está recuperando lentamente."
 ALG_decline_of_tourism_desc: "El sector turístico de Argelia está en grave disminución. Los problemas de seguridad, la infraestructura deficiente y el difícil régimen de visados han hecho que el país no sea atractivo para los visitantes extranjeros, lo cual ha costado gravemente a la economía."
 ALG_destroyed_agriculture_desc: "El sector agrícola de Argelia ha sido devastado por el conflicto y el abandono. Farmland miente a barbecho, las comunidades rurales han sido desplazadas y la dependencia de importación de alimentos ha aumentado considerablemente."
 ALG_election_time_idea_desc: "Se está llevando a cabo una campaña electoral, que domina la agenda política y crea oportunidades e inestabilidad ya que las facciones competidoras movilizan sus bases."
 ALG_emergency_budget_desc: "El Gobierno ha puesto en marcha disposiciones presupuestarias de emergencia, reduciendo los gastos no esenciales y reorientando recursos para hacer frente a una crisis económica o de seguridad aguda."
 ALG_idea_joint_military_arab_desc: "Argelia ha entrado en un marco militar conjunto con los asociados árabes, lo que permite una planificación coordinada de la defensa, una inteligencia compartida y ejercicios combinados de capacitación en toda la región."
 ALG_insurgency_unleashed_desc: "Argelia ha cultivado deliberadamente redes insurgentes en un estado vecino, utilizando proxies irregulares para proyectar el poder y desestabilizar rivales sin compromiso militar directo."
 ALG_national_dialogue_modifier_desc: "Un proceso de diálogo nacional ha reunido al gobierno y a la oposición, creando un espacio raro para la negociación política y reduciendo el riesgo inmediato de confrontación."
 ALG_political_repression_desc: "El Estado está llevando a cabo una represión política sistemática, arrestando activistas, censurando los medios de comunicación y utilizando servicios de seguridad para silenciar el disentimiento y mantener el control."
 ALG_repression_modifier_desc: "Una ola de represión ha pasado por la esfera política argelina. Se están deteniendo cifras de oposición, se está silenciando a los medios de comunicación y se están dispersando por la fuerza las manifestaciones públicas."
 ALG_sahara_expansion_1_desc: "La desertificación está avanzando en las zonas agrícolas del sur de Argelia. Se presentan los primeros signos de expansión saharaui, amenazando a las comunidades agrícolas y reduciendo la tierra cultivable."
 ALG_sahara_expansion_2_desc: "La desertificación saharaui se ha intensificado, reduciendo la producción agrícola y desplazando a las comunidades rurales en las provincias meridionales afectadas."
 ALG_sahara_expansion_3_desc: "La desertificación sigue avanzando sin verificarse. Se ha perdido una parte significativa de tierras agrícolas antes productivas para invadir las condiciones del desierto."
 ALG_sahara_expansion_4_desc: "La expansión del Sahara se está convirtiendo en una crisis nacional. Las pérdidas agrícolas están aumentando y la migración interna desde el sur ejerce presión sobre las ciudades del norte."
 ALG_sahara_expansion_5_desc: "La mitad de la tierra agrícola del sur de Argelia está ahora amenazada. La crisis de la desertificación exige la intervención del gobierno de emergencia y la asistencia ambiental internacional."
 ALG_sahara_expansion_6_desc: "La desertificación ha alcanzado un umbral crítico. Se han abandonado los distritos agrícolas enteros y los costos económicos de la crisis están agotando considerablemente el presupuesto nacional."
 ALG_sahara_expansion_7_desc: "La emergencia de la desertificación está remodelando la geografía de Argelia. La migración masiva de dunas está invadiendo la infraestructura y la pérdida de tierras agrícolas está acelerando la inseguridad alimentaria."
 ALG_sahara_expansion_8_desc: "La expansión saharaui ha devastado el sector agrícola meridional de Argelia. La magnitud de la pérdida de tierras está provocando una crisis humanitaria entre las comunidades agrícolas desplazadas."
 ALG_sahara_expansion_9_desc: "La desertificación ha consumido la mayoría de las tierras agrícolas del sur de Argelia. Los esfuerzos de rehabilitación están luchando contra la escala del colapso ecológico."
 ALG_sahara_expansion_10_desc: "El sur agrícola de Argelia ha sido casi totalmente tragado por el Sahara. La catástrofe ambiental es irreversible a escala actual sin intervenciones masivas de reforestación y ordenación del agua."
 ALG_surveillance_state_modifier_desc: "Argelia ha construido una sofisticada infraestructura de vigilancia nacional, supervisando las comunicaciones y rastreando las actividades de los opositores políticos y los agentes de la sociedad civil."
 ALG_transparent_budget_desc: "Argelia ha presentado informes presupuestarios transparentes, publicando desglose detallado del gasto público y haciendo que las cuentas gubernamentales sean accesibles por primera vez al escrutinio independiente."
 algeria_cultural_rebirth_desc: "Una poderosa ola de avivamiento cultural nacionalista está barriendo Argelia, elevando el patrimonio y la historia indígenas mientras margina las influencias culturales extranjeras."
 algeria_emerging_youth_desc: "Está surgiendo una generación de jóvenes argelinos comprometidos políticamente, impulsando la reforma democrática y las oportunidades económicas con creciente asertividad."
 algeria_nationalist_youth_desc: "El movimiento juvenil de Argelia ha tomado un giro fuertemente nacionalista, exigiendo una política exterior más firme y un fin a lo que ven como compromiso del antiguo guardia con los intereses extranjeros."
 hoggar_nuclear_facility_idea_desc: "En lo profundo de las montañas Ahaggar, se ha establecido una instalación de investigación nuclear en un sitio remoto. Su existencia sirve como un poderoso disuasivo para el aventurismo extranjero."
 idea_alg_empowered_parliament_desc: "El Parlamento de Argelia ha recibido verdadera autoridad legislativa. La sala tiene ahora un poder real sobre el presupuesto, la legislación y la rendición de cuentas ministerial."
 idea_algerian_oligarchy_arrests_desc: "El arresto de oligarcas clave ha sacudido la élite empresarial de Argelia. Aunque es popular entre el público, la represión ha creado incertidumbre que está congelando la inversión privada."
 ALG_flavor_event.6.t: "Crisis de refugiados"
 ALG_flavor_event.6.d: "Las oleadas de refugiados atraviesan nuestras fronteras, huyendo del conflicto y la inestabilidad en los países vecinos. Nuestra infraestructura es tensa y nuestro pueblo está dividido en cómo responder."
 ALG_flavor_event.6.a: "Debemos absorberlos."
 ALG_flavor_event.7.t: "Crisis del tráfico de drogas"
 ALG_flavor_event.7.d: "Las redes delictivas organizadas han convertido a Argelia en un importante corredor de tránsito para los estupefacientes. El comercio de drogas está corrompiendo a las instituciones locales y fomentando la violencia en las regiones fronterizas."
 ALG_flavor_event.7.a: "Arrastre a los traficantes."
 fra_colonial.1.t: "La sombra del pasado"
 fra_colonial.1.d: "Argel ha denunciado formalmente el legado colonial de Francia en Argelia, reiniciando viejas heridas e inflamando la opinión pública a ambos lados del Mediterráneo. Nuestro parlamento está dividido, algunos exigen que estemos firmes en nuestro historial histórico, mientras otros ven una oportunidad para la reconciliación."
 fra_colonial.1.a: "Defender nuestro historial histórico."
 fra_colonial.1.b: "Ofrezca un gesto de reconciliación."
 algerian_event.51.d: "Contra todo, el programa espacial de Argelia ha logrado lo extraordinario, nuestra nave espacial ha aterrizado con éxito en la Luna. Este triunfo de la ingeniería y la voluntad nacional ha electrificado al pueblo argelino y colocado nuestra bandera entre las estrellas."
 ALG_aouchiche_desc: "Youcef Aouchiche es un reformista liberal y líder del Frente de las Fuerzas Socialistas. Un crítico vocal del establecimiento gobernante, hizo campaña por la reforma democrática, las libertades civiles y la modernización económica."
 ALG_hassani_desc: "Abdelali Hassani Cherif es el líder del Movimiento de la Sociedad por la Paz, el principal partido islamista de Argelia. Aboga por un islam político moderado alineado con las normas democráticas y la reconciliación nacional."
 algeria_elections.a: "Así que está decidido."
 alg_military_rule_option: "Apoya la decisión del ejército."
 AlgeriaPoliticalEvents.1.t: "El reajuste político de Argelia"
 AlgeriaPoliticalEvents.1.d: "Con el Decenio Negro acercándose, Argelia se enfrenta a una opción fundamental sobre su futura orientación política. La asociación occidental, la no alineación o los vínculos más estrechos con el Este, cada camino conlleva profundas consecuencias para la identidad y estabilidad del país."
 AlgeriaPoliticalEvents.1.a: "Abre el debate nacional."
 AlgeriaPoliticalEvents.20.t: "Ideológico en el gobierno"
 AlgeriaPoliticalEvents.20.d: "Con el conflicto atenuado, la presión aumenta dentro del gobierno para definir el futuro sistema político de Argelia. Los corredores exigen el dominio militar, los moderados impulsan la reconciliación y la reforma, mientras que las facciones islamistas piden elecciones libres."
 AlgeriaPoliticalEvents.20.a: "Empoderar a los militares."
 AlgeriaPoliticalEvents.20.b: "Empujar por la reforma y la reconciliación."
 AlgeriaPoliticalEvents.20.c: "Negociar con los islamistas."
 Algeria.8.t: "Argelia solicita protección"
 Algeria.8.d: "El gobierno argelino ha solicitado oficialmente garantías de protección o seguridad estadounidenses, citando una creciente inestabilidad regional. Washington debe decidir si extender su paraguas estratégico."
 Algeria.8.a: "Aceptamos la solicitud."
 Algeria.8.b: "No podemos comprometernos con esto."
 ALG_alignments: "Alineación de la política exterior"
 KBY_alg_modifier: "Modificadores del estado de Kabyle"
 ALG_algiers_metro: "Corredor de Metro de Argel"
 ALG_diplomatic_outreach_west: "Extensión diplomática a Occidente"
 ALG_diplomatic_outreach_west_desc: "La relación de Argelia con Washington y sus aliados europeos se ha definido por sospecha mutua. Una iniciativa diplomática sostenida podría sentar las bases para estrechar los vínculos económicos y de seguridad con el mundo occidental."
 ALG_diplomatic_outreach_china: "Diplomático alcance a China"
 ALG_diplomatic_outreach_china_desc: "Beijing ha venido ampliando constantemente su presencia en todo el continente africano. La profundización de los vínculos con China podría desbloquear una inversión importante en infraestructura y abrir nuevos mercados, aunque pueda complicar las relaciones con los asociados occidentales."
 monitor_kabyle_unrest_desc: "Las montañas de Kabylie han sido un punto de inflamación persistente. Los servicios de seguridad deben mantener una vigilancia estrecha de la actividad de resistencia en la región para evitar la escalada."
 kabyle_resistance_tooltip: "La actividad de resistencia en Kabylie sigue siendo elevada."
 ALG_boost_reformists_desc: "Dentro de la estructura política opaca de Argelia, una facción de tecnócratas y modernistas ha estado impulsando una verdadera reforma. Proporcionándoles cobertura política y recursos podría cambiar el equilibrio interno del poder hacia la apertura."
 ALG_boost_old_guard_desc: "La red establecida de oficiales militares y veteranos del FLN que construyeron el estado post-independencia están creciendo ansiosos por el ritmo del cambio. Reafirmando su posición y sus prerrogativas aumentarán la estabilidad, pero afianzarán el statu quo."
 ALG_rally_students_desc: "Los campus universitarios han sido históricamente el motor del cambio político argelino. Organizar asociaciones estudiantiles detrás de la agenda reformista puede generar presión desde abajo y cambiar el discurso público."
 ALG_mobilize_veterans_desc: "Los veteranos de la guerra de independencia y del Decenio Negro tienen una enorme autoridad moral en la sociedad argelina. Enfrentarlos detrás del orden existente da legitimidad a la posición del Estado en el actual concurso político."
 ALG_bribe_elites_desc: "Buena parte de la estructura de poder de Argelia opera mediante redes informales de clientelismo y favores. Repartir contratos, nombramientos y beneficios financieros a figuras clave puede consolidar la lealtad, aunque profundiza la corrupción que ya corroe al Estado."
 ALG_seek_compromise_desc: "Con ambos lados del debate interno arraigado, un esfuerzo de mediación neutral puede ser la única manera de evitar que un estancamiento se sumerge en una confrontación abierta. Un compromiso no satisfará a nadie completamente, pero puede evitar lo peor."
 ALG_media_campaign_reform_desc: "Los medios privados controlados por el Estado y simpáticos pueden estar dirigidos a construir una narrativa sobre la necesidad de renovación política. La forma de la opinión pública a favor de la reforma cambia el terreno bajo la vieja guardia."
 ALG_security_crackdown_desc: "El aparato de seguridad puede estar dirigido a reprimir las protestas, los medios independientes y los grupos de la sociedad civil que alimentan el movimiento de reforma. Esto va a comprar tiempo, pero almacena problemas más grandes para después."
 ALG_world_tension_security_desc: "La creciente inestabilidad en la región da al estamento militar nuevos argumentos para mantener la política firmemente bajo su control. Aprovechar este clima puede consolidar la posición de la vieja guardia."
 ALG_world_tension_high_security_desc: "Con los conflictos regionales que se extienden hacia las fronteras de Argelia, el ejército está impulsando a las potencias de emergencia que de manera eficaz harían suyas a los defensores de la reforma civil. La crisis cubre, pero la suspensión de la competencia política conlleva riesgos a largo plazo."
 ALG_path_crackdown_momentum_desc: "La represión está mostrando resultados. Mantener el impulso a través de operaciones de seguridad adicionales y la presión política profundizará la retención del antiguo guardia en el estado, pero cada paso hace que la inversión sea más difícil."
 ALG_path_reconciliation_momentum_desc: "El proceso de reforma está ganando tracción. Presionar con medidas adicionales de fomento de la confianza y aperturas políticas puede llevar a cabo el programa de reconciliación más allá del punto de no retorno."
 ALG_oil_patronage_desc: "La bonanza de hidrocarburos de Argelia se ha usado durante mucho tiempo para comprar paz social. Redirigir una parte de los ingresos petroleros hacia un clientelismo selectivo puede asegurar la lealtad de grupos clave en la actual disputa política."
 ALG_economic_reforms_desc: "La economía de Argelia, dominada por el Estado, es profundamente ineficiente. Un paquete creíble de reformas económicas, que abra espacio a la empresa privada y reduzca los obstáculos burocráticos, podría inclinar el sentir popular hacia el bando reformista."
 ALG_ter_oboronaup_start_desc: "Con el país en guerra, el Guardia Nacional está pidiendo la formación de unidades de defensa territorial reclutadas localmente para mantener las zonas traseras y formaciones regulares libres del ejército para operaciones en primera línea."
 ALG_internalup_start_desc: "La situación requiere el despliegue de tropas de seguridad interna dedicadas a mantener el orden detrás de las líneas delanteras, proteger la infraestructura crítica y evitar que el enemigo explote inestabilidad en la parte trasera."
 ALG_casablanca_mission: "Perseguir el Arreglo de Casablanca"
 ALG_eliminate_GIA: "Eliminar el GIA"
 ALG_eliminate_GIA_desc: "El Grupo Islámico Armado representó una vez el rostro más brutal de la insurgencia. Con sus redes fracturadas y colapso del apoyo público, el estado ahora se mueve a desmantelar los restos finales de la organización y restaurar el orden en todo el país."
 ALG_reintegration_programs: "Programas de reintegración"
 ALG_reintegration_programs_desc: "Años de violencia han dejado a miles de ex combatientes y simpatizantes esparcidos por toda la sociedad argelina. Mediante programas de reintegración cuidadosamente supervisados, el gobierno ofrecerá un camino de regreso a la vida civil para aquellos que estén dispuestos a abandonar la insurgencia."
 ALG_strengthen_DRS: "Fortalecer el DRS"
 ALG_strengthen_DRS_desc: "El Departamento de Renseignement et de la Sécurité ha desempeñado un papel decisivo en la lucha contra las redes extremistas durante el Decenio Negro. Fortalecer las capacidades de nuestros servicios de inteligencia asegurará que Argelia no vuelva a descender en tal caos."
 ALG_coalition_economic_program_tt: "La coalición presidencial lanza un programa de desarrollo económico coordinado."
 ALG_governmental_transparency_tt: "El gobierno se compromete a reformar la transparencia, debilitando la corrupción arraigada pero enojando los intereses militares."
 ALG_ethnic_satisfaction_critical: "§RAbrid la hostilidad§!"
 ALG_ethnic_satisfaction_low: "§YResentimiento profundo§!"
 ALG_ethnic_satisfaction_moderate: "§Y Tensiones inmersas§!"
 ALG_ethnic_satisfaction_high: "§GContenido relativamente§!"
 ALG_deep_state_map_name: "Argel - Centro de Poder"
 ALG_hybrid_military_governance: "Gobierno militar híbrido"
 ALG_hybrid_military_governance_desc: "Argelia opera bajo un sistema híbrido en el que los militares mantienen una influencia política significativa mientras se mantienen las estructuras civiles."
 ALG_civil_war_brewing_added_tt: "§R£generic_warning RAE DE GUERRA CIVIL§!\nLa resistencia fallida al golpe de Estado ha desestabilizado a Argelia."
 ALG_accepted_foreign_intervention: "Asistencia aceptada contra el estado profundo"
 ALG_military_coup_opinion: "Golp militar en Argelia"
 ALG_fulfilled_election_promise: "La democracia restablecida como se prometió"
 ALG_broke_election_promise: "Promesa rota de celebrar elecciones"
