 TT_ALG_KICKING_ASSADS_EFFECT: "Inclusividad política alawita: §R-40%§!"
 TT_ALG_REPUBLICANISM_FOCUS_EFFECT: "Por cada comunidad étnica y religiosa importante de Argelia elegiremos entre reservar escaños en el Parlamento para políticos que representen a las comunidades que aumentan la inclusión minoritaria a cambio de aumentar los costos de corrupción, o no hacerlo lo que causará disturbios y daños de propiedad en sus regiones siempre que su inclusión política sea inferior §Y50%§!"
 TT_ALG_FEDERALISM_FOCUS_EFFECT: "Para cada comunidad étnica y religiosa significativa en Argelia elegiremos entre otorgarles semiautonomía aumentando su inclusión política a cambio de la reducción de la extracción de recursos, la velocidad de construcción y las tragamonedas de edificios, así como el aumento del costo para cambiar el derecho gubernamental inversamente proporcional a la inclusión política de la comunidad, o liberar la región por completo como Estado autónomo"
 TT_ALG_DIRECT_DEMOCRACY_REQ: "Para que nuestra democracia directa funcione, el estado debe ser secularizado, y la amenaza del terror debe volverse inexistente. Así como la sociedad pacificó de los ideales salafistas radicales"
 TT_ALG_SECULARIZE_CONSTITUTION: "Dependiendo de las reformas y políticas adoptadas, llegaremos a ser una Democracia Liberal o una Democracia Illiberal"
 TT_ALG_ALLY_FARMERS: "Los agricultores se unirán a nosotros como una facción interna en nuestra lucha"
 TT_ALG_ALLY_INDUSTRIALISTS: "Los conglomerados industriales se unirán a nosotros como una facción interna en nuestra lucha"
 TT_ALG_ALLY_ULEMA: "El ulema se unirá a nosotros como una facción interna en nuestra lucha"
 TT_ALG_ALLY_INTL_BANKERS: "Los banqueros internacionales nos unirán como una facción interna en nuestra lucha"
 TT_ALG_AGRICULTURAL_INVESTMENT_EFFECT: "Invertir en la agricultura varias veces permitirá que nuevos mercados y empresas vendan los productos. Sin embargo, el número de inversiones necesarias para que las nuevas empresas propicien se ve influenciado por el nivel de corrupción"
 ALG_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§Y Invitaremos a un partido a la coalición. El partido nos beneficiará en gran medida en participar en su causa respectiva, ya sea centralización o descentralización durante el balance de la potencia§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§C Tener a este partido en coalición nos beneficiará enormemente en la centralización durante el proceso de equilibrio del poder§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§GEl hecho de que este partido en coalición nos beneficie enormemente en la Descentralización durante el proceso de equilibrio del poder§!"
 ALG_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "Si tenemos éxito ganaremos §G75§! poder político y §YPróximos burócratas§! Ideas otorgadas §G+0.5§! §YGanancia del poder político diario§! y §G+0.2§! §YVelocidad de construcción§! para §Y100§! días"
 ALG_STATE_DECISION_MAKING_SUCCESS_EFFECTS: "Si tiene éxito ganaremos §G5%§! de estabilidad"
 ALG_LOCAL_ACCOUNTABILITY_SUCCESS_EFFECTS: "Si tenemos éxito ganaremos §G10%§! popularidad del partido y disminuir la corrupción"
 ALG_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "Si tenemos éxito disminuiremos la corrupción y ganaremos §Y Levántate de las organizaciones voluntarias§! otorgando §G0.2§! ganancia diaria del poder político y §G+30%§! velocidad de construcción para §Y100§! días"
 ALG_ENCOURAGE_ECONOMIC_SELF_RELIANCE: "Si tenemos éxito aumentaremos nuestro ciclo de crecimiento económico"
 TT_ALG_KURDS_WITHOUT_CITIZENSHIPS_PARTY_FORMATION: "§GUna vez removidos por la concesión de ciudadanías a kurds después de arrancar el assad, formarán un partido político que busca transformar Argelia en una Federación§!"
 ALG_ECONOMIC_DECISIONS_ONE_FREE_FACTORIES_EXPLANATION: "§RHay por lo menos un complejo industrial disponible pero no asignado a la construcción. Cancelar cualquier construcción que hayas asignado o espera hasta que termine y esté disponible§!"
 ALG_ECONOMIC_DECISIONS_TWO_FREE_FACTORIES_EXPLANATION: "§RHay por lo menos dos complejos industriales disponibles pero no asignados a la construcción. Cancelar cualquier construcción que hayas asignado o espera hasta que termine y esté disponible§!"
 ALG_ECONOMIC_DECISIONS_THREE_FREE_FACTORIES_EXPLANATION: "§RHay por lo menos tres complejos industriales disponibles pero no asignados a la construcción. Cancelar cualquier construcción que hayas asignado o espera hasta que termine y esté disponible§!"
 ALG_FEDERAL_FORMATION_TOOLTIP: "Si tenemos todos los valores de inclusividad minoritaria §Y50%§! o más el §GAlgerian Federation§! se formará"
 ALG_UNITARY_FORMATION_TOOLTIP: "Si tenemos todos los valores de inclusividad minoritaria en §Y50%§! o más se formará la §C República Algeriana§!"
 ALG_tech_name: "Bono técnico"
 TT_ALG_CORRUPTION_COSTS: "Cuanto más corruptas sean nuestras instituciones más costosas serán nuestras inversiones"
 ALG_algeria_invite_ciw: "§C Invitaremos a cada nación islámica a CIW§!"
 dyn_ALG_tt: "¡El efecto de este enfoque depende de las perspectivas del gobierno argelino!"
 ALG_islamist_opposition_victory: "Gobierno de oposición islamista"
 ALG_islamist_opposition_victory_desc: "La coalición islamista de oposición ha ganado las elecciones y se encargará de llevar a Argelia a convertirse en una república islámica conservadora"
 ALG_islamist_renaissance: "Islamist Renaissance"
 ALG_islamist_renaissance_desc: "Nuestra victoria ha reforzado nuestro apoyo a través de las masas. Una nueva cultura ha evolucionado y todos estamos para apoyarla"
 ALG_empower_sharia_courts: "Empoderamiento de los tribunales cherámicos"
 ALG_empower_sharia_courts_desc: "Es hora de empoderar al poder judicial islámico y expandir su influencia"
 ALG_turkish_inspired_islamism: "El islamismo inspirado en Turquía"
 ALG_turkish_inspired_islamism_desc: "Nos inspiraremos en los movimientos islamistas que tuvieron lugar en pavo después del establecimiento de su república. Esto pintará nuestro movimiento en una luz más favorable por ahora y puede atraer a hombres de negocios conservadores turcos para invertir en nuestro país."
 ALG_deregulate_economy: "Economía desregular"
 ALG_deregulate_economy_desc: "Para empoderar a las clases medias y comerciantes de los que sacamos mucho de nuestro apoyo, reduciremos las restricciones sobre ellos y proporcionaremos el espacio necesario para su crecimiento"
 ALG_moderate_conservatism: "Conservatismo moderado"
 ALG_moderate_conservatism_desc: "Arrastraremos elementos extremistas dentro de nuestras filas y reformaremos nuestra imagen como una fuerza para el conservadurismo que no tiene nada que ver con el fanatismo religioso"
 ALG_religious_values: "Nuestros valores indeseables"
 ALG_religious_values_desc: "Es posible que nuestras políticas anteriores para apaciguar la población y suavizar nuestra imagen nos hayan permitido alejarnos de los verdaderos valores en los que se construyen nuestros ideales. Nos preocupa menos por lo que otros nos ven y nuestro único objetivo es establecer la sharia en nuestras tierras sin importar cuán impopular puede ser"
 ALG_religious_economic_charity: "Donaciones religiosas"
 ALG_religious_economic_charity_desc: "Nuestros movimientos siempre se han asociado con organizaciones benéficas y fundaciones que han sido beneficiosas para nuestras comunidades. Ahora que tenemos una posición más prominente los institucionalizaremos aún más para aliviar nuestras cargas económicas"
 ALG_qatari_support: "Apoyo de Qatar"
 ALG_qatari_support_desc: "Hemos atraído el interés de varios inversores qatari"
 ALG_flourishment_of_central_economy: "Desarrollar centros urbanos"
 ALG_flourishment_of_central_economy_desc: "Nuestra base de apoyo proviene principalmente de varias regiones urbanas y debemos empezar a desarrollarlas para encarnar nuestro apoyo de su población"
 ALG_turkish_investments: "Inversiones turcas"
 ALG_turkish_investments_desc: "Hemos atraído a muchos inversores turcos gracias a nuestras políticas de desregulación, así como nuestras similitudes ideológicas con ellos"
 ALG_reverse_secularization: "Secularización inversa"
 ALG_arm_palestinians_to_fight: "Los palestinos del brazo"
 ALG_arm_palestinians_to_fight_desc: "Jordania alberga a una gran población de refugiados palestinos. Podemos convertir a estos refugiados en combatientes, e instigarlos para causar estragos en Palestina e Israel. Ya que son luchadores proxy, podemos utilizarlos para instigar a Israel a tomar represalias, haciéndolos parecer el malo en el conflicto"
 ALG_zionist_threat: "La amenaza sionista"
 ALG_zionist_threat_desc: "Israel es la mayor afrenta a todos los musulmanes, y un estado falso abominable en el corazón del Islam. Necesitan ser limpiados de la faz de la tierra."
 ALG_help_sahara: "Nuestros amigos saharianos"
 ALG_help_sahara_desc: "Estamos en contacto con muchos movimientos que apoyan nuestra causa panárabe, uno de estos movimientos es el Frente Polisario, que busca liberar al pueblo del Sahara Norte. Durante el siglo pasado, el Polisario luchó contra la opresión colonial y luego marroquí y ahora el Fron controla sólo una pequeña zona del Sahara Occidental. Por el momento el conflicto está congelado, pero podemos cambiar que enviando a nuestros amigos ayuda militar y equipando al saharaui con todo lo que necesitan para continuar su lucha."
 algeria.42.t: "¡Apoyo de armas desde [FROM.GetName]!"
 algeria.42.d: "¡Nos enviaron armas!"
 algeria.42.a: "Genial."
 algeria.43.t: "¡Argelia emite una protesta diplomática!"
 algeria.43.d: "El presidente argelino Abderrazak Makri emitió una protesta diplomática contra nuestro gobierno. Afirma que somos terroristas y la comunidad internacional debe comenzar una operación especial para liquidar nuestro régimen."
 algeria.43.a: "Váyase, Makri."
 ALG_support_fsa: "Apoyo a las FSA"
 ALG_support_fsa_desc: "Nuestras relaciones con Siria tienen una larga historia. Ahora las relaciones deben definirse por su relación con la ideología de la hermandad."
 ALG_brotherhood_diplo: "Diplomacia de Hermandad"
 ALG_brotherhood_diplo_desc: "Debemos reformar nuestra diplomacia de acuerdo con nuestro nuevo gobierno."
 ALG_hamas_under_wing: "Hamás bajo nuestro amor"
 ALG_hamas_under_wing_desc: "Hamás es un grupo de luchadores por la libertad ubicados en la Franja de Gaza que están asociados con la Hermandad Musulmana. ¡Ayudarlos es nuestro deber!"
 algeria.44.t: "Hamás controla Gaza"
 algeria.44.d: "Hamás, con apoyo de Algería, ha tomado el control de la Franja de Gaza. Sus milicias armadas tomaron el control de los edificios del gobierno, y su portavoz [HAM.GetLeader] ha declarado que el grupo se está preparando para marchar para liberar la mezquita Al-Aqsa"
 algeria.44.a: "Damn"
 ALG_letter_isr: "Israeli Manipulation"
 ALG_letter_isr_desc: "Oh, Israel! TIme ha venido a decidir qué hacer contigo."
 MSP_letter_isr: "Israeli Manipulation"
 MSP_letter_isr_desc: "Oh, Israel! TIme ha venido a decidir qué hacer contigo."
 ALG_und_supp_hamas: "Apoyo encubierto de Hamás"
 ALG_und_supp_hamas_desc: "Para que la causa de Hamás tenga éxito, debemos apoyarlos materialmente."
 ALG_org_of_isl_coop: "Organización de Cooperación Islámica"
 ALG_org_of_isl_coop_desc: "La Organización de Cooperación Islámica, antiguamente la Organización de la Conferencia Islámica, es una organización intergubernamental fundada en 1969, integrada por 57 Estados miembros, y 48 son países de mayoría musulmana."
 MSP_und_supp_hamas: "Apoyo encubierto de Hamás"
 MSP_und_supp_hamas_desc: "Para que la causa de Hamás tenga éxito, debemos apoyarlos materialmente."
 MSP_org_of_isl_coop: "Organización de Cooperación Islámica"
 MSP_org_of_isl_coop_desc: "La Organización de Cooperación Islámica, antiguamente la Organización de la Conferencia Islámica, es una organización intergubernamental fundada en 1969, integrada por 57 Estados miembros, y 48 son países de mayoría musulmana."
 algeria.49.t: "Argelia pide que ponga en libertad a Omar Abdel-Rahman"
 algeria.49.d: "En su carta, Makri mencionó brevemente que nos pide liberar a Omar Abdel-Rahman, condenado por el bombardeo de 1993 del World Trade Center en la ciudad de Nueva York, junto con los muchos egipcios que fueron arrestados durante la revolución. Un portavoz de la Hermandad dijo más tarde que la extradición se propone por razones humanitarias y que Makri no tenía intención de anular las condenas criminales de Abdel-Rahman."
 algeria.49.a: "Is Makri Insane?"
 algeria.49.b: "¿Seguro?"
 ALG_supp_plo: "Apoyar la OLP"
 ALG_supp_plo_desc: "La Organización de Liberación de Palestina (OLP) ha sido desde hace mucho tiempo un actor clave en la lucha por la libre determinación palestina. Apoyar la OLP podría reforzar nuestra posición con los aliados internacionales y promover una solución pacífica al conflicto."
 ALG_the_pal_issue: "El problema palestino"
 ALG_the_pal_issue_desc: "La cuestión de Palestina sigue siendo una cuestión fundamental en nuestra política exterior. Nuestra postura sobre la lucha palestina definirá nuestras alianzas internacionales e influencia en la región. Debemos decidir cómo abordar este conflicto en curso."
 ALG_supp_hamas: "Apoyo a Hamás"
 ALG_supp_hamas_desc: "Hamás representa una importante facción dentro de la resistencia palestina. Al brindar apoyo, podemos fortalecer nuestros vínculos con este grupo, potenciar nuestra influencia en la región y alinearnos con su lucha."
 ALG_Get_rid_of_military_corrupt: "Purga Los Corrupts Militares"
 ALG_Get_rid_of_military_corrupt_desc: "Los militares están arraigados en nuestras instituciones y son una clara amenaza para el futuro de nuestro país. Los arrestaremos por cargos de corrupción y confiscaremos qué propiedades podemos poner en nuestras manos."
 idea_algerian_oligarchy_arrests: "Policía militar"
 ALG_the_coalition: "La Coalición"
 ALG_the_coalition_desc: "Después de restablecer los partidos políticos, dos fuerzas notables han aumentado. Uno defiende la federalización del Estado y el otorgamiento de más poder a las provincias, mientras que los otros defensores por consolidar la autoridad centralizada y mantener una república centralizada unida. Tendremos que elegir cuidadosamente con quién deberíamos alinearnos."
 ALG_dismantle_the_military: "Desmantelamiento del presupuesto militar"
 ALG_dismantle_the_military_desc: "Muchas de las defensas han sido malversadas y dirigidas hacia proyectos inútiles debido a la corrupción arraigada dentro de las instituciones de nuestras fuerzas armadas. Reprobaremos y venderemos gran parte de lo que podemos conseguir en nuestras manos y, si bien esto puede debilitar a nuestros militares y hacernos propensos a las amenazas, este es un paso necesario hacia la recuperación económica y el arraigo de corrupción"
 ALG_empower_institutions: "Empoderamiento de las instituciones"
 ALG_empower_institutions_desc: "Nuestras instituciones son muy débiles y despreocupadas. Esto se debe a que el poder está concentrado en el presidente y poco poder dado al parlamento, así como un estado controlado medios de comunicación que apoyan una atmósfera que restringe las libertades personales. La redacción de una nueva constitución que garantice la distribución y liberalización del poder es un paso crucial hacia el futuro"
 ALG_western_supported_economic_relief: "Socorro occidental"
 ALG_western_supported_economic_relief_desc: "Nuestros ideales se alinean con los del oeste e incluso nos permitieron establecer nuestros partidos en sus países. Pondremos los lazos con ellos y pediremos alivio a cambio de influencias económicas"
 ALG_liberalize_society: "Liberalizar la sociedad"
 ALG_liberalize_society_desc: "La gente es ajena a los valores de libertad e igualdad. Debemos trabajar para alentarlos a valorar sus libertades."
 ALG_scientific_ventures: "Ventures Scientific"
 ALG_scientific_ventures_desc: "Mediante el apoyo a becas y la actualización de nuestros programas escolares anticuados podremos avanzar en el sector científico del país"
 Algeria_student_exchanges: "Intercambios de estudiantes"
 ALG_banish_authoritarian_influence: "Desterrar la influencia autoritaria"
 ALG_banish_authoritarian_influence_desc: "Muchos estados autoritarios como Irán y Rusia han tenido una gran presencia aquí. Ahora que somos un estado libre es hora de acabar con su influencia en nuestras instituciones y economía"
 ALG_democratic_socialism: "Socialismo democrático"
 ALG_democratic_socialism_desc: "El ruinoso estado económico de nuestro país ha dejado a nuestra población bastante pobre y subdesarrollada. La reducción de las restricciones a las empresas introducirá la explotación y la competencia injusta, ya que la desigualdad económica sigue prevaleciendo en nuestro país. Lo que necesitamos es enfocarnos en fomentar nuevas empresas en el país y darles subvenciones para permitir un amplio desarrollo económico que todas las clases de ciudadanos puedan disfrutar"
 ALG_unleash_economic_potential: "Desencadenar el potencial económico"
 ALG_unleash_economic_potential_desc: "Tenemos un gran potencial para convertirse en una potencia económica. Podemos alentar a los inversores y empresas extranjeros a establecer empresas aquí y aunque esto suponga que nuestra población se convierta en obreros baratos será nuestro gran salto hacia el desarrollo económico."
 ALG_domestic_investments: "Inversiones nacionales"
 ALG_domestic_investments_desc: "Se están creando muchas empresas domésticas jóvenes. Invertiremos en ellos para apoyar su viaje hacia la prosperidad económica"
 ALG_subsidize_local_firms: "Firmas locales"
 ALG_subsidize_local_firms_desc: "Gracias a nuestras políticas, las empresas locales están siendo reconocidas por su éxito. Tiempo para invertir en ellos"
 ALG_economic_democracy: "Igualdad económica"
 ALG_economic_democracy_desc: "Nuestro desarrollo económico ha alcanzado a todas las personas de todos los orígenes económicos haciendo frente a la desigualdad económica e incluso dio lugar a empresas nacionales exitosas. Esto es algo que debemos estar orgullosos de"
 ALG_federalisation: "Federalisation"
 ALG_federalisation_desc: "La solución es dar más poder a los estados. Esto fomentará enormemente la representación e inclusión local y remediará considerablemente los temores y tensiones sectarias. Sin embargo, esta autonomía debilitará nuestro dominio sobre los estados especialmente donde están presentes las minorías"
 ALG_algerian_investments: "Inversiones de la Diáspora"
 ALG_algerian_investments_desc: "Gracias a nuestras políticas económicamente amigas hemos atraído inversiones de la diáspora argelina que vive en el extranjero"
 ALG_invite_US_business_giants: "Invitar a Business Giants"
 ALG_invite_US_business_giants_desc: "Aunque hemos permitido que nuestra economía prospere, esto no es suficiente. Invitaremos a empresas gigantes de Estados Unidos a establecer franquicias en el país para fomentar el consumismo"
 ALG_republicanism: "Republicanism"
 ALG_republicanism_desc: "Argelia está mejor gobernada como un estado fuerte con una autoridad centralizada. Esto fortalecerá la regla de nuestro gobierno pero causará alienación y enojo de las minorías que se sienten marginadas"
 ALG_address_ethnic_divides: "Solve Divides Étnicos"
 ALG_address_ethnic_divides_desc: "Nuestro país siempre ha sido dividido y plagado de sectarismo. Deberíamos decidir cómo abordar estas cuestiones"
 ALG_EU_investments: "Inversiones de la UE"
 ALG_EU_investments_desc: "Varios países europeos buscan invertir en nuestro país"
 ALG_student_exchanges: "Intercambios de estudiantes"
 ALG_student_exchanges_desc: "Alentaremos las becas a países extranjeros para mejorar nuestra educación y mantenerla en pie de igualdad con las normas mundiales"
 ALG_democratic_victory: "Victoria democrática"
 ALG_democratic_victory_desc: ""
 ALG_new_era: "Una nueva era"
 ALG_new_era_desc: "Se llevará a cabo una nueva era para la región. Una era de paz y estabilidad, libre de opresión e injusticia"
 ALG_islamic_nato: "Islamic NATO"
 ALG_islamic_nato_desc: "Mientras que la OTAN nos brinda seguridad, los miembros de la OTAN han mostrado su completo desprecio por el Oriente Medio. Si no pueden proporcionar la estabilidad y la prosperidad, debemos tomar el manto. Formaremos nuestra propia alianza militar, la Organización del Tratado del Mediterráneo o la OMT"
 ALG_invite_iraq: "Invitar al Iraq"
 ALG_invite_iraq_desc: "Tenemos que invitar al Iraq a nuestra alianza ya que están empezando lentamente a conseguir su acto juntos, y nos beneficiaríamos seriamente de la cooperación mutua."
 ALG_invite_syria: "Invitar Siria"
 ALG_invite_syria_desc: "Tener Siria justo al sur de nuestra nación significa que somos muy vulnerables. Invitar a Siria en nuestra facción sería una gran manera de garantizar nuestra seguridad"
 ALG_invite_algeria: "Invitar a Egipto"
 ALG_invite_algeria_desc: "Egipto es un centro de poder, y con una población de su tamaño, nuestra alianza será capaz de lograr prácticamente cualquier cosa"
 ALG_assistance_to_bulgaria: "Asistencia a Bulgaria"
 ALG_assistance_to_bulgaria_desc: "Debemos ayudar a Bulgaria a desarrollar su infraestructura para que podamos realizar más inversiones fuera de sus fronteras con facilidad"
 ALG_islamic_economic_cooperation: "Cooperación Económica Islámica"
 ALG_islamic_economic_cooperation_desc: "Muchos países musulmanes nadan en dinero y usan ese dinero para cosas no sensibles. Debemos formar una alianza económica para unir nuestros recursos en un proyecto económico común"
 ALG_msp_win: "§RNOTE§!: §GTHIS FOCUS UNLOCK THE MSP FOCUS TREE! Este truco será sobredicho§!"
 algeria_news.1.t: "¡Coup militar en Argelia!"
 algeria_news.1.d: "En un rápido e inesperado giro de los acontecimientos, Argelia se encuentra sumida en la incertidumbre a medida que se desarrolla un golpe militar, derrocando al gobierno de [ALG.GetLeader]. En medio de la intensificación de las tensiones entre el partido gobernante y las facciones opositoras, el ejército argelino, encabezado por el General Ahmed Gaid Salah, toma el control del aparato estatal, suspendiendo la constitución y deteniendo figuras políticas clave. Las calles de El Cairo eruptieron en escenas de júbilo y aprensión, reflejando las profundas divisiones dentro de la nación sobre la intervención militar. La comunidad internacional observa de cerca que el futuro de Argelia está en equilibrio, con preocupaciones crecientes sobre las implicaciones para la democracia y la estabilidad en la región."
 algeria_news.1.a: "Interesting"
 algeria_news.2.t: "Argelia en un cruce de caminos"
 algeria_news.2.d: "Después de casi una década de derramamiento de sangre e inestabilidad, Argelia se encuentra en una posición frágil e incierta. Las armas se han calmado en muchas zonas, pero la paz está lejos de ser garantizada. La nación se encuentra ahora en una coyuntura crítica: ¿escogerá la reconciliación y la reforma, continuará el gobierno de emergencia bajo los militares o colapsará una vez más en un conflicto renovado? Los ojos del pueblo argelino, y el mundo, se fijan en lo que viene después."
 algeria_news.2.a: "La lucha por el futuro de Argelia comienza"
 algeria_news.3.t: "Bouteflika asume la Presidencia"
 algeria_news.3.d: "En abril de 1999, Abdelaziz Bouteflika fue elegido Presidente de Argelia, volviendo al país a un liderazgo civil oficial después de años de crisis política. Aunque la guerra aún no ha terminado, Bouteflika entra en funciones decididas a restaurar la estabilidad, reconstruir el estado y llevar a Argelia al nuevo milenio. Su programa de reconciliación y diálogo ha suscitado esperanzas entre muchos argelinos, pero persisten dudas sobre si su presidencia puede sanar verdaderamente las heridas del Decenio Negro."
 algeria_news.3.a: "Una nueva era comienza bajo Bouteflika"
 algeria_news.4.t: "El límite de la Concordia Civil Pasa"
 algeria_news.4.d: "La ventana de amnistía abierta por la Concordia Civil del Presidente Bouteflika ha cerrado. Miles de insurgentes han descendido de las montañas y regresado a la vida civil, y el Ejército Islámico de Salvación se ha disuelto formalmente en lugar de luchar. Los endurecedores del Grupo Islámico Armado, y el recién formado Grupo Salafista para Predicar y Combatir, rechazaron todas las ofertas y permanecieron en el campo. Los partidarios llaman a la Concordia la mejor oportunidad de acabar con el derramamiento de sangre; los críticos responden que perdona a los autores de las masacres sin entregar una pizca de justicia a sus víctimas."
 algeria_news.4.a: "Una oportunidad de convertir la página en el Decenio Negro"
 algeria_news.5.t: "El FLN revive su legado revolucionario"
 algeria_news.5.d: "El Presidente Bouteflika y el FLN han lanzado una campaña nacional para reforzar su legitimidad a través de la memoria de la Guerra de la Independencia. Los medios y las escuelas estatales ahora glorifican los sacrificios de los mártires, presentando al FLN como el eterno guardián de la soberanía de Argelia. Al mismo tiempo, el gobierno ha conseguido alianzas con otros partidos importantes, formando una coalición política para consolidar la autoridad y presentar un frente unido. Los críticos denuncian la campaña como propaganda oportunista, mientras que los partidarios lo ven como el renacimiento del espíritu revolucionario de Argelia."
 algeria_news.5.a: "La revolución continúa por la unidad"
 algeria_news.5.b: "Ningún FLN debe gobernar solo"
 algeria_news.6.t: "Formación de la Alianza Presidencial"
 algeria_news.6.d: "Sobre la base de su campaña revolucionaria heredada, el FLN ha conseguido una coalición gobernante conocida como la Alianza Presidencial. El Frente de Liberación Nacional (FLN), el Rallye Nacional por la Democracia (RND) y el Movimiento de Sociedades por la Paz (MSP) han acordado coordinar políticas en apoyo del Presidente Bouteflika. La alianza refuerza el control del bloque gobernante sobre el sistema político de Argelia, presentando un frente unido al público. Mientras los partidarios aclaman esta coalición como un símbolo de estabilidad, las voces de la oposición advierten que Argelia corre el riesgo de deslizarse más hacia una dominación partidaria bajo un nuevo pretexto."
 algeria_news.6.a: "Juntos, salvaguardamos el futuro de Argelia"
 ALG_presidential_alliance: "§YEl FLN, RND y MSP han formado la Alianza Presidencial.§!\nEsta coalición aumenta la estabilidad del gobierno, pero consolida el dominio político bajo el bloque gobernante."
 algeria_news.7.t: "La crisis reaparece"
 algeria_news.7.d: "Las promesas de reconciliación y reforma se han colapsado en mentiras. El FLN y sus llamados aliados en la RND y otros partidos democráticos no han cumplido con la justicia y los derechos exigidos por el pueblo. Desilusionados con promesas vacías, muchos ahora recurren a la Groupe Salafiste pour la Prédication et le Combat (GSPC), creyendo que sólo la ley de Allah puede traer verdadera justicia a Argelia. Para ellos, Sharia representa una ley superior, incorrupta por la codicia de los políticos, la traición de los Harkis o la influencia de las potencias extranjeras. Esto no es una guerra contra el pueblo argelino, sino contra los funcionarios corruptos y las élites respaldadas por el extranjero que han robado su futuro. Una nueva guerra civil, que decidirá el destino de Argelia de una vez por todas."
 algeria_news.7.a: "La ley de Allah guiará el futuro de Argelia"
 ALG_army_alliance: "Le Pouvoir consigue más fuerte"
 ALG_strengthen_le_pouvoir: "Fortalece Le Pouvoir"
 ALG_strengthen_le_pouvoir_desc: "La élite gobernante y los militares consolidan el poder a expensas de las libertades políticas."
 ALG_resistance_challenges_new: "Las demandas del pueblo"
 ALG_resistance_challenges_new_desc: "La gente exige reformas en salud, educación y empleo. La falta de atención a estas necesidades fortalecerá los sufrimientos y hará que Argelia se acerque más a la guerra civil."
 ALG_healthcare_reform: "Reformar el sistema sanitario"
 ALG_healthcare_reform_desc: "Los hospitales están desbordados, los médicos mal pagados y la escasez médica es generalizada. Debemos actuar con rapidez."
 alg.310.t: "Reconocimientos de la reforma sanitaria"
 alg.310.d: "La inversión en hospitales y médicos ha restablecido cierta fe en el gobierno."
 alg.310.a: "Una pequeña victoria."
 alg.311.t: "Colapso de la atención sanitaria"
 alg.311.d: "Los hospitales están abrumados, los pacientes rechazados y la corrupción come en el sistema. La ira se hierve."
 alg.311.a: "Esto nos costará caro."
 ALG_education_reform: "Reformar el sistema educativo"
 ALG_education_reform_desc: "Nuestras escuelas y universidades están obsoletas y los graduados afrontan un futuro sin empleo."
 alg.320.t: "La reforma de la educación se ha convertido en"
 alg.320.d: "La inversión en escuelas y universidades ha dado esperanza a los estudiantes de nuevo."
 alg.320.a: "Un futuro más brillante."
 alg.321.t: "Colapso de la educación"
 alg.321.d: "Las aulas superpobladas, las universidades fallidas y la falta de oportunidades alimentan el descontento."
 alg.321.a: "Los jóvenes se vuelven contra nosotros."
 ALG_unemployment_reform: "Afrontar la crisis del desempleo"
 ALG_unemployment_reform_desc: "Los jóvenes de Argelia están sin empleo e inquietos. Debemos invertir en industrias y en la creación de empleo o enfrentar disturbios."
 alg.330.t: "Trabajos Programa de éxito"
 alg.330.d: "Los nuevos empleos y las pequeñas industrias brindan esperanza a miles de jóvenes argelinos."
 alg.330.a: "Un paso adelante."
 alg.331.t: "Crisis del desempleo"
 alg.331.d: "Las fábricas permanecen ociosas, se gradúan en las calles y las protestas se vuelven violentas."
 alg.331.a: "Esto no puede durar."
 alg.400.t: "El Ejército acepta la derrota"
 alg.400.d: "El Ejército Nacional del Pueblo ha perdido su control sobre la política. Con el aumento de la presión pública y los oficiales que no están dispuestos a arriesgar otra guerra sangrienta, los generales aceptan apartarse para el liderazgo civil."
 alg.400.a: "¡El gobierno civil por fin!"
 alg.401.t: "El Ejército retrocede"
 alg.401.d: "Aunque comenzaron las reformas, el ejército todavía tiene el verdadero poder. Los generales mayores interfieren en la política, redirigir fondos y sabotear los intentos de transparencia. Argelia retrocede a la sombra."
 alg.401.a: "Los generales corruptos permanecen en el poder."
 alg.402.t: "El pueblo se levanta en armas"
 alg.402.d: "Las quejas del pueblo argelino han llegado al punto de ruptura. Con la estabilidad perdida y la confianza en las instituciones destruidas, las protestas se convierten en una rebelión abierta. Argelia enfrenta otra guerra civil."
 alg.402.a: "La nación está destrozada."
 ALG_resist_le_pouvoir: "Resista Le Pouvoir"
 ALG_resist_le_pouvoir_desc: "Durante décadas, la élite corrupta conocida como *Le Pouvoir* ha gobernado a Argelia desde las sombras, utilizando el ejército como su puño de hierro. El pueblo es inquieto, y a menos que se trate de sus reclamos, Argelia puede enfrentarse a otra tormenta. Elegir este camino abrirá el camino para la reforma, o para el derramamiento de sangre."
 ALG_popular_salvation: "Movimiento de Salvación Popular"
 ALG_popular_salvation_desc: "De las cenizas de la desesperación, surge un nuevo movimiento. Estudiantes, trabajadores y soldados desilusionados se unen para pedir cambio. Si este movimiento puede derrocar pacíficamente el viejo orden o encender una guerra civil dependerá de cómo gestionamos las demandas del pueblo."
 ALG_popular_salvation_tt: "§YEste enfoque fortalece el movimiento de oposición, pero no garantiza la guerra civil. El resultado depende de cómo se gestionan las quejas y la influencia del ejército.§!"
 ALG_restore_hope: "Restaurar la esperanza"
 ALG_restore_hope_desc: "En 1999, Abdelaziz Bouteflika llegó a potenciar una estabilidad y reconciliación prometedoras después del Decenio Negro. La gente lo mira como un símbolo de esperanza."
 ALG_charter_for_peace: "La Concordia Civil"
 ALG_charter_for_peace_desc: "Aprobado por referéndum en septiembre de 1999, la Concordia Civil ofrece amnistía a cualquier insurgente que se rinda antes de que cierre la ventana. El Ejército Islámico de Salvación ya ha honrado su cesación del fuego; la pregunta es cuántos de los combatientes restantes lo seguirán desde las montañas."
 ALG_no_pres_alliance: "FLN gobierna solo"
 ALG_no_pres_alliance_desc: "Bouteflika y la FLN rechazan las alianzas con otros partidos, afirmando el dominio completo sobre el sistema político de Argelia."
 ALG_le_pouvoir_in_the_shadows: "Le Pouvoir en las sombras"
 ALG_le_pouvoir_in_the_shadows_desc: "Aunque ocurren elecciones, el poder real es sostenido por la élite arraigada. La corrupción se profundiza mientras los ciudadanos crecen inquietos."
 ALG_peace_charter: "La Concordia Civil"
 ALG_peace_charter_desc: "La amnistía de Bouteflika para los insurgentes que tiraban sus brazos, significaba drenar la Década Negra de sus combatientes en lugar de derrotarlos en el campo."
 ALG_fln_dominance: "Predominio FLN"
 ALG_fln_dominance_desc: "El Frente de Libération Nationale (FLN) sigue dominando el sistema político de Argelia. Su dominio limita el pluralismo político y fomenta el resentimiento entre los grupos de oposición, pero proporciona continuidad y control para el régimen."
 ALG_only_FLN: "Sin alianza"
 ALG_only_FLN_desc: "El FLN gobernará solo, rechazando alianzas o coaliciones. Si bien esto consolida el poder, aísla aún más las fuerzas de oposición y los riesgos que aumentan la insatisfacción pública."
 ALG_pres_coa: "Alianza Presidencial"
 ALG_pres_coa_desc: "Para mantener la estabilidad, el FLN puede formar una coalición presidencial más amplia. Al incluir partidos e independientes lealistas, el gobierno gana legitimidad sin renunciar a su dominio."
 ALG_nationalize_privatized_industries: "Nacionalize Privatized Industries"
 ALG_nationalize_privatized_industries_desc: "Las privatizaciones neoliberales de los años noventa debilitaron la soberanía de Argelia. Al renacionalizar las industrias clave, el Estado puede recuperar el control sobre los sectores estratégicos."
 ALG_sonatrach_expansion: "Expansión de Sonatrach"
 ALG_sonatrach_expansion_desc: "Sonatrach, la empresa energética estatal de Argelia, es la columna vertebral de nuestra economía. Ampliar su capacidad y alcance reforzará los ingresos estatales y la influencia de Argelia en los mercados energéticos globales."
 ALG_the_cult_of_bouteflika: "El Culto de Bouteflika"
 ALG_the_cult_of_bouteflika_desc: "Los partidarios del Presidente Bouteflika están construyendo un culto a la personalidad alrededor de su liderazgo. A través de redes leales y propaganda, su entorpecimiento cementa su dominio sobre la política argelina, incluso a medida que la corrupción y el patronaje se profundizan."
 ALG_cult_of_bouteflika: "Bouteflika's Entourage"
 ALG_cult_of_bouteflika_desc: "Rodeado de un leal pero profundamente corrupto entorpecimiento, el círculo interior de Bouteflika controla las palancas del poder. Su influencia asegura la estabilidad del régimen, pero afianza el nepotismo y reduce la transparencia en la gobernanza."
 ALG_oppose_ffs_and_rcd: "Ban FFS y RCD"
 ALG_oppose_ffs_and_rcd_desc: "El Frente de Fuerzas Socialistas (FFS) y el Rallye por la Cultura y la Democracia (RCD) desafian a la hegemonía FLN. Al prohibirlos, el régimen elimina las voces de la oposición, pero corre el riesgo de inflar el disentimiento, especialmente en Kabylia."
 ALG_smaller_state: "Pequeño Estado"
 ALG_smaller_state_desc: "El Estado argelino hinchado es ineficiente y costoso. Reducir su tamaño y descentralizar la autoridad podría mejorar la eficiencia, aunque las élites arraigadas se opondrán a esas reformas."
 ALG_fight_bloated_bureaucracy: "Lucha contra la burocracia inflada"
 ALG_fight_bloated_bureaucracy_desc: "Las capas de burocracia sufragan la gobernanza argelina. Una campaña para simplificar la administración pública reducirá la corrupción y acercará los servicios al pueblo."
 FLN_parties_corruptions: "Corrupción en Nuestras Partes"
 FLN_parties_corruptions_desc: "La corrupción ha entrado en el FLN y sus partidos aliados. Denunciar y abordar esta corrupción es vital si el régimen espera restaurar la credibilidad."
 ALG_elite_control: "Control de élite"
 ALG_elite_control_desc: "Una red de magnates empresariales, líderes del partido y oficiales militares conocidos como 'Le Pouvoir' reglas Argelia desde las sombras."
 ALG_military_coup: "Golp militar"
 ALG_military_coup_desc: "El ejército ha decidido poner fin al liderazgo civil y apoderarse del poder directamente, orden prometedor, pero traer miedo."
 ALG_suspend_democracy: "Democracia suspendida"
 ALG_suspend_democracy_desc: "Se disuelve el Parlamento, se cancelan las elecciones y los generales gobiernan Argelia."
 ALG_repression_campaign: "Campaña de represión"
 ALG_repression_campaign_desc: "El PNA utiliza métodos brutales del Decenio Negro para aplastar el disentimiento, a costa de la indignación internacional."
 ALG_black_market_rises: "El mercado negro aumenta"
 ALG_black_market_rises_desc: "La corrupción y la escasez crean un próspero mercado negro, socavando la economía oficial."
 ALG_expand_the_pna: "Ampliar el PNA"
 ALG_expand_the_pna_desc: "El ejército se expande, moderniza y fortalece para garantizar la supervivencia del régimen."
 ALG_africas_strongest_army: "El ejército más fuerte de África"
 ALG_africas_strongest_army_desc: "Argelia posee ahora las fuerzas armadas más fuertes del continente, una fuerza con la que se debe contar."
 ALG_global_power_projection: "El HCS vuelve a crecer"
 ALG_global_power_projection_desc: "Con los militares que ahora tienen un poder indiscutible una vez más, Argelia se afirma tanto en el país como en el extranjero. Echoando el dominio de la era HCS de los años noventa, nuestra nación es alta, inquebrantable y dispuesta a proyectar su influencia mucho más allá de sus fronteras. El mundo recordará la fuerza de la resolución argelina."
 ALG_army_reform: "Reforma del Ejército"
 ALG_army_reform_specops: "Reforma del Ejército"
 ALG_army_reform_specops2: "Reforma del Ejército"
 ALG_army_reform_specops3: "Reforma del Ejército"
 ALG_army_reform_specops4: "Reforma del Ejército"
 ALG_military_quality_initiative: "Iniciativa de calidad militar"
 ALG_military_quality_initiative2: "Iniciativa de calidad militar"
 ALG_army_reform_mass_army: "Reforma del Ejército"
 ALG_army_reform_mass_army2: "Reforma del Ejército"
 ALG_army_reform_mass_army3: "Reforma del Ejército"
 ALG_army_reform_mass_army4: "Reforma del Ejército"
 ALG_military_expansion: "Expansión militar"
 ALG_military_expansion2: "Expansión militar"
 ALG_foreign_arms_companies: "Compañías de armas extranjeras"
 ALG_future_army: "Ejército del Futuro"
 ALG_air_reform: "Reforma del Aire"
 ALG_air_reform2: "Reforma del Aire"
 ALG_air_reform3: "Reforma del Aire"
 ALG_air_reform4: "Reforma del Aire"
 ALG_naval_reform: "Reforma naval"
 ALG_naval_reform2: "Reforma naval"
 ALG_naval_reform3: "Reforma naval"
 ALG_naval_reform4: "Reforma naval"
 ALG_shipbuilding: "Construcción naval argelina"
 ALG_shipbuilding2: "Construcción naval argelina"
 ALG_resist_le_pouvoir_system_tt: "§YNuevo sistema desbloqueado: Grievancia Popular e Influencia del Ejército§!\n\n- §O La lucha popular§! mide la insatisfacción popular. Aumenta si se descuida el desempleo, la educación o la atención médica.\n- Si la queja crece demasiado alto, las protestas masivas o la guerra civil pueden estallar.\n\n- §OArmy Influence§! rastrea el papel del ejército en la política. Debilitarlo a través de reformas puede permitir una transición pacífica, pero si crece la influencia, el ejército puede suprimir la democracia y apretar su control.\n\nDebes equilibrar la reforma, la estabilidad y el poder del ejército para sobrevivir a este camino."
 ALG_reactioners: "Economía del grupo de expertos"
 ALG_reactioners1: "Economía del grupo de expertos"
 ALG_reactioners2: "Economía del grupo de expertos"
 ALG_reactioners3: "Economía del grupo de expertos"
 ALG_reactioners4: "Economía del grupo de expertos"
 ALG_reactioners5: "Economía del grupo de expertos"
 ALG_reactioners6: "Economía del grupo de expertos"
 ALG_reactioners7: "Economía del grupo de expertos"
 ALG_automobile_industry: "Desarrollo de la industria automotriz"
 ALG_automobile_industry_desc: "Argelia ha dependido desde hace mucho tiempo de las importaciones para satisfacer sus necesidades automotrices. Al desarrollar una industria automotriz doméstica, podemos crear empleos, reducir las importaciones y establecer Argelia como centro de fabricación regional."
 ALG_peugeot_deal: "Inversión Peugeot"
 ALG_peugeot_deal_desc: "Peugeot ha expresado interés en abrir una planta en Argelia. Esta asociación podría proporcionarnos una capacidad industrial muy necesaria."
 ALG_renault_oran: "Renault in Oran"
 ALG_renault_oran_desc: "Renault está dispuesto a establecer la producción en Oran, proporcionando un flujo constante de vehículos y potenciando nuestra economía."
 ALG_hyundai_tiaret: "Hyundai in Tiaret"
 ALG_hyundai_tiaret_desc: "El Hyundai de Corea del Sur está listo para establecer una asociación en Tiaret, creando empleos y reduciendo nuestra dependencia de los fabricantes europeos."
 ALG_volkswagen_relizane: "Volkswagen in Relizane"
 ALG_volkswagen_relizane_desc: "Volkswagen y sus marcas asociadas (Skoda, Audi, Seat) están preparadas para abrir una planta en Relizane, diversificando aún más nuestra base industrial."
 ALG_bmw_deal: "Socio de BMW"
 ALG_bmw_deal_desc: "El BMW de Alemania ha mostrado interés en reunir vehículos de lujo y premium en Argelia, elevando nuestra industria automotriz a estándares internacionales."
 ALG_mercedes_trucks: "Mercedes camiones"
 ALG_mercedes_trucks_desc: "Al trabajar con Daimler, podemos montar camiones militares Mercedes y vehículos pesados en Argelia, apoyando directamente a nuestras fuerzas armadas."
 ALG_auto_scandal: "Escándalo de corrupción automotriz"
 ALG_auto_scandal_desc: "Las revelaciones han expuesto la industria argelina de ensamblaje de automóviles como una simulación de corrupción, con subsidios mal utilizados y fábricas haciendo poco más que reagrupar kits importados. El escándalo tendrá graves repercusiones políticas y económicas."
 ALG_import_ban: "Prohibir las importaciones de automóviles"
 ALG_import_ban_desc: "En un esfuerzo por proteger nuestra industria nacional, prohibiremos la importación de la mayoría de los automóviles extranjeros. Esta medida es polémica y creará tensión económica a corto plazo."
 ALG_fiat_deal: "Trato de inversión apropiado"
 ALG_fiat_deal_desc: "Fiat ha ofrecido regresar a Argelia con un moderno complejo industrial, prometiendo reiniciar la producción y restaurar la confianza pública en nuestro sector automotriz."
 ALG_indigenous_brand: "Crear marca indígena"
 ALG_indigenous_brand_desc: "En lugar de depender de empresas extranjeras, Argelia debe crear su propio fabricante autóctono de automóviles, diseñado y construido localmente por los argelinos."
 ALG_auto_exports: "Exportar vehículos argelinos"
 ALG_auto_exports_desc: "Con una industria automotriz estable, ahora podemos mirar hacia el exterior y comenzar a exportar vehículos argelinos a mercados africanos y mediterráneos."
 alg.1000.t: "Industria automotriz corrupción Scandal"
 alg.1000.d: "Un escándalo de corrupción masivo ha sacudido el sector automovilístico de Argelia. Las investigaciones revelaron que muchas de las denominadas «factorias» eran meras plantas de reanimación que abusaban de los subsidios estatales y aumentaban los costos. La confianza pública está colapsando, y la industria se enfrenta a parálisis."
 alg.1000.a: "Una humillación nacional."
 ALG_tebboune_tt: "Abdelmadjid Tebboune se convierte en Presidente de Argelia tras las protestas de Hirak 2019. El notorio (Gang) de políticos corruptos, incluyendo Ahmed Ouyahia, Abdelmalek Sellal, Ali Haddad y Mahieddine Tahkout, son arrestados y enfrentan justicia. Esto marca el comienzo de una nueva era, aunque muchos dudan cuán profundas serán las reformas."
 ALG_corruption_network: "Bouteflika's Entourage"
 ALG_corruption_network_desc: "Una red corrupta de políticos y empresarios, incluyendo Ouyahia, Sellal y Tahkout, domina la política argelina. Su influencia debilita el estado y alimenta la ira pública."
 ALG_cleaning_the_state: "Limpieza del Estado"
 ALG_clean_government: "Gobierno limpio"
 ALG_political_repression: "Represión política"
 ALG_military_junta: "Junta Militar"
 ALG_cleaning_the_state_desc: "Con la caída del Entourage, Argelia finalmente está tomando medidas para purgar la corrupción de sus instituciones y restaurar la confianza del pueblo."
 algeria_reforms.1.t: "Reformas bajo Tebboune"
 algeria_reforms.1.d: "Tras la renuncia de Abdelaziz Bouteflika y la elección de Abdelmadjid Tebboune, Argelia entra en un nuevo capítulo político. Tebboune ha prometido reformas, una nueva constitución, y el desmantelamiento de la famosa red de corrupción conocida como 'Isābah' (la pandilla), que incluía a los ex primeros ministros Ahmed Ouyahia, Abdelmalek Sellal y magnates empresariales como Ali Haddad y Mahieddine Tahkout. \n\nSin embargo, el movimiento Hirak sigue siendo escéptico de sus promesas. ¿Estas reformas conducirán a la verdadera democratización, o simplemente son una manera de preservar el régimen bajo nuevos líderes?"
 algeria_reforms.1.a: "Apoyar las reformas de Tebboune"
 algeria_reforms.1.b: "¡El pueblo demanda más!"
 ALG_arrest_the_gang: "Arresten el Entorno"
 ALG_arrest_the_gang_desc: "El pueblo argelino exige justicia. Tebboune continuará las acciones contra Ouyahia, Sellal, Haddad, Tahkout y otras figuras corruptas que drenaron la riqueza de la nación."
 ALG_at_a_crossroads: "La Nación se encuentra en una encrucijada"
 ALG_at_a_crossroads_desc: "A medida que nuestra nación enfrenta desafíos sin precedentes, estamos en un momento crucial de nuestra historia. Las decisiones que tomamos ahora formarán nuestro futuro y determinarán el curso de nuestra sociedad. ¿Vamos a abrazar el cambio y la reforma, o aferrarnos al pasado? El camino que elijamos definirá nuestro legado."
 ALG_promises_of_reform: "Promesas de Reforma"
 ALG_promises_of_reform_desc: "Una nueva Argelia requiere una nueva constitución. Tebboune promete reformas para limitar los términos presidenciales, fortalecer el parlamento y garantizar más libertades."
 ALG_suppressed_opposition: "Oposición Suprimida"
 ALG_black_decade_methods: "Métodos del Decenio Negro"
 ALG_black_market: "Mercado Negro"
 ALG_pna_expansion: "PNA Expansión"
 ALG_global_power: "Poder global"
 ALG_crackdown_on_dissent: "Crackdown en el Hirak"
 ALG_crackdown_on_dissent_desc: "Las protestas no han parado. En lugar del diálogo, Tebboune ha elegido la represión, esperando silenciar el disentimiento y preservar el estado."
 ALG_rebuild_trust_investors: "Reconstruir la confianza con los inversores"
 ALG_rebuild_trust_investors_desc: "Después de años de corrupción e inestabilidad, debemos recuperar la confianza de inversores extranjeros y nacionales en nuestra economía."
 ALG_diversify_economy: "Diversificar la economía"
 ALG_diversify_economy_desc: "Argelia no puede depender únicamente del petróleo y el gas. Las renovables, la agricultura y la fabricación serán los pilares de nuestro futuro."
 ALG_social_subsidies: "Proteger subsidios sociales"
 ALG_social_subsidies_desc: "Las personas dependen de subsidios para combustible, pan y vivienda. Tebboune promete mantener estas protecciones a pesar de los desafíos económicos."
 ALG_balance_regional_powers: "Balance de las Potencias regionales"
 ALG_balance_regional_powers_desc: "Argelia se encuentra entre Europa, África y el mundo árabe. Debemos mantener una política exterior equilibrada que sirva a nuestros intereses."
 ALG_strengthen_russia_ties: "Fortalecer Ties con Rusia"
 ALG_strengthen_russia_ties_desc: "Nuestra amistad histórica con Moscú puede profundizar a través de la cooperación en defensa y acuerdos energéticos."
 ALG_china_investments: "Inversiones chinas"
 ALG_china_investments_desc: "La Iniciativa Franja y la Ruta ofrece a Argelia la oportunidad de modernizar la infraestructura y atraer importantes proyectos de inversión chinos."
 ALG_north_south_highway: "Proyecto de autopista Norte-Sur"
 ALG_automobile_factories: "Industria automotriz"
 ALG_automobile_factories_desc: "Para emplear a nuestra población y obtener más capacidad económica, es posible que necesitemos invitar a productores extranjeros de automóviles a nuestro país."
 algeria_policy.1.t: "Denouncing Colonialist Regimes"
 algeria_policy.1.d: "El FLN ha condenado enérgicamente los regímenes colonialistas del pasado, denunciando delitos cometidos durante la ocupación de Argelia. La declaración ha suscitado el orgullo nacional en casa, pero ha provocado enojo en París, empeorando las relaciones entre Argelia y Francia."
 algeria_policy.1.a: "¡Exponer los crímenes del colonialismo!"
 algeria_disaster.1.t: "The Boumerdès Earthquake"
 algeria_disaster.1.d: "Un devastador terremoto ha afectado al norte de Argelia, centrado cerca de la ciudad de Boumerdès. Miles han perdido la vida, decenas de miles más son heridos y vastas partes de Argel y la región costera se han reducido a escombros. La nación está en shock mientras las operaciones de rescate luchan para hacer frente a la magnitud del desastre. Es necesario adoptar medidas inmediatas para restablecer el orden y proporcionar socorro a la población afectada."
 algeria_disaster.1.a: "Movilizar equipos de respuesta de emergencia y comenzar a redoblar los esfuerzos"
 ALG_earthquake_recovery_tt: "Las operaciones de rescate comienzan. El gobierno pronto decidirá cómo financiar la reconstrucción."
 algeria_disaster.2.t: "Actividades de reconstrucción y recuperación"
 algeria_disaster.2.d: "Las consecuencias del terremoto han dejado a Argelia frente a una de las peores crisis humanitarias en su historia moderna. Miles permanecen sin refugio, y la infraestructura vital está en ruinas. El gobierno debe decidir cómo financiar la reconstrucción, ya sea mediante la creación de un fondo nacional de ayuda utilizando los recursos estatales o buscando asistencia extranjera, que puede venir con cadenas políticas adjuntas."
 algeria_disaster.2.a: "Establecer un Fondo Estatal de Ayuda"
 ALG_state_aid_fund_tt: "Asignar recursos estatales para reconstruir las regiones afectadas. Esto va a ceder el tesoro pero fortalecer la confianza nacional en el gobierno."
 algeria_disaster.2.b: "Buscar asistencia extranjera"
 ALG_foreign_aid_dependence_tt: "Solicitar ayuda de asociados internacionales. Esto aliviará la presión financiera, pero aumentará la influencia extranjera sobre los asuntos internos de Argelia."
 ALG_french_influence: "Influencia francesa en las sombras"
 ALG_french_influence_desc: "Aunque independiente en el papel, la política de Argelia permanece bajo la sombra de la influencia francesa. Generales corruptos y políticos vinculados a París conforman la toma de decisiones, limitando la verdadera soberanía."
 ALG_shadow_state: "Le Pouvoir en las sombras"
 ALG_shadow_state_desc: "La red oculta de generales, oficiales de inteligencia y empresarios, a menudo llamada 'Le Pouvoir', domina Argelia. La corrupción debilita el estado, pero este sistema de sombras garantiza la estabilidad política y fortalece el control del régimen sobre el poder."
 algeria_emerging_youth: "Organizaciones juveniles"
 algeria_nationalist_youth: "Organizaciones juveniles"
 algeria_nationalist_rise: "Revival nacionalista"
 algeria_nationalist_rise_desc: "El nacionalismo en Argelia es cada vez más popular que nunca. Debido a la clara oposición del gobierno a la injerencia extranjera en el estado, y su firme apoyo a la soberanía e independencia del Estado"
 algeria_cultural_rebirth: "Renacimiento cultural"
 ALG_PNA_victory: "Regla militar"
 ALG_PNA_victory_desc: "Armée nationale populaire (El Ejército Nacional del Pueblo) es el ejército de Argelia. Desde la independencia de Argelia en 1962, tiene un gran papel en la política. Prácticamente controlaba el gobierno hasta 1988, cuando se estableció un sistema multipartidista. Sin embargo, sigue teniendo influencia sobre la política de Argelia, siendo el ejemplo más reciente el presidente Abdelaziz Bouteflika abdicating en 2019 después de que las protestas condujeran a una pérdida de apoyo por parte de los militares."
 ALG_kick_out_morocco: "Salir de Marruecos"
 ALG_kick_out_morocco_desc: "Marruecos siempre nos ha subyugado bajo su control y no hay razón para que mantengamos nuestros lazos con ellos. ¡Es el momento adecuado para echar a estos enemigos ideológicos de Argelia!"
 ALG_statist_rise: "Levantamiento estatista"
 ALG_statist_rise_desc: "La economía liberal permite la explotación de nuestro pueblo y compromete nuestra independencia y control nacional. Es mejor que Argelia conecte todos los aspectos de la economía al Estado."
 ALG_maintain_military_role: "Mantener las palancas del Ejército"
 ALG_maintain_military_role_desc: "El Mundo está entrando en tiempos oscuros y incómodos así que tenemos que proteger a nuestra nación, no importa lo que cueste."
 ALG_kick_out_iran: "Golpear a Irán"
 ALG_kick_out_iran_desc: "Irán siempre nos ha subyugado bajo su control y no hay razón para que mantengamos nuestros lazos con ellos. ¡Es el momento adecuado para echar a estos enemigos ideológicos de Argelia!"
 ALG_nationalize_oligarchic_holdings: "Nacionalizar las tenencias"
 ALG_nationalize_oligarchic_holdings_desc: "Nacionalizaremos las tenencias y propiedades de diversos oligarcas pícaros para fortalecer nuestro dominio sobre la economía."
 ALG_subsidise_police: "Subvenciona a la policía"
 ALG_subsidise_police_desc: "La policía es una de las cosas más importantes para que nuestro pueblo se sienta seguro y garantice nuestra regla en Argelia y ha sido muy mal financiada. Esto tiene que cambiar."
 ALG_maintain_socialistic_policies: "Mantener las leyes socialistas"
 ALG_maintain_socialistic_policies_desc: "Una cosa que el gobierno anterior tenía razón, y es la última razón por la cual eran relativamente más populares son sus políticas socialistas que apoyaron a las clases inferiores. Continuaremos las políticas implementadas por el ex presidente hafez al assad y nos representaremos como verdaderos partidarios de los oprimidos."
 ALG_government_planned_economic_projects: "Proyectos gubernamentales"
 ALG_government_planned_economic_projects_desc: "Debemos iniciar proyectos públicos para mejorar nuestra imagen como un gobierno responsable y reunir apoyo de la gente común."
 ALG_patriotic_propaganda: "Patriota Propaganda"
 ALG_patriotic_propaganda_desc: "Fortaleceremos nuestras posiciones ideológicas enfatizando la importancia del orgullo nacional y de la lealtad estatal."
 ALG_gather_support_from_peasantry: "Apoyo a las actividades de mantenimiento"
 ALG_gather_support_from_peasantry_desc: "Los campesinos son la columna vertebral de nuestra nación y tenemos que asegurarnos de que nos están apoyando."
 ALG_strong_government: "Gobierno fuerte"
 ALG_strong_government_desc: "Tendremos que demostrar a nuestro pueblo que nuestro gobierno es estable y capaz de gobernar. Esto nos permitirá ganar su confianza"
 ALG_expand_youth_organizations: "Ampliación de las organizaciones juveniles"
 ALG_expand_youth_organizations_desc: "Nuestros partidos se han basado especialmente en organizaciones juveniles y ahora que estamos en una posición de poder es hora de alentar a los jóvenes a apoyar nuestras causas ideológicas al ganar sus corazones y mentes."
 ALG_illiberal_democracy: "Democracia deliberada"
 ALG_illiberal_democracy_desc: "El liberalismo es un virus que infecta y explota a las naciones pobres. Lo que el pueblo necesita es la verdadera democracia que realmente representa al pueblo y al mismo tiempo los une bajo una bandera. Somos una democracia sin importar qué."
 ALG_reestablish_intelligence_committee: "Reestablezcan las agencias de inteligencia"
 ALG_reestablish_intelligence_committee_desc: "Las guerras futuras no están con armas y tanques, sino con información. Es nuestra responsabilidad crear una agencia de inteligencia totalmente funcional."
 ALG_national_security_act: "Ley de seguridad nacional"
 ALG_national_security_act_desc: "Los grupos extremistas están matando lentamente a nuestra nación y plantean una amenaza para nuestro pueblo. Sus ataques son una clara amenaza para nuestra nación y si algo tenemos que detenerlos inmediatamente sin importar el costo, no importa lo que pase. Parar el ritmo."
 ALG_pan_algerian_nationalism: "Pan argelina"
 ALG_pan_algerian_nationalism_desc: "Argelia es el país que debe brillar por todo el norte de África con su identidad única. Nuestra rica historia y cultura deja claro que es nuestro deber mostrar nuestro verdadero potencial e identidad al mundo."
 ALG_cultural_rebirth: "Cultural Renacimiento"
 ALG_cultural_rebirth_desc: "Nuestra nación está lentamente pero seguramente reconociendo su identidad. Las pequeñas brechas no deben parar en el camino de realizar la belleza de nuestro pueblo. Nuestra gente debe reconocer que no importa qué, todavía somos algerianos después de todo."
 ALG_deal_with_the_trade_unions: "Un trato con los sindicatos"
 ALG_deal_with_the_trade_unions_desc: "La clave de un país fuerte es su producción y economía, así que tenemos que asegurarnos de que todos los trabajadores de Argelia nos apoyen."
 ALG_reassert_russian_ties: "Ties rusos"
 ALG_reassert_russian_ties_desc: "Rusia es el único y verdadero aliado que nos ayuda a convertirse en una nación moderna, segura y próspera."
 ALG_russian_oil_excavation: "Crusian Oil Deals"
 ALG_russian_oil_excavation_desc: "Hay un gran tesoro en nuestra nación y nuestro aliado, Rusia, nos ayudará a alcanzar estos recursos."
 ALG_russian_algiers_base_expansion: "Ampliar la presencia naval rusa"
 ALG_russian_algiers_base_expansion_desc: "No podemos crear una fuerte marina inmediatamente, pero nuestros amigos rusos nos ayudarán a mantener nuestras costas seguras ayudando en la expansión de las capacidades del puerto."
 ALG_houarist_rise: "Ascenso houarista"
 ALG_houarist_rise_desc: "Houarrism está creciendo de nuevo y listo para hacer que Argelia sea grande de nuevo."
 ALG_islamic_socialism: "Socialismo islámico"
 ALG_islamic_socialism_desc: "La gente parece olvidar que el islam defiende muchas prácticas atribuidas al socialismo como zakat y sadaka. Debemos enfatizar esta relación al basar nuestros ideales a su alrededor, ya que esto también recogerá apoyo de los islamistas que siempre se pusieron en contra de nuestros ideales. El socialismo islámico es la verdadera manera de hacer de nuestra nación una república moderna, fuerte y virtuosa."
 ALG_Get_rid_of_oligarchs: "Purge Los Oligarchs"
 ALG_news.1.t: "Argelia en un cruce de caminos"
 ALG_news.1.d: "Después de casi una década de violencia brutal, desintegración económica y estancamiento político, Argelia en el año 2000 se encuentra en un momento decisivo. La guerra civil, conocida por muchos como la «Decada Negra», ha dejado decenas de miles muertos y muchos más desplazados. Mientras la intensidad de los combates ha disminuido, las tensiones siguen siendo elevadas y las heridas están lejos de ser curadas.\n\nCon las futuras fuerzas inciertas y competitivas de la nación ahora empujan en diferentes direcciones. Un camino busca la reconciliación nacional y las reformas democráticas para unificar el país. Otro se inclina hacia la prolongación de la regla de emergencia, manteniendo el control del régimen actual sobre el poder. Sin embargo, un tercer susurro de guerra continuada, de batallas inacabadas, promesas radicales y aquellos que se niegan a armar.\n\nEl camino que Argelia elige a continuación puede dar forma a su destino durante generaciones."
 ALG_news.1.a: "Todos los ojos están en Argel."
 Arab_Defense_Bloc: "Un bloque de defensa árabe"
 The_Maghreb_Joint_Defense: "La Defensa Conjunta del Magreb"
 ALG_bouteflika.3.t: "Crisis de salud Bouteflika"
 ALG_bouteflika.3.d: "A partir de 2013, Bouteflika tuvo un golpe debilitante.Un periodista, Hichem Aboud, fue perseguido por amenazar la seguridad nacional, la integridad territorial y el manejo normal de las instituciones de la República y los periódicos para los que escribió fueron censurados, porque escribió que el Presidente había regresado de Val-de-Grâce en estado coma y había caracterizado a Saïd Bouteflika como el maestro títere que dirigía la administración."
 ALG_bouteflika.3.a: "¿Qué pasará?"
 ALG_boteflika_tt: "Esto desbloqueará la crisis de salud del Presidente de Argelia Enfoque"
 ALG_bouteflika: "Crisis de salud Bouteflika Noticias"
 ALG_bouteflika.2.t: "2014 Elecciones presidenciales de Argelia"
 ALG_bouteflika.2.d: "Las elecciones presidenciales se celebraron en Argelia el 17 de abril de 2014.El Presidente Adjunto Abdelaziz Bouteflika fue reelegido con un 82% de los votos. Las cuestiones de la campaña incluyeron el deseo de estabilidad nacional después de la sangrienta guerra civil del decenio de 1990"
 ALG_bouteflika.2.a: "Bouteflika Wins"
 ALG_bouteflika_health_crisis: "Crisis de salud de Bouteflika"
 ALG_bouteflika_health_crisis_desc: "El deterioro de la salud del Presidente amenaza con desestabilizar a Argelia. ¿Lo mantendremos en el poder o nos prepararemos para una transición?"
 ALG_2014_elections: "2014 Presidential Election"
 ALG_2014_elections_desc: "A pesar de su enfermedad, Bouteflika corre por un cuarto término. La oposición es silenciada, y los resultados son una conclusión precedente."
 ALG_2014_oil_crash: "Collapse de precio del petróleo"
 ALG_2014_oil_crash_desc: "Los precios del petróleo desplomaron la economía de Argelia. La gente culpa a la corrupción y exige el cambio."
 ALG_silence_hirak: "Aplastar las protestas de Hirak"
 ALG_silence_hirak_desc: "El ejército y la policía suprimirán el disentimiento. Las calles correrán rojas, pero el régimen sobrevivirá."
 ALG_listen_to_hirak: "Ceder a las demandas reformistas"
 ALG_listen_to_hirak_desc: "Promete reformas políticas para apaciguar a los manifestantes. El viejo guardia se resistirá, pero la ira del pueblo puede desaparecer."
 ALG_2019_elections: "2019 Political Crisis"
 ALG_2019_elections_desc: "La oferta de Bouteflika para un quinto término se enciende furia nacional. ¿Argelia estallará en la revolución o se someterá a la tiranía?"
 ALG_new_president: "Nombrar un nuevo Presidente"
 ALG_new_president_desc: "El movimiento Hirak ha ganado. Un gobierno de transición celebrará elecciones libres, terminando décadas de dominio autoritario."
 ALG_release_political_prisoners: "Liberar prisioneros políticos"
 ALG_release_political_prisoners_desc: "Miles de activistas, periodistas y figuras de la oposición languidecen detenidos por su papel en las protestas de Hirak. Liberarlos significaría una verdadera ruptura del viejo régimen y reforzaría la legitimidad democrática."
 ALG_corrupt_successor: "Instalar un Sucesor Loyalista"
 ALG_corrupt_successor_desc: "El ejército asegura que un títere tome el poder. El legado de la corrupción de Bouteflika sigue vivo."
 alg_oil_crash_title: "Colapso de los precios del petróleo"
 alg_oil_crash_desc: "Los precios del petróleo se derrumben, ¿nuestra nación sobrevivirá?"
 alg_oil_crash_option: "¡Esto es Relativo!"
 alg_hirak_victory_title: "La gente gana"
 alg_hirak_victory_desc: "Después de años de protestas, Bouteflika baja. Comienza una nueva era, ¿pero puede durar?"
 alg_military_rule_title: "Los generales deciden"
 alg_military_rule_desc: "El ejército instala un líder de títeres. El Hirak está aplastado por ahora."
 algeria_tebboune.1.t: "Las elecciones presidenciales de 2019"
 algeria_tebboune.1.d: "Después de meses de protestas y la renuncia de Abdelaziz Bouteflika, los argelinos se dirigen a las urnas en las elecciones más contenciosas de décadas. Muchos ven el proceso como dominado por la vieja guardia, mientras que otros se aferran a esperar la reforma o incluso un avivamiento islamista. Tres candidatos principales han surgido como participantes: Abdelmadjid Tebboune, el candidato de continuidad vinculado al establecimiento; Ali Benflis, un reformista liberal con su propio movimiento; y Abdelkader Bengrina, un líder islamista con vínculos con el Movimiento de la Sociedad por la Paz. La elección determinará el futuro camino de Argelia."
 algeria_tebboune.1.a: "Elect Abdelmadjid Tebboune"
 algeria_tebboune.1.b: "Elect Ali Benflis"
 algeria_tebboune.1.c: "Elect Abdelkader Bengrina"
 ALG_benflis_tt: "§YAli Benflis§! se convierte en Presidente de Argelia, liderando a los reformistas liberales."
 ALG_bengrina_tt: "§YAbdelkader Bengrina§! se convierte en Presidente de Argelia, representando a la oposición islamista."
 kabyle_resistance_info: "La región de Kabyle está experimentando disturbios. Nivel de resistencia: [?state_resistance@438|%Y]"
 kabyle_resistance_effects: "Monitor Kabylia para aumentar el apoyo separatista. Resistencia actual: [?state_resistance@385|%Y]"
 ALG_kabyle_resistance_tooltip: "Nivel de resistencia en Kabylia:"
 ALG_suppress_kabyle: "Suprimir el movimiento Kabyle"
 ALG_suppress_kabyle_desc: "El malestar de Kabyle plantea una amenaza a la soberanía nacional. No podemos permitir que florezca la retórica secesionista. Una fuerte represión puede ser la única manera de reafirmar el control, incluso si significa enfrentar una resistencia feroz."
 ALG_recognize_kabyle: "Reconocer la independencia de Kabyle"
 ALG_recognize_kabyle_desc: "Décadas de tensión, protesta y disturbios nos han llevado a este momento. Puede ser el momento de reconocer las aspiraciones de Kabyle a la independencia. Hacerlo terminaría con los disturbios inmediatos, pero a costa de la integridad territorial."
 ALG_recognize_tamazight: "Reconocer a Tamazight"
 ALG_recognize_tamazight_desc: "Reconocer a Tamazight como idioma oficial es una demanda clave de la población kabyle. Hacerlo puede legitimar su identidad cultural preservando la unidad nacional."
 ALG_kabyle_cultural_reforms: "Reformas culturales Kabyle"
 ALG_kabyle_cultural_reforms_desc: "Debemos apoyar la educación, las instituciones locales y los derechos culturales en la región de Kabyle para fomentar la integración y el respeto mutuo."
 ALG_internal_troops_kabyle: "Desembolsos de los contingentes internos"
 ALG_internal_troops_kabyle_desc: "La situación en Kabylia exige una fuerte presencia de seguridad. Despliegaremos tropas internas para asegurar la región y suprimir el malestar."
 ALG_disrupt_kabyle_networks: "Interrumpir las redes políticas de Kabyle"
 ALG_disrupt_kabyle_networks_desc: "La actividad separatista se coordina a través de redes políticas subterráneas. Es necesario perturbar la vigilancia y las detenciones para preservar la seguridad nacional."
 KBY_build_a_new_state: "Construir un nuevo Estado"
 KBY_build_a_new_state_desc: "Ahora independiente, debemos sentar las bases de una república en funcionamiento. Una constitución, gobernanza y servicios sociales son las principales prioridades."
 KBY_secure_our_borders: "Aseguren nuestras fronteras"
 KBY_secure_our_borders_desc: "Con nuestra soberanía declarada, debemos fortificar nuestras fronteras vulnerables y asegurar nuestra supervivencia en un ambiente hostil."
 idea_ALG_neutrality: "Argelia Neutralidad"
 idea_ALG_neutrality_desc: "Argelia ya no puede permitirse la guerra, la neutralidad es nuestra mejor opción."
 idea_ALG_neutrality_2: "Argelia Neutralidad"
 idea_ALG_neutrality_2_desc: ""
 ALG_a_globalized_algeria: "A Globalized Algeria"
 ALG_a_globalized_algeria_desc: "Hoy es una era de globalización, en la que Argelia debe participar."
 ALG_international_investments: "Inversiones internacionales"
 ALG_international_investments_desc: ""
 ALG_export_driven_growth: "Crecimiento generado por las exportaciones"
 ALG_export_driven_growth_desc: ""
 ALG_promote_sovereignty: "Promover la Soberanía"
 ALG_promote_sovereignty_desc: ""
 ALG_promote_human_rights: "Promover los derechos humanos"
 ALG_promote_human_rights_desc: "Los derechos humanos sobre todo, incluso si es la soberanía nacional."
 ALG_extract_favorable_terms: "Extracto Términos favorables"
 ALG_extract_favorable_terms_desc: ""
 ALG_a_norm_entrepreneur: "A Norm Entrepreneur"
 ALG_a_norm_entrepreneur_desc: ""
 ALG_Algeria_resplendent: "Algeria Resplendent"
 ALG_Algeria_resplendent_desc: ""
 ALG_national_strength: "Fuerza nacional"
 ALG_national_strength_desc: ""
 ALG_terror_2003_hostage_title: "Crisis de acogida del Sáhara"
 ALG_terror_2003_hostage_desc: "Un grupo de turistas europeos fueron secuestrados en el desierto argelino por militantes islamistas. Aunque no se informó de bajas, esto marca el comienzo de un aumento inquietante en la actividad yihadista organizada."
 ALG_terror_2003_hostage_option: "Una señal inquietante de las cosas por venir"
 ALG_terror_monitor: "Monitorear la amenaza del terror"
 ALG_conduct_security_raids: "Realizar redadas de seguridad"
 ALG_terror_threat_category: "Monitor de amenazas contra el terrorismo"
 ALG_terror_2007_algiers_title: "Algiers Bombings"
 ALG_terror_2007_algiers_desc: "Un bombardeo suicida masivo ha golpeado al Palacio de Gobierno en Argel. Más de 30 civiles y personal del gobierno fueron asesinados en uno de los ataques más mortíferos de los últimos años."
 ALG_terror_2007_batna_title: "Bombarde Batna"
 ALG_terror_2007_batna_desc: "Un terrorista suicida detonó un dispositivo cerca de una multitud esperando ver al presidente en Batna. El ataque dejó más de 20 muertos."
 ALG_terror_2008_issers_title: "Isers police Academy bombing"
 ALG_terror_2008_issers_desc: "A vehicle-borne suicide attack targeted police recruits at Isers academy, killing 43 and injuring dozens."
 ALG_terror_generic_option: "Tragic news."
 ALG_terror_2000_bus_ambush_title: "Bus Ambush cerca de Médéa"
 ALG_terror_2000_bus_ambush_desc: "Los militantes armados organizaron una emboscada mortal en un autobús de pasajeros cerca de Médéa. Diecinueve civiles perdieron la vida. Este ataque indica que ha continuado la inestabilidad en el período posterior a la guerra civil."
 ALG_terror_2002_tazmalt_title: "Bombarde Tazmalt"
 ALG_terror_2002_tazmalt_desc: "Una bomba explotó en Tazmalt, matando e hiriendo a varios civiles. Las fuerzas de seguridad sospechan que hay restos del GSPC."
 ALG_terror_2002_miliana_title: "Bombing Miliana"
 ALG_terror_2002_miliana_desc: "Una carretera IED detonó cerca de Miliana, hiriendo a varios soldados."
 ALG_terror_2002_hammam_title: "Hammam Righa bombardear"
 ALG_terror_2002_hammam_desc: "Un artefacto explosivo casero detonado en Hammam Righa, dirigido a un convoy militar."
 ALG_terror_2002_larbaa_title: "Bombear Larbaa"
 ALG_terror_2002_larbaa_desc: "Militants detonó una bomba en Larbaa, continuando su campaña contra las autoridades estatales."
 ALG_terror_2002_msila_title: "M'Sila bombardeando"
 ALG_terror_2002_msila_desc: "Un IED explotó en M'Sila, mostrando aún más la persistencia de las redes terroristas en la región."
 ALG_terror_2003_tizi_title: "Tizi Ouzou bombardear"
 ALG_terror_2003_tizi_desc: "Se produjo una explosión mortal en Tizi Ouzou. Civils were among the dead, and security forces suspect GSPC involvement."
 ALG_terror_2004_tebessa_title: "Tebessa bombardeando"
 ALG_terror_2004_tebessa_desc: "Un bombardeo coordinado en Tebessa mató a 7 personas. La creciente escala de ataques es alarmante."
 ALG_idea_arab_diplomacy: "Diplomacia árabe"
 ALG_terror_2005_tidjelabine_title: "Bombarde Tidjelabine"
 ALG_terror_2005_tidjelabine_desc: "Two gendarmes were killed in Tidjelabine after a car bomb hit their patrol."
 ALG_relying_on_our_own_strength_spirit: "Sobre nuestra propia fuerza"
 ALG_relying_on_our_own_strength_spirit_desc: "Argelia sólo necesita que los argelinos prosperen, nadie más."
 ALG_hydroelectric_power_plants_upgraded_idea: "§RSonatrach§! - Plantas de energía hidroeléctrica Actualizadas"
 FLN_nationalize_resources: "Nacionalizar los recursos"
 FLN_nationalize_resources_desc: "Los recursos naturales de Argelia son la clave para su soberanía y prosperidad. Al nacionalizar nuestros recursos, podemos asegurar que la riqueza generada por el petróleo, el gas y los minerales beneficie directamente al pueblo de Argelia, sentando las bases para la independencia económica a largo plazo."
 ALG_revivify_non_aligned_movement: "Revivificar el Movimiento de los Países No Alineados"
 ALG_revivify_non_aligned_movement_desc: "Como miembro orgulloso del Movimiento de los Países No Alineados, Argelia debe revitalizar este bloque de naciones independientes. Al fortalecer los vínculos con otros estados neutrales, podemos resistir la dominación de superpotencia y forjar un camino de verdadera soberanía en un mundo dividido."
 ALG_reach_out_ASEAN: "Alcance a la ASEAN"
 ALG_reach_out_ASEAN_desc: "Las naciones del sudeste asiático comparten nuestro deseo de desarrollo libre de injerencias extranjeras. El establecimiento de una cooperación más estrecha con la ASEAN abrirá nuevas oportunidades económicas, reforzando al mismo tiempo un orden mundial multipolar."
 ALG_support_developing_world: "Apoyo al mundo en desarrollo"
 ALG_support_developing_world_desc: "Argelia se solidariza con las naciones oprimidas y empobrecidas. A través de la ayuda económica, los intercambios técnicos y la promoción diplomática, podemos ayudar a elevar el Sur Global y desafiar la explotación neocolonial."
 ALG_between_east_and_west: "Entre Oriente y Occidente"
 ALG_between_east_and_west_desc: "Atraída entre bloques rivales, Argelia debe navegar con cuidado. Al mantener relaciones equilibradas con los poderes capitalista y socialista, podemos asegurar inversiones vitales sin renunciar a nuestra independencia a ambos campos."
 ALG_mediate_great_power_conflict: "Conflicto de Gran Poder Mediante"
 ALG_mediate_great_power_conflict_desc: "A medida que aumentan las tensiones entre las superpotencias, Argelia puede servir de intermediario honesto. Nuestra neutralidad y autoridad moral nos posicionan para descalificar las crisis y promover la coexistencia pacífica en un mundo cada vez más inestable."
 ALG_promote_reconciliation: "Promover la reconciliación"
 ALG_promote_reconciliation_desc: "De África a Oriente Medio, conflictos furtivos entre hermanos. Argelia, con su patrimonio revolucionario y experiencia diplomática, debe fomentar el diálogo y la unidad entre las naciones divididas."
 ALG_secure_balance: "Saldo seguro"
 ALG_secure_balance_desc: "En un mundo de hegemonías competidoras, el equilibrio es nuestra salvaguardia. Al calibrar cuidadosamente nuestra política exterior, podemos prevenir la dominación por cualquier potencia única al extraer los máximos beneficios de todos."
 ALG_joining_brics: "Únase a BRICS"
 ALG_joining_brics_desc: "Argelia busca fortalecer su influencia mundial al unirse al grupo BRICS de las economías emergentes, mejorando tanto el crecimiento económico como la cooperación política."
 ALG_align_with_brazil: "Fortalecer las Ties con Brasil"
 ALG_align_with_brazil_desc: "Brasil, como Argelia, busca un camino independiente en los asuntos mundiales. Mediante la profundización de nuestra asociación con este gigante sudamericano, podemos mejorar el comercio en agricultura y tecnología presentando un frente unido contra las presiones neocoloniales en los foros globales."
 ALG_align_with_india: "Forjar una asociación estratégica con la India"
 ALG_align_with_india_desc: "La postura no alineada de la India y el creciente poder industrial lo convierten en un aliado natural. Colaborar en proyectos energéticos, intercambios militares y diplomacia de las Naciones Unidas fortalecerá a nuestras naciones contra el dominio de la superpotencia al tiempo que fomentará la cooperación Sur-Sur."
 ALG_islamic_monarchy_idea: "Monarquía islámica"
 ALG_islamic_monarchy_idea_desc: "Argelia ha restaurado una monarquía divina arraigada en los principios islámicos y la tradición nacional."
 ALG_caliph_crowned: "Crowned Caliph"
 ALG_caliph_crowned_desc: "El Califa no sólo rige por la ley sino por la voluntad del pueblo y el legado de la fe."
 ALG_amir_al_muminin_idea: "Amir al-Mu'minin"
 ALG_amir_al_muminin_idea_desc: "Comandante de los fieles, título con peso espiritual y político en todo el mundo islámico."
 ALG_maghreb_alliance_idea: "Pilares del Magreb"
 ALG_maghreb_alliance_idea_desc: "Argelia dirige un esfuerzo por unificar el mundo islámico occidental bajo un nuevo orden religioso y político."
 ALG_restore_caliphate_in_algiers: "Restaurar el Califato en Argel"
 ALG_restore_caliphate_in_algiers_desc: "La república ha fracasado. Ha llegado el momento de restaurar una monarquía divina, arraigada en la fe y la historia. De Argel, se levantará un nuevo Califato."
 ALG_crown_the_caliph: "Corona del Califa"
 ALG_crown_the_caliph_desc: "Se ha elegido un heredero legítimo del Califato. Con una ceremonia en Argel, la corona será restaurada y el mundo reconocerá al nuevo Amir al-Mu'minin."
 ALG_amir_al_muminin: "El Amir al-Mu'minin"
 ALG_amir_al_muminin_desc: "Declaramos al Califa como Amir al-Mu'minin, el Comandante de los Fieles. Este título le otorga legitimidad espiritual y política en todo el mundo islámico."
 ALG_umayyad_legacy: "Declara al Legado Omeya"
 ALG_umayyad_legacy_desc: "Argelia invoca la memoria de los omeyas, cuya gloria se extendió una vez a través de continentes. Nos posicionamos como los herederos de su legado."
 ALG_reclaim_al_andalus: "Reclamar al-Andalus"
 ALG_reclaim_al_andalus_desc: "Las tierras de Al-Andalus fueron una vez la joya del mundo islámico. Ha llegado el momento de recuperarlos y revivir nuestra antigua civilización en Iberia."
 ALG_reclaim_the_crown: "Reclame la Corona"
 ALG_reclaim_the_crown_desc: "Ha llegado el momento de restaurar una monarquía legítima y divinamente inspirada en la legitimidad islámica. En las cenizas del fracaso republicano y de la guerra civil, resucitaremos la corona histórica, uniendo a la nación bajo una norma real de fe, orden y herencia. Ya sea un sucesor Abbasid, una dinastía bereber revivida o un símbolo de la nueva unidad islámica, la corona brillará una vez más sobre Argelia."
 ALG_pillars_of_the_maghreb: "Los Pilares del Magreb"
 ALG_pillars_of_the_maghreb_desc: "Argelia busca la unidad con sus hermanos occidentales, Marruecos y Túnez, para formar el fundamento de un bloque islámico unido en África septentrional."
 ALG_monarchy_tt: "§O Como nuevo monarca de Argelia, recogemos a Jizya y Zakat de los fieles. Por la guía de Alá, continuaremos nuestra regla.§!"
 ALG_recovering_from_the_civil_war: "La décennie noire"
 ALG_recovering_from_the_civil_war_desc: "La Guerra Civil argelina dejó profundas cicatrices en la nación. A pesar de que el conflicto ha terminado, sus efectos se alivian, influenciando el paisaje político y la psique nacional. Años después de la guerra civil, Argelia sigue luchando con sus sombras. Las heridas del conflicto aún no han sanado plenamente, pero la nación sigue decidida a reconstruirse."
 MSP_non_aligned_revival: "Política Exterior de los Países No Alineados"
 MSP_non_aligned_revival_desc: "Reviviremos el espíritu de neutralidad y solidaridad sur, al igual que en la década de 1960."
 MSP_global_south_solidarity: "Solidaridad del Sur Global"
 MSP_global_south_solidarity_desc: "Argelia fortalecerá los vínculos con las naciones postcoloniales mediante el comercio, la diplomacia y la ayuda."
 MSP_north_africa_first: "África del Norte"
 MSP_north_africa_first_desc: "Nos centraremos en dirigir la diplomacia y el desarrollo en nuestra región inmediata."
 MSP_western_sahara_position: "Apoyo al Sáhara Occidental"
 MSP_western_sahara_position_desc: "Reafirmamos nuestro apoyo a la independencia de Sahrawi contra las reivindicaciones marroquíes."
 MSP_african_union_engagement: "Únase a la Unión Africana"
 MSP_african_union_engagement_desc: "Argelia debe reunirse y asumir un papel de liderazgo en la diplomacia continental."
 MSP_sahel_initiatives: "Ampliación en el Sahel"
 MSP_sahel_initiatives_desc: "Lucharemos contra la inestabilidad y el terrorismo en el Sahel a través del poder blando y la defensa."
 MSP_arab_world_outreach: "Tesis diplomáticas árabes"
 MSP_arab_world_outreach_desc: "Para fortalecer la influencia de Argelia en el mundo árabe, debemos revitalizar nuestros esfuerzos diplomáticos de divulgación y coordinación. A través de visitas bilaterales, cumbres e iniciativas comerciales, Argelia puede afirmarse como una fuerza unificadora en la región."
 MSP_join_arab_league: "Fortalecimiento de la participación de la Liga Árabe"
 MSP_join_arab_league_desc: "Como miembro actual de la Liga Árabe, Argelia puede ir más allá de la participación y asumir un papel diplomático importante. Promover la coordinación económica, las consultas de defensa y la solidaridad cultural mejorarán nuestra posición en el mundo árabe."
 MSP_support_palestine: "Apoyo a la Causa Palestina"
 MSP_support_palestine_desc: "Argelia ha apoyado durante mucho tiempo la lucha palestina por la libre determinación. El apoyo diplomático renovado, la ayuda humanitaria y la defensa internacional reafirmarán nuestra posición de principio en defensa de los derechos palestinos."
 MSP_algeria_algiers_axis: "Forja el eje Egipto-Algiers"
 MSP_algeria_algiers_axis_desc: "Al alinearse más estrechamente con Egipto, Argelia puede ayudar a formar un poderoso bloque regional capaz de guiar la unidad árabe, asegurar la estabilidad del norte de África y contrarrestar la influencia extranjera."
 MSP_condemn_israel: "Condenan Israeli Actions"
 MSP_condemn_israel_desc: "A la luz de la continua agresión y las violaciones de los derechos humanos, Argelia condenará oficialmente las acciones israelíes en la etapa internacional, apoyando una paz justa y oponiéndose a la normalización sin resolución."
 MSP_palestinian_aid_package: "Paquete de ayuda palestina"
 MSP_palestinian_aid_package_desc: "Asignaremos recursos para proporcionar asistencia humanitaria, económica y técnica a los territorios palestinos, asegurando que el compromiso de Argelia se extienda más allá de las palabras a la ayuda real e impactante."
 MSP_pan_african_defense_initiative: "Iniciativa Panafricana de Defensa"
 MSP_pan_african_defense_initiative_desc: "Para proteger la soberanía africana y mejorar la estabilidad continental, Argelia propone una iniciativa coordinada de defensa africana que construya la disposición militar colectiva contra amenazas compartidas."
 MSP_send_troops_to_sahel: "Despliegue de las Fuerzas al Sahel"
 MSP_send_troops_to_sahel_desc: "En respuesta a la creciente inestabilidad en el Sahel, Argelia enviará tropas para apoyar las operaciones de mantenimiento de la paz, la protección fronteriza y las campañas antiterroristas en colaboración con los gobiernos regionales."
 MSP_sahel_stabilization_force: "Fuerza de estabilización del Sahel"
 MSP_sahel_stabilization_force_desc: "Argelia tomará la iniciativa en el establecimiento de una fuerza permanente de estabilización del Sahel, un marco de seguridad dirigido por África para contrarrestar las insurgencias y las redes delictivas en la región."
 MSP_exploit_sahel_resources: "Explotación de los recursos del Sahel"
 MSP_exploit_sahel_resources_desc: "La influencia argelina en el Sahel ofrece acceso a recursos naturales sin explotar. Mediante la negociación de contratos de minería e infraestructura, podemos conseguir beneficios económicos y alianzas estratégicas en la región."
 MSP_propose_maghreb_union: "Proponer la Unión del Magreb"
 MSP_propose_maghreb_union_desc: "Es hora de revivir la visión de un Magreb unido. Argelia adoptará la iniciativa de proponer nuevas iniciativas de integración, centrándose en la cooperación económica, la infraestructura conjunta y el alineamiento diplomático."
 MSP_economic_integration_initiative: "Integración económica del Magreb"
 MSP_economic_integration_initiative_desc: "A través de tarifas reducidas, inversiones en infraestructura y debates sincronizados sobre políticas monetarias, Argelia impulsará esfuerzos para crear una zona económica común del Magreb que beneficie a todos los Estados miembros."
 MSP_maghreb_joint_defense_pact: "Pacto Conjunto de Defensa del Magreb"
 MSP_maghreb_joint_defense_pact_desc: "Un Magreb seguro requiere defensa colectiva. Proponemos un pacto militar regional centrado en la protección de fronteras, el intercambio de inteligencia y ejercicios militares conjuntos."
 MSP_mediterranean_dialogue: "El Diálogo Mediterráneo"
 MSP_invite_iraq: "Invitar al Iraq"
 MSP_invite_iraq_desc: "Tenemos que invitar al Iraq a nuestra alianza ya que están empezando lentamente a conseguir su acto juntos, y nos beneficiaríamos seriamente de la cooperación mutua."
 MSP_invite_syria: "Invitar Siria"
 MSP_invite_syria_desc: "Tener Siria justo al sur de nuestra nación significa que somos muy vulnerables. Invitar a Siria en nuestra facción sería una gran manera de garantizar nuestra seguridad"
 MSP_invite_algeria: "Invitar a Egipto"
 MSP_invite_algeria_desc: "Egipto es un centro de poder, y con una población de su tamaño, nuestra alianza será capaz de lograr prácticamente cualquier cosa"
 MSP_assistance_to_bulgaria: "Asistencia a Bulgaria"
 MSP_assistance_to_bulgaria_desc: "Debemos ayudar a Bulgaria a desarrollar su infraestructura para que podamos realizar más inversiones fuera de sus fronteras con facilidad"
 MSP_supp_plo: "Apoyar la OLP"
 MSP_supp_plo_desc: "La Organización de Liberación de Palestina (OLP) ha sido desde hace mucho tiempo un actor clave en la lucha por la libre determinación palestina. Apoyar la OLP podría reforzar nuestra posición con los aliados internacionales y promover una solución pacífica al conflicto."
 MSP_the_pal_issue: "El problema palestino"
 MSP_the_pal_issue_desc: "La cuestión de Palestina sigue siendo una cuestión fundamental en nuestra política exterior. Nuestra postura sobre la lucha palestina definirá nuestras alianzas internacionales e influencia en la región. Debemos decidir cómo abordar este conflicto en curso."
 MSP_supp_hamas: "Apoyo a Hamás"
 MSP_supp_hamas_desc: "Hamás representa una importante facción dentro de la resistencia palestina. Al brindar apoyo, podemos fortalecer nuestros vínculos con este grupo, potenciar nuestra influencia en la región y alinearnos con su lucha."
 MSP_Get_rid_of_military_corrupt: "Purga Los Corrupts Militares"
 MSP_Get_rid_of_military_corrupt_desc: "Los militares están arraigados en nuestras instituciones y son una clara amenaza para el futuro de nuestro país. Los arrestaremos por cargos de corrupción y confiscaremos qué propiedades podemos poner en nuestras manos."
 MSP_reverse_secularization: "Secularización inversa"
 MSP_arm_palestinians_to_fight: "Los palestinos del brazo"
 MSP_arm_palestinians_to_fight_desc: "Jordania alberga a una gran población de refugiados palestinos. Podemos convertir a estos refugiados en combatientes, e instigarlos para causar estragos en Palestina e Israel. Ya que son luchadores proxy, podemos utilizarlos para instigar a Israel a tomar represalias, haciéndolos parecer el malo en el conflicto"
 MSP_zionist_threat: "La amenaza sionista"
 MSP_zionist_threat_desc: "Israel es la mayor afrenta a todos los musulmanes, y un estado falso abominable en el corazón del Islam. Necesitan ser limpiados de la faz de la tierra."
 ALG_kabyle_issue: "Cuestión de Kabyle"
 ALG_kabyle_issue_map: "Satisfacción de los [KBY.GetFlag] Pueblos Asombrosos en nuestro Gobierno!"
 ALG_2014_oil_crash_idea: "Crash de aceite"
 ALG_algeria_resplendent: "Algeria Resplendent"
 ALG_algeria_resplendent_desc: ""
 KBY_new_state_born: "Un nuevo estado nace"
 KBY_new_state_born_desc: "Kabylia ha renacido como nación soberana. Los primeros días de nuestra independencia deben estar marcados por la consolidación, la celebración y la precaución."
 KBY_border_readiness: "Líderes fronterizos"
 KBY_border_readiness_desc: "Debemos asegurar el perímetro de nuestra patria para prevenir infiltraciones, contrabando o incursiones."
 KBY_new_institutions: "Nuevas instituciones"
 KBY_new_institutions_desc: "Un estado en funcionamiento debe basarse en las instituciones confiables y estables."
 KBY_state_economy_plan: "Plan económico estatal"
 KBY_state_economy_plan_desc: "Debemos esbozar la estructura de nuestra economía, ya sea centralizada, impulsada por el mercado o mezclada."
 KBY_african_diplomacy: "Diplomacia africana"
 KBY_african_diplomacy_desc: "Buscar legitimidad regional entre los vecinos africanos reforzará nuestras oportunidades permanentes y económicas."
 KBY_international_recognition_campaign: "Campaña internacional de reconocimiento"
 KBY_international_recognition_campaign_desc: "Nuestra supervivencia depende de la legitimidad a los ojos de otras naciones. Inicie un empuje diplomático selectivo."
 KBY_international_recognition_campaign_completion: "Canales diplomáticos abiertos, ahora comienza el duro trabajo de persuasión."
 KBY_establish_governance_structures: "Establecer estructuras de gobernanza"
 KBY_establish_governance_structures_desc: "Deben crearse instituciones para garantizar que nuestros principios rectores pertenezcan."
 KBY_establish_governance_structures_completion: "Las instituciones gubernamentales están ahora en funcionamiento, listas para servir a nuestros ciudadanos."
 KBY_plan_the_economy: "Planea la Economía"
 KBY_plan_the_economy_desc: "Decidir nuestro futuro económico: estatal, liberal o mixto. Cada ruta ofrece ventajas únicas."
 KBY_plan_the_economy_completion: "La planificación económica en curso, elige sabiamente para la prosperidad a largo plazo."
 KBY_seek_regional_support: "Buscar apoyo regional"
 KBY_seek_regional_support_desc: "El apoyo de nuestros vecinos y la comunidad africana fortalecerá nuestra legitimidad."
 KBY_seek_regional_support_completion: "Se desplegaron esfuerzos regionales de divulgación, en espera de respuestas."
 KBY_secure_internal_stability: "Interno seguro Estabilidad"
 KBY_secure_internal_stability_desc: "Con amenazas externas bajo control, debemos abordar el disentimiento interno y la resistencia."
 KBY_secure_internal_stability_completion: "Los protocolos de seguridad activados, el orden público ha mejorado."
 KBY.10.t: "Establecer relaciones internacionales"
 KBY.10.d: "Con nuestra independencia reconocida ahora por la comunidad internacional, es hora de que Kabylia establezca relaciones diplomáticas formales con otras naciones. Nuestros diplomáticos están preparados para llegar a posibles socios, comenzando por Francia, con nuestros vínculos históricos, y Turquía, que ha mostrado interés en la causa Amazigh.\n\nEste empuje diplomático ayudará a legitimar nuestra joven nación y abrirá puertas para la cooperación futura."
 KBY.10.a: "¡Vamos a llegar a todas las naciones!"
 KBY.15.t: "Buscando la unidad africana"
 KBY.15.d: "Nuestra iniciativa de diplomacia africana ha sentado las bases para una mayor integración con el continente. La Unión Africana representa un importante foro para nuestra nación, la membresía proporcionaría legitimidad, oportunidades económicas y una plataforma para defender los derechos de los amazigh en todo el norte de África.\n\nEl Níger, con su importante población tuareg, ha expresado su apoyo a nuestra aplicación."
 KBY.15.a: "Aplicar a la Unión Africana"
 KBY_diplomatic_move: "El impulso diplomático de Kabylian"
 KBY_au_membership_attempt: "Kabylian AU intento de membresía"
 KBY_state_economy_model_statist: "Economía estatal"
 KBY_state_economy_model_liberal: "Economía del mercado liberal"
 KBY_state_economy_model_mixed: "Modelo Económico mixto"
 ALG_recover_from_the_war: "Recuperarse de la Guerra Civil"
 ALG_restoring_order: "Orden de Restauración"
 ALG_restoring_order_desc: "La prioridad inmediata es restablecer la autoridad estatal y poner fin al caos que continúa en algunas regiones. La población anhela paz y estructura tras años de devastación."
 ALG_secure_weapons_shipments: "Armas de seguridad Envíos"
 ALG_secure_weapons_shipments_desc: "Garantizar que nuestro ejército esté bien multiplicado nos permitirá mantener el orden interno y prevenir la insurgencia renovada."
 ALG_recover_from_the_war_desc: "Debemos comenzar ahora el largo proceso de reconstrucción de nuestra nación. El Decenio Negro ha asustado a Argelia, pero con determinación podemos levantarnos de las cenizas."
 ALG_restoring_the_broken_economy: "Revive la Economía Nacional"
 ALG_restoring_the_broken_economy_desc: "La guerra civil ha paralizado nuestras instituciones financieras. Debemos aplicar medidas de emergencia para estabilizar la economía."
 ALG_arresting_extremists: "Neutralizar las amenazas armadas"
 ALG_arresting_extremists_desc: "Los grupos extremistas siguen operando en zonas remotas. Una renovada campaña de seguridad restaurará el control nacional completo."
 ALG_economic_recovery: "Recuperación económica"
 ALG_economic_recovery_desc: "Nuestras políticas están empezando a producir resultados. Ahora estamos entrando en una fase de recuperación gradual y fomento de la confianza."
 ALG_regain_banks: "Restaurar la confianza en el sector bancario"
 ALG_regain_banks_desc: "Revivir el sector bancario es crucial para restablecer la confianza de los inversores y reiniciar el crédito nacional."
 ALG_financial_reform: "Reforma del Sistema Financiero"
 ALG_financial_reform_desc: "La modernización del sistema financiero de Argelia fomentará el crecimiento sostenible y nos permitirá evitar futuros choques."
 ALG_begin_full_recovery: "Inicio Restauración económica completa"
 ALG_begin_full_recovery_desc: "Con seguridad asegurada y la economía estabilizada, ahora podemos comenzar un renacimiento económico nacional completo."
 ALG_repairing_the_roads: "Reparar la infraestructura"
 ALG_repairing_the_roads_desc: "Carreteras, puentes y líneas de comunicación han colapsado. La reconstrucción de nuestra red logística es esencial para la cohesión nacional."
 ALG_rebuild_north: "Recompild Kabylie & Argeles"
 ALG_rebuild_north_desc: "Estos centros urbanos fueron uno de los peores éxitos. Se debe dar prioridad a la restauración de los servicios básicos en Kabylie y Argel."
 ALG_rebuild_centre: "Reconstruir las tierras altas"
 ALG_rebuild_centre_desc: "Las tierras altas centrales eran un campo de batalla y una crisis humanitaria. Necesitan una reconstrucción dirigida."
 ALG_rebuild_west: "Reconstruir el Oeste"
 ALG_rebuild_west_desc: "La infraestructura en Occidente fue descuidada incluso antes de la guerra. Es hora de integrar estas regiones remotas."
 ALG_rebuild_algeria: "Reconstrucción Argelia"
 ALG_rebuild_algeria_desc: "Es hora de reconstruir nuestra nación y volver a ser el gran poder, esta guerra civil causó demasiada herida ahora es el momento de sanar"
 ALG_rebuild_south: "Reconstruir el Sur"
 ALG_rebuild_south_desc: "La infraestructura en el sur fue descuidada incluso antes de la guerra. Es hora de integrar estas regiones remotas."
 ALG_order_restored_in_algeria: "Orden Restaurada en Argelia"
 ALG_order_restored_in_algeria_desc: "Por primera vez en décadas, Argelia es estable y unida. El camino por delante es largo, pero la paz ha vuelto."
 ALG_state_and_imf_funding: "Estado & Fondo del FMI"
 ALG_state_and_imf_funding_desc: "A través de préstamos y ayuda externa, especialmente del FMI, podemos inyectar la vida en nuestra economía sin obstáculos."
 ALG_restocking_factories: "Factores de recuperación"
 ALG_restocking_factories_desc: "Muchas fábricas fueron dañadas o vacías. Con nuevos suministros, podemos reiniciar la producción."
 ALG_rebuilding_factories: "Reconstrucción de las zonas industriales"
 ALG_rebuilding_factories_desc: "Varias zonas industriales han caído en ruinas. Reconstruirlos proporcionará empleos y producirá materiales necesarios para la recuperación."
 ALG_export_controls: "Controles de exportación & Ayuda a la Federación"
 ALG_export_controls_desc: "Para proteger los bienes estratégicos y asegurar el desarrollo interno, imponeremos restricciones temporales de exportación, equilibradas por apoyo externo."
 ALG_post_war_recovery: "Recuperación posterior a la guerra civil"
 ALG_post_war_recovery_desc: "Argelia sigue asustada por el brutal conflicto civil del decenio de 1990. Aunque se ha restablecido la paz, la nación todavía sufre de inestabilidad, fábricas infrautilizadas, infraestructura tensa y un sistema político frágil."
 ALG_imf_funding_idea: "Fondo de Emergencia del FMI"
 ALG_imf_funding_idea_desc: "El Fondo Monetario Internacional ha intervenido para proporcionar una liquidez y un alivio presupuestario muy necesarios. Mientras estos fondos ayudan a estabilizar la economía, vienen con cadenas adjuntas."
 ALG_export_controls_idea: "Controles de las exportaciones"
 ALG_export_controls_idea_desc: "A fin de dar prioridad a la recuperación interna, el Gobierno ha impuesto restricciones a las exportaciones sobre materiales clave. Esta política estabiliza los mercados internos pero puede dañar las relaciones comerciales internacionales."
 ALG_anti_terror_sweeps: "Operaciones antiterroristas"
 ALG_anti_terror_sweeps_desc: "Las fuerzas de seguridad están llevando a cabo operaciones agresivas para eliminar los elementos extremistas restantes. Si bien esto mejora la seguridad nacional, debe ser equilibrado para evitar suprimir las libertades civiles."
 ALG_banking_confidence_restored: "Restablecimiento de la confianza en el sector bancario"
 ALG_banking_confidence_restored_desc: "Después de un período de grave desconfianza y estancamiento, el sector bancario ha recuperado cierta estabilidad, permitiendo que tanto los ciudadanos como los inversores se reinicien con el sistema financiero de Argelia."
 ALG_structural_reform: "Reformas Económicas Estructurales"
 ALG_structural_reform_desc: "Se están llevando a cabo reformas amplias para modernizar la economía de Argelia. Estos cambios tienen por objeto reducir la inflación, racionalizar las instituciones y promover el crecimiento a largo plazo."
 ALG_national_recovery_completed: "Recuperación nacional completada"
 ALG_national_recovery_completed_desc: "Con la reconstrucción de infraestructuras, seguridad asegurada y revivió la economía, Argelia finalmente ha salido de su capítulo más oscuro. Comienza una nueva era de esperanza y progreso."
 ALG_mastering_atom: "Dominar el átomo"
 ALG_missile_chi_TT: "Argelia mejorará su tecnología §HNuclear Reactor§!"
 CHI_rejected_ALG: " Oferta Rechazada por China"
 ALG_technological_ties: "Tintes tecnológicos"
 ALG_continue_1991_program: "Continuar el Programa Nuclear de 1991"
 ALG_continue_1991_program_desc: "Aunque nuestro programa nuclear fue suspendido en los años noventa, sus bases permanecen. Al revivir los viejos proyectos, podemos lograr tanto la seguridad energética como una mayor independencia, aunque es probable que sigan las sanciones internacionales."
 ALG_seek_china_help: "Solicite asistencia china"
 ALG_seek_china_help_desc: "China lleva mucho tiempo dispuesta a cooperar con Argelia en materia de tecnología nuclear. La alianza renovada nos proporcionará equipo, experiencia y capacitación que evalúe las restricciones occidentales."
 ALG_1983_deal: "Revive el trato de Misiles 1983"
 ALG_1983_deal_desc: "Nuestra cooperación anterior con China en 1983 nos proporcionó tecnología de misiles y asistencia nuclear limitada. Revivir este acuerdo aceleraría nuestras ambiciones nucleares civiles y militares."
 ALG_missile_cooperation: "Ampliación de la cooperación en materia de misiles"
 ALG_missile_cooperation_desc: "Más allá de los reactores y el combustible, China también puede proporcionarnos sistemas de misiles capaces de transportar cargas nucleares. Sin embargo, este paso atraerá una atención seria de Occidente."
 ALG_hoggar_nuclear_facility: "Construir el Hoggar Facility"
 ALG_hoggar_nuclear_facility_desc: "En las montañas de Hoggar, se puede construir una instalación nuclear segura, protegida contra interferencias externas. Esto servirá como el centro del programa nuclear de Argelia."
 ALG_the_search_for_uranium: "La búsqueda de uranio"
 ALG_the_search_for_uranium_desc: "Nuestros científicos están convencidos de que el vasto desierto de Argelia esconde grandes reservas de uranio. La localización y extracción de estos depósitos proporcionarán la columna vertebral de cualquier proyecto nuclear independiente."
 ALG_dig_in_tamanrasset: "Dig in Tamanrasset"
 ALG_dig_in_tamanrasset_desc: "Las llanuras del desierto de Tamanrasset ocultan importantes depósitos de uranio. Al invertir en infraestructura minera aquí, Argelia puede liberarse de la dependencia de proveedores extranjeros."
 ALG_withdrawal_from_npt: "Retirada del TNP"
 ALG_withdrawal_from_npt_desc: "Argelia ya no puede permitir que su soberanía esté obligada por tratados extranjeros. Al retirarse del Tratado sobre la no proliferación de las armas nucleares, declaramos nuestra intención de perseguir abiertamente las armas nucleares."
 ALG_wmds: "Armas de destrucción masiva"
 ALG_wmds_desc: "Con instalaciones de enriquecimiento completas y misiles listos, ha llegado el momento de finalizar el disuasión nuclear de Argelia. El mundo tomará nota, y nuestros enemigos pensarán dos veces antes de amenazarnos."
 ALG_algiers_agreement: "El Acuerdo de Argel"
 ALG_algiers_agreement_desc: "En lugar de perseguir el armamento nuclear, Argelia puede presentarse como un campeón de la paz. El Acuerdo de Argel servirá como una promesa de moderación, abriendo la puerta a la inversión extranjera y legitimidad internacional."
 ALG_sign_BWC: "Firmar la Convención sobre las armas biológicas"
 ALG_sign_BWC_desc: "Al adherirse a los acuerdos internacionales contra las armas de destrucción en masa, demostramos el compromiso de Argelia con la paz. Esto tranquilizará a los inversores extranjeros y reducirá las sospechas sobre nuestras actividades nucleares."
 ALG_build_nuclear_reactor: "Construir un reactor nuclear"
 ALG_build_nuclear_reactor_desc: "Nuestro programa nuclear está listo para dar el siguiente paso. Al construir un reactor a gran escala, Argelia adquirirá una poderosa fuente de energía y un frente para nuevas actividades de enriquecimiento. Si bien el mundo puede ver la intención pacífica, la realidad puede ser mucho más compleja."
 ALG_IAEA_safeguards_leave: "Salvaguardias del OIEA completadas"
 ALG_IAEA_safeguards_leave_desc: "Tras años de supervisión y cumplimiento, Argelia ha cumplido plenamente sus compromisos en virtud del Acuerdo de Argel y la Convención sobre las armas biológicas. Con los inspectores finales del OIEA que salen de nuestro territorio, se levantan las sanciones y nuestra nación es reconocida como un poder regional responsable."
 sanctioned_algeria: "Sanciones"
 ALG_hoggar_nuclear_facility_idea: "Instalación nuclear de Hoggar"
 ALG_algeria_behave_TT: "[USA.GetFlag] §HEstados Unidos§! probablemente §Gascensor§! sanciones económicas"
 nuclear_algeria.1.t: "¿Proveedor potencial?"
 nuclear_algeria.1.d: "En nuestro intento de adquirir tecnología nuclear, debemos tener en cuenta el hecho de que simplemente no satisfacemos el nivel de sofisticación requerido para producir armas o instalaciones adecuadas. Por lo tanto, debemos mirar hacia fuera hacia el mundo y ver quién está dispuesto a ayudarnos, y nuestras fuentes nos están diciendo que podemos pedir ayuda a 1 nación en particular."
 nuclear_algeria.1.a: "Contactar con los chinos"
 nuclear_algeria.2.t: "Argelia solicita asistencia"
 nuclear_algeria.2.d: "Científicos y diplomáticos argelinos se reunieron recientemente con nosotros mismos, solicitando asistencia con su programa nuclear. Declararon que estarían dispuestos a aceptar cualquier cosa que les proveamos, siempre y cuando les ayude a desarrollar su programa nuclear."
 nuclear_algeria.2.a: "Okay"
 nuclear_algeria.2.b: "No podemos compartir nuestros secretos."
 nuclear_algeria.3.t: "China comparte tecnología de misiles"
 nuclear_algeria.3.d: "Los científicos chinos se reunieron recientemente con los nuestros en [ALG.capital.GetCapitalVictoryPointName], y nos proporcionaron planos para avanzados misiles ICBM que actualmente no poseemos."
 nuclear_algeria.3.a: "¡Genial!"
 nuclear_algeria.4.t: "China proporciona tecnología nuclear"
 nuclear_algeria.4.d: "Científicos chinos se reunieron recientemente con los nuestros en [ALG.capital.GetCapitalVictoryPointName], y nos proporcionaron planos a reactores avanzados que actualmente no poseemos."
 nuclear_algeria.4.a: "¡Genial!"
 nuclear_algeria.5.t: "[FROM.GetName] ¡Rehusa prestar asistencia!"
 nuclear_algeria.5.d: "Hicimos un importante error de cálculo en contacto [FROM.GetName] para la asistencia en nuestro programa nuclear, ya que ellos han negado nuestras peticiones y han amenazado con tomar nuestra solicitud a los tribunales internacionales, potencialmente exponiendo nuestro secreto."
 nuclear_algeria.5.a: "Una oportunidad perdida."
 nuclear_algeria.6.t: "Argelia quiere comprar misiles"
 nuclear_algeria.6.d: "El gobierno argelino nos ha pedido venderles una serie de misiles balísticos. Ha declarado que utilizarán los misiles para proteger sus fronteras nacionales y no lo usarán en ninguna forma de guerra ofensiva."
 nuclear_algeria.6.a: "Bien, finalice la venta"
 nuclear_algeria.6.b: "No"
 nuclear_algeria.7.t: "China vende sus misiles"
 nuclear_algeria.7.d: "China nos ha vendido unos 400 misiles balísticos. Aunque algunos de ellos pueden estar fechados, siguen trabajando, lo que es todo lo que importa."
 nuclear_algeria.7.a: "Genial."
 nuclear_algeria.8.t: "China se niega a vender misiles"
 nuclear_algeria.8.d: "El gobierno chino ha negado nuestra solicitud de compra de misiles, alegando que los necesitan para sus propias operaciones militares."
 nuclear_algeria.8.a: "Okay"
 nuclear_algeria.19.t: "Sanciones internacionales"
 nuclear_algeria.19.d: "Parece que el mundo ha decidido volverse contra nosotros, y han impuesto sanciones a nuestra economía que inevitablemente la detendrá. Necesitamos evaluar nuestras políticas."
 nuclear_algeria.19.a: "¿Qué esperábamos de un mundo de traidores?"
 nuclear_algeria.25.t: "Estados Unidos aumenta la presión económica"
 nuclear_algeria.25.d: "Estados Unidos ha decidido que quiere ejercer su visión imperialista aumentando las sanciones económicas a nuestro pueblo."
 nuclear_algeria.25.a: "¡Nos resistiremos!"
 nuclear_algeria.26.t: "Estados Unidos disminuye la presión económica"
 nuclear_algeria.26.d: "Estados Unidos ha elegido que quiere disminuir la cantidad de sanciones que han impuesto a nuestro pueblo. Si mantienen esta postura es algo que tendremos que esperar y ver."
 nuclear_algeria.26.a: "Bien."
 nuclear_algeria.28.t: "Argelia Falls in Line"
 nuclear_algeria.28.d: "En un total de 180 de la política típica argelina, parecen estar avanzando hacia una dirección más pacífica y controlada."
 nuclear_algeria.28.a: "Bien, tal vez podamos aliviar las sanciones ahora."
 algerian_focus.171.t: "Planta nuclear de Es-Salam"
 algerian_focus.171.d: "Izquierda inacabada por los estadounidenses, lo que se construyó de la planta nuclear Es-Salam ha estado sentado ocioso desde hace décadas. Con la llegada de varios científicos chinos, se ha hecho una oferta para terminar lo que quedaba de la planta eléctrica."
 algerian_focus.171.a: "Aceptar la propuesta"
 algerian_focus.171.b: "No thanks"
 ALG_sanctioned: "Sanctioned"
 ALG_nuclear_known: "Programa nuclear expuesto"
 ALG_emergency_budget: "Presupuesto de emergencia"
 support_brics: "Brics de apoyo"
 algeria_msp: "MSP Enfoque"
 algeria_democratic: "RND Enfoque"
 algeria_nationalist: "PNA Enfoque"
 monitor_kabyle_unrest: "Vigilar los disturbios cabileños de [KBY.GetFlag]"
 ALG_us_sanctions: "EE.UU. Sanciones"
 ALG_us_sanctions_desc: "Los Estados Unidos habían establecido varias sanciones que limitaban nuestra capacidad de interactuar con el mundo exterior. A pesar de no criticar, impide nuestra capacidad para alcanzar el éxito económico en cierta medida.\n§W--------------§!\nLos Estados Unidos poseen la capacidad de aumentar o disminuir las sanciones a nuestro gobierno basadas en nuestras acciones.\n§W--------------§!\nEste espíritu nacional será §R Removido§! si los Estados Unidos creen que ya no estamos persiguiendo armas nucleares."
 ALG_imf_path: "Elija el Sendero Préstamo del FMI"
 ALG_imf_loan_taken: "Tomó los préstamos del FMI"
 ALG_oil_reformed: "Petróleo Reformado"
 ALG_repression_modifier: "Represión"
 ALG_surveillance_state_modifier: "Estado de vigilancia"
 ALG_national_dialogue_modifier: "Diálogo nacional"
 ALG_boteflika: "Crisis de salud del Presidente de Argelia"
 idea_alg_empowered_parliament: "Empoderamiento del Parlamento"
 algeria_sahar.1.t: "Ayuda de Argelia"
 algeria_sahar.1.d: "Hemos recibido una oferta de Argelia, están dispuestos a proporcionarnos asistencia militar y nos ayudan a prepararnos para la reanudación de las hostilidades, a cambio de la participación en el proceso de establecimiento del UAR. ¿Deberíamos aceptar el apoyo de Argelia?"
 algeria_sahar.1.a: "¡Debemos aceptar!"
 algeria_sahar.1.b: "¡De ninguna manera nos convertiremos en sus títeres!"
 algeria_sahar.2.t: "Acuerdo de Paz"
 algeria_sahar.2.d: "No podíamos contener a los rebeldes, se apoderaron de todo el Sahara Occidental. ¿Debemos ofrecer a los rebeldes un tratado de paz y entregar el territorio?"
 algeria_sahar.2.a: "Envíales la oferta"
 algeria_sahar.2.b: "¡Debemos aplastarlos!"
 algeria_sahar.3.t: "Oferta de Marruecos"
 algeria_sahar.3.d: "Marruecos nos ha enviado una propuesta de tratado de paz, esta declaración puede considerarse como un acto de rendición pleno. ¡Podemos aceptar la rendición o podemos marchar en un frente amplio para liberar a los pueblos del Magreb Norte!"
 algeria_sahar.3.a: "¡Ganamos!"
 algeria_sahar.3.b: "¡Adelante a la Federación de Peopel!"
 algeria_sahar.4.t: "La guerra ha sido Won"
 algeria_sahar.4.d: "Nuestras fuerzas han vencido. El conflicto del Sáhara Occidental ha terminado y estamos libres de reformular el orden político de la región tal como nos parece apropiado."
 algeria_sahar.4.a: "Establecer la Federación saharaui."
 algeria_sahar.5.t: "Por fin la paz."
 algeria_sahar.5.d: "Firmamos un tratado de paz con Sarawi y la guerra ha terminado."
 algeria_sahar.5.a: "Nuestros tiempos más oscuros.."
 algeria_sahar.6.t: "¡Rechazaron!"
 algeria_sahar.6.d: "¡Sarawi ha rechazado nuestro tratado de paz! ¡La guerra continúa!"
 algeria_sahar.6.a: "Acknowledged."
 algeria_sahar.7.t: "Sarawi acepta!"
 algeria_sahar.7.d: "Sarawi acepta nuestra oferta."
 algeria_sahar.7.a: "Onward to UAR!"
 algeria_sahar.8.t: "¡Rechazaron!"
 algeria_sahar.8.d: "Sarawi ha rechazado nuestra oferta."
 algeria_sahar.8.a: "Qué pena."
 TT_ALG_DEAL_WITH_TRADE_UNIONS: "Aumentaremos la opinión sindical cuando los tengamos como una facción interna"
 ALG_oil_price_collapse: "Collapse de precio del petróleo"
 ALG_oil_price_collapse_desc: "Una fuerte caída de los precios mundiales del petróleo ha impactado gravemente los ingresos estatales de Argelia. Como los hidrocarburos siguen siendo la columna vertebral de la economía nacional, este colapso amenaza la estabilidad presupuestaria, las reservas monetarias y el gasto social.\n\n§R- Plummets de ingresos del Tesoro§!"
 alg_hirak_victory_option: "Hirak Movimiento Prevails"
 alg_hirak_victory_option_desc: "Después de años de protesta, movilización y resistencia popular, el Movimiento Hirak finalmente ha prevalecido. Actualmente se están llevando a cabo reformas democráticas, pero el Estado sigue siendo frágil e incierto en la transición.\n\n§G+ Legitimación reformista§!\n§Y- Influencia profunda del Estado§!"
 alg_hirak_reforms_title: "Reformas de Hirak-Driven"
 alg_hirak_reforms_desc: "Frente a la inmensa presión de la calle, el gobierno se ve obligado a implementar reformas simbólicas."
 alg_hirak_reforms_option: "Anunciar reformas políticas"
 alg_hirak_gains_influence_tt: "§YHirak§! gana mayor influencia en el equilibrio político."
 alg_hirak_crackdown_title: "Averiguar las protestas de Hirak"
 alg_hirak_crackdown_desc: "El régimen ha elegido la represión sobre la reforma, desencadenando fuerzas de seguridad contra los manifestantes."
 alg_hirak_crackdown_option: "Use la fuerza para restaurar el orden"
 alg_pouvoir_crackdown_tt: "§YLe Pouvoir§! consolida el poder a costa de la estabilidad."
 alg_health_crisis_title: "Crisis de salud presidencial"
 alg_health_crisis_desc: "El Presidente Bouteflika ha sufrido un grave incidente de salud, suscitando preocupación por el liderazgo envejecido y la falta de transparencia en la política argelina. Mientras su círculo cercano insiste en que seguirá gobernando, muchos dentro de la población y los círculos de élite comienzan a cuestionar la legitimidad de su dominio continuado."
 alg_health_crisis_option_continue: "Reafirmar el liderazgo de Bouteflika"
 alg_le_pouvoir_strengthens_tt: "§YLe Pouvoir§! consolida más poder mientras el círculo interior del presidente lo protege del escrutinio público."
 maghreb_union_member: "§YAceptó nuestra propuesta de formar la Unión del Magreb§!"
 has_power_balance_algeria: "Elecciones completas de Argelia 2014"
 supports_brics: "Apoyo BRICS"
 ALG_eu_trade_agreements_desc: "Firmar acuerdo comercial con la UE para fortalecer nuestros niveles con Occidente y desarrollar nuestra economía"
 ALG_join_nato_partnership_desc: "Únete a la Alianza de la OTAN para que podamos dominar la región africana y hacer de Argelia un primer país mundial"
 ALG_al_quwwat_al_jawwiya_al_jazaeriya: "Fuerza Aérea de Argelia"
 ALG_al_quwwat_al_jawwiya_al_jazaeriya_desc: "La Fuerza Aérea Argelina ha sido uno de los pilares de nuestro poder militar desde la independencia. El fortalecimiento de nuestras capacidades aéreas mediante la modernización y las adquisiciones garantizará el dominio en los cielos del norte de África."
 ALG_al_jaysh_al_watani_al_shaabi: "El Ejército Nacional del Pueblo"
 ALG_al_jaysh_al_watani_al_shaabi_desc: "El Ejército Nacional del Pueblo es la columna vertebral de la defensa de Argelia. La reforma y el equipamiento de las fuerzas terrestres asegurarán nuestro territorio y mantendrán la estabilidad ante amenazas."
 ALG_al_quwwat_al_bahriya_al_jazaeriya: "Fuerza Naval de Argelia"
 ALG_al_quwwat_al_bahriya_al_jazaeriya_desc: "Las Fuerzas Navales Argelinas salvaguardan nuestra costa mediterránea e intereses marítimos. La ampliación de nuestra flota e infraestructura permitirá a Argelia proyectar el poder y proteger los carriles marinos vitales."
 ALG_al_quwwat_al_musallaha_al_jazaeriya: "La Fuerza Armada de Argelia"
 ALG_al_quwwat_al_musallaha_al_jazaeriya_desc: "Las Fuerzas Armadas de Argelia representan la fuerza combinada de nuestro ejército, la fuerza aérea y la marina. Como garante de la soberanía nacional, deben ser reestructurados y modernizados para hacer frente a los desafíos del nuevo siglo."
 ALG_expand_the_EFCIP: "Ampliar el EFCIP"
 ALG_expand_the_EFCIP_desc: "La Escuela de Comando y Iniciación Paracaídas (EFCIP) en Boghar ha sido la piedra angular del entrenamiento de las fuerzas especiales de Argelia desde 1963. Al ampliar sus instalaciones, modernizar su infraestructura e introducir programas de combate avanzados, mejoraremos aún más las capacidades de nuestros comandos y paracaidistas. Esta inversión garantizará que Argelia mantenga uno de los cuerpos especiales más formidables del norte de África."
 ALG_expand_conscription: "Ampliar la conscripción"
 ALG_expand_conscription_desc: "Ampliar la conscripción aumenta nuestro grupo de soldados entrenados. Esto asegura suficiente mano de obra para defender a la nación y responder a amenazas."
 ALG_expand_military_infrastructure: "Ampliación de la infraestructura militar"
 ALG_expand_military_infrastructure_desc: "La construcción de nuevas bases, centros de entrenamiento y centros logísticos fortalece nuestra capacidad militar. Las mejoras de infraestructura apoyan la eficiencia operacional."
 ALG_focus_on_military_morale: "Enfoque Sobre la Morale Militar"
 ALG_focus_on_military_morale_desc: "La moral alta es crítica para la eficacia de combate. Invertir en el bienestar de los soldados, el liderazgo y el esprit de corps aumenta el espíritu de lucha."
 ALG_expand_artillery_units: "Ampliar las unidades de artillería"
 ALG_expand_artillery_units_desc: "La artillería proporciona fuerza de fuego vital en el campo de batalla. Aumentar las unidades de artillería aumenta las capacidades ofensivas y defensivas de nuestro ejército."
 ALG_an_army_of_the_masses: "Un ejército de las masas"
 ALG_an_army_of_the_masses_desc: "Un ejército grande y bien entrenado puede disuadir de la agresión y proteger la soberanía. La construcción de un ejército de masas requiere el compromiso con la capacitación y los recursos."
 ALG_expand_the_escuela_de_condores: "Ampliar la Escuela de Condores"
 ALG_expand_the_escuela_de_condores_desc: "La Escuela Condores entrena soldados argelinos elite. Ampliarla desarrollará más fuerzas especiales para hacer frente a complejos problemas de seguridad."
 ALG_form_specops_brigades: "Forma de brigadas de fuerzas especiales"
 ALG_form_specops_brigades_desc: "Las brigadas de fuerzas especiales llevan a cabo misiones de alto riesgo que requieren aptitudes avanzadas. Formar estas unidades aumenta la flexibilidad táctica de Argelia."
 ALG_military_mechanization: "Mecanización militar"
 ALG_military_mechanization_desc: "La infantería mecanizada mejora la movilidad y la potencia de fuego. Esta transición moderniza el ejército y aumenta la eficacia del campo de batalla."
 ALG_abolish_conscription: "Conscripción original"
 ALG_abolish_conscription_desc: "Terminar la conscripción traslada al ejército a una fuerza profesional de voluntarios. Esto puede mejorar la calidad pero reduce la disponibilidad de mano de obra."
 ALG_quality_over_quantity: "Calidad sobre la cantidad"
 ALG_quality_over_quantity_desc: "Enfoque En una fuerza más pequeña y mejor equipada aumenta la eficacia de combate. El entrenamiento y el equipo moderno se priorizan sobre los números más altos."
 ALG_a_cost_effective_army: "Un ejército eficaz en función del costo"
 ALG_a_cost_effective_army_desc: "Mantener un ejército magro y eficiente garantiza la responsabilidad fiscal. El presupuesto inteligente nos permite equilibrar las necesidades de defensa con realidades económicas."
 ALG_modernizing_our_equipment: "Modernización de nuestro equipo"
 ALG_modernizing_our_equipment_desc: "Mejorar las armas y el equipo mantiene a nuestras fuerzas competitivas. El equipo moderno mejora la supervivencia y el poder de combate."
 ALG_develop_algerian_military_industry: "Desarrollo de la industria militar argelina"
 ALG_develop_algerian_military_industry_desc: "El establecimiento de una industria nacional de armamentos reduce la dependencia de las importaciones. Esto fortalece la soberanía y crea empleos."
 ALG_cooperate_with_foreign_arms_companies: "Cooperar con las empresas de armas extranjeras"
 ALG_cooperate_with_foreign_arms_companies_desc: "La asociación con las empresas internacionales de armas acelera la transferencia de tecnología. Estas colaboraciones mejoran nuestras capacidades militares."
 ALG_tackle_military_corruption: "Lucha contra la corrupción militar"
 ALG_tackle_military_corruption_desc: "La corrupción socava la eficacia militar y la moral. Las fuertes reformas y la supervisión restablecen la confianza y la disciplina."
 ALG_elite_officer_training: "Capacitación de oficiales de élite"
 ALG_elite_officer_training_desc: "Los oficiales altamente cualificados son clave para el éxito del campo de batalla. Programas de capacitación especializados construyen liderazgo y experiencia estratégica."
 ALG_an_army_for_the_future: "Un ejército para el futuro"
 ALG_an_army_for_the_future_desc: "Debemos preparar a los militares para enfrentar futuras amenazas y tecnologías. La innovación y la adaptabilidad son fundamentales para esta visión."
 ALG_purchase_american_aircraft: "Compra American Aircraft"
 ALG_purchase_american_aircraft_desc: "Adquirir aviones de los Estados Unidos proporciona tecnología avanzada y una fiabilidad demostrada. Esto fortalece nuestras capacidades aéreas."
 ALG_purchase_chinese_aircraft: "Compra de aeronaves chinas"
 ALG_purchase_chinese_aircraft_desc: "Los aviones chinos ofrecen opciones rentables y una creciente sofisticación tecnológica. Diversifying providers expands strategic partnerships."
 ALG_purchase_russian_aircraft: "Compra de aeronaves rusas"
 ALG_purchase_russian_aircraft_desc: "Los aviones rusos traen diseños robustos y un fuerte rendimiento. La cooperación aumenta la versatilidad de nuestra fuerza aérea."
 ALG_improve_air_defense_infrastructure: "Mejorar la infraestructura de defensa aérea"
 ALG_improve_air_defense_infrastructure_desc: "Fortalecer los sistemas de defensa antiaérea protege activos críticos y centros de población. Las mejoras reducen la vulnerabilidad a las amenazas aéreas."
 ALG_close_air_support: "Cerrar apoyo aéreo"
 ALG_close_air_support_desc: "El apoyo aéreo cercano aumenta la eficacia de las fuerzas terrestres durante el combate. La integración de las operaciones aéreas y terrestres es vital para el éxito del campo de batalla."
 ALG_a_new_world_class_academy: "Una nueva Academia Mundial"
 ALG_a_new_world_class_academy_desc: "Establecer una academia militar de clase mundial desarrollará futuros líderes. Esta institución establecerá normas para la excelencia."
 ALG_dominate_the_skies: "Dominar los Cielos"
 ALG_dominate_the_skies_desc: "Alcanzar la superioridad del aire es esencial en la guerra moderna. Vamos a invertir para controlar nuestro espacio aéreo y apoyar todas las operaciones militares."
 ALG_might_of_the_sky: "El poder del cielo"
 ALG_might_of_the_sky_desc: "Nuestra potencia aérea simboliza la fuerza nacional y el progreso tecnológico. Mantener una poderosa fuerza aérea disuade la agresión."
 ALG_naval_military_police: "Policía militar naval"
 ALG_naval_military_police_desc: "La policía militar naval mantiene disciplina y seguridad a bordo de buques y bases. Garantizan el orden y las operaciones eficaces."
 ALG_expand_the_naval_academy: "Ampliar la Academia Naval"
 ALG_expand_the_naval_academy_desc: "Una academia naval ampliada entrena más oficiales y marineros. Esta inversión construye fuerzas marítimas profesionales y capaces."
 ALG_return_to_the_sea: "Nuestro regreso al mar"
 ALG_return_to_the_sea_desc: "Recovering access to the Pacific Ocean es un objetivo histórico para Argelia. Desarrollar una presencia naval es crucial para esta ambición."
 ALG_algerian_marine_forces: "Fuerzas Armadas de Argelia"
 ALG_algerian_marine_forces_desc: "Las fuerzas marinas proporcionan capacidades de respuesta rápida y experiencia anfibia. Su expansión aumenta el alcance operacional de Argelia."
 ALG_quick_strikes: "Strikes rápido"
 ALG_quick_strikes_desc: "Las huelgas rápidas y decisivas pueden abrumar a los adversarios. El desarrollo de esas fuerzas aumenta la flexibilidad táctica."
 ALG_invest_into_shipbuilding: "Invertir en la construcción naval"
 ALG_invest_into_shipbuilding_desc: "La construcción de una industria naval nacional apoya la expansión naval y el crecimiento económico. Este sector es estratégico para la defensa a largo plazo."
 ALG_djebel_chenoua: "Djebel Chenoua"
 ALG_djebel_chenoua_desc: "Creando una poderosa flota proyecta fortaleza y protege los intereses nacionales.Djebel Chenoua es un símbolo de soberanía marítima."
 ALG_masters_of_the_mediterranean: "Maestros del Mediterráneo"
 ALG_masters_of_the_mediterranean_desc: "Dominar aguas mediterráneas asegura rutas comerciales y ventajas estratégicas. Argelia debe aspirar a ser un actor clave en esta región."
 ALG_focus_on_mass_assault_tactics: "Enfoque Sobre tácticas de asalto masivo"
 ALG_focus_on_mass_assault_tactics_desc: "Las tácticas de asalto masivo enfatizan fuerzas enemigas abrumadoras con grandes concentraciones de tropas. Esta estrategia se basa en la mano de obra y la coordinación para lograr la victoria."
 ALG_licence_mir: "Comprando una licencia para el Mirage"
 ALG_licence_mir_desc: "Tenemos todos los medios para producir aviones franceses, así que debemos solicitar una licencia para producirlos."
 ALG_purchase_russian_su30: "Purchase Russian SU-30"
 ALG_purchase_russian_su30_desc: "Como potencia regional, es fundamental salvaguardar nuestras vastas fronteras y proyectar influencia en todo el Magreb y el Sahel. Nuestro alto mando militar ha identificado el legendario Su-30 de Rusia como la plataforma ideal para mejorar significativamente nuestra superioridad aérea. Esta adquisición no sólo aumentaría la fuerza y estandarizaría la logística de nuestra flota, sino que también proporcionaría una ventaja decisiva e inmediata, aunque sin duda atraerá una atención internacional significativa."
 alg_politics.50.t: "Muerte del General Smaïn Lamari"
 alg_politics.50.d: "El general Smaïn Lamari, jefe de la temida rama de contrainteligencia del DRS, ha fallecido. Su muerte repentina deja un vacío de poder en el estado profundo de Argelia, como maniobra de rivales para reclamar su influencia anterior."
 alg_politics.50.a: "Una sombra del viejo régimen desaparece."
 ALG_black_decade_threat: "Renacimiento de los métodos del Decenio Negro"
 ALG_2001_title: "Promoción de Fatima Boudouani"
 ALG_2001_desc: "Como parte de la renovación reformista del presidente Bouteflika, Fatima Boudouani se convierte en la primera mujer general de Argelia. Su promoción marca una nueva era para las mujeres de las fuerzas armadas, impulsando la moral y señalando la modernización."
 ALG_2001_a: "Un paso histórico para el ejército."
 ALG_2002_title: "Promoción de Fatima Zohra Ardjoune"
 ALG_2002_desc: "Tras el ascenso de Fátima Boudouani, Fatima Zohra Ardjoune es ahora promovida al rango general. Como primera mujer general en el cuerpo médico argelino, su nombramiento refleja los cautelosos pasos de Argelia hacia la inclusión de género en sus militares."
 ALG_2002_a: "Otra barrera rota."
 alg_reform.1.t: "Una oportunidad para una verdadera reforma"
 alg_reform.1.d: "Siguiendo la iniciativa 'Por el Pueblo, por el Pueblo', Argelia tiene una rara oportunidad de elegir a un líder comprometido con una reforma genuina. Han surgido tres candidatos, cada uno prometiendo un camino diferente para estabilizar y modernizar el país. La elección ahora descansa con la gente."
 alg_reform.1.a: "Ahmed Benbitour – El reformador técnico"
 alg_benbitour_desc: "Ahmed Benbitour es un tecnócrata centrado en la eficiencia administrativa y la modernización económica. Su enfoque constante está orientado a fomentar la estabilidad a largo plazo y reformar las instituciones estatales."
 alg_reform.1.b: "Soufiane Djilali – El reformador carismático"
 alg_djilali_desc: "Soufiane Djilali es un líder de oposición reformista, enfatizando las reformas sociales y políticas. Carismático y decidido, busca fortalecer las instituciones democráticas y la participación pública."
 alg_reform.1.c: "Rachid Nekkaz – El activista populista"
 alg_nekkaz_desc: "Rachid Nekkaz es un activista populista apelando directamente al pueblo. Mientras su popularidad es alta, su estilo de confrontación podría crear inestabilidad en un ambiente político delicado."
 ALG_citizens_constitution: "Constitución ciudadana"
 ALG_justice_for_the_people: "Justicia para el Pueblo"
 ALG_free_press_free_people: "Prensa libre, gente libre"
 ALG_economic_transparency: "Transparencia"
 ALG_citizens_constitution_desc: "Elaborar una nueva constitución que garantice los derechos fundamentales y refuerce las instituciones democráticas."
 ALG_justice_for_the_people_desc: "Reformar el poder judicial para asegurar que sea independiente, justo y protegido de la injerencia política."
 ALG_free_press_free_people_desc: "Garantizar la libertad de prensa, permitiendo a los medios responsabilizar al poder e informar a los ciudadanos."
 ALG_economic_transparency_desc: "Aplicar políticas presupuestarias y fiscales transparentes para combatir la corrupción y aumentar la confianza pública."
 ALG_true_reformist_path_tt: "Este camino permite a Argelia elegir un verdadero líder reformista, aumentar la popularidad y estabilidad democráticas, y poner en marcha reformas políticas y económicas para el pueblo."
 algeria_news.3_tt: "El programa de paz de Bouteflika da a Argelia un sentido de esperanza, mejorando la estabilidad y el apoyo democrático."
 algeria_news.7_tt: "La resistencia a 'le pouvoir' gana apoyo popular, potenciando la influencia democrática y el capital político."
 algeria_news.1_tt: "El ejército asegura el control después de las medidas de emergencia. Estabilidad cae ligeramente, pero el apoyo a la guerra y el poder político aumentan."
 algeria_news.4_tt: "El esfuerzo de reconciliación de Bouteflika aumenta la estabilidad nacional y el apoyo democrático."
 algeria_news.8.t: "Las víctimas de la década negra"
 algeria_news.8.d: "La Guerra Civil de la década de 1990 dejó cientos de miles de víctimas: los desaparecidos, las viudas, los huérfanos y los que sufrieron tortura y terror. A medida que Argelia busca la reconciliación, surge la pregunta: ¿cómo debe responder el Estado a las exigencias de justicia y reconocimiento?"
 algeria_news.8.a: "Indemnizar a las familias y víctimas"
 algeria_news.8.b: "Ofrecer sólo reconocimiento simbólico"
 algeria_news.8.c: "No podemos morar en el pasado"
 algeria_news.8_a_tt: "§YLos programas de compensación económica§! mejorarán la estabilidad y fortalecerán la legitimidad de Argelia, pero tensan el tesoro."
 algeria_news.8_b_tt: "§YEl reconocimiento simbólico§! mejora la estabilidad a un enorme costo político, pero deja algunas demandas insatisfechas."
 algeria_news.8_c_tt: "§YIgnorar las demandas de las víctimas§! ahorra recursos ahora, pero reduce la estabilidad y alimenta el descontento."
 algeria_news.10.t: "El camino a la recuperación"
 algeria_news.10.d: "Con el fin del conflicto civil, Argelia se enfrenta al desafío monumental de reconstruir su economía destrozada. Los factores están inactivos, la infraestructura está dañada y el desempleo sigue siendo peligrosamente alto. Sin embargo, por primera vez en años, hay esperanza de que la reconstrucción y la reforma puedan restaurar la prosperidad y la estabilidad."
 algeria_news.10.a: "¡La recuperación comienza!"
 algeria_news.10_a_tt: "§YLos primeros pasos se toman para reactivar la economía de Argelia.§! Esto abre el camino hacia reformas más profundas en infraestructura, industria y finanzas."
 algeria_news.11.t: "Ayuda de las Naciones Unidas Misión"
 algeria_news.11.d: "Representantes de las Naciones Unidas han llegado a Argel con una oferta de ayuda económica y asistencia para la reconstrucción. Sus programas podrían aportar valiosos fondos, experiencia y ayuda humanitaria, pero muchos del gobierno advierten que aceptar esa ayuda puede invitar a la injerencia extranjera en los asuntos internos de Argelia."
 algeria_news.11.a: "Aceptar la ONU Misión"
 algeria_news.11_a_tt: "§GRecibiremos fondos de ayuda internacional y apoyo técnico.§! \n§R Sin embargo, esto aumentará la influencia americana, francesa, británica en Argelia.§!"
 algeria_news.11.b: "Rechazar la Interferencia Extranjera"
 algeria_news.11_b_tt: "§RRechazamos la supervisión de la ONU y nos recuperaremos por nuestra cuenta.§! \n§Y Esto preserva nuestra soberanía pero retrasa el crecimiento económico.§!"
 algeria_news.20.t: "Revisión de la Política Exterior de Argelia"
 algeria_news.20.d: "Con el fin del conflicto civil y la frágil recuperación de Argelia en curso, el liderazgo en Argel ha lanzado una revisión completa de la política exterior de la nación. Las decisiones tomadas en los próximos años determinarán si fortalecemos los vínculos con antiguos aliados, buscamos nuevas alianzas o mantenemos nuestra independencia en un mundo cada vez más polarizado. El debate ha comenzado, y pronto Argelia tendrá que elegir su curso."
 algeria_news.20.a: "El futuro de Argelia espera."
 algeria_news.20_tt: "§YEsto marca el comienzo de la rama política exterior de Argelia.§!"
 ALG_between_east_and_west_tt: "Argelia trata de equilibrar las relaciones entre Oriente y Occidente, al tiempo que afirma una política exterior no alineada."
 ALG_mediate_great_power_conflict_tt: "Argelia media activamente entre las potencias mundiales, construyendo su reputación como un pacificador neutral."
 ALG_secure_balance_tt: "Argelia refuerza su posición no alineada, asegurando un equilibrio estable entre las principales potencias mundiales."
 alg_news_non_aligned.1.t: "Equilibrio entre Oriente y Occidente"
 alg_news_non_aligned.1.d: "Argelia ha comenzado a trazar un curso cuidadoso entre las principales potencias mundiales, tratando de mantener su independencia mientras participa diplomáticamente tanto con Oriente como con Occidente."
 alg_news_non_aligned.1.a: "Argelia busca equilibrio"
 alg_news_non_aligned.2.t: "Mediación de las tensiones mundiales"
 alg_news_non_aligned.2.d: "Argelia ha avanzado en la mediación de las tensiones entre las principales potencias, con el objetivo de mejorar su posición internacional como promotor de la paz neutral."
 alg_news_non_aligned.2.a: "Mediación en curso"
 alg_news_non_aligned.3.t: "Promoción de la reconciliación regional"
 alg_news_non_aligned.3.d: "Argelia ha puesto en marcha una serie de iniciativas diplomáticas para conciliar las diferencias entre los poderes regionales, procurando la estabilidad y la colaboración."
 alg_news_non_aligned.3.a: "Actividades de reconciliación"
 alg_news_non_aligned.4.t: "Asegurar el equilibrio de los países no alineados"
 alg_news_non_aligned.4.d: "Argelia ha solidificado su postura no alineada, manteniendo cuidadosamente las relaciones con los principales poderes sin comprometerse plenamente a ningún bloque."
 alg_news_non_aligned.4.a: "Saldo garantizado"
 alg_news_non_aligned.5.t: "Renacimiento del Movimiento de los Países No Alineados"
 alg_news_non_aligned.5.d: "Argelia ha adoptado medidas para revitalizar su participación en el Movimiento de los Países No Alineados, reafirmando su liderazgo e influencia diplomática entre las naciones neutrales."
 alg_news_non_aligned.5.a: "Influencia NAM restaurada"
 alg_news_non_aligned.6.t: "Apoyo al mundo en desarrollo"
 alg_news_non_aligned.6.d: "Argelia ha comenzado una amplia extensión diplomática y económica a las naciones en desarrollo, promoviendo la estabilidad y la cooperación al mismo tiempo que aumenta su influencia en el continente."
 alg_news_non_aligned.6.a: "Extensión iniciada"
 algeria_news.9.t: "El legado de la década negra"
 algeria_news.9.d: "La guerra civil dejó profundas cicatrices en Argelia. El gobierno debe decidir cómo enmarcar el pasado, asignar culpa y guiar el futuro de la nación."
 algeria_news.9.a: "Retrocedan el régimen militar"
 algeria_news.9.b: "Junto con las víctimas y los pobres"
 algeria_news.9.c: "Culpa de actores externos"
 algeria_news.9.dd: "Erradicación oficial y supresión del debate"
 ALG_promote_reconciliation_tt: "§GConciliación Promota:§!\n• Mejorar las relaciones con los vecinos\n• Reducir las tensiones regionales\n• Canales diplomáticos abiertos"
 alg_mufti.2.t: "¿Cuál camino para el Estado Islámico?"
 alg_mufti.2.d: "Ahora que el Islam ha sido declarado el principio rector de la nación, debemos decidir cuál será el camino actual. El Movimiento Renacimiento Islámico (Nahda), dirigido por Abdallah Djaballah, exige una visión islamista moderada y estructurada a través de la urna electoral. Pero otros miran a los predicadores ulemas y carismáticos que prometen una forma más directa e intransigente de la autoridad islámica."
 alg_mufti.2.a: "Empoderar al Movimiento Renacimiento Islámico (Nahda)"
 alg_mufti.2.a.tt: "El Nahda de Djaballah se convierte en la fuerza líder de la política islámica."
 alg_mufti.2.b: "Lugar Autoridad en las Manos del Ulema"
 alg_mufti.2.b.tt: "Más tarde elegiremos si seguir a un predicador controvertido o a un Mufti aprobado por el gobierno."
 alg_mufti.3.t: "La cara del Ulema"
 alg_mufti.3.d: "Con la autoridad del ulema confirmada, el gobierno debe decidir quién representará esta corriente en liderazgo. Cheikh Bouamrane es un moderado, aceptable para el Estado y los militares, mientras que Ali Belhadj sigue siendo una voz radical y ardiente que inspira apoyo popular pero arriesga la confrontación con las autoridades."
 alg_mufti.3.a: "Apoyo Belhadj"
 alg_mufti.3.a.tt: "Ali Belhadj se convertirá en el líder, representando una corriente salafista de línea dura."
 alg_mufti.3.b: "Apoyo Bouamrane"
 alg_mufti.3.b.tt: "Cheikh Bouamrane se convertirá en el líder, representando una corriente de ulema moderada y alineada por el estado.\n§RNo disponible después de mayo de 2016.§!"
 ALG_ennahda: "Apoya a Ennahda"
 ALG_ennahda_desc: "Apoyaremos a Abdallah Djaballah y al Movimiento Renacentista Islámico, llevando la política islamista al pliegue de nuestras instituciones estatales."
 ALG_independent: "Ulema independiente"
 ALG_independent_desc: "Fortaleceremos la independencia del ulema, dando autoridad a eruditos religiosos sobre asuntos espirituales y potencialmente sobre el liderazgo estatal."
 ALG_grand_mufti_rule: "Las reglas del Gran Mufti"
 ALG_grand_mufti_rule_desc: "El ulema, o un movimiento islamista político, proporcionará la autoridad rectora del Estado argelino. El camino que hemos elegido determinará quién emerge como el rostro de la autoridad islámica."
 ALG_nahda_path: "Escoge el camino de Nahda"
 ALG_ulema_path: "Escoge el camino de Ulema"
 ALG_belhadj_leader: "Ali Belhadj es el líder"
 ALG_bouamrane_leader: "Cheikh Bouamrane es el líder"
 ALG_constitution_1996: "1996 Constitution"
 ALG_constitution_1996_desc: "La Constitución revisada de 1996 tenía por objeto estabilizar a Argelia tras la crisis del Decenio Negro. Sin embargo, muchas disposiciones se diseñaron teniendo en cuenta la supervivencia del régimen, en lugar de una democratización genuina. Su rígido marco secular fue visto por grandes partes del movimiento islamista como ilegítimo y 'un-islámico'. Mientras consolida el control estatal y fortalece la presidencia, también restringe la participación política, reduce la confianza entre el gobierno y la sociedad, y obstaculiza la reforma a largo plazo. El legado de esta constitución sigue pesando mucho sobre la estabilidad y legitimidad de Argelia."
 ALG_enahda_media_network_idea: "Red de medios Ennahda"
 ALG_enahda_media_network_idea_desc: "El movimiento Ennahda ha establecido sus propios medios de comunicación para difundir su mensaje y movilizar el apoyo público. Estos medios promueven valores inspirados religiosamente y critican los fracasos del régimen.\n\n§YEste espíritu nacional será eliminado si no estamos alineados con Ennahda§!"
 ALG_supreme_islamic_council_idea: "Consejo Islámico Supremo"
 ALG_supreme_islamic_council_idea_desc: "Se ha establecido un consejo consultivo compuesto por ulema senior y estudiosos islámicos para orientar la política estatal en las líneas religiosas. Si bien no tiene poder directo, su influencia en la legislación y la vida pública es significativa.\n\n§YEste espíritu nacional será eliminado si no somos salafistas o islamistas§!"
 alg_constitution.1.t: "La Constitución está reformada"
 alg_constitution.1.d: "Tras años de controversia, se ha revisado la Constitución de 1996. El nuevo marco elimina algunas de las disposiciones más autoritarias, introduce controles sobre el poder ejecutivo y busca crear un mejor equilibrio entre las corrientes islámicas y seculares de Argelia. Muchos consideran esto como un paso necesario hacia la reconciliación, mientras que otros dudan de si las reformas cambiarán verdaderamente el sistema arraigado de le pouvoir."
 alg_constitution.1.a: "Adoptar la nueva Constitución"
 alg_constitution.1.a.tt: "Sustitúyase el §YConstitución de 1996§! con una §YConstitución reformada§!, proporcionar bonos a la estabilidad, el poder político y el crecimiento económico."
 ALG_ali_belhadj_desc: "Ali Belhadj, cofundador del Frente Islámico de Salvación (FIS), fue uno de los líderes islamistas más carismáticos y radicales del turbulento 1990 de Argelia. Conocido por sus sermones ardientes, retórica intransigente y rechazo a la política secular, se convirtió en un símbolo de resistencia al régimen FLN. Encarcelada por gran parte de la guerra civil y prohibida por la política formal con arreglo a la Constitución de 1996, Belhadj sigue siendo una figura polarizadora, para algunos, la encarnación de la queja islamista; para otros, un recordatorio peligroso del Decenio Negro. Su posible regreso a la etapa política suscita tanto las esperanzas de reconciliación como los temores de un nuevo extremismo."
 ALG_bouamrane_desc: "Mohamed Bouamrane surgió en los años noventa como un actor intelectual y político islamista más moderado. Abogó por el diálogo sobre la confrontación, se situó entre islamistas duros como Ali Belhadj y la arraigada élite FLN. Aunque nunca logró el mismo llamamiento masivo que el liderazgo de la FIS, Bouamrane se convirtió en una figura respetada en los debates posteriores a la guerra sobre reconciliación y reforma constitucional. Su visión hizo hincapié en un Argelia donde los valores islámicos podrían coexistir con instituciones democráticas, lo que le convierte en una figura de puente en el tenso equilibrio entre la política secular y la política religiosa."
 algeria_elections.2024.t: "2024 Elecciones Presidenciales"
 algeria_elections.2024.d: "Argelia entra en otra elección crítica. Las tres figuras principales encarnan caminos divergentes: Abdelmadjid Tebboune, continuidad prometedora bajo el FLN; Soufiane Djilali Aouchiche, abogando por la reforma democrática y la modernización liberal; y Abdelali Hassani, respaldado por corrientes islamistas que buscan un papel más importante para la religión en la política. Los resultados reflejan el equilibrio de poder entre las facciones."
 algeria_elections.2024.a: "Abdelmadjid Tebboune asegura la reelección."
 algeria_elections.2024.b: "Youcef Aouchiche gana la presidencia."
 algeria_elections.2024.c: "Abdelali Hassani se levanta con el apoyo islamista."
 ALG_tebboune_2024_tt: "§YAbdelmadjid Tebboune§! sigue siendo presidente con dominio FLN."
 ALG_aouchiche_2024_tt: "§YYoucef Aouchiche§! se convierte en presidente, liderando a los liberales reformistas."
 ALG_hassani_2024_tt: "§YAbdelali Hassani§! se convierte en Presidente, respaldado por los movimientos islamistas."
 algeria_gspc.1.t: "Nabil Sahraoui toma la carga del GSPC"
 algeria_gspc.1.d: "El descontento ha crecido dentro del Groupe Salafiste pour la Prédication et le Combat (GSPC). Muchos comandantes han acusado a Hassan Hattab de debilidad, criticando su vacilación para perseguir la yihad a gran escala. A mediados de 2003, Hattab fue marginado por sus propios hombres, y Nabil Sahraoui, una figura mucho más radical, se ha declarado el nuevo emir del GSPC."
 algeria_gspc.1.a: "La insurgencia se radicaliza aún más."
 ALG_sahraoui_rise_tt: "§YNabil Sahraoui§! sustituye a Hassan Hattab como nuevo líder del GSPC."
 algeria_gspc.2.t: "Sahraoui mató, Droukdel Emerges"
 algeria_gspc.2.d: "En junio de 2004, las fuerzas de seguridad argelinas mataron a Nabil Sahraoui en un enfrentamiento. Sin embargo, su muerte no ha debilitado la insurgencia, en cambio, el liderazgo ha pasado a Abdelmalek Droukdel, un ambicioso estratega con vínculos con la red global de Al-Qaeda. Bajo él, es probable que el GSPC se expanda e internacionalice su yihad."
 algeria_gspc.2.a: "Comienza una era más mortal."
 ALG_droukdel_rise_tt: "§YAbdelmalek Droukdel§! se convierte en el líder del GSPC."
 algeria_gspc.3.t: "Hassan Hattab Surrenders"
 algeria_gspc.3.d: "Después de años, el fundador del GSPC, Hassan Hattab, se ha entregado a las autoridades argelinas. Desilusionado con el camino del movimiento que creó una vez, Hattab aceptó el programa de amnistía del gobierno. Mientras su influencia ha disminuido, su rendición representa una victoria simbólica para el estado argelino."
 algeria_gspc.3.a: "Un símbolo de derrota para la insurgencia."
 ALG_hattab_surrender_tt: "§Y Hassan Hattab§! se rinde, reduciendo la actividad de insurgencia."
 alg_generals.1.t: "Abdelkader Lounès Designed Air Force Commander"
 alg_generals.1.d: "El General Abdelkader Lounès ha sido nombrado Comandante de la Fuerza Aérea Argelina. Conocido por su enfoque en la modernización, supervisará el desarrollo del poder aéreo de Argelia durante la próxima década."
 alg_generals.1.a: "Nuestros cielos están en manos seguras."
 alg_generals.2.t: "Amar Amrani toma el mando de la defensa aérea"
 alg_generals.2.d: "El General Mayor Amar Amrani ha sido puesto a cargo de las Fuerzas de Defensa Terrestre de Argelia. Su liderazgo fortalecerá la capacidad de Argelia para defender su espacio aéreo frente a amenazas extranjeras."
 alg_generals.2.a: "Nuestra defensa aérea crece más fuerte."
 alg_generals.3.t: "Menad Nouba se convierte en comandante de la gendarmería"
 alg_generals.3.d: "El General Menad Nouba ha sido nombrado Comandante de la Gendarmería Nacional argelina. Enfrentándose a la seguridad interna y la contrainsurgencia, su liderazgo será crucial para mantener el orden interno."
 alg_generals.3.a: "Una mano firme para la seguridad de Argelia."
 ALG_ouyahia_pm: "Ahmed Ouyahia como Primer Ministro"
 ALG_belkhadem_pm: "Abdelaziz Belkhadem como Primer Ministro"
 ALG_interim_president.1.t: "Provisional Presidency Declared"
 ALG_interim_president.1.d: "Tras la renuncia de Bouteflika, Argelia se enfrenta a un vacío de poder. Por mandato constitucional, Abdelkader Bensalah, orador de la casa superior, es juramentado como presidente interino durante 90 días. El Hirak rechaza esta cita, viéndolo como parte del mismo sistema corrupto."
 ALG_interim_president.1.a: "Appoint Abdelkader Bensalah"
 ALG_bouteflika_resigns.1.t: "Bouteflika Resigns"
 ALG_bouteflika_resigns.1.d: "Bajo inmensa presión de semanas de protestas contra Hirak y la retirada del apoyo del establishment militar, el Presidente Abdelaziz Bouteflika ha renunciado formalmente. Su presidencia de dos décadas ha terminado, dejando la incertidumbre futura de Argelia."
 ALG_bouteflika_resigns.1.a: "La era de Bouteflika ha terminado."
 ALG_hirak.100.t: "La Voz del Hirak"
 ALG_hirak.100.d: "De Argel a Oran, de Constantino a Tamanrasset, millones han marchado cada viernes exigiendo 'Yetnahaw Ga3' – todos deben ir. El viejo régimen se ha desmoronado. Ahora, el Hirak debe elegir: ¿quién llevará el espíritu del 22 de febrero al palacio presidencial en El Mouradia?"
 ALG_hirak.100.a: "Zoubida Assoul – La Voz Constitucional"
 ALG_hirak.100.b: "Karim Tabbou – Campeón de la calle"
 ALG_hirak.100.c: "Hakim Addad – la generación de RAJ"
 ALG_hirak.100.e: "Amira Bouraoui – Hija Fierce de Barakat"
 ALG_african_trade_links: "Enlaces comerciales africanos"
 ALG_african_trade_links_desc: "A través del fortalecimiento de las iniciativas económicas y diplomáticas en toda África, Argelia está ampliando su red de acuerdos comerciales, reduciendo la dependencia de los mercados externos y garantizando la prosperidad mutua con nuestros asociados continentales."
 ALG_african_mediation_role: "Función de mediación africana"
 ALG_african_mediation_role_desc: "Argelia se ha posicionado desde hace mucho tiempo como mediador de confianza en las controversias africanas. Al participar activamente en la solución de conflictos, podemos fortalecer nuestra legitimidad en el continente y ampliar nuestra influencia diplomática."
 ALG_african_union_reforms: "Empuje para las reformas de la Unión Africana"
 ALG_african_union_reforms_desc: "La Unión Africana sigue siendo limitada en su eficacia. Al impulsar reformas, fortalecer sus instituciones, promover la rendición de cuentas y fomentar el consenso, podemos asegurar que Argelia se convierta en un líder respetado dentro del marco continental de África."
 ALG_african_economic_integration: "Integración económica africana"
 ALG_african_economic_integration_desc: "La integración económica continental es clave para la prosperidad de Argelia. Al reducir las barreras comerciales y mejorar los vínculos con los asociados africanos, reduciremos la dependencia de los mercados extranjeros y fomentaremos el crecimiento sostenible en África."
 ALG_expand_african_investments: "Ampliar las inversiones africanas"
 ALG_expand_african_investments_desc: "A través de empresas respaldadas por el Estado y la cooperación con asociados africanos, Argelia puede ampliar las inversiones en infraestructura, energía y comercio. Estas inversiones impulsarán nuestra economía al tiempo que fortalecerán los lazos en todo el continente."
 ALG_PT: "PT (Partido del Trabajo)"
 ALG_PT_desc: "PT (Parti des travailleurs) es un partido político trotskista en Argelia, estrechamente vinculado con el Partido Obrero Independiente de Francia. El partido está dirigido por Louisa Hanoune.El Partido de los Trabajadores, que utiliza la abreviatura «PT», aboga por la protección y promoción de los movimientos sindicales en Argelia, desde sus reivindicaciones, incluyendo una doctrina igualitaria figura, es reclamar que una mejor distribución de la riqueza sobre el pueblo del país. La creación de este partido hasta el año 1990, un año después de la reforma constitucional que introdujo un sistema multipartidista. Su Secretario General es Louisa Hanoune, que en 2004 fue la primera mujer del mundo árabe en presentarse como candidata para una elección presidencial."
 ALG_communist_education: "Educación comunista"
 ALG_communist_education_desc: "Las mentes jóvenes son las más impresionables. Inculcar los valores básicos del comunismo en la generación más joven mientras enseñaba a los estudiantes universitarios la gloria de la igualdad podría avanzar enormemente nuestra causa."
 ALG_labour_focus_unions: "Contactar con los Sindicatos Laborales"
 ALG_labour_focus_unions_desc: "Los sindicatos sindicales estarán muy contentos de tener un gobierno dispuesto no sólo a cooperar, sino a reconocer sus demandas. Nos aseguraremos de que su influencia no se extienda más allá de nuestra venida al poder para evitar §RConflictos de interés.§!"
 ALG_failures_capitalism: "Fallos del capitalismo"
 ALG_failures_capitalism_desc: "El capitalismo ya no nos bendice con la riqueza infinita que prometió. ¡Es hora de que vayamos a nuestra propia manera de asegurarnos de que esa crisis nunca vuelva a suceder! §REl efecto de este enfoque es la magnitud de la crisis de la deuda.§!"
 ALG_working_class: "La clase obrera"
 ALG_working_class_desc: "La clase obrera - donde los sueños nacen y matan. Podemos prometerles que serán tratados bien y dado el crédito que merecen por ser la base del nuevo estado comunista."
 ALG_communist_propaganda: "Máquina Propaganda"
 ALG_communist_propaganda_desc: "Debido a nuestra creciente influencia podemos permitirnos desatar la máquina propagandística sobre Argelia. Aunque el mantenimiento monetario es alto, esta propaganda no es algo que se debe ignorar, será extremadamente eficaz para convertir a la población argelina."
 ALG_prepare_government: "Prepara un gobierno"
 ALG_prepare_government_desc: "Al establecer un gobierno dentro de nuestro partido político, aseguramos una transición efectiva que nos permita actuar con nuestros objetivos más rápido de lo que nuestros rivales pueden obtenerse. Esto será costoso, pero teniendo en cuenta nuestras probabilidades de ganar, es una apuesta bien colocada."
 ALG_damn_market: "Maldita sea el mercado libre"
 ALG_damn_market_desc: "Estamos en condiciones de hacer frente al golpe final a los capitalistas. Con el poder de la propaganda de nuestro lado, podemos hacer frente al golpe mortal a la economía del libre mercado, y en el proceso, usurpamos el trono de exceso en el que se sientan los capitalistas!"
 ALG_election_com: "Exigir elecciones inmediatas"
 ALG_election_com_desc: "Camaradas, ¡el momento es ahora! ¡Toda nuestra construcción hacia un nuevo estado libre ha llevado a este momento! \n\n§R¡Aseguraremos que el gobierno popular gobierne por otros 1000 años!§!"
 PT_flag: "PT"
 ALG_failures_capitalism_TT: "§REl efecto de las escalas focales en la magnitud de la crisis de la deuda.§!"
 ALG_communist_takeover_TT: "§G¡El pueblo argelino exige elecciones!§!\n\nAsegúrate de tener suficiente Poder político guardado para esto. Si usted §R fáil§! para elegir y formar un gobierno, usted necesitará §R para celebrar otra elección extraordinaria§! para empoderar §Y[Communist-State_L]§!"
 ALG_increase_drift_TT: "§G Aumenta la deriva política hacia este partido§!."
 ALG_wild_unions: "Sindicatos de trabajadores salvajes"
 ALG_wild_unions_desc: "Dimos poder sindical y ellos lo están usando - no vemos ningún problema con esto."
 ALG_wild_unions_2: "Sindicatos de trabajadores salvajes"
 ALG_wild_unions_2_desc: "A los sindicatos se les dio una gran libertad durante nuestro ascenso al poder. Ahora que somos victoriosos les apelamos sólo para asegurarnos de que tenemos el corazón de la gente antes de asegurar completamente nuestra base de poder."
 ALG_wild_unions_3: "Sindicatos de trabajadores salvajes"
 ALG_wild_unions_3_desc: "¡Los sindicatos obreros son simplemente insoportables, no podemos soportarlos más! Comenzaron como una molestia, pero se han convertido en una obstrucción a la voluntad del estado, deben ser pacificados o destruidos!"
 ALG_press_opposition: "Oposición de medios"
 ALG_press_opposition_desc: "Los medios de comunicación no nos han representado en lo mejor de la luz desde que restituimos el orden al gobierno, pero es lógico que los débiles temen a los fuertes."
 ALG_one_party: "Un estado de partido"
 ALG_one_party_desc: "Después de declarar que el PT es el único partido político permitido en Argelia, tenemos el poder de hacer lo que queramos, pero al costo de derramar sangre para asegurar que nuestro pueblo sea subordinado."
 ALG_reorganize_army_idea: "Reorganización del Ejército"
 ALG_reorganize_army_idea_desc: "No podemos simplemente desembolsar al ejército hasta el punto de disfunción. El tiempo puede llegar donde necesitaremos fuerzas armadas poderosas, y para esta eventualidad aseguraremos que nuestro ejército sea leal y listo."
 ALG_new_army_idea: "Un nuevo ejército"
 ALG_new_army_idea_desc: "Hemos visto un gran éxito en la policía asumiendo el papel de la principal fuerza defensiva. Sin embargo, sabemos que no están suficientemente equipados hasta el punto en que pueden repeler la invasión extranjera. Construiremos un nuevo ejército centrado exclusivamente en la defensa de Argelia para garantizar la seguridad de nuestro pueblo."
 ALG_red_army_idea: "Un ejército rojo"
 ALG_red_army_idea_desc: "Hemos inculcado el fanatismo ideológico profundamente no sólo en las filas de nuestro ejército, sino también en la población civil, asegurando que tendremos la mano de obra y la lealtad necesarias para armar un ejército formidable."
 ALG_cracked_foundation: "Una fundación agrietada"
 ALG_cracked_foundation_desc: "La fundación del estado ha sido contradichada tantas veces en este momento que si continuamos por nuestro camino actual podríamos enfrentarnos a una nueva revolución terrible. \n\n§R¡Si nuestra estabilidad cae por debajo del 30%, enfrentaremos la revolución en Argelia!§!"
 ALG_militarist_education_idea: "Educación militarista"
 ALG_militarist_education_idea_desc: "El sistema educativo ha inculcado los valores militares en su plan de estudios, permitiendo un mayor estado de preparación en caso de ataques repentinos."
 ALG_elam: "Resurgencia Popular Nacional"
 ALG_elam_desc: "El Frente Popular Nacional ha ampliado considerablemente sus esfuerzos a través de la junta directiva para influir en la mente del votante promedio. Sospechamos que Argelia es la causa de esta 'disrupción'."
 algeria.5.t: "PT pide elecciones en Argelia"
 algeria.5.d: "Después de obtener el apoyo mayoritario de la clase obrera argelina y varias figuras políticas, el Parti des Travailleurs (PT) ha pedido al gobierno que celebre elecciones libres. El PT ha recibido un apoyo masivo, y las autoridades están bajo presión de múltiples partes para conceder. Muchos esperan que el PT gane decisivamente, ya que su base entre los trabajadores y sindicatos crece más fuerte para el día. Un vocero advirtió que si se niegan las elecciones, los trabajadores lanzarían un levantamiento para derrocar al gobierno."
 algeria.5.a: "¡Trabajadores de Argelia, levántense!"
 algeria.5.b: "Interesting"
 algeria.7.t: "Argelia avanza hacia la izquierda"
 algeria.7.d: "Con el aumento del desempleo y el empeoramiento de la desigualdad económica, la clase obrera de Argelia se ha unido detrás de la extrema izquierda Parti des Travailleurs (PT). El PT denuncia políticas neoliberales y violaciones de los derechos de los trabajadores, al tiempo que apoya las posturas antioccidentales y organiza protestas para presionar al gobierno. Su influencia crece rápidamente, marcando un cambio decisivo a la izquierda en la política argelina."
 algeria.7.a: "Trabajadores de Argelia, su liberación viene"
 algeria.7.b: "Interesting"
 ALG_family_centric: "Familia Centric"
 ALG_family_centric_desc: "Estamos alentando a las familias como el principal edificio de la sociedad argelina."
 ALG_religion_in_schools: "Educación religiosa"
 ALG_religion_in_schools_desc: "Nuestro sistema educativo incorpora la religión firmemente en el plan de estudios, asegurando que las generaciones más jóvenes sean elevadas con fuertes valores islámicos."
 ALG_grand_mufti_appointed: "Gran Mufti de Argelia"
 ALG_grand_mufti_appointed_desc: "A Grand Mufti ha sido nombrado para interpretar la Ley Islámica en Argelia, reforzando la legitimidad religiosa del Estado."
 ALG_islam_above_the_nation: "Islam Sobre la Nación"
 ALG_islam_above_the_nation_desc: "Durante el pasado turbulento de Argelia, tanto el nacionalismo como el islam compitieron por la dominación en la configuración del estado. Para nuestro futuro, el Islam debe servir como principio rector de la gobernanza, sobre todo."
 ALG_family_is_a_central_unit: "Familia por encima de Else"
 ALG_family_is_a_central_unit_desc: "El núcleo de la sociedad es la familia. Un hombre, una mujer y sus hijos forman el fundamento de la nación. Las familias fuertes asegurarán la prosperidad y el éxito de Argelia durante años."
 ALG_follow_religious_law: "Seguir la ley religiosa"
 ALG_follow_religious_law_desc: "El derecho islámico es la mejor base para gobernar un país. Adoptándolo como nuestra fundación garantizará la justicia y la equidad para todos los argelinos."
 ALG_traditional_role_for_women: "Papel tradicional de la mujer"
 ALG_traditional_role_for_women_desc: "Las mujeres tienen el mayor honor de criar niños y cuidar a sus familias. Mientras los hombres trabajan fuera, las mujeres deben salvaguardar las tradiciones de la nación en casa."
 ALG_religious_education: "Educación religiosa"
 ALG_religious_education_desc: "Nuestras escuelas deben incorporar estudios religiosos de cerca en su plan de estudios. Desde la infancia, los argelinos deben aprender el Corán y las prácticas islámicas."
 ALG_appoint_grand_mufti: "Nombra un Gran Mufti"
 ALG_appoint_grand_mufti_desc: "Argelia exige que un Gran Mufti interprete la ley islámica. Debemos designar a un respetado erudito para que brinde orientación religiosa al Estado."
 ALG_abrogate_secular_constitution: "Abrogar la Constitución secular"
 ALG_abrogate_secular_constitution_desc: "La Constitución actual mantiene un marco secular heredado de la independencia. La única ley que debemos seguir es el Corán, no los textos hechos por el hombre."
 ALG_enahda_media_network: "Red de medios Ennahda"
 ALG_enahda_media_network_desc: "Debemos establecer una red nacional de televisión para difundir el mensaje del Gran Mufti y promover los valores islámicos en toda Argelia."
 ALG_supreme_islamic_council: "Consejo Islámico Supremo"
 ALG_supreme_islamic_council_desc: "Para salvaguardar el nuevo estado, debemos crear un Consejo Islámico Supremo, un órgano consultivo para apoyar al Gran Mufti y asegurar que Argelia siga firmemente en la senda de la fe."
 ALG_edu_and_social_policy: "Educación & Política social"
 ALG_edu_and_social_policy_desc: "La prosperidad a largo plazo de Argelia depende de más que los recursos naturales, se basa en las bases de la educación, la atención sanitaria y las protecciones sociales. Al reformar estos sectores, podemos forjar un nuevo contrato social para el siglo XXI."
 ALG_expand_primary_education: "Ampliación de la educación primaria"
 ALG_expand_primary_education_desc: "La ampliación del acceso a las escuelas primarias de todas las zonas rurales y urbanas reducirá el analfabetismo y creará una base para el desarrollo nacional."
 ALG_reform_secondary_curriculum: "Curriculum secundario de reforma"
 ALG_reform_secondary_curriculum_desc: "Nuestras escuelas secundarias deben reformarse para satisfacer las exigencias de una economía moderna, preservando al mismo tiempo la identidad argelina."
 ALG_western_curriculum: "Adoptar el plan de estudios occidental"
 ALG_western_curriculum_desc: "Al integrar los planes de estudio orientados hacia el oeste, podemos exponer a nuestros jóvenes a las ciencias modernas y los estándares globales, mejorando la competitividad de Argelia."
 ALG_national_curriculum: "Fortalecimiento del programa nacional"
 ALG_national_curriculum_desc: "En lugar de copiar modelos extranjeros, debemos centrarnos en la árabeización y los valores culturales argelinos en nuestras escuelas para preservar la soberanía en la educación."
 ALG_university_reform: "Reforma de la Universidad"
 ALG_university_reform_desc: "Nuestras universidades deben ampliarse y modernizarse para capacitar a profesionales, investigadores e innovadores que puedan liderar el futuro de Argelia."
 ALG_basic_healthcare_access: "Acceso básico a la atención de salud"
 ALG_basic_healthcare_access_desc: "Todo argelino merece acceso a servicios básicos de salud. Ampliar la cobertura es un primer paso hacia una nación más sana."
 ALG_state_hospitals: "Ampliar los hospitales estatales"
 ALG_state_hospitals_desc: "Al invertir en un sistema hospitalario dirigido por el Estado, podemos garantizar la atención médica gratuita y accesible para todos los argelinos, aunque a un costo significativo para el tesoro."
 ALG_modernize_state_hospitals: "Modernizar los hospitales estatales"
 ALG_modernize_state_hospitals_desc: "Mejorar el equipo, capacitar a médicos y mejorar la infraestructura fortalecerá la red sanitaria del estado."
 ALG_universal_healthcare: "Atención universal de salud"
 ALG_universal_healthcare_desc: "La atención sanitaria es un derecho, no un privilegio. Argelia se compromete a construir un sistema de salud totalmente universal."
 ALG_private_healthcare: "Alentar el cuidado de la salud privada"
 ALG_private_healthcare_desc: "Al promover hospitales y clínicas privados, podemos reducir la carga del estado e introducir competencia de mercado en salud."
 ALG_expand_private_clinics: "Ampliar clínicas privadas"
 ALG_expand_private_clinics_desc: "Las clínicas privadas pueden complementar el sistema público ofreciendo más servicios especializados, especialmente en las zonas urbanas."
 ALG_national_insurance: "Sistema Nacional de Seguros"
 ALG_national_insurance_desc: "Un plan nacional de seguro médico unificará la atención pública y privada en una única red de seguridad para los ciudadanos argelinos."
 ALG_minimum_income_guarantee: "Garantía mínima de ingresos"
 ALG_minimum_income_guarantee_desc: "El Estado garantizará un nivel mínimo de ingresos para los más vulnerables, protegiendo a los argelinos de la pobreza absoluta."
 ALG_housing_support: "Apoyo a la vivienda"
 ALG_housing_support_desc: "Los programas de vivienda subvencionados proporcionarán viviendas asequibles para familias trabajadoras y reducirán el hacinamiento urbano."
 ALG_childcare_support: "Apoyo al cuidado de los niños"
 ALG_childcare_support_desc: "El apoyo a los centros de atención infantil y las prestaciones familiares ayudará a las familias jóvenes a criar niños sin dificultades financieras."
 ALG_fuel_subsidies: "Subvenciones de combustible"
 ALG_fuel_subsidies_desc: "Al subvencionar los precios del combustible, podemos hacer que el transporte y la calefacción sean asequibles para los argelinos comunes, incluso si agota el tesoro."
 ALG_food_subsidies: "Subvenciones alimentarias"
 ALG_food_subsidies_desc: "Proteger el precio del pan y los alimentos esenciales garantizará que ninguna familia argelina tenga hambre."
 ALG_welfare_consolidation: "Estado de Bienestar Consolidado"
 ALG_welfare_consolidation_desc: "Al fusionar nuestros programas sociales en un sistema integral de bienestar, Argelia establecerá una red moderna de seguridad social."
 ALG_civil_rights_protections: "Protección de los derechos civiles"
 ALG_civil_rights_protections_desc: "Garantizar los derechos y libertades fundamentales fortalecerá la estabilidad nacional y reducirá las quejas."
 ALG_gender_equality: "Promoción de la igualdad entre los géneros"
 ALG_gender_equality_desc: "Empoderar a las mujeres argelinas mediante la igualdad de derechos y oportunidades es fundamental para construir una sociedad justa y próspera."
 ALG_freedom_of_press: "Garantía Libertad de prensa"
 ALG_freedom_of_press_desc: "Una prensa libre es esencial para la democracia y la rendición de cuentas. Apoyar a los medios independientes dará una voz más fuerte a los argelinos."
 ALG_judicial_reform: "Reforma judicial"
 ALG_judicial_reform_desc: "Un poder judicial moderno e independiente garantizará juicios justos, reducirá la corrupción y fortalecerá el estado de derecho."
 ALG_civil_society_empowerment: "Empoderamiento de la sociedad civil"
 ALG_civil_society_empowerment_desc: "Apoyar a las ONG, los sindicatos y las organizaciones de base creará una sociedad más participativa y resiliente."
 ALG_digital_government: "Gobierno digital"
 ALG_digital_government_desc: "La digitalización reducirá la burocracia, mejorará la transparencia y acercará los servicios gubernamentales al pueblo."
 ALG_public_service_efficiency: "Eficiencia de la función pública"
 ALG_public_service_efficiency_desc: "Mediante la modernización del sector público, podemos eliminar las ineficiencias y mejorar la prestación de servicios."
 ALG_anti_corruption_campaign: "Campaña contra la corrupción"
 ALG_anti_corruption_campaign_desc: "La corrupción socava el estado. Una campaña integral contra ella restaurará la confianza en las instituciones de Argelia."
 ALG_e_governance_portal: "E-Governance Portal"
 ALG_e_governance_portal_desc: "La creación de una plataforma integrada de gobernanza electrónica proporcionará a los ciudadanos servicios públicos transparentes, rápidos y accesibles."
 ALG_streamlined_bureaucracy: "Simplificación de la burocracia"
 ALG_streamlined_bureaucracy_desc: "Al cortar la cinta roja y modernizar las estructuras administrativas, Argelia será más eficiente y competitiva."
 ALG_social_contract_21st_century: "Un contrato social para el siglo XXI"
 ALG_social_contract_21st_century_desc: "A través de reformas educativas, sanitarias, sociales, civiles y administrativas, Argelia forjará un nuevo contrato social que asegure la estabilidad, justicia y prosperidad para las generaciones venideras."
 ALG_corrupt_mil_idea: "Corruptos militares"
 ALG_corrupt_mil_idea_desc: "Los militares argelinos, aunque poderosos y profundamente arraigados en la política, sufren de corrupción generalizada. Los recursos destinados a la modernización y la eficiencia son eliminados por los generales y las redes de patronaje. Esto socava la capacidad operacional y erosiona la confianza pública, dificultando las reformas al tiempo que afianza el papel del ejército como guardián y obstáculo para el progreso."
 ALG_military_oversight: "Supervisión militar"
 ALG_military_oversight_desc: "El ejército ha establecido una estrecha supervisión de la política y las instituciones civiles. Si bien esto asegura la estabilidad y evita el caos, también reduce la transparencia, restringe las reformas y refuerza el dominio del ejército en la vida pública."
 ALG_gas_pipeline_leverage: "Apalancamiento del gasoducto"
 ALG_gas_pipeline_leverage_desc: "La extensa red de gasoductos de Argelia en Europa proporciona una poderosa herramienta de negociación en política exterior. La dependencia energética hace que los asociados sean cautelosos, pero también crea una dependencia excesiva de las exportaciones de hidrocarburos para mantener el apalancamiento político."
 ALG_resource_curse: "Recurso Curse"
 ALG_resource_curse_desc: "A pesar de las inmensas reservas de petróleo y gas, Argelia lucha con la «maldición de recursos». La dependencia de los hidrocarburos alimenta la corrupción, desalienta la diversificación y expone la economía a la volatilidad de los mercados energéticos mundiales."
 ALG_PM_Elections: "Nombrar un Primer Ministro"
 ALG_PM_Elections_desc: "\n£MAIN_desctext_elections\n\n\n\nEl Presidente debe decidir sobre el nombramiento de un Primer Ministro para dirigir el gobierno. Esta elección no es meramente administrativa, diferentes candidatos representan visiones competitivas para el futuro de Argelia, desde tecnócratas leales a reformistas opositores."
 ALG_authority_more_70: "§YReformistas§! mantienen al menos §Y70%§! £generic_anarchist_communism Influencia dentro del [ROOT.GetFlag] Gobierno de Argelia"
 ALG_PNA_victory_tt: "§Le Pouvoir§! sostiene más de §Y45%§! de la influencia dentro del equilibrio del poder."
 ALG_prime_minister_name_loc: "Primer Ministro"
 ALG_minister_bio_loc: "Titular de la autoridad ejecutiva bajo el Presidente."
 algeria_morocco.1.t: "La cuestión de Marruecos"
 algeria_morocco.1.d: "Las relaciones de Argelia con Marruecos se han visto rebasadas desde hace mucho tiempo por el amargo legado de la Guerra de las Arenas, el conflicto del Sáhara Occidental y décadas de fronteras cerradas. Con las tensiones aún sumergidas, la cuestión de cómo acercarse a Marruecos se ve en gran medida. ¿Debería Argelia duplicarse con su rivalidad histórica, o intentar trazar un nuevo curso de diálogo y cooperación?"
 algeria_morocco.1.a: "El futuro del Magreb está en juego."
 ALG_morocco_question: "La cuestión marroquí"
 ALG_morocco_question_desc: "Nuestra rivalidad con Marruecos sobre el Sáhara Occidental, la Guerra de las Arenas y el cierre fronterizo de décadas han dejado debilitado a Argelia. Debemos decidir: ¿nos enfrentaremos a Marruecos, o seguiremos la reconciliación?\n\n§YEste enfoque comienza la rama de preguntas marroquíes.§!"
 ALG_sand_war_legacy: "Legado de la Guerra Sandinista"
 ALG_sand_war_legacy_desc: "Las heridas de la Guerra de las Arenas de 1963 siguen en pie. Los argelinos recuerdan las ambiciones marroquíes en nuestro territorio, y muchos piden una renovada vigilancia."
 ALG_close_the_border: "Cierra la frontera"
 ALG_close_the_border_desc: "La frontera con Marruecos sigue siendo una fuente de contrabando, disturbios y espionaje. Cerrarla enviará un fuerte mensaje de desafío."
 ALG_border_security_investments: "Inversiones en materia de seguridad fronteriza"
 ALG_border_security_investments_desc: "Debemos reforzar la frontera occidental con puestos militares permanentes, vigilancia moderna y unidades de gendarmería para mantener a raya la influencia marroquí."
 ALG_counter_moroccan_influence: "Contra la influencia marroquí"
 ALG_counter_moroccan_influence_desc: "Marruecos busca activamente aliados en el extranjero. Argelia debe contrarrestar esta ofensiva diplomática, cortando su influencia en África y más allá."
 ALG_support_polisario_struggle: "Apoyar la Lucha Polisario"
 ALG_support_polisario_struggle_desc: "El pueblo saharaui merece independencia. Al apoyar al Frente Polisario, Argelia fortalece su papel de campeón de la lucha anticolonial en el Magreb."
 ALG_internationalize_conflict: "Internacionalizar el conflicto"
 ALG_internationalize_conflict_desc: "La cuestión del Sáhara Occidental debe ser elevada a las Naciones Unidas, la Unión Africana y todos los foros posibles para presionar diplomáticamente a Marruecos."
 ALG_african_union_pressure: "Movilizar la Unión Africana"
 ALG_african_union_pressure_desc: "A través de la Unión Africana, Argelia construirá una coalición de estados que presionan a Marruecos para aceptar la libre determinación saharaui."
 ALG_seek_dialogue_morocco: "Buscar diálogo con Marruecos"
 ALG_seek_dialogue_morocco_desc: "Argelia debe explorar canales diplomáticos con Marruecos. Mientras las guerras y rivalidades pasadas nos dividen, el diálogo puede conducir a la estabilidad regional."
 ALG_confidence_building: "Medidas de fomento de la confianza"
 ALG_confidence_building_desc: "Las pequeñas medidas, como los comités conjuntos y la reducción de las restricciones de visado, pueden constituir la base para una confianza duradera con Marruecos."
 ALG_reopen_borders: "Reabrir las fronteras"
 ALG_reopen_borders_desc: "Después de años de cierre, la reapertura de la frontera al libre movimiento de personas y bienes sería un punto de inflexión histórico en nuestras relaciones."
 ALG_economic_cooperation: "Cooperación económica"
 ALG_economic_cooperation_desc: "La interdependencia económica con Marruecos traerá prosperidad, reducirá las tensiones y fortalecerá el papel regional de Argelia."
 ALG_security_cooperation: "Cooperación para la seguridad"
 ALG_security_cooperation_desc: "Las amenazas compartidas como el terrorismo y el contrabando requieren patrullas conjuntas e intercambio de información. La cooperación es más eficiente que la rivalidad."
 ALG_towards_maghreb_union: "Hacia una Unión del Magreb"
 ALG_towards_maghreb_union_desc: "Con Marruecos, Argelia puede sentar las bases para una fuerte Unión del Magreb, haciendo eco de los sueños de nuestros antepasados por la unidad norteafricana."
 ALG_morocco.1.t: "UN Debate on Western Sahara"
 ALG_morocco.1.d: "Argelia ha planteado la cuestión del Sáhara Occidental ante las Naciones Unidas, condenando el control de Marruecos sobre el territorio. Los delegados debaten si Marruecos debe retirarse o si Argelia está superando."
 ALG_morocco.1.a: "Condemn Morocco Harshly"
 ALG_morocco.1.b: "Empujar sanciones y resoluciones moderadas"
 ALG_moroccan_rivalry_start: "Tensiones Fronterizas con Marruecos"
 ALG_moroccan_rivalry_start_desc: "Décadas de hostilidad con Marruecos, alimentadas por la Guerra de las Arenas, el Sáhara Occidental y el cierre fronterizo de 1994, pesan mucho sobre Argelia. Las tensiones perjudican nuestra economía, estabilidad y disposición militar.\n§REste espíritu nacional no se puede eliminar normalmente.§!\nSólo se reducirá, sustituirá o eliminará progresando a través de la §YCuestión de Marruecos§! Árbol de foco."
 ALG_moroccan_rivalry_A1: "Lucha contra la influencia marroquí"
 ALG_moroccan_rivalry_A1_desc: "Argelia ha adoptado medidas para reprimir la influencia marroquí en la región. La rivalidad persiste, pero los efectos se están administrando más eficazmente."
 ALG_moroccan_rivalry_A2: "Escalada de caballería"
 ALG_moroccan_rivalry_A2_desc: "Las tensiones con Marruecos siguen siendo un desagüe en el estado, pero nuestra determinación y reformas han limitado su impacto."
 ALG_moroccan_rivalry_A_final: "Preparativos Militares contra Marruecos"
 ALG_moroccan_rivalry_A_final_desc: "A través de años de confrontación, Argelia ha construido un ejército endurecido y capaz, listo para el conflicto. La rivalidad ha forjado fuerza de la adversidad."
 ALG_moroccan_reconciliation_B1: "Aspectos diplomáticos"
 ALG_moroccan_reconciliation_B1_desc: "Argelia ha adoptado medidas provisionales para entablar un diálogo con Marruecos, creando oportunidades de cooperación limitada y fomento de la confianza."
 ALG_moroccan_reconciliation_B2: "Fronteras de apertura"
 ALG_moroccan_reconciliation_B2_desc: "Con la profundización de los vínculos diplomáticos, Argelia ha reabierto sus fronteras con Marruecos, reduciendo las tensiones económicas y fomentando el comercio regional."
 ALG_moroccan_reconciliation_B_final: "Cooperación del Magreb"
 ALG_moroccan_reconciliation_B_final_desc: "Argelia y Marruecos han adoptado la cooperación, lo que ha permitido el comercio, el desarrollo y el liderazgo regional. La rivalidad finalmente está detrás de nosotros."
 ALG_morocco_question_tt: "§YEste enfoque comienza el camino de la Pregunta marroquí.§!\n\n- §RPath A:§! Pursue confront with Morocco - Gradually weaken the debuff idea, terminando con un §GStronger Army§!.\n- §GPath B:§! Buscar la reconciliación con Marruecos - Traer la idea de la deuda para mejorar §GPositive Buffs§!, terminando con más fuerza §YEconomía y Diplomacia§!."
 alg_general.1.t: "El regreso de Khaled Nezzar"
 alg_general.1.d: "Con la decisión de revivir los métodos del Decenio Negro, el controvertido ex Ministro de Defensa, Khaled Nezzar, es una vez más llamado. Su enfoque de hierro puede estabilizar al ejército, pero corre el riesgo de alienar a la población y sacar críticas internacionales."
 alg_general.1.a: "El pasado vuelve a guiar el presente."
