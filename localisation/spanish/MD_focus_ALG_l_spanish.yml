l_spanish:
 algeria_focus: "Árbol argelino Enfoque"
 ALG_political_tree_shortcut: "Árbol político"
 ALG_foreign_policy_shortcut: "Política exterior"
 ALG_industry_shortcut: "Recuperación económica"
 ALG_military_shortcut: "Fuerzas Armadas de Argelia"
 ALG_the_nation_stands_at_a_crossroads: "La Nación se encuentra en una encrucijada"
 ALG_restore_the_presidency_desc: "A raíz de la agitación política, se ha debilitado la presidencia. Es hora de restaurar la autoridad de nuestro líder electo y restablecer las normas democráticas que han sido erosionadas. Al restablecer la presidencia, podemos traer estabilidad y confianza a nuestro gobierno."
 ALG_emergency_rule_continues: "§RLa Regla de Emergencia continúa§!"
 ALG_emergency_rule_continues_desc: "Con la nación todavía en agitación, el gobierno ha decidido extender la regla de emergencia. Si bien esta medida es necesaria para mantener el orden, supone un costo para las libertades civiles y los procesos democráticos. Debemos caminar con cuidado mientras navegamos estas aguas turbulentas."
 ALG_national_reconciliation: "Reconciliación Nacional"
 ALG_national_reconciliation_desc: "Para sanar las heridas de división y conflicto, debemos seguir un camino de reconciliación nacional. Al fomentar el diálogo entre todas las facciones y abordar los agravios, podemos construir una sociedad más unificada y sentar las bases para una paz duradera."
 ALG_moderate_islamist_talks: "Conversaciones islamistas moderadas"
 ALG_moderate_islamist_talks_desc: "En un esfuerzo por salvar las divisiones y promover la estabilidad, estamos iniciando conversaciones con facciones islamistas moderadas. Al entablar un diálogo constructivo, buscamos encontrar un terreno común y crear un entorno político donde las diversas voces puedan coexistir pacíficamente."
 ALG_charter_for_civil_peace: "Carta por la Paz Civil"
 ALG_charter_for_civil_peace_desc: "Para garantizar la estabilidad duradera y la armonía social, proponemos una Carta por la Paz Civil. En este documento se esbozarán los derechos y responsabilidades de todos los ciudadanos, promoviendo la tolerancia, el entendimiento y la cooperación entre diferentes grupos dentro de nuestra sociedad."
 ALG_open_democratic_path: "Abra el camino democrático"
 ALG_open_democratic_path_desc: "Es hora de abrazar plenamente la democracia y abrir el camino hacia un futuro más brillante. Mediante la implementación de reformas que empoderen a nuestros ciudadanos y promuevan la participación política, podemos crear una sociedad democrática vibrante que refleje la voluntad del pueblo."
 ALG_clamp_down_on_extremism: "Abraza el extremismo"
 ALG_clamp_down_on_extremism_desc: "Usando tribunales militares y fuerzas de inteligencia, el gobierno eliminará todas las amenazas radicales islamistas y políticas restantes."
 ALG_counterterrorism_program: "Programa de lucha contra el terrorismo"
 ALG_counterterrorism_program_desc: "Se debe formar un moderno aparato de seguridad para rastrear, infiltrar y eliminar las amenazas antes de desestabilizar a Argelia."
 ALG_authoritarian_restoration: "Restauración autoritaria"
 ALG_authoritarian_restoration_desc: "Estabilidad sólo puede garantizarse a través de una regla firme y centralizada. Los militares se encargarán plenamente del futuro de la nación."
 ALG_counterterrorism_agency: "Organismo de Lucha contra el Terrorismo"
 ALG_extremism_crackdown_modifier: "Extremismo Crackdown"
 ALG_extremism_crackdown_modifier_desc: "En respuesta a las crecientes amenazas de grupos extremistas que buscan desestabilizar nuestra nación, estamos implementando una amplia represión contra el radicalismo. Esta iniciativa tiene por objeto desmantelar las redes extremistas, mejorar la vigilancia y fortalecer las capacidades de aplicación de la ley. Al promover una cultura de tolerancia y comprensión, esperamos abordar las causas fundamentales del extremismo garantizando al mismo tiempo la seguridad de nuestros ciudadanos. Mediante estas medidas, fomentaremos una sociedad más cohesiva y protegeremos nuestros valores democráticos."
 ALG_military_regime_restored: "Restablecimiento del régimen militar"
 ALG_military_regime_restored_desc: "Después de años de inestabilidad política, los militares han recuperado el control y el orden restablecido. El régimen se centra en la disciplina, la seguridad nacional y la estricta gobernanza para reconstruir la fuerza y unidad de la nación."
 ALG_reconciliation_path_category: "Reconciliación Nacional"
 ALG_reconciliation_path_category_desc: "\n£AFG_menu1\n\n\n\nPara sanar las heridas de división y conflicto, debemos seguir un camino de reconciliación nacional. Al fomentar el diálogo entre todas las facciones y abordar los agravios, podemos construir una sociedad más unificada y sentar las bases para una paz duradera."
 ALG_pardon_moderate_islamist: "Pardon islamistas moderados"
 ALG_pardon_moderate_islamist_desc: "A los antiguos islamistas no violentos se les puede ofrecer una amnistía condicional a cambio del desarme y la renuncia a la violencia política."
 ALG_initiate_national_dialogues: "Iniciar el Diálogo Nacional"
 ALG_initiate_national_dialogues_desc: "Se lanzará un foro nacional para incluir a antiguos rebeldes, partidos políticos y la sociedad civil en la construcción de una nueva Argelia."
 ALG_reintegrate_former_fighter: "Reintegrar a los ex combatientes"
 ALG_reintegrate_former_fighter_desc: "Un programa para reintegrar a rebeldes rendidos en la vida civil mediante trabajo, vivienda o servicio nacional."
 ALG_crackdown_category: "Crackdown autoritario"
 ALG_crackdown_category_desc: "\n£TAJ_desctext_pamir\n\n\n\nPara garantizar la estabilidad del Estado, debemos suprimir elementos subversivos y fortalecer nuestras fuerzas de seguridad internas."
 ALG_arrest_political_opponents: "Detenciones a los oponentes políticos"
 ALG_arrest_political_opponents_desc: "neutralizaremos las amenazas internas eliminando a los actores políticos radicales del espacio público."
 ALG_expand_surveillance_services: "Ampliar los servicios de vigilancia"
 ALG_expand_surveillance_services_desc: "Una sólida red de inteligencia vigilará a la población y evitará el malestar antes de que se extienda."
 ALG_ban_opposition_parties: "Prohibir partidos de oposición"
 ALG_ban_opposition_parties_desc: "Se prohibirá la participación en la política de todos los partidos no alineados con la unidad nacional."
 ALG_economic_recovery_category: "Programa de recuperación económica"
 ALG_economic_recovery_category_desc: "\n£MAIN_desctext_dept\n\n\n\nEl FMI ofrece apoyo condicional y Argelia puede comenzar ahora reformas más amplias, préstamos y privatización."
 ALG_accept_imf_loan: "Aceptar préstamos del FMI"
 ALG_accept_imf_loan_desc: "Podemos aceptar la asistencia financiera del FMI para estabilizar nuestra moneda y comenzar la reforma. Esto se debe al costo de la deuda y las condiciones a largo plazo."
 ALG_start_oil_licensing: "Abrir las licencias petroleras a empresas extranjeras"
 ALG_start_oil_licensing_desc: "Permitir a las corporaciones multinacionales el acceso a las reservas de petróleo podría acelerar el crecimiento pero aumentaría la influencia extranjera."
 ALG_repay_imf_loan: "Reembolsar el préstamo del FMI"
 ALG_repay_imf_loan_desc: "Con nuestra estabilización de las finanzas, podemos pagar nuestro préstamo para reducir la dependencia internacional."
 ALG_improve_public_services: "Mejorar los servicios públicos"
 ALG_improve_public_services_desc: "Ampliaremos la atención médica, la educación y el apoyo a las víctimas de guerra."
 ALG_international_aid_effort: "Actividades de ayuda internacional"
 ALG_international_aid_effort_desc: "La colaboración con la ONU y los donantes puede poner en marcha servicios básicos y reconstrucción."
 ALG_building_civil_society: "La construcción de la sociedad civil"
 ALG_building_civil_society_desc: "Empoderar a las comunidades y los programas sociales puede ayudar a prevenir un conflicto renovado."
 ALG_economic_recovery_program: "Programa de recuperación económica"
 ALG_economic_recovery_program_desc: "Ponemos en marcha un plan nacional de crecimiento, apoyado por la asistencia exterior y la reforma estatal."
 ALG_remove_international_monitors: "Eliminar los Monitores Internacionales"
 ALG_remove_international_monitors_desc: "Argelia ha recuperado lo suficiente para recuperar la plena soberanía sobre su camino económico."
 ALG_postwar_recovery_program: "Programa de recuperación de posguerra"
 ALG_postwar_recovery_program_desc: "La guerra ha terminado. Empezamos a reconstruir el estado, la economía y la sociedad."
 ALG_un_aid_mission: "UN Aid Misión"
 ALG_un_aid_mission_desc: "La ayuda de las Naciones Unidas y las organizaciones no gubernamentales ayudarán a nuestros servicios públicos básicos."
 ALG_social_healing_programs: "Programas de curación social"
 ALG_social_healing_programs_desc: "El trauma y la desconfianza de la posguerra deben abordarse con programas sociales y reconciliación."
 ALG_public_services_funding: "Fondo de Servicios Públicos"
 ALG_public_services_funding_desc: "Restituiremos el acceso a programas de salud, vivienda y empleo."
 ALG_finalize_recovery_phase: "Finalizar la fase de recuperación"
 ALG_finalize_recovery_phase_desc: "Con la estabilidad restablecida, podemos reducir la supervisión extranjera y recuperar la autonomía económica."
 ALG_change_the_economy: "Cambiar el modelo económico"
 ALG_change_the_economy_desc: "Es hora de elegir: ¿deberíamos preservar el control estatal o liberalizar?"
 ALG_preserve_state_controlled_oil: "Control del Estado de Preserve sobre aceite"
 ALG_preserve_state_controlled_oil_desc: "Sonatrach debe seguir siendo la columna vertebral de nuestra soberanía y economía."
 ALG_industrial_expansion_plan: "Plan de Ampliación Industrial"
 ALG_industrial_expansion_plan_desc: "Aumentaremos la producción nacional a través de infraestructuras y fábricas."
 ALG_open_market_reforms: "Reformas de Mercado Abierto"
 ALG_open_market_reforms_desc: "Argelia puede atraer inversiones e impulsar el crecimiento desregulando sectores clave."
 ALG_oil_licensing_program: "Programa de concesión de licencias de petróleo"
 ALG_oil_licensing_program_desc: "Las empresas extranjeras pueden solicitar la explotación de campos petroleros en virtud de contratos de concesión de licencias."
 ALG_urban_or_rural_development: "¿Tribas o Ciudades?"
 ALG_urban_or_rural_development_desc: "¿Deberíamos centrar nuestra atención en las regiones tribales o las principales ciudades?"
 ALG_empower_rural_provinces: "Empoderamiento de las provincias rurales"
 ALG_empower_rural_provinces_desc: "Nuestras tierras rurales sur y Kabyle recibirán inversión directa."
 ALG_tribal_consultative_council: "Consejo Consultivo Tribal"
 ALG_tribal_consultative_council_desc: "Los ancianos locales y los líderes regionales ayudarán a regir las prioridades de desarrollo."
 ALG_urbanization_initiative: "Iniciativa de Urbanización Inicial"
 ALG_urbanization_initiative_desc: "Los centros urbanos como Algiers y Oran son claves para nuestra modernización."
 ALG_expand_the_capital: "Ampliar el capital"
 ALG_expand_the_capital_desc: "Ampliaremos infraestructura y oficinas en Argel para convertirla en un verdadero centro moderno."
 ALG_foreign_policy_review: "Revisión Política Exterior Doctrina"
 ALG_foreign_policy_review_desc: "Con el regreso de la estabilidad interna, Argelia debe redefinir su papel en la etapa mundial."
 MSP_foreign_policy_review: "Revisión Política Exterior Doctrina"
 MSP_foreign_policy_review_desc: "Con el regreso de la estabilidad interna, Argelia debe redefinir su papel en la etapa mundial."
 ALG_africa_and_arab_nations: "África y las Naciones árabes"
 ALG_africa_and_arab_nations_desc: "Nos centraremos en dirigir la diplomacia y el desarrollo tanto en África como en el mundo árabe."
 ALG_western_sahara_position: "Apoyo al Sáhara Occidental"
 ALG_western_sahara_position_desc: "Reafirmamos nuestro apoyo a la independencia de Sahrawi contra las reivindicaciones marroquíes."
 ALG_african_union_engagement: "Únase a la Unión Africana"
 ALG_african_union_engagement_desc: "Argelia debe reunirse y asumir un papel de liderazgo en la diplomacia continental."
 ALG_sahel_initiatives: "Ampliación en el Sahel"
 ALG_sahel_initiatives_desc: "Lucharemos contra la inestabilidad y el terrorismo en el Sahel a través del poder blando y la defensa."
 ALG_choose_global_partner: "Elija un socio global"
 ALG_choose_global_partner_desc: "Debemos alinearnos económica y militarmente con una de las superpotencias del mundo."
 ALG_align_with_us: "Alineación con los Estados Unidos"
 ALG_align_with_us_desc: "Cooperar con Estados Unidos puede traer seguridad y apalancamiento económico."
 ALG_align_with_china: "Alinear con la República Popular China"
 ALG_align_with_china_desc: "China ofrece desarrollo económico no intervencionista y un profundo potencial de inversión."
 ALG_align_with_russia: "Alineación con la Federación de Rusia"
 ALG_align_with_russia_desc: "Rusia proporciona tecnología militar y comparte el escepticismo de Argelia sobre la dominación occidental."
 ALG_non_aligned_revival: "Política Exterior de los Países No Alineados"
 ALG_non_aligned_revival_desc: "Reviviremos el espíritu de neutralidad y solidaridad sur, al igual que en la década de 1960."
 ALG_global_south_solidarity: "Solidaridad del Sur Global"
 ALG_global_south_solidarity_desc: "Argelia fortalecerá los vínculos con las naciones postcoloniales mediante el comercio, la diplomacia y la ayuda."
 ALG_future_national_policy: "§G El futuro de Argelia§!"
 ALG_future_national_policy_desc: "Con la guerra civil detrás de nosotros, ahora debemos definir la nueva dirección política de Argelia.\n §RNOTE§!: §YPuljar esto Enfoque conducirá a centrarse al final que sobreescribirá el árbol de enfoque actual con personalizar uno para cada Parte así terminar otros aspectos importantes antes de terminar Esto§!"
 ALG_approach_nato: "§CAprobación de la OTAN§!"
 ALG_approach_nato_desc: "La alineación occidental podría traer el crecimiento económico y las garantías de seguridad."
 ALG_aspire_nato_support: "Aspire a la Alianza de la OTAN"
 ALG_aspire_nato_support_desc: "En condiciones de reunión, Argelia puede convertirse en un importante aliado no OTAN."
 ALG_invite_western_investors: "Invitar a los inversores occidentales"
 ALG_invite_western_investors_desc: "Atraer capital y comercio de las naciones democráticas."
 ALG_request_us_protection: "Solicito a EE.UU. Protección"
 ALG_request_us_protection_desc: "Argelia pedirá a los Estados Unidos protección o garantías militares."
 ALG_remain_neutral: "§gRemanente neutral§!"
 ALG_remain_neutral_desc: "La no alineación ofrece libertad de diplomacia y estabilidad interna."
 ALG_economy_first: "Poner la economía primero"
 ALG_economy_first_desc: "Reducir el gasto militar y aumentar la educación y el desarrollo a largo plazo."
 ALG_seek_un_protection: "La protección internacional"
 ALG_seek_un_protection_desc: "Si aumentan las amenazas, buscaremos protección al Consejo de Seguridad de la ONU."
 ALG_align_with_china1: "§tAlineado con China y Rusia§!"
 ALG_align_with_china1_desc: "Las potencias orientales ofrecen una alternativa a la alineación de la OTAN."
 ALG_join_sco: "Aplicar Unirse a SCO"
 ALG_join_sco_desc: "La Organización de Cooperación de Shanghai ofrece beneficios económicos y de seguridad."
 ALG_invite_eastern_investors: "Invitar a Eastern Investment"
 ALG_invite_eastern_investors_desc: "Asociado con empresas de infraestructura chinas y rusas."
 ALG_request_chinese_protection: "Solicitud de protección china"
 ALG_request_chinese_protection_desc: "Beijing puede estar de acuerdo en garantizar la independencia e inversiones argelinas."
 ALG_reform_the_military: "Reforma del Ejército"
 ALG_reform_the_military_desc: "El ejército argelino requiere una profunda reforma estructural para hacer frente a los desafíos del siglo XXI."
 ALG_military_academy_upgrade: "Actualización de la Academia Militar"
 ALG_military_academy_upgrade_desc: "Invertir en la educación es clave para construir funcionarios competentes y profesionales."
 ALG_internal_security_brigade: "Brigadas de Seguridad Interna"
 ALG_internal_security_brigade_desc: "Debemos asegurar el orden interno a través de unidades especializadas de seguridad interna."
 ALG_military_industry_support: "Apoyo a la industria militar"
 ALG_military_industry_support_desc: "La creación de nuestra base militar-industrial ayudará a asegurar la autosuficiencia."
 ALG_anti_air_force: "Establecer el comando Antiaéreo"
 ALG_anti_air_force_desc: "Las capacidades de defensa aérea son vitales para proteger nuestros cielos."
 ALG_mechanized_modernization: "Modernización de las fuerzas mecanizadas"
 ALG_mechanized_modernization_desc: "Las unidades mecanizadas modernas son el núcleo de una fuerza terrestre efectiva."
 ALG_uav_development: "Programa de desarrollo del drone"
 ALG_uav_development_desc: "Los sistemas aéreos no tripulados nos darán capacidad de vigilancia y huelga de precisión."
 ALG_national_guard_initiative: "Guardia Nacional Iniciativa"
 ALG_national_guard_initiative_desc: "Un cuerpo de defensa ciudadano puede ayudar a estabilizar las zonas rurales y fronterizas."
 ALG_air_force_reform: "Reforma de la Fuerza Aérea"
 ALG_air_force_reform_desc: "Revamping doctrinas y equipos es crítico para nuestra superioridad aérea."
 ALG_infantry_equipment_project: "Modernizar el equipo de infantería"
 ALG_infantry_equipment_project_desc: "Nuestra infantería merece lo último en armas y equipo de protección."
 ALG_ballistic_program: "Programa de misiles balísticos"
 ALG_ballistic_program_desc: "Ampliar nuestras capacidades de misiles mejorará la disuasión estratégica."
 ALG_simulation_center: "Centro de simulación militar"
 ALG_simulation_center_desc: "El establecimiento de centros modernos de entrenamiento mejorará drásticamente nuestra preparación para el combate."
 ALG_logistics_command: "Establecer el Comando Logístico"
 ALG_logistics_command_desc: "La racionalización de la logística garantiza que nuestras tropas sigan siendo eficaces en el combate."
 ALG_military_doctrine_finalization: "Finalizar la Doctrina Militar"
 ALG_military_doctrine_finalization_desc: "Debemos consolidar las reformas en una doctrina moderna."
 ALG_foreign_arms_contracts: "Contratos de armas extranjeras"
 ALG_foreign_arms_contracts_desc: "Las asociaciones estratégicas pueden ayudar a subsanar rápidamente las deficiencias de nuestro arsenal."
 ALG_local_armor_production: "Producción local Blindaje"
 ALG_local_armor_production_desc: "La iniciación de la producción local de APC y tanques garantiza autonomía y crecimiento."
 ALG_military_university_program: "Programa de universidad militar"
 ALG_military_university_program_desc: "Invertir en academias militares preparará nuestra próxima generación de líderes."
 ALG_heavy_artillery_project: "Iniciativa de artillería pesada"
 ALG_heavy_artillery_project_desc: "Priorizaremos la investigación y el desarrollo de artillería pesada doméstica."
 ALG_special_operations_command: "Comando de Operaciones Especiales"
 ALG_special_operations_command_desc: "Un mando centralizado para las unidades de élite mejora la coordinación y eficacia."
 ALG_joint_command_center: "Establecer el Centro Conjunto de Mando"
 ALG_joint_command_center_desc: "La combinación de sucursales en un centro de operaciones conjunto mejorará la integración estratégica."
 ALG_indigenous_rifle_program: "Programa de fusiles indígenas"
 ALG_indigenous_rifle_program_desc: "Desarrollar nuestras propias armas pequeñas avanzadas es una prioridad nacional."
 ALG_integrated_defense_network: "Red de defensa integrada"
 ALG_integrated_defense_network_desc: "Un sistema unificado de radar y comunicación fortalece la defensa nacional."
 ALG_advanced_command_structure: "Estructura de mando avanzada"
 ALG_advanced_command_structure_desc: "Implementaremos un moderno sistema de comandos C4ISR para el campo de batalla digital."
 ALG_military_modernization_complete: "Completa la modernización militar"
 ALG_military_modernization_complete_desc: "Nuestro largo camino hacia la reforma finalmente ha dado frutos. Argelia tiene ahora una fuerza moderna y cohesiva."
 ALG_idea_non_aligned_policy: "Política Exterior de los Países No Alineados"
 ALG_idea_non_aligned_policy_desc: "Nuestro camino independiente nos permite beneficiarnos de todos los bloques sin alinearnos con ninguno."
 ALG_presidential_succession_crisis: "Crisis de la sucesión presidencial"
 ALG_presidential_succession_crisis_desc: "Con la erosión de la estabilidad, la cuestión del liderazgo vuelve a surgir. ¿Continuamos bajo el viejo régimen o forjamos un nuevo camino?"
 ALG_stay_with_bouteflika: "Mantener el liderazgo de Bouteflika"
 ALG_stay_with_bouteflika_desc: "Bouteflika representa la continuidad y la corrupción. Podemos ganar estabilidad financiera, pero a costa de legitimidad."
 ALG_choose_tebboune: "Appoint Tebboune"
 ALG_choose_tebboune_desc: "Un tecnócrata moderado con reformas orientadas a la estabilidad, pero uno que costará el tesoro caro."
 ALG_choose_msp: "Design MSP Leader"
 ALG_choose_msp_desc: "Una alternativa islamista alineada con la Hermandad Musulmana. Trae popularidad entre ciertos círculos, pero corre el riesgo de conflicto civil con la élite militar arraigada."
 ALG_random_president: "Elija un presidente aleatorio"
 ALG_random_president_desc: "Una carta salvaje. Este nuevo presidente podría salvar o condenar a Argelia."
 ALG_resolve_presidency_crisis: "Crisis de la Presidencia"
 ALG_resolve_presidency_crisis_desc: "La cuestión del liderazgo ha sido contestada. Ahora es el momento de avanzar."
 ALG_idea_bouteflika_legacy: "Legacy de Bouteflika"
 ALG_idea_bouteflika_legacy_desc: "A pesar de la profunda corrupción y desconfianza, la era de Bouteflika sigue sinónimo del pasado gobierno de Argelia. Su red sigue influyente."
 ALG_idea_tebboune_moderate: "Presidencia Moderada de Tebboune"
 ALG_idea_tebboune_moderate_desc: "Con una imagen de estabilidad y reforma incremental, Tebboune busca mantener el orden mientras limpia la gobernanza."
 ALG_idea_msp_presidency: "MSP Presidencia"
 ALG_idea_msp_presidency_desc: "El Movimiento de la Sociedad por la Paz ha tomado el poder. Queda por ver si esto marca una transformación o descenso pacífico en conflicto."
 ALG_idea_random_good: "Nuevo Presidente eficaz"
 ALG_idea_random_good_desc: "A través de la suerte o estrategia, el nuevo presidente es competente e inspirado, trayendo reformas y dirección."
 ALG_idea_random_bad: "Inept nuevo presidente"
 ALG_idea_random_bad_desc: "Este líder no está preparado, abrumado y posiblemente corrupto. Una mala elección para un momento crítico."
 ALG_presidency.1.t: "Tensiones con los militares"
 ALG_presidency.1.d: "Tras el nombramiento del líder del MSP como Presidente, la élite militar es furia. Lo ven como una amenaza para su agarre de larga data sobre el poder. Los rumores giran sobre las movilizaciones secretas, y unidades armadas leales al viejo guardia comienzan a maniobrar. ¿Los militares aceptarán este cambio o se rebelarán?"
 ALG_presidency.1.a: "Los militares aceptan al nuevo gobierno"
 ALG_presidency.1.b: "¡Los rebeldes militares – comienza la guerra civil!"
 ALG_presidency_army_accepts_tt: "El Ejército acepta renuentemente al gobierno del MSP. Por ahora, la paz es firme."
 ALG_presidency_army_civilwar_tt: "¡Un golpe militar estalla en una guerra civil abierta!"
 ALG_economy_digital_initiative: "Iniciativa de economía digital"
 ALG_economy_digital_initiative_desc: "Argelia debe aceptar la era digital para modernizar su economía. La inversión en infraestructura tecnológica, servicios de gobierno electrónico y programas de alfabetización digital nos posicionarán para la economía del siglo XXI."
 ALG_digital_initiative_tt: "§GArgelia lanza un programa completo de transformación digital:§!\n- Modernizar los servicios gubernamentales\n- Ampliar la infraestructura de Internet\n- Promover startups tecnológicas\n- Capacitar a la fuerza de trabajo en habilidades digitales"
 ALG_digital_economy_initiative: "Iniciativa de economía digital"
 ALG_digital_economy_initiative_desc: "Nuestra inversión en infraestructura digital y educación tecnológica está pagando dividendos. Los servicios gubernamentales son más eficientes, las empresas están adoptando prácticas modernas y una nueva generación de trabajadores con tecnología está entrando en la fuerza laboral."
 ALG_arpt_regulatory_framework: "Establecer la Autoridad Reguladora ARPT"
 ALG_arpt_regulatory_framework_desc: "La Autorité de Régulation de la Poste et des Télécommunications (ARPT) garantizará un mercado competitivo de telecomunicaciones y protegerá los derechos del consumidor."
 ALG_algerie_telecom_expansion: "Modernización de Algerie Telecom"
 ALG_algerie_telecom_expansion_desc: "Modernizar y ampliar la infraestructura de Argelia Telecom para mejorar el acceso a banda ancha y las comunicaciones públicas."
 ALG_nedjma_and_mobilis: "Nedjma & Concurso Mobilis"
 ALG_nedjma_and_mobilis_desc: "Alentar una competencia saludable entre operadores de telecomunicaciones como Nedjma y Mobilis reducirá los precios y mejorará la calidad del servicio."
 ALG_fiber_optic_program: "Infraestructura óptica de fibra"
 ALG_fiber_optic_program_desc: "Invertir en el despliegue de fibra óptica a nivel nacional para aumentar la conectividad y la velocidad de red en todo el país."
 ALG_4g_rollout: "4G Servicios"
 ALG_4g_rollout_desc: "Lanzamiento de Internet móvil 4G transformará conectividad, permitiendo mejores servicios electrónicos y productividad digital."
 ALG_air_algerie_modernization: "Aire Algérie Modernization"
 ALG_air_algerie_modernization_desc: "Fortalecer la flota y las rutas de Air Algérie impulsarán el turismo y mejorarán la logística internacional."
 ALG_international_airports_upgrade: "Actualizar Aeropuertos Principales"
 ALG_international_airports_upgrade_desc: "Invierte en aeropuertos como Algiers, Oran y Constantine para convertirse en centros de tráfico aéreo regional y mundial."
 ALG_aadl_housing_projects: "Programas de vivienda AADL"
 ALG_aadl_housing_projects_desc: "El Organismo Nacional para el Mejoramiento y Desarrollo de los Proyectos de Vivienda proporcionará viviendas subvencionadas y desarrollo urbano para la creciente población urbana."
 ALG_urbanization_initiatives: "Iniciativas de Desarrollo Urbano"
 ALG_urbanization_initiatives_desc: "Ampliar caminos, utilidades y zonas de construcción apoyará nuestras ciudades en crecimiento y mejorará la calidad de vida."
 ALG_arpt_regulation: "Autoridad de regulación ARPT"
 ALG_arpt_regulation_desc: "El ARPT garantiza prácticas de mercado justas, competencia y protección del consumidor en el sector de las telecomunicaciones."
 ALG_algerie_telecom_program: "Programa Algerie Telecom"
 ALG_algerie_telecom_program_desc: "Un plan de modernización integral para el operador estatal de telecomunicaciones."
 ALG_mobile_operator_competition: "Reforma de la competencia de Telecom"
 ALG_mobile_operator_competition_desc: "La competitividad de mercado entre Nedjma y Mobilis ha alentado la innovación y los precios asequibles."
 ALG_4g_coverage: "4G National Coverage"
 ALG_4g_coverage_desc: "La banda ancha móvil avanzada mejora la comunicación y apoya una economía digital."
 ALG_national_innovation_push: "Empuje de la innovación nacional"
 ALG_national_innovation_push_desc: "Una iniciativa respaldada por el Gobierno para promover la innovación y el desarrollo tecnológico en todos los sectores."
 ALG_highway_project: "Proyecto de carretera Este-Oeste"
 ALG_highway_project_desc: "Un proyecto $13 mil millones que conecta Oriente y Occidente modernizará el transporte y reducirá el tiempo de viaje."
 ALG_air_algerie_investment: "Inversión Air Algérie"
 ALG_air_algerie_investment_desc: "Ampliar la aerolínea nacional de Argelia abre nuevas oportunidades comerciales y de viaje."
 ALG_air_hub_status: "Centro aéreo regional de Argel"
 ALG_air_hub_status_desc: "Los Argel tienen el potencial de convertirse en un centro central entre África, Europa y Oriente Medio."
 ALG_aadl_program: "Iniciativa de Vivienda AADL"
 ALG_aadl_program_desc: "El Organismo Nacional de Mejora y Desarrollo de la Vivienda tiene por objeto construir viviendas asequibles para miles de familias en todo Argelia."
 ALG_kabylia_unrest: "Kabylia descontento"
 ALG_kabylia_unrest_desc: "Desde la 'Berber Spring' de 1980, Kabylia ha estado marcada por protestas periódicas, demandas culturales y desconfianza hacia el gobierno central. Estas tensiones se sumergen bajo la superficie, socavando la estabilidad y amenazando con erupción en un malestar más amplio si no se aborda. Si no se resuelven, los acontecimientos podrían escalar dramáticamente en el futuro."
 ALG_black_spring.1.t: "Unrest en Kabylia"
 ALG_black_spring.1.d: "Tras el asesinato de Massinissa Guermah por fuerzas de la gendarmería, se han producido protestas masivas en Kabylia. El malestar está creciendo para el día."
 ALG_black_spring.1.a: "Esto debe abordarse."
 ALG_black_decade: "Decenio Negro"
 ALG_black_decade_desc: "La Guerra Civil argelina, conocida en Argelia como Decenio Negro, fue una guerra civil librada entre el gobierno argelino y varios grupos rebeldes islamistas del 11 de enero de 1992 (siguiendo un golpe negando una victoria electoral islamista) al 8 de febrero de 2002. La guerra comenzó lentamente, ya que inicialmente parecía que el gobierno había aplastado con éxito al movimiento islamista, pero grupos armados surgieron para declarar jihad y para 1994, la violencia había alcanzado tal nivel que parecía que el gobierno no podía soportarlo. Para 1996–97, se había hecho evidente que la resistencia islamista había perdido su apoyo popular, aunque los combates continuaron durante varios años después."
 ALG_maghreb_invite.1.t: "Invitación a la Unión Magreb"
 ALG_maghreb_invite.1.d: "Argelia propone una alianza económica y militar del norte de África. ¿Nos uniremos?"
 ALG_maghreb_invite.1.a: "Únase a la Unión"
 ALG_maghreb_invite.1.b: "Rechazar (sólo Marruecos)"
 ALG_maghreb_trade_hub: "Centro de comercio del Magreb"
 ALG_maghreb_trade_hub_desc: "Nuestra economía prospera como el centro del comercio norteafricano."
 ALG_maghreb_diplomacy: "Diplomacia del Magreb"
 ALG_maghreb_diplomacy_desc: "Argelia se está afirmando como líder del norte de África, fomentando la unidad mediante el comercio y la seguridad compartida."
 ALG_maghreb_union_tt: "El sindicato del Magreb se formó\nArgelia, Túnez y otras naciones del norte de África comparten ahora vínculos económicos y militares bajo nuestro liderazgo."
 ALG_trade_allies: "Comercio de aliados"
 ALG_egypt_algiers_axis: "Egypt-Algiers Axis"
 ALG_egypt_algiers_axis_desc: "Nuestras relaciones se remontan con Egipto Debemos seguir fortaleciendo nuestra posición en África y liderar este continente."
 FIS_Are_Terrorists: "La FIS son terroristas"
 ALG_un_peacekeepers: "Despliegue del personal de mantenimiento de la paz"
 ALG_un_peacekeepers_desc: "Las Naciones Unidas han enviado fuerzas de mantenimiento de la paz para estabilizar la región y prevenir nuevos conflictos. Su misión es mantener el orden, proteger a los civiles y apoyar los esfuerzos diplomáticos para lograr una paz duradera."
 ALG_civil_war_recovered: "La guerra civil se supera"
 ALG_civil_war_recovered_desc: "La nación ha surgido de la agitación de la guerra civil, comenzando el largo proceso de curación y reconstrucción. Los esfuerzos se centran en restablecer la unidad, reconstruir la infraestructura y prevenir futuros conflictos internos."
 ALG_sonatrach_restructure: "Reestructuración de Sonatrach"
 ALG_sonatrach_restructure_desc: "La empresa petrolera nacional Sonatrach está experimentando una importante reestructuración para mejorar la eficiencia, aumentar la producción y fortalecer la estabilidad económica. Esta transformación pretende impulsar el sector energético del país y apoyar el crecimiento a largo plazo"
 ALG_investment_boom_modifier: "Inversión Boom"
 ALG_investment_boom_modifier_desc: "El país está experimentando un aumento de las inversiones nacionales y extranjeras, lo que alimenta el rápido crecimiento económico y el desarrollo. Este boom aumenta la capacidad industrial, la infraestructura y la prosperidad general."
 ALG_foreign_oil_licensing_bonus: "Licencias extranjeras de petróleo"
 ALG_foreign_oil_licensing_bonus_desc: "Concede acceso temporal a la empresa extranjera a nuestros campos petroleros, aumentando nuestra capacidad de producción petrolera."
 ALG_idea_pro_palestinian_campaign: "Pro Palestina"
 ALG_idea_pro_palestinian_campaign_desc: "Aumenta las relaciones con los grupos palestinos y potencialmente aumenta el apoyo a los movimientos de independencia de Argelia en la región."
 ALG_idea_palestinian_backing: "El respaldo de Argelia a los derechos palestinos"
 ALG_idea_palestinian_backing_desc: " Análisis del apoyo histórico y permanente de Argelia a los derechos palestinos, incluidas las posturas diplomáticas, las iniciativas de ayuda y un compromiso político más amplio."
 ALG_idea_palestinian_aid_fund: "Fondo de Ayuda Palestina Argelina"
 ALG_idea_palestinian_aid_fund_desc: "Un fondo establecido por Argelia para proporcionar ayuda humanitaria y de desarrollo al pueblo palestino. Esto podría incluir iniciativas de socorro de emergencia, desarrollo de infraestructuras, educación y empoderamiento económico."
 ALG_crackdown_backfired: "Grieta atrasada"
 ALG_idea_refoming_education1: "Educación de reforma"
 ALG_idea_refoming_education: "Educación de reforma"
 ALG_university_expansion: "Expansión universitaria"
 ALG_basic_income_support: "Apoyo básico a los ingresos"
 ALG_housing_support_idea: "Apoyo a la vivienda"
 ALG_childcare_reform: "Reforma de la atención infantil"
 ALG_civil_rights: "C) Derechos civiles"
 ALG_public_admin_reform: "Transporte público gratuito"
 MSP_switch_to_morocco: "Abandon Sahrawi"
 MSP_switch_to_morocco_desc: "Apoyar a Sahrawi ha asegurado nuestras relaciones con Marruecos. Marruecos es un poder económico creciente, una nación poderosa junto a nosotros. Sería muy lógico dejar caer nuestro apoyo sin sentido para Sahrawi y construir términos amistosos con Marruecos en su lugar."
 MSP_influence_mauritania: "Influencia Mauritania"
 MSP_influence_mauritania_desc: "Mauritania emprendió una corta guerra contra Marruecos para el Sáhara Occidental después de que España se retirara de la región. Ya no reclaman el territorio, pero han seguido intensamente el conflicto del Sáhara Occidental y son uno de los partidarios del Frente Polisario. Es importante aumentar nuestro control de ellos para resolver el conflicto del Sáhara Occidental."
 MSP_casablanca_accords: "Acuerdos de Casablanca"
 MSP_casablanca_accords_desc: "El conflicto en el Sáhara Occidental ha estado congelado durante décadas sin que nadie pueda resolverlo. Necesitamos utilizar nuestra influencia en la región para resolver el conflicto."
 ALG_influence_mauritania: "Influencia Mauritania"
 ALG_influence_mauritania_desc: "Mauritania emprendió una corta guerra contra Marruecos para el Sáhara Occidental después de que España se retirara de la región. Ya no reclaman el territorio, pero han seguido intensamente el conflicto del Sáhara Occidental y son uno de los partidarios del Frente Polisario. Es importante aumentar nuestro control de ellos para resolver el conflicto del Sáhara Occidental."
 ALG_energy_reform: "Reforma energética"
 ALG_energy_reform_desc: "Necesitamos arreglar nuestro asunto de energía, reformando la industria energética podemos distribuir energía para todo el país."
 ALG_focus_on_oil: "Enfoque sobre aceite"
 ALG_focus_on_oil_desc: "Hay muchas venas de petróleo sin explotar en todo Argelia, y según algunos estudios, Argelia podría ser uno de los países más ricos en petróleo del mundo, la mayor parte de ese petróleo se acaba de descomponer. Como tal, deberíamos centrarnos en el petróleo."
 ALG_focus_on_oil_tt: "§CEnfoque El petróleo nos permitirá obtener más ganancias en la venta de energía a nuestros vecinos, pero será desastroso para el Hassi Messaoud!§!"
 ALG_focus_on_renewables: "Enfoque on Renewables"
 ALG_focus_on_renewables_desc: "Argelia es un país donde ninguna aldea es demasiado pequeña para el sol. Necesitamos mostrar un ejemplo al resto del mundo y construir una red de energía sostenible. Será caro, pero valdrá la pena para las generaciones futuras."
 ALG_focus_on_renewables_tt: "§CEnfoque En materia de energía renovable no se beneficiará tanto como el uso del petróleo, sino que será mejor para el Hassi Messaoud!§!"
 ALG_oil_production: "Trabajar con Sonatrach"
 ALG_oil_production_desc: "La principal empresa argelina de petróleo y gas es Sonatrach, una entidad estatal. Es un actor importante en el mercado energético global y busca activamente inversiones y alianzas en el sector del petróleo y gas. Sonatrach participa en todos los aspectos de la cadena de valor hidrocarburo, desde la exploración y producción hasta el refinamiento y distribución."
 ALG_grid_expansion: "Expansión a presión"
 ALG_grid_expansion_desc: "Es agradable que podamos producir nuestra propia electricidad, pero también necesitamos una robusta red eléctrica para mover la electricidad alrededor del país y a nuestros vecinos."
 ALG_solar_panel_grid: "Rejilla de panel solar"
 ALG_solar_panel_grid_desc: "Considerando nuestra posición geográfica, el sol casi siempre está en abundancia en Argelia. Esto lo convierte en una ubicación increíble para establecer plantas de energía solar"
 ALG_hassi_massoud_exploitation: "Hassi Messaoud Explotación"
 ALG_resource_excavation_research: "Investigación de excavación de aceite"
 ALG_resource_excavation_research_desc: "Algunos de los aceites están en difícil acceso a lugares. Tenemos que trabajar junto con la Universidad de Argel 1 para encontrar formas de excavar cada pedazo de aceite posible"
 ALG_wind_turbine_research: "Investigación de turbinas eólicas"
 ALG_wind_turbine_research_desc: "Con la tecnología actual, el establecimiento de parques eólicos en Argelia es imposible. Las condiciones del viento simplemente no son adecuadas para las turbinas contemporáneas. Necesitamos invertir en la investigación de soluciones para este problema"
 ALG_ethanol_power_plant: "Planta de energía etanol"
 ALG_ethanol_power_plant_desc: "Utilizando el etanol derivado del estiércol de vaca, podemos crear una manera sostenible de generar electricidad"
 ALG_algeria_steelworks: "Algeria Steelworks"
 ALG_algeria_steelworks_desc: "¡Tenemos que cavar más petróleo! Con todo el aceite extra, también podemos configurar una fábrica de acero"
 ALG_Adrar_wind_park: "Adrar Wind Park"
 ALG_Adrar_wind_park_desc: "La granja eólica Adrar es una granja natural en la parte sur de Argelia. El terreno cerca de la Granja es adecuado para establecer granjas eólicas, y ahí es donde crearemos el primer eólico de Argelia"
 ALG_national_space_program: "Programa espacial nacional"
 ALG_national_space_program_desc: "Argelia debe establecer un programa espacial nacional para incorporarse a las filas de naciones espaciales. Esta iniciativa sentará las bases para los logros futuros en materia de exploración espacial y tecnología satelital."
 ALG_arab_world_outreach: "Tesis diplomáticas árabes"
 ALG_arab_world_outreach_desc: "Para fortalecer la influencia de Argelia en el mundo árabe, debemos revitalizar nuestros esfuerzos diplomáticos de divulgación y coordinación. A través de visitas bilaterales, cumbres e iniciativas comerciales, Argelia puede afirmarse como una fuerza unificadora en la región."
 ALG_join_arab_league: "Fortalecimiento de la participación de la Liga Árabe"
 ALG_join_arab_league_desc: "Como miembro actual de la Liga Árabe, Argelia puede ir más allá de la participación y asumir un papel diplomático importante. Promover la coordinación económica, las consultas de defensa y la solidaridad cultural mejorarán nuestra posición en el mundo árabe."
 ALG_support_palestine: "Apoyo a la Causa Palestina"
 ALG_support_palestine_desc: "La larga relación de Argelia con Palestina está arraigada en experiencias históricas compartidas y solidaridad política. Esta conexión se manifiesta en diversas formas, incluido el apoyo diplomático a la libre determinación y la ayuda humanitaria palestinas. El compromiso de Argelia con la causa palestina es un aspecto clave de su política exterior."
 ALG_algeria_algiers_axis: "Forja el eje Egipto-Algiers"
 ALG_algeria_algiers_axis_desc: "Al alinearse más estrechamente con Egipto, Argelia puede ayudar a formar un poderoso bloque regional capaz de guiar la unidad árabe, asegurar la estabilidad del norte de África y contrarrestar la influencia extranjera."
 ALG_condemn_israel: "Condenan Israeli Actions"
 ALG_condemn_israel_desc: "A la luz de la continua agresión y las violaciones de los derechos humanos, Argelia condenará oficialmente las acciones israelíes en la etapa internacional, apoyando una paz justa y oponiéndose a la normalización sin resolución."
 ALG_palestinian_aid_package: "Paquete de ayuda palestina"
 ALG_palestinian_aid_package_desc: "Asignaremos recursos para proporcionar asistencia humanitaria, económica y técnica a los territorios palestinos, asegurando que el compromiso de Argelia se extienda más allá de las palabras a la ayuda real e impactante."
 ALG_pan_african_defense_initiative: "Iniciativa Panafricana de Defensa"
 ALG_pan_african_defense_initiative_desc: "Para proteger la soberanía africana y mejorar la estabilidad continental, Argelia propone una iniciativa coordinada de defensa africana que construya la disposición militar colectiva contra amenazas compartidas."
 ALG_send_troops_to_sahel: "Despliegue de las Fuerzas al Sahel"
 ALG_send_troops_to_sahel_desc: "En respuesta a la creciente inestabilidad en el Sahel, Argelia enviará tropas para apoyar las operaciones de mantenimiento de la paz, la protección fronteriza y las campañas antiterroristas en colaboración con los gobiernos regionales."
 ALG_sahel_stabilization_force: "Fuerza de estabilización del Sahel"
 ALG_sahel_stabilization_force_desc: "Argelia tomará la iniciativa en el establecimiento de una fuerza permanente de estabilización del Sahel, un marco de seguridad dirigido por África para contrarrestar las insurgencias y las redes delictivas en la región."
 ALG_exploit_sahel_resources: "Explotación de los recursos del Sahel"
 ALG_exploit_sahel_resources_desc: "La influencia argelina en el Sahel ofrece acceso a recursos naturales sin explotar. Mediante la negociación de contratos de minería e infraestructura, podemos conseguir beneficios económicos y alianzas estratégicas en la región."
 ALG_propose_maghreb_union: "Proponer la Unión del Magreb"
 ALG_propose_maghreb_union_desc: "Es hora de revivir la visión de un Magreb unido. Argelia adoptará la iniciativa de proponer nuevas iniciativas de integración, centrándose en la cooperación económica, la infraestructura conjunta y el alineamiento diplomático."
 ALG_economic_integration_initiative: "Integración económica del Magreb"
 ALG_economic_integration_initiative_desc: "A través de tarifas reducidas, inversiones en infraestructura y debates sincronizados sobre políticas monetarias, Argelia impulsará esfuerzos para crear una zona económica común del Magreb que beneficie a todos los Estados miembros."
 ALG_maghreb_joint_defense_pact: "Pacto Conjunto de Defensa del Magreb"
 ALG_maghreb_joint_defense_pact_desc: "Un Magreb seguro requiere defensa colectiva. Proponemos un pacto militar regional centrado en la protección de fronteras, el intercambio de inteligencia y ejercicios militares conjuntos."
 ALG_idea_joint_military_arab: "Ejército conjunto árabe"
 palestine_issue_very_positive: "Apoyo a la cuestión palestina"
 ALG_algerian_airforce: "Modernizar la Fuerza Aérea Argelina"
 ALG_algerian_airforce_desc: "Una fuerza aérea moderna y capaz es esencial para la defensa nacional. Invertiremos en la reestructuración, capacitación piloto y adquisición de equipo para mejorar la preparación aérea."
 ALG_buy_russia_su_27: "Procure Russian SU-27s"
 ALG_buy_russia_su_27_desc: "Como parte de nuestra modernización de la fuerza aérea, negociaremos con Rusia para comprar un lote de combatientes SU-27, potenciando nuestra superioridad aérea y disuasión estratégica."
 ALG_oum_el_bouaghi_airbase: "Ampliar Oum El Bouaghi Airbase"
 ALG_oum_el_bouaghi_airbase_desc: "Estratégicamente ubicado en el este, Oum El Bouaghi se ampliará en un importante centro operacional para la fuerza aérea de Argelia, mejorando nuestras capacidades de despliegue rápido."
 ALG_protect_the_skies: "Protege los Cielos"
 ALG_protect_the_skies_desc: "Con amenazas aéreas regionales en aumento, Argelia debe asegurarse de que pueda detectar e interceptar cualquier incursión. Fortalecer nuestras defensas aéreas es una prioridad de seguridad nacional."
 ALG_russia_mig_servicing: "Contratos de mantenimiento de MiG rusos"
 ALG_russia_mig_servicing_desc: "Mantener y mejorar nuestra flota de MiG requiere una cooperación más estrecha con los contratistas rusos. Estos acuerdos de prestación de servicios garantizarán la longevidad operacional para las aeronaves existentes."
 ALG_bosnian_parts: "Piezas de repuesto Bosnia seguras"
 ALG_bosnian_parts_desc: "Argelia asegurará componentes excedentes de la industria de defensa de Bosnia para apoyar y adaptar nuestros marcos aéreos envejecidos, asegurando un mantenimiento y reparación rentables."
 ALG_comprehensive_radar_installations: "Ampliación de cobertura de radar"
 ALG_comprehensive_radar_installations_desc: "Para lograr la cobertura total de radares nacionales, construiremos instalaciones avanzadas por radar a través de las fronteras y costas de Argelia, cerrando todos los puntos ciegos en nuestro espacio aéreo."
 ALG_reform_or_control: "Reforma o control"
 ALG_reform_or_control_desc: "Argelia se encuentra en una encrucijada política. La elección entre verdadera reforma democrática o consolidación del control autoritario definirá el futuro de la nación."
 ALG_legalize_moderate_islamists: "Legalizar islamistas moderados"
 ALG_legalize_moderate_islamists_desc: "Reconocer partidos islamistas moderados ofrece un camino hacia la estabilidad mediante la inclusión. La participación vigilada cuidadosamente en las elecciones puede desactivar los sentimientos radicales."
 ALG_restore_elections: "Restaurar los procesos electorales"
 ALG_restore_elections_desc: "Para relegitimizar el Estado, Argelia debe reanudar elecciones libres y justas. La transparencia y la rendición de cuentas serán los pilares de nuestra nueva era política."
 ALG_public_media_and_transparency: "Empoderar a los medios públicos y la transparencia"
 ALG_public_media_and_transparency_desc: "La reforma de los medios de comunicación estatales y la libertad de prensa son vitales para reconstruir la confianza pública. Una ciudadanía informada es esencial para el desarrollo democrático."
 ALG_crackdown_on_opposition: "Arrastre hacia abajo en la oposición"
 ALG_crackdown_on_opposition_desc: "Para prevenir la desestabilización, debe contenerse el disenso. La vigilancia, la censura y las detenciones selectivas neutralizarán los elementos antigubernamentales."
 ALG_state_surveillance_network: "Red de vigilancia estatal"
 ALG_state_surveillance_network_desc: "Se ampliará una red nacional de inteligencia para supervisar las actividades políticas, asegurando que se neutralicen las amenazas antes de que puedan escalar."
 ALG_joint_governance_experiment: "Experimento conjunto de gobernanza"
 ALG_joint_governance_experiment_desc: "Probaremos una nueva forma de compartir el poder entre las fuerzas seculares y religiosas para prevenir un nuevo conflicto. Este experimento arriesgado podría traer paz o parálisis."
 ALG_a_radical_reorientation: "Una orientación radical"
 ALG_a_radical_reorientation_desc: "El orden existente ha fracasado. A través del mandato divino y la claridad ideológica surge un nuevo camino, guiado por una creencia intransigente y el rechazo de la legitimidad del Estado secular."
 ALG_covert_support_for_islamist_radicals: "Apoyo cubierto para los radicales islamistas"
 ALG_covert_support_for_islamist_radicals_desc: "Las redes radicales permanecen activas en las sombras. Con financiación estratégica y asistencia logística encubierta, podemos empoderar a estos grupos para que actúen contra el régimen desde dentro."
 ALG_tolerate_radical_preachers: "Predicadores radicales tolerados"
 ALG_tolerate_radical_preachers_desc: "El púlpito es una poderosa herramienta. Al abrir un ojo ciego a los sermones de marca de fuego, permitimos que la ideología se extendiera orgánicamente a través de mezquitas y medios de comunicación, radicalizando a la población a nuestro favor."
 ALG_welcome_militants: "Militantes extranjeros bienvenidos"
 ALG_welcome_militants_desc: "Nuestra causa trasciende las fronteras. Los combatientes extranjeros alineados con nuestra ideología pueden ser protegidos e integrados en células locales, aportando experiencia de combate y dedicación inquebrantable."
 ALG_arms_smuggling: "Operaciones de contrabando de armas"
 ALG_arms_smuggling_desc: "Para prepararnos para un futuro enfrentamiento, debemos establecer cadenas subterráneas de suministro para armas y municiones. Las alianzas con traficantes de armas transnacionales servirán a nuestras necesidades."
 ALG_start_the_uprising: "Comience el levantamiento"
 ALG_start_the_uprising_desc: "Ahora es el momento. Con nuestras redes activadas, nuestros combatientes armados y nuestra ideología difundiendo, nos levantaremos contra el régimen y declararemos un nuevo orden islámico."
 ALG_clamp_down_on_vices: "Apunta a los Vices"
 ALG_clamp_down_on_vices_desc: "El juego, el alcohol y la decadencia moral no tienen lugar en nuestra sociedad. Una campaña radical para eliminar estos vicios limpiará a la nación y afirmará autoridad religiosa."
 ALG_revolutionize_the_ulema: "Revolucionar el Ulema"
 ALG_revolutionize_the_ulema_desc: "El establecimiento religioso debe alinearse con la causa revolucionaria. El ulema tradicional será purgado o reeducado, mientras que los clérigos leales toman su lugar como líderes espirituales del estado."
 ALG_traditional_gender_roles: "Reforzar las funciones tradicionales en materia de género"
 ALG_traditional_gender_roles_desc: "La era moderna ha corrompido el orden natural. Volveremos a los roles ordenados divinamente de hombres y mujeres, instituyendo un marco legal estricto que refleje estos valores."
 ALG_pledge_allegiance_to_al_qaeda: "Lealtad a Al-Qaida"
 ALG_pledge_allegiance_to_al_qaeda_desc: "Para que la yihad global tenga éxito, la unidad es esencial. Juraremos lealtad a Al-Qaeda, alinearnos con su visión y obtener apoyo de una red islamista más amplia."
 ALG_pledge_allegiance_to_daesh: "Allegiación del Estado Islámico"
 ALG_pledge_allegiance_to_daesh_desc: "Al-Qaeda es un movimiento descrépito y decadente que ha perdido la vista de su objetivo original de librar a la yihad global, en lugar de perderse en los asuntos a nivel local. Es hora de que un nuevo movimiento con una nueva sensación de propósito tome su lugar."
 ALG_secure_the_loyalty_of_aqim: "Asegurar la lealtad de AQIM"
 ALG_secure_the_loyalty_of_aqim_desc: "Al-Qaeda en el Magreb Islámico debe reconocer nuestro liderazgo y operar en coordinación con nuestro estado. Su lealtad garantizará un control duradero sobre las operaciones yihadistas regionales."
 ALG_war_on_daesh: "Guerra contra Daesh"
 ALG_secure_the_loyalty_effect_tt: "Los efectos dependerán de que cualquiera de los próximos países sea como marionetas: [AQY.GetNameWithFlag], [NUS.GetNameWithFlag], [TTP.GetNameWithFlag]"
 ALG_war_on_daesh_desc: "El llamado «Estado Islámico» es una clara amenaza para nuestro liderazgo del movimiento yihadista global. Su rechazo a nuestra autoridad y sus tácticas no convencionales ya no se puede tolerar. Es hora de que acabemos la guerra contra el Daesh."
 ALG_jihad_in_the_maghreb: "Jihad en el Magreb"
 ALG_jihad_in_the_maghreb_desc: "Los regímenes seculares de Marruecos, Túnez y Argelia deben caer. Ampliaremos nuestro Califato por la fuerza, iniciando una campaña regional de guerra religiosa y expansión territorial."
 ALG_jihad_in_arabia: "Jihad en Arabia"
 ALG_jihad_in_arabia_desc: "Como hogar de los lugares sagrados de la Meca y Medina, la península árabe es quizás el territorio más religiosamente significativo del mundo. Por lo tanto, no se puede permitir que continúe gobernándose por gobiernos insuficientemente piadosos y corruptos."
 ALG_jihad_in_the_levant: "Yihad in Iraq and al-Sham"
 ALG_jihad_in_the_levant_desc: "El Iraq y el Levante son regiones que han sido desgarradas por fuerzas extranjeras desde la época colonial. Es sólo a través de la fuerza de armas que los ocupantes cruzados y sionistas en el Levante pueden ser expulsados."
 ALG_jihad_in_west_africa: "Jihad en África Occidental"
 ALG_jihad_in_west_africa_desc: "Nuestra revolución no para en el Magreb. Ha llegado el momento de exportar yihad a África Occidental, derrocando regímenes en Malí, Níger y Mauritania mientras marchamos hacia el sur."
 AlgeriaFocus.56.t: "[FROM.GetNameDef] Apoya nuestra independencia"
 AlgeriaFocus.56.d: "[FROM.GetNameDef] ha afirmado su apoyo a nuestra independencia de Marruecos y han señalado que quieren trabajar más estrechamente con nosotros en el futuro."
 AlgeriaFocus.56.a: "Genial."
 AlgeriaFocus.57.t: "[FROM.GetNameDef] Abandons Us"
 AlgeriaFocus.57.d: "[FROM.GetNameDef] ha recuperado su apoyo a nuestra independencia. Han sido nuestro partidario durante décadas, pero parece que ahora nos han abandonado para tener mejores condiciones con Marruecos."
 AlgeriaFocus.57.a: "Traitors!"
 algeria_algerian_foreign_policy: "Política Exterior de Argelia"
 AlgeriaFocus.64.t: "[FROM.GetNameDef] Exige la Autonomía Cretan"
 AlgeriaFocus.64.d: "El gobierno [FROM.GetAdjective] ha declarado que están preocupados por nuestra posición en la isla de Creta. Según ellos, nuestro apretado control en la isla compromete su seguridad. Están exigiendo que Crete tenga una autonomía limitada para garantizar nuestra reducida presencia militar y política en la zona."
 AlgeriaFocus.64.a: "Supongo que podemos"
 AlgeriaFocus.64.b: "That's ridiculous"
 AlgeriaFocus.65.t: "[FROM.GetNameDef] Acepta"
 AlgeriaFocus.65.d: "El gobierno [FROM.GetAdjective] ha aceptado nuestras demandas de aumentar la autonomía para el pueblo cretano."
 AlgeriaFocus.65.a: "Éxito"
 AlgeriaFocus.66.t: "[FROM.GetNameDef] Rechazos"
 AlgeriaFocus.66.d: "El gobierno [FROM.GetAdjective] ha rechazado nuestras demandas de aumentar la autonomía para el pueblo Cretán."
 AlgeriaFocus.66.a: "Se arrepentirán de esto."
 AlgeriaFocus.66.b: "Vamos a bidear nuestro tiempo"
 AlgeriaFocus.67.t: "Hamás comienza la nueva intifada"
 AlgeriaFocus.67.d: "Hamás ha llamado una nueva intifada contra nosotros. Estamos viendo un aumento del movimiento de los militantes de Hamás y ya han habido varias manifestaciones contra nuestro gobierno sobre Palestina. Tenemos informes de que Argelia podría estar detrás de armar y motivar a Hamas para esta nueva campaña."
 AlgeriaFocus.67.a: "Se arrepentirán de esto."
 AlgeriaFocus.68.t: "[FROM.GetNameDef] Patrocina una nueva intifada"
 AlgeriaFocus.68.d: "[FROM.GetAdjective] nos ha enviado armas y dinero para comenzar una nueva Intifada contra Israel. Ya tenemos una línea de nuevos reclutas cerca de nuestras oficinas, y la gente se moviliza para protestar contra los ocupantes israelíes."
 AlgeriaFocus.68.a: "We thank Algeria"
 AlgeriaFocus.69.t: "Hamás se levanta"
 AlgeriaFocus.69.d: "Estamos recibiendo informes de combatientes de Hamás que ocupan instituciones y edificios clave en la Franja de Gaza. Ellos han jurado que Israel sufrirá de una nueva Intifada."
 AlgeriaFocus.69.a: "Damn"
 AlgeriaFocus.69.b: "¡Atrápenlos!"
 AlgeriaFocus.70.t: "[FROM.GetNameDef] Contactos Toubou"
 AlgeriaFocus.70.d: "Hemos recibido informes de que Argelia ha comenzado a armar rebeldes toubou en el norte de nuestro país. Si Argelia invade, seguramente estos rebeldes se unirán a su causa."
 AlgeriaFocus.70.a: "Worrying"
 AlgeriaFocus.71.t: "[FROM.GetNameDef] Sugiere minería conjunta"
 AlgeriaFocus.71.d: "El gobierno [FROM.GetAdjective] ha sugerido una empresa mixta de extracción de uranio en la franja Aouzou. Esto proporcionará recursos para nuestros países en el futuro. ¿Cómo debemos responder?"
 AlgeriaFocus.71.a: "¡Una gran idea!"
 AlgeriaFocus.71.b: "No nos importa."
 AlgeriaFocus.72.t: "[FROM.GetNameDef] Acepta nuestro trato"
 AlgeriaFocus.72.d: "El gobierno [FROM.GetAdjective] ha aceptado nuestro acuerdo sobre minería conjunta"
 AlgeriaFocus.72.a: "Genial."
 AlgeriaFocus.73.t: "[FROM.GetNameDef] Rechaza nuestro trato"
 AlgeriaFocus.73.d: "El gobierno [FROM.GetAdjective] ha rechazado nuestro acuerdo sobre minería conjunta"
 AlgeriaFocus.73.a: "Damn"
 AlgeriaFocus.74.t: "[FROM.GetNameDef] Comienza la minería de uranio"
 AlgeriaFocus.74.d: "[FROM.GetNameDef] ha comenzado la extracción de uranio en la Faja Aouzou. Mientras que la mayoría de los recursos van a ellos, también tenemos una pequeña parte y el [FROM.GetAdjective] ha acordado cubrir todos los costos de la excavación."
 AlgeriaFocus.74.a: "Okay"
 AlgeriaFocus.91.t: "Ampliación del Gobierno"
 AlgeriaFocus.91.d: "Ahora que estamos a cargo, tenemos que solidificar nuestra posición para llevar a cabo nuevas reformas ampliando nuestra base de apoyo. 2 partes se ofrecieron a aliarnos con nosotros pero en ciertas condiciones. Un partido pequeño pero aspirante está dirigido por descentralistas que buscan desviar el poder e introducir iniciativas democráticas directas. El otro partido está dirigido por republicanos populistas que buscan una base centralizada de poder burocrático que pueda actuar como una fuerza unificadora capaz del orden y la justicia, totalmente opuesto a la descentralización. Nos aliaremos con:"
 AlgeriaFocus.91.a: "Los decentralistas"
 AlgeriaFocus.91.b: "Los republicanos populistas"
 AlgeriaFocus.91.c: "Sí, podemos hablar de eso después."
 ALG_claim_jerusalem_for_arabs: "Reclamación de Jerusalén por árabes"
 ALG_claim_jerusalem_for_arabs_desc: "Ni los israelíes ni los palestinos merecen la región. Han demostrado que sólo harán un desastre. Debería corresponder a los verdaderos árabes gobernar sobre la región y traer paz y estabilidad."
 ALG_claim_jerusalem_for_arabs_tt: "Seremos capaces de convertir los estados §YClaimed§! en el Levante en §YCores§!"
 ALG_approach_hamas: "Enfoque de Hamás"
 ALG_approach_hamas_desc: "Hamas es la única fuerza verdadera que trata de prevenir el sionismo. Tenemos que construir mejores lazos con ellos para prepararnos para superar a Israel."
 ALG_send_fighters_to_hamas: "Enviar a los combatientes a Hamás"
 ALG_send_fighters_to_hamas_desc: "Mientras los palestinos resisten valientemente a los invasores sionistas, la simple verdad es que están superados en número. Necesitamos organizar un grupo de voluntarios para viajar a Palestina y unirse a las filas de Hamás."
 MSP_claim_jerusalem_for_arabs: "Reclamación de Jerusalén por árabes"
 MSP_claim_jerusalem_for_arabs_desc: "Ni los israelíes ni los palestinos merecen la región. Han demostrado que sólo harán un desastre. Debería corresponder a los verdaderos árabes gobernar sobre la región y traer paz y estabilidad."
 MSP_approach_hamas: "Enfoque de Hamás"
 MSP_approach_hamas_desc: "Hamas es la única fuerza verdadera que trata de prevenir el sionismo. Tenemos que construir mejores lazos con ellos para prepararnos para superar a Israel."
 MSP_send_fighters_to_hamas: "Enviar a los combatientes a Hamás"
 MSP_send_fighters_to_hamas_desc: "Mientras los palestinos resisten valientemente a los invasores sionistas, la simple verdad es que están superados en número. Necesitamos organizar un grupo de voluntarios para viajar a Palestina y unirse a las filas de Hamás."
 MSP_condemn_china: "Condemn China"
 MSP_condemn_china_desc: "El tratamiento de China de sus musulmanes nativos es aborrecible y debe ser condenado"
 MSP_improve_relations_with_algeria: "Mejorar las relaciones con Egipto"
 MSP_improve_relations_with_algeria_desc: "Turquía tiene una historia rocosa con Egipto, principalmente debido a nuestros conflictos pasados. Todos estamos del mismo lado y no deberíamos estar tan fríos con los egipcios."
 MSP_work_together_with_BSEC: "Trabajar juntos con BSEC"
 MSP_work_together_with_BSEC_desc: "El BSEC (Cooperación Económica del Mar Negro) es una organización dirigida a traer prosperidad alrededor del Mar Negro. La organización está compuesta por países alrededor del Mar Negro y algunos países de los Balcanes del Sur. Tenemos que trabajar juntos con estos países para aumentar los beneficios"
 MSP_fixing_ideals: "Ideales de reparación"
 AlgeriaInvestment.1.t: "[ALG.GetNameDef] Nos invita a invertir en sus proyectos"
 AlgeriaInvestment.1.desc: "A partir de una década de guerra civil, el gobierno de [ALG.GetNameWithFlag] nos invita a invertir en varios proyectos en todo su país. Ya sea para comprometer nuestro capital depende de nosotros. La inversión nos compraría influencia en Argel, pero con grupos islamistas armados todavía activos en el interior, el riesgo para nuestros activos es real."
 AlgeriaInvestment.1.a: "¡Invierte en su infraestructura!"
 AlgeriaInvestment.1.b: "¡Invierte en su industria civil!"
 AlgeriaInvestment.1.c: "¡Invierte en su industria de servicios!"
 AlgeriaInvestment.1.d: "Será mejor que no lo arriesguemos."
 AlgeriaInvestment.2.t: "[FROM.GetNameDef] Invertido en nuestra Infraestructura!"
 AlgeriaInvestment.2.d: "Después de días de negociaciones, [FROM.GetNameWithFlag] ha acordado invertir en nuestra infraestructura a cambio de algunas concesiones mínimas. La inversión beneficiará a nuestra población rural en el país."
 AlgeriaInvestment.2.a: "¡Estamos agradecidos por su ayuda!"
 AlgeriaInvestment.3.t: "[FROM.GetNameDef] Invertido en nuestra industria civil!"
 AlgeriaInvestment.3.d: "Después de días de negociaciones, [FROM.GetNameWithFlag] ha acordado ayudarnos a construir algunas fábricas civiles a cambio de algunas concesiones menores. La inversión beneficiará al sector industrial de nuestro país y facilitará la modernización del país."
 AlgeriaInvestment.3.a: "¡Estamos agradecidos por su ayuda!"
 AlgeriaInvestment.4.t: "[FROM.GetNameDef] Invertido en nuestra industria de servicios!"
 AlgeriaInvestment.4.d: "Después de días de negociaciones, [FROM.GetNameWithFlag] ha acordado invertir en nuestra industria de servicios construyendo algunas oficinas a cambio de algunas concesiones menores. La inversión beneficiará al sector financiero de nuestro país y facilitará la modernización del país."
 AlgeriaInvestment.4.a: "¡Estamos agradecidos por su ayuda!"
 AlgeriaInvestment.5.t: "[FROM.GetNameDef] ¡Declinado a Invertir!"
 AlgeriaInvestment.5.d: "Después de días de negociaciones, [FROM.GetNameWithFlag] ha rechazado nuestra invitación a la inversión, citando que el entorno empresarial en nuestro país no es lo suficientemente seguro todavía y evaluará cuidadosamente futuros acuerdos de inversión con nosotros."
 AlgeriaInvestment.5.a: "¡Adivina que tenemos que hacer más trabajo!"
 AlgeriaInvestment.6.t: "Argelia considera una inversión en el Oriente Medio después de la adhesión a la OMC"
 AlgeriaInvestment.6.d: "Con su reciente adhesión a la Organización Mundial del Comercio (OMC), Argelia observa una mayor infusión de capital para impulsar el desarrollo económico. Los funcionarios están llegando a las naciones del Oriente Medio, pidiendo una mayor cooperación e inversión en sectores clave. Este movimiento indica el compromiso de Argelia de aprovechar las alianzas internacionales para impulsar el crecimiento y la estabilidad en la región."
 AlgeriaInvestment.7.t: "Firman un trato comercial"
 AlgeriaInvestment.7.d: "Desean proponer un acuerdo comercial para impulsar una mayor cooperación y tener una puerta abierta a la inversión futura"
 AlgeriaInvestment.7.a: "Claro."
 AlgeriaInvestment.6.a: "Firme un acuerdo comercial"
 AlgeriaInvestment.6.b: "Invertir en una fábrica"
 AlgeriaInvestment.6.c: "No gracias."
 Algeria.11.t: "[ALG.GetNameDef] Pide nuestra protección"
 Algeria.11.d: "Después de décadas de disturbios, el gobierno argelino teme una reinición de guerra o injerencia e invasión externas, la [ALG.GetNameWithFlag] Presidente [ALG.GetLeader] ha visitado el Zhongnanhai y se acercó al Secretario General [CHI.GetLeader] para un tratado de defensa. Si estamos de acuerdo en protegerlos, podremos asegurarnos de que estén dentro de nuestra esfera de influencia, pero también tendremos la obligación de defenderlos [ALG.GetNameWithFlag] de las amenazas externas, así como prestar asistencia para mantener la estabilidad del país, especialmente en la lucha contra £GFX_ALG_salafist_jihadism Insurgencia de extremistas islámicos. Teniendo en cuenta la situación de nuestro país, si firmamos un tratado de defensa con [ALG.GetLeader]?"
 Algeria.11.a: "¡Otro Hermano de Hierro!"
 Algeria.11.b: "¡No tenemos nada que perdonar por un tratado!"
 Algeria.12.t: "[CHI.GetNameDef] ha acordado protegernos"
 Algeria.12.d: "Gracias a nuestros esfuerzos diplomáticos, el Secretario General [CHI.GetLeader] de [CHI.GetNameWithFlag] ha firmado formalmente un tratado de defensa con nuestro Presidente [ALG.GetLeader], al firmar este tratado de defensa, [FROM.GetNameWithFlag] no sólo nos protegerá de la agresión externa, sino que también proporcionará asistencia para mantener nuestra estabilidad interna."
 Algeria.12.a: "¡Excelente!"
 Algeria.13.t: "[CHI.GetNameDef] ¡Rehusado a firmar!"
 Algeria.13.d: "A pesar de que nuestro Presidente [ALG.GetLeader] visitaba [CHI.GetNameWithFlag] para la asistencia en materia de seguridad, [CHI.GetLeader] aparentemente estaba cerca de cualquier tipo de tratados. [CHI.GetLeader] ha dicho a nuestro presidente que «siempre estaremos comprometidos con la seguridad y estabilidad regionales.» Pero es muy obvio que el compromiso de [CHI.GetLeader] sólo permanece en palabras, tenemos que defendernos solos."
 Algeria.13.a: "Qué decepción"
