 ALG_minister_vacant: "Vacantes"
 ALG_military_industrial_complex: "Complejo Militar-Industrial"
 ALG_patronage_networks: "Redes de patrocinio"
 ALG_crush_all_opposition: "Aplastar toda la oposición"
 ALG_control_hydrocarbons: "Control de los Hidrocarburos"
 ALG_fortress_algeria: "Fortress Algeria"
 ALG_military_industrial_complex_desc: "El ejército expande su imperio económico, construyendo fábricas de armas y asegurando contratos lucrativos de defensa. El cuerpo oficial se convierte en una clase de negocios, con generales sentados en tableros corporativos y acumulando vastas riquezas."
 ALG_patronage_networks_desc: "Una red de patronaje conecta el régimen a las élites empresariales y los intermediarios de poder regionales. La lealtad se compra con contratos, licencias y acceso. El Estado se convierte en un instrumento para el enriquecimiento privado."
 ALG_crush_all_opposition_desc: "El régimen elimina toda oposición organizada a través de arrestos, censura e intimidación. Los partidos políticos están cooptados o prohibidos. La sociedad civil está destripada. Sólo se escucha la voz del régimen."
 ALG_control_hydrocarbons_desc: "El Estado toma el control total del sector hidrocarburo, embalando los ingresos de petróleo y gas directamente en los cofres del régimen. Los socios extranjeros están exprimidos, los operadores independientes son absorbidos, y el estado profundo controla el spigot."
 ALG_fortress_algeria_desc: "Argelia se convierte en estado de guarnición - militarizado, cerrado y sospechoso del mundo exterior. El ejército es fuerte, las fronteras están selladas y la población se mantiene en línea a través de una combinación de riqueza petrolera y represión."
 ALG_oil_crash_weakens_regime_tt: "La caída del petróleo ha debilitado gravemente la capacidad del régimen para comprar paz social. El descontento popular está aumentando."
 ALG_hirak_wins_tt: "El movimiento Hirak ha triunfado. Una nueva Argelia es posible."
 ALG_military_wins_tt: "El estado profundo ha prevalecido. La regla militar continúa bajo una nueva cara."
 ALG_republic_new_era_tt: "Comienza una nueva era para la República de Argelia. El viejo sistema está siendo desmantelado."
 ALG_parliamentary_republic_tt: "Argelia ha adoptado un sistema parlamentario de gobierno. La Asamblea Nacional es suprema."
 ALG_semi_presidential_republic_tt: "Argelia ha adoptado un sistema de gobierno semipresidencial. El poder es compartido entre presidente y parlamento."
 ALG_presidential_republic_tt: "Argelia ha adoptado un sistema presidencial de gobierno. El presidente tiene autoridad ejecutiva dominante."
 ALG_patronage_enriches_regime_tt: "Las redes de patrocinio enriquecen el régimen y sus aliados a expensas del pueblo argelino."
 ALG_fortress_state_tt: "Argelia se ha convertido en un estado de fortaleza. El estado profundo gobierna absolutamente, y la nación está cerrada al mundo."
 ALG_military_industrial_economy: "Economía militar e industrial"
 ALG_state_hydrocarbon_monopoly: "Estado Hidrocarburo Monopoly"
 ALG_fortress_state: "Fortaleza del Estado"
 ALG_military_industrial_economy_desc: "Los militares se han expandido en la producción de armas y la industria de defensa, creando una base económica autosuficiente para el régimen. Generales se sientan en tableros corporativos y la línea entre uniforme y traje de negocios ha borroso."
 ALG_state_hydrocarbon_monopoly_desc: "El control estatal total sobre los ingresos del petróleo y el gas financia el régimen y sus redes de patrocinio. El sector hidrocarburo es un mundo cerrado donde sólo puede funcionar el conectado."
 ALG_fortress_state_desc: "Argelia se ha convertido en un estado cerrado y militarizado. El ejército es poderoso, la sociedad está controlada y el estado profundo gobierna sin desafío. Estabilidad ha sido adquirido al precio de la libertad."
 ALG_redmed_group_expansion: "Expansión del Grupo RedMed"
 ALG_redmed_group_expansion_desc: "RedMed Group ha demostrado ser un socio logístico confiable para el sector del petróleo y gas alrededor de Hassi Messaoud. Con la inversión adecuada, puede convertirse en una fuerza industrial más amplia."
 ALG_star_aviation_operations: "Operaciones aéreas de aviación"
 ALG_star_aviation_operations_desc: "La filial de aviación de RedMed Group ha mantenido un registro de seguridad perfecto desde su fundación. Debemos aprovechar esta reputación para profundizar nuestra participación en el sector de la aviación."
 ALG_military_aviation_contract: "Contratos de aviación militar"
 ALG_military_aviation_contract_desc: "La excelencia operacional de Star Aviation ha captado la atención del ejército. La adquisición de contratos de defensa abrirá la puerta para el desarrollo aeroespacial avanzado, y financiará la siguiente fase de expansión."
 ALG_missile_development_initiative: "Iniciativa de desarrollo de misiles"
 ALG_missile_development_initiative_desc: "Un ejército moderno no puede depender solo de armas extranjeras. Comenzaremos un programa nacional de misiles a través de RedMed Group, sentando las bases para la disuasión estratégica."
 ALG_star_aviation_uav_division: "Aviación estelar División UAV"
 ALG_star_aviation_uav_division_desc: "Con la tecnología UAV extranjera en mano, Star Aviation está listo para establecer una división de drones dedicada. Los ingenieros argelinos estudiarán, adaptarán y eventualmente superarán lo que se les ha dado."
 ALG_domestic_uav_production: "Producción de UAV doméstica"
 ALG_domestic_uav_production_desc: "La fase de ingeniería inversa está completa. Las instalaciones de Star Aviation están listas para producir vehículos UAVs diseñados por Argelia a escala. Esto ya no se trata de las importaciones, sino de la soberanía."
 ALG_russian_missile_cooperation: "Cooperación rusa en materia de misiles"
 ALG_russian_missile_cooperation_desc: "La industria de misiles de Rusia está entre los más avanzados del mundo. Una asociación con Moscú acelerará nuestro programa significativamente, a costa de profundizar nuestra dependencia de la buena voluntad rusa."
 ALG_chinese_missile_cooperation: "Cooperación en materia de misiles chinos"
 ALG_chinese_missile_cooperation_desc: "China ha demostrado su disposición a compartir tecnología de misiles con estados amigos. Un acuerdo con Beijing ofrece acceso a los sistemas modernos y fortalece nuestra posición en el mundo multipolar emergente."
 ALG_redmed_star_convergence: "RedMed-Star Convergence"
 ALG_redmed_star_convergence_desc: "Ha llegado el momento de unir la división de misiles de RedMed con las capacidades UAV de Star Aviation bajo una sola estructura de defensa integrada. Argelia ya no importará su seguridad, la fabricará."
 ALG_regional_defense_leader: "Jefe de Defensa del Magreb"
 ALG_regional_defense_leader_desc: "La industria de defensa de Argelia está ahora sin pares en el Magreb. Nuestros UAV patrullan el Sahara, nuestros misiles disuaden a nuestros rivales, y nuestra tecnología es buscada por vecinos que una vez miraron a Europa. Esto es lo que parece la soberanía."
 ALG_uav_procurement_category: "Contratación de vehículos UAV"
 ALG_uav_procurement_category_desc: "Star Aviation requiere una plataforma de referencia para comenzar la ingeniería inversa. Seleccione un proveedor extranjero UAV."
 ALG_drone_program_category: "Programa de desarrollo del drone"
 ALG_drone_program_category_desc: "La división UAV de Star Aviation está lista para desarrollar el primer drone nacional de Argelia. Elige una dirección de desarrollo."
 ALG_purchase_turkish_uavs: "Compra UAVs Turcos"
 ALG_purchase_turkish_uavs_desc: "El Bayraktar TB2 se ha demostrado en múltiples conflictos. Adquirirlo de Turquía proporcionará la experiencia operacional de los VA y una plataforma sólida para ingeniería inversa, a costa de acercarse más a Ankara."
 ALG_purchase_chinese_uavs: "Compra UAV chino"
 ALG_purchase_chinese_uavs_desc: "El Wing Loong II de China ofrece capacidades comparables a las de los sistemas occidentales a una fracción del precio. Pekín también ha mostrado disposición a incluir cláusulas de transferencia de tecnología en estos acuerdos."
 ALG_purchase_iranian_uavs: "Compra VU iraní"
 ALG_purchase_iranian_uavs_desc: "El Mohajer-6 de Irán es rentable y probado en combate. Adquirirlo de Teherán es la opción más barata y profundiza los lazos con un socio estratégico natural, aunque puede atraer el escrutinio internacional."
 ALG_develop_amel_recon_uav: "Desarrollar el UAV Amel"
 ALG_develop_amel_recon_uav_desc: "El Amel será el primer reconocimiento nacional de Argelia UAV, una plataforma de alta resistencia optimizada para la vigilancia fronteriza y la reunión de inteligencia en todo el sur del Sáhara."
 ALG_develop_el_djazair_ucav: "Desarrollar el UCAV El-Djazair"
 ALG_develop_el_djazair_ucav_desc: "El-Djazair será un verdadero drone de combate, un UCAV armado capaz de huelgas de precisión. Más caro y técnicamente exigente que una plataforma de reconocimiento, pero un activo militar mucho más potente."
 ALG_develop_swarm_loitering: "Desarrollar municiones merodeadoras en enjambre"
 ALG_develop_swarm_loitering_desc: "En lugar de un único dron grande, Argelia invertirá en enjambres de municiones merodeadoras pequeñas, baratas y coordinadas. Más difíciles de interceptar, devastadoras en cantidad y más baratas de producir a escala."
 ALG_redmed_group_tt: "§GRedMed Group se expande más allá de la logística del petróleo & en capacidades industriales más amplias.§!"
 ALG_star_aviation_founded_tt: "§GLa excelencia operacional de la Aviación Star lo posiciona para contratos militares.§!"
 ALG_military_contract_tt: "§GStar Aviation ha conseguido contratos militares. Actualmente se dispone de decisiones sobre adquisiciones UAV.§!"
 ALG_uav_division_tt: "§GSe ha establecido una división UAV dedicada. Actualmente se dispone de decisiones sobre desarrollo sin efecto.§!"
 ALG_domestic_production_tt: "§GLa argelia puede ahora fabricar UAVs domésticamente.§!"
 ALG_amel_developed_tt: "§GEl reconocimiento de Amel UAV ha sido desarrollado con éxito.§!"
 ALG_ucav_developed_tt: "§GEl combate de El-Djazair UAV está ahora operativo.§!"
 ALG_swarm_developed_tt: "§GArgelia ha desarrollado una capacidad de munición enjambre§!."
 ALG_missile_division_tt: "§GRedMed Group ha establecido una división dedicada al desarrollo de misiles.§!"
 ALG_redmed_leader_tt: "§GRedMed Group y Star Aviation se han fusionado en un complejo industrial de defensa unificado.§!"
 ALG_defense_leader_tt: "§GAlgeria es reconocida como la principal nación tecnológica de defensa del Magreb.§!"
 ALG_redmed_group_logistics: "Logística de grupo RedMed"
 ALG_redmed_group_logistics_desc: "RedMed Group proporciona servicios logísticos integrales al sector petrolero y gas de Argelia."
 ALG_redmed_star_aviation: "Operaciones aéreas de aviación"
 ALG_redmed_star_aviation_desc: "Star Aviation mantiene un registro de seguridad perfecto. Su precisión operativa está siendo redirigida hacia el desarrollo aeroespacial."
 ALG_star_aviation_military: "Contratos Militares de Aviación Estelar"
 ALG_star_aviation_military_desc: "Star Aviation ha conseguido contratos militares, llevando su excelencia operacional civil al sector de defensa."
 ALG_star_aviation_uav_division_idea: "Aviación estelar División UAV"
 ALG_star_aviation_uav_division_idea_desc: "Una división dedicada a drones está estudiando plataformas extranjeras UAV para desarrollar las propias capacidades de Argelia."
 ALG_star_aviation_uav_production: "Fabricación de vehículos de aviación estelar"
 ALG_star_aviation_uav_production_desc: "Star Aviation fabrica ahora UAVs diseñados por Argelia a escala."
 ALG_redmed_integrated_defense_systems: "Defensa integrada RedMed"
 ALG_redmed_integrated_defense_systems_desc: "RedMed Group ha fusionado sus programas UAV y misiles en un complejo de armas avanzado unificado."
 ALG_maghreb_defense_powerhouse: "Defensa del Magreb Powerhouse"
 ALG_maghreb_defense_powerhouse_desc: "La industria de defensa de Argelia, liderada por RedMed Group y Star Aviation, es la más avanzada en África del Norte."
 ALG_aerospace_training_program: "Programa de capacitación aeroespacial"
 ALG_aerospace_training_program_desc: "Un programa nacional que produce ingenieros aeroespaciales y técnicos de drones para sostener la creciente industria de defensa de Argelia."
 ALG_combat_uav_program: "Programa de combate UAV"
 ALG_combat_uav_program_desc: "El desarrollo activo de los Emiratos Árabes Unidos armados está mejorando la capacidad de huelga de la Fuerza Aérea Argelina."
 ALG_redmed_missile_division_idea: "División de misiles RedMed"
 ALG_redmed_missile_division_idea_desc: "El brazo dedicado al desarrollo de misiles de RedMed Group está construyendo el disuasivo estratégico de Argelia desde el suelo."
 ALG_cruise_missile_development: "Desarrollo de misiles crucero"
 ALG_cruise_missile_development_desc: "Un programa activo de misiles crucero está dando a Argelia capacidad de huelga de largo alcance por primera vez."
 ALG_precision_strike_capability: "Precisión de la capacidad de ataque"
 ALG_precision_strike_capability_desc: "Los misiles integrados y los sistemas UAV han dado a Argelia una capacidad de huelga de precisión genuina."
 ALG_defense_export_industry: "Industria exportadora de defensa"
 ALG_defense_export_industry_desc: "Los vehículos y misiles argelinos están disponibles para su exportación. Cada venta es tanto ingresos como ventaja diplomática."
 ALG_redmed_group_concern: "Grupo RedMed"
 ALG_redmed_group_concern_desc: "Un importante conglomerado industrial argelino con raíces en la logística del petróleo y el gas. RedMed Group se ha convertido en el principal fabricante de defensa de Argelia, produciendo UAV y sistemas de misiles para las fuerzas armadas."
 ALG_star_aviation_concern: "Estrella de aviación"
 ALG_star_aviation_concern_desc: "La subsidiaria de aviación del Grupo RedMed. Fundada en 2001 con un registro de seguridad perfecto, Star Aviation lidera ahora los programas nacionales de fabricación aeroespacial y drone de Argelia."
 ALG_arrest_opponents_started_tt: "Las fuerzas de seguridad están iniciando operaciones de arresto..."
 ALG_surveillance_started_tt: "La expansión de la red de vigilancia está en marcha..."
 ALG_ban_parties_started_tt: "Los procedimientos legales para prohibir los partidos de oposición han comenzado..."
 ALG_imf_loan_started_tt: "Las negociaciones de préstamos del FMI están en marcha..."
 ALG_oil_licensing_started_tt: "Las negociaciones de concesión de licencias petrolíferas con empresas extranjeras han comenzado..."
 ALG_repay_imf_started_tt: "El proceso de reembolso del préstamo del FMI ha comenzado..."
