 ALG_social_contract_idea: "Contrato social"
 ALG_state_hospitals_idea: "Hospitales estatales"
 ALG_transparent_budget: "Presupuesto transparente"
 ALG_appoint_sellal: "Appoint Abdelmalek Sellal"
 ALG_appoint_sellal_desc: "Un tecnócrata y lealista de Bouteflika, Sellal representa la continuidad y la gobernanza pragmática, con énfasis en la estabilidad y gestión de las instituciones estatales."
 ALG_sellal_gets_appointed: "Abdelmalek Sellal ha sido nombrado Primer Ministro."
 ALG_sellal_modifiers: "§YEfectos de la cita de Sellal:§!\nDrift democrático: §G+0.10§!\nCostos de burocracia: §G-10%§!\nIngresos fiscales: §G+3%§!\nGasto policial esperado: §R-1§!\nGasto de atención médica esperado: §R-1§!"
 ALG_appoint_ouyahia: "Appoint Ahmed Ouyahia"
 ALG_appoint_ouyahia_desc: "Ouyahia es un político veterano con una reputación de austeridad dura y lealtad hacia el establecimiento gobernante. Su estilo de liderazgo favorece el control centralizado y la disciplina financiera."
 ALG_ouyahia_gets_appointed: "Ahmed Ouyahia ha sido nombrado Primer Ministro."
 ALG_ouyahia_modifiers: "§YEfectos de la cita de Ouyahia:§!\nDrift democrático: §G+0.10§!\nCostos de burocracia: §G-10%§!\nIngresos fiscales: §G+3%§!\nGasto policial esperado: §R-1§!\nGasto de atención médica esperado: §R-1§!"
 ALG_appoint_bedoui: "Appoint Noureddine Bedoui"
 ALG_appoint_bedoui_desc: "Bedoui, un burócrata de carrera y ministro, encarna la lealtad tecnócrata a la presidencia. Su estilo de gobierno hace hincapié en la eficiencia administrativa y las reformas limitadas."
 ALG_bedoui_gets_appointed: "Noureddine Bedoui ha sido nombrado Primer Ministro."
 ALG_bedoui_modifiers: "§YEfectos de la cita de Bedoui:§!\nDrift democrático: §G+0.10§!\nCostos de burocracia: §G-10%§!\nIngresos fiscales: §G+3%§!\nGasto policial esperado: §R-1§!\nGasto de atención médica esperado: §R-1§!"
 ALG_no_pm_set: "§RNo se designó Primer Ministro§!"
 ALG_ahmed_gaid_salah_desc: "Jefe del Estado Mayor del Ejército Nacional Popular, Ahmed Gaïd Salah fue un oficial de carrera que ascendió durante la Guerra de Independencia y más tarde se convirtió en una de las figuras más influyentes de los asuntos militares y políticos de Argelia."
 ALG_smain_lamari_desc: "Jefe de los servicios de inteligencia y contraespionaje de Argelia, Smain Lamari tuvo un papel central en la «Guerra Sucia» contra los insurgentes islamistas durante la Década Negra."
 ALG_kaidi_mohamed_desc: "Un oficial respetado con experiencia en formaciones mecanizadas, Kaidi Mohamed se especializó en la guerra de blindados y en la modernización de las fuerzas terrestres de Argelia."
 ALG_ahcene_tafer_desc: "Ahcène Tafer fue conocido por su liderazgo en las unidades mecanizadas de Argelia y por su papel en la reestructuración del ejército en los años posteriores a la guerra civil."
 ALG_mohammed_larbi_haouli_desc: "Mohammed Larbi Haouli comandó la Armada argelina durante un período de modernización, equilibrando la defensa costera con la cooperación regional."
 ALG_ammar_atamnia_desc: "Un oficial superior que sirvió como estratega en las fuerzas terrestres de Argelia, Ammar Atamnia era conocido por su énfasis en la guerra defensiva y la instrucción militar."
 ALG_mohammed_al_arabi_hawalli_desc: "Mohammed Al-Arabi Hawalli ocupó cargos de mando naval y contribuyó a la reforma de las fuerzas marítimas de Argelia."
 ALG_mahmoud_laraba_desc: "Un comandante de la fuerza aérea, Mahmoud Laraba participó en el entrenamiento de pilotos y en la reorganización de la red de defensa aérea de Argelia."
 ALG_mohamed_lamari_desc: "Como jefe del Estado Mayor durante la Década Negra, Mohamed Lamari fue una de las figuras clave que dirigieron las operaciones de contrainsurgencia de Argelia."
 ALG_said_chengriha_desc: "Said Chengriha se especializó en la guerra de blindados y la logística, y más tarde ascendió hasta comandar las fuerzas terrestres de Argelia y llegó a ser jefe del Estado Mayor."
 ALG_ben_ali_ben_ali_desc: "Comandante de las unidades de élite de Argelia, Ben Ali Ben Ali se ganó una reputación de profesionalismo y disciplina dentro de la infantería."
 ALG_fatima_zohra_ardjoune_desc: "Una de las primeras mujeres de Argelia en alcanzar el rango de general, Fatima Zohra Ardjoune fue médica militar y un símbolo de la modernización de las fuerzas armadas."
 ALG_mohamed_mediene_desc: "Conocido como «Toufik», Mohamed Mediène dirigió el poderoso servicio de inteligencia de Argelia (DRS) de 1990 a 2015, lo que lo convirtió en una de las figuras más influyentes de la Argelia moderna."
 ALG_abdelmalek_guenaizia_desc: "Abdelmalek Guenaizia fue viceministro de Defensa y más tarde jefe del Estado Mayor, y tuvo un papel clave en la modernización del ejército argelino."
 ALG_ahmed_bousteila_desc: "Comandante de la Gendarmería argelina, Ahmed Bousteila supervisó la seguridad de las zonas rurales de Argelia y la lucha contra el contrabando y el terrorismo."
 ALG_fatima_boudouani_desc: "Primera mujer ascendida a general en el ejército argelino (2009), Fatima Boudouani representó un avance en la integración de género en las fuerzas armadas."
 alg_medal_1: "Orden del 1 de noviembre"
 alg_medal_1_desc: "Premiada por una valentía excepcional en la defensa de la nación."
 alg_medal_2: "Medalla de Liberación Nacional"
 alg_medal_2_desc: "Conmemora las contribuciones pendientes a la lucha por la independencia de Argelia."
 alg_medal_3: "Medalla del Mérito Militar"
 alg_medal_3_desc: "Concedido por excelencia en mando y servicio."
 alg_medal_4: "Valor Medal"
 alg_medal_4_desc: "Reconoce los actos de valentía en el campo de batalla."
 alg_medal_5: "Medalla de Servicio Popular"
 alg_medal_5_desc: "Premiada por el servicio desinteresado en la protección de los civiles."
 alg_medal_6: "Medalla Legacy de Martyr"
 alg_medal_6_desc: "Símbolo del sacrificio final para la nación."
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_0: "Segundo teniente"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1: "Lieutenant"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_2: "Captain"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3: "Major"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4: "Colonel"
 algeria_intro.1.t: "La República Democrática Popular de Argelia"
 algeria_intro.1.d: "Argelia entra en el siglo XXI atemorizado por la sangrienta Década Negra, pero todavía de pie. El estado ha sobrevivido a la insurgencia islamista, pero las heridas de la guerra civil siguen siendo profundas. El Presidente Abdelaziz Bouteflika promete reconciliación y reconstrucción, pero los desafíos que hay por delante son desalentadores: revivir la economía, reformar el ejército, reconstruir la confianza entre el pueblo y el Estado, y navegar entre poderosos socios extranjeros. ¿Argelia consolidará la estabilidad y aumentará como potencia regional, o caerá una vez más en un conflicto interno?"
 algeria_intro.1.a: "Una nación asustada, pero sin romper."
 ALG_resistance_window_title: "Movimiento de Resistencia Argelina"
 ALG_resistance_window_desc: "La nación está sacudida por protestas generalizadas, disturbios y resistencia. Le Pouvoir busca suprimir el disenso, pero cuanto más presión se aplica, la resistencia más fuerte se vuelve."
 ALG_protester_exhaustion_TT: "§YLos manifestantes§! se han agotado de las contramedidas gubernamentales."
 ALG_deploys_security_TT: "§YEl Estado despliega fuerzas de seguridad pesadas para reprimir los disturbios.§!"
 ALG_presidential_decisions_only_one_is_available_TT: "Solo una medida de supresión puede estar activa a la vez."
 ALG_resistance_movement: "Movimiento Hirak"
 ALG_resistance_movement_desc: "Protestas populares en todo el país, conocidas como el Hirak, siguen exigiendo reforma política, transparencia y justicia social en toda Argelia."
 ALG_throttle_internet_speeds: "Ordenanza n.º 24-17: regulación de las telecomunicaciones"
 ALG_throttle_internet_speeds_desc: "En virtud de la Ordenanza 24-17, las autoridades restringen el acceso a plataformas en línea y redes sociales para perturbar a los organizadores de Hirak. Esto limita la coordinación de protestas, pero frustra a los ciudadanos y retrasa la actividad económica."
 ALG_nationwide_security_presence: "Operación Halcón del Desierto: presencia de seguridad nacional"
 ALG_fund_pro_government_protests: "Programa de Solidaridad Nacional: iniciativa «Baraka»"
 ALG_fund_pro_government_protests_desc: "El gobierno financia y organiza manifestaciones pro-regime bajo el Proyecto Baraka para contrarrestar el movimiento Hirak. Esto puede amortiguar el impulso de la oposición, pero es costoso y riesgos inflamar el resentimiento público."
 ALG_deploy_security_kabylia_1: "Desplegar tropas de seguridad en Cabilia"
 ALG_deploy_security_kabylia_1_desc: "Cabilia se ha convertido en un foco de disturbios. Desplegar fuerzas de seguridad puede pacificar la región, pero corre el riesgo de avivar aún más el resentimiento local."
 ALG_deploy_security_mzab_1: "Desplegar tropas de seguridad en el valle del M'zab"
 ALG_deploy_security_mzab_1_desc: "Las tensiones en el Valle del M'zab han aumentado. El envío de destacamentos de seguridad puede frenar el malestar local, pero las operaciones pesadas corren el riesgo de alienar a las comunidades y socavar la confianza a largo plazo."
 ALG_deploy_security_aures_1: "Desplegar tropas de seguridad en las tierras altas del Aurés"
 ALG_deploy_security_aures_1_desc: "Las tierras altas de Aurès se han convertido en un punto focal para las manifestaciones. Un despliegue de seguridad puede romper grandes reuniones, sin embargo va a colar la logística en terrenos robustos y podría inflamar las quejas regionales."
 ALG_deploy_security_tamanrasset_1: "Desplegar tropas de seguridad en la provincia de Tamanrasset"
 ALG_deploy_security_tamanrasset_1_desc: "Las provincias del sur de Tamanrasset están viendo mayores disturbios. Las fuerzas de despliegue pueden estabilizar las rutas de transporte e instalaciones clave, pero corren el riesgo de dañar las relaciones con las comunidades locales y de perturbar el comercio cruzado del Sáhara."
 ALG_deploy_security_granderg_1: "Desplegar tropas de seguridad en el Gran Erg Occidental"
 ALG_deploy_security_granderg_1_desc: "Disturbios alrededor del Gran Erg Occidental ha amenazado asentamientos remotos e infraestructura crítica. Las patrullas de seguridad pueden traer orden a corto plazo, aunque el entorno difícil hace que las operaciones sostenidas sean costosas y políticamente sensibles."
 ALG_deploy_security_atlas_1: "Desplegar tropas de seguridad en las estribaciones del Atlas"
 ALG_deploy_security_atlas_1_desc: "Las estribaciones de Atlas han acogido protestas recurrentes y acciones laborales. Un despliegue específico puede prevenir las movilizaciones masivas a lo largo de los corredores de transporte, pero puede alimentar el resentimiento entre las poblaciones rurales."
 ALG_deploy_security_constantinois_1: "Desplegar tropas de seguridad en la región de Constantina"
 ALG_deploy_security_constantinois_1_desc: "Constantina y sus alrededores sufren manifestaciones frecuentes. Concentrar aquí los activos de seguridad puede proteger instalaciones gubernamentales y puertos, pero eleva la probabilidad de enfrentamientos en distritos urbanos densos."
 ALG_deploy_security_algerois_1: "Desplegar tropas de seguridad en el área metropolitana de Argel"
 ALG_deploy_security_algerois_1_desc: "Argel sigue siendo el centro de la actividad del Hirak. Una fuerte presencia de seguridad puede disuadir las movilizaciones callejeras y proteger las instituciones, pero corre el riesgo de una represión visible en la capital y de un costo político importante."
 ALG_deploy_security_oranais_1: "Desplegar tropas de seguridad en Orán y la costa occidental"
 ALG_deploy_security_oranais_1_desc: "La región de Oran ha visto crecientes manifestaciones vinculadas a redes laborales y juveniles. Las fuerzas de despliegue pueden proteger los puertos y los centros económicos, pero pueden perturbar el comercio e intensificar las tensiones con los líderes locales."
 ALG_doing_decision: "Aplicando actualmente una medida de supresión"
 ALG_doing_decision_y: "Aplicando actualmente una medida de supresión"
 ALG_protests_ongoing: "Protestas de todo el país en curso"
 ALG_locals_swayed: "Los locales son simpáticos con los manifestantes"
 ALG_kabylia_fell_recently: "Kabylia fue recientemente pacificada"
 ALG_oranais_fell_recently: "Región de Oranais fue recientemente pacificada"
 ALG_algerois_fell_recently: "Área Metropolitana de Argel fue recientemente pacificada"
 ALG_constantinois_fell_recently: "Región de Constantinois fue recientemente pacificada"
 ALG_atlas_fell_recently: "Atlas Foothills Were Recent Pacified"
 ALG_granderg_fell_recently: "Gran Erg Occidental fue recientemente pacificado"
 ALG_tamanrasset_fell_recently: "Provincia de Tamanrasset fue recientemente pacificada"
 ALG_aures_fell_recently: "Aurès Highlands Were Recent Pacified"
 ALG_mzab_fell_recently: "El valle de M'zab fue recientemente pacificado"
 ALG_state_falls_TT: "§YEste estado§! ha caído bajo influencia de los manifestantes."
 algerian_events.201.t: "Mzab ha caído a los manifestantes"
 algerian_events.201.a: "Otra región se escapa."
 algerian_events.202.t: "Aurès ha caído a los manifestantes"
 algerian_events.202.a: "Las protestas se extendieron"
 algerian_events.203.t: "Tamanrasset ha caído a los manifestantes"
 algerian_events.203.a: "El sur es inestable"
 algerian_events.204.t: "Grand Erg Occidental ha fallado a los manifestantes"
 algerian_events.204.a: "Incluso el desierto se levanta"
 algerian_events.205.t: "Atlas argelino ha caído en protestas"
 algerian_events.205.a: "Los disturbios se ensanchan"
 algerian_events.206.t: "Constantinois ha caído a los manifestantes"
 algerian_events.206.a: "La erupción del este"
 algerian_events.207.t: "Kabylia ha caído a los manifestantes"
 algerian_events.207.a: "Kabylia se levanta de nuevo"
 algerian_events.208.t: "Algérois ha caído a los manifestantes"
 algerian_events.208.a: "El corazón de Argelia tembla"
 algerian_events.209.t: "Oranais ha caído a los manifestantes"
 algerian_events.209.a: "El oeste está perdido"
 algerian_events.201.d: "Los habitantes de la región del Mzab han desafiado el control gubernamental y se han apoderado de las calles.\nPeregrinación pública: [ALG_grievance_text]"
 algerian_events.202.d: "En las montañas del Aurès, el descontento se ha convertido en desafío abierto.\nPeregrinación pública: [ALG_grievance_text]"
 algerian_events.203.d: "A pesar del aislamiento, Tamanrasset ha estallado, el gobierno pierde el control de la zona.\nPeregrinación pública: [ALG_grievance_text]"
 algerian_events.204.d: "Las comunidades del desierto del Gran Erg Occidental se han unido a la ola de protesta.\nPeregrinación pública: [ALG_grievance_text]"
 algerian_events.205.d: "La región del Atlas, una vez tranquila, se ha convertido en un lecho de disturbios antigubernamentales.\nPeregrinación pública: [ALG_grievance_text]"
 algerian_events.206.d: "Las protestas en el este abruman a las fuerzas de seguridad locales, y Constantinois ha caído.\nPeregrinación pública: [ALG_grievance_text]"
 algerian_events.207.d: "Kabylia, con su larga tradición de disentimiento, está una vez más desafiando al estado.\nKabyle mood: [ALG_kabyle_satisfaction_text]"
 algerian_events.208.d: "Incluso la región de la capital ha sido sacudida por protestas incontrolables.\nAgarre militar: [ALG_army_grip_text]"
 algerian_events.209.d: "En el oeste, Oranais se une a la ola de disturbios que recorre Argelia.\nPeregrinación pública: [ALG_grievance_text]"
 algerian_events.200.t: "Protestas impresionadas"
 algerian_events.200.d: "Las fuerzas de seguridad han logrado suprimir la última ola de manifestaciones, aunque el enojo público se sumerge bajo la superficie."
 algerian_events.200.a: "El orden está restaurado, por ahora."
 algerian_events.2015.t: "Represión de incendios"
 algerian_events.2015.d: "Los intentos de descifrar las protestas sólo han alimentado más enojo, amoldando a los manifestantes y debilitando la autoridad gubernamental."
 algerian_events.2015.a: "La situación empeora."
 algerian_events.2025.t: "Fin de las protestas"
 algerian_events.2025.d: "Después de meses de lucha, la última ola de protestas se ha quemado. Las tensiones permanecen, pero por ahora las calles están tranquilas de nuevo."
 algerian_events.2025.a: "Finalmente, la calma vuelve."
 algerian_events.301.t: "¡Las protestas de todo el país están en erupción!"
 algerian_events.301.d: "Parece que nuestras acciones recientes no fueron tomadas a la ligera por el pueblo, y las protestas nacionales han erupcionado. Poco a poco, pero sin duda, parece que cada vez más personas están exigiendo la renuncia del gobierno, aunque no vamos a ir a ninguna parte."
 algerian_events.301.a: "¡Debimos haber visto esto venir!"
 ALG_khenchela_arms_manufacturer: "Complejo de fabricación de armas Khenchela"
 ALG_khenchela_arms_manufacturer_desc: "Una instalación estatal en la provincia de Khenchela que produce armas de infantería y equipo para el Ejército Popular Nacional de Argelia. Se estableció para reducir la dependencia de las importaciones de armas extranjeras y garantizar la autosuficiencia en la producción de armas pequeñas."
 ALG_seriana_small_arms: "La fábrica de armas pequeñas Seriana"
 ALG_seriana_small_arms_desc: "Situado en el este de Argelia, la instalación Seriana produce rifles, pistolas y municiones para las fuerzas de seguridad argelinas. La fábrica funciona bajo la supervisión del Ministerio de Defensa Nacional."
 ALG_dgi_missile_systems: "DGI - Dirección Générale de l'Industrie Militaire"
 ALG_dgi_missile_systems_desc: "La Dirección General de Industria Militar supervisa los sectores manufactureros de defensa de Argelia, incluyendo armas guiadas, sistemas antitanque/antiaéreos y desarrollo de artillería. Subordinado al Ministerio de Defensa Nacional, el DGI coordina las empresas estatales y las alianzas técnica-militares para garantizar la autonomía estratégica."
 ALG_bcl_armored_development: "BCL - Brigada de Construcción Logistiques"
 ALG_bcl_armored_development_desc: "La Brigada Militar de Construcción Logística maneja mantenimiento de vehículos blindados, mejoras y producción nacional limitada. BCL se especializa en la remodelación del equipo de la era soviética y la adaptación de los vehículos a las condiciones operacionales saharauis."
 ALG_snvi_vehicle_manufacturer: "SNVI - Société Nationale des Véhicules Industriels"
 ALG_snvi_vehicle_manufacturer_desc: "El fabricante nacional de vehículos de Argelia, establecido en 1967. SNVI produce camiones militares, vehículos de utilidad y vehículos blindados ligeros a través de asociaciones con Mercedes-Benz y otros fabricantes, con todos los diseños adaptados al terreno y el clima del norte de África."
 ALG_enmib_helicopter_unit: "ENMIB - Entreprise Nationale des Matériels et Infrastructures de Base"
 ALG_enmib_helicopter_unit_desc: "El servicio de mantenimiento y montaje de helicópteros de Argelia, proporcionando servicios de revisión y producción limitada para la Fuerza Aérea Argelina. ENMIB maneja el montaje autorizado de los diseños de helicópteros extranjeros."
 ALG_mers_el_kebir_shipyards: "Astillero naval Mers El-Kébir"
 ALG_mers_el_kebir_shipyards_desc: "Situado en el puerto estratégico de Mers El-Kébir cerca de Oran, esta histórica instalación naval maneja la construcción y mantenimiento de buques de patrulla y embarcaciones navales ligeras para la Armada Argelina."
 ALG_el_djazair_naval_industry: "CNAN - Compagnie Nationale Algérienne de Navigation"
 ALG_el_djazair_naval_industry_desc: "La empresa marítima nacional de Argelia, CNAN opera astilleros en Argel capaces de construir corbetas, fragatas y submarinos con asistencia técnica extranjera. La empresa también maneja el transporte marítimo comercial y la logística naval."
 ALG_ersa_aircraft_manufacturer: "ERSA - Entreprise de Réparation et de Service Aéronautique"
 ALG_ersa_aircraft_manufacturer_desc: "Mantenimiento, reparación y reacondicionamiento de las aeronaves primarias de Argelia. ERSA maneja un montaje limitado de aeronaves con licencia para la Fuerza Aérea argelina y proporciona servicios técnicos de aviación integral."
 ALG_mio_header_equipment_reliability: "Fiabilidad del equipo"
