l_spanish:
 hong_kong_focus: "Hong Kong Enfoque Árbol"
 HKG_divided_hong_kong: "Un Hong Kong dividido"
 HKG_divided_hong_kong_desc: "Los últimos años del gobierno británico de Hong Kong dejaron un legado de democracia pluralista. Sin embargo, también produjo interminables disputas entre los campamentos pro-establecimiento, prodemocracia y localistas, reduciendo la eficiencia administrativa a cada paso. La gente está empezando a preguntarse si esta «democracia» caótica es realmente tan buena como está hecha para ser."
 HKG_support_pro_beijing_camp: "Apoyo al Campamento Pro-Beijing"
 HKG_support_pro_beijing_camp_desc: "«La libertad no es inimportante. Pero en nuestra cultura social, la libertad no es tan importante como la estabilidad.» Ahora es el momento de que el mundo sea testigo de un Hong Kong más estable y seguro."
 HKG_railway_development_strategy_2000: "Estrategia de desarrollo ferroviario 2000"
 HKG_railway_development_strategy_2000_desc: "Una creciente población y un creciente comercio transfronterizo están empujando la red vial de Hong Kong hacia el candado. La Estrategia de Desarrollo Ferroviario 2000 guiará la expansión del MTR durante la próxima década, desplazando a los viajeros y cargando por las carreteras y hacia el ferrocarril."
 HKG_sign_CEPA: "Firme la CEPA"
 HKG_sign_CEPA_desc: "El Acuerdo de Asociación Económica más Cierre formaliza el acceso preferencial al comercio entre Hong Kong y el continente. Un boón para el comercio transfronterizo y un paso más cerca de la interdependencia económica."
 HKG_approve_funding_for_XRL: "Aprobar la financiación para el XRL"
 HKG_approve_funding_for_XRL_desc: "El Express Rail Link conectará Hong Kong directamente a la red ferroviaria de alta velocidad continental. La financiación es grande, el simbolismo político aún mayor."
 HKG_co_location_bill: "El proyecto de ley de localización"
 HKG_co_location_bill_desc: "Un proyecto de ley polémico que coloca la jurisdicción sobre el cumplimiento de la ley en China continental en la terminal West Kowloon XRL. El campo pro-Beijing lo llama pragmático, pandemócratas lo llaman una violación constitucional."
 HKG_electoral_reform: "Reforma electoral"
 HKG_electoral_reform_desc: "La Ley Fundamental prescribió cómo el Jefe Ejecutivo sería elegido para los dos primeros términos y el LegCo para los tres primeros, pero no dice nada sobre las elecciones posteriores. Esta es nuestra oportunidad de impulsar una reforma del sistema electoral y avanzar hacia un auténtico sufragio universal."
 HKG_a_broader_electorate: "¿Un Electorado más amplio?"
 HKG_a_broader_electorate_desc: "El sufragio universal en Hong Kong no puede aplicarse de la noche a la mañana. Como medida provisional, podemos pedir a la NPCSC que amplíe el número de miembros del Comité Electoral, haciendo más democráticas las elecciones sin moverse directamente al sufragio total."
 HKG_choose_your_own_puppet: "«Elige tu propio títere»"
 HKG_choose_your_own_puppet_desc: "Debe lograrse el sufragio universal en Hong Kong, pero no al costo de la estabilidad. El comité nominador se asegurará de que sólo aquellos que son verdaderamente «patrióticos hacia China y Hong Kong» puedan ser el Jefe Ejecutivo."
 HKG_a_new_reform_attempt: "Un nuevo intento de reforma"
 HKG_a_new_reform_attempt_desc: "Se pide una vez más al LegCo que considere la reforma electoral. ¿Pasará esta vez, o se repetirá la historia?"
 HKG_support_pan_democrats: "Apoyar a los Pandemócratas"
 HKG_support_pan_democrats_desc: "La democracia y la libertad ya están tejidas en el tejido de la vida de Hong Kong, y Deng Xiaoping prometió no interferir en sus asuntos internos. Debemos participar activamente en el movimiento democrático y defender las libertades que sustentan la prosperidad de Hong Kong."
 HKG_keep_to_one_country_two_systems: "Mantener a un país dos sistemas"
 HKG_keep_to_one_country_two_systems_desc: "«Un país, dos sistemas» está funcionando sin problemas. El continente utiliza Hong Kong como piedra angular de su política de apertura, mientras que Hong Kong se basa en la garantía de «años impares sin cambio» para preservar una forma de vida que lo distingue del resto de China. El arreglo sirve a ambos lados, y es claramente de interés mutuo mantenerlo intacto."
 HKG_hong_kong_post_2047_status: "Estado post-2047 de Hong Kong"
 HKG_hong_kong_post_2047_status_desc: "Deng Xiaoping prometió que el sistema político y económico de Hong Kong permanecería sin cambios durante cincuenta años, pero nadie puede decir cómo será la ciudad después del 2047. Ha llegado el momento de considerar su futuro."
 HKG_stick_to_CPC_line: "Adherirse a la línea CPC"
 HKG_stick_to_CPC_line_desc: "Hong Kong se adhiere silenciosamente a la línea preferida de Beijing sobre cuestiones impugnadas. Los pandemócratas estarán furiosos, el campo patriótico encantado."
 HKG_loyal_puppet: "«El títere leal»"
 HKG_loyal_puppet_desc: "Los pandemócratas han mostrado su mano, y las calles han mostrado su furia. Estabilidad y la prosperidad exigen que Hong Kong se comprometa, abiertamente y sin disculpas, al camino que Beijing ha trazado. La transición a una Región Administrativa Especial totalmente integrada no será popular, pero será definitiva."
 HKG_promote_patriotism: "Promover el patriotismo"
 HKG_promote_patriotism_desc: "Una generación levantada en libros de texto coloniales y sentimentalismo Cantopop no puede depender para defender la patria. La educación nacional de seguridad estará incrustada en todas las aulas, cada lugar de trabajo, cada emisora. La lealtad al Partido es lealtad a Hong Kong."
 HKG_patriots_governing: "Patriotas que gobiernan Hong Kong"
 HKG_patriots_governing_desc: "La administración pública ha respondido demasiado tiempo a los hábitos coloniales y las simpatías silenciosas. Los comités de veteranos barrerán la burocracia de oficiales de distrito a administradores superiores, reemplazando a los vaciladores por patriotas probados. La productividad sufrirá a corto plazo; la fiabilidad no lo hará."
 HKG_suppress_cantonese_local_culture: "Supresión Cantonés Cultura Local"
 HKG_suppress_cantonese_local_culture_desc: "Hong Kong es chino, y chino significa mandarín. La radiodifusión cantonesa se reducirá, los festivales de identidad local desembolsan silenciosamente y las voces disidentes en el sector cultural desplaudadas. El precio será descontento en las calles y resentimiento en el hogar, pero una cultura nacional unificada vale la pena el costo."
 HKG_reduce_size_of_LegCo: "Reducir el tamaño de la LegCo"
 HKG_reduce_size_of_LegCo_desc: "El Consejo Legislativo ha crecido con escaños de distrito que sólo sirven como plataformas para el teatro de la oposición. Una cámara simplificada, con asientos directamente reducidos y ampliados las circunscripciones funcionales, permitirá que el gobierno gobierne. El Plan de Talento de Mainland cubrirá las lagunas con administradores capacitados en Beijing y Shenzhen."
 HKG_gong_zyu_ou_integration: "Integración Hong Kong-Zhuhai-Macao"
 HKG_gong_zyu_ou_integration_desc: "«Un país, dos sistemas» siempre fue un acuerdo de transición. Con patriotas que gobiernan la RAE, el límite entre Hong Kong, Zhuhai y Macao se vuelve administrativo en lugar de significativo. La infraestructura transfronteriza, la regulación armonizada y las piscinas de talento compartido completan el Área de Gran Bahía como un único órgano económico, listo para su plena reintegración con la Patria."
 HKG_gong_zyu_ou_integration_tt: "Si Hong Kong es actualmente objeto de §Y[CHI.GetFlag]§!, el SAR se anexa y absorbe en el Área de la Bahía Mayor. De lo contrario, esto completa la alineación política lealista sin una transferencia inmediata de soberanía."
 HKG_support_democracy_in_china: "Apoyar la democracia en China"
 HKG_support_democracy_in_china_desc: "El movimiento pro democracia en Hong Kong apoyará abiertamente los esfuerzos de reforma en el continente. Un desafío directo a la autoridad de Beijing."
 HKG_commemorate_june_fourth: "Commemorate Cuarto de Junio"
 HKG_commemorate_june_fourth_desc: "La vigilia en el Parque Victoria se ha celebrado todos los años desde 1990, y cada año Beijing la ha visto con un descontento silencioso. Este año lo hacemos oficial: una conmemoración pública sancionada por el gobierno del SAR, con las velas, las canciones y los nombres de los muertos. El continente no se olvidará. Nosotros tampoco."
 HKG_inspire_chinese_grassroots_movements: "Inspirar los movimientos populares chinos"
 HKG_inspire_chinese_grassroots_movements_desc: "Hong Kong no puede salvar el continente solo, pero puede mostrar cómo es la democracia china en la práctica. Transmisiones abiertas al Delta del río Pearl, panfletos contrabandeados a través de los cruces fronterizos, y respaldo financiero silencioso para las redes samizdat - las semillas de cambio plantadas de la ciudad china más libre."
 HKG_call_on_CPC_to_release_dissidents: "Llame al CPC para liberar a los disidentes"
 HKG_call_on_CPC_to_release_dissidents_desc: "Los nombres son bien conocidos: Liu Xiaobo, Wang Bingzhang, Xu Wenli, docenas más. El gobierno de la SAR exige formal y públicamente su liberación. Beijing se negará, por supuesto - pero la demanda pone las prisiones del régimen en la agenda internacional."
 HKG_pro_democracy_media_charter: "Carta de medios pro-democracia"
 HKG_pro_democracy_media_charter_desc: "La libertad de prensa no es una consigna sino un régimen jurídico. La Carta codifica protecciones para periodistas, tipifica como delito la injerencia política en las decisiones editoriales y establece una emisora pública genuinamente independiente del ejecutivo. La idea de la prensa silenciada se vuelve a rodar."
 HKG_fund_civil_society: "Fondo de la Sociedad Civil"
 HKG_fund_civil_society_desc: "Becas públicas para ONG, asociaciones vecinales, clínicas de asistencia jurídica y promoción a favor de la democracia. El tesoro toma un golpe; el cuerpo político se fortalece. Una democracia sin sociedad civil es un foro sin público."
 HKG_legco_reform_petition: "Demanda de reforma del LegCo"
 HKG_legco_reform_petition_desc: "Una petición formal a Beijing para que el sufragio universal genuino en las elecciones del Consejo Legislativo. Elección directa de todos los escaños, abolición de las circunscripciones funcionales, comité nominador. La idea Lacks Universal Suffrage es sustituida por Limited Universal Suffrage como una primera concesión."
 HKG_accountability_for_tiananmen: "Rendición de cuentas para Tiananmen"
 HKG_accountability_for_tiananmen_desc: "Nombramos a los hombres que dieron las órdenes. Nombramos las unidades que los llevaron a cabo. Abremos los propios archivos de la SAR, apoyamos a los tribunales internacionales y amplificamos el testimonio de los sobrevivientes. Beijing tratará esto como una declaración de guerra contra el Partido. Los demócratas de Hong Kong escucharán un mensaje diferente."
 HKG_peaceful_democratic_path: "Sendero Democrático pacífico"
 HKG_peaceful_democratic_path_desc: "Reforma desde dentro, no confrontación desde fuera. Hong Kong consolida sus instituciones democráticas, estabiliza la sociedad civil y espera que el continente cambie en su propio plazo. Las velas todavía se queman en Victoria Park, pero las calles permanecen tranquilas. La siguiente fase de reforma comienza desde una posición de fuerza."
 HKG_appease_localists: "Appease Localists"
 HKG_appease_localists_desc: "Concesiones al movimiento localista: preservación del lenguaje cantonés, políticas de contratación local y desaceleración de los proyectos de integración transfronteriza."
 HKG_stoke_anti_mainland_sentiment: "El sentimiento de Stoke Anti-Mainland"
 HKG_stoke_anti_mainland_sentiment_desc: "China quitó todos los beneficios y dejó a las personas de Hong Kong con altos precios de propiedad y bajo poder adquisitivo. ¿Por qué Hong Kong debería permanecer con China y estar dispuesto a ser una pequeña colonia de China?"
 HKG_restrict_tourism_immigration: "Restrict Tourism & Inmigración"
 HKG_restrict_tourism_immigration_desc: "Nuevas gorras en turistas continentales y normas de inmigración transfronterizas más estrictas. Los locales apreciarán la sala de respiración; minoristas y desarrolladores, menos así."
 HKG_emphasize_hong_kong_identity: "Destacar la identidad de Hong Kong"
 HKG_emphasize_hong_kong_identity_desc: "El éxito de Singapur en Malasia fue debido a las exitosas reformas nacionales de conciencia de identidad del Sr. Lee Kuan Yew. Hong Kong es perfectamente capaz de adoptar el mismo enfoque."
 HKG_distance_from_china: "Distancia a China"
 HKG_distance_from_china_desc: "Hong Kong, es hora de pesar el ancla y romper libre del control de China."
 HKG_great_hong_kong_nation: "Gran nación de Hong Kong"
 HKG_great_hong_kong_nation_desc: "La entrega fue una traición. Las promesas de cincuenta años son mentiras. Hong Kong es una nación, no una provincia, y una nación requiere su propia bandera, sus propias fronteras, sus propias fuerzas armadas. Declararemos lo que nunca debería haber sido negociado."
 HKG_hong_kong_first: "Hong Kong primero"
 HKG_hong_kong_first_desc: "Desde los puertos de Aberdeen hasta las alturas de Mong Kok, Hong Kong pertenece a Hongkongers. Las inversiones continentales, el trabajo continental, la influencia continental estarán sujetas a la voluntad de la población local. La ciudadanía es patrimonio, no una conveniencia transferible."
 HKG_hong_kong_state_constitution: "Nueva Constitución del Estado de Hong Kong"
 HKG_hong_kong_state_constitution_desc: "La Ley Fundamental fue redactada en Beijing, firmada en Londres, e impuesta a un pueblo que no tenía voto en ninguna de las dos capitales. Una nueva constitución redactada en Central, por Hongkongers, para Hongkongers, la reemplaza. La transición es definitiva."
 HKG_armed_forces_of_hong_kong: "Fuerzas Armadas de Hong Kong"
 HKG_armed_forces_of_hong_kong_desc: "Una nación que no puede defenderse es ninguna nación en absoluto. La Fuerza de Defensa de Hong Kong, procedente de voluntarios y conscriptos por igual, tendrá la infantería sobre el terreno capaz de mantener los Nuevos Territorios y un guardacostas que pueden desafiar cualquier incursión. Las restricciones militares de la Ley Fundamental son cartas muertas."
 HKG_irredentist_claim_pearl_river: "Reclamar el Delta del Río Perla"
 HKG_irredentist_claim_pearl_river_desc: "El Delta del Río Perla - Shenzhen, Guangzhou, Zhuhai - fue Cantonés antes de que fuera comunista, y la gente allí compartir más con nosotros que con Beijing. Afirmamos nuestra afirmación abiertamente. Ya sea por negociación o por fuerza, el Delta se reunirá con su corazón cultural."
 HKG_little_bird_under_british_wing: "pajarito bajo el ala británica"
 HKG_little_bird_under_british_wing_desc: "El hecho de que Hong Kong haya sido separado de China no significa que pueda sobrevivir en el mundo por su cuenta. Necesitamos la ayuda de otros. ¿Qué hay de nuestros antiguos maestros británicos?"
 HKG_request_rerule_british_government: "Solicitud de que el Gobierno británico vuelva a gobernar"
 HKG_request_rerule_british_government_desc: "Una vez, las negociaciones sino-británicas nunca honraron los deseos del pueblo de Hong Kong por permanecer dentro del Imperio Británico. Esta vez seguiremos nuestros propios corazones."
 HKG_aukus_intelligence_share: "Compartiendo inteligencia AUKUS"
 HKG_aukus_intelligence_share_desc: "Los servicios de inteligencia británicos, estadounidenses y australianos han mantenido durante mucho tiempo un interés silencioso en Hong Kong. Cooperación tecnológica formalizada y señalización, bajo el paraguas de AUKUS, coloca la SAR firmemente dentro de la arquitectura de seguridad anglosfera."
 HKG_uk_garrison_rights: "Derechos de la guarnición británica"
 HKG_uk_garrison_rights_desc: "Un destacamento simbólico Royal Marine en Stonecutters, Royal Navy port-calls en Victoria Harbour, y un acuerdo de basing que permite a Gran Bretaña llegar al Mar del Sur de China desde una orilla amistosa. La guarnición es pequeña. La señal no lo es."
 HKG_commonwealth_realm_ambition: "Ambición del reino de la Commonwealth"
 HKG_commonwealth_realm_ambition_desc: "Canadá, Australia, Nueva Zelanda - todas una vez colonias, todos ahora reinos, todos todavía bajo la Corona. Hong Kong pide a los Jefes de Gobierno del Commonwealth que sean acogidos de nuevo, no como posesión sino como reino soberano que comparte un monarca. El insulto histórico de la entrega encuentra su larga respuesta."
 HKG_city_state_idea: "La Idea Ciudad-Estado"
 HKG_city_state_idea_desc: "Singapur demostró que podía hacerse. Una ciudad de mayoría china, rodeada de grandes poderes, puede sobrevivir y prosperar como un centro comercial soberano si elige neutralidad y competencia sobre la ideología. Hong Kong seguirá esa plantilla, pero mejor."
 HKG_revise_basic_law: "Revisión de la Ley Fundamental"
 HKG_revise_basic_law_desc: ", la Ley Fundamental fue redactada como documento de transición y Beijing es la autoridad definitiva implícita. Una carta revisada despoja esas cláusulas, afirma la plena soberanía y reescribe el marco del SAR como una república de leyes. La defensa y la política exterior pertenecen ahora a Hong Kong."
 HKG_pearl_of_east_asia: "La perla de Asia Oriental"
 HKG_pearl_of_east_asia_desc: "Libre de limitaciones continentales y enredamientos occidentales por igual, la ciudad se posiciona como el no avalado entretejido financiero y comercial de Asia oriental. El capital fluye a través de Central. El talento fluye a Wan Chai. Las perlas brillan Shangai y Singapur."
 HKG_global_financial_capital: "Capital financiero mundial"
 HKG_global_financial_capital_desc: "HKEX, una autoridad monetaria independiente y un régimen regulatorio diseñado para atraer capital que no puede confiar en Nueva York o Londres. Hong Kong se convierte en el centro financiero de gravedad para Asia-Pacífico - tranquila, rentable e irreemplazable."
 HKG_coastal_defence_doctrine: "Coast Defence Doctrine"
 HKG_coastal_defence_doctrine_desc: "Un estado-ciudad no puede permitirse una marina de agua azul, pero puede darse el lujo de hacer cualquier incursión costosa. Misiles anti-víos, enfoques minados, un puerto endurecido y una doctrina centrada en la negación en lugar de proyección. Hong Kong será un puerco, no un león."
 HKG_under_lion_rock_hill: "Debajo de la Roca León"
 HKG_under_lion_rock_hill_desc: "§CEn el mismo barco debajo de la roca nos esforzaremos como uno\n\nTodo igual bajo el Sol.\n\nCuando seamos libres y unidos\n\nPerseguir nuestros sueños de alegría\n\nJuntos, un alma, un corazón\n\nUna esperanza que ningún miedo pueda destruir.\n\nDonde termina el cielo y el mar\n\nÚnete a las manos y anda conmigo.\n\nPara vencer, y triunfar en nuestra lucha por escribir\n\nNuestra historia de casa, brillando.§!"
 HKG_race_discrimination_bill: "Proyecto de ley sobre la discriminación racial"
 HKG_race_discrimination_bill_desc: "La Ley Fundamental y la Ordenanza sobre la Carta de Derechos de Hong Kong protegen los derechos de las personas, incluido el derecho contra la discriminación racial. También tenemos la obligación, en virtud de la Convención Internacional sobre la Eliminación de todas las Formas de Discriminación Racial, de prohibir y eliminar la discriminación racial."
 HKG_LGBT_rights: "Derechos LGBT"
 HKG_LGBT_rights_desc: "La comunidad LGBT de Hong Kong ha esperado demasiado. El gobierno examinará las protecciones y reformas posibles dentro del marco jurídico actual."
 HKG_affirm_support_for_christian_organizations: "Apoyar a las organizaciones cristianas"
 HKG_affirm_support_for_christian_organizations_desc: "Las organizaciones cristianas han mantenido una influencia generalizada en la política social de Hong Kong. Se reafirmará y protegerá su función de asesoramiento."
 HKG_reduce_power_of_christian_groups: "Reducir el poder de los grupos cristianos"
 HKG_reduce_power_of_christian_groups_desc: "Se reducirá el papel consultivo de las organizaciones cristianas en la política social. Los procesos de consulta secular se expandirán para llenar la brecha."
 HKG_consult_public_on_new_law: "Consultar al público sobre una nueva ley"
 HKG_consult_public_on_new_law_desc: "Antes de legislar, el gobierno llevará a cabo amplias consultas públicas. El proceso tomará tiempo, pero el resultado llevará legitimidad democrática."
 HKG_outlaw_anti_LGBT_discrimination: "Ley contra la discriminación por motivos de género"
 HKG_outlaw_anti_LGBT_discrimination_desc: "La discriminación en el lugar de trabajo, la vivienda y la prestación de servicios contra las personas LGBT será ilegal. Espera una prolongada lucha legislativa."
 HKG_seek_reform_of_existing_legislation: "Solicitar la reforma de la legislación existente"
 HKG_seek_reform_of_existing_legislation_desc: "Se identificarán y reformarán cláusulas discriminatorias existentes en todo el derecho laboral, familiar y de arrendamiento."
 HKG_anti_discrimination_reform_package: "El Paquete de Reforma Antidiscriminatoria"
 HKG_anti_discrimination_reform_package_desc: "Una reforma integral contra la discriminación que abarca la raza, la religión, la orientación sexual, la identidad de género y la discapacidad."
 HKG_legalize_gay_marriage: "Legalizar el matrimonio gay"
 HKG_legalize_gay_marriage_desc: "Hong Kong se convierte en la primera jurisdicción de Asia oriental para legalizar plenamente el matrimonio entre personas del mismo sexo. Espera celebración en algunos círculos, feroz reacción en otros."
 HKG_gender_pay_gap: "La brecha salarial de género"
 HKG_gender_pay_gap_desc: "Presentación obligatoria de informes de pago para todos los principales empleadores. Nombrar y afeitarse logrará lo que el cumplimiento voluntario no tiene."
 HKG_require_greater_transparency_from_employers: "Exigir una mayor transparencia de los empleadores"
 HKG_require_greater_transparency_from_employers_desc: "Los empleadores por encima de un determinado recuento deberán publicar anualmente informes detallados sobre la desigualdad salarial."
 HKG_deny_existence_of_pay_gap: "Negar la Existencia de la Gapa de Pago"
 HKG_deny_existence_of_pay_gap_desc: "La posición oficial del gobierno: las diferencias salariales existentes reflejan la elección ocupacional, no la discriminación. No se necesitan más medidas."
 HKG_secondary_school_education_reform: "Reforma de la educación escolar secundaria"
 HKG_secondary_school_education_reform_desc: "La vieja estructura de educación secundaria 3-2-2-3 será reemplazada por el esquema 3-3-4 que ya se utiliza en los Estados Unidos y China continental. La reforma elimina el contenido superpuesto y obsoleto al tiempo que introduce una amplia gama de temas electivos."
 HKG_patriotic_education_curriculum_reform: "Reforma del Plan de Estudios Patrióticos"
 HKG_patriotic_education_curriculum_reform_desc: "La educación patrótica no tiene lugar en el actual plan de estudios de Hong Kong. Vamos a introducir Estudios Liberales para llenar esa brecha."
 HKG_chinese_based_education_curriculum: "Currículum sobre educación de base china"
 HKG_chinese_based_education_curriculum_desc: "Somos chinos primero y Hongkongers segundo. Cada escuela de Hong Kong enseñará en chino, y se espera que cada niño hable."
 HKG_hong_kong_police_force: "Fuerza de Policía de Hong Kong"
 HKG_hong_kong_police_force_desc: "La Fuerza de Policía de Hong Kong se estableció el 1o de mayo de 1844, y es la fuerza disciplinada más grande dentro del gobierno de Hong Kong. Debido a las restricciones al movimiento del Ejército Popular de Liberación estacionado en Hong Kong, las funciones típicamente desempeñadas por los militares en otros países son manejadas por la fuerza policial en Hong Kong. Durante mucho tiempo, la Policía de Hong Kong ha sido aclamada como «la mejor en Asia»."
 HKG_anti_terrorist_train: "Capacitación antiterrorista"
 HKG_anti_terrorist_train_desc: "El nuevo milenio ha traído prosperidad y oportunidad, pero también nuevas amenazas. El terrorismo no debe tomar raíces en Hong Kong."
 HKG_purchase_chinese_weapons: "Compra de armas chinas"
 HKG_purchase_chinese_weapons_desc: "Reemplazando pistolas de la era británica Smith y Wesson con alternativas suministradas por Norinco. El costo es bajo, el simbolismo considerable."
 HKG_create_CTRU: "Crear la Dependencia de Respuesta contra el Terrorismo"
 HKG_create_CTRU_desc: "La Dependencia de Respuesta contra el Terrorismo, conocida como la CTRU, es una fuerza de reacción rápida establecida para responder a los incidentes terroristas. Sus oficiales serán los mejores que la fuerza pueda producir."
 HKG_police_system_reform: "Reforma del sistema de policía"
 HKG_police_system_reform_desc: "Modernización de los mecanismos de capacitación, estructura de comandos y rendición de cuentas del HKPF."
 HKG_investigate_police_triad_cooperation_problem: "Investigar la cuestión de la cooperación entre la policía y el fiscal"
 HKG_investigate_police_triad_cooperation_problem_desc: "Plantamos agentes encubiertos en las Triadas, pero nos hacen lo mismo. Estos lunares están comprometiendo nuestras operaciones antes de empezar. Trabajando a través de la ICAC y la OCTB, arrancaremos estos «Hak Ging»."
 HKG_anti_protest_train: "Extensiva formación de Riot"
 HKG_anti_protest_train_desc: "Formación especializada para escenarios de gestión de multitudes, desde reuniones pacíficas hasta disturbios violentos."
 HKG_purchase_anti_riot_armour: "Adquirir equipo de Riot"
 HKG_purchase_anti_riot_armour_desc: "Nuevo equipo balístico y resistente al impacto para la Unidad Táctica de Policía."
 HKG_purchase_non_lethal_weapons: "Compra de armas no letales"
 HKG_purchase_non_lethal_weapons_desc: "lanzadores de tear-gas, balas de goma y armas de bola de pimienta, el moderno kit de herramientas de control de multitudes."
 HKG_form_elite_team: "Forma el Equipo Elite"
 HKG_form_elite_team_desc: "Una unidad dedicada a la lucha contra el terrorismo, modelada en equipos tácticos de ultramar."
 HKG_gong_hei_fat_coi: "Gong Hei Faat Choy"
 HKG_gong_hei_fat_coi_desc: "El [HKG.GetFlag]Hong Kong que acaba de hacer frente a una crisis financiera y entró en el nuevo milenio no enfrenta escasez de problemas económicos y sociales. Cómo se resuelven es una pregunta para que la gente responda."
 HKG_typhoon_shelter_from_financial_storm: "Shelter de la tormenta financiera"
 HKG_typhoon_shelter_from_financial_storm_desc: "La tormenta ha pasado. Es hora de limpiar el desastre. El gobierno desplegará reservas de divisas y una intervención específica para estimular la economía."
 HKG_merge_into_HKEX: "Combina HKCE y HKFE en HKEX"
 HKG_merge_into_HKEX_desc: "A raíz de la crisis financiera de 1997, el Hong Kong Commodity Exchange (HKCE) y el Hong Kong Futures Exchange (HKFE) se fusionarán en el nuevo Hong Kong Exchanges and Clearing Limited (HKEX), agudizando la ventaja competitiva de la ciudad en un mercado cada vez más globalizado."
 HKG_greatest_entrepot: "El mejor Port Merchant en Asia Oriental"
 HKG_greatest_entrepot_desc: "Hong Kong ha sido desde hace mucho tiempo el principal entrepot de Asia. Ampliar la capacidad del puerto y la eficiencia de carga mantendrá el título."
 HKG_expand_Kwai_Tsing_terminals: "Ampliar los terminales de Tsing Kwai"
 HKG_expand_Kwai_Tsing_terminals_desc: "Nueva capacidad de manipulación de contenedores en Kwai Tsing. Naves más grandes, vuelta más rápido, más carga a través de Hong Kong."
 HKG_attract_foreign_investment: "Atraer inversión extranjera"
 HKG_attract_foreign_investment_desc: "Un paquete de incentivos fiscales, racionalización regulatoria y servicios dedicados de enlace con inversores para sacar capital del extranjero."
 HKG_european_business: "El negocio europeo"
 HKG_european_business_desc: "Divulgación dirigida a cámaras de comercio europeas. Hong Kong como puerta de entrada regional para las empresas europeas que entran en Asia."
 HKG_chinese_entrepreneurs: "Los empresarios continentales"
 HKG_chinese_entrepreneurs_desc: "El capital chino continental es el futuro de la economía de Hong Kong. El gobierno profundizará los vínculos con el establecimiento empresarial de Beijing."
 HKG_develop_solar_power: "Invertir en energía solar"
 HKG_develop_solar_power_desc: "Distribuye instalaciones fotovoltaicas a través de techos y embalses. Un comienzo modesto, pero un comienzo."
 HKG_T_PARK: "Instalación T·PARK"
 HKG_T_PARK_desc: "La instalación de tratamiento de lodos T-PARK en Tuen Mun convierte los residuos en energía y demuestra la ambición ambiental de Hong Kong."
 HKG_indonesian_gas: "Gas de Yakarta"
 HKG_indonesian_gas_desc: "Un acuerdo de suministro de gas natural licuado a largo plazo con Indonesia, asegurando las necesidades energéticas de Hong Kong durante décadas por venir."
 HKG_australian_oil: "Petróleo de Sydney"
 HKG_australian_oil_desc: "Una asociación de importación con productores de crudo australianos, diversificando la dependencia hidrocarburos de Hong Kong lejos de un único proveedor."
 HKG_new_development_idea: "Nuevo Plan de Desarrollo"
 HKG_new_development_idea_desc: "La Nueva Iniciativa para el Desarrollo agrupa proyectos de infraestructura, vivienda y zona industrial bajo una sola bandera coordinada."
 HKG_invest_hong_kong: "Invertir en Hong Kong"
 HKG_invest_hong_kong_desc: "InvestHK es reestructurado y refinanciado como la principal agencia de promoción de inversiones de la ciudad."
 HKG_hong_kong_science_parks: "Parques de Ciencias"
 HKG_hong_kong_science_parks_desc: "Zonas dedicadas en Sha Tin y Tseung Kwan O para la biotecnología, AI y fabricación avanzada R&D, con espacio de oficina subvencionado para startups."
 HKG_invite_talent_to_hong_kong: "Invitar talento a Hong Kong"
 HKG_invite_talent_to_hong_kong_desc: "Un plan de visado acelerado para profesionales extranjeros altamente cualificados, con servicios en inglés e incentivos fiscales para facilitar la transición."
 HKG_hong_kong_cyberport: "El Cyberport"
 HKG_hong_kong_cyberport_desc: "El mandato de Cyberport se renueva y expande como un grupo empresarial digital que apunta a fintech, comercio electrónico y medios digitales."
 HKG_tech_incubation_programme: "Programa de Incubación Técnica"
 HKG_tech_incubation_programme_desc: "Incubadoras financiadas por el Gobierno con capital de semillas, mentoría e infraestructura compartida para las startups tecnológicas en etapas tempranas."
 HKG_favor_traditional_values: "Gire a la Tradición"
 HKG_favor_traditional_values_desc: "El gobierno se alineará públicamente con los valores familiares tradicionales, restringiendo el activismo LGBT en la educación y la vida pública."
 HKG_undercover_oppression: "Opresión encubierta"
 HKG_undercover_oppression_desc: "Un enfoque más tranquilo: vigilancia, presión del empleador y desaliento no oficial en lugar de abrir legislación contra grupos minoritarios."
 HKG_legislate_to_ban_LGBT: "Prohibición del colectivo LGBT"
 HKG_legislate_to_ban_LGBT_desc: "Legislación abierta que penaliza las expresiones públicas de identidad LGBT. La comunidad internacional reaccionará agudamente."
 HKG_regulate_sale_of_residential_buildings: "Venta regulada de edificios residenciales"
 HKG_regulate_sale_of_residential_buildings_desc: "Un marco modesto de normas de divulgación, límites hipotecarios e impuestos contra la especulación. El plan Suen permanece en su lugar, pero los peores excesos del mercado no regulado obtienen un cheque."
 HKG_land_reclamation: "Reclamación de tierras"
 HKG_land_reclamation_desc: "Hong Kong sólo tiene tanta tierra. El Departamento de Ingeniería Civil elabora un nuevo programa de recuperación frente a Lantau, la costa de los Nuevos Territorios y el puerto de Kowloon. El costo es enorme y los ambientalistas están furiosos; las nuevas ranuras de edificio valen la pena."
 HKG_lock_housing_price: "Congelar los precios de vivienda"
 HKG_lock_housing_price_desc: "El gobierno legisla un techo duro en los precios de la propiedad residencial, indexado a ingresos medios. Los terratenientes son apopleticos; los inquilinos y los sindicatos celebran. El mercado se vuelve predecible y estancado."
 HKG_expand_home_ownership_scheme: "Ampliar el plan de propiedad en el hogar"
 HKG_expand_home_ownership_scheme_desc: "El Plan de Propiedad Interior se amplía: más pisos, umbrales inferiores, procesamiento más rápido. Un Hongkonger de clase obrera finalmente puede aspirar a la propiedad. La tesorería lleva la subvención; la paz social es el dividendo."
 HKG_let_government_hold_companies: "Empresas de propiedad del Gobierno"
 HKG_let_government_hold_companies_desc: "Las mayores empresas de desarrollo inmobiliario - Sun Hung Kai, Cheung Kong, Henderson - son parcialmente nacionalizadas. Los magnates protestan en voz alta; el gobierno sostiene la equidad. Los precios de la propiedad están bajo control político directo."
 HKG_maintain_public_housing_construction: "Construcción de viviendas públicas"
 HKG_maintain_public_housing_construction_desc: "El oleoducto de construcción de la Autoridad de Vivienda se conserva y expande. Las propiedades públicas se elevan en los Nuevos Territorios. La inversión en infraestructura muestra la estabilidad y una población tranquilamente más contenta."
 HKG_my_home_purchase_scheme: "Plan de compra casero"
 HKG_my_home_purchase_scheme_desc: "El plan de compra Mi casa de Donald Tsang se implementa como diseñado: unidades de alquiler a propiedad para la clase sándwich, los Hongkongers que ganan demasiado para viviendas públicas pero no pueden permitirse el mercado privado. Una respuesta tangible a la crisis de asequibilidad."
 HKG_subsidised_sale_flats_project: "Proyecto de Planos Subvencionados"
 HKG_subsidised_sale_flats_project_desc: "Pisos de venta subvencionados por el Gobierno, vendidos por debajo de la tasa de mercado a compradores de primera vez. La Autoridad de Vivienda se convierte, en efecto, en el mayor desarrollador del SAR."
 HKG_green_form_subsidised_home_ownership_scheme: "Plan de propiedad Green-Form"
 HKG_green_form_subsidised_home_ownership_scheme_desc: "The capstone of housing reform: Green Form holders - existing public housing inants - get preferential access to subsidised ownership. La cadena de movilidad ascendente, rota durante dos décadas, es finalmente reconstruida. La crisis de la vivienda de Hong Kong termina."
 HKG_public_housing_problem: "Problema de vivienda pública"
 HKG_public_housing_problem_desc: "La crisis de la vivienda de Hong Kong es el fracaso más visible del gobierno post-redoctor. Los precios medios de vivienda superan los ingresos medios por orden de magnitud; viviendas subdivididas y jaulas albergan decenas de miles; la lista de espera para viviendas públicas se extiende durante seis años. La presión política para hacer algo - cualquier cosa - es abrumadora."
 HKG_sun_housing_policy: "Nueve Política de Reforma de Viviendas Sun"
 HKG_sun_housing_policy_desc: "El programa de nueve puntos del Secretario de Vivienda Michael Suen. Restringir la oferta, detener la construcción pública, dejar que el mercado se recupere. Los terratenientes y los conglomerados aprueban. Los sindicatos y arrendatarios laborales no lo hacen. La historia juzgará duramente la política, pero asegura el mercado inmobiliario a corto plazo."
 HKG_end_tenants_purchase_scheme: "Fin del plan de compra de arrendatarios"
 HKG_end_tenants_purchase_scheme_desc: "Los arrendatarios de viviendas públicas ya no podrán comprar sus pisos a precios reducidos. El tesorería mantiene el activo; los inquilinos permanecen inquilinos. Una pequeña ganancia de ingresos a un costo social real."
 HKG_suspend_home_ownership_scheme: "Suspendiendo del Plan de Propiedad Interior"
 HKG_suspend_home_ownership_scheme_desc: "El Plan de Propiedad Interior se suspende indefinidamente. El oleoducto de pisos subvencionados de venta se seca, el mercado privado es liberado de la competencia pública, y los magnates de propiedades tienen una preocupación menor."
 HKG_curtail_land_supply: "Reducir el suministro de tierras"
 HKG_curtail_land_supply_desc: "El Departamento de Tierras mantiene su inventario fuera del mercado. Los precios se estabilizan a altos niveles, el mercado inmobiliario se consolida y la crisis de vivienda se convierte en una característica permanente de la vida de Hong Kong."
 HKG_legco_decision_categories: "§1LegCo§!"
 legco_current_motion_clock: "Moción actual: §Y[ROOT.legco_current_motion]§!"
 legco_current_special_motion_clock: "Moción actual: §Y[ROOT.legco_current_motion]§!"
 legco_increase_administration_motion_clock: "Moción actual: §YAumento £political_power_texticon gasto burocrático§!"
 legco_decrease_administration_motion_clock: "Moción actual: §YDisminuir £political_power_texticon gasto burocrático§!"
 legco_increase_policing_motion_clock: "Moción actual: §YAumento £foreign_influence_defense_modifier_texticon §CSeguridad§! Financiamiento§!"
 legco_decrease_policing_motion_clock: "Moción actual: §YDisminución £foreign_influence_defense_modifier_texticon §CSeguridad§! Financiamiento§!"
 legco_increase_education_motion_clock: "Moción actual: §YAumento £research_speed_texticon §GEducación§! Presupuesto§!"
 legco_decrease_education_motion_clock: "Moción actual: §YDisminución £research_speed_texticon §GEducación§! Presupuesto§!"
 legco_increase_health_motion_clock: "Moción actual: §YAumento £population_texticon §R Cuidado de la salud§! Financiamiento§!"
 legco_decrease_health_motion_clock: "Moción actual: §YDisminución £population_texticon §R Cuidado de la salud§! Financiamiento§!"
 legco_increase_social_motion_clock: "Moción actual: §YAumento £consumer_goods_texticon §nPensión§! Gasto§!"
 legco_decrease_social_motion_clock: "Moción actual: §YDisminución £consumer_goods_texticon §nPensión§! Gasto§!"
 HKG_unrestricted_housing_market: "Mercado de viviendas sin restricciones"
 HKG_unrestricted_housing_market_desc: "El mercado de la vivienda libre de Hong Kong está entre los más dinámicos del mundo y los más castigados, inasequibles. Sin intervención, la brecha entre los ingresos y los precios seguirá aumentando."
 HKG_victoria_harbour: "Victoria Harbour"
 HKG_victoria_harbour_desc: "Victoria Harbour es el corazón histórico de la economía portuaria de Hong Kong: tráfico de contenedores, ferries y terminales de crucero convergen aquí."
 HKG_victoria_harbour_expand_desc: "Un puerto Victoria ampliado con nuevas amarras de contenedores, canales profundizados y manipulación de carga modernizada."
 HKG_victoria_harbour_expand_plus_desc: "Victoria Harbour a plena capacidad moderna: terminales automatizadas, amarres de aguas profundas y el mayor rendimiento de carga en la región."
 legacy_of_handover_hong_kong: "Legado de Handover Hong Kong"
 legacy_of_handover_hong_kong_desc: "La entrega de 1997 creó vínculos institucionales, económicos y culturales entre Hong Kong y el continente que siguen formando décadas después políticas."
 Basic_Law_HKG: "§8La Ley Fundamental de §H[HKG.GetFlag]Hong Kong SAR§!§!"
 Basic_Law_milltary_HKG: "La Ley Fundamental de [HKG.GetFlag]Hong Kong SAR"
 Basic_Law_milltary_HKG_desc: "En virtud de la Ley Fundamental, la defensa está reservada al gobierno central. Hong Kong no mantiene fuerzas armadas independientes; el PLA Hong Kong Garrison cumple cualquier función de defensa externa."
 Basic_Law_HKG_desc: "La Ley Fundamental fue el documento fundador de la Región Administrativa Especial de Hong Kong después del traspaso de Hong Kong del Reino Unido a la República Popular China. Entre otras cosas, el documento describe la situación de Hong Kong en relación con China, le concedió autonomía en todos los asuntos que no sean defensa y asuntos exteriores, ambos confiados al gobierno central.\n\n§W----------\nComo un §Y[HKG.GetFlag]§!§HS.A.R§!, no tiene su propia fuerza de defensa, el nivel requerido del presupuesto de defensa se mantendrá en §H0§!, y tampoco permitiría cambiar §G gasto militar.§!§!"
 One_Country_Two_Systems: "Un país de dos sistemas"
 One_Country_Two_Systems_desc: "§Y[HKG.GetFlag]Hong Kong§! y §Y[MAC.GetFlag]Macau§! han sido garantizados 50 años de autonomía de dominio chino directo. El modelo de un país dos sistemas permite la preservación y el crecimiento de muchas de las riquezas políticas de Hong Kong y Macao, como la libertad de expresión y la libertad de reunión pública. La ausencia de estos derechos en el continente es un importante impulsor detrás del apoyo al campo «pan-demócrata» en la política de Hong Kong, y muchos Hongkongers preocupados siguen siendo cuidadosos de una mayor integración con China continental."
 Localist_Movement: "Movimiento Localista"
 Localist_Movement_desc: "Desde la entrega en 1997, las tensiones entre los chinos y Hongkongers continentales han llevado al desarrollo del sentimiento localista «Hong Kong First» entre algunos hongos locales. Este sentimiento ve el sistema político de China comunista con desconfianza, pero también considera al pueblo de Hong Kong como culturalmente distinto y de hecho superior en comparación con el pueblo de China. El ascenso de este movimiento desde el Movimiento Umbrella 2014 en adelante ha cambiado el tono previamente más medido de la brecha política de Hong Kong en uno que es más emotivo y radical."
 Lacks_Universal_Suffrage: "Carencias de Sufragio Universal"
 Lacks_Universal_Suffrage_desc: "Si bien la Ley Fundamental pide que el Consejo Ejecutivo y Legislativo sea elegido eventualmente por sufragio universal, esto todavía no ha pasado, principalmente debido a las preocupaciones del gobierno chino acerca de lo que puede suceder si los pandemócratas considerablemente más populares toman el control del gobierno de Hong Kong."
 Limited_Universal_Suffrage: "Sufragio universal limitado"
 Limited_Universal_Suffrage_desc: "El Gobierno chino ha convenido en permitir que el Jefe Ejecutivo de Hong Kong sea elegido por sufragio universal, a condición de que los candidatos sean examinados primero por Beijing. Esto se ve ampliamente como una medida para reducir la probabilidad de que los candidatos pandemócratas o localistas se conviertan en jefes ejecutivos."
 Universal_Suffrage: "Sufragio universal"
 Universal_Suffrage_desc: "El Gobierno chino finalmente ha acordado permitir que Hong Kong elija a su Jefe Ejecutivo por sufragio universal sin interferencia de las autoridades continentales."
 Hong_Kong_Protests: "Hong Kong protesta"
 Hong_Kong_Protests_desc: "Tras las recientes acciones del gobierno chino, se han producido protestas generalizadas en Hong Kong exigiendo una inversión de la acción china."
 asian_crisis_HKG_desc: "La crisis económica que acarreó el desarrollo de Asia oriental y sudoriental tiró décadas de crecimiento por el drenaje. La pérdida de confianza en las monedas nacionales sigue plagando a los bancos centrales hasta hoy. La deuda pública y privada también ha aumentado.\n\nSe aprendieron lecciones dolorosas, y las reformas económicas no deseadas están en plena marcha. Cada país fue alcanzado de manera diferente y cada uno tiene sus propias soluciones.\n\nLa afluencia de inversiones a los países afectados fue una vez la mitad de la suma total del mundo, pero ahora fluye hacia [CHI.GetFlag] China y otros lugares."
 asian_crisis_league_HKG: "La crisis económica que acarreó el desarrollo de Asia oriental y sudoriental tiró décadas de crecimiento por el drenaje. La pérdida de confianza en las monedas nacionales sigue plagando a los bancos centrales hasta hoy. La deuda pública y privada también ha aumentado.\n\nSe aprendieron lecciones dolorosas, y las reformas económicas no deseadas están en plena marcha. Cada país fue alcanzado de manera diferente y cada uno tiene sus propias soluciones.\n\nLa afluencia de inversiones a los países afectados fue una vez la mitad de la suma total del mundo, pero ahora fluye hacia [CHI.GetFlag] China y otros lugares."
 HKG_HKEX: "Hong Kong intercambios y despejar limitado"
 HKG_improve_trade: "Atraer inversión extranjera"
 HKG_improve_trade_desc: "Un impulso coordinado para profundizar las relaciones comerciales de Hong Kong en Asia y más allá: nuevos acuerdos, costumbres simplificadas y secciones comerciales activas de embajada."
 HKG_idea_T_PARK: "§5T-PARK§!"
 HKG_idea_T_PARK_desc: "La instalación T-PARK procesa los lodos de aguas residuales de Hong Kong mientras genera electricidad, sirve como infraestructura de gestión de residuos y un escaparate ambiental."
 HKG_new_develop_idea_dynamic_modifier: "Idea para el Desarrollo"
 HKG_new_develop_idea_dynamic_modifier_desc: "Los efectos de la Nueva Iniciativa para el Desarrollo en la base económica e infraestructura de Hong Kong."
 HKG_idea_secondary_education_reform: "Reforma de la educación secundaria"
 HKG_idea_secondary_education_reform_desc: "La vieja estructura de educación secundaria 3-2-2-3 es sustituida por el esquema 3-3-4 que ya se utiliza en los Estados Unidos y China continental. Se eliminan los contenidos superpuestos y obsoletos y se introduce una amplia gama de temas electivos."
 HKG_idea_patriotic_education_reform: "Reforma de la Educación Patriótica"
 HKG_idea_patriotic_education_reform_desc: "La educación patrótica no tiene lugar en el actual plan de estudios de Hong Kong. Se han introducido estudios liberales para llenar esa brecha."
 HKG_idea_chinese_based_education_reform: "Reforma de la educación basada en China"
 HKG_idea_chinese_based_education_reform_desc: "Cada escuela de Hong Kong ahora enseña en chino. Se espera que todos los niños hablen."
 HKG_rise_of_internet: "El Rise de Internet"
 HKG_rise_of_internet_desc: "Internet ha abierto una nueva dirección para el desarrollo humano. Queda por ver si demuestra un destello en la sartén o la tendencia económica dominante de las próximas décadas."
 HKG_idea_SARS_outbreak: "Impacto del SARS"
 HKG_idea_SARS_outbreak_desc: "El brote del SARS ha golpeado duramente la economía de Hong Kong y la confianza pública, perturbando el turismo, el comercio minorista y la vida cotidiana en toda la ciudad."
 HKG_idea_railway_development_strategy_2000: "Estrategia de desarrollo ferroviario 2000"
 HKG_idea_railway_development_strategy_2000_desc: "La Estrategia de Desarrollo Ferroviario 2000 es el plan rector para la expansión del MTR en la próxima década."
 HKG_patriotic_loyalist_drive: "Accionamiento Patriótico Loyalista"
 HKG_patriotic_loyalist_drive_desc: "La educación nacional de seguridad satura escuelas, emisoras y servicio público. El resultado es una institución pública más dócil y más fuerte del Partido, a costa de apertura intelectual y producción de investigación."
 HKG_loyalist_civil_service_purge: "Purge de la administración pública loyalista"
 HKG_loyalist_civil_service_purge_desc: "Los Comités de Vetting combinan la administración pública para agitadores y disentros silenciosos. La administración del día a día sufre mientras la purga corre su curso, pero la burocracia que emerge responderá a un maestro."
 HKG_mainland_talent_scheme: "Esquema de talentos continental"
 HKG_mainland_talent_scheme_desc: "Las filas administrativas abandonadas de Hong Kong están llenas por profesionales del continente. Los resultados de la investigación se recuperan y las oficinas funcionan eficientemente, pero una disminución de la fuerza laboral nativa significa que el poder político es más difícil de movilizar localmente."
 HKG_gba_integration_idea: "Mayor integración en el área de la bahía"
 HKG_gba_integration_idea_desc: "Hong Kong, Macao, Shenzhen y Zhuhai ahora operan como una economía funcional. La producción industrial y el comercio prosperan, y la línea entre SAR y los desdibujos continentales por diseño."
 HKG_great_hong_kong_nation_idea: "Gran nación de Hong Kong"
 HKG_great_hong_kong_nation_idea_desc: "Hong Kong ha declarado su soberanía en desafío a Beijing. El estado de ánimo es marcial: la moral es alta, la conscripción es amplia, y una generación que creció viendo las grietas del paraguas está lista para defender la independencia por la que lucharon. Las relaciones con el continente se estancan."
 HKG_city_state_doctrine: "Doctrina de Ciudad-Estado"
 HKG_city_state_doctrine_desc: "Hong Kong sigue el modelo de Singapur: pequeño, neutral, próspero, tecnocrático. La economía se humea en el comercio y las finanzas, el puerto es la sangre vital del estado, y la ambición militar está firmemente subordinada al pragmatismo comercial."
 HKG_under_british_wing_idea: "Bajo el ala británica"
 HKG_under_british_wing_idea_desc: "Hong Kong ha formalizado su seguridad y alineación política con el Reino Unido y el Commonwealth en general. El acceso voluntario de las fuerzas armadas anglosferas, la concesión de licencias tecnológicas en condiciones preferenciales y una postura diplomática clara: Londres, no Beijing, es el socio principal."
 HKG_pro_democracy_media: "Carta de medios pro-democracia"
 HKG_pro_democracy_media_desc: "Apple Daily, Stand News, RTHK y docenas de puntos más pequeños operan bajo protección legal explícita contra la interferencia política. Las redes de desinformación continental luchan por ganar tracción, y el discurso público se inclina inequívocamente hacia las normas democráticas."
 HKG_civil_society_funding: "Financiación de la sociedad civil"
 HKG_civil_society_funding_desc: "Las organizaciones no gubernamentales, las asociaciones vecinales y los grupos de promoción a favor de la democracia reciben financiación pública transparente. El resultado es una cultura cívica más comprometida y un campo democrático silenciosamente más fuerte, pagado a través de los cofres públicos."
 Basic_Law_HKG_idea_tt: "Esta idea será cancelada después de §H[HKG.GetFlag]Hong Kong§! declara su §Rindependencia.§!"
