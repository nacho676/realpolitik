 hongkong.8.t: "El Año Dragón"
 hongkong.8.d: "Han pasado tres años desde la reunificación con el continente. Hong Kong ha experimentado la crisis financiera asiática sin el declive que Occidente predijo. Al amanecer del nuevo milenio, la ciudad seguirá demostrando que la integración con China no es algo malo."
 hongkong.8.a: "San Nin Faa Lok! (Feliz Año Nuevo!)"
 hongkong.9.t: "Hong Kong busca nuestro Hardware"
 hongkong.9.d: "La Fuerza de Policía de Hong Kong ha puesto una orden para las armas pequeñas manufacturadas por China. El volumen es modesto, pero el simbolismo es grande: esta es la primera adquisición formal de seguridad HKG de un proveedor continental. Los medios estatales ya están enmarcando el acuerdo como un signo de la creciente confianza del SAR en la industria de la madre patria."
 hongkong.9.a: "Aprobar a precios favorables"
 hongkong.9.b: "Utilice el momento para la propaganda estatal"
 hongkong.13.t: "Beijing Responds"
 hongkong.13.d: "Un mes después del llamamiento de la LegCo para la liberación de disidentes continentales, la Oficina de Enlace emite una fuerte reprensión. Los medios de comunicación acusan a los políticos de Hong Kong de «interferir en los asuntos internos de la República Popular». Un puñado de detenidos de bajo perfil son liberados silenciosamente; muchos más permanecen tras las rejas. El campo pandemócrata es furioso, el campo patriótico triunfante."
 hongkong.13.a: "Bienvenido a las versiones parciales"
 hongkong.13.b: "Condemn Beijing's rebuke"
 hongkong.13.c: "Suelta el asunto en silencio"
 HKG_aukus_request_tt: "§Y[ROOT.GetNameDef]§! Lo haré. §Ysolicitud§! acceso al intercambio de información §H[ENG.GetName]§!, §H[USA.GetName]§! y §H[AST.GetName]§!Pueden declinar."
 HKG_uk_garrison_request_tt: "§H[ENG.GetName]§! será invitado a las fuerzas de estación en Hong Kong. Pueden declinar."
 hongkong.14.t: "La cuestión de Hong Kong"
 hongkong.14.d: "Dos millones en las calles de Hong Kong. El movimiento antiextradición ha sacudido el orden político de la SAR a su núcleo. Los funcionarios pro-Beijing exigen una acción más firme; los pragmatistas en el Consejo de Estado advierten que la extensión va a asustar al capital extranjero. El Comité Permanente de Politburo decidirá cómo responder."
 hongkong.14.a: "Apriete nuestro agarre: estado formal de títeres"
 hongkong.14.b: "Mostrar moderación: preservar el marco"
 hongkong.15.t: "Hong Kong busca acceso AUKUS"
 hongkong.15.d: "El gobierno pro-occidental de Hong Kong ha solicitado formalmente el intercambio de inteligencia y el acceso a base de datos. El valor estratégico de un puerto amistoso en el borde sur de China es sustancial, pero Beijing lo verá como un acto hostil, y las implicaciones de seguridad recortan ambas maneras. La cuestión se dirige al Consejo de Seguridad Nacional."
 hongkong.15.a: "Acceso de subvenciones: Hong Kong es un activo estratégico"
 hongkong.15.b: "Decline: mantener a Beijing en la longitud del brazo"
 hongkong.16.t: "Hong Kong Invita a una guarnición británica"
 hongkong.16.d: "El Gobierno de Hong Kong ha invitado oficialmente al Reino Unido a restablecer una guarnición militar permanente en la RAE. El simbolismo sería extraordinario; la caída diplomática con Beijing, severa. Las breves tierras del Secretario de Defensa sobre la mesa del Gabinete."
 hongkong.16.a: "Aceptar: restaurar la presencia británica"
 hongkong.16.b: "Diferencia: el costo diplomático es demasiado alto"
 hongkong.10.t: "La cuestión del sufragio universal"
 hongkong.10.d: "En virtud de la Ley Fundamental, los dos primeros jefes ejecutivos y los tres primeros consejos legislativos fueron devueltos por el Comité Electoral en lugar del sufragio universal. Las elecciones presidenciales de 2007 y las elecciones legislativas de 2008 presentan una oportunidad para decidir si el sistema democrático de Hong Kong debe reformarse, con sufragio universal completo como objetivo final."
 hongkong.10.a: "El sistema electoral de Hong Kong mantendrá el status quo."
 hongkong.10.b: "No estamos a favor del sufragio universal inmediato, pero apoyaremos la reforma electoral gradual y ordenada."
 hongkong.10.c: "¡Podría ser radical y permitir el sufragio universal!"
 hongkong.11.t: "El PCCW se fusiona con el HKT"
 hongkong.11.d: "Cable & Wireless anunció planes para vender Hong Kong Telecom a SingTel, a pesar de las objeciones del gobierno chino. PCCW, controlado por Li Tzar-kai, hijo de Li Ka-shing, entró en la licitación y finalmente prevaleció. Tras el anuncio de fusión, el precio compartido de PCCW aumentó de unos pocos centavos a HKD 28.50 por la clausura del comercio ese día, empujando brevemente su capitalización de mercado por encima de los 250 mil millones de HKD."
 hongkong.11.a: "¡El Internet es una cosa genial!"
 hongkong.12.t: "El impacto de la burbuja Dot-com Burst"
 hongkong.12.d: "A medida que estalló la burbuja de punto-com, el precio compartido de PCCW colapsó en un 98%, apenas meses después de que la fusión de Hong Kong Telecom lo hubiera enviado a soaring. La empresa quedó con una importante equidad negativa y tenía pocas opciones, pero planear la venta de su negocio central para aliviar sus dificultades financieras."
 hongkong.12.a: "Nuevo milenio, nuevos problemas."
 hongkong_legco.1.t: "Los Asientos de [GetYear] LegCo"
 hongkong_legco.1.d: "El Consejo Legislativo se reúne para el nuevo mandato. Los asientos de circunscripción geográfica y funcional han sido altos y las mayorías de trabajo de la cámara son ahora conocidas. Los votos de moción requerirán [?HKG_legco_required_seats] escaños por aprobar; las mociones constitucionales exigirán [?HKG_legco_specially_required_seats]."
 hongkong_legco.1.a: "Lo tengo."
 hongkong_news.4.t: "123 La Alianza Democrática está disuelta hoy."
 hongkong_news.4.d: "Establecida en 1994 por un grupo de políticos pro-Taiwan, prodemocracia y pro-negocios, la 123 Alianza Democrática se ha disuelto debido a la falta de apoyo financiero del gobierno de Taiwán tras la derrota del Kuomintang en las elecciones presidenciales."
 hongkong_news.4.a: "Buenas noticias, ¿no?"
 hongkong_news.4.b: "Lo tengo."
 hongkong_news.5.t: "SARS Outbreak"
 hongkong_news.5.d: "En Guangdong y Hong Kong se ha producido un brote de un virus grave de neumonía conocido como «SARS». Pese a las afirmaciones de funcionarios continentales de que ha sido efectivamente contenidas, el brote continúa en Hong Kong. La OMS ha emitido ahora una advertencia de viaje al sur de China y Hong Kong. Dice que representa una amenaza para la salud mundial. Hasta ahora una persona ha muerto como resultado. El Gobierno de Hong Kong ha iniciado medidas obligatorias de cuarentena para los sospechosos de estar infectados."
 hongkong_news.5.a: "Nuestro sector turístico está en problemas."
 hongkong_news.5.b: "Arrestar a los funcionarios incompetentes y tratar el brote de manera transparente."
 hongkong_news.5.c: "Necesitamos seguir ocultando los datos reales para mantener la estabilidad social."
 hongkong_news.5.e: "Un desarrollo preocupante."
 hongkong_news.6.t: "El paso de Leslie Cheung"
 hongkong_news.6.d: "El mundialmente reconocido cantante, actor e icono de Hong Kong Leslie Cheung se suicidó a los 46 años saltando de un edificio del Hotel Mandarin en Hong Kong debido a la depresión. Leslie Cheung ganó los corazones de innumerables fans con sus canciones sinceras, habilidades de actuación magníficas y carisma personal único. Y su paso conmocionó a toda la comunidad china, con mucha gente profundamente entristecida y perdida.\n\nEl paso de Leslie Cheung no es sólo una pérdida significativa para la industria del entretenimiento, sino también un golpe cultural y espiritual. Sus obras de música y cine continuarán influenciando e inspirando a futuros artistas y audiencias, pero su ausencia dejará para siempre un vacío infiel."
 hongkong_news.6.a: "Perdimos a un gran artista hoy."
 hongkong_news.7.t: "El paso de Anita Mui"
 hongkong_news.7.d: "Anita Mui Yim-fong, ampliamente conocida como la «Madonna de Asia», ha fallecido a los 40 años después de una valiente batalla con el cáncer cervical.\n\nNacido en 1963, Anita Mui se levantó a la fama en los años 80, convirtiéndose en una figura fundamental en la escena Cantopop y dejando un legado duradero en millones de fans. Su dedicación a la caridad y su fuerza inquebrantable ante la enfermedad le valió su profunda admiración. A medida que la noticia de su fallecimiento se extiende, un estado de ánimo sombrío cubre a la nación, con gente reuniéndose para honrar a la querida «hija de Hong Kong»."
 hongkong_news.7.a: "El fin de una gran era."
 hongkong_news.8.t: "Severa tormenta tropical Utor"
 hongkong_news.8.d: "El 4 de julio a las 5:45 p.m., Typhoon Yuet entró en la zona de alerta de 800 kilómetros, lo que llevó al Observatorio de Hong Kong a emitir una señal de reserva No.1. El 5 de julio a las 7:30 pm, la señal fue actualizada a Gale Or Storm Signal No.8, marcando la primera emisión de esta señal en el siglo XXI. Debido a las oleadas de tormenta, la combinación de la oleada de tormenta y la marea alta normal en esa mañana dio lugar a un nivel del mar de 3,4 metros registrado en Quarry Bay, el más alto desde que el tifón Wanda llegó a Hong Kong en 1962. Esto dio lugar a graves inundaciones en Tai O y los Nuevos Territorios del noroeste el 6 de julio. Algunas calles principales en Tai O se convirtieron en ríos, con profundidades de agua alcanzando hasta tres metros. El mercado mayorista de mariscos en Lau Fau Shan también fue inundado, obligando a muchas tiendas a cerrar."
 hongkong_news.8.a: "El Observatorio ha realizado su trabajo."
 hongkong_news.9.t: "Tormenta tropical severa Yutu (conejo lunar)"
 hongkong_news.9.d: "La Tormenta Tropical Yutu ha entrado en la zona de alerta del Observatorio de Hong Kong, provocando una señal de reserva No.1. Se han ajustado los horarios de transporte público, se han colocado escuelas en el reloj de tormenta y se han activado los servicios de drenaje y emergencia de la ciudad. El Observatorio espera lo peor durante las próximas 24 horas."
 hongkong_news.9.a: "Hunker baja y espera."
 HKG_european_bussiness_opinion: "Mejorar el comercio con los empresarios europeos"
 HKG_chinese_entrepreneurs_opinion: "Mejorar el comercio con nuestros empresarios continentales"
 HKG_protest_movement_rises: "Las protestas comienzan"
 HKG_protest_movement_rises_desc: "Cientos de miles se vierten en las calles. El mundo está mirando. Beijing también está mirando."
 HKG_loyalist_consolidation: "Consolidación loyalista"
 HKG_loyalist_consolidation_desc: "Las facciones pro-Beijing estrechan su control sobre el Consejo Legislativo y los nombramientos de la administración pública."
 HKG_umbrella_revolution: "La Revolución Umbrella"
 HKG_umbrella_revolution_desc: "Estudiantes y activistas ocupan las principales arterias de la ciudad. Los paraguas amarillos se convierten en el símbolo de las esperanzas de una generación."
 HKG_democratic_opposition_network: "Red de oposición democrática"
 HKG_democratic_opposition_network_desc: "Los partidos pandemocráticos y los grupos de la sociedad civil forman una amplia coalición para impugnar las implicaciones de Beijing."
 HKG_nsl_imposed: "Ley de seguridad nacional"
 HKG_nsl_imposed_desc: "Beijing somete totalmente al Consejo Legislativo. Overnight, protest, subversion, secession and colusion with foreign forces become crimes punishable by life imprisonment."
 HKG_press_freedom_crackdown: "Silenciando la prensa"
 HKG_press_freedom_crackdown_desc: "Apple Daily es allanado y cerrado. La independencia editorial RTHK está despojada. Las últimas voces libres están apagadas."
 HKG_police_state_apparatus: "Fist Policing de hierro"
 HKG_police_state_apparatus_desc: "La policía amplía sus facultades con arreglo a las disposiciones de la Ley nacional de seguridad. Los escuadrones de los disturbios, las operaciones encubiertas y los arrestos masivos se vuelven rutinarios."
 HKG_dialogue_with_protesters: "Comisión de Diálogo"
 HKG_dialogue_with_protesters_desc: "Un último intento desesperado de mediación antes de que la represión sea total. Se invita a observadores independientes a que examinen la conducta policial."
 HKG_anti_extradition_bill: "Ley de Extradición Crisis"
 HKG_anti_extradition_bill_desc: "Una ley propuesta que permite la extradición a China continental enciende las mayores protestas en la historia de Hong Kong. Dos millones de marcha."
 HKG_youth_resistance_cells: "Resistencia a la juventud"
 HKG_youth_resistance_cells_desc: "Los jóvenes de Valiant Hongkongers forman unidades en primera línea. La generación negra lucha con bombas de gasolina y paraguas contra gas lacrimógeno y balas de goma."
 HKG_emigration_wave: "El Gran Éxodo"
 HKG_emigration_wave_desc: "Cientos de miles de personas abandonan para el Reino Unido, Canadá y Australia en virtud de planes BN(O). Hong Kong haemorrhages su clase profesional."
 HKG_preserve_financial_hub: "Preservar el Centro Financiero"
 HKG_preserve_financial_hub_desc: "Elites empresariales presionan a Beijing: el valor de Hong Kong reside en su marco legal y sus conexiones internacionales. Destruye eso, destruye todo."
 HKG_foreign_business_exodus: "Vuelo de Capital Exterior"
 HKG_foreign_business_exodus_desc: "Banks, law firms, and transnationals quietly move regional headquarters to Singapore and Tokyo. La corona financiera se resbala."
 HKG_western_sanctions_threat: "La amenaza de las sanciones occidentales"
 HKG_western_sanctions_threat_desc: "Estados Unidos, Reino Unido y UE revisan el estado comercial especial de Hong Kong. El acceso privilegiado de la ciudad a los mercados occidentales cuelga en el equilibrio."
 HKG_deeper_mainland_integration: "Integración continental más profunda"
 HKG_deeper_mainland_integration_desc: "La iniciativa Greater Bay Area lleva a Hong Kong a la órbita económica de China. La infraestructura, las finanzas y la gobernanza convergen lentamente."
 HKG_patriotic_education: "Educación patriótica"
 HKG_patriotic_education_desc: "Un nuevo currículum reescribe la historia. A la próxima generación se le enseñará que Hong Kong siempre ha sido, y siempre será, chino."
 HKG_last_stand_opposition: "El último stand demócrata"
 HKG_last_stand_opposition_desc: "Supervivir las figuras pro democracia se niegan a ser silenciadas. Desde el exilio en Londres y Washington siguen cabildeando al mundo, sabiendo que nunca pueden volver a casa."
 HKG_absorption_complete: "Absorción completa"
 HKG_absorption_complete_desc: "Un país. Un sistema. El experimento ha terminado. La identidad única de Hong Kong existe ahora sólo en memoria y diáspora."
 HKG_city_of_resistance: "Ciudad de Resistencia"
 HKG_city_of_resistance_desc: "En contra de todas las probabilidades, el espíritu de resistencia soporta. Hong Kong se convierte en un símbolo para las democracias de todo el mundo, prueba de que algunas cosas valen la pena luchar incluso cuando las probabilidades son imposibles."
 HKG_silenced_press: "Prensa Silenciosa"
 HKG_silenced_press_desc: "Silenciar la prensa facilitará la integración, pero debemos movernos rápidamente antes de que el enojo público llegue a un punto de ruptura."
 HKG_annexation: "El modelo SAR"
 HKG_annexation_desc: "Hong Kong se ha convertido en la región administrativa especial ejemplar de Beijing - obediente, próspera e integrada. El Politburo premia la lealtad con el acceso preferencial al comercio, las corrientes de mano de obra continental y la inversión en infraestructura. Los privilegios se mantienen mientras Hong Kong siga siendo parte de la República Popular."
 HKG_democratic_reform_initiative: "Iniciativa de reforma democrática"
 HKG_democratic_reform_initiative_desc: "El camino pacífico dio frutos. Con la organización de la sociedad civil, la prensa protegida y la apertura del Legislativo, el SAR se compromete formalmente a un programa de reforma democrática. Las instituciones existen; ahora serán fortalecidas."
 HKG_universal_suffrage_amendment: "Enmienda universal de sufragio"
 HKG_universal_suffrage_amendment_desc: "Cada adulto Hongkonger obtiene un voto, cada oficina elegida es impugnada, y el comité nominador se disuelve. La enmienda aprueba el LegCo y está consagrada como derecho constitucional. - protestas de Beijing; Hong Kong celebra."
 HKG_independent_judiciary_reform: "Reforma Judicatura Independiente"
 HKG_independent_judiciary_reform_desc: "El Tribunal de Apelación Final está libre de vetos políticos, los fiscales operan a la larga del poder ejecutivo y los nombramientos judiciales son revisados por una comisión independiente. Un poder judicial digno del estado de derecho que interpreta."
 HKG_freedom_of_information_act: "Ley de libertad de información"
 HKG_freedom_of_information_act_desc: "Los archivos gubernamentales son accesibles al público por defecto. Los denunciantes obtienen protección legal. La idea de Silenced Press se hace retroceder, y el periodismo en Hong Kong se convierte en lo más raro de la región: una prensa libre en una ciudad china."
 HKG_democratic_consolidation: "Consolidación democrática"
 HKG_democratic_consolidation_desc: "El sufragio universal, un poder judicial independiente y una prensa libre se refuerzan entre sí. Hong Kong es la sociedad china más democrática de la historia. Las reformas no son reversibles por ordenanza; son la nueva base."
 HKG_infrastructure_megaproject: "Infraestructura Megaproyecto"
 HKG_infrastructure_megaproject_desc: "El Departamento de Tierras elabora un plan maestro: la próxima década del crecimiento de Hong Kong depende de construir hacia fuera, hacia arriba y bajo tierra. El tesoro se abre. Los contratos están firmados. Llegan las grúas."
 HKG_mtr_expansion_phase_2: "Fase de expansión MTR 2"
 HKG_mtr_expansion_phase_2_desc: "Extensiones a la Línea West Rail, el Enlace Shatin-Central y un corredor de larga data North Island. Poco tiempo de caída, los valores de propiedad se elevan a lo largo de las nuevas estaciones, y la red MTR llega a distritos que han estado esperando desde la era británica."
 HKG_third_runway_chek_lap_kok: "Tercera pista en Chek Lap Kok"
 HKG_third_runway_chek_lap_kok_desc: "El trabajo de recuperación por sí solo lleva años y el costo es asombroso, pero Hong Kong International no puede permanecer en un aeropuerto de dos vías mientras Singapur y Shanghai se expanden. La tercera pista asegura el lugar de la ciudad como centro de aviación regional."
 HKG_lantau_tomorrow_vision: "Lantau Mañana Visión"
 HKG_lantau_tomorrow_vision_desc: "El proyecto de regeneración más ambicioso en la historia de Hong Kong: islas artificiales al este de Lantau, viviendas para cientos de miles, un nuevo distrito comercial central. Environmentalists object; the housing-poor animado. El costo político es real, la ganancia en tierra utilizable es enorme."
 HKG_smart_city_initiative: "Iniciativa de ciudades inteligentes"
 HKG_smart_city_initiative_desc: "Citywide 5G, gestión integrada del tráfico, identidad digital para cada residente, y una API de servicios públicos que permite a las startups construir sobre los datos de la SAR. Hong Kong salta de próspero a programable."
 HKG_world_class_infrastructure: "Infraestructura de la clase mundial"
 HKG_world_class_infrastructure_desc: "Carreteras, ferrocarriles, puerto, aeropuerto, fibra y tierra reclamada todo actualizado en concierto. La infraestructura de una ciudad construida para la segunda mitad del siglo XXI, finalmente entregada."
 HKG_hospital_authority_reform: "Reforma de la Autoridad Hospitalaria"
 HKG_hospital_authority_reform_desc: "La Dirección de Hospitales está reestructurada para transparencia, eficiencia y financiación basada en los resultados. Los tiempos de espera comienzan a caer, la desconexión entre el cuidado público y privado se estrecha, y las bases para un sistema moderno están establecidas."
 HKG_pandemic_preparedness: "Preparación pandémica"
 HKG_pandemic_preparedness_desc: "SARS enseñó a la ciudad una lección brutal; el nuevo Centro para la Protección de la Salud se asegura de que se pega. PPE almacenado, capacidad de contacto y vigilancia integrada con la OMS. El próximo brote no atrapará a Hong Kong desprevenido."
 HKG_chinese_medicine_integration: "Integración de la medicina china"
 HKG_chinese_medicine_integration_desc: "La Medicina Tradicional China está doblada en el sistema de salud pública: practicantes regulados, alas hospitalarias, becas de investigación universitaria. Los pacientes que quieren ambos mundos tienen ambos mundos, y Beijing nota el respeto cultural."
 HKG_universal_healthcare_voucher: "Universal de atención sanitaria"
 HKG_universal_healthcare_voucher_desc: "Cada residente recibe un vale anual canjeable en clínicas públicas o privadas. La cobertura se vuelve universal tanto en la práctica como en el nombre, y los trabajadores pobres dejan de elegir entre el alquiler y la visita del médico."
 HKG_public_health_modernisation: "Modernización de la salud pública"
 HKG_public_health_modernisation_desc: "Nuevos centros de cáncer, servicios ampliados de salud mental, hospitales modernizados en los nuevos territorios. La medicina en sí misma se pone al día con la reforma institucional."
 HKG_healthcare_excellence: "Excelencia del cuidado de la salud"
 HKG_healthcare_excellence_desc: "La esperanza de vida de Hong Kong ya está entre las más altas del mundo; el sistema que la produjo ahora es digno de esa estadística. Un modelo que las regiones circundantes comienzan a estudiar e imitar."
 HKG_labour_reform_charter: "Carta de Reforma Laboral"
 HKG_labour_reform_charter_desc: "La primera revisión completa del código laboral de Hong Kong en décadas. Se denominan, miden y ponen en el calendario legislativo talleres, horas extraordinarias no remuneradas, abusos de los dormitorios y explotación del sector informal. Los sindicatos se dan cuenta."
 HKG_minimum_wage_ordinance: "Ordenanza sobre salarios mínimos"
 HKG_minimum_wage_ordinance_desc: "Un salario mínimo legal ajustado bienalmente. Los conglomerados protestan por la competitividad; los limpiadores y los trabajadores del restaurante ven que sus paquetes de pago crecen por primera vez en una generación."
 HKG_collective_bargaining_rights: "Derechos colectivos de negociación"
 HKG_collective_bargaining_rights_desc: "Los sindicatos reciben reconocimiento legal, los contratos colectivos obtienen dientes legales y el derecho a la huelga es codificado en lugar de tolerarlo. La Confederación de Sindicatos se convierte en un verdadero contrapeso para las cámaras del comercio."
 HKG_foreign_domestic_helpers_protections: "Protecciones de ayuda interna extranjera"
 HKG_foreign_domestic_helpers_protections_desc: "Los trabajadores domésticos vivos, en su mayoría filipinas e indonesios, obtienen protecciones ejecutables contra los peores abusos del empleador. Días libres obligatorios, condiciones contractuales transparentes y un regulador con dientes reales. Un reconocimiento a largo plazo de que son trabajadores, no sirvientes."
 HKG_pension_scheme_reform: "Reforma del Plan de Pensiones"
 HKG_pension_scheme_reform_desc: "Las peores características del Fondo de Proveedores Obligatorios - altos cargos, garras para el empleador, brechas de contribución - son reformadas. La pobreza de edad en Hong Kong deja de ser un escándalo silencioso."
 HKG_labour_dignity: "Dignidad laboral"
 HKG_labour_dignity_desc: "Un piso estatutario bajo salarios, sindicatos reconocidos, ayudantes protegidos y una pensión que realmente pensiones. Trabajar en Hong Kong se convierte, por fin, en algo parecido al empleo digno."
 HKG_renminbi_offshore_hub: "Centro extraterritorial del renminbi"
 HKG_renminbi_offshore_hub_desc: "Beijing confía a Hong Kong con la mayor cantidad de renminbi offshore en el mundo. Dim Sum bond issuance, cambio de divisas y servicios de limpieza para toda la región se ejecutan a través de Central. La cercanía al continente paga."
 HKG_belt_and_road_financing: "Franja y la Ruta Financiación"
 HKG_belt_and_road_financing_desc: "Hong Kong se convierte en el portal financiero para Franja y la Ruta infraestructura a través de Eurasia. Financiamiento de proyectos, sindicación de bonos, resolución de disputas - la experiencia del SAR se exporta junto con el capital chino."
 HKG_green_finance_centre: "Centro financiero verde"
 HKG_green_finance_centre_desc: "El HKEX lanza un tablero verde, el SFC emite reglas de desconexión climática con dientes, y Hong Kong se posiciona como la puerta de entrada de Asia para la capital ESG. Los fondos de pensiones europeos notan. También lo hacen los desarrolladores renovables."
 HKG_fintech_revolution: "Revolución Fintech"
 HKG_fintech_revolution_desc: "Licencias bancarias virtuales, cajas de arena reguladas y un sistema de pagos más rápido que finalmente arrastra las finanzas minoristas a la era digital. La próxima generación de empresas financieras nace en Cyberport, no Central."
 HKG_global_wealth_management: "Gestión mundial de la riqueza"
 HKG_global_wealth_management_desc: "Renminbi clearing, capital verde, fintech rails - Hong Kong se encuentra en el centro de los tres. La riqueza del mundo se maneja a través de la RAE. Los honorarios por sí solos justificarían la existencia de la ciudad."
 HKG_tourism_board_revival: "Renacimiento de la Junta de Turismo"
 HKG_tourism_board_revival_desc: "Post-handover, post-SARS, después de todo, la Junta de Turismo reinicia: mejor marketing, servicios ampliados de visitantes, una marca coherente para la ciudad más allá de las latitudes «Ciudad Mundial de Asia». Los visitantes se dan cuenta."
 HKG_disney_hong_kong: "Hong Kong Disneyland"
 HKG_disney_hong_kong_desc: "Lantau Island representa al más pequeño de los parques Disney - y el más accesible para los turistas continentales. El proyecto de ley de construcción es empinado, el corte de cintas es brillante y la SAR consigue un ancla familiar para su economía turística."
 HKG_cantopop_revival: "Revival cantopop"
 HKG_cantopop_revival_desc: "Una oleada de inversión pública, cupos de emisoras y subescritura musical-festival trae la música popular cantonés de vuelta a la relevancia comercial. La confianza cultural que Cantopop una vez encarnado regresa con la música."
 HKG_film_industry_renaissance: "Industria cinematográfica Renacimiento"
 HKG_film_industry_renaissance_desc: "Los estudios de TVB se expanden, indie auteurs encuentran financiación, y el cine de Hong Kong rediseña el swagger que tenía en los años ochenta y noventa. No sólo artes marciales y crimen - drama serio, comedia familiar, y una generación de nuevos directores con historias que contar."
 HKG_west_kowloon_cultural_district: "Distrito cultural de West Kowloon"
 HKG_west_kowloon_cultural_district_desc: "M+, el Museo del Palacio, Xiqu Centre y una docena de instituciones más pequeñas en lo que solía ser reclamado tierra. Un auténtico barrio cultural que permite a la ciudad contar su propia historia, en galerías y teatros más que en lobbies de cristal."
 HKG_world_class_destination: "Destino de la clase mundial"
 HKG_world_class_destination_desc: "El turismo, la infraestructura, la cocina y la cultura alcanzan el pico juntos. Hong Kong no se convierte simplemente en una escala o una reserva financiera sino en un destino por derecho propio - el tipo de viajeros de la ciudad planean viajes completos."
 HKG_consolidated_democracy: "Democracia consolidada"
 HKG_consolidated_democracy_desc: "Las instituciones democráticas de Hong Kong están ahora auto-reforzando: prensa libre, tribunales independientes, elecciones impugnadas. Una democracia que no necesita el permiso del gobierno central para funcionar."
 HKG_modernised_infrastructure_idea: "Infraestructura modernizada"
 HKG_modernised_infrastructure_idea_desc: "Las carreteras, los ferrocarriles, el puerto y la columna vertebral digital de Hong Kong se actualizan a estándares globales de primer nivel. Cada sector se beneficia del multiplicador."
 HKG_modern_healthcare_system: "Moderno Sistema de Salud"
 HKG_modern_healthcare_system_desc: "La cobertura universal, los hospitales modernizados y la atención integrada público-privada producen algunos de los mejores resultados en salud del mundo a un costo sostenible."
 HKG_renminbi_hub_idea: "Central de Renminbi"
 HKG_renminbi_hub_idea_desc: "Hong Kong es el principal centro de limpieza de renminbi offshore del mundo. Los flujos de comercio, inversión y cambio de divisas pasan por los bancos e intercambios del SAR."
 HKG_green_finance_idea: "Centro financiero verde"
 HKG_green_finance_idea_desc: "La puerta de entrada de Asia para el capital climatizado. Los bonos verdes, la equidad con valor de los sistemas y la vía de financiación de proyectos renovables a través de Central."
 HKG_tourism_boom: "Turismo Boom"
 HKG_tourism_boom_desc: "Hong Kong es una vez más un destino mundial de alto nivel. El gasto del visitante alimenta al por menor, hospitalidad y cultura; el estado de ánimo social se eleva con los recibos."
 HKG_modernised_police_force: "Fuerza de Policía Modernizada"
 HKG_modernised_police_force_desc: "La Fuerza de Policía de Hong Kong actúa con niveles actualizados de capacitación, equipo y normas procesales. La policía de rutina es más eficaz, los costos de lucha contra el delito disminuyen y la confianza pública en la fuerza es mensurable en los datos de encuestas."
 HKG_counter_terrorism_capability: "Capacidad de lucha contra el terrorismo"
 HKG_counter_terrorism_capability_desc: "The Counter-Terrorism Response Unit gives the SAR a credible specialist capacity against organized threats. Los servicios de inteligencia extranjeros encuentran más difícil operar sin ser detectados, y la Fuerza tiene un pequeño cuadro permanente de operaciones especiales."
 HKG_riot_control_capability: "Capacidad de control de Riot"
 HKG_riot_control_capability_desc: "La Policía tiene vehículos blindados, escudos, gas y protocolos de gestión de multitudes ensayados. El malestar se contiene con mayor confianza; el engranaje protector es también un recordatorio visible de que la SAR ha elegido un enfoque particular del orden público."
 HKG_clean_police_force: "Policía limpia"
 HKG_clean_police_force_desc: "Las investigaciones internas, la supervisión de la CAPI y el compromiso público con la integridad han reducido mensurablemente la corrupción dentro de la Fuerza. Los oficiales atrapados tomando pagos de triada tienen consecuencias reales. La reputación de la Fuerza - y su eficacia - mejora ambos."
 hongkong_order.1.t: "Presiones de transición cívica"
 hongkong_order.1.d: "Los incidentes rutinarios de orden público están aumentando a través de la RAE. Las causas varían: presión de la vivienda, migración transfronteriza, fricción lingüística y cultural, incertidumbre económica en algunos distritos. No domina ninguna queja. Se le pregunta a la policía cómo responder a una situación más social que criminal."
 hongkong_order.1.a: "Aumentar las patrullas vecinales."
 hongkong_order.1.b: "Establecer programas de enlace comunitario."
 hongkong_order.1.c: "Mantenga la postura actual."
 hongkong_order.2.t: "Coordinación de la delincuencia cruzada"
 hongkong_order.2.d: "La Dependencia de Respuesta contra el Terrorismo ha identificado redes organizadas que operan a través de la frontera entre los Estados Unidos de América. La interdicción efectiva requiere coordinación con la seguridad pública continental, pero los marcos jurídicos difieren y la Ley Fundamental establece límites para la integración operacional. El Comisionado pide orientación."
 hongkong_order.2.a: "Profundizar las operaciones conjuntas con las autoridades continentales."
 hongkong_order.2.b: "Mantener operaciones independientes dentro de nuestra jurisdicción."
 hongkong_order.2.c: "Restringir la cooperación a los canales oficiales solamente."
 hongkong_order.3.t: "Demostraciones fuera de la casa del gobierno"
 hongkong_order.3.d: "Varios miles de manifestantes se han reunido fuera de la Casa del Gobierno. Las quejas son mixtas: asequibilidad de la vivienda, empleo, frustraciones cívicas más difíciles de articular. Algunos banners hacen referencia a la entrega; muchos no lo hacen. La multitud es fuerte pero no violenta. La Fuerza debe decidir sobre una respuesta."
 hongkong_order.3.a: "Diálogo abierto con los organizadores."
 hongkong_order.3.b: "Mantenga un perímetro visible y espere eventos."
 hongkong_order.3.c: "Authorise crowd dispersal."
 hongkong_order.4.t: "Denuncias de cooperación entre la policía y el tributo"
 hongkong_order.4.d: "El informe de un denunciante alega que miembros de la Fuerza han estado recibiendo pagos para pasar por alto ciertas operaciones de tríada. La presión política para investigar es significativa; el sindicato de la policía advierte contra los funcionarios individuales que navegan antes del debido proceso. El asunto no puede ser ignorado."
 hongkong_order.4.a: "Abra una investigación formal a través de ICAC."
 hongkong_order.4.b: "Revisión disciplinaria interna solamente."
 hongkong_order.4.c: "Tratar como incidentes aislados."
 HKG_new_development_idea_buff: "Nuevo Plan de Desarrollo"
 HKG_new_development_idea_buff_desc: "La fase transitoria del Nuevo Plan de Desarrollo de la SAR. Las instituciones políticas y de investigación reciben un impulso temprano, pero la economía soporta el costo de la reestructuración - las oficinas y los sectores de bienes de consumo se interrumpen temporalmente mientras que el nuevo marco entra en línea."
 HKG_new_development_idea_buff_complete: "Nuevo Plan de Desarrollo"
 HKG_new_development_idea_buff_complete_desc: "El Nuevo Plan de Desarrollo está plenamente operativo. La velocidad de investigación, la eficiencia educativa y la productividad de las oficinas son constantemente elevadas. Los costos de transición de la fase temprana se recuperan, y la economía del conocimiento de Hong Kong es ahora realmente de primer nivel."
 hongkong_housing.1.t: "Crisis de la vivienda de Hong Kong"
 hongkong_housing.1.d: "El precio medio de la propiedad ha superado los ingresos medios en el hogar por un factor de veinte. Decenas de miles de Hongkongers viven en pisos subdivididos y casas de jaula. La lista de espera para viviendas públicas supera los seis años y crece. El gobierno ha reconocido la crisis y comprometido con un programa de reforma, pero que la reforma, y a cuyo costo, sigue siendo la cuestión central de la política de Hong Kong."
 hongkong_housing.1.a: "Debemos actuar con decisión."
 hongkong_housing.2.t: "Vivienda para todos los Hongkongers"
 hongkong_housing.2.d: "Después de años de construcción, reforma y luchas políticas, se ha cumplido el último objetivo del programa de vivienda. Los hogares de jaula están siendo vaciados. Los arrendatarios de viviendas públicas están mejorando su propiedad. La lista de espera ha caído por debajo de dos años por primera vez en una generación. La crisis que definió la era post-mano está, por fin, detrás de nosotros."
 hongkong_housing.2.a: "Un hogar para cada Hongkonger."
