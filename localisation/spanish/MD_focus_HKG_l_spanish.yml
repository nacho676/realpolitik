 HKG_contract_capstone_label: "La Flota de Hong Kong"
 HKG_contract_capstone_progress: "Complete el programa de portaaviones domésticos y acampe un portaaviones para ganar el legado naval de la ciudad."
 HKG_contract_capstone_done: "§GLas velas de la Flota de Hong Kong - Hong Kong es una potencia naval reconocida.§!"
 HKG_contract_capstone_progress_tt: "Incendios una vez que la sucursal entera del portaaviones esté completa y Hong Kong haya construido o retenido un portaaviones. Concede el espíritu nacional §YPoder de la Naval de Hong Kong§!."
 HKG_contract_capstone_done_tt: "Se ha logrado la piedra angular. El espíritu nacional §YPoder de la Naval de Hong Kong§! es activo y se pueden negociar mejores términos contractuales."
 HKG_naval_contracts_category: "Contratos de contratación naval"
 HKG_contract_solicit_contract: "Solicitar un contrato a Pekín"
 HKG_contract_solicit_contract_desc: "Acudir a la Comisión Militar Central y solicitar una nueva orden de adquisición de buques de guerra. Pueden ejecutarse hasta tres contratos a la vez; cuantos más manejes, más tiempo concede Pekín para cada uno. La clase y la recompensa dependen de nuestro prestigio."
 HKG_contract_deliver_destroyer: "Entrega un Destructor"
 HKG_contract_deliver_destroyer_desc: "Transfiera un destructor completo a la Armada del Ejército Popular de Liberación. Se acredita a su contrato destructor más urgente. Repita hasta que se cumpla la cuota de ese contrato."
 HKG_contract_deliver_frigate: "Entrega una fragata"
 HKG_contract_deliver_frigate_desc: "Transfiera una fragata completa a la Armada del Ejército Popular de Liberación. Se acredita a su contrato de fragata más urgente. Repita hasta que se cumpla la cuota de ese contrato."
 HKG_contract_deliver_submarine: "Entrega un submarino"
 HKG_contract_deliver_submarine_desc: "Transferir un submarino de ataque completo a la Armada del Ejército Popular de Liberación. Se acredita a su contrato submarino más urgente."
 HKG_contract_deliver_cruiser: "Entrega un Cruiser"
 HKG_contract_deliver_cruiser_desc: "Transfiera un crucero completado a la Armada del Ejército Popular de Liberación. Se acredita a su contrato de crucero más urgente."
 HKG_contract_deliver_carrier: "Entregar el portaaviones"
 HKG_contract_deliver_carrier_desc: "Transfiere un portaaviones completo a la Armada del Ejército Popular de Liberación y cumpla el contrato de transporte aéreo."
 HKG_contract_negotiate_terms: "Renegociar los Términos de Contratación"
 HKG_contract_negotiate_terms_desc: "Con la Flota de Hong Kong establecida, los astilleros de Hong Kong mandan respeto. Presione Beijing para pagos más ricos y plazos más largos en todos los contratos futuros."
 HKG_contract_need_destroyer_tt: "Debemos tener al menos un destructor en nuestra marina para entregar"
 HKG_contract_need_frigate_tt: "Debemos tener al menos una fragata en nuestra marina para entregar"
 HKG_contract_need_submarine_tt: "Debemos tener al menos un submarino de ataque en nuestra marina para entregar"
 HKG_contract_need_cruiser_tt: "Debemos tener al menos un crucero en nuestra marina para entregar"
 HKG_contract_need_carrier_tt: "Debemos tener un portaaviones en nuestra marina para entregarlo."
 HKG_contract_slots_free_tt: "Tenemos una ranura de contrato libre (un máximo de tres contratos puede funcionar a la vez)"
 HKG_contract_modules_tt: "Nuestros astilleros han investigado al menos el nivel 1 de cada módulo básico: motor, arma principal, misiles, torpedos, sonar y radar"
 HKG_contract_tt_unlock: "Desbloquea el sistema §YChina Contratos de Compras Navales§!: construyen buques de guerra para Beijing a cambio de ingresos del tesoro, poder político y crecimiento industrial."
 HKG_contract_tt_solicit: "La Comisión Militar Central responderá con una oferta de adquisiciones dentro de unos días."
 HKG_contract_tt_accept_advance: "Recibir un avance de §G$[?HKG_contract_offer_advance|0]§! en el tesoro y §G1000§! mano de obra, pagado al firmar el contrato."
 HKG_contract_tt_accept_license: "Beijing otorga una licencia de producción §O§! para uno de sus diseños establecidos [GetHKGContractOfferClass], que podemos construir directamente en nuestros astilleros. §YNota: este es un diseño de servicio probado, no el último de la Armada del Ejército Popular de Liberación.§!"
 HKG_contract_tt_accept_onfulfil: "En la entrega del pedido completo: el pago restante despeja el tesoro, §G[?HKG_contract_offer_pp|0]§! poder político y un aumento de productividad industrial se conceden, y comienza una bonificación de los ingresos por dockyard templado."
 HKG_contract_tt_decline: "Las faldas de oferta. No hay castigo, y Beijing puede extender otro a tiempo."
 HKG_contract_tt_deliver: "Transfiera un barco a la Armada del Ejército Popular de Liberación, acreditado a su contrato más urgente de esta clase.\n§YEl barco debe estar sentado en la Flota de Reserva. No se puede entregar un buque asignado a un equipo de tareas. Muévelo a la reserva primero.§!"
 HKG_contract_tt_deliver_reward: "Cuando se entrega la cuota completa de un contrato: el pago restante aclara el tesoro, y el poder político, la productividad y una bonificación de los ingresos del muelle son concedidos."
 HKG_contract_tt_negotiate: "Todos los contratos futuros pagan §G25%§! más y permiten §G50%§! plazos más largos."
 HKG_contract.1.t: "A Comisión de Beijing"
 HKG_contract.1.d_normal: "La Comisión Militar Central de Beijing se ha acercado a nuestros astilleros con una orden de adquisición.\n\n§YOrden:§! [?HKG_contract_offer_quota|0] x [GetHKGContractOfferClass]\n§YDirección:§! [?HKG_contract_offer_deadline|0] días\n§YPago:§! $ [?HKG_contract_offer_funds|0] - $ [?HKG_contract_offer_advance|0] y §G1000 §! mano de obra pagada al firmar, el resto del parto\n§YAl terminar:§! [?HKG_contract_offer_pp|0] poder político, una ganancia duradera en la productividad y un bono de ingresos por dockyard templado\n\nLos buques deben construirse en nuestros propios patios y ser transferidos a la Armada del Ejército Popular de Liberación. Desapareciendo el plazo aumentará las relaciones con el continente."
 HKG_contract.1.d_license: "La Comisión Militar Central de Beijing ofrece una §Ocontrato de licencia§!. La Armada del Ejército Popular de Liberación compartirá uno de sus diseños establecidos para que nuestros patios construyan bajo licencia.\n\n§YDiseño licenciado:§! [?HKG_contract_offer_quota|0] x [GetHKGContractOfferClass]\n§YFecha límite:§! [?HKG_contract_offer_deadline|0] días\n§YPago:§! $[?HKG_contract_offer_funds|0] - $[?HKG_contract_offer_advance|0] y §G1000§! mano de obra pagada al firmar, el resto en la entrega\n§YAl finalizar:§! [?HKG_contract_offer_pp|0] poder político, una ganancia duradera en la productividad y un bono de renta de muelles templado\n\nAceptar otorga una licencia de producción, permitiéndonos construir el diseño de Beijing directamente. §YNota: Beijing comparte un diseño de servicio probado, no su última nave de guerra.§! Desapareciendo el plazo aumentará las relaciones con el continente."
 HKG_contract.1.a: "Aceptar la comisión"
 HKG_contract.1.b: "Decline - nuestros patios no están listos"
 HKG_contract.2.t: "Contrato Fulfilled"
 HKG_contract.2.d: "El último buque de la orden ha sido entregado a la Armada del Ejército Popular de Liberación. Beijing está satisfecha: el pago final de §Y$[?HKG_contract_last_payment|0]§! se ha despejado en el tesoro, el capital político ha sido liberado y nuestros astilleros han ganado su reputación. Nuestra posición con el continente se ha levantado."
 HKG_contract.2.a: "Hong Kong construye la flota"
 HKG_contract.3.t: "Plazo del contrato perdido"
 HKG_contract.3.d: "Se ha aprobado un plazo de contrato sin cumplir la orden. La Comisión Militar Central ha observado que Hong Kong no ha cumplido su compromiso. El descontento de Pekín pesa ahora en nuestros astilleros y nuestra posición con el continente ha caído."
 HKG_contract.3.a: "An unfortunate setback"
 HKG_contract.50.t: "La Flota de Hong Kong"
 HKG_contract.50.d: "Desde el subcontratista hasta el constructor naval del primer rango - los patios de Hong Kong han completado el programa nacional de transporte aéreo y puesto un portaaviones al mar. Lo que comenzó como contratos de adquisiciones para Beijing se ha convertido en una industria naval que no responde a nadie. La Flota de Hong Kong nace, y con ella Hong Kong ocupa su lugar entre los poderes navales."
 HKG_contract.50.a: "La ciudad navega"
 HKG_contract_dockyard_revenue: "División de Adquisiciones"
 HKG_contract_dockyard_revenue_desc: "Un contrato cumplido para Beijing mantiene los muelles de Hong Kong ocupados y rentables. La construcción naval obtiene ingresos constantes mientras que los libros de pedidos permanecen llenos."
 HKG_contract_beijing_displeasure: "Beijing's Displeasure"
 HKG_contract_beijing_displeasure_desc: "Hong Kong no entregó a tiempo una orden contratada. La Comisión Militar Central ha perdido la confianza en los astilleros de la ciudad, y el costo político se siente a través de la administración."
 HKG_contract_naval_power: "Poder naval de Hong Kong"
 HKG_contract_naval_power_desc: "Los astilleros de Hong Kong construyeron un portaaviones propio y demostraron ser iguales a los de Asia. La industria naval de la ciudad es ahora un activo estratégico permanente."
 HKG_carrier_home: "Un transportista de aeronaves para Hong Kong"
 HKG_carrier_home_desc: "Construir un portaaviones domésticos es el proyecto más ambicioso que la ciudad ha intentado jamás. Comienza con las pasarelas, los muelles secos y la voluntad política de verlo."
 HKG_carrier_construction: "Abajo el Hull"
 HKG_carrier_construction_desc: "Eastern Maritime Shipbuilding Group rompe terreno en el casco del transportista. El trabajo se basa en cada patio y el soldador Hong Kong puede ahorrar."
 HKG_carrier_construction2: "Encajar en el transportista de aeronaves"
 HKG_carrier_construction2_desc: "Con el casco completo, el portaaviones se mueve hacia fuera. La central eléctrica, los espacios de mando y la superestructura de la isla están instalados en el muelle."
 HKG_carrier_modules: "Air Carrier Systems Integration"
 HKG_carrier_modules_desc: "Los módulos de transporte modernos están integrados en el diseño: catapultas, engranaje de aprendiz y sistemas de control de daños, aprovechando la experiencia naval duramente inundada."
 HKG_flight_deck_limitations: "Superar las limitaciones de la cubierta de vuelo"
 HKG_flight_deck_limitations_desc: "La primera cubierta de vuelo de Hong Kong está empapada por los estándares occidentales. Los ingenieros reelaboran el diseño de la cubierta para lanzar y recuperar aviones a un tempo utilizable."
 HKG_carrier_special_airwing: "Entrenar el Aircraft Carrier Air Wing"
 HKG_carrier_special_airwing_desc: "Un portaaviones es tan capaz como los pilotos que vuelan de él. Hong Kong invierte en un ala naval dedicada entrenada para operaciones de cubierta."
 HKG_carrier_defensive_weapons: "Air Carrier Self-Defence Suite"
 HKG_carrier_defensive_weapons_desc: "Los sistemas de armas cercanos, los misiles de defensa de puntos y las contramedidas electrónicas están equipados para que el portaaviones pueda sobrevivir sin apoyarse totalmente en sus escoltas."
 HKG_carrier_logistics: "Infraestructura de apoyo a los transportistas"
 HKG_carrier_logistics_desc: "Un portaaviones exige un puerto de origen igual a la tarea: amarres de aguas profundas, depósitos de municiones y la cola logística para mantenerlo en el mar."
 HKG_expanded_shipyards: "Ampliar los Astilleros"
 HKG_expanded_shipyards_desc: "Los muelles de Hong Kong son empujados a su límite. Nuevas pasarelas y muelles secos amplían la capacidad de la ciudad para construir y reparar buques de guerra."
 HKG_expanded_trade_capacity: "Ampliación de la capacidad comercial"
 HKG_expanded_trade_capacity_desc: "Como uno de los grandes entrepôts del mundo, Hong Kong invierte en el puerto y la capacidad industrial necesaria para mantener las mercancías moviéndose a través del puerto."
 HKG_expanded_searoutes: "Asegurar las rutas del mar"
 HKG_expanded_searoutes_desc: "Los paseos de prosperidad de Hong Kong en carriles de envío abierto. La administración profundiza los vínculos comerciales con sus vecinos marítimos para mantener las rutas seguras."
 HKG_expanded_inland_routes: "Ampliar las rutas interiores"
 HKG_expanded_inland_routes_desc: "Más allá del puerto, Hong Kong fortalece los enlaces ferroviarios y viales que lo atan al continente y alimenta su industria."
 HKG_offshore_industry: "Desarrollar la industria offshore"
 HKG_offshore_industry_desc: "La tierra en Hong Kong es escasa y querida. La ciudad se convierte en sitios reclamados y offshore para hacer espacio para nuevos complejos industriales."
 HKG_offshore_industry2: "Ampliación de la industria offshore"
 HKG_offshore_industry2_desc: "El programa industrial offshore demuestra su valor. La nueva recuperación y construcción empujan la base de fabricación de Hong Kong a través del agua."
 HKG_housing_policy_modifier: "Política de vivienda"
 HKG_housing_policy_modifier_desc: "El peso acumulativo de las decisiones sobre vivienda de Hong Kong, se sentía a través de la construcción, el bolso público y la paciencia de su pueblo. Cada paso en el programa de vivienda cambia estas cifras para mejorar o empeorar."
 HKG_small_house_policy: "Reformar la Política de Pequeña Casa"
 HKG_small_house_policy_desc: ", la política colonial de la pequeña vivienda otorga a los habitantes indígenas de los nuevos territorios el derecho a construir un hogar de baja altura en tierras ancestrales. Reformarla libera grandes extensiones para el desarrollo de mayor densidad, pero el establecimiento rural resistirá cualquier cambio a sus privilegios heredados."
 HKG_brownfield_consolidation: "Consolidar los Brownfields"
 HKG_brownfield_consolidation_desc: "Cientos de hectáreas en los Nuevos Territorios se encuentran bajo patios de almacenamiento al aire libre, raspadores y parques de contenedores. Consolidar estos sitios de campo marrón en instalaciones de varios pisos desbloquea la tierra por debajo para viviendas sin un solo cortejo de regeneración."
 HKG_revitalise_private_market: "Revitalice el Mercado Privado"
 HKG_revitalise_private_market_desc: "Con la competencia pública despejada, el gobierno recurre a los desarrolladores. Se ofrecen aprobaciones simplificadas, ratios de trama relajados e incentivos fiscales para llevar viviendas privadas al mercado más rápido."
 HKG_relax_mortgage_rules: "Relajar las reglas de hipoteca"
 HKG_relax_mortgage_rules_desc: "La Autoridad Monetaria afloja ratios de préstamo a valor y umbrales de prueba de estrés. Los compradores de primera vez finalmente pueden limpiar el obstáculo del pago inicial, aunque los críticos advierten que el apalancamiento está cargado en los balances domésticos."
 HKG_vacancy_tax: "Imponer un impuesto de vacaciones"
 HKG_vacancy_tax_desc: "Un gravamen punitivo en nuevos pisos dejó sin vender e inocupado. Los desarrolladores ya no pueden drip-feed unidades completas en el mercado para mantener los precios altos; el almacenamiento especulativo de las casas termina."
 HKG_light_public_housing: "Ligera vivienda pública"
 HKG_light_public_housing_desc: "Propiedades modulares prefabricadas construidas en terrenos del gobierno ocioso como parada de familias varadas en la lista de espera. Barato y rápido de erección, compran a la Autoridad de Vivienda los años que necesita para construir permanentemente."
 HKG_tenancy_control: "Regulate Subdivided Flats"
 HKG_tenancy_control_desc: "Alquiler de gorros, alquileres obligatorios por escrito y estándares mínimos se imponen a las notorias unidades subdivididas de la ciudad. Los señores de tierra pierden su mano libre; las decenas de miles atrapados en los cubículos divididos ganan una medida de protección."
 HKG_starter_homes_scheme: "Esquema de inicios"
 HKG_starter_homes_scheme_desc: "Un nuevo nivel de propiedad lanzado a jóvenes profesionales precio fuera tanto de la vivienda pública como del mercado privado. Se vende por debajo de la tasa de mercado con restricciones de reventa, el esquema reconstruye el primer peldaño de la escalera de propiedad."
 HKG_artificial_islands: "Programa de Islas Artificiales"
 HKG_artificial_islands_desc: "Un programa de islas artificiales a gran escala en las aguas centrales, concebido para albergar cientos de miles y anclar un nuevo distrito metropolitano. El costo corre hacia los cientos de miles de millones y las objeciones ambientales son feroces, pero la ganancia en tierras utilizables es inigualable."
 HKG_northern_metropolis: "La metrópolis del norte"
 HKG_northern_metropolis_desc: "Un proyecto de desarrollo barrido para los Nuevos Territorios que bordean Shenzhen, tejiendo Hong Kong en el Área de la Gran Bahía. Nuevas ciudades, enlaces ferroviarios y un cinturón de innovación están planificados a través de la frontera norte."
 HKG_country_park_periphery: "Desarrollar la Periferia del Parque Nacional"
 HKG_country_park_periphery_desc: "Se abren a la construcción las franjas menos ecológicamente valiosas de los parques protegidos. Los conservacionistas se avergüenzan del precedente; el gobierno insiste en que la tierra es demasiado valiosa para dejar el barbecho en medio de una crisis de vivienda."
 HKG_redevelop_old_estates: "Reurbanizar las urbanizaciones envejecidas"
 HKG_redevelop_old_estates_desc: "Las fincas públicas más antiguas, construidas en las décadas de boom y ahora decaídas, son demolidas y reconstruidas a la densidad moderna. Los residentes son decantados y reeducados; la misma huella produce mucho más pisos."
 HKG_abolish_subdivided_flats: "Abolir los planos subdivididos"
 HKG_abolish_subdivided_flats_desc: "Con bastante nueva vivienda finalmente en línea, el gobierno se mueve a prohibir los cubículos subdivididos y casas de jaula que avergonzaron la ciudad para una generación. La era de los elementos repartidos se acerca."
 HKG_urban_renewal_push: "Empoderar a la Autoridad de Renovación Urbana"
 HKG_urban_renewal_push_desc: "La Autoridad de Renovación Urbana tiene poderes ampliados depuración obligatoria y un tórax de guerra más grande para limpiar y reconstruir los distritos desbordados. El viejo Kowloon y la fachada portuaria son bloques hechos por cuadra."
 HKG_smart_city_housing: "Vivienda de ciudad inteligente"
 HKG_smart_city_housing_desc: "Las nuevas fincas se conectan desde el suelo: transporte integrado, refrigeración de distrito y gobernanza digital. El stock de viviendas de Hong Kong se convierte en un escaparate para las ambiciones inteligentes de la Gran Bahía."
 HKG_housing_for_all: "Un hogar para cada Hongkonger"
 HKG_housing_for_all_desc: "La crisis de hace décadas se declara terminada. La lista de espera se aclara, los pisos subdivididos se han ido, y la propiedad está una vez más al alcance de una familia ordinaria. Una generación que creció resignada al alquiler puede finalmente aspirar a un hogar propio."
 HKG_naval_contracts_category_desc: "Construir buques de guerra para Pekín y entregarlos a tiempo para elevar la posición de Hong Kong ante el continente.\n§YPara entregar un buque debe estar en tu Flota de Reserva. Un buque asignado a una fuerza de tarea no puede entregarse. Muévelo primero a la reserva.§!"
 HKG_contract_acquire_pearl_river: "Solicitar el Delta del Río de las Perlas"
 HKG_contract_acquire_pearl_river_desc: "Los astilleros de Hong Kong han servido fielmente a Pekín y se han ganado la plena confianza del continente. Usar esa posición para pedir a la Comisión Militar Central que ceda el Delta del Río de las Perlas, y duplicar la base industrial de la ciudad."
 HKG_contract_max_standing_tt: "Nuestra posición con el continente debe estar en su máximo"
 HKG_contract_pearl_river_accept_tt: "Beijing cede el Delta del Río Perla a Hong Kong"
 HKG_contract_yard_slack_tt: "Nuestros astilleros tienen capacidad de sobra para asumir otro contrato y aún así cumplir con el tiempo"
 HKG_contract.20.t: "Una petición de Hong Kong"
 HKG_contract.20.d: "Hong Kong ha construido nuestra flota sin falta, y ahora pide una recompensa propia: la cesión del Delta del Río Perla a su administración. Los astilleros del sur alimentarían la industria de la ciudad, y un subcontratista leal se convertiría en una central eléctrica regional. Los fondos ya están sobre la mesa."
 HKG_contract.20.a: "Grant el Delta del Río Perla"
 HKG_contract.20.b: "El continente no será tallado"
 HKG_contract.21.t: "El Delta viene a casa"
 HKG_contract.21.d: "Beijing ha acordado. El Delta del Río Perla responde ahora a Hong Kong, sus fábricas y naufragios doblados en la economía de la ciudad. Hong Kong ya no es una sola isla abarrotada sino el corazón de un cinturón industrial del sur."
 HKG_contract.21.a: "Aumenta una central eléctrica industrial"
 HKG_contract.22.t: "Beijing Declines"
 HKG_contract.22.d: "La Comisión Militar Central se ha negado a ceder el Delta del Río Perla. La integridad territorial del continente no está a la venta, por muy leales que sean los astilleros. Nuestro pago ha sido devuelto."
 HKG_contract.22.a: "Preguntaremos de nuevo a tiempo."
 HKG_contract.30.t: "Entrega desactivada"
 HKG_contract.30.d: "No se entregó ningún barco. El buque elegido para la entrega se asigna a un equipo de tareas, y no puede transferirse un buque insignia.\n§YMueva el barco a su Flota de Reserva, luego vuelva a usar la decisión de entrega.§! No se ha concedido crédito contractual."
 HKG_contract.30.a: "Muévete a la reserva e intenta de nuevo"
 HKG_contract_resource_access: "Línea de suministro continental"
 HKG_contract_resource_access_desc: "Un contrato activo de contratación naval abre acceso preferencial a cadenas de suministro continentales. Pekín viaja materias primas a los patios de la ciudad a una fracción del costo habitual mientras que los libros de pedidos permanecen llenos."
 HKG_contract_resource_access_tt: "§GLos recursos importados de China son mucho más baratos mientras el contrato se ejecuta.§!"
 HKG_contract_shipbuilding_legacy: "Construcción naval Legacy"
 HKG_contract_shipbuilding_legacy_desc: "Cada nave de guerra entregada al continente afila los patios de Hong Kong. Cada pedido completado agrega un 1% permanente a la salida de muelles navales."
 HKG_mainland_resource_supply: "Suministro de recursos continentales"
 HKG_mainland_resource_supply_desc: "Beijing desvía petróleo, acero, metales ligeros, metales preciosos, compuestos y microchips del continente para mantener los astilleros de la ciudad trabajando en sus contratos navales. Hong Kong produce casi ninguno de estos por su cuenta, así que el flujo garantizado es lo que hace posible construir naves de guerra para el continente. La oferta dura sólo mientras un contrato esté activo."
 HKG_mainland_resource_supply_tt: "§YEstos recursos se extraen directamente de la propia piscina china, y sólo mientras que un contrato es activo.§!"
 CHI_hong_kong_resource_drain: "Recursos para Hong Kong"
 CHI_hong_kong_resource_drain_desc: "El petróleo, el acero, los metales ligeros, los metales preciosos, los compuestos y las microchips se dirigen hacia el sur para mantener los astilleros de Hong Kong trabajando en un contrato continental. La salida desviada ya no está disponible para la propia industria del continente."
 CHI_hong_kong_resource_drain_tt: "§REstos recursos se desvían a Hong Kong mientras su contrato funciona.§!"
 HKG_support_the_business: "Apoyo al sector empresarial"
 HKG_support_the_business_desc: "Romper impuestos, desregulación y canal de crédito barato la capital de la ciudad directamente en las fábricas. Los desperdicios, aunque los deportados cesan el presupuesto y rifan las plumas políticas."
 legco_motion_reform_status_quo: "Mantener el Quo de Estado Electoral"
 legco_motion_reform_gradual: "Reforma Electoral Gradual y Ordenada"
 legco_motion_reform_universal: "Sufragio universal"
 HKG_china_dominant_influence_tt: "§Y[CHI.GetNameWithFlag]§! es el mayor influencer en [ROOT.GetNameWithFlag] con más del 80% de influencia"