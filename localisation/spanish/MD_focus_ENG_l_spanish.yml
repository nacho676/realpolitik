 ENG_royal_navy_Idea5: "Marina real británica"
 ENG_royal_navy_Idea5_desc: "La Marina Real Británica es una de las principales fuerzas marítimas del mundo, con un legado histórico que data de siglos atrás. Renombrada por su adaptabilidad y proeza tecnológica, la Armada Real desempeña un papel crucial para salvaguardar los intereses marítimos del Reino Unido y proyectar el poder a nivel mundial."
 ENG_british_foregin_legion_idea: "Legión Extranjera Británica"
 ENG_british_foregin_legion_idea_desc: "Permitimos que soldados de todo el mundo se unan a los militares británicos para perseguir intereses británicos."
 ENG_field_army_expansion_idea: "Expansión del Ejército de Campo"
 ENG_field_army_expansion_idea_desc: "El ejército ampliado sobre el terreno tiene por objeto destacar en diversos entornos operacionales, desde la guerra convencional hasta las misiones de mantenimiento de la paz. Esta iniciativa se alinea con la estrategia de defensa más amplia del Reino Unido, enfatizando la disponibilidad, movilidad e interoperabilidad con las fuerzas aliadas. Al invertir en el crecimiento y modernización de su ejército sobre el terreno, el Reino Unido refuerza su compromiso de mantener una fuerza terrestre versátil y ágil capaz de hacer frente a las amenazas cambiantes del siglo XXI."
 ENG_multi_ocean_training: "Capacitación en diversos océanos"
 ENG_multi_ocean_training_desc: "Este programa estratégico se centra en mejorar las capacidades y la preparación de la Armada Real mediante ejercicios especializados de capacitación, simulaciones y escenarios del mundo real. Al exponer al personal naval a los desafíos singulares planteados por diferentes océanos, desde el Atlántico hasta el Pacífico y más allá, esta iniciativa garantiza la adaptabilidad, la versatilidad y las operaciones marítimas eficaces a escala mundial."
 ENG_carrier_wing_procurement: "Transporte de aeronaves"
 ENG_carrier_wing_procurement_desc: "La iniciativa Ampliada de adquisición de vehículos aéreos pone de relieve el compromiso del Reino Unido de reforzar las capacidades de energía aérea de sus portaaviones de clase Queen Elizabeth. Este esfuerzo estratégico consiste en la adquisición y ampliación de aeronaves basadas en el porteador, centrándose en plataformas avanzadas para mejorar el alcance operacional y la versatilidad del ala de transporte aéreo. La iniciativa de adquisición incluye la integración de aeronaves de vanguardia, como el F-35B Lightning II, junto con los activos de apoyo y reconocimiento. Esta expansión está diseñada para fortalecer las capacidades de los transportistas de aeronaves, asegurando un formidable grupo de ataque aéreo que pueda operar en todo un espectro de misiones."
 ENG_strategic_aircraft_strategy_idea: "Estrategia estratégica de las aeronaves"
 ENG_strategic_aircraft_strategy_idea_desc: "La Estrategia de Aviación Estratégica tiene por objeto garantizar que el Reino Unido mantenga una flota sólida y capaz de aeronaves estratégicas que puedan apoyar eficazmente los objetivos nacionales de defensa, contribuir a los esfuerzos internacionales de seguridad y adaptarse a las amenazas emergentes en el entorno de seguridad mundial."
