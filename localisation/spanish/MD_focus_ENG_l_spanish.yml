 ENG_john_reith_hc_trait: "Comandante de la OTAN"
 ENG_royal_armed_forces_review: "A Examen de las Fuerzas Reales"
 ENG_royal_armed_forces_review_desc: "Las Fuerzas Armadas de la Corona merecen más que un prestigio ceremonial. Un examen sistemático de la doctrina, las normas de capacitación y la preparación en los tres servicios reconstruirá a las Fuerzas Armadas Reales en una fuerza de lucha creíble digna de la monarquía."
 ENG_household_division_revival: "Renacimiento de la división del hogar"
 ENG_household_division_revival_desc: "La División de Hogares ha sido desde hace mucho tiempo la cabecera del Ejército Británico. Revivir sus tradiciones y ampliar su papel restablece un núcleo de élite de tropas cuya calidad, disciplina y esprit de corps los separan de la fuerza general."
 ENG_jewel_of_the_admiralty: "Joya del Almirantazgo"
 ENG_jewel_of_the_admiralty_desc: "La Armada Real es el símbolo más antiguo de la proyección eléctrica británica. Reinvertir en sus buques de capital, ampliar su rango operativo y reconstruir sus señales culturales institucionales al mundo que Britannia todavía gobierna las olas."
 ENG_wings_of_the_crown: "Alas de la Corona"
 ENG_wings_of_the_crown_desc: "La Real Fuerza Aérea nació del crisol de la Primera Guerra Mundial y resultó decisiva en la Segunda. La inversión renovada en la capacitación piloto, la doctrina de combate aéreo y el desarrollo del as garantiza que la superioridad aérea siga siendo una piedra angular de la defensa británica."
 ENG_imperial_general_staff_restored: "Restablecido el Estado Mayor Imperial"
 ENG_imperial_general_staff_restored_desc: "El Estado Mayor Imperial una vez coordinó la tierra, el mar y el aire a través de un imperio global. Restaurar una estructura de mando conjunta unificada coloca a las fuerzas armadas bajo una única visión estratégica, maximizando su eficacia combinada."
 ENG_reservist_corps_act: "Ley del Cuerpo de Reservistas"
 ENG_reservist_corps_act_desc: "Las fuerzas de reserva británicas han sido durante mucho tiempo un activo infrautilizado. Una nueva Ley del Cuerpo de Reservistas formaliza objetivos de reclutamiento, acelera los procedimientos de movilización y vincula las unidades de reserva más estrechamente con sus homólogos regulares del ejército."
 ENG_global_anglosphere_initiative: "La iniciativa mundial de la Anglosfera"
 ENG_global_anglosphere_initiative_desc: "Las naciones de habla inglesa comparten más que un lenguaje común: comparten tradiciones jurídicas, instituciones democráticas y vínculos históricos forjados a lo largo de siglos. Una iniciativa coordinada de la Anglosfera da a la Corona una plataforma diplomática para profundizar estos vínculos y fortalecer la influencia británica desde Ottawa hasta Canberra."
 ENG_crown_realm_status: "Corona Real"
 ENG_crown_realm_status_desc: "Esta nación reconoce al monarca británico como jefe de estado. El acuerdo constitucional proporciona estabilidad política y estrechos lazos del Commonwealth."
 ENG_crown_realm_monthly_influence_tt: "Influencia mensual británica: §R+4%§!"
 ENG_crown_diplomatic_corps: "Diplomatic Corps"
 ENG_crown_diplomatic_corps_desc: "Un cuerpo dedicado de enviados reales, extraído del mejor talento diplomático que Gran Bretaña puede ofrecer, representará los intereses de la Corona directamente en tribunales y capitales extranjeros. Su mandato es mejorar las relaciones, las negociaciones fluidas y asegurar que la voz de la Corona tenga peso en todos los rincones del mundo."
 ENG_royal_visits_abroad: "Visitas Reales en el extranjero"
 ENG_royal_visits_abroad_desc: "Una gira real bien preciada puede lograr lo que meses de diplomacia silenciosa no pueden. La presencia personal del monarca en el extranjero indica compromiso, genera buena voluntad y deja una impresión duradera tanto para los gobiernos como para las poblaciones."
 ENG_pax_britannica_reborn: "Pax Britannica Reborn"
 ENG_pax_britannica_reborn_desc: "El Pax Britannica del siglo XIX fue construido sobre la supremacía naval, el prestigio cultural y un alcance diplomático inigualable. Mediante el renacimiento de la monarquía, la reorientación de la Anglosfera y un renovado compromiso con el compromiso mundial, Gran Bretaña puede restaurar un equivalente moderno: una era de estabilidad infrascrita por el poder y propósito británicos."
 ENG_royal_visits.1.t: "Un Tour Real"
 ENG_royal_visits.1.d: "Los asesores del monarca presentan una lista corta de regiones donde un viaje real entregaría los mayores retornos diplomáticos. La elección determinará dónde se concentra el poder blando de Gran Bretaña y cuáles gobiernos se benefician de la atención personal de la Corona."
 ENG_royal_visits.1.a: "Gira por África"
 ENG_royal_visits.1.b: "Tour de Asia meridional y sudoriental"
 ENG_royal_visits.1.c: "Recorrido por Oriente Medio"
 ENG_royal_visits.1.e: "Tour por América Latina"
 ENG_crown_diplomatic_corps_idea: "Diplomatic Corps"
 ENG_crown_diplomatic_corps_idea_desc: "Un cuerpo activo de enviados reales está operando en el extranjero, manteniendo contactos personales con gobiernos extranjeros y facilitando la agenda diplomática de la Corona. Su presencia reduce el costo de mantener las relaciones y genera un flujo constante del capital político."
 ENG_army_field_exercise: "Ejercicio anual sobre el terreno"
 ENG_army_field_exercise_desc: "Las brigadas del Ejército Británico llevan a cabo ejercicios de campo a gran escala para agudizar las habilidades de armas combinadas y construir la preparación."
 ENG_army_engineering_corps: "Programa de ingeniería de combate"
 ENG_army_engineering_corps_desc: "La inversión en entrenamiento y equipo de ingeniería de combate mejora la capacidad del Ejército para operar en terrenos complejos."
 ENG_armoured_tactics_programme: "Programa de tácticas blindadas"
 ENG_armoured_tactics_programme_desc: "Los ejercicios que integran nuevos vehículos blindados con infantería y artillería agudizan la doctrina de la guerra moderna."
 ENG_energy_transition_programme: "Programa de transición energética"
 ENG_energy_transition_programme_desc: "Una estrategia intergubernamentales para acelerar el cambio a la energía con bajas emisiones de carbono fortalece la confianza pública y la inversión industrial."
 ENG_critical_materials_reserve: "Reserva de Materiales Críticos"
 ENG_critical_materials_reserve_desc: "Un arsenal respaldado por el gobierno de materiales industriales críticos aísla la fabricación británica de las perturbaciones de la cadena de suministro."
 ENG_research_excellence_awards: "Premios de Excelencia de Investigación"
 ENG_research_excellence_awards_desc: "Los premios competitivos para universidades e institutos de investigación impulsan avances en electrónica y tecnología digital."
 ENG_case_by_case_intervention_desc: "No podemos simplemente renunciar a nuestra capacidad de tener una palabra en asuntos de importancia pública simplemente porque deshonramos un gobierno más grande. Pero más bien debemos mirar cada caso individualmente y trabajar hacia una mejor solución."
 ENG_the_wonga_coup: "La lista de Wonga"
 ENG_the_wonga_coup_desc: "Guinea Ecuatorial está situada en lo alto de vastas reservas petroleras que los financistas británicos, incluyendo cifras de alto perfil como Mark Thatcher hijo del ex Primer Ministro Margaret Thatcher, desean garantizar el derecho preferencial al petróleo a $STATE_319$. Teodoro Obiang Nguema Mbasogo está en una posición aislada, y el líder de oposición Severo Moto Nsá parece ser una alternativa preferible. Para lograrlo, los conspiradores pretenden utilizar mercenarios para derrocar a Obiang e instalar Moto como presidente.  "
 britain_md.40.t: "Mercenarios detenidos en el aeropuerto de Harare"
 britain_md.40.d: "Las autoridades han detenido a un grupo de hombres fuertemente armados en el aeropuerto internacional de Harare. Oficialmente afirman ser contratistas de seguridad que compran equipo para operaciones mineras en la República Democrática del Congo, pero los informes de inteligencia sugieren que pueden estar preparando una operación contra el gobierno de Guinea Ecuatorial."
 britain_md.40.a: "Estarán bajo custodia."
 britain_md.40.b: "Liberenlos silenciosamente"
 britain_md.41.t: "Los Fails de Coup Wonga"
 britain_md.41.d: "Las autoridades de Zimbabwe han detenido a más de sesenta presuntos mercenarios, encabezados por Simon Mann, después de que sus aviones aterrizaron en el aeropuerto internacional de Harare. Los oficiales afirman que el grupo estaba tratando de comprar equipo militar antes de continuar hacia Guinea Ecuatorial. Las acusaciones que vinculan a los financieros británicos con la trama han terminado en vergüenza para nosotros."
 britain_md.41.a: "Un resultado desafortunado."
 britain_md.42.t: "Éxito del Wonga Coup"
 britain_md.42.d: "La operación ha tenido éxito. El presidente Teodoro Obiang Nguema Mbasogo ha sido derrocado y el líder opositor Severo Moto Nsá se ha declarado jefe de un nuevo gobierno. Mientras nos enfrentamos a la condena internacional, los intereses comerciales británicos ahora gozan de influencia sin precedentes en una de las naciones más ricas en petróleo de África."
 britain_md.42.a: "Una inversión rentable."
 britain_md.43.t: "Parcela extranjera cruda"
 britain_md.43.d: "Las autoridades han confirmado informes de que mercenarios extranjeros se proponían derrocar al gobierno e instalar la figura opositora Severo Moto Nsá como presidente. Gracias a las detenciones en Zimbabwe, la conspiración ha sido desmantelada antes de llegar a nuestras costas."
 britain_md.43.a: "La República está en pie"
 britain_md.44.t: "La caída de Obiang"
 britain_md.44.d: "El presidente Teodoro Obiang Nguema Mbasogo ha sido eliminado del poder después de que fuerzas mercenarias y partidarios de la oposición se apoderaron del control de Malabo y otras posiciones clave del gobierno. Severo Moto Nsá ha asumido el liderazgo de un nuevo gobierno de transición."
 britain_md.44.a: "Oh my"
 britain_md.45.t: "British Financed Mercenaries Topples Gobierno en Guinea Ecuatorial"
 britain_md.45.d: "El presidente Teodoro Obiang Nguema Mbasogo ha sido eliminado del poder después de que fuerzas mercenarias y partidarios de la oposición se apoderaron del control de Malabo y otras posiciones clave del gobierno. Severo Moto Nsá ha asumido el liderazgo de un nuevo gobierno de transición."
 britain_md.45.a: "Un destino de vacaciones inusual."
 britain_md.46.t: "Mercenarios arrestados en Zimbabwe"
 britain_md.46.d: "Las autoridades de Zimbabwe han detenido a más de sesenta presuntos mercenarios después de que sus aviones aterrizaran en el aeropuerto internacional de Harare. Los oficiales afirman que el grupo estaba tratando de comprar equipo militar antes de continuar hacia Guinea Ecuatorial. The men, reportedly led by former British Army officer Simon Mann, insist they were providing security services for mining operations in Central Africa. Sin embargo, los investigadores alegan que formaban parte de una conspiración más grande para derrocar al presidente Teodoro Obiang Nguema Mbasogo de Guinea Ecuatorial."
 britain_md.46.a: "Un destino de vacaciones inusual."
 ENG_british_attempted_coup_on_us: "Wonga Coup"
 ENG_british_loyalist: "La Administración de Motos"
 ENG_british_loyalist_trade: "Concesiones de petróleo británicas (trade)"
 raid_type_ENG_Wonga_Coup: "Operación Epic-Up"
 raid_type_ENG_Wonga_Coup_desc: "La operación Epic Fuck-Up está destinada a ser cualquier cosa, pero. Una pequeña fuerza de mercenarios, financieros y aliados locales intentará eliminar el gobierno de Guinea Ecuatorial e instalar una administración más favorable."
 ENG_seize_oil_wonga_coup_TT: "§HDesbloquea nuevo Raid§!: Operación Epic-Up\n - [ENG.GetFlag] Unidades de fuerzas especiales británicas serán capaces de moverse y oustarse [EGU.GetLeader] desde [EGU.GetFlag] Guinea Ecuatorial, sustituyéndolo por un [ENG.GetFlag] El fuerte británico Severo Moto Nsá.\n\nSi la Operación Epic Fuck-Up tiene éxito\n - Aprovecharemos sus recursos. §H$STATE_319$§! (Eso es aceite, si eres demasiado perezoso para mirar)"
 ENG_defence_industry_modifier: "Gran Bretaña industrial de defensa"
 ENG_good_friday_agreement: "Acuerdo de Viernes Santo"
 ENG_good_friday_agreement_desc: "Firmado el 10 de abril de 1998, el Acuerdo del Viernes Santo es una serie de acuerdos más pequeños que pusieron fin a la mayor parte de la violencia relacionada con el conflicto sobre el estatuto de Irlanda del Norte. Los sindicalistas, también conocidos como leales, que son en su mayoría protestantes de Ulster quieren permanecer dentro del Reino Unido. Por el contrario, republicanos y nacionalistas irlandeses que son en su mayoría católicos irlandeses, trataron de salir del Reino Unido y unirse a una Irlanda unida. Si bien puede parecer implícito que el conflicto fuera de naturaleza teológica, pero era más bien político y nacional, y la religión desempeñaba en gran medida el papel de identidad. En virtud del Acuerdo Multipartidista, se restableció el autogobierno a Irlanda del Norte en forma de un acuerdo de reparto del poder entre nacionalistas irlandeses y camarillas sindicalistas con respeto. Las reformas promulgadas en virtud del acuerdo van desde la reestructuración de la policía hasta el desarme de las organizaciones paramilitares. Estas medidas esperan sentar las bases para una Irlanda más estable y pacífica. El futuro de Irlanda del Norte es ahora una pregunta que Westminster puede resolver en lugar de simplemente manejar, y las rutas para establecerlo se encuentran bajo §HDevolved Matters§!."
 ENG_State_17_Paramilitary_Activity: "Actividad paramilitares:"
 ENG_State_17_Paramilitary_Activity_desc: "A pesar de los avances logrados por el Acuerdo del Viernes Santo, numerosas organizaciones paramilitares republicanas y leales siguen activos en toda Irlanda del Norte. Si bien muchos han declarado oficialmente la cesación del fuego, estos grupos siguen manteniendo estructuras, arsenales de armas e influencia dentro de las comunidades locales. Muchos están involucrados en la delincuencia organizada, incluyendo contrabando, narcóticos, extorsión y ataques de castigo. \n\n§YSe eliminará si ya no controlamos $STATE_17$.§!"
 ENG_additional_expenditure_goodfriday_TT: "Gastos adicionales: §R+0.03%§! del PIB\nGasto policial esperado: §R+0,15%§!\nEstabilidad: §G+10.00%§!\n\nReduce todas las penas de §Y Tensiones Sectoriales§! por §G20%§!.\n\nDesde el nivel de Tensiones sectarias:\n$ENG_additional_expenditure_goodfriday_info_TT$\n--------------\n§Y La solución de la cuestión de Irlanda del Norte§!\nLos paramilitares deben ser decomisados antes de que se pueda plantear la cuestión constitucional. Todas las rutas se encuentran en §HDevolved Matters§!.\n\n§H Convocar una encuesta fronteriza§! - Nacionalismo irlandés del Norte por encima de §G55§! (actualmente §Y[?ENG_north_irish_nationalists|0]§!). A Sí cedes de voto $STATE_17$ a Irlanda.\n§H Un Dominio de toda la isla§! - con Irlanda como nuestro sujeto y la devolución irlandesa del Norte se resolvió, $STATE_17$ pasa a Dublín mientras Irlanda sigue siendo nuestra.\n§HRepetir el Acuerdo§! - termina los pagos inmediatamente, restaura el peso total de la Tensión sectaria, y Ulster aumentará.\n--------------\n§gEste Espíritu nacional será removido si ya no somos dueños $STATE_17$.§!"
 ENG_additional_expenditure_goodfriday_state_TT: "Del nivel de Tensiones sectarias: (§Y[?ENG_north_irish_agitation]§!/§R100§!\n- Garrisons requeridas: §R+[?ENG_Paramilitary_required_garrison]%§!\n- Factor de crecimiento de la productividad del Estado: §R[?ENG_Paramilitary_state_productivity_growth]%§!\n- local fábrica sabotaje oportunidad: §R[?ENG_Paramilitary_local_factory_sabotage]%§!"
 ENG_the_macabre_alliance: "La Alianza Macabre"
 ENG_the_macabre_alliance_desc: "Desde finales de la década de 1980, BP lanzó una estrategia de frontera, una exploración de alto riesgo y de alta reverencia con el objetivo de invertir su constante disminución en sus reservas petroleras. 1991, BP golpeó oro cuando Casanare produjo el mayor descubrimiento petrolífero de la empresa en más de dos décadas. Pero con un alto riesgo de ataques guerrilleros. Justo en los últimos dos años, el Ejército de Liberación Nacional (ELN), una de las organizaciones guerrilleras colombianas, ha volado el oleoducto de Occidental Petroleum más de 460 veces, sangrando a la compañía americana seca. La Novena Brigada, una unidad especializada del ejército notoria por sus operaciones poco éticas, fue creada expresamente para proteger los intereses petroleros y se convirtió en el escuadrón de muerte personal de BP en Casanare. The Sixteenth Brigade was funded and collaborationd with Defence Systems Limited, a British private security contractor created by former SAS members with deep ties to the British Government. El Ministerio de Relaciones Exteriores dejó en claro su posición: BP funciona sin problemas, sea cual fuere el costo. El general Álvaro Velandia Hurtado lo llama «resolución de conflictos». Las familias de los muertos lo etiquetan otra cosa."
 ENG_additional_expenditure_Colombia_TT: "£corruption_cost_factor_texticon Poder político Costo para cambiar la corrupción: §R+15%§!\n--------------\n§YMilitary Aid§! targeting [COL.GetFlag] §YColombia§!:\n- Es más probable que lo acepten.\n- No requiere que sean amenazados.\n\n§YManipulate Politics§! targeting [COL.GetFlag] §YColombia§!:\n- Requisito de Influencia: §G20%§! (30% Base)\n- Poder político Costo: §G-25%§!\n\nRecibir §G20%§! del [COL.GetFlag] §Y Colombia§! ingresos de exportación de petróleo\n- Ingresos adicionales: £income_texticon $$[?additional_income_ENG_columbia_oil|+3]\n--------------\n§gEste Espíritu nacional será eliminado si Colombia elimina los carretes o si la corrupción es más alta que la corrupción de la luz (Nivel 2).§!"
 ENG_the_dissident_campaign: "Campaña disidente de IRA"
 ENG_the_dissident_campaign_desc: "Rechazar el Acuerdo de Viernes Santo, grupos republicanos disidentes, como el IRA Real y el IRA Continuidad, se niegan a reconocer la autoridad británica en Irlanda del Norte como legítima. El IRA Real partió del IRA Provisional en 1997, afirmando ser los verdaderos republicanos y denunciando el proceso de paz como una venta, viendo a los Provos como colaboradores que cambiaron la república por autoridad británica. El IRA de continuidad surgió antes, en 1986, tras una división por la decisión de Sinn Féin para poner fin al abstencionismo de Dáil Éireann, rechazando la dirección del liderazgo y manteniendo que el movimiento republicano existente había abandonado la verdadera reivindicación constitucional a la soberanía irlandesa. Ambas facciones rechazan la legitimidad del proceso de paz. Estos grupos sostienen una insurgencia de bajo nivel contra el gobierno británico a través de bombardeos, tiroteos y ataques dirigidos, mientras que también actúan como fuerzas del orden de facto en las fortalezas republicanas donde la Real Policía de Ulster tiene un control limitado. El desmantelamiento verificado bajo la Comisión Internacional Independiente puede poner fin a la campaña por el bien, y se ofrece bajo §HAsuntos evolucionados§! una vez que se haya reducido la tensión en la Provincia."
 ENG_additional_expenditure_goodfriday_info_TT: "§H$STATE_17$§! - Actividad paramilitares:\n$ENG_additional_expenditure_goodfriday_state_TT$"
 ENG_dissident_campaign_TT: "Nivel mensual de tensión sectaria del norte: §R+0.15§![ENG_dissident_campaign_active_loc]\n\n[ENG_no_longer_good_friday]\n--------------\n§YDesmantelamiento de los paramilitares§!\nLa decisión §HDesarrollar los paramilitares§! en relación con §HAsuntos Desvolvidos§! retira este espíritu para bien después de dos años de desarme verificado. Requiere el Acuerdo §Y Viernes Santo§! como su marco, y:\n- Tensión sectaria por debajo §G15§! (actualmente §Y[?ENG_north_irish_agitation|0]§!)\n- Dependencia de Irlanda del Norte por encima §G60§! (actualmente §Y[?ENG_north_irish_dependency|0]§!)\n- Desempleo por debajo §G10%§! (actualmente §Y[?total_unemployed_percentage_display|%]§!)\n\nDejar que la Tensión sectaria suba por encima §R25§! colapsa el proceso."
 ENG_operation_banner_TT: "\n"
 ENG_dissident_campaign_inactive_effect_TT: "\n\n§YLos efectos adicionales§! son actualmente §YInactivo§!.\nRequiere el desempleo por encima §Y10%§!\n\n§Y Efectos inactivos:§!\n- Nacionalismo irlandés mensual: §R+1.0§!\n- Gasto policial esperado: §R+0.05%§!\n--------------\n§g (nivel actual de desempleo [?total_unemployed_percentage_display|%])§!"
 ENG_dissident_campaign_active_effect_TT: "\n\nEstamos recibiendo lo siguiente debido a que el desempleo está por encima §R10%§!\n§YEfectos:§!\n- Nacionalismo irlandés mensual: §R+1.0§!\n- Gasto policial esperado: §R+0.05%§!\n--------------\n§g(Nivel actual de desempleo [?total_unemployed_percentage_display|%])§!\n"
