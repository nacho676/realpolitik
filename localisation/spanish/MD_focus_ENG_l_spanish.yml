 ENG_scottish_referendum_pressure: "Piden un referéndum escocés"
 ENG_scottish_referendum_pressure_desc: "El Parlamento escocés tiene una mayoría pro-independencia y el caso de la Unión ya no se está haciendo en ningún lugar donde el público pueda escucharlo. Se está redactando un proyecto de ley de referéndum en Holyrood. Westminster tiene un año para hacer que la cuestión constitucional parezca menos urgente que el proyecto de ley de electricidad, ya sea comprando buena voluntad en Escocia o haciendo que las finanzas de Escocia dependan visiblemente del Tesoro. Si la presión sigue por encima de los 60 años cuando la campaña madura, la demanda es formal y debemos responderla."
 ENG_scottish_pressure_defused_tt: "La presión de la independencia escocesa está por debajo §G50§!"
 ENG_north_irish_referendum_pressure: "Piden un referéndum fronterizo"
 ENG_north_irish_referendum_pressure_desc: "Los partidos nacionalistas tienen la llave en Stormont y presionan al Secretario de Estado para que fije una fecha para un referéndum fronterizo. La tensión sectaria y la capacidad de la Provincia de sostenerse a sí misma están sobre la mesa, y la República observa. Westminster tiene un año para bajar las cifras antes de que la demanda se vuelva formal."
 ENG_north_irish_pressure_defused_tt: "La presión de la independencia irlandesa del Norte está por debajo §G50§!"
 ENG_welsh_referendum_pressure: "Piden un referéndum galés"
 ENG_welsh_referendum_pressure_desc: "Una mayoría independentista en el Senedd prepara su propio proyecto de ley de referéndum. La independencia galesa se trató durante mucho tiempo como algo poco serio en Londres precisamente porque las cuentas nunca cuadraban; ese argumento solo se sostiene mientras las cuentas siguen siendo nuestras. Tenemos un año para volver a bajar la presión antes de que la demanda se vuelva formal."
 ENG_welsh_pressure_defused_tt: "La presión de la independencia de Gales está por debajo §G50§!"
 ENG_decommission_tension_tt: "La tensión sectaria está por debajo §G15§! (actualmente §Y [?ENG_north_irish_agitation|0]§!)"
 ENG_decommission_dependency_tt: "La Dependencia de Irlanda del Norte está por encima de §G60§! (actualmente §Y [?ENG_north_irish_dependency|0]§!)"
 ENG_decommission_unemployment_tt: "El desempleo está por debajo §G10%§! (actualmente §Y[?total_unemployed_percentage_display|%]§!"
 ENG_decommission_started_tt: "La Comisión inicia su labor. Dejar que la Tensión sectaria suba por encima §R25§! colapsará el proceso."
 ENG_border_poll_needs_peace_tt: "La campaña §YIRA Disident§! ha sido desmantelada"
 ENG_border_poll_nationalism_tt: "El nacionalismo irlandés septentrional está por encima de §G55§! (actualmente §Y [?ENG_north_irish_nationalists|0]§!)"
 ENG_dominion_tension_tt: "La tensión sectaria está por debajo §G10§! (actualmente §Y [?ENG_north_irish_agitation|0]§!)"
 ENG_dominion_dependency_tt: "La Dependencia de Irlanda del Norte está por encima de §G70§! (actualmente §Y [?ENG_north_irish_dependency|0]§!)"
 ENG_dominion_pressure_tt: "La presión de la independencia irlandesa del Norte está por debajo §G40§! (actualmente §Y [?ENG_north_irish_pressure|0]§!)"
 ENG_ulster_brink_defused_tt: "La tensión sectaria está por debajo §G20§! (actualmente §Y [?ENG_north_irish_agitation|0]§!)"
 ENG_border_poll_cooldown: "Recientemente se ha celebrado una encuesta fronteriza"
 ENG_referendum_region_scotland: "Scotland"
 ENG_referendum_region_northern_ireland: "Irlanda del Norte"
 ENG_referendum_region_wales: "Wales"
 ENG_referendum_region_none: "la Unión"
 ENG_union_settlement_referendum: "[GetYear] Referendo de liquidación sindical en [ENG_GetReferendumRegion]"
 ENG_union_settlement_referendum_desc: "Westminster ha puesto la cuestión constitucional al electorado en sus propios términos: un acuerdo permanente que termina el proceso de devolución, escribe el lugar de la región en el Reino Unido dentro del estatuto y cierra el camino hacia cualquier referéndum de independencia. La votación sigue siendo una votación, y las partes separatistas están haciendo campaña contra ella con todo lo que tienen. Un rechazo decisivo a la independencia lleva el acuerdo. Cualquier cosa menos deja la pregunta exactamente dónde estaba, con un gobierno que ha gastado su crédito y perdido.\n\nVotar para salir de la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_unionist_campaign_tour: "Tour de campaña sindicalista"
 ENG_unionist_campaign_tour_desc: "Poner al Gabinete en la carretera. Asambleas vecinales, fábricas, astilleros y sindicatos universitarios, cada día de la campaña, defendiendo el argumento en persona y no mediante un comunicado redactado en Londres. Mueve unos puntos y puede repetirse mientras los ministros aguanten.\n\nVoto a favor de abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_fiscal_settlement_offer: "Ofrecer un arreglo fiscal"
 ENG_fiscal_settlement_offer_desc: "Abrir el Tesoro. Una subvención global garantizada, proyectos de capital confirmados y no meramente prometidos y un piso bajo la fórmula de financiación, todo firmado antes del día de las elecciones. Los votantes que sopesan la independencia frente a sus finanzas domésticas lo notan, y la dependencia de la región de Westminster se profundiza con cada libra.\n\nVoto a favor de abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_discredit_separatists: "Desacreditar la campaña separatista"
 ENG_discredit_separatists_desc: "Filtrar información contra la dirigencia separatista. Sus planes monetarios, sus acuerdos fronterizos, sus finanzas y, si las filtraciones van por ahí, su vida privada. Funciona más a menudo que no, y cuando no funciona les da un agravio y un titular.\n\nVoto a favor de abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_discredit_separatists_tt: "§G60%§! azar la campaña aterriza y el apoyo para salir cae marcadamente.\n§R40%§! es probable que retroceda, levantando tanto el voto de licencia como la agitación local."
 ENG_further_devolution_pledge: "Prometida ulterior de la evolución"
 ENG_further_devolution_pledge_desc: "La última carta en la mano: una promesa firmada de que un voto a permanecer será contestado con nuevos poderes sobre impuestos, bienestar y radiodifusión. Se mueve el suave voto separatista y saca el calor de la política nacionalista para una generación, al precio de entregar las palancas Westminster tendría que mantener la región juntos la próxima vez.\n\nSe puede prometer una vez por campaña.\n\nVotar para salir de la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_referendum_leave_vote_down_4_tt: "Votar para salir de la Unión: §G-4§!"
 ENG_referendum_leave_vote_down_6_tt: "Votar para salir de la Unión: §G-6§!"
 ENG_referendum_leave_vote_down_7_tt: "Votar para salir de la Unión: §G-7§!"
 ENG_promote_unionism_scotland: "Defender la Unión en Escocia"
 ENG_promote_unionism_scotland_desc: "Financiar la organización de campo de los partidos unionistas en Escocia entre elecciones y no durante ellas: oficinas de distrito abiertas, candidatos reclutados en escaños que el partido había dado por perdidos y un argumento sostenido a favor de la Unión donde nadie se ha molestado en plantearlo en años. Lento, poco lucido y lo único que hace bajar el nacionalismo escocés.\n\nRequiere que la Agitación escocesa sea lo bastante baja como para que el argumento se escuche."
 ENG_scottish_unionism_calm_tt: "Agitación escocesa abajo §G25§! (actualmente §Y [?ENG_scottish_agitation|0]§!)"
 ENG_promote_unionism_nireland: "Defender la Unión en Irlanda del Norte"
 ENG_promote_unionism_nireland_desc: "Financiar la organización cívica unionista en Irlanda del Norte fuera de la temporada de marchas: proyectos comunitarios en las zonas de interfaz, planes de empleo intercomunitarios y candidatos que puedan sostener un escaño sin hacer campaña sobre la frontera. Trabajo lento y lo único que hace bajar el nacionalismo norirlandés.\n\nRequiere que la Tensión sectaria sea lo bastante baja como para que el argumento se escuche."
 ENG_north_irish_unionism_calm_tt: "La tensión sectaria está por debajo §G25§! (actualmente §Y [?ENG_north_irish_agitation|0]§!)"
 ENG_promote_unionism_wales: "Defender la Unión en Gales"
 ENG_promote_unionism_wales_desc: "Financiar la organización de los partidos unionistas en Gales: trabajo de distrito en los valles, campañas en galés que no cedan el idioma a los nacionalistas y un argumento positivo a favor de la Unión en lugar de un argumento de que las cuentas no salen. Lento, y lo único que hace bajar el nacionalismo galés.\n\nRequiere que la Agitación galesa sea lo bastante baja como para que el argumento se escuche."
 ENG_wales_unionism_calm_tt: "Agitación de Gales está por debajo §G25§! (actualmente §Y [?ENG_wales_agitation|0]§!)"
 ENG_convene_constitutional_convention: "Convocar una convención constitucional"
 ENG_convene_constitutional_convention_desc: "El acuerdo constitucional de 1998 fue escrito con prisa, por personas que esperaban renegociarlo más tarde, y más adelante ha llegado. Convocar una convención multipartidista sobre la forma futura de la Unión: las administraciones rotatorias, las bancas frontales de la oposición, las iglesias y los sindicatos, sentados durante seis meses y informando al Parlamento en lugar del Gabinete.\n\nLa convención no decide nada por sí misma. Su informe es la base jurídica y política sobre la que Westminster puede establecer un acuerdo permanente con Escocia, Irlanda del Norte o Gales, y sin nadie ninguna oferta de asentamiento sería tomada en serio por cualquiera.\n\nRequiere un gobierno lo suficientemente estable como para sobrevivir al argumento, y ninguna campaña de referéndum o independencia ya en marcha."
 ENG_scottish_union_settlement: "Proponer un arreglo de unión para Escocia"
 ENG_scottish_union_settlement_desc: "Con la política escocesa tranquila, las finanzas escocesas ligadas al Tesoro y los partidos de independencia en su más débil, Westminster puede poner la cuestión constitucional a Escocia en sus propios términos en lugar de esperar a que se le haga. Un acuerdo aprobado en la urna termina el proceso de devolución permanentemente: el lugar de Escocia en el Reino Unido está escrito en estatuto, la maquinaria del referéndum es desmantelada y Holyrood deja de ser una ruta fuera de la Unión.\n\nUn acuerdo no cambia nada, y cuesta una década antes de que pueda ser juzgado nuevamente.\n\nPresión de la independencia: §Y[?ENG_scottish_pressure|0]§!/§G20§!\nNacionalismo escocés: §Y[?ENG_scottish_nationalists|0]§!/§G25§!"
 ENG_scottish_settlement_calm_tt: "La presión de la independencia escocesa está por debajo §G20§! (actualmente §Y [?ENG_scottish_pressure|0]§!)"
 ENG_scottish_settlement_ready_tt: "El nacionalismo escocés está por debajo §G25§! (actualmente §Y [?ENG_scottish_nationalists|0]§!)"
 ENG_north_irish_union_settlement: "Proponer un arreglo de unión para Irlanda del Norte"
 ENG_north_irish_union_settlement_desc: "Con los disidentes desmantelados, la política de la Provincia tranquila y republicana en su más débil, Westminster puede poner la cuestión constitucional a Irlanda del Norte en sus propios términos. Un acuerdo aprobado en la urna termina el proceso de devolución permanentemente y cierra la votación fronteriza como una ruta hacia fuera de la Unión.\n\nUn acuerdo no cambia nada, y cuesta una década antes de que pueda ser juzgado nuevamente.\n\nPresión de la independencia: §Y[?ENG_north_irish_pressure|0]§!/§G20§!\nNacionalismo irlandés del Norte: §Y[?ENG_north_irish_nationalists|0]§!/§G25§!"
 ENG_north_irish_settlement_calm_tt: "La presión de la independencia irlandesa del Norte está por debajo §G20§! (actualmente §Y [?ENG_north_irish_pressure|0]§!)"
 ENG_north_irish_settlement_ready_tt: "El nacionalismo irlandés septentrional está por debajo §G25§! (actualmente §Y [?ENG_north_irish_nationalists|0]§!)"
 ENG_welsh_union_settlement: "Proponer un arreglo de unión para Gales"
 ENG_welsh_union_settlement_desc: "Con la política de Welsh tranquila y el margen de independencia del Senedd marginal, Westminster puede resolver la cuestión constitucional en Gales antes de que alguien más lo plantee. Un acuerdo aprobado en la urna termina el proceso de devolución permanentemente y escribe el lugar de Wales en el Reino Unido en ley.\n\nUn acuerdo no cambia nada, y cuesta una década antes de que pueda ser juzgado nuevamente.\n\nPresión de la independencia: §Y[?ENG_wales_pressure|0]§!/§G20§!\nNacionalismo de Gales: §Y[?ENG_wales_nationalists|0]§!/§G25§!"
 ENG_wales_settlement_calm_tt: "La presión de la independencia de Gales está por debajo §G20§! (actualmente §Y [?ENG_wales_pressure|0]§!)"
 ENG_wales_settlement_ready_tt: "El nacionalismo de Gales está por debajo §G25§! (actualmente §Y [?ENG_wales_nationalists|0]§!)"
 devolution.11.t: "[ENG_GetReferendumRegion] Votos para salir"
 devolution.11.d: "El conteo está terminado y el resultado no es en duda. Una mayoría ha votado para salir del Reino Unido, y el gobierno que llamó al referéndum está obligado a darle efecto. Las negociaciones sobre la defensa, la deuda, la moneda y la frontera comienzan de inmediato, y el primer acto es el constitucional: la transferencia de poderes que Westminster pasó una generación negándose a conceder es ahora una transferencia de soberanía."
 devolution.11.a: "El resultado se mantiene."
 devolution.12.t: "La Unión tiene"
 devolution.12.d: "La campaña de licencia ha perdido. La participación fue alta, el margen es suficientemente claro que nadie creíble lo está impugnando, y la cuestión constitucional se cierra para una generación por los términos simples de la votación. Los partidos separatistas se reagruparán, y la amargura de una campaña perdedora tardará años en resolverse, pero el Reino Unido está intacto y Westminster tiene una respuesta para la próxima vez que se plantee la demanda."
 devolution.12.a: "Una vez en una generación."
 devolution.13.t: "El acuerdo está aprobado"
 devolution.13.d: "El acuerdo ha llevado. [ENG_GetReferendumRegion] ha votado para cerrar la cuestión constitucional sobre los términos de Westminster: el proceso de devolución termina aquí, el lugar de la región en el Reino Unido descansa en un mandato en vez de en una ley que un futuro Parlamento podría derogar, y no hay más referéndum a ser llamado. Los partidos nacionalistas se quedan discutiendo contra un resultado que sus propios votantes dieron."
 devolution.13.a: "La pregunta se resuelve."
 devolution.14.t: "La liquidación es rechazada"
 devolution.14.d: "El acuerdo ha sido rechazado. Pedir a una región que excluya su derecho a pedir de nuevo fue leído exactamente como los separatistas dijeron que sería, y la campaña les ha dado el argumento que habían estado fallando en hacer durante años. Nada cambia constitucionalmente, el dinero y el capital político se han ido, y la pregunta que Westminster trató de cerrar es ahora más fuerte de lo que era."
 devolution.14.a: "Un error costoso."