 ENG_auxiliary_navy1: "Real Armada Auxiliar"
 ENG_auxiliary_navy1_desc: "El concepto de la Armada Real Auxiliar subraya la importancia del apoyo civil en las operaciones navales, destacando los esfuerzos de colaboración entre el personal militar y civil para garantizar la eficacia y disposición de la Marina Real en el cumplimiento de sus responsabilidades marítimas."
 ENG_auxiliary_navy2: "Real Armada Auxiliar"
 ENG_auxiliary_navy2_desc: "El concepto de la Armada Real Auxiliar subraya la importancia del apoyo civil en las operaciones navales, destacando los esfuerzos de colaboración entre el personal militar y civil para garantizar la eficacia y disposición de la Marina Real en el cumplimiento de sus responsabilidades marítimas."
 ENG_royal_army1: "Ejército Real Británico"
 ENG_royal_army1_desc: "El Ejército Británico es la rama de guerra terrestre de las Fuerzas Armadas Británicas, que sirve como principal fuerza militar terrestre para el Reino Unido. Con una rica historia de siglos, el Ejército Británico es reconocido por su profesionalidad, adaptabilidad y eficacia operativa. El ejército está equipado con soldados altamente capacitados de diversos orígenes para llevar a cabo una amplia gama de misiones, incluidas operaciones de combate, misiones de mantenimiento de la paz, actividades de socorro en casos de desastre y tareas de asistencia humanitaria."
 ENG_royal_army2: "Ejército Real Británico"
 ENG_royal_army2_desc: "El Ejército Británico es la rama de guerra terrestre de las Fuerzas Armadas Británicas, que sirve como principal fuerza militar terrestre para el Reino Unido. Con una rica historia de siglos, el Ejército Británico es reconocido por su profesionalidad, adaptabilidad y eficacia operativa. El ejército está equipado con soldados altamente capacitados de diversos orígenes para llevar a cabo una amplia gama de misiones, incluidas operaciones de combate, misiones de mantenimiento de la paz, actividades de socorro en casos de desastre y tareas de asistencia humanitaria."
 ENG_royal_army3: "Ejército Real Británico"
 ENG_royal_army3_desc: "El Ejército Británico es la rama de guerra terrestre de las Fuerzas Armadas Británicas, que sirve como principal fuerza militar terrestre para el Reino Unido. Con una rica historia de siglos, el Ejército Británico es reconocido por su profesionalidad, adaptabilidad y eficacia operativa. El ejército está equipado con soldados altamente capacitados de diversos orígenes para llevar a cabo una amplia gama de misiones, incluidas operaciones de combate, misiones de mantenimiento de la paz, actividades de socorro en casos de desastre y tareas de asistencia humanitaria."
 ENG_royal_airforce1: "Los fantasmas de la Real Fuerza Aérea"
 ENG_royal_airforce1_desc: "A pesar de su historia histórica, la Fuerza Aérea Real Anticuada (RAF) refleja una era de equipo envejecido y capacidades limitadas. Atracado por aeronaves obsoletas y esfuerzos insuficientes de modernización, este espíritu nacional simboliza los desafíos de mantener la superioridad del aire con tecnología anticuada. Sin embargo, en medio de estas limitaciones, el espíritu del legado de la RAF soporta, inspirando resistencia y determinación para adaptarse y superar."
 ENG_royal_airforce2: "Modernización de la Fuerza Aérea Real"
 ENG_royal_airforce2_desc: "La Fuerza Aérea Real Modernizadora representa un cambio estratégico para revitalizar las capacidades de la fuerza aérea mediante esfuerzos amplios de modernización. Este espíritu nacional, centrado en el mejoramiento de las aeronaves, la mejora de las capacidades tecnológicas y la inversión en sistemas de vanguardia, refleja un enfoque proactivo para asegurar que la RAF permanezca a la vanguardia de la superioridad aérea en el espacio de batalla en evolución."
 ENG_royal_airforce3: "Fuerza Aérea Real Modernizada"
 ENG_royal_airforce3_desc: "Centrada en la superioridad aérea y la respuesta rápida, la Fuerza Aérea Real Modernizada representa una fuerza formidable equipada con aviones de combate de vanguardia y capacidades avanzadas de combate. Con luchadores ágiles capaces de dominar los cielos y adversarios atractivos con velocidad y precisión inigualables, este espíritu nacional ejemplifica el compromiso del RAF de mantener la superioridad aérea y defender los intereses nacionales con proeza aérea inigualable."
 ENG_royal_airforce4: "Fuerza Aérea Real Modernizada"
 ENG_royal_airforce4_desc: "La Fuerza Aérea Real Modernizada anuncia una nueva era de proyección estratégica de la fuerza aérea, caracterizada por aviones bombarderos de última generación y capacidades de ataque de precisión. Con bombarderos avanzados equipados para misiones de largo alcance y municiones guiadas por precisión, este espíritu nacional subraya la capacidad del RAF de realizar ataques aéreos decisivos y precisos contra objetivos de alto valor, proyectando poder y disuadiendo a los adversarios con una precisión incomparable."
 ENG_royal_airforce5: "Fuerza Aérea Real Modernizada"
 ENG_royal_airforce5_desc: "La Fuerza Aérea Real Modernizada anuncia una nueva era de proyección estratégica de la fuerza aérea, caracterizada por aviones bombarderos de última generación y capacidades de ataque de precisión. Con bombarderos avanzados equipados para misiones de largo alcance y municiones guiadas por precisión, este espíritu nacional subraya la capacidad del RAF de realizar ataques aéreos decisivos y precisos contra objetivos de alto valor, proyectando poder y disuadiendo a los adversarios con una precisión incomparable."
 ENG_airbus_expansion: "Expansión de Airbus"
 ENG_airbus_expansion_desc: "La Expansión Airbus subraya el compromiso de la empresa con la innovación, excelencia y satisfacción del cliente, al tiempo que contribuye al desarrollo económico, la creación de empleo y el avance tecnológico en la industria aeroespacial británica."
 ENG_homegrown_innovation: "Innovación casera"
 ENG_homegrown_innovation_desc: "Channel Homegrown Innovation pretende fomentar una cultura de innovación y emprendimiento dentro de los sectores aeroespacial y de aviación del Reino Unido."
 ENG_homegrown_innovation_us1: "US-UK innovación de la fuerza aérea Colaboración"
 ENG_homegrown_innovation_us1_desc: "Estados Unidos está trabajando con el Reino Unido para innovar la Fuerza Aérea"
 ENG_joint_strike_fighter_project_US1: "US-UK innovación de la fuerza aérea Colaboración"
 ENG_joint_strike_fighter_project_US1_desc: "Estados Unidos está trabajando con el Reino Unido para innovar la Fuerza Aérea"
 ENG_trans_atlantic_defence: "Defensa Transatlántica"
 ENG_harmony_doctrine_idea: "Armonía Doctrina"
 ENG_harmony_doctrine_idea_desc: "La Doctrina de Armonía trata el equilibrio ambiental como un interés nacional, alineando la influencia de la Corona detrás de la administración de tierra, agua y resiliencia climática. Impulsa al gobierno y a la industria hacia una producción sostenible, energía limpia y conservación a largo plazo sin sacrificar la estabilidad. Gran Bretaña prosperará viviendo dentro de sus medios, y el Palacio insistirá en que la naturaleza es parte de la artesanía estatal."
