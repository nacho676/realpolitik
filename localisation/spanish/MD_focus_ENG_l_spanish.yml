 ENG_unlock_the_next_era_TT: "Transferencia de la voluntad [IOM.GetFlag] Isla del Hombre a la [ADS.GetFlag] §HAlbionis Defense Forces§!\n - Este será un nuevo grupo de PMC bajo nuestro control directo\n - Seremos capaces de utilizarlos para dividir la OTAN usándolos para reclutar, sobornar y persuadir a líderes militares, políticos y civiles en estados de la OTAN\n - Serán financiados por nuestro presupuesto y tendrán su propio ejército profesional permanente"
 ENG_raid_enalbed_TT: "§HDesbloquea nuevo Raid§!: Operación Guardia Delta\n - Seremos capaces de entrar y apoderarnos [NIG.GetFlag] Campos petroleros nigerianos que rodean el Delta\n £text_icon_kaldanger If [NIG.GetFlag] Nigeria toma represalias, podemos tener una guerra prolongada en nuestras manos"
 ENG_raid_enabled_2_TT: "§HDesbloquea nuevo Raid§!: Operación Salvaguardia\n - [ENG.GetFlag] Unidades de fuerzas especiales británicas podrán entrar y derrocar al dictador [ZIM.GetFlag] Zimbabwe, sustituyéndolo por un [ENG.GetFlag] Hombre fuerte respaldado por los británicos."
