l_spanish:
 united_kingdom_focus: "Árbol de enfoque del Reino Unido"
 ENG_royal_army: "Ejército británico"
 ENG_royal_army_desc: "El Ejército británico es la principal fuerza terrestre de las Fuerzas Armadas Británicas y sus orígenes se remontan a los ejércitos escocés e inglés en 1707, cuando se unieron en el Acta de Unión. Ha participado en casi todas las guerras importantes, incluidas la Guerra de los Siete Años, la Guerra Revolucionaria, las Guerras Napoleónicas, la Guerra de Crimea y la Primera y Segunda Guerra Mundial. En este tiempo, ha evolucionado desde una fuerza principalmente de infantería a una fuerza altamente avanzada y mecanizada con diversos elementos de apoyo y sus fuerzas especiales de clase mundial, que han servido como punto de referencia para otros servicios internacionales."
 ENG_irish_referendum: "[GetYear] Referéndum de independencia de [NIR.GetFlag] Irlanda del Norte"
 ENG_irish_referendum_desc: "El [NIR.GetFlag] pueblo irlandés del Norte votará sobre un referéndum que determinará su futuro como nación, constitutiva y jugador en la Isla Británica. La campaña dura hasta el día de las encuestas, y el resultado será cualquier opinión irlandesa del Norte se ha convertido para el momento en que se cuenta. Westminster puede gastar capital político y dinero del Tesoro para moverlo.\n\nVotar para salir de la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_scottish_referendum: "[GetYear] Referéndum [SCO.GetFlag] escocés por la independencia"
 ENG_scottish_referendum_desc: "El [SCO.GetFlag] pueblo escocés votará sobre un referéndum que determinará su futuro como nación, constitutiva y jugador en la Isla Británica. La campaña funciona hasta el día de las encuestas, y el resultado será cualquier opinión escocesa se ha convertido para el momento en que se cuenta. Westminster puede gastar capital político y dinero del Tesoro para moverlo.\n\nVotar para salir de la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 britain_md.1.t: "Nuestra ambición para Gran Bretaña"
 britain_md.1.d: "El pueblo ha hablado y se ha decidido que el Partido Laborista es el partido elegido por el pueblo para que lo represente en el futuro. Nuestra visión y ambición de que Gran Bretaña sea verdaderamente lo mejor que puede ser no tiene límites, y comenzaremos a abordar las cuestiones de nuestra gran unión de inmediato."
 britain_md.2.t: "¿Aprovechando nuestras oportunidades?"
 britain_md.2.d: "Podemos influir masivamente en el mercado nacional fomentando inversiones en determinadas industrias nicho. Pero hacerlo podría potencialmente infundir miedo en los inversores que han invertido su dinero en industrias competidoras, causando una ligera desaceleración económica. Actualmente el gabinete está dividido sobre si esta medida es o no la mejor a tomar en este momento."
 britain_md.3.t: "Haciendo una gran promesa"
 britain_md.3.d: "Para cautivar a una base de votantes más amplia, necesitaremos apelar a una de nuestras facciones internas. Hacerlo no sólo demostrará nuestra capacidad para operar múltiples sectores del gobierno con eficiencia, sino que también nos permitirá adquirir un poco de capital adicional para financiar otros proyectos. Además, con la nueva influencia adquirida sobre estas facciones, podremos cambiar el rumbo en futuras elecciones contra nuestros rivales políticos."
 britain_md.4.t: "¿A quién le cobramos impuestos?"
 britain_md.4.d: "Nuestro gobierno se enfrenta a una situación singular. Para obtener más ingresos, necesitaríamos aumentar los impuestos para financiar nuestros programas de gasto social. Sin embargo, hacerlo enojará a un segmento de la población de una manera u otra, y se ha advertido contra los impuestos generalizados porque es probable que sean los que más daño hagan a nuestra reputación. En lugar de eso, nuestro gabinete propone que gravemos a un segmento de la población para no irritar a todo el mundo."
 britain_md.5.t: "Gran Bretaña avanza, no retrocede"
 britain_md.5.d: "Debemos evitar que la sociedad caiga en las profundas represiones que algunos de nuestros oponentes políticos siguen reclamando. Lucharemos para que Gran Bretaña siga avanzando hacia el futuro sin interrupciones. Nuestros valores, orden y estabilidad no deben verse comprometidos bajo ninguna circunstancia, y lucharemos para garantizar que permanezcamos en la cima de las elecciones."
 britain_md.6.t: "Raspando los cielos británicos"
 britain_md.7.t: "Nadie se queda atrás"
 britain_md.7.d: "En todo el mundo, ya sea en Europa, Asia, África o las Américas, la desigualdad sigue creciendo. Con los salarios estancados y los precios se disparan, vivir en sí mismo se ha convertido en un coro. Sin embargo, para los ciudadanos del Reino Unido esto no tiene que ser el caso! Con reformas rápidas y nuevas políticas, demostraremos al mundo que no tienes que sucumbir a esta creciente tendencia de desigualdad."
 britain_md.8.t: "¿Conexiones entre ambos?"
 britain_md.8.d: "Mucha gente de la derecha del espectro político ha declarado que el aumento de la delincuencia está directamente relacionado con el aumento de la migración en los últimos años. Aunque muchos refutan estas afirmaciones, calificándolas de xenófobas e intolerantes, otros afirman que la causa es la incapacidad de algunos migrantes y refugiados de asimilarse a la cultura [ENG.GetAdjective]."
 britain_md.9.t: "Siempre puede ser mejor"
 britain_md.9.d: "Gran Bretaña no tiene por qué ser como el resto del mundo; puede ser mejor. Mediante una reforma política seria, podemos contrarrestar la corriente de retroceso democrático y convertir a Gran Bretaña en la mejor versión posible de sí misma. Esta vez, el Partido Laborista se ha comprometido a implementar reformas sociales y políticas drásticas, y nuestro mensaje llegará al pueblo británico como nunca antes."
 britain_md.10.t: "¿Reconsideración de la Ley de Lobby?"
 britain_md.10.d: "Algunos miembros de nuestro gabinete nos piden cada vez más que reconsideremos la ley de lobby. Tal medida, por supuesto, causaría revuelo y podría conducir a un aumento de los casos de corrupción en el gobierno. Sin embargo, si quisiéramos conseguir algún apoyo y financiación rápidos para nuestro partido, quizá debiéramos considerar al menos realizar algunas modificaciones a la ley."
 britain_md.11.t: "Dando un poco de sentido común a Gran Bretaña"
 britain_md.11.d: "Es hora de que traigamos algo de normalidad a este país sumido en el caos. El sentido común parece haberse descartado por completo, ya que los laboristas han comenzado a aprobar reformas con daños irreversibles. Nuestro gobierno impulsará a Gran Bretaña hacia un estado más fuerte e independiente, no uno gobernado por Bruselas o por un gabinete de izquierdistas."
 britain_md.12.t: "[FROM.GetName] solicita acceso militar"
 britain_md.12.d: "En un aparente esfuerzo por hacer de Europa un continente más flexible en materia de defensa, los [ENG.GetAdjective] han decidido enviar solicitudes de acceso militar. Aunque no ganaremos nada con ello, tampoco perderemos prácticamente nada."
 britain_md.13.t: "Participación británica"
 britain_md.13.d: "El gobierno británico se ha comprometido a ayudarnos a combatir a nuestros enemigos y a proteger la soberanía de nuestro estado. Lo que no dejaron muy claro fue qué esperaban a cambio. Hemos recibido información de una fuente confiable de que el gobierno británico tiene la intención de confiscar nuestros recursos en Freetown por un período de 500 días si logra ejercer una influencia significativa sobre nosotros. Tienen la intención de hacer esto independientemente de si les permitimos desplegar tropas o no."
 britain_md.14.t: "¡Los británicos se apoderan de nuestros recursos!"
 britain_md.14.d: "Los británicos se han apoderado de nuestros recursos porque ejercen una influencia considerable sobre nosotros. Esto durará 500 días hasta que se retiren."
 britain_md.15.t: "Fin de la misión: Barras"
 britain_md.15.d: "Nuestro tiempo en Sierra Leona está llegando a su fin, y hemos comenzado los preparativos para eliminar las instituciones que han estado transfiriendo recursos desde Sierra Leona para ser exportados y obtener ingresos británicos."
 britain_md.16.t: "¿Golpe de Estado en Gambia?"
 britain_md.16.d: "Ha llegado el momento de que finalmente pongamos fin al estado tiránico dirigido por [GAM.GetLeader] en Gambia. Organizaremos un derrocamiento de su gobierno, pero si tentamos demasiado a la suerte, podría desembocar en una guerra civil y potencialmente salirse de nuestras manos."
 britain_md.17.t: "Golpe de Estado exitoso en Gambia"
 britain_md.17.d: "Hemos derrocado con éxito al régimen opresor de Gambia y hemos instaurado el gobierno que deseamos. El pueblo de Gambia ya no sufrirá una opresión innecesaria."
 britain_md.18.t: "Golpe de Estado fallido en Gambia"
 britain_md.18.d: "No hemos logrado derrocar a [GAM.GetLeader] y, como resultado, hemos perdido a varios militares británicos. Nuestro intento de golpe de Estado está siendo duramente criticado internacionalmente, y las relaciones con el gobierno gambiano se han deteriorado."
 britain_md.19.t: "Golpe de Estado increíblemente exitoso en Gambia"
 britain_md.19.d: "Hemos tenido mucho éxito en nuestros esfuerzos en Gambia. No solo hemos derrocado al gobierno opresor, sino que también hemos logrado establecer un control firme sobre el estado, convirtiéndolo esencialmente en un estado satélite."
 britain_md.20.t: "Operación Delta Guard: Éxito"
 britain_md.20.d: "Hemos logrado asegurar yacimientos petrolíferos estratégicos en el Delta, y se ha visto a las fuerzas nigerianas retirándose hacia el norte, rumbo a su capital. Se desconoce si tomarán represalias, pero por ahora disfrutamos del botín de guerra."
 britain_md.21.t: "Las fuerzas británicas se apoderan de petróleo en el Delta"
 britain_md.21.d: "Las fuerzas británicas han violado gravemente nuestra soberanía y han declarado que nuestros sagrados campos petrolíferos están bajo \"protección temporal\", calificando a nuestro gobierno de inestable y poco confiable. No tenemos idea de por qué decidieron que la acción militar es el mejor curso de acción para seguir adelante, pero una cosa es segura: no podemos quedarnos de brazos cruzados ante esta situación."
 britain_md.22.t: "Nigeria toma represalias"
 britain_md.22.d: "Varios militares británicos resultaron heridos y algunos incluso murieron en un ataque de represalia de las Fuerzas Armadas de Nigeria. Esto surge como respuesta a nuestra toma de varios yacimientos petrolíferos del Delta, lo que nos asegura un acceso vital al petróleo del inestable gobierno nigeriano. Debemos tomar la capital nigeriana para ponerlos en su lugar."
 britain_md.23.t: "Las fuerzas británicas se retiran"
 britain_md.23.d: "Por temor al poder de las grandes Fuerzas Armadas nigerianas y al valiente liderazgo de [NIG.GetLeader], las cobardes fuerzas británicas se han retirado del Delta y han cesado todas las operaciones petroleras. Salimos victoriosos en este sentido y no esperamos más represalias británicas."
 britain_md.24.t: "Seleccionar una agenda"
 britain_md.24.d: "Nuestro partido ha ganado las elecciones, es hora de que seleccionemos una agenda."
 britain_md.25.t: "Reino Unido - Información, por favor lea"
 britain_md.25.d: "¡Hola! Parece que has elegido el Reino Unido como país. ¡Esperamos que lo disfrutes!\n\nActualmente estás jugando la Fase I de la actualización del Reino Unido, que incluye un árbol de enfoque, un conjunto de decisiones y mecánicas de monarquía rediseñados. Quizás te preguntes si habrá más novedades, y la respuesta es sí, habrá más.\n\nFase II:\nEn la Fase II se puede esperar ver un sistema de devolución aún más profundo y un sistema de Cámara de los Comunes mejorado.\n\nFase III\nEn la Fase III puedes esperar un árbol de política exterior ampliado, caminos políticos adicionales y ¡mucho más!\n\nSi tienes algún comentario sobre el árbol, ¡háznoslo saber en nuestro Discord, Reddit o Github!\n\n - Equipo de MD Reino Unido"
 britain_md.26.t: "Adelante con una nueva política para las Falklands"
 britain_md.26.d: "En la actualidad se han intensificado los llamamientos para que se siga trabajando en la integración de las Islas Falkland o se adopten nuevas medidas. Si bien esto último puede ser un poco agresivo, a la larga nos beneficiará. También hay quienes desean que devolvamos las Malvinas para consolidar nuestra imagen en la región sudamericana."
 ENG_british_flag_on_the_moon: "Bandera británica en la luna"
 ENG_british_flag_on_the_moon_desc: "Embárcate en una ambiciosa misión lunar mientras el Reino Unido se esfuerza por establecer una base británica en la Luna. Esta iniciativa lunar simboliza la dedicación del país a la exploración espacial, demostrando su capacidad tecnológica y fomentando la innovación científica. Sé pionero en la frontera cósmica, elevando la posición global del Reino Unido en el ámbito de la exploración espacial."
 ENG_set_sail_to_mars: "Zarpa hacia Marte"
 ENG_set_sail_to_mars_desc: "Aventurándose más allá de los límites de la Tierra, el Reino Unido aspira a establecer una presencia en Marte. Esta iniciativa visionaria se centra en ser pionero en la exploración marciana, ampliando los límites de la tecnología espacial y posicionando al Reino Unido como un actor clave en la búsqueda de la humanidad para llegar al Planeta Rojo. Embárcate en el desafío de la conquista marciana, definiendo el papel del Reino Unido en el futuro de la exploración interplanetaria."
 ENG_new_thirteen_colonies: "Nuevas trece colonias"
 ENG_new_thirteen_colonies_desc: "Al trazar un rumbo hacia nuevas fronteras, el Reino Unido se inspira en la historia y visualiza el establecimiento de las Trece Nuevas Colonias en Marte. Retomando el espíritu de las trece colonias originales, esta ambiciosa iniciativa simboliza el compromiso del Reino Unido con la colonización marciana, afrontando los desafíos de la colonización interplanetaria. Lidera la creación de un nuevo legado en el Planeta Rojo, donde los pioneros británicos emprenden un viaje que evoca las raíces históricas de la nación."
 ENG_asteroid_mining: "Minería de Asteroides"
 ENG_asteroid_mining_desc: "Avanzando hacia el cosmos con la Royal Asteroid Mining Company británica, mientras el Reino Unido adopta la Recolección de Recursos Celestiales. Decidida a extraer recursos valiosos de asteroides, esta iniciativa simboliza la dedicación del país a la utilización pionera de recursos espaciales y la tecnología de vanguardia."
 ENG_standardized_space_parts: "Piezas espaciales estandarizadas"
 ENG_standardized_space_parts_desc: "Revolucionar la asequibilidad de la exploración espacial impulsando la estandarización de componentes espaciales en el Reino Unido. Al optimizar y estandarizar los componentes, esta iniciativa busca hacer que las empresas espaciales sean más rentables, lo que demuestra el compromiso del país con el fomento de proyectos espaciales accesibles y económicos."
 ENG_virgin_galactic: "Virgin Galactic"
 ENG_virgin_galactic_desc: "Como líder en la industria del turismo espacial, Virgin Galactic se esfuerza por hacer que el cosmos sea accesible para todos. Con naves espaciales innovadoras y el compromiso de ampliar los límites de la exploración espacial, Virgin Galactic representa el papel del Reino Unido en la configuración del futuro de las aventuras espaciales civiles."
 ENG_british_commercial_spaceport: "Puerto espacial comercial británico"
 ENG_british_commercial_spaceport_desc: "Ante la creciente carrera global por el cosmos, el Reino Unido reconoce la necesidad imperiosa de consolidar su posición en la vanguardia de la exploración espacial. El establecimiento de un puerto espacial comercial británico es fundamental para impulsar la presencia del país en las iniciativas espaciales comerciales. Al invertir en la construcción y el desarrollo de un puerto espacial específico, el Reino Unido aspira a fomentar la innovación, atraer alianzas internacionales e impulsar su industria aeroespacial a nuevas cotas, asegurando un futuro prometedor como actor clave en la frontera cósmica."
 ENG_united_kingdom_space_command: "Comando Espacial del Reino Unido"
 ENG_united_kingdom_space_command_desc: "A medida que el cosmos se convierte en un nuevo escenario de influencia estratégica, el Reino Unido reconoce la necesidad de consolidar sus esfuerzos en operaciones espaciales. El establecimiento del Comando Espacial del Reino Unido es un objetivo decisivo para unificar y fortalecer las capacidades espaciales del país. Mediante la centralización del mando, el fomento de operaciones conjuntas y la inversión en tecnologías de vanguardia, el Reino Unido se esfuerza por asegurar sus intereses en el ámbito cósmico, garantizando una presencia formidable entre las estrellas y salvaguardando la seguridad nacional en la era espacial."
 ENG_istari_programme: "Programa ISTARI"
 ENG_istari_programme_desc: "En respuesta al panorama mundial en evolución, el Reino Unido presenta el Programa ISTARI, un enfoque ambicioso dedicado a la inteligencia, la vigilancia, la adquisición de objetivos y el reconocimiento en el dominio cibernético."
 ENG_space_red_coats: "Fusileros espaciales"
 ENG_space_red_coats_desc: "Inspirándose en un pasado histórico, el Reino Unido revitaliza el legado de los Casacas Rojas con los Fusileros Espaciales del Siglo XXI. Evocando el espíritu de resiliencia histórica, este enfoque impulsa la exploración espacial británica hacia una nueva era. Vestidos de rojo simbólico, los Casacas Rojas Espaciales se esfuerzan por explorar el cosmos, encarnando la tradición de la exploración y proyectando la influencia británica a través de la extensión celestial."
 ENG_1st_space_force_division: "Primera División de la Fuerza Espacial"
 ENG_1st_space_force_division_desc: "Charting a course beyond landly bounds, the United Kingdom charts a bold path with the creation of the British Space Force Division. Sin precedentes en la historia, esta anuncia una nueva era como Gran Bretaña establece su primera división espacial dedicada. Con la tarea de salvaguardar los intereses celestiales y abrazar lo desconocido, la División de Fuerza Espacial significa el compromiso de la nación de explorar y asegurar la frontera cósmica, donde el Union Jack volará entre las estrellas."
 ENG_space_capabilities: "Capacidades del ciberespacio"
 ENG_space_capabilities_desc: "Reconociendo la importancia fundamental del ámbito digital, el Reino Unido centra su atención en mejorar las capacidades del ciberespacio. En una era donde la información es poder, esta iniciativa representa un compromiso para fortalecer la capacidad del país en las operaciones ciberespaciales."
 ENG_strategic_defence_review: "Libro Blanco de Defensa de [GetYear]"
 ENG_strategic_defence_review_desc: "Nuestras prioridades y amenazas cambian constantemente, y nuestra burocracia militar debe evolucionar para contrarrestarlas. Al coordinar una nueva respuesta de seguridad nacional con socios de todo el gobierno y nuestros aliados, podemos garantizar que nuestras fuerzas armadas se mantengan adaptables al cambio y listas para afrontar las amenazas a la seguridad británica."
 ENG_AS90: "AS-90 Braveheart"
 ENG_AS90_desc: "El AS90, sistema de artillería de la década de 1990, también conocido como equipo de cañón L131 de 155 mm, es el principal armamento blindado autopropulsado del Ejército británico. Fue diseñado y construido por la división de armamento de Vickers Shipbuilding and Engineering entre 1982 y 1987, y entró en producción en 1992 con 179 vehículos fabricados. Reemplazó al antiguo FV433 Abbot de 105 mm y al antiguo cañón autopropulsado M109 de 155 mm. Se han propuesto proyectos para modernizar el AS90 e incorporar un cañón más grande, capaz de disparar armas del calibre 52, lo que aumenta su alcance sin asistencia y munición de largo alcance."
 ENG_operation_excellence: "Comando especial"
 ENG_utility_vehicle_modernisation: "Modernización de vehículos utilitarios"
 ENG_utility_vehicle_modernisation_desc: "Ha quedado claro a través de experiencias en Irlanda del Norte durante el período Troubles que los actuales vehículos militares de infantería empleados por el Ejército, como el Snatch Land Rover, ofrecen poca o ninguna protección contra artefactos explosivos improvisados y minas, con informes de supervivencia afirmando que perjudican activamente a los sobrevivientes de la explosión inicial. Por lo tanto, el Ministerio de Defensa ha comenzado a explorar opciones para emplear vehículos modernos con armadura resistente a las minas y la ambush"
 ENG_nlaw_anti_tank_system: "Sistema antitanque NLAW"
 ENG_nlaw_anti_tank_system_desc: "El SAAB Bofors Dynamics NLAW, MBT LAW o R85 es un sistema de misiles ligero, de lanzamiento portátil, desechable y de línea de visión, diseñado para infantería. Diseñado por SAAB para los Ministerios de Defensa del Reino Unido y Suecia en el Reino Unido, bajo el mando del Equipo NLAW, con diversos subcontratistas, incluyendo una amplia colaboración con Thales Air Defence."
 ENG_startstreak_anti_air_system: "Sistema antiaéreo Starstreak"
 ENG_startstreak_anti_air_system_desc: "El Starstreak es un misil tierra-aire británico de corto alcance, un sistema portátil de defensa aérea (MANPADS) que se utiliza en diversas configuraciones en helicópteros y vehículos para cobertura móvil. Es fabricado por Thales Air Defence en Belfast, Irlanda del Norte. Tras el lanzamiento, el misil alcanza velocidades superiores a Mach 4, lo que lo convierte en el misil tierra-aire de corto alcance más rápido del mercado. Para aumentar su potencial, lanza tres submuniciones que transportan rayos láser contra su objetivo, lo que aumenta la probabilidad de un impacto."
 ENG_M270: "Recapitalizar la M270"
 ENG_M270_desc: "El Ministerio de Defensa planea invertir en la recapitalización de los sistemas de lanzadores de misiles M270 sobre orugas y de varios tipos de misiles en servicio, para complementar la adquisición de municiones del Sistema de Lanzamiento de Cohetes Guiados. Con la intención de introducir nuevos motores, blindaje y sistemas de control de tiro modernizados."
 ENG_mobile_fires_platform_program: "Programa de Plataforma de Incendios Móviles"
 ENG_mobile_fires_platform_program_desc: "Tras el fin de la Guerra Fría y la disminución de la expectativa de un conflicto en las llanuras alemanas, el arsenal de sistemas de artillería de 155 mm del Ejército disminuyó. Ahora, ante nuevas amenazas en el horizonte, el Ministerio de Defensa ha decidido tomar medidas para revitalizar esta capacidad. Se han presentado numerosos candidatos para este contrato, de los cuales solo uno resultará ganador."
 ENG_fres_program: "Programa FRES"
 ENG_fres_program_desc: "El programa FRES (Future Rapid Effect System) representa un enfoque orientado hacia el desarrollo de la capacidad militar. Enfoque En agilidad y adaptabilidad, FRES pretende proporcionar a las Fuerzas Armadas Británicas una versátil variedad de plataformas terrestres, incluyendo vehículos blindados y sistemas de apoyo."
 ENG_fix_civil_servant: "Arreglando el 'Sirviente Civil'"
 ENG_fix_civil_servant_desc: "Originalmente por frecuentes quejas y problemas de rendimiento entre las tropas, el rifle L85A1 experimentó una mejora integral en respuesta a su difícil mantenimiento y funcionamiento poco fiable. A menudo apuñaló al 'siervo civil' debido a su aparente insuficiencia y funcionalidad compleja, estas preocupaciones provocaron un cambio significativo entre 2000 y 2002. Aproximadamente 200.000 de los actuales 320.000 fusiles automáticos L85A1 fueron revampados."
 ENG_modern_littoral_force: "Fuerza Litoral Moderna"
 ENG_trident_nuclear_program: "Programa nuclear tridente"
 ENG_general_dynamics_ajax: "General Dynamics Ajax"
 ENG_general_dynamics_ajax_desc: "El General Dynamics Ajax, un vehículo de reconocimiento moderno, surgió como piedra angular en los esfuerzos de modernización de las Fuerzas Armadas Británicas. Diseñado para satisfacer las necesidades exigentes de la guerra moderna, esta tecnología de vanguardia integrada de vehículos ágiles y avanzados, que permite capacidades de reconocimiento sin precedentes."
 ENG_challenger_lethality_improvement_programme: "Programa de mejora de la capacidad de los Challenger"
 ENG_challenger_lethality_improvement_programme_desc: "El Programa de Mejora de la Letality Challenger fue un programa para reemplazar el actual arma de fusil L30A1 con el arma de 120 mm del batidor Rheinmetall utilizado actualmente en los Abrams Leopard 2 y M1. El uso de un arma de bata habría permitido a Challenger 2 utilizar municiones estándar de la OTAN, incluidos penetradores de energía cinética basados en tungsteno que no tienen las mismas objeciones políticas y ambientales que rondas de uranio empobrecido."
 ENG_challenger_3: "Challenger 3"
 ENG_challenger_3_desc: "El Challenger 3 Tank, desarrollado con orgullo por el Reino Unido, epitomiza la guerra armada de vanguardia. Con tecnología de última generación, potencia de fuego formidable y mayor protección, el Challenger 3 garantiza un dominio superior del campo de batalla. Este tanque modernizado subraya el compromiso del Reino Unido de mantener una fuerza armada formidable, dispuesta a enfrentar los desafíos de la guerra contemporánea."
 ENG_modern_landing_craft: "Moderno Landing Craft"
 ENG_mechanised_amphibious_assault: "Agresión anfibia mecánica"
 ENG_aircraft_ai_integration: "Air Integration"
 ENG_aircraft_ai_integration_desc: "Guiándose por el principio de calidad sobre la cantidad, el Reino Unido prioriza la excelencia y la superioridad tecnológica en sus fuerzas militares. Este espíritu nacional enfatiza la adquisición de equipos avanzados y sofisticados, asegurando una postura de defensa formidable y tecnológicamente avanzada. Al centrarse en la calidad, el Reino Unido tiene como objetivo maximizar la eficacia de sus fuerzas, creando un borde estratégico frente a los desafíos modernos."
 ENG_strike_brigades: "Brigadas de huelga"
 ENG_future_soldier_armed_forces: "Futuros soldados de las fuerzas armadas"
 ENG_future_soldier_armed_forces_desc: "La iniciativa Futuro Soldado es una estrategia orientada hacia el futuro adoptada por las fuerzas armadas, incluido el Reino Unido. Se centra en equipar a los soldados con tecnologías y capacidades avanzadas, mejorando su eficacia en el campo de batalla moderno."
 ENG_joint_expeditionary_force: "Fuerza Expeditativa Conjunta"
 ENG_joint_expeditionary_force_desc: "Originaria de 2012 y introducida por el entonces Jefe del Estado Mayor de Defensa, General Sir David Richards, la Fuerza Expeditativa Conjunta (JEF) surgió de la disolución de la Fuerza Mixta de Reacción Rápida (JRRF) durante el énfasis del Reino Unido en las operaciones de Afganistán e Iraq. Incluye personal y equipo de la Armada Real, Royal Marines, British Army y Royal Air Force, el componente británico del JEF prioriza una mayor integración. Esta integración se hace especialmente hincapié al trabajar junto con las fuerzas armadas de otras naciones, marcando un cambio significativo de los modelos anteriores."
 ENG_carrier_group_debate: "Air Carrier Group Debate"
 ENG_worldwide_reach: "Alcance mundial"
 ENG_worldwide_reach_desc: "El Reino Unido fue una vez una superpotencia, teniendo un alcance por todo el mundo para proteger sus intereses. Tenemos que volver a este poder para mantener nuestros intereses en todo el mundo"
 ENG_national_service_debate: "Debate del Servicio Nacional"
 ENG_national_service_debate_desc: "Un ejército basado en voluntarios no puede mantenerse al día con la creciente demanda de tropas británicas por todo el mundo. Necesitamos aumentar nuestro proyecto para satisfacer la demanda"
 ENG_army_special_operations_brigade: "Brigada de Operaciones Especiales del Ejército"
 ENG_reestablish_far_east_command: "Reestablezca el Mando del Lejano Oriente"
 ENG_reestablish_far_east_command_desc: "El restablecimiento británico del Mando del Lejano Oriente marca una reorientación estratégica hacia la mejora de las capacidades militares en esta región fundamental. Esta iniciativa entraña el despliegue de estructuras de mando, unidades operacionales y apoyo logístico para abordar eficazmente la evolución de la dinámica de seguridad. Al fortificar la presencia y coordinación en el Lejano Oriente, las Fuerzas Armadas Británicas tienen por objeto responder de manera adecuada a los desafíos regionales, fomentar asociaciones con aliados y contribuir significativamente a la estabilidad general de esta parte estratégicamente vital del mundo."
 ENG_britannia_armed_forces: "Fuerzas Armadas de Britannia"
 ENG_britannia_armed_forces_desc: "Con nuestros esfuerzos por recrear nuestro poder militar mundial, finalmente podemos decir que tenemos un ejército capaz de defender el interés británico en todo el mundo"
 ENG_allied_basing_efforts: "Aliados esfuerzos de basing"
 ENG_allied_basing_efforts_desc: "La Iniciativa de Bases Aliadas representa un compromiso unificado para fortalecer las capacidades estratégicas entre las naciones miembros dentro de la alianza. En virtud de esta iniciativa, el Reino Unido se beneficia de una mejora sostenida y sustancial de la infraestructura, incluidos los ferrocarriles, las bases aéreas, los puertos y más. Esta mejora duradera realza el dominio logístico del Reino Unido y la eficacia operacional general."
 ENG_reactivate_naval_defense_act_1889: "Reactivar la Ley de Defensa Naval de 1889"
 ENG_reactivate_naval_defense_act_1889_desc: "En un guiño simbólico a la prominencia marítima histórica, la Ley de Reactivación de la Defensa Naval de 1889 marca un compromiso orientado hacia el futuro para fortalecer las capacidades navales. Esta legislación tiene por objeto canalizar el espíritu del pasado hacia la preparación naval moderna. Al revitalizar los principios del acto original, el Reino Unido señala su dedicación al mantenimiento de una fuerza naval robusta y tecnológicamente avanzada. El acto podría incluir disposiciones para la modernización de los activos navales, la ampliación de la infraestructura naval y las inversiones estratégicas para garantizar que la Marina Real siga siendo una presencia formidable en el escenario mundial."
 ENG_royal_navy: "Marina real"
 ENG_royal_navy_desc: "La Marina Real Británica es una de las principales fuerzas marítimas del mundo, con un legado histórico que data de siglos atrás. Renombrada por su adaptabilidad y proeza tecnológica, la Armada Real desempeña un papel crucial para salvaguardar los intereses marítimos del Reino Unido y proyectar el poder a nivel mundial. "
 ENG_british_foreign_legion: "Legión Extranjera Británica"
 ENG_british_foreign_legion_desc: "Abrazando un modelo de servicio internacional, esta legión da la bienvenida a los extranjeros que desean servir en el ejército británico. Diseñado para fomentar la camaradería, la diversidad y un sentido de propósito compartido, la Legión Extranjera Británica se convierte en una vía única para que individuos de diversos orígenes contribuyan a la defensa del Reino Unido."
 ENG_multi_ocean_navy: "La marina multi océano"
 ENG_multi_ocean_navy_desc: "Para proteger los intereses británicos en todo el mundo, necesitamos aumentar nuestras capacidades navales para atacar a través de los océanos"
 ENG_Strategic_Aircraft_Training: "Capacitación en aeronaves estratégicas"
 ENG_Strategic_Aircraft_Training_desc: "En los tiempos modernos, es necesario tener una fuerza aérea capaz de atacar a través de todos los océanos. Necesitamos aumentar nuestras operaciones estratégicas de aeronaves para tener esta posibilidad."
 ENG_field_army_expansion: "Expansión del Ejército de Campo"
 ENG_field_army_expansion_desc: "La iniciativa de Ampliación del Ejército de Campo marca un compromiso estratégico del Reino Unido para reforzar sus fuerzas terrestres, garantizando una capacidad militar robusta y adaptable. Esta expansión implica aumentar el tamaño y las capacidades del ejército de campo, que abarca las fuerzas básicas del Ejército Británico."
 ENG_type_31_frigate_inspiration_class: "Tipo 31 Clase de inspiración fragata"
 ENG_type_31_frigate_inspiration_class_desc: "El tipo 31 es el propósito general de la mitad de la fuerza fragata, ordenada en 2019 contra un precio fijo de 250 millones de libras por barco. Babcock construye los cinco en Rosyth al diseño Arrowhead 140 derivado de la clase Danesa Iver Huitfeldt, un gran casco eléctrico diesel con una pistola Bofors de 57 mm, Sea Ceptor y margen deliberado dejado para el crecimiento posterior. Inspiración, Active, Bulldog, Campbeltown y nombres de revivir Formidable a través de la historia de la flota."
 ENG_multi_role_support_ship_project: "Proyecto de soporte multifunción"
 ENG_multi_role_support_ship_project_desc: "El buque Multi Role Support es el reemplazo previsto para Albion, Bulwark y la clase Bay en un solo casco flexible. En lugar de un barco de muelle construido para un aterrizaje grande, está diseñado alrededor de una bahía de misión, una cubierta de vuelo y alojamiento modular, para que el mismo buque pueda llevar una fuerza de redada de comandos, ejecutar una operación de socorro en casos de desastre o servir como base avanzada para sistemas no tripulados."
 ENG_expanded_carrier_wing_procurement: "Ampliación de las adquisiciones de vehículos aéreos"
 ENG_expanded_carrier_wing_procurement_desc: "Al invertir en una ala de transporte aéreo ampliada, el Reino Unido tiene por objeto proyectar el poder, proteger los intereses marítimos y contribuir significativamente a las actividades internacionales de seguridad. Esta iniciativa refleja la dedicación de la nación a mantener una fuerza naval moderna y capaz en el panorama de seguridad global que evoluciona rápidamente."
 ENG_strategic_aircraft_strategy: "Estrategia estratégica de las aeronaves"
 ENG_strategic_aircraft_strategy_desc: "La Estrategia de Aviación Estratégica describe el enfoque del Reino Unido respecto a la adquisición, el despliegue y la utilización de activos estratégicos de aeronaves. Esta estrategia integral abarca una gama de consideraciones, incluyendo prioridades nacionales de defensa, retos globales de seguridad y avances tecnológicos."
 ENG_continent_operational_considerations: "Consideraciones operacionales permanentes"
 ENG_continent_operational_considerations_desc: "Necesitamos priorizar nuestro compromiso con nuestras fuerzas armadas y aliados. Por lo tanto, necesitamos seleccionar en qué rama de nuestro ejército nos especializamos."
 ENG_astute_class: "Submarino de clase Astuto"
 ENG_astute_class_desc: "La clase Astute es la última clase de submarinos de flota con energía nuclear en servicio con la Marina Real. Los barcos están siendo construidos por BAE Systems Submarines en Barrow-in-Furness."
 ENG_type_45_destroyer_upgrades: "Tipo 45 Actualizaciones destructoras"
 ENG_type_45_destroyer_upgrades_desc: "El proyecto Tipo 45 Destroyer Upgrades tiene como objetivo mejorar las capacidades de los destructores tipo 45 de la Armada Real a través de tecnologías avanzadas y mejoras del sistema. Las principales áreas de enfoque incluyen radar, sistemas de combate, propulsión y mejoras en la defensa de misiles."
 ENG_dreadnought_class: "Submarino de clase nombrada"
 ENG_dreadnought_class_desc: "El proyecto Submarino de Clase Dreadnought involucra el diseño, construcción e integración de los submarinos de misiles balísticos de próxima generación para la Armada Real. Estos submarinos contarán con capacidad avanzada de robar, propulsión y armas estratégicas, lo que garantizará una capacidad de disuasión nuclear creíble para el Reino Unido."
 ENG_type_26_frigate: "Type 26 Frigate"
 ENG_type_26_frigate_desc: "El tipo 26, llamado la clase de la ciudad después de Glasgow, Cardiff, Belfast y sus hermanas, es la mitad anti submarino de la fuerza de fragata. Construido por BAE Systems en el Clyde a partir de 2017, se organiza alrededor de la tranquilidad acústica: una planta de turbina diesel montada en balsa, la matriz Sonar 2087 remolcada y una bahía de misión entre barcos, contenedores y sistemas no tripulados. Ocho barcos escoltarán a los transportistas y al disuasivo, con más cascos vendidos a Australia y Canadá."
 ENG_type_83_destroyer: "Type 83 Destroyer"
 ENG_type_83_destroyer_desc: "El destructor tipo 83 es una próxima clase de destructores guiados-misiles abocados para unirse a la flota de la Marina Real en los años 2030. Esta clase propuesta promete capacidades avanzadas y características modernizadas para satisfacer necesidades navales en evolución. Diseñado para la versatilidad y potencia, el destructor Tipo 83 representa un avance decisivo en las capacidades marítimas de la Armada Real, asegurando la preparación y eficacia en futuros entornos operativos."
 ENG_qinetiq_dragonfire_system: "Sistema Qinetiq Dragonfire"
 ENG_qinetiq_dragonfire_system_desc: "Dragonfire representa un destructor de tecnología de armamento láser británico de última generación. Desvelada en la conferencia internacional de defensa y equipo de seguridad en Londres en 2017, está desarrollada por UK Dragonfire, un esfuerzo colaborativo que involucra a MBDA UK, Leonardo UK, QinetiQ y el Laboratorio de Ciencia y Tecnología de Defensa. Como demostrativo de la tecnología central, Dragonfire se someterá a pruebas rigurosas para evaluar las armas de energía dirigidas por láser y sus aplicaciones potenciales dentro de las Fuerzas Armadas Británicas, lo que marca un avance significativo en la innovación militar y el desarrollo de capacidades."
 ENG_auxiliary_royal_navy: "Armada Real Auxiliar"
 ENG_auxiliary_royal_navy_desc: "La Armada Real Auxiliar se refiere históricamente a naves tripulados por civiles que apoyan y complementan las operaciones de la Marina Real durante tiempos de conflicto o crisis."
 ENG_revitalise_merchant_navy: "Revitaliza la marina mercante"
 ENG_revitalise_merchant_navy_desc: "El Imperio Británico fue fundado una vez en el comercio, y nuestra flota mercante global es nuestra gloria y fundamento. Deje que nuestra flota mercante se difunda una vez más por todo el mundo."
 ENG_bay_slass_landing_ships: "Naves de aterrizaje de clase Bay"
 ENG_bay_slass_landing_ships_desc: "Los buques de aterrizaje de clase Bay son buques anfibios versátiles diseñados para apoyar una serie de operaciones militares, incluida la asistencia humanitaria, el socorro en casos de desastre y las misiones de asalto anfibias. Estos buques tienen una gran cubierta de vuelo y una buena plataforma para lanzar y recuperar vehículos artesanales y anfibios."
 ENG_river_class_patrol_boat: "Barco de Patrulla de Río"
 ENG_river_class_patrol_boat_desc: "Los buques de patrullas de clase rio sirven como buques de patrulla offshore versátiles, empleados para la seguridad marítima, la protección fronteriza y las tareas de aplicación de la ley. Con sus sistemas avanzados de vigilancia y comunicación, esos buques patrullan eficazmente las aguas costeras, salvaguardando la integridad territorial y los intereses marítimos. Diseñados para la resistencia y la flexibilidad, los buques de clase River desempeñan un papel fundamental en la mejora de la seguridad marítima y el respeto del derecho marítimo dentro de las aguas del Reino Unido y más allá."
 ENG_point_class_sealift_ships: "Naves de elevación del mar de clase punta"
 ENG_point_class_sealift_ships_desc: "Los buques elevadores de altura son activos vitales en la flota de la Royal Fleet Auxiliar, diseñada para transportar carga militar y equipo para apoyar operaciones expedicionarias. Estos buques rodados/rollables cuentan con capacidades versátiles de manejo de carga, permitiendo una carga y descarga eficientes de vehículos y suministros en diversos puertos y entornos marítimos. Con su capacidad de elevación estratégica, los buques de clase Point contribuyen significativamente a las capacidades logísticas del Reino Unido, facilitando el rápido despliegue de fuerzas y equipos militares durante situaciones de paz y conflicto."
 ENG_bae_cv90_MkIV: "BAE CV90 Mk IV"
 ENG_bae_cv90_MkIV_desc: "El BAE CV90 Mk IV es una versión actualizada del vehículo de combate de infantería CV90, con tecnología avanzada y mejoras para la guerra moderna. Ofrece mayor movilidad, supervivencia y potencia de fuego, por lo que es un activo formidable para las unidades de infantería blindadas en el campo de batalla."
 ENG_expand_sandhurst_academy: "Ampliar la Academia Sandhurst"
 ENG_expand_sandhurst_academy_desc: "La Real Academia Militar Sandhurst (RMAS) es una de las principales instituciones militares del mundo, reconocidas por sus rigurosos programas y su compromiso con la producción de líderes militares excepcionales. Fundada en 1802, RMAS sirve como el principal centro de formación para oficiales del Ejército Británico, así como varios aliados y socios internacionales."
 ENG_soldier_welfare_initiative: "Iniciativa para el bienestar de los soldados"
 ENG_soldier_welfare_initiative_desc: "Al priorizar el bienestar de nuestros soldados y sus familias, esta iniciativa demuestra nuestro compromiso de honrar su servicio y sacrificio al tiempo que fomenta una comunidad militar solidaria y resiliente."
 ENG_mgcs_program: "Programa MGCS"
 ENG_mgcs_program_desc: "El Sistema Principal de Combate Terrestre (MGCS) es un programa de vehículos blindados de combate de próxima generación diseñado para proporcionar capacidades avanzadas a las fuerzas terrestres en escenarios modernos de guerra. Como un esfuerzo colaborativo entre Alemania y Francia, el MGCS pretende desarrollar un tanque de batalla principal versátil y tecnológicamente avanzado que pueda funcionar eficazmente en diversos entornos de campo de batalla."
 ENG_royal_airforce_modernisation: "Modernización de la Real Fuerza Aérea"
 ENG_royal_airforce_modernisation_desc: "Mediante la modernización del RAF, la Real Fuerza Aérea reafirma su compromiso de mantener la superioridad aérea, proyectar el poder y salvaguardar los intereses nacionales en un entorno de seguridad mundial cada vez más complejo y controvertido."
 ENG_watchkeeper_wk450: "Watchkeeper WK450"
 ENG_watchkeeper_wk450_desc: "El Watchkeeper WK450 es un avanzado sistema aéreo no tripulado diseñado para operaciones de inteligencia, vigilancia y reconocimiento (ISR). Desarrollado por Thales Group, este UAV de larga duración de media altitud ofrece una gama de sofisticados sensores y cámaras para la vigilancia en tiempo real y la adquisición de objetivos. Con sus capacidades de resistencia y capacidades de vuelo autónomas, el Watchkeeper WK450 proporciona a las fuerzas militares una mayor conciencia situacional y la capacidad para reunir inteligencia crítica en diversos entornos operativos."
 ENG_reaper_purchase: "Reapertura Compra"
 ENG_reaper_purchase_desc: "Las fuerzas militares de todo el mundo han adquirido el MQ-9 Reaper para mejorar sus capacidades de inteligencia, vigilancia y reconocimiento, así como para realizar huelgas de precisión contra objetivos de alto valor. La capacidad del Reaper para sortear las áreas de destino durante largos períodos y su avanzada suite sensor hacen que sea un activo valioso para reunir inteligencia en tiempo real y proporcionar apoyo a las fuerzas terrestres."
 ENG_missile_development: "Desarrollo de los misiles"
 ENG_missile_development_desc: "Necesitamos modernizar nuestras capacidades de misiles para seguir siendo una fuerza aérea moderna"
 ENG_electronic_warfare_measures: "Medidas de guerra electrónicas"
 ENG_electronic_warfare_measures_desc: "Necesitamos modernizar nuestra computación para mantenerse a salvo contra Cyberhacks"
 ENG_nato_joint_airforce_training: "Capacitación de la Fuerza Aérea Conjunta de la OTAN"
 ENG_nato_joint_airforce_training_desc: "A través de escenarios simulados, ejercicios en vivo y eventos de entrenamiento conjunto, las fuerzas aéreas participantes desarrollan y refinan sus capacidades en áreas como combate aéreo, operaciones aéreas a tierra, repostar aéreo y defensa del aire. Estas actividades de capacitación fomentan el entendimiento, la confianza y la cooperación mutuos entre las fuerzas aéreas aliadas, velando por que puedan actuar sin tropiezos en entornos de coalición y responder eficazmente a los problemas regionales y mundiales de seguridad."
 ENG_c19_globemasters: "C-17 Globemasters"
 ENG_c19_globemasters_desc: "The C-17 Globemaster III is a versátil and strategic airlift aircraft used by air forces worldwide for rapid and long-range transport missions. Fabricado por Boeing, este avión de transporte pesado es capaz de transportar grandes cargas de pago, incluidas tropas, vehículos y ayuda humanitaria, a lugares remotos y aeródromos austeros. Con sus avanzadas capacidades aviónicas, diseño de alto nivel y corto despegue y aterrizaje (STOL), el C-17 Globemaster III desempeña un papel crucial en el apoyo a las operaciones militares y humanitarias en todo el mundo."
 ENG_airbus_a400m: "Airbus A400M"
 ENG_airbus_a400m_desc: "El Airbus A400M es un moderno avión de transporte militar diseñado para satisfacer las necesidades operacionales de diversas fuerzas aéreas en todo el mundo. Con una configuración de alta altura y motores avanzados turboprop, el A400M ofrece un rendimiento excepcional, incluyendo capacidades cortas de despegue y aterrizaje (STOL), capacidades de largo alcance y la capacidad para operar desde pistas de aterrizaje semipreparadas."
 ENG_nimrod_mra4: "Nimrod MRA4"
 ENG_nimrod_mra4_desc: "El Nimrod MRA4 fue una versión modernizada del icónico avión de patrullaje marítimo de Nimrod, destinado a proporcionar mayor capacidad para las misiones de combate antisubmarino, vigilancia marítima y búsqueda y salvamento. Con sensores avanzados, sistemas de comunicación y equipo de misión, el Nimrod MRA4 ofreció un mejor rendimiento y versatilidad en comparación con su predecesor."
 ENG_apache_wah64: "AgustaWestland Apache"
 ENG_apache_wah64_desc: "La adquisición y despliegue del helicóptero Augusta Westland Apache marcó un avance significativo en el arsenal aéreo de combate británico. Se realizaron varias alteraciones en el diseño estándar de Apache, incluyendo un motor de Rolls Royce actualizado, mecanismo de cuchilla plegable para almacenamiento, protección de hielo Rotor y capacidad Rocket actualizada. Introducido para reforzar las capacidades aéreas de la nación, este sofisticado helicóptero de ataque simboliza un salto adelante en la tecnología de aviación militar y la eficacia operacional estratégica."
 ENG_boeing_p8_poseidon: "Boeing P8 Poseidon"
 ENG_boeing_p8_poseidon_desc: "El Boeing P-8 Poseidon es un avión de patrullas marítimas de múltiples misiones diseñado para operaciones antisubmarinas de largo alcance, guerra contra la superficie e inteligencia, vigilancia y reconocimiento. Sobre la base del aerolineador Boeing 737, el P-8 Poseidon cuenta con sensores avanzados, sistemas de comunicación y capacidades de armas, lo que lo convierte en una plataforma altamente eficaz para las misiones de patrullaje marítimo."
 ENG_revive_p125_project: "Revive P125 Project"
 ENG_revive_p125_project_desc: "El proyecto P125 revivido busca desarrollar una plataforma de aviones versátil y eficaz en función del costo capaz de cumplir diversas funciones, como la superioridad del aire, el apoyo aéreo cercano, el reconocimiento y la capacitación. Al incorporar aviónicos de vanguardia, sensores y sistemas de armas, el avión P125 modernizado ofrecerá mayor rendimiento, supervivencia y eficacia de la misión."
 ENG_joint_strike_fighter_project: "Proyecto conjunto de luchadores de huelga"
 ENG_joint_strike_fighter_project_desc: "Con capacidades avanzadas de sigilo, tecnología de fusión de sensores y capacidades de misión multirregular, el F-35 Joint Strike Fighter proporciona una conciencia y letalidad situacionales inigualables en operaciones aéreas al aire y de aire a tierra."
 ENG_bae_systems_tempest: "Sistemas BAE Tempest"
 ENG_bae_systems_tempest_desc: "La Tempestad de Sistemas BAE es un concepto innovador de aviones de combate de sexta generación diseñado para satisfacer las necesidades cambiantes de la guerra aérea moderna. Con tecnología avanzada de sigilo, capacidades de fusión de sensores y sistemas autónomos, la Tempest está preparada para ofrecer un mejor rendimiento, supervivencia y letalidad en entornos espaciales disputados."
 ENG_defence_industrial_policy: "Política industrial de defensa"
 ENG_defence_industrial_policy_desc: "La Política Industrial de Defensa Británica describe el marco estratégico que guía el desarrollo, la gestión y la sostenibilidad de la base industrial de defensa nacional. Con un rico patrimonio de innovación y excelencia, la industria de defensa del Reino Unido desempeña un papel fundamental en el apoyo a los objetivos de seguridad nacional, la promoción de la prosperidad económica y el mantenimiento del liderazgo tecnológico en la etapa global."
 ENG_british_overseas_territories: "Territorios británicos de ultramar"
 ENG_british_overseas_territories_desc: "Los Territorios Británicos de Ultramar abarcan un grupo diverso de territorios y jurisdicciones repartidos por todo el mundo, cada uno con sus características culturales, geográficas y políticas únicas. Estos territorios, que incluyen lugares icónicos como Gibraltar, las Bermudas y las Islas Caimán, mantienen fuertes vínculos con el Reino Unido mientras disfrutan de diversos grados de autonomía y autogobierno."
 ENG_cayman_enterprise_city: "Ciudad de empresa Cayman"
 ENG_cayman_enterprise_city_desc: "Cayman Enterprise City es una zona económica especial en las Islas Caimán, ofreciendo una plataforma única para que las empresas internacionales establezcan una presencia física en una jurisdicción neutra de impuestos. Con procesos e incentivos simplificados, proporciona un entorno propicio para que las empresas de industrias como la tecnología, la biotecnología y los medios de comunicación prosperen y crezcan."
 ENG_illex_fishery: "Illex Fishery"
 ENG_illex_fishery_desc: "La Pesquería Illex es una parte vital de la economía de las Islas Falkland, centrándose en la cosecha sostenible de las especies de calamares Illex. Gestionado cuidadosamente para garantizar la viabilidad a largo plazo, la pesca apoya los medios de subsistencia locales y contribuye a la seguridad alimentaria y estabilidad económica de la región."
 ENG_north_mole_power_plant: "Planta eléctrica de North Mole"
 ENG_north_mole_power_plant_desc: "Situada en Gibraltar, la central eléctrica del Mole Norte desempeña un papel crucial para satisfacer las necesidades energéticas del territorio. Equipado con tecnología e infraestructura modernas, proporciona una generación de electricidad confiable, apoyando la vida cotidiana y las actividades económicas de los residentes y negocios de Gibraltar."
 ENG_biras_creek_resort: "Biras Creek Resort"
 ENG_biras_creek_resort_desc: "Ubicado en las Islas Vírgenes Británicas, Biras Creek Resort ofrece un lujoso retiro en medio de una belleza natural impresionante. Conocido por sus playas apartadas, alojamientos lujosos y servicio personalizado, ofrece una escapada idílica para los viajeros que buscan relajación y rejuvenecimiento en un paraíso tropical."
 ENG_bermuda_innovation_sprint: "La innovación de las Bermudas Sprint"
 ENG_bermuda_innovation_sprint_desc: "The Bermuda Innovation Sprint es una iniciativa encaminada a fomentar la innovación y el emprendimiento en la isla. Mediante programas de acelerador, mentoría y oportunidades de financiación, apoya a startups y empresas tecnológicas para desarrollar soluciones innovadoras y impulsar el crecimiento económico en las Bermudas."
 ENG_princes_lodge_plantation: "Príncipes Lodge Plantation"
 ENG_princes_lodge_plantation_desc: "Princes Lodge Plantation es una finca histórica en Santa Elena, mostrando el rico patrimonio cultural y las tradiciones agrícolas de la isla. Con su pintoresco entorno y arquitectura colonial conservada, ofrece a los visitantes un vistazo al pasado de la isla mientras contribuyen a los esfuerzos de turismo cultural y conservación del patrimonio local."
 ENG_beaches_turks_caicos: "Beaches Turks Caicos"
 ENG_beaches_turks_caicos_desc: "Playas Turcas y Caicos es un lujoso destino turístico todo incluido reconocido por sus playas prístinas, comodidades de lujo y ambiente familiar. Ofrece una amplia gama de actividades y opciones de entretenimiento, que ofrece una experiencia inolvidable para los huéspedes de todas las edades en las Islas Turcas y Caicos."
 ENG_little_bay_port_development_project: "Pequeño proyecto de desarrollo del puerto de Bay"
 ENG_little_bay_port_development_project_desc: "El proyecto Little Bay Port Development tiene como objetivo mejorar la infraestructura y las perspectivas económicas de Montserrat mediante el desarrollo de una moderna instalación portuaria en Little Bay. Con una mayor capacidad de transporte y logística, busca estimular el comercio, el turismo y las oportunidades de inversión en la isla."
 ENG_pitcairn_islands_study_center: "Centro de estudio de islas Pitcairn"
 ENG_pitcairn_islands_study_center_desc: "El Centro de Estudios de las Islas Pitcairn es una institución de investigación dedicada al estudio y preservación de la historia, cultura y biodiversidad de las Islas Pitcairn. A través de sus archivos, publicaciones y programas educativos, promueve la conciencia y el reconocimiento de estos territorios remotos y únicos."
 ENG_share_vtol_research: "Compartir VTOL Research"
 ENG_share_vtol_research_desc: "Share VTOL Research incluye iniciativas de colaboración e intercambio de conocimientos entre las partes interesadas del sector y las instituciones de investigación para promover la tecnología vertical de despegue y aterrizaje (VTOL)"
 ENG_channel_homegrown_innovation: "Canal Homegrown Innovation"
 ENG_channel_homegrown_innovation_desc: "Mediante el apoyo a las startups, las instituciones de investigación y las pequeñas empresas, se busca catalizar el desarrollo de tecnologías y soluciones de vanguardia que aborden retos y oportunidades claves en la industria. Mediante la colaboración, el apoyo financiero y la creación de ecosistemas, tiene como objetivo posicionar al Reino Unido como líder mundial en innovación aérea, impulsando el crecimiento económico y la competitividad."
 ENG_revive_british_aviation_industry: "Revive la industria aeronáutica británica"
 ENG_revive_british_aviation_industry_desc: "Mediante la promoción de la inversión, la innovación y el desarrollo de aptitudes, se procura revitalizar las capacidades nacionales de producción, aumentar la resiliencia de la cadena de suministro y crear empleos de alta calidad en todo el país."
 ENG_focus_on_component_manufacturing: "Enfoque Sobre la fabricación de componentes"
 ENG_focus_on_component_manufacturing_desc: "Al invertir en tecnologías avanzadas de fabricación, capacitación laboral y medidas de resiliencia de la cadena de suministro, tiene por objeto captar un mayor valor y competitividad en el mercado mundial aeroespacial. Mediante asociaciones con OEM, proveedores de niveles y organizaciones de investigación, busca promover la innovación, eficiencia y calidad en todo el ecosistema del componente aeroespacial."
 ENG_us_uk_collaboration: "US-UK Collaboration"
 ENG_us_uk_collaboration_desc: "Los Estados Unidos siempre buscan buenos socios. Al abrazar los Proyectos de Aviación Británica, podríamos trabajar juntos para recibir más financiación y darles algo de nuestra innovación"
 ENG_skylon_engine: "Motor Skylone"
 ENG_skylon_engine_desc: "Skylone Engine representa un innovador esfuerzo en la industria aeroespacial del Reino Unido, centrándose en el desarrollo de sistemas de propulsión de próxima generación. Mediante la ingeniería avanzada, la ciencia de materiales y el modelado computacional, esta iniciativa tiene como objetivo diseñar y fabricar motores jet de alto rendimiento que ofrezcan una eficiencia, fiabilidad y sostenibilidad excepcionales."
 ENG_rebirthing_black_arrow: "Renacimiento Negro Flecha"
 ENG_rebirthing_black_arrow_desc: "Rebirthing Black Arrow conmemora el legado del programa Black Arrow, un proyecto histórico británico de vehículos de lanzamiento espacial. Esta iniciativa tiene por objeto reactivar y modernizar el espíritu de exploración espacial en el Reino Unido desarrollando capacidades avanzadas de lanzamiento y tecnologías satelitales."
 ENG_lightweight_fire_platform_artillery: "Artillería de la plataforma de fuego ligero"
 ENG_lightweight_fire_platform_artillery_desc: "El proyecto Lightweight Fire Platform Artillery tiene como objetivo desarrollar e implementar un sistema de artillería versátil y móvil optimizado para el despliegue rápido y el soporte de fuerza de fuego de precisión. Al aprovechar materiales ligeros, principios de diseño modular y sistemas avanzados de control de incendios, esta iniciativa busca mejorar la agilidad, capacidad de respuesta y letalidad de las unidades de artillería en diversos entornos operacionales."
 ENG_harpoon_replacement: "Reemplazamiento de Harpoon"
 ENG_harpoon_replacement_desc: "El programa de reemplazo de Harpoon se centra en desarrollar un sistema anti-misiles de próxima generación para reemplazar los misiles Harpoon envejecidos en el arsenal militar británico. Mediante el aprovechamiento de la orientación avanzada, la propulsión y las tecnologías orientadas hacia ellos, esta iniciativa tiene por objeto proporcionar a las fuerzas navales mayor alcance, precisión y letalidad contra las amenazas superficiales en los entornos marítimos."
 ENG_codify_service_economy: "Codificar la economía basada en el servicio"
 ENG_codify_service_economy_desc: "Durante décadas, Gran Bretaña se ha convertido en un modelo dirigido por los servicios. Finanzas, consultoría y medios de comunicación llenando la brecha que dejaron las fábricas cerradas. Es hora de que esta deriva sea una estrategia explícita."
 ENG_gate_burton_energy: "Construir Gate Burton Energy Park"
 ENG_gate_burton_energy_desc: "Gate Burton Energy Park convertirá la granja cerca de Lincolnshire's Gate Burton en un importante solar y batería, alimentando energía limpia en el Grid Nacional y ayudando a reemplazar la generación de carbón y gas envejecido."
 ENG_gate_burton_energy_tt: "Add §G1§! §Y Parque de Batería§!"
 ENG_ai_white_collar: "AI para el trabajo de color blanco"
 ENG_ai_white_collar_desc: "De las firmas de leyes a las casas contables, los sistemas AI comienzan a manejar el análisis rutinario y el trabajo en documentos. Los empleos desaparecen, aumentan los márgenes."
 ENG_empower_city_london: "Empoderar la ciudad de Londres"
 ENG_empower_city_london_desc: "Al aliviar las reglas de planificación y respaldar nuevas torres en la Milla de Plazas, animamos a los bancos y empresas de servicios a ampliar su huella. Grado fresco Un espacio de oficinas en la ciudad aumentará más rápido, anclando el papel de Londres como centro financiero global."
 ENG_empower_edinburgh: "Empower Distrito Financiero de Edimburgo"
 ENG_empower_edinburgh_desc: "Al respaldar nuevas oficinas de Grade A e infraestructura alrededor del distrito New Town and Exchange, ayudamos a los bancos y administradores de activos de Edimburgo a ampliar su huella, fortaleciendo el segundo centro financiero del Reino Unido fuera de Londres."
 ENG_found_invest_northern_ireland: "Encontrado invierte Irlanda del Norte"
 ENG_found_invest_northern_ireland_desc: "Creamos Invertir Irlanda del Norte para comercializar la región en el extranjero y atraer un flujo constante de nuevas fábricas, oficinas y muelles."
 ENG_digital_government: "Cambio de Gobierno digital"
 ENG_digital_government_desc: "Digitalizamos servicios públicos, impuestos, licencias, beneficios, reducción de papeleo y costos de corte."
 ENG_invest_silicon_glenn: "Invertir en Silicon Glen"
 ENG_invest_silicon_glenn_desc: "Canalizamos financiación en Silicon Glen de Escocia, ampliando laboratorios y parques tecnológicos para acelerar la investigación en informática, Internet e inteligencia artificial."
 ENG_cross_border_cooperation: "Cooperación transfronteriza"
 ENG_cross_border_cooperation_desc: "Profundizamos la cooperación práctica entre Irlanda del Norte e Irlanda, cortando la cinta roja y fomentando el comercio transfronterizo y la influencia."
 ENG_national_data_infrastructure: "Infraestructura nacional de datos"
 ENG_national_data_infrastructure_desc: "Enrollamos redes nacionales de fibras, centros de datos y columna vertebral para acelerar las conexiones digitales, ampliar el alcance de la oferta y agudizar la productividad en toda la economía."
 ENG_admiral_group: "Compañero con el grupo Almirante"
 ENG_admiral_group_desc: "Trabajamos con el Grupo de Almirantes en Cardiff para ampliar la cobertura del seguro privado, aliviando la presión sobre los presupuestos de bienestar y salud."
 ENG_fintech_open_banking: "Fintech & abre el centro bancario"
 ENG_fintech_open_banking_desc: "Convertimos al Reino Unido en un centro financiero líder y abierto de la banca, impulsando los recibos de impuestos corporativos mientras bajamos el costo de los préstamos del gobierno."
 ENG_global_consulting_state: "Estado consultor global"
 ENG_global_consulting_state_desc: "Apoyamos consultorías británicas y bufetes de abogados en todo el mundo, ampliando nuestra influencia, profundizando los vínculos de investigación y aprovechando más la inversión extranjera."
 ENG_lean_manufacturing: "Fabricación magra"
 ENG_lean_manufacturing_desc: "Al rodar robótica, sensores y flujos de trabajo justo a tiempo en nuestras plantas, reemplazamos el trabajo podrido con líneas automatizadas. Los factores atraen más potencia pero usan menos trabajadores, mientras que la producción y eficiencia aumentan con cada carrera de producción."
 ENG_cloud_isles: "Cloud Isles"
 ENG_cloud_isles_desc: "Hacemos de Gran Bretaña un centro para vastos centros de datos y campus en la nube. Las oficinas obtienen más energía para alimentar las granjas de servidores, pero los servicios digitales que acogen generan mayores ingresos fiscales y avances de investigación más rápidos."
 ENG_algorithmic_finance: "Finanzas Algorítmicas"
 ENG_algorithmic_finance_desc: "Desplegamos motores avanzados de riesgo y sistemas automatizados de tesorería para gestionar los flujos de efectivo, la deuda y los pagos, reducir la burocracia y reducir los costos de funcionamiento del gobierno."
 ENG_invest_harland_wolff: "Invertir en Harland & Wolff"
 ENG_invest_harland_wolff_desc: "Vertificamos capital fresco en Harland & Los patios de Wolff en Belfast y más allá, reabriendo resbalones, contratando trabajadores cualificados e impulsando la salida de nuestros muelles."
 ENG_critical_minerals_strategy: "Estrategia de Minerales críticos"
 ENG_critical_minerals_strategy_desc: "Lanzamos una estrategia nacional de minerales críticos, respaldando nuevos proyectos en Cornwall, Gales y más allá para asegurar los ores clave y mejorar el acceso de Gran Bretaña a recursos vitales."
 ENG_dogger_bank_offshore: "Centro de energía offshore del banco Dogger"
 ENG_dogger_bank_offshore_desc: "Apoyamos el complejo eólico offshore del Banco Dogger en el Mar del Norte, construyendo la granja eólica más grande del mundo para ofrecer energía limpia a millones de hogares británicos."
 ENG_hinkley_point_c: "Punto completo de Hinkley C"
 ENG_hinkley_point_c_desc: "Avanzamos con el proyecto Hinkley Point C de dos puntos en Somerset, añadiendo más de 3 GW de potencia de baja carga de carbono a largo plazo a la cuadrícula."
 ENG_acknowledge_industrial_collapse: "Reconocer el colapso industrial"
 ENG_acknowledge_industrial_collapse_desc: "De Redcar en Teesside a Port Talbot en el sur de Gales, los hornos de explosión han ido frío y comunidades enteras han perdido su columna vertebral industrial. Finalmente debemos admitir lo lejos que ha caído la industria pesada de Gran Bretaña antes de reconstruirla."
 ENG_building_brittain_fit_future: "Construyendo una Gran Bretaña para el futuro"
 ENG_building_brittain_fit_future_desc: "Lanzamos una estrategia industrial a largo plazo para aumentar la productividad y ganar energía, invirtiendo en ideas, personas, infraestructuras y lugares de todo el Reino Unido."
 ENG_northern_powerhouse: "North Powerhouse & Midlands Engine"
 ENG_northern_powerhouse_desc: "Vinculamos el Northern Powerhouse y Midlands Engine en un solo corredor de crecimiento, transporte de respaldo, habilidades e inversión empresarial para elevar la productividad desde Liverpool y Manchester a través de Birmingham hasta East Midlands."
 ENG_aerospace_wales: "Gales Aeroespaciales"
 ENG_aerospace_wales_desc: "Apoyamos el clúster aeroespacial de Gales alrededor de Airbus Broughton, St Athan y el centro MRO más amplio, impulsando la producción local de alas, trabajos de reparación y trabajos de aviación de alto valor."
 ENG_marine_power_systems: "Apoyo a sistemas de energía marina"
 ENG_marine_power_systems_desc: "Apoyamos los Sistemas de Energía Marina basados en Gales para ampliar las plataformas flotantes de viento y olas, convirtiendo astilleros y puertos locales en centros para la energía marina de próxima generación."
 ENG_develop_edinburgh_west_end: "Desarrollar Edimburgo West End"
 ENG_develop_edinburgh_west_end_desc: "Actualizamos el distrito de intercambio del West End en una mezcla más densa de oficinas, laboratorios y talleres modernos, potenciando la producción local de investigación y eficiencia de producción a la vez que agregamos nuevo espacio para nuestras facciones líderes para expandirse."
 ENG_develop_bae_aerospace: "Desarrollar BAE Aerospace en Escocia"
 ENG_develop_bae_aerospace_desc: "Ampliamos la huella aeroespacial de BAE en Prestwick y otros sitios escoceses, agregando nuevos hangares, talleres e equipos de ingeniería para apoyar aviones de combate avanzados y programas futuros."
 ENG_glasgow_shipbuilidng: "Centro de construcción naval de Glasgow"
 ENG_glasgow_shipbuilidng_desc: "Modernizamos los patios de Clyde en Govan y Scotstoun, convirtiendo a Glasgow en un centro a largo plazo para la construcción de buques militares y las exportaciones navales."
 ENG_high_value_manufacturing_zones: "Zonas de fabricación de alto valor"
 ENG_high_value_manufacturing_zones_desc: "Designamos zonas de fabricación de alto valor alrededor de centros de estilo catapulta y parques científicos, dando a las empresas un acceso más rápido a laboratorios, habilidades e instalaciones modernas para elevar la productividad y la producción avanzada."
 ENG_high_value_manufacturing_zones_tt: "Si un estado tiene §G5§! §Y$infrastructure$§!, al menos §G10§! §Y$industrial_complex$§!, al menos §G5§! §Y$offices$§!, al menos §G5§! §Y$arms_factory$§! OR §G5§! §Y$dockyard$§!, añadiremos por estado:"
 ENG_steel_guarantee: "Garantía de acero"
 ENG_steel_guarantee_desc: "Cometemos financiación a largo plazo y garantías para proyectos de acero con bajas emisiones de carbono, dando a los inversores la confianza en modernizar las plantas y asegurar la fabricación de acero nacional durante décadas."
 ENG_steel_guarantee_tt: "§Y[10.GetName],[11.GetName], [12.GetName]§! o §Y[1191.GetName]§! ganará:\nMás de §Y4 $industrial_complex$§!: §G+6§! §Y$country_resource_steel$§!.\nMás de §Y4 $offices$§!: §G+3§! §Y$country_resource_tungsten$§!.\nTodo §YFacility§! y §Y$sp_improved_synthetic_diamonds$§! completado: un §G+3§! §Y$country_resource_chromium$§!."
 ENG_celsa_steel: "Soporte Celsa Steel Cardiff"
 ENG_celsa_steel_desc: "Retrocedemos las siderurgias de arco eléctrico de Celsa y el molino de varillas y barras en Cardiff, levantando la salida de rebar de carbono bajo y varilla de alambre manteniendo un importante reciclador de galés y empleador funcionando a toda capacidad."
 ENG_expand_scottish_steel: "Ampliar el acero escocés"
 ENG_expand_scottish_steel_desc: "Invertimos en los Dalzell y Clydebridge para reiniciar la producción de placas, asegurar el acero escocés para buques de guerra y viento offshore, y cultivar una moderna base de acero pesado al norte de la frontera."
 ENG_refine_natural_bauxite: "Refine Bauxite Natural"
 ENG_refine_natural_bauxite_desc: "Construimos instalaciones de alumina alrededor de Edimburgo para refinar la bauxita importada en materia prima de alta calidad, lo que aumenta la producción nacional de aluminio de Escocia."
 ENG_deep_mining_coal: "Revive Deep Coal Mining en Escocia"
 ENG_deep_mining_coal_desc: "Volvemos a abrir costuras profundas en los antiguos campos de carbón de Escocia, hundiendo nuevos ejes y reconstruyendo infraestructura de pozos para restaurar la producción subterránea de carbón al norte de la frontera."
 ENG_opencast_mining: "Expand Opencast Mining en Escocia"
 ENG_opencast_mining_desc: "Licenciamos nuevos sitios de apertura en los campos de carbón de Escocia, despojando sobrecargados para llegar a costuras poco profundas y potenciar los suministros nacionales de carbón."
 ENG_cononish_gold_silver: "Oro contemporáneo & Obras de plata"
 ENG_cononish_gold_silver_desc: "Apoyamos la mina de Cononish cerca de Tyndrum, convirtiendo el único depósito comercial de oro y plata de Escocia en una fuente constante de metales preciosos para la nación."
 ENG_national_productivity_commission: "Comisión Nacional de Productividad"
 ENG_national_productivity_commission_desc: "Establecemos una Comisión Nacional de Productividad para alinear las políticas de inversión, infraestructura e innovación en torno a una misión: aumentar la productividad en todo el Reino Unido."
 ENG_infrastructure_for_productivty: "Estrategia Nacional de Infraestructura"
 ENG_infrastructure_for_productivty_desc: "Implementamos una Estrategia Nacional de Infraestructura para dirigir caminos, redes ferroviarias y digitales que elevan la productividad en lugar de retenerla."
 ENG_universaties_engines_of_growth: "Fuerza en el Fondo de Lugares"
 ENG_universaties_engines_of_growth_desc: "Ponemos en marcha un fondo de estilo Strength in Places, respaldando las asociaciones entre universidades y negocios en toda Inglaterra para convertir los puntos fuertes de investigación locales en empleos, inversiones y crecimiento."
 ENG_hs2: "Lanzamiento de alta velocidad 2"
 ENG_hs2_desc: "Damos la luz verde a High Speed 2, autorizando la primera fase entre Londres y Midlands y comprometiéndonos a décadas de inversión en nuevos carriles de alta velocidad."
 ENG_northern_powerhouse_rail: "Carril de la central eléctrica del norte"
 ENG_northern_powerhouse_rail_desc: "Nos comprometemos con Northern Powerhouse Rail, una nueva y actualizada red este-oeste que une Liverpool, Manchester, Leeds y el norte más ancho con trenes más rápidos y frecuentes y mayor capacidad para pasajeros y fletes."
 ENG_euston_canary_wharf_integration: "Integrar Euston y Canary Wharf"
 ENG_euston_canary_wharf_integration_desc: "Atamos el termino HS2 en Euston a la red este-oeste de Londres y Tube, creando enlaces sin costuras a la Ciudad y Canary Wharf para que los pasajeros de alta velocidad puedan llegar a los distritos financieros de la capital en minutos."
 ENG_midland_main_lines: "Actualización de la línea principal Midland"
 ENG_midland_main_lines_desc: "Presionamos con la mejora y electrificación de la Línea Principal de Midland entre Londres y el East Midlands, cortando los tiempos de viaje y liberando capacidad para pasajeros y fletes."
 ENG_russel_group: "Universidades del grupo Russell"
 ENG_russel_group_desc: "Profundizamos los vínculos con las universidades intensivas de investigación del Grupo Russell, respaldando proyectos conjuntos que convierten la ciencia líder en el mundo en crecimiento en todo el país."
 ENG_golden_triangle_research: "Investigación de Triángulo Dorado Arc"
 ENG_golden_triangle_research_desc: "Profundizamos los vínculos entre Oxford, Cambridge y las principales universidades de Londres, construyendo un arco de investigación del Triángulo de Oro que concentra laboratorios de clase mundial, talento y financiación en un solo corredor de innovación de alto impacto."
 ENG_imperial_king_tech_clusters: "Imperial & Grupos Técnicos del Rey"
 ENG_imperial_king_tech_clusters_desc: "Vinculamos el campus de innovación de la Ciudad Blanca Imperial con centros tecnológicos y sanitarios de King, construyendo grupos densos donde laboratorios, startups e inversores pueden convertir investigación fronteriza en avances comerciales."
 ENG_skill_england_technical: "Habilidades Inglaterra & Senderos técnicos"
 ENG_skill_england_technical_desc: "Trabajamos con Skills England para mapear las brechas de habilidades y ampliar las rutas técnicas y los aprendizajes, dando a más personas caminos claros y de alta calidad al trabajo cualificado."
 ENG_closing_britains_productivity_gap: "Cerrar Gap de productividad de Gran Bretaña"
 ENG_closing_britains_productivity_gap_desc: "Después de años de inversión específica en infraestructura, universidades y habilidades, nuestra brecha de productividad finalmente comienza a cerrar, levantar la producción por trabajador y dar espacio económico para salarios más altos y mejores servicios."
 ENG_closing_britains_productivity_gap_tt: "Podemos revertir la pena de productividad investigando §Y$CAT_infrastructure$§!"
 ENG_ambitions_for_britain: "Ambiciones para Gran Bretaña"
 ENG_ambitions_for_britain_desc: "Gran Bretaña no puede ser dejado para pudrirse mientras el tiempo se mueve. Gran Bretaña debe ser ambiciosa, y para eso, los británicos necesitan al Partido Laborista. Mediante su determinación, el Partido Laborista catapultará al Reino Unido para convertirse en uno de los mayores actores mundiales de nuestra edad. El nuevo milenio será nuestro."
 ENG_deeper_prosperity: "Prosperidad profunda"
 ENG_deeper_prosperity_desc: "Lograremos una prosperidad más profunda creando más empleos e incentivando a nuestro pueblo para buscar oportunidades de empleo. Esto sólo podría lograrse mediante la creación de un entorno sostenible, en particular mediante una infraestructura adecuada."
 ENG_every_region_of_the_country: "Cada Región del País"
 ENG_every_region_of_the_country_desc: "Nuestros esfuerzos no serán aislados a los principales centros de la sociedad, no, priorizará cada región del país. Somos un sindicato, después de todo. Sin igual distribución de recursos, el Estado fracturará y creará desigualdades para las grandes poblaciones urbanas y rurales."
 ENG_the_foundation: "La fundación"
 ENG_the_foundation_desc: "La fundación, el pilar y la columna vertebral de este país es el trabajador duro que pasa incontables horas en servicio a su país. La iniciación de reformas que permitan una mayor flexibilidad en el lugar de trabajo cuando se trata de vacaciones, tiempo libre y licencia por enfermedad será un cambio importante para mantener este pilar de la sociedad fuerte."
 ENG_nhs_reform: "Reforma del NHS"
 ENG_nhs_reform_desc: "El servicio nacional de salud es una necesidad desesperada de reforma. No sólo el cambio de nivel superficial donde pedimos la construcción de nuevos hospitales e instalaciones médicas, no, vamos a empujar por la sincronización del sector privado y público hacia mejor el NHS para que podamos reducir los tiempos de espera, modernizar nuestras instalaciones existentes, y tomar en más pacientes de manera más oportuna."
 ENG_reinassaince_of_status: "Renacimiento de la situación"
 ENG_reinassaince_of_status_desc: "Nuestra gente necesita poder escalar la escalera social y avanzar económicamente. Como tal, debemos intervenir temprano en sus vidas. Concediendo centros de educación superior las herramientas necesarias que necesitan, podremos poner a disposición más fácilmente los recursos que nuestra gente necesita para avanzar en la sociedad."
 ENG_a_grand_promise: "Una gran promesa"
 ENG_a_grand_promise_desc: "Para mantener el apoyo a nuestro partido tendremos que hacer una gran promesa que cautivará a nuestros constituyentes. Al cumplir esta promesa podremos consolidar la credibilidad de nuestra coalición y hacer un gran golpe a nuestra oposición."
 ENG_more_frontline_staff: "Más personal de primera línea"
 ENG_more_frontline_staff_desc: "Necesitamos fomentar la productividad agrícola alentando a más personal de primera línea a llevar al lugar de trabajo. A través de programas de incentivos podremos reconstruir el espíritu agrícola falsificado en nuestro país."
 ENG_foster_the_tech_revolution: "Fomentar la revolución de silicona"
 ENG_foster_the_tech_revolution_desc: "Una nueva revolución se está desarrollando justo delante de nuestros propios ojos, la revolución del silicio. A través de la tecnología, las economías mundiales están empezando a cambiar sus formas nunca antes. Antiguas sociedades rurales y agrícolas han comenzado a transformarse en algunas de las economías más formidables mediante microchips y otros electrónicos. También debemos comenzar a capitalizar esta nueva tendencia lo antes posible."
 ENG_uplift_traditional_industry: "Uplift Industria Tradicional"
 ENG_uplift_traditional_industry_desc: "No tenemos necesidad de la fama electrónica con la que gran parte del mundo está tan atrapado. En vez de eso, podemos centrarnos en lo que sabemos ha funcionado históricamente y fría industria dura. ¿Por qué debemos apostar por cosas tan masculinas que podrían poner en peligro nuestra economía?"
 ENG_prioritize_the_teachers: "Priorizar a los Educadores"
 ENG_prioritize_the_teachers_desc: "Poner el papel de los educadores en la sociedad tendrá enormes beneficios que se harán eco en toda la nación y la región. Al establecer su papel en las vidas de los civiles [ENG.GetAdjective], la gente finalmente comenzará a apreciar la educación por lo que es verdaderamente."
 ENG_prioritize_the_doctors: "Priorizar a los Doctores"
 ENG_prioritize_the_doctors_desc: "Los médicos son lo que impide que la gente muera, son lo que evita la propagación de enfermedades, y son lo que mantiene un sentido más amplio de seguridad en nuestro país. Al ayudar a avanzar en el papel de los médicos y del personal médico, también podremos alentar a más personas a llenar funciones del NHS que son muy deficientes."
 ENG_strengthening_communities: "Fortalecimiento de las comunidades"
 ENG_strengthening_communities_desc: "Fortalecer las comunidades y fortalecer la identidad británica nos permitirá fomentar un mayor sentido de unidad nacional. Esto nos permitirá proteger los valores que más apreciamos mientras creamos cohesión social a un nivel más eficiente."
 ENG_to_europa_and_beyond: "¡A Europa y Más Allá!"
 ENG_to_europa_and_beyond_desc: "Somos europeos primero, británico segundo. Olvidar nuestra casa regional es olvidar quiénes somos. Debemos seguir una integración más profunda con el continente europeo y la Unión Europea en su conjunto para que podamos respaldar la visión más grande de todos los pueblos europeos."
 ENG_no_one_left_behind: "No hay nadie detrás"
 ENG_no_one_left_behind_desc: "Ni un Briton se quedará detrás de nuestra huella hacia la grandeza. Todos serán ayudados y trasladados a la meta de la sociedad y juntos soportaremos esta gran lucha hacia el éxito."
 ENG_criminal_justice_reform: "Reforma de la justicia penal"
 ENG_criminal_justice_reform_desc: "Fortalecer nuestro sistema de justicia también fortalecerá a su vez nuestras normas democráticas de larga data. Al racionalizar el proceso judicial, la fe dentro de nuestras instituciones democráticas también aumentará y será más probable que se establezca un apoyo a largo plazo para el gobierno."
 ENG_welfare_reform: "Reforma del bienestar"
 ENG_welfare_reform_desc: "Establecer una relación creíble con nuestros constituyentes sólo podría lograrse mediante la reforma de nuestro sistema de bienestar social. Al demostrar que nos preocupamos por sus vidas cotidianas, podremos darles una docena de razones en cuanto a por qué deberían seguir votándonos en el cargo."
 ENG_tax_reform: "Reformas tributarias"
 ENG_tax_reform_desc: "§R'W-wait. ¿Dónde fue mi dinero?'§!\n\nMediante la aprobación de reformas tributarias, no sólo podremos reforzar nuestra economía y tesorería, sino que también avanzaremos hacia la financiación de nuestros programas de reforma social. Aunque podría ser un poco impopular con aquellos que van a ser impuestos."
 ENG_productivity_challenge: "El desafío de la productividad"
 ENG_productivity_challenge_desc: "Estamos encontrando cada vez más difícil conseguir que algunos de nuestros trabajadores... trabajen bien. Al empujar algunos cambios podemos inducirlos a hacer algo productivo una vez más."
 ENG_britain_forward_not_back: "Gran Bretaña para adelante, no para atrás"
 ENG_britain_forward_not_back_desc: "Sólo tenemos que mirar hacia adelante para ver a dónde vamos, y si no nos hacemos cargo de nuestro futuro, entonces nuestro destino estará en manos de los destinos. No queremos eso. Queremos dirigir nuestro país hacia la grandeza y eso sólo se puede lograr estableciendo lo que debemos hacer primero para llegar allí."
 ENG_competition_planning_and_regulation: "Planificación y reglamentación de la competencia"
 ENG_competition_planning_and_regulation_desc: "No podemos tener competencia sin regulación. Sin los controles adecuados en su lugar, las corporaciones se irán de los carriles y absorber negocios más pequeños, esencialmente gastando ingresos por miles si no millones."
 ENG_new_rights_new_choices: "Nuevos derechos, nuevas elecciones"
 ENG_new_rights_new_choices_desc: "Al dar a nuestro pueblo más derechos en materia de cuándo quiere trabajar, podremos aumentar la productividad nacionalmente. Actualmente, algunos lugares de trabajo restringen el lugar de trabajo a aquellos que no están por encima de la edad de jubilación, con los que están siendo expulsados lentamente. Al dar a los que están por encima de la jubilación trincamos la capacidad de trabajar de nuevo traeremos mayor estabilidad económica."
 ENG_supporting_science: "Apoyo a la ciencia"
 ENG_supporting_science_desc: "Mediante el apoyo a nuevos métodos de excavación científica podremos aumentar nuestra capacidad para suministrar programas nacionales de investigación y aumentar nuestra capacidad de exportar más bienes en la etapa internacional."
 ENG_codify_key_of_convetions: "Codificar la clave de los Convenios"
 ENG_codify_key_of_convetions_desc: "Al codificar finalmente la clave de los Convenios, convertiremos finalmente las reglas políticas en normas jurídicas. Nuestra política ya no será dictada por la tradición, sino más bien por la ley, y a través de esto podremos avanzar hacia una mejor democracia."
 ENG_generations_of_tomorrow: "Las generaciones del mañana"
 ENG_generations_of_tomorrow_desc: "La reforma del sistema de pensiones finalmente nos permitirá establecer una red de seguridad concreta para nuestras generaciones actuales y futuras. Actualmente muchos están recibiendo demasiado bajo de un estipendio, o ninguno en absoluto, y es hora de que hagamos algo al respecto."
 ENG_fostering_entrepreneurship: "Fomento de la capacidad empresarial"
 ENG_fostering_entrepreneurship_desc: "Queremos que los innovadores inundan nuestro país, y para hacerlo, tenemos que empezar a asignar algunos fondos gubernamentales para lograr un ambiente sostenible para aquellos dispuestos a invertir en el futuro."
 ENG_modern_transport_infrastructure: "Modernización de la infraestructura de transporte"
 ENG_modern_transport_infrastructure_desc: "Si todos nuestros caminos están desordenados y rotos, ¿qué bien está conduciendo? Invertir en programas de infraestructura nuevos e innovadores allanará el camino hacia una Gran Bretaña mejor y más funcional."
 ENG_thriving_rural_scene: "A Escena Rural"
 ENG_thriving_rural_scene_desc: "Nuestros asentamientos rurales no pueden ser dejados a los vientos de la historia y olvidados. En cambio, abrazaremos estas zonas rurales y fomentaremos aún más sus actividades."
 ENG_scraping_the_skies: "Raspando los Cielos"
 ENG_scraping_the_skies_desc: "Si queremos construir nuestra imagen en el escenario internacional vamos a necesitar algunas torres, específicamente torres que asombrarían al mundo por lo magníficos que son."
 ENG_creative_cities: "Ciudades Creativas"
 ENG_creative_cities_desc: "Al fomentar las influencias culturales para diseñar nuevos lugares urbanos, crearemos la condición perfecta para reforzar nuestro espíritu y moral de los pueblos, sin importar a dónde vayan."
 ENG_party_of_pensior_poverty: "El Partido de la Pobreza Jubilada"
 ENG_party_of_pensior_poverty_desc: "Los conservadores, Tory's o el 'Partido de Pobreza Jubilada' como nos gusta llamarlos, están degradando la integridad de nuestro sector social y arruinando activamente los medios de vida de aquellos que dependen de las pensiones para sobrevivir. Debemos dar un paso para asegurar que la gente sea consciente de sus prácticas atrasadas."
 ENG_fostering_home_ownership: "Fomento de la propiedad en el hogar"
 ENG_fostering_home_ownership_desc: "En lugar de incentivar a las personas para vivir con fondos gubernamentales, les ayudaremos en la adquisición de hogares para ellos y sus seres queridos. De esa manera, ellos serán capaces de descansar fácil sabiendo que no viven en mucho que no es suyo."
 ENG_social_housing: "Programas de Vivienda Social"
 ENG_social_housing_desc: "Seamos realistas, los precios caseros están empezando a soar y no hay señales de que se detengan. Debemos empujar programas de vivienda social que proporcionarán a nuestros constituyentes un techo sobre su cabeza y protección contra los elementos de la naturaleza."
 ENG_copyright_in_a_digital_age: "Derechos de autor en una era digital"
 ENG_copyright_in_a_digital_age_desc: "Nuestras leyes de derechos de autor actualmente no están donde necesitan estar, con muchas cláusulas que se quedan fuera o no están claras. Debemos codificar nuestras regulaciones y otorgar más protección a los medios de comunicación."
 ENG_strengthening_our_grids: "Fortalecer nuestras cuadrillas"
 ENG_strengthening_our_grids_desc: "Nuestra gente necesita energía fuerte, confiable y consistente para ir en sus días. Una salida al azar aquí y allí es inevitable, pero no debería ser día a día la vida. Al fortalecer nuestras principales redes, aseguraremos la fiabilidad de nuestro sector energético."
 ENG_strengthen_pension_credit: "Fortalecer el crédito de pensiones"
 ENG_strengthen_pension_credit_desc: "Al proporcionar una opción de beneficio del gobierno a las personas mayores de la edad de jubilación estatal que tienen bajos ingresos, podremos aumentar sus ingresos semanales a un nivel mínimo y ayudar con los costos de vivienda y otros gastos."
 ENG_the_workers_of_yesterday: "Los trabajadores de ayer"
 ENG_the_workers_of_yesterday_desc: "No podemos dejar que el trabajo de ayer vaya a desperdiciar, ampliaremos los programas de pensiones para aquellos que están jubilados y posiblemente incluso ofrezcan más beneficios si deciden pasar su experiencia a las nuevas generaciones."
 ENG_tenant_regulation: "Reglamento de los arrendatarios"
 ENG_tenant_regulation_desc: "No debemos abandonar a los dueños de casa que están alquilando propiedades para que otros puedan alquilar. Las propiedades deben ser respetadas, y por lo tanto, las regulaciones son un factor necesario para asegurar que todo el mundo sea feliz."
 ENG_a_future_fair_for_all: "Una futura feria para todos"
 ENG_a_future_fair_for_all_desc: "Parece que a medida que el mundo evoluciona, las condiciones de vida de la gente siguen desvolviendo. Tras la emoción que siguió en el Amanecer del nuevo Milenio, la esperanza llena de gente del mundo creía que sus gobiernos finalmente cambiarían sus caminos para mejor. Sin embargo, eso no fue el caso. El retroceso democrático, los costos crecientes y el caos general han llevado al mundo lejos de su camino. Debemos hacer todo lo posible para asegurar que el Reino Unido no caiga en esta espiral de muerte."
 ENG_crime_and_immigration: "La delincuencia y la migración"
 ENG_crime_and_immigration_desc: "Se ha pedido que se aumenten las restricciones a los migrantes de quienes tienen derecho. Mientras podemos ver de dónde vienen, doblar la rodilla a sus demandas significaría alejarse más lejos de los principios básicos de nuestro partido y moverse en una dirección más conservadora."
 ENG_democratic_reform: "Promoción de la reforma democrática"
 ENG_democratic_reform_desc: "En la actualidad, existen ciertas lagunas que permiten tomar decisiones más autocráticas a nivel estatal. Es hora de que tomemos las cosas en nuestras propias manos y finalmente empuje un proyecto de ley al parlamento que obligará a los que se beneficien de esta ambigüedad política."
 ENG_a_global_future: "Un futuro mundial"
 ENG_a_global_future_desc: "No podemos centrarnos únicamente en los asuntos del Estado, sino que debemos prestar atención también a las cuestiones mundiales. Con la soberanía de otros estados tomados en consideración, apuntaremos a difundir [ENG.GetAdjective] influencia mundial."
 ENG_national_renewal: "Renovación nacional"
 ENG_national_renewal_desc: "La reorientación de [ENG.GetAdjective] política ha llevado a un movimiento nacional de renovación, donde la gente sigue demandando cambio. No nos detendremos ni descansaremos, y sólo continuaremos dando cambio. Buen cambio, eso es."
 ENG_with_open_arms: "Con brazos abiertos"
 ENG_with_open_arms_desc: "Necesitamos reconocer la importancia de los migrantes. Si lo hacemos con los brazos abiertos o no, si continuamos empujando hacia fuera, perderemos algún talento serio que no adquiriríamos de otra manera."
 ENG_community_payback: "Programa Comunitario de Regreso"
 ENG_community_payback_desc: "El programa de reembolso comunitario tendrá por objeto permitir que las comunidades determinen cómo deben ser castigados los delincuentes. Esto puede ser de vez en cuando servido al tipo de servicio comunitario. Todo dependerá de las comunidades locales, pero toda la nación se beneficiará de ella."
 ENG_checks_on_migration: "Comprobaciones sobre migración"
 ENG_checks_on_migration_desc: "No importa cuánto necesitemos migrantes, no podemos simplemente dejarlos entrar sin ningún examen previo. Vamos a establecer algunos controles sobre los migrantes para asegurarse de que realmente no signifiquen ningún daño."
 ENG_australian_style_point_system: "Sistema basado en puntos de estilo australiano"
 ENG_australian_style_point_system_desc: "Siguiendo los pasos de nuestros amigos australianos, estableceremos un sistema basado en puntos donde los migrantes sean admitidos sobre la base de sus habilidades y capacidad para contribuir a la nación."
 ENG_tough_on_anti_social_behavior: "Stance en Comportamiento Antisocial"
 ENG_tough_on_anti_social_behavior_desc: "Nuestra gente necesita ser incentivada para trabajar. Sentarse en casa todo el día no logrará nada. Seremos capaces de conseguir que los jóvenes trabajen permitiéndoles internarse con la policía & fuerzas militares, específicamente en las industrias de defensa."
 ENG_renewed_police_budget: "Renovado Presupuesto de policía"
 ENG_renewed_police_budget_desc: "Nuestra policía no puede ir mal financiada, debemos reconocer la importancia de una fuerza policial fuerte y robusta que se asegure de que nuestras comunidades permanezcan a salvo."
 ENG_established_refugee_programs: "Establecer programas de refugiados"
 ENG_established_refugee_programs_desc: "Sin un programa de refugiados adecuado, los que huyen de sus hogares no nos darán nada. Crearemos un plan integral que permita integrar a los refugiados en la sociedad y que trabajen para contribuir a la economía de las naciones."
 ENG_streamlined_citizenship_process: "Proceso de Ciudadanía Racional"
 ENG_streamlined_citizenship_process_desc: "Cortemos a la persecución, agregando aros adicionales para que las personas salten cuando se trata de obtener la ciudadanía no es necesario. Permitir una integración más rápida será más beneficiosa para todos a largo plazo."
 ENG_neighbourhood_police_teams: "Equipos de policía de barrio"
 ENG_neighbourhood_police_teams_desc: "En lugar de aumentar los costos policiales podemos hacer lo contrario. Llamando a los barrios para formar equipos policiales, podremos descentralizar la justicia hasta el punto en que se pueda denunciar el crimen a las autoridades competentes y tratar sin tener unidades patrullas en todas partes inmediatamente."
 ENG_cctv_reduce_fear: "CCTV reduce el miedo"
 ENG_cctv_reduce_fear_desc: "Las cámaras en los espacios públicos son una parte esencial del mantenimiento de la seguridad nacional y civil. Si la gente sabe que los criminales serán atrapados, permanecerán tranquilos como los criminales piensan dos veces antes de cometer un crimen."
 ENG_britain_can_be_better: "Gran Bretaña puede ser mejor"
 ENG_britain_can_be_better_desc: "Con el cambio adecuado y la reforma, Gran Bretaña puede ser mejor. No es decir que Gran Bretaña está mal ahora, pero siempre hay lugar para mejorar. El pueblo británico ha confiado a nuestro partido, el Partido Laborista, dirigir a Gran Bretaña al frente de la reforma. No podemos decepcionarlos, y debemos hacer todo lo que esté en nuestro poder para asegurar que sus voces sean escuchadas."
 ENG_more_power_to_people: "Más poder al pueblo"
 ENG_more_power_to_people_desc: "El poder del gobierno debe estar en manos del pueblo. Los políticos son de la gente ellos mismos después de todo. No debemos permitir que las dinastías políticas se levanten y asuman."
 ENG_westminster_reinforced: "Westminster Reinforce"
 ENG_westminster_reinforced_desc: "A veces la gente no sabe lo que están pidiendo exactamente. En tales casos, debe aumentarse la participación del Gobierno y los expertos políticos deben intervenir y tomar una decisión para ellos."
 ENG_further_digital_governance: "Gobernanza digital"
 ENG_further_digital_governance_desc: "La gente debe poder interactuar con el gobierno más libremente. Internet es la herramienta perfecta para eso, y al permitir que las personas accedan a los recursos gubernamentales a través del espacio digital podremos fomentar nuestras capacidades de gobierno sin mucho problema."
 ENG_a_union_of_nations: "Una Unión de Naciones"
 ENG_a_union_of_nations_desc: "Gran Bretaña no es una nación, es una unión de naciones. Nos aseguraremos de que cada nación esté representada con precisión, y eso se hará a través de nuestra capacidad para darles acceso a oportunidades económicas."
 ENG_reconsider_the_lobbying_act: "Reconsiderar la Ley de lobbying"
 ENG_reconsider_the_lobbying_act_desc: "A menudo se ha acusado de mejorar considerablemente la transparencia gubernamental exigiendo a los grupos de presión que revelen su financiación, reglamentos sobre cuánto pueden gastar, etc. Sin embargo, esto también ha impactado nuestras actividades, y algunos están pidiendo una revisión del proyecto de ley."
 ENG_people_led_constitutional_convention: "People-led Convention"
 ENG_people_led_constitutional_convention_desc: "Exhortaremos al pueblo a dirigir la convención constitucional, permitiendo que la pluralidad reemplace la singularidad. Con el voto del pueblo, su confianza en nosotros estará eternamente asegurada."
 ENG_corporaet_led_constitutional_convention: "Corporate-led Convention"
 ENG_corporaet_led_constitutional_convention_desc: "Las corporaciones saben lo que es mejor para Gran Bretaña. Por lo tanto, debemos priorizar sus intereses en dirigir el país ante cualquier otro, después de todo, ellos son los que tienen dinero."
 ENG_revised_town_laws: "Leyes municipales revisadas"
 ENG_revised_town_laws_desc: "Algunas leyes de la ciudad todavía conservan reglas y regulaciones bastante datadas. Es mejor que empecemos a limpiar esto, especialmente porque algunos de ellos han estado causando perturbaciones en la actividad de ciertas industrias."
 ENG_replacing_the_house_of_lords: "Reemplazando la Casa de los Lores"
 ENG_replacing_the_house_of_lords_desc: "La Casa de los Señores es una de las instituciones más antiguas del mundo, pero también es una de las más atrasadas. Su constante intromisión en el parlamento les ha hecho un dolor de cabeza cuando se trata de aprobar facturas, y hay que hacer algo al respecto."
 ENG_ulift_peerages: "Uplift Peerages"
 ENG_ulift_peerages_desc: "El primer paso de la prevención de Gran Bretaña para escaparse de sus tradiciones es elevar los aparejos. Con los interrogatorios, podremos proteger nuestras tradiciones y cultura de la corte."
 ENG_abolish_life_peerages: "Salarios de vida abundantes"
 ENG_abolish_life_peerages_desc: "Los peerajes no son algo que es elegido, los peerages son totalmente hereditarios o nombrados. No hay nada democrático en los interrogatorios, y abolirlos reducirá severamente las influencias aristocráticas."
 ENG_common_expertise: "Experiencia común"
 ENG_common_expertise_desc: "Necesitamos la experiencia del hombre común, no de la corporación, político o extranjero. Necesitamos gente real del reino común para guiar a la nación y moverla hacia un futuro más brillante y mejor."
 ENG_technocratic_expertise: "Experiencia técnica"
 ENG_technocratic_expertise_desc: "Aquellos que se han demostrado dignos son casi sin duda siempre ricos y educados. Llevar su experiencia al gobierno catapultará el progreso de Gran Bretaña diez veces."
 ENG_labour_for_workers_and_ceos_alike: "Trabajo: Para los trabajadores & CEO de Alike"
 ENG_labour_for_workers_and_ceos_alike_desc: "Tenemos que abstenernos de alienar a los echelones superiores y ejecutivos de la sociedad. En cambio, tenemos que apaciguarlos y trabajar en pos de negociaciones y compromisos que permitan mejorar las regulaciones laborales."
 ENG_the_queens_family: "La familia de la reina"
 ENG_the_queens_family_desc: "La fuerza del Soberano no es sólo en la ley o la tradición, sino en el círculo que está detrás de ella cuando el estado está bajo tensión. Los invitados al Círculo Interior de la Reina tendrán influencia en su nombre, pero nunca deben confundir la proximidad con la autoridad. La Corona es la única constante, y la Reina decidirá cómo su familia lo sirve."
 ENG_the_prince_trust: "La confianza del príncipe"
 ENG_the_prince_trust_desc: "La Corona perdura porque se adapta, y pocos instrumentos han demostrado ser más prácticos que la Confianza del Príncipe. Al ampliar su alcance, convertimos el patrocinio real en una oportunidad mesurable, capacitación, aprendizajes y una escalera de regreso a la sociedad para los que quedan atrás. Es poder suave con resultados difíciles, y fortalece la monarquía donde más importa: en las vidas de los británicos ordinarios."
 ENG_harmony_doctrine: "La Doctrina Armonía"
 ENG_harmony_doctrine_desc: "En una era de polarización, la autoridad de la monarquía radica en su capacidad de unificarse sin gobernar. Avanzaremos una Doctrina de Armonía, mediación tranquila entre el gobierno, la industria, las comunidades religiosas y la sociedad civil, para reducir la fractura y reconstruir la cohesión nacional. El estado puede ordenar, pero la Corona puede reconciliarse."
 ENG_climate_alarm_bell: "Sonar el Alarma del Clima Bell"
 ENG_climate_alarm_bell_desc: "Las advertencias ya no son teóricas, y el retraso ahora conlleva un costo nacional. Utilizaremos el peso de la plataforma del Heredero para forzar el riesgo climático en todas las agendas, desde la seguridad energética hasta la resiliencia alimentaria y la planificación de infraestructura. Cuando el Palacio habla con claridad, incluso los ministerios más renuentes escuchan."
 ENG_duchy_originals: "Duchy Originals"
 ENG_duchy_originals_desc: "El Ducado puede ser más que tradición; puede ser prueba de que la administración moderna es rentable. Ampliaremos Duchy Originals como modelo de producción sostenible, cadenas éticas de suministro y empresa rural que mantiene a las comunidades viables sin hundirlas. Si la Corona debe dar un ejemplo, que sea uno que pague su camino."
 ENG_heir_of_the_realm: "Heredero del Reino"
 ENG_heir_of_the_realm_desc: "El reinado de Elizabeth ha definido una era, pero el reino debe mirar siempre a lo que viene después. formalizaremos el papel nacional del Heredero, mayor visibilidad, acceso más profundo a las reuniones informativas estatales y una presencia más clara en toda la Unión. No se asume la continuidad; está preparada."
 ENG_naval_prince: "El Príncipe Naval"
 ENG_naval_prince_desc: "El servicio real no es teatro, es una reivindicación de credibilidad ganada en uniforme. Pondremos la identidad naval del Duque de York a la vanguardia de los esfuerzos ceremoniales y de reclutamiento, reforzando el vínculo entre la Corona y la Flota. En mares inciertos, los símbolos del deber todavía pueden mantener la nación."
 ENG_naval_prince_tt: "Desbloquea §Y$ENG_prince_andrew_leader_name$§! como §Y Alto Mando Militar§!"
 ENG_appoint_trade_representative: "Design a Royal Trade Representative"
 ENG_appoint_trade_representative_desc: "La influencia de Gran Bretaña viaja mejor cuando llega con el mandato del gobierno y el prestigio real. Nombraremos a un Representante de Comercio Real para abrir puertas, tranquilizar a los asociados y dar a los exportadores un defensor de alto nivel en las negociaciones. Donde los ministros negocian, la Corona puede conferir."
 ENG_emerging_markets_circuit: "El circuito de mercados emergentes"
 ENG_emerging_markets_circuit_desc: "El crecimiento del mundo está cambiando, y Gran Bretaña no puede permitirse ser un invitado tardío. Pondremos en marcha un circuito de visitas, foros de inversión e introduccións estratégicas diseñadas para anclar el negocio del Reino Unido en la próxima ola de demanda global. El objetivo es simple: las relaciones ahora, apalancamiento más tarde."
 ENG_digital_enterprise_patronage: "Patrocinio de la Empresa Digital"
 ENG_digital_enterprise_patronage_desc: "El comercio está cada vez más escrito en código, no en carga. Usaremos el patrocinio real para elevar la empresa digital británica, fintech, ciberseguridad, servicios avanzados y las startups que los escalan, convirtiendo prestigio en inversión e inversión en empleos. Si el Palacio puede modernizarse, también la economía."
 ENG_duty_of_the_crown: "Función de la Corona"
 ENG_duty_of_the_crown_desc: "Un título real no es un escudo, es una obligación. Enmarcaremos el papel público del Duque en torno al servicio visible, la representación disciplinada y los resultados que justifiquen el lugar de la institución en la vida nacional. En una monarquía, el deber es la única moneda que nunca devalua."
 ENG_workhorse_of_the_crown: "Caballo de trabajo de la Corona"
 ENG_workhorse_of_the_crown_desc: "La monarquía sobrevive más que el espectáculo; sobrevive en un servicio implacable y visible. Vamos a elevar el modelo de deber de la Princesa Real, horarios completos, compromisos locales y seguimiento silencioso, en el estándar que el público reconoce como trabajo real. Cuando se cuestiona la Corona, esta es la respuesta que debe dar."
 ENG_carers_recognition_campaign: "Campaña de reconocimiento de los Carers"
 ENG_carers_recognition_campaign_desc: "La atención de Gran Bretaña suele ser entregada por personas que reciben poco reconocimiento y menos descanso. Pondremos en marcha una Campaña Nacional de Reconocimiento de Carros bajo el patrocinio real, empujando al gobierno y a la sociedad civil para apoyar a los cuidadores no remunerados con alivio práctico y respeto público. Un país que honra el servicio en el extranjero también debe honrar el servicio en casa."
 ENG_discipline_service: "Disciplina en el servicio"
 ENG_discipline_service_desc: "Una Corona que deriva se convierte en un blanco; una corona disciplinada se vuelve una institución de nuevo. Reforzaremos los estándares de conducta, agudizaremos las rutinas del hogar y exigiremos un desempeño profesional en todos los deberes públicos. El ejemplo de Anne no es glamoroso, pero es duradero."
 ENG_princess_admiral_royal_navy: "Princesa Almirante de la Marina Real"
 ENG_princess_admiral_royal_navy_desc: "La Armada Real es más que hardware; es tradición, identidad y alcance nacional. Profundizaremos el papel naval de la Princesa Real para fortalecer la moral, el reclutamiento y el vínculo del servicio con la nación. En tiempos de paz como en crisis, la Flota debe saber que la Corona está con ella."
 ENG_princess_admiral_royal_navy_tt: "Desbloquea §Y$ENG_princess_anne_leader_name$§! como §Y Alto Mando Militar§!"
 ENG_colonel_of_horse_logistics: "Coronel de Caballo y Logística"
 ENG_colonel_of_horse_logistics_desc: "Los ejércitos avanzan en la disciplina y la logística, no en los discursos. formalizaremos los nombramientos militares de la Princesa Real para enfatizar la preparación, el sostenimiento y la competencia no glamurosa que gana campañas. Una fuerza moderna necesita campeones que respetan el trabajo detrás de la línea delantera."
 ENG_quiet_professionalism: "Profesionalidad silenciosa"
 ENG_quiet_professionalism_desc: "Hay poder en moderación y credibilidad en consistencia. Haremos un profesionalismo silencioso la filosofía operativa del Palacio: menos teatro, más entrega y una presencia constante en toda la Unión. Si Gran Bretaña quiere una monarquía que se gana, así es como lo hace."
 ENG_chairman_international_award: "Presidente del Premio Internacional"
 ENG_chairman_international_award_desc: "El legado es preservado por instituciones que sobreviven a cualquier reinado. Fortaleceremos el liderazgo del Duque del Premio Internacional para desarrollar habilidades prácticas, confianza cívica y liderazgo en la próxima generación. Una monarquía que invierte en jóvenes invierte en su propio futuro."
 ENG_trustee_network: "La red fiduciaria"
 ENG_trustee_network_desc: "La influencia no es declarada; se mantiene a través de tableros, organizaciones benéficas y la maquinaria silenciosa de la vida pública. Ampliaremos una red fiduciaria que vincula a instituciones creíbles con el patrocinio real, mejorando la coordinación y elevando estándares en todo el sector. Cuando la Corona organiza responsabilidad, gana autoridad."
 ENG_commonwealth_youth_outreach: "Divulgación de la juventud"
 ENG_commonwealth_youth_outreach_desc: "El Commonwealth no permanecerá solo en la ceremonia, debe sentirse relevante para los jóvenes. Pondremos en marcha un esfuerzo sostenido de divulgación de intercambios, programas de capacitación e iniciativas cívicas conjuntas para mantener vivas los vínculos de Gran Bretaña en la vida de futuros líderes. El poder blando es más fuerte cuando es personal."
 ENG_production_guild_patronage: "Patronaje de los Gremios de Producción"
 ENG_production_guild_patronage_desc: "La industria es la cultura tanto como el comercio, y los sectores creativos y productivos de Gran Bretaña son activos estratégicos. Usaremos el patrocinio real para defender los gremios, estudios y oficios cualificados que hacen la producción británica mundialmente competitiva. Prestige llama la atención; la atención trae inversión."
 ENG_steady_hand: "Una mano firme"
 ENG_steady_hand_desc: "En una familia definida por escrutinio, la estabilidad se convierte en una virtud estratégica. Presentaremos al Duque como una mano firme, confiable, predecible y enfocada en el servicio en lugar de titulares. A veces el papel real más valioso es simplemente evitar que la institución se mueva."
 ENG_duke_charities: "Las Caridades del Duque"
 ENG_duke_charities_desc: "El legado del Duque de Edimburgo se mide en instituciones construidas, no discursos pronunciados. Consolidaremos y profesionalizaremos su cartera de beneficencia para asegurar financiación a largo plazo, una gobernanza más fuerte y una confianza pública duradera. Si se quiere respetar la monarquía, su filantropía debe ser tan disciplinada como su ceremonia."
 ENG_international_award_conference: "Conferencia internacional de premios"
 ENG_international_award_conference_desc: "La fuerza del Premio siempre ha sido su red global y sus estándares compartidos. Convocaremos una Conferencia Internacional de Premios para alinear a los asociados, ampliar la participación y modernizar programas para una nueva generación. Un legado real se convierte en un sistema cuando se organiza internacionalmente."
 ENG_wwf_president_emeritus: "Presidente Emérito de WWF"
 ENG_wwf_president_emeritus_desc: "La conservación ya no es una causa nicho; es la seguridad nacional por otro nombre. Aprovecharemos la posición del Duque como Presidente de WWF Emérito para elevar la protección de la fauna, la biodiversidad y la administración ambiental como prioridades políticas serias. Cuando el Palacio enmarca la naturaleza como estratégica, los gobiernos encuentran más difícil de ignorar."
 ENG_prince_phillip_medal: "La medalla del príncipe Felipe"
 ENG_prince_phillip_medal_desc: "Los símbolos importan cuando recompensan las virtudes correctas. Estableceremos una Medalla de Príncipe Felipe para honrar el servicio práctico, la ingeniería, la industria, la respuesta de emergencia y la competencia no glamorosa que mantiene a Gran Bretaña funcionando. Es un mensaje real en metal: los resultados son lo que cuenta."
 ENG_strength_and_stay: "Fuerza y estancia"
 ENG_strength_and_stay_desc: "La monarquía perdura manteniendo la presión constante. Proyectaremos la antigua filosofía, disciplina, resiliencia y negativa del Duque a cederse a las modas pasadas, en la postura pública de la casa. Cuando lleguen las tormentas, la Corona debe parecer inamovible."
 ENG_from_sandhurst_to_service: "Desde Sandhurst al Servicio"
 ENG_from_sandhurst_to_service_desc: "La próxima generación de la Corona debe ser creíble en más que ceremonia. Anclaremos el papel público del Príncipe en el servicio disciplinado, la profesionalidad militar, el deber y el liderazgo práctico aprendieron de la manera difícil. Sandhurst no es una insignia; es un estándar."
 ENG_royal_foundation: "La fundación real"
 ENG_royal_foundation_desc: "La monarquía moderna se mide por el impacto, no la tradición. Ampliaremos la Fundación Real como principal instrumento del Príncipe, programas profesionales, resultados mensurables y asociaciones que pueden sobrevivir a la rotación política. Si el Palacio va a liderar, debe entregarlo."
 ENG_heads_together: "Juntas"
 ENG_heads_together_desc: "Una nación resiliente requiere más que fronteras fuertes; requiere mentes fuertes. Incrementaremos a los Jefes Juntos en un empuje nacional para la alfabetización de salud mental, la reducción del estigma y el apoyo práctico para quienes luchan en silencio. La Corona no puede legislar la compasión, pero puede normalizarla."
 ENG_veteran_armed_forces_support: "Apoyar a nuestros Veteranos"
 ENG_veteran_armed_forces_support_desc: "El servicio no termina cuando el uniforme sale. Fortaleceremos el apoyo de las fuerzas armadas y veteranas a través de organizaciones benéficas, empleadores y coordinación gubernamental, asegurando que los que cargaron la carga no sean descartados después. Un país que pide sacrificio debe garantizar la dignidad."
 ENG_bridge_to_the_future: "Un puente hacia el futuro"
 ENG_bridge_to_the_future_desc: "El reinado de Elizabeth representa la continuidad. William debe representar la transición. Formaremos al Príncipe como un puente hacia el futuro, moderno en métodos, disciplinado en tono y arraigado en la legitimidad del servicio. El próximo capítulo de la monarquía comienza antes de que pase la corona."
 ENG_queen_eldest: "Abogado del Eldest"
 ENG_queen_eldest_desc: "La Reina se convierte en su línea más alta para la continuidad del proyecto en el extranjero y la confianza en casa. Con el alcance público del heredero y el acceso de un enviado real, la Corona puede abrir puertas que los ministros no pueden y mantengan la voz británica escuchada en cada capital."
 ENG_queen_middle: "El Pilar Medio"
 ENG_queen_middle_desc: "La Reina confía en la generación media para mantener a la institución funcionando con disciplina y entrega. Su fuerza no es espectáculo, es horario, estándares y la competencia silenciosa que protege a la Corona del escándalo y la deriva."
 ENG_queen_youngest: "Puente a Mañana"
 ENG_queen_youngest_desc: "La Reina ancla el hogar en constante demostrada mientras prepara la siguiente era a simple vista. Con el peso institucional de un consorte veterano y el registro de servicio moderno del próximo heredero, la monarquía indica que la renovación es controlada, no caótica."
 ENG_triumph_of_the_crown: "Triunfo de la Corona"
 ENG_triumph_of_the_crown_desc: "El equilibrio ha cambiado, y la Corona ya no reina simplemente por tradición. Con la monarquía al mando del estado, Gran Bretaña entra en un nuevo asentamiento donde se recompensa la lealtad, se gestiona el disentimiento y se establece la dirección nacional desde el Palacio. El reino se moverá con un propósito ahora, y el mundo comprenderá que la Corona ha vuelto a gobernar."
 ENG_the_queens_speech_title: "El discurso de la reina"
 ENG_the_queens_speech_desc: "[ENG_the_queens_speech_focus_description]"
 ENG_the_kings_speech_title: "El discurso del rey"
 ENG_restore_civil_liberties: "Restaurar las libertades civiles"
 ENG_restore_civil_liberties_desc: "Una Corona que las reglas también deben probar que puede contenerse. Volvemos poderes extraordinarios, restauraremos el debido proceso y reafirmaremos los derechos que hacen legítimo a la autoridad británica. Que nuestros oponentes lo llamen debilidad, el reino lo llamará confianza."
 ENG_rule_sword_sceptre: "Regla por Espada y Esceptre"
 ENG_rule_sword_sceptre_desc: "Las viejas restricciones han fracasado y el reino no será gobernado por la vacilación. fusionaremos la autoridad real con los instrumentos del poder estatal, asegurando que la voluntad de la Corona se haga cumplir sin demora. Gran Bretaña será ordenada, decisiva y temida por aquellos que se equivocan de cortesía por debilidad."
 ENG_royal_prerogative_activation: "Activar la Prerrogativa Real"
 ENG_royal_prerogative_activation_desc: "Hay poderes que existen en las sombras de la Constitución, utilizados con moderación y hablado cuidadosamente. Activaremos la Real Prerrogativa para mover el estado a la velocidad, superando la parálisis y forzando la maquinaria del gobierno en alineación. Cuando la Corona actúa, el reino sigue."
 ENG_a_bid_soft_power: "Una vaca para el poder suave"
 ENG_a_bid_soft_power_desc: "El poder no sólo se mide en barcos y presupuestos, sino en prestigio, acceso y capacidad para establecer el tono de la vida internacional. Haremos de la Corona el motor del poder blando de Gran Bretaña, ampliando la diplomacia cultural, patrocinio real en el extranjero, e influiremos en las redes que sobreviven a cualquier gabinete. Cuando otros persigan titulares, formaremos la narrativa."
 ENG_commonwealth_summit: "Celebración de una Cumbre del Commonwealth"
 ENG_commonwealth_summit_desc: "El Commonwealth no es un eco del imperio, es una red que se puede agudizar en la estrategia. Celebraremos una Cumbre del Commonwealth bajo la dirección real para asegurar nuevos compromisos en materia de comercio, cooperación en materia de seguridad y desarrollo compartido. Si Gran Bretaña va a liderar de nuevo, empezará por reunir a sus amigos en una habitación."
 ENG_crown_procurement_program: "El Programa de Adquisiciones de la Corona"
 ENG_crown_procurement_program_desc: "Una monarquía que gobierna no puede depender de contratos lentos y guerras ministeriales. Estableceremos un Programa de Adquisiciones de la Corona para centralizar las compras, acelerar el rearme y recompensar a las empresas que prestan puntualmente y en escala. Cuando el Palacio firma, la industria se moverá."
 ENG_modernize_royal_navy: "Modernizar la Marina Real"
 ENG_modernize_royal_navy_desc: "El alcance de Gran Bretaña siempre ha sido marítimo, y la Corona no gobernará un reino que no pueda controlar sus carriles marinos. Modernizaremos la Armada Real con nuevos cascos, una doctrina más afilada y la logística para sostener operaciones lejos de las aguas del hogar. Deja que los rivales vean nuestros puertos y cuenten lo que les deja."
 ENG_raf_army_overhaul: "Superar la RAF y el Ejército"
 ENG_raf_army_overhaul_desc: "Una flota sin cubierta de aire y energía terrestre es un símbolo, no un escudo. Revisaremos la RAF y el Ejército con estructuras de mando modernas, equipos actualizados y entrenamiento construido para una guerra de alta intensidad. La Corona no apostará su autoridad en las fuerzas anticuadas."
 ENG_leverage_crown_estate: "Apalancamiento del Crown Estate"
 ENG_leverage_crown_estate_desc: "El Crown Estate es más que la herencia, es un instrumento estratégico. Aprovecharemos sus activos para financiar proyectos nacionales, estabilizar industrias clave y anclar el desarrollo a largo plazo sin rogar al Parlamento por cada libra. Si la monarquía es gobernar, también aprenderá a invertir."
 ENG_national_service_act: "Aprobar la Ley del Servicio Nacional"
 ENG_national_service_act_desc: "Un reino que quiere seguridad debe estar dispuesto a llevar su peso. Pasaremos una ley del Servicio Nacional para construir mano de obra, disciplina y un sentido común de obligación en toda la nación. Algunos lo llamarán coacción, la Corona lo llamará deber."
 ENG_new_constitutional_charter: "Proyecto de una nueva Carta Constitucional"
 ENG_new_constitutional_charter_desc: "El antiguo asentamiento fue escrito para una Gran Bretaña diferente y ya no se mantiene bajo tensión. Estableceremos una nueva Carta Constitucional que define la autoridad de la Corona, los límites del Parlamento y los derechos que quedan más allá de la política. Una vez sellado, el reino tendrá claridad, y la claridad es poder."
 ENG_secure_succession: "Asegurar la Sucesión"
 ENG_secure_succession_desc: "Una monarquía que gobierna no puede permitirse la incertidumbre en lo alto. Garantizaremos la sucesión mediante leyes claras, planificación disciplinada y afirmación pública del mandato del heredero. No se asume la continuidad, se aplica."
 ENG_rule_councillorship: "Regla por mandato del Consejo"
 ENG_rule_councillorship_desc: "El gobierno parlamentario genera facciones, pero la Corona puede gobernar a través de manos confiables. Empoderaremos a un Consejo Real de Consejeros para redactar políticas, supervisar ministerios y mantener el estado alineado con el Palacio. Gran Bretaña se regirá por la competencia y la lealtad, no la negociación de partidos."
 ENG_convene_foreign_secretary_cabinet: "Convocar el Gabinete del Secretario de Relaciones Exteriores"
 ENG_convene_foreign_secretary_cabinet_desc: "La diplomacia no puede ser improvisada cuando la autoridad de la Corona está en línea. Convocaremos un Gabinete del Secretario de Relaciones Exteriores para coordinar embajadores, inteligencia, enviados comerciales y planificadores de defensa bajo una sola dirección. Gran Bretaña hablará con una sola voz en el extranjero, y será la correcta."
 ENG_champion_liberal_values: "Campeón de Valores Liberales"
 ENG_champion_liberal_values_desc: "Si la monarquía es gobernar, debe gobernar con principios que Gran Bretaña puede reconocer como propio. Nosotros defenderemos los valores liberales, defenderemos las instituciones libres y probaremos que la autoridad real puede coexistir con derechos y moderación. La Corona será fuerte, y será legítima."
 ENG_european_outreach: "Europeas"
 ENG_european_outreach_desc: "Gran Bretaña no puede permitirse el aislamiento en su propia puerta. Pondremos en marcha una campaña europea de divulgación para reconstruir canales, asegurar la cooperación donde los intereses se superponen y evitar que los rivales establezcan los términos del continente sin nosotros. La Corona tratará directamente, y Europa tomará nota."
 ENG_close_proximity_nato: "Cerca de Proximidad con la OTAN"
 ENG_close_proximity_nato_desc: "La OTAN no es sólo un pacto, es una palanca de disuasión y acceso. Nos moveremos en estrecha proximidad con la Alianza para asegurar el intercambio de inteligencia, la interoperabilidad y la profundidad estratégica manteniendo intacta la libertad de acción de la Corona. Gran Bretaña será aliada, pero nunca subordinada."
 ENG_joint_operational_command: "Establecer un Comando Operacional Conjunto"
 ENG_joint_operational_command_desc: "La rivalidad entre los servicios pierde tiempo y tiempo mata. Estableceremos un Comando Operativo Conjunto para unificar la planificación, logística y ejecución en toda la Armada, Ejército y RAF bajo una única doctrina de lucha contra la guerra. Cuando la Corona ordena acción, cada rama se moverá como una."
 ENG_reaffirm_special_relationship: "Reafirmar la relación especial"
 ENG_reaffirm_special_relationship_desc: "El poder respeta el poder, y Estados Unidos sigue siendo el socio más decisivo del reino. Reafirmaremos la Relación Especial a través de la cooperación de inteligencia, coordinación de defensa y planificación estratégica compartida al más alto nivel. La Corona mantendrá el asiento de Gran Bretaña en la mesa donde se decide el mundo."
 ENG_royal_charitable_initiative: "La iniciativa caritativa real"
 ENG_royal_charitable_initiative_desc: "La regla es más fácil cuando el reino cree que se cuida. Pondremos en marcha una Real Iniciativa Caritativa para dirigir la financiación, los voluntarios y la atención pública hacia las comunidades sometidas a tensión, demostrando que la Corona puede gobernar con compasión. La lealtad crece más rápido donde la ayuda llega primero."
 ENG_time_for_common_sense: "Es hora de sentido común."
 ENG_time_for_common_sense_desc: "El tiempo para el sentido común es ahora. Años de trabajo lideraron el gobierno ha llevado a nuestro pueblo lejos de los ideales que hacen de Gran Bretaña lo que una vez fue. No podemos dejar que los esfuerzos de grandes hombres como Winston Churchill vayan a desperdiciar, no, daremos forma a Gran Bretaña para ser lo que siempre fue destinado a ser, un gran poder."
 ENG_knowing_who_we_are: "Saber quiénes somos"
 ENG_knowing_who_we_are_desc: "Somos británicos primero, segundo europeo. No podemos olvidar quiénes somos, somos los herederos de un superpoder como el que el mundo nunca había visto antes. El sol nunca se puso en Gran Bretaña, y seguirá así si tenemos algo que ver con él."
 ENG_a_world_leader: "Un líder mundial"
 ENG_a_world_leader_desc: "Somos británicos, segundo a ninguno, somos líderes mundiales y campeones de la libertad, no podemos dejar que nuestro control como líder mundial se deslice. En lugar de ello, nos volveremos a afirmar como la vanguardia del liderazgo mundial."
 ENG_fighting_the_power_of_brussels: "Lucha contra el poder de Bruselas"
 ENG_fighting_the_power_of_brussels_desc: "Bruselas ha superado su capacidad administrativa. Están degradando activamente a nuestras naciones la independencia con su retórica, y son una amenaza para nuestra capacidad de elegir lo que queremos para Gran Bretaña!"
 ENG_a_civilized_society: "Una sociedad civilizada"
 ENG_a_civilized_society_desc: "Como sociedad civilizada, Gran Bretaña no estará sujeta a la propaganda de otros. Como tal, trabajar para romper la influencia de aquellos que quieren traer un cambio radical a nuestro modo de vida debe ser tratado rápidamente."
 ENG_a_stronger_society: "Una sociedad más fuerte"
 ENG_a_stronger_society_desc: "Nuestra sociedad será más fuerte y unificada que nunca antes. No podemos dejar que otros fracturan nuestra unidad bajo la forma de «reforma». Nuestra sociedad sólo podría ser más fuerte si continuamos protegiendo nuestros valores fundamentales."
 ENG_a_staunch_ally: "Un aliado Staunch"
 ENG_a_staunch_ally_desc: "¡No somos nada más que un aliado firme para nuestros socios en la OTAN! Cualquiera que se atreva a acusarnos de ser freeloaders, un cabo suelto, o cualquier cosa en medio puede volver a casa desde donde vinieron."
 ENG_town_and_country: "Pueblo y país"
 ENG_town_and_country_desc: "Somos un país que no puede olvidar sus pueblos pequeños, rurales y humildes. Debemos recordar a estas personas con todo nuestro poder e incentivarlas para seguir adelante."
 ENG_a_more_flexible_europe: "Una Europa más flexible"
 ENG_a_more_flexible_europe_desc: "Europa debe ser más flexible en sus objetivos de política exterior en general. Si vamos a convertirnos en un continente más fuerte en su conjunto, Europa necesita abandonar toda la agenda de «unificación» y trabajar para ser más flexibles."
 ENG_rural_friendly_transport_services: "Servicios de transporte rurales y amigos"
 ENG_rural_friendly_transport_services_desc: "Nuestros servicios de transporte no son demasiado amistosos para las comunidades rurales. Tendremos que encontrar una manera de complacer a esta gente."
 ENG_industrial_friendly_transport_services: "Servicios de transporte industrial"
 ENG_industrial_friendly_transport_services_desc: "El trabajador necesita llegar al trabajo sin problemas. Tendremos que revisar o al menos mejorar nuestros servicios de transporte para ubicaciones industriales."
 ENG_no_army_outside_of_europe: "Ningún ejército fuera de Europa"
 ENG_no_army_outside_of_europe_desc: "¿Por qué los militares británicos están fuera de los límites de Europa? ¿Qué lugar tienen en Asia? ¿África? ¿Oriente Medio? En cambio, tenemos que centrarnos en mantener nuestras tropas dentro de Europa."
 ENG_abolish_centrally_planned_housing: "Abolir la vivienda de planificación central"
 ENG_abolish_centrally_planned_housing_desc: "En lugar de centrarnos en asignar nuestro presupuesto a una agenda de vivienda planificada centralmente, podemos reubicar esos fondos hacia cosas más importantes."
 ENG_coming_to_the_aid_of_others: "Viniendo a la Ayuda de Otros"
 ENG_coming_to_the_aid_of_others_desc: "Hay aquellos en el mundo que necesitan desesperadamente nuestra ayuda, y estamos aquí para proveer eso por ellos."
 ENG_global_matters_global_problems: "Cuestiones mundiales, problemas mundiales"
 ENG_global_matters_global_problems_desc: "¿Por qué nos importa lo que otros están tratando? ¡Es su problema, no el nuestro! Necesitan averiguarlo por su cuenta."
 ENG_credit_based_public_transport: "Transporte público basado en créditos"
 ENG_credit_based_public_transport_desc: "¿Trabajas? Genial, no tienes que preocuparte por pagar tus tarifas. Al permitir que quienes trabajan para tomar el transporte público sin costo, podremos incentivar a la gente para encontrar empleo y trabajo."
 ENG_safe_haven_not_safe_touch: "Safe Haven, no Safe Touch"
 ENG_safe_haven_not_safe_touch_desc: "Somos un refugio seguro para aquellos que realmente necesitan ayuda, si estamos dejando entrar a alguien entonces se pudrirán nuestro país para borrar."
 ENG_are_you_thinking_what_were_thinking: "¿Estás pensando lo que estamos pensando?"
 ENG_are_you_thinking_what_were_thinking_desc: ""
 ENG_power_to_the_bank_of_england: "Poder al Banco de Inglaterra"
 ENG_power_to_the_bank_of_england_desc: "Al estar en pie, el Banco de Inglaterra está en un estado peor que nunca. Por lo tanto, es necesario que actuemos y fortalezcamos la institución."
 ENG_british_dream: "El sueño británico"
 ENG_british_dream_desc: "El sueño británico es uno que muchos no han tenido por mucho tiempo ahora. Es el sueño y la ambición que todos los británicos prosperarán, sin tener que sufrir las consecuencias de las pérdidas comunales."
 ENG_whats_wrong_with_discipline: "¿Qué tiene de malo la disciplina?"
 ENG_whats_wrong_with_discipline_desc: "Parece que nuestras escuelas se han vuelto blandas, y han comenzado a alejarse de tomar las medidas disciplinarias necesarias. Es nuestro deber enseñar modales a nuestros jóvenes, y nos aseguraremos de que los educadores lo saben."
 ENG_across_the_board_tax_slashes: "A través de las barras fiscales de la Junta"
 ENG_across_the_board_tax_slashes_desc: "Si recortamos impuestos a través de la junta, nuestra gente de todos los caminos de la sociedad sentirá que el peso de sus cargas cambia drásticamente. ¡No debemos discriminar!"
 ENG_tax_slashes_only_for_some: "Slashes fiscales sólo para algunos"
 ENG_tax_slashes_only_for_some_desc: "No tenemos el presupuesto ni la voluntad de reducir impuestos para todos. Vamos a tener que ser coordinados y reducir impuestos sólo donde nos beneficiamos."
 ENG_icnreased_control_for_administrators: "Mayor control para los administradores"
 ENG_icnreased_control_for_administrators_desc: "Los que trabajan en nuestras escuelas necesitan la capacidad de tener un discurso en los asuntos de sus instituciones. Hacerlo nos permitirá hacer que los nuevos eruditos se levanten."
 ENG_keeping_hospitals_clean: "Mantener los hospitales limpios"
 ENG_keeping_hospitals_clean_desc: "Necesitamos mantener limpios nuestros hospitales, tanto cuando se trata de la apariencia física como de su credibilidad."
 ENG_corporate_invitations: "Invitaciones corporativas"
 ENG_corporate_invitations_desc: "Necesitamos invitar a las corporaciones para que vengan y nos ayuden a decidir sobre política económica. Ellos son los latidos de nuestra economía, y sin ellos, no seríamos nada."
 ENG_more_police_less_crime: "Más policía, menos crimen"
 ENG_more_police_less_crime_desc: "Es bastante obvio, ¿no? Si tenemos más policías patrullando las calles, entonces sin duda tendremos menos crímenes."
 ENG_cutting_wait_times: "Horas de espera cortadas"
 ENG_cutting_wait_times_desc: "La gente espera demasiado tiempo para los servicios médicos, ¡es hora de que hagamos algo al respecto y cortemos tiempos de espera a la mitad!"
 ENG_turnaround_schools: "Escuelas giratorias"
 ENG_turnaround_schools_desc: "Si los estudiantes no pueden sentarse correctamente en clase y escuchar a su instructor, entonces tendremos que pensar en algo más. Enviarlos a la escuela giratoria finalmente resolverá este problema que tenemos con una pequeña minoría de nuestros estudiantes."
 ENG_structural_overhaul_of_nhs: "Reforma estructural del NHS"
 ENG_structural_overhaul_of_nhs_desc: "Al estar en pie, el NHS no puede continuar. Está chupando todo nuestro dinero y está dejando enfermos y esperando por la puerta. Debemos iniciar una serie de reformas que reconstruirán el NHS desde el suelo."
 ENG_trusting_local_professionals: "Fideicomiso de los profesionales"
 ENG_trusting_local_professionals_desc: "¿Por qué arreglarlo si no está roto? Dejaremos los asuntos médicos hasta profesionales médicos, y permitiremos que el NHS funcione con algunos pequeños ajustes."
 ENG_keeping_up_our_guard: "Mantener nuestra guardia"
 ENG_keeping_up_our_guard_desc: "No podemos decepcionar a nuestra guardia sólo porque las cosas están tranquilas ahora. Debemos anticipar todo tipo de escenarios, incluso durante tiempos de estabilidad y prosperidad."
 ENG_benefitting_the_taxpayer: "Beneficiación del contribuyente"
 ENG_benefitting_the_taxpayer_desc: "¿A quién estamos sirviendo si no el contribuyente? Necesitamos implementar políticas que tranquilicen a los contribuyentes su dinero no va a desperdiciar."
 ENG_invitation_to_the_government_of_britain: "Invitación al Gobierno de Gran Bretaña"
 ENG_invitation_to_the_government_of_britain_desc: ""
 ENG_get_britain_moving_again: "Haz que Gran Bretaña se mueva de nuevo"
 ENG_get_britain_moving_again_desc: "Ha llegado el momento de que Gran Bretaña vuelva a moverse. Nunca más con la estrategia lenta, metódica y convencional de esperar a que la economía se arregle. Vamos a tomar asuntos en nuestras propias manos."
 ENG_cleanup_westminster: "Limpio Westminster"
 ENG_cleanup_westminster_desc: "Westminster es un desastre, sobresaturado con cinta roja y sobrereach burocrático. Es hora de que tomemos un mazo a toda la cosa y limpiemos el lugar."
 ENG_big_society_not_big_government: "Gran sociedad, no gran gobierno"
 ENG_big_society_not_big_government_desc: "¿Por qué necesitamos un gran gobierno? Si nuestra sociedad es lo suficientemente buena, ¿por qué monitorear, administrar y dictar todos los aspectos de sus vidas? En cambio, vamos a recortar el gobierno y permitir que la sociedad haga lo suyo."
 ENG_household_debt_management_programs: "Programas de gestión de la deuda en el hogar"
 ENG_household_debt_management_programs_desc: "A veces la gente no puede pagar sus deudas, y eso está bien. Estableceremos programas de gestión de la deuda que o bien asumirán parte de su deuda o les ayudarán con planes para pagarla."
 ENG_bigger_place_for_educators: "Lugar más grande para educadores"
 ENG_bigger_place_for_educators_desc: "El país necesita abrir más para nuestros educadores. No los apreciamos tanto como deberíamos, especialmente por el trabajo que están haciendo."
 ENG_the_most_family_friendly_country: "El país más amigable de la familia"
 ENG_the_most_family_friendly_country_desc: "Nuestro país necesita estar más abierto para aceptar familias y personas que tienen familia. Nuestra población no puede permanecer estática y pequeña, necesitamos crecer y fomentar buenos valores."
 ENG_knowledge_for_industry: "Conocimiento para la industria"
 ENG_knowledge_for_industry_desc: "En lugar de dejar que el conocimiento sea desperdiciado en otros lugares, podríamos redirigir algo de ese poder cerebral hacia nuevas industrias, tal vez industrias militares."
 ENG_power_of_recall: "Poder de Resurrección"
 ENG_power_of_recall_desc: "Es evidente que la mentira de algunos PM, y por lo tanto, necesita ser removida si no pueden cumplir con sus promesas. Debemos permitir que la gente recuerde lo del Primer Ministro a quien ya no quieren liderar el cargo."
 ENG_a_more_balanced_economy: "Una economía más equilibrada"
 ENG_a_more_balanced_economy_desc: "Nuestra economía está en mal estado como resultado de décadas de incompetencia Laboral, es el momento de que lloremos las cosas de nuevo en forma!"
 ENG_bye_bye_bureaucracy: "Adiós, burocracia."
 ENG_bye_bye_bureaucracy_desc: "¿Quién necesita un gran gobierno cuando podemos tener una gran libertad? No hay necesidad de burocracia en la vida cotidiana de nuestros constituyentes, pero más bien existe la necesidad de ampliar las libertades."
 ENG_case_by_case_intervention: "Intervención de caso por caso"
 ENG_protecting_childhood: "Protección de la infancia"
 ENG_protecting_childhood_desc: "Al estar en pie, nuestra juventud corre el mayor riesgo de ser perjudicada por personas enfermas a través de múltiples canales, ya sea Internet o las calles. Debemos adoptar medidas adicionales para proteger la infancia a fin de que puedan crecer y prosperar."
 ENG_investigate_lost_funds: "Investigar los fondos perdidos"
 ENG_investigate_lost_funds_desc: "Por alguna razón grandes sumas de dinero del gobierno se perdieron hace unos años. Es hora de que abramos una investigación adecuada y descubramos lo que pasó."
 ENG_a_more_transparent_government: "A Gobierno más transparente"
 ENG_a_more_transparent_government_desc: "Nuestro gobierno no es lo suficientemente transparente, y debemos tomar medidas adicionales para asegurar que nuestros constituyentes sean conscientes de lo que está sucediendo en Westminster."
 ENG_petitions_for_debate: "Solicitudes de debate"
 ENG_petitions_for_debate_desc: "Si permitimos que la gente obtenga un número significativo de firmas en una petición de cambio, podríamos pasarlas al Parlamento para revisar e implementar los comentarios de los pueblos más directamente."
 ENG_public_reading_stage: "Etapa de lectura pública"
 ENG_public_reading_stage_desc: "Permitiremos un foro de Internet que permita a nuestro pueblo comentar y discutir los cambios que están siendo aprobados en el parlamento para aumentar la transparencia y la extensión del gobierno."
 ENG_for_the_common_man: "Para el Hombre Común"
 ENG_for_the_common_man_desc: "Nuestro gobierno es para el hombre común, no los que dirigen el programa. Pasaremos reformas selectivas que permitirán aumentar la actividad política entre la clase común."
 ENG_for_the_wealthy_man: "Para el Hombre Wealthy"
 ENG_for_the_wealthy_man_desc: "¿Qué diablos tiene que ver la gente pobre con el gobierno? La mayoría de ellos son bums de izquierda que no quieren nada más que subvenciones gubernamentales para evitar el trabajo. Nos dirigiremos hacia los individuos de la sociedad que realmente trabajan y contribuyen a la economía."
 ENG_a_brighter_more_secure_future: "Un futuro más brillante, más seguro"
 ENG_a_brighter_more_secure_future_desc: ""
 ENG_operation_dagger: "Operación Dagger"
 ENG_operation_dagger_desc: "El Golfo Pérsico fue dominado una vez por nuestras fuerzas, con nuestra capacidad de dictar lo que entra y sale siendo casi sin costura. Hoy en día, sin embargo, somos una posición menor para negociar con los actores regionales, y se ven obligados a confiar en nuestros chips de negociación para hacer cualquier cosa. Al apoderarse de Musandam, podremos una vez más estar en posición de poder en el Golfo."
 ENG_operation_barras: "Operación Barras"
 ENG_operation_barras_desc: "Hemos recibido informes de que el grupo de milicias 'West Side Niggaz', comúnmente conocido como los 'West Side Boys' por periodistas y emisores, ha capturado a varios soldados británicos y ahora los está reteniendo como rehenes. Nos están presionando para intervenir de alguna manera para salvar sus vidas, y el mando militar ha redactado la Operación Barras para llevar a cabo esto. También tenemos la opción de tomar nuevas medidas para aprovechar los recursos vitales durante la operación; sin embargo, esto no es obligatorio."
 ENG_operation_coastal_star: "Operación Estrella Costera"
 ENG_operation_coastal_star_desc: "Gambia está empezando a caer peligrosamente en el autoritarismo, la inestabilidad y ciertamente fuera de nuestra órbita. Tendremos que intervenir en alguna forma y hacerlos cambiar de rumbo, si no el resto del África Occidental puede seguir."
 ENG_operation_delta_guard: "Operación Guardia Delta"
 ENG_operation_delta_guard_desc: "Claramente los nigerianos no saben nada sobre el funcionamiento de un estado, y estamos obligados a hacer algo acerca del oro negro gastado que rodea al Delta. De lo contrario, estaríamos dejando que se desperdiciara y no queremos eso. La Operación Delta Guard nos permitirá restablecer el dominio económico en Nigeria y los ingresos seguramente beneficiarán al Estado."
 ENG_the_sun_which_never_set: "El Sol que nunca establece"
 ENG_the_sun_which_never_set_desc: "El sol nunca se pone en Gran Bretaña, y aseguraremos que siga siendo el caso."
 ENG_operation_resolute_banner: "Operación Bandera Resolute"
 ENG_operation_resolute_banner_desc: "El gobierno serbio ha seguido amenazando a Kosovo, y como resultado, estamos siendo forzados a entrar y dibujar una red."
 ENG_falklands_policy: "Política de Falklands"
 ENG_falklands_policy_desc: "A pesar de nuestro pequeño enfrentamiento que tuvimos con Argentina en las Falklands hace un par de décadas, la memoria del conflicto todavía está fresca en la mente de muchos. Podemos avanzar con una nueva política en las islas y tal vez tomar medidas adicionales."
 ENG_regime_change_in_zimbabwe: "Operación Salvaguardias"
 ENG_regime_change_in_zimbabwe_desc: "El dictador de Zimbabue, [ZIM.GetLeader], debe ser derrocado por cualquier medio necesario. Su opresión de los pueblos británicos y del pueblo de Zimbabwe no puede ser reconocida y la justicia debe servirse rápidamente."
 ENG_operation_east_divide: "Operación Dividente Oriental"
 ENG_operation_east_divide_desc: "El Suez es acertado barro británico, y sin el Suez, hemos tenido que pasar por las penurias de 'reglas comerciales internacionales'. Como tal, intentaremos trabajar con los egipcios para el control parcial en el Sinaí, de lo contrario no tendremos más opción que hacer algo al respecto."
 ENG_operation_ninety_seven: "Operation '97"
 ENG_operation_ninety_seven_desc: "Liberar Hong Kong a los chinos fue un error, y una grave en eso. Debemos buscar nuevas formas de hacer que Hong Kong venga bajo nuestra influencia una vez más si queremos restablecernos como un hegemon económico."
 devolution.1.t: "Los Constituyentes buscan aprobar proyectos de ley para disminuir la dependencia"
 devolution.1.d: "Los recientes acontecimientos en el país han llevado a nuestros estados constituyentes a avanzar hacia políticas que desciendan su dependencia del gobierno central. Tenemos la capacidad de vetar estos proyectos de ley, pero hacerlo puede resultar en mayores niveles de insatisfacción."
 devolution.1.a: "Apruebelos"
 devolution.1.b: "Veto ellos"
 devolution.1.c: "Muéstrame las facturas individuales"
 devolution.2.t: "Bill de Escocia"
 devolution.2.d: "El Parlamento escocés ha presentado al gobierno un proyecto de ley que aumentará su autonomía y los empujará hacia un estado más descentralizado. Ver este proyecto de ley puede enojarlos, pero aprobarlo los empujará hacia la devolución."
 devolution.2.a: "Aprobarlo"
 devolution.2.b: "Veto."
 devolution.3.t: "Bill de Irlanda del Norte"
 devolution.3.d: "El Parlamento irlandés del Norte ha presentado al gobierno un proyecto de ley que aumentará su autonomía y los empujará hacia un estado más descentralizado. Ver este proyecto de ley puede enojarlos, pero aprobarlo los empujará hacia la devolución."
 devolution.3.a: "Aprobarlo"
 devolution.3.b: "Veto."
 devolution.4.t: "Bill de Gales"
 devolution.4.d: "El Parlamento de Welsh ha presentado al gobierno un proyecto de ley que aumentará su autonomía y los empujará hacia un estado más descentralizado. Ver este proyecto de ley puede enojarlos, pero aprobarlo los empujará hacia la devolución."
 devolution.4.a: "Aprobarlo"
 devolution.4.b: "Veto."
 devolution.5.t: "Llamadas para el crecimiento de la independencia escocesa"
 devolution.5.d: "Cada día que pasa, los anclajes de noticias están frente a multitudes de personas que piden que se apruebe un referéndum nacional para decidir si Escocia debe permanecer o no como parte del [ENG.GetName]. Obviamente Westminster está generalmente en contra de la noción, pero el veto a la idea puede provocar inestabilidad."
 devolution.5.a: "Bien, veamos qué pasa."
 devolution.5.b: "Veto."
 devolution.6.t: "Llamamientos para el crecimiento de la independencia irlandesa"
 devolution.6.d: "Cada día que pasa, los anclajes de noticias están frente a multitudes de personas que piden que se apruebe un referéndum nacional para decidir si Irlanda del Norte debe permanecer o no como parte del [ENG.GetName]. Obviamente Westminster está generalmente en contra de la noción, pero el veto a la idea puede provocar inestabilidad."
 devolution.6.a: "Bien, veamos qué pasa."
 devolution.6.b: "Veto."
 devolution.7.t: "Llamadas para el crecimiento de la Independencia de Gales"
 devolution.7.d: "Cada día que pasa, los anclajes de noticias están frente a multitudes de personas que piden que se apruebe un referéndum nacional para decidir si Gales debe permanecer o no como parte del [ENG.GetName]. Obviamente Westminster está generalmente en contra de la noción, pero el veto a la idea puede provocar inestabilidad."
 devolution.7.a: "Bien, veamos qué pasa."
 devolution.7.b: "Veto."
 devolution.10.t: "Elecciones constitutivas"
 devolution.10.d: "Ha llegado el momento de las elecciones en nuestros estados constitutivos. Cada constituyente elegirá nuevos PM's en sus respectivos parlamentos que serán pro-independencia, o pro-[ENG.GetName]. La probabilidad de que estos miembros pro-independencia sean elegidos se basa en cada uno de los constituyentes agitación respectiva."
 devolution.10.a: "Okay"
 britain_md.100.t: "Acercándose a la operación Dagger"
 britain_md.100.d: "Musandam se encuentra en una región muy estratégica, siendo la daga del Golfo Pérsico. Tanques y convoyes incontables pasan por el estrecho de Hormuz a diario, con la volatilidad cada vez mayor de la región, no podemos asegurar que la ruta de envío esté protegida. Si somos capaces de llevar a la provincia bajo nuestro control estaremos en una mejor posición para proteger nuestras flotas y activos en la región."
 britain_md.100.a: "Trata de hacer un trato con Omán"
 britain_md.100.b: "No hay tiempo para negociar, entrar"
 britain_md.101.t: "[ENG.GetName] Nos acerca a Musandam"
 britain_md.101.d: "Los británicos han venido a hablar. Más específicamente, están aquí para nuestro territorio. Al escuchar la propuesta británica, nuestros diplomáticos salieron furiosos, incapaces de controlarse después de oír que los británicos están aquí para intentar negociar por Musandam. Una demanda tan agresiva está segura de alterar a nuestra gente más allá de la imaginación. Aunque los británicos han re-estado que rechazar tal demanda no les dejaría otra opción sino «comprar otros medios»."
 britain_md.101.a: "¡Nunca!"
 britain_md.101.b: "¿Qué opción tenemos?"
 britain_md.102.t: "Omán rechaza las negociaciones"
 britain_md.102.d: "El gobierno omaní ha dejado claro que no están interesados en ninguna forma de negociación, y han optado por decir a nuestros diplomáticos."
 britain_md.102.a: "Nos dejan sin opción"
 britain_md.102.b: "Olvídalo."
 britain_md.103.t: "Omán nos da los términos"
 britain_md.103.d: "El gobierno omaní ha dado el sabio paso para negociar con nosotros, e incluso nos ha ofrecido términos. Se nos pide que paguemos una suma elevada y garanticemos la protección de Omán por un período de tiempo. Rechazar esta oferta significaría que Omán no nos dará los derechos a Musandam."
 britain_md.103.a: "Fine"
 britain_md.103.b: "No, lo tomaremos de otra manera."
 britain_md.103.c: "Olvídalo."
 ENG_western_allies_western_ideals: "West Allies, Western Ideals"
 ENG_western_allies_western_ideals_desc: ""
 ENG_out_with_the_new_in_with_the_old: "Con lo nuevo, con el viejo"
 ENG_out_with_the_new_in_with_the_old_desc: ""
 royal_workers_idea: "Trabajadores reales"
 ENG_crown_procurement_program_idea: "Corona Procure Program"
 ENG_recent_defections: "Defecciones recientes"
 ENG_recent_defections_desc: "Tropas, generales y pilotos cualificados están huyendo de nuestras filas con la esperanza de cortar vínculos con nuestro gobierno, viéndonos como una amenaza para el estado."
 ENG_war_of_independence: "Guerra de la independencia"
 ENG_war_of_independence_desc: "Con espíritus altos y morales, nuestros hombres están listos para ver el fin del dominio tiránico en Londres."
 ENG_typhoon_debate1: "Aumento de la producción de caza tifón"
 ENG_resistance_against_westminster: "Resistencia contra el Westminster"
 ENG_resistance_against_westminster_desC: "Al rechazar una propuesta de referéndum, los constituyentes de este estado han puesto en marcha una firme resistencia en forma de desobediencia civil y pequeños casos de violencia para mostrar su descontento."
 ENG_political_modifier: "El sistema Westminster"
 ENG_two_party_system_idea: "Sistema de dos partidos"
 ENG_economy_modifier: "La Economía [ENG.GetName]"
 ENG_building_britain_idea: "Construyendo una Gran Bretaña para el futuro"
 ENG_building_britain_idea_desc: "Una estrategia industrial a largo plazo alinea la inversión en ideas, personas, infraestructura y lugares, elevando lentamente la productividad y dando confianza a las empresas para planificar, contratar y construir en todo el país."
 ENG_ireland_border_cooperation_idea_IRE: "Cooperación fronteriza de Irlanda"
 ENG_ireland_border_cooperation_idea_IRE_desc: "Los órganos transfronterizos prácticos y los programas conjuntos vinculan a Irlanda del Norte con el comercio, la infraestructura y los servicios, el alivio de los papeleos y la ayuda a los bienes, las personas y las ideas se desplazan más libremente por la frontera."
 ENG_Space_Command0: "Capacidades del ciberespacio británico"
 ENG_Space_Command0_desc: "El Reino Unido está trabajando para mejorar sus capacidades y garantizar sus intereses en el espacio"
 ENG_Space_Command2: "Mando Espacial del Reino Unido"
 ENG_Space_Command3: "Mando Espacial del Reino Unido"
 ENG_Space_Command3_desc: "El Comando Espacial del Reino Unido es el líder de defensa para las operaciones espaciales, la fuerza de trabajo espacial y la capacidad espacial. Es un comando conjunto, basado en RAF High Wycombe, y con personal de la Armada Real, el Ejército Británico y la Fuerza Aérea Real, junto a funcionarios públicos y contratistas. Con la primera división espacial ahora formada, la organización ha superado las expectativas en todo el mundo, y Gran Bretaña está experimentando una nueva era de Dreadnought."
 ENG_standardized_space_parts1: "Piezas de espacio estandarizadas"
 ENG_standardized_space_parts1_desc: "Al apoyar a las empresas comerciales para que el espacio sea accesible y asequible, se han reducido los costos de construcción de productos espaciales."
 ENG_Historical_Valor1: "Valor histórico"
 ENG_Historical_Varlor1_desc: "Entrenados en tradiciones, las fuerzas armadas británicas se enorgullecen de su legado. Sin embargo, el personal general sigue siendo firme en las estrategias convencionales, escépticas de tácticas no comprobadas. Mientras el ejército se apoya en el precipicio del cambio, equilibrar el orgullo y la adaptabilidad se convierte en la esencia de la defensa de la nación."
 ENG_Aging_Military1: "Envejecimiento militar"
 ENG_Aging_Military1_desc: "Debido a la financiación desatendida, el ejército del Reino Unido se enfrenta a graves problemas de envejecimiento, apasionando con equipos anticuados y disminuyendo la calidad. El impacto del descuido financiero se hace eco a través de las filas, planteando desafíos para mantener una fuerza de defensa moderna y efectiva."
 ENG_desert_hawk: "Desierto Hawk"
 ENG_desert_hawk_desc: "El Lockheed Martin Desert Hawk III es un UAV diseñado por Skunkworks en Lockheed Martin Aeronautics. Es un pequeño dron de vigilancia capaz de observación Radar, señales Intercepción de inteligencia y comunicaciones junto a la observación remota con visión nocturna, imágenes térmicas y sensores electro-ópticos."
 ENG_archer_artillery_alliance: "Alianza de artillería Archer"
 ENG_archer_artillery_alliance_desc: "La Alianza Arquero de Artillería, desarrollada por Suecia, significa un avance decisivo en la fuerza de fuego de precisión a largo plazo. Con carga automatizada y despliegue rápido, este sistema de artillería garantiza un apoyo preciso y flexible en el campo de batalla. Su diseño modular aumenta las operaciones militares, proporcionando a Suecia y al Reino Unido una ventaja estratégica en el combate."
 ENG_Boxer_Program: "Programa Boxer"
 ENG_Boxer_Program_desc: "El Programa Boxer APC, una colaboración entre Alemania y los Países Bajos, introduce una nueva era en portadores de personal blindados. El diseño modular del Boxer permite una fácil adaptación a varias misiones, incluyendo transporte de tropas y evacuación médica. Con características avanzadas de protección y movilidad excepcional, este vehículo aumenta la seguridad y eficacia del personal militar en diversos entornos operacionales."
 ENG_warrior_capability_sustainment_programme: "Programa de sostenibilidad de la capacidad de los vehículos blindados"
 ENG_warrior_capability_sustainment_programme_desc: "El obsoleto cañón RARDEN de 30 mm del Warrior, incapaz de disparar en movimiento con precisión, ha impulsado estudios de nuevos sistemas de armas y diseños de torreta para prolongar su vida en combate. Los planes actuales contemplan una torreta con cañón CT40 de 40 mm totalmente estabilizado, una arquitectura electrónica mejorada y un sistema modular de blindaje con kits de montaje rápido. Al mismo tiempo, el programa Armoured Battlegroup Support Vehicle ha propuesto convertir la plataforma en un APC que sustituya al FV432."
 ENG_warrior_ajax_upgrades: "Vehículos blindados de guerra Ajax Actualizaciones"
 ENG_warrior_ajax_upgrades_desc: "El proyecto Warrior Ajax Upgrades, dirigido por el Reino Unido, significa una mejora significativa para el icónico vehículo de combate de infantería Warrior. Con modificaciones avanzadas, incluyendo potencia de fuego mejorada, sistemas de comunicación mejorados y armadura mejorada, el Guerrero Ajax garantiza un rendimiento superior del campo de batalla. Estas mejoras refuerzan las capacidades militares del Reino Unido, proporcionando un apoyo armónico modernizado y versátil para las fuerzas terrestres en una serie de escenarios operativos."
 ENG_fres_program_Idea: "Programa FRES"
 ENG_fres_program_Idea_desc: "El Programa FRES (Future Rapid Effect System) del Reino Unido es una iniciativa de pensamiento futuro, que mejora la agilidad militar con plataformas de tierra versátiles. Integrando la tecnología de vanguardia para una respuesta rápida, garantiza la preparación del Reino Unido en diversas misiones."
 ENG_fixing_civil_servant_idea: "Corrección del funcionario civil"
 ENG_fixing_civil_servant_idea_desc: "Nuestros soldados necesitan equipo confiable. Estamos haciendo esfuerzos para cumplir el requisito."
 ENG_special_command1: "Comando Especializado"
 ENG_special_command1_desc: "Concentrándonos en refinar la especialización y eficacia del ejército, buscamos mejorar las capacidades de combate de nuestras fuerzas armadas. Sin embargo, este compromiso se debe al costo del aumento de los gastos y a las necesidades de recursos más exigentes."
 ENG_special_command2: "Comando Especializado"
 ENG_special_command2_desc: "Concentrándonos en refinar la especialización y eficacia del ejército, buscamos mejorar las capacidades de combate de nuestras fuerzas armadas. Sin embargo, este compromiso se debe al costo del aumento de los gastos y a las necesidades de recursos más exigentes."
 ENG_special_command3: "Comando Especializado"
 ENG_special_command3_desc: "Concentrándonos en refinar la especialización y eficacia del ejército, buscamos mejorar las capacidades de combate de nuestras fuerzas armadas. Sin embargo, este compromiso se debe al costo del aumento de los gastos y a las necesidades de recursos más exigentes."
 ENG_UKSF1: "Fuerzas Especiales del Reino Unido"
 ENG_UKSF1_desc: "Las fuerzas de élite como el SAS y el SBS, estos agentes altamente entrenados sobresalen en operaciones encubiertas, lucha contra el terrorismo y guerra no convencional. La presencia de fuerzas especiales Elite eleva las capacidades estratégicas del Reino Unido en materia de agilidad y lucha contra el terrorismo, lo que representa la excelencia en precisión y adaptabilidad."
 ENG_UKSF2: "Fuerzas Especiales del Reino Unido"
 ENG_UKSF2_desc: "Las fuerzas de élite como el SAS y el SBS, estos agentes altamente entrenados sobresalen en operaciones encubiertas, lucha contra el terrorismo y guerra no convencional. La presencia de fuerzas especiales Elite eleva las capacidades estratégicas del Reino Unido en materia de agilidad y lucha contra el terrorismo, lo que representa la excelencia en precisión y adaptabilidad."
 ENG_aircraft_ai_idea: "Air Integration"
 ENG_aircraft_ai_idea_desc: "A medida que avanza la tecnología, los pioneros del Reino Unido Aircraft AI Integration, melding cut-edge artificial intelligence with aerial capabilities. Este espíritu nacional significa el compromiso de aprovechar la IA para mejorar el rendimiento de las aeronaves, los sistemas autónomos y las capacidades de las misiones adaptativas."
 ENG_quality_over_quantity: "Calidad sobre Cantidad"
 ENG_worldwide_command1: "Mando Mundial"
 ENG_worldwide_command1_desc: "El concepto de un Comando Mundial Británico prevé un enfoque estratégico en el que el Ejército Británico extiende su alcance operacional a nivel mundial. Esta iniciativa implica el establecimiento de una estructura de mando capaz de coordinar y llevar a cabo operaciones militares a escala mundial. Mediante el despliegue de fuerzas en diversas regiones, las Fuerzas Armadas Británicas tienen por objeto aumentar su influencia mundial, responder a las amenazas emergentes y contribuir a la seguridad internacional. El Comando del Ejército Mundial Británico representa un compromiso militar proactivo y versátil, alineando con la naturaleza cambiante de los desafíos mundiales en materia de seguridad."
 ENG_worldwide_command2: "Mando Mundial"
 ENG_worldwide_command2_desc: "El concepto de un Comando Mundial Británico prevé un enfoque estratégico en el que el Ejército Británico extiende su alcance operacional a nivel mundial. Esta iniciativa implica el establecimiento de una estructura de mando capaz de coordinar y llevar a cabo operaciones militares a escala mundial. Mediante el despliegue de fuerzas en diversas regiones, las Fuerzas Armadas Británicas tienen por objeto aumentar su influencia mundial, responder a las amenazas emergentes y contribuir a la seguridad internacional. El Comando del Ejército Mundial Británico representa un compromiso militar proactivo y versátil, alineando con la naturaleza cambiante de los desafíos mundiales en materia de seguridad."
 ENG_worldwide_command3: "Mando Mundial"
 ENG_worldwide_command3_desc: "El concepto de un Comando Mundial Británico prevé un enfoque estratégico en el que el Ejército Británico extiende su alcance operacional a nivel mundial. Esta iniciativa implica el establecimiento de una estructura de mando capaz de coordinar y llevar a cabo operaciones militares a escala mundial. Mediante el despliegue de fuerzas en diversas regiones, las Fuerzas Armadas Británicas tienen por objeto aumentar su influencia mundial, responder a las amenazas emergentes y contribuir a la seguridad internacional. El Comando del Ejército Mundial Británico representa un compromiso militar proactivo y versátil, alineando con la naturaleza cambiante de los desafíos mundiales en materia de seguridad."
 ENG_worldwide_command4: "Mando Mundial"
 ENG_worldwide_command4_desc: "El concepto de un Comando Mundial Británico prevé un enfoque estratégico en el que el Ejército Británico extiende su alcance operacional a nivel mundial. Esta iniciativa implica el establecimiento de una estructura de mando capaz de coordinar y llevar a cabo operaciones militares a escala mundial. Mediante el despliegue de fuerzas en diversas regiones, las Fuerzas Armadas Británicas tienen por objeto aumentar su influencia mundial, responder a las amenazas emergentes y contribuir a la seguridad internacional. El Comando del Ejército Mundial Británico representa un compromiso militar proactivo y versátil, alineando con la naturaleza cambiante de los desafíos mundiales en materia de seguridad."
 ENG_naval_defense_act_1889_1: "Ley de defensa naval de 1889"
 ENG_naval_defense_act_1889_1_desc: "La Ley de defensa naval de 1889 es una ley del Parlamento del Reino Unido. Recibió el consentimiento real el 31 de mayo de 1889 y adoptó formalmente el estándar de dos potencias e incrementó la fuerza naval del Reino Unido. El estándar pidió a la Armada Real que mantuviera una serie de buques de combate al menos iguales a la fuerza combinada de las dos próximas mayores marinas del mundo"
 ENG_naval_defense_act_1889_1_tt: "§RSe cambiará a un espíritu nacional temporal durante dos años, una vez que seamos el poder naval del continente§!"
 ENG_army_special_operations_brigade_idea: "Brigada de Operaciones Especiales del Ejército"
 ENG_army_special_operations_brigade_idea_desc: "La Brigada de Operaciones Especiales del Ejército del Reino Unido es una fuerza elite y altamente especializada dentro del ejército británico. Esta brigada está diseñada específicamente para misiones no convencionales y de alto riesgo. Equipado con armamento avanzado, entrenamiento especializado y un compromiso con la versatilidad, la Brigada de Operaciones Especiales del Ejército desempeña un papel fundamental en abordar amenazas complejas, ejecutar operaciones de precisión y contribuir a la estrategia general de defensa de la nación."
 ENG_allied_basing_efforts_Idea: "Aliados esfuerzos de basing"
 ENG_allied_basing_efforts_Idea_desc: "La iniciativa Allied Basing Efforts presenta un enfoque amplio para fortificar la infraestructura y los activos estratégicos de las naciones miembros dentro de la alianza. Este programa abarca mejoras esenciales en las redes de transporte, bases aéreas, puertos y otras instalaciones críticas. El Reino Unido, como importante contribuyente de la alianza, recibe una mejora sustancial y duradera de su infraestructura, promoviendo la eficiencia logística y la preparación estratégica."
 ENG_royal_navy_Idea1: "Marina real británica"
 ENG_royal_navy_Idea1_desc: "La Marina Real Británica es una de las principales fuerzas marítimas del mundo, con un legado histórico que data de siglos atrás. Renombrada por su adaptabilidad y proeza tecnológica, la Armada Real desempeña un papel crucial para salvaguardar los intereses marítimos del Reino Unido y proyectar el poder a nivel mundial."
 ENG_royal_navy_Idea2: "Marina real británica"
 ENG_royal_navy_Idea2_desc: "La Marina Real Británica es una de las principales fuerzas marítimas del mundo, con un legado histórico que data de siglos atrás. Renombrada por su adaptabilidad y proeza tecnológica, la Armada Real desempeña un papel crucial para salvaguardar los intereses marítimos del Reino Unido y proyectar el poder a nivel mundial."
