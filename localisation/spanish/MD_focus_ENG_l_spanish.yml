 ENG_the_inner_circle_dm: "El Círculo Interior"
 ENG_the_inner_circle_dm_desc: "El Círculo Interior de la Reina reúne el hogar real y las figuras más confiables de [ENG.GetNameDef], leales para defender la autoridad de la Reina $ENG_elizabeth_queen$ y proteger los intereses de la Corona. Librados por el deber y el prestigio, compiten por la proximidad, las citas y la confianza del Soberano, sabiendo que la influencia en los tribunales puede dar forma a la política mucho más allá de la opinión pública. Sus manos alcanzan decisiones militares, industriales y políticas por igual, dirigiendo Gran Bretaña a través de la patrocinio, el acceso y la dirección silenciosa."
