 ENG_military.007.t: "Puestos de avanzada en la Luna"
 ENG_military.007.d: "Nuestros científicos e ingenieros están listos para enviar astronautas y equipos para vivir semipermanentemente en la Luna. Allí se enviará una suma total de aproximadamente 12 astronautas, junto con decenas de millones de dólares por valor de equipos, suministros, espacios vivos y artículos personales. Este puesto de avanzada tendrá que moverse regularmente a medida que el día Lunar dura 29 días de la Tierra, lo cual es demasiado largo para las baterías para mantener el poder almacenado en la Luna.\n\nLa base misma estará en los polos, fácilmente movebles, para obtener el máximo uso de nuestros paneles solares. Además, se realizarán experimentos para determinar las condiciones de vida a largo plazo en la Luna. La extracción de hielo lunar no sólo podría llevar al agua líquida para plantas y alimentos para astronautas en la Luna, sino que también conduce a separarlo en oxígeno e hidrógeno, combustible cohete.\n\nEsto puede tardar meses o años en obtener la investigación necesaria para hacer esto. Dentro de este tiempo, sin embargo, utilizando los fondos para este proyecto, construiremos un depósito orbitando la Luna para permitir un acceso más fácil a la Luna y repostar para llegar a la Tierra.\n\nTodo esto es factible en la próxima década. Ahora, sin embargo, es el momento de lanzarse."
 ENG_military.007.a: "¡Lanzamiento!"
 ENG_military.008.t: "Moonbase Alpha"
 ENG_military.008.d: "Nuestros científicos e ingenieros han aterrizado oficialmente en la Luna, y actualmente están en el proceso de establecer la Base Lunar. Cada sección se divide en «modules», no bastantes edificios por su cuenta, pero no juntos como uno. Hay un módulo de habitación, para el descanso, módulo alimentario, para el cultivo de alimentos, módulo de laboratorio, que es el más grande con la mayoría del equipo científico, un módulo de mantenimiento, que contiene todas las herramientas de mantenimiento para reparar cosas si se rompen, un módulo de servicios, ya que estas personas están aquí durante 6 meses, y trabajar todo el día a diario no es bueno para la mente, y bastantes paneles solares. \n\nLas entregas de alimentos serán comunes durante estos primeros meses, ya que requiere tiempo para cultivar alimentos. El agua y el oxígeno se obtendrán a través del hielo lunar. Por último, estos científicos se quedarán hasta poco después de mudarse a la siguiente ubicación en aproximadamente 6 meses cuando los paneles solares se descomponen debido al día y noche Lunar donde el puesto está situado dura 6 meses.\n\nMoonbase Alpha está completo."
 ENG_military.008.a: "¡La ciencia!"
 ENG_military.009.t: "Colonia Progreses"
 ENG_military.009.d: "Nuestro puesto científico en la Luna ha tenido un gran avance. Con la expansión de su actual red de paneles solares, y descubrimientos recientes haciendo que el agua se separe para facilitar el oxígeno e hidrógeno, han sido capaces de subir con suficiente oxígeno e hidrógeno para alimentar completamente el cohete de suministro más reciente. Este es un avance tan necesario que permitirá a la Luna misma, dado el tiempo y la inversión suficientes, puede convertirse en un centro para futuras empresas espaciales en el espacio exterior.\n\nEl espacio en sí mismo se está volviendo más pequeño."
 ENG_military.009.a: "Somos buenos en ser pioneros"
 ENG_military.010.t: "Crisis en la Luna"
 ENG_military.010.d: "Deben adoptarse medidas drásticas inmediatamente. Por razones actualmente desconocidas, el módulo de habitación ha roto y «explorado».\n\nHace una hora, los 12 científicos estaban haciendo sus deberes cuando, de repente, había una ruptura masiva en el módulo de habitación.\n\nComo las olas no viajan en vacío, la mayoría no se dio cuenta hasta que físicamente vieron lo que había pasado.\n\nHay un fondo de emergencia como parte del presupuesto, por lo que no hay necesidad de asignar más fondos al proyecto, y los científicos siempre pueden dormir en los otros módulos aislados; sin embargo, esto ha asustado a muchos, declarando que algunos, muchos, o incluso todos nuestros científicos podrían haber muerto, y también ha bajado la moral de los científicos desde que pudieron haber muerto. Por lo tanto, intentar continuar el puesto de avanzada en la Luna será políticamente costoso, y una rotación de científicos puede tener que suceder ahora más que tarde, debido al embate de la moral.\n\n¿Qué vamos a hacer?"
 ENG_military.010.a: "¡Envíen ayuda de emergencia!"
 ENG_military.010.b: "Abandona el proyecto. No está destinado para nosotros."
 ENG_military.011.t: "Colony Progresss Further"
 ENG_military.011.d: "Nuestro puesto de avanzada de Luna ha hecho otro avance importante. Ellos han logrado enviar Hidrogen 3, un gas que parece perfecto para la fusión, a la Tierra, y los científicos en casa han descubierto cómo conducir la fusión con ella! No sólo esto, sino que el poder generado a partir de esta fusión está cerca de la cantidad utilizada para hacer la reacción en primer lugar. Esto significa que, con algunas mejoras, esto podría resultar en la energía de fusión exitosa! Esto no sólo permite enormes beneficios en casa, junto con el conocimiento que podemos utilizar en el uso de otros materiales para la fusión, podemos usar esto en la Luna, permitiendo un puesto permanente en lugar de puestos móviles!\n\nTodo esto está muy por delante de lo previsto, que es una sorpresa, y muchos en UKSC han sido dejados sin preparación para implementar esto en el actual Moonbase. Por lo tanto, se necesita una nueva Base Lunar, en un lugar mucho mejor para la rápida expansión que la ubicación actual de Moonbase Alpha. Es hora de comenzar los preparativos en Moonbase Beta."
 ENG_military.011.a: "La vida continúa"
 ENG_military.012.t: "Otra crisis en la luna"
 ENG_military.012.d: "Hay que tomar medidas más drásticas. Dos módulos más han roto. Esta vez, son tanto los módulos de Alimentación y Servicios.\n\nHace aproximadamente cuarenta minutos, un científico estaba a punto de entrar en el módulo Food cuando explotó repentinamente. El científico está bien, y nadie más que las plantas fueron dañadas. Sin embargo, estaba adyacente al módulo de Amenities y lo causó a la ruptura y explosión. De nuevo, nadie estaba herido.\n\nEsta nueva ocurrencia, sin embargo, ha levantado los pelos de muchos en casa, cuestionando la seguridad de los módulos. Después de la explosión anterior, UKSC reemplazó los módulos, asegurando que no explotaran, pero parece que una presión prolongada puede causar que algo se rompa mucho más fácilmente de lo contrario. UKSC ya ha respondido rápidamente, ordenando nuevos módulos ser hecho inmediatamente, así como una inspección estrecha de todos los módulos actuales (Como no se puede «reconocer»modules desde la Luna a partir de este momento).\n\nCon la presión de montaje en casa para dejar de seguir adelante con el proyecto hasta que se resuelvan todas las preocupaciones de seguridad, se cuestiona la continuación del programa Moonbase. Además del retroceso político, el fondo de emergencia se ha reducido a la mitad, por lo que UKSC está solicitando otros $5 mil millones para resolver preocupaciones futuras. Queda tu elección para decidir si continuar."
 ENG_military.012.a: "¡Envíe más ayuda de emergencia!"
 ENG_military.012.b: "No podemos seguir haciendo cosas así."
 ENG_military.013.t: "Moonbase Beta"
 ENG_military.013.d: "En este punto, nuestros científicos e ingenieros en la Luna necesitan mudarse a otro lugar en los polos. Los costos para hacer esto ya están establecidos en el presupuesto a largo plazo, por lo que no necesitamos añadir ninguna nueva financiación al proyecto todavía.\n\nCon esta nueva base de luna, podremos utilizar nuevos descubrimientos que hemos descubierto para permitir que la base sea establecida permanentemente, a diferencia de nuestra base de luna anterior. Con el uso de mejores cohetes, mejor generación de energía, mejor extracción y separación de hielo, podemos utilizar esta nueva base, en un sitio más adecuado para la rápida expansión, para facilitar los esfuerzos de colonización de la Luna. Esta no es la única buena noticia, los empresarios y las corporaciones están inundando en masa a UKSC para solicitar solicitudes de poner sus sistemas mineros recién desarrollados en la Luna. Incluso otros programas espaciales en otros países están ahora muy interesados en iniciar puestos científicos y mineros en la Luna, sin embargo, debido a sus diligentes esfuerzos, no sólo tenemos un comienzo de cabeza masivo, sino que somos el único país que intenta colonizar la Luna.\n\nEl futuro en nuestra Luna es brillante y chino."
 ENG_military.013.a: "¡Al fin de la tarde té en la luna!"
 ENG_Moonbase_beta_completed: "Moonbase Beta terminada"
 ENG_military.014.t: "Marte Rover Misión"
 ENG_military.014.d: "Nuestros científicos e ingenieros están listos para enviar nuestro Rover al Marte. Tiene una suma total de aproximadamente 14 sensores instalados, junto con decenas de millones de dólares en equipo. Este Rover tendrá que ser movido regularmente a medida que el día Marte dura 1 1/5 días de la Tierra, que es demasiado largo para las baterías para mantener el poder almacenado en el Marte.\n\nEl Rover mismo estará en los polos, fácilmente movebles, para obtener el máximo uso de nuestros paneles solares. Además, se realizarán experimentos para determinar las condiciones de vida a largo plazo en el Marte. La extracción de hielo no sólo podría llevar al agua líquida para plantas y alimentos para futuros astronautas del Marte, sino que también conduce a separarlo en oxígeno e hidrógeno, combustible de cohetes.\n\nEsto puede tardar meses o años en obtener la investigación necesaria para hacer esto. En este momento, sin embargo, utilizando los fondos para este proyecto, construiremos un depósito orbitando el Marte para permitir un acceso más fácil al Marte y repostar para llegar a la Tierra.\n\nTodo esto es factible en la próxima década. Ahora, sin embargo, es el momento de lanzarse."
 ENG_military.014.a: "¡Lanzamiento!"
 ENG_military.015.t: "Proyecto de colonia Marte"
 ENG_military.015.d: "Si los humanos quieren colonizar a Marte, deben establecer una base permanente que sea autosuficiente. Este es el sueño de innumerables exploradores espaciales y la única manera para que los humanos pongan pie en el espacio. Todo esto se convertirá en una realidad hoy."
 ENG_military.015.a: "¡Marte aquí vamos!"
 ENG_military.016.t: "Fallo del sistema de aterrizaje"
 ENG_military.016.d: "Después de un viaje de casi 60 millones de kilómetros, nuestra nave espacial finalmente apareció sobre Marte. El óxido de hierro en todo Marte mostró una apariencia roja. El planeta, visible desde hace mucho tiempo sólo a través de una lente, está ahora a la vista. \nLa nave espacial entra en modo de aterrizaje. El capitán, que había practicado incontables veces en el simulador, emitió la orden, pero parecía haber un problema con el dispositivo de aterrizaje. En este momento, grandes cuentas de sudor cubrieron instantáneamente la frente del capitán."
 ENG_military.016.a: "Londres, hemos tenido un problema."
 ENG_military.017.t: "Fallo del vehículo"
 ENG_military.017.d: "Después de una emocionante media hora, la nave espacial finalmente escapó del riesgo de estrellarse y aterrizaron torcidamente en el Marte Utopia Plain. Este es también el sitio de aterrizaje del anterior rover Beagle. Se reconoce como la mayor cuenca de impacto en Marte y el sistema solar, con un diámetro estimado de 3.300 kilómetros. \nDespués de aterrizar, la tripulación se transferirá a un rover especial y se dirigirá a la parte sur de la llanura para establecer una base, pero las vibraciones del aterrizaje anterior de la nave espacial parecen haber tenido algún impacto en la palanca. Está claro que la situación se ha desarrollado no necesariamente a favor de la tripulación"
 ENG_military.017.a: "Parece que hay algo malo con nuestro maldito vehículo hoy."
 ENG_military.018.t: "Llegada a la Base"
 ENG_military.018.d: "40 kilómetros, la primera vez que los humanos han viajado tan larga marcha en un planeta distinto de la Tierra. Tal distancia ordinaria en la tierra es un avance decisivo en la historia de la luz espacial humana. \nDespués de pasar por el tenso proceso de configuración del campamento, transmitiendo todos los datos necesarios de vuelta a la tierra, y comprobando los parámetros de todo el equipo, el capitán que estaba sentado en la cama podría finalmente tomar una bebida de té. \nA través de la ventana del material sintético transparente sobre la cabeza, un punto de luz entre las estrellas brillaba con un poco de luz azul, y esa era la Tierra. \n\n«Mejor». El capitán murmuró."
 ENG_military.018.a: "No tengas miedo de llegar tarde a una buena comida."
 ENG_military.019.t: "Aterramiento exitoso"
 ENG_military.019.d: "Todo era perfecto, como se esperaba, la nave espacial aterrizó en el lugar de aterrizaje designado exactamente, y el viaje humano a Marte comenzó en paz. \n"
 ENG_military.019.a: "Sabía que nuestra tripulación sería capaz de completar la misión."
 ENG_military.020.t: "Llegada a la Base"
 ENG_military.020.d: "El punto de aterrizaje de la nave espacial era la dirección preestablecida de la base, y la tripulación comenzó a acampar en el lugar para prepararse para la construcción de la primera base permanente de la humanidad en Marte. Nadie notó que las botas del espacio dejaron innumerables huellas desordenadas en el suelo marciano."
 ENG_military.020.a: "Un pequeño paso para Marte, un salto gigante para la humanidad."
 ENG_military.021.t: "Localizar la fuente de agua"
 ENG_military.021.d: "El agua es un recurso esencial para la supervivencia humana. Uno de los principales propósitos de las actividades anteriores de exploración de Marte fue encontrar fuentes de agua en Marte. Aunque no hay lagos superficiales o ríos como la Tierra, los recursos hídricos de Marte existen básicamente en forma de hielo bajo la superficie de Marte. \nSin embargo, el posicionamiento preciso real requiere que alguien realice encuestas in situ en persona."
 ENG_military.021.a: "¡No podemos sobrevivir sin nuestro té!"
 ENG_military.022.t: "Protección contra las radiaciones subterráneas"
 ENG_military.022.d: "Debido a la delgada atmósfera de Marte y la falta de un campo magnético planetario, la radiación del espacio llega a la superficie sin trabas. La base no pudo proporcionar suficiente refugio cuando fue construido por primera vez, así que cavar un nido en el suelo se convirtió en la primera opción para evitar la radiación. \nTestigo del orgullo de crear una nueva base para el Reino Unido, Recordó a la tripulación de los grandes días del Imperio Británico."
 ENG_military.022.a: "Britannia Reglas del Espacio"
 ENG_military.023.t: "La primera cosecha en Marte"
 ENG_military.023.d: "El problema de las fuentes de agua ha sido resuelto, y la fuente de energía es proporcionada temporalmente por la energía solar. Por lo tanto, la producción de alimentos (y té) en Marte se ha convertido en el asunto más importante en la actualidad. \nLos cultivos tradicionales de cereales han sido excluidos debido a sus ciclos de crecimiento y procesos de cosecha, y las papas se han convertido en los primeros cultivos humanos que se cultivan en Marte. Aunque Marte no es tan brillante como la Tierra debido a la distancia del sol, las patatas en el invernadero parecen crecer más exuberantemente. La primera cosecha de la humanidad en Marte está a la vista."
 ENG_military.023.a: "Toda la naturaleza, las papas orgánicas, cultivadas por marcianos."
 ENG_military.024.t: "Sandstorm"
 ENG_military.024.d: "La tormenta de arena es una ocurrencia común en Marte. Aunque la presión aérea sobre Marte es mucho menor que la de la Tierra, la tormenta marciana no es tan devastadora como las leyendas anteriores, al igual que en esa película. \nSin embargo, el polvo elevado sigue planteando muchos peligros ocultos a las bases humanas, sobre todo porque la energía solar es una fuente de energía indispensable para las bases actuales."
 ENG_military.024.a: "No tenemos oportunidad de salvar a Matt Damon aquí."
 ENG_military.025.t: "Accidente"
 ENG_military.025.d: "Para subir la montaña a menudo y eventualmente correr en un tigre. La tormenta de polvo marciana duró mucho más de lo esperado anteriormente, y la vida de la batería dentro de la base parecía estar en una situación muy pesimista. \nPara continuar con la misión de la colonia Marte, necesitamos tomar una decisión, elegir evacuar y encontrar un nuevo lugar, o seguir reparando las instalaciones dañadas."
 ENG_military.025.a: "Evacuate"
 ENG_military.025.b: "Base fija"
 ENG_military.026.t: "Evacuate"
 ENG_military.026.d: "No podemos esperar más. La situación es ahora muy crítica y es hora de utilizar cohetes de respaldo para la evacuación. Después de comprobar que todos los miembros del equipo habían embarcado con seguridad en el barco, el capitán renuentemente miró hacia atrás al edificio base que todavía estaba en construcción. Suprimió el dolor en su corazón y dio la orden a la guía de inteligencia artificial para lanzar la nave espacial. \n«¡Volveremos!» Mientras se levantó una gran ráfaga de humo, la nave espacial partió del suelo marciano y lentamente subió al cielo."
 ENG_military.026.a: "Donde hay vida, hay esperanza."
 ENG_military.027.t: "Base de reparación dañada"
 ENG_military.027.d: "No podemos sentarnos y esperar, debemos empezar a reparar en la base inmediatamente con cualquier costo, de lo contrario todas las ganancias que hemos hecho en Marte serán arruinadas, y nadie puede sobrevivir en este caos. Salvar la base significa salvarnos."
 ENG_military.027.a: "Por el bien del sacrificio y la gran ambición, nos atrevemos a hacer un mundo nuevo."
 ENG_military.028.t: "Proyecto de la ciudad de Marte"
 ENG_military.028.d: "Hemos logrado logros notables en la construcción de una colonia Marte. Pero todavía hay cierta distancia a recorrer antes de que finalmente podamos alcanzar nuestro objetivo. ¿Todavía queremos seguir invirtiendo en la construcción de Marte?"
 ENG_military.028.a: "Actualización"
 ENG_military.028.b: "Don´t need it"
 ENG_military.029.t: "Yes"
 ENG_military.029.d: "Mientras damos un paso más, nuestra misión en Marte estará completamente completa. No hay medias medidas en nuestra agenda."
 ENG_military.029.a: "No pases la responsabilidad a la próxima generación."
 ENG_military.030.t: "No"
 ENG_military.030.d: "La actual base de Marte es lo suficientemente completa, y no es prudente seguir invirtiendo más. Todavía tenemos muchos problemas que enfrentar en la tierra, y es imposible tirar dinero al espacio."
 ENG_military.030.a: "Cree en la sabiduría de las generaciones futuras."
 ENG_military.031.t: "Mars City completó"
 ENG_military.031.d: "Después de nuestros esfuerzos irremitentes, nuestra colonia en Marte finalmente ha sido terminada. Los seres humanos nunca olvidarán estos esfuerzos, y un día los seres humanos pondrán pie en toda la galaxia."
 ENG_military.031.a: "Nuestro viaje es toda la galaxia."
 ENG_military.032.t: "Fundada nueva subbase"
 ENG_military.032.d: "A medida que más naves espaciales trajeron más personal y materiales, la base originalmente de Marte comenzó a prosperar. Los recursos hídricos bajo la base original ya no pueden llevar más gente, y es urgente establecer una nueva sub-base. \nA medida que la nave espacial del primer equipo desapareció poco a poco de vista, el ex capitán y hoy el alcalde de la primera nueva ciudad de Londres recordó el pasado cuando el marte cayó en una trinchera."
 ENG_military.032.a: "Mamá, hoy voy a un largo viaje."
 ENG_military.033.t: "Monumento de la ciudad de Marte"
 ENG_military.033.d: "Como los humanos han viajado a través de Marte, Marte se ha convertido en el nuevo hogar para los seres humanos en la Tierra. El terraforming de Marte está procediendo de manera ordenada. En el primer punto de aterrizaje de la nave espacial humana, se construyó un enorme monumento para conmemorar a los hombres y mujeres que sacrificaron sus vidas durante el viaje y construcción en el proceso de conquistar Marte. Ellos serán grabados para siempre en el viaje de la civilización humana."
 ENG_military.033.a: "¡Por la humanidad!"
 ENG_mars_city_building_completed: "Edificio de la ciudad de Marte completado"
 ENG_military.001.t: "Lanzamiento de la Iniciativa de Minería Asteroide"
 ENG_military.001.d: "Asteroid Mining ha sido una fantasía para muchos antes que nosotros. Los asteroides por sí mismos llevan metales de grupo platino muy buscados, oro, plata y metales de grupo de hierro. Podría llegar a ser extremadamente lucrativo para cualquier país espacial. Así que hoy, el establecimiento de una Royal Asteroid Mining Company británica, o BRAMC, dará el primer paso hacia los asteroides mineros. Utilizando vastos arsenales de telescopios a través del Imperio, podemos buscar asteroides adecuados en el espacio exterior cercano, y luego tirarlo a la órbita y mío. Encontrar un asteroide adecuado será difícil, ya que, en relación con la distancia a la que están, son bastante pequeños. Por suerte, en realidad hay bastantes que pasan por la Tierra con tanta frecuencia, así que no tardaría mucho en conseguir que uno permanezca en la órbita de la Tierra."
 ENG_military.001.a: "Solo necesito esperar a un asteroide..."
 ENG_military.002.t: "Asteroide localizado"
 ENG_military.002.d: "Recientemente, nuestros científicos del BRAMC detectaron un asteroide adecuado que pasaba cerca de la Tierra. Esto ha sido un alivio para el BRAMC, como algunos dudaron si realmente hubieramos detectado un asteroide adecuado y económico en absoluto. Sin embargo, este asteroide se mueve lentamente lo suficiente, es lo suficientemente grande y es lo suficientemente rico como para ser trasladado a órbita y minada. El asteroide es, en hecho, más grande que Gales. El siguiente paso es simplemente mover este asteroide a órbita alrededor de la Tierra, que nunca se ha hecho antes. Mientras tanto, los ingenieros de mando espacial británicos, e incluso empresas privadas como Virgin Galactic, han inventado mecanismos para minar el asteroide, por lo que estarán listos para cuando el asteroide llegue a órbita."
 ENG_military.002.a: "Vamos a poner ese bebé en órbita."
 ENG_military.003.t: "Asteroides en Orbit"
 ENG_military.003.d: "Con el asteroide en órbita, UKSC y Virgin envían misiones al asteroide orbitante. UKSC se preocupa principalmente por la recopilación de datos científicos, mientras que Virgin Galactic está más preocupada por la minería del material. Sin duda este es un logro notable, que nos da una ventaja en el espacio. Incluso se habla de traer más asteroides, pero muchos dicen que los asteroides adicionales pueden venir más tarde, ya que este asteroide es muy grande y bien adecuado para la minería. Otros países ya nos están mirando con envidia, y están considerando sus propios programas de minería de asteroides. Los costos son extremadamente altos incluso para desarrollar la tecnología hasta llegar allí, por lo que hay poca preocupación entre Virgin Galactic o UKSC que la competencia va a crecer."
 ENG_military.003.a: "La minería comenzará"
 ENG_military.004.t: "Ganancias de Mining Start Pouring en"
 ENG_military.004.d: "Después de establecer operaciones mineras, Virgin Galactic y UKSC han devuelto sus primeros envíos de material espacial a laboratorios y mercados alrededor del mundo. El mundo nos ha mirado con vagabundeo, y han habido conversaciones abiertas en sus respectivas cámaras de legislación sobre la apertura de sus propias operaciones mineras de asteroides. Si bien pronto podemos conseguir la competencia, podemos disfrutar del monopolio por ahora."
 ENG_military.004.a: "¡Soy Chuffed To Bits!"
 ENG_military.005.t: "Ganancias de Asteroid Mining"
 ENG_military.005.d: "Los últimos envíos de nuestras operaciones mineras de asteroides han llegado, y han generado muchos ingresos. Estos envíos incluyen platino, oro y plata. Poner los ingresos a buen uso sería prudente."
 ENG_military.005.a: "¡Excelente!"
 ENG_military.006.t: "Potencial para la minería de asteroides"
 ENG_military.006.d: "Recientemente, la Cámara de los Comunes ha permitido a UKSC y Virgin Galactic, una compañía espacial privada, llevar un asteroide bastante grande en órbita de la Tierra y minarla. Nuestros asesores recomiendan invertir en este nuevo espacio, ya que podría permitir la entrega de materiales raros directamente a nuestro país. Algunos, sin embargo, han citado la masiva medida que el Reino Unido tenía que pagar para incluso comenzar las operaciones y oponerse a la expansión en el espacio. El retorno de esta inversión depende, pero puede tardar 25 años en romper incluso. La inversión más sustancial puede reducir esto, pero estaremos mucho detrás del resto por un tiempo. \n\n¿Qué haremos con respecto a la minería de asteroides? ¿Iniciar un programa nacional, o ignorarlo por completo?"
 ENG_military.006.a: "Invertir en la minería de asteroides"
 ENG_military.006.b: "¡Demasiado caro y una pérdida de tiempo!"
 Mobile_Fires_Platorm_Program.1.t: "Móvil Fires Platform Programa de selección de socios"
 Mobile_Fires_Platorm_Program.1.d: "Tras el fin de la Guerra Fría y la anticipación de un conflicto en las llanuras alemanas excavadas, el arsenal del Ejército de 155 milímetros de artillería disminuyó, y ahora, con nuevas amenazas en el horizonte, el Ministerio de Defensa ha decidido tomar las medidas para resucitar esta capacidad. Numerosos programas y socios para cumplir este contrato han avanzado, de los cuales sólo uno tendrá éxito."
 ENG_military.034.a: "Alianza de artillería Archer"
 ENG_military.034.b: "K9A1 Thunder Development Group"
 ENG_military.034.c: "Programa Boxer"
 ENG_military.034.e: "Ceaser Collaboration"
 ENG_military.035.t: "Gran Bretaña nos invita a una Fuerza Expeditiva Conjunta"
 ENG_military.035.d: "El Reino Unido invita cordialmente a [Receiving Country] a sumarse a la Fuerza Expeditativa Conjunta (JEF), una iniciativa de colaboración encaminada a fomentar la cooperación internacional y mejorar la seguridad colectiva. Este acontecimiento significativo marca el comienzo de un nuevo capítulo en nuestro compromiso compartido de promover la estabilidad, responder a los desafíos mundiales y salvaguardar los valores que nos sentimos queridos."
 ENG_military.035.a: "¡Nos unimos!"
 ENG_military.035.b: "No gracias, viejo Chap"
 ENG_military.036.t: "[From.GetName] ¡Acepta!"
 ENG_military.036.d: "[From.GetName] se unirá a nuestra Fuerza Expeditiva Conjunta. Juntos podemos preparar nuestras fuerzas militares para una respuesta rápida"
 ENG_military.036.a: "Welcome"
 ENG_military.037.t: "[From.GetName] ¡Rehusa!"
 ENG_military.037.d: "[From.GetName] no se unirá a nuestra Fuerza Expeditiva Conjunta. Ellos prefieren estar solos."
 ENG_military.037.a: "Se arrepentirán con el tiempo."
 ENG_military.038.t: "Expansión del Colegio Naval de Dartmouth"
 ENG_military.038.d: "Con un enfoque en la tecnología de vanguardia, el pensamiento estratégico y la experiencia práctica, Dartmouth Naval College está preparado para desempeñar un papel fundamental en la configuración de la próxima generación de líderes navales."
 ENG_military.038.a: "Los transportistas de aeronaves son el futuro de la guerra naval"
 ENG_military.038.b: "Necesitamos Destructores y Cruceros para derrotar a nuestros enemigos en el mar"
 ENG_military.040.t: "Tifón Tranche 1 Debate"
 ENG_military.040.d: "Los interesados, como oficiales militares, analistas de defensa y representantes del gobierno, se involucran en discusiones sobre la eficacia de la aeronave para abordar amenazas cambiantes, su papel dentro de las estrategias nacionales de defensa y su potencial de exportación a socios internacionales. El debate del Tifón Tranche 1 juega un papel crucial en la configuración de las decisiones relacionadas con la adquisición, el despliegue y el desarrollo futuro de este avión de combate avanzado."
 ENG_military.040.a: "Continuar la producción"
 ENG_military.040.b: "Investigación su Sucesor"
 ENG_military.040.c: "Cortar las existencias"
 ENG_military.039.t: "Especialización de las fuerzas armadas"
 ENG_military.039.d: "Escoge tu especialización"
 ENG_military.039.a: "Ejército"
 ENG_military.039.b: "Fuerza aérea"
 ENG_military.039.c: "Armada"
 ENG_military.039.e: "Personal"
 ENG_military.041.t: "UK nos invita a comprar su innovación para Aircraft"
 ENG_military.041.d: "El Reino Unido hizo inversiones masivas en sus capacidades de la industria aeronáutica y aérea. Debido a nuestra relación especial, ofrecen compartir su innovación por un pequeño precio. Son británicos después de todo"
 ENG_military.041.a: "¿Innovación? ¡Sí, por favor!"
 ENG_military.041.b: "No gracias Old Chap"
 ENG_military.042.t: "UK nos invita a comprar su innovación para Aircraft"
 ENG_military.042.d: "El Reino Unido hizo inversiones masivas en sus capacidades de la industria aeronáutica y aérea. Debido a nuestra relación especial, ofrecen compartir su innovación por un pequeño precio. Son británicos después de todo"
 ENG_military.042.a: "¿Innovación? ¡Sí, por favor!"
 ENG_military.042.b: "No gracias Old Chap"
 ENG_military.043.t: "Aceptamos EE.UU."
 ENG_military.043.d: "EE.UU. Aceptó nuestra oferta para vender nuestra innovación"
 ENG_military.043.a: "Como se espera"
 ENG_military.044.t: "EE. UU. se niega"
 ENG_military.044.d: "Los Estados Unidos rechazaron nuestra oferta de venta de innovación. Creen que el Reino Unido no es el socio viable que necesitan"
 ENG_military.044.a: "Lo sabrán eventualmente."
 United_Kingdom.002.t: "Silicon Glen entrega"
 United_Kingdom.002.d: "Nuestras inversiones en Silicon Glen de Escocia están pagando. Universidades locales, diseñadores de chips y empresas de software reportan otro año de crecimiento, nuevas patentes y un flujo constante de graduados cualificados en la economía más amplia."
 United_Kingdom.002.a: "Deja que Glen siga empujando la frontera"
 United_Kingdom.003.t: "Propuesta de cooperación transfronteriza"
 United_Kingdom.003.d: "El Reino Unido se ha acercado a nosotros con una propuesta para mejorar la logística comercial y reducir la sobrecarga burocrática en nuestra frontera común. El marco de cooperación propuesto se centra en el alineamiento de la infraestructura, la simplificación aduanera y los comités reguladores conjuntos.\n\n¿Deberíamos aceptar?"
 United_Kingdom.003.a: "Aceptar el marco"
 United_Kingdom.003.b: "Decline la oferta"
 United_Kingdom.004.t: "Irlanda acepta la cooperación transfronteriza"
 United_Kingdom.004.d: "El Gobierno irlandés ha aceptado nuestra propuesta de racionalizar la coordinación económica transfronteriza. Se han establecido comités para reducir la cinta roja, alinear las normas y facilitar el movimiento de mercancías más suaves en todo el Mar Irlandés y la frontera terrestre."
 United_Kingdom.004.a: "Avances mediante la asociación"
 United_Kingdom.005.t: "Ireland Declines oferta cruzada de cobre"
 United_Kingdom.005.d: "A pesar del interés inicial, el Gobierno irlandés ha decidido en última instancia no participar en nuestro marco de cooperación transfronteriza. Los funcionarios citaron la complejidad jurídica y la vacilación política como razones clave para el rechazo."
 United_Kingdom.005.a: "Infortunado, pero esperado"
 scottish.1.t: "Elecciones parlamentarias escocesas"
 scottish.1.d: "Los resultados de las elecciones parlamentarias escocesas han llegado, y por fin podemos ver si el pueblo escocés ha votado o no a favor de los partidos independentistas."
 scottish.1.a: "Okay"
 britain_md.1.a: "Vamos a movernos entonces."
 britain_md.2.a: "Nos arriesgaremos."
 britain_md.2.b: "No me gustan esas probabilidades."
 britain_md.3.a: "Llamamiento a los Sindicatos Laborales"
 britain_md.3.b: "Llamamiento al Complejo Industrial Militar"
 britain_md.3.c: "Llamamiento a la industria del combustible de fósiles"
 britain_md.4.a: "Impuesto a los industriales"
 britain_md.4.b: "Impuesto militar"
 britain_md.4.c: "Impuesto a las industrias del combustible fósil"
 britain_md.4.d1: "¿De verdad necesitamos gravar a alguien?"
 britain_md.5.a: "Onward!"
 britain_md.6.d: "Nuestra infraestructura está en necesidad extrema de mejoras. No es necesariamente malo, pero para competir con jugadores globales, tendremos que expandir nuestras ciudades. Sin embargo, centrándonos únicamente en una amplia expansión de la infraestructura elegiremos una región específica para trabajar. De esta manera, podremos crear nuevos centros de inversión y florecer esas áreas."
 britain_md.6.a: "Trabajar en el Norte"
 britain_md.6.b: "Trabajar en el Centro"
 britain_md.6.c: "Trabajos en el Sur"
 britain_md.7.a: "Vamos a trabajar."
 britain_md.8.a: "¡Sin duda no están vinculados! Los migrantes están bien"
 britain_md.8.b: "Bueno los datos no mienten"
 britain_md.9.a: "No hay tiempo para perder, vamos a seguir con él"
 britain_md.10.a: "Vamos a cambiar un poco."
 britain_md.10.b: "Absolutamente no"
 britain_md.11.a: "Bien, ahora vamos a seguir con ello"
 britain_md.12.a: "Okay"
 britain_md.12.b: "No"
 britain_md.13.a: "Okay"
 britain_md.14.a: "Bastards"
 britain_md.15.a: "Okay"
 britain_md.16.a: "Un golpe suave, no buscaremos más control"
 britain_md.16.b: "Un golpe duro, vamos a empujar por un estado satélite"
 britain_md.17.a: "Bien."
 britain_md.18.a: "Shit"
 britain_md.19.a: "Bien."
 britain_md.20.a: "Como se espera"
 britain_md.21.a: "¡Tonterías! ¿Pero qué podemos hacer?"
 britain_md.21.b: "¡Tonterías! ¡Mobilice el ejército!"
 britain_md.22.a: "No hay vuelta atrás ahora"
 britain_md.22.b: "Espera, ¿y si lo devolvemos?"
 britain_md.23.a: "¿No temes ir a controlarte?"
 britain_md.24.a: "Ambiciones para Inglaterra"
 britain_md.24.b: "Gran Bretaña para adelante, no para atrás"
 britain_md.24.c: "Una futura feria para todos"
 britain_md.24.a1: "Es hora de sentido común."
 britain_md.24.b1: "¿Estás pensando lo que estamos pensando?"
 britain_md.24.c1: "Invitación al Gobierno de Gran Bretaña"
 britain_md.25.a: "¡Vamos!"
 britain_md.26.a: "Enfoque sobre la integración de las islas"
 britain_md.26.b: "Debemos empujar hacia el oeste."
 britain_md.26.c: "Devuelve las islas"
 britain_md.27.t: "Gran Bretaña devuelve a las Malvinas"
 britain_md.27.d: "En un giro astrónomo impactante de los acontecimientos, el [ENG.GetName], un estado que nos combatió por las Malvinas en los años 80 ha decidido devolver las islas a nuestro control. No sabemos lo que provocó esto, o por qué han hecho esto, pero ya tenemos fuerzas moviéndose hacia la isla para ser estacionadas. El gobierno británico ha declarado que el movimiento es un intento de «relacionar las relaciones» con nosotros y la mayor región sudamericana."
 britain_md.27.a: "¡Suena bien con nosotros!"
 britain_md.28.t: "Operación de Cambio de Régimen Éxito en Zimbabwe"
 britain_md.28.d: "Tras una operación para derrocar al dictador de Zimbabwe, nuestras fuerzas han instalado el partido Movimiento por el Cambio (MDC). Esto viene siguiendo una extensa planificación y una operación de unidades de fuerzas especiales británicas para derrocar el régimen de larga data en el país."
 britain_md.28.a: "Bien, no esperábamos nada menos."
 britain_md.29.t: "[ENG.GetName] ¡Conduce un Coup!"
 britain_md.29.d: "Parece que el [ENG.GetName] ha llevado a cabo una operación encubierta en nuestro país que ha dado lugar al derrocamiento de nuestro régimen anterior, y la instalación de un nuevo gobierno. Las fuerzas militares fueron contactadas de antemano e incluso allanaron el camino para que las fuerzas británicas entraran en el país sin darse cuenta."
 britain_md.29.a: "¿Qué?"
 britain_md.30.t: "Aproximación a la Operación Dividente Oriental"
 britain_md.30.d: "Los egipcios actualmente tienen control completo sobre el Sinaí, con enfrentamientos ocasionales con los israelíes a lo largo de los años. Sin embargo, nuestra nación está en necesidad desesperada de rutas comerciales más eficientes, y los impuestos que hemos estado recibiendo con cada vez que pasamos por el Suez ha comenzado a ir más allá de la comprensión. Tendremos que hacer un trato con los egipcios o nos veremos obligados a tomar nuevas medidas."
 britain_md.30.a: "Empecemos las negociaciones"
 britain_md.30.b: "No hay tiempo para las negociaciones, entrar"
 britain_md.31.t: "Gran Bretaña pide el control conjunto del Sinaí"
 britain_md.31.d: "El gobierno británico ha enviado diplomáticos para saludar a nuestros ministros en [EGY.capital.GetCapitalVictoryPointName] para discutir la posibilidad de control conjunto en el Sinaí. Están sugiriendo que sus barcos y comerciantes han sido tratados demasiado injustamente, y que estar de acuerdo con esto demostrará que nuestro gobierno podría ser confiado."
 britain_md.31.a: "¡Todos los egipcios morirán antes de que hundimos al Sinaí!"
 britain_md.31.b: "Tal vez podamos arreglar algo..."
 britain_md.32.t: "Egipto rechaza las negociaciones"
 britain_md.32.d: "Los egipcios han declarado que no están interesados en negociar con nosotros sobre el control de los Suez, incluso si eso significa que estaremos dispuestos a darles grandes concesiones. No tenemos otra opción que considerar la intervención militar."
 britain_md.32.a: "Es hora de mudarse."
 britain_md.32.b: "Olvídalo."
 britain_md.33.t: "Egipto ofrece negociaciones"
 britain_md.33.d: "Los egipcios han acordado nuestras solicitudes de negociaciones sobre el Sinaí, y han pedido una suma de dinero que se pague por el acceso directo tanto militar como comercial a través del Sinaí con impuestos menores."
 britain_md.33.a: "Suena bien para nosotros"
 britain_md.33.b: "¿En serio? ¡Esto es un insulto!"
 britain_md.34.t: "Operación Divideo Oriental: En marcha"
 britain_md.34.d: "La operación Eastern Divide está actualmente en marcha, con tropas que han aterrizado en el Sinaí. Debemos comenzar la movilización de una mayor cantidad de fuerzas que permitirán una operación a gran escala."
 britain_md.34.a: "Go, go, go!"
 britain_md.35.t: "[FROM.GetName] Llama a la integración más profunda"
 britain_md.35.d: "El [ENG.GetName] ha pedido una integración más profunda, afirmando que al entregar un poco de nuestra soberanía, podremos reunir nuestras fuerzas y unir nuestra posición a la de un poder global una vez más. Aunque muchos de nuestros ciudadanos están preocupados por tal propuesta, la [ENG.GetName] ha demostrado en los últimos años un fuerte contendiente al superarnos en todos los sectores."
 britain_md.35.a: "Debemos unirnos."
 britain_md.35.b: "No entregaremos nuestra soberanía."
 britain_md.36.t: "[FROM.GetName] busca mayor integración"
 britain_md.36.d: "[FROM.GetName] ha señalado que está interesado en una integración más profunda, ofreciendo varias hojas de ruta para fusionar instituciones y cuerpos burocráticos centrales. Nuestros diploamts y burócratas están trabajando horas extraordinarias para garantizar una transición fluida, segura y estable."
 britain_md.36.a: "Bien."
 britain_md.37.t: "[FROM.GetName] Acelera la integración"
 britain_md.37.d: "Parece que el gobierno [FROM.GetAdjective] no está interesado en una mayor integración, sino que insiste en que nuestros recientes movimientos infringen su soberanía."
 britain_md.37.a: "Okay"
 britain_md.39.t: "Electing a Figurehead"
 britain_md.39.d: "Mientras comprendemos las implicaciones de dar alguna forma de poder a otro político, necesitamos reconocer la necesidad de un representante que apaciguará a las multitudes que están cansadas de un líder militar a cargo del estado. Encontraremos rápidamente a alguien que propicie como un títere que representará al estado."
 britain_md.39.a: "Pon a ese tonto Farage en"
 britain_md.39.b: "Encuentra dónde se esconde Griffin."
 britain_md.39.c: "¿Está Michael Holmes?"
 britain_md.39.d1: "El ejército nos servirá muy bien."
 british_flavor.1.t: "Nissan Seeks Expansión de fábrica cerca de Sunderland"
 british_flavor.1.d: "El fabricante japonés Nissan está tratando de expandir su fábrica en Sunderland para incluir su nueva generación de Almera Hatchbak y el Saloon, listo para ir a la venta pronto. Los funcionarios gubernamentales están cansados de que la expansión pueda hacer más difícil para las fábricas locales y los fabricantes domésticos competir."
 british_flavor.1.a: "Aprobarlo"
 british_flavor.1.b: "No, no podemos dejar que esto suceda."
 british_flavor.2.t: "Extradición de Augusto Pinochet"
 british_flavor.2.d: "Las pruebas médicas han llegado a la conclusión de que Augusto Pinochet, el ex dictador chileno no es adecuado para someterse al juicio. Como resultado de esta investigación, se han incrementado los llamados a deportar al ex dictador de regreso a su país natal de Chile, pero en respuesta a la multitud que busca su deportación, un grupo de personas están pidiendo su juicio continuo aquí en el Reino Unido."
 british_flavor.2.a: "Devuélvelo."
 british_flavor.2.b: "Se queda."
 british_flavor.3.t: "Solway Harvester Sinks"
 british_flavor.3.d: "El Solway Harvester ha sido reportado que se hundió de la costa de la Isla del Hombre en mares pesados. También se informa que todos los 11 tripulantes fueron asesinados, y se dice que el barco es recuperable pero gravemente dañado."
 british_flavor.3.a: "Nos preocuparemos más tarde."
 british_flavor.3.b: "Recuperar el cuerpo de la tripulación y preparar los funerales"
 british_flavor.4.t: "Ariana Afghan Airways Secuestrado"
 british_flavor.4.d: "Un grupo de secuestradores en Afganistán abordó un vuelo y lo obligó a venir el [ENG.GetName], haciéndolo aterrizar en Londres. Las autoridades se están preparando para enviar una pequeña fuerza para enfrentar a los secuestradores, pero lo que hacemos con ellos después no es conocido."
 british_flavor.4.a: "Arresto y luego deportarlos"
 british_flavor.4.b: "¡Arresten y luego envíenlos a juicio!"
 british_flavor.5.t: "Hostil Takeover of the NatWest Bank"
 british_flavor.5.d: "Un banco escocés está tratando actualmente de una toma hostil de un banco inglés, NatWest Bank. El Royal Bank of Scotland es actualmente el banco más pequeño de los dos, y su éxito depende en gran medida de otra oferta hecha por otro banco, el Banco de Escocia."
 british_flavor.5.a: "No es nuestro problema"
 british_flavor.5.b: "Guardar el banco"
 british_flavor.6.t: "BMW anuncia planes para vender el grupo Rover"
 british_flavor.6.d: "El fabricante de automóviles alemán BMW ha anunciado planes para vender el Grupo Rover, con el consorcio Alchemy con sede en Londres emergendo como el principal candidato para la toma. Si bien esta toma de posesión puede darnos más influencia en la escena automotriz, terminará en una responsabilidad adicional en una escena automotriz cada vez más frágil."
 british_flavor.6.a: "Bien con nosotros."
 british_flavor.6.b: "Tal vez deberían reconsiderar..."
 british_flavor.7.t: "David Trimble gana Liderazgo Elección del partido sindicalista de Ulster"
 british_flavor.7.d: "David Trimble ha ganado las elecciones de liderazgo para el Partido Unionista Ulster, un partido político Pro-Union y el tercer partido más antiguo de Gran Bretaña. Su victoria se celebra entre los conservadores, mientras que aquellos que desean mayor autonomía son indiferentes a los resultados o molestos, como siempre."
 british_flavor.7.a: "Felicitaciones al ganador"
 british_flavor.8.t: "Ley de inmigración y asilo"
 british_flavor.8.d: "Actualmente se está debatiendo la Ley de inmigración y asilo, y si es aprobada, significará que todos los refugiados y migrantes tienen derecho a vales para sufragar el costo de alimentos y ropa. Vetoing esto puede ser un poco inhumano, pero en última instancia resultará en mayores costos para el contribuyente británico."
 british_flavor.8.a: "Aprobarlo"
 british_flavor.8.b: "Veto."
 british_flavor.9.t: "Riot anticapitalista en la plaza del Parlamento"
 british_flavor.9.d: "Los motines anticapitalistas han salido a las calles y han defraudado una estatua del ex Primer Ministro británico, Winston Churchill. Los disturbios están siendo apodados los disturbios del 'Día de Mayo', y las multitudes no parecen estar dispersando pronto. Algunos están pidiendo acción, mientras otros sugieren que se cansan y se van a casa eventualmente."
 british_flavor.9.a: "Lo esperaremos."
 british_flavor.9.b: "Envíe a los equipos de limpieza y la policía"
 british_flavor.10.t: "[ENG.GetLeader] es abucheado en el Women's Institute"
 british_flavor.10.d: "[ENG.GetLeader] fue recibido con una recepción hostil en el Instituto de la Mujer, donde fue acurrucado y ralentizado por miembros enojados. Esta recepción avergonzada ha dado lugar a discusiones entre los miembros del partido, y los miembros del público para cuestionar aspectos de nuestro liderazgo."
 british_flavor.10.a: "Ignoralo."
 british_flavor.10.b: "Responder a las críticas"
 british_flavor.11.t: "Escocia trata de recuperar la sección 28"
 british_flavor.11.d: "El Parlamento escocés está tratando de derogar el polémico artículo 28 de la Ley del Gobierno Local de 1988, que impide a las autoridades locales «mujeres parpadeantes». Permitirles derogar esta ley puede dar lugar a llamamientos para que también la deroguen en otros lugares, causando inestabilidad política."
 british_flavor.11.a: "Deténganlos."
 british_flavor.11.b: "No nos importa."
 british_flavor.12.t: "Alex Salmond Resigns de la SNP"
 british_flavor.12.d: "Alex Salmond ha renunciado a su papel de liderazgo en el Partido Nacional Escocés para disputas sobre las estrategias financieras internas del partido. Su renuncia nos ha dado la oportunidad de atacar al SNP mientras que son débiles, permitiendo una mayor división para takle place amognst sus filas."
 british_flavor.12.a: "Lo mejor es que no hagamos nada"
 british_flavor.12.b: "Lanzamiento de un ataque político"
 british_flavor.13.t: "El Octavo Final"
 british_flavor.13.d: "Como parte del Proceso de Paz de Irlanda del Norte, se han adoptado disposiciones para poner en libertad a los 80 presos finales detenidos en la cárcel de Maze. Estos prisioneros eran miembros del Ejército de Liberación Nacional Irlandés, o han tenido fuertes vínculos con ellos, con un incidente ocurrido en 1997 donde estos presos mataron y dispararon a un líder de la fuerza voluntaria lealista."
 british_flavor.13.a: "Tal vez los mantengamos.."
 british_flavor.13.b: "Bien, entonces se van."
 british_flavor.14.t: "Rompiendo en la finca Paulsgrove"
 british_flavor.14.d: "En la finca Paulsgrove, en Portsmouth, han estallado ríos después de que más de 100 personas sitiaran un bloque de pisos que supuestamente albergaban a un menor condenado. Esto es lo último en violencia vigilante contra presuntos delincuentes sexuales desde el comienzo de la campaña «nombrar y avergonzar» por parte de la organización News of the World."
 british_flavor.14.a: "Bueno, nada que pudiéramos hacer allí"
 british_flavor.14.b: "Enviar a la policía"
 british_flavor.15.t: "Protestas de combustible Erupción"
 british_flavor.15.d: "Los manifestantes han bloqueado la entrada a las refinerías de petróleo en un intento de protestar por los altos precios del combustible. Los motoristas comenzaron a comprar petróleo que está empezando a provocar una escasez nacional de combustible y una constante subida en los precios del petróleo. Se informa que un gran número de estaciones de gasolina están empezando a cerrar como resultado de la situación, y el gobierno se está esforzando por encontrar una solución."
 british_flavor.15.a: "Culpar las industrias de combustible fósil"
 british_flavor.15.b: "Obligaciones estrictas de uso del petróleo"
 british_flavor.15.c: "§RNo hagas nada§!"
 british_flavor.151.t: "Disturbios en Lieu de Inacción del Gobierno"
 british_flavor.151.d: "Parece que nuestra falta de determinación en la fijación de la escasez de combustible sólo ha alimentado más ira, y cada vez más personas se van a las calles exigiendo una resolución del gobierno. Como está en pie, los manifestantes marchan hacia edificios gubernamentales y vandalizar estatuas, edificios y símbolos del gobierno."
 british_flavor.151.a: "¡Lo intentamos!"
 british_flavor.152.t: "Llamadas para el cambio de crecimiento más fuerte"
 british_flavor.152.d: "Parece que la resolución de los pueblos sólo se ha fortalecido, y el odio y el enojo se dirigen a [ENG.GetLeader] y al establecimiento gobernante. Además, han aumentado los llamamientos a la reubicación de fondos reales para ayudar a las subvenciones al combustible, y algunos incluso piden que la monarquía se avergüence."
 british_flavor.152.a: "Ridiculous!"
 british_flavor.153.t: "Casa de los Comunes Conjunto sobre el Fuego"
 british_flavor.153.d: "Se ha declarado un estado de emergencia, ya que las protestas y los disturbios han dado un giro dramático hacia la anarquía directa en lugar de la desobediencia civil organizada. La Cámara de los Comunes fue puesta en llamas por manifestantes enojados, ya que la policía no pudo contener a las mafias enojadas. Hay informes de que los manifestantes están planeando marchar hacia otras instituciones estatales, sin embargo no está claro quién será el próximo objetivo."
 british_flavor.153.a: "Oh lord"
 british_flavor.154.t: "¡Los Abdicatos Reina!"
 british_flavor.154.d: "A la luz del reciente levantamiento y de los continuos fracasos gubernamentales, la Reina ha declarado oficialmente que estará abdicando y está planeando abordar la nación en un discurso formal más adelante esta tarde. Aunque muchos están tristes de que ella se vaya, todavía no está claro si será reemplazada o no, ya que el odio hacia la monarquía sólo ha crecido más fuerte desde el comienzo de las protestas."
 british_flavor.154.a: "Adiós a la corona de joyas y al vestido de terciopelo"
 british_flavor.155.t: "[ENG.GetLeader] Renuncias sin éxito claro"
 british_flavor.155.d: "[ENG.GetLeader] ha dimitido, siendo su partido incapaz de localizar rápidamente un reemplazo adecuado. Este estado de anarquía ha dejado al país en desorden, confusión y vulnerabilidad. Nunca Gran Bretaña ha enfrentado una crisis así, y el gobierno ha demostrado que está inepto en sus capacidades para resolver cualquier cosa en este momento."
 british_flavor.155.a: "¿Qué pasa después?"
 british_flavor.156.t: "Control militar incautado"
 british_flavor.156.d: "Las Fuerzas Armadas Británicas han declarado su participación directa en el restablecimiento de la autoridad, con un vocero anunciando que cualquier persona que viole un toque de queda de 4PM será «muerto con rapidez» y declaró que todo lo que pretenden hacer será para 'el mayor bien de todos los británicos'. Esto ha provocado la indignación entre los miembros del Partido Laborista y el partido conservador, llamando a esta toma de poder una usurpación del poder, con algunos incluso denunciando el movimiento como un cambio radical hacia la dictadura. Sin embargo, los políticos han demostrado su incapacidad para resolver asuntos estatales, sin un sucesor claro tras la renuncia de [ENG.GetLeader]."
 british_flavor.156.a: "¿Qué espera el futuro?"
 british_flavor.157.t: "Estado de Asuntos del Nuevo Gobierno"
 british_flavor.157.d: "Dirigido a su excelencia, [ENG.GetLeader],\nFecha:[GetDateText]\n\nAsunto I: Estado de orden\nSu excelencia, las Fuerzas Armadas Británicas han asegurado rápidamente el control de grandes áreas urbanas como Londres, Birmingham, Manchester y Liverpool entre otros. Por ahora al menos, parece que la gente está empezando a dispersarse lentamente de sus multitudes y están comenzando a regresar a casa ya que hemos comenzado a establecer subsidios petroleros financiados por el gobierno y programas para ayudar al país a ponerse de pie.\n\nTema II: Llamadas de la izquierda & Bien.\nTrabajo & Los políticos conservadores han comenzado a pedir a nuestra administración de emergencia que inicie el proceso necesario para restablecer el gobierno democrático en el país, con algunos polticianos declarando al nuevo gobierno un símbolo del autoritarismo y la sobre-reach militar. Un político laborista incluso declaró que «los hombres con armas necesitan permanecer en sus bases, y los hombres con plumas deben reanudar su deber como funcionarios».\n\nTema III: Consolidación ulterior\nNuestros hombres han comenzado a encontrar políticos y burócratas que estaban descontentos con el viejo sistema, instándoles a venir a servir en lugar de los antiguos políticos del sistema bipartidista. Aprovechar la autoridad de esta manera casi seguro equiparará a un conflicto nacional de tipos, sin embargo como se afirma no tenemos otros medios para consolidar nuestro control."
 british_flavor.157.a: "Es bueno saberlo."
 british_flavor.16.t: "Conservadores en las encuestas"
 british_flavor.16.d: "Los partidarios del partido conservador celebran después de descubrir que los Tories están a punto de adelantarse al trabajo el 38% en una encuesta de opinión MORI. Esto ha marcado la primera vez que los conservadores han dirigido al Partido Laborista en una encuesta de opinión nacional desde 1993. "
 british_flavor.16.a: "Okay"
 british_flavor.17.t: "Terremoto Rocks Warwickshire"
 british_flavor.17.d: "Un terremoto ha golpeado al condado ceremonial de Warwickshire, causando algunos daños a edificios cercanos. Hay llamamientos a la asistencia del Gobierno para ayudar a reconstruir algunos de los edificios dañados, pero recientemente el presupuesto del gobierno sólo se ha hecho más estricto y más estricto, lo que hace difícil que Westminster llegue a una conclusión coherente."
 british_flavor.17.a: "Tendremos que esperar que todo esté bien"
 british_flavor.17.b: "Autorizar la ayuda gubernamental"
 british_flavor.18.t: "Donald Dewar Rushed al Hospital"
 british_flavor.18.d: "Donald Dewar, primer ministro de Escocia, ha sido llevado al hospital después de una caída fuera del Bute House, su residencia oficial en Edimburgo. Su salud se está deteriorando rápidamente y hay un aumento de los llamados a la intervención del gobierno para traer equipos médicos avanzados."
 british_flavor.18.a: "Rezad por su recuperación"
 british_flavor.18.b: "Autorizar equipos médicos avanzados para ir a su ayuda"
 United_Kingdom_News.2.t: "Disturbios en el Reino Unido"
 United_Kingdom_News.2.d: "Tras una gran escasez de combustible y un aumento en los precios del gas, las autoridades británicas optaron por esperar la escasez con la esperanza de que la economía retrocediera por sí misma naturalmente. Sin embargo, la situación no mejoró, sino que sólo empeoró con la situación en última instancia saliendo de control a principios de esta semana cuando los manifestantes incendiaron la Cámara de los Comunes. Las autoridades británicas han afirmado que no son responsables de la escasez y están declarando que el problema es meramente natural y pasará. Un manifestante dijo que: «¡No tengo combustible para poner en mi coche! No tengo medios para trabajar, y no tengo calefacción en mi casa para mantener a mi familia caliente, lo que está sucediendo hoy es el resultado de un sistema ineficaz y gobierno.\nEl gobierno ha insistido en que está haciendo todo lo posible para mitigar la situación, pero como está, las protestas no van a ninguna parte."
 United_Kingdom_News.2.a: "La ira erupta una vez más"
 United_Kingdom_News.3.t: "Reina Isabel II Abdicada"
 United_Kingdom_News.3.d: "En lugar de acontecimientos recientes, la Reina del Reino Unido, Isabel II ha anunciado su abdicación oficial desde el trono. Esto viene cuando los manifestantes comenzaron a exigir un fin a la monarquía, asociando con símbolos de corrupción, codicia y pozos de dinero. Más específicamente esta vez alrededor de la ira fue dirigida a la monarquía porque la gente exigió dinero para aliviar los subsidios del gobierno, sus llamadas sin embargo cayeron en oídos sordos en Westminster. Se desconoce si otro rey ascenderá o no al trono, pero como está ahora mismo, la monarquía sólo puede permanecer de pie y ver como el país se quema."
 United_Kingdom_News.3.a: "El trono se desmorona"
 United_Kingdom_News.4.t: "Fuerzas Armadas Británicas apoderan el control de Londres"
 United_Kingdom_News.4.d: "Las Fuerzas Armadas Británicas han declarado su participación oficial en la ejecución del estado de emergencia establecido por mandato estatal, y ellos declaran explícitamente que cualquier persona que viole el toque de queda de 4PM será tratada con 'swiftly'. Esto viene después de semanas de protestas y disturbios en el Reino Unido, con los manifestantes que han puesto la Cámara de los Comunes en su forma de rabia. Aún no se conocen las intenciones de este nuevo órgano administrativo, pero al parecer cabe con hombres militares fuertes que tienen la intención de reducir el poder que el Partido Laborista y Conservador mantiene en el establecimiento británico."
 United_Kingdom_News.4.a: "¿Es este el fin del Reino Unido?"
 ENG_inner_circle.01.t: "El Levántate de [GetAscendingAdvisorName]"
 ENG_inner_circle.01.desc: "[GetAscendingAdvisorName] ha mostrado una fuerte ambición y ha ampliado silenciosamente su influencia dentro de la Casa Real. Sin embargo, cada paso hacia una mayor autoridad ha suscitado objeciones de otros cortesanos y personalidades mayores, y el palacio ahora se humea con una lucha familiar por el acceso y la precedencia. La pregunta es si [GetAscendingAdvisorName] ha impresionado a la Reina lo suficiente como para ganar un lugar verdadero dentro del Círculo Interior de la Reina."
 ENG_inner_circle.01.a: "Reemplazar [ENGGetAscendedAdvisorName1]"
 ENG_inner_circle.01.b: "Reemplazar [ENGGetAscendedAdvisorName2]"
 ENG_inner_circle.01.c: "Reemplazar [ENGGetAscendedAdvisorName3]"
 ENG_inner_circle.01.d: "[GetAscendingAdvisorName] no es digno."
 ENG_inner_circle_charles.03.t: "Visita de la Armonía del Príncipe"
 ENG_inner_circle_charles.03.desc: "El Príncipe de Gales ha llegado a una visita, mezclando la diplomacia cortesana con un claro mensaje sobre la administración ambiental. Las reuniones con altos funcionarios y líderes de la sociedad civil se han centrado en restablecer la confianza, ampliar la cooperación práctica y definir la resiliencia climática como un interés estratégico compartido más que un punto de conversación."
 ENG_inner_circle_charles.03.a: "Que la armonía guíe nuestras relaciones."
 ENG_inner_circle_charles.04.t: "El Príncipe Carlos defiende la protección de la selva tropical"
 ENG_inner_circle_charles.04.desc: "Nos han informado de que Su Alteza Real el Príncipe Carlos, Príncipe de Gales, ha pedido un aumento de la acción mundial para proteger los bosques tropicales. Como fundador del Proyecto Rainforests del Príncipe, ha utilizado su influencia para trabajar con gobiernos, empresas y sociedad civil para destacar la importancia de detener la deforestación y preservar estos ecosistemas críticos para la estabilidad climática y la biodiversidad."
 ENG_inner_circle_charles.04.a: "Damos la bienvenida al Príncipe Carlos sobre protección de la selva tropical"
 ENG_inner_circle_charles.05.t: "Diplomacia Ambiental de Prince Charles"
 ENG_inner_circle_charles.05.desc: "Hemos recibido noticias de que Su Alteza Real el Príncipe Carlos, Príncipe de Gales, ha completado una gira de diplomacia ambiental en nuestro país, abogando por la cooperación en materia de clima, sostenibilidad y resiliencia ecológica. Como una de las voces más antiguas para la acción ambiental a lo largo de décadas, el Príncipe destacó la necesidad de esfuerzos colectivos en todas las naciones y sectores para hacer frente a los desafíos ambientales mundiales y promover soluciones sostenibles."
 ENG_inner_circle_charles.05.a: "Apoyar la sostenibilidad."
 ENG_inner_circle_charles.06.t: "Prince Charles promueve la agricultura ecológica"
 ENG_inner_circle_charles.06.desc: "Hemos aprendido que Su Alteza Real el Príncipe Carlos, Príncipe de Gales, ha tomado medidas activas para apoyar el desarrollo de la agricultura orgánica y sostenible en nuestra nación. Basándose en décadas de trabajo pionero sobre métodos agrícolas orgánicos en Highgrove y Duchy Home Farm, destacó los beneficios ambientales y sociales de las prácticas orgánicas y alentó la cooperación en la sostenibilidad agrícola."
 ENG_inner_circle_charles.06.a: "Apoyar la agricultura sostenible."
 ENG_inner_circle_andrew.04.t: "Príncipe Andrés en el comercio Misión"
 ENG_inner_circle_andrew.04.desc: "Su Alteza Real el Príncipe Andrés, actuando como representante comercial del Reino Unido, visitó nuestra nación para promover vínculos comerciales más fuertes y cooperación económica. Durante su misión se comprometió con funcionarios gubernamentales, líderes empresariales e inversores potenciales para destacar oportunidades de comercio e inversión que benefician tanto a nuestra economía como a la del Reino Unido."
 ENG_inner_circle_andrew.04.a: "Welcome"
 ENG_inner_circle_andrew.05.t: "Acuerdo de Comercio concertado"
 ENG_inner_circle_andrew.05.desc: "Nos complace informar que, tras las recientes deliberaciones y negociaciones dirigidas por Su Alteza Real el Príncipe Andrés, Duque de York, se ha concertado un nuevo acuerdo comercial entre nuestra nación y el Reino Unido. El acuerdo abre vías para aumentar el intercambio comercial, la cooperación en industrias clave y el beneficio económico mutuo, reflejando los intereses compartidos y fortaleciendo los vínculos entre nuestras economías."
 ENG_inner_circle_andrew.05.a: "De acuerdo con la asociación."
 ENG_military.045.t: "Solicitud de Asociación Estratégica de Gran Bretaña"
 ENG_military.045.d: "El Reino Unido, encabezado por un monarca constitucional y comprometido con la cooperación occidental, ha solicitado oficialmente el estatuto de Major Non-NATO Ally. Conceder esto mejoraría las relaciones transatlánticas y aseguraría un socio clave en Europa."
 ENG_military.045.a: "Aprobar su solicitud, un valioso aliado."
 ENG_military.045.b: "Decline, debemos ser cautelosos con tales designaciones."
 ENG_integrate_ireland: "Integrar [IRE.GetFlag] Irlanda"
 ENG_integrate_ireland_desc: "Tras décadas, por fin hemos sometido e integrado las tierras de Irlanda; ya es hora de formalizar el proceso de integración."
 ENG_a_more_united_kingdom_decisions: "Uniendo el Reino"
 ENG_a_more_united_kingdom_decisions_desc: "Tras el declive gradual del Imperio Británico y la descolonización durante la Guerra Fría, nuestro reino ha sufrido un declive constante. Con medios diplomáticos y un crecimiento hegemónico, podremos reunir de nuevo nuestro reino.\n\nPasa el cursor sobre el texto de color para más información."
 ENG_core_objectives_text: "Objetivos básicos"
 ENG_econ_hegemony_text: "Hegemonía económica"
 ENG_military_hegemony_text: "Hegemonía Militar"
 ENG_political_hegemony_text: "Hegemonía política"
 ENG_declare_economic_hegemony: "Declarar Hegemonía Económica"
 ENG_declare_economic_hegemony_desc: "Ha llegado el momento de declararnos el Hegemon Económico del Commonwealth."
 ENG_declare_military_hegemony: "Declarar Hegemonía Militar"
 ENG_declare_military_hegemony_desc: "Ha llegado el momento de declararnos el Hegemon Militar del Commonwealth."
 ENG_declare_political_hegemony: "Declarar la hegemonía política"
 ENG_declare_political_hegemony_desc: "Ha llegado el momento de declararnos el Hegemon Político del Commonwealth."
 ENG_fractured_kingdom_united_state_decisions: "La siguiente era"
 ENG_fractured_kingdom_united_state_decisions_desc: "Con el surgimiento de un nuevo régimen en [ENG.GetFlag] Gran Bretaña, podremos finalmente extender nuestra influencia hacia fuera rápidamente, rápida y agresivamente.\n\nSeremos capaces de establecer una organización PMC bajo nuestro comando para causar estragos en el mundo."
 ENG_grant_land_in_isle_of_man: "Transformar la Isla del Hombre"
 ENG_grant_land_in_isle_of_man_desc: "Pese a su importancia histórica, la Isla de Man hoy nos sirve de muy poco fuera de la extracción de recursos. Sin embargo, si cedemos esta tierra a nuestra nueva organización PMC, podrá aprovechar todo su potencial y usarla como posible base desde la que operar."
 ENG_devolved_matters: "Cuestiones debatidas"
 ENG_devolved_matters_desc: "Nuestros estados constituyentes han presionado por un §HEstado más descentralizado§! para obtener una independencia nominal o plena. Los tres estados principales son [SCO.GetFlag] §HEscocia§!, [NIR.GetFlag] §HIrlanda del Norte§! y [WAS.GetFlag] §HGales§!.\n\nSi el estado de nuestra nación empeora, los constituyentes intentarán aprobar proyectos de ley que reduzcan su dependencia, y podemos vetarlos con el riesgo de aumentar su agitación.\n\nLas decisiones se irán habilitando a medida que avance la devolución, y hay más información en la interfaz de devolución situada abajo a la derecha de la pantalla, representada por la pieza de rompecabezas.\n\nPróxima elección de constituyentes: [?ROOT.ENG_election_var|Y0] mes(es)"
 ENG_appease_scotland: "Subvenciones dirigidas a Escocia [SCO.GetFlag]"
 ENG_appease_nireland: "Subvenciones dirigidas a [NIR.GetFlag] Irlanda del Norte"
 ENG_appease_wales: "Subvenciones dirigidas para [WAS.GetFlag] Gales"
 ENG_doing_other_decision: "Hacer otra decisión"
 ENG_welsh_referendum: "[GetYear] [WAS.GetFlag] Referendum Welsh para la Independencia"
 ENG_welsh_referendum_desc: "El [WAS.GetFlag] pueblo galés votará sobre un referéndum que determinará su futuro como nación, constitutiva y jugador en las Islas Británicas. La campaña funciona hasta el día de las encuestas, y el resultado será cualquiera que sea la opinión de Welsh se ha convertido para el momento en que se cuenta. Westminster puede gastar capital político y dinero del Tesoro para moverlo.\n\nVotar para salir de la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_release_scotland: "Aprobar el Referéndum de Independencia de Escocia de [GetYear] [SCO.GetFlag]"
 ENG_release_scotland_desc: "«¡Escocia para siempreeeeeee!»\n\nQuizá vetamos con demasiada prisa el intento anterior de referéndum; podemos revertir ese error."
 ENG_release_ireland: "Aprobar el Referéndum de Independencia de Irlanda del Norte de [GetYear] [NIR.GetFlag]"
 ENG_release_ireland_desc: "Quizá vetamos con demasiada prisa el intento anterior de referéndum; podemos revertir ese error."
 ENG_release_wales: "Aprobar el Referéndum de Independencia de Gales de [GetYear] [WAS.GetFlag]"
 ENG_release_wales_desc: "Quizá vetamos con demasiada prisa el intento anterior de referéndum; podemos revertir ese error."
 decisions_ENG: "[ENG.GetName] Decisiones"
 decisions_ENG_desc: "Aquí el gobierno puede poner en marcha misiones y tomar acciones decisivas para guiar el rumbo de Gran Bretaña: apoyar la industria, orientar la investigación, fortalecer las regiones y responder a las cambiantes necesidades de la nación."
 falkland_policy: "Política de Falkland"
 denounce_status_as_the_commonwealth_of_nation_member: "§YDenuncie§! Estado Miembro del Commonwealth de las Naciones"
 denounce_status_as_the_commonwealth_of_nation_member_desc: "Romper con vínculos anticuados. Denunciar la pertenencia a la Commonwealth y trazar un rumbo hacia la verdadera soberanía nacional. Reclamar tu destino. Forjar tu propio camino. La independencia aguarda."
 ENG_bankers_switch_faction: "Respaldar a los banqueros internacionales"
 ENG_bankers_switch_faction_desc: "Reaplazamos nuestras alianzas internas para favorecer la facción de los banqueros internacionales, inclinando la política hacia las finanzas globales, abrir flujos de capital y una economía dirigida por el servicio."
 ENG_scottish_parliament: "[SCO.GetFlag] Parlamento escocés"
 ENG_scottish_parliament_desc: "[SCO.GetFlag] Los parlamentarios escoceses no tienen, y no siempre serán leales a Londres. Habrá §HPro-Independencia§! Miembros del Parlamento que lucharán por la creación de una Escocia autónoma o independiente [SCO.GetFlag].\n\nSi el §HPro-Independencia§! Los miembros del Parlamento tienen la mayoría, comenzarán a aprobar proyectos de ley para otorgarles más autonomía que podamos aprobar o vetar. Si aceptamos sistemáticamente sus peticiones, tendremos un estado respetuoso y leal [SCO.GetFlag] escocés Constituyente. Pero si repetidamente negamos sus peticiones, su §Hagitación§! puede resultar en una situación muy desordenada. Si [SCO.GetFlag] §H La agitación escocesa§! llega §H100§!, entonces exigirán la independencia.\n\n§H Asientos de independencia§!: [?ENG_scottish_nationalists]/129\n\n[SCO.GetFlag] §H Agitación escocesa§!: [?ENG_scottish_agitation]"
 ENG_invest_northern_ireland_mission: "Invertir en el regreso de la construcción en Irlanda del Norte"
 ENG_ireland_border_cooperation: "Tratado de cooperación fronteriza con Irlanda"
 ENG_clydach_nickel_decision: "Modernizar la refinería de níquel de Clydach"
 ENG_clydach_nickel_decision_desc: "Actualizamos la refinería de níquel Clydach en el sur de Gales, ampliando la capacidad para los metales de batería y aleaciones de alta calidad para fortalecer nuestro suministro de minerales críticos."
 ENG_alloys_modernisation: "Modernizar la producción de aleación"
 ENG_alloys_modernisation_desc: "Invertimos en nuevas fundiciones y líneas de rodadura para aleaciones especializadas, mejorando la calidad y el rendimiento para todo desde turbinas y placa de armadura hasta componentes de alto rendimiento."
 ENG_ellesmere_port_decision: "Planta de imanes de tierras raras de Ellesmere Port"
 ENG_ellesmere_port_decision_desc: "Ampliamos el procesamiento de tierras raras en Ellesmere Port, produciendo imanes de alta calidad para turbinas eólicas, vehículos eléctricos y sistemas avanzados de defensa."
 ENG_shetland_hydrocarbon_decision: "Oeste de Shetland Hydrocarbon Push"
 ENG_shetland_hydrocarbon_decision_desc: "Aumentamos el desarrollo de campos de petróleo y gas al oeste de Shetland, aprovechando las reservas de aguas profundas para aumentar los hidrocarburos nacionales y la seguridad energética."
 ENG_rosebank_field_decision: "Desarrollar el yacimiento petrolero de Rosebank"
 ENG_rosebank_field_decision_desc: "El desarrollo pleno de la luz verde del campo de petróleo y gas Rosebank, trayendo nuevas plataformas y tuberías offshore en línea para fortalecer nuestros suministros energéticos a largo plazo."
 ENG_cambo_offshore_decision: "Desarrollar el yacimiento marino de Cambo"
 ENG_cambo_offshore_decision_desc: "Avanzamos con el proyecto Cambo offshore, añadiendo nuevos pozos y submarinas para llevar sus reservas de petróleo y gas a la producción."
 ENG_hornsea_wind_farm_decision: "Ampliar el parque eólico Hornsea"
 ENG_hornsea_wind_farm_decision_desc: "Retrocedemos más fases de la zona eólica offshore de Hornsea en el Mar del Norte, añadiendo turbinas y rejillas para ofrecer más energía limpia de la mayor granja eólica del mundo."
 ENG_drakeland_tungsten_decision: "Reabrir la mina de wolframio de Drakelands"
 ENG_drakeland_tungsten_decision_desc: "reiniciamos la mina de Drakelands cerca de Plymouth, trayendo la producción de estaño y tungsteno en línea para fortalecer el suministro británico de metales tecnológicos críticos."
 ENG_south_crofty_tin_decision: "Reabrir la mina de estaño de South Crofty"
 ENG_south_crofty_tin_decision_desc: "Financiamos la reapertura de South Crofty en Cornwall, reviviendo la minería profunda de estaño y agregando una fuente interna constante de mineral de alta calidad para nuestra industria."
 ENG_scottish_industry_mission: "Caída de la industria escocesa"
 ENG_scottish_industry_mission_desc: "Nuestras inversiones en el acero y la industria pesada escocesa pueden desbloquear nuevos filones, contratos y proyectos derivados. Hay una buena probabilidad de que la actividad renovada en las acerías y astilleros revele recursos adicionales que podemos poner en producción."
 ENG_celsa_steel_mission: "Revisión de la producción de acero de Celsa"
 ENG_celsa_steel_mission_desc: "Cada año revisamos el taller de Celsa en Cardiff para ver si nuevos pedidos, mejoras de eficiencia o flujos de chatarra justifican un nuevo escalón en la producción de acero."
 ENG_roysth_naval_port_decision: "Ampliar el puerto naval de Rosyth"
 ENG_roysth_naval_port_decision_desc: "Ampliamos los muelles y las instalaciones de apoyo en Rosyth, convirtiendo el estuario Forth en una base más fuerte para la construcción de refit, soporte y futuros buques de guerra."
 ENG_expand_belfast_decision: "Ampliar el polígono industrial de Belfast"
 ENG_expand_belfast_decision_desc: "Limpiamos y damos servicio a nuevas parcelas alrededor de los muelles y las afueras de Belfast, abriendo espacio extra para fábricas, patios y oficinas en toda Irlanda del Norte."
 ENG_highland_main_line_decision: "Actualizar la línea principal de Highland"
 ENG_highland_main_line_decision_desc: "Actualizamos la Línea Principal de Highland entre Perth e Inverness, cortando los tiempos de viaje y dando a las ciudades a lo largo de la ruta un impulso muy necesario en conectividad y productividad."
 ENG_titanic_quarter_decision: "Desarrollar el Titanic Quarter"
 ENG_titanic_quarter_decision_desc: "Recorrimos el antiguo astillero de Belfast aterriza en el barrio Titanic, mezclando oficinas, estudios e industrias frente al agua para respirar nueva vida en el viejo Harland & Wolff sitio."
 ENG_productivity_gap_mission: "Perder la productividad"
 ENG_hs2_mission: "Construcción de la Alta Velocidad 2"
 ENG_northen_powerhouse_mission: "Construcción del Northern Powerhouse Rail"
 ENG_build_london: "Desarrollo de Greater London"
 ENG_build_london_desc: "Prometimos a nuestros constituyentes en el área del Gran Londres que vienen las renovaciones. Y como tal, debemos cumplir con esta promesa."
 ENG_promise_labour: "Promesa a los sindicatos"
 ENG_promise_labour_desc: "Hemos hecho una promesa a los sindicatos, y debemos actuar en consecuencia."
 ENG_promise_military: "Promesa al complejo militar-industrial"
 ENG_promise_military_desc: "Hemos hecho una promesa al complejo industrial militar, y debemos actuar en consecuencia."
 ENG_promise_fossil_fuel: "Promesa a las industrias de combustibles fósiles"
 ENG_promise_fossil_fuel_desc: "Hemos hecho una promesa a las industrias de combustibles fósiles, y debemos actuar en consecuencia."
 ENG_monarchy_decision_category: "Casa de Windsor"
 ENG_monarchy_decision_category_desc: "La Casa de Windsor ha gobernado desde 1917, llevando la monarquía moderna a través de la guerra, el cambio social y las presiones de un nuevo siglo. Se encuentra en el centro de la vida pública británica, una dinastía tejida en ceremonia, servicio y las rutinas silenciosas que mantienen el reino unido. Sus miembros ejercen influencia a través del patrocinio, las visitas y la intervención discreta, llegando a las organizaciones benéficas, la diplomacia y las fuerzas armadas de manera que la política por sí sola no pueda. Aquí se muestran los compromisos de la Familia Real, mostrando las iniciativas que cada real puede realizar y qué su presencia puede poner en marcha."
 ENG_monarchy: "Casa de Windsor"
 ENG_charles_youth_sustainability_decision: "Empoderar a la juventud para la sostenibilidad"
 ENG_charles_youth_sustainability_decision_desc: "Su Alteza Real el Príncipe Carlos lanzará un programa para apoyar a los jóvenes en el liderazgo de iniciativas sostenibles y respetuosas con el clima. A partir de décadas de trabajo con organizaciones benéficas juveniles y causas ambientales, el Príncipe de Gales promoverá la educación, el desarrollo de habilidades y el emprendimiento alineados con la resiliencia ecológica. Este programa reconoce el papel vital de las generaciones más jóvenes en la construcción de un futuro más sostenible."
 ENG_charles_sustainable_urban_planning_decision: "Promover una planificación urbana sostenible"
 ENG_charles_sustainable_urban_planning_decision_desc: "Su Alteza Real el Príncipe Carlos defenderá una planificación urbana y comunitaria sostenible basada en principios de diseño integral que priorizan a las personas, el entorno y la resiliencia a largo plazo. A partir de su defensa de larga data de construir comunidades que respeten el clima y el contexto cultural, este programa promoverá enfoques tradicionales y sensibles al medio ambiente en la arquitectura, la infraestructura y el uso del suelo."
 ENG_charles_organic_agriculture_decision: "Promover la agricultura orgánica y sostenible"
 ENG_charles_organic_agriculture_decision_desc: "Su Alteza Real el Príncipe Carlos usará su influencia para defender los métodos de agricultura orgánica y sostenible en las comunidades rurales y globales. A partir de sus décadas de compromiso con la gestión ecológica y la agricultura regenerativa, el Príncipe promoverá prácticas que refuercen la salud del suelo, apoyen a las granjas familiares y reduzcan el impacto ambiental."
 ENG_charles_environmental_diplomacy_tour_decision: "Viaje de diplomacia ambiental"
 ENG_charles_environmental_diplomacy_tour_decision_desc: "Su Alteza Real el Príncipe Carlos emprenderá una gira de diplomacia ambiental internacional para promover la cooperación en iniciativas de sostenibilidad y clima. A lo largo de sus décadas de servicio como Príncipe de Gales ha visitado numerosas naciones y se ha reunido con líderes y comunidades para fomentar la acción contra el cambio climático, la protección de las selvas y el desarrollo sostenible. Esta gira buscará reforzar las asociaciones globales y destacar los compromisos compartidos de salvaguardar el mundo natural."
 ENG_charles_rainforest_help_decision: "Apoyo a la protección mundial de los bosques tropicales"
 ENG_charles_rainforest_help_decision_desc: "Su Alteza Real el Príncipe Carlos encabezará un programa para promover la acción mundial contra la destrucción de las selvas tropicales. Como fundador del Prince's Rainforests Project, trabajará con gobiernos, organizaciones y la sociedad civil para destacar la importancia de preservar las selvas y su papel en la lucha contra el cambio climático."
 ENG_charles_charities_network_decision: "Activar la red de organizaciones benéficas del Príncipe"
 ENG_charles_charities_network_decision_desc: "Su Alteza Real el Príncipe Carlos activará su amplia red de organizaciones benéficas para apoyar causas sociales, educativas y ambientales en el país y en el extranjero. Como presidente de The Prince's Charities, un grupo de organizaciones fundadas o patrocinadas por el Príncipe de Gales, aprovechará su experiencia colectiva para construir comunidades sostenibles, promover oportunidades y mejorar el bienestar en varias regiones."
 ENG_charles_harmony_tour_decision: "Realizar un Tour de Diplomacia en Armonía"
 ENG_charles_harmony_tour_decision_desc: "Su Alteza Real el Príncipe Carlos emprenderá una gira internacional para promover su filosofía de la Armonía y fomentar la cooperación en cuestiones ambientales y de sostenibilidad. A lo largo de sus décadas de servicio como Príncipe de Gales ha usado de forma constante su influencia para subrayar la necesidad de acción climática, protección de las selvas y desarrollo sostenible, y esta gira buscará reforzar las asociaciones globales en torno a estos objetivos comunes."
 ENG_andrew_naval_haritage_decision: "Abrazar el Patrimonio Naval"
 ENG_andrew_naval_haritage_decision_desc: "El príncipe Andrés se apoyará en su larga carrera naval para destacar las tradiciones y el servicio marítimos de su nación. Tras servir como piloto de helicóptero, instructor y comandante de la Marina Real con servicio activo en el conflicto de las Malvinas, fomentará el respeto por el patrimonio naval y la cooperación con flotas aliadas e instituciones de formación marítima de todo el mundo."
 ENG_andrew_trade_representive_decision: "Representante de comercio Misión"
 ENG_andrew_trade_representive_decision_desc: "El príncipe Andrés emprenderá una misión de representante comercial para promover los intereses comerciales británicos en el exterior. Apoyándose en su experiencia como Representante Especial del Reino Unido para el Comercio y la Inversión Internacionales, tratará con gobiernos extranjeros, empresarios e inversores para destacar oportunidades de exportación e inversión en el Reino Unido, y reforzará los lazos económicos y la cooperación en comercio y empresa."
 ENG_andrew_emerging_trade_agreement_decision: "Perseguir acuerdos comerciales emergentes"
 ENG_andrew_emerging_trade_agreement_decision_desc: "El príncipe Andrés encabezará esfuerzos para lograr acuerdos comerciales y asociaciones empresariales en mercados globales emergentes. Apoyándose en su amplia experiencia representando intereses comerciales británicos en el exterior, buscará abrir oportunidades de exportación, asociación e inversión con economías en desarrollo de alto potencial de crecimiento y cooperación futuros."
 ENG_andrew_emerging_economy_benefits_decision: "Aprovechar las asociaciones con economías emergentes"
 ENG_andrew_emerging_economy_benefits_decision_desc: "El príncipe Andrés se centrará en reforzar las asociaciones con economías emergentes para ampliar las oportunidades de comercio, inversión y crecimiento económico compartido. Apoyándose en su amplia experiencia promoviendo los intereses comerciales británicos en todo el mundo, esta iniciativa busca atraer inversión y conocimientos de mercados de rápido desarrollo, elevar la productividad nacional y fomentar un entorno empresarial más dinámico."
 ENG_andrew_digital_enterprise_decision: "Iniciativa de empresa digital"
 ENG_andrew_digital_enterprise_decision_desc: "El príncipe Andrés lanzará una iniciativa de empresa digital para promover las habilidades digitales y el emprendimiento en toda la nación. Apoyándose en su trabajo con premios de empresa digital que ayudaron a la gente a desarrollar habilidades en línea, técnicas y empresariales, este programa busca apoyar a aspirantes a innovadores digitales, fomentar la alfabetización tecnológica y construir una base más sólida para la economía digital."
 ENG_anne_national_charity_decision: "Organizaciones Benéficas Nacionales de la Princesa Real"
 ENG_anne_national_charity_decision_desc: "La Princesa Real ampliará y coordinará sus patrocinios nacionales para impulsar resultados prácticos en lugar de oportunidades fotográficas. Propulsiones de financiación, movilización voluntaria y atención pública se dirigirán donde la capacidad está rompiendo."
 ENG_anne_carers_promotion_decision: "Control de Reconocimiento de Carros"
 ENG_anne_carers_promotion_decision_desc: "Ana pondrá a los cuidadores no remunerados en el centro de la atención nacional y presionará a las instituciones para que traten los cuidados como un servicio esencial y no como una carga privada. La campaña eleva el apoyo de respiro, la flexibilidad laboral y el respeto público mediante el patrocinio real y una visibilidad incansable."
 ENG_anne_military_readiness_decision: "Normas de Lectura"
 ENG_anne_military_readiness_decision_desc: "La Princesa Real utilizará sus nombramientos militares para exigir profesionalismo, disciplina de entrenamiento y las rutinas inglamorosas que mantienen a las unidades desplegadas. Las inspecciones, ejercicios y seguimiento logístico serán empujados como medida de seriedad."
 ENG_anne_navy_readiness_decision: "Inspecciones de Lectura de la Flota"
 ENG_anne_navy_readiness_decision_desc: "La Marina Real será presionada para demostrar que puede navegar, luchar y sostenerse bajo presión. Los estándares de las fuerzas de presencia de Anne: mantenimiento, competencia de la tripulación y tempo operativo serán tratados como no negociables."
 ENG_anne_tourism_decision: "Un impulso al turismo real"
 ENG_anne_tourism_decision_desc: "La reputación de Gran Bretaña es un activo, y la Princesa Real la gastará con propósito. Un impulso turístico enfocado destacará el patrimonio, los eventos y las economías locales que necesitan demanda, y convertirá los compromisos reales en reservas e inversión."
 ENG_edward_beach_youth_decision: "Coast Youth Outreach"
 ENG_edward_beach_youth_decision_desc: "El conde de Wessex llevará el trabajo juvenil de la Corona a la costa, utilizando visitas, programas de premios y asociaciones locales para atraer a los jóvenes hacia habilidades y servicios. El mensaje es práctico: confianza, disciplina y un camino a seguir. "
 ENG_edward_global_youth_decision: "Participación mundial en la juventud"
 ENG_edward_global_youth_decision_desc: "Eduardo ampliará la participación juvenil más allá de Gran Bretaña, y reforzará los lazos mediante intercambios, formación y proyectos cívicos compartidos con socios en el extranjero."
 ENG_edward_arts_culture_patronage_decision: "Mecenazgo de las artes y la cultura"
 ENG_edward_arts_culture_patronage_decision_desc: "La Corona defenderá las artes y el sector cultural británico como identidad e influencia estratégica. El patrocinio real aumentará la visibilidad, desbloqueará financiación y protegerá a las instituciones que dan forma a la narrativa nacional en el país y en el extranjero."
 ENG_edward_production_guild_decision: "Apoyar a los Cultivos de Producción"
 ENG_edward_production_guild_decision_desc: "Los gremios y oficios productivos cualificados de Gran Bretaña son la columna vertebral de la calidad y la fuerza exportadora. Eduardo respaldará a los gremios productivos mediante reconocimiento, vínculos de formación y una coordinación de la industria que mantenga vivos los oficios y abiertas las cadenas de suministro."
 ENG_edward_veteran_support_decision: "Wesex Veteran Support"
 ENG_edward_veteran_support_decision_desc: "El servicio no termina con la baja, y la Corona no tratará a los veteranos como una idea tardía. El Conde de Wessex coordinará organizaciones benéficas, empleadores y autoridades locales para mejorar el apoyo a la transición, la estabilidad de la vivienda y las vías de empleo."
 ENG_philip_award_medal_decision: "Entregar la Medalla Príncipe Felipe"
 ENG_philip_award_medal_decision_desc: "El príncipe Felipe emprenderá su propia misión para entregar la Medalla Príncipe Felipe a un ingeniero destacado de impacto mundial excepcional. Este premio reconoce el logro sobresaliente en la práctica y la innovación de la ingeniería bajo su patrocinio personal."
 ENG_philip_award_expansion_decision: "Ampliar los Premios Juveniles del Duque"
 ENG_philip_award_expansion_decision_desc: "El príncipe Felipe viajará para lanzar una ampliación del Premio del Duque de Edimburgo, con el fin de abrir este programa juvenil a un público internacional más amplio. Sus esfuerzos buscan reforzar la resiliencia juvenil y las habilidades cívicas en muchas naciones."
 ENG_philip_trust_funds_grants_decision: "Activar las subvenciones del Fondo del Príncipe Felipe"
 ENG_philip_trust_funds_grants_decision_desc: "El príncipe Felipe supervisará personalmente el desembolso de subvenciones del Fondo Fiduciario Príncipe Felipe a proyectos comunitarios y educativos locales. Su implicación directa asegura el apoyo a iniciativas que mejoran el ocio, el aprendizaje y la vida cívica."
 ENG_philip_faith_conservation_decision: "Lanzar la iniciativa de fe y conservación"
 ENG_philip_faith_conservation_decision_desc: "El príncipe Felipe emprenderá un programa para unir a comunidades religiosas y grupos ambientales en la gestión conjunta de la naturaleza. Busca movilizar recursos morales y comunitarios tras objetivos sostenibles de conservación."
 ENG_philip_innovation_recognition_decision: "Establecer el Reconocimiento Nacional a la Innovación"
 ENG_philip_innovation_recognition_decision_desc: "El príncipe Felipe iniciará un plan nacional para premiar el diseño industrial, la ciencia y la resolución práctica de problemas sobresalientes. Su iniciativa destaca el ingenio como pilar del crecimiento económico y el éxito nacional."
 ENG_william_air_ambulance_decision: "Realizar un turno de ambulancia aérea"
 ENG_william_air_ambulance_decision_desc: "El príncipe Guillermo sale a otro turno de ambulancia aérea, volando misiones de emergencia y reuniéndose con las tripulaciones en tierra."
 ENG_william_mental_health_at_work_decision: "Salud mental en el trabajo"
 ENG_william_mental_health_at_work_decision_desc: "El príncipe Guillermo se pone en marcha para reunir a empleadores y organizaciones benéficas tras un impulso de salud mental en el trabajo."
 ENG_william_step_into_health_decision: "Entrar en Health Drive"
 ENG_william_step_into_health_decision_desc: "El príncipe Guillermo sale de gira para respaldar Step into Health y abrir vías del NHS para veteranos y familias de militares."
 ENG_william_early_years_forum_decision: "Convocar el Foro de la Primera Infancia"
 ENG_william_early_years_forum_decision_desc: "El príncipe Guillermo convoca un foro de la Primera Infancia para reunir en la misma sala a expertos, organizaciones benéficas y empresas."
 ENG_william_chogm_youth_decision: "Mensaje de la Juventud CHOGM"
 ENG_william_chogm_youth_decision_desc: "El príncipe Guillermo asiste a una sesión juvenil de la Reunión de Jefes de Gobierno de la Commonwealth (CHOGM) para señalar que la próxima generación importa para el futuro de la Commonwealth."
 ENG_seize_sierra_leone_resources: "Exploit [SIE.GetFlag] Sierra Leona"
 ENG_seize_sierra_leone_resources_desc: "Es hora de sacar algo de la Operación Barras. Nos apoderaremos de recursos vitales en Sierra Leona y estableceremos influencia económica durante 500 días."
 ENG_war_for_delta: "Guerra para el Delta"
 ENG_war_for_delta_desc: "Tal vez hemos empujado a los nigerianos un poco demasiado lejos, permitiendo que su ego suprima cualquier miedo que puedan tener de enfrentar nuestras fuerzas. Sin embargo, vamos a tener que tomar su capital para mostrarles quién realmente dirige las cosas aquí abajo."
 ENG_end_of_the_world: "Conquistar el fin del mundo"
 ENG_end_of_the_world_desc: "Tierra Del Fuego, también llamada «El Fin del Mundo» es un importante archipiélago y la puerta de entrada a la Antártida. Tomar este lugar vital podría tener enormes beneficios para la nación en su conjunto, tanto por lo que estamos dispuestos a luchar por ello."
 ENG_operation_eastern_divide: "Operación Dividente Oriental"
 ENG_operation_eastern_divide_desc: "Los egipcios no han satisfecho nuestros llamamientos para un acceso justo e igual a través del Suez, y como resultado, hemos sido dejados sin más remedio que recurrir a la acción militar."
 ENG_a_more_united_kingdom: "A Más Reino Unido"
 ENG_a_more_united_kingdom_desc: "Mientras nuestro estado está unido, partes de nuestro reino se fracturaron y se rompieron en estados independientes. Si queremos ser verdaderamente un Reino Unido, necesitamos reunir a los estados del Commonwealth de todos los rincones del mundo."
 ENG_fractured_kingdom_united_state: "Reino Unido, Estados Unidos"
 ENG_fractured_kingdom_united_state_desc: "§R Ciudadano, no sujeto§!\nMientras la monarquía y el régimen anterior se desvanecieron en el olvido, el estado sólo creció más fuerte. Ha llegado el momento de que tomemos una postura más firme y dominante en la escena mundial y finalmente castiguemos a los que saquearon esta tierra durante siglos."
 ENG_deeper_commonwealth_integration: "Integración más profunda del Commonwealth"
 ENG_deeper_commonwealth_integration_desc: "Si vamos a convertirnos en un estado verdaderamente unido primero tendremos que trabajar para convencer a aquellos que deseamos integrar que somos un anfitrión adecuado. Sólo entonces podremos dar los próximos pasos."
 ENG_sovereignty_above_all: "Soberanía sobre todo"
 ENG_sovereignty_above_all_desc: "Nada importa más que la capacidad de nuestros administradores para determinar el futuro de nuestro pueblo. Ningún otro estado, pero el nuestro debe tener una opinión sobre cómo manejamos las cosas."
 ENG_establishing_new_leadership: "Establecimiento del Nuevo Régimen"
 ENG_establishing_new_leadership_desc: "Antes de que podamos trabajar, tendremos que establecer un nuevo régimen. Será necesario desarraigar la sociedad, y debemos comenzar a planificar una nueva autoridad transicional que se haga cargo en partes del país para que el proceso sea más suave."
 ENG_two_way_concessions: "Concesiones de dos vías"
 ENG_two_way_concessions_desc: "No podemos esperar que se avance en llegar a un acuerdo con la devolución si sólo una parte hace un esfuerzo. Haremos algunas concesiones y también esperamos que el otro lado de Escocia haga lo mismo."
 ENG_uniting_the_isle: "Uniendo la Isla"
 ENG_uniting_the_isle_desc: "Los irlandeses son la causa de gran parte de nuestros problemas, desde hacer tensiones hasta que los partidos políticos llamen al separatismo del Norte-Irish. Es hora de que nos mudemos y les enseñemos una lección."
 ENG_revolution_not_devolution: "Revolución, no revolución"
 ENG_revolution_not_devolution_desc: "Para tener un estado verdaderamente unido, primero debemos destruir la causa de la revolución. ¡Necesitamos una revolución nacional, no una revolución!"
 ENG_bring_in_canada: "Traigan a Canadá"
 ENG_bring_in_canada_desc: "Debemos extender una mano a Canadá como el mayor miembro del Commonwealth en cuanto al tamaño de la tierra. Nuestros amigos canadienses han mantenido una proximidad cercana a través del tiempo, así que no debería ser muy difícil conseguirlos a bordo."
 ENG_the_realm_of_britain: "El Reino de Gran Bretaña"
 ENG_the_realm_of_britain_desc: "El Reino de Gran Bretaña es algo que nunca puede ser destrozado, con el espíritu del pueblo británico perseverando durante momentos de especial dificultad."
 ENG_glory_of_pax_britannica: "La Gloria de Pax Britannica"
 ENG_glory_of_pax_britannica_desc: "Nuestro pasado es un glorioso, y hay algunos que dicen que el pasado no se ha ido realmente, sino más bien una prefiguración de lo que va a venir. ¡Tenemos que realizar los sueños de nuestros antepasados, y restaurar la gloria de Pax Britannica!"
 ENG_australian_outreach: "Extensión australiana"
 ENG_australian_outreach_desc: "No podemos olvidar los sacrificios que los australianos han hecho a lo largo de la historia por nuestra causa. Por lo tanto, es imperativo que nos movamos a invitarlos a unirse a nosotros en el futuro venidero."
 ENG_new_zealands_offer: "Oferta de Nueva Zelanda"
 ENG_new_zealands_offer_desc: "La gente de Kiwi ha permanecido durante mucho tiempo un firme aliado nuestro, y a través del bien y el mal se han quedado con nosotros. Es apropiado que les pidamos que se unan a nosotros."
 ENG_fracture_nato_unity: "Fracture Unidad de la OTAN"
 ENG_fracture_nato_unity_desc: "Si bien es cierto que nos beneficiamos de la seguridad de la OTAN durante mucho tiempo, ya no es el caso. Debemos entender que nuestros antiguos amigos no desean nada más que dividir y fracturar nuestro estado, y nuestra gente debe ser consciente de ello."
 ENG_end_eastern_suffering: "El Sufrimiento Oriental"
 ENG_end_eastern_suffering_desc: "El patético bulto de estados en Europa del Este encabezado por Rusia está sufriendo un lento y terrible deterioro. Es mejor que nos mudemos y establezcamos la verdadera prosperidad y el orden en esa región."
 ENG_declare_the_commonwealth: "Declarar el Commonwealth"
 ENG_declare_the_commonwealth_desc: "Ahora que todas las tierras (las importantes por lo menos) de la Commonwealth se han unido a nosotros bajo una bandera, es apropiado que declaremos al mundo que la Federación del Commonwealth está aquí, y que está aquí para quedarse."
 ENG_active_resource_project: "§YProyecto Mineral Critical Activo§!"
 ENG_active_productivity_project: "§YProyecto de productividad nacional activo§!"
 ENG_ucl_east_campus: "UCL este Campus"
 ENG_mechanic_menu_explanation: "Descentralización"
 ENG_devolution_HEADER_TITTLE_LOC: "Cuestiones debatidas"
 ENG_mechanic_menu_explanation_2: "Devolution nos permite volver a poner algo de poder en nuestras manos constituyentes. Podemos gestionarlos haciendo clic en su estado dado. Cada constituyente tendrá un §CParlamento§!, nivel de §R Agitación§! y un nivel de §GDependencia§!. Sobre el botón §Ginfo§! para una explicación detallada."
 ENG_parliament_gui_tooltip: "Cada constituyente tendrá su propio Parlamento. Dependiendo de la agitación de cada elector, el pueblo puede ser más o menos propenso a votar por un diputado Pro-Independencia. Sin embargo, una vez que un miembro del Parlamento de Pro-Independencia asuma el cargo, será muy poco probable para ellos ser expulsados. Si los miembros del Parlamento Pro-Independiente son mayoría, entonces pueden comenzar a empujar proyectos de ley que reduzcan su dependencia y en algún momento podrían eventualmente exigir un referéndum.\n\nNuestros sujetos tendrán una opinión de nosotros, y esto está representado a través de su Agitación. Un constitutivo puede estar más agitado dependiendo de nuestro partido político, el número de proyectos de ley que vetamos o si aumentamos enérgicamente su dependencia. La agitación puede ser efectuada por ciertos eventos, decisiones o focos. Un constitutivo que se apoya fuertemente en Westminster se enfría de su propio acuerdo cada mes, mientras que uno que ya no nos necesita crecerá constantemente más molesto.\n\nLa dependencia determina el nivel en que un constituyente puede manejarse. Si la dependencia es baja, entonces pueden empezar a empujar por más libertades ya que pueden manejarse bien sin el Reino. Tendremos la oportunidad de bajar o aumentar su dependencia basada en los eventos que recibimos, y los focos que tomamos.\n\nEl nacionalismo, la agitación y la parte de la autosuficiencia se combinan en un puntaje de la Presión de la Independencia. Una vez que un constituyente tiene una mayoría de Pro-Independencia y su presión pasa §R60§!, comienza una campaña de referéndum. Entonces tenemos un año para traer esa presión abajo §G50§! antes de que el referéndum sea llamado en realidad. Sólo un constitutivo puede ejecutar una campaña a la vez, y ninguno puede seguir durante cinco años después.\n\nLa Tensión Norte-Irish representa la tensión entre los protestantes sindicalistas, y los católicos republicanos. Decisiones podemos hacer que afloren las tensiones, y si las tensiones alcanzan el 50% entonces habrá enfrentamientos violentos ocasionales. Si las tensiones siguen creciendo más del 50%, entonces la tasa a la que ocurren los enfrentamientos aumentará."
 ENG_dependency_gui_tooltip2: "La dependencia determina el nivel en que un constituyente puede manejarse. Si la dependencia es baja, entonces pueden empezar a empujar por más libertades ya que pueden manejarse bien sin el Reino. Tendremos la oportunidad de bajar o aumentar su dependencia basada en los eventos que recibimos, y los focos que tomamos."
 ENG_parliament_gui_tooltip2: "Cada constituyente tendrá su propio Parlamento. Dependiendo de la agitación de cada elector, el pueblo puede ser más o menos propenso a votar por un diputado Pro-Independencia. Sin embargo, una vez que un miembro del Parlamento de Pro-Independencia asuma el cargo, será muy poco probable para ellos ser expulsados. Si los miembros del Parlamento Pro-Independiente son mayoría, entonces pueden comenzar a empujar proyectos de ley que reduzcan su dependencia y en algún momento podrían eventualmente exigir un referéndum."
 ENG_agitation_gui_tooltip2: "Nuestros sujetos tendrán una opinión de nosotros, y esto está representado a través de su Agitación. Un constitutivo puede estar más agitado dependiendo de nuestro partido político, el número de proyectos de ley que vetamos o si aumentamos enérgicamente su dependencia. La agitación puede ser efectuada por ciertos eventos, decisiones o focos. Un constitutivo que se apoya fuertemente en Westminster se enfría de su propio acuerdo cada mes, mientras que uno que ya no nos necesita crecerá constantemente más molesto. La agitación alimenta el puntaje de la Presión de la Independencia que decide si comienza una campaña del referéndum."
 ENG_irish_tension_tooltip: "La Tensión Norte-Irish representa la tensión entre los protestantes sindicalistas, y los católicos republicanos. Decisiones podemos hacer que se desencadenen tensiones, y si las tensiones alcanzan el 50% entonces habrá enfrentamientos violentos ocasionales. Si las tensiones siguen creciendo más del 50%, entonces la tasa a la que ocurren los enfrentamientos aumentará."
 ENG_scotland_gui_tooltip: "Escocia\n-------------\nPresión de la independencia: §R[?ENG_scottish_pressure|0]/100§!\nVotar para salir de la Unión: §R[?ENG_referendum_leave_vote|0]§!%\n£GFX_click_right §YHaga clic derecho§! a menor agitación por 2\n - Pasará. §R5%§! de los ingresos fiscales mientras activo!\n£GFX_click_left §YShift + Click§! para mantener la subvención renovando"
 ENG_northern_ireland_tooltip: "Irlanda del Norte\n-------------\nPresión de la independencia: §R[?ENG_north_irish_pressure|0]/100§!\nVotar para salir de la Unión: §R[?ENG_referendum_leave_vote|0]§!%\n£GFX_click_right §YHaga clic derecho§! a menor agitación por 2\n - Pasará. §R5%§! de los ingresos fiscales mientras activo!\n£GFX_click_left §YShift + Click§! para mantener la subvención renovando"
 ENG_wales_tooltip: "Wales\n-------------\nPresión de la independencia: §R[?ENG_wales_pressure|0]/100§!\nVotar para salir de la Unión: §R[?ENG_referendum_leave_vote|0]§!%\n£GFX_click_right §YHaga clic derecho§! a menor agitación por 2\n - Pasará. §R5%§! de los ingresos fiscales mientras activo!\n£GFX_click_left §YShift + Click§! para mantener la subvención renovando"
