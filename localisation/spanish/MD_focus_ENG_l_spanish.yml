 raid_type_ENG_raid_nigeria: "Operación Guardia Delta"
 raid_type_ENG_raid_nigeria_desC: "El inestable gobierno nigeriano se ha mostrado inepto en su capacidad de gestionar los campos petroleros que rodean el Delta. Como resultado, tendremos que entrar y tomar medidas para estabilizar."
 raid_type_ENG_raid_zimbabwe: "Operación Salvaguardias"
 raid_type_ENG_raid_zimbabwe_desc: "El tirano que gobierna Zimbabue debe ser desechado inmediatamente ya que no puede confiarse en gobernar un país. Sus acciones contra personas de origen británico y el pueblo nativo de Zimbabue han demostrado que no tiene líneas rojas, y claramente, está dispuesto a cruzar la nuestra."
 ENG_dartmouth_naval_college_expansion: "Expansión del Colegio Naval de Dartmouth"
 ENG_dartmouth_naval_college_expansion_desc: "La ampliación de la Escuela Naval de Dartmouth constituye una importante inversión en educación marítima y capacitación dentro del Reino Unido. Basándose en su rica tradición naval, la expansión contempla instalaciones de última generación, programas de formación avanzados y una mayor capacidad para satisfacer una demanda creciente de personal naval cualificado."
 ENG_type_32_frigate_guardian_class: "Tipo 32 Clase de tutores"
 ENG_type_32_frigate_guardian_class_desc: "La fragata Tipo 32 es una fragata en el Reino Unido para la Marina Real. El Primer Ministro Boris Johnson anunció oficialmente en noviembre de 2020 como resultado del Examen Integrado. Construido después de las fragatas Tipo 26 y Tipo 31, el buque será de uso general y modular en su diseño y se espera que ayude a crecer la flota de escolta superficial de la Marina Real."
 ENG_charles_harmony: "El príncipe británico Charles Harmony tour"
 ENG_election_unlock_tt: "§YEste enfoque puede ser desbloqueado cuando se ha formado un nuevo gobierno con las elecciones§!"
 ENG_army_special_operations_brigade_desc: "La Brigada de Operaciones Especiales del Ejército representa el pináculo de las capacidades militares del Reino Unido, dedicadas a ejecutar misiones clandestinas y desafiantes. Compuesto por personal excepcional extraído de diferentes ramas, esta brigada de élite opera con precisión y adaptabilidad sin igual. Armada con tecnología de vanguardia y entrenamiento riguroso, la unidad está preparada para la lucha contra el terrorismo, la reunión de inteligencia y otras operaciones de alto impacto, solidificando su papel como un activo clave en el aparato de defensa y seguridad del país."
 ENG_glasgow_shipbuilidng_tt: "Este efecto puede mejorarse completando §Y$ENG_refine_natural_bauxite$§!"
 ENG_refine_natural_bauxite_tt: "Esto mejorará los efectos de §Y$ENG_glasgow_shipbuilidng$§!"
 ENG_the_queens_speech: "[ENG_the_queens_speech_focus_title]"
 ENG_the_queens_speech_desc_key: "La nación escucha de manera diferente cuando el Soberano habla como la voz del estado, no la ceremonia. En el discurso de la Reina, se declarará un nuevo acuerdo político y la agenda del gobierno estará vinculada al mandato de la Corona. A partir de hoy, la política tendrá autoridad real, y Gran Bretaña actuará como un reino con una sola voluntad."
 ENG_the_kings_speech_desc_key: "La nación escucha de manera diferente cuando el Soberano habla como la voz del estado, no la ceremonia. En el discurso del rey, se declarará un nuevo acuerdo político y la agenda del gobierno estará vinculada al mandato de la Corona. A partir de hoy, la política tendrá autoridad real, y Gran Bretaña actuará como un reino con una sola voluntad."
 ENG_inner_circle_andrew.06.t: "Príncipe Andrés expulsado de la familia real"
 ENG_inner_circle_andrew.06.a: "Él ya no puede permanecer"
 ENG_inner_circle_philip.04.t: "El príncipe Felipe ha muerto"
 ENG_inner_circle_philip.04.d: "Prince Philip, Duque de Edimburgo, ha muerto después de décadas en el centro de la vida pública real. Su muerte marca el final de una era para la monarquía y se sentirá a través del Reino Unido."
 ENG_inner_circle_philip.04.a: "La nación llora"
 ENG_overseas_territory: "Territorio británico de ultramar"
 ENG_increase_dependence_alt_TT: "Incrementará la §HDependencia§! por $RIGHT|+=0$"
 ENG_decrease_agitation_alt_TT: "Bajar la voluntad §HAgitación§! by $RIGHT|-=0$"
 ENGGetAscendedQueenTrait_tt: "[ENGQueentrait]\n\n[ENGGetAscendedQueenTrait]"
 ENG_andrew_epstein_punishment: "$ENG_prince_andrew_leader_name$ no es un miembro activo de la familia real"
 ENG_queen_elizabeth_class_carrier: "El portaaviones de clase Queen Elizabeth"
 ENG_queen_elizabeth_class_carrier_desc: "Los transportistas de aviones Queen Elizabeth Class fueron un pináculo en la aviación naval británica, lo que significa un salto transformador en capacidad de transporte aéreo. Estas behemoths reforzaron la proyección marítima del Reino Unido, encarnando la modernidad con su tecnología avanzada, capacidad de aeronaves y alcance operativo expansivo, fortificando la estatura de defensa global de la nación."
 ENG_elizabeth_line_decision: "Completar la línea Elizabeth"
 ENG_elizabeth_line_decision_desc: "Terminamos la Línea Elizabeth a través de Londres, conectando Heathrow, el West End, la Ciudad y Canary Wharf con trenes rápidos y frecuentes que cortan los tiempos de viaje y aumentan la productividad."
 ENG_elizabeth_queen: "Elizabeth II"
 ENG_elizabeth_queen_trait: "Queen"
 ENG_elizabeth_queen_idea: "$ENG_elizabeth_queen_trait$"
 ENG_elizabeth_queen_charles_andrew: "$ENG_queen_eldest$"
 ENG_elizabeth_queen_anne_edward: "$ENG_queen_middle$"
 ENG_elizabeth_queen_philip_william: "$ENG_queen_youngest$"
 ENG_elizabeth_ruling_monarch: "§Y$ENG_elizabeth_queen$§! es la corriente §YMonarca de Ruling§!"
 ENG_typhoon_tranche_debate: "Tifón Tranche 1 Debate"
 ENG_typhoon_tranche_debate_desc: "El debate de Typhoon Tranche 1 se refiere a discusiones y análisis que rodean al Tifón Eurofighter, un versátil avión de combate multi-role desarrollado por varias naciones europeas. Estos debates a menudo se profundizan en diversos aspectos del tifón, incluyendo su rendimiento, capacidades, eficacia en función de los costos y significado estratégico en la guerra aérea moderna."
 ENG_silicon_glenn: "Silicon Glenn"
 ENG_silicon_glenn_tt: "§YTecnología temprana para $CAT_computing_tech$, $CAT_internet_tech$ o $CAT_ai$§!"
 ENG_operation_excellence_desc: "Nuestro ejército es una fuerza pequeña pero profesional y capaz, capaz de ser rápidamente desplegado en tierra natal para proporcionar ayuda al poder civil y otros departamentos gubernamentales cuando se lo solicite. Esta capacidad de seguridad en el hogar puede ampliarse y apoyarse para mantener a Gran Bretaña segura."
 ENG_modern_littoral_force_desc: "La Fuerza Littoral Moderna Británica es una iniciativa estratégica que enfatiza las capacidades navales en las regiones costeras. Dirigida por el Reino Unido, esta fuerza modernizada integra tecnologías navales avanzadas, buques versátiles y capacidades de respuesta rápida para garantizar el dominio marítimo en entornos litorales. Con un enfoque en la agilidad y adaptabilidad, la fuerza aumenta la capacidad del Reino Unido para salvaguardar los intereses costeros, responder a las amenazas emergentes y contribuir a la estabilidad regional."
 ENG_trident_nuclear_program_desc: "El Programa Trident es el continuo de disuasión nuclear en el mar del Reino Unido, implementando submarinos de clase Vanguard con misiles balísticos Trident II D5. Esta iniciativa estratégica, gestionada en instalaciones de Aldermaston y Burghfield, subraya el compromiso de la nación con una capacidad ágil y potente de defensa."
 ENG_mothballing_operations: "Operaciones de fútbol"
 ENG_mothballing_operations_desc: "En respuesta a las limitaciones financieras, el Gobierno británico elige la ruta pragmática de los buques navales mothballing, A decision met with reservations from the naval industry, especialmente BAE. Intended to conserve resources, Este movimiento plantea preocupaciones dentro de la industria acerca de las posibles implicaciones para la producción y la fuerza laboral"
 ENG_modern_landing_craft_desc: "En su compromiso constante de mejorar las capacidades navales, el Reino Unido ha emprendido iniciativas de modernización, incluidas inversiones en nuevas naves de aterrizaje. Alineados con el programa Future Commando Force, el Reino Unido tiene como objetivo reforzar sus fuerzas anfibias, en particular los Royal Marines, asegurando una mayor eficacia en operaciones literarias y anfibias."
 ENG_mechanised_amphibious_assault_desc: "Poniendo de relieve la adaptabilidad y la velocidad, el Reino Unido traza una completa Doctrina de asalto anfibio mecanizado. Anclado en la sinergia entre los Marines Reales y la Marina Real, esta estrategia emplea vehículos de asalto anfibios especializados (AAV) y embarcaciones de aterrizaje para el rápido despliegue costero. El mando y control integrados, el apoyo aéreo y el despliegue de buques de asalto anfibios dedicados subrayan el compromiso del Reino Unido de mantener una fuerza formidable y versátil, asegurando la preparación para diversos escenarios mediante rigurosos entrenamientos y ejercicios."
 ENG_strike_brigades_desc: "En respuesta a las amenazas cambiantes, el Reino Unido establece brigadas británicas de huelga, unidades versátiles y de despliegue rápido diseñadas para operaciones terrestres ágiles. Incluye infantería, armadura y artillería, estas brigadas encarnan el compromiso de la nación con respuestas militares rápidas y adaptables. El enfoque en las Brigadas de huelga aumenta la capacidad del Reino Unido para proyectar el poder y responder eficazmente a desafíos dinámicos y diversos de seguridad."
 ENG_carrier_group_debate_desc: "Una parte vital de una armada moderna son las fuerzas de ataque del portaaviones. Necesitamos discutir cuál es la mejor manera de crearlos."
 ENG_mothballing_operations_idea: "Operaciones de Mothballing Naval"
 ENG_mothballing_operations_idea_desc: "A medida que aumentan las presiones financieras, el Gobierno británico se inclina hacia los buques navales mothballing, un movimiento práctico con una recepción mixta de la industria naval, en particular BAE. Si bien se trata de la conservación de los recursos, esta decisión suscita preocupaciones dentro de la industria, lo que arroja una sombra sobre las consideraciones de producción y mano de obra."
 ENG_quality_over_quantity_desc: "Guiándose por el principio de calidad sobre la cantidad, el Reino Unido prioriza la excelencia y la superioridad tecnológica en sus fuerzas militares. Este espíritu nacional enfatiza la adquisición de equipos avanzados y sofisticados, asegurando una postura de defensa formidable y tecnológicamente avanzada. Al centrarse en la calidad, el Reino Unido tiene como objetivo maximizar la eficacia de sus fuerzas, creando un borde estratégico frente a los desafíos modernos."
 ENG_mothballing_operations_idea_tt: "Mientras este espíritu nacional está activo, se le permite §Rno§! tomar §YNaval National Enfoqueses§! "
 ENG_mothballing_operations_negative_opinion_tt: "Modifica §YMaritime Industry Opinion§! by §R-20§! al tener este espíritu nacional"
 ENG_Space_Command: "Mando Espacial del Reino Unido"
 ENG_Space_Command_desc: "El Comando Espacial del Reino Unido es el líder de defensa para las operaciones espaciales, la fuerza de trabajo espacial y la capacidad espacial. Es un comando conjunto, basado en RAF High Wycombe, y con personal de la Armada Real, el Ejército Británico y la Fuerza Aérea Real, junto a funcionarios públicos y contratistas."
 ENG_Space_Command2_desc: "El Comando Espacial del Reino Unido es el líder de defensa para las operaciones espaciales, la fuerza de trabajo espacial y la capacidad espacial. Es un comando conjunto, basado en RAF High Wycombe, y con personal de la Armada Real, el Ejército Británico y la Fuerza Aérea Real, junto a funcionarios públicos y contratistas. Con el regreso de las famosas Coats Rojas, la organización disfruta de una moral superior y un orgullo renovado."
 ENG_british_spaceports_privatized: "British Spaceports Privatized"
 ENG_british_spaceports_privatized_desc: "El Reino Unido abraza una nueva frontera en la exploración espacial, privatizando los puertos espaciales para facilitar las actividades comerciales más allá de la Tierra. Estas instalaciones operadas privadamente indican un cambio hacia la innovación y el apoyo a una creciente industria espacial comercial en el Reino Unido."
 ENG_establish_asteroid_mining_network_mission: "Estableciendo la red de minería de asteroides"
 ENG_establish_asteroid_mining_network_mission_desc: "La Agencia Espacial del Reino Unido está implementando plataformas orbitales y equipos de prospección para iniciar operaciones de recursos fuera del mundo."
 ENG_asteroid_mining_light_operation: "Encuesta de prospección"
 ENG_asteroid_mining_light_operation_desc: "Una misión de reconocimiento a pequeña escala despliega sondas robóticas para identificar asteroides cercanos a la Tierra viables para su extracción."
 ENG_asteroid_mining_medium_operation: "Extracción Misión"
 ENG_asteroid_mining_medium_operation_desc: "Una misión de extracción dedicada apunta a yacimientos de asteroides identificados y recupera metales útiles para la industria británica."
 ENG_asteroid_mining_heavy_operation: "Expedición de minería de escala completa"
 ENG_asteroid_mining_heavy_operation_desc: "Se lanza al cinturón de asteroides una operación a escala industrial completa, que moviliza los activos orbitales de minería más avanzados del Reino Unido."
 ENG_sovereign_capability_doctrine: "Doctrina de Capacidad Soberana"
 ENG_sovereign_capability_doctrine_desc: "Gran Bretaña se compromete a mantener una base industrial independiente e integral de defensa. Los costos de transición estructural imponen un arrastre a corto plazo para la producción civil como reagrupamiento de fábricas."
 ENG_consolidate_national_champions: "Consolidar Campeones Nacionales"
 ENG_consolidate_national_champions_desc: "BAE Systems, Rolls-Royce y Babcock son designados como anclas industriales estratégicos. Los contratos gubernamentales, las adquisiciones preferidas y la facilitación de las exportaciones se dirigen a esas empresas."
 ENG_rolls_royce_raynesway_expansion: "Expansión Rolls-Royce Raynesway"
 ENG_rolls_royce_raynesway_expansion_desc: "La instalación Derby en Raynesway, que fabrica sistemas de propulsión nuclear para submarinos Royal Navy, recibe una inyección de capital importante. Dos nuevas fábricas de armas se traen en línea en las Midlands Orientales."
 ENG_barrow_strategic_shipyard: "Astillero estratégico de Barrow"
 ENG_barrow_strategic_shipyard_desc: "El patio de Barrow-in-Furness de BAE Systems es designado un activo soberano protegido. Tres nuevos astilleros se añaden al complejo naval de Cumbria para garantizar la capacidad de la próxima clase de submarinos nucleares."
 ENG_combat_air_sovereignty: "Combatir la Soberanía Aérea"
 ENG_combat_air_sovereignty_desc: "El Programa Global de Combat Air define la capacidad futura de los combatientes británicos. BAE Systems lidera la fase de diseño, con subvenciones R&D respaldadas por el gobierno que aceleran el cronograma de desarrollo de la plataforma."
 ENG_rolls_royce_aerospace_centre: "Centro aeroespacial de Rolls-Royce"
 ENG_rolls_royce_aerospace_centre_desc: "En Filton, Bristol, se abre una nueva instalación de prueba y producción para el desarrollo del sistema de propulsión de próxima generación para el programa GCAP."
 ENG_munitions_strategic_reserve: "Reserva Estratégica de Municiones"
 ENG_munitions_strategic_reserve_desc: "Una auditoría de las existencias exponía deficiencias críticas en las municiones de precisión. Se encargan dos nuevas líneas de producción para reconstruir las reservas operacionales a profundidad de la era de la Guerra Fría."
 ENG_land_systems_sovereignty: "Soberanía de los sistemas terrestres"
 ENG_land_systems_sovereignty_desc: "Los programas Ajax y Challenger 3 definen el camino hacia la producción totalmente nacional de vehículos blindados. Una nueva instalación de armas se encarga de apoyar el calendario de entrega del programa."
 ENG_skills_pipeline_apprenticeship_act: "Ley de Pipeline y Aprendizaje"
 ENG_skills_pipeline_apprenticeship_act_desc: "Un pacto del gobierno industrial crea 50.000 aprendices de ingeniería de defensa, abordando la brecha de habilidades que deja la contracción industrial posterior a la guerra civil. Se abren otras dos instalaciones de producción de armas a medida que crece la fuerza laboral."
 ENG_national_armaments_director: "Director Nacional de Armamentos"
 ENG_national_armaments_director_desc: "El puesto de Director Nacional de Armamentos se crea dentro del Ministerio de Defensa para proporcionar una supervisión estratégica de la base industrial soberana, coordinar las adquisiciones, licencias de exportación e interoperabilidad aliada."
 ENG_strategic_export_pact: "Pacto Estratégico de Exportación"
 ENG_strategic_export_pact_desc: "BAE Systems está autorizado a concertar acuerdos de exportación respaldados por el gobierno con Australia, Canadá, Japón e Italia. Los marcos AUKUS y Global Combat Air proporcionan la arquitectura diplomática."
 ENG_full_spectrum_industrial_base: "Base Industrial Full-Spectrum"
 ENG_full_spectrum_industrial_base_desc: "Gran Bretaña logra autosuficiencia en los cinco pilares industriales de defensa: submarinos, aviones de combate, vehículos blindados, municiones y armas de precisión. El complejo se designa oficialmente como activo nacional estratégico."
 ENG_lean_defence_posture: "Posición de defensa"
 ENG_lean_defence_posture_desc: "The MoD adopts a demand-signal model, reducing domestic industrial commitments and accepting greater reliance on allied providers. Flujo de ahorro de tesorería inmediatamente."
 ENG_value_for_money_review: "Valor para la revisión del dinero"
 ENG_value_for_money_review_desc: "En el examen de la Oficina Nacional de Auditoría de las adquisiciones del Ministerio de Defensa se determinan los sobrecostos sistemáticos de costos. Una renegociación amplia de los principales contratos reduce los costos unitarios y elimina los programas duplicativos."
 ENG_mothball_strategic_yards: "Yardes estratégicos de Mothball"
 ENG_mothball_strategic_yards_desc: "Tres instalaciones de astilleros de la Marina Real se colocan en menor estado de mantenimiento. El ahorro inmediato es sustancial, pero la capacidad de construcción naval no volverá sin una inversión futura significativa."
 ENG_cancel_legacy_programmes: "Cancelar los programas de Legacy"
 ENG_cancel_legacy_programmes_desc: "Nimrod MRA4, Sentinel R1, y sus sucesores son cancelados antes de la entrega. La decisión libera capital pero abre una brecha en la capacidad de vigilancia y patrulla marítima que tardará años en cerrar."
 ENG_off_the_shelf_procurement: "Comprobación fuera de la plataforma"
 ENG_off_the_shelf_procurement_desc: "Gran Bretaña abandona el desarrollo a medida en favor de plataformas extranjeras probadas. El enfoque reduce los costos iniciales, pero reduce el rendimiento industrial interno y reduce la base de investigación."
 ENG_f35_partnership_deepening: "F-35 Partnership Deepening"
 ENG_f35_partnership_deepening_desc: "El Reino Unido acelera su adquisición F-35B a 48 marcos aéreos y profundiza la integración con la cadena de suministro del Combatiente Conjunto. Las empresas británicas suministran aproximadamente el 15% de cada aeronave producida."
 ENG_european_defence_cooperation: "Europeann Defence Cooperation"
 ENG_european_defence_cooperation_desc: "Gran Bretaña se reinicia con asociaciones bilaterales de capacidad con Francia, Alemania e Italia. La investigación mancomunada reduce la redundancia, aunque la producción de fábricas de armas doméstica disminuye a medida que aumentan las adquisiciones extranjeras."
 ENG_smart_acquisition_reform: "Reforma de la adquisición inteligente"
 ENG_smart_acquisition_reform_desc: "El Programa de Reforma de la Adquisición de Defensa se ejecuta en su totalidad. El análisis de inversión y el modelado de costos a través de la vida útil se vuelven obligatorios, cortando costosas modificaciones en las etapas tardías."
 ENG_dual_use_innovation: "Innovación de doble uso"
 ENG_dual_use_innovation_desc: "Se formalizan los mecanismos de transferencia de tecnología civil de defensa, ya que las empresas electrónicas y de comunicaciones contribuyen a programas militares de la C4ISR. Se publican dos rondas de becas de investigación electrónica."
 ENG_naval_squeeze_efficiency: "Naval Squeeze Efficiencia"
 ENG_naval_squeeze_efficiency_desc: "La Dirección de Readiness Fleet consolida los ciclos de mantenimiento en Rosyth, utilizando herramientas compartidas y piscinas de trabajo para reducir el costo por cada mes de casco. Se abre una nueva instalación para absorber la carga de trabajo consolidada."
 ENG_minimum_viable_industrial_base: "Base Industrial Viable Mínima"
 ENG_minimum_viable_industrial_base_desc: "Gran Bretaña define el piso irreducible de la capacidad de producción soberana. Debajo de este piso no se permiten más cortes. El compromiso estabiliza las expectativas de la industria y calma el malestar laboral."
 ENG_strategic_reliance_doctrine: "Doctrina de dependencia estratégica"
 ENG_strategic_reliance_doctrine_desc: "El Consejo Nacional de Seguridad concluye que la dependencia aliada, principalmente en los Estados Unidos, es la postura más económica para una economía de tamaño mediano. Los términos de la lejanía se mejoran permanentemente."
 ENG_industrial_realignment_idea: "Realización industrial de defensa"
 ENG_industrial_realignment_idea_desc: "Se están reorientando los recursos de la población civil a las líneas de producción de defensa. Los factores que retoman los programas de armas soberanas reducen temporalmente la producción civil."
 ENG_capability_gap_idea: "Capacidad Gap"
 ENG_capability_gap_idea_desc: "La cancelación de programas heredados ha dejado a las fuerzas armadas sin sistemas de sustitución. La disponibilidad operacional se reduce hasta que se completen las nuevas adquisiciones."
 ENG_p125_revival: "P.125 Programme Revival"
 ENG_p125_revival_desc: "La reactivación del proyecto P.125 ha revitalizado la fabricación de cazas domésticos, reduciendo el costo de la producción de aeronaves ligeras mientras el programa madura."
