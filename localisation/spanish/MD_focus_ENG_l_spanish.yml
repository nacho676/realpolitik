 ENG_celsa_steel_idea: "Asociación de acero Celsa"
 ENG_celsa_steel_idea_desc: "Una asociación a largo plazo con el molino Cardiff de Celsa asegura un flujo constante de chatarra reciclada en nuevo acero, mejorando nuestros rendimientos de recursos y dándole la ventaja para impulsar nuevos aumentos de producción cada año."
