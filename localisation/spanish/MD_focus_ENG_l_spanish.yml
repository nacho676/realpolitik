 ENG_create_new_faction_TT: "Creará una nueva facción: Atlantic Security Organization\n\n¡Podremos derrocar gobiernos extranjeros usando [ADS.GetFlag] Albionis!\n - Conseguimos 3 usos para esta habilidad, y está disponible a través del menú de influencia a través del botón de golpe. Una opción adicional aparecerá que te permitirá utilizar [ADS.GetFlag] Albionis para derrocar dicho gobierno en Europa, concediéndote un vasallo & aliado."
 ENG_collapse_of_society_TT: "£text_icon_kaldanger Elegir esta opción puede resultar en el derrocamiento del gobierno!\n - Esto nos permitirá hacer el §H Reino fructífero, Estados Unidos§!\n - Los militares entrarán después de un punto y se encargarán del estado."
 ENG_do_fp_TT: "Ha completado por lo menos §H3§!"
 ENG_core_desc_TT: "Al alcanzar la hegemonía económica, militar y política, podremos mostrar a los tres estados primarios de la Commonwealth que podemos proveer para ellos y protegerlos. Además, sus constituyentes estarán más inclinados a unirse a nosotros si nuestras condiciones son mejores."
 ENG_econ_hegemony_TT: "'El dinero lo arregla todo'\n\nAl alcanzar la hegemonía económica, estaremos en un buen estado para integrar otras economías como las de los estados del Commonwealth. Para lograr esto necesitamos:\n\nUn PIB más alto que los 3 combinados\n- La nuestra es actualmente $[?gdp_per_capita] (miles) \n- La suya es actualmente $ [?commonwealth_total_gdp] (miles)"
 ENG_military_hegemony_TT: "«Un ejército fuerte equipara a una regla fuerte»\n\nAl alcanzar la hegemonía militar, estaremos en buenas condiciones para demostrar que somos capaces de defender nuestros territorios y pueblos. Para lograr esto necesitamos:\n\nMás mano de obra desplegada que los 3 combinados\n- Actualmente tenemos [?ENG.deployed_army_manpower_k] (miles) soldados desplegados\n- Actualmente tienen [?commonwealth_total_army] (miles) tropas desplegadas"
 ENG_political_hegemony_TT: "'Pulling strings es todo lo que se necesita'\n\nAl alcanzar la hegemonía política, demostraremos que el gobierno de Westminster es estable, conectado y en contacto con todas las personas de todos los ámbitos de la vida. Para lograr esto necesitamos:\n\nUna esfera fuerte de influencia\n- Al menos el 50% de influencia o más en los 3 países"
 ENG_tooltip_TT: "Ha cumplido todos los requisitos para la Hegemonía Económica"
 ENG_tooltip2_TT: "Ha cumplido todos los requisitos para la Hegemonía Militar"
 ENG_has_met_all_requirements_TT: "Es hegemon en las tres categorías"
 ENG_hold_for_280_TT: "¡Debemos mantener nuestra capital por 280 días!"
 ENG_seize_sierra_leone_TT: "Si [SIE.GetFlag] §HSierra Leona§! permanece prooccidental y está en paz:\n - Seremos capaces de aprovechar temporalmente sus recursos en §HFreetown§! mediante una decisión"
