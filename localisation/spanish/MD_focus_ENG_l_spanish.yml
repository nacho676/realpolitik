 ENG_coal_opencast_mining: "Coal de Opencast escocés"
 ENG_coal_opencast_mining_desc: "Los nuevos pozos de transmisión abierta en los campos de carbón de Escocia mantienen un flujo constante de combustible barato que fluye a nuestras centrales de combustible fósil, lo que les permite correr más y generar más electricidad para la red."
 ENG_glasgow_shipbuilding_idea1: "Centro de construcción naval de Glasgow"
 ENG_glasgow_shipbuilding_idea1_desc: "La inversión en los patios de Clyde ha simplificado el diseño, la soldadura y el atuendo, cortando el costo de producción de todos nuestros buques navales construidos en Glasgow y más allá."
 ENG_glasgow_shipbuilding_idea1_tt: "§YTodos los buques navales construyen Costo:§! §G-5%§!"
 ENG_glasgow_shipbuilding_idea2: "Centro de construcción naval de Glasgow"
 ENG_glasgow_shipbuilding_idea2_desc: "La inversión en los patios de Clyde ha simplificado el diseño, la soldadura y el atuendo, cortando el costo de producción de todos nuestros buques navales construidos en Glasgow y más allá."
 ENG_glasgow_shipbuilding_idea2_tt: "§YTodos los buques navales construyen Costo:§! §G-5%§!\n §YTodos los barcos navales de diseño cuestan:§! §G-20%§!"
 ENG_highland_main_line: "Línea principal de Highland"
 ENG_highland_main_line_desc: "El Highland Main Line actualiza Perth e Inverness con trenes más rápidos y fiables, ayudando a las empresas locales a llegar a mercados, trabajadores y servicios más fácilmente."
 ENG_crossrail: "Red Crossrail"
 ENG_crossrail_desc: "La Elizabeth Line teje a Heathrow, el West End, la Ciudad y Canary Wharf en un solo mercado de trabajo, facilitando las comunicaciones, releyendo líneas concurridas y levantando la productividad de la economía de oficina de Londres."
 ENG_high_value_manufacturing_zone: "Zona de fabricación de alto valor"
 ENG_hs2_idea: "High-Speed 2"
 ENG_northern_powerhouse_rail_idea: "Carril de la central eléctrica del norte"
 ENG_andrew_digital_enterprise_modifier: "Unidad de digitización de la empresa real"
 ENG_andrew_digital_enterprise_modifier_desc: "Respaldado por las redes de patrocinio del Duque de York, ha surgido un nuevo empuje para conectar inversores, empresas regionales y empresas tecnológicas a través de un marco comercial más moderno. Se están utilizando oficinas de promoción del comercio, foros empresariales y asociaciones del sector privado para acelerar la adopción digital y mejorar la visibilidad de las empresas británicas en el país y en el extranjero."
 ENG_edward_beach_youth_modifier: "Campaña de divulgación juvenil de Duke"
 ENG_edward_beach_youth_modifier_desc: "Bajo el patrocinio del conde de Wessex, las iniciativas de compromiso juvenil se han ampliado a través de programas de premios, redes comunitarias y eventos públicos en todo el país. La campaña hace hincapié en la confianza, el servicio cívico y las aptitudes prácticas, el fortalecimiento de la cohesión social al tiempo que alienta a una nueva generación a participar en la vida nacional."
 ENG_prince_charles: "Charles"
 ENG_prince_charles_trait: "Príncipe de Gales"
 ENG_charles_1_idea: "Príncipe de Gales"
 ENG_charles_1_idea_desc: "Charles fue nombrado Príncipe de Gales como el heredero aparente para el Reino Unido. Este título, otorgado por la patente de cartas y marcado por la investidura formal, significó su condición primaria como sucesor de la Corona y su vínculo duradero con Gales y los reinos más amplios."
 ENG_prince_andrew: "Andrew"
 ENG_prince_andrew_trait: "Duke of York"
 ENG_prince_andrew_leader_name: "$ENG_prince_andrew_trait$ Prince $ENG_prince_andrew$ "
 ENG_andrew_1_idea: "Comandante de la Marina Real"
 ENG_andrew_1_idea_desc: "Como Comandante Real de la Armada, Andrew sirvió con distinción en la flota británica, incluyendo tareas como piloto de helicópteros y comandante del buque. Esto refleja su servicio activo y liderazgo en operaciones marítimas, y significa su profunda conexión con el patrimonio naval del Reino Unido."
 ENG_andrew_3_idea: "Duke of York"
 ENG_andrew_3_idea_desc: "El título de Duque de York fue otorgado a Andrew como una marca de su estatus como un rey mayor y segundo hijo del soberano. Tradicionalmente concedido a los hijos más jóvenes del monarca, lleva prestigio histórico y asociaciones de larga data con servicio real y deber público."
 ENG_princess_anne: "Anne"
 ENG_princess_anne_trait: "Princesa Real"
 ENG_princess_anne_leader_name: "$ENG_princess_anne_trait$ Princess $ENG_princess_anne$"
 ENG_anne_1_idea: "Princesa Real"
 ENG_anne_1_idea_desc: "El título de Princesa Real es sostenido por Anne como una marca de antigüedad y un servicio excepcional dentro de la Familia Real. Tradicionalmente concedido por el soberano a su hija mayor, no es automático y se otorga sólo como un honor personal. Lleva prestigio histórico y señala una expectativa de vida del deber visible e inquebrantable compromiso con la Corona."
 ENG_princess_anne_naval_trait: "Comandante Jefe de la Mujer en la Marina Real"
 ENG_princess_anne_army_trait: "Coronel del Rey Hussars Royal"
 ENG_prince_edward: "Edward"
 ENG_prince_edward_trait: "Earl of Wessex"
 ENG_edward_1_idea: "Earl of Wessex"
 ENG_edward_1_idea_desc: "El título de Earl de Wessex fue concedido a Edward como una distinción real superior vinculada al servicio y la responsabilidad pública. Basándose en un antiguo nombre inglés con profunda resonancia histórica, lleva prestigio sin implicar autoridad constitucional. En Gran Bretaña moderna funciona como una plataforma para el patrocinio, representación y apoyo constante del trabajo público de la monarquía."
 ENG_prince_phillip: "Phillip"
 ENG_prince_phillip_trait: "Duke of Edinburgh"
 ENG_phillip_1_idea: "Duke of Edinburgh"
 ENG_phillip_1_idea_desc: "El título de Duque de Edimburgo fue sostenido por el Príncipe Felipe como una marca determinante de su papel al lado del soberano y su vida útil al reino. Le concedía en su matrimonio con la Princesa Elizabeth, combinaba el prestigio histórico con una identidad moderna basada en el deber, la disciplina y el apoyo institucional. En la vida pública se asoció estrechamente con sus patrocinios y el trabajo práctico que sostenía la monarquía a través de generaciones."
 ENG_prince_william: "William"
 ENG_prince_william_trait: "Duke of Cambridge"
 ENG_prince_william_leader_name: "$ENG_prince_william_trait$ Prince $ENG_prince_william$"
 ENG_william_1_idea: "Duke of Cambridge"
 ENG_william_1_idea_desc: "El título de Duque de Cambridge fue concedido al Príncipe William como una distinción real superior que marca su papel como figura líder de la próxima generación. Tradicionalmente otorgada por el soberano a miembros prominentes de la Familia Real, lleva prestigio y una clara expectativa de representación nacional y deber público. En Gran Bretaña moderna sirve como una plataforma para el patrocinio, servicio y la preparación constante de un heredero para la responsabilidad futura."
 ENG_prince_william_army_trait: "Lieutenant Wales"
 ENG_prince_william_high_command_trait: "$ENG_prince_william_army_trait$"
 ENG_royalty_trait: "Royalty"
