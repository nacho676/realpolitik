 ENG_inner_circle_andrew.06.d: "Tras la caída de sus vínculos con Jeffrey Epstein, el príncipe Andrew se ha vuelto políticamente tóxico. Bajo la creciente presión pública e institucional, está despojado de su posición restante dentro de la Familia Real y alejado del círculo interior."
 ENG_military.046.t: "Washington aprueba la asociación"
 ENG_military.046.d: "Los Estados Unidos han designado oficialmente al Reino Unido un importante aliado no perteneciente a la OTAN. La alianza estratégica abre la puerta a una cooperación más profunda en materia de defensa y acceso preferencial a la tecnología militar estadounidense."
 ENG_military.046.a: "Un valioso amigo en el Atlántico"
 ENG_military.047.t: "Washington declina la asociación"
 ENG_military.047.d: "Los Estados Unidos han rechazado nuestra solicitud de que se designe al Sr. Ally a los principales no miembros de la OTAN. La relación especial sigue siendo, pero Washington no está dispuesto a formalizarla aún más en este momento."
 ENG_military.047.a: "Decepcionante, pero no el fin"
