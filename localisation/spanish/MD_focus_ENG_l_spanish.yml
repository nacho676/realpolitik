 ENG_type_23_lifex: "Tipo 23 Extensión de Vida"
 ENG_type_23_lifex_desc: "La fragata Tipo 23 fue diseñada alrededor de una vida de casco de dieciocho años, pero a mediados del año 2000, los dieciséis barcos sobrevivientes eran toda la fuerza escolta. El programa Life Extension, universalmente conocido como LIFEX, tomó cada casco a su vez a través de un reajuste completo en Devonport: nuevos generadores diesel y cajas de cambios, renovación estructural, el radar Artisan Type 997 en lugar del Tipo 996, y Sea Ceptor reemplazando Sea Wolf. El trabajo impulsó a barcos individuales durante treinta años en comisión y compró la Armada Real la década que necesitaba para diseñar un sucesor."
 ENG_future_surface_combatant: "Futuro Combatiente de Superficie"
 ENG_future_surface_combatant_desc: "Inaugurado en 1998 y reestructurado más de una vez, el programa Future Surface Combatant fue el intento de definir lo que seguiría al tipo 22 y al tipo 23. Corrió a través de los estudios de Capa de Combatientes de Superficie Sostenida y los conceptos C1, C2 y C3, un buque anti submarino, un barco de propósito general y un buque de patrullas capaz del océano, antes de converger en un solo casco flexible comercializado como el buque de combate global. Cada fragata británica diseñada después hereda las suposiciones establecidas aquí."
 ENG_ark_royal_class_carrier: "Un portaaviones de clase real"
 ENG_ark_royal_class_carrier_desc: "Con la reina Isabel y el Príncipe de Gales en servicio, la pregunta se convierte en lo que les sigue. Un tercer casco construido para un diseño revisado terminaría con la aritmética que deja la flota sin un portaaviones de huelga cuando una nave entra en mantenimiento profundo, y llevaría un nombre dado por cinco anteriores buques de guerra británicos, más recientemente el buque de clase Invincible pagó en 2011."
 ENG_type_45_daring_class: "Tipo 45 Destructor de Clase Daring"
 ENG_type_45_daring_class_desc: "Ordenado después de que Gran Bretaña dejara el programa trilateral de fragata Horizon en 1999, el tipo 45 se construyó alrededor del sistema Sea Viper, el radar multifunción Sampson montado en la mampara y el radar de largo alcance S1850M. Seis barcos fueron montados en Govan, Scotstoun y Portsmouth entre 2003 y 2013 para reemplazar el Tipo 42. Daring y Dauntless lideran la clase, y juntos dan a la Marina Real la plataforma de defensa aérea más capaz que haya operado."
 ENG_aukus_programme: "Programa AUKUS"
 ENG_aukus_programme_desc: "Anunciada en septiembre de 2021, la asociación AUKUS compromete al Reino Unido, los Estados Unidos y Australia a un submarino de ataque nuclear común. El diseño SSN-AUKUS es dirigido por los británicos y crece de los estudios sucesores Astute, emparejando una planta del reactor Rolls-Royce con sistemas estadounidenses de combate y lanzamiento vertical. La construcción se comparte entre Barrow-in-Furness y Osborne, atando tres bases industriales en una línea de producción para el resto del siglo."
 ENG_albion_class_lpd: "El muelle de la plataforma de aterrizaje clase Albion"
 ENG_albion_class_lpd_desc: "El programa de sustitución de muelles de la plataforma de aterrizaje entregó HMS Albion y HMS Bulwark, encargado en 2003 y 2004 en lugar del desgastado Fearless e Intrepid. Cada barco lleva un muelle de inundación para cuatro embarcaciones de aterrizaje, una cubierta de vehículos, una cubierta de vuelo capaz de tomar dos helicópteros medianos, y los espacios de comando para un equipo de tareas anfibio. Son las plataformas desde las que los Marines Reales pusieron una brigada a tierra."
 ENG_royal_marines_future_commando_force: "Futura Fuerza de Mando"
 ENG_royal_marines_future_commando_force_desc: "El programa Future Commando Force desvía a 3 Commando Brigade del ataque anfibio masivo y hacia la continua redada. Comandos operan en pequeños equipos autosuficientes, trabajan desde auxiliares convertidos y buques de huelga literaria más que desde una cabeza de playa, y están equipados para el reconocimiento, sabotaje y la incautación de terrenos marítimos clave. Es el mayor cambio a la doctrina de los Marines Reales desde la Segunda Guerra Mundial."
 ENG_royal_marines_littoral_response_group: "Grupo de respuesta littoral"
 ENG_royal_marines_littoral_response_group_desc: "Dos Grupos de Respuesta Littoral, uno celebrado en el Euro Atlántico y otro al este de Suez, mantienen un grupo de empresa de comandos y su envío permanentemente al mar. Construidos alrededor de un barco de muelles de clase Albion y auxiliares de clase Bay, proporcionan una capacidad permanente para evacuación, socorro en casos de desastre, entrenamiento con fuerzas asociadas y redadas, disponibles en días más que las semanas que un equipo de tareas tomaría para reunir."
 ENG_royal_marines_arctic_warfare_centre: "Centro de guerra ártico"
 ENG_royal_marines_arctic_warfare_centre_desc: "Gran Bretaña ha mantenido el compromiso del clima frío con el flanco norte de la OTAN desde los años 70, enviando 3 Brigada Commando a Bardufoss y Porsangmoen cada invierno. La formación de ese despliegue estacional en un establecimiento permanente de entrenamiento preserva el cadre de esquí y líder montañoso, los equipos sobre vehículos de nieve y los instructores de supervivencia, y mantiene a los Marines Reales la formación de referencia de la alianza para operaciones por encima del Círculo Ártico."
 ENG_military.048.t: "La propuesta de AUKUS"
 ENG_military.048.d: "Londres propone una asociación trilateral con Washington y Canberra, construida alrededor de un submarino de ataque nuclear común. El diseño británico crece de los estudios sucesores Astute y empareja una planta del reactor Rolls-Royce con sistemas de combate americanos y células de lanzamiento vertical. La solicitud va más allá de cualquier acuerdo anterior: ya que el Acuerdo de Defensa Mutua de 1958, la propulsión nuclear naval se ha compartido sólo con el Reino Unido, y los británicos piden ahora que Australia sea admitida en él. La aprobación abriría Barrow-in-Furness y Osborne como una única línea de producción y colocaría a los cazadores aliados en el Océano Índico oriental durante el resto del siglo."
 ENG_military.048.a: "Extender el acuerdo de propulsión a Canberra"
 ENG_military.048.b: "El reactor permanece dentro del acuerdo de 1958"
 ENG_military.049.t: "Barcos nucleares o el orden convencional"
 ENG_military.049.d: "El Reino Unido y los Estados Unidos han ofrecido a Australia un submarino de ataque con energía nuclear, el primero que se ha suministrado a un país sin sus propias armas nucleares. El precio es el programa de sustitución convencional existente, cuyo contrato tendría que ser cancelado directamente y su socio europeo compensado. En su lugar vienen rotaciones a través de HMAS Stirling, un patio reconstruido en Osborne, y un pago en las bases industriales británicas y estadounidenses para comprar el rendimiento que nuestros propios submarinos necesitarán. The decision commits the Commonwealth to a submarine force it cannot maintain without alied support, and to the partnership that supplies it."
 ENG_military.049.a: "Cancelar el orden y construir nuclear en Osborne"
 ENG_military.049.b: "Nosotros cumpliremos el contrato que firmamos"
 ENG_military.050.t: "AUKUS está firmado"
 ENG_military.050.d: "Los tres gobiernos han anunciado la asociación. Australia operará un submarino de ataque nuclear construido a un diseño británico, y la planta del reactor, el sistema de combate y los patios que los montan ahora son una empresa compartida. Barrow-in-Furness gana una orden de exportación que subscribe al sucesor Astute durante décadas, y los ingenieros navales británicos, americanos y australianos trabajarán desde un conjunto común de dibujos por primera vez."
 ENG_military.050.a: "Tres marinas, un submarino"
 ENG_military.051.t: "El contrato es derribado"
 ENG_military.051.d: "Canberra ha cancelado el programa submarino sin previo aviso y sin consulta, y lo ha hecho para tomar una oferta angloamericana negociada detrás de nuestras espaldas. La orden fue el mayor contrato de defensa que nuestros constructores habían ganado, y su pérdida cae directamente en los patios y los equipos de diseño que ya habían comenzado a trabajar. Nuestros embajadores están siendo recordados. Sea cual sea el argumento estratégico para el nuevo arreglo, los aliados no aprenden de tales decisiones de la prensa."
 ENG_military.051.a: "Una puñalada en la espalda"
 ENG_military.052.t: "Washington retiene al reactor"
 ENG_military.052.d: "Los Estados Unidos se han negado a extender la propulsión nuclear naval más allá del acuerdo de 1958. Las objeciones a la no proliferación siempre iban a plantearse, y Washington ha decidido que superan el beneficio estratégico. El submarino será construido, pero se construirá solo."
 ENG_military.052.a: "Entonces lo construimos nosotros mismos."
 ENG_military.053.t: "Canberra Declines"
 ENG_military.053.d: "Australia ha optado por mantener su programa submarino existente. La oferta de un barco con energía nuclear llevaba obligaciones Canberra no estaba preparada para aceptar, desde los cargos de cancelación a una dependencia de mantenimiento que dura más de medio siglo. La asociación no procederá."
 ENG_military.053.a: "La oferta se mantiene si cambian de opinión"
 ENG_military.054.t: "AUKUS Anunciado"
 ENG_military.054.d: "El Reino Unido, los Estados Unidos y Australia han anunciado una asociación trilateral de seguridad cuyo primer compromiso es un submarino común de ataque nuclear. Australia se convierte en el primer país sin armas nucleares en operar uno. La reacción es inmediata: los expertos en proliferación cuestionan las salvaguardias sobre el combustible naval altamente enriquecido, Beijing condena el arreglo como un bloque dirigido contra él, y el socio europeo cuyo contrato fue cancelado ha recordado a sus embajadores."
 ENG_military.054.a: "Los cambios de equilibrio en el Pacífico"
 AST_aukus_submarine_programme: "Programa Submarino de AUKUS"
 AST_aukus_submarine_programme_desc: "El patio de Osborne está siendo reconstruido para montar submarinos de ataque nuclear a un diseño británico, con una fuerza laboral entrenada mediante rotaciones a Barrow-in-Furness y los patios americanos. Las plantas de reactor llegan como unidades selladas, pero el casco, la integración del sistema de combate y una vida útil de trabajo de mantenimiento en Australia del Sur, dando al Commonwealth una industria submarino que nunca ha poseído a esta escala."
 britain_md.300.t: "Los bloques de construcción se basan en el diseño"
 britain_md.300.d: "Arm está comprando Artisan Components, pasando de diseños de procesadores a las bibliotecas físicas que convierten cualquier diseño en silicio real. Es un paso más arriba de la cadena de valor y fuera del negocio de licencias puras. El Tesoro debe decidir si el alivio de investigación británico sigue a la empresa allí."
 britain_md.300.a: "Extender el alivio de la investigación al trabajo del diseño físico"
 britain_md.300.b: "Dejar que la adquisición se mantenga sobre sus méritos comerciales"
 britain_md.301.t: "El procesador en cada bolsillo"
 britain_md.301.d: "Un núcleo de arma se encuentra en el centro del nuevo teléfono de Apple, y de casi todos los rivales que lo seguirán. La realeza en cada ficha se mide en centavos y el volumen se mide en miles de millones. Cambridge ha construido algo de lo que toda la industria ahora depende sin tener nada de él."
 britain_md.301.a: "Funda el grupo de diseño de Cambridge alrededor de él"
 britain_md.301.b: "Que el modelo de concesión de licencias se lleve"
 britain_md.302.t: "Sesenta y cuatro bits"
 britain_md.302.d: "ARMv8 lleva la arquitectura Arm a 64 bits, y con ella en los servidores y centros de datos que Intel ha poseído sin un desafío serio. Whitehall puede poner la computación pública detrás de la arquitectura británica o dejar la pregunta al mercado. La adquisición es la única palanca que mueve esto rápidamente."
 britain_md.302.a: "Computación pública a la arquitectura"
 britain_md.302.b: "Mantenga la plataforma comercialmente neutral"
 britain_md.303.t: "La Oferta SoftBank"
 britain_md.303.d: "SoftBank ha ofertado 24.3 billones de libras para Arm, en una prima que ningún comprador británico coincidirá, con compromisos en la sede y en el recuento británico. La compañía se quedaría en Cambridge. La propiedad no permanecería británica."
 britain_md.303.a: "Haga una estaca pública antes de que la venta termine"
 britain_md.303.b: "Aceptar los compromisos y dejar que la venta proceda"
 britain_md.304.t: "Cuarenta millones de dólares para armas"
 britain_md.304.d: "Nvidia ha acordado comprar Arm de SoftBank. Las propias licencias de armas, que compiten con Nvidia en cada mercado que importa, han preguntado en público qué neutralidad sobreviviría a la venta. La decisión pertenece a la autoridad de competencia, y a los ministros que la instruyen."
 britain_md.304.a: "Limpiar la venta en condiciones de comportamiento vinculantes"
 britain_md.304.b: "Remitirlo por motivos de seguridad nacional"
 britain_md.305.t: "Donde Listas de Armas"
 britain_md.305.d: "SoftBank está flotando Arm de nuevo y ha elegido Nueva York. Londres se ha dicho claramente que sus reglas de inclusión, sus ponderaciones de índice y su base de inversores no podían contener la mayor compañía tecnológica que Gran Bretaña ha producido. Mantener el flotador en casa significaría reescribir los tres."
 britain_md.305.a: "Reformar las reglas del listado y anclar el flotador en Londres"
 britain_md.305.b: "Aceptar el listado de Nueva York y mantener la sede"
 britain_md.306.t: "Qué arma se ha convertido"
 britain_md.306.d: "Un cuarto de siglo de licencias, tomas y anuncios ha solucionado lo que Arm es: quien posee la compañía de Cambridge cuya arquitectura se sienta dentro de casi todos los teléfonos en la tierra, y cuyo intercambio pone un precio en ella."
 britain_md.306.a: "Una apuesta soberana en la arquitectura"
 britain_md.306.b: "La arquitectura de la plataforma de otro"
 britain_md.306.c: "Listado en casa"
 britain_md.306.e: "Una isla que licencia al mundo"
 ENG_arm_sovereign_architecture_stake: "Soberana arquitectura Stake"
 ENG_arm_sovereign_architecture_stake_desc: "El estado tiene equidad en la empresa cuya instrucción establece el mundo se basa, y un veto sobre donde va a continuación. La apuesta gana menos que el mercado y compra algo que el mercado no vende."
 ENG_arm_foreign_platform_architecture: "Arquitectura de una Plataforma Exterior"
 ENG_arm_foreign_platform_architecture_desc: "Arm pertenece a una compañía más grande ahora, y la hoja de ruta sirve el silicio de esa empresa primero. La ingeniería todavía se hace en Cambridge, a una escala que ningún licenciante independiente podría haber financiado, y en los términos de otra persona."
 ENG_arm_listed_at_home: "Listado en casa"
 ENG_arm_listed_at_home_desc: "El flotador se quedó en Londres, y las reglas fueron reescritas para mantenerlo. El intercambio tiene un anclaje tecnológico al fin, y las reformas que ganaron se aplican a todos los que enumeran después."
 ENG_arm_licensing_island: "Una isla que Licencia el Mundo"
 ENG_arm_licensing_island_desc: "Los diseños son británicos, los propietarios no lo son, y el comercio de acciones en Nueva York. Gran Bretaña mantiene a los ingenieros, las regalías y la reputación, y ninguno de los controles que estaba disponible dos veces y disminuyó dos veces."
 ENG_scottish_agitation_rising_tt: "La agitación escocesa está por encima de 10."
 ENG_north_irish_agitation_rising_tt: "La agitación irlandesa del Norte está por encima de 10."
 ENG_wales_agitation_rising_tt: "La agitación de Gales está por encima de 10."
 devolution.20.t: "Desmantelamiento de rupturas"
 devolution.20.d: "La Comisión Internacional Independiente de Desmantelamiento ha suspendido su labor. La tensión sobre el terreno subió más rápido que los inspectores podían certificar los vertederos, y los líderes paramilitares han retirado a sus interlocutores en lugar de ser vistos desarmados mientras las calles están ardiendo. Tanto las organizaciones leales como republicanas insisten en que las armas nunca fueron el obstáculo, y cada una culpa al otro por el colapso. Nada que fue puesto más allá del uso está regresando, pero nada más será entregado, y el movimiento será mucho más difícil de traer de vuelta a la mesa ahora que sus corredores pueden decir que fueron probados correctamente."
 devolution.20.a: "Baja la tensión y vuelve a intentarlo."
 devolution.21.t: "Más allá del uso"
 devolution.21.d: "La Comisión ha informado de que ha sido testigo del desmantelamiento de todo el arsenal restante. Los vertederos sellados de rifles, semtex, morteros y ametralladoras pesadas han sido permanentemente inaccesibles bajo supervisión independiente, con clérigos de ambas comunidades que son testigos. Las facciones disidentes que pasaron años denunciando el proceso de paz como una venta se quedan sin la única cosa por la que valía la pena denunciarlo. El reclutamiento se ha colapsado, las redes de recaudación de fondos en los Estados Unidos se han secado y la Subdivisión Especial evalúa que lo que queda es un residuo criminal más que una insurgencia. Irlanda del Norte aún no se ha reconciliado, pero por primera vez desde 1969 no está armada."
 devolution.21.a: "La guerra ha terminado."
 devolution.23.t: "Westminster ofrece unificación"
 devolution.23.d: "La encuesta fronteriza ha devuelto la mayoría para una Irlanda unida, y bajo los términos del Acuerdo el gobierno británico está obligado a dar efecto a ese deseo. Londres ha invitado oficialmente a Dublín a aceptar la soberanía sobre los seis condados. La oferta es real, y también la ley que viene con ella: dos millones de personas, una subvención que Westminster ha llevado durante décadas, un servicio policial que la mitad de la población todavía no confía, y una comunidad sindicalista que votó en contra de esto y no va a ninguna parte. Aceptar significa que la República hereda todo, junto con la ambición más antigua de la política irlandesa. Declining significa decirle a la mayoría en el Norte que la República no los quiere."
 devolution.23.a: "Irlanda sin libertad nunca estará en paz"
 devolution.23.b: "No estamos listos para llevar el Norte"
 devolution.24.t: "La Contaminación Fronteriza falla"
 devolution.24.d: "El conteo está dentro y la Unión mantiene. La participación fue alta en ambos lados y la campaña hizo lo que las campañas en Irlanda del Norte siempre hacen, lo cual es recordar a todos lo que los divide, pero cuando la pregunta se puso la respuesta era no. Los políticos nacionalistas ya han comenzado a discutir si la encuesta fue llamada demasiado pronto, y los partidos sindicalistas están tratando el resultado como un acuerdo en lugar de una reprensión. El Secretario de Estado ha confirmado que otra encuesta no será entretenida para el futuro previsible."
 devolution.24.a: "La pregunta es contestada, por ahora"
 devolution.25.t: "Dublin Acepta"
 devolution.25.d: "El Taoiseach ha confirmado a la Cámara que la República aceptará soberanía sobre Irlanda del Norte. La transferencia procederá en virtud de los términos del Acuerdo, con garantías para la comunidad sindicalista escritas en el acuerdo y ciudadanía británica retenida por todos los que lo deseen. Aquí no hay derrota para vengarse y ningún tratado impuesto a punta de pistola. Un siglo de la pregunta irlandesa cierra con un voto, una entrega y una gran cantidad de personas en Ulster que nunca lo llamarán a casa."
 devolution.25.a: "El pueblo ha hablado"
 devolution.26.t: "Dublin Declines"
 devolution.26.d: "La República se ha negado. Los ministros de Dublín han sido educados al respecto en público y en privado: la subvención por sí sola se tragaría su presupuesto, la carga de seguridad es una que no tienen capacidad para llevar, y no hay apetito en los veintiséis condados por heredar a una minoría sindicalista que les considera un poder extranjero. El Norte votó para irse y se le ha dicho que no hay donde ir. La opinión nacionalista ha tomado la negativa como una humillación, y es Westminster que vivirá con las consecuencias."
 devolution.26.a: "Quedamos en la provincia."
 devolution.27.t: "El Ulster Rising"
 devolution.27.d: "Stormont se ha ido, el Acuerdo es una carta muerta, y la garantía constitucional que mantuvo al movimiento republicano dentro de la política fue con él. Lo que comenzó como disturbios después de la derogación se ha convertido en algo que el Jefe de Policía ya no describirá como desorden público. Las comisarías de policía han sido invadidas, las patrullas del ejército están contratando armas pesadas a la luz del día y una administración provisional que reclama autoridad sobre los seis condados ha declarado a la provincia independiente de la Corona. La última vez que Gran Bretaña luchó contra esta guerra tomó treinta años y un acuerdo negociado para terminarla. No hay acuerdo para volver a caer ahora."
 devolution.27.a: "Entonces lo recuperamos por la fuerza."
 devolution.28.t: "El ascenso a través de la frontera"
 devolution.28.d: "Los británicos han roto el Acuerdo y el Norte está en abierta revuelta. Un gobierno provisional en Belfast ha apelado a Dublín para su reconocimiento, armas y hombres, y el llamamiento se ha hecho públicamente lo suficiente como para que el silencio sea leído como respuesta. Los artículos dos y tres fueron modificados, no olvidados, y hay una circunscripción aquí que ha esperado toda la vida por este momento. También hay un ejército británico, un disuasor nuclear británico y todos los argumentos que la República ha formulado desde 1998 en el sentido de que la frontera se cambiaría por consentimiento y nada más."
 devolution.28.a: "Reconocimiento del Gobierno Provisional y marcha"
 devolution.28.b: "Armarlos, y no admitir nada"
 devolution.28.c: "Esta no es nuestra guerra."
 ENG_decommission_paramilitaries: "Decomiso de los paramilitares"
 ENG_decommission_paramilitaries_desc: "La Comisión Internacional Independiente de Desmantelamiento se ha sentado desde 1997 sin haber recibido un arsenal completo. Las facciones republicanas disidentes que rechazaron el Acuerdo no tienen interés en desarmar mientras todavía pueden reclutar, y reclutan donde las propiedades sean pobres y la tensión es alta. Poner el dinero y el capital político detrás de la Comisión, mantener la Tensión sectaria lo suficientemente baja que los intermediarios seguirán hablando, y darle dos años más allá del proceso permanentemente.\n\nRequiere el §YAcuerdo de Viernes Santo§! como su marco.\n\nTensión sectaria: §Y[?ENG_north_irish_agitation|0]§!/§G15§!\nDependencia de Irlanda del Norte: §Y[?ENG_north_irish_dependency|0]§!/§G60§!\nDesempleo: §Y[?total_unemployed_percentage_display|%]§!/§G10%§!"
 ENG_call_border_poll: "Convocar un referéndum fronterizo"
 ENG_call_border_poll_desc: "El Acuerdo obliga al Secretario de Estado a hacer una votación siempre que parezca probable que la mayoría en Irlanda del Norte votará por una Irlanda unida, y obliga al gobierno británico a dar efecto al resultado. Las partes nacionalistas ahora mantienen el equilibrio en Stormont y la demanda ya no puede aplazarse sin que se rompa el Acuerdo de manera directa. Una encuesta toma un año para la campaña y el resultado será cualquiera que sea la opinión irlandesa del Norte se ha convertido para el momento en que se cuenta, por lo que el año de la campaña importa tanto como la decisión de llamarlo.\n\nLos paramilitares deben ser decomisados primero. Ninguna encuesta sostenida bajo la amenaza del arma sería aceptada por ninguna comunidad.\n\nNacionalismo irlandés septentrional: §Y[?ENG_north_irish_nationalists|0]§!/§G55§!"
 ENG_border_poll_mission: "La campaña de las encuestas fronterizas"
 ENG_border_poll_mission_desc: "La encuesta ha sido llamada y la campaña tiene un año para correr. El resultado será decidido por donde el nacionalismo irlandés del norte se encuentra en el día de la votación, no donde estuvo cuando se nombró la fecha. Una clara mayoría nacionalista lleva a la Provincia fuera de la Unión y a la República, siempre que Dublín lo tome. Cualquier cosa menos que eso deja la cuestión constitucional cerrada durante años y un movimiento nacionalista que ha sido golpeado en la urna electoral y lo sabe.\n\nNacionalismo irlandés septentrional: §Y[?ENG_north_irish_nationalists|0]§!\nUn Sí claro requiere más de §G65§!."
 ENG_all_ireland_dominion: "An All-Ireland Dominion"
 ENG_all_ireland_dominion_desc: "Con la República ya contestando a Londres, la frontera se ha convertido en una línea administrativa más que constitucional. La entrega de los seis condados a Dublín no nos cuesta nada que ya no hayamos asegurado: toda la isla está gobernada de un capital que es gobernado por nosotros. Se establece la mayor queja en estas islas a nuestro favor y a nuestra conveniencia, retira la subvención y la guarnición, y deja el movimiento republicano con una Irlanda unida que no puede celebrar.\n\nEsto requiere que la devolución irlandesa del Norte se resuelva realmente primero. Una provincia entregada en medio de una crisis es una crisis exportada, no resuelta.\n\nTensión sectaria: §Y[?ENG_north_irish_agitation|0]§!/§G10§!\nDependencia de Irlanda del Norte: §Y[?ENG_north_irish_dependency|0]§!/§G70§!\nPresión de la independencia: §Y[?ENG_north_irish_pressure|0]§!/§G40§!"
 ENG_repeal_good_friday_agreement: "Derogar el Acuerdo del Viernes Santo"
 ENG_repeal_good_friday_agreement_desc: "El Acuerdo nos cuesta una subvención permanente, un establecimiento de policía inflado y un ejecutivo de reparto del poder en el que los hombres que una vez realizaron campañas de bombardeo ocupan cargos ministeriales. Repetirlo, suspender Stormont y gobernar la provincia directamente desde Londres como lo hicimos antes de 1998. Los ahorros son inmediatos y todo lo demás: la garantía constitucional que mantuvo al movimiento republicano dentro de la política desaparece, los paramilitares regresan, y la Tensión sectaria se sentirá a su pleno peso sin nada para suavizarla.\n\nUlster se levantará. Tendremos una cuestión de meses para detener a la Provincia antes que lo haga."
 ENG_repeal_gfa_remove_TT: "Retire §Y$ENG_good_friday_agreement$§!"
 ENG_ulster_on_the_brink_activated_TT: "Activa §RUlster on the Brink§!: tenemos §Y180§! días para forzar la Tensión Sectar del Norte de Irlanda abajo §G20§!, o el liderazgo republicano provisional declara y luchamos por la Provincia."
 ENG_ulster_on_the_brink: "Ulster en el Brink"
 ENG_ulster_on_the_brink_desc: "El Acuerdo se ha ido y la Provincia está desmoronándose. El enfrentamiento se ha sostenido, el ejército está de vuelta en las calles en números no vistos desde los años setenta, y ambas comunidades están armando sobre la suposición de que nadie viene a protegerlos. Si la Tensión sectaria puede ser forzada a retroceder dentro de los seis meses, la provincia se puede celebrar sin un acuerdo y sin un aumento. Si no puede, el liderazgo republicano provisional declarará y estaremos luchando por Ulster.\n\nTensión sectaria: §Y[?ENG_north_irish_agitation|0]§!\nDebe caer debajo §G20§!."
 OPEN_devolution_BUTTON: "Cuestiones debatidas"
 OPEN_devolution_BUTTON_TT: "Abra el panel de devoluciones y gestione Escocia, Gales e Irlanda del Norte."
