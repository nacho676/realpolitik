 PMR_use_kobasna: "Vaciar los depósitos de armas §Y[PMR.GetFlag]Transnistrios§!"
 PMR_russia_moldovian_way: "Consejo Supremo"
 PMR_russia_moldovian_way_desc: "\n\n\n\n\n\n£PMR_desctext_rusmlv \n\n\n\n\n\n\n\n\nEl Consejo Supremo de la República Moldaviana Pridnestrova es, según la Constitución de la República Moldaviana Pridnestroviana, el órgano representativo y único legislativo del poder estatal de la República Moldaviana Pridnestroviana no reconocida."
 PMR_moldova_refendum: "Realizar un referéndum sobre la unión con [MLV.GetFlag]§YMoldavia§!"
 PMR_russia_refendum: "Realizar un referéndum sobre la unión con [SOV.GetFlag]§YRusia§!"
 PMR_annex_gagauzia: "Integración de §Y[GGZ.GetNameWithFlag]§!"
 PMR_annex_odessa: "Integración de §Y[OPR.GetNameWithFlag]§!"
 PMR_kazaks_prepare: "El Ejército Cosaco del Mar Negro"
 PMR_kazaks_prepare_desc: "\n\n\n\n\n\n£PMR_desctext_kazaki \n\n\n\n\n\n\n\n\n§YLos orígenes§! del resurgimiento del §Yejército cosaco del Mar Negro§! se originan en la historia de los §Gcosacos de Zaporozhye§! y el §GZaporozhye Sich§!, §Rliquidado§! en 1775. Creado a finales de 1787 a partir de grupos dispares de §Gcosacos de Zaporozhye§!, el §Y\"Ejército de Cosacos Leales de Zaporozhye\"§! se convirtió en un escudo confiable de la [SOV.GetFlag]§Y Rusia§! en el sur entre los ríos Dniéster y Bug, en tierras, una parte importante de las cuales ahora forma parte de [PMR.GetFlag]§YTransnistria§!. Los §Ycosacos del Mar Negro§!, que estaban cubiertos con la gloria de las victorias en la [SOV.GetFlag][TUR.GetFlag]§Rguerra ruso-turca§! de 1787-1791, fueron reasentados por Decreto de la Emperatriz Catalina II después del final de la guerra en 1792-1793. al [KUB.GetFlag]§YKuban§!, donde el §YEjército Cosaco del Mar Negro§! continuó sirviendo en la protección de las fronteras del sur de la [SOV.GetFlag]§Y Rusia§! hasta 1860, cuando se fusionó con el §YEjército de la Línea del Cáucaso§! y se conoció como [KUB.GetFlag]§Yel Ejército Cosaco de Kuban§!. Los cambios abruptos en la vida de la sociedad en §Rla Unión Soviética§! y la amenaza inminente a la integridad del estado causaron a finales de los 80 un movimiento para revivir a los §Ycosacos§!, que a lo largo de su historia centenaria ha sido un recolector y un escudo confiable de la §YPatria§!. Después de más de medio siglo de olvido y distorsión de la esencia de los §Ycosacos§!, §Rrepresión§! y §Rgenocidio§!, se volvió a hablar de los §Ycosacos§! como una parte integral de la historia del [SOV.GetFlag]§Yestado ruso§!. Ahora, además del ejército principal, [PMR.GetFlag]§YTransnistria§! también tiene la oportunidad de movilizar destacamentos §Ycosacos§! para la §Rguerra§!, que se convertirán en la base de apoyo del ejército en la guerra contra los enemigos."
 PMR_kazak_kamensk: "§YMovilizar§! a los cosacos del distrito de Kamensky"
 PMR_kazak_ryibninsk: "§YMovilizar§! a los cosacos del distrito de Rybnitsa"
 PMR_kazak_dubossar: "§YMovilizar§! a los cosacos del distrito de Dubossary"
 PMR_kazak_slobodze: "§YMovilizar§! a los cosacos del distrito de Slobodzeya"
 PMR_kazak_benderi: "§YMovilizar§! a los cosacos de Bender"
 PMR_smirnov_era: "La Era Smirnov"
 PMR_smirnov_era_desc: "Igor Smirnov. Un verdadero ícono de nuestra gran nación. Sirve a la patria que nos está destinada. Confiamos en él para que nos guíe hacia el futuro brillante que merecemos. Este héroe es la razón por la que todos estamos aquí. Smirnov es el pegamento que nos mantiene unidos y enfocados en un solo objetivo. Sin él, esta nación nunca habría existido. Somos el último bastión comunista verdadero de la URSS."
 PMR_father_of_the_nation: "El Padre de Nuestra Nación"
 PMR_father_of_the_nation_desc: "Igor Smirnov es sin duda quien creó nuestra nación; gracias a él, nuestro pueblo existe en principio; fue él quien nos guió en el momento de nuestra lucha por la independencia."
 PMR_denomination: "Realizar una Denominación"
 PMR_denomination_desc: "Nuestra moneda ha crecido a cifras tan astronómicas que es físicamente imposible para nuestros ciudadanos comprar suficientes bienes, por lo que llevaremos a cabo una denominación urgente."
 PMR_privatization: "Privatización"
 PMR_privatization_desc: "Llevaremos a cabo la privatización de las empresas, no más control estatal total."
 PMR_internet: "Desarrollo de Internet"
 PMR_internet_desc: "Comenzaremos el desarrollo de redes de Internet en nuestro país, pero es necesario consolidar de inmediato el derecho de censura en este ámbito."
 PMR_interrao: "Interrao"
 PMR_interrao_desc: "La empresa rusa Inter Rao quiere comprar nuestra planta hidroeléctrica e invertir fondos sustanciales en ella para modernizar los componentes técnicos."
 PMR_railway: "Restauración de la Infraestructura"
 PMR_railway_desc: "Las consecuencias de la guerra con Moldavia aún se dejan sentir. Nuestra infraestructura aún no se ha restaurado, es hora de arreglarla."
 PMR_anti_opposition: "Reprimir la Oposición"
 PMR_anti_opposition_desc: "La actividad de la oposición en nuestro país será reprimida activamente, tal vez no tan abiertamente como en otros países, pero no permitiremos que nuestro país se tambalee."
 PMR_media: "Censura en la Televisión"
 PMR_media_desc: "Debemos tomar el control de la televisión; no permitiremos que las figuras de la oposición hablen allí."
 PMR_imprison: "Represión contra Opositores Agresivos"
 PMR_imprison_desc: "Algunos opositores están literalmente dispuestos a lanzarnos cócteles molotov; los enviaremos a prisión."
 PMR_sheriff_based: "Apoyar la Influencia del Sheriff"
 PMR_sheriff_based_desc: "Tenemos la intención de preservar y mantener la influencia del holding Sheriff en nuestra república, a pesar de las consecuencias negativas de su monopolio."
 PMR_dictatorship: "Dictadura Transnistria"
 PMR_dictatorship_desc: "Nos llamarán dictadores, y nuestro régimen será una dictadura, pero nuestro pueblo dormirá tranquilo."
 PMR_anti_moldav_rhetoric: "Retórica Anti-Moldava"
 PMR_anti_moldav_rhetoric_desc: "Nuestra unificación con Moldavia nunca se producirá, no tenemos intención de permitirlo y lo promoveremos activamente en los medios de comunicación y otros medios para influir en la población."
 PMR_referendums: "Referéndum sobre el Estatus de Transnistria"
 PMR_referendums_desc: "Tenemos la intención de realizar un referéndum sobre el estatus de Transnistria para que nuestro pueblo pueda finalmente decidir cómo quieren ver el futuro de nuestro estado."
 PMR_krasno: "Vadim Krasnoselsky"
 PMR_krasno_desc: "Vadim Nikolaevich Krasnoselsky es un estadista pridnestroviano, político y figura de los organismos de asuntos internos. Presidente del Consejo Supremo de la República Moldava Pridnestroviana, Mayor General de la milicia."
 PMR_military_reform: "Reforma Militar"
 PMR_military_reform_desc: "Nuestro ejército necesita una reforma militar; claramente estamos rezagados respecto a nuestros vecinos en equipamiento técnico y de combate."
 PMR_russian_flag: "La Bandera Rusa es la Segunda Bandera del Estado"
 PMR_russian_flag_desc: "Adoptaremos la bandera rusa como la segunda bandera del estado para indicar inmediatamente nuestro objetivo final: la integración en Rusia."
 PMR_romanovs: "Veneración de los Romanov"
 PMR_romanovs_desc: "La tragedia de la familia Romanov es la tragedia de cada nación del antiguo Imperio Ruso, y honraremos su memoria."
 PMR_soc_ref: "Reformando nuestro cuidado"
 PMR_soc_ref_desc: "Nuestra nueva reforma social estará dirigida principalmente a ciudadanos con discapacidades, y les proporcionaremos todo lo necesario para su plena integración en la sociedad."
 PMR_cis_2: "Asociación con los países de la CEI-2"
 PMR_cis_2_desc: "Continuaremos fortaleciendo nuestros lazos amistosos con los países de la CEI-2; ellos entienden nuestra situación política y económica como nadie."
 PMR_deccomus: "Iniciar la Descomunización"
 PMR_deccomus_desc: "Nos esforzaremos por devolver a las ciudades y pueblos sus nombres verdaderos, que existían en los tiempos del Imperio Ruso."
 PMR_free_internet: "Una red libre"
 PMR_free_internet_desc: "Internet debe estar libre de censura; la dictadura no decidirá lo que piensa la gente."
 PMR_orthodoxy: "Apoyo a la Iglesia Ortodoxa"
 PMR_orthodoxy_desc: "Apoyaremos activamente la ortodoxia en nuestro país porque es nuestro ancla espiritual."
 PMR_lgbt: "Lucha por la Familia Tradicional"
 PMR_lgbt_desc: "Nuestro país no necesita valores LGBT; solo la familia del Imperio Ruso es grande y amigable."
 PMR_arms: "Permitir el Porte Libre de Armas"
 PMR_arms_desc: "Los bandidos pueden conseguir armas de cualquier manera; ¿por qué no damos a los ciudadanos la oportunidad de defenderse?"
 PMR_continues: "Sin Cambiar de Rumbo"
 PMR_continues_desc: "Continuaremos siguiendo nuestro camino y no lo cambiaremos. Transnistria no necesita cambios políticos radicales."
 PMR_tourism: "Desarrollo del Turismo"
 PMR_tourism_desc: "Debemos comenzar a desarrollar el sector turístico; nuestra región es atractiva y claramente será de interés para los turistas."
 PMR_hate_mlv: "Crítica a Moldavia"
 PMR_hate_mlv_desc: "Hablamos firmemente y con claridad: nuestros caminos se separaron de Moldavia hace mucho tiempo."
 PMR_vs_pmr: "El Ejército de Transnistria"
 PMR_vs_pmr_desc: "Incluso un estado tan pequeño y no reconocido tiene sus propias fuerzas armadas, debemos fortalecer nuestro ejército para repeler amenazas a nuestra independencia."
 PMR_ground: "Las Fuerzas Armadas de Transnistria"
 PMR_ground_desc: "Las Fuerzas Armadas de la República Moldaviana Pridnestroviana, las fuerzas armadas de la República Moldaviana Pridnestrova (PMR), no reconocidas, fueron establecidas el 6 de septiembre de 1991 para proteger al pueblo, soberanía, independencia e integridad territorial de la PMR."
 PMR_lebed_academy: "Instituto Militar del Ministerio de Defensa"
 PMR_lebed_academy_desc: "Institución militar superior con sede en Tiráspol que es operada por el departamento militar de las Fuerzas Armadas de Transnistria. Es la institución educativa más importante en las fuerzas armadas."
 PMR_suvorov_academy: "Instituto Militar del Ministerio de Defensa"
 PMR_suvorov_academy_desc: "Necesitamos reponer a los oficiales de nuestro ejército de manera regular, lo cual facilita nuestra universidad militar bajo el Ministerio de Defensa."
 PMR_exer: "Ejercicios Militares con el Ejército Ruso"
 PMR_exer_desc: "El ejército ruso está listo para realizar ejercicios regulares con nuestras tropas para transferir experiencia de combate moderna."
 PMR_upgrade: "Actualizar el Equipo del Ejército"
 PMR_upgrade_desc: "Estamos listos para actualizar el equipo de nuestro ejército, ya que el nuestro no se ha actualizado desde la Guerra de Independencia."
 PMR_chechen: "La Experiencia de la Guerra de Chechenia"
 PMR_chechen_desc: "Rusia está dispuesta a compartir su experiencia en la guerra contra la República de Ichkeria, que es información y experiencia indispensable para nosotros."
 PMR_military: "Industria Militar"
 PMR_military_desc: "No debemos esperar que las existencias en nuestros almacenes duren para siempre, es necesario establecer la producción de nuestras propias armas."
 PMR_new_army: "El Nuevo Ejército de Transnistria"
 PMR_new_army_desc: "Nuestras reformas han dado resultados, la imagen de nuestro ejército ha cambiado."
 PMR_spec: "Doctrina de las Fuerzas Especiales"
 PMR_spec_desc: "Nos centraremos en nuestras fuerzas especiales para llevar a cabo operaciones de combate contra un enemigo condicional."
 PMR_pograncy: "Tropas Fronterizas"
 PMR_pograncy_desc: "Mejoraremos el financiamiento y el apoyo a las tropas fronterizas de nuestra república, porque nuestras fronteras están constantemente bajo amenaza de invasión enemiga."
 PMR_doctrine: "Doctrina de Política Exterior"
 PMR_doctrine_desc: "Estos pequeños Estados deben estar siempre preparados para un ataque de vecinos más grandes, pero debemos tener claro quién nos atacará."
 PMR_iskander: "Solicitar Iskanders Rusos"
 PMR_iskander_desc: "Los sistemas de misiles Iskander rusos pueden ser un excelente argumento contra atacarnos."
 PMR_euiqp: "Comprar Armas en Rusia"
 PMR_euiqp_desc: "Compraremos un gran lote de armas de Rusia para actualizar nuestras fuerzas terrestres."
 PMR_air: "Fuerza Aérea de Transnistria"
 PMR_air_desc: "Nuestra Fuerza Aérea prácticamente no existe, es necesario crear al menos una flota aérea mínima para proteger las fronteras aéreas de nuestra patria."
 PMR_air_academy: "Academia de la Fuerza Aérea"
 PMR_air_academy_desc: "Los futuros pilotos deben ser entrenados aquí en casa, y crearemos una academia especial para ello."
 PMR_instructors: "Instructores Rusos"
 PMR_instructors_desc: "Nuestros futuros pilotos serán instruidos por pilotos rusos."
 PMR_vvs_rf: "Cooperación con la Fuerza Aérea Rusa"
 PMR_vvs_rf_desc: "Llevaremos la cooperación con la Fuerza Aérea Rusa al máximo."
 PMR_kazaks: "Levantar un Regimiento Cosaco para la Batalla"
 PMR_kazaks_desc: "Desde finales del siglo pasado, se creó el Ejército Cosaco del Mar Negro en las filas de nuestras Fuerzas Armadas. Ahora que la guerra está a nuestras puertas, deben ser llamados a la guerra."
 PMR_shevchuk: "El Segundo Presidente de Transnistria"
 PMR_shevchuk_desc: "Ha llegado la hora del cambio; ahora un nuevo presidente asumirá la jefatura de Transnistria. ¿Quién nos guiará hacia un futuro brillante, o quizás no?"
 PMR_anti_smirnov: "Campaña Política contra Smirnov"
 PMR_anti_smirnov_desc: "Igor Smirnov ha hecho mucho por el establecimiento de Transnistria como un estado independiente, pero desafortunadamente, en los últimos años, ha dañado más al estado de lo que lo ha ayudado. Lucharemos contra su influencia."
 PMR_prepare_for_russia: "Prepararse para la Integración con Rusia"
 PMR_prepare_for_russia_desc: "Continuaremos el curso pro-ruso de nuestro predecesor y emitiremos un decreto sobre la preparación para la integración de nuestra legislación con la rusa."
 PMR_economist_from_russia: "Pedir Especialistas Económicos Rusos"
 PMR_economist_from_russia_desc: "Tenemos la intención de ofrecer a especialistas rusos del banco central que nos ayuden a reformar nuestra economía."
 PMR_agriculture_from_russia: "Asistencia Rusa en la Industria Agrícola"
 PMR_agriculture_from_russia_desc: "La agroindustria rusa puede brindarnos una gran ayuda en nuestro desarrollo, tenemos la intención de invitar a sus especialistas a nuestro país."
 PMR_against_sheriff: "Luchar contra Sheriff"
 PMR_against_sheriff_desc: "Lucharemos contra la influencia de este holding, y nuestra república será libre."
 PMR_mlv: "Intentar Establecer Relaciones con Moldavia"
 PMR_mlv_desc: "Intentaremos establecer relaciones con Moldavia; quizás incluso podamos ofrecerles formas de integrar nuestros estados."
 PMR_pro_ukraine: "El Camino a Ucrania"
 PMR_pro_ukraine_desc: "Consideramos que nuestro hogar histórico es Ucrania; nos esforzaremos por unirnos a ella."
 PMR_expel_russian: "Expelen a los Pacificadores"
 PMR_expel_russian_desc: "Nuestros caminos con Rusia divergen en esto, es hora de que sus cascos azules abandonen nuestro país."
 PMR_invite_ukrainians: "Invitar a Cascos Azules Ucranianos"
 PMR_invite_ukrainians_desc: "Tenemos la intención de invitar a cascos azules ucranianos para defendernos de la agresión moldava."
 PMR_ukr_corps: "Dejar Entrar a Corporaciones Ucranianas"
 PMR_ukr_corps_desc: "Permitiremos que las Corporaciones Ucranianas entren en nuestro mercado, lo que tendrá un impacto positivo en nuestra economía"
 PMR_ukr_law: "Integración en la Legislación Ucraniana"
 PMR_ukr_law_desc: "Tenemos la intención de hacer que nuestra legislación sea uniforme con la de Ucrania, para la futura integración"
 PMR_propaganda: "Propaganda Pro-Ucraniana"
 PMR_propaganda_desc: "Difundiremos activamente propaganda pro-ucraniana en nuestra esfera mediática."
 PMR_contacts: "Contactos con el Gobierno de Ucrania"
 PMR_contacts_desc: "Estableceremos contacto con el gobierno ucraniano e informaremos de nuestro deseo de integrarnos en su país."
 PMR_ref_join_ukr: "El Referéndum sobre la Incorporación a Ucrania"
 PMR_ref_join_ukr_desc: "Estamos listos para anunciar nuestro deseo de convertirnos en parte de Ucrania."
 PMR_ukraine_influency_TT: "[UKR.GetFlag] Influencia §HUcraniana§! en §Y[ROOT.GetNameWithFlag]§!: §R+15%§!"
 PMR_ukr_army: "Cascos Azules Ucranianos"
 PMR_sheriff_pmc: "Crear Nuestras Propias PMCs"
 PMR_sheriff_pmc_desc: "Estamos listos para crear nuestras propias PMCs."
 PMR_sheriff_state: "El Estado es una Corporación"
 PMR_sheriff_state_desc: "Hemos completado nuestro gran plan."
 PMR_path: "Integración de Moldavia"
 PMR_path_desc: "Comenzaremos la integración de las tierras de la antigua Moldavia en nuestro estado."
 PMR_integr_economy: "Integración Económica"
 PMR_integr_economy_desc: "Para empezar, debemos llevar a cabo la integración económica, regulando todos los aspectos de nuestra futura economía unificada."
 PMR_political: "Integración Política"
 PMR_political_desc: "Los asuntos de la estructura de nuestro nuevo estado y varios asuntos de integración política también deben resolverse."
 PMR_true: "Somos la Verdadera Moldavia"
 PMR_true_desc: "Asumimos el papel del estado moldavo, como lo fue una vez la RSS de Moldavia."
 PMR_integrate_mlv_place: "Integración de las Tierras Moldavas"
 PMR_integrate_mlv_place_desc: "Reconocemos plenamente nuestro derecho sobre las tierras que alguna vez estuvieron bajo el dominio de Moldavia. Estas son nuestras tierras, y siempre lo serán; estamos listos para integrarlas."
 PMR_full: "Estado Unitario"
 PMR_full_desc: "Seguiremos el camino del unitarismo; la autonomía puede perjudicarnos."
 PMR_no_autonomy: "El Principio de Falta de Autonomía"
 PMR_no_autonomy_desc: "La falta de autonomía es la garantía de nuestro estado en ausencia de separatismo."
 PMR_kabardiners: "Tropas de Carabineros"
 PMR_kabardiners_desc: "Las Tropas de Carabineros son la fuerza de gendarmería nacional de Transnistria. Los Carabineros de Transnistria deben garantizar, junto con la policía o de manera independiente, el orden público, la protección de los derechos y libertades de los ciudadanos, las propiedades de los dueños y la prevención de violaciones de la ley. La estructura de la agencia se basa en los Carabineros Italianos, de donde obtiene su nombre."
 PMR_peace_keaper: "Batallón de Mantenimiento de la Paz"
 PMR_peace_keaper_desc: "Crearemos nuestro propio batallón de mantenimiento de la paz para participar en misiones internacionales."
 PMR_const: "Reforma tradicional"
 PMR_const_desc: "Nuestro estado planea cambiar radicalmente su sistema; para esto, comenzaremos con lo principal: la reforma de la Constitución."
 PMR_mon_const: "El gobierno de los Reyes"
 PMR_mon_const_desc: "Las reformas han sido completadas, y estamos listos para anunciar que Transnistria ahora es una monarquía constitucional."
 PMR_opponents: "Lucha contra la Oposición"
 PMR_opponents_desc: "La oposición claramente está insatisfecha con el nuevo sistema estatal y ha intensificado activamente las protestas; debemos lidiar con esto."
 PMR_church: "La Iglesia es una Institución Estatal"
 PMR_church_desc: "Volveremos a la práctica del Imperio Ruso y restauraremos el antiguo estatus de la Iglesia."
 PMR_not_soviet: "No Somos un Fragmento de la URSS"
 PMR_not_soviet_desc: "Transnistria es parte del Imperio Ruso, y cultivaremos activamente esta imagen. Ser un fragmento de la URSS es una desgracia para nosotros."
 PMR_general: "General.Cristiano.Monárquico"
 PMR_general_desc: "Estas son las cualidades inherentes a nuestro líder y que todo patriota ruso debería tener."
 PMR_drozdov: "Revivir el Ejército de Voluntarios"
 PMR_drozdov_desc: "El Ejército de Voluntarios fue creado durante la Guerra Civil Rusa. Defendió los intereses del movimiento blanco y fue un verdadero ejército de patriotas y defensores de Rusia, lo reviviremos y lo lideraremos bajo nuestra bandera."
 PMR_kornilov: "Revivir el Regimiento Kornilov"
 PMR_kornilov_desc: "Honraremos a los soldados caídos del regimiento Kornilov y lo reviviremos en las filas de nuestro ejército."
 PMR_revive: "Revivir el Regimiento Drozdov"
 PMR_revive_desc: "Honraremos a los soldados caídos del regimiento Drozdov y lo reviviremos en las filas de nuestro ejército."
 PMR_commi: "Una unión soviética"
 PMR_commi_desc: "El comunismo ha regresado a Transnistria nuevamente. ¿Gobernarán los comunistas el país nuevamente?"
 PMR_single: "Una dirección única"
 PMR_single_desc: "El Partido Comunista de Transnistria sabe lo mejor en todas las esferas relacionadas con el estado. Si otras personas se interponen en el camino, podremos trabajar en la construcción de una verdadera utopía comunista, y esta vez, tendremos éxito."
 PMR_commi_ideology: "Ideológica Reworking"
 PMR_commi_ideology_desc: "Es hora de traer de vuelta los métodos ideológicos de la educación de la era soviética y traducirlos a una manera moderna."
 PMR_commi_promka: "Revitalización Industrial"
 PMR_commi_promka_desc: "La industria de Transnistria está muriendo gradualmente cada día, es hora de revertir este proceso negativo."
 PMR_collectivism: "El coleccionista Rhetoric"
 PMR_collectivism_desc: "La colectivización ya funcionó una vez, así que repetiremos la experiencia."
 PMR_pioneer: "Pioneros"
 PMR_pioneer_desc: "Los jóvenes no deben estar ociosos, por lo que reviviremos a los pioneros."
 PMR_marxism: "Marxismo en las Escuelas"
 PMR_marxism_desc: "El currículo escolar incluirá necesariamente a Marx."
 PMR_education: "Enseñar libremente"
 PMR_education_desc: "La educación debe ser gratuita y libre para cada ciudadano de nuestro glorioso estado."
 PMR_atheism: "Escuadrón La Iglesia"
 PMR_atheism_desc: "La religión es el opio del pueblo, así que es hora de combatir la religión."
 PMR_fixe: "Primer Plan Quinquenal"
 PMR_fixe_desc: "Los modelos económicos libres de los estados occidentales no tienen futuro para un estado socialista. El regreso a una economía planificada, preferiblemente en forma de planes quinquenales clásicos al estilo soviético, dará al gobierno una influencia sin control sobre la economía anteriormente sin control."
 PMR_workers: "Apoyo a los Trabajadores"
 PMR_workers_desc: "La clase trabajadora es nuestro apoyo y fuerza, y siempre los apoyaremos en la lucha contra la contaminación capitalista."
 PMR_anti_nationalism: "Lucha contra la Oposición"
 PMR_anti_nationalism_desc: "No hay piedad para los elementos destructivos que quieren retrasar nuestro acercamiento al comunismo!"
 PMR_army_corruptions: "Dejen de vender armas"
 PMR_army_corruptions_desc: "Tenemos la intención de detener la venta de armas desde los almacenes de Kolbasnaya, dejar de distribuirlas a diestro y siniestro."
 PMR_clean_governments: "Limpiar el Gobierno"
 PMR_clean_governments_desc: "Todos los elementos corruptos y destructivos serán expulsados de nuestro gobierno."
 PMR_ded_sheriff: "Poner Fin al Control del Sheriff"
 PMR_ded_sheriff_desc: "El control del Sheriff ha mantenido nuestra república bajo su control durante demasiado tiempo! Es hora de terminar con esto."
 PMR_chinese_economic: "Experiencia Económica China"
 PMR_chinese_economic_desc: "Tomaremos el sistema económico chino como base para nuestra política económica, y en nuestra opinión, parece prometedor."
 PMR_national_industry: "Manos encendidas con la industria"
 PMR_national_industry_desc: "Apoyaremos nuestra industria y la desarrollaremos. Nuestro país necesita nuevas empresas para reemplazar las que se perdieron tras el colapso de la URSS."
 PMR_mobilise: "Movilización de los grupos"
 PMR_mobilise_desc: "Nuestro ejército necesita personas para defender los intereses de nuestro país donde el partido lo demande."
 PMR_people_militia_desc: "Estamos listos para adoptar una ley sobre la creación de una milicia popular, que será una especie de reserva para la defensa territorial. En cada pueblo, debe haber un grupo entrenado de personas para contrarrestar al enemigo, con una transformación posterior en un movimiento guerrillero."
 PMR_revoult_spirit: "Un Espíritu Revolucionario"
 PMR_revoult_spirit_desc: "El espíritu de la revolución marcha a través de Transnistria y lo llevaremos adelante."
 PMR_interbrigade: "Brigada Internacional"
 PMR_interbrigade_desc: "Nuestros soldados están listos para participar en el deber internacional de proteger a los ciudadanos sufrientes de otros estados."
 PMR_anti_corrupt_company: "Lucha contra la Corrupción"
 PMR_anti_corrupt_company_desc: "Los funcionarios corruptos no tienen lugar en Transnistria!"
 PMR_new_chinush: "Nueva Generación de Funcionarios"
 PMR_new_chinush_desc: "Criaremos una nueva generación de funcionarios públicos que serán leales al país y no a su billetera."
 PMR_new_five: "Continuar el plan quinquenal"
 PMR_new_five_desc: "El sistema de planes quinquenales no falló durante la era soviética, pretendemos usarlo nuevamente."
 PMR_red_army_pmr: "El Ejército Rojo de Transnistria"
 PMR_red_army_pmr_desc: "Nuestro estado necesita un ejército poderoso, y el más poderoso es el Rojo!"
 PMR_red_moldova: "Devolver la RSS de Moldavia"
 PMR_red_moldova_desc: "Los ciudadanos moldavos han sufrido durante mucho tiempo bajo el yugo de los gobernantes occidentales y sus subordinados, que convirtieron a Moldavia en uno de los países más pobres de Europa y del mundo, es hora de liberarlos de la opresión capitalista."
 PMR_new_trans: "La Nueva Era de Transnistria"
 PMR_new_trans_desc: ""
 PMR_chinese_economic_tt: "[CHI.GetFlag] Multiplicador de §HInfluencia China§!: §R+15%§!"
 PMR_just: "Transnistria Republicana"
 PMR_just_desc: "Nuestro partido promoverá las ideas del socialismo y el patriotismo a las masas. Transnistria ha sido y será independiente!"
 PMR_patriotism: "Guardia Nacional de Transnistria"
 PMR_patriotism_desc: "Usando el ejemplo de otros países, pretendemos crear nuestra propia guardia nacional, que será nuestra herramienta de respaldo en caso de sentimientos rebeldes en otras fuerzas armadas."
 PMR_small_business_support: "Desarrollo Rápido de la Ciencia"
 PMR_small_business_support_desc: "La ciencia siempre ha sido el motor del progreso, y apoyaremos a nuestros científicos, sin importar cuán pocos sean."
 PMR_infra: "Inversiones en Infraestructura"
 PMR_infra_desc: "Nuestros residentes deben moverse por carreteras normales, no por un campo minado."
 PMR_roskosh: "Impuesto de Lujo"
 PMR_roskosh_desc: "Los ricos deben pagar más impuestos, porque nuestro tesoro no es infinito, sino excesivamente pequeño."
 PMR_selhoz: "Plan de Desarrollo Agrícola"
 PMR_selhoz_desc: "La agroindustria es la clave de nuestra supervivencia y saciedad, no pretendemos ser tacaños con las inversiones en esta industria."
 PMR_gos_plan_2: "Gosplan 2.0"
 PMR_gos_plan_2_desc: "Por analogía con los Planes Quinquenales de la URSS, crearemos nuestro propio plan, el llamado Gosplan 2.0."
 PMR_army_prestige: "Aumentar el Prestigio del Ejército"
 PMR_army_prestige_desc: "El prestigio de nuestro ejército debe aumentar, porque si no fuera por estos valientes soldados, nuestra república no existiría."
 PMR_guarantees: "Garantía Las Sociedades"
 PMR_guarantees_desc: "Nuestros ciudadanos deben tener todas las garantías sociales necesarias para sentirse seguros."
 PMR_democracy: "Principios Democráticos"
 PMR_democracy_desc: "Los principios democráticos serán respetados en el territorio de nuestro estado; el totalitarismo y la dictadura son cosa del pasado!"
 PMR_health: "Atención de la salud primero"
 PMR_health_desc: "El sector de la salud en nuestro país ha vivido literalmente sus últimos días; es hora de arreglar esto y dirigir inyecciones de efectivo a este sector."
 PMR_economic: "Reformas Económicas"
 PMR_economic_desc: "Los líderes anteriores de Transnistria nos dejaron con un sistema económico debilitado y corrupto. Necesitamos llevar a cabo reformas y desregulación."
 PMR_family: "La Familia es el Valor Principal"
 PMR_family_desc: "El apoyo familiar se convertirá en uno de nuestros principales programas sociales. Criaremos una nueva generación de personas que crearán familias maravillosas y grandes."
 PMR_corruptable: "La corrupción termina aquí"
 PMR_corruptable_desc: "Los funcionarios corruptos serán castigados!"
 PMR_indep: "Independencia Política"
 PMR_indep_desc: "Nuestro país debe decidir finalmente por sí mismo lo que necesita y no someterse a fuerzas internas ni externas."
 PMR_mvd_true: "Ministerio del Interior"
 PMR_mvd_true_desc: "Ahora que nuestros organismos en el Ministerio del Interior podrán trabajar realmente en beneficio de la república, eliminaremos a todos los funcionarios corruptos de este ministerio."
 PMR_banner: "Pueblo Unido y Fuerte"
 PMR_banner_desc: "Nuestra gente está lista para continuar luchando por su independencia y un futuro feliz."
 transnistria.5.t: "Elecciones Anticipadas"
 transnistria.5.d: ""
 transnistria.5.a: "Yevgeny Shevchuk"
 transnistria.5.b: "Igor Smirnov"
 transnistria.5.c: "Anatoliy Kaminski"
 transnistria.6.t: "La Estatua de Lenin Desaparece"
 transnistria.6.d: "La estatua del revolucionario ruso Vladimir Lenin ha desaparecido misteriosamente de la capital, Tiráspol. ¿Deberíamos comenzar la búsqueda de la estatua o abandonarla por completo?"
 transnistria.6.a: "Comenzar búsquedas"
 transnistria.6.b: "Esto es una pérdida de tiempo"
 transnistria.7.t: "El Renacimiento de Vladimir Lenin"
 transnistria.7.d: "Después de que las búsquedas resultaran fatales para encontrar la estatua, el presidente [PMR.GetLeader] fue encontrado muerto en su oficina, solo para que la estatua de Vladimir Lenin fuera encontrada en su lugar como presidente y ahora él parece liderar nuestra gran nación como lo hizo durante la Revolución Rusa."
 transnistria.7.a: "Y Lenin es joven otra vez!"
 transnistria.8.t: "El Futuro de Transnistria"
 transnistria.8.d: "Después de la reciente unificación de Moldavia con Rumania, nuestra nación ahora está en su punto más crucial, ya que nos enfrentamos a una fuerza aún mayor que antes y, si queremos que nuestras tradiciones sobrevivan, debemos decidir el futuro de nuestra nación. Para empezar, una gran parte de nuestra población ha expresado un gran apoyo a la unificación con la Federación Rusa, principalmente debido a lazos históricos y culturales. Otra propuesta llama a la unificación con nuestro vecino Ucrania, diciendo que sería una mejor opción principalmente porque Rusia no tiene conexión terrestre con Transnistria y que también compartimos muchas similitudes con el pueblo ucraniano. Finalmente, otra propuesta llama a mantener la independencia de Transnistria y el multiculturalismo y no dejar que nuestra nación y valores caigan en manos de potencias extranjeras, que es lo que nuestra nación defendió en la guerra de Transnistria de 1992. El país está dividido y una opción podría afectarnos para bien o para mal."
 transnistria.8.a: "Nos uniremos con nuestros hermanos y hermanas rusos!"
 transnistria.8.b: "Nos uniremos con nuestros hermanos y hermanas ucranianos!"
 transnistria.8.c: "Mantendremos nuestra independencia!"
 transnistria.9.t: "Transnistria Solicita Unificación"
 transnistria.9.d: "Después de la reciente unificación de Moldavia con Rumania, Transnistria, temiendo ser absorbida por Rumania, ha solicitado convertirse en territorio de [ROOT.GetName]. Aunque esta es una gran oportunidad para nosotros de extender nuestra influencia en la región, así como para mostrar nuestro poderío militar, Transnistria aún es reclamada por Rumania y, si la integramos, podríamos estar en desacuerdo con Rumania, por lo tanto, debemos elegir sabiamente."
 transnistria.9.a: "Integrar Transnistria a [ROOT.GetName]"
 transnistria.9.b: "Rechazar la oferta de Transnistria"
 transnistria.10.t: "[FROM.GetName] Acepta"
 transnistria.10.d: "Hoy [FROM.GetName] ha aceptado nuestra solicitud de unificación y está en el proceso de trabajar con nuestra administración para asegurar una transición suave."
 transnistria.10.a: "Unámonos con nuestros hermanos y hermanas!"
 transnistria.11.t: "[FROM.GetName] Rechaza"
 transnistria.11.d: "Hoy [FROM.GetName] ha rechazado nuestra solicitud de integración, por lo tanto, Transnistria tendrá que hacerlo sola."
 transnistria.11.a: "Una oportunidad perdida"
 transnistria.12.t: "[FROM.GetName] Acepta"
 transnistria.12.d: "Hoy [FROM.GetName] ha aceptado nuestra solicitud de unificación y está en el proceso de trabajar con nuestra administración para asegurar una transición suave."
 transnistria.12.a: "Unámonos con nuestros hermanos y hermanas!"
 transnistria.14.t: "Nuevas Fábricas"
 transnistria.14.d: "Necesitamos fábricas para asegurar que nuestra economía pueda avanzar. Dicho esto, podríamos usar ese dinero para fortalecer nuestro ejército. ¿Deberíamos apoyar nuestra industria civil o militar?"
 transnistria.14.a: "Construir una Fábrica Civil."
 transnistria.14.b: "Construir una Fábrica Militar."
 transnistria.15.t: "La Economía Refinada"
 transnistria.15.d: "La economía está creciendo. Es el momento de decidir qué futuro deseamos para nosotros mismos. Podríamos seguir creciendo nuestra economía y convertirnos en una potencia económica regional o usar nuestra actual fuerza económica para construir un gran ejército."
 transnistria.15.a: "El Futuro Civil es nuestra mejor opción."
 transnistria.15.b: "Queremos un Futuro Militar."
 transnistria.16.t: "El Referéndum Sobre la Incorporación a Rusia"
 transnistria.16.d: "Transnistria celebró otro referéndum sobre la adhesión a nuestro país. El pueblo votó unánimemente \"sí\". ¿Estaremos a la altura de sus expectativas o las rechazaremos?"
 transnistria.16.a: "Sí"
 transnistria.16.b: "No"
 transnistria.17.t: "Transnistria Quiere Regresar a Nuestro País"
 transnistria.17.d: "Transnistria realizó un referéndum sobre la incorporación, aunque es más correcto llamarlo regreso a Moldavia. Su resultado fue positivo, ahora podemos finalmente resolver el conflicto transnistrio."
 transnistria.17.a: "Transnistria es nuestra"
 transnistria.17.b: "No los necesitamos."
 transnistria.18.t: "La Doctrina Militar de Transnistria"
 transnistria.18.d: "Nuestro país está atrapado entre dos fuegos, y nuestra doctrina militar debería reflejar el estado de nuestro país. ¿A quién consideraremos como un posible oponente?"
 transnistria.18.a: "Rumania"
 transnistria.18.b: "Ucrania"
 transnistria.19.t: "Transnistria Nos Pide Proveerles con Iskanders"
 transnistria.19.d: "El gobierno transnistrio nos ha ofrecido colocar Iskanders en su territorio para garantizar aún más la seguridad de su territorio. ¿Estaríamos de acuerdo con un paso tan arriesgado?"
 transnistria.19.a: "Sí"
 transnistria.19.b: "No"
 transnistria.20.t: "Levantamiento en Odesa"
 transnistria.20.d: "En la mañana recibimos noticias bastante inesperadas y desagradables, un levantamiento separatista tuvo lugar en Odesa bajo las consignas de independencia de una cierta República de Odesa. Además, los rastros de los separatistas vienen directamente desde Transnistria"
 transnistria.20.a: "¿WTF?"
 transnistria.21.t: "Lealistas de Gagauzia"
 transnistria.21.d: "Podemos debilitar aún más a Moldavia intentando levantar una rebelión gagauza en la república del mismo nombre, pero nos costará algo de dinero, además, no sabemos con certeza si tendremos tiempo de acudir en su ayuda."
 transnistria.21.a: "Levantar una Rebelión"
 transnistria.21.b: "No"
 transnistria.22.t: "Ucrania Entregó Odesa a Nosotros"
 transnistria.22.d: "El gobierno ucraniano no tomó medidas activas y no entró en confrontación con nosotros, lo cual nos sorprendió incluso a nosotros."
 transnistria.22.a: "Esto.... ¿Buenas noticias?"
 transnistria.23.t: "El Presidente General"
 transnistria.23.d: "Nuestro Presidente, habiendo declarado también ser el comandante en jefe, tomó el liderazgo de las fuerzas armadas para participar personalmente en las operaciones militares de nuestro país, si es necesario"
 transnistria.23.a: "Bueno"
 transnistria.24.t: "Integración de la Legislación Rusa"
 transnistria.24.d: "Hemos decidido integrar la legislación rusa en la nuestra, ahora nuestra unificación con Rusia será mucho más fácil... Si ocurre, por supuesto."
 transnistria.24.a: "Bueno"
 transnistria.25.t: ""
 transnistria.25.d: ""
 transnistria.25.a: "Bueno"
 transnistria.26.t: "El Referéndum Sobre la Incorporación a Ucrania"
 transnistria.26.d: "Transnistria celebró otro referéndum sobre la adhesión a nuestro país. El pueblo votó unánimemente \"sí\". ¿Estaremos a la altura de sus expectativas o las rechazaremos?"
 transnistria.26.a: "Sí"
 transnistria.26.b: "No"
 transnistria.28.t: "Acciones Militares Conjuntas"
 transnistria.28.d: "La República de Odesa inmediatamente se dirigió a nosotros en busca de asistencia militar. Ahora nuestras unidades pueden moverse en el territorio de ambos estados"
 transnistria.28.a: "Bien"
 transnistria.29.t: "El Referéndum sobre el Estatus de Transnistria"
 transnistria.29.d: "Hemos celebrado un referéndum, en el que nuestro pueblo ha manifestado su deseo de seguir siendo independiente, ¡y no tenemos intención de quitarle este derecho! Transnistria seguirá luchando por su independencia."
 transnistria.29.a: "Bien"
 transnistria.30.t: "Asistencia de Especialistas del Banco Central"
 transnistria.30.d: "Las autoridades transnistrias están pidiendo a nuestros especialistas del banco central que los asistan en la reforma de la economía, esto será una excelente oportunidad para nosotros mejorar el estado de la economía de Transnistria y fortalecer nuestra influencia en la región"
 transnistria.30.a: "Los Ayudaremos"
 transnistria.30.b: "No"
 transnistria.31.t: "Especialistas Rusos del Banco Central"
 transnistria.31.d: "Las autoridades rusas han aceptado ayudarnos y enviar especialistas del banco central para ayudar en la reforma de la economía"
 transnistria.31.a: "Bueno"
 transnistria.32.t: "Especialistas Rusos del Banco Central"
 transnistria.32.d: "Las autoridades rusas se negaron a ayudarnos y a enviar especialistas del banco central para ayudar en la reforma de la economía"
 transnistria.32.a: "Triste"
 transnistria.33.t: "Asistencia en la Industria Agrícola"
 transnistria.33.d: "El gobierno transnistrio está pidiendo asistencia en el desarrollo de la industria agrícola a través de nuestras campañas agroindustriales. Sin duda nos beneficiaremos de este trato y aumentaremos nuestra influencia en la región"
 transnistria.33.a: "Los Ayudaremos"
 transnistria.33.b: "No"
 transnistria.34.t: "Especialistas Rusos de la Industria Agrícola"
 transnistria.34.d: "Las autoridades rusas han aceptado ayudarnos y enviar especialistas para ayudar en el desarrollo de nuestra agroindustria"
 transnistria.34.a: "Bueno"
 transnistria.35.t: "Especialistas Rusos de la Industria Agrícola"
 transnistria.35.d: "Las autoridades rusas se negaron a ayudarnos y a enviar especialistas para ayudar en el desarrollo de nuestra agroindustria"
 transnistria.35.a: "Triste"
 transnistria.36.t: "Transnistria Invita a Nuestros Cascos Azules"
 transnistria.36.d: "Las autoridades de la República de Transnistria han cambiado drásticamente su vector de política exterior y ahora pretenden abandonar el patrocinio de Rusia, ya han expulsado a sus cascos azules y nos están llamando. ¿Deberíamos intervenir?"
 transnistria.36.a: "Sí"
 transnistria.36.b: "No"
 transnistria.37.t: "Cascos Azules Ucranianos"
 transnistria.37.d: "Las autoridades ucranianas han respondido positivamente a nuestro deseo de ver a sus cascos azules en nuestro país, sus unidades llegarán inmediatamente a nuestro territorio"
 transnistria.37.a: "Bien"
 transnistria.38.t: "Cascos Azules Ucranianos"
 transnistria.38.d: "Las autoridades ucranianas respondieron negativamente al llamado de cascos azules a nuestro país, parece que hemos perdido todo"
 transnistria.38.a: "Triste"
 transnistria.39.t: "Nuestros Cascos Azules en Transnistria"
 transnistria.39.d: "El gobierno transnistrio tomó un paso inesperado para nosotros y anunció que debemos retirar inmediatamente nuestras fuerzas de mantenimiento de la paz de Transnistria. Esto pone en riesgo nuestra influencia en esta región."
 transnistria.39.a: "Triste"
 transnistria.40.t: "El Referéndum Sobre la Incorporación a Rusia"
 transnistria.40.d: "El gobierno ruso nos ha aceptado oficialmente en su membresía! Ahora todos nos hemos convertido en parte de un gran país con un gran patrimonio nuevamente."
 transnistria.40.a: "¡Hurra!"
 transnistria.41.t: "El Referéndum Sobre la Incorporación a Rusia"
 transnistria.41.d: "El gobierno ruso se ha negado a permitirnos unirnos a su membresía. Estamos inmensamente entristecidos y esperamos que en el futuro cambien de opinión."
 transnistria.41.a: "Triste"
 transnistria.42.t: "Integración de Transnistria"
 transnistria.42.d: "Estamos listos para finalmente integrar Transnistria en nuestro país."
 transnistria.42.a: "Finalmente"
 transnistria.43.t: "Gracias por Elegir Transnistria!"
 transnistria.43.d: "Transnistria recibió una actualización hace un año, pero decidí actualizar completamente el contenido existente para diversificar aún más la jugabilidad para este pequeño país!\n En este parche, Rusia y Transnistria tendrán más cooperación que antes, pero esto no significa que tu camino necesariamente esté con Rusia! Puedes elegir tanto el lado de Moldavia como el de Ucrania. Y si eres completamente astuto, podrías crear un Imperio Transnistrio!\n Transnistria se actualizó de acuerdo con mis propios estándares de contenido, que implementé en la rama rusa, por lo que incluso la rama económica es muy similar a la rusa.\n Espero que disfruten del contenido actualizado y jueguen un juego interesante para Transnistria con un amigo o amigos!\n\n - Lord Bogdanoff Desarrollador de Transnistria y miembro del Equipo de Reelaboración de Rusia"
 transnistria.43.a: "Spasibo"
 transnistria_news.1.t: "Transnistria se convierte en parte de Rusia"
 transnistria_news.1.d: "Las autoridades de la no reconocida República Moldava de Pridnestrovia realizaron un referéndum sobre la incorporación a Rusia, en el que la mayoría votó a favor. El gobierno ruso aceptó el resultado de este referéndum y anunció la incorporación de Transnistria a Rusia."
 transnistria_news.1.a: "Interesante."
 transnistria_news.3.t: "Transnistria se convierte en parte de Moldavia"
 transnistria_news.3.d: "Las autoridades de la no reconocida República Moldava de Pridnestrovia realizaron un referéndum sobre la incorporación a Moldavia, en el que la mayoría votó a favor. El gobierno moldavo aceptó el resultado de este referéndum y anunció la incorporación de Transnistria a Moldavia."
 transnistria_news.3.a: "Interesante."
 transnistria_news.4.t: "Transnistria Anexa Moldavia"
 transnistria_news.4.d: "Noticias inesperadas llegan desde Moldavia. Transnistria, una vez parte de este estado, anunció la anexión de Moldavia y la ocupación de su lugar como continuación de la nacionalidad moldava.."
 transnistria_news.4.a: "Interesante."
 PMR_general_monarchist_christian: "Monarquista General Cristiano"
 PMR_sheriff_finish: "Sheriff Terminado"
 PMR_soc_dem: "Democracia Social Transnistria"
 PMR_soc_dem_desc: "Como despertar de una pesadilla, los residentes de Transnistria despertarán hasta el final de un muy largo engaño. La prolongación de este pseudo-estado en su forma actual cesará, y la limpieza comenzará, comenzando con la revisión del Consejo Supremo en un órgano legislativo adecuado."
 PMR_liberalism: "Nuevo Órgano Nacional"
 PMR_liberalism_desc: "Ahora que tenemos la base para nuestra reforma, podemos comenzar la creación del Comité de Reintegración §Y§!, encargado de acelerar los cambios en nuestra constitución que permitirán nuestros planes de federación. Mientras tanto, podemos desenmascarar a algunos de los partidos opositores esperando unirse a la nueva administración."
 PMR_freedom: "Libertad para hablar"
 PMR_freedom_desc: "Nuestra historia en las urnas no ha sido limpia, y tampoco la situación ha estado con los derechos humanos aquí. Nuestra primera prioridad debe ser la derogación del artículo 316-1 y el levantamiento de algunas de las otras restricciones a la libertad de expresión. Se pondrá en contacto con un organismo internacional para asegurar que las elecciones locales se lleven a cabo adecuadamente, y con una intensa supervisión para garantizar la imparcialidad."
 PMR_rhetoric: "Retórica Pro-Moldava"
 PMR_rhetoric_desc: "Moldavia es tanto una nación fraternal como parte de nuestro propio paño. Dejar las relaciones y empujar el asunto sobre las ondas aéreas nos traerá el apoyo público que necesitamos."
 PMR_new_society: "Una sociedad Blooming"
 PMR_new_society_desc: "El avance hacia la apertura de nuestra nación al mundo inevitablemente va a dejar atrás a algunas personas, pero podemos hacer que la transición sea más fácil. Ampliar nuestras agencias para proporcionar aprendizaje de idiomas y capacitación digital para dar cabida a los que lo necesitan sin duda va a aliviar algunas de las quejas, y batir un poco de dinero en efectivo para el presupuesto."
 PMR_partnership: "Integración Política con Moldavia"
 PMR_partnership_desc: "Ahora que nuestras comunicaciones han sido fructíferas, podemos dejar de bordear la integración y comenzar la transición. Aceptaremos el marco jurídico unitario de Moldova y desmantelamos los aspectos separatistas restantes de nuestro gobierno para alinearnos lo más estrechamente posible políticamente."
 PMR_moldova_economic: "Adoptar el Leu"
 PMR_moldova_economic_desc: "Dejar el rublo y abrazar la moneda de Moldavia va a ser un esfuerzo increíblemente costoso. Afortunadamente nuestro nuevo comité ha estado trabajando directamente con los bancos para establecer estaciones de intercambio y comenzar a distribuir las nuevas notas inmediatamente."
 PMR_moldova_military: "A Militares sincronizados"
 PMR_moldova_military_desc: "Una de las demandas de Moldavia ha estado conformando nuestros militares para que coincidan con su doctrina y sus sistemas. Nuevos uniformes y regimientos de entrenamiento van a ser entregados, y nuestro comando será mirado de arriba a abajo para asegurarnos que no estamos trayendo ningún peso muerto con nosotros."
 PMR_deccomuniz: "Descomunización"
 PMR_deccomuniz_desc: "La última vez que lo comprobamos, ha pasado más de una década desde que cayó la Cortina de Hierro y la Unión Soviética fue abolida. Las estatuas y los memoriales han actuado menos como una distracción nostalgia, y más como una vergüenza en nuestra nueva dirección. Los tiempos tendrán que cambiar si vamos a hacer algún progreso inculcando una nueva cultura."
 PMR_contact_eu: "Un hogar europeo"
 PMR_contact_eu_desc: "La nación podría no ser reconocida internacionalmente, pero nuestros ciudadanos no necesitan sufrir ese mismo destino. Cooperaremos con Moldova para asegurar que nuestro pueblo tenga un oleoducto para obtener acceso a la Unión Europea, con todas las libertades que conlleva."
 PMR_federation: "El proyecto de federación"
 PMR_federation_desc: "\n\n\n\n\n\n£PMR_desctext_federation \n\n\n\n\n\n\n\n\nHa llegado el momento de proponer nuestro proyecto para federalizar con la nación de Moldova al Consejo. Si la solicitud pasa el obstáculo final será un referéndum nacional. Sólo podemos esperar que hayamos pasado al público lo suficiente."
 PMR_investors: "Bienvenidos a los Inversionistas"
 PMR_investors_desc: "Con cualquier gran agitación política, aquellos que deseen aprovecharse del cambio naturalmente vendrán corriendo. Algunas figuras notables han venido tocando para perseguir un pedazo de la acción. \n\nEs justo que tomemos una mano cuando se nos ofrece uno."
 PMR_it: "Trayendo la Web"
 PMR_it_desc: "La infraestructura de Internet que hemos estado utilizando hasta ahora fue instalada principalmente a principios de los 90. Como tal nos faltan muchos de los lujos técnicos que la mayoría de las naciones europeas han disfrutado como televisión digital, y velocidades aceptables. El levantamiento de nuestras restricciones a la inversión externa de TI va a cambiar eso."
 PMR_west_markets: "Bienvenidos a los Inversionistas"
 PMR_west_markets_desc: "Nuestras recientes conexiones nos han concedido accesos no vistos al mercado europeo. Como si un pez fuera arrojado de su tazón al océano, prácticamente nadamos en un mundo de oportunidad. Es hora de que sacudamos algunas manos y nos pongamos en nuestra mejor cara de negocios."
 PMR_expel_russians: "Expelen a los Pacificadores"
 PMR_expel_russians_desc: "Tenemos nuestro propio ejército, capaz de defender a nuestra propia gente. Los rusos que permanecen aquí sólo continuarán poniendo un bloque sobre la validez de nuestro gobierno. Tienen que irse."
 PMR_annex_efffect_idea1: "Integración Económica"
 PMR_army_efffect_idea1: "Integración del Ejército"
 PMR_reform_debuff1: "Integración Política"
 PMR_investors_idea: "Inversores Extranjeros"
 PMR_western_market_idea: "Cerrar a los Mercados Occidentales"
 PMR_MLV_influence_tt: "[MLV.GetFlag] Influencia Moldava §HMultiplicador§! en §Y[PMR.GetNameWithFlag]§!: §R+15%§!"
 PMR_economy: "Economía de Transnistria"
 PMR_economy_desc: "La economía transnistria es insuficiente y defectuosa. Para apoyar a nuestro país en crecimiento y a nuestro ejército, debemos construir una economía robusta para sostenerlo. Pero la pregunta es, ¿cómo? ¿Continuaremos con el contrabando, o encontraremos otro camino para nuestro futuro?"
 PMR_indust: "Mantener las cosas domésticas"
 PMR_indust_desc: "Debemos decidir hacia dónde irá nuestra industria."
 PMR_agro: "Rustas LLC"
 PMR_agro_desc: "Desarrollaremos nuestra industria agrícola, a pesar del pequeño tamaño de nuestro país."
 PMR_civil: "Industrias civiles"
 PMR_civil_desc: "Necesitamos nuevas fábricas para el empleo de nuestros ciudadanos."
 PMR_sell_weapon: "Vender las Existencias de Armas"
 PMR_sell_weapon_desc: "Nuestros almacenes, que han quedado desde la época de la URSS, almacenan muchas armas. Es hora de ganar algo de dinero con esto!"
 PMR_new_legistation: "Nuevas Normas de Inversión"
 PMR_new_legistation_desc: "Adoptaremos una nueva ley en la esfera de la inversión, que podría atraer nuevos inversores a nuestra economía."
 PMR_ukr_invest: "Inversiones Ucranianas"
 PMR_ukr_invest_desc: "Varias empresas ucranianas han expresado su deseo de invertir en nuestra economía."
 PMR_hun_invest: "Inversiones Húngaras"
 PMR_hun_invest_desc: "Varias empresas húngaras han expresado su deseo de invertir en nuestra economía."
 PMR_ita_invest: "Inversiones Italianas"
 PMR_ita_invest_desc: "Varias empresas italianas han expresado su deseo de invertir en nuestra economía."
 PMR_rom_invest: "Inversiones Rumanas"
 PMR_rom_invest_desc: "Varias empresas rumanas han expresado su deseo de invertir en nuestra economía."
 PMR_aus_invest: "Inversiones Austriacas"
 PMR_aus_invest_desc: "Varias empresas austriacas han expresado su deseo de invertir en nuestra economía."
 PMR_ge_invest: "Inversiones Alemanas"
 PMR_ge_invest_desc: "Varias empresas alemanas han expresado su deseo de invertir en nuestra economía."
 PMR_sov_invest: "Inversiones Rusas"
 PMR_sov_invest_desc: "Varias empresas rusas han expresado su deseo de invertir en nuestra economía."
 PMR_sheriff_starting: "Sheriff Hold"
 PMR_sheriff_starting_desc: "\n\n\n\n\n\n£PMR_desctext_sheriff \n\n\n\n\n\n\n\n\nSheriff es la segunda compañía más grande en el estado de fuga sin reconocimiento Transnistria, detrás de Moldavia Steel Works. Basado en la ciudad de Tiraspol, fue formado a principios del decenio de 1990 por Viktor Gushan e Ilya Kazmaly, ex miembros del KGB. El sheriff ha crecido para incluir casi todas las formas de negocio privado rentable en el país no reconocido, e incluso se ha involucrado significativamente en la política local y el deporte, con algunos comentaristas que dicen que los leales de la empresa ocupan la mayoría de las posiciones principales del gobierno en el territorio."
 PMR_sheriff_phones: "Interdnestrcom"
 PMR_sheriff_phones_desc: "Interdnestrcom es una empresa de telecomunicaciones transnistria que proporciona servicios de comunicación móvil para Transnistria, un estado separatista no reconocido internacionalmente reconocido como parte de Moldavia. Fue establecida en 1998. Además de proporcionar servicios de teléfono móvil, también proporciona acceso a Internet por marcación y RDSI."
 PMR_sheriff_oil: "Almacén de Productos Petrolíferos"
 PMR_sheriff_oil_desc: "El sheriff pretende construir un almacén de productos petrolíferos para garantizar la autonomía de su componente de combustible."
 PMR_sheriff_kvint: "KVINT"
 PMR_sheriff_kvint_desc: "KVINT es una bodega y destilería con sede en Tiráspol, la capital y centro industrial de Pridnestrovia. Los productos Kvint están certificados como 'Hecho en Moldavia'. Fundada en 1897, la empresa produjo solo vodka hasta 1938, cuando comenzó a producir brandies. Es la empresa comercial en funcionamiento más antigua de la región. Los locales consideran KVINT un tesoro nacional y un símbolo de su país. Su fábrica se muestra en el billete de 5 rublos pridnestrovianos. KVINT es uno de los mayores exportadores de Pridnestrovia, a Italia y China, así como a Rusia y Ucrania"
 PMR_sheriff_bank: "Agroprombank CJSC"
 PMR_sheriff_bank_desc: "El holding también planea crear su propio banco para realizar servicios financieros en toda Transnistria"
 PMR_sheriff_tiroteks: "Tirotex"
 PMR_sheriff_tiroteks_desc: "Tirotex es una empresa textil con sede en Transnistria que produce ropa y otros productos textiles. Está ubicada en Tiráspol. La empresa fue establecida en 1972 con la construcción de su fábrica, que tomó una década en completarse. La empresa es la mayor empresa textil en el suroeste de la Comunidad de Estados Independientes y también afirma ser la segunda de su tipo en toda Europa. Dentro de su complejo, hay operaciones de tejeduría, costura, acabado y hilado. Como empresa orientada a la exportación, el 70% de sus productos se envían al extranjero"
 PMR_sheriff_agro: "Holding Agroindustria"
 PMR_sheriff_agro_desc: "El holding también tiene la intención de adquirir varias plantas agroindustriales más para su restauración y puesta en marcha"
 PMR_rail_road: "Transnistrian Rails"
 PMR_rail_road_desc: "Ferrocarril Transnistrio es el operador ferroviario de Transnistria."
 PMR_airport_back: "Aeropuerto de Tiráspol"
 PMR_airport_back_desc: "Planeamos completar la reconstrucción del aeropuerto de Tiráspol y usarlo, si es necesario, tanto para fines civiles como militares."
 PMR_encouraged_foreign_investments_idea: "Ley de Inversión"
 PMR_economy_category: "Economía Transnistria"
 PMR_economy_category_desc: "Transnistria sobrevive vendiendo estacas en su propia industria. Cuando un socio extranjero se aleja, Tiraspol tiene la opción de comprar sus tenencias y devolverlas a la república."
 PMR_destroy_sheriff: "§RDestruir§! £text_icon_pmr_sheriff el monopolio §2Sheriff§!"
 PMR_buy_german_investments: "§GRecomprar§! las Inversiones §YAlemanas§! [GER.GetFlag]"
 PMR_buy_italian_investments: "§GRecomprar§! las Inversiones §YItalianas§! [ITA.GetFlag]"
 PMR_buy_russian_investments: "§GRecomprar§! las Inversiones §YRusas§! [SOV.GetFlag]"
 PMR_buy_ukraininan_investments: "§GRecomprar§! las Inversiones §YUcranianas§! [UKR.GetFlag]"
 PMR_buy_austrian_investments: "§GRecomprar§! las Inversiones §YAustriacas§! [AUS.GetFlag]"
 PMR_buy_romanian_investments: "§GRecomprar§! las Inversiones §YRumanas§! [ROM.GetFlag]"
 PMR_buy_hungarian_investments: "§GRecomprar§! las Inversiones §YHúngaras§! [HUN.GetFlag]"
 PMR_lebedev: "Desayunaremos en Tiraspol"
 PMR_lebedev_desc: "Seguiremos los preceptos del General Lebed y resolveremos nuestros problemas de manera radical y agresiva."
 PMR_vs_reform: "Reforma de las Fuerzas Armadas"
 PMR_vs_reform_desc: "Nuestras fuerzas armadas no están preparadas para defender nuestra pequeña república, debemos reformarlas y hacerlo con urgencia."
 PMR_army_corruption: "Dejen de vender armas"
 PMR_army_corruption_desc: "Tenemos la intención de detener la venta de armas desde los almacenes de Kolbasnaya, dejar de distribuirlas a diestro y siniestro."
 PMR_clean_government: "Limpiar el Gobierno"
 PMR_clean_government_desc: "Los funcionarios siempre piensan solo en sus bolsillos, pero ni siquiera piensan en el país, eliminaremos a tales personalidades del liderazgo de la república de manera pacífica o severa"
 PMR_return_zavods: "Revivir Fábricas"
 PMR_return_zavods_desc: "El potencial industrial de la región es obvio incluso para un ciego, pero desafortunadamente el colapso de la URSS destruyó todo lo que los ciudadanos de este país alguna vez hermoso construyeron, lo traeremos de vuelta"
 PMR_clean_corruption: "Guerra contra la Corrupción"
 PMR_clean_corruption_desc: "La corrupción es como una hidra: si le cortas una cabeza, crecerá otra. Cortaremos todas las cabezas de esta hidra corrupta de una vez"
 PMR_commies_goes_home: "Anticomunismo Ardiente"
 PMR_commies_goes_home_desc: "Las ideas comunistas no deberían ser la realidad principal de Transnistria, hace mucho que son incompatibles con la realidad y la forma en que vive la gente aquí. La gente no vivirá en el pasado, solo en el presente y el futuro!"
 PMR_support_nationalism: "Apoyo a los Sentimientos Nacionalistas"
 PMR_support_nationalism_desc: "El nacionalismo no siempre es algo malo, especialmente cuando los residentes de una región tan pequeña se consideran parte de lo que alguna vez fue un vasto y grandioso imperio. Apoyaremos la propagación de este sentimiento nacionalista."
 PMR_reform_special_services: "Reforma del Servicio Secreto"
 PMR_reform_special_services_desc: "Los servicios especiales también deben ser limpiados de todo tipo de estafadores y aficionados para resolver todos los problemas por dinero."
 PMR_militarize_society: "Militarización de la Sociedad"
 PMR_militarize_society_desc: "Cada ciudadano debe estar preparado para tomar un arma, porque se acerca la hora de la batalla por la misma existencia de nuestra región! Popularizaremos activamente la retórica militarista en nuestro país."
 PMR_zapad_sosat: "Sentimientos Antioccidentales"
 PMR_zapad_sosat_desc: "Occidente siempre ha sido y siempre será nuestro enemigo. No tenemos la intención de vivir con falsas ilusiones de que algún día querrán algo bueno para nosotros, especialmente para nosotros, una pequeña región que lucha por no convertirse en parte de la Unión Europea."
 PMR_transnistia_legion: "La Legión Transnistria"
 PMR_transnistia_legion_desc: "La Legión Transnistria es un proyecto que alguna vez debía implementarse en el territorio de Rusia, pero, ay, las autoridades de entonces lo bloquearon por completo. Todos los servicios especiales se combinarán en una unidad especial que no solo protegerá la patria, sino que también participará en misiones internacionales, tanto abiertamente como en secreto"
 PMR_militarize_young: "Militarización de la Juventud"
 PMR_militarize_young_desc: "Los jóvenes, en caso de guerra, deben estar preparados para tomar una ametralladora y defender su patria, y no suplicar misericordia. Haremos de nuestros hijos los verdaderos defensores de la patria"
 PMR_ded_sheriffs: "Poner Fin al Control del Sheriff"
 PMR_ded_sheriffs_desc: "El poder corporativo del Sheriff Holding finalmente terminará, los eliminaremos de una vez por todas, y cómo los tratemos dependerá de ellos. ¿Prisión o ejecución, cuál prefieren?"
 PMR_totalitarian_economic: "Control Autoritario sobre la Economía"
 PMR_totalitarian_economic_desc: "La esfera económica de nuestro estado se dejó al azar, pero ahora la traeremos de vuelta bajo el control de un líder fuerte.."
 PMR_nationalize_burjui: "Nacionalizar Negocios Extranjeros"
 PMR_nationalize_burjui_desc: "Las plantas industriales propiedad de extranjeros siempre son un riesgo para la seguridad económica. Con países extranjeros amenazándonos con sanciones económicas, siempre es una amenaza que los propietarios industriales se vayan durante la noche y se lleven partes vitales de sus plantas con ellos. Para evitar eso, necesitamos reclamar estas industrias para el estado, aunque ofenda a los estados extranjeros."
 PMR_vpk: "Revivir Fábricas Militares"
 PMR_vpk_desc: "Nuestro ejército necesita armas y, para producirlas, necesitamos armas y, para producirlas, debemos tener al menos una industria militar mínima, ya que el legado de la URSS nos permite crear condiciones similares"
 PMR_defenced: "Fortalecer Fronteras"
 PMR_defenced_desc: "El enemigo siempre está esperando que nos debilitemos para atacarnos, sin importar de qué lado. Por lo tanto, nuestras fronteras deben fortalecerse en ambos lados"
 PMR_kazaki_more: "Aceptar Voluntarios Cosacos"
 PMR_kazaki_more_desc: "Muchos cosacos se han mudado a Transnistria desde que el gobierno aquí cambió a uno más patriótico. Estamos incluso listos para formar un nuevo batallón con ellos, que nos ayudará en futuras batallas."
 PMR_sheriff_mobilize: "Movilizar al Antiguo Personal del Sheriff"
 PMR_sheriff_mobilize_desc: "Los antiguos oficiales del sheriff deben expiar su pecado ante la patria. Servir en el ejército es bastante adecuado para tal expiación"
 PMR_moldova_weapons: "Equipar a los rebeldes"
 PMR_moldova_weapons_desc: "Proveeremos armas a posibles rebeldes en el territorio de Moldavia para que nos ayuden en el momento adecuado"
 PMR_moldova_finish: "Resolver el Problema Moldavo"
 PMR_moldova_finish_desc: "No podremos dormir tranquilos sabiendo que tarde o temprano Moldavia intentará recuperar nuestra patria. Por lo tanto, debemos resolver el problema de su existencia de una vez por todas."
 PMR_moldova_money: "Fondo The Rebels"
 PMR_moldova_money_desc: "Proveeremos financieramente a posibles rebeldes en el territorio de Moldavia para que nos ayuden en el momento adecuado"
 PMR_kishenev: "Almorzaremos en Chisinau"
 PMR_kishenev_desc: "Moldavia debe caer, hemos tolerado a un vecino así durante demasiado tiempo."
 PMR_odessa: "Almorzaremos en Odessa"
 PMR_odessa_desc: "Odessa es nuestra oportunidad de acceder al Mar Negro; enviaremos destacamentos de órdenes allí y trataremos de provocar un motín."
 PMR_buy_general: "Sobornar a los Generales de Odessa"
 PMR_buy_general_desc: "Sobornaremos a algunos de los generales ucranianos que están en Odessa para que, en el momento adecuado, nos apoyen en nuestro levantamiento armado."
 PMR_buharest: "Cenaremos en Bucarest"
 PMR_buharest_desc: "Esperamos la batalla final con nuestro principal enemigo."
 PMR_kiev: "Cenaremos en Kiev"
 PMR_kiev_desc: "Esperamos la batalla final con nuestro principal enemigo."
 PMR_anti_west_idea: "Doctrina Antioccidental"
 PMR_legion_idea: "La Legión Transnistria"
 PMR_lebed_policy_idea: "Sistema Político de la Junta Transnistria"
 PMR_corruption_dead_in_govern_idea: "Corrupción Gubernamental Eliminada"
 ded_lebed: "El General Lebed ha muerto"
 PMR_monarchism: "Una Constitución monarquista"
 PMR_monarchism_desc: "Transnistria se considera una reserva de la URSS, pero la opinión de los residentes locales ha cambiado hace tiempo. La URSS se asocia ahora con ruinas y caos; ¿quizás el legado del Imperio ruso sea más apropiado para nosotros?"
 PMR_emperess_maria: "Oficina de las Instituciones de la Emperatriz María"
 PMR_emperess_maria_desc: "Vamos a restaurar este departamento y se ocupará de sanatorios y hospitales asequibles, con lo que mejoraremos la atención sanitaria de nuestros ciudadanos."
 PMR_nationalized: "Nacionalizar las empresas"
 PMR_nationalized_desc: "Nuestra capacidad para afirmar las nuevas normas tradicionales se decidirá por nuestra capacidad de gestionar directamente las industrias."
 PMR_agri_sup: "Apoyo al sector agroindustrial"
 PMR_agri_sup_desc: "No podemos esperar apoyo de los campesinos sin asegurar que tengan un medio para sobrevivir."
 PMR_lux_tax: "Introducir el impuesto de lujo"
 PMR_lux_tax_desc: "Los ricos deberían pagar más impuestos, porque nuestro tesoro no es infinito, sino excesivamente pequeño."
 PMR_monarchy_guard: "Guardia Imperial"
 PMR_monarchy_guard_desc: "¿Qué clase de monarca no tiene guardia? Se establecerá una Guardia Imperial en el territorio de la Santa Sede para proteger al Estado y al Emperador."
 PMR_dedd_sheriff: "Encerrar al sheriff"
 PMR_dedd_sheriff_desc: "Es hora de acabar con la influencia de este holding en nuestra república, ¡seremos libres!"
 PMR_emperess_maria_idea: "Oficina de las Instituciones de la Emperatriz María"
 PMR_royal_leib_guard_idea: "El guardia leib"
 PMR_idea_national_guard: "Guardia Nacional"
 PMR_kobalsna_small_weapons_tt: "Las existencias de armas en los almacenes no han sido §Rvaciadas§!"
 PMR_kobalsna_take_weapons_tt: "Todas las armas listas para el combate de los almacenes se agregarán al §Yarsenal§!"
 PMR_Sheriff_yest_tt: "£text_icon_pmr_sheriff §2Sheriff§! no fue §Rdestruido§!"
 PMR_mvd: "Transnistria segura"
 PMR_mvd_desc: "No son sólo las fuerzas armadas las que garantizan la independencia de nuestra república, sino también los servicios especiales y los órganos del interior, sobre cuyos hombros recae la lucha interna contra los enemigos externos."
 PMR_mvdshka: "Ministerio del Interior"
 PMR_mvdshka_desc: "El Ministerio del Interior de Transnistria, también conocido como Ministerio del Interior, es un organismo gubernamental oficial de la República Moldava de Pridnestrovia, parcialmente reconocida. Es el órgano ejecutivo encargado de implementar las políticas de defensa de las Fuerzas Armadas de Transnistria."
 PMR_ubepik: "Departamento de Seguridad Económica"
 PMR_ubepik_desc: "El Departamento de Seguridad Económica y Lucha contra la Corrupción desarrolla y aplica medidas jurídicas normativas estatales y reglamentarias en materia de seguridad económica. También desempeña otras funciones de conformidad con la legislación federal, los decretos presidenciales y los actos jurídicos reglamentarios del Ministerio del Interior."
 PMR_dnestr: "Brigada de Propósito Especial Separado"
 PMR_dnestr_desc: "La Brigada Separada de Propósito Especial del Dniéster es una brigada de milicia de propósito especial de la República Moldava de Pridnestrovia, formada en agosto de 1991 en Tiraspol durante el conflicto de Transnistria y subordinada directamente al Ministerio del Interior de la República."
 PMR_mgb: "Ministerio de Seguridad del Estado"
 PMR_mgb_desc: "El Ministerio de Seguridad del Estado es el servicio de seguridad del estado de Transnistria."
 PMR_delta: "Batallón de Fuerzas Especiales Delta"
 PMR_delta_desc: "El Batallón de Fuerzas Especiales Delta es un batallón especial formado en la primavera de 1992 en Tiraspol, actualmente subordinado directamente al Ministerio de Seguridad del Estado de Transnistria. Fue alistado en la reserva del Comandante en Jefe de las Fuerzas Armadas de Pridnestrovia y actualmente desempeña tareas relacionadas con la protección de las fronteras de la República Moldava de Pridnestrovia y la lucha contra el terrorismo."
 PMR_mvd_category: "Asuntos internos"
 PMR_mvd_category_desc: "No son solo las fuerzas armadas las que garantizan la independencia de nuestra república, sino también los servicios especiales y los órganos de asuntos internos, sobre cuyos hombros recae la lucha interna contra los enemigos externos.\n§RPara destruir§! £text_icon_pmr_sheriff §2el monopolio del Sheriff§!, es necesario tener un §Gbajo nivel§! de §Ycorrupción§!"
 transnistria.44.t: "El Frente Ucraniano colapsó"
 transnistria.44.d: "Las columnas rusas están rodando al oeste y el comando de Kiev ha perdido el control del eje sur. Odessa oblast, la franja de la costa que nos ha separado del mar desde 1990, es defendida por poco más que los reservistas. Nuestros oficiales de personal señalan que los depósitos en Kolbasna todavía están llenos y que el camino a Tiraspol corre por ambos lados. El liderazgo en Tiraspol está sopesando la oportunidad contra la certeza de que Ucrania, si sobrevive, recordará quién se movió contra ella."
 transnistria.44.a: "Tiraspol no se apartará."
 transnistria.44.b: "Esta no es nuestra guerra."
 transnistria.45.t: "El General en Krasnoyarsk"
 transnistria.45.d: "Alexander Lebed mandó al Ejército de la Guardia 14 cuando se interpuso entre Tiraspol y el avance moldavo, y todavía hay oficiales en esta república que dirán su nombre antes de decir Smirnov. Gobierna Krasnoyarsk Krai ahora, seis mil kilómetros al este del Dniester, volando entre ciudades mineras en helicópteros prestados y peleando con Moscú sobre el presupuesto krai. Nuestro personal argumenta que una república construida por soldados debe ser dirigida por uno, y que una invitación de Tiraspol no iría sin respuesta. No sería barato. Un gobernador ruso sentado no mueve la casa por nada, y Moscú querría más que rublos para mirar al otro lado."
 transnistria.45.a: "Trae al General a casa."
 transnistria.45.b: "Tiraspol no es el que manda."
 transnistria.46.t: "El General no vendrá a casa"
 transnistria.46.d: "Un Mi-8 que llevaba a Alexander Lebed golpeó una línea de poder en las colinas de Krasnoyarsk Krai y descendió en niebla. El gobernador de los krai, el hombre que ocupó la línea Dniester en 1992, fue asesinado junto con otros siete a bordo. Tiraspol ha enviado sus condolencias a Moscú. Los oficiales que pasaron una década esperando a que regresara no tienen nada que esperar, y cualquier gobierno de soldados en esta república podría haber parecido bajo su mando, no será construido ahora."
 transnistria.46.a: "Está enterrado en Novodevichy."
 PMR_idea_national_guard_desc: "Una fuerza territorial levantada de los distritos y contestable al Ministerio de Defensa en vez de a la milicia, destinada a mantener el terreno para que el ejército regular no pueda perdonar hombres. Cuesta el presupuesto interior más de lo que ahorra, pero pone un rifle entrenado en cada asentamiento a lo largo del Dniester.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!."
 PMR_peacerota_idea_desc: "La Comisión Mixta de Control ha mantenido un contingente transnistrio en la zona de seguridad desde 1992, junto con los batallones ruso y moldavo. Esta fuerza da a Tiraspol una unidad entrenada y equipada para desplegarse más allá de sus fronteras.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!."
 PMR_landforce_modifier: "Fuerzas Armadas Transnistrias"
 PMR_landforce_modifier_desc: "Unos cuatro mil regulares alrededor de Tiraspol y Bender, equiparon de lo que dejó el 14.º ejército soviético en 1992 y comandado por oficiales que vieron por última vez un rango de entrenamiento bajo una bandera diferente. La ingesta de conscripto es pequeña, los T-64 y BTR no han sido revisados en una década, y el sistema de reserva existe principalmente en papel.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!. Sus penas §G Mejorarán§! con cada enfoque §HArmía§! completamos, y serán §R pasados enteramente§! una vez que completemos §HEl Nuevo Ejército de Transnistria§!."
 PMR_airforce_modifier: "Fuerza Aérea de Transnistria"
 PMR_airforce_modifier_desc: "Un aeródromo de Tiraspol, un puñado de máquinas Mi-8 y Mi-24 entregadas cuando el 14.º Ejército derribó, y ningún avión de combate en absoluto. Los pilotos del establecimiento no han volado un jet desde que la Unión Soviética se disolvió, y no hay una red de radar que valga el nombre detrás de ellos.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!. Sus penas §G mejorarán§! si completamos el enfoque §H de la Fuerza Aérea Transnistria§!, y serán §R pasados enteramente§! una vez que completemos el enfoque §HAir Force Academy§!."
 PMR_doctrine_romania_desc: "El personal general trata a Bucarest como el patrocinador de cualquier cosa que Chisinau intente contra el Dniester, y planea en consecuencia. Los ejercicios están escritos alrededor de formaciones rumanas, equipos rumanos y oficiales rumanos adscritos al ejército moldavo.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!."
 PMR_doctrine_ukraine_desc: "Kyiv sostiene la única frontera que Tiraspol no puede cerrar y el único ferrocarril que llega al mundo exterior. El personal general planea el día en que la frontera se convierte en un frente, y perfora al ejército contra las formaciones ucranianas en lugar de moldavos.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!."
 PMR_kazachestvo_desc: "El Mar Negro Cossack Host fue revivido en el valle de Dniester en 1991 y lucharon como destacamentos voluntarios a través de la guerra del año siguiente. Sus distritos todavía eligen a los atamanes, debe estar al mando y mantener sus armas en casa, y la república los trata como una reserva permanente\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!"
 PMR_denomination_idea_desc: "El rublo transnistrian fue introducido en 1994 en la parte posterior de las notas soviéticas sobreimprimidas y nunca ha tenido una reserva para mantenerse al día. La hiperinflación ha borrado los ahorros dos veces, la población precios todo en dólares, y el banco central no puede mantener un peg por un solo trimestre.\n§W--------------§!\nEste espíritu nacional será §RRemovido§! si completamos el enfoque §HDenominación§!."
 PMR_encouraged_foreign_investments_idea_desc: "Tiraspol no puede pedir prestado en el extranjero y no puede imponer una economía tan pequeña al crecimiento, por lo que vende acceso en su lugar. La Ley de inversiones de 2002 excluye las licencias, garantiza la repatriación de los beneficios y las manos a los socios entrantes las empresas estatales que el Sheriff no ha tomado ya.\n§W--------------§!\nEste espíritu nacional será §RRemovido§! si nos convertimos en el tema de otra nación."
 PMR_economy_modifier: "Economía Transnistria"
 PMR_economy_modifier_desc: "Lo que queda del cinturón industrial de Moldavian SSR: el cemento Rybnitsa funciona, los molinos textiles Tiraspol, la destilería KVINT, el ferrocarril que lleva todo a Odesa y las granjas del valle de Dniester. Cada empresa trajo de vuelta a la producción deja su marca aquí.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!. Sin embargo, los modificadores podrían gradualmente §GMejorar§! ya que se completan más focos, decisiones y eventos."
 PMR_foreign_investments_modifier: "Inversiones extranjeras"
 PMR_foreign_investments_modifier_desc: "La parte de la industria transnistria que responde a los propietarios en el extranjero. Las tenencias austriacas, alemanas y húngaras compraron durante las privatizaciones, dinero agrícola rumano e italiano, y los fabricantes de acero ucranianos en Rybnitsa. Su capital mantiene a las plantas corriendo, y sus gobiernos una voz en Tiraspol.\n§W--------------§!\nLa participación de un compañero será §RRemovida§! si vamos a la guerra con ellos o dejamos de existir. Podemos entonces §Y Retroceder§! sus tenencias a través de las decisiones §Y Economía Transnistria§!."
 PMR_sheriff_modifier: "Sheriff"
 PMR_sheriff_modifier_desc: "Fundada en 1993 por dos ex oficiales de la milicia Transnistria, el Sheriff posee los supermercados, las gasolineras, la red móvil, los canales de televisión, el club de fútbol y, a través del partido Obnovlenie, el Consejo Supremo. La república es menos un estado con una empresa en ella que una compañía con un estado a su alrededor.\n§W--------------§!\nEste espíritu nacional será §GMás fuerte§! con cada enfoque del Sheriff que completamos, y será §R Removido§! si completamos el §YDestruir el Monopolio del Alguacil§! decisión o uno de los §HEnd the Sheriff's Holding§! se centra."
 PMR_sheriff_grows_tt: "£text_icon_pmr_sheriff §YEl dominio de Sheriff§! sobre la república §Rtightens§!"
 PMR_sheriff_full_control_tt: "£text_icon_pmr_sheriff §YSheriff§! tiene §R control completo§! sobre la república"
 PMR_security_modifier: "Servicios Especiales Transnistrian"
 PMR_security_modifier_desc: "El aparato de seguridad interna de la República Moldaviana Pridnestroviana: el Ministerio de Seguridad del Estado en Tiraspol con su batallón Delta contra el terrorismo, el Ministerio del Interior y su brigada especial Dniester, las tropas fronterizas que observan la línea ucraniana y el lado moldavo de la zona de seguridad y la dirección para la seguridad económica y la lucha contra la corrupción. Cada reforma de los servicios se acumula aquí.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!. Sin embargo, los modificadores podrían gradualmente §GMejorar§! a medida que se complete la reforma de los servicios."
 PMR_upgrade_services_tt: "Contamos con servicios que pueden ser §Yreformados§!"
 PMR_upgrade_mgb_tt: "El §YMinistry of State Security§! no se ha reformado aún"
 PMR_legion_idea_desc: "Una formación voluntaria abierta a los extranjeros, escapada del Ministerio de Seguridad Estatal en lugar del ejército. Da Tiraspol hombres que puede enviar al extranjero sin admitir que los envió, y una pantalla de contrainteligencia en casa que un ejército de conscriptos no puede proporcionar.\n§W--------------§!\nEste espíritu nacional nunca será §RRemovido§!."
 PMR_lebed_secured: "El general Lebed ha regresado a Tiraspol"