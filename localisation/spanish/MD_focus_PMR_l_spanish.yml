 PMR_14_army: "Grupo Operativo de Tropas Rusas"
 PMR_14_army_desc: "El grupo operativo de tropas rusas en la región transnistria de la República de Moldavia es una asociación de las Fuerzas Armadas de la Federación Rusa estacionadas en el territorio de la no reconocida República Moldava de Transnistria, que existe desde 1995."
 PMR_fragment_ussr: "Fragmento de la URSS"
 PMR_fragment_ussr_desc: "Transnistria literalmente se ha convertido en una vitrina del pasado soviético y, lamentablemente, esto no cambiará pronto debido a la situación de la república"
