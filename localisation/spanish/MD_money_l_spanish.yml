 bankruptcy_cheap_loans_from_african_investment_fund: "§YObtenga§! préstamos baratos del §1Fondo Monetario Africano§!"
 bankruptcy_cheap_loans_from_african_investment_fund_desc: "Con la creación del Fondo Monetario Africano, tenemos acceso a préstamos que no obtendríamos del FMI. Con estos préstamos baratos pagaremos parte de nuestra deuda anterior, reduciendo temporalmente nuestros intereses totales. Sin embargo, se trata de una medida temporal, ya que en un año nuestros tipos de interés volverán a la normalidad."
 bankruptcy_seek_bailout_from_african_monetary_fund: "§YPregunta§! ¡Rescate de la deuda por parte del §1Fondo Monetario Africano§!"
 bankruptcy_seek_bailout_from_african_monetary_fund_desc: "Como último recurso, podemos pedirle al Fondo Monetario Africano que nos conceda un alivio de la deuda. A diferencia del FMI, el Fondo Monetario Africano no nos tratará como ciudadanos de segunda clase."
 cheap_loans_from_amf_tt: "[THIS.GetNameWithFlag] §Y La deuda§! aumentará en $§R[?debt_addition|0] §! §Y millones§! pero nuestra §Y tasa de interés §! se reducirá en §G-3%§! por un año"
 bankruptcy_seek_bailout_from_amf_tt: "Nos pondremos en contacto con el Fondo Monetario Africano y les pediremos que resuelvan §Y$[ROOT.debt_bailout_10_preview] billones§! de nuestra deuda. Ellos sólo nos permitirán hacer esto una vez al año sin embargo.\n\n"
