 PRODUCTIVITY_STATE_DESC: "§YProductividad del Estado§! cambios basados ​​en el crecimiento de la productividad del propietario y en relación con la §YProductividad Promedio Global§!"
 NUM_STATE_PRODUCTIVITY: "§Y[?productivity_state_var|3]§!"
 NUM_STATE_PRODUCTIVITY_DESC: "Esta productividad estatal es:§Y[?productivity_state_var|3]§!"
 NUM_STATE_PRODUCTIVITY_DELAYED_DESC: "§Y Crecimiento de productividad mensual estatal:§! [?state_productivity_growth_scaled|3+]\n\nProductividad media mundial: [?global.average_world_productivity|3]\nProductividad del Estado: [?productivity_state_var|3]\n§Y Modificador de Crecimiento Local:§! [?modifier@state_productivity_growth_modifier|%+1]\n\nEl crecimiento nacional positivo se multiplica por (1 + (promedio mundial / productividad estatal - 1) ×0.5), limitado a 0–2, luego por (1 + modificador de crecimiento local). La productividad del Estado en este cálculo se limita a 100–100,000.\nCon crecimiento nacional cero o negativo, multiplicarse por la productividad del estado / promedio mundial en su lugar. El promedio mundial en este cálculo se limita a 100-10.000, y los modificadores de crecimiento local no aplican.\n\nVea la ventana Economía para el crecimiento nacional y sus modificadores."
 PERSONAL_INCOME_TAXES: "§CIngresos de la población:§!"
 PERSONAL_INCOME_RATE: "$$§G[?population_tax|+3]§!"
 PERSONAL_INCOME_TAXES_TOOLTIP: "Ingresos por Impuestos de la Población"
 PERSONAL_INCOME_TAXES_TOOLTIP_DELAYED: "Los impuestos sobre la población son varios impuestos que levamos de nuestros ciudadanos. Estos incluyen impuestos como IVA, impuesto sobre la renta, impuestos sobre la riqueza y impuestos sobre las ganancias de capital personal. La cantidad de ingresos fiscales que obtenemos depende de nuestra población y de nuestra tasa de impuestos §YPopulación§!. §YEl ingreso de la población§! es modificado principalmente por nuestro §Y Ciclo Económico§! y §Y Nivel de corrupción§!. Los ingresos también pueden ser modificados por varias ideas.\n\nCada §Y1%§! del impuesto de la población disminuye nuestra estabilidad en §R-1%§! como las personas esperan servicios a cambio de su carga tributaria.\n\nDerecho, Espíritu nacionals e impacto técnico en §YTodos los ingresos fiscales§!: [?modifier@tax_gain_multiplier_modifier|+%0]\nLegal, Espíritu nacionals and Tech impact on §YPopulation Tax Income§!: [?modifier@population_tax_income_multiplier_modifier|+%0]\n"
 CORPORATE_INCOME_TAXES: "§LIngresos Corporativos:§!"
 CORPORATE_INCOME_RATE: "$$§G[?corporate_tax|+3]§!"
 CORPORATE_INCOME_TAXES_TOOLTIP: "Ingresos de Impuestos Corporativos:\n$[?agriculture_district_tax|+3] de §Y Distritos Comercializados de Agricultura§!\n$[?agriculture_tax_gain|+3] de §Y Agricultura de la subsistencia§!\n$[?civil_fac_tax|+3] de §Y Industrias civiles§!\n$[?military_fac_tax|+3] de §Y Industrias Militares§!\n$[?dockyard_tax|+3] de §Y Naval Yards§!\n$[?office_tax|+3] de §Y Sectores de oficina§!\n$[?microchip_plant_tax|+3] de §YMicrochip Plants§!\n$[?composite_plant_tax|+3] de §Y Plantas compuestas§!\n$[?synthetic_refinery_tax|+3] de §YRefinerías sintéticas§!\n$[?nuclear_reactor_tax|+3] de §YNuclear Reactors§!\n$[?fossil_powerplant_tax|+3] de §Y Plantas de alimentación§!\n$[?renewable_energy_tax|+3] de §Y Infraestructura de Energía Renovable§!\n$[?internet_station_tax|+3] de §YEstaciones de Internet§!\n$[?rail_terminal_tax|+3] de §YRail Terminals§!\n$[?healthcare_tax_gain|+3] de §YHealthcare§!"
 CORPORATE_INCOME_TAXES_TOOLTIP_DELAYED: "Los impuestos corporativos son los impuestos que cobramos de las empresas que operan en nuestro país. Ejemplos son el IVA, los impuestos sobre la tierra y, por supuesto, los impuestos sobre las ganancias. La cantidad de impuestos que obtenemos depende del número de §Y Industrias Civiles§!, §Y Industrias Militares§!, §Y Yardes Naval§!, §Y Sectores Oficio§! y §Y Distritos Comercializados de Agricultura§! nuestro país tiene y nuestra §Y Tasa Tributaria Provincial§!. §YIngresos corporativos§! se modifica principalmente por nuestro §Y Ciclo Económico§! y §Y Nivel de Corrección§!. Los ingresos también pueden ser modificados por varias ideas.\n\nEl impuesto corporativo determina nuestro §YTax Cost§! (cuántas §Y Industrias civiles§! no tenemos disponible para la construcción) y también influye en cuánto dinero tienen que pagar otros países para invertir en nuestros estados\n\nLey, Espíritu nacionals e impacto tecnológico en §YTodos los ingresos fiscales§!: [?modifier@tax_gain_multiplier_modifier|+%0]\nLey, Espíritu nacionals e impacto tecnológico en §YIngresos fiscales corporativos§!: [?modifier@corporate_tax_income_multiplier_modifier|+%0]\nImpacto de la productividad en §YIngresos fiscales corporativos§!: [?productivity_tax_effect_display|+%]\nDerecho, Espíritu nacionals e impacto técnico sobre §YIngresos fiscales del sector de la oficina§!: [?modifier@office_park_income_tax_modifier|+%0]\nLey, Espíritu nacionals e impacto técnico en §Y Ingresos fiscales de Yardes de Naval§!: [?modifier@dockyard_income_tax_modifier|+%0]\nLegal, Espíritu nacionals and Tech impact on §YCivilian Industries Tax Income§!: [?modifier@civilian_industry_tax_modifier|+%0]\nLegal, Espíritu nacionals and Tech impact on §YMilitary Industries Tax Income§!: [?modifier@military_industry_tax_modifier|+%0]\nLaw, Espíritu nacionals and Tech impact on §YCommercialized Agriculture Districts Tax Income§!: [?modifier@agriculture_district_income_tax_modifier|+%0]\nLegal, Espíritu nacionals and Tech impact on §YMicrochip Plants Tax Income§!: [?modifier@microchip_plant_income_tax_modifier|+%0]\n\nLegal, Espíritu nacionals and Tech impact on §YComposite Plants Tax Income§!: [?modifier@composite_plant_income_tax_modifier|+%0]\n\nLegal, Espíritu nacionals and Tech impact on §YSynthetic Refineries Tax Income§!: [?modifier@synthetic_refinery_income_tax_modifier|+%0]\n\nLey, Espíritu nacionals e impacto técnico en §YIngresos de atención de salud§!: [?modifier@healthcare_income_multiplier_modifier|+%0]\n"
 UNEMPLOYMENT_THRESHOLD: "§3Umbral de desempleo:§!"
 UNEMPLOYMENT_THRESHOLD_RATE: "[?ROOT.unemployment_threshold_display_var|%Y]"
 UNEMPLOYMENT_THRESHOLD_TT: "¡El §Yumbral de alto desempleo§! es el valor del §Ydesempleo§! que nuestra nación puede alcanzar sin comenzar a sufrir los efectos adversos del §Yalto desempleo§!. Al superar este valor comenzarás a sufrir aumentos en tu £social_cost_multiplier_modifier_texticon §YCosto de Gasto Social§! y reducciones en tu £stability_texticon Estabilidad.\n\n§YModificadores del alto desempleo§!\n£stability_texticon Estabilidad: [?ROOT.high_unemployment_modifier_var|%+]\n£social_cost_multiplier_modifier_texticon §YCosto de Gasto Social§! Multiplicador: [?ROOT.high_unemployment_modifier_var_2|%-]"
 EMPLOYMENT_TOOLTIP: "Desglose de la fuerza laboral"
 EMPLOYMENT_TOOLTIP_DELAYED: "Total Workforce:§Y[?ROOT.workforce_total_display|3]§!\nParticipación de la población en la fuerza laboral:§Y[?ROOT.workforce_total_percentage_display|%]§!\n\nMillones de trabajadores por sector:\n§GFactores militares§!: [?ROOT.workers_in_mil_facs|3]\n§BFactores navales§!: [?ROOT.workers_in_dockyards|3]\n§OFactores civiles§!: [?ROOT.workers_in_civ_facs|3]\n§COficinas§!: [?ROOT.workers_in_offices|3]\n§GAgricultura no comercializada§!: [?ROOT.agriculture_workers|3]\n§CExtracción de recursos§!: [?ROOT.resource_sector_workers|3]\n§YDistritos Comercializados de Agricultura§!: [?ROOT.workers_in_agriculture_district|3]\n§RPlantas de microchip§!: [?ROOT.workers_in_microchip_plant|3]\n§RPlantas compuestas§!: [?ROOT.workers_in_composite_plant|3]\n§RRefinerías sintéticas§!: [?ROOT.workers_in_synthetic_refinery|3]\n§YReactores nucleares§!: [?ROOT.workers_in_nuclear_reactors|3]\n§YFossil Power Plants§!: [?ROOT.workers_in_fossil_powerplants|3]\n§YInfraestructura de energía renovable§!: [?ROOT.workers_in_renewable_energy|3]\n§YEstaciones de Internet§!: [?ROOT.workers_in_internet_stations|3]\n§PSalud§!: [?ROOT.workers_in_healthcare|3]\n§CAdministración del Gobierno§!: [?ROOT.workers_in_bureaucracy|3]\n§RDesempleados & Subsistencia§!: [?ROOT.total_unemployed|3]\n\nDesempleo actual: §R[?ROOT.total_unemployed_percentage_display|%]§!\n\n§YUmbral elevado de desempleo:§! [?ROOT.unemployment_threshold_display_var|%0]\n\n§YModificadores de Alto Desempleo§!\n£stability_texticon Estabilidad: [?ROOT.high_unemployment_modifier_var|%+]\n£social_cost_multiplier_modifier_texticon §YCosto del gasto social§! Multiplicador: [?ROOT.high_unemployment_modifier_var_2|%-]"
 EMPLOYMENT_AVERAGE: "§GCumplimiento promedio de los trabajadores:§!"
 EMPLOYMENT_AVERAGE_RATE: "[?ROOT.average_worker_fulfillment|%0]"
 EMPLOYMENT_AVERAGE_TT: "Cumplimiento del trabajo"
 EMPLOYMENT_AVERAGE_TT_DELAYED: "§YWorker Fulfillment§! es el valor que representa a cuántos trabajadores su país ha trabajado en comparación con lo que requiere nuestros edificios.\n\n§YPromedio de trabajo Fulfillment:§! [?ROOT.average_worker_fulfillment|%0]\n\n§YWorker Fulfillment by Building:§!\nFactores civiles: §Y[?ROOT.civilian_factories_manpower_fulfillment|%]§!\nFactores militares: §Y[?ROOT.military_factories_manpower_fulfillment|%]§!\nFactores navales: §Y[?ROOT.naval_factories_manpower_fulfillment|%]§!\nOficinas: §Y[?ROOT.offices_manpower_fulfillment|%]§!\nExtracción de recursos: §Y[?ROOT.resource_sector_worker_fulfillment|%]§!\nDistritos Comercializados de Agricultura: §Y[?ROOT.agriculture_district_manpower_fulfillment|%]§!\nPlantas de microchip: §Y[?ROOT.microchip_plant_manpower_fulfillment|%]§!\nPlantas compuestas: §Y[?ROOT.composite_plant_manpower_fulfillment|%]§!\nRefinerías sintéticas: §Y[?ROOT.synthetic_refinery_manpower_fulfillment|%]§!\nReactores nucleares: §Y[?ROOT.nuclear_reactors_manpower_fulfillment|%]§!\nFossil Power Plants: §Y[?ROOT.fossil_powerplants_manpower_fulfillment|%]§!\nRenewable Energy Infrastructure: §Y[?ROOT.renewable_energy_infra_manpower_fulfillment|%]§!\nEstaciones de Internet: §Y[?ROOT.internet_stations_manpower_fulfillment|%]§!\nTerminales de ferrocarril: §Y[?ROOT.rail_terminal_manpower_fulfillment|%]§!\nSalud: §Y[?ROOT.healthcare_manpower_fulfillment|%]§!\nAdministración gubernamental: §Y[?ROOT.bureaucracy_manpower_fulfillment|%]§!\n"
