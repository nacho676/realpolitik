 BUREAU_RATE: "$$§R[?bureaucracy_gain|-3]§!"
 BUREAUCRACY_EXPENSE_TOOLTIP: "Gasto en Burocracia"
 BUREAUCRACY_EXPENSE_TOOLTIP_DELAYED: "El gasto burocrático es cuánto dinero usamos para administrar la administración del país. El costo básico abarca infraestructura y gastos generales, escalados por población y nivel §YAdministración§!. Los niveles de administración superiores también emplean a una mayor parte de la población como funcionarios públicos, cuyos sueldos se añaden por encima del costo de infraestructura, lo que significa que los estados bur_05 pagan tanto el multiplicador superior como la mayor factura salarial.\n\nEfecto del PIB/C en §Y Gasto burocrático§!: [?education_cost_gdp_multiplier_display|-%0]\nLey, Espíritu nacionals e impacto técnico en §YPagamento de la democracia§!: [?modifier@bureaucracy_cost_multiplier_modifier|-%0]\n§YInflation§! impact on §YBureaucracy Spending§!: [?inflation_rate_var|-%]\n\nAdministración del Gobierno: Fulfillmentación de fuerza de trabajo: [?bureaucracy_manpower_fulfillment|%0]"
 DEFENCE_SPENDING: "§ODefensa:§!"
 DEFENCE_RATE: "$$§R[?defence_gain|-3]§!"
 DEFENCE_SPENDING_TOOLTIP: "Desglose del Gasto en Defensa:\n$[?defence_breakdown_industry|-3] se gasta en §YCosto Industrial§!\n$[?defence_breakdown_land|-3] se gasta en §YCosto Operativo del Ejército§!\n$[?defence_breakdown_navy|-3] se gasta en §YCosto Operativo de la Marina§!\n$[?defence_breakdown_airforce|-3] se gasta en §YCosto Operativo de la Fuerza Aérea§!\n$[?defence_breakdown_cyber|-3] se gasta en §YCosto del Comando Cibernético§!"
 DEFENCE_SPENDING_TOOLTIP_DELAYED: "El gasto de defensa es cuánto dinero usamos para financiar nuestro ejército. El gasto de defensa está compuesto por dos componentes: §Y Costo industrial§! y §Y Costo operativo§!. El §YIndustrial Cost§! es cuánto dinero gastamos en mantener nuestra industria de defensa funcionando. El costo base por fábrica militar y astillero se basa en nuestra ley §YMilitar gasto§!. Una ley superior costará más. Nuestro §YGDP per capita§! también aumentará el costo. También se añaden los costos de §YAir & Defensas Misiles§!.\n\nEl §Y Costo Operacional§! se basa en la cantidad de batallones, barcos y aviones que hemos desplegado y cuántos equipos y aeronaves tenemos almacenados. Este costo es modificado entonces por nuestra §YLey de inscripción§!, §Y Ley de formación profesional§! y §YGDP per capita§!.\n\n§YCyber Command Cost§! es el sobrecabezamiento semanal para mantener un programa cibernético nacional. Las escalas de costos con §YGDP§! y §YCapability Tier§!, y se modifican por el modificador §YCyber Security Infrastructure Cost§!.\n\nEfectos del PIB/C en §Y Costo industrial§!: [?defence_breakdown_industry_gdp_modifier|-%0]\nEfectos del PIB/C en §Y Costo personal§!: [?defence_breakdown_personnel_gdp_modifier|-%0]\nDerecho, Espíritu nacionals e impacto técnico sobre §Y Costo personal§!: [?modifier@personnel_cost_multiplier_modifier|-%0]\n§Y Inflation§! impact on §YIndustrial Cost§! & §YEquipment Cost§!: [?inflation_rate_var|-%]\n§YModificador de coste§!: [?modifier@cyber_cost_multiplier_modifier|-%0]"
 POLICE_SPENDING: "§8Seguridad Interna:§!"
 POLICE_RATE: "$$§R[?security_gain|-3]§!"
 POLICE_SPENDING_TOOLTIP: "Gasto en Seguridad Interna"
 POLICE_SPENDING_TOOLTIP_DELAYED: "El gasto en Seguridad Interna es cuánto utilizamos dinero en nuestra seguridad interna, como la policía y la seguridad externa en forma de agencias de inteligencia. El costo base para el gasto de seguridad interna se basa en la población total del país con cada nivel de §Y Seguridad Interna§! aumentando el coste.\n\nEfecto del PIB/C en §Y Gasto de Seguridad Interna§!: [?education_cost_gdp_multiplier_display|-%0]\nLey, Espíritu nacionals e impacto técnico en §Y gasto de seguridad interna§!: [?modifier@police_cost_multiplier_modifier|-%0]\n§YInflation§! impact on §YInternal Security Spending§!: [?inflation_rate_var|-%]"
 EDUCATION_RATE: "$$§R[?education_gain|-3]§!"
 EDUCATION_EXPENSE_TOOLTIP: "Gasto en Educación"
 EDUCATION_EXPENSE_TOOLTIP_DELAYED: "El gasto en educación es cuánto dinero utilizamos para financiar escuelas públicas y privadas, investigación y educación. El costo básico de la educación se basa en la población total del país con cada nivel de §Y Presupuesto de Educación§! que aumenta el costo.\n\nEfecto del PIB/C en §Y Gasto§!: [?education_cost_gdp_multiplier_display|-%0]\nLey, Espíritu nacionals e impacto técnico en §YEducación Spendiente§!: [?education_cost_multiplier_display|-%0]\nCantidad de ranuras de investigación impacto en §YEducation Spending§!: [?research_slot_modifier|-%0]\n\nTotal de §Y Gasto§! que se gasta en §Y Instalaciones experimentales§!: $[?total_facilities_spending_display_var|3%]\n§Y Inflación§! impacto en §YEducación Gasto§!: [?inflation_rate_var|-%]"
 HEALTHCARE_EXPENSE: "§PSalud:§!"
 HEALTHCARE_RATE: "$$§R[?health_gain|-3]§!"
 HEALTHCARE_EXPENSE_TOOLTIP: "Gasto en Salud"
 HEALTHCARE_EXPENSE_TOOLTIP_DELAYED: "El gasto en salud es lo mucho que utilizamos para financiar el sistema de salud pública, incluyendo la atención médica, los costos del seguro, las subvenciones a medicamentos y otros. El costo básico de la atención sanitaria se basa en la población total del país con cada nivel de §Y Presupuesto de salud§! que aumenta el coste.\n\nEfecto del PIB/C en §Y Gasto de salud§!: [?education_cost_gdp_multiplier_display|-%0]\nLey, Espíritu nacionals e impacto técnico en §YPagamento de la salud§!: [?modifier@health_cost_multiplier_modifier|-%0]\n§YInflation§! impact on §YHealth Spending§!: [?inflation_rate_var|-%]"
 WELFARE_RATE: "$$§R[?welfare_gain|-3]§!"
 WELFARE_EXPENSE_TOOLTIP: "Gasto en Bienestar"
 WELFARE_EXPENSE_TOOLTIP_DELAYED: "El gasto de bienestar social es lo mucho que gastamos en diversos programas sociales como las prestaciones por desempleo, las pensiones y otros programas de beneficios no relacionados con la salud o la educación.El costo básico del bienestar se basa en la población total del país con cada nivel §YGasto social§! aumentar el costo.\n\nEfectos del PIB/C §YGastos de bienestar§!: [?education_cost_gdp_multiplier_display|-%0]\nLaw, National Spirits and Tech impact on §YGastos de bienestar§!: [?modifier@social_cost_multiplier_modifier|-%0]\n§YInflación§! sobre los efectos §YGastos de bienestar§!: [?inflation_rate_var|-%]"
 INTEREST_EXPENSE: "§RIntereses de la Deuda:§!"
 INTEREST_EXPENSE_TOOLTIP: "Intereses Pagados"
 INTEREST_EXPENSE_TOOLTIP_DELAYED: "Tenemos que pagar intereses sobre la deuda que nuestra nación ha acumulado. Nuestra tasa de interés está dictada principalmente por nuestro §YProporción de la deuda con el PIB§!. Cuanto mayor sea la proporción, menos confianza que tienen las diversas instituciones financieras en nuestra capacidad de pagar la deuda, lo que lleva a una tasa de interés más alta. §YEspíritus nacionales§!.\n\nTener un mayor §YTasa de interés§! que §Y10%§! nos dará acceso a las decisiones de emergencia para manejar nuestra deuda creciente. §Y15%§!, nuestra economía comenzará a desacelerar y sufriremos otros efectos adversos. En este punto, tendremos la capacidad de morder en nuestra deuda (a un gran costo). §YInteres§! va más allá §Y20%§!No seremos capaces de tomar manualmente más deudas. §YInterés en la deuda§! supera nuestros §YIngresos brutos§!Nuestra nación se derrumbe.\n\nNuestra corriente §YTasa de interés§! is [?interest_rate|3]%\n\nNuestra relación actual de la deuda a la PBI: §Y[?debt_ratio|%1]§!\n\nIdea impact on §YTasa de interés§!: [?interest_rate_multiplier|-2]%\n[debt_automatic_repayment_toggled]"
