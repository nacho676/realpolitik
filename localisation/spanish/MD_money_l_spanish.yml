 GOVERNMENT_INVESTMENT_RATE_YES: "International Investment Reinvestment: §GENABLED§! (todos los retornos reinvertidos)"
 GOVERNMENT_INVESTMENT_RATE_NO: "Reinversión de Inversiones Internacionales: §YDESACTIVADA§!"
 GOVERNMENT_INVESTMENT_REJECT_YES: "Rechazo Automático de Inversión Internacional:§GACTIVADO§!"
 GOVERNMENT_INVESTMENT_REJECT_NO: "Rechazo Automático de Inversión Internacional:§YDESACTIVADO§!"
 GOVERNMENT_INVESTMENT_TOOLTIP: "Ingresos por Inversiones Internacionales"
 GOVERNMENT_INVESTMENT_TOOLTIP_DELAYED: "Las Inversiones Internacionales son los activos que el gobierno posee, como acciones en empresas, fondos y demás. Las inversiones internacionales proporcionan un año §YRetorno de la inversión (ROI)§!. Por lo general, esta tasa es del 6% pero puede cambiar a medida que el juego continúa. El §YROI§! está tapado a un máximo de §Y20%§!. La mayoría de nuestras §Y Inversiones Internacionales§! provendrán del uso de los fondos en nuestro §YTreasury§! para invertir en la construcción de edificios en otros países.\n\nNuestra corriente §Y Retorno a la Inversión§! es [?roi_rate|%0]\nRetorno semanal: $[?int_investments_rate|3]b. Tesoro: $[?int_investments_collected_rate|3]b. Reinvested: $[?int_investments_reinvest_rate|3]b.\n\nSi se activa la función de reinversión §YInternacional Investments§!, no se añadirán fondos reinvertidos a nuestros ingresos semanales.\n\n[int_reinvestment_toggled]\n[int_auto_rejection_toggled]"
 TRADE_INCOME_REVENUES: "§YVentas de Recursos:§!"
 TRADE_INCOME_RATE: "$$§G[?resource_sale_rate|+3]§!"
 TRADE_INCOME_REVENUES_TOOLTIP: "Ingresos por Exportación de Recursos:\n$[?oil_exports|+3] de §YCombustibles Fósiles§!\n$[?aluminium_exports|+3] de §YMetales Ligeros§!\n$[?rubber_exports|+3] de §YCaucho§!\n$[?tungsten_exports|+3] de §YMetales Tecnológicos§!\n$[?steel_exports|+3] de §YAcero§!\n$[?chromium_exports|+3] de §YMetales Preciosos§!\n$[?microchip_exports|+3] de §YMicrochips§!\n$[?composite_exports|+3] de §YCompuestos§!"
 TRADE_INCOME_REVENUES_TOOLTIP_DELAYED: "Los recursos excedentes que ponemos en el mercado nos generan ingresos en efectivo cada semana. Cada recurso tiene su propio precio por unidad; los §YMicrochips§! son los más valiosos, seguidos de los §YCompuestos§!. Nota: los recursos vendidos a otros países mediante contratos comerciales del juego base se pagan en §YIndustrias civiles§! (entrada de CIC). Ese pago en CIC es una mecánica comercial del juego base, independiente y adicional a los ingresos en efectivo que se muestran aquí.\n\nImpacto de leyes, espíritus nacionales y tecnología en las §YExportaciones de recursos§!: [?modifier@resource_export_multiplier_modifier|+%0]\nImpacto de leyes, espíritus nacionales y tecnología en las §YExportaciones de combustibles fósiles§!: [?ROOT.modifier@oil_export_multiplier_modifier|%+3]\nImpacto de leyes, espíritus nacionales y tecnología en las §YExportaciones de acero§!: [?ROOT.modifier@steel_export_multiplier_modifier|%+3]\nImpacto de leyes, espíritus nacionales y tecnología en las §YExportaciones de metales ligeros§!: [?ROOT.modifier@aluminium_export_multiplier_modifier|%+3]\nImpacto de leyes, espíritus nacionales y tecnología en las §YExportaciones de metales tecnológicos§!: [?ROOT.modifier@tungsten_export_multiplier_modifier|%+3]\nImpacto de leyes, espíritus nacionales y tecnología en las §YExportaciones de metales preciosos§!: [?ROOT.modifier@chromium_export_multiplier_modifier|%+3]\nImpacto de leyes, espíritus nacionales y tecnología en las §YExportaciones de caucho§!: [?ROOT.modifier@rubber_export_multiplier_modifier|%+3]\nImpacto de leyes, espíritus nacionales y tecnología en las §YExportaciones de microchips§!: [?ROOT.modifier@microchip_export_multiplier_modifier|%+3]\nImpacto de leyes, espíritus nacionales y tecnología en las §YExportaciones de compuestos§!: [?ROOT.modifier@composite_export_multiplier_modifier|%+3]"
