 bankruptcy.3.d: "[From.GetName]'s problema de la deuda se ha vuelto tan malo, que realistamente no tienen oportunidad de pagar o incluso cumplir con los pagos de intereses en ejecución. Con la posibilidad real de quiebra, fue bajo circunstancias desesperadas que [From.GetAdjective] líder [From.GetLeader] había viajado a [Root.GetName] a fin de pedir [Root.GetLeader]Es ayuda.\n\n[From.GetNameWithFlag] nos está pidiendo que manejemos una parte de la deuda $[FROM.debt_bailout_display] §Ymil millones§! pagando la mitad y perdonando el resto. Si lo hacemos, calmaría a otros prestamistas internacionales, reduciendo drásticamente [From.GetName]Es costos de préstamo, haciendo que su gran deuda sea manejable.\n\nAunque perderemos el dinero de hacer esto, ellos estarán seriamente en nuestra deuda, con nuestra influencia sobre ellos aumentando significativamente."
