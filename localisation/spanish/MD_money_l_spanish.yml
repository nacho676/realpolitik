 MAXIMUM_MIGRATION_RATE_TT: "Tasa máxima de migración"
 MAXIMUM_MIGRATION_RATE_TT_DELAYED: "La §YTasa Máxima de Migración§! es el potencial total de §YMigración§! hacia el país. Está modificada por tu §YCiclo Económico§!, §YProductividad§!, §YPartido Gobernante Actual§!, §YSatisfacción Laboral§!, §YTasa de Desempleo§!, §YApoyo a la Guerra§! y si el país está en guerra. Este valor no puede aumentarse directamente fuera de las métricas mencionadas, pero puedes capturar más de la §YTasa de Migración§! aumentando tu §YLey de Migración§! o mediante enfoques nacionales, ideas o decisiones. Además, tu §YTasa Neta de Migración§! se calcula como tu §Ytasa máxima de migración§!, que luego se multiplica por la §YTasa Neta de Migración Base§!, modificada por tu §YFactor de Valor de la Tasa Neta de Migración§!.\n\n§YImpactos en la Tasa Máxima de Migración:§!\n--------------\n§YMáximo por Productividad§!: [?immigration_productivity_calculations_display|%+]\n§OSatisfacción Laboral/Tasa de Desempleo§!: [?immigration_employment_factor_display|%-]\n§GPartido Gobernante§!: [?immigration_government_factor_display|%+]\n§pRefugiados de Vecinos en Guerra§!: [?neighbour_war_refugees_display|%+]\n§0Refugiados de Nuestro País por Estar en Guerra§!: [?personal_war_refugees_display|%+]\n§LCiclo Económico/Ideas§!: [?modifier@maximum_migration_rate_value|%+]"
