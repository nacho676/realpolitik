 INT_INVESTMENTS_TOOLTIP: "Tenemos $[?int_investments|3] §Hmil millones§! en inversiones internacionales.\nGanaremos. [?roi_rate|%0] §HRetorno de la inversión§! en este cada año, generando $[?int_investments_rate|3] §Hmil millones§! semanalmente. $[?int_investments_collected_rate|3] §Hmil millones§! va al Tesoro. $[?int_investments_reinvest_rate|3] §Hmil millones§! es reinvertido.\nActivo activo §YProyectos de inversión§!: [?active_projects|0]/15"
 INT_INVESTMENTS_TOOLTIP_DELAYED: "£key_shift + £click_left §YShift L Click§! para la reinversión del ciclo §HIngresos en concepto de inversiones§!: §YFuera.§! (todos para el tesoro) §C->§! §GCompleto§! (todos reinvertidos) §C->§! §GDividir§! (la mitad del tesorería, la mitad reinvertido).\n\n£GFX_key_ctrl + £click_left §YControl L Click§! para Permitir/desactivar el rechazo automático de la inversión. Esto significa que rechazará automáticamente TODAS las ofertas de inversión entrantes.\n\n £GFX_click_right §YClic R§! para vender $1 mil millones en inversiones extranjeras. Sólo el 60% de la suma se puede recuperar. £GFX_key_ctrl §YCtrl§! (10x) or £key_shift §YCambio§!(100x) para aumentar la cantidad vendida.\n\n[int_reinvestment_toggled]\n[int_auto_rejection_toggled]"
 DEBT_TOOLTIP: "§YDeuda total§!: $[?debt|3] §Ymil millones§!\n§YTasa de interés§!: [?interest_rate|2]%\n§YDebt-to-GDP§! Relación: §Y[?debt_ratio|-%1]§!\n§YInterés en Deuda§!: $[?debt_rate|-3] §Ymil millones§!\n[debt_automatic_repayment_toggled]"
 DEBT_TOOLTIP_DELAYED: "£click_left §YL Haga clic§! para pedir prestado $ 1 §Ybillion§!.\n£GFX_click_right §YR Haga clic§! para pagar $ 1 §Y millón§!.\n£GFX_click_right §YR Haga clic + Alt §! para pagar $[?treasury] §Y millones§!.\nPagar más con §YCtrl§!(10x), §YShift§!(100x) y §YAlt§!(1000x); hasta el tesoro total.\n1% de la cuota de préstamo; $ 1 §Y millón§! prestado = $ 1.01 §Y millones§! deuda.\n\n§Y Factores de interés§!:\n Relación entre la deuda y el PIB: [?debt_interest_premium|-2]%\n Espíritu nacionals: [?interest_rate_multiplier|-2]%\n Tasa de política del Banco Central: [?cb_rate_premium|-2]%\n Tensión Mundial: [?threat_interest_premium|-2]%\n Tensión Mundial Generada: [?adjusted_tension_premium|-2]%\n[interest_rate_clamp_line]\n§Y Tasa de interés§! efectos:\n §Y Tasa de interés§! √≥ §Y10%§!: acceso a decisiones de emergencia para manejar la deuda.\n §Y Tasa de interés§! √≥ §Y15%§!: económica §R baja §!, otros §R efectos adversos§! y capacidad para incumplir nuestra deuda a un gran costo.\n §Y Tasa de interés§! ît §Y20%§!: préstamos restringidos, y ya no pueden recibir préstamos para déficits presupuestarios.\n §Y Interés en Debt§! ilo §YIngreso de Jesús§!: entonces nuestra nación §R se colapsará!§!\n\nHabilitar §Y Pago automático de la deuda§! con §YAlt + Shift + £GFX_click_right Right Click§!; que pagará automáticamente el 25% de cualquier superávit."
 REFRESH_TAX_RATE: "Actualizar"
