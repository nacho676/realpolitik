 F_TAX_RATE_TOOLTIP: "[THIS.GetFlag][THIS.GetAdjective] §HTasa promedio de impuestos§! es del [?tax_rate]%.\n\n§YTasa de impuestos corporativos:§! [?corporate_tax_rate]%\n§YTasa de impuestos a la población:§! [?population_tax_rate]%\n§HTasa de Desempleo:§! [?total_unemployed_percentage_display|%1]\n§HTasa de Inflación:§! [?inflation_rate_var|%1]"
