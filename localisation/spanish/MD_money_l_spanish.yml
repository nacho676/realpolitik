 MIGRATION_LAWS_TOOLTIP: "Control de migración"
 MIGRATION_LAWS_TOOLTIP_DELAYED: "El control migratorio representa los gastos incurridos en la Ley de Migración §Y§! de nuestro país y nuestra actual política migratoria. El costo base de §7 Control de Migraciones§! se basa en la población total del país con cada nivel de §Y Leyes de migración§! aumentando el coste.\n\nEfectos del PIB/C en §Y Ley de migración§!: [?education_cost_gdp_multiplier_display|-%0]\nLey, Espíritu nacionals e impacto técnico en §Y Ley de migración§!: [?modifier@border_control_multiplier_modifier|-%0]\n§Y Inflación§! impact on §YMigration Law§!: [?inflation_rate_var|-%]"
