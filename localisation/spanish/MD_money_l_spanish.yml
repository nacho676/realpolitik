 F_TREASURY_TOOLTIP: "PIB de §Y[THIS.GetName]§!: $§Y[?gdp_total|0]§! mil millones\nPIB per cápita de §Y[THIS.GetName]§!: $§Y[?gdp_per_capita]§! mil\n---------\n[THIS.GetFlag] [THIS.GetAdjective] §HTasa Impositiva Promedio§!: [?tax_rate]%.\n\n§YTasa de Impuesto Corporativo:§! [?corporate_tax_rate]%\n§YTasa de Impuesto a la Población:§! [?population_tax_rate]%\n§HTasa de Desempleo:§! [?total_unemployed_percentage_display|%1]\n§HTasa de Inflación:§! [?inflation_rate_var|%1]\nTienen $[?treasury] §Hmil millones§! en el tesoro.\n\nSu balance semanal es de [?treasury_rate|+] §Hmil millones§!.\n"
