 bankruptcy.1.t: "[From.GetNameWithFlag] solicita un rescate de deuda"
 bankruptcy.1.d: "[From.GetName]'s problema de la deuda se ha vuelto tan malo, que realistamente no tienen oportunidad de pagar o incluso cumplir con los pagos de intereses en ejecución. Con la posibilidad real de quiebra, fue bajo circunstancias desesperadas que [From.GetAdjective] líder [From.GetLeader] había viajado a [Root.GetName] a fin de pedir [Root.GetLeader]Es ayuda.\n\n[From.GetNameWithFlag] nos está pidiendo que manejemos una parte de la deuda $[FROM.debt_bailout_display] §Ymil millones§! pagando el 75% y perdonando al resto. Si lo hacemos, calmaría a otros prestamistas internacionales, reduciendo drásticamente [From.GetName]Es costos de préstamo, haciendo que su gran deuda sea manejable.\n\nAunque perderemos el dinero de hacer esto, ellos estarán seriamente en nuestra deuda, con nuestra influencia sobre ellos aumentando significativamente."
 bankruptcy.1.a: "Conceder el rescate a [From.GetNameWithFlag]"
 bankruptcy.1.b: "Lo siento, no podemos permitírnoslo"
 bankruptcy_bailout_influence_TT: "[From.GetNameWithFlag]: ¡La §Yinfluencia§! de [Root.GetNameWithFlag] aumenta en un §G15%§!"
 bankruptcy.2.t: "[From.GetNameWithFlag] solicita un rescate de deuda"
 bankruptcy.2.d: "[From.GetName]'s problema de la deuda se ha vuelto tan malo, que realistamente no tienen oportunidad de pagar o incluso cumplir con los pagos de intereses en ejecución. Con la posibilidad real de quiebra, fue bajo circunstancias desesperadas que [From.GetAdjective] líder [From.GetLeader] había viajado a [Root.GetName] a fin de pedir [Root.GetLeader]Es ayuda.\n\n[From.GetNameWithFlag] nos está pidiendo que manejemos una parte de la deuda $[FROM.debt_bailout_display] §Ymil millones§! pagando dos tercios y perdonando al resto. Si lo hacemos, calmaría a otros prestamistas internacionales, reduciendo drásticamente [From.GetName]Es costos de préstamo, haciendo que su gran deuda sea manejable.\n\nAunque perderemos el dinero de hacer esto, ellos estarán seriamente en nuestra deuda, con nuestra influencia sobre ellos aumentando significativamente."
 bankruptcy.2.a: "Conceder el rescate a [From.GetNameWithFlag]"
