 committed_to_reducing_debt: "Comprometido a Reducir la Deuda"
 reduce_interest_rate: "Medidas Temporales de Tasa de Interés"
 reduce_interest_rate_desc: "Podemos solicitar temporalmente una tasa más baja para ayudar a mitigar nuestros problemas de deuda. La solicitud es válida solo por tres meses y luego vuelve a su nivel original."
 bankruptcy_decisions: "Deuda Nacional"
 bankruptcy_decisions_desc: "\n£MAIN_desctext_dept \n\n\n\n[ROOT.GetFlag]§YNuestro gobierno§! está adquiriendo más y más §Rdeuda§!. Recientemente hemos alcanzado un hito y ahora estamos pagando más que §R10%§! interés por nuestro interés actual §Ydeuda§!\n\n§YNota a Jugador§!: Una vez activada esta categoría de decisión, empezará a recibir eventos que impactarán la deuda de sus naciones. Esto puede ser en forma de mal usos o incluso pequeños boones como refinanciamiento temporal.\n\n§YTasa de interés§! is [?interest_rate|1]% §YDebt-to-GDP Ratio§!: §Y[?debt_ratio|-%1]§!\n§YIntereses pagados en deuda§! is §Y$$§! [?debt_rate|-3]\nIdea impact on §YTasa de interés§!: [?interest_rate_multiplier|-2]%\n\nTener un mayor §YTasa de interés§! que §Y10%§! nos dará acceso a las decisiones de emergencia para manejar nuestra deuda creciente. §Y15%§!, nuestra economía comenzará a desacelerar y sufriremos otros efectos adversos. En este punto, tendremos la capacidad de morder en nuestra deuda (a un gran costo). §YInteres§! va más allá §Y20%§!No seremos capaces de tomar manualmente más deudas. §YInterés en la deuda§! supera nuestros §YIngresos brutos§!Nuestra nación se derrumbe."
 bankruptcy_cheap_loans_from_imf: "Obtener Préstamos Baratos del FMI"
 bankruptcy_cheap_loans_from_imf_desc: "Como país desarrollado, podemos negociar con el FMI un préstamo con bajos intereses. Con este nuevo tipo de préstamos, pagaremos parte de nuestra deuda anterior, pero el FMI exige que equilibremos nuestro presupuesto. Tenemos un año para llevar a cabo esta iniciativa; de lo contrario, el FMI cobrará nuestra deuda mediante la confiscación de activos estatales. Es imperativo que tengamos éxito o nos espera un desastre.\n\n§YNota para el Jugador§!: Esta misión se eliminará después de 365 días y se volverá a agregar cada vez que fallemos. Además, te impedirá acceder a las siguientes mecánicas:\n- Inversiones Internas\n- Inversiones Internacionales."
 bankruptcy_seek_bailout_from_biggest_influencer: "Solicitar Rescate de Deuda a [?var:FROM.influence_array^0.GetNameWithFlag]"
 bankruptcy_seek_bailout_from_biggest_influencer_desc: "Podemos pedir a nuestros principales patrocinadores económicos que nos rescaten de parte de nuestra deuda y también la condonen. Naturalmente, esto otorgará al prestamista una gran influencia sobre nosotros."
 bankruptcy_seek_bailout_from_second_biggest_influencer: "Solicitar Rescate de Deuda a [?var:FROM.influence_array^1.GetNameWithFlag]"
 bankruptcy_seek_bailout_from_second_biggest_influencer_desc: "Podemos pedir a nuestros grandes patrocinadores económicos que nos rescaten de parte de nuestra deuda y también la condonen. Naturalmente, esto otorgará al prestamista una gran influencia sobre nosotros."
 bankruptcy_seek_bailout_from_neighbour: "Solicitar Rescate de Deuda a Nuestro Vecino [FROM.GetNameWithFlag]"
 bankruptcy_seek_bailout_from_neighbour_desc: "Parte del dinero que debemos proviene de nuestro vecino más rico, [FROM.GetNameDef]. Como son nuestros amistosos vecinos, ¿quizás deberíamos pedirles que nos rescaten?"
 bankruptcy_seek_bailout_from_overlord: "Solicitar Rescate de Deuda a Nuestro Señor [?overlord.GetNameWithFlag]"
 bankruptcy_seek_bailout_from_overlord_desc: "Dado que gran parte de nuestra política está controlada por nuestro señor, tiene sentido que también sean responsables de nuestras finanzas. Necesitamos pedirles que nos ayuden."
 bankruptcy_seek_bailout_from_imf: "Solicitar Rescate de Deuda al FMI"
 bankruptcy_seek_bailout_from_imf_desc: "Como último recurso, podemos pedir al FMI que nos brinde alivio de la deuda. Como el FMI representa a una multitud de instituciones financieras en todo el mundo, son muy estrictos con el uso de su dinero. Nos exigirán que realicemos cambios en nuestras políticas financieras para asegurarnos de que podamos pagar nuestras deudas en el futuro."
 bankruptcy_incoming_collapse: "Inminente Colapso Financiero"
 bankruptcy_incoming_collapse_desc: "Ahora todo está a la vista. Los intereses que nuestro gobierno paga por su deuda han crecido hasta tal punto que superan con creces nuestros ingresos totales. Esta es una situación de pesadilla y convencer a nuestra gente de que todo está bajo control será muy difícil."
 bankruptcy_default_on_debts: "Incumplir con Nuestras Deudas"
 bankruptcy_default_on_debts_desc: "Al dejar de pagar nuestras deudas, les indicaremos a nuestros deudores que no hay una manera realista de pagar toda nuestra deuda. Esta es una opción de último recurso para que un país muy endeudado resuelva su crisis de deuda. Por lo general, nuestros deudores saldan (condonan) parte de nuestra deuda, ya que generalmente prefieren recuperar parte de su dinero que perderlo todo en un colapso total. Sin embargo, esto no se logra sin concesiones políticas. Dejar de pagar nuestras deudas y no compensar a nuestros deudores de ninguna manera puede ser muy peligroso."
 cheap_loans_from_imf_tt: "El §1FMI§! nos pedirá que reduzcamos nuestros §YGastos Potenciales§! a nuestros §YIngresos Potenciales§! para sanear nuestra economía. Durante el próximo año no tendremos que pagar los intereses de nuestras deudas, pero si no lo hacemos, seremos castigados con la pérdida de activos estatales."
 bankruptcy_seek_bailout_from_biggest_influencer_tt: "Preguntaremos. [?var:FROM.influence_array^0.GetNameDef] para manejar §Y$[ROOT.debt_bailout_20_preview] mil millones§! pagarán tres cuartas partes de la suma y el resto se resolverá. [?var:FROM.influence_array^0.GetNameDef]La voluntad de pagar la deuda dependerá de su propia situación financiera.\n\nSi están de acuerdo con el trato, obtendrán §R15%§! ¡influyen en nosotros!\n\n"
 bankruptcy_seek_bailout_from_second_biggest_influencer_tt: "Preguntaremos. [?var:FROM.influence_array^1.GetNameDef] para manejar §Y$[ROOT.debt_bailout_15_preview] mil millones§! pagarán dos tercios de la suma y el resto se resolverá. [?var:FROM.influence_array^1.GetNameDef]La voluntad de pagar la deuda dependerá de su propia situación financiera.\n\nSi están de acuerdo con el trato, obtendrán §R10%§! ¡influyen en nosotros!\n\n"
 bankruptcy_seek_bailout_from_neighbour_tt: "Preguntaremos. [FROM.GetNameDef] para manejar §Y$[ROOT.debt_bailout_10_preview] mil millones§! pagarán la mitad de la suma y el resto se resolverá. [FROM.GetNameDef]La voluntad de pagar la deuda dependerá de su propia situación financiera.\n\nSi están de acuerdo con el trato, obtendrán §R5%§! ¡influyen en nosotros!\n\n"
 bankruptcy_seek_bailout_from_overlord_tt: "Preguntaremos. [?overlord.GetNameDef] para manejar §Y$[ROOT.debt_bailout_50_preview] mil millones§! pagarán la mitad de la suma y el resto se resolverá. [?overlord.GetNameDef]La voluntad de pagar la deuda dependerá de su propia situación financiera.\n\nSi están de acuerdo con el trato, obtendrán §R5%§! ¡influyen en nosotros!\n\n"
 bankruptcy_seek_bailout_from_imf_tt: "Nos pondremos en contacto con el FMI y les pediremos que resuelvan §Y$[ROOT.debt_bailout_10_preview] mil millones§! de nuestra deuda y nos dé una tasa de interés más baja durante un año. A cambio nos pedirán que cambiemos nuestras políticas financieras. §R Negar sus demandas nos verá castigados con una tasa de interés temporal más alta!§!\n\n"
 bankruptcy_seek_bailout_from_imf_low_gdp_per_capita_tt: "§RComo nuestro PIB/P es inferior a $5 mil, recibiremos demandas más duras de lo normal.¡§!"
 bankruptcy_incoming_collapse_complete_trigger: "¡Nuestro §YInterés sobre la Deuda§!(§Y$$[?debt_rate]§!) es menor que nuestros §YIngresos Brutos§!(§Y$$[?potential_income]§!)"
 bankruptcy_default_on_debts_tt: "§Y25%§! de nuestra deuda se liquidará de inmediato. §Y50%§! de nuestra deuda se transferirá a incumplimiento. Tendremos §Y360 días§! para encontrar una solución para deshacernos de esta deuda incumplida. §RSi no encontramos una solución a tiempo, nuestros influyentes podrían intentar obtener el dinero por la fuerza.¡§!\n\n"
 debt_default_cancel_int_investments: "¡Nuestras §YInversiones Internacionales§! y §YTesorería§! se establecerán en §Y$0§!.\n"
 debt_default_decisions: "Incumplimiento de Deuda"
 debt_default_decisions_desc: "Necesitamos encontrar una forma de liquidar nuestra deuda incumplida restante.\n\nDeuda incumplida restante: §Y$[?debt_default_left] mil millones§!"
 debt_default_main_mission: "Pagar Nuestra Deuda Incumplida"
 debt_default_main_mission_desc: "Necesitamos encontrar una forma de compensar, liquidar o pagar la deuda restante que hemos incumplido."
 debt_default_pay_10_from_treasury: "Pagar $10 mil millones de nuestra Tesorería"
 debt_default_pay_10_from_treasury_desc: "Una forma de pagar nuestras deudas antiguas es simplemente tomando nueva deuda y usando esa para pagar la antigua. Por supuesto, los acreedores no aceptarán este acuerdo solo para que podamos volver a incurrir en una alta deuda."
 debt_default_pay_50_from_treasury: "Pagar $50 mil millones de nuestra Tesorería"
 debt_default_pay_50_from_treasury_desc: "Una forma de pagar nuestras deudas antiguas es simplemente tomando nueva deuda y usando esa para pagar la antigua. Por supuesto, los acreedores no aceptarán este acuerdo solo para que podamos volver a incurrir en una alta deuda."
 debt_default_concessions_to_the_imf: "Concesiones Políticas al FMI"
 debt_default_concessions_to_the_imf_desc: "El FMI está exigiendo que tomemos medidas de austeridad drásticas para asegurarnos de no caer en el mismo abismo que antes. Sus términos son duros, pero se niegan a liquidar nuestras deudas si no hacemos lo que se nos dice."
 debt_default_political_concessions_to_biggest_influencer: "Concesiones Políticas a [?var:FROM.influence_array^0.GetNameWithFlag]"
 debt_default_political_concessions_to_biggest_influencer_desc: "Si aceptamos hacer algunas concesiones políticas al [?var:FROM.influence_array^0.GetAdjective], están dispuestos a liquidar parte de nuestra deuda."
 debt_default_political_concessions_to_second_biggest_influencer: "Concesiones Políticas a [?var:FROM.influence_array^1.GetNameWithFlag]"
 debt_default_political_concessions_to_second_biggest_influencer_desc: "Si aceptamos hacer algunas concesiones políticas al [?var:FROM.influence_array^1.GetAdjective], están dispuestos a liquidar parte de nuestra deuda."
 debt_default_sell_civilian_factories: "Vender Industrias Gubernamentales"
 debt_default_sell_civilian_factories_desc: "Para reunir algunos fondos y librarnos de nuestra deuda en mora, necesitamos desmantelar y vender parte del sector primario controlado por el Estado, como las empresas de construcción, las centrales eléctricas y los servicios públicos. Es un duro golpe para nuestra economía, pero es algo que hay que hacer."
 debt_default_dismantle_military_factories: "Desmantelar Industria Militar"
 debt_default_dismantle_military_factories_desc: "Algunas de nuestras plantas de fabricación de equipos militares deberían cerrarse para pagar la deuda pendiente. Seguramente, cualquier herramienta o equipo será de interés para otros países y podremos vender el inventario como piezas de repuesto."
 debt_default_scrap_dockyard: "Desguazar Astilleros"
 debt_default_scrap_dockyard_desc: "Tenemos algunas construcciones navales en curso. Si detenemos la construcción y desguazamos el barco inacabado, esto nos proporcionará algunos fondos. También deberíamos incluir el resto del equipo del astillero en el acuerdo."
 debt_default_cut_down_government_services: "Recortar en el Sector Oficinas"
 debt_default_cut_down_government_services_desc: "Es necesario reducir el gasto en algunos servicios gubernamentales y eliminar los espacios de oficinas no utilizados."
 debt_default_main_mission_complete_trigger: "La deuda incumplida restante es de $0"
 debt_default_pay_10_from_treasury_tt: "Utilizar §Y$$10 mil millones§! de nuestro §YTesoro§! para pagar parte de nuestras deudas antiguas\nDeuda incumplida restante: §G-$10§! mil millones"
 debt_default_pay_50_from_treasury_tt: "Utilizar §Y$$50 mil millones§! de nuestro §YTesoro§! para pagar parte de nuestras deudas antiguas\nDeuda incumplida restante: §G-$50§! mil millones"
 debt_default_concessions_to_the_imf_tt: "Deuda incumplida restante: §G-$[?debt_default_reduction]§!"
 debt_default_political_concessions_to_biggest_influencer_tt: "Deuda incumplida restante: §G-$[?debt_default_reduction]§!"
 sell_10_billion_factory: "Deuda incumplida restante: §G-$10§! mil millones"
 sell_15_billion_factory: "Deuda incumplida restante: §G-$15§! mil millones"
 lease_military_factories_tt: "§YArrendar Fábricas Militares§!"
 lease_military_factories_delayed_tt: "La producción autártica de bienes militares es algo del pasado. Podemos contratar y arrendar fábricas militares desde el extranjero para producir las mercancías que necesitamos.\n\n§Y Gastos adicionales:§! $ §R[?lease_military_factories_cost_display|-3]§!\n\nEstas fábricas no nos generarán §YGDP§! o §YIncome corporativo§!\nFábricas actualmente encabezadas: §Y[?leased_military_factories]§!"
 lease_civilian_factories_tt: "§YArrendar Complejos Civiles§!"
 lease_civilian_factories_delayed_tt: "Emplear empresas extranjeras de construcción y fabricación nos permitirá avanzar en nuestra propia industria.\n\n§Y Gastos adicionales:§! $ §R[?lease_civilian_factories_cost_display|-3]§!\n\nEstas fábricas no nos generarán §YGDP§! o §YIncome corporativo§!\nFábricas actualmente encabezadas: §Y[?leased_civilian_factories]§!"
 lease_naval_dockyards_tt: "§YArrendar Astilleros§!"
