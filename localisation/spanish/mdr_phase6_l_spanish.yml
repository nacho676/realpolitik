l_spanish:
 # Edificios nuevos
 mdr_desalination_plant: "Planta desalinizadora"
 mdr_desalination_plant_plural: "Plantas desalinizadoras"
 mdr_desalination_plant_desc: "Quita la sal del agua de mar para regar los campos y abastecer las ciudades, como en Israel, España o el Golfo Pérsico.\n\nProporciona al estado:\nRiego: un §YSuelo pobre o seco§! pasa a ser normal mientras la planta funcione, y un estado costero seco sin §YSuelo cultivable§! se vuelve cultivable\nNúmero base de trabajadores requeridos: §Y3.5K§!\nProducto del PIB base: §Y$0.42B§!\nConsumo base de energía: §R-0.17§! GW\n\nSolo en estados costeros, una por estado. El riego se aplica en cuanto termina la construcción (hasta una semana de demora)."
 mdr_recycling_plant: "Planta de reciclaje"
 mdr_recycling_plant_plural: "Plantas de reciclaje"
 mdr_recycling_plant_desc: "Recupera acero y aluminio de la chatarra y separa la basura antes de que llegue a los basurales.\n\nProporciona al estado:\n§YAcero§!: §G+1§! y §YMetales ligeros§!: §G+1§! por nivel\nContaminación: §G-4.5§! por nivel\nNúmero base de trabajadores requeridos: §Y6.2K§!\nProducto del PIB base: §Y$0.47B§!, más §Y$1B§! del sector de recursos por el acero y los metales ligeros\nConsumo base de energía: §R-0.09§! GW\n\nHasta 3 niveles por estado."
 mdr_regional_university: "Universidad regional"
 mdr_regional_university_plural: "Universidades regionales"
 mdr_regional_university_desc: "Una universidad pública con sus facultades, laboratorios y residencias, que forma profesionales para la región.\n\nProporciona al estado:\nCrecimiento de la productividad: §G+2.5%§! por nivel\nInvestigación nacional: §G+0.4%§! por universidad, hasta §G+4%§! (10 universidades)\nNúmero base de trabajadores requeridos: §Y11.8K§!\nProducto del PIB base: §Y$0.97B§!\nConsumo base de energía: §R-0.05§! GW\n\nHasta 2 niveles por estado."
 mdr_electric_arc_furnace: "Acería eléctrica"
 mdr_electric_arc_furnace_plural: "Acerías eléctricas"
 mdr_electric_arc_furnace_desc: "Funde chatarra con arcos eléctricos: hace acero sin minas de hierro ni carbón, pero gasta muchísima electricidad. Hoy produce casi un tercio del acero del mundo.\n\nProporciona al estado:\n§YAcero§!: §G+4§! por nivel\nNúmero base de trabajadores requeridos: §Y9K§!\nProducto del PIB base: §Y$3.9B§!, más §Y$2B§! del sector de recursos por el acero\nConsumo base de energía: §R-1.35§! GW\n\nUsa espacios de edificios compartidos. Hasta 2 niveles por estado."
 mdr_data_center: "Centro de datos"
 mdr_data_center_plural: "Centros de datos"
 mdr_data_center_desc: "Naves llenas de servidores para la nube, el comercio electrónico y la inteligencia artificial. Mucho valor con poca gente, pero un enorme consumo eléctrico.\n\nProporciona al estado:\nNúmero base de trabajadores requeridos: §Y9.3K§!\nProducto del PIB base: §Y$23.5B§!\nConsumo base de energía: §R-1.6§! GW\n\nNecesita §YInfraestructura de red§! de nivel 2 en el estado. Usa espacios de edificios compartidos. Hasta 5 niveles por estado."
 mdr_smart_grid_center: "Centro de red eléctrica inteligente"
 mdr_smart_grid_center_plural: "Centros de red eléctrica inteligente"
 mdr_smart_grid_center_desc: "Medidores inteligentes, control automático de la demanda y baterías que ajustan el consumo de las fábricas y oficinas del estado.\n\nProporciona al estado:\nAhorro de energía: §G15%§! de lo que consumen los edificios del estado, hasta §G1.25§! GW\nNúmero base de trabajadores requeridos: §Y4.1K§!\nProducto del PIB base: §Y$0.78B§!\n\nUsa un espacio de edificio compartido. Uno por estado. El ahorro se calcula cada semana."
 mdr_fishing_port: "Puerto pesquero"
 mdr_fishing_port_plural: "Puertos pesqueros"
 mdr_fishing_port_desc: "Muelles, flota pesquera, cámaras de frío y fábricas de conservas.\n\nProporciona al país:\nComida: §G+140§! mil toneladas por año (en equivalente de cereal), que no sufren sequías\nNúmero base de trabajadores requeridos: §Y2.9K§!\nProducto del PIB base: §Y$0.21B§!\n\nSolo en provincias costeras, uno por provincia."
 mdr_fortified_ammo_depot: "Depósito de munición fortificado"
 mdr_fortified_ammo_depot_plural: "Depósitos de munición fortificados"
 mdr_fortified_ammo_depot_desc: "Búnkeres de hormigón enterrados para guardar munición lejos del frente y de los bombardeos.\n\nProporciona al país:\nCapacidad de munición: §G+60.000§! cajas\n\nLos bombardeos le hacen menos de un tercio del daño normal. Uno por provincia."
 mdr_science_campus: "Campus científico"
 mdr_science_campus_plural: "Campus científicos"
 mdr_science_campus_desc: "Laboratorios, aceleradores e incubadoras de empresas alrededor de una gran universidad de investigación.\n\nAcelera la §Yinstalación de proyectos especiales§! de su propio estado: §G+7%§! a la velocidad de los proyectos de ese tipo por cada campus, hasta §G+21%§! (3 campus por tipo).\nNúmero base de trabajadores requeridos: §Y800§!\nConsumo base de energía: §R-0.08§! GW\n\nEs aparte de las instalaciones de proyectos especiales: no ocupa su lugar ni investiga proyectos propios. Solo una por estado, en cualquier provincia con centro de suministro o al lado de una. Acelera las instalaciones de todo el estado."
 specialization_mdr_campus: "Campus científico"
 mdr_fishing_food: "£wheat_texticon Comida de la pesca (mil toneladas por año)"
 mdr_ammo_depot_capacity: "£infantry_equipment_texticon Capacidad de munición de los depósitos (miles de cajas)"
 mdr_buildings_modifier: "Edificios de Realpolitik"

 # Contaminación y clima
 mdr_pollution_moderate: "Contaminación moderada"
 mdr_pollution_moderate_desc: "Las fábricas y centrales del estado ensucian el aire y el agua. El castigo desaparece cuando la contaminación baja de 25."
 mdr_pollution_high: "Contaminación alta"
 mdr_pollution_high_desc: "El esmog y el agua sucia enferman a la gente y dañan los cultivos. Baja con plantas de reciclaje, tecnología más limpia o cerrando industrias sucias."
 mdr_pollution_severe: "Contaminación grave"
 mdr_pollution_severe_desc: "Una de las zonas más contaminadas del mundo: el aire se ve, los ríos están muertos y la gente se va. Baja con plantas de reciclaje, tecnología más limpia o cerrando industrias sucias."
 MAPMODE_MDR_POLLUTION_MAP_MODE: "Contaminación"
 MAPMODE_MDR_POLLUTION_MAP_MODE_NAME: "Contaminación"
 MAPMODE_MDR_POLLUTION_MAP_MODE_DESCRIPTION: "Muestra cuánto contamina cada estado. Verde: limpio; amarillo: moderado; marrón: alto; gris: grave."
 mdr_pollution_map_mode_tooltip: "Contaminación en [FROM.GetName]"
 mdr_pollution_map_mode_tooltip_delayed: "Contaminación de §Y[FROM.GetName]§!: §Y[?FROM.mdr_pollution|0]§! de 100\n\nModerada desde 25, alta desde 45, grave desde 70. Contaminan las fábricas, las centrales de combustibles fósiles, las refinerías, las acerías y las minas; las plantas de reciclaje la bajan, y la tecnología se vuelve más limpia con los años. Cada estado también recibe el 12% de lo que emiten sus vecinos.\n\nCalentamiento global: §R+[?global.mdr_warming|2] °C§!"
 mdr_climate.1.t: "El planeta ya es un grado más caliente"
 mdr_climate.1.d: "Los científicos confirman que la temperatura media del planeta ya supera en un grado a la de antes de la industria. Las olas de calor, las sequías y las tormentas son cada vez más frecuentes.\n\nCalentamiento global: §R+[?global.mdr_warming|2] °C§!"
 mdr_climate.1.a: "Habrá que adaptarse."
 mdr_climate.2.t: "Se cruza el límite de 1,5 grados"
 mdr_climate.2.d: "El mundo superó el grado y medio de calentamiento, el límite que el Acuerdo de París quería evitar. Los eventos climáticos extremos alcanzan su nivel más alto.\n\nCalentamiento global: §R+[?global.mdr_warming|2] °C§!"
 mdr_climate.2.a: "Llegamos tarde."

 # Tratados climáticos
 mdr_treaty_join_11: "Ratificar el Protocolo de Kioto"
 mdr_treaty_join_11_desc: "Nos comprometemos a reducir nuestras emisiones de gases de efecto invernadero.\n\nSi somos un país rico (PIB per cápita mayor a 15 mil dólares), nuestras emisiones bajan un §G12%§! y pagamos alrededor del §R0,2%§! del PIB por año durante 7 años."
 mdr_treaty_leave_11: "Abandonar el Protocolo de Kioto"
 mdr_treaty_leave_11_desc: "Dejamos de cumplir las metas de emisiones, como Canadá en 2011. Los demás miembros lo verán mal."
 mdr_treaty_join_12: "Ratificar el Acuerdo de París"
 mdr_treaty_join_12_desc: "Presentamos un plan nacional para bajar las emisiones y mantener el calentamiento por debajo de 2 grados.\n\nNuestras emisiones bajan un §G6%§!, o un §G14%§! si somos un país rico (no se suma a Kioto). Si somos un país rico (PIB per cápita mayor a 15 mil dólares), pagamos alrededor del §R0,25%§! del PIB por año durante 10 años."
 mdr_treaty_leave_12: "Abandonar el Acuerdo de París"
 mdr_treaty_leave_12_desc: "Dejamos el acuerdo, como hizo Estados Unidos en 2020 y otra vez en 2026. Los demás miembros lo verán mal."
 mdr_treaties.3.d16: "En la historia real, Canadá abandonó el Protocolo de Kioto en 2011 porque no iba a cumplir sus metas. ¿Seguimos ese camino?"
 mdr_treaties.3.d17: "En la historia real, en esta época ratificamos el Protocolo de Kioto y aceptamos metas para bajar nuestras emisiones. ¿Lo ratificamos?"
 mdr_treaties.3.d18: "En la historia real, Estados Unidos abandonó el Acuerdo de París: en 2020, y otra vez en 2026 tras volver en 2021. ¿Seguimos ese camino?"
 mdr_treaties.3.d19: "En la historia real, en esta época ratificamos el Acuerdo de París sobre el cambio climático. ¿Lo ratificamos?"
 mdr_treaties.4.d11: "[mdr_treaty_news_country.GetNameDefCap] abandonó el Protocolo de Kioto y no cumplirá sus metas de emisiones."
 mdr_treaties.4.d12: "[mdr_treaty_news_country.GetNameDefCap] abandonó el Acuerdo de París. La lucha contra el cambio climático pierde a uno de sus miembros."
 mdr_left_climate_treaty: "Abandonó un tratado climático"

 # Sociedad
 mdr_society_pay_tt: "Costo: §R$[?mdr_society_cost|2]B§!"
 mdr_society_protest_down_big_tt: "Fuerza de las protestas: §G-8§!"
 mdr_society_protest_down_small_tt: "Fuerza de las protestas: §G-3 a -4§!, pero la radicalización aumenta"
 mdr_society_protest_up_tt: "Fuerza de las protestas: §R+4 a +5§!"
 mdr_society_protest_up_big_tt: "Fuerza de las protestas: §R+7§!"
 mdr_society_inequality_down_big_tt: "Índice de desigualdad: §G-4§!"
 mdr_society_inequality_down_tt: "Índice de desigualdad: §G-2,5§!"
 country_resource_cost_uranium: "Consumo de Uranio"
 country_resource_cost_uranium_tt: "$country_resource_cost_uranium$: $RIGHT|-=%1$"
 country_resource_cost_wheat: "Consumo de Granos"
 country_resource_cost_rare_earths: "Consumo de Tierras raras"
 country_resource_cost_rare_earths_tt: "$country_resource_cost_rare_earths$: $RIGHT|-=%1$"
 state_resources_wheat_factor: "Producción de granos del estado"
 state_resources_rare_earths_factor: "Producción de tierras raras del estado"
 mdr_isolated_economy: "Economía Aislada"
 mdr_isolated_economy_desc: "Autarquía total, como Corea del Norte o la Albania de Hoxha. El 0% de nuestros recursos sale al mercado: da igual que haya o no compradores, no exportamos nada. Seguimos pudiendo comprar a quien quiera vendernos.\n\nSolo para gobiernos autocráticos o países en guerra."
 mdr_bloc_economy: "Economía de Bloque"
 mdr_bloc_economy_desc: "Como el antiguo COMECON: una economía volcada al bloque. El 50% de nuestros recursos sale al mercado, y las exportaciones rinden un poco más. No cambia la opinión de nadie hacia nosotros: seguimos comprando y vendiendo con quien quiera.\n\nHace falta estar en una facción, tener países títere o ser uno."
 MDR_AMMO_TOPBAR_FULL: "Lleno"
 MDR_AMMO_TOPBAR_FILLING: "[?mdr_ammo_eta_days|0]d"
 MDR_AMMO_TOPBAR_EMPTYING: "§R[?mdr_ammo_eta_days|0]d§!"
 MDR_AMMO_ETA_FULL: "§GReserva llena§!"
 MDR_AMMO_ETA_FILL: "se llena en §Y[?mdr_ammo_eta_days|0]§! días"
 MDR_AMMO_ETA_EMPTY: "§Rse vacía en [?mdr_ammo_eta_days|0] días§!"
 MDR_AMMO_ETA_STEADY: "estable"
 # Leyes de Sociedad e Información
 mdr_assembly_law: "Ley de reunión y manifestación"
 mdr_civil_society_law: "Ley de sociedad civil"
 mdr_union_law: "Ley de sindicatos y huelga"
 mdr_surveillance_law: "Ley de vigilancia y privacidad"
 mdr_assembly_free: "Libertad de manifestación"
 mdr_assembly_free_desc: "Cualquiera puede salir a la calle sin pedir permiso. Hay más protestas visibles, pero el enojo se descarga y no se acumula.\n\nCada semana: fuerza de las protestas §R+0,4§!, descontento contenido §G-1,5§!. Las protestas por comida o desigualdad salen más seguido."
 mdr_assembly_regulated: "Manifestaciones con aviso previo"
 mdr_assembly_regulated_desc: "Las marchas se avisan a las autoridades, que fijan el recorrido. Es el modelo de la mayoría de las democracias.\n\nCada semana: descontento contenido §G-0,5§!."
 mdr_assembly_restricted: "Manifestaciones restringidas"
 mdr_assembly_restricted_desc: "Hace falta un permiso que casi nunca se da, hay zonas prohibidas y la policía disuelve las marchas no autorizadas.\n\nCada semana: fuerza de las protestas §G-0,6§!, descontento contenido §R+0,6§!. Las protestas salen menos seguido."
 mdr_assembly_banned: "Manifestaciones prohibidas"
 mdr_assembly_banned_desc: "Solo se permiten las marchas organizadas por el Estado. Las calles están tranquilas, pero el enojo se acumula y la radicalización crece.\n\nCada semana: fuerza de las protestas §G-1,5§!, descontento contenido §R+1,5§!. Si el descontento pasa de 60 puede haber un §Restallido social§!."
 mdr_ngo_free: "Sociedad civil libre"
 mdr_ngo_free_desc: "Las ONG, fundaciones y asociaciones se forman sin pedir permiso y pueden recibir fondos del exterior. Atraen inversión y conocimiento, pero también influencia extranjera."
 mdr_ngo_registered: "Registro obligatorio de asociaciones"
 mdr_ngo_registered_desc: "Las organizaciones deben registrarse y presentar sus cuentas. Es el modelo de la mayoría de los países."
 mdr_ngo_foreign_agents: "Ley de agentes extranjeros"
 mdr_ngo_foreign_agents_desc: "Las organizaciones que reciben dinero del exterior deben marcarse como «agentes extranjeros» y sufren inspecciones constantes, como en Rusia desde 2012. La influencia extranjera cae, y también la confianza de los inversores."
 mdr_ngo_banned: "Organizaciones independientes prohibidas"
 mdr_ngo_banned_desc: "Solo existen las organizaciones que controla el Estado. Nadie puede organizarse por su cuenta."
 mdr_unions_free: "Libertad sindical plena"
 mdr_unions_free_desc: "Sindicatos fuertes negocian salarios y pueden ir a la huelga cuando quieren. Los sueldos suben y la desigualdad baja, pero hay más huelgas.\n\nDesigualdad: §G-0,05§! por mes. Las huelgas salen más seguido."
 mdr_unions_regulated: "Huelgas reguladas"
 mdr_unions_regulated_desc: "Los sindicatos son libres, pero las huelgas necesitan votación previa y servicios mínimos.\n\nDesigualdad: §G-0,02§! por mes."
 mdr_unions_state: "Sindicato único del Estado"
 mdr_unions_state_desc: "Un solo sindicato oficial, controlado por el gobierno, como en China o Vietnam. No hay huelgas independientes.\n\nDesigualdad: §R+0,03§! por mes. Las huelgas salen mucho menos."
 mdr_unions_banned: "Sindicatos prohibidos"
 mdr_unions_banned_desc: "No hay sindicatos ni derecho a huelga, como en las monarquías del Golfo. Las fábricas producen sin interrupciones, pero el enojo se acumula.\n\nDesigualdad: §R+0,06§! por mes. Descontento contenido §R+0,5§! por semana."
 mdr_privacy_protected_req_tt: "La ley actual es §Y$mdr_surveillance_judicial$§!"
 mdr_surveillance_judicial_req_tt: "La ley actual es §Y$mdr_privacy_protected$§! o §Y$mdr_surveillance_mass$§!"
 mdr_surveillance_mass_req_tt: "La ley actual es §Y$mdr_surveillance_judicial$§! o §Y$mdr_surveillance_total$§!"
 mdr_surveillance_total_req_tt: "La ley actual es §Y$mdr_surveillance_mass$§!"
 mdr_privacy_protected: "Privacidad garantizada"
 mdr_privacy_protected_desc: "Los datos personales están protegidos por ley, como con el reglamento europeo de protección de datos. Las empresas tecnológicas confían, pero a los espías extranjeros les cuesta menos pasar desapercibidos."
 mdr_surveillance_judicial: "Vigilancia con orden judicial"
 mdr_surveillance_judicial_desc: "El Estado puede espiar comunicaciones solo con la orden de un juez."
 mdr_surveillance_mass: "Vigilancia masiva"
 mdr_surveillance_mass_desc: "Las comunicaciones se recolectan en masa y se analizan sin orden judicial. Los servicios secretos detectan más espías y organizadores de protestas.\n\nCada semana: fuerza de las protestas §G-0,3§!."
 mdr_surveillance_total: "Estado policial digital"
 mdr_surveillance_total_desc: "Cámaras con reconocimiento facial, crédito social y control de cada pago y mensaje. Casi nada escapa al Estado, pero la innovación se ahoga y el miedo alimenta el enojo.\n\nCada semana: fuerza de las protestas §G-0,8§!, descontento contenido §R+0,5§!."
 mdr_society.5.t: "Estallido social"
 mdr_society.5.d: "Años de protestas prohibidas y sindicatos silenciados terminan de golpe. Una chispa cualquiera, un precio, un muerto o una detención, saca a cientos de miles a la calle en todas las ciudades del país."
 mdr_society.5.a: "Ceder: permitir las protestas y prometer reformas."
 mdr_society.5.b: "Aplastar el levantamiento."
 mdr_society_explosion_tt: "Fuerza de las protestas: §R+20§!"
 mdr_society_explosion_concede_tt: "Las manifestaciones vuelven a estar §Ypermitidas con aviso previo§!, el descontento contenido baja a §G15§! y la fuerza de las protestas §G-10§!"
 mdr_society_explosion_crush_tt: "La fuerza de las protestas baja §G-12§!, pero la radicalización sube §R+2§! y el descontento contenido queda en §R35§!"
 mdr_retirement_law: "Edad de jubilación"
 mdr_retire_60_req_tt: "La ley actual es §Y$mdr_retire_62$§!"
 mdr_retire_62_req_tt: "La ley actual es §Y$mdr_retire_60$§! o §Y$mdr_retire_65$§!"
 mdr_retire_65_req_tt: "La ley actual es §Y$mdr_retire_62$§! o §Y$mdr_retire_67$§!"
 mdr_retire_67_req_tt: "La ley actual es §Y$mdr_retire_65$§! o §Y$mdr_retire_70$§!"
 mdr_retire_70_req_tt: "La ley actual es §Y$mdr_retire_67$§!"
 mdr_retire_60: "Jubilación a los 60 años"
 mdr_retire_60_desc: "La gente se jubila temprano, como en Francia, Rusia o China a comienzos de siglo. Es popular, pero hay menos trabajadores y las pensiones son caras, sobre todo en un país que envejece."
 mdr_retire_62: "Jubilación a los 62 años"
 mdr_retire_62_desc: "Una edad intermedia, como la de Francia después de la reforma de 2010."
 mdr_retire_65: "Jubilación a los 65 años"
 mdr_retire_65_desc: "La edad de jubilación más común en los países desarrollados."
 mdr_retire_67: "Jubilación a los 67 años"
 mdr_retire_67_desc: "La edad que adoptaron Alemania, Noruega o Islandia para sostener las pensiones con una población cada vez más vieja."
 mdr_retire_70: "Jubilación a los 70 años"
 mdr_retire_70_desc: "La gente trabaja casi toda la vida: sobran trabajadores y las pensiones cuestan poco, pero es muy impopular.\n\nSubir la edad de jubilación siempre provoca protestas (fuerza de las protestas §R+8§!) y, en las democracias, §R-3%§! de estabilidad."
