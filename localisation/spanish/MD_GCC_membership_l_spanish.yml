l_spanish:
 GCC_endorse_EGY: "Respaldar a [EGY.GetName] para su ingreso al CCG"
 GCC_endorse_EGY_desc: "Tira nuestro peso detrás de la propuesta de Egipto para unirse al Consejo de Cooperación del Golfo. Una vez que cada miembro los avala, el Miembro Dominant puede cursar una invitación formal."
 GCC_invite_EGY: "Invitar a [EGY.GetName] al CCG"
 GCC_invite_EGY_desc: "Todos los miembros del Consejo han respaldado a Egipto. Como miembro dominante, extender una invitación formal para unirse al Consejo de Cooperación del Golfo."
 GCC_all_members_endorse_EGY_tt: "Cada miembro del GCC debe apoyar a Egipto primero."
