 gcc_invite.1.t: "Una invitación del Golfo"
 gcc_invite.1.d: "[FROM.GetName], hablando por el Consejo de Cooperación del Golfo, nos ha invitado formalmente a unirse al sindicato. La membresía vincularía nuestra economía y seguridad con el bloque más rico del mundo árabe. El Consejo espera nuestra respuesta."
 gcc_invite.1.a: "Aceptamos. Viva el Consejo."
 gcc_invite.1.b: "Debemos declinar, por ahora."
 gcc_invite.2.t: "El GCC recibe a un nuevo miembro"
 gcc_invite.2.d: "En una ceremonia en Riad, el Consejo de Cooperación del Golfo ha admitido formalmente a un nuevo Estado miembro, ampliando la unión más allá de las costas del Golfo por primera vez. El alcance del bloque y sus ambiciones crecen."
 gcc_invite.2.a: "Un día histórico."
 gcc_invite.3.t: "La invitación está declinada"
 gcc_invite.3.d: "Nuestra invitación fue rechazada. La expansión del Consejo tendrá que esperar a un socio más dispuesto, o un cambio de corazón."
 gcc_invite.3.a: "So be it."
