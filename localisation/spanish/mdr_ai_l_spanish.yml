l_spanish:
 MDR_RULE_AI: "Inteligencia artificial"
 MDR_RULE_AI_IMPROVED: "Mejorada"
 MDR_RULE_AI_IMPROVED_DESC: "La IA ataca solo con ventaja, se defiende cuando pierde o se queda sin munición, protege la capital, equipa antes de crecer y pide la paz cuando va perdiendo. Además usa las leyes, tratados y embargos del mod."
 MDR_RULE_AI_NORMAL: "Normal"
 MDR_RULE_AI_NORMAL_DESC: "Solo los parámetros de combate más prudentes y el uso de leyes, tratados y embargos del mod. Sin posturas de guerra propias."
 MDR_RULE_AI_EXPERT: "Experta"
 MDR_RULE_AI_EXPERT_DESC: "Como Mejorada, pero ataca con menos ventaja, concentra más sus ofensivas y los vecinos se unen para contener a quien conquista demasiado. Sin trampas."
 mdr_ai.1.t: "Levantan el embargo"
 mdr_ai.1.d: "[mdr_ai_lifter.GetNameDefCap] levantó su embargo contra nosotros. Le faltan recursos que nosotros producimos de sobra, y la necesidad pudo más que la política."
 mdr_ai.1.a: "Volverán a comprarnos."
 mdr_ai.2.t: "Piden la paz"
 mdr_ai.2.d: "[mdr_ai_peace_asker.GetNameDefCap] está al borde del colapso y nos propone terminar la guerra sin cambios de fronteras. Aceptar ahorra vidas y munición; rechazar puede darnos una victoria completa."
 mdr_ai.2.a: "Aceptamos la paz."
 mdr_ai.2.b: "Seguiremos hasta el final."
 mdr_ai_peace_msg: "Paz blanca"
