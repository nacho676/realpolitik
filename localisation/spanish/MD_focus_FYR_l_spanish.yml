l_spanish:
 FYR_political.1.t: "Insurgencia en el noroeste"
 FYR_political.1.d: "Los militantes etnicos albaneses que se autodenominan el Ejército de Liberación Nacional han incautado la aldea fronteriza de Tanuševci, y los enfrentamientos con las fuerzas de seguridad se están extendiendo hacia Tetovo. Skopje teme la guerra que salvó a Macedonia en los años noventa finalmente ha llegado."
 FYR_political.1.a: "Solicite la mediación internacional"
 FYR_political.1.b: "Aplastar la insurgencia"
 FYR_political.2.t: "El Acuerdo Marco Ohrid"
 FYR_political.2.d: "Los dirigentes del Gobierno y de los partidos albaneses han firmado un acuerdo marco en Ohrid bajo mediación occidental. El idioma albanés adquiere la condición oficial en los municipios donde la minoría supera a una quinta parte de la población, la policía está rota y los insurgentes entregarán sus armas a los coleccionistas de la OTAN bajo amnistía."
 FYR_political.2.a: "El poder compartido es mejor que la guerra"
 FYR_political.3.t: "El Acuerdo de Prespa"
 FYR_political.3.d: "A orillas del lago Prespa, los negociadores de Skopje y Atenas han iniciado un acuerdo para poner fin a la disputa de nombres de décadas. El país se convertiría en la República del Norte de Macedonia, y a cambio Grecia levanta su veto sobre la adhesión a la OTAN y las conversaciones europeas de adhesión."
 FYR_political.3.a: "Firme y tome la ruta euroatlántica"
 FYR_political.3.b: "No cambiaremos el nombre de nuestra nación."