 CYBER_ATTRIB_BTN_TT: "§YPrerequisitos:§!\n[!cyber_attribution_hunt_button_click_enabled]\n§YEfecto:§!\n[!cyber_attribution_hunt_button_click]"
 CYBER_GPS_BTN_TT_DELAYED: "El malware especializado infiltra la infraestructura de recepción satelital del objetivo, inundando sistemas de navegación militar con señales esponjosas. En el campo, los comandantes luchan por coordinar como hitos familiares desaparecen de sus mapas digitales. Incluso las maniobras rutinarias se vuelven peligrosas cuando falla la navegación de precisión."
 CYBER_SIGINT_BTN_TT_DELAYED: "Un implante persistente se hunde silenciosamente en la columna vertebral de las telecomunicaciones del objetivo, copiando el tráfico a través de canales gubernamentales, militares y diplomáticos. Semana a semana, la corriente interceptada construye un retrato detallado de las intenciones, vulnerabilidades y disputas internas del objetivo. Inteligencia que ningún espía convencional podría reunirse."
 CYBER_RADAR_BTN_TT_DELAYED: "Los contactos fantasma florecen a través de las pantallas de radar de defensa aérea del objetivo. Los operadores se agitan para rastrear aviones que no existen, quemando a través de ciclos de alerta persiguiendo fantasmas. Los vuelos reales se deslizan a través de los huecos sin ser detectados. La ventana es breve, pero treinta días de detección del aire degradado pueden ser decisivos en una campaña activa."
 CYBER_ECON_BTN_TT_DELAYED: "Los procesadores de pago comienzan a lanzar errores. Trading algoritmos se ahogan en los datos dañados alimenta. Los controladores de planta de fábrica reciben paquetes de actualización malformados. El ataque está diseñado para ser deniable: una cascada de fracasos técnicos aparentemente no relacionados que drenan silenciosamente la producción económica del objetivo durante meses."
 CYBER_PROP_BTN_TT_DELAYED: "Miles de cuentas coordinadas inundan el entorno mediático del objetivo con narrativas contradictorias. Los documentos del gobierno estructurado circulan en las redes sociales. El objetivo no es engañar sino agotar. Una población que ya no puede distinguir el hecho de la ficción pierde confianza en todas las instituciones, incluyendo su propio gobierno."
 CYBER_ELECT_BTN_TT_DELAYED: "Los sistemas de registro de votantes están subtly dañados. El video de los líderes de la oposición circula en los últimos días antes de la votación. Los algoritmos de redes sociales se juegan para amplificar las divisiones existentes. Las instituciones democráticas del objetivo no son destruidas. Se hacen silenciosamente irrefutables, sus resultados impugnados antes de que se cuente una sola votación."
 CYBER_ESPION_BTN_TT_DELAYED: "Una campaña de espiga plantas implantes personalizados dentro de las redes de investigación más sensibles del objetivo. El malware se mueve lateralmente durante meses, cosechando planos, datos de prueba y fórmulas patentadas. Para cuando se descubre la brecha, nuestros investigadores ya están construyendo lo que robaron."
 CYBER_COMMS_BTN_TT_DELAYED: "Un hombre en el medio silencioso se posiciona a través de los nodos de comunicación más sensibles del objetivo. Las órdenes de los generales, los cables de embajadores y las deliberaciones del gabinete pasan por el mismo relé comprometido: copiado, catalogado y entregado a nuestros analistas en tiempo real. El objetivo sigue tomando decisiones, sin darse cuenta de que leemos cada uno."
 CYBER_INFRA_BTN_TT_DELAYED: "Los sistemas de control industrial que gestionan la distribución de energía, el tratamiento de agua y los nodos logísticos reciben actualizaciones silenciosas y maliciosas del firmware. Cuando la carga útil dispara, los fallos de cascada abruman a equipos de reparación en varios sectores simultáneamente. El daño es real, físico y lento para revertir."
 CYBER_FIN_BTN_TT_DELAYED: "Los sistemas de liquidación del banco central se oscurecen. Las redes ATM fallan en todo el país. Los algoritmos de comercio de divisas reciben insumos envenenados que desencadenan un fallo flash. La perturbación va mucho más allá de lo que las sanciones convencionales podrían lograr, y a diferencia de las sanciones, no conlleva ninguna atribución."
 CYBER_LOG_BTN_TT_DELAYED: "El software de gestión de la cadena de suministro se bloquea en cada base de operaciones avanzada simultáneamente. Las solicitudes de municiones desaparecen en colas corruptas. Los algoritmos de asignación de combustible en la ruta convoyes a depósitos inexistentes. La máquina militar del enemigo no se rompe en la batalla. Se muere de hambre en su lugar."
 CYBER_SLEEP_BTN_TT_DELAYED: "Paciente, metódico, invisible. Nuestros operativos no están aquí para atacar. Están aquí para quedarse. Los puntos de acceso de Dormant están incrustados en el tejido crítico de red del objetivo, posicionados para la activación al mando. Para el próximo año, sus sistemas más sensibles pueden no tener secretos en absoluto."
 CYBER_CRIT_BTN_TT_DELAYED: "El peso total de nuestro arsenal cibernético descende inmediatamente. Las redes de energía fallan. Las comunicaciones militares colapsan. Paradas de producción industrial. Congelación de sistemas financieros. La operación es el equivalente digital de una campaña de bombardeos estratégicos, dejando al mismo tiempo el objetivo arraigado funcionalmente en todos los dominios del poder nacional."
 CYBER_DECEPT_BTN_TT_DELAYED: "No atacamos los sistemas del objetivo. Le corrompemos la mente. Evaluaciones de inteligencia confeccionadas, órdenes esporádicas que llevan firmas de autenticación de comandantes mayores, imágenes manipuladas presentadas a los responsables de la adopción de decisiones en los niveles más altos. Cada elección que el objetivo hace se construye potencialmente en una realidad que fabricamos."
 CYBER_ZERO_BTN_TT_DELAYED: "Un arsenal clasificado de explotaciones previamente desconocidas, acumulado a lo largo de años y reservado precisamente para este momento, se implementa simultáneamente contra los sistemas más críticos del objetivo. Para cuando sus analistas entienden lo que pasó, las vulnerabilidades se queman y el daño es irreversible."
 CYBER_HARDEN_BTN_TT_DELAYED: "Nuestros equipos de seguridad auditan cada interfaz expuesta, remplazan toda vulnerabilidad conocida y endurecen los protocolos que las agencias de inteligencia extranjeras más frecuentemente sondean. El trabajo es inglamoroso, pero cada puerta que cerramos es un vector menos para que un adversario explote. La mejor operación cibernética es la que nunca aterriza."
 CYBER_CNTRINT_BTN_TT_DELAYED: "Los analistas revisan los registros de red y la telemetría del sistema en busca de indicios sutiles de presencia extranjera: patrones de acceso anómalos, conexiones salientes inesperadas, procesos inactivos sin propósito legítimo. Limpiar una red infectada es un trabajo lento y minucioso. Un implante sin detectar es mucho más peligroso que uno conocido."
 CYBER_ATTRIB_BTN_TT_DELAYED: "Nuestros equipos forenses digitales reconstruir la ruta de ataque: rastrear firmas de malware, mapear infraestructura de comando y control, y catalogar los patrones operativos de seguridad que identifican al actor responsable. Nombrar el estado detrás de la intrusión es el primer paso hacia una respuesta proporcional."
