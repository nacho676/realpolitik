 cyber_network_hardening_complete_tt: "Red endurecimiento completo. Se ha reforzado la infraestructura de red crítica y se han reducido las vulnerabilidades conocidas."
 cyber_counter_intrusion_complete_tt: "Completo barrido de contraintrusión. Todos los implantes extranjeros detectados y las cargas de pago persistentes han sido eliminados de nuestras redes."
 cyber_attribution_hunt_complete_tt: "Caza de atribución completa. Los analistas de inteligencia han concluido su examen forense de la reciente actividad de intrusión."
 cyber_gps_tracking_complete_tt: "La operación de interferencia del GPS se resolvió. Nuestro equipo de señales ha concluido su perturbación de los sistemas de navegación por satélite del objetivo."
 cyber_economic_tracking_complete_tt: "La operación de perturbación económica se resolvió. Nuestros equipos cibernéticos han concluido su campaña dirigida a la infraestructura financiera del adversario."
 cyber_propaganda_tracking_complete_tt: "La operación Propaganda se resolvió. Nuestras unidades de información han concluido su campaña de influencia contra la población objetivo."
 cyber_infra_tracking_complete_tt: "Un ataque de infraestructura resuelto. Nuestros operativos han concluido su asalto sostenido a la infraestructura crítica del adversario."
 cyber_crit_tracking_complete_tt: "La operación de huelga crítica se resolvió. Nuestras unidades han ejecutado su carga útil de alta prioridad contra los sistemas más vitales del objetivo."
 cyber_sigint_surveillance_tracking_complete_tt: "La operación de vigilancia SIGINT resolvió. Nuestros equipos de interceptación han concluido su colección de inteligencia de señales del objetivo."
 cyber_radar_spoofing_tracking_complete_tt: "La operación de spoofing Radar resolvió. Nuestros equipos de guerra electrónica han concluido su perturbación de la red de vigilancia aérea del adversario."
 cyber_election_interference_tracking_complete_tt: "La operación de interferencia electoral se resolvió. Nuestras unidades de influencia han concluido su campaña encubierta dirigida al proceso electoral del adversario."
 cyber_industrial_espionage_tracking_complete_tt: "La operación de espionaje industrial resolvió. Nuestros operativos han extraído datos específicos de investigación y desarrollo del adversario."
 cyber_comms_intercept_tracking_complete_tt: "La operación de interceptación de comunicaciones se resolvió. Nuestros equipos han concluido su penetración sostenida de las redes de mando y control del adversario."
 cyber_financial_system_attack_tracking_complete_tt: "Ataque del sistema financiero resuelto. Nuestras unidades han concluido su operación dirigida a la infraestructura bancaria y de pago del adversario."
 cyber_logistics_disruption_tracking_complete_tt: "La operación de perturbación logística se resolvió. Nuestros operativos han concluido su campaña contra los sistemas de distribución y cadena de suministro del adversario."
 cyber_sleeper_network_tracking_complete_tt: "Se resolvió el implante de la red del sueño. Nuestros equipos han incorporado herramientas de acceso persistentes dentro de las redes del adversario para la activación futura."
 cyber_deception_campaign_tracking_complete_tt: "La campaña de engaños se resolvió. Nuestros operativos han concluido su operación falsamente plana diseñada para engañar a los analistas de inteligencia del adversario."
 cyber_zero_day_strike_tracking_complete_tt: "Huelga de cero días resuelto. Nuestras unidades han ejecutado una explotación de alto impacto contra una vulnerabilidad no revelada en los sistemas críticos del adversario."
 cyber_network_hardening_active: "Redes endurecidas"
 cyber_network_hardening_active_desc: "Nuestros equipos de ciberseguridad han reforzado los sistemas de autenticación, recortado vulnerabilidades conocidas y canales de acceso crítico aislados. Los intentos de intrusión extranjera son considerablemente menos propensos a tener éxito mientras estas defensas permanecen en su lugar."
 cyber_counter_intrusion_active: "Sweep de la contraintrusión"
 cyber_counter_intrusion_active_desc: "Los analistas están buscando activamente la presencia extranjera en nuestras redes: peinar troncos, aislar procesos anómalos y eliminar implantes persistentes. La conciencia sobre la seguridad operacional se intensifica en todos los sistemas gubernamentales."
 cyber_attribution_hunt_active: "Atribución Hunt en curso"
 cyber_attribution_hunt_active_desc: "Los equipos forenses digitales están reconstruyendo caminos de ataque y catalogando las firmas del actor responsable. La inteligencia reunida afilará nuestras defensas e informará de una respuesta proporcional."
 MD_cyber.201.t: "Infiltración purgada"
 MD_cyber.201.d: "Nuestros equipos de contraintrusión han completado su barrido. Se han identificado y eliminado instrumentos de acceso exterior, implantes de vigilancia y puertas traseras persistentes. Nuestras redes están limpias."
 MD_cyber.201.a: "Buen trabajo. Mantente vigilante."
 MD_cyber.202.t: "Barrido completo: Redes claras"
 MD_cyber.202.d: "Nuestros equipos de contraintrusión han terminado su barrido de todos los sistemas críticos. No se detectaron herramientas de acceso extranjero ni implantes de vigilancia. Nuestras redes parecen seguras."
 MD_cyber.202.a: "Mantenga el reloj."
 MD_cyber.1.t: "Operación Sucesiva"
 MD_cyber.1.d: "Nuestros equipos cibernéticos ejecutaron con éxito la operación. No se dejó rastro atrás. El objetivo no tiene ninguna indicación de nuestra participación."
 MD_cyber.1.a: "Excelente trabajo."
 MD_cyber.2.t: "Intrusión extranjera detectada"
 MD_cyber.2.d: "Nuestros equipos de seguridad han identificado signos de una intrusión cibernética externa. Los atacantes enmascararon su origen con eficacia. No podemos determinar quién es responsable."
 MD_cyber.2.a: "endurecemos nuestras defensas."
 MD_cyber.3.t: "Ataque cibernético por [?disp_name_agressor.GetNameWithFlag]"
 MD_cyber.3.d: "Nuestros servicios de inteligencia han rastreado una reciente intrusión cibernética para [?disp_name_agressor.GetNameWithFlag]. El ataque fue deliberado y dirigido. Hemos presentado una protesta diplomática formal."
 MD_cyber.3.a: "Condena al agresor."
 MD_cyber.4.t: "Operación abortada"
 MD_cyber.4.d: "Nuestros equipos cibernéticos no pudieron establecer una posición confiable en los sistemas del objetivo. La operación fue abortada antes de que se pudiera tomar cualquier medida. Es necesaria una preparación adicional."
 MD_cyber.4.a: "Reagrupar y evaluar."
 MD_cyber.11.t: "Disrupción de señalización GPS"
 MD_cyber.11.d: "Las unidades militares están informando de deficiencias generalizadas en los sistemas de navegación por satélite. Los comandantes en el campo luchan por coordinarse eficazmente. Se sospecha que se ha producido un ataque de interrupción de la señal externa."
 MD_cyber.11.a: "Cambia a la navegación de respaldo."
 MD_cyber.12.t: "Redes financieras integradas"
 MD_cyber.12.d: "Los bancos, los intercambios y los procesadores de pagos están reportando fallos del sistema en cascada. La perturbación no es accidental. Nuestros analistas creen que los operativos extranjeros han apuntado nuestra infraestructura financiera."
 MD_cyber.12.a: "Aislar y contener el daño."
 MD_cyber.13.t: "Información Space Infiltrated"
 MD_cyber.13.d: "Las plataformas de redes sociales y las redes de noticias están siendo inundadas con una desinformación coordinada. La confianza pública en el gobierno está erosionando. Nuestros analistas creen que es una operación de influencia extranjera."
 MD_cyber.13.a: "Empezar una campaña contranarrativa."
 MD_cyber.14.t: "Infraestructura crítica bajo ataque"
 MD_cyber.14.d: "Las centrales eléctricas, los centros de transporte y los nodos de comunicaciones han sufrido fallos simultáneos. Los ingenieros reportan señales de sabotaje deliberado a través de nuestros sistemas de control. Esta es una escalada significativa."
 MD_cyber.14.a: "Declarar una emergencia nacional."
 MD_cyber.15.t: "Un ataque cibernético catastrófico"
 MD_cyber.15.d: "Todo sistema crítico en el país ha sido alcanzado simultáneamente: redes financieras, redes eléctricas, comunicaciones militares y cadenas de suministro. La escala y precisión del ataque son sin precedentes. La nación está lisiada."
 MD_cyber.15.a: "Movilizar todo lo que tenemos."
 MD_cyber.16.t: "Comunicaciones compromisadas"
 MD_cyber.16.d: "Los agentes extranjeros han penetrado en nuestros canales de comunicación cifrados. Es probable que un agente estatal hostil supervise las transmisiones sensibles."
 MD_cyber.16.a: "Inicie un bloqueo de comunicaciones."
 MD_cyber.17.t: "Redes Radar Disrupted"
 MD_cyber.17.d: "Nuestras redes de radar de defensa aérea están regresando lecturas falsas. Los contactos fantasma son operadores abrumadores. Los aviones enemigos pueden estar explotando la confusión."
 MD_cyber.17.a: "Cambiar a protocolos de detección de copia de seguridad."
 MD_cyber.18.t: "Operación de Influencia Extranjera Detectada"
 MD_cyber.18.d: "Evidencia ha surgido de una campaña coordinada de influencia extranjera dirigida a nuestro paisaje político interno. La desinformación se extiende a través de redes sociales y profundizando las divisiones públicas."
 MD_cyber.18.a: "Denunciar interferencia extranjera."
 MD_cyber.19.t: "Redes de investigación Breached"
 MD_cyber.19.d: "Se han robado datos de investigación clasificados y diseños industriales de nuestros laboratorios nacionales y contratistas de defensa. Todavía se está evaluando el alcance total del robo."
 MD_cyber.19.a: "Auditoría de todos los sistemas clasificados."
 MD_cyber.110.t: "Redes de comandos infiltradas"
 MD_cyber.110.d: "Nuestros canales de comunicación militar y diplomática han sido penetrados. Los agentes enemigos están interceptando órdenes y correspondencia sensible en tiempo real."
 MD_cyber.110.a: "Purge todos los canales comprometidos."
 MD_cyber.111.t: "Sistemas bancarios centrales bajo ataque"
 MD_cyber.111.d: "Nuestro banco central y la principal infraestructura de compensación financiera han sido objeto de ataques cibernéticos sostenidos. El procesamiento de transacciones se ha detenido y los mercados de divisas se están desestabilizando rápidamente."
 MD_cyber.111.a: "Declarar una emergencia financiera."
 MD_cyber.112.t: "Cadena de Suministros Militares"
 MD_cyber.112.d: "El software de mando y control que gestiona nuestra logística avanzada se ha estrellado en varios sectores. Unidades en el frente están reportando escasez de suministros como las cascadas de perturbación a través del sistema."
 MD_cyber.112.a: "Retrocedan los procedimientos de suministro manual."
 MD_cyber.113.t: "Intrusión persistente detectada"
 MD_cyber.113.d: "Nuestros servicios de seguridad han descubierto puntos de acceso incrustados profundamente dentro de la infraestructura crítica de red. Los implantes son sofisticados y probablemente han estado activos durante algún tiempo."
 MD_cyber.113.a: "Comience una auditoría completa de la red."
 MD_cyber.114.t: "Comando de Inteligencia Compromiso"
 MD_cyber.114.d: "Nuestros servicios de inteligencia han identificado una campaña sistemática de tráfico de señales fabricadas y comunicaciones falsas. Nuestros comandantes militares podrían haber estado actuando sobre información intoxicada deliberadamente."
 MD_cyber.114.a: "Establecer un equipo de tareas de verificación de señales."
 MD_cyber.115.t: "Huelga de cero días"
 MD_cyber.115.d: "Un ataque cibernético de precisión devastador ha alcanzado simultáneamente nuestros sistemas más críticos utilizando exploits desconocidos anteriormente. Los sistemas de control industrial, la infraestructura eléctrica y las redes de defensa han sido afectados."
 MD_cyber.115.a: "Activar protocolos nacionales de emergencia cibernética."
 cyber_propaganda_ops_malus: "Información Space Infiltrated"
 cyber_propaganda_ops_malus_desc: "Una campaña coordinada de desinformación extranjera está degradando activamente la confianza pública en nuestro gobierno e instituciones, suprimiendo la producción política y socavando la cohesión nacional."
 cyber_gps_jamming_malus: "Sistemas de GPS disrupted"
 cyber_gps_jamming_malus_desc: "Los ciberfuncionarios extranjeros han puesto en peligro nuestra infraestructura militar de navegación por satélite, la coordinación de los contingentes y la sensibilización sobre el campo de batalla gravemente degradantes."
 cyber_economic_disruption_malus: "Redes financieras integradas"
 cyber_economic_disruption_malus_desc: "Una campaña cibernética extranjera sostenida está degradando nuestros sistemas bancarios, redes de pago y producción industrial. La recuperación económica tomará tiempo."
 cyber_infrastructure_damage_malus: "Daños por infraestructura"
 cyber_infrastructure_damage_malus_desc: "Los ciberataques extranjeros han causado daños significativos a nuestra infraestructura crítica, lo que dificulta la logística, la construcción y la distribución de suministros."
 cyber_critical_strike_malus: "Un ataque cibernético catastrófico"
 cyber_critical_strike_malus_desc: "Un devastador ataque cibernético de espectro completo ha incriminado nuestra base industrial, comunicaciones y cadena de suministro simultáneamente. La recuperación será larga y dolorosa."
 cyber_sigint_surveillance_malus: "Comunicaciones bajo vigilancia"
 cyber_sigint_surveillance_malus_desc: "Los agentes extranjeros han penetrado en nuestra infraestructura de comunicaciones cifrada. Es probable que se supervisen las transmisiones sensibles, lo que dificulta la adopción de medidas políticas coordinadas."
 cyber_radar_spoofing_malus: "Red Radar Compromisada"
 cyber_radar_spoofing_malus_desc: "Agentes cibernéticos extranjeros están alimentando falsos retornos a nuestras redes de radar de defensa aérea, degradando las capacidades de detección e interceptación."
 cyber_election_interference_malus: "Campaña de influencia extranjera activa"
 cyber_election_interference_malus_desc: "Una campaña coordinada de desinformación extranjera está erosionando la confianza pública y profundizando las divisiones políticas nacionales."
 cyber_industrial_espionage_malus: "Redes de investigación Breached"
 cyber_industrial_espionage_malus_desc: "Los datos de investigación clasificados y los diseños industriales han sido robados de nuestros laboratorios nacionales y contratistas de defensa, estableciendo nuestros programas de desarrollo."
 cyber_comms_intercept_malus: "Redes de comandos integradas"
 cyber_comms_intercept_malus_desc: "Nuestras comunicaciones militares y diplomáticas han sido penetradas. La seguridad operacional se degrada y la coordinación está sufriendo."
 cyber_financial_system_attack_malus: "Infraestructura financiera bajo ataque"
 cyber_financial_system_attack_malus_desc: "Un asalto sostenido a nuestra infraestructura central de banca y pagos ha causado fallos en cascada en toda la economía."
 cyber_logistics_disruption_malus: "Cadena de Suministros Militares"
 cyber_logistics_disruption_malus_desc: "El software de mando y control que gestiona nuestra logística avanzada ha sido comprometido. Las unidades en el frente están experimentando escasez de suministros."
 cyber_sleeper_network_malus: "Intrusión de red persistente"
 cyber_sleeper_network_malus_desc: "Los agentes extranjeros han incorporado puntos de acceso inactivos dentro de nuestras redes críticas, manteniendo un acceso persistente a sistemas sensibles de bajo nivel."
 cyber_deception_campaign_malus: "Inteligencia del Comando envenenada"
 cyber_deception_campaign_malus_desc: "Nuestros comandantes han estado actuando en tráfico de señales fabricadas y comunicaciones falsas. La coordinación militar y la sensibilización sobre la situación se degradan gravemente."
 cyber_zero_day_strike_malus: "Huelga de cero días"
 cyber_zero_day_strike_malus_desc: "Una huelga de precisión devastadora usando exploits clasificados de día cero ha alcanzado simultáneamente nuestros sistemas industriales e de infraestructura más críticos."
 upgrade_establish_cyber_operations_division: "División de Operaciones Informáticas"
 upgrade_establish_cyber_operations_division_desc: "Establecer una división dedicada a las operaciones cibernéticas dentro de la agencia, proporcionando la capacidad fundamental para la guerra digital básica. Esta división desbloqueará la capacidad para llevar a cabo §YCyber Warfare§! operaciones."
 upgrade_offensive_cyber_operations: "Ofensiva Cyber Warfare"
 upgrade_offensive_cyber_operations_desc: "Ampliar la división con herramientas de amenazas persistentes avanzadas y investigación de explotación de cero días, permitiendo operaciones más sofisticadas."
 upgrade_cyber_warfare_operational_planning: "Comando Cibernético Full-Spectrum"
 upgrade_cyber_warfare_operational_planning_desc: "Evoque la división en un comando cibernético totalmente integrado capaz de coordinar operaciones multi-vector complejas contra objetivos endurecidos."
 upgrade_defensive_cyber_operations: "Operaciones cibernéticas en defensa"
 upgrade_defensive_cyber_operations_desc: "Construye un equipo defensivo dedicado que se especializa en endurecer nuestras propias redes, detectar intrusiones y oscurecer nuestra huella digital."
 upgrade_cyber_elite: "Arsenal de cero días"
 upgrade_cyber_elite_desc: "Desarrollar y almacenar un arsenal clasificado de explotaciones de cero días de élite capaces de penetrar incluso los sistemas más endurecidos del mundo."
 cyber_offense_power_modifier: "Ofensiva Cyberwarfare"
 cyber_offense_power_modifier_desc: "El valor que determina lo fuerte que son nuestras operaciones ofensivas de ciberguerra."
 cyber_defense_rating_modifier: "Defensivo Cyberwarfare"
 cyber_capability_modifier: "Capacidad de Cyberwarfare"
 cyber_attribution_bonus_modifier: "Bono de atribución cibernética"
