 cyber_comms_intercept_tracking_desc: "Nuestros equipos de señales han penetrado el gobierno del objetivo y los canales de comunicación diplomática. Estamos monitoreando su tráfico y extrayendo inteligencia procesable en tiempo real."
 cyber_financial_system_attack_tracking: "Ataque del sistema financiero activo"
 cyber_financial_system_attack_tracking_desc: "Nuestros operativos han desplegado cargas de pago destructivas dirigidas a la infraestructura central de banca y procesamiento de pagos del objetivo, estrangulando su capacidad para realizar operaciones comerciales y financiar operaciones estatales. La operación funcionará durante aproximadamente 150 días."
 cyber_logistics_disruption_tracking: "Disrupción logística militar activa"
 cyber_logistics_disruption_tracking_desc: "Estamos degradando activamente el software militar de mando y control y gestión de la cadena de suministro del objetivo, lo que dificulta sus ciclos de reaprovisionamiento y refuerzo. La operación concluirá dentro de los 90 días."
 cyber_sleeper_network_tracking: "Red de Durmientes Activada"
 cyber_sleeper_network_tracking_desc: "Hemos establecido un acceso persistente y pre-posicionado dentro de las redes críticas del objetivo. Esta posición permite operaciones futuras más rápidas y baratas durante todo el tiempo que no se haya detectado, hasta un año."
 cyber_deception_campaign_tracking: "Campaña de engaño estratégico activa"
 cyber_deception_campaign_tracking_desc: "Se está llevando a cabo una operación coordinada de engaño multi-vector: se están implementando comunicaciones esporádicas, filtraciones de inteligencia fabricadas y operaciones de influencia encubierta para manipular la toma de decisiones del objetivo a los niveles más altos. La campaña durará aproximadamente 180 días."
 cyber_zero_day_strike_tracking: "Strike de cero días: Aftermath"
 cyber_zero_day_strike_tracking_desc: "Nuestro arsenal de cero días fue desplegado en una huelga destructiva de precisión contra los sistemas más críticos del objetivo. La operación está completa; esta entrada expirará a medida que el caos inicial disminuya."
 cyber_op_slot_0_network_hardening_tracking: "Red Hardening Underway"
 cyber_op_slot_0_network_hardening_tracking_desc: "Nuestros equipos de ciberseguridad realizan un endurecimiento integral de nuestra infraestructura de red crítica: refuerzan los sistemas de autenticación, parchean vulnerabilidades y aíslan los canales de acceso sensibles. El trabajo concluirá en unos 120 días."
